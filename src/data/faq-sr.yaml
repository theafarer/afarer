- id: sup-oem-process
  question: 'Какав је OEM производни процес за private label надуване SUP даске?'
  answer: 'OEM процес: 1) Спецификација и дизајн-бриф — поделите циљане спецификације, CAD цртеже или референтни производ. 2) 3D прототипирање калупа — прилагођени алуминијумски и композитни калупи дизајнирани унутар компаније. 3) Избор материјала и узорак — војни PVC са прилагођеним бојама и поставком логотипа. 4) CE аудиторска провера фабрике и усаглашеност — свака наруџбина укључује CE декларацију, ISO 9001 следивост и BSCI извештај. 5) Серијска производња са QC листом провере од 100 тачака. 6) FOB Qingdao испорука са комплетном извозном документацијом. Време испоруке 30-45 дана, MOQ 50 јединица (стандардни SUP).'
  category: ordering

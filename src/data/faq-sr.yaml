  relatedGuides: []

- id: sup-inflatable-durability
  question: 'Колико трају надуване SUP даске уз правилно одржавање?'
  answer: 'Уз правилно одржавање, квалитетна надувана SUP даска траје 5-10 година редовне рекреативне употребе. Војни трослојни PVC са UV отпорним премазом — какав се користи у свим afarer даскама — одолева оштећењима од сунца, корозији од слане воде и абразији. Кључни чиниоци дуговечности: испирање свежом водом након сваке употребе, темељно сушење пре чувања, држање ван директних UV зрака када се не користи, чување делимично надуване даске на хладном и сувом месту и избегавање вучења по грубим површинама. Drop-stitch конци и шавови по правилу су прва тачка отказа, а не сама PVC тканица.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-maintenance
    - inflatable-sup-storage
    - inflatable-sup-repair

- id: sup-choppy-water
  question: 'Како веслати на SUP дасци у таласима или ветру?'
  answer: 'У таласима: савијте колена, заузмите шири став, скратите замах весла и активирајте стомачне мишиће ради равнотеже. Код ветра у лице: користите нижи угао весла, узимајте краће замахе и наклоните се напред. Код бочног ветра: веслајте на наветринској страни да исправите скретање. Код ветра у леђа: сурфујте на таласима ради брзине. Почетници треба да избегавају ветрове јаче од 10 mph и да бирају шире и дуже даске ради стабилности. afarer Ocean Voyager туринг SUP даска дизајнирана је да поднесе умерене таласе и ветровне услове.'
  category: safety
  relatedProducts:
    - sup-ocean-voyager
    - sup-explorer-11

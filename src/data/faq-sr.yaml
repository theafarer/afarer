    - wind-conditions-sup

- id: sup-sustainability
  question: 'Да ли су надуване SUP даске еколошки одрживе?'
  answer: 'Надуване SUP даске имају мањи еколошки отисак од чврстих дасака на више начина: користе мање сировина у производњи, њихова мања тежина смањује емисије при транспорту, а њихова трајност значи мање замена током времена. PVC који се користи у afarer даскама не садржи олово и у складу је са REACH. Кључне праксе одрживости: купите квалитетну даску која траје 5-10 година, поправљајте пробоје уместо замене, рециклирајте даску на крају животног века кроз специјализоване програме рециклаже PVC-а и избегавајте једнократно паковање бирајући брендове који користе вишекратне торбе за ношење.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []

- id: b2b-moq
  question: 'Која је минимална количина наручивања за OEM/ODM SUP производњу?'
  answer: 'Минималне количине наручивања (MOQ) разликују се према врсти производа. Прилагођено брендирање модела са залиха: 50 јединица по SKU. Развој калупа за прилагођени облик: 200–500 јединица по моделу (прва наруџбина). Програми дељења калупа доступни од 50 јединица. Опрема и спасилачки прслуци: 500–1000 јединица по дизајну. Контактирајте наш OEM тим са планираном количином ради прецизних MOQ вредности и цена.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

- id: b2b-lead-time
  question: 'Која су уобичајена времена испоруке за OEM SUP наруџбине?'
  answer: 'Прве OEM наруџбине са прилагођеним брендирањем на постојећим калупима: 6–8 недеља од депозита до FOB Qingdao. Наруџбине прилагођеног облика које захтевају нове калупе: 12–20 недеља (укључује 3D дизајн, израду калупа, прототипирање и серијску производњу). Понављане наруџбине са одобреним спецификацијама: 6–8 недеља. Хитне наруџбине могу бити убрзане на 4–5 недеља за постојеће калупе. Времена испоруке укључују набавку сировина, производњу, QC током производње и утовар контејнера.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

- id: b2b-certification
  question: 'Које сертификате имају afarer OEM производи?'
  answer: 'Сви afarer OEM/ODM производи носе: CE декларацију о усаглашености (тржиште ЕУ), UKCA (тржиште Велике Британије), ISO 9001:2015 систем управљања квалитетом, BSCI аудит друштвене усаглашености, REACH и RoHS усаглашеност материјала, EN ISO 25649 класификацију за надуване SUP даске. Додатни сертификати доступни на захтев: документација о усаглашености са захтевима US Coast Guard, тестирање по војном стандарду (MIL-STD-810) и подршка при сертификацији увоза за земљу дестинације.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

- id: b2b-samples
  question: 'Могу ли наручити узорке пре серијске производње?'
  answer: 'Да. Наруџбине узорака доступне су за све OEM/ODM пројекте. Предпроизводни узорци (PPS) израђују се након израде калупа и пре серијске производње. Време испоруке узорка: 15–25 радних дана за постојеће калупе, 25–40 радних дана за прилагођене калупе. Трошкови узорка одбивају се од прве серијске наруџбине. Узорци се шаљу експресним куриром (DHL, FedEx, UPS) уз потпуно праћење пошиљке и по правилу стижу за 3–5 радних дана.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

- id: b2b-payment
  question: 'Који услови плаћања су доступни за OEM наруџбине?'
  answer: 'Стандардни услови плаћања: 30% депозит уз потписан PI (проформа фактура), 70% остатак пре испоруке, против копије B/L (теретница). За нове партнере: 50% депозит, 50% пре испоруке. За етаблиране партнере са историјатом наруџбина: L/C по виђењу или плаћање у року од 30 дана за квалификоване рачуне (подлеже кредитној провери). Начини плаћања: T/T жични пренос, L/C (акредитив), Western Union. Сва плаћања у USD или EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

- id: b2b-ip-protection
  question: 'Како afarer штити моју интелектуалну својину и дизајне?'
  answer: 'Заштита интелектуалне својине кључни је део наше OEM услуге. Потписујемо NDA пре сваког разговора о дизајну. Датотеке дизајна обрађују се на изолованим радним станицама уз евиденцију приступа. Сви алати и калупи остају искључиво ваше власништво (које ви плаћате). Нећемо користити ваше калупе или дизајне за друге клијенте. Чување и одржавање калупа укључени су за активне рачуне. По раскиду уговора, калупи се или шаљу вама или уништавају уз видео документацију. Поштујемо сва права жигова и патената.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

- id: b2b-shipping
  question: 'Које опције испоруке и логистике су доступне?'
  answer: 'FOB Qingdao (стандардно): терет се утоварује у луци Qingdao; ви одатле организујете превоз. CIF (именована лука): ми организујемо и осигуравамо испоруку до ваше луке дестинације. DDP / од врата до врата: логистика пуне услуге, укључујући царинске формалности и коначну испоруку. Поморски терет до западне обале САД: приближно 25–30 дана. Поморски терет до ЕУ (Hamburg/Rotterdam): приближно 30–35 дана. Ваздушни терет доступан је за хитне наруџбине (3–5 дана). Обрађујемо сву извозну царинску документацију, сертификате о пореклу и пакинг-листе.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

- id: b2b-quality-control
  question: 'Који процеси контроле квалитета важе за OEM наруџбине?'
  answer: 'Свака OEM наруџбина прати документован QC план: 1) Контрола улазних материјала — испитивање серија PVC тканице на дебљину, затезну чврстоћу и UV отпорност. 2) QC током производње — испитивање чврстоће заварених шавова на сваких 50 јединица, тест издржавања притиска на 1.25x номинални PSI. 3) Завршна контрола — 100% визуелни преглед и тестирање притиска сваке даске. 4) AQL узорковање — узорковање серија према ISO 2859, са прихватањем критичних грешака = 0. 5) Инспекција треће стране — SGS, Bureau Veritas или Intertek, на трошак купца.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

- id: b2b-custom-packaging
  question: 'Можете ли креирати прилагођено паковање за мој бренд?'
  answer: 'Да. Нудимо потпуне услуге прилагођеног паковања: малопродајне кутије са четворобојном CMYK штампом и графиком бренда, торбе за ношење са штампаним или извезеним логотипима, упутства за употребу на вашем језику, етикете за качење и баркод/UPC налепнице, као и унутрашње паковање (полиетиленске кесе, уметци од пене). Минимални MOQ за паковање: 500–1000 јединица за прилагођене кутије, 200–500 за торбе за ношење. Услуга дизајна паковања укључена је у OEM наруџбине.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

- id: b2b-factory-audit
  question: 'Могу ли посетити фабрику или организовати аудит треће стране?'
  answer: 'Посете фабрици добродошле су уз претходан договор. Примићемо власнике брендова током целе године и можемо организовати дочек на аеродрому Qingdao Jiaodong International Airport (TAO). За купце који не могу да дођу, нудимо: виртуелни обилазак фабрице путем видео позива, координацију аудита треће стране са SGS/Bureau Veritas (купац сноси трошак аудита) и детаљан пакет документације о могућностима фабрике, укључујући списак опреме, QC процесни ток и квалификације особља.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

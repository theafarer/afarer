- id: sup-weight-capacity
  question: 'Колики терет може да издржи надувана SUP даска?'
  answer: 'Носивост зависи од запремине даске. afarer даске: SUP Explorer 11 (260L, до 100 kg / 220 lbs), Ocean Voyager 12 (310L, до 140 kg / 308 lbs), Leviathan Wake (350L, до 180 kg / 396 lbs). За оптималне перформансе држите укупни терет (веслач + опрема) у оквиру 80% максималне носивости. Даска плови више на води и боље држи правац када није преоптерећена, посебно у таласима.'

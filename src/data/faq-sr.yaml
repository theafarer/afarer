- id: sup-learning
  question: 'Да ли је тешко научити SUP?'
  answer: 'Ни најмање. Већина почетника устаје и весла већ током прве сесије. Наша All-Around SUP серија поседује посебно широке и стабилне платформе, дизајниране управо за оне који први пут веслају. Започните на мирној води и већ за неколико минута ћете крстарити.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide

- id: ocean-use
  question: 'Могу ли да је користим у океану?'
  answer: 'Да. afarer SUP даске направљене су за употребу у океану, на језерима и рекама. Наша Touring серија подноси обалске таласе, а све даске користе морски PVC отпоран на корозију од слане воде. Након употребе у океану исперите даску свежом водом.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions

- id: inflation-time
  question: 'Колико времена је потребно за надувавање?'
  answer: 'Помоћу укључене двоструке пумпе, већина даски се надува до 12–15 PSI за мање од 5 минута. Наша опција електричне пумпе скраћује то време на мање од 2 минута. Издувавање и паковање трају око 3 минута.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance

- id: travel-sup
  question: 'Могу ли да путујем са надуваном SUP даском?'
  answer: 'Свакако. Свака afarer даска пакује се у торбу величине ранице која испуњава захтеве авио-компанија за пртљаг. Са свега 18–22 lbs, лако је носити на плажу, до језера или кроз аеродромске терминале.'
  category: general
  relatedProducts: []
  relatedGuides: []

- id: weight-limit
  question: 'Која је граница носивости?'
  answer: 'Наше All-Around SUP даске подржавају терет до 220 lbs. Серије Touring и Yoga подржавају терет до 250 lbs. За тандемску употребу или теже терете контактирајте наш тим ради препорука.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs

- id: box-contents
  question: 'Шта се налази у кутији?'
  answer: 'Сваки afarer SUP укључује даску, ранац за путовање, ручну двоструку пумпу, сменљиву перају, спирални leash и комплет за поправку. Неки модели такође нуде опцију надоградње на весло од карбона.'
  category: product
  relatedProducts: []
  relatedGuides: []

- id: bundle-deals
  question: 'Да ли нудите пакетске понуде?'
  answer: 'Да. Нудимо пажљиво одабране сетове који вам штеде новац у односу на куповину производа појединачно. Контактирајте наш продајни тим за актуелне промоције сетова и ценовнике са попустима за веће количине.'
  category: ordering
  relatedProducts: []
  relatedGuides: []

- id: pfd-requirement
  question: 'Да ли ми је потребан спасилачки прслук на SUP дасци?'
  answer: 'Да. Многа законодавства прописују обавезан спасилачки прслук на сваком пловилу, укључујући SUP даске. Чак и тамо где није обавезан, спасилачки прслук са CE сертификатом кључна је безбедносна опрема. Препоручујемо да га носите током целог боравка на води.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips

- id: boat-registration
  question: 'Да ли морам да региструјем своју SUP даску?'
  answer: 'Захтеви се разликују у зависности од државе и надлежности. У већини региона SUP даске без мотора не захтевају регистрацију. Ако планирате да додате мотор, проверите посебна правила код надлежног поморског органа. Рекреативне даске за веслање по правилу су изузете од регистрације пловила.'
  category: general
  relatedProducts: []
  relatedGuides: []

- id: puncture-repair
  question: 'Како поправити пробој?'
  answer: 'Очистите оштећено место, исеците закрпу са заобљеним угловима, нанесите PVC лепак, чврсто притисните и сачекајте 24 сата пре надувавања. afarer даске укључују комплет за поправку. Детаљна упутства потражите у нашем водичу за поправку надуваних дасака.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance

- id: storage
  question: 'Како треба да чувам своју надувану SUP даску?'
  answer: 'Исперите је свежом водом, потпуно осушите, потпуно издувајте, лабаво уваљајте почевши од носа и чувајте у торби за ношење, на хладном и сувом месту, даље од директног сунца. Никада не чувајте мокру даску нити је чувајте на екстремним температурама.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance

- id: sup-vs-hard
  question: 'Надувана или чврста SUP даска?'
  answer: 'Надуване даске нуде преносивост, лако чување и апсорпцију удараца. Чврсте даске нуде максималну крутост и брзину. За већину рекреативних корисника, квалитетна надувана даска са drop-stitch језгром практичан је избор.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup

- id: wind-safety
  question: 'Која брзина ветра је превисока за SUP?'
  answer: 'Почетници: преко 10 mph (8 чворова). Средњи ниво: преко 15 mph (13 чворова). Напредни: преко 20 mph (17 чворова). Ако сте у недоумици, не излазите на воду. Ветар који дува са копна према мору опасан је на сваком нивоу вештине.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips

- id: warranty
  question: 'Шта обухвата afarer гаранција?'
  answer: 'Сви afarer производи обухваћени су свеобухватном произвођачком гаранцијом. SUP даске покривене су гарантним роком од 2+ године против произвођачких грешака. Гаранција покрива грешке у материјалима и изради при нормалној употреби.'
  category: warranty
  relatedProducts: []
  relatedGuides: []

- id: warranty-claim
  question: 'Како поднети гарантни захтев?'
  answer: 'Захтев поднесите тако што ћете контактирати наш тим подршке, уз број поруџбине, фотографије проблема и кратак опис. Већина захтева разматра се у року од 2 радна дана. Одобрени захтеви добијају замену или упутство за поправку у року од неколико дана.'
  category: warranty
  relatedProducts: []
  relatedGuides: []

- id: shipping-info
  question: 'Колико траје испорука?'
  answer: 'Наруџбине производа са залиха шаљу се у року од 2–4 радна дана. Домаће наруџбине у САД стижу за 5–10 радних дана. Међународне наруџбине стижу за 10–15 радних дана, у зависности од дестинације. Хитне наруџбине могу бити убрзане.'
  category: shipping
  relatedProducts: []
  relatedGuides: []

- id: return-policy
  question: 'Која је ваша политика поврата?'
  answer: 'Прихватамо поврате у року од 30 дана од испоруке, за некоришћене производе у оригиналном паковању. Прилагођене/OEM наруџбине не подлежу поврату. Контактирајте наш тим подршке ради покретања поврата — обезбеђујемо унапред плаћену транспортну етикету.'
  category: ordering
  relatedProducts: []
  relatedGuides: []

- id: oem-odm
  question: 'Да ли нудите OEM/ODM услуге?'
  answer: 'Да. Нудимо услуге private label и прилагођеног дизајна за предузећа. Од прилагођеног брендирања постојећих модела до потпуно прилагођених дизајна трупа, наш инжењерски тим може развити производе под вашим брендом. Важе минималне количине наручивања.'
  category: ordering
  relatedProducts: []
  relatedGuides: []

- id: paddle-length
  question: 'Која дужина весла ми је потребна?'
  answer: 'Весло треба да буде за 6–8 инча више од ваше висине. Подесива весла омогућавају фино подешавање за различите услове. Детаљно одређивање величине потражите у нашем водичу за весла.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle

- id: material-difference
  question: 'Која је разлика између једнослојних и вишеслојних PVC SUP дасака?'
  answer: 'Једнослојне PVC даске су лагане и економичне, али мање круте при високом притиску. Двослојне и фузијски ламиниране конструкције додају крутост, отпорност на пробоје и трајност. Војни PVC са UV отпорним премазом нуди најбољи однос трајности и тежине за рекреативну SUP употребу. afarer користи трослојни ламинирани PVC у свим ценовним класама производа.'
  category: product
  relatedProducts: []
  relatedGuides: []

- id: sup-width-stability
  question: 'Која ширина SUP даске је најбоља за стабилност?'
  answer: 'За почетнике, ширина од 33–34 инча пружа најбољи однос стабилности и лакоће веслања. Даске уже од 32 инча новим веслачима делују превише нестабилно. afarer SUP Explorer 11, ширине 33 инча, идеалан је за учење.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide

- id: sup-volume-weight
  question: 'Како изабрати запремину SUP даске према својој тежини?'
  answer: 'Помножите своју тежину у kg са 2.2 и добићете погодну циљну запремину за почетнике. На пример, веслачу тежине 75 kg потребно је најмање 165 литара, али је 220–260 литара знатно стабилније за учење. SUP Explorer 11 нуди 260 литара и погодан је за веслаче до 100 kg.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide

- id: afarer-vs-others
  question: 'Како се afarer пореди са другим брендовима?'
  answer: 'afarer нуди најбољу вредност у опреми за надуване водене спортове. У поређењу са Red Paddle Co, afarer пружа 90% перформанси по 60% цене. У поређењу са iRocker, afarer користи квалитетнији трослојни војни PVC и више PSI вредности. У поређењу са Bluefin, afarer нуди супериорније спецификације материјала. За већину рекреативних веслача, afarer пружа најбољи однос квалитета и цене.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - best-surf-gear-brands-compared
    - afarer-vs-red-paddle
    - afarer-vs-irocker
    - afarer-vs-bluefin

- id: fishing-sup-setup
  question: 'Могу ли да рибарим са SUP даске?'
  answer: 'Да. SUP риболов је све популарнији јер стојећи положај пружа одличан увид у воду. Изаберите даску дужине најмање 11 стопа и ширине 33–34 инча ради стабилности. Додајте пластичну кутију са држачима штапова причвршћену за еластичне траке на палуби, мало сидро, и увек носите спасилачки прслук. afarer SUP Explorer 11 врло добро служи за рекреативни риболов.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide

- id: sup-yoga
  question: 'Могу ли да вежбам јогу на SUP дасци?'
  answer: 'Свакако. SUP јога спаја традиционалне положаје са изазовом плутајуће платформе и активира дубље стабилизационе мишиће. Користите даску ширине 33 инча или више, са меком, антисклизном подлогом на палуби. Вежбајте на мирној, плиткој води, уз сидро. Започните основним положајима попут пса окренутог надоле, ратника II и положаја дрвета. SUP Explorer 11, са потпуном EVA подлогом на палуби, одлично одговара.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide

- id: airline-travel-sup
  question: 'Која су правила авио-компанија за путовање са надуваном SUP даском?'
  answer: 'Већина авио-компанија прихвата SUP ранице као пријављени пртљаг ако је тежина испод 23–32 kg. afarer ранац је димензија приближно 90x40x30 cm и тежи око 15 kg испакован. Неке авио-компаније могу наплатити додатне таксе за прекомеран пртљаг. Стигните на аеродром раније, умотајте пераје и пумпу посебно у ручни пртљаг и означите торбу као крхку. Увек проверите политику авио-компаније о спортској опреми пре лета.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide

- id: cold-weather-safety
  question: 'Која ми је безбедносна опрема потребна за веслање на хладној води?'
  answer: 'Вода испод 15°C захтева топлотну заштиту. За 8–14°C користите неопренско или суво одело, уз чизме, рукавице и капуљачу. За 14–20°C довољно је неопренско одело дебљине 3/2mm. Увек носите правилно подешен спасилачки прслук ради топлотне заштите и безбедности. Проверите локалне прописе о обавезној опреми.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide

- id: oem-odm-details
  question: 'Које су минималне количине наручивања за OEM/ODM?'
  answer: 'Минималне количине наручивања (MOQ) разликују се у зависности од врсте производа и сложености. Прилагођено брендирање постојећих модела по правилу захтева 5–10 јединица. Потпуно прилагођени дизајни трупа захтевају веће MOQ. Контактирајте наш продајни тим са својим захтевима ради детаљне понуде. Обрађујемо све — од прилагођених боја и логотипа до потпуно оригиналних дизајна калупа.'
  category: ordering
  relatedProducts: []
  relatedGuides: []

- id: oem-custom-branding
  question: 'Могу ли ставити свој логотип на afarer производе?'
  answer: 'Да. Наша OEM услуга укључује прилагођену поставку логотипа, прилагођене комбинације боја и прилагођено паковање. Нудимо опције тампон штампе, топлотног преноса и веза, у зависности од врсте производа. Пошаљите своју графику и спецификације нашем продајном тиму ради понуде и процене времена испоруке.'
  category: ordering
  relatedProducts: []
  relatedGuides: []

- id: sup-inflate-pressure
  question: 'До колико PSI треба да надувам своју SUP даску?'
  answer: 'За најбоље перформансе надувајте даску до номиналног максималног PSI — типично 15–18 PSI за квалитетне надуване SUP даске. afarer SUP Explorer 11 најбоље ради при 15–18 PSI. Недовољно надувавање чини да се даска осећа меком и лоше држи правац. Надувавање изнад номиналног максимума ризикује оштећење drop-stitch конаца. Специфичну вредност за вашу даску проверите на налепници уз вентил.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide

- id: sup-deck-pad-care
  question: 'Како чистити и одржавати EVA подлогу на палуби?'
  answer: 'Исперите подлогу на палуби свежом водом након сваке сесије. За прљавштину или мрље користите благ сапун и меку четку — избегавајте агресивне хемикалије. Ако ивице почну да се одижу, нанесите малу количину водонепропусног морског лепка и притисните уз терет у трајању од 24 сата. Држите даску ван директних UV зрака када се не користи, како бисте спречили деградацију подлоге.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance

- id: sup-seated-paddling
  question: 'Могу ли веслати на SUP дасци у седећем положају?'
  answer: 'Да. Многе SUP даске, укључујући afarer Explorer 11, имају D-прстенове који омогућавају причвршћивање седишта. Веслање у седећем положају пружа удобну опцију за дуже путеве, риболов или када желите да промените положај на води.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []

- id: saltwater-rinse
  question: 'Да ли треба да исперем надувану даску након употребе у океану?'
  answer: 'Да — увек исперите даску, пераје, пумпу и весло свежом водом након употребе у сланој води. Кристали соли продиру у шавове и вентиле, изазивајући микропропусте и корозију. Осушите даску у сенци пре издувавања и чувања. Редовно испирање знатно продужава животни век надуване даске.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance

- id: sup-leash-necessity
  question: 'Да ли ми заиста треба leash за SUP?'
  answer: 'Да — увек носите leash. Спирални SUP leash везује се за чланак или лист и држи даску уз вас ако паднете. На отвореној води leash може вам спасити живот тако што спречава одвајање од плутајућег спасилачког средства. За веслање на реци користите leash са брзим отпуштањем, како бисте избегли заробљавање.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide

- id: drop-stitch-technology
  question: 'Шта је drop-stitch технологија језгра и зашто је важна?'
  answer: 'Drop-stitch технологија језгра користи хиљаде полиестерских конаца који повезују горњи и доњи слој PVC даске. Када се надува до 15-20 PSI, ти конци стварају круту структуру отпорну на увијање, која се понаша као чврста даска. afarer користи војни трослојни PVC са drop-stitch ламинацијом у свим класама SUP производа, пружајући крутост упоредиву са епоксидним даскама, уз задржану преносивост надуване даске.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup

- id: sup-inflatable-vs-rigid
  question: 'Надувана или чврста SUP даска: која је боља за различите намене?'
  answer: 'Надуване SUP даске истичу се у преносивости, чувању и апсорпцији удараца — идеалне су за путовање, почетнике и рекреативну употребу. Чврсте епоксидне даске нуде максималну брзину и клизање за трке и сурфовање. За 90% веслача, квалитетна надувана даска са drop-stitch језгром (15-20 PSI) пружа довољну крутост за туре, фитнес, јогу и риболов. afarer надуване даске достижу перформансе чврстих дасака средњег ранга, а упаковују се у ранац.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-vs-hard-board
    - how-to-choose-inflatable-sup

- id: sup-skill-progression
  question: 'Какав је типичан напредак SUP вештина од почетника до напредног нивоа?'
  answer: 'Почетник (1-3. сесија): устајање, основни замах напред, скретање, безбедно падање. Средњи ниво (5-15. сесија): ефикасна техника замаха, окрети на месту, кретање кроз таласе, основне вештине спасавања. Напредни (20+ сесија): тркачки стартови, окрети око пловка, сурфовање малих таласа, веслање уз ветар у леђа. Професионални ниво: такмичарске трке, surf SUP, туре на велике даљине. afarer даске подржавају сваку фазу: Explorer 11 за почетнике, Ocean Voyager за туре и Cheetah Surge за перформансно веслање.'
  category: general
  relatedProducts:

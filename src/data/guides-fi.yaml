- slug: sup-fitness
  category: lifestyle
  title: 'SUP-kuntoilu: Koko kehon harjoittelu vedessä'
  description: Miten lautamelonta kehittää keskivartalon voimaa, tasapainoa ja kestävyyttä.
  tldr: SUP aktivoi keskivartalon, jalat, selän ja hartiat jokaisessa vedossa. Tunnin melonta polttaa 300-500 kaloria. Vastatuuleen tai virtaa vastaan melonta kaksinkertaistaa tehon. SUP-jooga lisää liikkuvuutta ja tasapainoharjoittelua.
  problem: Moni pitää lautamelontaa rentona harrastuksena eikä oikeana kuntoiluvälineenä, jolloin sen koko kehon harjoitteluun tarjoama potentiaali jää hyödyntämättä.
  solution: 'Rakenna SUP-harjoituksille tarkat kuntotavoitteet: kestävyysmelonta kuntoa varten, intervallisprintit tehoa varten, SUP-jooga liikkuvuutta varten ja matkamelonta lihaskuntoa varten.'
  audience: Kunnostaan kiinnostuneet, jotka etsivät matalan iskuvaikutuksen ja vahvan sitoutumisen koko kehon harjoittelua.
  steps:
    - Lämmittele maissa — käsien ympyräliikkeet, vartalon kiertoja ja jalkojen heilautuksia 5 minuutin ajan
    - Aloita 10 minuutin tasaisella melonnalla keskiteholla
    - Siirry intervalliharjoitteluun — 2 minuutin kova melonta, 2 minuutin kevyt palautuminen
    - Sisällytä SUP-jooga-asentoja — alaspäin katsova koira, sotilas II ja puuasento laudalla
    - Loppuverryttely kevyellä melonnalla ja staattisilla venytyksillä laudalla
  faq:
    - q: Onko SUP kuntoilussa juoksemista parempi?
      a: SUP antaa samankaltaisen sydän- ja verisuonihyödyn pienemmällä nivelkuormalla. Se aktivoi myös ylävartaloa ja keskivartaloa enemmän kuin juokseminen.
    - q: Paljonko SUP polttaa kaloreita?
      a: Noin 300-500 kaloria tunnissa keskiteholla. Kilpailut tai vastatuulimelonta voivat polttaa 600-800 kaloria tunnissa.
    - q: Voinko rakentaa lihaksia SUP:lla?
      a: Voit. Melonta vahvistaa hartioita, selkää ja keskivartalon lihaksia. Tasapainon ylläpito aktivoi jalat ja tukilihakset. Se on koko kehon vastusharjoittelu.

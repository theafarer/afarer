- slug: inflatable-repair
  category: maintenance
  title: Miten korjaat täytettävän SUP-lautasi
  description: Vaiheittainen opas reikien, venttiiliongelmien ja saumavaurioiden korjaamiseen täytettävissä SUP-lautoissa.
  tldr: Pienet reiät (alle 1/4") voi korjata mukana toimitetulla korjaussarjalla. Puhdista alue, levitä PVC-liimaa, paina paikka paikalleen ja odota 24 tuntia. Venttiilivuodot vaativat yleensä O-renkaan vaihdon. Suuret repeämät tai saumojen aukeaminen vaativat ammattilaisen.
  problem: Pienet reiät ja venttiiliongelmat ovat yleisiä, mutta helppoja korjata. Ilman oikeaa korjaustekniikkaa käyttäjät joko maksavat liikaa ammattilaiselle tai pahentavat vauriota.
  solution: Tunnista vauriotyyppi — reikä, venttiilivuoto tai saumaongelma — ja käytä sopivaa korjausmenetelmää. Useimmat korjaukset vievät 30 minuuttia plus kovettumisajan.
  audience: Täytettävien SUP-lautojen omistajat, jotka haluavat hoitaa peruskorjaukset itse.
  steps:
    - Paikanna vuoto — täytä lautta täysin, kuuntele ilmahälyä, tunne kädellä tai käytä saippuavettä
    - Merkitse vuoto kynällä tai teipillä
    - Puhdista vuodon ympäristö isopropyylialkoholilla — vähintään 2 tuuman alue vaurion ympäriltä
    - Hio pinta kevyesti hienolla hiekkapaperilla paremman liimapinnan saamiseksi
    - Levitä PVC-liimaa sekä paikkaan että laudan pintaan
    - Odota 5 minuuttia, jotta liima muuttuu tarttuvaksi
    - Paina paikkaa lujasti ja rullaa ilmakuplat pois rullalla tai luottokortilla
    - Anna kovettua 24 tuntia ennen täyttöä täyteen paineeseen
  faq:
    - q: Voinko korjata reiän vedessä?
      a: Hätäkorjaukset paikalla ja teipillä voivat viedä sinut takaisin rantaan. Täysi korjaus vaatii kuivat olosuhteet ja 24 tunnin kovettumisen.
    - q: Miten korjaan vuotavan venttiilin?
      a: Poista venttiilin ydin mukana toimitetulla työkalulla, tarkista O-rengas vaurioiden varalta, vaihda tarvittaessa ja ruuvaa ydin takaisin tiukasti.
    - q: Mitä liimaa käytän PVC-korjauksiin?
      a: Käytä PVC:lle tarkoitettua liimaa kuten HH-66 tai Clifton. Tavallinen superliima tarttuu huonosti täytettävien PVC-materiaalien pintaan.

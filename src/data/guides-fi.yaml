- slug: sup-travel-transport
  category: planning
  title: 'SUP-matkaopas: Lentäminen ja automatkat täytettävän SUP:n kanssa'
  description: Miten matkustat täytettävän SUP:n kanssa lentokoneella, autolla tai asuntoautolla. Vinkkejä lentoyhtiömaksuihin, pakkaukseen, täyttämiseen matkakohteessa ja kansainvälisiin matkahuomioihin.
  tldr: Tyhjennä, rullaa ja pakkaa SUP reppuunsa. Useimmat lentoyhtiöt hyväksyvät sen kirjattuna matkatavarana (alle 50 paunaa / 50 lineaarituumaa). Pakkaa aina pumppu ja mela samaan reppuun. Saavu ajoissa, jotta sinulla on ylimääräistä aikaa, jos tiskin henkilökunta kyseenalaistaa repun koon. Harkitse etukäteislähetystä pitkille matkoille.
  problem: SUP:n kanssa matkustaminen vaikuttaa monimutkaiselta — lentoyhtiöiden kokorajat, turvatarkastukset ja täyttäminen syrjäisessä kohteessa luovat epävarmuutta.
  solution: afarerin SUP-reput on suunniteltu täyttämään lentoyhtiöiden kirjatun matkatavaran rajat. Pakkaa strategisesti, ota mukaan korjaussarja ja tutki täyttöpaikat (venesatamat, sähköllä varustetut leirintäalueet) ennen lähtöä.
  audience: Melojat, jotka suunnittelevat SUP-matkaa lentäen, autolla tai asuntoautolla.
  steps:
    - Tyhjennä lautta kokonaan ja rullaa se keulasta perään
    - Pakkaa rullattu lautta, pumppu, mela, leash ja evä reppuun
    - Tarkista lentoyhtiön koko- ja painorajat — useimmat sallivat 62 lineaarituumaa ja 50 paunaa
    - Saavu ajoissa ja ole valmis siihen, että reppu tarkistetaan käsin
    - Kanna korjaussarjaa käsimatkatavarassa siltä varalta, että lautta vaurioituu kuljetuksessa
    - Tutki täyttövaihtoehdot — leirintäalueiden sähköliitännät sähköpumppuihin, venesatamien ilmapisteet
  faq:
    - q: Hyväksyykö lentoyhtiö SUP-reppuni matkatavarana?
      a: Useimmat yhdysvaltalaiset ja eurooppalaiset lentoyhtiöt hyväksyvät SUP-reput tavallisena kirjattuna matkatavarana, jos ne ovat alle 50 paunaa ja 62 lineaarituumaa. Halpalentoyhtiöt voivat periä ylikokoisia maksuja.
    - q: Voinko ottaa SUP:ni käsimatkatavarana?
      a: Et voi. SUP-reput ylittävät käsimatkatavaran mitat kaikilla lentoyhtiöillä. Tarkista reppu aina matkatavarana.
    - q: Miten täytän SUP:ni syrjäisessä kohteessa?
      a: Mukana toimitettu käsipumppu toimii missä tahansa ilman sähköä. Mukavuuden vuoksi ota mukaan kannettava sähköpumppu ja etsi leirintäalueita, joissa on sähköliitäntä, tai venesatamia, joissa on ilmapisteitä.

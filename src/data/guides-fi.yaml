- slug: sup-inflation-psi-guide
  category: technical
  title: 'SUP:n täyttöopas: Optimaalinen PSI suorituskyvylle ja turvallisuudelle'
  description: Kattava opas SUP:n täyttöpaineeseen — suositellut PSI-alueet, miten paine vaikuttaa suorituskykyyn ja vinkit pumppun oikeaan käyttöön.
  tldr: Täytä 12-15 PSI:in useimmissa täytettävissä SUP:issa. Korkeampi paine merkitsee enemmän jäykkyyttä, mutta hitaampaa täyttöä. Matalampi paine merkitsee pehmeämpää tuntumaa, mutta enemmän taipumaa. Älä koskaan ylitä laudaan painettua enimmäis-PSI:tä. Käytä tarkan painemittarin sisältävää pumppua. Kylmä ilma laskee painetta, kuuma aurinko nostaa sitä.
  problem: Alitäytetyt laudat tuntuvat hitailta ja taipuvat liikaa. Ylitäytetyt laudat riskeeraavat saumojen pettämisen. Moni meloja arvaa PSI:n sen sijaan, että mittaisi tarkasti.
  solution: Käytä pumppua, jossa on sisäänrakennettu painemittari. Tähtää 15 PSI:in maksimaalisen jäykkyyden saamiseksi. Tarkista paine ennen jokaista lenkkiä — lämpötilan muutokset vaikuttavat PSI:in merkittävästi.
  audience: Kaikki täytettävien SUP:den omistajat.
  steps:
    - Tarkista venttiilin läheltä laudaan painettu suositeltu PSI-alue
    - Käytä kaksitoimista pumppua suositellun alueen keskikohtaan asti
    - Vaihda yksitoimiseen tilaan viimeisille 3-4 PSI:lle tarkempaa hallintaa varten
    - Tarkista paine painemittarilla — analogiset mittarit ovat luotettavampia kuin digitaaliset
    - Säädä olosuhteiden mukaan — korkeampi PSI retkeilyyn ja kilpailuihin, matalampi PSI koskiveteen ja kivisiin laskupaikkoihin
    - Tarkista paine uudelleen, kun lautta on ollut 10 minuuttia — lämpötilatasapaino muuttaa PSI:tä
  faq:
    - q: Voinko ylitäyttää SUP:ni?
      a: Voit. Ilmoitettua enimmäis-PSI:tä (yleensä 15-18 PSI) korkeampi paine voi irrottaa saumoja ja vaurioittaa drop-stitch-ydintä. Pysy aina painetun alueen sisällä.
    - q: Vaikuttaako lämpötila PSI:in?
      a: Merkittävästi. 70 °F:ssä 15 PSI:in täytetty lautta voi nousta 18 PSI:iin suorassa auringossa 95 °F:ssä. Kylmä vesi voi laskea paineen 12 PSI:iin. Tarkista paine ympäristön muutosten jälkeen.
    - q: Mikä PSI aloittelijoille?
      a: 12-13 PSI oppimisvaiheessa tarjoaa hieman pehmeämmän alustan, joka antaa enemmän anteeksi putoamisissa. Nosta 15 PSI:in taitojen karttuessa.

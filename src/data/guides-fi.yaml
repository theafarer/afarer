- slug: sup-weight-capacity
  category: buying-guide
  title: 'SUP:n kantokykyopas: Kuinka paljon painoa SUP voi kantaa?'
  description: SUP:n kantokykyn rajojen ymmärtäminen, kokonaiskuorman laskeminen ja miksi rajan ylittäminen vaikuttaa suorituskykyyn ja turvallisuuteen.
  tldr: Älä koskaan ylitä 80 % laudan enimmäiskantokyvystä kehonpainollasi plus varusteillasi. 220 paunan kantokyvyn lautta sopii 160 paunan melojalle kevyillä varusteilla. Rajan ylittäminen aiheuttaa uppoamista, hidasta käsittelyä ja suuremman vaurioriskin.
  problem: Melojat ylittävät usein laudan kantokyvyn, mikä johtaa huonoon suorituskykyyn, uppoamiseen ja mahdollisiin lautavaurioihin. Valmistajat ilmoittavat enimmäisrajat, mutta eivät selitä turvallisia työkuormia.
  solution: Laske kokonaiskuormasi (kehonpaino + varusteet + laudan imemä vesi) ja pysy alle 80 % ilmoitetusta enimmäiskantokyvystä. Painavammat melojat tarvitsevat suuremman tilavuuden lauttoja, joiden kantokyky on yli 300 paunaa.
  audience: Kaiken kokoiset melojat, erityisesti suuremmat melojat ja retkivarusteita kuljettavat.
  steps:
    - Etsi laudaan painettu enimmäiskantokyky (yleensä venttiilin läheltä)
    - Punnitse itsesi ja kaikki varusteet mukaan lukien mela, pelastusliivi, kuivapussit, kylmälaukku ja tarvikkeet
    - 'Laske käyttöaste — (kokonaiskuormasi) ÷ (enimmäiskantokyky) × 100'
    - Tavoittele 70-80 % optimaalisen suorituskyvyn ja turvallisuuden saamiseksi
    - Jos ylität 80 %, valitse suurempi lautta tai vähennä varusteita
  faq:
    - q: Mitä tapahtuu, jos ylitän painorajan?
      a: Lautta kulkee matalammalla ja aiheuttaa enemmän vastusta. Vakaus heikkenee, keula voi upota ja drop-stitch-ydin on suuremmassa vaarassa vaurioitua aallokossa.
    - q: Voiko kaksi henkilöä meloa yhdellä SUP:lla?
      a: Vain jos kokonaispaino pysyy alle 80 % kantokyvystä. Useimmat vakio-SUP:t on suunniteltu yhdelle melojalle. Kaksinkertainen melonta vaatii laudan, joka on hyväksytty kahdelle.
    - q: Onko täytettävien SUP:den kantokyky pienempi kuin kovien lautojen?
      a: Laadukkailla drop-stitch-rakenteilla varustetuilla täytettävillä on vastaava tai suurempi kantokyky kuin kovilla laudoilla paksuuman tilavuusjaon ansiosta.

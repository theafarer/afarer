  category: buying-guide
  title: 'Koski-SUP-opas: Joella melomisen täytettävien lautojen ostajan opas'
  description: Miten valitset koski-SUP:n jokimelontaan — lyhyemmät laudat, vahvistettu rakenne, turvallisuusvarusteet ja melontatekniikat luokan I-III koskia varten.
  tldr: Koski-SUP:t tarvitsevat lyhyemmän pituuden (8-10'), vahvistettuja reunoja, korkeamman PSI:n (15+) ja useita ilmakammioita turvallisuuden vuoksi. Käytä suoraa jokileashia (ei kierreleashia), käytä kypärää ja pelastusliiviä ja melo aina kaverin kanssa. Aloita luokasta I ennen vaikeampien koskien yrittämistä.
  problem: Vakioyleislautan vieminen liikkuvan veden päälle on vaarallista — vakiolaudasta puuttuu ketterys, iskunkestävyys ja turvallisuusominaisuudet, joita joet vaativat.
  solution: Valitse koskeen rakennettu SUP, jossa on lyhyt pituus ketteryyttä, vahvistettu rakenne kivi-iskuihin ja monikammiorakenne turvallisuutta varten.
  audience: Kokeneet melojat, jotka siirtyvät jokimelontaan.
  steps:
    - 'Valitse 8-10 jalan lautta suurimman ketteryyden vuoksi koskissa'
    - 'Etsi vahvistettu reunarakenne ja sotilasluokan PVC'
    - 'Valitse lautta, jossa on 2+ ilmakammiota varmuuden vuoksi reiän sattuessa'
    - 'Käytä suoraa jokileashia, joka on kiinnitetty pikairrotusvyöhön'
    - 'Käytä kypärää, pelastusliiviä ja sopivia jalkineita'
    - 'Aloita luokan I koskista ja etene vähitellen kokeneen kumppanin kanssa'
  faq:
    - q: Voinko käyttää tavallista SUP:ta koskiveteen?
      a: Ei suositella. Vakio-SUP:eista puuttuu iskunkestävyys, ja niiden kerrokset voivat irrota kiviin osuessa. Monikammiorakenne on kriittinen jokiympäristöissä.
    - q: Mikä PSI koski-SUP:lle?
      a: 15+ PSI maksimaalisen jäykkyyden vuoksi. Kovempi lautta pomppii kivistä paremmin kuin alitäytetty lautta, joka muotoutuu esteiden ympärille.
    - q: Tarvitsenko erikoismelontataitoja koski-SUP:hen?
      a: Tarvitset. Joen lukeminen, saukkokäännökset, lauttaus ja tukivedot ovat välttämättömiä taitoja. Osallistu koski-SUP-kurssille ennen luokan II+ yrittämistä.

- slug: sup-size-guide
  category: buying-guide
  title: 'SUP-koko-opas: Miten valitset oikeat laudan mitat'
  description: Kattava SUP-koko-opas, joka kattaa pituus-, leveys- ja paksuussuositukset painosi, pituutesi, taitotasosi ja melontatyylin mukaan.
  tldr: Aloittelijat tarvitsevat leveämpiä lautoja (32-34") vakan vuoksi. Painavammat melojat tarvitsevat pidempiä lautoja (11'+) ja suuremman tilavuuden. Retkeily vaatii pidempiä runkoja (12'+). Jooga vaatii ylimääräistä leveyttä (34"+). Tarkista aina kantokyky — painosi plus varusteet eivät saisi ylittää 80 % rajasta.
  problem: Väärän kokoinen SUP johtaa huonoon vakauteen, hitaaseen suunnanpitoon ja turhauttavaan melontakokemukseen. Useimmat ensikertalaiset valitsevat laudan, joka näyttää hyvältä, miettimättä miten mitat vaikuttavat suorituskykyyn.
  solution: Sovita laudan pituus, leveys ja paksuus painoosi, taitotasoon ja ensisijaiseen käyttöön. Käytä laskuriamme — lisää painosi ja varusteidesi paino yhteen ja valitse lautta, jossa on vähintään 20 % marginaali kyseisen summan yläpuolella.
  audience: Ensimmäistä SUP-lautaa ostavat, erikoislautaan päivittävät melojat ja kaikki, jotka ovat epävarmoja koosta.
  steps:
    - Punnitse itsesi kaikkine varusteinesi (mela, pelastusliivi, kuivapussi)
    - Lisää 20 %:n turvamarginaali minimikantokyvyn määrittämiseksi
    - 'Valitse leveys taitotason mukaan — 32-34" aloittelijoille, 30-32" keskiverto, 28-30" edistyneille'
    - 'Valitse pituus käyttötarkoituksen mukaan — 10''6"-11''6" yleiskäyttöön, 12''-14'' retkeilyyn, 9''-10'' koskiveteen'
    - 'Tarkista paksuus — 6" on vakio, 4" suorituskykyyn, 5" yleiskäyttöön'
    - Tarkista laudan suosittelema PSI-alue optimaalisen jäykkyyden saamiseksi
  faq:
    - q: Mikä SUP:n leveys on paras aloittelijoille?
      a: 32-34 tuuman leveys tarjoaa vakaimman alustan. Mitä leveämpi lautta, sitä helpompi tasapainottaa — erityisesti suuremmille melojille.
    - q: Miten tiedän, onko SUP liian pieni minulle?
      a: Jos lautta istuu matalalla vedessä, käyttäytyy hitaasti tai keula uppoaa helposti melottaessa, se on todennäköisesti liian pieni painollesi.
    - q: Vaikuttaako laudan pituus nopeuteen?
      a: Vaikuttaa. Pidempi vesilinja nostaa teoreettista runkonopeutta. 14 jalan retkeilylautta on huomattavasti nopeampi kuin 10 jalan yleislautta samalla melojan panostuksella.

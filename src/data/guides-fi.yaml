- slug: sup-maintenance
  category: maintenance
  title: Näin puhdistat ja säilytät täytettävän SUP-lautasi
  description: Vaiheittainen hoito-opas, joka maksimoi täytettävän SUP-lautasi käyttöiän.
  tldr: Huuhdo makealla vedellä jokaisen käytön jälkeen, kuivaa täysin ennen säilytystä, tyhjennä ja rullaa löyhästi (ei sotilaskireälle), säilytä viileässä ja kuivassa suorasta auringonvalosta erillään ja tarkista saumat kuukausittain.
  problem: Virheellinen säilytys ja puhdistus ovat yleisimmät syyt täytettävien SUP-lautojen ennenaikaisiin vaurioihin — home, UV-vahingot ja saumojen irtoaminen.
  solution: Noudata johdonmukaista rutiinia käytön jälkeen — huuhtele, kuivaa, tarkista, tyhjennä ja säilytä. Käytä mietoa saippuaa itsepäiseen likaan. Älä koskaan säilytä märkänä tai suorassa auringossa.
  audience: Kaikki täytettävien SUP-lautojen omistajat, jotka haluavat lauttansa kestävän yli 5 vuotta.
  steps:
    - Huuhdo lautta makealla vedellä heti käytön jälkeen, erityisesti suolaveden jälkeen
    - Puhdista miedolla saippualla ja pehmeällä sienellä — vältä aggressiivisia kemikaaleja ja painepesuria
    - Kuivaa lautta täysin — avaa venttiili, jotta sisään jäänyt vesi valuu ulos
    - Etsi vaurioita — tarkista saumat, venttiili ja pinta reikien varalta
    - Tyhjennä lautta kokonaan — irrota venttiilin ydin täydellistä tyhjennystä varten
    - Rullaa lautta löyhästi — aloita keulasta, vältä tiukkoja taitoksia
    - Säilytä kuljetuspussissa viileässä, kuivassa paikassa suorasta auringonvalosta erillään
  faq:
    - q: Voinko pitää SUP-lautani täytettynä koko kauden?
      a: Voit, mutta pidä se poissa suorasta auringonvalosta, kun et käytä sitä. Osittainen tyhjennys (8-10 PSI) on suositeltavaa pitkään säilytykseen.
    - q: Miten korjaan reiän?
      a: Puhdista alue, leikkaa paikka pyöristetyin kulmin, levitä liimaa, paina lujasti ja odota 24 tuntia ennen täyttöä. afarer-laudat toimitetaan korjaussarjan kanssa.
    - q: Kuinka usein venttiili tulisi tarkistaa?
      a: Kuukausittain. Venttiili on yleisin vauriokohta. Varmista, että venttiilin nasta liikkuu vapaasti ja O-rengas on ehjä.

- slug: paddling-techniques
  category: tutorial
  title: SUP-melonnan perustekniikat
  description: Hallitse etumelaveto, kaariveto ja ristiveto meloaksesi tehokkaasti kaikissa olosuhteissa.
  tldr: Etumelaveto käyttää keskivartaloa, ei käsiä. Kaariveto kääntää lauttaa. Ristiveto on tehokkain käännös. Pidä mela pystyssä ja upota melalevy kokonaan veteen suurimman voimansiirron saamiseksi.
  problem: Useimmat melojat käyttävät käsivoimaisia vetoja, jotka tuhlaavat energiaa ja väsyttävät hartioita. Huono tekniikka tekee laudasta myös vaikeasti hallittavan tuulessa ja aallokossa.
  solution: Opi kolme olennaista vetoa — etumelaveto, kaariveto ja ristiveto — oikealla liikemekaniikalla. Harjoittele kutakin tyynillä vedellä ennen siirtymistä vaativiin olosuhteisiin.
  audience: Melojat, jotka haluavat meloa pidempään, nopeammin ja vähemmän väsyen.
  steps:
    - 'Etumelaveto: ulottu eteen, upota melalevy kokonaan, vedä takaisin vartalon kierrolla (ei käsillä), nosta ulos nilkan kohdalla'
    - 'Kaariveto: ulottu eteen reunan kohdalta, pyyhkäise melalevy laajassa kaarella perää kohti, lautta kääntyy pois melan puolelta'
    - 'Ristiveto: aseta mela laudan vastakkaiselle puolelle vaihtamatta käsiasentoa, vedä perää kohti'
    - 'Tukiveto: käytä matalaa tukivetoa tasapainoon aallokossa — lyö melalevy litteästi vesipintaan'
    - 'Sivuveto: ulottu sivulle ja vedä lauttaa sivusuunnassa melaa kohti'
  faq:
    - q: Miten melon suoraan linjaan?
      a: Käytä yhtenäistä vetopituutta molemmin puolin. Vaihda puolta 5-10 vedon välein. Katso horisontin kiinteää pistettä suuntaviittana.
    - q: Pitäisikö polvien olla koukussa?
      a: Pitäisi. Pidä polvet lievästi koukussa iskunvaimentimina. Lukitut polvet välittävät jokaisen pienimmänkin väreilyn keskivartaloon ja heikentävät tasapainoa.
    - q: Miten melon vastatuuleen?
      a: Laske painopistettä, ota lyhyempiä ja nopeampia vetoja ja pysy lähempänä rantaa, jossa tuuli on usein heikompi. Jos tuuli on liian voimakas, älä mene veteen.

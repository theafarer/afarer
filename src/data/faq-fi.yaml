- id: sup-weight-capacity
  question: 'Kuinka paljon painoa täytettävä SUP-lauta kestää?'
  answer: 'Painokapasiteetti vaihtelee tilavuuden mukaan. afarer-laudat: SUP Explorer 11 (260L, jopa 100 kg / 220 paunaa), Ocean Voyager 12 (310L, jopa 140 kg / 308 paunaa), Leviathan Wake (350L, jopa 180 kg / 396 paunaa). Parhaan suorituskyvyn saamiseksi pidä kokonaiskuorma (ajaja + varusteet) enintään 80 % maksimikapasiteetista. Lauta kelluu korkeammalla ja pitää kurssia paremmin, kun sitä ei ylikuormiteta, erityisesti aallokossa.'

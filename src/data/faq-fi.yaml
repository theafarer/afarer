  relatedGuides: []
- id: paddle-length
  question: 'Mittainen melä minun pitää olla?'
  answer: 'Melan pitäisi olla 6–8 tuumaa pidempi kuin pituutesi. Säädettävät melat mahdollistavat hienosäädön eri olosuhteisiin. Katso tarkat koot melaoppaastamme.'

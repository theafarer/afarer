  relatedGuides: []
- id: saltwater-rinse
  question: 'Pitääkö täytettävä lautani huuhdella merikäytön jälkeen?'
  answer: 'Kyllä — huuhdo aina lauta, evät, pumppu ja mela makealla vedellä suolaveden käytön jälkeen. Suolakiteet tunkeutuvat saumiin ja venttiileihin aiheuttaen mikrovuotoja ja syövytystä. Kuivaa lauta varjossa ennen tyhjennystä ja säilytystä. Säännöllinen huuhtelu pidentää merkittävästi täytettävän laudan käyttöikää.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'Tarvitsenko todella leashin SUP:hen?'
  answer: 'Kyllä — pidä aina leash. Kierreleash kiinnittyy nilkkaasi tai pohkeeseesi ja pitää laudan luonasi, jos putoat. Avoimessa vedessä leash voi pelastaa henkesi estämällä eron pelastusvälineestä. Jokimelontaan käytä pikairrotusleashia takertumisen välttämiseksi.'
  category: safety

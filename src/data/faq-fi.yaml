- id: sup-learning
  question: 'Onko SUP:n opettelu vaikeaa?'
  answer: 'Ei lainkaan. Useimmat aloittelijat onnistuvat nousemaan seisomaan ja soutamaan ensimmäisellä kerrallaan. afarerin All-Around-sarja tarjoaa erittäin vakaat, leveät alustat, jotka on suunniteltu erityisesti ensikertalaisille. Aloita rauhallisessa vedessä, niin pärjäät muutamassa minuutissa.'

- id: sup-deck-pad-care
  question: 'Miten puhdistan ja huollan EVA-kantta?'
  answer: 'Huuhdo kansi makealla vedellä jokaisen kerran jälkeen. Likaa tai tahroja varten käytä mietoa saippuaa ja pehmeää harjaa — vältä aggressiivisia kemikaaleja. Jos reunat alkavat irrota, levitä vähän vesitiivistä meriliimaa ja paino alle 24 tunniksi. Pidä lauta poissa suorasta UV-valosta, kun et käytä sitä, jotta kansi ei heikkene.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'Voinko soutaa SUP-lautaa istuen?'
  answer: 'Voit. Monissa SUP-lautoissa, afarer Explorer 11 mukaan lukien, on D-renkaat istuimen kiinnittämiseen. Istuva melominen tarjoaa mukavan vaihtoehdon pidemmillä matkoilla, kalastuksessa tai kun haluat vaihtaa asentoa vedessä.'
  category: product
  relatedProducts:

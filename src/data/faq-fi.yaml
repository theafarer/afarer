- id: sup-choppy-water
  question: 'Miten melon SUP:lla aallokossa tai tuulessa?'
  answer: 'Aallokossa: taivuta polvia, pidä leveämpi asento, lyhennä melavetoja ja aktivoi keskivartalosi tasapainoon. Vastatuulessa: käytä matalampaa melakulmaa, ota lyhyempiä vetoja ja kallistu eteenpäin. Sivutuulessa: melo tuulen tulosuunnan puolelta korjataksesi ajautumista. Myötätuulessa: surffaa aalloista nopeutta. Aloittelijoiden tulisi välttää yli 10 mph:n tuulia ja valita leveämpiä, pidempiä lautoja vakauteen. afarerin retkeily-SUP Ocean Voyager on suunniteltu kestämään kohtalaista aallokkoa ja tuulta.'
  category: safety
  relatedProducts:

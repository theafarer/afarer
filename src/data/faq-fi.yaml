- id: sup-yoga
  question: 'Voinko tehdä joogaa SUP-laudalla?'
  answer: 'Totta kai. SUP-jooga yhdistää perinteiset asennot kelluvan alustan haasteeseen ja aktivoi syvemmät tukilihakset. Käytä 33 tuumaa tai leveämpää lautaa pehmeällä, liukuestetyllä kannella. Harjoittele rauhallisessa, matalassa vedessä ankkurin kanssa. Aloita perusasennoista kuten alaspäin katsovasta koirasta, soturiasento II:sta ja puuasennosta. Täyden EVA-kannan omaava SUP Explorer 11 on ihanteellinen.'
  category: general

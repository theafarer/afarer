- id: inflation-time
  question: 'Kauanko täyttö vie aikaa?'
  answer: 'Mukana toimitettavalla kaksitoimisella pumpulla useimmat laudat täyttyvät 12–15 PSI:in alle 5 minuutissa. Tarjoamamme sähköpumppu lyhentää ajan alle 2 minuuttiin. Tyhjennys ja pakkaaminen vie noin 3 minuuttia.'
  category: product
  relatedProducts: []
  relatedGuides:

- id: travel-sup
  question: 'Voinko matkustaa täytettävällä SUP-laudalla?'
  answer: 'Totta kai. Jokainen afarer-lauta pakataan lentoyhtiöiden matkatavaravaatimukset täyttävään reputolkkuun. Vain 18–22 paunaa painavana se on helppo viedä rannalle, järvelle tai läpi lentokenttien.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Mikä on painoraja?'
  answer: 'All-Around SUP -lautamme kestävät jopa 220 paunaa. Touring- ja Yoga-sarjat kestävät jopa 250 paunaa. Kahden hengen käyttöön tai raskaampiin kuormiin ota yhteyttä tiimiimme suositusten saamiseksi.'
  category: product
  relatedProducts: []
  relatedGuides:

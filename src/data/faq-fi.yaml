- id: b2b-moq
  question: 'Mikä on OEM/ODM SUP -valmistuksen vähimmäistilausmäärä?'
  answer: 'Vähimmäistilausmäärät (MOQ) vaihtelevat tuotetyypin mukaan. Oman logon lisääminen valmistuotteisiin: 50 yksikköä per SKU. Räätälöidyn muodon muotikehitys: 200–500 yksikköä per malli (ensitilaus). Yhteismuotiohjelmat 50 yksiköstä alkaen. Hypalon-veneiden valmistus: 20–50 yksikköä koon mukaan. Tarvikkeet ja pelastusliivit: 500–1000 yksikköä per malli. Ota yhteyttä OEM-tiimiin arvioidun volyymisi kanssa tarkkoja MOQ- ja hintatietoja varten.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Mitkä ovat tyypilliset toimitusajat OEM SUP -tilauksille?'
  answer: 'Ensitilaukset, oma logo olemassa oleviin muotteihin: 6–8 viikkoa ennakosta FOB Qingdaoon. Räätälöidyt muodot uusilla muoteilla: 12–20 viikkoa (sisältää 3D-suunnittelun, muotin valmistuksen, näytteenotto ja massatuotannon). Toistuvat tilaukset hyväksytyillä spesifikaatioilla: 6–8 viikkoa. Kiireelliset tilaukset voidaan nopeuttaa 4–5 viikkoon olemassa olevilla muoteilla. Ajat sisältävät raaka-aineiden hankinnan, tuotannon, tuotantolinjan QC:n ja konttien lastauksen.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Mitä sertifiointeja afarerin OEM-tuotteet kantavat?'
  answer: 'Kaikki afarerin OEM/ODM-tuotteet kantavat: CE-vaatimustenmukaisuusvakuutuksen (EU-markkinat), UKCA:n (Yhdistyneen kuningaskunnan markkinat), ISO 9001:2015-laatujärjestelmän, BSCI-sosiaalisen vastuun tarkistuksen, REACH- ja RoHS-materiaalivaatimustenmukaisuuden sekä EN ISO 25649 -luokituksen täytettäville veneille. Lisäsertifioinnit pyynnöstä: US Coast Guard -vaatimustenmukaisuusasiakirjat, sotilasstandarditestit (MIL-STD-810) ja kohdemaan tuontisertifiointituki.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Voinko tilata näytteitä ennen sitoutumista massatuotantoon?'
  answer: 'Voit. Näytetilaukset ovat saatavilla kaikkiin OEM/ODM-projekteihin. Ennen tuotantoa tehtävät näytteet (PPS) valmistetaan muotin valmistuksen jälkeen ja ennen massatuotantoa. Näytteen toimitusaika: 15–25 arkipäivää olemassa olevilla muoteilla, 25–40 arkipäivää räätälöidyillä muoteilla. Näytekustannus hyvitetään ensimmäisestä massatilauksesta. Näytteet toimitetaan pikatoimituksella (DHL, FedEx, UPS) täydellisellä seurannalla ja saapuvat yleensä 3–5 arkipäivässä.'
  category: b2b

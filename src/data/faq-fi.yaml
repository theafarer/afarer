- id: sup-sustainability
  question: 'Ovatko täytettävät SUP-laudat ympäristöystävällisiä?'
  answer: 'Täytettävien SUP-lautojen ympäristövaikutus on pienempi kuin kovien lautien monella tavalla: ne kuluttavat vähemmän raaka-aineita valmistuksessa, kevyempi paino pienentää kuljetuspäästöjä ja niiden kestävyys tarkoittaa vähemmän vaihdoksia ajan myötä. afarer-lautojen PVC on lyijytöntä ja REACH-yhteensopivaa. Keskeiset kestävät käytännöt: osta laadukas lauta, joka kestää 5-10 vuotta, korjaa reiät vaihtamisen sijaan, kierrätä lauta elinkaaren lopussa erikoistuneiden PVC-kierrätysohjelmien kautta ja vältä kertakäyttöpakkauksia valitsemalla merkit, jotka käyttävät uudelleenkäytettäviä kuljetuspusseja.'
  category: general
  relatedProducts:
    - sup-explorer-11

  relatedGuides: []
- id: b2b-payment
  question: 'Mitkä maksuehdot ovat käytettävissä OEM-tilauksissa?'
  answer: 'Tyypilliset maksuehdot: 30 % ennakko allekirjoitetun PI:n (proformalasku) kanssa, 70 % saldo ennen toimitusta B/L-kopiota (konossementti) vastaan. Uusille kumppaneille: 50 % ennakko, 50 % ennen toimitusta. Vakiintuneille kumppaneille tilaushistorian kanssa: L/C nähtyyn maksuun tai 30 päivän luotto valikoiduille tileille (luottotarkistuksen jälkeen). Maksutavat: T/T-tilisiirto, L/C (akreditiivi), Western Union. Kaikki maksut USD:ssä tai EUR:ssa.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Miten afarer suojaa immateriaalioikeuksiani ja suunnitelmiani?'
  answer: 'IP-suojaus on keskeinen osa OEM-palveluamme. Allekirjoitamme NDA:n ennen kaikkia suunnittelukeskusteluja. Suunnittelutiedostoja hallitaan eristetyillä työasemilla pääsylokilla. Kaikki työkalut ja muotit pysyvät yksinomaisena omaisuutenasi (sinun maksaminasi). Emme koskaan käytä muottejasi tai suunnitelmiasi muiden asiakkaiden hyväksi. Muotien varastointi ja ylläpito sisältyvät aktiivisille tileille. Sopimuksen päättyessä muotit joko toimitetaan sinulle tai tuhotaan videodokumentoidusti. Kunnioitamme kaikkia tavaramerkki- ja patenttioikeuksia.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Mitkä toimitus- ja logistiikkavaihtoehdot ovat käytettävissä?'
  answer: 'FOB Qingdao (tyypillinen): rahti lastataan Qingdaon satamassa; sinä järjestät kuljetuksen siitä eteenpäin. CIF (nimetty satama): järjestämme ja vakuutamme lähetyksen kohdesatamaasi. DDP / ovelta ovelle: täysi logistiikkapalvelu mukaan lukien tulliselvitys ja lopputoimitus. Merikuljetus Yhdysvaltain länsirannikolle: noin 25–30 päivää. Merikuljetus EU:han (Hampuri/Rotterdam): noin 30–35 päivää. Lentorahti kiireellisiin tilauksiin (3–5 päivää). Käsittelemme kaikki vientiasiakirjat, alkuperätodistukset ja pakkauslistat.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Mitkä laadunvalvontamenettelyt koskevat OEM-tilauksia?'
  answer: 'Jokainen OEM-tilaus noudattaa dokumentoitua QC-suunnitelmaa: 1) Saapuvien materiaalien tarkastus — PVC-kankaan erätestaukset paksuuden, vetolujuuden ja UV-kestävyyden varalta. 2) Prosessin sisäinen QC — saumanvetolujuustesti 50 laudan välein, painepitotesti 1,5x nimellis-PSI:in. 3) Lopputarkastus — 100 % silmämääräinen tarkastus ja painetesti jokaiselle laudalle. 4) AQL-otanta — eräotanta ISO 2859 -standardin mukaan kriittisellä vialla = 0 hyväksyntä. 5) Kolmannen osapuolen tarkastus — SGS, Bureau Veritas tai Intertek saatavilla ostajan kustannuksella.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Voitteko luoda räätälöidyn pakkauksen brändilleni?'
  answer: 'Voimme. Tarjoamme täydet räätälöityjen pakkausten palvelut: vähittäismyyntipakkaukset täysivärisellä CMYK-painatuksella ja brändigrafiikoilla, kuljetuspussit silkkipaino- tai brodeerilogoilla, ohjekirjat kielelläsi, ripustustarrat ja viivakoodi-/UPC-tarrat sekä sisäpakkaus (polyeteenipussit, vahvistusvaahto). Vähimmäismäärät: 500–1000 yksikköä räätälöityihin pakkauksiin, 200–500 kuljetuspusseihin. Pakkaussuunnittelupalvelu sisältyy OEM-tilauksiin.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Voinko vierailla tehtaalla tai järjestää kolmannen osapuolen tarkastuksen?'
  answer: 'Tehdaskäynnit ovat tervetulleita ajanvarauksella. Isännöimme brändin omistajia ympäri vuoden ja voimme järjestää noudon Qingdao Jiaodongin kansainväliseltä lentokentältä (TAO). Ostajille, jotka eivät voi vierailla, tarjoamme: virtuaalisen tehdaskierroksen videopuhelun välityksellä, kolmannen osapuolen tarkastuksen koordinoinnin SGS/Bureau Veritasin kanssa (ostaja kattaa tarkastuskulut) ja kattavan tehtaankapasiteettiasiakirjapaketin, joka sisältää laiteluettelon, QC-prosessivirran ja henkilöstön pätevyydet.'
  category: b2b

  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'Mitä turvavarusteita tarvitsen kylmässä vedessä melomiseen?'
  answer: 'Alle 15°C vesi vaatii lämpösuojan. 8–14°C:n veteen käytä märkäpukua tai kuivapukua saappailla, käsineillä ja hupulla. 14–20°C:n veteen 3/2mm märkäpuku riittää. Pidä aina oikein istuva pelastusliivi, joka tarjoaa lämpösuojaa ja turvaa. Tarkista paikalliset määräykset pakollisista varusteista.'
  category: product

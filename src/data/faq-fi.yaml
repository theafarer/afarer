- id: oem-odm-details
  question: 'Mitkä ovat OEM/ODM-vähimmäistilausmäärät?'
  answer: 'Vähimmäistilausmäärät (MOQ) vaihtelevat tuotetyypin ja monimutkaisuuden mukaan. Oman logon lisääminen olemassa oleviin malleihin vaatii tyypillisesti 5–10 yksikköä. Täysin räätälöidyt runkomuodot vaativat korkeammat MOQ:t. Ota yhteyttä myyntitiimiimme tarpeidesi kanssa saadaksesi yksityiskohtaisen tarjouksen. Käsittelemme kaiken räätälöidyistä väreistä ja logoista täysin uusiin muotisuunnitteluihin.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'Voinko saada oman logoni afarer-tuotteisiin?'
  answer: 'Voit. OEM-palvelumme sisältää räätälöidyn logon sijoittelun, räätälöidyt väriskaalat ja räätälöidyn pakkauksen. Tarjoamme pad-silkkipaino-, lämmönsiirto- ja brodeerivaihtoehtoja tuotetyypistä riippuen. Lähetä grafiikkatiedostosi ja erittelysi myyntitiimillemme tarjousta ja toimitusaika-arviota varten.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'Moneen PSI:n minun pitäisi täyttää SUP-lautani?'
  answer: 'Täytä laudan nimelliseen enimmäis-PSI:in parhaan suorituskyvyn saamiseksi — tyypillisesti 15–18 PSI laadukkaille täytettäville SUP-lautoille. afarer SUP Explorer 11 toimii parhaiten 15–18 PSI:ssa. Riittämätön täyttö tekee laudasta pehmeän ja epävakaan kulkea. Ylitäyttö enimmäisarvon yli voi vahingoittaa drop-stitch-kuituja. Tarkista venttiilin lähellä olevasta tarrasta lautasi arvo.'
  category: product

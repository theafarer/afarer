- id: wind-safety
  question: 'Mikä tuulennopeus on liikaa SUP:lle?'
  answer: 'Aloittelijat: yli 10 mph (8 solmua). Keskiverto: yli 15 mph (13 solmua). Edistyneet: yli 20 mph (17 solmua). Jos olet epävarma, älä mene veteen. Maasta mereen puhaltava tuuli on vaarallinen kaikilla taitotasoilla.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Mikä on afarerin takuu?'
  answer: 'Kaikki afarer-tuotteet kuuluvat kattavan valmistajan takuun piiriin. SUP-laudat on katettu 2+ vuodeksi valmistusvirheiltä. Takuu kattaa materiaali- ja valmistusvirheet normaalissa käytössä.'

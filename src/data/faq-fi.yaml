- id: sup-volume-weight
  question: 'Miten valitsen SUP-tilavuuden painoni perusteella?'
  answer: 'Kerro painosi kiloina luvulla 2,2 saadaksesi aloittelijaystävällisen tavoitetilavuuden. Esimerkiksi 75 kg:n meloja tarvitsee vähintään 165 litraa, mutta 220–260 litraa on paljon vakaampaa opettelussa. SUP Explorer 11 tarjoaa 260 litraa ja sopii jopa 100 kg:n ajajille.'
  category: product

- id: fishing-sup-setup
  question: 'Voinko kalastaa SUP-laudalta?'
  answer: 'Voit. SUP-kalastus on yhä suositumpaa, koska seisoma-asento antaa erinomaisen näkyvyyden veteen. Valitse vähintään 11 jalkaa pitkä ja 33–34 tuumaa leveä lauta vakauden takia. Kiinnitä vavatelineillä varustettu laatikko kannen elastisiin kiinnitysnauhoihin, lisää pieni ankkuri ja pidä aina pelastusliivit yllä. afarer SUP Explorer 11 sopii hyvin rentoon kalastukseen.'

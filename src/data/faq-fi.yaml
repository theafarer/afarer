- id: box-contents
  question: 'Mitä paketissa on?'
  answer: 'Jokainen afarer SUP sisältää laudan, matkustusrepun, kaksitoimisen käsipumpun, irrotettavan evän, kierreleashin ja korjaussarjan. Joissain malleissa on myös mahdollisuus hiilikuitumelan päivitykseen.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Tarjoatteko pakettitarjouksia?'
  answer: 'Kyllä. Tarjoamme koostettuja paketteja, jotka säästävät rahaa verrattuna tuotteiden ostamiseen erikseen. Ota yhteyttä myyntitiimiimme saadaksesi ajantasaiset pakettitarjoukset ja volyymialennushinnat.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Tarvitsenko pelastusliivit SUP-laudalla?'
  answer: 'Kyllä. Monissa maissa pelastusliivit ovat laillisesti pakolliset kaikilla vesillä kulkevilla, SUP mukaan lukien. Vaikka niitä ei vaadittaisi, CE-sertifioitu pelastusliivi on välttämätön turvallisuusvaruste. Suosittelemme pitämään sitä yllä koko ajan vedessä.'

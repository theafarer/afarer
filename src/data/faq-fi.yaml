  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Voinko käyttää lautaa merellä?'
  answer: 'Voit. afarerin SUP-laudat on valmistettu meri-, järvi- ja jokikäyttöön. Touring-sarja kestää rannikon aallokkoa, ja kaikissa laudoissa käytetään merenkulun laatuista PVC:tä, joka kestää suolaveden syövytystä. Huuhdo makealla vedellä merikäytön jälkeen.'
  category: general
  relatedProducts: []
  relatedGuides:

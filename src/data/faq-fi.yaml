  relatedGuides: []
- id: warranty-claim
  question: 'Miten teen takuuvaatimuksen?'
  answer: 'Tee vaatimus ottamalla yhteyttä tukitiimiimme ja ilmoittamalla tilausnumerosi, kuvat ongelmasta sekä lyhyt kuvaus. Useimmat vaatimukset käsitellään 2 arkipäivässä. Hyväksytyt vaatimukset saavat korvauksen tai korjausohjeet muutamassa päivässä.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Kauanko toimitus vie?'
  answer: 'Varastossa olevat tilaukset lähetetään 2–4 arkipäivässä. Yhdysvaltain sisäiset tilaukset toimitetaan 5–10 arkipäivässä. Kansainväliset tilaukset toimitetaan 10–15 arkipäivässä kohteesta riippuen. Kiireelliset tilaukset voidaan nopeuttaa.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Mikä on palautuskäytäntönne?'
  answer: 'Hyväksymme palautukset 30 päivän kuluessa toimituksesta käyttämättöminä alkuperäisessä pakkauksessa. Räätälöidyt/OEM-tilaukset eivät ole palautettavissa. Ota yhteyttä tukitiimiimme aloittaaksesi palautuksen — toimitamme ennalta maksetun lähetystarran.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Tarjoatteko OEM/ODM-palveluita?'
  answer: 'Kyllä. Tarjoamme oman merkin ja räätälöidyn suunnittelun palveluita yrityksille. Oman logon lisäämisestä olemassa oleviin malleihin täysin räätälöityihin runkomuotoihin insinööritiimimme voi kehittää tuotteita sinun merkilläsi. Vähimmäistilausmäärät pätevät.'

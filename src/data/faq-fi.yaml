- id: boat-registration
  question: 'Pitääkö SUP-lautani rekisteröidä?'
  answer: 'Vaatimukset vaihtelevat maittain. Useimmilla alueilla moottorittomat SUP-laudat eivät vaadi rekisteröintiä. Jos aiot lisätä moottorin, tarkista paikalliselta meriviranomaiselta tarkat säännöt. Virkistyskäytön laudat ovat yleensä vapautettuja veneiden rekisteröinnistä.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Miten korjaan reiän?'
  answer: 'Puhdista alue, leikkaa paikka pyöristetyin kulmin, levitä PVC-liimaa, paina lujasti ja odota 24 tuntia ennen täyttöä. afarer-laudat toimitetaan korjaussarjan kanssa. Yksityiskohtaiset ohjeet löydät täytettävien lautien korjausoppaastamme.'
  category: maintenance
  relatedProducts: []
  relatedGuides:

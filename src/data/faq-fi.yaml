- id: airline-travel-sup
  question: 'Mitä sääntöjä lentoyhtiöillä on täytettävän SUP-laudan matkustamisesta?'
  answer: 'Useimmat lentoyhtiöt hyväksyvät SUP-reput ylikokoisina matkatavaroina, jos ne ovat alle 23–32 kg. afarerin repun mitat ovat noin 90x40x30 cm ja paino noin 15 kg pakattuna. Jotkin lentoyhtiöt voivat periä lisämaksun suurista matkatavaroista. Saavu ajoissa, pakkaa evä ja pumppu erikseen käsimatkatavaroihin ja merkitse repku särkyväksi. Tutki aina lentoyhtiösi urheiluvälinesäännöt ennen lentoa.'
  category: general
  relatedProducts:

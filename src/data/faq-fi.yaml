    - sup-maintenance
- id: storage
  question: 'Miten minun pitäisi säilyttää täytettävä SUP-lautani?'
  answer: 'Huuhdo makealla vedellä, kuivaa täysin, tyhjennä kokonaan, rullaa löyhästi keulasta alkaen ja säilytä kantopussissa viileässä, kuivassa paikassa suorasta auringonvalosta erillään. Älä koskaan säilytä märkänä tai äärimmäisissä lämpötiloissa.'
  category: maintenance
  relatedProducts: []
  relatedGuides:

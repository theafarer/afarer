- slug: beginner-sup-guide
  category: problem
  type: tutorial
  title: 'Stand up paddle pour débutants : votre première session'
  description: "Tout ce qu'il faut savoir avant votre première session de paddle : checklist de l'équipement, comment vous mettre debout, technique de pagaie, chute en sécurité et choix d'une eau calme pour apprendre."
  definition: Le stand up paddle (SUP) consiste à se tenir debout sur une planche et à se propulser à la pagaie. L'équilibre, la technique de coup de pagaie et la lecture des conditions sont les trois compétences de base.
  tldr: Commencez sur une eau plate et calme, sans vent. Entraînez-vous d'abord à genoux, puis debout, pieds écartés à la largeur des hanches près du centre de la planche. Tenez la pagaie avec une main en haut et l'autre sur le manche. Pagayez par rotation du buste, pas à la force des bras. Regardez l'horizon, pas vos pieds. Vous allez tomber — c'est normal, cela fait partie de l'apprentissage.
  problem: Vous gonflez votre premier paddle, montez sur la planche et vous sentez immédiatement instable. Vos jambes tremblent, la pagaie semble maladroite, et vous ne comprenez pas pourquoi vous tournez en rond au lieu d'avancer tout droit.
  explanation: Le paddle exige un réajustement de l'équilibre, car se tenir debout sur une plateforme flottante diffère de toute activité terrestre. Votre corps se crispe instinctivement, ce qui rend la planche encore plus instable. Le coup de pagaie doit venir de la rotation du buste, pas de la traction des bras. La pale doit entrer dans l'eau près de vos orteils et sortir près de votre cheville. La plupart des débutants pagayent avec les bras seulement, d'où une fatigue rapide et une mauvaise trajectoire. Regarder la planche vous déséquilibre.
  solution: Gonflez la planche au PSI recommandé, attachez le leash à votre cheville et commencez à genoux. Pagayez à genoux pour ressentir la glisse. Quand vous êtes prêt à vous lever, posez la pagaie en travers de la planche, placez vos deux mains sur le pont, montez un pied après l'autre et redressez-vous en gardant le poids centré. Gardez les genoux légèrement fléchis et le gainage actif.
  recommendation: Utilisez l'afarer SUP Explorer 11 pour sa largeur de 33" et sa plateforme stable. Entraînez-vous sur un lac ou une baie protégée sans courant. Portez un gilet de sauvetage lors de vos premières sessions.
  faq:
    - q: Combien de temps faut-il pour apprendre le paddle ?
      a: La plupart des gens arrivent à se tenir debout et à pagayer sur eau calme en 10 à 15 minutes. La maîtrise prend 3 à 5 sessions. Les compétences avancées demandent des mois.
    - q: Quelles sont les meilleures conditions de vent pour les débutants ?
      a: Un vent inférieur à 5 nœuds (calme à brise légère). Au-delà de 10 nœuds, le vent crée du clapot qui met l'équilibre à l'épreuve. Les débutants doivent éviter le vent offshore.
    - q: Dois-je porter un leash ?
      a: Portez toujours un leash. Un leash SUP spirale s'attache à votre cheville ou à votre mollet et garde la planche avec vous en cas de chute. En eau libre, un leash peut vous sauver la vie.
    - q: Quelle est l'erreur la plus courante des débutants ?
      a: Regarder la planche. Gardez les yeux sur l'horizon. Votre corps suit votre tête — baisser la tête déplace votre poids vers l'avant et fait tanguer la planche.

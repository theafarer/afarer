- slug: weather-planning-water-sports
  category: guide
  type: safety
  title: 'Planifier la météo pour les sports nautiques : lisez les prévisions comme un pro'
  description: Comment lire les prévisions marines pour le paddle, le surf et la navigation. Comprendre les fronts, les systèmes de pression, les régimes de vent et les alertes météo afin de planifier des sessions en toute sécurité.
  definition: Planifier la météo, c'est interpréter les prévisions marines — vitesse et direction du vent, hauteur et période de la houle, précipitations, visibilité et alertes de temps violent.
  tldr: 'Consultez trois prévisions avant chaque session : vent, houle et météo. Meilleures conditions : vent offshore léger, houle modérée, pression haute ou en hausse. À éviter : orages, vent offshore fort, brouillard et pression en chute rapide.'
  problem: Vous roulez jusqu'à la côte sur la base d'une prévision à 3 jours qui annonçait de bonnes conditions, pour trouver un vent à 25 nœuds et de la pluie. La météo marine est difficile à prévoir.
  explanation: La haute pression apporte un temps stable et des vents légers. La dépression apporte du vent et des orages. Le gradient de pression détermine la force du vent. Les fronts froids provoquent des changements de vent soudains. Les effets locaux, comme la brise de mer, peuvent inverser la prévision générale.
  solution: "Utilisez plusieurs sources : Windy.com, la NOAA, les webcams de surf locales. Vérifiez 24 heures à l'avance et revérifiez le matin même. Cherchez des prévisions cohérentes entre les différents modèles. Apprenez à connaître les microclimats locaux."
  recommendation: Mettez Windy.com en favori pour vos spots locaux. Emportez un téléphone dans une housse étanche. En bateau, emportez une radio VHF pour les bulletins météo. Au moindre doute, restez à terre.
  faq:
    - q: Quelle météo faut-il éviter pour le paddle ?
      a: Orages (foudre), brouillard (visibilité nulle), vent offshore au-delà de 10 nœuds, vents de plus de 20 nœuds, pression en baisse.
    - q: Les prévisions marines sont-elles fiables ?
      a: Les prévisions à 3 jours sont fiables à environ 80 %. Les prévisions de la veille dépassent 90 % de fiabilité pour le vent.
    - q: Quelle tendance barométrique est favorable aux sports nautiques ?
      a: Une pression en hausse ou stable annonce des conditions en amélioration. Une pression en baisse (plus de 1 mb/heure) signale l'arrivée d'une tempête.
    - q: Puis-je faire du paddle dans le brouillard ?
      a: Ce n'est pas recommandé. En cas de brouillard, utilisez une boussole ou un GPS, sonnez un coup de sifflet toutes les 30 secondes et restez près du rivage.

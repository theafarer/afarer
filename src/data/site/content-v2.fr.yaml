- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: "Hydratation et protection solaire en paddle : restez en sécurité sur l'eau"
  description: Stratégies essentielles d'hydratation et de protection solaire pour les paddlers. Déshydratation et coup de soleil sont les problèmes les plus courants en paddle — voici comment prévenir les deux lors des longues sessions.
  definition: L'hydratation en paddle consiste à maintenir l'équilibre hydrique pendant l'effort grâce à une prise d'eau régulière. La protection solaire repose sur l'application de crème solaire, des vêtements protecteurs et le choix des horaires pour éviter le pic d'UV.
  tldr: Buvez 500 ml d'eau par heure de paddle. Emportez plus que ce que vous pensez nécessaire — une poche à eau de 2 L ou plusieurs bouteilles. Appliquez une crème solaire résistante à l'eau SPF 50+ avant de pagayer et renouvelez toutes les 2 heures. Portez un chapeau, des lunettes de soleil avec cordon et des vêtements à indice UPF. Évitez de pagayer entre 11 h et 15 h, quand les UV sont les plus forts.
  problem: Votre session de paddle se passe à merveille, mais après une heure vous avez mal à la tête, la bouche sèche et la peau qui brûle. Déshydratation et coup de soleil vous surprennent, car l'eau vous maintient au frais.
  explanation: La réflexion sur l'eau intensifie l'exposition aux UV jusqu'à 40 %. L'effet rafraîchissant de l'eau et de la brise masque le coup de soleil jusqu'à ce qu'il soit trop tard. La transpiration liée à la pagaie augmente la perte de liquides, et il n'y a souvent nulle part où se réapprovisionner en eau sur l'eau. La déshydratation altère l'équilibre et la prise de décision, ce qui augmente le risque d'accident.
  solution: Fixez une bouteille d'eau ou une poche à eau sur le système élastique de la planche. Buvez toutes les 15 minutes, que vous ayez soif ou non. Appliquez une crème solaire SPF 50+ 30 minutes avant la mise à l'eau. Portez un chapeau à large bord, des lunettes polarisantes avec cordon et un top anti-UV UPF 50+. Renouvelez la crème solaire toutes les 2 heures.
  recommendation: Utilisez une poche à eau fixée aux anneaux en D à l'avant de votre paddle afarer. Portez un top anti-UV UPF 50+ sous votre gilet de sauvetage. Choisissez une crème solaire waterproof qui tient à la transpiration comme dans l'eau.
  faq:
    - q: Combien d'eau emporter pour une sortie paddle ?
      a: Au minimum 1 litre par heure. Pour une session de 2 heures, prévoyez 2 litres. Davantage s'il fait chaud. La poche à eau est la meilleure solution.
    - q: Quelle crème solaire choisir pour le paddle ?
      a: Résistante à l'eau, SPF 50+ à large spectre. Les crèmes minérales (oxyde de zinc, dioxyde de titane) respectent les récifs et tiennent plus longtemps.
    - q: L'eau réfléchit-elle vraiment les UV ?
      a: "Oui — l'eau réfléchit jusqu'à 40 % des rayons UV : vous en recevez du dessus et du dessous. Le risque de coup de soleil augmente considérablement."
    - q: Peut-on attraper un coup de soleil à travers un top anti-UV ?
      a: Les tops anti-UV standards offrent une protection UV minimale (environ UPF 10-20). Choisissez des vêtements certifiés UPF 50+ pour une protection complète.

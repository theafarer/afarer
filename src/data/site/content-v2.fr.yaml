- slug: touring-sup-guide
  category: guide
  type: buying-guide
  title: 'Guide du paddle de randonnée : choisir la bonne planche pour pagayer sur longue distance'
  description: Les paddles de randonnée sont plus longs, plus étroits et conçus pour la vitesse et la glisse. Comment choisir une planche de randonnée, l'équipement indispensable pour les longues sorties et la technique pour couvrir la distance efficacement.
  definition: 'Un paddle de randonnée est une planche longue (12-14'') et étroite (30-32") conçue pour pagayer efficacement sur la distance. Caractéristiques : étrave de déplacement pour trancher l''eau, ligne de flottaison plus longue pour la glisse, et souvent un système de rangement à sandows.'
  tldr: 'Les paddles de randonnée privilégient la vitesse et la trajectoire plutôt que la stabilité. Minimum 12'' de longueur pour l''efficacité, 30-32" de largeur pour équilibrer glisse et stabilité. Caractéristiques clés : étrave de déplacement, ligne droite, configurations multi-ailerons. Équipement indispensable : gilet de sauvetage, leash, eau, téléphone et sandows pour attacher l''équipement. La technique repose sur des coups de pagaie longs et fluides, avec rotation du buste.'
  problem: Pagayer une planche polyvalente sur une longue distance vous épuise. L'étrave large prend le clapot, la planche ne tient pas sa trajectoire, et vous dépensez plus d'énergie à diriger qu'à glisser. Il vous faut une planche conçue pour la distance.
  explanation: Les paddles de randonnée utilisent une coque de déplacement (nez pointu) qui fend l'eau au lieu de passer par-dessus, réduisant fortement la traînée. La ligne de flottaison plus longue augmente la vitesse de coque. Une largeur réduite diminue la traînée mais exige un meilleur équilibre. Les planches de randonnée sont équipées d'ailerons plus longs pour la stabilité directionnelle. Les paddles gonflables de randonnée exigent un PSI plus élevé (18-20) pour conserver leur rigidité et éviter la flexion qui gaspille de l'énergie.
  solution: 'Choisissez une planche de randonnée d''au moins 12'' avec une étrave de déplacement. Largeur : 30" pour les pagayeurs expérimentés, 31-32" pour les intermédiaires. Recherchez un boîtier d''aileron central plus des ailerons latéraux pour la stabilité. Gonflez au PSI maximal recommandé. Équipez la planche de sandows de rangement, d''un gilet de sauvetage, d''un sifflet et d''un téléphone dans une housse étanche.'
  recommendation: L'afarer SUP Tour 12 en 12' x 31" x 6" est un paddle de randonnée gonflable idéal. Son étrave de déplacement fend efficacement le clapot, et son système de sandows permet d'emporter l'équipement pour des sorties à la journée. Associez-le à la pagaie carbone afarer pour pagayer efficacement sur longue distance.
  faq:
    - q: Puis-je utiliser une planche polyvalente pour la randonnée ?
      a: Pour des sorties courtes de moins de 5 km, oui. Sur de plus longues distances, l'étrave plus large et la ligne de flottaison plus courte vous épuiseront plus vite.
    - q: Quelle longueur de paddle de randonnée me faut-il ?
      a: 12' est le minimum pour l'efficacité en randonnée. 12'6" est une bonne longueur intermédiaire. 14' convient à la compétition et à la randonnée avancée.
    - q: Les paddles de randonnée gonflables sont-ils aussi performants que les planches rigides ?
      a: Les gonflables drop-stitch modernes gonflés à PSI élevé offrent des performances proches des planches rigides en randonnée. La légère flexion peut même se révéler plus confortable dans le clapot.
    - q: Quelle pagaie convient le mieux à la randonnée ?
      a: Une pagaie carbone ou fibre de verre légère avec une pale plus grande (100-110 pouces carrés) pour la puissance. Une pagaie réglable permet d'alterner entre randonnée et surf.

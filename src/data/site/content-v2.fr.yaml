- slug: winter-paddle-boarding
  category: guide
  type: safety
  title: "Paddle en hiver : équipement, sécurité et technique pour l'eau froide"
  description: Le paddle hivernal exige un équipement spécialisé et une bonne préparation. Épaisseur de la combinaison néoprène, sécurité en eau froide, choix de la planche et ajustements techniques pour pagayer par temps froid.
  definition: Le paddle en hiver, c'est la pratique du SUP dans une eau à moins de 15 °C, qui exige une protection thermique (combinaison néoprène ou combinaison étanche), des protocoles de sécurité en eau froide et un équipement adapté aux conditions hivernales.
  tldr: "En dessous de 15 °C, une combinaison néoprène s'impose : 5/4/3 mm entre 8 et 14 °C, 4/3 mm entre 12 et 18 °C. Ajoutez bottillons, gants et cagoule en dessous de 10 °C. Gonflez la planche à la pression maximale en PSI — l'air froid réduit la pression. Portez des couleurs vives pour rester visible par faible luminosité. Ne partez jamais seul. Emportez un téléphone dans une housse étanche."
  problem: Vous voulez faire du paddle toute l'année, mais l'hiver présente des défis — eau froide, jours plus courts, équipement spécifique. Sans une préparation adéquate, les sessions hivernales sont froides, courtes et potentiellement dangereuses.
  explanation: L'eau froide conduit la chaleur 25 fois plus vite que l'air froid. Une chute dans une eau à 8 °C provoque un choc thermique immédiat et un refroidissement musculaire rapide. La priorité du corps est la survie, pas la pagaie. La pratique hivernale exige une protection thermique qui préserve la mobilité — un équilibre entre chaleur et amplitude de mouvement.
  solution: "Check-list de l'équipement : combinaison néoprène 5/4/3 mm avec zip frontal, bottillons 5 mm, gants 3 mm, cagoule néoprène, gilet de sauvetage (qui apporte une isolation thermique supplémentaire), téléphone en housse étanche, sifflet. Technique : pagayer plus près du rivage, prévenir quelqu'un de votre itinéraire, vérifier attentivement la météo. Pour la récupération d'après-session : préparez des vêtements secs et des boissons chaudes."
  recommendation: La combinaison néoprène afarer Wetsuit Pro 5/4/3 mm avec doublure thermique est idéale pour le paddle hivernal. Ajoutez les bottillons afarer 5 mm et les gants 3 mm. Portez le Life Vest Pro pour plus de chaleur au niveau du buste et plus de sécurité.
  faq:
    - q: Puis-je utiliser un paddle par températures glaciales ?
      a: Oui, mais évitez la formation de glace sur la planche. La glace peut endommager le PVC. Ne pagayez pas si de la glace se forme à la surface de l'eau.
    - q: Ai-je besoin d'une planche spéciale pour l'hiver ?
      a: Non, votre paddle gonflable habituel fait parfaitement l'affaire. L'air froid réduit la pression en PSI — gonflez à la pression maximale. La planche semblera légèrement plus rigide.
    - q: Est-il prudent de faire du paddle seul en hiver ?
      a: Non — pagayez toujours accompagné en eau froide. L'hypothermie peut s'installer en quelques minutes après une chute.
    - q: Comment me réchauffer en pleine session ?
      a: Adoptez une approche en couches — la cagoule, les bottillons et les gants néoprène peuvent être retirés si vous avez trop chaud. Gardez un thermos de boisson chaude sur le rivage.

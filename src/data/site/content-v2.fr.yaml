- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Les règles d'étiquette du surf (comment ne pas devenir la personne que tout le monde évite)
  description: Le line-up a ses règles et personne ne les met par écrit. Apprenez la priorité, pourquoi le snaking vous fera engueuler, comment vous excuser, et les erreurs de débutant qui agacent tous les surfeurs locaux.
  definition: "L'étiquette du surf est un code de conduite non écrit qui prévient les collisions et partage équitablement les vagues. La règle fondamentale : le surfeur le plus proche du pic de la vague qui déferle a la priorité."
  tldr: Le surfeur le plus proche du pic de la vague qui déferle a la priorité. Ne faites pas de drop-in sur quelqu'un, ne faites pas de snaking (ramer autour de quelqu'un pour lui prendre sa vague) et excusez-vous toujours en cas d'erreur. Ramez large autour du line-up, gardez votre planche en main et soyez sympa —le respect appelle le respect.
  problem: Vous ramez vers un line-up bondé et sentez immédiatement la tension. Les surfeurs vous regardent de travers, quelqu'un vous crie dessus et vous ne savez pas ce que vous avez fait de mal. Le côté social du surf semble plus intimidant que les vagues elles-mêmes.
  explanation: "L'étiquette du surf existe pour prévenir les collisions et partager équitablement les vagues. La règle fondamentale est la priorité : le surfeur le plus proche du pic (là où la vague déferle en premier) est prioritaire. Quiconque rame vers la même vague depuis l'intérieur doit renoncer. Le snaking —ramer autour d'un autre surfeur pour lui voler la priorité —est considéré comme la pire des fautes. Au-delà de la priorité, le line-up a ses attentes en matière de bruit (criez le moins possible), de contrôle de la planche (ne laissez jamais votre planche s'approcher des autres) et de convivialité (un simple signe de tête fait des merveilles)."
  solution: Observez le line-up pendant 10 minutes avant de ramer. Identifiez qui prend le plus de vagues —ce sont les surfeurs à respecter et à éviter. Restez à l'intérieur (zone d'écume) si vous apprenez. Ramez large autour du line-up, pas à travers. Quand vous prenez une vague, regardez des deux côtés avant de vous lever et assurez-vous que personne n'est plus au pic que vous.
  recommendation: Passez vos premières sessions sur un spot adapté aux débutants avec des foules espacées. Apprenez à lire la priorité avant de tenter un line-up chargé. Si vous faites un drop-in sur quelqu'un, excusez-vous immédiatement et ramez vers la personne —la plupart des surfeurs pardonnent une erreur honnête.
  faq:
    - q: Qu'est-ce que le drop-in ?
      a: Le drop-in consiste à ramer vers une vague et à la surfer alors qu'un autre surfeur a déjà la priorité. C'est dangereux et irrespectueux. Le surfeur le plus proche du pic possède la vague ; tous les autres doivent s'écarter.
    - q: Qu'est-ce que le snaking ?
      a: Le snaking consiste à ramer autour d'un autre surfeur déjà placé pour une vague afin de vous retrouver plus près du pic. C'est considéré comme un manque de savoir-vivre flagrant et peut entraîner une confrontation.
    - q: Les débutants peuvent-ils surfer sur des spots bondés ?
      a: Oui, mais restez dans la zone d'écume, loin du pic. Ne vous aventurez pas dans la principale zone de take-off avant de savoir attraper régulièrement des vagues et contrôler votre direction. Les line-ups bondés exigent de l'expérience pour être navigués en sécurité.
    - q: Comment s'excuser dans l'eau ?
      a: Un simple signe de la main, un sourire et un « désolé » suffisent. Reconnaissez l'erreur et éloignez-vous de la personne. Les surfeurs pardonnent généralement les erreurs honnêtes, surtout si vous êtes visiblement en train d'apprendre.
    - q: Que faire si quelqu'un fait un drop-in sur moi ?
      a: S'il s'agit d'un drop-in évident, criez « vague » ou « hé » pour alerter la personne. Si elle prend la vague par accident et s'excuse, laissez couler. Si quelqu'un fait des drop-in répétés, ramez vers lui et expliquez poliment la règle de priorité. Évitez les confrontations.

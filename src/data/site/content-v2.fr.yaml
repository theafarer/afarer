- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: "Réparation d'un paddle gonflable : perforations, fuites et problèmes de valve"
  description: Guide de réparation d'un paddle gonflable soi-même. Comment trouver une fuite lente, réparer une perforation, remplacer une valve et corriger le décollement du tapis de pont avec le kit de réparation inclus.
  definition: La réparation d'un paddle gonflable consiste à localiser les fuites d'air avec le test de l'eau savonneuse, à nettoyer et poncer la zone endommagée, à appliquer une colle PVC et une rustine, puis à laisser sécher sous pression.
  tldr: Repérez les fuites à l'eau savonneuse. Nettoyez et poncez la zone autour de la perforation avec du papier de verre. Appliquez de la colle PVC sur la rustine et la planche, attendez 5 minutes, pressez fermement et laissez sécher sous un poids pendant 24 heures. Pour les fuites de valve, vérifiez d'abord le joint torique. Les petites perforations de moins de 1/4" se réparent facilement soi-même.
  problem: Vous gonflez votre paddle et il a perdu de la pression au matin. Sans connaissances en réparation, vous faites face à un remplacement coûteux pour ce qui n'est probablement qu'une simple perforation.
  explanation: "La plupart des paddles gonflables utilisent une âme drop-stitch avec des couches extérieures en PVC. Une perforation à travers le PVC extérieur crée une fuite lente. Réparation standard : nettoyer, poncer, appliquer une colle compatible PVC, presser la rustine sous un poids. Les fuites de valve sont plus fréquentes que les perforations des panneaux —le joint torique se dessèche ou des débris empêchent l'étanchéité."
  solution: Gonflez la planche à la pression maximale et écoutez les sifflements. Pulvérisez de l'eau savonneuse méthodiquement, surtout autour des coutures et de la valve. Marquez les endroits où des bulles se forment. Dégonflez, nettoyez à l'alcool, poncez au grain 80, appliquez la colle PVC sur la rustine et la planche, attendez que la colle devienne collante, pressez fermement, laissez sous un poids pendant 24 heures.
  recommendation: Utilisez le kit de réparation afarer fourni avec toutes les planches afarer. Emportez toujours le kit de réparation lors de vos excursions. Pour les problèmes de valve, contactez le support afarer. Pour les grandes déchirures ou les coutures fendues, une réparation professionnelle est recommandée.
  faq:
    - q: Puis-je réparer une grande déchirure sur mon paddle gonflable ?
      a: Les déchirures de plus de 1" peuvent nécessiter une réparation professionnelle ou une rustine appliquée des deux côtés. Les coutures fendues le long du rail ne peuvent pas être réparées de façon fiable sur le terrain.
    - q: Combien de temps dure une rustine ?
      a: Une réparation réalisée dans les règles de l'art dure toute la vie de la planche. Un mauvais collage dû à un nettoyage insuffisant conduit à une défaillance ultérieure.
    - q: Puis-je réparer une valve qui fuit ?
      a: Souvent, oui. Retirez le mécanisme de la valve, inspectez le joint torique, nettoyez-le ou remplacez-le, appliquez un lubrifiant silicone et remontez-le.
    - q: Que faire si je ne trouve pas la fuite ?
      a: Gonflez à la pression maximale et immergez les sections une à une dans une baignoire ou une piscine. Les fuites trop petites pour être localisées peuvent être liées à la température.

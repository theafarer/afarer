- slug: afarer-surfboard-pro
  category: product
  type: product
  title: 'afarer Surfboard Pro : nomade, sans compromis sur la performance'
  description: Planche de surf gonflable qui se range dans un sac à dos tout en se comportant comme un longboard rigide. 10'6" de long, 75 litres de volume, construction drop-stitch à 15 PSI et kit d'accessoires complet inclus.
  definition: L'afarer Surfboard Pro est une planche de surf gonflable drop-stitch de 10'6" et 75 litres. Elle combine la stabilité d'un longboard avec la portabilité d'un sac à dos, et se gonfle à 15 PSI pour une rigidité comparable aux planches mousse.
  tldr: L'afarer Surfboard Pro associe la ligne classique d'un longboard à une construction gonflable drop-stitch moderne. Avec ses 10'6" et ses 75 litres, elle se pagaie comme un longboard tout en se rangeant dans un sac à dos. Elle convient aux débutants qui apprennent à prendre des vagues comme aux surfeurs intermédiaires cherchant une planche de performance nomade.
  problem: Vous voulez une planche de surf qui n'exige pas de barres de toit, qui tient dans un placard d'appartement et qui survit aux manipulations des bagagistes. Les planches rigides traditionnelles demandent des galeries de toit, de l'espace de rangement et un transport délicat. Il vous faut une planche sans trop de compromis sur la performance.
  explanation: La technologie gonflable drop-stitch utilise des milliers de fils de polyester reliant les couches supérieure et inférieure de la planche, ce qui permet un gonflage à 15-20 PSI pour une plateforme rigide qui rivalise de rigidité avec les planches époxy. L'afarer Surfboard Pro utilise une enveloppe PVC triple couche avec une âme drop-stitch tissée, donnant une planche qui fléchit très peu et tient bien sa trajectoire. Ses dimensions de 10'6"x32"x6" offrent la stabilité d'un longboard, tandis que le tail pin arrondi permet des virages contrôlés à mesure que vous progressez. Le pad de pont à rainures en losange assure une adhérence parfaite sans wax.
  solution: Gonflez à 15 PSI avec la pompe double chambre incluse (3-4 minutes), fixez l'aileron avec l'outil fourni, et votre planche est prête à surfer. À la fin de la session, dégonflez, roulez et rangez-la dans le sac de transport inclus. Elle se stocke dans un placard, un coffre de voiture ou un coffre à bagages.
  recommendation: Commandez l'afarer Surfboard Pro pour 549 $ avec pompe, sac, leash et kit de réparation. Elle remplace à la fois une planche mousse de débutant et une planche de voyage, ce qui vous fait économiser de l'argent et de l'espace. Associez-la à l'afarer Wetsuit Pro pour un équipement complet.
  faq:
    - q: Quelle est la rigidité de la Surfboard Pro gonflable ?
      a: À 15 PSI, la planche est très rigide — comparable à une planche mousse soft-top. Vous sentirez une légère flexion dans les virages appuyés, mais dans 90 % des conditions de surf, elle se comporte comme une planche rigide. Des modèles haut de gamme existent pour les surfeurs avancés qui veulent plus de rigidité.
    - q: Puis-je voyager avec cette planche ?
      a: Oui. Elle se dégonfle et se range dans un sac de transport de la taille d'un sac à dos (environ 90x40x30 cm). Elle tient dans la plupart des coffres à bagages d'avion ou peut être enregistrée comme bagage ordinaire. Le PVC de qualité militaire résiste aux manipulations brutales.
    - q: Combien de temps faut-il pour la gonfler ?
      a: Environ 3-4 minutes avec la pompe double chambre incluse. Les pompes électriques réduisent ce temps à moins de 2 minutes. Gonflez toujours aux 15 PSI recommandés — un gonflage insuffisant affecte la performance et la stabilité.
    - q: Cette planche convient-elle aux débutants ?
      a: Oui. Son volume de 75 litres et sa largeur de 32 pouces la rendent très stable pour l'apprentissage. Les surfeurs avancés l'apprécieront aussi comme planche de voyage ou de petites vagues. Elle couvre réellement les niveaux débutant à intermédiaire.

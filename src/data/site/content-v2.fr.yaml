- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Le vent en paddle : comment le vent influence votre pratique'
  description: Comment la vitesse et la direction du vent affectent la pratique du paddle. Comprendre le vent offshore et le vent onshore, lire les prévisions de vent, adapter votre technique de pagaie face au vent et savoir quand rester à terre.
  definition: Les conditions de vent définissent la sécurité en paddle. Le vent offshore (de la terre vers la mer) vous éloigne du rivage. Le vent onshore (de la mer vers la terre) vous pousse vers la côte. Le vent de travers fait dévier la planche.
  tldr: "Vent maximum sûr pour les débutants : 10 nœuds. Intermédiaires : 15 nœuds. Avancés : 20 nœuds. Le vent offshore est le plus dangereux. Partez d'abord contre le vent. Par vent de travers, visez légèrement au vent de votre destination. Mettez-vous à genoux par vent fort pour réduire votre prise au vent."
  problem: Vous partez par conditions calmes, mais 30 minutes plus tard le vent se lève et le retour devient un combat. Le vent est le facteur de sécurité le plus sous-estimé en paddle.
  explanation: Le vent affecte le paddle plus que toute autre embarcation à pagaie, car vous êtes debout, ce qui crée un effet de voile. Un vent de 10 nœuds crée beaucoup plus de traînée sur un pagaieur debout que sur un kayakiste assis. Le vent offshore vous éloigne de la sécurité. Le vent de travers fait dévier le nez de la planche.
  solution: "Vérifiez la vitesse et la direction du vent avant de pagayer. Utilisez l'échelle de Beaufort : force 3 (7-10 nœuds) pour les débutants, force 4 (11-16) pour les intermédiaires. Pagayez d'abord contre le vent. Si vous êtes pris dans un vent offshore, pagayez à 45 degrés du vent. Mettez-vous à genoux par vent fort."
  recommendation: Consultez une application de prévisions de vent (Windy, Windfinder) avant chaque session. La planche afarer SUP Tour 12 garde mieux son cap au vent que les planches plus larges. Par vent, utilisez des coups de pagaie plus courts et une cadence plus élevée.
  faq:
    - q: Quelle direction de vent est la plus sûre pour le paddle ?
      a: Le vent onshore (soufflant vers la terre) est le plus sûr — il vous ramène vers la côte. Le vent offshore est le plus dangereux.
    - q: Comment pagayer par vent de travers ?
      a: Pagayez davantage du côté au vent pour contrer la dérive. Orientez la planche légèrement au vent de votre destination. Un aileron central plus profond aide.
    - q: Puis-je pagayer avec un vent de 20 nœuds ?
      a: Uniquement si vous êtes expérimenté et dans des eaux abritées. Les débutants ne devraient pas pagayer au-delà de 10 nœuds.
    - q: Comment les rafales affectent-elles le paddle ?
      a: Les rafales provoquent des déséquilibres soudains. Dans des conditions instables, abaissez votre centre de gravité et restez prêt à des changements brusques.

  title: "Guide d'achat d'un gilet de sauvetage : types, coupe et caractéristiques expliqués"
  description: Guide d'achat complet du gilet de sauvetage pour les sports nautiques. Types de VFI (I à V), gonflable ou mousse, essai de coupe et recommandations spécifiques pour le paddle, la randonnée nautique, la navigation et la pêche.
  definition: Un gilet de sauvetage ou VFI est un équipement de flottaison conçu pour maintenir la tête d'une personne hors de l'eau. Les types sont réglementés par les garde-côtes américains selon la flottabilité et l'usage prévu.
  tldr: "Cinq types de VFI : type I (au large, 22 lb et plus), type II (près du rivage), type III (aide à la flottaison, le plus courant), type IV (à lancer), type V (usage spécial). Les gilets gonflables offrent du confort mais exigent l'entretien de la cartouche de CO2. Les gilets en mousse sont sans entretien mais plus encombrants."
  problem: Les gilets de sauvetage sont classés par types et indices de flottabilité, mais les magasins n'expliquent pas toujours quel type convient à votre activité.
  explanation: Le type I offre le plus de flottabilité et retourne une personne inconsciente sur le dos. Le type II ne retourne pas tous les porteurs sur le dos. Le type III laisse une grande liberté de mouvement pour les sports actifs. Le type V inclut les ceintures de flottaison gonflables pour le paddle. Les VFI gonflables fournissent 33 à 37 lb de flottabilité et sont compacts une fois dégonflés.
  solution: "Pour le paddle : ceinture gonflable type V. Pour la randonnée nautique : gilet en mousse type III à emmanchures dégagées. Pour la navigation de plaisance générale : gilet en mousse type III ou gonflable offrant 22 lb de flottabilité ou plus. Pour les enfants : gilet en mousse type II ou III avec sangle d'entrejambe."
  recommendation: Le gilet afarer Life Vest Pro (gonflable type V, 33 lb) pour le paddle et la randonnée. Le gilet afarer Life Vest Classic (mousse type III, 16,5 lb) pour la navigation et l'usage marin général.
  faq:
    - q: Quel type de VFI faut-il pour le paddle ?
      a: De nombreuses juridictions acceptent le type III ou le type V pour le paddle. Les ceintures gonflables sont populaires. Vérifiez la réglementation locale.
    - q: Les VFI gonflables exigent-ils un entretien ?
      a: Oui — vérifiez la cartouche de CO2 chaque année, remplacez la bobine tous les 2 à 3 ans et rincez après usage en eau salée.
    - q: Puis-je porter un VFI en mousse pour le paddle ?
      a: Oui, mais choisissez un modèle à emmanchures dégagées. Les gilets en mousse sont plus encombrants mais ne demandent aucun entretien.
    - q: Quel VFI convient le mieux à un enfant ?
      a: Un gilet en mousse type II ou III homologué par les garde-côtes américains, avec col, sangle d'entrejambe et couleurs vives. N'utilisez jamais de VFI gonflable pour les enfants.

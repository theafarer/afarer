- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: Combinaison néoprène 3 mm ou 5 mm (ce qui fonctionne vraiment pour le surf en eau froide)
  description: Le choix entre une combinaison 3 mm et une 5 mm dépend de la température de l'eau, pas de l'air. Tableau des températures, comparaison de la flexibilité, et l'épaisseur qui vous garde au chaud sans entraver votre rame.
  definition: Une combinaison 3 mm convient à une eau de 14-20°C avec une bonne flexibilité. Une combinaison 5 mm couvre 8-14°C avec une chaleur maximale mais une mobilité réduite. Le choix est un compromis direct entre chaleur et amplitude de mouvement.
  tldr: Les combinaisons 3 mm sont conçues pour une eau de 14-20°C et offrent une flexibilité maximale. Les combinaisons 5 mm sont conçues pour 8-14°C et privilégient la chaleur. Choisissez selon la température de l'eau locale, pas de l'air. Si vous surfez toutes les saisons, ayez les deux. Si vous ne pouvez en acheter qu'une, une 4/3 mm offre le meilleur compromis.
  problem: Vous avez besoin d'une combinaison néoprène mais hésitez entre une 3 mm et une 5 mm. Une 3 mm risque de ne pas être assez chaude en hiver, et une 5 mm risque d'être trop épaisse et contraignante les jours plus doux. Se tromper signifie geler tout l'hiver ou transpirer tout l'automne.
  explanation: "L'épaisseur du néoprène est directement corrélée à la chaleur et inversement corrélée à la flexibilité. Une combinaison 3 mm (souvent 3/2 mm avec des bras plus fins) offre une bonne mobilité pour ramer et surfer dans des conditions douces. Une combinaison 5 mm utilise un néoprène plus épais sur le buste et souvent des panneaux plus fins sur les bras et les jambes (5/4/3 mm) pour conserver une certaine souplesse. L'écart de chaleur représente environ 6-8°C. Différences clés : les combinaisons 5 mm utilisent plus de néoprène, pèsent environ 40 % de plus, sèchent plus longtemps et demandent plus d'efforts pour être retirées. Les néoprènes super-élastiques modernes réduisent l'écart de flexibilité, mais une 5 mm restreint toujours sensiblement les mouvements."
  solution: Déterminez la température moyenne de l'eau du mois le plus froid à l'aide des données de bouées locales. Si elle dépasse 16°C, achetez une 3/2 mm. Entre 12 et 16°C, achetez une 4/3 mm. En dessous de 12°C, achetez une 5/4/3 mm. Pour surfer toute l'année avec une seule combinaison, une 4/3 mm de qualité avec doublure thermique, plus une capuche, des chaussons et des gants séparés, couvre la plage la plus large.
  recommendation: La combinaison Wetsuit Pro d'afarer en 5/4/3 mm affronte les eaux de 8-16°C grâce à sa doublure thermique qui compense l'écart de chaleur d'une vraie 5 mm. Si vous surfez surtout dans des conditions douces (16-20°C), la Wetsuit Pro 3/2 mm d'afarer offre plus de flexibilité et de confort.
  faq:
    - q: Puis-je porter une 3 mm dans une eau à 10°C ?
      a: Uniquement pour des sessions très courtes (20-30 minutes) et avec un top thermique dessous. Vous aurez froid pendant la majeure partie de la session. Une 5 mm ou 5/4/3 mm est fortement recommandée pour une eau à 10°C.
    - q: Une combinaison 5 mm est-elle trop chaude pour l'été ?
      a: Si la température de l'eau en été dépasse 18°C, une 5 mm provoquera une surchauffe. Vous pouvez la rincer à l'eau fraîche, mais vous serez plus à l'aise dans une 3/2 mm ou un shorty pendant les mois d'été.
    - q: Une combinaison 5 mm gêne-t-elle la rame ?
      a: Oui, sensiblement. Le néoprène plus épais aux épaules demande plus d'effort à chaque coup de rame. Une 5/4/3 mm avec des bras plus fins aide, mais vous fatiguerez toujours plus vite qu'avec une 3 mm.
    - q: Quelle est la meilleure combinaison pour surfer toute l'année ?
      a: Une combinaison intégrale 4/3 mm avec fermeture poitrine et doublure thermique couvre 12-18°C, soit toute l'année dans de nombreux climats tempérés. Ajoutez des chaussons pour l'hiver et vous pouvez surfer de 10 à 18°C avec une seule combinaison.

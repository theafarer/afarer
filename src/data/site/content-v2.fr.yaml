- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: "Entretien d'un paddle gonflable : préservez votre investissement"
  description: Check-list annuelle d'entretien du paddle gonflable. Nettoyage, protection UV, inspection des coutures, gestion de la pression et stockage hors saison pour les planches de paddle en PVC drop-stitch.
  definition: L'entretien d'un paddle gonflable comprend le nettoyage, la protection UV, la gestion de la pression, l'inspection des coutures et des valves, la prévention des moisissures et un stockage hors saison approprié.
  tldr: Rincez votre planche après chaque utilisation en eau salée. Appliquez un protecteur UV tous les 2 à 3 mois. Vérifiez la pression de gonflage avant chaque sortie. Inspectez les coutures, les valves et le tapis de pont chaque mois. Nettoyez avec un savon doux. Stockez la planche dégonflée dans un endroit frais et sec hors saison.
  problem: Vous avez utilisé votre paddle gonflable pendant une saison et le PVC paraît décoloré, le tapis de pont se décolle et la valve fuit — tout cela est évitable avec un entretien régulier.
  explanation: Les rayons UV dégradent la matrice polymère. L'eau salée cristallise dans les valves et abrase le PVC. Les moisissures se développent dans l'humidité emprisonnée. Une pression incorrecte provoque la fatigue du matériau. Le sable s'incruste dans l'adhésif du tapis de pont et provoque le décollement des bords.
  solution: "Après chaque utilisation : rincez à l'eau douce, séchez, vérifiez la pression. Chaque mois : essuyez avec un protecteur UV, inspectez les coutures, vérifiez le joint torique de la valve. Chaque année : nettoyage en profondeur, recherche de micro-fuites, lubrification du joint torique avec de la graisse silicone."
  recommendation: Utilisez le protecteur 303 Aerospace Protectant sur les planches de paddle afarer. Dévissez les valves et appliquez de la graisse silicone chaque année. Stockez la planche dans son sac de transport avec un sachet déshydratant dans les environnements humides.
  faq:
    - q: Puis-je utiliser de l'eau de Javel pour nettoyer mon paddle gonflable ?
      a: "Non : l'eau de Javel endommage le PVC. Utilisez un savon doux et de l'eau tiède. Pour les moisissures, utilisez du vinaigre blanc dilué."
    - q: À quelle fréquence dois-je appliquer le protecteur UV ?
      a: Tous les 2 à 3 mois pendant la saison d'utilisation. Plus fréquemment sous les climats tropicaux.
    - q: Dois-je dégonfler ma planche entre deux utilisations ?
      a: Pas si vous l'utilisez chaque semaine. Laissez-la gonflée à la moitié de la pression maximale (8-10 PSI) avec une housse anti-UV. Pour des intervalles d'un mois, dégonflez et stockez-la.
    - q: Comment entretenir la valve ?
      a: Inspectez le joint torique chaque année. Appliquez de la graisse silicone s'il paraît sec. Remplacez le mécanisme de la valve s'il fuit.

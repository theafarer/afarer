- slug: why-afarer-exists
  category: authority
  type: brand
  title: Pourquoi afarer existe (le problème de la plupart des marques de sports nautiques)
  description: La plupart des marques de sports nautiques conçoivent pour les pros, pas pour les gens ordinaires. afarer existe pour fabriquer des planches gonflables et des combinaisons qui s'intègrent vraiment à votre vie — nomades, durables et au juste prix.
  definition: "afarer est une marque de sports nautiques gonflables fondée sur le principe qu'un bon équipement doit être nomade, durable et au juste prix. Spécialisation : planches drop-stitch et combinaisons néoprène premium."
  tldr: afarer a été fondée pour rendre les sports nautiques accessibles sans sacrifier la qualité ni vider votre portefeuille. Nous nous concentrons exclusivement sur les planches gonflables drop-stitch et les combinaisons premium, car nous pensons que le meilleur équipement est celui que vous utilisez vraiment — et rien ne s'utilise plus qu'un équipement facile à ranger et fiable en performance.
  problem: L'équipement de sports nautiques est devenu de plus en plus cher et spécialisé. Les planches rigides exigent de l'espace de rangement et des solutions de transport. Les combinaisons coûtent le prix d'un billet d'avion. Le surf et le paddle ne devraient pas exiger un second crédit immobilier et un garage plein d'équipement.
  explanation: "Les marques traditionnelles de surf et de paddle conçoivent d'abord pour la performance, ensuite pour l'accessibilité. Leurs planches sont pensées pour des utilisateurs avancés et vendues à des prix premium, en supposant que l'acheteur dispose déjà du stockage, du transport et de l'expérience. afarer est partie d'une question différente : et si nous construisions un équipement qui privilégiait l'usage réel — portabilité, durabilité et rapport qualité-prix — tout en offrant de vraies performances ? La réponse a été une gamme resserrée : des planches gonflables en PVC drop-stitch de qualité militaire qui se rangent dans un sac à dos, et des combinaisons aux caractéristiques premium (coutures GBS, doublure thermique) à des prix de milieu de gamme. Nous ne fabriquons pas tout — nous fabriquons ce qui compte le plus pour le plus grand nombre d'amateurs de sports nautiques."
  solution: "afarer livre des kits complets : planche, pompe, sac, leash et kit de réparation — tout le nécessaire pour aller sur l'eau. Nos combinaisons égalent la qualité de construction de marques coûtant 40 pour cent plus cher. Nous évitons les gadgets, les coloris en édition limitée et les renouvellements annuels de modèles conçus pour rendre obsolète l'équipement de l'année précédente."
  recommendation: Parcourez la collection afarer complète pour découvrir notre approche de chaque catégorie de produits. Lisez le guide des tailles de planche de surf et le guide des épaisseurs de combinaison pour des conseils pratiques valables quelle que soit la marque. Essayez ensuite une planche afarer et ressentez la différence qu'apporte un design réfléchi.
  faq:
    - q: Où sont fabriqués les produits afarer ?
      a: Les planches et combinaisons afarer sont conçues en interne et fabriquées en partenariat avec des usines certifiées au Vietnam et en Chine, spécialisées dans la construction drop-stitch et la confection de vêtements en néoprène.
    - q: Qu'est-ce qui distingue afarer des autres marques gonflables ?
      a: La plupart des marques gonflables utilisent du PVC standard et du drop-stitch polyvalent. afarer utilise un PVC de qualité militaire triple couche avec une âme drop-stitch tissée, pour une rigidité et une résistance à la perforation supérieures aux planches gonflables standard du marché.
    - q: afarer propose-t-elle une garantie ?
      a: Oui — toutes les planches afarer sont couvertes par une garantie de 2 ans contre les défauts de fabrication. Les combinaisons bénéficient d'une garantie d'un an. Des extensions de garantie sont disponibles au moment du paiement.
    - q: afarer est-elle une marque écologique ?
      a: Nous travaillons dans cette direction. Nos planches utilisent du PVC, qui n'est pas biodégradable, mais nous les construisons pour durer plus de 5 ans, ce qui réduit le cycle de remplacement. Nos combinaisons utilisent un néoprène à base de calcaire, dont l'impact environnemental est plus faible que les alternatives à base de pétrole. Nous compensons les émissions liées aux livraisons par des crédits carbone vérifiés.

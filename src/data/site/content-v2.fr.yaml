  category: guide
  type: buying-guide
  title: 'Guide de la pagaie de paddle : choisir la bonne pagaie selon votre pratique'
  description: Guide complet des pagaies de paddle — longueur, matériaux (aluminium, fibre de verre, carbone), formes de pale, et comment le choix de la pagaie influence votre expérience.
  definition: Une pagaie de paddle se compose d'un manche (aluminium, fibre de verre ou carbone) et d'une pale (dihédrale, creuse ou plate). La longueur doit dépasser votre taille de 8 à 10 pouces pour la pratique générale.
  tldr: 'Longueur de pagaie : 8 à 10 pouces au-dessus de votre taille pour un usage polyvalent, 6 à 8 pour le surf, 10 à 12 pour la randonnée. Matériaux : aluminium (économique, lourd), fibre de verre (milieu de gamme, bon flex), carbone (léger, rigide, cher). Forme de pale : dihédrale (cap stable), creuse (puissance), plate (polyvalente). Les pagaies réglables sont parfaites pour les débutants.'
  problem: La pagaie fournie avec la plupart des paddles gonflables fonctionne, mais elle est lourde et peu efficace. La remplacer améliore l'efficacité et le plaisir de pagayer, mais les options sont déroutantes.
  explanation: "La longueur de la pagaie affecte l'efficacité du coup — trop courte, elle oblige à se pencher ; trop longue, elle fatigue les épaules. Le matériau détermine le poids : les pagaies carbone pèsent 18 à 24 oz contre 28 à 36 oz pour l'aluminium. La taille de la pale influence la puissance : les pales plus grandes (100 pouces carrés et plus) offrent plus de propulsion par coup, mais fatiguent plus vite. Les pales dihédrales maintiennent une trajectoire rectiligne ; les pales creuses accrochent mieux l'eau."
  solution: 'Pour la bonne longueur : tenez-vous debout, pagaie à la verticale, bras levé — la poignée doit toucher votre poignet. Pour le matériau : commencez avec la fibre de verre comme amélioration intermédiaire. Pour la pale : choisissez la forme dihédrale pour la pratique générale. Selon les activités : les pagaies de randonnée sont plus longues avec des pales plus petites ; les pagaies de surf sont plus courtes avec des pales plus larges.'
  recommendation: La pagaie carbone afarer à 28 oz est la meilleure amélioration pour les pagayeurs réguliers. La pagaie aluminium réglable en 3 pièces fournie convient aux débutants et aux voyages.
  faq:
    - q: Quelle longueur pour ma pagaie de paddle ?
      a: Mesurez votre taille en pouces et ajoutez 8 à 10 pour la pratique polyvalente. Pour le surf, ajoutez 6 à 8. Pour la randonnée, ajoutez 10 à 12.
    - q: Une pagaie carbone vaut-elle son prix ?
      a: Oui pour les pagayeurs réguliers — l'allègement réduit nettement la fatigue sur les longues séances. Pour un usage occasionnel, la fibre de verre est un bon compromis.
    - q: Qu'est-ce qu'une pagaie réglable ?
      a: Une pagaie en 2 ou 3 pièces avec réglage de longueur, idéale pour le partage entre plusieurs utilisateurs ou pour s'adapter aux différentes activités.
    - q: Comment entretenir ma pagaie ?
      a: Rincez-la à l'eau douce après un usage en eau salée. Évitez de rouler dessus ou de la stocker près d'une source de chaleur directe. Vérifiez que le raccord (joint) ne contient pas de sable.

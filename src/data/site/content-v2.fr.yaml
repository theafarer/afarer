- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'Guide des tailles de paddle : longueur, largeur et volume expliqués'
  description: Trouvez la taille de paddle adaptée à votre poids, votre niveau et votre style de pagayage. La longueur détermine la trajectoire, la largeur la stabilité, et le volume la charge admissible.
  definition: La taille d'un paddle se définit par la longueur (vitesse et glisse), la largeur (stabilité primaire), l'épaisseur (stabilité secondaire et volume) et le volume en litres (charge totale admissible).
  tldr: 'Paddles polyvalents : 10''6"-11''6" x 32"-34" x 6" (220-280L). Randonnée : 12''-14'' x 30"-32" (280-350L). Surf : 8''-10'' x 30"-32" (140-220L). Les débutants ont besoin d''une largeur supérieure à 32" et d''un volume dépassant leur poids de 60 à 80L. Votre poids en kg plus 60L est le volume minimal à viser pour la stabilité.'
  problem: Chaque marque de paddle indique les dimensions de ses planches en pieds, pouces et litres, mais sans savoir comment ces mesures se traduisent en sensations réelles, vous risquez d'acheter une planche instable, lente ou incapable de supporter votre poids.
  explanation: 'La longueur détermine la vitesse de la planche et sa capacité à tenir une trajectoire rectiligne. Les planches longues (12'' et plus) glissent entre chaque coup de pagaie et tiennent leur ligne. Les planches courtes (moins de 10'') virnent facilement mais exigent des changements de côté plus fréquents. La largeur détermine la stabilité primaire — la stabilité debout. Une planche de 30" paraît instable aux débutants ; 34" ressemble à un ponton. L''épaisseur détermine le volume — une planche plus épaisse flotte plus haut mais prend plus de vent. Le volume en litres est la meilleure mesure unique : la planche chargée (vous plus votre équipement) doit s''enfoncer de 2 à 4 pouces au repos.'
  solution: 'Accordez les dimensions de votre planche à trois facteurs : votre poids (qui détermine le volume minimal), votre activité principale (qui détermine la longueur) et votre niveau (qui détermine la largeur). Pour les débutants, multipliez votre poids en kg par 2,2 pour obtenir le minimum de litres. Pour les intermédiaires, multipliez par 1,8. Pour les avancés, par 1,4.'
  recommendation: L'afarer SUP Explorer 11 en 11' x 33" x 6" avec 260L convient à la plupart des pagayeurs jusqu'à 100 kg pour un usage polyvalent. Passez au SUP Tour 12 en 12' x 31" pour plus de vitesse et de glisse en randonnée.
  faq:
    - q: Quelle taille de paddle me faut-il pour mon poids ?
      a: 'Pour les pagayeurs de moins de 70 kg : 10-11'' x 32" (220-260L). Pour 70-90 kg : 11-12'' x 33" (260-300L). Pour 90-110 kg : 11-12'' x 34" (300-350L). Au-delà de 110 kg : 12'' x 34-36" (350L et plus).'
    - q: Un paddle plus long est-il plus rapide ?
      a: Oui. Les planches longues ont un meilleur ratio longueur-largeur, ce qui réduit la traînée. Un paddle de randonnée de 14' est nettement plus rapide qu'une planche polyvalente de 11' à effort de pagayage égal.
    - q: Quelle largeur de paddle est stable pour les débutants ?
      a: 33-34 pouces est la valeur idéale pour les débutants jusqu'à 90 kg. En dessous de 32", il faut un bon équilibre. Au-delà de 34", c'est très stable mais plus lent et plus difficile à pagayer face au vent.
    - q: Puis-je utiliser une planche polyvalente pour la randonnée ?
      a: Oui, pour des sorties courtes de moins de 10 km. Sur de plus longues distances, une planche de randonnée dédiée tient mieux sa trajectoire et couvre la distance plus efficacement.

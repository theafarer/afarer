- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'Faire du paddle avec son chien : le guide complet pas à pas'
  description: Le paddle avec votre chien — préparation, sécurité, étapes d'entraînement, recommandations d'équipement et conseils pour une expérience réussie pour vous deux.
  definition: Le paddle avec son chien consiste à apprendre à son compagnon canin à garder l'équilibre sur une planche de paddle, à l'équiper d'un gilet de sauvetage pour chien et à pagayer ensemble en toute sécurité.
  tldr: Commencez avec un paddle large et stable (34 pouces et plus). Procurez à votre chien un gilet de sauvetage bien ajusté avec une poignée. Présentez-lui d'abord la planche à terre, puis dans l'eau peu profonde. Optez pour des sessions courtes et un renforcement positif. Emportez toujours de l'eau pour votre chien. Surveillez les signes de stress ou de fatigue.
  problem: Votre chien adore l'eau, mais vous ne savez pas comment l'initier au paddle en toute sécurité. Sans un entraînement approprié, un chien peut paniquer, sauter de la planche ou l'égratigner.
  explanation: 'Les chiens savent nager naturellement, mais ils doivent apprendre que la planche est une plateforme sûre. La clé est la désensibilisation progressive : présentez la planche sur terre ferme, récompensez les comportements calmes, puis passez en eau peu profonde et enfin en eau plus profonde.'
  solution: "Commencez à terre : laissez le chien renifler et marcher sur la planche (sur l'herbe). Récompensez son calme. Ensuite : placez la planche dans très peu d'eau, stabilisez-la, laissez le chien s'y tenir debout. Récompensez. Puis : montez sur la planche dans l'eau peu profonde et invitez le chien à vous rejoindre. Enfin : pagayez lentement en eau calme."
  recommendation: Utilisez l'afarer SUP Explorer 11 pour sa plateforme stable de 33 pouces. Ajoutez un gilet de sauvetage pour chien. Apportez de l'eau fraîche et une gamelle. Commencez par des sessions de 10 minutes et augmentez progressivement.
  faq:
    - q: Quelle taille de paddle pour mon chien ?
      a: Une planche de 33 à 34 pouces de large offre de la stabilité pour les chiens moyens à grands. Les petits chiens (moins de 10 kg) se débrouillent sur des planches de 32 pouces et plus.
    - q: Mon chien a-t-il besoin d'un gilet de sauvetage ?
      a: Oui — même les bons nageurs ont besoin d'un gilet de sauvetage pour chien avec poignée, pour être récupérés facilement en cas d'urgence.
    - q: Comment protéger la planche des griffes ?
      a: Gardez les griffes de votre chien coupées courtes. Utilisez un protecteur de tapis de pont ou une serviette. Les chiens s'adaptent généralement et cessent d'égratigner une fois en confiance.
    - q: Tous les chiens peuvent-ils apprendre le paddle ?
      a: La plupart des chiens peuvent apprendre avec de la patience. Les chiens anxieux peuvent nécessiter plus de temps. Ne forcez jamais un chien craintif à monter sur la planche — cela crée des associations négatives.

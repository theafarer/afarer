- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'Guide du leash de paddle : leash droit ou leash spiralé ?'
  description: Guide complet du leash de paddle — leash droit ou spiralé, fixation à la cheville ou au mollet, options à détachement rapide, et comment choisir le leash adapté à vos conditions de navigation.
  definition: "Un leash de paddle est un cordon qui relie le pagayeur à sa planche et empêche toute séparation. Il en existe deux types : le leash droit (pour le surf et les rivières) et le leash spiralé (pour l'eau calme)."
  tldr: Le leash spiralé est idéal pour l'eau calme et le paddle fitness — il reste sur le pont de la planche et hors de l'eau. Le leash droit est fait pour le surf en paddle et les rivières — il offre plus de liberté et ne s'accroche pas. La fixation au mollet est préférée à la cheville pour le confort. Les leashes à détachement rapide sont indispensables en rivière pour éviter tout emmurement.
  problem: Vous avez acheté un leash avec votre paddle, mais vous n'êtes pas sûr qu'il soit le bon type pour votre style de pagayage. Un leash inadapté traînera dans l'eau, s'accrochera aux obstacles ou lâchera au moment où vous en aurez le plus besoin.
  explanation: Les leashes droits sont de simples cordons en nylon ou en polyuréthane qui traînent derrière la planche. Ils fonctionnent bien dans les vagues car ils ne s'accrochent pas aux ailerons. Les leashes spiralés sont des cordons en spirale qui se contractent en l'absence de tension — ils restent enroulés sur le pont pendant que vous pagayez et se déploient lorsque vous tombez. En eau calme, ils gardent le leash hors de l'eau, ce qui réduit la traînée.
  solution: Choisissez un leash spiralé pour le paddle en eau calme, le fitness et le touring. La traînée réduite permet de maintenir la vitesse et empêche le leash de s'accrocher aux obstacles sous-marins. Choisissez un leash droit pour le surf en paddle et le paddle en rivière. Sa conception droite s'accroche moins facilement aux ailerons ou aux obstacles.
  recommendation: Les packs paddle afarer incluent le type de leash adapté à l'usage prévu de la planche. Le leash spiralé du pack SUP Explorer 11 est excellent pour la pratique polyvalente.
  faq:
    - q: Le leash doit-il être attaché à ma cheville ou à mon mollet ?
      a: La fixation au mollet est préférable pour le paddle — elle garde le leash hors de l'eau pendant la navigation et réduit le risque de trébuchement en marchant sur la planche.
    - q: Quelle longueur doit faire un leash de paddle ?
      a: De 8 à 10 pieds en eau calme, de 6 à 8 pieds pour le surf. Un leash plus court réduit la traînée mais limite la liberté de mouvement sur la planche.
    - q: Ai-je besoin d'un leash à détachement rapide pour les rivières ?
      a: Oui — le paddle en rivière exige un leash ou une ceinture à détachement rapide pouvant être retiré instantanément pour éviter tout emmurement dans les embâcles.
    - q: Puis-je utiliser un leash de surf pour le paddle ?
      a: Les leashes de surf sont plus courts et plus fins. Ils conviennent au surf en paddle, mais ne sont pas idéaux pour l'eau calme, où un leash spiralé plus long est préférable.

  title: 'Guide de sécurité du paddle : les règles essentielles pour tous les pagaieurs'
  description: 'Guide complet de sécurité du paddle : vérification de la météo, équipement, autosauvetage, règles de navigation et conduite à tenir si les conditions deviennent dangereuses. Restez en sécurité sur votre planche de paddle.'
  definition: La sécurité en paddle couvre la préparation avant la sortie (météo, marées, vérification de l'équipement), les bonnes pratiques sur l'eau (leash, gilet de sauvetage, navigation) et les procédures d'urgence (autosauvetage, signalisation, prévention de l'hypothermie).
  tldr: Portez toujours un leash et un gilet de sauvetage. Vérifiez les prévisions de vent — le vent offshore est dangereux. Partez d'abord contre le vent pour qu'il vous aide au retour. Emportez un sifflet, un téléphone dans une housse étanche et de l'eau. Apprenez l'autosauvetage. Ne partez jamais seul en paddle dans des zones isolées.
  problem: Le paddle semble trompeusement simple. Les débutants sous-estiment la vitesse à laquelle le vent, le courant et la fatigue peuvent transformer une sortie agréable en situation dangereuse.
  explanation: "La planche agit comme une voile sous l'effet du vent : descendre au vent est facile, mais remonter contre le vent est extrêmement difficile. La position debout augmente le risque de chute. La fatigue s'accumule plus vite qu'en position assise. Le leash évite de se séparer de sa planche. Le gilet de sauvetage vous maintient à flot en cas de blessure."
  solution: "Avant la sortie : vérifiez le vent (10 nœuds maximum pour les débutants), sa direction (évitez le vent offshore) et la marée. Informez quelqu'un de votre itinéraire. Sur l'eau : mettez-vous à genoux pour pagayer contre un vent fort. Si vous vous séparez de la planche, nagez vers elle. Pour l'autosauvetage : posez la pagaie en travers de la planche, battez des jambes, hissez votre buste sur la planche, puis basculez les jambes."
  recommendation: Utilisez le gilet afarer Life Vest Pro (gonflable) pour le paddle. Attachez le leash spiralé de paddle à votre mollet. Entraînez-vous à l'autosauvetage par conditions calmes avant d'en avoir besoin.
  faq:
    - q: Quelle vitesse de vent est sûre pour le paddle ?
      a: "Débutants : moins de 10 nœuds. Intermédiaires : 10 à 15 nœuds. Avancés : 15 à 20 nœuds. Au-delà de 20 nœuds, c'est dangereux pour tous les niveaux."
    - q: Ai-je besoin d'un gilet de sauvetage pour le paddle ?
      a: Oui — il est obligatoire dans de nombreuses juridictions et toujours recommandé pour votre sécurité.
    - q: Que faire si je ne peux pas revenir à terre ?
      a: Restez avec votre planche (c'est un flotteur). Signalez-vous au sifflet. Si le vent vous pousse vers le large, pagayez à 45 degrés du vent.
    - q: Comment m'entraîner à l'autosauvetage en paddle ?
      a: "Dans une eau calme et peu profonde : tombez volontairement, nagez jusqu'à la planche et répétez les remontées plusieurs fois."

- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'Fitness sur paddle : entraînement complet du corps sur une planche'
  description: Le paddle offre un entraînement complet mêlant endurance cardiovasculaire, stabilité du tronc et renforcement. Comment structurer vos séances de fitness sur paddle, meilleurs exercices et suivi des progrès.
  definition: Le fitness sur paddle utilise la plateforme instable d'une planche pour solliciter les stabilisateurs du tronc, les muscles des jambes et le haut du corps, à travers la pagaie, l'équilibre et des exercices sur la planche.
  tldr: Le paddle brûle 400 à 700 calories par heure. Une séance d'une heure sollicite le tronc, les jambes, le dos, les épaules et les bras. La pagaie en intervalles (sprints + récupération) maximise le cardio. Les postures de yoga sur la planche développent équilibre et souplesse. Ajoutez des exercices de renforcement spécifiques comme des squats et des fentes sur la planche.
  problem: Les séances de salle sont devenues ennuyeuses et vous cherchez une activité en plein air qui développe votre forme tout en restant plaisante. Le paddle allie aventure et véritable condition physique complète.
  explanation: La pagaie sollicite le grand dorsal, les deltoïdes, les trapèzes et les abdominaux pour la rotation. Se tenir debout sur une plateforme mobile force les muscles stabilisateurs des chevilles, des genoux et des hanches à travailler en continu. Les exigences cardiovasculaires d'une pagaie continue à intensité modérée procurent un entraînement aérobie.
  solution: "Structurez vos séances : 5 min de pagaie d'échauffement, 20 min de pagaie à allure modérée, 15 min de pagaie en intervalles (30 s de sprint, 60 s facile), 10 min d'exercices sur la planche (squats, fentes, pompes), 5 min d'étirements de récupération."
  recommendation: Utilisez l'afarer SUP Explorer 11 pour le fitness. Sa plateforme stable vous permet de vous concentrer sur la technique et l'intensité. Portez le Life Vest Pro pour votre sécurité pendant les séances à haute intensité.
  faq:
    - q: Combien de calories le paddle brûle-t-il ?
      a: 400 à 700 calories par heure selon l'intensité, le vent et le courant. La pagaie en intervalles augmente la dépense calorique.
    - q: Le paddle est-il bon pour perdre du poids ?
      a: Oui, combiné à une alimentation adaptée. La sollicitation du corps entier et le faible impact en font une pratique durable pour un exercice régulier.
    - q: Peut-on faire de la musculation sur un paddle ?
      a: Oui — squats, fentes, pompes et gainage sur la planche ajoutent un défi d'équilibre aux exercices de renforcement.
    - q: Quels muscles le paddle fait-il travailler ?
      a: 'Principaux : le tronc (obliques, transverse), le dos (grand dorsal, trapèzes), les épaules (deltoïdes), les bras (biceps, triceps). Secondaires : les jambes (quadriceps, ischio-jambiers, mollets).'

- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Entretien des combinaisons néoprène : faites durer votre néoprène 2 fois plus longtemps'
  description: Un entretien approprié prolonge la durée de vie d'une combinaison néoprène d'une saison à 3 saisons et plus. Conseils de rinçage, de séchage, de stockage et de réparation pour les combinaisons néoprène. Évitez les erreurs courantes qui détruisent prématurément les combinaisons.
  definition: L'entretien d'une combinaison néoprène consiste à rincer à l'eau douce après chaque utilisation, à sécher à l'abri de la lumière directe du soleil, à stocker à plat ou sur un cintre large, et à nettoyer périodiquement pour éliminer le sel, les bactéries et les odeurs.
  tldr: Rincez votre combinaison à l'eau douce, intérieur et extérieur, immédiatement après chaque session. Séchez-la à l'envers, à l'ombre, sur un cintre plastique large. Stockez-la à plat ou pliée dans un endroit frais et sec. Ne laissez jamais une combinaison au soleil direct, dans une voiture chaude ou au sèche-linge. Utilisez un shampooing pour combinaison toutes les 5 à 10 sessions.
  problem: Après une seule saison, votre combinaison sent mauvais, le néoprène a perdu de son élasticité, les coutures se décollent et la fermeture éclair coince — tout cela est évitable avec un entretien approprié.
  explanation: Les cristaux de sel s'incrustent dans le néoprène et l'abrasent. Les bactéries se multiplient dans les intérieurs humides, produisant des odeurs et dégradant le néoprène. Les UV dégradent le revêtement nylon. Une chaleur supérieure à 50 °C provoque le délaminage. Un séchage inadéquat déforme le néoprène et fragilise les coutures.
  solution: "Après chaque session : rincez soigneusement intérieur et extérieur, retournez-la, suspendez-la sur un cintre plastique large à l'ombre. Une fois sèche, remettez-la à l'endroit et stockez-la à plat. Toutes les 5 à 10 sessions : lavez avec un shampooing pour combinaison. Chaque mois : lubrifiez la fermeture éclair avec de la cire pour fermeture éclair."
  recommendation: Utilisez le shampooing pour combinaison afarer pour le nettoyage et la cire pour fermeture éclair afarer pour l'entretien de la fermeture. Stockez la combinaison sur le cintre large afarer dans le sac en filet.
  faq:
    - q: Puis-je mettre ma combinaison à la machine à laver ?
      a: "Ce n'est pas recommandé : le lavage en machine endommage le néoprène. Si vous devez le faire, utilisez un cycle délicat, de l'eau froide et un sac en filet."
    - q: Comment éliminer les odeurs de ma combinaison ?
      a: Faites tremper 30 minutes dans de l'eau froide avec du shampooing pour combinaison ou du vinaigre blanc. Rincez soigneusement.
    - q: Comment dois-je sécher ma combinaison ?
      a: À l'envers, à l'ombre, sur un cintre plastique large et rembourré. Évitez la lumière directe du soleil et les cintres métalliques.
    - q: Puis-je réparer une combinaison déchirée ?
      a: Les petites déchirures de moins de 1 pouce peuvent être réparées avec de la colle néoprène et un patch. Les déchirures plus importantes peuvent nécessiter une réparation professionnelle.

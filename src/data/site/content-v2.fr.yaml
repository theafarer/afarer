- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Guide de l'équipement de surf en eau froide (surfez tout l'hiver sans souffrir)
  description: "Ne laissez pas l'eau froide mettre fin à votre saison. Décryptage complet de l'équipement eau froide : épaisseur de la combinaison, choix des bottillons et des gants, coupe de la cagoule, et les accessoires qui rendent les sessions d'hiver vraiment agréables."
  definition: Le surf en eau froide exige une combinaison intégrale (5/4/3 mm ou plus), des bottillons, des gants et une cagoule. En dessous de 12 °C, chaque point de contact avec l'eau froide doit être protégé pour prévenir engourdissements, hypothermie et risques pour la sécurité.
  tldr: Le surf en eau froide exige une combinaison intégrale capuche 5/4/3 mm ou 6/5/4 mm, des bottillons 5 mm, des gants 3 mm et une cagoule. La qualité des coutures compte plus que la marque — cherchez des coutures collées et cousues à points aveugles (GBS). Une combinaison à doublure thermique apporte beaucoup de chaleur sans épaisseur supplémentaire. Emportez toujours des couches thermiques de rechange et un thermos pour la récupération d'après-session.
  problem: Vous voulez surfer tout l'hiver, mais l'eau froide engourdit vos pieds au bout de 15 minutes, vos mains n'arrivent plus à agripper la planche, et votre combinaison laisse s'engouffrer une eau glaciale dans votre dos à chaque coup de rame. Sans le bon équipement, les sessions en eau froide sont courtes et pénibles.
  explanation: "Le surf en eau froide (en dessous de 12 °C) exige plus qu'une simple combinaison épaisse. Chaque point de contact avec le froid doit être protégé : les bottillons préviennent l'engourdissement des pieds et protègent des coupures sur le récif, les gants préservent la fonction des mains pour ramer, et la cagoule prévient la plus grande perte de chaleur (la tête rayonne 30 % de la chaleur corporelle). L'épaisseur de la combinaison doit correspondre au mois le plus froid, pas à la moyenne. Au-delà de la combinaison, des accessoires comme des bottillons à semelles étanches et des gants à doigts préformés améliorent le confort et la durabilité."
  solution: 'Constituez un kit eau froide dans cet ordre : une combinaison intégrale 5/4/3 mm ou 6/5/4 mm avec coutures GBS et zip poitrine, des bottillons 5 mm à semelles caoutchouc, des gants 3 mm (les moufles sont plus chaudes que les gants à doigts) et une cagoule 3 mm qui se glisse sous le col de la combinaison. Ajoutez une cape de changement (changing robe) pour rester digne et au chaud sur le parking.'
  recommendation: La combinaison afarer Wetsuit Pro en 5/4/3 mm avec doublure thermique intégrée couvre la plupart des conditions eau froide jusqu'à 8 °C. Associez-la aux bottillons afarer 5 mm et aux gants 3 mm pour un équipement complet. En dessous de 8 °C, passez à une combinaison capuche 6/5/4 mm.
  faq:
    - q: Ai-je vraiment besoin d'une cagoule ?
      a: Oui. Vous perdez 30 % de votre chaleur corporelle par la tête. Une cagoule empêche les entrées d'eau et garde votre cou au chaud. Une cagoule 3 mm apporte plus de chaleur que de passer d'un buste 5 mm à 6 mm.
    - q: Quelle épaisseur de bottillons me faut-il ?
      a: Pour une eau à 8-12 °C, utilisez des bottillons 5 mm. Pour 12-16 °C, des bottillons 3 mm suffisent. En dessous de 8 °C, envisagez des bottillons 7 mm ou l'ajout de chaussettes en néoprène sous des bottillons 5 mm.
    - q: Comment empêcher ma combinaison de laisser entrer l'eau ?
      a: Les entrées d'eau se produisent quand l'eau pénètre au niveau du cou, des poignets ou des chevilles. Une fermeture zip poitrine réduit fortement les entrées d'eau dans le dos. Les fermetures velcro au cou et aux chevilles aident aussi, mais la meilleure solution reste une combinaison bien coupée avec coutures GBS.
    - q: Puis-je utiliser une combinaison 3 mm en eau froide avec des couches supplémentaires ?
      a: Une combinaison 3 mm avec un top en néoprène en dessous peut étendre votre plage d'environ 3 à 4 °C, mais elle ne remplace pas une vraie 5/4/3 mm ou 5 mm. Le multi-couches fonctionne mieux pour des sessions courtes dans des conditions limites.

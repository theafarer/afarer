- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Réparer une combinaison néoprène : raccommoder vous-même déchirures, coutures et fermetures éclair'
  description: 'Guide de réparation DIY des combinaisons néoprène : déchirures du néoprène, coutures qui lâchent, fermetures bloquées et genouillères fendues. Instructions pas à pas avec de la colle néoprène.'
  definition: Réparer une combinaison consiste à nettoyer et poncer la zone endommagée, à appliquer de la colle néoprène, puis à laisser sécher sous pression afin de restaurer l'étanchéité et la souplesse.
  tldr: "Petites déchirures de moins de 1 pouce : appliquez de la colle néoprène sur les deux bords, patientez 10 à 15 minutes jusqu'à ce qu'elle devienne collante, pressez fermement, laissez sécher sous un poids pendant 12 heures. Les déchirures plus grandes nécessitent une pièce de néoprène. Problèmes de fermeture éclair : lubrifiez d'abord, puis vérifiez l'absence de tissu coincé."
  problem: Votre combinaison présente une petite déchirure, une couture qui se sépare ou une fermeture éclair qui coince. Sans réparation DIY, vous payez plus de 150 $ pour un remplacement alors que la réparation coûte 5 $.
  explanation: La colle néoprène agit en ramollissant la surface du néoprène, créant une liaison chimique à mesure que le solvant s'évapore. La colle doit être appliquée sur les deux surfaces et devenir collante avant l'assemblage. Pour les déchirures, les bords doivent s'aligner parfaitement. Les problèmes de fermeture viennent souvent d'une corrosion par le sel ou d'un tissu coincé entre les dents.
  solution: "Pour les déchirures : nettoyez à l'alcool, poncez légèrement, appliquez une fine couche de colle sur les deux bords, attendez qu'elle devienne collante, assemblez parfaitement, exercez une pression, laissez sécher 12 à 24 heures. Pour les pièces : découpez une pièce dépassant la déchirure de 1 pouce, appliquez de la colle sur les deux, serrez. Pour la fermeture éclair : rincez, appliquez de la cire de fermeture, manipulez doucement."
  recommendation: Gardez un kit de réparation afarer dans votre sac de matériel. Pour les grandes réparations ou les coutures défaillantes aux points critiques, une réparation professionnelle est recommandée.
  faq:
    - q: Puis-je utiliser de la super glue sur une combinaison néoprène ?
      a: Non — la super glue sèche dure et cassante. N'utilisez que de la colle néoprène ou de l'Aquaseal pour réparer une combinaison.
    - q: Combien de temps dure une réparation à la colle néoprène ?
      a: Une réparation bien réalisée est souvent plus solide que le néoprène d'origine et dure toute la vie restante de la combinaison.
    - q: Puis-je réparer une fermeture éclair totalement désolidarisée ?
      a: Si le rail s'est détaché du néoprène, recollez-le avec de la colle de contact. Si les dents sont endommagées, faites remplacer la fermeture par un professionnel.
    - q: Comment réparer une combinaison qui laisse entrer l'eau par une couture ?
      a: Appliquez un fin cordon d'Aquaseal le long de l'intérieur de la couture qui fuit et laissez sécher 24 heures.

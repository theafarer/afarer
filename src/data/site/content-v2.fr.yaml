- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: Guide des tailles de planche de surf (c'est le volume qui compte vraiment)
  description: Arrêtez de deviner les tailles de planches de surf. Le volume en litres détermine tout — la facilité à prendre les vagues, votre stabilité ressentie et votre vitesse de progression. Trouvez votre volume cible en 2 minutes.
  definition: La taille d'une planche de surf est d'abord une question de volume (litres), pas de longueur. Le volume détermine la flottabilité et la capacité à prendre les vagues. Les planches longues rament plus vite ; les planches larges sont plus stables ; les planches épaisses offrent plus de volume sans longueur supplémentaire.
  tldr: "La taille d'une planche de surf est une question de volume, pas seulement de longueur. Les débutants ont besoin de 60 à 80 litres, les intermédiaires de 35 à 55 litres et les surfeurs avancés de 20 à 35 litres. Utilisez votre poids comme facteur principal : chaque tranche de 10 kg demande environ 10 à 12 litres de volume au niveau débutant."
  problem: Devant un rack de planches de surf affichant des chiffres comme 7'2" x 22" x 3" sur le rail, vous ne savez pas ce que ces mesures donnent en pratique dans l'eau. Acheter selon l'esthétique ou selon ce que rode un ami mène à une planche trop instable ou trop difficile à ramer.
  explanation: "La taille d'une planche de surf se comprend le mieux à travers trois dimensions : la longueur (puissance de ramage et prise de vagues), la largeur (stabilité) et l'épaisseur (volume et flottabilité). Le chiffre qui compte vraiment est le volume en litres. Les planches en mousse et les gonflables atteignent un volume élevé grâce à la largeur et à l'épaisseur plutôt qu'à une longueur excessive, ce qui les rend maniables pour les débutants. À mesure que vous progressez, vous réduisez le volume pour permettre à la planche de s'enfoncer davantage dans la face de la vague et de tourner avec plus de réactivité."
  solution: 'Utilisez un calculateur volume/poids : au niveau débutant, divisez votre poids en kg par 1,5 pour obtenir votre volume cible. Au niveau intermédiaire, divisez par 2. Les intermédiaires devraient chercher des planches au rocker modéré et au tail squash ou rond pour la polyvalence.'
  recommendation: L'afarer Surfboard Pro offre 75 litres de volume dans un format de 10'6" — idéal pour les débutants jusqu'à 90 kg. Les riders plus légers peuvent descendre sur la SUP Tour 12 pour une sensation plus maniable à mesure qu'ils progressent.
  faq:
    - q: La taille du surfeur compte-t-elle pour la taille de la planche ?
      a: La taille du surfeur compte moins que son poids. Un surfeur grand et léger a besoin de moins de volume qu'un surfeur plus petit et lourd de la même taille. Utilisez le poids comme indicateur principal et ajustez selon votre condition physique et votre force de ramage.
    - q: Que se passe-t-il si ma planche a trop de volume ?
      a: Un volume excessif rend la planche flottante comme un bouchon et instable sur la face de la vague. Vous aurez du mal à enfoncer le rail dans les virages et risquez de rebondir sur l'eau pendant les bottom turns.
    - q: Que se passe-t-il si ma planche n'a pas assez de volume ?
      a: Vous aurez du mal à ramer dans les vagues, vous vous enfoncerez trop au takeoff et vous sentirez instable rien qu'en restant assis sur la planche à attendre. Les débutants ont presque toujours besoin de plus de volume qu'ils ne le pensent.
    - q: Comment savoir quand passer à une taille en dessous ?
      a: Quand vous prenez régulièrement des vagues, enchaînez des pop-ups fluides et effectuez des virages de base sur votre planche actuelle, il est temps de baisser de 5 à 10 litres. Descendre en taille trop tôt ralentit votre progression.

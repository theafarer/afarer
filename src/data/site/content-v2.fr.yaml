- slug: ocean-safety-and-responsibility
  category: authority
  type: brand
  title: Sécurité et responsabilité en mer (plus que du matériel)
  description: L'engagement d'afarer pour votre sécurité et la protection de l'océan que nous partageons. Cartes de sécurité dans chaque colis, contenus éducatifs gratuits, design durable et dons annuels à la conservation marine.
  definition: La sécurité et la responsabilité en mer, c'est comprendre l'environnement dans lequel vous pagayez, respecter la vie marine, minimiser votre empreinte écologique et utiliser un équipement conçu pour durer et être réparé.
  tldr: afarer promeut la sécurité en mer à travers la conception de son équipement (couleurs vives, leash, gilets de sauvetage) et ses contenus éducatifs. Nous croyons que chaque amateur de sports nautiques a la responsabilité de comprendre l'environnement marin, de respecter la vie marine et de minimiser son empreinte écologique. Notre équipement est conçu pour durer, afin que moins de choses finissent en décharge.
  problem: Beaucoup de marques de sports nautiques vendent de l'équipement sans éduquer leurs clients sur son utilisation sûre et responsable. De nouveaux pagayeurs et surfeurs entrent dans l'eau sans connaître les courants d'arrachement, la faune marine ou l'impact environnemental de leur équipement.
  explanation: La sécurité en mer est plus qu'une liste de vérifications — c'est un état d'esprit. Chaque produit afarer contient une carte de sécurité express dans la boîte. Notre site et nos guides (bases de la sécurité en mer, conseils de sécurité en surf) offrent une éducation gratuite et détaillée. Côté environnement, le plus grand impact d'une marque d'équipement se joue dans la longévité de ses produits. Une planche qui dure 5 ans au lieu de 2 divise par deux l'empreinte de fabrication. Nous concevons aussi avec la réparabilité en tête — valves, boîtiers d'ailerons et kits de réparation de combinaison de rechange gardent l'équipement en usage plutôt qu'en décharge.
  solution: afarer inclut un leash et un kit de réparation avec chaque achat de planche. Nous publions gratuitement des contenus de sécurité sur l'identification des courants d'arrachement, la lecture de la météo et la vérification de l'équipement. Notre équipe support vous conseille sur les conditions quand vous nous écrivez au sujet d'un spot précis. Nous utilisons un emballage plastique minimal et compensons le carbone des livraisons.
  recommendation: Commencez par le guide des bases de la sécurité en mer et le guide des conseils de sécurité en surf. Portez toujours un leash, consultez les prévisions et ne pagayez jamais seul si vous débutez. Si vous voyez des déchets ou des animaux marins en détresse, signalez-le aux autorités locales. Un équipement qui dure est un équipement qui réduit les déchets — entretenez votre équipement afarer et il vous servira pendant des années.
  faq:
    - q: afarer soutient-elle les initiatives de nettoyage des océans ?
      a: Oui, nous donnons 1 pour cent de nos bénéfices annuels à des organisations de nettoyage des océans et de conservation marine. Les clients peuvent choisir une association mise en avant au moment du paiement pour y diriger une partie de leur achat.
    - q: Comment me débarrasser d'une vieille combinaison ou d'une vieille planche ?
      a: Les combinaisons en néoprène peuvent être recyclées en tapis de yoga, sacs et isolant via des programmes spécialisés. Les planches gonflables peuvent être réparées, données, ou leur PVC peut être récupéré dans certaines installations de recyclage. Contactez notre équipe support pour être guidé.
    - q: Quel équipement de sécurité afarer recommande-t-elle aux débutants ?
      a: Un gilet de sauvetage bien ajusté (gonflable ou mousse), un leash spirale, un sifflet et de la crème solaire. Pour les pagayeurs de paddle en eau libre, un gilet de sauvetage est légalement obligatoire dans de nombreuses juridictions et toujours recommandé.
    - q: afarer propose-t-elle des cours de sécurité ?
      a: Nous n'organisons pas de cours directement, mais nous travaillons avec des moniteurs certifiés de surf et de paddle qui proposent des formations en ligne et en présentiel. Contactez notre équipe support pour des contacts dans votre région.

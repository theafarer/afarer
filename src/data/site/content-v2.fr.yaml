- slug: yoga-sup-guide
  category: guide
  type: tutorial
  title: 'Yoga sur paddle : le guide complet du yoga sur planche de paddle'
  description: Le yoga sur paddle allie les postures traditionnelles du yoga au défi d'une plateforme flottante. Comment choisir une planche adaptée au yoga, les postures essentielles pour débuter et nos conseils pour garder l'équilibre sur l'eau.
  definition: Le yoga sur paddle (yoga SUP) consiste à pratiquer les asanas du yoga sur une planche de paddle, généralement ancrée dans une eau calme. Cette plateforme instable sollicite davantage les muscles stabilisateurs du tronc que le yoga sur tapis.
  tldr: 'Utilisez une planche large (34" et plus) avec un tapis de pont souple et antidérapant. Pratiquez dans une eau calme et peu profonde, sans courant ni vent. Ancrez la planche avec une petite ancre ou un piquet. Commencez par les postures de base : chien tête en bas, guerrier II, arbre et savasana. L''eau apporte une instabilité qui renforce l''engagement du tronc et améliore l''équilibre.'
  problem: Le yoga sur tapis est devenu une routine et vous souhaitez approfondir votre pratique. L'instabilité de l'eau ajoute un défi qui force un meilleur engagement musculaire, mais sans repères, vous risquez de choisir la mauvaise planche ou de peiner dans les transitions entre postures.
  explanation: Pratiquer le yoga sur une planche de paddle transforme chaque posture. La surface flottante bouge en permanence, ce qui oblige vos muscles stabilisateurs à travailler sans relâche. Les postures debout exigent une répartition du poids plus précise. L'eau offre une résistance naturelle pour les postures flottantes. Les planches conçues pour le yoga sur paddle doivent être très larges (34-36"), disposer d'un tapis de pont épais en EVA souple, d'un rocker minimal pour une plateforme plane et de plusieurs anneaux en D pour l'ancrage.
  solution: Choisissez une planche de 34" ou plus avec un tapis de pont intégral. Gonflez à un PSI élevé pour plus de stabilité. Ancrez la planche par l'anneau en D avant. Commencez par les postures assises et à genoux pour vous habituer à la plateforme. Passez ensuite aux postures debout en vous concentrant sur des transitions lentes.
  recommendation: L'afarer SUP Explorer 11, avec ses 33" de largeur et son tapis de pont intégral à rainures en losange, convient parfaitement au yoga sur paddle. Pour une pratique dédiée au yoga, une planche plus large offre plus de confort. Utilisez toujours un leash ou une ancre pour éviter que la planche ne dérive.
  faq:
    - q: Faut-il une planche spéciale pour le yoga sur paddle ?
      a: Pas nécessairement, mais la largeur et la qualité du tapis de pont comptent. Les planches de moins de 32" sont très difficiles pour le yoga. Un tapis de pont épais et rembourré rend les postures à genoux confortables.
    - q: Que se passe-t-il si je tombe pendant une séance de yoga sur paddle ?
      a: La chute fait partie de l'expérience. La plupart des chutes surviennent pendant les transitions entre postures. Tombez loin de la planche, pas dessus.
    - q: Peut-on faire du hot yoga sur un paddle ?
      a: Le yoga sur paddle en plein soleil peut être très chaud. Pratiquez le matin ou en fin d'après-midi. Portez de la crème solaire et emportez de l'eau.
    - q: Le yoga sur paddle est-il plus difficile que le yoga sur tapis ?
      a: Oui —la surface instable exige plus d'équilibre et de force au niveau du tronc. Beaucoup de pratiquants constatent que le yoga sur paddle améliore leur pratique sur tapis en développant une meilleure conscience corporelle.

- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard ou shortboard (la réponse honnête que personne ne vous donne)
  description: 'Les longboards attrapent plus de vagues ; les shortboards tournent plus court. La vraie question : laquelle correspond à votre niveau et à vos spots. Comparaison honnête de la stabilité, du nombre de vagues et du piège de la progression.'
  definition: Les longboards (9 pieds et plus) privilégient la stabilité et la facilité à prendre des vagues ; les shortboards (5-7 pieds) privilégient la maniabilité et les performances dans les vagues raides. Le bon choix dépend de votre niveau et des types de vagues locaux.
  tldr: Les longboards (9 pieds et plus) sont stables, prennent les vagues facilement et conviennent aux débutants comme aux surfeurs qui aiment croiser tranquillement. Les shortboards (5-7 pieds) sont réactifs, plus rapides sur la face et conviennent aux surfeurs confirmés. Le bon choix dépend de votre niveau, du type de vagues et de ce que vous préférez dans le surf.
  problem: Vous voyez des vidéos de surfeurs enchaînant des virages serrés en shortboard et des longboardeurs glissant gracieusement sur le nose —les deux ont l'air amusants. Vous n'avez le budget que pour un seul type de planche et devez savoir quel style correspond à vos objectifs et à vos spots locaux.
  explanation: "Les longboards offrent plus de surface, ce qui signifie qu'ils rament plus vite, prennent les vagues plus tôt et fournissent une plateforme stable pour marcher et cross-stepper. Ils excellent dans les petites vagues lentes où un shortboard coulerait. Les shortboards ont moins de volume et un rocker plus agressif, leur permettant de s'enfoncer plus profondément dans la face de la vague, de générer de la vitesse dans les virages et de s'insérer dans les sections raides et creuses. Les shortboards exigent une rame puissante et un timing précis. Idée reçue : les shortboards ne sont pas « meilleurs » —ce sont simplement des outils différents pour des conditions et des niveaux différents."
  solution: Si vous êtes débutant, roulez en longboard (ou en gonflable à fort volume) pendant au moins 6 mois. Si vous êtes de niveau intermédiaire et que vos vagues locales sont souvent petites et lentes, un longboard ou un hybride prendra plus de vagues et sera plus amusant. Si vos vagues sont raides, creuses et rapides, un shortboard devient nécessaire pour s'insérer dans le tube. Beaucoup de surfeurs intermédiaires gardent les deux et choisissent selon le jour.
  recommendation: Commencez avec la Surfboard Pro d'afarer comme plateforme de type longboard. Quand vous tournez et générez de la vitesse de façon régulière, envisagez d'ajouter un hybride ou un shortboard pour les jours de vagues raides. La plupart des surfeurs qui passent au shortboard trop tôt finissent frustrés et prennent moins de vagues.
  faq:
    - q: Un longboard est-il plus facile à surfer qu'un shortboard ?
      a: Beaucoup plus facile. Les longboards prennent les vagues plus tôt, rament plus vite et sont plus stables pendant les pop-ups et le trim. Les shortboards exigent un timing précis, une rame plus forte et une meilleure lecture des vagues.
    - q: Peut-on faire des virages avec un longboard ?
      a: Oui, mais le style est différent. Les virages en longboard sont plus larges, plus fluides et mobilisent tout le corps. Le nose riding, les cutbacks et les hang-fives sont des manœuvres spécifiques au longboard, avec leur propre progression.
    - q: Quelle planche convient le mieux aux petites vagues ?
      a: Les longboards et les hybrides performent mieux dans les petites vagues molles car ils génèrent de la glisse et maintiennent la vitesse. Les shortboards ont besoin de vagues plus raides et plus puissantes pour s'exprimer.
    - q: Un shortboard est-il plus difficile à ramer ?
      a: Nettement plus difficile. Le volume inférieur fait flotter la planche plus bas dans l'eau, créant plus de traînée. Ramer un shortboard, c'est comme nager avec un parachute de freinage comparé à ramer un longboard.

  title: 'Guide des gilets de sauvetage : choisissez le bon gilet pour votre activité nautique'
  description: Guide d'achat complet des gilets de sauvetage pour le paddle, la randonnée nautique et les sports nautiques en général. Types de gilets (mousse ou gonflable), conseils d'ajustement, exigences légales et fonctionnalités selon chaque activité.
  definition: Un gilet de sauvetage est un équipement de sécurité conçu pour maintenir une personne à flot dans l'eau. Les types vont du type I (haute mer) au type V (usage spécialisé).
  tldr: "Choisissez votre gilet selon l'activité : ceinture gonflable pour le paddle, gilet en mousse pour la randonnée nautique, gilet en mousse de type III pour les sports nautiques en général. Caractéristiques clés : homologation USCG ou ISO, bandes réfléchissantes, sifflet de détresse, anneau en D pour l'attache, couleurs vives."
  problem: Vous voyez des rangées de gilets de sauvetage allant de 20 à 300 $ et vous ne savez pas lequel convient à votre activité ou respecte les exigences légales.
  explanation: 'Les gilets de sauvetage sont classés par type : type I (haute mer, retourne une personne inconsciente sur le dos), type II (près du rivage), type III (aide à la flottabilité, le plus courant), type IV (engin lancé), type V (usage spécialisé). Les gilets gonflables utilisent des cartouches de CO2 : moins encombrants, mais ils nécessitent un entretien. Les gilets en mousse ne demandent aucun entretien mais sont plus volumineux.'
  solution: 'Pour le paddle : choisissez une ceinture gonflable ou un gilet gonflable (flottabilité de 33 lb). Pour la randonnée nautique : gilet en mousse de type III avec de grandes emmanchures. Pour les sports nautiques en général : gilet en mousse de type III ou gonflable avec une flottabilité de 22 lb ou plus, bandes réfléchissantes et sifflet de détresse.'
  recommendation: Le gilet afarer Life Vest Pro (gonflable, 33 lb) est idéal pour le paddle et la randonnée nautique. Le gilet afarer Life Vest Classic (mousse, type III) est parfait pour les sports nautiques en général et l'usage marin.
  faq:
    - q: Ai-je besoin d'un gilet de sauvetage pour le paddle ?
      a: 'Oui : il est légalement obligatoire dans de nombreuses juridictions et toujours recommandé. Portez une ceinture gonflable ou un gilet pour les sports de paddle.'
    - q: Les gilets de sauvetage gonflables sont-ils sûrs ?
      a: Oui, avec un entretien approprié. Vérifiez la cartouche de CO2 chaque année et remplacez la bobine tous les 2 à 3 ans.
    - q: Quel gilet de sauvetage convient le mieux à un enfant ?
      a: Un gilet en mousse de type II ou III homologué USCG, avec col, sangle d'entrejambe et couleurs vives. N'utilisez jamais de gilet gonflable pour les enfants.
    - q: Comment un gilet de sauvetage doit-il être ajusté ?
      a: "Près du corps : le gilet ne doit pas remonter au-dessus des oreilles lorsqu'on le soulève par les épaules. Toutes les fermetures éclair et boucles doivent être fermées."

      a: Une pagaie de randonnée en carbone ou fibre de verre avec une pale de taille moyenne (90-100 pouces carrés) pour l'efficacité sur la distance.
    - q: Est-il facile à faire tourner ?
      a: Les 14 pieds de longueur demandent des virages plus larges. Utilisez des coups de balayage pour tourner. Dans les espaces restreints, le SUP Explorer 11 est plus maniable.

  title: Les types de planches de surf expliqués (laquelle est faite pour vous ?)
  description: 'Shortboard, longboard, fish, hybride, mousse — vous êtes perdu ? Voici chaque type de planche de surf décortiqué : pour qui il est fait, quelles vagues il exige et lequel acheter en premier.'
  definition: Les principaux types de planches de surf sont les longboards (9 pieds et plus, stables, faciles), les shortboards (5-7 pieds, réactifs, avancés), les planches mousse/gonflables (volume élevé, sûres pour les débutants) et les hybrides (7-9 pieds, compromis polyvalent). Chacun convient à des niveaux et à des conditions de vagues différents.
  tldr: Les quatre principaux types de planches de surf sont les shortboards (performance, faible volume), les longboards (stables, faciles à rider), les planches mousse/gonflables (adaptées aux débutants, volume élevé) et les hybrides ou funboards (polyvalence mi-longueur). Chaque type correspond à un niveau et à un style de surf différents. Choisissez votre planche selon l'endroit où vous en êtes dans votre courbe d'apprentissage et le type de glisse que vous préférez.
  problem: 'Les noms des planches de surf prêtent à confusion : mini-mal, egg, fish, gun, hybride, retro twin — la liste est longue. Vous voulez savoir quel type de planche correspond à votre niveau et à vos vagues locales sans devoir acheter cinq planches différentes pour le découvrir.'
  explanation: Les longboards font 9 pieds et plus, sont épais et ont un nez arrondi — ils prennent les vagues tôt et se rament sans effort. Les shortboards font 5 à 7 pieds, avec un nez pointu et un rocker agressif — ils exigent un ramage puissant et une technique précise, mais offrent un maximum de performance. Les planches en mousse et les gonflables reprennent les formes de longboard dans des versions très volumineuses, plus douces et plus sûres. Les hybrides (funboards, eggs) se situent entre 7 et 9 pieds et marient facilité de ramage et capacité à tourner. Les planches fish sont courtes et larges avec un tail en hirondelle, conçues pour les petites vagues.
  solution: Identifiez le type de vagues de votre spot — les beach breaks lents conviennent aux longboards et aux hybrides ; les reef breaks ou point breaks plus raides vont aux shortboards. Adaptez la planche à la vague, pas à ce qui a l'air stylé. Les débutants devraient partir par défaut sur une forme de longboard à volume élevé, puis explorer des shapes plus courts à mesure que leur niveau évolue.
  recommendation: Pour la plupart des surfeurs, un hybride ou un funboard entre 7'6" et 8'6" constitue le meilleur quiver à une seule planche. L'afarer Surfboard Pro en 10'6" est plus long, mais il offre la stabilité d'un longboard avec la portabilité d'une gonflable. Utilisez-la comme planche principale pendant votre première année.
  faq:
    - q: Quelle est la planche de surf la plus facile à rider ?
      a: Un longboard (9 pieds et plus) ou une gonflable à volume élevé comme l'afarer Surfboard Pro. Ces planches prennent les vagues tôt et offrent une plate-forme stable pour apprendre les pop-ups et les transferts d'appui.
    - q: Quand faut-il passer du longboard au shortboard ?
      a: Quand vous prenez régulièrement des vagues non déferlantes, enchaînez des bottom turns et glissez le long de la face de la vague sur votre longboard. Précipiter cette transition est l'erreur la plus courante — prévoyez 6 à 12 mois sur un longboard.
    - q: À quoi sert une planche fish ?
      a: Les planches fish sont conçues pour les petites vagues molles. Leur longueur courte et leur outline large génèrent de la vitesse là où un shortboard classique cale. C'est une excellente deuxième planche pour les surfeurs intermédiaires.
    - q: Les planches de surf gonflables sont-elles bonnes ?
      a: Les gonflables modernes à construction « drop-stitch » rivalisent de rigidité et de performance avec les longboards en mousse. Elles sont idéales pour les débutants et les voyageurs car elles tiennent dans un sac à dos et sont quasi indestructibles.

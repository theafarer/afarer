- slug: sup-launch-techniques
  category: guide
  type: tutorial
  title: "Techniques de mise à l'eau en paddle : bien démarrer sa session"
  description: Les bonnes techniques de mise à l'eau selon le type de rivage — plage de sable, berge rocheuse, ponton et rive de rivière. Évitez le départ maladroit et commencez chaque session en douceur.
  definition: La technique de mise à l'eau en paddle est la méthode pour passer du rivage à l'eau tout en gardant l'équilibre et le contrôle de la planche. Chaque type de rivage exige une approche différente.
  tldr: "Plage de sable : placez la planche au bord de l'eau, montez dessus, pagayez. Berge rocheuse : poussez la planche dans l'eau peu profonde avant de monter. Ponton : asseyez-vous sur la planche depuis le ponton, servez-vous de la pagaie pour vous pousser. Rive de rivière : partez vers l'aval en biais. Attachez toujours le leash avant d'entrer dans l'eau."
  problem: Vous gonflez votre planche, marchez jusqu'au bord de l'eau, puis réalisez que vous ne savez pas comment monter dessus sans avoir l'air maladroit ou tomber immédiatement.
  explanation: La technique de mise à l'eau varie selon le type de rivage. Sur les plages de sable, le plus simple est de placer la planche parallèle au rivage dans une eau à hauteur de cheville, de monter dessus et de pagayer droit devant. Sur les berges rocheuses, il faut pousser la planche jusqu'à une eau à hauteur de genou avant de monter, pour éviter de l'abîmer. Depuis un ponton, asseyez-vous sur la planche pendant qu'elle est le long du ponton, puis poussez.
  solution: "Mise à l'eau sur sable : placez la planche perpendiculaire au rivage, posez un pied dessus, poussez avec l'autre, mettez un genou, puis debout. Mise à l'eau sur rochers : portez la planche jusqu'à une eau à hauteur de genou, montez par l'arrière. Mise à l'eau depuis un ponton : placez la planche parallèle au ponton, asseyez-vous dessus depuis le ponton, poussez doucement."
  recommendation: Entraînez-vous d'abord à la mise à l'eau par conditions calmes. La plateforme large de l'afarer SUP Explorer 11 facilite les départs. Attachez toujours le leash avant de monter sur la planche.
  faq:
    - q: Comment mettre à l'eau dans les vagues ?
      a: Attendez une accalmie entre les séries. Placez la planche dans une eau à hauteur de cheville, montez rapidement, pagayez fort pour franchir la zone de barre avant la série suivante.
    - q: Puis-je partir de n'importe quelle plage ?
      a: Vérifiez les points d'accès et la réglementation locale. Certaines plages disposent de zones de mise à l'eau dédiées. Évitez les zones de départ où se trouvent des baigneurs.
    - q: Comment revenir à terre ?
      a: Approchez perpendiculairement au rivage. Descendez de la planche dans l'eau peu profonde dès que les ailerons touchent le fond. Portez la planche au-dessus de la ligne d'eau.
    - q: Que faire en cas de forte barre de bord ?
      a: Calquez votre départ entre les vagues. Tenez fermement la planche de profil face aux vagues. Si la barre est trop forte, cherchez un autre point de mise à l'eau.

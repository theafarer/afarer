- slug: ocean-conditions-explained
  category: guide
  type: technical
  title: Les conditions océaniques expliquées (lisez la prévision de surf comme un pro)
  description: Hauteur de houle, période, direction du vent, marée —décodez n'importe quel bulletin de surf en 60 secondes. Ce que les chiffres signifient vraiment pour votre spot local et quand rester sur la plage.
  definition: 'Les conditions océaniques sont déterminées par trois facteurs : la houle (hauteur, période, direction), le vent (offshore = propre, onshore = haché) et la marée (modifie la profondeur au-dessus des bancs de sable et des récifs).'
  tldr: "Trois facteurs déterminent la qualité du surf : la houle (taille, période, direction), le vent (offshore = propre, onshore = haché) et la marée (pousse l'eau au-dessus des bancs de sable vers le rivage ou vers le large). Utilisez la période de houle pour juger la puissance —une période plus longue signifie des vagues plus puissantes. Consultez une prévision de surf combinant ces trois facteurs avant chaque session."
  problem: 'Les prévisions de surf affichent des chiffres déroutants : 3 pieds à 12 secondes du 290°, vent offshore léger. Vous ne savez pas ce que cela signifie pour la plage où vous prévoyez de surfer. Sans décoder la prévision, vous risquez de rouler vers une plage plate ou de pagayer dans des conditions dangereuses.'
  explanation: "La houle se mesure par sa hauteur (hauteur de face en pieds), sa période (secondes entre les vagues) et sa direction (d'où vient la houle). Les houles à longue période (12 secondes et plus) transportent plus d'énergie et produisent des vagues plus propres et plus puissantes. Qualité du vent : le vent offshore (de la terre vers la mer) soutient la face de la vague, créant des vagues lisses et propres ; le vent onshore (de la mer vers la terre) hache la surface. Les vents side-shore sont acceptables mais pas idéaux. La marée affecte la forme des vagues selon le spot —les beach breaks fonctionnent souvent mieux à mi-marée, les reef breaks à des niveaux de marée précis selon la profondeur du récif."
  solution: Utilisez un site ou une application de prévision de surf et apprenez à lire trois paramètres pour votre spot local. Recoupez la direction de la houle avec l'orientation de la plage —une plage exposée à l'ouest a besoin d'une houle d'ouest. Vérifiez la prévision du vent pour l'heure à laquelle vous prévoyez de surfer, pas le bulletin du matin. Apprenez la préférence de marée de votre spot en l'observant à différents niveaux.
  recommendation: "Passez un mois à noter les conditions et la qualité des vagues sur votre plage locale. Vous découvrirez des schémas : quelles directions de houle fonctionnent, quelles marées produisent la meilleure forme et quels vents gâchent la surface. Le guide des conditions océaniques complète le guide des bases de la sécurité en surf pour une compréhension complète de l'océan."
  faq:
    - q: Qu'est-ce qu'une bonne période de houle pour surfer ?
      a: 8 à 10 secondes produisent des vagues faibles et désorganisées, adaptées aux débutants. 10 à 13 secondes, c'est le point idéal pour la plupart des spots —de la puissance sans danger. 14 secondes et plus produisent des houles puissantes et concentrées, réservées aux surfeurs confirmés.
    - q: Quel est le meilleur vent pour surfer ?
      a: Un vent offshore léger (5-10 nœuds) produit les faces les plus propres. Les conditions glassy (sans vent) sont idéales mais rares. Le vent onshore rend les vagues hachées et plus difficiles à surfer. Un fort vent offshore peut rendre les take-offs dangereux en soutenant trop longtemps la lèvre de la vague.
    - q: Comment la marée affecte-t-elle les vagues ?
      a: La marée modifie la profondeur au-dessus des bancs de sable et des récifs. La marée basse peut mettre à nu des dangers et rendre les vagues plus raides ou les faire fermer. La marée haute peut adoucir les vagues ou les rendre molles et lentes. La plupart des beach breaks fonctionnent le mieux 2 à 3 heures avant ou après la marée haute ou basse.
    - q: Puis-je surfer avec un vent onshore ?
      a: Oui, mais la qualité sera moindre. Des faces hachées rendent les virages plus difficiles et la rame moins efficace. Les débutants préfèrent souvent le vent onshore car les vagues sont plus douces et moins puissantes, ce qui laisse plus de temps pour se lever.

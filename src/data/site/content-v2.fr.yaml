- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: "Entretien d'un paddle gonflable : faire durer sa planche pendant des années"
  description: Un entretien adapté prolonge considérablement la durée de vie d'un paddle gonflable. Nettoyage, séchage, soin des valves, protection contre les UV et conseils de stockage saisonnier pour les planches drop-stitch.
  definition: L'entretien d'un paddle gonflable comprend le nettoyage après chaque utilisation, un séchage correct, l'inspection des valves, la protection contre les UV et un stockage adapté pour prévenir la délamination, la moisissure, la dégradation des matériaux et les fuites d'air.
  tldr: Rincez votre planche à l'eau douce après chaque session en eau salée. Séchez-la complètement avant de la dégonfler et de la ranger. Vérifiez que la valve est exempte de débris et lubrifiez le joint torique chaque année. Stockez la planche gonflée (à moitié pression) dans un endroit frais et sombre. Évitez l'exposition prolongée aux UV, qui dégrade le PVC. Réparez immédiatement les petites perforations avec le kit de réparation inclus.
  problem: Après une saison, votre paddle gonflable développe des fuites lentes, le tapis de pont se décolle sur les bords et le PVC paraît plus rigide. Négliger l'entretien de base provoque un vieillissement prématuré pourtant entièrement évitable.
  explanation: Le PVC se dégrade sous les rayons UV. Les cristaux de sel de l'eau de mer s'infiltrent dans les coutures et les valves, provoquant des micro-fuites. L'humidité emprisonnée à l'intérieur favorise le développement de moisissures qui attaquent les fils du drop-stitch. Les joints toriques des valves se dessèchent et perdent leur étanchéité. La saleté et le sable s'incrustent dans la colle du tapis de pont, provoquant le décollement des bords.
  solution: "Après chaque session : rincez la planche, les ailerons et la pompe à l'eau douce. Essuyez le tapis de pont. Ouvrez la valve pour évacuer l'eau emprisonnée. Séchez la planche à l'ombre avant de la dégonfler. Chaque mois : inspectez la valve et appliquez un lubrifiant silicone sur le joint torique. À chaque saison : lavez avec un savon doux et de l'eau, vérifiez l'absence de perforations."
  recommendation: Suivez le guide d'entretien afarer fourni avec votre planche. Utilisez immédiatement le kit de réparation en cas de perforation. Rangez la planche dans son sac, dans un espace à température contrôlée, à l'abri de la lumière directe du soleil.
  faq:
    - q: Puis-je laisser mon paddle gonflable gonflé toute la saison ?
      a: Oui, mais rangez-le à l'abri du soleil direct et à la moitié de la pression maximale (8-10 PSI) pour réduire la tension sur les coutures. Gonflez à fond juste avant l'utilisation.
    - q: Comment nettoyer les moisissures sur mon paddle ?
      a: Mélangez un savon doux avec de l'eau tiède et frottez avec une brosse souple. Pour les moisissures tenaces, utilisez une solution de vinaigre blanc dilué (1:4). Évitez l'eau de Javel.
    - q: Dois-je lubrifier la valve ?
      a: Oui, une fois par an. Retirez le mécanisme de la valve, appliquez de la graisse silicone sur le joint torique et remontez-le. Cela prévient les fuites d'air.
    - q: Comment stocker mon paddle pour l'hiver ?
      a: Nettoyez et séchez soigneusement. Dégonflez complètement, roulez sans serrer (évitez les plis marqués) et rangez dans un endroit frais, sombre et sec. Évitez les températures glaciales.

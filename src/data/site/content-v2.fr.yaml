- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Que porter pour surfer (ne vous présentez pas en short de surf quand il vous faut une 5/4)
  description: Arrêtez de deviner quoi porter. C'est la température de l'eau, pas celle de l'air, qui détermine votre tenue de surf. Guide complet des couches, du rash guard tropical aux tenues d'hiver intégrales 5/4/3 mm.
  definition: La tenue de surf va du short de surf et du rash guard en eau chaude à la combinaison intégrale 5/4/3 mm avec bottillons et cagoule en eau froide. C'est la température de l'eau, et non celle de l'air, qui détermine ce dont vous avez besoin.
  tldr: Ce que vous portez pour surfer dépend entièrement de la température de l'eau — pas de l'air. Rash guard et short de surf conviennent au-dessus de 22 °C, les combinaisons courtes couvrent 18 à 22 °C, les intégrales 3/2 mm gèrent 14 à 18 °C, et une 5/4/3 mm avec bottillons est requise en dessous de 14 °C. Portez toujours une protection UV et envisagez un leash et un gilet d'impact.
  problem: Vous arrivez à la plage sans savoir si un rash guard suffit ou s'il vous faut une combinaison intégrale. L'air est doux mais l'eau est froide, ou l'eau semble supportable mais le vent est glacial. Une tenue inadaptée gâche la session.
  explanation: "La tenue de surf remplit trois fonctions : l'isolation thermique, la protection UV et la prévention des irritations. Les combinaisons en néoprène se classent par épaisseur et par couverture — les combinaisons courtes (manches ou jambes courtes) sont pour les jours limites, les combinaisons intégrales pour l'eau froide. Les rash guards protègent des irritations de la planche et du soleil, mais n'apportent aucune chaleur. Bottillons, gants et cagoules ne sont pas des accessoires, mais un équipement essentiel pour le surf en eau froide en dessous de 12 °C."
  solution: "Consultez la bouée locale ou un relevé de température de l'eau en direct avant de sortir. Constituez un kit à partir de votre condition habituelle la plus froide : rash guard et short pour l'été, une intégrale 3/2 mm pour le printemps et l'automne, une 5/4/3 mm avec bottillons et cagoule pour l'hiver. Ajoutez toujours un leash et envisagez un gilet de flottaison pour la sécurité."
  recommendation: Investissez d'abord dans une bonne intégrale 3/2 mm — elle couvre la plus large gamme de conditions. Ajoutez une 5/4/3 mm et des bottillons si vous comptez surfer tout l'hiver. La combinaison afarer Wetsuit Pro avec doublure thermique couvre efficacement les deux plages de températures.
  faq:
    - q: Puis-je surfer en simple short de surf ?
      a: Oui, dans une eau tropicale au-dessus de 24 °C. Vous voudrez peut-être un rash guard pour éviter les irritations de la poitrine et des bras dues au ramage. Du wax ou un pad antidérapant sur la planche aide à compenser l'absence d'adhérence de la combinaison.
    - q: Ai-je besoin de bottillons de surf ?
      a: Si la température de l'eau descend sous 14 °C, les bottillons préviennent l'engourdissement et protègent vos pieds des rochers et des coupures sur le récif. Ils ajoutent aussi de l'adhérence sur la planche. La plupart des surfeurs des climats nordiques les utilisent de novembre à mars.
    - q: Qu'est-ce qu'une combinaison courte (spring suit) ?
      a: Une spring suit est une combinaison à manches ou jambes courtes (ou les deux) conçue pour une eau entre 18 °C et 22 °C. Elle offre plus de chaleur qu'un rash guard, mais moins de couverture qu'une combinaison intégrale.
    - q: Dois-je porter un gilet de sauvetage pour surfer ?
      a: Pas un gilet de sauvetage traditionnel, mais un gilet d'impact ou une aide à la flottaison peut aider dans des conditions difficiles ou si vous nagez mal. Les gilets de sauvetage afarer sont conçus pour le SUP et les sports de paddle, mais ils peuvent apporter une confiance en flottabilité supplémentaire aux débutants en surf.

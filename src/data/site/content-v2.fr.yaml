- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: "Guide de l'ancre pour paddle : rester en place pour pêcher ou photographier"
  description: Guide complet de l'ancrage en paddle — types d'ancres (champignon, pliante, piquet), installation d'un chariot d'ancre, techniques de mouillage et considérations de sécurité pour rester en position.
  definition: Une ancre de paddle est un lest relié à une corde qui maintient la planche en position contre le vent et le courant. Les types courants sont les ancres champignon, les ancres pliantes et les piquets.
  tldr: Utilisez une ancre champignon (1,5 à 3 lb) pour les fonds vaseux ou sablonneux, une ancre pliante pour les fonds rocheux, ou un piquet pour les eaux peu profondes aux fonds tendres. L'ancre doit peser 1,5 à 3 lb en conditions calmes, 3 à 5 lb face au vent et au courant. Utilisez toujours un chariot d'ancre pour ajuster votre position et sachez quand larguer.
  problem: Vous avez trouvé le spot de pêche parfait, mais le vent et le courant vous déportent toutes les quelques minutes. Sans ancre, la pêche et la photo en paddle tournent à la frustration, avec un repositionnement permanent.
  explanation: Une ancre fonctionne en traînant sur le fond jusqu'à s'y accrocher. Les ancres champignon s'enfoncent dans les fonds tendres et offrent une bonne tenue dans le sable et la vase. Les ancres pliantes ont des pattes qui s'accrochent aux fonds durs ou rocheux. Les piquets fonctionnent en eau peu profonde en s'enfonçant directement dans le fond.
  solution: Installez un chariot d'ancre (une ligne avec un anneau coulissant sur un côté de la planche) pour ajuster le point d'attache de l'ancre. Attachez 50 à 75 pieds de corde à l'ancre. Mouillez au vent ou à contre-courant de votre position souhaitée. Utilisez un système de largage rapide pour vous détacher en cas d'urgence. Ne mouillez jamais dans un courant fort ou là où vous ne pouvez pas récupérer l'ancre facilement.
  recommendation: Une ancre pliante de 3 lb avec 50 pieds de corde convient à la plupart des conditions de pêche en paddle. Ajoutez un chariot d'ancre utilisant les anneaux en D de votre afarer SUP Explorer 11.
  faq:
    - q: Quelle taille d'ancre pour un paddle ?
      a: 1,5 à 3 lb pour les lacs calmes et les rivières lentes. 3 à 5 lb pour les zones côtières avec vent ou courant. Les ancres trop grosses sont difficiles à remonter.
    - q: Combien de ligne d'ancre faut-il ?
      a: Un ratio de 5:1 (5 pieds de ligne pour 1 pied de profondeur) est la norme. Dans 10 pieds d'eau, utilisez 50 pieds de ligne.
    - q: L'ancrage est-il dangereux sur un paddle ?
      a: Seulement si vous mouillez dans un courant ou un vent assez fort pour faire chavirer la planche. Utilisez toujours un système de largage rapide qui se détache instantanément.
    - q: Peut-on mouiller n'importe où ?
      a: Vérifiez la réglementation locale. Certaines zones restreignent l'ancrage pour protéger les herbiers ou les habitats marins. Ne mouillez jamais sur les récifs coralliens.

- slug: sup-navigation-guide
  category: guide
  type: safety
  title: 'Navigation en paddle : rester cap et retrouver son chemin'
  description: Les bases de la navigation pour les paddlers — lire les cartes, utiliser les points de repère, comprendre les systèmes de balisage et utiliser le GPS et la boussole pour pagayer en sécurité.
  definition: La navigation en paddle consiste à utiliser les points de repère, les cartes, le GPS et la connaissance du vent et des courants pour évoluer en sécurité et revenir à son point de départ.
  tldr: Choisissez toujours un point de repère à l'horizon quand vous pagayez tout droit. Vérifiez-le toutes les quelques minutes pour corriger la dérive. Utilisez des applications GPS sur votre téléphone en housse étanche. Apprenez les bases de la navigation à la boussole. Comprenez le balisage latéral (rouge à droite au retour). Laissez votre plan de sortie à quelqu'un resté à terre.
  problem: Vous pagayez en eau libre et, en vous retournant, le littoral semble complètement différent. Sans notions de navigation, vous pouvez vous désorienter et pagayer dans la mauvaise direction.
  explanation: La navigation en paddle repose sur les repères visuels, car vous êtes proche de l'eau. Choisissez un repère distinctif (bâtiment, arbre, falaise) derrière votre point de départ. Utilisez-le comme azimut de retour. Le vent et le courant vous font dévier — corrigez en continu. Pour les sorties plus longues, utilisez une application GPS ou une montre. Sachez que le littoral vu de l'eau est différent du littoral vu de la terre.
  solution: "Avant de partir : identifiez 2 à 3 repères à des distances différentes derrière votre point de mise à l'eau. Utilisez une application GPS (Google Maps, Gaia GPS) en mode avion pour économiser la batterie. Connaissez la direction du vent et de la marée — pagayez d'abord contre le vent et le courant. Pour les traversées en eau libre, utilisez un azimut à la boussole."
  recommendation: Gardez un téléphone en housse étanche comme GPS de secours. Entraînez-vous à la navigation par repères dans des eaux familières avant de vous aventurer vers de nouveaux spots. Le Life Vest Pro possède une poche adaptée à un téléphone.
  faq:
    - q: Quels points de repère choisir pour la navigation en paddle ?
      a: Des éléments distinctifs et permanents comme des châteaux d'eau, des immeubles élevés, des arbres remarquables ou des falaises proéminentes. Évitez les bateaux ou les drapeaux, qui bougent.
    - q: Comment naviguer dans le brouillard ?
      a: Ne sortez pas en paddle dans le brouillard. Si vous êtes pris dans le brouillard, utilisez un GPS ou une boussole pour naviguer. Sonnez un coup de sifflet toutes les 30 secondes. Restez près du rivage.
    - q: Ai-je besoin d'une carte marine pour le paddle ?
      a: Pour le paddle côtier, une carte simple aide à identifier les dangers, les profondeurs et les chenaux de navigation. De nombreuses applications fournissent ces informations.
    - q: Comment naviguer autour des bateaux ?
      a: Restez en eau peu profonde, loin des chenaux. Portez des couleurs vives. Traversez les chenaux rapidement et à 90 degrés. Établissez un contact visuel avec les conducteurs des bateaux.

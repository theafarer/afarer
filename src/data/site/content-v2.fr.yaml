- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: "Stockage d'un paddle gonflable : la bonne façon de ranger son iSUP"
  description: Un stockage correct de votre paddle gonflable prévient la délamination, les dommages UV, la moisissure et les fuites de valve. Conseils de stockage hivernal, longue durée et quotidien pour les planches drop-stitch.
  definition: Le stockage d'un paddle gonflable consiste à garder la planche dans un environnement propre, sec et à température contrôlée, à l'abri des UV, des températures extrêmes et des dommages physiques.
  tldr: Rangez la planche dans un endroit frais et sombre en dessous de 30 °C, à l'abri de la lumière directe du soleil. Pour du court terme (1-2 semaines), stockez-la partiellement gonflée à 8-10 PSI. Pour un stockage longue durée, dégonflez complètement, roulez sans serrer et placez-la dans le sac de rangement. Ne rangez jamais une planche humide. Tenez-la à l'écart des rongeurs et des objets coupants.
  problem: Vous dégonflez votre paddle et l'entassez dans un garage surchauffé ou une cave humide. Trois mois plus tard, le PVC a jauni, le tapis de pont se décolle et la valve fuit. Un stockage inadapté cause plus de dégâts que l'utilisation régulière.
  explanation: La chaleur au-delà de 50 °C fait migrer les plastifiants du PVC, rendant le matériau rigide et cassant. Les rayons UV brisent les liaisons polymères. L'humidité emprisonnée crée de la moisissure. Le froid glacial rend le PVC cassant. Les points de pression dus aux pliages serrés créent des marques permanentes.
  solution: "Stockage court terme : rincez, séchez, gonflez à 10 PSI et rangez hors du sol dans une zone ombragée. Stockage longue durée : nettoyez soigneusement, séchez complètement, dégonflez entièrement, roulez tapis de pont vers l'extérieur, placez dans le sac et rangez dans un placard frais et sec. Tenez à l'écart des produits chimiques et des nuisibles."
  recommendation: Utilisez le sac de transport afarer pour le stockage —il bloque les UV et évite les rayures. Rangez la planche dans une pièce à température régulée. Ajoutez un sachet déshydratant dans le sac pour les environnements humides.
  faq:
    - q: Puis-je stocker mon paddle gonflé dans le garage ?
      a: Uniquement si le garage reste en dessous de 30 °C et sans lumière directe du soleil. La plupart des garages dépassent 40 °C en été.
    - q: Dois-je ranger mon paddle dans le sac ?
      a: Oui, le sac protège contre la poussière, les UV et les dommages physiques. Assurez-vous que la planche est complètement sèche avant de l'y ranger.
    - q: Le gel peut-il endommager un paddle gonflable ?
      a: Oui. En dessous de zéro, le PVC devient cassant et peut se fissurer au déroulage ou au gonflage. Stockez toujours au-dessus de 5 °C.
    - q: Comment rouler mon paddle pour le stockage ?
      a: Roulez avec le tapis de pont vers l'extérieur pour protéger le PVC du dessous. Évitez les plis marqués. Alternez la position du pliage à chaque fois.

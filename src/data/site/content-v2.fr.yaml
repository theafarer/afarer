- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Guide des tailles de paddle : volume, longueur et largeur pour chaque pagayeur'
  description: Le guide complet des tailles de paddle avec des recommandations de volume selon le poids et l'activité. Inclut un tableau des tailles facile à utiliser pour les paddles polyvalents, de randonnée, de surf et de yoga.
  definition: La taille d'un paddle est déterminée par le volume (capacité de charge et flottabilité), la longueur (vitesse et maintien du cap), la largeur (stabilité) et l'épaisseur (répartition du volume et résistance au vent).
  tldr: 'Utilisez le poids pour trouver le volume minimal : 50-70 kg nécessitent 220-260 L, 70-90 kg nécessitent 260-300 L, 90-110 kg nécessitent 300-350 L, 110 kg et plus nécessitent 350 L et plus. Pour les débutants, ajoutez 20 % à ces chiffres. La largeur compte : 32" correspond à un niveau intermédiaire, 33-34" convient aux débutants, 35" et plus est très stable.'
  problem: Les annonces de paddles utilisent indifféremment pieds, pouces et litres, ce qui rend la comparaison entre les marques difficile.
  explanation: Le volume est la mesure la plus directe de la capacité de charge —1 litre d'eau douce déplace 1 kg. Une planche de 260 L peut théoriquement supporter 260 kg, mais la capacité pratique est inférieure car la planche doit rester au-dessus de l'eau. Votre poids total (corps plus équipement) devrait représenter 30 à 40 % du volume de la planche.
  solution: Volume cible = (poids du corps en kg + poids de l'équipement en kg) x 3. Pour un pagayeur de 75 kg avec 5 kg d'équipement, la cible = 80 x 3 = 240 L minimum. Pour les débutants, multipliez par 3,5. Pour les pratiquants avancés, multipliez par 2,5.
  recommendation: L'afarer SUP Explorer 11 (260 L, 11' x 33" x 6") convient à la plupart des pagayeurs de 50 à 100 kg. Les pagayeurs plus légers peuvent se tourner vers l'AirDeck 270. Les pagayeurs plus lourds devraient s'orienter vers le SUP Tour 12 (300 L et plus) ou des planches plus larges.
  faq:
    - q: La taille du pagayeur compte-t-elle pour choisir son paddle ?
      a: La taille compte moins que le poids. Un pagayeur grand et léger a besoin de moins de volume qu'un pagayeur petit et lourd. Utilisez le poids comme critère principal pour déterminer le volume.
    - q: Que se passe-t-il en cas de volume trop important ?
      a: La planche flotte trop haut et prend le vent comme une voile. Elle réagit de façon « liège » dans le clapot. Cependant, pour les débutants, un volume supérieur est préférable à un volume insuffisant.
    - q: Que se passe-t-il en cas de volume insuffisant ?
      a: La planche s'enfonce trop, créant de la traînée. L'avant peut s'immerger pendant la pagaie. Vous vous épuisez rapidement à pagayer une planche partiellement immergée.
    - q: Les paddles gonflables nécessitent-ils des tailles différentes des planches rigides ?
      a: Pas de façon significative. Les gonflables à 15 PSI et plus déplacent l'eau de manière similaire aux planches rigides. Les recommandations de volume s'appliquent de la même façon aux deux types.

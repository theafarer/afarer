  title: 'Sécurité en eau froide : paddle et surf par conditions froides'
  description: Sécurité en eau froide pour le paddle et le surf. Reconnaître l'hypothermie, choisir l'équipement approprié, comprendre le choc thermique et appliquer les procédures d'urgence en cas d'immersion en eau froide.
  definition: La sécurité en eau froide passe par la compréhension du choc thermique, de l'incapacité de nage et de l'hypothermie, ainsi que de l'équipement et des techniques permettant de prévenir ces dangers.
  tldr: En dessous de 15 °C, une combinaison néoprène est indispensable. En dessous de 10 °C, ajoutez bottillons, gants et cagoule. Le choc thermique provoque une inspiration involontaire. L'incapacité de nage survient en 3 à 5 minutes dans une eau à moins de 10 °C. Les symptômes de l'hypothermie incluent frissons, confusion et perte de coordination.
  problem: Vous pagayez par une journée ensoleillée sans savoir que l'eau est à 8 °C. Vous tombez à l'eau, inspirez involontairement et sentez vos membres s'engourdir en quelques minutes. L'eau froide tue plus vite que n'importe quel autre danger en mer.
  explanation: "L'immersion en eau froide comporte quatre phases : le choc thermique (0-2 min) — inspiration brusque, hyperventilation. L'incapacité de nage (3-15 min) — les muscles refroidissent, la coordination lâche. L'hypothermie (15-45 min) — la température centrale chute sous 35 °C, provoquant confusion et arrêt cardiaque. Le collapsus post-sauvetage — le sang refroidi revient vers les organes vitaux."
  solution: "Vérifiez la température de l'eau. Portez une combinaison adaptée à cette température. Ne pagayez jamais seul dans une eau à moins de 15 °C. Emportez un sifflet et un téléphone. Si vous tombez à l'eau : contrôlez votre respiration, remontez rapidement sur la planche. Si vous avez trop froid, demandez de l'aide."
  recommendation: La combinaison afarer Wetsuit Pro 5/4/3 mm est le minimum pour une eau entre 8 et 14 °C. Ajoutez les bottillons afarer 5 mm et les gants 3 mm. Portez le Life Vest Pro pour une protection thermique supplémentaire.
  faq:
    - q: Combien de temps puis-je survivre dans une eau à 10 °C ?
      a: Le choc thermique dure 1 à 2 minutes. Sans flottaison ni protection thermique, le temps de survie est de 30 à 60 minutes.
    - q: Quels sont les premiers signes de l'hypothermie ?
      a: Frissons incontrôlables, confusion, coordination défaillante, propos confus. Arrêtez l'activité et réchauffez-vous immédiatement.
    - q: Comment me réchauffer après une session en eau froide ?
      a: Retirez l'équipement mouillé, séchez-vous, enfilez des couches chaudes, y compris un bonnet et des gants. Buvez des boissons chaudes non alcoolisées.
    - q: Peut-on attraper une hypothermie en été ?
      a: Oui — une eau à moins de 15 °C existe dans de nombreux endroits, même en été. L'eau conduit la chaleur 25 fois plus vite que l'air.

- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'Autosauvetage en paddle : comment remonter sur sa planche en eau profonde'
  description: Tout paddler devrait maîtriser l'autosauvetage. Techniques pas à pas pour remonter sur votre planche en eau profonde, la remorquer jusqu'au rivage et gérer un leash emmêlé.
  definition: L'autosauvetage en paddle est la technique permettant de remonter sur sa planche de paddle en eau profonde après une chute, incluant la récupération de la planche, la remontée du corps et la récupération de la pagaie.
  tldr: "Après une chute : restez calme, gardez la pagaie en main, nagez vers la planche. Posez la pagaie en travers de la planche. Utilisez un battement de jambes type dauphin pour propulser votre buste sur la planche. Faites monter une jambe, puis l'autre. Mettez-vous d'abord à genoux, puis debout. Entraînez-vous en eau calme jusqu'à ce que le geste devienne un réflexe."
  problem: Vous tombez de votre paddle en eau profonde et ne parvenez pas à remonter. La planche glisse, vous êtes fatigué et la panique s'installe. Sans connaître la technique d'autosauvetage, une simple chute devient dangereuse.
  explanation: "L'autosauvetage comporte trois phases : la récupération (nager vers la planche et la pagaie), la remontée (remonter sur la planche) et la reprise (recommencer à pagayer). La clé est d'utiliser la pagaie comme stabilisateur et des coups de jambes puissants pour propulser le haut du corps sur la planche."
  solution: 'Phase 1 : nagez vers la planche. Gardez la pagaie ou récupérez-la. Phase 2 : placez la pagaie perpendiculairement en travers de la planche. Battez vigoureusement des jambes tout en tirant votre buste vers le centre de la planche. Phase 3 : une fois le buste sur la planche, faites monter les jambes une par une. Phase 4 : mettez-vous à genoux, reprenez votre souffle, puis levez-vous progressivement.'
  recommendation: Entraînez-vous à l'autosauvetage dans des conditions contrôlées jusqu'à ce que cela devienne un automatisme. Utilisez l'afarer SUP Explorer 11, qui offre une bonne adhérence de pont. Le Life Vest Pro apporte une flottabilité supplémentaire si vous êtes en difficulté.
  faq:
    - q: Comment remonter si je suis épuisé ?
      a: Restez avec la planche pour la flottabilité. Utilisez vos bras pour tirer votre buste sur la planche, même si vos jambes ne peuvent plus battre efficacement. Reposez-vous à genoux avant de vous lever.
    - q: Que faire si je perds la pagaie ?
      a: Utilisez vos bras pour pagayer la planche jusqu'au rivage. Demandez de l'aide à un autre paddler. Remplacez immédiatement la pagaie perdue.
    - q: Puis-je m'autosauver dans les vagues ?
      a: Oui — positionnez la planche perpendiculairement aux vagues. Calquez votre remontée entre deux vagues. Le leash garde la planche à proximité.
    - q: Comment gérer un leash emmêlé ?
      a: Restez calme, flottez sur le dos, démêlez le leash lentement. Si le leash est enroulé autour des ailerons, vous devrez peut-être retirer les ailerons dans l'eau.

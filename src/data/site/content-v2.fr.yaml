- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: 'Combinaison 3 mm ou 5 mm : les erreurs que commettent la plupart des débutants en eau froide'
  description: Arrêtez de geler en pleine session ou de surchauffer sur la plage. La vraie différence entre les combinaisons 3 mm et 5 mm — tableau des températures, compromis de flexibilité et ce qui fonctionne vraiment pour le surf en eau froide.
  definition: Une combinaison néoprène est un vêtement qui emprisonne une fine couche d'eau contre la peau ; la chaleur du corps réchauffe cette eau pour l'isolation. L'épaisseur (3 mm, 5 mm) détermine la plage de températures que la combinaison peut encaisser — plus épais signifie plus chaud, mais moins flexible.
  tldr: L'épaisseur de la combinaison détermine directement la chaleur et la flexibilité. Utilisez du 3 mm pour une eau au-dessus de 16 °C et du 5 mm pour une eau entre 8 °C et 16 °C. Les combinaisons plus épaisses restreignent les mouvements mais vous gardent au chaud plus longtemps — privilégiez toujours la coupe à la marque.
  problem: Vous ouvrez une boutique en ligne ou entrez dans un surf shop et vous voyez des combinaisons étiquetées 3/2, 4/3, 5/4 et 5 mm intégrales. Ces chiffres ne veulent pas dire grand-chose jusqu'à ce que vous compreniez qu'une mauvaise épaisseur signifie soit geler en pleine session, soit surchauffer et transpirer sur la plage.
  explanation: Les combinaisons fonctionnent en emprisonnant une fine couche d'eau entre la peau et le néoprène ; votre corps réchauffe cette eau, ce qui crée une isolation. Un néoprène plus épais emprisonne plus d'eau mais réduit la flexibilité et la flottabilité. Une combinaison 3 mm (souvent 3/2 avec des bras plus fins) convient aux conditions clémentes, tandis qu'une 5 mm (5/4/3 ou 5 mm intégrale) convient à l'eau froide. Les fermetures zip poitrine isolent mieux que le zip dos et réduisent les entrées d'eau. La construction des coutures — collées et cousues à points aveugles (GBS) — fait la différence entre une combinaison qui laisse passer l'eau et une combinaison qui tient chaud.
  solution: Adaptez l'épaisseur à la température locale de l'eau avec une marge de 5 °C. En climat tempéré, achetez une 3/2 mm. En eau froide, achetez une 5/4/3 mm. Ajoutez des bottillons, des gants et une cagoule pour étendre votre plage d'utilisation de 5 °C supplémentaires vers le bas. Essayez les combinaisons avant d'acheter ou choisissez une marque avec une politique de retour généreuse.
  recommendation: La combinaison afarer Wetsuit Pro en 5/4/3 mm est idéale pour la plupart des surfeurs en eau froide, avec ses coutures GBS et sa doublure thermique. Si vous surfez dans une eau chaude au-dessus de 20 °C, une 3/2 mm avec zip poitrine est le meilleur choix.
  faq:
    - q: À partir de quelle température d'eau une combinaison 5 mm est-elle nécessaire ?
      a: Des températures d'eau entre 8 °C et 14 °C exigent une combinaison 5 mm. En dessous de 8 °C, il vous faut une combinaison capuche 6/5/4 mm. Entre 14 °C et 18 °C, une 4/3 mm convient bien à la plupart des gens.
    - q: Puis-je porter une combinaison 3 mm en hiver ?
      a: Uniquement dans les climats hivernaux doux où l'eau reste au-dessus de 16 °C. Pour un vrai surf d'hiver, une 5 mm ou une 5/4/3 mm est nécessaire. Bottillons, gants et cagoule apportent une chaleur équivalente sans avoir besoin d'un buste plus épais.
    - q: À quel point une combinaison doit-elle être serrée ?
      a: Près du corps sans être restrictive. Il ne doit y avoir ni poche d'air ni néoprène lâche. Si vous pouvez glisser un doigt entre votre peau et la combinaison dans le bas du dos, elle est trop lâche. Si la respiration est difficile ou si les mouvements sont très restreints, prenez une taille au-dessus.
    - q: Les combinaisons chères tiennent-elles plus chaud ?
      a: Un prix plus élevé signifie souvent un meilleur néoprène (à base de calcaire plutôt que de pétrole), une meilleure construction des coutures (GBS contre simple collage) et une meilleure flexibilité. Ces facteurs influencent directement la chaleur et la durabilité, mais seulement si la coupe est la bonne.

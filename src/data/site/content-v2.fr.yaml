- slug: understanding-tides
  category: guide
  type: technical
  title: 'Comprendre les marées pour les sports nautiques : un guide pratique'
  description: Comment les marées influencent les conditions de paddle et de surf. Lire les horaires de marée, comprendre les marées de vive-eau et de morte-eau, et planifier votre session selon les mouvements de marée pour plus de sécurité.
  definition: Les marées sont la montée et la descente quotidiennes du niveau de la mer, causées par l'attraction gravitationnelle de la lune et du soleil. Le marnage varie selon le lieu et le cycle lunaire.
  tldr: "Deux marées hautes et deux marées basses par jour dans la plupart des régions. Les marées de vive-eau (pleine lune/nouvelle lune) ont un marnage plus grand et des courants plus forts. Les marées de morte-eau (quartiers de lune) ont un marnage plus faible. La marée influence la profondeur de l'eau, la forme des vagues et la force des courants. En paddle : pagayez d'abord contre le courant pour qu'il vous aide au retour."
  problem: Vous arrivez sur votre spot local et trouvez presque aucune vague, des courants d'arrachement dangereux dus à la marée descendante, ou une eau trop peu profonde. Sans comprendre les marées, vous gaspillez des déplacements ou pagayez dans des conditions dangereuses.
  explanation: Les marées sont causées par la gravité de la lune. Les marées de vive-eau (pleine et nouvelle lune) produisent les plus hautes mers et les plus basses mers. Les marées de morte-eau (quartier de lune) produisent un marnage minimal. Les courants de marée sont plus rapides à mi-marée et nuls à l'étale. Le marnage varie de 0,3 m (Méditerranée) à 16 m (baie de Fundy).
  solution: "Consultez l'annuaire des marées avant chaque session. Pour le surf : les beach breaks fonctionnent souvent le mieux 2 à 3 heures de part et d'autre de la marée haute. Pour le paddle : pagayez contre le courant pendant la première moitié du parcours pour qu'il vous assiste au retour. Pour la pêche : la marée montante pousse les poissons sur les hauts-fonds."
  recommendation: Utilisez les prévisions de marées de la NOAA ou une application locale de marées. Apprenez la marée préférée de votre spot en notant les conditions pendant un mois.
  faq:
    - q: Qu'est-ce qu'une marée de vive-eau ?
      a: Les marées de vive-eau se produisent pendant les pleines et nouvelles lunes, générant des marées plus hautes et des courants plus forts. Elles surviennent deux fois par mois.
    - q: Qu'est-ce qu'une marée de morte-eau ?
      a: Les marées de morte-eau se produisent pendant les quartiers de lune. Le marnage est plus faible et les courants moins forts — idéal pour les débutants.
    - q: Les marées basses sont-elles dangereuses pour le paddle ?
      a: La marée basse peut mettre à nu des rochers et des récifs. Elle concentre aussi l'énergie des vagues sur des bancs de sable plus abrupts.
    - q: Comment les marées influencent-elles les courants d'arrachement ?
      a: La marée descendante (reflux) renforce les courants d'arrachement. La marée montante (flot) les affaiblit.

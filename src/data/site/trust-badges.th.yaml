    title: 'รับรอง BSCI'
    desc: 'ผ่านการตรวจสอบการปฏิบัติตามด้านสังคม — การผลิตอย่างมีจริยธรรมสำหรับผู้ซื้อในยุโรป'
    variant: cert
  - icon: "\u2714"
    title: 'ปฏิบัติตาม REACH'
    desc: 'วัสดุทั้งหมดเป็นไปตามข้อบังคับด้านความปลอดภัยทางเคมีของสหภาพยุโรป'
    variant: cert

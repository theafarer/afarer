cases:
  - id: beginner
    title: '初心者向けウォータースポーツ'
    desc: '初めての方にも安定したSUPボード。'
    scenario: >-
      週末に湖畔を訪れた家族がパドルボードに挑戦したいと考えています。安定していて、簡単に進水でき、明確な安全案内がある装備が必要です。
    solution: >-
      SUP Explorer 11は幅広の構造で初心者にも安定性を提供します。Life Vest ClassicはCE認証の浮力を保証します。Dual-Actionポンプなら両方のボードを約15〜20分で膨らませられます。
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'アウトドア探検'
    desc: '川、湖、沿岸のツアーに最適な持ち運び型SUPボード。'
    scenario: >-
      アウトドア愛好家が1週間の川下りを計画し、小さく収納でき、キャンプで膨らませられ、変化する流れに対応できるボードを求めています。
    solution: >-
      SUP Explorer 11はバックパックに収まり、付属のDual-Actionポンプで約8〜12分で膨らみます。drop-stitch構造は湖、穏やかな川、沿岸の海に対応します。
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: '家族でレジャー'
    desc: '日帰りツアーやウォータースポーツ向けの安定したSUPボード。'
    scenario: >-
      4人家族が週末の湖畔での外出と一緒に漕ぐために、安定したSUPボードを求めています。
    solution: >-
      SUP Explorer 11は、全年齢向けの安定した幅広デッキのボードを提供します。Life Vest Classicが皆を安全に守ります。Dual-Actionポンプなら全てのボードを約15〜20分で膨らませられます。
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

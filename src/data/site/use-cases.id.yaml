cases:
  - id: beginner
    title: Olahraga Air untuk Pemula
    desc: Papan SUP stabil untuk pengguna pertama kali.
    scenario: >-
      Keluarga yang mengunjungi danau di akhir pekan ingin mencoba paddle
      boarding. Mereka membutuhkan perlengkapan yang stabil dan mudah
      diluncurkan dengan panduan keselamatan yang jelas.
    solution: >-
      SUP Explorer 11 memberikan stabilitas badan-lebar untuk pemula. Life
      Vest Classic memastikan daya apung tersertifikasi CE. Dual-Action Pump
      menggelembungkan kedua papan dalam sekitar 15–20 menit.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Penjelajahan Luar Ruangan
    desc: Papan SUP portabel untuk perjalanan sungai, danau, dan pesisir.
    scenario: >-
      Penggemar luar ruangan merencanakan perjalanan sungai selama seminggu
      dan membutuhkan papan yang dikemas kecil, digelembungkan di kamp, dan
      menangani arus yang bervariasi.
    solution: >-
      SUP Explorer 11 dikemas ke dalam ransel dan tergelembung dalam sekitar
      8–12 menit dengan Dual-Action Pump yang disertakan. Konstruksi
      drop-stitch-nya menangani danau, sungai lambat, dan mendayung pesisir.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Rekreasi Keluarga
    desc: Papan SUP stabil untuk perjalanan sehari dan olahraga air.
    scenario: >-
      Keluarga beranggota empat orang menginginkan papan SUP stabil untuk
      kunjungan danau akhir pekan dan mendayung bersama.
    solution: >-
      SUP Explorer 11 menyediakan papan badan-lebar yang stabil untuk semua
      usia. Life Vest Classic menjaga semua orang tetap aman. Dual-Action
      Pump menggelembungkan semua papan dalam sekitar 15–20 menit.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

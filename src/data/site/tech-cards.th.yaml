cards:
  - badge: PVC
    title: 'ชั้น PVC เกรดทะเล'
    description: 'ผ้า PVC ลามิเนตหลายชั้นสำหรับสภาพแวดล้อมทางทะเล ผ่านการทดสอบความทนทานต่อ UV การขัดสี และการทะลุ'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp'
  - badge: DS
    title: 'แกน Drop-Stitch'
    description: 'เส้นใยภายในนับพันเชื่อมชั้นบนและชั้นล่างเข้าด้วยกัน สร้างโครงสร้างแข็งแรงที่ความดัน 12–15 PSI'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp'
  - badge: RR
    title: 'ขอบรางเสริมแรง'
    description: 'รางเชื่อมสองชั้นช่วยป้องกันรอยขีดข่วนจากท่าเรือ การจอดบนชายหาด และแรงกระแทกทางด้านข้าง'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp'

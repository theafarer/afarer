cases:
  - id: beginner
    title: 'Sporturi acvatice pentru începători'
    desc: 'Plăci SUP stabile pentru prima utilizare.'
    scenario: >-
      O familie care își petrece weekendul la un lac vrea să încerce paddleboardingul. Au nevoie de echipament stabil, ușor de lansat și cu instrucțiuni clare de siguranță.
    solution: >-
      Placa SUP Explorer 11 oferă stabilitate prin construcția lată – ideală pentru începători. Life Vest Classic asigură flotabilitate certificată CE. Pompa Dual-Action umflă ambele plăci în circa 15–20 de minute.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Explorare în natură'
    desc: 'Plăci SUP portabile pentru râuri, lacuri și excursii pe coastă.'
    scenario: >-
      Un pasionat de outdoor planifică o săptămână pe un râu și are nevoie de o placă compactă, gonflabilă în tabără, care să facă față curenților variabili.
    solution: >-
      Placa SUP Explorer 11 încape într-un rucsac și se umflă în circa 8–12 minute cu pompa Dual-Action inclusă. Construcția drop-stitch face față lacurilor, râurilor liniștite și apelor de coastă.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: 'Recreere în familie'
    desc: 'Plăci SUP stabile pentru excursii de o zi și sporturi acvatice.'
    scenario: >-
      O familie de patru persoane vrea plăci SUP stabile pentru ieșirile de weekend la lac și pentru a vâsli împreună.
    solution: >-
      Placa SUP Explorer 11 oferă plăci stabile, cu punte lată, pentru toate vârstele. Life Vest Classic îi ține pe toți în siguranță. Pompa Dual-Action umflă toate plăcile în circa 15–20 de minute.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

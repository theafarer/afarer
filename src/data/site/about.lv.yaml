origin:
  tagline: Mūsu izcelsme
  heading: |-
    Radīti uz ūdens,<br />
    <span class="text-sky-600">vadīti ar mērķi</span>
  paragraphs:
    - 'afarer aizsākās piekrastes darbnīcā ar vienu dēli un stūrgalvīgu pārliecību: jūras produkti ir jākonstruē tā, it kā tiem būtu nozīme — jo tā arī ir.'
    - Mūsu dibinātāji, divi jūras inženieri, redzēja nozari, kurā tika ekonomēts uz kvalitātes rēķina, materiāli tika degradēti un drošība bija vien formalitāte. Viņi uzbūvēja pirmo afarer korpusu nevis peļņas dēļ, bet lai pierādītu, ka pieejams jūras aprīkojums var būt arī patiesi uzticams.
    - Tas pirmais korpuss joprojām ir ekspluatācijā. Šis princips nekad nav mainījies.
    - Mēs neesam lielākais ražotājs. Mēs neražojam lētākos produktus. Taču katrs korpuss, kas pamet mūsu darbnīcu, iziet caur tām pašām rokām, kas nodibināja uzņēmumu — un atbilst tam pašam standartam, ko noteica pirmais korpuss.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: afarer piekrastes darbnīca
philosophy:
  tagline: Mūsu filozofija
  heading: Sakņojas okeānā
  description: Okeāns nav mūsu darbavieta. Tas ir mūsu skolotājs. Katrs dizaina lēmums sākas ar izpratni par to, kā uzvedas ūdens, kā mainās apstākļi un kā aprīkojumam jāreaģē.
  cards:
    - emoji: 🌊
      title: Cieni ūdeni
      description: Ūdens ir neprognozējams. Mūsu produkti ir konstruēti vissliktākajiem apstākļiem, nevis labākajiem. Ja korpuss spēj izturēt pretstraumi, tas izturēs arī ezeru. Ja glābšanas veste darbojas atklātā jūrā, upes vajadzībām tā ir pat pārlieku uzticama — un tā ir apzināta izvēle.
    - emoji: 🔧
      title: Radīts ilgam mūžam, nevis nomaiņai
      description: Ilgtspējīgākais produkts ir tas, kuram nav nepieciešama nomaiņa. Jūras klases PVC un drop-stitch konstrukcija ir izvēlētas ilgmūžībai. Mēs joprojām piegādājam rezerves daļas korpusiem, ko uzbūvējām pirms desmit gadiem.
    - emoji: 🏆
      title: Pieejams pēc dizaina
      description: Ūdens sportam nav jābūt greznībai. Mēs izstrādājam produktus, kas sniedz profesionāla līmeņa veiktspēju par cenu, kas ir saprātīga ģimenēm, gidiem un mazajiem operatoriem — ne tikai komercflotēm.
design:
  tagline: Dizaina filozofija
  heading: |-
    Konstruēts apstākļu<br />
    <span class="text-sky-600">robežai</span>
  paragraphs:
    - 'Katrs afarer produkts sākas ar vienu jautājumu: <em>kādi ir vissliktākie apstākļi, kādos tam būs jādarbojas?</em> Mēs konstruējam no robežas uz iekšpusi, nevis no centra uz āru.'
    - 'Mūsu drop-stitch kodoli ir paredzēti 15 PSI — nevis tāpēc, ka 12 PSI ezera vajadzībām nepietiktu, bet tāpēc, ka 15 PSI dēlis iztur pēkšņi saceltos viļņus, nesaliekoties. Mūsu klāja audumi ir izstrādāti komercklases UV noturībai — nevis tāpēc, ka katrs klients airē tropos, bet tāpēc, ka UV degradācija ir #1 priekšlaicīgas bojāšanās cēlonis.'
    - Mēs nekonstruējam pēc cenas punkta. Mēs konstruējam līdz bojājuma robežai — un pēc tam būvējam ievērojami augstāk par to.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: afarer dizains un inženierija
  stats:
    - value: '15'
      label: PSI kodola<br />reitings
    - value: 1,500+
      label: UV stundas<br />testētas
    - value: 10yr
      label: korpusa<br />kalpošanas laiks

origin:
  tagline: Meie päritolu
  heading: |-
    Ehitatud vee peal,<br />
    <span class="text-sky-600">eesmärgi ajel</span>
  paragraphs:
    - 'afarer sai alguse rannikutöökojast ühe laua ja kangekaelse veendumusega: meretooted tuleb konstrueerida nii, nagu oleks neil tähendust — sest see on neil tõepoolest.'
    - 'Meie asutajad, kaks mereinseneri, nägid valdkonda, kus säästmise nimel ohverdati kvaliteeti, materjale asendati odavamatega ja ohutust käsitleti kui formaalsust. Nad ehitasid esimese afareri kere mitte kasumi pärast, vaid et tõestada: taskukohane meretarvik võib olla ka tõeliselt usaldusväärne.'
    - See esimene kere on tänapäevalgi kasutuses. See põhimõte pole kunagi muutunud.
    - Me ei ole suurim tootja. Me ei valmista kõige odavamaid tooteid. Kuid iga kere, mis meie töökojast väljub, läbib samu käsi, mis panid ettevõtte aluse — ja vastab samale standardile, mille kehtestas see esimene kere.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: afareri rannikutöökoda
philosophy:
  tagline: Meie filosoofia
  heading: Juured ookeanis
  description: Ookean ei ole meie töökoht. See on meie õpetaja. Iga disainilahendus algab mõistmisest, kuidas vesi käitub, kuidas tingimused muutuvad ja kuidas peab varustus reageerima.
  cards:
    - emoji: 🌊
      title: Austa vett
      description: Vesi on ettearvamatu. Meie tooted on konstrueeritud halvimaks tingimusteks, mitte parimateks. Kui kere tuleb toime tugeva rannavooluga, tuleb ta toime ka järvega. Kui päästevest töötab avameres, on ta jõe jaoks üle konstrueeritud — ja see on tahtlik.
    - emoji: 🔧
      title: Ehitatud vastu pidama, mitte asendamiseks
      description: Kõige jätkusuutlikum toode on see, mida ei pea asendama. Meretüüpi PVC ja drop-stitch-konstruktsioon on valitud pika eluea tagamiseks. Me saadame endiselt varuosi keretele, mille ehitasime kümme aastat tagasi.
    - emoji: 🏆
      title: Taskukohane juba disainilt
      description: Veesport ei tohiks olla luksus. Me konstrueerime tooteid, mis pakuvad professionaalse klassi jõudlust hinnaga, mis on mõistlik peredele, giididele ja väikeettevõtjatele — mitte ainult kommertsoperaatoritele.
design:
  tagline: Disainifilosoofia
  heading: |-
    Konstrueeritud tingimuste<br />
    <span class="text-sky-600">äärepoolseks piiriks</span>
  paragraphs:
    - 'Iga afareri toode algab ühest küsimusest: <em>mis on halvim tingimus, millega see silmitsi seisab?</em> Me disainime piirilt sissepoole, mitte keskelt väljapoole.'
    - 'Meie drop-stitch-tuumade nimirõhk on 15 PSI — mitte sellepärast, et 12 PSI ei piisaks järve jaoks, vaid sellepärast, et 15 PSI laud talub äkilist lainetust paindumata. Meie tekikangad on määratletud kommertsklassi UV-kindlusega — mitte sellepärast, et iga klient sõudaks troopikas, vaid sellepärast, et UV-degradatsioon on enneaegse rikke #1 põhjus.'
    - Me ei disaini hinnapunkti järgi. Me disainime rikketaseme järgi — ja ehitame seejärel selgelt sellest kõrgemale.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: afareri disain ja inseneritöö
  stats:
    - value: '15'
      label: PSI tuuma<br />klass
    - value: 1,500+
      label: UV-tundi<br />testitud
    - value: 10yr
      label: kere<br />eluiga

cases:
  - id: beginner
    title: Vandsport for begyndere
    desc: 'Stabile SUP-brædder til førstegangsbrugere.'
    scenario: >-
      En familie, der tilbringer weekenden ved en sø, vil prøve paddleboarding. De har brug for stabilt, let udstyr med klare sikkerhedsinstruktioner.
    solution: >-
      SUP Explorer 11 giver stabilitet med sin brede konstruktion – ideel til begyndere. Life Vest Classic sikrer CE-certificeret opdrift. Dual-Action-pumpen fylder begge brædder på cirka 15–20 minutter.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: Friluftsekspeditioner
    desc: 'Bærbare SUP-brædder til floder, søer og kystture.'
    scenario: >-
      En friluftsentusiast planlægger en uges flodtur og har brug for et bræt, der pakkes lille, pumpes op ved lejren og klarer skiftende strømme.
    solution: >-
      SUP Explorer 11 passer i en rygsæk og pumpes op på cirka 8–12 minutter med den medfølgende Dual-Action-pumpe. Drop-stitch-konstruktionen klarer søer, rolige floder og kystnært vand.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Familiehygge
    desc: 'Stabile SUP-brædder til dagsture og vandsport.'
    scenario: >-
      En familie på fire vil have stabile SUP-brædder til weekendture ved søen og til fælles padling.
    solution: >-
      SUP Explorer 11 tilbyder stabile brædder med bredt dæk til alle aldre. Life Vest Classic holder alle sikre. Dual-Action-pumpen fylder alle brædder på cirka 15–20 minutter.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

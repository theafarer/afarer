cases:
  - id: beginner
    title: 'Deportes acuáticos para principiantes'
    desc: Tablas de SUP estables para quienes las usan por primera vez.
    scenario: >-
      Una familia que pasa el fin de semana en un lago quiere probar el paddle surf. Necesitan equipamiento estable, fácil de botar y con instrucciones de seguridad claras.
    solution: >-
      La SUP Explorer 11 ofrece estabilidad de cuerpo ancho para principiantes. El Life Vest Classic garantiza flotación certificada CE. La bomba Dual-Action infla ambas tablas en unos 15–20 minutos.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Exploración al aire libre'
    desc: 'Tablas de SUP portátiles para ríos, lagos y salidas a la costa.'
    scenario: >-
      Un amante del aire libre planea un viaje de una semana por un río y necesita una tabla que ocupe poco espacio, se infle en el campamento y soporte corrientes variables.
    solution: >-
      La SUP Explorer 11 se guarda en una mochila y se infla en unos 8–12 minutos con la bomba Dual-Action incluida. Su construcción drop-stitch aguanta lagos, ríos tranquilos y navegación costera.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Recreo familiar
    desc: 'Tablas de SUP estables para excursiones de un día y deportes acuáticos.'
    scenario: >-
      Una familia de cuatro quiere tablas de SUP estables para salidas de fin de semana al lago y remar juntos.
    solution: >-
      La SUP Explorer 11 ofrece tablas estables y anchas para todas las edades. El Life Vest Classic mantiene a todos a salvo. La bomba Dual-Action infla todas las tablas en unos 15–20 minutos.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - icon: "\u2714"
    title: BSCI sertifikuota
    desc: Socialinio atitikimo auditas patvirtintas — etiška gamyba Europos pirkėjams.
    variant: cert
  - icon: "\u2714"
    title: Atitinka REACH
    desc: Visos medžiagos atitinka ES cheminių medžiagų saugos reglamentus.
    variant: cert

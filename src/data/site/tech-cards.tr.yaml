cards:
  - badge: PVC
    title: 'Denizcilik sınıfı PVC katman'
    description: 'Deniz ortamları için çok katmanlı lamine PVC kumaş. UV, aşınma ve delinme direncine karşı test edilmiştir.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp'
  - badge: DS
    title: 'Drop-stitch çekirdek'
    description: 'Binlerce iç iplik üst ve alt katmanı birbirine bağlayarak 12–15 PSI basınçta sert, yüksek basınçlı bir yapı oluşturur.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp'
  - badge: RR
    title: 'Güçlendirilmiş ray kenarı'
    description: 'Çift katmanlı, füzyon kaynaklı ray; iskele sürtünmelerine, plaj inişlerine ve yan darbelere karşı korur.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp'

cases:
  - id: beginner
    title: Mga Water Sport para sa mga Baguhan
    desc: Matatag na mga SUP board para sa mga first-time na gumagamit.
    scenario: >-
      Isang pamilyang bumibisita sa lawa para sa katapusan ng linggo ay
      gustong subukan ang paddle boarding. Kailangan nila ng matatag at
      madaling ilunsad na kagamitan na may malinaw na gabay sa kaligtasan.
    solution: >-
      Ang SUP Explorer 11 ay nagbibigay ng wide-body na katatagan para sa
      mga baguhan. Ang Life Vest Classic ay nagsisiguro ng CE-certified na
      flotation. Ang Dual-Action Pump ay nagpapaga sa parehong board sa loob
      ng humigit-kumulang 15–20 minuto.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Pang-outdoor na Pagsisiyasat
    desc: Mga portable na SUP board para sa mga biyahe sa ilog, lawa, at dalampasigan.
    scenario: >-
      Isang mahilig sa outdoor ay nagpaplano ng isang linggong biyahe sa
      ilog at nangangailangan ng board na maliit i-pack, napapaga sa camp,
      at kayang humawak ng iba't ibang agos.
    solution: >-
      Ang SUP Explorer 11 ay kasya sa isang backpack at napapaga sa loob ng
      humigit-kumulang 8–12 minuto gamit ang kasamang Dual-Action Pump. Ang
      drop-stitch nitong konstruksyon ay kayang humawak ng mga lawa,
      mabagal na ilog, at coastal paddling.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Rekreasyon ng Pamilya
    desc: Matatag na mga SUP board para sa mga day trip at water sports.
    scenario: >-
      Isang pamilyang may apat na miyembro ay nais ng matatag na mga SUP
      board para sa mga katapusan-ng-linggong pagbisita sa lawa at
      sabay-sabayang pag-paddle.
    solution: >-
      Ang SUP Explorer 11 ay nagbibigay ng matatag at wide-body na mga
      board para sa lahat ng edad. Ang Life Vest Classic ay
      nagpapanatiling ligtas sa lahat. Ang Dual-Action Pump ay nagpapaga sa
      lahat ng board sa loob ng humigit-kumulang 15–20 minuto.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

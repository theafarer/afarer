cards:
  - badge: PVC
    title: Layer ng Marine-Grade PVC
    description: Multi-layer na laminated PVC fabric na na-rate para sa marine environment. Nasubok para sa paglaban sa UV, abrasion, at puncture.
    image: https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch Core
    description: Libu-libong panloob na thread ang nag-uugnay ng itaas at ibabang layer, na lumilikha ng matigas at high-pressure na estruktura sa 12–15 PSI.
    image: https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Pinalakas na Rail Edge
    description: Ang double-layer na fusion-welded rail ay nagpoprotekta laban sa pagkiskis sa dock, paglapag sa dalampasigan, at mga side impact.
    image: https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp

cases:
  - id: beginner
    title: 'Vattensport för nybörjare'
    desc: 'Stabila SUP-brädor för förstagångsanvändare.'
    scenario: >-
      En familj som tillbringar helgen vid en sjö vill prova paddleboarding. De behöver stabil, lättsjösatt utrustning med tydliga säkerhetsanvisningar.
    solution: >-
      SUP Explorer 11 ger stabilitet genom sin breda konstruktion för nybörjare. Life Vest Classic ger CE-certifierad flytkraft. Dual-Action-pumpen fyller båda brädorna på cirka 15–20 minuter.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: Utomhusutforskning
    desc: 'Portabla SUP-brädor för floder, sjöar och kustturer.'
    scenario: >-
      En friluftsentusiast planerar en veckolång flodtur och behöver en bräda som packas litet, pumpas upp vid lägret och klarar varierande strömmar.
    solution: >-
      SUP Explorer 11 packas i en ryggsäck och pumpas upp på cirka 8–12 minuter med den medföljande Dual-Action-pumpen. Drop-stitch-konstruktionen klarar sjöar, lugna floder och kustnära paddling.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Familjerekreation
    desc: 'Stabila SUP-brädor för dagsutflykter och vattensport.'
    scenario: >-
      En familj på fyra vill ha stabila SUP-brädor för helgutflykter till sjön och för att paddla tillsammans.
    solution: >-
      SUP Explorer 11 erbjuder stabila brädor med brett däck för alla åldrar. Life Vest Classic håller alla säkra. Dual-Action-pumpen fyller alla brädor på cirka 15–20 minuter.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

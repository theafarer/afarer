cases:
  - id: beginner
    title: 'الرياضات المائية للمبتدئين'
    desc: 'ألواح SUP ثابتة لمن يستخدمونها لأول مرة.'
    scenario: >-
      ترغب عائلة تقضي عطلة نهاية الأسبوع عند بحيرة في تجربة التجديف وقوفاً. تحتاج إلى معدات ثابتة وسهلة الإنزال مع تعليمات أمان واضحة.
    solution: >-
      يوفر لوح SUP Explorer 11 ثباتاً بهيكله العريض – مثالياً للمبتدئين. تضمن سترة Life Vest Classic الطفو بشهادة CE. تضخ مضخة Dual-Action اللوحين في نحو 15–20 دقيقة.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'الاستكشاف في الهواء الطلق'
    desc: 'ألواح SUP محمولة للأنهار والبحيرات والرحلات الساحلية.'
    scenario: >-
      يخطط عاشق للطبيعة لرحلة أسبوعية على النهر ويحتاج إلى لوح ينكمش لصغر حجمه، ويُضخ في المخيم، ويتحمل التيارات المتغيرة.
    solution: >-
      يتسع لوح SUP Explorer 11 داخل حقيبة ظهر ويُضخ في نحو 8–12 دقيقة بمضخة Dual-Action المرفقة. بنية drop-stitch تتحمل البحيرات والأنهار الهادئة والمياه الساحلية.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: 'ترفيه عائلي'
    desc: 'ألواح SUP ثابتة للرحلات اليومية والرياضات المائية.'
    scenario: >-
      تريد عائلة من أربعة أفراد ألواح SUP ثابتة لنزهات نهاية الأسبوع عند البحيرة والتجديف معاً.
    solution: >-
      يوفر لوح SUP Explorer 11 ألواحاً ثابتة ذات سطح عريض لجميع الأعمار. سترة Life Vest Classic تحافظ على سلامة الجميع. تضخ مضخة Dual-Action جميع الألواح في نحو 15–20 دقيقة.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

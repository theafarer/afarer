cards:
  - badge: PVC
    title: Jūras videi piemērots PVC slānis
    description: Vairāku slāņu laminēts PVC auduma materiāls, paredzēts jūras videi. Pārbaudīts izturībai pret UV stariem, nodilumu un caurduršanu.
    image: https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-stitch kodols
    description: Tūkstoši iekšēju diegu savieno augšējo un apakšējo slāni, radot stingru, augsta spiediena struktūru pie 12–15 PSI.
    image: https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Pastiprināta bortu mala
    description: Dubultā izkausētā metinātā borta mala aizsargā pret skrāpējumiem pie piestātnēm, izkāpšanas pludmalē un sānu triecieniem.
    image: https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp

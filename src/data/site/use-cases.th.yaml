cases:
  - id: beginner
    title: 'กีฬาทางน้ำสำหรับมือใหม่'
    desc: 'บอร์ด SUP ที่มั่นคงสำหรับผู้ใช้ครั้งแรก'
    scenario: >-
      ครอบครัวที่ไปเที่ยวทะเลสาบช่วงสุดสัปดาห์อยากลองพายืน เราต้องการอุปกรณ์ที่มั่นคง ปล่อยลงน้ำง่าย และมีคำแนะนำด้านความปลอดภัยที่ชัดเจน
    solution: >-
      SUP Explorer 11 ให้ความมั่นคงด้วยตัวเรือกว้าง เหมาะสำหรับมือใหม่ Life Vest Classic ให้การลอยตัวที่ผ่านการรับรอง CE ปั๊ม Dual-Action เติมลมทั้งสองบอร์ดในประมาณ 15–20 นาที
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'การสำรวจกลางแจ้ง'
    desc: 'บอร์ด SUP พกพา สำหรับแม่น้ำ ทะเลสาบ และทริปชายฝั่ง'
    scenario: >-
      ผู้ชื่นชอบกิจกรรมกลางแจ้งวางแผนทริปล่องแม่น้ำหนึ่งสัปดาห์ ต้องการบอร์ดที่เก็บได้ขนาดเล็ก เติมลมที่แคมป์ และทนทานต่อกระแสน้ำที่แปรปรวน
    solution: >-
      SUP Explorer 11 ใส่ในเป้สะพายหลังได้ และเติมลมในประมาณ 8–12 นาทีด้วยปั๊ม Dual-Action ที่มาพร้อม โครงสร้างแบบ drop-stitch ทนทานต่อทะเลสาบ แม่น้ำที่สงบ และน้ำชายฝั่ง
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: 'นันทนาการสำหรับครอบครัว'
    desc: 'บอร์ด SUP ที่มั่นคงสำหรับทริปหนึ่งวันและกีฬาทางน้ำ'
    scenario: >-
      ครอบครัวสี่คนต้องการบอร์ด SUP ที่มั่นคงสำหรับทริปทะเลสาบช่วงสุดสัปดาห์และพายด้วยกัน
    solution: >-
      SUP Explorer 11 นำเสนอบอร์ดที่มั่นคง พื้นดาดฟ้ากว้าง สำหรับทุกวัย Life Vest Classic ทำให้ทุกคนปลอดภัย ปั๊ม Dual-Action เติมลมทุกบอร์ดในประมาณ 15–20 นาที
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

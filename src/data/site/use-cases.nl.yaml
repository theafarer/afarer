cases:
  - id: beginner
    title: Watersport voor beginners
    desc: Stabiele SUP-boards voor eerste gebruikers.
    scenario: >-
      Een gezin dat het weekend doorbrengt bij een meer wil suppen uitproberen. Ze hebben stabiele, makkelijk te water te laten uitrusting nodig met duidelijke veiligheidsinstructies.
    solution: >-
      De SUP Explorer 11 biedt breedte en stabiliteit voor beginners. De Life Vest Classic zorgt voor CE-gecertificeerd drijfvermogen. Met de Dual-Action-pomp zijn beide boards in ongeveer 15–20 minuten opgepompt.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: Buitenverkenning
    desc: 'Draagbare SUP-boards voor rivieren, meren en kusttochten.'
    scenario: >-
      Een buitensporter plant een riviertocht van een week en heeft een board nodig dat klein oprolt, op de camping opblaast en wisselende stromingen aankan.
    solution: >-
      De SUP Explorer 11 past in een rugzak en is met de meegeleverde Dual-Action-pomp in ongeveer 8–12 minuten opgepompt. De drop-stitch constructie is bestand tegen meren, rustige rivieren en kustwateren.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Gezinsrecreatie
    desc: Stabiele SUP-boards voor dagtochten en watersport.
    scenario: >-
      Een gezin van vier wil stabiele SUP-boards voor weekenduitstapjes naar het meer en om samen te peddelen.
    solution: >-
      De SUP Explorer 11 biedt stabiele boards met een breed dek voor alle leeftijden. De Life Vest Classic houdt iedereen veilig. Met de Dual-Action-pomp zijn alle boards in ongeveer 15–20 minuten opgepompt.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

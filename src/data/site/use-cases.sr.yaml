cases:
  - id: beginner
    title: Водени спортови за почетнике
    desc: Стабилне SUP даске за оне који први пут стоје на дасци.
    scenario: >-
      Породица која викенд проводи на језеру жели да проба веслање на SUP
      дасци. Потребна им је стабилна опрема која се лако спушта на воду, уз
      јасна упутства за безбедност.
    solution: >-
      SUP Explorer 11 пружа почетницима стабилност широког тела. Сигурносни
      прслук Life Vest Classic обезбеђује CE сертификовану пловност. Пумпа
      Dual-Action Pump надува обе даске за око 15–20 минута.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Истраживање природе
    desc: Преносиве SUP даске за реке, језера и обалске излете.
    scenario: >-
      Ентузијаста активностима на отвореном планира неделно сплаварење реком
      и треба му даска која се сакупи у мали пакет, надује у кампу и издржава
      променљиве струје.
    solution: >-
      SUP Explorer 11 стаје у ранац и уз приложену пумпу Dual-Action Pump
      надува се за око 8–12 минута. Њена drop-stitch конструкција издржава
      језера, споре реке и веслање уз обалу.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Породична рекреација
    desc: Стабилне SUP даске за једнодневне излете и водене спортове.
    scenario: >-
      Породица од четири члана жели стабилне SUP даске за викенд излете на
      језеро и заједничко веслање.
    solution: >-
      SUP Explorer 11 нуди стабилне даске са широким телом за све узрасте.
      Сигурносни прслук Life Vest Classic чува безбедност свих. Пумпа
      Dual-Action Pump надува све даске за око 15–20 минута.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

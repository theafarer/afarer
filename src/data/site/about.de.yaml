origin:
  tagline: 'Unsere Herkunft'
  heading: "Gebaut auf dem Wasser,<br />\n<span class=\"text-sky-600\">angetrieben von unserem Anspruch</span>"
  paragraphs:
    - 'afarer begann in einer Werkstatt an der Küste – mit einem einzigen Boot und einer unbeugsamen Überzeugung: Marineprodukte müssen so konstruiert werden, als würde es darauf ankommen —denn genau das tun sie.'
    - 'Unsere Gründer, zwei Schiffsarchitekten, erlebten eine Branche, in der an allen Ecken gespart, Materialien herabgestuft und Sicherheit als bloße Formalität abgehakt wurde. Sie bauten die erste afarer-Schale nicht aus Profitgründen, sondern um zu beweisen, dass erschwingliches Marine-Equipment auch wirklich zuverlässig sein kann.'
    - 'Diese erste Schale ist bis heute im Einsatz. Und an diesem Prinzip hat sich nie etwas geändert.'
    - 'Wir sind nicht der größte Hersteller. Wir bauen nicht die billigsten Produkte. Aber jede Schale, die unsere Werkstatt verlässt, durchläuft dieselben Hände, die das Unternehmen gegründet haben —und erfüllt denselben Anspruch, den unsere erste Schale gesetzt hat.'
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: 'afarer-Werkstatt an der Küste'

philosophy:
  tagline: 'Unsere Philosophie'
  heading: 'Verwurzelt im Ozean'
  description: 'Der Ozean ist nicht unser Arbeitsplatz. Er ist unser Lehrer. Jede Konstruktionsentscheidung beginnt mit dem Verständnis dafür, wie sich Wasser verhält, wie sich Bedingungen ändern und wie das Equipment darauf reagieren muss.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respekt vor dem Wasser'
      description: 'Wasser ist unberechenbar. Unsere Produkte werden für die schlimmsten Bedingungen konstruiert, nicht für die besten. Wenn eine Schale eine Brandungsrinne meistert, ist ein See kein Problem. Wenn eine Rettungsweste auf offener See funktioniert, ist sie für einen Fluss überdimensioniert —und das ist Absicht.'
    - emoji: "\U0001F527"
      title: 'Gebaut, um zu halten – nicht um ersetzt zu werden'
      description: 'Das nachhaltigste Produkt ist das, das nie ersetzt werden muss. Marines PVC, Hypalon und Drop-Stitch-Konstruktion werden wegen ihrer Langlebigkeit gewählt. Für Schalen, die wir vor über einem Jahrzehnt gebaut haben, liefern wir noch heute Ersatzteile.'
    - emoji: "\U0001F3C6"
      title: 'Von Grund auf zugänglich'
      description: 'Wassersport sollte kein Luxus sein. Wir entwickeln Produkte mit professioneller Leistung zu einem Preis, der für Familien, Guides und kleine Betreiber sinnvoll ist —nicht nur für kommerzielle Flotten.'

design:
  tagline: 'Design-Philosophie'
  heading: "Konstruiert für die Grenzen<br />\n<span class=\"text-sky-600\">der Bedingungen</span>"
  paragraphs:
    - 'Jedes afarer-Produkt beginnt mit einer einzigen Frage: <em>Welche ist die schlimmste Bedingung, der es je begegnen wird?</em> Wir konstruieren vom Rand her nach innen, nicht vom Zentrum nach außen.'
    - 'Unsere Drop-Stitch-Kerne sind für 15 PSI ausgelegt —nicht weil 12 PSI für einen See nicht reichen, sondern weil ein Board mit 15 PSI plötzliche Dünung ohne Durchbiegen wegsteckt. Unsere Hypalon-Schläuche sind für kommerzielle UV-Beständigkeit spezifiziert —nicht weil jeder Kunde in den Tropen paddelt, sondern weil UV-Abbau die häufigste Ursache für vorzeitige Materialermüdung ist.'
    - 'Wir konstruieren nicht auf einen Preis. Wir konstruieren auf eine Versagensgrenze —und bauen dann deutlich darüber hinaus.'
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: 'afarer Design und Entwicklung'
  stats:
    - value: '15'
      label: 'PSI-Kern-<br />Spezifikation'
    - value: '1.500+'
      label: 'getestete<br />UV-Stunden'
    - value: '10 J.'
      label: 'Lebensdauer<br />der Schale'

cards:
  - badge: PVC
    title: Lapisan PVC Gred Marin
    description: Fabrik PVC berlamina pelbagai lapisan yang ditarafkan untuk persekitaran marin. Diuji untuk ketahanan UV, lelasan dan tikaman.
    image: https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Teras Drop-Stitch
    description: Ribuan benang dalaman menghubungkan lapisan atas dan bawah, mewujudkan struktur tegar dan bertekanan tinggi pada 12–15 PSI.
    image: https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Tepi Rail Diperkukuh
    description: Rail berlamina dua yang dikimpal gabungan melindungi daripada geselan di jeti, pendaratan di pantai dan hentakan sisi.
    image: https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp

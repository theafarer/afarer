origin:
  tagline: Naši začetki
  heading: |-
    Zgrajeno na vodi,<br />
    <span class="text-sky-600">navdihnjeno s poslanstvom</span>
  paragraphs:
    - 'afarer se je začel v obmorski delavnici z eno desko in trmastim prepričanjem: pomorski izdelki morajo biti zasnovani, kot da so pomembni — ker so.'
    - Naša ustanovitelja, dva pomorska inženirja, sta videla industrijo, v kateri so krajšali poti, slabšali materiale in obravnavali varnost kot golo formalnost. Prvi trup afarer nista zgradila zaradi dobička, ampak zato, da bi dokazala, da je lahko cenovno dostopna pomorska oprema resnično zanesljiva.
    - Ta prvi trup je še danes v uporabi. To načelo se nikoli ni spremenilo.
    - Nismo največji proizvajalec. Ne izdelujemo najcenejših izdelkov. A vsak trup, ki zapusti našo delavnico, prehaja skozi isti roki, ki sta ustanovili podjetje — in izpolnjuje isti standard, ki ga je določil prvi trup.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: obmorska delavnica afarer
philosophy:
  tagline: Naša filozofija
  heading: Zakoreninjeni v oceanu
  description: Ocean ni naše delovno okolje. Je naš učitelj. Vsaka odločitev pri oblikovanju se začne z razumevanjem, kako se voda obnaša, kako se razmere spreminjajo in kako se mora oprema odzvati.
  cards:
    - emoji: 🌊
      title: Spoštovanje do vode
      description: Voda je nepredvidljiva. Naši izdelki so zasnovani za najslabše razmere, ne za najboljše. Če trup zdrži vrtinčast tok, bo zdržal tudi jezero. Če rešilni jopič deluje na odprtem morju, je za reko celo prestrojen — in to je namerno.
    - emoji: 🔧
      title: Zgrajeno, da vzdrži, ne da bi ga menjali
      description: Najbolj trajnosten izdelek je tisti, ki ga ni treba zamenjati. Pomorski PVC in drop-stitch konstrukcija sta izbrana zaradi dolgoživosti. Nadomestne dele za trupe, ki smo jih zgradili pred desetletjem, še vedno pošiljamo.
    - emoji: 🏆
      title: Dostopno po zasnovi
      description: Vodni športi ne bi smeli biti luksuz. Razvijamo izdelke, ki nudijo profesionalno raven zmogljivosti po ceni, ki ima smisel za družine, vodnike in male ponudnike — ne le za komercialne flote.
design:
  tagline: Filozofija oblikovanja
  heading: |-
    Zasnovano za sam rob<br />
    <span class="text-sky-600">razmer</span>
  paragraphs:
    - 'Vsak izdelek afarer se začne z enim vprašanjem: <em>s katerimi najslabšimi razmerami se bo soočil?</em> Oblikujemo od roba navznoter, ne od središča navzven.'
    - 'Naša drop-stitch jedra so dimenzionirana za 15 PSI — ne zato, ker 12 PSI za jezero ne bi zadostovalo, ampak zato, ker deska z 15 PSI prenese nenadno valovje, ne da bi se upogibala. Naše palubne tkanine so predpisane za komercialno odpornost proti UV sevanju — ne zato, ker vsak kupec vesla v tropih, ampak zato, ker je razgradnja zaradi UV sevanja #1 vzrok prezgodnjih odpovedi.'
    - Ne oblikujemo do ciljne cene. Oblikujemo do meje odpovedi — nato gradimo precej nad njo.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: oblikovanje in inženirstvo afarer
  stats:
    - value: '15'
      label: ocena jedra<br />v PSI
    - value: 1,500+
      label: UV ur<br />preizkušanja
    - value: 10yr
      label: življenjska doba<br />trupa

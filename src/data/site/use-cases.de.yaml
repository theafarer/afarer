cases:
  - id: beginner
    title: 'Wassersport für Einsteiger'
    desc: 'Stabile SUP-Boards für Erstnutzer.'
    scenario: >-
      Eine Familie ist am Wochenende an einem See und möchte Paddle-Boarding ausprobieren. Sie braucht stabile, leicht zu Wasser zu lassende Ausrüstung mit klaren Sicherheitshinweisen.
    solution: >-
      Das SUP Explorer 11 bietet dank breiter Bauweise Stabilität für Einsteiger. Die Life Vest Classic sorgt für CE-zertifizierten Auftrieb. Die Dual-Action-Pumpe füllt beide Boards in etwa 15–20 Minuten.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: Outdoor-Erkundung
    desc: 'Tragbare SUP-Boards für Flüsse, Seen und Küstentouren.'
    scenario: >-
      Ein Outdoor-Enthusiast plant eine einwöchige Flusstour und braucht ein Board, das klein verpackt, am Camp aufblasbar ist und wechselnden Strömungen standhält.
    solution: >-
      Das SUP Explorer 11 passt in einen Rucksack und ist mit der mitgelieferten Dual-Action-Pumpe in etwa 8–12 Minuten aufgepumpt. Die Drop-Stitch-Konstruktion meistert Seen, ruhige Flüsse und Küstengewässer.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Familienfreizeit
    desc: 'Stabile SUP-Boards für Tagesausflüge und Wassersport.'
    scenario: >-
      Eine vierköpfige Familie sucht stabile SUP-Boards für gemeinsame Wochenendausflüge am See und zum gemeinsamen Paddeln.
    solution: >-
      Das SUP Explorer 11 bietet stabile Boards mit breitem Deck für alle Altersgruppen. Die Life Vest Classic hält alle sicher. Die Dual-Action-Pumpe füllt alle Boards in etwa 15–20 Minuten.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

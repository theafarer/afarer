  tldr: afarer Surfboard Pro משלב קווי מתאר קלאסיים של longboard עם מבנה מתנפח drop-stitch מודרני. באורך 10′6″ עם נפח של 75 ליטר, הוא חותר כמו longboard אך מתקפל לתיק גב. מתאים למתחילים שלומדים לתפוס גלים ולגולשים ברמה בינונית שרוצים גלשן ביצועים ידידותי לנסיעות.

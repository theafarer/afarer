  explanation: אורך 9 הרגל נארז בתא מטען קטן. רוחב 140 הס״מ מספק יציבות נאותה. בניית drop-stitch יוצרת פלטפורמת עמידה קשיחה לחתירה.
  solution: מושלם כ-SUP נסיעות למחנאות רכב. אידיאלי לחתירה פנאיסטית באגמים ובמים רגועים.

cases:
  - id: beginner
    title: 'Sporty wodne dla początkujących'
    desc: 'Stabilne deski SUP dla osób zaczynających przygodę.'
    scenario: >-
      Rodzina spędzająca weekend nad jeziorem chce spróbować paddleboardingu. Potrzebuje stabilnego, łatwego do wodowania sprzętu z jasnymi instrukcjami bezpieczeństwa.
    solution: >-
      Deska SUP Explorer 11 zapewnia stabilność dzięki szerokiej konstrukcji – idealna dla początkujących. Kamizelka Life Vest Classic zapewnia wyporność z certyfikatem CE. Pompa Dual-Action pompuje obie deski w około 15–20 minut.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Eksploracja na świeżym powietrzu'
    desc: 'Przenośne deski SUP na rzeki, jeziora i wycieczki przybrzeżne.'
    scenario: >-
      Entuzjasta outdooru planuje tygodniową wyprawę rzeczną i potrzebuje deski, która pakuje się do małego rozmiaru, pompuje się na obozie i poradzi sobie ze zmiennymi prądami.
    solution: >-
      Deska SUP Explorer 11 mieści się w plecaku i pompuje się w około 8–12 minut dołączoną pompą Dual-Action. Konstrukcja drop-stitch poradzi sobie z jeziorami, spokojnymi rzekami i wodami przybrzeżnymi.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Rodzinna rekreacja
    desc: 'Stabilne deski SUP na całodniowe wyjazdy i sporty wodne.'
    scenario: >-
      Czteroosobowa rodzina chce stabilne deski SUP na weekendowe wyjazdy nad jezioro i wspólne wiosłowanie.
    solution: >-
      Deska SUP Explorer 11 oferuje stabilne deski z szerokim pokładem dla wszystkich grup wiekowych. Kamizelka Life Vest Classic zapewnia bezpieczeństwo. Pompa Dual-Action pompuje wszystkie deski w około 15–20 minut.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

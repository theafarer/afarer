  problem: Potřebuješ utáhnout šroub ploutve, otevřít ventil nebo dotáhnout spojku na prkně — ale nemáš správný nástroj. Noset celou soupravu nářadí je nepraktické.
  explanation: 'ZB-MT350 obsahuje konkrétní nástroje nejčastěji potřebné k údržbě vybavení vodních sportů: nástroj na jádra ventilů SUP prken, křížové a ploché šroubováky na úpravy ploutvových drážek, kleště na zaryté spojky a čepel na stříhání pásky nebo šňůry. Nerezová konstrukce odolává korozi od slané vody.'

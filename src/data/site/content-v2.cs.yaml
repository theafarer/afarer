  description: Recenze multimatického nástroje afarer ZB-MT350 — odolný all-in-one nástroj pro milovníky vodních sportů. Perfektní na opravy a úpravy v terénu.
  definition: afarer ZB-MT350 je kompaktní multimatický nástroj s kleštěmi, nožem, šroubováky, ventilkovým nástrojem a dalšími nezbytnými funkcemi navržený konkrétně pro údržbu vybavení vodních sportů.

cases:
  - id: beginner
    title: 'Yeni başlayanlar için su sporları'
    desc: 'İlk kez kullananlar için stabil SUP tahtaları.'
    scenario: >-
      Hafta sonunu göl kenarında geçiren bir aile paddleboarding denemek istiyor. Net güvenlik talimatlarıyla birlikte stabil, kolay indirilebilir ekipmana ihtiyaçları var.
    solution: >-
      SUP Explorer 11, geniş gövdesiyle yeni başlayanlar için mükemmel denge sağlar. Life Vest Classic CE sertifikalı yüzdürme gücü sağlar. Dual-Action pompa her iki tahtayı da yaklaşık 15–20 dakikada şişirir.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Doğa keşfi'
    desc: 'Nehirler, göller ve kıyı gezileri için taşınabilir SUP tahtaları.'
    scenario: >-
      Doğa tutkunu bir kişi bir haftalık nehir gezisi planlıyor ve küçük paketlenen, kampta şişirilen ve değişken akıntılara dayanan bir tahta arıyor.
    solution: >-
      SUP Explorer 11 sırt çantasına sığar ve birlikte verilen Dual-Action pompayla yaklaşık 8–12 dakikada şişer. Drop-stitch yapı göllere, sakin nehirlere ve kıyı sularına dayanır.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: 'Aile eğlencesi'
    desc: 'Günlük geziler ve su sporları için stabil SUP tahtaları.'
    scenario: >-
      Dört kişilik bir aile, hafta sonu göl gezileri ve birlikte kürek çekmek için stabil SUP tahtaları istiyor.
    solution: >-
      SUP Explorer 11 her yaş için stabil, geniş güverteli tahtalar sunar. Life Vest Classic herkesi güvende tutar. Dual-Action pompa tüm tahtaları yaklaşık 15–20 dakikada şişirir.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

cases:
  - id: beginner
    title: '초보자를 위한 워터스포츠'
    desc: '처음 사용자를 위한 안정적인 SUP 보드.'
    scenario: >-
      주말에 호숫가를 찾은 가족이 패들보드를 체험해 보려 합니다. 안정적이고 진수하기 쉬우며 명확한 안전 안내가 있는 장비가 필요합니다.
    solution: >-
      SUP Explorer 11은 넓은 몸체로 초보자에게 안정성을 제공합니다. Life Vest Classic은 CE 인증 부력을 보장합니다. Dual-Action 펌프로 두 보드를 약 15~20분 안에 부풀릴 수 있습니다.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: '야외 탐험'
    desc: '강, 호수, 해안 여행을 위한 휴대용 SUP 보드.'
    scenario: >-
      아웃도어 애호가가 일주일간의 강 여행을 계획하며, 작게 접히고 캠프에서 부풀리며 변화하는 물살을 견딜 수 있는 보드가 필요합니다.
    solution: >-
      SUP Explorer 11은 백팩에 들어가며, 포함된 Dual-Action 펌프로 약 8~12분 안에 부풀립니다. drop-stitch 구조는 호수, 잔잔한 강, 해안 바다를 견딥니다.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: '가족 레크리에이션'
    desc: '당일치기 여행과 워터스포츠를 위한 안정적인 SUP 보드.'
    scenario: >-
      네 가족이 주말 호수 나들이와 함께 노를 젓기 위해 안정적인 SUP 보드를 원합니다.
    solution: >-
      SUP Explorer 11은 모든 연령대를 위한 안정적인 넓은 데크 보드를 제공합니다. Life Vest Classic이 모두를 안전하게 지킵니다. Dual-Action 펌프로 모든 보드를 약 15~20분 안에 부풀립니다.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

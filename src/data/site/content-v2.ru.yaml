  problem: Вам нужен надёжный жилет, не требующий ухода, для лодки, рыбалки или общего использования на воде, который не ударит по кошельку и не требует особого ухода.
  explanation: Life Vest Classic использует пену с закрытыми ячейками — жилет не требует обслуживания, замены баллонов CO2 и не может случайно сдуться. Конструкция Типа III даёт 7,5 кг плавучести — этого достаточно, чтобы удержать на плаву большинства взрослых в спокойных и умеренных условиях. Универсальная посадка с регулируемыми боковыми ремнями подходит разным типам телосложения.

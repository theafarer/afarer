  description: Обзор afarer Life Vest Classic — одобренного USCG пенного спасательного жилета Типа III для прогулок на лодке, рыбалки и водного спорта. Комфорт, посадка, плавучесть и функции.
  definition: afarer Life Vest Classic — это одобренный USCG пенный жилет Типа III с плавучестью 7,5 кг. Создан для прогулок на лодке, рыбалки и прогулочного водного спорта.

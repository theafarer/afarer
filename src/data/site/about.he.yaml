origin:
  tagline: המקור שלנו
  heading: |-
    נבנה על המים,<br />
    <span class="text-sky-600">מונע מתוך ייעוד</span>
  paragraphs:
    - 'afarer החל את דרכו בסדנה חופית, עם לוח אחד ואמונה עיקשת: מוצרים ימיים צריכים להיות מהונדסים כאילו הם חשובים — כי הם אכן חשובים.'
    - המייסדים שלנו, שני מהנדסי ים, ראו תעשייה שבה גוזרים פינות, מנמיכים את איכות החומרים ומתייחסים לבטיחות כאל סימון במשבצת. הם בנו את גוף הלוח הראשון של afarer לא למען רווח, אלא כדי להוכיח שציוד ימי במחיר נגיש יכול להיות גם אמין באמת.
    - אותו גוף ראשון עדיין משמש בפעילות עד היום. העיקרון הזה מעולם לא השתנה.
    - אנחנו לא היצרן הגדול ביותר. אנחנו לא מייצרים את המוצרים הזולים ביותר. אבל כל גוף שיוצא מהסדנה שלנו עובר דרך אותן ידיים שהקימו את החברה — ועומד באותו סטנדרט שאותו גוף ראשון הציב.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: הסדנה החופית של afarer
philosophy:
  tagline: הפילוסופיה שלנו
  heading: שורשים באוקיינוס
  description: האוקיינוס אינו מקום העבודה שלנו. הוא המורה שלנו. כל החלטת עיצוב מתחילה בהבנת האופן שבו מתנהגים המים, כיצד משתנים התנאים וכיצד הציוד חייב להגיב.
  cards:
    - emoji: 🌊
      title: לכבד את המים
      description: המים אינם צפויים. המוצרים שלנו מהונדסים לתנאים הגרועים ביותר, לא לטובים ביותר. אם גוף לוח מסוגל להתמודד עם זרם סחף, הוא יתמודד גם עם אגם. אם אפודת הצלה עובדת בלב ים, הרי שהיא מהונדסת יתר על המידה עבור נהר — וזה מכוון מראש.
    - emoji: 🔧
      title: בנוי להחזיק מעמד, לא להחלפה
      description: המוצר הבר-קיימא ביותר הוא זה שאינו דורש החלפה. PVC בדרגה ימית ומבנה דרופ-סטיץ' נבחרו למען אורך חיים. אנחנו עדיין מספקים חלקי חילוף לגופים שבנינו לפני עשור.
    - emoji: 🏆
      title: נגיש מעצם העיצוב
      description: ספורט ימי לא צריך להיות מותרות. אנחנו מהנדסים מוצרים המספקים ביצועים ברמה מקצועית, במחיר שהגיוני עבור משפחות, מדריכים ועסקים קטנים — לא רק עבור ציים מסחריים.
design:
  tagline: פילוסופיית עיצוב
  heading: |-
    מהונדס לתנאי<br />
    <span class="text-sky-600">הקצה</span>
  paragraphs:
    - 'כל מוצר של afarer מתחיל בשאלה אחת: <em>מהו התנאי הגרוע ביותר שהוא צפוי להיתקל בו?</em> אנחנו מעצבים מהקצה פנימה, לא מהמרכז החוצה.'
    - "ליבות הדרופ-סטיץ' שלנו מדורגות ללחץ עבודה של 15 PSI — לא מפני שלחץ 12 PSI אינו מספיק לאגם, אלא מפני שלוח בדירוג 15 PSI מתמודד עם גלים פתאומיים מבלי להתכופף. בדי הסיפון שלנו מפורטים לעמידות UV בדרגה מסחרית — לא מפני שכל לקוח חותר בטרופיקה, אלא מפני שפגיעת UV היא גורם #1 לכשל מוקדם."
    - אנחנו לא מעצבים לפי נקודת מחיר. אנחנו מעצבים לפי נקודת כשל — ואז בונים הרבה מעליה.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: עיצוב והנדסה של afarer
  stats:
    - value: '15'
      label: דירוג ליבה<br />PSI
    - value: 1,500+
      label: שעות UV<br />בבדיקה
    - value: 10yr
      label: תוחלת חיים<br />של הגוף

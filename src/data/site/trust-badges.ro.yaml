badges:
  - icon: "\u2B50"
    title: 'Certificare ISO și CE'
    desc: 'Fiecare produs respectă standardele internaționale de siguranță și calitate.'
    variant: cert
  - icon: "\u2B50"
    title: 'Excelența materialelor'
    desc: 'Țesături premium din PVC și Hypalon, testate la UV, abraziune și temperaturi extreme.'
    variant: material
  - icon: "\u2B50"
    title: 'Teste riguroase'
    desc: 'Fiecare ambarcațiune trece prin teste de presiune, flotabilitate și sarcină înainte de expediere.'
    variant: standard
  - icon: "\u2B50"
    title: 'Garanție de 2 ani'
    desc: 'Toate produsele afarer sunt acoperite de o garanție completă a producătorului.'
    variant: warranty
  - icon: "\u2714"
    title: 'Certificare BSCI'
    desc: 'Audit de conformitate socială verificat — producție etică pentru cumpărătorii europeni.'
    variant: cert
  - icon: "\u2714"
    title: 'Conformitate REACH'
    desc: 'Toate materialele respectă reglementările UE privind securitatea chimică.'
    variant: cert

cases:
  - id: beginner
    title: Veesport algajatele
    desc: Stabiilsed SUP lauad neile, kes seisavad lauas esimest korda.
    scenario: >-
      Perekond, kes veedab nädalavahetusel järve ääres, soovib SUP-iga
      aerutamist proovida. Neile on vaja stabiilset, hõlpsalt vette seatavat
      varustust koos selgete ohutusjuhistega.
    solution: >-
      SUP Explorer 11 annab algajatele laia kere stabiilsuse. Päästevest Life
      Vest Classic tagab CE-sertifitseeritud ujuvuse. Pump Dual-Action Pump
      puhub mõlemad lauad umbes 15–20 minutiga täis.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Looduse avastamine
    desc: Teisaldatavad SUP lauad jõgedeks, järvedeks ja rannikusõitudeks.
    scenario: >-
      Aktiivse puhkuse entusiast planeerib nädalapikkust jõereisi ja vajab
      lauda, mis mahub väikesesse pakendi, on laagris täispuhutav ja talub
      muutuvaid voolusid.
    solution: >-
      SUP Explorer 11 mahub seljakotti ja on komplektis oleva pumbaga
      Dual-Action Pump umbes 8–12 minutiga täispuhutav. Selle
      drop-stitch-konstruktsioon talub järvi, aeglaste jõgede sõitu ja
      ranniku aerutamist.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Perekondlik puhkus
    desc: Stabiilsed SUP lauad ühepäevasõitudeks ja veespordiks.
    scenario: >-
      Neljaliikmeline perekond soovib stabiilseid SUP laudu
      nädalavahetuse järvesõitudeks ja ühiseks aerutamiseks.
    solution: >-
      SUP Explorer 11 pakub stabiilseid laia kere laudu kõigile
      vanusegruppidele. Päästevest Life Vest Classic kaitseb kõigi ohutust.
      Pump Dual-Action Pump puhub kõik lauad umbes 15–20 minutiga täis.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

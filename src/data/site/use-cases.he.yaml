cases:
  - id: beginner
    title: 'ספורט מים למתחילים'
    desc: 'גלשני SUP יציבים למשתמשים בפעם הראשונה.'
    scenario: >-
      משפחה שמבלה סוף שבוע באגם רוצה לנסות חתירה על גלשן.
      הם צריכים ציוד יציב וקל להשקה עם הדרכת בטיחות ברורה.
    solution: >-
      גלשן SUP Explorer 11 מספק יציבות גוף רחב למתחילים. אפוד
      Life Vest Classic מבטיח ציפה מוסמכת CE. משאבת
      Dual-Action מנפחת את שני הגלשנים בערך ב-15-20 דקות.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: 'חקר חוצות'
    desc: 'גלשני SUP ניידים לנהרות, אגמים וטיולי חוף.'
    scenario: >-
      חובב חוצות מתכנן טיול נהר של שבוע וצריך גלשן שנארז
      קטן, מתנפח במחנה ומתמודד עם זרמים משתנים.
    solution: >-
      גלשן SUP Explorer 11 נארז לתיק גב ומתנפח בערך ב-8-12 דקות עם משאבת
      Dual-Action הכלולה. בניית
      ה-drop-stitch שלו מתמודדת עם אגמים, נהרות איטיים וחתירה חופית.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: 'פנאי משפחתי'
    desc: 'גלשני SUP יציבים לטיולי יום ולספורט מים.'
    scenario: >-
      משפחה עם ארבע נפשות רוצה גלשני SUP יציבים לטיולי סוף שבוע
      באגם ולחתירה משותפת.
    solution: >-
      גלשן SUP Explorer 11 מספק גלשנים יציבים בגוף רחב לכל הגילאים. אפוד
      Life Vest Classic שומר על כולם. משאבת
      Dual-Action מנפחת את כל הגלשנים בערך ב-15-20 דקות.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

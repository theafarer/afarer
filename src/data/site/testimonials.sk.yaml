testimonials:
  - name: 'Sarah K.'
    quote: 'Stabilné aj pre úplných začiatočníkov. Vzala som ho na jazero v prvý deň a ani raz som nespadla.'
    rating: 5
  - name: 'James T.'
    quote: 'Zobral som ho na Bali — zmestil sa do batohu, nafúkal sa za 5 minút. Perfektný spoločník na cesty.'
    rating: 5
  - name: 'Mike R.'
    quote: 'Výborná kvalita spracovania. Pobrežné vlnobitie zvláda oveľa lepšie, než som od nafukovacieho čakal.'
    rating: 5

cases:
  - id: beginner
    title: Vannsport for nybegynnere
    desc: 'Stabile SUP-brett for førstegangsbrukere.'
    scenario: >-
      En familie som tilbringer helgen ved en innsjø vil prøve paddleboarding. De trenger stabilt, lett utstyr med klare sikkerhetsanvisninger.
    solution: >-
      SUP Explorer 11 gir stabilitet gjennom sin brede konstruksjon – ideell for nybegynnere. Life Vest Classic gir CE-sertifisert oppdrift. Dual-Action-pumpen fyller begge brettene på omtrent 15–20 minutter.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Utforskning utendørs'
    desc: 'Bærbare SUP-brett for elver, innsjøer og kystturer.'
    scenario: >-
      En friluftsentusiast planlegger en ukes elvetur og trenger et brett som pakkes lite, pumpes på leirplassen og takler skiftende strømmer.
    solution: >-
      SUP Explorer 11 pakkes i en ryggsekk og pumpes på omtrent 8–12 minutter med den medfølgende Dual-Action-pumpen. Drop-stitch-konstruksjonen takler innsjøer, rolige elver og kystnært vann.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Familiefritid
    desc: Stabile SUP-brett for dagsturer og vannsport.
    scenario: >-
      En familie på fire vil ha stabile SUP-brett for helgeturer til innsjøen og padling sammen.
    solution: >-
      SUP Explorer 11 tilbyr stabile brett med bredt dekk for alle aldre. Life Vest Classic holder alle trygge. Dual-Action-pumpen fyller alle brettene på omtrent 15–20 minutter.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

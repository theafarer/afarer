cases:
  - id: beginner
    title: Ūdens sports iesācējiem
    desc: Stabili SUP dēļi tiem, kas pirmo reizi stāv uz dēļa.
    scenario: >-
      Ģimene, kas brīvdienās apmeklē ezeru, vēlas izmēģināt airēšanu ar SUP
      dēli. Viņiem nepieciešama stabila, viegli ūdenim sagatavojama ekipējuma
      daļa ar skaidriem drošības norādījumiem.
    solution: >-
      SUP Explorer 11 sniedz iesācējiem plata korpusa stabilitāti. Glābšanas
      veste Life Vest Classic nodrošina CE sertificētu peldspēju. Sūknis
      Dual-Action Pump aptuveni 15–20 minūtēs piepūš abus dēļus.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Izpēte dabā
    desc: Pārvadājami SUP dēļi upēm, ezeriem un piekrastes izbraucieniem.
    scenario: >-
      Aktīvās atpūtas entuziasts plāno nedēļas garumā upes ceļojumu un viņam
      nepieciešams dēlis, kas salokās mazā iepakojumā, piepūšams apmetnē un
      iztur mainīgas straumes.
    solution: >-
      SUP Explorer 11 ietilpst mugursomā un ar komplektā iekļauto sūkni
      Dual-Action Pump piepūšams aptuveni 8–12 minūtēs. Tā drop-stitch
      konstrukcija iztur ezerus, lēnas upes un airēšanu pie krasta.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Ģimenes atpūta
    desc: Stabili SUP dēļi vienas dienas izbraucieniem un ūdens sportam.
    scenario: >-
      Četru personu ģimene vēlas stabili SUP dēļus brīvdienu braucieniem uz
      ezeru un kopīgai airēšanai.
    solution: >-
      SUP Explorer 11 piedāvā stabilus plata korpusa dēļus visām vecuma
      grupām. Glābšanas veste Life Vest Classic sargā visu drošību. Sūknis
      Dual-Action Pump aptuveni 15–20 minūtēs piepūš visus dēļus.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

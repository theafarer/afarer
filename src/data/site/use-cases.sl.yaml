cases:
  - id: beginner
    title: 'Vodni športi za začetnike'
    desc: 'Stabilne SUP deske za vse, ki prvič stopajo na desko.'
    scenario: >-
      Družina, ki vikend preživlja ob jezeru, želi poskusiti veslanje na SUP
      deski. Potrebujejo stabilno opremo, ki jo je enostavno spustiti na vodo,
      ter jasna varnostna navodila.
    solution: >-
      SUP Explorer 11 začetnikom nudi stabilnost širokega telesa. Rešilni
      jopič Life Vest Classic zagotavlja CE certificirano plovnost. Črpalka
      Dual-Action Pump napihne obe deski v približno 15–20 minutah.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: 'Raziskovanje na prostem'
    desc: 'Prenosne SUP deske za reke, jezera in izlete ob obali.'
    scenario: >-
      Navdušenec nad dejavnostmi na prostem načrtuje tedenski spust po reki in
      potrebuje desko, ki se zloži v majhen paket, se napihne v taboru in
      obvladuje spreminjajoče se tokove.
    solution: >-
      SUP Explorer 11 se spravi v nahrbtnik in se s priloženo črpalko
      Dual-Action Pump napihne v približno 8–12 minutah. Njena drop-stitch
      konstrukcija obvladuje jezera, počasne reke in veslanje ob obali.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: 'Družinska rekreacija'
    desc: 'Stabilne SUP deske za enodnevne izlete in vodne športe.'
    scenario: >-
      Štiričlanska družina želi stabilne SUP deske za vikend izlete na jezero
      in skupno veslanje.
    solution: >-
      SUP Explorer 11 ponuja stabilne deske s širokim telesom za vse starosti.
      Rešilni jopič Life Vest Classic zagotavlja varnost vseh. Črpalka
      Dual-Action Pump napihne vse deske v približno 15–20 minutah.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

cases:
  - id: beginner
    title: 'Sports nautiques pour débutants'
    desc: 'Planches de SUP stables pour premières utilisations.'
    scenario: >-
      Une famille au bord d’un lac le week-end veut essayer le paddleboard. Il lui faut un équipement stable, facile à mettre à l’eau et accompagné de consignes de sécurité claires.
    solution: >-
      La SUP Explorer 11 offre une stabilité de largeur généreuse pour les débutants. Le Life Vest Classic assure une flottabilité certifiée CE. La pompe Dual-Action gonfle les deux planches en 15 à 20 minutes environ.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: Exploration en plein air
    desc: 'Planches de SUP portables pour rivières, lacs et sorties côtières.'
    scenario: >-
      Un amateur de plein air prévoit une semaine de descente de rivière et cherche une planche compacte, gonflable au camp et capable d’encaisser des courants variés.
    solution: >-
      La SUP Explorer 11 se range dans un sac à dos et gonfle en 8 à 12 minutes environ avec la pompe Dual-Action fournie. Sa construction drop-stitch encaisse les lacs, les rivières calmes et les navigations côtières.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Loisirs en famille
    desc: 'Planches de SUP stables pour sorties d’une journée et sports nautiques.'
    scenario: >-
      Une famille de quatre veut des planches de SUP stables pour les sorties du week-end au lac et pagayer ensemble.
    solution: >-
      La SUP Explorer 11 offre des planches stables et larges pour tous les âges. Le Life Vest Classic protège toute la famille. La pompe Dual-Action gonfle toutes les planches en 15 à 20 minutes environ.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

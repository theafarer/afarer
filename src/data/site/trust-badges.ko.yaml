    title: 'BSCI 인증'
    desc: '검증된 사회적 컴플라이언스 감사 — 유럽 바이어를 위한 윤리적 제조.'
    variant: cert
  - icon: "\u2714"
    title: 'REACH 준수'
    desc: '모든 소재가 EU 화학물질 안전 규정을 준수합니다.'

badges:
  - icon: "\u2B50"
    title: 'ISO·CE 인증'
    desc: '모든 제품이 국제 안전 및 품질 기준을 충족합니다.'
    variant: cert
  - icon: "\u2B50"
    title: '최고의 소재'
    desc: 'UV, 마모, 극한 온도에 대해 시험된 프리미엄 PVC 및 하이팔론 원단.'

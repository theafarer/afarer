origin:
  tagline: Наше порекло
  heading: |-
    Саграђено на води,<br />
    <span class="text-sky-600">вођено сврхом</span>
  paragraphs:
    - 'afarer је настао у приморској радионици, са једном даском и тврдоглавим уверењем: производи за море треба да буду пројектовани као да су важни — јер и јесу.'
    - Наши оснивачи, два морска инжењера, видели су индустрију у којој се штедело на сваком кораку, материјали су били све лошији, а безбедност се третирала као пука формалност. Изградили су први afarer труп не ради профита, већ да би доказали да и приступачна опрема за море може бити заиста поуздана.
    - Тај први труп и данас је у употреби. Тај принцип се никада није променио.
    - Нисмо највећи произвођач. Не правимо најјефтиније производе. Али сваки труп који изађе из наше радионице пролази кроз исте руке које су основале компанију — и испуњава исти стандард који је поставио онај први труп.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: afarer приморска радионица
philosophy:
  tagline: Наша филозофија
  heading: Са коренима у океану
  description: Океан није наше радно место. Он је наш учитељ. Свака дизајнерска одлука почиње разумевањем тога како се вода понаша, како се услови мењају и како опрема мора да реагује.
  cards:
    - emoji: 🌊
      title: Поштуј воду
      description: Вода је непредвидива. Наши производи су пројектовани за најтеже услове, не за најбоље. Ако труп може да издржи јаку морску струју, издржаће и језеро. Ако спасилачки прслук функционише на отвореном мору, за реку је предимензионисан — и то је намерно.
    - emoji: 🔧
      title: Саграђено да траје, не да се мења
      description: Најодрживији производ је онај који не треба мењати. Морски PVC и дроп-стич конструкција изабрани су због дуговечности. И даље шаљемо резервне делове за трупове које смо изградили пре деценије.
    - emoji: 🏆
      title: Доступно по дизајну
      description: Спортови на води не би требало да буду луксуз. Пројектујемо производе који пружају професионалне перформансе по цени која има смисла за породице, водиче и мање оператере — не само за комерцијалне флоте.
design:
  tagline: Филозофија дизајна
  heading: |-
    Пројектовано за ивицу<br />
    <span class="text-sky-600">услова</span>
  paragraphs:
    - 'Сваки afarer производ почиње једним питањем: <em>који је најгори услов са којим ће се суочити?</em> Дизајнирамо од ивице ка унутра, а не од центра ка споља.'
    - 'Наша дроп-стич језгра оцењена су за 15 PSI — не зато што је 12 PSI недовољно за језеро, већ зато што даска од 15 PSI подноси изненадне таласе без савијања. Наше тканине за палубу специфициране су за комерцијалну UV отпорност — не зато што сваки купац весла у тропима, већ зато што је UV деградација #1 узрок превременог квара.'
    - Не дизајнирамо према циљној цени. Дизајнирамо према тачки квара — а потом градимо знатно изнад ње.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: afarer дизајн и инжењеринг

cases:
  - id: beginner
    title: 'Vodeni sportovi za početnike'
    desc: 'Stabilne SUP daske za prve korisnike.'
    scenario: >-
      Obitelj koja provodi vikend na jezeru želi isprobati veslanje na dasci.
      Trebaju stabilnu opremu koja se lako spušta u vodu, uz jasne upute o sigurnosti.
    solution: >-
      Daska SUP Explorer 11 nudi stabilnost zahvaljujući širokom obliku — idealna je za
      početnike. Prsluk Life Vest Classic osigurava CE certificiranu plovnost. Pumpa
      Dual-Action napuha obje daske u oko 15–20 minuta.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: 'Istraživanje prirode'
    desc: 'Prenosive SUP daske za rijeke, jezera i obalne izlete.'
    scenario: >-
      Ljubitelj boravka u prirodi planira tjedan dana na rijeci i treba dasku koja
      zauzima malo prostora, napuhuje se u kampu i podnosi promjenjive struje.
    solution: >-
      Daska SUP Explorer 11 stane u ruksak i napuhuje se za oko 8–12 minuta uključenom
      pumpom Dual-Action. Njezina drop-stitch konstrukcija podnosi jezera, spore rijeke
      i obalno veslanje.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: 'Obiteljska rekreacija'
    desc: 'Stabilne SUP daske za jednodnevne izlete i vodene sportove.'
    scenario: >-
      Obitelj od četiri člana želi stabilne SUP daske za vikend izlete na jezero i
      zajedničko veslanje.
    solution: >-
      Daska SUP Explorer 11 nudi stabilne daske širokog oblika za sve uzraste. Prsluk
      Life Vest Classic drži sve sigurnima na vodi. Pumpa Dual-Action napuha sve daske
      u oko 15–20 minuta.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  problem: Potrebujete SUP desko, ki gre v prtljažnik avtomobila in jo ena oseba sama postavi.
  explanation: Dolžina 9' se zapakira v majhen prtljažnik avtomobila. Širina 140 cm nudi ustrezno stabilnost. Konstrukcija drop-stitch ustvari tog plato za veslanje.
  solution: Popolna kot potovalna SUP deska za avtomobilsko kampiranje. Idealna za rekreacijsko veslanje na jezerih in mirnih vodah.
  recommendation: Za 549 USD je AirDeck 270 namenjena minimalistom, ki občasno potrebujejo prenosljivo SUP desko. Za pogostejšo uporabo se odločite za desko SUP Explorer 11.
  faq:
    - q: Ali lahko dve odrasli osebi udobno veslata?

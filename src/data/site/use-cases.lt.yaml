cases:
  - id: beginner
    title: Vandens sportas pradedantiesiems
    desc: Stabilios SUP lentos tiems, kurie pirmą kartą stovi ant lentos.
    scenario: >-
      Savaitgalį prie ežero lankanti šeima nori išbandyti irklavimą ant SUP
      lentos. Jiems reikia stabilios, lengvai vandeniui paruošiamos įrangos
      su aiškiais saugumo nurodymais.
    solution: >-
      SUP Explorer 11 suteikia pradedantiesiems plataus korpuso stabilumą.
      Gelbėjimosi liemenė Life Vest Classic užtikrina CE sertifikuotą plūdumą.
      Siurblys Dual-Action Pump per maždaug 15–20 minučių pripučia abi lentas.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Tyrinėjimai gamtoje
    desc: Pervežamos SUP lentos upėms, ežerams ir pakrančių išvykoms.
    scenario: >-
      Aktyvaus poilsio entuziastas planuoja savaitės upės žygį ir jam reikia
      lentos, kuri susilanksto į mažą paketą, pripučiama stovykloje ir
      atlaiko kintančias sroves.
    solution: >-
      SUP Explorer 11 telpa į kuprinę ir su pridedamu siurbliu Dual-Action
      Pump pripučiama per maždaug 8–12 minučių. Jos drop-stitch konstrukcija
      atlaiko ežerus, lėtas upes ir irklavimą prie kranto.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Šeimos poilsis
    desc: Stabilios SUP lentos vienos dienos išvykoms ir vandens sportui.
    scenario: >-
      Keturių asmenų šeima nori stabilių SUP lentų savaitgalio išvykoms į
      ežerą ir bendram irklavimui.
    solution: >-
      SUP Explorer 11 siūlo stabilias plataus korpuso lentas visoms amžiaus
      grupėms. Gelbėjimosi liemenė Life Vest Classic saugo visų saugumą.
      Siurblys Dual-Action Pump per maždaug 15–20 minučių pripučia visas
      lentas.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

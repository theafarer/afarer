    image: https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Megerősített rail él
    description: 'A kétrétegű, fúziósan hegesztett rail védi a kikötői súrlódástól, strandi partraszállásoktól és oldalütésektől.'
    image: https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp

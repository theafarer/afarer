cases:
  - id: beginner
    title: Vesiliikuntaa aloittelijoille
    desc: 'Vakaat SUP-laudat ensikäyttäjille.'
    scenario: >-
      Perhe viettää viikonlopun järvellä ja haluaa kokeilla melontaa seisomalla. He tarvitsevat vakaan, helposti vesille laskettavan varustuksen, jossa on selkeät turvallisuusohjeet.
    solution: >-
      SUP Explorer 11 tarjoaa vakautta leveällä rakenteellaan – ihanteellinen aloittelijoille. Life Vest Classic takaa CE-sertifioidun kelluvuuden. Dual-Action-pumppu täyttää molemmat laudat noin 15–20 minuutissa.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: Ulkoilu ja tutkimusretket
    desc: 'Kannettavat SUP-laudat joille, järville ja rannikkoretkille.'
    scenario: >-
      Luontoharrastaja suunnittelee viikon pituista jokiretkä ja tarvitsee laudan, joka pakkaantuu pieneksi, täyttyy leirissä ja kestää vaihtelevia virtauksia.
    solution: >-
      SUP Explorer 11 mahtuu reppuun ja täyttyy noin 8–12 minuutissa mukana tulevalla Dual-Action-pumpulla. Drop-stitch-rakenne kestää järvet, tyynet joet ja rannikkovedet.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Perheen vapaa-aika
    desc: 'Vakaat SUP-laudat päiväretkille ja vesiliikuntaan.'
    scenario: >-
      Neljähenkinen perhe haluaa vakaat SUP-laudat viikonloppuretkiin järvelle ja yhteismelontaan.
    solution: >-
      SUP Explorer 11 tarjoaa vakaat, leveät laudat kaikenikäisille. Life Vest Classic pitää kaikki turvassa. Dual-Action-pumppu täyttää kaikki laudat noin 15–20 minuutissa.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

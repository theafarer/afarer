testimonials:
  - name: 'Sarah K.'
    quote: 'Stabil walaupun untuk pemula sepenuhnya. Saya mencubanya di tasik pada hari pertama saya dan saya tidak pernah jatuh.'
    rating: 5
  - name: 'James T.'
    quote: 'Saya membawanya ke Bali — muat dalam satu beg galas, dipam dalam masa 5 minit. Rakan perjalanan yang sempurna.'
    rating: 5
  - name: 'Mike R.'
    quote: 'Binaan sangat kukuh. Ia mengharungi ombak kecil pesisir dengan lebih baik daripada yang saya sangka daripada papan tiup.'
    rating: 5

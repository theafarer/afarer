cases:
  - id: beginner
    title: 'Vodní sporty pro začátečníky'
    desc: 'Stabilní SUP prkna pro první použití.'
    scenario: >-
      Rodina tráví víkend u jezera a chce si vyzkoušet paddleboarding. Potřebuje stabilní, snadno použitelné vybavení s jasnými bezpečnostními pokyny.
    solution: >-
      SUP Explorer 11 nabízí stabilitu díky široké konstrukci – ideální pro začátečníky. Life Vest Classic zajišťuje vztlak s certifikací CE. Pumpa Dual-Action nafoukne obě prkna asi za 15–20 minut.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Objevování přírody'
    desc: 'Přenosná SUP prkna pro řeky, jezera a pobřežní výlety.'
    scenario: >-
      Milovník outdooru plánuje týdenní výlet po řece a potřebuje prkno, které se sbalí na malý rozměr, nahustí se v táboře a zvládne proměnlivé proudy.
    solution: >-
      SUP Explorer 11 se vejde do batohu a nafoukne se asi za 8–12 minut s přiloženou pumpou Dual-Action. Konstrukce drop-stitch zvládne jezera, klidné řeky i pobřežní vody.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: 'Rodinná rekreace'
    desc: 'Stabilní SUP prkna pro celodenní výlety a vodní sporty.'
    scenario: >-
      Čtyřčlenná rodina chce stabilní SUP prkna na víkendové výlety k jezeru a společné pádlování.
    solution: >-
      SUP Explorer 11 nabízí stabilní prkna se širokou palubou pro všechny věkové kategorie. Life Vest Classic drží všechny v bezpečí. Pumpa Dual-Action nafoukne všechna prkna asi za 15–20 minut.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

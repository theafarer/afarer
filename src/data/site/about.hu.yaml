origin:
  tagline: Eredetünk
  heading: |-
    A vízen építve,<br />
    <span class="text-sky-600">a cél vezérel minket</span>
  paragraphs:
    - 'Az afarer egy tengerparti műhelyben indult, egyetlen deszkával és egy makacs meggyőződéssel: a vízi termékeket úgy kell megtervezni, mintha fontosak lennének — mert azok.'
    - 'Alapítóink, két tengeri mérnök, olyan iparágat láttak, ahol kompromisszumokat kötöttek, leminősítették az anyagokat, és a biztonságot puszta formalitásnak tekintették. Az első afarer hajótestet nem a haszonért építették, hanem hogy bebizonyítsák: a megfizethető vízi felszerelés is lehet valóban megbízható.'
    - Az az első hajótest még ma is szolgálatban áll. Ez az elv sosem változott.
    - Nem mi vagyunk a legnagyobb gyártó. Nem a legolcsóbb termékeket készítjük. De minden műhelyünkből kikerülő hajótest ugyanazokon a kezeken megy át, amelyek a vállalatot elindították — és ugyanannak a szabványnak felel meg, amelyet az első hajótest kitűzött.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: afarer tengerparti műhely
philosophy:
  tagline: Filozófiánk
  heading: Gyökereink az óceánban
  description: Az óceán nem a munkahelyünk. Hanem a tanítónk. Minden tervezési döntés azzal kezdődik, hogy megértjük, hogyan viselkedik a víz, hogyan változnak a körülmények, és hogyan kell reagálnia a felszerelésnek.
  cards:
    - emoji: 🌊
      title: Tiszteljük a vizet
      description: A víz kiszámíthatatlan. Termékeinket a legmostohább körülményekre terveztük, nem a legkedvezőbbekre. Ha egy hajótest elbír egy sodró áramlatot, egy tavon is helytáll. Ha egy mentőmellény a nyílt tengeren is megbízható, egy folyóra túlbiztosított — és ez szándékos.
    - emoji: 🔧
      title: Tartósra építve, nem cserélésre
      description: A legfenntarthatóbb termék az, amelyet nem kell lecserélni. A tengeri minőségű PVC-t és a drop-stitch szerkezetet élettartamuk miatt választottuk. Még ma is szállítunk alkatrészeket azokhoz a hajótestekhez, amelyeket egy évtizeddel ezelőtt építettünk.
    - emoji: 🏆
      title: Tervezetten megfizethető
      description: A vízi sport nem lehet luxus. Olyan termékeket fejlesztünk, amelyek professzionális szintű teljesítményt nyújtanak olyan áron, amely ésszerű a családok, a túravezetők és a kisebb szolgáltatók számára — nem csak a kereskedelmi flottáknak.
design:
  tagline: Tervezési filozófia
  heading: |-
    A körülmények<br />
    <span class="text-sky-600">határára tervezve</span>
  paragraphs:
    - 'Minden afarer termék egyetlen kérdéssel kezdődik: <em>milyen a legrosszabb körülmény, amellyel szembe kell néznie?</em> A határról befelé tervezünk, nem a középpontból kifelé.'
    - 'Drop-stitch magjaink 15 PSI-ra vannak minősítve — nem azért, mert egy tóhoz a 12 PSI kevés lenne, hanem mert egy 15 PSI-s deszka a hirtelen felkelt hullámokat is meghajlás nélkül viseli. Fedélzeti szöveteinket kereskedelmi minőségű UV-állóságra specifikáltuk — nem azért, mert minden ügyfelünk a trópusokon evez, hanem mert az UV miatti degradáció a korai meghibásodás #1 oka.'
    - Nem árpontra tervezünk. A meghibásodási határra tervezünk — majd jóval fölé építünk.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: afarer tervezés és mérnöki munka
  stats:
    - value: '15'
      label: Mag<br />PSI-minősítése
    - value: 1,500+
      label: Tesztelt<br />UV-óra
    - value: 10yr
      label: hajótest<br />élettartama

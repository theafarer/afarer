origin:
  tagline: Нашият произход
  heading: |-
    Създадени на водата,<br />
    <span class="text-sky-600">водени от мисия</span>
  paragraphs:
    - 'afarer стартира в крайбрежна работилница с една дъска и едно упорито убеждение: морските продукти трябва да бъдат проектирани така, сякаш имат значение — защото наистина имат.'
    - Нашите основатели, двама морски инженери, видяха индустрия, в която се правят компромиси с качеството, материалите са от по-нисък клас, а безопасността се третира като формалност. Те създадоха първия afarer корпус не заради печалба, а за да докажат, че достъпното морско оборудване може да бъде и наистина надеждно.
    - Първият корпус е в експлоатация и до днес. Този принцип никога не се е променял.
    - Ние не сме най-големият производител. Не произвеждаме най-евтините продукти. Но всеки корпус, който напуска нашата работилница, минава през същите ръце, които основаха компанията — и отговаря на същия стандарт, който зададе първият корпус.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: afarer крайбрежна работилница
philosophy:
  tagline: Нашата философия
  heading: Вкоренени в океана
  description: Океанът не е нашето работно място. Той е нашият учител. Всяко решение в дизайна започва с разбиране как се държи водата, как се променят условията и как трябва да реагира оборудването.
  cards:
    - emoji: 🌊
      title: Уважавайте водата
      description: Водата е непредвидима. Нашите продукти са проектирани за най-лошите условия, не за най-добрите. Ако един корпус може да понесе обратно течение, ще се справи и с езеро. Ако спасителна жилетка издържа в открито море, за река тя е проектирана с голям резерв — и това е нарочно.
    - emoji: 🔧
      title: Създадени да издържат, а не да бъдат заменяни
      description: Най-устойчивият продукт е този, който не се нуждае от подмяна. PVC от морски клас и дроп-стич конструкцията са избрани заради дълготрайност. Доставяме резервни части и за корпуси, които създадохме преди десетилетие.
    - emoji: 🏆
      title: Достъпни по замисъл
      description: Водните спортове не бива да са лукс. Проектираме продукти, които предлагат представяне от професионален клас на цена, която има смисъл за семейства, инструктори и малки оператори — не само за търговски флотилии.
design:
  tagline: Философия на дизайна
  heading: |-
    Проектирани за ръба<br />
    <span class="text-sky-600">на условията</span>
  paragraphs:
    - 'Всеки afarer продукт започва с един въпрос: <em>кое е най-лошото условие, което ще срещне?</em> Проектираме от ръба навътре, а не от центъра навън.'
    - 'Нашите дроп-стич сърцевини са с рейтинг 15 PSI — не защото 12 PSI не стигат за езеро, а защото дъска с 15 PSI понася внезапно вълнение, без да се огъва. Платовете за палубите ни са специфицирани с UV съпротивление от търговски клас — не защото всеки клиент гребе в тропиците, а защото UV деградацията е причина #1 за преждевременен отказ.'
    - Не проектираме към целева цена. Проектираме към границата на отказ — и после строим далеч над нея.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: afarer дизайн и инженеринг
  stats:
    - value: '15'
      label: PSI рейтинг<br />на сърцевината
    - value: 1,500+
      label: UV часове<br />тестване
    - value: 10yr
      label: живот<br />на корпуса

  - badge: RR
    title: 'Bord de rail renforcé'
    description: 'Un rail fusionné en double couche protège contre les frottements de quai, les échouages sur la plage et les impacts latéraux.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp'

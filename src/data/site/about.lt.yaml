origin:
  tagline: Mūsų ištakos
  heading: |-
    Sukurta ant vandens,<br />
    <span class="text-sky-600">vedami tikslo</span>
  paragraphs:
    - 'afarer istorija prasidėjo pajūrio dirbtuvėse, turint vieną lentą ir atkaklų įsitikinimą: jūriniai gaminiai turi būti kuriami taip, tarsi jie iš tiesų būtų svarbūs — nes jie tokie ir yra.'
    - Mūsų įkūrėjai, du jūrų inžinieriai, regėjo pramonę, kurioje buvo taupoma kuo pigiau, naudojamos prastesnės medžiagos, o saugumas laikytas paprasčiausia formalia varnele. Pirmąjį afarer korpusą jie pastatė ne dėl pelno, o norėdami įrodyti, kad prieinama jūrinė įranga gali būti ir iš tiesų patikima.
    - Tas pirmasis korpusas tebenaudojamas ir šiandien. Tas principas niekada nesikeitė.
    - Mes nesame didžiausias gamintojas. Negaminame pačių pigiausių produktų. Tačiau kiekvienas korpusas, paliekantis mūsų dirbtuves, praeina pro tas pačias rankas, kurios įkūrė įmonę, ir atitinka tą patį standartą, kurį nustatė pirmasis korpusas.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: afarer pajūrio dirbtuvės
philosophy:
  tagline: Mūsų filosofija
  heading: Įsišakniję vandenyne
  description: Vandynas mums — ne darbo vieta. Jis — mūsų mokytojas. Kiekvienas projektavimo sprendimas prasideda nuo supratimo, kaip elgiasi vanduo, kaip kinta sąlygos ir kaip į tai turi reaguoti įranga.
  cards:
    - emoji: 🌊
      title: Gerbkite vandenį
      description: Vanduo yra nenuspėjamas. Mūsų produktai projektuoti pačioms blogiausioms sąlygoms, o ne pačioms geriausioms. Jeigu korpusas atlaiko pavojingą srovę, jis atlaikys ir ežerą. Jeigu gelbėjimo liemenė patikima atviroje jūroje, upėje ji veikia su didele atsarga — ir taip yra sąmoningai.
    - emoji: 🔧
      title: Sukurta, kad tarnautų, o ne kad būtų keičiama
      description: Pats tvariausias produktas yra tas, kurio nereikia keisti. Jūrinės klasės PVC ir drop-stitch konstrukcija pasirinktos atsižvelgiant į ilgaamžiškumą. Atsargines dalis korpusams, kuriuos pagaminome prieš dešimtmetį, tebegabename ir šiandien.
    - emoji: 🏆
      title: Prieinamumas — dizaino principas
      description: Vandens sportas neturėtų būti prabanga. Kuriame produktus, užtikrinančius profesionalų našumą už kainą, priimtiną šeimoms, gidams ir smulkiesiems operatoriams — o ne tik komerciniams laivynams.
design:
  tagline: Projektavimo filosofija
  heading: |-
    Sukurta sąlygų<br />
    <span class="text-sky-600">ribai</span>
  paragraphs:
    - 'Kiekvienas afarer produktas prasideda nuo vieno klausimo: <em>kokia blogiausia sąlyga, su kuria jam teks susidurti?</em> Projektuojame nuo ribos link vidaus, o ne nuo centro į išorę.'
    - 'Mūsų drop-stitch branduoliai skirti 15 PSI — ne todėl, kad ežerui neužtektų 12 PSI, o todėl, kad 15 PSI lenta atlaiko staigų bangavimą nelenkdama. Mūsų denio audiniai specifikuoti komercinės klasės UV atsparumui — ne todėl, kad kiekvienas klientas irkluoja atogrąžose, o todėl, kad UV degradacija yra #1 ankstyvų gedimų priežastis.'
    - Mes neprojektuojame pagal kainos tašką. Projektuojame iki gedimo ribos — o tada kuriame gerokai aukščiau jos.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: afarer dizainas ir inžinerija
  stats:
    - value: '15'
      label: PSI branduolio<br />reitingas
    - value: 1,500+
      label: UV valandų<br />išbandyta
    - value: 10yr
      label: korpuso<br />eksploatacijos trukmė

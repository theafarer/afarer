origin:
  tagline: Asal Usul Kami
  heading: |-
    Dibina di atas air,<br />
    <span class="text-sky-600">didorong oleh tujuan</span>
  paragraphs:
    - 'afarer bermula di sebuah bengkel pesisir dengan sebuah papan dan keyakinan yang teguh: produk marin harus direkabentuk seolah-olah ia penting — kerana ia memang penting.'
    - Pengasas kami, dua orang jurutera marin, menyaksikan industri yang kerap memangkas kos, menurunkan gred bahan, dan memperlakukan keselamatan sekadar sebagai formaliti. Mereka membina lambung afarer yang pertama bukan demi keuntungan, tetapi untuk membuktikan bahawa peralatan marin yang mampu milik juga boleh benar-benar dipercayai.
    - Lambung pertama itu masih digunakan sehingga hari ini. Prinsip itu tidak pernah berubah.
    - Kami bukan pengeluar terbesar. Kami tidak menghasilkan produk termurah. Tetapi setiap lambung yang meninggalkan bengkel kami melalui tangan yang sama yang memulakan syarikat ini — dan memenuhi standard yang sama yang ditetapkan oleh lambung pertama tersebut.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: bengkel pesisir afarer
philosophy:
  tagline: Falsafah Kami
  heading: Berakar dalam lautan
  description: Lautan bukan tempat kerja kami. Ia adalah guru kami. Setiap keputusan reka bentuk bermula dengan memahami tingkah laku air, perubahan keadaan, dan bagaimana peralatan harus bertindak balas.
  cards:
    - emoji: 🌊
      title: Hormati Air
      description: Air tidak dapat diramalkan. Produk kami direkabentuk untuk keadaan paling buruk, bukan yang terbaik. Jika sebuah lambung mampu menempuh arus balik, ia pasti mampu menempuh tasik. Jika jaket keselamatan berfungsi di lepas pantai, ia lebih daripada mencukupi untuk sungai — dan itu memang disengajakan.
    - emoji: 🔧
      title: Dibina untuk Bertahan, Bukan untuk Diganti
      description: Produk paling mampan ialah produk yang tidak perlu diganti. PVC gred marin dan binaan drop-stitch dipilih demi ketahanan. Kami masih menghantar alat gantian untuk lambung yang kami bina sepuluh tahun lalu.
    - emoji: 🏆
      title: Mampu Milik Melalui Reka Bentuk
      description: Sukan air tidak sepatutnya menjadi kemewahan. Kami merekabentuk produk yang menawarkan prestasi gred profesional pada harga yang munasabah untuk keluarga, pemandu pelancong, dan pengendali kecil — bukan sekadar armada komersial.
design:
  tagline: Falsafah Reka Bentuk
  heading: |-
    Direka bentuk untuk pinggiran<br />
    <span class="text-sky-600">keadaan</span>
  paragraphs:
    - 'Setiap produk afarer bermula dengan satu soalan: <em>apakah keadaan paling buruk yang akan dihadapinya?</em> Kami merekabentuk dari pinggiran ke arah dalam, bukan dari pusat ke arah luar.'
    - 'Teras drop-stitch kami dinilai untuk 15 PSI — bukan kerana 12 PSI tidak mencukupi untuk tasik, tetapi kerana papan 15 PSI mampu mengharungi riak mendadak tanpa melentur. Fabrik dek kami diperincikan dengan rintangan UV gred komersial — bukan kerana setiap pelanggan mendayung di kawasan tropika, tetapi kerana degradasi UV ialah punca #1 kegagalan pramatang.'
    - Kami tidak merekabentuk berdasarkan titik harga. Kami merekabentuk berdasarkan titik kegagalan — kemudian membina jauh melebihi tahap itu.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: reka bentuk dan kejuruteraan afarer
  stats:

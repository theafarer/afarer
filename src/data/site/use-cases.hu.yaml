cases:
  - id: beginner
    title: Vízi sportok kezdőknek
    desc: Stabil SUP deszkák első alkalommal használóknak.
    scenario: >-
      Egy család hétvégére tóhoz látogat, és kipróbálná a paddle
      boardozást. Stabil, könnyen vízre bocsátható felszerelésre van
      szükségük egyértelmű biztonsági útmutatással.
    solution: >-
      A SUP Explorer 11 széles testű stabilitást nyújt kezdőknek. A Life
      Vest Classic CE-tanúsított úszóképességet biztosít. A Dual-Action Pump
      körülbelül 15–20 perc alatt felfújja mindkét deszkát.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Szabadtéri felfedezés
    desc: Hordozható SUP deszkák folyókhoz, tavakhoz és part menti utakhoz.
    scenario: >-
      Egy szabadtéri rajongó hetes folyótúrát tervez, és olyan deszkára van
      szüksége, amely kicsire csomagolható, a táborban felfújható és
      megbirkózik a változó áramlásokkal.
    solution: >-
      A SUP Explorer 11 hátizsákban elfér és a mellékelt Dual-Action Pump
      segítségével körülbelül 8–12 perc alatt felfújható. Drop-stitch
      konstrukciója a tavakat, lassú folyókat és part menti evezést bírja.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Családi kikapcsolódás
    desc: Stabil SUP deszkák egynapos kirándulásokhoz és vízi sportokhoz.
    scenario: >-
      Egy négyszemélyes család stabil SUP deszkákat szeretne hétvégi tavi
      kirándulásokhoz és közös evezéshez.
    solution: >-
      A SUP Explorer 11 stabil, széles testű deszkákat nyújt minden
      korosztálynak. A Life Vest Classic mindenkit biztonságban tart. A
      Dual-Action Pump körülbelül 15–20 perc alatt felfújja az összes
      deszkát.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

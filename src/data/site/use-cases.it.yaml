cases:
  - id: beginner
    title: Sport acquatici per principianti
    desc: SUP stabili per chi li usa per la prima volta.
    scenario: >-
      Una famiglia in visita a un lago per il fine settimana vuole provare il paddleboarding. Serve un’attrezzatura stabile, facile da varare e con istruzioni di sicurezza chiare.
    solution: >-
      La SUP Explorer 11 offre stabilità grazie all’ampio corpo, ideale per i principianti. Il Life Vest Classic garantisce galleggiabilità certificata CE. La pompa Dual-Action gonfia entrambe le tavole in circa 15–20 minuti.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Esplorazione all’aperto'
    desc: 'SUP portatili per fiumi, laghi e uscite in mare.'
    scenario: >-
      Un appassionato di outdoor pianifica una settimana di discesa fluviale e cerca una tavola compatta, gonfiabile al campo e in grado di affrontare correnti variabili.
    solution: >-
      La SUP Explorer 11 si ripone in uno zaino e si gonfia in circa 8–12 minuti con la pompa Dual-Action inclusa. La costruzione drop-stitch regge laghi, fiumi calmi e navigazione costiera.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: Ricreazione in famiglia
    desc: SUP stabili per gite di un giorno e sport acquatici.
    scenario: >-
      Una famiglia di quattro persone vuole SUP stabili per le uscite del fine settimana al lago e remare insieme.
    solution: >-
      La SUP Explorer 11 offre tavole stabili e larghe per tutte le età. Il Life Vest Classic tiene tutti al sicuro. La pompa Dual-Action gonfia tutte le tavole in circa 15–20 minuti.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

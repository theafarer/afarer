  problem: Komoly távolságokat tesz meg a SUP-jával, és az all-around deszkája széles orra ellenállást kelt és nem tartja az egyenes vonalat.
  explanation: Az eltoló orr szétválasztja a vizet ahelyett, hogy áthajolna rajta, csökkentve az orrhullám-ellenállást. A hosszabb 12' vízvonal növeli a testsebességet. 31" szélességgel egyensúlyozza a hatékonyságot a stabilitással. Touring-specifikus jellemzők közé tartozik a több uszonycsap és a teherkötő fedélzet.
  solution: Fújja fel 18 PSI-ra. Használja a középső uszonyt lapos vízhez vagy adjon hozzá oldalsó uszonyokat az oldalirányú szél stabilitásához. Az eltoló orr és a 12' hossz kiválóan teljesít nyílt vízen hullámossággal.
  recommendation: 699 dollárért a SUP Tour 12 a legjobb ár-értékű felfújható touring deszka. Vegye meg, ha rendszeresen tesz meg távolságokat. Párosítsa az afarer szénszálas evezővel a leghatékonyabb összeállításhoz.
  faq:
    - q: Elég stabil-e a SUP Tour 12 középhaladóknak?
      a: Igen — a 31" szélesség standard a touringhoz. A kezdők billegőnek találhatják a 31"-et a 33-34" all-around deszkákhoz képest.
    - q: Hogyan kezeli a Tour 12 a hullámosságot?
      a: Nagyon jól — az eltoló orr átvágja a kicsi és mérsékelt hullámosságot a síktest csapkodása nélkül.
    - q: Használhatom a Tour 12-t szörfözéshez?
      a: Nem ajánlott — a 12' hossz és az eltoló orr lassú fordulásúvá teszi. Hullámlovagláshoz használja a SUP Explorer 11-et.
    - q: Milyen evezőhossz működik a legjobban?
      a: 8-10"-cel a feje felett. A hosszabb evező áttételt nyújt a távolsági evezéshez.

cards:
  - badge: PVC
    title: Lapisan PVC Kelas Laut
    description: Kain PVC berlaminasi multi-lapis berating untuk lingkungan laut. Teruji untuk ketahanan UV, abrasi, dan tusukan.
    image: https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Inti Drop-Stitch
    description: Ribuan benang internal menghubungkan lapisan atas dan bawah, menciptakan struktur kaku bertekanan tinggi pada 12–15 PSI.
    image: https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Tepi Rail Diperkuat
    description: Rail las-fusi dua lapis melindungi dari gesekan dermaga, pendaratan pantai, dan benturan samping.
    image: https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp

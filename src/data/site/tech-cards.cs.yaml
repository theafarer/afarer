cards:
  - badge: PVC
    title: 'PVC vrstva námořní kvality'
    description: 'Vícevrstvá laminovaná PVC tkanina určená pro vodní prostředí. Testována na odolnost vůči UV záření, oděru a proražení.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp'
  - badge: DS
    title: 'Drop-stitch jádro'
    description: 'Tisíce vnitřních vláken spojují horní a spodní vrstvu a vytvářejí tuhou strukturu s vysokým tlakem 12–15 PSI.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp'
  - badge: RR
    title: 'Zesílená hrana railu'
    description: 'Dvojvrstvý, svarovaný rail chrání před odřením o molo, najetím na pláž a bočními nárazy.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp'

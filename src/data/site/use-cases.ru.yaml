cases:
  - id: beginner
    title: 'Водные виды спорта для новичков'
    desc: 'Устойчивые SUP-доски для первого использования.'
    scenario: >-
      Семья проводит выходные на озере и хочет попробовать сапсёрфинг. Им нужно устойчивое, легко спускаемое на воду снаряжение с понятными инструкциями по безопасности.
    solution: >-
      SUP Explorer 11 обеспечивает устойчивость благодаря широкому корпусу – идеальна для новичков. Life Vest Classic гарантирует плавучесть с сертификацией CE. Насос Dual-Action надувает обе доски примерно за 15–20 минут.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Исследование природы'
    desc: 'Портативные SUP-доски для рек, озёр и прибрежных походов.'
    scenario: >-
      Любитель активного отдыха планирует недельный сплав по реке и нуждается в доске, которая компактно складывается, надувается в лагере и выдерживает переменные течения.
    solution: >-
      SUP Explorer 11 помещается в рюкзак и надувается примерно за 8–12 минут прилагаемым насосом Dual-Action. Конструкция drop-stitch выдерживает озёра, спокойные реки и прибрежные воды.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: 'Семейный отдых'
    desc: 'Устойчивые SUP-доски для однодневных поездок и водных развлечений.'
    scenario: >-
      Семья из четырёх человек хочет устойчивые SUP-доски для выездов на озеро по выходным и совместной гребли.
    solution: >-
      SUP Explorer 11 предлагает устойчивые доски с широкой палубой для всех возрастов. Life Vest Classic держит всех в безопасности. Насос Dual-Action надувает все доски примерно за 15–20 минут.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

badges:
  - icon: "\u2B50"
    title: ISO и CE сертификати
    desc: Сваки производ испуњава међународне стандарде безбедности и квалитета.
    variant: cert
  - icon: "\u2B50"
    title: Изврсност материјала
    desc: Премијум PVC тканине војног квалитета, тестиране на UV зрачење, хабање и екстремне температуре.
    variant: material
  - icon: "\u2B50"
    title: Строго тестирање
    desc: Свако пловило пре испоруке пролази тестове притиска, пловности и носивости.
    variant: standard
  - icon: "\u2B50"
    title: Гаранција од 2 године
    desc: Сви Afarer производи покривени свеобухватном гаранцијом произвођача.
    variant: warranty
  - icon: "\u2714"
    title: BSCI сертификованост
    desc: Ревизија друштвене усаглашености потврђена — етичка производња за европске купце.
    variant: cert
  - icon: "\u2714"
    title: REACH усаглашеност
    desc: Сви материјали испуњавају прописе ЕУ о хемијској безбедности.
    variant: cert

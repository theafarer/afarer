cards:
  - badge: PVC
    title: Слој PVC за морске услове
    description: Вишеслојна ламинирана PVC тканина намењена за морска окружења. Тестирана на отпорност према UV зрачењу, хабању и пробијању.
    image: https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-stitch језгро
    description: Хиљаде унутрашњих нити повезује горњи и доњи слој, стварајући круту конструкцију под високим притиском од 12–15 PSI.
    image: https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Ојачана бочна ивица
    description: Двоструки фузиони заварени бок штити од гребања о пристаниште, искрцавања на плажу и бочних удараца.
    image: https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp

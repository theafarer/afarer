badges:
  - icon: "\u2B50"
    title: ISO и CE сертифицирано
    desc: Всеки продукт отговаря на международните стандарти за безопасност и качество.
    variant: cert
  - icon: "\u2B50"
    title: Превъзходство на материалите
    desc: Премиум PVC и Hypalon тъкани, тествани за UV, абразия и екстремни температури.
    variant: material
  - icon: "\u2B50"
    title: Строго тестване
    desc: Всеки плавателен съд преминава тестове за налягане, плавателност и товар преди изпращане.
    variant: standard
  - icon: "\u2B50"
    title: 2-годишна гаранция
    desc: Всички afarer продукти са подкрепени от изчерпателна производствена гаранция.
    variant: warranty
  - icon: "\u2714"
    title: BSCI сертифицирано
    desc: Одит за социално съответствие — етично производство за европейски купувачи.
    variant: cert
  - icon: "\u2714"
    title: REACH съответствие
    desc: Всички материали съответстват на регулациите на ЕС за химична безопасност.
    variant: cert

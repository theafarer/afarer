cases:
  - id: beginner
    title: Sukan Air untuk Pemula
    desc: Papan SUP stabil untuk pengguna kali pertama.
    scenario: >-
      Satu keluarga melawat tasik pada hujung minggu mahu mencuba paddle
      boarding. Mereka memerlukan kelengkapan yang stabil dan mudah
      dilancarkan dengan panduan keselamatan yang jelas.
    solution: >-
      SUP Explorer 11 menyediakan kestabilan badan lebar untuk pemula. Life
      Vest Classic memastikan keapungan tersijil CE. Dual-Action Pump
      mengepam kedua-dua papan dalam kira-kira 15–20 minit.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Penerokaan Luar
    desc: Papan SUP mudah alih untuk perjalanan sungai, tasik dan pantai.
    scenario: >-
      Seorang peminat aktiviti luar merancang perjalanan seminggu di sungai
      dan memerlukan papan yang kecil apabila dikemas, boleh dipam di tapak
      perkhemahan dan mampu mengharusi pelbagai arus.
    solution: >-
      SUP Explorer 11 muat dalam satu beg galas dan dipam dalam kira-kira
      8–12 minit menggunakan Dual-Action Pump yang disertakan. Binaan
      drop-stitchnya mampu mengharusi tasik, sungai perlahan dan
      pendayungan pesisir.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Rekreasi Keluarga
    desc: Papan SUP stabil untuk perjalanan sehari dan sukan air.
    scenario: >-
      Satu keluarga berempat mahu papan SUP yang stabil untuk lawatan tasik
      hujung minggu dan pendayungan serentak.
    solution: >-
      SUP Explorer 11 menyediakan papan stabil berbadan lebar untuk semua
      peringkat umur. Life Vest Classic mengekalkan semua orang selamat.
      Dual-Action Pump mengepam semua papan dalam kira-kira 15–20 minit.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

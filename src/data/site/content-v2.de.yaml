- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP-Größenberatung: Länge, Breite und Volumen erklärt'
  description: Finde die richtige SUP-Größe basierend auf deinem Gewicht, deinem Können und deinem Paddelstil. Die Länge bestimmt die Spurtreue, die Breite die Stabilität und das Volumen die Tragfähigkeit.
  definition: Die SUP-Größe wird bestimmt durch Länge (Tempo und Gleiteigenschaften), Breite (primäre Stabilität), Dicke (sekundäre Stabilität und Volumen) sowie Volumen in Litern (gesamte Tragfähigkeit).
  tldr: 'Allround-SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280 L). Touring: 12''-14'' x 30"-32" (280-350 L). Surf: 8''-10'' x 30"-32" (140-220 L). Anfänger brauchen eine Breite über 32" und ein Volumen, das das Körpergewicht um 60-80 L übersteigt. Dein Gewicht in kg plus 60 L ist das Mindestvolumen für Stabilität.'
  problem: Jede SUP-Marke listet Boards in Fuß, Zoll und Litern – doch ohne zu wissen, wie sich diese Maße in der Praxis anfühlen, riskierst du den Kauf eines Boards, das kippelig oder langsam ist oder dein Gewicht nicht tragen kann.
  explanation: 'Die Länge bestimmt, wie schnell das Board paddelt und wie gut es auf gerader Linie Spur hält. Längere Boards (12''+) gleiten zwischen den Zügen und halten die Linie. Kürzere Boards (unter 10'') drehen leicht, erfordern aber häufigere Paddelwechsel. Die Breite bestimmt die primäre Stabilität – die Stabilität im Stand. Ein 30" Board fühlt sich für Anfänger kippelig an; 34" fühlt sich wie ein Steg an. Die Dicke bestimmt das Volumen – ein dickeres Board liegt höher im Wasser, fängt aber mehr Wind. Das Volumen in Litern ist die beste Einzelkennzahl: Das beladene Board (du plus Ausrüstung) sollte in Ruhe 2-4 Zoll eintauchen.'
  solution: 'Stimme deine Boardmaße auf drei Faktoren ab: dein Gewicht (bestimmt das Mindestvolumen), deine Hauptaktivität (bestimmt die Länge) und dein Können (bestimmt die Breite). Für Anfänger: Gewicht in kg mal 2,2 ergibt die Mindestliter. Für Fortgeschrittene: multipliziere mit 1,8. Für Könner: multipliziere mit 1,4.'
  recommendation: Das afarer SUP Explorer 11 mit 11' x 33" x 6" und 260 L passt für die meisten Paddler bis 100 kg beim Allround-Paddeln. Steige für mehr Touring-Tempo und Gleiten auf das SUP Tour 12 mit 12' x 31" um.
  faq:
    - q: Welche SUP-Größe brauche ich für mein Gewicht?
      a: 'Für Paddler unter 70 kg: 10-11'' x 32" (220-260 L). Für 70-90 kg: 11-12'' x 33" (260-300 L). Für 90-110 kg: 11-12'' x 34" (300-350 L). Für über 110 kg: 12'' x 34-36" (350 L+).'
    - q: Ist ein längeres SUP schneller?
      a: Ja. Längere Boards haben ein besseres Länge-Breite-Verhältnis, was den Wasserwiderstand reduziert. Ein 14' Touring-SUP ist beim gleichen Paddelaufwand deutlich schneller als ein 11' Allroundboard.
    - q: Welche SUP-Breite ist für Anfänger stabil?
      a: 33-34 Zoll ist der Sweet Spot für Anfänger bis 90 kg. Unter 32" erfordert es gutes Gleichgewicht. Über 34" ist sehr stabil, aber langsamer und bei Wind schwerer zu paddeln.
    - q: Kann ich ein Allround-Board fürs Touring verwenden?
      a: Ja, für kurze Touren unter 10 km. Für längere Distanzen spurt ein dediziertes Touring-Board besser und bewältigt Strecken effizienter.

- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Neoprenanzug reparieren: Risse, Nähte und Reißverschlüsse selbst beheben'
  description: DIY-Reparaturratgeber für Neoprenrisse, Nahttrennungen, klemmende Reißverschlüsse und gerissene Kniepolster. Schritt-für-Schritt-Anleitung mit Neoprenkleber.
  definition: Die Reparatur eines Neoprenanzugs umfasst das Reinigen und Anrauen der beschädigten Stelle, das Auftragen von Neoprenkleber und das Aushärten unter Druck, um Wasserdichtigkeit und Flexibilität wiederherzustellen.
  tldr: 'Kleine Risse unter 1": Neoprenkleber auf beide Seiten auftragen, 10–15 Minuten warten bis klebrig, fest andrücken, 12 Stunden unter Gewicht aushärten lassen. Größere Risse brauchen einen Neoprenflicken. Reißverschlussprobleme: zuerst schmieren, dann auf eingeklemmten Stoff prüfen.'
  problem: Ihr Anzug hat einen kleinen Riss, eine sich lösende Naht oder einen klemmenden Reißverschluss. Ohne DIY-Reparatur zahlen Sie 150 $+ für einen Ersatz, obwohl die Reparatur nur 5 $ kostet.
  explanation: Neoprenkleber wirkt, indem er die Neoprenoberfläche anlöst und beim Verdunsten des Lösungsmittels eine chemische Verbindung schafft. Der Kleber muss auf beide Flächen aufgetragen werden und klebrig werden, bevor sie verbunden werden. Bei Rissen müssen die Kanten exakt ausgerichtet sein. Reißverschlussprobleme beruhen oft auf Salzkorrosion oder eingeklemmtem Stoff.
  solution: 'Bei Rissen: mit Alkohol reinigen, leicht anschleifen, dünne Kleberschicht auf beide Kanten auftragen, warten bis klebrig, exakt zusammenpressen, beschweren, 12–24 Stunden aushärten. Bei Flicken: Flicken 1" größer als den Riss zuschneiden, Kleber auf beide Seiten auftragen, festklemmen. Beim Reißverschluss: abspülen, Wachs auftragen, vorsichtig bewegen.'
  recommendation: Bewahren Sie ein afarer-Reparaturset für Neoprenanzüge in Ihrer Ausrüstungstasche auf. Bei großen Reparaturen oder Nahtversagen an kritischen Stellen ist eine professionelle Reparatur zu empfehlen.
  faq:
    - q: Kann ich Sekundenkleber für einen Neoprenanzug verwenden?
      a: Nein – Sekundenkleber härtet hart und spröde aus. Verwenden Sie für Neoprenreparaturen nur Neoprenkleber oder Aquaseal.
    - q: Wie lange hält eine Neoprenkleber-Reparatur?
      a: Eine sachgerecht ausgeführte Reparatur ist oft stärker als das ursprüngliche Neopren und hält die restliche Lebensdauer des Anzugs.
    - q: Kann ich einen vollständig getrennten Reißverschluss reparieren?
      a: Hat sich das Band vom Neopren gelöst, mit Kontaktkleber neu verkleben. Sind die Zähne beschädigt, den Reißverschluss professionell ersetzen.
    - q: Wie repariere ich einen an der Naht undichten Anzug?
      a: Einen dünnen Strang Aquaseal entlang der Innenseite der undichten Naht auftragen und 24 Stunden aushärten lassen.

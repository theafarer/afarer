- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Was man beim Surfen tragen sollte (erscheinen Sie nicht in Boardshorts, wenn Sie ein 5/4 brauchen)
  description: Schluss mit Rätselraten bei der Kleidung. Die Wassertemperatur, nicht die Lufttemperatur, bestimmt Ihre Surfbekleidung. Vollständiger Guide vom tropischen Rash Guard bis zum kompletten Winter-Setup mit 5/4/3mm.
  definition: Die Surfbekleidung reicht von Boardshorts und Rash Guards in warmem Wasser bis zu kompletten 5/4/3mm-Neoprenanzügen mit Boots und Kapuzen in kaltem Wasser. Die Wassertemperatur, nicht die Lufttemperatur, bestimmt, was Sie brauchen.
  tldr: Was Sie beim Surfen tragen, hängt ausschließlich von der Wassertemperatur ab —nicht von der Lufttemperatur. Rash Guards und Boardshorts funktionieren über 22 °C, Spring Suits decken 18-22 °C ab, komplette 3/2mm-Anzüge handhaben 14-18 °C, und unter 14 °C ist ein 5/4/3mm mit Boots erforderlich. Tragen Sie immer UV-Schutz und erwägen Sie ein Leash und eine Prallweste.
  problem: Sie kommen am Strand an und haben keine Ahnung, ob ein Rash Guard ausreicht oder ob Sie einen kompletten Neoprenanzug brauchen. Die Lufttemperatur ist warm, aber das Wasser ist kalt, oder das Wasser fühlt sich okay an, aber der Wind ist eiskalt. Falsche Kleidung bedeutet eine ruinierte Session.
  explanation: 'Surfbekleidung erfüllt drei Zwecke: thermische Isolierung, UV-Schutz und Schutz vor Abrieb. Neoprenanzüge werden nach Dicke und Bedeckung eingestuft —Spring Suits (kurze Arme oder Beine) sind für Grenztage, Full Suits für kaltes Wasser. Rash Guards schützen vor Boardabrieb und Sonne, bieten aber keinen thermischen Nutzen. Boots, Handschuhe und Kapuzen sind keine Accessoires, sondern unverzichtbare Ausrüstung für das Kaltwassersurfen unter 12 °C.'
  solution: 'Prüfen Sie vor dem Losfahren die lokale Boje oder den aktuellen Wassertemperaturbericht. Stellen Sie ein Set für Ihre typisch kälteste Bedingung zusammen: Rash Guard und Shorts für den Sommer, ein 3/2mm-Fullsuit für Frühling und Herbst, ein 5/4/3mm mit Boots und Kapuze für den Winter. Ergänzen Sie immer ein Leash und erwägen Sie zur Sicherheit eine Schwimmweste.'
  recommendation: Investieren Sie zuerst in einen guten 3/2mm-Fullsuit —er deckt das breiteste Spektrum an Bedingungen ab. Ergänzen Sie einen 5/4/3mm-Anzug und Boots, wenn Sie vorhaben, den Winter durchzusurfen. Der afarer Wetsuit Pro mit thermischem Futter überbrückt beide Temperaturbereiche effektiv.
  faq:
    - q: Kann ich nur in Boardshorts surfen?
      a: Ja, in tropischem Wasser über 24 °C. Eventuell möchten Sie einen Rash Guard, um Scheuerstellen an Brust und Armen durch das Paddeln zu vermeiden. Wachs oder ein Traction Pad auf dem Board hilft, den fehlenden Halt eines Anzugs auszugleichen.
    - q: Brauche ich Surf-Boots?
      a: Wenn die Wassertemperatur unter 14 °C fällt, verhindern Boots Taubheitsgefühle und schützen Ihre Füße vor Felsen und Riffschnitten. Sie sorgen außerdem für mehr Halt auf dem Board. Die meisten Surfer in nördlichen Klimazonen nutzen Boots von November bis März.
    - q: Was ist ein Spring Suit?
      a: Ein Spring Suit ist ein Neoprenanzug mit kurzen Armen oder kurzen Beinen (oder beidem), konzipiert für Wasser zwischen 18 °C und 22 °C. Er bietet mehr Wärme als ein Rash Guard, aber weniger Bedeckung als ein Fullsuit.
    - q: Sollte ich beim Surfen eine Rettungsweste tragen?
      a: Keine traditionelle Rettungsweste, aber eine Prallweste oder Schwimmhilfe kann bei rauen Bedingungen helfen oder wenn Sie kein sicherer Schwimmer sind. afarer Rettungswesten sind für Stand-Up-Paddling und Paddelsportarten konzipiert, können Surfanfängern aber zusätzliches Sicherheitsgefühl durch Auftrieb bieten.

- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Surf-Etikette-Regeln (Wie Sie nicht zur Person werden, die alle meiden)
  description: Im Line-up gibt es Regeln, und niemand schreibt sie auf. Lernen Sie die Vorfahrt, warum Snaking Ihnen Beschimpfungen einbringt, wie Sie sich entschuldigen und welche Anfängerfehler jeden einheimischen Surfer nerven.
  definition: 'Surf-Etikette ist ein ungeschriebener Verhaltenskodex, der Kollisionen verhindert und Wellen fair verteilt. Die Kernregel: Der Surfer, der dem Peak der brechenden Welle am nächsten ist, hat Vorfahrt.'
  tldr: Der Surfer, der dem Peak der brechenden Welle am nächsten ist, hat Vorfahrt. Fahren Sie niemandem in die Welle, snaken Sie nicht (um jemanden herumpaddeln, um dessen Welle zu nehmen), und entschuldigen Sie sich immer, wenn Sie einen Fehler machen. Paddeln Sie breit um das Line-up herum, halten Sie Ihr Board fest und seien Sie freundlich – Respekt verdient Respekt.
  problem: Sie paddeln zu einem vollen Line-up hinaus und spüren sofort Anspannung. Surfer schauen Sie schief an, jemand schreit Sie an, und Sie sind sich nicht sicher, was Sie falsch gemacht haben. Die soziale Seite des Surfens wirkt einschüchternder als die Wellen selbst.
  explanation: 'Surf-Etikette existiert, um Kollisionen zu verhindern und Wellen fair zu verteilen. Die Grundregel ist die Vorfahrt: Der Surfer, der dem Peak am nächsten ist (wo die Welle zuerst bricht), hat Vorrang. Wer von weiter innen für dieselbe Welle paddelt, muss aussteigen. Snaking – um einen anderen Surfer herumpaddeln, um ihm den Vorrang zu stehlen – gilt als das schlimmste Vergehen. Über den Vorrang hinaus gibt es im Line-up Erwartungen an den Lärm (Schreien auf ein Minimum beschränken), die Boardkontrolle (lassen Sie Ihr Board nie in die Nähe anderer kommen) und die Freundlichkeit (ein einfaches Nicken wirkt Wunder).'
  solution: Beobachten Sie das Line-up 10 Minuten lang, bevor Sie hinauspaddeln. Stellen Sie fest, wer die meisten Wellen fängt – das sind die Surfer, die Sie respektieren sollten und denen Sie aus dem Weg gehen. Bleiben Sie innen (in der White-Water-Zone), wenn Sie noch lernen. Paddeln Sie breit um das Line-up herum, nicht hindurch. Wenn Sie eine Welle erwischen, schauen Sie vor dem Aufstehen nach beiden Seiten und stellen Sie sicher, dass niemand tiefer am Peak ist.
  recommendation: Verbringen Sie Ihre ersten Sessions an einem anfängerfreundlichen Spot mit weit verteilten Surfern. Lernen Sie, den Vorrang zu lesen, bevor Sie sich an ein volles Line-up wagen. Wenn Sie doch jemandem in die Welle fahren, entschuldigen Sie sich sofort und paddeln Sie hinüber – die meisten Surfer respektieren einen ehrlichen Fehler.
  faq:
    - q: Was ist ein Drop-in?
      a: Ein Drop-in bedeutet, für eine Welle zu paddeln und sie zu reiten, auf die ein anderer Surfer bereits Vorrang hat. Es ist gefährlich und respektlos. Der Surfer, der dem Peak am nächsten ist, besitzt die Welle; alle anderen müssen aussteigen.
    - q: Was ist Snaking?
      a: Snaking bedeutet, um einen anderen Surfer herumzupaddeln, der bereits für eine Welle in Position ist, sodass Sie am Ende näher am Peak sind. Es gilt als äußerst schlechtes Benehmen und kann zu Konfrontationen führen.
    - q: Können Anfänger an vollen Spots surfen?
      a: Ja, aber bleiben Sie in der White-Water-Zone fern vom Peak. Paddeln Sie erst in den Haupt-Takeoff-Bereich, wenn Sie zuverlässig Wellen fangen und Ihre Richtung kontrollieren können. Volle Line-ups erfordern Erfahrung, um sich sicher zu bewegen.
    - q: Wie entschuldige ich mich im Wasser?
      a: Ein einfaches Winken, ein Lächeln und ein „Mein Fehler“ oder „Sorry“ genügen. Anerkennen Sie den Fehler und paddeln Sie von der Person weg. Surfer verzeihen ehrliche Fehler in der Regel, besonders wenn Sie erkennbar noch am Lernen sind.
    - q: Was soll ich tun, wenn jemand mir in die Welle fährt?
      a: Wenn es ein klares Drop-in ist, rufen Sie „Welle“ oder „Hey“, um die Person aufmerksam zu machen. Wenn sie die Welle versehentlich erwischt und sich entschuldigt, lassen Sie es gut sein. Wenn jemand wiederholt in Ihre Welle fährt, paddeln Sie hinüber und erklären Sie höflich den Vorrang. Vermeiden Sie Konfrontationen.

- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP-Anker-Guide: Beim Angeln oder Fotografieren an Ort und Stelle bleiben'
  description: Kompletter Guide zum Ankern mit dem SUP — Ankertypen (Pilzanker, Klappanker, Stakeout-Stange), Ankertrolley-Aufbau, Ausbringtechniken und Sicherheitshinweise, um in Position zu bleiben.
  definition: Ein SUP-Anker ist ein Gewicht an einem Seil, das das Board gegen Wind und Strömung in Position hält. Häufige Typen sind Pilzanker, Klappanker und Stakeout-Stangen.
  tldr: Nutze einen Pilzanker (1,5-3 lb) für schlammige oder sandige Böden, einen Klappanker für felsige Böden oder eine Stakeout-Stange für flaches Wasser mit weichem Grund. Der Anker sollte bei ruhigen Bedingungen 1,5-3 lb wiegen, bei Wind und Strömung 3-5 lb. Nutze immer einen Ankertrolley zum Anpassen der Position und wisse, wann du lösen musst.
  problem: Du findest den perfekten Angelplatz, aber Wind und Strömung treiben dich alle paar Minuten ab. Ohne Anker sind SUP-Angeln und -Fotografie frustrierende Übungen im ständigen Neupositionieren.
  explanation: Ein Anker wirkt, indem er über den Grund schleift, bis er greift. Pilzanker graben sich in weiche Böden und halten gut in Sand und Schlamm. Klappanker haben Flunken, die sich in harte oder felsige Böden graben. Stakeout-Stangen funktionieren in flachem Wasser, indem sie direkt in den Grund gesteckt werden.
  solution: Installiere ein Ankertrolley-System (eine Leine mit gleitendem Ring auf einer Seite des Boards), um den Ankerpunkt zu verstellen. Befestige 50-75 ft Seil am Anker. Bringe den Anker wind- bzw. stromaufwärts deiner Wunschposition aus. Nutze ein Schnelllösesystem, um dich in Notfällen zu lösen. Verankere nie in starker Strömung oder dort, wo du den Anker nicht leicht einholen kannst.
  recommendation: Ein 3-lb-Klappanker mit 50 ft Seil deckt die meisten SUP-Angelbedingungen ab. Ergänze ein Ankertrolley-System mit den D-Ringen deines afarer SUP Explorer 11.
  faq:
    - q: Welche Ankergröße brauche ich für mein SUP?
      a: 1,5-3 lb für ruhige Seen und langsame Flüsse. 3-5 lb für Küstengewässer mit Wind oder Strömung. Übergroße Anker sind schwer einzuholen.
    - q: Wie viel Ankertau brauche ich?
      a: Ein Scope von 5:1 (5 ft Leine pro 1 ft Wassertiefe) ist Standard. In 10 ft Wasser nutze 50 ft Leine.
    - q: Ist Ankern auf einem SUP gefährlich?
      a: Nur wenn du in einer Strömung oder einem Wind ankertest, der stark genug ist, das Board umzuwerfen. Nutze immer ein Schnelllösesystem, das sofort gelöst werden kann.
    - q: Kann ich in jedem Gewässer ankern?
      a: Prüfe die lokalen Bestimmungen. Manche Gebiete beschränken das Ankern zum Schutz von Seegras oder marinen Lebensräumen. Verankere niemals auf Korallenriffen.

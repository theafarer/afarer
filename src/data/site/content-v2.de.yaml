- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm Neoprenanzug: Was die meisten Anfänger im kalten Wasser falsch machen'
  description: Schluss mit dem Frieren mitten in der Session oder dem Überhitzen am Strand. Der echte Unterschied zwischen 3mm- und 5mm-Neoprenanzügen —Temperaturtabelle, Flexibilitäts-Kompromisse und was beim Kaltwassersurfen wirklich funktioniert.
  definition: Ein Neoprenanzug ist ein Neopren-Kleidungsstück, das eine dünne Wasserschicht an der Haut einschließt, die durch Körperwärme zur Isolierung erwärmt wird. Die Dicke (3mm, 5mm) bestimmt den Temperaturbereich, den ein Anzug bewältigen kann —dicker bedeutet wärmer, aber weniger flexibel.
  tldr: Die Dicke des Neoprenanzugs bestimmt unmittelbar Wärme und Flexibilität. Verwenden Sie 3mm für Wasser über 16 °C und 5mm für Wasser zwischen 8 °C und 16 °C. Dickere Anzüge schränken die Bewegung ein, halten aber länger warm —priorisieren Sie immer die Passform vor der Marke.
  problem: Sie öffnen einen Online-Shop oder betreten ein Surfgeschäft und sehen Neoprenanzüge mit den Bezeichnungen 3/2, 4/3, 5/4 und 5mm Fullsuit. Die Zahlen sagen wenig aus, bis Ihnen klar wird, dass die falsche Dicke entweder Frieren mitten in der Session oder Überhitzen und Schwitzen am Strand bedeutet.
  explanation: Neoprenanzüge funktionieren, indem sie eine dünne Wasserschicht zwischen Haut und Neopren einschließen; Ihr Körper erwärmt dieses Wasser und erzeugt so Isolierung. Dickeres Neopren schließt mehr Wasser ein, schränkt aber Flexibilität und Auftrieb ein. Ein 3mm-Anzug (oft 3/2 mit dünneren Armen) eignet sich für milde Bedingungen, während 5mm (5/4/3 oder voll 5mm) für kaltes Wasser gedacht ist. Chest-Zip-Einstiege dichten besser ab als Back-Zip und reduzieren das Eindringen von Wasser. Die Nahtkonstruktion —verklebt und blind vernäht (GBS) —macht den Unterschied zwischen einem undichten und einem warmen Anzug aus.
  solution: Stimmen Sie die Dicke mit einer Toleranz von 5 °C auf Ihre lokale Wassertemperatur ab. Für gemäßigte Klimazonen kaufen Sie einen 3/2mm-Anzug. Für kaltes Wasser kaufen Sie einen 5/4/3mm-Anzug. Ergänzen Sie Boots, Handschuhe und eine Kapuze, um Ihren Einsatzbereich um weitere 5 °C nach unten zu erweitern. Probieren Sie Anzüge vor dem Kauf an oder wählen Sie eine Marke mit großzügiger Rückgaberegelung.
  recommendation: Der afarer Wetsuit Pro in 5/4/3mm ist ideal für die meisten Kaltwassersurfer und bietet GBS-Nähte und thermisches Futter. Wenn Sie in warmem Wasser über 20 °C surfen, ist ein 3/2mm-Anzug mit Chest Zip die bessere Wahl.
  faq:
    - q: Bei welcher Wassertemperatur ist ein 5mm-Neoprenanzug nötig?
      a: Wassertemperaturen zwischen 8 °C und 14 °C erfordern einen 5mm-Anzug. Unter 8 °C brauchen Sie einen 6/5/4mm-Anzug mit Kapuze. Zwischen 14 °C und 18 °C funktioniert ein 4/3mm-Anzug für die meisten Menschen gut.
    - q: Kann ich im Winter einen 3mm-Neoprenanzug tragen?
      a: Nur in milden Winterregionen, in denen das Wasser über 16 °C bleibt. Für echtes Wintersurfen sind 5mm oder 5/4/3mm notwendig. Boots, Handschuhe und eine Kapuze sorgen für vergleichbare Wärme, ohne dass ein dickerer Rumpfbereich nötig wäre.
    - q: Wie eng sollte ein Neoprenanzug sitzen?
      a: Eng anliegend, aber nicht einengend. Es sollten keine Luftkammern oder lockeres Neopren vorhanden sein. Wenn Sie im unteren Rückenbereich einen Finger zwischen Haut und Anzug schieben können, ist er zu locker. Falls das Atmen schwerfällt oder die Bewegung stark eingeschränkt ist, wählen Sie eine Größe größer.
    - q: Halten teure Neoprenanzüge wärmer?
      a: Ein höherer Preis bedeutet oft besseres Neopren (auf Kalksteinbasis statt auf Erdölbasis), bessere Nahtkonstruktion (GBS statt nur verklebt) und bessere Flexibilität. Diese Faktoren beeinflussen Wärme und Langlebigkeit unmittelbar, aber nur, wenn die Passform stimmt.

  title: afarer Wetsuit Pro (Premium-Wärme ohne den Premium-Preis)
  description: Neoprenanzug für kaltes Wasser mit thermogefüttertem Kalkstein-Neopren, GBS-Nähten und Chest-Zip-Einstieg. Erhältlich in 3/2mm und 5/4/3mm — Premium-Features zu einem Mittelklasse-Preis.
  definition: Der afarer Wetsuit Pro ist ein thermogefütterter Neoprenanzug aus Kalkstein-Neopren mit GBS-Nähten und Chest-Zip-Einstieg. Erhältlich in 3/2mm (14-20°C) und 5/4/3mm (8-16°C).
  tldr: Der afarer Wetsuit Pro verwendet thermogefüttertes Kalkstein-Neopren mit GBS-Nähten für Wärme und Flexibilität. Erhältlich in den Konfigurationen 3/2mm und 5/4/3mm, deckt er Wassertemperaturen von 8°C bis 20°C ab. Das Chest-Zip-Design minimiert das Spülen, und die geklebten, blind vernähten Nähte verhindern das Eindringen von Wasser, ohne auf Dehnung zu verzichten.
  problem: Neoprenanzüge für kaltes Wasser sind entweder zu einschränkend, zu teuer oder lassen kaltes Wasser den Rücken hinunterlaufen. Du willst einen Anzug, der dich über eine 90-minütige Wintersession hinweg warm hält, ohne sich beim Paddeln wie eine Zwangsjacke anzufühlen.
  explanation: Die meisten Neoprenanzüge der Mittelklasse verwenden erdölbasiertes Neopren, das steif ist und in kaltem Wasser an Flexibilität verliert. Der afarer Wetsuit Pro verwendet Neopren auf Kalksteinbasis, das von Natur aus flexibler ist und bessere Isoliereigenschaften besitzt. Das Thermofutter (Mikrofleece am Innentorso) sorgt für Wärme ohne zusätzliche Dicke. GBS-Nähte (geklebt und blind vernäht) sind der Goldstandard — das Neopren wird verklebt und dann vernäht, ohne bis ins Innere zu durchdringen, was das Eindringen von Wasser verhindert. Der Chest-Zip-Einstieg verwendet einen wasserdichten YKK-Reißverschluss mit Gummidichtung. Knieschoner und eine robuste Außenhaut verhindern Abnutzung durch das Paddeln und das Sitzen auf dem Board.
  solution: Wähle deine Dicke anhand der Wassertemperatur mithilfe des Leitfadens zur Neoprendicke. Der 3/2mm deckt 14-20°C ab und bietet maximale Flexibilität. Der 5/4/3mm deckt 8-16°C ab und bietet Thermofutter für zusätzliche Wärme. Beide verfügen über versiegelte Bündchen, einen tropfenfreien Kragen und eine Schlüsseltasche.
  recommendation: Der 5/4/3mm afarer Wetsuit Pro für 329 $ ist das beste Preis-Leistungs-Verhältnis für kaltes Wasser am Markt — vergleiche mit über 450 $ bei Premium-Marken. Der 3/2mm für 279 $ deckt milde Bedingungen ab. Ergänze afarer Schuhe und Handschuhe für vollständigen Kälteschutz.
  faq:
    - q: Wie warm hält der afarer Wetsuit Pro?
      a: Der 5/4/3mm mit Thermofutter hält dich in 8-14°C kaltem Wasser bei Sessions von bis zu 90 Minuten angenehm warm. Der 3/2mm ist bei 14-20°C komfortabel. Ein zusätzlicher thermischer Rashguard erweitert den unteren Temperaturbereich um etwa 3°C.
    - q: Lässt der Neoprenanzug Wasser hinein?
      a: Das Chest-Zip-Design und die GBS-Nähte reduzieren das Spülen erheblich. Der Halsabschluss verwendet einen glatten Neoprenkragen mit doppelt geklebtem Verschluss. Etwas Wassereintritt bei Wipeouts ist unvermeidlich, aber der Anzug trocknet schnell.
    - q: Wie haltbar ist der Anzug?
      a: Das äußere Neopren verfügt über eine Nylonverstärkung an stark beanspruchten Stellen (Knie, Gesäß, Schultern). Bei richtiger Ausspülung und hängendem Trocknen kannst du mit 2-3 Saisons regelmäßiger Nutzung rechnen, bevor Abnutzung sichtbar wird.
    - q: Welche Größen sind erhältlich?
      a: Der afarer Wetsuit Pro ist in den Größen XS bis XXL erhältlich, einschließlich kurzer und langer Varianten. Nutze die Größentabelle anhand von Brustumfang, Taillenumfang und Körpergröße. Bist du zwischen zwei Größen, wähle die größere, um Layering zu ermöglichen.

- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Aufblasbares SUP warten: Schützen Sie Ihre Investition'
  description: Jährliche Checkliste für die Pflege Ihres aufblasbaren SUP Boards. Reinigung, UV-Schutz, Nahtkontrolle, Luftdruckmanagement und Überwinterung für PVC-Drop-Stitch-Paddleboards.
  definition: Die Pflege eines aufblasbaren SUP Boards umfasst Reinigung, UV-Schutz, Luftdruckmanagement, Naht- und Ventilprüfung, Schimmelvorbeugung und richtige Überwinterung.
  tldr: Nach jeder Salzwassernutzung abspülen. Alle 2–3 Monate UV-Schutzmittel auftragen. Vor jeder Tour den Luftdruck prüfen. Monatlich Nähte, Ventile und Deckpad kontrollieren. Mit milder Seife reinigen. In der Saisonpause entlüftet an einem kühlen, trockenen Ort lagern.
  problem: Sie haben Ihr aufblasbares SUP eine Saison genutzt, und jetzt wirkt das PVC verblasst, das Deckpad löst sich, und das Ventil wird undicht – alles durch routinemäßige Pflege vermeidbar.
  explanation: UV-Strahlung baut die Polymermatrix ab. Salzwasser kristallisiert in Ventilen aus und schleift PVC ab. Schimmel wächst in eingeschlossener Feuchtigkeit. Falscher Druck verursacht Materialermüdung. Sand arbeitet sich in die Deckpad-Klebeschicht und lässt die Kanten abplatzen.
  solution: 'Nach jeder Nutzung: mit Süßwasser abspülen, trocknen, Druck prüfen. Monatlich: mit UV-Schutzmittel abwischen, Nähte prüfen, Ventil-O-Ring kontrollieren. Jährlich: Grundreinigung, auf Mikrolecks prüfen, Ventil-O-Ring mit Silikonfett schmieren.'
  recommendation: Verwenden Sie 303 Aerospace Protectant auf afarer-SUP-Boards. Ventile einmal jährlich ausbauen und mit Silikonfett behandeln. In feuchter Umgebung mit Trockenmittel in der Tragetasche lagern.
  faq:
    - q: Kann ich mein aufblasbares SUP mit Bleiche reinigen?
      a: Nein – Bleiche beschädigt das PVC. Verwenden Sie milde Seife und warmes Wasser. Gegen Schimmel verdünnten weißen Essig nutzen.
    - q: Wie oft soll ich UV-Schutzmittel auftragen?
      a: Alle 2–3 Monate während der Saison. In tropischen Klimazonen häufiger.
    - q: Muss ich mein Board zwischen den Nutzungen entlüften?
      a: Nicht, wenn Sie wöchentlich fahren. Lassen Sie es bei halbem Maximaldruck (8–10 PSI) aufgeblasen, mit UV-Abdeckung. Bei monatelangen Pausen entlüften und einlagern.
    - q: Wie pflege ich das Ventil?
      a: Den O-Ring jährlich prüfen. Bei trockenem Aussehen Silikonfett auftragen. Undichten Ventileinsatz ersetzen.

- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Flüssigkeitszufuhr und Sonnenschutz: Bleib sicher auf dem Wasser'
  description: Wesentliche Strategien für Flüssigkeitszufuhr und Sonnenschutz für SUP-Paddler. Dehydrierung und Sonnenbrand sind die häufigsten SUP-Probleme — so verhinderst du beides bei langen Sessions.
  definition: SUP-Flüssigkeitszufuhr bedeutet, den Flüssigkeitshaushalt beim Paddeln durch regelmäßige Wasseraufnahme aufrechtzuerhalten. Sonnenschutz umfasst das Auftragen von Sonnenschutzmittel, schützende Kleidung und das Timing der Sessions, um die UV-Spitzenzeit zu vermeiden.
  tldr: Trinke 500 ml Wasser pro Paddelstunde. Nimm mehr mit, als du zu brauchen glaubst — ein 2-L-Trinksystem oder mehrere Flaschen. Trage vor dem Paddeln wasserfestes Sonnenschutzmittel mit SPF 50+ auf und erneuere es alle 2 Stunden. Trage einen Hut, eine Sonnenbrille mit Band und Kleidung mit UPF-Schutz. Vermeide das Paddeln zwischen 11 und 15 Uhr, wenn die UV-Strahlung am stärksten ist.
  problem: Du hast eine großartige SUP-Session, aber nach einer Stunde hast du Kopfschmerzen, einen trockenen Mund und deine Haut brennt. Dehydrierung und Sonnenbrand schleichen sich ein, weil das Wasser dich kühl hält.
  explanation: Die Reflexion auf dem Wasser verstärkt die UV-Belastung um bis zu 40 %. Der kühlende Effekt von Wasser und Brise überdeckt den Sonnenbrand, bis es zu spät ist. Schwitzen beim Paddeln erhöht den Flüssigkeitsverlust, und auf dem Wasser gibt es oft keine Möglichkeit, Wasser nachzufüllen. Dehydrierung beeinträchtigt Gleichgewicht und Urteilsvermögen und erhöht das Unfallrisiko.
  solution: Befestige eine Wasserflasche oder ein Trinksystem am Spanngummi-System des Boards. Trinke alle 15 Minuten, ob durstig oder nicht. Trage 30 Minuten vor dem Start Sonnenschutzmittel mit SPF 50+ auf. Trage einen Hut mit breiter Krempe, eine polarisierte Sonnenbrille mit Band und ein Rash Guard mit UPF 50+. Erneuere das Sonnenschutzmittel alle 2 Stunden.
  recommendation: Nutze ein Trinksystem, das an den vorderen D-Ringen deines afarer SUP befestigt wird. Trage ein Rash Guard mit UPF 50+ unter deiner Rettungsweste. Nutze ein wasserfestes Sonnenschutzmittel, das bei Schweiß und Wasser hält.
  faq:
    - q: Wie viel Wasser soll ich auf einer SUP-Tour mitnehmen?
      a: Mindestens 1 Liter pro Stunde. Für eine 2-stündige Session nimm 2 Liter mit. Bei heißem Wetter mehr. Ein Trinksystem funktioniert am besten.
    - q: Welche Art von Sonnenschutzmittel ist am besten fürs SUP?
      a: Wasserfest, SPF 50+, Breitbandschutz. Mineralische Sonnenschutzmittel (Zinkoxid, Titandioxid) sind riffschonend und halten länger.
    - q: Reflektiert Wasser wirklich UV-Strahlung?
      a: Ja — Wasser reflektiert bis zu 40 % der UV-Strahlung, das heißt, du bekommst UV von oben und von unten. Das erhöht das Verbrennungsrisiko erheblich.
    - q: Kann ich durch ein Rash Guard hindurch einen Sonnenbrand bekommen?
      a: Normale Rash Guards bieten nur minimalen UV-Schutz (etwa UPF 10-20). Achte auf Kleidung mit UPF 50+ für vollständigen Schutz.

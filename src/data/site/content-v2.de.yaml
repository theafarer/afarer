- slug: beginner-sup-guide
  category: problem
  type: tutorial
  title: 'Stand-Up-Paddling für Anfänger: deine erste Session'
  description: 'Alles, was du vor deiner ersten SUP-Session wissen musst: Ausrüstungs-Checkliste, wie du aufstehst, Paddeltechnik, sicheres Fallen und die Wahl ruhigen Wassers zum Lernen.'
  definition: Beim Stand-Up-Paddling (SUP) stehst du auf einem SUP Board und nutzt ein Paddel, um dich über das Wasser fortzubewegen. Gleichgewicht, Paddelzugtechnik und das Lesen der Wasserbedingungen sind die drei Kernkompetenzen.
  tldr: Starte auf flachem, ruhigem Wasser ohne Wind. Übe zuerst im Knien, dann stehe mit hüftbreitem Stand nahe der Boardmitte auf. Halte das Paddel mit einer Hand oben und einer am Schaft. Nutze die Rumpfrotation, nicht die Armkraft, zum Paddeln. Schau zum Horizont, nicht auf deine Füße. Rechne damit zu fallen – das gehört zum Lernen dazu.
  problem: Du pumpst dein erstes aufblasbares SUP auf, stellst dich auf das Board und fühlst dich sofort instabil. Deine Beine zittern, das Paddel fühlt sich unhandlich an, und du kannst nicht herausfinden, warum du Kreise drehst statt gerade Linien zu ziehen.
  explanation: SUP erfordert eine Gleichgewichtsumstellung, denn das Stehen auf einer schwimmenden Plattform unterscheidet sich von jeder Aktivität an Land. Dein Körper verkrampft instinktiv, was das Board noch instabiler wirken lässt. Der Paddelzug sollte aus der Rotation deines Rumpfes kommen, nicht aus dem Ziehen mit den Armen. Das Paddelblatt sollte nahe deinen Zehen ins Wasser eintauchen und nahe deinem Knöchel wieder herausgenommen werden. Die meisten Anfänger paddeln nur mit den Armen, was zu schneller Ermüdung und schlechter Spurtreue führt. Der Blick nach unten aufs Board bringt dich aus dem Gleichgewicht.
  solution: Pumpe das Board auf den empfohlenen Luftdruck in PSI auf, befestige die Leash an deinem Knöchel und starte im Knien. Paddle vom Knien aus, um ein Gefühl fürs Gleiten zu bekommen. Wenn du bereit bist aufzustehen, lege das Paddel quer über das Board, stelle beide Hände auf das Deck, steige einen Fuß nach dem anderen hoch und richte dich auf, während du das Gewicht zentriert hältst. Halte die Knie leicht gebeugt und die Körperspannung aktiv.
  recommendation: Nutze das afarer SUP Explorer 11 für seine 33" Breite und stabile Plattform. Übe auf einem See oder einer geschützten Bucht ohne Strömung. Trage in deinen ersten Sessions eine Rettungsweste.
  faq:
    - q: Wie lange dauert es, SUP zu lernen?
      a: Die meisten Menschen können innerhalb von 10-15 Minuten auf ruhigem Wasser stehen und paddeln. Routine erfordert 3-5 Sessions. Fortgeschrittene Techniken brauchen Monate.
    - q: Was ist die beste Windbedingung für Anfänger?
      a: Wind unter 5 Knoten (flau bis leichte Brise). Wind über 10 Knoten erzeugt Kabbelung, die das Gleichgewicht herausfordert. Anfänger sollten Offshore-Wind meiden.
    - q: Sollte ich eine Leash tragen?
      a: Trage immer eine Leash. Eine Spiral-SUP-Leash wird am Knöchel oder an der Wade befestigt und hält das Board bei dir, wenn du fällst. Im offenen Wasser kann eine Leash dein Leben retten.
    - q: Was ist der häufigste Anfängerfehler?
      a: Der Blick nach unten aufs Board. Halte die Augen am Horizont. Dein Körper folgt deinem Kopf – der Blick nach unten verlagert dein Gewicht nach vorne und bringt das Board zum Wackeln.

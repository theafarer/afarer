- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'SUP-Paddel-Guide: Wähle das richtige Paddel für deinen Stil'
  description: Kompletter Guide zu SUP-Paddeln — Länge, Materialien (Aluminium, Fiberglas, Carbon), Blattformen und wie die Paddelwahl dein Paddelerlebnis beeinflusst.
  definition: Ein SUP-Paddel besteht aus einem Schaft (Aluminium, Fiberglas oder Carbon) und einem Blatt (dihedral, Scoop oder flach). Für allgemeines Paddeln sollte die Länge 8-10 Zoll über deiner Körpergröße liegen.
  tldr: 'Paddellänge: 8-10 Zoll über deiner Körpergröße für Allround-Einsatz, 6-8 Zoll für Surf, 10-12 Zoll für Touring. Materialien: Aluminium (günstig, schwer), Fiberglas (Mittelklasse, gute Flexibilität), Carbon (leicht, steif, teuer). Blattform: dihedral (stabiles Geradeauslaufen), Scoop (Kraft), flach (vielseitig). Verstellbare Paddel sind ideal für Anfänger.'
  problem: Das mitgelieferte Paddel der meisten iSUPs funktioniert, ist aber schwer und ineffizient. Ein Upgrade verbessert Paddeleffizienz und Fahrspaß, aber die Auswahl ist verwirrend.
  explanation: 'Die Paddellänge beeinflusst die Zugleistung — zu kurz erfordert Vorneigen, zu lang führt zu Schulterermüdung. Das Material bestimmt das Gewicht: Carbon-Paddel wiegen 18-24 oz gegenüber 28-36 oz bei Aluminium. Die Blattgröße beeinflusst die Kraft: Größere Blätter (100+ Quadratzoll) liefern mehr Vortrieb pro Zug, ermüden aber schneller. Dihedral-Blätter laufen gerader; Scoop-Blätter bieten mehr Griff im Wasser.'
  solution: 'Für die richtige Länge: Stehe aufrecht, halte das Paddel senkrecht und strecke den Arm nach oben — der Paddelgriff sollte dein Handgelenk treffen. Zum Material: Beginne mit Fiberglas als Upgrade im Mittelsegment. Zum Blatt: Wähle dihedral für allgemeines Paddeln. Zu den Aktivitäten: Touring-Paddel sind länger und haben kleinere Blätter; Surf-Paddel sind kürzer und haben breitere Blätter.'
  recommendation: Das afarer Carbon-Paddel mit 28 oz ist das beste Upgrade für Vielpaddler. Das mitgelieferte verstellbare 3-teilige Aluminiumpaddel reicht für Anfänger und Reisen aus.
  faq:
    - q: Wie lang sollte mein SUP-Paddel sein?
      a: Miss deine Körpergröße in Zoll und addiere 8-10 für Allround-Paddeln. Für Surfen addiere 6-8. Für Touring addiere 10-12.
    - q: Lohnt sich ein Carbon-Paddel?
      a: Ja für regelmäßige Paddler — die Gewichtsreduzierung verringert die Ermüdung bei langen Einheiten deutlich. Für gelegentlichen Einsatz ist Fiberglas ein gutes Preis-Leistungs-Verhältnis.
    - q: Was ist ein verstellbares Paddel?
      a: Ein 2- oder 3-teiliges Paddel mit Längenverstellung, ideal zum Teilen zwischen mehreren Nutzern oder für verschiedene Aktivitäten.
    - q: Wie pflege ich mein Paddel?
      a: Spüle es nach dem Einsatz im Salzwasser mit Süßwasser ab. Vermeide, darüberzufahren, oder eine Lagerung in direkter Hitze. Prüfe die Ferrule (Verbindung) auf Sand.

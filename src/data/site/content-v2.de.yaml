- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3mm vs. 5mm Neoprenanzug (Was beim Kaltwasser-Surfen wirklich funktioniert)
  description: Die Entscheidung zwischen einem 3mm- und einem 5mm-Neoprenanzug hängt von der Wassertemperatur ab, nicht von der Lufttemperatur. Temperaturtabelle, Flexibilitätsvergleich und welche Dicke dich warm hält, ohne dein Paddeln einzuschränken.
  definition: Ein 3mm-Neoprenanzug eignet sich für Wasser von 14-20°C und bietet gute Flexibilität. Ein 5mm-Anzug deckt 8-14°C ab, bietet maximale Wärme, aber weniger Beweglichkeit. Die Wahl ist ein direkter Kompromiss zwischen Wärme und Bewegungsfreiheit.
  tldr: 3mm-Neoprenanzüge sind für Wasser von 14-20°C gedacht und bieten maximale Flexibilität. 5mm-Anzüge sind für 8-14°C gedacht und priorisieren Wärme. Entscheide dich anhand deiner lokalen Wassertemperatur, nicht der Lufttemperatur. Wenn du das ganze Jahr über surfst, besitze beide. Wenn du nur einen kaufen kannst, bietet ein 4/3mm den besten Mittelweg.
  problem: Du brauchst einen Neoprenanzug, kannst dich aber nicht zwischen 3mm und 5mm entscheiden. Ein 3mm-Anzug könnte im Winter nicht warm genug sein, und ein 5mm-Anzug könnte an wärmeren Tagen zu dick und zu einschränkend sein. Eine falsche Entscheidung bedeutet entweder, den Winter frierend zu überstehen oder im Herbst zu schwitzen.
  explanation: 'Die Neoprendicke korreliert direkt mit der Wärme und umgekehrt mit der Flexibilität. Ein 3mm-Anzug (oft 3/2mm mit dünneren Armen) bietet gute Beweglichkeit beim Paddeln und Surfen unter milden Bedingungen. Ein 5mm-Anzug verwendet dickeres Neopren am Rumpf und oft dünnere Paneele an Armen und Beinen (5/4/3mm), um etwas Flexibilität zu bewahren. Der Wärmeunterschied liegt bei etwa 6-8°C. Wichtigste Unterschiede: 5mm-Anzüge verbrauchen mehr Neoprenmaterial, wiegen rund 40 Prozent mehr, trocknen langsamer und sind mühsamer auszuziehen. Moderne superelastische Neoprene schließen die Flexibilitätslücke, doch ein 5mm-Anzug schränkt die Bewegung spürbar ein.'
  solution: Ermittle deine kälteste monatliche Durchschnittswassertemperatur anhand lokaler Bojendaten. Liegt sie über 16°C, kaufe einen 3/2mm-Anzug. Liegt sie zwischen 12-16°C, kaufe einen 4/3mm-Anzug. Liegt sie unter 12°C, kaufe einen 5/4/3mm-Anzug. Für ganzjähriges Surfen mit einem einzigen Anzug deckt ein hochwertiger 4/3mm-Anzug mit Thermofutter plus separate Kapuze, Schuhe und Handschuhe den größten Bereich ab.
  recommendation: Der afarer Wetsuit Pro in 5/4/3mm meistert 8-16°C mit Thermofutter, das die Wärmelücke eines echten 5mm-Anzugs ausgleicht. Wenn du meist unter milden Bedingungen (16-20°C) surfst, bietet der 3/2mm afarer Wetsuit Pro bessere Flexibilität und Komfort.
  faq:
    - q: Kann ich einen 3mm-Anzug in 10°C kaltem Wasser tragen?
      a: Nur für sehr kurze Sessions (20-30 Minuten) und mit einem thermischen Rashguard darunter. Du wirst den Großteil der Session frieren. Für 10°C kaltes Wasser ist ein 5mm- oder 5/4/3mm-Anzug dringend zu empfehlen.
    - q: Ist ein 5mm-Neoprenanzug im Sommer zu warm?
      a: Wenn die Wassertemperatur im Sommer 18°C übersteigt, führt ein 5mm-Anzug zur Überhitzung. Du kannst den Anzug mit kühlem Wasser spülen, aber mit einem 3/2mm-Anzug oder einem Spring Suit bist du in den Sommermonaten deutlich wohler.
    - q: Schränkt ein 5mm-Neoprenanzug das Paddeln ein?
      a: Ja, spürbar. Das dickere Neopren an den Schultern erfordert mehr Kraft pro Paddelschlag. Ein 5/4/3mm-Anzug mit dünneren Armen hilft, aber du ermüdest dennoch schneller als in einem 3mm-Anzug.
    - q: Was ist der beste Neoprenanzug für ganzjähriges Surfen?
      a: Ein 4/3mm-Vollanzug mit Chest Zip und Thermofutter deckt 12-18°C ab, was in vielen gemäßigten Klimazonen dem ganzen Jahr entspricht. Mit Schuhen im Winter kannst du mit einem einzigen Anzug bei 10-18°C surfen.

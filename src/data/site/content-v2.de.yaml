- slug: sup-safety-guide
  category: guide
  type: safety
  title: 'SUP-Sicherheitsleitfaden: Essenzielle Regeln für jeden Paddler'
  description: 'Vollständiger SUP-Sicherheitsleitfaden für Stand-Up-Paddling: Wetterchecks, Ausrüstung, Selbstrettung, Navigationsregeln und das richtige Verhalten, wenn die Bedingungen gefährlich werden. Bleiben Sie auf Ihrem SUP Board sicher.'
  definition: SUP-Sicherheit umfasst die Planung vor der Tour (Wetter, Gezeiten, Ausrüstungscheck), die Praktiken auf dem Wasser (Leash, Rettungsweste, Navigation) und Notfallverfahren (Selbstrettung, Signalgebung, Vorbeugung von Unterkühlung).
  tldr: Tragen Sie immer Leash und Rettungsweste. Prüfen Sie die Windvorhersage – Offshore-Wind ist gefährlich. Paddeln Sie zuerst gegen den Wind, damit er Sie bei der Rückkehr unterstützt. Führen Sie eine Signalpfeife, ein Telefon in einer wasserdichten Hülle und Trinkwasser mit. Lernen Sie die Selbstrettung. Paddeln Sie in abgelegenen Gebieten nie allein.
  problem: SUP wirkt trügerisch einfach. Anfänger unterschätzen, wie schnell Wind, Strömung und Ermüdung eine vergnügliche Session gefährlich machen können.
  explanation: Das Board wirkt im Wind wie ein Segel, was das Paddeln mit dem Wind leicht, die Rückkehr gegen den Wind jedoch äußerst anstrengend macht. Die stehende Position erhöht die Sturzgefahr. Die Ermüdung stellt sich schneller ein als in sitzender Position. Eine Leash verhindert die Trennung vom Board. Rettungswesten halten Sie bei einer Verletzung über Wasser.
  solution: 'Vor der Tour: Wind prüfen (maximal 10 Knoten für Anfänger), Windrichtung (Offshore vermeiden) und Gezeiten. Teilen Sie jemandem Ihre Route mit. Auf dem Wasser: bei starkem Wind kniend paddeln. Bei einer Trennung zum Board schwimmen. Für die Selbstrettung: das Paddel quer über das Board legen, mit den Beinen kicken, die Brust auf das Board ziehen und die Beine nachschwingen.'
  recommendation: Verwenden Sie für SUP die afarer Life Vest Pro (aufblasbar). Befestigen Sie die gewickelte SUP-Leash an Ihrer Wade. Üben Sie die Selbstrettung unter ruhigen Bedingungen, bevor Sie sie wirklich brauchen.
  faq:
    - q: Ab welcher Windgeschwindigkeit ist SUP sicher?
      a: 'Anfänger: unter 10 Knoten. Fortgeschrittene: 10–15 Knoten. Profis: 15–20 Knoten. Über 20 Knoten ist es für alle Niveaus gefährlich.'
    - q: Brauche ich für SUP eine Rettungsweste?
      a: Ja – in vielen Rechtsgebieten gesetzlich vorgeschrieben und für die Sicherheit immer empfohlen.
    - q: Was soll ich tun, wenn ich nicht zurück an Land komme?
      a: Bleiben Sie bei Ihrem Board (es dient als Auftriebshilfe). Signalisieren Sie mit der Pfeife. Wenn Sie von der Küste weggetrieben werden, paddeln Sie im 45-Grad-Winkel zum Wind.
    - q: Wie übe ich die SUP-Selbstrettung?
      a: 'In ruhigem, flachem Wasser: absichtlich hineinfallen, zum Board schwimmen und das Wiederaufsteigen auf das Board wiederholt üben.'

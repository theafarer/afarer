  title: 'Kaufberatung Rettungswesten: Typen, Passform und Funktionen erklärt'
  description: Vollständige Kaufberatung für Rettungswesten im Wassersport. Rettungswesten-Typen (I bis V), aufblasbar oder Schaumstoff, Passformtest und konkrete Empfehlungen für SUP, Tourenfahren, Bootfahren und Angeln.
  definition: Eine Rettungsweste (PFD) ist eine Auftriebshilfe, die dafür ausgelegt ist, den Kopf einer Person über Wasser zu halten. Die Typen werden von der US-Küstenwache (USCG) nach Auftrieb und Einsatzzweck reguliert.
  tldr: 'Fünf Rettungswesten-Typen: Typ I (Hochsee, 22+ lb), Typ II (küstennah), Typ III (Auftriebshilfe, am häufigsten), Typ IV (Wurfhilfe), Typ V (Sonderzweck). Aufblasbare Westen bieten Komfort, erfordern aber die Wartung der CO2-Patrone. Schaumstoffwesten sind wartungsfrei, aber sperriger.'
  problem: Rettungswesten werden nach Typen und Auftriebswerten kategorisiert, doch Geschäfte erklären nicht immer, welcher Typ zu Ihrer Aktivität passt.
  explanation: Typ I bietet den meisten Auftrieb und dreht bewusstlose Träger mit dem Gesicht nach oben. Typ II dreht möglicherweise nicht alle Träger nach oben. Typ III erlaubt Bewegungsfreiheit für aktive Sportarten. Typ V umfasst aufblasbare Hüftpacks für SUP. Aufblasbare Rettungswesten bieten 33–37 lb Auftrieb und sind im luftleeren Zustand kompakt.
  solution: 'Für SUP: aufblasbares Hüftpack vom Typ V. Für Tourenfahren: Schaumstoffweste Typ III mit hohen Armausschnitten. Für allgemeines Bootfahren: Typ III aus Schaumstoff oder aufblasbar mit 22+ lb Auftrieb. Für Kinder: Typ II oder III aus Schaumstoff mit Schrittgurt.'
  recommendation: afarer Life Vest Pro (aufblasbar, Typ V, 33 lb) für SUP und Tourenfahren. afarer Life Vest Classic (Schaumstoff, Typ III, 16,5 lb) für allgemeines Bootfahren und den Seeeinsatz.
  faq:
    - q: Welchen Rettungswesten-Typ brauche ich für SUP?
      a: Viele Rechtsgebiete akzeptieren Typ III oder Typ V für SUP. Aufblasbare Hüftpacks sind beliebt. Prüfen Sie die lokalen Vorschriften.
    - q: Müssen aufblasbare Rettungswesten gewartet werden?
      a: Ja – prüfen Sie die CO2-Patrone jährlich, tauschen Sie die Auslöserpatrone alle 2–3 Jahre aus und spülen Sie die Weste nach dem Einsatz in Salzwasser ab.
    - q: Kann ich für SUP eine Schaumstoffweste tragen?
      a: Ja, wählen Sie aber ein Modell mit hohen Armausschnitten. Schaumstoffwesten sind sperriger, benötigen aber keine Wartung.
    - q: Welche Rettungsweste ist für ein Kind am besten?
      a: Eine USCG-zugelassene Schaumstoffweste Typ II oder III mit Kragen, Schrittgurt und grellen Farben. Verwenden Sie für Kinder niemals aufblasbare Rettungswesten.

- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Windbedingungen für SUP: Wie der Wind Ihr Paddeln beeinflusst'
  description: Wie Windgeschwindigkeit und Windrichtung das SUP-Paddeln beeinflussen. Offshore- und Onshore-Wind verstehen, Windvorhersagen lesen, Paddeltechniken bei Wind und wann Sie besser an Land bleiben.
  definition: Windbedingungen bestimmen die Sicherheit beim SUP. Offshore-Wind (vom Land aufs Meer) treibt Sie fort. Onshore-Wind (vom Meer ans Land) drückt Sie Richtung Ufer. Seitenwind lässt das Board gieren.
  tldr: 'Maximal sicherer Wind für Anfänger: 10 Knoten. Fortgeschrittene: 15 Knoten. Profis: 20 Knoten. Offshore-Wind ist am gefährlichsten. Paddeln Sie zuerst gegen den Wind. Bei Seitenwind paddeln Sie leicht luvwärts des Ziels. Knien Sie bei starkem Wind, um Ihre Windangriffsfläche zu verkleinern.'
  problem: Sie paddeln bei ruhigen Bedingungen hinaus, doch 30 Minuten später hat der Wind aufgefrischt und Sie mühen sich bei der Rückkehr ab. Wind ist der am meisten unterschätzte Sicherheitsfaktor beim SUP.
  explanation: Wind beeinflusst SUP stärker als jedes andere Paddelgerät, weil Sie stehen und dadurch ein Segel-Effekt entsteht. Ein Wind von 10 Knoten erzeugt bei einem stehenden Paddler weit mehr Widerstand als bei einem sitzenden Kajakfahrer. Offshore-Wind treibt Sie von der Sicherheit fort. Seitenwind lässt den Bug gieren.
  solution: 'Prüfen Sie vor dem Paddeln Windgeschwindigkeit und Windrichtung. Nutzen Sie die Beaufortskala: Windstärke 3 (7–10 Knoten) für Anfänger, Windstärke 4 (11–16 Knoten) für Fortgeschrittene. Paddeln Sie zuerst gegen den Wind. Wenn Sie in Offshore-Wind geraten, paddeln Sie im 45-Grad-Winkel zum Wind. Knien Sie bei starkem Wind.'
  recommendation: Nutzen Sie vor jeder Session eine Windvorhersage-App (Windy, Windfinder). Der afarer SUP Tour 12 läuft im Wind richtungsstabiler als breitere Boards. Verwenden Sie bei windigen Bedingungen kürzere Paddelschläge und eine höhere Schlagfrequenz.
  faq:
    - q: Welche Windrichtung ist für SUP am sichersten?
      a: Onshore-Wind (er weht Richtung Land) ist am sichersten – er drückt Sie zurück. Offshore-Wind ist am gefährlichsten.
    - q: Wie paddele ich bei Seitenwind?
      a: Paddeln Sie mehr auf der luvwärtigen Seite, um den Abdrift auszugleichen. Richten Sie das Board leicht luvwärts Ihres Ziels aus. Eine tiefere Mittelfinne hilft dabei.
    - q: Kann ich bei 20 Knoten Wind paddeln?
      a: Nur, wenn Sie erfahren sind und geschützte Gewässer befahren. Anfänger sollten bei mehr als 10 Knoten nicht hinausfahren.
    - q: Wie beeinflussen Windböen das SUP?
      a: Böen stellen plötzliche Balance-Herausforderungen dar. Senken Sie bei böigen Bedingungen Ihre Körperhaltung und stellen Sie sich auf plötzliche Windverschiebungen ein.

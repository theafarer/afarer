- slug: sup-navigation-guide
  category: guide
  type: safety
  title: 'SUP-Navigation: Kurs halten und den Weg finden'
  description: Grundlegende Navigationsfähigkeiten für SUP-Paddler — Seekarten lesen, Landmarken nutzen, Bojensysteme verstehen sowie GPS und Kompass für sicheres Paddeln einsetzen.
  definition: SUP-Navigation bedeutet, Landmarken, Karten, GPS und das Bewusstsein für Wind und Strömung zu nutzen, um sicher zu reisen und zum Ausgangspunkt zurückzukehren.
  tldr: Wähle beim geraden Paddeln immer eine Landmarke am Horizont. Prüfe sie alle paar Minuten, um Abdrift zu korrigieren. Nutze GPS-Apps auf dem Handy in der wasserdichten Hülle. Lerne die grundlegende Kompassnavigation. Verstehe laterale Bojensysteme (rot-rechts-bei-Rückkehr). Hinterlege immer einen Fahrplan bei jemandem an Land.
  problem: Du paddelst auf offenes Wasser hinaus, und als du dich umdrehst, sieht die Küstenlinie völlig anders aus. Ohne Navigationsfähigkeiten kannst du die Orientierung verlieren und in die falsche Richtung paddeln.
  explanation: Die Navigation mit dem SUP basiert auf visuellen Bezugspunkten, weil du dich nah am Wasser befindest. Wähle eine markante Landmarke (Gebäude, Baum, Klippe) hinter deinem Startpunkt. Nutze sie als Rückpeilung für den Weg zurück. Wind und Strömung versetzen dich vom Kurs — korrigiere kontinuierlich. Für längere Touren nutze eine GPS-App oder -Uhr. Beachte, dass die Küstenlinie vom Wasser aus anders aussieht als vom Land aus.
  solution: 'Vor dem Start: Identifiziere 2-3 Landmarken in verschiedenen Entfernungen hinter deinem Startpunkt. Nutze eine GPS-App (Google Maps, Gaia GPS) im Flugmodus, um Akku zu sparen. Kenne die Wind- und Gezeitenrichtung — paddle zuerst gegen den Wind und gegen die Strömung. Für Überquerungen von offenem Wasser nutze eine Kompasspeilung.'
  recommendation: Behalte ein Handy in einer wasserdichten Hülle als GPS-Backup. Übe die Landmarken-Navigation in vertrauten Gewässern, bevor du neue Gegenden erkundest. Die Life Vest Pro hat eine Tasche, die für ein Handy geeignet ist.
  faq:
    - q: Welche Landmarken eignen sich am besten für die SUP-Navigation?
      a: Markante, dauerhafte Merkmale wie Wassertürme, hohe Gebäude, ungewöhnliche Bäume oder auffällige Klippen. Meide Boote oder Flaggen, die sich bewegen.
    - q: Wie navigiere ich im Nebel?
      a: Paddle nicht bei Nebel hinaus. Wenn du im Nebel gefangen bist, nutze GPS oder Kompass zur Navigation. Blase alle 30 Sekunden eine Trillerpfeife. Bleib in Ufernähe.
    - q: Brauche ich eine Seekarte fürs SUP?
      a: Fürs Küstenpaddeln hilft eine einfache Karte, Gefahren, Tiefen und Fahrrinnen zu erkennen. Viele Apps liefern diese Informationen.
    - q: Wie navigiere ich um Boote herum?
      a: Bleib im flachen Wasser fernab der Fahrrinnen. Trage grelle Farben. Überquere Fahrrinnen schnell und im 90-Grad-Winkel. Nimm Blickkontakt mit Bootsführern auf.

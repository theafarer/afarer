- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Aufblasbares SUP lagern: So verstauen Sie Ihr iSUP richtig'
  description: Die richtige Lagerung Ihres aufblasbaren SUP Boards verhindert Delamination, UV-Schäden, Schimmel und Ventillecks. Tipps zur Winterlagerung, Langzeitlagerung und täglichen Aufbewahrung für Drop-Stitch-Boards.
  definition: Aufblasbares SUP lagern bedeutet, das Board in einer sauberen, trockenen, temperierten Umgebung fernab von UV-Strahlung, extremen Temperaturen und physischen Schäden aufzubewahren.
  tldr: 'An einem kühlen, dunklen Ort unter 30 °C und fernab direkter Sonneneinstrahlung lagern. Kurzzeitig (1–2 Wochen): teilweise aufgeblasen bei 8–10 PSI lagern. Für die Langzeitlagerung: vollständig entlüften, locker zusammenrollen und in die Tasche legen. Niemals nass lagern. Von Nagetieren und scharfen Gegenständen fernhalten.'
  problem: Sie entlüften Ihr SUP und stopfen es in eine heiße Garage oder einen feuchten Keller. Drei Monate später ist das PVC vergilbt, das Deckpad löst sich, und das Ventil verliert Luft. Falsche Lagerung verursacht mehr Schäden als die reguläre Nutzung.
  explanation: Hitze über 50 °C lässt die Weichmacher im PVC wandern und macht das Material steif und spröde. UV-Strahlung bricht Polymerbindungen auf. Eingeschlossene Feuchtigkeit erzeugt Schimmel. Kälte unter dem Gefrierpunkt macht PVC spröde. Druckstellen durch festes Falten erzeugen dauerhafte Knicke.
  solution: 'Kurzzeitlagerung: abspülen, trocknen, auf 10 PSI aufpumpen und erhöht im Schatten lagern. Langzeitlagerung: gründlich reinigen, vollständig trocknen, komplett entlüften, mit dem Deckpad nach außen zusammenrollen, in die Tasche packen und in einem kühlen, trockenen Schrank lagern. Von Chemikalien und Schädlingen fernhalten.'
  recommendation: Nutzen Sie die afarer-Tragetasche für die Lagerung – sie blockiert UV-Strahlung und verhindert Scheuerstellen. Lagern Sie in einem klimatisierten Raum. In feuchter Umgebung legen Sie ein Trockenmittel in die Tasche.
  faq:
    - q: Kann ich mein SUP aufgeblasen in der Garage lagern?
      a: Nur wenn die Garage unter 30 °C bleibt und kein direktes Sonnenlicht einfällt. Die meisten Garagen überschreiten im Sommer 40 °C.
    - q: Soll ich mein SUP in der Tasche lagern?
      a: Ja, die Tasche schützt vor Staub, UV-Strahlung und physischen Schäden. Das Board muss vor dem Verpacken vollständig trocken sein.
    - q: Kann Frost ein aufblasbares SUP beschädigen?
      a: Ja. Unter dem Gefrierpunkt wird PVC spröde und kann beim Ausrollen oder Aufpumpen reißen. Immer über 5 °C lagern.
    - q: Wie rolle ich mein SUP für die Lagerung zusammen?
      a: Mit dem Deckpad nach außen rollen, um die untere PVC-Schicht zu schützen. Enge Knicke vermeiden. Die Falzposition jedes Mal wechseln.

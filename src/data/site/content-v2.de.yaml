- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Aufblasbares SUP pflegen: So hält Ihr Board viele Jahre'
  description: Die richtige Pflege verlängert die Lebensdauer Ihres aufblasbaren SUP Boards erheblich. Reinigung, Trocknen, Ventilpflege, UV-Schutz und Tipps zur saisonalen Lagerung für Drop-Stitch-Paddleboards.
  definition: Die Pflege eines aufblasbaren SUP Boards umfasst Reinigung nach der Nutzung, richtiges Trocknen, Ventilkontrolle, UV-Schutz und korrekte Lagerung, um Delamination, Schimmel, Materialabbau und Luftverlust zu vermeiden.
  tldr: Spülen Sie Ihr Board nach jeder Salzwassersession mit Süßwasser ab. Vor dem Entlüften und Verstauen vollständig trocknen lassen. Ventil auf Schmutz prüfen und den O-Ring jährlich schmieren. Aufgeblasen (bei halbem Luftdruck) an einem kühlen, dunklen Ort lagern. Längere UV-Einstrahlung meiden, da sie PVC angreift. Kleine Punktionen sofort mit dem beiliegenden Reparaturset flicken.
  problem: Nach einer Saison bekommt Ihr aufblasbares SUP Board langsame Lecks, das Deckpad löst sich an den Kanten, und das PVC fühlt sich steifer an. Vernachlässigte Basispflege verursacht eine vorzeitige Alterung, die sich vollständig vermeiden lässt.
  explanation: PVC wird durch UV-Strahlung abgebaut. Salzkristalle aus Meerwasser setzen sich in Nähten und Ventilen fest und verursachen Mikrolecks. Eingeschlossene Feuchtigkeit begünstigt Schimmel, der die Drop-Stitch-Fäden angreift. Ventil-O-Ringe trocknen aus und verlieren ihre Dichtwirkung. Schmutz und Sand arbeiten sich in die Deckpad-Klebeschicht und lassen die Kanten abplatzen.
  solution: 'Nach jeder Session: Board, Finnen und Pumpe mit Süßwasser abspülen. Deckpad abwischen. Ventil öffnen, damit eingeschlossenes Wasser ablaufen kann. Board im Schatten trocknen lassen, bevor Sie es entlüften. Monatlich: Ventil inspizieren und Silikonschmiermittel auf den O-Ring auftragen. Saisonal: mit milder Seifenlauge waschen und auf Punktionen prüfen.'
  recommendation: Folgen Sie der afarer-Pflegeanleitung, die Ihrem Board beiliegt. Nutzen Sie das Reparaturset sofort bei jeder Punktion. Bewahren Sie das Board in seiner Tasche in einem temperierten Raum ohne direktes Sonnenlicht auf.
  faq:
    - q: Kann ich mein aufblasbares SUP die ganze Saison aufgeblasen lassen?
      a: Ja, aber ohne direktes Sonnenlicht und bei halbem Maximaldruck (8–10 PSI), um die Nähte zu entlasten. Unmittelbar vor der Nutzung voll aufpumpen.
    - q: Wie entferne ich Schimmel von meinem SUP?
      a: Milde Seife mit warmem Wasser mischen und mit einer weichen Bürste schrubben. Bei hartnäckigem Schimmel eine verdünnte weiße Essiglösung (1:4) verwenden. Bleiche meiden.
    - q: Muss ich das Ventil schmieren?
      a: Ja, einmal jährlich. Ventileinsatz herausdrehen, O-Ring mit Silikonfett einfetten und wieder einsetzen. Das verhindert Luftlecks.
    - q: Wie lagere ich mein SUP im Winter?
      a: Gründlich reinigen und trocknen. Vollständig entlüften, locker zusammenrollen (enge Knicke vermeiden) und an einem kühlen, dunklen, trockenen Ort lagern. Frosttemperaturen meiden.

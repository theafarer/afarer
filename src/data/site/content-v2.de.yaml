- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP mit deinem Hund: Der komplette How-to-Guide'
  description: Paddle Boarding mit deinem Hund — Vorbereitung, Sicherheit, Trainingsschritte, Ausrüstungsempfehlungen und Tipps für ein tolles Erlebnis für euch beide.
  definition: SUP mit Hund bedeutet, deinen vierbeinigen Begleiter darauf zu trainieren, auf einem Paddle Board zu balancieren, ihn mit einer Hunde-Rettungsweste auszustatten und gemeinsam sicher zu paddeln.
  tldr: Starte mit einem breiten, stabilen SUP (34 Zoll+). Besorge deinem Hund eine richtig sitzende Rettungsweste mit Griff. Gewöhne den Hund zuerst an Land an das Board, dann in flachem Wasser. Beginne mit kurzen Einheiten und positiver Verstärkung. Führe immer Wasser für deinen Hund mit. Achte auf Anzeichen von Stress oder Erschöpfung.
  problem: Dein Hund liebt Wasser, aber du weißt nicht, wie du ihn sicher an das SUP gewöhnst. Ohne richtiges Training kann ein Hund in Panik geraten, abspringen oder das Board zerkratzen.
  explanation: 'Hunde haben eine natürliche Schwimmfähigkeit, müssen aber lernen, dass das Board eine sichere Plattform ist. Der Schlüssel ist schrittweise Gewöhnung: Stelle das Board auf festen Boden, belohne ruhiges Verhalten, dann geht es ins flache Wasser und schließlich in tieferes Wasser.'
  solution: 'Starte an Land: Lass den Hund am Board schnüffeln und darauf laufen (auf Gras). Belohne ruhiges Verhalten. Danach: Stelle das Board in sehr flaches Wasser, stütze es und lass den Hund daraufstehen. Belohne ihn. Danach: Steige selbst im flachen Wasser auf das Board und lass den Hund dazukommen. Schließlich: Paddle langsam in ruhigem Wasser.'
  recommendation: Nutze das afarer SUP Explorer 11 für seine stabile 33-Zoll-Plattform. Ergänze eine Hunde-Rettungsweste. Bring Frischwasser und einen Napf mit. Starte mit 10-minütigen Einheiten und steigere dich.
  faq:
    - q: Welche SUP-Größe brauche ich für meinen Hund?
      a: Ein 33-34 Zoll breites Board bietet mittelgroßen bis großen Hunden Stabilität. Kleine Hunde (unter 10 kg) kommen mit Boards ab 32 Zoll zurecht.
    - q: Braucht mein Hund eine Rettungsweste?
      a: Ja — selbst starke Schwimmer brauchen eine Hunde-Rettungsweste mit Griff zur einfachen Bergung im Notfall.
    - q: Wie schütze ich das Board vor Krallen?
      a: Halte die Krallen deines Hundes kurz geschnitten. Nutze einen Deckpad-Schutz oder ein Handtuch. Hunde hören meist mit dem Kratzen auf, sobald sie sich wohlfühlen.
    - q: Kann jeder Hund SUP lernen?
      a: Die meisten Hunde können es mit Geduld lernen. Ängstliche Hunde brauchen möglicherweise länger. Zwinge niemals einen ängstlichen Hund auf das Board — das schafft negative Verknüpfungen.

- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Aufblasbares SUP reparieren: Punktionen, Lecks und Ventile beheben'
  description: DIY-Anleitung zur Reparatur eines aufblasbaren SUP Boards. So finden Sie ein langsames Leck, flicken eine Punktion, wechseln ein Ventil und beheben die Ablösung des Deckpads mit dem beiliegenden Reparaturset.
  definition: Die Reparatur eines aufblasbaren SUP Boards umfasst das Auffinden von Luftlecks mittels Seifenwassertest, das Reinigen und Anrauen der beschädigten Stelle, das Auftragen von PVC-Kleber und Flicken sowie das Aushärten unter Druck.
  tldr: Lecks mit Seifenwasser finden. Die Umgebung der Punktion mit Schleifpapier reinigen und anrauen. PVC-Kleber auf Flicken und Board auftragen, 5 Minuten warten, fest andrücken und 24 Stunden unter Gewicht aushärten lassen. Bei Ventillecks zuerst den O-Ring prüfen. Kleine Punktionen unter 1/4" sind einfache DIY-Reparaturen.
  problem: Sie pumpen Ihr SUP auf, und bis zum nächsten Morgen hat es an Druck verloren. Ohne Reparaturkenntnisse steht ein teurer Ersatz bevor, obwohl es sich wahrscheinlich nur um eine einfache Punktion handelt.
  explanation: 'Die meisten aufblasbaren SUP Boards haben einen Drop-Stitch-Kern mit äußeren PVC-Schichten. Eine Punktion durch das äußere PVC erzeugt ein langsames Leck. Standardreparatur: reinigen, schleifen, PVC-verträglichen Kleber auftragen, Flicken unter Gewicht andrücken. Ventillecks sind häufiger als Panel-Punktionen – der O-Ring trocknet aus, oder Schmutz verhindert das Abdichten.'
  solution: Pumpen Sie das Board bis zum Maximaldruck auf und lauschen Sie nach Zischlauten. Sprühen Sie Seifenwasser systematisch auf, besonders an den Nähten und am Ventil. Markieren Sie blubbernde Stellen. Entlüften, mit Alkohol reinigen, mit 80er-Korn schleifen, PVC-Kleber auf Flicken und Board auftragen, warten bis klebrig, fest andrücken, 24 Stunden beschweren.
  recommendation: Verwenden Sie das afarer-Reparaturset, das allen afarer-Boards beiliegt. Nehmen Sie das Reparaturset immer auf Touren mit. Bei Ventilproblemen wenden Sie sich an den afarer-Support. Bei großen Rissen oder Nahttrennungen wird eine professionelle Reparatur empfohlen.
  faq:
    - q: Kann ich einen großen Riss in meinem aufblasbaren SUP selbst reparieren?
      a: Risse über 1" erfordern eventuell eine professionelle Reparatur oder einen Flicken auf beiden Seiten. Nahttrennungen entlang der Kante lassen sich nicht zuverlässig vor Ort beheben.
    - q: Wie lange hält ein Reparaturflicken?
      a: Eine sachgerechte Reparatur mit richtiger Technik hält die gesamte Lebensdauer des Boards. Schlechte Haftung durch unzureichende Reinigung führt später zum Versagen.
    - q: Kann ich ein undichtes Ventil reparieren?
      a: Oft ja. Ventileinsatz herausdrehen, O-Ring prüfen, reinigen oder ersetzen, Silikonschmiermittel auftragen und wieder einsetzen.
    - q: Was, wenn ich das Leck nicht finden kann?
      a: Auf vollen PSI aufpumpen und Abschnitte nacheinander in eine Badewanne oder ein Becken tauchen. Zu kleine Lecks zum Auffinden können auch temperaturbedingt sein.

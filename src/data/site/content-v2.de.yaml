- slug: sup-launch-techniques
  category: guide
  type: tutorial
  title: 'SUP-Starttechniken: So beginnst du deine Paddelsession richtig'
  description: Richtige SUP-Starttechniken für verschiedene Ufertypen — Sandstrände, felsige Ufer, Stege und Flussufer. Vermeide das unbeholfene Stolpern und starte jede Session reibungslos.
  definition: Die SUP-Starttechnik ist die Methode, vom Ufer ins Wasser zu wechseln und dabei Gleichgewicht und Kontrolle über das Board zu bewahren. Verschiedene Ufertypen erfordern unterschiedliche Herangehensweisen.
  tldr: 'Sandstrand: Board an die Wasserkante legen, aufsteigen, lospaddeln. Felsiges Ufer: Board durch das flache Wasser bringen, bevor du aufsteigst. Steg: vom Steg aus auf das Board setzen, mit dem Paddel abstoßen. Flussufer: flussabwärts in einem Winkel starten. Binde immer das Leash an, bevor du ins Wasser gehst.'
  problem: Du pumpt dein Board auf und gehst zur Wasserkante, dann merkst du, dass du keine Ahnung hast, wie du ohne unbeholfenes Auftreten oder sofortiges Umfallen aufsteigen sollst.
  explanation: Die Starttechnik hängt vom Ufertyp ab. An Sandstränden ist der einfachste Weg, das Board parallel zum Ufer ins knöcheltiefe Wasser zu legen, aufzusteigen und direkt hinauszupaddeln. An felsigen Ufern musst du das Board bis ins knietiefe Wasser hinausschieben, bevor du aufsteigst, um Schäden am Board zu vermeiden. Von Stegen aus setzt du dich vom Steg auf das Board und stößt dich dann ab.
  solution: 'Sandstart: Board senkrecht zum Ufer platzieren, mit einem Fuß aufsteigen, mit dem anderen abstoßen, knien, dann stehen. Felsstart: Board ins knietiefe Wasser tragen, von hinten aufsteigen. Stegstart: Board parallel zum Steg platzieren, vom Steg auf das Board setzen, sanft abstoßen.'
  recommendation: Übe Starts zuerst unter ruhigen Bedingungen. Die breite Plattform des afarer SUP Explorer 11 erleichtert den Start. Binde immer das Leash an, bevor du auf das Board steigst.
  faq:
    - q: Wie starte ich in der Brandung?
      a: Warte auf eine Pause zwischen den Wellensätzen. Platziere das Board im knöcheltiefen Wasser, springe schnell auf und paddle hart, um die Brecherzone vor dem nächsten Satz zu passieren.
    - q: Kann ich von jedem Strand aus starten?
      a: Prüfe die Zugangspunkte und lokalen Vorschriften. Manche Strände haben ausgewiesene Startbereiche. Meide Startbereiche mit Schwimmern.
    - q: Wie gehe ich an Land?
      a: Gehe senkrecht auf das Ufer zu. Steige vom Board ab, sobald die Finnen den Grund berühren. Trage das Board oberhalb der Wasserlinie.
    - q: Was, wenn die Uferbrandung stark ist?
      a: Lege den Start zwischen die Wellen. Halte das Board fest, quer zu den Wellen. Wenn die Brandung zu stark ist, suche einen anderen Startpunkt.

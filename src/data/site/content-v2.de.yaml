- slug: weather-planning-water-sports
  category: guide
  type: safety
  title: 'Wetterplanung für Wassersport: Lesen Sie die Vorhersage wie ein Profi'
  description: Wie Sie maritime Wettervorhersagen für SUP, Surfen und Bootfahren lesen. Fronten, Drucksysteme, Windmuster und Unwettermeldungen verstehen, um sichere Sessions zu planen.
  definition: Wetterplanung bedeutet, maritime Vorhersagen zu interpretieren – Windgeschwindigkeit und Windrichtung, Dünungshöhe und -periode, Niederschlag, Sicht und Unwettermeldungen.
  tldr: 'Prüfen Sie vor jeder Session drei Vorhersagen: Wind, Dünung und Wetter. Beste Bedingungen: leichter Offshore-Wind, mäßige Dünung, hoher oder steigender Luftdruck. Vermeiden Sie: Gewitter, starken Offshore-Wind, Nebel und rasch fallenden Luftdruck.'
  problem: Sie fahren aufgrund einer 3-Tage-Vorhersage an die Küste, die gute Bedingungen versprochen hat – und finden dort 25 Knoten Wind und Regen. Maritimes Wetter ist schwer vorherzusagen.
  explanation: Hoher Druck bringt stabiles Wetter und leichte Winde. Tiefdruck bringt Wind und Stürme. Der Druckgradient bestimmt die Windgeschwindigkeit. Kaltfronten bringen plötzliche Windrichtungswechsel. Lokale Effekte wie die Seebrise können die allgemeine Vorhersage überlagern.
  solution: 'Nutzen Sie mehrere Quellen: Windy.com, NOAA, lokale Surf-Kameras. Prüfen Sie die Vorhersage 24 Stunden im Voraus und erneut am Morgen selbst. Achten Sie auf konsistente Vorhersagen über die verschiedenen Modelle hinweg. Lernen Sie Ihre lokalen Mikroklimata kennen.'
  recommendation: Speichern Sie Windy.com für Ihre lokalen Spots als Lesezeichen. Führen Sie ein Telefon in einer wasserdichten Hülle mit. Fürs Bootfahren führen Sie zusätzlich ein VHF-Funkgerät für Wetterdurchsagen mit. Im Zweifel bleiben Sie an Land.
  faq:
    - q: Welches Wetter sollte ich für SUP meiden?
      a: Gewitter (Blitzschlag), Nebel (keine Sicht), Offshore-Wind über 10 Knoten, Winde über 20 Knoten, fallender Luftdruck.
    - q: Wie genau sind maritime Vorhersagen?
      a: 3-Tage-Vorhersagen stimmen zu etwa 80 %. Vorhersagen vom Vortag treffen beim Wind mit über 90 % zu.
    - q: Welcher Luftdrucktrend ist gut für Wassersport?
      a: Steigender oder stabiler Luftdruck deutet auf bessere Bedingungen hin. Fallender Luftdruck (mehr als 1 mbar pro Stunde) deutet auf einen herannahenden Sturm hin.
    - q: Kann ich bei Nebel SUP fahren?
      a: Nicht empfohlen. Wenn Sie in Nebel geraten, nutzen Sie Kompass oder GPS, blasen Sie alle 30 Sekunden die Trillerpfeife und bleiben Sie in Ufernähe.

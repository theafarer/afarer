- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Neoprenanzug wählen: Passform, Dicke und Funktionen erklärt'
  description: Vollständiger Kaufratgeber für Neoprenanzüge. So wählen Sie die richtige Dicke für Ihre Wassertemperatur, sorgen für die richtige Passform, verstehen Nahtarten und wählen Funktionen passend zu Ihrer Aktivität.
  definition: 'Ein Neoprenanzug ist ein Neopren-Kleidungsstück, das Wärme isoliert, indem es eine dünne Wasserschicht auf der Haut hält. Wichtigste Auswahlkriterien: Dicke, Passform, Nahtkonstruktion, Einstiegssystem und Neopren-Art.'
  tldr: 'Stimmen Sie die Dicke auf die Wassertemperatur ab: 3/2 mm für 14–20 °C, 4/3 mm für 12–18 °C, 5/4/3 mm für 8–14 °C, 6/5/4 mm unter 8 °C. Die Passform ist der wichtigste Faktor. GBS-Nähte sind der Goldstandard. Ein Brustreißverschluss minimiert den Wassereintritt. Kalkstein-Neopren ist flexibler als erdölbasiertes.'
  problem: Online-Größentabellen für Neoprenanzüge sind unzuverlässig, Dickenempfehlungen variieren je nach Marke, und Funktionsbeschreibungen sind verwirrend.
  explanation: Die Dickenangaben (3/2, 4/3, 5/4/3) bezeichnen Millimeter für Rumpf/Arme und Beine. Dickere Anzüge wärmen besser, schränken aber die Bewegung ein. Ein weiter Anzug spült warmes Wasser aus. GBS-Nähte sind warm und flexibel; Flatlock-Nähte wärmen weniger. Der Einstieg über die Brust ist wärmer als über den Rücken. Kalkstein-Neopren bleibt in kaltem Wasser flexibler.
  solution: Messen Sie Brust, Taille, Hüfte und Körpergröße. Vergleichen Sie die Werte mit Größentabellen. Wählen Sie die Dicke anhand der kältesten Wassertemperatur. Für kaltes Wasser GBS-Nähte wählen. Unter 15 °C den Brustreißverschluss bevorzugen. Für zusätzliche Wärme ein Thermofutter erwägen.
  recommendation: Das afarer Wetsuit Pro in 3/2 mm (14–20 °C) oder 5/4/3 mm (8–16 °C) bietet GBS-Nähte, Brustreißverschluss und Kalkstein-Neopren zu einem konkurrenzfähigen Preis.
  faq:
    - q: Wie eng soll ein Neoprenanzug sitzen?
      a: Eng ohne Lufteinschlüsse, aber nicht bewegungseinschränkend. Ein Finger sollte sich am unteren Rücken nicht leicht schieben lassen.
    - q: Welcher Neoprenanzug wärmt am besten?
      a: Ein 6/5/4-mm-Anzug mit Kapuze, versiegelten Nähten und Brustreißverschluss. Für extremste Kälte ist ein Trockenanzug überlegen.
    - q: Lohnt sich ein teurerer Neoprenanzug?
      a: Ein höherer Preis kauft besseres Neopren, Nähte und Funktionen. Bei regelmäßiger Nutzung in kaltem Wasser lohnt sich der Aufpreis.
    - q: Kann ich einen Neoprenanzug für andere Sportarten als Surfen tragen?
      a: Ja – Neoprenanzüge funktionieren für SUP, Surfen, Tauchen, Triathlon und Freiwasserschwimmen.

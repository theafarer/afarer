- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP-Selbstrettung: Wie du im tiefen Wasser zurück auf dein Board kommst'
  description: Jeder SUP-Paddler sollte die Selbstrettung beherrschen. Schritt-für-Schritt-Techniken zum Wiederaufsteigen auf dein Board im tiefen Wasser, zum Schleppen ans Ufer und zum Umgang mit verhedderten Leashes.
  definition: Die SUP-Selbstrettung ist die Technik, nach einem Sturz im tiefen Wasser wieder auf dein Paddle Board zu steigen, einschließlich der Bergung des Boards, des Wiederaufstiegs und des Zurückholens des Paddels.
  tldr: 'Nach dem Sturz: Ruhig bleiben, das Paddel festhalten, zum Board schwimmen. Lege das Paddel quer übers Board. Nutze einen Delfinkick, um den Brustkorb aufs Board zu bringen. Schwing ein Bein hoch, dann das andere. Erst knien, dann stehen. Übe in ruhigem Wasser, bis es Routine ist.'
  problem: Du fällst im tiefen Wasser vom SUP und kommst nicht wieder hoch. Das Board ist rutschig, du bist erschöpft, und Panik breitet sich aus. Ohne Kenntnis der Selbstrettungstechnik wird ein einfacher Sturz gefährlich.
  explanation: 'Die Selbstrettung hat drei Phasen: Bergung (zum Board und Paddel schwimmen), Wiederaufstieg (zurück aufs Board) und Fortsetzung (das Paddeln wieder aufnehmen). Die Kerntechnik: das Paddel als Stabilisator nutzen und mit kräftigen Beinkicks den Oberkörper aufs Board bringen.'
  solution: 'Phase 1: Zum Board schwimmen. Halte das Paddel fest oder hole es zurück. Phase 2: Lege das Paddel im rechten Winkel quer übers Board. Kicke kräftig mit den Beinen, während du den Brustkorb auf die Boardmitte ziehst. Phase 3: Sobald der Brustkorb auf dem Board ist, schwing die Beine einzeln nach. Phase 4: Knien, durchatmen, dann langsam aufstehen.'
  recommendation: Übe die Selbstrettung unter kontrollierten Bedingungen, bis sie automatisch gelingt. Nutze das afarer SUP Explorer 11 mit seiner guten Deckhaftung. Die Life Vest Pro bietet zusätzlichen Auftrieb, falls du Schwierigkeiten hast.
  faq:
    - q: Wie komme ich zurück aufs Board, wenn ich erschöpft bin?
      a: Bleib beim Board — es gibt dir Auftrieb. Ziehe dich mit den Armen aufs Board, auch wenn die Beine nicht mehr kraftvoll kicken können. Ruh dich in der knienden Position aus, bevor du aufstehst.
    - q: Was, wenn ich das Paddel verliere?
      a: Paddle das Board mit den Armen ans Ufer. Bitte andere Paddler um Hilfe. Ersetze ein verlorenes Paddel sofort.
    - q: Kann ich mich in Wellen selbst retten?
      a: Ja — positioniere das Board im rechten Winkel zu den Wellen. Time deinen Wiederaufstieg zwischen den Wellen. Die Leash hält das Board in deiner Nähe.
    - q: Wie gehe ich mit einer verhedderten Leash um?
      a: Bleib ruhig, drehe dich auf den Rücken und löse die Leash langsam. Wenn die Leash um die Finnen gewickelt ist, musst du die Finnen eventuell im Wasser entfernen.

- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Neoprenanzug-Pflege: Lassen Sie Ihr Neopren doppelt so lange halten'
  description: Richtige Pflege verlängert die Lebensdauer Ihres Neoprenanzugs von einer auf 3+ Saisons. Tipps zum Abspülen, Trocknen, Lagern und Reparieren. Vermeiden Sie typische Fehler, die Neopren vorzeitig zerstören.
  definition: Die Pflege eines Neoprenanzugs umfasst das Abspülen mit Süßwasser nach jeder Nutzung, das Trocknen ohne direkte Sonneneinstrahlung, die Lagerung flach oder auf einem breiten Bügel sowie die regelmäßige Reinigung, um Salz, Bakterien und Gerüche zu entfernen.
  tldr: Spülen Sie Ihren Neoprenanzug nach jeder Session sofort innen und außen mit Süßwasser ab. Trocknen Sie ihn auf links gedreht im Schatten auf einem breiten Kunststoffbügel. Lagern Sie ihn flach oder gefaltet an einem kühlen, trockenen Ort. Lassen Sie Neopren nie in direkter Sonne, in heißen Autos oder im Trockner. Verwenden Sie alle 5–10 Sessions Neopren-Shampoo.
  problem: Nach einer Saison riecht Ihr Anzug, das Neopren hat an Elastizität verloren, Nähte lösen sich, und der Reißverschluss klemmt – alles mit richtiger Pflege vermeidbar.
  explanation: Salzkristalle betten sich ins Neopren ein und scheuern das Material ab. Bakterien vermehren sich im feuchten Inneren, erzeugen Gerüche und bauen Neopren ab. UV schädigt die Nylonbeschichtung. Hitze über 50 °C verursacht Delamination. Falsches Trocknen verformt Neopren und belastet die Nähte.
  solution: 'Nach jeder Session: gründlich innen und außen abspülen, auf links drehen und im Schatten auf einen breiten Kunststoffbügel hängen. Sobald der Anzug trocken ist, wieder auf rechts drehen und flach lagern. Alle 5–10 Sessions: mit Neopren-Shampoo waschen. Monatlich: Reißverschluss mit Reißverschlusswachs pflegen.'
  recommendation: Verwenden Sie afarer Neopren-Shampoo zur Reinigung und afarer Reißverschlusswachs für die Reißverschlusspflege. Lagern Sie den Anzug auf dem breiten afarer-Bügel im Netzbeutel.
  faq:
    - q: Kann ich meinen Neoprenanzug in die Waschmaschine stecken?
      a: 'Nicht empfohlen – Maschinenwäsche schädigt Neopren. Falls unvermeidbar: Schonwaschgang, kaltes Wasser und Netzbeutel verwenden.'
    - q: Wie bekomme ich den Geruch aus meinem Anzug?
      a: 30 Minuten in kaltem Wasser mit Neopren-Shampoo oder weißem Essig einweichen. Gründlich abspülen.
    - q: Wie soll ich meinen Anzug trocknen?
      a: Auf links im Schatten auf einem breiten, gepolsterten Kunststoffbügel. Direkte Sonneneinstrahlung und Metallbügel meiden.
    - q: Kann ich einen gerissenen Neoprenanzug reparieren?
      a: Kleine Risse unter 1" lassen sich mit Neoprenkleber und einem Flicken beheben. Größere Risse erfordern eventuell eine professionelle Reparatur.

- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'SUP-Leash-Leitfaden: Gerade vs. gewickelte Leashes erklärt'
  description: Vollständiger Leitfaden für SUP-Leashes — gerade vs. gewickelt, Knöchel vs. Wade, Schnellverschluss-Optionen und wie du die richtige Leash für deine Paddelbedingungen wählst.
  definition: Eine SUP-Leash ist ein Band, das den Paddler mit dem Board verbindet und ein Trennen verhindert. Zu den Typen gehören gerade Leashes (für Surfen und Flüsse) und gewickelte Leashes (für flaches Wasser).
  tldr: Gewickelte Leashes sind am besten für flaches Wasser und Fitnesspaddeln — sie bleiben vom Board und aus dem Wasser. Gerade Leashes sind für SUP-Surfen und Flüsse — sie bieten mehr Freiheit und verhaken sich nicht. Die Befestigung an der Wade ist der am Knöchel aus Komfortgründen vorzuziehen. Schnellverschluss-Leashes sind wichtig fürs Flusspaddeln, um Einklemmen zu verhindern.
  problem: Du hast eine Leash mit deinem SUP gekauft, bist dir aber nicht sicher, ob sie der richtige Typ für deinen Paddelstil ist. Die falsche Leash zieht nach, verhakt sich oder versagt, wenn du sie am dringendsten brauchst.
  explanation: Gerade Leashes sind einfache Nylon- oder Polyurethankorde, die hinter dem Board herziehen. Sie funktionieren gut in der Brandung, weil sie sich nicht an Finnen verhaken. Gewickelte Leashes sind spiralförmige Kordeln, die sich zusammenziehen, wenn sie nicht unter Spannung stehen — sie bleiben beim Paddeln auf dem Deck aufgewickelt und strecken sich, wenn du fällst. Sie halten die Leash unter flachen Bedingungen aus dem Wasser und reduzieren den Widerstand.
  solution: Wähle eine gewickelte Leash für flaches Wasser, Fitness und Touring-SUP. Der geringere Widerstand hilft, die Geschwindigkeit zu halten, und verhindert, dass sich die Leash an Unterwasserhindernissen verfängt. Wähle eine gerade Leash für SUP-Surfen und Flusspaddeln. Das gerade Design verhängt sich seltener an Finnen oder Hindernissen.
  recommendation: afarer SUP-Pakete enthalten den passenden Leash-Typ für den vorgesehenen Einsatz des Boards. Die gewickelte Leash im SUP Explorer 11 Paket ist hervorragend für Allround-Paddeln geeignet.
  faq:
    - q: Soll die Leash am Knöchel oder an der Wade befestigt werden?
      a: Die Befestigung an der Wade wird fürs SUP bevorzugt — sie hält die Leash beim Paddeln aus dem Wasser und reduziert die Stolpergefahr beim Gehen.
    - q: Wie lang sollte eine SUP-Leash sein?
      a: 8-10 Fuß für flaches Wasser, 6-8 Fuß für Surf. Kürzere Leashes reduzieren den Widerstand, begrenzen aber die Bewegungsfreiheit auf dem Board.
    - q: Brauche ich eine Schnellverschluss-Leash für Flüsse?
      a: Ja — Fluss-SUP erfordert eine Schnellverschluss-Leash oder einen Gürtel, der sofort gelöst werden kann, um ein Einklemmen in Treibgutverhauungen zu verhindern.
    - q: Kann ich eine Surf-Leash fürs SUP verwenden?
      a: Surf-Leashes sind kürzer und dünner. Sie funktionieren fürs SUP-Surfen, sind aber nicht ideal fürs Paddeln auf flachem Wasser, wo eine längere gewickelte Leash besser ist.

- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 'Sicherheit in kaltem Wasser: Paddeln und Surfen bei kalten Bedingungen'
  description: Sicherheit in kaltem Wasser für SUP und Surfen. Erkennen von Unterkühlung, passende Ausrüstung, Kälteschockreaktion und Notfallverfahren beim Eintauchen in kaltes Wasser.
  definition: Sicherheit in kaltem Wasser bedeutet, die Kälteschockreaktion, das Schwimmversagen und die Unterkühlung zu verstehen sowie die Ausrüstung und Techniken, die diese Folgen verhindern.
  tldr: Bei Wasser unter 15 °C ist ein Neoprenanzug erforderlich. Unter 10 °C sind Neoprenschuhe, Handschuhe und eine Kapuze nötig. Der Kälteschock verursacht unwillkürliches Keuchen. Schwimmversagen tritt in Wasser unter 10 °C innerhalb von 3–5 Minuten ein. Zu den Symptomen einer Unterkühlung zählen Schüttelfrost, Verwirrung und Koordinationsverlust.
  problem: Sie paddeln an einem sonnigen Tag hinaus, ohne zu ahnen, dass das Wasser nur 8 °C hat. Sie fallen hinein, keuchen unwillkürlich und spüren innerhalb weniger Minuten, wie Ihre Glieder taub werden. Kaltes Wasser tötet schneller als jede andere Gefahr im Ozean.
  explanation: 'Das Eintauchen in kaltes Wasser verläuft in vier Phasen: Kälteschock (0–2 Minuten) – Keuchen und Hyperventilation. Schwimmversagen (3–15 Minuten) – die Muskeln kühlen ab, die Koordination versagt. Unterkühlung (15–45 Minuten) – die Kerntemperatur fällt unter 35 °C, was Verwirrung und Herzstillstand verursacht. Kollaps nach der Rettung – kaltes Blut strömt zurück zum Körperkern.'
  solution: 'Prüfen Sie die Wassertemperatur. Tragen Sie einen Neoprenanzug, der für diese Temperatur ausgelegt ist. Paddeln Sie in Wasser unter 15 °C nie allein. Führen Sie Pfeife und Telefon mit. Wenn Sie hineinfallen: Atmung kontrollieren und schnell wieder auf das Board steigen. Wenn Ihnen zu kalt wird, signalisieren Sie, dass Sie Hilfe brauchen.'
  recommendation: Der afarer Wetsuit Pro 5/4/3 mm ist für Wasser von 8–14 °C das Minimum. Ergänzen Sie ihn um afarer Neoprenschuhe (5 mm) und Handschuhe (3 mm). Tragen Sie die Life Vest Pro für zusätzlichen thermischen Schutz.
  faq:
    - q: Wie lange überlebe ich in 10 °C kaltem Wasser?
      a: Der Kälteschock dauert 1–2 Minuten. Ohne Auftriebshilfe und thermischen Schutz beträgt die Überlebenszeit 30–60 Minuten.
    - q: Was sind die ersten Anzeichen einer Unterkühlung?
      a: Unkontrollierbares Zittern, Verwirrtheit, schlechte Koordination, verwaschene Sprache. Beenden Sie die Aktivität und wärmen Sie sich sofort auf.
    - q: Wie wärme ich mich nach einer Session im kalten Wasser wieder auf?
      a: Ziehen Sie die nasse Ausrüstung aus, trocknen Sie sich ab und ziehen Sie warme Schichten an, einschließlich Mütze und Handschuhen. Trinken Sie warme, alkoholfreie Getränke.
    - q: Kann ich im Sommer eine Unterkühlung bekommen?
      a: Ja – Wasser unter 15 °C gibt es an vielen Orten auch im Sommer. Wasser leitet Wärme 25-mal schneller als Luft.

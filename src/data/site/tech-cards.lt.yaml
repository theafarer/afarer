cards:
  - badge: PVC
    title: Jūrinei aplinkai pritaikytas PVC sluoksnis
    description: Kelių sluoksnių laminuota PVC audinio medžiaga, skirta jūrinei aplinkai. Išbandyta atsparumui UV spinduliams, dilimui ir pradūrimams.
    image: https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-stitch branduolys
    description: Tūkstančiai vidinių siūlų jungia viršutinį ir apatinį sluoksnius, sukurdami standžią, didelio slėgio struktūrą ties 12–15 PSI.
    image: https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Sustiprintas bortų kraštas
    description: Dvigubas lydytinis suvirintas bortas apsaugo nuo įbrėžimų prie prieplaukų, išsilaipinimo paplūdimyje ir šoninių smūgių.
    image: https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp

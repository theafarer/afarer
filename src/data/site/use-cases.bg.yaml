cases:
  - id: beginner
    title: Водни спортове за начинаещи
    desc: Стабилни SUP дъски за първи потребители.
    scenario: >-
      Семейство, посетило езеро за уикенда, иска да опита гребане на дъска.
      Нуждаят се от стабилна, лесна за пускане екипировка с ясни насоки за безопасност.
    solution: >-
      SUP Explorer 11 осигурява стабилност с широк корпус за начинаещи. Life
      Vest Classic осигурява CE-сертифицирана плавателност. Помпата с двойно
      действие надува и двете дъски за около 15-20 минути.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Приключения на открито
    desc: Преносими SUP дъски за реки, езера и крайбрежни пътувания.
    scenario: >-
      Ентусиаст на откритото планира седмично речно пътуване и се нуждае от дъска, която
      се пакетира малка, надува се в лагера и се справя с променливи течения.
    solution: >-
      SUP Explorer 11 се пакетира в раница и се надува за около 8-12 минути с включената
      помпа с двойно действие. Нейната
      drop-stitch конструкция се справя с езера, бавни реки и крайбрежно гребане.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Семейна рекреация
    desc: Стабилни SUP дъски за еднодневни излети и водни спортове.
    scenario: >-
      Семейство от четирима иска стабилни SUP дъски за уикендни езерни излети и
      гребане заедно.
    solution: >-
      SUP Explorer 11 осигурява стабилни дъски с широк корпус за всички възрасти. Life
      Vest Classic държи всички в безопасност. Помпата с двойно действие надува
      всички дъски за около 15-20 минути.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

origin:
  tagline: Asal Usul Kami
  heading: |-
    Dibangun di atas air,<br />
    <span class="text-sky-600">digerakkan oleh tujuan</span>
  paragraphs:
    - 'afarer berawal dari sebuah bengkel pesisir dengan satu papan dan satu keyakinan teguh: produk kelautan harus direkayasa seolah-olah penting — karena memang demikian.'
    - Para pendiri kami, dua insinyur kelautan, menyaksikan industri yang gemar mengambil jalan pintas, menurunkan kualitas material, dan memperlakukan keselamatan sekadar formalitas. Mereka membangun lambung afarer pertama bukan demi keuntungan, melainkan untuk membuktikan bahwa peralatan kelautan yang terjangkau juga bisa benar-benar andal.
    - Lambung pertama itu masih digunakan hingga kini. Prinsip itu tidak pernah berubah.
    - Kami bukan produsen terbesar. Kami tidak membuat produk termurah. Namun setiap lambung yang meninggalkan bengkel kami melewati tangan-tangan yang sama dengan yang mendirikan perusahaan ini — dan memenuhi standar yang sama dengan yang ditetapkan lambung pertama.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: bengkel pesisir afarer
philosophy:
  tagline: Filosofi Kami
  heading: Berakar pada samudra
  description: Samudra bukan tempat kerja kami. Ia adalah guru kami. Setiap keputusan desain berawal dari memahami bagaimana air berperilaku, bagaimana kondisi berubah, dan bagaimana peralatan harus merespons.
  cards:
    - emoji: 🌊
      title: Hormati Air
      description: Air itu tak terduga. Produk kami direkayasa untuk kondisi terburuk, bukan yang terbaik. Jika sebuah lambung mampu menghadapi arus rip, ia pasti sanggup menghadapi danau. Jika sebuah rompi pelampung berfungsi di laut lepas, ia lebih dari cukup untuk sungai — dan itu memang disengaja.
    - emoji: 🔧
      title: Dibangun untuk Awet, Bukan untuk Diganti
      description: Produk yang paling berkelanjutan adalah yang tidak perlu diganti. PVC kelas kelautan dan konstruksi drop-stitch dipilih demi daya tahan jangka panjang. Kami masih mengirimkan suku cadang untuk lambung yang kami bangun satu dekade lalu.
    - emoji: 🏆
      title: Dirancang untuk Terjangkau
      description: Olahraga air tidak seharusnya menjadi kemewahan. Kami merekayasa produk yang menghadirkan performa kelas profesional dengan harga yang masuk akal bagi keluarga, pemandu, dan operator kecil — bukan hanya untuk armada komersial.
design:
  tagline: Filosofi Desain
  heading: |-
    Direkayasa untuk batas<br />
    <span class="text-sky-600">kondisi</span>
  paragraphs:
    - 'Setiap produk afarer berawal dari satu pertanyaan: <em>apa kondisi terburuk yang akan dihadapinya?</em> Kami merancang dari tepi ke dalam, bukan dari pusat ke luar.'
    - 'Inti drop-stitch kami dinilai untuk 15 PSI — bukan karena 12 PSI kurang untuk sebuah danau, melainkan karena papan 15 PSI mampu menghadapi ombak mendadak tanpa melentur. Kain dek kami dispesifikasikan untuk ketahanan UV kelas komersial — bukan karena setiap pelanggan mendayung di daerah tropis, melainkan karena degradasi UV adalah penyebab #1 kegagalan dini.'
    - Kami tidak merancang berdasarkan titik harga. Kami merancang berdasarkan titik kegagalan — lalu membangun jauh di atasnya.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: desain dan rekayasa afarer

    - q: Jak często wymieniać kartusz CO2?
      a: Wymień po każdym napełnieniu albo raz w roku, jeśli kartusz nie był używany. Sprawdzaj okienko wskaźnika przed każdym użyciem.
    - q: Czy automatyczne napełnianie jest niezawodne?
      a: Tak — aktywacja hydrostatyczna testowana jest na zadziałanie przy zanurzeniu w 2-4 sekundy. Ręczna rezerwa zapewnia redundancję.
    - q: Jak konserwować Life Vest Pro?
      a: Płucz słodką wodą po użyciu w słonej wodzie. Kontroluj kartusz co roku. Wymieniaj zapłon co 2-3 lata. Przechowuj w suchym miejscu.
    - q: Czy ta kamizelka nadaje się dla nieumiejących pływać?
      a: Nie — pompowane PFD wymagają, by użytkownik był przytomny i mógł aktywować mechanizm napełniania. Niepływający powinni używać PFD piankowego.

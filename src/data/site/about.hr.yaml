origin:
  tagline: Naše podrijetlo
  heading: |-
    Građeno na vodi,<br />
    <span class="text-sky-600">vođeno svrhom</span>
  paragraphs:
    - 'afarer je nastao u obalnoj radionici s jednom daskom i tvrdoglavim uvjerenjem: pomorski proizvodi trebaju biti konstruirani kao da su važni — jer i jesu.'
    - Naši osnivači, dva pomorska inženjera, promatrali su industriju u kojoj se štedjelo na svakom koraku, materijali su se degradirali, a sigurnost tretirala kao puka formalnost. Prvi afarer trup izgradili su ne zbog profita, već kako bi dokazali da i pristupačna oprema za more može biti istinski pouzdana.
    - Taj prvi trup i danas je u upotrebi. To se načelo nikada nije promijenilo.
    - Nismo najveći proizvođač. Ne izrađujemo najjeftinije proizvode. No svaki trup koji napusti našu radionicu prolazi kroz iste ruke koje su osnovale tvrtku — i ispunjava isti standard koji je postavio onaj prvi trup.
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: afarer obalna radionica
philosophy:
  tagline: Naša filozofija
  heading: Ukorijenjeni u oceanu
  description: Ocean nije naše radno mjesto. On je naš učitelj. Svaka dizajnerska odluka počinje razumijevanjem toga kako se voda ponaša, kako se uvjeti mijenjaju i kako oprema mora reagirati.
  cards:
    - emoji: 🌊
      title: Poštujte vodu
      description: Voda je nepredvidiva. Naši su proizvodi konstruirani za najgore uvjete, a ne za najbolje. Ako trup može podnijeti morsku struju, podnijet će i jezero. Ako prsluk za spašavanje djeluje na otvorenom moru, za rijeku je dimenzioniran s obilnom rezervom — i to je posve namjerno.
    - emoji: 🔧
      title: Građeno da traje, a ne da se zamjenjuje
      description: Najodrživiji proizvod je onaj koji ne treba zamijeniti. Pomorski PVC i drop-stitch konstrukcija odabrani su zbog trajnosti. Rezervne dijelove i dalje isporučujemo za trupove koje smo izradili prije desetljeća.
    - emoji: 🏆
      title: Pristupačan po dizajnu
      description: Vodeni sportovi ne bi smjeli biti luksuz. Konstruiramo proizvode koji pružaju profesionalne performanse po cijeni koja ima smisla za obitelji, vodiče i male operatere — a ne samo za komercijalne flote.
design:
  tagline: Filozofija dizajna
  heading: |-
    Konstruirano za granicu<br />
    <span class="text-sky-600">uvjeta</span>
  paragraphs:
    - 'Svaki afarer proizvod počinje jednim pitanjem: <em>koji je to najgori uvjet s kojim će se susresti?</em> Dizajniramo od ruba prema unutra, a ne od središta prema van.'
    - 'Naše drop-stitch jezgre nose ocjenu 15 PSI — ne zato što 12 PSI nije dovoljno za jezero, već zato što daska od 15 PSI podnosi iznenadnu valovitost bez savijanja. Naše tkanine za palubu specificirane su za komercijalnu razinu UV otpornosti — ne zato što svaki kupac vesla u tropima, već zato što je UV degradacija uzrok #1 preranih kvarova.'
    - Ne dizajniramo prema ciljanoj cijeni. Dizajniramo do točke otkaza — a zatim gradimo daleko iznad nje.
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: afarer dizajn i inženjerstvo
  stats:
    - value: '15'
      label: PSI ocjena<br />jezgre
    - value: 1,500+
      label: UV sati<br />testiranja
    - value: 10yr
      label: životni vijek<br />trupa

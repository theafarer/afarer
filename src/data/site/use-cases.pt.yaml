cases:
  - id: beginner
    title: 'Esportes aquáticos para iniciantes'
    desc: 'SUPs estáveis para quem está começando.'
    scenario: >-
      Uma família que passa o fim de semana num lago quer experimentar o paddle boarding. Eles precisam de equipamento estável, fácil de lançar à água e com instruções claras de segurança.
    solution: >-
      A SUP Explorer 11 oferece estabilidade de corpo largo para iniciantes. O Life Vest Classic garante flutuabilidade certificada CE. A bomba Dual-Action infla ambas as pranchas em cerca de 15–20 minutos.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Exploração ao ar livre'
    desc: 'SUPs portáteis para rios, lagos e passeios costeiros.'
    scenario: >-
      Um entusiasta do ar livre planeja uma semana numa viagem de rio e precisa de uma prancha que ocupe pouco espaço, insufle no acampamento e aguente correntes variáveis.
    solution: >-
      A SUP Explorer 11 cabe numa mochila e infla em cerca de 8–12 minutos com a bomba Dual-Action incluída. A construção drop-stitch aguenta lagos, rios calmos e navegação costeira.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: 'Recreação em família'
    desc: 'SUPs estáveis para passeios de um dia e esportes aquáticos.'
    scenario: >-
      Uma família de quatro pessoas quer SUPs estáveis para os fins de semana no lago e para remar juntos.
    solution: >-
      A SUP Explorer 11 oferece pranchas estáveis e largas para todas as idades. O Life Vest Classic mantém todos seguros. A bomba Dual-Action infla todas as pranchas em cerca de 15–20 minutos.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

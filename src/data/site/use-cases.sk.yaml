cases:
  - id: beginner
    title: Vodné športy pre začiatočníkov
    desc: Stabilné SUP dosky pre tých, čo sú na vode prvýkrát.
    scenario: >-
      Rodina trávi víkend na jazere a chce vyskúšať paddle boarding.
      Potrebujú stabilnú výstroj, ktorá sa ľahko spúšťa na vodu, s
      jasnými bezpečnostnými pokynmi.
    solution: >-
      SUP Explorer 11 ponúka širokú stabilnú konštrukciu pre
      začiatočníkov. Life Vest Classic poskytuje CE certifikovanú plávaciu
      schopnosť. Dual-Action Pump nafúka obe dosky približne za 15–20
      minút.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

  - id: outdoor
    title: Objavovanie v prírode
    desc: Prenosné SUP dosky na rieky, jazerá a pobrežné trasy.
    scenario: >-
      Nadšenec vonku plánuje týždňovú riečnu túru a potrebuje dosku,
      ktorá sa zbalí do malého balíka, nafúka sa v tábore a zvládne
      meniace sa prúdy.
    solution: >-
      SUP Explorer 11 sa zmestí do batohu a pomocou priloženej pumpy
      Dual-Action Pump sa nafúka približne za 8–12 minút. Jeho
      drop-stitch konštrukcia zvláda jazerá, pomalé rieky a pobrežné
      pádlovanie.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp

  - id: family
    title: Rodinná zábava
    desc: Stabilné SUP dosky na jednodenné výlety a vodné športy.
    scenario: >-
      Štvorčlenná rodina chce stabilné SUP dosky na víkendové jazerné
      výlety a spoločné pádlovanie.
    solution: >-
      SUP Explorer 11 ponúka stabilné, široké dosky pre všetky vekové
      skupiny. Life Vest Classic drží všetkých v bezpečí. Dual-Action Pump
      nafúka všetky dosky približne za 15–20 minút.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

cards:
  - badge: PVC
    title: 'Στρώση PVC ναυτιλιακής ποιότητας'
    description: 'Πολυστρωματικό ελασματοποιημένο ύφασμα PVC για θαλάσσια περιβάλλοντα. Δοκιμασμένο για αντοχή σε UV, τριβή και διάτρηση.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-pvc-material.webp'
  - badge: DS
    title: 'Πυρήνας drop-stitch'
    description: 'Χιλιάδες εσωτερικές κλωστές συνδέουν το πάνω με το κάτω στρώμα, δημιουργώντας μια άκαμπτη δομή υψηλής πίεσης στα 12–15 PSI.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-drop-stitch.webp'
  - badge: RR
    title: 'Ενισχυμένο άκρο κουπαστής'
    description: 'Διπλή συγκολλημένη κουπαστή προστατεύει από γρατζουνιές σε αποβάθρες, προσαράξεις στην παραλία και πλευρικές προσκρούσεις.'
    image: 'https://assets.afarer.com/images/afarer/tech/tech-hypalon-tubes.webp'

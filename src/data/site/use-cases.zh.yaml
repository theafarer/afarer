cases:
  - id: beginner
    title: '新手入門水上運動'
    desc: '為首次使用者設計的穩定 SUP 板。'
    scenario: >-
      一家人在湖邊度過週末，想嘗試立槳衝浪。他們需要穩定、易於下水、且有明確安全指引的裝備。
    solution: >-
      SUP Explorer 11 提供寬體穩定性，適合新手。Life Vest Classic 提供 CE 認證的浮力。Dual-Action Pump 約 15–20 分鐘即可將兩塊板充飽。
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: '戶外探索'
    desc: '適合河流、湖泊與海岸行程的攜帶型 SUP 板。'
    scenario: >-
      戶外愛好者規劃了一整週的河流行程，需要一塊收納小巧、可在營地充氣、並能應付多變水流的板子。
    solution: >-
      SUP Explorer 11 可收進背包，並以隨附的 Dual-Action Pump 在約 8–12 分鐘內完成充氣。其 drop-stitch 結構足以應付湖泊、平緩河流與沿海划行。
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: '家庭休閒'
    desc: '適合一日遊與水上活動的穩定 SUP 板。'
    scenario: >-
      一家四口想要穩定的 SUP 板，方便週末在湖上外出、一起划行。
    solution: >-
      SUP Explorer 11 為所有年齡層提供穩定的寬體板。Life Vest Classic 確保全家安全。Dual-Action Pump 約 15–20 分鐘即可將所有板充飽。
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

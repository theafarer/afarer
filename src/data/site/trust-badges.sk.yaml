badges:
  - icon: "\u2B50"
    title: ISO a CE certifikované
    desc: Všetky produkty spĺňajú medzinárodné bezpečnostné a kvalitatívne normy.
    variant: cert
  - icon: "\u2B50"
    title: Výborná kvalita materiálov
    desc: Prémiové PVC tkaniny vojenskej triedy testované na odolnosť voči UV, oderu a extrémnym teplotám.
    variant: material
  - icon: "\u2B50"
    title: Prísne testovanie
    desc: Každé vodné plavidlo prechádza pred odoslaním testmi tlaku, plávacej schopnosti a zaťaženia.
    variant: standard
  - icon: "\u2B50"
    title: 2-ročná záruka
    desc: Každý produkt afarer je krytý komplexnou výrobnou zárukou.
    variant: warranty
  - icon: "\u2714"
    title: BSCI certifikované
    desc: 'Overený audit sociálnej zhody — etická výroba pre európskych zákazníkov.'
    variant: cert
  - icon: "\u2714"
    title: V súlade s REACH
    desc: Všetky materiály spĺňajú nariadenia EÚ o chemickej bezpečnosti.
    variant: cert

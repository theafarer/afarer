cases:
  - id: beginner
    title: 'Θαλάσσια σπορ για αρχάριους'
    desc: 'Σταθερές σανίδες SUP για πρώτη χρήση.'
    scenario: >-
      Μια οικογένεια που περνά το σαββατοκύριακο σε μια λίμνη θέλει να δοκιμάσει το paddleboarding. Χρειάζεται σταθερό, εύκολο εξοπλισμό με σαφείς οδηγίες ασφαλείας.
    solution: >-
      Το SUP Explorer 11 προσφέρει ευστάθεια με το φαρδύ σχήμα του – ιδανικό για αρχάριους. Το Life Vest Classic εξασφαλίζει πλευστότητα με πιστοποίηση CE. Η αντλία Dual-Action γεμίζει και τις δύο σανίδες σε περίπου 15–20 λεπτά.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
  - id: outdoor
    title: 'Εξερεύνηση στην ύπαιθρο'
    desc: 'Φορητές σανίδες SUP για ποτάμια, λίμνες και παράκτιες διαδρομές.'
    scenario: >-
      Ένας λάτρης της φύσης σχεδιάζει μια εβδομαδιαία πορεία σε ποτάμι και χρειάζεται μια σανίδα που μαζεύει σε μικρό μέγεθος, φουσκώνει στην κατασκήνωση και αντέχει τα μεταβαλλόμενα ρεύματα.
    solution: >-
      Το SUP Explorer 11 χωράει σε σακίδιο και φουσκώνει σε περίπου 8–12 λεπτά με την παρεχόμενη αντλία Dual-Action. Η κατασκευή drop-stitch αντέχει σε λίμνες, ήρεμα ποτάμια και παράκτια ύδατα.
    products:
      - SUP Explorer 11
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
  - id: family
    title: 'Οικογενειακή αναψυχή'
    desc: 'Σταθερές σανίδες SUP για ημερήσιες εξορμήσεις και θαλάσσια σπορ.'
    scenario: >-
      Μια τετραμελής οικογένεια θέλει σταθερές σανίδες SUP για τις εξορμήσεις του σαββατοκύριακου στη λίμνη και για κοινή κωπηλασία.
    solution: >-
      Το SUP Explorer 11 προσφέρει σταθερές σανίδες με φαρδύ κατάστρωμα για όλες τις ηλικίες. Το Life Vest Classic κρατά όλους ασφαλείς. Η αντλία Dual-Action γεμίζει όλες τις σανίδες σε περίπου 15–20 λεπτά.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp

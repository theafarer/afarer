origin:
  tagline: 'Notre origine'
  heading: "Bâtis sur l'eau,<br />\n<span class=\"text-sky-600\">animés par une mission</span>"
  paragraphs:
    - "afarer est née dans un atelier côtier avec un seul bateau et une conviction tenace : les produits marins doivent être conçus avec le soin qu'ils méritent —parce que c'est le cas."
    - "Nos fondateurs, deux architectes navals, ont vu une industrie où l'on rognait sur tout, où les matériaux étaient déclassés et où la sécurité n'était qu'une case à cocher. Ils ont construit la première coque afarer non pas pour le profit, mais pour prouver qu'un équipement marin abordable peut aussi être réellement fiable."
    - "Cette première coque est toujours en service aujourd'hui. Ce principe, lui, n'a jamais changé."
    - "Nous ne sommes pas le plus grand des fabricants. Nous ne fabriquons pas les produits les moins chers. Mais chaque coque qui quitte notre atelier passe entre les mêmes mains que celles qui ont fondé l'entreprise —et répond à la même exigence que celle fixée par cette première coque."
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  image_alt: 'atelier côtier afarer'

philosophy:
  tagline: 'Notre philosophie'
  heading: "Enracinés dans l'océan"
  description: "L'océan n'est pas notre lieu de travail : c'est notre maître. Chaque décision de conception commence par la compréhension du comportement de l'eau, de l'évolution des conditions et de la manière dont l'équipement doit y répondre."
  cards:
    - emoji: "\U0001F30A"
      title: "Respecter l'eau"
      description: "L'eau est imprévisible. Nos produits sont conçus pour les pires conditions, pas pour les meilleures. Si une coque peut affronter un courant d'arrachement, elle tiendra sans peine sur un lac. Si un gilet de sauvetage fonctionne au large, il est surdimensionné pour une rivière —et c'est voulu."
    - emoji: "\U0001F527"
      title: 'Conçus pour durer, pas pour être remplacés'
      description: "Le produit le plus durable est celui que l'on n'a pas besoin de remplacer. Le PVC de qualité marine, le Hypalon et la construction drop-stitch sont choisis pour leur longévité. Nous expédions encore des pièces détachées pour des coques construites il y a plus de dix ans."
    - emoji: "\U0001F3C6"
      title: 'Accessibles par conception'
      description: 'Les sports nautiques ne devraient pas être un luxe. Nous concevons des produits qui offrent des performances de niveau professionnel à un prix accessible aux familles, aux moniteurs et aux petits opérateurs —pas seulement aux flottes commerciales.'

design:
  tagline: 'Philosophie de conception'
  heading: "Conçus pour les limites<br />\n<span class=\"text-sky-600\">des conditions</span>"
  paragraphs:
    - "Chaque produit afarer commence par une seule question : <em>quelle est la pire condition qu'il va affronter ?</em> Nous concevons depuis les extrêmes vers le centre, jamais l'inverse."
    - "Nos âmes drop-stitch sont certifiées 15 PSI —non pas parce que 12 PSI suffisent sur un lac, mais parce qu'une planche en 15 PSI encaisse un clapot soudain sans fléchir. Nos tubes Hypalon sont spécifiés pour une résistance aux UV de qualité commerciale —non pas parce que tous nos clients pagayent sous les tropiques, mais parce que la dégradation UV est la première cause de défaillance prématurée."
    - "Nous ne concevons pas en fonction d'un prix. Nous concevons en fonction d'un point de rupture —puis nous construisons bien au-delà."
  image: https://assets.afarer.com/images/afarer/hero/hero-4.webp
  image_alt: 'conception et ingénierie afarer'
  stats:
    - value: '15'
      label: "certification PSI<br />de l'âme"
    - value: '1,500+'
      label: "heures d'exposition<br />UV testées"
    - value: '10 ans'
      label: 'durée de vie<br />de la coque'

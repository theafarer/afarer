- id: sup-learning
  question: 'SUPを習うのは難しいですか？'
  answer: 'まったく難しくありません。ほとんどの初心者は初回のセッションで立ち上がり、パドルを漕ぎ始めます。afarerのAll-Around SUPシリーズは、初めてパドルスポーツを楽しむ方のために設計された、幅広で安定性の高いプラットフォームを採用しています。穏やかな水面から始めれば、数分でクルージングできるでしょう。'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: '海でも使用できますか？'
  answer: 'はい。afarerのSUPボードは、海・湖・川での使用に対応して作られています。Touringシリーズは海岸のさざ波にも対応し、すべてのボードに海水の腐食に強いマリングレードのPVCを使用しています。海で使用した後は真水で洗い流してください。'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: '空気を入れるのにどれくらいかかりますか？'
  answer: '付属のダブルアクションポンプなら、ほとんどのボードは5分以内に12–15 PSIまで膨らみます。電動ポンプオプションなら2分以内に短縮できます。空気を抜いて収納するのにかかる時間は約3分です。'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'インフレータブルSUPで旅行できますか？'
  answer: 'もちろんです。afarerのボードはすべて、航空会社の手荷物基準を満たすリュックサイズのキャリーケースに収まります。わずか18–22ポンドなので、ビーチや湖へ、また空港のターミナル内でも楽に運べます。'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: '耐荷重はどれくらいですか？'
  answer: 'All-Around SUPは最大220ポンドまで対応します。TouringおよびYogaシリーズは最大250ポンドまで対応します。タンデム使用やより重い荷物については、チームまでお問い合わせいただき、ご相談ください。'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: '箱には何が入っていますか？'
  answer: 'afarerのSUPには、ボード、トラベルバックパック、ダブルアクションハンドポンプ、着脱式フィン、コイルリーシュ、修理キットが付属します。一部のモデルにはカーボンパドルへのアップグレードオプションもあります。'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'セット割引はありますか？'
  answer: 'はい。単品で購入するよりもお得になる厳選セットをご用意しています。現在のセットプロモーションやボリュームディスカウントの価格については、営業チームまでお問い合わせください。'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'SUPにライフジャケットは必要ですか？'
  answer: 'はい。多くの地域では、SUPを含むすべての舟艇に法律でライフジャケットの携行が義務付けられています。義務でない場所でも、CE認証のライフジャケットは必須の安全装備です。水上では常に着用することをおすすめします。'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'SUPボードを登録する必要がありますか？'
  answer: '要件は地域によって異なります。ほとんどの地域では、動力のないSUPに登録は不要です。モーターを取り付ける予定がある場合は、現地の海事当局に具体的なルールをご確認ください。レジャー用パドルボードは通常、船舶登録の対象外です。'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'パンクはどう修理しますか？'
  answer: '破損箇所を清掃し、角を丸くカットしたパッチを用意し、PVC用接着剤を塗布して強く押し付け、空気を入れる前に24時間待ちます。afarerのボードには修理キットが付属しています。詳しい手順は、インフレータブル修理ガイドをご覧ください。'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'インフレータブルSUPはどう保管すればよいですか？'
  answer: '真水で洗い流し、完全に乾かし、空気を完全に抜き、ノーズからゆるく丸めて、キャリーバッグに入れて直射日光の当たらない涼しく乾燥した場所に保管してください。濡れたままや極端な温度下で保管しないでください。'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'インフレータブルとハードSUP、どちらにすべきですか？'
  answer: 'インフレータブルボードは持ち運びやすく、保管が簡単で、衝撃を吸収します。ハードボードは最高の剛性とスピードを提供します。ほとんどのレジャーユーザーには、ドロップスティッチコアを備えた質の高いインフレータブルが実用的な選択です。'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'SUPに危険な風速はどのくらいですか？'
  answer: '初心者：10 mph（8ノット）超。中級者：15 mph（13ノット）超。上級者：20 mph（17ノット）超。少しでも迷ったら出艇しないでください。沖向きの風（陸から海へ吹く風）は、レベルを問わず危険です。'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'afarerの保証内容は？'
  answer: 'すべてのafarer製品には、メーカー包括保証が付いています。SUPボードは製造上の欠陥に対し2年以上保証されます。保証は通常使用下での材料および仕上げの欠陥をカバーします。'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: '保証請求はどうすればよいですか？'
  answer: '注文番号、問題の写真、簡単な説明を添えてサポートチームにご連絡いただくことで、請求を提起できます。ほとんどの請求は2営業日以内に審査されます。承認された請求には、数日以内に交換または修理の案内が届きます。'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: '配送にはどれくらいかかりますか？'
  answer: '在庫のある注文は2–4営業日以内に発送されます。米国国内の注文は5–10営業日で、国際注文は宛先により10–15営業日で届きます。緊急のご注文は速急対応が可能です。'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: '返品ポリシーは？'
  answer: '未使用で元の包装のままの商品について、お届けから30日以内の返品を受け付けています。カスタム/OEM注文は返品不可です。返品を開始するにはサポートチームまでご連絡ください — 送料込みの返送ラベルをご提供します。'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'OEM/ODMサービスはありますか？'
  answer: 'はい。法人向けにプライベートレーベルおよびカスタムデザインのサービスを提供しています。既存モデルへのブランド入れから完全オーダーメイドのハルデザインまで、当社のエンジニアリングチームがあなたのブランドで製品を開発できます。最小注文数が適用されます。'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'どのパドルの長さが必要ですか？'
  answer: 'パドルは身長より6–8インチ長いものを選んでください。調整式パドルなら、条件に応じた微調整が可能です。詳しいサイズ選びはパドルガイドをご覧ください。'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'PVCとHypalonの違いは何ですか？'
  answer: 'PVCは軽量で手頃な価格であり、付属のパッチキットで簡単に修理できます。UV耐性コーティングを施したミリタリーグレードのPVCは、レジャー用SUPに最適な耐久性と重量のバランスを提供します。afarerはすべての製品グレードに3層ラミネートPVCを使用しています。'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: '安定性に最適なSUPの幅は？'
  answer: '初心者には33–34インチの幅が、安定性と漕ぎやすさの最良のバランスを提供します。32インチ未満のボードは初心者には不安定に感じられます。33インチ幅のafarer SUP Explorer 11は、学習に理想的です。'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: '体重に合わせたSUPの体積の選び方は？'
  answer: '初心者向けの目標体積を求めるには、体重（kg）に2.2を掛けます。たとえば75 kgのパドラーには最低165リットル必要ですが、学習には220–260リットルの方がはるかに安定します。SUP Explorer 11は260リットルで、100 kgまでのライダーに適しています。'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'afarerは他ブランドと比べてどうですか？'
  answer: 'afarerはインフレータブルウォータースポーツ用品で最高のコストパフォーマンスを提供します。Red Paddle Coと比べると、afarerは60%の価格で90%の性能を実現します。iRockerと比べると、afarerはより高グレードの3層ミリタリーグレードPVCとより高いPSI定格を採用しています。Bluefinと比べると、afarerは優れた素材スペックを提供します。ほとんどのレジャーパドラーにとって、afarerは品質と価格の最良のバランスです。'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - best-surf-gear-brands-compared
    - afarer-vs-red-paddle
    - afarer-vs-irocker
    - afarer-vs-bluefin
- id: fishing-sup-setup
  question: 'SUPボードから釣りはできますか？'
  answer: 'はい。SUPフィッシングは、立ち姿勢からの水中視認性の高さから人気が高まっています。安定性のために、少なくとも長さ11フィート・幅33–34インチのボードを選んでください。デッキのバンジーに固定したロッドホルダー付きボックス、小さなアンカーを追加し、必ずPFDを着用してください。afarer SUP Explorer 11はカジュアルな釣りに適しています。'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: 'SUPボードでヨガはできますか？'
  answer: 'もちろんです。SUPヨガは伝統的なポーズに浮遊プラットフォームという挑戦を組み合わせ、より深層の安定筋を活性化させます。幅33インチ以上の、柔らかくグリップ力のあるデッキパッドを備えたボードを使用してください。アンカーを付け、穏やかな浅瀬で練習しましょう。ダウンドッグ、戦士のポーズII、木のポーズなどの基礎ポーズから始めてください。フルEVAデッキパッドを備えたSUP Explorer 11が適しています。'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: 'インフレータブルSUPの持ち込みに関する航空会社のルールは？'
  answer: 'ほとんどの航空会社は、23–32 kg未満であればSUPバックパックを受託手荷物として受け入れます。afarerのバックパックは約90x40x30 cmで、詰めた状態で約15 kgです。航空会社によってはサイズ超過手荷物料金がかかる場合があります。時間に余裕を持って到着し、フィンとポンプは機内持ち込みに別包みにし、バッグに「壊れ物」と表示してください。ご搭乗前に、航空会社のスポーツ用具ポリシーを必ず確認してください。'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: '冷水パドリングに必要な安全装備は？'
  answer: '15°C未満の水温では熱的保護が必要です。8–14°Cではブーツ、グローブ、フード付きのウェットスーツまたはドライスーツを使用してください。14–20°Cでは3/2 mmのウェットスーツで十分です。熱的保護と安全のために、必ず体に合ったPFDを着用してください。義務装備については現地の規制をご確認ください。'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'OEM/ODMの最小注文数は？'
  answer: '最小注文数（MOQ）は製品の種類と複雑さによって異なります。既存モデルへのブランド入れは通常5–10個です。完全カスタムのハルデザインにはより高いMOQが必要です。ご要件を営業チームまでお送りいただければ、詳細な見積もりをご案内します。カスタムカラーやロゴから完全オリジナルの金型デザインまで、すべてに対応します。'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'afarer製品に自分のロゴを付けられますか？'
  answer: 'はい。当社のOEMサービスには、カスタムロゴ配置、カスタムカラースキーム、カスタムパッケージが含まれます。製品タイプに応じて、パッド印刷、熱転写、刺繍のオプションをご用意しています。アートワークと仕様を営業チームにお送りいただければ、見積もりとリードタイムの目安をご提示します。'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'SUPは何PSIまで膨らませればよいですか？'
  answer: '最高のパフォーマンスを得るには、ボードの定格最大PSIまで膨らませてください — 質の高いインフレータブルSUPでは通常15–18 PSIです。afarer SUP Explorer 11は15–18 PSIで最良の性能を発揮します。空気不足ではボードが柔らかく感じられ、直進性が低下します。定格を超える過充填はドロップスティッチの糸を傷つける恐れがあります。お使いのボードの定格は、バルブ近くのステッカーでご確認ください。'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide
- id: sup-deck-pad-care
  question: 'EVAデッキパッドの手入れ方法は？'
  answer: 'セッションごとにデッキパッドを真水で洗い流してください。汚れには、中性石鹸と柔らかいブラシを使用し — 強い薬品は避けてください。縁が浮いてきたら、防水マリン接着剤を少量塗り、重しを乗せて24時間押さえてください。パッドの劣化を防ぐため、使用しないときはボードを直射UVから遠ざけて保管してください。'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'SUPに座って漕ぐことはできますか？'
  answer: 'はい。afarer Explorer 11を含む多くのSUPボードには、シートを取り付けられるDリングがあります。座って漕ぐことは、長距離トリップや釣り、水上で姿勢を変えたいときに快適な選択肢です。'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: '海で使用した後、インフレータブルボードを洗う必要がありますか？'
  answer: 'はい — 海水に触れた後は必ず、ボード・フィン・ポンプ・パドルを真水で洗い流してください。塩の結晶はシームやバルブに入り込み、微小な漏れや腐食を引き起こします。空気を抜いて収納する前に、日陰でボードを乾かしてください。定期的な洗浄は、インフレータブルボードの寿命を大幅に延ばします。'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'SUPにリーシュは本当に必要ですか？'
  answer: 'はい — 常にリーシュを着用してください。SUP用のコイルリーシュは足首またはふくらはぎに装着し、転覆時にボードを手元に留めておきます。開水域では、リーシュは浮力装置から切り離されるのを防ぎ、命を救うことができます。川でのパドリングには、絡まりを防ぐクイックリリースリーシュを使用してください。'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: 'ドロップスティッチコア技術とは何ですか？また、なぜ重要ですか？'
  answer: 'ドロップスティッチコア技術は、PVCボードの上下層をつなぐ数千本のポリエステル糸を使用します。15-20 PSIに膨らませると、これらの糸がねじれに強い剛性構造を作り出し、ハードシェルボードのような性能を発揮します。afarerはすべてのSUP製品グレードにドロップスティッチラミネーションを施したミリタリーグレードの3層PVCを使用しており、インフレータブルの持ち運びやすさを保ちながら、エポキシボードに匹敵する剛性を実現しています。'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup
- id: sup-inflatable-vs-rigid
  question: 'インフレータブルとリジッドSUP：用途別にどちらが良いですか？'
  answer: 'インフレータブルSUPは持ち運び・保管・衝撃吸収に優れ — 旅行、初心者、レジャー利用に理想的です。リジッドのエポキシボードは、レースやサーフィンで最大のスピードとグライドを提供します。90%のパドラーにとって、ドロップスティッチコア（15-20 PSI）を備えた質の高いインフレータブルは、ツーリング、フィットネス、ヨガ、釣りに十分な剛性を提供します。afarerのインフレータブルボードは、ミッドレンジのハードボードに匹敵する性能を持ちながら、バックパックに収まります。'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-vs-hard-board
    - how-to-choose-inflatable-sup
- id: pvc-vs-hypalon-boats
  question: 'PVCとHypalonのインフレータブルボート：どちらの素材が良いですか？'
  answer: 'PVCはより軽く、手頃で、修理が容易で、ミリタリーグレードの配合を使用すればUV劣化にも強い素材です。Hypalon（CSM）は商用・軍用用途に優れた耐薬品性・耐摩耗性を持ちますが、より重く、高価で、修理も難しくなります。レジャーボーターには、UV耐性コーティングを施したafarerの3層ミリタリーグレードPVCが、重量・耐久性・コストの最良のバランスを提供します。最高の耐久性を必要とするプロ・商用オペレーターには、Hypalonをおすすめします。'
  category: product
  relatedProducts: []
  relatedGuides:
    - pvc-vs-hypalon-boats
    - how-long-inflatable-boats-last
- id: sup-skill-progression
  question: '初心者から上級者への典型的なSUP上達プロセスは？'
  answer: '初心者（セッション1-3）：立ち上がり、基本的なフォワードストローク、ターン、安全な転倒。中級者（セッション5-15）：効率的なストローク技術、ピボットターン、さざ波の航行、基本的なレスキュー技能。上級者（20セッション以上）：レーススタート、ブイターン、小波のサーフィン、ダウンウィンドパドリング。プロ：競技レース、サーフSUP、長距離ツーリング。afarerのボードはあらゆる段階をサポートします：初心者にExplorer 11、ツーリングにOcean Voyager、ハイパフォーマンスパドリングにCheetah Surge。'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-cheetah-surge
  relatedGuides:

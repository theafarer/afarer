- id: b2b-factory-audit
  question: '工場を見学したり、第三者監査を手配できますか？'
  answer: '工場見学はアポイント制で歓迎しています。年間を通じてブランドオーナーを受け入れており、青島膠東国際空港（TAO）からの送迎を手配できます。訪問が難しいバイヤーには：ビデオ通話によるバーチャル工場ツアー、SGS/Bureau Veritasとの第三者監査の手配（監査費用はバイヤー負担）、設備リスト・QCプロセスフロー・人員資格を含む詳細な工場能力資料パッケージをご提供します。'
  category: b2b

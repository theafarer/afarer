    - wind-conditions-sup
- id: sup-sustainability
  question: 'インフレータブルSUPボードは環境にやさしいですか？'
  answer: 'インフレータブルSUPはいくつかの点でリジッドボードより環境負荷が小さいです：製造に必要な原材料が少なく、軽量のため輸送排出が削減され、耐久性があるため交換頻度が下がります。afarerボードに使用されるPVCはノン鉛でREACH準拠です。持続可能性の重要な実践：5-10年持つ質の高いボードを購入する、パンクは交換せず修理する、寿命の尽きたボードはPVCリサイクルの専門プログラムを通じてリサイクルする、再利用可能なキャリーバッグを使うブランドを選び使い捨て包装を避けることです。'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: 'OEM/ODMによるSUP生産の最小注文数は？'
  answer: '最小注文数（MOQ）は製品タイプにより異なります。在庫モデルへのカスタムブランド：SKUごとに50個。カスタム形状の金型開発：モデルごとに200–500個（初回注文）。金型共有プログラムは50個から利用可能。Hypalonボート生産：サイズにより20–50個。アクセサリーとPFD：デザインごとに500–1000個。予想ボリュームをOEMチームまでお知らせいただければ、正確なMOQと価格をご案内します。'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'OEM SUP注文の典型的なリードタイムは？'
  answer: '既存金型へのカスタムブランドを含む初回OEM注文：デポジットからFOB Qingdaoまで6–8週間。新しい金型が必要なカスタム形状注文：12–20週間（3Dデザイン、金型製作、プロトタイピング、大量生産を含む）。承認済み仕様のリピート注文：6–8週間。緊急注文は既存金型なら4–5週間に短縮可能です。リードタイムには原材料調達、生産、ライン内QC、コンテナ積み込みが含まれます。'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'afarer OEM製品はどんな認証を取得していますか？'
  answer: 'すべてのafarer OEM/ODM製品が持つ認証：CE適合宣言書（EU市場）、UKCA（英国市場）、ISO 9001:2015品質マネジメントシステム、BSCI社会的コンプライアンス監査、REACHおよびRoHS素材コンプライアンス、インフレータブルボートのEN ISO 25649分類。追加認証はリクエストに応じ対応：米国沿岸警備隊（US Coast Guard）準拠書類、軍用規格試験（MIL-STD-810）、仕向国の輸入認証サポート。'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: '大量生産前にサンプルを注文できますか？'
  answer: 'はい。サンプル注文はすべてのOEM/ODMプロジェクトで利用可能です。生産前サンプル（PPS）は金型製作後、大量生産前に製造されます。サンプルのリードタイム：既存金型で15–25営業日、カスタム金型で25–40営業日。サンプル費用は初回の大量注文から差し引かれます。サンプルは追跡付きの国際速達（DHL、FedEx、UPS）で発送され、通常3–5営業日で到着します。'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'OEM注文で利用できる支払条件は？'
  answer: '標準の支払条件：署名済みPI（プロフォーマインボイス）にて30%のデポジット、船積み前にB/L（船荷証券）写しに対して70%の残金。初回パートナー：50%デポジット、50%を船積み前。取引実績のあるパートナー：一覧払いL/C、または条件を満たすアカウント向けのネット30日（与信審査による）。支払方法：T/T電信送金、L/C（letter of credit）、Western Union。すべての支払いはUSDまたはEUR建てです。'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'afarerは私の知的財産とデザインをどう保護しますか？'
  answer: 'IP保護は当社OEMサービスの中核です。デザインについて話し合う前にNDAを締結します。デザインファイルはアクセスログ付きの隔離されたワークステーションで管理されます。すべての金型はお客様の専有財産のままです（お客様負担）。お客様の金型やデザインを他のクライアントに再使用することはありません。アクティブなアカウントには金型の保管・メンテナンスが含まれます。契約終了時、金型はお客様へ発送するか、ビデオ記録付きで廃棄します。商標権・特許権をすべて尊重します。'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'どのような輸送・物流オプションがありますか？'
  answer: 'FOB Qingdao（標準）：貨物は青島港で積み込まれ、以降の輸送はお客様の手配です。CIF（指定港）：目的地港までの輸送と保険を当社が手配します。DDP / ドアツードア：通関手続きと最終配達を含むフルサービス物流。米国西海岸への海上輸送：約25–30日。EU（ハンブルク/ロッテルダム）への海上輸送：約30–35日。緊急注文には航空輸送も利用可能（3–5日）。輸出通関書類、原産地証明書、パッキングリストはすべて当社が手配します。'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'OEM注文にはどのような品質管理プロセスが適用されますか？'
  answer: 'すべてのOEM注文は文書化されたQC計画に従います：1)受入材料検査 — PVC生地の厚さ・引張強度・UV耐性のバッチ試験。2)工程内QC — 50個ごとの溶接強度試験、定格PSIの1.5倍での圧力保持試験。3)最終検査 — 全ボードの100%外観検査と圧力試験。4)AQLサンプリング — ISO 2859に基づくロットサンプリングで、致命的欠陥＝0の合格基準。5)第三者検査 — SGS、Bureau Veritas、Intertekを買い手負担で利用可能。'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: '私のブランド向けにカスタムパッケージを作れますか？'
  answer: 'はい。フルカラーCMYK印刷とブランドグラフィックを施したリテールボックス、シルクスクリーンまたは刺繍ロゴ入りキャリーバッグ、お客様の言語での取扱説明書、タグやバーコード/UPCラベル、内装（ポリ袋、フォームインサート）など、フルカスタムパッケージサービスを提供しています。パッケージの最低MOQ：カスタム箱500–1000個、キャリーバッグ200–500個。パッケージデザインサービスはOEM注文に含まれます。'
  category: b2b

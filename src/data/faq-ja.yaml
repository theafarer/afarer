    - inflatable-sup-repair
- id: sup-choppy-water
  question: 'さざ波や風の中でSUPを漕ぐ方法は？'
  answer: 'さざ波の中では：膝を曲げ、スタンスを広めに取り、ストロークを短くし、バランスのために体幹を働かせてください。向かい風では：パドル角度を低くし、短いストロークで前傾姿勢に。横風では：流されを修正するため風上側で漕いでください。追い風では：うねりに乗ってスピードを稼げます。初心者は風速10 mph超を避け、安定性のために幅広で長いボードを選んでください。afarerのツーリングSUP Ocean Voyagerは、穏やかなさざ波と風の条件に対応できるよう設計されています。'
  category: safety
  relatedProducts:

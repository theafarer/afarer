- id: sup-weight-capacity
  question: 'インフレータブルSUPボードはどれくらいの重量に耐えられますか？'
  answer: '耐荷重はボードの体積によって異なります。afarerボード：SUP Explorer 11（260 L、最大100 kg / 220ポンド）、Ocean Voyager 12（310 L、最大140 kg / 308ポンド）、Leviathan Wake（350 L、最大180 kg / 396ポンド）。最適なパフォーマンスのために、総荷重（ライダー＋装備）は最大容量の80%以内に収めてください。過積載しないボードは、特に波のある条件下で、より高く浮き、より直進性が高まります。'

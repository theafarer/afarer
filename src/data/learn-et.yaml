misc:
  readGuide: Loe juhendit →
  techDesc: Mereohutuse inseneritöö ja materjalide testimine
  productsDesc: Tutvu afareri täieliku tootekataloogiga
  trustDesc: CE-, ISO- ja BSCI-vastavus
sup:
  title: SUP-i teadmised — täispuhutavate SUP-ide juhendid ja ressursid | Afarer
  description: Täielik SUP-i teadmusbaas, hõlmates algajate juhendeid, lauamõõte, tehnilisi õpetusi, ohutusnippe ja täispuhutava SUP-i tehnoloogiat.
  articles:
    - title: SUP-i alused — algaja juhend
      desc: Kõik, mida algaja teada peab — lauatüübid, aadri mõõt, seisuasend ja esimese päeva nõuanded.
      href: /learn/sup/
    - title: SUP-i mõõdute juhend
      desc: Leia enda kaalule, oskustasemele ja sõudmisstiilile sobiv lauapikkus, -laius ja maht.
      href: /size-guide/
    - title: Täispuhutav või kõva laud
      desc: 'Kumb sobib sinule? Võrdluses: kaasaskantavus, jõudlus, vastupidavus ja hind.'
      href: /compare/inflatable-vs-hardboard/
    - title: Kesktaseme tehnikad
      desc: 'Viia oma sõudmine uuele tasemele: täiustatud aadritõmbed, pööramistehnikad ja toimetulek lainelises vees.'
      href: /learn/intermediate-techniques/
    - title: Kuidas valida täispuhutavat SUP-i
      desc: Orienteeru põhitegurites — konstruktsioon, paksus, uimede paigutus ja kaasasolevad tarvikud.
      href: /v2/how-to-choose-inflatable-sup/
    - title: Veeohutus
      desc: Hädavajalik ohutusteave, sealhulgas ilma lugemine, PFD-i valik, isepääste ja rühmasõudmine.
      href: /learn/water-safety/
water-safety:
  title: Veeohutuse teadmised — ohutu sõudmise juhendid | Afarer
  description: Põhjalikud veeohutuse ressursid SUP-iks, kajakisõiduks ja paadisõiduks. Teave PFD-i valiku, ilma lugemise, isepääste, külma vee ohutuse ja CE-sertifitseerimise kohta.
  articles:
    - title: Veeohutuse juhend
      desc: Hädavajalik ohutusteave iga sõudja jaoks — ilm, PFD-id, isepääste ja rühmasõudmise protokollid.
      href: /learn/water-safety/
    - title: Päästevesti ja PFD-i juhend
      desc: Kuidas valida õige isiklik ujuvusvahend SUP-iks, kajakisõiduks, paadisõiduks ja professionaalseks kasutamiseks.
      href: /v2/life-jacket-buying-guide/
    - title: SUP-i ohutusnimekiri
      desc: Ohutusnimekiri enne vettelaskmist, mida iga SUP-sõudja peaks enne vette minekut järgima.
      href: /v2/sup-safety-guide/
    - title: Ohutus külmas vees sõudmisel
      desc: Hädavajalikud ettevaatusabinõud, varustus ja tehnikad külmas vees sõudmiseks.
      href: /v2/cold-water-safety-guide/
    - title: Algajate sõudmisvead
      desc: Levinud vead, mida esmakordsed sõudjad teevad, ja kuidas neid vältida turvalisema ja nauditavama kogemuse nimel.
      href: /v2/beginner-sup-guide/
    - title: Mida tähendab CE-sertifitseerimine
      desc: Mida tähendab CE-sertifitseerimine täispuhutavate SUP-laudade puhul — standardid, testimine ja miks on see ohutuse jaoks oluline.
      href: /trust/
sup-basics:
  title: SUP-i alused — algaja juhend SUP-sõudmiseks
  description: Kõik, mida on vaja teada SUP-sõudmise alustamiseks. Varustuse juhendid, mõõdunõuanded, ohutusnipid ja algajate tehnikad afareri teadmiste keskusest.
  articles: []
drop-stitch-core:
  title: Drop-stitch-tuumtehnoloogia — kuidas täispuhutavad SUP-id saavutavad jäikuse
  description: 'Süvauurus drop-stitch-konstruktsiooni tehnoloogiasse: kuidas tuhanded polüesterlõimed loovad rõhul 15-25 PSI jäigad täispuhutavad platvormid. Lõimetihedus, kanga sidumine, tootmisprotsess ja jõudlusvõrdlused.'
  articles: []
inflatable-technology:
  title: Täispuhutava SUP-i tehnoloogia — materjalid, konstruktsioon ja inseneritöö
  description: Kuidas täispuhutavaid SUP-laudu ehitatakse — materjalikihtide paigutus, drop-stitch-tuumad, klapisüsteemid, RF-keevitus ja kvaliteeditestid. Mõista, mis teeb täispuhutavast lauast vastupidava ja suure jõudlusega.
  articles: []
intermediate-techniques:
  title: Kesktaseme SUP-i ja kajakitehnikad — enam kui algtõed
  description: 'Tõsta oma sõudmisoskus uuele tasemele: täiustatud aadritõmbed, toimetulek lainelise veega, tuulega arvestamine, isepäästetehnikad ja rühmasõudmise kombed. Sõudjatele, kes on valmis algaja oskustest edasi liikuma.'
  articles: []
materials:
  title: Täispuhutava SUP-i materjalid — PVC, EVA ja drop-stitch-kangas
  description: 'Põhjalik juhend täispuhutavate SUP-laudade tootmises kasutatavate materjalide kohta: sõjaväeklassi PVC, EVA-vahttekk, drop-stitch-kangas, süsinikkiud ja alumiiniumsulamid. Spetsifikatsioonid, kasutusalad ja valikukriteeriumid.'
  articles: []
safety-in-water-sports:
  title: Veespordi ohutus — põhiteadmised sõudjatele
  description: Hädavajalik ohutusteave iga sõudja jaoks — ilma lugemine, PFD-i valik, isepääste ja rühmasõudmise protokollid.
  articles: []
sup-size-guide:
  title: SUP-i mõõtude juhend — kuidas valida õige lauapikkus, -laius ja maht
  description: Põhjalik SUP-i mõõtude juhend, mis hõlmab lauapikkust, -laiust, -paksust, mahtu (liitrites) ja sõitja kaalu sobitamist. Leia õige täispuhutava SUP-i suurus vastavalt oma kaalule, oskustasemele ja sõudmistegevusele.
  articles: []

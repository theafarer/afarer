- id: sup-learning
  question: 'Is SUP moeilijk te leren?'
  answer: 'Helemaal niet. De meeste beginners staan binnen hun eerste sessie al rechtop en paddelen. Onze All-Around SUP-serie heeft extra brede, stabiele platforms die speciaal zijn ontworpen voor wie voor het eerst paddelt. Begin op rustig water en u vaart binnen enkele minuten comfortabel rond.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Kan ik het in de zee gebruiken?'
  answer: 'Ja. afarer SUP-boards zijn gebouwd voor gebruik in zee, meren en rivieren. Onze Touring-serie houdt kustgolven aan, en alle boards gebruiken PVC van maritieme kwaliteit dat bestand is tegen corrosie door zout water. Spoel na gebruik in zee na met zoet water.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Hoe lang duurt het opblazen?'
  answer: 'Met de meegeleverde dubbelwerkende pomp blaast u de meeste boards in minder dan 5 minuten op tot 12–15 PSI. Met onze elektrische pomp duurt dat minder dan 2 minuten. Laten leeglopen en inpakken kost ongeveer 3 minuten.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Kan ik reizen met een opblaasbaar SUP?'
  answer: 'Zeker. Elk afarer-board past in een draagtas ter grootte van een rugzak die voldoet aan de bagage-eisen van luchtvaartmaatschappijen. Met slechts 18–22 pond is het eenvoudig mee te nemen naar het strand, het meer of door luchthaventerminals.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Wat is het maximumgewicht?'
  answer: 'Onze All-Around SUP-boards dragen tot 220 pond. De Touring- en Yoga-serie dragen tot 250 pond. Voor gebruik met twee personen of zwaardere lading kunt u ons team om advies vragen.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Wat zit er in de doos?'
  answer: 'Elke afarer-SUP bevat het board, een reis-rugzak, een dubbelwerkende handpomp, een losse vin, een spiraalleash en een reparatieset. Sommige modellen bieden ook de optie van een carbon paddle.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Zijn er bundelaanbiedingen beschikbaar?'
  answer: 'Ja. Wij stellen doordachte bundels samen waarmee u geld bespaart ten opzichte van losse aankopen. Neem contact op met ons verkoopteam voor actuele bundelacties en volumekortingen.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Heb ik een reddingsvest nodig op een SUP?'
  answer: 'Ja. In veel rechtsgebieden is een reddingsvest wettelijk verplicht op elk vaartuig, inclusief SUP-boards. Ook waar het niet verplicht is, is een CE-gecertificeerd reddingsvest essentiële veiligheidsuitrusting. Wij raden aan het altijd te dragen op het water.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Moet ik mijn SUP-board registreren?'
  answer: "De eisen verschillen per rechtsgebied. In de meeste regio's hoeven SUP-boards zonder motor niet te worden geregistreerd. Als u een motor wilt toevoegen, controleer dan de specifieke regels bij uw lokale scheepvaartautoriteit. Recreatieve paddle-boards zijn over het algemeen vrijgesteld van scheepsregistratie."
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Hoe repareer ik een lek?'
  answer: 'Maak het gebied schoon, knip een patch met afgeronde hoeken, breng PVC-lijm aan, druk stevig aan en wacht 24 uur voordat u het board oppompt. afarer-boards worden geleverd met een reparatieset. Gedetailleerde instructies vindt u in onze reparatiegids voor opblaasbare boards.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Hoe moet ik mijn opblaasbare SUP bewaren?'
  answer: 'Spoel na met zoet water, laat volledig drogen, laat alle lucht eruit, rol losjes op vanaf de neus en bewaar het board in de draagtas op een koele, droge plek uit de directe zon. Bewaar het nooit vochtig of bij extreme temperaturen.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Opblaasbaar of hard SUP-board?'
  answer: 'Opblaasbare boards bieden draagbaarheid, gemakkelijke opslag en schokabsorptie. Harde boards bieden maximale stijfheid en snelheid. Voor de meeste recreatieve gebruikers is een kwaliteitsboard met drop-stitch kern de praktische keuze.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Bij welke windsnelheid is SUP te gevaarlijk?'
  answer: 'Beginners: boven 10 mph (8 knopen). Gevorderden: boven 15 mph (13 knopen). Experts: boven 20 mph (17 knopen). Twijfelt u, ga dan niet het water op. Wind van land naar zee is gevaarlijk op elk niveau.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Wat is de garantie van afarer?'
  answer: 'Alle afarer-producten worden gedekt door een uitgebreide fabrikantengarantie. SUP-boards vallen onder een garantie van 2 jaar of langer tegen fabricagefouten. De garantie dekt fouten in materiaal en afwerking bij normaal gebruik.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Hoe dien ik een garantieclaim in?'
  answer: "Dien een claim in door contact op te nemen met ons supportteam met uw ordernummer, foto's van het probleem en een korte omschrijving. De meeste claims worden binnen 2 werkdagen beoordeeld. Goedgekeurde claims ontvangen binnen enkele dagen een vervangend product of reparatie-instructies."
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Hoe lang duurt de verzending?'
  answer: 'Bestellingen uit voorraad worden binnen 2–4 werkdagen verzonden. Bestellingen binnen de VS arriveren binnen 5–10 werkdagen. Internationale bestellingen arriveren binnen 10–15 werkdagen, afhankelijk van de bestemming. Dringende bestellingen kunnen worden versneld.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Wat is uw retourbeleid?'
  answer: 'Wij accepteren retour binnen 30 dagen na levering voor ongebruikte producten in de originele verpakking. Custom-/OEM-bestellingen zijn niet retourneerbaar. Neem contact op met ons supportteam om een retour te starten — wij verstrekken een vooruitbetaald verzendlabel.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Zijn er OEM/ODM-diensten beschikbaar?'
  answer: 'Ja. Wij bieden private label- en maatontwerpdiensten aan voor bedrijven. Van custom branding op bestaande modellen tot volledig op maat ontworpen rompen — ons engineeringteam kan producten ontwikkelen onder uw merk. Er gelden minimale bestelhoeveelheden.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Welke paddle-lengte heb ik nodig?'
  answer: 'De paddle moet 6–8 inch langer zijn dan uw lengte. Verstelbare paddles maken fijnafstelling mogelijk voor verschillende omstandigheden. Zie onze paddle-gids voor gedetailleerde maten.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Wat is het verschil tussen PVC en Hypalon?'
  answer: 'PVC is licht, betaalbaar en eenvoudig te repareren met de meegeleverde patchset. PVC van militaire kwaliteit met UV-bestendige coating biedt de beste balans tussen duurzaamheid en gewicht voor recreatief SUP-gebruik. afarer gebruikt drielagig gelamineerd PVC in alle productlijnen.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Welke SUP-breedte is het beste voor stabiliteit?'
  answer: 'Voor beginners biedt een breedte van 33–34 inch de beste balans tussen stabiliteit en paddelgemak. Boards smaller dan 32 inch voelen wankel voor nieuwe paddelaars. De afarer SUP Explorer 11 met een breedte van 33 inch is ideaal om te leren.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Hoe kies ik SUP-volume op basis van mijn gewicht?'
  answer: 'Vermenigvuldig uw gewicht in kg met 2,2 voor een beginnersvriendelijk volumeniveau. Een paddelaar van 75 kg heeft bijvoorbeeld minimaal 165 liter nodig, maar 220–260 liter is veel stabieler om op te leren. De SUP Explorer 11 biedt 260 liter en is geschikt voor rijders tot 100 kg.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'Hoe verhoudt afarer zich tot andere merken?'
  answer: 'afarer biedt de beste prijs-kwaliteitverhouding in opblaasbaar watersportmateriaal. Vergeleken met Red Paddle Co levert afarer 90% van de prestaties voor 60% van de kosten. Vergeleken met iRocker gebruikt afarer hoogwaardiger drielags militair PVC en hogere PSI-waarden. Vergeleken met Bluefin biedt afarer superieure materiaalspecificaties. Voor de meeste recreatieve paddelaars biedt afarer de beste balans tussen kwaliteit en prijs.'
  category: general
  relatedProducts:

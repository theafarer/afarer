- id: sup-oem-process
  question: 'Какъв е OEM производственият процес за надуваеми SUP с частна марка?'
  answer: 'OEM процесът: 1) Спецификация и дизайнерско задание — споделете целеви спецификации, CAD чертежи или референтен продукт. 2) 3D прототипиране с калъпи — персонализирани алуминиеви и композитни калъпи, проектирани на място. 3) Избор на материали и мостра — военнокласово PVC с персонализирани цветове и поставяне на лого. 4) CE одит на фабриката и съответствие — всяка поръчка включва CE декларация, ISO 9001 проследимост, BSCI доклад. 5) Масово производство с 100-точков QC чеклист. 6) Експедиция FOB Qingdao с пълна експортна документация. Срок за изпълнение 30-45 дни, MOQ 50 броя (стандартен SUP).'
  category: ordering

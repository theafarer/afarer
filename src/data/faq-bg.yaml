- id: sup-weight-capacity
  question: 'Колко тегло може да издържи надуваемата SUP дъска?'
  answer: 'Товароносимостта варира според обема на дъската. afarer дъски: SUP Explorer 11 (260L, до 100 кг / 220 lbs), Ocean Voyager 12 (310L, до 140 кг / 308 lbs), Leviathan Wake (350L, до 180 кг / 396 lbs). За оптимално представяне дръжте общото натоварване (карач плюс екип) в рамките на 80% от максималния капацитет. Дъската стои по-високо във водата и се управлява по-добре, когато не е претоварена, особено при вълни.'
  category: product
  relatedProducts:

- id: sup-choppy-water
  question: 'Как да греба на SUP при вълни или вятър?'
  answer: 'При вълни: свийте коленете, използвайте по-широка стойка, съкратете гребъка и ангажирайте коремните мускули за баланс. При насрещен вятър: използвайте по-нисък ъгъл на греблото, правете по-къси гребки и се наведете напред. При страничен вятър: гребайте от наветрената страна, за да коригирате отклонението. При попътен вятър: сърфирайте вълните за скорост. Начинаещите трябва да избягват ветрове над 10 mph и да избират по-широки и по-дълги дъски за стабилност. afarer Ocean Voyager туринг SUP е проектирана да се справя с умерени вълни и ветровити условия.'
  category: safety
  relatedProducts:
    - sup-ocean-voyager
    - sup-explorer-11
  relatedGuides:
    - weather-conditions
    - sup-safety-guide
    - wind-conditions-sup
- id: sup-sustainability
  question: 'Надуваемите SUP дъски екологично устойчиви ли са?'
  answer: 'Надуваемите SUP имат по-нисък екологичен отпечатък от твърдите дъски по няколко начина: използват по-малко суровини при производството, по-ниското им тегло намалява емисиите от транспорта, а издръжливостта им означава по-малко замени във времето. PVC в дъските afarer е без олово и съответства на REACH. Ключови практики за устойчивост: купете качествена дъска, която издържа 5-10 години, ремонтвайте пробивите вместо да сменяте дъската, рециклирайте дъската в края на живота й чрез специализирани програми за рециклиране на PVC и избягвайте еднократните опаковки, като избирате марки с торби за многократна употреба.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: 'Какво е минималното количество за поръчка при OEM/ODM SUP производство?'
  answer: 'Минималните количества за поръчка (MOQ) варират според типа продукт. Персонализирано брандиране на складови модели: 50 броя на SKU. Разработка на калъпи с индивидуална форма: 200–500 броя на модел (първа поръчка). Програми за споделяне на калъпи от 50 броя. Аксесоари и спасителни жилетки: 500–1000 броя на дизайн. Свържете се с нашия OEM екип с очаквания от вас обем за точни MOQ и цени.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Какви са типичните срокове за изпълнение на OEM SUP поръчки?'
  answer: 'Първи OEM поръчки с персонализирано брандиране върху съществуващи калъпи: 6–8 седмици от депозита до FOB Qingdao. Поръчки с индивидуална форма, изискващи нови калъпи: 12–20 седмици (включва 3D дизайн, изработка на калъпи, прототипиране и масово производство). Повторни поръчки с одобрени спецификации: 6–8 седмици. Спешните поръчки могат да се съкратят до 4–5 седмици за съществуващи калъпи. Сроковете включват доставката на суровини, производството, процесния контрол и товаренето на контейнери.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Какви сертификати носят afarer OEM продуктите?'
  answer: 'Всички afarer OEM/ODM продукти носят: CE декларация за съответствие (пазар на ЕС), UKCA (пазар на UK), система за управление на качеството ISO 9001:2015, BSCI одит за социално съответствие, съответствие на материалите с REACH и RoHS, класификация EN ISO 25649 за надуваеми SUP дъски. Допълнителни сертификати при заявка: документация за съответствие с изискванията на US Coast Guard, тестове по военни стандарти (MIL-STD-810) и поддръжка при сертифициране на вноса за съответната дестинация.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Мога ли да поръчам мостри, преди да ангажирам масово производство?'
  answer: 'Да. Поръчки за мостри са налични за всички OEM/ODM проекти. Предпризводствените мостри (PPS) се изготвят след изработката на калъпа и преди масовото производство. Срок за мостри: 15–25 работни дни за съществуващи калъпи, 25–40 работни дни за индивидуални калъпи. Разходите за мостри се приспадат от първата масова поръчка. Мострите се изпращат чрез експресна куриерска служба (DHL, FedEx, UPS) с пълно проследяване и обикновено пристигат за 3–5 работни дни.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'Какви условия за плащане са налични за OEM поръчки?'
  answer: 'Стандартни условия за плащане: 30% депозит с подписан PI (проформа фактура), 70% остатък преди изпращане срещу копие на коносамент (B/L). За нови партньори: 50% депозит, 50% преди изпращане. За установени партньори с история на поръчките: L/C at sight или плащане до 30 дни нетно за сметки, отговарящи на условията (при кредитен преглед). Методи за плащане: T/T банков превод, L/C (акредитив), Western Union. Всички плащания се извършват в USD или EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Как afarer защитава моята интелектуална собственост и дизайни?'
  answer: 'Защитата на интелектуалната собственост е основна част от нашата OEM услуга. Подписваме споразумения за неразкриване (NDA) преди всяко обсъждане на дизайна. Дизайнерските файлове се обработват на изолирани работни станции с регистриране на достъпа. Всички инструменти и калъпи остават ваша изключителна собственост (платени от вас). Няма да използваме повторно вашите калъпи или дизайни за други клиенти. Съхранението и поддръжката на калъпите са включени за активни сметки. При прекратяване на споразумението калъпите се изпращат при вас или се унищожават с видео документация. Уважаваме всички права върху търговски марки и патенти.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Какви опции за транспорт и логистика са налични?'
  answer: 'FOB Qingdao (стандартно): товарът се товари в пристанище Qingdao; оттам вие организирате транспорта. CIF (посочено пристанище): ние организираме и застраховаме превоза до вашето пристанище на дестинация. DDP / от врата до врата: пълна логистична услуга, включваща митническо оформяне и крайна доставка. Морски транспорт до западното крайбрежие на САЩ: около 25–30 дни. Морски транспорт до ЕС (Хамбург/Ротердам): около 30–35 дни. Въздушен транспорт е наличен за спешни поръчки (3–5 дни). Ние обработваме цялата експортна митническа документация, сертификатите за произход и товарителните списъци.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Какви процеси за контрол на качеството се прилагат към OEM поръчките?'
  answer: 'Всяка OEM поръчка следва документиран план за контрол на качеството: 1) Входяща инспекция на материалите — тестване на партидите PVC тъкан за дебелина, якост на опън и UV устойчивост. 2) Процесен контрол — тест на якостта на заварките на шевовете на всеки 50 броя, тест на задържане на налягане при 1.25x номинално PSI. 3) Финална инспекция — 100% визуална проверка и тестване на налягането на всяка дъска. 4) AQL извадкова проверка — извадка от партидата съгласно ISO 2859 с нулева допустимост на критични дефекти. 5) Инспекция от трета страна — SGS, Bureau Veritas или Intertek при разход за сметка на купувача.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Можете ли да създадете персонализирана опаковка за моята марка?'
  answer: 'Да. Предлагаме пълни услуги за персонализирана опаковка: търговски кутии с пълноцветен CMYK печат и брандова графика, торби за пренасяне със сериографски или бродирани лого, ръководства за употреба на вашия език, етикети с баркод/UPC, както и вътрешна опаковка (полиетиленови торби, пянени поставки). Минимални количества за опаковка: 500–1000 броя за персонализирани кутии, 200–500 за торби за пренасяне. Услугата за дизайн на опаковката е включена в OEM поръчките.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Мога ли да посетя фабриката или да организирам одит от трета страна?'
  answer: 'Посещенията на фабриката са добре дошли с предварителна уговорка. Приемаме собственици на марки през цялата година и можем да организираме посрещане от летище Qingdao Jiaodong International (TAO). За купувачи, които не могат да посетят, предлагаме: виртуално обикаляне на фабриката чрез видео разговор, координация на одит от трета страна със SGS/Bureau Veritas (купувачът поема разходите за одита) и подробен пакет документация за възможностите на фабриката, включващ списък с оборудването, процеса на контрол на качеството и квалификациите на персонала.'
  category: b2b

- id: sup-learning
  question: 'Трудно ли се учи SUP?'
  answer: 'Съвсем не. Повечето начинаещи застават изправени и гребат още в рамките на първата си сесия. Нашата серия All-Around SUP разполага с екстра широки и стабилни платформи, проектирани специално за хора, които карат за пръв път. Започнете на спокойна вода и след минути ще се придвижвате уверено.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Мога ли да я използвам в океана?'
  answer: 'Да. afarer SUP дъските са създадени за използване в океан, езера и реки. Нашата серия Touring се справя с крайбрежните вълни, а всички дъски използват PVC с морска класация, което устоява на корозия от солена вода. Изплакнете със сладка вода след използване в океана.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Колко време отнема надуването?'
  answer: 'С включената двустепенна помпа повечето дъски се надуват до 12–15 PSI за по-малко от 5 минути. Опцията с електрическа помпа съкращава това време до под 2 минути. Издуването и опаковането отнемат около 3 минути.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Мога ли да пътувам с надуваема SUP дъска?'
  answer: 'Разбира се. Всяка afarer дъска се опакова в калъф с размерите на раница, който отговаря на изискванията за авиобагаж. С тегло едва 18–22 lbs тя се носи лесно до плажа, езерото или през летищните терминали.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Какъв е тегловният лимит?'
  answer: 'Нашите All-Around SUP дъски издържат до 220 lbs. Сериите Touring и Yoga издържат до 250 lbs. За каране по двойки или за по-тежки товари се свържете с нашия екип за препоръки.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Какво се съдържа в кутията?'
  answer: 'Всяка afarer SUP включва дъската, транспортна раница, двустепенна ръчна помпа, сменяемо перо, навита каишка и ремонтен комплект. Някои модели предлагат и опция за надграждане с въглеродно гребло.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Предлагате ли пакетни оферти?'
  answer: 'Да. Предлагаме подбрани пакети, които ви спестяват средства в сравнение с отделното закупуване на артикулите. Свържете се с нашия търговски екип за актуални пакетни промоции и цени с отстъпки за количество.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Нуждае ли ми се спасителна жилетка на SUP?'
  answer: 'Да. В много юрисдикции законът изисква спасителна жилетка на всяко плавателно средство, включително SUP. Дори там, където не е задължителна, жилетката с CE сертификат е основен екип за безопасност. Препоръчваме да я носите през цялото време на водата.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Трябва ли да регистрирам SUP дъската си?'
  answer: 'Изискванията варират според юрисдикцията. В повечето региони SUP без двигател не подлежи на регистрация. Ако планирате да добавите мотор, проверете конкретните правила при местния морски орган. Дъските за отдих и развлечение по принцип са освободени от регистрация като плавателни средства.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Как да поправя пробив?'
  answer: 'Почистете зоната, изрежете пластир със заоблени ъгли, нанесете PVC лепило, притиснете здраво и изчакайте 24 часа преди надуване. Дъските afarer включват ремонтен комплект. Подробни инструкции ще намерите в нашето ръководство за ремонт на надуваеми дъски.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Как да съхранявам надуваемата си SUP дъска?'
  answer: 'Изплакнете със сладка вода, подсушете напълно, издуйте докрай, навийте свободно от носа и съхранявайте в торбата за пренасяне на хладно и сухо място, далеч от директна слънчева светлина. Никога не съхранявайте дъската мокра или при екстремни температури.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Надуваема или твърда SUP дъска?'
  answer: 'Надуваемите дъски предлагат преносимост, удобно съхранение и поглъщане на удари. Твърдите дъски осигуряват максимална коравина и скорост. За повечето хора, каращи за удоволствие, качествената надуваема дъска с drop-stitch тяло е практичният избор.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Каква скорост на вятъра е твърде висока за SUP?'
  answer: 'За начинаещи: над 10 mph (8 възела). За средно напреднали: над 15 mph (13 възела). За напреднали: над 20 mph (17 възела). Ако се съмнявате, не излизайте на вода. Бреговият вятър (който духа от сушата към морето) е опасен на всяко ниво на умение.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Каква е гаранцията на afarer?'
  answer: 'Всички продукти afarer са подкрепени от изчерпателна производствена гаранция. SUP дъските са покрити за 2+ години срещу производствени дефекти. Гаранцията покрива дефекти в материалите и изработката при нормална употреба.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Как да подам гаранционна претенция?'
  answer: 'Подайте претенция, като се свържете с нашия екип за поддръжка и предоставите номера на поръчката си, снимки на проблема и кратко описание. Повечето претенции се разглеждат в рамките на 2 работни дни. При одобрени претенции замяна или инструкции за ремонт следват в рамките на дни.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Колко време отнема доставката?'
  answer: 'Поръчки от наличност се изпращат в рамките на 2–4 работни дни. Поръчки в САЩ пристигат за 5–10 работни дни. Международните поръчки пристигат за 10–15 работни дни в зависимост от дестинацията. Спешните поръчки могат да бъдат ускорени.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Каква е вашата политика за връщане?'
  answer: 'Приемаме връщания в рамките на 30 дни от доставката за неизползвани продукти в оригинална опаковка. Персонализираните/OEM поръчки не подлежат на връщане. Свържете се с нашия екип за поддръжка, за да инициирате връщане — предоставяме предварително платен транспортен етикет.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Предлагате ли OEM/ODM услуги?'
  answer: 'Да. Предлагаме услуги за собствена търговска марка и персонализиран дизайн за бизнеса. От персонализирано брандиране върху съществуващи модели до изцяло индивидуални дизайни на корпуса, нашият инженерен екип може да разработва продукти под ваша марка. Прилагат се минимални количества за поръчка.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Каква дължина на греблото ми е необходима?'
  answer: 'Греблото трябва да е с 6–8 инча по-високо от вашия ръст. Регулируемите гребла позволяват фина настройка за различни условия. Вижте нашето ръководство за гребла за подробни размери.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Каква е разликата между еднослойни и многослойни PVC SUP дъски?'
  answer: 'Еднослойните PVC дъски са леки и достъпни, но по-малко корави при високо налягане. Двуслойните и фузионно ламинираните конструкции добавят коравина, устойчивост на пробиване и дълголетие. Военнокласовото PVC с UV-устойчиво покритие предлага най-добрия баланс между издръжливост и тегло за SUP за отдих. afarer използва трипластово ламинирано PVC във всички продуктови нива.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Каква ширина на SUP е най-подходяща за стабилност?'
  answer: 'За начинаещи ширина от 33–34 инча осигурява най-добрия баланс между стабилност и лекота на гребане. Дъски, по-тесни от 32 инча, се усещат нестабилни от новите гребци. afarer SUP Explorer 11 с ширина 33 инча е идеална за учене.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Как да избера обема на SUP според теглото си?'
  answer: 'Умножете теглото си в кг по 2,2, за да получите подходящ за начинаещи обем. Например гребец с тегло 75 кг се нуждае от поне 165 литра, но 220–260 литра са значително по-стабилни за учене. SUP Explorer 11 предлага 260 литра и е подходяща за карачи до 100 кг.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'Как се сравнява afarer с други марки?'
  answer: 'afarer предлага най-добрата стойност в надуваемото оборудване за водни спортове. В сравнение с Red Paddle Co, afarer доставя 90% от представянето при 60% от цената. В сравнение с iRocker, afarer използва по-висококачествено трипластово военнокласово PVC и по-високи стойности на PSI. В сравнение с Bluefin, afarer предлага по-добри характеристики на материалите. За повечето гребци afarer предоставя най-добрия баланс между качество и цена.'

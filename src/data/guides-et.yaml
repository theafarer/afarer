- slug: sup-storage-winter-care
  category: maintenance
  title: SUP-i hoidmine ja talvehooldus — pikendage oma laua eluiga
  description: Kuidas täispuhutavat SUP-i lauda õigesti hoida, puhastada ja talvitada. Vältige nõuetekohase hooldusega hallitust, UV-kahjustusi ja materjali degradeerumist.
  tldr: Loputage pärast iga kasutamist mageveega. Kuivatage enne hoidmist täielikult. Tühjendage õhust ja hoidke jahedas, pimedas kohas, eemal otsesest päikesepaistest ja äärmuslikest temperatuuridest. Ärge kunagi hoidke lauda täispuhutuna ega kuumas autos. Kandke perioodiliselt peale UV-kaitsevahendit.
  problem: Ebakorrektne hoidmine on SUP-i enneaegse rikke peamine põhjus — hallitus, materjali lagunemine, delamineerimine ning kuumusest või külmasest tingitud klapi kahjustused.
  solution: 'Järgige 3-etapilist hooldusrutiini: loputage pärast iga seanssi, kuivatage enne hoidmist põhjalikult ja hoidke õhust tühjendatult temperatuuriga reguleeritud keskkonnas vahemikus 50-80°F (10-27°C).'
  audience: Kõik SUP-i omanikud, kes soovivad, et nende laud kestaks 5+ aastat.
  steps:
    - Loputage laud, aer ja pump mageveega pärast iga soolase või mudase veega seanssi
    - Puhastage leebete seebide ja pehme käsnaga — mitte kunagi karmide kemikaalidega ega survepesuriga
    - Kuivatage laud enne õhust tühjendamist õues täielikult (avage klapp, et sisemine niiskus saaks välja)
    - Tühjendage täielikult ja rullige ninast saba suunas, et välja suruda järelejäänud õhk
    - Pühkige seljakott kuivaks, enne kui panete laua sisse
    - Hoidke jahedas, pimedas kapis või voodi all — mitte kunagi otseses päikeses, kuumas autos ega külmuvas kuuris
  faq:
    - q: Kas SUP-i võib jätta kogu hooajaks täispuhutuks?
      a: Kui lauda pikka aega ei kasutata, on parem see õhust tühjendada. Pidev PSI-rõhk kiirendab materjali väsimust. Tühjendage laud seansside vahel, kui hoiustate seda üle 2 nädala.
    - q: Kuidas eemaldada SUP-ilt hallitust?
      a: Segage leebet seepi sooja veega ja veidi valget äädikat. Hõõruge õrnalt pehme harjaga. Loputage põhjalikult ja kuivatage varjus. Vältige pleegitit, mis kahjustab PVC-d.
    - q: Kas SUP-i saab hoida garaažis?
      a: Ainult siis, kui garaaž püsib aastaringselt vahemikus 50-80°F. Pööningutel ja köetamata garaažides esinevad temperatuuri äärmused, mis kahjustavad drop-stitch-südamikke.

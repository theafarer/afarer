- slug: sup-inflation-psi-guide
  category: technical
  title: SUP-i pumpamisjuhend — optimaalne PSI jõudluseks ja ohutuseks
  description: 'Täielik juhend SUP-i pumpamisrõhu kohta: soovitatud PSI vahemikud, kuidas rõhk mõjutab jõudlust, ning näpunäited pumba õigeks kasutamiseks.'
  tldr: Pumpage enamiku täispuhutavate SUP-ide jaoks rõhuni 12-15 PSI. Kõrgem rõhk tähendab suuremat jäikust, kuid aeglasemat pumpamist. Madalam rõhk tähendab pehmemat tunnet, kuid suuremat paindumist. Ärge kunagi ületage oma lauale trükitud maksimaalset PSI rõhku. Kasutage täpse rõhumõõturiga pumpa. Külm õhk vähendab rõhku, kuum päike suurendab seda.
  problem: Liiga lõdvalt pumbatud laud tundub aeglane ja paindub liigselt. Liiga tugevalt pumbatud laud seab õmblused rikkumisohtu. Paljud sõudjad arvavad PSI väärtuse pigem ära kui mõõdavad seda täpselt.
  solution: Kasutage sisseehitatud rõhumõõturiga pumpa. Sihtige maksimaalse jäikuse saavutamiseks rõhku 15 PSI. Kontrollige rõhku enne iga seanssi — temperatuuri muutused mõjutavad PSI väärtust oluliselt.
  audience: Kõik täispuhutavate SUP-ide omanikud.
  steps:
    - Kontrollige oma lauale klapi lähedale trükitud soovitatud PSI vahemikku
    - Kasutage topelttoimelist pumpa, et pumpada rõhk soovitatud vahemiku keskele
    - Lülitage viimase 3-4 PSI jaoks ühekäigulisse režiimi täpsema juhtimise jaoks
    - Kontrollige rõhku mõõturiga — analoogmõõturid on digitaalsetest usaldusväärsemad
    - 'Kohandage vastavalt tingimustele: kõrgem PSI retke- ja võistlussõiduks, madalam PSI kärestike ning kivise kaldavee jaoks'
    - Kontrollige rõhku uuesti, kui laud on 10 minutit seisnud — temperatuuri tasakaalustumine muudab PSI väärtust
  faq:
    - q: Kas SUP-i saab üle pumbata?
      a: Jah. Näidatud maksimaalse PSI rõhu ületamine (tavaliselt 15-18 PSI) võib põhjustada õmbluste delamineerumist ja drop-stitch-südamiku kahjustusi. Püsige alati trükitud vahemiku piires.
    - q: Kas temperatuur mõjutab PSI rõhku?
      a: Oluliselt. 70°F juures rõhuni 15 PSI pumbatud laud võib otsese päikese all 95°F juures jõuda rõhuni 18 PSI. Külm vesi võib rõhu viia tasemeni 12 PSI. Kontrollige rõhku pärast keskkonnatingimuste muutumist.
    - q: Milline PSI sobib algajatele?
      a: Õppimiseks sobib rõhk 12-13 PSI, mis pakub veidi pehmemat platvormi ja on langemiste suhtes leebem. Suurendage oskuste paranedes rõhku kuni 15 PSI.

    - q: Milline pump on täispuhutavate SUP-ide jaoks parim?
      a: Topelttoimelised käsipumbad on standardlahendus. Elektripumbad säästavad vaeva, kuid vajavad toiteallikat. Kasutage alati rõhumõõturiga pumpa, et vältida ülepumpamist.
    - q: Kas on vaja spetsiaalset aeru?
      a: Komplektis olev alumiiniumist aer sobib algajatele. Üleminek klaaskiust või süsinikkiust aerule vähendab käte väsimust pikal sõudmisel märgatavalt.

  category: lifestyle
  title: 'SUP-treening: kogu keha treening vees'
  description: Kuidas supilauaga sõitmine arendab tuumalihaste tugevust, tasakaalu ja südame-veresoonkonna vastupidavust.
  tldr: SUP võtab iga aerutõmbega tööle tuumalihased, jalad, selja ja õlad. Ühetunnine trenn kulutab 300-500 calories. Vastutuult või hoovuse vastu aerutamine kahekordistab koormuse. SUP-jooga lisab painduvus- ja tasakaalutreeningu.
  problem: Paljud inimesed peavad supilauasõitu vaid lõbusaks ajaveetmiseks, mitte tõsiseltvõetavaks treeningvahendiks, jättes märkamata selle potentsiaali kogu keha arendamisel.
  solution: 'Koostage SUP-treeningud kindlate eesmärkidega: vastupidavusaerutamine südamele, intervallid jõuks, SUP-jooga painduvusele ja pika vahemaa aerutamine lihaste vastupidavusele.'
  audience: Trennisõpradele, kes otsivad liigestesäästlikku ja kaasahaaravat kogu keha treeningut.
  steps:
    - Soojendage maal — käeringid, kerepöörded ja jalgade viigutused 5 minutes
    - Alustage 10 minutes ühtlase aerutamisega mõõduka intensiivsusega
    - Liikuge edasi intervalltreeningule — 2 minutes tugevat aerutamist, 2 minutes kerget taastumist
    - Lisage SUP-jooga asendeid — koer näoga allapoole, sõdalane II ja puuasend laual
    - Lõpetage rahuliku aerutamise ja staatiliste venitustega laual
  faq:
    - q: Kas SUP on jooksmisest parem treening?
      a: SUP annab võrreldava südame-veresoonkonna kasu väiksema liigestekoormusega. See aktiveerib ülakeha ja tuumalihaseid rohkem kui jooksmine.
    - q: Kui palju calories SUP kulutab?
      a: Umbes 300-500 calories tunnis mõõduka intensiivsusega. Võistlussõit või vastutuule aerutamine võib kulutada 600-800 calories tunnis.
    - q: Kas SUP-iga saab lihaseid arendada?
      a: Jah. Aerutamine arendab õlgade, selja ja tuumalihaseid. Tasakaalu hoidmine võtab tööle jalad ja stabilisaatorlihased. See on kogu keha jõutreening.

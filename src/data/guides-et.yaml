  problem: Uued SUP-i omanikud on tarvikute valiku ees üle koormatud ja ostavad sageli mittevajalikke asju, jättes aga ostmata kriitilise ohutusvarustuse.
  solution: 'Seadke tarvikutele prioriteedid: ohutus (PFD, turvaköis, vile), funktsionaalsus (pump, varuaer, remondikomplekt), mugavus (tekikott, telefoniümbrik), hubasus (iste, jahutuskasti kinnitus).'

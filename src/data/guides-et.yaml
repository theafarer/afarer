- slug: paddling-techniques
  category: tutorial
  title: Olulised SUP-i sõudmistehnikad
  description: Omandage edastõmme, kaartõmme ja vastaskülje pööre, et sõuda tõhusalt igas olukorras.
  tldr: Edastõmme kasutab Teie tuumi, mitte käsivarsi. Kaartõmme pöörab lauda. Vastaskülje pööre on tõhusaim pöördetehnika. Hoidke aer püstisena ja sukeldage labi täielikult maksimaalse jõu ülekandmiseks.
  problem: Enamik sõudjaid kasutab käsivartele toetuvaid lööke, mis raiskavad energiat ja väsitavad õlgasid. Halb tehnika muudab laua tuules ja kalgendis raskesti juhitavaks.
  solution: Õppige kolm olulist tõmmet — edastõmme, kaartõmme ja vastaskülje pööre — õige kehamehaanikaga. Harjutage kõiki rahulikus vees enne raskematesse tingimustesse asumist.
  audience: Sõudjad, kes soovivad sõuda kauem, kiiremini ja vähem väsinuna.
  steps:
    - 'Edastõmme: sirutage ette, asetage labi täielikult vette, tõmmake tagasi kasutades kere pöörlemist (mitte käsivarsi), lõpetage pahkluu kõrgusel'
    - 'Kaartõmme: sirutage ette laua ääre juures, pöörake labi laias kaares saba suunas, laud pöörab eemale aeru poolt'
    - 'Vastaskülje pööre: asetage aer ilma käsi vahetamata laua vastasküljele ja tõmmake saba poole'
    - 'Toetus: kasutage kalgendis stabiilsuseks madalat toetuslööki — patsutage labi lamedalt veepinnale'
    - 'Kõrvaltõmme: sirutage küljele, tõmmake laud külgsuunas aeru poole'
  faq:
    - q: Kuidas sõuda sirgjoones?
      a: Kasutage mõlemal poolel ühepikkuseid lööke. Vahetage poolt iga 5-10 löögi järel. Valige horisondil kindel orientiir ja hoidke seda silmas.
    - q: Kas põlvi tuleb kõverdada?
      a: Jah. Hoidke põlvides kerge paind, mis toimib löögisummutajana. Lukustatud põlved edastavad iga virvenduse Teie tuumani ja vähendavad stabiilsust.
    - q: Kuidas sõuda vastutuult?
      a: Madaldage asendit, kasutage lühemaid ja kiiremaid lööke ning püsige kaldale lähemal, kus tuul on sageli nõrgem. Kui tuul on liiga tugev, ärge minge vette.

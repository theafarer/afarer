    - q: Kas täispuhutavatel SUP-idel on kandevõime väiksem kui kõvadel laudadel?
      a: Kvaliteetsetel drop-stitch-konstruktsiooniga täispuhutavatel laudadel on tänu paksema mahu jaotusele kandevõime kõvade laudadega võrreldav või isegi suurem.

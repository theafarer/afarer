- slug: how-to-choose-your-sup
  category: buying-guide
  title: Kuidas valida oma SUP-lauda
  description: Täielik juhend õige supilaua valimiseks vastavalt Teie oskuste tasemele, veetingimustele ja kavandatavale kasutusele.
  tldr: Valige SUP vastavalt oskuste tasemele, veetüübile ja peamisele kasutusalale. Universaalsed laudad sobivad algajatele ja rahulikule veele. Tuurimislauad sobivad pikkade vahemaade sõitmiseks. Joogalauad pakuvad stabiilsuseks suuremat laiust. Jõudluslauad sobivad kogenud sõudjatele mitmekesistes tingimustes.
  problem: Enamik esmakordseid ostjaid valib SUP-laua hinna või välimuse põhjal, mitte lähtudes sellest, kuidas ja kus nad tegelikult sõudma hakkavad. See toob kaasa halva stabiilsuse, ebapiisava jõudluse ja pettumust valmistava kogemuse.
  solution: Sobitage laua kuju, maht ja konstruktsioon oma oskuste tasemele ning peamisele veekeskkonnale. Laiemad laudad (32-34") pakuvad algajatele stabiilsust. Pikemad laudad (12-14") hoiavad tuurimisel paremini suunda. Drop-stitch konstruktsioon rõhul 12-15 PSI tagab jäikuse, mis on võrreldav kõvalauaga.
  audience: Esmakordsed SUP-i ostjad, harrastussõudjad ja kõik, kes soovivad oma senist lihtsat lauda täiendada.
  steps:
    - Tuvastage oma peamine sõudmiskeskkond — järv, meri, jõgi või kombineeritud
    - 'Sobitage laua laius oma oskuste tasemega: 32-34" algajale, 30-32" kesktasemel, 28-30" edasijõudnule'
    - 'Valige laua pikkus vastavalt kasutusele: lühem manööverdamiseks, pikem suunapidamiseks ja kiiruseks'
    - 'Valige konstruktsioon: täispuhutav drop-stitch portatiivsuse jaoks, kõvalaud maksimaalse jõudluse jaoks'
    - Kontrollige kaalukandvust — Teie kaal koos varustusega ei tohiks ületada 80% laua piirist
    - 'Kontrollige kaasasolevaid tarvikuid: pump, julgestusrihm, uim, seljakott ja paranduskomplekt'
  faq:
    - q: Mis SUP-i laius on algajale parim?
      a: 32 kuni 34 tolli laiune platvorm pakub õppimiseks kõige stabiilsema aluse. SUP Explorer 11 laiusega 33" on ideaalne esmakordsetele sõudjatele rahulikus vees.
    - q: Täispuhutav või kõva SUP-laud?
      a: Täispuhutavad laudad pakuvad portatiivsust, hoiumugavust ja löökide neelamist. Kõvad laudad pakuvad maksimaalset jäikust ja kiirust. Enamiku harrastuskasutajate jaoks on kvaliteetne täispuhutav laud drop-stitch tuumaga praktiline valik.
    - q: Millise PSI-ni peaksin täis pumbama?
      a: afarer laudades soovitatakse 12-15 PSI. Rõhul 15 PSI saavutab laud maksimaalse jäikuse, mis on võrreldav kõvalauaga. Püsige alati lauale trükitud lubatud rõhupiirides.

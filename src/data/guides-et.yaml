- slug: sup-with-kids
  category: lifestyle
  title: 'SUP koos lastega: täielik perejuhend'
  description: Kuidas võtta lapsed ohutult kaasa supilauasõidule — vanusesoovitused, varustus ja tegevused.
  tldr: Lapsed 6+ võivad sõita täiskasvanuga ühel SUP-il. Lapsed 10+ võivad järelevalve all aerutada oma laual. Kasutage laia stabiilset lauda, kandke alati PFD-d, püsige madalas rahulikus vees ja hoidke tegevused lühikesed (maksimaalselt 30-45 minutes).
  problem: Vanemad soovivad lastega veespordiga tegeleda, kuid muretsevad ohutuse, varustuse sobivuse ja laste kaasahaaravuse pärast.
  solution: Kasutage koossõiduks õige suurusega lauda, veenduge, et iga laps kannab korralikult sobivat PFD-d, alustage madalas soojas vees ja muutke tegevus mänguliseks mängude ja lühikeste tegevustega.
  audience: Vanematele, kes soovivad oma lastele supilauasõitu tutvustada.
  steps:
    - 'Vanus 4-6: sõitke reisijana täiskasvanu laual — istuge ees, hoidke kinni keskmisest kandekäepidest'
    - 'Vanus 6-10: põlvitage või istuge oma laual täiskasvanu järelevalve all ja turvaköiega'
    - 'Vanus 10+: aerutage oma laual täiskasvanu järelevalve olles lähedal'
    - Kandke alati PFD-d — lapsed peavad kogu aeg kandma korralikult sobivat päästevesti
    - Püsige madalas vees (täiskasvanule kuni vööni)
    - Hoidke tegevused lühikesed — alla 10-aastaste laste jaoks maksimaalselt 30-45 minutes
    - Tehke see lõbusaks — mängige mänge, otsige kalu, harjutage püstitõusmist
  faq:
    - q: Milles eas võib laps SUP-iga üksi sõita?
      a: Umbes 10-12. eluaastas järelevalve all, sõltuvalt lapse ujumisoskusest ja mugavusest vees. Alati rahulikes, madalates tingimustes.
    - q: Milline laud sobib lastega SUP-iga sõitmiseks kõige paremini?
      a: Lai laud (34"+) suure kandevõimega koossõiduks. SUP Explorer 11 laiusega 33" ja kandevõimega 220 lb sobib vanema ja lapse jaoks hästi.
    - q: Millist ohutusvarustust lapsed vajavad?
      a: Korralikult sobiv CE-sertifitseeritud päästevest, turvaköis (koossõidul kinnitatud täiskasvanu laua külge), päikesekreem ja müts.

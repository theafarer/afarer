- slug: sup-weight-capacity
  category: buying-guide
  title: SUP-i kandevõime juhend — kui palju kaalu saab SUP kanda?
  description: SUP-i kandevõime piiride mõistmine, kogukoormuse arvutamine ning selgitus, miks piiri ületamine mõjutab jõudlust ja ohutust.
  tldr: Ärge kunagi laske oma kehamassil koos varustusega ületada 80% laua maksimaalsest kandevõimest. 220 lb kandevõimega laud sobib 160 lb kaaluvale sõudjale koos kerge varustusega. Piiri ületamine põhjustab põrklemist, aeglast juhitavust ja suurenenud kahjustusriski.
  problem: Sõudjad ületavad sageli oma laua kandevõimet, mis viib halva jõudluseni, vajumiseni ja võimaliku lauakahjustuseni. Tootjad näitavad maksimaalpiire, kuid ei selgita ohutuid töökoormusi.
  solution: Arvutage oma kogukoormus (kehamass + varustus + laua imendunud vesi) ja püsige alla 80% näidatud maksimaalsest kandevõimest. Raskemad sõudjad vajavad suurema mahuga laudu kandevõimega 300+ lb.
  audience: Kõikide mõõtudega sõudjad, eriti suuremad sõudjad ja need, kes veavad kaasa ekspeditsioonivarustust.
  steps:
    - Leidke oma lauale trükitud maksimaalne kandevõime (tavaliselt klapi lähedalt)
    - Kaaluge end ja kogu oma varustust, sealhulgas aer, PFD, veekindlad kotid, jahutuskast ja tarvikud
    - 'Arvutage: (Teie kogukoormus) ÷ (maksimaalne kandevõime) × 100 = kasutatud kandevõime %'
    - Pidage optimaalse jõudluse ja ohutuse jaoks silmas 70-80%
    - Kui ületate 80%, valige suurem laud või vähendage varustust
  faq:
    - q: Mis juhtub, kui kaalupiir ületatakse?

- slug: weather-conditions
  category: safety
  title: Ilmastikutingimuste mõistmine supilauaga sõitmiseks
  description: Õppige lugema tuult, laineid, loodesid ja ilmastikumustreid, et vees ohutuid otsuseid langetada.
  tldr: 'Kontrollige enne iga vette minekut kolme asja: tuule kiirus (algajale alla 10 mph), lainete kõrgus (algajale alla 1 ft) ja veetemperatuur (riietuge vastavalt veele, mitte õhule). Kaldast eemale puhuv tuul on ohtlik igal oskuste tasemel.'
  problem: Enamik ilmastikuga seotud õnnetusi juhtub, sest sõudjad hindavad olusid valesti — nad kontrollivad õhu temperatuuri, aga mitte vee temperatuuri, või ei mõista, et kaldast eemale puhuv tuul võib nad avamerele puhuda.
  solution: 'Kasutage enne vette minekut struktureeritud ilmastikuhinnangut: tuule suund ja kiirus, lainete periood ja kõrgus, loode seisund ning veetemperatuur. Mõistke, kuidas iga tegur Teie ohutust mõjutab.'
  audience: Kõik sõudjad, kes lähevad avaveele — järvedele, lahtedele, jõgedele ja merele.
  steps:
    - Kontrollige tuule kiirust ja suunda — kaldast eemale puhuv tuul (maalt merele) on kõige ohtlikum
    - Hinnake laineolusid — lainete periood on sama oluline kui lainete kõrgus
    - Arvestage loodega — loodete hoovused võivad olla tugevamad kui Teie sõudmiskiirus
    - Mõõtke veetemperatuuri — alla 60°F/15°C nõuab soojusisolatsiooni
    - Kontrollige nähtavust — udu ja tugev vihm vähendavad nähtavust ning suurendavad põrkeohtu
    - Tundke kohalikke ohte — veealused kaljud, tugevad hoovused, paadiliikluse tsoonid
  faq:
    - q: Milline tuulekiirus on SUP-ile liiga kõrge?
      a: 'Algajale: üle 10 mph (8 knots). Kesktasemel: üle 15 mph (13 knots). Edasijõudnule: üle 20 mph (17 knots). Kahtluse korral ärge minge vette.'
    - q: Mida tähendab lainete periood?
      a: Lainete periood on aeg järjestikuste lainete vahel. Lühikesed perioodid (alla 8 sekundi) tähendavad järsku ja kalgendavat lainetust. Pikad perioodid (üle 12 sekundi) tähendavad sujuvamat ja etteaimatavamat lainetust.
    - q: Kas vihmas saab sõuda?
      a: Kerge vihm on tavaliselt ohutu. Tugev vihm vähendab nähtavust ja võib viidata muutuvatele tuuletingimustele. Äikesetormi korral tuleb veest viivitamata lahkuda.

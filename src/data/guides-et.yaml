    - 'Hinnake kaasaskantavuse vajadusi: täispuhutavad SUP-id mahuvad kokku kõige vähem, täispuhutavad kajakid on mahukamad'
    - 'Mõelge veetingimustele: SUP tuleb toime rahulikust veest kerge lainerohkuseni, kajak tuleb toime ka karedama veega'

    - Hankige Teie veetüübile vastav SUP-i turvaköis (spiraalne rahuliku vee jaoks, sirge jõgede jaoks)
    - Veenduge, et pump jõuab rõhuni 15 PSI ja sellel on rõhumõõtur
    - Lisage remondikomplekt koos PVC-plastrite ja klapivõtmega
    - Kaaluge väärtesemete jaoks veekindlat kotti või veekindlat telefoniümbrikut

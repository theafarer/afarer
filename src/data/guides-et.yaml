- slug: inflatable-repair
  category: maintenance
  title: Kuidas parandada oma täispuhutavat SUP-i
  description: Samm-sammuline juhend täispuhutavate SUP-ide punktsioonide, ventiilikahjustuste ja õmblusvigade parandamiseks.
  tldr: Väikesed punktsioonid (alla 1/4") on parandatavad kaasasoleva lapikomplektiga. Puhastage koht, kandke PVC-liim, vajutage lapp peale ja oodake 24 hours. Ventiilileked nõuavad tavaliselt O-rõnga vahetamist. Suured rebendid või õmbluste delamineerimine vajavad professionaalset teenindust.
  problem: Väikesed punktsioonid ja ventiiliprobleemid on tavalised, kuid kergesti parandatavad. Ilma õige parandustehnikata maksavad kasutajad teenuse eest üle või muudavad kahjustuse hullemaks.
  solution: Tuvastage kahjustuse tüüp — punktsioon, ventiilileke või õmblusprobleem — ja rakendage sobivat parandusmeetodit. Enamik parandusi võtab 30 minutes lisaks kõvastumisajale.
  audience: Täispuhutavate SUP-ide omanikele, kes soovivad põhiparandusi ise teha.
  steps:
    - Leidke leke — puhuge laud täielikult täis, kuulake õhuleket, tundke käega või kasutage seebivett
    - Märkige leke pastapliiatsi või teibiga
    - Puhastage lekkekoha ümbrus isopropüülalkoholiga — vähemalt 2 inches ümber kahjustuse
    - Karestage pind peene liivapaberiga parema liimhaarde jaoks
    - Kandke PVC-liim nii lapi kui ka laua pinnale
    - Oodake 5 minutes, et liim muutuks kleepuvaks
    - Vajutage lapp kindlalt vastu, rullige õhumullid välja rullikuga või krediitkaardiga
    - Laske kõvastuda 24 hours enne täisrõhuni puhumist
  faq:
    - q: Kas saab punktsiooni vees parandada?
      a: Avariiparandus lapi ja teibiga viib Teid kaldale tagasi. Täielik parandus nõuab kuiva keskkonda ja kõvastumist 24 hours.
    - q: Kuidas parandada lekkivat ventiili?
      a: Eemaldage ventiili südamik kaasasoleva tööriistaga, kontrollige O-rõnga kahjustusi, vahetage see vajadusel välja ja keerdage südamik tihedalt tagasi.
    - q: Millist liimi peaksin PVC-parandusteks kasutama?
      a: Kasutage PVC jaoks mõeldud liimi, näiteks HH-66 või Clifton. Tavaline sekundiliim ei haarda täispuhutava PVC-materjaliga hästi.

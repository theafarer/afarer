- slug: sup-maintenance
  category: maintenance
  title: Kuidas puhastada ja hoida oma täispuhutavat SUP-i
  description: Sammsammuline hooldusjuhend oma täispuhutava SUP-laua eluea maksimeerimiseks.
  tldr: Loputage pärast iga kasutamist mageveega, kuivatage enne hoidu põhjalikult, laske õhk välja ja rullige lõdvalt (mitte sõjaväeliselt tihedalt), hoidke jahedas ja kuivas kohas eemal otsesest päikesevalgusest ning kontrollige õmblusi kord kuus.
  problem: Ebaõige hoid ja puhastus on täispuhutavate SUP-ide enneaegse rikke peamised põhjused — hallitus, UV-kahjustused ja õmbluste lahtikihtimine.
  solution: 'Järgige pärast igat sõitu kindlat rutiini: loputage, kuivatage, kontrollige, laske õhk välja ja hoidke. Kange mustuse jaoks kasutage mähedat seepi. Ärge hoidke lauda kunagi märgana ega otseses päikesevalguses.'
  audience: Kõik täispuhutava SUP-i omanikud, kes soovivad, et nende laud vastu peaks 5+ aastat.
  steps:
    - Loputage laud kohe pärast kasutamist mageveega, eriti pärast soolast vett
    - Puhastage mäheda seebi ja pehme käsnaga — vältige karme kemikaale ja kõrgrõhupesureid
    - Kuivatage laud põhjalikult — avage klapp, et lõksus olev vesi saaks välja
    - Kontrollige kahjustusi — vaadake õmblused, klapp ja pind üle torgete suhtes
    - Laske õhk täielikult välja — eemaldage täielikuks tühjendamiseks klapi südamik
    - Rullige laud lõdvalt — alustage ninast ja vältige teravaid volte
    - Hoidke veokotis jahedas ja kuivas kohas eemal otsesest päikesevalgusest
  faq:
    - q: Kas tohin jätta oma SUP-i kogu hooajaks täis pumbatud?
      a: Jah, kuid hoidke seda kasutamata ajal otsese päikesevalguse eest. Pikaks hoiuks on soovitatav osaline rõhulangus (8-10 PSI).
    - q: Kuidas parandada torget?
      a: Puhastage kahjustatud koht, lõigake lapp ümarate nurkadega, kandke peale liimi, vajutage tugevalt vastu ja oodake enne täispuhumist 24 tundi. afarer laudades on kaasas paranduskomplekt.
    - q: Kui tihti tuleks klappi kontrollida?
      a: Kord kuus. Klapp on kõige levinum rikkekoht. Kontrollige, et klapi nõel liiguks vabalt ja O-ring oleks terve.

  faq:
    - q: Kas täispuhutavad SUP-id on sama jäigad kui kõvad lauad?
      a: Rõhul 15 PSI kvaliteetse drop-stitch-konstruktsiooniga kaasaegsed täispuhutavad lauad jäävad kõva lauast vaid väga vähe maha. Enamik harrastussõudjaid vahet ei märka. Võistlussõudjad märkavad kõva laua eelist.

  title: SUP koertega — täielik juhend lemmikloomaga sõudelauasõiduks
  description: 'Kõik, mida tuleb teada sõudelauasõidust koertega: treeningu sammud, turvavarustus, laua valik ja näpunäited eduka SUP-i sessiooni jaoks koos karvase sõbraga.'
  tldr: Alustage laia ja stabiilse lauaga (34"+). Kasutage lemmiklooma PFD-i, libisemiskindlat tekki ja lühikest turvarihma. Harjutage kõigepealt maal, seejärel madalas vees. Hoidke sessioonid lühikesed (20-30 min). Võtke kaasa värske vesi ja rätik. Ärge sundige oma koera kunagi, kui ta tundub ärevil.
  problem: Sõudmine koertega võib ilma korraliku ettevalmistuseta olla stressirohke — koerad võivad paanitseda, laualt maha hüpata või laua pinda kriimustada.
  solution: Kasutage laia stabiilset lauda pehme EVA-tekkiga. Harjutage koeraga järk-järgult. Võtke kaasa turvavarustus, sealhulgas lemmiklooma päästevest ja lühike SUP-ile sobiv turvarihm.
  audience: Koeraomanikud, kes soovivad oma lemmikloomaga SUP-iga sõuda.
  steps:
    - Alustage laia lauaga (34"+ ja suure kandevõimega Teie + koera jaoks)
    - Hankige koerale korralikult sobiv päästevest käepidemega
    - 'Harjutage maal: laske koeral istuda esmalt tühjendatud laual, seejärel rohul täispuhutud laual'
    - 'Liikuge madalasse vette: põlvitage koos koeraga laual ja tehke mõned tõmmed'
    - 'Hoidke sessioonid lühikesed: esimestel väljasõitudel maksimaalselt 20-30 minutit'
    - Võtke oma koerale alati kaasa värske vesi, kokkuklapitav jooginõu ja rätik
  faq:
    - q: Milline SUP-i laud on koertele parim?
      a: Lai ja stabiilne laud pehme EVA-tekkiga, mis annab käppadele haarde. SUP Tropical Breeze Island Escape laiusega 34"+ on koertega sõudmiseks ideaalne.
    - q: Kas mu koer vajab päästevesti?
      a: Jah, isegi tugevate ujujate puhul. Koera päästevest käepidemega muudab lihtsaks koera lauale tagasi tõstmise, kui ta maha kukub.
    - q: Kuidas ma saan ära hoida koera laua kriimustamist?
      a: Hoidke oma koera küüned lühikeseks lõigatud. EVA-vahttekk kaitseb PVC-pinda. Pange teki peale rätik või lemmikloomamatja lisakaitseks.

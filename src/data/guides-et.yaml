- slug: choosing-paddle
  category: buying-guide
  title: Kuidas valida õige SUP-aer
  description: Juhend aeru materjalide, labakuju, varratüüpide ja mõõtude valimiseks.
  tldr: 'Aeru pikkus: SUP-aerud peaksid olema 6-8" pikemad kui Teie pikkus. Laba kuju: dihedraalsed labad hoiavad sirget kulgu, lamedad labad annavad rohkem haardet. Varra materjal: karbon on kergeim, klaaskiud parima hinnakvaliteediga, alumiinium odavaim.'
  problem: Vale aeru suurus või materjal põhjustab asjatut väsimust, halba tõmbe tõhusust ja liigeste koormust.
  solution: Sobitage aeru pikkus, laba kuju, varra materjal ja paindlikkus Teie aerutamisstiili, kehamõõtmete ja eelarvega.
  audience: SUP-aerutajale, kes valib oma esimest või järgmist aere.
  steps:
    - Mõõtke aeru pikkus — üldiseks aerutamiseks 6-8" pikem kui Teie pikkus
    - Valige laba materjal — nailon eelarvele, klaaskiud hinnakvaliteedile, karbon tulemuslikkusele
    - Valige laba kuju — dihedraalne sujuvaks kulgemiseks, lame jõu jaoks, kühvlikujuline võistlussõiduks
    - Valige varra tüüp — sirge üldiseks kasutamiseks, painutatud võistlus-SUP-i jaoks
    - Kontrollige paindlikkust — jäigemad varrad edastavad rohkem jõudu, paindlikud varrad vähendavad liigeste koormust
  faq:
    - q: Milline on parim aeru materjal?
      a: Klaaskiud pakub parimat tasakaalu kaalu, vastupidavuse ja hinna vahel. Karbon on kergem, kuid kallim ja hapram. Nailon on raske, kuid peaaegu hävimatu.
    - q: Kuidas tean, kas minu aer on õige pikkusega?
      a: Pange aer enda kõrvale püsti — käepide peaks ulatuma Teie randmeni, kui tõstate käe pea kohale.
    - q: Kas valida üheosaline või reguleeritav aer?
      a: Reguleeritavad aerud sobivad hästi ühiseks kasutamiseks ja reisimiseks. Üheosalised aerud on pikaajaliseks kasutamiseks kergemad, jäigemad ja tõhusamad.

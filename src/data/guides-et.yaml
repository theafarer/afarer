- slug: sup-racing-fitness
  category: buying-guide
  title: SUP võistlemiseks ja treenimiseks — jõudluslaua ostja juhend
  description: Juhend SUP-i valimiseks võistlusteks, SUP-treeninguks ja sportlikuks sõudmiseks. Laua näitajad, kopli valik ja treeningunõuanded võistlus- ja tervisesõudjatele.
  tldr: 'Võistlus-SUP-id on 12''6" kuni 14'' pikad ja 23-28" kitsad, maksimaalse kiiruse jaoks väljasurvekerega. Treeningu-SUP-id tasakaalustavad kiirust stabiilsusega: 11-12'' ja 30-32". Sobitage laud oma treeningueesmärkide ja kogemustasemega.'
  problem: Tavalised harrastus-SUP-id on tõsiseks tervisetreeninguks või võistlemiseks liiga aeglased ja ebatõhusad. Jõudlusele suunatud sõudjad vajavad otstarbekohaselt ehitatud laudu.
  solution: 'Sobitage laud intensiivsusega: harrastustreening (11-12'' universaalne), tõsine trenn (12'' tuurisõidu laud), võistlus (12''6" või 14'' kitsas väljasurvekeraga).'
  audience: Tervisesõudjad, võistlustele pürgijad ja sportlikud SUP-i entusiastid.
  steps:
    - 'Määratlege oma eesmärk: üldine vorm, võistlustreening või võistluslik sõudmine'
    - 'Treeninguks: 11-12'' laud laiusega 30-32" kiiruse ja stabiilsuse tasakaaluks'
    - 'Võistluseks: 12''6" või 14'' laud laiusega 23-28" ja väljasurvekerega'
    - Valige süsinik- või klaaskiust koppel väiksema kaalu ja väsimuse jaoks
    - Lisage pulsimõõtja ja jälgige vahemaa/kiirust GPS-kellaga
    - Lisage intervalltreening, pikad vahemaad ja tehnikaharjutused
  faq:
    - q: Milline SUP-i pikkus on tervisesõudmiseks parim?
      a: 12' pakub tervisesõudjatele parima kiiruse ja stabiilsuse tasakaalu. Pikemad laudad on kiiremad, kuid nõuavad tasakaalu hoidmiseks rohkem oskust.
    - q: Kas ma vajan heaks treeninguks võistluslauda?
      a: Ei. Tuurisõidu või universaalne laud pikkusega 11-12' annab suurepärase südame-veresoonkonna trenni. Võistluslauad on olulised ainult võistlemisel või võistlusteks valmistumisel.
    - q: Milline koppel on SUP-i treenimiseks parim?
      a: Süsinikkiust koppel, mis on 8-10" pikem kui Teie. Kergem kaal vähendab õlgade väsimust. Väiksem laba suurendab kardiotreeningu jaoks tõmmete sagedust.

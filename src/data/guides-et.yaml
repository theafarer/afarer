- slug: sup-size-guide
  category: buying-guide
  title: SUP-i suurusjuhend — kuidas valida õiged lauamõõdud
  description: Täielik SUP-i suurusjuhend, mis hõlmab pikkuse, laiuse ja paksuse soovitusi lähtuvalt Teie kaalust, pikkusest, oskuste tasemest ja sõudmistiilist.
  tldr: Algajad vajavad stabiilsuse jaoks laiemaid laudu (32-34"). Raskemad sõudjad vajavad pikemaid laudu (11'+) suurema mahuga. Retkesõit nõuab pikemaid kereid (12'+). Jooga vajab erilist laiust (34"+). Kontrollige alati kandevõimet — Teie kaal koos varustusega ei tohiks ületada 80% piirist.
  problem: Vale SUP-i suuruse valimine põhjustab halba stabiilsust, aeglast kursihoidu ja pettumust valmistava sõudmiskogemuse. Enamik esmakordseid ostjaid valib laua väljanägemise järgi, arvestamata, kuidas mõõtmed jõudlust mõjutavad.
  solution: 'Sobitage laua pikkus, laius ja paksus Teie kaalu, oskuste taseme ja peamise kasutusega. Kasutage meie suurusekalkulaatorit: liitke Teie kaal ja varustuse kaal ning valige laud, millel on sellest kogusummast vähemalt 20% varu.'
  audience: Esmakordsed SUP-i ostjad, spetsialiseeritud lauale üleminevad sõudjad ja kõik, kes pole suuruses kindlad.
  steps:
    - Kaaluge end koos kogu kaasatava varustusega (aer, PFD, veekindel kott)
    - Lisage 20% ohutusvaru, et leida minimaalne kandevõime
    - 'Valige laius oskuste taseme järgi: 32-34" algajatele, 30-32" kesktasemele, 28-30" kogenutele'
    - 'Valige pikkus kasutuse järgi: 10''6"-11''6" universaallauale, 12''-14'' retkedeks, 9''-10'' kärestikesõiduks'
    - 'Kontrollige paksust: 6" standard, 4" jõudluse jaoks, 5" universaalseks kasutuseks'
    - Kontrollige oma laua soovitatud PSI vahemikku optimaalse jäikuse tagamiseks
  faq:
    - q: Milline SUP-i laius on algajatele parim?
      a: 32 kuni 34 tolli laiune laud pakub kõige stabiilsema platvormi. Mida laiem on laud, seda lihtsam on tasakaalu hoida — eriti suurematele sõudjatele.
    - q: Kuidas teada saada, kas SUP on Teile liiga väike?
      a: Kui laud istub vees madalal, reageerib juhtimisele aeglaselt või vajub nina sõudmise ajal kergesti vee alla, on see Teie kaalu jaoks tõenäoliselt liiga väike.
    - q: Kas laua pikkus mõjutab kiirust?
      a: Jah. Pikem veeliini pikkus suurendab kere teoreetilist kiirust. 14' retkelaud on sama sõudjapingutuse juures märkimisväärselt kiirem kui 10' universaallaud.

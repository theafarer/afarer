  title: تخزين SUP والعناية الشتوية — أطِل عمر لوحك
  description: كيف تخزن وتنظف وتجهز للشتاء لوح SUP القابل للنفخ بشكل صحيح. تجنب العفن وتلف الأشعة فوق البنفسجية وتدهور المواد بالعناية الصحيحة.
  tldr: نظف بالماء العذب بعد كل استخدام. جفف تمامًا قبل التخزين. فرّغ الهواء وخزن في مكان بارد مظلم بعيدًا عن أشعة الشمس المباشرة ودرجات الحرارة المتطرفة. لا تخزنه منفوخًا أبدًا ولا في سيارة حارة. ضع واقيًا من الأشعة فوق البنفسجية دوريًا.
  problem: التخزين غير الصحيح هو السبب الرئيسي للفشل المبكر في SUP — العفن وتفتت المواد وانفصال الطبقات وضرر الصمام من الحرارة أو البرودة.
  solution: اتبع روتين عناية من 3 خطوات — اشطف بعد كل جلسة، وجفف تمامًا قبل التخزين، وخزن بعد تفريغ الهواء في بيئة مضبوطة الحرارة بين 50-80°F (10-27°C).
  audience: جميع مالكي SUP الذين يريدون أن يدوم لوحهم 5 سنوات فأكثر.
  steps:
    - اشطف اللوح والمجداف والمضخة بالماء العذب بعد كل جلسة في مياه مالحة أو موحلة
    - نظف بصابون معتدل وإسفنجة ناعمة — لا مواد كيميائية قاسية ولا غسالات ضغط أبدًا
    - جفف اللوح تمامًا في الخارج قبل تفريغ الهواء (افتح الصمام ليخرج الماء المحبوس)
    - فرّغ الهواء بالكامل، ولف اللوح من المقدمة نحو المؤخرة لإخراج الهواء المتبقي
    - امسح حقيبة الظهر لتجف قبل تخزين اللوح بداخلها
    - خزنه في خزانة باردة مظلمة أو تخزين تحت السرير — لا في شمس مباشرة ولا سيارة حارة ولا مخزن متجمد
  faq:
    - q: هل يمكنني ترك SUP منفوخًا طول الموسم؟
      a: الأفضل تفريغ الهواء عند عدم الاستخدام لفترات طويلة. إجهاد PSI المستمر يسرّع إجهاد المواد. فرّغ الهواء بين الجلسات إذا تجاوز التخزين أسبوعين.
    - q: كيف أزيل العفن من SUP؟
      a: اخلط صابونًا معتدلًا بماء دافئ ورشة خل أبيض. افرك بلطف بفرشاة ناعمة. اشطف جيدًا وجفف في الظل. تجنب المبيض الذي يتلف PVC.
    - q: هل يمكنني تخزين SUP في مرآب؟
      a: فقط إذا بقي المرآب بين 50-80°F طوال العام. الأسطح العلوية والمرائب غير المكيفة تتعرض لدرجات حرارة متطرفة تتلف أنوية drop-stitch.

  title: كيف تصلح لوح SUP القابل للنفخ
  description: دليل خطوة بخطوة لإصلاح الثقوب ومشاكل الصمام وأضرار الدرزات في ألواح SUP القابلة للنفخ.
  tldr: الثقوب الصغيرة (أقل من ربع بوصة) قابلة للإصلاح بطقم الرقع المرفق. نظف المنطقة، وضع لاصق PVC، واضغط الرقعة، وانتظر 24 ساعة. تسريبات الصمام تتطلب عادة استبدال حلقة O-ring. التمزقات الكبيرة أو انفصال الدرزات تحتاج خدمة احترافية.
  problem: الثقوب الصغيرة ومشاكل الصمام شائعة لكن يسهل إصلاحها. دون تقنية إصلاح صحيحة، يدفع المستخدمون مبالغ زائدة للخدمة الاحترافية أو يزيدون الضرر سوءًا.
  solution: حدد نوع الضرر — ثقب أو تسريب صمام أو مشكلة درزات — وطبق طريقة الإصلاح المناسبة. تستغرق معظم الإصلاحات 30 دقيقة زائد وقت المعالجة.
  audience: مالكو ألواح SUP القابلة للنفخ الذين يريدون التعامل مع الإصلاحات الأساسية بأنفسهم.
  steps:
    - حدد موقع التسريب — انفخ اللوح بالكامل، وأنصت لصوت الهواء، ولمس بيدك، أو استخدم ماء الصابون
    - علّم موقع التسريب بقلم أو شريط لاصق
    - نظف المنطقة المحيطة بالتسريب بالكحول الأيزوبروبيلي — بمسافة 2 بوصة على الأقل حول الضرر
    - خشّن السطح بورق صنفرة ناعم لالتصاق لاصق أفضل
    - ضع لاصق PVC على الرقعة وعلى سطح اللوح معًا
    - انتظر 5 دقائق حتى يصبح اللاصق لزجًا
    - اضغط الرقعة بقوة، وأخرج فقاعات الهواء بأسطوانة أو بطاقة ائتمان
    - اتركه ليعالج 24 ساعة قبل النفخ إلى الضغط الكامل
  faq:
    - q: هل يمكنني إصلاح ثقب وأنا على الماء؟
      a: الإصلاحات الطارئة برقعة وشريط لاصق قد تعيدك إلى الشاطئ. الإصلاحات الكاملة تتطلب ظروفًا جافة ومعالجة 24 ساعة.
    - q: كيف أصلح صمامًا يسرب؟
      a: أزل قلب الصمام بالأداة المرفقة، وافحص حلقة O-ring بحثًا عن ضرر، واستبدلها إذا لزم، وأعد إدخال القلب بإحكام.
    - q: ما اللاصق الذي أستخدمه لإصلاحات PVC؟
      a: استخدم لاصق PVC مخصصًا مثل HH-66 أو Clifton. الغراء التقليدي فائق الالتصاق لا يرتبط جيدًا بمواد PVC القابلة للنفخ.

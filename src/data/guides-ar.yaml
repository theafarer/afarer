  title: دليل مقاسات SUP — كيف تختار أبعاد اللوح المناسبة
  description: دليل مقاسات SUP كامل يغطي توصيات الطول والعرض والسماكة بناءً على وزنك وطولك ومستوى مهارتك وأسلوب تجديفك.
  tldr: يحتاج المبتدئون ألواحًا أعرض (32-34 بوصة) للاستقرار. ويحتاج المجدفون الأثقل ألواحًا أطول (11 قدمًا فأكثر) بحجم أكبر. وتتطلب الجولات الطويلة هياكل أطول (12 قدمًا فأكثر). وتحتاج اليوغا عرضًا إضافيًا (34 بوصة فأكثر). تحقق دائمًا من سعة الوزن — وزنك مع المعدات يجب ألا يتجاوز 80% من الحد.
  problem: اختيار مقاس SUP خاطئ يؤدي إلى استقرار ضعيف ومسار بطيء وتجربة تجديف محبطة. يختار معظم مشتري المرة الأولى لوحًا يبدو جميلًا دون اعتبار كيف تؤثر الأبعاد في الأداء.
  solution: طابق طول اللوح وعرضه وسماكته مع وزنك ومستوى مهارتك واستخدامك الأساسي. استخدم حاسبة المقاسات لدينا — أضف وزنك إلى وزن المعدات، واختر لوحًا به هامش 20% على الأقل فوق ذلك المجموع.
  audience: مشترو SUP لأول مرة، والمجدفون الذين يرقّون إلى لوح متخصص، وأي شخص غير متأكد من المقاسات.
  steps:
    - زن نفسك مع كل المعدات التي تحملها (المجداف وسترة الطفو والحقيبة الجافة)
    - أضف هامش أمان 20% لمعرفة الحد الأدنى لسعة الوزن
    - اختر العرض حسب المهارة — 32-34 بوصة للمبتدئين، 30-32 بوصة للمتوسط، 28-30 بوصة للمتقدمين
    - اختر الطول حسب الاستخدام — 10 أقدام و6 بوصات إلى 11 و6 للاستخدام العام، و12 إلى 14 قدمًا للجولات، و9 إلى 10 أقدام للمياه البيضاء
    - تحقق من السماكة — 6 بوصات قياسية، و4 بوصات للأداء، و5 بوصات للاستخدام العام
    - تحقق من نطاق PSI الموصى به للوحك للصلابة المثلى
  faq:
    - q: ما عرض لوح SUP الأفضل للمبتدئين؟
      a: من 32 إلى 34 بوصة يوفر أكثر منصة استقرار. كلما زاد عرض اللوح سهل التوازن — خصوصًا للمجدفين الأكبر حجمًا.
    - q: كيف أعرف أن لوح SUP صغير عليّ؟
      a: إذا كان اللوح يجلس منخفضًا في الماء، أو يستجيب ببطء، أو تنغمر مقدمته بسهولة أثناء التجديف، فمن المرجح أنه أصغر من اللازم لوزنك.
    - q: هل يؤثر طول اللوح في السرعة؟
      a: نعم. يزيد طول خط الماء من السرعة النظرية للهيكل. لوح جولات بطول 14 قدمًا أسرع بكثير من لوح عام بطول 10 أقدام لنفس جهد المجدف.

  title: لياقة SUP — تمرين كامل للجسم على الماء
  description: كيف يبني التجديف على لوح الوقوف قوة الجذع والتوازن واللياقة القلبية الوعائية.
  tldr: ينشط SUP الجذع والساقين والظهر والكتفين في كل ضربة. تحرق الجلسة التي تستغرق ساعة 300-500 سعرة حرارية. التجديف ضد الريح أو التيار يضاعف الشدة. يوغا SUP تضيف عمل مرونة وتوازن.
  problem: يعتبر كثيرون التجديف على اللوح نشاطًا عابرًا لا أداة لياقة حقيقية، فتفوتهم إمكاناته لتكييف الجسم بالكامل.
  solution: نظّم جلسات SUP بأهداف لياقة محددة — تجديف التحمل للقلب، وسباقات الفواصل للقوة، ويوغا SUP للمرونة، والتجديف لمسافات لتحمل العضلات.
  audience: عشاق اللياقة البدنية الباحثون عن تمرين كامل للجسم منخفض التأثير وعالي الانشغال.
  steps:
    - إحماء على اليابسة — دوائر الذراعين ولف الجذع وتأرجح الساقين لمدة 5 دقائق
    - ابدأ بـ 10 دقائق من التجديف المنتظم بشدة معتدلة
    - انتقل إلى تدريب الفواصل — دقيقتان تجديف قوي، ودقيقتان استشفاء خفيف
    - أدرج أوضاع يوغا SUP — الكلب المتجه لأسفل والمحارب الثاني ووضعية الشجرة على اللوح
    - اختم بتجديف لطيف وتمددات ثابتة على اللوح
  faq:
    - q: هل SUP أفضل من الجري للياقة؟
      a: يوفر SUP فوائد قلبية وعائية مماثلة مع تأثير أقل على المفاصل. كما ينشط الجزء العلوي من الجسم والجذع أكثر من الجري.
    - q: كم سعرة حرارية يحرق SUP؟
      a: تقريبًا 300-500 سعرة حرارية في الساعة بشدة معتدلة. السباق أو التجديف ضد الريح قد يحرق 600-800 سعرة حرارية في الساعة.
    - q: هل يمكنني بناء العضلات من SUP؟
      a: نعم. التجديف يبني عضلات الكتفين والظهر والجذع. التوازن ينشط الساقين والعضلات المثبتة. إنه تمرين مقاومة لكامل الجسم.

  title: التخطيط لرحلة SUP تمتد عدة أيام
  description: كيف تخطط وتنفذ رحلة تجديف تمتد عدة أيام — تخطيط المسار وتعبئة المعدات والتخييم والسلامة.
  tldr: خطط لـ 10-15 ميلًا يوميًا. عبئ المعدات في أكياس جافة مقاومة للماء، ووزع الوزن بالتساوي، وتمرن على تحميل لوحك قبل الرحلة. سجّل خطة إبحار. احمل ماءً وطعامًا ومأوى وأدوات ملاحة ووسيلة اتصال.
  problem: تفشل الرحلات متعددة الأيام بسبب التعبئة الزائدة أو ضعف تخطيط المسار أو التقليل من شأن الطقس والتيارات — مما يؤدي إلى الإرهاق أو فشل المعدات أو حوادث سلامة.
  solution: استخدم أسلوب تخطيط منهجيًا — اختيار المسار، وقائمة المعدات، وتخطيط الطعام، وإحاطة السلامة، وتخطيط الطوارئ.
  audience: المجدفون ذوو الخبرة الذين يخططون لأول بعثة متعددة الأيام.
  steps:
    - اختر مسارًا به مواقع تخييم مؤسسة ونقاط انسحاب آمنة
    - خطط لـ 10-15 ميلًا يوميًا مع مراعاة الريح والتيارات
    - تحقق من جداول المد والجزر وتوقعات الطقس لكامل نافذة الرحلة
    - عبئ المعدات في أكياس جافة مقاومة للماء — بوزن إجمالي 20-30 باوند
    - وزع الوزن بالتساوي — أثقل العناصر في المنتصف
    - سجّل خطة إبحار مفصلة مع أحدهم على الشاطئ
    - أحضر أدوات ملاحة — خريطة ورقية وبوصلة وGPS احتياطيًا
    - عبئ مأوى طوارئ وطعامًا إضافيًا وحقيبة إسعافات أولية
  faq:
    - q: ما المسافة اليومية المثالية؟
      a: 10-15 ميلًا يوميًا للمجدفين ذوي الخبرة. ينبغي أن يخطط المبتدئون لـ 5-8 أميال. احسب دائمًا وقتًا احتياطيًا للطقس.
    - q: كم ماءً يجب أن أحمل؟
      a: جالون واحد للفرد يوميًا. في الظروف الحارة، 1.5 جالون. احمل مرشح ماء أو أقراص تعقيم لإعادة التعبئة.
    - q: ما أهم عنصر سلامة؟
      a: الاتصال. راديو VHF أو مرسل عبر الأقمار الصناعية قد ينقذ الحياة في الطوارئ. الهواتف المحمولة غير موثوقة في المناطق النائية.

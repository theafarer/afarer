  title: كيف تنظف وتخزن لوح SUP القابل للنفخ
  description: دليل صيانة خطوة بخطوة لتعظيم عمر لوح SUP القابل للنفخ.
  tldr: اشطف بالماء العذب بعد كل استخدام، وجفف تمامًا قبل التخزين، وفرّغ الهواء ولف اللوث بشكل فضفاض (لا بإحكام شديد)، وخزنه في مكان بارد جاف بعيدًا عن أشعة الشمس المباشرة، وافحص الدرزات شهريًا.
  problem: التخزين والتنظيف غير الصحيحين هما السببان الرئيسيان للفشل المبكر في ألواح SUP القابلة للنفخ — العفن وتلف الأشعة فوق البنفسجية وانفصال الدرزات.
  solution: اتبع روتينًا ثابتًا بعد كل جلسة — اشطف وجفف وافحص وفرّغ الهواء وخزن. استخدم صابونًا معتدلًا للأوساخ العنيدة. لا تخزن اللوح مبللًا أو تحت أشعة الشمس المباشرة أبدًا.
  audience: جميع مالكي ألواح SUP القابلة للنفخ الذين يريدون أن يدوم لوحهم 5 سنوات فأكثر.
  steps:
    - اشطف اللوح بالماء العذب فورًا بعد الاستخدام، خصوصًا بعد المياه المالحة
    - نظف بصابون معتدل وإسفنجة ناعمة — تجنب المواد الكيميائية القاسية أو الغسالات بالضغط
    - جفف اللوح تمامًا — افتح الصمام ليخرج الماء المحبوس
    - افحص الأضرار — تدقق في الدرزات والصمام والسطح بحثًا عن الثقوب
    - فرّغ الهواء بالكامل — أزل قلب الصمام لتفريغ كامل
    - لف اللوح بشكل فضفاض — ابدأ من المقدمة وتجنب الطيات الضيقة
    - خزنه في حقيبة الحمل في مكان بارد جاف بعيدًا عن أشعة الشمس المباشرة
  faq:
    - q: هل يمكنني ترك لوح SUP منفوخًا طوال الموسم؟
      a: نعم، لكن أبقِه بعيدًا عن أشعة الشمس المباشرة عند عدم الاستخدام. يوصى بتفريغ جزئي للهواء (8-10 PSI) للتخزين الطويل.
    - q: كيف أصلح الثقب؟
      a: نظف المنطقة، واقطع رقعة بزوايا مستديرة، وضع اللاصق، واضغط بقوة، وانتظر 24 ساعة قبل النفخ. تتضمن ألواح afarer طقم إصلاح.
    - q: كم مرة يجب أن أفحص الصمام؟
      a: شهريًا. الصمام هو أكثر نقاط الفشل شيوعًا. تحقق من أن دبوس الصمام يتحرك بحرية وأن حلقة O-ring سليمة.

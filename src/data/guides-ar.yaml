  title: ملحقات SUP الأساسية — ما تحتاجه فعلًا
  description: دليل عملي لملحقات SUP الضرورية من سترات النجاة والمجاديف إلى المضخات وأشرطة الربط وأطقم الصيانة. ما تشتريه أولًا وما تتخطاه.
  tldr: الأساسيات — سترة طفو وleash ومضخة ومجداف وزعنفة. موصى بها بشدة — طقم إصلاح وعلبة هاتف مقاومة للماء وحقيبة سطح. لطيف أن تملك — مضخة كهربائية وبدلة جافة وحامل صندوق تبريد. تخطَّ العناصر الترفيهية التي تضيف وزنًا بلا وظيفة.
  problem: يشعر مالكو SUP الجدد بالحيرة أمام خيارات الملحقات، وكثيرًا ما يشترون عناصر غير ضرورية بينما يفوتهم معدات السلامة الحرجة.
  solution: رتب الملحقات حسب الأولوية — السلامة (سترة الطفو وleash وصافرة)، والوظيفية (المضخة والمجداف الاحتياطي وطقم الإصلاح)، والراحة (حقيبة السطح وعلبة الهاتف)، والرفاهية (المقعد وحامل التبريد).
  audience: مالكو SUP الجدد الذين يبنون طقم ملحقاتهم.
  steps:
    - اشترِ سترة نجاة معتمدة من CE/USCG تناسب مقاسك
    - احصل على leash حلزوني لـ SUP مقدّر لنوع مياهك (حلزوني للمياه الهادئة، مستقيم للأنهار)
    - تأكد أن مضختك تصل إلى 15 PSI ولها مقياس ضغط
    - أضف طقم إصلاح برقع PVC وأداة صمام
    - فكر في حقيبة جافة أو علبة هاتف مقاومة للماء للمقتنيات الثمينة
    - أضف حامل صندوق تبريد أو حامل قصبة صيد للأنشطة المتخصصة
  faq:
    - q: هل أحتاج فعلًا إلى سترة نجاة لـ SUP؟
      a: نعم. حتى السباحون الأقوياء قد يصابون أو يُنهَكون. سترة الطفو هي أهم عنصر سلامة منفرد. يفرضها كثير من الولايات القضائية قانونيًا.
    - q: ما أفضل مضخة لألواح SUP القابلة للنفخ؟
      a: المضخات اليدوية ثنائية المفعول هي المعيار. المضخات الكهربائية توفر الجهد لكنها تتطلب مصدر طاقة. استخدم دائمًا مضخة بمقياس ضغط لتجنب النفخ الزائد.
    - q: هل أحتاج إلى مجداف خاص؟
      a: المجداف الألمنيومي المرفق يكفي المبتدئين. الترقية إلى مجداف فايبرجلاس أو كربون تقلل إرهاق الذراعين بشكل كبير في التجديف الطويل.

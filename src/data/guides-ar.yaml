  title: نصائح السلامة للرياضات المائية
  description: إرشادات السلامة الأساسية للتجديف على اللوح — من فحص المعدات إلى الوعي بالطقس.
  tldr: ارتدِ دائمًا سترة نجاة معتمدة بشهادة CE، وتحقق من الطقس وظروف الماء قبل الانطلاق، واحمل أجهزة اتصال، ولا تجدف وحدك أبدًا في مياه غير مألوفة، وافهم الحدود المقدّرة لمعداتك.
  problem: معظم حوادث الرياضات المائية تنتج عن تحضير غير كافٍ — غياب سترة النجاة، أو تجاهل تحذيرات الطقس، أو استخدام معدات تتجاوز حدود تصميمها.
  solution: اعتمد قائمة تحقق للسلامة قبل الانطلاق — تحقق من حالة المعدات، وتفقد الطقس ودرجة حرارة الماء، وأخبر أحدهم بمسارك، وارتدِ دائمًا وسيلة طفو مناسبة.
  audience: جميع المتجدفين على اللوح وممارسو الرياضات المائية.
  steps:
    - تحقق من توقعات الطقس — تجنب الرياح فوق 15 mph والعواصف الرعدية
    - تحقق من درجة حرارة الماء — الماء البارد (أقل من 60°F/15°C) يتطلب بذلة غوص أو بدلة جافة
    - افحص المعدات — ابحث عن التسريبات والشقوق وتأكد من النفخ الصحيح
    - ارتدِ سترة نجاة معتمدة بشهادة CE طوال الوقت
    - اربط leash بكاحلك أو ساقك
    - سجّل خطة إبحار — أخبر أحدهم إلى أين تذهب ومتى ستعود
    - احمل وسيلة اتصال — علبة هاتف مقاومة للماء أو راديو VHF
    - اعرف حدودك — ابقَ ضمن مستوى مهارتك وتقييمات معداتك
  faq:
    - q: هل أحتاج إلى سترة نجاة على لوح SUP؟
      a: نعم. تفرض العديد من الولايات القضائية قانونيًا وجود سترة نجاة على أي مركبة مائية، بما في ذلك ألواح SUP. وحتى حيث لا تكون مطلوبة، تعد سترة النجاة المعتمدة بشهادة CE معدات أمان أساسية.
    - q: ما أكثر إصابات الرياضات المائية شيوعًا؟
      a: الانغماس في الماء البارد والإرهاق هما أكثر المخاطر الجدية شيوعًا. ارتدِ دائمًا بما يناسب درجة حرارة الماء، لا حرارة الهواء.
    - q: كيف أتأكد من أن الظروف آمنة؟
      a: استخدم توقعات الطقس البحري. تحقق من سرعة الريح وارتفاع الأمواج ودرجة حرارة الماء. ينبغي أن يبقى المبتدئون في ظروف تحت رياح 10 mph وأمواج أقل من قدم واحد.

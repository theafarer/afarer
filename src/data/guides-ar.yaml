  title: كيف تختار مجداف SUP المناسب
  description: دليل لمواد المجداف وأشكال النصل وأنواع العمود والقياسات لـ SUP.
  tldr: طول المجداف — يجب أن تكون مجاديف SUP أطول من طولك بـ 6-8 بوصات. شكل النصل — النصلة المزدوجة الإنحدار تحافظ على مسار مستقيم، والمسطحة توفر قوة تعشيق أكبر. مادة العمود — الكربون أخف، والفايبرجلاس أفضل قيمة، والألمنيوم اقتصادي.
  problem: استخدام مقاس أو مادة مجداف خاطئة يسبب إرهاقًا لا داعي له وضعف كفاءة الضربات وإجهاد المفاصل.
  solution: طابق طول المجداف وشكل النصل ومادة العمود ومرونته مع أسلوب تجديفك وحجم جسمك وميزانيتك.
  audience: مجدفو SUP الذين يختارون مجدافهم الأول أو التالي.
  steps:
    - قس ارتفاع المجداف — أطول من طولك بـ 6-8 بوصات للتجديف العام
    - اختر مادة النصل — النايلون للميزانية، والفايبرجلاس للقيمة، والكربون للأداء
    - اختر شكل النصل — مزدوج الإنحدار للمسار السلس، ومسطح للقوة، وملعقي للسباقات
    - اختر نوع العمود — مستقيم للاستخدام العام، ومنحنٍ لسباقات SUP
    - تحقق من المرونة — الأعمدة الأكثر صلابة تنقل قوة أكبر، والأكثر مرونة تقلل إجهاد المفاصل
  faq:
    - q: ما أفضل مادة للمجداف؟
      a: يوفر الفايبرجلاس أفضل توازن بين الوزن والمتانة والتكلفة. الكربون أخف لكنه أغلى وأكثر هشاشة. النايلون ثقيل لكنه عديم التلف عمليًا.
    - q: كيف أعرف أن مجدافي بالطول الصحيح؟
      a: قف المجداف عموديًا بجانبك — يجب أن تصل المقبض إلى معصمك عندما ترفع ذراعك فوق رأسك.
    - q: هل أختار مجدافًا قطعة واحدة أم قابلًا للتعديل؟
      a: المجاديف القابلة للتعديل جيدة للاستخدام المشترك والسفر. المجاديف ذات القطعة الواحدة أخف وأكثر صلابة وكفاءة للاستخدام المخصص.

  title: تقنيات التجديف الأساسية على SUP
  description: أتقن الضربة الأمامية وضربة الكنس والانعطاف cross-bow لتجدف بكفاءة في أي ظرف.
  tldr: الضربة الأمامية تستخدم عضلاتك الأساسية لا ذراعيك. ضربة الكنس تدير اللوح. انعطاف cross-bow هو المحور الأكفأ. أبقِ المجداف عموديًا واغمر نصل المجداف بالكامل لأقصى نقل للقوة.
  problem: معظم المجدفين يستخدمون ضربات تعتمد على الذراعين تهدر الطاقة وتسبب إرهاق الكتف. كما تجعل التقنية السيئة اللوح صعب التحكم في الريح والموج المضطرب.
  solution: تعلم ثلاث ضربات أساسية — الأمامية والكنس وانعطاف cross-bow — بميكانيكا جسم صحيحة. تمرن على كل منها في مياه هادئة قبل الانتقال إلى الظروف الصعبة.
  audience: المجدفون الذين يريدون التجديف لمدة أطول وأسرع وبإرهاق أقل.
  steps:
    - الضربة الأمامية — مد المجداف للأمام، واغرس النصل بالكامل، واسحب للخلف باستخدام دوران الجذع (لا الذراعين)، وأخرجه عند الكاحل
    - ضربة الكنس — مد المجداف للأمام عند حافة اللوح، واكسح النصل في قوس واسع نحو المؤخرة ليدير اللوح بعيدًا عن جانب المجداف
    - انعطاف cross-bow — ضع المجداف على الجانب المقابل للوح دون تبديل اليدين، واسحب نحو المؤخرة
    - التثبيت — استخدم تثبيتًا منخفضًا للاستقرار في الموج المضطرب — اضرب النصل مسطحًا على سطح الماء
    - ضربة السحب — مد يدك جانبيًا واسحب اللوح جانبيًا نحو المجداف
  faq:
    - q: كيف أجدف في خط مستقيم؟
      a: استخدم طول ضربة متسقًا على الجانبين. بدّل الجانبين كل 5-10 ضربات. انظر إلى نقطة ثابتة على الأفق كمرجع.
    - q: هل يجب أن أثني ركبتيّ؟
      a: نعم. أبقِ انثناءً خفيفًا في ركبتيك كممتصين للصدمات. الركبتان المقفلتان تنقلان كل تموج إلى جذعك وتقللان الاستقرار.
    - q: كيف أجدف ضد الريح؟
      a: اخفض وقفتك، واستخدم ضربات أقصر وأسرع، وابقَ قريبًا من الشاطئ حيث تقل الريح غالبًا. إذا كانت الريح قوية جدًا، فلا تخرج.

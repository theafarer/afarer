  title: دليل سعة الوزن في SUP — كم وزنًا يتحمله اللوح؟
  description: فهم حدود سعة الوزن في SUP، وكيف تحسب حملك الإجمالي، ولماذا يؤثر تجاوز الحد في الأداء والسلامة.
  tldr: لا تتجاوز أبدًا 80% من سعة الوزن القصوى للوح بوزن جسمك مع المعدات. لوح بسعة 220 باوند مناسب لمجدف يزن 160 باوند بمعدات خفيفة. تجاوز الحد يسبب غطس المقدمة المتكرر واستجابة بطيئة وخطر تلف متزايد.
  problem: كثيرًا ما يتجاوز المجدفون سعة الوزن القصوى لألواحهم، مما يؤدي إلى أداء ضعيف وغرق جزئي واحتمال تلف اللوح. يسرد المصنعون الحدود القصوى لكنهم لا يشرحون أحمال التشغيل الآمنة.
  solution: احسب حملك الإجمالي (وزن الجسم + المعدات + الماء الذي يمتصه اللوح) وابقَ تحت 80% من السعة القصوى المعلنة. يحتاج المجدفون الأثقل ألواحًا أكبر حجمًا بسعة 300 باوند فأكثر.
  audience: المجدفون بكل الأحجام، خصوصًا المجدفون الأكبر حجمًا ومن يحملون معدات البعثات.
  steps:
    - اعثر على سعة الوزن القصوى المطبوعة على لوحك (عادة قرب الصمام)
    - زن نفسك وكل المعدات شاملة المجداف وسترة الطفو والأكياس الجافة وصندوق التبريد والملحقات
    - احسب — حملك الإجمالي مقسومًا على السعة القصوى مضروبًا في 100 يساوي نسبة السعة المستخدمة
    - استهدف 70-80% للأداء والسلامة المثلى
    - إذا تجاوزت 80%، فاختر لوحًا أكبر أو قلل المعدات
  faq:
    - q: ماذا يحدث إذا تجاوزت حد الوزن؟
      a: يرتكز اللوح على وضع أخفض مما يخلق مقاومة أكبر. يقل الاستقرار، وقد تنغمر المقدمة، وتتعرض نواة drop-stitch لخطر تلف أعلى في الموج المضطرب.
    - q: هل يمكن لشخصين الركوب على لوح SUP واحد؟
      a: فقط إذا بقي الوزن الإجمالي تحت 80% من السعة. معظم ألواح SUP القياسية مصممة لراكب واحد. يتطلب الركوب المزدوج لوحًا مقدّرًا لشخصين تحديدًا.
    - q: هل سعة ألواح SUP القابلة للنفخ أقل من الألواح الصلبة؟
      a: الألواح القابلة للنفخ عالية الجودة ببنية drop-stitch لها سعات وزن مماثلة أو أعلى من الألواح الصلبة بفضل توزيع حجمها الأسمك.

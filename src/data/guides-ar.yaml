- slug: sup-inflation-psi-guide
  category: technical
  title: دليل نفخ SUP — PSI الأمثل للأداء والسلامة
  description: دليل كامل لضغط نفخ SUP — نطاقات PSI الموصى بها، وكيف يؤثر الضغط في الأداء، ونصائح لاستخدام المضخة بشكل صحيح.
  tldr: انفخ إلى 12-15 PSI لمعظم ألواح SUP القابلة للنفخ. ضغط أعلى يعني صلابة أكبر لكن نفخًا أبطأ. وضغط أقل يعني إحساسًا أنعم لكن انحناءً أكثر. لا تتجاوز أبدًا PSI الأقصى المطبوع على لوحك. استخدم مضخة بمقياس ضغط دقيق. الهواء البارد يخفض الضغط، والشمس الحارة ترفعه.
  problem: الألواح المنفوخة ناقصًا تبدو بطيئة وتنثني كثيرًا. والألواح المنفوخة زيادة تخاطر بانفصال الدرزات. يخمن كثير من المجدفين PSI بدل قياسه بدقة.
  solution: استخدم مضخة بمقياس ضغط مدمج. استهدف 15 PSI لأقصى صلابة. تحقق من الضغط قبل كل جلسة — تغيرات الحرارة تؤثر في PSI بشكل كبير.
  audience: جميع مالكي ألواح SUP القابلة للنفخ.
  steps:
    - تحقق من نطاق PSI الموصى به المطبوع على لوحك قرب الصمام
    - استخدم المضخة ثنائية المفعول للنفخ إلى منتصف النطاق الموصى به
    - بدّل إلى وضع المفعول الواحد لآخر 3-4 PSI لتحكم أدق
    - تحقق من الضغط بالمقياس — المقاييس التناظرية أكثر موثوقية من الرقمية
    - عدّل حسب الظروف — PSI أعلى للجولات والسباقات، وأدنى للمياه البيضاء والإطلاقات الصخرية
    - أعد فحص الضغط بعد ترك اللوح 10 دقائق — توازن الحرارة يغيّر PSI
  faq:
    - q: هل يمكنني نفخ SUP زيادة؟
      a: نعم. تجاوز PSI الأقصى المقدّر (عادة 15-18 PSI) قد يفصل الدرزات ويتلف نواة drop-stitch. ابقَ دائمًا داخل النطاق المطبوع.
    - q: هل تؤثر الحرارة في PSI؟
      a: بشكل كبير. لوح منفوخ إلى 15 PSI عند 70°F قد يبلغ 18 PSI في شمس مباشرة عند 95°F. والماء البارد قد يخفض الضغط إلى 12 PSI. تحقق من الضغط بعد تغيرات البيئة.
    - q: ما PSI المناسب للمبتدئين؟
      a: 12-13 PSI للتعلم توفر منصة أنعم قليلًا أكثر تسامحًا مع السقوط. ارفع إلى 15 PSI مع تحسن المهارات.

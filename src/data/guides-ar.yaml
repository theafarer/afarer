- slug: beginner-guide
  category: tutorial
  title: دليل المبتدئين للتجديف على لوح الوقوف
  description: كل ما تحتاج معرفته قبل أول جلسة تجديف على اللوح — من تجهيز المعدات إلى تقنيات التجديف الأساسية.
  tldr: ابدأ على مياه هادئة ومسطحة مع لوح عريض مستقر. انفخ اللوح إلى 12-15 PSI، وثبّت leash، واستخدم طول المجداف الصحيح (أطول من طولك بـ 6-8 بوصات). حافظ على وقفة بعرض الكتفين، مع ثني الركبتين قليلًا، وانظر إلى الأفق.
  problem: كثيرًا ما يتخطى المجدفون الجدد التحضيرات الأساسية — طول مجداف خاطئ أو وقفة سيئة أو اختيار مياه مضطربة — مما يؤدي إلى السقوط والإحباط وفقدان الحماس.
  solution: اتبع خطة منظمة للجلسة الأولى — اختر مياهًا هادئة، وجهّز معداتك بشكل صحيح، وتدرب على الركبتين قبل الوقوف، واتقن الضربة الأمامية قبل محاولة الانعطاف.
  audience: المبتدئون تمامًا الذين لم يقفوا على لوح تجديف من قبل.
  steps:
    - اختر مياهًا مسطحة هادئة دون حركة قوارب — بحيرة صغيرة أو خليج محمي خيار مثالي
    - انفخ اللوح إلى 12-15 PSI بالمضخة ثنائية المفعول
    - اربط leash الحلزوني بكاحلك أو ساقك، وليس بمقبض اللوح أبدًا
    - أدخل الزعنفة وشد البرغي
    - اضبط طول المجداف — يجب أن يكون أطول من طولك بـ 6-8 بوصات
    - ابدأ راكعًا على اللوح، وجدف بضع ضربات لتشعر بالتوازن
    - قف قدمًا واحدة في كل مرة، والقدمان بعرض الكتفين، والركبتان مرنتان
    - انظر إلى الأفق لا إلى قدميك — اللوح يذهب إلى حيث تنظر
  faq:
    - q: ماذا أرتدي للتجديف على اللوح؟
      a: ملابس رياضية سريعة الجفاف وسترة نجاة وواقي شمس وقبعة. في المياه الباردة ارتدِ بذلة غوص. ارتدِ دائمًا leash واحمل هاتفًا في علبة مقاومة للماء.
    - q: كيف أعود إلى اللوح بعد السقوط؟
      a: حافظ على هدوئك. اسبح إلى اللوح، وامسك المقبض الأوسط، واركل ساقيك واسحب نفسك إلى أعلى اللوح بحركة واحدة. عد أولًا إلى وضع الركوع ثم قف.
    - q: ما ظروف الرياح الآمنة؟
      a: للمبتدئين — رياح أقل من 10 mph (5 عقد). إذا كانت الريح تهب بعيدًا عن الشاطئ فلا تخرج إلى الماء. تحقق من التوقعات وتذكر أن الريح التي تهب من اليابسة نحو البحر خطيرة.

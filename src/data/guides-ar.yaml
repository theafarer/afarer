  title: فهم ظروف الطقس للتجديف على اللوح
  description: تعلم قراءة الريح والأمواج والمد والجزر وأنماط الطقس لاتخاذ قرارات آمنة على الماء.
  tldr: تحقق من ثلاثة أمور قبل كل انطلاق — سرعة الريح (أقل من 10 mph للمبتدئين)، وارتفاع الأمواج (أقل من قدم واحد للمبتدئين)، ودرجة حرارة الماء (ارتدِ بحسب الماء لا الهواء). الريح التي تهب من اليابسة نحو البحر خطيرة عند أي مستوى مهارة.
  problem: تحدث معظم الحوادث المتعلقة بالطقس لأن المجدفين يسيئون تقدير الظروف — يتفقدون حرارة الهواء لا حرارة الماء، أو لا يفهمون أن الريح التي تهب من اليابسة نحو البحر قد تحملهم إلى عرض البحر.
  solution: استخدم تقييمًا منظمًا للطقس قبل الانطلاق — اتجاه الريح وسرعتها، ودورة الموج وارتفاعه، وحالة المد والجزر، ودرجة حرارة الماء. وافهم كيف يؤثر كل عامل في سلامتك.
  audience: جميع المجدفين الذين يخرجون إلى المياه المفتوحة — بحيرات وخليجان وأنهار ومحيطات.
  steps:
    - تحقق من سرعة الريح واتجاهها — الريح التي تهب من اليابسة نحو البحر هي الأخطر
    - قيّم حالة الأمواج — دورة الموج لا تقل أهمية عن ارتفاعه
    - اعرف حالة المد والجزر — تيارات المد قد تكون أقوى من سرعة تجديفك
    - قس درجة حرارة الماء — أقل من 60°F/15°C يتطلب حماية حرارية
    - تحقق من مدى الرؤية — الضباب والأمطار الغزيرة تقللان الرؤية وتزيدان خطر الاصطدام
    - افهم المخاطر المحلية — صخور غاطسة وتيارات قوية ومناطق حركة القوارب
  faq:
    - q: ما سرعة الريح التي تعد مرتفعة جدًا للتجديف على SUP؟
      a: للمبتدئين أكثر من 10 mph (8 عقد). للمتوسطين أكثر من 15 mph (13 عقدة). للمتقدمين أكثر من 20 mph (17 عقدة). إذا كنت في شك، فلا تخرج.
    - q: ماذا تعني دورة الموج؟
      a: دورة الموج هي الزمن بين الموجات المتتالية. الدورات القصيرة (أقل من 8 ثوانٍ) تعني أمواجًا حادة ومضطربة. والدورات الطويلة (أكثر من 12 ثانية) تعني موجات أنعم وأكثر قابلية للتنبؤ.
    - q: هل يمكنني التجديف تحت المطر؟
      a: المطر الخفيف آمن عادة. المطر الغزير يقلل الرؤية وقد يشير إلى تغير ظروف الريح. أما العواصف الرعدية فتستوجب إخلاء الماء فورًا.

  title: كيف تقرأ مواصفات لوح SUP
  description: دليل تقني لفهم مواصفات لوح SUP — الحجم والأبعاد والبنية وما تعنيه للأداء.
  tldr: المواصفات الرئيسية — الحجم باللترات يحدد الطفو وسعة الوزن، والعرض يحدد الاستقرار، والطول يحدد المسار والسرعة، والسماكة تحدد الصلابة، وتقييم PSI يحدد ضغط النفخ للأداء الأمثل.
  problem: تسرد أوراق مواصفات المنتجات أرقامًا دون سياق، تاركة المشترين في حيرة بشأن المواصفات التي تهم فعلًا لحالة استخدامهم.
  solution: ترجم كل مواصفة إلى أداء واقعي — الحجم للطفو، والعرض للاستقرار، والطول للانزلاق، والسماكة للصلابة، والبنية للمتانة.
  audience: المجدفون المتوسطون والمشترون التقنيون الذين يريدون اتخاذ قرارات مبنية على البيانات.
  steps:
    - تحقق من الحجم باللترات — وزنك مع المعدات يجب ألا يتجاوز 80% من تقييم حجم اللوح
    - تحقق من العرض — أعرض (32-34 بوصة) يعني استقرارًا أكبر، وأضيق (28-30 بوصة) يعني سرعة أكبر
    - تحقق من الطول — أطول (12-14 بوصة) يعني مسارًا أفضل، وأقصر (10-11 بوصة) يعني مناورة أفضل
    - تحقق من السماكة — 6 بوصات قياسية، و8 بوصات توفر صلابة وسعة وزن أكبر
    - تحقق من تقييم PSI — انفخ إلى أقصى PSI مقدّر للصلابة المثلى
    - تحقق من مواد البناء — كثافة drop-stitch وطبقات PVC وتقوية جوانب اللوح
  faq:
    - q: ماذا تعني تقنية drop-stitch؟
      a: تقنية drop-stitch هي طريقة بناء تربط فيها آلاف الخيوط بين الطبقتين العلوية والسفلية للوح. يسمح ذلك بالنفخ بضغط عالٍ (12-15 PSI) لصلابة فائقة.
    - q: ما النسبة المثالية بين الوزن والحجم؟
      a: هدف جيد هو تقريبًا 5-6 باوند من وزن الراكب لكل لتر من حجم اللوح. يجب أن يبحث مجدف يزن 220 باوند عن ألواح بحجم 180 لترًا فأكثر.
    - q: هل وزن اللوح مهم؟
      a: نعم. الألواح الأخف (أقل من 20 باوند) أسهل في الحمل والنقل. والألواح الأثقل (25 باوند فأكثر) تشير غالبًا إلى بنية PVC متعددة الطبقات أكثر متانة.

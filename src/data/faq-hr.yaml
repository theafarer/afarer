- id: travel-sup
  question: 'Mogu li putovati sa SUP daskom na napuhavanje?'
  answer: 'Naravno. Svaka afarer daska stane u futrolu veličine ruksaka koja zadovoljava zahtjeve zrakoplovnih kompanija za prtljagu. Uz težinu od samo 18–22 lbs lako ju je nositi na plažu, do jezera ili kroz terminale zračne luke.'

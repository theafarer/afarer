- id: oem-odm-details
  question: 'Koje su minimalne količine narudžbe za OEM/ODM?'
  answer: 'Minimalne količine narudžbe (MOQ) razlikuju se ovisno o vrsti proizvoda i složenosti. Prilagođeno brendiranje postojećih modela obično zahtijeva 5–10 jedinica. Potpuno prilagođeni dizajni trupa zahtijevaju veće MOQ-ove. Kontaktirajte naš prodajni tim sa svojim zahtjevima radi detaljne ponude. Bavimo se svime, od prilagođenih boja i logotipa do potpuno originalnih dizajna kalupa.'

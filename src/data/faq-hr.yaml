  question: 'Koju dužinu vesla trebam?'
  answer: 'Veslo bi trebalo biti za 6–8 inča više od vaše visine. Podesiva vesla omogućuju fino podešavanje za različite uvjete. Detaljne veličine pogledajte u našem vodiču za vesla.'

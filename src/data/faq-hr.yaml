- id: cold-weather-safety
  question: 'Kakvu sigurnosnu opremu trebam za veslanje u hladnoj vodi?'
  answer: 'Voda ispod 15°C zahtijeva toplinsku zaštitu. Za 8–14°C koristite neoprensko ili suho odijelo s čizmama, rukavicama i kapuljačom. Za 14–20°C dovoljno je neoprensko odijelo debljine 3/2mm. Uvijek nosite pravilno namješten prsluk za spašavanje radi toplinske zaštite i sigurnosti. Provjerite lokalne propise o obveznoj opremi.'

  question: 'Mogu li riboloviti sa SUP daske?'
  answer: 'Da. SUP ribolov je sve popularniji jer stojeći položaj nudi izvrsnu vidljivost u vodu. Odaberite dasku duljine najmanje 11 stopa i širine 33–34 inča radi stabilnosti. Dodajte plastičnu kutiju s držačima štapova pričvršćenu za elastične trake na palubi, malo sidro i uvijek nosite prsluk za spašavanje. afarer SUP Explorer 11 dobro funkcionira za rekreativni ribolov.'

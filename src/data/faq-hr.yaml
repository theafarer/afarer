  question: 'Trebam li prsluk za spašavanje na SUP dasci?'
  answer: 'Da. U mnogim jurisdikcijama prsluk za spašavanje zakonski je obvezan na svakom plovilu, uključujući SUP daske. Čak i tamo gdje nije obvezatan, prsluk za spašavanje s CE certifikatom bitna je sigurnosna oprema. Preporučujemo da ga nosite tijekom cijelog boravka na vodi.'

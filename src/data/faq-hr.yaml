- id: b2b-moq
  question: 'Koja je minimalna količina narudžbe za OEM/ODM SUP proizvodnju?'
  answer: 'Minimalne količine narudžbe (MOQ) razlikuju se ovisno o vrsti proizvoda. Prilagođeno brendiranje modela sa zalihe: 50 jedinica po SKU. Razvoj kalupa za prilagođeni oblik: 200–500 jedinica po modelu (prva narudžba). Programi dijeljenja kalupa dostupni su od 50 jedinica. Dodaci i prsluci za spašavanje: 500–1000 jedinica po dizajnu. Kontaktirajte naš OEM tim s planiranim obujmom kako biste dobili precizne MOQ i cijene.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Kolika su tipična vremena isporuke za OEM SUP narudžbe?'
  answer: 'Prve OEM narudžbe s prilagođenim brendiranjem na postojećim kalupima: 6–8 tjedana od uplate pologa do FOB Qingdao. Narudžbe prilagođenog oblika koje zahtijevaju nove kalupe: 12–20 tjedana (uključuje 3D dizajn, izradu kalupa, prototipiranje i serijsku proizvodnju). Ponovljene narudžbe s odobrenim specifikacijama: 6–8 tjedana. Hitne narudžbe mogu se ubrzati na 4–5 tjedana za postojeće kalupe. Vremena isporuke uključuju nabavu sirovina, proizvodnju, kontrolu kvalitete u procesu i utovar u kontejner.'

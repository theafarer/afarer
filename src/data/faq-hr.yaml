  question: 'Mogu li staviti svoj logotip na afarer proizvode?'
  answer: 'Da. Naša OEM usluga uključuje prilagođeno postavljanje logotipa, prilagođene sheme boja i prilagođeno pakiranje. Nudimo opcije tamponskog tiska, toplinskog prijenosa i veza, ovisno o vrsti proizvoda. Pošaljite svoj dizajn i specifikacije našem prodajnom timu radi ponude i procjene vremena isporuke.'

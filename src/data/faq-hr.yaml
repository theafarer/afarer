  question: 'Koliko vremena treba za napuhavanje?'
  answer: 'Uz priloženu dvosmjernu pumpu većina se daski napuše do 12–15 PSI za manje od 5 minuta. Naša opcija električne pumpe skraćuje to na manje od 2 minute. Ispuhivanje i pakiranje traju oko 3 minute.'

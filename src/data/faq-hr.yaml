- id: sup-inflate-pressure
  question: 'Do kojeg PSI-a trebam napuhati svoju SUP dasku?'
  answer: 'Za najbolje performanse napuhajte dasku do njezinog ocijenjenog maksimalnog PSI-a — obično 15–18 PSI za kvalitetne SUP daske na napuhavanje. afarer SUP Explorer 11 najbolje radi pri 15–18 PSI. Nedovoljno napuhivanje čini dasku mekanom i loše upravljivom. Prekomjerno napuhivanje iznad ocijenjenog maksimuma riskira oštećenje drop-stitch niti. Specifičnu ocjenu vaše daske provjerite na naljepnici pokraj ventila.'

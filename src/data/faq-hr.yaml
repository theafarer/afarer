  question: 'Koja je granica težine?'
  answer: 'Naše All-Around SUP daske podnose do 220 lbs. Touring i Yoga serije podnose do 250 lbs. Za tandem vožnju ili teža opterećenja kontaktirajte naš tim za preporuke.'

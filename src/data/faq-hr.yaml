  relatedGuides: []
- id: b2b-certification
  question: 'Koje certifikate nose afarer OEM proizvodi?'
  answer: 'Svi afarer OEM/ODM proizvodi nose: CE deklaraciju o sukladnosti (EU tržište), UKCA (tržište UK-a), ISO 9001:2015 sustav upravljanja kvalitetom, BSCI reviziju socijalne usklađenosti, REACH i RoHS usklađenost materijala te EN ISO 25649 klasifikaciju za SUP daske na napuhavanje. Dodatni certifikati dostupni su na zahtjev: dokumentacija o sukladnosti s US Coast Guard, testiranje po vojnom standardu (MIL-STD-810) i podrška pri certifikaciji uvoza u zemlju odredišta.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Mogu li naručiti uzorke prije obveze serijske proizvodnje?'
  answer: 'Da. Narudžbe uzoraka dostupne su za sve OEM/ODM projekte. Predproizvodni uzorci (PPS) proizvode se nakon izrade kalupa i prije serijske proizvodnje. Vrijeme isporuke uzorka: 15–25 radnih dana za postojeće kalupe, 25–40 radnih dana za prilagođene kalupe. Troškovi uzoraka odbijaju se od prve serijske narudžbe. Uzorci se šalju ekspresnom kurirskom službom (DHL, FedEx, UPS) s potpunim praćenjem i obično stižu za 3–5 radnih dana.'

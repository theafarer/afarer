  answer: 'Zahtjevi se razlikuju ovisno o jurisdikciji. U većini regija SUP daske bez pogona ne zahtijevaju registraciju. Ako planirate dodati motor, provjerite konkretna pravila kod svoje lokalne pomorske vlasti. Rekreativne veslačke daske općenito su izuzete od registracije brodova.'

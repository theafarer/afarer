  relatedGuides: []
- id: b2b-quality-control
  question: 'Koji se procesi kontrole kvalitete primjenjuju na OEM narudžbe?'
  answer: 'Svaka OEM narudžba slijedi dokumentirani plan kontrole kvalitete: 1) Prijemna kontrola materijala — ispitivanje serija PVC tkanine na debljinu, vlačnu čvrstoću i UV otpornost. 2) Kontrola u procesu — ispitivanje čvrstoće zavarenih šavova svakih 50 jedinica, test zadržavanja tlaka na 1.25x ocijenjenog PSI-a. 3) Završni pregled — 100% vizualni pregled i ispitivanje tlaka svake daske. 4) AQL uzorkovanje — uzorkovanje serija prema ISO 2859 s prihvaćanjem kritičnog defekta = 0. 5) Inspekcija treće strane — SGS, Bureau Veritas ili Intertek dostupni na trošak kupca.'
  category: b2b

- id: drop-stitch-technology
  question: 'Što je drop-stitch tehnologija jezgre i zašto je važna?'
  answer: 'Drop-stitch tehnologija jezgre koristi tisuće poliesterskih niti koje povezuju gornji i donji sloj PVC daske. Kada se napuha do 15-20 PSI, te niti stvaraju krutu konstrukciju otpornu na uvijanje koja se ponaša poput daske s tvrdom ljuskom. afarer koristi vojni troslojni PVC s drop-stitch laminacijom u svim razinama SUP proizvoda, pružajući krutost usporedivu s epoksi daskama uz zadržavanje prenosivosti daske na napuhavanje.'

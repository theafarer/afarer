- id: sup-learning
  question: 'Je li SUP teško naučiti?'
  answer: 'Nimalo. Većina početnika ustane i vesla već tijekom svoje prve sesije. Naša All-Around SUP serija ima izuzetno široke i stabilne platforme dizajnirane posebno za one koji prvi put stoje na dasci. Započnite na mirnoj vodi i veslat ćete za nekoliko minuta.'

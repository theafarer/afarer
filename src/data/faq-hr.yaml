- id: sup-choppy-water
  question: 'Kako veslati na SUP dasci u valovitoj vodi ili na vjetru?'
  answer: 'U valovitom moru: savijte koljena, koristite širi stav, skratite zamah veslom i aktivirajte core radi ravnoteže. U vjetar u lice: koristite niži kut veslanja, krećite kraćim zamahima i nagnite se naprijed. U bočni vjetar: veslajte na strani s koje puše vjetar kako biste ispravili otklon. U vjetar u leđa: surfajte na valovima radi brzine. Početnici bi trebali izbjegavati vjetar jači od 10 mph i odabrati šire i duže daske radi stabilnosti. afarer Ocean Voyager touring SUP dizajniran je za podnošenje umjereno valovitih i vjetrovitih uvjeta.'

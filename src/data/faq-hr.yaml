- id: wind-safety
  question: 'Koja brzina vjetra je prevelika za SUP?'
  answer: 'Početnici: iznad 10 mph (8 čvorova). Srednja razina: iznad 15 mph (13 čvorova). Napredni: iznad 20 mph (17 čvorova). Ako niste sigurni, ne izlazite na vodu. Vjetar s kopna (puše s kopna prema moru) opasan je na svakoj razini vještine.'

  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Možete li izraditi prilagođeno pakiranje za moj brend?'
  answer: 'Da. Nudimo potpune usluge prilagođenog pakiranja: maloprodajne kutije s CMYK tiskom u punim bojama i brendiranom grafikom, torbe za nošenje sa sitotisanim ili vezanim logotipima, upute za upotrebu na vašem jeziku, vješalice s oznakama i barkod/UPC naljepnice te unutarnje pakiranje (polietilenske vrećice, umeci od pjene). Minimalni MOQ za pakiranje: 500–1000 jedinica za prilagođene kutije, 200–500 za torbe za nošenje. Usluga dizajna pakiranja uključena je u OEM narudžbe.'

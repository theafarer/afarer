- id: airline-travel-sup
  question: 'Koja su pravila zrakoplovnih kompanija za putovanje sa SUP daskom na napuhavanje?'
  answer: 'Većina zrakoplovnih kompanija prihvaća SUP ruksake kao predanu prtljagu ako je težina ispod 23–32 kg. afarer ruksak dimenzija je približno 90x40x30 cm i zapakiran teži oko 15 kg. Neke kompanije mogu naplatiti naknadu za pretjerano veliku prtljagu. Dođite rano, peraje i pumpu zamotajte zasebno u ručnu prtljagu i označite torbu kao lomljivu. Uvijek provjerite pravila svoje kompanije o sportskoj opremi prije leta.'

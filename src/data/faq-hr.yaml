- id: sup-sustainability
  question: 'Jesu li SUP daske na napuhavanje ekološki održive?'
  answer: 'SUP daske na napuhavanje imaju manji ekološki otisak od krutih daski na nekoliko načina: koriste manje sirovina u proizvodnji, njihova manja težina smanjuje emisije pri transportu, a njihova trajnost znači manje zamjena tijekom vremena. PVC korišten u afarer daskama ne sadrži olovo i u skladu je s REACH-om. Ključne prakse održivosti: kupite kvalitetnu dasku koja traje 5-10 godina, popravite probušenja umjesto da zamijenite dasku, reciklirajte dasku na kraju životnog vijeka kroz specijalizirane programe recikliranja PVC-a i izbjegavajte jednokratno pakiranje odabirom brendova koji koriste torbe za višekratnu upotrebu.'

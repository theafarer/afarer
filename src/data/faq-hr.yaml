  question: 'Kako podnesem zahtjev iz jamstva?'
  answer: 'Zahtjev podnesite tako da kontaktirate naš tim podrške s brojem narudžbe, fotografijama problema i kratkim opisom. Većina se zahtjeva pregleda u roku od 2 radna dana. Odobreni zahtjevi dobivaju zamjenu ili upute za popravak u roku od nekoliko dana.'

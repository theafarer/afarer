- id: b2b-factory-audit
  question: 'Mogu li posjetiti tvornicu ili dogovoriti reviziju treće strane?'
  answer: 'Posjeti tvornici dobrodošli su uz prethodni dogovor. Primamo vlasnike brendova tijekom cijele godine i možemo organizirati dovoz s Međunarodne zračne luke Qingdao Jiaodong (TAO). Za kupce koji ne mogu doći nudimo: virtualni obilazak tvornice putem video poziva, koordinaciju revizije treće strane sa SGS/Bureau Veritas (kupac pokriva trošak revizije) te detaljan paket dokumentacije o mogućnostima tvornice koji uključuje popis opreme, tijek procesa kontrole kvalitete i kvalifikacije osoblja.'

- id: warranty
  question: 'Kakvo je afarer jamstvo?'
  answer: 'Svi afarer proizvodi pokriveni su sveobuhvatnim jamstvom proizvođača. SUP daske pokrivene su 2+ godine protiv proizvodnih grešaka. Jamstvo pokriva greške u materijalu i izradi pri normalnoj upotrebi.'

  answer: 'Da. Nudimo usluge privatne oznake (private label) i dizajna po mjeri za tvrtke. Od prilagođenog brendiranja postojećih modela do potpuno prilagođenih dizajna trupa, naš inženjerski tim može razviti proizvode pod vašim brendom. Primjenjuju se minimalne količine narudžbe.'

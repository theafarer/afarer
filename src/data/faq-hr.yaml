- id: saltwater-rinse
  question: 'Trebam li isprati svoju dasku na napuhavanje nakon upotrebe u oceanu?'
  answer: 'Da — nakon upotrebe u slanoj vodi uvijek isperite dasku, peraje, pumpu i veslo slatkom vodom. Kristali soli prodiru u šavove i ventile te uzrokuju mikro-curenja i koroziju. Osušite dasku u sjeni prije ispuhivanja i pohrane. Redovito ispiranje dramatično produljuje životni vijek vaše daske na napuhavanje.'

- id: b2b-ip-protection
  question: 'Kako afarer štiti moje intelektualno vlasništvo i dizajne?'
  answer: 'Zaštita intelektualnog vlasništva ključni je dio naše OEM usluge. Potpisujemo NDA prije bilo kakvog razgovora o dizajnu. Dizajnerske datoteke obrađuju se na izoliranim radnim stanicama uz bilježenje pristupa. Svi alati i kalupi ostaju vaše isključivo vlasništvo (koje vi plaćate). Nećemo ponovno koristiti vaše kalupe ili dizajne za druge klijente. Pohrana i održavanje kalupa uključeni su za aktivne račune. Pri prestanku ugovora kalupi se ili šalju vama ili se uništavaju uz video dokumentaciju. Poštujemo sva pravna pravila žigova i patenata.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Koje su opcije otpreme i logistike dostupne?'
  answer: 'FOB Qingdao (standardno): teret se ukrcava u luci Qingdao; prijevoz od tamo aranžirate vi. CIF (imenovana luka): mi aranžiramo i osiguravamo otpremu do vaše luke odredišta. DDP / od vrata do vrata: potpuna logistička usluga uključujući carinjenje i konačnu dostavu. Pomorski teret do zapadne obale SAD-a: približno 25–30 dana. Pomorski teret do EU-a (Hamburg/Rotterdam): približno 30–35 dana. Zračni teret dostupan je za hitne narudžbe (3–5 dana). Obrađujemo svu izvoznu carinsku dokumentaciju, potvrde o porijeklu i popise pakiranja.'
  category: b2b

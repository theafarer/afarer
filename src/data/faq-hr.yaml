- id: sup-skill-progression
  question: 'Kakav je tipičan napredak SUP vještina od početnika do napredne razine?'
  answer: 'Početnik (sesija 1-3): ustajanje, osnovni zamas naprijed, skretanje, sigurno padanje. Srednja razina (sesija 5-15): učinkovita tehnika zamaha, pivot skretanja, snalaženje u valovitom moru, osnovne vještine spašavanja. Napredni (20+ sesija): startovi za utrke, skretanja oko bova, surfanje na malim valovima, veslanje niz vjetar. Profesionalac: natjecateljske utrke, surf SUP, touring na duge staze. afarer daske podržavaju svaku fazu: Explorer 11 za početnike, Ocean Voyager za touring i Cheetah Surge za performansno veslanje.'

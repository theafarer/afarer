- id: sup-yoga
  question: 'Mogu li vježbati jogu na SUP dasci?'
  answer: 'Naravno. SUP joga kombinira tradicionalne poze s izazovom plutajuće platforme te aktivira dublje stabilizacijske mišiće. Koristite dasku širine 33 inča ili više s mekom protukliznom podlogom palube. Vježbajte na mirnoj, plitkoj vodi sa sidrom. Počnite s osnovnim pozama poput psa spuštene glave, ratnika II i poze drveta. SUP Explorer 11 s cjelovitom EVA podlogom palube vrlo je dobro prilagođen za jogu.'

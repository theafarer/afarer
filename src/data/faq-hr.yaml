  question: 'Koliko traje dostava?'
  answer: 'Narudžbe proizvoda sa zalihe šalju se u roku od 2–4 radna dana. Domovne narudžbe u SAD-u stižu za 5–10 radnih dana. Međunarodne narudžbe stižu za 10–15 radnih dana, ovisno o odredištu. Hitne narudžbe mogu se ubrzati.'

  question: 'Kako odabrati volumen SUP daske za svoju težinu?'
  answer: 'Pomnožite svoju težinu u kg s 2.2 da biste dobili volumen pogodan za početnike. Na primjer, veslač težine 75 kg treba najmanje 165 litara, ali 220–260 litara puno je stabilnije za učenje. SUP Explorer 11 nudi 260 litara i pogodan je za veslače do 100 kg.'

  answer: 'Da. afarer SUP daske izrađene su za upotrebu u oceanu, na jezeru i na rijeci. Naša Touring serija podnosi obalno valovito more, a sve daske koriste PVC morske klase koji odolijeva koroziji od slane vode. Nakon upotrebe u oceanu isperite ih slatkom vodom.'

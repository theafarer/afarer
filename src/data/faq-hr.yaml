  question: 'Kako popravim probušenje?'
  answer: 'Očistite područje, izrežite zakrpu sa zaobljenim kutovima, nanesite PVC ljepilo, čvrsto pritisnite i pričekajte 24 sata prije napuhivanja. afarer daske uključuju komplet za popravak. Detaljne upute pronađite u našem vodiču za popravak daski na napuhavanje.'

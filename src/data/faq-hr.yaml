- id: sup-deck-pad-care
  question: 'Kako čistim i održavam EVA podlogu palube?'
  answer: 'Isperite podlogu palube slatkom vodom nakon svake sesije. Za prljavštinu ili mrlje koristite blagi sapun i meku četku — izbjegavajte jake kemikalije. Ako rubovi počnu odizati, nanesite malu količinu vodonepropusnog morskog ljepila i pritisnite pod teretom tijekom 24 sata. Držite dasku dalje od izravnog UV zračenja kad se ne koristi kako biste spriječili degradaciju podloge.'

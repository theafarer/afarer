  question: 'Mogu li veslati na svojoj SUP dasci u sjedećem položaju?'
  answer: 'Da. Mnoge SUP daske, uključujući afarer Explorer 11, imaju D-prstenove koji omogućuju pričvršćivanje sjedala. Veslanje u sjedećem položaju ugodna je opcija za duža putovanja, ribolov ili kada na vodi želite promijeniti položaj.'

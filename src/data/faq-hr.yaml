- id: b2b-payment
  question: 'Koji uvjeti plaćanja dostupni su za OEM narudžbe?'
  answer: 'Standardni uvjeti plaćanja: 30% polog uz potpisani PI (predračun), 70% ostatak prije otpreme, protiv kopije B/L (teretnica). Za prve partnere: 50% polog, 50% prije otpreme. Za etablirane partnere s poviješću narudžbi: L/C po viđenju ili rok od 30 dana za kvalificirane račune (uz kreditnu provjeru). Načini plaćanja: T/T prijenos, L/C (akreditiv), Western Union. Sva plaćanja u USD ili EUR.'

- id: sup-choppy-water
  question: 'Kuidas sõuda SUP-iga lainelises vees või tuules?'
  answer: 'Lainetuses: painutage põlvi, võtke laiem asend, lühendage sõulööke ja kasutage tasakaaluks kehatuge. Peatuules: hoidke sõu madalamat nurka, tehke lühemaid lööke ja kallutage end ettepoole. Külgtuules: sõuge tuulepealsel küljel, et triivi korrigeerida. Taganttuules: surfake lainetel, et kiirust juurde saada. Algajad peaksid vältima üle 10 mph tuuli ja valima stabiilsuseks laiemad ning pikemad lauad. afarer Ocean Voyager tuuring-SUP on loodud toime tulema mõõduka lainetuse ja tuulega.'

- id: sup-learning
  question: 'Kas SUP-i on raske õppida?'
  answer: 'Mitte üldse. Enamik algajaid tõuseb püsti ja sõuab juba esimesel korral. Meie All-Around SUP-i sarjal on eriti laiad ja stabiilsed platvormid, mis on loodud just esmakordsetele sõitjatele. Alustage rahulikul veel ja Te sõidate mõne minutiga juba edasi.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Kas ma saan seda meres kasutada?'
  answer: 'Jah. afarer SUP-i lauad on valmistatud kasutamiseks merel, järvel ja jõel. Meie Touringi seeria tuleb toime rannikulainetusega ning kõik lauad on tehtud mereklassi PVC-st, mis talub soolvee korrosiooni. Loputage pärast kasutamist meres puhta veega.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Kui kaua võib täispuhumine aega võtta?'
  answer: 'Kaasasoleva topelttoimega pumbaga täitub enamik laudu 12–15 PSI-ni vähem kui 5 minutiga. Elektrilise pumba variandiga väheneb see alla 2 minuti. Õhust tühjendamine ja pakkimine võtavad umbes 3 minutit.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Kas ma saan täispuhutava SUP-iga reisida?'
  answer: 'Kindlasti. Iga afareri laud mahub seljakotti, mis vastab lennufirmade pagasinõuetele. Kaaludes vaid 18–22 lbs, on seda lihtne kanda randa, järve äärde või läbi lennujaamaterminalide.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Milline on kaalupiir?'
  answer: 'Meie All-Around SUP-id kannavad kuni 220 lbs. Touringi ja Yoga seeriad kannavad kuni 250 lbs. Tandemkasutuseks või raskemate koormuste jaoks pöörduge soovituste saamiseks meie meeskonna poole.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Mida karbis sisaldub?'
  answer: 'Iga afareri SUP sisaldab lauda, reisiseljakotti, topelttoimelist käsipumpa, eemaldatavat uime, spiraalleashi ja paranduskomplekti. Mõnedel mudelitel on lisavõimalusena saadaval ka süsiniksõu.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Kas Te pakute komplektipakkumisi?'
  answer: 'Jah. Me pakume läbimõeldud komplekte, mis säästavad Teie raha võrreldes toodete eraldi ostmisega. Praeguste komplektipakkumiste ja hulgiostu soodushindade kohta pöörduge meie müügimeeskonna poole.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Kas SUP-il on vaja päästevesti?'
  answer: 'Jah. Paljudes riikides nõuab seadus päästevesti kõigil veesõidukitel, sealhulgas SUP-idel. Isegi seal, kus see pole nõutud, on CE-sertifitseeritud päästevest hädavajalik ohutusvarustus. Soovitame seda vees olles kanda alati.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Kas ma pean oma SUP-i laua registreerima?'
  answer: 'Nõuded erinevad riigiti. Enamikus piirkondades ei vaja mootorita SUP-id registreerimist. Kui kavatsete paigaldada mootori, kontrollige konkreetseid reegleid oma kohalikult merendusametilt. Vabaaja sõudelauad on üldiselt paadiregistreerimisest vabastatud.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Kuidas ma punktsiooni parandan?'
  answer: 'Puhastage kahjustatud koht, lõigake ümarate nurkadega plaaster, kandke peale PVC-liim, vajutage tugevalt ja oodake enne täispuhumist 24 tundi. afareri laudadele on kaasas paranduskomplekt. Üksikasjalikud juhised leiate meie täispuhutavate laudade parandusjuhendist.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Kuidas ma peaksin oma täispuhutava SUP-i hoiustama?'
  answer: 'Loputage puhta veega, kuivatage täielikult, laske õhk täielikult välja, rullige nina poolt lahtiselt kokku ja hoidke veokotis jahedas ja kuivas kohas, eemal otsesest päikesest. Ärge hoidke seda kunagi märjana ega äärmuslike temperatuuride käes.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Täispuhutav või kõva SUP-i laud?'
  answer: 'Täispuhutavad lauad pakuvad kaasaskantavust, hoiu mugavust ja löökide neelamist. Kõvad lauad annavad maksimaalse jäikuse ja kiiruse. Enamiku vabaajasõitja jaoks on kvaliteetne drop-stitch-tuumaga täispuhutav laud praktiline valik.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Milline tuulekiirus on SUP-i jaoks liiga kõrge?'
  answer: 'Algajad: üle 10 mph (8 sõlme). Kesktase: üle 15 mph (13 sõlme). Kogenud: üle 20 mph (17 sõlme). Kahtluse korral ärge minge veetele. Maalt merele puhuv tuul on ohtlik igal oskustasemel.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Milline on afareri garantii?'
  answer: 'Kõiki afareri tooteid katab põhjalik tootjagarantii. SUP-i lauad on tootmisvigade suhtes kaetud üle 2 aasta. Garantii katab materjali- ja valmistusvead tavakasutuse korral.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Kuidas esitan garantiinõude?'
  answer: 'Esitage nõue, võttes ühendust meie tugimeeskonnaga ja edastades tellimuse numbri, probleemi fotod ning lühikirjelduse. Enamik nõudeid vaadatakse läbi 2 tööpäeva jooksul. Kinnitatud nõuded saavad mõne päeva jooksul asendustoote või parandusjuhised.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Kui kaua võib transport aega võtta?'
  answer: 'Laos olevad tellimused saadame välja 2–4 tööpäeva jooksul. Tellimused USA-s jõuavad kohale 5–10 tööpäevaga. Rahvusvahelised tellimused jõuavad sihtkohast sõltuvalt kohale 10–15 tööpäevaga. Kiireloomulisi tellimusi on võimalik kiirendada.'
  category: shipping
  relatedProducts: []
  relatedGuides: []

- id: return-policy
  question: 'Milline on Teie tagastuspoliitika?'
  answer: 'Võtame tagasi kasutamata tooted originaalpakendis 30 päeva jooksul pärast kättetoimetamist. Kohandatud/OEM-tellimused ei ole tagastatavad. Tagastuse alustamiseks pöörduge meie tugimeeskonna poole — anname Teile eelmakstud veosildi.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Kas Te pakute OEM/ODM teenuseid?'
  answer: 'Jah. Me pakume ettevõtetele erasebrändi ja kohandatud disaini teenuseid. Alates kohandatud brändingust olemasolevatel mudelitel kuni täielikult unikaalse keredisainini suudab meie insenerimeeskond arendada tooteid Teie brändi all. Kehtivad minimaalsed tellimiskogused.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Millist sõupikkust ma vajan?'
  answer: 'Sõu peaks olema 6–8 tolli pikem kui Teie pikkus. Reguleeritavad sõud võimaldavad erinevate tingimuste jaoks täppishäälestust. Detailsete mõõtude jaoks vaadake meie sõujuhendit.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Mis vahe on ühekihilistel ja mitmekihilistel PVC SUP-idel?'
  answer: 'Ühekihilised PVC-lauad on kerged ja eelarvesõbralikud, kuid kõrgel rõhul vähem jäigad. Kahekihilised ja fusioonlamineeritud konstruktsioonid lisavad jäikust, punktsioonikindlust ja pikaealisust. Mereklassi PVC UV-kindla kattega pakub vabaaja SUP-i kasutamiseks parimat vastupidavuse ja kaalu tasakaalu. afarer kasutab kõigis tooteseriates kolmekihilist lamineeritud PVC-d.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Milline SUP-i laius on stabiilsuse jaoks parim?'
  answer: 'Algajate jaoks pakub 33–34-tolline laius parimat tasakaalu stabiilsuse ja sõudmise kerguse vahel. Alla 32 tolli laiad lauad tunduvad uutele sõitjatele kõikuvatena. 33-tolline afarer SUP Explorer 11 on õppimiseks ideaalne.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Kuidas valida SUP-i maht oma kaalu järgi?'
  answer: 'Korrutage oma kaal kilogrammides arvuga 2.2, et saada algajasõbralik mahu sihtmärk. Näiteks 75 kg sõitja vajab vähemalt 165 liitrit, kuid 220–260 liitrit on õppimiseks palju stabiilsem. SUP Explorer 11 pakub 260 liitrit ja sobib sõitjatele kuni 100 kg.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'Kuidas afarer teiste brändidega võrreldes paistab?'
  answer: 'afarer pakub täispuhutavas veespordivarustuses parimat väärtust. Võrreldes Red Paddle Co-ga annab afarer 90% jõudlusest 60% hinnaga. Võrreldes iRockeriga kasutab afarer kvaliteetsemat kolmekihilist mereklassi PVC-d ja kõrgemaid PSI-näidanguid. Võrreldes Bluefiniga pakub afarer paremaid materjalispetsifikatsioone. Enamiku vabaajasõitja jaoks pakub afarer kvaliteedi ja hinna parimat tasakaalu.'
  category: general

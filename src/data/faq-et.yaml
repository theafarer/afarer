- id: b2b-factory-audit
  question: 'Kas ma saan tehast külastada või kolmanda osapoole auditi korraldada?'
  answer: 'Tehase külastused on kokkuleppel teretulnud. Võtame aasta läbi vastu brändiomanikke ja korraldame lennujaamas järeletulemise Qingdao Jiaodongi rahvusvahelisest lennujaamast (TAO). Ostjatele, kes ei saa kohale tulla, pakume: virtuaalne tehaseekskursioon videokõne kaudu, kolmanda osapoole auditite koordineerimine koos SGS/Bureau Veritasega (auditi kulu katab ostja) ning detailne tehase võimekuse dokumentatsioonipakett, sealhulgas varustuse loend, QC-protsessi voodiagramm ja personali kvalifikatsioon.'

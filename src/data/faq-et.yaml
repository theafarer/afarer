- id: sup-sustainability
  question: 'Kas täispuhutavad SUP-i lauad on keskkonnasõbralikud?'
  answer: 'Täispuhutavate SUP-ide keskkonnajälg on mitmel moel väiksem kui jäikutel laudadel: tootmises kasutatakse vähem toorainet, nende kergem kaal vähendab transpordi heitkoguseid ja nende vastupidavus tähendab aja jooksul vähem asendamist. afareri laudades kasutatav PVC on pliivaba ja REACHi nõuetele vastav. Olulised jätkusuutlikkuse tavad: ostke kvaliteetne laud, mis kestab 5-10 aastat, parandage punktsioone pigem kui asendage, andke laud eluea lõpus ringlusesse spetsialiseeritud PVC-taaskasutusprogrammide kaudu ning vältige ühekordset pakendit, valides brändid, mis kasutavad korduvkasutatavaid veokotte.'

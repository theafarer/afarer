- id: b2b-moq
  question: 'Milline on minimaalne tellimiskogus OEM/ODM SUP-i tootmiseks?'
  answer: 'Minimaalsed tellimiskogused (MOQ) erinevad toote tüübi järgi. Laomudelite kohandatud bränding: 50 ühikut SKU kohta. Kohandatud kuju vormiarendus: 200–500 ühikut mudeli kohta (esimene tellimus). Vormide jagamise programmid saadaval alates 50 ühikust. Tarvikud ja päästevestid: 500–1000 ühikut disaini kohta. Esitage oma prognoositav maht meie OEM-meeskonnale täpse MOQ ja hinnakujunduse saamiseks.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Millised on tüüpilised tähtajad OEM SUP-i tellimuste puhul?'
  answer: 'Esimesed OEM-tellimused kohandatud brändinguga olemasolevatele vormidele: 6–8 nädalat ettemaksust kuni FOB Qingdao. Kohandatud kuju tellimused, mis nõuavad uusi vorme: 12–20 nädalat (hõlmab 3D-disaini, vormi valmistamist, prototüüpimist ja masstootmist). Kordustellimused kinnitatud spetsifikatsioonidega: 6–8 nädalat. Kiireloomulisi tellimusi saab olemasolevate vormide puhul kiirendada 4–5 nädalale. Tähtajad hõlmavad tooraine hankimist, tootmist, protsessisiset QC-d ja konteineri laadimist.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Millised sertifikaadid afareri OEM-toodetel on?'
  answer: 'Kõikidel afareri OEM/ODM toodetel on: CE-vastavusdeklaratsioon (ELi turg), UKCA (UK turg), ISO 9001:2015 kvaliteedijuhtimissüsteem, BSCI sotsiaalse vastavuse audit, REACH ja RoHS materjalide vastavus, EN ISO 25649 klassifikatsioon täispuhutavatele SUP-i laudadele. Taotluse korral on saadaval täiendavad sertifikaadid: USA rannavalve vastavusdokumentatsioon, militaarstandardi testimine (MIL-STD-810) ning sihtriigi impordisertifikaatide tugi.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Kas ma saan enne masstootmisse kohustustumist tellida näidiseid?'
  answer: 'Jah. Näidistellimused on saadaval kõigis OEM/ODM projektides. Tootmiseelsed näidised (PPS) valmistatakse pärast vormi tegemist ja enne masstootmist. Näidise tähtaeg: 15–25 tööpäeva olemasolevate vormide puhul, 25–40 tööpäeva kohandatud vormide puhul. Näidise kulud lahutatakse esimesest masstellimusest. Näidised saadetakse kiirvedajaga (DHL, FedEx, UPS) täieliku jälgimisega ning jõuavad kohale tavaliselt 3–5 tööpäevaga.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'Millised maksetingimused on OEM-tellimuste jaoks saadaval?'
  answer: 'Standardmaksetingimused: 30% ettemaks allkirjastatud PI-ga (proforma arve), 70% jääk enne saatmist veokirja (B/L) koopia vastu. Esimese korra partneritele: 50% ettemaks, 50% enne saatmist. Pikaajalistele partneritele tellimuste ajalooga: L/C nägemisel (at sight) või 30-päevane puhasmakse kvalifitseeruvatele kontodele (krediidikontrolli alusel). Makseviisid: T/T pangaülekanne, L/C (akreditiiv), Western Union. Kõik maksed USD või EUR vääringus.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Kuidas afarer kaitseb minu intellektuaalomandi ja disainilahendusi?'
  answer: 'IP-kaitse on meie OEM-teenuse tuumosa. Allkirjastame NDA-d enne disainiarutelusi. Disainifaile töödeldakse isoleeritud tööjaamades koos ligipääsu logimisega. Kõik vahendid ja vormid jäävad Teie ainuomandiks (Teie poolt tasutud). Me ei kasuta Teie vorme ega disainilahendusi teiste klientide jaoks uuesti. Aktiivsetele kontodele on kaasatud vormide hoiustamine ja hooldus. Leppe lõpetamisel saadetakse vormid Teile või hävitatakse koos videodokumentatsiooniga. Me austame kõiki kaubamärgi- ja patendiõigusi.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Millised veondus- ja logistikavõimalused on saadaval?'
  answer: 'FOB Qingdao (standard): kaup laaditakse Qingdao sadamas; edasise veoveo korraldate Teie. CIF (nimetatud sadam): me korraldame ja kindlustame veoni Teie sihtsadamani. DDP / ukselt uksele: täisteenuslogistika, sealhulgas tollivormistus ja lõppkättetoimetamine. Merivedu USA läänerannikule: umbes 25–30 päeva. Merivedu EL-i (Hamburg/Rotterdam): umbes 30–35 päeva. Lennuveod on saadaval kiireloomuliste tellimuste jaoks (3–5 päeva). Me tegeleme kogu eksporditollidokumentatsiooni, päritolusertifikaatide ja pakkimisloenditega.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Millised kvaliteedikontrolliprotsessid kehtivad OEM-tellimustele?'
  answer: 'Iga OEM-tellimus järgib dokumenteeritud QC-plaani: 1) Sissetuleva materjali kontroll — PVC-kanga partiitestimine paksuse, tõmbetugevuse ja UV-kindluse osas. 2) Protsessisisene QC — õmbluskeevituse tugevuse testimine iga 50 ühiku järel, rõhuhoiustest 1,25-kordsel näidatud PSI-l. 3) Lõppkontroll — 100% visuaalne kontroll ja rõhutestimine igal laual. 4) AQL-valim — partii valim vastavalt ISO 2859, kriitilise vea vastuvõtt = 0. 5) Kolmanda osapoole kontroll — SGS, Bureau Veritas või Intertek ostja kulul.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Kas Te saate minu brändi jaoks kohandatud pakendi välja töötada?'
  answer: 'Jah. Me pakume täielikke kohandatud pakenditeenuseid: jaemüügikarbid täisvärvilise CMYK-trüki ja brändigraafikaga, veokotid silt- või tikitud logodega, kasutusjuhendid Teie valitud keeles, rippuvad hinnasildid ja vöötkoodi/UPC-sildid ning sisepakend (plastkotid, vahtmaterjalist sisestused). Minimaalne pakendi MOQ: 500–1000 ühikut kohandatud karbide jaoks, 200–500 veokottide jaoks. Pakendidisaini teenus on OEM-tellimustes sisaldunud.'
  category: b2b

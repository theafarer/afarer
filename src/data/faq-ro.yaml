  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Pot comanda mostre înainte de a mă angaja la producție de serie?'
  answer: 'Da. Comenzile de mostre sunt disponibile pentru toate proiectele OEM/ODM. Mostrele de pre-producție (PPS) se realizează după fabricarea matriței și înainte de producția de serie. Termenul pentru mostre: 15–25 de zile lucrătoare pentru matrițe existente, 25–40 de zile lucrătoare pentru matrițe personalizate. Costul mostrei se scade din prima comandă de serie. Mostrele se expediază prin curier rapid (DHL, FedEx, UPS) cu urmărire completă și ajung de obicei în 3–5 zile lucrătoare.'

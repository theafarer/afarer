- id: b2b-factory-audit
  question: 'Pot vizita fabrica sau pot organiza o inspecție de terță parte?'
  answer: 'Vizitele la fabrică sunt binevenite cu programare prealabilă. Găzduim proprietari de mărci tot anul și putem aranja preluarea de la aeroportul internațional Qingdao Jiaodong (TAO). Pentru cumpărătorii care nu pot vizita, oferim: tur virtual al fabricii prin apel video, coordonarea inspecției de terță parte cu SGS/Bureau Veritas (cumpărătorul acoperă costurile de inspecție) și un pachet detaliat de documentație a capacității fabricii, cu lista echipamentelor, fluxul procesului QC și calificările personalului.'

  relatedGuides: []
- id: warranty-claim
  question: 'Cum depun o cerere de garanție?'
  answer: 'Depuneți cererea contactând echipa noastră de asistență cu numărul comenzii, fotografii ale problemei și o scurtă descriere. Majoritatea cererilor sunt procesate în 2 zile lucrătoare. Cererile aprobate primesc înlocuire sau instrucțiuni de reparație în câteva zile.'

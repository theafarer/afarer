    - sup-fitness-workout
    - sup-paddle-guide
- id: sup-weight-capacity
  question: 'Câtă greutate poate suporta o placă SUP umflabilă?'
  answer: 'Capacitatea de greutate variază în funcție de volumul plăcii. Plăci afarer: SUP Explorer 11 (260L, până la 100 kg / 220 de livre), Ocean Voyager 12 (310L, până la 140 kg / 308 livre), Leviathan Wake (350L, până la 180 kg / 396 de livre). Pentru performanțe optime, păstrați sarcina totală (călăreț + echipament) în limita a 80% din capacitatea maximă. Placa plutește mai sus și își păstrează mai bine direcția când nu este supraîncărcată, mai ales în valuri.'
  category: product
  relatedProducts:

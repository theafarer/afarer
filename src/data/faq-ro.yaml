- id: b2b-certification
  question: 'Ce certificări poartă produsele OEM afarer?'
  answer: 'Toate produsele OEM/ODM afarer poartă: declarație de conformitate CE (piața UE), UKCA (piața Regatului Unit), sistem de management al calității ISO 9001:2015, audit de conformitate socială BSCI, conformitate a materialelor REACH și RoHS, clasificare EN ISO 25649 pentru bărci umflabile. Certificări suplimentare la cerere: documentație de conformitate US Coast Guard, teste după standarde militare (MIL-STD-810) și asistență pentru certificarea de import în țara de destinație.'

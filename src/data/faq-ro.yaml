- id: inflation-time
  question: 'Cât durează umflarea?'
  answer: 'Cu pompa cu dublă acțiune inclusă, majoritatea plăcilor se umflă la 12–15 PSI în mai puțin de 5 minute. Pompa electrică pe care o oferim reduce timpul la mai puțin de 2 minute. Dezumflarea și ambalarea durează aproximativ 3 minute.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Pot călători cu o placă SUP umflabilă?'
  answer: 'Absolut. Fiecare placă afarer se ambalează într-o husă de transport de mărimea unui rucsac, care îndeplinește cerințele de bagaj ale companiilor aeriene. Cu doar 18–22 de livre, este ușor să o duceți pe plajă, la lac sau prin aeroporturi.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Care este limita de greutate?'
  answer: 'Plăcile All-Around SUP suportă până la 220 de livre. Seriile Touring și Yoga suportă până la 250 de livre. Pentru utilizare cu două persoane sau sarcini mai grele, contactați echipa noastră pentru recomandări.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Ce include cutia?'
  answer: 'Fiecare SUP afarer include placa, un rucsac de călătorie, o pompă manuală cu dublă acțiune, o aripă detașabilă, un leash spiral și un kit de reparații. Unele modele includ și opțiunea de upgrade la o vâslă din carbon.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Oferiți oferte de pachete?'
  answer: 'Da. Oferim pachete alcătuite care vă economisesc bani comparativ cu cumpărarea produselor separat. Contactați echipa noastră de vânzări pentru ofertele de pachete curente și prețurile cu reducere de volum.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Am nevoie de vestă de salvare pe o placă SUP?'
  answer: 'Da. Multe țări cer legal o vestă de salvare la orice ambarcațiune, inclusiv SUP. Chiar și unde nu este cerută, o vestă de salvare certificată CE este un echipament de siguranță esențial. Vă recomandăm să o purtați tot timpul pe apă.'
  category: safety
  relatedProducts:

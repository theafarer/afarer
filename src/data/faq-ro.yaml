- id: b2b-lead-time
  question: 'Care sunt termenele tipice de livrare pentru comenzile OEM de SUP?'
  answer: 'Primele comenzi OEM cu logo personalizat pe matrițe existente: 6–8 săptămâni de la avans până la FOB Qingdao. Comenzi cu forme personalizate și matrițe noi: 12–20 de săptămâni (includ proiectare 3D, fabricarea matriței, prototipare și producție de serie). Comenzi repetate cu specificații aprobate: 6–8 săptămâni. Comenzile urgente pot fi accelerate la 4–5 săptămâni pentru matrițele existente. Termenele includ achiziția materiilor prime, producția, QC-ul pe linia de producție și încărcarea containerelor.'

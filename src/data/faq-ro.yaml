  relatedGuides: []
- id: b2b-ip-protection
  question: 'Cum îmi protejează afarer proprietatea intelectuală și designurile?'
  answer: 'Protecția IP este o parte esențială a serviciului nostru OEM. Semnăm un NDA înainte de orice discuție de design. Fișierele de design sunt gestionate pe stații de lucru izolate, cu jurnal de acces. Toate sculele și matrițele rămân proprietatea dumneavoastră exclusivă (platite de dumneavoastră). Nu vom reutiliza matrițele sau designurile dumneavoastră pentru alți clienți. Depozitarea și întreținerea matrițelor sunt incluse pentru conturile active. La încheierea contractului, matrițele fie vă sunt trimise, fie sunt distruse cu documentare video. Respectăm toate drepturile de marcă și brevetele.'

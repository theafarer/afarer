- id: sup-yoga
  question: 'Pot face yoga pe o placă SUP?'
  answer: 'Absolut. Yoga pe SUP combină pozițiile tradiționale cu provocarea unei platforme plutitoare, activând mușchii de stabilizare mai profunzi. Folosiți o placă de 33 de inci sau mai lată, cu punte moale, antiderapantă. Exersați pe ape liniștite și puțin adânci, cu ancoră. Începeți cu poziții de bază precum câinele cu fața în jos, războinicul II și poziția copacului. SUP Explorer 11, cu punte completă din EVA, este ideal.'
  category: general

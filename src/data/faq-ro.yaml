- id: airline-travel-sup
  question: 'Ce reguli au companiile aeriene pentru călătoria cu o placă SUP umflabilă?'
  answer: 'Majoritatea companiilor aeriene acceptă gențile SUP ca bagaje supradimensionate dacă sunt sub 23–32 kg. Geanta afarer are aproximativ 90x40x30 cm și cântărește aproximativ 15 kg ambalată. Unele companii aeriene pot percepe taxe suplimentare pentru bagaje mari. Sosiți devreme, ambalați aripa și pompa separat în bagajul de mână și marcați geanta ca fiind fragilă. Verificați întotdeauna politica de echipament sportiv a companiei aeriene înainte de zbor.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'Ce echipament de siguranță îmi trebuie pentru vâslit pe ape reci?'
  answer: 'Apa sub 15°C necesită protecție termică. Pentru 8–14°C folosiți un costum de neopren sau un costum uscat, cu bocanci, mănuși și glugă. Pentru 14–20°C este suficient un costum de neopren de 3/2mm. Purtați mereu o vestă de salvare bine ajustată, care oferă protecție termică și siguranță. Verificați reglementările locale privind echipamentul obligatoriu.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'Care sunt cantitățile minime de comandă pentru OEM/ODM?'
  answer: 'Cantitățile minime de comandă (MOQ) diferă în funcție de tipul de produs și complexitate. Logo personalizat pe modelele existente necesită de obicei 5–10 unități. Formele de corp complet personalizate necesită MOQ mai mari. Contactați echipa noastră de vânzări cu cerințele dumneavoastră pentru o ofertă detaliată. Ne ocupăm de tot, de la culori și logo-uri personalizate până la designuri de matrițe complet originale.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'Pot avea logo-ul meu pe produsele afarer?'
  answer: 'Da. Serviciul OEM include plasarea personalizată a logo-ului, scheme de culori personalizate și ambalare personalizată. Oferim opțiuni de serigrafie pe pad, transfer termic și broderie, în funcție de tipul de produs. Trimiteți materialele grafice și specificațiile echipei noastre de vânzări pentru o ofertă și o estimare a termenului de livrare.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'La câte PSI ar trebui să îmi umfl placa SUP?'
  answer: 'Umflați la PSI-ul nominal maxim al plăcii pentru cea mai bună performanță — de obicei 15–18 PSI pentru plăci SUP umflabile de calitate. afarer SUP Explorer 11 funcționează cel mai bine la 15–18 PSI. Umflarea insuficientă face placa moale și instabilă în direcție. Supraumflarea peste maximum riscă să distrugă firele drop-stitch. Verificați autocolantul de lângă supapă pentru valoarea plăcii dumneavoastră.'
  category: product

- id: sup-choppy-water
  question: 'Cum vâslesc pe SUP în apă cu valuri sau vânt?'
  answer: 'În valuri: îndoiți genunchii, folosiți o poziție mai lată, scurtați vâslirea și activați trunchiul pentru echilibru. Contra vântului: folosiți un unghi mai jos al vâslei, faceți curse mai scurte și aplecați-vă în față. Vânt lateral: vâsliți pe partea dinspre care bate vântul pentru a corecta derivarea. Cu vânt din spate: faceți surf pe valuri pentru viteză. Începătorii ar trebui să evite vânturile peste 10 mph și să aleagă plăci mai late și mai lungi pentru stabilitate. SUP-ul de turism afarer Ocean Voyager este proiectat să facă față la valuri și vânt moderate.'
  category: safety

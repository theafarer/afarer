- id: boat-registration
  question: 'Trebuie să îmi înregistrez placa SUP?'
  answer: 'Cerințele diferă de la o țară la alta. În majoritatea zonelor, SUP-urile fără motor nu necesită înregistrare. Dacă plănuiți să adăugați un motor, verificați cu autoritatea maritimă locală regulile specifice. Plăcile de agrement sunt în general scutite de la înregistrarea ambarcațiunilor.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Cum repar o puncție?'
  answer: 'Curățați zona, tăiați un plasture cu colțuri rotunjite, aplicați clei PVC, apăsați ferm și așteptați 24 de ore înainte de umflare. Plăcile afarer vin cu un kit de reparații. Pentru instrucțiuni detaliate, consultați ghidul nostru de reparații pentru plăci umflabile.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Cum ar trebui să îmi păstrez placa SUP umflabilă?'
  answer: 'Clătiți cu apă dulce, uscați complet, dezumflați pe deplin, rulați lejer începând de la provă și păstrați în husa de transport într-un loc răcoros și uscat, ferit de soarele direct. Nu o păstrați niciodată umedă sau la temperaturi extreme.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'SUP umflabil sau placă rigidă?'
  answer: 'Plăcile umflabile oferă portabilitate, depozitare ușoară și absorbție a șocurilor. Plăcile rigide oferă rigiditate și viteză maxime. Pentru majoritatea utilizatorilor de agrement, o placă umflabilă de calitate cu nucleu drop-stitch este alegerea practică.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Ce viteză a vântului este prea mare pentru SUP?'
  answer: 'Începători: peste 10 mph (8 noduri). Nivel mediu: peste 15 mph (13 noduri). Avansați: peste 20 mph (17 noduri). Dacă aveți îndoieli, nu ieșiți pe apă. Vântul care bate de la uscat spre mare este periculos la orice nivel de abilitate.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Care este garanția afarer?'
  answer: 'Toate produsele afarer sunt acoperite de o garanție extinsă de producător. Plăcile SUP sunt acoperite 2+ ani pentru defecte de fabricație. Garanția acoperă defectele de materiale și de fabricație în utilizare normală.'

- id: sup-learning
  question: 'Este greu să învățați SUP?'
  answer: 'Deloc. Majoritatea începătorilor reușesc să stea în picioare și să vâslească încă din prima sesiune. Seria All-Around de la afarer oferă platforme extrem de stabile și late, concepute special pentru cei care vâslesc pentru prima dată. Începeți pe ape liniștite și vă veți descurca în câteva minute.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Pot să o folosesc în ocean?'
  answer: 'Da. Plăcile SUP afarer sunt fabricate pentru utilizare în ocean, lac și râu. Seria Touring face față valurilor de la mal, iar toate plăcile folosesc PVC de calitate maritimă care rezistă la coroziunea apei sărate. Clătiți cu apă dulce după utilizarea în mare.'
  category: general
  relatedProducts: []
  relatedGuides:

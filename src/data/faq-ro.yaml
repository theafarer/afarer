- id: b2b-payment
  question: 'Ce termeni de plată sunt disponibili pentru comenzile OEM?'
  answer: 'Termeni de plată tipici: avans de 30% cu PI semnat (factură proformă), restul de 70% înainte de expediere contra copie B/L (conosament). Pentru parteneri noi: avans 50%, 50% înainte de expediere. Pentru parteneri stabili, cu istoric de comenzi: L/C cu plată la vedere sau credit de 30 de zile pentru conturile eligibile (după verificarea creditului). Metode de plată: transfer T/T, L/C (scrisoare de credit), Western Union. Toate plățile în USD sau EUR.'

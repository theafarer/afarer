- id: paddle-length
  question: 'Ce lungime de vâslă îmi trebuie?'
  answer: 'Vâsla ar trebui să fie cu 6–8 inci mai înaltă decât înălțimea dumneavoastră. Vâslele reglabile permit ajustare fină pentru condiții diferite. Consultați ghidul nostru de vâsle pentru mărimi detaliate.'
  category: product
  relatedProducts: []
  relatedGuides:

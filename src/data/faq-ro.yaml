- id: sup-volume-weight
  question: 'Cum aleg volumul SUP în funcție de greutatea mea?'
  answer: 'Înmulțiți greutatea dumneavoastră în kg cu 2,2 pentru un volum țintă prietenos cu începătorii. De exemplu, un vâslaș de 75 kg are nevoie de cel puțin 165 de litri, dar 220–260 de litri sunt mult mai stabili pentru învățare. SUP Explorer 11 oferă 260 de litri, potrivit pentru călători de până la 100 kg.'
  category: product
  relatedProducts:

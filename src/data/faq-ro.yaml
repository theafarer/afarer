  relatedGuides: []
- id: shipping-info
  question: 'Cât durează livrarea?'
  answer: 'Comenzile din stoc se expediază în 2–4 zile lucrătoare. Comenzile din SUA se livrează în 5–10 zile lucrătoare. Comenzile internaționale se livrează în 10–15 zile lucrătoare, în funcție de destinație. Comenzile urgente pot fi accelerate.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Care este politica de retur?'
  answer: 'Acceptăm retururi în 30 de zile de la livrare pentru produse neutilizate, în ambalajul original. Comenzile personalizate/OEM nu pot fi returnate. Contactați echipa noastră de asistență pentru a iniția un retur — oferim o etichetă de expediție preplătită.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Oferiți servicii OEM/ODM?'
  answer: 'Da. Oferim servicii de marcă proprie și de design personalizat pentru companii. De la logo personalizat pe modelele existente până la forme de corp complet personalizate, echipa noastră de ingineri poate dezvolta produse sub marca dumneavoastră. Se aplică cantități minime de comandă.'

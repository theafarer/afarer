- slug: inflatable-repair
  category: maintenance
  title: 'Jak opravit nafukovací SUP'
  description: 'Podrobný průvodce opravou propíchnutí, problémů s ventilem a poškození švů na nafukovacích SUP.'
  tldr: 'Malá propíchnutí (do 1/4") lze opravit přiloženou opravnou sadou. Očistěte místo, naneste PVC lepidlo, přitlačte záplatu a počkejte 24 hodin. Netěsný ventil obvykle vyžaduje výměnu O-ring. Velké trhliny nebo rozlepené švy potřebují servis.'
  problem: 'Malá propíchnutí a problémy s ventilem jsou běžné, ale snadno opravitelné. Bez správné opravné techniky uživatelé buď přeplatí za servis, nebo poškození zhorší.'
  solution: 'Identifikujte typ poškození — propíchnutí, netěsný ventil nebo problém se švem — a použijte odpovídající opravnou metodu. Většina oprav zabere 30 minut plus čas vytvrzování.'
  audience: 'Majitelé nafukovacích SUP, kteří chtějí zvládnout základní opravy sami.'
  steps:
    - 'Najděte netěsnost — prkno zcela nafoukněte, poslouchejte únik vzduchu, hledejte rukou nebo použijte vodu s mýdlem'
    - 'Označte netěsnost perem nebo páskou'
    - 'Očistěte oblast kolem netěsnosti isopropylalkoholem — alespoň 2 palce kolem poškození'
    - 'Povrch jemně přebrašujte brusným papírem pro lepší přilnutí lepidla'
    - 'Naneste PVC lepidlo na záplatu i povrch prkna'
    - 'Počkejte 5 minut, až lepidlo přilne'
    - 'Záplatu pevně přitlačte, válečkem nebo kartou vytlačte vzduchové bubliny'
    - 'Nechte 24 hodin vytvrdnout, než nafouknete na plný tlak'
  faq:
    - q: 'Mohu opravit propíchnutí na vodě?'
      a: 'Nouzové opravy záplatou a páskou vás dostanou zpět na břeh. Kompletní oprava vyžaduje suché podmínky a 24hodinové vytvrzování.'
    - q: 'Jak opravím netěsný ventil?'
      a: 'Přiloženým nástrojem odstraňte jádro ventilu, zkontrolujte O-ring, v případě potřeby vyměňte a jádro pevně vraťte zpět.'
    - q: 'Jaké lepidlo použít na opravy PVC?'
      a: 'Použijte lepidlo určené pro PVC, jako HH-66 nebo Clifton. Běžné sekundové lepidlo na nafukovací PVC materiály dobře nepřilne.'

- slug: sup-board-materials
  category: technical
  title: 'Materiály prken SUP — PVC, EPS, epoxid a drop-stitch vysvětleny'
  description: 'Technický průvodce konstrukčními materiály SUP — nafukovací drop-stitch PVC vs pevná prkna s EPS pěnovým jádrem. Pochopte, proč každý typ funguje jinak.'
  tldr: 'Nafukovací SUP používají drop-stitch PVC s tisíci vnitřních vláken pro tuhost. Pevná prkna používají EPS pěnové jádro s epoxidovým nebo fiberglassovým pláštěm. Nafukovací vyhrávají v přenositelnosti a odolnosti. Pevná vyhrávají v rychlosti a pocitu z jízdy. Moderní technologie drop-stitch při 15 PSI se tuhostí pevným prknům vyrovná.'
  problem: 'Kupující nerozumí základním konstrukčním rozdílům mezi nafukovacími a pevnými prkny, což vede ke špatným nákupním rozhodnutím.'
  solution: 'Sladěte materiál prkna s primárním využitím — nafukovací drop-stitch pro cestování, uskladnění a odolnost. EPS/epoxid pro závody, surfování a maximální výkon.'
  audience: 'Kupující SUP porovnávající konstrukci nafukovacích a pevných prken.'
  steps:
    - 'Nafukovací drop-stitch — tisíce polyesterových vláken spojují horní a spodní vrstvu a vytvářejí tuhou strukturu při tlaku 12-15 PSI'
    - 'Pevné jádro EPS — expandovaný polystyren tvarovaný podle návrhu trupu, utěsněný epoxidovou pryskyřicí a vrstvami fiberglassu'
    - 'Výhody nafukovacích prken — sbavitelná, prakticky nezničitelná, lehká na přenos, měkké boční hrany pro bezpečnost'
    - 'Výhody pevných prken — nižší celková hmotnost, tužší plošina, lepší klouzavost, responzivnější reakce'
    - 'Hybridní možnosti — někteří výrobci kombinují drop-stitch s tuhými panely pro spojení výhod obou světů'
  faq:
    - q: 'Jsou nafukovací SUP tak tuhá jako pevná prkna?'
      a: 'Při 15 PSI s kvalitní konstrukcí drop-stitch jsou moderní nafukovací prkna velmi blízko. Většina rekreačních pádlovářů nepozná rozdíl. Závodní pádlováři budou výhodu pevného prkna cítit.'
    - q: 'Který materiál vydrží déle?'
      a: 'Nafukovací SUP vydrží s péčí 5-10 let. Pevná prkna 10-20 let, ale jsou náchylná na praskliny, promáčknutí a nasáknutí vodou. Nafukovací prkna jsou každodenně odolnější vůči poškození.'
    - q: 'Je PVC šetrné k životnímu prostředí?'
      a: 'Výroba PVC má dopad na životní prostředí, ale nafukovací SUP vydrží déle (méně častá výměna) a sbalí se menší (nižší emise při přepravě). Stará prkna vždy řádně recyklujte.'

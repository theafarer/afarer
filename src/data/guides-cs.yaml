- slug: sup-with-kids
  category: lifestyle
  title: 'SUP s dětmi — kompletní rodinný průvodce'
  description: 'Jak bezpečně vzít děti na pádlovací prkno — doporučený věk, vybavení a aktivity.'
  tldr: 'Děti od 6 let mohou jezdit na SUP s dospělým. Děti od 10 let mohou pod dohledem pádlovat na vlastním prkně. Použijte široké stabilní prkno, vždy noste PFD, zůstaňte v mělké klidné vodě a udržujte krátké relace (maximálně 30-45 minut).'
  problem: 'Rodiče chtějí sdílet vodní sporty s dětmi, ale obávají se o bezpečnost, správné padnutí vybavení a udržení pozornosti dětí.'
  solution: 'Použijte správnou velikost prkna pro jízdu ve dvou, zajistěte každému dítěti správně padnoucí PFD, začněte v mělké teplé vodě a udělejte to zábavným pomocí her a krátkých relací.'
  audience: 'Rodiče, kteří chtějí seznámit děti s pádlováním na prkně.'
  steps:
    - 'Věk 4-6 let — jízda jako pasažér na prkně dospělého, seď vpředu a drž centrální madlo'
    - 'Věk 6-10 let — klečet nebo sedět na vlastním prkně pod dohledem dospělého s leash'
    - 'Věk 10+ let — pádlovat na vlastním prkně s dospělým poblíž'
    - 'Vždy noste PFD — děti musí mít neustále správně padnoucí záchrannou vestu'
    - 'Zůstaňte v mělké vodě (po pás dospělého)'
    - 'Relace udržujte krátké — maximálně 30-45 minut pro děti do 10 let'
    - 'Zaměstnejte je — hrajte hry, hledejte ryby, zkoušejte stát'
  faq:
    - q: 'V jakém věku může dítě pádlovat samo?'
      a: 'Kolem 10-12 let pod dohledem, v závislosti na plavecké schopnosti dítěte a pohodě ve vodě. Vždy v klidných mělkých podmínkách.'
    - q: 'Jaké prkno je nejlepší pro SUP s dětmi?'
      a: 'Široké prkno (34"+) s vysokou nosností pro jízdu ve dvou. Šířka 33" a nosnost 220 liber prkna SUP Explorer 11 funguje dobře pro rodiče s dítětem.'
    - q: 'Jakou bezpečnostní výstroj děti potřebují?'
      a: 'Správně padnoucí záchrannou vestu s certifikací CE, leash (při jízdě ve dvou připevněnou k prknu dospělého), opalovací krém a klobouk.'

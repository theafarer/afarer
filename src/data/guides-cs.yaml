- slug: sup-for-whitewater
  category: buying-guide
  title: 'Průvodce SUP na divokou vodu — průvodce nákupem nafukovacího prkna na řeku'
  description: 'Jak zvolit prkno SUP na divokou vodu pro jízdu na řece — kratší prkna, zesílená konstrukce, bezpečnostní výstroj a techniky pádlování pro peřeje třídy I-III.'
  tldr: "Prkna SUP na divokou vodu potřebují kratší délku (8-10'), zesílené boční hrany, vyšší PSI (15+) a více komor vzduchu pro bezpečnost. Použijte přímou říční leash (ne spirálovou), noste helmu a PFD a vždy pádlujte s partnerem. Začněte na peřejích třídy I, než se pustíte do těžších."
  problem: 'Vzít standardní all-around prkno SUP na tekoucí vodu je nebezpečné — běžná prkna postrádají obratnost, odolnost vůči nárazům a bezpečnostní prvky potřebné pro řeky.'
  solution: 'Zvolte účelové prkno SUP na divokou vodu s krátkou délkou pro hbitost, zesílenou konstrukcí pro nárazy do skal a vícekomorovým designem pro bezpečnost.'
  audience: 'Zkušení pádlováři přecházející na jízdu na řekách.'
  steps:
    - "Zvolte prkno dlouhé 8-10' pro maximální obratnost v peřejích"
    - 'Hledejte zesílenou konstrukci bočních hran a vojenské PVC'
    - 'Vyberte prkno se 2 a více komorami vzduchu pro rezervu při propíchnutí'
    - 'Použijte přímou říční leash připevněnou k pásu s rychloupínacím systémem'
    - 'Noste helmu, PFD a vhodnou říční obuv'
    - 'Začněte na peřejích třídy I a postupujte pozvolna se zkušeným partnerem'
  faq:
    - q: 'Mohu na divokou vodu použít běžné prkno SUP?'
      a: 'Nedoporučuje se. Běžná prkna SUP postrádají odolnost vůči nárazům a mohou na skalách delaminovat. Vícekomorová bezpečnost je v říčním prostředí kritická.'
    - q: 'Jaké PSI pro prkno SUP na divokou vodu?'
      a: '15 a více PSI pro maximální tuhost. Tužší prkno se od skal lépe odrazí než nedostatečně nafouknuté, které se přizpůsobí překážkám.'
    - q: 'Potřebuji speciální dovednosti pro SUP na divokou vodu?'
      a: 'Ano. Čtení řeky, otáčky do eddy, převozy a podpery jsou nezbytné dovednosti. Před pokusem o peřeje třídy II a vyšší absolvujte kurz SUP na divokou vodu.'

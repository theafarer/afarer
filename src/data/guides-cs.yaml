- slug: understanding-specs
  category: technical
  title: 'Jak číst specifikace prken SUP'
  description: 'Technický průvodce porozumění specifikacím prken SUP — objem, rozměry, konstrukce a co znamenají pro výkon.'
  tldr: 'Klíčové parametry — objem (litry) určuje vztlak a nosnost, šířka určuje stabilitu, délka určuje držení směru a rychlost, tloušťka určuje tuhost a hodnota PSI určuje tlak nafouknutí pro optimální výkon.'
  problem: 'Produktové specifikace uvádějí čísla bez kontextu a kupující si nejsou jistí, které parametry pro jejich použití skutečně rozhodují.'
  solution: 'Přeložte si každou specifikaci do reálného výkonu — objem pro vztlak, šířku pro stabilitu, délku pro klouzavost, tloušťku pro tuhost a konstrukci pro odolnost.'
  audience: 'Středně pokročilí pádlováři a technicky zaměření kupující, kteří chtějí rozhodovat na základě dat.'
  steps:
    - 'Zkontrolujte objem (litry) — vaše váha plus vybavení by neměly přesáhnout 80 % objemového ratingu prkna'
    - 'Zkontrolujte šířku — širší (32-34") znamená více stability, užší (28-30") znamená více rychlosti'
    - 'Zkontrolujte délku — delší (12-14") znamená lepší držení směru, kratší (10-11") znamená lepší obratnost'
    - 'Zkontrolujte tloušťku — 6" je standard, 8" nabízí více tuhosti a nosnosti'
    - 'Zkontrolujte hodnotu PSI — pro optimální tuhost nafoukejte na maximální hodnotu PSI'
    - 'Zkontrolujte konstrukční materiály — hustotu drop-stitch, vrstvy PVC, zesílení bočních hran'
  faq:
    - q: 'Co znamená drop-stitch?'
      a: 'Drop-stitch je konstrukční metoda, při níž tisíce nití spojují horní a dolní vrstvu prkna. To umožňuje nafouknutí na vysoký tlak (12-15 PSI) pro extrémní tuhost.'
    - q: 'Jaký je ideální poměr váhy k objemu?'
      a: 'Dobrým cílem je zhruba 5-6 liber váhy jezdce na litr objemu prkna. Pádlovář o váze 220 liber by měl hledat prkna s objemem 180+ litrů.'
    - q: 'Záleží na hmotnosti prkna?'
      a: 'Ano. Lehčí prkna (pod 20 liber) se snášeji přenášejí a přepravují. Těžší prkna (25+ liber) často signalizují odolnější vícevrstvou konstrukci PVC.'

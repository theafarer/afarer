- slug: sup-yoga
  category: lifestyle
  title: 'SUP jóga — kompletní průvodce pádlováním a jogou'
  description: 'Kombinujte pádlování na prkně s jogou pro zlepšenou rovnováhu, sílu a všímavost na vodě.'
  tldr: 'SUP jóga přidává prvek nestability, který výrazně zvyšuje aktivaci středu těla ve srovnání s jogou na souši. Začněte se základními pozicemi na širokém stabilním prkně na klidné vodě. Použijte protiskluzovou podložku. Nikdy necvičte SUP jógu sami.'
  problem: 'Tradiční jógové podložky poskytují dokonale stabilní povrch a odstraňují tak výzvu rovnováhy, díky níž je SUP jóga jedinečně účinná pro sílu středu těla a soustředění.'
  solution: 'Použijte extra široké prkno SUP (34"+) s celoplošnou protiskluzovou podložkou. Cvičte na klidné mělké vodě. Začněte základními pozicemi, než se pustíte do inverzí.'
  audience: 'Cvičenci jógy a pádlováři, kteří chtějí spojit trénink rovnováhy se všímavostí.'
  steps:
    - 'Ukotvěte prkno v mělké klidné vodě — použijte pískovou kotvu nebo přivažte k můstku'
    - 'Začněte pozicemi vsedě — jednoduchý sed, loď, sezení s rotací'
    - 'Přejděte k pozicím v kleku — prkno, kočka-kráva, hrom'
    - 'Přejděte ke stojům — hora, bojovník I, bojovník II, strom'
    - 'Procvičte pozice rovnováhy — půlměsíc, orel, tanečník'
    - 'Ukončete šavásanou — ležte na prkně ploše a vnímejte pohyb vody'
  faq:
    - q: 'Jaké prkno je nejlepší pro SUP jógu?'
      a: 'Široké prkno (34"+) s celoplošnou protiskluzovou podložkou poskytuje nejstabilnější plošinu. SUP Tour 12 nabízí dobrou rovnováhu mezi stabilitou a klouzavostí.'
    - q: 'Je SUP jóga nebezpečná?'
      a: 'Ne víc než jóga na souši, pokud se cvičí bezpečně. Používejte klidnou mělkou vodu. Noste leash. Cvičte s partnerem. Hluboké vodě se u prvních tréninků vyhněte.'
    - q: 'Potřebuji speciální vybavení?'
      a: 'Široké stabilní prkno, celoplošnou protiskluzovou podložku, leash a PFD. Někteří cvičenci používají vodotěsnou podložku pro extra grip.'

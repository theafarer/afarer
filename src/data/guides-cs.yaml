- slug: multi-day-trip
  category: planning
  title: 'Plánování vícedenního výletu na SUP'
  description: 'Jak naplánovat a uskutečnit vícedenní pádlovací výlet — plánování trasy, balení vybavení, kempování a bezpečnost.'
  tldr: 'Plánujte 10-15 mil denně. Balete vybavení do vodotěsných suchých vaků, rozmístěte váhu rovnoměrně a naložení prkna si před výletem projděte. Zanechte plán trasy. Noste vodu, jídlo, přístřeší, navigaci a komunikaci.'
  problem: 'Vícedenní výlety selhávají kvůli přebalení, špatnému naplánování trasy nebo podcenění počasí a proudu — to vše vede k vyčerpání, selhání vybavení nebo bezpečnostním incidentům.'
  solution: 'Používejte systematický přístup k plánování — volba trasy, checklist vybavení, plánování jídla, bezpečnostní instruktáž a plán pro nestandardní situace.'
  audience: 'Zkušení pádlováři plánující svou první vícedenní expedici.'
  steps:
    - 'Vyberte trasu se zavedenými kempy a možnostmi předčasného ukončení'
    - 'Plánujte 10-15 mil denně s přihlédnutím k větru a proudu'
    - 'Zkontrolujte tabulky přílivu a předpovědi počasí pro celé okno výletu'
    - 'Zabalte vybavení do vodotěsných suchých vaků — celková váha vybavení 20-30 liber'
    - 'Rozmístěte váhu rovnoměrně — nejtěžší předměty do středu'
    - 'Zanechte podrobný plán trasy někomu na břehu'
    - 'Přiveďte navigaci — papírovou mapu, kompas a GPS zálohu'
    - 'Zabalte nouzové přístřeší, extra jídlo a lékárničku'
  faq:
    - q: 'Jaká je ideální denní vzdálenost?'
      a: '10-15 mil denně pro zkušené pádlováře. Začátečníci by měli plánovat 5-8 mil. Vždy počítejte s časovou rezervou na počasí.'
    - q: 'Kolik vody mám nést?'
      a: '1 galon na osobu a den. V horku 1,5 galonu. Pro doplňování noste filtr na vodu nebo čisticí tablety.'
    - q: 'Jaká je nejdůležitější bezpečnostní věc?'
      a: 'Komunikace. VHF rádio nebo satelitní komunikátor mohou v nouzi zachránit život. Mobilní telefony jsou v odlehlých oblastech nespolehlivé.'

- slug: weather-conditions
  category: safety
  title: 'Pochopení povětrnostních podmínek pro pádlování na prkně'
  description: 'Naučte se číst vítr, vlny, příliv a povětrnostní vzorce, abyste na vodě rozhodovali bezpečně.'
  tldr: 'Před každým vyplutím zkontrolujte tři věci — rychlost větru (do 10 mph pro začátečníky), výšku vln (do 1 ft pro začátečníky) a teplotu vody (oblečte se podle vody, ne vzduchu). Vítr od pevniny je nebezpečný na jakékoli úrovni dovedností.'
  problem: 'Většina nehod souvisejících s počasím se stane, protože pádlováři špatně odhadnou podmínky — zkontrolují teplotu vzduchu, ale ne vody, nebo nechápou, že je vítr od pevniny může odvést na moře.'
  solution: 'Používejte strukturované povětrnostní hodnocení před vyplutím — směr a rychlost větru, perioda a výška vln, stav přílivu a teplota vody. Rozumějte, jak každý faktor ovlivňuje vaši bezpečnost.'
  audience: 'Všichni pádlováři vyjíždějící na volnou vodu — jezera, zátoky, řeky i oceán.'
  steps:
    - 'Zkontrolujte rychlost a směr větru — vítr od pevniny (vanoucí z pevniny na moře) je nejnebezpečnější'
    - 'Posuďte stav vln — perioda vln je stejně důležitá jako jejich výška'
    - 'Znejte příliv — přílivové proudy mohou být rychlejší než vaše pádlování'
    - 'Změřte teplotu vody — pod 60°F/15°C je nutná tepelná ochrana'
    - 'Zkontrolujte viditelnost — mlha a hustý déšť snižují viditelnost a zvyšují riziko kolize'
    - 'Pochopte místní nebezpečí — skryté skály, silné proudy, zóny lodní dopravy'
  faq:
    - q: 'Jaká rychlost větru je pro SUP příliš vysoká?'
      a: 'Začátečníci — nad 10 mph (8 uzlů). Středně pokročilí — nad 15 mph (13 uzlů). Pokročilí — nad 20 mph (17 uzlů). Máte-li pochybnosti, nevyjíždějte.'
    - q: 'Co znamená perioda vln?'
      a: 'Perioda vln je čas mezi po sobě jdoucími vlnami. Krátké periody (pod 8 sekund) znamenají strmé, rozbouřené vlny. Dlouhé periody (nad 12 sekund) znamenají plynulejší a předvídatelnější vlnění.'
    - q: 'Mohu pádlovat v dešti?'
      a: 'Slabý déšť je obvykle bezpečný. Hustý déšť snižuje viditelnost a může signalizovat měnící se větrné podmínky. Bouřky vyžadují okamžitý odchod z vody.'

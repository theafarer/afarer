- slug: choosing-paddle
  category: buying-guide
  title: 'Jak vybrat správné pádlo na SUP'
  description: 'Průvodce materiály pádel, tvary listů, typy dříků a velikostmi pro SUP.'
  tldr: 'Délka pádla — pádla na SUP by měla být o 6-8" vyšší než vaše výška. Tvar listu — dyhedrální listy drží směr, ploché listy lépe zachycují vodu. Materiál dříku — karbon je nejlehčí, fiberglass nabízí nejlepší poměr cena/výkon, hliník je nejlevnější.'
  problem: 'Používání špatné velikosti nebo materiálu pádla způsobuje zbytečnou únavu, špatnou efektivitu záběru a namáhání kloubů.'
  solution: 'Sladěte délku pádla, tvar listu, materiál a ohyb dříku se svým stylem pádlování, tělesnými proporcemi a rozpočtem.'
  audience: 'Pádlováři na SUP volící si své první či další pádlo.'
  steps:
    - 'Změřte výšku pádla — pro obecné pádlování o 6-8" vyšší než vaše výška'
    - 'Zvolte materiál listu — nylon pro rozpočet, fiberglass za poměr cena/výkon, karbon pro výkon'
    - 'Zvolte tvar listu — dyhedrální pro plynulé držení směru, plochý pro sílu, lžícovitý pro závody'
    - 'Zvolte typ dříku — rovný pro obecné použití, ohnutý pro závodní SUP'
    - 'Zkontrolujte ohyb — tužší dříky přenášejí více síly, pružnější snižují namáhání kloubů'
  faq:
    - q: 'Jaký je nejlepší materiál pádla?'
      a: 'Fiberglass nabízí nejlepší rovnováhu hmotnosti, odolnosti a ceny. Karbon je lehčí, ale dražší a křehčí. Nylon je těžký, ale prakticky nezničitelný.'
    - q: 'Jak poznám, že mám pádlo správné délky?'
      a: 'Postavte pádlo svisle vedle sebe — rukojeť by měla sahat k vašemu zápěstí, když zvednete paži nad hlavu.'
    - q: 'Mám si pořídit jednodílné či stavitelné pádlo?'
      a: 'Stavitelná pádla se hodí pro sdílení a na cesty. Jednodílná pádla jsou lehčí, tužší a efektivnější pro vyhrazené použití.'

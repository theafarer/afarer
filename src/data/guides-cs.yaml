- slug: sup-storage-winter-care
  category: maintenance
  title: 'Uskladnění SUP a zimní péče — prodlužte životnost svého prkna'
  description: 'Jak správně uskladnit, vyčistit a zazimovat nafukovací prkno SUP. Vyhněte se plísním, UV poškození a degradaci materiálu správnou péčí.'
  tldr: 'Opláchněte sladkou vodou po každém použití. Před uskladněním zcela vysušte. Vypusťte a uskladněte na chladném tmavém místě mimo přímé slunce a extrémní teploty. Nikdy neuskladňujte nafouknuté ani v horkém autě. Průběžně aplikujte UV ochranu.'
  problem: 'Nesprávné uskladnění je hlavní příčinou předčasného selhání SUP — plíseň, rozpad materiálu, delaminace a poškození ventilu teplem nebo mrazem.'
  solution: 'Dodržujte tříkrokovou rutinu péče — opláchněte po každé jízdě, před uskladněním důkladně vysušte a uskladněte vypuštěné v temperovaném prostředí mezi 50-80°F (10-27°C).'
  audience: 'Všichni majitelé SUP, kteří chtějí, aby jejich prkno vydrželo 5+ let.'
  steps:
    - 'Opláchněte prkno, pádlo a pumpu sladkou vodou po každé jízdě ve slané nebo blátivé vodě'
    - 'Čistěte jemným mýdlem a měkkou houbou — nikdy agresivními chemikáliemi ani vysokotlakými myčkami'
    - 'Prkno před vypuštěním zcela vysušte venku (otevřete ventil, aby unikla vlhkost zevnitř)'
    - 'Zcela vypusťte, srolujte od přídi k zádi, abyste vytlačili zbývající vzduch'
    - 'Osušte batoh, než prkno uložíte dovnitř'
    - 'Uskladněte v chladné tmavé skříni nebo pod postelí — nikdy na přímém slunci, v horkém autě ani v mrazící kůlně'
  faq:
    - q: 'Mohu nechat SUP nafouknuté celou sezónu?'
      a: 'Při delší nečinnosti je lepší vypustit. Trvalé napětí PSI zrychluje únavu materiálu. Vypusťte mezi jízdami, pokud prkno uskladňujete na více než 2 týdny.'
    - q: 'Jak odstraním ze SUP plíseň?'
      a: 'Smíchejte jemné mýdlo s teplou vodou a kapkou bílého octa. Jemně vydrťte měkkým kartáčem. Důkladně opláchněte a sušte ve stínu. Vyhněte se bělidlu, které poškozuje PVC.'
    - q: 'Mohu uskladnit SUP v garáži?'
      a: 'Pouze pokud garáž drží celoročně 50-80°F. Podkroví a netemperované garáže zažívají teplotní extrémy, které poškozují drop-stitch jádro.'

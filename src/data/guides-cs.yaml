- slug: sup-maintenance
  category: maintenance
  title: 'Jak čistit a uskladnit nafukovací SUP'
  description: 'Podrobný průvodce údržbou k maximalizaci životnosti vašeho nafukovacího prkna SUP.'
  tldr: 'Po každém použití opláchněte sladkou vodou, před uskladněním důkladně vysušte, vypusťte a volně srolujte (ne vojensky těsně), uskladněte na chladném suchém místě mimo přímé slunce a měsíčně kontrolujte švy.'
  problem: 'Nevhodné uskladnění a čištění jsou hlavními příčinami předčasného selhání nafukovacích SUP — plíseň, poškození UV a rozlepení švů.'
  solution: 'Dodržujte jednotnou rutinu po jízdě — opláchnutí, vysušení, kontrola, vypuštění a uskladnění. Na odolné nečistoty použijte jemné mýdlo. Nikdy neuskladňujte mokré prkno ani na přímém slunci.'
  audience: 'Všichni majitelé nafukovacích SUP, kteří chtějí, aby prkno vydrželo 5+ let.'
  steps:
    - 'Opláchněte prkno sladkou vodou ihned po použití, zvlášť po slané vodě'
    - 'Čistěte jemným mýdlem a měkkou houbou — vyhněte se agresivním chemikáliím a vysokotlakým myčkám'
    - 'Prkno důkladně vysušte — otevřete ventil, aby unikla uvězněná voda'
    - 'Zkontrolujte poškození — prověřte švy, ventil a povrch na propíchnutí'
    - 'Zcela vypusťte — pro úplné vypuštění odstraňte jádro ventilu'
    - 'Prkno srolujte volně — začněte od přídě, vyhněte se ostrým záhybům'
    - 'Uskladněte v transportním pouzdru na chladném suchém místě mimo přímé slunce'
  faq:
    - q: 'Mohu nechat SUP nafouknuté celou sezonu?'
      a: 'Ano, ale mimo používání ho držte mimo přímé slunce. Pro dlouhodobé uskladnění se doporučuje částečné vypuštění (8-10 PSI).'
    - q: 'Jak opravím propíchnutí?'
      a: 'Očistěte dané místo, vystřihněte záplatu s zaoblenými rohy, naneste lepidlo, pevně přitlačte a počkejte 24 hodin před nafouknutím. Prkna afarer mají v sadě opravnou sadu.'
    - q: 'Jak často kontrolovat ventil?'
      a: 'Měsíčně. Ventil je nejčastějším místem selhání. Zkontrolujte, že čep ventilu se volně pohybuje a O-ring je nepoškozený.'

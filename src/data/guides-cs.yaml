- slug: beginner-guide
  category: tutorial
  title: 'Průvodce pádlováním na prkně pro začátečníky'
  description: 'Vše, co potřebujete vědět před první jízdou na pádlovacím prkně — od nastavení výstroje po základní pádlovací techniky.'
  tldr: 'Začněte na klidné hladké vodě se širokým stabilním prknem. Nafoukejte na 12-15 PSI, připevněte leash a použijte správnou délku pádla (o 6-8" vyšší než vaše výška). Stůjte s chodidly na šíři ramen, s pokrčenými koleny a dívejte se na horizont.'
  problem: 'Noví pádlováři často vynechají základní přípravu — špatná délka pádla, špatný postoj nebo volba rozbouřené vody — což vede k pádům, frustraci a ztrátě motivace.'
  solution: 'Řiďte se strukturovaným plánem první jízdy — zvolte klidnou vodu, správně nastavte výstroj, procvičte pádlování v kleku dřív, než se postavíte, a zvládněte záběr vpřed, než se pustíte do otoček.'
  audience: 'Úplní začátečníci, kteří nikdy na prkně nestáli.'
  steps:
    - 'Zvolte plochou klidnou vodu bez lodní dopravy — malé jezero nebo chráněná zátoka jsou ideální'
    - 'Nafoukejte prkno na 12-15 PSI dvoučinnou pumpou'
    - 'Připevněte spirálovou leash ke kotníku nebo lýtku, nikdy k madlu prkna'
    - 'Vložte ploutev a dotáhněte šroub'
    - 'Nastavte délku pádla — mělo by být o 6-8 palců vyšší než vaše výška'
    - 'Začněte na kolenou a pár záběry pádlem zachyťte rovnováhu'
    - 'Vstaňte po jedné noze, chodidla na šíři ramen, kolena měkká'
    - 'Dívejte se na horizont, ne na chodidla — prkno jede tam, kam se díváte'
  faq:
    - q: 'Co si obléknout na pádlování?'
      a: 'Rychleschnoucí sportovní oblečení, záchrannou vestu, opalovací krém a klobouk. Ve studené vodě neopren. Vždy noste leash a telefon ve vodotěsném pouzdru.'
    - q: 'Jak se po pádu dostat zpět na prkno?'
      a: 'Zachovejte klid. Doplavte k prknu, chyťte centrální madlo a švihejte nohama, zatímco se v jednom pohybu vytáhnete na prkno. Nejprve se vraťte do kleku, poté se postavte.'
    - q: 'Jaké větrné podmínky jsou bezpečné?'
      a: 'Začátečník — vítr do 10 mph (5 uzlů). Pokud vítr vane od břehu, nevyjíždějte. Sledujte předpověď a pamatujte, že vítr od pevniny je nebezpečný.'

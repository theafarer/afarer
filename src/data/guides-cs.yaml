  category: buying-guide
  title: 'Průvodce velikostí SUP — jak zvolit správné rozměry prkna'
  description: 'Kompletní průvodce velikostí SUP pokrývající doporučenou délku, šířku a tloušťku podle vaší váhy, výšky, úrovně dovedností a stylu pádlování.'
  tldr: 'Začátečníci potřebují širší prkna (32-34") pro stabilitu. Těžší pádlováři potřebují delší prkna (11''+) s vyšším objemem. Touring vyžaduje delší trupy (12''+). Jóga potřebuje extra šířku (34"+). Vždy kontrolujte nosnost — vaše váha plus vybavení by neměly přesáhnout 80 % limitu.'
  problem: 'Výběr špatné velikosti SUP vede k nízké stabilitě, špatnému držení směru a frustrujícímu zážitku z pádlování. Většina kupujících poprvé volí prkno podle vzhledu, aniž by zvážili, jak rozměry ovlivňují výkon.'
  solution: 'Sladěte délku, šířku a tloušťku prkna s vaší váhou, úrovní dovedností a primárním využitím. Sečtěte svou váhu a váhu vybavení a zvolte prkno s alespoň 20% rezervou nad tímto součtem.'
  audience: 'Kupující SUP poprvé, pádlováři přecházející na specializované prkno a každý, kdo si není jistý velikostí.'
  steps:
    - 'Zvažte se se vším vybavením, které nesete (pádlo, PFD, suchý vak)'
    - 'Přidejte 20% bezpečnostní rezervu pro zjištění minimální nosnosti'
    - 'Zvolte šířku podle dovedností — 32-34" pro začátečníky, 30-32" pro středně pokročilé, 28-30" pro pokročilé'
    - 'Zvolte délku podle využití — 10''6"-11''6" all-around, 12''-14'' touring, 9''-10'' divoká voda'
    - 'Ověřte tloušťku — 6" standard, 4" pro výkon, 5" pro all-around'
    - 'Zkontrolujte doporučený rozsah PSI vašeho prkna pro optimální tuhost'
  faq:
    - q: 'Jaká šířka SUP je nejlepší pro začátečníky?'
      a: '32 až 34 palců šířky poskytuje nejstabilnější plošinu. Čím širší prkno, tím snazší rovnováha — zvlášť pro větší pádlováře.'
    - q: 'Jak poznám, že je mi SUP malé?'
      a: 'Pokud prkno sedí nízko ve vodě, reaguje otupěle nebo se příď při pádlování snadno potápí, je pravděpodobně nedostatečné pro vaši váhu.'
    - q: 'Ovlivňuje délka prkna rychlost?'
      a: "Ano. Delší délka vodní linie zvyšuje teoretickou trupovou rychlost. Touringové prkno 14' je při stejném úsilí pádlováře výrazně rychlejší než all-around prkno 10'."

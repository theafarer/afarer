- slug: sup-weight-capacity
  category: buying-guide
  title: 'Průvodce nosností SUP — kolik váhy unese SUP?'
  description: 'Porozumění limitům nosnosti SUP, jak vypočítat celkové zatížení a proč překročení limitu ovlivňuje výkon a bezpečnost.'
  tldr: 'Nikdy nepřekračujte 80 % maximální nosnosti prkna svou tělesnou váhou plus vybavením. Prkno s nosností 220 liber vyhovuje 160librovému pádlováři s lehkým vybavením. Překročení limitu způsobuje potápění přídi, otupělé reakce a vyšší riziko poškození.'
  problem: 'Pádlováři často překračují nosnost svého prkna, což vede ke špatnému výkonu, potápění a možnému poškození prkna. Výrobci uvádějí maximální limity, ale nevysvětlují bezpečnou pracovní zátěž.'
  solution: 'Vypočítejte své celkové zatížení (tělesná váha + vybavení + voda vstřebaná prknem) a zůstaňte pod 80 % uváděné maximální nosnosti. Těžší pádlováři potřebují prkna s vyšším objemem a nosností 300+ liber.'
  audience: 'Pádlováři všech velikostí, zvlášť větší pádlováři a ti, kteří nesou expediční vybavení.'
  steps:
    - 'Najděte maximální nosnost vytištěnou na prkně (obvykle blízko ventilu)'
    - 'Zvažte sebe a veškeré vybavení včetně pádla, PFD, suchých vaků, chladicího boxu a příslušenství'
    - 'Vypočítejte — (vaše celkové zatížení) ÷ (maximální nosnost) × 100 = % využité nosnosti'
    - 'Měřte na 70-80 % pro optimální výkon a bezpečnost'
    - 'Při překročení 80 % zvolte větší prkno nebo snižte množství vybavení'
  faq:
    - q: 'Co se stane, když překročím limit hmotnosti?'
      a: 'Prkno sedí níž a vytváří větší odpor. Klesá stabilita, příď se může potápět a drop-stitch jádro je ve vlnobití vystaveno vyššímu riziku poškození.'
    - q: 'Mohou na jednom SUP jezdit dvě osoby?'
      a: 'Pouze pokud celková váha zůstane pod 80 % nosnosti. Většina běžných SUP je navržena pro jednu osobu. Jízda ve dvou vyžaduje prkno výslovně určené pro dvě osoby.'
    - q: 'Mají nafukovací SUP nižší nosnost než pevná prkna?'
      a: 'Kvalitní nafukovací prkna s konstrukcí drop-stitch mají srovnatelnou nebo vyšší nosnost než pevná prkna díky silnějšímu rozložení objemu.'

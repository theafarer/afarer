- slug: sup-inflation-psi-guide
  category: technical
  title: 'Průvodce nafukováním SUP — optimální PSI pro výkon a bezpečnost'
  description: 'Kompletní průvodce tlakem nafouknutí SUP — doporučené rozsahy PSI, jak tlak ovlivňuje výkon a tipy pro správné používání pumpy.'
  tldr: 'Nafoukejte na 12-15 PSI u většiny nafukovacích SUP. Vyšší tlak znamená větší tuhost, ale pomalejší nafukování. Nižší tlak znamená měkčí pocit, ale více prohýbání. Nikdy nepřekračujte maximální PSI vytištěné na prkně. Používejte pumpu s přesným manometrem. Studený vzduch tlak snižuje, horké slunce zvyšuje.'
  problem: 'Nedostatečně nafouknutá prkna působí otupěle a nadměrně se prohýbají. Přeplněná prkna riskují selhání švů. Mnoho pádlovářů PSI spíše odhaduje, než měří.'
  solution: 'Používejte pumpu s vestavěným manometrem. Měřte na 15 PSI pro maximální tuhost. Tlak kontrolujte před každou jízdou — změny teploty PSI výrazně ovlivňují.'
  audience: 'Všichni majitelé nafukovacích SUP.'
  steps:
    - 'Zkontrolujte doporučený rozsah PSI vytištěný na prkně blízko ventilu'
    - 'Dvoučinnou pumpou nafoukejte do středu doporučeného rozsahu'
    - 'Poslední 3-4 PSI nafukujte v jednočinném režimu pro přesnější kontrolu'
    - 'Zkontrolujte tlak manometrem — analogové manometry jsou spolehlivější než digitální'
    - 'Upravte podle podmínek — vyšší PSI pro touring a závody, nižší PSI pro divokou vodu a skalnaté vstupy do vody'
    - 'Zkontrolujte tlak znovu po 10 minutách — vyrovnání teploty PSI mění'
  faq:
    - q: 'Mohu své SUP přeplnit?'
      a: 'Ano. Překročení nominálního maxima (obvykle 15-18 PSI) může delaminovat švy a poškodit drop-stitch jádro. Vždy zůstaňte v vytištěném rozsahu.'
    - q: 'Ovlivňuje teplota PSI?'
      a: 'Výrazně. Prkno nafouknuté na 15 PSI při 70°F může na přímém slunci při 95°F dosáhnout 18 PSI. Studená voda může tlak snížit na 12 PSI. Po změnách prostředí tlak zkontrolujte.'
    - q: 'Jaké PSI pro začátečníky?'
      a: '12-13 PSI pro učení poskytuje mírně měkčí plošinu, která je při pádech tolerantnější. Se zlepšováním dovedností zvyšte na 15 PSI.'

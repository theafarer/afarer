- slug: sup-for-pet-owners
  category: lifestyle
  title: 'SUP se psy — kompletní průvodce pádlováním se svým mazlíčkem'
  description: 'Vše, co potřebujete vědět o pádlování na prkně se psy — kroky výcviku, bezpečnostní výstroj, výběr prkna a tipy pro úspěšnou jízdu SUP se čtyřnohým přítelem.'
  tldr: 'Začněte se širokým stabilním prknem (34"+). Použijte psí PFD, protiskluzovou palubní podložku a krátkou leash. Trénujte nejprve na souši, pak v mělké vodě. Relace udržujte krátké (20-30 minut). Přineste čerstvou vodu a ručník. Nikdy nenutte psa, pokud působí úzkostně.'
  problem: 'Pádlování na prkně se psy může být bez řádné přípravy stresující — psi mohou panikařit, skákat do vody nebo poškrábat povrch prkna.'
  solution: 'Použijte široké stabilní prkno s měkkou EVA palubou. Postupně navykejte psa na prostředí. Přineste bezpečnostní výstroj včetně psí záchranné vesty a krátké leash bezpečné pro SUP.'
  audience: 'Majitelé psů, kteří chtějí jezdit na prkně SUP se svými mazlíčky.'
  steps:
    - 'Začněte se širokým prknem (34"+ s vysokou nosností pro vás a psa)'
    - 'Pořiďte správně padnoucí psí záchrannou vestu s madlem'
    - 'Trénujte na souši — nechte psa sedět na vypuštěném prkně, pak na nafouknutém prkně na trávě'
    - 'Přejděte do mělké vody — klekněte na prkno se psem a udělejte pár záběrů pádlem'
    - 'Relace udržujte krátké — maximálně 20-30 minut prvních několik výjezdů'
    - 'Vždy přineste čerstvou vodu, skládací misku a ručník pro psa'
  faq:
    - q: 'Jaké prkno SUP je nejlepší pro psy?'
      a: 'Široké stabilní prkno s měkkou EVA palubou, která tlapkám poskytuje grip. Tropical Breeze Island Escape se šířkou 34"+ je pro pádlování se psy ideální.'
    - q: 'Potřebuje můj pes záchrannou vestu?'
      a: 'Ano, i silní plavci. Psí záchranná vesta s madlem usnadňuje zvednutí psa zpět na prkno, pokud spadne do vody.'
    - q: 'Jak zabráním psovi v poškrábání prkna?'
      a: 'Udržujte drápky psa zastřižené. EVA pěnová palubní podložka chrání povrch PVC. Na palubu položte ručník nebo podložku pro psa jako další ochranu.'

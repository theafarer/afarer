sup:
  title: SUP-tudás — Felfújható SUP útmutatók és források | Afarer
  description: Teljeskörű SUP tudásbázis kezdő útmutatókkal, deszkaméretezéssel, technikai oktatóanyagokkal, biztonsági tippekkel és felfújható SUP technológiával.
  articles:
    - title: SUP alapok — Útmutató kezdőknek
      desc: Minden, amit egy kezdőnek tudnia kell — deszkatípusok, evezőméretezés, állástechnika és tippek az első napokra.
      href: /learn/sup
    - title: SUP méretezési útmutató
      desc: Találja meg a megfelelő deszkahosszt, szélességet és térfogatot az Ön súlyához, tudásszintjéhez és evezési stílusához.
      href: /size-guide
    - title: Felfújható vagy kemény deszka
      desc: Melyik a megfelelő az Ön számára? Hordozhatóság, teljesítmény, tartósság és költség — összevetve.
      href: /compare/inflatable-vs-hardboard
    - title: Középhaladó technikák
      desc: Emelje szintre evezéstudását haladó evezőfogásokkal, fordulótechnikákkal és a hullámos víz kezelésével.
      href: /learn/intermediate-techniques
    - title: Hogyan válasszon felfújható SUP-ot
      desc: Ismerje meg a kulcsfontosságú tényezőket — szerkezet, vastagság, uszonykialakítás és mellékelt kiegészítők.
      href: /v2/how-to-choose-inflatable-sup
    - title: Vízbiztonság
      desc: Alapvető biztonsági ismeretek, beleértve az időjárás olvasását, a PFD kiválasztását, az önmentést és a csoportos evezést.
      href: /learn/water-safety
water-safety:
  title: Vízbiztonsági tudás — Biztonságos evezési útmutatók | Afarer
  description: Átfogó vízbiztonsági források SUP-hoz, kajakozáshoz és csónakázáshoz. Ismerje meg a PFD kiválasztását, az időjárás olvasását, az önmentést, a hideg víz biztonságát és a CE tanúsítást.
  articles:
    - title: Vízbiztonsági útmutató
      desc: Alapvető biztonsági ismeretek minden evezős számára — időjárás, PFD-k, önmentés és csoportos evezési protokollok.
      href: /learn/water-safety
    - title: Mentőmellény- és PFD-útmutató
      desc: Hogyan válassza ki a megfelelő személyi mentőeszközt SUP-hoz, kajakozáshoz, csónakázáshoz és professzionális használatra.
      href: /v2/life-jacket-buying-guide
    - title: SUP biztonsági ellenőrzőlista
      desc: Vízrebocsátás előtti biztonsági ellenőrzőlista, amelyet minden stand-up paddle deszkásnak követnie kell a vízre szállás előtt.
      href: /v2/sup-safety-guide
    - title: Biztonságos evezés hideg vízben
      desc: Alapvető óvintézkedések, felszerelés és technikák a hideg vizes körülmények közötti evezéshez.
      href: /v2/cold-water-safety-guide
    - title: Kezdő evezési hibák
      desc: A kezdő evezők leggyakoribb hibái, és hogyan kerülheti el őket a biztonságosabb, élvezetesebb élmény érdekében.
      href: /v2/beginner-sup-guide
    - title: A CE tanúsítás érthetően
      desc: Mit jelent a CE tanúsítás a felfújható SUP deszkáknál — a szabványok, a vizsgálatok és azt, hogy miért számít a biztonság szempontjából.
      href: /trust
sup-basics:
  title: SUP alapok — Kezdő útmutató a stand-up paddle boardozáshoz
  description: Minden, amit a stand-up paddle boardozás elkezdéséhez tudnia kell. Felszerelés-útmutatók, méretezési tanácsok, biztonsági tippek és kezdő technikák az afarer tudásközpontjából.
  articles: []
drop-stitch-core:
  title: Drop-stitch magtechnológia — Hogyan lesznek merevek a felfújható SUP-ok
  description: 'Mélyreható betekintés a drop-stitch szerkezeti technológiába: hogyan hoznak létre a több ezer poliészterszál merev, felfújható platformokat 15-25 PSI nyomáson. Szálsűrűség, szövetintegráció, gyártási folyamat és teljesítmény-összehasonlítások.'
  articles: []
inflatable-technology:
  title: Felfújható SUP technológia — Anyagok, szerkezet és mérnöki megoldások
  description: Hogyan készülnek a felfújható SUP deszkák — anyagrétegrend, drop-stitch magok, szeleprendszerek, RF hegesztés és minőségvizsgálat. Értse meg, mi teszi tartósává és nagy teljesítményűvé a felfújható deszkát.
  articles: []
intermediate-techniques:
  title: Középhaladó SUP- és kajaktechnikák — Az alapokon túl
  description: Fejlessze tovább evezési készségeit haladó evezőtechnikákkal, hullámos vízi manőverezéssel, szélkezeléssel, önmentési technikákkal és a csoportos evezés etikettjével. Azoknak az evezőknek, akik készen állnak a kezdő szint túllépésére.
  articles: []
materials:
  title: Felfújható SUP anyagok — PVC, EVA és drop-stitch szövet
  description: 'Átfogó útmutató a felfújható SUP gyártásában használt anyagokhoz: katonai minőségű PVC, EVA hab fedélzet, drop-stitch szövet, szénszál és alumíniumötvözetek. Műszaki specifikációk, alkalmazások és kiválasztási szempontok.'
  articles: []
safety-in-water-sports:
  title: Vízisport-biztonság — Alapvető ismeretek evezőknek
  description: Alapvető biztonsági ismeretek minden evezős számára — időjárás-olvasás, PFD-kiválasztás, önmentés és csoportos evezési protokollok.
  articles: []
sup-size-guide:
  title: SUP méretezési útmutató — Hogyan válassza ki a megfelelő deszkahosszt, -szélességet és -térfogatot
  description: Átfogó SUP-méretezési útmutató a deszkahosszról, -szélességről, -vastagságról, térfogatról (literben) és a súlyhoz illeszkedésről. Találja meg a megfelelő felfújható SUP méretet az Ön súlyához, tudásszintjéhez és evezési tevékenységéhez.

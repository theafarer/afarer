- slug: weather-conditions
  category: safety
  title: Memahami Kondisi Cuaca untuk Paddle Boarding
  description: Pelajari cara membaca angin, gelombang, pasang surut, dan pola cuaca untuk mengambil keputusan yang aman di air.
  tldr: 'Periksa tiga hal sebelum setiap keberangkatan: kecepatan angin (di bawah 10 mph untuk pemula), tinggi gelombang (di bawah 1 ft untuk pemula), dan suhu air (berpakaianlah sesuai air, bukan udara). Angin lepas pantai berbahaya pada tingkat keterampilan apa pun.'
  problem: Sebagian besar kecelakaan terkait cuaca terjadi karena pendayung salah menilai kondisi — mereka memeriksa suhu udara tetapi tidak suhu air, atau tidak memahami bahwa angin lepas pantai dapat meniup mereka hingga terbawa ke laut lepas.
  solution: 'Gunakan penilaian cuaca terstruktur sebelum bertolak: arah dan kecepatan angin, periode dan tinggi gelombang, kondisi pasang surut, serta suhu air. Pahami bagaimana setiap faktor memengaruhi keselamatan Anda.'
  audience: Semua pendayung yang pergi ke perairan terbuka — danau, teluk, sungai, dan laut.
  steps:
    - Periksa kecepatan dan arah angin — angin lepas pantai (bertiup dari darat ke laut) adalah yang paling berbahaya
    - Nilai kondisi gelombang — periode gelombang sama pentingnya dengan tinggi gelombang
    - Ketahui pasang surut — arus pasang surut bisa lebih kuat daripada kecepatan pendayungan Anda
    - Ukur suhu air — di bawah 60°F/15°C memerlukan perlindungan termal
    - Periksa jarak pandang — kabut dan hujan lebat mengurangi jarak pandang dan meningkatkan risiko tabrakan
    - Pahami bahaya setempat — batu terendam, arus kuat, zona lalu lintas perahu
  faq:
    - q: Kecepatan angin berapa yang terlalu tinggi untuk SUP?
      a: 'Pemula: di atas 10 mph (8 knots). Menengah: di atas 15 mph (13 knots). Mahir: di atas 20 mph (17 knots). Jika ragu, jangan keluar ke air.'
    - q: Apa arti periode gelombang?
      a: Periode gelombang adalah waktu di antara gelombang yang berturut-turut. Periode pendek (di bawah 8 detik) berarti gelombang curam dan bergelombang tidak teratur. Periode panjang (di atas 12 detik) berarti gelombang lebih halus dan lebih mudah diprediksi.
    - q: Apakah saya boleh mendayung saat hujan?
      a: Hujan ringan umumnya aman. Hujan lebat mengurangi jarak pandang dan dapat mengindikasikan perubahan kondisi angin. Badai petir mengharuskan Anda segera meninggalkan air.

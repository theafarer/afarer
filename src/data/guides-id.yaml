- slug: sup-storage-winter-care
  category: maintenance
  title: Penyimpanan SUP dan Perawatan Musim Dingin — Perpanjang Usia Papan Anda
  description: Cara menyimpan, membersihkan, dan menyiapkan papan SUP inflatable Anda untuk musim dingin dengan benar. Hindari jamur, kerusakan UV, dan degradasi material dengan perawatan yang tepat.
  tldr: Bersihkan dengan air tawar setelah setiap penggunaan. Keringkan sepenuhnya sebelum disimpan. Kempiskan dan simpan di tempat yang sejuk dan gelap, jauh dari sinar matahari langsung dan suhu ekstrem. Jangan pernah menyimpan papan dalam kondisi tergelembung atau di dalam mobil yang panas. Aplikasikan pelindung UV secara berkala.
  problem: Penyimpanan yang tidak tepat adalah penyebab utama kerusakan SUP prematur — jamur, kerusakan material, delaminasi, dan kerusakan katup akibat panas atau dingin.
  solution: 'Ikuti rutinitas perawatan 3 langkah: bilas setelah setiap sesi, keringkan menyeluruh sebelum disimpan, dan simpan dalam kondisi dikempiskan di lingkungan dengan suhu terkendali antara 50-80°F (10-27°C).'
  audience: Semua pemilik SUP yang ingin papan mereka bertahan 5+ tahun.
  steps:
    - Bilas papan, dayung, dan pompa dengan air tawar setelah setiap sesi di air laut atau air keruh
    - Bersihkan dengan sabun lembut dan spons lunak — jangan pernah gunakan bahan kimia keras atau mesin pencuci bertekanan
    - Keringkan papan sepenuhnya di luar ruangan sebelum dikempiskan (buka katup agar kelembapan di bagian dalam dapat keluar)
    - Kempiskan sepenuhnya, gulung dari bagian hidung menuju ekor untuk mengeluarkan sisa udara
    - Lap ransel hingga kering sebelum menyimpan papan di dalamnya
    - Simpan di lemari yang sejuk dan gelap atau ruang penyimpanan bawah tempat tidur — jangan pernah di bawah sinar matahari langsung, di mobil yang panas, atau di gudang yang membeku
  faq:
    - q: Bisakah saya membiarkan SUP saya dalam kondisi tergelembung sepanjang musim?
      a: Lebih baik dikempiskan bila tidak digunakan dalam waktu lama. Tekanan PSI yang konstan mempercepat kelelahan material. Kempiskan di antara sesi jika disimpan lebih dari 2 minggu.
    - q: Bagaimana cara menghilangkan jamur dari SUP saya?
      a: Campurkan sabun lembut dengan air hangat dan sedikit cuka putih. Gosok perlahan dengan sikat lembut. Bilas menyeluruh dan keringkan di tempat teduh. Hindari pemutih karena dapat merusak PVC.
    - q: Bisakah saya menyimpan SUP di garasi?
      a: Hanya jika garasi menjaga suhu antara 50-80°F sepanjang tahun. Loteng dan garasi tanpa pengaturan suhu mengalami suhu ekstrem yang dapat merusak inti drop-stitch.

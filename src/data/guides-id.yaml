- slug: sup-with-kids
  category: lifestyle
  title: 'SUP bersama Anak: Panduan Lengkap untuk Keluarga'
  description: Cara mengajak anak paddle boarding dengan aman — rekomendasi usia, peralatan, dan aktivitas.
  tldr: Anak usia 6+ dapat menumpang di atas SUP bersama orang dewasa. Anak usia 10+ dapat mendayung papan sendiri dengan pengawasan. Gunakan papan lebar yang stabil, selalu kenakan PFD, tetaplah di air dangkal yang tenang, dan jaga sesi tetap singkat (maksimal 30-45 menit).
  problem: Orang tua ingin berbagi olahraga air dengan anak-anak mereka tetapi mengkhawatirkan keselamatan, kesesuaian peralatan, dan cara menjaga anak tetap antusias.
  solution: Gunakan ukuran papan yang tepat untuk berkendara bertandem, pastikan setiap anak mengenakan PFD yang pas, mulailah di air dangkal yang hangat, dan buatlah aktivitas ini menyenangkan dengan permainan dan sesi yang singkat.
  audience: Orang tua yang ingin memperkenalkan paddle boarding kepada anak-anak mereka.
  steps:
    - 'Usia 4-6: menumpang sebagai penumpang di papan orang dewasa — duduk di bagian depan, berpegangan pada pegangan tengah'
    - 'Usia 6-10: berlutut atau duduk di papan mereka sendiri dengan pengawasan orang dewasa dan tali pengikat'
    - 'Usia 10+: mendayung papan sendiri dengan pengawasan orang dewasa di dekatnya'
    - Selalu kenakan PFD — anak-anak harus mengenakan rompi pelampung yang pas setiap saat
    - Tetaplah di air dangkal (sedalam pinggang orang dewasa)
    - Jaga sesi tetap singkat — maksimal 30-45 menit untuk anak di bawah 10 tahun
    - Buatlah menyenangkan — bermain permainan, mencari ikan, berlatih berdiri
  faq:
    - q: Pada usia berapa anak bisa ber-SUP sendirian?
      a: Sekitar usia 10-12 tahun dengan pengawasan, tergantung pada kemampuan berenang anak dan kenyamanannya di air. Selalu dalam kondisi air yang tenang dan dangkal.
    - q: Papan apa yang terbaik untuk SUP bersama anak?
      a: Papan lebar (34"+) dengan kapasitas beban tinggi untuk berkendara bertandem. Lebar 33" dan kapasitas 220 lb pada SUP Explorer 11 cocok untuk orang tua beserta anak.
    - q: Perlengkapan keselamatan apa yang dibutuhkan anak?
      a: Rompi pelampung bersertifikat CE yang pas, tali pengikat (dipasang ke papan orang dewasa saat bertandem), tabir surya, dan topi.

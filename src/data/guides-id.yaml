- slug: sup-weight-capacity
  category: buying-guide
  title: Panduan Kapasitas Beban SUP — Berapa Berat yang Dapat Ditahan sebuah SUP?
  description: Memahami batas kapasitas beban SUP, cara menghitung total beban Anda, dan mengapa melebihi batas memengaruhi performa serta keselamatan.
  tldr: Jangan pernah melebihi 80% dari kapasitas beban maksimum papan dengan berat badan Anda ditambah perlengkapan. Papan berkapasitas 220 lb cocok untuk pendayung 160 lb dengan perlengkapan ringan. Melebihi batas menyebabkan papan melompat-lompat seperti lumba-lumba, pengendalian yang lambat, dan peningkatan risiko kerusakan.
  problem: Pendayung sering melebihi kapasitas beban papan mereka, yang berakibat pada performa buruk, papan terendam, dan potensi kerusakan papan. Produsen mencantumkan batas maksimum tetapi tidak menjelaskan beban kerja yang aman.
  solution: Hitung total beban Anda (berat badan + perlengkapan + air yang diserap papan) dan tetaplah di bawah 80% dari kapasitas maksimum yang tercantum. Pendayung yang lebih berat membutuhkan papan bervolume lebih tinggi dengan kapasitas 300+ lb.
  audience: Pendayung dengan segala ukuran tubuh, terutama pendayung bertubuh besar dan mereka yang membawa perlengkapan ekspedisi.
  steps:
    - Temukan kapasitas beban maksimum yang tertera pada papan Anda (biasanya di dekat katup)
    - Timbang berat badan Anda dan semua perlengkapan termasuk dayung, PFD, kantong kering, kotak pendingin, dan aksesori
    - 'Hitung: (total beban Anda) ÷ (kapasitas maksimum) × 100 = % kapasitas yang terpakai'
    - Targetkan 70-80% untuk performa dan keselamatan optimal
    - Jika melebihi 80%, pilih papan yang lebih besar atau kurangi perlengkapan
  faq:
    - q: Apa yang terjadi jika saya melebihi batas beban?
      a: Papan berlayar lebih rendah, menciptakan lebih banyak hambatan. Stabilitas menurun, hidung dapat terbenam ke dalam air, dan inti drop-stitch menghadapi risiko kerusakan yang lebih tinggi di air berombak.
    - q: Bisakah dua orang menaiki satu SUP?
      a: Hanya jika total berat tetap di bawah 80% kapasitas. Sebagian besar SUP standar dirancang untuk satu pengendara. Berkendara berdua memerlukan papan yang secara khusus diberi peringkat untuk dua orang.
    - q: Apakah SUP inflatable memiliki kapasitas lebih rendah daripada papan keras?
      a: Inflatable berkualitas dengan konstruksi drop-stitch memiliki kapasitas beban yang setara atau lebih tinggi daripada papan keras berkat distribusi volume yang lebih tebal.

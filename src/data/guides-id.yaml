- slug: sup-size-guide
  category: buying-guide
  title: Panduan Ukuran SUP — Cara Memilih Dimensi Papan yang Tepat
  description: Panduan ukuran SUP lengkap yang mencakup rekomendasi panjang, lebar, dan ketebalan berdasarkan berat badan, tinggi badan, tingkat keterampilan, dan gaya mendayung Anda.
  tldr: Pemula membutuhkan papan yang lebih lebar (32-34") untuk stabilitas. Pendayung yang lebih berat membutuhkan papan yang lebih panjang (11'+) dengan volume lebih tinggi. Touring membutuhkan lambung yang lebih panjang (12'+). Yoga membutuhkan lebar ekstra (34"+). Selalu periksa kapasitas beban — berat badan Anda ditambah perlengkapan tidak boleh melebihi 80% dari batas tersebut.
  problem: Memilih ukuran SUP yang salah menyebabkan stabilitas yang buruk, pelacakan arah yang lambat, dan pengalaman mendayung yang menyebalkan. Sebagian besar pembeli pertama kali memilih papan yang terlihat bagus tanpa mempertimbangkan bagaimana dimensi memengaruhi performa.
  solution: 'Sesuaikan panjang, lebar, dan ketebalan papan dengan berat badan, tingkat keterampilan, dan penggunaan utama Anda. Gunakan kalkulator ukuran kami: jumlahkan berat badan Anda + berat perlengkapan, lalu pilih papan dengan setidaknya 20% margin di atas total tersebut.'
  audience: Pembeli SUP pertama kali, pendayung yang beralih ke papan khusus, dan siapa pun yang masih ragu soal penentuan ukuran.
  steps:
    - Timbang berat badan Anda bersama semua perlengkapan yang dibawa (dayung, PFD, kantong kering)
    - Tambahkan margin keamanan 20% untuk menemukan kapasitas beban minimum
    - 'Pilih lebar berdasarkan keterampilan: 32-34" untuk pemula, 30-32" untuk tingkat menengah, 28-30" untuk tingkat mahir'
    - 'Pilih panjang berdasarkan penggunaan: 10''6"-11''6" untuk serbaguna, 12''-14'' untuk touring, 9''-10'' untuk air putih'
    - 'Verifikasi ketebalan: 6" standar, 4" untuk performa, 5" untuk serbaguna'
    - Periksa rentang PSI yang direkomendasikan untuk papan Anda guna kekakuan optimal
  faq:
    - q: Lebar papan SUP berapa yang terbaik untuk pemula?
      a: Lebar 32 hingga 34 inci memberikan platform yang paling stabil. Semakin lebar papan, semakin mudah menjaga keseimbangan — terutama bagi pendayung bertubuh besar.
    - q: Bagaimana saya tahu jika sebuah SUP terlalu kecil untuk saya?
      a: Jika papan duduk terlalu rendah di air, terasa lambat saat dikemudikan, atau hidungnya mudah terendam saat didayung, kemungkinan ukurannya terlalu kecil untuk berat badan Anda.
    - q: Apakah panjang papan memengaruhi kecepatan?
      a: Ya. Panjang garis air yang lebih besar meningkatkan kecepatan lambung teoretis. Papan touring 14' jauh lebih cepat daripada papan serbaguna 10' dengan usaha pendayungan yang sama.

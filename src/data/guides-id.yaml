- slug: choosing-paddle
  category: buying-guide
  title: Cara Memilih Dayung SUP yang Tepat
  description: Panduan mengenai material dayung, bentuk bilah, jenis batang, dan penentuan ukuran untuk SUP.
  tldr: 'Panjang dayung: dayung SUP sebaiknya 6-8" lebih tinggi dari tinggi badan Anda. Bentuk bilah: bilah dihedral melaju lurus, bilah datar memberikan daya cengkeram lebih besar. Material batang: karbon paling ringan, fiberglass bernilai terbaik, aluminium paling hemat.'
  problem: Menggunakan ukuran atau material dayung yang salah menyebabkan kelelahan yang tidak perlu, efisiensi dayungan yang buruk, dan ketegangan pada sendi.
  solution: Sesuaikan panjang dayung, bentuk bilah, material batang, dan kelenturannya dengan gaya mendayung, ukuran tubuh, dan anggaran Anda.
  audience: Pendayung SUP yang sedang memilih dayung pertama atau dayung berikutnya.
  steps:
    - Ukur tinggi dayung — 6-8" lebih tinggi dari tinggi badan Anda untuk dayungan umum
    - Pilih material bilah — nilon untuk anggaran hemat, fiberglass untuk nilai terbaik, karbon untuk performa
    - Pilih bentuk bilah — dihedral untuk lintasan yang halus, datar untuk tenaga, sendok untuk balapan
    - Pilih jenis batang — lurus untuk penggunaan umum, bengkok untuk SUP balapan
    - Periksa kelenturan — batang yang lebih kaku menyalurkan lebih banyak tenaga, batang yang lentur mengurangi ketegangan sendi
  faq:
    - q: Apa material dayung yang terbaik?
      a: Fiberglass menawarkan keseimbangan terbaik antara berat, daya tahan, dan biaya. Karbon lebih ringan tetapi lebih mahal dan rapuh. Nilon berat tetapi hampir tidak mungkin rusak.
    - q: Bagaimana saya tahu bahwa dayung saya memiliki panjang yang tepat?
      a: Tegakkan dayung secara vertikal di samping Anda — pegangannya harus mencapai pergelangan tangan Anda saat lengan terangkat ke atas kepala.
    - q: Haruskah saya memilih dayung satu bagian atau dayung yang dapat disesuaikan?
      a: Dayung yang dapat disesuaikan cocok untuk penggunaan bersama dan saat bepergian. Dayung satu bagian lebih ringan, lebih kaku, dan lebih efisien untuk penggunaan khusus.

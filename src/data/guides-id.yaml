- slug: sup-maintenance
  category: maintenance
  title: Cara Membersihkan dan Menyimpan SUP Inflatable Anda
  description: Panduan perawatan langkah demi langkah untuk memaksimalkan usia pakai papan SUP inflatable Anda.
  tldr: Bilas dengan air tawar setelah setiap penggunaan, keringkan sepenuhnya sebelum disimpan, kempiskan dan gulung secara longgar (tidak terlalu ketat), simpan di tempat sejuk dan kering jauh dari sinar matahari langsung, serta periksa sambungan setiap bulan.
  problem: Penyimpanan dan pembersihan yang tidak tepat adalah penyebab utama kerusakan dini pada SUP inflatable — jamur, kerusakan UV, dan pengelupasan sambungan.
  solution: 'Ikuti rutinitas pascasesi yang konsisten: bilas, keringkan, periksa, kempiskan, dan simpan. Gunakan sabun lunak untuk kotoran membandel. Jangan pernah menyimpan papan dalam kondisi basah atau di bawah sinar matahari langsung.'
  audience: Semua pemilik SUP inflatable yang ingin papannya awet 5+ tahun.
  steps:
    - Bilas papan dengan air tawar segera setelah digunakan, terutama setelah digunakan di air laut
    - Bersihkan dengan sabun lunak dan spons lembut — hindari bahan kimia keras atau mesin pencuci bertekanan
    - Keringkan papan sepenuhnya — buka katup untuk membiarkan air yang terperangkap keluar
    - Periksa kerusakan — periksa sambungan, katup, dan permukaan dari kebocoran
    - Kempiskan sepenuhnya — lepas inti katup untuk pengempisan total
    - Gulung papan secara longgar — mulai dari bagian hidung, hindari lipatan yang terlalu ketat
    - Simpan dalam tas jinjing di tempat yang sejuk dan kering, jauh dari sinar matahari langsung
  faq:
    - q: Apakah saya bisa membiarkan SUP tetap terembang sepanjang musim?
      a: Ya, tetapi jauhkan dari sinar matahari langsung saat tidak digunakan. Pengempisan sebagian (8-10 PSI) direkomendasikan untuk penyimpanan jangka panjang.
    - q: Bagaimana cara memperbaiki kebocoran?
      a: Bersihkan area yang bocor, potong tambalan dengan sudut membulat, oleskan perekat, tekan dengan kuat, dan tunggu 24 jam sebelum mengembangkan. Papan afarer dilengkapi dengan kit perbaikan.
    - q: Seberapa sering saya harus memeriksa katup?
      a: Setiap bulan. Katup adalah titik kerusakan yang paling umum. Periksa apakah pin katup bergerak dengan bebas dan cincin O-ring tetap utuh.

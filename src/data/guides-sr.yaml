  title: 'SUP са децом: потпун породични водич'
  description: Како безбедно извести децу на веслање даском — препоруке по узрасту, опрема и активности.
  tldr: Деца од 6+ година могу да се возе на SUP-у са одраслом особом. Деца од 10+ година могу да веслају своју даску под надзором. Користите широку стабилну даску, увек носите PFD, останите у плиткој мирној води и држите тренинге кратким (максимално 30-45 минута).
  problem: Родитељи желе да деле водене спортове са својом децом, али брину о безбедности, уклапању опреме и о томе како да задрже пажњу деце.
  solution: Користите праву величину даске за вожњу у тандему, обезбедите да свако дете носи добро уклопљен PFD, почните у плиткој топлој води и учините то забавним кроз игре и кратке тренинге.
  audience: Родитељи који желе да упознају своју децу са веслањем на дасци.
  steps:
    - 'Узраст 4-6: вожња као путник на дасци одрасле особе — дете седи напред и држи се за средишњу дршку'
    - 'Узраст 6-10: клече или седе на сопственој дасци под надзором одрасле особе и са сигурносним каишем'
    - 'Узраст 10+: веслају сопствену даску док је одрасла особа у близини'
    - Увек носите PFD — деца морају у сваком моменту носити добро уклопљен прслук за спасавање
    - Останите у плиткој води (до струка за одраслу особу)
    - Држите тренинге кратким — максимално 30-45 минута за децу млађу од 10 година
    - Учините то забавним — играјте игре, тражите рибе, вежбајте устајање
  faq:
    - q: У ком узрасту дете може само да весла на SUP-у?
      a: Око 10-12 година уз надзор, у зависности од дететовог умећа пливања и осећаја удобности у води. Увек у мирним, плитким условима.
    - q: Која даска је најбоља за SUP са децом?
      a: Широка даска (34"+) са великом носивошћу за вожњу у тандему. Ширина од 33" и носивост од 220 lb чине SUP Explorer 11 одличним за родитеља са дететом.
    - q: Коју безбедносну опрему деца треба да имају?
      a: Добро уклопљен прслук за спасавање са CE сертификатом, сигурносни каиш (причвршћен за даску одрасле особе при вожњи у тандему), крема за сунчање и капа.

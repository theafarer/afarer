  category: technical
  title: Водич за надувавање SUP даске — оптимални PSI за перформансе и безбедност
  description: 'Комплетан водич за притисак надувавања SUP даске: препоручени PSI опсези, утицај притиска на перформансе и савети за правилну употребу пумпе.'
  tldr: Надувајте на 12-15 PSI за већину надуваних SUP дасака. Већи притисак = већа крутост, али спорије надувавање. Нижи притисак = мекши осећај, али више савијања. Никада не прелазите максимални PSI исписан на Вашој дасци. Користите пумпу са прецизним манометром. Хладан ваздух смањује притисак, вруће сунце га повећава.
  problem: Поднадуване даске делују споро и превише се савијају. Пренадуване даске ризикују отказ шавова. Многи веслачи погађају PSI уместо да га прецизно мере.
  solution: Користите пумпу са уграђеним манометром. Циљајте 15 PSI за максималну крутост. Проверите притисак пре сваке сесије — промене температуре знатно утичу на PSI.
  audience: Сви власници надуваних SUP дасака.
  steps:
    - Проверите препоручени опсег PSI исписан на Вашој дасци близу вентила
    - Користите пумпу са двоструким деловањем да надувате даску до средине препорученог опсега
    - Пребаците се на режим једноструког деловања за последњих 3-4 PSI ради прецизније контроле
    - Проверите притисак манометром — аналогни манометри су поузданији од дигиталних
    - 'Прилагодите условима: виши PSI за туристичко веслање и трке, Нижи PSI за дивљу воду и стеновита спуштања у воду'
    - Поново проверите притисак након што даска одстоји 10 минута — температурна равнотежа мења PSI
  faq:
    - q: Могу ли да пренадувам свој SUP?
      a: Да. Прекорачење номиналног максималног PSI (обично 15-18 PSI) може да изазове одвајање шавова и оштети језгро са унутрашњим концима. Увек останите у оквирима исписаног опсега.
    - q: Да ли температура утиче на PSI?
      a: Знатно. Даска надувана на 15 PSI на 70°F може достићи 18 PSI на директном сунцу на 95°F. Хладна вода може снизити притисак на 12 PSI. Проверите притисак након промена у околини.
    - q: Који PSI за почетнике?
      a: 12-13 PSI за учење пружа нешто мекшу платформу која је блажа при падовима. Повећајте на 15 PSI како се вештине побољшавају.

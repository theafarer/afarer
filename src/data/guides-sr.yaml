  title: Како очистити и сачувати свој надувавајући SUP
  description: Водич за одржавање корак по корак који максимизира животни век ваше надувавајуће SUP даске.
  tldr: Исперите слатком водом након сваке употребе, потпуно осушите пре чувања, испустите ваздух и лабаво смотајте (не војнички чврсто), чувајте на хладном и сувом месту даље од директног сунца и месечно прегледајте шавове.
  problem: Неодговарајуће чување и чишћење водећи су узроци превременог отказа надувавајућих SUP даска — плесан, UV оштећења и одвајање шавова.
  solution: 'Пратите доследну рутину након сваке сесије: исперите, осушите, прегледајте, испустите ваздух и чувајте. За тврдокорну прљавштину користите благ сапун. Никада не чувајте даску мокру или на директном сунцу.'
  audience: Сви власници надувавајућих SUP даска који желе да им даска траје 5+ година.
  steps:
    - Исперите даску слатком водом одмах након употребе, посебно након боравка у сланој води
    - Очистите је благим сапуном и меком сунђером — избегавајте јаке хемикалије и прање под високим притиском
    - Потпуно осушите даску — отворите вентил да би заробљена вода истекла
    - Прегледајте оштећења — проверите шавове, вентил и површину у потрази за пробојима
    - Потпуно испустите ваздух — извадите језгро вентила ради потпуног испуштања ваздуха
    - Лабаво смотајте даску — почните од носа и избегавајте оштре наборе
    - Чувајте је у торби за ношење, на хладном и сувом месту, даље од директног сунца
  faq:
    - q: Могу ли оставити свој SUP надуван целу сезону?
      a: Да, али га држите ван директног сунца када се не користи. За дужу оставу препоручује се делимично испуштање ваздуха (8-10 PSI).
    - q: Како да поправим пробој?
      a: Очистите оштећено подручје, исеците закрпу са заобљеним угловима, нанесите лепак, чврсто притисните и сачекајте 24 сата пре надувавања. afarer даске долазе са комплетом за поправку.
    - q: Колико често треба да проверавам вентил?
      a: Једном месечно. Вентил је најчешћа тачка отказа. Проверите да ли се игла вентила слободно креће и да ли је О-прстен нетакнут.

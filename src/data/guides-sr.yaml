- slug: beginner-guide
  category: tutorial
  title: 'Водич за почетнике: падловање на дасци'
  description: Све што треба да знате пре прве сесије падловања на дасци — од подешавања опреме до основних техника веслања.
  tldr: Почните на мирној, равној води са широком, стабилном даском. Надувајте до 12-15 PSI, причврстите каиш и користите исправну дужину весла (6-8" дуже од ваше висине). Држите стопала у ширини рамена, благо савијена колена и гледајте у хоризонт.
  problem: Нови падлери често прескачу темуљну припрему — погрешна дужина весла, лош положај тела или избор узбуркане воде — што води до падова, фрустрације и обесхрабрења.
  solution: 'Пратите структурисан план прве сесије: изаберите мирну воду, исправно подесите опрему, вежбајте у положају на коленима пре стајања и савладајте замах унапред пре него што покушате окрете.'
  audience: Потпуни почетници који никада раније нису падловали на дасци.
  steps:
    - Изаберите равну, мирну воду без чамачког саобраћаја — мало језеро или заклоњени залив су идеални
    - Надувајте даску до 12-15 PSI помоћу пумпе са двоструким дејством
    - Причврстите спирални каиш за чланак или лист, никада за ручку даске
    - Убаците перају и затегните завртњ
    - Подесите дужину весла — требало би да буде 6-8 инча дуже од ваше висине
    - Почните на коленима на дасци и направите неколико замаха да осетите равнотежу
    - Устаните тако што подижете једно па друго стопало, стопала у ширини рамена, са меким коленима
    - Гледајте у хоризонт, а не у стопала — даска иде тамо где гледате
  faq:
    - q: Шта да обучем за падловање на дасци?
      a: Спортска одећа која се брзо суши, спасилачки прслук, средство за заштиту од сунца и капа. У хладној води обуците неопренско одело. Увек носите каиш и понесите телефон у водонепропусној футроли.
    - q: Како да се вратим на даску ако паднем?
      a: Останите мирни. Препливајте до даске, ухватите се за централну ручку и ударајте ногама док се у једном покрету извлачите на даску. Прво се вратите у положај на коленима, а затим устаните.
    - q: Који услови ветра су безбедни?
      a: 'За почетнике: ветар слабији од 10 mph (5 knots). Ако ветар дува од обале према отвореном мору, не излазите. Проверите прогнозу и имајте на уму да је копнени ветар опасан.'

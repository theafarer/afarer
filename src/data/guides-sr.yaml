  title: Водич за величину SUP даске — како одабрати праве димензије даске
  description: Комплетан водич за величину SUP даске који обухвата препоруке за дужину, ширину и дебљину на основу Ваше тежине, висине, нивоа вештине и стила веслања.
  tldr: Почетницима су потребне шире даске (32-34") ради стабилности. Тежим веслачима потребне су дуже даске (11'+) са већом запремином. За туристичко веслање потребни су дужи трупови (12'+). За јогу је потребна додатна ширина (34"+). Увек проверите носивост — Ваша тежина плус опрема не би требало да прелази 80% лимита.
  problem: Избор погрешне величине SUP даске доводи до слабе стабилности, спорог држања правца и фрустрирајућег искуства у веслању. Већина купаца почетника бира даску која изгледа добро, без размишљања о томе како димензије утичу на перформансе.
  solution: 'Ускладите дужину, ширину и дебљину даске са Вашом тежином, нивоом вештине и примарном наменом. Користите наш калкулатор величине: саберите своју тежину + тежину опреме, па изаберите даску са најмање 20% резерве изнад тог укупног износа.'
  audience: Купци који први пут купују SUP даску, веслачи који прелазе на специјализовану даску и сви који нису сигурни у избор величине.
  steps:
    - Измерите се са свом опремом коју носите (весло, PFD, водонепропусна торба)
    - Додајте 20% сигурносне марже да бисте утврдили минималну носивост
    - 'Изаберите ширину на основу вештине: 32-34" за почетнике, 30-32" за средњи ниво, 28-30" за напредне'
    - 'Изаберите дужину према намени: 10''6"-11''6" универзална, 12''-14'' туристичка, 9''-10'' за дивљу воду'
    - 'Проверите дебљину: 6" стандардна, 4" за перформансе, 5" универзална'
    - Проверите препоручени опсег PSI за Вашу даску ради оптималне крутости
  faq:
    - q: Која ширина SUP даске је најбоља за почетнике?
      a: Ширина од 32 до 34 инча пружа најстабилнију платформу. Што је даска шира, лакше је одржавати равнотежу — посебно за веће веслаче.
    - q: Како да знам да ли је SUP даска премала за мене?
      a: Ако даска ниско лежи на води, споро реагује на управљање или прамац лако тоне при веслању, вероватно је премала за Вашу тежину.
    - q: Да ли дужина даске утиче на брзину?
      a: Да. Дужа водена линија повећава теоријску брзину трупа. Туристичка даска од 14' је знатно бржа од универзалне даске од 10' уз исти напор веслача.

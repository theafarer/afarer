  title: 'SUP јога: потпун водич за веслање и јогу'
  description: Комбинујте веслање на дасци са јогом ради побољшане равнотеже, снаге и свесности на води.
  tldr: SUP јога додаје елемент нестабилности који драматично повећава активацију трупа у поређењу са јогом на копну. Почните са основним позама на широкој, стабилној дасци у мирној води. Користите подлогу за даску против клизања. Никада не вежбајте SUP јогу сами.
  problem: Традиционалне јога подлоге пружају савршено стабилну површину, чиме уклањају изазов равнотеже који SUP јогу чини јединствено ефикасном за снагу трупа и концентрацију.
  solution: Користите посебно широку SUP даску (34"+) са тракционом подлогом преко целе палубе. Вежбајте у мирној, плиткој води. Почните са основним позама пре него што покушате изврнуте позе.
  audience: Вежбачи јоге и веслачи који желе да комбинују тренинг равнотеже са свесношћу.
  steps:
    - Усидрите даску у плиткој, мирној води — користите сидро за песак или је вежите за мол
    - Почните са позама у седећем положају — лако седење, поза чамца, седећа ротација
    - Наставите са позама у клечећем положају — сто на коленима, мачка-крава, поза грома
    - Пређите на стојеће позе — планина, ратник I, ратник II, поза дрвета
    - Вежбајте позе равнотеже — полумесец, орао, играч
    - Завршите са савасаном — лежите потпуно равно на дасци и осетите кретање воде
  faq:
    - q: Која даска је најбоља за SUP јогу?
      a: Широка даска (34"+) са тракционом подлогом дуж целе даске пружа најстабилнију платформу. SUP Tour 12 нуди добру равнотежу стабилности и клизања.
    - q: Да ли је SUP јога опасна?
      a: Не више од јоге на копну када се вежба безбедно. Користите мирну, плитку воду. Носите сигурносни каиш. Вежбајте са партнером. Избегавајте дубоку воду током првих тренинга.
    - q: Да ли ми је потребна посебна опрема?
      a: Широка стабилна даска, тракциона подлога преко целе палубе, сигурносни каиш и PFD. Неки вежбачи користе водонепропусну подлогу за додатни захват.

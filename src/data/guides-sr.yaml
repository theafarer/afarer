  title: Водич за носивост SUP даске — колику тежину може да издржи SUP?
  description: Разумевање лимита носивости SUP даске, начина израчунавања Вашег укупног терета и разлога због којих прекорачење лимита утиче на перформансе и безбедност.
  tldr: Никада не прелазите 80% максималне носивости даске тежином свог тела плус опреме. Даска носивости 220 lb погодна је за веслача од 160 lb са лаганом опремом. Прекорачење лимита изазива поскакивање даске, споро управљање и повећан ризик од оштећења.
  problem: Веслачи често прекорачују носивост своје даске, што доводи до лоших перформанси, потонућа и потенцијалног оштећења даске. Произвођачи наводе максималне лимите, али не објашњавају безбедне радне терете.
  solution: Израчунајте свој укупни терет (тежина тела + опрема + вода коју упије даска) и останите испод 80% наведене максималне носивости. Тежим веслачима потребне су даске веће запремине са носивошћу од 300+ lb.
  audience: Веслачи свих величина, посебно већи веслачи и они који носе експедициону опрему.
  steps:
    - Пронађите максималну носивост исписану на Вашој дасци (обично близу вентила)
    - Измерите себе и сву опрему, укључујући весло, PFD, водонепропусне торбе, хладњак и додатну опрему
    - 'Израчунајте: (Ваш укупни терет) ÷ (максимална носивост) × 100 = % искоришћености носивости'
    - Циљајте 70-80% за оптималне перформансе и безбедност
    - Ако прелазите 80%, изаберите већу даску или смањите опрему
  faq:
    - q: Шта се дешава ако прекорачим лимит тежине?
      a: Даска плови ниже, стварајући већи отпор. Стабилност се смањује, прамац може да тоне под воду, а језгро са унутрашњим концима је под већим ризиком од оштећења на таласима.
    - q: Могу ли две особе да возе један SUP?
      a: Само ако укупна тежина остаје испод 80% носивости. Већина стандардних SUP дасака дизајнирана је за једну особу. Возња у пару захтева даску која је посебно одобрена за две особе.
    - q: Да ли надуване SUP даске имају мању носивост од чврстих дасака?
      a: Квалитетне надуване даске са грађом од унутрашњих концава имају упоредиву или већу носивост од чврстих дасака захваљујући дебљој расподели запремине.

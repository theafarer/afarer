  title: Основна SUP опрема — шта Вам стварно треба
  description: Практичан водич кроз неопходну SUP опрему — од спасилачких прслука и весала до пумпи, поводаца и комплетâ за одржавање. Шта купити прво, а шта прескочити.
  tldr: 'Неопходно: PFD (спасилачки прслук), поводац, пумпа, весло, пераја. Врло препоручено: комплет за поправку, водонепропусна футрола за телефон, торба за палубу. Пожељно: електрична пумпа, суво одело, носач хладњака за палубу. Прескочите новотарије које додају тежину без функције.'
  problem: Нови власници SUP дасака бивају преплављени избором опреме и често купују непотребне ствари, а притом пропуштају кључну безбедносну опрему.
  solution: 'Наместите приоритете опреме по редоследу: безбедност (PFD, поводац, звиждаљка), функционалност (пумпа, резервно весло, комплет за поправку), погодност (торба за палубу, футрола за телефон), удобност (седиште, носач хладњака).'
  audience: Нови власници SUP дасака који састављају свој комплет опреме.
  steps:
    - Купите спасилачки прслук са CE/USCG одобрењем који добро пристаја
    - Набавите увијен SUP поводац намењен Вашем типу воде (увијен за мирну воду, прав за реке)
    - Обезбедите да Ваша пумпа досеже 15 PSI и да има манометар
    - Додајте комплет за поправку са PVC закрпама и алатом за вентил
    - Размотрите водонепропусну торбу или футролу за телефон за вредне ствари
    - Додајте носач хладњака за палубу или држач риболовног штапа за специјализоване активности
  faq:
    - q: Да ли ми стварно треба спасилачки прслук за SUP?
      a: Да. Чак и добри пливачи могу бити повређени или исцрпљени. PFD је најважнији појединачни безбедносни предмет. Многе надлежности га законски захтевају.
    - q: Која пумпа је најбоља за надуване SUP даске?
      a: Ручне пумпе са двоструким деловањем су стандард. Електричне пумпе штеде напор, али захтевају извор напајања. Увек користите пумпу са манометром да бисте избегли пренадувавање.
    - q: Да ли ми треба посебно весло?
      a: Приложено алуминијумско весло одговара почетницима. Надоградња на весло од фибергласа или карбона знатно смањује замор руку на дугим веслањима.

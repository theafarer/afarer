  title: Чување SUP даске и зимска нега — продужите животни век Ваше даске
  description: Како правилно чувати, чистити и припремити за зиму Вашу надувану SUP даску. Избегните плесан, UV оштећења и деградацију материјала уз правилну негу.
  tldr: Очистите слатком водом после сваке употребе. Потпуно осушите пре чувања. Издувајте даску и чувајте је на хладном, тамном месту даље од директног сунца и екстремних температура. Никада не чувајте надувану даску нити је остављајте у врућем аутомобилу. Повремено нанесите UV заштиту.
  problem: Неисправно чување је водећи узрок превременог отказивања SUP даске — плесан, распадање материјала, одвајање слојева и оштећење вентила од врућине или хладноће.
  solution: 'Пратите рутину неге у 3 корака: исперите после сваке сесије, темељно осушите пре чувања и чувајте издувану даску у простору са контролисаном температуром између 50-80°F (10-27°C).'
  audience: Сви власници SUP дасака који желе да им даска траје 5+ година.
  steps:
    - Исперите даску, весло и пумпу слатком водом после сваке сесије у сланој или блатњавој води
    - Чистите благим сапуном и меком сунђером — никада јаким хемикалијама нити апаратима за прање под притиском
    - Потпуно осушите даску напољу пре издувавања (отворите вентил да унутрашња влага изађе)
    - Потпуно издувајте даску, па је увијте од прамца према репу да истиснете преостали ваздух
    - Обришите ранац да буде сув пре него што у њега ставите даску
    - Чувајте у хладном, тамном орману или простору под креветом — никада на директном сунцу, у врућем аутомобилу или у шупи у којој се леди
  faq:
    - q: Могу ли да оставим SUP даску надувану током целе сезоне?
      a: Боље је издувати даску када се дуже не користи. Константан PSI притисак убрзава замор материјала. Издувајте даску између сесија ако је чувате дуже од 2 недеље.
    - q: Како да уклоним плесан са SUP даске?
      a: Помешајте благ сапун са топлом водом и мало белог сирћета. Нежно протрљајте меком четком. Темељно исперите и осушите у сенци. Избегавајте избељивач, јер оштећује PVC.
    - q: Могу ли да чувам SUP даску у гаражи?
      a: Само ако гаража током целе године остаје између 50-80°F. Тавани и гараже без контроле температуре доживљавају температурне екстреме који оштећују језгра са унутрашњим концима.

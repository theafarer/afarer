  title: Основне технике веслања на SUP дасци
  description: Савладајте замах унапред, луковни замах и прекрштени окрет да бисте ефикасно веслали у свим условима.
  tldr: Замах унапред користи мишиће трупа, а не руке. Луковни замах окреће даску. Прекрштени окрет је најефикаснији обрт. Држите весло усправно и потпуно потопите лопатицу ради максималног преноса снаге.
  problem: Већина падлера користи замахе којима доминирају руке, што расипа енергију и изазива умор рамена. Лоша техника такође отежава контролу даске на ветру и узбурканој води.
  solution: Научите три кључна замаха — замах унапред, луковни замах и прекрштени окрет — уз правилну механику тела. Вежбајте сваки од њих на мирној води пре него што пређете на захтевније услове.
  audience: Падлери који желе да веслају дуже, брже и са мање умора.
  steps:
    - 'Замах унапред: дотегните се унапред, потпуно забодите лопатицу, повуците уназад уз ротацију трупа (не рукама), извадите весло на висини чланка'
    - 'Луковни замах: дотегните унапред уз ивицу даске, повуците лопатицу широким луком према крми, чиме окрећете даску на супротну страну од весла'
    - 'Прекрштени окрет: поставите весло на супротну страну даске без промене положаја руку и повуците према крми'
    - 'Ослонац: користите ниски ослонац за стабилност на узбурканој води — пљоснато ударите лопатицу по површини воде'
    - 'Привлачећи замах: дотегните у страну и привуците даску бочно према веслу'
  faq:
    - q: Како да веслам право?
      a: Користите једнаку дужину замаха на обе стране. Мењајте страну на сваких 5-10 замаха. Гледајте у фиксну тачку на хоризонту као оријентир.
    - q: Да ли треба да савијам колена?
      a: Да. Држите колена благо савијеним као амортизере. Укочена колена преносе сваки талас на труп тела и смањују стабилност.
    - q: Како да веслам против ветра?
      a: Снижите положај тела, користите краће и брже замахе и останите ближе обали где је ветар често слабији. Ако је ветар сувише јак, не излазите.

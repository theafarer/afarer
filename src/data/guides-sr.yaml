  title: Разумевање временских услова за падловање на дасци
  description: Научите да читате ветар, таласе, плиму и осеку и временске обрасце како бисте доносили безбедне одлуке на води.
  tldr: 'Проверите три ствари пре сваког поласка: брзину ветра (испод 10 mph за почетнике), висину таласа (испод 1 ft за почетнике) и температуру воде (обучите се за воду, не за ваздух). Ветар који дува с копна према отвореном мору опасан је на сваком нивоу вештине.'
  problem: Већина несрећа везаних за време дешава се зато што падлери погрешно процењују услове — провере температуру ваздуха, али не и воде, или не разумеју да их копнени ветар може однети на отворено море.
  solution: 'Користите структурисану процену времена пре поласка: правац и брзина ветра, период и висина таласа, стање плиме и осеке и температура воде. Разумите како сваки фактор утиче на вашу безбедност.'
  audience: Сви падлери који излазе на отворену воду — језера, заливе, реке и море.
  steps:
    - Проверите брзину и правац ветра — копнени ветар (који дува од копна према мору) најопаснији је
    - Процените стање таласа — период таласа једнако је важан као и висина
    - Познајте плиму и осеку — плимне струје могу бити јаче од брзине вашег веслања
    - Измерите температуру воде — испод 60°F/15°C захтева топлотну заштиту
    - Проверите видљивост — магла и јака киша смањују видљивост и повећавају ризик од судара
    - Разумите локалне опасности — потопљене стене, јаке струје, зоне чамачког саобраћаја
  faq:
    - q: Која брзина ветра је превисока за SUP?
      a: 'Почетници: преко 10 mph (8 knots). Средњи ниво: преко 15 mph (13 knots). Напредни: преко 20 mph (17 knots). Ако нисте сигурни, не излазите.'
    - q: Шта значи период таласа?
      a: Период таласа је време између узастопних таласа. Кратки периоди (испод 8 секунди) значе стрме и немирне таласе. Дуги периоди (преко 12 секунди) значе глаткије и предвидивије таласе.
    - q: Могу ли да веслам по киши?
      a: Слаба киша је обично безбедна. Јака киша смањује видљивост и може указивати на промену услова ветра. Олује са грмљавином захтевају одмах напуштање воде.

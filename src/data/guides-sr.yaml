  title: Планирање вишедневног SUP путовања
  description: Како планирати и спровести вишедневно весларско путовање — планирање руте, паковање опреме, камповање и безбедност.
  tldr: Планирајте 10-15 миља дневно. Спакујте опрему у водонепропусне суве вреће, распоредите тежину равномерно и вежбајте паковање даске пре путовања. Предајте план пловидбе надлежној особи на обали. Понесите воду, храну, склониште, навигацију и комуникацију.
  problem: Вишедневна путовања пропадају због прекомерног паковања, лоше планиране руте или потцењивања времена и струје — што води до исцрпљености, отказа опреме или безбедносних инцидената.
  solution: 'Користите систематски приступ планирању: избор руте, списак опреме, планирање хране, безбедносни преглед и планирање за непредвиђене ситуације.'
  audience: Искусни веслачи који планирају своју прву вишедневну експедицију.
  steps:
    - Изаберите руту са постојећим камповима и тачкама за излазак у случају нужде
    - Планирајте 10-15 миља дневно рачунајући ветар и струју
    - Проверите табеле плиме и временске прогнозе за цео период путовања
    - Спакујте опрему у водонепропусне суве вреће — укупна тежина опреме 20-30 lbs
    - Распоредите тежину равномерно — најтежи предмети у средини
    - Предајте детаљан план пловидбе некоме на обали
    - Понесите навигацију — папирату карту, компас и GPS резерву
    - Спакујте хитно склониште, додатну храну и комплет прве помоћи
  faq:
    - q: Која је идеална дневна удаљеност?
      a: 10-15 миља дневно за искусне веслаче. Почетници треба да планирају 5-8 миља. Увек унесите резерно време за временске прилике.
    - q: Колико воде треба да понесем?
      a: 1 галон по особи дневно. У врућим условима, 1.5 галона. Понесите филтер за воду или таблете за пречишћавање ради допуњавања залиха.
    - q: Која је најважнија ставка безбедности?
      a: Комуникација. VHF радио или сателитски комуникатор може спасити живот у хитном случају. Мобилни телефони су непоуздани у удаљеним подручјима.

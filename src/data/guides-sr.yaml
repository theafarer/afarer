  category: technical
  title: Како читати спецификације SUP даске
  description: Технички водич за разумевање спецификација SUP даске — запремина, димензије, конструкција и шта оне значе за перформансе.
  tldr: 'Кључне спецификације: запремина (литара) одређује пловност и носивост, ширина одређује стабилност, дужина одређује држање правца и брзину, дебљина одређује крутост, а PSI вредност одређује притисак надувавања за оптималне перформансе.'
  problem: Технички листови производа наводе бројеве без контекста, па купци нису сигурни које спецификације су заиста важне за њихову намену.
  solution: 'Преведите сваку спецификацију на стварне перформансе: запремина за пловност, ширина за стабилност, дужина за клизање, дебљина за крутост и конструкција за издржљивост.'
  audience: Падлери средњег нивоа и технички оријентисани купци који желе да доносе одлуке на основу података.
  steps:
    - Проверите запремину (литара) — ваша тежина заједно са опремом не треба да прелази 80% декларисане запремине даске
    - Проверите ширину — шира (32-34") = већа стабилност, ужа (28-30") = већа брзина
    - Проверите дужину — дужа (12-14") = боље држање правца, краћа (10-11") = боља маневрабилност
    - Проверите дебљину — 6" је стандард, 8" нуди већу крутост и носивост
    - Проверите PSI вредност — надувајте до максималног декларисаног PSI ради оптималне крутости
    - Проверите материјале конструкције — густина дроп-стич ткива, PVC слојеви, ојачање бокова
  faq:
    - q: Шта значи дроп-стич?
      a: Дроп-стич је метода конструкције у којој хиљаде нити повезују горњи и доњи слој даске. То омогућава надувавање под високим притиском (12-15 PSI) ради изузетне крутости.
    - q: Који је идеалан однос тежине и запремине?
      a: Добра оријентација је отприлике 5-6 фунти тежине падлера по литру запремине даске. Падлер тежине 220 lb треба да тражи даске са запремином од 180+ литара.
    - q: Да ли тежина даске има значај?
      a: Да. Лакше даске (испод 20 lbs) лакше се преносе и транспортују. Теже даске (25+ lbs) често указују на издржљивију вишеслојну PVC конструкцију.

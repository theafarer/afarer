  steps:
    - Крените са широком даском (34"+ са великом носивошћу за вас + пса)
    - Набавите правилно уклопљен спасилачки прслук за пса са ручком
    - 'Вежбајте на копну: нека пас седи на испумпаној дасци, а затим на надуваној дасци на трави'
    - 'Пређите у плитку воду: клекните на даску са псом и замахните веслом неколико пута'
    - 'Држите сесије кратким: максимум 20-30 minutes током првих неколико излазака'
    - Увек понесите свежу воду, склапајућу посуду за воду и пешкир за пса
  faq:
    - q: Која SUP даска је најбоља за псе?
      a: Широка стабилна даска са меком EVA палубом која пружа хват шапама. Tropical Breeze Island Escape ширине 34"+ идеалан је за веслање са псима.
    - q: Да ли мом псу треба спасилачки прслук?
      a: Да, чак и за добре пливаче. Спасилачки прслук за пса са ручком олакшава подизање пса назад на даску ако падне.
    - q: Како да спречим пса да изгребе даску?
      a: Редовно шишајте нокте пса. EVA пена на палуби штити PVC површину. Поставите пешкир или подлогу за љубимце на палубу ради додатне заштите.

  title: 'SUP фитнес: тренинг целог тела на води'
  description: Како веслање на SUP дасци гради снагу трупа, равнотежу и кардиоваскуларну кондицију.
  tldr: SUP активира труп, ноге, леђа и рамена при сваком замаху. Један сат вежбања сагорева 300-500 калорија. Веслање против ветра или струје удвостручава интензитет. SUP јога додаје рад на флексибилности и равнотежи.
  problem: Многи веслање на дасци доживљавају као рекреативну активност, а не као легитиман фитнес алат, чиме пропуштају његов потенцијал за кондицију целог тела.
  solution: 'Структурирајте SUP тренинге према конкретним фитнес циљевима: веслање за издржљивост ради кардиа, интервални спринтови за снагу, SUP јога за флексибилност и дугачко веслање за мишићну издржљивост.'
  audience: Љубитељи фитнеса који траже неоптерећујући, а ангажујући тренинг целог тела.
  steps:
    - Загрејте се на копну — кружни покрети рукама, ротације трупа и махови ногама у трајању од 5 минута
    - Почните са 10 минута једномерног веслања умереног интензитета
    - Пређите на интервални тренинг — 2 минута интензивног веслања, 2 минута лаког опоравка
    - Укључите SUP јога позе — пас окренут надоле, ратник II и поза дрвета на дасци
    - Завршите лаганим веслањем и статичним истезањем на дасци
  faq:
    - q: Да ли је SUP бољи од трчања за фитнес?
      a: SUP пружа упоредиве кардиоваскуларне користи уз мање оптерећење зглобова. Такође ангажује горњи део тела и труп више од трчања.
    - q: Колико калорија сагорева SUP?
      a: Приближно 300-500 калорија на сат при умереном интензитету. Тркање или веслање против ветра може сагорети 600-800 калорија на сат.
    - q: Могу ли изградити мишиће уз SUP?
      a: Да. Веслање гради мишиће рамена, леђа и трупа. Одржавање равнотеже ангажује ноге и стабилизаторске мишиће. То је тренинг отпора целог тела.

  title: Како поправити надувни SUP
  description: Водич корак по корак за поправку пробоја, проблема са вентилом и оштећења шавова на надувним SUP даскама.
  tldr: Мале пробоје (испод 1/4") можете поправити приложеним комплетом закрпа. Очистите подручје, нанесите PVC лепак, притисните закрпу и сачекајте 24 сата. Цурење из вентила обично захтева замену заптивног прстена. Велики раздери или одвајање шавова захтевају професионални сервис.
  problem: Мали пробоји и проблеми са вентилом чести су, али лаки за поправку. Без правилне технике поправке, корисници или превише плаћају професионални сервис или погоршавају оштећење.
  solution: Утврдите врсту оштећења — пробој, цурење из вентила или проблем са шавом — и примените одговарајући метод поправке. Већина поправки траје 30 минута плус време стврдњавања.
  audience: Власници надувних SUP дасака који желе сами да обаве основне поправке.
  steps:
    - Пронађите цурење — потпуно надувајте даску, ослушкујте ваздух, опипајте руком или користите воду са сапуном
    - Обележите цурење оловком или траком
    - Очистите подручје око цурења изопропилним алкохолом — најмање 2 инча око оштећења
    - Угрубајте површину финим шмирглом ради бољег везивања лепка
    - Нанесите PVC лепак и на закрпу и на површину даске
    - Сачекајте 5 минута да лепак постане лепљив
    - Чврсто притисните закрпу, избаците мехуриће ваздуха ваљком или кредитном картицом
    - Оставите да се стврдне 24 сата пре надувавања на пун притисак
  faq:
    - q: Могу ли поправити пробој на води?
      a: Хитне поправке помоћу закрпе и траке могу вас вратити до обале. Потпуне поправке захтевају суве услове и стврдњавање од 24 сата.
    - q: Како поправити вентил који цури?
      a: Извадите језгро вентила приложеним алатом, проверите да ли је заптивни прстен оштећен, по потреби га замените и чврсто вратите језгро.
    - q: Који лепак да користим за PVC поправке?
      a: Користите лепак намењен за PVC, као што су HH-66 или Clifton. Обичан суперлепак не везује добро материјале од надувног PVC-а.

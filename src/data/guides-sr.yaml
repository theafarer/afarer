  title: Како изабрати право весло за SUP
  description: Водич кроз материјале весла, облике лопатице, врсте штапа и одређивање величине за SUP.
  tldr: 'Дужина весла: SUP весла треба да буду 6-8" виша од ваше висине. Облик лопатице: дихедралне лопатице држе праву линију, равне лопатице пружају јачи захват. Материјал штапа: карбон је најлакши, фиберглас је најбољи однос цена и квалитета, алуминијум је најјефтинија опција.'
  problem: Користење погрешне величине или материјала весла изазива непотребан замор, слабу ефикасност замаха и напрезање зглобова.
  solution: Ускладите дужину весла, облик лопатице, материјал штапа и флексибилност са својим стилом веслања, величином тела и буџетом.
  audience: SUP веслачи који бирају своје прво или следеће весло.
  steps:
    - Измерите висину весла — 6-8" више од ваше висине за опште веслање
    - Изаберите материјал лопатице — најлон за мали буџет, фиберглас за најбољу вредност, карбон за перформансе
    - Изаберите облик лопатице — дихедралан за глатко праћење правца, раван за снагу, кашикаст за трке
    - Изаберите врсту штапа — прав за општу употребу, савијен за SUP трке
    - Проверите флексибилност — крући штапови преносе више снаге, флексибилни штапови смањују напрезање зглобова
  faq:
    - q: Који је најбољи материјал за весло?
      a: Фиберглас нуди најбољу равнотежу тежине, издржљивости и цене. Карбон је лакши, али скупљи и крт. Најлон је тежак, али практично неуништив.
    - q: Како да знам да ли је моје весло праве дужине?
      a: Ставите весло усправно поред себе — дршка треба да допре до вашег зглоба руке када подигнете руку изнад главе.
    - q: Да ли да купим једноделно или подесиво весло?
      a: Подесива весла су добра за заједничку употребу и путовање. Једноделна весла су лакша, крућа и ефикаснија за посвећену употребу.

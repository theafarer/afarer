sup:
  title: ידע SUP — מדריכים ומשאבים על SUP מתנפח | Afarer
  description: מרכז ידע מקיף על SUP הכולל מדריכים למתחילים, מידות לוח, מדריכי טכניקה, טיפים לבטיחות וטכנולוגיית SUP מתנפח.
  articles:
    - title: יסודות ה-SUP — מדריך למתחילים
      desc: כל מה שמתחיל צריך לדעת — סוגי לוחות, מידת משוט, עמידה נכונה וטיפים ליום הראשון.
      href: /learn/sup/
    - title: מדריך מידות ל-SUP
      desc: מצאו את האורך, הרוחב והנפח הנכונים של הלוח בהתאם למשקל שלכם, לרמת המיומנות ולסגנון החתירה.
      href: /size-guide/
    - title: לוח מתנפח מול לוח קשיח
      desc: איזה מהם מתאים לכם? השוואה של ניידות, ביצועים, עמידות ועלות.
      href: /compare/inflatable-vs-hardboard/
    - title: טכניקות לרמת ביניים
      desc: קדמו את החתירה שלכם באמצעות תנועות משוט מתקדמות, טכניקות פנייה והתמודדות עם מים סוערים.
      href: /learn/intermediate-techniques/
    - title: כיצד לבחור SUP מתנפח
      desc: נווטו בין הגורמים המרכזיים — מבנה, עובי, תצורת סנפירים ואביזרים כלולים.
      href: /v2/how-to-choose-inflatable-sup/
    - title: בטיחות במים
      desc: ידע בטיחות חיוני ובו קריאת מזג אוויר, בחירת PFD, חילוץ עצמי וחתירה קבוצתית.
      href: /learn/water-safety/
water-safety:
  title: ידע לבטיחות במים — מדריכים לחתירה בטוחה | Afarer
  description: משאבים מקיפים לבטיחות במים עבור SUP, קיאקים ושיט. למדו על בחירת PFD, קריאת מזג אוויר, חילוץ עצמי, בטיחות במים קרים והסמכת CE.
  articles:
    - title: מדריך לבטיחות במים
      desc: ידע בטיחות חיוני לכל חותר — מזג אוויר, PFD, חילוץ עצמי ופרוטוקולי חתירה קבוצתית.
      href: /learn/water-safety/
    - title: מדריך לאפודות הצלה ו-PFD
      desc: כיצד לבחור את אמצעי הציפה האישי המתאים ל-SUP, לקיאקים, לשיט ולשימוש מקצועי.
      href: /v2/life-jacket-buying-guide/
    - title: רשימת בדיקת בטיחות ל-SUP
      desc: רשימת בדיקות בטיחות לפני הירידה למים שכל חותר SUP צריך לבצע.
      href: /v2/sup-safety-guide/
    - title: בטיחות בחתירה במים קרים
      desc: אמצעי זהירות חיוניים, ציוד וטכניקות לחתירה בתנאי מים קרים.
      href: /v2/cold-water-safety-guide/
    - title: טעויות של חותרים מתחילים
      desc: טעויות נפוצות של חותרים בפעם הראשונה וכיצד להימנע מהן לחוויה בטוחה ומהנה יותר.
      href: /v2/beginner-sup-guide/
    - title: הסבר על הסמכת CE
      desc: מהי משמעות הסמכת CE עבור לוחות SUP מתנפחים — התקנים, הבדיקות ומדוע הדבר חשוב לבטיחות.
      href: /trust/

drop-stitch-core:
  title: טכנולוגיית ליבת דרופ-סטיץ' — כיצד לוחות SUP מתנפחים משיגים קשיחות
  description: "עיון מעמיק בטכנולוגיית המבנה של דרופ-סטיץ': כיצד אלפי חוטי פוליאסטר יוצרים פלטפורמות מתנפחות קשיחות בלחץ 15-25 PSI. צפיפות חוטים, שילוב בדים, תהליך הייצור והשוואות ביצועים."
  articles: []
inflatable-technology:
  title: טכנולוגיית SUP מתנפח — חומרים, מבנה והנדסה
  description: כיצד נבנים לוחות SUP מתנפחים — שכבות חומרים, ליבות דרופ-סטיץ', מערכות שסתומים, ריתוך RF ובדיקות איכות. הבינו מה הופך מוצר מתנפח לעמיד ובעל ביצועים גבוהים.
  articles: []
intermediate-techniques:
  title: טכניקות SUP וקיאק לרמת ביניים — מעבר ליסודות
  description: שפרו את כישורי החתירה שלכם באמצעות תנועות משוט מתקדמות, התמודדות עם מים סוערים, ניהול רוח, טכניקות חילוץ עצמי וכללי התנהגות בחתירה קבוצתית. מיועד לחותרים שמוכנים להתקדם מעבר לרמת המתחילים.
  articles: []
materials:

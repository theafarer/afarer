sup-size-guide:
  title: מדריך מידות SUP — כיצד לבחור את אורך הלוח, הרוחב והנפח הנכונים
  description: מדריך מקיף למידות SUP העוסק באורך הלוח, ברוחבו, בעוביו, בנפחו (בליטרים) ובהתאמה למשקל הרוכב. מצאו את מידת ה-SUP המתנפח המתאימה למשקל שלכם, לרמת המיומנות ולסוג הפעילות.

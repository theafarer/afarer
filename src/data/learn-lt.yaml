sup:
  title: SUP žinios — pripučiamų SUP vadovai ir ištekliai | Afarer
  description: Išsamus SUP žinių centras, apimantis pradedančiųjų vadovus, lentų dydžių parinkimą, technikos pamokas, saugos patarimus ir pripučiamų SUP technologijas.
  articles:
    - title: SUP pagrindai — vadovas pradedantiesiems
      desc: Viskas, ką turi žinoti pradedantysis — lentų tipai, irklo parinkimas, stovėsena ir pirmos dienos patarimai.
      href: /learn/sup/
    - title: SUP dydžių vadovas
      desc: Raskite tinkamą lentos ilgį, plotį ir tūrį pagal savo svorį, įgūdžius ir irklavimo stilių.
      href: /size-guide/
    - title: Pripučiama ar standi lenta
      desc: Kuri jums tinkamesnė? Pernešamumas, našumas, patvarumas ir kaina — palyginimas.
      href: /compare/inflatable-vs-hardboard/
    - title: Pažengusiųjų technikos
      desc: Patobulinkite savo irklavimą — pažangūs irklo mostai, posūkių technikos ir elgesys neramiame vandenyje.
      href: /learn/intermediate-techniques/
    - title: Kaip išsirinkti pripučiamą SUP
      desc: Įvertinkite pagrindinius veiksnius — konstrukciją, storį, pelekų sąranką ir komplekte esančius priedus.
      href: /v2/how-to-choose-inflatable-sup/
    - title: Sauga vandenyje
      desc: 'Būtinos saugos žinios: orų skaitymas, PFD pasirinkimas, savarankiškas gelbimasis ir grupinis irklavimas.'
      href: /learn/water-safety/
water-safety:
  title: Saugos vandenyje žinios — saugaus irklavimo vadovai | Afarer
  description: Išsamūs saugos vandenyje ištekliai, skirti SUP, baidarėms ir valtims. Sužinokite apie PFD pasirinkimą, orų skaitymą, savarankišką gelbimąsi, saugą šaltame vandenyje ir CE sertifikavimą.
  articles:
    - title: Saugos vandenyje vadovas
      desc: Būtinos saugos žinios kiekvienam irkluotojui — orai, PFD, savarankiškas gelbimasis ir grupinio irklavimo taisyklės.
      href: /learn/water-safety/
    - title: Gelbėjimo liemenių ir PFD vadovas
      desc: Kaip išsirinkti tinkamą asmeninę gelbėjimo priemonę SUP, baidarėms, valtims ir profesionaliam naudojimui.
      href: /v2/life-jacket-buying-guide/
    - title: SUP saugos kontrolinis sąrašas
      desc: Saugos prieš išplaukiant kontrolinis sąrašas, kurio turėtų laikytis kiekvienas ant lentos stovintis irkluotojas prieš leisdamasis į vandenį.
      href: /v2/sup-safety-guide/
    - title: Sauga irkluojant šaltame vandenyje
      desc: Būtinos atsargumo priemonės, įranga ir technikos, skirtos irklavimui šalto vandens sąlygomis.
      href: /v2/cold-water-safety-guide/
    - title: Pradedančiųjų irkluotojų klaidos
      desc: Dažniausios pirmą kartą irkluojančiųjų klaidos ir kaip jų išvengti, kad patirtis būtų saugesnė ir malonesnė.
      href: /v2/beginner-sup-guide/
    - title: CE sertifikavimas — išsamus paaiškinimas
      desc: Ką CE sertifikavimas reiškia pripučiamoms SUP lentoms — standartai, bandymai ir kodėl tai svarbu saugai.
      href: /trust/
sup-basics:
  title: SUP pagrindai — pradedančiųjų vadovas irklavimui stovint ant lentos
  description: Viskas, ką reikia žinoti pradedant irkluoti stovint ant lentos. Įrangos vadovai, dydžių patarimai, saugos patarimai ir pradedančiųjų technikos iš Afarer žinių centro.
  articles: []
drop-stitch-core:
  title: Drop-stitch branduolio technologija — kaip pripučiami SUP įgauna standumą
  description: 'Gilesnis žvilgsnis į drop-stitch konstrukcijos technologiją: kaip tūkstančiai poliesterio siūlų sukuria standžias pripučiamas platformas esant 15-25 PSI. Siūlų tankis, audinių integracija, gamybos procesas ir našumo palyginimai.'
  articles: []
inflatable-technology:
  title: Pripučiamų SUP technologijos — medžiagos, konstrukcija ir inžinerija
  description: Kaip gaminamos pripučiamos SUP lentos — medžiagų sluoksniavimas, drop-stitch branduoliai, vožtuvų sistemos, RF suvirinimas ir kokybės bandymai. Supraskite, kas lemia patvarią ir našią pripučiamą konstrukciją.
  articles: []
intermediate-techniques:
  title: Pažengusiųjų SUP ir baidarių technikos — daugiau nei pagrindai
  description: Pakelkite savo irklavimo įgūdžius į kitą lygį — pažangūs irklo mostai, darbas neramiame vandenyje, vėjo valdymas, savarankiško gelbimosi technikos ir grupinio irklavimo etiketas. Tiems irkluotojams, kurie pasirengę žengti toliau už pradedančiųjų lygio.
  articles: []
materials:
  title: Pripučiamų SUP medžiagos — PVC, EVA ir drop-stitch audiniai
  description: 'Išsamus vadovas po medžiagas, naudojamas pripučiamų SUP gamyboje: karinės klasės PVC, EVA putų denio dangos, drop-stitch audiniai, anglies pluoštas ir aliuminio lydiniai. Techninės charakteristikos, taikymas ir parinkimo kriterijai.'
  articles: []
safety-in-water-sports:
  title: Vandens sporto sauga — būtinos žinios irkluotojams
  description: Būtinos saugos žinios kiekvienam irkluotojui — orų skaitymas, PFD pasirinkimas, savarankiškas gelbimasis ir grupinio irklavimo taisyklės.
  articles: []
sup-size-guide:
  title: SUP dydžių vadovas — kaip išsirinkti tinkamą lentos ilgį, plotį ir tūrį
  description: 'Išsamus SUP dydžių parinkimo vadovas: lentos ilgis, plotis, storis, tūris (litrais) ir irkluotojo svorio atitikimas. Raskite tinkamą pripučiamos SUP dydį pagal savo svorį, įgūdžių lygį ir irklavimo veiklą.'
  articles: []

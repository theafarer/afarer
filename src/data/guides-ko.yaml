- slug: beginner-guide
  category: tutorial
  title: 패들보딩 입문 가이드
  description: 첫 패들보딩 세션 전에 알아야 할 모든 것 — 장비 세팅부터 기본 패들링 기법까지.
  tldr: 넓고 안정적인 보드로 잔잔하고 평평한 물에서 시작하세요. 12-15 PSI까지 공기를 넣고, 리시를 착용하고, 올바른 패들 길이(키보다 6-8인치 길게)를 사용하세요. 스탠스는 어깨너비, 무릎은 살짝 굽히고, 수평선을 바라보세요.
  problem: 초보 패들러는 흔히 기본 준비를 건너뜁니다 — 잘못된 패들 길이, 나쁜 스탠스, 거친 물 선택 — 이것이 낙수, 좌절, 의욕 상실로 이어집니다.
  solution: 체계적인 첫 세션 계획을 따르세요. 잔잔한 물을 고르고, 장비를 올바르게 세팅하고, 서기 전에 무릎 자세로 연습하고, 회전을 시도하기 전에 전진 스트로크를 마스터하세요.
  audience: 패들보딩을 한 번도 해본 적 없는 완전 초보자.
  steps:
    - 보트 통행이 없는 평평하고 잔잔한 물을 고르세요 — 작은 호수나 막힌 만이 이상적입니다
    - 더블 액션 펌프로 보드를 12-15 PSI까지 부풀리세요
    - 코일 리시를 발목이나 종아리에 착용하세요 — 보드 손잡이에는 절대 붙이지 마세요
    - 핀을 끼우고 나사를 조이세요
    - 패들 길이를 조정하세요 — 키보다 6-8인치 길어야 합니다
    - 먼저 보드 위에 무릎을 꿇고 앉아 몇 번 저으며 균형을 느끼세요
    - 한 번에 한 발씩 일어서세요 — 발은 어깨너비, 무릎은 부드럽게
    - 발이 아니라 수평선을 보세요 — 보드는 시선이 향하는 곳으로 갑니다
  faq:
    - q: 패들보딩에 무엇을 입어야 하나요?
      a: 속건 운동복, 구명조끼, 자외선 차단제, 모자. 수온이 낮으면 웻슈트를 입으세요. 항상 리시를 착용하고 방수 케이스에 넣은 휴대폰을 휴대하세요.
    - q: 물에 빠지면 어떻게 보드에 다시 오르나요?
      a: 침착하세요. 보드까지 헤엄쳐 가서 중앙 손잡이를 잡고, 다리를 차면서 한 번에 보드 위로 몸을 당기세요. 먼저 무릎 자세로 돌아간 뒤 일어서세요.
    - q: 어떤 바람 조건이 안전한가요?
      a: 초보자는 풍속 10 mph(5노트) 미만입니다. 바람이 해안에서 먼 바다 쪽으로 불면 나가지 마세요. 예보를 확인하고, 해안에서 바다 쪽으로 부는 바람이 위험하다는 점을 이해하세요.

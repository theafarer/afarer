- slug: sup-fitness
  category: lifestyle
  title: SUP 피트니스 — 물 위의 전신 운동
  description: 스탠드업 패들보딩이 코어 근력, 균형, 심폐 지구력을 어떻게 길러 주는지 소개합니다.
  tldr: SUP는 모든 스트로크에서 코어, 다리, 등, 어깨를 사용합니다. 1시간 세션에 300-500킬로칼로리를 소모합니다. 바람이나 물결을 거슬러 저으면 강도가 두 배가 됩니다. SUP 요가는 유연성과 균형 훈련을 더합니다.
  problem: 많은 사람이 패들보딩을 본격적인 피트니스 도구가 아니라 가벼운 액티비티로 여겨 전신 컨디셔닝의 가능성을 놓치고 있습니다.
  solution: SUP 세션에 구체적인 피트니스 목표를 담으세요 — 심폐에는 지속 패들링, 파워에는 인터벌 스프린트, 유연성에는 SUP 요가, 근지구력에는 거리 패들링입니다.
  audience: 낮은 충격과 높은 몰입감의 전신 운동을 찾는 피트니스 애호가.
  steps:
    - 육지에서 워밍업 — 팔 돌리기, 몸통 비틀기, 다리 스윙을 5분간
    - 중간 강도의 일정한 페이스 패들링을 10분간 시작하세요
    - 인터벌 훈련으로 발전시키세요 — 2분 강한 패들링, 2분 가벼운 회복
    - SUP 요가 자세를 더하세요 — 보드 위에서 다운도그, 전사 자세 II, 나무 자세
    - 가벼운 패들링과 보드 위 정적 스트레칭으로 마무리하세요
  faq:
    - q: 피트니스에 SUP와 달리기 중 어느 것이 좋나요?
      a: SUP는 관절 충격이 적으면서 달리기와 비교할 만한 심폐 효과를 제공합니다. 또한 달리기보다 상체와 코어를 더 많이 사용합니다.
    - q: SUP는 칼로리를 얼마나 소모하나요?
      a: 중간 강도에서 시간당 약 300-500킬로칼로리입니다. 레이스나 맞바람 패들링은 시간당 600-800킬로칼로리까지 소모할 수 있습니다.
    - q: SUP로 근육을 키울 수 있나요?
      a: 네. 패들링은 어깨, 등, 코어 근육을 발달시킵니다. 균형을 잡으며 다리와 안정 근육이 사용됩니다. 전신 저항 운동입니다.

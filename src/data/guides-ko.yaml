- slug: sup-buying-mistakes
  category: buying-guide
  title: 흔한 SUP 구매 실수 — 패들보드 살 때 피해야 할 것
  description: 흔한 SUP 구매 실수에서 배우세요 — 잘못된 사이즈 선택, 하중 용량 무시, 싼 보드 구매, 필수 액세서리 소홀히.
  tldr: 실수 탑 5 — 너무 좁은 보드 사기, 하중 용량 무시하기, 품질보다 가격 고르기, 액세서리 비용 잊기, 용도에 안 맞는 보드 유형 고르기. 평판 좋은 제조사의 양질의 인플래터블 SUP는 $500-900이며 5년 이상 갑니다.
  problem: 첫 구매자는 너무 작거나, 품질이 낮거나, 필요에 안 맞는 보드에 돈을 낭비합니다. 싼 보드는 1-2시즌 만에 망가집니다.
  solution: 구매 전에 철저히 조사하세요. 보드 치수를 자신의 체격에 맞추고, 양질의 드롭스티치 구조에 투자하고, 필수 액세서리 예산을 잡고, CE 인증과 보증이 있는 제조사에서 사세요.
  audience: 처음 SUP를 사는 사람과 첫 보드에서 실수한 모든 사람.
  steps:
    - 실수 1 — 너무 좁은 보드 사기 — 필요하다고 생각하는 것보다 항상 더 넓은 것을 고르세요
    - 실수 2 — 하중 용량 무시하기 — 사기 전에 총 적재량을 계산하세요
    - 실수 3 — 가장 싼 것 고르기 — 저품질 PVC는 빨리 망가집니다
    - 실수 4 — 액세서리 잊기 — 펌프, PFD, 패들, 리시에 $150-300이 더 듭니다
    - 실수 5 — 용도에 안 맞는 보드 유형 — 올어라운드는 다용도지만 전용 보드가 더 성능이 좋습니다
  faq:
    - q: 첫 SUP에 얼마를 써야 하나요?
      a: 평판 좋은 제조사의 양질의 인플래터블 SUP는 $500-900입니다. $300 미만 보드는 대체로 엉성한 드롭스티치와 빨리 망가지는 얇은 PVC의 저품질입니다.
    - q: 싼 SUP는 가치가 있나요?
      a: 없습니다. 저가 SUP는 얇은 PVC, 약한 드롭스티치, 저품질 밸브를 써서 박리되고, 누수되고, 강성을 잃습니다. 양질의 보드는 5년 이상 가지만 싼 보드는 1시즌 만에 망가질 수 있습니다.
    - q: 묶음과 낱개 중 어느 것을 사야 하나요?
      a: 묶음은 낱개 구매보다 돈을 아낍니다. 묶음에 압력계 달린 양질의 펌프, 조절식 패들, 코일 리시가 포함됐는지 확인하세요 — 그저 가장 싼 액세서리가 아닌지.

- slug: sup-for-whitewater
  category: buying-guide
  title: 급류 SUP 가이드 — 리버 러닝 인플래터블 보드 구매 가이드
  description: 리버 러닝을 위한 급류 SUP 선택법 — 더 짧은 보드, 보강 구조, 안전 장비, 1-3급 급류를 위한 패들링 기술.
  tldr: 급류 SUP에는 더 짧은 길이(8-10피트), 보강 레일, 더 높은 PSI(15 초과), 안전을 위한 여러 공기 챔버가 필요합니다. 코일이 아닌 스트레이트 강 리시를 쓰고, 헬멧과 PFD를 착용하고, 항상 파트너와 함께 패들링하세요. 1급에서 시작해 더 어려운 급류로 단계적으로 나아가세요.
  problem: 표준 올어라운드 SUP를 흐르는 물에 가져가는 것은 위험합니다 — 표준 보드는 강에 필요한 회전성, 충격 저항, 안전 기능이 없습니다.
  solution: 민첩성을 위한 짧은 길이, 바위 충격에 견디는 보강 구조, 안전을 위한 멀티 챔버 설계를 갖춘 전용 급류 SUP를 선택하세요.
  audience: 리버 러닝으로 전환하려는 경험 많은 패들러.
  steps:
    - 급류에서 최대 회전성을 위해 길이 8-10피트의 보드를 선택하세요
    - 보강 레일 구조와 밀리터리 그레이드 PVC를 찾으세요
    - 펑크에 대비한 여유를 위해 공기 챔버 2개 이상을 갖춘 보드를 선택하세요
    - 퀵 릴리스 벨트에 연결한 스트레이트 강 리시를 쓰세요
    - 헬멧, PFD, 적절한 강용 신발을 착용하세요
    - 1급 급류에서 시작해 경험 많은 파트너와 함께 단계적으로 발전하세요
  faq:
    - q: 일반 SUP로 급류를 할 수 있나요?
      a: 권장하지 않습니다. 표준 SUP는 충격 저항이 없어 바위에서 박리될 수 있습니다. 강 환경에서는 멀티 챔버 안전이 필수입니다.
    - q: 급류 SUP의 PSI는?
      a: 최대 강성을 위해 15 PSI 초과입니다. 단단한 보드는 장애물에 감싸지는 공기압 부족 보드보다 바위에서 잘 튕겨 나갑니다.
    - q: 급류 SUP에 특별한 기술이 필요한가요?
      a: 네. 강 읽기, 에디 턴, 페리, 브레이싱은 필수 기술입니다. 2급 이상에 도전하기 전에 급류 SUP 클리닉을 받으세요.

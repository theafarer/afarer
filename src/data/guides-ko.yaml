- slug: understanding-specs
  category: technical
  title: SUP 보드 사양 읽는 법
  description: SUP 보드 사양을 이해하기 위한 기술 가이드 — 부피, 치수, 구조, 그리고 성능에 대한 의미.
  tldr: 핵심 사양은 다음과 같습니다 — 부피(리터)는 부력과 하중 용량을, 폭은 안정성을, 길이는 직진성과 속도를, 두께는 강성을, PSI 정격은 최적 성능을 위한 공기압을 결정합니다.
  problem: 제품 사양서는 맥락 없는 숫자만 나열해서, 구매자는 어떤 사양이 자신의 용도에 실제로 중요한지 확신하지 못합니다.
  solution: 각 사양을 실제 성능으로 변환하세요 — 부피는 부력, 폭은 안정성, 길이는 글라이드, 두께는 강성, 구조는 내구성입니다.
  audience: 데이터 기반 결정을 원하는 중급 패들러와 기술에 밝은 구매자.
  steps:
    - 부피(리터)를 확인하세요 — 체중과 장비를 합친 무게가 보드 부피 정격의 80%를 넘지 않아야 합니다
    - 폭을 확인하세요 — 넓을수록(32-34인치) 안정적이고 좁을수록(28-30인치) 빠릅니다
    - 길이를 확인하세요 — 길수록(12-14피트) 직진성이 좋고 짧을수록(10-11피트) 회전성이 좋습니다
    - 두께를 확인하세요 — 6인치가 표준이고 8인치는 더 높은 강성과 하중 용량을 제공합니다
    - PSI 정격을 확인하세요 — 최대 정격 PSI까지 부풀리면 최적의 강성을 얻습니다
    - 구조 재질을 확인하세요 — 드롭스티치 밀도, PVC 층, 레일 보강
  faq:
    - q: 드롭스티치란 무엇인가요?
      a: 드롭스티치는 수천 개의 실로 보드 상하면 층을 연결하는 구조 방식입니다. 이를 통해 고압(12-15 PSI) 팽창이 가능하고 뛰어난 강성을 얻습니다.
    - q: 이상적인 체중 대 부피 비율은?
      a: 좋은 목표는 보드 부피 1리터당 라이더 체중 약 5-6파운드입니다. 220파운드 패들러는 180리터 이상의 부피를 가진 보드를 찾아야 합니다.
    - q: 보드 무게가 중요한가요?
      a: 네. 가벼운 보드(20파운드 미만)는 운반과 이동이 쉽습니다. 무거운 보드(25파운드 이상)는 더 내구성 있는 다층 PVC 구조를 의미하는 경우가 많습니다.

- slug: sup-maintenance
  category: maintenance
  title: 인플래터블 SUP 청소 및 보관법
  description: 인플래터블 SUP 보드 수명을 최대화하는 단계별 관리 가이드.
  tldr: 사용 후 매번 민물로 헹구고, 보관 전 완전히 말리고, 공기를 빼고 느슨하게 말고(꽉 세게 말지 말고), 서늘하고 건조한 직사광선 없는 곳에 보관하고, 이음새는 매달 점검하세요.
  problem: 잘못된 보관과 청소는 인플래터블 SUP 조기 손상의 가장 큰 원인입니다 — 곰팡이, 자외선 손상, 이음새 박리.
  solution: 세션 후 일관된 루틴을 따르세요 — 헹구고, 말리고, 점검하고, 공기를 빼고, 보관합니다. 완고한 오염에는 중성 세제를 쓰세요. 젖은 채로나 직사광선 아래 보관하지 마세요.
  audience: 보드를 5년 이상 사용하고 싶은 모든 인플래터블 SUP 소유자.
  steps:
    - 사용 후 즉시 민물로 보드를 헹구세요 — 특히 바닷물 사용 후에는
    - 중성 세제와 부드러운 스펀지로 닦으세요 — 강한 화학제품이나 고압 세척기는 피하세요
    - 보드를 완전히 말리세요 — 밸브를 열어 갇힌 물이 빠지게 하세요
    - 손상을 점검하세요 — 이음새, 밸브, 표면의 펑크를 확인하세요
    - 완전히 공기를 빼세요 — 완전 방기를 위해 밸브 코어를 제거하세요
    - 보드를 느슨하게 마세요 — 노즈에서부터 말기 시작하고 꽉 조인 접힘을 피하세요
    - 캐리 백에 넣어 직사광선이 닿지 않는 서늘하고 건조한 곳에 보관하세요
  faq:
    - q: SUP를 시즌 내내 부풀린 채 둘 수 있나요?
      a: 가능하지만 사용하지 않을 때는 직사광선을 피하세요. 장기 보관에는 부분 방기(8-10 PSI)가 권장됩니다.
    - q: 펑크는 어떻게 수리하나요?
      a: 주변을 청소하고 모서리가 둥근 패치를 자르고, 접착제를 바르고, 꾹 누르고, 24시간 기다린 뒤 공기를 넣으세요. afarar 보드에는 수리 키트가 포함되어 있습니다.
    - q: 밸브는 얼마나 자주 점검하나요?
      a: 매달입니다. 밸브는 가장 흔한 고장 지점입니다. 밸브 핀이 부드럽게 움직이고 O링이 온전한지 확인하세요.

- slug: sup-inflation-psi-guide
  category: technical
  title: SUP 공기압 가이드 — 성능과 안전을 위한 최적 PSI
  description: SUP 공기압 완전 가이드 — 권장 PSI 범위, 압력이 성능에 미치는 영향, 펌프를 올바르게 쓰는 요령.
  tldr: 대부분의 인플래터블 SUP는 12-15 PSI로 부풀립니다. 압력이 높을수록 강성은 커지지만 팽창이 느립니다. 압력이 낮으면 부드러운 느낌이지만 휩니다. 보드에 인쇄된 최대 PSI를 넘지 마세요. 정확한 압력계 달린 펌프를 쓰세요. 차가운 공기는 압력을 낮추고 뜨거운 햇볕은 높입니다.
  problem: 공기압이 부족한 보드는 둔하게 느껴지고 과도하게 휩니다. 과다 팽창한 보드는 이음새 파손 위험이 있습니다. 많은 패들러가 정확히 재지 않고 PSI를 추측합니다.
  solution: 압력계 내장 펌프를 사용하세요. 최대 강성을 위해 15 PSI를 목표로 하세요. 세션 전마다 압력을 확인하세요 — 온도 변화는 PSI에 큰 영향을 줍니다.
  audience: 모든 인플래터블 SUP 소유자.
  steps:
    - 밸브 근처 보드에 인쇄된 권장 PSI 범위를 확인하세요
    - 더블 액션 펌프로 권장 범위의 중간까지 부풀리세요
    - 마지막 3-4 PSI는 싱글 액션 모드로 전환해 정밀하게 조절하세요
    - 압력계로 확인하세요 — 아날로그 압력계가 디지털보다 신뢰성이 높습니다
    - 조건에 맞게 조정하세요 — 투어링/레이스는 높게, 급류/바위 많은 진수는 낮은 PSI
    - 보드를 10분 두고 나서 다시 확인하세요 — 온도 평형으로 PSI가 변합니다
  faq:
    - q: SUP를 과다 팽창시킬 수 있나요?
      a: 네. 정격 최대 PSI(보통 15-18 PSI)를 넘으면 이음새가 박리되고 드롭스티치 코어가 손상될 수 있습니다. 항상 인쇄된 범위 내에 머무르세요.
    - q: 온도는 PSI에 영향을 주나요?
      a: 큰 영향을 줍니다. 70°F에서 15 PSI로 부풀린 보드는 95°F 직사광선에서 18 PSI에 도달할 수 있습니다. 찬물에서는 12 PSI까지 떨어질 수 있습니다. 환경이 바뀌면 압력을 확인하세요.
    - q: 초보자에게 맞는 PSI는?
      a: 배울 때는 12-13 PSI로 낙수에 관대한 살짝 부드러운 플랫폼이 됩니다. 실력이 오르면 15 PSI까지 높이세요.

- slug: paddling-techniques
  category: tutorial
  title: 필수 SUP 패들링 기술
  description: 전진 스트로크, 스윕 스트로크, 크로스보우 턴을 마스터하여 어떤 조건에서도 효율적으로 패들링하세요.
  tldr: 전진 스트로크는 팔이 아니라 코어를 사용합니다. 스윕 스트로크는 보드를 회전시킵니다. 크로스보우 턴은 가장 효율적인 방향 전환입니다. 패들을 수직으로 유지하고 블레이드를 완전히 담가 최대한의 파워 전달을 얻으세요.
  problem: 많은 패들러는 팔 중심 스트로크를 써서 에너지를 낭비하고 어깨 피로를 부릅니다. 나쁜 기술은 바람과 거친 물에서 보드 조종도 어렵게 만듭니다.
  solution: 전진, 스윕, 크로스보우 턴이라는 세 가지 필수 스트로크를 올바른 신체 역학과 함께 배우세요. 어려운 조건에 도전하기 전에 잔잔한 물에서 각각을 연습하세요.
  audience: 더 오래, 더 빠르게, 덜 피로하게 패들링하고 싶은 패들러.
  steps:
    - 전진 스트로크 — 앞으로 뻗고, 블레이드를 완전히 담그고, 몸통 회전(팔이 아님)으로 당기고, 발목 위치에서 빼세요
    - 스윕 스트로크 — 레일 앞쪽으로 뻗어 블레이드를 넓은 호를 그리며 테일 쪽으로 쓸고, 패들 반대쪽으로 보드를 회전하세요
    - 크로스보우 턴 — 손을 바꾸지 않고 보드 반대쪽에 패들을 놓고 테일 쪽으로 당기세요
    - 브레이싱 — 거친 물에서 안정성을 위해 낮은 브레이스를 쓰세요 — 블레이드를 수면에 평평하게 대세요
    - 드로 스트로크 — 옆으로 뻗어 보드를 패들 쪽으로 옆으로 당기세요
  faq:
    - q: 일직선으로 어떻게 저어 가나요?
      a: 양쪽 모두 일관된 스트로크 길이를 유지하세요. 5-10회마다 방향을 바꾸세요. 기준점으로 수평선 위의 고정 지점을 바라보세요.
    - q: 무릎을 굽혀야 하나요?
      a: 네. 무릎을 살짝 굽혀 충격 흡수 장치로 삼으세요. 굳은 무릎은 잔물결 전부를 코어에 전달해 안정성을 떨어뜨립니다.
    - q: 맞바람에서 어떻게 저어 가나요?
      a: 자세를 낮추고, 짧고 빠른 스트로크를 쓰고, 바람이 약한 해안 근처에 머무르세요. 바람이 너무 강하면 나가지 마세요.

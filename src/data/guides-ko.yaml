- slug: sup-board-materials
  category: technical
  title: SUP 보드 재질 — PVC, EPS, 에폭시, 드롭스티치 해설
  description: SUP 구조 재질 기술 가이드 — 드롭스티치 PVC 인플래터블과 EPS 폼 코어 하드보드. 각 유형이 왜 다르게 성능을 내는지 이해하세요.
  tldr: 인플래터블 SUP는 강성을 위한 수천 개의 내부 실을 지닌 드롭스티치 PVC를 사용합니다. 하드보드는 에폭시나 유리섬유 외피를 지닌 EPS 폼 코어를 사용합니다. 인플래터블은 휴대성과 내구성에서 이기고, 하드보드는 속도와 느낌에서 이깁니다. 15 PSI의 최신 드롭스티치 기술은 하드보드 강성에 버금갑니다.
  problem: 구매자는 인플래터블과 하드보드의 근본적인 구조 차이를 이해하지 못해 잘못된 구매 결정을 내립니다.
  solution: 재질을 주요 용도에 맞추세요 — 여행, 보관, 내구성에는 인플래터블 드롭스티치, 레이스, 서핑, 최대 성능에는 EPS/에폭시입니다.
  audience: 인플래터블과 하드보드 구조를 비교하는 SUP 구매자.
  steps:
    - 인플래터블 드롭스티치 — 수천 개의 폴리에스터 실이 상하면 층을 연결해 12-15 PSI로 가압되면 단단한 구조를 만듭니다
    - 하드 EPS 폼 — 헐 설계로 성형된 발포 폴리스티렌 코어를 에폭시 수지와 유리섬유 층으로 밀봉합니다
    - 인플래터블 장점 — 접을 수 있음, 튼튼함, 가벼운 운반, 안전한 소프트 레일
    - 하드보드 장점 — 더 가벼운 전체 무게, 단단한 플랫폼, 더 나은 글라이드 효율, 더 좋은 반응성
    - 하이브리드 선택지 — 일부 제조사는 두 장점을 결합하려고 드롭스티치와 리지드 패널을 조합합니다
  faq:
    - q: 인플래터블 SUP도 하드보드만큼 단단한가요?
      a: 양질의 드롭스티치 구조로 15 PSI면 최신 인플래터블은 매우 가깝습니다. 대부분의 레저 패들러는 차이를 느끼지 못합니다. 레이스 패들러는 하드보드의 날카로움을 알아차립니다.
    - q: 어느 재질이 더 오래 가나요?
      a: 인플래터블 SUP는 관리에 따라 5-10년 갑니다. 하드보드는 10-20년이지만 균열, 찌그러짐, 흡수의 위험이 있습니다. 일상적으로는 인플래터블이 손상에 더 강합니다.
    - q: PVC는 환경에 좋은가요?
      a: PVC 생산은 환경 영향이 있지만, 인플래터블 SUP는 오래 사용되고(교체 빈도 감소) 작게 접힙니다(운송 배출 감소). 낡은 보드는 항상 올바르게 재활용하세요.

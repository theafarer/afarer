- slug: sup-size-guide
  category: buying-guide
  title: SUP 사이즈 가이드 — 알맞은 보드 치수 고르는 법
  description: 체중, 신장, 실력 수준, 패들링 스타일에 따른 길이, 폭, 두께 권장을 다루는 완전한 SUP 사이즈 가이드.
  tldr: 초보자는 안정성을 위한 넓은 보드(32-34인치)가 필요합니다. 체중이 무거운 패들러는 더 높은 부피의 긴 보드(11피트 초과)가 필요합니다. 투어링에는 긴 헐(12피트 초과)이 필요합니다. 요가에는 특별한 폭(34인치 초과)이 필요합니다. 항상 하중 용량을 확인하세요 — 체중과 장비의 합이 한계의 80%를 넘지 않아야 합니다.
  problem: 잘못된 SUP 사이즈 선택은 낮은 안정성, 느린 직진성, 좌절스러운 패들링 경험으로 이어집니다. 대부분의 첫 구매자는 치수가 성능에 어떤 영향을 주는지 고려하지 않고 보기 좋은 보드를 고릅니다.
  solution: 보드 길이, 폭, 두께를 체중, 실력, 주요 용도에 맞추세요. 사이즈 계산법을 활용하세요 — 체중과 장비 무게를 더하고, 그 합보다 최소 20% 여유가 있는 보드를 고르세요.
  audience: 처음 SUP를 사는 사람, 전용 보드로 업그레이드하는 패들러, 사이즈가 확실치 않은 모든 사람.
  steps:
    - 휴대할 모든 장비(패들, PFD, 드라이백)를 포함해 체중을 재세요
    - 20% 안전 마진을 더해 최소 하중 용량을 구하세요
    - 실력으로 폭을 고르세요 — 초보자 32-34인치, 중급자 30-32인치, 상급자 28-30인치
    - 용도로 길이를 고르세요 — 10'6"-11'6"는 올어라운드, 12'-14'는 투어링, 9'-10'는 급류
    - 두께를 확인하세요 — 6인치 표준, 4인치는 퍼포먼스용, 5인치는 올어라운드
    - 보드의 권장 PSI 범위를 확인해 최적의 강성을 얻으세요
  faq:
    - q: 초보자에게 가장 좋은 폭은?
      a: 32-34인치 폭이 가장 안정적인 플랫폼을 제공합니다. 보드가 넓을수록 균형을 잡기 쉽습니다 — 특히 체격이 큰 패들러에게 유리합니다.
    - q: SUP가 나에게 너무 작은지 어떻게 알 수 있나요?
      a: 보드가 물에 낮게 앉고, 조종이 둔하고, 패들링 중 노즈가 쉽게 잠긴다면 체중에 비해 작을 가능성이 큽니다.
    - q: 보드 길이는 속도에 영향을 주나요?
      a: 네. 긴 수선 길이는 이론 선체 속도를 높입니다. 같은 패들러 노력에서 14피트 투어링 보드는 10피트 올어라운드 보드보다 눈에 띄게 빠릅니다.

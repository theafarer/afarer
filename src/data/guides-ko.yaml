- slug: weather-conditions
  category: safety
  title: 패들보딩을 위한 날씨 조건 이해
  description: 바람, 파도, 조석, 기상 패턴을 읽어 물 위에서 안전한 결정을 내리는 법을 배우세요.
  tldr: 출항 전 항상 세 가지를 확인하세요 — 풍속(초보자는 10 mph 미만), 파고(초보자는 1피트 미만), 수온(기온이 아니라 수온에 맞춰 착용). 해안에서 바다로 부는 바람은 실력과 무관하게 위험합니다.
  problem: 날씨 관련 사고의 대부분은 패들러가 조건을 잘못 판단해서 일어납니다 — 기온은 확인하지만 수온은 확인하지 않거나, 해안에서 바다로 부는 바람이 자신을 먼 바다로 밀 수 있다는 점을 모릅니다.
  solution: 체계적인 출항 전 기상 평가를 사용하세요 — 풍향과 풍속, 파도 주기와 파고, 조석 상태, 수온. 각 요소가 안전에 어떤 영향을 주는지 이해하세요.
  audience: 호수, 만, 강, 바다 등 개방 수역에 나가는 모든 패들러.
  steps:
    - 풍속과 풍향을 확인하세요 — 해안에서 바다로 부는 바람이 가장 위험합니다
    - 파도 상태를 평가하세요 — 파고만큼 파도 주기도 중요합니다
    - 조석을 파악하세요 — 조류는 패들링 속도보다 강할 수 있습니다
    - 수온을 측정하세요 — 60°F/15°C 미만에서는 보호 의류가 필요합니다
    - 가시성을 확인하세요 — 안개와 폭우는 시야를 줄이고 충돌 위험을 높입니다
    - 지역 위험 요소를 이해하세요 — 수중 암석, 강한 흐름, 보트 통행 구역
  faq:
    - q: SUP에 바람이 너무 센 기준은?
      a: 초보자는 10 mph(8노트) 초과, 중급자는 15 mph(13노트) 초과, 상급자는 20 mph(17노트) 초과. 의심되면 나가지 마세요.
    - q: 파도 주기란 무엇인가요?
      a: 파도 주기는 연속되는 파도 사이의 시간입니다. 짧은 주기(8초 미만)는 가파르고 거친 파도를 의미합니다. 긴 주기(12초 초과)는 매끄럽고 예측 가능한 너울을 의미합니다.
    - q: 비가 와도 패들링할 수 있나요?
      a: 가벼운 비는 대체로 안전합니다. 폭우는 시야를 제한하고 바람 변화를 알리는 신호일 수 있습니다. 뇌우가 오면 즉시 물에서 벗어나세요.

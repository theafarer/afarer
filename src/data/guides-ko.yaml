- slug: sup-weight-capacity
  category: buying-guide
  title: SUP 하중 용량 가이드 — SUP는 얼마나 실을 수 있나요?
  description: SUP 하중 용량 한계, 총 적재량 계산법, 그리고 한계 초과가 성능과 안전에 영향 주는 이유를 이해하세요.
  tldr: 체중과 장비를 합쳐 보드의 최대 하중 용량 80%를 넘지 마세요. 하중 용량 220파운드 보드는 가벼운 장비를 지닌 160파운드 패들러에게 알맞습니다. 한계를 넘으면 돌고래 뛰기 현상, 둔한 조종, 손상 위험 증가를 일으킵니다.
  problem: 패들러는 종종 보드의 하중 용량을 초과해 성능 저하, 침수, 보드 손상의 위험을 겪습니다. 제조사는 최대치를 표기하지만 안전 작업 하중은 설명하지 않습니다.
  solution: 총 적재량(체중 + 장비 + 보드가 흡수하는 물)을 계산하고 표기된 최대 용량의 80% 미만에 머무르세요. 체중이 무거운 패들러는 300파운드 이상 용량의 높은 부피 보드가 필요합니다.
  audience: 모든 체격의 패들러, 특히 체격이 큰 패들러와 원정 장비를 싣는 사람.
  steps:
    - 보드에 인쇄된 최대 하중 용량을 확인하세요(보통 밸브 근처)
    - 패들, PFD, 드라이백, 쿨러, 액세서리를 포함한 자신과 모든 장비의 무게를 재세요
    - 계산하세요 — (총 적재량) ÷ (최대 용량) × 100 = 용량 사용률 %
    - 최적의 성능과 안전을 위해 70-80%를 목표로 하세요
    - 80%를 넘으면 더 큰 보드를 고르거나 장비를 줄이세요
  faq:
    - q: 하중 한계를 초과하면 어떻게 되나요?
      a: 보드가 낮게 떠 저항이 늘어납니다. 안정성이 떨어지고, 노즈가 잠기며, 거친 물에서 드롭스티치 코어 손상 위험이 높아집니다.
    - q: 두 사람이 한 SUP에 탈 수 있나요?
      a: 총 무게가 용량의 80% 미만일 때만 가능합니다. 대부분의 표준 SUP는 1인용으로 설계되었습니다. 2인 승선은 2인용으로 특별히 정격된 보드가 필요합니다.
    - q: 인플래터블 SUP는 하드보드보다 용량이 낮나요?
      a: 두꺼운 부피 분포 덕분에 드롭스티치 구조의 양질의 인플래터블은 하드보드와 같거나 더 높은 하중 용량을 지닙니다.

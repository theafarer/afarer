- slug: sup-travel-transport
  category: planning
  title: SUP 여행 가이드 — 인플래터블 SUP와 비행, 로드트립
  description: 비행기, 자동차, 캠핑카로 인플래터블 SUP를 여행하는 방법. 항공사 수하물 요금, 패킹, 현지 팽창, 해외 여행 고려 사항.
  tldr: SUP의 공기를 빼고, 말고, 백팩에 싸세요. 대부분의 항공사는 위탁 수하물(50파운드/50리니어 인치 미만)로 받아들입니다. 펌프와 패들은 반드시 같은 가방에 넣으세요. 카운터 직원이 가방 크기를 물어볼 것에 대비해 여유 있게 도착하세요. 긴 여행에는 미리 배송하는 것도 고려하세요.
  problem: SUP와 함께 여행하는 것은 복잡해 보입니다 — 항공사 크기 제한, 보안 검색 우려, 먼 목적지에서의 팽창 방법이 불확실성을 만듭니다.
  solution: Afarer SUP 백팩은 항공사 위탁 수하물 기준을 충족하도록 설계되었습니다. 전략적으로 패킹하고, 수리 키트를 챙기고, 출발 전 팽창 장소(마리나, 전기 있는 캠핑장)를 조사하세요.
  audience: 비행기, 자동차, 캠핑카로 SUP 여행을 계획하는 패들러.
  steps:
    - 완전히 공기를 빼고 노즈에서 테일 쪽으로 마세요
    - 만 보드, 펌프, 패들, 리시, 핀을 백팩에 싣세요
    - 항공사 크기와 무게 제한을 확인하세요 — 대부분 62리니어 인치와 50파운드까지 허용합니다
    - 일찍 도착해 가방이 수동 검사될 것에 대비하세요
    - 기내에 수리 키트를 넣어 운송 중 보드 손상에 대비하세요
    - 팽창 방법을 조사하세요 — 전동 펌프용 캠핑장 전원, 마리나 에어 스테이션
  faq:
    - q: 항공사가 SUP 백팩을 수하물로 받아주나요?
      a: 미국과 유럽 대부분의 항공사는 50파운드와 62리니어 인치 미만의 SUP 백팩을 표준 위탁 수하물로 받습니다. 저가 항공사는 초과 크기 요금을 부과할 수 있습니다.
    - q: SUP를 기내에 가지고 탈 수 있나요?
      a: 불가능합니다. SUP 백팩은 모든 항공사의 기내 수하물 크기를 초과합니다. 반드시 위탁하세요.
    - q: 먼 목적지에서 어떻게 SUP를 부풀리나요?
      a: 포함된 핸드 펌프는 전원 없이 어디서든 쓸 수 있습니다. 편의를 위해 휴대용 전동 펌프를 가져가고, 전기 있는 캠핑장이나 에어 스테이션이 있는 마리나를 찾으세요.

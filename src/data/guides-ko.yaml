- slug: sup-with-kids
  category: lifestyle
  title: 아이와 SUP — 온 가족을 위한 완전 가이드
  description: 아이를 안전하게 패들보딩에 데려가는 방법 — 권장 연령, 장비, 활동.
  tldr: 만 6세 이상 아이는 어른과 함께 SUP에 탈 수 있습니다. 만 10세 이상은 감독 아래 자기 보드를 저을 수 있습니다. 넓고 안정적인 보드를 쓰고, 항상 PFD를 착용하고, 얕고 잔잔한 물에 머물고, 세션은 짧게(최대 30-45분) 하세요.
  problem: 부모는 아이와 수상 스포츠를 즐기고 싶지만 안전, 장비 맞춤, 아이의 흥미 유지를 걱정합니다.
  solution: 탠덤 승선에 알맞은 보드 크기를 쓰고, 모든 아이가 몸에 맞는 PFD를 착용하게 하고, 얕고 따뜻한 물에서 시작하고, 게임과 짧은 세션으로 재미있게 하세요.
  audience: 아이에게 패들보딩을 소개하고 싶은 부모.
  steps:
    - 만 4-6세 — 어른 보드에 함께 타기 — 앞에 앉아 중앙 손잡이를 잡습니다
    - 만 6-10세 — 어른의 감독과 리시 아래 자기 보드 위에 무릎 꿇거나 앉기
    - 만 10세 이상 — 근처에서 어른이 지켜보며 자기 보드 저우기
    - 항상 PFD를 착용하세요 — 아이는 언제나 몸에 맞는 구명조끼를 입어야 합니다
    - 얕은 물에 머무르세요 — 어른의 허리 깊이까지
    - 세션은 짧게 하세요 — 만 10세 미만은 최대 30-45분
    - 재미있게 하세요 — 놀이, 물고기 찾기, 일어서기 연습을 하세요
  faq:
    - q: 몇 살부터 혼자 SUP를 할 수 있나요?
      a: 감독 아래 대략 만 10-12세부터이며, 아이의 수영 능력과 물 친숙도에 따라 다릅니다. 항상 잔잔하고 얕은 조건에서 하세요.
    - q: 아이와 SUP에 가장 좋은 보드는?
      a: 탠덤 승선을 위한 충분한 하중 용량을 가진 넓은 보드(34인치 초과)입니다. SUP Explorer 11의 33인치 폭과 220파운드 하중 용량은 부모와 아이 함께 사용에 알맞습니다.
    - q: 아이에게 필요한 안전 장비는?
      a: 몸에 맞는 CE 인증 구명조끼, 리시(탠덤 시 어른 보드에 연결), 자외선 차단제, 모자입니다.

  title: 알맞은 SUP 패들 고르는 법
  description: 패들 재질, 블레이드 형태, 샤프트 종류, SUP용 사이즈 선택 가이드.
  tldr: 패들 길이 — SUP 패들은 키보다 6-8인치 길어야 합니다. 블레이드 형태 — 다이히드럴 블레이드는 곧게 나아가고, 플랫 블레이드는 물을 더 강하게 붙잡습니다. 샤프트 재질 — 카본이 가장 가볍고, 유리섬유가 최고의 가성비이고, 알루미늄이 저렴합니다.
  problem: 잘못된 패들 크기나 재질은 불필요한 피로, 낮은 스트로크 효율, 관절 부담을 일으킵니다.
  solution: 패들 길이, 블레이드 형태, 샤프트 재질, 유연성을 자신의 패들링 스타일, 체격, 예산에 맞추세요.
  audience: 첫 패들이나 다음 패들을 고르는 SUP 패들러.
  steps:
    - 패들 길이를 재세요 — 일반 패들링에는 키보다 6-8인치 깁니다
    - 블레이드 재질을 고르세요 — 예산은 나일론, 가성비는 유리섬유, 성능은 카본
    - 블레이드 형태를 고르세요 — 부드러운 직진성은 다이히드럴, 파워는 플랫, 레이스는 스푼
    - 샤프트 종류를 고르세요 — 일반용은 스트레이트, 레이스 SUP는 벤트
    - 유연성을 확인하세요 — 단단한 샤프트는 파워 전달이 좋고, 유연한 샤프트는 관절 부담을 줄입니다
  faq:
    - q: 가장 좋은 패들 재질은?
      a: 유리섬유는 무게, 내구성, 가격의 최고 균형을 제공합니다. 카본은 더 가볍지만 비싸고 부서지기 쉽습니다. 나일론은 무겁지만 사실상 파손되지 않습니다.
    - q: 패들 길이가 맞는지 어떻게 알 수 있나요?
      a: 패들을 옆에 세워 보세요 — 팔을 머리 위로 들어 올렸을 때 손잡이가 손목에 닿는 길이가 맞습니다.
    - q: 원피스와 조절식 중 어느 것을 사야 하나요?
      a: 조절식 패들은 공유 사용과 여행에 좋습니다. 원피스 패들은 더 가볍고 단단하며 전용 사용에 더 효율적입니다.

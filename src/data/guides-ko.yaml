- slug: sup-storage-winter-care
  category: maintenance
  title: SUP 보관과 겨울 관리 — 보드 수명 늘리기
  description: 인플래터블 SUP 보드를 올바르게 보관, 청소, 겨울 대비하는 방법. 올바른 관리로 곰팡이, 자외선 손상, 재질 열화를 막으세요.
  tldr: 사용 후 매번 민물로 씻으세요. 보관 전 완전히 마르게 하세요. 공기를 빼고 직사광선과 극단적 온도를 피한 서늘하고 어두운 곳에 보관하세요. 부풀린 채나 뜨거운 차 안에 보관하지 마세요. 주기적으로 자외선 보호제를 바르세요.
  problem: 잘못된 보관은 SUP 조기 손상의 가장 큰 원인입니다 — 곰팡이, 재질 분해, 박리, 그리고 열이나 추위로 인한 밸브 손상.
  solution: 3단계 관리 루틴을 따르세요 — 세션 후 헹구기, 보관 전 완전히 말리기, 50-80°F(10-27°C)의 온도 관리 환경에서 공기를 빼 보관하기.
  audience: 보드를 5년 이상 사용하고 싶은 모든 SUP 소유자.
  steps:
    - 바닷물이나 탁한 물 세션 후에는 매번 보드, 패들, 펌프를 민물로 헹구세요
    - 중성 세제와 부드러운 스펀지로 닦으세요 — 강한 화학제품이나 고압 세척기는 절대 쓰지 마세요
    - 공기를 빼기 전에 보드를 야외에서 완전히 마르게 하세요(밸브를 열어 내부 습기가 빠지게)
    - 완전히 공기를 빼고, 노즈에서 테일 쪽으로 말아 남은 공기를 빼내세요
    - 보드를 넣기 전에 백팩을 마른 천으로 닦으세요
    - 서늘하고 어두운 벽장이나 침대 밖에 보관하세요 — 직사광선, 뜨거운 차 안, 얼어붙는 창고에는 절대 두지 마세요
  faq:
    - q: SUP를 시즌 내내 부풀린 채 둘 수 있나요?
      a: 오래 사용하지 않을 때는 공기를 빼는 것이 좋습니다. 일정한 PSI 부하는 재질 피로를 가속합니다. 2주 이상 보관하면 세션 사이에 공기를 빼세요.
    - q: SUP의 곰팡이는 어떻게 제거하나요?
      a: 중성 세제를 따뜻한 물에 풀고 흰 식초를 조금 넣으세요. 부드러운 솔로 살살 문지르고, 깨끗이 헹구고, 그늘에서 말리세요. PVC를 손상하는 표백제는 피하세요.
    - q: 차고에 보관할 수 있나요?
      a: 차고가 연중 50-80°F를 유지할 때만 가능합니다. 다락방과 냉난방 없는 차고는 드롭스티치 코어를 손상하는 극단적 온도 변화를 겪습니다.

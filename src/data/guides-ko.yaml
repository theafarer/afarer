- slug: safety-tips
  category: safety
  title: 수상 스포츠 안전 수칙
  description: 패들보딩을 위한 필수 안전 지침 — 장비 점검부터 날씨 인지까지.
  tldr: 항상 CE 인증 구명조끼를 착용하고, 출항 전 날씨와 수면 상태를 확인하고, 통신 장비를 휴대하고, 낯선 물에서는 절대 혼자 패들링하지 않고, 장비의 정격 한계를 이해하세요.
  problem: 대부분의 수상 스포츠 사고는 준비 부족에서 비롯됩니다 — 구명조끼 미착용, 기상 경고 무시, 설계 한계를 넘는 장비 사용.
  solution: 출항 전 안전 체크리스트를 활용하세요. 장비 상태를 확인하고, 날씨와 수온을 점검하고, 누군가에게 경로를 알리고, 항상 적절한 부력 장비를 착용하세요.
  audience: 모든 패들보더와 수상 스포츠 참가자.
  steps:
    - 일기예보를 확인하세요 — 풍속 15 mph 초과와 뇌우는 피하세요
    - 수온을 확인하세요 - 찬물(60°F/15°C 미만)에는 웻슈트 또는 드라이슈트가 필요합니다
    - 장비를 점검하세요 — 공기 누수, 균열, 적절한 공기압을 확인하세요
    - CE 인증 구명조끼를 항상 착용하세요
    - 리시를 발목이나 종아리에 착용하세요
    - 플로트 플랜을 남기세요 — 어디로 가서 언제 돌아오는지 누군가에게 알리세요
    - 통신 수단을 휴대하세요 — 방수 휴대폰 케이스 또는 VHF 라디오
    - 자신의 한계를 아세요 — 실력 수준과 장비 정격 내에 머무르세요
  faq:
    - q: SUP에 구명조끼가 필요한가요?
      a: 네. 많은 지역에서 SUP를 포함한 모든 선박에 구명조끼를 법적으로 요구합니다. 요구하지 않는 곳에서도 CE 인증 구명조끼는 필수 안전 장비입니다.
    - q: 수상 스포츠에서 가장 흔한 심각한 위험은?
      a: 냉수 침수와 탈진이 가장 흔한 심각한 위험입니다. 기온이 아니라 수온에 맞춰 옷을 입으세요.
    - q: 조건이 안전한지 어떻게 확인하나요?
      a: 해양 기상 예보를 활용하세요. 풍속, 파고, 수온을 확인하세요. 초보자는 풍속 10 mph 미만, 파고 1피트 미만 조건에 머물러야 합니다.

- slug: multi-day-trip
  category: planning
  title: 다회원 SUP 여행 계획
  description: 여러 날에 걸친 패들링 여행을 계획하고 실행하는 방법 — 경로 계획, 장비 패킹, 캠핑, 안전.
  tldr: 하루 10-15마일로 계획하세요. 장비는 방수 드라이백에 넣고, 무게를 고르게 배분하고, 출발 전 보드 적재를 연습하세요. 플로트 플랜을 남기세요. 물, 식량, 쉼터, 항해 장비, 통신 수단을 휴대하세요.
  problem: 다회원 여행은 과적, 나쁜 경로 계획, 날씨와 물결 과소평가로 실패합니다 — 피로, 장비 고장, 안전 사고로 이어집니다.
  solution: 체계적인 계획 접근을 사용하세요 — 경로 선택, 장비 체크리스트, 식량 계획, 안전 브리핑, 돌발 상황 대비.
  audience: 첫 다회원 원정을 계획 중인 경험 많은 패들러.
  steps:
    - 정비된 캠핑장과 철수 지점이 있는 경로를 선택하세요
    - 바람과 물결을 고려해 하루 10-15마일을 계획하세요
    - 여행 전체 기간의 조석표와 일기예보를 확인하세요
    - 장비는 방수 드라이백에 넣으세요 — 총 장비 무게는 20-30파운드
    - 무게를 고르게 배분하세요 — 가장 무거운 짐은 중앙에
    - 육지에 있는 누군가에게 상세한 플로트 플랜을 남기세요
    - 항해 장비를 챙기세요 — 종이 해도, 나침반, GPS 백업
    - 비상 쉼터, 여분 식량, 구급 키트를 챙기세요
  faq:
    - q: 이상적인 하루 거리는 얼마인가요?
      a: 경험 많은 패들러는 하루 10-15마일입니다. 초보자는 5-8마일로 계획하세요. 항상 날씨를 위한 여유 시간을 넣으세요.
    - q: 물을 얼마나 가져가야 하나요?
      a: 1인당 하루 1갤런입니다. 더운 환경에서는 1.5갤런. 보충용으로 휴대용 정수기나 정수 정제를 챙기세요.
    - q: 가장 중요한 안전 물품은?
      a: 통신 수단입니다. VHF 라디오나 위성 메신저는 비상시 생명을 구할 수 있습니다. 휴대폰은 오지에서는 신뢰할 수 없습니다.

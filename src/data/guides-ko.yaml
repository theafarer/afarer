- slug: inflatable-repair
  category: maintenance
  title: 인플래터블 SUP 수리법
  description: 인플래터블 SUP의 펑크, 밸브 문제, 이음새 손상을 수리하는 단계별 가이드.
  tldr: 작은 펑크(1/4인치 미만)는 포함된 수리 키트로 고칠 수 있습니다. 주변을 청소하고, PVC 접착제를 바르고, 패치를 누르고, 24시간 기다리세요. 밸브 누수는 보통 O링 교체가 필요합니다. 큰 찢어짐이나 이음새 박리는 전문 수리가 필요합니다.
  problem: 작은 펑크와 밸브 문제는 흔하지만 쉽게 고칠 수 있습니다. 올바른 수리 기법이 없으면 전문 수리비를 과도하게 지불하거나 손상을 악화시킵니다.
  solution: 손상 유형 — 펑크, 밸브 누수, 이음새 문제 — 을 파악하고 적절한 수리 방법을 적용하세요. 대부분의 수리는 30분과 경화 시간이면 끝납니다.
  audience: 기본 수리를 스스로 처리하고 싶은 인플래터블 SUP 소유자.
  steps:
    - 누수 위치를 찾으세요 — 완전히 부풀리고, 공기 소리를 듣고, 손으로 느끼거나 비눗물을 사용하세요
    - 펜이나 테이프로 누수 지점을 표시하세요
    - 누수 주변을 이소프로필 알코올로 청소하세요 — 손상 주변 최소 2인치
    - 접착력을 높이기 위해 고운 사포로 표면을 거칠게 하세요
    - 패치와 보드 표면 모두에 PVC 접착제를 바르세요
    - 접착제가 끈적여질 때까지 5분 기다리세요
    - 패치를 꾹 누르고, 롤러나 카드로 공기를 밀어 내며 평평하게 하세요
    - 최대 압력으로 부풀리기 전에 24시간 경화하세요
  faq:
    - q: 물 위에서 펑크를 수리할 수 있나요?
      a: 패치와 테이프를 이용한 응급 처치로 해안까지 돌아올 수 있습니다. 본격적인 수리에는 건조한 환경과 24시간 경화가 필요합니다.
    - q: 누수 밸브는 어떻게 고치나요?
      a: 포함된 도구로 밸브 코어를 제거하고, O링 손상을 확인하고, 필요하면 교체하고, 코어를 꽉 조여 다시 끼우세요.
    - q: PVC 수리에는 어떤 접착제를 쓰나요?
      a: HH-66이나 Clifton 같은 PVC 전용 접착제를 쓰세요. 일반 순간 접착제는 인플래터블 PVC 재료에 잘 붙지 않습니다.

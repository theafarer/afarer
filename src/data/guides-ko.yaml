- slug: sup-fishing
  category: lifestyle
  title: SUP 낚시 가이드 — 패들보드에서 낚시하는 법
  description: 패들보드 낚시에 대해 알아야 할 모든 것 — 장비 세팅, 안정성 팁, 기법.
  tldr: SUP 낚시는 조용한 접근, 얕은 물 진입, 360도 캐스팅을 제공합니다. 넓고 안정적인 보드(34인치 초과)를 쓰고, 로드 홀더를 장착하고, 쿨러나 크레이트를 장비 데크로 쓰세요. 바람이 부는 날에는 닻으로 고정하세요. 항상 PFD를 착용하세요.
  problem: 일반 낚시보트는 유지 비용이 비싸고 얕은 물에 들어갈 수 없습니다. SUP 낚시는 휴대 가능한 얕은 물 낚시 플랫폼으로 이를 해결하지만, 전용 장비 구성이 필요합니다.
  solution: 안정적인 SUP에 로드 홀더, 장비 크레이트, 닻 시스템을 장착하세요. 보드의 휴대성을 활용해 보트가 닿을 수 없는 외진 낚시 포인트에 접근하세요.
  audience: 얕은 물과 외진 장소에서 낚시하거나 가볍고 휴대 가능한 낚시 플랫폼을 선호하는 낚시꾼.
  steps:
    - 장비를 실을 충분한 하중 용량을 가진 넓은 보드(34인치 초과)를 고르세요
    - 레일 마운트 또는 스트랩식 시스템으로 데크에 로드 홀더를 장착하세요
    - 방수 크레이트나 쿨러를 앞 데크에 고정해 낚시 장비를 넣으세요
    - 바람 부는 날을 위해 소형 닻이나 스테이크아웃 폴을 챙기세요
    - 도구와 휴대폰을 넣을 주머니 달린 PFD를 착용하세요
    - 서기 전에 무릎 자세에서 캐스팅을 연습하세요
  faq:
    - q: SUP 위에 서서 낚시할 수 있나요?
      a: 네. 34인치 초과 폭의 보드는 서서 캐스팅할 충분한 안정성을 제공합니다. 먼저 잔잔한 물에서 연습하세요.
    - q: SUP에서 어떤 물고기를 노릴 수 있나요?
      a: SUP는 호수의 배스, 갯벌의 레드피시, 강의 송어, 만과 하구의 연안 어종에 적합합니다.
    - q: SUP에서 물고기를 어떻게 끌어 올리나요?
      a: 안정성을 위해 무릎을 꿇으세요. 그물이나 립 그리퍼를 쓰고, 물고기를 낮게 유지해 낙수를 피하세요. 방생하거나 쿨러에 보관하세요.

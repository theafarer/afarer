- slug: sup-yoga
  category: lifestyle
  title: SUP 요가 — 패들링과 요가의 완전 가이드
  description: 패들보딩과 요가를 결합하여 물 위에서 균형, 근력, 마음챙김을 높이세요.
  tldr: SUP 요가는 육지 요가와 비교해 코어 활성을 극적으로 높이는 불안정 요소를 더합니다. 잔잔한 물의 넓고 안정적인 보드에서 기본 자세로 시작하세요. 미끄럼 방지 데크 패드를 쓰세요. SUP 요가를 혼자 하지 마세요.
  problem: 전통적인 요가 매트는 완벽하게 안정된 면을 제공해서, SUP 요가를 코어 근력과 집중력에 유일하게 효과적으로 만드는 균형의 도전을 없애 버립니다.
  solution: 풀 데크 트랙션 패드를 갖춘 특대형(34인치 초과) SUP 보드를 사용하세요. 잔잔한 얕은 물에서 연습하고, 도립 자세에 도전하기 전에 기초 자세를 익히세요.
  audience: 균형 훈련과 마음챙김을 결합하고 싶은 요가 수련자와 패들러.
  steps:
    - 얕고 잔잔한 물에서 보드를 고정하세요 — 모래 닻을 쓰거나 부두에 묶으세요
    - 앉은 자세로 시작하세요 — 편안한 앉기, 보트 자세, 앉은 상태 비틀기
    - 무릎 자세로 발전하세요 — 테이블탑, 고양이-소 자세, 금강좌
    - 선 자세로 이동하세요 — 산 자세, 전사 자세 I, 전사 자세 II, 나무 자세
    - 균형 자세를 연습하세요 — 하프 문, 독수리 자세, 댄서 자세
    - 사바사나로 마무리하세요 — 보드 위에 바로 누워 물의 움직임을 느끼세요
  faq:
    - q: SUP 요가에 가장 좋은 보드는?
      a: 풀 렝스 트랙션 패드를 갖춘 넓은 보드(34인치 초과)가 가장 안정적인 플랫폼을 제공합니다. SUP Tour 12는 안정성과 글라이드의 균형이 좋습니다.
    - q: SUP 요가는 위험한가요?
      a: 안전하게 하면 육지 요가와 다르지 않습니다. 잔잔한 얕은 물을 쓰고, 리시를 착용하고, 파트너와 함께 연습하세요. 첫 세션은 깊은 물을 피하세요.
    - q: 특별한 장비가 필요한가요?
      a: 넓고 안정적인 보드, 풀 데크 트랙션 패드, 리시, PFD입니다. 일부 수련자는 추가 그립을 위해 방수 매트를 씁니다.

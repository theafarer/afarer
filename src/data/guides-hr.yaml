- slug: sup-for-whitewater
  category: buying-guide
  title: Vodič za SUP na divljim vodama — kupovinski vodič za napuhivu dasku za spuštanje rijekom
  description: 'Kako odabrati SUP za divlje vode za spuštanje rijekom: kraće daske, ojačana konstrukcija, sigurnosna oprema i tehnike veslanja za brzake kategorije I-III.'
  tldr: SUP-ovi za divlje vode trebaju kraću dužinu (8-10'), ojačane bočne rubove, viši PSI (15+) i više zračnih komora radi sigurnosti. Koristite ravno riječno uže (ne spiralno), nosite kacigu i PFD i uvijek vesljajte u društvu. Počnite s kategorijom I prije nego što se latite težih brzaka.
  problem: Vožnja standardnim univerzalnim SUP-om po tekućoj vodi opasna je — standardnim daskama nedostaju okretnost, otpornost na udarce i sigurnosne značajke potrebne za rijeke.
  solution: Odaberite namjenski izrađen SUP za divlje vode s kratkom dužinom radi okretnosti, ojačanom konstrukcijom za udarce o stijene i izvedbom s više komora radi sigurnosti.
  audience: Iskusni veslači koji prelaze na spuštanje rijekama.
  steps:
    - Odaberite dasku duljine 8-10' za maksimalnu okretnost u brzacima
    - Potražite ojačanu konstrukciju bočnih rubova i PVC vojne kvalitete
    - Odaberite dasku s 2+ zračne komore kao pričuvu u slučaju probušena
    - Koristite ravno riječno uže pričvršćeno za pojas s brzim otpuštanjem
    - Nosite kacigu, PFD i odgovarajuću obuću za rijeke
    - Počnite na brzacima kategorije I i napredujte postupno u društvu iskusnog partnera
  faq:
    - q: Mogu li za divlje vode koristiti običan SUP?
      a: Ne preporučuje se. Standardnim SUP-ovima nedostaje otpornost na udarce te se mogu delaminirati o stijene. Sigurnost više komora ključna je u riječnim uvjetima.
    - q: Koji PSI za SUP na divljim vodama?
      a: 15+ PSI za maksimalnu krutost. Tvrda daska odbija se od stijena bolje od nedovoljno napuhane, koja se obavija oko prepreka.
    - q: Trebaju li mi posebne vještine veslanja za SUP na divljim vodama?
      a: Da. Čitanje rijeke, izlasci u mrtvu vodu, prijelazi preko struje i tehnike oslanjanja ključne su vještine. Pohađajte tečaj SUP-a na divljim vodama prije pokušaja na kategoriji II+.

  title: 'SUP fitness: trening cijelog tijela na vodi'
  description: Kako vožnja SUP daskom jača mišiće trupa, ravnotežu i kardiovaskularnu kondiciju.
  tldr: SUP pri svakom zaveslaju angažira trup, noge, leđa i ramena. Satna vožnja troši 300-500 kalorija. Veslanje protiv vjetra ili struje udvostručuje intenzitet. SUP joga dodaje rad na fleksibilnosti i ravnoteži.
  problem: Mnogi ljudi doživljavaju veslanje na dasci kao povremenu rekreativnu aktivnost, a ne kao ozbiljan fitness alat, te propuštaju njegov potencijal za kondicioniranje cijelog tijela.
  solution: 'Strukturirajte SUP treninge s konkretnim fitness ciljevima: veslanje za izdržljivost radi kardio treninga, intervalni sprintovi za snagu, SUP joga za fleksibilnost i veslanje na daljinu za mišićnu izdržljivost.'
  audience: Fitness entuzijasti u potrazi za treningom cijelog tijela s malim opterećenjem zglobova i visokom razinom angažmana.
  steps:
    - Zagrijte se na kopnu — kruženje rukama, rotacije trupa i mahanje nogama 5 minuta
    - Počnite s 10 minuta jednoličnog veslanja umjerenog intenziteta
    - Prijeđite na intervalni trening — 2 minute intenzivnog veslanja, 2 minute laganog oporavka
    - Uključite poze SUP joge — pas prema dolje, ratnik II i poza drveta na dasci
    - Završite laganim veslanjem i statičkim istezanjem na dasci
  faq:
    - q: Je li SUP bolji od trčanja za kondiciju?
      a: SUP nudi usporedive kardiovaskularne koristi uz manje opterećenje zglobova. Također jače angažira gornji dio tijela i trup nego trčanje.
    - q: Koliko kalorija troši SUP?
      a: Približno 300-500 kalorija na sat pri umjerenom intenzitetu. Utrke ili veslanje protiv vjetra mogu potrošiti 600-800 kalorija na sat.
    - q: Mogu li izgraditi mišiće baveći se SUP-om?
      a: Da. Veslanje jača ramena, leđa i mišiće trupa. Održavanje ravnoteže angažira noge i stabilizatorske mišiće. Riječ je o treningu s otporom za cijelo tijelo.

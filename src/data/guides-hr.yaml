- slug: weather-conditions
  category: safety
  title: Razumijevanje vremenskih uvjeta za veslanje na dasci
  description: Naučite čitati vjetar, valove, plimu i oseku te vremenske obrasce kako biste na vodi donosili sigurne odluke.
  tldr: 'Prije svakog isplovljavanja provjerite tri stvari: brzinu vjetra (ispod 10 mph za početnike), visinu valova (ispod 1 ft za početnike) i temperaturu vode (odjenite se za vodu, a ne za zrak). Vjetar koji puše s obale prema pučini opasan je na svakoj razini vještine.'
  problem: Većina nesreća povezanih s vremenom događa se zato što veslači pogrešno procjenjuju uvjete — provjeravaju temperaturu zraka umjesto temperature vode ili ne razumiju da ih vjetar s obale može otpuhati na pučinu.
  solution: 'Koristite strukturiranu procjenu vremena prije isplovljavanja: smjer i brzinu vjetra, period i visinu valova, stanje plime i oseke te temperaturu vode. Razumijete kako svaki od tih čimbenika utječe na vašu sigurnost.'
  audience: Svi veslači koji izlaze na otvorenu vodu — jezera, zaljevi, rijeke i ocean.
  steps:
    - Provjerite brzinu i smjer vjetra — vjetar koji puše s kopna prema pučini najopasniji je
    - Procijenite stanje valova — period valova podjednako je važan kao i visina valova
    - Poznajte plimu i oseku — plimne struje mogu biti jače od vaše brzine veslanja
    - Izmjerite temperaturu vode — ispod 60°F/15°C potrebna je toplinska zaštita
    - Provjerite vidljivost — magla i jaka kiša smanjuju vidljivost i povećavaju rizik od sudara
    - Razumijte lokalne opasnosti — potopljene stijene, jake struje, zone plovila
  faq:
    - q: Koja brzina vjetra prevelika je za SUP?
      a: 'Za početnike: iznad 10 mph (8 knots). Za srednju razinu: iznad 15 mph (13 knots). Za napredne: iznad 20 mph (17 knots). Ako niste sigurni, ne izlazite na vodu.'
    - q: Što znači period valova?
      a: Period valova vrijeme je između uzastopnih valova. Kratki periodi (ispod 8 sekundi) znače strme i nemirne valove. Dugi periodi (iznad 12 sekundi) znače glatkija i predvidljivija valovanja.
    - q: Mogu li veslati po kiši?
      a: Lagana kiša obično je sigurna. Jaka kiša smanjuje vidljivost i može ukazivati na promjenu vjetrovnih uvjeta. Grmljavinske oluje zahtijevaju trenutno napuštanje vode.

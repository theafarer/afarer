  title: Materijali SUP daske — PVC, EPS, epoksid i drop-stitch objašnjeni
  description: 'Tehnički vodič kroz materijale izrade SUP-a: napuhivi drop-stitch PVC naspram tvrdih daski s jezgrom od EPS pjene. Razumijte što čini da svaka vrsta ima različite performanse.'
  tldr: Napuhivi SUP-ovi koriste drop-stitch PVC s tisućama unutarnjih niti za krutost. Tvrde daske koriste jezgru od EPS pjene s epoksidnom ili stakloplastičnom ljuskom. Napuhivi pobjeđuju u prenosivosti i izdržljivosti. Tvrde daske pobjeđuju u brzini i osjećaju. Moderna drop-stitch tehnologija pri 15 PSI konkurira krutosti tvrdih daski.
  problem: Kupci ne razumiju temeljne razlike u izradi između napuhivih i tvrdih daski, što dovodi do pogrešnih odluka o kupnji.
  solution: 'Uskladite materijal daske s primarnom namjenom: napuhivi drop-stitch za putovanja, čuvanje i izdržljivost. EPS/epoksid za utrke, surfanje i maksimalne performanse.'
  audience: Kupci SUP-a koji uspoređuju izradu napuhivih i tvrdih daski.
  steps:
    - 'Napuhivi drop-stitch: tisuće poliesterskih niti povezuje gornji i donji sloj, stvarajući krutu strukturu pri tlaku od 12-15 PSI'
    - 'Tvrda EPS pjena: jezgra od ekspandiranog polistirena oblikovana prema dizajnu trupa, zapečaćena epoksidnom smolom i slojevima stakloplastike'
    - 'Prednosti napuhivih: može se pakirati, gotovo neuništiv, lagan za nošenje, meki bokovi za sigurnost'
    - 'Prednosti tvrdih daski: manja ukupna težina, krutija platforma, bolja učinkovitost klizanja, veća osjetljivost'
    - 'Hibridne opcije: neki proizvođači kombiniraju drop-stitch s krutim panelima kako bi spojili najbolje iz oba svijeta'
  faq:
    - q: Jesu li napuhivi SUP-ovi jednako kruti kao tvrde daske?
      a: Pri 15 PSI s kvalitetnom drop-stitch konstrukcijom, moderni napuhivi SUP-ovi vrlo su blizu. Većina rekreativnih veslača ne može razlikovati. Trkaći veslači uočit će prednost tvrde daske.
    - q: Koji materijal traje dulje?
      a: Napuhivi SUP-ovi uz pravilnu njegu traju 5-10 godina. Tvrde daske traju 10-20 godina, ali su podložne pukotinama, udubinama i upijanju vode. Napuhivi su u svakodnevnoj uporabi otporniji na oštećenja.
    - q: Je li PVC ekološki prihvatljiv?
      a: Proizvodnja PVC-a ima utjecaj na okoliš, ali napuhivi SUP-ovi traju dulje (čime se smanjuje učestalost zamjene) i pakiraju se u manji prostor (čime se smanjuju emisije pri transportu). Stare daske uvijek pravilno reciklirajte.

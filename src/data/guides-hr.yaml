- slug: sup-yoga
  category: lifestyle
  title: 'SUP joga: potpuni vodič za veslanje i jogu'
  description: Kombinirajte veslanje daskom s jogom za bolju ravnotežu, snagu i svjesnost na vodi.
  tldr: SUP joga dodaje element nestabilnosti koji u usporedbi s jogom na kopnu dramatično povećava aktivaciju mišića trupa. Počnite s osnovnim pozama na širokoj, stabilnoj dasci u mirnoj vodi. Koristite protukliznu podlogu. Nikad ne vježbajte SUP jogu sami.
  problem: Tradicionalne prostirke za jogu pružaju potpuno stabilnu površinu, čime uklanjaju izazov ravnoteže koji SUP jogu čini jedinstveno učinkovitom za snagu trupa i koncentraciju.
  solution: Koristite izuzetno široku SUP dasku (34"+) s protukliznom podlogom preko cijele površine. Vježbajte u mirnoj, plitkoj vodi. Počnite s osnovnim pozama prije pokušaja inverzija.
  audience: Praktičari joge i veslači koji žele kombinirati trening ravnoteže s vježbama svjesnosti.
  steps:
    - Usidrite dasku u plitkoj, mirnoj vodi — koristite pješčano sidro ili je vežite uz ponton
    - Počnite s pozama u sjedećem položaju — lagan sjed, poza čamca, uvrnuće u sjedećem položaju
    - Prijeđite na poze u klečećem položaju — stol, mačka-krava, poza groma
    - Prijeđite na stojeće poze — planina, ratnik I, ratnik II, poza drveta
    - Vježbajte poze ravnoteže — pola mjeseca, orao, plesač
    - Završite sa šavasandom — lezite ravno na dasku i osjetite gibanje vode
  faq:
    - q: Koja je daska najbolja za SUP jogu?
      a: Široka daska (34"+) s protukliznom podlogom preko cijele duljine pruža najstabilniju platformu. SUP Tour 12 nudi dobar omjer stabilnosti i klizanja po vodi.
    - q: Je li SUP joga opasna?
      a: Nije opasnija od joge na kopnu ako se prakticira na siguran način. Koristite mirnu, plitku vodu. Nosite sigurnosno uže. Vježbajte s partnerom. Izbjegavajte duboku vodu tijekom prvih treninga.
    - q: Trebam li posebnu opremu?
      a: Široka stabilna daska, protuklizna podloga preko cijele površine, sigurnosno uže i PFD. Neki praktičari koriste vodonepropusnu prostirku za dodatno prianjanje.

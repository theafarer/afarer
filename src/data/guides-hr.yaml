- slug: inflatable-repair
  category: maintenance
  title: Kako popraviti svoj napuhivi SUP
  description: Postupni vodič za popravak probušenja, problema s ventilom i oštećenja šavova na napuhivim SUP dascama.
  tldr: Mala probušenja (manja od 1/4") mogu se popraviti priloženim kompletom zakrpa. Očistite područje, nanesite PVC ljepilo, pritisnite zakrpu i pričekajte 24 sata. Curenja ventila obično zahtijevaju zamjenu O-prstena. Velike suze ili odvajanje šavova zahtijevaju profesionalni servis.
  problem: Mala probušenja i problemi s ventilom česti su, ali ih je lako popraviti. Bez pravilne tehnike popravka korisnici ili plaćaju previše za profesionalni servis ili pogoršavaju oštećenje.
  solution: Utvrdite vrstu oštećenja — probušenje, curenje ventila ili problem sa šavom — i primijenite odgovarajuću metodu popravka. Većina popravaka traje 30 minuta plus vrijeme sušenja.
  audience: Vlasnici napuhivih SUP dasaka koji žele osnovne popravke obaviti sami.
  steps:
    - Pronađite mjesto curenja — potpuno napuhajte dasku, osluškujte zrak, opipajte rukom ili koristite sapunicu
    - Označite mjesto curenja olovkom ili trakom
    - Očistite područje oko curenja izopropilnim alkoholom — najmanje 2 inča oko oštećenja
    - Izhrapavite površinu finim brusnim papirom radi boljeg prianjanja ljepila
    - Nanesite PVC ljepilo i na zakrpu i na površinu daske
    - Pričekajte 5 minuta da ljepilo postane ljepljivo
    - Čvrsto pritisnite zakrpu i istisnite mjehuriće zraka valjkom ili karticom
    - Ostavite da se suši 24 sata prije napuhivanja na puni tlak
  faq:
    - q: Mogu li popraviti probušenje na vodi?
      a: Hitni popravak zakrpom i trakom može vam omogućiti povratak na obalu. Potpuni popravak zahtijeva suhe uvjete i 24-satno sušenje.
    - q: Kako popraviti ventil koji curi?
      a: Uklonite jezgru ventila priloženim alatom, provjerite ima li O-prsten oštećenja, po potrebi ga zamijenite i čvrsto vratite jezgru na mjesto.
    - q: Koje ljepilo trebam koristiti za popravke PVC-a?
      a: Koristite ljepilo posebno namijenjeno PVC-u, poput HH-66 ili Clifton. Obično trenutno ljepilo ne prianja dobro na napuhive PVC materijale.

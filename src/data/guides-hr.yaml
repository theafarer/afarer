- slug: paddling-techniques
  category: tutorial
  title: Osnovne tehnike veslanja na SUP-u
  description: Savladajte zamah naprijed, pometni zamah i okret preko pramca kako biste učinkovito veslali u svim uvjetima.
  tldr: Zamah naprijed pokreću mišići trupa, a ne ruke. Pometni zamah okreće dasku. Okret preko pramca najučinkovitiji je način okretanja. Držite veslo okomito i potpuno uronite lopaticu za maksimalan prijenos snage.
  problem: Većina veslača koristi zamaske u kojima dominiraju ruke, što rasipa energiju i uzrokuje umor ramena. Loša tehnika također otežava upravljanje daskom na vjetru i uskovitlanoj vodi.
  solution: Naučite tri ključna zamaha — naprijed, pometni i okret preko pramca — uz pravilnu mehaniku tijela. Svaki od njih vježbajte na mirnoj vodi prije prelaska na zahtjevnije uvjete.
  audience: Veslači koji žele veslati dulje, brže i s manje umora.
  steps:
    - 'Zamah naprijed: ispružite se naprijed, potpuno zabodite lopaticu u vodu, povlačite rotacijom trupa (ne rukama) i izvadite veslo u razini gležnja'
    - 'Pometni zamah: ispružite se naprijed uz rub daske, pometite lopaticu širokim lukom prema krmi i okrenite dasku na suprotnu stranu od vesla'
    - 'Okret preko pramca: postavite veslo na suprotnu stranu daske bez mijenjanja položaja ruku i povlačite prema krmi'
    - 'Oslon: za stabilnost na valovima koristite niski oslon — pljosnato udarite lopaticom po površini vode'
    - 'Privlačni zamah: ispružite se u stranu i povucite dasku bočno prema veslu'
  faq:
    - q: Kako veslati pravocrtno?
      a: Koristite dosljednu duljinu zamaha na objema stranama. Mijenjajte stranu svakih 5-10 zamaha. Kao orijentir gledajte u nepomičnu točku na horizontu.
    - q: Trebam li savijati koljena?
      a: Da. Zadržite blago savinuta koljena koja služe kao apsorberi udaraca. Ispravljena koljena prenose svaki valić na vaš trup i smanjuju stabilnost.
    - q: Kako veslati protiv vjetra?
      a: Snižite stav, koristite kraće i brže zamaske i ostanite bliže obali, gdje je vjetar često slabiji. Ako je vjetar prejak, ne izlazite na vodu.

- slug: multi-day-trip
  category: planning
  title: Planiranje višednevnog SUP putovanja
  description: Kako planirati i provesti višednevno veslačko putovanje — planiranje rute, pakiranje opreme, kampiranje i sigurnost.
  tldr: Planirajte 10-15 milja dnevno. Spakirajte opremu u vodonepropusne vreće, ravnomjerno raspodijelite težinu i vježbajte opterećivanje daske prije putovanja. Ostavite plan plovidbe. Nosite vodu, hranu, sklonište, navigaciju i sredstva komunikacije.
  problem: Višednevna putovanja propadaju zbog pretjeranog pakiranja, lošeg planiranja rute ili podcjenjivanja vremenskih uvjeta i struje — što dovodi do iscrpljenosti, kvara opreme ili sigurnosnih incidenata.
  solution: 'Koristite sustavan pristup planiranju: odabir rute, kontrolni popis opreme, planiranje hrane, sigurnosne upute i plan za nepredviđene situacije.'
  audience: Iskusni veslači koji planiraju svoju prvu višednevnu ekspediciju.
  steps:
    - Odaberite rutu s uređenim kampovima i točkama za izlazak u slučaju potrebe
    - Planirajte 10-15 milja dnevno uzimajući u obzir vjetar i struju
    - Provjerite tablice plime i oseke te vremenske prognoze za cijelo razdoblje putovanja
    - Spakirajte opremu u vodonepropusne vreće — ukupna težina opreme 20-30 lbs
    - Ravnomjerno raspodijelite težinu — najteže predmete u sredinu
    - Ostavite detaljan plan plovidbe osobi na obali
    - Ponesite navigaciju — papirnatu pomorsku kartu, kompas i GPS kao pričuvu
    - Spakirajte hitno sklonište, dodatnu hranu i komplet prve pomoći
  faq:
    - q: Koja je idealna dnevna udaljenost?
      a: 10-15 milja dnevno za iskusne veslače. Početnici bi trebali planirati 5-8 milja. Uvijek uključite dodatno vremensko razdoblje zbog vremenskih uvjeta.
    - q: Koliko vode trebam nositi?
      a: 1 galon po osobi dnevno. U vrućim uvjetima 1.5 galona. Nosite filter za vodu ili tablete za pročišćavanje radi dopune zaliha.
    - q: Koja je najvažnija sigurnosna oprema?
      a: Komunikacija. VHF radio ili satelitski glasnik mogu vam spasiti život u hitnoj situaciji. Mobilni telefoni nepouzdani su u udaljenim područjima.

- slug: sup-storage-winter-care
  category: maintenance
  title: Čuvanje SUP-a i zimska njega — produžite životni vijek svoje daske
  description: Kako pravilno čuvati, čistiti i pripremiti za zimu svoju napuhivu SUP dasku. Uz pravilnu njegu izbjegnite plijesan, oštećenja od UV zraka i degradaciju materijala.
  tldr: Čistite slatkom vodom nakon svake uporabe. Potpuno osušite prije čuvanja. Ispustite zrak i čuvajte na hladnom, tamnom mjestu dalje od izravnog sunčevog svjetla i ekstremnih temperatura. Nikada ne čuvajte napuhano niti u vrućem autu. Povremeno nanesite sredstvo za zaštitu od UV zraka.
  problem: Nepravilno čuvanje vodeći je uzrok preuranjenog kvara SUP-a — plijesan, raspad materijala, delaminacija i oštećenje ventila zbog vrućine ili hladnoće.
  solution: 'Pratite rutinu njege u 3 koraka: isperite nakon svakog izlaska na vodu, temeljito osušite prije čuvanja i čuvajte ispuštenu dasku u prostoru s kontroliranom temperaturom između 50-80°F (10-27°C).'
  audience: Svi vlasnici SUP-a koji žele da im daska potraje 5+ godina.
  steps:
    - Isperite dasku, veslo i pumpu slatkom vodom nakon svakog izlaska u slanu ili muljevitu vodu
    - Čistite blagim sapunom i mekom spužvom — nikad agresivnim kemikalijama ni aparatima pod visokim tlakom
    - Potpuno osušite dasku na otvorenom prije ispuštanja zraka (otvorite ventil kako bi unutrašnja vlaga izašla)
    - Potpuno ispuštanje zraka, a zatim zarolajte od pramca prema krmi kako biste istjerali preostali zrak
    - Obrišite ruksak da bude suh prije nego što spremite dasku unutra
    - Čuvajte u hladnom, tamnom ormaru ili prostoru ispod kreveta — nikad na izravnom suncu, u vrućem autu ni u smrznutoj šupi
  faq:
    - q: Mogu li ostaviti SUP napuhan cijelu sezonu?
      a: Bolje ga je ispuhati kada ga dulje vrijeme ne koristite. Stalni pritisak PSI ubrzava zamor materijala. Ispuhajte ga između izlazaka ako ga čuvate dulje od 2 tjedna.
    - q: Kako ukloniti plijesan sa svog SUP-a?
      a: Pomiješajte blagi sapun s toplom vodom i dodajte malo bijelog octa. Nježno istrljajte mekom četkom. Temeljito isperite i osušite u sjeni. Izbjegavajte izbjeljivač jer oštećuje PVC.
    - q: Mogu li čuvati SUP u garaži?
      a: Samo ako se temperatura u garaži cijele godine održava između 50-80°F. Tavani i garaže bez grijanja i hlađenja podliježu temperaturnim ekstremima koji oštećuju drop-stitch jezgre.

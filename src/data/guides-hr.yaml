- slug: choosing-paddle
  category: buying-guide
  title: Kako odabrati pravo SUP veslo
  description: Vodič kroz materijale vesla, oblike lopatice, vrste osovine i određivanje veličine za SUP.
  tldr: 'Duljina vesla: SUP vesla trebaju biti 6-8" viša od vaše visine. Oblik lopatice: dihedral lopatice prate pravocrtno, ravne lopatice pružaju snažniji zahvat. Materijal osovine: karbon je najlakši, stakloplastika nudi najbolji omjer cijene i kvalitete, aluminij je najjeftiniji.'
  problem: Korištenje vesla pogrešne veličine ili materijala uzrokuje nepotrebni umor, lošu učinkovitost zaveslaja i opterećenje zglobova.
  solution: Uskladite duljinu vesla, oblik lopatice, materijal osovine i fleksibilnost sa svojim stilom veslanja, tjelesnom građom i budžetom.
  audience: SUP veslači koji odabiru svoje prvo ili sljedeće veslo.
  steps:
    - Izmjerite visinu vesla — 6-8" više od vaše visine za opće veslanje
    - Odaberite materijal lopatice — najlon za manji budžet, stakloplastika za dobar omjer, karbon za vrhunske performanse
    - Odaberite oblik lopatice — dihedral za glatko praćenje pravca, ravna za snagu, žlica za utrke
    - Odaberite vrstu osovine — ravna za opću upotrebu, savijena za SUP utrke
    - Provjerite fleksibilnost — krute osovine prenose više snage, fleksibilne smanjuju opterećenje zglobova
  faq:
    - q: Koji je najbolji materijal za veslo?
      a: Stakloplastika nudi najbolji omjer težine, trajnosti i cijene. Karbon je lakši, ali skuplji i lomljiviji. Najlon je težak, ali gotovo neuništiv.
    - q: Kako znam je li moje veslo prave duljine?
      a: Stanite pokraj vesla postavljenog okomito — drška bi trebala dosezati vaš zglob zapešća kada podignete ruku iznad glave.
    - q: Trebam li uzeti jednodijelno ili podesivo veslo?
      a: Podesiva vesla dobra su za zajedničku upotrebu i putovanja. Jednodijelna vesla lakša su, krutija i učinkovitija za namjensku upotrebu.

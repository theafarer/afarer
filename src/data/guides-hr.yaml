- slug: sup-with-kids
  category: lifestyle
  title: 'SUP s djecom: potpuni obiteljski vodič'
  description: Kako sigurno povesti djecu na veslanje daskom — preporuke po dobi, oprema i aktivnosti.
  tldr: Djeca od 6+ godina mogu se voziti na SUP dasci s odraslom osobom. Djeca od 10+ godina mogu veslati na vlastitoj dasci pod nadzorom. Koristite široku stabilnu dasku, uvijek nosite PFD, ostanite u plitkoj mirnoj vodi i držite treninge kratkima (maksimalno 30-45 minuta).
  problem: Roditelji žele podijeliti vodene sportove sa svojom djecom, ali brinu o sigurnosti, pristajanju opreme i tome kako zadržati pažnju djece.
  solution: Koristite dasku odgovarajuće veličine za vožnju u paru, osigurajte da svako dijete nosi dobro pristajući PFD, počnite u plitkoj toploj vodi i unesite zabavu kroz igre i kratke treninge.
  audience: Roditelji koji žele svoju djecu uvesti u veslanje na dasci.
  steps:
    - 'Dob 4-6: vožnja kao putnik na dasci odrasle osobe — sjednite sprijeda, držite se središnje ručke'
    - 'Dob 6-10: kleče ili sjede na vlastitoj dasci pod nadzorom odrasle osobe i sa sigurnosnim užetom'
    - 'Dob 10+: veslaju na vlastitoj dasci uz nadzor odrasle osobe u blizini'
    - Uvijek nosite PFD — djeca moraju cijelo vrijeme nositi dobro pristajući spasilački prsluk
    - Ostanite u plitkoj vodi (do struka odrasle osobe)
    - Držite treninge kratkima — maksimalno 30-45 minuta za djecu mlađu od 10 godina
    - Učinite to zabavnim — igrajte igre, tražite ribe, vježbajte ustajanje i stajanje
  faq:
    - q: U kojoj dobi dijete može samostalno veslati na SUP dasci?
      a: Oko 10-12 godina uz nadzor, ovisno o djetetovoj sposobnosti plivanja i udobnosti u vodi. Uvijek u mirnim, plitkim uvjetima.
    - q: Koja je daska najbolja za SUP s djecom?
      a: Široka daska (34"+) s velikim kapacitetom nosivosti za vožnju u paru. Širina SUP Explorer 11 od 33" i nosivost od 220 lb dobro funkcioniraju za roditelja s djetetom.
    - q: Kakvu sigurnosnu opremu treba djeca?
      a: Dobro pristajući spasilački prsluk s CE certifikatom, sigurnosno uže (za vožnju u paru pričvršćeno na dasku odrasle osobe), sredstvo za zaštitu od sunca i kapa.

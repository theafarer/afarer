- slug: understanding-specs
  category: technical
  title: Kako čitati specifikacije SUP daske
  description: Tehnički vodič za razumijevanje specifikacija SUP daske — volumen, dimenzije, konstrukcija i njihovo značenje za performanse.
  tldr: 'Ključne specifikacije: volumen (u litrama) određuje plovnost i nosivost, širina određuje stabilnost, duljina određuje držanje smjera i brzinu, debljina određuje krutost, a nominalna PSI vrijednost određuje tlak napuhivanja za optimalne performanse.'
  problem: Tehnički listovi proizvoda navode brojke bez konteksta, pa kupci nisu sigurni koje su specifikacije zapravo bitne za njihovu namjenu.
  solution: 'Prevedite svaku specifikaciju u stvarne performanse: volumen za plovnost, širina za stabilnost, duljina za klizanje, debljina za krutost, a konstrukcija za trajnost.'
  audience: Veslači srednje razine i tehnički orijentirani kupci koji žele donositi odluke na temelju podataka.
  steps:
    - Provjerite volumen (u litrama) — vaša težina plus oprema ne smije prelaziti 80% nominalnog volumena daske
    - Provjerite širinu — šira (32-34") = više stabilnosti, uža (28-30") = više brzine
    - Provjerite duljinu — dulja (12-14") = bolje držanje smjera, kraća (10-11") = bolja okretnost
    - Provjerite debljinu — 6" je standardna, 8" nudi više krutosti i nosivosti
    - Provjerite nominalni PSI — napuhajte dasku do maksimalnog nominalnog PSI-a za optimalnu krutost
    - Provjerite materijale konstrukcije — gustoću drop-stitcha, slojeve PVC-a i ojačanje rubova
  faq:
    - q: Što znači drop-stitch?
      a: Drop-stitch je metoda konstrukcije u kojoj tisuće niti povezuju gornji i donji sloj daske. To omogućuje napuhivanje pri visokom tlaku (12-15 PSI) radi iznimne krutosti.
    - q: Koji je idealan omjer težine i volumena?
      a: Dobra smjernica jest otprilike 5-6 funti težine veslača po litri volumena daske. Veslač težine 220 lb trebao bi tražiti daske s volumenom od 180+ litara.
    - q: Je li važna težina daske?
      a: Da. Lakše daske (ispod 20 lbs) lakše se nose i prevoze. Teže daske (25+ lbs) često ukazuju na trajniju višeslojnu PVC konstrukciju.

- slug: beginner-guide
  category: tutorial
  title: Vodič za početnike u veslanju na dasci
  description: Sve što trebate znati prije prve sesije veslanja na dasci — od postavljanja opreme do osnovnih tehnika veslanja.
  tldr: Počnite na mirnoj, ravnoj vodi sa širokom i stabilnom daskom. Napuhajte do 12-15 PSI, pričvrstite sigurnosno uže i koristite ispravnu duljinu vesla (za 6-8" viša od vaše visine). Držite stopala u širini ramena, koljena blago savinuta i gledajte u horizont.
  problem: Novi veslači često preskaču osnovnu pripremu — pogrešna duljina vesla, loš stav ili odabir nemirne vode — što dovodi do padova, frustracije i obeshrabrenja.
  solution: 'Slijedite strukturirani plan prve sesije: odaberite mirnu vodu, ispravno postavite opremu, vježbajte u klečećem položaju prije ustajanja i savladajte zamah naprijed prije pokušaja okretanja.'
  audience: Potpuni početnici koji nikada prije nisu veslali na dasci.
  steps:
    - Odaberite ravnu, mirnu vodu bez plovila — malo jezero ili zaklonjeni zaljev idealni su
    - Napuhajte dasku na 12-15 PSI pomoću pumpe s dvostrukim djelovanjem
    - Pričvrstite spiralno sigurnosno uže za gležanj ili potkoljenicu, nikada za ručku na dasci
    - Umetnite peraju i pritegnite vijak
    - Podesite duljinu vesla — trebala bi biti 6-8 inča viša od vaše visine
    - Započnite klečeći na dasci, zaveslajte nekoliko puta kako biste osjetili ravnotežu
    - Ustanite podižući jednu po jednu nogu, stopala u širini ramena, koljena mekana
    - Gledajte u horizont, a ne u stopala — daska ide tamo gdje gledate
  faq:
    - q: Što trebam obući za veslanje na dasci?
      a: Sportsku odjeću koja se brzo suši, spasilački prsluk, sredstvo za zaštitu od sunca i kapu. U hladnoj vodi nosite neoprensko odijelo. Uvijek nosite sigurnosno uže i nosite telefon u vodonepropusnoj futroli.
    - q: Kako se vratiti na dasku ako padnem?
      a: Ostanite mirni. Dođite do daske, uhvatite središnju ručku i udarajte nogama po vodi dok se jednim pokretom izvlačite na dasku. Prvo se vratite u klečeći položaj, a zatim ustanite.
    - q: Koji su vjetrovni uvjeti sigurni?
      a: 'Za početnike: vjetar slabiji od 10 mph (5 knots). Ako vjetar puše od obale prema pučini, ne izlazite na vodu. Provjerite prognozu i imajte na umu da je vjetar koji puše s obale na pučinu opasan.'

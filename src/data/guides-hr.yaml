- slug: sup-weight-capacity
  category: buying-guide
  title: Vodič o nosivosti SUP-a — koliko težine SUP može nositi?
  description: Razumijevanje ograničenja nosivosti SUP-a, način izračuna ukupnog tereta i razlozi zbog kojih prekoračenje ograničenja utječe na performanse i sigurnost.
  tldr: Nikada ne prekoračujte 80% maksimalne nosivosti daske svojom tjelesnom težinom plus opremom. Daska nosivosti 220 lb prikladna je za veslača od 160 lb s lakom opremom. Prekoračenje ograničenja uzrokuje poskakivanje daske, tromo upravljanje i povećan rizik oštećenja.
  problem: Veslači često prekoračuju nosivost svoje daske, što dovodi do loših performansi, potapanja i mogućeg oštećenja daske. Proizvođači navode maksimalna ograničenja, ali ne objašnjavaju sigurne radne terete.
  solution: Izračunajte svoj ukupni teret (tjelesna težina + oprema + voda koju je daska upila) i ostanite ispod 80% navedene maksimalne nosivosti. Težim veslačima potrebne su daske većeg obujma s nosivošću od 300+ lb.
  audience: Veslači svih veličina, posebno krupniji veslači i oni koji nose ekspedicijsku opremu.
  steps:
    - Pronađite maksimalnu nosivost otisnutu na dasci (obično u blizini ventila)
    - Izvagajte sebe i svu opremu uključujući veslo, PFD, suhe vreće, hladnjak i dodatke
    - 'Izračunajte: (vaš ukupni teret) ÷ (maksimalna nosivost) × 100 = % iskorištene nosivosti'
    - Ciljajte 70-80% za optimalne performanse i sigurnost
    - Ako prekoračujete 80%, odaberite veću dasku ili smanjite opremu
  faq:
    - q: Što se događa ako prekoračim ograničenje težine?
      a: Daska plovi niže, stvarajući veći otpor. Stabilnost se smanjuje, pramac se može potapati, a drop-stitch jezgra je izložena većem riziku oštećenja na valovitom moru.
    - q: Mogu li dvije osobe voziti na jednom SUP-u?
      a: Samo ako ukupna težina ostaje ispod 80% nosivosti. Većina standardnih SUP-ova dizajnirana je za jednu osobu. Vožnja u tandemu zahtijeva dasku koja je izričito namijenjena za dvije osobe.
    - q: Imaju li napuhivi SUP-ovi manju nosivost od tvrdih daski?
      a: Kvalitetni napuhivi SUP-ovi s drop-stitch konstrukcijom imaju usporedivu ili veću nosivost od tvrdih daski zahvaljujući debljoj raspodjeli obujma.

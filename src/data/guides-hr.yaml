- slug: sup-inflation-psi-guide
  category: technical
  title: Vodič o napuhivanju SUP-a — optimalni PSI za performanse i sigurnost
  description: 'Potpuni vodič o tlaku napuhivanja SUP-a: preporučeni rasponi PSI-a, kako tlak utječe na performanse i savjeti za pravilnu uporabu pumpe.'
  tldr: Napuhajte na 12-15 PSI za većinu napuhivih SUP-ova. Veći tlak = veća krutost, ali sporije napuhivanje. Niži tlak = mekši osjećaj, ali više savijanja. Nikada ne prekoračujte maksimalni PSI otisnut na dasci. Koristite pumpu s točnim manometrom. Hladan zrak smanjuje tlak, vruće sunce ga povećava.
  problem: Nedovoljno napuhane daske osjećaju se tromo i previše se savijaju. Prekomjerno napuhane daske riskiraju pucanje šavova. Mnogi veslači pogađaju PSI umjesto da ga točno mjere.
  solution: Koristite pumpu s ugrađenim manometrom. Ciljajte 15 PSI za maksimalnu krutost. Provjerite tlak prije svakog izlaska na vodu — promjene temperature znatno utječu na PSI.
  audience: Svi vlasnici napuhivih SUP-ova.
  steps:
    - Provjerite preporučeni raspon PSI-a otisnut na dasci u blizini ventila
    - Koristite pumpu s dvostrukim djelovanjem za napuhivanje do sredine preporučenog raspona
    - Prebacite na način rada s jednostrukim djelovanjem za zadnjih 3-4 PSI za precizniju kontrolu
    - Provjerite tlak manometrom — analogni manometri pouzdaniji su od digitalnih
    - 'Prilagodite uvjetima: viši PSI za turističko veslanje i utrke, niži PSI za divlju vodu i stjenovita mjesta za ulazak u vodu'
    - Ponovno provjerite tlak nakon što daska odstoji 10 minuta — temperaturna ravnoteža mijenja PSI
  faq:
    - q: Mogu li pretjerano napuhati svoj SUP?
      a: Da. Prekoračenje deklariranog maksimalnog PSI-a (obično 15-18 PSI) može uzrokovati delaminaciju šavova i oštetiti drop-stitch jezgru. Uvijek ostajte unutar otisnutog raspona.
    - q: Utječe li temperatura na PSI?
      a: Znatno. Daska napuhana na 15 PSI pri 70°F može doseći 18 PSI na izravnom suncu pri 95°F. Hladna voda može smanjiti tlak na 12 PSI. Provjerite tlak nakon promjena u okolišu.
    - q: Koji PSI za početnike?
      a: 12-13 PSI za učenje pruža nešto mekšu platformu koja je blaža pri padovima. Povećajte na 15 PSI kako se vještina poboljšava.

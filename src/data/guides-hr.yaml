- slug: sup-maintenance
  category: maintenance
  title: Kako očistiti i pohraniti svoj napuhljivi SUP
  description: Postupni vodič za održavanje kojim se maksimizira vijek trajanja vaše napuhljive SUP daske.
  tldr: Ispirajte slatkom vodom nakon svake upotrebe, potpuno osušite prije skladištenja, ispustite zrak i smotajte dasku lagano (ne vojnički čvrsto), čuvajte je na hladnom i suhom mjestu dalje od izravnog sunčeva svjetla i mjesečno pregledavajte šavove.
  problem: Neodgovarajuće skladištenje i čišćenje vodeći su uzroci preranog kvara napuhljivih SUP-ova — plijesan, oštećenja od UV zraka i odvajanje šavova.
  solution: 'Slijedite dosljednu rutinu nakon svake sesije: isperite, osušite, pregledajte, ispustite zrak i pohranite. Za tvrdokornu nečistoću koristite blagi sapun. Nikada ne čuvajte dasku mokru niti na izravnom suncu.'
  audience: Svi vlasnici napuhljivih SUP-ova koji žele da im daska potraje 5+ godina.
  steps:
    - Ispirajte dasku slatkom vodom odmah nakon upotrebe, posebno nakon veslanja u slanoj vodi
    - Očistite je blagim sapunom i mekom spužvom — izbjegavajte jake kemikalije i perilice pod visokim tlakom
    - Dasku potpuno osušite — otvorite ventil kako bi izašla zarobljena voda
    - Pregledajte ima li oštećenja — provjerite šavove, ventil i površinu na probadanja
    - Potpuno ispustite zrak — uklonite jezgru ventila za potpuno ispuhivanje
    - Smotajte dasku lagano — počnite od nosa i izbjegavajte oštre nabore
    - Čuvajte je u torbi za nošenje na hladnom i suhom mjestu dalje od izravnog sunčeva svjetla
  faq:
    - q: Mogu li ostaviti svoj SUP napuhan cijele sezone?
      a: Da, ali ga čuvajte izvan izravnog sunčeva svjetla kad ga ne koristite. Za dulje skladištenje preporučuje se djelomično ispuhivanje (8-10 PSI).
    - q: Kako popravim probušenje?
      a: Očistite područje, izrežite zakrpu sa zaobljenim kutovima, nanesite ljepilo, čvrsto pritisnite i pričekajte 24 sata prije napuhivanja. afarer daske uključuju komplet za popravak.
    - q: Koliko često trebam provjeravati ventil?
      a: Mjesečno. Ventil je najčešća točka kvara. Provjerite prelazi li iglica ventila slobodno i je li O-prsten netaknut.

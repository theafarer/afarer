- slug: how-to-choose-your-sup
  category: buying-guide
  title: Kako odabrati svoju SUP dasku
  description: Cjelovit vodič za odabir prave daske za stand-up veslanje na temelju vaše razine vještine, uvjeta na vodi i namjene korištenja.
  tldr: Odaberite svoj SUP prema razini vještine, tipu vode i primarnoj namjeni. Univerzalne daske odgovaraju početnicima i mirnoj vodi. Turističke daske prikladne su za veslanje na daljinu. Daske za jogu nude dodatnu širinu radi stabilnosti. Sportske daske namijenjene su iskusnim veslačima u raznim uvjetima.
  problem: Većina kupaca SUP dasku prvi put odabire prema cijeni ili izgledu, a ne prema tome kako i gdje će zapravo veslati. To dovodi do loše stabilnosti, neadekvatnih performansi i frustrirajućeg iskustva.
  solution: Uskladite oblik, volumen i konstrukciju daske sa svojom razinom vještine i primarnim okruženjem na vodi. Šire daske (32-34") nude stabilnost za početnike. Dulje daske (12-14") bolje drže smjer pri turističkom veslanju. Drop-stitch konstrukcija pri 12-15 PSI pruža krutost usporedivu s tvrdim daskama.
  audience: Kupci koji prvi put kupuju SUP, rekreativni veslači i svi koji nadograđuju osnovnu dasku.
  steps:
    - Odredite svoje primarno okruženje za veslanje — jezero, more, rijeka ili mješovito
    - 'Uskladite širinu daske s razinom vještine: 32-34" za početnike, 30-32" za srednju razinu, 28-30" za napredne'
    - 'Odaberite duljinu daske prema namjeni: kraća za okretnost, dulja za držanje smjera i brzinu'
    - 'Odaberite konstrukciju: napuhljiva daska s drop-stitch jezgrom za prenosivost, tvrda daska za maksimalne performanse'
    - Provjerite nosivost — vaša težina plus oprema ne smije prelaziti 80% granice daske
    - 'Provjerite priloženi pribor: pumpa, sigurnosno uže, peraja, ruksak i komplet za popravak'
  faq:
    - q: Koja širina SUP-a najbolja je za početnike?
      a: Širina od 32 do 34 inča pruža najstabilniju platformu za učenje. SUP Explorer 11 sa širinom od 33" idealan je za prve veslače na mirnoj vodi.
    - q: Napuhljiva ili tvrda SUP daska?
      a: Napuhljive daske nude prenosivost, pogodnost skladištenja i apsorpciju udaraca. Tvrde daske nude maksimalnu krutost i brzinu. Za većinu rekreativnih korisnika kvalitetna napuhljiva daska s drop-stitch jezgrom praktičan je izbor.
    - q: Do kojeg tlaka (PSI) trebam napuhati dasku?
      a: Za afarer daske preporučuje se 12-15 PSI. Pri 15 PSI daska postiže maksimalnu krutost usporedivu s tvrdom daskom. Uvijek ostajte unutar raspona radnog tlaka otisnutog na dasci.

  category: planning
  title: Vodič za putovanje sa SUP-om — letenje i cestovna putovanja s napuhivim SUP-om
  description: Kako putovati s napuhivim SUP-om zrakoplovom, automobilom ili kamp-kućicom. Savjeti o naknadama zrakoplovnih kompanija, pakiranju, napuhivanju na odredištu te o čimbenicima međunarodnog putovanja.
  tldr: Ispustite zrak, zarolajte dasku i spakirajte je u njezin ruksak. Većina zrakoplovnih kompanija prihvaća je kao predanu prtljagu (ispod 50 lbs / 50 linearnih inča). Pumpu i veslo uvijek spakirajte u istu torbu. Stignite ranije kako biste imali dodatno vremena ako osoblje pri ukrcaju propituje veličinu torbe. Za duga putovanja razmislite o unaprijednom slanju opreme.
  problem: Putovanje sa SUP-om čini se kompliciranim — ograničenja veličine zrakoplovnih kompanija, zabrinutost zbog sigurnosnih provjera i pitanje kako napuhati dasku na udaljenom odredištu stvaraju nesigurnost.
  solution: afarerovi SUP ruksaci dizajnirani su tako da udovoljavaju ograničenjima zrakoplovnih kompanija za predanu prtljagu. Spakirajte se promišljeno, ponosite komplet za popravak i prije polaska istražite lokacije za napuhivanje (marine, kampovi s električnom energijom).
  audience: Veslači koji planiraju putovanje sa SUP-om zrakoplovom, automobilom ili kamp-kućicom.
  steps:
    - Potpuno ispustite zrak i zarolajte dasku od nosa prema repu
    - Spakirajte zarolanu dasku, pumpu, veslo, uže i peraju u ruksak
    - Provjerite ograničenja veličine i težine zrakoplovne kompanije — većina dopušta 62 linearna inča i 50 lbs
    - Stignite ranije i budite spremni na ručnu provjeru torbe
    - Ponesite komplet za popravak u ručnoj prtljazi za slučaj da se daska ošteti u prijevozu
    - 'Istražite mogućnosti napuhivanja: električni priključci u kampovima za električne pumpe, stanice sa zrakom u marinama'
  faq:
    - q: Hoće li zrakoplovna kompanija prihvatiti moj SUP ruksak kao prtljagu?
      a: Većina američkih i europskih zrakoplovnih kompanija prihvaća SUP ruksake kao standardnu predanu prtljagu ako su ispod 50 lbs i 62 linearna inča. Niskotarifne kompanije mogu naplatiti naknadu za pretjerano veliku prtljagu.
    - q: Mogu li ponijeti svoj SUP kao ručnu prtljagu?
      a: Ne. SUP ruksaci premašuju dimenzije ručne prtljage u svim zrakoplovnim kompanijama. Ruksak uvijek predajte kao prtljagu.
    - q: Kako da napuham svoj SUP na udaljenom odredištu?
      a: Priložena ručna pumpa radi svugdje, bez električne struje. Radi praktičnosti ponijetite prijenosnu električnu pumpu i tražite kampove s električnim priključcima ili marine sa stanicama za zrak.

- slug: sup-size-guide
  category: buying-guide
  title: Vodič o veličini SUP-a — kako odabrati prave dimenzije daske
  description: Potpuni vodič o veličini SUP-a koji obuhvaća preporuke za dužinu, širinu i debljinu na temelju vaše težine, visine, razine vještine i stila veslanja.
  tldr: Početnicima su za stabilnost potrebne šire daske (32-34"). Težim veslačima potrebne su duže daske (11'+) s većim obujmom. Za turističko veslanje potrebni su duži trupovi (12'+). Za jogu je potrebna dodatna širina (34"+). Uvijek provjerite nosivost — vaša težina plus oprema ne bi smjela premašiti 80% ograničenja.
  problem: Odabir pogrešne veličine SUP-a dovodi do loše stabilnosti, sporog držanja smjera i frustrirajućeg iskustva veslanja. Većina kupaca početnika odabere dasku koja izgleda dobro, a da ne razmisle kako dimenzije utječu na performanse.
  solution: 'Uskladite dužinu, širinu i debljinu daske s vlastitom težinom, razinom vještine i primarnom namjenom. Upotrijebite naš kalkulator veličine: zbrojite svoju težinu + težinu opreme i odaberite dasku s najmanje 20% rezerve iznad tog ukupnog zbroja.'
  audience: Kupci SUP-a početnici, veslači koji prelaze na specijaliziranu dasku i svi koji nisu sigurni u odabir veličine.
  steps:
    - Izvagajte se sa svom opremom koju nosite (veslo, PFD, suha vreća)
    - Dodajte 20% sigurnosne rezerve kako biste odredili minimalnu nosivost
    - 'Odaberite širinu prema vještini: 32-34" za početnike, 30-32" za srednju razinu, 28-30" za napredne'
    - 'Odaberite dužinu prema namjeni: 10''6"-11''6" za svestranu uporabu, 12''-14'' za turističko veslanje, 9''-10'' za divlju vodu'
    - 'Provjerite debljinu: 6" standardno, 4" za performanse, 5" za svestranu uporabu'
    - Provjerite preporučeni raspon PSI-a vaše daske za optimalnu krutost
  faq:
    - q: Koja širina SUP-a je najbolja za početnike?
      a: Širina od 32 do 34 inča pruža najstabilniju platformu. Što je daska šira, lakše je održavati ravnotežu — posebno za krupnije veslače.
    - q: Kako znam je li SUP premalen za mene?
      a: Ako daska sjedi nisko u vodi, reagira tromo ili se pramac lako potapa tijekom veslanja, vjerojatno je premala za vašu težinu.
    - q: Utječe li dužina daske na brzinu?
      a: Da. Duža linija plutanja povećava teorijsku brzinu trupa. Turistička daska od 14' znatno je brža od svestrane daske od 10' uz isti napor veslača.

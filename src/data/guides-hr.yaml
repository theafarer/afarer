  faq:
    - q: Koja širina SUP-a najbolja je za veslača od 250 lbs?
      a: Najmanje 34" širine. Dodatna širina pruža primarnu stabilnost potrebnu da bi se krupniji vozači osjećali sigurno stojeći i veslajući.
    - q: Može li osoba od 300 lbs veslati na napuhivom SUP-u?
      a: Da, s daskom nosivosti 350-400 lbs. Model Tropical Breeze Island Escape širine 34"+ podnosi veća opterećenja. Uvijek provjerite konkretnu deklariranu nosivost.
    - q: Trebaju li krupniji veslači posebna vesla?
      a: Duže veslo (1-2 inča duže od standardnog) pomaže zbog višeg stava na širojoj i debljoj dasci. Razmislite o osovini od karbona radi smanjenja umora ruku.

- slug: sup-for-pet-owners
  category: lifestyle
  title: SUP s psima — potpuni vodič za veslanje na dasci sa svojim ljubimcem
  description: 'Sve što trebate znati o veslanju na dasci sa psima: koraci treniranja, sigurnosna oprema, odabir daske i savjeti za uspješnu SUP sesiju s vašim krznenim prijateljem.'
  tldr: Počnite s širokom, stabilnom daskom (34"+). Koristite PFD za ljubimce, protukliznu podlogu na palubi i kratko uže. Trenirajte najprije na kopnu, zatim u plitkoj vodi. Držite sesije kratkima (20-30 min). Ponesite svježu vodu i ručnik. Nikada ne prisiljavajte psa ako djeluje uznemireno.
  problem: Veslanje na dasci sa psima bez odgovarajuće pripreme može biti stresno — psi se mogu uplašiti, skočiti s daske ili izgrebati njezinu površinu.
  solution: Koristite široku stabilnu dasku s mekanom EVA palubom. Postupno navikavajte svog psa. Ponijetite sigurnosnu opremu, uključujući prsluk za spasavanje za ljubimce i kratko uže primjereno za SUP.
  audience: Vlasnici pasa koji žele veslati na SUP-u sa svojim ljubimcima.
  steps:
    - Počnite s širokom daskom (34"+ s visokom nosivošću za vas + psa)
    - Nabavite prsluk za spasavanje za psa koji dobro pristaje i ima ručku
    - 'Vježbajte na kopnu: neka vaš pas sjedne na ispuhanu dasku, a zatim na napuhanu dasku na travi'
    - 'Prijeđite u plitku vodu: kleknite na dasku sa svojim psom i napravite nekoliko zaveslaja'
    - 'Držite sesije kratkima: najviše 20-30 minuta tijekom prvih nekoliko izlazaka'
    - Uvijek ponijetite svježu vodu, sklopivu posudicu i ručnik za psa
  faq:
    - q: Koja je SUP daska najbolja za pse?
      a: Široka stabilna daska s mekanom EVA palubom koja šapama pruža dobar otpor klizanju. Model Tropical Breeze Island Escape širine 34"+ idealan je za veslanje s psima.
    - q: Treba li moj pas prsluk za spasavanje?
      a: Da, čak i ako je dobar plivač. Prsluk za spasavanje za psa s ručkom olakšava podizanje psa natrag na dasku ako padne u vodu.
    - q: Kako mogu spriječiti psa da izgrebe dasku?
      a: Redovito podrezujte kandže psa. Podloga od EVA pjene štiti PVC površinu. Radi dodatne zaštite na palubu postavite ručnik ili podlogu za ljubimce.

- id: sup-learning
  question: 'Czy SUP jest trudny do nauczenia?'
  answer: 'Wcale nie. Większość początkujących stoi już prosto i wiosłuje podczas swojej pierwszej sesji. Nasza seria All-Around SUP ma szerokie, stabilne platformy zaprojektowane specjalnie dla osób pływających po raz pierwszy. Zacznij na spokojnej wodzie, a w ciągu kilku minut będziesz komfortowo wiosłować.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Czy mogę go używać w morzu?'
  answer: 'Tak. Deski SUP afarer są zaprojektowane do użytku w morzu, jeziorach i rzekach. Nasza seria Touring radzi sobie z przybrzeżnymi falami, a wszystkie deski wykorzystują PVC klasy morskiej odporne na korozję słoną wodą. Po użyciu w morzu spłucz deskę słodką wodą.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Ile trwa pompowanie?'
  answer: 'Za pomocą dołączonej pompy dwustronnego działania napompujesz większość desek do 12–15 PSI w mniej niż 5 minut. Naszą pompą elektryczną zajmie to mniej niż 2 minuty. Spuszczanie powietrza i pakowanie trwa około 3 minut.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Czy mogę podróżować z dmuchaną deską SUP?'
  answer: 'Zdecydowanie. Każda deska afarer mieści się w pokrowcu rozmiaru plecaka spełniającym wymogi bagażowe linii lotniczych. Przy zaledwie 18–22 funtach łatwo zabrać ją na plażę, jezioro czy przez terminale lotnicze.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Jaki jest limit wagowy?'
  answer: 'Nasze deski All-Around SUP utrzymują do 220 funtów. Serie Touring i Yoga utrzymują do 250 funtów. W przypadku użytku dla dwóch osób lub cięższego ładunku skontaktuj się z naszym zespołem po poradę.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Co jest w pudełku?'
  answer: 'Każdy SUP afarer zawiera deskę, plecak podróżny, pompę ręczną dwustronnego działania, wymienną płetwę, smycz spiralną i zestaw naprawczy. Niektóre modele oferują również opcjonalne wiosło z karbonu.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Czy dostępne są zestawy promocyjne?'
  answer: 'Tak. Składamy przemyślane zestawy, które pozwalają Ci zaoszczędzić pieniądze w porównaniu z zakupem elementów osobno. Skontaktuj się z naszym zespołem sprzedaży w sprawie aktualnych promocji na zestawy i rabatów ilościowych.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Czy potrzebuję kamizelki ratunkowej na SUP?'
  answer: 'Tak. W wielu jurysdykcjach kamizelka ratunkowa jest prawnie wymagana na każdym statku, w tym na deskach SUP. Nawet tam, gdzie nie jest wymagana, certyfikowana kamizelka ratunkowa CE to niezbędny sprzęt bezpieczeństwa. Zalecamy zawsze noszenie jej na wodzie.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Czy muszę zarejestrować moją deskę SUP?'
  answer: 'Wymogi różnią się w zależności od jurysdykcji. W większości regionów deski SUP bez silnika nie wymagają rejestracji. Jeśli chcesz dodać silnik, sprawdź konkretne przepisy w lokalnym urzędzie żeglugi. Deski rekreacyjne do wiosłowania są zazwyczaj zwolnione z rejestracji jednostek pływających.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Jak naprawić przebicie?'
  answer: 'Oczyść obszar, wytnij łatkę z zaokrąglonymi rogami, nałóż klej PVC, mocno dociśnij i odczekaj 24 godziny przed napompowaniem deski. Deski afarer są dostarczane z zestawem naprawczym. Szczegółowe instrukcje znajdziesz w naszym przewodniku naprawy desek dmuchanych.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Jak przechowywać dmuchaną deskę SUP?'
  answer: 'Spłucz słodką wodą, całkowicie wysusz, spuść całe powietrze, luźno zwiń od dziobu i przechowuj deskę w pokrowcu w chłodnym, suchym miejscu z dala od bezpośredniego słońca. Nigdy nie przechowuj jej wilgotnej ani w ekstremalnych temperaturach.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Dmuchana czy twarda deska SUP?'
  answer: 'Deski dmuchane oferują przenośność, łatwe przechowywanie i amortyzację wstrząsów. Deski twarde zapewniają maksymalną sztywność i prędkość. Dla większości użytkowników rekreacyjnych deska wysokiej jakości z rdzeniem drop-stitch to praktyczny wybór.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Przy jakiej sile wiatru SUP staje się zbyt niebezpieczny?'
  answer: 'Początkujący: powyżej 10 mph (8 węzłów). Średniozaawansowani: powyżej 15 mph (13 węzłów). Eksperci: powyżej 20 mph (17 węzłów). Jeśli masz wątpliwości, nie wychodź na wodę. Wiatr od lądu w stronę morza jest niebezpieczny na każdym poziomie.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Jaka jest gwarancja afarer?'
  answer: 'Wszystkie produkty afarer są objęte kompleksową gwarancją producenta. Deski SUP mają gwarancję 2 lata lub dłuższą na wady produkcyjne. Gwarancja obejmuje wady materiałowe i wykonania przy normalnym użytkowaniu.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Jak złożyć reklamację gwarancyjną?'
  answer: 'Reklamację złóż, kontaktując się z naszym zespołem wsparcia z numerem zamówienia, zdjęciami problemu i krótkim opisem. Większość reklamacji jest rozpatrywana w ciągu 2 dni roboczych. Zatwierdzone reklamacje otrzymują produkt zastępczy lub instrukcje naprawy w ciągu kilku dni.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Ile trwa dostawa?'
  answer: 'Zamówienia z magazynu są wysyłane w ciągu 2–4 dni roboczych. Zamówienia w USA docierają w ciągu 5–10 dni roboczych. Zamówienia międzynarodowe docierają w ciągu 10–15 dni roboczych, w zależności od miejsca docelowego. Pilne zamówienia mogą być przyspieszone.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Jaka jest polityka zwrotów?'
  answer: 'Przyjmujemy zwroty w ciągu 30 dni od dostawy dla nieużywanych produktów w oryginalnym opakowaniu. Zamówienia customowe/OEM nie podlegają zwrotowi. Skontaktuj się z naszym zespołem wsparcia, aby rozpocząć zwrot — wysyłamy przedpłaconą etykietę wysyłkową.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Czy dostępne są usługi OEM/ODM?'
  answer: 'Tak. Oferujemy usługi private label i projektowania na zamówienie dla firm. Od niestandardowego brandingu na istniejących modelach po całkowicie autorskie projektowane kadłuby — nasz zespół inżynieryjny może opracować produkty pod Twoją marką. Obowiązują minimalne ilości zamówień.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Jakiej długości wiosła potrzebuję?'
  answer: 'Wiosło powinno być o 6–8 cali dłuższe niż Twój wzrost. Wiosła regulowane umożliwiają dokładne dostrojenie do różnych warunków. Zobacz nasz przewodnik po wiosłach, aby poznać szczegółowe wymiary.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Czym różni się PVC od Hypalonu?'
  answer: 'PVC jest lekkie, przystępne cenowo i łatwe w naprawie za pomocą dołączonego zestawu łatek. PVC klasy wojskowej z powłoką odporną na UV zapewnia najlepszy balans między trwałością a wagą dla rekreacyjnego SUP. afarer stosuje trójwarstwowe laminowane PVC we wszystkich liniach produktów.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Jaka szerokość SUP jest najlepsza dla stabilności?'
  answer: 'Dla początkujących szerokość 33–34 cale zapewnia najlepszy balans między stabilnością a komfortem wiosłowania. Deski węższe niż 32 cale wydają się niestabilne dla nowych użytkowników. afarer SUP Explorer 11 o szerokości 33 cali jest idealny do nauki.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Jak wybrać objętość SUP na podstawie mojej wagi?'
  answer: 'Pomnóż swoją wagę w kg przez 2,2, aby uzyskać przyjazny początkującym poziom objętości. Użytkownik SUP o wadze 75 kg potrzebuje na przykład co najmniej 165 litrów, ale 220–260 litrów jest znacznie stabilniejsze do nauki. SUP Explorer 11 oferuje 260 litrów i nadaje się dla użytkowników do 100 kg.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'Jak afarer wypada na tle innych marek?'
  answer: 'afarer oferuje najlepszy stosunek jakości do ceny w dmuchanym sprzęcie wodnym. W porównaniu z Red Paddle Co afarer zapewnia 90% osiągów za 60% kosztów. W porównaniu z iRocker afarer stosuje wyższej jakości trójwarstwowe wojskowe PVC i wyższe wartości PSI. W porównaniu z Bluefin afarer oferuje lepsze specyfikacje materiałowe. Dla większości rekreacyjnych użytkowników SUP afarer zapewnia najlepszy balans między jakością a ceną.'
  category: general

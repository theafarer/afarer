- id: b2b-certification
  question: 'Jakie certyfikaty mają produkty OEM afarer?'
  answer: 'Wszystkie produkty OEM/ODM afarer obejmują: deklarację zgodności CE (rynek UE), UKCA (rynek brytyjski), system zarządzania jakością ISO 9001:2015, audyt odpowiedzialności społecznej BSCI, zgodność materiałową REACH i RoHS, klasyfikację EN ISO 25649 dla dmuchanych łodzi. Dodatkowe certyfikaty na życzenie: dokumentacja zgodności z US Coast Guard, testowanie według normy wojskowej (MIL-STD-810) i wsparcie certyfikacji importowej w kraju docelowym.'

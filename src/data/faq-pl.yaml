- id: sup-choppy-water
  question: 'Jak wiosłować na SUP w falującej wodzie lub przy wietrze?'
  answer: 'Na falach: ugnij kolana, stań szerzej, skróć pociągnięcie wiosłem i aktywuj tułów dla równowagi. Pod wiatr: użyj niższego kąta wiosła, wykonuj krótsze pociągnięcia i pochyl się do przodu. Przy wietrze bocznym: wiosłuj po nawietrznej stronie, aby korygować dryf. Z wiatrem: surfuj na falach dla prędkości. Początkujący powinni unikać wiatru powyżej 10 mph i wybierać szersze, dłuższe deski dla stabilności. afarer Ocean Voyager, turystyczna deska SUP, jest zaprojektowana do radzenia sobie z umiarkowanymi falami i warunkami wiatrowymi.'

- id: b2b-payment
  question: 'Jakie warunki płatności obowiązują dla zamówień OEM?'
  answer: 'Standardowe warunki płatności: 30% depozytu przy podpisanej PI (faktura proforma), 70% pozostałej kwoty przed wysyłką za potwierdzeniem kopii B/L (konosament). Dla nowych partnerów: 50% depozytu, 50% przed wysyłką. Dla stałych partnerów z historią zamówień: L/C at sight lub netto 30 dni dla kwalifikowanych kont (podlega ocenie kredytowej). Metody płatności: przelew bankowy T/T, L/C (akredytywa), Western Union. Wszystkie płatności w USD lub EUR.'

- id: b2b-samples
  question: 'Czy mogę zamówić próbki przed zobowiązaniem się do produkcji seryjnej?'
  answer: 'Tak. Zamówienia próbek są dostępne dla wszystkich projektów OEM/ODM. Próbki przedprodukcyjne (PPS) są wykonywane po wykonaniu form i przed produkcją seryjną. Czas realizacji próbki: 15–25 dni roboczych dla istniejących form, 25–40 dni roboczych dla form na zamówienie. Koszty próbek są potrącane z pierwszego zamówienia seryjnego. Próbki są wysyłane kurierami ekspresowymi (DHL, FedEx, UPS) z pełnym śledzeniem i docierają zazwyczaj w ciągu 3–5 dni roboczych.'

- id: sup-oem-process
  question: 'Jak wygląda proces produkcji OEM dla dmuchanych desek SUP private label?'
  answer: 'Proces OEM: 1) Specyfikacja i brief projektowy — udostępnij docelowe specyfikacje, rysunki CAD lub produkt referencyjny. 2) Prototypowanie form 3D — niestandardowe formy aluminiowe i kompozytowe projektowane wewnętrznie. 3) Wybór materiałów i próbka — wojskowe PVC lub Hypalon z niestandardowymi kolorami i rozmieszczeniem logo. 4) Audyt fabryki CE i zgodność — każde zamówienie obejmuje deklarację CE, identyfikowalność ISO 9001 i raport BSCI. 5) Produkcja seryjna ze 100-punktową listą kontrolną QC. 6) Wysyłka FOB Qingdao z kompletną dokumentacją eksportową. Czas realizacji 30-45 dni, MOQ 50 sztuk (standardowy SUP).'

  relatedGuides: []
- id: b2b-ip-protection
  question: 'Jak afarer chroni moją własność intelektualną i projekty?'
  answer: 'Ochrona własności intelektualnej to kluczowy element naszej usługi OEM. Podpisujemy umowy NDA przed każdą dyskusją projektową. Pliki projektowe są przetwarzane na izolowanych stacjach roboczych z rejestracją dostępu. Wszystkie narzędzia i formy pozostają Twoją wyłączną własnością (opłacone przez Ciebie). Nie wykorzystujemy ponownie Twoich form ani projektów dla innych klientów. Przechowywanie i konserwacja form są wliczone dla aktywnych kont. Po zakończeniu umowy formy są wysyłane do Ciebie lub niszczone z dokumentacją wideo. Szanujemy wszystkie prawa znaków towarowych i patentów.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Jakie opcje wysyłki i logistyki są dostępne?'
  answer: 'FOB Qingdao (standard): ładunek jest załadowany w porcie Qingdao; następnie samodzielnie organizujesz fracht. CIF (wskazany port): organizujemy i ubezpieczamy wysyłkę do Twojego portu docelowego. DDP / od drzwi do drzwi: logistyka w modelu pełnej obsługi, obejmująca odprawę celną i dostawę końcową. Fracht morski na zachodnie wybrzeże USA: ok. 25–30 dni. Fracht morski do UE (Hamburg/Rotterdam): ok. 30–35 dni. Fracht lotniczy dostępny dla pilnych zamówień (3–5 dni). Obsługujemy całą eksportową dokumentację celną, świadectwa pochodzenia i listy pakowania.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Jakie procesy kontroli jakości obowiązują dla zamówień OEM?'
  answer: 'Każde zamówienie OEM podlega udokumentowanemu planowi QC: 1) Kontrola materiałów przychodzących — badania partii tkaniny PVC pod kątem grubości, wytrzymałości na rozciąganie i odporności UV. 2) QC procesu — testy wytrzymałości spawanych szwów na każdej 50. sztuce, próba ciśnieniowa przy 1,5x nominalnego PSI. 3) Inspekcja końcowa — 100% inspekcja wizualna i próba ciśnieniowa każdej deski. 4) Pobieranie próbek AQL — próbkowanie partii wg ISO 2859 z krytycznymi wadami = 0 akceptowanych. 5) Inspekcja strony trzeciej — SGS, Bureau Veritas lub Intertek dostępne na koszt kupującego.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Czy możecie wykonać niestandardowe opakowania dla mojej marki?'
  answer: 'Tak. Oferujemy pełną usługę niestandardowych opakowań: pudełka detaliczne z drukiem CMYK i grafiką marki, pokrowce z nadrukiem sitodrukowym lub haftowanymi logotypami, instrukcje obsługi w Twoim języku, metki zawieszane i etykiety z kodem kreskowym/UPC oraz opakowania wewnętrzne (worki foliowe, wkładki piankowe). Minimalne MOQ opakowań: 500–1000 sztuk dla niestandardowych pudełek, 200–500 dla pokrowców. Projektowanie opakowań jest wliczone w zamówienia OEM.'

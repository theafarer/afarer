- id: b2b-factory-audit
  question: 'Czy mogę odwiedzić fabrykę lub zorganizować audyt strony trzeciej?'
  answer: 'Wizyty w fabryce są mile widziane po uzgodnieniu. Gościmy właścicieli marek przez cały rok i możemy zorganizować odbiór z lotniska Qingdao Jiaodong International Airport (TAO). Dla kupujących, którzy nie mogą nas odwiedzić, oferujemy: wirtualny spacer po fabryce poprzez wideorozmowę, koordynację audytu strony trzeciej z SGS/Bureau Veritas (kupujący pokrywa koszty audytu) oraz szczegółowy pakiet dokumentacji o możliwościach fabryki, w tym listę wyposażenia, przebieg procesu QC i kwalifikacje personelu.'

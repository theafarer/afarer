- id: sup-weight-capacity
  question: 'Ile wagi może utrzymać dmuchana deska SUP?'
  answer: 'Nośność różni się w zależności od objętości deski. Deski afarer: SUP Explorer 11 (260 l, do 100 kg / 220 funtów), Ocean Voyager 12 (310 l, do 140 kg / 308 funtów), Leviathan Wake (350 l, do 180 kg / 396 funtów). Dla optymalnych osiągów utrzymuj całkowite obciążenie (użytkownik + sprzęt) poniżej 80% maksymalnej nośności. Deska pływa wyżej na wodzie i lepiej się steruje bez przeciążenia, szczególnie na falującej wodzie.'

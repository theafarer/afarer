- id: fishing-sup-setup
  question: 'ตกปลาจากกระดาน SUP ได้ไหม?'
  answer: 'ได้ การตกปลาจาก SUP ได้รับความนิยมมากขึ้นเรื่อย ๆ เพราะท่ายืนช่วยให้มองเห็นในน้ำได้ดีเยี่ยม เลือกกระดานยาวอย่างน้อย 11 ฟุตและกว้าง 33–34 นิ้วเพื่อความเสถียร เพิ่มกล่องอุปกรณ์ตกปลาพร้อมรางยึดเบ็ดติดตั้งบนจุดยึดหลังกระดาน สมอเล็ก และสวมเสื้อชูชีพเสมอ afarer SUP Explorer 11 เหมาะกับการตกปลาแบบสบาย ๆ'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: 'โยคะบนกระดาน SUP ได้ไหม?'
  answer: 'ได้แน่นอน โยคะ SUP ผสานท่าโยคะดั้งเดิมกับความท้าทายของแพลตฟอร์มลอยน้ำ กระตุ้นกล้ามเนื้อรักษาสมดุลชั้นลึก ใช้กระดานกว้าง 33 นิ้วขึ้นไปที่มีผิวหลังนุ่มกันลื่น ซ้อมในน้ำนิ่งระดับตื้นพร้อมสมอ เริ่มจากท่าพื้นฐานอย่างท่าหมาก้มหน้า ท่านักรบ 2 และท่าต้นไม้ SUP Explorer 11 ที่มีผิว EVA เต็มหลังกระดานเหมาะอย่างยิ่ง'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: 'สายการบินมีกฎอะไรบ้างสำหรับการเดินทางกับกระดาน SUP สูบลม?'
  answer: 'สายการบินส่วนใหญ่รับกระเป๋า SUP เป็นสัมภาระขนาดใหญ่หากไม่เกิน 23–32 kg กระเป๋าของ afarer ขนาดประมาณ 90x40x30 cm และหนักประมาณ 15 kg เมื่อพับเก็บ บางสายการบินอาจเก็บค่าธรรมเนียมสัมภาระขนาดใหญ่เพิ่ม มาให้เช้า แยกครีบกับปั๊มใส่สัมภาระที่ถือขึ้นเครื่อง และติดป้ายกระเป๋าว่าเป็นของแตกหักง่าย ตรวจสอบกฎอุปกรณ์กีฬาของสายการบินทุกครั้งก่อนบิน'
  category: general
  relatedProducts:

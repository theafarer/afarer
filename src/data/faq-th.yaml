- id: sup-learning
  question: 'การเรียนรู้ SUP ยากไหม?'
  answer: 'ไม่ยากเลย ผู้เริ่มต้นส่วนใหญ่ยืนและพายได้ตั้งแต่ครั้งแรกที่ลอง ซีรีส์ All-Around ของ afarer มีแพลตฟอร์มกว้างและเสถียรมาก ออกแบบมาเพื่อผู้ที่พายครั้งแรกโดยเฉพาะ เริ่มต้นในน้ำนิ่งแล้วคุณจะพายได้ในไม่กี่นาที'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'ใช้ในทะเลได้ไหม?'
  answer: 'ได้ กระดาน SUP ของ afarer ผลิตมาเพื่อใช้งานในทะเล ทะเลสาบ และแม่น้ำ ซีรีส์ Touring ทนต่อคลื่นชายฝั่ง และทุกแผ่นใช้ PVC คุณภาพสำหรับงานทางทะเลที่ทนต่อการกัดกร่อนของน้ำเค็ม ล้างด้วยน้ำจืดหลังใช้งานในทะเล'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'การสูบลมใช้เวลานานแค่ไหน?'
  answer: 'ด้วยปั๊มอัดสองจังหวะที่แถมมา กระดานส่วนใหญ่สูบได้ถึง 12–15 PSI ในเวลาไม่ถึง 5 นาที ปั๊มไฟฟ้าที่เราจำหน่ายลดเวลาเหลือไม่ถึง 2 นาที การรีดอากาศและพับเก็บใช้เวลาราว 3 นาที'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'เดินทางกับกระดาน SUP แบบสูบลมได้ไหม?'
  answer: 'ได้แน่นอน กระดาน afarer ทุกแผ่นพับเก็บในถุงสะพายหลังขนาดที่เข้าเกณฑ์สัมภาระของสายการบิน ด้วยน้ำหนักเพียง 18–22 ปอนด์ คุณสามารถหิ้วไปชายหาด ทะเลสาบ หรือขึ้นเครื่องบินได้อย่างง่ายดาย'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'น้ำหนักรับได้เท่าไหร่?'
  answer: 'กระดาน All-Around SUP รับน้ำหนักได้ถึง 220 ปอนด์ ซีรีส์ Touring และ Yoga รับได้ถึง 250 ปอนด์ หากต้องการใช้สองคนหรือบรรทุกหนักกว่านั้น ติดต่อทีมงานของเราเพื่อรับคำแนะนำ'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'ในกล่องมีอะไรบ้าง?'
  answer: 'SUP afarer ทุกชุดประกอบด้วยกระดาน กระเป๋าสะพายหลังสำหรับเดินทาง ปั๊มมือแบบอัดสองจังหวะ ครีบถอดได้ leash แบบกลีบสปริง และชุดซ่อมแซม บางรุ่นมีตัวเลือกอัปเกรดคานพายไฟเบอร์คาร์บอนด้วย'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'มีข้อเสนอชุดผลิตภัณฑ์ไหม?'
  answer: 'มี เราจัดชุดผลิตภัณฑ์คัดสรรที่ช่วยคุณประหยัดกว่าการซื้อแยกชิ้น ติดต่อทีมขายของเราเพื่อรับข้อเสนอชุดล่าสุดและราคาส่วนลดปริมาณมาก'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'ต้องใส่เสื้อชูชีพตอนเล่น SUP ไหม?'
  answer: 'ต้อง หลายประเทศกำหนดตามกฎหมายให้มีเสื้อชูชีพบนเรือทุกลำ รวมถึง SUP แม้ที่ไม่บังคับ เสื้อชูชีพที่ได้รับการรับรอง CE ก็เป็นอุปกรณ์ความปลอดภัยที่จำเป็น เราแนะนำให้สวมตลอดเวลาที่อยู่ในน้ำ'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'ต้องจดทะเบียนกระดาน SUP ไหม?'
  answer: 'ข้อกำหนดต่างกันในแต่ละประเทศ ในพื้นที่ส่วนใหญ่ SUP ที่ไม่มีเครื่องยนต์ไม่ต้องจดทะเบียน หากคุณวางแผนติดตั้งเครื่องยนต์ โปรดสอบถามกฎระเบียบเฉพาะกับหน่วยงานทางทะเลท้องถิ่น กระดานเพื่อการพักผ่อนโดยทั่วไปได้รับการยกเว้นการจดทะเบียนเรือ'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'ซ่อมรูรั่วอย่างไร?'
  answer: 'ทำความสะอาดบริเวณนั้น ตัดแผ่นแปะมุมมน ทากาว PVC กดให้แน่นและรอ 24 ชั่วโมงก่อนสูบลม กระดาน afarer แถมชุดซ่อมแซมมาให้ ดูคำแนะนำละเอียดในคู่มือซ่อมกระดานสูบลมของเรา'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'ควรเก็บกระดาน SUP สูบลมอย่างไร?'
  answer: 'ล้างด้วยน้ำจืด ตากให้แห้งสนิท รีดอากาศออกให้หมด ม้วนแบบหลวม ๆ จากส่วนหัวกระดาน แล้วเก็บในถุงเก็บในที่เย็น แห้ง พ้นแสงแดดโดยตรง ห้ามเก็บแบบเปียกหรือในอุณหภูมิสุดขั้นเด็ดขาด'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'กระดานสูบลมหรือกระดานแข็งดีกว่า?'
  answer: 'กระดานสูบลมได้ความสะดวกในการพกพา เก็บง่าย และดูดซับแรงกระแทก กระดานแข็งให้ความแข็งแรงและความเร็วสูงสุด สำหรับผู้ใช้เพื่อการพักผ่อนส่วนใหญ่ กระดานสูบลมคุณภาพดีที่มีแกน drop-stitch เป็นตัวเลือกที่ปฏิบัติได้จริงที่สุด'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'ลมแรงเท่าไหร่ถือว่าแรงเกินไปสำหรับ SUP?'
  answer: 'ผู้เริ่มต้น: เกิน 10 mph (8 น็อต) ระดับกลาง: เกิน 15 mph (13 น็อต) ระดับสูง: เกิน 20 mph (17 น็อต) ถ้าไม่แน่ใจอย่าลงน้ำ ลมที่พัดจากฝั่งออกสู่ทะเลเป็นอันตรายทุกระดับทักษะ'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'การรับประกันของ afarer เป็นอย่างไร?'
  answer: 'ผลิตภัณฑ์ afarer ทั้งหมดได้รับความคุ้มครองด้วยการรับประกันจากผู้ผลิตอย่างครอบคลุม กระดาน SUP รับประกัน 2+ ปีสำหรับข้อบกพร่องจากการผลิต การรับประกันครอบคลุมตำหนิวัสดุและงานผลิตในการใช้งานปกติ'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'แจ้งสินค้าเข้าการรับประกันอย่างไร?'
  answer: 'แจ้งได้โดยติดต่อทีมสนับสนุนพร้อมหมายเลขคำสั่งซื้อ รูปถ่ายปัญหา และคำอธิบายสั้น ๆ คำขอส่วนใหญ่ได้รับการตรวจสอบภายใน 2 วันทำการ คำขอที่อนุมัติจะได้รับสินค้าทดแทนหรือคำแนะนำการซ่อมภายในไม่กี่วัน'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'การจัดส่งใช้เวลานานแค่ไหน?'
  answer: 'คำสั่งซื้อสินค้าพร้อมส่งจะจัดส่งภายใน 2–4 วันทำการ คำสั่งซื้อในสหรัฐฯ ส่งถึงใน 5–10 วันทำการ คำสั่งซื้อระหว่างประเทศส่งถึงใน 10–15 วันทำการขึ้นอยู่กับปลายทาง คำสั่งซื้อด่วนเร่งด่วนสามารถเร่งได้'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'นโยบายการคืนสินค้าเป็นอย่างไร?'
  answer: 'เรารับคืนภายใน 30 วันนับจากได้รับสินค้า สำหรับสินค้าที่ยังไม่ใช้ในบรรจุภัณฑ์เดิม คำสั่งซื้อแบบกำหนดเอง/OEM ไม่รับคืน ติดต่อทีมสนับสนุนเพื่อเริ่มการคืนสินค้า — เรามีใบปะหน้าจัดส่งชำระล่วงหน้าให้'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'มีบริการ OEM/ODM ไหม?'
  answer: 'มี เราให้บริการสินค้าแบรนด์เจ้าของและออกแบบกำหนดเองสำหรับธุรกิจ ตั้งแต่ใส่โลโก้ของคุณบนรุ่นที่มีอยู่ ไปจนถึงดีไซน์ทรงกระดานกำหนดเองเต็มรูปแบบ ทีมวิศวกรของเราพัฒนาผลิตภัณฑ์ในแบรนด์ของคุณได้ โดยมีจำนวนสั่งซื้อขั้นต่ำกำหนดไว้'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'คานพายควรยาวเท่าไหร่?'
  answer: 'คานพายควรยาวกว่าความสูงของคุณ 6–8 นิ้ว คานพายแบบปรับระดับได้ช่วยให้ปรับอย่างละเอียดตามสภาพต่าง ๆ ดูขนาดโดยละเอียดในคู่มือคานพายของเรา'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'PVC กับ Hypalon ต่างกันอย่างไร?'
  answer: 'PVC เบา ราคาเข้าถึงได้ และซ่อมง่ายด้วยชุดแผ่นแปะที่แถมมา PVC คุณภาพระดับทหารที่เคลือบทน UV ให้สมดุลระหว่างความทนทานกับน้ำหนักที่ดีที่สุดสำหรับ SUP เพื่อการพักผ่อน afarer ใช้ PVC เคลือบ 3 ชั้นในทุกหมวดผลิตภัณฑ์'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'ความกว้างกระดาน SUP เท่าไหร่เสถียรที่สุด?'
  answer: 'สำหรับผู้เริ่มต้น ความกว้าง 33–34 นิ้วให้สมดุลระหว่างความเสถียรกับความง่ายในการพายที่ดีที่สุด กระดานแคบกว่า 32 นิ้วอาจรู้สึกไม่นิ่งสำหรับมือใหม่ afarer SUP Explorer 11 กว้าง 33 นิ้ว เหมาะกับการเรียนรู้เป็นอย่างยิ่ง'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'เลือกปริมาตร SUP ตามน้ำหนักอย่างไร?'
  answer: 'คูณน้ำหนักตัวเป็น kg ด้วย 2.2 เพื่อให้ได้ปริมาตรเป้าหมายที่เป็นมิตรกับผู้เริ่มต้น ตัวอย่างเช่น ผู้พายหนัก 75 kg ต้องการอย่างน้อย 165 ลิตร แต่ 220–260 ลิตรจะเสถียรกว่ามากสำหรับการเรียนรู้ SUP Explorer 11 ให้ปริมาตร 260 ลิตร เหมาะสำหรับผู้ขับขี่ถึง 100 kg'
  category: product
  relatedProducts:

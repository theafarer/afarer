  description: Pengetahuan keselamatan penting untuk setiap pendayung — tafsiran cuaca, pemilihan PFD, penyelamatan kendiri, dan protokol dayungan berkumpulan.
  articles: []
sup-size-guide:
  title: Panduan Saiz SUP — Cara Memilih Panjang, Lebar & Isipadu Papan yang Tepat
  description: Panduan saiz SUP menyeluruh merangkumi panjang, lebar, ketebalan, isipadu (liter), dan padanan berat penunggang. Cari saiz SUP boleh tiup yang sesuai dengan berat badan, tahap kemahiran, dan aktiviti dayungan anda.
  articles: []

sup:
  title: Ilmu SUP — Panduan & Sumber SUP Boleh Tiup | Afarer
  description: Pusat ilmu SUP lengkap merangkumi panduan pemula, saiz papan, tutorial teknik, tip keselamatan, dan teknologi SUP boleh tiup.
  articles:
    - title: Asas SUP — Panduan Pemula
      desc: Semua yang perlu diketahui oleh pemula — jenis papan, saiz dayung, posisi berdiri, dan tip hari pertama.
      href: /learn/sup
    - title: Panduan Saiz SUP
      desc: Cari panjang, lebar, dan isipadu papan yang sesuai dengan berat badan, kemahiran, dan gaya dayungan anda.
      href: /size-guide
    - title: Papan Boleh Tiup vs Papan Keras
      desc: Yang mana sesuai untuk anda? Perbandingan dari segi kemudahan alih, prestasi, ketahanan, dan kos.
      href: /compare/inflatable-vs-hardboard
    - title: Teknik Pertengahan
      desc: Tingkatkan dayungan anda dengan ayunan dayung lanjutan, teknik pusingan, dan pengendalian air bergelora.
      href: /learn/intermediate-techniques
    - title: Cara Memilih SUP Boleh Tiup
      desc: Kenal pasti faktor utama — binaan, ketebalan, susunan sirip, dan aksesori yang disertakan.
      href: /v2/how-to-choose-inflatable-sup
    - title: Keselamatan Air
      desc: Pengetahuan keselamatan penting termasuk tafsiran cuaca, pemilihan PFD, penyelamatan kendiri, dan dayungan berkumpulan.
      href: /learn/water-safety
water-safety:
  title: Ilmu Keselamatan Air — Panduan Dayungan Selamat | Afarer
  description: Sumber keselamatan air menyeluruh untuk SUP, kayak, dan bot. Ketahui tentang pemilihan PFD, tafsiran cuaca, penyelamatan kendiri, keselamatan air sejuk, dan pensijilan CE.
  articles:
    - title: Panduan Keselamatan Air
      desc: Pengetahuan keselamatan penting untuk setiap pendayung — cuaca, PFD, penyelamatan kendiri, dan protokol dayungan berkumpulan.
      href: /learn/water-safety
    - title: Panduan Jaket Keselamatan & PFD
      desc: Cara memilih alat pelampung peribadi yang tepat untuk SUP, kayak, bot, dan kegunaan profesional.
      href: /v2/life-jacket-buying-guide
    - title: Senarai Semak Keselamatan SUP
      desc: Senarai semak keselamatan sebelum pelancaran yang perlu dipatuhi oleh setiap pendayung papan berdiri sebelum turun ke air.
      href: /v2/sup-safety-guide
    - title: Keselamatan Dayungan di Air Sejuk
      desc: Langkah berjaga-jaga, peralatan, dan teknik penting untuk mendayung dalam keadaan air sejuk.
      href: /v2/cold-water-safety-guide
    - title: Kesilapan Dayungan Pemula
      desc: Kesilapan biasa yang dilakukan pendayung kali pertama dan cara mengelakkannya untuk pengalaman yang lebih selamat dan menyeronokkan.
      href: /v2/beginner-sup-guide
    - title: Penjelasan Pensijilan CE
      desc: Maksud pensijilan CE bagi papan SUP boleh tiup — standard, pengujian, dan mengapa ia penting untuk keselamatan.
      href: /trust
sup-basics:
  title: Asas SUP — Panduan Pemula untuk Sukan Papan Dayung Berdiri
  description: Semua yang perlu anda ketahui untuk memulakan sukan papan dayung berdiri. Panduan peralatan, nasihat saiz, tip keselamatan, dan teknik pemula dari pusat ilmu Afarer.
  articles: []
drop-stitch-core:
  title: Teknologi Teras Drop-Stitch — Bagaimana SUP Boleh Tiup Mencapai Kekakuan
  description: 'Kajian mendalam tentang teknologi binaan drop-stitch: bagaimana ribuan benang poliester mewujudkan platform boleh tiup yang kaku pada 15-25 PSI. Ketumpatan benang, integrasi fabrik, proses pembuatan, dan perbandingan prestasi.'
  articles: []
inflatable-technology:
  title: Teknologi SUP Boleh Tiup — Bahan, Binaan & Kejuruteraan
  description: Bagaimana papan SUP boleh tiup dibina — susunan lapisan bahan, teras drop-stitch, sistem injap, kimpalan RF, dan ujian kualiti. Fahami apa yang menjadikan produk boleh tiup tahan lama dan berprestasi tinggi.
  articles: []
intermediate-techniques:
  title: Teknik SUP & Kayak Pertengahan — Melangkaui Asas
  description: Tingkatkan kemahiran dayungan anda dengan ayunan dayung lanjutan, pengendalian air bergelora, pengurusan angin, teknik penyelamatan kendiri, dan etika dayungan berkumpulan. Untuk pendayung yang bersedia melangkaui kemahiran pemula.
  articles: []
materials:
  title: Bahan SUP Boleh Tiup — PVC, EVA & Fabrik Drop-Stitch
  description: 'Panduan menyeluruh tentang bahan yang digunakan dalam pembuatan SUP boleh tiup: PVC gred tentera, dek buih EVA, fabrik drop-stitch, serat karbon, dan aloi aluminium. Spesifikasi, aplikasi, dan kriteria pemilihan.'
  articles: []
safety-in-water-sports:

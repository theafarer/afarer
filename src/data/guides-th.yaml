- slug: sup-maintenance
  category: maintenance
  title: วิธีทำความสะอาดและเก็บกระดาน SUP สูบลม
  description: คู่มือการดูแลรักษาทีละขั้นตอนเพื่อยืดอายุการใช้งานของกระดาน SUP สูบลมให้ยาวนานที่สุด
  tldr: ล้างด้วยน้ำจืดหลังใช้ทุกครั้ง ตากให้แห้งสนิทก่อนเก็บ รีดอากาศแล้วม้วนแบบหลวม ๆ (ไม่ต้องแน่นแบบทหาร) เก็บในที่เย็นและแห้งพ้นแสงแดดโดยตรง และตรวจสอบรอยต่อทุกเดือน
  problem: การเก็บรักษาและทำความสะอาดที่ผิดวิธีเป็นสาเหตุอันดับต้นของการเสียหายก่อนเวลาอันควรของกระดาน SUP สูบลม ทั้งเชื้อรา ความเสียหายจาก UV และการหลุดลอกของรอยต่อ
  solution: ทำกิจวัตรหลังเล่นทุกครั้งอย่างสม่ำเสมอ ล้าง ตาก ตรวจสอบ รีดอากาศ แล้วเก็บ ใช้สบู่อ่อนกับคราบฝังแน่น ห้ามเก็บกระดานแบบเปียกหรือวางกลางแสงแดดโดยตรงเด็ดขาด
  audience: เจ้าของกระดาน SUP สูบลมทุกคนที่อยากให้กระดานอยู่กับตัว 5+ ปี
  steps:
    - ล้างกระดานด้วยน้ำจืดทันทีหลังใช้งาน โดยเฉพาะหลังจากน้ำเค็ม
    - ทำความสะอาดด้วยสบู่อ่อนและฟองนุ่ม หลีกเลี่ยงสารเคมีกัดกร่อนหรือเครื่องฉีดล้างแรงดันสูง
    - ตากกระดานให้แห้งสนิท เปิดวาล์วเพื่อระบายน้ำที่ค้างอยู่ข้างใน
    - ตรวจหาความเสียหาย ดูรอยต่อ วาล์ว และผิวกระดานว่ามีรอยทิ่มแทงหรือไม่
    - รีดอากาศออกให้หมด ถอดแกนวาล์วเพื่อรีดอากาศให้หมดจด
    - ม้วนกระดานแบบหลวม ๆ เริ่มจากหัวกระดาน หลีกเลี่ยงรอยพับที่แน่นกระชับ
    - เก็บในถุงสะพายที่แถมมาในที่เย็นและแห้ง พ้นแสงแดดโดยตรง
  faq:
    - q: ปล่อยกระดาน SUP สูบลมทิ้งไว้ทั้งฤดูได้ไหม?
      a: ได้ แต่เก็บพ้นแสงแดดโดยตรงเมื่อไม่ได้ใช้ แนะนำให้รีดอากาศออกบางส่วน (8-10 PSI) สำหรับการเก็บรักษาในระยะยาว
    - q: ซ่อมรอยทิ่มแทงบนกระดานอย่างไร?
      a: ทำความสะอาดบริเวณนั้น ตัดแผ่นแปะมุมมน ทากาว กดให้แน่น แล้วรอ 24 ชั่วโมงก่อนสูบลม กระดาน afarer แถมชุดซ่อมแซมมาให้
    - q: ควรตรวจสอบวาล์วบ่อยแค่ไหน?
      a: ทุกเดือน วาล์วเป็นจุดเสียหายที่พบบ่อยที่สุด ตรวจว่าเข็มวาล์วขยับได้อย่างอิสระและ O-ring ยังอยู่ครบถ้วน

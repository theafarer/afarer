- slug: inflatable-repair
  category: maintenance
  title: วิธีซ่อมกระดาน SUP สูบลม
  description: คู่มือทีละขั้นตอนสำหรับซ่อมรอยทิ่มแทง ปัญหาวาล์ว และความเสียหายรอยต่อบนกระดาน SUP สูบลม
  tldr: รอยทิ่มขนาดเล็ก (เล็กกว่า 1/4 นิ้ว) ซ่อมได้ด้วยชุดแผ่นแปะที่แถมมา ทำความสะอาดบริเวณนั้น ทากาว PVC กดแผ่นแปะให้แน่น แล้วรอ 24 ชั่วโมง วาล์วรั่วส่วนใหญ่ต้องเปลี่ยน O-ring ส่วนรอยฉีกใหญ่หรือการหลุดลอกของรอยต่อต้องส่งช่างมืออาชีพ
  problem: รอยทิ่มเล็กและปัญหาวาล์วพบบ่อยแต่ซ่อมง่าย ถ้าไม่มีเทคนิคการซ่อมที่ถูกวิธี ผู้ใช้มักเสียเงินจ้างช่างแพงเกินไปหรือทำความเสียหายให้หนักขึ้น
  solution: ระบุชนิดความเสียหายให้ได้ว่าเป็นรอยทิ่ม วาล์วรั่ว หรือปัญหารอยต่อ แล้วใช้วิธีซ่อมที่เหมาะสม งานซ่อมส่วนใหญ่ใช้เวลา 30 นาทีบวกระยะเวลารอให้กาวแห้งสนิท
  audience: เจ้าของกระดาน SUP สูบลมที่อยากจัดการงานซ่อมพื้นฐานด้วยตัวเอง
  steps:
    - หาจุดรั่ว สูบลมให้เต็มที่ ฟังเสียงลมรั่ว ใช้มือคลำหา หรือใช้น้ำผสมสบู่
    - ทำเครื่องหมายจุดรั่วด้วยปากกาหรือเทปกาว
    - ทำความสะอาดบริเวณรอบจุดรั่วด้วยแอลกอฮอล์ไอโซโพรพิล ให้กว้างอย่างน้อย 2 นิ้วรอบจุดเสียหาย
    - ขัดผิวให้ขรุขระด้วยกระดาษทรายละเอียดเพื่อให้กาวยึดเกาะได้ดีขึ้น
    - ทากาว PVC ทั้งบนแผ่นแปะและผิวกระดาน
    - รอ 5 นาทีให้กาวเริ่มหนืดตัว
    - กดแผ่นแปะให้แน่น รีดไล่ฟองอากาศออกด้วยลูกกลิ้งหรือบัตรเครดิต
    - ทิ้งไว้ให้กาวแห้งสนิท 24 ชั่วโมงก่อนสูบลมด้วยแรงดันเต็ม
  faq:
    - q: ซ่อมรอยทิ่มระหว่างอยู่บนน้ำได้ไหม?
      a: การซ่อมฉุกเฉินด้วยแผ่นแปะและเทปกาวพาคุณกลับถึงฝั่งได้ การซ่อมเต็มรูปแบบต้องทำในสภาพแห้งและรอให้กาวแห้งสนิท 24 ชั่วโมง
    - q: แก้วาล์วรั่วอย่างไร?
      a: ถอดแกนวาล์วด้วยเครื่องมือที่แถมมา ตรวจดู O-ring ว่าเสียหายหรือไม่ เปลี่ยนใหม่ถ้าจำเป็น แล้วขันแกนวาล์วกลับเข้าไปให้แน่น
    - q: ควรใช้กาวชนิดไหนซ่อม PVC?
      a: ใช้กาวเฉพาะสำหรับ PVC เช่น HH-66 หรือ Clifton กาวซุปเปอร์กาวทั่วไปยึดเกาะกับวัสดุ PVC สูบลมได้ไม่ดี

- slug: sup-for-whitewater
  category: buying-guide
  title: คู่มือ SUP ล่องแก่ง คู่มือซื้อกระดานสูบลมสำหรับล่องแก่งตามลำน้ำ
  description: วิธีเลือกกระดาน SUP สำหรับล่องแก่งตามลำน้ำ ทั้งกระดานสั้นกว่า โครงสร้างเสริมแรง อุปกรณ์ความปลอดภัย และเทคนิคการพายสำหรับแก่งระดับ I-III
  tldr: กระดาน SUP ล่องแก่งต้องการความยาวสั้นกว่า (8-10 ฟุต) ขอบกระดานเสริมแรง ค่า PSI สูงกว่า (15 ขึ้นไป) และช่องอากาศหลายช่องเพื่อความปลอดภัย ใช้ leash แบบตรงสำหรับแม่น้ำ (ไม่ใช่แบบขด) สวมหมวกกันน็อกและ PFD และพายกับเพื่อนคู่หูเสมอ เริ่มที่แก่งระดับ I ก่อนไปลองแก่งที่ยากกว่า
  problem: การเอา SUP All-Around มาตรฐานลงน้ำไหลเป็นเรื่องอันตราย กระดานมาตรฐานขาดความคล่องตัว ความทนแรงกระแทก และคุณสมบัติความปลอดภัยที่แม่น้ำต้องการ
  solution: เลือกกระดาน SUP ล่องแก่งที่สร้างเฉพาะงาน สั้นเพื่อความคล่องตัว โครงสร้างเสริมแรงรับการกระแทกหิน และดีไซน์หลายช่องอากาศเพื่อความปลอดภัย
  audience: นักพายที่มีประสบการณ์ซึ่งกำลังเปลี่ยนมาสู่การล่องแก่งตามลำน้ำ
  steps:
    - เลือกกระดานยาว 8-10 ฟุตเพื่อความคล่องตัวสูงสุดกลางแก่ง
    - มองหาโครงสร้างขอบกระดานเสริมแรงและ PVC เกรดทหาร
    - เลือกกระดานที่มีช่องอากาศ 2 ช่องขึ้นไปเพื่อเป็นสำรองเมื่อถูกทิ่มแทง
    - ใช้ leash แบบตรงสำหรับแม่น้ำที่ติดกับเข็มขัดปลดเร็ว
    - สวมหมวกกันน็อก PFD และรองเท้าสำหรับล่องน้ำที่เหมาะสม
    - เริ่มที่แก่งระดับ I แล้วค่อยพัฒนาขึ้นไปพร้อมคู่หูที่ชำนาญ
  faq:
    - q: ใช้ SUP ปกติล่องแก่งได้ไหม?
      a: ไม่แนะนำ SUP มาตรฐานขาดความทนแรงกระแทกและอาจหลุดลอกเมื่อกระทบหิน ความปลอดภัยแบบหลายช่องอากาศจำเป็นอย่างยิ่งในสภาพแวดล้อมแม่น้ำ
    - q: SUP ล่องแก่งควรใช้ค่า PSI เท่าไหร่?
      a: 15 PSI ขึ้นไปเพื่อความแข็งแรงสูงสุด กระดานแข็งกว่าเด้งออกจากหินได้ดีกว่ากระดานที่สูบลมไม่พอซึ่งจะห่อรอบสิ่งกีดขวาง
    - q: ต้องมีทักษะพายพิเศษสำหรับ SUP ล่องแก่งไหม?
      a: ต้อง การอ่านน้ำ การเลี้ยวเข้าน้ำวน การข้ามกระแส และการทรงตัวด้วยพายเป็นทักษะที่จำเป็น เข้าคอร์สอบรม SUP ล่องแก่งก่อนไปลองแก่งระดับ II ขึ้นไป

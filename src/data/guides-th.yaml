- slug: sup-fishing
  category: lifestyle
  title: คู่มือตกปลาบนกระดาน SUP วิธีตกปลาจากกระดานพาย
  description: ทุกสิ่งที่ควรรู้เกี่ยวกับการตกปลาจากกระดานพาย ตั้งแต่การจัดอุปกรณ์ เคล็ดลับความมั่นคง ไปจนถึงเทคนิคการตกปลา
  tldr: การตกปลาบน SUP ให้การเข้าใกล้แบบเงียบ ๆ เข้าถึงน้ำตื้น และเหวี่ยงเบ็ดได้รอบทิศ 360 องศา ใช้กระดานนิ่งแบบกว้าง (34 นิ้วขึ้นไป) ติดตั้งที่เสียบคันเบ็ด และใช้กล่องแช่เย็นหรือตะกร้าเป็นดาดฟ้าวางอุปกรณ์ ทอดสมอเมื่อลมแรง และสวม PFD เสมอ
  problem: เรือตกปลาทั่วไปค่าดูแลรักษาแพงและเข้าถึงน้ำตื้นไม่ได้ การตกปลาบน SUP แก้ปัญหานี้ด้วยแพลตฟอร์มตกปลาแบบพกพาที่เข้าถึงน้ำตื้นได้ แต่ต้องดัดแปลงอุปกรณ์ให้เหมาะกับการใช้งาน
  solution: ติดตั้งที่เสียบคันเบ็ด ตะกร้าอุปกรณ์ และระบบสมอบน SUP ที่นิ่ง ใช้ความพกพาของกระดานไปให้ถึงจุดตกปลาห่างไกลที่เรือเข้าไม่ถึง
  audience: นักตกปลาที่อยากตกน้ำตื้น ทำเลห่างไกล หรือชอบแพลตฟอร์มตกปลาแบบเบาและพกพาสะดวก
  steps:
    - เลือกกระดานกว้าง (34 นิ้วขึ้นไป) ที่รับน้ำหนักได้มากพอสำหรับอุปกรณ์
    - ติดตั้งที่เสียบคันเบ็ดบนดาดฟ้าด้วยระบบรางยึดหรือระบบสายรัด
    - ใช้ตะกร้ากันน้ำหรือกล่องแช่เย็นที่รัดไว้กับดาดฟ้าหน้าสำหรับใส่เครื่องตกปลา
    - พกสมอเล็กหรือเสาปักยึดไว้ใช้เมื่อลมแรง
    - สวม PFD ที่มีกระเป๋าใส่เครื่องมือและโทรศัพท์
    - ฝึกเหวี่ยงเบ็ดจากท่าคุกเข่าก่อนยืนตก
  faq:
    - q: ยืนตกปลาบน SUP ได้ไหม?
      a: ได้ กระดานกว้าง 34 นิ้วขึ้นไปให้ความมั่นคงพอสำหรับยืนและเหวี่ยงเบ็ด ฝึกในน้ำนิ่งก่อนเป็นอันดับแรก
    - q: ตกปลาชนิดไหนได้บ้างจาก SUP?
      a: SUP เหมาะมากสำหรับปลาบาสในทะเลสาบ ปลาเรดฟิชในพื้นที่น้ำตื้นราบ ปลาเทราต์ในแม่น้ำ และปลาน้ำกร่อยตามอ่าวกับปากแม่น้ำ
    - q: ชักปลาขึ้นจาก SUP อย่างไร?
      a: คุกเข่าลงเพื่อความมั่นคง ใช้สวิงหรือที่หนีบปากปลา กุมปลาไว้ต่ำ ๆ เพื่อไม่ให้หล่นลงน้ำ แล้วปล่อยหรือเก็บใส่กล่องแช่เย็น

- slug: sup-weight-capacity
  category: buying-guide
  title: คู่มือความจุน้ำหนัก SUP กระดาน SUP รับน้ำหนักได้เท่าไหร่?
  description: ทำความเข้าใจขีดจำกัดความจุน้ำหนักของ SUP วิธีคำนวณน้ำหนักบรรทุกรวม และเหตุผลที่การเกินขีดจำกัดกระทบทั้งประสิทธิภาพและความปลอดภัย
  tldr: อย่าเกิน 80% ของความจุน้ำหนักสูงสุดของกระดานด้วยน้ำหนักตัวบวกอุปกรณ์เด็ดขาด กระดานความจุ 220 ปอนด์เหมาะกับผู้พายหนัก 160 ปอนด์ที่พกอุปกรณ์เบา ๆ การเกินขีดจำกัดทำให้โผล่-ดิ่งเป็นจังหวะ ควบคุมซ้ายขวาเชื่องช้า และเสี่ยงความเสียหายมากขึ้น
  problem: นักพายมักบรรทุกเกินความจุน้ำหนักของกระดาน ทำให้ประสิทธิภาพแย่ กระดานจม และอาจเสียหาย ผู้ผลิตระบุเพียงค่าสูงสุดแต่ไม่อธิบายน้ำหนักใช้งานที่ปลอดภัย
  solution: คำนวณน้ำหนักบรรทุกรวม (น้ำหนักตัว + อุปกรณ์ + น้ำที่ซึมเข้าเนื้อกระดาน) แล้วอยู่ต่ำกว่า 80% ของความจุสูงสุดที่ระบุ ผู้พายตัวหนักต้องการกระดานปริมาตรสูงที่รับได้ตั้งแต่ 300 ปอนด์ขึ้นไป
  audience: นักพายทุกขนาด โดยเฉพาะผู้พายตัวใหญ่และผู้ที่พกอุปกรณ์เดินทางไกล
  steps:
    - หาค่าความจุน้ำหนักสูงสุดที่พิมพ์บนกระดาน (ปกติอยู่ใกล้วาล์ว)
    - ชั่งน้ำหนักตัวและอุปกรณ์ทั้งหมด รวมคานพาย PFD ถุงกันน้ำ กล่องแช่เย็น และของใช้ประกอบ
    - คำนวณโดยเอาน้ำหนักบรรทุกรวมหารด้วยความจุสูงสุดแล้วคูณ 100 จะได้เปอร์เซ็นต์ของความจุที่ใช้ไป
    - ตั้งเป้าที่ 70-80% เพื่อประสิทธิภาพและความปลอดภัยที่ดีที่สุด
    - ถ้าเกิน 80% ให้เลือกกระดานที่ใหญ่กว่าหรือลดอุปกรณ์
  faq:
    - q: เกินขีดจำกัดน้ำหนักแล้วจะเกิดอะไรขึ้น?
      a: กระดานจะลอยต่ำลงจนเกิดแรงต้านมากขึ้น ความมั่นคงลดลง หัวกระดานอาจจมดิ่ง และแกน drop-stitch เสี่ยงเสียหายสูงขึ้นเมื่อเจอคลื่นลม
    - q: นั่งกระดาน SUP หนึ่งลำสองคนได้ไหม?
      a: ได้เฉพาะเมื่อน้ำหนักรวมต่ำกว่า 80% ของความจุ SUP มาตรฐานส่วนใหญ่ออกแบบมาสำหรับผู้พายคนเดียว การขี่ด้วยกันสองคนต้องใช้กระดานที่ระบุชัดว่ารองรับสองคน
    - q: กระดาน SUP สูบลมรับน้ำหนักได้น้อยกว่ากระดานแข็งไหม?
      a: กระดานสูบลมคุณภาพดีที่ใช้โครงสร้าง drop-stitch รับน้ำหนักได้เทียบเท่าหรือมากกว่ากระดานแข็ง เพราะการกระจายปริมาตรที่หนากว่า

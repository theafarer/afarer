- slug: sup-storage-winter-care
  category: maintenance
  title: การเก็บรักษา SUP และการดูแลช่วงหน้าหนาว ยืดอายุการใช้งานของกระดาน
  description: วิธีเก็บรักษา ทำความสะอาด และเตรียมกระดาน SUP สูบลมให้พ้นหน้าหนาวอย่างถูกวิธี หลีกเลี่ยงเชื้อรา ความเสียหายจาก UV และการเสื่อมสภาพของวัสดุด้วยการดูแลที่ถูกต้อง
  tldr: ล้างด้วยน้ำจืดหลังใช้ทุกครั้ง ตากให้แห้งสนิทก่อนเก็บ รีดอากาศแล้วเก็บในที่เย็นมืดพ้นแสงแดดโดยตรงและอุณหภูมิสุดขั้ว ห้ามเก็บแบบสูบลมอัดไว้หรือวางในรถที่ร้อนจัดเด็ดขาด และทาสารป้องกัน UV เป็นระยะ
  problem: การเก็บรักษาที่ผิดวิธีเป็นสาเหตุอันดับหนึ่งที่ทำให้ SUP เสียหายก่อนเวลาอันควร ทั้งเชื้อรา วัสดุเสื่อมสภาพ การหลุดลอกเป็นชั้น และความเสียหายของวาล์วจากความร้อนหรือความเย็น
  solution: ทำกิจวัตรดูแล 3 ขั้นอย่างเคร่งครัด คือล้างหลังเล่นทุกเซสชัน ตากให้แห้งสนิทก่อนเก็บ และเก็บแบบรีดอากาศในสภาพแวดล้อมที่ควบคุมอุณหภูมิระหว่าง 50-80°F (10-27°C)
  audience: เจ้าของ SUP ทุกคนที่อยากให้กระดานอยู่กับตัวยาวนานกว่า 5 ปี
  steps:
    - ล้างกระดาน คานพาย และปั๊มลมด้วยน้ำจืดหลังทุกเซสชันที่ลงน้ำเค็มหรือน้ำขุ่น
    - ทำความสะอาดด้วยสบู่อ่อนและฟองนุ่ม ห้ามใช้สารเคมีกัดกร่อนหรือเครื่องฉีดล้างแรงดันสูงเด็ดขาด
    - ตากกระดานให้แห้งสนิทกลางแจ้งก่อนรีดอากาศ (เปิดวาล์วให้ความชื้นข้างในระบายออก)
    - รีดอากาศออกให้หมด ม้วนจากหัวกระดานไปทางท้ายเพื่อไล่อากาศที่ค้างอยู่
    - เช็ดถุงสะพายให้แห้งก่อนใส่กระดานเก็บ
    - เก็บในตู้เย็นมืดหรือที่เก็บใต้เตียง ห้ามวางกลางแสงแดด ในรถที่ร้อนจัด หรือในโรงเก็บของที่เย็นจัดเด็ดขาด
  faq:
    - q: ทิ้ง SUP สูบลมไว้ทั้งฤดูได้ไหม?
      a: ควรรีดอากาศออกถ้าไม่ได้ใช้เป็นเวลานาน ความดัน PSI ต่อเนื่องเร่งการเหนื่อยล้าของวัสดุ ถ้าเก็บนานเกิน 2 สัปดาห์ให้รีดอากาศระหว่างเซสชัน
    - q: ขจัดเชื้อราบน SUP อย่างไร?
      a: ผสมสบู่อ่อนกับน้ำอุ่นและน้ำส้มสายชูเล็กน้อย ขัดเบา ๆ ด้วยแปรงขนนุ่ม ล้างให้สะอาดหมดจดแล้วตากในที่ร่ม หลีกเลี่ยงน้ำยาฟอกขาวเพราะทำลาย PVC
    - q: เก็บ SUP ไว้ในโรงจอดรถได้ไหม?
      a: ได้เฉพาะเมื่อโรงจอดรถคงอุณหภูมิระหว่าง 50-80°F ตลอดปี ใต้หลังคาและโรงจอดรถที่ไม่มีเครื่องปรับอากาศมีอุณหภูมิสุดขั้วที่ทำลายแกน drop-stitch

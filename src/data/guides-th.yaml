- slug: sup-size-guide
  category: buying-guide
  title: คู่มือขนาด SUP วิธีเลือกขนาดกระดานที่เหมาะกับคุณ
  description: คู่มือขนาด SUP ฉบับสมบูรณ์ครอบคลุมความยาว ความกว้าง และความหนาที่แนะนำตามน้ำหนัก ความสูง ระดับทักษะ และสไตล์การพายของคุณ
  tldr: ผู้เริ่มต้นต้องการกระดานกว้างกว่า (32-34 นิ้ว) เพื่อความมั่นคง ผู้พายตัวใหญ่ต้องการกระดานยาวกว่า (11 ฟุตขึ้นไป) ที่มีปริมาตรสูง การทัวริ่งต้องการลำเรือยาวกว่า (12 ฟุตขึ้นไป) โยคะต้องการความกว้างพิเศษ (34 นิ้วขึ้นไป) และตรวจสอบความจุน้ำหนักเสมอ น้ำหนักตัวบวกอุปกรณ์ไม่ควรเกิน 80% ของค่าที่กำหนด
  problem: การเลือกขนาด SUP ผิดทำให้ทรงตัวยาก พายตรงช้า และประสบการณ์การพายน่าหงุดหงิด ผู้ซื้อครั้งแรกส่วนใหญ่เลือกกระดานจากหน้าตาโดยไม่คิดว่าขนาดส่งผลต่อประสิทธิภาพอย่างไร
  solution: จับคู่ความยาว ความกว้าง และความหนาของกระดานกับน้ำหนัก ระดับทักษะ และการใช้งานหลักของคุณ ใช้เครื่องคำนวณขนาดของเราโดยเอาน้ำหนักตัวบวกน้ำหนักอุปกรณ์ แล้วเลือกกระดานที่รับได้เกินผลรวมนั้นอย่างน้อย 20%
  audience: ผู้ซื้อ SUP ครั้งแรก นักพายที่อัปเกรดไปสู่กระดานเฉพาะทาง และทุกคนที่ยังไม่แน่ใจเรื่องขนาด
  steps:
    - ชั่งน้ำหนักตัวพร้อมอุปกรณ์ทั้งหมดที่พก (คานพาย PFD ถุงกันน้ำ)
    - บวกส่วนเผื่อความปลอดภัย 20% เพื่อหาค่าความจุน้ำหนักขั้นต่ำ
    - เลือกความกว้างตามระดับทักษะ 32-34 นิ้วสำหรับผู้เริ่มต้น 30-32 นิ้วสำหรับระดับกลาง 28-30 นิ้วสำหรับระดับสูง
    - เลือกความยาวตามการใช้งาน 10 ฟุต 6 นิ้วถึง 11 ฟุต 6 นิ้วสำหรับ All-Around 12-14 ฟุตสำหรับทัวริ่ง 9-10 ฟุตสำหรับล่องแก่ง
    - ตรวจสอบความหนา 6 นิ้วเป็นมาตรฐาน 4 นิ้วเน้นประสิทธิภาพ 5 นิ้วสำหรับ All-Around
    - เช็กช่วงค่า PSI ที่แนะนำของกระดานเพื่อความแข็งแรงที่ดีที่สุด
  faq:
    - q: ความกว้างเท่าไหร่เหมาะกับผู้เริ่มต้นที่สุด?
      a: กว้าง 32-34 นิ้วให้ความมั่นคงมากที่สุด ยิ่งกระดานกว้างยิ่งทรงตัวง่าย โดยเฉพาะสำหรับผู้พายตัวใหญ่
    - q: รู้ได้อย่างไรว่ากระดานเล็กเกินไปสำหรับเรา?
      a: ถ้ากระดานลอยต่ำกว่าระดับปกติ ควบคุมซ้ายขวาเชื่องช้า หรือหัวกระดานจมดิ่งง่ายเวลาพาย กระดานนั้นน่าจะเล็กเกินไปสำหรับน้ำหนักของคุณ
    - q: ความยาวกระดานมีผลต่อความเร็วไหม?
      a: มี แนวสายน้ำที่ยาวกว่าเพิ่มความเร็วทางทฤษฎีของท้องเรือ กระดานทัวริ่ง 14 ฟุตเร็วกว่ากระดาน All-Around 10 ฟุตอย่างชัดเจนด้วยแรงพายเท่ากัน

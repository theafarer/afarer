- slug: sup-travel-transport
  category: planning
  title: คู่มือเดินทางกับ SUP การบินและโรดทริปกับกระดาน SUP สูบลม
  description: วิธีเดินทางไปพร้อมกระดาน SUP สูบลมทั้งทางเครื่องบิน รถยนต์ หรือรถบ้าน เคล็ดลับเรื่องค่าธรรมเนียมสายการบิน การบรรจุ การสูบลมที่ปลายทาง และสิ่งที่ต้องพิจารณาสำหรับการเดินทางระหว่างประเทศ
  tldr: รีดอากาศ ม้วน แล้วใส่ SUP ในถุงสะพายของมัน สายการบินส่วนใหญ่รับเป็นสัมภาระส่งท้ายเครื่อง (ต่ำกว่า 50 ปอนด์ / 50 นิ้วรวมสามด้าน) ใส่ปั๊มลมและคานพายในถุงเดียวกันเสมอ ไปให้ถึงก่อนเวลาเผื่อเจ้าหน้าที่ต้องตรวจขนาดถุง พิจารณาส่งของล่วงหน้าสำหรับทริปยาว
  problem: การเดินทางไปพร้อม SUP ดูเหมือนยุ่งยาก ทั้งข้อจำกัดขนาดของสายการบิน ข้อกังวลเรื่อง TSA และการหาวิธีสูบลมที่ปลายทางห่างไกล จนเกิดความไม่แน่นอน
  solution: ถุงสะพาย SUP ของ afarer ออกแบบให้อยู่ในข้อจำกัดสัมภาระส่งท้ายเครื่องของสายการบิน บรรจุของอย่างมีกลยุทธ์ พกชุดซ่อมแซม และศึกษาจุดสูบลม (ท่าเรือ แคมป์กราวด์ที่มีจุดจ่ายไฟ) ก่อนออกเดินทาง
  audience: นักพายที่วางแผนเดินทางกับ SUP ทางเครื่องบิน รถยนต์ หรือรถบ้าน
  steps:
    - รีดอากาศออกให้หมดแล้วม้วนกระดานจากหัวไปท้าย
    - ใส่กระดานที่ม้วนแล้ว ปั๊มลม คานพาย leash และครีบลงในถุงสะพาย
    - เช็กข้อจำกัดขนาดและน้ำหนักของสายการบิน ส่วนใหญ่อนุญาต 62 นิ้วรวมสามด้านและ 50 ปอนด์
    - ไปให้ถึงสนามบินก่อนเวลาและเตรียมใจว่าถุงอาจถูกตรวจด้วยมือ
    - พกชุดซ่อมแซมในสัมภาระขึ้นห้องเครื่องเผื่อกระดานเสียหายระหว่างขนส่ง
    - ศึกษาทางเลือกสูบลม ที่จุดจ่ายไฟในแคมป์กราวด์สำหรับปั๊มไฟฟ้า หรือจุดสูบลมที่ท่าเรือ
  faq:
    - q: สายการบินจะรับถุงสะพาย SUP เป็นสัมภาระไหม?
      a: สายการบินสหรัฐฯ และยุโรปส่วนใหญ่รับถุงสะพาย SUP เป็นสัมภาระส่งท้ายเครื่องมาตรฐานถ้าต่ำกว่า 50 ปอนด์และ 62 นิ้วรวมสามด้าน สายการบินราคาประหยัดอาจเก็บค่าธรรมเนียมสัมภาระขนาดใหญ่
    - q: หิ้ว SUP ขึ้นห้องเครื่องได้ไหม?
      a: ไม่ได้ ถุงสะพาย SUP ใหญ่เกินขนาดสัมภาระขึ้นห้องเครื่องของทุกสายการบิน ต้องเช็กไว้ท้ายเครื่องเสมอ
    - q: สูบลม SUP ที่ปลายทางห่างไกลอย่างไร?
      a: ปั๊มมือที่แถมมาใช้ได้ทุกที่โดยไม่ต้องมีไฟ เพื่อความสะดวกให้พาปั๊มไฟฟ้าพกพาและมองหาแคมป์กราวด์ที่มีจุดจ่ายไฟหรือท่าเรือที่มีจุดสูบลม

- slug: understanding-specs
  category: technical
  title: วิธีอ่านสเปกกระดาน SUP
  description: คู่มือทางเทคนิคสำหรับทำความเข้าใจสเปกกระดาน SUP ทั้งปริมาตร ขนาด โครงสร้าง และความหมายต่อประสิทธิภาพ
  tldr: สเปกหลักประกอบด้วย ปริมาตร (ลิตร) กำหนดแรงลอยตัวและความจุน้ำหนัก ความกว้างกำหนดความเสถียร ความยาวกำหนดการรักษาทิศทางและความเร็ว ความหนากำหนดความแข็งแรง และค่า PSI กำหนดแรงดันสูบลมเพื่อประสิทธิภาพสูงสุด
  problem: เอกสารสเปกผลิตภัณฑ์ระบุตัวเลขโดยไม่มีบริบท ทำให้ผู้ซื้อไม่แน่ใจว่าสเปกใดสำคัญจริงต่อการใช้งานของตน
  solution: แปลสเปกแต่ละข้อมาเป็นประสิทธิภาพจริง ปริมาตรคือแรงลอยตัว ความกว้างคือความเสถียร ความยาวคือการร่อนไปข้างหน้า ความหนาคือความแข็งแรง และโครงสร้างคือความทนทาน
  audience: ผู้พายระดับกลางและผู้ซื้อสายเทคนิคที่ต้องการตัดสินใจจากข้อมูล
  steps:
    - ดูปริมาตร (ลิตร) น้ำหนักตัวของคุณบวกอุปกรณ์ไม่ควรเกิน 80% ของค่าปริมาตรกระดาน
    - ดูความกว้าง กว้างกว่า (32-34 นิ้ว) เสถียรกว่า แคบกว่า (28-30 นิ้ว) เร็วกว่า
    - ดูความยาว ยาวกว่า (12-14 ฟุต) รักษาทิศทางได้ดีกว่า สั้นกว่า (10-11 ฟุต) คล่องตัวกว่า
    - ดูความหนา 6 นิ้วเป็นมาตรฐาน 8 นิ้วให้ความแข็งแรงและความจุน้ำหนักมากกว่า
    - ดูค่า PSI สูบลมให้ถึงค่า PSI สูงสุดที่กำหนดไว้เพื่อความแข็งแรงสูงสุด
    - ดูวัสดุโครงสร้าง ความหนาแน่นของ drop-stitch ชั้น PVC และการเสริมความแข็งแรงขอบกระดาน
  faq:
    - q: drop-stitch หมายถึงอะไร?
      a: drop-stitch คือวิธีก่อสร้างที่เส้นใยหลายพันเส้นเชื่อมชั้นบนและชั้นล่างของกระดานเข้าด้วยกัน ทำให้สูบลมด้วยแรงดันสูงได้ (12-15 PSI) เพื่อความแข็งแรงสูงสุด
    - q: อัตราส่วนน้ำหนักต่อปริมาตรที่เหมาะสมคือเท่าไหร่?
      a: เป้าหมายที่ดีคือประมาณ 5-6 ปอนด์ของน้ำหนักผู้พายต่อปริมาตรกระดาน 1 ลิตร ผู้พายหนัก 220 ปอนด์ควรมองหากระดานที่มีปริมาตร 180+ ลิตร
    - q: น้ำหนักกระดานสำคัญไหม?
      a: สำคัญ กระดานเบากว่า (ต่ำกว่า 20 ปอนด์) หิ้วและขนส่งง่ายกว่า กระดานหนักกว่า (25+ ปอนด์) มักสื่อถึงโครงสร้าง PVC หลายชั้นที่ทนทานกว่า

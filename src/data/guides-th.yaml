- slug: paddling-techniques
  category: tutorial
  title: เทคนิคการพาย SUP ที่จำเป็น
  description: ฝึกให้คล่องจังหวะพายหน้า จังหวะกวาด และการเลี้ยวแบบ cross-bow เพื่อพายอย่างมีประสิทธิภาพในทุกสภาพน้ำ
  tldr: จังหวะพายหน้าใช้กล้ามเนื้อแกนกลางลำตัว ไม่ใช่แขน จังหวะกวาดใช้เลี้ยวกระดาน การเลี้ยวแบบ cross-bow คือการหมุนตัวที่มีประสิทธิภาพที่สุด ถือคานพายให้ตั้งฉากและจุ่มใบพายให้มิดเพื่อส่งกำลังได้มากที่สุด
  problem: ผู้พายส่วนใหญ่ใช้จังหวะพายที่อาศัยแขนเป็นหลัก ซึ่งเปลืองพลังงานและทำให้ไหล่ล้า เทคนิคที่ไม่ดียังทำให้ควบคุมกระดานได้ยากเมื่อเจอลมและคลื่นลม
  solution: เรียนรู้จังหวะพายที่จำเป็นสามแบบ คือพายหน้า กวาด และเลี้ยว cross-bow ด้วยกลไกการเคลื่อนไหวของร่างกายที่ถูกต้อง ฝึกแต่ละแบบในน้ำนิ่งก่อนไปท้าทายสภาพน้ำที่ยากขึ้น
  audience: ผู้พายที่อยากพายได้นานขึ้น เร็วขึ้น และเหนื่อยน้อยลง
  steps:
    - จังหวะพายหน้า เอื้อมไปข้างหน้า กดใบพายให้มิด ดึงกลับโดยหมุนลำตัว (ไม่ใช่แขน) ยกคานพายออกที่ระดับข้อเท้า
    - จังหวะกวาด เอื้อมไปข้างหน้าตามขอบกระดาน กวาดใบพายเป็นส่วนโค้งกว้างไปทางท้ายกระดาน เพื่อเลี้ยวกระดานออกไปจากฝั่งที่ถือพาย
    - การเลี้ยวแบบ cross-bow วางคานพายไปอีกฝั่งของกระดานโดยไม่ต้องสลับมือ แล้วดึงไปทางท้ายกระดาน
    - การทรงตัวด้วยพาย ใช้ท่าทรงตัวระดับต่ำเพื่อความเสถียรในคลื่นลม โดยตบใบพายแนบราบกับผิวน้ำ
    - จังหวะพายดึงข้าง เอื้อมออกข้างตัว ดึงกระดานให้เคลื่อนที่ในแนวข้างเข้าหาคานพาย
  faq:
    - q: พายให้ตรงทางอย่างไร?
      a: ใช้ความยาวจังหวะเท่ากันทั้งสองข้าง สลับข้างทุก 5-10 จังหวะ มองจุดนิ่งบนขอบฟ้าเป็นจุดอ้างอิง
    - q: ควรงอเข่าไหม?
      a: ควร งอเข่าเล็กน้อยไว้เหมือนโช้กอัพ เข่าที่แข็งล็อกตัวจะส่งแรงสั่นจากคลื่นเล็ก ๆ ทุกลูกเข้ากล้ามเนื้อแกนกลางลำตัวและลดความเสถียร
    - q: พายสวนลมอย่างไร?
      a: ยืนต่ำลง ใช้จังหวะสั้นและถี่ขึ้น และอยู่ใกล้ฝั่งมากขึ้นเพราะลมมักอ่อนกว่าใกล้ฝั่ง ถ้าลมแรงเกินไปอย่าลงน้ำ

- slug: choosing-paddle
  category: buying-guide
  title: วิธีเลือกคานพาย SUP ที่เหมาะกับคุณ
  description: คู่มือวัสดุคานพาย รูปทรงใบพาย ชนิดด้าม และการเลือกขนาดสำหรับ SUP
  tldr: ความยาวคานพาย SUP ควรยาวกว่าความสูงของคุณ 6-8 นิ้ว ใบพายแบบมีร่องกลาง (dihedral) พายตรงดี แบบแบนกินน้ำได้มากกว่า ด้ามคาร์บอนเบาที่สุด ไฟเบอร์กลาสคุ้มค่าที่สุด อะลูมิเนียมราคาประหยัดที่สุด
  problem: การใช้คานพายขนาดหรือวัสดุผิดทำให้เหนื่อยล้าโดยไม่จำเป็น จังหวะพายไม่มีประสิทธิภาพ และข้อต่อเคล็ด
  solution: จับคู่ความยาวคานพาย รูปทรงใบพาย วัสดุด้าม และความยืดหยุ่นให้เข้ากับสไตล์การพาย ขนาดร่างกาย และงบประมาณของคุณ
  audience: นักพาย SUP ที่กำลังเลือกคานพายคันแรกหรือคันถัดไป
  steps:
    - วัดความยาวคานพาย ยาวกว่าความสูงของคุณ 6-8 นิ้วสำหรับการพายทั่วไป
    - เลือกวัสดุใบพาย ไนลอนเน้นประหยัด ไฟเบอร์กลาสเน้นคุ้มค่า คาร์บอนเน้นประสิทธิภาพ
    - เลือกรูปทรงใบพาย แบบมีร่องกลาง (dihedral) เพื่อพายตรงลื่นไหล แบบแบนเพื่อพลัง ทรงช้อนเพื่อการแข่งขัน
    - เลือกชนิดด้าม ด้ามตรงสำหรับใช้งานทั่วไป ด้ามงอสำหรับ SUP แข่งขัน
    - เช็กความยืดหยุ่น ด้ามแข็งกว่าส่งพลังได้มากกว่า ด้ามยืดหยุ่นลดการเคล็ดข้อต่อ
  faq:
    - q: วัสดุคานพายที่ดีที่สุดคืออะไร?
      a: ไฟเบอร์กลาสให้สมดุลของน้ำหนัก ความทนทาน และราคาที่ดีที่สุด คาร์บอนเบากว่าแต่แพงกว่าและเปราะกว่า ไนลอนหนักแต่แทบไม่มีวันพัง
    - q: รู้ได้อย่างไรว่าคานพายยาวพอดี?
      a: ตั้งคานพายตั้งฉากข้างตัว ด้ามจับควรอยู่ระดับข้อมือเมื่อคุณยกแขนชูขึ้นเหนือหัว
    - q: ควรซื้อคานพายแบบชิ้นเดียวหรือแบบปรับความยาวได้?
      a: คานพายแบบปรับความยาวได้เหมาะกับการใช้ร่วมกันและการเดินทาง คานพายแบบชิ้นเดียวเบากว่า แข็งกว่า และมีประสิทธิภาพกว่าสำหรับการใช้งานเฉพาะตัว

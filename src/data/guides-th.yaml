- slug: sup-fitness
  category: lifestyle
  title: ฟิตเนส SUP การออกกำลังกายทั้งร่างกายบนผิวน้ำ
  description: การพายกระดานยืนสร้างความแข็งแรงของกล้ามเนื้อแกนกลางลำตัว ความสมดุล และความฟิตของระบบหัวใจและหลอดเลือดอย่างไร
  tldr: ทุกจังหวะพาย SUP ใช้กล้ามเนื้อแกนกลางลำตัว ขา หลัง และไหล่ เซสชันหนึ่งชั่วโมงเผาผลาญ 300-500 แคลอรี การพายสวนลมหรือสวนกระแสน้ำเพิ่มความหนักเป็นสองเท่า โยคะบน SUP เพิ่มความยืดหยุ่นและการทรงตัว
  problem: หลายคนมองการพายกระดานเป็นเพียงกิจกรรมผ่อนคลาย ไม่ใช่เครื่องมือออกกำลังกายที่จริงจัง จึงพลาดศักยภาพในการบริหารร่างกายทั้งหมดของมัน
  solution: ออกแบบเซสชัน SUP ตามเป้าหมายฟิตเนสเฉพาะเจาะจง พายระยะไกลเพื่อสร้างความอดทนของหัวใจ พายสลับจังหวะเร็วช้าเพื่อพลัง โยคะบน SUP เพื่อความยืดหยุ่น และพายระยะทางไกลเพื่อความอดทนของกล้ามเนื้อ
  audience: ผู้ที่รักฟิตเนสและกำลังมองหาการออกกำลังกายทั้งร่างกายแบบแรงกระทบต่ำแต่ต้องใช้ร่างกายอย่างเต็มที่
  steps:
    - วอร์มอัพบนบก หมุนแขน บิดลำตัว และแกว่งขา นาน 5 นาที
    - เริ่มด้วยการพายอย่างต่อเนื่อง 10 นาทีที่ความหนักระดับปานกลาง
    - ต่อยอดสู่การฝึกแบบอินเทอร์วัล พายหนัก 2 นาที สลับพายเบา ๆ พัก 2 นาที
    - ผสมท่าโยคะบน SUP ท่าหมาก้มหน้า ท่านักรบ 2 และท่าต้นไม้บนกระดาน
    - คูลดาวน์ด้วยการพายเบา ๆ และการยืดเหยียดแบบคงที่บนกระดาน
  faq:
    - q: ฟิตเนสด้วย SUP ดีกว่าการวิ่งไหม?
      a: SUP ให้ประโยชน์ต่อระบบหัวใจและหลอดเลือดเทียบเท่ากันแต่แรงกระทบต่อข้อต่อต่ำกว่า และยังใช้ร่างกายส่วนบนและกล้ามเนื้อแกนกลางลำตัวมากกว่าการวิ่ง
    - q: SUP เผาผลาญแคลอรีได้เท่าไหร่?
      a: ประมาณ 300-500 แคลอรีต่อชั่วโมงที่ความหนักระดับปานกลาง การแข่งขันหรือพายสวนลมเผาผลาญได้ถึง 600-800 แคลอรีต่อชั่วโมง
    - q: สร้างกล้ามเนื้อจากการพาย SUP ได้ไหม?
      a: ได้ การพายสร้างกล้ามเนื้อไหล่ หลัง และแกนกลางลำตัว การทรงตัวใช้ขาและกล้ามเนื้อประคอง นับเป็นการออกกำลังกายแบบต้านแรงทั้งร่างกาย

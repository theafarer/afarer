- slug: sup-with-kids
  category: lifestyle
  title: พาย SUP กับลูก คู่มือครอบครัวฉบับสมบูรณ์
  description: วิธีพาเด็กลงพายกระดานอย่างปลอดภัย ทั้งช่วงอายุที่เหมาะสม อุปกรณ์ และกิจกรรม
  tldr: เด็กอายุ 6 ปีขึ้นไปนั่งไปกับผู้ใหญ่บน SUP ได้ เด็กอายุ 10 ปีขึ้นไปพายกระดานของตัวเองได้ภายใต้การดูแล ใช้กระดานกว้างที่นิ่ง สวม PFD เสมอ อยู่ในน้ำตื้นสงบ และจำกัดเซสชันให้สั้น (ไม่เกิน 30-45 นาที)
  problem: พ่อแม่อยากแบ่งปันกีฬาทางน้ำให้ลูกแต่กังวลเรื่องความปลอดภัย อุปกรณ์ที่พอดีตัว และวิธีให้เด็กสนุกกับกิจกรรม
  solution: ใช้กระดานขนาดเหมาะสมสำหรับขี่ด้วยกันสองคน ดูแลให้เด็กทุกคนสวม PFD ที่พอดีตัว เริ่มในน้ำตื้นอุ่น ๆ และสร้างความสนุกด้วยเกมและเซสชันสั้น ๆ
  audience: พ่อแม่ที่อยากพาลูกเริ่มต้นสัมผัสการพายกระดาน
  steps:
    - อายุ 4-6 ปี นั่งเป็นผู้โดยสารบนกระดานของผู้ใหญ่ นั่งด้านหน้าแล้วจับหูจับกลางกระดาน
    - อายุ 6-10 ปี คุกเข่าหรือนั่งบนกระดานของตัวเองโดยมีผู้ใหญ่ดูแลและคล้อง leash
    - อายุ 10 ปีขึ้นไป พายกระดานของตัวเองโดยมีผู้ใหญ่ดูแลอยู่ใกล้ ๆ
    - สวม PFD เสมอ เด็กต้องสวมเสื้อชูชีพที่พอดีตัวตลอดเวลา
    - อยู่ในน้ำตื้น (ระดับเอวของผู้ใหญ่)
    - จำกัดเซสชันให้สั้น เด็กต่ำกว่า 10 ปีไม่ควรเกิน 30-45 นาที
    - สร้างความสนุก เล่นเกม ดูปลา ฝึกยืนบนกระดาน
  faq:
    - q: เด็กเริ่มพายคนเดียวได้ตั้งแต่อายุเท่าไหร่?
      a: ประมาณอายุ 10-12 ปีโดยมีผู้ดูแล ขึ้นกับทักษะการว่ายน้ำและความคุ้นเคยกับน้ำของเด็กแต่ละคน และต้องอยู่ในสภาพน้ำสงบตื้นเสมอ
    - q: กระดานแบบไหนเหมาะกับการพาย SUP กับเด็ก?
      a: กระดานกว้าง (34 นิ้วขึ้นไป) ที่รับน้ำหนักได้มากพอสำหรับขี่ด้วยกันสองคน SUP Explorer 11 กว้าง 33 นิ้วและรับน้ำหนัก 220 ปอนด์ ใช้ได้ดีสำหรับพ่อแม่พาลูกหนึ่งคน
    - q: เด็กต้องมีอุปกรณ์ความปลอดภัยอะไรบ้าง?
      a: เสื้อชูชีพรับรอง CE ที่พอดีตัว leash (เมื่อขี่ด้วยกันสองคนให้คล้องกับกระดานของผู้ใหญ่) ครีมกันแดด และหมวก

- slug: sup-inflation-psi-guide
  category: technical
  title: คู่มือการสูบลม SUP ค่า PSI ที่เหมาะสมเพื่อประสิทธิภาพและความปลอดภัย
  description: คู่มือฉบับสมบูรณ์เรื่องแรงดันลมของ SUP ตั้งแต่ช่วงค่า PSI ที่แนะนำ ผลของแรงดันต่อประสิทธิภาพ ไปจนถึงเคล็ดลับการใช้ปั๊มลมให้ถูกวิธี
  tldr: สูบลม 12-15 PSI สำหรับกระดาน SUP สูบลมส่วนใหญ่ แรงดันสูงกว่ายิ่งแข็งแรงแต่สูบช้ากว่า แรงดันต่ำกว่าให้ฟีลนุ่มกว่าแต่ยืดหยุ่นกว่า ห้ามเกินค่า PSI สูงสุดที่พิมพ์บนกระดานเด็ดขาด ใช้ปั๊มที่มีเกจวัดแรงดันแม่นยำ อากาศเย็นลดแรงดัน แดดร้อนเพิ่มแรงดัน
  problem: กระดานที่สูบลมไม่พอจะซ่ามือและยืดหยุ่นเกินไป กระดานที่สูบเกินเสี่ยงรอยต่อพัง นักพายหลายคนเดาค่า PSI แทนที่จะวัดให้แม่นยำ
  solution: ใช้ปั๊มที่มีเกจวัดแรงดันในตัว ตั้งเป้า 15 PSI เพื่อความแข็งแรงสูงสุด เช็กแรงดันก่อนทุกเซสชัน เพราะอุณหภูมิที่เปลี่ยนแปลงมีผลต่อ PSI อย่างมาก
  audience: เจ้าของกระดาน SUP สูบลมทุกคน
  steps:
    - เช็กช่วงค่า PSI ที่แนะนำซึ่งพิมพ์บนกระดานใกล้วาล์ว
    - ใช้ปั๊มอัดสองจังหวะสูบลมไปถึงกลางช่วงที่แนะนำ
    - สลับไปโหมดจังหวะเดียวสำหรับ 3-4 PSI สุดท้ายเพื่อควบคุมได้ละเอียดกว่า
    - เช็กแรงดันด้วยเกจ เกจแบบหน้าปัดน่าเชื่อถือกว่าแบบดิจิทัล
    - ปรับตามสภาพ PSI สูงกว่าสำหรับทัวริ่ง/แข่งขัน PSI ต่ำกว่าสำหรับล่องแก่ง/ลงน้ำบริเวณหิน
    - เช็กแรงดันอีกครั้งหลังวางกระดานทิ้งไว้ 10 นาที เพราะสมดุลอุณหภูมิเปลี่ยนค่า PSI
  faq:
    - q: สูบลม SUP เกินได้ไหม?
      a: ได้ การเกินค่า PSI สูงสุดที่กำหนด (ปกติ 15-18 PSI) อาจทำให้รอยต่อหลุดลอกและแกน drop-stitch เสียหาย อยู่ในช่วงที่พิมพ์ไว้เสมอ
    - q: อุณหภูมิมีผลต่อ PSI ไหม?
      a: มีอย่างมาก กระดานที่สูบไว้ 15 PSI ที่ 70°F อาจขึ้นถึง 18 PSI เมื่ออยู่กลางแสงแดด 95°F น้ำเย็นทำให้แรงดันลดเหลือ 12 PSI ได้ เช็กแรงดันทุกครั้งที่สภาพแวดล้อมเปลี่ยน
    - q: ผู้เริ่มต้นควรใช้ค่า PSI เท่าไหร่?
      a: 12-13 PSI สำหรับช่วงฝึก ให้แพลตฟอร์มนุ่มกว่าเล็กน้อยซึ่งให้อภัยตอนหล่นได้มากกว่า ค่อยเพิ่มเป็น 15 PSI เมื่อทักษะดีขึ้น

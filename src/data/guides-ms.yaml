- slug: choosing-paddle
  category: buying-guide
  title: Cara Memilih Kayuh SUP yang Betul
  description: Panduan tentang bahan kayuh, bentuk bilah, jenis batang, dan pensaizan untuk SUP.
  tldr: 'Panjang kayuh: kayuh SUP harus 6-8" lebih tinggi daripada ketinggian anda. Bentuk bilah: bilah dihedral mengekalkan laluan lurus, bilah rata memberikan tangkapan air yang lebih banyak. Bahan batang: karbon paling ringan, gentian kaca paling berbaloi, aluminium paling menjimatkan.'
  problem: Menggunakan saiz atau bahan kayuh yang salah menyebabkan kepenatan yang tidak perlu, kecekapan kayuhan yang lemah, dan ketegangan sendi.
  solution: Padankan panjang kayuh, bentuk bilah, bahan batang, dan kelenturan dengan gaya dayungan, saiz badan, dan bajet anda.
  audience: Pendayung SUP yang sedang memilih kayuh pertama atau kayuh seterusnya.
  steps:
    - Ukur ketinggian kayuh — 6-8" lebih tinggi daripada ketinggian anda untuk dayungan am
    - Pilih bahan bilah — nilon untuk bajet, gentian kaca untuk nilai, karbon untuk prestasi
    - Pilih bentuk bilah — dihedral untuk penjejakan lancar, rata untuk kuasa, sudu untuk perlumbaan
    - Pilih jenis batang — lurus untuk penggunaan am, bengkok untuk SUP perlumbaan
    - Semak kelenturan — batang lebih kaku memindahkan lebih banyak kuasa, batang lentur mengurangkan ketegangan sendi
  faq:
    - q: Apakah bahan kayuh yang terbaik?
      a: Gentian kaca menawarkan keseimbangan terbaik antara berat, ketahanan, dan kos. Karbon lebih ringan tetapi lebih mahal dan rapuh. Nilon berat tetapi hampir tidak boleh musnah.
    - q: Bagaimana saya tahu sama ada kayuh saya panjangnya betul?
      a: Dirikan kayuh secara menegak di sebelah anda — pemegang harus sampai ke pergelangan tangan anda apabila lengan diangkat ke atas kepala.
    - q: Patutkah saya mendapatkan kayuh sekeping atau kayuh boleh dilaras?
      a: Kayuh boleh dilaras sesuai untuk penggunaan berkongsi dan perjalanan. Kayuh sekeping lebih ringan, lebih kaku, dan lebih cekap untuk penggunaan khusus.

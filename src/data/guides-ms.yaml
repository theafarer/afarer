- slug: sup-size-guide
  category: buying-guide
  title: Panduan Saiz SUP — Cara Memilih Dimensi Papan yang Tepat
  description: Panduan saiz SUP lengkap merangkumi cadangan panjang, lebar dan ketebalan berdasarkan berat badan, ketinggian, tahap kemahiran serta gaya mendayung anda.
  tldr: Pemula memerlukan papan yang lebih lebar (32-34") untuk kestabilan. Pendayung yang lebih berat memerlukan papan yang lebih panjang (11'+) dengan isipadu lebih tinggi. Pendayungan jarak jauh memerlukan badan kapal yang lebih panjang (12'+). Yoga memerlukan lebar tambahan (34"+). Sentiasa semak kapasiti berat — berat badan anda ditambah kelengkapan tidak seharusnya melebihi 80% daripada had tersebut.
  problem: Memilih saiz SUP yang salah menyebabkan kestabilan yang buruk, penjejakan yang lambat, dan pengalaman mendayung yang mengecewakan. Kebanyakan pembeli kali pertama memilih papan yang kelihatan menarik tanpa mempertimbangkan bagaimana dimensi mempengaruhi prestasi.
  solution: 'Padankan panjang, lebar dan ketebalan papan dengan berat badan, tahap kemahiran serta kegunaan utama anda. Gunakan kalkulator saiz kami: jumlahkan berat badan anda + berat kelengkapan, kemudian pilih papan yang mempunyai sekurang-kurangnya 20% ruang lebihan daripada jumlah tersebut.'
  audience: Pembeli SUP kali pertama, pendayung yang menaik taraf kepada papan khusus, dan sesiapa sahaja yang tidak pasti tentang pemilihan saiz.
  steps:
    - Timbang diri anda bersama semua kelengkapan yang dibawa (dayung, PFD, beg kering)
    - Tambahkan margin keselamatan sebanyak 20% untuk menentukan kapasiti berat minimum
    - 'Pilih lebar berdasarkan kemahiran: 32-34" untuk pemula, 30-32" untuk peringkat pertengahan, 28-30" untuk peringkat lanjutan'
    - 'Pilih panjang mengikut kegunaan: 10''6"-11''6" serbaguna, 12''-14'' untuk jarak jauh, 9''-10'' untuk air putih'
    - 'Sahkan ketebalan: 6" standard, 4" untuk prestasi, 5" untuk penggunaan serbaguna'
    - Semak julat PSI yang disyorkan untuk papan anda bagi kekakuan yang optimum
  faq:
    - q: Berapakah lebar SUP yang terbaik untuk pemula?
      a: Lebar 32 hingga 34 inci menyediakan platform yang paling stabil. Semakin lebar papan, semakin mudah untuk mengimbanginya — terutamanya bagi pendayung berbadan besar.
    - q: Bagaimanakah saya mengetahui samaada sebuah SUP terlalu kecil untuk saya?
      a: Jika papan duduk rendah di dalam air, sukar dikawal, atau hidungnya mudah tenggelam ketika didayung, kemungkinan besar saiznya terlalu kecil untuk berat badan anda.
    - q: Adakah panjang papan mempengaruhi kelajuan?
      a: Ya. Panjang garis air yang lebih besar meningkatkan kelajuan badan kapal secara teori. Papan jarak jauh 14' jauh lebih laju berbanding papan serbaguna 10' dengan usaha pendayung yang sama.

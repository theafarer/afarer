- slug: inflatable-repair
  category: maintenance
  title: Cara Membaiki SUP Tiup Anda
  description: Panduan langkah demi langkah untuk membaiki bocoran, masalah injap, dan kerosakan jahitan pada SUP tiup.
  tldr: Bocoran kecil (bawah 1/4") boleh dibaiki dengan kit tampalan yang disertakan. Bersihkan kawasan tersebut, sapukan gam PVC, tekan tampalan, dan tunggu 24 jam. Kebocoran injap biasanya memerlukan penggantian cincin O. Koyakan besar atau delaminasi jahitan memerlukan servis profesional.
  problem: Bocoran kecil dan masalah injap adalah lazim tetapi mudah dibaiki. Tanpa teknik pembaikan yang betul, pengguna sama ada membayar terlalu mahal untuk servis profesional atau memburukkan lagi kerosakan.
  solution: Kenal pasti jenis kerosakan — bocoran, kebocoran injap, atau masalah jahitan — dan gunakan kaedah pembaikan yang sesuai. Kebanyakan pembaikan mengambil masa 30 minit ditambah masa pengeringan.
  audience: Pemilik SUP tiup yang ingin mengendalikan pembaikan asas sendiri.
  steps:
    - Cari kebocoran — pam sehingga penuh, dengar bunyi udara, rasa dengan tangan, atau gunakan air sabun
    - Tanda kebocoran dengan pen atau pita
    - Bersihkan kawasan sekitar kebocoran dengan alkohol isopropil — sekurang-kurangnya 2 inci sekeliling kerosakan
    - Kasarkan permukaan dengan kertas pasir halus agar gam melekat dengan lebih baik
    - Sapukan gam PVC pada kedua-dua tampalan dan permukaan papan
    - Tunggu 5 minit sehingga gam menjadi melekit
    - Tekan tampalan dengan kukuh, gilak keluar gelembung udara dengan penggelek atau kad kredit
    - Biarkan kering selama 24 jam sebelum memam sehingga tekanan penuh
  faq:
    - q: Bolehkah saya membaiki bocoran di atas air?
      a: Pembaikan kecemasan menggunakan tampalan dan pita boleh membawa anda kembali ke pantai. Pembaihan penuh memerlukan keadaan kering dan pengeringan 24 jam.
    - q: Bagaimana saya membaiki injap yang bocor?
      a: Keluarkan teras injap dengan alat yang disertakan, periksa cincin O untuk kerosakan, gantikan jika perlu, dan masukkan semula teras dengan ketat.
    - q: Gam apa yang perlu saya gunakan untuk pembaihan PVC?
      a: Gunakan gam khusus PVC seperti HH-66 atau Clifton. Gam super biasa tidak melekat dengan baik pada bahan PVC tiup.

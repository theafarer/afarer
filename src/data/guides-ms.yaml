- slug: paddling-techniques
  category: tutorial
  title: Teknik Dayungan SUP Penting
  description: Kuasai dayungan ke hadapan, dayungan sapuan, dan pusingan silang haluan untuk mendayung dengan cekap dalam apa jua keadaan.
  tldr: Dayungan ke hadapan menggunakan teras badan anda, bukan lengan anda. Dayungan sapuan memusingkan papan. Pusingan silang haluan merupakan paksi paling cekap. Kekalkan dayung dalam posisi menegak dan tenggelamkan bilah sepenuhnya untuk pemindahan kuasa maksimum.
  problem: Kebanyakan pendayung menggunakan dayungan yang didominasi lengan, membazirkan tenaga dan menyebabkan keletihan bahu. Teknik yang lemah juga menjadikan papan sukar dikawal dalam angin dan ombak bergelora.
  solution: Pelajari tiga dayungan penting — ke hadapan, sapuan, dan pusingan silang haluan — dengan mekanik badan yang betul. Berlatih setiap satu di air tenang sebelum maju ke keadaan yang lebih mencabar.
  audience: Pendayung yang ingin mendayung lebih lama, lebih pantas, dan dengan keletihan yang kurang.
  steps:
    - 'Dayungan ke hadapan: capai ke depan, tanamkan bilah sepenuhnya, tarik ke belakang menggunakan putaran torso (bukan lengan), keluar pada paras buku lali'
    - 'Dayungan sapuan: capai ke depan pada tepi papan, sapukan bilah dalam lengkok lebar ke arah ekor, pusingkan papan menjauhi sisi dayung'
    - 'Pusingan silang haluan: letakkan dayung di sisi bertentangan papan tanpa menukar pegangan tangan, tarik ke arah ekor'
    - 'Teknik penyokong: gunakan penyokong rendah untuk kestabilan dalam ombak bergelora — tepuk bilah secara rata pada permukaan air'
    - 'Dayungan tarik: capai keluar ke sisi, tarik papan secara menyisi ke arah dayung'
  faq:
    - q: Bagaimana saya mendayung dalam garis lurus?
      a: Gunakan panjang dayungan yang konsisten di kedua-dua belah sisi. Tukar sisi setiap 5-10 dayungan. Pandang satu titik tetap di kaki langit sebagai rujukan.
    - q: Patutkah saya bengkokkan lutut?
      a: Ya. Kekalkan sedikit bengkokan pada lutut sebagai penyerap hentaman. Lutut yang terkunci memindahkan setiap riak air ke teras badan anda dan mengurangkan kestabilan.
    - q: Bagaimana saya mendayung melawan angin?
      a: Rendahkan posisi berdiri anda, gunakan dayungan yang lebih pendek dan lebih pantas, dan kekal lebih hampir dengan pantai di mana angin selalunya berkurangan. Jika angin terlalu kuat, jangan keluar ke air.

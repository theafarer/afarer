- slug: sup-fishing
  category: lifestyle
  title: 'Panduan Memancing dengan SUP: Cara Memancing dari Papan Dayung'
  description: Semua yang anda perlu tui tentang memancing dari papan dayung — persediaan kelengkapan, tip kestabilan, dan teknik.
  tldr: Memancing dengan SUP menawarkan pendekatan senyap, akses ke air cetek, dan lambungan 360 darjah. Gunakan papan lebar yang stabil (34"+), pasang pemegang joran, dan gunakan kotak sejuk atau bekas sebagai dek kelengkapan. Sauhkan ketika keadaan berangin. Sentiasa pakai PFD.
  problem: Bot memancing standard mahal untuk diselenggara dan tidak dapat mengakses air cetek. Memancing dengan SUP menyelesaikan masalah ini dengan menawarkan platform memancing mudah alih untuk air cetek, tetapi memerlukan penyesuaian kelengkapan tertentu.
  solution: Lengkapi SUP yang stabil dengan pemegang joran, bekas kelengkapan, dan sistem sauh. Manfaatkan kebolehalihan papan untuk mengakses spot memancing terpencil yang tidak dapat dicapai oleh bot.
  audience: Pemancing yang ingin memancing di perairan cetek, lokasi terpencil, atau yang gemar platform memancing yang ringan dan mudah alih.
  steps:
    - Pilih papan lebar (34"+) dengan kapasiti berat tinggi untuk kelengkapan
    - Pasang pemegang joran pada dek menggunakan sistem terpasang pada rel atau berstrap
    - Gunakan bekas kalis air atau kotak sejuk yang diikat pada dek hadapan untuk peralatan memancing
    - Bawa sauh kecil atau tiang penetap untuk keadaan berangin
    - Pakai PFD dengan poket untuk alat dan telefon
    - Latih lambungan dari posisi berlutut sebelum berdiri
  faq:
    - q: Bolehkah saya berdiri dan memancing di atas SUP?
      a: Ya. Papan lebar 34"+ menyediakan kestabilan yang mencukupi untuk berdiri dan melambung. Berlatih di air tenang terlebih dahulu.
    - q: Ikan apa yang boleh saya sasarkan dari SUP?
      a: SUP sangat sesuai untuk bass di tasik, ikan merah di dataran lumpur, trout di sungai, dan spesies pesisir di teluk dan muara.
    - q: Bagaimana saya mendaratkan ikan dari SUP?
      a: Berlutut untuk kestabilan. Gunakan jaring atau penyepit bibir. Kekalkan ikan dalam kedudukan rendah untuk mengelakkan terjatuh. Lepaskan atau simpan dalam kotak sejuk.

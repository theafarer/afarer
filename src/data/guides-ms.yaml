- slug: sup-storage-winter-care
  category: maintenance
  title: Penyimpanan SUP dan Penjagaan Musim Sejuk — Panjangkan Hayat Papan Anda
  description: Cara menyimpan, membersih dan menyediakan papan SUP tiup anda untuk musim sejuk dengan betul. Elakkan kulat, kerosakan UV dan kemerosotan bahan dengan penjagaan yang sempurna.
  tldr: Bersihkan dengan air tawar selepas setiap penggunaan. Keringkan sepenuhnya sebelum disimpan. Empiskan dan simpan di tempat yang sejuk dan gelap, jauh daripada cahaya matahari langsung serta suhu ekstrem. Jangan sesekali menyimpan papan dalam keadaan terisi udara atau di dalam kereta yang panas. Sapukan pelindung UV secara berkala.
  problem: Penyimpanan yang tidak betul merupakan punca utama kegagalan SUP pramatang — kulat, penguraian bahan, delaminasi, dan kerosakan injap akibat haba atau kesejukan.
  solution: 'Ikuti rutin penjagaan 3 langkah: bilas selepas setiap sesi, keringkan sepenuhnya sebelum disimpan, dan simpan dalam keadaan dikempiskan di persekitaran yang terkawal suhunya, iaitu antara 50-80°F (10-27°C).'
  audience: Semua pemilik SUP yang mahu papan mereka bertahan selama 5+ tahun.
  steps:
    - Bilas papan, dayung dan pam dengan air tawar selepas setiap sesi di air masin atau air berlumpur
    - Bersihkan dengan sabun lembut dan span lembut — jangan sesekali gunakan bahan kimia kuat atau mesin pencuci bertekanan tinggi
    - Keringkan papan sepenuhnya di luar sebelum mengempiskannya (buka injap untuk membiarkan kelembapan dalaman keluar)
    - Empiskan sepenuhnya, gulung dari bahagian hidung ke arah ekor untuk mengeluarkan baki udara
    - Lap beg galas sehingga kering sebelum menyimpan papan di dalamnya
    - Simpan di dalam almari yang sejuk dan gelap atau ruang simpan bawah katil — jangan sesekali di bawah matahari langsung, di dalam kereta yang panas, atau di bilik simpan yang membeku
  faq:
    - q: Bolehkah saya membiarkan SUP saya terisi udara sepanjang musim?
      a: Lebih baik dikempiskan apabila tidak digunakan untuk tempoh yang lama. Tekanan PSI yang berterusan mempercepatkan keletihan bahan. Kempiskan antara sesi jika disimpan melebihi 2 minggu.
    - q: Bagaimanakah saya membuang kulat daripada SUP saya?
      a: Campurkan sabun lembut dengan air suam dan sedikit cuka putih. Gosok perlahan menggunakan berus lembut. Bilas dengan teliti dan keringkan di tempat berlorek. Elakkan peluntur kerana ia boleh merosakkan PVC.
    - q: Bolehkah saya menyimpan SUP di dalam garaj?
      a: Hanya jika suhu garaj kekal antara 50-80°F sepanjang tahun. Loteng dan garaj tanpa kawalan suhu mengalami suhu ekstrem yang boleh merosakkan teras drop-stitch.

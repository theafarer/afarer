- slug: sup-inflation-psi-guide
  category: technical
  title: Panduan Penggelembungan SUP — PSI Optimum untuk Prestasi dan Keselamatan
  description: 'Panduan lengkap mengenai tekanan penggelembungan SUP: julat PSI yang disyorkan, cara tekanan mempengaruhi prestasi, dan tip untuk menggunakan pam anda dengan betul.'
  tldr: Gelembungkan sehingga 12-15 PSI untuk kebanyakan SUP tiup. Tekanan lebih tinggi = kekakuan lebih tinggi tetapi proses penggelembungan lebih perlahan. Tekanan lebih rendah = rasa lebih lembut tetapi lenturan lebih banyak. Jangan sesekali melebihi PSI maksimum yang tercetak pada papan anda. Gunakan pam yang dilengkapi tolok tekanan yang tepat. Udara sejuk mengurangkan tekanan, matahari panas menambahkannya.
  problem: Papan yang kurang tekanan terasa lembap dan terlalu lentur. Papan yang terlebih tekanan pula berisiko mengalami kegagalan jahitan. Ramai pendayung hanya meneka PSI tanpa mengukurnya dengan tepat.
  solution: Gunakan pam dengan tolok tekanan terbina dalam. Sasarkan 15 PSI untuk kekakuan maksimum. Semak tekanan sebelum setiap sesi — perubahan suhu mempengaruhi PSI secara ketara.
  audience: Semua pemilik SUP tiup.
  steps:
    - Semak julat PSI yang disyorkan tercetak pada papan anda berhampiran injap
    - Gunakan pam dwi-tindakan untuk mengembangkan papan sehingga pertengahan julat yang disyorkan
    - Tukar ke mod tindakan tunggal untuk 3-4 PSI terakhir bagi kawalan yang lebih tepat
    - Semak tekanan dengan tolok — tolok analog lebih dipercayai berbanding tolok digital
    - 'Laraskan mengikut keadaan: PSI lebih tinggi untuk pendayungan jarak jauh/perlumbaan, PSI lebih rendah untuk air putih/pelancaran di kawasan berbatu'
    - Semak semula tekanan selepas papan dibiarkan selama 10 minit — keseimbangan suhu mengubah PSI
  faq:
    - q: Bolehkah saya terlebih mengembangkan SUP saya?
      a: Ya. Melebihi PSI maksimum yang ditetapkan (biasanya 15-18 PSI) boleh menyebabkan delaminasi jahitan dan merosakkan teras drop-stitch. Sentiasa kekal dalam julat yang tercetak.
    - q: Adakah suhu mempengaruhi PSI?
      a: Sangat ketara. Papan yang dikembangkan sehingga 15 PSI pada suhu 70°F boleh mencapai 18 PSI di bawah matahari terik pada suhu 95°F. Air sejuk boleh menurunkan tekanan kepada 12 PSI. Semak tekanan selepas berlaku perubahan persekitaran.
    - q: Berapakah PSI untuk pemula?
      a: Tekanan 12-13 PSI sesuai untuk pembelajaran kerana menyediakan platform yang sedikit lebih lembut dan lebih memaafkan apabila terjatuh. Naikkan kepada 15 PSI apabila kemahiran bertambah baik.

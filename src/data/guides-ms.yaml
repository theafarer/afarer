- slug: sup-weight-capacity
  category: buying-guide
  title: Panduan Kapasiti Berat SUP — Berapa Banyak Berat yang Boleh Ditampung oleh SUP?
  description: Memahami had kapasiti berat SUP, cara mengira jumlah beban anda, dan sebab melebihi had tersebut menjejaskan prestasi dan keselamatan.
  tldr: Jangan sesekali melebihi 80% daripada kapasiti berat maksimum papan dengan berat badan anda ditambah kelengkapan. Papan berkapasiti 220 lb sesuai untuk pendayung seberat 160 lb dengan kelengkapan ringan. Melebihi had tersebut menyebabkan papan melenting naik turun, kawalan yang lembap, dan peningkatan risiko kerosakan.
  problem: Pendayung sering melebihi kapasiti berat papan mereka, lalu mengakibatkan prestasi lemah, papan tenggelam dan berpotensi rosak. Pengilang hanya menyenaraikan had maksimum tanpa menerangkan beban kerja yang selamat.
  solution: Kira jumlah beban anda (berat badan + kelengkapan + air yang diserap oleh papan) dan kekal di bawah 80% daripada kapasiti maksimum yang dinyatakan. Pendayung yang lebih berat memerlukan papan berisipadu tinggi dengan kapasiti 300+ lb.
  audience: Pendayung dari pelbagai saiz badan, terutamanya pendayung berbadan besar dan mereka yang membawa kelengkapan ekspedisi.
  steps:
    - Cari kapasiti berat maksimum yang tercetak pada papan anda (biasanya berhampiran injap)
    - Timbang diri anda dan semua kelengkapan termasuk dayung, PFD, beg kering, peti sejuk dan aksesori
    - 'Kira: (jumlah beban anda) ÷ (kapasiti maksimum) × 100 = % kapasiti yang digunakan'
    - Sasarkan 70-80% untuk prestasi dan keselamatan yang optimum
    - Jika melebihi 80%, pilih papan yang lebih besar atau kurangkan kelengkapan
  faq:
    - q: Apakah akan berlaku jika saya melebihi had berat?
      a: Papan akan duduk lebih rendah lalu menimbulkan lebih banyak rintangan. Kestabilan berkurangan, hidung papan mungkin terbenam, dan teras drop-stitch berisiko lebih tinggi untuk rosak dalam keadaan air bergelora.
    - q: Bolehkah dua orang menaiki satu SUP?
      a: Hanya jika jumlah berat kekal di bawah 80% daripada kapasiti. Kebanyakan SUP standard direka untuk penunggang tunggal. Penunggangan berganda memerlukan papan yang dinilai khusus untuk dua orang.
    - q: Adakah SUP tiup mempunyai kapasiti lebih rendah berbanding papan keras?
      a: Papan tiup berkualiti dengan binaan drop-stitch mempunyai kapasiti berat yang setara atau lebih tinggi berbanding papan keras kerana pengagihan isipadu yang lebih tebal.

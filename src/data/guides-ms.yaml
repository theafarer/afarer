- slug: sup-board-materials
  category: technical
  title: Bahan Papan SUP — Penjelasan Mengenai PVC, EPS, Epoksi dan Drop-Stitch
  description: 'Panduan teknikal mengenai bahan binaan SUP: papan tiup drop-stitch PVC vs papan keras berteras buih EPS. Fahami faktor yang menjadikan setiap jenis mempunyai prestasi berbeza.'
  tldr: SUP tiup menggunakan drop-stitch PVC dengan ribuan benang dalaman untuk kekakuan. Papan keras menggunakan teras buih EPS dengan cangkerang epoksi atau gentian kaca. Papan tiup unggul dari segi keportabilitaan dan ketahanan. Papan keras unggul dari segi kelajuan dan rasa pengendalian. Teknologi drop-stitch moden pada tekanan 15 PSI mampu menyaingi kekakuan papan keras.
  problem: Pembeli tidak memahami perbezaan asas binaan antara papan tiup dan papan keras, lalu mengakibatkan keputusan pembelian yang salah.
  solution: 'Padankan bahan papan dengan kegunaan utama anda: drop-stitch tiup untuk perjalanan, penyimpanan dan ketahanan. EPS/epoksi untuk perlumbaan, berselancar dan prestasi maksimum.'
  audience: Pembeli SUP yang membandingkan binaan papan tiup dan papan keras.
  steps:
    - 'Drop-stitch tiup: ribuan benang poliester menghubungkan lapisan atas dan bawah, membentuk struktur tegar apabila ditekan udara sehingga 12-15 PSI'
    - 'Buih EPS keras: teras polistirena terkembang yang dibentuk mengikut reka bentuk badan kapal, disalut dengan resin epoksi dan lapisan gentian kaca'
    - 'Kelebihan papan tiup: boleh dikemas, sukar rosak, ringan untuk dibawa, dan tepi lembut untuk keselamatan'
    - 'Kelebihan papan keras: jumlah berat keseluruhan lebih ringan, platform lebih tegar, kecekapan luncuran lebih baik, dan lebih responsif'
    - 'Pilihan hibrid: sesetengah pengilang menggabungkan drop-stitch dengan panel tegar untuk mendapatkan yang terbaik daripada kedua-dua dunia'
  faq:
    - q: Adakah SUP tiup setegar papan keras?
      a: Pada 15 PSI dengan binaan drop-stitch berkualiti, papan tiup moden sangat hampir dengan papan keras. Kebanyakan pendayung rekreasi tidak dapat membezakannya. Pendayung perlumbaan bagaimanapun akan menyedari kelebihan papan keras.
    - q: Bahan manakah yang lebih tahan lama?
      a: SUP tiup bertahan 5-10 tahun dengan penjagaan rapi. Papan keras bertahan 10-20 tahun tetapi mudah retak, penyok dan menyerap air. Papan tiup lebih tahan kerosakan dalam kegunaan harian.
    - q: Adakah PVC mesra alam?
      a: Pengeluaran PVC memberi kesan kepada alam sekitar, tetapi SUP tiup bertahan lebih lama (mengurangkan kekerapan penggantian) dan lebih padat apabila dikemas (mengurangkan pelepasan pengangkutan). Sentiasa kitar semula papan lama dengan cara yang betul.

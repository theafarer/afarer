- slug: understanding-specs
  category: technical
  title: Cara Membaca Spesifikasi Papan SUP
  description: Panduan teknikal untuk memahami spesifikasi papan SUP — isipadu, dimensi, binaan, dan apa maksudnya terhadap prestasi.
  tldr: 'Spesifikasi utama: isipadu (liter) menentukan keapungan dan kapasiti berat, lebar menentukan kestabilan, panjang menentukan penjejakan dan kelajuan, ketebalan menentukan kekakuan, dan penarafan PSI menentukan tekanan penggelembungan untuk prestasi optimum.'
  problem: Lembaran spesifikasi produk menyenaraikan nombor tanpa konteks, menyebabkan pembeli tidak pasti spesifikasi mana yang benar-benar penting bagi kes penggunaan mereka.
  solution: 'Terjemahkan setiap spesifikasi kepada prestasi dunia sebenar: isipadu untuk keapungan, lebar untuk kestabilan, panjang untuk luncuran, ketebalan untuk kekakuan, dan binaan untuk ketahanan.'
  audience: Pendayung perantara dan pembeli teknikal yang ingin membuat keputusan berasaskan data.
  steps:
    - Semak isipadu (liter) — berat anda berserta peralatan tidak boleh melebihi 80% daripada penarafan isipadu papan
    - Semak lebar — lebih lebar (32-34") = lebih stabil, lebih sempit (28-30") = lebih laju
    - Semak panjang — lebih panjang (12-14") = penjejakan lebih baik, lebih pendek (10-11") = kelincahan lebih baik
    - Semak ketebalan — 6" adalah standard, 8" menawarkan lebih banyak kekakuan dan kapasiti berat
    - Semak penarafan PSI — tiupkan sehingga PSI maksimum yang diberi penarafan untuk kekakuan optimum
    - Semak bahan binaan — ketumpatan drop-stitch, lapisan PVC, pengukuhan tepi papan
  faq:
    - q: Apakah maksud drop-stitch?
      a: Drop-stitch ialah kaedah binaan di mana ribuan benang menghubungkan lapisan atas dan bawah papan. Ini membolehkan penggelembungan bertekanan tinggi (12-15 PSI) untuk kekakuan yang melampau.
    - q: Apakah nisbah berat kepada isipadu yang ideal?
      a: Sasaran yang baik ialah lebih kurang 5-6 paun berat penunggang bagi setiap liter isipadu papan. Pendayung berat 220 lb patut mencari papan dengan isipadu 180+ liter.
    - q: Adakah berat papan penting?
      a: Ya. Papan yang lebih ringan (di bawah 20 lbs) lebih mudah dibawa dan diangkut. Papan yang lebih berat (25+ lbs) selalunya menunjukkan binaan PVC berbilang lapisan yang lebih tahan lama.

- slug: safety-tips
  category: safety
  title: Tip Keselamatan Sukan Air
  description: Garis panduan keselamatan penting untuk dayung papan — daripada semakan peralatan hingga kesedaran cuaca.
  tldr: Sentiasa memakai rompi keselamatan berpensijilan CE, semak cuaca dan keadaan air sebelum memulakan, bawa peranti komunikasi, jangan sesekali mendayung bersendirian di perairan yang tidak dikenali, dan fahami had penarafan peralatan anda.
  problem: Kebanyakan kemalangan sukan air berpunca daripada persediaan yang tidak mencukupi — tiada rompi keselamatan, mengabaikan amaran cuaca, atau menggunakan peralatan melebihi had reka bentuknya.
  solution: 'Amalkan senarai semak keselamatan sebelum memulakan: sahkan keadaan peralatan, semak cuaca dan suhu air, maklumkan laluan anda kepada seseorang, dan sentiasa memakai pelampung yang sesuai.'
  audience: Semua pendayung papan dan peserta sukan air.
  steps:
    - Semak ramalan cuaca — elakkan angin melebihi 15 mph dan ribut petir
    - Sahkan suhu air — air sejuk (<60°F/15°C) memerlukan pakaian selam basah atau pakaian selam kering
    - Periksa peralatan — semak kebocoran, keretakan, dan penggelembungan yang betul
    - Pakai rompi keselamatan berpensijilan CE pada setiap masa
    - Pasangkan tali penambat pada buku lali atau betis anda
    - Serahkan pelan terapung — beritahu seseorang ke mana anda pergi dan bila anda akan kembali
    - Bawa peranti komunikasi — bekas telefon kalis air atau radio VHF
    - Ketahui had anda — kekal dalam tahap kemahiran dan penarafan peralatan anda
  faq:
    - q: Adakah saya memerlukan rompi keselamatan di atas SUP?
      a: Ya. Banyak bidang kuasa mengwajibkan rompi keselamatan secara sah pada mana-mana vesel air, termasuk SUP. Walaupun tidak diwajibkan, rompi keselamatan berpensijilan CE merupakan peralatan keselamatan yang penting.
    - q: Apakah kecederaan sukan air yang paling biasa?
      a: Perendaman dalam air sejuk dan keletihan merupakan risiko serius yang paling biasa. Sentiasa berpakaian mengikut suhu air, bukan suhu udara.
    - q: Bagaimana saya menyemak sama ada keadaan itu selamat?
      a: Gunakan ramalan cuaca marin. Semak kelajuan angin, ketinggian ombak, dan suhu air. Pemula patut kekal dalam keadaan angin di bawah 10 mph dan ombak di bawah 1 ft.

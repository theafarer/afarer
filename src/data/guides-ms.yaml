- slug: sup-maintenance
  category: maintenance
  title: Cara Membersihkan dan Menyimpan SUP Boleh Tiup Anda
  description: Panduan penyelenggaraan langkah demi langkah untuk memaksimumkan jangka hayat papan SUP boleh tiup anda.
  tldr: Bilas dengan air tawar selepas setiap penggunaan, keringkan sepenuhnya sebelum disimpan, lepaskan angin dan gulung secara longgar (bukan ketat ala ketenteraan), simpan di tempat sejuk dan kering jauh dari cahaya matahari terus, dan periksa jahitan setiap bulan.
  problem: Penyimpanan dan pembersihan yang tidak betul merupakan punca utama kegagalan pramatang pada SUP boleh tiup — kulat, kerosakan UV, dan pelepasan lapisan jahitan.
  solution: 'Ikuti rutin selepas sesi yang konsisten: bilas, keringkan, periksa, lepaskan angin, dan simpan. Gunakan sabun lembut untuk kotoran degil. Jangan sesekali menyimpan papan dalam keadaan basah atau di bawah cahaya matahari terus.'
  audience: Semua pemilik SUP boleh tiup yang mahu papan mereka bertahan 5+ tahun.
  steps:
    - Bilas papan dengan air tawar sebaik sahaja selepas digunakan, terutamanya selepas digunakan di air masin
    - Bersihkan dengan sabun lembut dan span lembut — elakkan bahan kimia keras atau mesin basuh bertekanan
    - Keringkan papan sepenuhnya — buka injap untuk membiarkan air tersekat keluar
    - Periksa kerosakan — semak jahitan, injap, dan permukaan daripada tusukan
    - Lepaskan angin sepenuhnya — keluarkan teras injap untuk melepaskan angin sepenuhnya
    - Gulung papan secara longgar — mulakan dari bahagian hidung papan, elakkan lipatan yang ketat
    - Simpan dalam beg angkutan di tempat yang sejuk dan kering, jauh dari cahaya matahari terus
  faq:
    - q: Bolehkah saya biarkan SUP saya terus tergelembung sepanjang musim?
      a: Ya, tetapi jauhkan dari cahaya matahari terus ketika tidak digunakan. Pelepasan angin separa (8-10 PSI) disyorkan untuk penyimpanan berpanjangan.
    - q: Bagaimana saya membaiki tusukan?
      a: Bersihkan kawasan tersebut, potong tampalan dengan penjuru yang dibulatkan, sapukan pelekat, tekan dengan kukuh, dan tunggu 24 jam sebelum menggelembungkan semula. Papan afarer disertakan dengan kit pembaikan.
    - q: Berapa kerap saya patut menyemak injap?
      a: Setiap bulan. Injap merupakan titik kegagalan yang paling biasa. Semak sama ada pin injap bergerak dengan bebas dan cincin O masih utuh.

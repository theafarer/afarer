- slug: weather-conditions
  category: safety
  title: Memahami Keadaan Cuaca untuk Dayung Papan
  description: Belajar membaca angin, ombak, air pasang surut, dan corak cuaca untuk membuat keputusan yang selamat di atas air.
  tldr: 'Semak tiga perkara sebelum setiap permulaan: kelajuan angin (di bawah 10 mph untuk pemula), ketinggian ombak (di bawah 1 ft untuk pemula), dan suhu air (berpakaian mengikut air, bukan udara). Angin luar pesisir adalah berbahaya pada tahap kemahiran apa pun.'
  problem: Kebanyakan kemalangan berkaitan cuaca berlaku kerana pendayung salah menilai keadaan — mereka menyemak suhu udara tetapi bukan suhu air, atau tidak memahami bahawa angin luar pesisir boleh meniup mereka keluar ke laut.
  solution: 'Gunakan penilaian cuaca berstruktur sebelum memulakan: arah dan kelajuan angin, tempoh dan ketinggian ombak, keadaan air pasang surut, serta suhu air. Fahami bagaimana setiap faktor mempengaruhi keselamatan anda.'
  audience: Semua pendayung yang keluar ke perairan terbuka — tasik, teluk, sungai, dan lautan.
  steps:
    - Semak kelajuan dan arah angin — angin luar pesisir (berciup dari darat ke laut) adalah yang paling berbahaya
    - Nilai keadaan ombak — tempoh ombak sama pentingnya dengan ketinggian ombak
    - Ketahui keadaan air pasang surut — arus pasang surut boleh menjadi lebih kuat daripada kelajuan dayungan anda
    - Ukur suhu air — di bawah 60°F/15°C memerlukan perlindungan haba
    - Semak jarak penglihatan — kabut dan hujan lebat mengurangkan jarak penglihatan dan meningkatkan risiko pelanggaran
    - Fahami bahaya setempat — batu tenggelam, arus kuat, zon lalu lintas bot
  faq:
    - q: Kelajuan angin berapa kah yang terlalu tinggi untuk SUP?
      a: 'Pemula: melebihi 10 mph (8 knots). Perantara: melebihi 15 mph (13 knots). Mahir: melebihi 20 mph (17 knots). Jika ragu-ragu, jangan keluar ke air.'
    - q: Apakah maksud tempoh ombak?
      a: Tempoh ombak ialah masa antara ombak yang berturut-turut. Tempoh pendek (di bawah 8 saat) bermaksud ombak yang curam dan bergelora. Tempoh panjang (melebihi 12 saat) bermaksud ombak yang lebih lancar dan lebih mudah diramalkan.
    - q: Bolehkah saya mendayung semasa hujan?
      a: Hujan ringan biasanya selamat. Hujan lebat mengurangkan jarak penglihatan dan boleh menandakan perubahan keadaan angin. Ribut petir memerlukan pemindahan segera dari air.

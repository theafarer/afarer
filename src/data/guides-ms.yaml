- slug: beginner-guide
  category: tutorial
  title: Panduan Pemula untuk Dayung Papan
  description: Semua yang perlu anda ketahui sebelum sesi dayung papan pertama anda — daripada persediaan peralatan hingga teknik dayungan asas.
  tldr: Mulakan di air tenang dan mendatar dengan papan lebar yang stabil. Tiupkan sehingga 12-15 PSI, pasangkan tali penambat, dan gunakan panjang dayung yang betul (6-8" lebih tinggi daripada ketinggian anda). Kekalkan posisi kaki selebar bahu, lutut sedikit bengkok, dan pandang ke kaki langit.
  problem: Pendayung baharu sering melangkau persediaan asas — panjang dayung yang salah, posisi berdiri yang lemah, atau memilih air bergelora — yang menyebabkan kejatuhan, kekecewaan, dan rasa putus asa.
  solution: 'Ikuti pelan sesi pertama yang berstruktur: pilih air tenang, sediakan peralatan anda dengan betul, berlatih dalam posisi berlutut sebelum berdiri, dan kuasai dayungan ke hadapan sebelum mencuba pusingan.'
  audience: Pemula mutlak yang belum pernah mendayung papan sebelum ini.
  steps:
    - Pilih air yang mendatar dan tenang tanpa lalu lintas bot — tasik kecil atau teluk terlindung adalah ideal
    - Tiupkan papan anda sehingga 12-15 PSI menggunakan pam dua tindakan
    - Pasangkan tali penambat bergulung pada buku lali atau betis anda, bukan pada pemegang papan
    - Masukkan sirip dan ketatkan skru
    - Laraskan panjang dayung — ia sepatutnya 6-8 inci lebih tinggi daripada ketinggian anda
    - Mulakan dengan berlutut di atas papan, dayung beberapa kali untuk merasa keseimbangan
    - Berdiri satu kaki pada satu masa, kaki selebar bahu, lutut kekal lentur
    - Pandang ke kaki langit, bukan kaki anda — papan anda menuju ke mana anda memandang
  faq:
    - q: Apa yang patut saya pakai untuk dayung papan?
      a: Pakaian sukan cepat kering, rompi keselamatan, pelindung matahari, dan topi. Di air sejuk, pakai pakaian selam basah. Sentiasa memakai tali penambat dan membawa telefon dalam bekas kalis air.
    - q: Bagaimana saya naik semula ke papan jika terjatuh?
      a: Kekal tenang. Berenang ke arah papan, pegang pemegang tengah, dan sepak kaki anda sambil menarik diri ke atas papan dalam satu gerakan. Kembali ke posisi berlutut dahulu, kemudian barulah berdiri.
    - q: Keadaan angin bagaimanakah yang selamat?
      a: 'Pemula: angin di bawah 10 mph (5 knots). Jika angin bertiup menjauhi pantai, jangan keluar ke air. Semak ramalan cuaca dan fahami bahawa angin luar pesisir adalah berbahaya.'

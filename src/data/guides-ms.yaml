- slug: sup-for-whitewater
  category: buying-guide
  title: Panduan SUP air peraik — Panduan pembeli papan tiup untuk menuruni sungai
  description: 'Cara memilih SUP air peraik untuk menuruni sungai: papan lebih pendek, binaan diperkukuh, kelengkapan keselamatan, dan teknik mendayung untuk jeram Kelas I-III.'
  tldr: SUP air peraik memerlukan panjang lebih pendek (8-10'), sisi diperkukuh, PSI lebih tinggi (15+), dan pelbagai ruang udara untuk keselamatan. Gunakan tali pengikat sungai lurus (bukan melingkar), pakai helm dan PFD, dan sentiasa mendayung bersama rakan. Mulakan di Kelas I sebelum mencuba jeram yang lebih sukar.
  problem: Membawa SUP serbaguna standard ke air yang bergerak adalah berbahaya — papan standard tidak mempunyai ketangkasan, rintangan hentaman, dan ciri keselamatan yang diperlukan untuk sungai.
  solution: Pilih SUP air peraik yang dibina khusus dengan panjang pendek untuk ketangkasan, binaan diperkukuh untuk menahan hentaman batu, dan reka bentuk berbilang ruang untuk keselamatan.
  audience: Pendayung berpengalaman yang beralih kepada sukan menuruni sungai.
  steps:
    - Pilih papan sepanjang 8-10' untuk ketangkasan maksimum dalam jeram
    - Cari binaan sisi diperkukuh dan PVC gred tentera
    - Pilih papan dengan 2+ ruang udara sebagai sandaran sekiranya berlaku bocor
    - Gunakan tali pengikat sungai lurus yang dipasang pada tali pinggang pelepas pantas
    - Pakai helm, PFD, dan kasut sungai yang sesuai
    - Mulakan di jeram Kelas I dan mara secara beransur-ansur bersama rakan yang berpengalaman
  faq:
    - q: Bolehkah saya menggunakan SUP biasa untuk air peraik?
      a: Tidak digalakkan. SUP standard kurang rintangan hentaman dan mungkin rosak lapisannya apabila terhentam batu. Keselamatan berbilang ruang amat kritikal dalam persekitaran sungai.
    - q: Berapa PSI untuk SUP air peraik?
      a: 15+ PSI untuk kekukuhan maksimum. Papan yang lebih keras melantun daripada batu dengan lebih baik berbanding papan kurang kembung yang menurut bentuk halangan.
    - q: Adakah saya memerlukan kemahiran mendayung khas untuk SUP air peraik?
      a: Ya. Kemahiran membaca sungai, pusingan pusaran air, feri merentas arus, dan teknik penopang adalah amat penting. Ikuti klinik SUP air peraik sebelum mencuba Kelas II+.

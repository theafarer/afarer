  title: SUP méretválasztási útmutató — Hogyan válassza ki a megfelelő táblaméreteket
  description: Átfogó SUP-méretútmutató a hosszra, szélességre és vastagságra vonatkozó javaslatokkal az Ön súlya, magassága, képzettségi szintje és evezési stílusa alapján.
  tldr: A kezdőknek szélesebb táblák (32-34") kellenek a stabilitáshoz. A nehezebb evezősöknek hosszabb (11'+), nagyobb térfogatú táblákra van szükségük. A túrázáshoz hosszabb testek (12'+) szükségesek. A jógához extra szélesség (34"+) kell. Mindig ellenőrizze a teherbírás határát — az Ön súlya a felszereléssel együtt ne haladja meg a limit 80%-át.
  problem: A rosszul kiválasztott SUP-méret gyenge stabilitáshoz, lassú iránytartáshoz és frusztráló evezési élményhez vezet. A legtöbb első alkalommal vásárló jól kinéző táblát választ, anélkül hogy mérlegelné, hogyan befolyásolják a méretek a teljesítményt.
  solution: 'Igazítsa a tábla hosszát, szélességét és vastagságát az Ön súlyához, képzettségi szintjéhez és elsődleges felhasználásához. Használja méretkalkulátorunkat: adja össze a saját súlyát + a felszerelés súlyát, majd válasszon olyan táblát, amely e felett legalább 20%-nyi tartalékot biztosít.'
  audience: Első alkalommal SUP-ot vásárlók, specializált táblára váltó evezősök, valamint mindenki, aki bizonytalan a méretválasztásban.
  steps:
    - Mérje meg magát a teljes felszereléssel együtt, amelyet magával visz (evezőlapát, PFD, vízmentes zsák)
    - Adjon hozzá 20% biztonsági ráhagyást a minimális teherbírás megállapításához
    - 'Válasszon szélességet képzettség szerint: 32-34" kezdőknek, 30-32" középhaladóknak, 28-30" haladóknak'
    - 'Válasszon hosszat felhasználás szerint: 10''6"-11''6" univerzális használatra, 12''-14'' túrázáshoz, 9''-10'' vadvízi evezéshez'
    - 'Ellenőrizze a vastagságot: 6" standard, 4" teljesítményorientálthoz, 5" univerzálisra'
    - Ellenőrizze a táblájához ajánlott PSI-tartományt az optimális merevségért
  faq:
    - q: Milyen széles SUP a legjobb kezdőknek?
      a: A 32-34 hüvelykes szélesség biztosítja a legstabilabb platformot. Minél szélesebb a tábla, annál könnyebb rajta egyensúlyozni — különösen nagyobb testű evezősök számára.
    - q: Honnan tudom, hogy egy SUP túl kicsi-e nekem?
      a: Ha a tábla alacsonyan ül a vízben, lomhán kezelhető, vagy evezés közben az orra könnyen a víz alá merül, akkor valószínűleg kicsi az Ön súlyához.
    - q: Befolyásolja a tábla hossza a sebességet?
      a: Igen. A hosszabb vízvonal növeli az elméleti testsebességet. Ugyanakkora evezői erőbedobással egy 14'-es túratabla jelentősen gyorsabb, mint egy 10'-es univerzális tábla.

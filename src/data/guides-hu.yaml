- slug: sup-maintenance
  category: maintenance
  title: Hogyan tisztítsa és tárolja a felfújható SUP deszkáját
  description: Lépésről lépésre szóló karbantartási útmutató a felfújható SUP deszka élettartamának maximalizálásához.
  tldr: Öblítse le édesvízzel minden használat után, szárítsa meg teljesen tárolás előtt, eresztse le a levegőt és tekerje lazára (ne katonásan szorosra), tárolja hűvös, száraz helyen közvetlen napfénytől védve, és ellenőrizze havonta a varratokat.
  problem: A helytelen tárolás és tisztítás a felfújható SUP deszkák idő előtti meghibásodásának vezető okai — penészedés, UV-sérülés és varratleválás.
  solution: 'Kövessen következetes, evezés utáni rutint: öblítés, szárítás, ellenőrzés, leeresztés, tárolás. Makacs szennyeződéshez használjon enyhe szappant. Soha ne tárolja a deszkát nedvesen vagy közvetlen napfényben.'
  audience: Minden felfújható SUP tulajdonos, aki szeretné, ha deszkája 5+ évig kitartana.
  steps:
    - Öblítse le a deszkát közvetlenül használat után édesvízzel, különösen sósvizes használatot követően
    - Tisztítsa enyhe szappannal és puha szivaccsal — kerülje az erős vegyszereket és a nagynyomású mosót
    - Szárítsa meg a deszkát teljesen — nyissa ki a szelepet, hogy a bent rekedt víz ki tudjon távozni
    - Ellenőrizze, nincs-e sérülés — vizsgálja át a varratokat, a szelepet és a felületet szúrások szempontjából
    - Eresztse le a levegőt teljesen — a teljes leeresztéshez távolítsa el a szelepmagot
    - Tekerje fel a deszkát lazán — az orr felől kezdje, kerülje a szoros gyűrődéseket
    - Tárolja a hordtáskában, hűvös, száraz helyen, közvetlen napfénytől védve
  faq:
    - q: Hagyhatja a SUP deszkáját felfújva a teljes szezonon át?
      a: Igen, de ha nem használja, tartsa közvetlen napfénytől védve. Hosszabb tároláshoz a részleges leeresztés (8-10 PSI) ajánlott.
    - q: Hogyan javíthat ki egy szúrást?
      a: Tisztítsa meg a felületet, vágjon ki egy lekerekített sarkú foltot, vigyen fel ragasztót, nyomja rá erősen, és várjon 24 órát a felfújás előtt. Az afareres deszkákhoz javítókészlet tartozik.
    - q: Milyen gyakran kell ellenőrizni a szelepet?
      a: Havonta. A szelep a leggyakoribb meghibásodási pont. Ellenőrizze, hogy a szeleptű szabadon mozog-e, és az O-gumigyűrű sértetlen-e.

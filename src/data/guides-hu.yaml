- slug: sup-storage-winter-care
  category: maintenance
  title: SUP tárolás és téli gondozás — Hosszabbítsa meg táblája élettartamát
  description: Hogyan tárolja, tisztítsa és készítse télre helyesen a felfújható SUP-tábláját. Kerülje el a penészt, az UV-károsodást és az anyagromlást a megfelelő gondozással.
  tldr: Öblítse le édesvízzel minden használat után. Tárolás előtt szárítsa meg teljesen. Engedje le a levegőt, és tárolja hűvös, sötét helyen, közvetlen napfénytől és szélsőséges hőmérsékletektől távol. Soha ne tárolja felfújva vagy forró autóban. Alkalmanként vigyen fel UV-védőszert.
  problem: A helytelen tárolás a korai SUP-meghibásodások vezető oka — penész, anyagbomlás, delamináció, valamint a hőből vagy hidegből eredő szelepkárosodás.
  solution: 'Kövessen egy 3 lépéses gondozási rutint: öblítsen le minden alkalom után, szárítson meg alaposan tárolás előtt, és tárolja leeresztve, hőmérséklet-szabályozott környezetben, 50-80°F (10-27°C) között.'
  audience: Minden SUP-tulajdonos, aki azt szeretné, hogy a táblája 5+ évig tartson.
  steps:
    - Öblítse le a táblát, az evezőlapátot és a pumpát édesvízzel minden sósvízi vagy iszapos vízi használat után
    - Tisztítsa enyhe szappannal és puha szivaccsal — soha ne használjon maró vegyszereket vagy nagynyomású mosót
    - Szárítsa meg a táblát a szabadban teljesen, mielőtt leereszti (nyissa ki a szelepet, hogy a belső nedvesség távozhasson)
    - Engedje le teljesen, és tekerje az orrától a faráig a maradék levegő kiszorításához
    - Törölje szárazra a hordszákot, mielőtt a táblát belehelyezi
    - Tárolja hűvös, sötét szekrényben vagy az ágy alatti tárolóban — soha ne közvetlen napon, forró autóban vagy fagyos fészerben
  faq:
    - q: Hagyhatom a SUP-omat felfújva az egész szezonon át?
      a: Jobb leereszteni, ha hosszabb ideig nincs használatban. Az állandó PSI-terhelés gyorsítja az anyagfáradást. Ha 2 hétnél tovább tárolja, eresztse le a használatok között.
    - q: Hogyan távolítsam el a penészt a SUP-omról?
      a: Keverjen enyhe szappant langyos vízzel és egy kevés fehér ecettel. Dörzsölje át óvatosan puha kefével. Öblítse le alaposan, és szárítsa árnyékban. Kerülje a klóros fehérítőt, amely károsítja a PVC-t.
    - q: Tárolhatom a SUP-omat garázsban?
      a: Csak akkor, ha a garázs egész évben 50-80°F között marad. A padlások és a nem temperált garázsok olyan hőmérsékleti szélsőségeket élnek át, amelyek károsítják a drop-stitch magot.

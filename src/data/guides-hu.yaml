- slug: sup-weight-capacity
  category: buying-guide
  title: SUP teherbírás-útmutató — Mennyi súlyt bír el egy SUP?
  description: A SUP teherbírási határainak megértése, a teljes terhelés kiszámítása, és hogy miért befolyásolja a limit túllépése a teljesítményt és a biztonságot.
  tldr: A testtömege és a felszerelése együtt soha ne haladja meg a tábla maximális teherbírásának 80%-át. Egy 220 lb teherbírású tábla megfelelő egy 160 lb súlyú evezősnek könnyű felszereléssel. A limit túllépése a tábla előre-hátra hullámzó mozgását, lomha kezelhetőséget és megnövekedett károsodási kockázatot okoz.
  problem: Az evezősök gyakran túllépik a táblájuk teherbírását, ami gyenge teljesítményhez, elsüllyedéshez és a tábla lehetséges károsodásához vezet. A gyártók megadják a maximális határokat, de nem magyarázzák el a biztonságos munkaterhelést.
  solution: Számítsa ki a teljes terhelést (testtömeg + felszerelés + a tábla által felvett víz), és maradjon a megadott maximális teherbírás 80%-a alatt. A nehezebb evezősöknek nagyobb térfogatú, 300+ lb teherbírású táblákra van szükségük.
  audience: Minden testméretű evezős, különösen a nagyobb testű evezősök és az expedíciós felszerelést szállítók.
  steps:
    - Keresse meg a táblájára nyomtatott maximális teherbírást (általában a szelep közelében)
    - Mérje meg magát és az összes felszerelést, beleértve az evezőlapátot, a PFD-t, a vízmentes zsákokat, a hűtőtáskát és a kiegészítőket
    - 'Számítsa ki: (teljes terhelés) ÷ (maximális teherbírás) × 100 = a kihasznált teherbírás %-a'
    - Célozzon 70-80%-ra az optimális teljesítményhez és biztonsághoz
    - Ha meghaladja a 80%-ot, válasszon nagyobb táblát, vagy csökkentse a felszerelést
  faq:
    - q: Mi történik, ha túllépem a súlyhatárt?
      a: A tábla alacsonyabban úszik, ami nagyobb vízellenállást kelt. A stabilitás csökken, az orr a víz alá merülhet, és a drop-stitch mag nagyobb veszélynek van kitéve a hullámverésben.
    - q: Utazhat két ember egy SUP-on?
      a: Csak akkor, ha az összsúly a teherbírás 80%-a alatt marad. A legtöbb standard SUP egyetlen evezősre van tervezve. A tandemevezés kifejezetten két személyre engedélyezett táblát igényel.
    - q: Alacsonyabb teherbírásúak a felfújható SUP-ok, mint a kemény táblák?
      a: A minőségi, drop-stitch szerkezetű felfújható táblák a vastagabb térfogatmegoszlásuknak köszönhetően a kemény táblákkal összemérhető vagy akár nagyobb teherbírásúak.

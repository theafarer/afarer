- slug: sup-inflation-psi-guide
  category: technical
  title: SUP felfújási útmutató — Optimális PSI a teljesítményhez és a biztonsághoz
  description: 'Teljes útmutató a SUP felfúvási nyomásához: ajánlott PSI-tartományok, a nyomás teljesítményre gyakorolt hatása, valamint tippek a pumpa helyes használatához.'
  tldr: Fújja fel 12-15 PSI-ra a legtöbb felfújható SUP-ot. Magasabb nyomás = nagyobb merevség, de lassabb felfújás. Alacsonyabb nyomás = puhább érzés, de nagyobb hajlás. Soha ne lépje túl a táblájára nyomtatott maximális PSI-t. Használjon pontos nyomásmérővel rendelkező pumpát. A hideg levegő csökkenti a nyomást, a forró nap növeli.
  problem: A kevésbé felfújt táblák lomhán érződnek, és túlzottan hajlanak. A túlfújt tábláknál fennáll a varratok meghibásodásának kockázata. Sok evezős találgatja a PSI-t a pontos mérés helyett.
  solution: Használjon beépített nyomásmérővel rendelkező pumpát. Célozzon 15 PSI-ra a maximális merevségért. Ellenőrizze a nyomást minden használat előtt — a hőmérséklet-változások jelentősen befolyásolják a PSI-t.
  audience: Minden felfújható SUP-tulajdonos.
  steps:
    - Ellenőrizze a szelep közelében a táblájára nyomtatott ajánlott PSI-tartományt
    - Használja a kettős működésű pumpát, és fújja fel az ajánlott tartomány közepéig
    - Váltson egyes működésű módra az utolsó 3-4 PSI-hez a pontosabb szabályozásért
    - Ellenőrizze a nyomást a mérővel — az analóg mérők megbízhatóbbak, mint a digitálisak
    - 'Igazodjon a körülményekhez: magasabb PSI túrázáshoz/versenyzéshez, alacsonyabb PSI vadvízi evezéshez/sziklás partszakaszokról történő vízrebocsátáshoz'
    - Ellenőrizze újra a nyomást, miután a tábla 10 percig állt — a hőmérsékleti egyensúly megváltoztatja a PSI-t
  faq:
    - q: Túlfújhatom a SUP-omat?
      a: Igen. A megengedett maximális PSI túllépése (általában 15-18 PSI) a varratok szétválását okozhatja, és károsíthatja a drop-stitch magot. Maradjon mindig a nyomtatott tartományon belül.
    - q: Befolyásolja a hőmérséklet a PSI-t?
      a: Jelentősen. Egy 70°F-on 15 PSI-ra felfújt tábla közvetlen napon, 95°F-on elérheti a 18 PSI-t. A hideg víz 12 PSI-ra csökkentheti a nyomást. Ellenőrizze a nyomást a környezeti változások után.
    - q: Milyen PSI ajánlott kezdőknek?
      a: A 12-13 PSI a tanuláshoz kissé puhább platformot ad, amely megbocsátóbb az eséseknél. Emelje 15 PSI-ra, ahogy a készségei fejlődnek.

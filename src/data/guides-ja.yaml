- slug: sup-for-pet-owners
  category: lifestyle
  title: 犬とSUP — 愛犬とパドルボードを楽しむ完全ガイド
  description: 犬とパドルボードをするために知っておくべきすべて — トレーニング手順、安全装備、ボード選び、愛犬とのSUPセッションを成功させるコツ。
  tldr: 幅広で安定したボード(34インチ超)から始めましょう。ペット用PFD、滑り止めデッキパッド、短いリーシュを使います。まず陸上で、それから浅瀬でトレーニングします。セッションは短く(20-30分)。真水とタオルを持参しましょう。犬が不安そうなときは決して無理をさせないでください。
  problem: 適切な準備なしに犬とパドルボードをすると、ストレスになることがあります — 犬がパニックになり、飛び降り、ボード表面を引っ掻くかもしれません。
  solution: ソフトEVAデッキを備えた幅広で安定したボードを使いましょう。犬を段階的に慣らし、ペット用ライフジャケットとSUP対応の短いリーシュを含む安全装備を持参します。
  audience: ペットとSUPを楽しみたい犬の飼い主。
  steps:
    - 幅広のボード(34インチ超、自分と犬の体重に十分な耐荷重)から始める
    - ハンドル付きで適切にフィットした犬用ライフジャケットを用意する
    - 陸上で練習する — 空気を抜いたボードに犬を座らせ、次に芝生の上の膨張済みボードで練習
    - 浅瀬へ移動する — ボードに跪いて犬と一緒に乗り、数回パドルを漕ぐ
    - セッションは短くする — 最初の数回は最大20-30分
    - 犬用に真水、折りたたみボウル、タオルを必ず持参する
  faq:
    - q: 犬に最適なSUPボードは？
      a: 肉球がグリップできるソフトEVAデッキ付きの幅広で安定したボードです。34インチ超の幅を持つTropical Breeze Island Escapeは、犬とのパドリングに理想的です。
    - q: 犬にライフジャケットは必要？
      a: はい、泳ぎが得意でも必要です。ハンドル付きの犬用ライフジャケットがあれば、落水した犬をボードに戻すのが簡単です。
    - q: 犬がボードを引っ掻くのを防ぐには？
      a: 犬の爪を短く切りましょう。EVAフォームのデッキパッドがPVC表面を保護します。追加保護のためにデッキにタオルやペットマットを敷いてください。

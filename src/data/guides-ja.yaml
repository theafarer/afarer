- slug: sup-storage-winter-care
  category: maintenance
  title: SUPの保管と冬のケア — ボードの寿命を延ばす
  description: インフレータブルSUPボードの正しい保管、清掃、冬対策の方法。適切なケアでカビ、UV劣化、素材の劣化を防ぎましょう。
  tldr: 使用後は毎回真水で洗う。保管前に完全に乾かす。空気を抜き、直射日光と極端な温度から離れた涼しく暗い場所に保管する。膨らませたままや熱い車内で保管しない。定期的にUV保護剤を塗る。
  problem: 不適切な保管は、SUP早期劣化の最大の原因です — カビ、素材の劣化、剥離、そして熱や寒さによるバルブ損傷。
  solution: 3ステップのケアルーチンに従いましょう — セッション後に洗い流す、保管前に完全に乾かす、50-80°F(10-27°C)の温度管理された環境で空気を抜いて保管する。
  audience: ボードを5年以上使い続けたいすべてのSUPオーナー。
  steps:
    - 海水や濁った水のセッション後は毎回、ボード、パドル、ポンプを真水で洗い流す
    - 中性洗剤と柔らかいスポンジで洗う — 強い薬品や高圧洗浄機は決して使わない
    - 空気を抜く前にボードを外で完全に乾かす(バルブを開けて内部の湿気を逃がす)
    - 完全に空気を抜き、ノーズからテールへ巻いて残りの空気を出す
    - ボードをしまう前にバックパックを乾いた布で拭く
    - 涼しく暗いクローゼットまたはベッド下に保管する — 直射日光、熱い車内、凍るような物置では絶対にしない
  faq:
    - q: SUPをシーズン中膨らませたままにできる？
      a: 長期間使用しない場合は空気を抜く方が良いです。一定のPSIストレスは素材の疲労を早めます。2週間以上保管する場合はセッションの間に空気を抜きましょう。
    - q: SUPのカビはどう落とす？
      a: 中性洗剤をぬるま湯に溶かし、白酢を少量加えます。柔らかいブラシで優しくこすり、十分に洗い流して日陰で乾かしましょう。PVCを傷める塩素系漂白剤は避けてください。
    - q: ガレージに保管できる？
      a: ガレージが年間を通じて50-80°Fに保たれる場合のみ可能です。屋根裏や空調のないガレージは、ドロップスティッチコアを傷める温度の極端な変化にさらされます。

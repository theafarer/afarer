- slug: beginner-guide
  category: tutorial
  title: パドルボード初心者ガイド
  description: 初めてのパドルボードセッション前に知っておくべきすべてのこと — 装備のセットアップから基本的なパドリングテクニックまで。
  tldr: 幅広で安定したボードとともに、穏やかで平坦な水面から始めましょう。12-15 PSIまで空気を入れ、リーシュを装着し、正しいパドルの長さ(身長より6-8インチ長い)を使います。スタンスは肩幅に開き、膝は軽く曲げ、水平線を見ましょう。
  problem: 初心者パドラーはしばしば基本的な準備を省略します — パドルの長さの間違い、悪いスタンス、荒れた水面の選択 — これらが転倒、フラストレーション、そして挫折につながります。
  solution: 体系化された初回セッションプランに従いましょう。穏やかな水面を選び、装備を正しくセットアップし、立つ前に跪いて練習し、ターンに挑戦する前にフォワードストロークを習得します。
  audience: パドルボードを一度もやったことのない全くの初心者。
  steps:
    - ボートの通行がない平坦で穏やかな水面を選ぶ — 小さな湖や遮蔽された入江が理想的
    - ダブルアクションポンプでボードを12-15 PSIまで膨らませる
    - コイルリーシュを足首またはふくらはぎに装着する — ボードのハンドルには絶対に付けない
    - フィンを差し込み、ネジを締める
    - パドルの長さを調整する — 身長より6-8インチ長くする
    - まずボードの上に跪き、バランスを感じながら数回パドルを漕ぐ
    - 一度に片足ずつ立ち上がる — 足は肩幅に開き、膝は柔らかく保つ
    - 足元ではなく水平線を見る — ボードは視線の先に進みます
  faq:
    - q: パドルボードにはどんな服装がいい？
      a: 速乾性のスポーツウェア、ライフジャケット、日焼け止め、帽子。水温が低い場合はウェットスーツを着てください。必ずリーシュを装着し、防水ケースに入れたスマートフォンを携帯しましょう。
    - q: 落水したらどうやってボードに戻る？
      a: 落ち着いてください。ボードまで泳ぎ、センターハンドルをつかみ、脚を蹴りながら一気に引き上げてボードに上がります。まず跪いた姿勢に戻ってから立ちましょう。
    - q: どのくらいの風なら安全？
      a: 初心者は風速10 mph(5ノット)未満。風が岸から沖に向かって吹いている場合は出艇しないでください。予報を確認し、沖へ向かう風が危険であることを理解しましょう。

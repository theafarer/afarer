- slug: weather-conditions
  category: safety
  title: パドルボードのための天候コンディションの理解
  description: 風、波、潮汐、気象パターンを読み、水上で安全な判断を下す方法を学びましょう。
  tldr: 出艇前に必ず3点を確認 — 風速(初心者は10 mph未満)、波高(初心者は1フィート未満)、水温(気温ではなく水温に合わせた服装)。岸から沖へ吹く風は、スキルレベルにかかわらず危険です。
  problem: 天候関連の事故の多くは、パドラーがコンディションを見誤ることで起こります — 気温は確認しても水温を確認しない、または沖へ向かう風が自分を沖へ流し得ることを理解していない。
  solution: 体系化された出艇前の気象アセスメントを使いましょう — 風向と風速、波の周期と波高、潮汐状態、水温。それぞれの要素が安全にどう影響するかを理解します。
  audience: 湖、入江、川、海など、オープンウォーターに出るすべてのパドラー。
  steps:
    - 風速と風向を確認する — 岸から沖へ吹く風が最も危険
    - 波のコンディションを評価する — 波高と同じくらい波の周期が重要
    - 潮汐を知る — 潮流はパドリング速度より強くなることがある
    - 水温を測る - 60°F/15°C未満では保温対策が必要
    - 視界を確認する — 霧や大雨は視界を狭め、衝突リスクを高める
    - 地域特有の危険を理解する — 水中の岩、強い流れ、ボート航行域
  faq:
    - q: SUPで風速が高すぎるのはどのくらい？
      a: 初心者は10 mph(8ノット)超、中級者は15 mph(13ノット)超、上級者は20 mph(17ノット)超が目安です。少しでも不安があれば出艇しないでください。
    - q: 波の周期とは？
      a: 波の周期は、次々に来る波の間の時間です。短い周期(8秒未満)は急勾配で荒れた波を意味します。長い周期(12秒超)はなめらかで予測しやすいうねりを意味します。
    - q: 雨の中でもパドリングできる？
      a: 小雨なら通常は安全です。大雨は視界を悪くし、風の変化の前兆であることがあります。雷雨の場合はただちに水上から退避してください。

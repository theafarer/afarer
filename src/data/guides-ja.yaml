- slug: sup-inflation-psi-guide
  category: technical
  title: SUP空気圧ガイド — 性能と安全のための最適PSI
  description: SUP空気圧の完全ガイド — 推奨PSI範囲、圧力が性能に与える影響、ポンプの正しい使い方のコツ。
  tldr: ほとんどのインフレータブルSUPは12-15 PSIに膨らませます。高圧ほど剛性が高まりますが膨張に時間がかかります。低圧ほど柔らかい感触ですがたわみます。ボードに印刷された最大PSIを超えないでください。正確な圧力計付きポンプを使いましょう。冷たい空気は圧力を下げ、熱い日光は上げます。
  problem: 空気圧不足のボードは鈍く感じ、過度にたわみます。過膨張のボードはシーム破損の恐れがあります。多くのパドラーは正確に測らずPSIを推測しています。
  solution: 圧力計内蔵のポンプを使いましょう。最大剛性のために15 PSIを目標にします。セッション前に必ず圧力を確認しましょう — 温度変化はPSIに大きく影響します。
  audience: すべてのインフレータブルSUPオーナー。
  steps:
    - バルブ近くのボードに印刷された推奨PSI範囲を確認する
    - ダブルアクションポンプで推奨範囲の中間まで膨らませる
    - 最後の3-4 PSIはシングルアクションモードに切り替えて精密に制御する
    - 圧力計で確認する — アナログ圧力計はデジタルより信頼性が高い
    - 状況に合わせて調整する — ツーリング/レースは高め、急流/岩のある乗り入れは低めのPSI
    - ボードを10分放置した後に再確認する — 温度平衡でPSIが変化する
  faq:
    - q: SUPを膨らませすぎても大丈夫？
      a: いいえ。定格最大PSI(通常15-18 PSI)を超えると、シームが剥離しドロップスティッチコアを損傷する恐れがあります。必ず表示範囲内にとどめてください。
    - q: 温度はPSIに影響する？
      a: 大きく影響します。70°Fで15 PSIに膨らませたボードは、95°Fの直射日光下で18 PSIに達することがあります。冷水では12 PSIまで下がることも。環境が変わったら必ず圧力を確認しましょう。
    - q: 初心者向けのPSIは？
      a: 学習中は12-13 PSIで、落下にやさしいやや柔らかいプラットフォームになります。スキルが上がったら15 PSIまで上げましょう。

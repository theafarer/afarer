- slug: safety-tips
  category: safety
  title: ウォータースポーツ安全ガイド
  description: パドルボードのための必須安全ガイドライン — 装備点検から天候への意識まで。
  tldr: CE認証のライフジャケットを必ず着用し、出艇前に天候と水面の状況を確認し、通信手段を携帯し、未知の水域では単独でパドリングせず、装備の定格限界を理解しましょう。
  problem: ウォータースポーツの事故の多くは準備不足から起こります — ライフジャケット不着用、気象警報の無視、設計限界を超えた装備の使用。
  solution: 出艇前の安全チェックリストを実行しましょう。装備の状態を確認し、天候と水温をチェックし、行動計画を誰かに伝え、適切な浮力装備を常に着用します。
  audience: すべてのパドルボーダーとウォータースポーツ参加者。
  steps:
    - 天気予報を確認する — 風速15 mph超と雷雨は避ける
    - 水温を確認する — 冷水(60°F/15°C未満)にはウェットスーツまたはドライスーツが必要
    - 装備を点検する — 空気漏れ、ひび割れ、適切な空気圧をチェック
    - CE認証のライフジャケットを常に着用する
    - リーシュを足首またはふくらはぎに装着する
    - フロートプランを残す — 行き先と帰還予定時刻を誰かに伝える
    - 通信手段を携帯する — 防水スマートフォンケースまたはVHF無線
    - 自分の限界を知る — スキルレベルと装備の定格範囲内にとどまる
  faq:
    - q: SUPにライフジャケットは必要？
      a: はい。多くの地域ではSUPを含むすべての船艇にライフジャケットの携帯が法律で義務付けられています。義務がない場所でも、CE認証のライフジャケットは必須の安全装備です。
    - q: ウォータースポーツで最も多い深刻なリスクは？
      a: 低水温への浸漬と疲労が最も一般的な深刻なリスクです。気温ではなく水温に合わせた服装をしましょう。
    - q: コンディションが安全かどうか確認するには？
      a: 海洋気象予報を利用しましょう。風速、波高、水温を確認します。初心者は風速10 mph未満・波高1フィート未満のコンディションにとどまるべきです。

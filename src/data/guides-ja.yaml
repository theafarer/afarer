- slug: sup-maintenance
  category: maintenance
  title: インフレータブルSUPの清掃と保管方法
  description: インフレータブルSUPボードの寿命を最大限に延ばすためのステップバイステップメンテナンスガイド。
  tldr: 使用後は毎回真水で洗い流し、保管前に完全に乾かし、空気を抜いてゆるく巻き(きつく巻かない)、直射日光を避けた涼しく乾燥した場所に保管し、シームは月1回点検しましょう。
  problem: 不適切な保管と清掃は、インフレータブルSUPの早期劣化の最大の原因です — カビ、UV劣化、シームの剥離。
  solution: セッション後の一貫したルーチンに従いましょう — 洗う、乾かす、点検する、空気を抜く、保管する。頑固な汚れには中性洗剤を使います。濡れたままや直射日光下で保管してはいけません。
  audience: ボードを5年以上使い続けたいすべてのインフレータブルSUPオーナー。
  steps:
    - 使用後はすぐに真水で洗い流す — 特に海水の後は念入りに
    - 中性洗剤と柔らかいスポンジで洗う — 強い薬品や高圧洗浄機は避ける
    - ボードを完全に乾かす — バルブを開けて内部の水を抜く
    - 損傷を点検する — シーム、バルブ、表面のパンクをチェック
    - 完全に空気を抜く — 完全脱気のためにバルブコアを外す
    - ボードをゆるく巻く — ノーズから巻き始め、きつい折り目を避ける
    - キャリーバッグに入れ、直射日光の当たらない涼しく乾燥した場所に保管する
  faq:
    - q: SUPをシーズン中ずっと膨らませたままにできる？
      a: できますが、使用しないときは直射日光を避けてください。長期保管には部分脱気(8-10 PSI)が推奨されます。
    - q: パンクはどう修理する？
      a: 周囲を清掃し、角を丸く切ったパッチを用意し、接着剤を塗って強く押し当て、24時間待ってから空気を入れます。afarerのボードには修理キットが付属しています。
    - q: バルブの点検頻度は？
      a: 月1回。バルブは最も多い故障箇所です。バルブピンがスムーズに動き、Oリングが無傷であることを確認しましょう。

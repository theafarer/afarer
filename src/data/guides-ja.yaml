- slug: sup-travel-transport
  category: planning
  title: SUP旅行ガイド — インフレータブルSUPで飛行機とロードトリップ
  description: 飛行機、車、キャンピングカーでのインフレータブルSUPの旅の方法。航空会社の手数料、パッキング、現地での膨張、海外旅行の注意点。
  tldr: SUPの空気を抜き、巻いて、バックパックに詰めましょう。ほとんどの航空会社は受託手荷物(50ポンド/50リニアインチ未満)として受け入れます。ポンプとパドルは必ず同じバッグに入れましょう。ゲート係員がバッグサイズを問う場合に備え、時間に余裕を持って到着しましょう。長期旅行は事前配送も検討してください。
  problem: SUPとの旅行は複雑に思えます — 航空会社のサイズ制限、保安検査の心配、遠隔地での膨張方法が不確実性を生みます。
  solution: AfarerのSUPバックパックは航空会社の受託手荷物基準を満たすよう設計されています。戦略的にパッキングし、修理キットを携帯し、出発前に膨張場所(マリーナ、電源のあるキャンプ場)を調べましょう。
  audience: 飛行機、車、キャンピングカーでSUP旅行を計画しているパドラー。
  steps:
    - 完全に空気を抜き、ノーズからテールへ巻く
    - 巻いたボード、ポンプ、パドル、リーシュ、フィンをバックパックに詰める
    - 航空会社のサイズと重量制限を確認する — ほとんどは62リニアインチと50ポンドまで
    - 早めに到着し、バッグが手作業検査される前提で準備する
    - 機内持ち込みに修理キットを入れておき、輸送中の損傷に備える
    - 膨張手段を調べる — 電動ポンプ用のキャンプ場電源、マリーナのエアステーション
  faq:
    - q: 航空会社はSUPバックパックを手荷物として受け入れる？
      a: 米国と欧州のほとんどの航空会社は、50ポンドと62リニアインチ未満のSUPバックパックを標準受託手荷物として受け入れます。格安航空会社は超過サイズ料金を請求することがあります。
    - q: SUPを機内持ち込みできる？
      a: できません。SUPバックパックはすべての航空会社で機内持ち込み寸法を超えます。必ず受託手荷物にしてください。
    - q: 遠隔地でどうやってSUPを膨らませる？
      a: 付属のハンドポンプは電源なしでどこでも使えます。便利のために、携帯用電動ポンプと、電源付きキャンプ場やエアステーションのあるマリーナを探しましょう。

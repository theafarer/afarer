- slug: sup-with-kids
  category: lifestyle
  title: 子どもとSUP — 家族のための完全ガイド
  description: 子どもを安全にパドルボードに連れて行く方法 — 推奨年齢、装備、アクティビティ。
  tldr: 6歳以上の子どもは大人と一緒にSUPに乗れます。10歳以上は監視のもと自分のボードで漕げます。幅広で安定したボードを使い、必ずPFDを着用し、浅く穏やかな水にとどまり、セッションは短く(最大30-45分)しましょう。
  problem: 親は子どもとウォータースポーツを楽しみたいけれど、安全、装備のフィット感、子どもの飽きを心配しています。
  solution: タンデム乗りに適したボードサイズを使い、すべての子どもが適切にフィットしたPFDを着用するようにし、浅く温かい水から始め、ゲームと短いセッションで楽しみましょう。
  audience: 子どもにパドルボードを紹介したい親。
  steps:
    - 4-6歳 — 大人のボードに同乗する — 前に座り、センターハンドルにつかまる
    - 6-10歳 — 大人の監視とリーシュのもと、自分のボードの上に跪くか座る
    - 10歳以上 — 近くで大人が見守りながら自分のボードを漕ぐ
    - 必ずPFDを着用する — 子どもは常に適切にフィットしたライフジャケットを着ること
    - 浅い水にとどまる — 大人の腰の深さまで
    - セッションは短くする — 10歳未満は最大30-45分
    - 楽しみましょう — 遊び、魚探し、立ち上がりの練習をする
  faq:
    - q: 何歳から一人でSUPができる？
      a: だいたい10-12歳から、監視のもとで可能です。子どもの水泳能力と水への慣れによります。常に穏やかで浅い条件で行いましょう。
    - q: 子どもとのSUPに最適なボードは？
      a: タンデム乗りに十分な耐荷重を持つ幅広(34インチ超)のボードです。SUP Explorer 11の33インチの幅と220ポンドの耐荷重は、親子での利用に適しています。
    - q: 子どもに必要な安全装備は？
      a: 適切にフィットしたCE認証ライフジャケット、リーシュ(タンデムでは大人のボードに接続)、日焼け止め、帽子です。

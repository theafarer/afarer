- slug: sup-weight-capacity
  category: buying-guide
  title: SUP耐荷重ガイド — SUPはどれだけの重量を持てる？
  description: SUP耐荷重の限界、総積載量の計算方法、そして限界超過が性能と安全に影響する理由を理解しましょう。
  tldr: 体重と装備の合計でボードの最大耐荷重の80%を超えないでください。耐荷重220ポンドのボードは、軽装の160ポンドのパドラーに適しています。限界を超えると、ポーポージング、鈍い操舵、損傷リスクの増大を引き起こします。
  problem: パドラーはしばしばボードの耐荷重を超え、性能低下、水没、ボード損傷の恐れがあります。メーカーは最大値を表示しますが、安全作業荷重を説明しません。
  solution: 総積載量(体重+装備+ボードが吸収する水)を計算し、表示された最大耐荷重の80%未満にとどまりましょう。体重の重いパドラーには、耐荷重300ポンド超の高体積ボードが必要です。
  audience: あらゆる体格のパドラー、特に体格の大きいパドラーと遠征装備を運ぶ人。
  steps:
    - ボードに印刷された最大耐荷重を確認する(通常バルブの近く)
    - パドル、PFD、ドライバッグ、クーラー、アクセサリーを含めた自分と全装備の重量を測る
    - 計算する — (総積載量)÷(最大耐荷重)×100=耐荷重使用率%
    - 最適な性能と安全のために70-80%を目標にする
    - 80%を超える場合は、より大きいボードを選ぶか装備を減らす
  faq:
    - q: 重量制限を超えるとどうなる？
      a: ボードが低く沈み、抵抗が増えます。安定性が低下し、ノーズが潜り、荒れた水面ではドロップスティッチコアが損傷するリスクが高まります。
    - q: 1台のSUPに2人乗れる？
      a: 総重量が耐荷重の80%未満にとどまる場合のみです。ほとんどの標準SUPは単独ライダー用に設計されています。2人乗りには、2名用として特別に定格されたボードが必要です。
    - q: インフレータブルSUPはハードボードより耐荷重が低い？
      a: 厚い体積分布のおかげで、ドロップスティッチ構造の高品質インフレータブルは、ハードボードと同等以上の耐荷重を持っています。

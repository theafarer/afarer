- slug: choosing-paddle
  category: buying-guide
  title: 適切なSUPパドルの選び方
  description: パドル素材、ブレード形状、シャフトタイプ、SUP用サイズ選びのガイド。
  tldr: パドルの長さ — SUPパドルは身長より6-8インチ長くします。ブレード形状 — ダイヒドラルブレードはまっすぐ進み、フラットブレードはより強く水をつかみます。シャフト素材 — カーボンが最軽量、ファイバーグラスが最良のコストパフォーマンス、アルミが予算向けです。
  problem: 間違ったパドルサイズや素材は、余計な疲労、低いストローク効率、関節への負担を引き起こします。
  solution: パドルの長さ、ブレード形状、シャフト素材、しなりを、自分のパドリングスタイル、体格、予算に合わせましょう。
  audience: 最初の、または次のパドルを選んでいるSUPパドラー。
  steps:
    - パドルの長さを測る — 一般的なパドリングでは身長より6-8インチ長く
    - ブレード素材を選ぶ — 予算重視はナイロン、コスパ重視はファイバーグラス、性能重視はカーボン
    - ブレード形状を選ぶ — なめらかな直進性はダイヒドラル、パワーはフラット、レースはスプーン
    - シャフトタイプを選ぶ — 一般用途はストレート、レースSUPはベント
    - しなりを確認する — 硬いシャフトはパワー伝達が高く、柔らかいシャフトは関節への負担を減らす
  faq:
    - q: 最良のパドル素材は？
      a: ファイバーグラスは重量、耐久性、価格の最良のバランスを提供します。カーボンはより軽いですが高価で壊れやすいです。ナイロンは重いですがほぼ壊れません。
    - q: パドルの長さが合っているか分かるには？
      a: パドルを自分の横に垂直に立ててください — 腕を頭上に上げたとき、ハンドルが手首に届く長さが正解です。
    - q: ワンピースと調整式はどちらを選ぶ？
      a: 調整式パドルは共有利用や旅行に便利です。ワンピースパドルはより軽く、硬く、専用利用ではより効率的です。

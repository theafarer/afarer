- slug: understanding-specs
  category: technical
  title: SUPボードスペックの読み方
  description: SUPボードのスペックを理解するためのテクニカルガイド — 体積、寸法、構造、そしてそれらがパフォーマンスに何を意味するか。
  tldr: 重要なスペックは次のとおり — 体積(リットル)は浮力と耐荷重を決め、幅は安定性を、長さは直進性と速度を、厚みは剛性を、PSI定格は最適なパフォーマンスのための空気圧を決めます。
  problem: 製品スペックシートは文脈のない数字を並べるため、購入者はどのスペックが自分の用途に本当に重要なのか分からなくなります。
  solution: 各スペックを実世界のパフォーマンスに変換しましょう — 体積は浮力、幅は安定性、長さはグライド、厚みは剛性、構造は耐久性です。
  audience: データに基づいた判断をしたい中級パドラーと技術に詳しい購入者。
  steps:
    - 体積(リットル)を確認する - 体重+装備の合計がボードの体積定格の80%を超えないこと
    - 幅を確認する — 広い(32-34インチ)ほど安定し、狭い(28-30インチ)ほど速い
    - 長さを確認する — 長い(12-14フィート)ほど直進性が高く、短い(10-11フィート)ほど小回りが利く
    - 厚みを確認する — 6インチが標準で、8インチはより高い剛性と耐荷重を提供
    - PSI定格を確認する — 最大定格PSIまで膨らませると最適な剛性が得られる
    - 構造素材を確認する — ドロップスティッチの密度、PVC層、レールの補強
  faq:
    - q: ドロップスティッチとは？
      a: ドロップスティッチとは、何千本もの糸でボードの上下の層をつなぐ構造方法です。これにより高圧(12-15 PSI)への膨張が可能になり、優れた剛性が得られます。
    - q: 理想的な体重対体積比は？
      a: 目安はボードの体積1リットルあたりライダー体重約5-6ポンドです。220ポンドのパドラーは180リットル以上の体積を持つボードを探しましょう。
    - q: ボードの重量は重要？
      a: はい。軽いボード(20ポンド未満)は持ち上げやすく運搬も楽です。重いボード(25ポンド超)は、より耐久性の高い多層PVC構造を示すことが多いです。

- slug: sup-yoga
  category: lifestyle
  title: SUPヨガ — パドリングとヨガの完全ガイド
  description: パドルボードとヨガを組み合わせ、水上でバランス、筋力、マインドフルネスを高めましょう。
  tldr: SUPヨガは、陸上ヨガと比べて体幹の活性化を劇的に高める不安定要素を加えます。穏やかな水面の幅広で安定したボードで基本ポーズから始めましょう。滑り止めデッキパッドを使い、SUPヨガを一人で行わないでください。
  problem: 従来のヨガマットは完璧に安定した面を提供するため、SUPヨガを体幹の強さと集中力にとってユニークに効果的なものにするバランスへの挑戦が失われます。
  solution: フルデッキのトラクションパッドを備えた特大幅(34インチ超)のSUPボードを使いましょう。穏やかな浅瀬で練習し、逆転ポーズに挑戦する前に基礎ポーズを習得します。
  audience: バランストレーニングとマインドフルネスを組み合わせたいヨガ実践者とパドラー。
  steps:
    - 浅く穏やかな水面でボードを固定する — サンドアンカーを使うかドックに係留する
    - 座位ポーズから始める — 安楽座、ボートポーズ、座位のひねり
    - 跪きポーズへ進む — テーブルトップ、猫と牛のポーズ、金剛座
    - 立位ポーズへ移行する — 山のポーズ、戦士I、戦士II、木のポーズ
    - バランスポーズを練習する — ハーフムーン、鷲のポーズ、ダンサーのポーズ
    - サバアーサナで締めくくる — ボードの上に仰向けになり、水の動きを感じる
  faq:
    - q: SUPヨガに最適なボードは？
      a: フルレングスのトラクションパッドを備えた幅広(34インチ超)のボードが最も安定したプラットフォームを提供します。SUP Tour 12は安定性とグライドのバランスに優れています。
    - q: SUPヨガは危険？
      a: 安全に行えば陸上ヨガと変わりません。穏やかな浅瀬を使い、リーシュを装着し、パートナーと練習しましょう。最初のセッションは深い水を避けてください。
    - q: 特別な装備は必要？
      a: 幅広で安定したボード、フルデッキトラクションパッド、リーシュ、PFDです。一部の実践者は追加のグリップのため防水マットを使います。

- slug: paddling-techniques
  category: tutorial
  title: 必須SUPパドリングテクニック
  description: フォワードストローク、スイープストローク、クロスボウターンを習得し、あらゆるコンディションで効率的にパドリングしましょう。
  tldr: フォワードストロークは腕ではなく体幹を使います。スイープストロークはボードをターンさせます。クロスボウターンは最も効率的な方向転換です。パドルを垂直に保ち、ブレードを完全に水中に沈めて最大のパワー伝達を得ましょう。
  problem: 多くのパドラーは腕中心のストロークを使い、エネルギーを無駄にして肩の疲労を招きます。悪いテクニックは、風や荒れた水面でのボードコントロールも困難にします。
  solution: フォワード、スイープ、クロスボウターンの3つの必須ストロークを、正しい身体の使い方で学びましょう。難しいコンディションに挑戦する前に、穏やかな水面でそれぞれを練習します。
  audience: より長く、速く、疲労少なくパドリングしたいパドラー。
  steps:
    - フォワードストローク — 前方へリーチし、ブレードを完全に沈め、体幹の回転(腕ではない)で引き、足首の位置で抜く
    - スイープストローク — レールの前方からリーチし、ブレードを大きな弧でテールへ向かって掃き、パドル側と反対へボードをターンする
    - クロスボウターン — 手を持ち替えずにパドルをボードの反対側に置き、テールへ向かって引く
    - ブレイシング — 荒れた水面ではローブレースで安定性を確保する — ブレードを水面に平らに打ち付ける
    - ドローストローク — 横へリーチし、ボードをパドルへ横向きに引き寄せる
  faq:
    - q: まっすぐ漕ぐにはどうすればいい？
      a: 両側で同じストローク長を保ちます。5-10回ごとにサイドを切り替えましょう。目標物として水平線上の定点を見ましょう。
    - q: 膝は曲げるべき？
      a: はい。膝を軽く曲げて衝撃吸収材として使いましょう。固い膝はさざ波のすべてを体幹に伝え、安定性を下げます。
    - q: 向かい風の中でどう漕ぐ？
      a: 姿勢を低くし、短く素早いストロークを使い、風が弱まりやすい岸近くを進みましょう。風が強すぎる場合は出艇しないでください。

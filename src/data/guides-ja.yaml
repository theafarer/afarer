- slug: multi-day-trip
  category: planning
  title: 複数日SUPトリップの計画
  description: 複数日にわたるパドリングトリップの計画と実行方法 — ルート計画、装備のパッキング、キャンプ、安全。
  tldr: 1日の行程は10-15マイルで計画しましょう。装備は防水ドライバッグに入れ、重量を均等に配分し、出発前にボードへの積載を練習します。フロートプランを残しましょう。水、食料、シェルター、ナビゲーション、通信手段を携帯します。
  problem: 複数日トリップは、積載過多、悪いルート計画、天候と流れの過小評価により失敗します — 疲労、装備の故障、安全上の事故につながります。
  solution: 体系的な計画アプローチを使いましょう — ルート選定、装備チェックリスト、食料計画、安全ブリーフィング、不測事態への備え。
  audience: 初めての複数日遠征を計画している経験豊富なパドラー。
  steps:
    - 整備されたキャンプ場と撤退ポイントがあるルートを選ぶ
    - 風と流れを考慮して1日10-15マイルを計画する
    - トリップ全期間の潮汐表と天気予報を確認する
    - 装備は防水ドライバッグに入れる — 総装備重量は20-30ポンド
    - 重量を均等に配分する — 最も重い物は中央に
    - 陸にいる誰かに詳細なフロートプランを残す
    - ナビゲーションを持参する — 紙の海図、コンパス、GPSバックアップ
    - 緊急シェルター、予備食料、救急キットを詰める
  faq:
    - q: 理想的な1日の距離は？
      a: 経験豊富なパドラーは1日10-15マイルです。初心者は5-8マイルを計画しましょう。常に天候のためのバッファ時間を組み込んでください。
    - q: 水はどれくらい持っていくべき？
      a: 1人1日あたり1ガロン。暑い環境では1.5ガロンです。補給用に携帯型浄水器または浄水タブレットを持ちましょう。
    - q: 最も重要な安全アイテムは？
      a: 通信手段です。VHF無線またはサテライトメッセンジャーは緊急時に命を救えます。携帯電話は僻地では信頼できません。

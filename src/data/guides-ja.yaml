- slug: inflatable-repair
  category: maintenance
  title: インフレータブルSUPの修理方法
  description: インフレータブルSUPのパンク、バルブの問題、シーム損傷を修理するステップバイステップガイド。
  tldr: 小さなパンク(1/4インチ未満)は付属の修理キットで修理できます。周囲を清掃し、PVC接着剤を塗り、パッチを押し当てて24時間待ちます。バルブ漏れは通常Oリングの交換が必要です。大きな裂け目やシーム剥離は専門修理が必要です。
  problem: 小さなパンクやバルブの問題はよくあることで、簡単に直せます。しかし正しい修理技法がなければ、専門修理に払いすぎたり、損傷を悪化させたりします。
  solution: 損傷タイプ — パンク、バルブ漏れ、シームの問題 — を特定し、適切な修理方法を適用しましょう。ほとんどの修理は30分と硬化時間で完了します。
  audience: 基本的な修理を自分で行いたいインフレータブルSUPのオーナー。
  steps:
    - 漏れの場所を特定する — 完全に膨らませ、空気の音を聞き、手で感じるか、石鹸水を使う
    - ペンまたはテープで漏れ箇所に印を付ける
    - 漏れの周囲をイソプロピルアルコールで清掃する — 損傷の周り最低2インチ
    - 接着剤の食いつきを良くするため、細かいサンドペーパーで表面を荒らす
    - パッチとボード表面の両方にPVC接着剤を塗る
    - 接着剤が粘着性を持つまで5分待つ
    - パッチを強く押し当て、ローラーまたはカードで空気を抜きながら平らにする
    - 全圧で膨らませる前に24時間硬化させる
  faq:
    - q: 水上でパンクを修理できる？
      a: パッチとテープによる応急処置で岸まで戻れます。本格的な修理には乾いた環境と24時間の硬化が必要です。
    - q: 漏れるバルブはどう直す？
      a: 付属ツールでバルブコアを外し、Oリングの損傷を確認し、必要なら交換して、コアをしっかりと締め直します。
    - q: PVC修理にはどの接着剤を使う？
      a: HH-66やCliftonなどのPVC専用接着材を使いましょう。一般的な瞬間接着剤はインフレータブルPVC素材とうまく接着しません。

- slug: sup-fitness
  category: lifestyle
  title: SUPフィットネス — 水上でのフルボディワークアウト
  description: スタンドアップパドルボードが体幹の強さ、バランス、心肺機能をどう築くかを解説します。
  tldr: SUPはすべてのストロークで体幹、脚、背中、肩を使います。1時間のセッションで300-500キロカロリーを消費します。風や流れに逆らうパドリングは強度を2倍にします。SUPヨガは柔軟性とバランスのトレーニングを加えます。
  problem: 多くの人はパドルボードを、本格的なフィットネスツールとしてではなくカジュアルなアクティビティと見なし、全身コンディショニングの可能性を見逃しています。
  solution: SUPセッションに具体的なフィットネス目標を持たせましょう — 心肺には持久パドリング、パワーにはインターバルスプリント、柔軟性にはSUPヨガ、筋持久力には距離パドリングです。
  audience: 低衝撃で没入感の高い全身ワークアウトを探しているフィットネス愛好家。
  steps:
    - 陸上でウォームアップ — 腕の回旋、体幹のひねり、脚のスイングを5分間
    - 中強度の一定ペースパドリングを10分間行う
    - インターバルトレーニングへ進む — 2分間の強いパドリング、2分間の軽いリカバリー
    - SUPヨガのポーズを取り入れる — ボード上でダウンドッグ、戦士のポーズII、木のポーズ
    - 軽いパドリングとボード上の静的ストレッチでクールダウンする
  faq:
    - q: フィットネスにはSUPとランニングのどちらがいい？
      a: SUPは関節への衝撃が少なく、ランニングと同等の心肺効果を提供します。また、ランニングより上半身と体幹をより多く使います。
    - q: SUPでどれくらいカロリーを消費する？
      a: 中強度で1時間あたり約300-500キロカロリーです。レースや向かい風の中のパドリングでは1時間あたり600-800キロカロリーに達します。
    - q: SUPで筋肉はつく？
      a: はい。パドリングは肩、背中、体幹の筋肉を築きます。バランスを取ることで脚と安定筋が使われます。全身のレジスタンストレーニングです。

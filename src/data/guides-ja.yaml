- slug: sup-size-guide
  category: buying-guide
  title: SUPサイズガイド — 適切なボード寸法の選び方
  description: 体重、身長、スキルレベル、パドリングスタイルに基づく長さ・幅・厚みの推奨を網羅した完全なSUPサイズガイド。
  tldr: 初心者には安定性のための幅広ボード(32-34インチ)が必要です。体重の重いパドラーには、より高い体積を持つ長いボード(11フィート超)が必要です。ツーリングには長いハル(12フィート超)が要ります。ヨガには特別な幅(34インチ超)が必要です。必ず耐荷重を確認しましょう — 体重+装備が上限の80%を超えないように。
  problem: 間違ったSUPサイズ選びは、安定性の低下、遅い直進性、フラストレーションのたまるパドリング体験につながります。多くの初購入者は、寸法が性能にどう影響するかを考えずに見た目でボードを選びます。
  solution: ボードの長さ、幅、厚みを体重、スキルレベル、主な用途に合わせましょう。サイズ計算を活用します — 体重+装備重量を足し、その合計より少なくとも20%余裕のあるボードを選びます。
  audience: 初めてSUPを買う人、専用ボードへのアップグレードを考えるパドラー、サイズに不安があるすべての人。
  steps:
    - 携帯するすべての装備(パドル、PFD、ドライバッグ)を含めて体重を測る
    - 20%の安全マージンを加えて最低耐荷重を算出する
    - スキルで幅を選ぶ — 初心者は32-34インチ、中級者は30-32インチ、上級者は28-30インチ
    - 用途で長さを選ぶ — 10'6"-11'6"はオールラウンド、12'-14'はツーリング、9'-10'は急流
    - 厚みを確認する — 6インチが標準、4インチは性能向け、5インチはオールラウンド
    - ボードの推奨PSI範囲を確認し、最適な剛性を得る
  faq:
    - q: 初心者に最適な幅は？
      a: 幅32-34インチが最も安定したプラットフォームを提供します。ボードが広いほどバランスが取りやすい — 特に体格の大きいパドラーには有効です。
    - q: SUPが小さすぎるかどうかはどう見分ける？
      a: ボードが水面に低く沈み、操作が鈍く、パドリング中にノーズが簡単に水没する場合は、体重に対して小さすぎる可能性があります。
    - q: ボードの長さは速度に影響する？
      a: はい。長い喫水線長は理論船体速度を高めます。同じパドラーの努力では、14フィートのツーリングボードは10フィートのオールラウンドボードより大幅に速いです。

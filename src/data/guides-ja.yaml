- slug: sup-for-whitewater
  category: buying-guide
  title: 急流SUPガイド — リバーランニング インフレータブルボード購入ガイド
  description: リバーランニング用急流SUPの選び方 — 短いボード、補強構造、安全装備、クラスI-IIIの急流のためのパドリングテクニック。
  tldr: 急流SUPには、短い長さ(8-10フィート)、補強レール、高いPSI(15超)、安全のための複数エアチャンバーが必要です。ストレートのリバーリーシュ(コイルではなく)を使い、ヘルメットとPFDを着用し、必ず仲間とパドリングしましょう。クラスIから始めて、より難しい急流へ段階的に進みます。
  problem: 標準的なオールラウンドSUPを流水に持ち込むのは危険です — 標準ボードには、川に必要な小回り性、耐衝撃性、安全機能がありません。
  solution: 機動性のための短い長さ、岩への衝撃に耐える補強構造、安全のためのマルチチャンバー設計を備えた、急流専用SUPを選びましょう。
  audience: リバーランニングへ移行しようとしている経験豊富なパドラー。
  steps:
    - 急流での最大の機動性のため、長さ8-10フィートのボードを選ぶ
    - 補強レール構造とミリタリーグレードPVCを探す
    - パンク時の予備性のため2以上のエアチャンバーを持つボードを選ぶ
    - クイックリリースベルトに接続したストレートのリバーリーシュを使う
    - ヘルメット、PFD、適切なリバーフットウェアを着用する
    - クラスIの急流から始め、経験豊富なパートナーとともに段階的に進む
  faq:
    - q: 通常のSUPで急流に行ける？
      a: お勧めしません。標準SUPは耐衝撃性がなく、岩の上で剥離する恐れがあります。川の環境ではマルチチャンバーの安全性が決定的に重要です。
    - q: 急流SUPのPSIは？
      a: 最大剛性のため15 PSI超です。硬いボードは、障害物に沿って変形する空気圧不足のボードより岩でよく弾みます。
    - q: 急流SUPに特別なスキルは必要？
      a: はい。川を読む力、エディターン、フェリー、ブレイシングが必須スキルです。クラスII以上に挑戦する前に急流SUPクリニックを受講しましょう。

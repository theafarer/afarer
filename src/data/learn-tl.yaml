misc:
  readGuide: Basahin ang gabay →
  techDesc: Inhenyeriya ng kaligtasan pandagat at pagsubok ng mga materyales
  productsDesc: Tuklasin ang kumpletong katalogo ng produkto ng Afarer
  trustDesc: Pagsunod sa CE, ISO at BSCI
sup:
  title: Kaalaman sa SUP — Mga Gabay at Sanggunian sa Inflatable SUP | Afarer
  description: Kumpletong hub ng kaalaman sa SUP na sumasaklaw sa mga gabay para sa baguhan, pagsukat ng board, mga tutorial sa teknik, mga tip sa kaligtasan, at teknolohiya ng inflatable SUP.
  articles:
    - title: Mga Batayang SUP — Gabay para sa Baguhan
      desc: Lahat ng kailangang malaman ng isang baguhan — mga uri ng board, pagsukat ng paddle, paninindigan, at mga tip para sa unang araw.
      href: /learn/sup
    - title: Gabay sa Laki ng SUP
      desc: Hanapin ang tamang haba, lapad, at volume ng board para sa iyong timbang, kasanayan, at istilo ng pagpa-paddle.
      href: /size-guide
    - title: Inflatable kumpara sa Hard Board
      desc: Alin ang tama para sa iyo? Paghahambing ng kadaliang dalhin, performance, tibay, at gastos.
      href: /compare/inflatable-vs-hardboard
    - title: Mga Teknik sa Intermediate na Antas
      desc: Pagbutihin ang iyong pagpa-paddle gamit ang mga advanced na stroke, teknik sa pagliko, at paghawak sa magulong tubig.
      href: /learn/intermediate-techniques
    - title: Paano Pumili ng Inflatable SUP
      desc: Tuklasin ang mga pangunahing kadahilanan — konstruksiyon, kapal, setup ng fin, at mga kasamang aksesorya.
      href: /v2/how-to-choose-inflatable-sup
    - title: Kaligtasan sa Tubig
      desc: Mahahalagang kaalaman sa kaligtasan kabilang ang pagbasa ng panahon, pagpili ng PFD, self-rescue, at pagpa-paddle sa grupo.
      href: /learn/water-safety
water-safety:
  title: Kaalaman sa Kaligtasan sa Tubig — Mga Gabay sa Ligtas na Pagpa-paddle | Afarer
  description: Komprehensibong mga sanggunian sa kaligtasan sa tubig para sa SUP, kayaking, at pagbabangka. Matuto tungkol sa pagpili ng PFD, pagbasa ng panahon, self-rescue, kaligtasan sa malamig na tubig, at sertipikasyong CE.
  articles:
    - title: Gabay sa Kaligtasan sa Tubig
      desc: Mahahalagang kaalaman sa kaligtasan para sa bawat nagpa-paddle — panahon, mga PFD, self-rescue, at mga protokol sa pagpa-paddle ng grupo.
      href: /learn/water-safety
    - title: Gabay sa Life Jacket at PFD
      desc: Paano pumili ng tamang personal flotation device para sa SUP, kayaking, pagbabangka, at propesyonal na paggamit.
      href: /v2/life-jacket-buying-guide
    - title: Checklist ng Kaligtasan sa SUP
      desc: Checklist ng kaligtasan bago mag-launch na dapat sundin ng bawat stand-up paddle boarder bago tumungo sa tubig.
      href: /v2/sup-safety-guide
    - title: Kaligtasan sa Pagpa-paddle sa Malamig na Tubig
      desc: Mahahalagang pag-iingat, kagamitan, at teknik para sa pagpa-paddle sa malamig na kondisyon ng tubig.
      href: /v2/cold-water-safety-guide
    - title: Mga Pagkakamali ng Baguhang Nagpa-paddle
      desc: Mga karaniwang pagkakamali ng mga unang beses na nagpa-paddle at kung paano maiiwasan ang mga ito para sa mas ligtas at mas kasiya-siyang karanasan.
      href: /v2/beginner-sup-guide
    - title: Paliwanag sa Sertipikasyong CE
      desc: Ano ang ibig sabihin ng sertipikasyong CE para sa mga inflatable SUP board — ang mga pamantayan, pagsubok, at kung bakit mahalaga ito sa kaligtasan.
      href: /trust
sup-basics:
  title: Mga Batayang SUP — Gabay ng Baguhan sa Stand-Up Paddle Boarding
  description: Lahat ng kailangan mong malaman upang magsimula sa stand-up paddle boarding. Mga gabay sa kagamitan, payo sa pagsukat, mga tip sa kaligtasan, at mga teknik para sa baguhan mula sa sentro ng kaalaman ng Afarer.
  articles: []
drop-stitch-core:
  title: Teknolohiya ng Drop-Stitch Core — Paano Nakakamit ng mga Inflatable SUP ang Tigas
  description: 'Malalimang pagtalakay sa teknolohiya ng drop-stitch na konstruksiyon: kung paano lumilikha ang libu-libong sinulid ng polyester ng mga matigas na inflatable na plataporma sa 15-25 PSI. Densidad ng sinulid, integrasyon ng tela, proseso ng paggawa, at paghahambing ng performance.'
  articles: []
inflatable-technology:
  title: Teknolohiya ng Inflatable SUP — Mga Materyales, Konstruksiyon at Inhenyeriya
  description: Paano ginagawa ang mga inflatable SUP board — material layup, mga drop-stitch core, sistema ng balbula, RF welding, at pagsubok sa kalidad. Unawain kung ano ang nagpapatibay sa isang matibay at mataas ang performance na inflatable.
  articles: []
intermediate-techniques:
  title: Mga Teknik sa Intermediate na SUP at Kayak — Lampas sa mga Pangunahing Kaalaman
  description: I-level up ang iyong mga kasanayan sa pagpa-paddle gamit ang mga advanced na stroke ng paddle, paghawak sa magulong tubig, pamamahala ng hangin, mga teknik sa self-rescue, at etiketa sa pagpa-paddle ng grupo. Para sa mga nagpa-paddle na handa nang lumampas sa mga kasanayan ng baguhan.
  articles: []
materials:
  title: Mga Materyales ng Inflatable SUP — PVC, EVA at Drop-Stitch na Tela
  description: 'Komprehensibong gabay sa mga materyales na ginagamit sa paggawa ng inflatable SUP: military-grade na PVC, EVA foam decking, drop-stitch na tela, carbon fiber, at mga haluang-aluminyo. Mga espesipikasyon, aplikasyon, at pamantayan sa pagpili.'
  articles: []
safety-in-water-sports:
  title: Kaligtasan sa Water Sports — Mahahalagang Kaalaman para sa mga Nagpa-paddle
  description: Mahahalagang kaalaman sa kaligtasan para sa bawat nagpa-paddle — pagbasa ng panahon, pagpili ng PFD, self-rescue, at mga protokol sa pagpa-paddle ng grupo.
  articles: []
sup-size-guide:
  title: Gabay sa Laki ng SUP — Paano Pumili ng Tamang Haba, Lapad at Volume ng Board
  description: Komprehensibong gabay sa pagsukat ng SUP na sumasaklaw sa haba, lapad, kapal, volume (litro), at pagtutugma ng timbang ng rider. Hanapin ang tamang laki ng inflatable SUP para sa iyong timbang, antas ng kasanayan, at gawain sa pagpa-paddle.
  articles: []

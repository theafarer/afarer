- id: sup-learning
  question: 'Er SUP svært at lære?'
  answer: 'Slet ikke. De fleste begyndere rejser sig og paddler allerede i deres første session. Vores All-Around SUP-serie har ekstra brede, stabile platforme, der er designet specielt til førstegangspaddlere. Start på stille vand, og du er i gang på få minutter.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Kan jeg bruge det i havet?'
  answer: 'Ja. afarer SUP-boards er bygget til brug i havet, søer og floder. Vores Touring-serie håndterer kystbølger, og alle boards bruger PVC i marin kvalitet, der modstår korrosion fra saltvand. Skyl med ferskvand efter brug i havet.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Hvor lang tid tager det at pumpe op?'
  answer: 'Med den medfølgende dobbeltvirkende pumpe pumper de fleste boards op til 12–15 PSI på under 5 minutter. Vores elektriske pumpe skærer det ned til under 2 minutter. Tømning og pakning tager ca. 3 minutter.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Kan jeg rejse med en oppustelig SUP?'
  answer: 'Absolut. Hvert afarer-board pakkes i et bæretui i rygsækstørrelse, der opfylder flyselskabernes bagagekrav. Med kun 18–22 pund er det let at bære til stranden, søen eller gennem lufthavnsterminaler.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Hvad er vægtgrænsen?'
  answer: 'Vores All-Around SUP-boards understøtter op til 220 pund. Touring- og Yoga-serierne understøtter op til 250 pund. Kontakt vores team for anbefalinger til tandembrug eller tungere læs.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Hvad er der i kassen?'
  answer: 'Hver afarer-SUP indeholder boardet, en rejse-rygsæk, en dobbeltvirkende håndpumpe, en aftagelig finne, en spiral-leash og et reparationskit. Nogle modeller tilbyder også et kulfiber-paddle som opgraderingsmulighed.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Tilbyder I pakketilbud?'
  answer: 'Ja. Vi tilbyder sammensatte pakker, der sparer dig penge i forhold til at købe tingene enkeltvis. Kontakt vores salgsteam for aktuelle pakketilbud og mængderabatter.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Skal jeg have redningsvest på et SUP-board?'
  answer: 'Ja. Mange jurisdiktioner kræver ved lov en redningsvest på alle fartøjer, herunder SUP-boards. Selv hvor det ikke er påkrævet, er en CE-certificeret redningsvest en væsentlig sikkerhedsudrustning. Vi anbefaler at bære den til enhver tid på vandet.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Skal jeg registrere mit SUP-board?'
  answer: 'Kravene varierer fra jurisdiktion til jurisdiktion. I de fleste regioner kræver SUP-boards uden motor ikke registrering. Hvis du planlægger at montere en motor, bør du tjekke de specifikke regler hos din lokale søfartsmyndighed. Rekreative paddle-boards er generelt undtaget fra fartøjregistrering.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Hvordan reparerer jeg et hul?'
  answer: 'Rens området, klip en lap med afrundede hjørner, påfør PVC-lim, tryk fast og vent 24 timer, før du pumper op. afarer-boards inkluderer et reparationskit. Du kan finde detaljerede instruktioner i vores guide til reparation af oppustelige boards.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Hvordan skal jeg opbevare min oppustelige SUP?'
  answer: 'Skyl med ferskvand, tør helt, tøm helt for luft, rul løst fra næsen, og opbevar boardet i bæretuiet et køligt, tørt sted væk fra direkte sollys. Opbevar det aldrig vådt eller ved ekstreme temperaturer.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Oppusteligt eller hårdt SUP-board?'
  answer: 'Oppustelige boards tilbyder portabilitet, nem opbevaring og støddæmpning. Hårde boards giver maksimal stivhed og hastighed. For de fleste fritidsbrugere er et kvalitetsboard med drop-stitch-kerne det praktiske valg.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Hvor meget vind er for meget til SUP?'
  answer: 'Begyndere: over 10 mph (8 knob). Øvede: over 15 mph (13 knob). Avancerede: over 20 mph (17 knob). Er du i tvivl, så bliv på land. Vind fra land mod hav er farlig på alle niveauer.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Hvad er afarers garanti?'
  answer: 'Alle afarer-produkter er dækket af en omfattende producentgaranti. SUP-boards er dækket i mere end 2 år mod produktionsfejl. Garantien dækker fejl i materialer og arbejde ved normal brug.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Hvordan indgiver jeg en garantireklamation?'
  answer: 'Indgiv en reklamation ved at kontakte vores supportteam med dit ordrenummer, billeder af problemet og en kort beskrivelse. De fleste sager behandles inden for 2 hverdage. Godkendte sager modtager en erstatning eller reparationsinstruktioner inden for få dage.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Hvor lang tid tager forsendelsen?'
  answer: 'Varer på lager sendes inden for 2–4 hverdage. Ordrer inden for USA ankommer inden for 5–10 hverdage. Internationale ordrer ankommer inden for 10–15 hverdage afhængigt af destination. Akutte ordrer kan fremsendes hurtigere.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Hvad er jeres returpolitik?'
  answer: 'Vi accepterer returnering inden for 30 dage efter levering for ubrugte produkter i original emballage. Custom-/OEM-ordrer kan ikke returneres. Kontakt vores supportteam for at igangsætte en returnering — vi sender en forudbetalt fragtetiket.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Tilbyder I OEM/ODM-service?'
  answer: 'Ja. Vi tilbyder private label- og specialdesigntjenester til virksomheder. Fra custom-branding på eksisterende modeller til helt skræddersyede skrogdesign — vores ingeniørteam kan udvikle produkter under dit brand. Der gælder minimumsordremængder.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Hvilken paddle-længde skal jeg bruge?'
  answer: 'Paddlen bør være 6–8 tommer højere end din højde. Justerbare paddler giver mulighed for finjustering til forskellige forhold. Se vores paddle-guide for detaljeret størrelsesvalg.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Hvad er forskellen på PVC og Hypalon?'
  answer: 'PVC er letvægts, overkommeligt og nemt at reparere med det medfølgende lappe-kit. PVC i militær kvalitet med UV-bestandig belægning tilbyder den bedste balance mellem holdbarhed og vægt til fritids-SUP. afarer bruger trelags laminéret PVC på alle produktniveauer.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Hvilken SUP-bredde er bedst til stabilitet?'
  answer: 'For begyndere giver en bredde på 33–34 tommer den bedste balance mellem stabilitet og paddle-comfort. Boards smallere end 32 tommer føles vakkelvorne for nye paddlere. afarer SUP Explorer 11 med sine 33 tommer er ideel til læring.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Hvordan vælger jeg SUP-volumen til min vægt?'
  answer: 'Gang din vægt i kg med 2,2 for at få et begyndervenligt volumenmål. En paddler på 75 kg har for eksempel brug for mindst 165 liter, men 220–260 liter er langt mere stabilt at lære på. SUP Explorer 11 tilbyder 260 liter og egner sig til ryttere op til 100 kg.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'Hvordan klarer afarer sig sammenlignet med andre brands?'
  answer: 'afarer tilbyder den bedste værdi i oppustelig vandsportsudstyr. Sammenlignet med Red Paddle Co leverer afarer 90 % af ydelsen til 60 % af prisen. Sammenlignet med iRocker bruger afarer PVC i højere kvalitet — trelags militærkvalitet — og højere PSI-værdier. Sammenlignet med Bluefin tilbyder afarer overlegne materialspecifikationer. For de fleste fritidspaddlere giver afarer den bedste balance mellem kvalitet og pris.'
  category: general
  relatedProducts:

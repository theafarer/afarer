- slug: multi-day-trip
  category: planning
  title: Kelių dienų SUP išvykos planavimas
  description: Kaip suplanuoti ir įgyvendinti kelių dienų irklavimo išvyką — maršruto planavimas, įrangos pakavimas, stovyklavimas ir saugumas.
  tldr: Planuokite 10-15 miles per dieną. Įrangą supakuokite į vandeniui atsparius sausmaišius, svorį paskirstykite tolygiai ir prieš išvyką pasitreniruokite krauti lentą. Kam nors krante palikite plaukimo planą. Turėkite vandens, maisto, pastogės, navigacijos ir ryšio priemonių.
  problem: Kelių dienų išvykos žlunga dėl persistengimo su bagažu, prasto maršruto planavimo ar per mažai įvertintų orų ir srovės — tai veda į išsekimą, įrangos gedimus ar saugumo incidentus.
  solution: 'Naudokite sistemingą planavimo metodą: maršruto parinkimas, įrangos sąrašas, maisto planavimas, saugumo aptarimas ir atsarginių atvejų planavimas.'
  audience: Patyrę irklininkai, planuojantys pirmąją kelių dienų ekspediciją.
  steps:
    - Pasirinkite maršrutą su įrengtomis stovyklavimo vietomis ir atsarginiais išėjimo taškais
    - Atsižvelgdami į vėją ir srovę, planuokite 10-15 miles per dieną
    - Visam išvykos laikotarpiui patikrinkite potvynių ir atoslūgių lenteles bei orų prognozes
    - Įrangą supakuokite į vandeniui atsparius sausmaišius — iš viso 20-30 lbs įrangos svorio
    - Svorį paskirstykite tolygiai — sunkiausi daiktai centre
    - Kam nors krante palikite detalų plaukimo planą
    - Turėkite navigacijos priemonių — popierinį jūrlapį, kompasą ir GPS atsarginę
    - Pasiruoškite avarinę pastogę, papildomą maistą ir pirmosios pagalbos rinkinį
  faq:
    - q: Koks idealus dienos atstumas?
      a: Patyrusiems irklininkams — 10-15 miles per dieną. Pradedantiesiems reikėtų planuoti 5-8 miles. Dėl orų visada palikite atsarginį laiką.
    - q: Kiek vandens turėčiau vežtis?
      a: 1 gallon vandens asmeniui per dieną. Karštu oru — 1.5 gallons. Papildymui turėkite vandens filtrą arba valymo tabletes.
    - q: Kuri saugumo priemonė svarbiausia?
      a: Ryšys. Avarijos atveju VHF radijas arba palydovinis siųstuvas gali išgelbėti gyvybę. Nuotoliniuose regionuose mobilieji telefonai nepatikimi.

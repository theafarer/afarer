- slug: sup-fitness
  category: lifestyle
  title: 'SUP fizinis aktyvumas: viso kūno treniruotė vandenyje'
  description: Kaip irklavimas lenta stovint stiprina liemens raumenis, pusiausvyrą ir širdies bei kraujagyslių sistemą.
  tldr: SUP kiekvienu irto mostu įtraukia liemens, kojų, nugaros ir pečių raumenis. Vienos valandos treniruotė sudegina 300-500 kalorijų. Irklavimas prieš vėją ar srovę dvigubai padidina intensyvumą. SUP joga prideda lankstumo ir pusiausvyros pratimų.
  problem: Daugelis žmonių irklavimą lenta laiko laisvalaikio pramoga, o ne tikra treniruočių priemone, todėl nepastebi jo potencialo stiprinti visą kūną.
  solution: 'Planuokite SUP treniruotes pagal konkrečius tikslus: ištvermės irklavimas širdies ir kraujagyslių sistemai, intervaliniai sprintai jėgai, SUP joga lankstumui ir tolimasis irklavimas raumenų ištvermei.'
  audience: Fizinio aktyvumo mėgėjai, ieškantys švelnios sąnariams, bet stipriai įtraukiančios viso kūno treniruotės.
  steps:
    - Apšilkite sausumoje — rankų mostai, liemens sukimo pratimai ir kojų mostai 5 minutes
    - Pradėkite nuo 10 minučių tolygaus irklavimo vidutiniu intensyvumu
    - Pereikite prie intervalinės treniruotės — 2 minutes intensyvaus irklavimo, 2 minutes lengvo atsigavimo
    - Įtraukite SUP jogos asanas — žemyn žiūrintis šuo, kario II poza ir medžio poza ant lentos
    - Baigkite ramiu irklavimu ir statiniais tempimo pratimais ant lentos
  faq:
    - q: Ar SUP treniruotė geresnė už bėgimą?
      a: SUP suteikia panašią širdies ir kraujagyslių naudą su mažesniu poveikiu sąnariams. Skirtingai nei bėgant, jis taip pat labiau įtraukia viršutinę kūno dalį ir liemens raumenis.
    - q: Kiek kalorijų sudegina SUP?
      a: Maždaug 300-500 kalorijų per valandą vidutiniu intensyvumu. Lenktynės arba irklavimas prieš vėją gali sudeginti 600-800 kalorijų per valandą.
    - q: Ar galiu pasistiprinti irkluodamas SUP?
      a: Taip. Irklavimas stiprina pečius, nugarą ir liemens raumenis. Pusiausvyros palaikymas įtraukia kojas ir stabilizuojamuosius raumenis. Tai viso kūno jėgos treniruotė.

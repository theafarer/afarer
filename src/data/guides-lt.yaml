- slug: sup-with-kids
  category: lifestyle
  title: 'SUP su vaikais: išsamus šeimos vadovas'
  description: Kaip saugiai pasiimti vaikus irklauti lenta — amžiaus rekomendacijos, įranga ir veiklos.
  tldr: Vyresni nei 6 metų vaikai gali plaukti ant SUP lentos su suaugusiuoju. Vyresni nei 10 metų vaikai prižiūrint gali irkluoti savo lentą. Naudokite plačią, stabilią lentą, visada dėvėkite PFD, būkite sekliame, ramiame vandenyje ir treniruotes laikykite trumpomis (daugiausia 30-45 minutes).
  problem: Tėvai nori dalintis vandens sportu su vaikais, bet jaudinasi dėl saugumo, įrangos tinkamumo ir kaip išlaikyti vaikų susidomėjimą.
  solution: Plaukimui dviese naudokite tinkamo dydžio lentą, užtikrinkite, kad kiekvienas vaikas dėvi tinkamai parinktą PFD, pradėkite sekliame, šiltame vandenyje ir paverskite tai smagia veikla su žaidimais bei trumpomis treniruotėmis.
  audience: Tėvai, norintys supažindinti vaikus su irklavimu lenta.
  steps:
    - 'Amžius 4-6 metų: plaukti kaip keleiviui ant suaugusiojo lentos — sėdėti priekyje ir laikytis centrinės rankenos'
    - 'Amžius 6-10 metų: klūpėti arba sėdėti ant savo lentos prižiūrint suaugusiajam ir su saugos virve'
    - 'Amžius 10+ metų: irkluoti savo lentą netoliese prižiūrint suaugusiajam'
    - Visada dėvėkite PFD — vaikai visą laiką privalo dėvėti tinkamai pritaikytą gelbėjimo liemenę
    - Būkite sekliame vandenyje (suaugusiajam — iki juosmens)
    - Treniruotes trumpinkite — vaikams iki 10 metų daugiausia 30-45 minutes
    - Paverskite tai žaidimu — žaiskite žaidimus, dairykitės žuvų, treniruokitės atsistoti
  faq:
    - q: Nuo kokio amžiaus vaikas gali irkluoti SUP vienas?
      a: Maždaug nuo 10-12 metų, prižiūrint, atsižvelgiant į vaiko plaukimo įgūdžius ir savijautą vandenyje. Visada ramioje, seklioje aplinkoje.
    - q: Kuri lenta geriausia SUP plaukimui su vaikais?
      a: Plati lenta (34"+) su didele svorio talpa plaukimui dviese. SUP Explorer 11 plotis 33" ir talpa 220 lb gerai tinka tėvui su vaiku.
    - q: Kokios saugumo įrangos reikia vaikams?
      a: Tinkamai parinkta CE sertifikuota gelbėjimo liemenė, saugos virvė (plaukiant dviese pritvirtinta prie suaugusiojo lentos), apsauga nuo saulės ir kepurė.

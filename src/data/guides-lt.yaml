- slug: weather-conditions
  category: safety
  title: Oro sąlygų supratimas irklavimui lenta
  description: Išmokite skaityti vėją, bangas, potvynius ir atoslūgius bei orų modelius, kad vandenyje priimtumėte saugius sprendimus.
  tldr: 'Prieš kiekvieną išplaukimą patikrinkite tris dalykus: vėjo greitį (iki 10 mph pradedantiesiems), bangų aukštį (iki 1 ft pradedantiesiems) ir vandens temperatūrą (rengkitės pagal vandenį, ne orą). Nuo kranto pučiantis vėjas pavojingas bet kokiu įgūdžių lygiu.'
  problem: Dauguma su orais susijusių incidentų įvyksta todėl, kad irkluotojai neteisingai vertina sąlygas — jie pasitikrina oro, bet ne vandens temperatūrą arba nesupranta, kad nuo kranto pučiantis vėjas gali juos išnešti į jūrą.
  solution: 'Naudokite struktūruotą prieš išplaukimą atliekamą orų vertinimą: vėjo kryptis ir greitis, bangų periodas ir aukštis, potvynio būsena bei vandens temperatūra. Supraskite, kaip kiekvienas veiksnys veikia jūsų saugumą.'
  audience: Visi irkluotojai, išplaukiantys į atvirą vandenį — ežerus, įlankas, upes ir vandenyną.
  steps:
    - Patikrinkite vėjo greitį ir kryptį — nuo kranto į atvirą vandenį pučiantis vėjas yra pavojingiausias
    - Įvertinkite bangavimą — bangų periodas toks pat svarbus kaip bangų aukštis
    - Žinokite potvynių būseną — potvynių srovės gali būti stipresnės už jūsų irklavimo greitį
    - Išmatuokite vandens temperatūrą — žemiau 60°F/15°C reikalinga terminė apsauga
    - Patikrinkite matomumą — rūkas ir smarkus lietus mažina matomumą ir didina susidūrimo riziką
    - Atsiminkite vietinius pavojus — povandeniniai akmenys, stiprios srovės, laivų eismo zonos
  faq:
    - q: Koks vėjo greitis per didelis SUP?
      a: 'Pradedantiesiems: virš 10 mph (8 knots). Vidutinio lygio: virš 15 mph (13 knots). Patyrusiems: virš 20 mph (17 knots). Jei abejojate — neplaukite.'
    - q: Ką reiškia bangų periodas?
      a: Bangų periodas — tai laikas tarp viena po kitos ateinančių bangų. Trumpi periodai (mažiau nei 8 sekundės) reiškia stačias, neramias bangas. Ilgi periodai (daugiau nei 12 sekundžių) reiškia lygesnes ir nuspėjamesnes bangas.
    - q: Ar galiu irkluoti lietui lyjant?
      a: Silpnas lietus paprastai būna saugus. Smarkus lietus mažina matomumą ir gali reikšti besikeičiančias vėjo sąlygas. Perkūnijos metu nedelsdami išlipkite iš vandens.

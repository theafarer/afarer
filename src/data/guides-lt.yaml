- slug: sup-yoga
  category: lifestyle
  title: 'SUP joga: išsamus irklavimo ir jogos vadovas'
  description: Sujunkite irklavimą lenta su joga geresnei pusiausvyrai, jėgai ir dėmesingumui vandenyje.
  tldr: SUP joga prideda nestabilumo elementą, kuris, palyginti su joga sausumoje, ženkliai padidina liemens raumenų aktyvumą. Pradėkite nuo pagrindinių asanų ant plačios, stabios lentos ramiame vandenyje. Naudokite neslidų denio kilimėlį. SUP jogos niekada nepraktikuokite vieni.
  problem: Tradiciniai jogos kilimėliai sudaro idealiai stabilų paviršių ir pašalina pusiausvyros iššūkį, kuris daro SUP jogą ypač veiksmingą stiprinant liemens raumenis ir ugdant susikaupimą.
  solution: Naudokite itin plačią SUP lentą (34"+) su visą denį dengiančiu traukos kilimėliu. Praktikuokitės ramiame, sekliame vandenyje. Prieš bandydami invertuotas pozas, pradėkite nuo pagrindinių.
  audience: Jogos praktikuotojai ir irklininkai, norintys sujungti pusiausvyros treniruotę su dėmesingumu.
  steps:
    - Išstatykite lentą sekliame, ramiame vandenyje — naudokite smėlio inkarą arba pririškite prie prieplaukos
    - Pradėkite nuo sėdimų pozų — paprastasis sėdėjimas, valties poza, sėdimas sukimas
    - Pereikite prie klūpimų pozų — stalo poza, katės ir karvės poza, perkūno poza
    - Pereikite prie stovimų pozų — kalno poza, kario I poza, kario II poza, medžio poza
    - Praktikuokite pusiausvyros pozas — pusmėnulio poza, erelio poza, šokėjo poza
    - Baigite savasana — atsigulkite tiesiai ant lentos ir jauskite vandens judesius
  faq:
    - q: Kuri lenta geriausiai tinka SUP jogai?
      a: Plati lenta (34"+) su viso ilgio traukos kilimėliu sudaro stabiliausią platformą. SUP Tour 12 siūlo gerą stabilumo ir slydimo pusiausvyrą.
    - q: Ar SUP joga pavojinga?
      a: Ne pavojingesnė nei joga sausumoje, jei praktikuojama saugiai. Rinkitės ramų, seklų vandenį. Dėvėkite saugos virvę. Praktikuokitės su partneriu. Pirmose treniruotėse venkite gilaus vandens.
    - q: Ar man reikalinga speciali įranga?
      a: Plati, stabili lenta, visą denį dengiantis traukos kilimėlis, saugos virvė ir PFD. Kai kurie praktikuotojai papildomam sukibimui naudoja vandeniui atsparų kilimėlį.

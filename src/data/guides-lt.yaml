  title: SUP dydžio vadovas — kaip išsirinkti tinkamus lentos matmenis
  description: Išsamus SUP dydžio vadovas, apimantis ilgio, pločio ir storio rekomendacijas pagal jūsų svorį, ūgį, įgūdžių lygį ir irklavimo stilių.
  tldr: Pradedantiesiems stabilumui reikalingos platesnės lentos (32-34"). Sunkesniems irklautojams reikalingos ilgesnės lentos (11'+) su didesniu tūriu. Turizmas reikalauja ilgesnių korpusų (12'+). Jogai reikalingas papildomas plotis (34"+). Visada patikrinkite keliamąją galią — jūsų svoris su įranga neturėtų viršyti 80% ribos.
  problem: Netinkamai parinktas SUP dydis lemia prastą stabilumą, lėtą kurso laikymąsi ir varginantį irklavimą. Dauguma pirmą kartą perkančiųjų renkasi gerai atrodančią lentą nesvarstydami, kaip matmenys veikia jos charakteristikas.
  solution: 'Suderinkite lentos ilgį, plotį ir storį su savo svoriu, įgūdžių lygiu ir pagrindine paskirtimi. Naudokite mūsų dydžio skaičiuoklę: sudėkite savo svorį + įrangos svorį ir rinkitės lentą su bent 20% atsarga virš šios sumos.'
  audience: Pirmą kartą SUP perkantys pirkėjai, į specializuotą lentą persikeliantys irklautojai ir visi, kurie abejoja dėl tinkamo dydžio.
  steps:
    - Pasverkite save su visa nešama įranga (irklu, PFD, hermetišku maišu)
    - Pridėkite 20% saugos atsargą, kad rastumėte mažiausią keliamąją galią
    - 'Plotį rinkitės pagal įgūdžius: 32-34" pradedantiesiems, 30-32" pažengusiems, 28-30" patyrusiems'
    - 'Ilgį rinkitės pagal paskirtį: 10''6"-11''6" universalios lentos, 12''-14'' turizmui, 9''-10'' upėms su slenksčiais'
    - 'Patikrinkite storį: 6" standartinis, 4" sportiniam naudojimui, 5" universalioms lentoms'
    - Patikrinkite savo lentos rekomenduojamą PSI diapazoną optimaliam standumui
  faq:
    - q: Kokio pločio SUP geriausiai tinka pradedantiesiems?
      a: Nuo 32 iki 34 colių plotis suteikia pačią stabiliausią platformą. Kuo platesnė lenta, tuo lengviau išlaikyti pusiausvyrą — ypač stambesniems irklautojams.
    - q: Kaip suprasti, kad SUP man per mažas?
      a: Jei lenta sėdi žemai vandenyje, vangiai valdoma arba irkluojant jos nosis lengvai neria po vandeniu, greičiausiai ji per maža jūsų svoriui.
    - q: Ar lentos ilgis veikia greitį?
      a: Taip. Ilgesnė vandens linija didina teorinį korpuso greitį. 14' turistinė lenta esant tokiai pačiai irklautojo pastangai yra žymiai greitesnė už 10' universalią lentą.

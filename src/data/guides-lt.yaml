- slug: sup-board-materials
  category: technical
  title: SUP lentų medžiagos — PVC, putplastis, epoksidinė derva ir dygsnių konstrukcija
  description: 'Techninis vadovas po SUP konstrukcijos medžiagas: pripučiama dygsnių konstrukcijos PVC lenta prieš kietą lentą su putplasčio šerdimi. Sužinokite, kodėl kiekvienas tipas elgiasi skirtingai.'
  tldr: Pripučiami SUP naudoja dygsnių konstrukcijos PVC su tūkstančiais vidinių siūlų standumui užtikrinti. Kietos lentos naudoja putplasčio šerdį su epoksidiniu arba stiklo pluošto apvalkalu. Pripučiamos lentos laimi pernešamumu ir patvarumu. Kietos lentos laimi greičiu ir plaukimo pojūčiu. Moderni dygsnių technologija esant 15 PSI beveik prilygsta kietos lentos standumui.
  problem: Pirkėjai nesupranta esminių pripučiamų ir kietų lentų konstrukcijos skirtumų, todėl priima netinkamus pirkimo sprendimus.
  solution: 'Medžiagą derinkite prie pagrindinio naudojimo: pripučiama dygsnių konstrukcija — kelionėms, laikymui ir patvarumui. Putplastis/epoksidinė derva — lenktynėms, bangoms ir maksimalioms charakteristikoms.'
  audience: SUP pirkėjai, lyginantys pripučiamų ir kietų lentų konstrukcijas.
  steps:
    - 'Pripučiama dygsnių konstrukcija: tūkstančiai poliesterio siūlų jungia viršutinį ir apatinį sluoksnius ir esant 12-15 PSI slėgiui sukuria standžią struktūrą'
    - 'Kietos lentos putplastis: išplėstinio polistireno šerdis, suformuota pagal korpuso dizainą ir padengta epoksidine derva bei stiklo pluošto sluoksniais'
    - 'Pripučiamų lentų pranašumai: susideda, praktiškai nesunaikinamos, lengvos nešioti, minkšti kraštai saugumui'
    - 'Kietų lentų pranašumai: mažesnis bendras svoris, standesnė platforma, geresnis slydimo efektyvumas, greitesnis atsakas'
    - 'Hibridinės parinktys: kai kurie gamintojai derina dygsnių konstrukciją su standžiais skydais, kad sujungtų abiejų tipų pranašumus'
  faq:
    - q: Ar pripučiami SUP tokie pat standūs kaip kietos lentos?
      a: Esant 15 PSI ir kokybiškai dygsnių konstrukcijai šiuolaikinės pripučiamos lentos yra labai artimos. Dauguma mėgėjų irklautojų skirtumo nepajus. Lenktynių irklautojai pastebės kietos lentos pranašumą.
    - q: Kuri medžiaga tarnauja ilgiau?
      a: Pripučiami SUP tinkamai prižiūrimi tarnauja 5-10 metų. Kietos lentos tarnauja 10-20 metų, tačiau gali įtrūkti, įdubti ar prisigerti vandens. Pripučiamos lentos kasdieniame naudojime atsparesnės pažeidimams.
    - q: Ar PVC draugiškas aplinkai?
      a: PVC gamyba daro poveikį aplinkai, tačiau pripučiami SUP tarnauja ilgiau (rečiau tenka keisti) ir susideda kompaktiškiau (mažesnės transportavimo emisijos). Senas lentas visada tinkamai perdirbkite.

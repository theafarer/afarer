- slug: understanding-specs
  category: technical
  title: Kaip skaityti SUP lentos technines specifikacijas
  description: Techninis vadovas, padedantis suprasti SUP lentos specifikacijas — tūrį, matmenis, konstrukciją ir ką jos reiškia charakteristikoms.
  tldr: 'Pagrindinės specifikacijos: tūris (litrais) lemia plūdumą ir keliamąją galią, plotis lemia stabilumą, ilgis lemia krypties laikymą ir greitį, storis lemia standumą, o PSI reitingas nurodo pripūtimo slėgą optimalioms charakteristikoms pasiekti.'
  problem: Produktų specifikacijų lapuose skaičiai pateikiami be konteksto, todėl pirkėjai nežino, kurios specifikacijos iš tikrųjų svarbios jų naudojimo atvejui.
  solution: 'Siekite kiekvieną specifikaciją susieti su realiu veikimu: tūris — plūdumas, plotis — stabilumas, ilgis — slydimas, storis — standumas, konstrukcija — patvarumas.'
  audience: Vidutinio lygio irkluotojai ir techniniai pirkėjai, norintys priimti duomenimis pagrįstus sprendimus.
  steps:
    - Patikrinkite tūrį (litrais) — jūsų svoris su įranga neturėtų viršyti 80% lentos tūrio reitingo
    - Patikrinkite plotį — platesnė (32-34") = daugiau stabilumo, statesnė (28-30") = daugiau greičio
    - Patikrinkite ilgį — ilgesnė (12-14") = geresnis krypties laikymas, trumpesnė (10-11") = geresnis manevringumas
    - Patikrinkite storį — 6" yra standartinis, 8" suteikia daugiau standumo ir keliamosios galios
    - Patikrinkite PSI reitingą — optimaliam standumui pripūskite iki didžiausio reitinguoto PSI
    - Patikrinkite konstrukcijos medžiagas — drop-stitch siūlų tankį, PVC sluoksnius, bortų sutvirtinimą
  faq:
    - q: Ką reiškia drop-stitch?
      a: Drop-stitch yra konstrukcijos metodas, kai tūkstančiai siūlų jungia lentos viršutinį ir apatinį sluoksnius. Tai leidžia pripūsti aukštu slėgiu (12-15 PSI) ir pasiekti itin didelį standumą.
    - q: Koks idealus svorio ir tūrio santykis?
      a: Geras orientyras — maždaug 5-6 svarai irkluotojo svorio vienam lentos tūrio litrui. 220 lb sveriantis irkluotojas turėtų ieškoti lentų, kurių tūris 180+ litrų.
    - q: Ar lentos svoris svarbus?
      a: Taip. Lengvesnės lentos (iki 20 lbs) lengviau nešiojamos ir vežamos. Sunkesnės lentos (25+ lbs) dažnai rodo patvaresnę kelių sluoksnių PVC konstrukciją.

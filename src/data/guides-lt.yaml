- slug: inflatable-repair
  category: maintenance
  title: Kaip sutaisyti pripučiamą SUP lentą
  description: Nuoseklus vadovas, kaip taisyti pradūrimus, vožtuvų gedimus ir siūlių pažeidimus pripučiamose SUP lentose.
  tldr: Mažus pradūrimus (mažesnius nei 1/4") galima užlopyti komplekte esančiu lopymo rinkiniu. Nuvalykite vietą, užtepkite PVC klijų, prispauskite lopą ir palaukite 24 valandas. Dėl vožtuvų nuotėkio dažniausiai reikia keisti O-ring. Didelius plyšimus ar siūlių atsiskyrimą turi tvarkyti profesionalus servisas.
  problem: Maži pradūrimai ir vožtuvų gedimai dažni, tačiau lengvai pašalinami. Neturėdami tinkamos taisymo technikos, vartotojai arba per daug moka už profesionalų servisą, arba dar labiau pablogina pažeidimą.
  solution: Nustatykite pažeidimo tipą — pradūrimas, vožtuvo nuotėkis ar siūlės problema — ir taikykite atitinkamą remonto metodą. Dauguma remontų trunka 30 minučių plius džiūvimo laikas.
  audience: Pripučiamų SUP lentų savininkai, norintys pagrindinius remontus atlikti patys.
  steps:
    - Raskite nuotėkio vietą — lentą visiškai išpūskite, klausykite oro šnaresio, apčiupokite ranka arba naudokite muiluotą vandenį
    - Nuotėkio vietą pažymėkite rašikliu arba juostele
    - Vietą aplink nuotėkį nuvalykite izopropilo alkoholiu — mažiausiai 2 inches aplink pažeidimą
    - Geresniam klijų sukibimui paviršių padarykite šiurkštų smulkiu švitriniu popieriumi
    - PVC klijus užtepkite ir ant lopo, ir ant lentos paviršiaus
    - Palaukite 5 minutes, kol klijai taps lipnūs
    - Lopą tvirtai prispauskite, oro burbulus išlyginkite voleliu arba kortele
    - Prieš pūsdami lentą iki pilno slėgio, leiskite klijams džiūti 24 valandas
  faq:
    - q: Ar galiu pradūrimą sutaisyti vandenyje?
      a: Avarinis remontas lopu ir juosta padės grįžti į krantą. Pilnas remontas reikalauja sausų sąlygų ir 24 valandų džiūvimo.
    - q: Kaip pašalinti vožtuvo nuotėkį?
      a: Komplekte esančiu įrankiu išsukite vožtuvo šerdį, patikrinkite, ar O-ring nėra pažeistas, prireikus pakeiskite jį ir šerdį vėl tvirtai įsukite.
    - q: Kokius klijus naudoti PVC remontui?
      a: Naudokite specialius PVC klijus, pavyzdžiui, HH-66 arba Clifton. Įprasti super klijai su pripučiamomis PVC medžiagomis gerai nesukimba.

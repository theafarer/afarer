- slug: sup-travel-transport
  category: planning
  title: SUP kelionių vadovas — skrybis ir kelionės automobiliu su pripučiama SUP lenta
  description: Kaip keliauti su pripučiama SUP lenta lėktuvu, automobiliu ar autobūsiu. Patarimai dėl oro linijų mokesčių, pakavimo, pripūtimo atvykimo vietoje ir tarptautinių kelionių aspektų.
  tldr: Išleiskite orą, susukite ir supakuokite savo SUP lentą į jos kuprinę. Dauguma oro linijų priima ją kaip registruotą bagažą (mažiau nei 50 lbs / 50 linijinių colių). Siurblį ir irklą visada dėkite į tą patį krepšį. Atvykite anksčiau, kad turėtumėte papildomo laiko, jei prie vartų dirbantis darbuotojas abejotų dėl krepšio dydžio. Ilgoms kelionėms apsvarstykite galimybę bagažą išsiųsti iš anksto.
  problem: Keliavimas su SUP lenta atrodo sudėtingas — oro linijų dydžio apribojimai, saugumo patikros rūpesčiai ir nežinomybė, kaip pripūsti lentą nuotolinėje vietoje, sukelia neapibrėžtumo.
  solution: „afarer“ SUP kuprinės sukurtos taip, kad atitiktų oro linijų registruoto bagažo apribojimus. Pakuokite apgalvotai, turėkite su savimi remonto rinkinį ir prieš išvykdami susiraskite pripūtimo vietas (jachų uostai, stovyklavietės su elektros tiekimu).
  audience: Irklintojai, planuojantys SUP keliones lėktuvu, automobiliu ar autobūsiu.
  steps:
    - Visiškai išleiskite orą ir susukite lentą nuo priekio iki galo
    - Į kuprinę įdėkite susuktą lentą, siurblį, irklą, saugos virvę ir peleką
    - Patikrinkite oro linijų dydžio ir svorio apribojimus — dauguma leidžia 62 linijinius colius ir 50 lbs
    - Atvykite anksčiau ir būkite pasirengę, kad krepšys gali būti tikrinamas rankiniu būdu
    - Rankiniame bagaže vežkitės remonto rinkinį atvejui, jei lenta būtų pažeista pervežimo metu
    - 'Išsiaiškinkite pripūtimo galimybes: stovyklaviečių elektros jungtys elektriniams siurbliams, jachų uostų oro stotys'
  faq:
    - q: Ar oro linija priims mano SUP kuprinę kaip bagažą?
      a: Dauguma JAV ir Europos oro linijų priima SUP kuprines kaip standartinį registruotą bagažą, jei jis sveria iki 50 lbs ir yra iki 62 linijinių colių. Pigiosios oro linijos gali imti papildomus mokesčius už per didelio dydžio bagažą.
    - q: Ar galiu vežtis SUP lentą kaip rankinį bagažą?
      a: Ne. SUP kuprinės visose oro linijose viršija rankinio bagažo matmenis. Kuprinę visada atiduokite į registruotą bagažą.
    - q: Kaip pripūsti SUP lentą nuotolinėje kelionės vietoje?
      a: Komplekte esantis rankinis siurblys veikia bet kur, nereikalaudamas elektros. Dėl patogumo pasiimkite nešiojamąjį elektrinį siurblį ir ieškokite stovyklaviečių su elektros jungtimis arba jachų uostų su oro stotimis.

- slug: how-to-choose-your-sup
  category: buying-guide
  title: Kaip išsirinkti sau tinkamą SUP lentą
  description: Išsamus vadovas, padedantis išsirinkti tinkamą SUP lentą pagal jūsų įgūdžių lygį, vandens sąlygas ir numatomą paskirtį.
  tldr: SUP lentą rinkitės pagal įgūdžių lygį, vandens tipą ir pagrindinę paskirtį. Universalios lentos tinka pradedantiesiems ir ramiam vandeniui. Turizmo lentos skirtos ilgesnėms distancijoms. Jogos lentos dėl didesnio pločio suteikia daugiau stabilumo. Sportinės lentos tinka patyrusiems irkluotojams įvairiomis sąlygomis.
  problem: Dauguma pirmą kartą SUP lentą perkraunančių pirkėjų renkasi ją pagal kainą ar išvaizdą, o ne pagal tai, kaip ir kur iš tikrųjų irkluos. Tai lemia prastą stabilumą, nepakankamas charakteristikas ir nemalonią patirtį.
  solution: Derinkite lentos formą, tūrį ir konstrukciją su savo įgūdžių lygiu ir pagrindine vandens aplinka. Platesnės lentos (32-34") suteikia stabilumo pradedantiesiems. Ilgesnės lentos (12-14") geriau laiko kryptį turizmui. Drop-stitch konstrukcija 12-15 PSI slėgiu suteikia standumą, prilygstantį kietų lentų standumui.
  audience: Pirmą kartą SUP lentą perkantys pirkėjai, laisvalaikio irkluotojai ir visi, kurie keičia paprastą lentą į pažangesnę.
  steps:
    - Nustatykite pagrindinę irklavimo aplinką — ežeras, jūra, upė ar mišri
    - 'Derinkite lentos plotį su savo įgūdžių lygiu: 32-34" pradedantiesiems, 30-32" vidutinio lygio irkluotojams, 28-30" patyrusiems'
    - 'Rinkitės lentos ilgį pagal paskirtį: trumpesnė — manevringumui, ilgesnė — krypties laikymui ir greičiui'
    - 'Pasirinkite konstrukciją: pripučiama drop-stitch — dėl lengvo pervežimo, kietą lentą — dėl maksimalių charakteristikų'
    - Patikrinkite keliamąją galią — jūsų svoris kartu su įranga neturėtų viršyti 80% lentos limito
    - 'Patikrinkite komplekte esančius priedus: pompą, saugos raištį, peleką, kuprinę ir remonto rinkinį'
  faq:
    - q: Kokio pločio SUP lenta geriausia pradedantiesiems?
      a: Nuo 32 iki 34 colių pločio lenta suteikia stabiliausią platformą mokymuisi. SUP Explorer 11, kurio plotis 33", idealiai tinka pirmą kartą irkluojantiems ramiame vandenyje.
    - q: Pripučiama ar kieta SUP lenta?
      a: Pripučiamos lentos pasižymi lengvu pervežimu, patogiu laikymu ir smūgių sugerimu. Kietos lentos suteikia maksimalų standumą ir greitį. Daugumai laisvalaikio vartotojų praktiškas pasirinkimas — kokybiška pripučiama lenta su drop-stitch šerdimi.
    - q: Iki kokio PSI slėgio turėčiau pripūsti?
      a: afarer lentos rekomenduoja 12-15 PSI. Esant 15 PSI, lenta pasiekia maksimalų standumą, prilygstantį kietos lentos standumui. Visada laikykitės ant lentos nurodyto darbinio slėgio diapazono.

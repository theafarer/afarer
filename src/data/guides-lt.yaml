- slug: sup-maintenance
  category: maintenance
  title: Kaip valyti ir laikyti pripučiamą SUP lentą
  description: Žingsnis po žingsnio priežiūros vadovas, padedantis maksimaliai prailginti jūsų pripučiamos SUP lentos tarnavimo laiką.
  tldr: Po kiekvieno naudojimo nuplaukite gėlu vandeniu, prieš laikydami visiškai išdžiovinkite, išleiskite orą ir susukite laisvai (ne itin stipriai), laikykite vėsioje, sausoje vietoje atokiau nuo tiesioginių saulės spindulių ir kas mėnesį tikrinkite siūles.
  problem: Netinkamas laikymas ir valymas yra pagrindinės priešlaikinio pripučiamų SUP gedimų priežastys — pelėsis, UV pažeidimai ir siūlių atsiskyrimas.
  solution: 'Laikykitės nuoseklios rutinos po kiekvienos išvykos: nuplaukite, išdžiovinkite, apžiūrėkite, išleiskite orą ir paruoškite laikymui. Prie įsisenėjusių nešvarumų naudokite švelnų muilą. Niekada nelaikykite lentos šlapios ar tiesioginėje saulėje.'
  audience: Visi pripučiamų SUP savininkai, norintys, kad jų lenta tarnautų 5+ metus.
  steps:
    - Iškart po naudojimo nuplaukite lentą gėlu vandeniu, ypač po sūraus vandens
    - Valykite švelniu muilu ir minkšta kempine — venkite agresyvių chemikalų ir aukšto slėgio plovimo
    - Išdžiovinkite lentą visiškai — atidarykite vožtuvą, kad susikaupęs vanduo galėtų išbėgti
    - Apžiūrėkite, ar nėra pažeidimų — patikrinkite siūles, vožtuvą ir paviršių, ar nėra pradūrimų
    - Išleiskite orą visiškai — visiškam išleidimui išimkite vožtuvo šerdį
    - Sukite lentą laisvai — pradėkite nuo nosies, venkite aštrių lenkimo vietų
    - Laikykite nešiojamame maiše vėsioje, sausoje vietoje atokiau nuo tiesioginių saulės spindulių
  faq:
    - q: Ar galiu visą sezoną laikyti SUP pripūstą?
      a: Taip, tačiau nenaudodami laikykite ne tiesioginiuose saulės spinduliuose. Ilgesniam laikymui rekomenduojamas dalinis slėgio sumažinimas (8-10 PSI).
    - q: Kaip pataisyti pradūrimą?
      a: Nuvalykite pažeidimo vietą, iškirpkite lopą su suapvalintais kampais, užtepkite klijų, stipriai prispauskite ir prieš pripūsdami palaukite 24 valandas. afarer lentos komplekte turi remonto rinkinį.
    - q: Kaip dažnai turėčiau tikrinti vožtuvą?
      a: Kas mėnesį. Vožtuvas — dažniausiai gedį sukelianti vieta. Patikrinkite, ar vožtuvo adatėlė juda laisvai ir ar O-formos žiedas nepažeistas.

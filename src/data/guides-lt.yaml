- slug: sup-for-whitewater
  category: buying-guide
  title: SUP slenksčių vadovas — pripučiamų lentų irklavimui upėmis pirkimo vadovas
  description: 'Kaip rinktis slenksčių SUP lentą irklavimui upėmis: trumpesnės lentos, sustiprinta konstrukcija, saugos įranga ir I-III klasės slenksčiams skirtos irklavimo technikos.'
  tldr: Slenksčių SUP lentoms reikalingas trumpesnis ilgis (8-10'), sutvirtintos briaunos, didesnis slėgimas (15+ PSI) ir kelios oro kameros saugumui. Naudokite tiesią upės saugos virvę (ne susukamą), dėvėkite šalmą ir gelbėjimosi liemenę (PFD) ir visada irkluokite su bendražygiu. Pradėkite nuo I klasės slenksčių, prieš bandydami sudėtingesnius.
  problem: Išplaukti standartine universalia SUP lenta į tekančį vandenį pavojinga — standartinės lentos neturi manevringumo, atsparumo smūgiams ir saugos funkcijų, reikalingų upėms.
  solution: Rinkitės specialiai pagamintą slenksčių SUP lentą su trumpu ilgiu vikrumui, sutvirtinta konstrukcija smūgiams į akmenis ir kelių oro kamerų dizainu saugumui.
  audience: Patyrę irklintojai, pereinantys prie irklavimo upėmis.
  steps:
    - Rinkitės 8-10' ilgio lentą maksimaliam manevringumui slenksčiuose
    - Ieškokite sutvarkintos briaunų konstrukcijos ir karinės klasės PVC
    - Pasirinkite lentą su 2+ oro kameromis atsargai atvejui, jei būtų pradurta
    - Naudokite tiesią upės saugos virvę, prisegamą prie greito atssegimo diržo
    - Dėvėkite šalmą, gelbėjimosi liemenę (PFD) ir tinkamą upėms skirtą avalynę
    - Pradėkite nuo I klasės slenksčių ir palaipsniui tobulėkite kartu su patyrusiu partneriu
  faq:
    - q: Ar galiu slenksčiams naudoti įprastą SUP lentą?
      a: Nerekomenduojama. Standartinės SUP lentos nėra atsparios smūgiams ir atsitrenkusios į akmenis gali atsisluoksniuoti. Kelių oro kamerų saugumas upių sąlygomis yra gyvybiškai svarbus.
    - q: Koks slėgimas (PSI) slenksčių SUP lentai?
      a: 15+ PSI maksimaliam standumui. Kietesnė lenta nuo akmenų atšoka geriau nei nepakankamai pripūsta, kuri prisitaiko prie kliūčių.
    - q: Ar slenksčių SUP irklavimui reikia specialių irklavimo įgūdžių?
      a: Taip. Upės skaitymas, posūkiai prie sūkurių, perkėlimasis per upę ir atraminės technikos yra esminiai įgūdžiai. Prieš bandydami II ir aukštesnę klasę, dalyvaukite slenksčių SUP mokymuose.

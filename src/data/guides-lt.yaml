- slug: sup-for-touring
  category: buying-guide
  title: Geriausios turistinės SUP lentos — tolimų atstumų irklavimo lentų pirkimo vadovas
  description: 'Kaip rinktis turistinę SUP lentą ilgų atstumų irklavimui: korpuso dizainas, ilgis, plotis, kurso laikymas ir įrangos rekomendacijos daugiadienėms ekspedicijoms.'
  tldr: Turistinėms SUP lentoms reikalingi ilgesni korpusai (12-14'), vandens skrodžiantis (displacement) priekis efektyviam slydimui ir vidutinis plotis (30-32") kurso laikymui. Ieškokite tampriųjų virvių denio tvirtinimo, kelių D žiedų ir aukšto PSI drop-stitch konstrukcijos. Specialus turistinis irklas su mažesne mente mažina nuovargį ilgomis dienomis.
  problem: Turizmui naudojant trumpą universalją lentą patiriamas lėtas greitis, prastas kurso laikymas ir ankstyvas nuovargis. Ilgų atstumų irklavimas reikalauja specializuoto korpuso dizaino.
  solution: Rinkitės 12' ar ilgesnę lentą su smailiu, vandenį skrodžiančiu (displacement) priekiu. „afarer“ lentos Ocean Pulse ir Ocean Voyager turi turizmui skirtą korpuso formą ir tampriųjų virvių tvirtinimus, reikalingus ekspediciniam irklavimui.
  audience: Irklintojai, planuojantys vienos dienos išvykas, daugiadienes ekspedicijas arba fitneso irklavimą ilgais atstumais.
  steps:
    - Rinkitės 12-14' ilgio lentą efektyviam slydimui ir kurso laikymui
    - Pasirinkite smailų, bangas skrodžiantį (displacement) priekį
    - Atkreipkite dėmesį į 30-32" plotį — platesnė lenta stabilesnė, siauresnė greitesnė
    - Patikrinkite denio tampriųjų virvių tvirtinimus ir D žiedų tinklą įrangai pritvirtinti
    - Ištvermei rinkitės turistinį irlą (mažesnė mentė, ilgesnis kotas)
    - Apsvarstykite peleko sistemą su ilgesniu turistiniu peleku geresniam kurso laikymui
  faq:
    - q: Kokio ilgio turistinė SUP lenta geriausia?
      a: Daugumai irklintojų 12' yra optimaliausias ilgis — geras slydimas ir priimtinas transportavimas. 14' lenta greitesnė, bet sunkesnė ir sunkiau transportuojama. Pradedantieji turėtų rinktis 12'.
    - q: Ar turistinėms SUP lentoms reikia specialaus peleko?
      a: Ilgėsis turistinis pelekas (6-9") žymiai pagerina kurso laikymą. Daugelis turistinių lentų turi US peleko griovelį, leidžiantį keisti pelekus.
    - q: Ar galiu turizmui naudoti universaliją lentą?
      a: Trumpiems atstumams (1-3 mylios) universalioji lenta tinka. Ilgesniems atstumams specialios turistinės lentos korpuso dizainas daro didžiulį skirtumą greičio ir nuovargio atžvilgiu.

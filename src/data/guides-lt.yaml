- slug: sup-inflation-psi-guide
  category: technical
  title: SUP pripūtimo vadovas — optimalus PSI charakteristikoms ir saugumui
  description: 'Išsamus vadovas po SUP pripūtimo slėgį: rekomenduojami PSI diapazonai, kaip slėgis veikia charakteristikas ir patarimai, kaip teisingai naudoti siurblį.'
  tldr: Daugumą pripučiamų SUP pripūskite iki 12-15 PSI. Didesnis slėgis = daugiau standumo, bet lėtesnis pripūtimas. Mažesnis slėgis = minkštesnis pojūtis, bet daugiau lankstymosi. Niekada neviršykite ant lentos nurodyto maksimalaus PSI. Naudokite siurblį su tikslų slėgmį. Šaltas oras mažina slėgį, kaitri saulė didina.
  problem: Nepakankamai pripūstos lentos jaučiamos vangios ir pernelyg lankstosi. Per daug pripūstos lentos rizikuoja siūlių gedimu. Daugelis irklautojų PSI spėja, o ne tiksliai matuoja.
  solution: Naudokite siurblį su integruotu slėgmačiu. Maksimaliam standumui siekite 15 PSI. Prieš kiekvieną plaukimą patikrinkite slėgį — temperatūros pokyčiai gerokai veikia PSI.
  audience: Visi pripučiamų SUP savininkai.
  steps:
    - Patikrinkite prie vožtuvo ant lentos nurodytą rekomenduojamą PSI diapazoną
    - Naudodami abipusio veikimo siurblį pripūskite iki rekomenduojamo diapazono vidurio
    - Paskutiniams 3-4 PSI persijunkite į vienpusio veikimo režimą tikslesnei kontrolei
    - Patikrinkite slėgį slėgmačiu — analoginiai slėgmačiai patikimesni už skaitmeninius
    - 'Derinkite pagal sąlygas: aukštesnis PSI turizmui ir lenktynėms, žemesnis PSI upėms su slenksčiais ir akmenuotiems išplaukimo takams'
    - Pakartotinai patikrinkite slėgį, kai lenta pastovi 10 minučių — temperatūros pusiausvyra keičia PSI
  faq:
    - q: Ar galiu per daug pripūsti savo SUP?
      a: Taip. Viršijus nustatytą maksimalų PSI (paprastai 15-18 PSI) siūlės gali atsluoksniuoti ir būti pažeista dygsnių konstrukcijos šerdis. Visada laikykitės ant lentos nurodyto diapazono.
    - q: Ar temperatūra veikia PSI?
      a: Labai ženkliai. Lenta, pripūsta iki 15 PSI esant 70°F, tiesioginėje saulėje esant 95°F gali pasiekti 18 PSI. Šaltas vanduo gali sumažinti slėgį iki 12 PSI. Pasikeitus aplinkos sąlygoms patikrinkite slėgį.
    - q: Koks PSI tinka pradedantiesiems?
      a: 12-13 PSI mokymuisi suteikia truputį minkštesnę platformą, kuri atlaidžiau priima kritimus. Įgūdžiams tobulėjant didinkite iki 15 PSI.

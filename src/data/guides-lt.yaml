- slug: safety-tips
  category: safety
  title: Vandens sporto saugos patarimai
  description: Esminės saugos gairės irklavimui lenta — nuo įrangos patikrinimo iki oro sąlygų stebėjimo.
  tldr: Visada dėvėkite CE sertifikatu pažymėtą gelbėjimosi liemenę, prieš išplaukdami patikrinkite orą ir vandens sąlygas, turėkite ryšio priemones, niekada neirkluokite vieni nepažįstamame vandenyje ir žinokite savo įrangos leistinas ribas.
  problem: Dauguma vandens sporto incidentų įvyksta dėl nepakankamo pasiruošimo — nėra gelbėjimosi liemenės, nepaisoma oro įspėjimų arba naudojama įranga virš jos projektinių ribų.
  solution: 'Laikykitės prieš išplaukimą atliekamos saugos patikros sąrašo: patikrinkite įrangos būklę, orą ir vandens temperatūrą, informuokite ką nors apie savo maršrutą ir visada dėvėkite tinkamą plūdumą užtikrinančią priemonę.'
  audience: Visi irkluotojai lentomis ir vandens sporto dalyviai.
  steps:
    - Pasitikrinkite orų prognozę — venkite vėjo, stipresnio nei 15 mph, ir perkūnijų
    - Patikrinkite vandens temperatūrą — šaltam vandeniui (<60°F/15°C) reikalingas neopreninis ar sausas kostiumas
    - Apžiūrėkite įrangą — patikrinkite, ar nėra nuotėkių, įtrūkimų, ir ar tinkamai pripūsta
    - Visada dėvėkite CE sertifikatu pažymėtą gelbėjimosi liemenę
    - Prisegkite saugos raištį prie kulkšnies ar blauzdos
    - Palikite plaukimo planą — pasakykite kam nors, kur išplaukiate ir kada grįšite
    - Turėkite ryšio priemones — vandeniui nepralaidus telefono dėklas arba VHF radijas
    - Žinokite savo ribas — neviršykite savo įgūdžių lygio ir įrangos leistinų rodiklių
  faq:
    - q: Ar man reikalinga gelbėjimosi liemenė ant SUP?
      a: Taip. Daugelyje jurisdikcijų įstatymai reikalauja gelbėjimosi liemenės bet kurioje plaukimo priemonėje, įskaitant SUP. Net ten, kur to nereikalaujama, CE sertifikatu pažymėta gelbėjimosi liemenė yra esminė saugos įranga.
    - q: Kokia dažniausia vandens sporto trauma?
      a: Panirimas į šaltą vandenį ir išsekimas yra dažniausi rimti pavojai. Visada rengkitės pagal vandens, o ne oro temperatūrą.
    - q: Kaip patikrinti, ar sąlygos saugios?
      a: Naudokite jūrų orų prognozes. Pasitikrinkite vėjo greitį, bangų aukštį ir vandens temperatūrą. Pradedantieji turėtų būti sąlygose, kai vėjas silpnesnis nei 10 mph, o bangos žemesnės nei 1 ft.

- slug: sup-fishing
  category: lifestyle
  title: 'SUP žvejybos vadovas: kaip žvejoti iš irklentinės lentos'
  description: Viskas, ką reikia žinoti apie žvejybą iš irklentinės — įrangos paruošimas, stabilumo patarimai ir technikos.
  tldr: SUP žvejyba suteikia tylų priartėjimą prie žuvų, prieigą prie seklių vandenų ir metimą 360 laipsnių kampu. Naudokite plačią, stabilią lentą (34"+), pritvirtinkite meškerių laikiklius ir kaip įrangos denį naudokite šaldymo dėžę arba dėžę. Vėjuotu oru išstatykite inkarą. Visada dėvėkite PFD.
  problem: Įprastines žvejybinės valtis brangu prižiūrėti, o seklių vandens vietų jos nepasiekia. SUP žvejyba tai išsprendžia suteikdama nešiojamą platformą žvejybai sekliuose vandenyse, tačiau reikalauja tam tikro įrangos pritaikymo.
  solution: Įrengkite stabilią SUP lentą su meškerių laikikliais, įrangos dėže ir inkaro sistema. Pasinaudokite lentos nešiojamumu, kad pasiektumėte nutolusias žvejybos vietas, kurių valtys nepasiekia.
  audience: Žvejai, norintys žvejoti sekliuose vandenyse arba nuošaliose vietose, taip pat teikiantys pirmenybę lengvai, nešiojamai žvejybos platformai.
  steps:
    - Rinkitės plačią lentą (34"+) su didele svorio talpa įrangai
    - Sumontuokite meškerių laikiklius ant denio naudodami bėgelių arba diržų sistemas
    - Žūklės reikmenims naudokite vandeniui atsparią dėžę arba prie priekinio denio pritvirtintą šaldymo dėžę
    - Vėjuotam orui turėkite mažą inkarą arba įtvirtinimo kartį
    - Dėvėkite PFD su kišenėmis įrankiams ir telefonui
    - Prieš atsistodami pasitreniruokite mesti iš klūpimo padėties
  faq:
    - q: Ar galiu stovėdamas žvejoti ant SUP lentos?
      a: Taip. 34"+ pločio lenta suteikia pakankamą stabilumą stovėti ir mesti. Pirmiausia pasitreniruokite ramiame vandenyje.
    - q: Kokias žuvis galiu gaudyti iš SUP lentos?
      a: SUP lentos puikiai tinka ešerims ežeruose, raudoniesiems ešeriams seklumose, upėtakiams upėse bei priekrantės rūšims įlankose ir estuarijose.
    - q: Kaip iš SUP lentos ištraukti sugautą žuvį?
      a: Stabilumui atsiklaupkite. Naudokite traukiamąjį tinklą arba lūpų gnybtą. Laikykite žuvį žemai, kad neiškristumėte. Paleiskite ją arba sudėkite į šaldymo dėžę.

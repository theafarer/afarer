- slug: choosing-paddle
  category: buying-guide
  title: Kaip išsirinkti tinkamą SUP irklą
  description: Vadovas po SUP irklo medžiagas, mentės formas, kotų tipus ir dydžių parinkimą.
  tldr: 'Irklo ilgis: SUP irklai turėtų būti 6-8" aukštesni už jūsų ūgį. Mentės forma: dihedral formos mentės eina tiesiai, plokščios mentės geriau sugriebia vandenį. Koto medžiaga: karbonas lengviausias, stiklo pluoštas — geriausia vertė, aliuminis — pigiausia.'
  problem: Netinkamas irklo dydis ar medžiaga sukelia nereikalingą nuovargį, prastą irto efektyvumą ir sąnarių įtampą.
  solution: Irklo ilgį, mentės formą, koto medžiagą ir lankstumą derinkite prie savo irklavimo stiliaus, kūno sudėjimo ir biudžeto.
  audience: SUP irklininkai, besirenkantys pirmąjį ar kitą irklą.
  steps:
    - Išmatuokite irklo aukštį — įprastam irklavimui jis turėtų būti 6-8" aukštesnis už jūsų ūgį
    - Rinkitės mentės medžiagą — nailonas biudžetui, stiklo pluoštas vertei, karbonas rezultatams
    - Rinkitės mentės formą — dihedral sklandžiai eigai, plokščia jėgai, šaukštinė lenktynėms
    - Rinkitės koto tipą — tiesus įprastam naudojimui, lenktas lenktyniniam SUP
    - Patikrinkite lankstumą — standesni kotai perduoda daugiau galios, lankstūs kotai mažina sąnarių įtampą
  faq:
    - q: Kuri irklo medžiaga geriausia?
      a: Stiklo pluoštas siūlo geriausią svorio, patvarumo ir kainos pusiausvyrą. Karbonas lengvesnis, bet brangesnis ir trapesnis. Nailonas sunkus, tačiau beveik nesunaikinamas.
    - q: Iš ko žinoti, kad irklo ilgis tinkamas?
      a: Pastatykite irklą statmenai šalia savęs — kai ranka pakelta virš galvos, rankena turėtų siekti jūsų riešą.
    - q: Ar rinktis vientisą ar reguliuojamą irklą?
      a: Reguliuojami irklai geri bendram naudojimui ir kelionėms. Vientisi irklai lengvesni, standesni ir efektyvesni nuolatiniam naudojimui.

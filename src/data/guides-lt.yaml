- slug: beginner-guide
  category: tutorial
  title: 'Pradedančiųjų vadovas: irklavimas SUP lenta'
  description: Viskas, ką reikia žinoti prieš pirmąją irklavimo lenta išvyką — nuo įrangos paruošimo iki pagrindinių irklavimo technikų.
  tldr: Pradėkite ramiame, plokščiame vandenyje su plačia, stabilia lenta. Pripūskite iki 12-15 PSI, prisegkite saugos raištį ir naudokite teisingą irklo ilgį (6-8" aukštesnį už jūsų ūgį). Laikykite kojas pečių plotyje, kelius šiek tiek sulenktus ir žiūrėkite į horizontą.
  problem: Nauji irkluotojai dažnai praleidžia esminį pasiruošimą — netinkamas irklo ilgis, prasta stovėsena ar bangų vandens pasirinkimas — dėl to krentama, jaučiamas nusivylimas ir prarandamas noras tęsti.
  solution: 'Vadovaukitės struktūruotu pirmosios išvykos planu: pasirinkite ramų vandenį, teisingai paruoškite įrangą, prieš atsistodami pasimankštinkite klūpodami ir įvaldykite traukimą į priekį, tik tada bandykite posūkius.'
  audience: Absoliutūs pradedantieji, kurie niekada anksčiau nėra irklavę lenta.
  steps:
    - Pasirinkite plokščią, ramų vandenį be laivų eismo — mažas ežeras arba nuo vėjo apsaugota įlanka idealiai tinka
    - Pripūskite lentą iki 12-15 PSI naudodami dvigubo veikimo pompą
    - Prisegkite ritininį saugos raištį prie kulkšnies ar blauzdos, niekada prie lentos rankenos
    - Įstatykite peleką ir priveržkite varžtą
    - Nustatykite irklo ilgį — jis turėtų būti 6-8 colių aukštesnis už jūsų ūgį
    - Iš pradžių atsiklaupkite ant lentos ir irkluokite kelis judesius, kad pajustumėte balansą
    - Atsistokite viena koja po kitos, kojas pečių plotyje, kelius laisvus
    - Žiūrėkite į horizontą, o ne į kojas — lenta plaukia ten, kur žiūrite
  faq:
    - q: Ką turėčiau vilkėti irkluodamas lenta?
      a: Greitai džiūstančius sportinius drabužius, gelbėjimosi liemenę, apsaugą nuo saulės ir kepurę. Šaltame vandenyje dėvėkite neopreninį kostiumą. Visada segėkite saugos raištį ir nešiokitės telefoną vandeniui nepralaidžiame dėkle.
    - q: Kaip vėl užsikabaroti ant lentos, jei nukritau?
      a: Išlikite ramūs. Nuplaukite prie lentos, įsitverkite centrinės rankenos ir spardydamiesi kojomis vienu judesiu užsitempkite ant lentos. Pirmiausia grįžkite į klūpimo padėtį, tada atsistokite.
    - q: Kokios vėjo sąlygos yra saugios?
      a: 'Pradedantiesiems: vėjas iki 10 mph (5 knots). Jei vėjas pučia nuo kranto link atviro vandens, neplaukite. Pasitikrinkite prognozę ir atsiminkite, kad nuo kranto pučiantis vėjas yra pavojingas.'

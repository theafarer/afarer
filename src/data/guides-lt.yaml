- slug: sup-weight-capacity
  category: buying-guide
  title: SUP keliamosios galios vadovas — kokį svorį gali atlaikyti SUP?
  description: SUP keliamosios galios ribų paaiškinimas, kaip apskaičiuoti visą savo krovinį ir kodėl ribų viršijimas veikia charakteristikas bei saugumą.
  tldr: Savo kūno svoriu ir įranga niekada neviršykite 80% lentos maksimalios keliamosios galios. 220 lb keliamąją galią turinti lenta tinka 160 lb sveriančiam irklautojui su lengva įranga. Viršijus ribą atsiranda delfinavimas, vangus valdymas ir didesnė pažeidimų rizika.
  problem: Irklautojai dažnai viršija savo lentos keliamąją galią, dėl ko prastėja charakteristikos, lenda po vandeniu ir gali būti pažeista lenta. Gamintojai nurodo maksimalias ribas, bet nepaaiškina saugių darbo apkrovų.
  solution: Apskaičiuokite visą savo krovinį (kūno svoris + įranga + lentos įgertas vanduo) ir nelipkite virš 80% nurodytos maksimalios galios. Sunkesniems irklautojams reikalingos didesnio tūrio lentos su 300+ lb keliamąja galia.
  audience: Visų sudėjimų irklautojai, ypač stambesni ir tie, kurie vežasi žyginę įrangą.
  steps:
    - Raskite ant lentos nurodytą maksimalią keliamąją galią (paprastai prie vožtuvo)
    - Pasverkite save ir visą įrangą, įskaitant irklą, PFD, hermetiškus maišus, termodėžę ir priedus
    - 'Apskaičiuokite: (visas jūsų krovinys) ÷ (maksimali galia) × 100 = % panaudotos galios'
    - Siekite 70-80% optimalioms charakteristikoms ir saugumui
    - Jei viršijate 80%, rinkitės didesnę lentą arba sumažinkite įrangą
  faq:
    - q: Kas atsitiks, jei viršysiu svorio ribą?
      a: Lenta plaukia žemiau ir sukelia didesnį vandens pasipriešinimą. Mažėja stabilumas, nosis gali nerti po vandeniu, o dygsnių konstrukcijos šerdis bangavime tampa labiau pažeidžiama.
    - q: Ar du žmonės gali plaukti vienu SUP?
      a: Tik jei bendras svoris neviršija 80% keliamosios galios. Dauguma standartinių SUP yra skirti vienam žmogui. Plaukimui dviese reikalinga specialiai dviem asmenims skirta lenta.
    - q: Ar pripučiami SUP turi mažesnę keliamąją galią už kietas lentas?
      a: Kokybiškos pripučiamos lentos su dygsnių konstrukcija dėl storesnio tūrio pasiskirstymo turi panašią ar didesnę keliamąją galią už kietas lentas.

- slug: sup-storage-winter-care
  category: maintenance
  title: SUP laikymas ir žiemos priežiūra — prailginkite savo lentos tarnavimo laiką
  description: Kaip tinkamai laikyti, valyti ir paruošti žiemai jūsų pripučiamą SUP lentą. Tinkamai prižiūrėdami išvengsite pelėsio, UV žalos ir medžiagų degradacijos.
  tldr: Po kiekvieno naudojimo išvalykite gėlu vandeniu. Prieš laikydami visiškai išdžiovinkite. Išleiskite orą ir laikykite vėsioje, tamsioje vietoje atokiau nuo tiesioginių saulės spindulių ir ekstremalių temperatūrų. Niekada nelaikykite pripūstos lentos ir nepalikite jos karštoje automobilyje. Periodiškai tepkite UV apsaugos priemone.
  problem: Netinkamas laikymas yra pagrindinė ankstyvo SUP gedimo priežastis — pelėsis, medžiagų irimas, atsluoksniavimas ir vožtuvo pažeidimai dėl karščio ar šalčio.
  solution: 'Vadovaukitės trijų žingsnių priežiūros rutina: praskalaukite po kiekvieno plaukimo, prieš laikymą kruopščiai išdžiovinkite ir laikykite išleidę orą temperatūros valdomoje aplinkoje tarp 50-80°F (10-27°C).'
  audience: Visi SUP savininkai, norintys, kad jų lenta tarnautų 5+ metus.
  steps:
    - Po kiekvieno plaukimo sūriu ar drumzlinu vandeniu praskalaukite lentą, irklą ir siurblį gėlu vandeniu
    - Valykite švelniu muilu ir minkšta kempine — niekada agresyviais cheminiais preparatais ar aukšto slėgio plautuvais
    - Prieš išleisdami orą lentą visiškai išdžiovinkite lauke (atidarykite vožtuvą, kad išeitų vidinė drėgmė)
    - Pilnai išleiskite orą ir vyniokite nuo nosies link uodegos, kad išstumtumėte likusį orą
    - Prieš dėdami lentą vidun, kuprinę nuvalykite sausa
    - Laikykite vėsioje, tamsioje spintoje arba po lova — niekada tiesioginėje saulėje, karštoje automobilyje ar šąlančiame sandėliuke
  faq:
    - q: Ar galiu visą sezoną laikyti SUP pripūstą?
      a: Ilgai nenaudojant geriau išleisti orą. Nuolatinis PSI krūvis spartina medžiagų nuovargį. Jei laikote ilgiau nei 2 savaites, tarp plaukimų išleiskite orą.
    - q: Kaip pašalinti pelėsį nuo SUP?
      a: Sumaišykite švelnų muilą su šiltu vandeniu ir trupučiu baltojo acto. Švelniai patrinkite minkštu šepetėliu. Kruopščiai praskalaukite ir džiovinkite pavėsyje. Venkite baliklio — jis gadina PVC.
    - q: Ar galiu laikyti SUP garaže?
      a: Tik jei garaže ištisus metus laikomasi 50-80°F. Mansardose ir garažuose be temperatūros reguliavimo būna temperatūros ekstremumų, pažeidžiančių dygsnių konstrukcijos šerdis.

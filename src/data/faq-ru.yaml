- id: sup-inflatable-durability
  question: 'Сколько служат надувные SUP-доски при правильном уходе?'
  answer: 'При правильном уходе качественная надувная SUP-доска служит 5-10 лет регулярного рекреационного использования. Военный трёхслойный PVC с UV-стойким покрытием — как во всех досках afarer — противостоит солнечному разрушению, коррозии от солёной воды и истиранию. Ключевые факторы долговечности: ополаскивать пресной водой после каждого выхода, тщательно сушить перед хранением, держать вдали от прямых UV-лучей, хранить слегка подкачанной в прохладном сухом месте и не таскать по грубым поверхностям. Первыми обычно изнашиваются нити drop-stitch и швы, а не сама PVC-ткань.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-maintenance
    - inflatable-sup-storage
    - inflatable-sup-repair
- id: sup-choppy-water
  question: 'Как грести на SUP в волну или ветер?'
  answer: 'На волне: согните колени, используйте более широкую стойку, укоротите гребок и включайте корпус для баланса. При встречном ветре: держите весло ниже, гребите чаще и короче, наклоняйтесь вперёд. При боковом ветре: гребите с наветренной стороны, чтобы корректировать снос. При попутном ветре: катайтесь на волнах для скорости. Новичкам следует избегать ветра свыше 10 mph и выбирать более широкие и длинные доски для стабильности. Туринговый SUP afarer Ocean Voyager создан для умеренной волны и ветра.'
  category: safety
  relatedProducts:
    - sup-ocean-voyager
    - sup-explorer-11
  relatedGuides:
    - weather-conditions
    - sup-safety-guide
    - wind-conditions-sup
- id: sup-sustainability
  question: 'Экологичны ли надувные SUP-доски?'
  answer: 'Надувные SUP имеют меньший экологический след, чем жёсткие доски, сразу в нескольких отношениях: они требуют меньше сырья при производстве, их меньший вес снижает выбросы при перевозке, а долговечность означает меньше замен за время службы. PVC в досках afarer не содержит свинца и соответствует REACH. Ключевые практики устойчивости: покупайте качественную доску на 5-10 лет, ремонтируйте проколы вместо замены, сдавайте доску в конце срока службы в специализированные программы переработки PVC и избегайте одноразовой упаковки, выбирая бренды с многоразовыми чехлами.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: 'Каков минимальный объём заказа для OEM/ODM-производства SUP?'
  answer: 'Минимальные объёмы заказа (MOQ) зависят от типа продукта. Брендирование складских моделей: 50 единиц на SKU. Разработка пресс-форм для индивидуальной формы: 200–500 единиц на модель (первый заказ). Программы совместного использования пресс-форм — от 50 единиц. Производство лодок из Hypalon: 20–50 единиц в зависимости от размера. Аксессуары и PFD: 500–1000 единиц на дизайн. Обратитесь к нашей OEM-команде с планируемыми объёмами для точных MOQ и цен.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Каковы типичные сроки выполнения OEM-заказов SUP?'
  answer: 'Первые OEM-заказы с брендированием на существующих пресс-формах: 6–8 недель от депозита до FOB Qingdao. Заказы с индивидуальной формой, требующие новых пресс-форм: 12–20 недель (включая 3D-дизайн, изготовление пресс-форм, прототипирование и серийное производство). Повторные заказы с одобренными спецификациями: 6–8 недель. Срочные заказы на существующих пресс-формах можно ускорить до 4–5 недель. Сроки включают закупку сырья, производство, пооперационный QC и загрузку контейнера.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Какие сертификаты имеют продукты OEM afarer?'
  answer: 'Все продукты OEM/ODM afarer имеют: декларацию соответствия CE (рынок ЕС), UKCA (рынок Великобритании), систему менеджмента качества ISO 9001:2015, аудит социальной ответственности BSCI, соответствие материалов REACH и RoHS, классификацию EN ISO 25649 для надувных лодок. Дополнительные сертификаты по запросу: документация о соответствии US Coast Guard, испытания по военным стандартам (MIL-STD-810) и поддержка сертификации импорта в стране назначения.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Можно ли заказать образцы до серийного производства?'
  answer: 'Да. Заказ образцов доступен для всех проектов OEM/ODM. Предсерийные образцы (PPS) изготавливаются после производства пресс-форм и до серийного выпуска. Срок изготовления образцов: 15–25 рабочих дней для существующих пресс-форм, 25–40 рабочих дней для индивидуальных. Стоимость образцов вычитается из первого серийного заказа. Образцы отправляются экспресс-перевозчиком (DHL, FedEx, UPS) с полным отслеживанием и обычно прибывают за 3–5 рабочих дней.'
  category: b2b

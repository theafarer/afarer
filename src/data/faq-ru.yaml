- id: paddle-length
  question: 'Какая длина весла мне нужна?'
  answer: 'Весло должно быть на 6–8 дюймов выше вашего роста. Регулируемые весла позволяют точно подстроиться под разные условия. Подробные рекомендации по размеру — в нашем руководстве по вёслам.'
  category: product
  relatedProducts: []
  relatedGuides:

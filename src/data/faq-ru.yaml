  question: 'Вы предоставляете услуги OEM/ODM?'
  answer: 'Да. Мы предлагаем услуги private label и индивидуального дизайна для бизнеса. От нанесения бренда на существующие модели до полностью индивидуальных конструкций корпуса — наша инженерная команда может разработать продукты под вашим брендом. Действуют минимальные объёмы заказа.'
  category: ordering

  answer: 'Все продукты afarer подкреплены полной гарантией производителя. SUP-доски покрыты гарантией более 2 лет от производственных дефектов. Гарантия распространяется на дефекты материалов и изготовления при нормальной эксплуатации.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Как оформить гарантийную претензию?'
  answer: 'Оформите претензию, обратившись в нашу службу поддержки с номером заказа, фотографиями проблемы и кратким описанием. Большинство претензий рассматривается в течение 2 рабочих дней. По одобренным претензиям замена или инструкции по ремонту предоставляются в течение нескольких дней.'

- id: sup-learning
  question: 'Сложно ли научиться SUP?'
  answer: 'Совсем нет. Большинство новичков встают на доску и начинают грести уже на первой сессии. Наша серия All-Around SUP отличается особо широкими и стабильными платформами, разработанными специально для тех, кто гребёт впервые. Начните на спокойной воде — и уже через несколько минут вы будете спокойно скользить.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Можно ли использовать доску в океане?'
  answer: 'Да. SUP-доски afarer созданы для океана, озёр и рек. Наша серия Touring справляется с прибойной волной, а все доски изготовлены из морского PVC, устойчивого к коррозии от солёной воды. После выхода в океан ополосните доску пресной водой.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Сколько времени занимает накачивание?'
  answer: 'С входящей в комплект двухтактной помпой большинство досок накачивается до 12–15 PSI менее чем за 5 минут. Вариант с электрической помпой сокращает это время до 2 минут. Сдувание и упаковка занимают около 3 минут.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Можно ли путешествовать с надувным SUP?'
  answer: 'Конечно. Каждая доска afarer упаковывается в переносной чехол размером с рюкзак, который соответствует требованиям авиакомпаний к багажу. При весе всего 18–22 фунта её легко брать с собой на пляж, на озеро или в аэропорт.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Какой предел веса?'
  answer: 'Наши SUP All-Around выдерживают до 220 фунтов. Серии Touring и Yoga выдерживают до 250 фунтов. Для тандемной езды или больших нагрузок обратитесь к нашей команде за рекомендациями.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Что входит в комплект?'
  answer: 'Каждый SUP afarer включает доску, туристический рюкзак, двухтактную ручную помпу, съёмный плавник, спиральный лиш и ремкомплект. Некоторые модели также предлагают опцию карбонового весла.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Есть ли комплектные предложения?'
  answer: 'Да. Мы предлагаем готовые комплекты, которые позволяют сэкономить по сравнению с покупкой предметов по отдельности. Обратитесь к нашему отделу продаж, чтобы узнать о текущих акциях и оптовых скидках.'
  category: ordering

  relatedGuides: []
- id: pfd-requirement
  question: 'Нужен ли спасательный жилет на SUP?'
  answer: 'Да. Во многих странах закон требует наличия спасательного жилета на любом плавсредстве, включая SUP. Даже там, где это не обязательно, сертифицированный по CE спасательный жилет — важнейшее средство безопасности. Мы рекомендуем всегда надевать его на воде.'
  category: safety
  relatedProducts:

  question: 'Как afarer соотносится с другими брендами?'
  answer: 'afarer предлагает лучшее соотношение цены и качества в надувном снаряжении для водных видов спорта. По сравнению с Red Paddle Co afarer даёт 90% характеристик за 60% цены. По сравнению с iRocker afarer использует более качественный трёхслойный военный PVC и более высокие значения PSI. По сравнению с Bluefin afarer предлагает превосходящие характеристики материалов. Для большинства рекреационных гребцов afarer обеспечивает лучший баланс качества и цены.'

- id: sup-skill-progression
  question: 'Какова типичная прогрессия навыков SUP от новичка до продвинутого?'
  answer: 'Новичок (сессии 1-3): вставание, базовый прямой гребок, повороты, безопасные падения. Средний уровень (сессии 5-15): эффективная техника гребка, пивотные повороты, преодоление волны, базовые навыки спасения. Продвинутый (20+ сессий): гоночные старты, повороты вокруг буёв, сёрфинг на небольших волнах, гребля по ветру. Профессионал: соревновательные гонки, сёрф-SUP, дальние туринги. Доски afarer поддерживают каждый этап: Explorer 11 для новичков, Ocean Voyager для туринга и Cheetah Surge для скоростной гребли.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-cheetah-surge
  relatedGuides:

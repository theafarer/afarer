- id: sup-oem-process
  question: 'Каков производственный процесс OEM для private label надувных SUP?'
  answer: 'Процесс OEM: 1) Спецификации и дизайн-бриф — передайте целевые спецификации, чертежи CAD или референс-продукт. 2) Прототипирование на 3D-пресс-формах — индивидуальные алюминиевые и композитные пресс-формы собственной разработки. 3) Выбор материалов и образец — военный PVC или Hypalon с индивидуальными цветами и размещением логотипа. 4) Заводской аудит CE и соответствие — каждый заказ включает CE-декларацию, прослеживаемость ISO 9001, отчёт BSCI. 5) Серийное производство с 100-пунктным QC-чеклистом. 6) Отгрузка FOB Qingdao с полным экспортным пакетом документов. Срок 30-45 дней, MOQ 50 единиц (стандартный SUP).'
  category: ordering

    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Нужно ли регистрировать SUP-доску?'
  answer: 'Требования различаются в зависимости от региона. В большинстве регионов SUP без мотора не требуют регистрации. Если вы планируете установить мотор, уточните правила в местном морском ведомстве. Рекреационные доски для гребли, как правило, освобождены от регистрации судов.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Как отремонтировать прокол?'
  answer: 'Очистите повреждённое место, вырежьте заплатку со скруглёнными углами, нанесите клей для PVC, плотно прижмите и подождите 24 часа перед накачиванием. Доски afarer комплектуются ремкомплектом. Подробные инструкции — в нашем руководстве по ремонту надувных изделий.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Как хранить надувной SUP?'
  answer: 'Ополосните пресной водой, полностью высушите, полностью сдуйте, неплотно скатайте от носа и храните доску в чехле в прохладном сухом месте вдали от прямых солнечных лучей. Никогда не храните её влажной или при экстремальных температурах.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Надувная или жёсткая SUP-доска?'
  answer: 'Надувные доски дают портативность, удобство хранения и поглощение ударов. Жёсткие доски обеспечивают максимальную жёсткость и скорость. Для большинства рекреационных пользователей качественный надувной SUP с сердечником drop-stitch — практичный выбор.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'При какой скорости ветра кататься на SUP опасно?'
  answer: 'Новички: свыше 10 mph (8 узлов). Средний уровень: свыше 15 mph (13 узлов). Продвинутые: свыше 20 mph (17 узлов). Если сомневаетесь — не выходите на воду. Береговой ветер (дующий с суши в море) опасен на любом уровне подготовки.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty

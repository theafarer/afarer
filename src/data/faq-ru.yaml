- id: sup-weight-capacity
  question: 'Какой вес выдерживает надувная SUP-доска?'
  answer: 'Грузоподъёмность зависит от объёма доски. Доски afarer: SUP Explorer 11 (260 л, до 100 кг / 220 фунтов), Ocean Voyager 12 (310 л, до 140 кг / 308 фунтов), Leviathan Wake (350 л, до 180 кг / 396 фунтов). Для оптимальных характеристик держите общую нагрузку (райдер + снаряжение) в пределах 80% от максимума. Без перегрузки доска идёт выше и лучше держит курс, особенно на волне.'
  category: product

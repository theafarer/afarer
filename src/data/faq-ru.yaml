  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Как выбрать объём SUP под мой вес?'
  answer: 'Умножьте свой вес в кг на 2,2, чтобы получить целевой объём для новичка. Например, гребцу весом 75 кг нужно минимум 165 литров, но 220–260 литров дают гораздо большую стабильность при обучении. SUP Explorer 11 предлагает 260 литров и подходит для райдеров весом до 100 кг.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide

- id: b2b-payment
  question: 'Какие условия оплаты доступны для OEM-заказов?'
  answer: 'Стандартные условия: 30% депозит по подписанной PI (проформа-инвойсу), 70% остаток перед отгрузкой против копии B/L (коносамента). Для новых партнёров: 50% депозит, 50% перед отгрузкой. Для постоянных партнёров с историей заказов: L/C по предъявлении или net 30 дней для квалифицированных счетов (по результатам кредитной проверки). Способы оплаты: банковский перевод T/T, L/C (letter of credit), Western Union. Все платежи в USD или EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Как afarer защищает мою интеллектуальную собственность и дизайн?'
  answer: 'Защита ИС — основа нашего OEM-сервиса. Мы подписываем NDA до любых обсуждений дизайна. Файлы дизайна обрабатываются на изолированных рабочих станциях с журналированием доступа. Вся оснастка и пресс-формы остаются вашей эксклюзивной собственностью (оплачены вами). Мы не будем использовать ваши пресс-формы или дизайн для других клиентов. Хранение и обслуживание пресс-форм включены для активных счетов. При расторжении договора пресс-формы отправляются вам либо уничтожаются с видеофиксацией. Мы уважаем все товарные знаки и патентные права.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Какие варианты доставки и логистики доступны?'
  answer: 'FOB Qingdao (стандарт): груз загружается в порту Циндао; далее перевозку организуете вы. CIF (указанный порт): мы организуем и страхуем доставку до вашего порта назначения. DDP / до двери: логистика под ключ, включая таможенное оформление и доставку адресату. Морская доставка на западное побережье США: около 25–30 дней. Морская доставка в ЕС (Гамбург/Роттердам): около 30–35 дней. Авиадоставка доступна для срочных заказов (3–5 дней). Мы оформляем всю экспортную таможенную документацию, сертификаты происхождения и упаковочные листы.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Какие процессы контроля качества применяются к OEM-заказам?'
  answer: 'Каждый OEM-заказ следует документированному плану QC: 1) Входной контроль материалов — партийные испытания PVC-ткани на толщину, прочность на разрыв и UV-стойкость. 2) Пооперационный QC — испытание прочности сварных швов каждые 50 единиц, тест на удержание давления при 1,5x паспортного PSI. 3) Финальная инспекция — 100% визуальный контроль и испытание давлением каждой доски. 4) Выборка AQL — выборочный контроль партий по ISO 2859 с нулевым уровнем приёмки критических дефектов. 5) Инспекция третьей стороной — SGS, Bureau Veritas или Intertek за счёт покупателя.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Можете ли вы создать индивидуальную упаковку для моего бренда?'
  answer: 'Да. Мы предлагаем полный цикл индивидуальной упаковки: розничные коробки с полноцветной CMYK-печатью и фирменной графикой, чехлы с шелкографией или вышивкой логотипа, инструкции на вашем языке, бирки и штрихкод/UPC-этикетки, а также внутреннюю упаковку (полиэтиленовые пакеты, пенопластовые вставки). Минимальные MOQ упаковки: 500–1000 единиц для индивидуальных коробок, 200–500 для чехлов. Услуга дизайна упаковки включена в OEM-заказы.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Можно ли посетить фабрику или организовать аудит третьей стороной?'
  answer: 'Посещения фабрики приветствуются по предварительной записи. Мы принимаем владельцев брендов круглый год и можем организовать трансфер из аэропорта Циндао Цзяодун (TAO). Для покупателей, которые не могут приехать, мы предлагаем: виртуальный тур по фабрике по видеосвязи, организацию аудита третьей стороной с SGS/Bureau Veritas (за счёт покупателя) и детальный пакет документов о возможностях производства: список оборудования, схему QC-процессов и квалификации персонала.'

    - sup-safety-guide
    - wind-conditions-sup
- id: sup-sustainability
  question: 'هل ألواح SUP القابلة للنفخ مستدامة بيئيًا؟'
  answer: 'تتمتع ألواح SUP القابلة للنفخ ببصمة بيئية أقل من الألواح الصلبة بعدة طرق: فهي تستخدم مواد خام أقل في الإنتاج، ووزنها الأخف يقلل من انبعاثات الشحن، ومتانتها تعني استبدالًا أقل بمرور الوقت. وPVC المستخدم في ألواح afarer خالٍ من الرصاص ومتوافق مع REACH. وممارسات الاستدامة الرئيسية: اشترِ لوحًا عالي الجودة يدوم من 5-10 سنوات، وأصلح الثقوب بدلًا من الاستبدال، وأعد تدوير اللوح في نهاية عمره عبر برامج إعادة تدوير PVC المتخصصة، وتجنب التغليف للاستخدام الواحد باختيار العلامات التي تستخدم حقائب حمل قابلة لإعادة الاستخدام.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: 'ما هي كمية الطلب الأدنى لإنتاج OEM/ODM لألواح SUP؟'
  answer: 'تختلف كميات الطلب الأدنى (MOQ) حسب نوع المنتج. العلامات المخصصة للطرازات المتوفرة: 50 وحدة لكل SKU. تطوير قوالب الأشكال المخصصة: 200–500 وحدة لكل طراز (الطلب الأول). برامج مشاركة القوالب متاحة من 50 وحدة. إنتاج قوارب Hypalon: 20–50 وحدة حسب الحجم. الملحقات وسترات النجاة: 500–1000 وحدة لكل تصميم. تواصل مع فريق OEM لدينا بحجمك المتوقع للحصول على MOQ وأسعار دقيقة.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'ما هي مدد التنفيذ المعتادة لطلبات OEM لألواح SUP؟'
  answer: 'طلبات OEM الأولى بوضع علامات مخصصة على قوالب موجودة: 6–8 أسابيع من الدفعة المقدمة إلى FOB Qingdao. والطلبات ذات الأشكال المخصصة التي تتطلب قوالب جديدة: 12–20 أسبوعًا (تشمل التصميم ثلاثي الأبعاد وتصنيع القوالب والنماذج الأولية والإنتاج بالجملة). والطلبات المتكررة بالمواصفات المعتمدة: 6–8 أسابيع. ويمكن تسريع الطلبات العاجلة إلى 4–5 أسابيع للقوالب الموجودة. وتشمل مدد التنفيذ توريد المواد الخام والإنتاج وفحص QC أثناء العمل وتحميل الحاويات.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'ما الشهادات التي تحملها منتجات afarer OEM؟'
  answer: 'تحمل جميع منتجات afarer OEM/ODM: إعلان مطابقة CE (سوق الاتحاد الأوروبي)، وUKCA (السوق البريطاني)، ونظام إدارة الجودة ISO 9001:2015، وتدقيق الامتثال الاجتماعي BSCI، والامتثال المادي REACH وRoHS، وتصنيف EN ISO 25649 للقوارب القابلة للنفخ. وشهادات إضافية متاحة عند الطلب: وثائق امتثال خفر السواحل الأمريكي، واختبارات المعايير العسكرية (MIL-STD-810)، ودعم شهادات الاستيراد لدولة الوجهة.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'هل يمكنني طلب عينات قبل الالتزام بالإنتاج بالجملة؟'
  answer: 'نعم. طلبات العينات متاحة لجميع مشاريع OEM/ODM. تُنتج عينات ما قبل الإنتاج (PPS) بعد تصنيع القوالب وقبل الإنتاج بالجملة. مدة تنفيذ العينة: 15–25 يوم عمل للقوالب الموجودة، و25–40 يوم عمل للقوالب المخصصة. وتُخصم تكاليف العينات من أول طلب بالجملة. وتُشحن العينات عبر شركات الشحن السريع (DHL وFedEx وUPS) مع تتبع كامل وتصل عادة في 3–5 أيام عمل.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'ما هي شروط الدفع المتاحة لطلبات OEM؟'
  answer: 'شروط الدفع القياسية: دفعة مقدمة 30% مع توقيع PI (فاتورة مبدئية)، ودفعة 70% قبل الشحن مقابل نسخة من B/L (سند الشحن). وللشركاء الجدد: دفعة مقدمة 50% ودفعة 50% قبل الشحن. وللشركاء الثابتين ذوي تاريخ الطلبات: L/C عند الاستلام أو صافي 30 يومًا للحسابات المؤهلة (رهن المراجعة الائتمانية). طرق الدفع: تحويل برقي T/T وL/C (خطاب اعتماد) وWestern Union. وجميع المدفوعات بالدولار الأمريكي أو اليورو.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'كيف تحمي afarer ملكيتي الفكرية وتصاميمي؟'
  answer: 'حماية الملكية الفكرية جزء أساسي من خدمة OEM لدينا. نوقع اتفاقيات NDA قبل أي نقاش تصميمي. وتُدار ملفات التصميم على محطات عمل معزولة مع تسجيل عمليات الدخول. وتظل جميع العدد والقوالب ملكًا حصريًا لك (التي دفعت ثمنها). ولن نعيد استخدام قوالبك أو تصاميمك لعملاء آخرين. وتخزين القوالب وصيانتها مشمولان للحسابات النشطة. وعند إنهاء الاتفاقية، تُشحن القوالب إليك أو تُتلف مع توثيق بالفيديو. ونحترم جميع حقوق العلامات التجارية وبراءات الاختراع.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'ما هي خيارات الشحن والخدمات اللوجستية المتاحة؟'
  answer: 'FOB Qingdao (قياسي): تُحمّل البضائع في ميناء تشينغداو؛ وتتولى أنت ترتيب الشحن من هناك. CIF (ميناء محدد): نرتب الشحن ونؤمّنه إلى ميناء وجهتك. DDP / من الباب إلى الباب: خدمات لوجستية كاملة تشمل التخليص الجمركي والتسليم النهائي. الشحن البحري إلى الساحل الغربي الأمريكي: حوالي 25–30 يومًا. والشحن البحري إلى الاتحاد الأوروبي (هامبورغ/روتردام): حوالي 30–35 يومًا. والشحن الجوي متاح للطلبات العاجلة (3–5 أيام). ونتولى جميع وثائق التصدير الجمركية وشهادات المنشأ وقوائم التعبئة.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'ما هي عمليات مراقبة الجودة المطبقة على طلبات OEM؟'
  answer: 'يتبع كل طلب OEM خطة QC موثقة: 1) فحص المواد الواردة — اختبار دفعات قماش PVC للسماكة ومقاومة الشد ومقاومة الأشعة فوق البنفسجية. 2) QC أثناء العملية — اختبار قوة لحام الدرزات كل 50 وحدة، واختبار الاحتفاظ بالضغط عند 1,5x من PSI المعتمد. 3) الفحص النهائي — فحص بصري بنسبة 100% واختبار ضغط لكل لوح. 4) أخذ عينات AQL — أخذ عينات دفعية وفق ISO 2859 مع قبول العيب الحرج = 0. 5) فحص الطرف الثالث — SGS أو Bureau Veritas أو Intertek متاحة على نفقة المشتري.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'هل يمكنكم إنشاء تغليف مخصص لعلامتي التجارية؟'
  answer: 'نعم. نقدم خدمات تغليف مخصص كاملة: علب تجزئة بطباعة CMYK كاملة الألوان ورسومات العلامة التجارية، وحقائب حمل بشعارات مطبوعة أو مطرزة، وأدلة تعليمات بلغتك، وبطاقات تعليق وملصقات باركود/UPC، وتغليف داخلي (أكياس بولي إيثيلين وحشوات فوم). وMOQ التغليف الأدنى: 500–1000 وحدة للعلب المخصصة، و200–500 لحقائب الحمل. وخدمة تصميم التغليف مشمولة مع طلبات OEM.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'هل يمكنني زيارة المصنع أو ترتيب تدقيق من طرف ثالث؟'
  answer: 'زيارات المصنع مرحب بها بموعد مسبق. نستضيف أصحاب العلامات التجارية على مدار العام ويمكننا ترتيب استقبالك من مطار تشينغداو جياودونغ الدولي (TAO). وللمشترين الذين لا يستطيعون الزيارة، نقدم: جولة افتراضية في المصنع عبر مكالمة فيديو، وتنسيق تدقيق طرف ثالث مع SGS/Bureau Veritas (يتحمل المشتري تكلفة التدقيق)، وحزمة وثائق قدرات المصنع التفصيلية بما في ذلك قائمة المعدات وتدفق عمليات QC ومؤهلات الموظفين.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

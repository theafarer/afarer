- id: sup-learning
  question: 'هل تعلم رياضة SUP صعب؟'
  answer: 'ليس على الإطلاق. يتمكن معظم المبتدئين من الوقوف والتجديف خلال جلستهم الأولى. تتميز سلسلة All-Around من afarer بمنصات واسعة إضافية مستقرة صُممت خصيصًا للمجدفين لأول مرة. ابدأ على مياه هادئة وستنطلق في غضون دقائق.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'هل يمكنني استخدامه في المحيط؟'
  answer: 'نعم. صُممت ألواح SUP من afarer للاستخدام في المحيط والبحيرة والنهر. تتعامل سلسلة Touring مع أمواج الساحل، وتستخدم جميع الألواح PVC بدرجة بحرية يقاوم تآكل المياه المالحة. اشطفها بالماء العذب بعد الاستخدام في المحيط.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'كم من الوقت يستغرق نفخ اللوح؟'
  answer: 'مع المضخة ثنائية المفعول المرفقة، تنتفخ معظم الألواح إلى 12–15 PSI في أقل من 5 دقائق. ويقلل خيار المضخة الكهربائية لدينا ذلك إلى أقل من دقيقتين. يستغرق تفريغ الهواء والتعبئة حوالي 3 دقائق.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'هل يمكنني السفر بلوح SUP قابل للنفخ؟'
  answer: 'بالتأكيد. يُعبأ كل لوح من afarer في حافظة حمل بحجم حقيبة الظهر تستوفي متطلبات أمتعة شركات الطيران. وبوزن يبلغ 18–22 باوند فقط، من السهل حمله إلى الشاطئ أو البحيرة أو عبر صالات المطار.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'ما هو الحد الأقصى للوزن؟'
  answer: 'تدعم ألواح All-Around SUP لدينا حتى 220 باوند. وتدعم سلسلتا Touring وYoga حتى 250 باوند. للاستخدام المزدوج أو الأحمال الأثقل، تواصل مع فريقنا للحصول على التوصيات.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'ماذا يوجد في العلبة؟'
  answer: 'يتضمن كل لوح SUP من afarer اللوح وحقيبة ظهر للسفر ومضخة يدوية ثنائية المفعول وزعنفة قابلة للإزالة وحبل leash حلزوني وطقم إصلاح. وتشمل بعض الطرازات أيضًا خيار ترقية المجداف الكربوني.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'هل تقدمون عروض حزم؟'
  answer: 'نعم. نقدم حزمًا منتقاة توفر عليك المال مقارنة بشراء العناصر بشكل منفصل. تواصل مع فريق المبيعات لدينا لمعرفة عروض الحزم الحالية وأسعار خصومات الكمية.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'هل أحتاج إلى سترة نجاة على لوح SUP؟'
  answer: 'نعم. يفرض العديد من الولايات القضائية قانونيًا سترة نجاة على أي مركبة مائية، بما في ذلك ألواح SUP. وحتى في الأماكن التي لا تكون فيها مطلوبة، تُعد سترة النجاة المعتمدة بشهادة CE معدات أمان أساسية. نوصي بارتدائها طوال الوقت على الماء.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'هل أحتاج إلى تسجيل لوح SUP الخاص بي؟'
  answer: 'تختلف المتطلبات حسب الولاية القضائية. في معظم المناطق، لا تتطلب ألواح SUP غير المزودة بمحرك أي تسجيل. إذا كنت تخطط لإضافة محرك، فاستعلم لدى سلطة الشؤون البحرية المحلية عن القواعد المحددة. تُعفى ألواح التجديف الترفيهية عمومًا من تسجيل القوارب.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'كيف أصلح الثقب؟'
  answer: 'نظف المنطقة، واقطع رقعة بزوايا مستديرة، وضع لاصق PVC، واضغط بقوة، وانتظر 24 ساعة قبل النفخ. تتضمن ألواح afarer طقم إصلاح. للحصول على تعليمات مفصلة، راجع دليل إصلاح الألواح القابلة للنفخ لدينا.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'كيف يجب أن أخزن لوح SUP القابل للنفخ؟'
  answer: 'اشطفه بالماء العذب، وجففه تمامًا، وافرغ الهواء بالكامل، ولفه بشكل فضفاض من المقدمة، وخزنه في حقيبة الحمل في مكان بارد جاف بعيدًا عن أشعة الشمس المباشرة. لا تخزنه أبدًا وهو مبلل أو في درجات حرارة قاسية.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'لوح SUP قابل للنفخ أم صلب؟'
  answer: 'توفر الألواح القابلة للنفخ قابلية الحمل وسهولة التخزين وامتصاص الصدمات. بينما توفر الألواح الصلبة أقصى صلابة وسرعة. بالنسبة لمعظم المستخدمين الترفيهيين، يُعد اللوح القابل للنفخ عالي الجودة بنواة drop-stitch هو الخيار العملي.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'ما سرعة الرياح التي تعد مرتفعة جدًا لرياضة SUP؟'
  answer: 'للمبتدئين: أكثر من 10 mph (8 عقد). للمتوسطين: أكثر من 15 mph (13 عقد). للمتقدمين: أكثر من 20 mph (17 عقد). إذا كنت في شك، فلا تخرج. الرياح الشاطئية (التي تهب من اليابسة نحو البحر) خطيرة على أي مستوى مهارة.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'ما هي ضمانة afarer؟'
  answer: 'تتمتع جميع منتجات afarer بضمان شامل من الشركة المصنعة. تُغطى ألواح SUP لمدة تزيد على عامين ضد عيوب التصنيع. يغطي الضمان عيوب المواد والصناعة في ظل الاستخدام العادي.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'كيف أقدم مطالبة ضمان؟'
  answer: 'قدّم مطالبة عن طريق التواصل مع فريق الدعم لدينا مع رقم طلبك وصور للمشكلة ووصف موجز. تتم مراجعة معظم المطالبات خلال يومي عمل. تحصل المطالبات المعتمدة على استبدال أو تعليمات إصلاح خلال أيام.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'كم يستغرق الشحن؟'
  answer: 'تُشحن الطلبات المتوفرة خلال 2–4 أيام عمل. تصل الطلبات المحلية الأمريكية خلال 5–10 أيام عمل. وتصل الطلبات الدولية خلال 10–15 يوم عمل حسب الوجهة. يمكن تسريع الطلبات العاجلة.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'ما هي سياسة الإرجاع لديكم؟'
  answer: 'نقبل الإرجاع خلال 30 يومًا من التسليم للمنتجات غير المستخدمة في عبوتها الأصلية. الطلبات المخصصة/طلبات OEM غير قابلة للإرجاع. تواصل مع فريق الدعم لدينا لبدء عملية إرجاع — نحن نوفر ملصق شحن مدفوعًا مسبقًا.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'هل تقدمون خدمات OEM/ODM؟'
  answer: 'نعم. نقدم خدمات العلامة الخاصة والتصميم المخصص للشركات. من وضع العلامات التجارية المخصصة على الطرازات الحالية إلى تصاميم الهيكل المخصصة بالكامل، يمكن لفريق الهندسة لدينا تطوير منتجات تحت علامتك التجارية. تنطبق كميات الطلب الأدنى.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'ما طول المجداف الذي أحتاجه؟'
  answer: 'يجب أن يكون المجداف أطول من طولك بمقدار 6–8 بوصة. تتيح المجاديف القابلة للتعديل ضبطًا دقيقًا للظروف المختلفة. راجع دليل المجاديف لدينا لمعرفة المقاسات التفصيلية.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'ما الفرق بين PVC وHypalon؟'
  answer: 'PVC خفيف الوزن وبأسعار معقولة وسهل الإصلاح بطقم الرقع المرفق. ويوفر PVC بدرجة عسكرية مع طلاء مقاوم للأشعة فوق البنفسجية أفضل توازن بين المتانة والوزن للاستخدام الترفيهي لألواح SUP. تستخدم afarer PVC مصفحًا ثلاثي الطبقات عبر جميع فئات المنتجات.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'ما عرض لوح SUP الأفضل للاستقرار؟'
  answer: 'للمبتدئين، يوفر عرض 33–34 بوصة أفضل توازن بين الاستقرار وسهولة التجديف. تبدو الألواح الأضيق من 32 بوصة غير مستقرة للمجدفين الجدد. ولوح afarer SUP Explorer 11 بعرض 33 بوصة مثالي للتعلم.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'كيف أختار حجم لوح SUP المناسب لوزني؟'
  answer: 'اضرب وزنك بالكيلوجرام في 2,2 للحصول على حجم مناسب للمبتدئين. على سبيل المثال، يحتاج مجدف يزن 75 كجم إلى 165 لترًا على الأقل، لكن 220–260 لترًا أكثر استقرارًا بكثير للتعلم. يوفر SUP Explorer 11 سعة 260 لترًا، وهو مناسب للراكبين حتى 100 كجم.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'كيف يقارن afarer بالعلامات التجارية الأخرى؟'
  answer: 'تقدم afarer أفضل قيمة في معدات الرياضات المائية القابلة للنفخ. مقارنة بـ Red Paddle Co، يقدم afarer 90% من الأداء بتكلفة 60%. مقارنة بـ iRocker، تستخدم afarer PVC عسكريًا ثلاثي الطبقات أعلى درجة وتقييمات PSI أعلى. مقارنة بـ Bluefin، تقدم afarer مواصفات مواد متفوقة. بالنسبة لمعظم المجدفين الترفيهيين، توفر afarer أفضل توازن بين الجودة والسعر.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - best-surf-gear-brands-compared
    - afarer-vs-red-paddle
    - afarer-vs-irocker
    - afarer-vs-bluefin
- id: fishing-sup-setup
  question: 'هل يمكنني الصيد من لوح SUP؟'
  answer: 'نعم. أصبح الصيد من لوح SUP شائعًا بشكل متزايد لأن وضعية الوقوف توفر رؤية ممتازة داخل الماء. اختر لوحًا طوله 11 قدمًا على الأقل وعرضه 33–34 بوصة للاستقرار. أضف صندوقًا بحوامل قصبات صيد مثبتة على أربطة سطح اللوح، ومرساة صغيرة، وارتدِ دائمًا سترة نجاة. ويعمل afarer SUP Explorer 11 بشكل جيد للصيد غير الرسمي.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: 'هل يمكنني ممارسة اليوغا على لوح SUP؟'
  answer: 'بالتأكيد. تجمع يوغا SUP بين الأوضاع التقليدية وتحدي المنصة العائمة، مما ينشط عضلات التثبيت الأعمق. استخدم لوحًا بعرض 33 بوصة أو أكثر مع وسادة سطح ناعمة مانعة للانزلاق. تمرن في مياه هادئة وضحلة مع مرساة. ابدأ بأوضاع أساسية مثل الكلب المتجه لأسفل والمحارب الثاني ووضعية الشجرة. ولوح SUP Explorer 11 بوسادة سطح EVA الكاملة مناسب تمامًا.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: 'ما هي قواعد شركات الطيران للسفر بلوح SUP قابل للنفخ؟'
  answer: 'تقبل معظم شركات الطيران حقائب ظهر SUP كأمتعة مسجلة إذا كان الوزن أقل من 23–32 كجم. وتبلغ حقيبة الظهر من afarer تقريبًا 90x40x30 سم وتزن حوالي 15 كجم عند تعبئتها. وقد تفرض بعض شركات الطيران رسومًا على الأمتعة كبيرة الحجم. احضر مبكرًا، ولف الزعانف والمضخة بشكل منفصل في أمتعتك اليدوية، وضع علامة على الحقيبة بأنها هشة. وابحث دائمًا عن سياسة شركة الطيران بشأن المعدات الرياضية قبل السفر.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'ما معدات السلامة التي أحتاجها للتجديف في المياه الباردة؟'
  answer: 'تتطلب المياه الأبرد من 15°C حماية حرارية. ولدرجات 8–14°C استخدم بذلة غوص أو بدلة جافة مع أحذية وقفازات وغطاء رأس. ولدرجات 14–20°C تكفي بذلة غوص بسماكة 3/2mm. وارتدِ دائمًا سترة نجاة مناسبة المقاس للحماية الحرارية والسلامة. وتحقق من اللوائح المحلية بشأن متطلبات المعدات الإلزامية.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'ما هي كميات الطلب الأدنى لخدمات OEM/ODM؟'
  answer: 'تختلف كميات الطلب الأدنى (MOQ) حسب نوع المنتج ومدى تعقيده. يتطلب وضع العلامات التجارية المخصصة على الطرازات الحالية عادة 5–10 وحدات. أما تصاميم الهياكل المخصصة بالكامل فتتطلب كميات MOQ أعلى. تواصل مع فريق المبيعات لدينا مع متطلباتك للحصول على عرض سعر تفصيلي. نتولى كل شيء من الألوان والشعارات المخصصة إلى تصاميم القوالب الأصلية تمامًا.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'هل يمكنني وضع شعاري الخاص على منتجات afarer؟'
  answer: 'نعم. تتضمن خدمة OEM لدينا وضع الشعارات المخصصة وأنظمة الألوان المخصصة والتغليف المخصص. نقدم خيارات الطباعة الوسادية والنقل الحراري والتطريز حسب نوع المنتج. أرسل تصميمك الفني ومواصفاتك إلى فريق المبيعات لدينا للحصول على عرض سعر وتقدير لمدة التنفيذ.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'إلى أي PSI يجب أن أنفخ لوح SUP الخاص بي؟'
  answer: 'انفخ اللوح إلى الحد الأقصى المعتمد له للحصول على أفضل أداء — عادة 15–18 PSI للألواح القابلة للنفخ عالية الجودة. ويقدم afarer SUP Explorer 11 أفضل أداء عند 15–18 PSI. النفخ غير الكافي يجعل اللوح طريًا ويتبع مسارًا غير دقيق. والنفخ الزائد عن الحد الأقصى المعتمد يخاطر بإتلاف خيوط drop-stitch. تحقق من الملصق الموجود قرب الصمام لمعرفة التقييم المحدد للوحك.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide
- id: sup-deck-pad-care
  question: 'كيف أنظف وسادة سطح EVA وأحافظ عليها؟'
  answer: 'اشطف وسادة السطح بالماء العذب بعد كل جلسة. للأوساخ أو البقع، استخدم صابونًا معتدلًا وفرشاة ناعمة — وتجنب المواد الكيميائية القاسية. إذا بدأت الحواف في الارتفاع، ضع كمية صغيرة من لاصق بحري مقاوم للماء واضغط تحت ثقل لمدة 24 ساعة. وأبقِ اللوح بعيدًا عن الأشعة فوق البنفسجية المباشرة عند عدم الاستخدام لمنع تدهور الوسادة.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'هل يمكنني تجديف لوح SUP وأنا جالس؟'
  answer: 'نعم. تحتوي العديد من ألواح SUP، بما في ذلك afarer Explorer 11، على حلقات D تسمح بتثبيت مقعد. يوفر التجديف الجالس خيارًا مريحًا للرحلات الأطول أو الصيد أو عندما تريد تغيير الوضعية على الماء.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: 'هل أحتاج إلى شطف لوحي القابل للنفخ بعد الاستخدام في المحيط؟'
  answer: 'نعم — اشطف دائمًا اللوح والزعانف والمضخة والمجداف بالماء العذب بعد الاستخدام في المياه المالحة. تتسلل بلورات الملح إلى الدرزات والصمامات مسببة تسريبات دقيقة وتآكلًا. جفف اللوح في الظل قبل تفريغ الهواء والتخزين. ويطيل الشطف المنتظم عمر لوحك القابل للنفخ بشكل كبير.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'هل أحتاج فعلًا إلى leash لممارسة SUP؟'
  answer: 'نعم — ارتدِ leash دائمًا. ترتبط leash SUP الحلزونية بكاحلك أو ساقك وتبقي اللوح معك إذا سقطت. في المياه المفتوحة، يمكن لـ leash أن تنقذ حياتك بمنع الانفصال عن وسيلة الطفو الخاصة بك. وللتجديف في الأنهار، استخدم leash ذات تحرير سريع لمنع الانحصار.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide

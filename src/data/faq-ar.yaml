- id: sup-weight-capacity
  question: 'كم وزنًا يمكن أن يتحمله لوح SUP قابل للنفخ؟'
  answer: 'تختلف سعة الوزن حسب حجم اللوح. ألواح afarer: SUP Explorer 11 (260L، حتى 100 كجم / 220 باوند)، وOcean Voyager 12 (310L، حتى 140 كجم / 308 باوند)، وLeviathan Wake (350L، حتى 180 كجم / 396 باوند). وللحصول على الأداء الأمثل، حافظ على إجمالي الحمل (الراكب + المعدات) في حدود 80% من السعة القصوى. يطفو اللوح أعلى ويتتبع مسارًا أفضل عند عدم تحميله زيادة، خاصة في الظروف المتموجة.'
  category: product
  relatedProducts:

- id: sup-learning
  question: 'Je ťažké naučiť sa SUP?'
  answer: 'Vôbec nie. Väčšina začiatočníkov sa postaví a pádluje už počas svojho prvého výjazdu. Naša séria All-Around SUP má mimoriadne široké a stabilné plošiny navrhnuté špeciálne pre tých, ktorí pádlujú prvýkrát. Začnite na pokojnej vode a už o niekoľko minút sa budete pokojne plaviť.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Môžem ju použiť v oceáne?'
  answer: 'Áno. SUP dosky afarer sú vyrobené na použitie v oceáne, na jazerách aj na riekach. Naša séria Touring zvláda pobrežné vlnenie a všetky dosky používajú námornú PVC, ktorá odoláva korózii od slanej vody. Po použití v oceáne ich opláchnite sladkou vodou.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Ako dlho trvá nafúknutie?'
  answer: 'S priloženou dvojčinnou pumpou sa väčšina dosiek nafúka na 12–15 PSI za menej ako 5 minút. Naša možnosť elektrickej pumpy skráti tento čas na menej ako 2 minúty. Vypustenie vzduchu a zabalenie trvá približne 3 minúty.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Môžem cestovať s nafukovacou SUP doskou?'
  answer: 'Samozrejme. Každá doska afarer sa zmestí do puzdra veľkosti batohu, ktoré spĺňa požiadavky aerolínií na batožinu. S hmotnosťou len 18–22 lbs ju ľahko prenesiete na pláž, k jazeru alebo cez terminály letiska.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Aký je limit hmotnosti?'
  answer: 'Naše dosky All-Around SUP unesú až 220 lbs. Série Touring a Yoga unesú až 250 lbs. Pre tandemové použitie alebo ťažšie zaťaženie kontaktujte náš tím pre odporúčania.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Čo je súčasťou balenia?'
  answer: 'Každá SUP doska afarer obsahuje dosku, cestovný batoh, dvojčinnú ručnú pumpu, odnímateľnú plutvu, šnúrový leash a opravnú sadu. Niektoré modely ponúkajú aj možnosť výbavy karbónovým pádlom.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Ponúkate výhodné súpravy?'
  answer: 'Áno. Ponúkame starostlivo zostavené súpravy, vďaka ktorým ušetríte v porovnaní s kúpou jednotlivých položiek osobitne. Kontaktujte náš predajný tím pre aktuálne promočné ponuky súprav a ceny s množstevnou zľavou.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Potrebujem na SUP doske záchrannú vestu?'
  answer: 'Áno. Mnohé jurisdikcie zákonne vyžadujú záchrannú vestu na akomkoľvek plavidle, vrátane SUP dosiek. Aj tam, kde nie je povinná, je záchranná vesta s certifikáciou CE nevyhnutnou bezpečnostnou výbavou. Odporúčame ju nosiť na vode neustále.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Musím si registrovať svoju SUP dosku?'
  answer: 'Požiadavky sa líšia podľa jurisdikcie. Vo väčšine regiónov sa SUP dosky bez motora nemusia registrovať. Ak plánujete pridať motor, overte si konkrétne pravidlá u miestnej námornej autority. Rekreačné paddleboardy sú vo všeobecnosti oslobodené od registrácie plavidiel.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Ako opravím prepichnutie?'
  answer: 'Očistite miesto, vystrihnite záplatu s zaoblenými rohmi, naneste PVC lepidlo, pevne pritlačte a pred nafúknutím počkajte 24 hodín. Dosky afarer obsahujú opravnú sadu. Podrobný postup nájdete v našom sprievodcovi opravami nafukovacích dosiek.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Ako mám skladovať svoju nafukovaciu SUP dosku?'
  answer: 'Opláchnite ju sladkou vodou, úplne vysušte, úplne vypustite vzduch, voľne zroľujte od predku a uložte v prenosnom puzdre na chladnom a suchom mieste mimo priameho slnečného žiarenia. Nikdy ju neskladujte vlhkú ani pri extrémnych teplotách.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Nafukovacia alebo pevná SUP doska?'
  answer: 'Nafukovacie dosky ponúkajú prenositeľnosť, pohodlné skladovanie a absorpciu nárazov. Pevné dosky ponúkajú maximálnu tuhosť a rýchlosť. Pre väčšinu rekreačných používateľov je kvalitná nafukovacia doska s jadrom drop-stitch praktickou voľbou.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Aká rýchlosť vetra je na SUP príliš vysoká?'
  answer: 'Začiatočníci: nad 10 mph (8 uzlov). Stredne pokročilí: nad 15 mph (13 uzlov). Pokročilí: nad 20 mph (17 uzlov). Ak máte pochybnosti, nevyplávajte. Vietor fúkajúci od pevniny na more (offshore) je nebezpečný pri akejkoľvek úrovni zručností.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Aká je záruka afarer?'
  answer: 'Všetky produkty afarer sú kryté komplexnou zárukou výrobcu. SUP dosky sú kryté viac ako 2 roky proti výrobným vadám. Záruka pokrýva vady materiálu a spracovania pri bežnom používaní.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Ako uplatním reklamáciu?'
  answer: 'Reklamáciu uplatníte kontaktovaním nášho tímu podpory s uvedením čísla objednávky, fotografií problému a krátkeho popisu. Väčšina reklamácií sa posúdi do 2 pracovných dní. Pri schválených reklamáciách obdržíte náhradu alebo pokyny na opravu v priebehu niekoľkých dní.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Ako dlho trvá doprava?'
  answer: 'Objednávky dostupné na sklade sa odosielajú do 2–4 pracovných dní. Domáce objednávky v USA dorazia za 5–10 pracovných dní. Medzinárodné objednávky dorazia za 10–15 pracovných dní v závislosti od destinácie. Naléhavé objednávky je možné urýchliť.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Aké sú vaše podmienky vrátenia tovaru?'
  answer: 'Vrátenie tovaru prijímame do 30 dní od doručenia pre nepoužité produkty v pôvodnom balení. Zakázkové/OEM objednávky nie je možné vrátiť. Kontaktujte náš tím podpory a začnite proces vrátenia — poskytneme predplatený dopravný štítok.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Ponúkate služby OEM/ODM?'
  answer: 'Áno. Pre firmy ponúkame služby privátnej značky a vlastného dizajnu. Od vlastného značenia existujúcich modelov až po úplne vlastné dizajny trupov dokáže náš inžiniersky tím vyvinúť produkty pod vašou značkou. Platia minimálne objednávkové množstvá.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Akú dĺžku pádla potrebujem?'
  answer: 'Pádlo by malo byť o 6–8 palcov vyššie ako vaša výška. Nastaviteľné pádla umožňujú jemné doladenie pre rôzne podmienky. Podrobné dimenzovanie nájdete v našom sprievodcovi výberom pádla.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Aký je rozdiel medzi jednovrstvovými a viacvrstvovými PVC SUP doskami?'
  answer: 'Jednovrstvové PVC dosky sú ľahké a cenovo dostupné, pri vysokom tlaku sú však menej tuhé. Dvojvrstvové a fúzne laminované konštrukcie pridávajú tuhosť, odolnosť voči prepichnutiu a životnosť. Vojenská trieda PVC s UV-odolným povlakom ponúka pre rekreačné použitie SUP najlepšiu rovnováhu medzi odolnosťou a hmotnosťou. afarer používa trojvrstvové laminované PVC vo všetkých produktových triedach.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Aká šírka SUP dosky je najlepšia pre stabilitu?'
  answer: 'Pre začiatočníkov poskytuje šírka 33–34 palcov najlepšiu rovnováhu medzi stabilitou a ľahkým pádlovaním. Dosky užšie ako 32 palcov pôsobia na nových pádlarov nestabilne. afarer SUP Explorer 11 so šírkou 33 palcov je na učenie ideálny.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Ako si vyberiem objem SUP dosky podľa svojej hmotnosti?'
  answer: 'Cieľový objem vhodný pre začiatočníka získate vynásobením svojej hmotnosti v kg číslom 2.2. Napríklad jazdec s hmotnosťou 75 kg potrebuje aspoň 165 litrov, no na učenie je oveľa stabilnejší objem 220–260 litrov. SUP Explorer 11 ponúka 260 litrov a hodí sa pre jazdcov do 100 kg.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'Ako sa afarer porovnáva s inými značkami?'
  answer: 'afarer ponúka najlepší pomer ceny a výkonu v nafukovacej výbave pre vodné športy. V porovnaní s Red Paddle Co prináša afarer 90% výkonu za 60% ceny. V porovnaní s iRocker používa afarer kvalitnejšiu trojvrstvovú vojenskú PVC a vyššie hodnoty PSI. V porovnaní s Bluefin ponúka afarer lepšie materiálové parametre. Pre väčšinu rekreačných pádlarov poskytuje afarer najlepšiu rovnováhu medzi kvalitou a cenou.'
  category: general

- id: fishing-sup-setup
  question: 'Môžem rybárčiť z SUP dosky?'
  answer: 'Áno. Rybárčenie z SUP dosky je čoraz populárnejšie, pretože stojaca pozícia ponúka vynikajúci výhľad do vody. Pre stabilitu zvoľte dosku dlhú aspoň 11 stôp a širokú 33–34 palcov. Pridajte mliečnu debničku s držiakmi prútov upevnenú na palubné gumičky, malú kotvu a vždy noste záchrannú vestu. afarer SUP Explorer 11 sa výborne hodí na príležitostné rybárčenie.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: 'Môžem cvičiť jogu na SUP doske?'
  answer: 'Určite. Jóga na SUP spája tradičné pozície s výzvou plávajúcej plošiny a zapája hlbšie stabilizačné svaly. Použite dosku širokú aspoň 33 palcov s mäkkým, protisklzovým palubným vankúšom. Cvičte na pokojnej, plytkej vode s kotvou. Začnite so základnými pozíciami, ako sú pes hlavou dole, bojovník II a strom. SUP Explorer 11 s celoplošným EVA palubným vankúšom je na to veľmi vhodný.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: 'Aké pravidlá aerolínií platia pre cestovanie s nafukovacou SUP doskou?'
  answer: 'Väčšina aerolínií prijíma SUP batohy ako odbavenú batožinu, ak jej hmotnosť nepresahuje 23–32 kg. Batoh afarer má približne rozmery 90x40x30 cm a zabalený váži asi 15 kg. Niektoré aerolínie môžu účtovať poplatky za nadrozmernú batožinu. Príďte skoro, zabaľte plutvy a pumpu osobitne do príručnej batožiny a označte batoh ako krehký. Pred letom si vždy overte pravidlá vašej aerolínie pre prepravu športového vybavenia.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'Akú bezpečnostnú výbavu potrebujem na pádlovanie v studenej vode?'
  answer: 'Voda pod 15°C vyžaduje tepelnú ochranu. Pri 8–14°C použite neoprén alebo suchý oblek s topánkami, rukavicami a kapucňou. Pri 14–20°C stačí 3/2mm neoprén. Vždy noste správne sadnúcu záchrannú vestu pre tepelnú ochranu a bezpečnosť. Overte si miestne predpisy o povinnej výbave.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'Aké sú minimálne objednávkové množstvá pre OEM/ODM?'
  answer: 'Minimálne objednávkové množstvá (MOQ) sa líšia podľa typu produktu a jeho zložitosti. Vlastné značenie existujúcich modelov zvyčajne vyžaduje 5–10 kusov. Úplne vlastné dizajny trupov vyžadujú vyššie MOQ. Kontaktujte náš predajný tím s vašimi požiadavkami pre podrobnú cenovú ponuku. Zabezpečujeme všetko od vlastných farieb a log až po úplne pôvodné dizajny foriem.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'Môžem umiestniť vlastné logo na produkty afarer?'
  answer: 'Áno. Naša služba OEM zahŕňa vlastné umiestnenie loga, vlastné farebné schémy a vlastné balenie. Ponúkame tampónovú tlač, termotransfer a vyšívanie v závislosti od typu produktu. Pošlite námety a špecifikácie nášmu predajnému tímu pre cenovú ponuku a odhad dodacej lehoty.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'Na aký PSI mám nafúkať svoju SUP dosku?'
  answer: 'Pre najlepší výkon ju nafúkajte na nominálny maximálny PSI dosky — zvyčajne 15–18 PSI pri kvalitných nafukovacích SUP doskách. afarer SUP Explorer 11 dosahuje najlepší výkon pri 15–18 PSI. Nedostatočné nafúknutie spôsobuje, že doska pôsobí mäkko a zle drží smer. Prekročenie nominálneho maxima riskuje poškodenie nití drop-stitch. Konkrétnu hodnotu vašej dosky nájdete na nálepke pri ventile.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide
- id: sup-deck-pad-care
  question: 'Ako čistím a udržiavam EVA palubný vankúš?'
  answer: 'Po každom výjazde opláchnite palubný vankúš sladkou vodou. Na špinu alebo škvrny použite jemné mydlo a mäkkú kefu — vyhnite sa agresívnym chemikáliám. Ak sa okraje začnú odlepovať, naneste malé množstvo vodotesného námorného lepidla a 24 hodín ich pritlačte závažím. Nepoužívanú dosku uchovávajte mimo priameho UV žiarenia, aby ste predišli degradácii vankúša.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'Môžem pádlovať na SUP doske v sede?'
  answer: 'Áno. Mnohé SUP dosky vrátane afarer Explorer 11 majú D-krúžky, ktoré umožňujú pripojenie sedadla. Pádlovanie v sede je pohodlnou možnosťou pri dlhších výletoch, pri rybárčení alebo keď si chcete na vode zmeniť pozíciu.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: 'Musím opláchnuť svoju nafukovaciu dosku po použití v oceáne?'
  answer: 'Áno — po použití v slanej vode vždy opláchnite dosku, plutvy, pumpu a pádlo sladkou vodou. Kryštály soli sa zanášajú do švov a ventilov, kde spôsobujú mikroúniky a koróziu. Dosku pred vypustením vzduchu a uložením vysušte v tieni. Pravidelné oplachovanie výrazne predlžuje životnosť nafukovacej dosky.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'Potrebujem na SUP naozaj leash?'
  answer: 'Áno — vždy noste leash. Šnúrový SUP leash sa pripája na členok alebo lýtko a pri páde udrží dosku pri vás. Na otvorenej vode vám môže leash zachrániť život tým, že zabráni odlúčeniu od vášho plávacieho prostriedku. Pri pádlovaní na rieke používajte leash s rýchloupínačom, aby ste predišli uviaznutiu.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: 'Čo je technológia jadra drop-stitch a prečo je dôležitá?'
  answer: 'Technológia jadra drop-stitch využíva tisíce polyesterových nití, ktoré spájajú vrchnú a spodnú vrstvu PVC dosky. Po nafúkaní na 15-20 PSI tieto nite vytvárajú tuhú štruktúru odolnú voči krúteniu, ktorá sa správa ako doska s pevným telom. afarer používa vojenskú trojvrstvovú PVC s drop-stitch lamináciou vo všetkých produktových triedach SUP, čím dosahuje tuhosť porovnateľnú s epoxidovými doskami a zároveň si zachováva prenositeľnosť nafukovacej dosky.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup
- id: sup-inflatable-vs-rigid
  question: 'Nafukovacia alebo pevná SUP doska: ktorá je lepšia pre rôzne spôsoby použitia?'
  answer: 'Nafukovacie SUP dosky vynikajú v prenositeľnosti, skladovaní a absorpcii nárazov — sú ideálne na cestovanie, pre začiatočníkov a rekreačné použitie. Pevné epoxidové dosky ponúkajú maximálnu rýchlosť a kĺzavosť pre preteky a surfovanie. Pre 90% pádlarov poskytuje kvalitná nafukovacia doska s jadrom drop-stitch (15-20 PSI) dostatočnú tuhosť na turistiku, kondičné tréningy, jogu a rybárčenie. Nafukovacie dosky afarer sa výkonom vyrovnajú pevným doskám strednej triedy, pričom sa zmestia do batohu.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-vs-hard-board
    - how-to-choose-inflatable-sup
- id: sup-skill-progression
  question: 'Aký je typický postup zručností v SUP od začiatočníka po pokročilého?'
  answer: 'Začiatočník (1-3. výjazd): postavenie sa, základný zdvih vpred, otáčanie, bezpečné pády. Stredne pokročilý (5-15. výjazdov): efektívna technika zdvihu, pivotové otáčanie, pohyb vo vlnení, základné záchranné zručnosti. Pokročilý (20+ výjazdov): pretekárske štarty, otáčanie okolo bójí, surfovanie na malých vlnách, pádlovanie po vetre. Profesionál: pretekárske preteky, surf SUP, dlhé turistické trate. Dosky afarer podporujú každú fázu: Explorer 11 pre začiatočníkov, Ocean Voyager pre turistiku a Cheetah Surge pre výkonnostné pádlovanie.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-cheetah-surge
  relatedGuides:
    - beginner-sup-guide
    - sup-fitness-workout
    - sup-paddle-guide
- id: sup-weight-capacity
  question: 'Koľko hmotnosti unesie nafukovacia SUP doska?'
  answer: 'Nosnosť sa líši podľa objemu dosky. Dosky afarer: SUP Explorer 11 (260L, do 100 kg / 220 lbs), Ocean Voyager 12 (310L, do 140 kg / 308 lbs), Leviathan Wake (350L, do 180 kg / 396 lbs). Pre optimálny výkon udržujte celkové zaťaženie (jazdec + výbava) do 80% maximálnej kapacity. Nepreťažená doska pláva vyššie a lepšie drží smer, najmä pri rozbúrenej vode.'
  category: product
  relatedProducts:

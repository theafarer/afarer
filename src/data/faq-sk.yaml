- id: sup-sustainability
  question: 'Sú nafukovacie SUP dosky environmentálne udržateľné?'
  answer: 'Nafukovacie SUP dosky majú v niekoľkých ohľadoch menšiu environmentálnu stopu ako pevné dosky: vo výrobe spotrebujú menej surovín, ich nižšia hmotnosť znižuje emisie pri preprave a ich životnosť znamená v priebehu času menej náhrad. PVC používané v doskách afarer je bezolovnaté a v súlade s REACH. Kľúčové postupy udržateľnosti: kúpte si kvalitnú dosku, ktorá vydrží 5-10 rokov, prepichnutia radšej opravujte, ako vymieňajte, dosku na konci životnosti recyklujte prostredníctvom špecializovaných programov recyklácie PVC a vyhnite sa jednorazovému baleniu výberom značiek, ktoré používajú opakovane použiteľné prenosné vrecká.'
  category: general

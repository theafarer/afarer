- id: b2b-payment
  question: 'Aké platobné podmienky sú dostupné pre OEM objednávky?'
  answer: 'Štandardné platobné podmienky: 30% záloha s podpísaným PI (proforma faktúrou), 70% zostatok pred odoslaním proti kópii B/L (nákladného listu). Pre prvých partnerov: 50% záloha, 50% pred odoslaním. Pre etablovaných partnerov s históriou objednávok: L/C at sight alebo 30 dní netto pre kvalifikované účty (podlieha kreditnej kontrole). Platobné metódy: bankový prevod T/T, L/C (akreditív), Western Union. Všetky platby v USD alebo EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Ako afarer chráni moje duševné vlastníctvo a dizajny?'
  answer: 'Ochrana duševného vlastníctva je jadrom našej služby OEM. NDA podpisujeme pred akoukoľvek diskusiou o dizajne. Súbory dizajnov sa spracovávajú na izolovaných pracovných staniciach so zaznamenávaním prístupov. Všetky nástroje a formy zostávajú vaším výhradným majetkom (hradíte ich vy). Vaše formy ani dizajny nebudeme využívať pre iných klientov. Skladovanie a údržba foriem sú pre aktívne účty zahrnuté. Po ukončení zmluvy sa formy buď odošlú vám, alebo sa zničia s video dokumentáciou. Rešpektujeme všetky práva ochranných známok a patentov.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Aké možnosti prepravy a logistiky sú dostupné?'
  answer: 'FOB Qingdao (štandard): náklad sa nakladá v prístave Qingdao; prepravu odtiaľ si zabezpečujete vy. CIF (vymenovaný prístav): prepravu do vášho cieľového prístavu zabezpečujeme a poistíme my. DDP / door-to-door: komplexná logistika vrátane colného odbavenia a finálneho doručenia. Námorná preprava na západné pobrežie USA: približne 25–30 dní. Námorná preprava do EÚ (Hamburg/Rotterdam): približne 30–35 dní. Letecká preprava je dostupná pre naléhavé objednávky (3–5 dní). Zabezpečujeme všetku vývoznú colnú dokumentáciu, osvedčenia o pôvode a balné listy.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Aké procesy kontroly kvality sa vzťahujú na OEM objednávky?'
  answer: 'Každá OEM objednávka sa riadi dokumentovaným plánom QC: 1) Kontrola vstupného materiálu — testovanie šarží PVC tkaniny na hrúbku, ťažnosť a UV odolnosť. 2) Medzioperačná kontrola QC — test pevnosti zváraných švov každých 50 kusov, test udržania tlaku pri 1.25x nominálneho PSI. 3) Finálna kontrola — 100% vizuálna kontrola a tlakové skúšanie každej dosky. 4) Vzorkovanie AQL — vzorkovanie šarží podľa ISO 2859 s akceptáciou kritických defektov = 0. 5) Inšpekcia treťou stranou — SGS, Bureau Veritas alebo Intertek na náklady kupujúceho.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Môžete vytvoriť vlastné balenie pre moju značku?'
  answer: 'Áno. Ponúkame komplexné služby vlastného balenia: predajné škatule s plnofarebnou CMYK tlačou a grafikou značky, prenosné vrecká so sitotlačovými alebo vyšívanými logami, návody na použitie vo vašom jazyku, závesné štítky a štítky s čiarovým kódom/UPC a vnútorné balenie (polyetylénové vrecká, penové vložky). Minimálne MOQ balenia: 500–1000 kusov pre vlastné škatule, 200–500 pre prenosné vrecká. Služba dizajnu balenia je pri OEM objednávkach zahrnutá.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Môžem navštíviť fabriku alebo zabezpečiť audit treťou stranou?'
  answer: 'Návštevy fabriky sú vítané po dohode. Počas celého roka hostíme majiteľov značiek a vieme zabezpečiť odvoz z Medzinárodného letiska Qingdao Jiaodong (TAO). Pre kupujúcich, ktorí nemôžu prísť osobne, ponúkame: virtuálnu prehliadku fabriky prostredníctvom videohovoru, koordináciu auditu treťou stranou so SGS/Bureau Veritas (náklady na audit hradí kupujúci) a podrobný balík dokumentácie o schopnostiach fabriky vrátane zoznamu zariadení, priebehu procesu QC a kvalifikácie personálu.'
  category: b2b

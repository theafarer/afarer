  relatedGuides: []
- id: sup-inflatable-durability
  question: 'Ako dlho vydržia nafukovacie SUP dosky pri správnej starostlivosti?'
  answer: 'Pri správnej starostlivosti vydrží kvalitná nafukovacia SUP doska 5-10 rokov pravidelného rekreačného používania. Vojenská trojvrstvová PVC s UV-odolným povlakom — aká sa používa vo všetkých doskách afarer — odoláva poškodeniu slnkom, korózii od slanej vody a oderu. Kľúčové faktory životnosti: po každom použití opláchnite sladkou vodou, pred uložením dôkladne vysušte, nepoužívanú dosku uchovávajte mimo priameho UV žiarenia, skladujte ju čiastočne nafúkanú na chladnom a suchom mieste a vyhýbajte sa vlečeniu po drsných povrchoch. Nite drop-stitch a švy sú zvyčajne prvým miestom poruchy, nie samotná PVC tkanina.'
  category: maintenance

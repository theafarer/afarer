- id: b2b-moq
  question: 'Aké je minimálne objednávkové množstvo pre výrobu SUP v režime OEM/ODM?'
  answer: 'Minimálne objednávkové množstvá (MOQ) sa líšia podľa typu produktu. Vlastné značenie skladových modelov: 50 kusov na SKU. Vývoj foriem pre vlastný tvar: 200–500 kusov na model (prvá objednávka). Programy zdieľania foriem sú dostupné od 50 kusov. Príslušenstvo a záchranné vesty: 500–1000 kusov na dizajn. Kontaktujte náš tím OEM s vaším plánovaným objemom pre presné MOQ a ceny.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Aké sú typické dodacie lehoty pre OEM objednávky SUP?'
  answer: 'Prvé OEM objednávky s vlastným značením na existujúcich formách: 6–8 týždňov od zálohy po FOB Qingdao. Objednávky s vlastným tvarom vyžadujúce nové formy: 12–20 týždňov (vrátane 3D dizajnu, výroby foriem, prototypovania a sériovej výroby). Opakované objednávky so schválenými špecifikáciami: 6–8 týždňov. Naléhavé objednávky je možné pri existujúcich formách urýchliť na 4–5 týždňov. Dodacie lehoty zahŕňajú obstarávanie surovín, výrobu, inline QC a nakládku kontajnerov.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Aké certifikácie majú produkty afarer OEM?'
  answer: 'Všetky produkty afarer OEM/ODM nesú: CE deklaráciu zhody (trh EÚ), UKCA (trh UK), systém manažérstva kvality ISO 9001:2015, audit sociálnej súladu BSCI, súlad materiálov REACH a RoHS a klasifikáciu EN ISO 25649 pre nafukovacie SUP dosky. Ďalšie certifikácie na žiadosť: dokumentácia súladu s US Coast Guard, skúšky podľa vojenského štandardu (MIL-STD-810) a podpora pri certifikácii dovozu do cieľovej krajiny.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Môžem objednať vzorky pred záväzkom k sériovej výrobe?'
  answer: 'Áno. Vzorkové objednávky sú dostupné pre všetky projekty OEM/ODM. Predvýrobné vzorky (PPS) sa vyrábajú po vyhotovení foriem a pred sériovou výrobou. Dodacia lehota vzorky: 15–25 pracovných dní pri existujúcich formách, 25–40 pracovných dní pri vlastných formách. Náklady na vzorky sa odpočítavajú z prvej sériovej objednávky. Vzorky sa odosielajú kuriérskou expresnou prepravou (DHL, FedEx, UPS) s kompletným sledovaním a zvyčajne dorazia za 3–5 pracovných dní.'

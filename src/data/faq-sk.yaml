    - paddle-board-size-guide
- id: sup-oem-process
  question: 'Ako prebieha výrobný proces OEM pre nafukovacie SUP dosky s privátnou značkou?'
  answer: 'Proces OEM: 1) Špecifikácia a dizajnový brief — zdieľajte cieľové špecifikácie, CAD výkresy alebo referenčný produkt. 2) 3D prototypovanie foriem — vlastné hliníkové a kompozitné formy navrhované interne. 3) Výber materiálu a vzorka — vojenská PVC s vlastnými farbami a umiestnením loga. 4) CE audit továrne a súlad — každá objednávka obsahuje CE deklaráciu, sledovateľnosť ISO 9001 a BSCI report. 5) Sériová výroba so 100-bodovým QC kontrolným zoznamom. 6) Odoslanie FOB Qingdao s kompletnou vývoznou dokumentáciou. Dodacia lehota 30-45 dní, MOQ 50 kusov (štandardný SUP).'
  category: ordering

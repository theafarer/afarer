- id: sup-choppy-water
  question: 'Ako pádlujem na SUP doske v rozbúrenej vode alebo vo vetre?'
  answer: 'Pri vlnení: pokrčte kolená, použite širší postoj, skráťte zdvih pádla a pre rovnováhu zapojte svaly stredu tela. Pri protivetre: použite nižší uhol pádla, robte kratšie zdvihy a predkloňte sa. Pri bočnom vetre: pádlujte po naveternej strane, aby ste korigovali drift. Pri vetre v chrbte: surfrujte na vlnách a získavajte rýchlosť. Začiatočníci by sa mali vyhnúť vetru nad 10 mph a pre stabilitu si zvoliť širšie a dlhšie dosky. Turistická SUP doska afarer Ocean Voyager je navrhnutá tak, aby zvládla mierne vlnenie a veterné podmienky.'

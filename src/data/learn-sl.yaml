  productsDesc: Raziščite celoten katalog izdelkov afarer
  trustDesc: Skladnost s CE, ISO in BSCI
sup:
  title: SUP znanje — vodiči in viri za napihljive SUP | Afarer
  description: Celovito središče SUP znanja, ki zajema vodiče za začetnike, dimenzioniranje desk, vadnice tehnike, varnostne nasvete in tehnologijo napihljivih SUP desk.
  articles:
    - title: Osnove SUP — vodič za začetnike
      desc: Vse, kar mora vedeti vsak začetnik — vrste desk, dolžina vesla, drža in nasveti za prvi dan.
      href: /learn/sup
    - title: Vodič po velikostih SUP
      desc: Poiščite pravo dolžino, širino in prostornino deske glede na svojo težo, znanje in slog veslanja.
      href: /size-guide
    - title: Napihljiva ali trda deska
      desc: Katera je prava za vas? Primerjava prenosljivosti, zmogljivosti, trajnosti in cene.
      href: /compare/inflatable-vs-hardboard
    - title: Tehnike za srednjo raven
      desc: Izpopolnite svoje veslanje z naprednimi zamahi vesla, tehnikami obračanja in obvladovanjem razburkane vode.
      href: /learn/intermediate-techniques
    - title: Kako izbrati napihljivo SUP desko
      desc: Orientirajte se med ključnimi dejavniki — konstrukcija, debelina, postavitev plavuti in priloženi dodatki.
      href: /v2/how-to-choose-inflatable-sup
    - title: Varnost na vodi
      desc: Bistveno varnostno znanje, vključno z branjem vremena, izbiro PFD, samoreševanjem in skupinskim veslanjem.
      href: /learn/water-safety
water-safety:
  title: Znanje o varnosti na vodi — vodiči za varno veslanje | Afarer
  description: Celoviti viri o varnosti na vodi za SUP, kajakaštvo in čolnarjenje. Izvedite več o izbiri PFD, branju vremena, samoreševanju, varnosti v hladni vodi in certifikaciji CE.
  articles:
    - title: Vodič po varnosti na vodi
      desc: Bistveno varnostno znanje za vsakega veslača — vreme, PFD, samoreševanje in protokoli skupinskega veslanja.
      href: /learn/water-safety
    - title: Vodič po rešilnih jopičih in PFD
      desc: Kako izbrati pravo osebno rešilno sredstvo za SUP, kajakaštvo, čolnarjenje in poklicno uporabo.
      href: /v2/life-jacket-buying-guide
    - title: Varnostni kontrolni seznam za SUP
      desc: Varnostni kontrolni seznam pred splavitvijo, ki naj ga upošteva vsak SUP deskar, preden se odpravi na vodo.
      href: /v2/sup-safety-guide
    - title: Varnost veslanja v hladni vodi
      desc: Bistveni previdnostni ukrepi, oprema in tehnike za veslanje v hladnih razmerah.
      href: /v2/cold-water-safety-guide
    - title: Napake začetnikov pri veslanju
      desc: Pogoste napake veslačev na prvih izletih in kako se jim izogniti za varnejšo in prijetnejšo izkušnjo.
      href: /v2/beginner-sup-guide
    - title: Razlaga certifikacije CE
      desc: Kaj certifikacija CE pomeni za napihljive SUP deske — standardi, preskušanje in zakaj je pomembna za varnost.
      href: /trust
sup-basics:
  title: Osnove SUP — vodič za začetnike veslanja stoje na deski
  description: Vse, kar morate vedeti, da začnete s SUP — veslanjem stoje na deski. Vodiči po opremi, nasveti glede velikosti, varnostni nasveti in tehnike za začetnike iz centra znanja afarer.
  articles: []
drop-stitch-core:
  title: Tehnologija drop-stitch jedra — kako napihljive SUP deske dosežejo togost
  description: 'Poglobljeni pogled na tehnologijo drop-stitch konstrukcije: kako tisoče poliestrskih niti ustvari toge napihljive ploščadi pri 15-25 PSI. Gostota niti, vgradnja tkanine, proizvodni proces in primerjave zmogljivosti.'
  articles: []
inflatable-technology:
  title: Tehnologija napihljivih SUP — materiali, konstrukcija in inženirstvo
  description: Kako so zgrajene napihljive SUP deske — zlaganje materialov, drop-stitch jedra, ventilski sistemi, RF varjenje in preizkušanje kakovosti. Razumite, kaj naredi napihljiv izdelek trajen in visoko zmogljiv.
  articles: []
intermediate-techniques:
  title: Tehnike SUP in kajaka za srednjo raven — korak dlje od osnov
  description: Izboljšajte svoje veslaške spretnosti z naprednimi zamahi vesla, obvladovanjem razburkane vode, upravljanjem vetra, tehnikami samoreševanja in bontonom skupinskega veslanja. Za veslače, ki so pripravljeni preseči začetniško raven.
  articles: []
materials:
  title: Materiali napihljivih SUP — PVC, EVA in drop-stitch tkanina
  description: 'Celovit vodič po materialih za proizvodnjo napihljivih SUP desk: vojaški razred PVC, EVA pena za palube, drop-stitch tkanina, ogljikova vlakna in aluminijeve zlitine. Specifikacije, aplikacije in kriteriji izbire.'
  articles: []
safety-in-water-sports:
  title: Varnost pri vodnih športih — bistveno znanje za veslače
  description: Bistveno varnostno znanje za vsakega veslača — branje vremena, izbira PFD, samoreševanje in protokoli skupinskega veslanja.
  articles: []
sup-size-guide:
  title: Vodič po velikostih SUP — kako izbrati pravo dolžino, širino in prostornino deske
  description: Celovit vodič po dimenzijah SUP, ki pokriva dolžino, širino in debelino deske, prostornino (v litrih) ter usklajevanje s težo veslača. Poiščite pravo velikost napihljive SUP deske za svojo težo, raven znanja in vrsto veslanja.
  articles: []

- id: sup-sustainability
  question: 'Şişme SUP tahtaları çevre açısından sürdürülebilir mi?'
  answer: "Şişme SUP'ların çevre ayak izi sert tahtalardan çeşitli şekillerde daha küçüktür: üretimde daha az hammadde kullanırlar, daha hafif ağırlık taşıma emisyonlarını azaltır ve dayanıklılıkları zamanla daha az değiştirme anlamına gelir. afarer tahtalarındaki PVC kurşunsuzdur ve REACH uyumludur. Temel sürdürülebilirlik uygulamaları: 5-10 yıl dayanan kaliteli bir tahta alın, değiştirmek yerine delikleri tamir edin, tahtayı ömrünün sonunda özel PVC geri dönüşüm programları aracılığıyla geri dönüştürün ve yeniden kullanılabilir taşıma çantaları kullanan markaları seçerek tek kullanımlık ambalajdan kaçının."
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: 'OEM/ODM SUP üretimi için asgari sipariş miktarı nedir?'
  answer: 'Asgari sipariş miktarları (MOQ) ürün türüne göre değişir. Stok modellere özel logo: SKU başına 50 adet. Özel şekil için kalıp geliştirme: model başına 200–500 adet (ilk sipariş). Paylaşılan kalıp programları 50 adetten başlar. Hypalon bot üretimi: boyuta göre 20–50 adet. Aksesuarlar ve can yelekleri: tasarım başına 500–1000 adet. Kesin MOQ ve fiyatlar için tahmini hacminizle OEM ekibiyle iletişime geçin.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'OEM SUP siparişleri için tipik teslim süreleri nedir?'
  answer: "Mevcut kalıplara özel logolu ilk OEM siparişleri: peşinattan FOB Qingdao'ya 6–8 hafta. Yeni kalıplarla özel şekilli siparişler: 12–20 hafta (3D tasarım, kalıp üretimi, numune ve seri üretimi içerir). Onaylanmış özelliklerle tekrarlayan siparişler: 6–8 hafta. Acil siparişler mevcut kalıplar için 4–5 haftaya hızlandırılabilir. Süreler hammadde tedariki, üretim, üretim hattı QC ve konteyner yüklemesini içerir."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'afarer OEM ürünleri hangi sertifikaları taşır?'
  answer: 'Tüm afarer OEM/ODM ürünleri şunları taşır: CE uygunluk beyanı (AB pazarı), UKCA (Birleşik Krallık pazarı), ISO 9001:2015 kalite yönetim sistemi, BSCI sosyal uygunluk denetimi, REACH ve RoHS malzeme uygunluğu, şiirme botlar için EN ISO 25649 sınıflandırması. Talep üzerine ek sertifikalar: US Coast Guard uygunluk belgeleri, askeri standart testleri (MIL-STD-810) ve hedef ülke ithalat sertifikasyon desteği.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Seri üretime geçmeden önce numune sipariş edebilir miyim?'
  answer: 'Evet. Numune siparişleri tüm OEM/ODM projelerinde mevcuttur. Üretim öncesi numuneler (PPS), kalıp üretiminden sonra ve seri üretimden önce yapılır. Numune teslim süresi: mevcut kalıplar için 15–25 iş günü, özel kalıplar için 25–40 iş günü. Numune maliyeti ilk seri siparişten düşülür. Numuneler tam takipli hızlı kargoyla (DHL, FedEx, UPS) gönderilir ve genellikle 3–5 iş gününde ulaşır.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'OEM siparişleri için hangi ödeme koşulları mevcuttur?'
  answer: 'Tipik ödeme koşulları: imzalı PI (proforma fatura) ile %30 peşinat, sevkiyattan önce B/L (konşimento) kopyası karşılığında %70 bakiye. Yeni ortaklar için: %50 peşinat, %50 sevkiyattan önce. Sipariş geçmişi olan yerleşik ortaklar için: göründe ödemeli L/C veya uygun hesaplar için 30 günlük kredi (kredi kontrolünden sonra). Ödeme yöntemleri: T/T havale, L/C (akreditif), Western Union. Tüm ödemeler USD veya EUR cinsindendir.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'afarer fikri mülkiyetimi ve tasarımlarımı nasıl korur?'
  answer: 'IP koruması OEM hizmetimizin temel bir parçasıdır. Her tasarım görüşmesinden önce NDA imzalıyoruz. Tasarım dosyaları erişim kayıtlı izole iş istasyonlarında yönetilir. Tüm takım ve kalıplar yalnızca sizin mülkiyetinizde kalır (siz ödersiniz). Kalıplarınızı veya tasarımlarınızı diğer müşteriler için asla yeniden kullanmayacağız. Kalıp depolama ve bakım aktif hesaplara dahildir. Anlaşmanın sonunda kalıplar ya size gönderilir ya da video kaydıyla imha edilir. Tüm ticari marka ve patent haklarına saygı duyuyoruz.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Hangi sevkiyat ve lojistik seçenekleri mevcuttur?'
  answer: "FOB Qingdao (tipik): yük Qingdao limanında yüklenir; oradan sonrasını siz düzenlersiniz. CIF (adı geçen liman): sevkiyatı varış limanınıza kadar düzenler ve sigortalarız. DDP / kapıdan kapıya: gümrük temizliği ve nihai teslimat dahil tam lojistik hizmeti. ABD batı yakasına denizyolu: yaklaşık 25–30 gün. AB'ye denizyolu (Hamburg/Rotterdam): yaklaşık 30–35 gün. Acil siparişler için havayolu (3–5 gün). Tüm ihracat belgelerini, menşe sertifikalarını ve paketleme listelerini yönetiyoruz."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'OEM siparişlerine hangi kalite kontrol prosedürleri uygulanır?'
  answer: "Her OEM siparişi belgelenmiş bir QC planını izler: 1) Gelen malzeme denetimi — PVC kumaş partilerinin kalınlık, çekme dayanımı ve UV dayanımı testleri. 2) Süreç içi QC — her 50 adette bir dikiş çekme dayanımı testi, nominal PSI'nın 1,25 katına basınç tutma testi. 3) Son denetim — her tahtada %100 görsel denetim ve basınç testi. 4) AQL örneklemesi — kritik hata = 0 kabul ile ISO 2859'a göre parti örneklemesi. 5) Üçüncü taraf denetim — SGS, Bureau Veritas veya Intertek alıcı masrafıyla mevcuttur."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Markam için özel ambalaj oluşturabilir misiniz?'
  answer: 'Evet. Tam özel ambalaj hizmetleri sunuyoruz: tam renkli CMYK baskılı ve marka grafikli perakende kutuları, serigrafi veya nakış logolu taşıma çantaları, kendi dilinizde talimat kılavuzları, askı etiketleri ve barkod/UPC etiketleri ile iç ambalaj (polietilen torbalar, takviye köpük). Ambalaj asgari miktarları: özel kutular için 500–1000 adet, taşıma çantaları için 200–500 adet. Ambalaj tasarım hizmeti OEM siparişlerine dahildir.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Fabrikayı ziyaret edebilir veya üçüncü taraf denetim düzenleyebilir miyim?'
  answer: "Randevuyla fabrika ziyaretleri memnuniyetle karşılanır. Marka sahiplerine yıl boyu ev sahipliği yapıyoruz ve Qingdao Jiaodong Uluslararası Havalimanı'ndan (TAO) karşılama düzenleyebiliriz. Gelemeyen alıcılar için sunuyoruz: video aramasıyla sanal fabrika turu, SGS/Bureau Veritas ile üçüncü taraf denetim koordinasyonu (alıcı denetim masrafını karşılar) ve ekipman listesi, QC proses akışı ve personel niteliklerini içeren ayrıntılı fabrika kapasite belgeleri paketi."
  category: b2b

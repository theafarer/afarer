- id: sup-choppy-water
  question: 'Dalgalı veya rüzgarlı suda SUP ile nasıl kürek çekilir?'
  answer: "Dalgada: dizlerinizi bükün, daha geniş bir duruş kullanın, kürek vuruşlarını kısaltın ve denge için gövdenizi devreye sokun. Rüzgara karşı: daha düşük kürek açısı kullanın, daha kısa vuruşlar alın ve öne eğilin. Yandan esen rüzgarda: sapmayı düzeltmek için rüzgarın estiği taraftan kürek çekin. Arkadan esen rüzgarda: hız için dalgaları sörfleyin. Yeni başlayanlar 10 mph üzeri rüzgarlardan kaçınmalı ve stabilite için daha geniş, daha uzun tahtalar seçmelidir. afarer turizm SUP'ı Ocean Voyager, ılımlı dalga ve rüzgara dayanacak şekilde tasarlanmıştır."
  category: safety
  relatedProducts:
    - sup-ocean-voyager
    - sup-explorer-11

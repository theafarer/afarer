  question: 'Soğuk suda kürek çekmek için hangi güvenlik ekipmanları gerekir?'
  answer: '15°C altındaki su termal koruma gerektirir. 8–14°C için bot, eldiven ve kapüşonla ıslak kıyafet veya kuru kıyafet kullanın. 14–20°C için 3/2mm ıslak kıyafet yeterlidir. Termal koruma ve güvenlik için düzgün oturan bir can yeleğini her zaman giyin. Zorunlu ekipman için yerel düzenlemeleri kontrol edin.'

- slug: sup-maintenance
  category: maintenance
  title: Cum să curățați și să depozitați placa SUP umflabilă
  description: Ghid de întreținere pas cu pas pentru a maximiza durata de viață a plăcii SUP umflabile.
  tldr: Clătiți cu apă dulce după fiecare utilizare, uscați complet înainte de depozitare, dezumflați și rulați lejer (nu strâns), păstrați într-un loc răcoros și uscat, departe de lumina directă a soarelui, și inspectați cusăturile lunar.
  problem: Depozitarea și curățarea necorespunzătoare sunt principalele cauze ale defectării premature a plăcilor SUP umflabile — mucegai, deteriorare UV și desprinderea cusăturilor.
  solution: Urmați o rutină constantă după fiecare sesiune — clătiți, uscați, inspectați, dezumflați și depozitați. Folosiți săpun blând pentru murdăria încăpățânată. Nu depozitați niciodată placa udă sau în lumina directă a soarelui.
  audience: Toți proprietarii de plăci SUP umflabile care vor ca placa să dureze 5+ ani.
  steps:
    - Clătiți placa cu apă dulce imediat după utilizare, mai ales după apa sărată
    - Curățați cu săpun blând și un burete moale — evitați substanțele chimice agresive sau spălătoarele sub presiune
    - Uscăți placa complet — deschideți supapa pentru a lăsa apa captată să iasă
    - Inspectați deteriorările — verificați cusăturile, supapa și suprafața pentru perforații
    - Dezumflați complet — scoateți nucleul supapei pentru o dezumflare completă
    - Rulați placa lejer — începeți de la provă, evitați îndoiturile strânse
    - Păstrați în husa de transport într-un loc răcoros și uscat, departe de lumina directă a soarelui
  faq:
    - q: Pot lăsa SUP-ul umflat tot sezonul?
      a: Da, dar țineți-l departe de lumina directă a soarelui când nu îl folosiți. Dezumflarea parțială (8-10 PSI) este recomandată pentru depozitarea prelungită.
    - q: Cum reparați o perforație?
      a: Curățați zona, tăiați un petec cu colțuri rotunjite, aplicați adeziv, apăsați ferm și așteptați 24 de ore înainte de umflare. Plăcile afarer includ o trusă de reparații.
    - q: Cât de des trebuie verificată supapa?
      a: Lunar. Supapa este cel mai frecvent punct de defectare. Verificați că acul supapei se mișcă liber și că O-ring-ul este intact.

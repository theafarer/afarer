- slug: sup-storage-winter-care
  category: maintenance
  title: Depozitarea și îngrijirea de iarnă a SUP-ului — prelungiți viața plăcii
  description: Cum să depozitați, să curățați și să pregătiți pentru iarnă placa SUP umflabilă. Evitați mucegaiul, deteriorarea UV și degradarea materialului cu o îngrijire corectă.
  tldr: Curățați cu apă dulce după fiecare utilizare. Uscați complet înainte de depozitare. Dezumflați și păstrați într-un loc răcoros și întunecos, departe de lumina directă a soarelui și de temperaturile extreme. Nu depozitați niciodată umflat sau într-o mașină fierbinte. Aplicați periodic protecție UV.
  problem: Depozitarea necorespunzătoare este principala cauză a defectării premature a SUP-ului — mucegai, descompunerea materialului, delaminare și deteriorarea supapei din cauza căldurii sau a frigului.
  solution: Urmați o rutină de îngrijire în 3 pași — clătiți după fiecare sesiune, uscați bine înainte de depozitare și depozitați dezumflat într-un mediu cu temperatură controlată, între 50-80°F (10-27°C).
  audience: Toți proprietarii de SUP care vor ca placa să dureze 5+ ani.
  steps:
    - Clătiți placa, vâsla și pompa cu apă dulce după fiecare sesiune în apă sărată sau mâloasă
    - Curățați cu săpun blând și burete moale — niciodată substanțe chimice agresive sau spălătoare sub presiune
    - Uscăți placa complet afară înainte de dezumflare (deschideți supapa pentru a lăsa umiditatea interioară să iasă)
    - Dezumflați complet, rulați de la provă spre pupă pentru a expulza aerul rămas
    - Ștergeți rucsacul la uscat înainte de a depozita placa în interior
    - Păstrați într-un dulap răcoros și întunecat sau sub pat — niciodată la soare direct, într-o mașină fierbinte sau într-un șopron înghețat
  faq:
    - q: Pot lăsa SUP-ul umflat tot sezonul?
      a: Este mai bine să îl dezumflați când nu îl folosiți perioade lungi. Stresul constant al PSI accelerează oboseala materialului. Dezumflați între sesiuni dacă depozitați mai mult de 2 săptămâni.
    - q: Cum îndepărtați mucegaiul de pe SUP?
      a: Amestecați săpun blând cu apă caldă și un strop de oțet alb. Frecați ușor cu o perie moale. Clătiți bine și uscați la umbră. Evitați înălbitorul, care deteriorează PVC-ul.
    - q: Pot depozita SUP-ul într-un garaj?
      a: Doar dacă garajul rămâne între 50-80°F tot anul. Podurile și garajele necondiționate suferă extreme de temperatură care deteriorează nucleele drop-stitch.

- slug: sup-size-guide
  category: buying-guide
  title: Ghid de dimensiuni SUP — cum să alegeți dimensiunile corecte ale plăcii
  description: Ghid complet de dimensiuni SUP, cu recomandări de lungime, lățime și grosime în funcție de greutate, înălțime, nivel de experiență și stilul de vâslit.
  tldr: Începătorii au nevoie de plăci mai late (32-34 inci) pentru stabilitate. Vâslașii mai grei au nevoie de plăci mai lungi (peste 11 picioare) cu volum mai mare. Touring-ul necesită carene mai lungi (peste 12 picioare). Yoga are nevoie de lățime suplimentară (34+ inci). Verificați mereu capacitatea de greutate — greutatea dumneavoastră plus echipamentul nu trebuie să depășească 80% din limită.
  problem: Alegerea dimensiunii greșite de SUP duce la stabilitate slabă, menținere lentă a direcției și o experiență frustrantă de vâslit. Majoritatea cumpărătorilor la prima achiziție aleg o placă care arată bine, fără să ia în calcul cum afectează dimensiunile performanța.
  solution: Potriviți lungimea, lățimea și grosimea plăcii cu greutatea, nivelul de experiență și utilizarea principală. Folosiți calculatorul nostru de dimensiuni — adunați greutatea dumneavoastră plus cea a echipamentului și alegeți o placă cu cel puțin 20% marjă peste acel total.
  audience: Cumpărători de SUP la prima achiziție, vâslași care trec la o placă specializată și oricine este nesigur privind dimensiunile.
  steps:
    - Cântăriți-vă cu tot echipamentul pe care îl cărați (vâslă, vestă de salvare, sac etanș)
    - Adăugați o marjă de siguranță de 20% pentru a găsi capacitatea minimă de greutate
    - Alegeți lățimea în funcție de nivel — 32-34 inci pentru începători, 30-32 inci pentru nivel intermediar, 28-30 inci pentru avansați
    - Alegeți lungimea în funcție de utilizare — 10'6"-11'6" all-around, 12'-14' touring, 9'-10' pentru ape albe
    - Verificați grosimea — 6 inci standard, 4 inci pentru performanță, 5 inci pentru all-around
    - Verificați intervalul PSI recomandat al plăcii pentru rigiditate optimă
  faq:
    - q: Ce lățime SUP este cea mai bună pentru începători?
      a: O lățime de 32-34 inci oferă cea mai stabilă platformă. Cu cât placa este mai lată, cu atât echilibrul este mai ușor — mai ales pentru vâslașii mai corpolenți.
    - q: Cum știți dacă un SUP este prea mic pentru dumneavoastră?
      a: Dacă placa stă jos în apă, se manevrează greu sau prova se scufundă ușor când vâsliți, este probabil prea mică pentru greutatea dumneavoastră.
    - q: Afectează lungimea plăcii viteza?
      a: Da. O linie de plutire mai lungă crește viteza teoretică a carenei. O placă de touring de 14 picioare este semnificativ mai rapidă decât una all-around de 10 picioare, pentru același efort al vâslașului.

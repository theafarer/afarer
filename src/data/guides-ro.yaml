- slug: sup-weight-capacity
  category: buying-guide
  title: Ghidul capacității de greutate SUP — câtă greutate poate suporta un SUP
  description: Înțelegerea limitelor de capacitate de greutate SUP, calculul încărcăturii totale și motivul pentru care depășirea limitei afectează performanța și siguranța.
  tldr: Nu depășiți niciodată 80% din capacitatea maximă de greutate a plăcii cu greutatea corpului plus echipamentul. O placă cu capacitate de 220 lbs este potrivită pentru un vâslaș de 160 lbs cu echipament ușor. Depășirea limitei provoacă o balansare verticală a plăcii, manevrare greoaie și un risc crescut de deteriorare.
  problem: Vâslașii depășesc adesea capacitatea de greutate a plăcii, ceea ce duce la performanțe slabe, scufundare parțială și posibile deteriorări. Producătorii listează limitele maxime, dar nu explică încărcăturile de lucru sigure.
  solution: Calculați încărcătura totală (greutatea corpului plus echipamentul plus apa absorbită de placă) și rămâneți sub 80% din capacitatea maximă declarată. Vâslașii mai grei au nevoie de plăci cu volum mai mare și capacitate de 300+ lbs.
  audience: Vâslași de toate dimensiunile, în special cei corpolenți și cei care cără echipament de expediție.
  steps:
    - Găsiți capacitatea maximă de greutate tipărită pe placă (de obicei lângă supapă)
    - Cântăriți-vă împreună cu tot echipamentul, inclusiv vâsla, vesta de salvare, sacii etanși, cutia frigorifică și accesoriile
    - Calculați procentul folosit — încărcătura totală împărțită la capacitatea maximă, înmulțită cu 100
    - Țintiți 70-80% pentru performanță și siguranță optime
    - Dacă depășiți 80%, alegeți o placă mai mare sau reduceți echipamentul
  faq:
    - q: Ce se întâmplă dacă depășiți limita de greutate?
      a: Placa plutește mai jos, creând mai multă rezistență. Stabilitatea scade, prova se poate scufunda, iar nucleul drop-stitch este expus unui risc mai mare de deteriorare în apa agitată.
    - q: Pot două persoane merge pe un singur SUP?
      a: Doar dacă greutatea totală rămâne sub 80% din capacitate. Majoritatea SUP-urilor standard sunt proiectate pentru un singur vâslaș. Mersul în tandem necesită o placă omologată special pentru două persoane.
    - q: Au plăcile SUP umflabile o capacitate mai mică decât cele rigide?
      a: Plăcile umflabile de calitate cu construcție drop-stitch au capacități de greutate comparabile sau mai mari decât plăcile rigide, datorită distribuției mai groase a volumului.

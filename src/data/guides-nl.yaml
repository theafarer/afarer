- slug: sup-for-large-paddlers
  category: buying-guide
  title: De beste SUP voor grote peddelaars — boards met hoog draagvermogen voor zware rijders
  description: Gids voor het kiezen van opblaasbare SUPs voor grotere peddelaars (200-400 pond) — advies over breedte, lengte, volume en draagvermogen voor lange en zware rijders.
  tldr: Grote peddelaars hebben bredere boards nodig (34-36"), langere lengtes (11'6"-12') en een hoger draagvermogen (300-400 pond). Kies voor PVC van militaire kwaliteit, versterkte drop-stitch en een dubbellagige constructie. Vermijd smalle boards onder 32", ongeacht de lengte.
  problem: Standaard-SUPs hebben een draagvermogen van 200-250 pond, wat veel peddelaars uitsluit. Varen op een te klein board is oncomfortabel, instabiel en mogelijk gevaarlijk.
  solution: Kies boards die geschikt zijn voor 300 pond of meer, met extra breedte voor stabiliteit. De series Tropical Breeze en Leviathan Wake van afarer bieden het volume en de versterking die grotere peddelaars nodig hebben.
  audience: Peddelaars boven 200 pond die een board nodig hebben dat hun gewicht veilig draagt.
  steps:
    - Bereken de totale lading — lichaamsgewicht plus uitrusting plus 20 % veiligheidsmarge
    - Kies een board met een breedte van 34" of meer voor voldoende stabiliteit
    - Selecteer een lengte van 11'6" of langer voor een goede waterverplaatsing
    - Controleer het draagvermogen — de totale lading mag niet boven 80 % van het maximum komen
    - Kies voor versterkte drop-stitch en constructie met PVC van militaire kwaliteit
    - Probeer het board eerst uit op rustig water om de stabiliteit te bevestigen
  faq:
    - q: Welke breedte SUP is het beste voor een peddelaar van 250 pond?
      a: Minimaal 34" breedte. De extra breedte geeft de primaire stabiliteit die grotere rijders nodig hebben om zich staand en peddelend veilig te voelen.
    - q: Kan iemand van 300 pond op een opblaasbare SUP peddelen?
      a: Ja, met een board dat geschikt is voor 350-400 pond. De Tropical Breeze Island Escape met een breedte van 34" of meer vervoert zwaardere ladingen. Controleer altijd de specifieke maximumbelasting.
    - q: Hebben grotere peddelaars speciale peddels nodig?
      a: Een langere peddel (1-2 inch langer dan standaard) helpt bij de hogere stand op een breder en dikker board. Overweeg een schaft van carbon voor minder armvermoeidheid.

- slug: sup-fishing
  category: lifestyle
  title: SUP-visgids — vissen vanaf een supboard
  description: Alles wat u moet weten over vissen vanaf een supboard — uitrusting, stabiliteitstips en technieken.
  tldr: Vissen vanaf een SUP biedt een stille nadering, toegang tot ondiep water en werpmogelijkheden over 360 graden. Gebruik een breed en stabiel board (34" of meer), bevestig hengelhouders en gebruik een koelbox of krat als uitrustingsdek. Anker bij wind. Draag altijd een zwemvest.
  problem: Gewone visboten zijn duur in onderhoud en komen niet in ondiep water. Vissen vanaf een SUP lost dat op met een draagbaar visplatform voor ondiep water, maar vraagt specifieke aanpassingen van de uitrusting.
  solution: Rust een stabiel SUP uit met hengelhouders, een uitrustingskrat en een ankersysteem. Gebruik de draagbaarheid van het board om afgelegen visplekken te bereiken waar boten niet komen.
  audience: Hengelaars die willen vissen op ondiep water, op afgelegen plekken of die de voorkeur geven aan een licht, draagbaar visplatform.
  steps:
    - Kies een breed board (34" of meer) met een hoog draagvermogen voor uw uitrusting
    - Monteer hengelhouders op het deck met rail- of riemsystemen
    - Gebruik een waterdicht krat of een koelbox, vastgesjord op het voordek, voor uw visgerei
    - Neem een klein anker of een verankeringspaal mee voor dagen met wind
    - Draag een zwemvest met zakken voor gereedschap en telefoon
    - Oefen eerst met werpen vanaf de knieën voordat u staand wilt vissen
  faq:
    - q: Kan ik staand vissen vanaf een SUP?
      a: Ja. Een board van 34" breed of meer biedt voldoende stabiliteit om staand te werpen. Oefen eerst op rustig water.
    - q: Welke vis kan ik vangen vanaf een SUP?
      a: SUPs zijn uitstekend geschikt voor baars in meren, zeeforel in ondiep kustwater, forel in rivieren en kustsoorten in baaien en estuaria.
    - q: Hoe land ik een vis vanaf een SUP?
      a: Ga op de knieën zitten voor stabiliteit. Gebruik een schepnet of lipgrijper. Houd de vis laag om niet te vallen. Laat de vis terug of bewaar hem in de koelbox.

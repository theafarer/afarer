- slug: sup-weight-capacity
  category: buying-guide
  title: Draagvermogen van een SUP — hoeveel gewicht kan een SUP aan?
  description: Begrijp de limieten van het draagvermogen van een SUP, bereken uw totale lading en ontdek waarom overschrijding van de limiet prestaties en veiligheid aantast.
  tldr: Overschrijd nooit 80 % van het maximale draagvermogen van het board met uw lichaamsgewicht plus uitrusting. Een board met een draagvermogen van 220 pond is geschikt voor een peddelaar van 160 pond met lichte uitrusting. Overschrijding veroorzaakt traag gedrag, trage reacties en meer risico op schade.
  problem: Peddelaars overschrijden vaak het draagvermogen van hun board, wat leidt tot slechte prestaties, een onderduikend board en mogelijke schade. Fabrikanten vermelden maximale limieten, maar leggen de veilige werkbelasting niet uit.
  solution: Bereken uw totale lading (lichaamsgewicht, uitrusting en door het board opgenomen water) en blijf onder 80 % van het vermelde maximum. Zwaardere peddelaars hebben boards met meer volume nodig, met een draagvermogen van 300 pond of meer.
  audience: Peddelaars van alle formaten, zeker zwaardere peddelaars en wie expeditie-uitrusting meeneemt.
  steps:
    - Zoek het maximale draagvermogen dat op uw board staat afgedrukt (meestal bij de klep)
    - Weeg uzelf en al uw uitrusting, inclusief peddel, zwemvest, droogtassen, koelbox en accessoires
    - Bereken — uw totale lading gedeeld door het maximum, keer 100, geeft het percentage van de capaciteit dat u gebruikt
    - Streef naar 70-80 % voor optimale prestaties en veiligheid
    - Boven 80 %? Kies dan een groter board of verminder uw uitrusting
  faq:
    - q: Wat gebeurt er als ik de gewichtslimiet overschrijd?
      a: Het board ligt lager in het water en maakt meer weerstand. De stabiliteit neemt af, de neus kan onderduiken en de drop-stitch-kern loopt meer risico op schade bij golfslag.
    - q: Kunnen twee personen op één SUP?
      a: Alleen als het totale gewicht onder 80 % van het draagvermogen blijft. De meeste standaard-SUPs zijn gemaakt voor één persoon. Samen varen vraagt een board dat expliciet voor twee personen is goedgekeurd.
    - q: Hebben opblaasbare SUPs een lager draagvermogen dan hardboards?
      a: Kwalitatief goede opblaasbare boards met drop-stitch-constructie hebben een vergelijkbaar of hoger draagvermogen dan hardboards, dankzij hun dikkere volumeverdeling.

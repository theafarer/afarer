- slug: sup-for-whitewater
  category: buying-guide
  title: Wildwater-SUP-gids — aankoopgids voor opblaasbare rivierboards
  description: Hoe u een wildwater-SUP kiest voor rivieren — kortere boards, versterkte constructie, veiligheidsuitrusting en peddeltechnieken voor stroomversnellingen van klasse I-III.
  tldr: Wildwater-SUPs hebben een kortere lengte nodig (8-10'), versterkte rails, hogere PSI (15 of meer) en meerdere luchtkamers voor veiligheid. Gebruik een rechte rivierleash (niet opgerold), draag een helm en zwemvest en peddel nooit alleen. Begin op klasse I voordat u zwaardere stroomversnellingen probeert.
  problem: Een standaard allround SUP op stromend water brengen is gevaarlijk — standaardboards missen de wendbaarheid, stootvastheid en veiligheidsvoorzieningen die rivieren vragen.
  solution: Kies een wildwater-SUP die specifiek voor dit doel is gebouwd — korte lengte voor behendigheid, versterkte constructie tegen rotsstoten en een ontwerp met meerdere kamers voor veiligheid.
  audience: Ervaren peddelaars die de overstap naar rivieren maken.
  steps:
    - Kies een board van 8-10' lang voor maximale wendbaarheid in stroomversnellingen
    - Kies voor versterkte railconstructie en PVC van militaire kwaliteit
    - Selecteer een board met 2 of meer luchtkamers voor redundantie bij een lek
    - Gebruik een rechte rivierleash bevestigd aan een riem met snelontkoppeling
    - Draag een helm, zwemvest en geschikt rivierschoeisel
    - Begin op stroomversnellingen van klasse I en bouw geleidelijk op met een ervaren partner
  faq:
    - q: Kan ik een gewone SUP voor wildwater gebruiken?
      a: Dat wordt afgeraden. Standaard-SUPs missen stootvastheid en kunnen op rotsen delamineren. Veiligheid met meerdere luchtkamers is cruciaal in rivieromgevingen.
    - q: Welke PSI voor een wildwater-SUP?
      a: 15 PSI of meer voor maximale stijfheid. Een hard board stuitert beter van rotsen dan een te zacht opgeblazen board dat zich om obstakels vouwt.
    - q: Heb ik speciale peddelvaardigheden nodig voor wildwater-SUP?
      a: Ja. Rivieren lezen, eddy-bochten, overzetten en steunslagen zijn essentiële vaardigheden. Volg een wildwater-SUP-cursus voordat u klasse II of hoger probeert.

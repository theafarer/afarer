- slug: sup-size-guide
  category: buying-guide
  title: SUP-maatgids — de juiste boardafmetingen kiezen
  description: Complete SUP-maatgids met advies over lengte, breedte en dikte op basis van uw gewicht, lengte, ervaringsniveau en peddelstijl.
  tldr: Beginners hebben bredere boards nodig (32-34") voor stabiliteit. Zwaardere peddelaars hebben langere boards nodig (11' of meer) met meer volume. Touring vraagt langere rompen (12' of meer). Yoga vraagt extra breedte (34" of meer). Controleer altijd het draagvermogen — uw gewicht plus uitrusting mag niet boven 80 % van de limiet komen.
  problem: De verkeerde SUP-maat leidt tot slechte stabiliteit, trage koers en een frustrerende peddelervaring. De meeste kopers kiezen een board dat er goed uitziet zonder over de afmetingen na te denken.
  solution: Stem boardlengte, breedte en dikte af op uw gewicht, niveau en hoofdgebruik. Gebruik onze maatcalculator — tel uw gewicht bij het gewicht van uw uitrusting op en kies een board met minstens 20 % marge boven dat totaal.
  audience: Kopers van een eerste SUP, peddelaars die overstappen op een gespecialiseerd board en iedereen die twijfelt over maten.
  steps:
    - Weeg uzelf met alle uitrusting die u meeneemt (peddel, zwemvest, droogtas)
    - Tel er 20 % veiligheidsmarge bij op voor het minimale draagvermogen
    - Kies de breedte op basis van niveau — 32-34" voor beginners, 30-32" voor gevorderden, 28-30" voor experts
    - Kies de lengte op basis van gebruik — 10'6"-11'6" allround, 12'-14' touring, 9'-10' wildwater
    - Controleer de dikte — 6" standaard, 4" voor prestaties, 5" voor allround gebruik
    - Raadpleeg de aanbevolen PSI-zone van uw board voor optimale stijfheid
  faq:
    - q: Welke breedte SUP is het beste voor beginners?
      a: 32 tot 34 inch breedte biedt het meest stabiele platform. Hoe breder het board, hoe makkelijker het balanceren — zeker voor zwaardere peddelaars.
    - q: Hoe weet ik of een SUP te klein voor mij is?
      a: Als het board laag in het water ligt, traag reageert of de neus bij het peddelen makkelijk onderduikt, is het waarschijnlijk te klein voor uw gewicht.
    - q: Beïnvloedt de boardlengte de snelheid?
      a: Ja. Een langere waterlijn verhoogt de theoretische rompsnelheid. Een touringboard van 14' is aanzienlijk sneller dan een allround board van 10' bij dezelfde inspanning van de peddelaar.

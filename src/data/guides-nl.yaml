- slug: paddling-techniques
  category: tutorial
  title: Essentiële suppeddeltechnieken
  description: Beheers de voorwaartse slag, de veegslag en de cross-bow draai om in elke omstandigheid efficiënt te peddelen.
  tldr: De voorwaartse slag gebruikt uw core, niet uw armen. De veegslag draait het board. De cross-bow draai is de efficiënteste wending. Houd de peddel verticaal en dompel het blad volledig onder voor maximale krachtoverbrenging.
  problem: De meeste peddelaars maken slagen met vooral de armen, wat energie verspilt en schoudervermoeidheid veroorzaakt. Slechte techniek maakt het board ook moeilijk te beheersen bij wind en golfslag.
  solution: Leer drie essentiële slagen — voorwaartse slag, veegslag en cross-bow draai — met de juiste lichaamsmechanica. Oefen elke slag op rustig water voordat u uitdagende omstandigheden opzoekt.
  audience: Peddelaars die langer, sneller en met minder vermoeidheid willen peddelen.
  steps:
    - Voorwaartse slag — reik naar voren, zet het blad volledig in het water, trek terug met romprotatie (niet met de armen) en haal het blad bij de enkel uit het water
    - Veegslag — reik bij de rail naar voren en veeg het blad in een wijde boog naar het achterschip, zodat het board van de peddelkant af draait
    - Cross-bow draai — plaats de peddel aan de overkant van het board zonder van hand te wisselen en trek naar het achterschip
    - Steun — gebruik een lage steun voor stabiliteit bij golfslag, door het blad plat op het wateroppervlak te leggen
    - Trekslag — reik opzij en trek het board zijwaarts naar de peddel toe
  faq:
    - q: Hoe peddel ik in een rechte lijn?
      a: Gebruik op beide kanten een gelijkmatige slaglengte. Wissel elke 5-10 slagen van kant. Kijk naar een vast punt aan de horizon als referentie.
    - q: Moet ik mijn knieën buigen?
      a: Ja. Houd uw knieën licht gebogen als schokdempers. Gestrekte knieën geven elke golfslag door aan uw core en verminderen de stabiliteit.
    - q: Hoe peddel ik tegen de wind in?
      a: Verlaag uw houding, gebruik kortere en snellere slagen en blijf dichter bij de oever, waar de wind vaak minder sterk is. Is de wind te sterk, ga dan niet het water op.

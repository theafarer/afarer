- slug: sup-maintenance
  category: maintenance
  title: Uw opblaasbare SUP reinigen en opbergen
  description: Stap-voor-stap onderhoudsgids om de levensduur van uw opblaasbare SUP-board te maximaliseren.
  tldr: Spoel na elk gebruik na met zoet water, laat het board volledig drogen vóór opberging, laat de lucht eruit en rol het losjes op (niet strak), berg het op een koele droge plek buiten direct zonlicht op en inspecteer maandelijks de naden.
  problem: Verkeerd opbergen en reinigen zijn de belangrijkste oorzaken van voortijdige defecten aan opblaasbare SUPs — schimmel, UV-schade en naadscheiding.
  solution: Volg een vast ritueel na elke sessie — spoelen, drogen, inspecteren, laten leeglopen en opbergen. Gebruik milde zeep voor hardnekkig vuil. Berg het board nooit nat of in direct zonlicht op.
  audience: Alle eigenaren van een opblaasbare SUP die willen dat hun board meer dan 5 jaar meegaat.
  steps:
    - Spoel het board direct na gebruik na met zoet water, zeker na zoutwater
    - Maak het schoon met milde zeep en een zachte spons — vermijd bijtende schoonmaakmiddelen en hogedrukreinigers
    - Laat het board volledig drogen — open de klep zodat achtergebleven water eruit kan
    - Inspecteer op schade — controleer naden, klep en oppervlak op lekken
    - Laat het board helemaal leeglopen — verwijder de klepkern voor volledige ontspanning
    - Rol het board losjes op — begin bij de neus en vermijd scherpe vouwen
    - Berg het op in de draagzak op een koele, droge plek buiten direct zonlicht
  faq:
    - q: Kan ik mijn SUP het hele seizoen opgepompt laten?
      a: Ja, maar houd het buiten direct zonlicht wanneer u het niet gebruikt. Voor langdurige opberging wordt gedeeltelijk laten leeglopen (8-10 PSI) aanbevolen.
    - q: Hoe repareer ik een lek?
      a: Maak de plek schoon, knip een patch met afgeronde hoeken, breng lijm aan, druk stevig aan en wacht 24 uur voordat u oppompt. De boards van afarer worden geleverd met een reparatieset.
    - q: Hoe vaak moet ik de klep controleren?
      a: Maandelijks. De klep is het meest voorkomende zwakke punt. Controleer of de kleppin vrij beweegt en of de O-ring intact is.

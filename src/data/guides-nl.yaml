- slug: inflatable-repair
  category: maintenance
  title: Uw opblaasbare SUP repareren
  description: Stap-voor-stap gids voor het repareren van lekken, klepproblemen en naadschade aan opblaasbare SUPs.
  tldr: Kleine lekken (onder 1/4") repareert u met de meegeleverde reparatieset. Maak de plek schoon, breng PVC-lijm aan, druk op de patch en wacht 24 uur. Kleplekken vereisen meestal een nieuwe O-ring. Grote scheuren of naadscheiding vragen professionele hulp.
  problem: Kleine lekken en klepproblemen komen vaak voor en zijn eenvoudig op te lossen. Zonder de juiste reparatietechniek betalen gebruikers te veel voor professionele hulp of maken ze de schade erger.
  solution: Bepaal het type schade — lek, klepprobleem of naadkwestie — en pas de juiste reparatiemethode toe. De meeste reparaties kosten 30 minuten plus uithardingstijd.
  audience: Eigenaren van opblaasbare SUPs die basisreparaties zelf willen doen.
  steps:
    - Zoek het lek — pomp volledig op, luister naar lucht, voel met uw hand of gebruik zeepsop
    - Markeer het lek met een stift of tape
    - Maak de omgeving van het lek schoon met isopropylalcohol — minstens 2 inch rond de schade
    - Schuur het oppervlak licht met fijn schuurpapier voor betere hechting van de lijm
    - Breng PVC-lijm aan op zowel de patch als het boardoppervlak
    - Wacht 5 minuten tot de lijm kleverig wordt
    - Druk de patch stevig vast en strijk luchtbellen weg met een rolletje of een pinpas
    - Laat 24 uur uitharden voordat u op volledige druk oppompt
  faq:
    - q: Kan ik een lek op het water repareren?
      a: Noodreparaties met een patch en tape brengen u terug naar de oever. Volledige reparaties vragen droge omstandigheden en 24 uur uitharding.
    - q: Hoe verhelp ik een lekkende klep?
      a: Verwijder de klepkern met het meegeleverde gereedschap, controleer de O-ring op schade, vervang hem indien nodig en draai de kern stevig terug.
    - q: Welke lijm gebruik ik voor PVC-reparaties?
      a: Gebruik lijm die specifiek voor PVC is bedoeld, zoals HH-66 of Clifton. Gewone secondenlijm hecht slecht op opblaasbaar PVC.

- slug: sup-inflation-psi-guide
  category: technical
  title: SUP-opblaasgids — de optimale PSI voor prestaties en veiligheid
  description: Complete gids over de opblaasdruk van een SUP — aanbevolen PSI-bereiken, hoe de druk de prestaties beïnvloedt en tips voor correct pompgebruik.
  tldr: Blaas de meeste opblaasbare SUPs op tot 12-15 PSI. Hogere druk geeft meer stijfheid maar langzamer opblazen. Lagere druk geeft een zachter gevoel maar meer buiging. Overschrijd nooit de maximale PSI die op uw board staat afgedrukt. Gebruik een pomp met een nauwkeurige manometer. Koude lucht verlaagt de druk, hete zon verhoogt die.
  problem: Te zacht opgeblazen boards voelen traag aan en buigen overmatig. Te hard opgeblazen boards lopen het risico op naadfalen. Veel peddelaars gokken de PSI in plaats van die nauwkeurig te meten.
  solution: Gebruik een pomp met ingebouwde manometer. Streef naar 15 PSI voor maximale stijfheid. Controleer de druk vóór elke sessie — temperatuurwisselingen beïnvloeden de PSI aanzienlijk.
  audience: Alle eigenaren van opblaasbare SUPs.
  steps:
    - Controleer het aanbevolen PSI-bereik dat bij de klep op uw board staat afgedrukt
    - Blaas met de dubbelwerkende pomp op tot het midden van het aanbevolen bereik
    - Schakel voor de laatste 3-4 PSI over op enkelwerkende modus voor preciezer controle
    - Controleer de druk met de manometer — analoge manometers zijn betrouwbaarder dan digitale
    - Stem af op de omstandigheden — hogere PSI voor touring en racen, lagere PSI voor wildwater en rotsige startplekken
    - Controleer de druk opnieuw nadat het board 10 minuten heeft gestaan — het temperatuurevenwicht verandert de PSI
  faq:
    - q: Kan ik mijn SUP te hard opblazen?
      a: Ja. De vermelde maximale PSI overschrijden (meestal 15-18 PSI) kan naden delamineren en de drop-stitch-kern beschadigen. Blijf altijd binnen het afgedrukte bereik.
    - q: Beïnvloedt temperatuur de PSI?
      a: Aanzienlijk. Een board dat bij 70°F is opgeblazen tot 15 PSI kan in directe zon bij 95°F tot 18 PSI stijgen. Koud water kan de druk tot 12 PSI laten dalen. Controleer de druk na veranderingen in de omstandigheden.
    - q: Welke PSI voor beginners?
      a: 12-13 PSI geeft beginners een iets zachter platform dat valpartijen beter opvangt. Verhoog naar 15 PSI naarmate uw vaardigheden groeien.

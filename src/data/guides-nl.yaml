- slug: sup-yoga
  category: lifestyle
  title: SUP-yoga — een complete gids voor suppen en yoga
  description: Combineer suppen met yoga voor beter evenwicht, meer kracht en mindfulness op het water.
  tldr: SUP-yoga voegt een instabiliteitselement toe dat de core-activatie sterk verhoogt vergeleken met yoga op land. Begin met eenvoudige houdingen op een breed, stabiel board in rustig water. Gebruik een antislip deckpad. Beoefen SUP-yoga nooit alleen.
  problem: Traditionele yogamatten geven een volledig stabiel oppervlak, waardoor de evenwichtsuitdaging wegvalt die SUP-yoga zo effectief maakt voor corekracht en concentratie.
  solution: Gebruik een extra breed SUP-board (34" of meer) met een antislip deckpad over de volledige lengte. Oefen op rustig, ondiep water. Begin met basishoudingen voordat u omkeerhoudingen probeert.
  audience: Yogabeoefenaars en peddelaars die evenwichtstraining willen combineren met mindfulness.
  steps:
    - Veranker het board op ondiep, rustig water — gebruik een zandanker of maak vast aan een steiger
    - Begin met zithoudingen — makkelijke zit, boothyouding, zittende twist
    - Ga door naar knielhoudingen — tafel, kat-koe, donderbolhouding
    - Ga naar staande houdingen — berg, krijger I, krijger II, de boom
    - Oefen evenwichtshoudingen — halve maan, adelaar, danser
    - Sluit af met savasana — ga plat op het board liggen en voel de beweging van het water
  faq:
    - q: Welk board is het beste voor SUP-yoga?
      a: Een breed board (34" of meer) met een volledig antislip deckpad biedt het meest stabiele platform. De SUP Tour 12 geeft een goede balans tussen stabiliteit en glijvermogen.
    - q: Is SUP-yoga gevaarlijk?
      a: Niet gevaarlijker dan yoga op land, mits u het veilig beoefent. Gebruik rustig, ondiep water. Draag een leash. Oefen samen met een partner. Vermijd diep water tijdens uw eerste sessies.
    - q: Heb ik speciale uitrusting nodig?
      a: Een breed en stabiel board, een volledig antislip deckpad, een leash en een zwemvest. Sommige beoefenaars gebruiken een waterdichte mat voor extra grip.

- slug: choosing-paddle
  category: buying-guide
  title: De juiste SUP-peddel kiezen
  description: Een gids over peddelmaterialen, bladvormen, schafttypes en afstelling voor SUP.
  tldr: Peddellengte — SUP-peddels moeten 6-8" langer zijn dan uw lichaamslengte. Bladvorm — dihedral-bladen lopen recht, vlakke bladen geven meer grip op het water. Schaftmateriaal — carbon is het lichtst, glasvezel geeft de beste waarde, aluminium is het voordeligst.
  problem: Een verkeerde peddelmaat of het verkeerde materiaal veroorzaakt onnodige vermoeidheid, slechte slagefficiëntie en gewrichtsbelasting.
  solution: Stem peddellengte, bladvorm, schaftmateriaal en flexibiliteit af op uw peddelstijl, lichaamsbouw en budget.
  audience: SUP-peddelaars die hun eerste of volgende peddel kiezen.
  steps:
    - Meet de peddelhoogte — 6-8" langer dan uw lichaamslengte voor algemeen gebruik
    - Kies het bladmateriaal — nylon voor een klein budget, glasvezel voor waarde, carbon voor prestaties
    - Kies de bladvorm — dihedral voor soepel rechtuit peddelen, vlak voor kracht, lepel voor wedstrijden
    - Kies het schafttype — recht voor algemeen gebruik, gebogen voor race-SUP
    - Controleer de flexibiliteit — een stijvere schacht brengt meer kracht over, een flexibele schacht ontziet de gewrichten
  faq:
    - q: Wat is het beste peddelmateriaal?
      a: Glasvezel biedt de beste balans tussen gewicht, duurzaamheid en prijs. Carbon is lichter maar duurder en breekbaarder. Nylon is zwaar maar vrijwel onverwoestbaar.
    - q: Hoe weet ik of mijn peddel de juiste lengte heeft?
      a: Zet de peddel verticaal naast u — het handvat moet uw pols raken wanneer u uw arm boven uw hoofd strekt.
    - q: Moet ik een peddel in één stuk of een verstelbare peddel nemen?
      a: Verstelbare peddels zijn handig voor gedeeld gebruik en reizen. Peddels in één stuk zijn lichter, stijver en efficiënter voor vast gebruik.

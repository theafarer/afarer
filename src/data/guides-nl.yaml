- slug: sup-fitness
  category: lifestyle
  title: SUP-fitness — training van het hele lichaam op het water
  description: Hoe suppen corekracht, evenwicht en conditie opbouwt.
  tldr: Suppen activeert core, benen, rug en schouders bij elke slag. Een sessie van een uur verbrandt 300-500 calorieën. Tegen de wind of stroom in peddelen verdubbelt de intensiteit. SUP-yoga voegt flexibiliteit en evenwichtsoefeningen toe.
  problem: Veel mensen zien suppen als een ontspannen bezigheid in plaats van een volwaardige training en missen zo de potentie voor een complete lichaamsconditie.
  solution: Geef SUP-sessies een specifiek fitnessdoel — duurpeddelen voor conditie, intervalsprints voor kracht, SUP-yoga voor flexibiliteit en afstandspeddelen voor spieruithoudingsvermogen.
  audience: Fitnessliefhebbers die zoeken naar een low-impact training van het hele lichaam.
  steps:
    - Warm op het land op — armkringen, rompdraaien en beenzwaaien, 5 minuten lang
    - Begin met 10 minuten rustig peddelen op matige intensiteit
    - Ga door naar intervaltraining — 2 minuten hard peddelen, 2 minuten rustig herstel
    - Voeg SUP-yogahoudingen toe — neerwaartse hond, krijger II en de boom op het board
    - Koel af met rustig peddelen en statische rekoefeningen op het board
  faq:
    - q: Is suppen beter voor uw conditie dan hardlopen?
      a: Suppen geeft vergelijkbare cardiovasculaire voordelen met minder belasting van de gewrichten. Het activeert bovendien het bovenlichaam en de core meer dan hardlopen.
    - q: Hoeveel calorieën verbrandt suppen?
      a: Ongeveer 300-500 calorieën per uur op matige intensiteit. Racen of peddelen tegen de wind verbrandt 600-800 calorieën per uur.
    - q: Kan ik spieren opbouwen met suppen?
      a: Ja. Peddelen bouwt schouders, rug en core op. Het balansen activeert benen en stabiliserende spieren. Het is een weerstandstraining voor het hele lichaam.

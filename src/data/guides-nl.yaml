- slug: sup-storage-winter-care
  category: maintenance
  title: SUP-opberging en winteronderhoud — verleng de levensduur van uw board
  description: Hoe u uw opblaasbare SUP-board correct opbergt, reinigt en winterklaar maakt. Voorkom schimmel, UV-schade en materiaalafbraak met de juiste zorg.
  tldr: Reinig na elk gebruik met zoet water. Laat volledig drogen vóór opberging. Laat de lucht eruit en berg het board op een koele, donkere plek op, buiten direct zonlicht en extreme temperaturen. Berg het nooit opgepompt of in een hete auto op. Breng periodiek UV-bescherming aan.
  problem: Verkeerd opbergen is de belangrijkste oorzaak van voortijdig SUP-falen — schimmel, materiaalafbraak, naadscheiding en klepschade door hitte of kou.
  solution: Volg een verzorgingsroutine in drie stappen — spoel na elke sessie na, droog grondig vóór opberging en berg het leeggelopen board op in een ruimte met gecontroleerde temperatuur tussen 50-80°F (10-27°C).
  audience: Alle SUP-eigenaren die willen dat hun board meer dan 5 jaar meegaat.
  steps:
    - Spoel board, peddel en pomp na elke sessie in zout of troebel water na met zoet water
    - Maak schoon met milde zeep en een zachte spons — nooit bijtende middelen of hogedrukreinigers
    - Laat het board buiten volledig drogen voordat u het laat leeglopen (open de klep zodat vocht van binnenuit kan ontsnappen)
    - Laat het board helemaal leeg en rol vanaf de neus naar het achterschip om de laatste lucht eruit te duwen
    - Droog de rugzak voordat u het board erin opbergt
    - Berg het op in een koele, donkere kast of onder het bed — nooit in de volle zon, in een hete auto of in een vrieskoude schuur
  faq:
    - q: Kan ik mijn SUP het hele seizoen opgepompt laten?
      a: Het is beter om het board leeg te laten lopen als u het langere tijd niet gebruikt. Constante druk versnelt de materiaalmoeheid. Laat het leeg tussen sessies als u het meer dan 2 weken opbergt.
    - q: Hoe verwijder ik schimmel van mijn SUP?
      a: Meng milde zeep met warm water en een scheutje witte azijn. Schroeb zachtjes met een zachte borstel. Spoel grondig na en laat in de schaduw drogen. Vermijd bleekmiddel, want dat beschadigt PVC.
    - q: Kan ik mijn SUP in de garage opbergen?
      a: Alleen als de garage het hele jaar tussen 50-80°F blijft. Zolders en onverwarmde garages kennen temperatuurextremen die de drop-stitch-kernen beschadigen.

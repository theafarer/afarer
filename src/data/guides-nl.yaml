- slug: sup-travel-transport
  category: planning
  title: SUP-reisgids — vliegen en op pad met een opblaasbare SUP
  description: Hoe u reist met een opblaasbare SUP per vliegtuig, auto of camper — bagagekosten, inpakken, opblazen op uw bestemming en overwegingen voor internationaal reizen.
  tldr: Laat uw SUP leeglopen, rol hem op en pak hem in de rugzak. De meeste luchtvaartmaatschappijen accepteren hem als ruimbagage (onder 50 pond en 50 lineaire inch). Pak altijd pomp en peddel in dezelfde tas. Kom vroeg zodat u extra tijd heeft als de balie de tasmaat in twijfel trekt. Overweeg voor lange reizen het board vooraf te verzenden.
  problem: Reizen met een SUP lijkt ingewikkeld — maatlimieten van luchtvaartmaatschappijen, zorgen bij de beveiliging en de vraag hoe u op een afgelegen bestemming moet opblazen zorgen voor onzekerheid.
  solution: De SUP-rugzakken van afarer zijn ontworpen om binnen de limieten voor ruimbagage te vallen. Pak strategisch in, neem een reparatieset mee en zoek vóór vertrek opblaaimogelijkheden op — jachthavens, kampeerterreinen met stroom.
  audience: Peddelaars die een SUP-reis per vliegtuig, auto of camper plannen.
  steps:
    - Laat het board volledig leeglopen en rol het op van neus naar staart
    - Pak het opgerolde board, de pomp, de peddel, de leash en de vin in de rugzak
    - Controleer de maat- en gewichtlimieten van de luchtvaartmaatschappij — de meeste staan 62 lineaire inch en 50 pond toe
    - Kom vroeg en reken erop dat de tas handmatig wordt gecontroleerd
    - Neem een reparatieset in uw handbagage mee voor het geval het board onderweg beschadigd raakt
    - Onderzoek opblaaimogelijkheden — elektrische aansluitingen op kampeerterreinen voor elektrische pompen, luchtstations bij jachthavens
  faq:
    - q: Accepteert de luchtvaartmaatschappij mijn SUP-rugzak als bagage?
      a: De meeste Amerikaanse en Europese luchtvaartmaatschappijen accepteren SUP-rugzakken als gewone ruimbagage onder 50 pond en 62 lineaire inch. Budgetmaatschappijen rekenen mogelijk toeslagen voor overmatige bagage.
    - q: Kan ik mijn SUP als handbagage meenemen?
      a: Nee. SUP-rugzakken overschrijden overal de afmetingen voor handbagage. Geef de rugzak altijd bij de incheckbalie af.
    - q: Hoe blaas ik mijn SUP op een afgelegen bestemming op?
      a: De meegeleverde handpomp werkt overal zonder stroom. Neem voor gemak een draagbare elektrische pomp mee en zoek kampeerterreinen met elektrische aansluitingen of jachthavens met luchtstations.

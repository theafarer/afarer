- slug: sup-with-kids
  category: lifestyle
  title: Suppen met kinderen — een complete gids voor het gezin
  description: Hoe u kinderen veilig laat suppen — leeftijdsadvies, uitrusting en activiteiten.
  tldr: Kinderen vanaf 6 jaar kunnen meerijden op een SUP met een volwassene. Kinderen vanaf 10 jaar kunnen onder toezicht op hun eigen board peddelen. Gebruik een breed en stabiel board, draag altijd zwemvesten, blijf in ondiep rustig water en houd de sessies kort (maximaal 30-45 minuten).
  problem: Ouders willen de watersport delen met hun kinderen, maar maken zich zorgen om veiligheid, passende uitrusting en het bezig houden van kinderen.
  solution: Gebruik het juiste boardformaat om samen te varen, zorg dat elk kind een goed passend zwemvest draagt, begin in ondiep warm water en maak het leuk met spelletjes en korte sessies.
  audience: Ouders die hun kinderen willen laten kennismaken met suppen.
  steps:
    - Leeftijd 4-6 — meerijden op het board van een volwassene, voorin zitten en de middengreep vasthouden
    - Leeftijd 6-10 — op de knieën of zittend op het eigen board, onder toezicht van een volwassene en met leash
    - Leeftijd 10+ — op het eigen board peddelen met een volwassene in de buurt
    - Draag altijd een zwemvest — kinderen dragen te allen tijde een goed passend zwemvest
    - Blijf in ondiep water (tot heuphoogte van de volwassene)
    - Houd de sessies kort — maximaal 30-45 minuten voor kinderen onder de 10
    - Maak het leuk — speel spelletjes, zoek naar vissen, oefen met staan
  faq:
    - q: Op welke leeftijd kan een kind alleen suppen?
      a: Rond 10-12 jaar onder toezicht, afhankelijk van het zwemniveau en het watergevoel van het kind. Altijd in rustige, ondiepe omstandigheden.
    - q: Welk board is het beste om met kinderen te suppen?
      a: Een breed board (34" of meer) met een hoog draagvermogen om samen te varen. De SUP Explorer 11 met een breedte van 33" en een draagvermogen van 220 pond werkt goed voor ouder plus kind.
    - q: Welke veiligheidsuitrusting hebben kinderen nodig?
      a: Een goed passend CE-gecertificeerd zwemvest, een leash (bij samen varen vastgemaakt aan het board van de volwassene), zonnebrandcrème en een pet.

- slug: understanding-specs
  category: technical
  title: Hoe leest u de specificaties van een SUP-board
  description: Een technische gids voor het begrijpen van SUP-specificaties — volume, afmetingen, constructie en wat ze betekenen voor de prestaties.
  tldr: Belangrijke specificaties — volume (liters) bepaalt drijfvermogen en draagvermogen, breedte bepaalt stabiliteit, lengte bepaalt koersvastheid en snelheid, dikte bepaalt stijfheid en de PSI-classificatie bepaalt de pompdruk voor optimale prestaties.
  problem: Specificatiebladen geven cijfers zonder context, waardoor kopers niet weten welke specificaties er echt toe doen voor hun gebruik.
  solution: Vertaal elke specificatie naar werkelijke prestaties — volume voor drijfvermogen, breedte voor stabiliteit, lengte voor glijvermogen, dikte voor stijfheid en constructie voor duurzaamheid.
  audience: Gevorderde peddelaars en technische kopers die op basis van cijfers willen beslissen.
  steps:
    - Controleer het volume (liters) — uw gewicht plus uitrusting mag niet boven 80 % van de volumeclassificatie van het board komen
    - Controleer de breedte — breder (32-34") is stabieler, smaller (28-30") is sneller
    - Controleer de lengte — langer (12-14") houdt beter koers, korter (10-11") is wendbaarder
    - Controleer de dikte — 6" is standaard, 8" biedt meer stijfheid en draagvermogen
    - Controleer de PSI-classificatie — pomp op tot de maximaal toegestane PSI voor optimale stijfheid
    - Controleer de constructiematerialen — drop-stitch-dichtheid, PVC-lagen, railversterking
  faq:
    - q: Wat betekent drop-stitch?
      a: Drop-stitch is een constructiemethode waarbij duizenden draden de boven- en onderlaag van het board verbinden. Dat maakt pompen op hoge druk (12-15 PSI) mogelijk voor extreme stijfheid.
    - q: Wat is de ideale gewicht-volume-verhouding?
      a: Een goede richtlijn is ongeveer 5-6 pond peddelaarsgewicht per liter boardvolume. Een peddelaar van 220 pond zoekt boards met meer dan 180 liter volume.
    - q: Maakt het gewicht van het board uit?
      a: Ja. Lichtere boards (onder 20 pond) zijn makkelijker te dragen en te vervoeren. Zwaardere boards (25 pond of meer) wijzen vaak op een duurzamere constructie met meerdere PVC-lagen.

- slug: multi-day-trip
  category: planning
  title: Een meerdaagse SUP-tocht plannen
  description: Hoe u een meerdaagse peddeltocht plant en uitvoert — routeplanning, uitrusting inpakken, kamperen en veiligheid.
  tldr: Plan 10-15 mijl per dag. Pak de uitrusting in waterdichte droogtassen, verdeel het gewicht gelijkmatig en oefen vóór de tocht met het beladen van uw board. Leg een vaarplan vast. Neem water, voedsel, onderdak, navigatie en communicatie mee.
  problem: Meerdaagse tochten mislukken door te veel bagage, slechte routeplanning of onderschatting van weer en stroom — met uitputting, materiaalfalen of veiligheidsincidenten tot gevolg.
  solution: Gebruik een systematische aanpak — routeselectie, uitrustingschecklist, voedselplanning, veiligheidsinstructie en een noodplan.
  audience: Ervaren peddelaars die hun eerste meerdaagse expeditie plannen.
  steps:
    - Kies een route met vaste kampeerplekken en mogelijkheden om af te haken
    - Plan 10-15 mijl per dag, rekening houdend met wind en stroom
    - Controleer getijtabellen en weersverwachtingen voor de hele periode van de tocht
    - Pak de uitrusting in waterdichte droogtassen — in totaal 20-30 pond aan uitrusting
    - Verdeel het gewicht gelijkmatig — de zwaarste spullen in het midden
    - Leg een gedetailleerd vaarplan vast bij iemand aan wal
    - Neem navigatie mee — papieren zeekaart, kompas en een GPS als reserve
    - Pak een noodonderdak, extra voedsel en een ehbo-set in
  faq:
    - q: Wat is de ideale dagafstand?
      a: 10-15 mijl per dag voor ervaren peddelaars. Beginners plannen 5-8 mijl. Houd altijd reservetijd over voor het weer.
    - q: Hoeveel water moet ik meenemen?
      a: 1 gallon per persoon per dag. Bij heet weer 1,5 gallon. Neem een waterfilter of zuiveringstabletten mee om bij te vullen.
    - q: Wat is het belangrijkste veiligheidsitem?
      a: Communicatie. Een VHF-radio of satellietzender kan levensreddend zijn bij een noodsituatie. Mobiele telefoons zijn onbetrouwbaar in afgelegen gebieden.

- slug: sup-size-guide
  category: buying-guide
  title: Vodnik po velikostih SUP — kako izbrati prave dimenzije deske
  description: Popoln vodnik po velikostih SUP s priporočili o dolžini, širini in debelini glede na vašo težo, višino, raven znanja in stil veslanja.
  tldr: Začetniki potrebujejo širše deske (32-34") za stabilnost. Težji veslači potrebujejo daljše deske (11'+) z večjo prostornino. Za turistično veslanje so potrebna daljša trupa (12'+). Joga zahteva dodatno širino (34"+). Vedno preverite nosilnost — vaša teža skupaj s opremo ne sme presegati 80% omejitve.
  problem: Izbira napačne velikosti SUP vodi v slabo stabilnost, počasno držo smeri in frustrirajočo izkušnjo veslanja. Večina prvih kupcev izbere desko, ki dobro izgleda, ne da bi razmislila, kako dimenzije vplivajo na zmogljivost.
  solution: 'Uskladite dolžino, širino in debelino deske s svojo težo, ravnjo znanja in glavno uporabo. Uporabite naš kalkulator velikosti: seštejte svojo težo + težo opreme in izberite desko z vsaj 20% rezerve nad to vsoto.'
  audience: Kupci, ki prvič kupujejo SUP, veslači, ki nadgrajujejo na specializirano desko, in vsi, ki niso prepričani o velikosti.
  steps:
    - Potehtajte se z vso opremo, ki jo nosite s seboj (veslo, PFD, suha torba)
    - Dodajte 20% varnostno rezervo, da določite najmanjšo potrebno nosilnost
    - 'Izberite širino glede na znanje: 32-34" za začetnike, 30-32" za srednje izkušene, 28-30" za napredne'
    - 'Izberite dolžino glede na uporabo: 10''6"-11''6" univerzalna, 12''-14'' turistična, 9''-10'' za divje vode'
    - 'Preverite debelino: 6" standardno, 4" za zmogljivostne deske, 5" za univerzalno uporabo'
    - Preverite priporočeno območje PSI vaše deske za optimalno togost
  faq:
    - q: Katera širina SUP je najboljša za začetnike?
      a: Širina od 32 do 34 palcev nudi najbolj stabilno platformo. Širša kot je deska, lažje je ohranjati ravnotežje — zlasti za večje veslače.
    - q: Kako vem, ali je SUP zame premajhen?
      a: Če deska leži prenizko v vodi, počasi reagira na upravljanje ali se premec med veslanjem zlahka potopi, je verjetno premajhna za vašo težo.
    - q: Ali dolžina deske vpliva na hitrost?
      a: Da. Daljša vodna črta povečuje teoretično hitrost trupa. Turistična deska 14' je pri enakem naporu veslača precej hitrejša od univerzalne deske 10'.

- slug: sup-with-kids
  category: lifestyle
  title: 'SUP z otroki: popoln družinski vodnik'
  description: Kako varno vzeti otroke na supanje — priporočila glede starosti, oprema in dejavnosti.
  tldr: Otroci, stari 6+, se lahko vozijo na SUP z odraslo osebo. Otroci, stari 10+, lahko z nadzorstvom veslajo na svoji deski. Uporabite široko stabilno desko, vedno nosite PFD, ostanite v plitvi mirni vodi in naj bodo seje kratke (največ 30-45 minut).
  problem: Starši želijo z otroki deliti vodne športe, a skrbijo o varnosti, ustreznosti opreme in tem, kako otroke zaposliti.
  solution: Za vožnjo v tandemu uporabite ustrezno velikost deske, poskrbite, da vsak otrok nosi dobro prilegajoč PFD, začnite v plitvi topli vodi in naredite izkušnjo zabavno z igrami in kratkimi sejami.
  audience: Starši, ki želijo svoje otroke uvesti v supanje.
  steps:
    - 'Starost 4-6: vožnja kot potnik na deski odrasle osebe — sedite spredaj, držite se centralnega ročaja'
    - 'Starost 6-10: klečenje ali sedenje na svoji deski z nadzorstvom odrasle osebe in povodcem'
    - 'Starost 10+: veslanje na svoji deski z nadzorstvom odrasle osebe v bližini'
    - Vedno nosite PFD — otroci morajo ves čas nositi dobro prilegajoč rešilni jopič
    - Ostanite v plitvi vodi (do pasu za odraslo osebo)
    - Seje naj bodo kratke — največ 30-45 minut za otroke, mlajše od 10 let
    - Naredite zabavno — igrajte igre, iščite ribe, vadite vstajanje
  faq:
    - q: Pri kateri starosti se lahko otrok samostojno poda na SUP?
      a: Približno pri starosti 10-12 let z nadzorstvom, odvisno od otrokovih plavalnih sposobnosti in udobja v vodi. Vedno v mirnih, plitvih razmerah.
    - q: Katera deska je najboljša za SUP z otroki?
      a: Široka deska (34"+) z veliko nosilnostjo za vožnjo v tandemu. Širina 33" in nosilnost 220 lb modela SUP Explorer 11 dobro delujeta za starša z otrokom.
    - q: Katero varnostno opremo potrebujejo otroci?
      a: Dobro prilegajoč rešilni jopič s certifikatom CE, povodec (za tandem privezan na desko odrasle osebe), zaščitno kremo za sonce in klobuk.

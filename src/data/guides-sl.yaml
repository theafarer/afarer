- slug: sup-fitness
  category: lifestyle
  title: 'SUP fitnes: vadba za celotno telo na vodi'
  description: Kako supanje gradi moč telesnega jedra, ravnotežje in kardiovaskularno pripravljenost.
  tldr: SUP pri vsakem zavesljaju vključuje jedro, noge, hrbet in ramena. Enourni trening porabi 300-500 kalorij. Veslanje proti vetru ali toku podvoji intenzivnost. SUP joga doda vadbo prožnosti in ravnotežja.
  problem: Mnogi supanje dojemajo kot sprostitveno dejavnost in ne kot resno fitnes orodje, s čimer spregledajo njegov potencial za kondicijsko krepitev celega telesa.
  solution: 'Treninge SUP strukturirajte s specifičnimi fitnes cilji: vzdržljivostno veslanje za kardio, intervalni sprinti za moč, SUP joga za prožnost in dolge razdalje za mišično vzdržljivost.'
  audience: Ljubitelji fitnesa, ki iščejo vadbo za celotno telo z nizko obremenitvijo sklepov in visokim angažmajem.
  steps:
    - Ogrevanje na suhem — kroženje z rokami, zasuki trupa in zamahi z nogami 5 minut
    - Začnite z 10 minutami enakomernega veslanja pri zmerni intenzivnosti
    - Nadaljujte z intervalnim treningom — 2 minuti intenzivnega veslanja, 2 minuti lahkotnega okrevanja
    - Vključite jogijske položaje SUP — pes z glavo navzdol, bojevnik II in drevo na deski
    - Zaključite z lahkim veslanjem in statičnimi raztegi na deski
  faq:
    - q: Je SUP za fitnes boljši od teka?
      a: SUP nudi primerljive kardiovaskularne koristi z manjšo obremenitvijo sklepov. Poleg tega bolj kot tek vključuje zgornji del telesa in jedro.
    - q: Koliko kalorij porabi SUP?
      a: Približno 300-500 kalorij na uro pri zmerni intenzivnosti. Dirkanje ali veslanje proti vetru lahko porabi 600-800 kalorij na uro.
    - q: Ali lahko z SUP zgradim mišice?
      a: Da. Veslanje gradi mišice ramen, hrbta in jedra. Ohranjanje ravnotežja vključuje noge in stabilizacijske mišice. Gre za trening z uporom za celotno telo.

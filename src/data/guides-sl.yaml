- slug: paddling-techniques
  category: tutorial
  title: Ključne veslaške tehnike SUP
  description: Obvladajte osnovni zamas, lovilni zamas in prekrižni zavoj, da boste učinkovito veslali v vseh razmerah.
  tldr: Osnovni zamas uporablja vašo sredico telesa, ne roke. Lovilni zamas obrača desko. Prekrižni zavoj je najučinkovitejša vrtilna tehnika. Veslo imejte pokončno in lopatico popolnoma potopite za največji prenos moči.
  problem: Večina veslačev uporablja zamase, pri katerih prevladujejo roke, kar zapravlja energijo in povzroča utrujenost ramen. Slaba tehnika tudi otežuje nadzor nad desko pri vetru in burki.
  solution: Naučite se tri ključne zamase — osnovnega, lovilnega in prekrižni zavoj — s pravilno mehaniko telesa. Vsakega vadite na mirni vodi, preden nadaljujete na zahtevnejše razmere.
  audience: Veslači, ki želijo veslati dlje, hitreje in z manj utrujenosti.
  steps:
    - 'Osnovni zamas: sežite naprej, lopatico popolnoma potopite, vlecite nazaj z rotacijo trupa (ne z rokami), izstopite pri gležnju'
    - 'Lovilni zamas: sežite naprej ob robu deske, lovilni gib lopatice v širokem loku proti repu, desko obrnite proč od strani vesla'
    - 'Prekrižni zavoj: postavite veslo na nasprotno stran deske brez menjave rok, vlecite proti repu'
    - 'Opora: uporabite nizko oporo za stabilnost v burki — lopatico ploščato udarite po površini vode'
    - 'Zamas privlačenja: sežite bočno, potegnite desko bočno proti veslu'
  faq:
    - q: Kako veslam v ravni črti?
      a: Uporabite dosledno dolžino zamaha na obeh straneh. Menjujte strani vsakih 5-10 zamahov. Za orientacijo glejte v točko na obzorju.
    - q: Ali naj pokrčim kolena?
      a: Da. Kolena imejte rahlo pokrčena kot blažilca udarcev. Zaklenjena kolena prenašajo vsak val na vašo sredico telesa in zmanjšujejo stabilnost.
    - q: Kako veslam proti vetru?
      a: Nižajte stojišče, uporabljajte krajše in hitrejše zamase in ostanite bližje obali, kjer je veter pogosto šibkejši. Če je veter premočan, ne plavajte.

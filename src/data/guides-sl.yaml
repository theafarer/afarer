  category: buying-guide
  title: Nujna SUP oprema — kaj resnično potrebujete
  description: Praktični vodnik po nujni opremi za SUP, od rešilnih jopičev in vesel do črpalk, varnostnih vrvi in kompletov za vzdrževanje. Kaj kupiti najprej in kaj lahko izpustite.
  tldr: 'Nujno potrebno: PFD (rešilni jopič), varnostna vrv, črpalka, veslo, plavut. Zelo priporočljivo: komplet za popravila, vodotesna torbica za telefon, palubna torba. Prijetno imeti: električna črpalka, suha obleka, nosilec za palubno hladilno torbo. Izpustite novitetne izdelke, ki dodajajo težo brez koristi.'
  problem: Novi lastniki SUP so presenečeni nad široko ponudbo dodatkov in pogosto kupujejo nepotrebne izdelke, pri tem pa spregledujejo ključno varnostno opremo.
  solution: 'Dodatke razvrstite po prioritetah: varnost (PFD, varnostna vrv, piščalka), funkcionalnost (črpalka, rezervno veslo, komplet za popravila), priročnost (palubna torba, torbica za telefon), udobje (sedlo, nosilec za hladilno torbo).'
  audience: Novi lastniki SUP, ki sestavljajo svoj komplet opreme.
  steps:
    - Kupite rešilni jopič z odobritvijo CE/USCG, ki vam dobro ustreza
    - Pridobite zavito varnostno vrv za SUP, primerno za vaš tip vode (zavita za mirne vode, ravna za reke)
    - Prepričajte se, da vaša črpalka doseže 15 PSI in ima manometer
    - Dodajte komplet za popravila s PVC zaplatami in orodjem za ventil
    - Razmislite o suhi torbi ali vodotesni torbici za telefon za dragocenosti
    - Za specializirane dejavnosti dodajte nosilec za palubno hladilno torbo ali držalo za ribiško palico
  faq:
    - q: Ali res potrebujem rešilni jopič za SUP?
      a: Da. Poškodovati ali izčrpati se lahko tudi dobri plavalci. PFD je najpomembnejši varnostni element. Ponekod ga zakonsko zahtevajo.
    - q: Katera črpalka je najboljša za napihljive SUP-e?
      a: Dvodejavne ročne črpalke so standard. Električne črpalke prihranijo trud, a potrebujejo vir napajanja. Vedno uporabite črpalko z manometrom, da se izognete prekomernemu napihovanju.
    - q: Ali potrebujem posebno veslo?
      a: Začetnikom ustreza priloženo aluminijasto veslo. Nadgradnja na veslo iz steklenih vlaken ali ogljikovo veslo pri dolgih veslanjih precej zmanjša utrujenost rok.

- slug: sup-storage-winter-care
  category: maintenance
  title: Shranjevanje SUP in zimska nega — podaljšajte življenjsko dobo svoje deske
  description: Kako pravilno shraniti, očistiti in pripraviti na zimo svojo napihljivo desko SUP. S pravilno nego se izognete plesni, UV škodi in razgradnji materiala.
  tldr: Po vsaki uporabi očistite s sladko vodo. Pred shranjevanjem popolnoma posušite. Spustite zrak in shranite na hladnem, temnem mestu, stran od neposredne sončne svetlobe in ekstremnih temperatur. Nikoli ne shranjujte napihnjene deske ali v vročem avtomobilu. Občasno nanesite sredstvo za UV zaščito.
  problem: Nepravilno shranjevanje je najpogostejši vzrok prezgodnje okvare SUP — plesen, razpad materiala, delaminacija ter poškodbe ventila zaradi vročine ali mraza.
  solution: 'Sledite rutini nege v treh korakih: po vsaki seji splaknite, pred shranjevanjem temeljito posušite in shranite s spuščenim zrakom v prostoru z nadzorovano temperaturo med 50-80°F (10-27°C).'
  audience: Vsi lastniki SUP, ki želijo, da njihova deska zdrži 5+ let.
  steps:
    - Po vsaki seji v slani ali blatni vodi splaknite desko, veslo in črpalko s sladko vodo
    - Čistite z blagim milom in mehko gubo — nikoli z agresivnimi kemikalijami ali visokotlačnim čistilnikom
    - Desko pred izpustom zraka popolnoma posušite na prostem (odprite ventil, da uide notranja vlaga)
    - Popolnoma spustite zrak in zvijte desko od premca proti repu, da iztisnete preostali zrak
    - Nahrbtnik obrišite do suhega, preden desko shranite vanj
    - Shranite v hladni, temni omari ali pod posteljo — nikoli na neposrednem soncu, v vročem avtomobilu ali v ledeni lopi
  faq:
    - q: Ali lahko pustim svoj SUP napihnjen celo sezono?
      a: Bolje je spustiti zrak, če deska dlje časa ni v uporabi. Stalna obremenitev s PSI pospešuje utrujanje materiala. Če jo shranjujete več kot 2 tedna, spustite zrak med sejami.
    - q: Kako odstranim plesen s svojega SUP-a?
      a: Zmešajte blago milo s toplo vodo in dodajte kanec belega kisa. Nežno podrgnite z mehko krtačo. Temeljito sperite in posušite v senci. Izogibajte se belilu, ki poškoduje PVC.
    - q: Ali lahko shranim svoj SUP v garaži?
      a: Samo če garaža vse leto ostane med 50-80°F. Podstrešja in neklimatizirane garaže doživljajo temperaturne ekstreme, ki poškodujejo drop-stitch jedra.

- slug: sup-inflation-psi-guide
  category: technical
  title: Vodnik o napihovanju SUP — optimalen PSI za zmogljivost in varnost
  description: 'Popoln vodnik po tlaku napihovanja SUP: priporočena območja PSI, vpliv tlaka na zmogljivost in nasveti za pravilno uporabo črpalke.'
  tldr: Večino napihljivih SUP napihnite na 12-15 PSI. Višji tlak = več togosti, a počasnejše napihovanje. Nižji tlak = mehkejši občutek, a več upogibanja. Nikoli ne presegajte največjega PSI, natisnjenega na vaši deski. Uporabite črpalko z natančnim manometrom. Hladen zrak znižuje tlak, vroče sonce pa ga povečuje.
  problem: Premalo napihnjene deske se počutijo počasne in prekomerno upogibajo. Preveč napihnjene deske tvegajo okvaro šivov. Mnogi veslači PSI uganejo, namesto da bi ga natančno izmerili.
  solution: Uporabite črpalko z vgrajenim manometrom. Za največjo togost ciljajte na 15 PSI. Tlak preverite pred vsako sejo — temperaturne spremembe občutno vplivajo na PSI.
  audience: Vsi lastniki napihljivih SUP.
  steps:
    - Preverite priporočeno območje PSI, natisnjeno na vaši deski v bližini ventila
    - Z dvodejavno črpalko napihnite do sredine priporočenega območja
    - Za zadnjih 3-4 PSI preklopite v enodejavni način za natančnejši nadzor
    - Tlak preverite z manometrom — analogni manometri so zanesljivejši od digitalnih
    - 'Prilagodite razmeram: višji PSI za turistično veslanje in dirkanje, nižji PSI za divje vode in kamnite spuste v vodo'
    - Ponovno preverite tlak, ko deska stoji 10 minut — temperaturno ravnovesje spremeni PSI
  faq:
    - q: Ali lahko svoj SUP preveč napihnem?
      a: Da. Preseganje deklariranega največjega PSI (običajno 15-18 PSI) lahko povzroči delaminacijo šivov in poškoduje drop-stitch jedro. Vedno ostanite znotraj natisnjenega območja.
    - q: Ali temperatura vpliva na PSI?
      a: Občutno. Deska, napihnjena na 15 PSI pri 70°F, lahko na neposrednem soncu pri 95°F doseže 18 PSI. Hladna voda lahko tlak zniža na 12 PSI. Po spremembah razmer preverite tlak.
    - q: Kateri PSI za začetnike?
      a: 12-13 PSI za učenje ponuja nekoliko mehkejšo platformo, ki je pri padcih bolj odpuščajoča. Ko se znanje izboljša, povečajte na 15 PSI.

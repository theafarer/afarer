- slug: choosing-paddle
  category: buying-guide
  title: Kako izbrati pravo veslo za SUP
  description: Vodnik po materialih vesla, oblikah lopat, vrstah drogov in dimenzijah za SUP.
  tldr: 'Dolžina vesla: vesla za SUP naj bi bila 6-8" višja od vaše višine. Oblika lopate: dihedralne lopate držijo naravnost, ravne lopate ponujajo močnejši prijem. Material droga: karbon je najlažji, steklena vlakna najboljša vrednost, aluminij najcenejša izbira.'
  problem: Uporaba napačne velikosti ali materiala vesla povzroča nepotrebno utrujenost, slabo učinkovitost zavesljaja in obremenitev sklepov.
  solution: Uskladite dolžino vesla, obliko lopate, material droga in upogljivost s svojim slogom veslanja, velikostjo telesa in proračunom.
  audience: Veslači SUP, ki izbirajo svoje prvo ali naslednje veslo.
  steps:
    - Izmerite višino vesla — za splošno veslanje 6-8" več od vaše višine
    - Izberite material lopate — najlon za nizki proračun, steklena vlakna za vrednost, karbon za zmogljivost
    - Izberite obliko lopate — dihedralna za gladko drsanje, ravna za moč, žličasta za dirkanje
    - Izberite vrsto droga — raven za splošno uporabo, upognjen za dirkalni SUP
    - Preverite upogljivost — bolj tog drog prenaša več moči, upogljiv drog zmanjšuje obremenitev sklepov
  faq:
    - q: Kateri je najboljši material za veslo?
      a: Steklena vlakna nudijo najboljše ravnovesje med težo, trajnostjo in ceno. Karbon je lažji, a dražji in lomljiv. Najlon je težak, a praktično neuničljiv.
    - q: Od kod vem, ali je moje veslo prave dolžine?
      a: Veslo postavite pokonci zraven sebe — ročaj naj seže do vašega zapestja, ko dvignete roko nad glavo.
    - q: Ali naj vzamem enodelno ali nastavljivo veslo?
      a: Nastavljiva vesla so dobra za skupno uporabo in potovanja. Enodelna vesla so lažja, bolj toga in učinkovitejša za namensko uporabo.

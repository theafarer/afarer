- slug: sup-weight-capacity
  category: buying-guide
  title: Vodnik o nosilnosti SUP — koliko teže lahko prenese SUP?
  description: Razumevanje omejitev nosilnosti SUP, kako izračunati svojo skupno obremenitev in zakaj preseganje omejitve vpliva na zmogljivost in varnost.
  tldr: Nikoli ne presegajte 80% največje nosilnosti deske s telesno težo in opremo. Deska z nosilnostjo 220 lb ustreza veslaču s težo 160 lb in lahko opremo. Preseganje omejitve povzroča zibanje deske gor in dol, počasen odziv na upravljanje ter večje tveganje poškodb.
  problem: Veslači pogosto presegajo nosilnost svoje deske, kar vodi v slabo zmogljivost, potapljanje deske in morebitne poškodbe. Proizvajalci navajajo največje omejitve, ne pojasnijo pa varnih delovnih obremenitev.
  solution: Izračunajte svojo skupno obremenitev (telesna teža + oprema + voda, ki jo vpije deska) in ostanite pod 80% navedene največje nosilnosti. Težji veslači potrebujejo deske z večjo prostornino in nosilnostjo 300+ lb.
  audience: Veslači vseh postav, zlasti večji veslači in tisti, ki s seboj nosijo ekspedicijsko opremo.
  steps:
    - Poiščite največjo nosilnost, natisnjeno na vaši deski (običajno v bližini ventila)
    - Potehtajte sebe in vso opremo, vključno z veslom, PFD, suhimi torbami, hladilno torbo in dodatki
    - 'Izračunajte: (vaša skupna obremenitev) ÷ (največja nosilnost) × 100 = % izkoriščene nosilnosti'
    - Ciljajte na 70-80% za optimalno zmogljivost in varnost
    - Če presegate 80%, izberite večjo desko ali zmanjšajte opremo
  faq:
    - q: Kaj se zgodi, če presegem omejitev teže?
      a: Deska sede nižje v vodo in ustvarja večji upor. Stabilnost se zmanjša, premec se lahko potopi, jedro iz drop-stitch tehnologije pa je v razburkani vodi izpostavljeno večjemu tveganju poškodb.
    - q: Ali lahko na enem SUP-u vozita dve osebi?
      a: Samo če skupna teža ostane pod 80% nosilnosti. Večina standardnih SUP-ov je zasnovana za enega voznika. Vožnja v tandemu zahteva desko, ki je posebej ocenjena za dve osebi.
    - q: Ali imajo napihljivi SUP-i manjšo nosilnost kot trde deske?
      a: Kakovostni napihljivi SUP-i s drop-stitch konstrukcijo imajo zaradi debelejše razporeditve prostornine primerljivo ali celo višjo nosilnost kot trde deske.

- slug: understanding-specs
  category: technical
  title: Kako brati tehnične specifikacije desk SUP
  description: Tehnični vodnik za razumevanje specifikacij desk SUP — prostornina, mere, konstrukcija in njihov pomen za zmogljivosti.
  tldr: 'Ključne specifikacije: prostornina (litri) določa plovnost in nosilnost, širina določa stabilnost, dolžina določa držanje smeri in hitrost, debelina določa togost, ocena PSI pa določa tlak napihovanja za optimalne zmogljivosti.'
  problem: Tehnični listi izdelkov navajajo številke brez konteksta, zato kupci niso prepričani, katere specifikacije so zanje dejansko pomembne.
  solution: 'Prevedite vsako specifikacijo v realne zmogljivosti: prostornina za plovnost, širina za stabilnost, dolžina za drsenje, debelina za togost in konstrukcija za trajnost.'
  audience: Veslači srednje ravni in tehnično usmerjeni kupci, ki želijo sprejemati odločitve na podlagi podatkov.
  steps:
    - Preverite prostornino (litri) — vaša teža plus oprema ne sme presegati 80 % ocene prostornine deske
    - Preverite širino — širša (32-34") = več stabilnosti, ožja (28-30") = več hitrosti
    - Preverite dolžino — daljša (12-14") = boljše držanje smeri, krajša (10-11") = boljša gibljivost
    - Preverite debelino — 6" je standardna, 8" ponuja več togosti in nosilnosti
    - Preverite oceno PSI — napihnite do največje ocenjene vrednosti PSI za optimalno togost
    - Preverite konstrukcijske materiale — gostota drop-stitch, plasti PVC, ojačitev robov
  faq:
    - q: Kaj pomeni drop-stitch?
      a: Drop-stitch je metoda konstrukcije, pri kateri tisoči niti povezujejo zgornjo in spodnjo plast deske. To omogoča napihovanje pri visokem tlaku (12-15 PSI) za izjemno togost.
    - q: Kakšno je idealno razmerje med težo in prostornino?
      a: Dober cilj je približno 5-6 funtov teže veslača na liter prostornine deske. Veslač s težo 220 lb naj išče deske s prostornino 180+ litrov.
    - q: Ali je teža deske pomembna?
      a: Da. Lažje deske (pod 20 lbs) so lažje za nošenje in prevoz. Težje deske (25+ lbs) pogosto nakazujejo trajnejšo večplastno PVC konstrukcijo.

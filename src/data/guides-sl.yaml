- slug: sup-maintenance
  category: maintenance
  title: Kako očistiti in shraniti svojo napihljivo desko SUP
  description: Postopni vodnik za vzdrževanje, ki poveča življenjsko dobo vaše napihljive deske SUP.
  tldr: Po vsaki uporabi sperite s sladko vodo, pred shranjevanjem popolnoma posušite, izpustite zrak in ohlapno zvitajte (ne vojaško tesno), shranite na hladnem in suhem mestu stran od neposredne sončne svetlobe ter mesečno pregledujte šive.
  problem: Neustrezno shranjevanje in čiščenje sta vodilna vzroka prezgodnjih okvar napihljivih desk SUP — plesen, UV škoda in lojevanje šivov.
  solution: 'Sledite dosledni rutini po seji: sperite, posušite, pregledajte, izpustite zrak in shranite. Za trmast umazanijo uporabite blago milo. Deske nikoli ne shranjujte mokre ali na neposredni sončni svetlobi.'
  audience: Vsi lastniki napihljivih desk SUP, ki želijo, da njihova deska zdrži 5+ let.
  steps:
    - Takoj po uporabi sperite desko s sladko vodo, še posebej po slani vodi
    - Očistite z blagim milom in mehko gobo — izognite se ostrim kemikalijam ali čistilom z visokim tlakom
    - Desko popolnoma posušite — odprite ventil, da ujeta voda uide
    - Preglejte za poškodbe — preverite šive, ventil in površino za predrage
    - Popolnoma izpustite zrak — odstranite jedro ventila za popolno izpuščanje
    - Desko ohlapno zvitajte — začnite s smernega dela, izognite se tesnim gubam
    - Shranite v nosilni torbi na hladnem, suhem mestu stran od neposredne sončne svetlobe
  faq:
    - q: Lahko pustim svojo desko SUP napihnjeno celo sezono?
      a: Da, vendar jo ob neuporabi držite izven neposredne sončne svetlobe. Za daljše shranjevanje je priporočeno delno izpuščanje (8-10 PSI).
    - q: Kako popravim predrtino?
      a: Očistite območje, izrežite obliž z zaobljenimi koti, nanesite lepilo, močno pritisnite in počakajte 24 ur pred napihovanjem. Deske afarer vključujejo popravilni komple.
    - q: Kako pogosto naj preverim ventil?
      a: Mesečno. Ventil je najpogostejša točka okvare. Preverite, da se igla ventila prosto premika in da je O-obroč nedotaknjen.

- slug: sup-fishing
  category: lifestyle
  title: 'Vodnik po ribolovu s SUP: kako ribariti z desko'
  description: Vse, kar morate vedeti o ribolovu z deske — nastavitev opreme, nasveti za stabilnost in tehnike.
  tldr: Ribolov s SUP omogoča tiho približevanje, dostop do plitve vode in metanje v 360 stopinjah. Uporabite široko stabilno desko (34"+), pritrdite držala za palčke in uporabite hladilno torbo ali zaboj kot ploščad za opremo. Pri vetru se zasidrajte. Vedno nosite PFD.
  problem: Običajni ribiški čolni so dragi za vzdrževanje in ne morejo v plitvo vodo. Ribolov s SUP to rešuje s prenosno platformo za ribolov v plitvi vodi, vendar zahteva posebne prilagoditve opreme.
  solution: Opremite stabilen SUP z držali za palčke, zabojem za opremo in sidrnim sistemom. Izkoristite prenosljivost deske za dostop do oddaljenih ribolovnih mest, do katerih čolni ne morejo priti.
  audience: Ribiči, ki želijo ribariti v plitvih vodah ali na oddaljenih lokacijah ali pa imajo raje lahko, prenosno ribolovno platformo.
  steps:
    - Izberite široko desko (34"+) z veliko nosilnostjo za opremo
    - Na palubo namestite držala za palčke s sistemi za pritrditev na profile ali s trakovi
    - Za ribiško opremo uporabite vodotesen zaboj ali hladilno torbo, privezano na sprednjo palubo
    - Za vetrovne razmere prinesite majhno sidro ali kol za zasidranje
    - Nosite PFD z žepi za orodje in telefon
    - Metanje vadite iz klečečega položaja, preden vstanete
  faq:
    - q: Ali lahko na SUP stojim in ribarim?
      a: Da. Široka deska 34"+ nudi dovolj stabilnosti za stojo in metanje. Najprej vadite na mirni vodi.
    - q: Katere ribe lahko lovim s SUP?
      a: SUP je odličen za basa v jezerih, rdeče ribe na plitvinah, postrvi v rekah ter obalne vrste v zalivih in estuarijih.
    - q: Kako izvlečem ujeto ribo s SUP?
      a: Za stabilnost kleknite. Uporabite mrežo ali prijemalo za ustnico. Ribo držite nizko, da ne padete. Ribo izpustite ali shranite v hladilno torbo.

  title: SUP s psi — Popoln vodnik za veslanje na deski s hišnim ljubljenčkom
  description: 'Vse, kar morate vedeti o veslanju na deski s psi: koraki treninga, varnostna oprema, izbira deske in nasveti za uspešno sejo SUP z vašim kosmatim prijateljem.'
  tldr: Začnite s široko, stabilno desko (34"+). Uporabite rešilni jopič za hišne ljubljenčke, protizdrsnalno podlago na palubi in kratko varovalno vrvico. Najprej trenirajte na kopnem, nato v plitvi vodi. Seje naj bodo kratke (20-30 min). Prinesite svežo vodo in brisačo. Nikoli ne silite psa, če je videti tesnoben.
  problem: Veslanje na deski s psi je lahko brez ustrezne priprave stresno — psi se lahko prestrašijo, skočijo z deske ali praskajo njeno površino.
  solution: Uporabite široko stabilno desko z mehko EVA podlago. Psa postopoma navadite na desko. Prinesite varnostno opremo, vključno z rešilnim jopičem za psa in kratko varovalno vrvico, primerno za SUP.
  audience: Lastniki psov, ki želijo veslati na SUP s svojimi hišnimi ljubljenčki.
  steps:
    - Začnite s široko desko (34"+ z visoko nosilnostjo za vas in psa)
    - Pridobite rešilni jopič za psa, ki se dobro prilega in ima ročaj
    - 'Vadite na kopnem: pes naj sedi na izpuščeni deski, nato na napihnjeni deski na travi'
    - 'Pojdite v plitvo vodo: kleknite na desko s psom in naredite nekaj zamahov'
    - 'Seje naj bodo kratke: prvih nekaj izhodov največ 20-30 minutes'
    - Vedno prinesite svežo vodo, zložljivo posodo in brisačo za psa
  faq:
    - q: Katera deska SUP je najboljša za pse?
      a: Široka stabilna deska z mehko EVA podlago, ki tacam nudi oporo. Tropical Breeze Island Escape s širino 34"+ je idealna za veslanje s psi.
    - q: Ali moj pes potrebuje rešilni jopič?
      a: Da, tudi če je odličen plavalec. Rešilni jopič za psa z ročajem omogoča, da psa enostavno dvignete nazaj na desko, če pade z nje.
    - q: Kako preprečim, da bi pes praskal desko?
      a: Psu redno strižite kremplje. Podloga iz EVA pene ščiti površino iz PVC. Za dodatno zaščito položite na palubo brisačo ali podlogo za hišne ljubljenčke.

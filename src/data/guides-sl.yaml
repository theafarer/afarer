- slug: multi-day-trip
  category: planning
  title: Načrtovanje večdnevnega izleta s SUP
  description: Kako načrtovati in izvesti večdnevno veslaško potovanje — načrtovanje poti, pakiranje opreme, kampiranje in varnost.
  tldr: Načrtujte 10-15 miles na dan. Opremo zapakirajte v vodotesne suhe vreče, težo enakomerno porazdelite in nalaganje deske vadite pred potovanjem. Oddajte načrt plovbe. Nosite vodo, hrano, bivališče, navigacijo in komunikacijo.
  problem: Večdnevna potovanja spodletijo zaradi pretiranega pakiranja, slabega načrtovanja poti ali podcenjevanja vremena in tokov — kar vodi v izčrpanost, okvare opreme ali varnostne incidente.
  solution: 'Uporabite sistematičen pristop k načrtovanju: izbira poti, kontrolni seznam opreme, načrtovanje hrane, varnostni pregled in načrtovanje za izredne razmere.'
  audience: Izkušeni veslači, ki načrtujejo svojo prvo večdnevno ekspedicijo.
  steps:
    - Izberite pot z urejenimi kampi in izstopnimi točkami
    - Načrtujte 10-15 miles na dan, upoštevajoč veter in tok
    - Preverite tablice plime in oseke ter vremenske napovedi za celotno obdobje potovanja
    - Opremo zapakirajte v vodotesne suhe vreče — skupna teža opreme 20-30 lbs
    - Težo porazdelite enakomerno — najtežji kosi v sredino
    - Podroben načrt plovbe pustite nekomu na kopnem
    - Vzemite navigacijo — papirnato pomorsko karto, kompas in rezervni GPS
    - Zapakirajte zasilno bivališče, dodatno hrano in komplet za prvo pomoč
  faq:
    - q: Kakšna je idealna dnevna razdalja?
      a: 10-15 miles na dan za izkušene veslače. Začetniki naj načrtujejo 5-8 miles. Za vreme vedno vključite rezervni čas.
    - q: Koliko vode naj nosim?
      a: 1 gallon na osebo na dan. V vročih razmerah 1.5 gallons. Za dopolnjevanje nosite filter za vodo ali tablete za razkuževanje vode.
    - q: Katera je najpomembnejša varnostna oprema?
      a: Komunikacija. VHF radio ali satelitski sporočevalec vam v izrednih razmerah lahko reši življenje. Mobilni telefoni so na oddaljenih območjih nezanesljivi.

- slug: inflatable-repair
  category: maintenance
  title: Kako popravite svoj napihljivi SUP
  description: Postopni vodnik za popravilo prebojev, težav z ventili in poškodb šivov na napihljivih SUP.
  tldr: Majhne preboje (manj kot 1/4") lahko popravite s priloženim kompletom obližev. Očistite območje, nanesite PVC lepilo, pritisnite obliž in počakajte 24 ur. Uhajanje zraka skozi ventil običajno zahteva zamenjavo O-obroča. Velike strge ali delaminacijo šiva je treba prepustiti profesionalnemu servisu.
  problem: Majhni preboji in težave z ventili so pogosti, a jih je enostavno odpraviti. Brez pravilne tehnike popravila uporabniki bodisi preplačajo profesionalni servis bodisi poslabšajo škodo.
  solution: Določite vrsto poškodbe — preboj, uhajanje skozi ventil ali težava s šivom — in uporabite ustrezno metodo popravila. Večina popravil traja 30 minut plus čas strjevanja.
  audience: Lastniki napihljivih SUP, ki želijo osnovna popravila opraviti sami.
  steps:
    - Poiščite mesto uhajanja — desko popolnoma napihnete, poslušate, kjer uhaja zrak, tipate z roko ali uporabite milnico
    - Mesto uhajanja označite s pisalom ali trakom
    - Območje okoli mesta uhajanja očistite z izopropilnim alkoholom — vsaj 2 inches okoli poškodbe
    - Površino zrnajte s finim brusnim papirjem za boljše oprijemanje lepila
    - PVC lepilo nanesite tako na obliž kot na površino deske
    - Počakajte 5 minut, da lepilo postane lepljivo
    - Obliž močno pritisnite, z valjčkom ali kartico izravnajte mehurčke zraka
    - Pustite strditi 24 ur, preden napihnete na poln pritisk
  faq:
    - q: Ali lahko preboj popravim na vodi?
      a: Nujsna popravila z obližem in trakom vas lahko vrnejo na obalo. Polno popravilo zahteva suhe razmere in 24-urno strjevanje.
    - q: Kako popravim uhajajoč ventil?
      a: S priloženim orodjem odstranite jedro ventila, preverite, ali je O-obroč poškodovan, ga po potrebi zamenjajte in jedro trdno vstavite nazaj.
    - q: Katero lepilo naj uporabim za popravila PVC?
      a: Uporabite lepilo, namenjeno PVC, kot sta HH-66 ali Clifton. Običajno super lepilo se ne oprijema dobro napihljivih materialov iz PVC.

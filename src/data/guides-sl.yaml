- slug: beginner-guide
  category: tutorial
  title: Vodnik za začetnike pri veslanju na deski
  description: Vse, kar morate vedeti pred svojo prvo sejo veslanja na deski — od priprave opreme do osnovnih veslaških tehnik.
  tldr: Začnite na mirni, gladki vodi s široko stabilno desko. Napihnite do 12-15 PSI, pritrdite varnostni pas in uporabite pravilno dolžino vesla (6-8" višje od vaše višine). Noge imejte v širini ramen, kolena rahlo pokrčena in glejte v obzorje.
  problem: Novi veslači pogosto preskočijo temeljno pripravo — napačna dolžina vesla, slabo stojišče ali izbira razburkane vode — kar vodi v padce, frustracijo in odnehanje.
  solution: 'Sledite strukturiranemu načrtu prve seje: izberite mirno vodo, pravilno pripravite opremo, vadite klečenje pred stanjem in obvladajte osnovni zamas, preden se lotite zavojev.'
  audience: Popolni začetniki, ki še nikoli niso veslali na deski.
  steps:
    - Izberite gladko, mirno vodo brez čolnarskega prometa — majhno jezero ali zatočeno zaliv je idealen
    - Napihnite desko na 12-15 PSI z dvojno delujočo črpalko
    - Pritrdite spiralni varnostni pas na gleženj ali meč, nikoli na ročaj deske
    - Vstavite plavut in pritegnite vijak
    - Nastavite dolžino vesla — moralo bi biti 6-8 centimetrov višje od vaše višine
    - Začnite klečeč na deski, z veslajem nekaj zamahov, da občutite ravnovesje
    - Vstanite po eni nogi naenkrat, stopala v širini ramen, kolena mehka
    - Glejte v obzorje, ne v stopala — deska gre tja, kamor gledate
  faq:
    - q: Kaj naj oblečem za veslanje na deski?
      a: Hitro sušeča športna obleka, rešilni jopič, zaščitno sredstvo proti soncu in kapa. V hladni vodi nosite neoprensko obleko. Vedno nosite varnostni pas in nosite telefon v vodotesnem ovitku.
    - q: Kako se vrnem na desko, če padem?
      a: Ostanite mirni. Splavajte do deske, zgrabite osrednji ročaj in brcnite z nogami, medtem ko se v enem gibu povlečete na desko. Najprej se vrnite v klečeči položaj, nato vstanite.
    - q: Kateri vetrovni pogoji so varni?
      a: 'Za začetnike: veter pod 10 mph (5 knots). Če piha veter proč od obale, ne hodite na vodo. Preverite napoved in zavedajte se, da je morjen veter nevaren.'

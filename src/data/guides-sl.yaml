- slug: weather-conditions
  category: safety
  title: Razumevanje vremenskih razmer za veslanje na deski
  description: Naučite se brati veter, valove, plimo in vremenske vzorce, da na vodi sprejemate varne odločitve.
  tldr: 'Pred vsakim izplutjem preverite tri stvari: hitrost vetra (pod 10 mph za začetnike), višino valov (pod 1 ft za začetnike) in temperaturo vode (oblečite se za vodo, ne za zrak). Morjen veter je nevaren pri vsaki ravni znanja.'
  problem: Večina vremensko pogojenih nesreč se zgodi, ker veslači napačno ocenijo razmere — preverijo temperaturo zraka, ne pa temperature vode, ali ne razumejo, da jih lahko morjen veter odnese na odprto morje.
  solution: 'Uporabite strukturirano vremensko oceno pred izplutjem: smer in hitrost vetra, perioda in višina valov, stanje plime ter temperatura vode. Razumite, kako vsak faktor vpliva na vašo varnost.'
  audience: Vsi veslači, ki gredo na odprto vodo — jezera, zalivi, reke in ocean.
  steps:
    - Preverite hitrost in smer vetra — morjen veter (piha s kopnega proti morju) je najbolj nevaren
    - Ocenite razmere valov — perioda valov je prav tako pomembna kot višina valov
    - Poznajte plimo — plimski tok je lahko močnejši od vaše hitrosti veslanja
    - Izmerite temperaturo vode — pod 60°F/15°C je zahtevana toplotna zaščita
    - Preverite vidljivost — megla in močan dež zmanjšujeta vidljivost in povečujeta tveganje trčenja
    - Razumite lokalne nevarnosti — potopljene skale, močni tokovi, območja čolnarskega prometa
  faq:
    - q: Katera hitrost vetra je previsoka za SUP?
      a: 'Začetniki: nad 10 mph (8 knots). Srednja raven: nad 15 mph (13 knots). Napredni: nad 20 mph (17 knots). Če dvomite, ne plavajte.'
    - q: Kaj pomeni perioda valov?
      a: Perioda valov je čas med zaporednimi valovi. Kratke periode (pod 8 sekund) pomenijo strme, razburkane valove. Dolge periode (nad 12 sekund) pomenijo bolj gladko in predvidljivo morsko merjenje.
    - q: Lahko veslam v dežju?
      a: Rahel dež je običajno varen. Močan dež zmanjšuje vidljivost in lahko nakazuje spreminjajoče vetrovne razmere. Nevihte zahtevajo takojšnjo evakuacijo z vode.

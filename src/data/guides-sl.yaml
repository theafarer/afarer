- slug: sup-for-whitewater
  category: buying-guide
  title: Vodnik za SUP na divji vodi — Nakupovalni vodnik za napihljive deske za spuščanje po rekah
  description: 'Kako izbrati SUP za divjo vodo za spuščanje po rekah: krajše deske, ojačana konstrukcija, varnostna oprema in tehnike veslanja za brzice razreda I-III.'
  tldr: SUP za divjo vodo potrebujejo krajšo dolžino (8-10'), ojačane bočne robove, višji PSI (15+) in več zračnih komor za varnost. Uporabite ravno rečno varovalno vrvico (ne spiralno), nosite čelado in PFD ter vedno veslajte v družbi. Začnite z brzicami razreda I, preden se lotite težjih.
  problem: Spuščanje po reki s standardnim vsestranskim SUP je nevarno — standardnim deskam manjka okretnost, odpornost na udarce in varnostni elementi, ki jih reke zahtevajo.
  solution: Izberite namensko izdelan SUP za divjo vodo s kratko dolžino za okretnost, ojačano konstrukcijo za udarce ob skale in večkomorno zasnovo za varnost.
  audience: Izkušeni veslači, ki prehajajo na spuščanje po rekah.
  steps:
    - Izberite desko z dolžino 8-10' za največjo okretnost v brzicah
    - Poiščite ojačano konstrukcijo bočnih robov in vojaški PVC
    - Izberite desko z 2+ zračnimi komorami za rezervo v primeru preboda
    - Uporabite ravno rečno varovalno vrvico, pritrjeno na pas s hitrim odpustom
    - Nosite čelado, PFD in ustrezno rečno obutev
    - Začnite z brzicami razreda I in postopoma napredujte v družbi izkušenega partnerja
  faq:
    - q: Ali lahko za divjo vodo uporabim običajen SUP?
      a: Ni priporočljivo. Standardnim SUP manjka odpornost na udarce in na skalah se lahko razslojijo. Večkomorna varnost je za rečna okolja ključna.
    - q: Kateri PSI za SUP na divji vodi?
      a: 15+ PSI za največjo togost. Trša deska se od skal odbija bolje kot premalo napihnjena, ki se prilagaja oviram.
    - q: Ali za SUP na divji vodi potrebujem posebne veslalne veščine?
      a: Da. Branje reke, zavoji v zavetrje, prečenje tokov in oporne tehnike so bistvene veščine. Preden se lotite razreda II+, opravite tečaj SUP na divji vodi.

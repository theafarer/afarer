- slug: sup-travel-transport
  category: planning
  title: Vodnik za potovanja s SUP — Letenje in cestna potovanja z napihljivim SUP
  description: Kako potovati z napihljivim SUP z letalom, avtomobilom ali avtododom. Nasveti o letalskih pristojbinah, pakiranju, napihovanju na cilju in vidikih mednarodnih potovanj.
  tldr: SUP izpuščite, zvite in ga spravite v njegov nahrbtnik. Večina letalskih prevoznikov ga sprejme kot oddano prtljago (pod 50 lbs / 50 linear inches). Črpalko in veslo vedno zapakirajte v isto torbo. Prispejte zgodaj, da bo na voljo dodaten čas, če bo zaposleni pri vratih dvomil o velikosti torbe. Pri dolgih potovanjih razmislite o predhodnem pošiljanju.
  problem: Potovanje s SUP se zdi zapleteno — velikostne omejitve letalskih prevoznikov, skrbi glede TSA in vprašanje, kako napihniti desko na oddaljenem cilju, ustvarjajo negotovost.
  solution: Nahrbtniki za SUP znamke afarer so zasnovani tako, da ustrezajo omejitvam za oddano prtljago letalskih prevoznikov. Pakirajte premišljeno, imejte s seboj komplet za popravila in pred odhodom raziščite možnosti napihovanja (marine, kampi z električnimi priključki).
  audience: Veslači, ki načrtujejo potovanja s SUP z letalom, z avtomobilom ali z avtododom.
  steps:
    - Desko popolnoma izpuščite in zvite jo od nosu do repa
    - Zvito desko, črpalko, veslo, varovalno vrvico in plavut spravite v nahrbtnik
    - Preverite velikostne in težnostne omejitve letalskega prevoznika — večina dovoljuje 62 linear inches in 50 lbs
    - Prispejte zgodaj in bodite pripravljeni na ročni pregled torbe
    - V priročni prtljagi imejte komplet za popravila, če se deska med prevozom poškoduje
    - 'Raziščite možnosti napihovanja: električni priključki v kampih za električne črpalke, zračne postaje v marinah'
  faq:
    - q: Ali bo letalski prevoznik sprejel moj nahrbtnik za SUP kot prtljago?
      a: Večina ameriških in evropskih letalskih prevoznikov sprejme nahrbtnike za SUP kot standardno oddano prtljago, če so lažji od 50 lbs in merijo manj kot 62 linear inches. Nizkocenovni prevozniki lahko zaračunajo pristojbine za preveliko prtljago.
    - q: Ali lahko SUP vzamem s seboj kot priročno prtljago?
      a: Ne. Nahrbtniki za SUP presegajo mere priročne prtljage pri vseh letalskih prevoznikih. Nahrbtnik vedno oddajte kot prtljago.
    - q: Kako napihnem SUP na oddaljenem cilju?
      a: Priložena ročna črpalka deluje kjerkoli brez elektrike. Za več udobja prinesite prenosno električno črpalko in poiščite kamps z električnimi priključki ali marine z zračnimi postajami.

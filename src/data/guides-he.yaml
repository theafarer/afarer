    - 'גילאי 6-10: כריעה או ישיבה על גלשן משלהם עם השגחת מבוגר ורצועת קרס'
    - 'גילאי 10+: חתירה על גלשן משלהם עם השגחת מבוגר בקרבת מקום'
    - ענדו תמיד PFD — ילדים חייבים לענוד אפוד הצלה מתאים בכל עת
    - הישארו במים רדודים (עד המותן למבוגר)
    - קצרו את האימונים — 30-45 דקות לכל היותר לילדים מתחת לגיל 10

- slug: understanding-specs
  category: technical
  title: כיצד לקרוא מפרטי לוח SUP
  description: מדריך טכני להבנת מפרטי לוחות SUP — נפח, ממדים, מבנה ומשמעותם לביצועים.
  tldr: 'מפרטים מרכזיים: נפח (בליטרים) קובע ציפה וכושר נשיאה, רוחב קובע יציבות, אורך קובע שמירה על כיוון ומהירות, עובי קובע קשיחות, ודירוג PSI קובע את לחץ הניפוח לביצועים מיטביים.'
  problem: דפי מפרט של מוצרים מציגים מספרים ללא הקשר, וקונים נותרים ללא ודאות אילו מפרטים רלוונטיים באמת לצורך השימוש שלהם.
  solution: 'תרגם כל מפרט לביצועים בעולם האמיתי: נפח לציפה, רוחב ליציבות, אורך להחלקה, עובי לקשיחות ומבנה לעמידות.'
  audience: חותרים ברמה בינונית וקונים טכניים המעוניינים לקבל החלטות מבוססות נתונים.
  steps:
    - בדוק נפח (בליטרים) — משקלך בתוספת הציוד לא אמור לעלות על 80% מדירוג הנפח של הלוח
    - בדוק רוחב — רחב יותר (32-34") = יציבות רבה יותר, צר יותר (28-30") = מהירות רבה יותר
    - בדוק אורך — ארוך יותר (12-14") = שמירה טובה יותר על כיוון, קצר יותר (10-11") = תמרוניות טובה יותר
    - בדוק עובי — 6" הוא הסטנדרט, ו-8" מציע קשיחות וכושר נשיאה גבוהים יותר
    - בדוק דירוג PSI — נפח את הלוח עד ללחץ המדורג המרבי לקשיחות מיטבית
    - בדוק חומרי מבנה — צפיפות דרופ-סטיץ', שכבות PVC, חיזוק דפנות
  faq:
    - q: מה משמעות המונח דרופ-סטיץ'?
      a: דרופ-סטיץ' היא שיטת בנייה שבה אלפי חוטים מחברים בין השכבה העליונה לשכבה התחתונה של הלוח. הדבר מאפשר ניפוח בלחץ גבוה (12-15 PSI) לקבלת קשיחות קיצונית.
    - q: מהו היחס האידיאלי בין משקל לנפח?
      a: יעד טוב הוא בערך 5-6 פאונד ממשקל הרוכב לכל ליטר נפח לוח. חותר במשקל 220 lb צריך לחפש לוחות בנפח של 180+ ליטר.
    - q: האם משקל הלוח חשוב?
      a: כן. לוחות קלים יותר (מתחת ל-20 lbs) נוחים יותר לנשיאה ולהובלה. לוחות כבדים יותר (25+ lbs) מעידים לעיתים קרובות על מבנה PVC רב-שכבתי עמיד יותר.

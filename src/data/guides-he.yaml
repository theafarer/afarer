  tldr: לעולם אל תחרגו מ-80% מכושר הנשיאה המרבי של הגלשן עם משקל הגוף בתוספת הציוד. גלשן בכושר נשיאה של 220 lb מתאים לחותר במשקל 160 lb עם ציוד קל. חריגה מהמגבלה גורמת לקפיצות דולפין, תגובתיות איטית וסיכון מוגבר לנזק.
  problem: חותרים רבים חורגים מכושר הנשיאה של הגלשן שלהם, מה שמוביל לביצועים ירודים, שקיעה וסיכון לנזק לגלשן. יצרנים מציינים מגבלות מרביות אך אינם מסבירים מהם עומסי העבודה הבטוחים.
  solution: חשבו את העומס הכולל שלכם (משקל הגוף + ציוד + מים שנספגים בגלשן) והישארו מתחת ל-80% מכושר הנשיאה המרבי המוצהר. חותרים כבדים יותר זקוקים לגלשנים בעלי נפח גבוה יותר עם כושר נשיאה של 300+ lb.
  audience: חותרים בכל המשקלים, ובמיוחד חותרים כבדים יותר ואלה הנושאים ציוד מסע.
  steps:
    - מצאו את כושר הנשיאה המרבי המודפס על הגלשן שלכם (בדרך כלל ליד השסתום)
    - שקלו את עצמכם ואת כל הציוד כולל משוט, PFD, שקים יבשים, קולר ואביזרים
    - 'חשבו: (העומס הכולל שלכם) ÷ (הכושר המרבי) × 100 = אחוז הניצול של הכושר'
    - שאפו ל-70-80% לביצועים ובטיחות מיטביים
    - אם עברתם את 80%, בחרו גלשן גדול יותר או הפחיתו ציוד
  faq:
    - q: מה קורה אם אני חורג ממגבלת המשקל?
      a: הגלשן רוכב נמוך יותר ויוצר גרר רב יותר. היציבות יורדת, החרטום עלול לשקוע מתחת למים, וליבת הדרופ-סטיץ' נמצאת בסיכון מוגבר לנזק בים סוער.
    - q: האם שני אנשים יכולים לרכוב על SUP אחד?
      a: רק אם המשקל הכולל נשאר מתחת ל-80% מהכושר. רוב גלשני ה-SUP הסטנדרטיים מיועדים לרוכב בודד. רכיבה בשניים דורשת גלשן המדורג במיוחד לשניים.
    - q: האם לגלשני SUP ניפוחים יש כושר נשיאה נמוך יותר מגלשנים קשיחים?
      a: גלשני ניפוח איכותיים עם מבנה דרופ-סטיץ' הם בעלי כושר נשיאה דומה או גבוה יותר מגלשנים קשיחים, הודות לחלוקת הנפח העבה שלהם.

- slug: sup-travel-transport
  category: planning
  title: מדריך טיולים עם SUP — טיסה ונסיעה בכביש עם גלשן SUP מתנפח
  description: כיצד לטייל עם גלשן SUP מתנפח בטיסה, ברכב או בקרוואן. טיפים לדמי חברות תעופה, אריזה, ניפוח ביעד ושיקולים לטיולים בין-לאומיים.
  tldr: יש לרוקן את האוויר, לגלגל ולארוז את הגלשן בתיק הגב שלו. רוב חברות התעופה מקבלות אותו כמטען נבדק (מתחת ל-50 lbs / 50 linear inches). תמיד יש לארוז את המשאבה והמשוט באותו תיק. כדאי להגיע מוקדם כדי לאפשר זמן נוסף אם סוכן השער מטיל ספק בגודל התיק. כדאי לשקול משלוח מראש לטיולים ארוכים.
  problem: טיול עם SUP נראה מסובך — מגבלות הגודל של חברות התעופה, חששות הבידוק הביטחוני והצורך להבין כיצד לנפח את הגלשן ביעד מרוחק יוצרים אי-ודאות.
  solution: תיקי הגב של גלשני afarer SUP תוכננו לעמוד במגבלות המטען הנבדק של חברות התעופה. יש לארוז בצורה אסטרטגית, לשאת ערכת תיקון ולבדוק מראש מיקומי ניפוח (מרינות, חניוני לינה עם חשמל) לפני היציאה.
  audience: חותרים המתכננים טיול SUP בטיסה, ברכב או בקרוואן.
  steps:
    - לרוקן את האוויר לחלוטין ולגלגל את הגלשן מהחרטום אל הירכתיים
    - לארוז בתיק הגב את הגלשן המגולגל, המשאבה, המשוט, רצועת הקרסול והסנפיר
    - לבדוק את מגבלות הגודל והמשקל של חברת התעופה — רובן מתירות 62 linear inches ו-50 lbs
    - להגיע מוקדם ולהיות מוכנים לכך שהתיק ייבדק ידנית
    - לשאת ערכת תיקון בתיק היד למקרה שהגלשן יינזק בדרך
    - 'לברר אפשרויות ניפוח: חיבורי חשמל בחניוני לינה למשאבות חשמליות, תחנות אוויר במרינות'
  faq:
    - q: האם חברת התעופה תקבל את תיק הגב של ה-SUP כמטען?
      a: רוב חברות התעופה בארה"ב ובאירופה מקבלות תיקי גב של SUP כמטען נבדק סטנדרטי אם משקלם מתחת ל-50 lbs ול-62 linear inches. חברות תעופה חסכוניות עשויות לגבות דמי חריגה בגודל.
    - q: האם אוכל לעלות לטיסה עם ה-SUP כמטען יד?
      a: לא. תיקי גב של SUP חורגים מממדי מטען היד בכל חברות התעופה. תמיד יש למסור את התיק כמטען נבדק.
    - q: כיצד אנפח את ה-SUP ביעד מרוחק?
      a: משאבת היד הכלולה פועלת בכל מקום ללא חשמל. לנוחיות נוספת, כדאי להביא משאבה חשמלית ניידת ולחפש חניוני לינה עם חיבורי חשמל או מרינות עם תחנות אוויר.

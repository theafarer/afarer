- slug: sup-maintenance
  category: maintenance
  title: כיצד לנקות ולאחסן את לוח ה-SUP המתנפח שלך
  description: מדריך אחזקה שלב אחר שלב למקסום תוחלת החיים של לוח ה-SUP המתנפח שלך.
  tldr: שטוף במים מתוקים לאחר כל שימוש, יבש היטב לפני האחסון, רוקן את האוויר וגלגל ברופפות (לא בהידוק צבאי), אחסן במקום קריר ויבש הרחק מאור שמש ישיר, ובדוק את התפרים מדי חודש.
  problem: אחסון וניקוי בלתי נאותים הם הגורמים המובילים לכשל מוקדם בלוחות SUP מתנפחים — עובש, נזקי UV והיפרדות תפרים.
  solution: 'שמור על שגרה עקבית לאחר כל יציאה: שטיפה, ייבוש, בדיקה, ריקון אוויר ואחסון. השתמש בסבון עדין ללכלוך עקשן. אין לאחסן את הלוח רטוב או באור שמש ישיר לעולם.'
  audience: כל בעלי לוחות ה-SUP המתנפחים שרוצים שהלוח שלהם יחזיק 5+ שנים.
  steps:
    - שטוף את הלוח במים מתוקים מיד לאחר השימוש, במיוחד לאחר שימוש במי ים
    - נקה בסבון עדין ובספוג רך — הימנע מכימיקלים חזקים או ממכונות שטיפה בלחץ
    - ייבש את הלוח היטב — פתח את השסתום כדי לאפשר למים כלואים לצאת
    - בדוק נזקים — בחן את התפרים, את השסתום ואת פני השטח לאיתור נקבים
    - רוקן את האוויר במלואו — הסר את ליבת השסתום לריקון מלא
    - גלגל את הלוח ברופפות — התחל מהחרטום והימנע מקפלים הדוקים
    - אחסן בתיק הנשיאה במקום קריר ויבש הרחק מאור שמש ישיר
  faq:
    - q: האם אפשר להשאיר את לוח ה-SUP מנופח לכל אורך העונה?
      a: כן, אך השאר אותו הרחק מאור שמש ישיר כשאינו בשימוש. ריקון חלקי (8-10 PSI) מומלץ לאחסון ממושך.
    - q: איך מתקנים נקב?
      a: נקה את האזור, גזור טלאי עם פינות מעוגלות, מרח דבק, לחץ היטב והמתן 24 שעות לפני הניפוח. לוחות afarer כוללים ערכת תיקון.
    - q: באיזו תדירות כדאי לבדוק את השסתום?
      a: מדי חודש. השסתום הוא נקודת הכשל הנפוצה ביותר. בדוק שנעץ השסתום נע בחופשיות ושטבעת האטימה תקינה.

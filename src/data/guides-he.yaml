- slug: sup-fishing
  category: lifestyle
  title: 'מדריך דיג ב-SUP: כיצד לדוג מגלשן חתירה'
  description: כל מה שצריך לדעת על דיג מגלשן חתירה — הכנת ציוד, טיפים ליציבות וטכניקות.
  tldr: דיג ב-SUP מציע גישה שקטה, גישה למים רדודים והטלת חכה בזווית של 360 מעלות. השתמשו בגלשן רחב ויציב (34"+), התקינו מחזיקי חכות והשתמשו בקופסת קירור או בארגז כסיפון ציוד. עגנו בתנאי רוח. ענדו תמיד PFD.
  problem: סירות דיג סטנדרטיות יקרות לתחזוקה ואינן יכולות להגיע למים רדודים. דיג ב-SUP פותר זאת בכך שהוא מציע פלטפורמת דיג ניידת למים רדודים, אך דורש התאמות ציוד ספציפיות.
  solution: ציידו גלשן SUP יציב במחזיקי חכות, ארגז ציוד ומערכת עיגון. נצלו את ניידות הגלשן כדי להגיע לנקודות דיג מרוחקות שסירות אינן יכולות להגיע אליהן.
  audience: דייגים הרוצים לדוג במים רדודים, במקומות מרוחקים, או המעדיפים פלטפורמת דיג קלת משקל וניידת.
  steps:
    - בחרו גלשן רחב (34"+) עם כושר נשיאה גבוה לציוד
    - התקינו מחזיקי חכות על הסיפון באמצעות מערכות מותאמות למסילות או מערכות רצועות
    - השתמשו בארגז עמיד למים או בקופסת קירור קשורה לסיפון הקדמי לציוד הדיג
    - הביאו עוגן קטן או מוט עיגון לתנאי רוח
    - ענדו PFD עם כיסים לכלים ולטלפון
    - תרגלו הטלת חכה מתנוחת כריעה לפני שתעמדו
  faq:
    - q: האם אפשר לעמוד ולדוג על גלשן SUP?
      a: כן. גלשן ברוחב 34"+ מספק יציבות מספקת לעמידה ולהטלת חכה. תרגלו קודם על מים רגועים.
    - q: אילו דגים אפשר לדוג מגלשן SUP?

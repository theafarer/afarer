  title: מדריך למידות SUP — כיצד לבחור את ממדי הגלשן הנכונים
  description: מדריך מלא למידות SUP העוסק בהמלצות על אורך, רוחב ועובי בהתאם למשקלכם, גובהכם, רמת המיומנות וסגנון החתירה.
  tldr: מתחילים זקוקים לגלשנים רחבים יותר (32-34") ליציבות. חותרים כבדים יותר זקוקים לגלשנים ארוכים יותר (11'+) עם נפח גבוה יותר. טיולים דורשים גוף ארוך יותר (12'+). יוגה דורשת רוחב נוסף (34"+). בדקו תמיד את כושר הנשיאה — משקלכם בתוספת הציוד לא אמור לעלות על 80% מהמגבלה.
  problem: בחירת מידת SUP שגויה מובילה ליציבות ירודה, מעקב איטי וחוויית חתירה מתסכלת. רוב הקונים בפעם הראשונה בוחרים גלשן שנראה טוב מבלי לשקול כיצד הממדים משפיעים על הביצועים.
  solution: 'התאימו את אורך הגלשן, רוחבו ועוביו למשקלכם, לרמת המיומנות ולשימוש העיקרי. השתמשו במחשבון המידות שלנו: חברו את משקלכם + משקל הציוד, ובחרו גלשן עם מרווח של לפחות 20% מעל סך זה.'
  audience: קוני SUP בפעם הראשונה, חותרים המשדרגים לגלשן מתמחה, וכל מי שאינו בטוח לגבי מידות.
  steps:
    - שקלו את עצמכם עם כל הציוד שאתם נושאים (משוט, PFD, שק יבש)
    - הוסיפו 20% מרווח בטיחות כדי למצוא את כושר הנשיאה המינימלי
    - 'בחרו רוחב לפי רמת מיומנות: 32-34" למתחילים, 30-32" לביניים, 28-30" למתקדמים'
    - 'בחרו אורך לפי שימוש: 10''6"-11''6" רב-שימושי, 12''-14'' לטיולים, 9''-10'' למים לבנים'
    - 'אמתו את העובי: 6" סטנדרטי, 4" לביצועים, 5" רב-שימושי'
    - בדקו את טווח ה-PSI המומלץ לגלשן שלכם לקשיחות מיטבית

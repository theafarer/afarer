    - סמנו את הדליפה בעט או בנייר דבק
    - נקו את האזור סביב הדליפה באלכוהול איזופרופילי — לפחות 2 אינץ' סביב הנזק
    - חספספו את המשטח בנייר לטיש עדין להדבקה טובה יותר

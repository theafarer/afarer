  tldr: נקבים קטנים (מתחת ל-1/4") ניתנים לתיקון באמצעות ערכת הטלאים הכלולה. נקו את האזור, מרחו דבק PVC, הצמידו את הטלאי והמתינו 24 שעות. דליפות שסתום דורשות בדרך כלל החלפת O-ring. קרעים גדולים או היפרדות תפרים דורשים שירות מקצועי.
  problem: נקבים קטנים ובעיות שסתום נפוצים אך קלים לתיקון. ללא טכניקת תיקון נכונה, משתמשים משלמים יתר על המידה על שירות מקצועי או מחמירים את הנזק.
  solution: זהו את סוג הנזק — נקב, דליפת שסתום או בעיית תפר — ויישמו את שיטת התיקון המתאימה. רוב התיקונים אורכים 30 דקות בתוספת זמן התייבשות.

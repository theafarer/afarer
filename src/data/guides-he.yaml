  title: 'כושר SUP: אימון גוף מלא על המים'
  description: כיצד חתירה בעמידה על גלשן מפתחת כוח ליבה, שיווי משקל וכושר קרדיווסקולרי.
  tldr: SUP מערב את הליבה, הרגליים, הגב והכתפיים בכל חתירה. אימון של שעה שורף 300-500 קלוריות. חתירה נגד הרוח או הזרם מכפילה את העצימות. יוגת SUP מוסיפה עבודת גמישות ושיווי משקל.
  problem: רבים רואים בחתירה על גלשן פעילות פנאי בלבד ולא כלי כושר לגיטימי, ומפספסים את הפוטנציאל שלה לאימון כל הגוף.
  solution: 'תכננו אימוני SUP עם יעדי כושר ספציפיים: חתירת סיבולת לאימון קרדיו, ספרינטים במרווחים לכוח, יוגת SUP לגמישות וחתירת מרחקים לסיבולת שרירית.'
  audience: חובבי כושר המחפשים אימון גוף מלא עם השפעה נמוכה על המפרקים ומעורבות גבוהה.
  steps:
    - חימום ביבשה — סיבובי ידיים, תנועות סיבוב של הגו והנפות רגליים במשך 5 דקות
    - התחילו עם 10 דקות של חתירה רציפה בעצימות בינונית
    - התקדמו לאימון מרווחים — 2 דקות חתירה קשה, 2 דקות התאוששות קלה
    - שלבו תנוחות יוגת SUP — כלב הפוך, לוחם II ותנוחת העץ על הגלשן
    - סיום בחתירה עדינה ומתיחות סטטיות על הגלשן
  faq:
    - q: האם SUP עדיף על ריצה לכושר?
      a: SUP מספק יתרונות קרדיווסקולריים דומים עם השפעה נמוכה יותר על המפרקים. הוא גם מערב את פלג הגוף העליון והליבה יותר מריצה.
    - q: כמה קלוריות שורף SUP?
      a: כ-300-500 קלוריות לשעה בעצימות בינונית. חתירה תחרותית או חתירה נגד הרוח יכולה לשרוף 600-800 קלוריות לשעה.
    - q: האם אפשר לפתח שרירים באמצעות SUP?
      a: כן. חתירה מפתחת את שרירי הכתפיים, הגב והליבה. שמירה על שיווי המשקל מערבת את הרגליים ואת שרירי הייצוב. מדובר באימון התנגדות לכל הגוף.

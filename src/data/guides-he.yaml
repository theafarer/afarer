  title: מדריך ניפוח SUP — PSI מיטבי לביצועים ולבטיחות
  description: 'מדריך מלא ללחץ הניפוח של SUP: טווחי PSI מומלצים, כיצד הלחץ משפיע על הביצועים, וטיפים לשימוש נכון במשאבה שלכם.'
  tldr: נפחו ל-12-15 PSI עבור רוב גלשני ה-SUP הניפוחים. לחץ גבוה יותר = קשיחות רבה יותר אך ניפוח איטי יותר. לחץ נמוך יותר = תחושה רכה יותר אך גמישות רבה יותר. לעולם אל תחרגו מה-PSI המרבי המודפס על הגלשן שלכם. השתמשו במשאבה עם מד לחץ מדויק. אוויר קר מפחית את הלחץ, שמש חמה מגדילה אותו.
  problem: גלשנים שנפוחים פחות מדי מרגישים כבדים וגמישים יתר על המידה. גלשנים שנפוחים מדי מסכנים את התפרים. חותרים רבים מנחשים PSI במקום למדוד במדויק.
  solution: השתמשו במשאבה עם מד לחץ מובנה. שאפו ל-15 PSI לקשיחות מרבית. בדקו את הלחץ לפני כל יציאה למים — שינויי טמפרטורה משפיעים על PSI באופן משמעותי.
  audience: כל בעלי גלשני ה-SUP הניפוחים.
  steps:
    - בדקו את טווח ה-PSI המומלץ המודפס על הגלשן שלכם ליד השסתום
    - השתמשו במשאבה הדו-פעימה כדי לנפח עד אמצע הטווח המומלץ
    - עברו למצב פעולה בודדת ל-3-4 PSI האחרונים לשליטה מדויקת יותר
    - בדקו את הלחץ עם המד — מדים אנלוגיים אמינים יותר ממדים דיגיטליים
    - 'כוונו לפי התנאים: PSI גבוה יותר לטיולים/תחרויות, PSI נמוך יותר למים לבנים/להורדות למים באזור סלעי'
    - בדקו שוב את הלחץ לאחר שהגלשן נח 10 דקות — שיווי משקל תרמי משנה את ה-PSI
  faq:
    - q: האם אוכל לנפח את ה-SUP שלי יתר על המידה?
      a: כן. חריגה מה-PSI המרבי המדורג (בדרך כלל 15-18 PSI) עלולה לנתק תפרים ולפגוע בליבת הדרופ-סטיץ'. הישארו תמיד בטווח המודפס.
    - q: האם הטמפרטורה משפיעה על PSI?
      a: באופן משמעותי. גלשן שנופח ל-15 PSI ב-70°F עשוי להגיע ל-18 PSI בשמש ישירה ב-95°F. מים קרים עלולים להוריד את הלחץ ל-12 PSI. בדקו את הלחץ לאחר שינויים סביבתיים.
    - q: איזה PSI מתאים למתחילים?
      a: 12-13 PSI ללמידה מספקים פלטפורמה רכה מעט יותר שסלחנית יותר לנפילות. העלו ל-15 PSI ככל שהמיומנות משתפרת.

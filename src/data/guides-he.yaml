    - נקו בסבון עדין ובספוג רך — לעולם לא בכימיקלים חזקים או במכונות שטיפה בלחץ
    - ייבשו את הגלשן במלואו בחוץ לפני ריקון האוויר (פתחו את השסתום כדי לאפשר ללחות הפנימית לצאת)
    - רוקנו את האוויר במלואו, גלגלו מהחרטום לכיוון הירכתיים כדי להוציא את האוויר שנותר
    - נגבו את התיק עד לייבוש מלא לפני שאתם מאחסנים את הגלשן בפנים
    - אחסנו בארון קריר וחשוך או מתחת למיטה — לעולם לא בשמש ישירה, במכונית חמה או במחסן קפוא
  faq:
    - q: האם אוכל להשאיר את ה-SUP שלי מנופח לכל אורך העונה?
      a: עדיף לרוקן את האוויר כאשר אינו בשימוש לתקופות ממושכות. מאמץ PSI מתמיד מאיץ עייפות חומרים. רוקנו את האוויר בין היציאות אם האחסון נמשך יותר מ-2 שבועות.
    - q: איך מסירים עובש מה-SUP שלי?
      a: ערבבו סבון עדין עם מים פושרים ומעט חומץ לבן. שפשפו בעדינות עם מברשת רכה. שטפו היטב וייבשו בצל. הימנעו מאקונומיקה, שכן היא פוגעת ב-PVC.
    - q: האם אוכל לאחסן את ה-SUP שלי בחניה?
      a: רק אם החניה נשארת בין 50-80°F לכל אורך השנה. עליות גג וחניות ללא מיזוג אוויר חשופות לקיצוניות טמפרטורות הפוגעות בליבות הדרופ-סטיץ'.

    - q: כיצד יודעים שהמשוט באורך הנכון?
      a: העמידו את המשוט אנכית לצידכם — הידית צריכה להגיע לשורש כף היד כשהיד מורמת מעל הראש.
    - q: האם כדאי לרכוש משוט חד-חלקי או משוט מתכוונן?
      a: משוטים מתכווננים טובים לשימוש משותף ולנסיעות. משוטים חד-חלקיים קלים, נוקשים ויעילים יותר לשימוש קבוע.

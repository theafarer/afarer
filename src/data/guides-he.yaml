    - q: איך אדע אם SUP קטן מדי בשבילי?
      a: אם הגלשן יושב נמוך במים, מגיב בכבדות, או שהחרטום שוקע בקלות בעת החתירה, סביר שהוא קטן מדי למשקלכם.

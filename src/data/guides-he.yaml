- slug: sup-storage-winter-care
  category: maintenance
  title: אחסון SUP וטיפול חורפי — האריכו את חיי הגלשן שלכם
  description: כיצד לאחסן, לנקות ולהכין לחורף כראוי את גלשן ה-SUP הניפוח שלכם. הימנעו מעובש, נזקי UV ובלאי חומרים באמצעות טיפול נכון.
  tldr: נקו במים מתוקים לאחר כל שימוש. יבשו היטב לפני האחסון. רוקנו את האוויר ואחסנו במקום קריר וחשוך הרחק משמש ישירה ומטמפרטורות קיצוניות. לעולם אל תאחסנו מנופח או במכונית חמה. מרחו מגן UV מדי פעם.
  problem: אחסון לקוי הוא הגורם המוביל לכשל מוקדם של SUP — עובש, התפרקות חומרים, ניתוק שכבות ונזק לשסתום מחום או מקור.
  solution: 'פעלו לפי שגרת טיפול בת 3 שלבים: שטפו לאחר כל יציאה למים, יבשו היטב לפני האחסון, ואחסנו מרוקן בסביבה עם בקרת טמפרטורה בין 50-80°F (10-27°C).'
  audience: כל בעלי ה-SUP שרוצים שהגלשן שלהם יחזיק מעמד 5+ שנים.
  steps:

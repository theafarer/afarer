  title: תכנון טיול SUP של כמה ימים
  description: כיצד מתכננים ומבצעים טיול חתירה של כמה ימים — תכנון מסלול, אריזת ציוד, לינה בשטח ובטיחות.
  tldr: תכננו 10-15 מיילים ליום. ארזו את הציוד בשקיות יבשות עמידות למים, חלקו את המשקל באופן שווה ותרגלו טעינת גלשן לפני הטיול. מסרו תוכנית שיט. קחו מים, מזון, מחסה, אמצעי ניווט ואמצעי תקשורת.
  problem: טיולים של כמה ימים נכשלים בגלל אריזת יתר, תכנון מסלול לקוי או הערכת חסר של מזג האוויר והזרם — מה שמוביל לתשישות, לכשל ציוד או לתקריות בטיחות.
  solution: 'השתמשו בגישת תכנון שיטתית: בחירת מסלול, רשימת ציוד, תכנון מזון, תדריך בטיחות ותכנון חלופות למקרה חירום.'
  audience: חותרים מנוסים המתכננים את המסע הראשון שלהם בן כמה ימים.
  steps:
    - בחרו מסלול עם אתרי לינה מוסדרים ונקודות יציאה בטוחות במהלכו
    - תכננו 10-15 מיילים ליום בהתחשב ברוח ובזרם
    - בדקו טבלאות גאות ושפל ותחזיות מזג אוויר לכל תקופת הטיול
    - ארזו את הציוד בשקיות יבשות עמידות למים — משקל ציוד כולל של 20-30 lbs
    - חלקו את המשקל באופן שווה — הפריטים הכבדים ביותר במרכז
    - מסרו תוכנית שיט מפורטת לאדם על החוף
    - קחו אמצעי ניווט — מפה מודפסת, מצפן ו-GPS לגיבוי
    - ארזו מחסה לשעת חירום, מזון נוסף וערכת עזרה ראשונה

  solution: השתמשו בגודל הגלשן הנכון לרכיבה משותפת, ודאו שכל ילד עונד PFD מתאים, התחילו במים רדודים וחמימים והפכו את החוויה למהנה באמצעות משחקים ואימונים קצרים.

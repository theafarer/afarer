- slug: sup-maintenance
  category: maintenance
  title: Cómo limpiar y guardar tu SUP hinchable
  description: Guía de mantenimiento paso a paso para alargar la vida útil de tu tabla de SUP hinchable.
  tldr: Enjuaga con agua dulce después de cada uso, seca por completo antes de guardar, desinfla y enrolla sin apretar, guarda en un lugar fresco y seco lejos del sol directo e inspecciona las costuras cada mes.
  problem: El almacenamiento y la limpieza inadecuados son las principales causas de fallos prematuros en los SUP hinchables — moho, daños UV y despegue de costuras.
  solution: 'Sigue una rutina constante tras cada sesión: enjuagar, secar, inspeccionar, desinflar y guardar. Usa jabón suave para la suciedad resistente. Nunca guardes la tabla húmeda ni al sol directo.'
  audience: Todos los propietarios de SUP hinchable que quieren que su tabla dure más de 5 años.
  steps:
    - Enjuaga la tabla con agua dulce justo después de usarla, sobre todo tras el agua salada
    - Limpia con jabón suave y una esponja suave — evita productos agresivos o hidrolimpiadoras
    - Seca la tabla por completo — abre la válvula para que salga el agua atrapada
    - Inspecciona los daños — revisa costuras, válvula y superficie en busca de pinchazos
    - Desinfla por completo — quita el núcleo de la válvula para vaciar todo el aire
    - Enrolla la tabla sin apretar — empieza por el morro, evita pliegues marcados
    - Guárdala en la mochila en un lugar fresco y seco, lejos del sol directo
  faq:
    - q: ¿Puedo dejar mi SUP inflada toda la temporada?
      a: Sí, pero mantenla fuera del sol directo cuando no la uses. Para almacenamientos prolongados se recomienda un desinflado parcial (8-10 PSI).
    - q: ¿Cómo reparo un pinchazo?
      a: Limpia la zona, corta un parche con esquinas redondeadas, aplica adhesivo, presiona con firmeza y espera 24 horas antes de inflar. Las tablas afarer incluyen un kit de reparación.
    - q: ¿Con qué frecuencia debo revisar la válvula?
      a: Una vez al mes. La válvula es el punto de fallo más común. Comprueba que el vástago se mueve libremente y que la junta tórica está intacta.

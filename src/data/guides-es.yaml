- slug: sup-board-materials
  category: technical
  title: 'Materiales de las tablas de SUP — PVC, EPS, epoxi y drop-stitch explicados'
  description: 'Guía técnica de los materiales de construcción del SUP: PVC drop-stitch hinchable frente a tablas rígidas de núcleo EPS. Entiende por qué cada tipo se comporta de forma distinta.'
  tldr: Los SUP hinchables usan PVC drop-stitch con miles de hilos internos para la rigidez. Las tablas rígidas usan núcleo de espuma EPS con casco de epoxi o fibra de vidrio. Los hinchables ganan en portabilidad y durabilidad. Las rígidas ganan en velocidad y sensaciones. La tecnología drop-stitch moderna a 15 PSI iguala la rigidez de las rígidas.
  problem: Los compradores no entienden las diferencias fundamentales de construcción entre hinchables y rígidas, y eso lleva a compras equivocadas.
  solution: 'Ajusta el material a tu uso principal: drop-stitch hinchable para viajar, guardar y durabilidad. EPS/epoxi para carreras, surf y máximo rendimiento.'
  audience: Compradores de SUP que comparan construcción hinchable y rígida.
  steps:
    - 'Drop-stitch hinchable: miles de hilos de poliéster unen las capas superior e inferior, creando una estructura rígida al presurizarla a 12-15 PSI'
    - 'Espuma EPS rígida: núcleo de poliestireno expandido moldeado al diseño del casco, sellado con resina epoxi y capas de fibra de vidrio'
    - 'Ventajas de los hinchables: plegables, casi indestructibles, ligeros de transportar, bordes blandos para la seguridad'
    - 'Ventajas de las rígidas: menos peso total, plataforma más rígida, mejor eficiencia de deslizamiento, más respuesta'
    - 'Opciones híbridas: algunos fabricantes combinan drop-stitch con paneles rígidos para lo mejor de ambos mundos'
  faq:
    - q: ¿Son los SUP hinchables tan rígidos como las rígidas?
      a: A 15 PSI con una construcción drop-stitch de calidad, los hinchables modernos se acercan mucho. La mayoría de palistas recreativos no nota la diferencia. Los de competición notarán la ventaja de la rígida.
    - q: ¿Qué material dura más?
      a: Los SUP hinchables duran 5-10 años con cuidado. Las rígidas duran 10-20 años pero son propensas a grietas, golpes y entradas de agua. Los hinchables resisten mejor el uso diario.
    - q: ¿Es el PVC respetuoso con el medio ambiente?
      a: La producción de PVC tiene impacto ambiental, pero los SUP hinchables duran más (menos reemplazos) y se pliegan más pequeños (menos emisiones de transporte). Recicla siempre las tablas viejas correctamente.

- slug: sup-travel-transport
  category: planning
  title: 'Guía de viaje con SUP — volar y viajar por carretera con un SUP hinchable'
  description: Cómo viajar con un SUP hinchable en avión, coche o autocaravana. Consejos sobre tarifas de aerolíneas, empaquetado, inflado en destino y consideraciones para viajar al extranjero.
  tldr: Desinfla, enrolla y empaca tu SUP en su mochila. La mayoría de aerolíneas la acepta como equipaje facturado (menos de 50 lb / 50 pulgadas lineales). Empaca siempre bomba y pala en la misma mochila. Llega con tiempo por si el personal cuestiona el tamaño de la mochila. Considera enviarla por mensajería en viajes largos.
  problem: Viajar con un SUP parece complicado — límites de tamaño de las aerolíneas, controles de seguridad y cómo inflar en un destino remoto generan incertidumbre.
  solution: Las mochilas de SUP de Afarer están diseñadas para cumplir los límites de equipaje facturado. Empaca con estrategia, lleva un kit de reparación e investiga dónde inflar (puertos deportivos, campings con enchufes) antes de salir.
  audience: Palistas que planean viajar con SUP en avión, coche o autocaravana.
  steps:
    - Desinfla por completo y enrolla la tabla del morro a la popa
    - Empaca la tabla enrollada, bomba, pala, leash y aleta en la mochila
    - Comprueba los límites de tamaño y peso de la aerolínea — la mayoría permite 62 pulgadas lineales y 50 lb
    - Llega pronto y prepárate para que revisen la mochila a mano
    - Lleva un kit de reparación en tu equipaje de mano por si la tabla sufre daños en tránsito
    - 'Investiga opciones de inflado: tomas eléctricas en campings para bombas eléctricas, estaciones de aire en puertos'
  faq:
    - q: ¿Aceptarán las aerolíneas mi mochila de SUP como equipaje?
      a: La mayoría de aerolíneas de EE. UU. y Europa aceptan mochilas de SUP como equipaje facturado estándar si pesan menos de 50 lb y miden menos de 62 pulgadas lineales. Las de bajo coste pueden cobrar recargos por tamaño.
    - q: ¿Puedo llevar mi SUP como equipaje de mano?
      a: No. Las mochilas de SUP superan las dimensiones de cabina en todas las aerolíneas. Factúrala siempre.
    - q: ¿Cómo inflo mi SUP en un destino remoto?
      a: La bomba manual incluida funciona en cualquier lugar sin electricidad. Por comodidad, lleva una bomba eléctrica portátil y busca campings con tomas o puertos con estaciones de aire.

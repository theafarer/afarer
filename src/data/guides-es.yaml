- slug: weather-conditions
  category: safety
  title: Entender las condiciones meteorológicas para el paddle surf
  description: Aprende a leer viento, olas, mareas y patrones del tiempo para tomar decisiones seguras en el agua.
  tldr: 'Comprueba tres cosas antes de cada salida: velocidad del viento (menos de 10 mph para principiantes), altura del oleaje (menos de 1 pie para principiantes) y temperatura del agua (vístete para el agua, no para el aire). El viento de tierra es peligroso a cualquier nivel.'
  problem: La mayoría de accidentes relacionados con el tiempo ocurre porque los palistas evalúan mal las condiciones — miran la temperatura del aire pero no la del agua, o no entienden que el viento de tierra puede arrastrarlos mar adentro.
  solution: 'Usa una evaluación meteorológica estructurada antes de salir: dirección y velocidad del viento, periodo y altura del oleaje, estado de la marea y temperatura del agua. Entiende cómo afecta cada factor a tu seguridad.'
  audience: Todos los palistas que navegan en aguas abiertas — lagos, bahías, ríos y mar.
  steps:
    - Comprueba la velocidad y dirección del viento — el viento de tierra (de la costa hacia el mar) es el más peligroso
    - Evalúa el estado del mar — el periodo de las olas importa tanto como su altura
    - Conoce la marea — las corrientes de marea pueden superar tu velocidad de remo
    - Mide la temperatura del agua — por debajo de 60°F/15°C se requiere protección térmica
    - Comprueba la visibilidad — la niebla y la lluvia intensa la reducen y aumentan el riesgo de colisión
    - Entiende los peligros locales — rocas sumergidas, corrientes fuertes, zonas de tráfico de embarcaciones
  faq:
    - q: ¿Qué velocidad de viento es demasiado alta para el SUP?
      a: 'Principiantes: más de 10 mph (8 nudos). Intermedios: más de 15 mph (13 nudos). Avanzados: más de 20 mph (17 nudos). Ante la duda, no salgas.'
    - q: ¿Qué significa el periodo de las olas?
      a: Es el tiempo entre olas sucesivas. Periodos cortos (menos de 8 segundos) significan olas empinadas y desordenadas. Periodos largos (más de 12 segundos) significan marejadas más suaves y predecibles.
    - q: ¿Puedo remar bajo la lluvia?
      a: La lluvia ligera suele ser segura. La lluvia intensa reduce la visibilidad y puede indicar cambios de viento. Las tormentas exigen abandonar el agua de inmediato.

- slug: sup-yoga
  category: lifestyle
  title: 'SUP Yoga: guía completa de paddle y yoga'
  description: Combina paddle surf y yoga para mejorar el equilibrio, la fuerza y la atención plena en el agua.
  tldr: El SUP yoga añade un factor de inestabilidad que aumenta drásticamente la activación del tronco respecto al yoga en tierra. Empieza con posturas básicas sobre una tabla ancha y estable en agua tranquila. Usa una base antideslizante. Nunca practiques SUP yoga solo.
  problem: Las esterillas tradicionales ofrecen una superficie perfectamente estable, eliminando el reto de equilibrio que hace del SUP yoga algo único para la fuerza del tronco y la concentración.
  solution: Usa una tabla extra ancha (34" o más) con base de agarre completa. Practica en agua tranquila y poco profunda. Empieza con posturas de base antes de intentar inversiones.
  audience: Practicantes de yoga y palistas que quieren combinar entrenamiento de equilibrio con atención plena.
  steps:
    - Ancla la tabla en agua poco profunda y tranquila — usa un ancla de arena o amárrala a un embarcadero
    - Empieza con posturas sentadas — sentado fácil, postura de la barca, torsión sentada
    - Pasa a posturas de rodillas — mesa de cuatro, gato-vaca, posición del trueno
    - Avanza a posturas de pie — montaña, guerrero I, guerrero II, árbol
    - Practica posturas de equilibrio — media luna, águila, danzarín
    - Termina con savasana — túmbate sobre la tabla y siente el movimiento del agua
  faq:
    - q: ¿Qué tabla es mejor para SUP yoga?
      a: Una tabla ancha (34" o más) con base de agarre de longitud completa ofrece la plataforma más estable. La SUP Tour 12 combina bien estabilidad y deslizamiento.
    - q: ¿Es peligroso el SUP yoga?
      a: No más que el yoga en tierra si se practica con seguridad. Usa agua tranquila y poco profunda. Lleva leash. Practica acompañado. Evita aguas profundas en las primeras sesiones.
    - q: ¿Necesito equipo especial?
      a: Una tabla ancha y estable, base de agarre completa, leash y chaleco salvavidas (PFD). Algunos practicantes usan una esterilla impermeable para mayor agarre.

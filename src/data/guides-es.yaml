- slug: sup-with-kids
  category: lifestyle
  title: 'SUP con niños: guía familiar completa'
  description: Cómo llevar a los niños al paddle surf con seguridad — edades recomendadas, equipo y actividades.
  tldr: Los niños desde los 6 años pueden ir sobre un SUP con un adulto. Desde los 10 pueden remar en su propia tabla con supervisión. Usa una tabla ancha y estable, lleva siempre chaleco salvavidas, permanece en agua poco profunda y tranquila y limita las sesiones (30-45 minutos como máximo).
  problem: Los padres quieren compartir los deportes acuáticos con sus hijos pero les preocupan la seguridad, el equipo adecuado y mantener a los niños entretenidos.
  solution: Usa el tamaño de tabla adecuado para ir en tándem, asegura que cada niño lleve un chaleco salvavidas bien puesto, empieza en agua poco profunda y templada y hazlo divertido con juegos y sesiones cortas.
  audience: Padres que quieren introducir a sus hijos en el paddle surf.
  steps:
    - 'Edad 4-6: van de pasajeros sobre la tabla de un adulto — sentados delante, sujetos al asa central'
    - 'Edad 6-10: de rodillas o sentados en su propia tabla con supervisión adulta y leash'
    - 'Edad 10+: reman en su propia tabla con un adulto cerca'
    - Lleva siempre chaleco salvavidas — los niños deben llevar uno bien ajustado en todo momento
    - Quédate en agua poco profunda (a la cintura del adulto)
    - Limita las sesiones — 30-45 minutos como máximo para menores de 10 años
    - Hazlo divertido — juegos, buscar peces, practicar a ponerse de pie
  faq:
    - q: ¿A qué edad puede un niño hacer SUP solo?
      a: Hacia los 10-12 años con supervisión, según su nivel de natación y comodidad en el agua. Siempre en condiciones tranquilas y poco profundas.
    - q: ¿Qué tabla es mejor para el SUP con niños?
      a: Una tabla ancha (34" o más) con capacidad de carga alta para ir en tándem. La SUP Explorer 11, con 33" de anchura y 220 lb de capacidad, funciona bien para adulto más niño.
    - q: ¿Qué equipo de seguridad necesitan los niños?
      a: Un chaleco salvavidas certificado CE bien ajustado, leash (sujeto a la tabla del adulto en tándem), protector solar y gorra.

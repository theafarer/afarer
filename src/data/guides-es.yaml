- slug: inflatable-repair
  category: maintenance
  title: Cómo reparar tu SUP hinchable
  description: Guía paso a paso para reparar pinchazos, problemas de válvula y daños en las costuras de los SUP hinchables.
  tldr: Los pinchazos pequeños (menos de 1/4") se reparan con el kit de parches incluido. Limpia la zona, aplica adhesivo de PVC, presiona el parche y espera 24 horas. Las fugas de válvula suelen requerir cambiar la junta tórica. Los desgarros grandes o el despegue de costuras necesitan servicio profesional.
  problem: Los pinchazos pequeños y los problemas de válvula son comunes pero fáciles de arreglar. Sin la técnica correcta, los usuarios pagan de más por un servicio profesional o empeoran el daño.
  solution: Identifica el tipo de daño — pinchazo, fuga de válvula o costura — y aplica el método de reparación adecuado. La mayoría de reparaciones llevan 30 minutos más el tiempo de curado.
  audience: Propietarios de SUP hinchables que quieren resolver reparaciones básicas por sí mismos.
  steps:
    - Localiza la fuga — infla por completo, escucha el aire, palpa con la mano o usa agua con jabón
    - Marca la fuga con un rotulador o cinta
    - Limpia la zona alrededor de la fuga con alcohol isopropílico — al menos 2 pulgadas alrededor del daño
    - Raspa la superficie con lija fina para que el adhesivo agarre mejor
    - Aplica adhesivo de PVC en el parche y en la superficie de la tabla
    - Espera 5 minutos a que el adhesivo se vuelva pegajoso
    - Presiona el parche con firmeza y saca las burbujas con un rodillo o una tarjeta de crédito
    - Deja curar 24 horas antes de inflar a presión completa
  faq:
    - q: ¿Puedo reparar un pinchazo en el agua?
      a: Las reparaciones de emergencia con parche y cinta te permiten volver a la orilla. Las reparaciones completas exigen condiciones secas y 24 horas de curado.
    - q: ¿Cómo arreglo una válvula con fuga?
      a: Quita el núcleo de la válvula con la herramienta incluida, revisa la junta tórica, cámbiala si es necesario y vuelve a enroscar el núcleo bien apretado.
    - q: ¿Qué pegamento debo usar para reparaciones de PVC?
      a: Usa un adhesivo específico para PVC como HH-66 o Clifton. La súper cola normal no adhiere bien en los materiales PVC de los inflables.

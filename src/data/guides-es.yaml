- slug: sup-inflation-psi-guide
  category: technical
  title: 'Guía de inflado del SUP — PSI óptimo para rendimiento y seguridad'
  description: 'Guía completa de la presión de inflado del SUP: rangos de PSI recomendados, cómo afecta la presión al rendimiento y consejos para usar bien la bomba.'
  tldr: Infla a 12-15 PSI en la mayoría de SUP hinchables. Más presión = más rigidez pero inflado más lento. Menos presión = tacto más blando pero más flexión. Nunca superes el PSI máximo impreso en tu tabla. Usa una bomba con manómetro preciso. El aire frío reduce la presión, el sol la aumenta.
  problem: Las tablas poco infladas se sienten perezosas y se flexionan en exceso. Las sobreenfladas arriesgan fallos de costura. Muchos palistas estiman el PSI en lugar de medirlo.
  solution: Usa una bomba con manómetro integrado. Apunta a 15 PSI para máxima rigidez. Comprueba la presión antes de cada sesión — los cambios de temperatura afectan mucho al PSI.
  audience: Todos los propietarios de SUP hinchable.
  steps:
    - Comprueba el rango de PSI recomendado impreso en tu tabla cerca de la válvula
    - Usa la bomba de doble acción para inflar hasta la mitad del rango recomendado
    - Pasa al modo de acción simple para los últimos 3-4 PSI y controlar mejor
    - Comprueba la presión con el manómetro — los analógicos son más fiables que los digitales
    - 'Ajusta según las condiciones: más PSI para touring y carreras, menos para aguas bravas y salidas rocosas'
    - Vuelve a comprobar la presión tras 10 minutos — el equilibrio térmico cambia el PSI
  faq:
    - q: ¿Puedo sobreenflar mi SUP?
      a: Sí. Superar el PSI máximo indicado (normalmente 15-18 PSI) puede despegar las costuras y dañar el núcleo drop-stitch. Mantente siempre dentro del rango impreso.
    - q: ¿Afecta la temperatura al PSI?
      a: Mucho. Una tabla inflada a 15 PSI a 70°F puede llegar a 18 PSI bajo el sol directo a 95°F. El agua fría puede bajar la presión a 12 PSI. Comprueba la presión tras cambios ambientales.
    - q: ¿Qué PSI para principiantes?
      a: 12-13 PSI para aprender da una plataforma algo más blanda y tolerante con las caídas. Sube a 15 PSI a medida que mejora la técnica.

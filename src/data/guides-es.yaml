- slug: sup-fishing
  category: lifestyle
  title: 'Guía de pesca en SUP: cómo pescar desde una tabla de paddle'
  description: Todo lo que necesitas saber sobre pescar desde una tabla de paddle — preparación del equipo, consejos de estabilidad y técnicas.
  tldr: La pesca en SUP ofrece aproximación silenciosa, acceso a aguas someras y lances de 360 grados. Usa una tabla ancha y estable (34" o más), monta portacañas y usa una nevera o caja como cubierta de equipo. Ancla cuando haya viento. Lleva siempre chaleco salvavidas.
  problem: Las embarcaciones de pesca convencionales son caras de mantener y no acceden a aguas someras. La pesca en SUP lo resuelve con una plataforma portátil para aguas poco profundas, pero exige adaptaciones específicas del equipo.
  solution: Equipa un SUP estable con portacañas, una caja de equipo y un sistema de anclaje. Aprovecha la portabilidad de la tabla para llegar a pesqueros remotos inaccesibles en barco.
  audience: Pescadores que quieren pescar en aguas someras, lugares remotos o prefieren una plataforma de pesca ligera y portátil.
  steps:
    - Elige una tabla ancha (34" o más) con gran capacidad de carga para el equipo
    - Instala portacañas en la cubierta con sistemas de riel o correas
    - Usa una caja impermeable o nevera atada a la cubierta delantera para los señuelos
    - Lleva un ancla pequeña o estaca para los días con viento
    - Usa un chaleco salvavidas con bolsillos para herramientas y teléfono
    - Practica el lance desde posición de rodillas antes de pescar de pie
  faq:
    - q: ¿Puedo pescar de pie en un SUP?
      a: Sí. Una tabla de 34" o más de anchura da estabilidad suficiente para lanzar de pie. Practica primero en agua tranquila.
    - q: ¿Qué peces puedo pescar desde un SUP?
      a: Los SUP son excelentes para la lubina en lagos, la corvina roja en llanuras fangosas, la trucha en ríos y especies costeras en bahías y estuarios.
    - q: ¿Cómo saco un pez desde un SUP?
      a: Ponte de rodillas para ganar estabilidad. Usa una red o una pinza de labios. Mantén el pez bajo para no caerte. Suelta o guarda en la nevera.

- slug: sup-fitness
  category: lifestyle
  title: 'SUP Fitness: entrenamiento de cuerpo completo en el agua'
  description: Cómo el paddle surf desarrolla la fuerza del tronco, el equilibrio y la condición cardiovascular.
  tldr: El SUP activa tronco, piernas, espalda y hombros en cada golpe. Una sesión de una hora quema 300-500 calorías. Remar contra viento o corriente duplica la intensidad. El SUP yoga añade flexibilidad y trabajo de equilibrio.
  problem: Mucha gente ve el paddle surf como una actividad casual y no como una herramienta de fitness legítima, desaprovechando su potencial de acondicionamiento de todo el cuerpo.
  solution: 'Estructura las sesiones de SUP con objetivos concretos: remo de resistencia para cardio, sprints interválicos para potencia, SUP yoga para flexibilidad y remo de distancia para resistencia muscular.'
  audience: Entusiastas del fitness que buscan un entrenamiento completo de bajo impacto y alta implicación.
  steps:
    - Calienta en tierra — círculos con los brazos, rotaciones de tronco y balanceos de pierna durante 5 minutos
    - Empieza con 10 minutos de remo continuo a intensidad moderada
    - Pasa al entrenamiento por intervalos — 2 minutos de remo intenso, 2 minutos de recuperación suave
    - Incorpora posturas de SUP yoga — perro boca abajo, guerrero II y árbol sobre la tabla
    - Termina con remo suave y estiramientos estáticos sobre la tabla
  faq:
    - q: ¿Es el SUP mejor que correr para ponerse en forma?
      a: El SUP ofrece beneficios cardiovasculares comparables con menor impacto articular. Además, trabaja más el tren superior y el tronco que la carrera.
    - q: ¿Cuántas calorías quema el SUP?
      a: Aproximadamente 300-500 calorías por hora a intensidad moderada. Competir o remar contra el viento puede quemar 600-800 calorías por hora.
    - q: ¿Puedo ganar músculo con el SUP?
      a: Sí. Remar desarrolla los hombros, la espalda y el tronco. Mantener el equilibrio activa piernas y músculos estabilizadores. Es un entrenamiento de resistencia de cuerpo completo.

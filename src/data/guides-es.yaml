- slug: multi-day-trip
  category: planning
  title: Planificar un viaje de SUP de varios días
  description: Cómo planificar y ejecutar un viaje de remo de varios días — planificación de ruta, equipaje, acampada y seguridad.
  tldr: Planifica 10-15 millas por día. Empaca el equipo en bolsas secas impermeables, reparte el peso de forma uniforme y practica la carga antes del viaje. Deja un plan de salida. Lleva agua, comida, refugio, navegación y comunicación.
  problem: Los viajes de varios días fracasan por exceso de equipaje, mala planificación de la ruta o subestimar el tiempo y la corriente — lo que lleva a agotamiento, fallos de equipo o incidentes de seguridad.
  solution: 'Usa un enfoque de planificación sistemático: selección de ruta, lista de equipo, planificación de comida, briefing de seguridad y planes de contingencia.'
  audience: Palistas experimentados que preparan su primera expedición de varios días.
  steps:
    - Elige una ruta con zonas de acampada establecidas y puntos de salida
    - Planifica 10-15 millas diarias teniendo en cuenta viento y corriente
    - Consulta tablas de marea y pronósticos para toda la ventana del viaje
    - Empaca el equipo en bolsas secas impermeables — 20-30 lb de peso total
    - Reparte el peso de forma uniforme — lo más pesado en el centro
    - Deja un plan de salida detallado con alguien en tierra
    - Lleva navegación — carta en papel, brújula y GPS de respaldo
    - Empaca refugio de emergencia, comida extra y botiquín
  faq:
    - q: ¿Cuál es la distancia diaria ideal?
      a: 10-15 millas por día para palistas experimentados. Los principiantes deben planificar 5-8 millas. Reserva siempre tiempo de margen por el tiempo.
    - q: ¿Cuánta agua debo llevar?
      a: 1 galón por persona y día. En condiciones de calor, 1,5 galones. Lleva un filtro de agua o pastillas potabilizadoras para rellenar.
    - q: ¿Cuál es el elemento de seguridad más importante?
      a: La comunicación. Una radio VHF o un mensajero satelital pueden salvar la vida en una emergencia. Los teléfonos móviles no son fiables en zonas remotas.

- slug: beginner-guide
  category: tutorial
  title: Guía para principiantes de paddle surf
  description: Todo lo que necesitas saber antes de tu primera sesión de paddle surf — desde la preparación del equipo hasta las técnicas básicas de remo.
  tldr: Empieza en agua tranquila y plana con una tabla ancha y estable. Infla a 12-15 PSI, ajusta el leash y usa la longitud correcta de la pala (6-8" más alta que tu estatura). Coloca los pies a la anchura de los hombros, flexiona un poco las rodillas y mira al horizonte.
  problem: Los palistas novatos suelen saltarse lo fundamental — pala mal ajustada, mala postura o elección de aguas agitadas — lo que provoca caídas, frustración y desánimo.
  solution: 'Sigue un plan estructurado para la primera sesión: elige agua tranquila, prepara el equipo correctamente, practica de rodillas antes de ponerte de pie y domina el golpe de pala hacia delante antes de intentar giros.'
  audience: Principiantes absolutos que nunca han hecho paddle surf.
  steps:
    - Elige agua plana y tranquila sin tráfico de embarcaciones — un lago pequeño o una bahía resguardada es ideal
    - Infla tu tabla a 12-15 PSI con la bomba de doble acción
    - Sujeta el leash de espiral al tobillo o a la pantorrilla, nunca al asa de la tabla
    - Inserta la aleta y aprieta el tornillo
    - Ajusta la longitud de la pala — debe superar tu estatura en 6-8 pulgadas
    - Empieza de rodillas sobre la tabla y da unos golpes de pala para notar el equilibrio
    - Levántate apoyando un pie y luego el otro, pies a la anchura de los hombros, rodillas flexionadas
    - Mira al horizonte, no a los pies — tu tabla va donde miras
  faq:
    - q: ¿Qué ropa usar para el paddle surf?
      a: Ropa deportiva de secado rápido, chaleco salvavidas, protector solar y gorra. En agua fría, usa traje de neopreno. Lleva siempre leash y un teléfono en funda impermeable.
    - q: ¿Cómo vuelvo a subirme a la tabla si me caigo?
      a: Mantén la calma. Nada hasta la tabla, sujeta el asa central y bate las piernas mientras te impulsas sobre la tabla en un solo movimiento. Vuelve primero a la posición de rodillas y luego levántate.
    - q: ¿Qué condiciones de viento son seguras?
      a: 'Principiante: viento por debajo de 10 mph (5 nudos). Si el viento sopla hacia mar abierto, no salgas. Consulta el pronóstico y recuerda que el viento de tierra es peligroso.'

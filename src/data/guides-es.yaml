- slug: sup-for-pet-owners
  category: lifestyle
  title: 'SUP con perros — guía completa de paddle surf con tu mascota'
  description: 'Todo lo que necesitas saber para hacer paddle surf con perros: pasos de adiestramiento, equipo de seguridad, elección de tabla y consejos para una sesión exitosa con tu amigo peludo.'
  tldr: Empieza con una tabla ancha y estable (34" o más). Usa chaleco para mascota, base antideslizante y correa corta. Adiestra primero en tierra, luego en agua poco profunda. Limita las sesiones (20-30 minutos). Lleva agua dulce y toalla. Nunca fuerces a tu perro si parece ansioso.
  problem: Hacer paddle surf con perros puede ser estresante sin la preparación adecuada — los perros pueden asustarse, tirarse al agua o arañar la superficie de la tabla.
  solution: Usa una tabla ancha y estable con cubierta de EVA blanda. Acostumbra a tu perro gradualmente. Lleva equipo de seguridad que incluya chaleco para perro y correa corta segura para SUP.
  audience: Dueños de perros que quieren hacer SUP con sus mascotas.
  steps:
    - 'Empieza con una tabla ancha (34" o más, con capacidad alta para ti y el perro)'
    - Consigue un chaleco para perro bien ajustado con asa
    - 'Practica en tierra: haz que tu perro se siente sobre la tabla desinflada y luego sobre la inflada en el césped'
    - 'Pasa a agua poco profunda: arrodíllate sobre la tabla con tu perro y da unos golpes de pala'
    - 'Limita las sesiones: 20-30 minutos como máximo en las primeras salidas'
    - Lleva siempre agua dulce, un cuenco plegable y una toalla para tu perro
  faq:
    - q: ¿Qué tabla de SUP es mejor para perros?
      a: 'Una tabla ancha y estable con cubierta de EVA blanda que dé agarre a las patas. La Tropical Breeze Island Escape, con más de 34" de anchura, es ideal para remar con perros.'
    - q: ¿Mi perro necesita chaleco salvavidas?
      a: Sí, incluso los buenos nadadores. Un chaleco con asa facilita subir de nuevo al perro a la tabla si se cae.
    - q: ¿Cómo evito que mi perro arañe la tabla?
      a: Mantén sus uñas cortas. La cubierta de EVA protege el PVC. Pon una toalla o mantita sobre la cubierta para mayor protección.

- slug: paddling-techniques
  category: tutorial
  title: Técnicas esenciales de remo en SUP
  description: Domina el golpe hacia delante, el golpe de barrido y el giro cruzado para remar con eficacia en cualquier condición.
  tldr: El golpe hacia delante usa el tronco, no los brazos. El golpe de barrido gira la tabla. El giro cruzado es el pivote más eficiente. Mantén la pala vertical y sumerge la hoja por completo para la máxima transferencia de potencia.
  problem: La mayoría de palistas usa golpes dominados por los brazos que desperdician energía y causan fatiga de hombro. La mala técnica también dificulta el control con viento y oleaje.
  solution: Aprende tres golpes esenciales — hacia delante, barrido y giro cruzado — con la mecánica corporal correcta. Practica cada uno en agua tranquila antes de pasar a condiciones exigentes.
  audience: Palistas que quieren remar más tiempo, más rápido y con menos fatiga.
  steps:
    - 'Golpe hacia delante: alcanza hacia delante, planta la hoja por completo, tira hacia atrás rotando el tronco (no con los brazos) y sácala a la altura del tobillo'
    - 'Golpe de barrido: alcanza hacia delante por el borde, barre la hoja en un arco amplio hacia la popa y gira la tabla hacia el lado contrario de la pala'
    - 'Giro cruzado: coloca la pala al otro lado de la tabla sin cambiar las manos y tira hacia la popa'
    - 'Apoyo: usa un apoyo bajo para mantener la estabilidad en el oleaje — golpea la superficie del agua con la hoja plana'
    - 'Golpe de aproximación: extiende la pala hacia el lado y atrae la tabla lateralmente hacia la pala'
  faq:
    - q: ¿Cómo remo en línea recta?
      a: Usa una longitud de golpe constante en ambos lados. Cambia de lado cada 5-10 golpes. Mira un punto fijo del horizonte como referencia.
    - q: ¿Debo flexionar las rodillas?
      a: Sí. Mantén las rodillas ligeramente flexionadas como amortiguadores. Las rodillas bloqueadas transmiten cada rizado al tronco y reducen la estabilidad.
    - q: ¿Cómo remo contra el viento?
      a: Baja el centro de gravedad, usa golpes más cortos y rápidos y mantente cerca de la orilla, donde el viento suele ser menor. Si el viento es demasiado fuerte, no salgas.

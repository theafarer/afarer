- slug: choosing-paddle
  category: buying-guide
  title: Cómo elegir la pala de SUP adecuada
  description: Guía de materiales de pala, formas de hoja, tipos de mástil y tallas para el SUP.
  tldr: 'Longitud de la pala: las palas de SUP deben superar tu estatura en 6-8". Forma de la hoja: las hojas diedras trazan más rectas, las planas ofrecen más agarre. Mástil: el carbono es el más ligero, la fibra de vidrio la mejor relación calidad-precio, el aluminio el más económico.'
  problem: Usar una pala con tamaño o material equivocados provoca fatiga innecesaria, golpes poco eficientes y sobrecarga articular.
  solution: Ajusta la longitud, la forma de la hoja, el material y la flexibilidad del mástil a tu estilo de remo, tu complexión y tu presupuesto.
  audience: Palistas de SUP que eligen su primera pala o la siguiente.
  steps:
    - 'Mide la altura de la pala — 6-8" más alta que tu estatura para un remo general'
    - 'Elige el material de la hoja — nailon para el presupuesto, fibra de vidrio por su valor, carbono para el rendimiento'
    - 'Elige la forma de la hoja — diedra para un trazado suave, plana para potencia, cuchara para competición'
    - 'Elige el tipo de mástil — recto para uso general, curvado para el SUP de carreras'
    - 'Comprueba la flexibilidad — los mástiles más rígidos transmiten más potencia, los flexibles reducen la sobrecarga articular'
  faq:
    - q: ¿Cuál es el mejor material para una pala?
      a: La fibra de vidrio ofrece el mejor equilibrio entre peso, durabilidad y precio. El carbono es más ligero pero más caro y quebradizo. El nailon es pesado pero prácticamente indestructible.
    - q: ¿Cómo sé si mi pala tiene la longitud correcta?
      a: Coloca la pala verticalmente a tu lado — el asa debe llegar a tu muñeca con el brazo levantado por encima de la cabeza.
    - q: ¿Me conviene una pala de una pieza o ajustable?
      a: Las palas ajustables son buenas para uso compartido y viajes. Las de una pieza son más ligeras, rígidas y eficientes para uso dedicado.

- slug: sup-for-whitewater
  category: buying-guide
  title: 'Guía de SUP para aguas bravas — guía de compra de tablas hinchables para ríos'
  description: 'Cómo elegir un SUP de aguas bravas para descender ríos: tablas más cortas, construcción reforzada, equipo de seguridad y técnicas de remo para rápidos de clase I-III.'
  tldr: "Los SUP de aguas bravas necesitan menos longitud (8-10'), bordes reforzados, más presión (15+ PSI) y múltiples cámaras de aire por seguridad. Usa leash recto de río (no de espiral), lleva casco y chaleco salvavidas, y rema siempre acompañado. Empieza en clase I antes de intentar rápidos mayores."
  problem: Llevar un SUP polivalente estándar a aguas corrientes es peligroso — las tablas normales carecen de la maniobrabilidad, resistencia a impactos y elementos de seguridad que exigen los ríos.
  solution: 'Elige un SUP de aguas bravas específico: corto para agilidad, reforzado contra impactos de roca y con diseño de múltiples cámaras para seguridad.'
  audience: Palistas experimentados que se pasan a los ríos.
  steps:
    - "Elige una tabla de 8-10' para la máxima maniobrabilidad en rápidos"
    - Busca bordes reforzados y PVC de grado militar
    - Elige una tabla con 2 o más cámaras de aire como redundancia ante pinchazos
    - Usa un leash recto de río sujeto a un cinturón de liberación rápida
    - Lleva casco, chaleco salvavidas y calzado de río adecuado
    - Empieza en rápidos de clase I y progresa poco a poco con un compañero con experiencia
  faq:
    - q: ¿Puedo usar un SUP normal en aguas bravas?
      a: No se recomienda. Los SUP estándar carecen de resistencia a impactos y pueden romperse contra las rocas. La seguridad de múltiples cámaras es crítica en ríos.
    - q: ¿Qué presión para el SUP de aguas bravas?
      a: 15 PSI o más para máxima rigidez. Una tabla dura rebota en las rocas mejor que una poco inflada, que se adapta a los obstáculos.
    - q: ¿Necesito técnicas especiales para el SUP de río?
      a: Sí. Leer el río, giros en eddy, travesías en ferry y apoyos son habilidades esenciales. Haz un curso de SUP de aguas bravas antes de intentar clase II o superior.

- slug: sup-accessories-essential
  category: buying-guide
  title: 'Accesorios esenciales de SUP — lo que de verdad necesitas'
  description: 'Guía práctica de accesorios imprescindibles de SUP: chalecos salvavidas, palas, bombas, leashes y kits de mantenimiento. Qué comprar primero y qué dejar pasar.'
  tldr: 'Esenciales: chaleco salvavidas (PFD), leash, bomba, pala, aleta. Muy recomendables: kit de reparación, funda impermeable para teléfono, bolsa de cubierta. Opcionales: bomba eléctrica, traje seco, soporte de nevera. Evita los artículos de novedad que añaden peso sin función.'
  problem: Los nuevos propietarios de SUP se agobian con las opciones de accesorios y compran cosas innecesarias mientras pasan por alto equipo de seguridad crítico.
  solution: 'Prioriza los accesorios en este orden: seguridad (chaleco, leash, silbato), funcionalidad (bomba, pala de repuesto, kit de reparación), comodidad (bolsa de cubierta, funda del teléfono), confort (asiento, soporte de nevera).'
  audience: Nuevos propietarios de SUP que montan su kit de accesorios.
  steps:
    - Compra un chaleco salvavidas homologado CE/USCG que ajuste bien
    - Consigue un leash de espiral adecuado a tu tipo de agua (espiral para aguas planas, recto para ríos)
    - Asegúrate de que tu bomba alcanza 15 PSI y tiene manómetro
    - Añade un kit de reparación con parches de PVC y herramienta de válvula
    - Considera una bolsa seca o funda impermeable para los objetos de valor
    - Añade un soporte de nevera o portacañas para actividades especializadas
  faq:
    - q: ¿De verdad necesito chaleco salvavidas para el SUP?
      a: Sí. Incluso los buenos nadadores pueden lesionarse o agotarse. El chaleco es el elemento de seguridad más importante. Muchas jurisdicciones lo exigen por ley.
    - q: ¿Qué bomba es mejor para los SUP hinchables?
      a: Las bombas manuales de doble acción son el estándar. Las eléctricas ahorran esfuerzo pero necesitan fuente de energía. Usa siempre una con manómetro para evitar el exceso de presión.
    - q: ¿Necesito una pala especial?
      a: La pala de aluminio incluida sirve para empezar. Pasarse a una pala de fibra de vidrio o carbono reduce notablemente la fatiga de brazos en remos largos.

- slug: sup-racing-fitness
  category: buying-guide
  title: 'SUP para competición y fitness — guía de compra de tablas de rendimiento'
  description: Guía para elegir un SUP orientado a carreras, fitness y remo atlético. Especificaciones de tabla, elección de pala y consejos de entrenamiento para palistas competitivos y de fitness.
  tldr: 'Los SUP de carreras miden de 12''6" a 14'' de largo y 23-28" de anchura, con cascos de desplazamiento para máxima velocidad. Los de fitness equilibran velocidad y estabilidad con 11-12'' y 30-32". Ajusta la tabla a tus objetivos y a tu nivel de experiencia.'

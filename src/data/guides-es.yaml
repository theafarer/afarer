- slug: sup-storage-winter-care
  category: maintenance
  title: 'Almacenamiento y cuidado invernal del SUP — alarga la vida de tu tabla'
  description: Cómo guardar, limpiar e invernar correctamente tu tabla de SUP hinchable. Evita moho, daños UV y degradación del material con el cuidado adecuado.
  tldr: Limpia con agua dulce después de cada uso. Seca por completo antes de guardar. Desinfla y guarda en un lugar fresco y oscuro, lejos del sol directo y de temperaturas extremas. Nunca la guardes inflada ni en un coche caliente. Aplica protector UV periódicamente.
  problem: El almacenamiento inadecuado es la principal causa de fallos prematuros del SUP — moho, degradación del material, despegues de costura y daños de válvula por calor o frío.
  solution: 'Sigue una rutina de cuidado en 3 pasos: enjuaga después de cada sesión, seca a fondo antes de guardar y guarda desinflada en un ambiente con temperatura controlada entre 50-80°F (10-27°C).'
  audience: Todos los propietarios de SUP que quieren que su tabla dure más de 5 años.
  steps:
    - Enjuaga tabla, pala y bomba con agua dulce tras cada sesión en agua salada o barrosa
    - Limpia con jabón suave y esponja suave — nunca productos agresivos ni hidrolimpiadoras
    - Seca la tabla por completo al aire libre antes de desinflar (abre la válvula para que escape la humedad interior)
    - Desinfla por completo y enrolla del morro a la popa para expulsar el aire restante
    - Seca la mochila antes de guardar la tabla dentro
    - 'Guárdala en un armario fresco y oscuro o bajo la cama — nunca al sol, en un coche caliente ni en un cobertizo helado'
  faq:
    - q: ¿Puedo dejar mi SUP inflada toda la temporada?
      a: Es mejor desinflarla cuando no se usa por temporadas largas. La presión constante acelera la fatiga del material. Desinfla entre sesiones si vas a guardarla más de 2 semanas.
    - q: ¿Cómo quito el moho de mi SUP?
      a: Mezcla jabón suave con agua tibia y un chorro de vinagre blanco. Frota suavemente con un cepillo blando. Enjuaga bien y seca a la sombra. Evita la lejía, que daña el PVC.
    - q: ¿Puedo guardar mi SUP en un garaje?
      a: Solo si el garaje se mantiene entre 50-80°F todo el año. Los áticos y garajes sin acondicionar sufren extremos de temperatura que dañan los núcleos drop-stitch.

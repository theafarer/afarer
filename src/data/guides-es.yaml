- slug: safety-tips
  category: safety
  title: Consejos de seguridad para deportes acuáticos
  description: Las normas de seguridad esenciales para el paddle surf — desde la revisión del equipo hasta la vigilancia meteorológica.
  tldr: Lleva siempre un chaleco salvavidas certificado CE, comprueba el tiempo y las condiciones del agua antes de salir, lleva medios de comunicación, nunca remes solo en aguas desconocidas y conoce los límites de tu equipo.
  problem: La mayoría de los accidentes acuáticos se debe a una preparación insuficiente — sin chaleco salvavidas, ignorando avisos meteorológicos o usando el equipo por encima de sus límites de diseño.
  solution: 'Adopta una lista de verificación antes de cada salida: revisa el estado del equipo, controla el tiempo y la temperatura del agua, avisa a alguien de tu ruta y lleva siempre flotación adecuada.'
  audience: Todos los palistas y practicantes de deportes acuáticos.
  steps:
    - Comprueba el pronóstico — evita vientos de más de 15 mph y tormentas
    - Verifica la temperatura del agua — el agua fría (<60°F/15°C) exige traje de neopreno o traje seco
    - Inspecciona el equipo — revisa que no haya fugas ni grietas y que el inflado sea correcto
    - Lleva en todo momento un chaleco salvavidas certificado CE
    - Sujeta el leash al tobillo o a la pantorrilla
    - Deja un plan de salida — di a alguien adónde vas y a qué hora volverás
    - Lleva medios de comunicación — funda impermeable para el teléfono o radio VHF
    - Conoce tus límites — mantente dentro de tu nivel y de las capacidades de tu equipo
  faq:
    - q: ¿Necesito chaleco salvavidas en un SUP?
      a: Sí. Muchas jurisdicciones exigen por ley un chaleco salvavidas a bordo de cualquier embarcación, incluido el SUP. Aunque no sea obligatorio, un chaleco certificado CE es un equipo de seguridad esencial.
    - q: ¿Cuál es la lesión más frecuente en los deportes acuáticos?
      a: La inmersión en agua fría y el agotamiento son los riesgos graves más comunes. Vístete siempre según la temperatura del agua, no del aire.
    - q: ¿Cómo sé si las condiciones son seguras?
      a: Usa los pronósticos marítimos. Comprueba la velocidad del viento, la altura del oleaje y la temperatura del agua. Los principiantes deben mantenerse con viento inferior a 10 mph y olas de menos de 1 pie.

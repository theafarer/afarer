- slug: understanding-specs
  category: technical
  title: Cómo leer las especificaciones de una tabla de SUP
  description: Una guía técnica para entender las especificaciones de las tablas de SUP — volumen, dimensiones, construcción y qué significan para el rendimiento.
  tldr: 'Especificaciones clave: el volumen (litros) determina la flotabilidad y la capacidad de carga, la anchura determina la estabilidad, la longitud determina el rumbo y la velocidad, el grosor determina la rigidez, y el índice PSI determina la presión de inflado para un rendimiento óptimo.'
  problem: Las fichas técnicas listan números sin contexto, y los compradores no saben qué especificaciones importan realmente para su caso de uso.
  solution: 'Traduce cada especificación a rendimiento real: volumen para flotar, anchura para estabilidad, longitud para deslizamiento, grosor para rigidez y construcción para durabilidad.'
  audience: Palistas intermedios y compradores técnicos que quieren decidir con datos.
  steps:
    - Comprueba el volumen (litros) — tu peso más el equipo no debe superar el 80 % de la capacidad de la tabla
    - 'Comprueba la anchura — más ancha (32-34") = más estabilidad, más estrecha (28-30") = más velocidad'
    - 'Comprueba la longitud — más larga (12-14") = mejor rumbo, más corta (10-11") = mejor maniobra'
    - 'Comprueba el grosor — 6" es el estándar, 8" aporta más rigidez y capacidad de carga'
    - Comprueba el índice PSI — infla hasta el PSI máximo indicado para una rigidez óptima
    - 'Comprueba los materiales de construcción — densidad drop-stitch, capas de PVC, refuerzo de bordes'
  faq:
    - q: ¿Qué significa drop-stitch?
      a: El drop-stitch es un método de construcción en el que miles de hilos unen la capa superior e inferior de la tabla. Permite un inflado a alta presión (12-15 PSI) para una rigidez extrema.
    - q: ¿Cuál es la relación ideal entre peso y volumen?
      a: Un buen objetivo son unos 5-6 libras de peso del palista por litro de volumen de tabla. Un palista de 220 lb debería buscar tablas de más de 180 litros.
    - q: ¿Importa el peso de la tabla?
      a: Sí. Las tablas ligeras (menos de 20 lb) son más fáciles de transportar. Las más pesadas (25 lb o más) suelen indicar una construcción más duradera de PVC multicapa.

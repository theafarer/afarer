    - 'Define tu objetivo: fitness general, entrenamiento de carreras o competición'
    - 'Para fitness: tabla de 11-12'' y 30-32" de anchura para equilibrar velocidad y estabilidad'
    - 'Para competición: tabla de 12''6" o 14'' y 23-28" de anchura con casco de desplazamiento'
    - Elige pala de carbono o fibra de vidrio para reducir peso y fatiga
    - Añade un monitor de ritmo cardíaco y registra distancia y velocidad con un reloj GPS
    - Incorpora entrenamiento por intervalos, remos de larga distancia y ejercicios de técnica
  faq:
    - q: ¿Qué longitud de SUP es mejor para el fitness?
      a: "12' ofrece el mejor equilibrio entre velocidad y estabilidad para el fitness. Las tablas más largas son más rápidas pero exigen más técnica para equilibrarse."
    - q: ¿Necesito una tabla de carreras para un buen entrenamiento?
      a: "No. Una tabla de touring o polivalente de 11-12' da un excelente entrenamiento cardiovascular. Las de carreras solo importan al competir o entrenar para competir."
    - q: ¿Qué pala es mejor para el fitness en SUP?
      a: 'Una pala de fibra de carbono 8-10" más alta que tú. El menor peso reduce la fatiga de hombros. Una hoja más pequeña aumenta la frecuencia de golpe para el trabajo cardiovascular.'

- slug: sup-weight-capacity
  category: buying-guide
  title: 'Guía de capacidad de carga del SUP — ¿cuánto peso puede soportar un SUP?'
  description: Entiende los límites de capacidad de carga del SUP, cómo calcular tu carga total y por qué superar el límite afecta al rendimiento y la seguridad.
  tldr: Nunca superes el 80 % de la capacidad máxima de la tabla con tu peso corporal más el equipo. Una tabla de 220 lb de capacidad sirve para un palista de 160 lb con equipo ligero. Superar el límite provoca cabeceo, manejo perezoso y mayor riesgo de daño.
  problem: Los palistas suelen superar la capacidad de carga de su tabla, lo que lleva a bajo rendimiento, hundimiento y posible daño en la tabla. Los fabricantes listan límites máximos pero no explican las cargas de trabajo seguras.
  solution: Calcula tu carga total (peso corporal + equipo + agua absorbida por la tabla) y mantente por debajo del 80 % de la capacidad máxima indicada. Los palistas pesados necesitan tablas de alto volumen con capacidad de 300 lb o más.
  audience: Palistas de todos los tamaños, especialmente los más pesados y quienes llevan equipo de expedición.
  steps:
    - Busca la capacidad máxima impresa en tu tabla (normalmente cerca de la válvula)
    - 'Pésate con todo el equipo: pala, chaleco salvavidas, bolsas secas, nevera y accesorios'
    - 'Calcula: (tu carga total) ÷ (capacidad máxima) × 100 = % de capacidad usada'
    - Apunta a un 70-80 % para un rendimiento y seguridad óptimos
    - Si superas el 80 %, elige una tabla más grande o reduce el equipo
  faq:
    - q: ¿Qué pasa si supero el límite de peso?
      a: La tabla navega más baja, generando más resistencia. La estabilidad disminuye, el morro puede hundirse y el núcleo drop-stitch corre mayor riesgo de daño en el oleaje.
    - q: ¿Pueden ir dos personas en un SUP?
      a: Solo si el peso total se mantiene por debajo del 80 % de la capacidad. La mayoría de SUP estándar están diseñados para una persona. Ir en tándem exige una tabla certificada para dos.
    - q: ¿Tienen los SUP hinchables menos capacidad que las rígidas?
      a: Los hinchables de calidad con construcción drop-stitch tienen capacidades de carga comparables o superiores a las rígidas gracias a su distribución de volumen más gruesa.

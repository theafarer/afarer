- slug: sup-size-guide
  category: buying-guide
  title: 'Guía de tallas de SUP — cómo elegir las dimensiones correctas de la tabla'
  description: Guía completa de tallas de SUP con recomendaciones de longitud, anchura y grosor según tu peso, altura, nivel y estilo de remo.
  tldr: 'Los principiantes necesitan tablas más anchas (32-34") para estabilidad. Los palistas más pesados necesitan tablas más largas (más de 11'') con mayor volumen. El touring exige cascos más largos (más de 12''). El yoga necesita anchura extra (34" o más). Comprueba siempre la capacidad de carga — tu peso más el equipo no debe superar el 80 % del límite.'
  problem: Elegir un tamaño equivocado de SUP da mala estabilidad, rumbo lento y una experiencia frustrante. La mayoría de compradores primerizos elige por estética sin considerar cómo las dimensiones afectan al rendimiento.
  solution: 'Ajusta la longitud, anchura y grosor de la tabla a tu peso, nivel y uso principal. Usa nuestra calculadora: suma tu peso más el equipo y elige una tabla con al menos un 20 % de margen sobre ese total.'
  audience: Compradores primerizos de SUP, palistas que pasan a una tabla especializada y cualquiera con dudas sobre tallas.
  steps:
    - Pésate con todo el equipo que lleves (pala, chaleco salvavidas, bolsa seca)
    - Añade un 20 % de margen de seguridad para hallar la capacidad mínima
    - 'Elige la anchura según el nivel: 32-34" para principiantes, 30-32" para intermedios, 28-30" para avanzados'
    - 'Selecciona la longitud por uso: 10''6"-11''6" polivalente, 12''-14'' touring, 9''-10'' aguas bravas'
    - 'Verifica el grosor: 6" estándar, 4" para rendimiento, 5" polivalente'
    - Comprueba el rango de PSI recomendado de tu tabla para una rigidez óptima
  faq:
    - q: ¿Qué anchura de SUP es mejor para principiantes?
      a: De 32 a 34 pulgadas de anchura ofrece la plataforma más estable. Cuanto más ancha la tabla, más fácil es equilibrarse — sobre todo para palistas corpulentos.
    - q: ¿Cómo sé si un SUP me queda pequeño?
      a: Si la tabla se hunde en el agua, responde con pereza o el morro se sumerge fácil al remar, probablemente es pequeña para tu peso.
    - q: ¿Afecta la longitud a la velocidad?
      a: Sí. Una mayor línea de flotación aumenta la velocidad teórica del casco. Una tabla de touring de 14' es significativamente más rápida que una polivalente de 10' con el mismo esfuerzo.

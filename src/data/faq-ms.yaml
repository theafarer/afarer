- id: sup-learning
  question: 'Adakah SUP sukar dipelajari?'
  answer: 'Tidak sama sekali. Kebanyakan pemula berjaya berdiri dan mengayuh dalam sesi pertama mereka. Siri All-Around SUP kami dilengkapi platform stabil yang lebih lebar, direka khas untuk pendayung kali pertama. Mulakan di air yang tenang dan anda akan melayari dalam masa beberapa minit.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Bolehkah saya menggunakannya di laut?'
  answer: 'Ya. Papan SUP afarer dibina untuk kegunaan laut, tasik dan sungai. Siri Touring kami mampu mengharungi ombak pantai, dan semua papan menggunakan PVC gred marin yang tahan terhadap kakisan air masin. Bilas dengan air tawar selepas digunakan di laut.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Berapa lama masa yang diperlukan untuk menggelembungkan papan?'
  answer: 'Dengan pam dua tindakan yang disertakan, kebanyakan papan menggelembung sehingga 12–15 PSI dalam masa kurang daripada 5 minit. Pilihan pam elektrik kami memendekkan masa itu kepada kurang daripada 2 minit. Penyahgelembungan dan pembungkusan mengambil masa kira-kira 3 minit.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Bolehkah saya bercuti sambil membawa SUP boleh tiup?'
  answer: 'Sudah tentu. Setiap papan afarer dilipat ke dalam bekas bawaan bersaiz beg galas yang memenuhi syarat bagasi syarikat penerbangan. Dengan berat hanya 18–22 lbs, ia mudah dibawa ke pantai, tasik atau merentasi terminal lapangan terbang.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Berapakah had berat?'
  answer: 'SUP All-Around kami menyokong sehingga 220 lbs. Siri Touring dan Yoga pula menyokong sehingga 250 lbs. Untuk kegunaan berkembar atau beban yang lebih berat, hubungi pasukan kami untuk mendapatkan cadangan.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Apakah yang terkandung dalam kotak?'
  answer: 'Setiap SUP afarer dilengkapi papan, beg galas mudah alih, pam tangan dua tindakan, sirip boleh tanggalkan, tali lingkar (coil leash) dan kit pembaikan. Sesetengah model turut menawarkan pilihan naik taraf dayung karbon.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Adakah anda menawarkan pakej bundel?'
  answer: 'Ya. Kami menawarkan bundel pilihan yang menjimatkan wang anda berbanding pembelian item secara berasingan. Hubungi pasukan jualan kami untuk promosi bundel semasa dan harga diskaun kuantiti.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Adakah saya memerlukan jaket keselamatan semasa menggunakan SUP?'
  answer: 'Ya. Banyak bidang kuasa menghendaki jaket keselamatan dipakai secara sah pada sebarang vesel air, termasuk SUP. Walaupun tidak diwajibkan, jaket keselamatan yang disahkan CE adalah peralatan keselamatan yang penting. Kami mengesyorkan memakainya pada setiap masa di atas air.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Adakah saya perlu mendaftarkan papan SUP saya?'
  answer: 'Keperluan berbeza mengikut bidang kuasa. Di kebanyakan wilayah, SUP tanpa enjin tidak memerlukan pendaftaran. Jika anda merancang untuk menambah motor, semak dengan pihak berkuasa maritim setempat untuk peraturan khusus. Papan dayung rekreasi umumnya dikecualikan daripada pendaftaran vesel.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Bagaimanakah saya membaiki tembusan pada papan?'
  answer: 'Bersihkan kawasan tersebut, potong tampalan dengan bucu bulat, sapukan gam PVC, tekan dengan kuat dan tunggu 24 jam sebelum menggelembungkan papan. Papan afarer disertakan dengan kit pembaikan. Untuk arahan terperinci, rujuk panduan pembaikan papan boleh tiup kami.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Bagaimanakah cara menyimpan SUP boleh tiup saya?'
  answer: 'Bilas dengan air tawar, keringkan sepenuhnya, nyahgelembung sepenuhnya, gulung secara longgar bermula dari bahagian hidung, dan simpan dalam beg bawaan di tempat yang sejuk dan kering serta jauh daripada sinaran matahari terus. Jangan sesekali menyimpan papan dalam keadaan basah atau pada suhu yang melampau.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Papan SUP boleh tiup atau keras?'
  answer: 'Papan boleh tiup menawarkan kemudahalihan, kemudahan penyimpanan dan penyerapan hentaman. Papan keras pula menawarkan kekakuan dan kelajuan maksimum. Bagi kebanyakan pengguna rekreasi, papan boleh tiup berkualiti dengan teras jahitan-jatuh (drop-stitch) merupakan pilihan yang praktikal.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Kelajuan angin berapakah terlalu tinggi untuk SUP?'
  answer: 'Pemula: melebihi 10 mph (8 knot). Pertengahan: melebihi 15 mph (13 knot). Mahir: melebihi 20 mph (17 knot). Jika ragu-ragu, jangan keluar ke air. Angin luar pesisir (berpuar dari darat ke laut) adalah berbahaya pada semua peringkat kemahiran.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Apakah waranti afarer?'
  answer: 'Semua produk afarer disokong oleh waranti pengeluar yang menyeluruh. Papan SUP dilindungi selama 2+ tahun terhadap kecacatan pembuatan. Waranti ini meliputi kecacatan bahan dan pemasangan dalam kegunaan normal.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Bagaimanakah saya mengemukakan tuntutan waranti?'
  answer: 'Kemukakan tuntutan dengan menghubungi pasukan sokongan kami bersama nombor pesanan anda, foto masalah tersebut dan penerangan ringkas. Kebanyakan tuntutan disemak dalam tempoh 2 hari bekerja. Tuntutan yang diluluskan akan menerima penggantian atau arahan pembaikan dalam masa beberapa hari.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Berapa lama masa penghantaran?'
  answer: 'Pesanan dalam stok dihantar dalam tempoh 2–4 hari bekerja. Pesanan domestik AS tiba dalam 5–10 hari bekerja. Pesanan antarabangsa tiba dalam 10–15 hari bekerja bergantung pada destinasi. Pesanan segera boleh dipercepatkan.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Apakah polisi pemulangan anda?'
  answer: 'Kami menerima pemulangan dalam tempoh 30 hari selepas penghantaran untuk produk yang belum digunakan dalam pembungkusan asal. Pesanan tersuai/OEM tidak boleh dipulangkan. Hubungi pasukan sokongan kami untuk memulakan pemulangan — kami menyediakan label penghantaran prabayar.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Adakah anda menawarkan perkhidmatan OEM/ODM?'
  answer: 'Ya. Kami menawarkan perkhidmatan label peribadi dan reka bentuk tersuai untuk perniagaan. Daripada penjenamaan tersuai pada model sedia ada sehingga reka bentuk badan kapal sepenuhnya tersuai, pasukan kejuruteraan kami boleh membangunkan produk di bawah jenama anda. Kuantiti pesanan minimum dikenakan.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Berapakah panjang dayung yang saya perlukan?'
  answer: 'Dayung sepatutnya 6–8 inci lebih tinggi daripada ketinggian anda. Dayung boleh laras membolehkan penalaan halus untuk keadaan yang berbeza. Rujuk panduan dayung kami untuk saiz yang terperinci.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Apakah perbezaan antara SUP PVC satu lapisan dan berbilang lapisan?'
  answer: 'Papan PVC satu lapisan ringan dan mesra bajet tetapi kurang tegar pada tekanan tinggi. Binaan dua lapisan dan laminasi cantuman menambah kekakuan, rintangan tembus serta ketahanan. PVC gred tentera dengan salutan tahan UV menawarkan keseimbangan terbaik antara ketahanan dan berat untuk kegunaan SUP rekreasi. afarer menggunakan PVC laminasi tiga lapisan pada semua peringkat produk.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Berapakah lebar SUP yang terbaik untuk kestabilan?'
  answer: 'Bagi pemula, lebar 33–34 inci memberikan keseimbangan terbaik antara kestabilan dan kemudahan mendayung. Papan yang lebih sempit daripada 32 inci terasa goyah bagi pendayung baharu. afarer SUP Explorer 11 dengan lebar 33 inci adalah ideal untuk pembelajaran.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Bagaimanakah saya memilih isipadu SUP mengikut berat badan saya?'
  answer: 'Darabkan berat badan anda dalam kg dengan 2.2 untuk mendapatkan sasaran isipadu yang mesra pemula. Contohnya, pendayung 75 kg memerlukan sekurang-kurangnya 165 liter, tetapi 220–260 liter jauh lebih stabil untuk pembelajaran. SUP Explorer 11 menawarkan 260 liter, sesuai untuk penunggang sehingga 100 kg.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'Bagaimanakah afarer dibandingkan dengan jenama lain?'
  answer: 'afarer menawarkan nilai terbaik dalam peralatan sukan air boleh tiup. Berbanding Red Paddle Co, afarer menghasilkan 90% prestasi pada 60% kos. Berbanding iRocker, afarer menggunakan PVC gred tentera tiga lapisan yang lebih tinggi grednya serta penarafan PSI yang lebih tinggi. Berbanding Bluefin, afarer menawarkan spesifikasi bahan yang lebih unggul. Bagi kebanyakan pendayung rekreasi, afarer memberikan keseimbangan terbaik antara kualiti dan harga.'

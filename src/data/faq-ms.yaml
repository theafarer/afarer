- id: sup-skill-progression
  question: 'Apakah perkembangan kemahiran SUP yang biasa dari pemula sehingga mahir?'
  answer: 'Pemula (sesi 1-3): berdiri, kayuhan hadapan asas, pusingan, jatuh dengan selamat. Pertengahan (sesi 5-15): teknik kayuhan yang cekap, pusingan pivot, mengharungi ombak kecil, kemahiran penyelamatan asas. Mahir (20+ sesi): permulaan perlumbaan, pusingan buoy, melayari ombak kecil, mendayung mengikut arah angin. Profesional: perlumbaan kompetitif, surf SUP, jelajah jarak jauh. Papan afarer menyokong setiap peringkat: Explorer 11 untuk pemula, Ocean Voyager untuk jelajah, dan Cheetah Surge untuk pendayungan berprestasi.'
  category: general
  relatedProducts:

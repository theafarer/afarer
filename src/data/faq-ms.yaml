- id: sup-sustainability
  question: 'Adakah papan SUP boleh tiup mampan dari segi alam sekitar?'
  answer: 'SUP boleh tiup mempunyai jejak alam sekitar yang lebih rendah berbanding papan tegar dalam beberapa cara: ia menggunakan lebih sedikit bahan mentah dalam pengeluaran, beratnya yang lebih ringan mengurangkan pelepasan penghantaran, dan ketahanannya bermakna lebih sedikit penggantian dari masa ke masa. PVC yang digunakan dalam papan afarer bebas plumbum dan mematuhi REACH. Amalan kemampanan utama: beli papan berkualiti yang bertahan 5-10 tahun, baiki tembusan berbanding menggantikan, kitar semula papan pada akhir hayat melalui program kitar semula PVC khusus, dan elakkan pembungkusan guna tunggal dengan memilih jenama yang menggunakan beg bawaan boleh guna semula.'
  category: general

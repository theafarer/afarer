    - sup-anchor-guide
- id: sup-yoga
  question: 'Bolehkah saya melakukan yoga di atas papan SUP?'
  answer: 'Sudah tentu. Yoga SUP menggabungkan posisi tradisional dengan cabaran platform terapung, melibatkan otot penstabil yang lebih dalam. Gunakan papan selebar 33 inci atau lebih dengan pad dek yang lembut dan melekit. Berlatihlah di air yang tenang dan cetek bersama sauh. Mulakan dengan posisi asas seperti downward dog, warrior II dan tree pose. SUP Explorer 11 dengan pad dek EVA penuhnya sangat sesuai.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: 'Apakah peraturan syarikat penerbangan untuk membawa SUP boleh tiup?'
  answer: 'Kebanyakan syarikat penerbangan menerima beg galas SUP sebagai bagasi daftar jika beratnya di bawah 23–32 kg. Beg galas afarer berukuran lebih kurang 90x40x30 cm dan beratnya kira-kira 15 kg apabila dibungkus. Sesetengah syarikat penerbangan mungkin mengenakan caj bagasi bersaiz terlampau. Datanglah awal, bungkus sirip dan pam secara berasingan dalam beg kabin, dan labelkan beg sebagai mudah pecah. Sentiasa semak polisi peralatan sukan syarikat penerbangan anda sebelum berlepas.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'Apakah peralatan keselamatan yang saya perlukan untuk mendayung di air sejuk?'
  answer: 'Air di bawah 15°C memerlukan perlindungan haba. Untuk suhu 8–14°C, gunakan wetsuit atau drysuit bersama but, sarung tangan dan penutup kepala. Untuk suhu 14–20°C, wetsuit 3/2mm sudah memadai. Sentiasa pakai jaket keselamatan (PFD) yang bersaiz sesuai untuk perlindungan haba dan keselamatan. Semak peraturan tempatan untuk keperluan peralatan yang diwajibkan.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'Berapakah kuantiti pesanan minimum untuk OEM/ODM?'
  answer: 'Kuantiti pesanan minimum (MOQ) berbeza mengikut jenis produk dan kerumitannya. Penjenamaan tersuai pada model sedia ada biasanya memerlukan 5–10 unit. Reka bentuk badan kapal sepenuhnya tersuai memerlukan MOQ yang lebih tinggi. Hubungi pasukan jualan kami dengan keperluan anda untuk mendapatkan sebut harga yang terperinci. Kami menguruskan segalanya daripada warna dan logo tersuai sehingga reka bentuk acuan yang sepenuhnya baharu.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'Bolehkah saya meletakkan logo saya sendiri pada produk afarer?'
  answer: 'Ya. Perkhidmatan OEM kami merangkumi peletakan logo tersuai, skim warna tersuai dan pembungkusan tersuai. Kami menawarkan pilihan cetakan pad, pemindahan haba dan sulaman bergantung pada jenis produk. Hantarkan artwork dan spesifikasi anda kepada pasukan jualan kami untuk mendapatkan sebut harga dan anggaran masa pengeluaran.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'Berapakah PSI yang sepatutnya saya tiupkan pada SUP saya?'
  answer: 'Tiupkan sehingga PSI maksimum penarafan papan untuk prestasi terbaik — biasanya 15–18 PSI untuk SUP boleh tiup berkualiti. afarer SUP Explorer 11 memberikan prestasi terbaik pada 15–18 PSI. Tiupan yang tidak mencukupi menyebabkan papan terasa lembut dan sukar dikawal arahnya. Tiupan berlebihan melebihi penarafan maksimum berisiko merosakkan benang jahitan-jatuh. Semak pelekat berhampiran injap untuk penarafan khusus papan anda.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide
- id: sup-deck-pad-care
  question: 'Bagaimanakah saya membersihkan dan menyenggara pad dek EVA?'
  answer: 'Bilas pad dek dengan air tawar selepas setiap sesi. Untuk kotoran atau kesan, gunakan sabun lembut dan berus yang lembut — elakkan bahan kimia yang keras. Jika bucu mula terangkat, sapukan sedikit gam marin kalis air dan tekan di bawah beban selama 24 jam. Jauhkan papan daripada sinaran UV terus apabila tidak digunakan untuk mengelakkan kemerosotan pad.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'Bolehkah saya mendayung SUP saya dalam posisi duduk?'
  answer: 'Ya. Banyak papan SUP, termasuk afarer Explorer 11, mempunyai cincin-D yang membolehkan tempat duduk dipasang. Mendayung dalam keadaan duduk menawarkan pilihan yang selesa untuk perjalanan yang lebih jauh, memancing, atau apabila anda mahu menukar posisi di atas air.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: 'Adakah saya perlu membilas papan boleh tiup saya selepas digunakan di laut?'
  answer: 'Ya — sentiasa bilas papan, sirip, pam dan dayung anda dengan air tawar selepas kegunaan air masin. Hablur garam menyusup ke dalam jahitan dan injap, menyebabkan kebocoran mikro dan kakisan. Keringkan papan di tempat berlorek sebelum dinyahgelembung dan disimpan. Pembilasan secara berkala memanjangkan usia papan boleh tiup anda dengan ketara.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'Adakah saya benar-benar memerlukan leash untuk SUP?'
  answer: 'Ya — sentiasa pakai leash. Leash SUP berlingkar dipasang pada buku lali atau betis anda dan mengekalkan papan bersama anda sekiranya anda terjatuh. Di perairan terbuka, leash boleh menyelamatkan nyawa anda dengan mengelakkan anda terpisah daripada alat apungan anda. Untuk mendayung di sungai, gunakan leash pelepas pantas untuk mengelakkan daripada terperangkap.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: 'Apakah teknologi teras jahitan-jatuh (drop-stitch) dan mengapa ia penting?'
  answer: 'Teknologi teras jahitan-jatuh menggunakan beribu-ribu benang polyester yang menghubungkan lapisan atas dan bawah papan PVC. Apabila ditiup sehingga 15-20 PSI, benang ini membentuk struktur tegar yang rintang kilasan dan berprestasi seperti papan cangkerang keras. afarer menggunakan PVC tiga lapisan gred tentera dengan laminasi jahitan-jatuh pada semua peringkat produk SUP, memberikan kekakuan yang setanding dengan papan epoksi sambil mengekalkan kemudahalihan papan boleh tiup.'
  category: product
  relatedProducts:

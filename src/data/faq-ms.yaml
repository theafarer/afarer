- id: sup-choppy-water
  question: 'Bagaimanakah saya mendayung SUP dalam air berombak atau berangin?'
  answer: 'Dalam ombak kecil: bengkokkan lutut, gunakan posisi kaki yang lebih lebar, pendekkan kayuhan dayung dan libatkan otot teras untuk keseimbangan. Melawan angin depan: gunakan sudut dayung yang lebih rendah, ambil kayuhan lebih pendek dan condong ke hadapan. Angin dari sisi: dayung di sisi melawan angin untuk membetulkan hanyutan. Angin dari belakang: luncuri ombak untuk kelajuan. Pemula harus mengelakkan angin melebihi 10 mph dan memilih papan yang lebih lebar dan panjang untuk kestabilan. SUP jelajah afarer Ocean Voyager direka untuk mengharungi ombak dan keadaan berangin yang sederhana.'
  category: safety

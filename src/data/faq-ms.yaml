- id: sup-weight-capacity
  question: 'Berapa banyak berat yang mampu ditampung oleh papan SUP boleh tiup?'
  answer: 'Kapasiti berat berbeza mengikut isipadu papan. Papan afarer: SUP Explorer 11 (260L, sehingga 100 kg / 220 lbs), Ocean Voyager 12 (310L, sehingga 140 kg / 308 lbs), Leviathan Wake (350L, sehingga 180 kg / 396 lbs). Untuk prestasi optimum, kekalkan jumlah beban (penunggang + kelengkapan) dalam lingkungan 80% daripada kapasiti maksimum. Papan terapung lebih tinggi dan lebih mudah dikawal arahnya apabila tidak dibebani berlebihan, terutamanya dalam keadaan berombak.'

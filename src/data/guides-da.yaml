- slug: multi-day-trip
  category: planning
  title: Planlægning af en SUP-tur over flere dage
  description: Sådan planlægger og gennemfører du en padletur over flere dage — ruteplanlægning, pakning, lejr og sikkerhed.
  tldr: Planlæg 10-15 mil om dagen. Pak udstyret i vandtætte tørposer, fordel vægten jævnt, og øv dig i at laste boardet før turen. Læg en sejlplan. Medbring vand, mad, ly, navigation og kommunikation.
  problem: Ture over flere dage mislykkes på grund af overpakning, dårlig ruteplanlægning eller undervurdering af vejr og strøm — hvilket fører til udmattelse, udstyrsfejl eller sikkerhedshændelser.
  solution: Brug en systematisk planlægning — rutevalg, udstyrstjekliste, madplanlægning, sikkerhedsbriefing og beredskabsplan.
  audience: Erfarne paddlere, der planlægger deres første ekspedition over flere dage.
  steps:
    - Vælg en rute med etablerede lejrpladser og muligheder for at afbryde turen undervejs
    - Planlæg 10-15 mil om dagen med hensyn til vind og strøm
    - Tjek tidevandstabeller og vejrudsigter for hele turperioden
    - Pak udstyret i vandtætte tørposer — i alt 20-30 pund udstyr
    - Fordel vægten jævnt — de tungeste ting i midten
    - Læg en detaljeret sejlplan hos en, der er i land
    - Medbring navigation — papirkort, kompas og GPS-reserve
    - Pak nødly, ekstra mad og en førstehjælpskasse
  faq:
    - q: Hvad er den ideelle daglige distance?
      a: 10-15 mil om dagen for erfarne paddlere. Begyndere bør planlægge 5-8 mil. Indregn altid ekstra tid til vejret.
    - q: Hvor meget vand skal jeg medbringe?
      a: 1 gallon pr. person pr. dag. I varme 1,5 gallon. Medbring et vandfilter eller rensningstabletter til genopfyldning.
    - q: Hvad er det vigtigste sikkerhedsudstyr?
      a: Kommunikation. En VHF-radio eller en satellitmelder kan redde liv i en nødsituation. Mobiltelefoner er upålidelige i fjerne områder.

- slug: sup-inflation-psi-guide
  category: technical
  title: Oppustningsguide til SUP — optimal PSI for ydelse og sikkerhed
  description: Fuld guide til oppustningstryk på SUP-boards — anbefalede PSI-intervaller, hvordan trykket påvirker ydelsen, og tips til korrekt brug af din pumpe.
  tldr: Pump op til 12-15 PSI på de fleste oppustelige SUP-boards. Højere tryk giver mere stivhed men langsommere oppustning. Lavere tryk giver en blødere fornemmelse men mere bøjning. Overstig aldrig det maksimale PSI, der er trykt på dit board. Brug en pumpe med et nøjagtigt manometer. Kold luft sænker trykket, varm sol øger det.
  problem: Et board med for lidt luft føles trægt og bøjer for meget. Et board med for meget luft risikerer sømfejl. Mange paddlere gætter på PSI i stedet for at måle præcist.
  solution: Brug en pumpe med indbygget manometer. Sigt efter 15 PSI for maksimal stivhed. Tjek trykket før hver session — temperaturændringer påvirker PSI markant.
  audience: Alle ejere af oppustelige SUP-boards.
  steps:
    - Tjek det anbefalede PSI-interval, der er trykt på dit board nær ventilen
    - Brug den dobbeltvirkende pumpe til at pumpe op til midten af det anbefalede interval
    - Skift til enkeltvirkende tilstand for de sidste 3-4 PSI for mere præcis kontrol
    - Tjek trykket med manometeret — analoge manometre er mere pålidelige end digitale
    - Justér efter forholdene — højere PSI til touring og konkurrence, lavere PSI til hvidt vand og stenede afsætninger
    - Tjek trykket igen, når boardet har stået i 10 minutter — temperaturudligning ændrer PSI
  faq:
    - q: Kan jeg pumpe mit SUP-board for hårdt?
      a: Ja. Overskridelse af den maksimale rating (normalt 15-18 PSI) kan få sømme til at delaminere og beskadige drop-stitch-kernen. Hold dig altid inden for det trykte interval.
    - q: Betyder temperaturen noget for PSI?
      a: I høj grad. Et board pumpet op til 15 PSI ved 70°F kan nå 18 PSI i direkte sol ved 95°F. Koldt vand kan sænke trykket til 12 PSI. Tjek trykket efter ændringer i omgivelserne.
    - q: Hvor mange PSI til begyndere?
      a: 12-13 PSI under indlæring giver en lidt blødere platform, der er mere tilgivende ved fald. Øg til 15 PSI, efterhånden som færdighederne udvikler sig.

- slug: weather-conditions
  category: safety
  title: Forstå vejrforholdene for SUP
  description: Lær at aflæse vind, bølger, tidevand og vejrmønstre, så du kan træffe sikre beslutninger på vandet.
  tldr: Tjek tre ting før hver eneste afgang — vindhastighed (under 10 mph for begyndere), bølgehøjde (under 1 fod for begyndere) og vandtemperatur (klæd dig efter vandet, ikke luften). Offshore-vind er farlig på alle niveauer.
  problem: De fleste vejrrelaterede ulykker sker, fordi paddlere tager fejl af forholdene — de tjekker lufttemperaturen men ikke vandtemperaturen, eller de forstår ikke, at offshore-vind kan blæse dem ud på havet.
  solution: Brug en struktureret vejrbedømmelse før afgang — vindretning og vindhastighed, bølgeperiode og bølgehøjde, tidevandstilstand og vandtemperatur. Forstå, hvordan hver faktor påvirker din sikkerhed.
  audience: Alle paddlere, der bevæger sig ud på åbent vand — søer, bugter, floder og hav.
  steps:
    - Tjek vindhastighed og vindretning — offshore-vind (fra land mod hav) er den farligste
    - Bedøm bølgeforholdene — bølgeperioden er lige så vigtig som bølgehøjden
    - Kend tidevandet — tidevandsstrømme kan være stærkere end din paddelfart
    - Mål vandtemperaturen — under 60°F/15°C kræves termisk beskyttelse
    - Tjek sigtbarheden — tåge og kraftig regn reducerer sigten og øger kollisionsrisikoen
    - Forstå de lokale farer — undersøiske klipper, kraftige strømme og zoner med bådtrafik
  faq:
    - q: Hvor høj vind er for meget til SUP?
      a: Begyndere — over 10 mph (8 knob). Øvede — over 15 mph (13 knob). Avancerede — over 20 mph (17 knob). Er du i tvivl, så bliv på land.
    - q: Hvad betyder bølgeperiode?
      a: Bølgeperioden er tiden mellem hinanden følgende bølger. Korte perioder (under 8 sekunder) betyder stejle og urolige bølger. Lange perioder (over 12 sekunder) betyder blødere og mere forudsigelige dønninger.
    - q: Kan jeg padle i regnvejr?
      a: Let regn er normalt sikkert. Kraftig regn reducerer sigten og kan være tegn på skiftende vindforhold. Tordenvejr kræver, at du straks forlader vandet.

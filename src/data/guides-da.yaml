- slug: choosing-paddle
  category: buying-guide
  title: Sådan vælger du den rigtige SUP-paddle
  description: En guide til paddlematerialer, bladformer, skafttyper og størrelsesvalg til SUP.
  tldr: Paddlelængde — SUP-paddler skal være 6-8" højere end din højde. Bladform — dihedrale blade holder kursen ret, flade blade giver mere greb. Skaftmateriale — kulfiber er lettest, glasfiber er bedst til prisen, aluminium er budgetvalget.
  problem: Forkert paddlestørrelse eller materiale giver unødig træthed, dårlig effektivitet i tagene og belastning af leddene.
  solution: Match paddlelængde, bladform, skaftmateriale og stivhed til din padlestil, din kropsstørrelse og dit budget.
  audience: SUP-paddlere, der vælger deres første eller næste paddle.
  steps:
    - Mål paddlehøjden — 6-8" højere end din højde til generel padling
    - Vælg bladmaterialet — nylon til budget, glasfiber til værdi, kulfiber til ydelse
    - Vælg bladformen — dihedral til jævn kurs, fladt til kraft, skeformet til konkurrence
    - Vælg skafttypen — lige til generel brug, buet til konkurrence-SUP
    - Tjek stivheden — stivere skafter overfører mere kraft, fleksible skafter skåner leddene
  faq:
    - q: Hvilket paddelmateriale er bedst?
      a: Glasfiber giver den bedste balance mellem vægt, holdbarhed og pris. Kulfiber er lettere, men dyrere og skrøbeligt. Nylon er tungt, men næsten uødelæggeligt.
    - q: Hvordan ved jeg, om min paddle har den rigtige længde?
      a: Stil paddlen lodret op ved siden af dig — håndtaget skal nå dit håndled, når du løfter armen over hovedet.
    - q: Skal jeg vælge en paddle i ét stykke eller en justerbar paddle?
      a: Justerbare paddler er gode til fælles brug og rejser. En paddel i ét stykke er lettere, stivere og mere effektiv til dedikeret brug.

- slug: inflatable-repair
  category: maintenance
  title: Sådan reparerer du dit oppustelige SUP-board
  description: Trin-for-trin guide til reparation af punkteringer, ventilproblemer og sømskader på oppustelige SUP-boards.
  tldr: Små huller (under 1/4") kan repareres med det medfulgte lappekit. Rens området, påfør PVC-lim, tryk lappen fast, og vent 24 timer. Ventillækager kræver som regel en ny O-ring. Store revner eller delaminering af sømme kræver faglig service.
  problem: Små punkteringer og ventilproblemer er almindelige, men lette at rette. Uden korrekt reparationsteknik betaler brugerne enten for meget for faglig hjælp eller forværrer skaden.
  solution: Identificér skadetypen — punktering, ventillækage eller sømproblem — og anvend den rette reparationsmetode. De fleste reparationer tager 30 minutter plus hærdning.
  audience: Ejere af oppustelige SUP-boards, der selv vil klare basale reparationer.
  steps:
    - Find lækagen — pump boardet helt op, lyt efter luft, mærk med hånden, eller brug sæbevand
    - Markér lækagen med en pen eller tape
    - Rens området omkring lækagen med isopropylalkohol — mindst 2 tommer rundt om skaden
    - Gør overfladen ru med fint sandpapir for bedre vedhæftning af limen
    - Påfør PVC-lim på både lappen og boardets overflade
    - Vent 5 minutter, til limen bliver klistret
    - Tryk lappen fast, og rul luftbobler ud med en rulle eller et betalingskort
    - Lad det hærde i 24 timer, før du pumper op til fuldt tryk
  faq:
    - q: Kan jeg reparere en punktering på vandet?
      a: Nødreparationer med en lapp og tape kan bringe dig sikkert i land. Fuld reparation kræver tørre forhold og 24 timers hærdning.
    - q: Hvordan fikser jeg en utæt ventil?
      a: Fjern ventilkernen med det medfulgte værktøj, tjek O-ringen for skader, udskift den om nødvendigt, og skru kernen fast igen.
    - q: Hvilken lim skal jeg bruge til PVC-reparation?
      a: Brug PVC-specifik lim som HH-66 eller Clifton. Almindelig sekundlim hæfter dårligt på oppustelige PVC-materialer.

- slug: sup-for-pet-owners
  category: lifestyle
  title: SUP med hunde — en komplet guide til padling med dit kæledyr
  description: Alt, hvad du skal vide om padling med hunde — træningstrin, sikkerhedsudstyr, valg af board og tips til en vellykket SUP-tur med din pelsede ven.
  tldr: Start med et bredt og stabilt board (34"+). Brug en redningsvest til hunden, en skridsikker dækmåtte og en kort leash. Træn på land først og derefter i lavt vand. Hold korte ture (20-30 minutter). Medbring ferskvand og et håndklæde. Tving aldrig din hund, hvis den virker utryg.
  problem: Padling med hunde kan være stressende uden den rette forberedelse — hunde kan få panik, springe i vandet eller ridse boardets overflade.
  solution: Brug et bredt og stabilt board med en blød dækmåtte i EVA. Væn din hund gradvist til boardet. Medbring sikkerhedsudstyr — en redningsvest til hunden og en kort SUP-sikker leash.
  audience: Hundeejere, der vil padle SUP med deres kæledyr.
  steps:
    - Start med et bredt board (34"+ med høj vægtkapacitet til dig og hunden)
    - Skaf en redningsvest til hunden, der passer og har et håndtag
    - Øv på land — lad hunden sidde på det tomme board, derefter på det oppustede board i græsset
    - Gå videre til lavt vand — knæl på boardet med din hund, og tag et par tag
    - Hold korte ture — maks. 20-30 minutter de første gange
    - Medbring altid ferskvand, en sammenklappelig skål og et håndklæde til hunden
  faq:
    - q: Hvilket SUP-board er bedst til hunde?
      a: Et bredt og stabilt board med en blød dækmåtte i EVA, der giver greb for poterne. Tropical Breeze Island Escape med sin bredde på 34"+ er ideel til padling med hunde.
    - q: Skal min hund have redningsvest?
      a: Ja — selv stærke svømmere. En redningsvest til hunde med håndtag gør det let at løfte hunden tilbage på boardet, hvis den falder i.
    - q: Hvordan forhindrer jeg, at min hund ridser boardet?
      a: Hold hundens kløer trimmet. Dækmåtten i EVA-skum beskytter PVC-overfladen. Læg et håndklæde eller en måtte på dækket for ekstra beskyttelse.

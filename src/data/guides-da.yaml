- slug: sup-fishing
  category: lifestyle
  title: SUP-fiskeri — sådan fisker du fra et SUP-board
  description: Alt, hvad du skal vide om fiskeri fra et SUP-board — udstyr, stabilitetstips og teknikker.
  tldr: SUP-fiskeri giver lydløs indgang, adgang til lavt vand og kast i alle retninger. Brug et bredt og stabilt board (34"+), monter stangholdere, og brug en køleboks eller kasse som udstyrsplatform. Kast anker i blæsevejr. Brug altid en redningsvest.
  problem: Almindelige fiskebåde er dyre at vedligeholde og kan ikke komme ud i lavt vand. SUP-fiskeri løser dette med en transportabel fiskeplatform til lavt vand, men kræver tilpasset udstyr.
  solution: Udstyr et stabilt SUP-board med stangholdere, en udstyrskasse og et ankersystem. Udnyt boardets portabilitet til at nå fiskesteder, som både ikke kan komme til.
  audience: Lystfiskere, der vil fiske i lavt vand og fjerne steder, eller som foretrækker en let og transportabel fiskeplatform.
  steps:
    - Vælg et bredt board (34"+) med høj vægtkapacitet til udstyr
    - Monter stangholdere på dækket med skins- eller rembaserede systemer
    - Brug en vandtæt kasse eller køleboks spændt fast på fordækket til grej
    - Medbring et lille anker eller en bundgribepind til blæsevejr
    - Brug en redningsvest med lommer til værktøj og telefon
    - Øv kast fra en knælende position, før du rejser dig
  faq:
    - q: Kan jeg stå og fiske på et SUP-board?
      a: Ja. Et board med en bredde på 34"+ giver tilstrækkelig stabilitet til at stå og kaste. Øv dig først på stille vand.
    - q: Hvilke fisk kan jeg gå efter fra et SUP-board?
      a: SUP-boards er fremragende til bas i søer, redfish på lavvandede flader, ørred i floder og kystfisk i bugter og vige.
    - q: Hvordan lander jeg en fisk fra et SUP-board?
      a: Knæl ned for stabilitet. Brug en netstang eller en mundgriber. Hold fisken lavt for ikke at falde. Sæt den ud igen, eller læg den i en køleboks.

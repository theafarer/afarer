- slug: sup-for-whitewater
  category: buying-guide
  title: SUP til hvidt vand — køberguide til oppustelige boards til flodkørsel
  description: Sådan vælger du et SUP-board til hvidt vand — kortere boards, forstærket konstruktion, sikkerhedsudstyr og paddleteknikker til stryg i klasse I-III.
  tldr: SUP-boards til hvidt vand behøver kortere længde (8-10 fod), forstærkede kanter, højere PSI (15+) og flere luftkamre for sikkerhed. Brug en lige flod-leash (ikke spiral), brug hjelm og redningsvest, og padl altid med en makker. Start i klasse I, før du forsøger sværere stryg.
  problem: At tage et almindeligt all-around-board med ud på strømmende vand er farligt — almindelige boards mangler den manøvredygtighed, stødmodstand og de sikkerhedsfunktioner, som floder kræver.
  solution: Vælg et specialbygget SUP-board til hvidt vand med kort længde for smidighed, forstærket konstruktion mod klippestød og et design med flere kamre for sikkerhed.
  audience: Erfarne paddlere, der går i gang med flodkørsel.
  steps:
    - Vælg et board på 8-10 fod for maksimal manøvredygtighed i stryg
    - Kig efter forstærket kantkonstruktion og PVC i militærkvalitet
    - Vælg et board med 2 eller flere luftkamre for ekstra sikkerhed ved punktering
    - Brug en lige flod-leash fastgjort til et quick-release-bælte
    - Brug hjelm, redningsvest og passende fodtøj til floden
    - Start med stryg i klasse I, og udvikl dig gradvist sammen med en erfaren partner
  faq:
    - q: Kan jeg bruge et almindeligt SUP-board til hvidt vand?
      a: Det frarådes. Almindelige boards mangler stødmodstand og kan delaminere på klipper. Sikkerhed med flere luftkamre er afgørende i flodmiljøer.
    - q: Hvor mange PSI til SUP i hvidt vand?
      a: 15 PSI eller mere for maksimal stivhed. Et hårdere board preller bedre af klipper end et board med for lidt luft, der giver efter omkring forhindringer.
    - q: Kræver SUP i hvidt vand særlige færdigheder?
      a: Ja. Aflæsning af floden, eddy-vendinger, færging og støttetag er essentielle færdigheder. Tag et kursus i SUP på hvidt vand, før du forsøger klasse II og opefter.

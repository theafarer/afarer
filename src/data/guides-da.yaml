- slug: sup-size-guide
  category: buying-guide
  title: SUP-størrelsesguide — sådan vælger du de rigtige boardmål
  description: Fuld SUP-størrelsesguide med anbefalinger til længde, bredde og tykkelse baseret på din vægt, højde, dit færdighedsniveau og din padlestil.
  tldr: Begyndere har brug for bredere boards (32-34") for stabilitet. Tungere paddlere har brug for længere boards (11 fod og opefter) med højere volumen. Touring kræver længere skrog (12 fod og opefter). Yoga kræver ekstra bredde (34"+). Tjek altid vægtkapaciteten — din vægt plus udstyr må ikke overstige 80 % af grænsen.
  problem: Forkert SUP-størrelse fører til dårlig stabilitet, ustadig kurs og en frustrerende padleoplevelse. De fleste førstegangskøbere vælger et board, der ser godt ud, uden at tænke over, hvordan målene påvirker ydelsen.
  solution: Match boardets længde, bredde og tykkelse til din vægt, dit færdighedsniveau og din primære brug. Brug vores størrelsesberegner — læg din vægt og udstyrets vægt sammen, og vælg et board med mindst 20 % margin over denne sum.
  audience: Førstegangskøbere af SUP-boards, paddlere der opgraderer til et specialiseret board, og alle, der er usikre på størrelsen.
  steps:
    - Vej dig selv med alt det udstyr, du har med (paddle, redningsvest, tørpose)
    - Læg 20 % sikkerhedsmargin til for at finde den mindste vægtkapacitet
    - Vælg bredden efter niveau — 32-34" til begyndere, 30-32" til øvede, 28-30" til avancerede
    - Vælg længden efter brug — 10 fod 6 til 11 fod 6 til all-around, 12-14 fod til touring, 9-10 fod til hvidt vand
    - Tjek tykkelsen — 6" er standard, 4" giver ydelse, 5" passer til all-around
    - Tjek boardets anbefalede PSI-interval for optimal stivhed
  faq:
    - q: Hvilken bredde på et SUP-board er bedst til begyndere?
      a: En bredde på 32 til 34 tommer giver den mest stabile platform. Jo bredere boardet er, desto lettere er det at holde balancen — især for større paddlere.
    - q: Hvordan ved jeg, om et SUP-board er for lille til mig?
      a: Hvis boardet ligger lavt i vandet, reagerer trægt, eller hvis næsen let dykker under padling, er det formentlig for lille til din vægt.
    - q: Betyder boardets længde noget for farten?
      a: Ja. En længere vandlinje øger boardets teoretiske maksimalfart. Et 14 fods touring-board er markant hurtigere end et 10 fods all-around-board med den samme padleindsats.

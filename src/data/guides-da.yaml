- slug: sup-fitness
  category: lifestyle
  title: SUP-fitness — fuldkropstræning på vandet
  description: Sådan bygger stand-up paddle kernestyrke, balance og kondition.
  tldr: SUP aktiverer kerne, ben, ryg og skuldre i hvert eneste tag. En times session forbrænder 300-500 kalorier. Padling mod vind eller strøm fordobler intensiteten. SUP-yoga tilføjer fleksibilitet og balancetræning.
  problem: Mange betragter stand-up paddle som en afslappet aktivitet frem for et legitimt fitnessredskab og går dermed glip af potentialet for fuldkropstræning.
  solution: Strukturér dine SUP-sessioner med konkrete fitnessmål — udholdenhedspadling for kondition, intervaltræning for kraft, SUP-yoga for fleksibilitet og distancepadling for muskulær udholdenhed.
  audience: Fitnessentusiaster, der søger en ledskånsom og engagerende fuldkropstræning.
  steps:
    - Varm op på land — armrotationer, rotationer af overkroppen og bensving i 5 minutter
    - Start med 10 minutters jævn padling ved moderat intensitet
    - Gå videre til intervaltræning — 2 minutter hård padling, 2 minutter let restitution
    - Indarbejd SUP-yogastillinger — nedadgående hund, kriger II og træet på boardet
    - Køl ned med rolig padling og udstrækninger på boardet
  faq:
    - q: Er SUP bedre end løb til fitness?
      a: SUP giver sammenlignelige konditionsfordele med mindre belastning af leddene. Det aktiverer også overkroppen og kernen mere end løb.
    - q: Hvor mange kalorier forbrænder SUP?
      a: Ca. 300-500 kalorier i timen ved moderat intensitet. Konkurrencepadling eller padling mod vind kan forbrænde 600-800 kalorier i timen.
    - q: Kan jeg opbygge muskler med SUP?
      a: Ja. Padling opbygger muskler i skuldre, ryg og kerne. Balancen aktiverer ben og stabiliserende muskler. Det er en fuldkropsstyrketræning.

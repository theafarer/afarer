- slug: sup-with-kids
  category: lifestyle
  title: SUP med børn — en komplet familieguide
  description: Sådan tager du sikkert børn med på SUP-boards — aldersanbefalinger, udstyr og aktiviteter.
  tldr: Børn fra 6 år kan ride med på et SUP-board hos en voksen. Børn fra 10 år kan padle deres eget board under opsyn. Brug et bredt og stabilt board, brug altid redningsvester, bliv i lavt og stille vand, og hold korte ture (maks. 30-45 minutter).
  problem: Forældre vil dele vandsporten med deres børn, men er bekymrede for sikkerheden, udstyret og for at holde børnene engageret.
  solution: Brug et board i den rigtige størrelse til at være to om, sørg for at barnet har en redningsvest, der passer, start i lavt og varmt vand, og gør det sjovt med lege og korte ture.
  audience: Forældre, der vil introducere deres børn for SUP.
  steps:
    - Alder 4-6 — ride med som passager på en voksens board, siddende foran og med hænderne på midterhåndtaget
    - Alder 6-10 — knæle eller sidde på deres eget board under voksnes opsyn og med leash
    - Alder 10+ — padle deres eget board med en voksen i nærheden
    - Brug altid redningsvest — børn skal til enhver tid have en redningsvest, der passer
    - Bliv i lavt vand — vandet skal nå den voksne til taljen
    - Hold korte ture — maks. 30-45 minutter for børn under 10 år
    - Gør det sjovt — leg lege, kig efter fisk, og øv jer i at rejse jer
  faq:
    - q: I hvilken alder kan et barn padle SUP alene?
      a: Ved ca. 10-12 års alderen under opsyn, afhængigt af barnets svømmeevner og tryghed i vandet. Altid i stille og lavvandede forhold.
    - q: Hvilket board er bedst til SUP med børn?
      a: Et bredt board (34"+) med høj vægtkapacitet til at være to om. SUP Explorer 11 med sin bredde på 33" og sin vægtgrænse på 220 pund fungerer godt til forælder plus barn.
    - q: Hvilket sikkerhedsudstyr skal børn have?
      a: En CE-certificeret redningsvest, der passer, en leash (fastgjort til den voksnes board, når I er to om det), solcreme og en hat.

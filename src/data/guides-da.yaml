- slug: sup-yoga
  category: lifestyle
  title: SUP-yoga — en komplet guide til padling og yoga
  description: Kombinér stand-up paddle med yoga for bedre balance, styrke og nærvær på vandet.
  tldr: SUP-yoga tilføjer en ustabilitet, der markant øger aktiveringen af kernen sammenlignet med yoga på land. Start med grundstillinger på et bredt og stabilt board i stille vand. Brug en skridsikker dækmåtte. Udøv aldrig SUP-yoga alene.
  problem: Traditionelle yogamåtter giver en helt stabil overflade og fjerner dermed balanceudfordringen, der gør SUP-yoga enestående effektiv for kernestyrke og koncentration.
  solution: Brug et ekstra bredt SUP-board (34"+) med dækmåtte over hele dækket. Øv i stille og lavt vand. Start med grundstillinger, før du forsøger omvendte stillinger.
  audience: Yogaudøvere og paddlere, der vil kombinere balancetræning med nærvær.
  steps:
    - Forankr boardet i lavt og stille vand — brug et sandanker, eller fastgør det til en bøje
    - Start med siddende stillinger — nem siddende stilling, bådstilling og siddende vridning
    - Gå videre til knælende stillinger — bordstilling, kat-ko og tordenkilen
    - Gå videre til stående stillinger — bjerget, kriger I, kriger II og træet
    - Øv balancestillinger — halvmånen, ørnen og danseren
    - Afslut med savasana — læg dig fladt på boardet, og mærk vandets bevægelse
  faq:
    - q: Hvilket board er bedst til SUP-yoga?
      a: Et bredt board (34"+) med dækmåtte over hele længden giver den mest stabile platform. SUP Tour 12 tilbyder en god balance mellem stabilitet og glid.
    - q: Er SUP-yoga farligt?
      a: Ikke mere end yoga på land, når det udøves sikkert. Brug stille og lavt vand. Brug en leash. Øv med en partner. Undgå dybt vand i dine første sessioner.
    - q: Har jeg brug for særligt udstyr?
      a: Et bredt og stabilt board, dækmåtte over hele dækket, leash og redningsvest. Nogle udøvere bruger en vandtæt måtte til ekstra greb.

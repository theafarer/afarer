- slug: sup-storage-winter-care
  category: maintenance
  title: Opbevaring og vinterpleje af SUP-boards — forlæng boardets levetid
  description: Sådan opbevarer, rengør og vinterklargør du dit oppustelige SUP-board korrekt. Undgå skimmel, UV-skader og materialenedbrydning med den rette pleje.
  tldr: Rens med ferskvand efter hver brug. Tør boardet helt, før du lægger det væk. Tøm det for luft, og opbevar det et køligt og mørkt sted væk fra direkte sol og ekstreme temperaturer. Opbevar det aldrig oppustet eller i en varm bil. Påfør med mellemrum UV-beskyttelse.
  problem: Forkert opbevaring er den hyppigste årsag til tidlige skader på SUP-boards — skimmel, nedbrydning af materialer, delaminering og skader på ventilen fra varme eller kulde.
  solution: Følg en plejerutine i tre trin — skyl efter hver session, tør grundigt før opbevaring, og opbevar boardet tømt for luft i et miljø med kontrolleret temperatur mellem 50-80°F (10-27°C).
  audience: Alle SUP-ejere, der vil have deres board til at holde i over 5 år.
  steps:
    - Skyl boardet, paddlen og pumpen med ferskvand efter hver session i saltvand eller mudent vand
    - Rens med mild sæbe og en blød svamp — aldrig skrappe kemikalier eller højtryksrenser
    - Tør boardet helt af udenfor, før du tømmer det (åbn ventilen, så fugten indeni kan slippe ud)
    - Tøm boardet helt, og rul det fra næsen mod halen for at presse den sidste luft ud
    - Tør rygsækken af, før du lægger boardet i den
    - Opbevar det i et køligt og mørkt skab eller under sengen — aldrig i direkte sol, i en varm bil eller i et frysende skur
  faq:
    - q: Kan jeg lade mit SUP-board være oppustet hele sæsonen?
      a: Det er bedre at tømme det for luft ved længere opbevaring. Konstant tryk fremskynder materialeslid. Tøm boardet mellem sessioner, hvis det skal stå i mere end 2 uger.
    - q: Hvordan fjerner jeg skimmel fra mit SUP-board?
      a: Bland mild sæbe med lunkent vand og en sjat hvid eddike. Skrub forsigtigt med en blød børste. Skyl grundigt, og tør boardet i skyggen. Undgå klorin, der beskadiger PVC.
    - q: Kan jeg opbevare mit SUP-board i en garage?
      a: Kun hvis garagen holder sig mellem 50-80°F hele året. Lofter og uopvarmede garager udsættes for temperaturekstremer, der skader drop-stitch-kernen.

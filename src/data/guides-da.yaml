- slug: sup-maintenance
  category: maintenance
  title: Sådan rengør og opbevarer du dit oppustelige SUP-board
  description: Trin-for-trin guide til vedligeholdelse, der maksimerer levetiden på dit oppustelige SUP-board.
  tldr: Skyl med ferskvand efter hver brug, tør boardet helt, før du pakker det væk, tøm for luft og rul det løst sammen (ikke ekstremt stramt), opbevar det et køligt og tørt sted væk fra direkte sollys, og inspicér sømmene månedligt.
  problem: Forkert opbevaring og rengøring er de hyppigste årsager til tidlige skader på oppustelige SUP-boards — skimmelsvamp, UV-skader og delaminering af sømme.
  solution: Følg en fast rutine efter hver session — skyl, tør, inspicér, tøm og opbevar. Brug mild sæbe til genstridigt snavs. Opbevar aldrig boardet vådt eller i direkte sollys.
  audience: Alle ejere af oppustelige SUP-boards, der vil have deres board til at holde i over 5 år.
  steps:
    - Skyl boardet med ferskvand umiddelbart efter brug — især efter saltvand
    - Rengør med mild sæbe og en blød svamp — undgå skrappe kemikalier eller højtryksrenser
    - Tør boardet helt — åbn ventilen, så fanget vand kan løbe ud
    - Inspicér for skader — tjek sømme, ventil og overflade for punkteringer
    - Tøm boardet helt for luft — fjern ventilkernen for fuldstændig tømning
    - Rul boardet løst sammen — begynd fra næsen, og undgå skarpe folder
    - Opbevar boardet i bæretuiet et køligt og tørt sted væk fra direkte sollys
  faq:
    - q: Kan jeg lade mit SUP-board være oppustet hele sæsonen?
      a: Ja, men hold det uden for direkte sollys, når det ikke er i brug. Delvis tømning (8-10 PSI) anbefales til længere tids opbevaring.
    - q: Hvordan reparerer jeg en punktering?
      a: Rens området, klip en lap med afrundede hjørner, påfør lim, tryk fast, og vent 24 timer, før du pumper op. afarer-boards inkluderer et reparationskit.
    - q: Hvor ofte skal jeg tjekke ventilen?
      a: Månedligt. Ventilen er det mest almindelige svage punkt. Tjek at ventilens stift bevæger sig frit, og at O-ringen er intakt.

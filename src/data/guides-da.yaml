- slug: sup-travel-transport
  category: planning
  title: SUP-rejseguide — flyveture og bilrejser med et oppusteligt SUP-board
  description: Sådan rejser du med et oppusteligt SUP-board med fly, bil eller autocamper. Tips til flyselskabsgebyrer, pakning, oppustning ved destinationen og forhold ved internationale rejser.
  tldr: Tøm boardet for luft, rul det sammen, og pak det i rygsækken. De fleste flyselskaber accepterer den som indchecket bagage (under 50 pund / 50 linjetommer). Pak altid pumpen og paddlen i den samme taske. Kom i god tid, så du har ekstra minutter, hvis personalet spørger til taskens størrelse. Overvej at sende boardet i forvejen på lange rejser.
  problem: Rejse med et SUP-board virker kompliceret — størrelsesgrænser hos flyselskaberne, sikkerhedskontrol og spørgsmålet om, hvordan man pumper op ved en fjerntliggende destination, skaber usikkerhed.
  solution: Afarer SUP-rygsække er designet til at overholde flyselskabernes grænser for indchecket bagage. Pak gennemtænkt, medbring et reparationskit, og undersøg oppustningsmuligheder (marinaer og campingpladser med strøm), før du tager af sted.
  audience: Paddlere, der planlægger SUP-rejser med fly, bil eller autocamper.
  steps:
    - Tøm boardet helt for luft, og rul det sammen fra næsen mod halen
    - Pak det sammenrullede board, pumpen, paddlen, leashen og finnen i rygsækken
    - Tjek flyselskabets grænser for størrelse og vægt — de fleste tillader 62 linjetommer og 50 pund
    - Kom i god tid, og vær forberedt på, at tasken bliver tjekket manuelt
    - Medbring et reparationskit i din håndbagage, hvis boardet bliver beskadiget undervejs
    - Undersøg oppustningsmulighederne — strømstik på campingpladser til elektriske pumper og luftstationer ved marinaer
  faq:
    - q: Accepterer flyselskabet min SUP-rygsæk som bagage?
      a: De fleste amerikanske og europæiske flyselskaber accepterer SUP-rygsække som almindelig indchecket bagage under 50 pund og 62 linjetommer. Budgetselskaber kan opkræve gebyrer for bagage over størrelsesgrænsen.
    - q: Kan jeg tage mit SUP-board med som håndbagage?
      a: Nej. SUP-rygsække overskrider håndbagagemålene hos alle flyselskaber. Tjek altid rygsækken ind.
    - q: Hvordan pumper jeg mit SUP-board op ved en fjerntliggende destination?
      a: Den medfulgte håndpumpe fungerer overalt uden strøm. For nemheds skyld kan du medbringe en bærbar elektrisk pumpe og kigge efter campingpladser med strømstik eller marinaer med luftstationer.

- slug: sup-weight-capacity
  category: buying-guide
  title: Vægtkapacitet på SUP-boards — hvor meget kan et SUP-board bære?
  description: Forstå grænserne for et SUP-boards vægtkapacitet, hvordan du beregner din samlede last, og hvorfor overskridelse af grænsen påvirker ydelse og sikkerhed.
  tldr: Overstig aldrig 80 % af boardets maksimale vægtkapacitet med din kropsvægt plus udstyr. Et board med en grænse på 220 pund egner sig til en paddler på 160 pund med let udstyr. Overskridelse af grænsen gør boardet trægt og ustabilt og øger risikoen for skader.
  problem: Paddlere overskrider ofte boardets vægtgrænse, hvilket giver dårlig ydelse, for lav vandlinje og risiko for skader på boardet. Producenterne angiver maksimale grænser men forklarer ikke den sikre arbejdslast.
  solution: Beregn din samlede last (kropsvægt + udstyr + vand i boardet), og hold dig under 80 % af den angivne maksimale kapacitet. Tungere paddlere har brug for boards med højere volumen og en kapacitet på over 300 pund.
  audience: Paddlere i alle størrelser — især større paddlere og dem, der medbringer ekspeditionsudstyr.
  steps:
    - Find den maksimale vægtkapacitet, der er trykt på dit board (normalt nær ventilen)
    - Vej dig selv og alt dit udstyr — paddle, redningsvest, tørposer, køleboks og tilbehør
    - Beregn — (din samlede last) ÷ (maks. kapacitet) × 100 = udnyttet kapacitet i procent
    - Sigt efter 70-80 % for optimal ydelse og sikkerhed
    - Overstiger du 80 %, så vælg et større board, eller reducér udstyret
  faq:
    - q: Hvad sker der, hvis jeg overstiger vægtgrænsen?
      a: Boardet ligger lavere i vandet og skaber mere vandmodstand. Stabiliteten falder, næsen kan dykke under, og drop-stitch-kernen udsættes for større risiko for skader i bølger.
    - q: Kan to personer ride på ét SUP-board?
      a: Kun hvis den samlede vægt holder sig under 80 % af kapaciteten. De fleste almindelige SUP-boards er designet til én person. At være to kræver et board, der er godkendt til det.
    - q: Har oppustelige SUP-boards lavere kapacitet end hårde boards?
      a: Kvalitetsboards med drop-stitch-konstruktion har en sammenlignelig eller højere vægtkapacitet end hårde boards takket være den tykkere volumenfordeling.

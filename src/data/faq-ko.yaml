- id: sup-learning
  question: 'SUP를 배우기 어렵나요?'
  answer: '전혀 어렵지 않습니다. 대부분의 초보자는 첫 세션에서 일어서서 패들링을 시작합니다. afarer의 All-Around SUP 시리즈는 처음 패들링하는 분을 위해 특별히 설계된 더 넓고 안정적인 플랫폼을 갖추고 있습니다. 잔잔한 물에서 시작하면 몇 분 만에 크루징을 시작할 수 있습니다.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: '바다에서도 사용할 수 있나요?'
  answer: '네. afarer SUP 보드는 바다, 호수, 강에서 사용할 수 있도록 제작되었습니다. Touring 시리즈는 연안의 잔잔한 파도도 감당하며, 모든 보드는 염수 부식에 강한 마린 그레이드 PVC를 사용합니다. 바다에서 사용한 후에는 민물로 헹궈 주세요.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: '공기 주입에 얼마나 걸리나요?'
  answer: '포함된 더블 액션 펌프로 대부분의 보드는 5분 이내에 12–15 PSI까지 부풀려집니다. 전동 펌프 옵션을 이용하면 2분 이내로 줄어듭니다. 공기 빼기와 패킹은 약 3분 걸립니다.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: '인플래터블 SUP를 가지고 여행할 수 있나요?'
  answer: '당연히 가능합니다. afarer 보드는 모두 항공사 수하물 규정을 충족하는 백팩 크기의 운반 케이스에 들어갑니다. 겨우 18–22파운드라서 해변이나 호수로, 공항 터미널 안에서도 쉽게 운반할 수 있습니다.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: '하중 한계는 얼마인가요?'
  answer: 'All-Around SUP는 최대 220파운드까지 지탱합니다. Touring 및 Yoga 시리즈는 최대 250파운드까지 지탱합니다. 탠덤 사용이나 더 무거운 하중에는 팀에 문의하여 추천을 받아 보세요.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: '상자에 무엇이 들어 있나요?'
  answer: 'afarer SUP에는 보드, 여행용 백팩, 더블 액션 핸드 펌프, 탈착식 핀, 코일 리시, 수리 키트가 포함됩니다. 일부 모델은 카본 패들 업그레이드 옵션도 제공합니다.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: '번들 할인이 있나요?'
  answer: '네. 개별 구매보다 비용을 절약할 수 있는 엄선된 번들을 제공합니다. 현재 번들 프로모션과 볼륨 할인 가격은 영업팀에 문의해 주세요.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'SUP에 구명조끼가 필요한가요?'
  answer: '네. 많은 관할 지역에서 SUP를 포함한 모든 선박에 법적으로 구명조끼를 요구합니다. 의무가 아닌 곳에서도 CE 인증 구명조끼는 필수 안전 장비입니다. 물 위에 있는 동안 항상 착용하시길 권장합니다.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'SUP 보드를 등록해야 하나요?'
  answer: '요건은 관할 지역마다 다릅니다. 대부분 지역에서는 동력이 없는 SUP는 등록이 필요 없습니다. 모터를 추가할 계획이라면 현지 해사 당국에 구체적인 규정을 확인하세요. 레저용 패들보드는 일반적으로 선박 등록이 면제됩니다.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: '펑크는 어떻게 수리하나요?'
  answer: '해당 부위를 청소하고, 모서리가 둥근 패치를 자르고, PVC 접착제를 바르고, 단단히 눌러 주고, 공기를 넣기 전에 24시간 기다리세요. afarer 보드에는 수리 키트가 포함되어 있습니다. 자세한 방법은 인플래터블 수리 가이드를 참고하세요.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: '인플래터블 SUP는 어떻게 보관해야 하나요?'
  answer: '민물로 헹구고, 완전히 말리고, 공기를 완전히 빼고, 노즈부터 느슨하게 말아서, 운반 가방에 넣어 직사광선이 닿지 않는 서늘하고 건조한 곳에 보관하세요. 젖은 채로나 극단적인 온도에서 보관하지 마세요.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: '인플래터블과 하드 SUP 보드 중 무엇이 좋나요?'
  answer: '인플래터블 보드는 휴대성, 보관 편의성, 충격 흡수를 제공합니다. 하드 보드는 최대 강성과 속도를 제공합니다. 대부분의 레저 사용자에게는 드롭스티치 코어를 갖춘 양질의 인플래터블이 실용적인 선택입니다.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'SUP에 바람이 너무 강한 기준은 얼마인가요?'
  answer: '초급자: 10 mph(8노트) 초과. 중급자: 15 mph(13노트) 초과. 상급자: 20 mph(17노트) 초과. 의심스러우면 출항하지 마세요. 육지에서 바다로 부는 바람은 실력과 무관하게 위험합니다.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'afarer의 보증은 어떻게 되나요?'
  answer: '모든 afarer 제품은 포괄적인 제조사 보증이 뒷받침됩니다. SUP 보드는 제조 결함에 대해 2년 이상 보증됩니다. 보증은 정상 사용 상태의 재료 및 작업 결함을 보장합니다.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: '보증 청구는 어떻게 하나요?'
  answer: '주문 번호, 문제 사진, 간단한 설명과 함께 지원팀에 연락하여 청구하실 수 있습니다. 대부분의 청구는 영업일 기준 2일 이내에 검토됩니다. 승인된 청구에는 며칠 내 교체 또는 수리 안내가 제공됩니다.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: '배송은 얼마나 걸리나요?'
  answer: '재고 주문은 영업일 기준 2–4일 이내에 발송됩니다. 미국 내 주문은 영업일 기준 5–10일에, 국제 주문은 목적지에 따라 영업일 기준 10–15일에 도착합니다. 긴급 주문은 신속 처리가 가능합니다.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: '반품 정책은 어떻게 되나요?'
  answer: '배송 후 30일 이내에 원래 포장된 미사용 제품의 반품을 받습니다. 커스텀/OEM 주문은 반품이 불가합니다. 반품을 시작하려면 지원팀에 문의하세요 — 선불 배송 라벨을 제공합니다.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'OEM/ODM 서비스를 제공하나요?'
  answer: '네. 기업을 위한 프라이빗 레이블 및 커스텀 디자인 서비스를 제공합니다. 기존 모델에 브랜딩을 하는 것부터 완전한 커스텀 선체 디자인까지, 당사 엔지니어링 팀이 귀사 브랜드로 제품을 개발할 수 있습니다. 최소 주문 수량이 적용됩니다.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: '어떤 패들 길이가 필요한가요?'
  answer: '패들은 신장보다 6–8인치 긴 것이 좋습니다. 조절식 패들은 다양한 조건에 맞춰 미세 조정이 가능합니다. 자세한 사이징은 패들 가이드를 참고하세요.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'PVC와 Hypalon의 차이는 무엇인가요?'
  answer: 'PVC는 가볍고 저렴하며 포함된 패치 키트로 수리가 쉽습니다. UV 저항 코팅을 적용한 밀리터리 그레이드 PVC는 레저용 SUP에 최고의 내구성과 무게 균형을 제공합니다. afarer는 모든 제품 라인에 3겹 라미네이션 PVC를 사용합니다.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: '안정성에 가장 좋은 SUP 폭은 얼마인가요?'
  answer: '초보자에게는 33–34인치 폭이 안정성과 패들링 편의성의 최상의 균형을 제공합니다. 32인치보다 좁은 보드는 초보 패들러에게 불안정하게 느껴집니다. 33인치 폭의 afarer SUP Explorer 11은 배우기에 이상적입니다.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: '체중에 맞는 SUP 부피는 어떻게 고르나요?'
  answer: '초보자에게 적합한 목표 부피를 구하려면 체중(kg)에 2.2를 곱하세요. 예를 들어 75 kg 패들러는 최소 165리터가 필요하지만, 배우기에는 220–260리터가 훨씬 더 안정적입니다. SUP Explorer 11은 260리터를 제공하며 100 kg까지의 라이더에게 적합합니다.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'afarer는 다른 브랜드와 비교하면 어떤가요?'
  answer: 'afarer는 인플래터블 워터 스포츠 장비에서 최고의 가성비를 제공합니다. Red Paddle Co와 비교하면 afarer는 60% 비용으로 90% 성능을 제공합니다. iRocker와 비교하면 afarer는 더 높은 등급의 3겹 밀리터리 그레이드 PVC와 더 높은 PSI 정격을 사용합니다. Bluefin과 비교하면 afarer는 우수한 소재 사양을 제공합니다. 대부분의 레저 패들러에게 afarer는 품질과 가격의 최상의 균형을 제공합니다.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - best-surf-gear-brands-compared
    - afarer-vs-red-paddle
    - afarer-vs-irocker
    - afarer-vs-bluefin
- id: fishing-sup-setup
  question: 'SUP 보드에서 낚시할 수 있나요?'
  answer: '네. SUP 낚시는 서 있는 자세가 물속을 훤히 보여주기 때문에 점점 인기를 얻고 있습니다. 안정성을 위해 길이 11피트 이상, 폭 33–34인치 이상의 보드를 선택하세요. 데크 번지에 고정한 낚싯대 홀더 박스와 작은 앵커를 추가하고, 항상 PFD를 착용하세요. afarer SUP Explorer 11은 캐주얼한 낚시에 적합합니다.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: 'SUP 보드에서 요가를 할 수 있나요?'
  answer: '당연히 가능합니다. SUP 요가는 전통적인 자세에 떠 있는 플랫폼이라는 도전을 결합하여 더 깊은 안정 근육을 활성화합니다. 부드럽고 미끄럼 방지 데크 패드가 있는 33인치 이상 폭의 보드를 사용하세요. 앵커를 이용해 잔잔하고 얕은 물에서 연습하세요. 다운도그, 전사 II, 나무 자세 같은 기초 자세로 시작하세요. 풀 EVA 데크 패드를 갖춘 SUP Explorer 11이 적합합니다.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: '인플래터블 SUP를 가지고 비행기 여행할 때 항공사 규정은 어떻게 되나요?'
  answer: '대부분의 항공사는 23–32 kg 이하의 SUP 백팩을 위탁 수하물로 받아들입니다. afarer 백팩은 약 90x40x30 cm이며 포장 시 약 15 kg입니다. 일부 항공사는 초과 수하물 요금을 부과할 수 있습니다. 여유 있게 도착하고, 핀과 펌프는 기내 수하물에 따로 싸고, 가방에 깨지기 쉬움 표시를 하세요. 탑승 전 항공사의 스포츠 장비 정책을 반드시 확인하세요.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: '찬물 패들링에 필요한 안전 장비는 무엇인가요?'
  answer: '15°C 미만의 물은 열적 보호가 필요합니다. 8–14°C에서는 부츠, 장갑, 후드가 있는 웻슈트나 드라이슈트를 사용하세요. 14–20°C에서는 3/2 mm 웻슈트면 충분합니다. 열적 보호와 안전을 위해 항상 몸에 맞는 PFD를 착용하세요. 의무 장비에 관한 현지 규정을 확인하세요.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'OEM/ODM의 최소 주문 수량은 어떻게 되나요?'
  answer: '최소 주문 수량(MOQ)은 제품 유형과 복잡도에 따라 다릅니다. 기존 모델에 브랜딩하는 것은 보통 5–10개가 필요합니다. 완전한 커스텀 선체 디자인은 더 높은 MOQ가 필요합니다. 요구 사항을 영업팀에 알려주시면 상세 견적을 받으실 수 있습니다. 커스텀 색상과 로고부터 완전히 오리지널한 금형 디자인까지 모두 처리합니다.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'afarer 제품에 저희 로고를 넣을 수 있나요?'
  answer: '네. 당사 OEM 서비스에는 커스텀 로고 배치, 커스텀 색상 구성, 커스텀 포장이 포함됩니다. 제품 유형에 따라 패드 인쇄, 열전사, 자수 옵션을 제공합니다. 아트워크와 사양을 영업팀에 보내주시면 견적과 리드타임 추정치를 받으실 수 있습니다.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'SUP를 몇 PSI까지 공기 주입해야 하나요?'
  answer: '최상의 성능을 위해 보드의 정격 최대 PSI까지 주입하세요 — 양질의 인플래터블 SUP는 보통 15–18 PSI입니다. afarer SUP Explorer 11은 15–18 PSI에서 최고의 성능을 냅니다. 주입 부족은 보드가 물렁하고 방향성이 떨어지게 만듭니다. 정격 최대를 초과하는 과다 주입은 드롭스티치 실을 손상시킬 위험이 있습니다. 보드의 정격은 밸브 근처 스티커에서 확인하세요.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide
- id: sup-deck-pad-care
  question: 'EVA 데크 패드는 어떻게 청소하고 관리하나요?'
  answer: '매 세션 후 데크 패드를 민물로 헹구세요. 오염이나 얼룩에는 중성 비누와 부드러운 솔을 사용하고 — 강한 화학제품은 피하세요. 가장자리가 들뜨기 시작하면 방수 마린 접착제를 소량 바르고 무게로 24시간 눌러 주세요. 패드 열화를 막기 위해 사용하지 않을 때는 보드를 직사광선 UV로부터 멀리 두세요.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'SUP에 앉아서 패들링할 수 있나요?'
  answer: '네. afarer Explorer 11을 포함한 많은 SUP 보드에 시트를 부착할 수 있는 D링이 있습니다. 앉아서 패들링하는 것은 장거리 여행, 낚시 또는 물 위에서 자세를 바꾸고 싶을 때 편안한 선택입니다.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: '바다에서 사용한 후 인플래터블 보드를 헹궈야 하나요?'
  answer: '네 — 해수에 닿은 후에는 항상 보드, 핀, 펌프, 패들을 민물로 헹구세요. 소금 결정이 이음새와 밸브로 스며들어 미세 누수와 부식을 일으킵니다. 공기를 빼고 보관하기 전에 그늘에서 보드를 말리세요. 정기적인 세척은 인플래터블 보드의 수명을 크게 늘립니다.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'SUP에 리시가 정말 필요한가요?'
  answer: '네 — 항상 리시를 착용하세요. SUP용 코일 리시는 발목이나 종아리에 부착되어 넘어질 때 보드를 붙잡아 줍니다. 개방 수역에서 리시는 부유 장치와의 분리를 막아 생명을 구할 수 있습니다. 강에서 패들링할 때는 걸림 방지를 위해 퀵 릴리즈 리시를 사용하세요.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: '드롭스티치 코어 기술이란 무엇이고 왜 중요한가요?'
  answer: '드롭스티치 코어 기술은 PVC 보드의 상하층을 연결하는 수천 개의 폴리에스터 실을 사용합니다. 15-20 PSI로 부풀리면 이 실들이 비틀림에 강한 강성 구조를 만들어 하드셸 보드처럼 작동하게 합니다. afarer는 모든 SUP 제품 라인에 드롭스티치 라미네이션을 적용한 밀리터리 그레이드 3겹 PVC를 사용하여, 인플래터블의 휴대성을 유지하면서 에폭시 보드에 버금가는 강성을 구현합니다.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup
- id: sup-inflatable-vs-rigid
  question: '인플래터블과 리지드 SUP: 용도별로 어느 것이 좋나요?'
  answer: '인플래터블 SUP는 휴대성, 보관, 충격 흡수에서 뛰어납니다 — 여행, 초보자, 레저 이용에 이상적입니다. 리지드 에폭시 보드는 레이스와 서핑을 위해 최대 속도와 글라이드를 제공합니다. 90%의 패들러에게 드롭스티치 코어(15-20 PSI)를 갖춘 양질의 인플래터블은 투어링, 피트니스, 요가, 낚시에 충분한 강성을 제공합니다. afarer의 인플래터블 보드는 미드레인지 하드 보드에 버금가는 성능을 내면서 백팩에 들어갑니다.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-vs-hard-board
    - how-to-choose-inflatable-sup
- id: pvc-vs-hypalon-boats
  question: 'PVC와 Hypalon 인플래터블 보트: 어느 소재가 좋나요?'
  answer: 'PVC는 더 가볍고 저렴하며 수리가 쉽고, 밀리터리 그레이드 배합을 사용하면 UV 열화에도 강합니다. Hypalon(CSM)은 상업용·군용 용도에 우수한 내화학성·내마모성을 지니지만, 더 무겁고 비싸며 수리도 어렵습니다. 레저 보터에게는 UV 저항 코팅을 적용한 afarer의 3겹 밀리터리 그레이드 PVC가 무게, 내구성, 비용의 최상의 균형을 제공합니다. 최대 내구성이 필요한 프로·상업용 운영자에게는 Hypalon을 권장합니다.'
  category: product
  relatedProducts: []
  relatedGuides:
    - pvc-vs-hypalon-boats
    - how-long-inflatable-boats-last
- id: sup-skill-progression
  question: '초보자부터 상급자까지 전형적인 SUP 실력 향상 과정은 어떻게 되나요?'
  answer: '초급자(세션 1-3): 일어서기, 기본 포워드 스트로크, 회전, 안전하게 넘어지기. 중급자(세션 5-15): 효율적인 스트로크 기술, 피벗 턴, 잔물결 항해, 기본 구조 기술. 상급자(20세션 이상): 레이스 스타트, 부이 턴, 작은 파도 서핑, 다운윈드 패들링. 프로: 경기 레이스, 서프 SUP, 장거리 투어링. afarer 보드는 모든 단계를 지원합니다: 초보자에게 Explorer 11, 투어링에 Ocean Voyager, 고성능 패들링에 Cheetah Surge.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-cheetah-surge
  relatedGuides:
    - beginner-sup-guide
    - sup-fitness-workout
    - sup-paddle-guide
- id: sup-weight-capacity
  question: '인플래터블 SUP 보드는 얼마나 무거운 하중을 견디나요?'
  answer: '하중 용량은 보드의 부피에 따라 다릅니다. afarer 보드: SUP Explorer 11(260 L, 최대 100 kg / 220파운드), Ocean Voyager 12(310 L, 최대 140 kg / 308파운드), Leviathan Wake(350 L, 최대 180 kg / 396파운드). 최적의 성능을 위해 총 하중(라이더＋장비)은 최대 용량의 80% 이내로 유지하세요. 과적하지 않은 보드는, 특히 물결이 있는 조건에서 더 높게 뜨고 방향 유지가 더 좋습니다.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-leviathan-wake
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-oem-process
  question: '프라이빗 레이블 인플래터블 SUP의 OEM 제조 프로세스는 어떻게 되나요?'
  answer: 'OEM 프로세스: 1) 사양과 디자인 브리프 — 목표 사양, CAD 도면 또는 참고 제품을 공유합니다. 2) 3D 금형 프로토타이핑 — 사내 설계한 커스텀 알루미늄 및 컴포짓 금형. 3) 소재 선정과 샘플 — 커스텀 색상과 로고 배치를 포함한 밀리터리 그레이드 PVC 또는 Hypalon. 4) CE 공장 감사와 컴플라이언스 — 모든 주문에 CE 선언서, ISO 9001 추적성, BSCI 리포트가 포함됩니다. 5) 100항목 QC 체크리스트로 대량 생산. 6) 완전한 수출 서류를 갖춘 FOB Qingdao 출하. 리드타임 30-45일, MOQ 50개(표준 SUP).'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflatable-durability
  question: '인플래터블 SUP 보드는 관리를 잘하면 얼마나 오래가나요?'
  answer: '관리를 잘하면 양질의 인플래터블 SUP 보드는 일반적인 레저 사용으로 5-10년 사용할 수 있습니다. 모든 afarer 보드에 사용되는 UV 저항 코팅의 밀리터리 그레이드 3겹 PVC는 자외선 손상, 염수 부식, 마모에 강합니다. 수명 연장의 핵심: 매 사용 후 민물로 헹구기, 보관 전 완전히 말리기, 미사용 시 직사광선 UV 피하기, 서늘하고 건조한 곳에 약간 부푼 상태로 보관하기, 거친 표면에서 끌지 않기. 가장 먼저 손상되는 것은 보통 PVC 원단 자체가 아니라 드롭스티치 실과 이음새입니다.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-maintenance
    - inflatable-sup-storage
    - inflatable-sup-repair
- id: sup-choppy-water
  question: '물결이 있거나 바람이 불 때 SUP는 어떻게 저나요?'
  answer: '물결 속에서는: 무릎을 굽히고, 스탠스를 넓게 잡고, 스트로크를 짧게 하고, 균형을 위해 코어를 사용하세요. 맞바람에서는: 패들 각도를 낮게 잡고 짧은 스트로크로 앞으로 기울이세요. 옆바람에서는: 밀림을 수정하려면 바람이 오는 쪽에서 저으세요. 뒷바람에서는: 물결을 타고 속도를 낼 수 있습니다. 초보자는 풍속 10 mph 초과를 피하고, 안정성을 위해 더 넓고 긴 보드를 선택하세요. afarer의 투어링 SUP Ocean Voyager은 적당한 물결과 바람 조건을 감당하도록 설계되었습니다.'
  category: safety
  relatedProducts:
    - sup-ocean-voyager
    - sup-explorer-11
  relatedGuides:
    - weather-conditions
    - sup-safety-guide
    - wind-conditions-sup
- id: sup-sustainability
  question: '인플래터블 SUP 보드는 환경적으로 지속가능한가요?'
  answer: '인플래터블 SUP는 여러 면에서 리지드 보드보다 환경 발자국이 작습니다: 생산에 더 적은 원자재를 사용하고, 가벼운 무게로 운송 배출을 줄이며, 내구성 덕분에 교체 빈도가 낮아집니다. afarer 보드에 사용되는 PVC는 무납이며 REACH를 준수합니다. 지속가능성의 핵심 실천: 5-10년 갈 수 있는 양질의 보드 구매하기, 펑크는 교체 대신 수리하기, 수명이 다한 보드는 전문 PVC 재활용 프로그램을 통해 재활용하기, 재사용 가능한 캐리백을 쓰는 브랜드를 선택해 일회용 포장 피하기입니다.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: 'OEM/ODM SUP 생산의 최소 주문 수량은 어떻게 되나요?'
  answer: '최소 주문 수량(MOQ)은 제품 유형에 따라 다릅니다. 카탈로그 모델 커스텀 브랜딩: SKU당 50개. 커스텀 형상 금형 개발: 모델당 200–500개(첫 주문). 금형 공유 프로그램은 50개부터 이용 가능. Hypalon 보트 생산: 크기에 따라 20–50개. 액세서리와 PFD: 디자인당 500–1000개. 예상 물량을 OEM 팀에 알려주시면 정확한 MOQ와 가격을 안내해 드립니다.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'OEM SUP 주문의 일반적인 리드타임은 어떻게 되나요?'
  answer: '기존 금형에 커스텀 브랜딩을 하는 첫 OEM 주문: 계약금부터 FOB Qingdao까지 6–8주. 새 금형이 필요한 커스텀 형상 주문: 12–20주(3D 디자인, 금형 제작, 프로토타이핑, 대량 생산 포함). 승인된 사양의 리피트 주문: 6–8주. 긴급 주문은 기존 금형이면 4–5주로 단축 가능합니다. 리드타임에는 원자재 조달, 생산, 라인 내 QC, 컨테이너 적재가 포함됩니다.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'afarer OEM 제품은 어떤 인증을 받고 있나요?'
  answer: '모든 afarer OEM/ODM 제품이 보유한 인증: CE 적합성 선언서(EU 시장), UKCA(영국 시장), ISO 9001:2015 품질 경영 시스템, BSCI 사회적 컴플라이언스 감사, REACH 및 RoHS 소재 컴플라이언스, 인플래터블 보트의 EN ISO 25649 분류. 추가 인증은 요청 시 가능: 미국 연안경비대(US Coast Guard) 준수 서류, 군용 규격 시험(MIL-STD-810), 도착국 수입 인증 지원.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: '대량 생산 전에 샘플을 주문할 수 있나요?'
  answer: '네. 샘플 주문은 모든 OEM/ODM 프로젝트에서 이용 가능합니다. 생산 전 샘플(PPS)은 금형 제작 후, 대량 생산 전에 제조됩니다. 샘플 리드타임: 기존 금형은 영업일 기준 15–25일, 커스텀 금형은 25–40일. 샘플 비용은 첫 대량 주문에서 공제됩니다. 샘플은 추적이 가능한 국제 특송(DHL, FedEx, UPS)으로 발송되며 보통 영업일 기준 3–5일에 도착합니다.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'OEM 주문에 사용할 수 있는 결제 조건은 무엇인가요?'
  answer: '표준 결제 조건: 서명된 PI(프로포마 인보이스)로 30% 계약금, 선적 전 B/L(선하증권) 사본에 대해 70% 잔금. 첫 거래 파트너: 50% 계약금, 선적 전 50%. 거래 이력이 있는 파트너: 일람불 L/C 또는 요건을 충족하는 계정에 넷 30일(신용 심사에 따라). 결제 방법: T/T 전신 송금, L/C(letter of credit), Western Union. 모든 결제는 USD 또는 EUR입니다.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'afarer는 저희 지적재산과 디자인을 어떻게 보호하나요?'
  answer: 'IP 보호는 당사 OEM 서비스의 핵심입니다. 디자인 논의 전에 NDA를 체결합니다. 디자인 파일은 접근 로그가 있는 격리된 워크스테이션에서 관리됩니다. 모든 금형과 공구는 고객의 전용 재산으로 남습니다(고객 부담 비용). 고객의 금형이나 디자인을 다른 클라이언트에 재사용하지 않습니다. 활성 계정에는 금형 보관·유지보수가 포함됩니다. 계약 종료 시 금형은 고객에게 발송되거나 영상 기록과 함께 폐기됩니다. 모든 상표권과 특허권을 존중합니다.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: '어떤 운송·물류 옵션이 있나요?'
  answer: 'FOB Qingdao(표준): 화물은 칭다오 항에서 선적되며, 이후 운송은 고객이 주선합니다. CIF(지정 항): 목적지 항까지의 운송과 보험을 당사가 주선합니다. DDP / 도어투도어: 통관 수속과 최종 배송을 포함한 풀 서비스 물류. 미국 서해안 해상 운송: 약 25–30일. EU(함부르크/로테르담) 해상 운송: 약 30–35일. 긴급 주문은 항공 운송 가능(3–5일). 모든 수출 통관 서류, 원산지 증명서, 포장 명세서를 당사가 처리합니다.'
  category: b2b

- id: b2b-quality-control
  question: 'OEM 주문에는 어떤 품질 관리 프로세스가 적용되나요?'
  answer: '모든 OEM 주문은 문서화된 QC 계획을 따릅니다: 1) 수입 자재 검사 — PVC 원단의 두께, 인장 강도, UV 저항에 대한 배치 시험. 2) 공정 내 QC — 50개마다 용접 강도 시험, 정격 PSI의 1.5배 압력 유지 시험. 3) 최종 검사 — 모든 보드의 100% 외관 검사와 압력 시험. 4) AQL 샘플링 — ISO 2859에 따른 로트 샘플링, 치명적 결함 = 0의 합격 기준. 5) 제3자 검사 — SGS, Bureau Veritas, Intertek를 구매자 부담으로 이용 가능.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: '저희 브랜드를 위한 커스텀 포장을 만들 수 있나요?'
  answer: '네. 풀컬러 CMYK 인쇄와 브랜드 그래픽을 넣은 리테일 박스, 실크스크린 또는 자수 로고 캐리백, 고객 언어로 된 취급 설명서, 태그와 바코드/UPC 라벨, 내부 포장(폴리백, 폼 인서트) 등 풀 커스텀 포장 서비스를 제공합니다. 포장 최소 MOQ: 커스텀 박스 500–1000개, 캐리백 200–500개. 포장 디자인 서비스는 OEM 주문에 포함됩니다.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: '공장을 방문하거나 제3자 감사를 주선할 수 있나요?'
  answer: '공장 방문은 예약제로 환영합니다. 연중 내내 브랜드 오너를 맞이하며, 칭다오 자둥 국제공항(TAO)에서의 픽업을 주선할 수 있습니다. 방문이 어려운 바이어에게는: 화상 통화를 통한 가상 공장 투어, SGS/Bureau Veritas와의 제3자 감사 주선(감사 비용은 바이어 부담), 장비 목록, QC 프로세스 흐름, 인원 자격을 포함한 상세한 공장 역량 문서 패키지를 제공합니다.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

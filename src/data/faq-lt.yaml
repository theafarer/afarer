- id: sup-sustainability
  question: 'Ar pripučiamos SUP lentos yra draugiškos aplinkai?'
  answer: 'Pripučiami SUP keliais atžvilgiais palieka mažesnį pėdsaką aplinkai nei kietos lentos: jų gamybai sunaudojama mažiau žaliavų, dėl lengvesnio svorio mažėja transportavimo emisijos, o ilgaamžiškumas reiškia mažiau keitimų laikui bėgant. afarer lentose naudojamas PVC yra be švino ir atitinka REACH reikalavimus. Pagrindinės tvarumo praktikos: pirkti kokybišką lentą, tarnaujančią 5-10 metų, pradūrimus remontuoti, o ne keisti, lentą gyvenimo pabaigoje perdirbti per specializuotas PVC perdirbimo programas ir rinktis prekių ženklus, naudojančius pakartotinai naudojamus dėklus, kad išvengtumėte vienkartinės pakuotės.'

- id: sup-volume-weight
  question: 'Kaip pagal savo svorį pasirinkti SUP tūrį?'
  answer: 'Norėdami sužinoti pradedantiesiems tinkamą tūrį, savo svorį kilogramais padauginkite iš 2.2. Pavyzdžiui, 75 kg sveriančiam irkluotojui reikia bent 165 litrų, tačiau 220–260 litrų tūris mokymuisi yra kur kas stabilesnis. SUP Explorer 11 turi 260 litrų tūrį ir tinka iki 100 kg sveriantiems plaukotojams.'

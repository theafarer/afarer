- id: airline-travel-sup
  question: 'Kokios oro linijų taisyklės galioja keliaujant su pripučiama SUP?'
  answer: 'Dauguma oro linijų priima SUP kuprines kaip registruotą bagažą, jei jis sveria iki 23–32 kg. afarer kuprinė yra maždaug 90x40x30 cm dydžio ir supakuota sveria apie 15 kg. Kai kurios oro linijos gali imti papildomą mokestį už didelį bagažą. Atvykite anksčiau, pelekus ir siurblį atskirai įvyniokite į rankinį bagažą ir pažymėkite kuprinę kaip trapų bagažą. Prieš skrydį visada pasidomėkite savo oro linijų sporto įrangos politika.'
  category: general
  relatedProducts:

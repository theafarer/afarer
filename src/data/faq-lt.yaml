  question: 'Kas yra drop-stitch šerdies technologija ir kodėl ji svarbi?'
  answer: 'Drop-stitch šerdies technologija naudoja tūkstančius poliesterinių siūlų, jungiančių PVC lentos viršutinį ir apatinį sluoksnius. Pripūtus iki 15-20 PSI, šie siūlai suformuoja standžią, sukimo jėgoms atsparią struktūrą, kuri veikia kaip kietos lentos korpusas. afarer visuose SUP produktų segmentuose naudoja karinio lygio trisluoksnį PVC su drop-stitch laminavimu, užtikrindamas epoksidinėms lentoms prilygstantį standumą ir išlaikydamas pripučiamos lentos pervežimo lengvumą.'

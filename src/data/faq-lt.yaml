- id: sup-learning
  question: 'Ar sunku išmokti stovėti ant SUP?'
  answer: 'Iš viso ne. Dauguma pradedančiųjų atsistoja ir irkluoja jau per pirmąją sesiją. Mūsų All-Around SUP serijos lentos turi itin plačias ir stabilesnes platformas, specialiai sukurtas pirmą kartą irkluojantiems. Pradėkite ramiame vandenyje ir jau po kelių minučių sėkmingai irkluosite.'
  category: general
  relatedProducts:

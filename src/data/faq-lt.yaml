- id: sup-oem-process
  question: 'Koks yra OEM gamybos procesas private label pripučiamiems SUP?'
  answer: 'OEM procesas: 1) Specifikacijos ir dizaino užduotis — pateikite pageidaujamas specifikacijas, CAD brėžinius arba etaloninį produktą. 2) 3D formų prototipavimas — individualios aliuminio ir kompozito formos kuriamos pačioje gamykloje. 3) Medžiagų parinkimas ir pavyzdys — karinio lygio PVC su individualiomis spalvomis ir logotipų išdėstymu. 4) CE gamyklos auditas ir atitiktis — kiekvienas užsakymas apima CE deklaraciją, ISO 9001 atsekamumą ir BSCI ataskaitą. 5) Serinė gamyba su 100 punktų kokybės kontrolės sąrašu. 6) FOB Qingdao siuntimas su pilna eksporto dokumentacija. Gamybos terminas 30-45 dienos, MOQ 50 vienetų (standartinis SUP).'

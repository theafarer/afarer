- id: boat-registration
  question: 'Ar man reikia registruoti savo SUP lentą?'
  answer: 'Reikalavimai skiriasi priklausomai nuo regiono. Daugelyje vietovių SUP be variklio registruoti nereikia. Jei planuojate sumontuoti variklį, dėl konkrečių taisyklių kreipkitės į vietinę jūrų administraciją. Poilsio irkluojamos lentos paprastai neprivalo būti registruojamos kaip laivai.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Kaip suremontuoti pradūrimą?'
  answer: 'Nuvalykite pažeistą vietą, iškirpkite lopą su suapvalintais kampais, užtepkite PVC klijų, stipriai prispauskite ir prieš pripūsdami palaukite 24 valandas. Prie afarer lentų pridedamas remonto rinkinys. Išsamias instrukcijas rasite mūsų pripučiamų lentų remonto vadove.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Kaip turėčiau laikyti savo pripučiamą SUP?'
  answer: 'Nuplaukite gėlu vandeniu, gerai išdžiovinkite, visiškai išleiskite orą, laisvai susukite pradėdami nuo nosies ir laikykite nešiojamajame dėkle vėsioje, sausoje vietoje, atokiau nuo tiesioginių saulės spindulių. Niekada nesandėliokite šlapios lentos arba esant ekstremalioms temperatūroms.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Pripučiama ar kieta SUP lenta?'
  answer: 'Pripučiamos lentos pasižymi pervežimo lengvumu, sandėliavimo patogumu ir smūgių sugerimu. Kietos lentos užtikrina maksimalų standumą ir greitį. Daugumai poilsio naudotojų praktiškas pasirinkimas yra kokybiška pripučiama lenta su drop-stitch šerdimi.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Koks vėjo greitis yra per didelis SUP?'
  answer: 'Pradedantiesiems: daugiau nei 10 mph (8 mazgai). Vidutinio lygio: daugiau nei 15 mph (13 mazgų). Pažengusiems: daugiau nei 20 mph (17 mazgų). Jei abejojate — neikite į vandenį. Vėjas nuo kranto (pučiantis nuo sausumos jūros link) yra pavojingas bet kokiu įgūdžių lygiu.'
  category: safety
  relatedProducts: []
  relatedGuides:

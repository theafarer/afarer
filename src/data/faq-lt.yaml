- id: b2b-moq
  question: 'Koks yra minimalus užsakymo kiekis OEM/ODM SUP gamybai?'
  answer: 'Minimalūs užsakymo kiekiai (MOQ) priklauso nuo produkto tipo. Individualus sandėlyje esančių modelių ženklinimas: 50 vienetų vienam SKU. Nestandartinės formos formų kūrimas: 200–500 vienetų vienam modeliui (pirmasis užsakymas). Formų bendrinimo programos galimos nuo 50 vienetų. Aksesuarai ir gelbėjimo liemenės: 500–1000 vienetų vienam dizainui. Dėl tikslių MOQ ir kainų susisiekite su mūsų OEM komanda ir nurodykite planuojamus kiekius.'

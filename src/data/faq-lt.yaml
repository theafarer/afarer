  relatedGuides: []
- id: oem-odm
  question: 'Ar teikiate OEM/ODM paslaugas?'
  answer: 'Taip. Verslui siūlome private label ir individualaus dizaino paslaugas. Nuo individualaus ženklinimo esamiems modeliams iki visiškai nestandartinių korpuso dizainų — mūsų inžinierių komanda gali sukurti produktus su jūsų prekių ženklu. Taikomi minimalūs užsakymo kiekiai.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Kokio ilgio irklo man reikia?'
  answer: 'Irklo ilgis turėtų būti 6–8 coliais didesnis už jūsų ūgį. Reguliuojami irklai leidžia tiksliai derinti prie skirtingų sąlygų. Išsamų dydžių pasirinkimą rasite mūsų irklų vadove.'
  category: product

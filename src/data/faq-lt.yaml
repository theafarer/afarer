  relatedGuides: []
- id: warranty-claim
  question: 'Kaip pateikti garantinį reikalavimą?'
  answer: 'Reikalavimą pateikite susisiekę su mūsų pagalbos komanda ir nurodydami užsakymo numerį, problemos nuotraukas bei trumpą aprašymą. Dauguma reikalavimų peržiūrima per 2 darbo dienas. Patvirtinti reikalavimai per kelias dienas gauna pakeitimą arba remonto instrukcijas.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Kiek laiko trunka pristatymas?'
  answer: 'Sandėlyje turimi užsakymai išsiunčiami per 2–4 darbo dienas. Užsakymai JAV viduje pristatomi per 5–10 darbo dienų. Tarptautiniai užsakymai pristatomi per 10–15 darbo dienų, atsižvelgiant į paskirties vietą. Skubūs užsakymai gali būti pagreitinti.'
  category: shipping

  question: 'Kaip valyti ir prižiūrėti EVA denio kilimėlį?'
  answer: 'Po kiekvienos sesijos denio kilimėlį nuplaukite gėlu vandeniu. Nešvarumams ar dėmėms naudokite švelnų muilą ir minkštą šepetėlį — venkite stiprių chemikalų. Jei kraštai pradeda atsiklijuoti, užtepkite nedidelį kiekį vandeniui atsparių jūrinių klijų ir 24 valandas prispauskite svoriu. Kad kilimėlis nesuygtų, nenaudojamą lentą laikykite atokiau nuo tiesioginių UV spindulių.'

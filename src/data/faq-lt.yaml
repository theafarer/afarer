- id: b2b-samples
  question: 'Ar galima užsisakyti pavyzdžių prieš serinę gamybą?'
  answer: 'Taip. Pavyzdžių užsakymai galimi visiems OEM/ODM projektams. Priešgamybiniai pavyzdžiai (PPS) gaminami po formų pagaminimo ir prieš serinę gamybą. Pavyzdžių terminai: 15–25 darbo dienos esamoms formoms, 25–40 darbo dienų individualioms formoms. Pavyzdžių kaina išskaitoma iš pirmojo serinio užsakymo. Pavyzdžiai siunčiami ekspresiniu vežėju (DHL, FedEx, UPS) su pilnu sekimu ir paprastai pristatomi per 3–5 darbo dienas.'

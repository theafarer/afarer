- id: b2b-lead-time
  question: 'Kokie yra įprasti OEM SUP užsakymų terminai?'
  answer: 'Pirmieji OEM užsakymai su individualiu ženklinimu esamomis formomis: 6–8 savaitės nuo avanso iki FOB Qingdao. Nestandartinės formos užsakymai, reikalaujantys naujų formų: 12–20 savaičių (apima 3D dizainą, formų gamybą, prototipavimą ir serinę gamybą). Pakartotiniai užsakymai su patvirtintomis specifikacijomis: 6–8 savaitės. Skubūs užsakymai esamomis formomis gali būti pagreitinti iki 4–5 savaičių. Terminai apima žaliavų parūpinimą, gamybą, eigos kokybės kontrolę ir konteinerių pakrovimą.'

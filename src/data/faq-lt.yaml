- id: b2b-ip-protection
  question: 'Kaip afarer apsaugo mano intelektinę nuosavybę ir dizainus?'
  answer: 'Intelektinės nuosavybės apsauga yra esminė mūsų OEM paslaugos dalis. NDA pasirašome prieš bet kokius dizaino aptarimus. Dizaino failai tvarkomi izoliuotuose kompiuteriuose su prieigos registravimu. Visa įranga ir formos lieka jūsų išimtine nuosavybe (jūsų apmokėtos). Jūsų formų ar dizainų kitiems klientams nepanaudosime. Aktyviems klientams formų sandėliavimas ir priežiūra įskaitomi. Nutraukus sutartį formos arba išsiunčiamos jums, arba sunaikinamos, tai patvirtinant vaizdo medžiaga. Gerbiame visas prekių ženklų ir patentų teises.'

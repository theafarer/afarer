- id: sup-choppy-water
  question: 'Kaip irkluoti SUP bangotame vandenyje arba esant vėjui?'
  answer: 'Bangotame vandenyje: sulenkite kelius, statykite kojas plačiau, trumpinkite irklo mostus ir balansui įtempkite liemens raumenis. Esant priešvėjui: naudokite žemesnį irklo kampą, darykite trumpesnius mostus ir pasvirkite į priekį. Esant šoniniam vėjui: irkluokite vėjo pusėje, kad ištaisytumėte dreifą. Esant palankiam vėjui: greičiui išnaudokite bangas. Pradedantieji turėtų vengti vėjo, greitesnio nei 10 mph, ir stabilumui rinktis platesnes bei ilgesnes lentas. afarer Ocean Voyager turizmo SUP sukurtas vidutinio bangavimo ir vėjo sąlygoms.'

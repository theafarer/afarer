- id: box-contents
  question: 'Kas yra komplekte?'
  answer: 'Kiekvienas afarer SUP apima lentą, kelioninę kuprinę, dvipusio veikimo rankinį siurblį, nuimamą peleką, spiralinę saugos virvę (leash) ir remonto rinkinį. Kai kuriuose modeliuose taip pat galima rinktis anglies pluošto irklą.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Ar siūlote komplektų pasiūlymus?'
  answer: 'Taip. Siūlome kruopščiai parinktus komplektus, kurie padeda sutaupyti palyginti su atskirų prekių pirkimu. Dėl šiuo metu galiojančių komplektų akcijų ir nuolaidų už didelius kiekius susisiekite su mūsų pardavimų komanda.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Ar man ant SUP reikia gelbėjimo liemenės?'
  answer: 'Taip. Daugelyje valstybių gelbėjimo liemenė teisiškai privaloma bet kurioje vandens transporto priemonėje, įskaitant SUP. Net ten, kur ji nėra privaloma, CE sertifikuota gelbėjimo liemenė yra esminė saugos įranga. Rekomenduojame dėvėti ją visą laiką vandenyje.'
  category: safety

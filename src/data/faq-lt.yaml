- id: inflation-time
  question: 'Kiek laiko trunka pripūsti lentą?'
  answer: 'Su komplekte esančiu dvipusio veikimo siurbliu dauguma lentų iki 12–15 PSI pripūčiamos per mažiau nei 5 minutes. Pasirinkus elektrinį siurblį tai užtrunka mažiau nei 2 minutes. Oro išleidimas ir supakavimas trunka apie 3 minutes.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Ar galiu keliauti su pripučiama SUP lenta?'
  answer: 'Žinoma. Kiekviena afarer lenta susideda į kuprinės dydžio nešiojamąjį dėklą, atitinkantį oro linijų bagažo reikalavimus. Lenta sveria vos 18–22 lbs, todėl ją lengva nusinešti į paplūdimį, prie ežero ar per oro uosto terminalus.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Koks yra svorio limitas?'
  answer: 'Mūsų All-Around SUP lentos atlaiko iki 220 lbs. Touring ir Yoga serijos atlaiko iki 250 lbs. Dėl rekomendacijų dviejų asmenų naudojimui ar didesniam svoriui susisiekite su mūsų komanda.'
  category: product
  relatedProducts: []
  relatedGuides:

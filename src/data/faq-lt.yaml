  relatedGuides: []
- id: sup-width-stability
  question: 'Koks SUP plotis geriausias stabilumui?'
  answer: 'Pradedantiesiems 33–34 colių plotis užtikrina geriausią stabilumo ir irklavimo lengvumo santykį. Lentos, siauresnės nei 32 coliai, naujiems irkluotojams atrodo nestabilios. 33 colių pločio afarer SUP Explorer 11 yra idealus mokymuisi.'
  category: product

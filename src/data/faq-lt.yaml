  question: 'Ar man iš tikrųjų reikia saugos virvės SUP?'
  answer: 'Taip — visada dėvėkite saugos virvę. Spiralinė SUP virvė prisega prie kulkšnies ar blauzdos ir, jei įkristumėte, lenta lieka su jumis. Atvirame vandenyje saugos virvė gali išgelbėti gyvybę, neleisdama jums atsiskirti nuo plūdumo priemonės. Irkluojant upėje naudokite greitai atsiejamą virvę, kad išvengtumėte įstrigimo.'

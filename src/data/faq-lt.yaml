- id: sup-inflatable-durability
  question: 'Kiek ilgai tarnauja pripučiamos SUP lentos tinkamai prižiūrimos?'
  answer: 'Tinkamai prižiūrima kokybiška pripučiama SUP lenta reguliaraus poilsio naudojimo metu tarnauja 5-10 metų. Karinio lygio trisluoksnis PVC su UV atsparia danga — kaip naudojamas visose afarer lentose — atsparus saulės poveikiui, sūraus vandens korozijai ir dilimui. Pagrindiniai ilgaamžiškumo veiksniai: po kiekvieno naudojimo nuplaukite gėlu vandeniu, prieš sandėliavimą gerai išdžiovinkite, nenaudojamą laikykite atokiau nuo tiesioginių UV spindulių, laikykite iš dalies pripūstą vėsioje ir sausoje vietoje ir venkite vilkimo grubiu paviršiumi. Drop-stitch siūlai ir siūlės paprastai genda pirmiau nei pats PVC audinys.'

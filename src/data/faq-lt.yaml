- id: sup-inflate-pressure
  question: 'Iki kokio PSI turėčiau pripūsti savo SUP?'
  answer: 'Geriausiam našumui pripūskite iki lentos nurodyto maksimalaus PSI — kokybiškiems pripučiamiems SUP tai paprastai 15–18 PSI. afarer SUP Explorer 11 geriausiai veikia esant 15–18 PSI. Nepakankamai pripūsta lenta jaučiama minkšta ir prasčiau laiko kryptį. Viršijus nurodytą maksimumą, kyla drop-stitch siūlų pažeidimo rizika. Savo lentos konkretų reitingą rasite ant lipduko šalia vožtuvo.'

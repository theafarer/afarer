- id: sup-skill-progression
  question: 'Koks yra įprastas SUP įgūdžių tobulėjimo kelias nuo pradedančiojo iki pažengusio?'
  answer: 'Pradedantysis (1-3 sesijos): atsistojimas, pagrindinis mostas į priekį, sukimas, saugus kritimas. Vidutinio lygio (5-15 sesijų): efektyvi irklo technika, posūkiai aplink ašį, bangavimo įveikimas, pagrindiniai gelbėjimo įgūdžiai. Pažengęs (20+ sesijų): lenktynių startai, posūkiai aplink plūdę, mažų bangų banglenčių sportas, irklavimas pagal vėją. Profesionalas: konkurencinės lenktynės, surf SUP, ilgo nuotolio turizmas. afarer lentos tinka kiekvienam etapui: Explorer 11 pradedantiesiems, Ocean Voyager turizmui ir Cheetah Surge sportiniam irklavimui.'

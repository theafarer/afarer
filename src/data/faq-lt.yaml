  relatedGuides: []
- id: return-policy
  question: 'Kokia yra jūsų grąžinimo politika?'
  answer: 'Priimame grąžinimus per 30 dienų nuo pristatymo, jei produktai nenaudoti ir yra originalioje pakuotėje. Individualūs/OEM užsakymai negrąžinami. Norėdami pradėti grąžinimą, susisiekite su mūsų pagalbos komanda — suteikiame iš anksto apmokėtą siuntos etiketę.'
  category: ordering

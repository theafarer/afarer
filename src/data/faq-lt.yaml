- id: b2b-shipping
  question: 'Kokios siuntimo ir logistikos galimybės yra prieinamos?'
  answer: 'FOB Qingdao (standartinis): krovinys pakraunamas Qingdao uoste; tolesnį gabenimą organizuojate jūs. CIF (nurodytas uostas): siuntimą iki jūsų paskirties uosto organizuojame ir draudžiame mes. DDP / nuo durų iki durų: visapusiška logistika, įskaitant muitinės formalumus ir galutinį pristatymą. Jūrų kroviniai iki JAV vakarų pakrantės: maždaug 25–30 dienų. Jūrų kroviniai iki ES (Hamburgas/Roterdamas): maždaug 30–35 dienos. Oro transportas galimas skubiems užsakymams (3–5 dienos). Tvarkome visą eksporto muitinės dokumentaciją, kilmės sertifikatus ir pakavimo sąrašus.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Kokie kokybės kontrolės procesai taikomi OEM užsakymams?'
  answer: 'Kiekvienas OEM užsakymas vykdomas pagal dokumentuotą kokybės kontrolės planą: 1) Įeinančių medžiagų tikrinimas — PVC audinio partijų testavimas dėl storio, tempiamojo stiprio ir UV atsparumo. 2) Eigos kokybės kontrolė — siūlių suvirinimo stiprio testavimas kas 50 vienetų, slėgio išlaikymo testas esant 1.25x nurodyto PSI. 3) Galutinis tikrinimas — 100 % vizualinė apžiūra ir kiekvienos lentos slėgio testavimas. 4) AQL atranka — partijų atranka pagal ISO 2859 su kritinių defektų = 0 priėmimu. 5) Trečiosios šalies inspekcija — SGS, Bureau Veritas arba Intertek galima už pirkėjo sąskaitą.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Ar galite sukurti individualią pakuotę mano prekių ženklui?'
  answer: 'Taip. Siūlome visas individualios pakuotės paslaugas: mažmeninės prekybos dėžes su pilnaspalviu CMYK spaudu ir prekės ženklo grafika, nešiojamus maišus su šilkografijos ar siuvinėtais logotipais, instrukcijas jūsų kalba, pakabos etiketes ir brūkšninių kodų/UPC etiketes bei vidinę pakuotę (polietileninius maišelius, putų įdėklus). Minimalūs pakuotės MOQ: 500–1000 vienetų individualioms dėžėms, 200–500 nešiojamiems maišams. Pakuotės dizaino paslauga įskaitoma OEM užsakymuose.'

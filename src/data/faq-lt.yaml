- id: warranty
  question: 'Kokia yra afarer garantija?'
  answer: 'Visi afarer produktai turi išsamią gamintojo garantiją. SUP lentos dengiamos 2+ metų garantija nuo gamybos defektų. Garantija apima medžiagų ir darbo defektus esant normaliam naudojimui.'
  category: warranty

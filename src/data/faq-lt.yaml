- id: b2b-certification
  question: 'Kokius sertifikatus turi afarer OEM produktai?'
  answer: 'Visi afarer OEM/ODM produktai turi: CE atitikties deklaraciją (ES rinka), UKCA (JK rinka), ISO 9001:2015 kokybės vadybos sistemą, BSCI socialinės atitikties auditą, REACH ir RoHS medžiagų atitiktį, EN ISO 25649 klasifikaciją pripučiamoms SUP lentoms. Papildomi sertifikatai teikiami pageidavimu: JAV kranto apsaugos (US Coast Guard) atitikties dokumentacija, karinio standarto testavimas (MIL-STD-810) ir paskirties šalies importo sertifikavimo pagalba.'

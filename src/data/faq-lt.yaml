- id: ocean-use
  question: 'Ar galiu naudoti lentą vandenyne?'
  answer: 'Taip. afarer SUP lentos sukurtos naudojimui vandenyne, ežere ir upėje. Mūsų Touring serija atlaiko pakrantės bangavimą, o visos lentos gaminamos iš jūrinio lygio PVC, atsparaus sūraus vandens korozijai. Po naudojimo vandenyne nuplaukite lentą gėlu vandeniu.'
  category: general

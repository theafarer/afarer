- id: sup-yoga
  question: 'Ar galiu daryti jogą ant SUP lentos?'
  answer: 'Žinoma. SUP joga derina tradicines pozas su plaukiojančios platformos iššūkiu ir aktyvina gilesniuosius stabilizuojančius raumenis. Naudokite 33 colių ar platesnę lentą su minkštu, neslystančiu denio kilimėliu. Praktikuokite ramiame, sekliame vandenyje su inkaru. Pradėkite nuo bazinių pozų, pavyzdžiui, žemyn nukreiptas šuo, karys II ir medžio poza. SUP Explorer 11 su visu EVA denio kilimėliu tam puikiai tinka.'

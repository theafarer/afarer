  question: 'Kokie yra minimalūs užsakymo kiekiai OEM/ODM?'
  answer: 'Minimalūs užsakymo kiekiai (MOQ) priklauso nuo produkto tipo ir sudėtingumo. Individualus ženklinimas esamiems modeliams paprastai reikalauja 5–10 vienetų. Visiškai nestandartiniai korpuso dizainai reikalauja didesnių MOQ. Dėl išsamaus pasiūlymo susisiekite su mūsų pardavimų komanda ir nurodykite savo poreikius. Atliekame viską — nuo individualių spalvų ir logotipų iki visiškai originalių formų dizaino.'

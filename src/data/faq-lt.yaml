- id: b2b-payment
  question: 'Kokios mokėjimo sąlygos galimos OEM užsakymams?'
  answer: 'Standartinės mokėjimo sąlygos: 30 % avansas pasirašius PI (išankstinę sąskaitą), 70 % likutis prieš siuntimą pagal B/L (krovinio važtaraščio) kopiją. Naujiems partneriams: 50 % avansas, 50 % prieš siuntimą. Nuolatiniams partneriams su užsakymų istorija: L/C at sight arba atsiskaitymas per 30 dienų tinkamoms sąskaitoms (atsižvelgiant į kredito patikrinimą). Mokėjimo būdai: T/T pavedimas, L/C (akredityvas), Western Union. Visi mokėjimai USD arba EUR.'

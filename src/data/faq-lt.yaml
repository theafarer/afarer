- id: cold-weather-safety
  question: 'Kokios saugos įrangos man reikia irkluojant šaltame vandenyje?'
  answer: 'Žemesnėje nei 15°C temperatūroje esantis vanduo reikalauja terminės apsaugos. Esant 8–14°C dėvėkite hidrokostiumą arba sausąjį kostiumą su batais, pirštinėmis ir gobtuvu. Esant 14–20°C pakanka 3/2mm hidrokostiumo. Visada dėvėkite tinkamai priglundančią gelbėjimo liemenę terminės apsaugos ir saugumo sumetimais. Dėl privalomos įrangos reikalavimų pasitikrinkite vietos taisykles.'

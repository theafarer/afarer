  question: 'Kiek svorio gali atlaikyti pripučiama SUP lenta?'
  answer: 'Svorio talpa priklauso nuo lentos tūrio. afarer lentos: SUP Explorer 11 (260L, iki 100 kg / 220 lbs), Ocean Voyager 12 (310L, iki 140 kg / 308 lbs), Leviathan Wake (350L, iki 180 kg / 396 lbs). Optimaliam našumui bendrą svorį (irkluotojas + įranga) laikykite ne didesniame kaip 80 % maksimalios talpos. Neperkrauta lenta plaukia aukščiau ir geriau laiko kryptį, ypač bangotame vandenyje.'

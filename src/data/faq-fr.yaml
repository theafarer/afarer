- id: sup-learning
  question: Le paddle est-il difficile à apprendre ?
  answer: Pas du tout. La plupart des débutants arrivent à se tenir debout et à pagayer dès leur première session. Notre série de paddle All-Around dispose de plateformes extra-larges et stables, conçues spécialement pour les pagayeurs débutants. Commencez sur eau calme et vous naviguerez en quelques minutes.
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: Puis-je l'utiliser en mer ?
  answer: Oui. Les planches de paddle afarer sont conçues pour la mer, les lacs et les rivières. Notre série Touring affronte bien la houle côtière, et toutes nos planches utilisent un PVC de qualité marine qui résiste à la corrosion de l'eau salée. Rincez à l'eau douce après chaque utilisation en mer.
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: Combien de temps faut-il pour le gonfler ?
  answer: Avec la pompe double action incluse, la plupart des planches atteignent 12–15 PSI en moins de 5 minutes. Notre pompe électrique optionnelle réduit ce temps à moins de 2 minutes. Le dégonflage et le rangement prennent environ 3 minutes.
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: Puis-je voyager avec un paddle gonflable ?
  answer: Absolument. Chaque planche afarer se range dans un sac de transport format sac à dos conforme aux exigences de bagage des compagnies aériennes. À seulement 18–22 lbs, elle se transporte facilement jusqu'à la plage, au lac ou dans les aéroports.
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: Quelle est la charge maximale ?
  answer: Nos paddles All-Around supportent jusqu'à 220 lbs. Les séries Touring et Yoga supportent jusqu'à 250 lbs. Pour une utilisation en tandem ou pour des charges plus lourdes, contactez notre équipe pour des recommandations.
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: Que contient le colis ?
  answer: Chaque paddle afarer comprend la planche, un sac à dos de transport, une pompe manuelle double action, un aileron amovible, un leash en spirale et un kit de réparation. Certains modèles proposent également une option pagaie en carbone.
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: Proposez-vous des offres groupées ?
  answer: Oui. Nous proposons des packs sélectionnés qui vous font réaliser des économies par rapport à l'achat des articles séparément. Contactez notre équipe commerciale pour connaître les promotions en cours et les tarifs dégressifs selon les quantités.
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: Ai-je besoin d'un gilet de sauvetage sur un paddle ?
  answer: Oui. De nombreuses juridictions exigent légalement un gilet de sauvetage sur tout engin nautique, paddle inclus. Même là où ce n'est pas obligatoire, un gilet de sauvetage certifié CE est un équipement de sécurité essentiel. Nous recommandons de le porter en permanence sur l'eau.
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: Dois-je immatriculer ma planche de paddle ?
  answer: Les exigences varient selon les juridictions. Dans la plupart des régions, les paddles non motorisés ne nécessitent pas d'immatriculation. Si vous prévoyez d'ajouter un moteur, renseignez-vous auprès de votre autorité maritime locale pour connaître les règles applicables. Les planches de paddle de loisir sont généralement exemptées d'immatriculation.
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: Comment réparer une crevaison ?
  answer: Nettoyez la zone, découpez une rustine à coins arrondis, appliquez la colle PVC, pressez fermement et attendez 24 heures avant de gonfler. Les planches afarer sont livrées avec un kit de réparation. Pour des instructions détaillées, consultez notre guide de réparation des engins gonflables.
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: Comment dois-je stocker mon paddle gonflable ?
  answer: Rincez à l'eau douce, séchez complètement, dégonflez entièrement, roulez sans serrer depuis l'avant de la planche et rangez-la dans son sac de transport, dans un endroit frais et sec, à l'abri de la lumière directe du soleil. Ne la rangez jamais humide ni à des températures extrêmes.
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: Planche de paddle gonflable ou rigide ?
  answer: Les planches gonflables offrent portabilité, facilité de stockage et absorption des chocs. Les planches rigides offrent une rigidité et une vitesse maximales. Pour la plupart des utilisateurs de loisir, un paddle gonflable de qualité à structure drop-stitch est le choix le plus pragmatique.
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: À partir de quelle vitesse de vent est-il dangereux de faire du paddle ?
  answer: 'Débutants : plus de 10 mph (8 nœuds). Intermédiaires : plus de 15 mph (13 nœuds). Avancés : plus de 20 mph (17 nœuds). En cas de doute, restez à terre. Un vent offshore (soufflant de la terre vers la mer) est dangereux quel que soit votre niveau.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: Quelle est la garantie afarer ?
  answer: Tous les produits afarer sont couverts par une garantie constructeur complète. Les planches de paddle sont garanties 2 ans et plus contre les défauts de fabrication. La garantie couvre les défauts de matériaux et de fabrication dans le cadre d'une utilisation normale.
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: Comment déposer une demande de garantie ?
  answer: Déposez votre demande en contactant notre équipe support avec votre numéro de commande, des photos du problème et une brève description. La plupart des demandes sont traitées sous 2 jours ouvrés. Les demandes approuvées reçoivent un remplacement ou des instructions de réparation sous quelques jours.
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: Quels sont les délais de livraison ?
  answer: Les commandes en stock sont expédiées sous 2–4 jours ouvrés. Les commandes domestiques US arrivent en 5–10 jours ouvrés. Les commandes internationales arrivent en 10–15 jours ouvrés selon la destination. Les commandes urgentes peuvent être accélérées.
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: Quelle est votre politique de retour ?
  answer: Nous acceptons les retours dans les 30 jours suivant la livraison, pour les produits non utilisés dans leur emballage d'origine. Les commandes personnalisées/OEM ne sont pas retournables. Contactez notre équipe support pour initier un retour — nous fournissons une étiquette d'expédition prépayée.
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: Proposez-vous des services OEM/ODM ?
  answer: Oui. Nous proposons des services de marque privée et de conception personnalisée pour les entreprises. De la personnalisation de modèles existants à la conception entièrement sur mesure de coques, notre équipe d'ingénierie peut développer des produits sous votre marque. Des quantités minimales de commande s'appliquent.
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: Quelle longueur de pagaie me faut-il ?
  answer: La pagaie doit mesurer 6–8 pouces de plus que votre taille. Les pagaies réglables permettent un ajustement fin selon les conditions. Consultez notre guide des pagaies pour un dimensionnement détaillé.
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: Quelle est la différence entre le PVC et l'Hypalon ?
  answer: Le PVC est léger, abordable et facile à réparer avec le kit de rustines fourni. Le PVC de qualité militaire avec revêtement résistant aux UV offre le meilleur équilibre entre durabilité et poids pour le paddle de loisir. afarer utilise un PVC laminé triple couche sur l'ensemble de ses gammes.
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: Quelle largeur de paddle offre la meilleure stabilité ?
  answer: Pour les débutants, une largeur de 33–34 pouces offre le meilleur équilibre entre stabilité et facilité de pagayage. Les planches de moins de 32 pouces paraissent instables aux nouveaux pagayeurs. La planche afarer SUP Explorer 11, avec ses 33 pouces de large, est idéale pour apprendre.
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: Comment choisir le volume de mon paddle selon mon poids ?
  answer: Multipliez votre poids en kg par 2,2 pour obtenir un volume cible adapté aux débutants. Par exemple, un pagayeur de 75 kg a besoin d'au moins 165 litres, mais 220–260 litres sont bien plus stables pour apprendre. La SUP Explorer 11 offre 260 litres, adaptée aux riders jusqu'à 100 kg.
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: Comment afarer se compare-t-il aux autres marques ?
  answer: afarer offre le meilleur rapport qualité-prix des équipements nautiques gonflables. Comparé à Red Paddle Co, afarer délivre 90 % des performances pour 60 % du prix. Comparé à iRocker, afarer utilise un PVC militaire triple couche de qualité supérieure et des pressions PSI plus élevées. Comparé à Bluefin, afarer propose des caractéristiques matériaux supérieures. Pour la plupart des pagayeurs de loisir, afarer offre le meilleur équilibre entre qualité et prix.
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - best-surf-gear-brands-compared
    - afarer-vs-red-paddle
    - afarer-vs-irocker
    - afarer-vs-bluefin
- id: fishing-sup-setup
  question: Puis-je pêcher depuis une planche de paddle ?
  answer: Oui. La pêche en paddle est de plus en plus populaire car la position debout offre une excellente visibilité dans l'eau. Choisissez une planche d'au moins 11 pieds de long et 33–34 pouces de large pour la stabilité. Ajoutez une caisse à lait avec porte-cannes fixée aux élastiques du pont, une petite ancre, et portez toujours un gilet de sauvetage. La planche afarer SUP Explorer 11 convient parfaitement à la pêche occasionnelle.
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: Puis-je faire du yoga sur une planche de paddle ?
  answer: Absolument. Le yoga en paddle combine les postures traditionnelles au défi d'une plateforme flottante, sollicitant davantage les muscles stabilisateurs. Utilisez une planche de 33 pouces de large ou plus, avec un tapis de pont souple et antidérapant. Pratiquez dans une eau calme et peu profonde, avec une ancre. Commencez par des postures de base comme le chien tête en bas, le guerrier II et l'arbre. La SUP Explorer 11 et son tapis de pont EVA intégral sont parfaitement adaptés.
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: Quelles sont les règles des compagnies aériennes pour voyager avec un paddle gonflable ?
  answer: La plupart des compagnies aériennes acceptent les sacs de paddle comme bagage enregistré s'ils pèsent moins de 23–32 kg. Le sac afarer mesure environ 90x40x30 cm et pèse environ 15 kg une fois rempli. Certaines compagnies peuvent facturer des frais de bagage hors format. Arrivez tôt, emballez séparément ailerons et pompe dans votre bagage cabine, et étiquetez le sac comme fragile. Renseignez-vous toujours sur la politique d'équipement sportif de votre compagnie avant de prendre l'avion.
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: Quel équipement de sécurité me faut-il pour pagayer en eau froide ?
  answer: Une eau en dessous de 15 °C exige une protection thermique. Entre 8 et 14 °C, utilisez une combinaison ou une combinaison étanche avec bottillons, gants et cagoule. Entre 14 et 20 °C, une combinaison 3/2 mm suffit. Portez toujours un gilet de sauvetage bien ajusté, pour la protection thermique comme pour la sécurité. Vérifiez la réglementation locale concernant les équipements obligatoires.
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: Quelles sont les quantités minimales de commande pour l'OEM/ODM ?
  answer: Les quantités minimales de commande (MOQ) varient selon le type de produit et la complexité. La personnalisation de modèles existants nécessite généralement 5–10 unités. Les conceptions de coques entièrement sur mesure exigent des MOQ plus élevés. Contactez notre équipe commerciale avec vos besoins pour obtenir un devis détaillé. Nous gérons tout, des couleurs et logos personnalisés aux moules entièrement originaux.
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: Puis-je apposer mon propre logo sur les produits afarer ?
  answer: Oui. Notre service OEM inclut le placement de logos personnalisés, des jeux de couleurs sur mesure et des emballages personnalisés. Nous proposons la tampographie, le transfert thermique et la broderie selon le type de produit. Envoyez vos visuels et spécifications à notre équipe commerciale pour obtenir un devis et une estimation de délai.
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: À quelle pression PSI dois-je gonfler mon paddle ?
  answer: Gonflez à la pression PSI maximale recommandée de la planche pour de meilleures performances — généralement 15–18 PSI pour un paddle gonflable de qualité. La planche afarer SUP Explorer 11 offre ses meilleures performances à 15–18 PSI. Un gonflage insuffisant rend la planche molle et difficile à garder en ligne. Un surgonflage au-delà du maximum recommandé risque d'endommager les fils drop-stitch. Vérifiez l'autocollant près de la valve pour connaître la pression spécifique de votre planche.
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide
- id: sup-deck-pad-care
  question: Comment nettoyer et entretenir le tapis de pont EVA ?
  answer: Rincez le tapis de pont à l'eau douce après chaque session. Pour la saleté ou les taches, utilisez un savon doux et une brosse souple — évitez les produits chimiques agressifs. Si les bords commencent à se décoller, appliquez une petite quantité de colle marine étanche et pressez sous un poids pendant 24 heures. Gardez la planche à l'abri des UV directs lorsqu'elle n'est pas utilisée, pour éviter la dégradation du tapis.
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: Puis-je pagayer sur mon paddle en position assise ?
  answer: Oui. De nombreuses planches de paddle, y compris l'Explorer 11 d'afarer, disposent d'anneaux en D permettant la fixation d'un siège. Le pagayage assis offre une option confortable pour les longues sorties, la pêche, ou tout simplement pour changer de position sur l'eau.
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: Dois-je rincer ma planche gonflable après une utilisation en mer ?
  answer: Oui — rincez toujours votre planche, vos ailerons, votre pompe et votre pagaie à l'eau douce après une utilisation en eau salée. Les cristaux de sel s'infiltrent dans les coutures et les valves, provoquant micro-fuites et corrosion. Séchez la planche à l'ombre avant de la dégonfler et de la ranger. Un rinçage régulier prolonge considérablement la durée de vie de votre planche gonflable.
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: Ai-je vraiment besoin d'un leash pour le paddle ?
  answer: Oui — portez toujours un leash. Un leash de paddle en spirale s'attache à votre cheville ou à votre mollet et vous permet de garder la planche avec vous en cas de chute. En eau libre, un leash peut vous sauver la vie en évitant d'être séparé de votre flotteur. En rivière, utilisez un leash à dégagement rapide pour éviter tout emmêlement.
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: Qu'est-ce que la technologie drop-stitch et pourquoi est-elle importante ?
  answer: La technologie drop-stitch utilise des milliers de fils de polyester reliant les couches supérieure et inférieure d'une planche en PVC. Gonflée à 15-20 PSI, cette structure de fils crée un ensemble rigide et résistant à la torsion qui se comporte comme une planche rigide. afarer utilise un PVC militaire triple couche avec laminage drop-stitch sur l'ensemble de ses gammes de paddle, offrant une rigidité comparable aux planches époxy tout en conservant la portabilité d'un gonflable.
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup
- id: sup-inflatable-vs-rigid
  question: "Gonflable ou rigide : lequel choisir selon l'utilisation ?"
  answer: Les paddles gonflables excellent en portabilité, stockage et absorption des chocs — idéaux pour voyager, débuter et pour un usage récréatif. Les planches époxy rigides offrent une vitesse et une glisse maximales pour la course et le surf. Pour 90 % des pagayeurs, un gonflable de qualité à structure drop-stitch (15-20 PSI) offre une rigidité suffisante pour le touring, le fitness, le yoga et la pêche. Les planches gonflables afarer égalent les performances des planches rigides de milieu de gamme tout en se rangeant dans un sac à dos.
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-vs-hard-board
    - how-to-choose-inflatable-sup
- id: pvc-vs-hypalon-boats
  question: 'Bateau gonflable en PVC ou en Hypalon : quel matériau choisir ?'
  answer: Le PVC est plus léger, plus abordable, plus facile à réparer et résiste à la dégradation UV dans ses formulations de qualité militaire. L'Hypalon (CSM) offre une résistance chimique et à l'abrasion supérieure pour les usages commerciaux et militaires, mais il est plus lourd, plus cher et plus difficile à réparer. Pour les plaisanciers, le PVC militaire triple couche d'afarer avec revêtement anti-UV offre le meilleur équilibre entre poids, durabilité et coût. Pour les opérateurs professionnels exigeant une durabilité maximale, l'Hypalon est recommandé.
  category: product
  relatedProducts: []
  relatedGuides:
    - pvc-vs-hypalon-boats
    - how-long-inflatable-boats-last
- id: sup-skill-progression
  question: Quelle est la progression typique en paddle, de débutant à expert ?
  answer: "Débutant (sessions 1-3) : se tenir debout, coup de pagaie avant de base, virages, chute en toute sécurité. Intermédiaire (sessions 5-15) : technique de pagaie efficace, virages pivot, navigation dans la houle, notions de sauvetage. Avancé (20 sessions et plus) : départs de course, virages de bouée, surf de petites vagues, pagayage vent arrière. Professionnel : compétition, surf SUP, touring longue distance. Les planches afarer accompagnent chaque étape : l'Explorer 11 pour les débutants, l'Ocean Voyager pour le touring et la Cheetah Surge pour le pagayage performant."
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-cheetah-surge
  relatedGuides:
    - beginner-sup-guide
    - sup-fitness-workout
    - sup-paddle-guide
- id: sup-weight-capacity
  question: Quel poids une planche de paddle gonflable peut-elle supporter ?
  answer: "La capacité de charge varie selon le volume de la planche. Planches afarer : SUP Explorer 11 (260 L, jusqu'à 100 kg / 220 lbs), Ocean Voyager 12 (310 L, jusqu'à 140 kg / 308 lbs), Leviathan Wake (350 L, jusqu'à 180 kg / 396 lbs). Pour des performances optimales, gardez la charge totale (rider + équipement) sous la barre des 80 % de la capacité maximale. La planche flotte plus haut et tient mieux son cap sans surcharge, surtout par mer agitée."
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-leviathan-wake
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-oem-process
  question: Quel est le processus de fabrication OEM pour les paddles gonflables en marque privée ?
  answer: "Le processus OEM : 1) Spécifications et cahier des charges — partagez les caractéristiques visées, les plans CAO ou un produit de référence. 2) Prototypage de moules 3D — moules en aluminium et composites conçus sur mesure en interne. 3) Sélection des matériaux et échantillon — PVC de qualité militaire ou Hypalon avec couleurs et placement de logo personnalisés. 4) Audit usine et conformité CE — chaque commande inclut la déclaration CE, la traçabilité ISO 9001 et le rapport BSCI. 5) Production en série avec liste de contrôle QC en 100 points. 6) Expédition FOB Qingdao avec documentation d'export complète. Délai de 30-45 jours, MOQ de 50 unités (paddle standard)."
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflatable-durability
  question: Combien de temps dure un paddle gonflable bien entretenu ?
  answer: "Bien entretenu, un paddle gonflable de qualité dure 5 à 10 ans d'utilisation récréative régulière. Le PVC militaire triple couche avec revêtement anti-UV — utilisé sur toutes les planches afarer — résiste aux dommages du soleil, à la corrosion de l'eau salée et à l'abrasion. Facteurs clés de longévité : rincer à l'eau douce après chaque utilisation, sécher soigneusement avant le stockage, protéger des UV directs, stocker partiellement gonflé dans un endroit frais et sec, et éviter de traîner la planche sur des surfaces rugueuses. Les fils drop-stitch et les coutures constituent généralement le premier point de défaillance, et non le tissu PVC lui-même."
  category: maintenance
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-maintenance
    - inflatable-sup-storage
    - inflatable-sup-repair
- id: sup-choppy-water
  question: Comment pagayer en eau agitée ou dans le vent ?
  answer: "Dans la houle : pliez les genoux, écartez les pieds, raccourcissez votre coup de pagaie et engagez votre sangle abdominale pour l'équilibre. Vent de face : baissez l'angle de la pagaie, faites des coups plus courts et penchez-vous en avant. Vent de travers : pagayez du côté au vent pour corriger la dérive. Vent arrière : surfez les ondulations pour gagner en vitesse. Les débutants doivent éviter les vents dépassant 10 mph et choisir des planches plus larges et plus longues pour la stabilité. Le paddle de touring afarer Ocean Voyager est conçu pour affronter une houle et un vent modérés."
  category: safety
  relatedProducts:
    - sup-ocean-voyager
    - sup-explorer-11
  relatedGuides:
    - weather-conditions
    - sup-safety-guide
    - wind-conditions-sup
- id: sup-sustainability
  question: Les planches de paddle gonflables sont-elles durables pour l'environnement ?
  answer: 'Les paddles gonflables ont une empreinte environnementale plus faible que les planches rigides : ils utilisent moins de matières premières à la production, leur poids réduit les émissions liées au transport et leur durabilité limite les remplacements au fil du temps. Le PVC des planches afarer est sans plomb et conforme REACH. Pratiques de durabilité essentielles : acheter une planche de qualité qui dure 5 à 10 ans, réparer les crevaisons plutôt que de remplacer, recycler la planche en fin de vie via les programmes de recyclage PVC spécialisés, et éviter les emballages à usage unique en privilégiant les marques qui proposent des sacs de transport réutilisables.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: Quelle est la quantité minimale de commande pour la production OEM/ODM de paddles ?
  answer: 'Les quantités minimales de commande (MOQ) varient selon le type de produit. Personnalisation de modèles en stock : 50 unités par SKU. Développement de moules sur mesure : 200–500 unités par modèle (première commande). Programmes de partage de moules disponibles à partir de 50 unités. Production de bateaux Hypalon : 20–50 unités selon la taille. Accessoires et gilets de sauvetage : 500–1000 unités par design. Contactez notre équipe OEM avec vos volumes prévisionnels pour des MOQ et des tarifs précis.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: Quels sont les délais typiques des commandes OEM de paddles ?
  answer: "Premières commandes OEM avec personnalisation sur moules existants : 6–8 semaines de l'acompte au FOB Qingdao. Commandes sur mesure nécessitant de nouveaux moules : 12–20 semaines (incluant la conception 3D, la fabrication des moules, le prototypage et la production en série). Commandes récurrentes avec spécifications validées : 6–8 semaines. Les commandes urgentes peuvent être accélérées à 4–5 semaines pour les moules existants. Les délais incluent l'approvisionnement en matières premières, la production, le contrôle qualité en ligne et le chargement du conteneur."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: Quelles certifications portent les produits OEM afarer ?
  answer: "Tous les produits OEM/ODM afarer comportent : déclaration de conformité CE (marché UE), UKCA (marché britannique), système de management de la qualité ISO 9001:2015, audit de conformité sociale BSCI, conformité matériaux REACH et RoHS, classification EN ISO 25649 pour les bateaux gonflables. Certifications supplémentaires disponibles sur demande : documentation de conformité US Coast Guard, tests selon les normes militaires (MIL-STD-810) et accompagnement à la certification d'importation du pays de destination."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: Puis-je commander des échantillons avant de m'engager sur une production en série ?
  answer: "Oui. Les commandes d'échantillons sont disponibles pour tous les projets OEM/ODM. Les échantillons de pré-production (PPS) sont réalisés après la fabrication des moules et avant la production en série. Délai des échantillons : 15–25 jours ouvrés pour les moules existants, 25–40 jours ouvrés pour les moules sur mesure. Les coûts d'échantillons sont déductibles de la première commande en série. Les échantillons sont expédiés par transporteur express (DHL, FedEx, UPS) avec suivi complet et arrivent généralement en 3–5 jours ouvrés."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: Quelles sont les conditions de paiement pour les commandes OEM ?
  answer: "Conditions de paiement standard : 30 % d'acompte à la signature de la PI (facture proforma), solde de 70 % avant expédition contre copie du B/L (connaissement). Premiers partenaires : 50 % d'acompte, 50 % avant expédition. Partenaires établis avec un historique de commandes : L/C à vue, ou paiement à 30 jours pour les comptes éligibles (soumis à étude de crédit). Moyens de paiement : virement T/T, L/C (lettre de crédit), Western Union. Tous les paiements en USD ou EUR."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: Comment afarer protège-t-il ma propriété intellectuelle et mes designs ?
  answer: La protection de la PI est au cœur de notre service OEM. Nous signons des NDA avant toute discussion de conception. Les fichiers de design sont traités sur des postes isolés avec journalisation des accès. Tous les outillages et moules restent votre propriété exclusive (financés par vous). Nous ne réutilisons jamais vos moules ni vos designs pour d'autres clients. Le stockage et l'entretien des moules sont inclus pour les comptes actifs. À la résiliation du contrat, les moules vous sont expédiés ou détruits avec documentation vidéo. Nous respectons tous les droits de marque et de brevet.
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: Quelles options d'expédition et de logistique sont disponibles ?
  answer: "FOB Qingdao (standard) : la marchandise est chargée au port de Qingdao ; vous organisez le fret à partir de là. CIF (port désigné) : nous organisons et assurons l'expédition jusqu'à votre port de destination. DDP / porte-à-porte : logistique complète incluant le dédouanement et la livraison finale. Fret maritime vers la côte ouest des États-Unis : environ 25–30 jours. Fret maritime vers l'UE (Hambourg/Rotterdam) : environ 30–35 jours. Fret aérien disponible pour les commandes urgentes (3–5 jours). Nous gérons toute la documentation douanière d'export, les certificats d'origine et les listes de colisage."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: Quels processus de contrôle qualité s'appliquent aux commandes OEM ?
  answer: "Chaque commande OEM suit un plan de contrôle qualité documenté : 1) Contrôle des matières entrantes — tests par lot du tissu PVC pour l'épaisseur, la résistance à la traction et la résistance aux UV. 2) Contrôle en cours de production — test de résistance des soudures toutes les 50 unités, test de maintien de pression à 1,25x la pression PSI nominale. 3) Contrôle final — inspection visuelle et test de pression de 100 % des planches. 4) Échantillonnage AQL — contrôle par lot selon ISO 2859 avec défaut critique = 0 accepté. 5) Inspection par tierce partie — SGS, Bureau Veritas ou Intertek disponibles aux frais de l'acheteur."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: Pouvez-vous créer un emballage personnalisé pour ma marque ?
  answer: "Oui. Nous proposons un service complet d'emballage personnalisé : boîtes retail en impression CMYK quadrichromie avec visuels de marque, sacs de transport avec logos sérigraphiés ou brodés, manuels d'utilisation dans votre langue, étiquettes et codes-barres/UPC, et emballage intérieur (sachets plastique, inserts en mousse). MOQ d'emballage minimum : 500–1000 unités pour les boîtes personnalisées, 200–500 pour les sacs de transport. Le service de design d'emballage est inclus avec les commandes OEM."
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: Puis-je visiter l'usine ou organiser un audit par tierce partie ?
  answer: "Les visites d'usine sont les bienvenues sur rendez-vous. Nous accueillons des propriétaires de marques tout au long de l'année et pouvons organiser votre prise en charge depuis l'aéroport international de Qingdao Jiaodong (TAO). Pour les acheteurs qui ne peuvent pas se déplacer, nous proposons : une visite virtuelle de l'usine en visioconférence, la coordination d'un audit par tierce partie avec SGS/Bureau Veritas (frais d'audit à la charge de l'acheteur), et un dossier détaillé des capacités de l'usine incluant la liste des équipements, le processus QC et les qualifications du personnel."
  category: b2b
  relatedProducts: []
  relatedGuides: []

sup:
  title: SUP znanje — Vodiči i resursi za napuhive SUP daske | Afarer
  description: Cjelovito središte SUP znanja koje obuhvaća vodiče za početnike, veličine daski, tutoriale tehnike, savjete za sigurnost i tehnologiju napuhivih SUP daski.
  articles:
    - title: Osnove SUP-a — Vodič za početnike
      desc: Sve što početnik treba znati — vrste daski, odabir vesla, stav i savjeti za prvi dan.
      href: /learn/sup
    - title: Vodič za veličine SUP daski
      desc: Pronađite pravu dužinu, širinu i volumen daske za vašu težinu, vještinu i stil veslanja.
      href: /size-guide
    - title: Napuhiva ili tvrda daska
      desc: Koja je prava za vas? Usporedba prenosivosti, performansi, trajnosti i cijene.
      href: /compare/inflatable-vs-hardboard
    - title: Tehnike srednje razine
      desc: Unaprijedite svoje veslanje uz napredne zaveslaje, tehnike okretanja i upravljanje u valovitim vodama.
      href: /learn/intermediate-techniques
    - title: Kako odabrati napuhivi SUP
      desc: Snađite se među ključnim čimbenicima — konstrukcija, debljina, postava peraja i uključeni dodaci.
      href: /v2/how-to-choose-inflatable-sup
    - title: Sigurnost na vodi
      desc: Osnovno znanje o sigurnosti uključujući čitanje vremenskih prilika, odabir PFD-a, samospašavanje i grupno veslanje.
      href: /learn/water-safety
water-safety:
  title: Znanje o sigurnosti na vodi — Vodiči za sigurno veslanje | Afarer
  description: Sveobuhvatni resursi o sigurnosti na vodi za SUP, kajakaštvo i čamce. Saznajte više o odabiru PFD-a, čitanju vremenskih prilika, samospašavanju, sigurnosti u hladnoj vodi i CE certifikaciji.
  articles:
    - title: Vodič za sigurnost na vodi
      desc: Osnovno znanje o sigurnosti za svakog veslača — vremenske prilike, PFD-ovi, samospašavanje i protokoli grupnog veslanja.
      href: /learn/water-safety
    - title: Vodič za prsluke za spašavanje i PFD
      desc: Kako odabrati pravo osobno sredstvo za spašavanje za SUP, kajakaštvo, vožnju čamcima i profesionalnu upotrebu.
      href: /v2/life-jacket-buying-guide
    - title: Sigurnosni popis za SUP
      desc: Sigurnosni popis prije isplovljavanja koji bi svaki vozač SUP daske trebao slijediti prije izlaska na vodu.
      href: /v2/sup-safety-guide
    - title: Sigurnost veslanja u hladnoj vodi
      desc: Osnovne mjere opreza, oprema i tehnike za veslanje u uvjetima hladne vode.
      href: /v2/cold-water-safety-guide
    - title: Greške početnika u veslanju
      desc: Česte greške veslača početnika i kako ih izbjeći radi sigurnijeg i ugodnijeg iskustva.
      href: /v2/beginner-sup-guide
    - title: Sve o CE certifikaciji
      desc: Što CE certifikacija znači za napuhive SUP daske — standardi, ispitivanja i zašto je važna za sigurnost.
      href: /trust
sup-basics:
  title: Osnove SUP-a — Vodič za početnike u stand-up paddle boardingu
  description: Sve što trebate znati da biste počeli sa stand-up paddle boardingom. Vodiči za opremu, savjeti o veličinama, savjeti za sigurnost i tehnike za početnike iz Afarerova centra znanja.
  articles: []
drop-stitch-core:
  title: Tehnologija drop-stitch jezgre — Kako napuhivi SUP-ovi postižu krutost
  description: 'Detaljna analiza drop-stitch konstrukcijske tehnologije: kako tisuće poliesterskih niti stvaraju krute napuhive platforme pri 15-25 PSI. Gustoća niti, integracija tkanine, proizvodni proces i usporedbe performansi.'
  articles: []
inflatable-technology:
  title: Tehnologija napuhivih SUP daski — Materijali, konstrukcija i inženjerstvo
  description: Kako se izrađuju napuhive SUP daske — slaganje materijala, drop-stitch jezgre, sustavi ventila, RF zavarivanje i ispitivanja kvalitete. Razumijte što čini trajan napuhivi proizvod visokih performansi.
  articles: []
intermediate-techniques:
  title: SUP i kajak tehnike srednje razine — Korak dalje od osnova
  description: Podignite svoje vještine veslanja uz napredne zaveslaje, upravljanje u valovitoj vodi, kontrolu vjetra, tehnike samospašavanja i bonton grupnog veslanja. Za veslače spremne za korak iznad početničkih vještina.
  articles: []
materials:
  title: Materijali za napuhive SUP daske — PVC, EVA i drop-stitch tkanina
  description: 'Sveobuhvatan vodič kroz materijale koji se koriste u proizvodnji napuhivih SUP daski: PVC vojne klase, EVA pjenasta paluba, drop-stitch tkanina, karbonsko vlakno i aluminijske legure. Specifikacije, primjene i kriteriji odabira.'
  articles: []
safety-in-water-sports:
  title: Sigurnost u vodenim sportovima — Osnovno znanje za veslače
  description: Osnovno znanje o sigurnosti za svakog veslača — čitanje vremenskih prilika, odabir PFD-a, samospašavanje i protokoli grupnog veslanja.
  articles: []
sup-size-guide:
  title: Vodič za veličine SUP daski — Kako odabrati pravu dužinu, širinu i volumen daske
  description: Sveobuhvatan vodič za dimenzioniranje SUP daski koji obuhvaća dužinu, širinu, debljinu, volumen (litre) i usklađivanje s težinom vozača. Pronađite pravu veličinu napuhivog SUP-a za vašu težinu, razinu vještine i aktivnost veslanja.
  articles: []

- slug: sup-yoga
  category: lifestyle
  title: SUP-yoga — en komplett guide till paddling och yoga
  description: Kombinera SUP-paddling med yoga för bättre balans, styrka och närvaro på vattnet.
  tldr: SUP-yoga lägger till ett instabilitetselement som dramatiskt ökar aktiveringen av bålen jämfört med yoga på land. Börja med grundpositioner på en bred och stabil bräda i lugnt vatten. Använd en halkfri däckmatta. Utöva aldrig SUP-yoga ensam.
  problem: Traditionella yogamattor ger en perfekt stabil yta och tar därmed bort balansutmaningen som gör SUP-yoga unikt effektiv för bålstyrka och fokus.
  solution: Använd en extra bred SUP-bräda (34"+) med en däckmatta i full längd. Öva i lugnt och grunt vatten. Börja med grundpositioner innan du försöker omvända positioner.
  audience: Yogautövare och paddlare som vill kombinera balansträning med närvaro.
  steps:
    - Förankra brädan i grunt och lugnt vatten — använd ett sandankare eller förtöj vid en brygga
    - Börja med sittande positioner — enkel sittposition, båtpositionen och sittande vridning
    - Gå vidare till knästående positioner — bordet, katt-ko och åskviggan
    - Gå vidare till stående positioner — berget, krigare I, krigare II och trädet
    - Öva balanspositioner — halvmånen, örnen och dansaren
    - Avsluta med savasana — ligga platt på brädan och känn vattnets rörelse
  faq:
    - q: Vilken bräda är bäst för SUP-yoga?
      a: En bred bräda (34"+) med en däckmatta i full längd ger den mest stabila plattformen. SUP Tour 12 erbjuder en bra balans mellan stabilitet och glid.
    - q: Är SUP-yoga farligt?
      a: Inte mer än yoga på land när det utövas säkert. Använd lugnt och grunt vatten. Använd en leash. Öva med en partner. Undvik djupt vatten under dina första pass.
    - q: Behöver jag särskild utrustning?
      a: En bred och stabil bräda, däckmatta på hela däcket, leash och flytväst. Vissa utövare använder en vattentät matta för extra grepp.

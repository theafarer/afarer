- slug: sup-size-guide
  category: buying-guide
  title: SUP-storleksguide — så väljer du rätt bräddimensioner
  description: Komplett SUP-storleksguide med rekommendationer för längd, bredd och tjocklek utifrån din vikt, längd, nivå och paddlingsstil.
  tldr: Nybörjare behöver bredare brädor (32-34") för stabilitet. Tyngre paddlare behöver längre brädor (11'+) med högre volym. Turpaddling kräver längre skrov (12'+). Yoga kräver extra bredd (34"+). Kontrollera alltid maxvikten — din vikt plus utrustning bör inte överstiga 80 % av gränsen.
  problem: Fel storlek på SUP-brädan ger dålig stabilitet, dålig kurshållning och en frustrerande upplevelse. De flesta förstagångsköpare väljer en bräda som ser bra ut utan att tänka på hur dimensionerna påverkar prestandan.
  solution: Matcha brädans längd, bredd och tjocklek med din vikt, din nivå och ditt huvudsakliga användningsområde. Använd vår storleksguide — addera din vikt och utrustningens vikt och välj en bräda med minst 20 % marginal över totalen.
  audience: Förstagångsköpare av SUP, paddlare som uppgraderar till en specialiserad bräda och alla som är osäkra på storleken.
  steps:
    - Väg dig tillsammans med den utrustning du bär (paddel, flytväst, torrpåse)
    - Lägg till 20 % säkerhetsmarginal för att få minsta tillåtna maxvikt
    - Välj bredd efter nivå — 32-34" för nybörjare, 30-32" för fortsättare, 28-30" för avancerade
    - Välj längd efter användning — 10'6"-11'6" allround, 12'-14' turpaddling, 9'-10' fors
    - Kontrollera tjockleken — 6" standard, 4" för prestanda, 5" för allround
    - Kontrollera brädans rekommenderade PSI-intervall för optimal styvhet
  faq:
    - q: Vilken bredd på SUP är bäst för nybörjare?
      a: 32 till 34 tum ger den mest stabila plattformen. Ju bredare bräda, desto lättare är det att balansera — särskilt för tyngre paddlare.
    - q: Hur vet jag om en SUP är för liten för mig?
      a: Om brädan ligger lågt i vattnet, reagerar trögt eller om nosen lätt dyker under vid paddling är den sannolikt för liten för din vikt.
    - q: Påverkar brädans längd hastigheten?
      a: Ja. Längre vattenlinje ger högre teoretisk skrovhastighet. En 14' turbräda är avsevärt snabbare än en 10' allroundbräda vid samma paddlarinsats.

- slug: sup-for-pet-owners
  category: lifestyle
  title: SUP med hund — en komplett guide till paddling med ditt husdjur
  description: Allt du behöver veta om paddling med hundar — träning, säkerhetsutrustning, val av bräda och tips för ett lyckat SUP-pass med din fyrbenta vän.
  tldr: Börja med en bred och stabil bräda (34"+). Använd en flytväst för husdjur, en halkfri däckmatta och en kort leash. Träna på land först, sedan i grunt vatten. Håll passen korta (20-30 minuter). Ta med sötvatten och en handduk. Tvinga aldrig hunden om den verkar orolig.
  problem: Att paddla med hundar kan vara stressigt utan rätt förberedelser — hundar kan få panik, hoppa i vattnet eller repa brädans yta.
  solution: Använd en bred och stabil bräda med ett mjukt EVA-däck. Låt hunden vänja sig stegvis. Ta med säkerhetsutrustning, inklusive en flytväst för hunden och en kort SUP-säker leash.
  audience: Hundägare som vill paddla SUP med sina husdjur.
  steps:
    - Börja med en bred bräda (34"+ med hög maxvikt för dig och hunden)
    - Skaffa en väl anpassad hundflytväst med handtag
    - Öva på land — låt hunden sitta på den tömda brädan, sedan på den uppblåsta brädan på gräs
    - Gå vidare till grunt vatten — knäböj på brädan med hunden och paddla några tag
    - Håll passen korta — högst 20-30 minuter de första turerna
    - Ta alltid med sötvatten, en hopfällbar skål och en handduk till hunden
  faq:
    - q: Vilken SUP-bräda är bäst för hundar?
      a: En bred och stabil bräda med ett mjukt EVA-däck som ger tassarna fäste. Tropical Breeze Island Escape med sin bredd på 34"+ är idealisk för paddling med hund.
    - q: Behöver min hund en flytväst?
      a: Ja, även starka simmare. En hundflytväst med handtag gör det enkelt att lyfta tillbaka hunden på brädan om den faller i.
    - q: Hur förhindrar jag att hunden repar brädan?
      a: Håll hundens klor trimmade. EVA-skummet på däckmattan skyddar PVC-ytan. Lägg en handduk eller husdjursmatta på däcket för extra skydd.

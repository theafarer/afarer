- slug: sup-with-kids
  category: lifestyle
  title: SUP med barn — en komplett familjeguide
  description: Så tar du säkert med barn på SUP-paddling — åldersrekommendationer, utrustning och aktiviteter.
  tldr: Barn från 6 år kan åka med på en SUP-bräda hos en vuxen. Barn från 10 år kan paddla sin egen bräda under uppsyn. Använd en bred och stabil bräda, bär alltid flytvästar, stanna i grunt och lugnt vatten och håll passen korta (högst 30-45 minuter).
  problem: Föräldrar vill dela vattensporten med sina barn men oroar sig för säkerheten, utrustningen och för att hålla barnen engagerade.
  solution: Använd en bräda i rätt storlek för att åka två tillsammans, se till att varje barn bär en väl anpassad flytväst, börja i grunt och varmt vatten och gör det roligt med lekar och korta pass.
  audience: Föräldrar som vill introducera sina barn för SUP-paddling.
  steps:
    - Ålder 4-6 — åka med som passagerare på en vuxens bräda, sitta fram och hålla i handtaget i mitten
    - Ålder 6-10 — knästå eller sitta på sin egen bräda under vuxnas uppsyn och med leash
    - Ålder 10+ — paddla sin egen bräda med en vuxen i närheten
    - Bär alltid flytväst — barn måste hela tiden ha en väl anpassad flytväst
    - Stanna i grunt vatten — vattnet ska nå den vuxne till midjan
    - Håll passen korta — högst 30-45 minuter för barn under 10 år
    - Gör det roligt — leka lekar, titta efter fisk och öva på att resa sig
  faq:
    - q: I vilken ålder kan ett barn paddla SUP ensamt?
      a: Vid cirka 10-12 års ålder under uppsyn, beroende på barnets simförmåga och trygghet i vattnet. Alltid i lugna och grunda förhållanden.
    - q: Vilken bräda är bäst för SUP med barn?
      a: En bred bräda (34"+) med hög maxvikt för att åka två. SUP Explorer 11 med sin bredd på 33" och sin maxvikt på 220 pund fungerar bra för förälder och barn.
    - q: Vilken säkerhetsutrustning behöver barn?
      a: En väl anpassad CE-certifierad flytväst, en leash (fäst vid den vuxnes bräda vid gemensam åktur), solkräm och en keps.

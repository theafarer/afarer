- slug: sup-fitness
  category: lifestyle
  title: SUP-träning — helkroppspass på vattnet
  description: Hur SUP-paddling bygger styrka i bålen, balans och kondition.
  tldr: SUP aktiverar bål, ben, rygg och axlar i varje tag. En timmes pass förbränner 300-500 kalorier. Att paddla i motvind eller mot ström fördubblar intensiteten. SUP-yoga ger extra flexibilitet och balansträning.
  problem: Många ser SUP-paddling som en avslappnad aktivitet snarare än ett legitimt träningsredskap och går därmed miste om potentialen för helkroppskondition.
  solution: Strukturera dina SUP-pass med specifika träningsmål — uthållighetspaddling för kondition, intervallträning för kraft, SUP-yoga för flexibilitet och distanspaddling för muskulär uthållighet.
  audience: Träningsentusiaster som söker en skonsam och engagerande helkroppsträning.
  steps:
    - Värm upp på land — armcirklar, bålstrotationer och bensvängar i 5 minuter
    - Börja med 10 minuters jämn paddling vid måttlig intensitet
    - Gå vidare till intervallträning — 2 minuter hård paddling, 2 minuter lätt återhämtning
    - Inkludera SUP-yogapositioner — nedåtgående hund, krigare II och trädet på brädan
    - Kyl ner med lugn paddling och utsträckningar på brädan
  faq:
    - q: Är SUP bättre än löpning för träning?
      a: SUP ger jämförbara konditionsfördelar med mindre belastning på lederna. Det aktiverar också överkroppen och bålen mer än löpning.
    - q: Hur många kalorier förbränner SUP?
      a: Cirka 300-500 kalorier per timme vid måttlig intensitet. Tävlingsträning eller paddling i motvind kan förbränna 600-800 kalorier per timme.
    - q: Kan jag bygga muskler med SUP?
      a: Ja. Paddlingen bygger muskler i axlar, rygg och bål. Balansen aktiverar ben och stabiliserande muskler. Det är ett helkroppsstyrketräningspass.

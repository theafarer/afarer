- slug: sup-travel-transport
  category: planning
  title: SUP-resguide — att flyga och åka bil med en uppblåsbar SUP
  description: Så reser du med en uppblåsbar SUP med flyg, bil eller husbil. Tips om flygbolagsavgifter, packning, pumpning på plats och överväganden vid utlandsresor.
  tldr: Töm, rulla och packa din SUP i sin ryggsäck. De flesta flygbolag accepterar den som incheckat bagage (under 50 pund / 50 linjära tum). Packa alltid pumpen och paddeln i samma väska. Kom i god tid så att du har extra tid om personalen ifrågasätter väskans storlek. Överväg att skicka brädan i förväg vid långa resor.
  problem: Att resa med en SUP verkar krångligt — flygbolagens storleksgränser, säkerhetskontroller och frågan om hur man pumpar upp brädan på en avlägsen destination skapar osäkerhet.
  solution: Afarers SUP-ryggsäckar är konstruerade för att klara flygbolagens gränser för incheckat bagage. Packa strategiskt, ta med ett reparationskit och undersök pumpmöjligheter (marinor, campingplatser med el) före avresa.
  audience: Paddlare som planerar SUP-resor med flyg, bil eller husbil.
  steps:
    - Töm brädan helt och rulla den från nos till akter
    - Packa den rullade brädan, pumpen, paddeln, leashen och fenan i ryggsäcken
    - Kontrollera flygbolagets gränser för storlek och vikt — de flesta tillåter 62 linjära tum och 50 pund
    - Kom i god tid och var beredd på att väskan kontrolleras manuellt
    - Ta med ett reparationskit i handbagaget om brädan skulle skadas under transporten
    - Undersök pumpalternativ — eluttag på campingplatser för elektriska pumpor, luftstationer på marinor
  faq:
    - q: Accepterar flygbolaget min SUP-ryggsäck som bagage?
      a: De flesta amerikanska och europeiska flygbolag accepterar SUP-ryggsäckar som vanligt incheckat bagage om de är under 50 pund och 62 linjära tum. Lågprisbolag kan ta ut avgifter för överdimensionerat bagage.
    - q: Kan jag ta med min SUP som handbagage?
      a: Nej. SUP-ryggsäckar överstiger handbagagemåtten hos alla flygbolag. Checka alltid in ryggsäcken.
    - q: Hur pumpar jag upp min SUP på en avlägsen destination?
      a: Den medföljande handpumpen fungerar överallt utan el. Ta för bekvämlighet med en portabel elektrisk pump och leta efter campingplatser med eluttag eller marinor med luftstationer.

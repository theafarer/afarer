- slug: sup-inflation-psi-guide
  category: technical
  title: SUP-pumpguide — optimalt PSI för prestanda och säkerhet
  description: Komplett guide till SUP-tryck — rekommenderade PSI-intervall, hur trycket påverkar prestandan och tips för att använda pumpen korrekt.
  tldr: Pumpa till 12-15 PSI för de flesta uppblåsbara SUP. Högre tryck ger mer styvhet men långsammare pumpning. Lägre tryck ger mjukare känsla men mer böjning. Överstig aldrig max-PSI som är tryckt på din bräda. Använd en pump med noggrann tryckmätare. Kall luft sänker trycket, het sol höjer det.
  problem: Underpumpade brädor känns tröga och böjs mycket. Överpumpade brädor riskerar att sömmarna ger vika. Många paddlare gissar PSI istället för att mäta noggrant.
  solution: Använd en pump med inbyggd tryckmätare. Sikta på 15 PSI för maximal styvhet. Kontrollera trycket före varje pass — temperaturförändringar påverkar PSI avsevärt.
  audience: Samtliga ägare av uppblåsbara SUP.
  steps:
    - Kontrollera det rekommenderade PSI-intervallet nära ventilen på din bräda
    - Pumpa med dubbelverkande pump till mitten av det rekommenderade intervallet
    - Byt till enkelverkande läge för de sista 3-4 PSI för bättre kontroll
    - Kontrollera trycket med mätaren — analoga mätare är mer pålitliga än digitala
    - Justera efter förhållanden — högre PSI för turpaddling och tävling, lägre PSI för fors och steniga bottnar
    - Kontrollera trycket igen efter att brädan legat i 10 minuter — temperaturutjämning ändrar PSI
  faq:
    - q: Kan jag överpumpa min SUP?
      a: Ja. Att överstiga max-PSI (vanligtvis 15-18 PSI) kan lossa sömmar och skada drop-stitch-kärnan. Håll dig alltid inom det tryckta intervallet.
    - q: Påverkar temperaturen PSI?
      a: Avsevärt. En bräda pumpad till 15 PSI vid 70 °F kan nå 18 PSI i direkt sol vid 95 °F. Kallt vatten kan sänka trycket till 12 PSI. Kontrollera trycket efter miljöförändringar.
    - q: Vilket PSI för nybörjare?
      a: 12-13 PSI under inlärningen ger en lite mjukare plattform som förlåter fall bättre. Öka till 15 PSI i takt med att du utvecklas.

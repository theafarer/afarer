- slug: sup-storage-winter-care
  category: maintenance
  title: SUP-förvaring och vintervård — förläng brädans livslängd
  description: Så förvarar, rengör och vinterförvarar du din uppblåsbara SUP-bräda på rätt sätt. Undvik mögel, UV-skador och materialförsämring genom korrekt vård.
  tldr: Skölj med sötvatten efter varje användning. Låt torka helt innan förvaring. Töm brädan på luft och förvara svalt och mörkt, skyddad från direkt solljus och extrema temperaturer. Förvara aldrig uppblåst eller i en varm bil. Applicera UV-skydd med jämna mellanrum.
  problem: Felaktig förvaring är den vanligaste orsaken till för tidiga SUP-skador — mögel, materialnedbrytning, delaminering och ventskador från värme eller kyla.
  solution: Följ en vårdrutin i tre steg — skölj efter varje pass, torka noggrant innan förvaring och förvara tömd i en temperaturkontrollerad miljö mellan 50-80 °F (10-27 °C).
  audience: Samtliga SUP-ägare som vill att deras bräda ska hålla 5+ år.
  steps:
    - Skölj brädan, paddeln och pumpen med sötvatten efter varje pass i salt- eller lerigt vatten
    - Rengör med milt tvålvatten och en mjuk svamp — aldrig starka kemikalier eller högtryckstvätt
    - Låt brädan torka helt utomhus innan du tömmer den — öppna ventilen så att fukten inuti kan komma ut
    - Töm brädan helt och rulla från nosen mot aktern för att pressa ut kvarvarande luft
    - Torka ryggsäcken innan brädan förvaras i den
    - Förvara i en sval, mörk garderob eller under sängen — aldrig i direkt sol, i en varm bil eller i ett ouppvärmt förråd
  faq:
    - q: Kan jag lämna min SUP uppblåst hela säsongen?
      a: Det är bättre att tömma brädan när den inte används under längre perioder. Konstant PSI-belastning accelererar materialtrötthet. Töm mellan passen vid förvaring längre än 2 veckor.
    - q: Hur tar jag bort mögel från min SUP?
      a: Blanda milt tvål med ljummet vatten och en skvätt ättika. Skrubba försiktigt med en mjuk borste. Skölj noggrant och torka i skugga. Undvik klorblekmedel som skadar PVC.
    - q: Kan jag förvara min SUP i ett garage?
      a: Bara om garaget håller 50-80 °F året runt. Vindskåp och ouppvärmda garage utsätts för temperaturväxlingar som skadar drop-stitch-kärnor.

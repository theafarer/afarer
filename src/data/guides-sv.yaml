- slug: sup-maintenance
  category: maintenance
  title: Så rengör och förvarar du din uppblåsbara SUP
  description: Steg-för-steg-guide för underhåll som maximerar livslängden på din uppblåsbara SUP-bräda.
  tldr: Skölj med sötvatten efter varje användning, torka helt innan förvaring, släpp ut luften och rulla löst ihop (inte militärt hårt), förvara på ett svalt och torrt ställe borta från direkt solljus och inspektera sömmarna månadsvis.
  problem: Felaktig förvaring och rengöring är de vanligaste orsakerna till tidigt haveri i uppblåsbara SUP-brädor — mögel, UV-skador och delaminering av sömmar.
  solution: Följ en fast rutin efter varje pass — skölj, torka, inspektera, lufta ur och förvara. Använd mild tvål för envis smuts. Förvara aldrig brädan våt eller i direkt solljus.
  audience: Alla ägare av uppblåsbara SUP-brädor som vill att deras bräda ska hålla i mer än 5 år.
  steps:
    - Skölj brädan med sötvatten omedelbart efter användning — särskilt efter saltvatten
    - Rengör med mild tvål och en mjuk svamp — undvik starka kemikalier eller högtryckstvätt
    - Torka brädan helt — öppna ventilen så att instängt vatten kan rinna ut
    - Inspektera för skador — kontrollera sömmar, ventil och yta efter punkteringar
    - Släpp ut luften helt — ta bort ventilkärnan för fullständig tömning
    - Rulla brädan löst ihop — börja från nosen och undvik hårda veck
    - Förvara brädan i bärpåsen på ett svalt och torrt ställe borta från direkt solljus
  faq:
    - q: Kan jag lämna min SUP uppumpad hela säsongen?
      a: Ja, men håll den borta från direkt solljus när den inte används. Delvis tömning (8-10 PSI) rekommenderas vid förvaring under längre tid.
    - q: Hur reparerar jag ett hål?
      a: Rengör området, klipp en lapp med rundade hörn, applicera lim, tryck hårt och vänta 24 timmar innan du pumpar upp. afarer-brädor inkluderar ett reparationskit.
    - q: Hur ofta ska jag kontrollera ventilen?
      a: Månadsvis. Ventilen är den vanligaste felkällan. Kontrollera att ventilpinnen rör sig fritt och att O-ringen är intakt.

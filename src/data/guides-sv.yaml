- slug: sup-weight-capacity
  category: buying-guide
  title: SUP Maxvikt-guide — hur mycket vikt kan en SUP bära?
  description: Förstå maxviktsgränser för SUP, hur du beräknar din totala last och varför överskridande av gränsen påverkar prestanda och säkerhet.
  tldr: Överstig aldrig 80 % av brädans maxvikt med din kroppsvikt plus utrustning. En bräda med 220 pund i maxvikt passar en paddlare på 160 pund med lätt utrustning. Överskridande ger sämre gång, trög hantering och ökad skaderisk.
  problem: Paddlare överskrider ofta brädans maxvikt, vilket ger dålig prestanda, att brädan sjunker och potentiella skador. Tillverkare anger maxgränser men förklarar inte säker arbetslast.
  solution: Beräkna din totala last (kroppsvikt + utrustning + vatten som brädan absorberar) och håll dig under 80 % av angiven maxkapacitet. Tyngre paddlare behöver brädor med högre volym och maxvikt på 300+ pund.
  audience: Paddlare i alla storlekar, särskilt tyngre paddlare och de som bär expeditionsutrustning.
  steps:
    - Hitta maxvikten som är tryckt på din bräda (vanligtvis nära ventilen)
    - Väg dig själv och hela utrustningen — paddel, flytväst, torrpåsar, kylbox och tillbehör
    - Beräkna andelen av kapaciteten — (din totala last) ÷ (maxvikt) × 100
    - Sikta på 70-80 % för optimal prestanda och säkerhet
    - Om du överstiger 80 %, välj en större bräda eller minska utrustningen
  faq:
    - q: Vad händer om jag överstiger viktgränsen?
      a: Brädan ligger lägre i vattnet och ger mer motstånd. Stabiliteten minskar, nosen kan dyka under och drop-stitch-kärnan löper större risk att skadas i sjögång.
    - q: Kan två personer åka på en SUP?
      a: Bara om den sammanlagda vikten håller sig under 80 % av kapaciteten. De flesta standardbrädor är konstruerade för en förare. Att åka två kräver en bräda som är godkänd för två.
    - q: Har uppblåsbara SUP lägre maxvikt än hårda brädor?
      a: Kvalitetsbrädor med drop-stitch-konstruktion har jämförbar eller högre maxvikt än hårda brädor tack vare sin tjockare volymfördelning.

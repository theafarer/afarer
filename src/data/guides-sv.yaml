- slug: choosing-paddle
  category: buying-guide
  title: Så väljer du rätt SUP-paddel
  description: En guide till paddelmaterial, bladformer, skafttyper och storleksval för SUP.
  tldr: Paddellängd — SUP-paddlar ska vara 6-8" längre än din kroppslängd. Bladform — dihedrala blad håller kursen rakt, platta blad ger bättre grepp i vattnet. Skaftmaterial — kolfiber är lättast, glasfiber ger bäst värde, aluminium är budgetalternativet.
  problem: Fel paddelstorlek eller material ger onödig trötthet, dålig effektivitet i tagen och belastning på lederna.
  solution: Matcha paddellängd, bladform, skaftmaterial och flex med din paddlingsstil, din kroppsstorlek och din budget.
  audience: SUP-paddlare som väljer sin första eller nästa paddel.
  steps:
    - Mät paddelhöjden — 6-8" längre än din kroppslängd för allmän paddling
    - Välj bladmaterial — nylon för budget, glasfiber för värde, kolfiber för prestanda
    - Välj bladform — dihedral för jämn kurshållning, platt för kraft, skedformad för tävling
    - Välj skafttyp — rak för allmän användning, böjd för tävlings-SUP
    - Kontrollera flexen — styvare skaft överför mer kraft, flexibla skaft minskar belastningen på lederna
  faq:
    - q: Vilket är det bästa paddelmaterialet?
      a: Glasfiber ger den bästa balansen mellan vikt, hållbarhet och pris. Kolfiber är lättare men dyrare och skörare. Nylon är tungt men nästan oförstörbart.
    - q: Hur vet jag om min paddel har rätt längd?
      a: Ställ paddeln lodrätt bredvid dig — handtaget ska nå din handled när du lyfter armen över huvudet.
    - q: Ska jag välja en paddel i ett stycke eller en justerbar paddel?
      a: Justerbara paddlar är bra för gemensam användning och resor. En paddel i ett stycke är lättare, styvare och mer effektiv för dedikerad användning.

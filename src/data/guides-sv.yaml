- slug: sup-for-whitewater
  category: buying-guide
  title: Fors-SUP-guide — köpguide för uppblåsbara brädor för flodpaddling
  description: Så väljer du en fors-SUP för flodpaddling — kortare brädor, förstärkt konstruktion, säkerhetsutrustning och paddlingstekniker för forsar i klass I-III.
  tldr: Fors-SUP behöver kortare längd (8-10'), förstärkta kanter, högre PSI (15+) och flera luftkammare för säkerhet. Använd en rak flodleash (inte spiral), bär hjälm och flytväst och paddla alltid med en kompis. Börja med klass I innan du försöker svårare forsar.
  problem: Att ta en vanlig allround-SUP på strömmande vatten är farligt — standardbrädor saknar den rörlighet, det stötmotstånd och de säkerhetsfunktioner som floder kräver.
  solution: Välj en specialbyggd fors-SUP med kort längd för smidighet, förstärkt konstruktion för stötar mot stenar och konstruktion med flera kammare för säkerhet.
  audience: Erfarna paddlare som övergår till flodpaddling.
  steps:
    - Välj en bräda på 8-10' för maximal rörlighet i forsar
    - Leta efter förstärkt kantkonstruktion och PVC i militärkvalitet
    - Välj en bräda med 2+ luftkammare för redundans vid punktering
    - Använd en rak flodleash fäst i ett snabbkopplingsbälte
    - Bär hjälm, flytväst och lämpliga flodskor
    - Börja med forsar i klass I och utvecklas gradvis tillsammans med en erfaren partner
  faq:
    - q: Kan jag använda en vanlig SUP i fors?
      a: Rekommenderas inte. Standardbrädor saknar stötmotstånd och kan delaminera på stenar. Säkerheten med flera luftkammare är avgörande i flodmiljöer.
    - q: Vilket PSI för fors-SUP?
      a: 15+ PSI för maximal styvhet. En hårdare bräda studsar bättre mot stenar än en underpumpad som formar sig runt hinder.
    - q: Behöver jag särskilda paddlingsfärdigheter för fors-SUP?
      a: Ja. Att läsa floden, bakvattensvängar, färjning och stödtag är nödvändiga färdigheter. Gå en kurs i fors-SUP innan du försöker klass II+.

- slug: sup-board-materials
  category: technical
  title: SUP-material — PVC, EPS, epoxi och drop-stitch förklarat
  description: Teknisk guide till SUP-konstruktion — uppblåsbara drop-stitch-PVC-brädor mot hårda brädor med EPS-kärna. Förstå varför typerna presterar olika.
  tldr: Uppblåsbara SUP använder drop-stitch-PVC med tusentals inre trådar för styvhet. Hårda brädor använder EPS-skumkärna med epoxi- eller glasfiberskal. Uppblåsbara vinner på portabilitet och hållbarhet. Hårda brädor vinner på fart och känsla. Modern drop-stitch-teknik vid 15 PSI närmar sig hårda brädors styvhet.
  problem: Köpare förstår inte de grundläggande konstruktionsskillnaderna mellan uppblåsbara och hårda brädor, vilket leder till fel köpbeslut.
  solution: Matcha brädans material med ditt huvudsakliga användningsområde — uppblåsbar drop-stitch för resor, förvaring och hållbarhet, EPS/epoxi för tävling, surfning och maximal prestanda.
  audience: SUP-köpare som jämför uppblåsbara och hårda brädor.
  steps:
    - Uppblåsbar drop-stitch — tusentals polyestertrådar binder ihop över- och underskikten och skapar en styv struktur vid 12-15 PSI
    - Hård EPS-skumkärna — expanderad polystyren formskuren till skrovdesign, förseglad med epoxiharts och glasfiberlager
    - Fördelar med uppblåsbara — packbar, nästan osårbar, lätt att bära, mjuka kanter för säkerhet
    - Fördelar med hårda brädor — lägre totalvikt, styvare plattform, bättre glid, mer responsiv
    - Hybridalternativ — vissa tillverkare kombinerar drop-stitch med styva paneler för det bästa av två världar
  faq:
    - q: Är uppblåsbara SUP lika styva som hårda brädor?
      a: Vid 15 PSI med kvalitets-drop-stitch ligger moderna uppblåsbara brädor mycket nära. De flesta fritidspaddlare märker ingen skillnad. Tävlingpaddlare noterar den hårda brädans övertag.
    - q: Vilket material håller längre?
      a: Uppblåsbara SUP håller 5-10 år med skötsel. Hårda brädor håller 10-20 år men är känsliga för sprickor, hack och vatteninträngning. Uppblåsbara tål skador bättre i vardagen.
    - q: Är PVC miljövänligt?
      a: PVC-tillverkning har miljöpåverkan, men uppblåsbara SUP håller längre (mindre frekvent byte) och packas mindre (lägre transportutsläpp). Återvinn alltid gamla brädor på rätt sätt.

  category: lifestyle
  title: SUP с собаками — полное руководство по гребле с питомцем
  description: Всё, что нужно знать о гребле на SUP с собаками — шаги дрессировки, снаряжение безопасности, выбор доски и советы для успешной сессии SUP с вашим хвостатым другом.
  tldr: Начните с широкой стабильной доски (34"+). Используйте собачий PFD, нескользящий коврик на деку и короткий лиш. Тренируйтесь сначала на суше, затем на мелководье. Держите сессии короткими (20-30 минут). Возьмите пресную воду и полотенце. Никогда не заставляйте собаку, если она нервничает.
  problem: Гребля с собаками без должной подготовки может быть стрессовой — собаки могут паниковать, спрыгивать за борт или царапать поверхность доски.
  solution: Используйте широкую стабильную доску с мягким ковриком EVA на деке. Постепенно приучайте собаку. Возьмите снаряжение безопасности, включая собачий спасательный жилет и короткий безопасный лиш для SUP.
  audience: Владельцы собак, которые хотят кататься на SUP со своими питомцами.
  steps:
    - Начните с широкой доски (34"+ и высокой грузоподъёмности на вас плюс собаку)
    - Купите правильно подобранный собачий спасательный жилет с ручкой
    - Тренируйтесь на суше — пусть собака сядет на спущенную доску, затем на накачанную на траве
    - Переходите на мелководье — встаньте на колени на доску с собакой и сделайте несколько гребков
    - Держите сессии короткими — максимум 20-30 минут на первых выходах
    - Всегда берите пресную воду, складную миску и полотенце для собаки
  faq:
    - q: Какая доска SUP лучше для собак
      a: Широкая стабильная доска с мягким ковриком EVA на деке, дающим сцепление лапам. Tropical Breeze Island Escape шириной 34"+ идеальна для гребли с собаками.
    - q: Нужен ли моей собаке спасательный жилет
      a: Да, даже сильным пловцам. Собачий спасательный жилет с ручкой позволяет легко поднять собаку обратно на доску, если она упадёт.
    - q: Как уберечь доску от царапин собаки
      a: Подстригайте собаке когти. Коврик из EVA-пены на деке защищает поверхность PVC. Постелите на деку полотенце или лежанку для дополнительной защиты.

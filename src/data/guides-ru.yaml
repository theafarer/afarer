  title: Руководство по грузоподъёмности SUP — какой вес выдерживает SUP
  description: Понимание пределов грузоподъёмности SUP, расчёт общей нагрузки и почему превышение лимита влияет на характеристики и безопасность.
  tldr: Никогда не превышайте 80% максимальной грузоподъёмности доски суммарным весом тела и снаряжения. Доска с лимитом 220 фунтов подходит гребцу весом 160 фунтов с лёгким снаряжением. Превышение лимита вызывает дельфинирование, вялое управление и повышенный риск повреждений.
  problem: Гребцы часто превышают грузоподъёмность своей доски, что ведёт к плохим характеристикам, погружению в воду и возможным повреждениям. Производители указывают максимальные лимиты, но не объясняют безопасную рабочую нагрузку.
  solution: Рассчитайте общую нагрузку (вес тела + снаряжение + впитанная доской вода) и оставайтесь ниже 80% заявленной максимальной грузоподъёмности. Более тяжёлым гребцам нужны доски большего объёма с грузоподъёмностью 300+ фунтов.
  audience: Гребцы любых размеров, особенно крупные и те, кто берёт с собой экспедиционное снаряжение.
  steps:
    - Найдите максимальную грузоподъёмность, указанную на доске (обычно рядом с клапаном)
    - Взвесьте себя и всё снаряжение, включая весло, PFD, сухие мешки, сумку-холодильник и аксессуары
    - Посчитайте — (ваша общая нагрузка) ÷ (максимальная грузоподъёмность) × 100 = процент использования лимита
    - Держитесь в диапазоне 70-80% для оптимальных характеристик и безопасности
    - Если превышаете 80% — выберите доску больше или сократите снаряжение
  faq:
    - q: Что будет, если превысить весовой лимит?
      a: Доска сидит ниже, создавая больше сопротивления. Устойчивость падает, нос может зарываться, а сердечник drop-stitch подвергается повышенному риску повреждения на волне.
    - q: Могут ли два человека кататься на одном SUP?
      a: Только если суммарный вес остаётся ниже 80% грузоподъёмности. Большинство стандартных SUP рассчитаны на одного райдера. Тандемная езда требует доски, специально рассчитанной на двоих.
    - q: У надувных SUP грузоподъёмность ниже, чем у жёстких
      a: Качественные надувные доски с конструкцией drop-stitch имеют сопоставимую или более высокую грузоподъёмность, чем жёсткие, благодаря более толстому распределению объёма.

  title: Руководство по размерам SUP — как выбрать правильные габариты доски
  description: Полное руководство по размерам SUP — рекомендации по длине, ширине и толщине в зависимости от вашего веса, роста, уровня навыков и стиля гребли.
  tldr: Новичкам нужны более широкие доски (32-34") для устойчивости. Более тяжёлым гребцам нужны более длинные доски (11'+) с большим объёмом. Для туризма нужны длинные корпуса (12'+). Для йоги нужна дополнительная ширина (34"+). Всегда проверяйте грузоподъёмность — ваш вес плюс снаряжение не должен превышать 80% лимита.
  problem: Неправильный размер SUP ведёт к плохой устойчивости, медленному держанию курса и раздражающему опыту гребли. Большинство покупателей впервые берут доску, которая хорошо выглядит, не задумываясь, как габариты влияют на характеристики.
  solution: Подберите длину, ширину и толщину доски под свой вес, уровень навыков и основное применение. Используйте наш калькулятор — сложите свой вес и вес снаряжения и выберите доску как минимум с 20% запасом сверх этой суммы.
  audience: Покупатели первого SUP, гребцы, переходящие на специализированную доску, и все, кто сомневается в размере.
  steps:
    - Взвесьтесь со всем снаряжением, которое берёте с собой (весло, PFD, сухой мешок)
    - Добавьте 20% запаса прочности, чтобы найти минимальную грузоподъёмность
    - Выберите ширину по уровню навыков — 32-34" для новичков, 30-32" для среднего уровня, 28-30" для продвинутых
    - Выберите длину по назначению — 10'6"-11'6" универсальная, 12'-14' туризм, 9'-10' бурная вода
    - Проверьте толщину — 6" стандарт, 4" для производительности, 5" универсальная
    - Проверьте рекомендуемый диапазон PSI вашей доски для оптимальной жёсткости
  faq:
    - q: Какая ширина SUP лучше всего подходит новичкам?
      a: От 32 до 34 дюймов в ширину дают самую стабильную платформу. Чем шире доска, тем легче держать равновесие — особенно для крупных гребцов.
    - q: Как понять, что SUP для меня слишком мал?
      a: Если доска сидит низко в воде, реагирует вяло или нос легко зарывается при гребле — она, скорее всего, мала для вашего веса.
    - q: Влияет ли длина доски на скорость?
      a: Да. Более длинная ватерлиния увеличивает теоретическую скорость корпуса. Туристическая доска 14' заметно быстрее универсальной 10' при тех же усилиях гребца.

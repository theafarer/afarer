  category: buying-guide
  title: Типичные ошибки при покупке SUP — чего избегать
  description: Учитесь на типичных ошибках при покупке SUP — неверный размер, игнорирование грузоподъёмности, дешёвые доски и пренебрежение важными аксессуарами.
  tldr: Топ-5 ошибок — покупка слишком узкой доски, игнорирование грузоподъёмности, выбор цены вместо качества, забытые расходы на аксессуары и несоответствие типа доски применению. Качественный надувной SUP от проверенного производителя стоит $500-900 и служит 5+ лет.
  problem: Новички тратят деньги на доски, которые слишком малы, слишком низкого качества или не подходят под их задачи. Дешёвые доски выходят из строя за 1-2 сезона.
  solution: Тщательно изучите вопрос перед покупкой. Подберите габариты доски под свой размер. Вложитесь в качественную конструкцию drop-stitch. Заложите бюджет на важные аксессуары. Покупайте у производителя с сертификацией CE и гарантией.
  audience: Покупатели первого SUP и все, кто ошибся с первой доской.
  steps:
    - Ошибка 1 — покупка слишком узкой доски, всегда берите шире, чем кажется нужным
    - Ошибка 2 — игнорирование грузоподъёмности, рассчитайте общую нагрузку до покупки
    - Ошибка 3 — выбор самого дешёвого варианта, низкокачественный PVC быстро выходит из строя
    - Ошибка 4 — забытые аксессуары, помпа, PFD, весло и лиш добавляют $150-300
    - Ошибка 5 — несоответствие типа доски применению, универсальная доска везде сносна, но специализированные работают лучше
  faq:
    - q: Сколько стоит первый SUP
      a: Качественный надувной SUP от проверенного производителя стоит $500-900. Доски дешевле $300 обычно низкого качества — плохой drop-stitch и тонкий PVC быстро выходят из строя.
    - q: Стоит ли покупать дешёвый SUP
      a: Нет. Дешёвые SUP используют тонкий PVC, слабый drop-stitch и некачественные клапаны. Они расслаиваются, травят воздух и теряют жёсткость. Качественная доска служит 5+ лет, дешёвая может сломаться за сезон.
    - q: Купить комплект или по отдельности
      a: Комплекты экономят деньги по сравнению с раздельной покупкой. Убедитесь, что комплект включает качественную помпу с манометром, регулируемое весло и спиральный лиш, а не самые дешёвые аксессуары.

  title: Планирование многодневного похода на SUP
  description: Как спланировать и провести многодневный поход на SUP — планирование маршрута, упаковка снаряжения, кемпинг и безопасность.
  tldr: Планируйте 10-15 миль в день. Упаковывайте снаряжение в водонепроницаемые сухие мешки, распределяйте вес равномерно и потренируйтесь загружать доску до похода. Оставьте маршрутный план. Возьмите воду, еду, укрытие, навигацию и средства связи.
  problem: Многодневные походы проваливаются из-за перегруза, плохого планирования маршрута или недооценки погоды и течения — что ведёт к истощению, поломке снаряжения или чрезвычайным ситуациям.
  solution: Используйте системный подход к планированию — выбор маршрута, чек-лист снаряжения, план питания, инструктаж по безопасности и запасные варианты.
  audience: Опытные гребцы, планирующие свой первый многодневный поход.
  steps:
    - Выберите маршрут с оборудованными стоянками и точками выхода
    - Планируйте 10-15 миль в день с учётом ветра и течения
    - Проверьте таблицы приливов и прогнозы погоды на всё время похода
    - Упакуйте снаряжение в водонепроницаемые сухие мешки — суммарно 20-30 фунтов
    - Распределяйте вес равномерно — самые тяжёлые предметы в центр
    - Оставьте детальный маршрутный план человеку на берегу
    - Возьмите навигацию — бумажную карту, компас и GPS-резерв
    - Упакуйте аварийное укрытие, запас еды и аптечку
  faq:
    - q: Какова идеальная дневная дистанция?
      a: 10-15 миль в день для опытных гребцов. Новичкам стоит планировать 5-8 миль. Всегда закладывайте запас времени на погоду.
    - q: Сколько воды брать с собой?
      a: 1 галлон на человека в день. В жару — 1,5 галлона. Возьмите фильтр для воды или таблетки для обеззараживания для пополнения запасов.
    - q: Какой предмет безопасности самый важный?
      a: Средство связи. VHF-радиостанция или спутниковый мессенджер могут спасти жизнь в чрезвычайной ситуации. Сотовая связь в отдалённых районах ненадёжна.

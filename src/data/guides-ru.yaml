  title: Понимание погодных условий для гребли на SUP
  description: Научитесь читать ветер, волны, приливы и погодные условия, чтобы принимать безопасные решения на воде.
  tldr: Проверяйте три вещи перед каждым выходом — скорость ветра (до 10 mph для новичков), высоту волны (до 1 фута для новичков) и температуру воды (одевайтесь по воде, а не по воздуху). Береговой ветер опасен на любом уровне подготовки.
  problem: Большинство погодных происшествий случается из-за неверной оценки условий — проверяют температуру воздуха, но не воды, или не понимают, что береговой ветер может унести в открытое море.
  solution: Используйте структурированную оценку погоды перед выходом — направление и скорость ветра, период и высота волны, состояние прилива и температура воды. Понимайте, как каждый фактор влияет на вашу безопасность.
  audience: Все гребцы, выходящие на открытую воду — озёра, бухты, реки и океан.
  steps:
    - Проверьте скорость и направление ветра — береговой ветер (дующий с суши в море) самый опасный
    - Оцените волнение — период волны важен не меньше её высоты
    - Узнайте прилив — приливные течения могут быть сильнее вашей скорости гребли
    - Измерьте температуру воды — ниже 60°F/15°C нужна тепловая защита
    - Проверьте видимость — туман и ливень снижают видимость и повышают риск столкновений
    - Учитывайте местные опасности — подводные камни, сильные течения, зоны судоходства
  faq:
    - q: При каком ветре кататься на SUP уже опасно?
      a: 'Новичкам — свыше 10 mph (8 узлов). Средний уровень — свыше 15 mph (13 узлов). Продвинутым — свыше 20 mph (17 узлов). Если сомневаетесь, не выходите на воду.'
    - q: Что означает период волны?
      a: Период волны — время между последовательными волнами. Короткие периоды (менее 8 секунд) означают крутые беспорядочные волны. Длинные периоды (более 12 секунд) означают более ровную и предсказуемую зыбь.
    - q: Можно ли грести под дождём?
      a: Небольшой дождь обычно безопасен. Ливень снижает видимость и может указывать на смену ветра. При грозе необходимо немедленно покинуть воду.

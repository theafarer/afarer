  description: Как безопасно брать детей на SUP — возрастные рекомендации, снаряжение и занятия.
  tldr: Дети от 6 лет могут кататься на SUP со взрослым. Дети от 10 лет могут грести на своей доске под присмотром. Используйте широкую стабильную доску, всегда надевайте PFD, оставайтесь на мелкой спокойной воде и держите сессии короткими (максимум 30-45 минут).
  problem: Родители хотят разделить с детьми водные виды спорта, но беспокоятся о безопасности, соответствии снаряжения и вовлечённости детей.
  solution: Используйте доску подходящего размера для совместной езды, следите, чтобы каждый ребёнок был в правильно подобранном PFD, начните на мелкой тёплой воде и сделайте процесс весёлым с играми и короткими сессиями.
  audience: Родители, которые хотят познакомить детей с греблей на SUP.
  steps:
    - Возраст 4-6 лет — пассажир на доске взрослого — ребёнок сидит спереди и держится за центральную ручку
    - Возраст 6-10 лет — на коленях или сидя на своей доске под присмотром взрослого и с лишем
    - Возраст 10+ — гребут на своей доске под присмотром взрослого рядом
    - Всегда надевайте PFD — дети должны постоянно быть в правильно подобранном спасательном жилете
    - Оставайтесь на мелкой воде (по пояс взрослому)
    - Держите сессии короткими — максимум 30-45 минут для детей до 10 лет
    - Сделайте это весёлым — играйте в игры, ищите рыбу, тренируйтесь вставать
  faq:
    - q: С какого возраста ребёнок может кататься на SUP один?
      a: Около 10-12 лет под присмотром, в зависимости от плавательных навыков и комфорта ребёнка в воде. Всегда в спокойной мелкой воде.
    - q: Какая доска лучше для SUP с детьми?
      a: Широкая доска (34" и более) с высокой грузоподъёмностью для совместной езды. SUP Explorer 11 шириной 33" и грузоподъёмностью 220 фунтов хорошо подходит для пары родитель-ребёнок.
    - q: Какое снаряжение безопасности нужно детям?
      a: Правильно подобранный сертифицированный по CE спасательный жилет, лиш (при совместной езде крепится к доске взрослого), солнцезащитный крем и кепка.

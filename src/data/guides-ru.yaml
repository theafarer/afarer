- slug: beginner-guide
  category: tutorial
  title: Руководство для новичков по гребле на SUP
  description: Всё, что нужно знать перед первой сессией на SUP — от настройки снаряжения до базовой техники гребли.
  tldr: Начните на спокойной плоской воде с широкой стабильной доской. Накачайте до 12-15 PSI, закрепите лиш и используйте правильную длину весла (на 6-8 дюймов выше вашего роста). Держите стойку на ширине плеч, слегка согните колени и смотрите на горизонт.
  problem: Новички часто пропускают базовую подготовку — неправильная длина весла, плохая стойка или выход на неспокойную воду — что приводит к падениям, разочарованию и потере мотивации.
  solution: Следуйте структурированному плану первой сессии — выберите спокойную воду, правильно настройте снаряжение, потренируйтесь на коленях перед вставанием и освойте прямой гребок до попыток поворотов.
  audience: Полные новички, которые никогда не стояли на SUP.
  steps:
    - Выберите плоскую спокойную воду без лодочного трафика — небольшой пруд или защищённая бухта идеальны
    - Накачайте доску до 12-15 PSI двухтактной помпой
    - Прикрепите спиральный лиш к щиколотке или голени, но никогда к ручке доски
    - Вставьте плавник и затяните винт
    - Отрегулируйте длину весла — оно должно быть на 6-8 дюймов выше вашего роста
    - Начните с колен на доске, сделайте несколько гребков, чтобы почувствовать баланс
    - Вставайте по одной ноге за раз, стопы на ширине плеч, колени мягкие
    - Смотрите на горизонт, а не под ноги — доска идёт туда, куда вы смотрите
  faq:
    - q: Что надеть для гребли на SUP?
      a: Быстросохнущая спортивная одежда, спасательный жилет, солнцезащитный крем и кепка. В холодной воде надевайте гидрокостюм. Всегда надевайте лиш и носите телефон в водонепроницаемом чехле.
    - q: Как вернуться на доску после падения?
      a: Сохраняйте спокойствие. Доплывите до доски, ухватитесь за центральную ручку и, работая ногами, одним движением заберитесь на доску. Сначала вернитесь в положение на коленях, затем вставайте.
    - q: При каком ветре безопасно выходить?
      a: Новичкам — ветер до 10 mph (5 узлов). Если ветер дует от берега, не выходите на воду. Проверьте прогноз и помните, что береговой ветер опасен.

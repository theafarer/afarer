- slug: sup-storage-winter-care
  category: maintenance
  title: Хранение и зимний уход за SUP — продлите жизнь вашей доске
  description: Как правильно хранить, чистить и консервировать на зиму надувную доску SUP. Избегайте плесени, UV-повреждений и деградации материала при правильном уходе.
  tldr: Ополаскивайте пресной водой после каждого использования. Полностью высушивайте перед хранением. Спускайте воздух и храните в прохладном тёмном месте вдали от прямых солнечных лучей и экстремальных температур. Никогда не храните накачанной или в горячей машине. Периодически наносите UV-защиту.
  problem: Неправильное хранение — главная причина преждевременного выхода SUP из строя — плесень, разрушение материала, расслоение и повреждение клапана от жары или холода.
  solution: Следуйте трёхшаговой процедуре ухода — ополаскивайте после каждой сессии, тщательно сушите перед хранением и храните спущенной в помещении с контролируемой температурой 50-80°F (10-27°C).
  audience: Все владельцы SUP, которые хотят, чтобы их доска прослужила 5+ лет.
  steps:
    - Ополаскивайте доску, весло и помпу пресной водой после каждой сессии в солёной или грязной воде
    - Мойте мягким мылом и мягкой губкой — никогда агрессивной химией или мойкой высокого давления
    - Полностью высушите доску на улице перед спуском воздуха (откройте клапан, чтобы вышла внутренняя влага)
    - Полностью спустите воздух, скатывайте от носа к корме, выдавливая остатки воздуха
    - Протрите рюкзак насухо перед укладкой доски
    - Храните в прохладном тёмном шкафу или под кроватью — никогда на прямом солнце, в горячей машине или промерзающем сарае
  faq:
    - q: Можно ли оставлять SUP накачанным весь сезон
      a: Лучше спускать воздух при длительном простое. Постоянное давление PSI ускоряет усталость материала. Спускайте воздух между сессиями, если храните дольше 2 недель.
    - q: Как удалить плесень с SUP
      a: Смешайте мягкое мыло с тёплой водой и добавьте немного белого уксуса. Аккуратно потрите мягкой щёткой. Тщательно ополосните и высушите в тени. Избегайте отбеливателя — он повреждает PVC.
    - q: Можно ли хранить SUP в гараже
      a: Только если гараж круглый год держит 50-80°F. Чердаки и неотапливаемые гаражи подвержены температурным экстремумам, повреждающим сердечник drop-stitch.

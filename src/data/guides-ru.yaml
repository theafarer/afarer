  title: Основные техники гребли на SUP
  description: Освойте прямой гребок, круговой гребок и поворот cross-bow, чтобы грести эффективно в любых условиях.
  tldr: Прямой гребок использует корпус, а не руки. Круговой гребок поворачивает доску. Поворот cross-bow — самый эффективный разворот. Держите весло вертикально и полностью погружайте лопасть для максимальной передачи усилия.
  problem: Большинство гребцов используют гребки с доминированием рук, тратя энергию и вызывая усталость плеч. Плохая техника также затрудняет контроль доски при ветре и волне.
  solution: Освойте три базовых гребка — прямой, круговой и поворот cross-bow — с правильной механикой тела. Отрабатывайте каждый на спокойной воде перед выходом в сложные условия.
  audience: Гребцы, которые хотят грести дольше, быстрее и с меньшей усталостью.
  steps:
    - 'Прямой гребок: вытянитесь вперёд, полностью погрузите лопасть, тяните назад с вращением корпуса (не руками), вынимайте весло у щиколотки'
    - 'Круговой гребок: вытянитесь вперёд у борта, ведите лопасть широкой дугой к корме, разворачивая доску в сторону от весла'
    - 'Поворот cross-bow: положите весло на противоположную сторону доски без смены рук, тяните к корме'
    - 'Поддержка: используйте низкую поддержку для устойчивости на волне — плашмя шлёпните лопастью по поверхности воды'
    - 'Гребок подтягивания: вытянитесь в сторону, тяните доску боком к веслу'
  faq:
    - q: Как грести по прямой линии?
      a: Используйте одинаковую длину гребка с обеих сторон. Меняйте сторону каждые 5-10 гребков. Для ориентира смотрите в фиксированную точку на горизонте.
    - q: Нужно ли сгибать колени?
      a: Да. Держите лёгкий сгиб в коленях как амортизаторы. Выпрямленные колени передают каждую рябь в корпус и снижают устойчивость.
    - q: Как грести против ветра?
      a: Понизьте стойку, используйте более короткие и частые гребки и держитесь ближе к берегу, где ветер часто слабее. Если ветер слишком сильный, не выходите на воду.

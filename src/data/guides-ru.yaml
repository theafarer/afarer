- slug: sup-maintenance
  category: maintenance
  title: Как чистить и хранить надувной SUP
  description: Пошаговое руководство по уходу для максимального срока службы вашей надувной SUP-доски.
  tldr: Ополаскивайте пресной водой после каждого использования, полностью высушивайте перед хранением, сдувайте и сворачивайте неплотно (не в тугий рулон), храните в прохладном сухом месте вдали от прямых солнечных лучей и ежемесячно осматривайте швы.
  problem: Неправильное хранение и чистка — главные причины преждевременного выхода надувных SUP из строя — плесень, UV-повреждения и расслоение швов.
  solution: Следуйте постоянной рутине после каждой сессии — ополосните, высушите, осмотрите, сдуйте и уберите на хранение. Используйте мягкое мыло для стойкой грязи. Никогда не храните доску влажной или на прямом солнце.
  audience: Все владельцы надувных SUP, которые хотят, чтобы доска служила 5 и более лет.
  steps:
    - Ополосните доску пресной водой сразу после использования, особенно после солёной воды
    - Мойте мягким мылом и мягкой губкой — избегайте агрессивной химии и моек высокого давления
    - Полностью высушите доску — откройте клапан, чтобы вышла застрявшая вода
    - Осмотрите доску на предмет повреждений — проверьте швы, клапан и поверхность на проколы
    - Полностью сдуйте доску — выкрутите сердечник клапана для полного сдувания
    - Сверните доску неплотно — начните от носа, избегайте тугих заломов
    - Храните доску в рюкзаке в прохладном сухом месте вдали от прямых солнечных лучей
  faq:
    - q: Можно ли оставлять SUP накачанным весь сезон?
      a: Да, но держите доску вдали от прямых солнечных лучей, когда не используете. Для длительного хранения рекомендуется частичное сдувание до 8-10 PSI.
    - q: Как отремонтировать прокол?
      a: Очистите место прокола, вырежьте заплатку со скруглёнными углами, нанесите клей, плотно прижмите и подождите 24 часа перед накачиванием. Доски afarer комплектуются ремкомплектом.
    - q: Как часто проверять клапан?
      a: Ежемесячно. Клапан — самая частая точка отказа. Проверьте, что шпенёк клапана двигается свободно, а O-ring цел.

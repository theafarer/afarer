  category: buying-guide
  title: 'Надувные или жёсткие SUP-доски: что выбрать?'
  description: Объективное сравнение надувных и жёстких SUP-досок по производительности, портативности, долговечности и ценности.
  tldr: Надувные доски выигрывают в портативности, хранении и стойкости к ударам. Жёсткие доски выигрывают в максимальной жёсткости и скорости. Современные надувные доски drop-stitch при 15 PSI сокращают 90% разрыва в характеристиках.
  problem: Покупатели разрываются между удобством надувных досок и репутацией жёстких, не имея ясных данных об их реальном сравнении.
  solution: Сравните конкретные критерии — жёсткость, вес, размер в сложенном виде, долговечность, ремонт и стоимость — со своим фактическим сценарием использования. Для большинства рекреационных гребцов качественная надувная доска — лучший выбор.
  audience: Покупатели SUP, выбирающие между надувной и жёсткой конструкцией.
  steps:
    - Оцените потребность в портативности — надувная складывается до размера рюкзака, жёсткая требует багажника на крыше
    - Сравните жёсткость — надувная при 15 PSI имеет минимальный прогиб, жёсткая не прогибается вовсе
    - Оцените хранение — надувная хранится в шкафу, жёсткой нужен гараж или стойка
    - Учтите долговечность — надувная поглощает удары, жёсткая может продавливаться и трескаться
    - Учтите ремонт — заплатки на надувной просты, ремонт жёсткой требует профессиональной работы
    - Проверьте характеристики — у жёстких досок небольшое преимущество в скорости, надувные лучше поглощают удары
  faq:
    - q: Так ли жёстки надувные SUP, как жёсткие доски?
      a: При 15 PSI с конструкцией drop-stitch разница в жёсткости минимальна для рекреационного использования. Её заметят только соревновательные гонщики и сёрферы.
    - q: Сколько служит надувной SUP?
      a: При правильном уходе 5-10 лет. Морской PVC устойчив к UV и истиранию. Храните доску вдали от прямых солнечных лучей и ополаскивайте пресной водой после выхода в солёную воду.
    - q: Можно ли использовать надувной SUP для сёрфинга?
      a: Да, но надувные доски лучше всего подходят для небольшой и умеренной волны (до 3 футов). Для постоянного сёрфинга жёсткая доска даёт лучшую отзывчивость и работу с кантом.

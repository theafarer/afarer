- slug: sup-inflation-psi-guide
  category: technical
  title: Руководство по накачке SUP — оптимальный PSI для характеристик и безопасности
  description: Полное руководство по давлению накачки SUP — рекомендуемые диапазоны PSI, влияние давления на характеристики и советы по правильному использованию помпы.
  tldr: Накачивайте до 12-15 PSI для большинства надувных SUP. Выше давление — больше жёсткости, но дольше накачка. Ниже давление — мягче ощущение, но больше прогиб. Никогда не превышайте максимальный PSI, указанный на доске. Используйте помпу с точным манометром. Холодный воздух снижает давление, горячее солнце повышает.
  problem: Недокачанные доски ощущаются вялыми и чрезмерно прогибаются. Перекачанные рискуют разрушением швов. Многие гребцы угадывают PSI вместо точного измерения.
  solution: Используйте помпу со встроенным манометром. Стремитесь к 15 PSI для максимальной жёсткости. Проверяйте давление перед каждой сессией — изменения температуры сильно влияют на PSI.
  audience: Все владельцы надувных SUP.
  steps:
    - Проверьте рекомендуемый диапазон PSI, указанный на доске рядом с клапаном
    - Накачайте двухтактной помпой до середины рекомендуемого диапазона
    - Переключитесь в однотактный режим на последние 3-4 PSI для более точного контроля
    - Проверьте давление манометром — аналоговые надёжнее цифровых
    - Подстройтесь под условия — выше PSI для туризма и гонок, ниже PSI для бурной воды и каменистых спусков
    - Перепроверьте давление через 10 минут покоя — температурное равновесие меняет PSI
  faq:
    - q: Можно ли перекачать SUP
      a: Да. Превышение номинального максимума (обычно 15-18 PSI) может расслоить швы и повредить сердечник drop-stitch. Всегда оставайтесь в указанном диапазоне.
    - q: Влияет ли температура на PSI
      a: Существенно. Доска, накачанная до 15 PSI при 70°F, может достичь 18 PSI на прямом солнце при 95°F. Холодная вода может снизить давление до 12 PSI. Проверяйте давление после смены условий.
    - q: Какой PSI подходит новичкам
      a: 12-13 PSI для обучения дают чуть более мягкую платформу, более щадящую при падениях. Повысьте до 15 PSI с ростом навыков.

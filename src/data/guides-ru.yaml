  title: Лучший SUP для крупных гребцов — доски с высокой грузоподъёмностью
  description: Руководство по выбору надувных SUP для крупных гребцов (200-400 фунтов). Рекомендации по ширине, длине, объёму и грузоподъёмности досок для больших и высоких райдеров.
  tldr: Крупным гребцам нужны более широкие доски (34-36"), большая длина (11'6"-12') и высокая грузоподъёмность (300-400 фунтов). Ищите PVC военного класса, усиленный drop-stitch и двухслойную конструкцию. Избегайте узких досок шириной менее 32" независимо от длины.
  problem: Стандартные SUP имеют грузоподъёмность 200-250 фунтов, что исключает многих гребцов. Езда на слишком маленькой доске некомфортна, неустойчива и потенциально опасна.
  solution: Выбирайте доски с рейтингом 300+ фунтов и дополнительной шириной для устойчивости. Серии Tropical Breeze и Leviathan Wake от afarer предлагают объём и усиление, необходимые крупным гребцам.
  audience: Гребцы весом более 200 фунтов, которым нужна доска, безопасно держащая их вес.
  steps:
    - Рассчитайте общую нагрузку — вес тела + снаряжение + 20% запаса прочности
    - Выберите доску шириной 34" или шире для достаточной устойчивости
    - Выберите длину 11'6" или больше для правильного водоизмещения
    - Проверьте грузоподъёмность — общая нагрузка не должна превышать 80% максимума
    - Ищите усиленный drop-stitch и PVC военного класса
    - Сначала протестируйте доску на спокойной воде, чтобы убедиться в устойчивости
  faq:
    - q: Какая ширина SUP лучше для гребца весом 250 фунтов
      a: Минимум 34" ширины. Дополнительная ширина даёт первичную устойчивость, необходимую крупным райдерам, чтобы уверенно стоять и грести.
    - q: Может ли человек весом 300 фунтов кататься на надувном SUP
      a: Да, на доске с рейтингом 350-400 фунтов. Tropical Breeze Island Escape шириной 34"+ держит высокие нагрузки. Всегда проверяйте конкретный весовой рейтинг.
    - q: Нужны ли крупным гребцам специальные вёсла
      a: Более длинное весло (на 1-2 дюйма выше стандартного) помогает при более высокой стойке на широкой толстой доске. Рассмотрите карбоновое древко для снижения усталости рук.

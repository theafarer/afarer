  category: technical
  title: Как читать характеристики SUP-доски
  description: Техническое руководство по пониманию характеристик SUP — объём, размеры, конструкция и их влияние на ходовые качества.
  tldr: Ключевые характеристики — объём (литры) определяет плавучесть и грузоподъёмность, ширина — устойчивость, длина — курс и скорость, толщина — жёсткость, а рейтинг PSI — давление накачивания для оптимальных характеристик.
  problem: Спецификации продуктов перечисляют цифры без контекста, оставляя покупателей в неведении, какие характеристики действительно важны для их задач.
  solution: Переведите каждую характеристику в реальное поведение — объём в плавучесть, ширину в устойчивость, длину в скольжение, толщину в жёсткость, конструкцию в долговечность.
  audience: Гребцы среднего уровня и технически подкованные покупатели, принимающие решения на основе данных.
  steps:
    - Проверьте объём в литрах — ваш вес плюс снаряжение не должны превышать 80% паспортного объёма доски
    - 'Проверьте ширину — шире (32-34") означает больше устойчивости, уже (28-30") означает больше скорости'
    - 'Проверьте длину — длиннее (12-14") означает лучший курс, короче (10-11") означает лучшую манёвренность'
    - Проверьте толщину — 6" стандарт, 8" даёт больше жёсткости и грузоподъёмности
    - Проверьте рейтинг PSI — накачивайте до максимального паспортного PSI для оптимальной жёсткости
    - Проверьте материалы конструкции — плотность drop-stitch, слои PVC, усиление кантов
  faq:
    - q: Что означает drop-stitch?
      a: Drop-stitch — метод конструкции, при котором тысячи нитей соединяют верхний и нижний слои доски. Это позволяет накачивать доску до высокого давления (12-15 PSI) для экстремальной жёсткости.
    - q: Каково идеальное соотношение веса к объёму?
      a: Хороший ориентир — примерно 5-6 фунтов веса райдера на литр объёма доски. Гребцу весом 220 фунтов подойдут доски объёмом от 180 литров.
    - q: Важен ли вес доски?
      a: Да. Более лёгкие доски (до 20 фунтов) легче носить и перевозить. Более тяжёлые (от 25 фунтов) часто означают более долговечную многослойную конструкцию PVC.

  title: Как отремонтировать надувной SUP
  description: Пошаговое руководство по ремонту проколов, проблем клапана и повреждений швов надувных SUP.
  tldr: Небольшие проколы (менее 1/4") ремонтопригодны комплектными заплатками. Очистите место, нанесите клей для PVC, прижмите заплатку и подождите 24 часа. Утечки клапана обычно требуют замены O-ring. Большие разрывы или расслоение швов требуют профессионального ремонта.
  problem: Небольшие проколы и проблемы клапана часты, но легко устранимы. Без правильной техники ремонта пользователи либо переплачивают за профессиональный сервис, либо усугубляют повреждение.
  solution: Определите тип повреждения — прокол, утечка клапана или проблема шва — и примените подходящий метод ремонта. Большинство ремонтов занимает 30 минут плюс время отверждения.
  audience: Владельцы надувных SUP, которые хотят выполнять базовый ремонт самостоятельно.
  steps:
    - Найдите утечку — полностью накачайте доску, слушайте выходящий воздух, ощупывайте рукой или используйте мыльную воду
    - Отметьте место утечки маркером или скотчем
    - Очистите область вокруг утечки изопропиловым спиртом — не менее 2 дюймов вокруг повреждения
    - Зашкурьте поверхность мелкой наждачной бумагой для лучшего сцепления клея
    - Нанесите клей для PVC на заплатку и поверхность доски
    - Подождите 5 минут, пока клей станет липким
    - Плотно прижмите заплатку, выкатайте пузыри воздуха валиком или пластиковой картой
    - Дайте высохнуть 24 часа перед накачиванием до полного давления
  faq:
    - q: Можно ли отремонтировать прокол на воде?
      a: Аварийный ремонт заплаткой и скотчем поможет добраться до берега. Полный ремонт требует сухих условий и 24 часов отверждения.
    - q: Как устранить утечку клапана?
      a: Выкрутите сердечник клапана комплектным инструментом, проверьте O-ring на повреждения, при необходимости замените и плотно вкрутите сердечник обратно.
    - q: Какой клей использовать для ремонта PVC?
      a: Используйте специальный клей для PVC, например HH-66 или Clifton. Обычный супер-клей плохо склеивается с надувными материалами из PVC.

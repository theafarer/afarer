  title: Йога на SUP — полное руководство по гребле и йоге
  description: Совместите греблю на SUP с йогой для улучшения баланса, силы и осознанности на воде.
  tldr: Йога на SUP добавляет элемент неустойчивости, который резко усиливает вовлечение корпуса по сравнению с йогой на суше. Начните с базовых поз на широкой стабильной доске в спокойной воде. Используйте нескользящий настил. Никогда не занимайтесь йогой на SUP в одиночку.
  problem: Традиционные коврики для йоги дают идеально стабильную поверхность, убирая задачу баланса, которая делает йогу на SUP уникально эффективной для силы корпуса и концентрации.
  solution: Используйте особо широкую доску SUP (34" и более) с нескользящим настилом на всю длину. Занимайтесь в спокойной мелкой воде. Освойте базовые позы перед перевёрнутыми асанами.
  audience: Практикующие йогу и гребцы, которые хотят совместить тренировку баланса с осознанностью.
  steps:
    - Заякорьте доску в мелкой спокойной воде — используйте якорь-груз или привяжитесь к пирсу
    - Начните с сидячих поз — простая поза со скрещенными ногами, поза лодки, скручивание сидя
    - Перейдите к позам на коленях — поза стола, кошка-корова, поза алмаза
    - Переходите к стоячим позам — гора, воин I, воин II, поза дерева
    - Практикуйте позы баланса — полумесяц, орёл, танцор
    - Завершите шавасаной — лягте на доску, почувствуйте движение воды
  faq:
    - q: Какая доска лучше для йоги на SUP?
      a: Широкая доска (34" и более) с нескользящим настилом на всю длину даёт самую стабильную платформу. SUP Tour 12 предлагает хороший баланс устойчивости и скольжения.
    - q: Опасна ли йога на SUP?
      a: Не опаснее йоги на суше при безопасной практике. Выбирайте спокойную мелкую воду. Надевайте лиш. Занимайтесь с партнёром. Избегайте глубокой воды в первых сессиях.
    - q: Нужное ли специальное снаряжение?
      a: Широкая стабильная доска, нескользящий настил на всю длину, лиш и PFD. Некоторые практикующие используют водонепроницаемый коврик для дополнительного сцепления.

- slug: sup-board-materials
  category: technical
  title: Материалы досок SUP — PVC, EPS, эпоксидная смола и drop-stitch
  description: Техническое руководство по конструкционным материалам SUP — надувные доски drop-stitch PVC против жёстких досок с сердечником из EPS-пены. Разберитесь, почему каждый тип ведёт себя по-разному.
  tldr: Надувные SUP используют drop-stitch PVC с тысячами внутренних нитей для жёсткости. Жёсткие доски используют сердечник из EPS-пены с эпоксидной или стекловолоконной оболочкой. Надувные выигрывают в портативности и прочности. Жёсткие — в скорости и ощущениях. Современные технологии drop-stitch при 15 PSI соперничают с жёсткостью жёстких досок.
  problem: Покупатели не понимают фундаментальных конструкционных различий между надувными и жёсткими досками, что ведёт к ошибочным покупкам.
  solution: Подберите материал доски под основное применение — надувная drop-stitch для путешествий, хранения и долговечности. EPS и эпоксидная смола для гонок, сёрфинга и максимальной производительности.
  audience: Покупатели SUP, сравнивающие конструкции надувных и жёстких досок.
  steps:
    - Надувная drop-stitch — тысячи полиэстеровых нитей соединяют верхний и нижний слои, создавая жёсткую структуру при давлении 12-15 PSI
    - Жёсткая EPS-пена — сердечник из вспененного полистирола, сформированный под дизайн корпуса и герметизированный эпоксидной смолой и слоями стекловолокна
    - Преимущества надувных — компактность, неубиваемость, лёгкость переноски, мягкие кромки для безопасности
    - Преимущества жёстких — меньший общий вес, более жёсткая платформа, лучшее скольжение, большая отзывчивость
    - Гибридные варианты — некоторые производители комбинируют drop-stitch с жёсткими панелями, объединяя лучшее из двух миров
  faq:
    - q: Надувные SUP так же жёсткие, как жёсткие доски
      a: При 15 PSI и качественной конструкции drop-stitch современные надувные доски очень близки. Большинство любителей не заметят разницы. Гонщики почувствуют преимущество жёсткой доски.
    - q: Какой материал служит дольше
      a: Надувные SUP служат 5-10 лет при уходе. Жёсткие — 10-20 лет, но подвержены трещинам, сколам и водопоглощению. Надувные устойчивее к повреждениям в быту.
    - q: Экологичен ли PVC
      a: Производство PVC влияет на окружающую среду, но надувные SUP служат дольше (реже замена) и упаковываются компактнее (меньше выбросы при транспортировке). Всегда утилизируйте старые доски правильно.

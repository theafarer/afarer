  title: Как выбрать весло для SUP
  description: Руководство по материалам весла, форме лопасти, типам древка и подбору размера для SUP.
  tldr: Длина весла — весло для SUP должно быть на 6-8 дюймов выше вашего роста. Форма лопасти — двугранные лопасти держат курс, плоские дают больше зацепа. Материал древка — карбон самый лёгкий, стекловолокно лучшее соотношение цены и качества, алюминий бюджетный вариант.
  problem: Неправильный размер или материал весла вызывает лишнюю усталость, низкую эффективность гребка и нагрузку на суставы.
  solution: Подберите длину весла, форму лопасти, материал и гибкость древка под свой стиль гребли, комплекцию и бюджет.
  audience: Гребцы на SUP, выбирающие первое или следующее весло.
  steps:
    - Измерьте длину весла — на 6-8 дюймов выше вашего роста для обычной гребли
    - Выберите материал лопасти — нейлон для бюджета, стекловолокно для цены и качества, карбон для производительности
    - Выберите форму лопасти — двугранная для ровного хода, плоская для мощности, ложкообразная для гонок
    - Выберите тип древка — прямое для обычной гребли, изогнутое для гоночного SUP
    - Проверьте гибкость — жёсткие древки передают больше мощности, гибкие снижают нагрузку на суставы
  faq:
    - q: Какой материал весла лучший?
      a: Стекловолокно даёт лучший баланс веса, долговечности и цены. Карбон легче, но дороже и хрупче. Нейлон тяжёлый, но практически неубиваемый.
    - q: Как понять, что длина весла правильная?
      a: Поставьте весло вертикально рядом с собой — рукоятка должна достигать вашего запястья, когда рука поднята над головой.
    - q: Взять цельное или регулируемое весло?
      a: Регулируемые весла удобны для совместного использования и поездок. Цельные легче, жёстче и эффективнее для постоянного использования.

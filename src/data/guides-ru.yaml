- slug: how-to-choose-your-sup
  category: buying-guide
  title: Как выбрать SUP-доску
  description: Полное руководство по выбору подходящей SUP-доски с учётом вашего уровня подготовки, условий на воде и целей использования.
  tldr: Выбирайте SUP с учётом уровня подготовки, типа воды и основного назначения. Доски All-Around подходят новичкам и спокойной воде. Туринговые доски созданы для дальних заплывов. Йога-доски дают дополнительную ширину для устойчивости. Спортивные доски подойдут опытным гребцам в разных условиях.
  problem: Большинство покупателей впервые выбирают SUP-доску по цене или внешнему виду, а не по тому, как и где они будут фактически грести. Это приводит к плохой устойчивости, слабым характеристикам и разочарованию.
  solution: Подберите форму, объём и конструкцию доски под свой уровень подготовки и основную водную среду. Более широкие доски (32-34") дают устойчивость новичкам. Более длинные доски (12-14") лучше держат курс в туринге. Конструкция drop-stitch при 12-15 PSI обеспечивает жёсткость, сопоставимую с жёсткими досками.
  audience: Покупатели первой SUP-доски, рекреационные гребцы и все, кто обновляется с базовой доски.
  steps:
    - Определите основную среду гребли — озеро, океан, река или смешанная
    - 'Подберите ширину доски под свой уровень: 32-34" для новичков, 30-32" для среднего уровня, 28-30" для продвинутых'
    - Выбирайте длину доски по назначению — короче для манёвренности, длиннее для курса и скорости
    - Выберите конструкцию — надувная drop-stitch для портативности, жёсткая доска для максимальной производительности
    - Проверьте грузоподъёмность — ваш вес плюс снаряжение не должны превышать 80% предела доски
    - Проверьте комплектные аксессуары — помпа, лиш, плавник, рюкзак и ремкомплект
  faq:
    - q: Какая ширина SUP лучше для новичков?
      a: От 32 до 34 дюймов — самая стабильная платформа для обучения. SUP Explorer 11 шириной 33" идеален для первых выходов на спокойной воде.
    - q: Надувная или жёсткая SUP-доска?
      a: Надувные доски дают портативность, удобство хранения и поглощение ударов. Жёсткие доски обеспечивают максимальную жёсткость и скорость. Для большинства рекреационных пользователей качественная надувная доска с сердечником drop-stitch — практичный выбор.
    - q: До какого PSI накачивать?
      a: Доски afarer рассчитаны на 12-15 PSI. При 15 PSI доска достигает максимальной жёсткости, сопоставимой с жёсткой доской. Всегда оставайтесь в пределах рабочего давления, указанного на доске.

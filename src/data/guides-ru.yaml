  title: Фитнес на SUP — тренировка всего тела на воде
  description: Как гребля на SUP развивает силу корпуса, баланс и кардио-выносливость.
  tldr: SUP задействует корпус, ноги, спину и плечи в каждом гребке. Часовая сессия сжигает 300-500 калорий. Гребля против ветра или течения удваивает интенсивность. Йога на SUP добавляет работу над гибкостью и балансом.
  problem: Многие воспринимают греблю на SUP как развлечение, а не полноценный фитнес-инструмент, упуская её потенциал для тренировки всего тела.
  solution: Структурируйте сессии на SUP под конкретные цели — длинные гребли для кардио, интервальные спурты для мощности, йога на SUP для гибкости, дальние заплывы для мышечной выносливости.
  audience: Любители фитнеса, ищущие низкоударную тренировку всего тела с высокой вовлечённостью.
  steps:
    - Разомнитесь на берегу — круги руками, скручивания корпуса и махи ногами в течение 5 минут
    - Начните с 10 минут равномерной гребли в умеренном темпе
    - Перейдите к интервальной тренировке — 2 минуты интенсивной гребли, 2 минуты лёгкого восстановления
    - Добавьте позы йоги на SUP — собака мордой вниз, воин II и поза дерева на доске
    - Завершите спокойной греблей и статической растяжкой на доске
  faq:
    - q: SUP полезнее бега для фитнеса?
      a: SUP даёт сопоставимую кардио-нагрузку с меньшим воздействием на суставы. Он также активнее задействует верх тела и корпус, чем бег.
    - q: Сколько калорий сжигает SUP?
      a: Примерно 300-500 калорий в час в умеренном темпе. Гонки или гребля против ветра сжигают 600-800 калорий в час.
    - q: Можно ли накачать мышцы на SUP?
      a: Да. Гребля развивает мышцы плеч, спины и корпуса. Балансирование задействует ноги и мышцы-стабилизаторы. Это тренировка всего тела с сопротивлением.

  category: buying-guide
  title: SUP для бурной воды — руководство покупателя надувной доски для сплава
  description: Как выбрать SUP для сплава по рекам с порогами — более короткие доски, усиленная конструкция, снаряжение безопасности и техника гребли для порогов I-III категории.
  tldr: SUP для бурной воды требует меньшей длины (8-10'), усиленных кромок, высокого PSI (15+) и нескольких воздушных камер для безопасности. Используйте прямой речной лиш (не спиральный), надевайте шлем и PFD и всегда плавайте с напарником. Начинайте с I категории, прежде чем идти на сложные пороги.
  problem: Выход на быстрое течение на стандартной универсальной доске опасен — стандартные доски не имеют манёвренности, стойкости к ударам и функций безопасности, необходимых для рек.
  solution: Выберите специализированный SUP для бурной воды — короткая длина для манёвренности, усиленная конструкция для ударов о камни и многокамерная схема для безопасности.
  audience: Опытные гребцы, переходящие к сплаву по рекам.
  steps:
    - Выберите доску длиной 8-10' для максимальной манёвренности в порогах
    - Ищите усиленные кромки и PVC военного класса
    - Выберите доску с 2 и более воздушными камерами для страховки при проколе
    - Используйте прямой речной лиш с креплением к поясу с быстрой отстёжкой
    - Надевайте шлем, PFD и подходящую речную обувь
    - Начинайте с порогов I категории и продвигайтесь постепенно с опытным напарником
  faq:
    - q: Можно ли использовать обычный SUP для бурной воды
      a: Не рекомендуется. Стандартные SUP не устойчивы к ударам и могут расслоиться на камнях. Многокамерная безопасность критична для речных условий.
    - q: Какой PSI для SUP на бурной воде
      a: 15+ PSI для максимальной жёсткости. Жёсткая доска отскакивает от камней лучше, чем недокачанная, облегающая препятствия.
    - q: Нужны ли особые навыки гребли для SUP на бурной воде
      a: Да. Чтение реки, повороты в суводи, паромная переправа и техники поддержки — обязательные навыки. Пройдите курс SUP на бурной воде, прежде чем идти на II категорию и выше.

  category: planning
  title: Путешествия с SUP — перелёты и автопутешествия с надувным SUP
  description: Как путешествовать с надувным SUP на самолёте, машине или в автодоме. Советы о тарифах авиакомпаний, упаковке, накачке в пункте назначения и особенностях международных поездок.
  tldr: Спустите воздух, скатайте доску и упакуйте SUP в рюкзак. Большинство авиакомпаний принимает его как регистрируемый багаж (до 50 фунтов / 50 линейных дюймов). Всегда кладите помпу и весло в ту же сумку. Приезжайте заранее — потребуется дополнительное время, если сотрудник засомневается в размере сумки. Для долгих поездок рассмотрите отправку грузом заранее.
  problem: Путешествие с SUP кажется сложным — лимиты размеров авиакомпаний, опасения при досмотре и вопрос, как накачать доску в отдалённом пункте, создают неопределённость.
  solution: Рюкзаки afarer для SUP разработаны под лимиты регистрируемого багажа авиакомпаний. Упаковывайтесь продуманно, возьмите ремкомплект и изучите места для накачки (марины, кемпинги с электричеством) до выезда.
  audience: Гребцы, планирующие путешествия с SUP по воздуху, на машине или в автодоме.
  steps:
    - Полностью спустите воздух и скатайте доску от носа к корме
    - Упакуйте скатанную доску, помпу, весло, лиш и плавник в рюкзак
    - Проверьте лимиты размеров и веса авиакомпании — большинство допускает 62 линейных дюйма и 50 фунтов
    - Приезжайте заранее и будьте готовы к ручному досмотру сумки
    - Возьмите ремкомплект в ручную кладь на случай повреждения доски при перевозке
    - Изучите варианты накачки — розетки в кемпингах для электрических помп, воздушные станции в маринах
  faq:
    - q: Примут ли авиакомпании мой рюкзак с SUP как багаж
      a: Большинство авиакомпаний США и Европы принимают рюкзаки с SUP как стандартный регистрируемый багаж до 50 фунтов и 62 линейных дюймов. Бюджетные авиакомпании могут брать сбор за негабарит.
    - q: Можно ли взять SUP в салон
      a: Нет. Рюкзаки с SUP превышают габариты ручной клади во всех авиакомпаниях. Всегда сдавайте рюкзак в багаж.
    - q: Как накачать SUP в отдалённом пункте
      a: Комплектная ручная помпа работает везде без электричества. Для удобства возьмите портативную электрическую помпу и ищите кемпинги с розетками или марины с воздушными станциями.

- id: sup-choppy-water
  question: 'Hogyan evezzek SUP-pal hullámos vízen vagy szélben?'
  answer: 'Hullámverésben: hajlitsa a térdét, vegyen fel szélesebb állást, rövidítse az evezési ütéseket, és aktiválja a törzsizmait az egyensúlyért. Szembeszélben: használjon alacsonyabb evezési szöget, végezzen rövidebb ütéseket, és dőljön előre. Oldalszélben: a szél felőli oldalon evezzen a sodródás korrigálásához. Követő szélben: szörfölje a hullámokat a sebességért. A kezdők kerüljék a 10 mph-t meghaladó szeleket, és a stabilitás érdekében válasszanak szélesebb, hosszabb táblákat. Az afarer Ocean Voyager túra SUP-ot úgy tervezték, hogy kezelje a mérsékelt hullámverést és szélviszonyokat.'
  category: safety

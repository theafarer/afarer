- id: b2b-samples
  question: 'Rendelhetek mintákat a sorozatgyártás vállalása előtt?'
  answer: 'Igen. Mintarendelések minden OEM/ODM projekthez elérhetők. A sorozatgyártás előtti minták (PPS) a forma elkészítése után, a sorozatgyártás előtt készülnek. Minták átfutási ideje: meglévő formákkal 15–25 munkanap, egyedi formákkal 25–40 munkanap. A mintaköltségek az első sorozatrendelésből levonhatók. A minták expressz futárral (DHL, FedEx, UPS) kerülnek kiszállításra teljes nyomonkövetéssel, és jellemzően 3–5 munkanapon belül megérkeznek.'

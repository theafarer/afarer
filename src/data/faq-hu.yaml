- id: b2b-ip-protection
  question: 'Hogyan védi az afarer a szellemi tulajdonomat és a terveimet?'
  answer: 'Az IP-védelem az OEM szolgáltatásunk alapvető része. Minden tervezési megbeszélés előtt NDA-t írunk alá. A tervfájlok izolált munkaállomásokon, hozzáférés-naplózással kerülnek kezelésre. Minden szerszám és forma kizárólagos tulajdona marad (az Ön által fizetve). Nem használjuk újra az Ön formáit vagy terveit más ügyfelek számára. Aktív fiókok számára a formák tárolása és karbantartása biztosított. A megállapodás megszűnésekor a formák vagy az Ön részére kerülnek kiszállításra, vagy videós dokumentációval együtt megsemmisítésre. Tiszteletben tartunk minden védjegy- és szabadalmi jogot.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Milyen szállítási és logisztikai lehetőségek érhetők el?'
  answer: 'FOB Qingdao (standard): az áru a Qingdao kikötőben kerül rakodásra; onnantól Ön szervezi a szállítást. CIF (megnevezett kikötő): mi szervezzük és biztosítjuk a szállítást az Ön célkikötőjéig. DDP / háztól házig: teljes körű logisztika, beleértve a vámkezelést és a végső kézbesítést. Tengeri szállítás az USA nyugati partjára: körülbelül 25–30 nap. Tengeri szállítás az EU-ba (Hamburg/Rotterdam): körülbelül 30–35 nap. Sürgős rendelésekhez légi szállítás érhető el (3–5 nap). Minden exportvám-dokumentációt, eredetigazolást és csomagolási listát kezelünk.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Milyen minőségellenőrzési folyamatok vonatkoznak az OEM rendelésekre?'
  answer: 'Minden OEM rendelés dokumentált QC tervet követ: 1) Beérkező anyagvizsgálat — a PVC anyag tételvizsgálata vastagság, húzószilárdság és UV-állóság szempontjából. 2) Folyamat közbeni QC — varrat hegesztési szilárdság tesztelése 50 táblánként, nyomástartási teszt a névleges PSI 1,25-szörösén. 3) Végvizsgálat — minden tábla 100%-os látványvizsgálata és nyomásvizsgálata. 4) AQL mintavétel — ISO 2859 szerinti tételenkénti mintavétel kritikus hiba = 0 elfogadással. 5) Harmadik fél általi vizsgálat — SGS, Bureau Veritas vagy Intertek a vevő költségén elérhető.'
  category: b2b

  relatedGuides: []
- id: b2b-moq
  question: 'Mekkora a minimális rendelési mennyiség OEM/ODM SUP gyártáshoz?'
  answer: 'A minimális rendelési mennyiségek (MOQ) terméktípusonként változnak. Raktári modell egyedi márkaépítése: 50 darab SKU-ként. Egyedi formájú formafejlesztés: 200–500 darab modellenként (első rendelés). Formamegosztási programok 50 darabtól elérhetők. Kiegészítők és mentőmellények: 500–1000 darab dizájnonként. Vegye fel a kapcsolatot OEM csapatunkkal a tervezett mennyiséggel a pontos MOQ és árazás érdekében.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Mekkorák a jellemző átfutási idők OEM SUP rendeléseknél?'
  answer: 'Első OEM rendelések meglévő formákon történő egyedi márkaépítéssel: 6–8 hét az előlegtől a FOB Qingdao-ig. Új formákat igénylő egyedi formájú rendelések: 12–20 hét (tartalmazza a 3D tervezést, a forma elkészítését, a prototípusgyártást és a sorozatgyártást). Jóváhagyott specifikációkkal történő ismételt rendelések: 6–8 hét. Sürgős rendelések meglévő formákkal 4–5 hétre rövidíthetők. Az átfutási idők tartalmazzák a nyersanyag-beszerzést, a gyártást, a folyamat közbeni QC-t és a konténer rakodását.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Milyen tanúsítványokkal rendelkeznek az afarer OEM termékek?'
  answer: 'Minden afarer OEM/ODM termék rendelkezik a következőkkel: CE megfelelőségi nyilatkozat (EU piac), UKCA (UK piac), ISO 9001:2015 minőségirányítási rendszer, BSCI társadalmi megfelelőségi audit, REACH és RoHS anyagmegfelelés, EN ISO 25649 osztályozás felfújható SUP táblákhoz. Kérésre elérhető további tanúsítványok: US Coast Guard megfelelőségi dokumentáció, katonai szabványú tesztelés (MIL-STD-810) és a célország import tanúsítási támogatása.'

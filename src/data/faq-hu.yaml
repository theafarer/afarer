- id: sup-inflatable-durability
  question: 'Mennyi ideig tartanak a felfújható SUP táblák megfelelő gondozással?'
  answer: 'Megfelelő gondozással egy minőségi felfújható SUP tábla 5-10 évig tart rendszeres szabadidős használat mellett. A katonai minőségű, UV-álló bevonatú háromrétegű PVC — amelyet minden afarer táblában használnak — ellenáll a napsugárzás okozta károsodásnak, a sósvízi korróziónak és a kopásnak. A legfontosabb élettartam-tényezők: öblítés édesvízzel minden használat után, alapos szárítás tárolás előtt, közvetlen UV-fénytől való védelem használaton kívül, részben felfújt állapotban való tárolás hűvös, száraz helyen, valamint a durva felületeken való vonszolás kerülése. A drop-stitch szálak és a varratok jellemzően az első meghibásodási pontok, nem maga a PVC anyag.'

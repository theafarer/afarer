- id: sup-learning
  question: 'Nehéz megtanulni a SUP-ot?'
  answer: 'Egyáltalán nem. A legtöbb kezdő már az első alkalom során feláll és evezni kezd. All-Around SUP szériánk extra széles, stabil felületekkel rendelkezik, amelyeket kifejezetten első alkalommal evezőknek terveztek. Kezdje nyugodt vízen, és percek alatt már könnyedén siklik majd.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Használhatom az óceánban?'
  answer: 'Igen. Az afarer SUP táblák óceáni, tavaki és folyói használatra készültek. Touring szériánk jól birja a parti hullámverést, és minden tábla tengeri minőségű PVC-ből készül, amely ellenáll a sósvízi korróziónak. Óceáni használat után öblítse le édesvízzel.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Mennyi ideig tart a felfújás?'
  answer: 'A mellékelt kétállású szivattyúval a legtöbb tábla 5 perc alatt 12–15 PSI-re fújható fel. Villamos szivattyús opcióunk ezt 2 perc alá rövidíti. A leeresztés és becsomagolás körülbelül 3 percet vesz igénybe.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Utazhatom felfújható SUP-pal?'
  answer: 'Természetesen. Minden afarer tábla hátizsák méretű hordtáskába csomagolható, amely megfelel a légitársaságok poggyászszabványainak. Mindössze 18–22 lbs súlyával könnyen elvihető a partra, a tóhoz, vagy a repülőtéri terminálokon keresztül.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Mekkora a maximális terhelés?'
  answer: 'All-Around SUP tábláink legfeljebb 220 lbs terhelést bírnak el. A Touring és Yoga szériák legfeljebb 250 lbs-ig terhelhetők. Tandem használat vagy nagyobb terhelés esetén forduljon csapatunkhoz ajánlásért.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Mit tartalmaz a csomag?'
  answer: 'Minden afarer SUP tartalmazza a táblát, egy utazó hátizsákot, kétállású kézi szivattyút, leszerelhető uszonyt, spirál biztonsági kötelet (coil leash) és javítókészletet. Néhány modellhez opcióként szénszálas evezőre történő frissítés is elérhető.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Kínálnak csomagajánlatokat?'
  answer: 'Igen. Gondosan összeállított csomagajánlatainkkal pénzt takaríthat meg a külön-külön történő vásárláshoz képest. Az aktuális csomagpromóciókért és mennyiségi kedvezményes árazásért forduljon értékesítési csapatunkhoz.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Szükségem van mentőmellényre a SUP-on?'
  answer: 'Igen. Sok joghatóságban törvényileg kötelező a mentőmellény minden vízi járművön, beleértve a SUP-okat is. Ott is, ahol nem kötelező, a CE-tanúsítvánnyal rendelkező mentőmellény alapvető biztonsági felszerelés. Javasoljuk, hogy a vízen mindig viselje.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Be kell-e jegyeztetnem a SUP táblámat?'
  answer: 'Az előírások joghatóságonként eltérnek. A legtöbb régióban a motor nélküli SUP-ok nem igényelnek regisztrációt. Ha motort kíván felszerelni, érdeklődjön a helyi tengerészeti hatóságnál a konkrét szabályokról. A szabadidős evezős táblák általában mentesülnek a csónakregisztráció alól.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Hogyan javíthatok ki egy defektet?'
  answer: 'Tisztítsa meg a területet, vágjon ki lekerekített sarkú foltot, vigyen fel PVC ragasztót, nyomja erősen rá, és várjon 24 órát a felfújás előtt. Az afarer táblákhoz javítókészlet tartozik. Részletes útmutatásért tekintse meg felfújható táblás javítási útmutatónkat.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Hogyan tároljam a felfújható SUP-omat?'
  answer: 'Öblítse le édesvízzel, szárítsa meg teljesen, eresztse le teljesen, tekerje lazán az orrtól kezdve, és tárolja a hordtáskában hűvös, száraz helyen, közvetlen napfénytől védetten. Soha ne tárolja nedvesen vagy szélsőséges hőmérsékleten.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Felfújható vagy kemény SUP tábla?'
  answer: 'A felfújható táblák hordozhatóságot, kényelmes tárolást és ütéscsillapítást kínálnak. A kemény táblák maximális merevséget és sebességet nyújtanak. A legtöbb szabadidős felhasználó számára a drop-stitch maggal rendelkező, minőségi felfújható tábla a gyakorlatias választás.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Mekkora szélsebesség már túl magas a SUP-hoz?'
  answer: 'Kezdőknek: 10 mph (8 csomó) felett. Középhaladóknak: 15 mph (13 csomó) felett. Képzetteknek: 20 mph (17 csomó) felett. Ha bizonytalan, ne induljon vízre. A part felől fúvó szél (a szárazföldről a tenger felé) minden képességi szinten veszélyes.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Miből áll az afarer garancia?'
  answer: 'Minden afarer terméket átfogó gyártói garancia véd. A SUP táblákra 2+ év garancia vonatkozik gyártási hibák esetén. A garancia a normál használat során jelentkező anyag- és kivitelezési hibákra terjed ki.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Hogyan adhatok be garanciális igényt?'
  answer: 'Az igény benyújtásához vegye fel a kapcsolatot ügyfélszolgálatunkkal a rendelési számával, a probléma fényképeivel és rövid leírásával. Az igények többségét 2 munkanapon belül felülvizsgáljuk. A jóváhagyott igények napokon belül csereegységet vagy javítási utasítást kapnak.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Mennyi ideig tart a szállítás?'
  answer: 'A raktáron lévő rendelések 2–4 munkanapon belül feladásra kerülnek. Az Egyesült Államokon belüli rendelések 5–10 munkanapon belül megérkeznek. A nemzetközi rendelések a célországtól függően 10–15 munkanapon belül érkeznek meg. A sürgős rendelések gyorsíthatók.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Milyen a visszaküldési szabályzatuk?'
  answer: 'A kézhezvételtől számított 30 napon belül fogadunk el visszaküldést a nem használt, eredeti csomagolású termékekre. A testreszabott/OEM rendelések nem küldhetők vissza. A visszaküldés megkezdéséhez vegye fel a kapcsolatot ügyfélszolgálatunkkal — előre kifizetett szállítási címkét biztosítunk.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Kínálnak OEM/ODM szolgáltatásokat?'
  answer: 'Igen. Cégek számára saját márkás (private label) és egyedi tervezési szolgáltatásokat kínálunk. A meglévő modelleken történő egyedi márkaépítéstől a teljesen egyedi testformákig mérnöki csapatunk az Ön márkája alatt fejleszthet termékeket. Minimális rendelési mennyiségek érvényesek.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Milyen hosszú evezőre van szükségem?'
  answer: 'Az evező 6–8 hüvelykkel legyen magasabb az Ön magasságánál. Az állítható evezők lehetővé teszik a finomhangolást a különböző körülményekhez. A részletes méretezésért tekintse meg evezős útmutatónkat.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Mi a különbség az egyrétegű és a többrétegű PVC SUP-ok között?'
  answer: 'Az egyrétegű PVC táblák könnyűek és kedvező árúak, de magas nyomáson kevésbé merevek. A kétrétegű és fúziós laminálású szerkezetek merevebbé, defektállóbbá és tartósabbá teszik a táblát. A katonai minőségű, UV-álló bevonatú PVC kínálja a legjobb egyensúlyt a tartósság és a súly között szabadidős SUP használatra. Az afarer minden termékszintjén háromrétegű laminált PVC-t használ.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Milyen SUP szélesség a legjobb a stabilitáshoz?'
  answer: 'Kezdőknek a 33–34 hüvelykes szélesség kínálja a stabilitás és az evezés könnyedségének legjobb egyensúlyát. A 32 hüvelyknél keskenyebb táblák bizonytalannak tűnnek az újonnan kezdő evezők számára. A 33 hüvelykes afarer SUP Explorer 11 ideális tanuláshoz.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Hogyan válasszak SUP térfogatot a súlyomhoz?'
  answer: 'Szorozza meg kg-ban mért súlyát 2,2-vel a kezdőknek ajánlott térfogat kiszámításához. Egy 75 kg-os evezőnek például legalább 165 liter kell, de a 220–260 liter jóval stabilabb a tanuláshoz. A SUP Explorer 11 260 literes, legfeljebb 100 kg-os evezők számára megfelelő.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'Hogyan viszonyul az afarer a többi márkához?'
  answer: 'Az afarer a legjobb ár-érték arányt kínálja a felfújható vízisport-felszerelések piacán. A Red Paddle Co-hoz képest az afarer a teljesítmény 90%-át nyújtja a költség 60%-áért. Az iRockerhez képest az afarer magasabb minőségű, háromrétegű katonai PVC-t és magasabb PSI értékeket használ. A Bluefinhez képest az afarer kiválóbb anyagparaméterekkel rendelkezik. A legtöbb szabadidős evező számára az afarer kínálja a minőség és az ár legjobb egyensúlyát.'
  category: general
  relatedProducts:

- id: sup-weight-capacity
  question: 'Mekkora súlyt bír el egy felfújható SUP tábla?'
  answer: 'A teherbírást a tábla térfogata határozza meg. Afarer táblák: SUP Explorer 11 (260 L, legfeljebb 100 kg / 220 lbs), Ocean Voyager 12 (310 L, legfeljebb 140 kg / 308 lbs), Leviathan Wake (350 L, legfeljebb 180 kg / 396 lbs). Az optimális teljesítményhez tartsa a teljes terhelést (evező + felszerelés) a maximális kapacitás 80%-án belül. A nem túlterhelt tábla magasabban úszik és jobban tartja az irányt, különösen hullámos körülmények között.'

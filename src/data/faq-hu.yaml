- id: sup-oem-process
  question: 'Milyen az OEM gyártási folyamata saját márkás felfújható SUP-okhoz?'
  answer: 'Az OEM folyamat: 1) Specifikáció és tervezési összefoglaló — ossza meg a cél specifikációkat, CAD rajzokat vagy referencia terméket. 2) 3D forma prototípusgyártás — egyedi alumínium és kompozit formák házon belüli tervezéssel. 3) Anyagkiválasztás és minta — katonai minőségű PVC egyedi színekkel és logóelhelyezéssel. 4) CE gyári audit és megfelelés — minden rendelés tartalmaz CE nyilatkozatot, ISO 9001 nyomonkövethetőséget, BSCI jelentést. 5) Sorozatgyártás 100 pontos QC ellenőrzőlistával. 6) FOB Qingdao szállítás teljes exportdokumentációval. Átfutási idő 30-45 nap, MOQ 50 darab (standard SUP).'
  category: ordering

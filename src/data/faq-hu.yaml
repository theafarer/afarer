- id: sup-sustainability
  question: 'Környezetbarátok-e a felfújható SUP táblák?'
  answer: 'A felfújható SUP-ok több szempontból kisebb környezeti lábnyommal rendelkeznek, mint a merev táblák: kevesebb nyersanyagot használnak fel a gyártásban, kisebb súlyuk csökkenti a szállítási kibocsátást, és tartósságuk révén idővel kevesebb csere szükséges. Az afarer táblákban használt PVC ólommentes és REACH-megfelelő. A legfontosabb fenntarthatósági gyakorlatok: vásároljon minőségi táblát, amely 5-10 évig tart; a defekteket javítsa, ne cserélje; a tábla élettartama végén juttassa el különleges PVC-újrahasznosítási programokon keresztül; és az egyszer használatos csomagolás kerülésével válasszon olyan márkákat, amelyek újrafelhasználható hordtáskákat használnak.'
  category: general

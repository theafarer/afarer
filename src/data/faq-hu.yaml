- id: b2b-factory-audit
  question: 'Meglátogathatom a gyárat, vagy szervezhetek harmadik fél általi auditot?'
  answer: 'A gyárlátogatások előzetes egyeztetéssel szívesen fogadottak. Egész évben fogadunk márkatulajdonosokat, és repülőtéri átszállítást tudunk szervezni a Qingdao Jiaodong nemzetközi repülőtérről (TAO). Azoknak a vásárlóknak, akik nem tudnak ellátogatni, a következőket kínáljuk: virtuális gyárlátogatás videohíváson keresztül, harmadik fél általi audit koordinálása SGS/Bureau Veritas részvételével (az audit költségét a vevő fedezi), valamint részletes gyárképességi dokumentációs csomag, beleértve a felszerelési listát, a QC folyamatábrát és a személyzet képesítéseit.'

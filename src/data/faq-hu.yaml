- id: b2b-payment
  question: 'Milyen fizetési feltételek érhetők el OEM rendeléseknél?'
  answer: 'Standard fizetési feltételek: 30% előleg aláírt PI-vel (proforma számla), 70% egyenleg a szállítás előtt a B/L (konosszáment) másolata ellenében. Első alkalommal együttműködő partnereknek: 50% előleg, 50% a szállítás előtt. Rendeléstörténettel rendelkező, bevált partnereknek: látható L/C vagy 30 napos fizetés minősített számlák esetén (hitelvizsgálat tárgyától függően). Fizetési módszerek: T/T banki átutalás, L/C (okmányos hitellevél), Western Union. Minden fizetés USD-ben vagy EUR-ban történik.'

    - sup-maintenance
- id: storage
  question: 'Kā man glabāt savu piepūšamo SUP?'
  answer: 'Noskalojiet ar saldūdeni, pilnībā izžāvējiet, pilnībā izlaidiet gaisu, brīvi sarullējiet, sākot no deguna gala, un glabājiet pārvadāšanas somā vēsā, sausā vietā, kas pasargāta no tiešiem saules stariem. Nekad neglabājiet mitru vai ekstremālās temperatūrās.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Piepūšamais vai cietā SUP dēlis?'
  answer: 'Piepūšamie dēļi nodrošina vieglu pārvadāšanu, ērtu glabāšanu un triecienu absorbciju. Cietie dēļi piedāvā maksimālu stingumu un ātrumu. Lielākajai daļai izklaides lietotāju praktiska izvēle ir kvalitatīvs piepūšamais dēlis ar drop-stitch kodolu.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Kāds vēja ātrums ir pārāk augsts SUP?'
  answer: 'Iesācējiem: virs 10 mph (8 mezgliem). Vidēja līmeņa airētājiem: virs 15 mph (13 mezgliem). Pieredzējušiem: virs 20 mph (17 mezgliem). Ja šaubāties, nedodieties ūdenī. Vējš no krasta (pūš no zemes jūras virzienā) ir bīstams jebkurā prasmju līmenī.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Kāda ir afarer garantija?'
  answer: 'Visi afarer produkti ir nodrošināti ar visaptverošu ražotāja garantiju. SUP dēļi ir segti 2+ gadus pret ražošanas defektiem. Garantija aptver materiālu un izpildes defektus normālas lietošanas apstākļos.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Kā iesniegt garantijas prasījumu?'
  answer: 'Prasījumu iesniedziet, sazinoties ar mūsu atbalsta komandu un norādot pasūtījuma numuru, problēmas fotoattēlus un īsu aprakstu. Vairums prasījumu tiek izskatīti 2 darba dienu laikā. Apstiprinātajiem prasījumiem aizvietojums vai remonta norādījumi tiek sniegti dažu dienu laikā.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Cik ilgi notiek piegāde?'
  answer: 'Noliktavā pieejamie pasūtījumi tiek nosūtīti 2–4 darba dienu laikā. Pasūtījumi ASV iekšzemē ierodas 5–10 darba dienās. Starptautiskie pasūtījumi ierodas 10–15 darba dienās atkarībā no galamērķa. Steidzamiem pasūtījumiem ir pieejama paātrināta piegāde.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Kāda ir jūsu atgriešanas politika?'
  answer: 'Mēs pieņemam atgriešanu 30 dienu laikā pēc piegādes neizmantotiem produktiem oriģinālajā iepakojumā. Individualizētie (Custom) un OEM pasūtījumi nav atgriežami. Lai uzsāktu atgriešanu, sazinieties ar mūsu atbalsta komandu — mēs nodrošinām iepriekš apmaksātu piegādes etiķeti.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Vai jūs piedāvājat OEM/ODM pakalpojumus?'
  answer: 'Jā. Mēs piedāvājam privātā zīmola (private label) un individuāla dizaina pakalpojumus uzņēmumiem. Sācot no individuāla zīmoljumjuma esošajos modeļos līdz pilnībā pielāgotam korpusa dizainam, mūsu inženieru komanda var izstrādāt produktus jūsu zīmolam. Attiecas minimālie pasūtījuma apjomi.'
  category: ordering

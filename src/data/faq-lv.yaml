- id: sup-weight-capacity
  question: 'Cik lielu svaru var izturēt piepūšamais SUP dēlis?'
  answer: 'Svara ietilpība atšķiras atkarībā no dēļa tilpuma. afarer dēļi: SUP Explorer 11 (260L, līdz 100 kg / 220 lbs), Ocean Voyager 12 (310L, līdz 140 kg / 308 lbs), Leviathan Wake (350L, līdz 180 kg / 396 lbs). Optimālai veiktspējai turiet kopējo slodzi (braucējs + ekipējums) 80% robežās no maksimālās ietilpības. Nepārslogots dēlis turas augstāk un labāk tur virzienu, īpaši viļņainos apstākļos.'

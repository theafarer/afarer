- id: sup-learning
  question: 'Vai SUP ir grūti iemācīties?'
  answer: 'Nekādā gadījumā. Lielākā daļa iesācēju pieceļas kājās un sāk airēt jau savas pirmās nodarbības laikā. Mūsu All-Around SUP sērijā ir īpaši platas un stabilas platformas, kas izstrādātas tieši pirmajai reizei uz ūdens. Sāciet mierīgā ūdenī, un jau pēc dažām minūtēm jūs slīdēsiet pa to.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Vai to var izmantot okeānā?'
  answer: 'Jā. afarer SUP dēļi ir radīti lietošanai okeānā, ezeros un upēs. Mūsu Touring sērija labi tiek galā ar piekrastes viļņiem, un visi dēļi ir izgatavoti no PVC, kas paredzēts jūras videi un iztur sālsūdens koroziju. Pēc lietošanas okeānā noskalojiet tos ar saldūdeni.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Cik ilgs laiks nepieciešams uzpūšanai?'
  answer: 'Ar komplektā iekļauto divvirzienu sūkni vairums dēļu uzpūšas līdz 12–15 PSI mazāk nekā 5 minūtēs. Mūsu elektriskā sūkņa opcija saīsina to līdz mazāk nekā 2 minūtēm. Gaisa izlaišana un iepakošana aizņem aptuveni 3 minūtes.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Vai varu ceļot ar piepūšamo SUP?'
  answer: 'Protams, varat. Katru afarer dēli var iepakot pārvadāšanas somā mugursomas izmērā, kas atbilst aviokompāniju bagāžas prasībām. Sverot tikai 18–22 lbs, to ir viegli aiznest uz pludmali, ezeru vai cauri lidostas termināļiem.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Kāds ir svara ierobežojums?'
  answer: 'Mūsu All-Around SUP iztur līdz 220 lbs svara. Touring un Yoga sērijas iztur līdz 250 lbs. Tandema lietošanai vai smagākai kravai sazinieties ar mūsu komandu, lai saņemtu ieteikumus.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Kas ir iekļauts komplektā?'
  answer: 'Katrs afarer SUP ietver dēli, ceļojumu mugursomu, divvirzienu roku sūkni, noņemamu spuru, aptinamo drošības siksnu (leash) un remonta komplektu. Dažiem modeļiem ir pieejama arī oglekļa šķiedras aira uzlabojuma opcija.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Vai jūs piedāvājat komplektu piedāvājumus?'
  answer: 'Jā. Mēs piedāvājam rūpīgi izveidotus komplektus, kas ietaupa jūsu naudu, salīdzinot ar atsevišķu preču iegādi. Sazinieties ar mūsu pārdošanas komandu, lai uzzinātu par pašreizējām komplektu akcijām un apjoma atlaides cenām.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Vai man uz SUP ir nepieciešama glābšanas vestes?'
  answer: 'Jā. Daudzās jurisdikcijās glābšanas vestes uz jebkura ūdens transportlīdzekļa, tostarp SUP, ir juridiski obligāta. Pat tur, kur tā nav obligāta, CE sertificēta glābšanas vestes ir būtisks drošības aprīkojums. Iesakām to valkāt visu laiku, kamēr atrodaties uz ūdens.'
  category: safety

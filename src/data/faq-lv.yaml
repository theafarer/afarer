- id: sup-inflate-pressure
  question: 'Līdz cik PSI man jāuzpūš savs SUP?'
  answer: 'Labākai veiktspējai uzpūtiet dēli līdz tā norādītajam maksimālajam PSI — parasti 15–18 PSI kvalitatīviem piepūšamajiem SUP. afarer SUP Explorer 11 vislabāk darbojas pie 15–18 PSI. Nepietiekama uzpūšana padara dēli mīkstu un slikti vadāmu. Pārmērīga uzpūšana virs norādītā maksimuma var sabojāt drop-stitch diegus. Konkrēto vērtību pārbaudiet uzlīmē pie vārsta.'

- id: b2b-certification
  question: 'Kādi sertifikāti ir afarer OEM produktiem?'
  answer: 'Visiem afarer OEM/ODM produktiem ir: CE atbilstības deklarācija (ES tirgum), UKCA (Lielbritānijas tirgum), ISO 9001:2015 kvalitātes vadības sistēma, BSCI sociālās atbilstības audits, REACH un RoHS materiālu atbilstība, EN ISO 25649 klasifikācija piepūšamajiem SUP dēļiem. Papildu sertifikāti pieejami pēc pieprasījuma: ASV krasta apsardzes (US Coast Guard) atbilstības dokumentācija, militārā standarta testēšana (MIL-STD-810) un galamērķa valsts importa sertifikācijas atbalsts.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Vai varu pasūtīt paraugus, pirms apņemos sērijveida ražošanu?'
  answer: 'Jā. Paraugu pasūtījumi ir pieejami visiem OEM/ODM projektiem. Pirmsražošanas paraugi (PPS) tiek izgatavoti pēc veidņu izgatavošanas un pirms sērijveida ražošanas. Paraugu izpildes laiks: 15–25 darba dienas esošajām veidnēm, 25–40 darba dienas pielāgotajām veidnēm. Paraugu izmaksas tiek ieskaitītas pirmajā sērijveida pasūtījumā. Paraugi tiek nosūtīti ar ekspresa pārvadātāju (DHL, FedEx, UPS) ar pilnu izsekošanu un parasti ierodas 3–5 darba dienu laikā.'

- id: sup-skill-progression
  question: 'Kāda ir tipiskā SUP prasmju attīstība no iesācēja līdz pieredzējušam?'
  answer: 'Iesācējs (1.-3. nodarbība): pieceļanās kājās, pamata airējums uz priekšu, griešanās, droša iekrišana. Vidējs līmenis (5.-15. nodarbība): efektīva airēšanas tehnika, pivot pagriezieni, pārvietošanās viļņos, pamata glābšanas iemaņas. Pieredzējis (20+ nodarbības): sacensību starti, boju pagriezieni, sērfošana mazos viļņos, airēšana ar vēju (downwind). Profesionālis: sacensību airēšana, sērfa SUP, tālsatiecību tūrisms. afarer dēļi atbalsta katru posmu: Explorer 11 iesācējiem, Ocean Voyager tūrismam un Cheetah Surge veiktspējas airēšanai.'
  category: general

  question: 'Vai SUP tiešām vajag drošības siksnu (leash)?'
  answer: 'Jā — vienmēr valkājiet drošības siksnu (leash). Aptinamā SUP leash siksna piestiprinās pie potītes vai ikra un notur dēli pie jums, ja iekrītat ūdenī. Atklātā ūdenī leash var izglābt dzīvību, neļaujot attālināties no peldošā līdzekļa. Airējot upēs, izmantojiet ātri atbrīvojamu leash, lai izvairītos no iesprostošanās.'

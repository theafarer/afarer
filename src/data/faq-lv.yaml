- id: sup-volume-weight
  question: 'Kā izvēlēties SUP tilpumu atbilstoši manam svaram?'
  answer: 'Reiziniet savu svaru kilogramos ar 2.2, lai iegūtu iesācējam draudzīgu tilpuma mērķi. Piemēram, 75 kg smagam airētājam vajag vismaz 165 litrus, taču 220–260 litri mācībām ir daudz stabilāki. SUP Explorer 11 piedāvā 260 litrus un ir piemērots braucējiem līdz 100 kg.'
  category: product

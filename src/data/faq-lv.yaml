- id: sup-yoga
  question: 'Vai uz SUP dēļa var nodarboties ar jogu?'
  answer: 'Noteikti. SUP joga apvieno tradicionālās pozas ar peldošas platformas izaicinājumu, iesaistot dziļākos stabilizējošos muskuļus. Izmantojiet dēli, kas ir vismaz 33 collas plats, ar mīkstu, neslīdošu klāja paklājiņu. Vingrojiet mierīgā, seklā ūdenī ar enkuru. Sāciet ar pamata pozām, piemēram, lejupvērstā suņa pozu, Karotāja II pozu un Koka pozu. SUP Explorer 11 ar pilnu EVA klāja paklājiņu tam labi piemērots.'
  category: general
  relatedProducts:

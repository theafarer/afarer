- id: sup-choppy-water
  question: 'Kā airēt SUP viļņainā ūdenī vai vējā?'
  answer: 'Viļņos: salieciet ceļus, ieņemiet platāku stāju, saīsiniet airējumu un izmantojiet ķermeņa kodolu līdzsvara noturēšanai. Pretvējā: izmantojiet zemāku aira leņķi, veiciet īsākus airējumus un noliecieties uz priekšu. Sānvējā: airējiet no vēja pusē, lai koriģētu dreifu. Sekojošā vējā: sērfojiet uz viļņiem, lai iegūtu ātrumu. Iesācējiem jāizvairās no vēja, kas pārsniedz 10 mph, un stabilitātei jāizvēlas platāki, garāki dēļi. afarer Ocean Voyager tūrisma SUP ir izstrādāts, lai tiktu galā ar mēreniem viļņiem un vēja apstākļiem.'

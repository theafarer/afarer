- id: drop-stitch-technology
  question: 'Kas ir drop-stitch kodola tehnoloģija un kāpēc tā ir svarīga?'
  answer: 'Drop-stitch kodola tehnoloģija izmanto tūkstošiem poliestera diegu, kas savieno PVC dēļa augšējo un apakšējo kārtu. Uzpūstam līdz 15-20 PSI, šie diegi veido stingru, pret vērpi izturīgu struktūru, kas darbojas kā cietās čaulas dēlis. afarer visos SUP produktu līmeņos izmanto militārās kvalitātes trīsslāņu PVC ar drop-stitch lamināciju, nodrošinot stingumu, kas salīdzināms ar epoksīda dēļiem, saglabājot piepūšamā dēļa pārvadājamību.'

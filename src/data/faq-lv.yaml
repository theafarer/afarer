- id: paddle-length
  question: 'Kāds aira garums man ir nepieciešams?'
  answer: 'Airim jābūt par 6–8 collām garākam par jūsu augumu. Regulējamie airi ļauj precīzi pielāgot atšķirīgiem apstākļiem. Detalizētu izmēru izvēli skatiet mūsu airu ceļvedī.'
  category: product

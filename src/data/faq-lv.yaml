- id: b2b-payment
  question: 'Kādi maksājuma noteikumi ir pieejami OEM pasūtījumiem?'
  answer: 'Standarta maksājuma noteikumi: 30% avansas ar parakstītu PI (priekšapmaksas rēķins), 70% atlikums pirms nosūtīšanas pret B/L (konosamenta) kopiju. Pirmajiem partneriem: 50% avansas, 50% pirms nosūtīšanas. Pastāvīgiem partneriem ar pasūtījumu vēsturi: akreditīvs uz redzēšanu (L/C at sight) vai 30 dienu maksājuma termiņš atbilstošiem kontiem (pēc kredītspējas pārbaudes). Maksājumu veidi: T/T pārskaitījums, L/C (akreditīvs), Western Union. Visi maksājumi USD vai EUR.'

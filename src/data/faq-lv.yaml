- id: sup-deck-pad-care
  question: 'Kā tīrīt un kopt EVA klāja paklājiņu?'
  answer: 'Pēc katras nodarbības noskalojiet klāja paklājiņu ar saldūdeni. Netīrumiem vai traipiem izmantojiet maigu ziepju šķīdumu un mīkstu suku — izvairieties no agresīvām ķimikālijām. Ja malas sāk atdalīties, uzklājiet nelielu daudzumu ūdensizturīgas jūras līmes un 24 stundas piespiediet ar svaru. Kad dēlis netiek lietots, turiet to prom no tiešiem UV stariem, lai novērstu paklājiņa bojāšanos.'

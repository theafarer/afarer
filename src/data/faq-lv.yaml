- id: airline-travel-sup
  question: 'Kādi ir aviokompāniju noteikumi ceļošanai ar piepūšamo SUP?'
  answer: 'Lielākā daļa aviokompāniju pieņem SUP mugursomas kā reģistrēto bagāžu, ja tās sver mazāk par 23–32 kg. afarer mugursoma ir aptuveni 90x40x30 cm liela un iepakota sver apmēram 15 kg. Dažas aviokompānijas var piemērot maksu par pārlieku lielu bagāžu. Ierodieties agrāk, ietiniet spuras un sūkni atsevišķi roku bagāžā un atzīmējiet somu kā trauslu. Vienmēr pirms lidojuma izpētiet savas aviokompānijas sporta inventāra politiku.'
  category: general
  relatedProducts:

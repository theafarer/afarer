  relatedGuides: []
- id: b2b-quality-control
  question: 'Kādi kvalitātes kontroles procesi attiecas uz OEM pasūtījumiem?'
  answer: 'Katrs OEM pasūtījums tiek īstenots saskaņā ar dokumentētu kvalitātes kontroles plānu: 1) Ienākošo materiālu pārbaude — PVC auduma partiju testēšana uz biezumu, izturību pret stiepi un UV izturību. 2) Kvalitātes kontrole procesā — šuvju metinājuma stipruma testēšana ik pēc 50 vienībām, spiediena noturēšanas tests pie 1.25x nominālā PSI. 3) Noslēguma pārbaude — 100% vizuālā pārbaude un spiediena testēšana katram dēlim. 4) AQL izlase — partijas izlase saskaņā ar ISO 2859 ar kritiskā defekta = 0 pieņemšanu. 5) Trešās puses pārbaude — SGS, Bureau Veritas vai Intertek pieejami par pircēja izmaksām.'
  category: b2b

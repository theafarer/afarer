  question: 'Vai pēc lietošanas okeānā man jānoskalo piepūšamo dēli?'
  answer: 'Jā — pēc lietošanas sālsūdenī vienmēr noskalojiet dēli, spuras, sūkni un airi ar saldūdeni. Sāls kristāli iekļūst šuvēs un vārstos, izraisot mikronoplūdes un koroziju. Pirms gaisa izlaišanas un glabāšanas izžāvējiet dēli ēnā. Regulāra skalošana ievērojami pagarina piepūšamā dēļa kalpošanas laiku.'

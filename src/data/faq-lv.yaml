- id: sup-inflatable-durability
  question: 'Cik ilgi kalpo piepūšamie SUP dēļi ar pienācīgu kopšanu?'
  answer: 'Ar pienācīgu kopšanu kvalitatīvs piepūšamais SUP dēlis regulārā izklaides lietošanā kalpo 5-10 gadus. Militārās kvalitātes trīsslāņu PVC ar UV izturīgu pārklājumu — kāds izmantots visos afarer dēļos — iztur saules bojājumus, sālsūdens koroziju un berzi. Galvenie ilgmūžības faktori: pēc katras lietošanas noskalojiet ar saldūdeni, pirms glabāšanas rūpīgi izžāvējiet, kad netiek lietots, turiet prom no tiešiem UV stariem, glabājiet daļēji uzpūstu vēsā, sausā vietā un izvairieties to vilkt pa raupjām virsmām. Drop-stitch diegi un šuves parasti bojājas pirmie, nevis pats PVC audums.'

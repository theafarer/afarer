- id: cold-weather-safety
  question: 'Kādu drošības aprīkojumu man vajag airēšanai aukstā ūdenī?'
  answer: 'Ūdens zem 15°C pieprasa termisko aizsardzību. Temperatūrā 8–14°C izmantojiet hidrotērpu vai sauso tērpu ar zābakiem, cimdiem un kapuci. Temperatūrā 14–20°C pietiek ar 3/2mm hidrotērpu. Vienmēr valkājiet pareizi pielāgotu glābšanas vestes (PFD) termiskai aizsardzībai un drošībai. Pārbaudiet vietējos noteikumus par obligātā aprīkojuma prasībām.'
  category: product
  relatedProducts:

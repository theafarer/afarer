- id: sup-sustainability
  question: 'Vai piepūšamie SUP dēļi ir videi ilgtspējīgi?'
  answer: 'Piepūšamajiem SUP ir mazāks vides pēdas nospiedums nekā cietajiem dēļiem vairākos veidos: ražošanā tie izmanto mazāk izejvielu, to mazākais svars samazina piegādes izmešus, un to izturība nozīmē retāku aizvietošanu laika gaitā. PVC, kas izmantots afarer dēļos, ir bez svina un atbilst REACH prasībām. Galvenās ilgtspējas prakses: pērciet kvalitatīvu dēli, kas kalpo 5-10 gadus, labojiet caurumus, nevis aizstājiet tos, dēļa lietošanas beigās nododiet to pārstrādei caur specializētām PVC pārstrādes programmām un izvairieties no vienreizējās lietošanas iepakojuma, izvēloties zīmolus, kas izmanto atkārtoti lietojamas somas.'

- id: b2b-moq
  question: 'Kāds ir minimālais pasūtījuma apjoms OEM/ODM SUP ražošanai?'
  answer: 'Minimālie pasūtījuma apjomi (MOQ) atšķiras atkarībā no produkta veida. Individuāls zīmoljumjums noliktavas modeļiem: 50 vienības uz SKU. Pielāgotas formas veidnes izstrāde: 200–500 vienības uz modeli (pirmais pasūtījums). Veidņu koplietošanas programmas pieejamas no 50 vienībām. Aksesuāri un glābšanas vestes (PFD): 500–1000 vienības uz dizainu. Sazinieties ar mūsu OEM komandu un norādiet plānoto apjomu, lai saņemtu precīzu MOQ un cenas.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Kādi ir tipiskie izpildes termiņi OEM SUP pasūtījumiem?'
  answer: 'Pirmajiem OEM pasūtījumiem ar individuālu zīmoljumjumu esošajās veidnēs: 6–8 nedēļas no avansa līdz FOB Qingdao. Pielāgotas formas pasūtījumiem, kas prasa jaunas veidnes: 12–20 nedēļas (ietver 3D dizainu, veidņu izgatavošanu, prototipēšanu un sērijveida ražošanu). Atkārtotiem pasūtījumiem ar apstiprinātām specifikācijām: 6–8 nedēļas. Steidzami pasūtījumi ar esošajām veidnēm var tikt paātrināti līdz 4–5 nedēļām. Izpildes termiņi ietver izejvielu iepirkumu, ražošanu, kvalitātes kontropli ražošanas procesā un konteineru iekraušanu.'

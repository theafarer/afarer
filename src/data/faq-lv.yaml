- id: b2b-factory-audit
  question: 'Vai varu apmeklēt rūpnīcu vai organizēt trešās puses auditu?'
  answer: 'Rūpnīcas apmeklējumi pēc iepriekšējas vienošanās ir laipni gaidīti. Mēs visa gada garumā uzņemam zīmolu īpašniekus un varam organizēt sagaidīšanu Qingdao Jiaodong starptautiskajā lidostā (TAO). Pircējiem, kuri nevar ierasties, mēs piedāvājam: virtuālu rūpnīcas apskati video zvana laikā, trešās puses audita koordināciju ar SGS/Bureau Veritas (audita izmaksas sedz pircējs) un detalizētu rūpnīcas iespēju dokumentācijas paketi, tostarp aprīkojuma sarakstu, kvalitātes kontroles procesa plūsmu un personāla kvalifikāciju.'

- id: fishing-sup-setup
  question: 'Vai no SUP dēļa var makšķerēt?'
  answer: 'Jā. Makšķerēšana no SUP kļūst arvien populārāka, jo stāvā pozīcija sniedz lielisku redzamību ūdenī. Stabilitātei izvēlieties dēli, kas ir vismaz 11 pēdas garš un 33–34 collas plats. Pievienojiet piena kasti ar makšķeru turētājiem, kas piestiprināta pie klāja elastīgajām siksnām, nelielu enkuru un vienmēr valkājiet glābšanas vestes (PFD). afarer SUP Explorer 11 labi der izklaides makšķerēšanai.'

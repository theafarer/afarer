  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Vai jūs varat izveidot pielāgotu iepakojumu manam zīmolam?'
  answer: 'Jā. Mēs piedāvājam pilnus individuāla iepakojuma pakalpojumus: mazumtirdzniecības kastes ar pilnkrāsu CMYK druku un zīmola grafiku, pārvadāšanas somas ar serigrafētiem vai izšūtiem logotipiem, lietošanas pamācības jūsu valodā, piekāršanas etiķetes un svītrkoda/UPC etiķetes, kā arī iekšējo iepakojumu (polietilēna maisiņi, putu ieliktņi). Minimālais iepakojuma MOQ: 500–1000 vienības pielāgotajām kastēm, 200–500 pārvadāšanas somām. Iepakojuma dizaina pakalpojums ir iekļauts OEM pasūtījumos.'

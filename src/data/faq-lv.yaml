- id: sup-oem-process
  question: 'Kāds ir OEM ražošanas process piepūšamajiem SUP ar privāto zīmolu?'
  answer: 'OEM process: 1) Specifikācija un dizaina uzdevums — dalieties ar mērķa specifikācijām, CAD rasējumiem vai atsauces produktu. 2) 3D veidnes prototipēšana — pielāgotas alumīnija un kompozīta veidnes, kuras izstrādājam paši. 3) Materiālu izvēle un paraugs — militārās kvalitātes PVC ar pielāgotām krāsām un logotipa izvietojumu. 4) CE rūpnīcas audits un atbilstība — katrs pasūtījums ietver CE deklarāciju, ISO 9001 izsekojamību, BSCI ziņojumu. 5) Sērijveida ražošana ar 100 punktu kvalitātes kontroles sarakstu. 6) Piegāde FOB Qingdao ar pilnu eksporta dokumentāciju. Izpildes laiks 30-45 dienas, MOQ 50 vienības (standarta SUP).'
  category: ordering

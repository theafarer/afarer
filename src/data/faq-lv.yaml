- id: b2b-ip-protection
  question: 'Kā afarer aizsargā manu intelektuālo īpašumu un dizainus?'
  answer: 'Intelektuālā īpašuma aizsardzība ir būtiska mūsu OEM pakalpojuma sastāvdaļa. Mēs parakstām NDA (konfidencialitātes līgumu) pirms jebkādām dizaina diskusijām. Dizaina faili tiek apstrādāti izolētās darbstacijās ar piekļuves reģistrēšanu. Visi instrumenti un veidnes paliek jūsu ekskluzīvā īpašumā (apmaksāti no jūsu puses). Mēs neatkārtoti neizmantosim jūsu veidnes vai dizainus citiem klientiem. Veidņu glabāšana un apkope ir iekļauta aktīvajiem kontiem. Pēc līguma izbeigšanas veidnes vai nu tiek nosūtītas jums, vai iznīcinātas ar video dokumentāciju. Mēs respektējam visas preču zīmju un patentu tiesības.'
  category: b2b

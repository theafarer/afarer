  relatedGuides: []
- id: b2b-shipping
  question: 'Kādas piegādes un loģistikas iespējas ir pieejamas?'
  answer: 'FOB Qingdao (standarta): krava tiek iekrauta Qingdao ostā; pārvadājumu no turienes organizē jūs. CIF (norādītā osta): mēs organizējam un apdrošinām piegādi uz jūsu galamērķa ostu. DDP / no durvīm līdz durvīm: pilna servisa loģistika, tostarp muitas izkārtošana un noslēguma piegāde. Jūras kravu pārvadājumi uz ASV Rietumu krastu: aptuveni 25–30 dienas. Jūras kravu pārvadājumi uz ES (Hamburga/Roterdama): aptuveni 30–35 dienas. Gaisa pārvadājumi pieejami steidzamiem pasūtījumiem (3–5 dienas). Mēs sagatavojam visu eksporta muitas dokumentāciju, izcelsmes sertifikātus un iepakojuma sarakstus.'
  category: b2b

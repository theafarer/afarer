- id: boat-registration
  question: 'Vai man jāreģistrē savs SUP dēlis?'
  answer: 'Prasības atšķiras atkarībā no jurisdikcijas. Vairumā reģionu SUP bez dzinēja nav jāreģistrē. Ja plānojat pievienot motoru, pārbaudiet vietējās jūrniecības iestādes noteikumus. Izklaidēšanās paredzētie airu dēļi parasti ir atbrīvoti no laivu reģistrācijas.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Kā es varu salabot caurumu?'
  answer: 'Notīriet bojāto vietu, izgrieziet ielāpu noapaļotās malās, uzklājiet PVC līmi, stingri piespiediet un pirms uzpūšanas gaidiet 24 stundas. afarer dēļu komplektā ir iekļauts remonta komplekts. Detalizētus norādījumus skatiet mūsu piepūšamo dēļu remonta ceļvedī.'
  category: maintenance
  relatedProducts: []
  relatedGuides:

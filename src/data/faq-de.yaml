- id: sup-choppy-water
  question: 'Wie paddle ich ein SUP bei Kabbelwasser oder Wind?'
  answer: 'Bei Kabbelwasser: Beine beugen, breiteren Stand einnehmen, den Paddelschlag verkürzen und die Körperspannung fürs Gleichgewicht nutzen. Bei Gegenwind: das Paddel flacher führen, kürzere Schläge machen und sich leicht nach vorne beugen. Bei Seitenwind: auf der windzugewandten Seite paddeln, um die Abdrift auszugleichen. Bei Rückenwind: die Dünung für Tempo surfen. Anfänger sollten Wind über 10 mph meiden und für mehr Stabilität breitere, längere Boards wählen. Das afarer Ocean Voyager Touring-SUP ist für moderate Kabbelung und Windverhältnisse ausgelegt.'

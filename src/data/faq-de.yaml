- id: b2b-moq
  question: 'Welche Mindestbestellmenge gilt für die OEM/ODM-SUP-Produktion?'
  answer: 'Mindestbestellmengen (MOQ) variieren je nach Produkttyp. Markenindividualisierung von Lagermodellen: 50 Einheiten pro SKU. Entwicklung individueller Formen: 200–500 Einheiten pro Modell (Erstbestellung). Formen-Sharing-Programme ab 50 Einheiten verfügbar. Hypalon-Boot-Produktion: 20–50 Einheiten je nach Größe. Zubehör und Rettungswesten: 500–1000 Einheiten pro Design. Kontaktieren Sie unser OEM-Team mit Ihrem geplanten Volumen für präzise MOQs und Preise.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Welche Lieferzeiten sind bei OEM-SUP-Bestellungen üblich?'
  answer: 'Erstbestellungen mit Markenindividualisierung auf bestehenden Formen: 6–8 Wochen von der Anzahlung bis FOB Qingdao. Individuelle Bestellungen mit neuen Formen: 12–20 Wochen (inklusive 3D-Design, Formenbau, Prototyping und Serienproduktion). Folgebestellungen mit freigegebenen Spezifikationen: 6–8 Wochen. Eilbestellungen auf bestehenden Formen lassen sich auf 4–5 Wochen beschleunigen. Die Lieferzeiten umfassen die Materialbeschaffung, die Produktion, die Inline-QC und die Containerbeladung.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Welche Zertifizierungen tragen afarer OEM-Produkte?'
  answer: 'Alle afarer OEM/ODM-Produkte verfügen über: CE-Konformitätserklärung (EU-Markt), UKCA (UK-Markt), Qualitätsmanagementsystem nach ISO 9001:2015, BSCI-Audit zur sozialen Verantwortung, REACH- und RoHS-Materialkonformität, EN-ISO-25649-Klassifizierung für aufblasbare Boote. Weitere Zertifizierungen auf Anfrage: Konformitätsdokumentation der US Coast Guard, Tests nach Militärstandard (MIL-STD-810) und Unterstützung bei der Importzertifizierung des Ziellandes.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Kann ich vor der Serienproduktion Muster bestellen?'
  answer: 'Ja. Musterbestellungen sind für alle OEM/ODM-Projekte möglich. Vorserienmuster (PPS) werden nach dem Formenbau und vor der Serienproduktion gefertigt. Muster-Lieferzeit: 15–25 Werktage für bestehende Formen, 25–40 Werktage für individuelle Formen. Die Musterkosten werden mit der ersten Serienbestellung verrechnet. Muster werden per Expresskurier (DHL, FedEx, UPS) mit vollständiger Sendungsverfolgung verschickt und treffen in der Regel in 3–5 Werktagen ein.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'Welche Zahlungsbedingungen gelten für OEM-Bestellungen?'
  answer: 'Standard-Zahlungsbedingungen: 30 % Anzahlung bei unterzeichneter PI (Proforma-Rechnung), 70 % Restzahlung vor dem Versand gegen Kopie des B/L (Konnossement). Für Neupartner: 50 % Anzahlung, 50 % vor dem Versand. Für etablierte Partner mit Bestellhistorie: dokumentäres Akkreditiv (L/C at sight) oder Zahlung innerhalb von 30 Tagen für qualifizierte Konten (vorbehaltlich Bonitätsprüfung). Zahlungsmethoden: T/T-Überweisung, L/C (Letter of Credit), Western Union. Alle Zahlungen in USD oder EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Wie schützt afarer mein geistiges Eigentum und meine Designs?'
  answer: 'Der Schutz des geistigen Eigentums ist ein Kernbestandteil unseres OEM-Service. Wir unterzeichnen NDAs, bevor über Designs gesprochen wird. Design-Dateien werden auf isolierten Arbeitsplatzrechnern mit Zugriffsprotokollierung bearbeitet. Alle Werkzeuge und Formen bleiben Ihr exklusives Eigentum (von Ihnen bezahlt). Wir verwenden Ihre Formen oder Designs nie für andere Kunden wieder. Lagerung und Wartung der Formen sind für aktive Konten inklusive. Bei Vertragsende werden die Formen entweder an Sie versandt oder mit Videodokumentation vernichtet. Wir respektieren alle Marken- und Patentrechte.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Welche Versand- und Logistikoptionen stehen zur Verfügung?'
  answer: 'FOB Qingdao (Standard): Die Ware wird im Hafen von Qingdao verladen; ab dort organisieren Sie den Weitertransport. CIF (benannter Hafen): Wir organisieren und versichern den Versand bis zu Ihrem Zielhafen. DDP / Haustürservice: komplette Logistik inklusive Zollabfertigung und Endzustellung. Seefracht an die US-Westküste: etwa 25–30 Tage. Seefracht in die EU (Hamburg/Rotterdam): etwa 30–35 Tage. Luftfracht für Eilbestellungen verfügbar (3–5 Tage). Wir übernehmen die komplette Exportzolldokumentation, die Ursprungszeugnisse und die Packlisten.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Welche Qualitätskontrollprozesse gelten für OEM-Bestellungen?'
  answer: 'Jede OEM-Bestellung folgt einem dokumentierten QC-Plan: 1) Wareneingangsprüfung – Chargenprüfung des PVC-Stoffs auf Dicke, Zugfestigkeit und UV-Beständigkeit. 2) Prozessbegleitende QC – Prüfung der Nahtschweißfestigkeit alle 50 Einheiten, Druckhaltetest beim 1,25-fachen Nenn-PSI. 3) Endkontrolle – 100-%-Sichtprüfung und Drucktest jedes einzelnen Boards. 4) AQL-Stichprobenprüfung – Chargenstichprobe nach ISO 2859 mit kritischen Fehlern = 0 Akzeptanz. 5) Inspektion durch Drittparteien – SGS, Bureau Veritas oder Intertek auf Kosten des Käufers verfügbar.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Können Sie eine individuelle Verpackung für meine Marke erstellen?'
  answer: 'Ja. Wir bieten einen vollständigen Verpackungsservice: Retail-Boxen mit CMYK-Vollfarbdruck und Markengrafiken, Tragetaschen mit siebgedruckten oder bestickten Logos, Anleitungen in Ihrer Sprache, Hangtags und Barcode-/UPC-Etiketten sowie Innenverpackung (Polybeutel, Schaumstoffeinlagen). Mindest-MOQ für Verpackung: 500–1000 Einheiten für individuelle Boxen, 200–500 für Tragetaschen. Der Verpackungsdesign-Service ist bei OEM-Bestellungen inklusive.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Kann ich die Fabrik besuchen oder eine Drittparteien-Prüfung organisieren?'
  answer: 'Werksbesuche sind nach Terminvereinbarung willkommen. Wir empfangen das ganze Jahr über Markeneigner und organisieren die Abholung am internationalen Flughafen Qingdao Jiaodong (TAO). Für Käufer, die nicht anreisen können, bieten wir: eine virtuelle Werksbesichtigung per Videoanruf, die Koordination einer Drittparteien-Prüfung mit SGS/Bureau Veritas (Prüfkosten trägt der Käufer) sowie ein detailliertes Dossier zu den Fabrikfähigkeiten inklusive Geräteliste, QC-Prozessablauf und Personalqualifikationen.'
  category: b2b

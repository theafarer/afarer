- id: cold-weather-safety
  question: 'Welche Sicherheitsausrüstung brauche ich fürs Paddeln im kalten Wasser?'
  answer: 'Unter 15 °C Wassertemperatur ist ein Thermoschutz erforderlich. Bei 8–14 °C tragen Sie einen Neoprenanzug oder Trockenanzug mit Booties, Handschuhen und Kapuze. Bei 14–20 °C genügt ein 3/2-mm-Neoprenanzug. Tragen Sie immer eine passgenau sitzende Rettungsweste – für Thermoschutz und Sicherheit. Prüfen Sie die örtlichen Vorschriften zur vorgeschriebenen Ausrüstung.'

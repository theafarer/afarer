- id: saltwater-rinse
  question: 'Muss ich mein aufblasbares Board nach dem Meereinsatz abspülen?'
  answer: 'Ja – spülen Sie Board, Finnen, Pumpe und Paddel nach jedem Kontakt mit Salzwasser gründlich mit Süßwasser ab. Salzkristalle setzen sich in Nähten und Ventilen fest und verursachen Mikrolecks und Korrosion. Trocknen Sie das Board im Schatten, bevor Sie es entlüften und einlagern. Regelmäßiges Abspülen verlängert die Lebensdauer Ihres aufblasbaren Boards erheblich.'

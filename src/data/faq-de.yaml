  question: 'Auf wie viel PSI soll ich mein SUP aufpumpen?'
  answer: 'Pumpen Sie für die beste Leistung den maximalen Nenn-Luftdruck des Boards auf – in der Regel 15–18 PSI bei hochwertigen aufblasbaren SUPs. Das afarer SUP Explorer 11 zeigt seine beste Performance bei 15–18 PSI. Zu wenig Luftdruck lässt das Board weich werden und die Spur halten. Zu viel Luftdruck über den Nennwert hinaus kann die Drop-Stitch-Fäden beschädigen. Der Aufkleber nahe dem Ventil nennt den konkreten Wert für Ihr Board.'

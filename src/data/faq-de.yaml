  question: 'Wie reinige und pflege ich das EVA-Deckpad?'
  answer: 'Spülen Sie das Deckpad nach jeder Session mit Süßwasser ab. Bei Schmutz oder Flecken verwenden Sie milde Seife und eine weiche Bürste – vermeiden Sie aggressive Chemikalien. Wenn sich die Ränder lösen, tragen Sie eine kleine Menge wasserdichten Marineklebers auf und beschweren die Stelle 24 Stunden lang. Bewahren Sie das Board außerhalb der direkten UV-Strahlung auf, um ein Austrocknen des Pads zu verhindern.'

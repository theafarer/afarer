- id: sup-sustainability
  question: 'Sind aufblasbare SUP Boards umweltverträglich?'
  answer: 'Aufblasbare SUPs haben in mehreren Punkten einen kleineren ökologischen Fußabdruck als Hardboards: Sie verbrauchen weniger Rohstoffe in der Produktion, ihr geringeres Gewicht reduziert die Emissionen beim Transport und ihre Langlebigkeit senkt die Zahl der Ersatzkäufe. Das in afarer Boards verwendete PVC ist bleifrei und REACH-konform. Wichtige Nachhaltigkeitspraktiken: ein hochwertiges Board kaufen, das 5–10 Jahre hält, Löcher reparieren statt das Board ersetzen, das Board am Lebensende über spezialisierte PVC-Recyclingprogramme recyceln und Einwegverpackungen vermeiden, indem man Marken mit wiederverwendbaren Tragetaschen wählt.'
  category: general
  relatedProducts:

  question: 'Brauche ich wirklich eine Leash fürs SUP?'
  answer: 'Ja – tragen Sie immer eine Leash. Eine Spiralleash für SUPs wird am Knöchel oder an der Wade befestigt und hält das Board nach einem Sturz bei Ihnen. Auf offenem Wasser kann eine Leash Leben retten, weil sie verhindert, dass Sie von Ihrem Auftriebskörper getrennt werden. Beim Flusspaddeln nutzen Sie eine Leash mit Schnellverschluss, um ein Hängenbleiben zu vermeiden.'

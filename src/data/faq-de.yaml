  question: 'Was ist Drop-Stitch-Kern-Technologie und warum ist sie wichtig?'
  answer: 'Die Drop-Stitch-Technologie nutzt tausende Polyesterfäden, die die obere und untere Schicht eines PVC-Boards verbinden. Bei einem Luftdruck von 15–20 PSI entsteht so eine steife, torsionsfeste Struktur, die sich wie ein Hardboard fährt. afarer setzt in allen SUP-Produktlinien dreilagiges Militär-PVC mit Drop-Stitch-Laminierung ein und erreicht eine Steifigkeit, die mit Epoxy-Boards vergleichbar ist – bei voller Portabilität eines Aufblasbboards.'

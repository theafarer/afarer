  question: 'Welche Regeln gelten bei Flugreisen mit einem aufblasbaren SUP?'
  answer: 'Die meisten Airlines akzeptieren SUP-Rucksäcke als Aufgabegepäck, sofern sie unter 23–32 kg wiegen. Der afarer Rucksack misst etwa 90x40x30 cm und wiegt gepackt rund 15 kg. Manche Airlines berechnen Gebühren für Übergepäck. Kommen Sie früh, verpacken Sie Finnen und Pumpe separat im Handgepäck und kennzeichnen Sie den Rucksack als zerbrechlich. Informieren Sie sich vor dem Flug immer über die Sportgepäck-Regeln Ihrer Airline.'

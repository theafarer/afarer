- id: sup-learning
  question: '¿Es difícil aprender SUP?'
  answer: 'Para nada. La mayoría de los principiantes se ponen de pie y empiezan a remar en su primera sesión. Nuestra serie All-Around de SUP cuenta con plataformas extra anchas y estables diseñadas específicamente para quienes reman por primera vez. Empiece en aguas tranquilas y en cuestión de minutos estará navegando.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: '¿Puedo usarlo en el mar?'
  answer: 'Sí. Las tablas SUP de afarer están fabricadas para su uso en el mar, en lagos y en ríos. Nuestra serie Touring soporta el oleaje costero, y todas las tablas utilizan PVC de grado marino resistente a la corrosión del agua salada. Enjuáguela con agua dulce después de usarla en el mar.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: '¿Cuánto tiempo tarda en inflarse?'
  answer: 'Con la bomba de doble acción incluida, la mayoría de las tablas se inflan a 12–15 PSI en menos de 5 minutos. Nuestra opción de bomba eléctrica lo reduce a menos de 2 minutos. El desinflado y el empaquetado llevan unos 3 minutos.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: '¿Puedo viajar con un SUP inflable?'
  answer: 'Por supuesto. Cada tabla de afarer se guarda en una funda de transporte tamaño mochila que cumple los requisitos de equipaje de las aerolíneas. Con solo 18–22 libras, es fácil de llevar a la playa, al lago o por las terminales del aeropuerto.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: '¿Cuál es el límite de peso?'
  answer: 'Nuestras tablas SUP All-Around soportan hasta 220 libras. Las series Touring y Yoga soportan hasta 250 libras. Para uso en tándem o cargas más pesadas, contacte con nuestro equipo para recibir recomendaciones.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: '¿Qué incluye la caja?'
  answer: 'Cada SUP de afarer incluye la tabla, una mochila de transporte, una bomba de mano de doble acción, una aleta removible, un leash de espiral y un kit de reparación. Algunos modelos también ofrecen la opción de mejora a un remo de carbono.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: '¿Ofrecen ofertas de paquetes?'
  answer: 'Sí. Ofrecemos paquetes seleccionados que le ahorran dinero en comparación con comprar los artículos por separado. Contacte con nuestro equipo de ventas para conocer las promociones vigentes y los precios con descuento por volumen.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: '¿Necesito chaleco salvavidas en un SUP?'
  answer: 'Sí. Muchas jurisdicciones exigen por ley un chaleco salvavidas en cualquier embarcación, incluidos los SUP. Incluso donde no es obligatorio, un chaleco salvavidas con certificación CE es un equipo de seguridad esencial. Recomendamos llevarlo puesto en todo momento sobre el agua.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: '¿Necesito registrar mi tabla SUP?'
  answer: 'Los requisitos varían según la jurisdicción. En la mayoría de las regiones, los SUP sin motor no requieren registro. Si planea añadir un motor, consulte las normas específicas con su autoridad marítima local. Las tablas de remo recreativas generalmente están exentas del registro de embarcaciones.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: '¿Cómo reparo un pinchazo?'
  answer: 'Limpie la zona, corte un parche con esquinas redondeadas, aplique adhesivo de PVC, presione con firmeza y espere 24 horas antes de inflar. Las tablas de afarer incluyen un kit de reparación. Para instrucciones detalladas, consulte nuestra guía de reparación de inflables.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: '¿Cómo debo guardar mi SUP inflable?'
  answer: 'Enjuague con agua dulce, seque por completo, desinfle totalmente, enrolle sin apretar desde el morro y guarde la tabla en la funda de transporte en un lugar fresco y seco, lejos de la luz solar directa. Nunca la guarde húmeda ni a temperaturas extremas.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: '¿Tabla SUP inflable o rígida?'
  answer: 'Las tablas inflables ofrecen portabilidad, comodidad de almacenamiento y absorción de impactos. Las tablas rígidas ofrecen máxima rigidez y velocidad. Para la mayoría de los usuarios recreativos, un inflable de calidad con núcleo drop-stitch es la opción práctica.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: '¿A partir de qué velocidad del viento es peligroso el SUP?'
  answer: 'Principiantes: más de 10 mph (8 nudos). Intermedios: más de 15 mph (13 nudos). Avanzados: más de 20 mph (17 nudos). Ante la duda, no salga al agua. El viento de tierra hacia el mar es peligroso en cualquier nivel.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: '¿Cuál es la garantía de afarer?'
  answer: 'Todos los productos de afarer están respaldados por una garantía completa del fabricante. Las tablas SUP están cubiertas durante más de 2 años contra defectos de fabricación. La garantía cubre defectos de materiales y de fabricación en condiciones de uso normal.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: '¿Cómo presento una reclamación de garantía?'
  answer: 'Presente una reclamación contactando con nuestro equipo de soporte con su número de pedido, fotos del problema y una breve descripción. La mayoría de las reclamaciones se revisan en un plazo de 2 días hábiles. Las reclamaciones aprobadas reciben un reemplazo o instrucciones de reparación en cuestión de días.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: '¿Cuánto tarda el envío?'
  answer: 'Los pedidos en stock se envían en un plazo de 2–4 días hábiles. Los pedidos dentro de EE. UU. llegan en 5–10 días hábiles. Los pedidos internacionales llegan en 10–15 días hábiles según el destino. Los pedidos urgentes pueden agilizarse.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: '¿Cuál es su política de devoluciones?'
  answer: 'Aceptamos devoluciones dentro de los 30 días posteriores a la entrega para productos sin usar en su embalaje original. Los pedidos personalizados/OEM no son retornables. Contacte con nuestro equipo de soporte para iniciar una devolución — le proporcionamos una etiqueta de envío prepagada.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: '¿Ofrecen servicios OEM/ODM?'
  answer: 'Sí. Ofrecemos servicios de marca propia y de diseño personalizado para empresas. Desde la personalización de marca en modelos existentes hasta diseños de casco totalmente personalizados, nuestro equipo de ingeniería puede desarrollar productos bajo su marca. Se aplican cantidades mínimas de pedido.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: '¿Qué longitud de remo necesito?'
  answer: 'El remo debe ser 6–8 pulgadas más alto que su estatura. Los remos ajustables permiten un ajuste fino para distintas condiciones. Consulte nuestra guía de remos para un dimensionamiento detallado.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: '¿Cuál es la diferencia entre PVC y Hypalon?'
  answer: 'El PVC es ligero, asequible y fácil de reparar con el kit de parches incluido. El PVC de grado militar con recubrimiento resistente a los rayos UV ofrece el mejor equilibrio entre durabilidad y peso para el uso recreativo de SUP. afarer utiliza PVC laminado de triple capa en todas sus gamas de productos.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: '¿Qué ancho de SUP es mejor para la estabilidad?'
  answer: 'Para principiantes, un ancho de 33–34 pulgadas ofrece el mejor equilibrio entre estabilidad y facilidad de remo. Las tablas de menos de 32 pulgadas se sienten inestables para los remeros novatos. La afarer SUP Explorer 11, con 33 pulgadas de ancho, es ideal para aprender.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: '¿Cómo elijo el volumen del SUP según mi peso?'
  answer: 'Multiplique su peso en kg por 2,2 para obtener un volumen objetivo adecuado para principiantes. Por ejemplo, un remero de 75 kg necesita al menos 165 litros, pero 220–260 litros resultan mucho más estables para aprender. La SUP Explorer 11 ofrece 260 litros, adecuada para remeros de hasta 100 kg.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: '¿Cómo se compara afarer con otras marcas?'
  answer: 'afarer ofrece la mejor relación calidad-precio en equipos inflables para deportes acuáticos. Comparada con Red Paddle Co, afarer ofrece el 90 % del rendimiento al 60 % del coste. Comparada con iRocker, afarer utiliza PVC de grado militar de triple capa de mayor calidad y mayores valores de PSI. Comparada con Bluefin, afarer ofrece especificaciones de material superiores. Para la mayoría de los remeros recreativos, afarer proporciona el mejor equilibrio entre calidad y precio.'
  category: general

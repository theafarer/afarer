- id: fishing-sup-setup
  question: '¿Puedo pescar desde una tabla SUP?'
  answer: 'Sí. La pesca desde SUP es cada vez más popular porque la posición de pie ofrece una excelente visibilidad dentro del agua. Elija una tabla de al menos 11 pies de largo y 33–34 pulgadas de ancho para mayor estabilidad. Añada una caja de plástico con portacañas sujeta a los cordones elásticos de la cubierta, un pequeño ancla y lleve siempre puesto un PFD. La afarer SUP Explorer 11 funciona muy bien para la pesca ocasional.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: '¿Puedo hacer yoga en una tabla SUP?'
  answer: 'Por supuesto. El yoga en SUP combina posturas tradicionales con el desafío de una plataforma flotante, activando músculos estabilizadores más profundos. Utilice una tabla de 33 pulgadas o más de ancho con una almohadilla de cubierta suave y antideslizante. Practique en aguas tranquilas y poco profundas con un ancla. Empiece con posturas base como perro boca abajo, guerrero II y postura del árbol. La SUP Explorer 11, con su almohadilla EVA de cobertura completa, es muy adecuada.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: '¿Cuáles son las normas de las aerolíneas para viajar con un SUP inflable?'
  answer: 'La mayoría de las aerolíneas aceptan las mochilas de SUP como equipaje facturado si pesan menos de 23–32 kg. La mochila de afarer mide aproximadamente 90x40x30 cm y pesa unos 15 kg empaquetada. Algunas aerolíneas pueden cobrar cargos por equipaje de tamaño excedido. Llegue con tiempo, envuelva las aletas y la bomba por separado en su equipaje de mano y etiquete la bolsa como frágil. Investigue siempre la política de equipaje deportivo de su aerolínea antes de volar.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: '¿Qué equipo de seguridad necesito para remar en agua fría?'
  answer: 'El agua por debajo de 15°C requiere protección térmica. Para 8–14°C utilice un traje de neopreno o un traje seco con botas, guantes y capucha. Para 14–20°C es suficiente un traje de neopreno de 3/2 mm. Lleve siempre puesto un PFD bien ajustado para protección térmica y seguridad. Consulte la normativa local sobre equipos obligatorios.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: '¿Cuáles son las cantidades mínimas de pedido para OEM/ODM?'
  answer: 'Las cantidades mínimas de pedido (MOQ) varían según el tipo de producto y su complejidad. La personalización de marca en modelos existentes generalmente requiere de 5 a 10 unidades. Los diseños de casco totalmente personalizados requieren MOQ más altas. Contacte con nuestro equipo de ventas con sus requisitos para obtener un presupuesto detallado. Nos ocupamos de todo, desde colores y logotipos personalizados hasta diseños de molde completamente originales.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: '¿Puedo poner mi propio logotipo en los productos de afarer?'
  answer: 'Sí. Nuestro servicio OEM incluye la colocación de logotipos personalizados, combinaciones de colores personalizadas y embalaje personalizado. Ofrecemos tampografía, transferencia térmica y bordado según el tipo de producto. Envíe su arte y especificaciones a nuestro equipo de ventas para recibir un presupuesto y una estimación del plazo de entrega.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: '¿A qué PSI debo inflar mi SUP?'
  answer: 'Infle hasta el PSI máximo nominal de la tabla para obtener el mejor rendimiento — normalmente 15–18 PSI en los SUP inflables de calidad. La afarer SUP Explorer 11 rinde mejor a 15–18 PSI. Una inflación insuficiente hace que la tabla se sienta blanda y pierda rumbo. Sobreinflar por encima del máximo nominal arriesga dañar los hilos drop-stitch. Consulte la pegatina junto a la válvula para conocer la presión específica de su tabla.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide
- id: sup-deck-pad-care
  question: '¿Cómo limpio y mantengo la almohadilla EVA de cubierta?'
  answer: 'Enjuague la almohadilla con agua dulce después de cada sesión. Para la suciedad o las manchas, use jabón suave y un cepillo suave — evite los productos químicos agresivos. Si los bordes comienzan a despegarse, aplique una pequeña cantidad de adhesivo marino impermeable y presione con peso durante 24 horas. Mantenga la tabla fuera de la luz UV directa cuando no la use para evitar el deterioro de la almohadilla.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: '¿Puedo remar en mi SUP sentado?'
  answer: 'Sí. Muchas tablas SUP, incluida la afarer Explorer 11, tienen anillas en D que permiten acoplar un asiento. Remar sentado es una opción cómoda para viajes largos, para pescar o cuando quiera cambiar de posición sobre el agua.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: '¿Necesito enjuagar mi tabla inflable después de usarla en el mar?'
  answer: 'Sí — enjuague siempre su tabla, aletas, bomba y remo con agua dulce tras el contacto con agua salada. Los cristales de sal se introducen en las costuras y válvulas, provocando microfugas y corrosión. Seque la tabla a la sombra antes de desinflarla y guardarla. El enjuague regular prolonga considerablemente la vida útil de su tabla inflable.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: '¿De verdad necesito un leash para el SUP?'
  answer: 'Sí — lleve siempre un leash. Un leash de espiral para SUP se sujeta al tobillo o a la pantorrilla y mantiene la tabla con usted si cae al agua. En aguas abiertas, un leash puede salvarle la vida al evitar la separación de su dispositivo de flotación. Para remar en ríos, utilice un leash de liberación rápida para evitar atrapamientos.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: '¿Qué es la tecnología de núcleo drop-stitch y por qué importa?'
  answer: 'La tecnología de núcleo drop-stitch utiliza miles de hilos de poliéster que conectan las capas superior e inferior de una tabla de PVC. Al inflarse a 15-20 PSI, estos hilos crean una estructura rígida y resistente a la torsión que se comporta como una tabla de casco rígido. afarer utiliza PVC de grado militar de triple capa con laminación drop-stitch en todas sus gamas de SUP, logrando una rigidez comparable a la de las tablas de epoxi manteniendo la portabilidad de un inflable.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup
- id: sup-inflatable-vs-rigid
  question: 'SUP inflable frente a rígido: ¿cuál es mejor según el uso?'
  answer: 'Los SUP inflables destacan en portabilidad, almacenamiento y absorción de impactos — ideales para viajar, para principiantes y para uso recreativo. Las tablas rígidas de epoxi ofrecen máxima velocidad y deslizamiento para competir y hacer surf. Para el 90 % de los remeros, un inflable de calidad con núcleo drop-stitch (15-20 PSI) ofrece rigidez suficiente para travesías, fitness, yoga y pesca. Las tablas inflables de afarer igualan el rendimiento de las tablas rígidas de gama media y se guardan en una mochila.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-vs-hard-board
    - how-to-choose-inflatable-sup
- id: pvc-vs-hypalon-boats
  question: 'Botes inflables de PVC frente a Hypalon: ¿qué material es mejor?'
  answer: 'El PVC es más ligero, asequible, fácil de reparar y resiste la degradación UV cuando se utilizan formulaciones de grado militar. El Hypalon (CSM) ofrece una resistencia química y a la abrasión superior para uso comercial/militar, pero es más pesado, caro y difícil de reparar. Para los navegantes recreativos, el PVC de grado militar de triple capa de afarer con recubrimiento resistente a UV ofrece el mejor equilibrio entre peso, durabilidad y coste. Para operadores profesionales/comerciales que requieren máxima durabilidad, se recomienda el Hypalon.'
  category: product
  relatedProducts: []
  relatedGuides:
    - pvc-vs-hypalon-boats
    - how-long-inflatable-boats-last
- id: sup-skill-progression
  question: '¿Cuál es la progresión típica en SUP de principiante a avanzado?'
  answer: 'Principiante (sesiones 1-3): ponerse de pie, golpe de remo básico hacia delante, giros y caídas seguras. Intermedio (sesiones 5-15): técnica de remo eficiente, giros de pivote, navegación en aguas agitadas y habilidades básicas de rescate. Avanzado (más de 20 sesiones): salidas de competición, giros en boya, surf en olas pequeñas y remo a favor del viento. Profesional: competición, surf SUP y travesías de larga distancia. Las tablas de afarer acompañan cada etapa: la Explorer 11 para principiantes, la Ocean Voyager para travesías y la Cheetah Surge para remo de alto rendimiento.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-cheetah-surge
  relatedGuides:
    - beginner-sup-guide
    - sup-fitness-workout
    - sup-paddle-guide
- id: sup-weight-capacity
  question: '¿Cuánto peso puede soportar una tabla SUP inflable?'
  answer: 'La capacidad de peso varía según el volumen de la tabla. Tablas de afarer: SUP Explorer 11 (260 L, hasta 100 kg / 220 libras), Ocean Voyager 12 (310 L, hasta 140 kg / 308 libras), Leviathan Wake (350 L, hasta 180 kg / 396 libras). Para un rendimiento óptimo, mantenga la carga total (remero + equipo) por debajo del 80 % de la capacidad máxima. La tabla flota más alto y mantiene mejor el rumbo sin sobrecarga, especialmente en aguas agitadas.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-leviathan-wake
  relatedGuides:

- id: b2b-factory-audit
  question: '¿Puedo visitar la fábrica o organizar una auditoría de terceros?'
  answer: 'Las visitas a la fábrica se realizan con cita previa. Recibimos a propietarios de marcas durante todo el año y podemos organizar la recogida en el Aeropuerto Internacional Qingdao Jiaodong (TAO). Para los compradores que no pueden viajar, ofrecemos: visita virtual a la fábrica por videollamada, coordinación de auditorías de terceros con SGS/Bureau Veritas (el comprador cubre el coste de la auditoría) y un paquete documental detallado de capacidades de fábrica que incluye lista de equipos, flujo del proceso de control de calidad y cualificaciones del personal.'

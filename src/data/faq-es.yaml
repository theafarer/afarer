- id: b2b-moq
  question: '¿Cuál es la cantidad mínima de pedido para la producción de SUP OEM/ODM?'
  answer: 'Las cantidades mínimas de pedido (MOQ) varían según el tipo de producto. Personalización de marca en modelos de stock: 50 unidades por SKU. Desarrollo de moldes con forma personalizada: 200–500 unidades por modelo (primer pedido). Programas de moldes compartidos desde 50 unidades. Producción de botes Hypalon: 20–50 unidades según el tamaño. Accesorios y PFD: 500–1000 unidades por diseño. Contacte con nuestro equipo OEM con su volumen previsto para obtener MOQ y precios precisos.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: '¿Cuáles son los plazos de entrega habituales de los pedidos OEM de SUP?'
  answer: 'Primeros pedidos OEM con personalización de marca en moldes existentes: 6–8 semanas desde el depósito hasta FOB Qingdao. Pedidos con formas personalizadas que requieren moldes nuevos: 12–20 semanas (incluyen diseño 3D, fabricación de moldes, prototipado y producción en serie). Pedidos repetidos con especificaciones aprobadas: 6–8 semanas. Los pedidos urgentes pueden agilizarse a 4–5 semanas para moldes existentes. Los plazos incluyen el abastecimiento de materias primas, la producción, el control de calidad en línea y la carga del contenedor.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: '¿Qué certificaciones llevan los productos OEM de afarer?'
  answer: 'Todos los productos OEM/ODM de afarer incluyen: declaración de conformidad CE (mercado de la UE), UKCA (mercado del Reino Unido), sistema de gestión de calidad ISO 9001:2015, auditoría de cumplimiento social BSCI, cumplimiento de materiales REACH y RoHS, clasificación EN ISO 25649 para botes inflables. Certificaciones adicionales a petición: documentación de cumplimiento de la Guardia Costera de EE. UU., ensayos según estándar militar (MIL-STD-810) y apoyo a la certificación de importación del país de destino.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: '¿Puedo pedir muestras antes de comprometerme con la producción en serie?'
  answer: 'Sí. Los pedidos de muestra están disponibles para todos los proyectos OEM/ODM. Las muestras de preproducción (PPS) se fabrican tras la creación del molde y antes de la producción en serie. Plazo de entrega de muestras: 15–25 días laborables para moldes existentes, 25–40 días laborables para moldes personalizados. El coste de las muestras es deducible del primer pedido en serie. Las muestras se envían por mensajería exprés (DHL, FedEx, UPS) con seguimiento completo y suelen llegar en 3–5 días hábiles.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: '¿Qué condiciones de pago están disponibles para los pedidos OEM?'
  answer: 'Condiciones de pago estándar: 30 % de depósito con PI firmada (factura proforma), 70 % de saldo antes del envío contra copia del B/L (conocimiento de embarque). Para socios por primera vez: 50 % de depósito, 50 % antes del envío. Para socios establecidos con historial de pedidos: L/C a la vista o 30 días netos para cuentas que califiquen (sujeto a revisión crediticia). Métodos de pago: transferencia bancaria T/T, L/C (carta de crédito), Western Union. Todos los pagos en USD o EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: '¿Cómo protege afarer mi propiedad intelectual y mis diseños?'
  answer: 'La protección de la propiedad intelectual es una parte fundamental de nuestro servicio OEM. Firmamos acuerdos de confidencialidad (NDA) antes de cualquier conversación de diseño. Los archivos de diseño se manejan en estaciones de trabajo aisladas con registro de accesos. Todas las herramientas y moldes siguen siendo su propiedad exclusiva (pagados por usted). No reutilizaremos sus moldes ni sus diseños para otros clientes. El almacenamiento y mantenimiento de los moldes están incluidos para las cuentas activas. Al finalizar el acuerdo, los moldes se le envían o se destruyen con documentación en vídeo. Respetamos todos los derechos de marca y patentes.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: '¿Qué opciones de envío y logística están disponibles?'
  answer: 'FOB Qingdao (estándar): la carga se embarca en el puerto de Qingdao; usted organiza el transporte desde allí. CIF (puerto designado): organizamos y aseguramos el envío hasta su puerto de destino. DDP / puerta a puerta: logística integral incluyendo despacho de aduanas y entrega final. Flete marítimo a la costa oeste de EE. UU.: aproximadamente 25–30 días. Flete marítimo a la UE (Hamburgo/Róterdam): aproximadamente 30–35 días. Flete aéreo disponible para pedidos urgentes (3–5 días). Gestionamos toda la documentación de exportación, los certificados de origen y las listas de empaque.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: '¿Qué procesos de control de calidad se aplican a los pedidos OEM?'
  answer: 'Cada pedido OEM sigue un plan de control de calidad documentado: 1) Inspección de materiales entrantes — ensayo de lotes de tejido de PVC para espesor, resistencia a la tracción y resistencia UV. 2) Control en proceso — ensayo de resistencia de soldadura de costuras cada 50 unidades, prueba de retención de presión a 1,5 veces el PSI nominal. 3) Inspección final — inspección visual y prueba de presión del 100 % de las tablas. 4) Muestreo AQL — muestreo por lote según ISO 2859 con defecto crítico = 0 aceptado. 5) Inspección de terceros — SGS, Bureau Veritas o Intertek disponibles por cuenta del comprador.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: '¿Pueden crear embalaje personalizado para mi marca?'
  answer: 'Sí. Ofrecemos servicios completos de embalaje personalizado: cajas minoristas con impresión CMYK a todo color y gráficos de marca, bolsas de transporte con logotipos serigrafiados o bordados, manuales de instrucciones en su idioma, etiquetas colgantes y códigos de barras/UPC, y embalaje interior (bolsas de plástico, insertos de espuma). MOQ mínima de embalaje: 500–1000 unidades para cajas personalizadas, 200–500 para bolsas de transporte. El servicio de diseño de embalaje está incluido en los pedidos OEM.'

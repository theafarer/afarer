  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Vocês oferecem serviços OEM/ODM?'
  answer: 'Sim. Oferecemos serviços de marca própria e design personalizado para empresas. Da personalização de marca em modelos existentes a designs de casco totalmente personalizados, nossa equipe de engenharia pode desenvolver produtos com a sua marca. Aplicam-se quantidades mínimas de pedido.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'De qual comprimento de remo eu preciso?'
  answer: 'O remo deve ser 6–8 polegadas mais alto que a sua altura. Remos ajustáveis permitem ajustes finos para condições diferentes. Consulte nosso guia de remos para o dimensionamento detalhado.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Qual é a diferença entre PVC e Hypalon?'
  answer: 'O PVC é leve, acessível e fácil de reparar com o kit de remendos incluído. O PVC de grau militar com revestimento resistente aos raios UV oferece o melhor equilíbrio entre durabilidade e peso para o uso recreativo de SUP. A afarer usa PVC laminado de tripla camada em todas as linhas de produtos.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Qual largura de SUP é melhor para estabilidade?'
  answer: 'Para iniciantes, uma largura de 33–34 polegadas oferece o melhor equilíbrio entre estabilidade e facilidade de remada. Pranchas com menos de 32 polegadas parecem instáveis para remadores novatos. A afarer SUP Explorer 11, com 33 polegadas, é ideal para aprender.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Como escolho o volume do SUP para o meu peso?'
  answer: 'Multiplique o seu peso em kg por 2,2 para obter um volume-alvo adequado para iniciantes. Por exemplo, um remador de 75 kg precisa de pelo menos 165 litros, mas 220–260 litros são muito mais estáveis para aprender. A SUP Explorer 11 oferece 260 litros, adequada para praticantes de até 100 kg.'
  category: product
  relatedProducts:

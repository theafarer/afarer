- id: sup-learning
  question: 'É difícil aprender SUP?'
  answer: 'De forma alguma. A maioria dos iniciantes consegue ficar de pé e remar ainda na primeira sessão. Nossa série All-Around de SUP conta com plataformas extra largas e estáveis, projetadas especificamente para quem rema pela primeira vez. Comece em águas calmas e em poucos minutos você estará navegando.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Posso usá-lo no mar?'
  answer: 'Sim. As pranchas SUP da afarer são fabricadas para uso no mar, em lagos e em rios. Nossa série Touring aguenta o mar agitado costeiro, e todas as pranchas usam PVC de grau marinho resistente à corrosão da água salgada. Enxágue com água doce após o uso no mar.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Quanto tempo leva para inflar?'
  answer: 'Com a bomba de dupla ação incluída, a maioria das pranchas infla até 12–15 PSI em menos de 5 minutos. Nossa opção de bomba elétrica reduz esse tempo para menos de 2 minutos. O esvaziamento e a embalagem levam cerca de 3 minutos.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Posso viajar com um SUP inflável?'
  answer: 'Com certeza. Cada prancha afarer cabe em uma mochila de transporte que atende aos requisitos de bagagem das companhias aéreas. Com apenas 18–22 libras, é fácil levá-la para a praia, para o lago ou pelos terminais do aeroporto.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Qual é o limite de peso?'
  answer: 'Nossas pranchas SUP All-Around suportam até 220 libras. As séries Touring e Yoga suportam até 250 libras. Para uso em tandem ou cargas mais pesadas, fale com nossa equipe para receber recomendações.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'O que vem na caixa?'
  answer: 'Cada SUP da afarer inclui a prancha, uma mochila de viagem, bomba manual de dupla ação, quilha removível, leash em espiral e kit de reparo. Alguns modelos também oferecem a opção de upgrade para um remo de carbono.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Vocês oferecem combos promocionais?'
  answer: 'Sim. Oferecemos pacotes selecionados que geram economia em comparação com a compra dos itens separadamente. Fale com nossa equipe de vendas para conhecer as promoções vigentes e os preços com desconto por volume.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Preciso de colete salva-vidas em um SUP?'
  answer: 'Sim. Em muitas jurisdições a lei exige colete salva-vidas em qualquer embarcação, incluindo SUPs. Mesmo onde não é obrigatório, um colete salva-vidas com certificação CE é um equipamento de segurança essencial. Recomendamos usá-lo o tempo todo na água.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Preciso registrar minha prancha de SUP?'
  answer: 'Os requisitos variam conforme a jurisdição. Na maioria das regiões, SUPs sem motor não exigem registro. Se você planeja adicionar um motor, consulte as regras específicas com sua autoridade marítima local. Pranchas de remo recreativas geralmente são isentas do registro de embarcações.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Como reparo um furo?'
  answer: 'Limpe a área, corte um remendo com cantos arredondados, aplique adesivo de PVC, pressione firmemente e aguarde 24 horas antes de inflar. As pranchas da afarer incluem um kit de reparo. Para instruções detalhadas, consulte nosso guia de reparo de infláveis.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Como devo guardar meu SUP inflável?'
  answer: 'Enxágue com água doce, seque completamente, esvazie totalmente, enrole frouxamente a partir do bico e guarde a prancha na bolsa de transporte em um local fresco e seco, longe da luz solar direta. Nunca a guarde úmida ou em temperaturas extremas.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Prancha de SUP inflável ou rígida?'
  answer: 'Pranchas infláveis oferecem portabilidade, praticidade de armazenamento e absorção de impactos. Pranchas rígidas oferecem máxima rigidez e velocidade. Para a maioria dos usuários recreativos, um inflável de qualidade com núcleo drop-stitch é a escolha prática.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Qual velocidade do vento é alta demais para o SUP?'
  answer: 'Iniciantes: acima de 10 mph (8 nós). Intermediários: acima de 15 mph (13 nós). Avançados: acima de 20 mph (17 nós). Na dúvida, não saia na água. Vento terrestre (que sopra da terra para o mar) é perigoso em qualquer nível de habilidade.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Qual é a garantia da afarer?'
  answer: 'Todos os produtos da afarer têm garantia abrangente do fabricante. As pranchas SUP são cobertas por mais de 2 anos contra defeitos de fabricação. A garantia cobre defeitos de materiais e de acabamento em uso normal.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Como abro uma solicitação de garantia?'
  answer: 'Abra uma solicitação entrando em contato com nossa equipe de suporte com o número do pedido, fotos do problema e uma breve descrição. A maioria das solicitações é analisada em até 2 dias úteis. Solicitações aprovadas recebem uma substituição ou instruções de reparo em poucos dias.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Quanto tempo leva a entrega?'
  answer: 'Pedidos em estoque são enviados em 2–4 dias úteis. Pedidos domésticos nos EUA chegam em 5–10 dias úteis. Pedidos internacionais chegam em 10–15 dias úteis, dependendo do destino. Pedidos urgentes podem ser acelerados.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Qual é a política de devolução?'
  answer: 'Aceitamos devoluções em até 30 dias após a entrega para produtos não usados na embalagem original. Pedidos personalizados/OEM não podem ser devolvidos. Fale com nossa equipe de suporte para iniciar uma devolução — fornecemos uma etiqueta de envio pré-paga.'

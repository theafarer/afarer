- id: fishing-sup-setup
  question: 'Posso pescar em uma prancha de SUP?'
  answer: 'Sim. A pesca em SUP está cada vez mais popular porque a posição em pé oferece excelente visibilidade dentro da água. Escolha uma prancha de pelo menos 11 pés de comprimento e 33–34 polegadas de largura para estabilidade. Adicione uma caixa com porta-varas fixada nos elásticos do deck, uma pequena âncora e sempre use um PFD. A afarer SUP Explorer 11 funciona muito bem para pesca casual.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: 'Posso fazer yoga em uma prancha de SUP?'
  answer: 'Com certeza. O yoga em SUP combina posturas tradicionais com o desafio de uma plataforma flutuante, ativando músculos estabilizadores mais profundos. Use uma prancha de 33 polegadas ou mais de largura com um pad de deck macio e antiderrapante. Pratique em águas calmas e rasas com uma âncora. Comece com posturas básicas como cachorro olhando para baixo, guerreiro II e postura da árvore. A SUP Explorer 11, com seu pad EVA completo, é muito adequada.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: 'Quais são as regras das companhias aéreas para viajar com um SUP inflável?'
  answer: 'A maioria das companhias aéreas aceita mochilas de SUP como bagagem despachada se estiverem abaixo de 23–32 kg. A mochila da afarer mede aproximadamente 90x40x30 cm e pesa cerca de 15 kg embalada. Algumas companhias podem cobrar taxas de bagagem oversized. Chegue com antecedência, embrulhe quilhas e bomba separadamente na bagagem de mão e identifique a mochila como frágil. Pesquise sempre a política de equipamentos esportivos da sua companhia antes de voar.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'Qual equipamento de segurança preciso para remar em água fria?'
  answer: 'Água abaixo de 15°C exige proteção térmica. Para 8–14°C use roupa de neoprene ou roupa seca com botas, luvas e capuz. Para 14–20°C um neoprene 3/2 mm é suficiente. Sempre use um PFD bem ajustado para proteção térmica e segurança. Verifique as regulamentações locais sobre equipamentos obrigatórios.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'Quais são as quantidades mínimas de pedido para OEM/ODM?'
  answer: 'As quantidades mínimas de pedido (MOQ) variam conforme o tipo e a complexidade do produto. A personalização de marca em modelos existentes normalmente exige de 5 a 10 unidades. Designs de casco totalmente personalizados exigem MOQs mais altas. Fale com nossa equipe de vendas com os seus requisitos para uma cotação detalhada. Cuidamos de tudo, de cores e logotipos personalizados a designs de molde totalmente originais.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'Posso colocar meu próprio logotipo nos produtos da afarer?'
  answer: 'Sim. Nosso serviço OEM inclui posicionamento personalizado de logotipo, esquemas de cores personalizados e embalagem personalizada. Oferecemos tampografia, transferência térmica e bordado, dependendo do tipo de produto. Envie sua arte e especificações para nossa equipe de vendas para receber uma cotação e um prazo estimado.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'Até qual PSI devo inflar meu SUP?'
  answer: 'Infle até o PSI máximo nominal da prancha para o melhor desempenho — normalmente 15–18 PSI para SUPs infláveis de qualidade. A afarer SUP Explorer 11 tem o melhor desempenho a 15–18 PSI. A inflagem insuficiente faz a prancha ficar mole e perder direção. A inflagem excessiva acima do máximo nominal arrisca danificar os fios drop-stitch. Verifique a etiqueta junto à válvula para a classificação específica da sua prancha.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide
- id: sup-deck-pad-care
  question: 'Como limpo e mantenho o pad EVA do deck?'
  answer: 'Enxágue o pad do deck com água doce após cada sessão. Para sujeira ou manchas, use sabão neutro e uma escova macia — evite produtos químicos agressivos. Se as bordas começarem a levantar, aplique uma pequena quantidade de adesivo marinho impermeabilizante e pressione com peso por 24 horas. Mantenha a prancha longe dos raios UV diretos quando não estiver em uso para evitar a degradação do pad.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'Posso remar no meu SUP sentado?'
  answer: 'Sim. Muitas pranchas SUP, incluindo a afarer Explorer 11, têm anéis em D que permitem a fixação de um assento. Remar sentado é uma opção confortável para viagens mais longas, para pescar ou quando você quer mudar de posição na água.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: 'Preciso enxaguar minha prancha inflável após o uso no mar?'
  answer: 'Sim — sempre enxágue a prancha, as quilhas, a bomba e o remo com água doce após o uso em água salgada. Os cristais de sal penetram nas costuras e válvulas, causando microvazamentos e corrosão. Seque a prancha à sombra antes de esvaziar e guardar. Enxaguar regularmente prolonga consideravelmente a vida útil da sua prancha inflável.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'Eu realmente preciso de um leash para o SUP?'
  answer: 'Sim — sempre use um leash. Um leash em espiral para SUP prende no tornozelo ou na panturrilha e mantém a prancha com você em caso de queda. Em águas abertas, um leash pode salvar sua vida ao evitar a separação do seu dispositivo de flutuação. Para remar em rios, use um leash com liberação rápida para evitar aprisionamento.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: 'O que é a tecnologia de núcleo drop-stitch e por que ela importa?'
  answer: 'A tecnologia de núcleo drop-stitch usa milhares de fios de poliéster que conectam as camadas superior e inferior de uma prancha de PVC. Quando inflada a 15-20 PSI, esses fios criam uma estrutura rígida e resistente à torção que se comporta como uma prancha de casco rígido. A afarer usa PVC de grau militar de tripla camada com laminação drop-stitch em todas as linhas de SUP, entregando rigidez comparável às pranchas de epóxi mantendo a portabilidade de um inflável.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup
- id: sup-inflatable-vs-rigid
  question: 'SUP inflável versus rígido: qual é melhor para cada uso?'
  answer: 'SUPs infláveis se destacam em portabilidade, armazenamento e absorção de impactos — ideais para viagens, iniciantes e uso recreativo. Pranchas rígidas de epóxi oferecem velocidade e deslizamento máximos para corrida e surf. Para 90% dos remadores, um inflável de qualidade com núcleo drop-stitch (15-20 PSI) oferece rigidez suficiente para touring, fitness, yoga e pesca. As pranchas infláveis da afarer igualam o desempenho de pranchas rígidas de linha média e ainda cabem em uma mochila.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-vs-hard-board
    - how-to-choose-inflatable-sup
- id: pvc-vs-hypalon-boats
  question: 'Barcos infláveis de PVC versus Hypalon: qual material é melhor?'
  answer: 'O PVC é mais leve, mais acessível, mais fácil de reparar e resiste à degradação UV quando usa formulações de grau militar. O Hypalon (CSM) oferece resistência química e à abrasão superior para uso comercial/militar, mas é mais pesado, mais caro e mais difícil de reparar. Para velejadores recreativos, o PVC de grau militar de tripla camada da afarer com revestimento resistente a UV oferece o melhor equilíbrio de peso, durabilidade e custo. Para operadores profissionais/comerciais que exigem durabilidade máxima, o Hypalon é recomendado.'
  category: product
  relatedProducts: []
  relatedGuides:
    - pvc-vs-hypalon-boats
    - how-long-inflatable-boats-last
- id: sup-skill-progression
  question: 'Qual é a progressão típica de habilidades no SUP, de iniciante a avançado?'
  answer: 'Iniciante (sessões 1-3): ficar de pé, remada básica para frente, virar, cair com segurança. Intermediário (sessões 5-15): técnica de remada eficiente, viradas pivot, navegação em mar agitado, habilidades básicas de resgate. Avançado (mais de 20 sessões): largadas de corrida, viradas em boias, surf em ondas pequenas, remada downwind. Profissional: corridas competitivas, surf SUP, touring de longa distância. As pranchas da afarer acompanham cada estágio: a Explorer 11 para iniciantes, a Ocean Voyager para touring e a Cheetah Surge para remada de alto desempenho.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-cheetah-surge
  relatedGuides:
    - beginner-sup-guide
    - sup-fitness-workout
    - sup-paddle-guide
- id: sup-weight-capacity
  question: 'Quanto peso uma prancha SUP inflável suporta?'
  answer: 'A capacidade de peso varia conforme o volume da prancha. Pranchas da afarer: SUP Explorer 11 (260 L, até 100 kg / 220 libras), Ocean Voyager 12 (310 L, até 140 kg / 308 libras), Leviathan Wake (350 L, até 180 kg / 396 libras). Para o desempenho ideal, mantenha a carga total (praticante + equipamento) dentro de 80% da capacidade máxima. A prancha flutua mais alta e mantém melhor a direção sem sobrecarga, especialmente em condições agitadas.'
  category: product
  relatedProducts:

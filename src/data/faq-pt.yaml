    - paddle-board-size-guide
- id: sup-oem-process
  question: 'Qual é o processo de fabricação OEM para SUPs infláveis de marca própria?'
  answer: 'O processo OEM: 1) Especificações e briefing de design — compartilhe specs-alvo, desenhos CAD ou um produto de referência. 2) Prototipagem com moldes 3D — moldes personalizados de alumínio e compósito projetados internamente. 3) Seleção de materiais e amostra — PVC de grau militar ou Hypalon com cores personalizadas e posicionamento do logotipo. 4) Auditoria de fábrica CE e conformidade — todo pedido inclui declaração CE, rastreabilidade ISO 9001, relatório BSCI. 5) Produção em série com checklist de QC de 100 pontos. 6) Embarque FOB Qingdao com documentação completa de exportação. Prazo de 30-45 dias, MOQ de 50 unidades (SUP padrão).'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflatable-durability
  question: 'Quanto tempo duram as pranchas SUP infláveis com os devidos cuidados?'
  answer: 'Com os devidos cuidados, uma prancha SUP inflável de qualidade dura 5-10 anos de uso recreativo regular. O PVC de grau militar de tripla camada com revestimento resistente a UV — como o usado em todas as pranchas da afarer — resiste a danos do sol, corrosão da água salgada e abrasão. Fatores-chave de longevidade: enxaguar com água doce após cada uso, secar bem antes de guardar, manter longe do UV direto quando não estiver em uso, guardar parcialmente inflada em local fresco e seco e evitar arrastar em superfícies rugosas. Os fios drop-stitch e as costuras são tipicamente o primeiro ponto de falha, não o tecido de PVC em si.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-maintenance
    - inflatable-sup-storage
    - inflatable-sup-repair
- id: sup-choppy-water
  question: 'Como rema em um SUP em água agitada ou com vento?'
  answer: 'Na água agitada: dobre os joelhos, use uma base mais larga, encurte a remada e acione o core para o equilíbrio. Contra o vento: use um ângulo de remo mais baixo, remadas mais curtas e incline-se para a frente. Com vento lateral: reme no lado contra o vento para corrigir o desvio. Com vento a favor: surfe as ondulações para ganhar velocidade. Iniciantes devem evitar ventos acima de 10 mph e escolher pranchas mais largas e longas para estabilidade. O SUP de touring afarer Ocean Voyager é projetado para lidar com mar agitado e ventos moderados.'
  category: safety
  relatedProducts:
    - sup-ocean-voyager
    - sup-explorer-11
  relatedGuides:
    - weather-conditions
    - sup-safety-guide
    - wind-conditions-sup
- id: sup-sustainability
  question: 'As pranchas SUP infláveis são sustentáveis para o meio ambiente?'
  answer: 'SUPs infláveis têm uma pegada ambiental menor que pranchas rígidas em vários aspectos: usam menos matéria-prima na produção, o peso menor reduz as emissões de transporte e a durabilidade significa menos substituições ao longo do tempo. O PVC usado nas pranchas da afarer é livre de chumbo e em conformidade com o REACH. Práticas-chave de sustentabilidade: compre uma prancha de qualidade que dure 5-10 anos, repare furos em vez de substituir, recicle a prancha no fim da vida por meio de programas especializados de reciclagem de PVC e evite embalagens de uso único escolhendo marcas que usam bolsas reutilizáveis.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: 'Qual é a quantidade mínima de pedido para a produção OEM/ODM de SUP?'
  answer: 'As quantidades mínimas de pedido (MOQ) variam conforme o tipo de produto. Personalização de marca em modelos de catálogo: 50 unidades por SKU. Desenvolvimento de molde com forma personalizada: 200–500 unidades por modelo (primeiro pedido). Programas de compartilhamento de molde a partir de 50 unidades. Produção de barcos Hypalon: 20–50 unidades dependendo do tamanho. Acessórios e PFDs: 500–1000 unidades por design. Fale com nossa equipe OEM com seu volume previsto para MOQ e preços precisos.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Quais são os prazos típicos para pedidos OEM de SUP?'
  answer: 'Primeiros pedidos OEM com personalização de marca em moldes existentes: 6–8 semanas do depósito ao FOB Qingdao. Pedidos com forma personalizada exigindo novos moldes: 12–20 semanas (incluem design 3D, fabricação de moldes, prototipagem e produção em série). Pedidos repetidos com especificações aprovadas: 6–8 semanas. Pedidos urgentes podem ser acelerados para 4–5 semanas em moldes existentes. Os prazos incluem suprimento de matéria-prima, produção, QC em linha e carregamento de contêiner.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Quais certificações os produtos OEM da afarer possuem?'
  answer: 'Todos os produtos OEM/ODM da afarer possuem: declaração de conformidade CE (mercado da UE), UKCA (mercado do Reino Unido), sistema de gestão de qualidade ISO 9001:2015, auditoria de conformidade social BSCI, conformidade de materiais REACH e RoHS, classificação EN ISO 25649 para barcos infláveis. Certificações adicionais sob solicitação: documentação de conformidade US Coast Guard, testes por padrões militares (MIL-STD-810) e suporte à certificação de importação do país de destino.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Posso pedir amostras antes de fechar a produção em série?'
  answer: 'Sim. Pedidos de amostra estão disponíveis para todos os projetos OEM/ODM. Amostras de pré-produção (PPS) são produzidas após a fabricação dos moldes e antes da produção em série. Prazo das amostras: 15–25 dias úteis para moldes existentes, 25–40 dias úteis para moldes personalizados. Os custos das amostras são dedutíveis do primeiro pedido em série. As amostras são enviadas por transportadora expressa (DHL, FedEx, UPS) com rastreamento completo e normalmente chegam em 3–5 dias úteis.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'Quais são as condições de pagamento disponíveis para pedidos OEM?'
  answer: 'Condições de pagamento padrão: 30% de depósito com PI assinada (fatura proforma), 70% de saldo antes do embarque contra cópia do B/L (conhecimento de embarque). Para novos parceiros: 50% de depósito, 50% antes do embarque. Para parceiros consolidados com histórico de pedidos: L/C à vista ou net 30 dias para contas qualificadas (sujeito a análise de crédito). Métodos de pagamento: transferência T/T, L/C (letter of credit), Western Union. Todos os pagamentos em USD ou EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Como a afarer protege minha propriedade intelectual e meus designs?'
  answer: 'A proteção de PI é uma parte central do nosso serviço OEM. Assinamos NDAs antes de qualquer discussão de design. Os arquivos de design são tratados em estações de trabalho isoladas com registro de acesso. Todas as ferramentas e moldes permanecem de sua propriedade exclusiva (pagos por você). Não reutilizaremos seus moldes ou designs para outros clientes. Armazenamento e manutenção dos moldes estão incluídos para contas ativas. No encerramento do acordo, os moldes são enviados a você ou destruídos com documentação em vídeo. Respeitamos todos os direitos de marca e patente.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Quais opções de envio e logística estão disponíveis?'
  answer: 'FOB Qingdao (padrão): a carga é embarcada no porto de Qingdao; você organiza o frete a partir de lá. CIF (porto designado): organizamos e seguramos o transporte até o seu porto de destino. DDP / porta a porta: logística completa incluindo desembaraço aduaneiro e entrega final. Frete marítimo para a costa oeste dos EUA: aproximadamente 25–30 dias. Frete marítimo para a UE (Hamburgo/Roterdã): aproximadamente 30–35 dias. Frete aéreo disponível para pedidos urgentes (3–5 dias). Cuidamos de toda a documentação aduaneira de exportação, certificados de origem e listas de embalagem.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Quais processos de controle de qualidade se aplicam aos pedidos OEM?'
  answer: 'Todo pedido OEM segue um plano de QC documentado: 1) Inspeção de material de entrada — testes de lote no tecido de PVC para espessura, resistência à tração e resistência UV. 2) QC em processo — teste de resistência de solda a cada 50 unidades, teste de retenção de pressão a 1,25x o PSI nominal. 3) Inspeção final — inspeção visual e teste de pressão em 100% das pranchas. 4) Amostragem AQL — amostragem por lote conforme ISO 2859 com defeito crítico = aceitação 0. 5) Inspeção terceirizada — SGS, Bureau Veritas ou Intertek disponíveis a custo do comprador.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Vocês podem criar embalagens personalizadas para minha marca?'
  answer: 'Sim. Oferecemos serviço completo de embalagem personalizada: caixas de varejo com impressão CMYK em cores totais e arte da marca, bolsas com logotipos silkados ou bordados, manuais de instruções no seu idioma, tags e etiquetas de código de barras/UPC e embalagem interna (sacos, calços de espuma). MOQ mínima de embalagem: 500–1000 unidades para caixas personalizadas, 200–500 para bolsas. O serviço de design de embalagem está incluído nos pedidos OEM.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Posso visitar a fábrica ou organizar uma auditoria terceirizada?'
  answer: 'Visitas à fábrica são bem-vindas mediante agendamento. Recebemos proprietários de marcas o ano todo e podemos organizar traslado no Qingdao Jiaodong International Airport (TAO). Para compradores que não podem visitar, oferecemos: tour virtual da fábrica por videochamada, coordenação de auditoria terceirizada com SGS/Bureau Veritas (custo por conta do comprador) e pacote documental detalhado de capacidades da fábrica com lista de equipamentos, fluxo do processo de QC e qualificações do pessoal.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

    - paddle-board-size-guide
- id: sup-oem-process
  question: 'מהו תהליך הייצור של OEM עבור גלשני SUP מתנפחים במיתוג פרטי?'
  answer: 'תהליך ה-OEM: 1) מפרט ותדריך עיצוב — שיתוף מפרטי יעד, שרטוטי CAD או מוצר ייחוס. 2) יצירת אב-טיפוס של תבנית תלת-ממדית — תבניות אלומיניום וחומרים מרוכבים מותאמות המתוכננות בתוך החברה. 3) בחירת חומרים ודגימה — PVC בדרגה צבאית עם צבעים מותאמים ומיקום לוגו. 4) ביקורת מפעל ותאימות CE — כל הזמנה כוללת הצהרת CE, עקיבות ISO 9001 ודוח BSCI. 5) ייצור סדרתי עם רשימת בדיקות QC בת 100 נקודות. 6) משלוח FOB Qingdao עם מלוא תיעוד הייצוא. זמן אספקה 30-45 ימים, כמות הזמנה מינימלית 50 יחידות (SUP סטנדרטי).'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflatable-durability
  question: 'כמה זמן מחזיקים גלשני SUP מתנפחים בטיפול נאות?'
  answer: 'בטיפול נאות, גלשן SUP מתנפח איכותי מחזיק 5-10 שנים של שימוש פנאי סדיר. PVC תלת-שכבתי בדרגה צבאית עם ציפוי עמיד לקרינת UV — כמו בכל גלשני afarer — עמיד בפני נזקי שמש, קורוזיה של מי ים ושחיקה. גורמי אורך חיים מרכזיים: שטיפה במים מתוקים לאחר כל שימוש, ייבוש יסודי לפני האחסון, הרחקה מקרינת UV ישירה כשאינו בשימוש, אחסון מנופח חלקית במקום קריר ויבש, והימנעות מגרירה על משטחים מחוספסים. חוטי ה-drop-stitch והתפרים הם בדרך כלל נקודת הכשל הראשונה, ולא בד ה-PVC עצמו.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-maintenance
    - inflatable-sup-storage
    - inflatable-sup-repair
- id: sup-choppy-water
  question: 'כיצד חותרים בגלשן SUP במים גליים או ברוח?'
  answer: 'במים גליים: כופפו את הברכיים, אמצו עמידה רחבה יותר, קצרו את תנועת החתירה והפעילו את שרירי הליבה לאיזון. ברוח נגדית: השתמשו בזווית משוט נמוכה יותר, בצעו תנועות חתירה קצרות יותר והטו את הגוף קדימה. ברוח צד: חתרו בצד הפונה נגד הרוח כדי לתקן סחיפה. ברוח גבית: גלשו על הגלים להשגת מהירות. מתחילים צריכים להימנע מרוחות העולות על 10 מיילים לשעה ולבחור גלשנים רחבים וארוכים יותר ליציבות. גלשן הטיולים Ocean Voyager של afarer תוכנן להתמודדות עם גלים ורוחות בינוניים.'
  category: safety
  relatedProducts:
    - sup-ocean-voyager
    - sup-explorer-11
  relatedGuides:
    - weather-conditions
    - sup-safety-guide
    - wind-conditions-sup
- id: sup-sustainability
  question: 'האם גלשני SUP מתנפחים הם בני קיימא מבחינה סביבתית?'
  answer: 'לגלשני SUP מתנפחים טביעת רגל סביבתית נמוכה יותר משל גלשנים קשיחים בכמה אופנים: הם עושים שימוש בפחות חומרי גלם בייצור, משקלם הקל יותר מפחית פליטות במשלוח, ועמידותם משמעה פחות החלפות לאורך זמן. ה-PVC המשמש בגלשני afarer נקי מעופרת ועומד בתקנות REACH. שיטות קיימות מרכזיות: רכשו גלשן איכותי המחזיק 5-10 שנים, תקנו נקבים במקום להחליף, מחזרו את הגלשן בסוף חייו באמצעות תוכניות מיחזור PVC מתמחות, והימנעו מאריזות חד-פעמיות על ידי בחירה במותגים המשתמשים בתיקי נשיאה הניתנים לשימוש חוזר.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: 'מהי כמות ההזמנה המינימלית לייצור SUP במסגרת OEM/ODM?'
  answer: 'כמויות הזמנה מינימליות (MOQ) משתנות לפי סוג המוצר. מיתוג מותאם על דגמי מלאי: 50 יחידות לכל SKU. פיתוח תבנית בצורה מותאמת: 200–500 יחידות לכל דגם (הזמנה ראשונה). תוכניות שיתוף תבניות זמינות החל מ-50 יחידות. אביזרים ואפודי הצלה: 500–1000 יחידות לכל עיצוב. פנו לצוות ה-OEM שלנו עם היקף ההזמנות הצפוי שלכם לקבלת MOQ ותמחור מדויקים.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'מהם זמני האספקה הטיפוסיים להזמנות OEM של SUP?'
  answer: 'הזמנות OEM ראשונות עם מיתוג מותאם על תבניות קיימות: 6–8 שבועות מהמקדמה ועד FOB Qingdao. הזמנות בצורה מותאמת הדורשות תבניות חדשות: 12–20 שבועות (כולל עיצוב תלת-ממדי, ייצור תבניות, אב-טיפוס וייצור סדרתי). הזמנות חוזרות עם מפרטים מאושרים: 6–8 שבועות. ניתן לזרז הזמנות דחופות ל-4–5 שבועות עבור תבניות קיימות. זמני האספקה כוללים רכש חומרי גלם, ייצור, בקרת איכות בתהליך וטעינה למכולות.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'אילו הסמכות נושאים מוצרי ה-OEM של afarer?'
  answer: 'כל מוצרי ה-OEM/ODM של afarer נושאים: הצהרת התאמה CE (שוק האיחוד האירופי), UKCA (השוק הבריטי), מערכת ניהול איכות ISO 9001:2015, ביקורת תאימות חברתית BSCI, תאימות חומרים REACH ו-RoHS, וסיווג EN ISO 25649 לגלשני SUP מתנפחים. הסמכות נוספות זמינות לפי בקשה: תיעוד תאימות למשמר החופים של ארצות הברית, בדיקות לתקן צבאי (MIL-STD-810), ותמיכה בהסמכת ייבוא במדינת היעד.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'האם ניתן להזמין דגימות לפני התחייבות לייצור סדרתי?'
  answer: 'כן. הזמנות דגימה זמינות לכל פרויקטי OEM/ODM. דגימות קדם-ייצור (PPS) מיוצרות לאחר ייצור התבנית ולפני הייצור הסדרתי. זמן אספקת דגימה: 15–25 ימי עבודה לתבניות קיימות, 25–40 ימי עבודה לתבניות מותאמות. עלות הדגימות ניתנת לניכוי מההזמנה הסדרתית הראשונה. הדגימות נשלחות באמצעות שליח אקספרס (DHL, FedEx, UPS) עם מעקב מלא ומגיעות בדרך כלל תוך 3–5 ימי עסקים.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'אילו תנאי תשלום זמינים להזמנות OEM?'
  answer: 'תנאי תשלום סטנדרטיים: מקדמה של 30% עם חשבונית עסקה (PI) חתומה, ויתרה של 70% לפני המשלוח מול עותק של שטר המטען (B/L). עבור שותפים חדשים: מקדמה של 50%, 50% לפני המשלוח. עבור שותפים ותיקים עם היסטוריית הזמנות: L/C למראה, או תשלום בתוך 30 יום נטו לחשבונות מתאימים (בכפוף לבדיקת אשראי). אמצעי תשלום: העברה בנקאית T/T, L/C (מכתב אשראי), Western Union. כל התשלומים ב-USD או ב-EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'כיצד afarer מגינה על הקניין הרוחני והעיצובים שלי?'
  answer: 'הגנת קניין רוחני היא חלק מרכזי בשירות ה-OEM שלנו. אנו חותמים על הסכמי סודיות לפני כל דיון בעיצוב. קובצי עיצוב מטופלים בתחנות עבודה מבודדות עם רישום גישות. כל הציוד והתבניות נותרים רכושכם הבלעדי (במימונכם). לא ייעשה שימוש חוזר בתבניות או בעיצובים שלכם עבור לקוחות אחרים. אחסון ותחזוקת תבניות כלולים עבור חשבונות פעילים. עם סיום ההסכם, התבניות יישלחו אליכם או יושמדו עם תיעוד בווידאו. אנו מכבדים את כל זכויות הסימנים המסחריים והפטנטים.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'אילו אפשרויות משלוח ולוגיסטיקה זמינות?'
  answer: 'FOB Qingdao (סטנדרטי): המטען נטען בנמל צ׳ינגדאו; אתם מסדרים את ההובלה משם. CIF (נמל מוסכם): אנו מסדרים ומבטחים את המשלוח אל נמל היעד שלכם. DDP / משלוח עד הדלת: לוגיסטיקה מלאה כולל שחרור ממכס ומסירה סופית. הובלה ימית לחוף המערבי של ארצות הברית: כ-25–30 יום. הובלה ימית לאיחוד האירופי (המבורג/רוטרדם): כ-30–35 יום. הובלה אווירית זמינה להזמנות דחופות (3–5 ימים). אנו מטפלים בכל תיעוד המכס לייצוא, בתעודות המקור וברשימות האריזה.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'אילו תהליכי בקרת איכות חלים על הזמנות OEM?'
  answer: 'כל הזמנת OEM מלווה בתוכנית QC מתועדת: 1) בדיקת חומרים נכנסים — בדיקות אצווה של בד PVC לעובי, חוזק מתיחה ועמידות לקרינת UV. 2) בקרת איכות בתהליך — בדיקת חוזק ריתוך התפרים כל 50 יחידות, בדיקת החזקת לחץ ב-1.25x מה-PSI המדורג. 3) בדיקה סופית — בדיקה חזותית ובדיקת לחץ של כל גלשן וגלשן. 4) דגימת AQL — דגימת אצווה לפי ISO 2859 עם קבלה של 0 ליקויים קריטיים. 5) בדיקת צד שלישי — SGS, Bureau Veritas או Intertek זמינות בעלות הקונה.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'האם תוכלו ליצור אריזות מותאמות אישית עבור המותג שלי?'
  answer: 'כן. אנו מציעים שירותי אריזה מותאמת אישית מלאים: קופסאות קמעונאיות עם הדפסת CMYK בצבע מלא וגרפיקת מותג, תיקי נשיאה עם לוגואים מודפסים במסך או רקומים, מדריכי הוראות בשפה שלכם, תגיות תלייה וברקודים/תוויות UPC, ואריזה פנימית (שקיות פוליאתילן, מוספים מקצף). כמות הזמנה מינימלית לאריזה: 500–1000 יחידות לקופסאות מותאמות, 200–500 לתיקי נשיאה. שירות עיצוב אריזות כלול בהזמנות OEM.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'האם ניתן לבקר במפעל או לארגן ביקורת של צד שלישי?'
  answer: 'ביקורים במפעל מתקבלים בברכה בתיאום מראש. אנו מארחים בעלי מותגים לכל אורך השנה ויכולים לארגן איסוף מנמל התעופה הבינלאומי צ׳ינגדאו ג׳יאודונג (TAO). עבור קונים שאינם יכולים לבקר, אנו מציעים: סיור וירטואלי במפעל באמצעות שיחת וידאו, תיאום ביקורת צד שלישי עם SGS/Bureau Veritas (הקונה מכסה את עלות הביקורת), וחבילת תיעוד מפורטת של יכולות המפעל הכוללת רשימת ציוד, תהליך QC וכישורי צוות.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

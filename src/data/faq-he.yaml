- id: sup-deck-pad-care
  question: 'כיצד מנקים ומתחזקים את שכבת הסיפון מחומר EVA?'
  answer: 'שטפו את שכבת הסיפון במים מתוקים לאחר כל אימון. עבור לכלוך או כתמים, השתמשו בסבון עדין ובמברשת רכה — הימנעו מכימיקלים חזקים. אם הקצוות מתחילים להתקלף, מרחו כמות קטנה של דבק ימי עמיד למים ולחצו תחת משקל במשך 24 שעות. הרחיקו את הגלשן מקרינת UV ישירה כשאינו בשימוש, כדי למנוע התדרדרות השכבה.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'האם ניתן לחתור בגלשן ה-SUP בישיבה?'
  answer: 'כן. לגלשני SUP רבים, לרבות ה-Explorer 11 של afarer, יש טבעות D המאפשרות התקנת מושב. חתירה בישיבה מציעה אפשרות נוחה לטיולים ארוכים יותר, לדיג, או כשרוצים להחליף תנוחה במים.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: 'האם עליי לשטוף את הגלשן המתנפח לאחר שימוש בים?'
  answer: 'כן — תמיד שטפו את הגלשן, הסנפירים, המשאבה והמשוט במים מתוקים לאחר שימוש במי ים. גבישי מלח חודרים לתפרים ולשסתומים וגורמים לדליפות מיקרוסקופיות ולקורוזיה. יבשו את הגלשן בצל לפני ריקון האוויר והאחסון. שטיפה סדירה מאריכה באופן משמעותי את חיי הגלשן המתנפח שלכם.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'האם באמת נדרשת רצועה ל-SUP?'
  answer: 'כן — תמיד ענדו רצועה. רצועת SUP קפיצית מתחברת לקרסול או לשוק שלכם ושומרת על הגלשן לצדכם אם תיפלו. במים פתוחים, רצועה עשויה להציל את חייכם בכך שהיא מונעת היפרדות מאמצעי הציפה שלכם. לחתירה בנהר, השתמשו ברצועה עם שחרור מהיר כדי למנוע היתפסות.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:

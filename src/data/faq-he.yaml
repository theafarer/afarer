  answer: 'מים בטמפרטורה של פחות מ-15°C מחייבים הגנה תרמית. לטמפרטורות של 8–14°C השתמשו בחליפת גלישה או בחליפה יבשה עם מגפיים, כפפות וברדס. לטמפרטורות של 14–20°C די בחליפת גלישה בעובי 3/2 מ״מ. תמיד ענדו אפוד הצלה מותאם היטב להגנה תרמית ולבטיחות. בדקו את התקנות המקומיות לגבי דרישות ציוד חובה.'

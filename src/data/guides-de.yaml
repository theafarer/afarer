- slug: sup-weight-capacity
  category: buying-guide
  title: Guide zur SUP-Gewichtsbelastbarkeit — Wie viel Gewicht kann ein SUP tragen?
  description: Verstehen Sie die Gewichtsbelastbarkeitsgrenzen von SUPs, wie Sie Ihre Gesamtlast berechnen und warum das Überschreiten des Limits Performance und Sicherheit beeinträchtigt.
  tldr: Überschreiten Sie niemals 80 % der maximalen Gewichtsbelastbarkeit des Boards mit Ihrem Körpergewicht plus Ausrüstung. Ein Board mit 220 lb Belastbarkeit eignet sich für einen 160-lb-Paddler mit leichter Ausrüstung. Das Überschreiten des Limits verursacht wippende Auf-und-ab-Bewegungen, träge Fahreigenschaften und ein erhöhtes Schadensrisiko.
  problem: Paddler überschreiten oft die Gewichtsbelastbarkeit ihres Boards, was zu schlechter Performance, Untertauchen und möglichen Boardschäden führt. Hersteller geben Maximalwerte an, erklären aber keine sicheren Arbeitslasten.
  solution: Berechnen Sie Ihre Gesamtlast (Körpergewicht + Ausrüstung + vom Board aufgenommenes Wasser) und bleiben Sie unter 80 % der angegebenen maximalen Belastbarkeit. Schwerere Paddler benötigen Boards mit größerem Volumen und einer Belastbarkeit von 300+ lb.
  audience: Paddler aller Größen, insbesondere schwerere Paddler und alle, die Expeditionsausrüstung mitführen.
  steps:
    - Finden Sie die maximale Gewichtsbelastbarkeit, die auf Ihrem Board aufgedruckt ist (meist in der Nähe des Ventils)
    - Wiegen Sie sich und Ihre gesamte Ausrüstung, einschließlich Paddel, Rettungsweste, Trockensäcke, Kühlbox und Zubehör
    - 'Berechnung: (Ihre Gesamtlast) ÷ (maximale Belastbarkeit) × 100 = % der ausgenutzten Belastbarkeit'
    - Peilen Sie 70-80 % für optimale Performance und Sicherheit an
    - Wenn Sie 80 % überschreiten, wählen Sie ein größeres Board oder reduzieren Sie die Ausrüstung
  faq:
    - q: Was passiert, wenn ich das Gewichtslimit überschreite?
      a: Das Board liegt tiefer im Wasser und erzeugt mehr Widerstand. Die Stabilität nimmt ab, der Bug kann untertauchen, und der Drop-Stitch-Kern ist in kabbeliger See stärker gefährdet.
    - q: Können zwei Personen mit einem SUP fahren?
      a: Nur wenn das Gesamtgewicht unter 80 % der Belastbarkeit bleibt. Die meisten Standard-SUPs sind für einzelne Paddler ausgelegt. Tandemfahren erfordert ein Board, das ausdrücklich für zwei Personen ausgelegt ist.
    - q: Haben aufblasbare SUPs eine geringere Belastbarkeit als Hardboards?
      a: Hochwertige aufblasbare Boards mit Drop-Stitch-Konstruktion haben aufgrund ihrer dickeren Volumenverteilung eine mit Hardboards vergleichbare oder höhere Gewichtsbelastbarkeit.

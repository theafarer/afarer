- slug: sup-storage-winter-care
  category: maintenance
  title: SUP-Aufbewahrung und Winterpflege — Verlängern Sie die Lebensdauer Ihres Boards
  description: So bewahren Sie Ihr aufblasbares SUP Board richtig auf, reinigen es und machen es winterfest. Vermeiden Sie Schimmel, UV-Schäden und Materialverschlechterung durch die richtige Pflege.
  tldr: Spülen Sie das Board nach jeder Nutzung mit Süßwasser ab. Trocknen Sie es vor der Aufbewahrung vollständig. Lassen Sie die Luft ab und bewahren Sie es an einem kühlen, dunklen Ort ohne direkte Sonneneinstrahlung und extreme Temperaturen auf. Bewahren Sie es niemals aufgeblasen oder im heißen Auto auf. Tragen Sie regelmäßig UV-Schutzmittel auf.
  problem: Unsachgemäße Aufbewahrung ist die häufigste Ursache für vorzeitige SUP-Defekte — Schimmel, Materialzersetzung, Delamination und Ventilschäden durch Hitze oder Kälte.
  solution: 'Befolgen Sie eine 3-stufige Pflegeroutine: nach jeder Einheit abspülen, vor der Aufbewahrung gründlich trocknen und luftleer in einer temperierten Umgebung zwischen 50-80 °F (10-27 °C) aufbewahren.'
  audience: Alle SUP-Besitzer, die möchten, dass ihr Board 5+ Jahre hält.
  steps:
    - Spülen Sie Board, Paddel und Pumpe nach jeder Einheit in Salz- oder Schlammwasser mit Süßwasser ab
    - Reinigen Sie das Board mit milder Seife und einem weichen Schwamm — niemals mit scharfen Chemikalien oder einem Hochdruckreiniger
    - Trocknen Sie das Board vor dem Luftablassen vollständig im Freien (öffnen Sie das Ventil, damit Feuchtigkeit aus dem Inneren entweichen kann)
    - Lassen Sie die Luft vollständig ab und rollen Sie das Board vom Bug zum Heck, um die restliche Luft herauszudrücken
    - Wischen Sie den Rucksack trocken, bevor Sie das Board hineinlegen
    - Bewahren Sie das Board in einem kühlen, dunklen Schrank oder unter dem Bett auf — niemals in direkter Sonne, im heißen Auto oder in einer frostigen Laube
  faq:
    - q: Kann ich mein SUP die ganze Saison aufgeblasen lassen?
      a: Es ist besser, die Luft abzulassen, wenn das Board über längere Zeit nicht genutzt wird. Die ständige PSI-Belastung beschleunigt die Materialermüdung. Lassen Sie die Luft zwischen den Einheiten ab, wenn Sie das Board länger als 2 Wochen aufbewahren.
    - q: Wie entferne ich Schimmel von meinem SUP?
      a: Mischen Sie milde Seife mit warmem Wasser und einem Schuss weißem Essig. Schrubben Sie vorsichtig mit einer weichen Bürste. Spülen Sie gründlich nach und trocknen Sie das Board im Schatten. Vermeiden Sie Bleichmittel, da es PVC beschädigt.
    - q: Kann ich mein SUP in einer Garage aufbewahren?
      a: Nur wenn die Garage ganzjährig zwischen 50-80 °F bleibt. Dachböden und Garagen ohne Klimatisierung sind extremen Temperaturschwankungen ausgesetzt, die Drop-Stitch-Kerne beschädigen.

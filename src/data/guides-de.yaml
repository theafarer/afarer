- slug: weather-conditions
  category: safety
  title: Wetterbedingungen fürs Stand-Up-Paddling verstehen
  description: Lernen Sie, Wind, Wellen, Gezeiten und Wettermuster zu lesen, um auf dem Wasser sichere Entscheidungen zu treffen.
  tldr: 'Prüfen Sie vor jedem Start drei Dinge: die Windgeschwindigkeit (unter 10 mph für Einsteiger), die Wellenhöhe (unter 1 Fuß für Einsteiger) und die Wassertemperatur (kleiden Sie sich nach dem Wasser, nicht nach der Luft). Ablandiger Wind ist auf jedem Niveau gefährlich.'
  problem: Die meisten witterungsbedingten Unfälle passieren, weil Paddler die Bedingungen falsch einschätzen – sie prüfen die Lufttemperatur, aber nicht die Wassertemperatur, oder ihnen ist nicht klar, dass ablandiger Wind sie aufs Meer hinaustreiben kann.
  solution: 'Nutzen Sie eine strukturierte Wetterbewertung vor dem Start: Windrichtung und Windgeschwindigkeit, Wellenperiode und Wellenhöhe, Gezeitenstand und Wassertemperatur. Verstehen Sie, wie jeder Faktor Ihre Sicherheit beeinflusst.'
  audience: Alle Paddler, die auf offenes Wasser gehen – Seen, Buchten, Flüsse und Ozean.
  steps:
    - Prüfen Sie Windgeschwindigkeit und Windrichtung – ablandiger Wind (von Land Richtung See) ist am gefährlichsten
    - Bewerten Sie die Wellenbedingungen – die Wellenperiode ist genauso wichtig wie die Wellenhöhe
    - Kennen Sie die Gezeiten – Gezeitenströmungen können stärker sein als Ihre Paddelgeschwindigkeit
    - Messen Sie die Wassertemperatur – unter 60 °F/15 °C ist Thermoschutz erforderlich
    - Prüfen Sie die Sichtverhältnisse – Nebel und Starkregen reduzieren die Sicht und erhöhen das Kollisionsrisiko
    - Kennen Sie die lokalen Gefahren – unter Wasser liegende Felsen, starke Strömungen, Zonen mit Bootsverkehr
  faq:
    - q: Ab welcher Windgeschwindigkeit ist es fürs SUP zu windig?
      a: 'Einsteiger: über 10 mph (8 Knoten). Fortgeschrittene: über 15 mph (13 Knoten). Könner: über 20 mph (17 Knoten). Im Zweifel: Gehen Sie nicht raus.'
    - q: Was bedeutet Wellenperiode?
      a: Die Wellenperiode ist die Zeit zwischen aufeinanderfolgenden Wellen. Kurze Perioden (unter 8 Sekunden) bedeuten steile, kabbelige Wellen. Lange Perioden (über 12 Sekunden) bedeuten glattere, besser vorhersehbare Dünungen.
    - q: Kann ich bei Regen paddeln?
      a: Leichter Regen ist meist ungefährlich. Starkregen reduziert die Sicht und kann auf wechselnde Windbedingungen hindeuten. Bei Gewittern müssen Sie das Wasser sofort verlassen.

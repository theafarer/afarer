- slug: paddling-techniques
  category: tutorial
  title: Grundlegende Paddeltechniken fürs SUP
  description: Meistern Sie den Vorwärtsschlag, den Bogenschlag und die Kreuzbug-Wende, um unter allen Bedingungen effizient zu paddeln.
  tldr: Der Vorwärtsschlag nutzt Ihre Körpermitte, nicht Ihre Arme. Der Bogenschlag dreht das Board. Die Kreuzbug-Wende ist die effizienteste Drehung. Halten Sie das Paddel senkrecht und tauchen Sie das Paddelblatt vollständig ein, um die Kraft maximal zu übertragen.
  problem: Die meisten Paddler nutzen armdominierte Züge, die Energie verschwenden und zu Schultermüdigkeit führen. Eine schlechte Technik macht das Board außerdem bei Wind und Kabbelwasser schwer kontrollierbar.
  solution: Lernen Sie drei wesentliche Schläge – Vorwärtsschlag, Bogenschlag und Kreuzbug-Wende – mit sauberer Körpermechanik. Üben Sie jeden Schlag zuerst auf ruhigem Wasser, bevor Sie zu anspruchsvollen Bedingungen übergehen.
  audience: Paddler, die länger, schneller und mit weniger Ermüdung paddeln wollen.
  steps:
    - 'Vorwärtsschlag: nach vorne greifen, das Paddelblatt vollständig eintauchen, mit Rumpfrotation (nicht mit den Armen) zurückziehen, auf Höhe des Knöchels aus dem Wasser nehmen'
    - 'Bogenschlag: vorne am Rails greifen, das Paddelblatt in einem weiten Bogen Richtung Heck schwenken, das Board von der Paddelseite wegdrehen'
    - 'Kreuzbug-Wende: das Paddel ohne Handwechsel auf die gegenüberliegende Seite des Boards setzen und Richtung Heck ziehen'
    - 'Stützschlag: nutzen Sie die tiefe Stütze für Stabilität in Kabbelwasser – schlagen Sie das Paddelblatt flach auf die Wasseroberfläche'
    - 'Ziehschlag: seitlich ausgreifen und das Board seitlich zum Paddel ziehen'
  faq:
    - q: Wie paddle ich eine gerade Linie?
      a: Nutzen Sie auf beiden Seiten eine gleichbleibende Schlaglänge. Wechseln Sie alle 5-10 Schläge die Seite. Blicken Sie als Referenz auf einen festen Punkt am Horizont.
    - q: Sollte ich die Knie beugen?
      a: Ja. Halten Sie die Knie als Stoßdämpfer leicht gebeugt. Durchgestreckte Knie übertragen jede Welle auf Ihre Körpermitte und verringern die Stabilität.
    - q: Wie paddle ich gegen den Wind?
      a: Vertiefen Sie Ihren Stand, nutzen Sie kürzere, schnellere Schläge und bleiben Sie näher am Ufer, wo der Wind oft schwächer ist. Ist der Wind zu stark, gehen Sie nicht raus.

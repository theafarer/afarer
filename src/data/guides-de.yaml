- slug: sup-maintenance
  category: maintenance
  title: So reinigen und lagern Sie Ihr aufblasbares SUP
  description: Schritt-für-Schritt-Pflegeleitfaden, um die Lebensdauer Ihres aufblasbaren SUP Boards zu maximieren.
  tldr: Spülen Sie es nach jedem Einsatz mit Süßwasser ab, trocknen Sie es vor der Lagerung vollständig, lassen Sie die Luft ab und rollen Sie es locker (nicht militärisch straff), lagern Sie es an einem kühlen, trockenen Ort fern von direkter Sonneneinstrahlung und kontrollieren Sie monatlich die Nähte.
  problem: Unsachgemäße Lagerung und Reinigung sind die häufigsten Ursachen für vorzeitige Defekte bei aufblasbaren SUPs – Schimmel, UV-Schäden und Nahtablösung.
  solution: 'Folgen Sie einer konsistenten Routine nach jeder Session: abspülen, trocknen, prüfen, Luft ablassen und lagern. Nutzen Sie milde Seife gegen hartnäckigen Schmutz. Lagern Sie das Board niemals nass oder in direkter Sonneneinstrahlung.'
  audience: Alle Besitzer eines aufblasbaren SUPs, die möchten, dass ihr Board 5+ Jahre hält.
  steps:
    - Spülen Sie das Board unmittelbar nach dem Einsatz mit Süßwasser ab, besonders nach dem Einsatz im Salzwasser
    - Reinigen Sie es mit milder Seife und einem weichen Schwamm – vermeiden Sie aggressive Chemikalien oder Hochdruckreiniger
    - Trocknen Sie das Board vollständig – öffnen Sie das Ventil, damit eingeschlossenes Wasser entweichen kann
    - Prüfen Sie es auf Schäden – kontrollieren Sie Nähte, Ventil und Oberfläche auf Einstiche
    - Lassen Sie die Luft vollständig ab – entfernen Sie den Ventileinsatz für die vollständige Entlüftung
    - Rollen Sie das Board locker zusammen – beginnen Sie an der Spitze, vermeiden Sie enge Falten
    - Lagern Sie es in der Tragetasche an einem kühlen, trockenen Ort fern von direkter Sonneneinstrahlung
  faq:
    - q: Kann ich mein SUP die ganze Saison über aufgepumpt lassen?
      a: Ja, aber halten Sie es außerhalb der direkten Sonneneinstrahlung, wenn es nicht benutzt wird. Für eine längere Lagerung wird ein teilweises Ablassen des Luftdrucks (8-10 PSI) empfohlen.
    - q: Wie repariere ich einen Einstich?
      a: Reinigen Sie die Stelle, schneiden Sie einen Flicken mit abgerundeten Ecken zurecht, tragen Sie Kleber auf, drücken Sie kräftig an und warten Sie 24 Stunden, bevor Sie wieder aufpumpen. Zu afarer-Boards liegt ein Reparaturset bei.
    - q: Wie oft soll ich das Ventil prüfen?
      a: Monatlich. Das Ventil ist der häufigste Schwachpunkt. Prüfen Sie, dass sich der Ventilstift frei bewegt und der O-Ring intakt ist.

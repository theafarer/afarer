- slug: sup-size-guide
  category: buying-guide
  title: SUP-Größen-Guide — So wählen Sie die richtigen Boardmaße
  description: Vollständiger SUP-Größen-Guide mit Empfehlungen für Länge, Breite und Dicke, basierend auf Ihrem Gewicht, Ihrer Körpergröße, Ihrem Können und Ihrem Paddelstil.
  tldr: Anfänger benötigen breitere Boards (32-34") für Stabilität. Schwerere Paddler benötigen längere Boards (11'+) mit größerem Volumen. Tourenpaddeln erfordert längere Rümpfe (12'+). Yoga erfordert extra Breite (34"+). Prüfen Sie immer die Gewichtsbelastbarkeit — Ihr Gewicht plus Ausrüstung sollte 80 % des Limits nicht überschreiten.
  problem: Die falsche SUP-Größe führt zu schlechter Stabilität, träger Spurtreue und einem frustrierenden Paddelerlebnis. Die meisten Erstkäufer wählen ein Board nach dem Aussehen, ohne zu bedenken, wie die Maße die Performance beeinflussen.
  solution: 'Stimmen Sie Boardlänge, -breite und -dicke auf Ihr Gewicht, Ihr Können und Ihren hauptsächlichen Einsatz ab. Nutzen Sie unseren Größenrechner: Addieren Sie Ihr Gewicht + das Gewicht Ihrer Ausrüstung und wählen Sie ein Board mit mindestens 20 % Reserve über dieser Summe.'
  audience: SUP-Erstkäufer, Paddler, die auf ein spezialisiertes Board umsteigen, und alle, die bei der Größe unsicher sind.
  steps:
    - Wiegen Sie sich mit der gesamten Ausrüstung, die Sie mitführen (Paddel, Rettungsweste, Trockensack)
    - Addieren Sie 20 % Sicherheitsmarge, um die minimale Gewichtsbelastbarkeit zu ermitteln
    - 'Wählen Sie die Breite nach Können: 32-34" für Anfänger, 30-32" für Fortgeschrittene, 28-30" für Experten'
    - 'Wählen Sie die Länge nach Einsatz: 10''6"-11''6" Allround, 12''-14'' Touren, 9''-10'' Wildwasser'
    - 'Prüfen Sie die Dicke: 6" Standard, 4" für Performance, 5" für Allround'
    - Prüfen Sie den empfohlenen PSI-Bereich Ihres Boards für optimale Steifigkeit
  faq:
    - q: Welche SUP-Breite ist für Anfänger am besten?
      a: 32 bis 34 Zoll Breite bieten die stabilste Plattform. Je breiter das Board, desto leichter lässt sich die Balance halten — besonders für größere Paddler.
    - q: Woran erkenne ich, ob ein SUP für mich zu klein ist?
      a: Wenn das Board tief im Wasser liegt, träge reagiert oder der Bug beim Paddeln leicht untertaucht, ist es für Ihr Gewicht wahrscheinlich zu klein bemessen.
    - q: Beeinflusst die Boardlänge die Geschwindigkeit?
      a: Ja. Eine längere Wasserlinie erhöht die theoretische Rumpfgeschwindigkeit. Ein 14'-Tourenboard ist bei gleichem Paddelaufwand deutlich schneller als ein 10'-Allroundboard.

  trustDesc: Súlad s CE, ISO a BSCI
sup:
  title: Znalosti o SUP — Príručky a zdroje pre nafukovacie SUP | Afarer
  description: Kompletné centrum znalostí o SUP pokrývajúce príručky pre začiatočníkov, výber veľkosti dosiek, návody na techniky, tipy pre bezpečnosť a technológiu nafukovacích SUP.
  articles:
    - title: Základy SUP — Príručka pre začiatočníkov
      desc: Všetko, čo potrebuje začiatočník vedieť — typy dosiek, dĺžka pádla, postoj a tipy na prvý deň.
      href: /learn/sup
    - title: Návod na výber veľkosti SUP
      desc: Nájdite správnu dĺžku, šírku a objem dosky podľa vašej hmotnosti, zručností a štýlu pádlovania.
      href: /size-guide
    - title: Nafukovacia alebo pevná doska
      desc: Ktorá je tá pravá pre vás? Porovnanie prenositeľnosti, výkonu, odolnosti a ceny.
      href: /compare/inflatable-vs-hardboard
    - title: Stredne pokročilé techniky
      desc: Zlepšite svoje pádlovanie pomocou pokročilých ťahov pádlom, techník otáčania a zvládania rozbúrenej vody.
      href: /learn/intermediate-techniques
    - title: Ako vybrať nafukovacie SUP
      desc: Zorientujte sa v kľúčových faktoroch — konštrukcia, hrúbka, nastavenie plutiev a priložené príslušenstvo.
      href: /v2/how-to-choose-inflatable-sup
    - title: Bezpečnosť na vode
      desc: Základné bezpečnostné znalosti vrátane čítania počasia, výberu PFD, sebazáchrannej techniky a skupinového pádlovania.
      href: /learn/water-safety
water-safety:
  title: Znalosti o bezpečnosti na vode — Príručky bezpečného pádlovania | Afarer
  description: Komplexné zdroje o bezpečnosti na vode pre SUP, kajakovanie a plavbu loďou. Dozviete sa o výbere PFD, čítaní počasia, sebazáchrane, bezpečnosti v studenej vode a certifikácii CE.
  articles:
    - title: Príručka bezpečnosti na vode
      desc: Základné bezpečnostné znalosti pre každého pádlara — počasie, PFD, sebazáchrana a protokoly skupinového pádlovania.
      href: /learn/water-safety
    - title: Príručka záchranných viest a PFD
      desc: Ako vybrať správny osobný plávacií záchranný prostriedok pre SUP, kajakovanie, plavbu loďou a profesionálne použitie.
      href: /v2/life-jacket-buying-guide
    - title: Kontrolný zoznam bezpečnosti pri SUP
      desc: Bezpečnostný kontrolný zoznam pred štartom, ktorý by mal každý pádlar na SUP dodržať predtým, než vyrazí na vodu.
      href: /v2/sup-safety-guide
    - title: Bezpečnosť pri pádlovaní v studenej vode
      desc: Základné opatrenia, vybavenie a techniky pre pádlovanie v podmienkach studenej vody.
      href: /v2/cold-water-safety-guide
    - title: Chyby začiatočníkov pri pádlovaní
      desc: Časté chyby, ktorých sa dopúšťajú pádlari pri prvom pokuse, a ako sa im vyhnúť pre bezpečnejší a príjemnejší zážitok.
      href: /v2/beginner-sup-guide
    - title: Certifikácia CE vysvetlená
      desc: Čo znamená certifikácia CE pre nafukovacie dosky SUP — normy, testovanie a prečo je to pre bezpečnosť dôležité.
      href: /trust
sup-basics:
  title: Základy SUP — Príručka pre začiatočníkov v paddleboardingu
  description: Všetko, čo potrebujete vedieť na začiatok paddleboardingu. Príručky vybavenia, rady pre výber veľkosti, tipy na bezpečnosť a techniky pre začiatočníkov z centra znalostí afarer.
  articles: []
drop-stitch-core:
  title: Technológia drop-stitch jadra — Ako nafukovacie dosky SUP dosahujú tuhosť
  description: 'Hlboký ponor do technológie drop-stitch konštrukcie: ako tisíce polyesterových vlákien vytvárajú tuhé nafukovacie plošiny pri 15-25 PSI. Hustota vlákien, integrácia tkaniva, výrobný proces a porovnania výkonu.'
  articles: []
inflatable-technology:
  title: Technológia nafukovacích SUP — Materiály, konštrukcia a inžinierstvo
  description: Ako sa vyrábajú nafukovacie dosky SUP — vrstvenie materiálov, drop-stitch jadrá, ventilové systémy, RF zváranie a testovanie kvality. Pochopte, čo robí nafukovacie dosky odolnými a výkonnými.
  articles: []
intermediate-techniques:
  title: Techniky SUP a kajaku pre mierne pokročilých — Nad rámec základov
  description: Posuňte svoje pádlarské zručnosti na vyššiu úroveň pomocou pokročilých ťahov pádlom, zvládania rozbúrenej vody, práce s vetrom, sebazáchranných techník a etikety skupinového pádlovania. Pre pádlarov pripravených prekročiť úroveň začiatočníka.
  articles: []
materials:
  title: Materiály nafukovacích SUP — PVC, EVA a drop-stitch tkanina
  description: 'Komplexný sprievodca materiálmi používanými pri výrobe nafukovacích SUP: PVC vo vojenskej triede, EVA penová paluba, drop-stitch tkanina, uhlíkové vlákno a hliníkové zliatiny. Špecifikácie, aplikácie a kritériá výberu.'
  articles: []
safety-in-water-sports:
  title: Bezpečnosť vo vodných športoch — Základné znalosti pre pádlarov
  description: Základné bezpečnostné znalosti pre každého pádlara — čítanie počasia, výber PFD, sebazáchrana a protokoly skupinového pádlovania.
  articles: []
sup-size-guide:
  title: Návod na výber veľkosti SUP — Ako vybrať správnu dĺžku, šírku a objem dosky
  description: Komplexný sprievodca výberom veľkosti SUP pokrývajúci dĺžku, šírku, hrúbku dosky, objem (litre) a párovanie s hmotnosťou jazdca. Nájdite správnu veľkosť nafukovacieho SUP podľa vašej hmotnosti, úrovne zručností a pádlarskej aktivity.
  articles: []

- slug: sup-travel-transport
  category: planning
  title: Guia de viagem com SUP — voando e viajando de carro com um SUP inflável
  description: Como viajar com um SUP inflável de avião, de carro ou de motorhome. Dicas sobre taxas de companhias aéreas, embalagem, inflação no destino e considerações para viagens internacionais.
  tldr: Desinfle, enrole e embale o SUP na mochila. A maioria das companhias aéreas aceita como bagagem despachada (abaixo de 50 libras / 50 polegadas lineares). Embale sempre a bomba e o remo na mesma mochila. Chegue cedo para ter tempo extra caso o agente questione o tamanho da bagagem. Considere enviar com antecedência em viagens longas.
  problem: Viajar com um SUP parece complicado — limites de tamanho das companhias aéreas, preocupações com a fiscalização de bagagem e a dúvida de como inflar em um destino remoto criam incerteza.
  solution: As mochilas de SUP da Afarer são projetadas para respeitar os limites de bagagem despachada. Embale com estratégia, leve um kit de reparo e pesquise locais de inflação (marinas, acampamentos com energia) antes de partir.
  audience: Remadores planejando viagens com SUP de avião, de carro ou de motorhome.
  steps:
    - Desinfle totalmente e enrole a prancha do bico para a popa
    - Embale na mochila a prancha enrolada, a bomba, o remo, o leash e a aleta
    - Verifique os limites de tamanho e peso da companhia aérea — a maioria aceita 62 polegadas lineares e 50 libras
    - Chegue cedo e esteja preparado para a bagagem ser verificada manualmente
    - Leve um kit de reparo na bagagem de mão, caso a prancha se danifique no transporte
    - Pesquise opções de inflação — tomadas elétricas em acampamentos para bombas elétricas, estações de ar em marinas
  faq:
    - q: A companhia aérea aceita minha mochila de SUP como bagagem?
      a: A maioria das companhias dos EUA e da Europa aceita mochilas de SUP como bagagem despachada padrão, se abaixo de 50 libras e 62 polegadas lineares. Companhias econômicas podem cobrar taxas de excesso.
    - q: Posso levar meu SUP na cabine?
      a: Não. Mochilas de SUP excedem as dimensões de bagagem de mão em todas as companhias. Despache sempre a mochila.
    - q: Como inflo meu SUP em um destino remoto?
      a: A bomba manual incluída funciona em qualquer lugar sem energia. Para mais conforto, leve uma bomba elétrica portátil e procure acampamentos com tomadas elétricas ou marinas com estações de ar.

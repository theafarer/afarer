- slug: sup-for-whitewater
  category: buying-guide
  title: Guia de SUP para águas bravas — guia de compra de pranchas infláveis para rios
  description: Como escolher um SUP para águas bravas — pranchas mais curtas, construção reforçada, equipamento de segurança e técnicas de remada para corredeiras de grau I a III.
  tldr: SUPs para águas bravas precisam de comprimento menor (8-10'), bordas reforçadas, PSI mais alto (15 ou mais) e várias câmaras de ar para segurança. Use leash reto de rio (não espiral), use capacete e colete salva-vidas e reme sempre acompanhado. Comece em corredeiras de grau I antes de tentar as mais fortes.
  problem: Levar um SUP polivalente padrão para água corrente é perigoso — pranchas comuns não têm a manobrabilidade, a resistência a impactos e os recursos de segurança necessários para rios.
  solution: Escolha um SUP feito para águas bravas, com comprimento curto para agilidade, construção reforçada para impactos em rochas e desenho com várias câmaras para segurança.
  audience: Remadores experientes migrando para a descida de rios.
  steps:
    - Escolha uma prancha de 8-10' para manobrabilidade máxima nas corredeiras
    - Procure construção com bordas reforçadas e PVC de grau militar
    - Selecione uma prancha com 2 ou mais câmaras de ar, para redundância em caso de furo
    - Use leash reto de rio preso a um cinto com liberação rápida
    - Use capacete, colete salva-vidas e calçado adequado de rio
    - Comece em corredeiras de grau I e evolua gradualmente com um parceiro experiente
  faq:
    - q: Posso usar um SUP comum em águas bravas?
      a: Não recomendado. SUPs padrão não têm resistência a impactos e podem delaminar nas rochas. A segurança de várias câmaras é crítica em ambientes de rio.
    - q: Qual PSI para SUP de águas bravas?
      a: 15 PSI ou mais para rigidez máxima. Uma prancha mais dura quica nas rochas melhor do que uma pouco inflada, que se molda aos obstáculos.
    - q: Preciso de técnicas especiais de remada para águas bravas?
      a: Sim. Leitura de rio, viradas em remanso, travessias em ferry e apoios são técnicas essenciais. Faça um curso de SUP em águas bravas antes de tentar grau II ou superior.

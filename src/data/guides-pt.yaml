- slug: sup-buying-mistakes
  category: buying-guide
  title: Erros comuns ao comprar um SUP — o que evitar na hora de escolher uma prancha
  description: Aprenda com os erros mais comuns ao comprar um SUP — escolher o tamanho errado, ignorar a capacidade de peso, comprar pranchas baratas e negligenciar acessórios essenciais.
  tldr: Os 5 principais erros — comprar uma prancha estreita demais, ignorar a capacidade de peso, escolher preço em vez de qualidade, esquecer o custo dos acessórios e não combinar o tipo de prancha com o uso pretendido. Um SUP inflável de qualidade de um fabricante renomado custa 500-900 $ e dura mais de 5 anos.
  problem: Compradores de primeira viagem desperdiçam dinheiro em pranchas pequenas demais, de baixa qualidade ou inadequadas às suas necessidades. Pranchas baratas falham em 1-2 temporadas.
  solution: Pesquise bastante antes de comprar. Combine as dimensões da prancha com seu tamanho. Invista em construção drop-stitch de qualidade. Reserve verba para acessórios essenciais. Compre de um fabricante com certificação CE e garantia.
  audience: Compradores de primeiro SUP e qualquer pessoa que errou na escolha da primeira prancha.
  steps:
    - Erro 1 — comprar uma prancha estreita demais; escolha sempre mais largura do que você acha que precisa
    - Erro 2 — ignorar a capacidade de peso; calcule sua carga total antes de comprar
    - Erro 3 — escolher a opção mais barata; PVC de baixa qualidade falha rápido
    - Erro 4 — esquecer os acessórios; bomba, colete, remo e leash somam 150-300 $
    - Erro 5 — não combinar o tipo de prancha com o uso; pranchas polivalentes são versáteis, mas pranchas especializadas rendem mais
  faq:
    - q: Quanto devo gastar em um primeiro SUP?
      a: Um SUP inflável de qualidade de um fabricante renomado custa 500-900 $. Pranchas abaixo de 300 $ costumam ser de baixa qualidade, com drop-stitch ruim e PVC fino que falha rápido.
    - q: Vale a pena um SUP barato?
      a: Não. SUPs de baixo custo usam PVC fino, drop-stitch fraco e válvulas de má qualidade. Eles delaminam, vazam e perdem rigidez. Uma prancha de qualidade dura mais de 5 anos; uma barata pode falhar em 1 temporada.
    - q: Devo comprar um conjunto ou itens separados?
      a: Conjuntos economizam em relação à compra separada. Garanta que o conjunto inclua uma bomba de qualidade com manômetro, remo ajustável e leash espiral — e não apenas os acessórios mais baratos.

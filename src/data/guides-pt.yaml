- slug: sup-size-guide
  category: buying-guide
  title: Guia de tamanhos de SUP — como escolher as dimensões certas da prancha
  description: Guia completo de tamanhos de SUP com recomendações de comprimento, largura e espessura com base no seu peso, altura, nível de habilidade e estilo de remada.
  tldr: Iniciantes precisam de pranchas mais largas (32-34") para estabilidade. Remadores mais pesados precisam de pranchas mais longas (11' ou mais) com volume maior. Touring exige cascos mais longos (12' ou mais). Yoga precisa de largura extra (34" ou mais). Verifique sempre a capacidade de carga — seu peso mais o equipamento não deve ultrapassar 80% do limite.
  problem: Escolher o tamanho errado de SUP leva a pouca estabilidade, rumo lento e uma experiência frustrante de remada. A maioria dos compradores de primeira viagem escolhe uma prancha bonita sem considerar como as dimensões afetam o desempenho.
  solution: Combine comprimento, largura e espessura da prancha com seu peso, nível de habilidade e uso principal. Use nossa calculadora de tamanho — some seu peso ao peso do equipamento e escolha uma prancha com pelo menos 20% de folga acima desse total.
  audience: Compradores de primeira prancha de SUP, remadores migrando para uma prancha especializada e qualquer pessoa em dúvida sobre medidas.
  steps:
    - Pese-se com todo o equipamento que carrega (remo, colete salva-vidas, saco estanque)
    - Some 20% de margem de segurança para achar a capacidade de carga mínima
    - Escolha a largura conforme o nível — 32-34" para iniciantes, 30-32" para intermediários, 28-30" para avançados
    - Selecione o comprimento conforme o uso — 10'6"-11'6" polivalente, 12'-14' touring, 9'-10' águas bravas
    - Verifique a espessura — 6" padrão, 4" para desempenho, 5" para uso polivalente
    - Confira a faixa de PSI recomendada da sua prancha para rigidez ideal
  faq:
    - q: Qual largura de SUP é melhor para iniciantes?
      a: Entre 32 e 34 polegadas de largura oferece a plataforma mais estável. Quanto mais larga a prancha, mais fácil equilibrar-se — especialmente para remadores maiores.
    - q: Como sei se um SUP é pequeno demais para mim?
      a: Se a prancha fica baixa na água, responde com lentidão ou o bico afunda facilmente ao remar, ela provavelmente é pequena demais para seu peso.
    - q: O comprimento da prancha afeta a velocidade?
      a: Sim. Um comprimento maior de linha d'água aumenta a velocidade teórica do casco. Uma prancha de touring de 14' é significativamente mais rápida que uma polivalente de 10' com o mesmo esforço do remador.

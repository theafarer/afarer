- slug: sup-weight-capacity
  category: buying-guide
  title: Guia de capacidade de carga do SUP — quanto peso um SUP aguenta?
  description: Entenda os limites de capacidade de carga do SUP, como calcular sua carga total e por que ultrapassar o limite afeta desempenho e segurança.
  tldr: Nunca ultrapasse 80% da capacidade máxima de peso da prancha com seu peso corporal mais o equipamento. Uma prancha com capacidade para 220 libras serve para um remador de 160 libras com equipamento leve. Ultrapassar o limite causa balanço excessivo, resposta lenta e risco maior de danos.
  problem: Remadores costumam ultrapassar a capacidade de carga da prancha, o que leva a desempenho ruim, prancha submersa e possível dano ao material. Os fabricantes listam limites máximos, mas não explicam as cargas seguras de trabalho.
  solution: Calcule sua carga total (peso corporal, equipamento e água absorvida pela prancha) e fique abaixo de 80% da capacidade máxima declarada. Remadores mais pesados precisam de pranchas com volume maior e capacidade a partir de 300 libras.
  audience: Remadores de todos os tamanhos, especialmente os maiores e quem leva equipamento de expedição.
  steps:
    - Localize a capacidade máxima de peso impressa na prancha (geralmente perto da válvula)
    - Pese-se com todo o equipamento, incluindo remo, colete salva-vidas, sacos estanques, caixa térmica e acessórios
    - Calcule — sua carga total dividida pela capacidade máxima, vezes 100, dá o percentual usado
    - Busque 70-80% para desempenho e segurança ideais
    - Se passar de 80%, escolha uma prancha maior ou reduza o equipamento
  faq:
    - q: O que acontece se eu ultrapassar o limite de peso?
      a: A prancha navega mais baixa, criando mais arrasto. A estabilidade diminui, o bico pode afundar e o núcleo drop-stitch fica mais sujeito a danos na agitação.
    - q: Duas pessoas podem andar em um SUP?
      a: Somente se o peso total ficar abaixo de 80% da capacidade. A maioria dos SUPs padrão é projetada para uma pessoa. Andar em dupla exige uma prancha homologada para dois.
    - q: SUPs infláveis têm capacidade menor que pranchas rígidas?
      a: Infláveis de qualidade com construção drop-stitch têm capacidades de peso comparáveis ou maiores que as rígidas, graças à distribuição de volume mais espessa.

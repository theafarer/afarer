- slug: sup-fitness
  category: lifestyle
  title: SUP fitness — treino de corpo inteiro na água
  description: Como o stand-up paddle desenvolve força no core, equilíbrio e condicionamento cardiovascular.
  tldr: O SUP engaja core, pernas, costas e ombros em cada remada. Uma sessão de uma hora queima 300-500 calorias. Remar contra vento ou corrente dobra a intensidade. O yoga de SUP adiciona flexibilidade e trabalho de equilíbrio.
  problem: Muita gente vê o stand-up paddle como uma atividade casual, e não como uma ferramenta legítima de fitness, perdendo seu potencial de condicionamento de corpo inteiro.
  solution: Estruture sessões de SUP com objetivos específicos de fitness — remadas de resistência para cardio, sprints intervalados para potência, yoga de SUP para flexibilidade e remadas de distância para resistência muscular.
  audience: Entusiastas de fitness em busca de um treino de corpo inteiro com baixo impacto e alto engajamento.
  steps:
    - Aqueça em terra — círculos com os braços, torções de tronco e balanços de perna por 5 minutos
    - Comece com 10 minutos de remada constante em intensidade moderada
    - Avance para treino intervalado — 2 minutos de remada forte, 2 minutos de recuperação leve
    - Incorpore posturas de yoga de SUP — cachorro olhando para baixo, guerreiro II e postura da árvore sobre a prancha
    - Finalize com remada leve e alongamentos estáticos sobre a prancha
  faq:
    - q: O SUP é melhor que a corrida para o fitness?
      a: O SUP oferece benefícios cardiovasculares comparáveis com menor impacto nas articulações. Também engaja mais o tronco superior e o core que a corrida.
    - q: Quantas calorias o SUP queima?
      a: Aproximadamente 300-500 calorias por hora em intensidade moderada. Competições ou remadas contra o vento podem queimar 600-800 calorias por hora.
    - q: Posso ganhar massa muscular com o SUP?
      a: Sim. Remar desenvolve ombros, costas e core. O equilíbrio engaja pernas e músculos estabilizadores. É um treino de resistência de corpo inteiro.

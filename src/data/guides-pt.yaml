- slug: sup-for-pet-owners
  category: lifestyle
  title: SUP com cães — um guia completo para remar com seu pet
  description: Tudo o que você precisa saber sobre andar de stand-up paddle com cães — etapas de adestramento, equipamento de segurança, escolha da prancha e dicas para uma sessão de SUP bem-sucedida com seu amigo de quatro patas.
  tldr: Comece com uma prancha larga e estável (34" ou mais). Use um colete salva-vidas para pets, deck antiderrapante e leash curto. Treine primeiro em terra, depois em água rasa. Mantenha sessões curtas (20-30 minutos). Leve água doce e uma toalha. Nunca force seu cão se ele parecer ansioso.
  problem: Remar com cães pode ser estressante sem preparação adequada — os cães podem entrar em pânico, pular da prancha ou arranhar a superfície.
  solution: Use uma prancha larga e estável com deck macio de EVA. Acostume seu cão gradualmente. Leve equipamento de segurança, incluindo um colete salva-vidas para pets e um leash curto seguro para SUP.
  audience: Donos de cães que querem andar de SUP com seus pets.
  steps:
    - Comece com uma prancha larga (34" ou mais, com capacidade de carga alta para você e o cão)
    - Providencie um colete salva-vidas para cães bem ajustado e com alça
    - Pratique em terra — faça o cão sentar na prancha desinflada, depois na prancha inflada sobre a grama
    - Passe para a água rasa — ajoelhe na prancha com o cão e dê algumas remadas
    - Mantenha sessões curtas — 20-30 minutos no máximo nos primeiros passeios
    - Leve sempre água doce, uma tigela dobrável e uma toalha para o cão
  faq:
    - q: Qual prancha de SUP é melhor para cães?
      a: Uma prancha larga e estável com deck macio de EVA que dê aderência às patas. A Tropical Breeze Island Escape, com 34" ou mais de largura, é ideal para remar com cães.
    - q: Meu cão precisa de colete salva-vidas?
      a: Sim, mesmo os bons nadadores. Um colete para cães com alça facilita colocá-lo de volta na prancha se ele cair na água.
    - q: Como evito que meu cão risque a prancha?
      a: Mantenha as unhas do cão aparadas. O deck de espuma EVA protege a superfície de PVC. Coloque uma toalha ou tapete para pets no deck para proteção extra.

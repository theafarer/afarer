- slug: sup-maintenance
  category: maintenance
  title: Como limpar e guardar seu SUP inflável
  description: Guia de manutenção passo a passo para maximizar a vida útil da sua prancha de SUP inflável.
  tldr: Enxágue com água doce após cada uso, seque completamente antes de guardar, desinfle e enrole frouxamente (não apertado), guarde em local fresco e seco longe da luz solar direta e inspecione as costuras mensalmente.
  problem: Armazenamento e limpeza inadequados são as principais causas de falha prematura em SUPs infláveis — mofo, danos por UV e delaminação das costuras.
  solution: Siga uma rotina consistente pós-sessão — enxágue, seque, inspecione, desinfle e guarde. Use sabão neutro para sujeira persistente. Nunca guarde a prancha molhada ou sob luz solar direta.
  audience: Todos os donos de SUP inflável que querem que a prancha dure mais de 5 anos.
  steps:
    - Enxágue a prancha com água doce imediatamente após o uso, especialmente depois de água salgada
    - Limpe com sabão neutro e esponja macia — evite produtos químicos agressivos ou lavadoras de alta pressão
    - Seque a prancha completamente — abra a válvula para deixar a água presa sair
    - Inspecione quanto a danos — verifique costuras, válvula e superfície em busca de furos
    - Desinfle totalmente — remova o núcleo da válvula para desinflação completa
    - Enrole a prancha frouxamente — comece pelo bico, evite dobras acentuadas
    - Guarde na mochila de transporte em local fresco e seco, longe da luz solar direta
  faq:
    - q: Posso deixar meu SUP inflado a temporada inteira?
      a: Sim, mas mantenha-o longe da luz solar direta quando não estiver em uso. A desinflação parcial (8-10 PSI) é recomendada para armazenamento prolongado.
    - q: Como reparo um furo?
      a: Limpe a área, corte um remendo com cantos arredondados, aplique adesivo, pressione firme e espere 24 horas antes de inflar. As pranchas afarer vêm com kit de reparo.
    - q: Com que frequência devo verificar a válvula?
      a: Mensalmente. A válvula é o ponto de falha mais comum. Verifique se o pino da válvula se move livremente e se o O-ring está íntegro.

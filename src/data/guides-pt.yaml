- slug: paddling-techniques
  category: tutorial
  title: Técnicas essenciais de remada no SUP
  description: Domine a remada frontal, a remada varredura e o giro cross-bow para remar com eficiência em qualquer condição.
  tldr: A remada frontal usa o core, não os braços. A remada varredura vira a prancha. O giro cross-bow é o pivô mais eficiente. Mantenha o remo vertical e mergulhe a pá completamente para a máxima transferência de força.
  problem: A maioria dos remadores usa remadas dominadas pelos braços, que desperdiçam energia e causam fadiga nos ombros. A técnica ruim também dificulta o controle da prancha no vento e na agitação.
  solution: Aprenda três remadas essenciais — frontal, varredura e giro cross-bow — com a mecânica corporal correta. Pratique cada uma em água calma antes de avançar para condições desafiadoras.
  audience: Remadores que querem remar por mais tempo, mais rápido e com menos fadiga.
  steps:
    - Remada frontal — alcance à frente, plante a pá completamente, puxe para trás com rotação do tronco (não com os braços), saia na altura do tornozelo
    - Remada varredura — alcance à frente na borda, varra a pá em um arco amplo em direção à popa, virando a prancha para o lado oposto ao do remo
    - Giro cross-bow — posicione o remo no lado oposto da prancha sem trocar as mãos, puxe em direção à popa
    - Apoio — use o apoio baixo para estabilidade na agitação, batendo a pá plana na superfície da água
    - Remada lateral — alcance para o lado, puxando a prancha lateralmente em direção ao remo
  faq:
    - q: Como remo em linha reta?
      a: Use comprimento de remada consistente nos dois lados. Troque de lado a cada 5-10 remadas. Olhe um ponto fixo no horizonte como referência.
    - q: Devo flexionar os joelhos?
      a: Sim. Mantenha os joelhos levemente flexionados como amortecedores. Joelhos travados transferem cada ondulação para o core e reduzem a estabilidade.
    - q: Como remo contra o vento?
      a: Abaixe a postura, use remadas mais curtas e rápidas e fique mais perto da costa, onde o vento costuma ser menor. Se o vento estiver forte demais, não saia.

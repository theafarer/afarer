- slug: sup-board-materials
  category: technical
  title: Materiais da prancha de SUP — PVC, EPS, epóxi e drop-stitch explicados
  description: Guia técnico dos materiais de construção do SUP — inflável de PVC com drop-stitch versus prancha rígida com núcleo de espuma EPS. Entenda o que faz cada tipo ter desempenho diferente.
  tldr: SUPs infláveis usam PVC drop-stitch com milhares de fios internos para rigidez. Pranchas rígidas usam núcleo de espuma EPS com casca de epóxi ou fibra de vidro. As infláveis vencem em portabilidade e durabilidade. As rígidas vencem em velocidade e sensação. A tecnologia drop-stitch moderna a 15 PSI rivaliza com a rigidez das pranchas rígidas.
  problem: Compradores não entendem as diferenças fundamentais de construção entre pranchas infláveis e rígidas, o que leva a decisões de compra erradas.
  solution: Combine o material da prancha com seu uso principal — inflável drop-stitch para viagens, armazenamento e durabilidade. EPS/epóxi para competições, surf e desempenho máximo.
  audience: Compradores de SUP comparando construção inflável e rígida.
  steps:
    - Inflável drop-stitch — milhares de fios de poliéster conectam as camadas superior e inferior, criando estrutura rígida quando pressurizada a 12-15 PSI
    - Núcleo de espuma EPS rígido — núcleo de poliestireno expandido moldado no desenho do casco, selado com resina epóxi e camadas de fibra de vidro
    - Vantagens do inflável — embalável, praticamente indestrutível, leve de carregar, bordas macias para segurança
    - Vantagens da rígida — peso total menor, plataforma mais rígida, melhor eficiência de deslize, resposta mais rápida
    - Opções híbridas — alguns fabricantes combinam drop-stitch com painéis rígidos para o melhor dos dois mundos
  faq:
    - q: SUPs infláveis são tão rígidos quanto pranchas rígidas?
      a: A 15 PSI com construção drop-stitch de qualidade, os infláveis modernos ficam muito perto. A maioria dos remadores recreativos não nota a diferença. Remadores de competição notarão a vantagem da prancha rígida.
    - q: Qual material dura mais?
      a: SUPs infláveis duram de 5 a 10 anos com cuidado. Pranchas rígidas duram de 10 a 20 anos, mas estão sujeitas a rachaduras, amassados e entrada de água. Infláveis resistem melhor aos danos do dia a dia.
    - q: O PVC é ecológico?
      a: A produção de PVC tem impacto ambiental, mas SUPs infláveis duram mais, reduzindo a frequência de troca, e embalam menores, reduzindo emissões de transporte. Recicle sempre as pranchas velhas corretamente.

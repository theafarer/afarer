- slug: sup-yoga
  category: lifestyle
  title: Yoga de SUP — um guia completo de remada e yoga
  description: Combine stand-up paddle com yoga para melhorar equilíbrio, força e atenção plena na água.
  tldr: O yoga de SUP adiciona um elemento de instabilidade que aumenta drasticamente a ativação do core em comparação com o yoga em terra. Comece com posturas básicas em uma prancha larga e estável em água calma. Use um deck antiderrapante. Nunca pratique yoga de SUP sozinho.
  problem: Os tapetes de yoga tradicionais oferecem uma superfície perfeitamente estável, removendo o desafio de equilíbrio que torna o yoga de SUP singularmente eficaz para força de core e concentração.
  solution: Use uma prancha de SUP extra larga (34" ou mais) com tapete de tração em todo o deck. Pratique em água calma e rasa. Comece com posturas de base antes de tentar invertidas.
  audience: Praticantes de yoga e remadores que querem combinar treino de equilíbrio com atenção plena.
  steps:
    - Ancore a prancha em água rasa e calma — use uma âncora de areia ou amarre em um píer
    - Comece com posturas sentadas — postura fácil, postura do barco, torção sentada
    - Avance para posturas de joelhos — mesa, gato-vaca, postura do raio
    - Passe para posturas em pé — montanha, guerreiro I, guerreiro II, postura da árvore
    - Pratique posturas de equilíbrio — meia-lua, águia, dançarino
    - Termine com savasana — deite-se na prancha e sinta o movimento da água
  faq:
    - q: Qual prancha é melhor para yoga de SUP?
      a: Uma prancha larga (34" ou mais) com tapete de tração de ponta a ponta oferece a plataforma mais estável. A SUP Tour 12 oferece um bom equilíbrio entre estabilidade e deslize.
    - q: O yoga de SUP é perigoso?
      a: Não mais que o yoga em terra, quando praticado com segurança. Use água calma e rasa. Use leash. Pratique com um parceiro. Evite água profunda nas primeiras sessões.
    - q: Preciso de equipamento especial?
      a: Uma prancha larga e estável, tapete de tração no deck inteiro, leash e colete salva-vidas. Alguns praticantes usam um tapete impermeável para aderência extra.

- slug: multi-day-trip
  category: planning
  title: Planejando uma viagem de SUP de vários dias
  description: Como planejar e executar uma expedição de remada de vários dias — planejamento de rota, organização do equipamento, camping e segurança.
  tldr: Planeje 10-15 milhas por dia. Organize o equipamento em sacos estanques, distribua o peso uniformemente e pratique o carregamento da prancha antes da viagem. Deixe um plano de flutuação com alguém. Leve água, comida, abrigo, navegação e comunicação.
  problem: Viagens de vários dias fracassam por excesso de bagagem, planejamento de rota ruim ou subestimação do clima e da corrente — levando a exaustão, falha de equipamento ou acidentes.
  solution: Use uma abordagem sistemática de planejamento — escolha da rota, lista de equipamento, planejamento de alimentos, briefing de segurança e plano de contingência.
  audience: Remadores experientes planejando sua primeira expedição de vários dias.
  steps:
    - Escolha uma rota com acampamentos estabelecidos e pontos de saída de emergência
    - Planeje 10-15 milhas por dia considerando vento e corrente
    - Verifique as tábuas de maré e as previsões do tempo para toda a janela da viagem
    - Organize o equipamento em sacos estanques — 20-30 libras de equipamento no total
    - Distribua o peso uniformemente — itens mais pesados no centro
    - Deixe um plano de flutuação detalhado com alguém em terra
    - Leve navegação — carta náutica em papel, bússola e GPS de reserva
    - Embale abrigo de emergência, comida extra e kit de primeiros socorros
  faq:
    - q: Qual é a distância diária ideal?
      a: 10-15 milhas por dia para remadores experientes. Iniciantes devem planejar 5-8 milhas. Sempre inclua tempo de folga para o clima.
    - q: Quanta água devo levar?
      a: 1 galão por pessoa por dia. Em condições de calor, 1,5 galão. Leve um filtro de água ou tabletes de purificação para reabastecer.
    - q: Qual é o item de segurança mais importante?
      a: Comunicação. Um rádio VHF ou um transmissor via satélite pode salvar vidas em uma emergência. Telefones celulares são pouco confiáveis em áreas remotas.

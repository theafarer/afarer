- slug: choosing-paddle
  category: buying-guide
  title: Como escolher o remo certo para o SUP
  description: Um guia sobre materiais do remo, formatos de pá, tipos de haste e medidas para o SUP.
  tldr: Comprimento do remo — remos de SUP devem ficar 6-8" mais altos que sua altura. Formato da pá — pás dihedral mantêm o rumo, pás planas oferecem mais aderência na água. Material da haste — carbono é o mais leve, fibra de vidro é o melhor custo-benefício, alumínio é o mais barato.
  problem: Usar o remo com tamanho ou material errado causa fadiga desnecessária, eficiência ruim na remada e sobrecarga nas articulações.
  solution: Combine o comprimento do remo, o formato da pá, o material e a flexão da haste com seu estilo de remada, tamanho corporal e orçamento.
  audience: Remadores de SUP escolhendo seu primeiro remo ou o próximo.
  steps:
    - Meça a altura do remo — 6-8" mais alto que sua altura para uso geral
    - Escolha o material da pá — nylon para economia, fibra de vidro para custo-benefício, carbono para desempenho
    - Escolha o formato da pá — dihedral para rumo suave, plana para potência, côncava para competição
    - Escolha o tipo de haste — reta para uso geral, curva para SUP de corrida
    - Verifique a flexão — hastes mais rígidas transferem mais força, hastes flexíveis reduzem a sobrecarga articular
  faq:
    - q: Qual é o melhor material para o remo?
      a: A fibra de vidro oferece o melhor equilíbrio entre peso, durabilidade e custo. O carbono é mais leve, porém mais caro e quebradiço. O nylon é pesado, mas praticamente indestrutível.
    - q: Como sei se meu remo tem o comprimento certo?
      a: Coloque o remo na vertical ao seu lado — o cabo deve alcançar seu pulso com o braço erguido acima da cabeça.
    - q: Devo comprar um remo de uma peça só ou ajustável?
      a: Remos ajustáveis são bons para uso compartilhado e viagens. Remos de uma peça só são mais leves, mais rígidos e mais eficientes para uso dedicado.

- slug: sup-inflation-psi-guide
  category: technical
  title: Guia de inflação do SUP — PSI ideal para desempenho e segurança
  description: Guia completo da pressão de inflação do SUP — faixas de PSI recomendadas, como a pressão afeta o desempenho e dicas para usar a bomba corretamente.
  tldr: Infle até 12-15 PSI na maioria dos SUPs infláveis. Pressão mais alta — mais rigidez, porém inflagem mais lenta. Pressão mais baixa — toque mais macio, porém mais flexão. Nunca ultrapasse o PSI máximo impresso na prancha. Use uma bomba com manômetro preciso. Ar frio reduz a pressão, sol quente aumenta.
  problem: Pranchas pouco infladas parecem lentas e flexionam demais. Pranchas muito infladas arriscam falha nas costuras. Muitos remadores adivinham o PSI em vez de medir com precisão.
  solution: Use uma bomba com manômetro embutido. Busque 15 PSI para rigidez máxima. Verifique a pressão antes de cada sessão — mudanças de temperatura afetam bastante o PSI.
  audience: Todos os donos de SUP inflável.
  steps:
    - Verifique a faixa de PSI recomendada impressa na prancha, perto da válvula
    - Use a bomba de dupla ação para inflar até o meio da faixa recomendada
    - Mude para o modo de ação simples nos últimos 3-4 PSI para controle mais preciso
    - Confira a pressão no manômetro — medidores analógicos são mais confiáveis que os digitais
    - Ajuste conforme as condições — PSI mais alto para touring e competições, PSI mais baixo para águas bravas e largas com pedras
    - Verifique a pressão de novo depois de 10 minutos — o equilíbrio térmico altera o PSI
  faq:
    - q: Posso inflar meu SUP demais?
      a: Sim. Ultrapassar o PSI máximo nominal (geralmente 15-18 PSI) pode delaminar as costuras e danificar o núcleo drop-stitch. Fique sempre dentro da faixa impressa.
    - q: A temperatura afeta o PSI?
      a: Bastante. Uma prancha inflada a 15 PSI a 70°F pode chegar a 18 PSI sob sol direto a 95°F. Água fria pode derrubar a pressão para 12 PSI. Verifique a pressão após mudanças de ambiente.
    - q: Qual PSI para iniciantes?
      a: 12-13 PSI para aprender oferece uma plataforma um pouco mais macia, que perdoa melhor as quedas. Suba para 15 PSI conforme a técnica melhora.

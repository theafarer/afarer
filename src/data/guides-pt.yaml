- slug: sup-with-kids
  category: lifestyle
  title: SUP com crianças — um guia completo para a família
  description: Como levar crianças para o stand-up paddle com segurança — recomendações de idade, equipamento e atividades.
  tldr: Crianças a partir de 6 anos podem andar em um SUP com um adulto. Crianças a partir de 10 anos podem remar em sua própria prancha com supervisão. Use uma prancha larga e estável, use sempre coletes salva-vidas, fique em água rasa e calma e mantenha as sessões curtas (30-45 minutos no máximo).
  problem: Os pais querem compartilhar esportes aquáticos com os filhos, mas se preocupam com a segurança, com o ajuste do equipamento e com manter as crianças entretidas.
  solution: Use uma prancha do tamanho certo para andar em dupla, garanta que cada criança use um colete salva-vidas bem ajustado, comece em água rasa e morna e torne a atividade divertida com jogos e sessões curtas.
  audience: Pais que querem apresentar o stand-up paddle aos filhos.
  steps:
    - De 4 a 6 anos — vá como passageiro na prancha de um adulto, sentado na frente e segurando a alça central
    - De 6 a 10 anos — fique de joelhos ou sentado na própria prancha, com supervisão de um adulto e leash
    - A partir dos 10 anos — reme na própria prancha com um adulto por perto
    - Use sempre colete salva-vidas — crianças devem usar um colete bem ajustado o tempo todo
    - Fique em água rasa (na altura da cintura do adulto)
    - Mantenha sessões curtas — 30-45 minutos no máximo para crianças menores de 10 anos
    - Torne divertido — brinque, procure peixes, pratique ficar em pé
  faq:
    - q: A partir de que idade uma criança pode andar de SUP sozinha?
      a: Por volta dos 10-12 anos com supervisão, dependendo da capacidade de natação e do conforto na água da criança. Sempre em condições calmas e rasas.
    - q: Qual prancha é melhor para andar de SUP com crianças?
      a: Uma prancha larga (34" ou mais) com capacidade de carga alta para andar em dupla. A SUP Explorer 11, com 33" de largura e capacidade para 220 libras, funciona bem para um adulto com uma criança.
    - q: Que equipamento de segurança as crianças precisam?
      a: Um colete salva-vidas certificado CE bem ajustado, leash preso à prancha do adulto para andar em dupla, protetor solar e chapéu.

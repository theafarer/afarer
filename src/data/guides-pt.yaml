- slug: inflatable-repair
  category: maintenance
  title: Como reparar seu SUP inflável
  description: Guia passo a passo para reparar furos, problemas de válvula e danos nas costuras de SUPs infláveis.
  tldr: Furos pequenos (menores que 1/4") podem ser reparados com o kit de remendos incluído. Limpe a área, aplique adesivo de PVC, pressione o remendo e espere 24 horas. Vazamentos na válvula geralmente exigem a troca do O-ring. Rasgos grandes ou delaminação das costuras precisam de serviço profissional.
  problem: Furos pequenos e problemas de válvula são comuns, mas fáceis de resolver. Sem a técnica correta de reparo, os usuários pagam caro por serviço profissional ou pioram o dano.
  solution: Identifique o tipo de dano — furo, vazamento na válvula ou problema nas costuras — e aplique o método de reparo adequado. A maioria dos reparos leva 30 minutos mais o tempo de cura.
  audience: Donos de SUPs infláveis que querem fazer os reparos básicos por conta própria.
  steps:
    - Localize o vazamento — infle totalmente, ouça o ar, sinta com a mão ou use água com sabão
    - Marque o vazamento com caneta ou fita
    - Limpe a área ao redor do vazamento com álcool isopropílico — pelo menos 2 polegadas ao redor do dano
    - Lixe a superfície com lixa fina para melhor aderência do adesivo
    - Aplique adesivo de PVC no remendo e na superfície da prancha
    - Espere 5 minutos até o adesivo ficar pegajoso
    - Pressione o remendo com firmeza e remova as bolhas de ar com um rolo ou cartão
    - Deixe curar por 24 horas antes de inflar na pressão total
  faq:
    - q: Posso fazer um reparo na água?
      a: Reparos de emergência com remendo e fita podem levar você de volta à margem. Reparos completos exigem condições secas e 24 horas de cura.
    - q: Como conserto uma válvula com vazamento?
      a: Remova o núcleo da válvula com a ferramenta incluída, verifique se o O-ring está danificado, troque se necessário e recoloque o núcleo bem apertado.
    - q: Qual cola devo usar para reparos em PVC?
      a: Use adesivo específico para PVC, como HH-66 ou Clifton. Supercola comum não adere bem aos materiais de PVC inflável.

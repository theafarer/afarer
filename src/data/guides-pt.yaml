  title: SUP para competições e fitness — guia de compra de pranchas de desempenho
  description: Guia para escolher um SUP para competições, fitness e remadas esportivas. Especificações da prancha, escolha do remo e dicas de treino para remadores competitivos e de condicionamento.
  tldr: SUPs de competição têm de 12'6" a 14' de comprimento, 23-28" de largura e cascos de deslocamento para velocidade máxima. SUPs de fitness equilibram velocidade e estabilidade com 11-12' e 30-32". Combine a prancha com seus objetivos de condicionamento e seu nível de experiência.
  problem: SUPs recreativos comuns são lentos e ineficientes demais para remadas de condicionamento sérias ou competições. Remadores voltados ao desempenho precisam de pranchas específicas.
  solution: Combine a prancha à intensidade — fitness recreativo (polivalente de 11-12'), fitness sério (touring de 12'), competição (12'6" ou 14' estreita, com casco de deslocamento).
  audience: Remadores de fitness, futuros competidores e entusiastas esportivos de SUP.
  steps:
    - Defina seu objetivo — condicionamento geral, treino de competição ou provas
    - Para fitness — prancha de 11-12' com 30-32" de largura, equilibrando velocidade e estabilidade
    - Para competições — prancha de 12'6" ou 14' com 23-28" de largura e casco de deslocamento
    - Escolha um remo de carbono ou fibra de vidro para reduzir peso e fadiga
    - Adicione um monitor de frequência cardíaca e acompanhe distância e velocidade com um relógio GPS
    - Incorpore treino intervalado, remadas longas e exercícios de técnica
  faq:
    - q: Qual é o melhor comprimento de SUP para remadas de fitness?
      a: 12' oferece o melhor equilíbrio entre velocidade e estabilidade para remadas de fitness. Pranchas mais longas são mais rápidas, porém exigem mais técnica para equilibrar.
    - q: Preciso de uma prancha de competição para um bom treino?
      a: Não. Uma prancha de touring ou polivalente de 11-12' proporciona um excelente treino cardiovascular. Pranchas de competição só fazem diferença quando há disputa ou treino para provas.
    - q: Qual remo é melhor para o fitness no SUP?
      a: Um remo de fibra de carbono 8-10" mais alto que você. O peso menor reduz a fadiga dos ombros. Uma pá menor aumenta a cadência de remadas no treino cardiovascular.

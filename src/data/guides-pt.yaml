- slug: weather-conditions
  category: safety
  title: Entendendo as condições meteorológicas para o stand-up paddle
  description: Aprenda a ler vento, ondas, marés e padrões climáticos para tomar decisões seguras na água.
  tldr: Verifique três coisas antes de cada saída — velocidade do vento (abaixo de 10 mph para iniciantes), altura das ondas (abaixo de 1 pé para iniciantes) e temperatura da água (vista-se para a água, não para o ar). Vento de terra para o mar é perigoso em qualquer nível.
  problem: A maioria dos acidentes relacionados ao clima acontece porque remadores avaliam mal as condições — conferem a temperatura do ar, mas não a da água, ou não entendem que o vento de terra pode arrastá-los para o mar aberto.
  solution: Use uma avaliação meteorológica estruturada antes de sair — direção e velocidade do vento, período e altura das ondas, estado da maré e temperatura da água. Entenda como cada fator afeta sua segurança.
  audience: Todos os remadores que saem em água aberta — lagos, baías, rios e oceano.
  steps:
    - Verifique a velocidade e a direção do vento — o vento de terra (que sopra do continente para o mar) é o mais perigoso
    - Avalie as condições das ondas — o período das ondas importa tanto quanto a altura
    - Conheça a maré — correntes de maré podem ser mais fortes que sua velocidade de remada
    - Meça a temperatura da água — abaixo de 60°F/15°C é necessária proteção térmica
    - Verifique a visibilidade — névoa e chuva forte reduzem a visão e aumentam o risco de colisão
    - Entenda os perigos locais — rochas submersas, correntes fortes, zonas de tráfego de embarcações
  faq:
    - q: Qual velocidade de vento é alta demais para o SUP?
      a: Iniciantes — acima de 10 mph (8 nós). Intermediários — acima de 15 mph (13 nós). Avançados — acima de 20 mph (17 nós). Na dúvida, não saia.
    - q: O que significa período de onda?
      a: O período de onda é o tempo entre ondas sucessivas. Períodos curtos (abaixo de 8 segundos) significam ondas íngremes e picadas. Períodos longos (acima de 12 segundos) significam marulhos mais suaves e previsíveis.
    - q: Posso remar na chuva?
      a: Chuva leve é geralmente segura. Chuva forte reduz a visibilidade e pode indicar mudança nas condições de vento. Tempestades exigem saída imediata da água.

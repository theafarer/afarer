- slug: understanding-specs
  category: technical
  title: Como ler as especificações de uma prancha de SUP
  description: Um guia técnico para entender as especificações de pranchas de SUP — volume, dimensões, construção e o que elas significam para o desempenho.
  tldr: Especificações principais — o volume (litros) determina flutuação e capacidade de carga, a largura determina a estabilidade, o comprimento determina rumo e velocidade, a espessura determina a rigidez e a classificação de PSI determina a pressão de inflação para o desempenho ideal.
  problem: As fichas técnicas listam números sem contexto, deixando compradores inseguros sobre quais especificações realmente importam para o seu caso de uso.
  solution: Traduza cada especificação em desempenho real — volume para flutuação, largura para estabilidade, comprimento para deslize, espessura para rigidez e construção para durabilidade.
  audience: Remadores intermediários e compradores técnicos que querem decisões baseadas em dados.
  steps:
    - Verifique o volume (litros) — seu peso mais o equipamento não deve ultrapassar 80% da classificação de volume da prancha
    - Verifique a largura — mais larga (32-34") é mais estabilidade, mais estreita (28-30") é mais velocidade
    - Verifique o comprimento — mais longa (12-14") é melhor rumo, mais curta (10-11") é melhor manobrabilidade
    - Verifique a espessura — 6" é o padrão, 8" oferece mais rigidez e capacidade de carga
    - Verifique a classificação de PSI — infle até o PSI nominal máximo para rigidez ideal
    - Verifique os materiais de construção — densidade do drop-stitch, camadas de PVC, reforço do rail
  faq:
    - q: O que significa drop-stitch?
      a: Drop-stitch é um método de construção em que milhares de fios conectam as camadas superior e inferior da prancha. Isso permite inflação em alta pressão (12-15 PSI) para rigidez extrema.
    - q: Qual é a relação ideal entre peso e volume?
      a: Um bom alvo é cerca de 5-6 libras de peso do remador por litro de volume da prancha. Um remador de 220 libras deve procurar pranchas com mais de 180 litros de volume.
    - q: O peso da prancha importa?
      a: Sim. Pranchas mais leves (abaixo de 20 libras) são mais fáceis de carregar e transportar. Pranchas mais pesadas (25 libras ou mais) costumam indicar construção mais durável em PVC multicamadas.

- slug: beginner-guide
  category: tutorial
  title: Guia para iniciantes de stand-up paddle
  description: Tudo o que você precisa saber antes da sua primeira sessão de stand-up paddle — da montagem do equipamento às técnicas básicas de remada.
  tldr: Comece em água calma e plana com uma prancha larga e estável. Infle até 12-15 PSI, prenda o leash e use o comprimento correto do remo (6-8" a mais que sua altura). Mantenha os pés na largura dos ombros, joelhos levemente flexionados e olhe no horizonte.
  problem: Remadores novos costumam pular a preparação fundamental — remo com comprimento errado, postura ruim ou escolha de água agitada — o que leva a quedas, frustração e desânimo.
  solution: Siga um plano estruturado para a primeira sessão — escolha água calma, prepare o equipamento corretamente, pratique de joelhos antes de ficar de pé e domine a remada frontal antes de tentar viradas.
  audience: Iniciantes absolutos que nunca praticaram stand-up paddle.
  steps:
    - Escolha água plana e calma, sem tráfego de embarcações — um lago pequeno ou uma baía abrigada é ideal
    - Infle a prancha até 12-15 PSI com a bomba de dupla ação
    - Prenda o leash de espiral no tornozelo ou na panturrilha, nunca na alça da prancha
    - Encaixe a aleta e aperte o parafuso
    - Ajuste o comprimento do remo — ele deve ficar 6-8 polegadas mais alto que sua altura
    - Comece de joelhos sobre a prancha e dê algumas remadas para sentir o equilíbrio
    - Levante-se um pé de cada vez, pés na largura dos ombros, joelhos flexionados
    - Olhe o horizonte, não os pés — a prancha vai para onde você olha
  faq:
    - q: O que vestir para o stand-up paddle?
      a: Roupas esportivas de secagem rápida, colete salva-vidas, protetor solar e chapéu. Em água fria, use roupa de neoprene. Use sempre leash e leve um telefone em capa impermeável.
    - q: Como volto para a prancha se cair?
      a: Mantenha a calma. Nade até a prancha, segure a alça central e bata as pernas enquanto se puxa para cima da prancha em um só movimento. Volte primeiro à posição de joelhos e depois levante-se.
    - q: Quais condições de vento são seguras?
      a: Iniciantes — ventos abaixo de 10 mph (5 nós). Se o vento estiver soprando para longe da costa, não saia. Consulte a previsão e lembre-se de que o vento de terra para o mar é perigoso.

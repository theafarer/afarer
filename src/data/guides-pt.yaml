- slug: sup-storage-winter-care
  category: maintenance
  title: Armazenamento e cuidados de inverno do SUP — prolongue a vida da sua prancha
  description: Como armazenar, limpar e preparar seu SUP inflável para o inverno da forma correta. Evite mofo, danos por UV e degradação do material com os cuidados certos.
  tldr: Limpe com água doce após cada uso. Seque completamente antes de guardar. Desinfle e guarde em local fresco e escuro, longe da luz solar direta e de temperaturas extremas. Nunca guarde inflada nem dentro de um carro quente. Aplique protetor UV periodicamente.
  problem: O armazenamento inadequado é a principal causa de falha prematura do SUP — mofo, deterioração do material, delaminação e danos à válvula causados por calor ou frio.
  solution: Siga uma rotina de cuidados em três etapas — enxágue após cada sessão, seque bem antes de guardar e armazene desinflado em ambiente com temperatura controlada entre 50-80°F (10-27°C).
  audience: Todos os donos de SUP que querem que a prancha dure mais de 5 anos.
  steps:
    - Enxágue a prancha, o remo e a bomba com água doce após cada sessão em água salgada ou barrenta
    - Limpe com sabão neutro e esponja macia — nunca produtos químicos agressivos nem lavadoras de alta pressão
    - Seque a prancha completamente ao ar livre antes de desinflar (abra a válvula para deixar a umidade interna sair)
    - Desinfle totalmente e enrole do bico para a popa para expelir o ar restante
    - Seque a mochila antes de guardar a prancha dentro
    - Guarde em um armário fresco e escuro ou debaixo da cama — nunca sob sol direto, em carro quente ou em galpão congelante
  faq:
    - q: Posso deixar meu SUP inflado a temporada inteira?
      a: É melhor desinflar quando não for usar por longos períodos. A pressão constante acelera a fadiga do material. Desinfle entre sessões se for guardar por mais de 2 semanas.
    - q: Como removo mofo do meu SUP?
      a: Misture sabão neutro com água morna e um pouco de vinagre branco. Esfregue suavemente com uma escova macia. Enxágue bem e seque à sombra. Evite água sanitária, que danifica o PVC.
    - q: Posso guardar meu SUP na garagem?
      a: Somente se a garagem ficar entre 50-80°F o ano todo. Áticos e garagens sem climatização sofrem extremos de temperatura que danificam os núcleos drop-stitch.

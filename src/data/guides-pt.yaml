- slug: sup-fishing
  category: lifestyle
  title: Guia de pesca em SUP — como pescar de prancha
  description: Tudo o que você precisa saber sobre pescar de uma prancha de stand-up paddle — montagem do equipamento, dicas de estabilidade e técnicas.
  tldr: A pesca em SUP permite aproximação silenciosa, acesso a águas rasas e arremessos de 360 graus. Use uma prancha larga e estável (34" ou mais), instale suportes de vara e use uma caixa térmica ou engradado como convés de equipamento. Ancore em dias de vento. Use sempre colete salva-vidas.
  problem: Barcos de pesca convencionais são caros de manter e não conseguem acessar águas rasas. A pesca em SUP resolve isso oferecendo uma plataforma de pesca portátil para águas rasas, mas exige adaptações específicas de equipamento.
  solution: Equipe um SUP estável com suportes de vara, um engradado de equipamento e um sistema de ancoragem. Use a portabilidade da prancha para alcançar pontos de pesca remotos que barcos não alcançam.
  audience: Pescadores que querem pescar em águas rasas, em locais remotos ou que preferem uma plataforma de pesca leve e portátil.
  steps:
    - Escolha uma prancha larga (34" ou mais) com capacidade de carga alta para o equipamento
    - Instale suportes de vara no convés usando sistemas de fixação por trilho ou correias
    - Use um engradado impermeável ou caixa térmica amarrada ao convés frontal para iscas e acessórios
    - Leve uma âncora pequena ou estaca de amarração para dias de vento
    - Use um colete salva-vidas com bolsos para ferramentas e telefone
    - Pratique arremessos de joelhos antes de pescar em pé
  faq:
    - q: Posso pescar em pé em um SUP?
      a: Sim. Uma prancha com 34" ou mais de largura oferece estabilidade suficiente para arremessar em pé. Pratique primeiro em água calma.
    - q: Quais peixes posso pescar de um SUP?
      a: SUPs são excelentes para black bass em lagos, robalos em planícies de maré, trutas em rios e espécies costeiras em baías e estuários.
    - q: Como desembarco um peixe de um SUP?
      a: Ajoelhe para ganhar estabilidade. Use um puçá ou pinça de boca. Mantenha o peixe baixo para não desequilibrar. Solte-o ou guarde-o na caixa térmica.

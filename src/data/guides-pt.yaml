- slug: how-to-choose-your-sup
  category: buying-guide
  title: Como escolher sua prancha de SUP
  description: Um guia completo para escolher a prancha de stand-up paddle certa com base no seu nível de habilidade, nas condições da água e no uso pretendido.
  tldr: Escolha seu SUP com base no nível de habilidade, no tipo de água e no uso principal. Pranchas polivalentes servem para iniciantes e águas calmas. Pranchas de touring são para remadas longas. Pranchas de yoga oferecem largura extra para estabilidade. Pranchas de desempenho funcionam para remadores experientes em condições variadas.
  problem: A maioria dos compradores de primeira viagem escolhe uma prancha de SUP pelo preço ou pela aparência, e não por como e onde vão realmente remar. Isso gera pouca estabilidade, desempenho insuficiente e uma experiência frustrante.
  solution: Combine o formato, o volume e a construção da prancha com seu nível de habilidade e seu ambiente aquático principal. Pranchas mais largas (32-34") oferecem estabilidade para iniciantes. Pranchas mais longas (12-14") mantêm melhor o rumo no touring. A construção drop-stitch a 12-15 PSI oferece rigidez comparável à das pranchas rígidas.
  audience: Compradores de primeira prancha de SUP, remadores recreativos e qualquer pessoa que esteja trocando uma prancha básica.
  steps:
    - Identifique seu ambiente principal de remada — lago, mar, rio ou misto
    - Combine a largura da prancha com seu nível — 32-34" para iniciantes, 30-32" para intermediários, 28-30" para avançados
    - Escolha o comprimento conforme o uso — mais curta para manobras, mais longa para rumo e velocidade
    - Selecione a construção — inflável drop-stitch para portabilidade, rígida para desempenho máximo
    - Verifique a capacidade de carga — seu peso mais o equipamento não deve ultrapassar 80% do limite da prancha
    - Confira os acessórios incluídos — bomba, leash, aleta, mochila e kit de reparo
  faq:
    - q: Qual largura de SUP é melhor para iniciantes?
      a: Entre 32 e 34 polegadas de largura oferece a plataforma mais estável para aprender. A SUP Explorer 11, com 33" de largura, é ideal para quem está estreando em águas calmas.
    - q: Prancha de SUP inflável ou rígida?
      a: As infláveis oferecem portabilidade, praticidade de armazenamento e absorção de impactos. As rígidas oferecem rigidez e velocidade máximas. Para a maioria dos usuários recreativos, uma inflável de qualidade com núcleo drop-stitch é a escolha prática.
    - q: Até quantos PSI devo inflar?
      a: As pranchas afarer recomendam 12-15 PSI. A 15 PSI a prancha atinge a rigidez máxima, comparável à de uma prancha rígida. Fique sempre dentro da faixa de pressão indicada na prancha.

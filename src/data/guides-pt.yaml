- slug: safety-tips
  category: safety
  title: Dicas de segurança para esportes aquáticos
  description: Diretrizes essenciais de segurança para o stand-up paddle — da verificação do equipamento à atenção ao clima.
  tldr: Use sempre um colete salva-vidas certificado CE, verifique o clima e as condições da água antes de sair, leve meios de comunicação, nunca reme sozinho em água desconhecida e conheça os limites nominais do seu equipamento.
  problem: A maioria dos acidentes em esportes aquáticos resulta de preparação inadequada — sem colete salva-vidas, ignorando avisos meteorológicos ou usando equipamento além dos limites de projeto.
  solution: Adote uma lista de verificação antes de sair — confira o estado do equipamento, verifique o clima e a temperatura da água, avise alguém sobre sua rota e use sempre flutuação adequada.
  audience: Todos os praticantes de stand-up paddle e esportes aquáticos.
  steps:
    - Verifique a previsão do tempo — evite ventos acima de 15 mph e tempestades
    - Confira a temperatura da água — água fria (abaixo de 60°F/15°C) exige roupa de neoprene ou roupa seca
    - Inspecione o equipamento — procure vazamentos, rachaduras e inflação correta
    - Use sempre um colete salva-vidas certificado CE
    - Prenda o leash no tornozelo ou na panturrilha
    - Deixe um plano de flutuação — avise alguém para onde você vai e quando volta
    - Leve comunicação — capa impermeável para o telefone ou rádio VHF
    - Conheça seus limites — fique dentro do seu nível de habilidade e das especificações do equipamento
  faq:
    - q: Preciso de colete salva-vidas em um SUP?
      a: Sim. Muitos lugares exigem legalmente colete salva-vidas em qualquer embarcação, incluindo SUPs. Mesmo onde não é obrigatório, um colete salva-vidas certificado CE é equipamento de segurança essencial.
    - q: Qual é a lesão mais comum em esportes aquáticos?
      a: A imersão em água fria e a exaustão são os riscos graves mais comuns. Vista-se sempre para a temperatura da água, não para a do ar.
    - q: Como sei se as condições são seguras?
      a: Use previsões meteorológicas marinhas. Verifique a velocidade do vento, a altura das ondas e a temperatura da água. Iniciantes devem ficar em condições com vento abaixo de 10 mph e ondas abaixo de 1 pé.

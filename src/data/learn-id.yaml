sup:
  title: Pengetahuan SUP — Panduan & Sumber Daya SUP Tiup | Afarer
  description: Pusat pengetahuan SUP lengkap yang mencakup panduan pemula, ukuran papan, tutorial teknik, tips keselamatan, dan teknologi SUP tiup.
  articles:
    - title: Dasar-Dasar SUP — Panduan Pemula
      desc: Semua yang perlu diketahui pemula — jenis papan, ukuran dayung, posisi berdiri, dan tips hari pertama.
      href: /learn/sup/
    - title: Panduan Ukuran SUP
      desc: Temukan panjang, lebar, dan volume papan yang tepat sesuai berat badan, kemampuan, dan gaya dayung Anda.
      href: /size-guide/
    - title: Papan Tiup vs Papan Keras
      desc: Mana yang tepat untuk Anda? Perbandingan portabilitas, performa, daya tahan, dan biaya.
      href: /compare/inflatable-vs-hardboard/
    - title: Teknik Menengah
      desc: Tingkatkan kemampuan mendayung Anda dengan ayunan dayung lanjutan, teknik belok, dan penanganan air bergelombang.
      href: /learn/intermediate-techniques/
    - title: Cara Memilih SUP Tiup
      desc: Telusuri faktor-faktor kunci — konstruksi, ketebalan, konfigurasi sirip, dan aksesori yang disertakan.
      href: /v2/how-to-choose-inflatable-sup/
    - title: Keselamatan di Air
      desc: Pengetahuan keselamatan penting termasuk membaca cuaca, pemilihan PFD, penyelamatan diri, dan dayung berkelompok.
      href: /learn/water-safety/
water-safety:
  title: Pengetahuan Keselamatan Air — Panduan Dayung yang Aman | Afarer
  description: Sumber daya keselamatan air yang komprehensif untuk SUP, berkayak, dan berperahu. Pelajari pemilihan PFD, membaca cuaca, penyelamatan diri, keselamatan air dingin, dan sertifikasi CE.
  articles:
    - title: Panduan Keselamatan Air
      desc: Pengetahuan keselamatan penting untuk setiap pendayung — cuaca, PFD, penyelamatan diri, dan protokol dayung berkelompok.
      href: /learn/water-safety/
    - title: Panduan Rompi Pelampung & PFD
      desc: Cara memilih alat pelampung pribadi yang tepat untuk SUP, berkayak, berperahu, dan penggunaan profesional.
      href: /v2/life-jacket-buying-guide/
    - title: Daftar Periksa Keselamatan SUP
      desc: Daftar periksa keselamatan yang harus dipatuhi setiap peselancar papan dayung sebelum memasuki air.
      href: /v2/sup-safety-guide/
    - title: Keselamatan Dayung di Air Dingin
      desc: Tindakan pencegahan penting, peralatan, dan teknik untuk mendayung dalam kondisi air dingin.
      href: /v2/cold-water-safety-guide/
    - title: Kesalahan Dayung Pemula
      desc: Kesalahan umum yang dilakukan pendayung pemula dan cara menghindarinya demi pengalaman yang lebih aman dan menyenangkan.
      href: /v2/beginner-sup-guide/
    - title: Penjelasan Sertifikasi CE
      desc: Apa arti sertifikasi CE bagi papan SUP tiup — standar, pengujian, dan mengapa hal itu penting bagi keselamatan.
      href: /trust/

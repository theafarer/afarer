sup-size-guide:
  title: Panduan Ukuran SUP — Cara Memilih Panjang, Lebar & Volume Papan yang Tepat
  description: Panduan ukuran SUP yang komprehensif, mencakup panjang, lebar, ketebalan, volume (liter) papan, serta pencocokan berat pengendara. Temukan ukuran SUP tiup yang tepat sesuai berat badan, tingkat kemampuan, dan aktivitas dayung Anda.

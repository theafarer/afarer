drop-stitch-core:
  title: Teknologi Inti Drop-Stitch — Bagaimana SUP Tiup Mencapai Kekakuan
  description: 'Kajian mendalam tentang teknologi konstruksi drop-stitch: bagaimana ribuan benang poliester menciptakan platform tiup yang kaku pada 15-25 PSI. Kepadatan benang, integrasi kain, proses manufaktur, dan perbandingan performa.'
  articles: []
inflatable-technology:
  title: Teknologi SUP Tiup — Material, Konstruksi & Rekayasa
  description: Bagaimana papan SUP tiup dibuat — susunan lapisan material, inti drop-stitch, sistem katup, pengelasan RF, dan pengujian kualitas. Pahami apa yang menjadikan produk tiup tahan lama dan berperforma tinggi.
  articles: []
intermediate-techniques:
  title: Teknik SUP & Kayak Menengah — Melampaui Dasar-Dasar
  description: Tingkatkan keterampilan mendayung Anda dengan ayunan dayung lanjutan, penanganan air bergelombang, manajemen angin, teknik penyelamatan diri, dan etika dayung berkelompok. Untuk pendayung yang siap melampaui kemampuan pemula.
  articles: []
materials:
  title: Material SUP Tiup — PVC, EVA & Kain Drop-Stitch
  description: 'Panduan komprehensif tentang material yang digunakan dalam manufaktur SUP tiup: PVC kelas militer, dek busa EVA, kain drop-stitch, serat karbon, dan paduan aluminium. Spesifikasi, aplikasi, dan kriteria pemilihan.'
  articles: []

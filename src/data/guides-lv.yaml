  tldr: Bērni no 6 gadu vecuma var braukt uz SUP kopā ar pieaugušo. Bērni no 10 gadu vecuma var uzraudzībā airēt ar savu dēli. Izmantojiet platu, stabilu dēli, vienmēr valkājiet PFD, palieciet seklā, mierīgā ūdenī un turiet sesijas īsas (maksimāli 30-45 minūtes).
  problem: Vecāki vēlas dalīties ūdens sportā ar saviem bērniem, taču uztraucas par drošību, ekipējuma atbilstību un to, kā noturēt bērnus iesaistītus.
  solution: Izmantojiet pareizo dēļa izmēru braukšanai divatā, pārliecinieties, ka katrs bērns valkā pareizi pielāgotu PFD, sāciet seklā, siltā ūdenī un padariet to jautru ar spēlēm un īsām sesijām.
  audience: Vecāki, kas vēlas iepazīstināt savus bērnus ar airēšanu ar dēli.
  steps:
    - 'Vecums 4-6: brauciet kā pasažieris uz pieaugušā dēļa — sēdiet priekšpusē, turieties pie centra roktura'
    - 'Vecums 6-10: ceļos vai sēdus uz sava dēļa ar pieaugušā uzraudzību un drošības saiti'
    - 'Vecums 10+: airē ar savu dēli, pieaugušajam uzraugot tuvumā'
    - Vienmēr valkājiet PFD — bērniem visu laiku jāvalkā pareizi pielāgota glābšanas veste
    - Palieciet seklā ūdenī (pieaugušajam līdz jostas vietai)
    - Turiet sesijas īsas — bērniem līdz 10 gadu vecumam maksimāli 30-45 minūtes
    - Padariet to jautru — spēlējiet spēles, meklējiet zivis, trenējiet celšanos kājās
  faq:
    - q: No kāda vecuma bērns var airēt ar SUP viens pats?
      a: Aptuveni no 10-12 gadu vecuma ar uzraudzību, atkarībā no bērna peldēšanas iemaņām un pašsajūtas ūdenī. Vienmēr mierīgos, seklos apstākļos.
    - q: Kurš dēlis ir vislabākais SUP braucieniem ar bērniem?
      a: Plats dēlis (34"+) ar lielu svarnespēju braukšanai divatā. SUP Explorer 11 33" platums un 220 lb svarnespēja labi der vecākam kopā ar bērnu.
    - q: Kādu drošības ekipējumu vajag bērniem?
      a: Pareizi pielāgota CE sertificēta glābšanas veste, drošības saite (braukšanai divatā piestiprināta pie pieaugušā dēļa), sauļošanās līdzeklis un cepure.

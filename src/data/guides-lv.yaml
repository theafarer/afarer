    - Meklējiet pastiprinātu malu konstrukciju un militārās kvalitātes PVC
    - Izvēlieties dēli ar 2+ gaisa kamerām dublēšanai caurduršanas gadījumā
    - Izmantojiet taisnu upes drošības saiti, kas piestiprināta pie jostas ar ātro atvēršanu
    - Valkājiet ķiveri, PFD un upēm piemērotus apavus
    - Sāciet ar I klases krācēm un pakāpeniski palieliniet grūtības kopā ar pieredzējušu partneri
  faq:
    - q: Vai krācēm var izmantot parastu SUP?
      a: Nav ieteicams. Standarta SUP trūkst triecienizturības, un tie uz akmeņiem var delaminēties. Vairāku kameru drošība upju apstākļos ir izšķiroši svarīga.
    - q: Kāds PSI vajadzīgs krāču SUP?
      a: 15+ PSI maksimālajai stingrībai. Cietāks dēlis labāk atlēdz no akmeņiem nekā nepietiekami piepūstais, kas apliec ap šķēršļiem.
    - q: Vai krāču SUP vajag īpašas airēšanas iemaņas?
      a: Jā. Upes nolasīšana, griezieni pretstraumēs, pārvietošanās pāri straumei un balsta vēzieni ir būtiskas iemaņas. Pirms mēģināt II+ klasi, apmeklējiet krāču SUP apmācības kursu.

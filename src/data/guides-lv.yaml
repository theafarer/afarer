- slug: sup-board-materials
  category: technical
  title: SUP dēļu materiāli — PVC, EPS, epoksīda un pītās diegu tehnoloģijas skaidrojums
  description: 'Tehnisks ceļvedis par SUP konstrukcijas materiāliem: pītās diegu PVC piepūšamie dēļi pret EPS putu kodola cietajiem dēļiem. Izprotiet, kas liek katram tipam uzvesties atšķirīgi.'
  tldr: Piepūšamie SUP izmanto pīto diegu PVC ar tūkstošiem iekšējo diegu stingrībai. Cietie dēļi izmanto EPS putu kodolu ar epoksīda vai stiklaplasta čaulu. Piepūšamie uzvar pārvadājamībā un izturībā. Cietie uzvar ātrumā un sajūtās. Mūsdienīgā pītā diegu tehnoloģija pie 15 PSI ir līdzvērtīga cietā dēļa stingrībai.
  problem: Pircēji nesaprot būtiskās konstrukcijas atšķirības starp piepūšamajiem un cietajiem dēļiem, kas noved pie nepareiziem pirkuma lēmumiem.
  solution: 'Piemērojiet dēļa materiālu galvenajam lietojumam: pītās diegu piepūšamais dēlis ceļošanai, uzglabāšanai un izturībai. EPS/epoksīds — sacīkstēm, sērfošanai un maksimālai veiktspējai.'
  audience: SUP pircēji, kas salīdzina piepūšamo un cietā dēļa konstrukciju.
  steps:
    - 'Piepūšamais pītās diegu: tūkstošiem poliestera diegu savieno augšējo un apakšējo slāni, radot stingru struktūru, kad tiek sasniegts spiediens 12-15 PSI'
    - 'Cietais EPS putas: paplašinātā polistirola kodols, veidots pēc korpusa dizaina, noslēgts ar epoksīda sveķiem un stiklaplasta slāņiem'
    - 'Piepūšamā priekšrocības: salokāms, praktiski nesalaužams, viegls pārvadāšanai, mīkstas malas drošībai'
    - 'Cietā dēļa priekšrocības: mazāks kopējais svars, stingrāka platforma, labāka slīdēšanas efektivitāte, atsaucīgāks'
    - 'Hibrīda iespējas: daži ražotāji apvieno pītās diegu konstrukciju ar stingriem paneļiem, lai apvienotu abu tipu priekšrocības'
  faq:
    - q: Vai piepūšamie SUP ir tik stingri kā cietie dēļi?
      a: Pie 15 PSI ar kvalitatīvu pītās diegu konstrukciju mūsdienu piepūšamie dēļi ir ļoti tuvu tam. Lielākā daļa atpūtas airētāju starpību nesajūt. Sacīkšu airētāji pamanīs cietā dēļa priekšrocību.
    - q: Kurš materiāls kalpo ilgāk?
      a: Piepūšamie SUP ar rūpīgu kopšanu kalpo 5-10 gadus. Cietie dēļi kalpo 10-20 gadus, taču ir jutīgi pret plaisām, iedobumiem un ūdens piesūkšanos. Piepūšamie ikdienā ir izturīgāki pret bojājumiem.
    - q: Vai PVC ir videi draudzīgs?
      a: PVC ražošanai ir ietekme uz vidi, taču piepūšamie SUP kalpo ilgāk (mazāk nomaiņu) un salocās mazākā izmērā (mazāk transporta emisiju). Vecos dēļus vienmēr nododiet atbilstošai pārstrādei.

    - Izvēlieties dēli ar platumu 34" vai lielāku pietiekamai stabilitātei
    - Izvēlieties garumu 11'6" vai garāku, lai nodrošinātu pietiekamu ūdensizspaidi
    - 'Pārbaudiet maksimālo slodzi: kopējā slodze nedrīkst pārsniegt 80% no maksimālās'

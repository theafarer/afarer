- slug: paddling-techniques
  category: tutorial
  title: Būtiskās SUP airēšanas tehnikas
  description: Apgūstiet priekšējo airējumu, apļveida airējumu un pagriezienu ar airi pāri priekšgalam, lai jebkādos apstākļos airētu efektīvi.
  tldr: Priekšējais airējums izmanto ķermeņa kodolu, nevis rokas. Apļveida airējums pagriež dēli. Pagrieziens ar airi pāri priekšgalam ir visefektīvākais griešanās paņēmiens. Turiet airi vertikāli un pilnībā iegremdējiet aira lapu maksimālam spēka pārvadam.
  problem: Vairums airētāju izmanto ar rokām dominētus airējumus, kas izšķērdē enerģiju un izraisa plecu nogurumu. Slikta tehnika arī apgrūtina dēļa vadību vējā un sacirstos viļņos.
  solution: Iemācieties trīs būtiskos airējumus — priekšējo, apļveida un pagriezienu ar airi pāri priekšgalam — ar pareizu ķermeņa mehāniku. Katru no tiem vingriniet mierīgā ūdenī, pirms pārejat uz sarežģītākiem apstākļiem.
  audience: Airētāji, kas vēlas airēt ilgāk, ātrāk un ar mazāk noguruma.
  steps:
    - 'Priekšējais airējums: sniedzieties uz priekšu, pilnībā iegremdējiet aira lapu, velciet atpakaļ, izmantojot rumpja rotāciju (nevis rokas), izceliet airi pie potītes līmeņa'
    - 'Apļveida airējums: sniedzieties uz priekšu pie borta, veiciet ar aira lapu platu loku līdz aizmugurei, pagriežot dēli prom no aira puses'
    - 'Pagrieziens ar airi pāri priekšgalam: novietojiet airi pretējā dēļa pusē, nemainot roku satveršanu, un velciet uz aizmuguri'
    - 'Atbalsts: sacirstos viļņos izmantojiet zemo atbalstu stabilitātei — plakaniski uzsitiet aira lapu pa ūdens virsmu'
    - 'Pievilkšanas airējums: sniedzieties uz sānu, velciet dēli sāniski uz aira pusi'
  faq:
    - q: Kā airēt taisnā līnijā?
      a: Izmantojiet vienādu airējumu garumu abās pusēs. Mainiet puses ik pēc 5-10 airējumiem. Orientējieties pēc fiksēta punkta horizontā.
    - q: Vai jāliec ceļgali?
      a: Jā. Turiet ceļgalus nedaudz saliektus — tie darbosies kā amortizatori. Iztaisnoti ceļgali nodod katru šūpošanos jūsu ķermenim un samazina stabilitāti.
    - q: Kā airēt pret vēju?
      a: Zemāk nolieciet ķermeni, izmantojiet īsākus un ātrākus airējumus un palieciet tuvāk krastam, kur vējš bieži vien ir vājāks. Ja vējš ir pārāk stiprs, neizbrauciet.

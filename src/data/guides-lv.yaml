  problem: Standarta SUP maksimālā slodze ir 200-250 lbs, kas izslēdz daudzus airētājus. Braukšana uz par maza dēļa ir neērta, nestabila un potenciāli bīstama.
  solution: Izvēlieties dēļus ar atļautu slodzi 300+ lbs un papildu platumu stabilitātei. afarer sērijas Tropical Breeze un Leviathan Wake piedāvā tilpumu un pastiprinājumu, kas lielāka auguma airētājiem nepieciešams.
  audience: Airētāji, kas sver vairāk par 200 lbs un kuriem vajag dēli, kas droši iztur viņu svaru.

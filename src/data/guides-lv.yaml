- slug: sup-weight-capacity
  category: buying-guide
  title: SUP svara ietilpības ceļvedis — cik daudz svara var nest SUP?
  description: Izpratne par SUP svara ietilpības robežām, kā aprēķināt savu kopējo slodzi un kāpēc robežas pārsniegšana ietekmē veiktspēju un drošību.
  tldr: Nekad nepārsniedziet 80% no dēļa maksimālās svara ietilpības ar sava ķermeņa svaru un ekipējumu. Dēlis ar 220 lb ietilpību ir piemērots 160 lb smagam airētājam ar vieglu ekipējumu. Robežas pārsniegšana izraisa svārstīgu šūpošanos, gausu vadāmību un paaugstinātu bojājumu risku.
  problem: Airētāji bieži pārsniedz sava dēļa svara ietilpību, kas noved pie vājas veiktspējas, iegrimšanas un iespējamiem dēļa bojājumiem. Ražotāji norāda maksimālās robežas, taču nepaskaidro drošās darba slodzes.
  solution: Aprēķiniet savu kopējo slodzi (ķermeņa svars + ekipējums + ar dēli uzsūktais ūdens) un uzturieties zem 80% no deklarētās maksimālās ietilpības. Smagākiem airētājiem nepieciešami lielāka tilpuma dēļi ar ietilpību 300+ lb.
  audience: Visu izmēru airētāji, īpaši lielāka auguma airētāji un tie, kuri līdzi nes ekspedīciju ekipējumu.
  steps:
    - Atrodiet maksimālo svara ietilpību, kas norādīta uz jūsu dēļa (parasti pie vārsta)
    - Nosveriet sevi un visu ekipējumu, tostarp airi, PFD, sausās somas, auksto kasti un piederumus
    - 'Aprēķiniet: (jūsu kopējā slodze) ÷ (maksimālā ietilpība) × 100 = izmantotās ietilpības %'
    - Mērķējiet uz 70-80% optimālai veiktspējai un drošībai
    - Ja pārsniedzat 80%, izvēlieties lielāku dēli vai samaziniet ekipējumu
  faq:
    - q: Kas notiek, ja pārsniegšu svara robežu?
      a: Dēlis sēž zemāk ūdenī, radot lielāku pretestību. Stabilitāte samazinās, priekšgals var iegrimt, un pīto diegu kodols viļņainā ūdenī ir pakļauts lielākam bojājumu riskam.
    - q: Vai vienā SUP var braukt divi cilvēki?
      a: Tikai tad, ja kopējais svars nepārsniedz 80% no ietilpības. Vairums standarta SUP ir paredzēti vienam braucējam. Braukšana tandēmā prasa dēli, kas īpaši paredzēts diviem braucējiem.
    - q: Vai piepūšamajiem SUP ir mazāka ietilpība nekā cietajiem dēļiem?
      a: Kvalitatīviem piepūšamajiem dēļiem ar pītās diegu konstrukciju ir salīdzināma vai pat lielāka svara ietilpība nekā cietajiem dēļiem, pateicoties to biezākajam tilpuma sadalījumam.

- slug: sup-yoga
  category: lifestyle
  title: 'SUP joga: pilnīgs ceļvedis airēšanai un jogai'
  description: Apvienojiet airēšanu ar dēli ar jogu, lai uzlabotu līdzsvaru, spēku un apzinātību uz ūdens.
  tldr: SUP joga pievieno nestabilitātes elementu, kas, salīdzinot ar jogu uz sauszemes, strauji palielina ķermeņa centra aktivizāciju. Sāciet ar pamatpozām uz plata, stabila dēļa mierīgā ūdenī. Izmantojiet pretslīdes klājuma paklājiņu. Nekad nepraktizējiet SUP jogu vieni paši.
  problem: Tradicionālie jogas paklājiņi nodrošina pilnīgi stabilu virsmu, atceļot līdzsvara izaicinājumu, kas padara SUP jogu unikāli efektīvu ķermeņa centra spēkam un koncentrācijai.
  solution: Izmantojiet īpaši platu SUP dēli (34"+) ar pilna klājuma pretslīdes paklājiņu. Praktizējiet mierīgā, seklā ūdenī. Sāciet ar pamatpozām, pirms mēģināt apgrieztās pozas.
  audience: Jogas praktizētāji un airētāji, kas vēlas apvienot līdzsvara treniņu ar apzinātību.
  steps:
    - Nostipriniet dēli seklā, mierīgā ūdenī — izmantojiet smilšu enkuru vai piesieniet to pie piestātnes
    - Sāciet ar sēdošām pozām — vienkāršais sēdus stāvoklis, laivas poza, sēdus grieziens
    - Pārejiet uz ceļos stāvošām pozām — galda poza, kaķis–govs, zibens poza
    - Pārejiet uz stāvošām pozām — kalna poza, karotājs I, karotājs II, koka poza
    - Praktizējiet līdzsvara pozas — pusmēness poza, ērgļa poza, dejotāja poza
    - Noslēdziet ar šavasānu — guliet izstiegti uz dēļa un izjūtiet ūdens kustību
  faq:
    - q: Kurš dēlis ir vislabākais SUP jogai?
      a: Plats dēlis (34"+) ar pilna garuma pretslīdes paklājiņu nodrošina visstabilāko platformu. SUP Tour 12 piedāvā labu stabilitātes un slīdēšanas līdzsvaru.
    - q: Vai SUP joga ir bīstama?
      a: Ne vairāk kā joga uz sauszemes, ja to praktizē droši. Izmantojiet mierīgu, seklu ūdeni. Valkājiet drošības saiti. Praktizējiet kopā ar partneri. Pirmajās sesijās izvairieties no dziļa ūdens.
    - q: Vai man nepieciešams īpašs ekipējums?
      a: Plats, stabils dēlis, pilna klājuma pretslīdes paklājiņš, drošības saite un PFD. Daži praktizētāji papildu tvērienam izmanto ūdensnecaurlaidīgu paklājiņu.

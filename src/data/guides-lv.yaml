- slug: sup-fitness
  category: lifestyle
  title: 'SUP fitness: visa ķermeņa treniņš uz ūdens'
  description: Kā airēšana ar dēli stāvus veido ķermeņa centra spēku, līdzsvaru un sirds-asinsvadu izturību.
  tldr: SUP ar katru aira vilcienu iesaista ķermeņa centru, kājas, muguru un plecus. Vienas stundas sesija sadedzina 300-500 kalorijas. Airēšana pret vēju vai straumi divkāršo intensitāti. SUP joga pievieno lokanības un līdzsvara treniņu.
  problem: Daudzi cilvēki uzlūko airēšanu ar dēli kā izklaidējošu aktivitāti, nevis pilnvērtīgu fitnesa rīku, un neizmanto tās potenciālu visa ķermeņa kondicionēšanai.
  solution: 'Strukturējiet SUP sesijas ar konkrētiem fitnesa mērķiem: izturības airēšana sirds-asinsvadu treniņam, intervālu sprinti spēkam, SUP joga lokanībai un distances airēšana muskuļu izturībai.'
  audience: Fitnesa entuziasti, kas meklē zemas slodzes un augstas iesaistes visa ķermeņa treniņu.
  steps:
    - Uzsildieties uz sauszemes — roku riņķošana, rumpja griešana un kāju šūpošana 5 minūtes
    - Sāciet ar 10 minūtēm vienmērīgas airēšanas ar mērenu intensitāti
    - Pārejiet uz intervālu treniņu — 2 minūtes intensīvas airēšanas, 2 minūtes vieglas atjaunošanās
    - Iekļaujiet SUP jogas pozas — suņa pozu ar skatu uz leju, karotāja II pozu un koka pozu uz dēļa
    - Noslēdziet ar vieglu airēšanu un statiskiem stiepieniem uz dēļa
  faq:
    - q: Vai SUP fitnesam ir labāks nekā skriešana?
      a: SUP sniedz salīdzināmus sirds-asinsvadu ieguvumus ar mazāku slodzi locītavām. Tas arī daudz vairāk iesaista augšējo ķermeni un ķermeņa centru nekā skriešana.
    - q: Cik daudz kaloriju sadedzina SUP?
      a: Aptuveni 300-500 kalorijas stundā ar mērenu intensitāti. Sacensību airēšana vai airēšana pret vēju var sadedzināt 600-800 kalorijas stundā.
    - q: Vai ar SUP var attīstīt muskuļus?
      a: Jā. Airēšana attīsta plecu, muguras un ķermeņa centra muskuļus. Līdzsvara noturēšana iesaista kājas un stabilizējošos muskuļus. Tas ir visa ķermeņa pretestības treniņš.

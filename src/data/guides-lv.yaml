- slug: beginner-guide
  category: tutorial
  title: Iesācēja ceļvedis airēšanai ar SUP dēli
  description: Viss, kas jums jāzina pirms pirmās airēšanas sesijas ar SUP dēli — no ekipējuma sagatavošanas līdz pamata airēšanas tehnikām.
  tldr: Sāciet mierīgā, līdenā ūdenī ar platu, stabilu dēli. Uzpumpējiet līdz 12-15 PSI, piestipriniet drošības saiti un izmantojiet pareizu aira garumu (par 6-8" garāku par jūsu augumu). Turiet kājas plecu platumā, ceļgalus nedaudz saliektus un skatieties uz horizontu.
  problem: Jaunie airētāji bieži izlaiž pamatīgu sagatavošanos — nepareizs aira garums, sliktā stāja vai nelīdzena ūdens izvēle — kas noved pie kritieniem, vilšanās un motīvācijas zuduma.
  solution: 'Ievērojiet strukturētu pirmās sesijas plānu: izvēlieties mierīgu ūdeni, pareizi sagatavojiet ekipējumu, vingriniet uz ceļiem, pirms pieceļaties, un apgūstiet priekšējo airējumu, pirms mēģināt pagriezt.'
  audience: Pilnīgi iesācēji, kas nekad iepriekš nav airējuši ar SUP dēli.
  steps:
    - Izvēlieties līdenu, mierīgu ūdeni bez kuģu satiksmes — mazs ezers vai pasargāts līcis ir ideāls
    - Uzpumpējiet dēli līdz 12-15 PSI ar divkāršās darbības sūkni
    - Piestipriniet atsperīgo drošības saiti pie potītes vai ikra, nekad pie dēļa roktura
    - Ievietojiet fini un pievelciet skrūvi
    - Pielāgojiet aira garumu — tam jābūt par 6-8 collām garākam par jūsu augumu
    - Sāciet uz ceļgaliem uz dēļa, paairējiet dažus airējumus, lai justu līdzsvaru
    - Pieceļieties pa vienai kājai, kājas plecu platumā, ceļgali mīksti
    - Skatieties uz horizontu, nevis uz kājām — jūsu dēlis dodas tur, kur jūs skatāties
  faq:
    - q: Ko vilkt mugurā airēšanai ar SUP dēli?
      a: Ātri žūstošs sporta tērps, glābšanas veste, sauļošanās līdzeklis un cepure. Aukstā ūdenī valkājiet hidrotērpu. Vienmēr nēsājiet drošības saiti un nēsājiet līdz telefonu ūdensnecaurlaidīgā futrālī.
    - q: Kā uzrāpties atpakaļ uz dēļa, ja iekrītu ūdenī?
      a: Saglabājiet mieru. Aizpeldiet līdz dēlim, satveriet centrālo rokturi un, spēcīgi strādājot ar kājām, vienā kustībā uzvelcieties uz dēļa. Vispirms atgriezieties uz ceļiem, pēc tam pieceļaties.
    - q: Kādi vēja apstākļi ir droši?
      a: 'Iesācējiem: vējš līdz 10 mph (5 mezgli). Ja vējš pūš prom no krasta, neizbrauciet. Pārbaudiet prognozi un ņemiet vērā, ka vējš no krasta ir bīstams.'

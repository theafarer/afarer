- slug: choosing-paddle
  category: buying-guide
  title: Kā izvēlēties pareizo SUP airi
  description: Ceļvedis airu materiālos, spārnu formās, kātu veidos un izmēru noteikšanā SUP.
  tldr: 'Aira garums: SUP airiem jābūt par 6-8" garākiem par jūsu augumu. Spārna forma: dihedrālie spārni tur taisnu virzienu, plakanie spārni nodrošina vairāk tvēriena. Kāta materiāls: oglekļa šķiedra ir vieglākā, stiklšķiedra — labākā vērtība, alumīnijs — budžeta variants.'
  problem: Nepareiza aira izmēra vai materiāla izmantošana izraisa lieku nogurumu, sliktu vilciena efektivitāti un locītavu slodzi.
  solution: Pielāgojiet aira garumu, spārna formu, kāta materiālu un stingrību savam airēšanas stilam, ķermeņa izmēram un budžetam.
  audience: SUP airētāji, kas izvēlas savu pirmo vai nākamo airi.
  steps:
    - Izmēriet aira augstumu — par 6-8" garāks par jūsu augumu vispārējai airēšanai
    - Izvēlieties spārna materiālu — neilons budžetam, stiklšķiedra labai vērtībai, oglekļa šķiedra veiktspējai
    - Izvēlieties spārna formu — dihedrāla vienmērīgai virzībai, plakana spēkam, karotes forma sacensībām
    - Izvēlieties kāta veidu — taisns vispārējai lietošanai, liekts sacensību SUP
    - Pārbaudiet stingrību — stingrākie kāti pārvada vairāk jaudas, lokanie kāti mazina locītavu slodzi
  faq:
    - q: Kāds ir labākais aira materiāls?
      a: Stiklšķiedra piedāvā labāko svara, izturības un izmaksu līdzsvaru. Oglekļa šķiedra ir vieglāka, bet dārgāka un trauslāka. Neilons ir smags, taču praktiski neiznīcināms.
    - q: Kā uzzināt, vai mans airis ir pareizā garumā?
      a: Novietojiet airi vertikāli sev blakus — rokurim jāsniedzas jūsu plaukstas locītavai, kad roka pacelta virs galvas.
    - q: Vai man jāiegādājas viengabala vai regulējams airis?
      a: Regulējamie airi ir labi kopīgai lietošanai un ceļojumiem. Viengabala airi ir vieglāki, stingrāki un efektīvāki pastāvīgai lietošanai.

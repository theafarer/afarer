- slug: sup-fishing
  category: lifestyle
  title: 'SUP makšķerēšanas ceļvedis: kā makšķerēt no SUP dēļa'
  description: Viss, kas jums jāzina par makšķerēšanu no dēļa — ekipējuma sagatavošana, stabilitātes padomi un tehnikas.
  tldr: SUP makšķerēšana piedāvā klusu piekļuvi, iespēju rīkoties seklā ūdenī un metienus 360 grādu leņķī. Izmantojiet platu, stabilu dēli (34"+), piestipriniet makšķeru turētājus un izmantojiet dzesētājkasti vai krātuvi kā ekipējuma klāju. Enkurojieties vējainos apstākļos. Vienmēr valkājiet PFD.
  problem: Parastās makšķerēšanas laivas ir dārgas uzturēšanā un nespēj piekļūt seklam ūdenim. SUP makšķerēšana to atrisina, piedāvājot pārvadājamu makšķerēšanas platformu seklam ūdenim, taču tā prasa īpašu ekipējuma pielāgošanu.
  solution: Aprīkojiet stabilu SUP ar makšķeru turētājiem, ekipējuma kasti un enkuru sistēmu. Izmantojiet dēļa pārvadājamību, lai piekļūtu attālinātām makšķerēšanas vietām, kurām laivas nespēj piekļūt.
  audience: Makšķernieki, kas vēlas makšķerēt seklās ūdenstilpēs vai attālinātās vietās, vai dod priekšroku vieglai, pārvadājamai makšķerēšanas platformai.
  steps:
    - Izvēlieties platu dēli (34"+) ar lielu svarnespēju ekipējumam
    - Uzstādiet uz klājuma makšķeru turētājus, izmantojot uz sliedes montētas vai ar siksnām piestiprināmas sistēmas
    - Izmantojiet ūdensnecaurlaidīgu kasti vai dzesētājkasti, kas ar siksnām piestiprināta pie priekšējā klājuma, makšķerēšanas piederumiem
    - Paņemiet līdzi nelielu enkuru vai nostiprināšanas kārti vējainiem apstākļiem
    - Valkājiet PFD ar kabatām rīkiem un telefonam
    - Trenējiet metienus no ceļos stāvošas pozīcijas, pirms celaties kājās
  faq:
    - q: Vai uz SUP var stāvēt un makšķerēt?
      a: Jā. Plats 34"+ dēlis nodrošina pietiekamu stabilitāti stāvēšanai un metieniem. Vispirms trenējieties mierīgā ūdenī.
    - q: Kādas zivis var makšķerēt no SUP?
      a: SUP dēļi ir lieliski asaru makšķerēšanai ezeros, sarkanajām zivīm seklajos sēkļos, forelēm upēs un piekrastes sugām līčos un upju grīvās.
    - q: Kā no SUP izvilkt lomu?
      a: Nometieties ceļos, lai iegūtu stabilitāti. Izmantojiet savācējtīklu vai lūpu satvērēju. Turiet zivi zemu, lai neiekritu ūdenī. Atlaidiet to vai novietojiet dzesētājkastē.

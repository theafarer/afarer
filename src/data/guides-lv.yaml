- slug: sup-inflation-psi-guide
  category: technical
  title: SUP piepūšanas ceļvedis — optimālais PSI veiktspējai un drošībai
  description: 'Pilnīgs ceļvedis par SUP piepūšanas spiedienu: ieteicamie PSI diapazoni, kā spiediens ietekmē veiktspēju un padomi pareizai sūkņa lietošanai.'
  tldr: Piepūtiet līdz 12-15 PSI vairumam piepūšamo SUP. Augstāks spiediens = lielāka stingrība, bet lēnāka piepūšana. Zemāks spiediens = mīkstāka sajūta, bet lielāka lokanība. Nekad nepārsniedziet maksimālo PSI, kas norādīts uz jūsu dēļa. Izmantojiet sūkni ar precīzu manometru. Auksts gaiss samazina spiedienu, karsta saule to palielina.
  problem: Nepietiekami piepūsti dēļi šķiet gausi un pārlieku lokani. Pārpūsti dēļi rada šuvju plīšanas risku. Daudzi airētāji PSI uzmin, nevis precīzi izmēra.
  solution: Izmantojiet sūkni ar iebūvētu manometru. Mērķējiet uz 15 PSI maksimālai stingrībai. Pārbaudiet spiedienu pirms katras sesijas — temperatūras izmaiņas būtiski ietekmē PSI.
  audience: Visi piepūšamo SUP īpašnieki.
  steps:
    - Pārbaudiet ieteikto PSI diapazonu, kas norādīts uz jūsu dēļa pie vārsta
    - Izmantojiet divdarbības sūkni un piepūtiet līdz ieteicamā diapazona vidum
    - Pārejiet uz viendarbības režīmu pēdējiem 3-4 PSI precīzākai kontrolei
    - Pārbaudiet spiedienu ar manometru — analogie manometri ir uzticamāki nekā digitālie
    - 'Pielāgojiet spiedienu apstākļiem: augstāks PSI tūrismam/sacīkstēm, zemāks PSI putainam ūdenim/akmeņainām iekāpšanas vietām'
    - Atkārtoti pārbaudiet spiedienu, kad dēlis ir stāvējis 10 minūtes — temperatūras līdzsvars maina PSI
  faq:
    - q: Vai varu pārpūst savu SUP?
      a: Jā. Pārsniedzot nominālo maksimālo PSI (parasti 15-18 PSI), var izraisīt šuvju delamināciju un pītā diegu kodola bojājumus. Vienmēr palieciet norādītajā diapazonā.
    - q: Vai temperatūra ietekmē PSI?
      a: Būtiski. Dēlis, kas pie 70°F piepūsts līdz 15 PSI, tiešos saules staros pie 95°F var sasniegt 18 PSI. Auksts ūdens var pazemināt spiedienu līdz 12 PSI. Pārbaudiet spiedienu pēc vides apstākļu izmaiņām.
    - q: Kāds PSI iesācējiem?
      a: 12-13 PSI mācīšanās laikā nodrošina nedaudz mīkstāku platformu, kas ir piedodošāka kritieniem. Palieliniet līdz 15 PSI, uzlabojoties prasmēm.

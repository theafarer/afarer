- slug: sup-size-guide
  category: buying-guide
  title: SUP izmēru ceļvedis — kā izvēlēties pareizos dēļa izmērus
  description: Pilnīgs SUP izmēru ceļvedis, kas ietver garuma, platuma un biezuma ieteikumus atbilstoši jūsu svaram, augumam, prasmju līmenim un airēšanas stilam.
  tldr: Iesācējiem nepieciešami platāki dēļi (32-34") stabilitātei. Smagākiem airētājiem nepieciešami garāki dēļi (11'+) ar lielāku tilpumu. Tūrismam vajadzīgi garāki korpusi (12'+). Jogai nepieciešams papildu platums (34"+). Vienmēr pārbaudiet svara ietilpību — jūsu svars kopā ar ekipējumu nedrīkst pārsniegt 80% no maksimālās ietilpības.
  problem: Nepareiza SUP izmēra izvēle noved pie sliktas stabilitātes, vājas kursa noturības un vilšinošas airēšanas pieredzes. Vairums pircēju pirmajā reizē izvēlas vizuāli pievilcīgu dēli, neapsverot, kā izmēri ietekmē veiktspēju.
  solution: 'Piemērojiet dēļa garumu, platumu un biezumu savam svaram, prasmju līmenim un galvenajam lietojumam. Izmantojiet mūsu izmēru kalkulatoru: saskaitiet savu svaru un ekipējuma svaru, pēc tam izvēlieties dēli, kuram ir vismaz 20% rezerves virs šīs summas.'
  audience: SUP pircēji pirmajā reizē, airētāji, kas pāriet uz specializētu dēli, un ikviens, kurš nav pārliecināts par izmēru izvēli.
  steps:
    - Nosverieties kopā ar visu ekipējumu, ko nesat līdzi (airis, PFD, sausā soma)
    - Pievienojiet 20% drošības rezervi, lai noteiktu minimālo svara ietilpību
    - 'Izvēlieties platumu atbilstoši prasmēm: 32-34" iesācējiem, 30-32" vidēja līmeņa airētājiem, 28-30" pieredzējušajiem'
    - 'Izvēlieties garumu atbilstoši lietojumam: 10''6"-11''6" universālai lietošanai, 12''-14'' tūrismam, 9''-10'' putainam ūdenim'
    - 'Pārbaudiet biezumu: 6" standarta, 4" veiktspējai, 5" universālai lietošanai'
    - Pārbaudiet sava dēļa ieteikto PSI diapazonu optimālai stingrībai
  faq:
    - q: Kāds SUP platums ir vispiemērotākais iesācējiem?
      a: Platums no 32 līdz 34 collām nodrošina visstabilāko platformu. Jo platāks ir dēlis, jo vieglāk uz tā noturēt līdzsvaru — īpaši smagākiem airētājiem.
    - q: Kā saprast, ka SUP man ir par mazu?
      a: Ja dēlis sēž zemi ūdenī, reaģē gausi vai tā priekšgals airējot viegli iegrimst, visticamāk, tas ir par mazu jūsu svaram.
    - q: Vai dēļa garums ietekmē ātrumu?
      a: Jā. Garāks ūdenslīnijas garums palielina teorētisko korpusa ātrumu. Ar vienu un to pašu airētāja piepūli 14' gara tūrisma dēlis ir ievērojami ātrāks nekā 10' garš universālais dēlis.

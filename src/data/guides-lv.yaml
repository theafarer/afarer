  category: maintenance
  title: Kā salabot piepūšamo SUP
  description: Soli pa solim ceļvedis caurumu, vārstu problēmu un šuvju bojājumu labošanai piepūšamajos SUP dēļos.
  tldr: Mazus caurumus (mazākus par 1/4") var salabot ar komplektā iekļauto lāpīšanas komplektu. Notīriet vietu, uzklājiet PVC līmi, piepresējiet lāpas un gaidiet 24 stundas. Vārstu noplūdes parasti prasa O-gredzena nomaiņu. Lieli plīsumi vai šuvju delaminācija prasa profesionālu servisu.
  problem: Mazi caurumi un vārstu problēmas ir izplatītas, taču viegli novēršamas. Bez pareizas labošanas tehnikas lietotāji vai nu pārmaksā par profesionālu servisu, vai padara bojājumu vēl sliktāku.
  solution: Nosakiet bojājuma veidu — caurums, vārsta noplūde vai šuves problēma — un piemērojiet atbilstošo labošanas metodi. Lielākā daļa remontu aizņem 30 minūtes plus sacietēšanas laiku.
  audience: Piepūšamo SUP dēļu īpašnieki, kas vēlas pamata remontus veikt paši.
  steps:
    - Atrodiet noplūdi — piepūtiet dēli pilnībā, klausieties gaisa izplūšanu, pārbaudiet ar roku vai izmantojiet ziepjūdeni
    - Atzīmējiet noplūdes vietu ar pildspalvu vai līmlenti
    - Notīriet vietu ap noplūdi ar izopropilspirtu — vismaz 2 collas ap bojājumu
    - Rupjiniet virsmu ar smalku smilšpapīru labākai līmes saķerei
    - Uzklājiet PVC līmi gan uz lāpas, gan uz dēļa virsmas
    - Gaidiet 5 minūtes, līdz līme kļūst lipīga
    - Stingri piepresējiet lāpas un izrullējiet gaisa burbuļus ar rullīti vai kredītkarti
    - Ļaujiet līmei sacietēt 24 stundas, pirms piepūšat dēli līdz pilnam spiedienam
  faq:
    - q: Vai caurumu var salabot, atrodoties uz ūdens?
      a: Avārijas remonts ar lāpas un lentes palīdzību var palīdzēt tikt atpakaļ krastā. Pilnvērtīgam remontam nepieciešami sausi apstākļi un 24 stundu sacietēšanas laiks.
    - q: Kā salabot noplūdošu vārstu?
      a: Izgrieziet vārsta serdi ar komplektā iekļauto rīku, pārbaudiet, vai O-gredzens nav bojāts, vajadzības gadījumā to nomainiet un serdi stingri ieskrūvējiet atpakaļ.
    - q: Kādu līmi izmantot PVC remontiem?
      a: Izmantojiet īpaši PVC paredzētu līmi, piemēram, HH-66 vai Clifton. Parastā sekundālā līme nesasaistās labi ar piepūšama PVC materiāliem.

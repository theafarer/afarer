  faq:
    - q: Kāds SUP platums ir labākais 250 lbs smagam airētājam?
      a: Minimāli 34" platums. Papildu platums sniedz primāro stabilitāti, kas lielāka auguma braucējiem vajadzīga, lai stāvot un airējot justos droši.
    - q: Vai 300 lbs smags cilvēks var airēt ar piepūšamo SUP?
      a: Jā, ar dēli, kura atļautā slodze ir 350-400 lbs. Tropical Breeze Island Escape ar 34"+ platumu iztur lielākas slodzes. Vienmēr pārbaudiet konkrēto atļauto slodzi.
    - q: Vai lielāka auguma airētājiem vajag īpašu airi?
      a: Garāks airs (par 1-2 inches garāks par standartu) palīdz, jo stāvoklis uz platāka un biezāka dēļa ir augstāks. Apsveriet oglekļa kātu, lai mazinātu roku nogurumu.

- slug: sup-maintenance
  category: maintenance
  title: Kā tīrīt un uzglabāt uzpumpējamo SUP
  description: Pakāpenisks apkopes ceļvedis, lai maksimizētu jūsu uzpumpējamā SUP dēļa kalpošanas laiku.
  tldr: Pēc katras lietošanas skalojiet ar saldūdeni, pirms uzglabāšanas pilnībā izžāvējiet, nolaiziet gaisu un savelciet brīvu rullīti (nevis militāri ciešu), uzglabājiet vēsā, sausā vietā prom no tiešiem saules stariem un reizi mēnesī pārbaudiet šuves.
  problem: Nepareiza uzglabāšana un tīrīšana ir galvenie priekšlaicīgas bojāšanās iemesli uzpumpējamiem SUP — pelējums, UV bojājumi un šuvju atslāņošanās.
  solution: 'Ievērojiet pastāvīgu pēc sesijas rutīnu: skalojiet, žāvējiet, pārbaudiet, nolaiziet gaisu un uzglabājiet. Pret noturīgām netīrībām izmantojiet maigu ziepju šķīdumu. Nekad neuzglabājiet dēli slapju vai tiešos saules staros.'
  audience: Visi uzpumpējamo SUP īpašnieki, kas vēlas, lai viņu dēlis kalpo 5+ gadus.
  steps:
    - Skalojiet dēli ar saldūdeni tūlīt pēc lietošanas, īpaši pēc sālsūdens
    - Tīriet ar maigu ziepju šķīdumu un mīkstu sūkli — izvairieties no agresīvām ķīmiskām vielām un augsta spiediena mazgātājiem
    - Izžāvējiet dēli pilnībā — atveriet vārstu, lai var izplūst iesprostotais ūdens
    - Pārbaudiet bojājumus — pārbaudiet šuves, vārstu un virsmu, vai nav caurdurumu
    - Nolaiziet gaisu pilnībā — pilnīgai gaisa nolaidei izņemiet vārsta serdi
    - Savelciet dēli brīvi — sāciet no priekšgala un izvairieties no ciešām krokām
    - Uzglabājiet pārnēsājamā somā vēsā, sausā vietā prom no tiešiem saules stariem
  faq:
    - q: Vai varu atstāt savu SUP uzpumpētu visu sezonu?
      a: Jā, taču, kad nelietojat, turiet to ārpus tiešiem saules stariem. Ilgstošai uzglabāšanai ieteicama daļēja gaisa nolaide (8-10 PSI).
    - q: Kā salabot caurdurumu?
      a: Notīriet vietu, izgrieziet plāksteri ar noapaļotiem stūriem, uzklājiet līmi, stingri piespiediet un pirms uzpumpēšanas gaidiet 24 stundas. afarer dēļu komplektā ir iekļauts remonta komplekts.
    - q: Cik bieži jāpārbauda vārsts?

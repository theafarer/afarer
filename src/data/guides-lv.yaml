- slug: sup-storage-winter-care
  category: maintenance
  title: SUP uzglabāšana un ziemas kopšana — pagariniet sava dēļa mūžu
  description: Kā pareizi uzglabāt, tīrīt un sagatavot ziemai savu piepūšamo SUP dēli. Izvairieties no pelējuma, UV bojājumiem un materiālu degradācijas, nodrošinot pareizu kopšanu.
  tldr: Pēc katras lietošanas reizes noskalojiet ar saldūdeni. Pirms uzglabāšanas pilnībā izžāvējiet. Izlaidiet gaisu un uzglabājiet vēsā, tumšā vietā prom no tiešiem saules stariem un ekstremālām temperatūrām. Nekad neuzglabājiet piepūstu vai karstā automašīnā. Periodiski uzklājiet UV aizsarglīdzekli.
  problem: Nepareiza uzglabāšana ir galvenais priekšlaicīgas SUP bojāejas iemesls — pelējums, materiālu iziršana, delaminācija un vārsta bojājumi no karstuma vai aukstuma.
  solution: 'Ievērojiet 3 soļu kopšanas rutīnu: noskalojiet pēc katras sesijas, rūpīgi izžāvējiet pirms uzglabāšanas un uzglabājiet ar izlaistu gaisu temperatūras kontrolētā vidē starp 50-80°F (10-27°C).'
  audience: Visi SUP īpašnieki, kuri vēlas, lai viņu dēlis kalpo 5+ gadus.
  steps:
    - Noskalojiet dēli, airi un sūkni ar saldūdeni pēc katras sālsūdens vai duļķainā ūdens sesijas
    - Tīriet ar maigām ziepēm un mīkstu sūkli — nekad neizmantojiet agresīvas ķīmiskās vielas vai augstspiediena mazgātājus
    - Izžāvējiet dēli pilnībā ārpusē, pirms izlaižat gaisu (atveriet vārstu, lai mitrums varētu izkļūt no iekšpuses)
    - Pilnībā izlaidiet gaisu un saritiniet dēli no priekšgala līdz astei, lai izspiestu atlikušo gaisu
    - Nosusiniet mugursomu, pirms ievietojat tajā dēli
    - Uzglabājiet vēsā, tumšā skapī vai zem gultas — nekad tiešā saulē, karstā automašīnā vai sasalstošā šķūnī
  faq:
    - q: Vai varu atstāt savu SUP piepūstu visu sezonu?
      a: Labāk ir izlaist gaisu, ja dēli ilgstoši nelietojat. Pastāvīgs PSI spiediens paātrina materiālu nogurumu. Izlaidiet gaisu starp sesijām, ja dēli uzglabājat ilgāk par 2 nedēļām.
    - q: Kā no sava SUP noņemt pelējumu?
      a: Sajauciet maigas ziepes ar siltu ūdeni un nedaudz balta etiķa. Maigi berziet ar mīkstu suku. Rūpīgi noskalojiet un žāvējiet ēnā. Izvairieties no balinātāja, kas bojā PVC.
    - q: Vai varu uzglabāt savu SUP garāžā?
      a: Tikai tad, ja garāžā visu gadu tiek uzturēta temperatūra starp 50-80°F. Bēniņos un neapsildāmos garāžās valda temperatūras ekstrēmi, kas bojā pīto diegu kodolu.

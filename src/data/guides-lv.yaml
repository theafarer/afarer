- slug: sup-travel-transport
  category: planning
  title: SUP ceļošanas ceļvedis — lidošana un ceļošana pa autoceļiem ar piepūšamo SUP
  description: Kā ceļot ar piepūšamo SUP ar lidmašīnu, automašīnu vai autonomu. Padomi par aviokompāniju maksām, iepakošanu, dēļa piepūšanu galamērķī un starptautiskās ceļošanas apsvērumiem.
  tldr: Izlaidiet gaisu, sarullējiet un iepakojiet savu SUP tā mugorsomā. Lielākā daļa aviokompāniju to pieņem kā reģistrēto bagāžu (zem 50 lbs / 50 linear inches). Vienmēr ielieciet sūkni un airi tajā pašā somā. Ierodaties agri, lai būtu laika rezerve, ja reģistrācijas darbinieks apšauba somas izmēru. Garākiem ceļojumiem apsveriet iespēju nosūtīt bagāžu uz galamērķi iepriekš.
  problem: Ceļošana ar SUP šķiet sarežģīta — aviokompāniju izmēru ierobežojumi, bažas par drošības pārbaudēm lidostā un jautājums, kā piepūst dēli attālā galamērķī, rada nenoteiktību.
  solution: afarer SUP mugorsomas ir izstrādātas tā, lai atbilstu aviokompāniju reģistrētās bagāžas ierobežojumiem. Iepakojiet pārdomāti, paņemiet līdzi remonta komplektu un pirms došanās ceļā izpētiet piepūšanas vietas (marīnas, autokempingus ar elektroapgādi).
  audience: Airētāji, kas plāno ceļot ar SUP ar lidmašīnu, automašīnu vai autonomu.
  steps:
    - Izlaidiet gaisu pilnībā un sarullējiet dēli no deguna līdz astei
    - Iepakojiet mugorsomā sarullēto dēli, sūkni, airi, drošības saiti un spuru
    - Pārbaudiet aviokompānijas izmēru un svara ierobežojumus — lielākā daļa atļauj 62 linear inches un 50 lbs
    - Ierodaties agri un esiet gatavi tam, ka somu varētu pārbaudīt manuāli
    - Paņemiet remonta komplektu rokas bagāžā gadījumam, ja dēlis transportēšanas laikā tiek bojāts
    - 'Izpētiet piepūšanas iespējas: autokempingu elektroapgādes pieslēgumi elektriskajiem sūkņiem, marīnu gaisa stacijas'
  faq:
    - q: Vai aviokompānija pieņems manu SUP mugorsomu kā bagāžu?
      a: Lielākā daļa ASV un Eiropas aviokompāniju pieņem SUP mugorsomas kā standarta reģistrēto bagāžu, ja tās ir zem 50 lbs un 62 linear inches. Zemo cenu pārvadātāji var iekasēt maksu par lielgabarīta bagāžu.
    - q: Vai varu ņemt savu SUP līdzi kā rokas bagāžu?
      a: Nē. SUP mugorsomas pārsniedz rokas bagāžas izmērus visās aviokompānijās. Vienmēr nododiet mugorsomu kā reģistrēto bagāžu.
    - q: Kā piepūst savu SUP attālā galamērķī?
      a: Komplektā iekļautais rokas sūknis darbojas jebkur bez elektroenerģijas. Ērtuma labad paņemiet līdzi portatīvu elektrisko sūkni un meklējiet autokempingus ar elektroapgādes pieslēgumiem vai marīnas ar gaisa stacijām.

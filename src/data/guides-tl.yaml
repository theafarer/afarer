- slug: sup-maintenance
  category: maintenance
  title: Paano Linisin at Iimbak ang Iyong Inflatable SUP
  description: Gabay sa pagpapanatili na hakbang-hakbang upang i-maximize ang haba-buhay ng iyong inflatable SUP board.
  tldr: Banlawan ng preskong tubig pagkatapos ng bawat paggamit, patuyuin nang lubos bago iimbak, ideflate at i-roll nang maluwag (hindi military-tight na higpit), iimbak sa malamig at tuyong lugar na nakalayo sa direktang sikat ng araw, at buwan-buwan na suriin ang mga tuwiran.
  problem: Ang maling pag-iimbak at paglilinis ang pangunahing sanhi ng maagang pagkasira ng mga inflatable SUP — amag, UV damage, at pagkakabitak ng mga tuwiran.
  solution: 'Sundin ang consistent na routine pagkatapos ng bawat sesyon: banlawan, patuyuin, suriin, ideflate, at iimbak. Gumamit ng banayad na sabon para sa matigas na dumi. Huwag kailanman iimbak ang board na basa o sa ilalim ng direktang sikat ng araw.'
  audience: Lahat ng may-ari ng inflatable SUP na nais na tumagal ng 5+ taon ang kanilang board.
  steps:
    - Banlawan ang board ng preskong tubig kaagad pagkatapos gamitin, lalo na pagkatapos sa maalat na tubig
    - Linisin gamit ang banayad na sabon at malambot na espongha — iwasan ang mga harsh na kemikal o pressure washer
    - Patuyuin nang lubos ang board — buksan ang valve upang makalabas ang naipit na tubig
    - Suriin ang mga sira — tingnan ang mga tuwiran, valve, at ibabaw para sa mga butas
    - Ideflate nang buo — alisin ang valve core para sa kumpletong deflation
    - I-roll ang board nang maluwag — magsimula sa ilong, at iwasan ang masisikip na tiklop
    - Iimbak sa carry bag sa isang malamig at tuyong lugar na nakalayo sa direktang sikat ng araw
  faq:
    - q: Pwede ko bang iwanan ang aking SUP na inflated sa buong season?
      a: Oo, ngunit panatilihing nakalayo sa direktang sikat ng araw kapag hindi ginagamit. Inirerekomenda ang partial deflation (8-10 PSI) para sa mahabang pag-iimbak.
    - q: Paano ko aayusin ang isang butas?
      a: Linisin ang lugar, gumupit ng patch na bilugan ang mga sulok, maglagay ng adhesive, idiin nang mahigpit, at maghintay ng 24 oras bago i-inflate. Kasama sa mga afarer board ang repair kit.
    - q: Gaano kadalas dapat kong suriin ang valve?
      a: Buwan-buwan. Ang valve ang pinakakaraniwang bahaging sumisira. Suriin kung malayang gumagalaw ang valve pin at kung buo pa ang O-ring.

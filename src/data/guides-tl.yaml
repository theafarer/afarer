- slug: multi-day-trip
  category: planning
  title: Pagpaplano ng Multi-Day na Paglalakbay sa SUP
  description: Paano magplano at magsagawa ng ilang araw na biyahe sa pag-sagwan — pagpaplano ng ruta, pag-pack ng kagamitan, camping, at kaligtasan.
  tldr: Magplano ng 10-15 miles kada araw. I-pack ang kagamitan sa waterproof dry bags, ipamahagi nang pantay ang timbang, at magsanay ng pagkarga ng iyong board bago ang biyahe. Maghain ng float plan. Magdala ng tubig, pagkain, kanlungan, nabigasyon, at komunikasyon.
  problem: Nabibigo ang mga multi-day na biyahe dahil sa sobrang pag-pack, mahinang pagpaplano ng ruta, o maling pagtataya ng lagay ng panahon at agos — na humahantong sa matinding pagod, pagkasira ng kagamitan, o mga insidente sa kaligtasan.
  solution: 'Gumamit ng sistematikong paraan ng pagpaplano: pagpili ng ruta, checklist ng kagamitan, pagpaplano ng pagkain, safety briefing, at contingency planning.'
  audience: Mga paddler na may karanasan at nagpaplano ng kanilang unang multi-day na ekspedisyon.
  steps:
    - Pumili ng ruta na may mga itinatag na campsite at bailout point
    - Magplano ng 10-15 miles kada araw na isinasaalang-alang ang hangin at agos
    - Tingnan ang tide table at weather forecast para sa buong yugto ng biyahe
    - I-pack ang kagamitan sa waterproof dry bags —20-30 lbs kabuuang timbang ng kagamitan
    - Ipamahagi nang pantay ang timbang — ang pinakamabibigat na bagay sa gitna
    - Maghain ng detalyadong float plan sa isang tao sa pampang
    - Magdala ng nabigasyon — paper chart, compass, at GPS backup
    - Mag-pack ng emergency shelter, extra na pagkain, at first aid kit
  faq:
    - q: Ano ang perpektong distansya kada araw?
      a: 10-15 miles kada araw para sa mga paddler na may karanasan. Dapat magplano ang mga baguhan ng 5-8 miles. Laging maglaan ng oras na buffer para sa lagay ng panahon.
    - q: Gaano karaming tubig ang dapat kong dalhin?
      a: 1 gallon kada tao kada araw. Sa mainit na kondisyon, 1.5 gallons. Magdala ng water filter o purification tablet para sa pag-refill.
    - q: Ano ang pinakamahalagang bagay para sa kaligtasan?
      a: Komunikasyon. Ang VHF radio o satellite messenger ay maaaring magligtas ng buhay sa emergency. Hindi maaasahan ang mga cell phone sa mga liblib na lugar.

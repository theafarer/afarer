- slug: sup-inflation-psi-guide
  category: technical
  title: Gabay sa Pag-i-inflate ng SUP — Pinakamainam na PSI para sa Pagganap at Kaligtasan
  description: 'Kumpletong gabay sa presyon ng pag-i-inflate ng SUP: mga inirerekomendang PSI range, kung paano nakaaapekto ang presyon sa pagganap, at mga tip para sa tamang paggamit ng iyong pump.'
  tldr: I-inflate sa 12-15 PSI para sa karamihan ng mga inflatable SUP. Mas mataas na presyon = mas malaking katigasan ngunit mas mabagal na pag-i-inflate. Mas mababang presyon = mas malambot na pakiramdam ngunit mas maraming flex. Huwag kailanman lumampas sa pinakamataas na PSI na nakalimbag sa iyong board. Gumamit ng pump na may tumpak na pressure gauge. Nagbabawas ng presyon ang malamig na hangin, nagdaragdag nito ang mainit na araw.
  problem: Ang mga board na kulang sa hangin ay parang mabagal at labis ang flex. Ang mga board na sobra sa hangin ay nasa panganib ng pagkasira ng seam. Maraming paddler ang naghuhulaan ng PSI sa halip na sukatin ito nang tumpak.
  solution: Gumamit ng pump na may built-in na pressure gauge. I-target ang 15 PSI para sa pinakamataas na katigasan. Suriin ang presyon bago ang bawat sesyon — malaking epekto sa PSI ang pagbabago ng temperatura.
  audience: Lahat ng may-ari ng inflatable SUP.
  steps:
    - Tingnan ang inirerekomendang PSI range na nakalimbag sa iyong board malapit sa valve
    - Gamitin ang dual-action pump upang i-inflate hanggang sa gitna ng inirerekomendang range
    - Lumipat sa single-action mode para sa huling 3-4 PSI para sa mas tumpak na kontrol
    - Tingnan ang presyon gamit ang gauge — mas maaasahan ang analog gauge kaysa digital
    - 'I-adjust ayon sa kondisyon: mas mataas na PSI para sa touring/racing, mas mababang PSI para sa whitewater at mga mabatong paglunsad'
    - Suriing muli ang presyon pagkatapos manahimik ang board nang 10 minuto — nagpapabago sa PSI ang temperature equilibrium
  faq:
    - q: Maaari ko bang sobrang i-inflate ang aking SUP?
      a: Oo. Ang paglampas sa nirated na pinakamataas na PSI (karaniwang 15-18 PSI) ay maaaring maghiwalay ng mga seam at sirain ang drop-stitch core. Palaging manatili sa loob ng nakalimbag na range.
    - q: Nakaaapekto ba ang temperatura sa PSI?
      a: Malaki. Ang board na na-inflate sa 15 PSI sa 70°F ay maaaring umabot sa 18 PSI sa ilalim ng direktang araw sa 95°F. Maaaring bumaba hanggang 12 PSI ang presyon sa malamig na tubig. Suriin ang presyon pagkatapos ng mga pagbabago sa kapaligiran.
    - q: Anong PSI para sa mga baguhan?
      a: Ang 12-13 PSI sa pag-aaral ay nagbibigay ng bahagyang mas malambot na plataporma na mas mapagpatawad sa mga pagkakatumba. Itaas ito sa 15 PSI habang lumalakas ang kasanayan.

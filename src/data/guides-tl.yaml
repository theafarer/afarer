- slug: understanding-specs
  category: technical
  title: Paano Basahin ang mga Espesipikasyon ng SUP Board
  description: Isang teknikal na gabay sa pag-unawa sa mga specs ng SUP board — volume, dimensions, konstruksyon, at kung ano ang ibig sabihin ng mga ito para sa performance.
  tldr: 'Mga pangunahing specs: ang volume (liters) ang nagtatakda ng buoyancy at weight capacity, ang lapad ang nagtatakda ng katatagan, ang haba ang nagtatakda ng tracking at bilis, ang kapal ang nagtatakda ng tigas, at ang PSI rating ang nagtatakda ng inflation pressure para sa pinakamainam na performance.'
  problem: Naglilista ang mga spec sheet ng produkto ng mga numero nang walang konteksto, kaya hindi sigurado ang mga mamimili kung aling mga espesipikasyon ang talagang mahalaga para sa kanilang gamit.
  solution: 'Isalin ang bawat espesipikasyon sa tunay na performance: volume para sa floatation, lapad para sa katatagan, haba para sa glide, kapal para sa tigas, at konstruksyon para sa durability.'
  audience: Mga intermediate na paddler at teknikal na mamimili na gustong gumawa ng mga desisyong batay sa datos.
  steps:
    - Tingnan ang volume (liters) — ang iyong timbang kasama ang kagamitan ay hindi dapat lumampas sa 80% ng volume rating ng board
    - Tingnan ang lapad — mas malapad (32-34") = mas maraming katatagan, mas makitid (28-30") = mas maraming bilis
    - Tingnan ang haba — mas mahaba (12-14") = mas mahusay na tracking, mas maikli (10-11") = mas mahusay na maneuverability
    - Tingnan ang kapal — 6" ang standard, ang 8" ay nagbibigay ng mas maraming tigas at weight capacity
    - Tingnan ang PSI rating — i-inflate sa pinakamataas na rated PSI para sa pinakamainam na tigas
    - Tingnan ang mga materyales ng konstruksyon — density ng drop-stitch, mga layer ng PVC, rail reinforcement
  faq:
    - q: Ano ang ibig sabihin ng drop-stitch?
      a: Ang drop-stitch ay isang paraan ng konstruksyon kung saan libu-libong sinulid ang nagdudugtong sa itaas at ilalim na layer ng board. Ito ay nagpapahintulot ng high-pressure na inflation (12-15 PSI) para sa matinding tigas.
    - q: Ano ang perpektong ratio ng timbang sa volume?
      a: Ang magandang target ay humigit-kumulang 5-6 pounds na timbang ng rider kada liter ng volume ng board. Ang 220 lb na paddler ay dapat maghanap ng mga board na may 180+ liters na volume.
    - q: Mahalaga ba ang timbang ng board?
      a: Oo. Ang mas magagaan na board (mas mababa sa 20 lbs) ay mas madaling dalhin at i-transport. Ang mas mabibigat na board (25+ lbs) ay kadalasang nagpapahiwatig ng mas matibay na multi-layer na PVC construction.

- slug: beginner-guide
  category: tutorial
  title: Gabay para sa Baguhan sa Paddle Boarding
  description: Lahat ng kailangan mong malaman bago ang iyong unang sesyon ng paddle boarding — mula sa pag-setup ng kagamitan hanggang sa mga pangunahing teknik ng pagpapaddle.
  tldr: Magsimula sa kalmado at patag na tubig gamit ang malapad at matatag na board. I-inflate sa 12-15 PSI, ikabit ang leash, at gamitin ang tamang haba ng paddle (6-8" mas mataas kaysa sa iyong taas). Panatilihin ang stance na may layong abot-balikat, bahagyang nakayuko ang mga tuhod, at tumingin sa horizon.
  problem: Ang mga bagong paddler ay kadalasang lumalampas sa pangunahing paghahanda — maling haba ng paddle, mahinang stance, o pagpili ng magaspang na tubig — na humahantong sa pagkahulog, frustrasyon, at pagkawala ng gana.
  solution: 'Sundin ang istrukturadong plano para sa unang sesyon: pumili ng kalmadong tubig, i-setup nang tama ang iyong kagamitan, magsanay muna sa pagluhod bago tumayo, at makamit ang forward stroke bago subukan ang mga pagliko.'
  audience: Mga ganap na baguhan na hindi pa kailanman nakapag-paddle board.
  steps:
    - Pumili ng patag at kalmadong tubig na walang dumaraang bangka — ang maliit na lawa o sheltered na look ay perpekto
    - I-inflate ang iyong board sa 12-15 PSI gamit ang dual-action pump
    - Ikabit ang coil leash sa iyong bukung-bukong o binti, at hindi kailanman sa handle ng board
    - Ilagay ang fin at higpitan ang turnilyo
    - I-adjust ang haba ng paddle — ito ay dapat 6-8 inches mas mataas kaysa sa iyong taas
    - Magsimula sa pagluhod sa board, at magpaddle ng ilang stroke para maramdaman ang balanse
    - Tumayo nang isang paa sa isang pagkakataon, nasa layong abot-balikat ang mga paa, at malambot ang mga tuhod
    - Tumingin sa horizon, hindi sa iyong mga paa — ang iyong board ay pumupunta kung saan ka nakatingin
  faq:
    - q: Ano ang dapat kong suotin para sa paddle boarding?
      a: Mabilis na tumuyong athletic na damit, life vest, sunscreen, at sumbrero. Sa malamig na tubig, magsuot ng wetsuit. Laging magsuot ng leash at magdala ng telepono sa waterproof na case.
    - q: Paano ako makababalik sa board kung mahuhulog ako?
      a: Manatiling kalmado. Lumangoy papunta sa board, hawakan ang center handle, at sipain ang iyong mga binti habang hinihila ang iyong sarili papaitaas sa board sa isang galaw. Bumalik muna sa posisyong nakaluhod, saka tumayo.
    - q: Anong kondisyon ng hangin ang ligtas?
      a: 'Baguhan: hangin na mas mababa sa 10 mph (5 knots). Kung ang hangin ay umaiihip palayo sa pampang, huwag nang lumabas. Tingnan ang forecast at unawain na ang offshore na hangin ay mapanganib.'

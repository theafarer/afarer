- slug: weather-conditions
  category: safety
  title: Pag-unawa sa mga Kondisyon ng Panahon para sa Paddle Boarding
  description: Matutong basahin ang hangin, alon, tide, at mga pattern ng panahon upang makagawa ng mga ligtas na desisyon sa tubig.
  tldr: 'Suriin ang tatlong bagay bago bawat launch: bilis ng hangin (mas mababa sa 10 mph para sa mga baguhan), taas ng alon (mas mababa sa 1 ft para sa mga baguhan), at temperatura ng tubig (manamit ayon sa tubig, hindi sa hangin). Ang offshore na hangin ay mapanganib sa anumang antas ng kasanayan.'
  problem: Karamihan sa mga aksidenteng may kaugnayan sa panahon ay nangyayari dahil mali ang pagtataya ng mga paddler sa mga kondisyon — sinusuri nila ang temperatura ng hangin ngunit hindi ng tubig, o hindi nauunawaan na ang offshore na hangin ay maaaring ihip sila palayo patungo sa dagat.
  solution: 'Gamitin ang istrukturadong pagsusuri ng panahon bago mag-launch: direksyon at bilis ng hangin, period at taas ng alon, estado ng tide, at temperatura ng tubig. Unawain kung paano nakaaapekto ang bawat kadahilanan sa iyong kaligtasan.'
  audience: Lahat ng paddler na pumapasok sa bukas na tubig — mga lawa, look, ilog, at karagatan.
  steps:
    - Suriin ang bilis at direksyon ng hangin — ang offshore na hangin (umiihip mula sa lupa patungo sa dagat) ang pinakamapanganib
    - Tasaan ang mga kondisyon ng alon — kasinghalaga ng taas ng alon ang period nito
    - Kilalanin ang tide — ang mga daloy ng tide ay maaaring mas malakas kaysa sa bilis ng iyong pagpapaddle
    - Sukatin ang temperatura ng tubig — ang mas mababa sa 60°F/15°C ay nangangailangan ng thermal protection
    - Suriin ang visibility — ang hamog at malakas na ulan ay nagpapababa ng visibility at nagpapataas ng panganib ng pagbangga
    - Unawain ang mga lokal na panganib — mga batong nakalubog, malalakas na daloy, at mga sona ng daloy ng bangka
  faq:
    - q: Anong bilis ng hangin ang masyadong mataas para sa SUP?
      a: 'Baguhan: higit sa 10 mph (8 knots). Intermediate: higit sa 15 mph (13 knots). Advanced: higit sa 20 mph (17 knots). Kung nag-aalinlangan, huwag nang lumabas.'
    - q: Ano ang ibig sabihin ng period ng alon?
      a: Ang period ng alon ay ang pagitan ng magkakasunod na alon. Ang maikling period (mas mababa sa 8 segundo) ay nangangahulugan ng matarik at magulong alon. Ang mahabang period (higit sa 12 segundo) ay nangangahulugan ng mas makinis at mas nahuhulaang mga swell.
    - q: Pwede ba akong magpaddle sa ulan?
      a: Ang bahagyang ulan ay karaniwang ligtas. Ang malakas na ulan ay nagpapababa ng visibility at maaaring senyales ng nagbabagong kondisyon ng hangin. Ang mga thunderstorm ay nangangailangan ng agarang pag-alis mula sa tubig.

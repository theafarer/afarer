- slug: sup-board-materials
  category: technical
  title: Mga Materyal ng SUP Board — Paliwanag sa PVC, EPS, Epoxy, at Drop-Stitch
  description: 'Teknikal na gabay sa mga materyal ng konstruksyon ng SUP: inflatable na drop-stitch PVC laban sa hard board na may EPS foam core. Unawain kung bakit magkakaiba ang pagganap ng bawat uri.'
  tldr: Gumagamit ang mga inflatable SUP ng drop-stitch PVC na may libu-libong panloob na sinulid para sa katigasan. Gumagamit ang mga hard board ng EPS foam core na may epoxy o fiberglass shell. Panalo ang mga inflatable sa portabilidad at tibay. Panalo ang mga hard board sa bilis at pakiramdam. Ang makabagong drop-stitch technology sa 15 PSI ay katumbas na ng katigasan ng hard board.
  problem: Hindi nauunawaan ng mga mamimili ang pangunahing pagkakaiba sa konstruksyon ng inflatable at hard board, na humahantong sa maling desisyon sa pagbili.
  solution: 'Ihanay ang materyal ng board sa iyong pangunahing paggamit: inflatable drop-stitch para sa paglalakbay, pag-iimbak, at tibay. EPS/epoxy para sa karera, surfing, at pinakamataas na pagganap.'
  audience: Mga mamimili ng SUP na nagkokumpara ng inflatable laban sa konstruksyon ng hard board.
  steps:
    - 'Inflatable drop-stitch: libu-libong polyester thread ang nagdudugtong sa itaas at ibabang layer, na lumilikha ng matigas na estruktura kapag pinresyur sa 12-15 PSI'
    - 'Hard EPS foam: core na gawa sa expanded polystyrene na hinulma ayon sa disenyo ng hull, at naka-seal sa epoxy resin at mga fiberglass layer'
    - 'Mga bentahe ng inflatable: kayang ma-pack, napakatibay, magaan dalhin, malambot na rail para sa kaligtasan'
    - 'Mga bentahe ng hard board: mas magaan ang kabuuang timbang, mas matigas na plataporma, mas mahusay na glide, mas tumutugon sa galaw'
    - 'Mga hybrid na opsyon: pinagsasama ng ilang tagagawa ang drop-stitch sa mga matitigas na panel para sa pinakamainam sa parehong mundo'
  faq:
    - q: Kasing-tigas ba ng mga hard board ang mga inflatable SUP?
      a: Sa 15 PSI at de-kalidad na drop-stitch construction, napakalapit na ng mga makabagong inflatable. Hindi ito mapapansin ng karamihan sa mga paddler na pang-rekreasyon. Mapapansan lamang ito ng mga racing paddler.
    - q: Aling materyal ang mas matagal tumagal?
      a: Tumatagal ang mga inflatable SUP nang 5-10 taon sa tamang pangangalaga. Tumatagal ang mga hard board nang 10-20 taon ngunit madaling mapinsala ng bitak, bugbog, at pagpasok ng tubig. Mas lumalaban sa pinsala ang mga inflatable sa pang-araw-araw na gamit.
    - q: Kalikasan-friendly ba ang PVC?
      a: May epekto sa kapaligiran ang produksyon ng PVC, ngunit mas tumatagal ang mga inflatable SUP (na nagbabawas ng dalas ng pagpapalit) at mas maliit na nakapack (na nagbabawas ng emisyon ng transportasyon). Palaging i-recycle nang tama ang mga lumang board.

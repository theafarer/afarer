- slug: sup-weight-capacity
  category: buying-guide
  title: Gabay sa Kapasidad ng Timbang ng SUP — Gaano Karaming Timbang ang Kayang Dalhin ng SUP?
  description: Pag-unawa sa mga limitasyon ng kapasidad ng timbang ng SUP, kung paano kalkulahin ang iyong kabuuang kargamento, at bakit nakaaapekto sa pagganap at kaligtasan ang paglampas sa limit.
  tldr: Huwag kailanman lumampas sa 80% ng pinakamataas na kapasidad ng timbang ng board gamit ang timbang ng iyong katawan at ng kagamitan. Ang board na may kapasidad na 220 lb ay angkop para sa paddler na 160 lb na may magaan na kagamitan. Ang paglampas sa limit ay nagdudulot ng porpoising, mabagal na paghawak, at mas mataas na panganib ng pinsala.
  problem: Madalas lumampas ang mga paddler sa kapasidad ng timbang ng kanilang board, na humahantong sa mahinang pagganap, paglubog, at posibleng pinsala sa board. Naglilista ang mga tagagawa ng pinakamataas na limit ngunit hindi ipinapaliwanag ang mga ligtas na working load.
  solution: Kalkulahin ang iyong kabuuang kargamento (timbang ng katawan + kagamitan + tubig na nasisipsip ng board) at manatili sa ilalim ng 80% ng nakasaad na pinakamataas na kapasidad. Kailangan ng mas mabibigat na paddler ng mas mataas na volume na board na may kapasidad na 300+ lb.
  audience: Mga paddler ng lahat ng laki, lalo na ang mas malalaking paddler at mga nagdadala ng kagamitang pang-ekspedisyon.
  steps:
    - Hanapin ang pinakamataas na kapasidad sa timbang na nakalimbag sa iyong board (karaniwang malapit sa valve)
    - Timbangin ang iyong sarili at lahat ng kagamitan kabilang ang paddle, PFD, dry bag, cooler, at mga aksesorya
    - 'Kalkulahin: (ang iyong kabuuang kargamento) ÷ (pinakamataas na kapasidad) × 100 = % ng kapasidad na nagamit'
    - I-target ang 70-80% para sa pinakamainam na pagganap at kaligtasan
    - Kung lumalampas sa 80%, pumili ng mas malaking board o bawasan ang kagamitan
  faq:
    - q: Ano ang mangyayari kung lumampas ako sa limit ng timbang?
      a: Mas mababa ang lulutang ng board, na lumilikha ng mas malaking drag. Bumababa ang katatagan, maaaring lumubog ang ilong, at mas mataas ang panganib ng pinsala sa drop-stitch core kapag magulo ang alon.
    - q: Maaari bang sumakay ang dalawang tao sa isang SUP?
      a: Maaari lamang kung ang kabuuang timbang ay mananatili sa ilalim ng 80% ng kapasidad. Karamihan sa karaniwang SUP ay idinisenyo para sa isang rider lamang. Ang pagsakay nang dalawa ay nangangailangan ng board na partikular na nirated para sa dalawang tao.
    - q: Mas mababa ba ang kapasidad ng mga inflatable SUP kaysa sa mga hard board?
      a: Ang mga de-kalidad na inflatable na may drop-stitch construction ay may katumbas o mas mataas na kapasidad sa timbang kaysa sa mga hard board dahil sa mas makapal na distribusyon ng volume.

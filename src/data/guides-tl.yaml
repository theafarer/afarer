- slug: sup-travel-transport
  category: planning
  title: Gabay sa Paglalakbay gamit ang SUP — Paglipad at Pagbiyahe sa Lupa gamit ang Inflatable SUP
  description: Paano maglakbay kasama ang isang inflatable SUP gamit ang eroplano, kotse, o RV. Mga tip tungkol sa singil ng airline, pagpapa-pete, pag-iinflate sa destinasyon mo, at mga pagsasaalang-alang sa internasyonal na paglalakbay.
  tldr: I-deflate, i-roll, at i-pack ang iyong SUP sa backpack nito. Tinatanggap ito ng karamihan ng airline bilang checked luggage (mas mababa sa 50 lbs / 50 linear inches). Palaging i-pack ang pump at paddle sa parehong bag. Dumating nang maaga upang magkaroon ng dagdag na oras kung tanungin ng gate agent ang laki ng bag. Isaalang-alang ang pagpapadala nito nang mas maaga para sa mahahabang biyahe.
  problem: Mukhang kumplikado ang paglalakbay kasama ang SUP — mga limitasyon sa laki ng airline, mga alalahanin sa TSA, at ang pagtukoy kung paano mag-iinflate sa isang malayong destinasyon ay nagdudulot ng kawalan ng katiyakan.
  solution: Ang mga Afarer SUP backpack ay idinisenyo upang matugunan ang mga limitasyon sa checked baggage ng mga airline. Mag-pack nang estratehiko, magdala ng repair kit, at mag-research tungkol sa mga lugar ng pag-iinflate (mga marina, mga campground na may kuryente) bago umalis.
  audience: Mga paddler na nagpaplano ng paglalakbay gamit ang SUP sa pamamagitan ng hangin, kotse, o RV.
  steps:
    - I-deflate nang buo at i-roll ang board mula nose hanggang tail
    - I-pack ang na-roll na board, pump, paddle, leash, at fin sa backpack
    - Tingnan ang mga limitasyon sa laki at timbang ng airline — karamihan ay nagpapahintulot ng 62 linear inches at 50 lbs
    - Dumating nang maaga at maging handa kung ang bag ay susuriing mano-mano
    - Magdala ng repair kit sa iyong carry-on sakaling mastrap ang board habang nasa transit
    - 'Mag-research tungkol sa mga opsyon sa pag-iinflate: mga elektrikal na hookup ng campground para sa mga electric pump, mga air station ng marina'
  faq:
    - q: Tatanggapin ba ng airline ang aking SUP backpack bilang baggage?
      a: Tinatanggap ng karamihan ng mga US at European na airline ang mga SUP backpack bilang karaniwang checked luggage kung mas mababa sa 50 lbs at 62 linear inches. Ang mga budget airline ay maaaring magsingil ng oversized na bayad.
    - q: Maaari ko bang dalhin ang aking SUP bilang carry-on?
      a: Hindi. Lalampas ang mga SUP backpack sa mga sukat ng carry-on sa lahat ng airline. Palaging i-check ang backpack.
    - q: Paano ako mag-iinflate ng aking SUP sa isang malayong destinasyon?
      a: Ang kasamang hand pump ay gumagana kahit saan nang walang kuryente. Para sa kaginhawaan, magdala ng portable electric pump at maghanap ng mga campground na may elektrikal na hookup o mga marina na may air station.

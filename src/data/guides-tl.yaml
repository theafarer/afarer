- slug: sup-storage-winter-care
  category: maintenance
  title: Pag-iimbak at Pangangalaga ng SUP sa Taglamig — Palawigin ang Buhay ng Iyong Board
  description: Kung paano tamang iimbak, linisin, at ihahanda para sa taglamig ang iyong inflatable SUP board. Iwasan ang amag, UV damage, at pagkasira ng materyal sa pamamagitan ng tamang pangangalaga.
  tldr: Linisan ng sariwang tubig pagkatapos ng bawat paggamit. Patuyuin nang lubos bago iimbak. I-deflate at iimbak sa malamig at madilim na lugar na malayo sa direktang sikat ng araw at sa matinding temperatura. Huwag kailanman iimbak na inflated o sa loob ng mainit na sasakyan. Maglagay ng UV protectant pana-panahon.
  problem: Ang maling pag-iimbak ang nangungunang sanhi ng maagang pagkasira ng SUP — amag, pagkasira ng materyal, delamination, at pinsala sa valve dulot ng init o lamig.
  solution: 'Sundin ang 3-hakbang na routine ng pangangalaga: banlawan pagkatapos ng bawat sesyon, patuyuin nang maayos bago iimbak, at iimbak na deflated sa temperature-controlled na kapaligiran sa pagitan ng 50-80°F (10-27°C).'
  audience: Lahat ng may-ari ng SUP na nais na umabot ang kanilang board nang 5+ taon.
  steps:
    - Banlawan ang board, paddle, at pump ng sariwang tubig pagkatapos ng bawat sesyon sa maalat o maputik na tubig
    - Linisan ng banayad na sabon at malambot na espongha — huwag kailanman gamitin ang matitinding kemikal o pressure washer
    - Patuyuin nang lubos ang board sa labas bago i-deflate (buksan ang valve upang makalabas ang halumigmig sa loob)
    - I-deflate nang buo, at i-roll mula sa ilong patungo sa buntot upang mapalabas ang natitirang hangin
    - Punasan nang tuyo ang backpack bago iimbak ang board sa loob nito
    - Iimbak sa malamig at madilim na aparador o sa ilalim ng higaan — huwag kailanman sa direktang sikat ng araw, sa mainit na sasakyan, o sa nagyeyelong kamalig
  faq:
    - q: Maaari ko bang iwanang inflated ang aking SUP sa buong season?
      a: Mas mabuting i-deflate kapag hindi ito ginagamit nang mahabang panahon. Ang patuloy na PSI stress ay pumapabilis sa pagkapagod ng materyal. I-deflate sa pagitan ng mga sesyon kung ito ay iiimbak nang mahigit 2 linggo.
    - q: Paano ko maalis ang amag sa aking SUP?
      a: Haluin ang banayad na sabon na may mainit-init na tubig at kaunting puting suka. Balahurin nang bahagya gamit ang malambot na brush. Banlawan nang maayos at patuyuin sa lilim. Iwasan ang bleach na sumisira sa PVC.
    - q: Maaari ko bang iimbak ang aking SUP sa garahe?
      a: Maaari lamang kung ang garahe ay mananatili sa pagitan ng 50-80°F buong taon. Ang mga attic at mga garahe na walang air-conditioning ay nakakaranas ng matinding pagbabago ng temperatura na sumisira sa drop-stitch core.

- slug: inflatable-repair
  category: maintenance
  title: Paano Ayusin ang Iyong Inflatable SUP
  description: Hakbang-hakbang na gabay sa pag-aayos ng mga butas, problema sa valve, at sirang seam sa mga inflatable SUP.
  tldr: Ang maliliit na butas (mas maliit sa 1/4") ay maaayos gamit ang kasamang patch kit. Linisin ang lugar, ilapat ang PVC adhesive, idiin ang patch, at maghintay ng 24 oras. Ang mga tagas sa valve ay karaniwang nangangailangan ng pagpapalit ng O-ring. Ang malalaking pagkakasira o seam delamination ay nangangailangan ng propesyonal na serbisyo.
  problem: Ang maliliit na butas at mga problema sa valve ay karaniwan ngunit madaling ayusin. Kung walang tamang teknik sa pag-aayos, ang mga gumagamit ay masyadong nagbabayad para sa propesyonal na serbisyo o lumalala ang pinsala.
  solution: Tukuyin ang uri ng pinsala — butas, tagas sa valve, o problema sa seam — at ilapat ang angkop na paraan ng pag-aayos. Karamihan sa mga pag-aayos ay tumatagal ng 30 minuto at saka ang oras ng pag-cure.
  audience: Mga may-ari ng inflatable SUP na nais pangasiwaan ang mga basic na pag-aayos nang mag-isa.
  steps:
    - Hanapin ang tagas — punuin ng hangin nang lubos, makinig sa tunog ng hangin, damhin gamit ang kamay, o gumamit ng tubig na may sabon
    - Markahan ang tagas gamit ang pen o tape
    - Linisin ang lugar sa paligid ng tagas gamit ang isopropyl alcohol — hindi bababa sa 2 inches sa paligid ng pinsala
    - Gawin magaspang ang ibabaw gamit ang pinong sandpaper para sa mas mahusay na pagdikit ng adhesive
    - Ilapat ang PVC adhesive sa parehong patch at ibabaw ng board
    - Maghintay ng 5 minuto para maging malagkit ang adhesive
    - Idiin nang matatag ang patch, ilabas ang mga bula ng hangin gamit ang roller o credit card
    - Hayaang um-cure sa loob ng 24 oras bago punuin ng buong presyon
  faq:
    - q: Maaari ba akong mag-ayos ng butas habang nasa tubig?
      a: Ang mga emergency na pag-aayos gamit ang patch at tape ay makakabalik sa iyo sa pampang. Ang buong pag-aayos ay nangangailangan ng tuyong kondisyon at 24 oras na pag-cure.
    - q: Paano ko inaayos ang valve na may tagas?
      a: Alisin ang valve core gamit ang kasamang kagamitan, suriin ang O-ring kung may pinsala, palitan kung kinakailangan, at isauling mahigpit ang core.
    - q: Anong pandikit ang dapat kong gamitin para sa mga pag-aayos ng PVC?
      a: Gumamit ng PVC-specific na adhesive tulad ng HH-66 o Clifton. Ang karaniwang super glue ay hindi humihigpit nang mahusay sa mga materyales ng inflatable PVC.

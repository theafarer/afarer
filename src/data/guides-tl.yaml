- slug: sup-size-guide
  category: buying-guide
  title: Gabay sa Sukat ng SUP — Paano Pumili ng Tamang Dimensyon ng Board
  description: Kumpletong gabay sa sukat ng SUP na sumasaklaw sa mga rekomendasyon para sa haba, lapad, at kapal batay sa iyong timbang, taas, antas ng kasanayan, at istilo ng pag-paddle.
  tldr: Kailangan ng mga baguhan ng mas malalapad na board (32-34") para sa katatagan. Kailangan ng mas mabibigat na paddler ng mas mahahabang board (11'+) na may mas mataas na volume. Nangangailangan ang touring ng mas mahabang hull (12'+). Nangangailangan ang yoga ng dagdag na lapad (34"+). Palaging tingnan ang kapasidad sa timbang — ang kabuuang timbang mo at ng kagamitan ay hindi dapat lumampas sa 80% ng limit.
  problem: Ang pagpili ng maling sukat ng SUP ay humahantong sa mahinang katatagan, mabagal na tracking, at nakakainis na karanasan sa pag-paddle. Karamihan sa mga unang beses na mamimili ay pumipili ng board na maganda tingnan nang hindi isinasaalang-alang kung paano nakaaapekto ang mga dimensyon sa pagganap.
  solution: 'Ihanay ang haba, lapad, at kapal ng board sa iyong timbang, antas ng kasanayan, at pangunahing paggamit. Gamitin ang aming calculator ng sukat: idagdag ang iyong timbang + timbang ng kagamitan, at pumili ng board na may hindi bababa sa 20% na headroom sa itaas ng kabuuang iyon.'
  audience: Mga mamimili ng SUP nang unang beses, mga paddler na nag-upgrade patungo sa espesyalisadong board, at sinumang hindi sigurado sa pagsukat.
  steps:
    - Timbangin ang iyong sarili kasama ang lahat ng kagamitang dala-dala mo (paddle, PFD, dry bag)
    - Magdagdag ng 20% safety margin upang matukoy ang pinakamababang kapasidad sa timbang
    - 'Pumili ng lapad batay sa kasanayan: 32-34" para sa mga baguhan, 30-32" para sa intermediate, 28-30" para sa advanced'
    - 'Pumili ng haba batay sa paggamit: 10''6"-11''6" all-around, 12''-14'' touring, 9''-10'' whitewater'
    - 'I-verify ang kapal: 6" standard, 4" para sa performance, 5" para sa all-around'
    - Tingnan ang inirerekomendang PSI range ng iyong board para sa pinakamainam na katigasan
  faq:
    - q: Anong lapad ng SUP ang pinakamainam para sa mga baguhan?
      a: Ang 32 hanggang 34 pulgada na lapad ang nagbibigay ng pinakamatatag na plataporma. Kapag mas malapad ang board, mas madali itong balansehan — lalo na para sa mas malalaking paddler.
    - q: Paano ko malalaman kung maliit ang SUP para sa akin?
      a: Kung mababa ang nalulutang ng board sa tubig, mabagal itong hawakan, o madaling lumulubog ang ilong kapag nagpa-paddle, malamang na maliit ito para sa iyong timbang.
    - q: Nakaaapekto ba ang haba ng board sa bilis?
      a: Oo. Ang mas mahabang waterline ay nagpapataas ng teoretikal na bilis ng hull. Ang 14' touring board ay lubhang mas mabilis kaysa 10' all-around board para sa parehong pagsisikap ng paddler.

- slug: sup-fitness
  category: lifestyle
  title: 'SUP Fitness: Buong-Katawang Ehersisyo sa Tubig'
  description: Paano hinuhubog ng stand-up paddle boarding ang lakas ng core, balanse, at kalusugan ng puso.
  tldr: Ginagamit ng SUP ang core, binti, likod, at balikat sa bawat sagwan. Nakasusunog ang isang oras na sesyon ng 300-500 calories. Ang pag-sagwan laban sa hangin o agos ay dumoble ang intensidad. Nagdaragdag ang SUP yoga ng gawain sa flexibility at balanse.
  problem: Itinuturing ng maraming tao ang paddle boarding bilang kaswal na gawain sa halip na lehitimong kagamitan sa fitness, kaya napapalampas nila ang potensyal nito para sa pagsasanay ng buong katawan.
  solution: 'Istruktura ang mga sesyon ng SUP na may tiyak na layunin sa fitness: endurance paddling para sa cardio, interval sprints para sa lakas, SUP yoga para sa flexibility, at distance paddling para sa muscular endurance.'
  audience: Mga mahilig sa fitness na naghahanap ng mababang-impact at mataas na pakikilahok na ehersisyo para sa buong katawan.
  steps:
    - Mag-warm up sa lupa — pag-ikot ng braso, pagpihit ng torso, at pagbayo ng binti sa loob ng 5 minuto
    - Magsimula sa 10 minuto ng tuloy-tuloy na pag-sagwan sa katamtamang intensidad
    - Umusad sa interval training —2 minuto ng mabigat na pag-sagwan, 2 minuto ng madaling pag-recover
    - Isama ang mga pose ng SUP yoga — downward dog, warrior II, at tree pose sa board
    - Mag-cool down sa pamamagitan ng banayad na pag-sagwan at static na pag-stretch sa board
  faq:
    - q: Mas mahusay ba ang SUP kaysa pagtakbo para sa fitness?
      a: Nagbibigay ang SUP ng katumbas na benepisyo para sa puso na may mas mababang epekto sa joints. Mas hinihikayat din nito ang itaas na bahagi ng katawan at core kaysa pagtakbo.
    - q: Ilang calories ang nasusunog sa SUP?
      a: Humigit-kumulang 300-500 calories kada oras sa katamtamang intensidad. Ang karera o pag-sagwan laban sa hangin ay maaaring sumunog ng 600-800 calories kada oras.
    - q: Makakabuo ba ako ng kalamnan mula sa SUP?
      a: Oo. Napapalakas ng pag-sagwan ang mga kalamnan ng balikat, likod, at core. Ang pagbabalanse ay gumagamit ng binti at mga stabilizer na kalamnan. Ito ay buong-katawang resistance workout.

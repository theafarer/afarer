- slug: choosing-paddle
  category: buying-guide
  title: Paano Pumili ng Tamang SUP Paddle
  description: Gabay sa mga materyales ng paddle, hugis ng blade, uri ng shaft, at pagsukat para sa SUP.
  tldr: 'Haba ng paddle: ang mga SUP paddle ay dapat na 6-8" na mas matangkad kaysa sa iyong tangkad. Hugis ng blade: ang dihedral na blade ay diretso ang trak, ang flat na blade ay nag-aalok ng mas maraming catch. Materyal ng shaft: ang carbon ang pinakamagaan, ang fiberglass ang pinakamabuting halaga, ang aluminum ang pang-budget.'
  problem: Ang paggamit ng maling laki o materyal ng paddle ay nagdudulot ng hindi kinakailangang pagod, mahinang daloy ng stroke, at pagkaipit ng joints.
  solution: Itugma ang haba ng paddle, hugis ng blade, materyal ng shaft, at flex sa iyong istilo ng pag-sagwan, laki ng katawan, at badyet.
  audience: Mga SUP paddler na pumipili ng kanilang unang o susunod na paddle.
  steps:
    - Sukatin ang taas ng paddle —6-8" na mas matangkad kaysa sa iyong tangkad para sa pangkalahatang pag-sagwan
    - Pumili ng materyal ng blade — nylon para sa badyet, fiberglass para sa halaga, carbon para sa performance
    - Pumili ng hugis ng blade — dihedral para sa malinis na trak, flat para sa lakas, spoon para sa karera
    - Pumili ng uri ng shaft — tuwid para sa pangkalahatang gamit, baluktot para sa racing SUP
    - Tingnan ang flex — ang mas matigas na shaft ay naglilipat ng mas maraming lakas, ang flexible na shaft ay nagbabawas ng pagkaipit ng joints
  faq:
    - q: Ano ang pinakamahusay na materyal ng paddle?
      a: Nag-aalok ang fiberglass ng pinakamabuting balanse ng timbang, tibay, at gastos. Mas magaan ang carbon ngunit mas mahal at mas madaling mabali. Mabigat ang nylon ngunit halos hindi masisira.
    - q: Paano ko malalaman kung tamang haba ang aking paddle?
      a: Itayo ang paddle nang patayo sa tabi mo — dapat umabot sa iyong pulso ang handle kapag itinaas ang iyong braso sa itaas ng ulo.
    - q: Dapat ba akong kumuha ng one-piece o adjustable na paddle?
      a: Ang adjustable na paddle ay mabuti para sa ibinabahaging gamit at paglalakbay. Ang one-piece na paddle ay mas magaan, mas matigas, at mas episyente para sa nakalaang gamit.

- slug: how-to-choose-your-sup
  category: buying-guide
  title: Paano Piliin ang Iyong SUP Board
  description: Kumpletong gabay sa pagpili ng tamang stand-up paddleboard batay sa iyong antas ng kasanayan, kondisyon ng tubig, at nilalayong gamit.
  tldr: Piliin ang iyong SUP batay sa antas ng kasanayan, uri ng tubig, at pangunahing gamit. Ang mga All-Around board ay angkop sa mga baguhan at kalmadong tubig. Ang mga Touring board ay angkop sa malalayong pagpapaddle. Ang mga Yoga board ay may dagdag na lapad para sa katatagan. Ang mga Performance board ay umaangkop sa mga bihasang paddler sa iba't ibang kondisyon.
  problem: Karamihan sa mga unang-beses na mamimili ay pumipili ng SUP board batay sa presyo o itsura sa halip na kung paano at saan talaga sila magpapaddle. Ito ay humahantong sa mahinang katatagan, hindi sapat na performance, at nakakainis na karanasan.
  solution: Itugma ang hugis, volume, at konstruksyon ng board sa iyong antas ng kasanayan at pangunahing kapaligiran ng tubig. Ang mas malalapad na board (32-34") ay nagbibigay ng katatagan para sa mga baguhan. Ang mas mahahabang board (12-14") ay mas mahusay mag-track para sa touring. Ang drop-stitch na konstruksyon sa 12-15 PSI ay nagbibigay ng tigas na katumbas ng mga hard board.
  audience: Mga unang-beses na mamimili ng SUP, mga recreational paddler, at sinumang nag-a-upgrade mula sa payak na board.
  steps:
    - Tukuyin ang iyong pangunahing kapaligiran sa pagpapaddle — lawa, karagatan, ilog, o halo-halo
    - 'Itugma ang lapad ng board sa iyong antas ng kasanayan: 32-34" para sa mga baguhan, 30-32" para sa intermediate, 28-30" para sa advanced'
    - 'Piliin ang haba ng board batay sa gamit: mas maikli para sa maneuverability, mas mahaba para sa tracking at bilis'
    - 'Piliin ang konstruksyon: inflatable drop-stitch para sa daling dalhin, hard board para sa pinakamataas na performance'
    - Beripikahin ang weight capacity — ang iyong timbang kasama ang kagamitan ay hindi dapat lumampas sa 80% ng limitasyon ng board
    - 'Suriin ang mga kasamang accessory: pump, leash, fin, backpack, at repair kit'
  faq:
    - q: Anong lapad ng SUP ang pinakaangkop para sa mga baguhan?
      a: Ang 32 hanggang 34 pulgada na lapad ay nagbibigay ng pinakamatatag na plataporma para sa pag-aaral. Ang SUP Explorer 11 na may 33" na lapad ay perpekto para sa mga unang-beses na paddler sa kalmadong tubig.
    - q: Inflatable o hard SUP board?
      a: Ang mga inflatable board ay nagbibigay ng daling dalhin, kaginhawaan sa pag-iimbak, at pagsipsip ng impact. Ang mga hard board ay nagbibigay ng pinakamataas na tigas at bilis. Para sa karamihan ng mga recreational na gumagamit, ang de-kalidad na inflatable na may drop-stitch core ang praktikal na pagpilian.
    - q: Anong PSI ang dapat kong i-inflate?
      a: Inirerekomenda ng mga afarer board ang 12-15 PSI. Sa 15 PSI, nakakamit ng board ang pinakamataas na tigas na katumbas ng hard board. Laging manatili sa loob ng rated pressure range na naka-print sa board.

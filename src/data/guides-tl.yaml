- slug: paddling-techniques
  category: tutorial
  title: Mga Mahalagang Teknik ng Pagpapaddle sa SUP
  description: Pagdalubhasaan ang forward stroke, sweep stroke, at cross-bow turn upang maging mahusay na magpaddle sa anumang kondisyon.
  tldr: Ang forward stroke ay ginagamit ang iyong core, hindi ang iyong mga bisig. Ang sweep stroke ang pumipiko sa board. Ang cross-bow turn ang pinakamahusay na paraan ng pagpi-pivot. Panatilihing patayo ang paddle at lubusang ilubog ang blade para sa pinakamalakas na paglilipat ng lakas.
  problem: Karamihan sa mga paddler ay gumagamit ng mga stroke na nasa bisig na nag-aaksaya ng enerhiya at nagdudulot ng pagkapagod ng balikat. Ang mahinang teknik ay nagpapahirap din sa pagkontrol sa board sa hangin at magulong tubig.
  solution: Matuto ng tatlong mahalagang stroke — forward, sweep, at cross-bow turn — na may tamang mekanika ng katawan. Magsanay ng bawat isa sa kalmadong tubig bago lumipat sa mga mahihirap na kondisyon.
  audience: Mga paddler na nais magpaddle nang mas matagal, mas mabilis, at na may mas kaunting pagkapagod.
  steps:
    - 'Forward stroke: umabot sa harap, itanim nang buo ang blade, hilahin pabalik gamit ang pag-ikot ng torso (hindi ng bisig), at lumabas sa antas ng bukung-bukong'
    - 'Sweep stroke: umabot sa harap malapit sa rail, i-sweep ang blade sa malawak na arko patungo sa buntot, at iikot ang board palayo sa gilid ng paddle'
    - 'Cross-bow turn: ilagay ang paddle sa kabilang gilid ng board nang hindi nagpapalit ng hawak, at hilahin patungo sa buntot'
    - 'Bracing: gumamit ng low brace para sa katatagan sa magulong tubig — ihampas nang patag ang blade sa ibabaw ng tubig'
    - 'Draw stroke: umabot sa gilid, at hilahin ang board pahalang papalapit sa paddle'
  faq:
    - q: Paano ako magpaddle nang tuwid?
      a: Gumamit ng pare-parehong haba ng stroke sa magkabilang gilid. Magpalit ng gilid kada 5-10 stroke. Tumingin sa isang nakapirmeng punto sa horizon bilang sanggunian.
    - q: Dapat bang yukuin ang mga tuhod?
      a: Oo. Panatilihin ang bahagyang yuko sa iyong mga tuhod bilang shock absorber. Ang mga nakakandadang tuhod ay naglilipat ng bawat alon sa iyong core at nagpapababa ng katatagan.
    - q: Paano ako magpaddle laban sa hangin?
      a: Ibaba ang iyong stance, gumamit ng mas maiikli at mas mabilis na mga stroke, at manatiling mas malapit sa pampang kung saan kadalasang humihinang ang hangin. Kung napakalakas ng hangin, huwag nang lumabas.

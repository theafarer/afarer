    - sup-pump-guide
- id: sup-deck-pad-care
  question: 'Paano ko lilinisin ang EVA deck pad at aalagaan ito?'
  answer: 'Hugasan ng sariwang tubig ang deck pad pagkatapos ng bawat session. Para sa dumi o mantsa, gumamit ng banayad na sabon at malambot na brush — iwasan ang malalakas na kemikal. Kapag nagsimulang umangat ang mga gilid, maglagay ng maliit na halaga ng waterproof marine adhesive at diin sa ilalim ng timbang sa loob ng 24 oras. Itago ang board sa labas ng direktang UV kapag hindi ginagamit upang maiwasan ang pagkasira ng pad.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'Pwede ko bang i-paddle ang aking SUP nakaupo?'
  answer: 'Oo. Maraming SUP board, kabilang ang afarer Explorer 11, ang may mga D-ring na nagpapahintulot ng pagkabit ng upuan. Komportableng opsyon ang pagpapaddle nakaupo para sa mas mahahabang biyahe, pangingisda, o kapag gusto mong magpalit ng posisyon sa tubig.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: 'Kailangan ko bang hugasan ang aking inflatable board pagkatapos gamitin sa karagatan?'
  answer: 'Oo — laging hugasan ng sariwang tubig ang inyong board, mga fin, pump, at paddle pagkatapos gamitin sa maalat na tubig. Pumapasok sa mga seam at valve ang mga kristal ng asin, na nagdudulot ng micro-leak at kaagnasan. Patuyuin ang board sa lilim bago i-deflate at iimbak. Dramatikong pinapahaba ng regular na paghuhugas ang buhay ng inyong inflatable board.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'Kailangan ko talaga ng leash para sa SUP?'
  answer: 'Oo — laging magsuot ng leash. Nakakabit ang coiled SUP leash sa inyong bukung-bukong o hita at pinapanatiling kasama ang board kapag nahulog ka. Sa open water, maaaring makapagligtas ng buhay ang leash sa pamamagitan ng pag-iwas sa pagkakahiwalay sa inyong flotation device. Para sa pagpapaddle sa ilog, gumamit ng quick-release leash upang maiwasan ang pagkapitpit.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: 'Ano ang drop-stitch core technology at bakit ito mahalaga?'
  answer: 'Gumagamit ang drop-stitch core technology ng libu-libong polyester thread na nag-uugnay sa itaas at ibabang layer ng isang PVC board. Kapag na-inflate sa 15-20 PSI, bumubuo ang mga thread na ito ng matigas na estrukturang lumalaban sa torsion na gumagana tulad ng hard shell board. Gumagamit ang afarer ng military-grade triple-layer PVC na may drop-stitch lamination sa lahat ng SUP product tier, na nagbibigay ng rigidity na katumbas ng mga epoxy board habang pinapanatili ang portability ng inflatable.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup
- id: sup-inflatable-vs-rigid
  question: "Inflatable vs rigid SUP: alin ang mas mainam para sa iba't ibang gamit?"
  answer: 'Napakahusay ng mga inflatable SUP sa portability, pag-iimbak, at pagsipsip ng impact — perpekto para sa paglalakbay, mga baguhan, at recreational na paggamit. Nag-aalok ang mga rigid epoxy board ng pinakamataas na bilis at glide para sa racing at surfing. Para sa 90% ng mga paddler, sapat na ang rigidity na ibinibigay ng de-kalidad na inflatable na may drop-stitch core (15-20 PSI) para sa touring, fitness, yoga, at pangingisda. Katumbas ng performance ng mga mid-range hard board ang mga inflatable board ng afarer habang kayang i-pack sa isang backpack.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-vs-hard-board
    - how-to-choose-inflatable-sup
- id: sup-skill-progression
  question: 'Ano ang karaniwang pag-unlad ng kasanayan sa SUP mula baguhan hanggang advanced?'
  answer: 'Baguhan (session 1-3): pagtayo, basic forward stroke, pagliko, pagkahulog nang ligtas. Intermediate (session 5-15): episyenteng stroke technique, pivot turn, pag-navigate sa chop, basic rescue skill. Advanced (20+ session): racing start, buoy turn, pagsurf sa maliliit na alon, downwind paddling. Propesyonal: competitive racing, surf SUP, long-distance touring. Sinusuportahan ng mga afarer board ang bawat yugto: ang Explorer 11 para sa mga baguhan, ang Ocean Voyager para sa touring, at ang Cheetah Surge para sa performance paddling.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-cheetah-surge
  relatedGuides:
    - beginner-sup-guide
    - sup-fitness-workout
    - sup-paddle-guide
- id: sup-weight-capacity
  question: 'Gaano karaming timbang ang kayang buhatin ng isang inflatable SUP board?'
  answer: 'Nag-iiba-iba ang weight capacity ayon sa volume ng board. Mga afarer board: SUP Explorer 11 (260L, hanggang 100 kg / 220 lbs), Ocean Voyager 12 (310L, hanggang 140 kg / 308 lbs), Leviathan Wake (350L, hanggang 180 kg / 396 lbs). Para sa pinakamahusay na performance, panatilihin ang kabuuang karga (rider + gear) sa loob ng 80% ng max capacity. Mas mataas na lumulutang ang board at mas mahusay ang tracking nito kapag hindi overloaded, lalo na sa maalon na kondisyon.'
  category: product

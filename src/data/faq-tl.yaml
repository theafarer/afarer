- id: b2b-moq
  question: 'Ano ang minimum order quantity para sa OEM/ODM SUP production?'
  answer: 'Nag-iiba-iba ang mga minimum order quantity (MOQ) ayon sa uri ng produkto. Custom branding sa stock model: 50 unit bawat SKU. Pagpapaunlad ng custom shape mold: 200–500 unit bawat modelo (unang order). Available ang mold sharing program mula 50 unit. Mga accessory at PFD: 500–1000 unit bawat disenyo. Makipag-ugnayan sa aming OEM team kasama ang inaasahang volume para sa tumpak na MOQ at presyo.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Ano ang mga karaniwang lead time para sa mga OEM SUP order?'
  answer: 'Unang OEM order na may custom branding sa mga umiiral na mold: 6–8 linggo mula deposito hanggang FOB Qingdao. Custom shape order na nangangailangan ng bagong mold: 12–20 linggo (kabilang ang 3D design, paggawa ng mold, prototyping, at bulk production). Mga repeat order na may aprubadong specification: 6–8 linggo. Maaaring i-expedite sa 4–5 linggo ang mga urgent na order para sa mga umiiral na mold. Kasama sa lead time ang pagkuha ng hilaw na materyales, produksyon, inline QC, at pagkarga sa container.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Anong mga sertipikasyon ang dala ng mga produktong OEM ng afarer?'
  answer: 'Dala ng lahat ng produktong OEM/ODM ng afarer ang: CE declaration of conformity (merkado ng EU), UKCA (merkado ng UK), ISO 9001:2015 quality management system, BSCI social compliance audit, REACH at RoHS material compliance, EN ISO 25649 classification para sa mga inflatable SUP board. Mga karagdagang sertipikasyon na available sa request: US Coast Guard compliance documentation, military standard testing (MIL-STD-810), at suporta sa sertipikasyon ng pag-import sa destinasyong bansa.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Pwede ba akong umorder ng sample bago mag-commit sa bulk production?'
  answer: 'Oo. Available ang mga sample order para sa lahat ng OEM/ODM project. Ginagawa ang mga pre-production sample (PPS) pagkatapos ng paggawa ng mold at bago ang bulk production. Lead time ng sample: 15–25 working day para sa mga umiiral na mold, 25–40 working day para sa custom mold. Maibabawas ang gastos sa sample sa unang bulk order. Ipinapadala ang mga sample sa pamamagitan ng express carrier (DHL, FedEx, UPS) na may kumpletong tracking at karaniwang dumarating sa loob ng 3–5 business day.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'Anong mga payment term ang available para sa mga OEM order?'
  answer: 'Mga standard na payment term: 30% deposito sa pagpirma ng PI (proforma invoice), 70% balanse bago ang pagpapadala laban sa kopya ng B/L (bill of lading). Para sa mga unang partner: 50% deposito, 50% bago ang pagpapadala. Para sa mga matagal nang partner na may kasaysayan ng order: L/C at sight, o net 30 araw para sa mga kwalipikadong account (sakop ng credit review). Mga paraan ng pagbabayad: T/T wire transfer, L/C (letter of credit), Western Union. Lahat ng bayad ay sa USD o EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Paano pinoprotektahan ng afarer ang aking intellectual property at mga disenyo?'
  answer: 'Pangunahing bahagi ng aming OEM service ang proteksyon sa IP. Nagpapirmahan kami ng NDA bago ang anumang diskusyon sa disenyo. Pinangangasiwaan ang mga design file sa mga hiwalay na workstation na may access logging. Nananatiling eksklusibong pag-aari ninyo ang lahat ng tooling at mold (binabayaran ninyo). Hindi namin gagamitin muli ang inyong mga mold o disenyo para sa ibang kliyente. Kasama ang pag-iimbak at pagpapanatili ng mold para sa mga aktibong account. Sa pagtatapos ng kasunduan, maaaring ipadala sa inyo ang mga mold o wasakin na may video documentation. Iginagalang namin ang lahat ng karapatang trademark at patente.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Anong mga opsyon sa shipping at logistics ang available?'
  answer: 'FOB Qingdao (standard): ikakarga ang karga sa port ng Qingdao; kayo ang mag-aayos ng freight mula roon. CIF (tinukoy na port): kami ang mag-aayos at magse-seguro ng pagpapadala papunta sa inyong destinasyong port. DDP / door-to-door: full-service logistics kabilang ang customs clearance at huling paghahatid. Ocean freight patungong US West Coast: humigit-kumulang 25–30 araw. Ocean freight patungong EU (Hamburg/Rotterdam): humigit-kumulang 30–35 araw. Available ang air freight para sa mga urgent na order (3–5 araw). Pinangangasiwaan namin ang lahat ng export customs documentation, certificate of origin, at packing list.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Anong mga proseso ng quality control ang inia-apply sa mga OEM order?'
  answer: 'Sinusunod ng bawat OEM order ang isang nakadokumentong QC plan: 1) Incoming material inspection — batch testing ng PVC fabric para sa kapal, tensile strength, at UV resistance. 2) In-process QC — pagsusuri sa lakas ng seam weld bawat 50 unit, pressure hold test sa 1.25x na rated PSI. 3) Final inspection — 100% visual inspection at pressure testing ng bawat board. 4) AQL sampling — batch sampling ayon sa ISO 2859 na may critical defect = 0 acceptance. 5) Third-party inspection — available ang SGS, Bureau Veritas, o Intertek sa gastos ng bibili.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Pwede ba kayong gumawa ng custom packaging para sa aking brand?'
  answer: 'Oo. Nag-aalok kami ng buong custom packaging services: retail box na may full-color CMYK printing at brand graphics, carry bag na may screen-printed o embroidered na logo, manwal ng tagubilin sa inyong wika, hang tag at barcode/UPC label, at panloob na packaging (polybag, foam insert). Minimum packaging MOQ: 500–1000 unit para sa custom box, 200–500 para sa carry bag. Kasama ang packaging design service sa mga OEM order.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Pwede ba akong bumisita sa pabrika o mag-ayos ng third-party audit?'
  answer: 'Malugod naming tinatanggap ang mga pagbisita sa pabrika sa appointment. Sinasalubong namin ang mga may-ari ng brand sa buong taon at maaari kaming mag-ayos ng pickup sa paliparan mula sa Qingdao Jiaodong International Airport (TAO). Para sa mga buyer na hindi makabisita, nag-aalok kami ng: virtual factory tour sa pamamagitan ng video call, koordinasyon ng third-party audit sa SGS/Bureau Veritas (ang bibili ang sasagot sa gastos ng audit), at detalyadong documentation package ng kakayahan ng pabrika kabilang ang listahan ng kagamitan, QC process flow, at mga kwalipikasyon ng tauhan.'
  category: b2b

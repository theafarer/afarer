- id: fishing-sup-setup
  question: 'Pwede ba akong mangisda mula sa SUP board?'
  answer: 'Oo. Lalong sumisikat ang SUP fishing dahil nagbibigay ang nakatayong posisyon ng mahusay na tanaw sa ilalim ng tubig. Pumili ng board na hindi bababa sa 11 feet ang haba at 33–34 inches ang lapad para sa stability. Magdagdag ng milk crate na may mga rod holder na nakakabit sa deck bungees, maliit na anchor, at laging magsuot ng PFD. Mahusay ang afarer SUP Explorer 11 para sa kaswal na pangingisda.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: 'Pwede ba akong mag-yoga sa SUP board?'
  answer: 'Siyempre. Pinagsasama ng SUP yoga ang mga tradisyonal na pose sa hamon ng lumulutang na platform, na nagpapagana ng mas malalim na stabilizer muscle. Gumamit ng board na 33 inches o mas maluwag na may malambot at madikit na deck pad. Magsanay sa kalmado at mababaw na tubig na may anchor. Magsimula sa mga foundation pose tulad ng downward dog, warrior II, at tree pose. Napakaangkop ng SUP Explorer 11 na may buong EVA deck pad.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: 'Ano ang mga patakaran ng airline sa paglalakbay gamit ang inflatable SUP?'
  answer: 'Tinatanggap ng karamihan ng mga airline ang mga SUP backpack bilang checked baggage kung mas mababa sa 23–32 kg. Humigit-kumulang 90x40x30 cm ang afarer backpack at tumitimbang ng humigit-kumulang 15 kg kapag naka-pack. Maaaring mag singil ng oversized baggage fee ang ilang airline. Dumating nang maaga, ibalot nang hiwalay ang mga fin at pump sa inyong carry-on, at lagyan ng label na fragile ang bag. Laging saliksikin ang patakaran ng inyong airline sa sporting equipment bago lumipad.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'Anong kagamitang pangkaligtasan ang kailangan ko para sa pagpapaddle sa malamig na tubig?'
  answer: 'Nangangailangan ng thermal protection ang tubig na mas mababa sa 15°C. Para sa 8–14°C, gumamit ng wetsuit o drysuit na may boots, gloves, at hood. Sapat na ang 3/2mm wetsuit para sa 14–20°C. Laging magsuot ng tamang sukat na PFD para sa thermal protection at kaligtasan. Suriin ang mga lokal na regulasyon para sa mga obligadong kagamitan.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'Ano ang mga minimum order quantity para sa OEM/ODM?'
  answer: 'Nag-iiba-iba ang mga minimum order quantity (MOQ) ayon sa uri ng produkto at pagiging komplikado nito. Karaniwang nangangailangan ng 5–10 unit ang custom branding sa mga umiiral na modelo. Nangangailangan ng mas mataas na MOQ ang mga ganap na custom hull design. Makipag-ugnayan sa aming sales team kasama ang inyong mga kinakailangan para sa detalyadong quote. Pinangangasiwaan namin ang lahat mula sa custom na kulay at logo hanggang sa ganap na orihinal na disenyo ng mold.'

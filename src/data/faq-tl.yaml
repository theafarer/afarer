- id: warranty-claim
  question: 'Paano ako magfa-file ng warranty claim?'
  answer: 'Mag-file ng claim sa pamamagitan ng pakikipag-ugnayan sa aming support team kasama ang inyong order number, mga litrato ng problema, at maikling paglalarawan. Sinusuri ang karamihan ng mga claim sa loob ng 2 business day. Nakakatanggap ang mga aprubadong claim ng kapalit o tagubilin sa pag-aayos sa loob ng ilang araw.'

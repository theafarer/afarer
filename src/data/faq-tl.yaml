- id: sup-inflate-pressure
  question: 'Anong PSI dapat ang i-inflate ko sa aking SUP?'
  answer: 'I-inflate hanggang sa rated maximum PSI ng board para sa pinakamahusay na performance — karaniwang 15–18 PSI para sa mga de-kalidad na inflatable SUP. Pinakamahusay ang takbo ng afarer SUP Explorer 11 sa 15–18 PSI. Ang kulang na inflation ay nagiging sanhi ng pamumulos ng board at mahinang tracking. Maaaring makasira sa mga drop-stitch thread ang sobrang inflation lampas sa rated max. Tingnan ang sticker malapit sa valve para sa partikular na rating ng inyong board.'

  answer: 'Tinatanggap namin ang mga return sa loob ng 30 araw mula sa paghahatid para sa mga hindi pa nagamit na produkto na nasa orihinal na packaging. Hindi maaaring i-return ang mga Custom/OEM order. Makipag-ugnayan sa aming support team upang simulan ang return — nagbibigay kami ng prepaid shipping label.'

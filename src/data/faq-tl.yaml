- id: paddle-length
  question: 'Anong haba ng paddle ang kailangan ko?'
  answer: "Dapat na 6–8 inches na mas mataas sa inyong taas ang paddle. Nagpapahintulot ang mga adjustable paddle ng fine-tuning para sa iba't ibang kondisyon. Tingnan ang aming paddle guide para sa detalyadong sizing."
  category: product
  relatedProducts: []
  relatedGuides:

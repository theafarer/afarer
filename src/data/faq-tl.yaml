- id: sup-learning
  question: 'Mahirap ba matutunan ang SUP?'
  answer: 'Hindi naman. Karamihan ng mga baguhan ay nakatatayo at nakapapaddle na sa loob ng kanilang unang session. Ang aming All-Around SUP series ay may mga extra-wide at matatag na platform na partikular na dinisenyo para sa mga first-time paddler. Magsimula sa kalmadong tubig at maglalayag ka na sa loob ng ilang minuto.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Pwede ko bang gamitin sa karagatan?'
  answer: 'Oo. Ang mga afarer SUP board ay ginawa para sa paggamit sa karagatan, lawa, at ilog. Kayang harapin ng aming Touring series ang coastal chop, at lahat ng board ay gumagamit ng marine-grade PVC na lumalaban sa kaagnasan ng maalat na tubig. Hugasan ng sariwang tubig pagkatapos gamitin sa karagatan.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Gaano katagal bago ito ma-inflate?'
  answer: 'Sa tulong ng kasamang dual-action pump, karamihan ng mga board ay umabot sa 12–15 PSI sa loob ng mas mababa sa 5 minuto. Pinapaikli ng aming electric pump option ang oras na iyon sa mas mababa sa 2 minuto. Ang pag-deflate at pag-pack ay tumatagal ng humigit-kumulang 3 minuto.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Pwede ba akong maglakbay gamit ang inflatable SUP?'
  answer: 'Siyempre. Ang bawat afarer board ay kayang i-pack sa isang backpack-sized na carrying case na tumutugma sa mga requirement ng airline para sa bagahe. Sa bigat na 18–22 lbs lamang, madali itong dalhin sa dalampasigan, lawa, o sa mga terminal ng paliparan.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Ano ang weight limit?'
  answer: 'Sinusuportahan ng aming All-Around SUP ang hanggang 220 lbs. Sinusuportahan naman ng Touring at Yoga series ang hanggang 250 lbs. Para sa tandem na paggamit o mas mabibigat na karga, makipag-ugnayan sa aming team para sa mga rekomendasyon.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Ano ang laman ng box?'
  answer: 'Ang bawat afarer SUP ay kinabibilangan ng board, travel backpack, dual-action hand pump, removable fin, coil leash, at repair kit. May kasama ring carbon paddle upgrade option ang ilang modelo.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'May mga bundle deal ba kayo?'
  answer: 'Oo. Nag-aalok kami ng mga maingat na pinagsamang bundle na nakakatipid ka kumpara sa pagbili ng mga item nang hiwalay. Makipag-ugnayan sa aming sales team para sa mga kasalukuyang bundle promotion at presyo ng volume discount.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Kailangan ko bang magsuot ng life vest sa SUP?'
  answer: 'Oo. Maraming hurisdiksyon ang legal na nangangailangan ng life vest sa anumang watercraft, kabilang ang mga SUP. Kahit saang hindi ito kinakailangan, ang CE-certified na life vest ay mahalagang kagamitan sa kaligtasan. Inirerekomenda namin na isuot ito habang nasa tubig.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Kailangan ko bang irehistro ang aking SUP board?'
  answer: 'Nag-iiba-iba ang mga requirement depende sa hurisdiksyon. Sa karamihan ng mga rehiyon, hindi nangangailangan ng rehistrasyon ang mga unpowered SUP. Kung plano mong magdagdag ng motor, suriin ang inyong lokal na maritime authority para sa mga partikular na patakaran. Pangkalahatang exempt sa rehistrasyon ng bangka ang mga recreational paddle board.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Paano ko inaayus ang butas?'
  answer: 'Linisin ang lugar, gupitin ang patch na bilugan ang mga sulok, maglagay ng PVC adhesive, diin nang mabuti, at maghintay ng 24 oras bago i-inflate. Kasama ang repair kit sa mga afarer board. Para sa mas detalyadong mga tagubilin, tingnan ang aming inflatable repair guide.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Paano ko dapat iimbak ang aking inflatable SUP?'
  answer: 'Hugasan ng sariwang tubig, patuyuin nang lubos, i-deflate nang buo, i-roll nang maluwag mula sa nose, at iimbak sa carry bag sa isang malamig at tuyong lugar na malayo sa direktang sikat ng araw. Huwag kailanman iimbak na basa o sa matinding temperatura.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Inflatable o hard SUP board?'
  answer: 'Nag-aalok ang mga inflatable board ng portability, kaginhawaan sa pag-iimbak, at pagsipsip ng impact. Nag-aalok naman ang mga hard board ng pinakamataas na rigidity at bilis. Para sa karamihan ng mga recreational na gumagamit, ang de-kalidad na inflatable na may drop-stitch core ang praktikal na pagpilian.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Anong bilis ng hangin ang sobrang mataas para sa SUP?'
  answer: 'Mga baguhan: lampas 10 mph (8 knots). Intermediate: lampas 15 mph (13 knots). Advanced: lampas 20 mph (17 knots). Kung nag-aalinlangan, huwag nang lumabas. Mapanganib ang offshore wind (umiihip mula sa lupa patungong dagat) sa anumang antas ng kasanayan.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Ano ang warranty ng afarer?'
  answer: 'May komprehensibong manufacturer warranty ang lahat ng produktong afarer. Sakop ng 2+ taon laban sa mga depekto sa paggawa ang mga SUP board. Sumasakop ang warranty sa mga depekto sa materyales at paggawa sa ilalim ng normal na paggamit.'

- slug: sup-fishing
  category: lifestyle
  title: 'Pêche en paddle : le guide complet pour pêcher depuis votre paddle'
  description: Tout ce qu'il faut savoir sur la pêche depuis un paddle — équipement, conseils de stabilité et techniques.
  tldr: La pêche en paddle permet une approche silencieuse, l'accès aux eaux peu profondes et des lancers à 360 degrés. Utilisez une planche large et stable (34 pouces et plus), fixez des porte-cannes et utilisez une glacière ou une caisse comme rangement. Ancrez-vous en cas de vent. Portez toujours un gilet de sauvetage.
  problem: Les bateaux de pêche classiques coûtent cher à entretenir et ne peuvent pas accéder aux eaux peu profondes. La pêche en paddle résout ce problème en offrant une plateforme de pêche portable pour les hauts-fonds, mais elle demande des aménagements spécifiques.
  solution: Équipez un paddle stable de porte-cannes, d'une caisse à matériel et d'un système d'ancrage. Profitez de la portabilité de la planche pour atteindre des spots de pêche isolés, inaccessibles aux bateaux.
  audience: Les pêcheurs qui veulent pêcher en eaux peu profondes, dans des endroits reculés, ou qui préfèrent une plateforme de pêche légère et portable.
  steps:
    - Choisissez une planche large (34 pouces et plus) avec une forte capacité de charge pour le matériel
    - Installez des porte-cannes sur le pont avec des systèmes sur rail ou à sangles
    - Utilisez une caisse étanche ou une glacière sanglée sur le pont avant pour le matériel de pêche
    - Emportez une petite ancre ou un piquet d'arrêt pour les jours de vent
    - Portez un gilet de sauvetage à poches pour les outils et le téléphone
    - Entraînez-vous à lancer depuis une position à genoux avant de pêcher debout
  faq:
    - q: Peut-on pêcher debout sur un paddle ?
      a: Oui. Une planche de 34 pouces de large ou plus offre une stabilité suffisante pour pêcher et lancer debout. Entraînez-vous d'abord sur eau calme.
    - q: Quels poissons puis-je cibler depuis un paddle ?
      a: Le paddle est excellent pour le black-bass en lac, le tambour rouge sur les flats, la truite en rivière et les espèces côtières dans les baies et les estuaires.
    - q: Comment remonter un poisson sur un paddle ?
      a: Mettez-vous à genoux pour rester stable. Utilisez une épuisette ou une pince à lèvres. Gardez le poisson au plus bas pour éviter de tomber à l'eau. Relâchez-le ou placez-le dans une glacière.

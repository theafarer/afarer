- slug: sup-for-pet-owners
  category: lifestyle
  title: Paddle avec son chien — Le guide complet du stand-up paddle avec votre animal
  description: "Tout ce qu'il faut savoir sur le paddle avec son chien : étapes d'entraînement, équipement de sécurité, choix de la planche et conseils pour une session de SUP réussie avec votre compagnon à quatre pattes."
  tldr: Commencez avec une planche large et stable (34" et plus). Utilisez un gilet de sauvetage pour chien, un tapis de pont antidérapant et un leash court. Entraînez-vous d'abord sur terre, puis dans peu d'eau. Gardez des sessions courtes (20-30 min). Apportez de l'eau fraîche et une serviette. Ne forcez jamais votre chien s'il semble anxieux.
  problem: Faire du paddle avec son chien peut être stressant sans une préparation adéquate — les chiens peuvent paniquer, sauter de la planche ou griffer la surface du pont.
  solution: Utilisez une planche large et stable avec un pont en EVA souple. Habituez votre chien progressivement. Emportez un équipement de sécurité comprenant un gilet de sauvetage pour animal et un leash court adapté au SUP.
  audience: Les propriétaires de chiens qui veulent faire du paddle avec leur animal.
  steps:
    - Commencez avec une planche large (34" et plus, avec une charge utile élevée pour vous + votre chien)
    - Procurez-vous un gilet de sauvetage pour chien bien ajusté et muni d'une anse
    - "Entraînez-vous sur terre : faites asseoir votre chien sur la planche dégonflée, puis sur la planche gonflée posée sur l'herbe"
    - "Passez dans peu d'eau : agenouillez-vous sur la planche avec votre chien et donnez quelques coups de pagaie"
    - 'Gardez des sessions courtes : 20 à 30 minutes maximum lors des premières sorties'
    - Apportez toujours de l'eau fraîche, une gamelle pliable et une serviette pour votre chien
  faq:
    - q: Quelle planche de paddle convient le mieux aux chiens ?
      a: Une planche large et stable avec un pont en EVA souple offrant de l'adhérence aux pattes. La Tropical Breeze Island Escape, avec sa largeur de 34" et plus, est idéale pour pagayer avec des chiens.
    - q: Mon chien a-t-il besoin d'un gilet de sauvetage ?
      a: Oui, même pour les bons nageurs. Un gilet de sauvetage pour chien avec anse facilite la remontée de votre chien sur la planche s'il tombe à l'eau.
    - q: Comment empêcher mon chien de griffer la planche ?
      a: Coupez régulièrement les griffes de votre chien. Le tapis de pont en mousse EVA protège la surface en PVC. Placez une serviette ou un tapis pour animal sur le pont pour une protection supplémentaire.

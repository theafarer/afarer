- slug: choosing-paddle
  category: buying-guide
  title: Comment choisir la bonne pagaie de paddle
  description: Un guide des matériaux, formes de pale, types de manche et dimensions pour bien choisir sa pagaie de paddle.
  tldr: "Longueur de pagaie : une pagaie de paddle doit dépasser votre taille de 6 à 8 pouces. Forme de pale : les pales diédrales offrent une meilleure tenue de cap, les pales plates accrochent davantage l'eau. Matériau du manche : le carbone est le plus léger, la fibre de verre offre le meilleur rapport qualité-prix, l'aluminium est l'entrée de gamme."
  problem: Une pagaie de mauvaise taille ou dans un matériau inadapté provoque une fatigue inutile, une mauvaise efficacité de coup de pagaie et des tensions articulaires.
  solution: Accordez la longueur, la forme de la pale, le matériau et la rigidité du manche à votre style de pagayage, votre morphologie et votre budget.
  audience: Les paddlers qui choisissent leur première pagaie — ou la suivante.
  steps:
    - Mesurez la hauteur de la pagaie — 6 à 8 pouces de plus que votre taille pour la pratique polyvalente
    - Choisissez le matériau de la pale — nylon pour le petit budget, fibre de verre pour le meilleur rapport qualité-prix, carbone pour la performance
    - Choisissez la forme de la pale — diédrale pour un tracé fluide, plate pour la puissance, cuillère pour la course
    - Choisissez le type de manche — droit pour un usage polyvalent, coudé pour le SUP de course
    - Vérifiez la flexibilité — un manche plus rigide transmet davantage de puissance, un manche souple réduit les tensions articulaires
  faq:
    - q: Quel est le meilleur matériau pour une pagaie ?
      a: La fibre de verre offre le meilleur équilibre entre poids, durabilité et prix. Le carbone est plus léger mais plus cher et plus fragile. Le nylon est lourd mais quasiment indestructible.
    - q: Comment savoir si ma pagaie fait la bonne longueur ?
      a: Tenez la pagaie verticalement à côté de vous — la poignée doit atteindre votre poignet lorsque votre bras est levé au-dessus de la tête.
    - q: Faut-il choisir une pagaie monobloc ou une pagaie réglable ?
      a: Les pagaies réglables sont pratiques pour un usage partagé et les voyages. Les pagaies monoblocs sont plus légères, plus rigides et plus efficaces pour un usage dédié.

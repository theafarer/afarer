- slug: sup-weight-capacity
  category: buying-guide
  title: Charge maximale d'un SUP — Quel poids un paddle peut-il supporter ?
  description: Comprendre les limites de charge maximale d'un SUP, calculer votre charge totale et savoir pourquoi dépasser la limite affecte les performances et la sécurité.
  tldr: Ne dépassez jamais 80 % de la charge maximale de votre planche avec votre poids corporel et votre matériel. Une planche avec une charge maximale de 220 lb convient à un paddler de 160 lb avec un matériel léger. Dépasser la limite provoque un enfoncement de la planche, une maniabilité dégradée et un risque accru de dommages.
  problem: Les paddlers dépassent souvent la charge maximale de leur planche, ce qui entraîne des performances médiocres, une planche qui s'enfonce et des dommages potentiels. Les fabricants indiquent des limites maximales sans expliquer les charges d'utilisation sûres.
  solution: Calculez votre charge totale (poids du corps + matériel + eau absorbée par la planche) et restez sous 80 % de la charge maximale indiquée. Les paddlers plus lourds ont besoin de planches à volume élevé affichant une charge de 300 lb ou plus.
  audience: Tous les paddlers, en particulier les plus corpulents et ceux qui emportent du matériel d'expédition.
  steps:
    - Repérez la charge maximale indiquée sur votre planche (généralement près de la valve)
    - 'Pesez-vous avec tout votre matériel : pagaie, gilet de sauvetage, sacs étanches, glacière et accessoires'
    - 'Calculez : (votre charge totale) ÷ (charge maximale) × 100 = pourcentage de la capacité utilisée'
    - Visez 70 à 80 % pour des performances et une sécurité optimales
    - Si vous dépassez 80 %, choisissez une planche plus grande ou allégez votre matériel
  faq:
    - q: Que se passe-t-il si je dépasse la limite de poids ?
      a: La planche flotte plus bas, ce qui augmente la traînée. La stabilité diminue, l'avant peut s'enfoncer sous la surface et la structure drop-stitch court un risque de dommage accru dans le clapot.
    - q: Deux personnes peuvent-elles monter sur un même SUP ?
      a: Uniquement si le poids total reste sous 80 % de la capacité. La plupart des SUP standards sont conçus pour un seul pratiquant. La pratique à deux exige une planche expressément homologuée pour deux personnes.
    - q: Les paddles gonflables ont-ils une charge maximale inférieure aux planches rigides ?
      a: Les gonflables de qualité à construction drop-stitch offrent des charges maximales comparables, voire supérieures, aux planches rigides grâce à leur volume réparti plus épais.

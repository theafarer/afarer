- slug: sup-board-materials
  category: technical
  title: Matériaux des planches de paddle — PVC, EPS, époxy et drop-stitch expliqués
  description: 'Guide technique des matériaux de construction des paddles : gonflable drop-stitch en PVC contre planche rigide à noyau en mousse EPS. Comprenez ce qui différencie les performances de chaque type.'
  tldr: Les paddles gonflables utilisent du PVC drop-stitch avec des milliers de fils internes pour la rigidité. Les planches rigides utilisent un noyau en mousse EPS avec une coque en époxy ou en fibre de verre. Les gonflables l'emportent en portabilité et en durabilité. Les rigides l'emportent en vitesse et en sensations. La technologie drop-stitch moderne à 15 PSI rivalise avec la rigidité des planches rigides.
  problem: Les acheteurs ne comprennent pas les différences fondamentales de construction entre les gonflables et les planches rigides, ce qui conduit à des achats inadaptés.
  solution: 'Choisissez le matériau selon votre usage principal : drop-stitch gonflable pour les voyages, le rangement et la durabilité. EPS/époxy pour la course, le surf et la performance maximale.'
  audience: Les acheteurs de paddle qui comparent la construction gonflable et rigide.
  steps:
    - 'Drop-stitch gonflable : des milliers de fils de polyester relient les couches supérieure et inférieure, créant une structure rigide sous une pression de 12 à 15 PSI'
    - 'Planche rigide en mousse EPS : noyau en polystyrène expansé façonné selon le design de la coque, scellé avec de la résine époxy et des couches de fibre de verre'
    - 'Avantages des gonflables : pliables, quasi indestructibles, légers à transporter, bords souples pour la sécurité'
    - 'Avantages des planches rigides : poids total plus léger, plateforme plus rigide, meilleur glissement, plus de réactivité'
    - 'Options hybrides : certains fabricants combinent drop-stitch et panneaux rigides pour profiter du meilleur des deux mondes'
  faq:
    - q: Les paddles gonflables sont-ils aussi rigides que les planches rigides ?
      a: À 15 PSI avec une construction drop-stitch de qualité, les gonflables modernes s'en approchent beaucoup. La plupart des pagayeurs récréatifs ne font pas la différence. Les pagayeurs de course remarqueront l'avantage de la planche rigide.
    - q: Quel matériau dure le plus longtemps ?
      a: Les paddles gonflables durent de 5 à 10 ans avec un bon entretien. Les planches rigides durent de 10 à 20 ans mais sont vulnérables aux fissures, aux impacts et aux infiltrations d'eau. Les gonflables résistent mieux aux dommages du quotidien.
    - q: Le PVC est-il écologique ?
      a: La production de PVC a un impact environnemental, mais les paddles gonflables durent plus longtemps (réduisant la fréquence de remplacement) et se rangent plus petit (réduisant les émissions de transport). Recyclez toujours correctement les anciennes planches.

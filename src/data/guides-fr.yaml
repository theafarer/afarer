- slug: sup-for-touring
  category: buying-guide
  title: Meilleur SUP de randonnée — Guide d'achat des planches de paddle longue distance
  description: 'Comment choisir un SUP de randonnée pour pagayer sur longue distance : forme de la coque, longueur, largeur, tenue de cap et équipement recommandé pour les expéditions de plusieurs jours.'
  tldr: Les SUP de randonnée exigent des coques plus longues (12-14 pieds), une proue à déplacement pour un glissement efficace et une largeur modérée (30-32") pour tenir le cap. Recherchez des élastiques de pont, plusieurs anneaux en D et un drop-stitch à haute pression (PSI). Une pagaie spécifique randonnée, avec une pale plus petite, réduit la fatigue sur les longues journées.
  problem: Utiliser une planche polyvalente courte pour la randonnée se traduit par une vitesse lente, un mauvais cap et une fatigue précoce. Le pagayage sur longue distance exige une coque spécialisée.
  solution: Choisissez une planche de 12 pieds ou plus avec une proue à déplacement. L'Ocean Pulse et l'Ocean Voyager d'afarer offrent la forme de coque spécifique randonnée et les élastiques de pont nécessaires aux expéditions.
  audience: Les pagayeurs qui préparent des sorties à la journée, des expéditions de plusieurs jours ou du pagayage sportif sur longue distance.
  steps:
    - Choisissez une planche de 12 à 14 pieds pour un glissement et un cap efficaces
    - Optez pour une proue à déplacement (nez pointu) qui traverse le clapot
    - Visez une largeur de 30-32" — plus large c'est plus stable, plus étroit c'est plus rapide
    - Vérifiez la présence d'élastiques de pont et d'anneaux en D pour arrimer l'équipement
    - Choisissez une pagaie de randonnée (pale plus petite, manche plus long) pour l'endurance
    - Envisagez un système d'ailerons avec un aileron de randonnée plus long pour une meilleure tenue de cap
  faq:
    - q: Quelle longueur de SUP de randonnée est idéale ?
      a: 12 pieds est le format idéal pour la plupart des pagayeurs — bon glissement et transport facile. 14 pieds est plus rapide, mais plus lourd et plus difficile à transporter. Les débutants devraient commencer avec 12 pieds.
    - q: Les SUP de randonnée ont-ils besoin d'un aileron spécial ?
      a: Un aileron de randonnée plus long (6-9") améliore nettement la tenue de cap. Beaucoup de planches de randonnée sont équipées d'un boîtier d'aileron US pour des ailerons interchangeables.
    - q: Puis-je utiliser une planche polyvalente pour la randonnée ?
      a: Sur courtes distances (1 à 3 miles), une planche polyvalente fait l'affaire. Sur de plus longues distances, la coque d'une planche de randonnée dédiée fait une différence spectaculaire sur la vitesse et la fatigue.

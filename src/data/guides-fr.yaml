- slug: sup-size-guide
  category: buying-guide
  title: Guide des tailles SUP — Comment choisir les bonnes dimensions de votre planche
  description: 'Guide des tailles complet : recommandations de longueur, largeur et épaisseur selon votre poids, votre taille, votre niveau et votre style de pagayage.'
  tldr: Les débutants ont besoin de planches plus larges (32 à 34 pouces) pour la stabilité. Les paddlers plus lourds ont besoin de planches plus longues (11 pieds et plus) avec un volume plus élevé. Le touring exige des coques plus longues (12 pieds et plus). Le yoga sur paddle nécessite une largeur supplémentaire (34 pouces et plus). Vérifiez toujours la charge maximale — votre poids plus celui du matériel ne doit pas dépasser 80 % de la limite.
  problem: Choisir la mauvaise taille de SUP conduit à une stabilité précaire, une mauvaise tenue de cap et une expérience frustrante. La plupart des acheteurs novice choisissent une planche à l'aspect séduisant sans réfléchir à l'impact des dimensions sur les performances.
  solution: "Accordez la longueur, la largeur et l'épaisseur de la planche à votre poids, votre niveau et votre usage principal. Utilisez notre calculateur : additionnez votre poids et celui de votre matériel, puis choisissez une planche offrant au moins 20 % de marge au-dessus de ce total."
  audience: Les acheteurs d'un premier SUP, les paddlers passant à une planche spécialisée et toute personne indécise sur les dimensions.
  steps:
    - Pesez-vous avec tout le matériel transporté (pagaie, gilet de sauvetage, sac étanche)
    - Ajoutez une marge de sécurité de 20 % pour déterminer la charge minimale requise
    - 'Choisissez la largeur selon votre niveau : 32 à 34 pouces pour les débutants, 30 à 32 pouces pour les intermédiaires, 28 à 30 pouces pour les confirmés'
    - "Sélectionnez la longueur selon l'usage : 10 pieds 6 pouces à 11 pieds 6 pouces pour le polyvalent, 12 à 14 pieds pour le touring, 9 à 10 pieds pour les eaux vives"
    - "Vérifiez l'épaisseur : 6 pouces en standard, 4 pouces pour la performance, 5 pouces pour le polyvalent"
    - Contrôlez la plage de PSI recommandée pour votre planche afin d'obtenir une rigidité optimale
  faq:
    - q: Quelle largeur de SUP convient le mieux aux débutants ?
      a: Une largeur de 32 à 34 pouces offre la plateforme la plus stable. Plus la planche est large, plus l'équilibre est facile — surtout pour les paddlers corpulents.
    - q: Comment savoir si un SUP est trop petit pour moi ?
      a: Si la planche s'enfonce dans l'eau, réagit avec mollesse ou si l'avant s'immerge facilement à chaque coup de pagaie, elle est probablement sous-dimensionnée pour votre poids.
    - q: La longueur de la planche influe-t-elle sur la vitesse ?
      a: Oui. Une longueur de flottaison plus grande augmente la vitesse théorique de coque. À effort égal, une planche de touring de 14 pieds est nettement plus rapide qu'une planche polyvalente de 10 pieds.

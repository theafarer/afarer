- slug: sup-travel-transport
  category: planning
  title: Voyager avec son paddle — guide de l'avion et de la route avec un paddle gonflable
  description: Comment voyager avec un paddle gonflable en avion, en voiture ou en camping-car. Conseils sur les frais aériens, l'emballage, le gonflage sur place et les spécificités des voyages à l'international.
  tldr: Dégonflez, roulez et rangez votre paddle dans son sac à dos. La plupart des compagnies aériennes l'acceptent en bagage enregistré (moins de 50 livres / 50 pouces linéaires). Rangez toujours la pompe et la pagaie dans le même sac. Arrivez en avance pour prévoir du temps supplémentaire si l'agent au compteur questionne la taille du sac. Pour les longs séjours, envisagez un envoi préalable.
  problem: Voyager avec un paddle semble compliqué — limites de taille des compagnies aériennes, contrôles de sécurité et difficulté de gonfler sur une destination reculée créent de l'incertitude.
  solution: Les sacs à dos afarer sont conçus pour respecter les limites de bagages enregistrés des compagnies aériennes. Emballez intelligemment, emportez un kit de réparation et repérez les lieux de gonflage (marinas, campings avec électricité) avant le départ.
  audience: Les pagayeurs qui planifient un voyage en paddle en avion, en voiture ou en camping-car.
  steps:
    - Dégonflez entièrement et roulez la planche de l'avant vers l'arrière
    - Rangez la planche roulée, la pompe, la pagaie, le leash et l'aileron dans le sac à dos
    - Vérifiez les limites de taille et de poids de la compagnie — la plupart autorisent 62 pouces linéaires et 50 livres
    - Arrivez en avance et préparez-vous à un contrôle manuel du sac
    - Emportez un kit de réparation dans votre bagage cabine au cas où la planche serait endommagée pendant le transport
    - "Renseignez-vous sur les options de gonflage : prises électriques de camping pour les pompes électriques, stations d'air de marina"
  faq:
    - q: La compagnie aérienne acceptera-t-elle mon sac à dos de paddle comme bagage ?
      a: La plupart des compagnies américaines et européennes acceptent les sacs à dos de paddle comme bagage enregistré standard s'ils pèsent moins de 50 livres et mesurent moins de 62 pouces linéaires. Les compagnies low-cost peuvent facturer des frais de bagage hors format.
    - q: Puis-je emporter mon paddle en bagage cabine ?
      a: Non. Les sacs à dos de paddle dépassent les dimensions cabine de toutes les compagnies. Enregistrez toujours le sac.
    - q: Comment gonfler mon paddle sur une destination reculée ?
      a: La pompe à main fournie fonctionne partout, sans électricité. Pour plus de confort, emportez une pompe électrique portable et cherchez des campings avec prises électriques ou des marinas équipées de stations d'air.

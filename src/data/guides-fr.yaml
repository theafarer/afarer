- slug: weather-conditions
  category: safety
  title: Comprendre les conditions météo pour le paddle
  description: Apprenez à lire le vent, les vagues, les marées et les tendances météo afin de prendre des décisions sûres sur l'eau.
  tldr: "Vérifiez trois choses avant chaque mise à l'eau : la vitesse du vent (moins de 10 mph pour les débutants), la hauteur des vagues (moins de 1 pied pour les débutants) et la température de l'eau (habillez-vous pour l'eau, pas pour l'air). Le vent de terre est dangereux, quel que soit votre niveau."
  problem: La plupart des accidents liés à la météo surviennent parce que les pagayeurs évaluent mal les conditions — ils consultent la température de l'air mais pas celle de l'eau, ou ignorent qu'un vent de terre peut les emporter au large.
  solution: "Appliquez une évaluation météo structurée avant la mise à l'eau : direction et vitesse du vent, période et hauteur des vagues, état de la marée et température de l'eau. Comprenez comment chaque facteur influence votre sécurité."
  audience: Tous les pagayeurs qui naviguent en eau libre — lacs, baies, rivières et océan.
  steps:
    - Vérifiez la vitesse et la direction du vent — le vent de terre (qui souffle de la côte vers le large) est le plus dangereux
    - Évaluez l'état de la mer — la période des vagues compte autant que leur hauteur
    - Renseignez-vous sur la marée — les courants de marée peuvent être plus rapides que votre vitesse de pagayage
    - Mesurez la température de l'eau — en dessous de 60°F/15°C, une protection thermique est nécessaire
    - Vérifiez la visibilité — le brouillard et les fortes pluies réduisent la visibilité et augmentent le risque de collision
    - Repérez les dangers locaux — rochers submergés, courants puissants, zones de navigation des bateaux
  faq:
    - q: À partir de quelle force de vent est-il trop dangereux de faire du paddle ?
      a: 'Débutant : au-delà de 10 mph (8 nœuds). Intermédiaire : au-delà de 15 mph (13 nœuds). Avancé : au-delà de 20 mph (17 nœuds). Dans le doute, ne sortez pas.'
    - q: Qu'est-ce que la période des vagues ?
      a: La période des vagues est le temps qui sépare deux vagues successives. Une période courte (moins de 8 secondes) correspond à des vagues raides et hachées. Une période longue (plus de 12 secondes) correspond à une houle plus lisse et plus prévisible.
    - q: Peut-on pagayer sous la pluie ?
      a: Une pluie légère est généralement sans danger. Une forte pluie réduit la visibilité et peut annoncer un changement de conditions de vent. Les orages imposent une sortie immédiate de l'eau.

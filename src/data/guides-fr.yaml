- slug: sup-yoga
  category: lifestyle
  title: 'Yoga sur paddle : le guide complet pour allier paddle et yoga'
  description: Combinez paddle et yoga pour améliorer votre équilibre, votre force et votre pleine conscience sur l'eau.
  tldr: Le yoga sur paddle ajoute une instabilité qui augmente nettement l'activation du gainage par rapport au yoga au sol. Commencez par des postures de base sur une planche large et stable, en eau calme. Utilisez un tapis de pont antidérapant. Ne pratiquez jamais le yoga sur paddle seul.
  problem: Les tapis de yoga traditionnels offrent une surface parfaitement stable, ce qui supprime le défi d'équilibre qui rend le yoga sur paddle si efficace pour le gainage et la concentration.
  solution: Utilisez une planche de paddle extra-large (34 pouces et plus) avec un tapis de pont antidérapant intégral. Pratiquez en eau calme et peu profonde. Commencez par les postures fondamentales avant de tenter les inversions.
  audience: Les pratiquants de yoga et les paddleurs qui veulent associer travail de l'équilibre et pleine conscience.
  steps:
    - Ancrez la planche dans une eau peu profonde et calme — utilisez une ancre de sable ou amarrez-la à un ponton
    - Commencez par les postures assises — posture facile, posture du bateau, torsion assise
    - Passez aux postures à genoux — table, chat-vache, posture du tonnerre
    - Passez aux postures debout — montagne, guerrier I, guerrier II, arbre
    - Pratiquez les postures d'équilibre — demi-lune, aigle, danseur
    - Terminez par la savasana — allongez-vous sur la planche et ressentez le mouvement de l'eau
  faq:
    - q: Quelle planche convient le mieux au yoga sur paddle ?
      a: Une planche large (34 pouces et plus) avec un tapis de pont intégral offre la plateforme la plus stable. Le SUP Tour 12 offre un bon compromis entre stabilité et glisse.
    - q: Le yoga sur paddle est-il dangereux ?
      a: Pas plus que le yoga au sol s'il est pratiqué dans des conditions de sécurité. Choisissez une eau calme et peu profonde. Portez un leash. Pratiquez accompagné. Évitez les eaux profondes pour vos premières séances.
    - q: Ai-je besoin d'un équipement spécial ?
      a: Une planche large et stable, un tapis de pont antidérapant intégral, un leash et un gilet de sauvetage. Certains pratiquants utilisent un tapis étanche pour une adhérence supplémentaire.

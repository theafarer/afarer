- slug: sup-with-kids
  category: lifestyle
  title: 'Le paddle avec les enfants : le guide complet en famille'
  description: Comment emmener des enfants faire du paddle en toute sécurité — âges recommandés, équipement et activités.
  tldr: Les enfants dès 6 ans peuvent monter sur un paddle avec un adulte. À partir de 10 ans, ils peuvent pagayer sur leur propre planche sous surveillance. Utilisez une planche large et stable, portez toujours un gilet de sauvetage, restez en eau peu profonde et calme, et limitez la durée des sessions (30 à 45 minutes maximum).
  problem: Les parents veulent partager les sports nautiques avec leurs enfants, mais s'inquiètent de la sécurité, de l'adaptation de l'équipement et de la difficulté à garder les enfants motivés.
  solution: Choisissez la bonne taille de planche pour la pratique à deux, assurez-vous que chaque enfant porte un gilet de sauvetage bien ajusté, commencez en eau peu profonde et tiède, et rendez l'expérience ludique avec des jeux et des sessions courtes.
  audience: Les parents qui souhaitent initier leurs enfants au paddle.
  steps:
    - "4 à 6 ans : en passager sur la planche d'un adulte — assis à l'avant, en tenant la poignée centrale"
    - "6 à 10 ans : à genoux ou assis sur leur propre planche, sous surveillance d'un adulte et avec un leash"
    - '10 ans et plus : pagayent sur leur propre planche avec un adulte à proximité'
    - Portez toujours un gilet de sauvetage — les enfants doivent porter en permanence un gilet bien ajusté
    - Restez dans une eau peu profonde (à hauteur de taille pour l'adulte)
    - Limitez la durée des sessions — 30 à 45 minutes maximum pour les moins de 10 ans
    - Rendez l'activité ludique — jouez, cherchez les poissons, entraînez-vous à vous mettre debout
  faq:
    - q: À partir de quel âge un enfant peut-il faire du paddle seul ?
      a: Vers 10 à 12 ans sous surveillance, selon les capacités de nage de l'enfant et son aisance dans l'eau. Toujours dans des conditions calmes et peu profondes.
    - q: Quelle est la meilleure planche pour faire du paddle avec des enfants ?
      a: Une planche large (34 pouces et plus) avec une charge maximale élevée pour la pratique à deux. Avec ses 33 pouces de large et sa charge maximale de 220 lb, la SUP Explorer 11 convient parfaitement à un parent accompagné d'un enfant.
    - q: Quel équipement de sécurité pour les enfants ?
      a: Un gilet de sauvetage certifié CE bien ajusté, un leash (attaché à la planche de l'adulte pour la pratique à deux), de la crème solaire et un chapeau.

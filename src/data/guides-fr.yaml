- slug: sup-maintenance
  category: maintenance
  title: Comment nettoyer et ranger votre paddle gonflable
  description: Guide d'entretien étape par étape pour maximiser la durée de vie de votre planche de paddle gonflable.
  tldr: Rincez à l'eau douce après chaque utilisation, séchez complètement avant le rangement, dégonflez et roulez sans serrer (pas de roulage trop serré), stockez dans un endroit frais et sec à l'abri de la lumière directe du soleil, et inspectez les coutures chaque mois.
  problem: 'Un rangement et un nettoyage inadaptés sont les principales causes de défaillance prématurée des paddles gonflables : moisissures, dommages UV et délamination des coutures.'
  solution: 'Suivez une routine cohérente après chaque session : rincer, sécher, inspecter, dégonfler et ranger. Utilisez un savon doux pour les salissures tenaces. Ne stockez jamais la planche humide ou en plein soleil.'
  audience: Tous les propriétaires de paddle gonflable qui veulent que leur planche dure 5 ans et plus.
  steps:
    - Rincez la planche à l'eau douce immédiatement après l'utilisation, surtout après une sortie en eau salée
    - Nettoyez avec un savon doux et une éponge souple — évitez les produits chimiques agressifs ou les nettoyeurs haute pression
    - Séchez la planche complètement — ouvrez la valve pour laisser l'eau emprisonnée s'échapper
    - Recherchez les dommages — vérifiez les coutures, la valve et la surface pour détecter les perforations
    - Dégonflez complètement — retirez le noyau de valve pour un dégonflage total
    - Roulez la planche sans serrer — commencez par le nez, évitez les plis marqués
    - Rangez la planche dans son sac de transport, dans un endroit frais et sec à l'abri de la lumière directe du soleil
  faq:
    - q: Puis-je laisser mon paddle gonflé toute la saison ?
      a: Oui, mais gardez-la à l'abri du soleil lorsqu'elle ne sert pas. Un dégonflage partiel (8 à 10 PSI) est recommandé pour un stockage prolongé.
    - q: Comment réparer une perforation ?
      a: Nettoyez la zone, découpez une rustine aux coins arrondis, appliquez la colle, pressez fermement et attendez 24 heures avant de gonfler. Les planches afarer sont livrées avec un kit de réparation.
    - q: À quelle fréquence dois-je vérifier la valve ?
      a: Chaque mois. La valve est le point de défaillance le plus courant. Vérifiez que l'aiguille de la valve coulisse librement et que le joint torique est intact.

- slug: sup-for-whitewater
  category: buying-guide
  title: SUP en eaux vives — Guide d'achat des planches gonflables pour la descente de rivière
  description: "Comment choisir un SUP d'eaux vives pour la descente de rivière : planches plus courtes, construction renforcée, équipement de sécurité et techniques de pagayage pour les rapides de classe I à III."
  tldr: Les SUP d'eaux vives exigent une longueur réduite (8-10 pieds), des rails renforcés, une pression plus élevée (15+ PSI) et plusieurs chambres à air pour la sécurité. Utilisez un leash droit de rivière (pas de leash spirale), portez un casque et un gilet de sauvetage, et pagayez toujours accompagné. Commencez en classe I avant de tenter des rapides plus difficiles.
  problem: Emmener un SUP polyvalent standard sur eau vive est dangereux — les planches standards manquent de maniabilité, de résistance aux impacts et des fonctions de sécurité indispensables en rivière.
  solution: "Choisissez un SUP d'eaux vives conçu pour cet usage : longueur courte pour l'agilité, construction renforcée contre les impacts de rochers et conception multichambres pour la sécurité."
  audience: Les pagayeurs expérimentés qui se lancent dans la descente de rivière.
  steps:
    - Choisissez une planche de 8 à 10 pieds pour une maniabilité maximale dans les rapides
    - Recherchez une construction à rails renforcés et un PVC de qualité militaire
    - Choisissez une planche avec 2 chambres à air ou plus pour la redondance en cas de crevaison
    - Utilisez un leash droit de rivière attaché à une ceinture à dégagement rapide
    - Portez un casque, un gilet de sauvetage et des chaussures de rivière adaptées
    - Commencez par des rapides de classe I et progressez graduellement avec un partenaire expérimenté
  faq:
    - q: Puis-je utiliser un SUP classique en eaux vives ?
      a: Ce n'est pas recommandé. Les SUP standards manquent de résistance aux impacts et peuvent se délaminer sur les rochers. La sécurité multichambres est essentielle en rivière.
    - q: Quelle pression (PSI) pour un SUP d'eaux vives ?
      a: 15 PSI ou plus pour une rigidité maximale. Une planche bien dure rebondit sur les rochers, contrairement à une planche sous-gonflée qui épouse les obstacles.
    - q: Faut-il des techniques de pagayage spéciales pour le SUP en eaux vives ?
      a: Oui. La lecture de rivière, les virages dans les contre-courants, les traversées en ferry et les appuis sont des compétences essentielles. Suivez un stage de SUP en eaux vives avant de tenter la classe II et au-delà.

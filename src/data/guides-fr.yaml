- slug: sup-storage-winter-care
  category: maintenance
  title: Rangement et hivernage de votre paddle — prolongez la durée de vie de votre planche
  description: Comment ranger, nettoyer et hiverner correctement votre paddle gonflable. Évitez la moisissure, les dégâts UV et la dégradation des matériaux grâce à un entretien adapté.
  tldr: Rincez à l'eau douce après chaque utilisation. Séchez complètement avant de ranger. Dégonflez et entreposez la planche dans un endroit frais et sombre, à l'abri du soleil direct et des températures extrêmes. Ne rangez jamais votre planche gonflée ou dans une voiture chaude. Appliquez régulièrement un protecteur UV.
  problem: "Un mauvais rangement est la première cause de détérioration prématurée des paddles : moisissures, dégradation des matériaux, délaminage et endommagement de la valve sous l'effet de la chaleur ou du froid."
  solution: "Suivez une routine d'entretien en 3 étapes : rincez après chaque session, séchez soigneusement avant le rangement et entreposez la planche dégonflée dans un environnement tempéré entre 50 et 80 °F (10-27 °C)."
  audience: Tous les propriétaires de paddle qui veulent que leur planche dure 5 ans ou plus.
  steps:
    - Rincez la planche, la pagaie et la pompe à l'eau douce après chaque session en eau salée ou boueuse
    - Nettoyez avec un savon doux et une éponge souple — jamais de produits chimiques agressifs ni de nettoyeur haute pression
    - Séchez la planche entièrement à l'extérieur avant de la dégonfler (ouvrez la valve pour laisser s'échapper l'humidité intérieure)
    - Dégonflez complètement, puis roulez la planche de l'avant vers l'arrière pour expulser l'air restant
    - Essuyez le sac à dos avant d'y ranger la planche
    - Entreposez dans un placard frais et sombre ou sous le lit — jamais en plein soleil, dans une voiture chaude ou dans un abri exposé au gel
  faq:
    - q: Puis-je laisser mon paddle gonflé toute la saison ?
      a: Il est préférable de le dégonfler en cas de non-utilisation prolongée. Une pression PSI constante accélère la fatigue des matériaux. Dégonflez entre les sessions si la planche reste stockée plus de 2 semaines.
    - q: Comment éliminer la moisissure de mon paddle ?
      a: Mélangez un savon doux à de l'eau tiède avec un filet de vinaigre blanc. Frottez délicatement avec une brosse souple. Rincez abondamment et faites sécher à l'ombre. Évitez l'eau de Javel, qui endommage le PVC.
    - q: Puis-je ranger mon paddle dans un garage ?
      a: Uniquement si le garage reste entre 50 et 80 °F (10-27 °C) toute l'année. Les greniers et garages non chauffés subissent des températures extrêmes qui endommagent les structures drop-stitch.

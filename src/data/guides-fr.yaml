- slug: inflatable-repair
  category: maintenance
  title: Comment réparer votre paddle gonflable
  description: Guide étape par étape pour réparer les perforations, les problèmes de valve et les dommages aux coutures des paddles gonflables.
  tldr: Les petites perforations (moins de 1/4 de pouce) se réparent avec le kit de rustines fourni. Nettoyez la zone, appliquez de la colle PVC, pressez la rustine et attendez 24 heures. Les fuites de valve nécessitent généralement le remplacement du joint torique. Les grandes déchirures ou la délamination des coutures exigent une intervention professionnelle.
  problem: Les petites perforations et les problèmes de valve sont courants mais faciles à réparer. Sans une technique de réparation adaptée, on paie trop cher un service professionnel ou l'on aggrave les dégâts.
  solution: Identifiez le type de dommage — perforation, fuite de valve ou problème de couture — et appliquez la méthode de réparation appropriée. La plupart des réparations prennent 30 minutes, plus le temps de séchage.
  audience: Les propriétaires de paddles gonflables qui veulent effectuer eux-mêmes les réparations de base.
  steps:
    - Localisez la fuite — gonflez complètement la planche, écoutez l'air s'échapper, cherchez au toucher ou utilisez de l'eau savonneuse
    - Marquez la fuite avec un stylo ou du ruban adhésif
    - Nettoyez la zone autour de la fuite à l'alcool isopropylique — au moins 2 pouces autour du dommage
    - Matifiez la surface avec un papier de verre fin pour une meilleure adhérence de la colle
    - Appliquez la colle PVC sur la rustine et sur la surface de la planche
    - Attendez 5 minutes que la colle devienne collante
    - Pressez fermement la rustine, puis chassez les bulles d'air avec un rouleau ou une carte de crédit
    - Laissez sécher 24 heures avant de gonfler à pleine pression
  faq:
    - q: Peut-on réparer une perforation sur l'eau ?
      a: Une réparation d'urgence avec une rustine et du ruban adhésif permet de regagner le rivage. Une réparation complète exige des conditions sèches et 24 heures de séchage.
    - q: Comment réparer une valve qui fuit ?
      a: Retirez le noyau de valve avec l'outil fourni, vérifiez l'état du joint torique, remplacez-le si nécessaire et revissez fermement le noyau.
    - q: Quelle colle utiliser pour les réparations PVC ?
      a: Utilisez une colle spécifique pour PVC, comme la HH-66 ou la Clifton. La superglue classique n'adhère pas bien aux matériaux PVC gonflables.

- slug: multi-day-trip
  category: planning
  title: Organiser une randonnée paddle de plusieurs jours
  description: "Comment planifier et réussir une randonnée paddle de plusieurs jours : choix de l'itinéraire, préparation du matériel, bivouac et sécurité."
  tldr: Prévoyez 10 à 15 miles par jour. Emballez votre matériel dans des sacs étanches, répartissez le poids de façon équilibrée et entraînez-vous à charger votre planche avant le départ. Laissez un plan de navigation à un proche. Emportez eau, nourriture, abri, moyens de navigation et de communication.
  problem: Les randonnées de plusieurs jours échouent à cause d'un excès de bagages, d'un itinéraire mal préparé ou d'une sous-estimation de la météo et des courants — avec à la clé épuisement, panne de matériel ou incident de sécurité.
  solution: "Adoptez une méthode de préparation systématique : choix de l'itinéraire, check-list du matériel, planification des repas, briefing sécurité et plans de secours."
  audience: Paddlers confirmés qui préparent leur première expédition de plusieurs jours.
  steps:
    - Choisissez un itinéraire avec des emplacements de bivouac établis et des points de repli
    - Prévoyez 10 à 15 miles par jour en tenant compte du vent et des courants
    - Consultez les horaires de marée et les prévisions météo pour toute la durée du séjour
    - Emballez le matériel dans des sacs étanches — 20 à 30 lb de matériel au total
    - Répartissez le poids de manière équilibrée — les objets les plus lourds au centre
    - Laissez un plan de navigation détaillé à une personne restée à terre
    - Emportez de quoi vous orienter — carte papier, boussole et GPS de secours
    - Prévoyez un abri d'urgence, des rations supplémentaires et une trousse de premiers secours
  faq:
    - q: Quelle est la distance idéale par jour ?
      a: 10 à 15 miles par jour pour des paddlers confirmés. Les débutants devraient prévoir 5 à 8 miles. Prévoyez toujours une marge de sécurité pour la météo.
    - q: Combien d'eau dois-je emporter ?
      a: 1 gallon par personne et par jour. Par forte chaleur, comptez 1,5 gallon. Emportez un filtre à eau ou des pastilles de purification pour vous ravitailler.
    - q: Quel est l'élément de sécurité le plus important ?
      a: La communication. Une radio VHF ou un messager satellite peut vous sauver la vie en cas d'urgence. Les téléphones portables sont peu fiables dans les zones reculées.

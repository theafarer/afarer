- slug: beginner-guide
  category: tutorial
  title: Guide du débutant en stand-up paddle
  description: Tout ce qu'il faut savoir avant votre première session de paddle — de la préparation du matériel aux techniques de pagayage de base.
  tldr: Commencez sur une eau calme et plate avec une planche large et stable. Gonflez à 12-15 PSI, attachez le leash et réglez la longueur correcte de la pagaie (6-8" de plus que votre taille). Écartez les pieds à la largeur des épaules, gardez les genoux légèrement fléchis et regardez l'horizon.
  problem: Les nouveaux pagayeurs sautent souvent les fondamentaux — pagaie mal réglée, mauvaise posture ou choix d'une eau agitée — ce qui provoque chutes, frustration et découragement.
  solution: 'Suivez un plan de première session structuré : choisissez une eau calme, préparez correctement votre matériel, entraînez-vous à genou avant de vous mettre debout et maîtrisez le coup de pagaie avant de tenter les virages.'
  audience: Les grands débutants qui n'ont jamais fait de paddle.
  steps:
    - Choisissez une eau plate et calme, sans circulation de bateaux — un petit lac ou une baie abritée est idéal
    - Gonflez votre planche à 12-15 PSI avec la pompe double action
    - Attachez le leash spiralé à votre cheville ou à votre mollet, jamais à la poignée de la planche
    - Insérez l'aileron et serrez la vis
    - Réglez la longueur de la pagaie — elle doit dépasser votre taille de 6-8 pouces
    - Commencez à genou sur la planche et pagayez quelques coups pour trouver l'équilibre
    - Levez-vous un pied après l'autre, pieds écartés à la largeur des épaules, genoux souples
    - Regardez l'horizon, pas vos pieds — votre planche va là où vous regardez
  faq:
    - q: Quelle tenue pour faire du paddle ?
      a: Des vêtements de sport à séchage rapide, un gilet de sauvetage, de la crème solaire et un chapeau. En eau froide, portez une combinaison. Portez toujours un leash et emportez un téléphone dans une pochette étanche.
    - q: Comment remonter sur la planche après une chute ?
      a: Restez calme. Rejoignez la planche à la nage, saisissez la poignée centrale et battez des jambes tout en vous hissant sur la planche en un seul mouvement. Reprenez d'abord la position à genou, puis relevez-vous.
    - q: Quelles conditions de vent sont sûres ?
      a: "Débutant : vent inférieur à 10 mph (5 nœuds). Si le vent souffle vers le large, ne sortez pas. Consultez les prévisions et sachez qu'un vent de terre est dangereux."

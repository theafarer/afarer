- slug: sup-buying-mistakes
  category: buying-guide
  title: Erreurs à éviter lors de l'achat d'un SUP — Que vérifier avant d'acheter une planche de paddle
  description: "Évitez les erreurs classiques lors de l'achat d'un SUP : mauvaise taille choisie, charge utile ignorée, planches bas de gamme et accessoires essentiels négligés."
  tldr: "Top 5 des erreurs : acheter trop étroit, ignorer la charge utile, privilégier le prix à la qualité, oublier le coût des accessoires et ne pas adapter le type de planche à l'usage prévu. Un paddle gonflable de qualité d'un fabricant réputé coûte 500 à 900 $ et dure 5 ans et plus."
  problem: Les acheteurs débutants gaspillent leur argent sur des planches trop petites, de mauvaise qualité ou inadaptées à leurs besoins. Les planches bas de gamme lâchent au bout d'1 à 2 saisons.
  solution: Renseignez-vous à fond avant d'acheter. Adaptez les dimensions de la planche à votre morphologie. Investissez dans une construction drop-stitch de qualité. Prévoyez un budget pour les accessoires essentiels. Achetez chez un fabricant certifié CE offrant une garantie.
  audience: Les acheteurs de leur premier SUP et tous ceux qui se sont trompés sur leur première planche.
  steps:
    - 'Erreur 1 : acheter une planche trop étroite — prenez toujours plus large que ce que vous pensez avoir besoin'
    - "Erreur 2 : ignorer la charge utile — calculez votre charge totale avant d'acheter"
    - "Erreur 3 : choisir l'option la moins chère — le PVC bas de gamme cède rapidement"
    - 'Erreur 4 : oublier les accessoires — pompe, gilet de sauvetage, pagaie et leash ajoutent 150 à 300 $'
    - "Erreur 5 : ne pas adapter le type de planche à l'usage — une polyvalente fait tout, mais les planches spécialisées offrent de meilleures performances"
  faq:
    - q: Combien dépenser pour un premier SUP ?
      a: Un paddle gonflable de qualité d'un fabricant réputé coûte 500 à 900 $. Les planches à moins de 300 $ sont généralement bas de gamme, avec un drop-stitch médiocre et un PVC fin qui cède rapidement.
    - q: Un SUP bon marché vaut-il le coup ?
      a: Non. Les SUP low cost utilisent un PVC fin, un drop-stitch fragile et des valves de mauvaise qualité. Ils se délaminent, fuient et perdent leur rigidité. Une planche de qualité dure 5 ans et plus ; une planche bon marché peut lâcher en une seule saison.
    - q: Faut-il acheter un pack ou des articles séparés ?
      a: Les packs sont plus économiques que l'achat à l'unité. Vérifiez que le pack comprend une pompe de qualité avec manomètre, une pagaie réglable et un leash spirale — pas seulement les accessoires les moins chers.

- slug: how-to-choose-your-sup
  category: buying-guide
  title: Comment choisir sa planche de paddle
  description: Un guide complet pour choisir la planche de stand-up paddle adaptée à votre niveau, aux conditions de navigation et à l'usage que vous comptez en faire.
  tldr: Choisissez votre paddle en fonction de votre niveau, du type d'eau et de l'usage principal. Les planches polyvalentes conviennent aux débutants et à l'eau calme. Les planches de randonnée sont conçues pour les longues distances. Les planches de yoga offrent une largeur supplémentaire pour plus de stabilité. Les planches performantes s'adressent aux pagayeurs expérimentés dans des conditions variées.
  problem: "La plupart des acheteurs choisissent leur planche de paddle en fonction du prix ou de l'esthétique plutôt que selon leur pratique réelle. Résultat : stabilité médiocre, performances décevantes et expérience frustrante."
  solution: Accordez la forme, le volume et la construction de votre planche à votre niveau et à votre environnement de navigation principal. Les planches larges (32-34") apportent la stabilité dont les débutants ont besoin. Les planches longues (12-14") tiennent mieux le cap pour la randonnée. La construction drop-stitch gonflée à 12-15 PSI offre une rigidité comparable à celle des planches rigides.
  audience: Acheteurs d'une première planche de paddle, pagayeurs récréatifs et toute personne souhaitant passer à une planche plus performante.
  steps:
    - Identifiez votre environnement de navigation principal — lac, océan, rivière ou mixte
    - 'Adaptez la largeur de la planche à votre niveau : 32-34" pour les débutants, 30-32" pour les intermédiaires, 28-30" pour les pratiquants avancés'
    - "Choisissez la longueur selon l'usage : plus courte pour la maniabilité, plus longue pour la tenue de cap et la vitesse"
    - 'Sélectionnez la construction : gonflable drop-stitch pour le transport, rigide pour un maximum de performance'
    - Vérifiez la capacité de charge — votre poids plus celui du matériel ne doit pas dépasser 80 % de la limite de la planche
    - 'Contrôlez les accessoires fournis : pompe, leash, aileron, sac à dos et kit de réparation'
  faq:
    - q: Quelle largeur de paddle pour un débutant ?
      a: Une largeur de 32 à 34 pouces offre la plateforme la plus stable pour apprendre. Avec ses 33" de large, la SUP Explorer 11 est idéale pour une première pratique sur eau calme.
    - q: Planche de paddle gonflable ou rigide ?
      a: Les planches gonflables offrent portabilité, facilité de rangement et absorption des chocs. Les planches rigides offrent une rigidité et une vitesse maximales. Pour la plupart des pratiquants récréatifs, un paddle gonflable de qualité à âme drop-stitch est le choix le plus pragmatique.
    - q: À quelle pression PSI dois-je gonfler ?
      a: Les planches afarer recommandent 12-15 PSI. À 15 PSI, la planche atteint une rigidité maximale comparable à celle d'une planche rigide. Restez toujours dans la plage de pression indiquée sur la planche.

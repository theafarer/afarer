- slug: paddling-techniques
  category: tutorial
  title: Les techniques de pagaie essentielles en paddle
  description: Maîtrisez le coup avant, le coup de balayage et le virage cross-bow pour pagayer efficacement dans toutes les conditions.
  tldr: Le coup avant s'appuie sur votre gainage, pas sur vos bras. Le coup de balayage fait tourner la planche. Le virage cross-bow est le pivot le plus efficace. Gardez la pagaie verticale et immergez entièrement la pale pour un transfert de puissance maximal.
  problem: La plupart des paddleurs utilisent des coups dominés par les bras qui gaspillent de l'énergie et fatiguent les épaules. Une mauvaise technique rend aussi la planche difficile à contrôler dans le vent et le clapot.
  solution: Apprenez trois coups essentiels — avant, balayage et virage cross-bow — avec une biomécanique correcte. Pratiquez chacun sur eau calme avant de passer à des conditions plus difficiles.
  audience: Les paddleurs qui veulent pagayer plus longtemps, plus vite et avec moins de fatigue.
  steps:
    - "Coup avant : allongez-vous vers l'avant, plantez entièrement la pale, tirez en arrière en utilisant la rotation du buste (pas les bras), sortez de l'eau au niveau de la cheville"
    - "Coup de balayage : tendez la pagaie vers l'avant au niveau du rail, balayez la pale en un grand arc vers l'arrière, la planche tourne du côté opposé à la pagaie"
    - "Virage cross-bow : placez la pagaie de l'autre côté de la planche sans changer les mains de place, puis tirez vers l'arrière"
    - "Appui : utilisez un appui bas pour la stabilité dans le clapot — posez la pale à plat sur la surface de l'eau"
    - 'Coup de déplacement latéral : tendez la pagaie sur le côté et tirez la planche latéralement vers la pagaie'
  faq:
    - q: Comment pagayer en ligne droite ?
      a: Utilisez une longueur de coup identique des deux côtés. Changez de côté tous les 5 à 10 coups. Fixez un point immobile à l'horizon comme repère.
    - q: Dois-je plier les genoux ?
      a: Oui. Gardez une légère flexion des genoux, qui jouent le rôle d'amortisseurs. Des genoux verrouillés transmettent chaque ondulation à votre buste et réduisent la stabilité.
    - q: Comment pagayer contre le vent ?
      a: Abaissez votre position, utilisez des coups plus courts et plus rapides, et restez près du rivage, où le vent est souvent plus faible. Si le vent est trop fort, ne sortez pas.

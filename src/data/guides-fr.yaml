- slug: sup-inflation-psi-guide
  category: technical
  title: Guide de gonflage de votre paddle — le PSI optimal pour la performance et la sécurité
  description: 'Guide complet de la pression de gonflage des paddles : plages de PSI recommandées, influence de la pression sur la performance et conseils pour bien utiliser votre pompe.'
  tldr: Gonflez à 12-15 PSI pour la plupart des paddles gonflables. Plus de pression = plus de rigidité, mais un gonflage plus lent. Moins de pression = des sensations plus souples, mais plus de flexion. Ne dépassez jamais le PSI maximum imprimé sur votre planche. Utilisez une pompe avec un manomètre précis. L'air froid réduit la pression, le soleil chaud l'augmente.
  problem: Une planche sous-gonflée paraît molle et fléchit excessivement. Une planche surgonflée risque une défaillance des coutures. Beaucoup de pagayeurs estiment le PSI au lieu de le mesurer précisément.
  solution: Utilisez une pompe avec manomètre intégré. Visez 15 PSI pour une rigidité maximale. Vérifiez la pression avant chaque session — les variations de température affectent considérablement le PSI.
  audience: Tous les propriétaires de paddles gonflables.
  steps:
    - Vérifiez la plage de PSI recommandée imprimée sur votre planche, près de la valve
    - Utilisez la pompe double action pour gonfler jusqu'au milieu de la plage recommandée
    - Passez en mode simple action pour les 3-4 derniers PSI afin de gagner en précision
    - Contrôlez la pression avec le manomètre — les manomètres analogiques sont plus fiables que les numériques
    - "Ajustez selon les conditions : PSI plus élevé pour la randonnée et la course, PSI plus bas pour les eaux vives et les mises à l'eau rocheuses"
    - Revérifiez la pression après 10 minutes d'attente — l'équilibre thermique modifie le PSI
  faq:
    - q: Puis-je surgonfler mon paddle ?
      a: Oui. Dépasser le PSI maximum autorisé (généralement 15-18 PSI) peut délaminer les coutures et endommager la structure drop-stitch. Restez toujours dans la plage imprimée.
    - q: La température affecte-t-elle le PSI ?
      a: Considérablement. Une planche gonflée à 15 PSI à 70 °F peut atteindre 18 PSI en plein soleil à 95 °F. L'eau froide peut faire chuter la pression à 12 PSI. Vérifiez la pression après tout changement de conditions.
    - q: Quel PSI pour les débutants ?
      a: 12-13 PSI pour l'apprentissage offrent une plateforme légèrement plus souple, plus tolérante en cas de chute. Augmentez à 15 PSI à mesure que votre niveau progresse.

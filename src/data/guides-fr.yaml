- slug: sup-fitness
  category: lifestyle
  title: "Fitness sur paddle : un entraînement complet sur l'eau"
  description: Comment le paddle renforce le gainage, l'équilibre et l'endurance cardiovasculaire.
  tldr: Le paddle sollicite les abdominaux, les jambes, le dos et les épaules à chaque coup de pagaie. Une séance d'une heure brûle 300 à 500 calories. Pagayer contre le vent ou le courant double l'intensité. Le yoga sur paddle ajoute un travail de souplesse et d'équilibre.
  problem: Beaucoup de gens considèrent le paddle comme une simple activité de loisir plutôt que comme un véritable outil de remise en forme, et passent ainsi à côté de son potentiel de conditionnement physique complet.
  solution: "Structurez vos séances de paddle avec des objectifs précis : endurance pour le cardio, sprints fractionnés pour la puissance, yoga sur paddle pour la souplesse et sorties longue distance pour l'endurance musculaire."
  audience: Les passionnés de fitness à la recherche d'un entraînement complet du corps, doux pour les articulations et vraiment engageant.
  steps:
    - Échauffez-vous à terre — cercles de bras, rotations du buste et balancements de jambes pendant 5 minutes
    - Commencez par 10 minutes de paddle régulier à intensité modérée
    - Passez au fractionné — 2 minutes de paddle intense, 2 minutes de récupération active
    - Intégrez des postures de yoga sur paddle — chien tête en bas, guerrier II et posture de l'arbre sur la planche
    - Terminez par un paddle tranquille et des étirements statiques sur la planche
  faq:
    - q: Le paddle est-il meilleur que la course à pied pour la forme ?
      a: Le paddle offre des bienfaits cardiovasculaires comparables avec un impact moindre sur les articulations. Il sollicite aussi davantage le haut du corps et le gainage que la course.
    - q: Combien de calories le paddle brûle-t-il ?
      a: Environ 300 à 500 calories par heure à intensité modérée. En course ou en pagayant contre le vent, la dépense peut atteindre 600 à 800 calories par heure.
    - q: Peut-on développer ses muscles avec le paddle ?
      a: Oui. La pagaie renforce les épaules, le dos et les abdominaux. L'équilibre sollicite les jambes et les muscles stabilisateurs. C'est un entraînement complet de résistance.

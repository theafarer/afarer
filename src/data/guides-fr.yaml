- slug: understanding-specs
  category: technical
  title: Comprendre les spécifications d'une planche de paddle
  description: Un guide technique pour décoder les spécifications des planches de paddle — volume, dimensions, construction — et leur incidence sur les performances.
  tldr: "Les caractéristiques clés : le volume (litres) détermine la flottabilité et la charge utile, la largeur détermine la stabilité, la longueur détermine la tenue de cap et la vitesse, l'épaisseur détermine la rigidité, et la pression PSI recommandée détermine le gonflage pour des performances optimales."
  problem: Les fiches techniques affichent des chiffres sans contexte, laissant les acheteurs dans l'incertitude quant aux spécifications qui comptent vraiment pour leur usage.
  solution: "Traduisez chaque spécification en performance concrète : le volume pour la flottaison, la largeur pour la stabilité, la longueur pour le glissement, l'épaisseur pour la rigidité et la construction pour la durabilité."
  audience: Pagayeurs de niveau intermédiaire et acheteurs avertis qui veulent décider sur la base de données concrètes.
  steps:
    - Vérifiez le volume (litres) — votre poids plus celui du matériel ne doit pas dépasser 80 % de la charge indiquée pour la planche
    - Vérifiez la largeur — plus large (32-34") = plus de stabilité, plus étroite (28-30") = plus de vitesse
    - Vérifiez la longueur — plus longue (12-14") = meilleure tenue de cap, plus courte (10-11") = meilleure maniabilité
    - Vérifiez l'épaisseur —6" est le standard, 8" apporte plus de rigidité et de charge utile
    - Vérifiez la pression PSI — gonflez au PSI maximal recommandé pour une rigidité optimale
    - Vérifiez les matériaux de construction — densité du drop-stitch, couches de PVC, renfort des rails
  faq:
    - q: Que signifie drop-stitch ?
      a: Le drop-stitch est une technique de construction qui relie les faces supérieure et inférieure de la planche par des milliers de fils. Elle permet un gonflage à haute pression (12-15 PSI) pour une rigidité extrême.
    - q: Quel est le rapport idéal entre poids et volume ?
      a: 'Une bonne règle : comptez environ 5-6 livres de poids du pagayeur par litre de volume de planche. Un pagayeur de 220 livres devrait viser des planches de 180 litres de volume ou plus.'
    - q: Le poids de la planche a-t-il de l'importance ?
      a: Oui. Les planches légères (moins de 20 livres) sont plus faciles à transporter. Les planches plus lourdes (25 livres et plus) indiquent souvent une construction multi-couches en PVC plus durable.

- slug: paddling-techniques
  category: tutorial
  title: Tecniche essenziali di pagaiata per il SUP
  description: Padroneggia il colpo in avanti, il colpo a spazzata e la virata cross-bow per pagaiare con efficienza in qualsiasi condizione.
  tldr: Il colpo in avanti sfrutta il core, non le braccia. Il colpo a spazzata gira la tavola. La virata cross-bow è il perno più efficiente. Tieni la pagaia verticale e immergi completamente la pala per il massimo trasferimento di potenza.
  problem: La maggior parte dei pagaiatori usa colpi dominati dalle braccia che sprecano energia e causano affaticamento alle spalle. La tecnica scadente rende inoltre la tavola difficile da controllare con vento e mare mosso.
  solution: Impara tre colpi essenziali — in avanti, a spazzata e virata cross-bow — con la giusta meccanica corporea. Pratica ciascuno in acque calme prima di passare a condizioni impegnative.
  audience: Pagaiatori che vogliono pagaiare più a lungo, più velocemente e con meno fatica.
  steps:
    - "Colpo in avanti: raggiungi avanti, impianta bene la pala, tira indietro ruotando il busto (non con le braccia) ed esci all'altezza della caviglia"
    - 'Colpo a spazzata: raggiungi avanti lungo il bordo, spazza la pala in un ampio arco verso la coda e gira la tavola lontano dal lato della pagaia'
    - 'Virata cross-bow: appoggia la pagaia sul lato opposto della tavola senza cambiare le mani e tira verso la coda'
    - "Appoggio: usa un appoggio basso per la stabilità nel mare mosso — batti la pala piatta sulla superficie dell'acqua"
    - 'Colpo di trazione: allunga la pagaia di lato e tira la tavola lateralmente verso la pala'
  faq:
    - q: Come faccio a pagaiare in linea retta?
      a: Usa una lunghezza di colpo costante su entrambi i lati. Cambia lato ogni 5-10 colpi. Guarda un punto fisso all'orizzonte come riferimento.
    - q: Devo piegare le ginocchia?
      a: Sì. Mantieni le ginocchia leggermente flesse come ammortizzatori. Le ginocchia rigide trasmettono ogni increspatura al core e riducono la stabilità.
    - q: Come si pagaia controvento?
      a: Abbassa la posizione, usa colpi più corti e rapidi e resta più vicino alla riva, dove il vento è spesso più debole. Se il vento è troppo forte, non uscire.

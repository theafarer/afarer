- slug: beginner-guide
  category: tutorial
  title: Guida al SUP per principianti
  description: Tutto quello che devi sapere prima della tua prima sessione di SUP — dalla preparazione dell'attrezzatura alle tecniche base di pagaiata.
  tldr: Inizia in acque calme e piatte con una tavola larga e stabile. Gonfia a 12-15 PSI, collega il leash e usa la lunghezza corretta della pagaia (6-8" più alta della tua statura). Posiziona i piedi alla larghezza delle spalle, tieni le ginocchia leggermente flesse e guarda l'orizzonte.
  problem: I neopagaiatori spesso saltano la preparazione fondamentale — pagaia della lunghezza sbagliata, postura scorretta o scelta di acque agitate — il che porta a cadute, frustrazione e sconforto.
  solution: "Segui un piano strutturato per la prima sessione: scegli acque calme, prepara l'attrezzatura correttamente, pratica in ginocchio prima di alzarti in piedi e padroneggia il colpo in avanti prima di provare le virate."
  audience: Principianti assoluti che non hanno mai fatto SUP.
  steps:
    - Scegli acque piatte e calme senza traffico di imbarcazioni — un piccolo lago o una baia riparata sono ideali
    - Gonfia la tavola a 12-15 PSI con la pompa a doppia azione
    - Collega il leash a spirale alla caviglia o al polpaccio, mai alla maniglia della tavola
    - Inserisci la pinna e stringi la vite
    - Regola la lunghezza della pagaia — deve superare la tua statura di 6-8 pollici
    - Inizia in ginocchio sulla tavola e dai qualche colpo di pagaia per percepire l'equilibrio
    - Alzati un piede alla volta, piedi alla larghezza delle spalle, ginocchia morbide
    - Guarda l'orizzonte, non i piedi — la tavola va dove guardi
  faq:
    - q: Cosa devo indossare per fare SUP?
      a: Abbigliamento sportivo a asciugatura rapida, giubbotto salvagente, protezione solare e un cappello. In acque fredde indossa una muta. Porta sempre un leash e un telefono in una custodia impermeabile.
    - q: Come risalgo sulla tavola se cado?
      a: Mantieni la calma. Nuota fino alla tavola, afferra la maniglia centrale e scalcia con le gambe mentre ti tiri sulla tavola in un unico movimento. Torna prima in ginocchio, poi alzati in piedi.
    - q: Con quale vento è sicuro uscire?
      a: 'Principianti: vento sotto i 10 mph (5 nodi). Se il vento soffia allontanandoti dalla riva, non uscire. Controlla le previsioni e ricorda che il vento che spinge verso il largo è pericoloso.'

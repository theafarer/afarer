- slug: sup-size-guide
  category: buying-guide
  title: Guida alle misure del SUP — come scegliere le dimensioni giuste della tavola
  description: Guida completa alle misure del SUP con consigli su lunghezza, larghezza e spessore in base a peso, statura, livello di abilità e stile di pagaiata.
  tldr: I principianti necessitano tavole più larghe (32-34") per la stabilità. I pagaiatori più pesanti necessitano tavole più lunghe (11' o più) con volume maggiore. Il touring richiede scafi più lunghi (12' o più). Lo yoga richiede larghezza extra (34" o più). Controlla sempre la capacità di carico — il tuo peso più l'attrezzatura non deve superare l'80% del limite.
  problem: Scegliere la misura sbagliata del SUP porta a scarsa stabilità, tracciamento lento ed esperienza frustrante. Molti principianti scelgono una tavola che sembra bella senza considerare come le dimensioni influenzano le prestazioni.
  solution: Abbina lunghezza, larghezza e spessore della tavola al tuo peso, livello di abilità e uso principale. Usa il nostro calcolatore di misure — somma il tuo peso + il peso dell'attrezzatura e scegli una tavola con almeno il 20% di margine su quel totale.
  audience: Principianti, pagaiatori che passano a una tavola specializzata e chiunque sia incerto sulle misure.
  steps:
    - Pesati con tutta l'attrezzatura che porti (pagaia, salvagente, sacca stagna)
    - Aggiungi il 20% di margine di sicurezza per trovare la capacità minima
    - 'Scegli la larghezza in base al livello: 32-34" per i principianti, 30-32" per gli intermedi, 28-30" per gli avanzati'
    - 'Seleziona la lunghezza in base all''uso: 10''6"-11''6" polivalente, 12''-14'' touring, 9''-10'' acque bianche'
    - 'Verifica lo spessore: 6" standard, 4" per le prestazioni, 5" polivalente'
    - Controlla l'intervallo di PSI consigliato della tua tavola per la rigidità ottimale
  faq:
    - q: Che larghezza di SUP è meglio per i principianti?
      a: Una larghezza da 32 a 34 pollici offre la piattaforma più stabile. Più la tavola è larga, più è facile mantenere l'equilibrio — soprattutto per i pagaiatori di grande corporatura.
    - q: Come capisco se un SUP è troppo piccolo per me?
      a: Se la tavola pende bassa nell'acqua, risponde pigramente o la prua si immerge facilmente quando pagai, probabilmente è sottodimensionata per il tuo peso.
    - q: La lunghezza della tavola influenza la velocità?
      a: Sì. Una linea d'acqua più lunga aumenta la velocità teorica dello scafo. Una tavola da touring da 14' è nettamente più veloce di una polivalente da 10' a parità di sforzo del pagaiatore.

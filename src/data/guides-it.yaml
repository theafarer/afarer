- slug: inflatable-repair
  category: maintenance
  title: Come riparare il tuo SUP gonfiabile
  description: Guida passo passo per riparare fori, problemi di valvola e danni alle cuciture sui SUP gonfiabili.
  tldr: I piccoli fori (sotto 1/4") si riparano con il kit di toppe incluso. Pulisci la zona, applica l'adesivo per PVC, premi la toppa e attendi 24 ore. Le perdite di valvola richiedono di solito la sostituzione della guarnizione O-ring. Gli strappi grandi o il distacco delle cuciture necessitano di assistenza professionale.
  problem: I fori piccoli e i problemi di valvola sono comuni ma facili da sistemare. Senza la giusta tecnica di riparazione, gli utenti pagano troppo per l'assistenza professionale o peggiorano il danno.
  solution: Identifica il tipo di danno — foro, perdita di valvola o problema di cucitura — e applica il metodo di riparazione appropriato. La maggior parte delle riparazioni richiede 30 minuti più il tempo di indurimento.
  audience: Proprietari di SUP gonfiabili che vogliono gestire da soli le riparazioni base.
  steps:
    - Individua la perdita — gonfia completamente, ascolta l'aria, senti con la mano o usa acqua saponata
    - Segna la perdita con un pennarello o nastro adesivo
    - Pulisci la zona intorno alla perdita con alcol isopropilico — almeno 2 pollici intorno al danno
    - Ruvida la superficie con carta vetrata fine per un migliore aggancio dell'adesivo
    - Applica l'adesivo per PVC sia sulla toppa sia sulla superficie della tavola
    - Attendi 5 minuti che l'adesivo diventi appiccicoso
    - Premi la toppa con decisione ed elimina le bolle d'aria con un rullo o una carta di credito
    - Lascia indurire 24 ore prima di gonfiare a piena pressione
  faq:
    - q: Posso riparare un foro sull'acqua?
      a: Le riparazioni d'emergenza con toppa e nastro possono riportarti a riva. Le riparazioni complete richiedono condizioni asciutte e 24 ore di indurimento.
    - q: Come sistemo una valvola che perde?
      a: Rimuovi il nucleo della valvola con l'attrezzo incluso, controlla la guarnizione O-ring, sostituiscila se necessario e reinserisci il nucleo ben stretto.
    - q: Quale colla usare per le riparazioni in PVC?
      a: Usa un adesivo specifico per PVC come HH-66 o Clifton. La super colla standard non aderisce bene ai materiali PVC gonfiabili.

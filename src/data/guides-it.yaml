- slug: choosing-paddle
  category: buying-guide
  title: Come scegliere la pagaia SUP giusta
  description: Guida ai materiali della pagaia, forme della pala, tipi di asta e misure per il SUP.
  tldr: 'Lunghezza della pagaia: le pagaie SUP devono essere 6-8" più alte della tua statura. Forma della pala: le pale diedriche tengono la rotta, le pale piatte offrono più presa. Materiale dell''asta: il carbonio è il più leggero, la fibra di vetro ha il miglior rapporto qualità-prezzo, l''alluminio è il più economico.'
  problem: Usare la misura o il materiale sbagliato della pagaia causa affaticamento inutile, colpi poco efficienti e tensione articolare.
  solution: Abbina lunghezza della pagaia, forma della pala, materiale e flessibilità dell'asta al tuo stile di pagaiata, alla tua corporatura e al tuo budget.
  audience: Pagaiatori SUP che scelgono la prima pagaia o la prossima.
  steps:
    - Misura l'altezza della pagaia — 6-8" più della tua statura per la pagaiata generale
    - Scegli il materiale della pala — nylon per il risparmio, fibra di vetro per il valore, carbonio per le prestazioni
    - Scegli la forma della pala — diedrica per una rotta fluida, piatta per la potenza, a cucchiaio per le gare
    - Scegli il tipo di asta — dritta per l'uso generale, piegata per il SUP da gara
    - Controlla la flessibilità — le aste più rigide trasmettono più potenza, quelle flessibili riducono lo stress articolare
  faq:
    - q: Qual è il miglior materiale per la pagaia?
      a: La fibra di vetro offre il miglior equilibrio tra peso, durabilità e costo. Il carbonio è più leggero ma più costoso e fragile. Il nylon è pesante ma praticamente indistruttibile.
    - q: Come capisco se la pagaia ha la lunghezza giusta?
      a: Metti la pagaia verticale accanto a te — l'impugnatura dovrebbe arrivarti al polso con il braccio alzato sopra la testa.
    - q: Meglio una pagaia monoblocco o regolabile?
      a: Le pagaie regolabili vanno bene per l'uso condiviso e i viaggi. Quelle monoblocco sono più leggere, rigide ed efficienti per l'uso dedicato.

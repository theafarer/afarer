- slug: sup-for-pet-owners
  category: lifestyle
  title: SUP con i cani — guida completa per pagaiare con il tuo amico a quattro zampe
  description: Tutto quello che devi sapere sul SUP con i cani — addestramento, attrezzatura di sicurezza, scelta della tavola e consigli per una sessione riuscita con il tuo animale.
  tldr: Parti con una tavola larga e stabile (34" o più). Usa un salvagente per animali, tappeto antiscivolo e leash corto. Abitua il cane prima a terra, poi in acque basse. Tieni le sessioni brevi (20-30 minuti). Porta acqua fresca e un telo. Non forzare mai il cane se sembra ansioso.
  problem: Pagaiare con i cani può essere stressante senza la giusta preparazione — i cani possono farsi prendere dal panico, saltare in acqua o graffiare la superficie della tavola.
  solution: Usa una tavola larga e stabile con ponte morbido in EVA. Abitua il cane gradualmente. Porta l'attrezzatura di sicurezza, inclusi un salvagente per animali e un leash corto adatto al SUP.
  audience: Proprietari di cani che vogliono fare SUP con i loro animali.
  steps:
    - Parti con una tavola larga (34" o più, con alta capacità di carico per te e il cane)
    - Prendi un salvagente per cani della taglia giusta, con maniglia
    - Esercitati a terra — fai sedere il cane sulla tavola sgonfia, poi su quella gonfia sul prato
    - Passa in acque basse — mettiti in ginocchio sulla tavola con il cane e dai qualche colpo di pagaia
    - Tieni le sessioni brevi — 20-30 minuti al massimo nelle prime uscite
    - Porta sempre acqua fresca, una ciotola pieghevole e un telo per il cane
  faq:
    - q: Quale tavola SUP è migliore per i cani?
      a: Una tavola larga e stabile con ponte morbido in EVA che offra presa alle zampe. La Tropical Breeze Island Escape, larga 34" o più, è ideale per pagaiare con i cani.
    - q: Il mio cane ha bisogno di un salvagente?
      a: Sì, anche se nuota bene. Un salvagente per cani con maniglia rende facile risollevare il cane sulla tavola se cade in acqua.
    - q: Come evito che il cane graffi la tavola?
      a: Tieni le unghie del cane tagliate. Il tappeto in schiuma EVA protegge la superficie in PVC. Metti un telo o un tappetino sul ponte per una protezione extra.

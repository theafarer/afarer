- slug: understanding-specs
  category: technical
  title: Come leggere le specifiche delle tavole SUP
  description: Una guida tecnica per capire le specifiche delle tavole SUP — volume, dimensioni, costruzione e cosa significano per le prestazioni.
  tldr: 'Specifiche chiave: il volume (litri) determina galleggiabilità e capacità di carico, la larghezza determina la stabilità, la lunghezza determina tracciamento e velocità, lo spessore determina la rigidità e la pressione PSI determina il gonfiaggio per prestazioni ottimali.'
  problem: Le schede tecniche elencano numeri senza contesto, lasciando gli acquirenti incerti su quali specifiche contino davvero per il loro uso.
  solution: Traduci ogni specifica in prestazioni reali — volume per il galleggiamento, larghezza per la stabilità, lunghezza per lo scivolamento, spessore per la rigidità e costruzione per la durabilità.
  audience: Pagaiatori di livello intermedio e acquirenti tecnici che vogliono decidere sulla base dei dati.
  steps:
    - Controlla il volume (litri) — il tuo peso più l'attrezzatura non deve superare l'80% del volume dichiarato della tavola
    - Controlla la larghezza — più larga (32-34") = più stabilità, più stretta (28-30") = più velocità
    - Controlla la lunghezza — più lunga (12-14") = migliore tracciamento, più corta (10-11") = migliore manovrabilità
    - Controlla lo spessore — 6" è lo standard, 8" offre più rigidità e capacità di carico
    - Controlla la pressione nominale — gonfia al PSI massimo dichiarato per la rigidità ottimale
    - Controlla i materiali di costruzione — densità drop-stitch, strati di PVC, rinforzo dei bordi
  faq:
    - q: Cosa significa drop-stitch?
      a: Il drop-stitch è un metodo di costruzione in cui migliaia di fili collegano lo strato superiore e inferiore della tavola. Questo consente il gonfiaggio ad alta pressione (12-15 PSI) per una rigidità estrema.
    - q: Qual è il rapporto ideale tra peso e volume?
      a: Un buon obiettivo è circa 5-6 libbre di peso del pagaiatore per litro di volume della tavola. Un pagaiatore di 220 lb dovrebbe cercare tavole con più di 180 litri di volume.
    - q: Il peso della tavola conta?
      a: Sì. Le tavole più leggere (sotto le 20 lb) sono più facili da trasportare. Quelle più pesanti (25 lb o più) indicano spesso una costruzione più resistente in PVC multistrato.

- slug: sup-storage-winter-care
  category: maintenance
  title: Stoccaggio e cura invernale del SUP — allunga la vita della tua tavola
  description: Come riporre, pulire e svernare correttamente la tua tavola SUP gonfiabile. Evita muffa, danni UV e degrado dei materiali con le giuste cure.
  tldr: Pulisci con acqua dolce dopo ogni uso. Asciuga completamente prima di riporre. Sgonfia e conserva in un luogo fresco e buio lontano dalla luce diretta del sole e dalle temperature estreme. Non riporre mai la tavola gonfia o in un'auto calda. Applica periodicamente un protettivo UV.
  problem: Lo stoccaggio improprio è la causa principale dei guasti prematuri del SUP — muffa, degrado dei materiali, distacchi e danni alla valvola causati da caldo o freddo.
  solution: Segui una routine di cura in 3 passaggi — risciacqua dopo ogni sessione, asciuga bene prima di riporre e conserva la tavola sgonfia in un ambiente a temperatura controllata tra 50-80°F (10-27°C).
  audience: Tutti i proprietari di SUP che vogliono far durare la propria tavola più di 5 anni.
  steps:
    - Risciacqua tavola, pagaia e pompa con acqua dolce dopo ogni sessione in acqua salata o fangosa
    - Pulisci con sapone delicato e spugna morbida — mai sostanze aggressive o idropulitrici
    - Asciuga la tavola completamente all'aperto prima di sgonfiarla (apri la valvola per far uscire l'umidità interna)
    - Sgonfia completamente e arrotola dalla prua verso la coda per espellere l'aria residua
    - Asciuga lo zaino prima di riporvi la tavola
    - Conserva in un armadio fresco e buio o sotto il letto — mai al sole diretto, in un'auto calda o in un capanno gelato
  faq:
    - q: Posso lasciare il SUP gonfio tutta la stagione?
      a: È meglio sgonfiarlo quando non lo usi per lunghi periodi. La pressione costante accelera l'affaticamento dei materiali. Sgonfia tra le sessioni se lo riponi per più di 2 settimane.
    - q: Come rimuovo la muffa dal mio SUP?
      a: Mescola sapone delicato con acqua tiepida e un goccio di aceto bianco. Strofina delicatamente con una spazzola morbida. Risciacqua bene e asciuga all'ombra. Evita la candeggina, che danneggia il PVC.
    - q: Posso riporre il SUP in garage?
      a: Solo se il garage resta tra 50-80°F tutto l'anno. Sottotetti e garage non climatizzati subiscono escursioni termiche che danneggiano i nuclei drop-stitch.

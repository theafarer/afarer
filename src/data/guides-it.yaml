  category: buying-guide
  title: Guida al SUP per acque bianche — come scegliere una tavola gonfiabile per i fiumi
  description: Come scegliere un SUP per le acque bianche — tavole più corte, costruzione rinforzata, attrezzatura di sicurezza e tecniche di pagaiata per rapide di classe I-III.
  tldr: "I SUP per acque bianche necessitano lunghezza ridotta (8-10'), bordi rinforzati, PSI più alto (15+) e camere d'aria multiple per la sicurezza. Usa un leash fluviale dritto (non a spirale), indossa casco e salvagente e pagai sempre in compagnia. Inizia dalle rapide di classe I prima di affrontare quelle più difficili."
  problem: Portare un SUP polivalente standard in acqua corrente è pericoloso — le tavole standard mancano della manovrabilità, della resistenza agli urti e delle funzioni di sicurezza necessarie per i fiumi.
  solution: Scegli un SUP per acque bianche dedicato — corto per l'agilità, con costruzione rinforzata contro gli urti sulle rocce e progetto multi-camera per la sicurezza.
  audience: Pagaiatori esperti che passano alla discesa fluviale.
  steps:
    - Scegli una tavola lunga 8-10' per la massima manovrabilità nelle rapide
    - Cerca bordi rinforzati e PVC di grado militare
    - Seleziona una tavola con 2 o più camere d'aria per ridondanza in caso di foro
    - Usa un leash fluviale dritto collegato a una cintura a sgancio rapido
    - Indossa casco, salvagente e calzature fluviali adeguate
    - Inizia dalle rapide di classe I e progredisci gradualmente con un partner esperto
  faq:
    - q: Posso usare un SUP normale per le acque bianche?
      a: Sconsigliato. I SUP standard mancano di resistenza agli urti e possono delaminarsi sulle rocce. La sicurezza multi-camera è critica negli ambienti fluviali.
    - q: Quale PSI per il SUP da acque bianche?
      a: 15 PSI o più per la massima rigidità. Una tavola più dura rimbalza sulle rocce meglio di una sottogonfiata, che si adatta agli ostacoli.
    - q: Servono abilità particolari per il SUP in acque bianche?
      a: Sì. La lettura del fiume, le virate nei controcorrenti, le traversate in ferry e le tecniche di appoggio sono essenziali. Frequenta un corso di SUP per acque bianche prima di affrontare la classe II o superiore.

  category: buying-guide
  title: SUP per gare e fitness — guida all'acquisto delle tavole performanti
  description: Guida alla scelta di un SUP per gare, fitness e pagaiata atletica. Specifiche della tavola, scelta della pagaia e consigli di allenamento per pagaiatori competitivi e amanti del fitness.
  tldr: 'I SUP da gara sono lunghi da 12''6" a 14'' e stretti (23-28"), con scafi a dislocamento per la massima velocità. I SUP fitness bilanciano velocità e stabilità a 11-12'' e 30-32". Abbina la tavola ai tuoi obiettivi di fitness e al tuo livello di esperienza.'
  problem: I SUP ricreativi standard sono troppo lenti e poco efficienti per una pagaiata di fitness seria o per le gare. I pagaiatori orientati alle prestazioni necessitano tavole dedicate.
  solution: 'Abbina la tavola all''intensità — fitness ricreativo (polivalente da 11-12''), fitness serio (touring da 12''), gare (12''6" o 14'', stretta, a dislocamento).'
  audience: Pagaiatori fitness, aspiranti agonisti e appassionati di SUP atletico.
  steps:
    - Definisci il tuo obiettivo — fitness generale, allenamento per le gare o agonismo
    - 'Per il fitness: tavola da 11-12'' con larghezza 30-32" per bilanciare velocità e stabilità'
    - 'Per le gare: tavola da 12''6" o 14'' con larghezza 23-28" e scafo a dislocamento'
    - Scegli una pagaia in carbonio o fibra di vetro per ridurre peso e fatica
    - Aggiungi un cardiofrequenzimetro e traccia distanza e velocità con un orologio GPS
    - Integra allenamento a intervalli, pagaiate a lunga distanza ed esercizi di tecnica
  faq:
    - q: Qual è la lunghezza migliore del SUP per la pagaiata di fitness?
      a: 12' offre il miglior equilibrio tra velocità e stabilità per i pagaiatori fitness. Le tavole più lunghe sono più veloci ma richiedono più abilità per l'equilibrio.
    - q: Serve una tavola da gara per un buon allenamento?
      a: No. Una tavola da touring o polivalente da 11-12' offre un ottimo allenamento cardiovascolare. Le tavole da gara contano solo quando si gareggia o ci si allena per le gare.
    - q: Quale pagaia è migliore per il SUP fitness?
      a: Una pagaia in fibra di carbonio 8-10" più alta di te. Il peso ridotto diminuisce l'affaticamento delle spalle. Una pala più piccola aumenta la frequenza dei colpi per l'allenamento cardio.

- slug: weather-conditions
  category: safety
  title: Capire le condizioni meteo per il SUP
  description: Impara a leggere vento, onde, maree e andamenti meteo per prendere decisioni sicure sull'acqua.
  tldr: Controlla tre cose prima di ogni uscita — velocità del vento (sotto i 10 mph per i principianti), altezza delle onde (sotto 1 piede per i principianti) e temperatura dell'acqua (vestiti per l'acqua, non per l'aria). Il vento che spinge verso il largo è pericoloso a qualsiasi livello.
  problem: La maggior parte degli incidenti legati al meteo avviene perché i pagaiatori valutano male le condizioni — controllano la temperatura dell'aria ma non quella dell'acqua, o non capiscono che il vento da terra può spingerli al largo.
  solution: Usa una valutazione meteo strutturata prima dell'uscita — direzione e velocità del vento, periodo e altezza delle onde, stato della marea e temperatura dell'acqua. Capisci come ogni fattore influenza la tua sicurezza.
  audience: Tutti i pagaiatori che escono in acque aperte — laghi, baie, fiumi e mare.
  steps:
    - Controlla velocità e direzione del vento — il vento da terra (che soffia verso il mare) è il più pericoloso
    - Valuta le condizioni delle onde — il periodo dell'onda conta quanto la sua altezza
    - Conosci la marea — le correnti di marea possono essere più forti della tua velocità di pagaiata
    - Misura la temperatura dell'acqua — sotto i 60°F/15°C serve protezione termica
    - Controlla la visibilità — nebbia e pioggia intensa riducono la visibilità e aumentano il rischio di collisione
    - Conosci i pericoli locali — rocce sommerse, correnti forti, zone di traffico navale
  faq:
    - q: Quando il vento è troppo forte per il SUP?
      a: 'Principianti: oltre 10 mph (8 nodi). Intermedi: oltre 15 mph (13 nodi). Avanzati: oltre 20 mph (17 nodi). Nel dubbio, non uscire.'
    - q: Cosa significa periodo dell'onda?
      a: Il periodo dell'onda è il tempo tra onde successive. Periodi brevi (sotto gli 8 secondi) significano onde ripide e disordinate. Periodi lunghi (oltre 12 secondi) significano mareggiate più fluide e prevedibili.
    - q: Posso pagaiare sotto la pioggia?
      a: La pioggia leggera è generalmente sicura. La pioggia intensa riduce la visibilità e può indicare condizioni di vento in cambiamento. I temporali richiedono l'immediato allontanamento dall'acqua.

- slug: sup-maintenance
  category: maintenance
  title: Come pulire e riporre il tuo SUP gonfiabile
  description: Guida alla manutenzione passo passo per massimizzare la durata della tua tavola SUP gonfiabile.
  tldr: Risciacqua con acqua dolce dopo ogni uso, asciuga completamente prima di riporre, sgonfia e arrotola senza stringere troppo, conserva in un luogo fresco e asciutto lontano dalla luce diretta del sole e controlla le cuciture ogni mese.
  problem: Stoccaggio e pulizia impropri sono le cause principali dei guasti prematuri nei SUP gonfiabili — muffa, danni UV e distacco delle cuciture.
  solution: Segui una routine costante dopo ogni sessione — risciacqua, asciuga, ispeziona, sgonfia e riponi. Usa un sapone delicato per lo sporco ostinato. Non riporre mai la tavola bagnata o alla luce diretta del sole.
  audience: Tutti i proprietari di SUP gonfiabili che vogliono far durare la propria tavola più di 5 anni.
  steps:
    - Risciacqua la tavola con acqua dolce subito dopo l'uso, soprattutto dopo l'acqua salata
    - Pulisci con sapone delicato e una spugna morbida — evita sostanze aggressive o idropulitrici
    - Asciuga la tavola completamente — apri la valvola per far uscire l'acqua intrappolata
    - Ispeziona i danni — controlla cuciture, valvola e superficie in cerca di fori
    - Sgonfia completamente — rimuovi il nucleo della valvola per uno sgonfiaggio totale
    - Arrotola la tavola senza stringere — parti dalla prua, evita pieghe nette
    - Riponi nella borsa di trasporto in un luogo fresco e asciutto lontano dalla luce diretta del sole
  faq:
    - q: Posso lasciare il SUP gonfio tutta la stagione?
      a: Sì, ma tienilo lontano dalla luce diretta del sole quando non lo usi. Per lo stoccaggio prolungato è consigliato uno sgonfiaggio parziale (8-10 PSI).
    - q: Come riparo un foro?
      a: Pulisci la zona, ritaglia una toppa con angoli arrotondati, applica l'adesivo, premi con decisione e attendi 24 ore prima di gonfiare. Le tavole afarer includono un kit di riparazione.
    - q: Quanto spesso devo controllare la valvola?
      a: Ogni mese. La valvola è il punto di guasto più comune. Verifica che il perno della valvola si muova liberamente e che la guarnizione O-ring sia intatta.

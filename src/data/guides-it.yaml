- slug: sup-fitness
  category: lifestyle
  title: "SUP fitness: allenamento completo sull'acqua"
  description: Come il SUP costruisce forza del core, equilibrio e forma cardiovascolare.
  tldr: Il SUP coinvolge core, gambe, schiena e spalle a ogni colpo. Una sessione di un'ora brucia 300-500 calorie. Pagaiare contro vento o corrente raddoppia l'intensità. Il SUP yoga aggiunge lavoro di flessibilità ed equilibrio.
  problem: Molte persone considerano il SUP un'attività occasionale piuttosto che un vero strumento di fitness, perdendone il potenziale per il condizionamento di tutto il corpo.
  solution: Struttura le sessioni di SUP con obiettivi specifici — pagaiate di resistenza per il cardio, sprint a intervalli per la potenza, SUP yoga per la flessibilità e pagaiate a distanza per la resistenza muscolare.
  audience: Appassionati di fitness in cerca di un allenamento completo a basso impatto e alto coinvolgimento.
  steps:
    - Riscaldati a terra — circonvoluzioni delle braccia, torsioni del busto e slanci delle gambe per 5 minuti
    - Inizia con 10 minuti di pagaiata costante a intensità moderata
    - Passa all'allenamento a intervalli — 2 minuti di pagaiata intensa, 2 minuti di recupero blando
    - Integra posizioni di SUP yoga — cane a testa in giù, guerriero II e posizione dell'albero sulla tavola
    - Concludi con una pagaiata leggera e allungamenti statici sulla tavola
  faq:
    - q: Il SUP è meglio della corsa per la forma fisica?
      a: Il SUP offre benefici cardiovascolari paragonabili con un impatto articolare inferiore. Inoltre coinvolge la parte superiore del corpo e il core più della corsa.
    - q: Quante calorie brucia il SUP?
      a: Circa 300-500 calorie all'ora a intensità moderata. Le gare o la pagaiata controvento possono bruciare 600-800 calorie all'ora.
    - q: Posso costruire muscolo con il SUP?
      a: Sì. La pagaiata sviluppa i muscoli di spalle, schiena e core. Mantenere l'equilibrio coinvolge gambe e muscoli stabilizzatori. È un allenamento di resistenza per tutto il corpo.

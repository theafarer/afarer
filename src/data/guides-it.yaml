- slug: sup-yoga
  category: lifestyle
  title: 'SUP yoga: guida completa a SUP e yoga'
  description: Combina SUP e yoga per migliorare equilibrio, forza e consapevolezza sull'acqua.
  tldr: Il SUP yoga aggiunge un elemento di instabilità che aumenta drasticamente l'attivazione del core rispetto allo yoga a terra. Inizia con posizioni base su una tavola larga e stabile in acque calme. Usa una superficie antiscivolo. Non praticare mai SUP yoga da solo.
  problem: I tappetini yoga tradizionali offrono una superficie perfettamente stabile, eliminando la sfida di equilibrio che rende il SUP yoga unico per la forza del core e la concentrazione.
  solution: Usa una tavola SUP extralarga (34" o più) con tappeto antiscivolo a tutta lunghezza. Pratica in acque calme e basse. Inizia con le posizioni fondamentali prima di tentare le inversioni.
  audience: Praticanti di yoga e pagaiatori che vogliono unire allenamento dell'equilibrio e consapevolezza.
  steps:
    - Ancora la tavola in acqua bassa e calma — usa un'ancora da sabbia o legala a un pontile
    - Inizia da seduti — posizione facile, posizione della barca, torsione da seduti
    - Passa in ginocchio — tavola, gatto-mucca, posizione del fulmine
    - Arriva in piedi — montagna, guerriero I, guerriero II, posizione dell'albero
    - Pratica le posizioni di equilibrio — mezza luna, aquila, ballerino
    - Concludi con savasana — sdraiati sulla tavola e senti il movimento dell'acqua
  faq:
    - q: Quale tavola è migliore per il SUP yoga?
      a: Una tavola larga (34" o più) con tappeto antiscivolo a tutta lunghezza offre la piattaforma più stabile. La SUP Tour 12 offre un buon equilibrio tra stabilità e scivolamento.
    - q: Il SUP yoga è pericoloso?
      a: Non più dello yoga a terra se praticato in sicurezza. Usa acque calme e basse. Indossa un leash. Pratica con un partner. Evita l'acqua profonda nelle prime sessioni.
    - q: Serve attrezzatura particolare?
      a: Una tavola larga e stabile, tappeto antiscivolo completo, leash e salvagente. Alcuni praticanti usano un tappetino impermeabile per una presa extra.

- slug: multi-day-trip
  category: planning
  title: Pianificare un viaggio in SUP di più giorni
  description: Come pianificare e realizzare un viaggio di pagaiata di più giorni — percorso, attrezzatura, campeggio e sicurezza.
  tldr: Pianifica 10-15 miglia al giorno. Imballa l'attrezzatura in sacche stagne, distribuisci il peso in modo uniforme e prova a caricare la tavola prima del viaggio. Comunica un piano di navigazione. Porta acqua, cibo, riparo, navigazione e comunicazione.
  problem: I viaggi di più giorni falliscono per eccesso di bagaglio, pianificazione del percorso scarsa o sottostima di meteo e correnti — con esaurimento, guasti all'attrezzatura o incidenti di sicurezza.
  solution: Usa un approccio di pianificazione sistematico — scelta del percorso, checklist dell'attrezzatura, piano alimentare, briefing di sicurezza e piani di contingenza.
  audience: Pagaiatori esperti che pianificano la prima spedizione di più giorni.
  steps:
    - Scegli un percorso con campeggi stabiliti e punti di ritiro di emergenza
    - Pianifica 10-15 miglia al giorno tenendo conto di vento e corrente
    - Controlla le tavole di marea e le previsioni per l'intera finestra del viaggio
    - Imballa l'attrezzatura in sacche stagne — 20-30 lb di peso totale
    - Distribuisci il peso in modo uniforme — gli oggetti più pesanti al centro
    - Lascia un piano di navigazione dettagliato a qualcuno a riva
    - Porta gli strumenti di navigazione — carta nautica, bussola e GPS di riserva
    - Imballa un riparo di emergenza, cibo extra e un kit di primo soccorso
  faq:
    - q: Qual è la distanza giornaliera ideale?
      a: 10-15 miglia al giorno per pagaiatori esperti. I principianti dovrebbero pianificare 5-8 miglia. Includi sempre un margine di tempo per il meteo.
    - q: Quanta acqua devo portare?
      a: 1 gallone per persona al giorno. In condizioni di caldo, 1,5 galloni. Porta un filtro per l'acqua o compresse potabilizzanti per i rifornimenti.
    - q: Qual è l'oggetto di sicurezza più importante?
      a: La comunicazione. Una radio VHF o un messaggero satellitare possono salvare la vita in un'emergenza. I telefoni cellulari sono inaffidabili nelle zone remote.

- slug: sup-accessories-essential
  category: buying-guide
  title: Accessori SUP essenziali — cosa serve davvero
  description: Guida pratica agli accessori SUP indispensabili, da salvagenti e pagaie a pompe, leash e kit di manutenzione. Cosa comprare per primo e cosa lasciare perdere.
  tldr: 'Essenziali: salvagente, leash, pompa, pagaia, pinna. Molto consigliati: kit di riparazione, custodia impermeabile per il telefono, borsa da ponte. Utili ma opzionali: pompa elettrica, muta stagna, supporto per borsa frigo. Evita i gadget che aggiungono peso senza funzione.'
  problem: I nuovi proprietari di SUP sono sopraffatti dalle scelte di accessori e spesso comprano oggetti inutili tralasciando l'attrezzatura di sicurezza critica.
  solution: Dai priorità agli accessori in quest'ordine — sicurezza (salvagente, leash, fischietto), funzionalità (pompa, pagaia di riserva, kit di riparazione), comodità (borsa da ponte, custodia per il telefono), comfort (seduta, supporto per la borsa frigo).
  audience: Nuovi proprietari di SUP che stanno costruendo il proprio kit di accessori.
  steps:
    - Compra un giubbotto salvagente omologato CE/USCG che calzi bene
    - Prendi un leash da SUP adatto al tuo tipo di acqua (a spirale per le acque piatte, dritto per i fiumi)
    - Assicurati che la pompa raggiunga i 15 PSI e abbia un manometro
    - Aggiungi un kit di riparazione con toppe in PVC e attrezzo per la valvola
    - Valuta una sacca stagna o una custodia impermeabile per gli oggetti di valore
    - Aggiungi un supporto per borsa frigo o un portacanne per le attività specializzate
  faq:
    - q: Serve davvero un giubbotto salvagente per il SUP?
      a: Sì. Anche i nuotatori più forti possono ferirsi o stancarsi. Il salvagente è l'oggetto di sicurezza più importante in assoluto. Molte giurisdizioni lo richiedono per legge.
    - q: Quale pompa è migliore per i SUP gonfiabili?
      a: Le pompe manuali a doppia azione sono lo standard. Quelle elettriche fanno risparmiare fatica ma richiedono una fonte di alimentazione. Usane sempre una con manometro per evitare il sovragonfiaggio.
    - q: Serve una pagaia particolare?
      a: La pagaia in alluminio inclusa va bene per i principianti. Passare a una pagaia in fibra di vetro o carbonio riduce sensibilmente l'affaticamento delle braccia nelle pagaiate lunghe.

- slug: sup-weight-capacity
  category: buying-guide
  title: Guida alla capacità di carico del SUP — quanto peso può reggere un SUP?
  description: Capire i limiti di capacità di carico del SUP, come calcolare il carico totale e perché superare il limite influisce su prestazioni e sicurezza.
  tldr: Non superare mai l'80% della capacità massima di carico della tavola con il tuo peso corporeo più l'attrezzatura. Una tavola con capacità di 220 lb è adatta a un pagaiatore di 160 lb con attrezzatura leggera. Superare il limite provoca beccheggio, manovre pigre e maggiore rischio di danni.
  problem: I pagaiatori superano spesso la capacità di carico della propria tavola, con prestazioni scadenti, tavola semisommersa e potenziali danni. I produttori indicano i limiti massimi ma non spiegano i carichi di lavoro sicuri.
  solution: Calcola il carico totale (peso corporeo + attrezzatura + acqua assorbita dalla tavola) e resta sotto l'80% della capacità massima dichiarata. I pagaiatori più pesanti necessitano tavole ad alto volume con capacità di 300 lb o più.
  audience: Pagaiatori di ogni corporatura, soprattutto quelli più robusti e chi trasporta attrezzatura da spedizione.
  steps:
    - Trova la capacità massima di carico stampata sulla tua tavola (di solito vicino alla valvola)
    - Pesati insieme a tutta l'attrezzatura, incluse pagaia, salvagente, sacche stagne, borsa frigo e accessori
    - 'Calcola: (carico totale) ÷ (capacità massima) × 100 = percentuale di capacità usata'
    - Punta al 70-80% per prestazioni e sicurezza ottimali
    - Se superi l'80%, scegli una tavola più grande o riduci l'attrezzatura
  faq:
    - q: Cosa succede se supero il limite di peso?
      a: La tavola pende più bassa nell'acqua, creando più attrito. La stabilità diminuisce, la prua può sommergersi e il nucleo drop-stitch corre più rischi di danno nel mare mosso.
    - q: Possono salire in due sulla stessa tavola?
      a: Solo se il peso totale resta sotto l'80% della capacità. La maggior parte dei SUP standard è progettata per una sola persona. L'uso in due richiede una tavola omologata specificamente per due.
    - q: I SUP gonfiabili hanno capacità inferiore rispetto alle tavole rigide?
      a: Le gonfiabili di qualità con costruzione drop-stitch hanno capacità di carico paragonabili o superiori a quelle delle tavole rigide grazie alla distribuzione del volume nello spessore.

- slug: safety-tips
  category: safety
  title: Consigli di sicurezza per gli sport acquatici
  description: Le regole di sicurezza essenziali per il SUP — dal controllo dell'attrezzatura alla consapevolezza meteo.
  tldr: Indossa sempre un giubbotto salvagente certificato CE, controlla meteo e condizioni dell'acqua prima di uscire, porta mezzi di comunicazione, non pagaiare mai da solo in acque sconosciute e conosci i limiti nominali della tua attrezzatura.
  problem: La maggior parte degli incidenti negli sport acquatici deriva da una preparazione inadeguata — niente giubbotto salvagente, avvisi meteo ignorati o uso dell'attrezzatura oltre i suoi limiti di progetto.
  solution: "Adotta una checklist di sicurezza prima di ogni uscita: verifica le condizioni dell'attrezzatura, controlla meteo e temperatura dell'acqua, informa qualcuno del tuo percorso e indossa sempre un dispositivo di galleggiamento adeguato."
  audience: Tutti i pagaiatori e i praticanti di sport acquatici.
  steps:
    - Controlla le previsioni meteo — evita venti oltre i 15 mph e i temporali
    - Verifica la temperatura dell'acqua — l'acqua fredda (<60°F/15°C) richiede muta o muta stagna
    - Ispeziona l'attrezzatura — controlla perdite, crepe e gonfiaggio corretto
    - Indossa sempre un giubbotto salvagente certificato CE
    - Collega il leash alla caviglia o al polpaccio
    - Comunica un piano di navigazione — di' a qualcuno dove vai e quando tornerai
    - Porta mezzi di comunicazione — custodia impermeabile per il telefono o radio VHF
    - Conosci i tuoi limiti — resta entro il tuo livello di abilità e i limiti dell'attrezzatura
  faq:
    - q: Serve un giubbotto salvagente su un SUP?
      a: Sì. Molte giurisdizioni richiedono per legge un giubbotto salvagente su qualsiasi imbarcazione, SUP incluso. Anche dove non è obbligatorio, un giubbotto certificato CE è un'attrezzatura di sicurezza essenziale.
    - q: Qual è il rischio più comune negli sport acquatici?
      a: L'immersione in acqua fredda e lo sfinimento sono i rischi seri più comuni. Vestiti sempre in base alla temperatura dell'acqua, non dell'aria.
    - q: Come controllo se le condizioni sono sicure?
      a: Usa le previsioni marine. Controlla velocità del vento, altezza delle onde e temperatura dell'acqua. I principianti dovrebbero restare con vento sotto i 10 mph e onde sotto 1 piede.

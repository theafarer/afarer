- slug: how-to-choose-your-sup
  category: buying-guide
  title: Come scegliere la tua tavola SUP
  description: Una guida completa per scegliere la tavola SUP giusta in base al tuo livello, alle condizioni dell'acqua e all'uso che ne farai.
  tldr: Scegli il SUP in base a livello, tipo di acqua e uso principale. Le tavole polivalenti sono adatte ai principianti e alle acque calme. Le tavole da touring sono pensate per le lunghe distanze. Le tavole da yoga offrono larghezza extra per la stabilità. Le tavole ad alte prestazioni sono per pagaiatori esperti in condizioni variabili.
  problem: La maggior parte di chi compra per la prima volta sceglie la tavola SUP in base al prezzo o all'estetica invece di pensare a come e dove userà davvero la tavola. Il risultato è scarsa stabilità, prestazioni inadeguate ed esperienza frustrante.
  solution: Abbina forma, volume e costruzione della tavola al tuo livello e al tuo ambiente acquatico principale. Le tavole più larghe (32-34") offrono stabilità ai principianti. Quelle più lunghe (12-14") tengono meglio la rotta nel touring. La costruzione drop-stitch a 12-15 PSI offre una rigidità paragonabile a quella delle tavole rigide.
  audience: Chi acquista la prima tavola SUP, pagaiatori ricreativi e chiunque voglia passare a qualcosa in più rispetto a una tavola base.
  steps:
    - Identifica il tuo ambiente di pagaiata principale — lago, mare, fiume o misto
    - 'Abbina la larghezza della tavola al tuo livello: 32-34" per i principianti, 30-32" per gli intermedi, 28-30" per gli avanzati'
    - Scegli la lunghezza in base all'uso — più corta per manovrare, più lunga per tracciamento e velocità
    - 'Seleziona la costruzione: gonfiabile drop-stitch per il trasporto facile, rigida per le massime prestazioni'
    - Verifica la capacità di carico — il tuo peso più l'attrezzatura non deve superare l'80% del limite della tavola
    - 'Controlla gli accessori inclusi: pompa, leash, pinna, zaino e kit di riparazione'
  faq:
    - q: Che larghezza di SUP è meglio per i principianti?
      a: Una larghezza da 32 a 34 pollici offre la piattaforma più stabile per imparare. La SUP Explorer 11, con 33" di larghezza, è ideale per debuttare in acque calme.
    - q: Tavola SUP gonfiabile o rigida?
      a: Le gonfiabili offrono portabilità, stoccaggio comodo e assorbimento degli urti. Le rigide offrono massima rigidità e velocità. Per la maggior parte degli utenti ricreativi, una gonfiabile di qualità con nucleo drop-stitch è la scelta più pratica.
    - q: A quale PSI devo gonfiarla?
      a: Le tavole afarer raccomandano 12-15 PSI. A 15 PSI la tavola raggiunge la massima rigidità, paragonabile a quella di una tavola rigida. Resta sempre entro l'intervallo di pressione stampato sulla tavola.

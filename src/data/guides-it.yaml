- slug: sup-for-touring
  category: buying-guide
  title: Il miglior SUP da touring — guida all'acquisto per le lunghe distanze
  description: Come scegliere un SUP da touring per la pagaiata a lunga distanza — progetto dello scafo, lunghezza, larghezza, tracciamento e attrezzatura per le spedizioni di più giorni.
  tldr: I SUP da touring necessitano scafi più lunghi (12-14'), prue a dislocamento per uno scivolamento efficiente e larghezza moderata (30-32") per il tracciamento. Cerca elastici sul ponte, più anelli a D e drop-stitch ad alto PSI. Una pagaia specifica da touring, con pala più piccola, riduce la fatica nelle giornate lunghe.
  problem: Usare una tavola polivalente corta per il touring risulta in lentezza, scarso tracciamento e fatica precoce. La pagaiata a distanza richiede scafi specializzati.
  solution: Scegli una tavola da 12' o più con prua a dislocamento. La Ocean Pulse e la Ocean Voyager di Afarer offrono la forma dello scafo specifica per il touring e gli elastici necessari alle spedizioni.
  audience: Pagaiatori che pianificano gite di un giorno, spedizioni di più giorni o pagaiate di fitness a distanza.
  steps:
    - Scegli una tavola lunga 12-14' per uno scivolamento e un tracciamento efficienti
    - Seleziona una prua a dislocamento (punta affusolata) che taglia il mare mosso
    - Cerca una larghezza di 30-32" — più larga è più stabile, più stretta è più veloce
    - Verifica elastici sul ponte e griglia di anelli a D per fissare l'attrezzatura
    - Scegli una pagaia da touring (pala più piccola, asta più lunga) per la resistenza
    - Valuta un sistema di pinne con una pinna da touring più lunga per un tracciamento migliore
  faq:
    - q: Quale lunghezza di SUP da touring è migliore?
      a: 12' è il punto ottimale per la maggior parte dei pagaiatori — buon scivolamento e trasporto gestibile. 14' è più veloce ma più pesante e difficile da trasportare. I principianti dovrebbero partire da 12'.
    - q: I SUP da touring necessitano di una pinna speciale?
      a: Una pinna da touring più lunga (6-9") migliora sensibilmente il tracciamento. Molte tavole da touring hanno un fin box US per pinne intercambiabili.
    - q: Posso usare una tavola polivalente per il touring?
      a: Per brevi distanze (1-3 miglia) una polivalente funziona. Per distanze maggiori, lo scafo di una tavola da touring dedicata fa una differenza enorme su velocità e fatica.

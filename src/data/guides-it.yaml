- slug: sup-with-kids
  category: lifestyle
  title: 'SUP con i bambini: la guida completa per la famiglia'
  description: Come portare i bambini sul SUP in sicurezza — età consigliate, attrezzatura e attività.
  tldr: I bambini da 6 anni possono salire su un SUP con un adulto. Dai 10 anni possono pagaiare sulla propria tavola sotto supervisione. Usa una tavola larga e stabile, indossa sempre i salvagenti, resta in acque basse e calme e tieni le sessioni brevi (30-45 minuti al massimo).
  problem: I genitori vogliono condividere gli sport acquatici con i figli ma si preoccupano per la sicurezza, la taglia dell'attrezzatura e il coinvolgimento dei bambini.
  solution: Usa la giusta dimensione della tavola per l'uso in due, assicurati che ogni bambino indossi un salvagente della misura giusta, inizia in acque basse e tiepide e rendi tutto divertente con giochi e sessioni brevi.
  audience: Genitori che vogliono avvicinare i figli al SUP.
  steps:
    - 'Età 4-6: come passeggero sulla tavola di un adulto — seduti davanti, aggrappati alla maniglia centrale'
    - Età 6-10 — in ginocchio o seduti sulla propria tavola con supervisione adulta e leash
    - Età 10+ — sulla propria tavola con un adulto nelle vicinanze
    - Salvagente sempre — i bambini devono indossare in ogni momento un giubbotto salvagente della misura giusta
    - Resta in acque basse (altezza vita per l'adulto)
    - Sessioni brevi — 30-45 minuti al massimo per i bambini sotto i 10 anni
    - Rendilo divertente — giocate, cercate pesci, provate ad alzarvi in piedi
  faq:
    - q: A che età un bambino può fare SUP da solo?
      a: Intorno ai 10-12 anni con supervisione, in base alle capacità di nuoto e alla confidenza in acqua del bambino. Sempre in condizioni calme e acque basse.
    - q: Quale tavola è migliore per il SUP con bambini?
      a: Una tavola larga (34" o più) con alta capacità di carico per andare in due. La SUP Explorer 11, con 33" di larghezza e 220 lb di portata, funziona bene per genitore più bambino.
    - q: Quale attrezzatura di sicurezza serve ai bambini?
      a: Un giubbotto salvagente certificato CE della misura giusta, un leash (agganciato alla tavola dell'adulto quando si va in due), protezione solare e un cappello.

- slug: sup-inflation-psi-guide
  category: technical
  title: Guida al gonfiaggio del SUP — PSI ottimale per prestazioni e sicurezza
  description: Guida completa alla pressione di gonfiaggio del SUP — intervalli PSI consigliati, come la pressione influisce sulle prestazioni e consigli per usare bene la pompa.
  tldr: Gonfia a 12-15 PSI per la maggior parte dei SUP gonfiabili. Più pressione = più rigidità ma gonfiaggio più lento. Meno pressione = sensazione più morbida ma più flessione. Non superare mai il PSI massimo stampato sulla tua tavola. Usa una pompa con manometro accurato. L'aria fredda riduce la pressione, il sole caldo la aumenta.
  problem: Le tavole sottogonfiate risultano pigre e si flettono troppo. Quelle sovragonfiate rischiano il cedimento delle cuciture. Molti pagaiatori tirano a indovinare il PSI invece di misurarlo con precisione.
  solution: Usa una pompa con manometro integrato. Punta a 15 PSI per la massima rigidità. Controlla la pressione prima di ogni sessione — i cambi di temperatura influenzano sensibilmente il PSI.
  audience: Tutti i proprietari di SUP gonfiabili.
  steps:
    - Controlla l'intervallo di PSI consigliato stampato sulla tua tavola vicino alla valvola
    - Usa la pompa a doppia azione per gonfiare fino a metà dell'intervallo consigliato
    - Passa alla modalità a singola azione per gli ultimi 3-4 PSI, per un controllo più preciso
    - Verifica la pressione con il manometro — quelli analogici sono più affidabili dei digitali
    - Regola secondo le condizioni — PSI più alto per touring e gare, più basso per acque bianche e varchi rocciosi
    - Ricontrolla la pressione dopo 10 minuti di attesa — l'equilibrio termico cambia il PSI
  faq:
    - q: Posso sovragonfiare il mio SUP?
      a: Sì. Superare il PSI massimo nominale (di solito 15-18 PSI) può far staccare le cuciture e danneggiare il nucleo drop-stitch. Resta sempre entro l'intervallo stampato.
    - q: La temperatura influisce sul PSI?
      a: Notevolmente. Una tavola gonfiata a 15 PSI a 70°F può arrivare a 18 PSI al sole diretto a 95°F. L'acqua fredda può far scendere la pressione a 12 PSI. Controlla la pressione dopo i cambi ambientali.
    - q: Quale PSI per i principianti?
      a: 12-13 PSI per imparare offre una piattaforma leggermente più morbida, più tollerante nelle cadute. Aumenta a 15 PSI man mano che la tecnica migliora.

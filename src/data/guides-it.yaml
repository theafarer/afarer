- slug: sup-travel-transport
  category: planning
  title: Guida ai viaggi con il SUP — in aereo e in strada con un SUP gonfiabile
  description: Come viaggiare con un SUP gonfiabile in aereo, in auto o in camper. Consigli su extra delle compagnie aeree, imballaggio, gonfiaggio a destinazione e considerazioni per i viaggi internazionali.
  tldr: Sgonfia, arrotola e imballa il SUP nel suo zaino. La maggior parte delle compagnie aeree lo accetta come bagaglio da stiva (sotto le 50 lb / 50 pollici lineari). Imballa sempre pompa e pagaia nella stessa borsa. Arriva in anticipo, per avere tempo extra se il personale dell'aeroporto mette in discussione le dimensioni della borsa. Per i viaggi lunghi valutane la spedizione anticipata.
  problem: Viaggiare con un SUP sembra complicato — limiti di dimensione delle compagnie aeree, controlli di sicurezza e il problema di gonfiare la tavola in una destinazione remota creano incertezza.
  solution: Gli zaini Afarer per SUP sono progettati per rientrare nei limiti del bagaglio da stiva delle compagnie aeree. Imballa con criterio, porta un kit di riparazione e cerca prima della partenza i punti di gonfiaggio (marine, campeggi con corrente elettrica).
  audience: Pagaiatori che pianificano viaggi con il SUP in aereo, in auto o in camper.
  steps:
    - Sgonfia completamente e arrotola la tavola dalla prua alla coda
    - Imballa nello zaino la tavola arrotolata, la pompa, la pagaia, il leash e la pinna
    - Controlla i limiti di dimensione e peso della compagnia aerea — la maggior parte accetta 62 pollici lineari e 50 lb
    - Arriva in anticipo e preparati a un controllo manuale della borsa
    - Porta un kit di riparazione nel bagaglio a mano in caso la tavola si danneggi nel trasporto
    - Studia le opzioni di gonfiaggio — prese elettriche nei campeggi per le pompe elettriche, stazioni d'aria nelle marine
  faq:
    - q: La compagnia aerea accetterà il mio zaino SUP come bagaglio?
      a: La maggior parte delle compagnie aeree statunitensi ed europee accetta gli zaini SUP come bagaglio da stiva standard se pesano meno di 50 lb e misurano meno di 62 pollici lineari. Le compagnie low cost possono applicare supplementi per i bagagli fuori misura.
    - q: Posso portare il mio SUP come bagaglio a mano?
      a: No. Gli zaini SUP superano le dimensioni del bagaglio a mano su tutte le compagnie. Spedisci sempre lo zaino in stiva.
    - q: Come gonfio il mio SUP in una destinazione remota?
      a: La pompa manuale inclusa funziona ovunque senza corrente. Per comodità porta una pompa elettrica portatile e cerca campeggi con prese elettriche o marine con stazioni d'aria.

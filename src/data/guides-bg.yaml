    - 'Упражнявайте се на суша: накарайте кучето си да седне на спуснатата дъска, а след това върху надутата дъска на трева'
    - 'Преминете към плитка вода: коленичете на дъската с кучето си и направете няколко загребвания'
    - 'Поддържайте кратки сесии: максимум 20-30 минути за първите няколко излизания'
    - Винаги носете прясна вода, сгъваема купичка и кърпа за кучето си
  faq:
    - q: Коя SUP дъска е най-подходяща за кучета?
      a: Широка и стабилна дъска с мека EVA палуба, която осигурява сцепление за лапите. Tropical Breeze Island Escape с ширина 34"+ е идеална за гребане с кучета.
    - q: Нуждае ли се кучето ми от спасителна жилетка?
      a: Да, дори и за силни плувци. Спасителната жилетка за куче с дръжка улеснява вдигането на кучето обратно върху дъската, ако падне.
    - q: Как да попреча на кучето си да надраска дъската?
      a: Поддържайте ноктите на кучето си подстригани. Подложката от EVA пяна на палубата предпазва PVC повърхността. Поставете кърпа или постелка за домашни любимци на палубата за допълнителна защита.

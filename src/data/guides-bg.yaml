  faq:
    - q: Кое е по-лесно за научаване — SUP или каяк?
      a: Каякът има по-плавна крива на обучение — сядате и гребете. SUP изисква практика за равновесие, но повечето хора застават изправени още през първата сесия.
    - q: Кое е по-добро за риболов?
      a: Каякът предлага повече място за екипировка, поставки за въдици и стабилност при замятане. SUP предлага безшумно приближаване и достъп до плитки води. И двете работят, но каякът е по-популярен сред сериозните риболовци.
    - q: Кое се опакова по-компактно за пътуване?

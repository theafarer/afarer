- slug: sup-inflation-psi-guide
  category: technical
  title: Наръчник за надуване на SUP — оптимално PSI за представяне и безопасност
  description: 'Пълен наръчник за налягането при надуване на SUP: препоръчани диапазони PSI, как налягането влияе на представянето и съвети за правилна употреба на вашата помпа.'
  tldr: Надувайте до 12-15 PSI за повечето надуваеми SUP. По-високо налягане = повече твърдост, но по-бавно надуване. По-ниско налягане = по-меко усещане, но повече огъване. Никога не превишавайте максималното PSI, отпечатано върху вашата дъска. Използвайте помпа с точен манометър. Студеният въздух намалява налягането, горещото слънце го увеличава.
  problem: Недонадутите дъски се усещат мудни и се огъват прекомерно. Пренадутите дъски рискуват повреда на шевовете. Много гребци преценяват PSI на око, вместо да го измерват точно.
  solution: Използвайте помпа с вграден манометър. Целете 15 PSI за максимална твърдост. Проверявайте налягането преди всяка сесия — температурните промени влияят значително на PSI.
  audience: Всички собственици на надуваеми SUP.
  steps:
    - Проверете препоръчания диапазон PSI, отпечатан върху вашата дъска близо до клапана
    - Използвайте помпата с двойно действие, за да надуете дъската до средата на препоръчания диапазон
    - Превключете на режим с единично действие за последните 3-4 PSI за по-прецизен контрол
    - Проверете налягането с манометъра — аналоговите манометри са по-надеждни от цифровите
    - 'Коригирайте според условията: по-високо PSI за туризъм/състезания, по-ниско PSI за бързи води/скалисти брегове'
    - Проверете отново налягането, след като дъската постои 10 минути — температурното равновесие променя PSI
  faq:
    - q: Мога ли да пренадуя моя SUP?
      a: Да. Надвишаването на номиналното максимално PSI (обикновено 15-18 PSI) може да разлепи шевовете и да повреди сърцевината с вътрешни нишки. Винаги оставайте в отпечатания диапазон.
    - q: Влияе ли температурата на PSI?
      a: Значително. Дъска, надута до 15 PSI при 70°F, може да достигне 18 PSI на директно слънце при 95°F. Студената вода може да намали налягането до 12 PSI. Проверявайте налягането след промени в условията на средата.
    - q: Какво PSI е подходящо за начинаещи?
      a: 12-13 PSI за учебни цели осигурява малко по-мека платформа, която прощава паданията. Увеличете до 15 PSI, когато уменията ви се подобрят.

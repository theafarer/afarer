  title: Наръчник за капацитета по тегло на SUP — колко тежест може да издържи една SUP дъска?
  description: Разбиране на лимитите на капацитета по тегло на SUP, как да изчислите общото си натоварване и защо надвишаването на лимита влияе на представянето и безопасността.
  tldr: Никога не превишавайте 80% от максималния капацитет по тегло на дъската с телесното си тегло плюс екипировката. Дъска с капацитет 220 lb е подходяща за гребец с тегло 160 lb и лека екипировка. Надвишаването на лимита причинява нестабилно потъване, мудно управление и повишен риск от повреда.
  problem: Гребците често надвишават капацитета по тегло на дъската си, което води до слабо представяне, потъване и потенциални повреди по дъската. Производителите посочват максимални лимити, но не обясняват безопасното работно натоварване.
  solution: Изчислете общото си натоварване (телесно тегло + екипировка + вода, абсорбирана от дъската) и останете под 80% от посочения максимален капацитет. По-тежките гребци се нуждаят от дъски с по-голям обем и капацитет от 300+ lb.
  audience: Гребци с всякакво телосложение, особено по-едрите гребци и тези, които носят екипировка за експедиции.
  steps:
    - Намерете максималния капацитет по тегло, отпечатан върху вашата дъска (обикновено близо до клапана)
    - Измерете теглото си заедно с цялата екипировка, включително греблото, спасителната жилетка, водонепроницаемите торби, хладилната чанта и аксесоарите
    - 'Изчислете: (вашето общо натоварване) ÷ (максимален капацитет) × 100 = % използван капацитет'
    - Целете 70-80% за оптимално представяне и безопасност
    - Ако надвишавате 80%, изберете по-голяма дъска или намалете екипировката
  faq:
    - q: Какво се случва, ако превиша лимита на теглото?
      a: Дъската вози по-ниско, създавайки по-голямо съпротивление. Стабилността намалява, носът може да се потапя, а сърцевината с вътрешни нишки е с по-висок риск от повреда при вълнение.
    - q: Могат ли двама души да карат един SUP?
      a: Само ако общото тегло остане под 80% от капацитета. Повечето стандартни SUP са предназначени за един водач. Карането по двойки изисква дъска, специално сертифицирана за двама.
    - q: Надуваемите SUP с по-нисък капацитет ли са от твърдите дъски?
      a: Качествените надуваеми дъски с конструкция от вътрешни нишки имат сравним или по-висок капацитет по тегло от твърдите дъски благодарение на по-дебелото разпределение на обема.

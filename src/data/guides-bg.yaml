  title: Основни техники на гребане с SUP
  description: Овладейте правото загребване, дъговото загребване и кръстосания завой, за да гребате ефективно при всякакви условия.
  tldr: Правото загребване използва торса, а не ръцете. Дъговото загребване завърта дъската. Кръстосаният завой е най-ефективното въртене на място. Дръжте греблото вертикално и потапяйте лопатката напълно, за да предадете максимална сила.
  problem: Повечето гребци използват загребвания, доминирани от ръцете, които прахосват енергия и водят до умора на раменете. Лошата техника също прави дъската трудна за контролиране при вятър и накъсана вода.
  solution: Научете три основни загребвания — правото, дъговото и кръстосания завой — с правилна биомеханика на тялото. Тренирайте всяко от тях на спокойна вода, преди да преминете към предизвикателни условия.
  audience: Гребци, които искат да гребат по-дълго, по-бързо и с по-малка умора.
  steps:
    - 'Право загребване: протегнете се напред, поставете лопатката напълно във водата, дръпнете назад чрез въртене на торса (не с ръце) и извадете греблото на нивото на глезена'
    - 'Дъгово загребване: протегнете се напред при канела, изметнете лопатката в широк дъга към кърмата, за да завъртите дъската встрани от страната на греблото'
    - 'Кръстосан завой: поставете греблото от противоположната страна на дъската, без да сменяте ръцете, и дръпнете към кърмата'
    - 'Опора: използвайте ниска опора за стабилност при накъсана вода — плеснете лопатката плоско по повърхността на водата'
    - 'Придърпващо загребване: протегнете се настрани и придърпайте дъската странично към греблото'
  faq:
    - q: Как да греба по права линия?
      a: Използвайте еднаква дължина на загребването от двете страни. Сменяйте страните на всеки 5-10 загребвания. Гледайте неподвижна точка на хоризонта за ориентир.
    - q: Трябва ли да държа коленете си свити?
      a: Да. Дръжте коленете си леко свити — те действат като амортисьори. Здраво изпънатите колена предават всяка вълничка на торса ви и намаляват стабилността.
    - q: Как да греба срещу вятъра?
      a: Използвайте по-ниска стойка, по-къси и по-чести загребвания и стойте по-близо до брега, където вятърът често е по-слаб. Ако вятърът е твърде силен, не излизайте.

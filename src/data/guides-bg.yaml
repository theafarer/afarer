  title: Как да почистите и съхраните вашата надуваема SUP дъска
  description: Наръчник за поддръжка стъпка по стъпка, който максимизира живота на вашата надуваема SUP дъска.
  tldr: Изплаквайте с прясна вода след всяка употреба, подсушавайте напълно преди съхранение, спускайте въздуха и навивайте свободно (не стегнато), съхранявайте на хладно и сухо място далеч от пряка слънчева светлина и проверявайте шевовете веднъж месечно.
  problem: Неправилното съхранение и почистване са водещите причини за преждевременно разрушаване на надуваемите SUP — мухъл, UV поражения и разлепване на шевовете.
  solution: 'Прилагайте постоянна рутина след всяка сесия: изплакнете, подсушете, огледайте, спуснете въздуха и съхранете. Използвайте мек сапун за упорита мръсотия. Никога не съхранявайте дъската мокра или на пряка слънчева светлина.'
  audience: Всички собственици на надуваеми SUP, които искат дъската им да издържи 5+ години.
  steps:
    - Изплакнете дъската с прясна вода веднага след употреба, особено след солена вода
    - Почистете с мек сапун и мека гъба — избягвайте агресивни химикали и машинно миене под налягане
    - Подсушете дъската напълно — отворете клапана, за да излезе уловената вода
    - Огледайте за поражения — проверете шевовете, клапана и повърхността за пробиви
    - Спуснете въздуха напълно — извадете вътрешната част на клапана за пълно изпускане
    - Навийте дъската свободно — започнете от носа и избягвайте тесни гънки
    - Съхранявайте в чантата за пренасяне на хладно и сухо място, далеч от пряка слънчева светлина
  faq:
    - q: Мога ли да оставя SUP дъската надута през целия сезон?
      a: Да, но дръжте дъската далеч от пряка слънчева светлина, когато не я използвате. При продължително съхранение се препоръчва частично спускане (8-10 PSI).
    - q: Как да поправя пробив?
      a: Почистете зоната, изрежете кръпка със заоблени краища, нанесете лепило, притиснете здраво и изчакайте 24 часа преди надуване. Дъските afarer се доставят с комплект за ремонт.
    - q: Колко често трябва да проверявам клапана?
      a: Веднъж месечно. Клапанът е най-честата точка на отказ. Проверете дали иглата на клапана се движи свободно и дали уплътнителното кольцо е непокътнато.

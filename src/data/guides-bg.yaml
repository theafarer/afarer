  title: Наръчник за размерите на SUP — как да изберете правилните размери на дъската
  description: Пълен наръчник за размерите на SUP, обхващащ препоръки за дължина, ширина и дебелина въз основа на вашето тегло, ръст, ниво на умения и стил на гребане.
  tldr: Начинаещите се нуждаят от по-широки дъски (32-34") за стабилност. По-тежките гребци се нуждаят от по-дълги дъски (11'+) с по-голям обем. За туризъм са необходими по-дълги корпуси (12'+). За йога е необходима допълнителна ширина (34"+). Винаги проверявайте капацитета по тегло — вашето тегло плюс екипировката не бива да надвишава 80% от лимита.
  problem: Изборът на грешен размер SUP води до слаба стабилност, лошо следване на курса и разочароващо гребане. Повечето купувачи за първи път избират дъска, която изглежда добре, без да отчитат как размерите влияят на представянето.
  solution: 'Съобразете дължината, ширината и дебелината на дъската с вашето тегло, ниво на умения и основно предназначение. Използвайте нашия калкулатор за размери: добавете теглото си + теглото на екипировката и изберете дъска с поне 20% резерв над тази обща стойност.'
  audience: Купувачи на SUP за първи път, гребци, които преминават към специализирана дъска, и всички, които се съмняват относно размерите.
  steps:
    - Измерете теглото си заедно с цялата екипировка, която носите (гребло, спасителна жилетка, водонепроницаема торба)
    - Добавете 20% запас за безопасност, за да определите минималния капацитет по тегло
    - 'Изберете ширина според уменията: 32-34" за начинаещи, 30-32" за средно напреднали, 28-30" за напреднали'
    - 'Изберете дължина според предназначението: 10''6"-11''6" универсална, 12''-14'' за туризъм, 9''-10'' за бързи води'
    - 'Проверете дебелината: 6" стандартна, 4" за спортно представяне, 5" универсална'
    - Проверете препоръчания диапазон PSI на вашата дъска за оптимална твърдост
  faq:
    - q: Каква ширина на SUP е най-подходяща за начинаещи?
      a: Ширина от 32 до 34 инча осигурява най-стабилната платформа. Колкото по-широка е дъската, толкова по-лесно се запазва равновесието — особено за по-едри гребци.
    - q: Как да разбера дали даден SUP е твърде малък за мен?
      a: Ако дъската стои ниско във водата, реагира мудно или носът лесно се потапя при гребане, вероятно размерът е недостатъчен за вашето тегло.
    - q: Влияе ли дължината на дъската на скоростта?
      a: Да. По-дългата водна линия увеличава теоретичната скорост на корпуса. Туристическа дъска от 14' е значително по-бърза от универсална дъска от 10' при същите усилия на гребеца.

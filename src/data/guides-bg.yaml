  title: Съхранение на SUP и зимни грижи — удължете живота на вашата дъска
  description: Как правилно да съхранявате, почиствате и подготвяте за зимата вашата надуваема SUP дъска. Избягвайте мухъл, UV повреди и разграждане на материала с подходящи грижи.
  tldr: Почиствайте с прясна вода след всяка употреба. Изсушавайте напълно преди съхранение. Изпускайте въздуха и съхранявайте на хладно, тъмно място, далеч от директна слънчева светлина и екстремни температури. Никога не съхранявайте надута или в горещ автомобил. Нанасяйте периодично UV защитно средство.
  problem: Неправилното съхранение е водещата причина за преждевременното разрушаване на SUP — мухъл, разграждане на материала, деламиниране и повреди на клапана от жега или студ.
  solution: 'Спазвайте рутина от 3 стъпки: изплакнете след всяка сесия, изсушете старателно преди съхранение и съхранявайте спусната в среда с контролирана температура между 50-80°F (10-27°C).'
  audience: Всички собственици на SUP, които искат дъската им да издържи 5+ години.
  steps:
    - Изплакнете дъската, греблото и помпата с прясна вода след всяка сесия в солена или кална вода
    - Почиствайте с мек сапун и мека гъба — никога с агресивни химикали или машини под налягане
    - Изсушете дъската напълно на открито, преди да я спуснете (отворете клапана, за да излезе вътрешната влага)
    - Спуснете напълно и навийте от носа към опашката, за да изкарате остатъчния въздух
    - Избършете раницата на сухо, преди да поставите дъската в нея
    - Съхранявайте в хладен, тъмен килер или под леглото — никога на директно слънце, в горещ автомобил или в замръзващ навес
  faq:
    - q: Мога ли да държа своя SUP надут цял сезон?
      a: По-добре е да го спуснете, когато не се използва продължително време. Постоянното PSI напрежение ускорява умората на материала. Спуснете дъската между сесиите, ако ще я съхранявате повече от 2 седмици.
    - q: Как да отстраня мухъла от моя SUP?
      a: Смесете мек сапун с топла вода и малко бял оцет. Търкайте внимателно с мека четка. Изплакнете старателно и изсушете на сянка. Избягвайте белина, тя уврежда PVC.
    - q: Мога ли да съхранявам своя SUP в гараж?
      a: Само ако гаражът се поддържа между 50-80°F целогодишно. Таванските помещения и гаражите без климатизация подлагат дъската на температурни крайности, които увреждат сърцевината с вътрешни нишки.

sup:
  title: SUP знање — Водичи и ресурси за надувне SUP даске | Afarer
  description: Комплетан центар SUP знања који обухвата водиче за почетнике, одређивање величине даске, туторијале технике, савете за безбедност и технологију надувних SUP дасака.
  articles:
    - title: SUP основе — Водич за почетнике
      desc: Све што почетник треба да зна — врсте дасака, дужина весла, став и савети за први дан.
      href: /learn/sup/
    - title: Водич за величину SUP даске
      desc: Пронађите одговарајућу дужину, ширину и запремину даске за вашу тежину, вештину и стил веслања.
      href: /size-guide/
    - title: Надувна наспрам чврсте даске
      desc: Која је права за вас? Поређење преносивости, перформанси, издржљивости и цене.
      href: /compare/inflatable-vs-hardboard/
    - title: Технике средњег нивоа
      desc: Унапредите своје веслање напредним замасима весла, техникама скретања и управљањем у узбурканој води.
      href: /learn/intermediate-techniques/
    - title: Како изабрати надувни SUP
      desc: Размотрите кључне факторе — конструкцију, дебљину, поставку пераја и приложену опрему.
      href: /v2/how-to-choose-inflatable-sup/
    - title: Безбедност на води
      desc: Основно знање о безбедности укључујући читање временских прилика, избор PFD-а, самоспашавање и веслање у групи.
      href: /learn/water-safety/
water-safety:
  title: Знање о безбедности на води — Водичи за безбедно веслање | Afarer
  description: Свеобухватни ресурси о безбедности на води за SUP, кајакарење и пловидбу. Сазнајте о избору PFD-а, читању временских прилика, самоспашавању, безбедности у хладној води и CE сертификацији.
  articles:
    - title: Водич за безбедност на води
      desc: Основно знање о безбедности за сваког веслача — време, PFD-ови, самоспашавање и протоколи веслања у групи.
      href: /learn/water-safety/
    - title: Водич за спасилачке прслуке и PFD
      desc: Како изабрати право лично средство за плутање за SUP, кајакарење, пловидбу и професионалну употребу.
      href: /v2/life-jacket-buying-guide/
    - title: SUP листа за проверу безбедности
      desc: Безбедносна листа пре поласка коју сваки SUP веслач треба да испоштује пре изласка на воду.
      href: /v2/sup-safety-guide/
    - title: Безбедност веслања у хладној води
      desc: Основне мере опреза, опрема и технике за веслање у условима хладне воде.
      href: /v2/cold-water-safety-guide/
    - title: Грешке почетника у веслању
      desc: Честе грешке које праве веслачи први пут и како их избећи ради безбеднијег и пријатнијег искуства.
      href: /v2/beginner-sup-guide/
    - title: Објашњење CE сертификације
      desc: Шта CE сертификација значи за надувне SUP даске — стандарди, тестирање и зашто је важна за безбедност.
      href: /trust/

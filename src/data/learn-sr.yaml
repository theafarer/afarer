  description: Све што треба да знате да бисте почели са веслањем стојећи на дасци. Водичи за опрему, савети за величину, савети за безбедност и технике за почетнике из Afarer центра знања.
  articles: []
drop-stitch-core:
  title: Технологија дроп-стич језгра — Како надувни SUP-ови постижу чврстоћу
  description: 'Дубински увод у технологију дроп-стич конструкције: како хиљаде полиестерских конца стварају чврсте надувне платформе при 15-25 PSI. Густина конца, интеграција тканине, производни процес и поређења перформанси.'
  articles: []
inflatable-technology:
  title: Технологија надувних SUP дасака — Материјали, конструкција и инжењеринг
  description: Како се граде надувне SUP даске — слагање материјала, дроп-стич језгра, системи вентила, RF заваривање и тестирање квалитета. Сазнајте шта чини један надувни производ издржљивим и високоперформантним.
  articles: []
intermediate-techniques:
  title: Технике SUP-а и кајака за средњи ниво — Изнад основа
  description: Подигните своје вештине веслања уз напредне замасе весла, управљање у узбурканој води, контролу ветра, технике самоспашавања и бонтон веслања у групи. За веслаче спремне да надмаше почетничке вештине.
  articles: []
materials:
  title: Материјали за надувне SUP даске — PVC, EVA и дроп-стич тканина
  description: 'Свеобухватан водич кроз материјале који се користе у производњи надувних SUP дасака: војни PVC, EVA пена за палубу, дроп-стич тканина, карбонска влакна и легуре алуминијума. Спецификације, примене и критеријуми избора.'
  articles: []

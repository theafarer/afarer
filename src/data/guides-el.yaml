- slug: sup-weight-capacity
  category: buying-guide
  title: Οδηγός χωρητικότητας βάρους SUP — πόσο βάρος αντέχει μια SUP;
  description: Κατανόηση των ορίων χωρητικότητας βάρους SUP, πώς να υπολογίσετε το συνολικό σας φορτίο και γιατί η υπέρβαση του ορίου επηρεάζει την απόδοση και την ασφάλεια.
  tldr: Μην υπερβαίνετε ποτέ το 80% της μέγιστης χωρητικότητας βάρους της σανίδας με το βάρος σώματός σας συν τον εξοπλισμό. Μια σανίδα χωρητικότητας 220 λιμπρών είναι κατάλληλη για κωπηλάτη 160 λιμπρών με ελαφρύ εξοπλισμό. Η υπέρβαση του ορίου προκαλεί βύθιση της πλώρης, νωθρό χειρισμό και αυξημένο κίνδυνο βλάβης.
  problem: Οι κωπηλάτες συχνά υπερβαίνουν τη χωρητικότητα βάρους της σανίδας τους, με αποτέλεσμα κακή απόδοση, βύθιση και πιθανή βλάβη της σανίδας. Οι κατασκευαστές αναγράφουν μέγιστα όρια αλλά δεν εξηγούν τα ασφαλή φορτία λειτουργίας.
  solution: Υπολογίστε το συνολικό σας φορτίο (βάρος σώματος + εξοπλισμός + νερό που απορροφά η σανίδα) και μείνετε κάτω από το 80% της δηλωμένης μέγιστης χωρητικότητας. Οι βαρύτεροι κωπηλάτες χρειάζονται σανίδες μεγαλύτερου όγκου με χωρητικότητα 300+ λιμπρών.
  audience: Κωπηλάτες κάθε μεγέθους, ειδικά μεγαλύτεροι κωπηλάτες και όσοι μεταφέρουν εξοπλισμό αποστολής.
  steps:
    - Βρείτε τη μέγιστη χωρητικότητα βάρους τυπωμένη στη σανίδα σας (συνήθως κοντά στη βαλβίδα)
    - Ζυγιστείτε μαζί με όλο τον εξοπλισμό συμπεριλαμβανομένων κουπιού, σωσίβιου, αδιάβροχων σακουλών, ψυγείου και αξεσουάρ
    - Υπολογίστε — (το συνολικό σας φορτίο) διαιρεμένο με (τη μέγιστη χωρητικότητα) επί 100 ίσον με το ποσοστό χρήσης της χωρητικότητας
    - Στοχεύστε 70-80% για βέλτιστη απόδοση και ασφάλεια
    - Αν υπερβαίνετε το 80%, επιλέξτε μεγαλύτερη σανίδα ή μειώστε τον εξοπλισμό
  faq:
    - q: Τι συμβαίνει αν υπερβώ το όριο βάρους;
      a: Η σανίδα κάθεται χαμηλότερα δημιουργώντας μεγαλύτερη αντίσταση. Η σταθερότητα μειώνεται, η πλώρη μπορεί να βυθίζεται και ο πυρήνας drop-stitch διατρέχει μεγαλύτερο κίνδυνο βλάβης στα ταραγμένα νερά.
    - q: Μπορούν δύο άνθρωποι να επιβιβαστούν σε μία SUP;
      a: Μόνο αν το συνολικό βάρος μένει κάτω από το 80% της χωρητικότητας. Οι περισσότερες τυπικές SUP σχεδιάζονται για έναν αναβάτη. Η επιβίβαση δύο ατόμων απαιτεί σανίδα ειδικά βαθμολογημένη για δύο.
    - q: Έχουν οι φουσκωτές SUP χαμηλότερη χωρητικότητα από τις σκληρές;
      a: Οι ποιοτικές φουσκωτές με κατασκευή drop-stitch έχουν συγκρίσιμη ή υψηλότερη χωρητικότητα βάρους από τις σκληρές σανίδες χάρη στην πιο παχιά κατανομή όγκου τους.

- slug: weather-conditions
  category: safety
  title: Rozumienie warunków pogodowych podczas wiosłowania na desce
  description: Naucz się czytać wiatr, fale, pływy i wzorce pogodowe, aby podejmować bezpieczne decyzje na wodzie.
  tldr: Sprawdź trzy rzeczy przed każdym wypłynięciem — prędkość wiatru (poniżej 10 mph dla początkujących), wysokość fal (poniżej 1 stopy dla początkujących) i temperaturę wody (ubierz się pod wodę, nie pod powietrze). Wiatr od lądu jest niebezpieczny na każdym poziomie umiejętności.
  problem: Większość wypadków związanych z pogodą zdarza się, ponieważ użytkownicy desek błędnie oceniają warunki — sprawdzają temperaturę powietrza, ale nie wody, albo nie rozumieją, że wiatr od lądu może wynieść ich na pełne morze.
  solution: Stosuj ustrukturyzowaną ocenę pogody przed wypłynięciem — kierunek i prędkość wiatru, okres i wysokość fal, stan pływów oraz temperaturę wody. Rozumiej, jak każdy czynnik wpływa na Twoje bezpieczeństwo.
  audience: Wszyscy pływający na otwartej wodzie — jeziorach, zatokach, rzekach i morzu.
  steps:
    - Sprawdź prędkość i kierunek wiatru — wiatr od lądu (wiejący w stronę morza) jest najniebezpieczniejszy
    - Oceń warunki falowe — okres fali ma tak samo duże znaczenie jak jej wysokość
    - Poznaj pływy — prądy pływowe mogą być silniejsze niż Twoja prędkość wiosłowania
    - Zmierz temperaturę wody — poniżej 60°F/15°C wymagana jest ochrona termiczna
    - Sprawdź widzialność — mgła i ulewny deszcz ograniczają widoczność i zwiększają ryzyko kolizji
    - Poznaj lokalne zagrożenia — zanurzone skały, silne prądy, strefy ruchu łodzi
  faq:
    - q: Jaka prędkość wiatru jest za wysoka na SUP?
      a: Początkujący — powyżej 10 mph (8 węzłów). Średniozaawansowani — powyżej 15 mph (13 węzłów). Zaawansowani — powyżej 20 mph (17 węzłów). W razie wątpliwości nie wychodź na wodę.
    - q: Co oznacza okres fali?
      a: Okres fali to czas między kolejnymi falami. Krótkie okresy (poniżej 8 sekund) oznaczają strome, poszarpane fale. Długie okresy (powyżej 12 sekund) oznaczają gładsze, bardziej przewidywalne fale oceaniczne.
    - q: Czy mogę wiosłować podczas deszczu?
      a: Lekki deszcz jest zwykle bezpieczny. Ulewny deszcz ogranicza widoczność i może sygnalizować zmianę warunków wiatrowych. Burze wymagają natychmiastowego opuszczenia wody.

- slug: understanding-specs
  category: technical
  title: Jak czytać specyfikacje deski SUP
  description: Przewodnik techniczny po specyfikacjach desek SUP — objętość, wymiary, konstrukcja i ich znaczenie dla osiągów.
  tldr: Kluczowe parametry — objętość (litry) decyduje o wyporności i nośności, szerokość o stabilności, długość o utrzymywaniu kursu i prędkości, grubość o sztywności, a dopuszczalne PSI o ciśnieniu pompowania dla optymalnych osiągów.
  problem: Karty produktów podają liczby bez kontekstu, przez co kupujący nie wiedzą, które specyfikacje faktycznie mają znaczenie w ich przypadku.
  solution: Przetłumacz każdą specyfikację na realne zachowanie — objętość na pływalność, szerokość na stabilność, długość na ślizg, grubość na sztywność, a konstrukcję na trwałość.
  audience: Średniozaawansowani użytkownicy i techniczni kupujący, którzy chcą podejmować decyzje oparte na danych.
  steps:
    - Sprawdź objętość (litry) — Twoja waga plus sprzęt nie powinny przekraczać 80% objętości deski
    - Sprawdź szerokość — szersza (32-34") daje więcej stabilności, węższa (28-30") daje więcej prędkości
    - Sprawdź długość — dłuższa (12-14") lepiej trzyma kurs, krótsza (10-11") jest zwrotniejsza
    - Sprawdź grubość — 6" to standard, 8" oferuje większą sztywność i nośność
    - Sprawdź dopuszczalne PSI — napompuj do maksymalnego ciśnienia dla optymalnej sztywności
    - Sprawdź materiały konstrukcyjne — gęstość drop-stitch, warstwy PVC, wzmocnienie krawędzi
  faq:
    - q: Co oznacza drop-stitch?
      a: Drop-stitch to metoda konstrukcji, w której tysiące nici łączy górną i dolną warstwę deski. Umożliwia to pompowanie pod wysokim ciśnieniem (12-15 PSI) dla ekstremalnej sztywności.
    - q: Jaki jest idealny stosunek wagi do objętości?
      a: Dobry cel to około 5-6 funtów wagi użytkownika na litr objętości deski. Użytkownik o wadze 220 funtów powinien szukać desek o objętości powyżej 180 litrów.
    - q: Czy waga deski ma znaczenie?
      a: Tak. Lżejsze deski (poniżej 20 funtów) są łatwiejsze w noszeniu i transporcie. Cięższe deski (25+ funtów) często oznaczają trwalszą wielowarstwową konstrukcję PVC.

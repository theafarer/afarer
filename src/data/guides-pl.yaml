- slug: multi-day-trip
  category: planning
  title: Planowanie wielodniowej wyprawy SUP
  description: Jak zaplanować i przeprowadzić wielodniową wyprawę wiosłową — planowanie trasy, pakowanie sprzętu, biwakowanie i bezpieczeństwo.
  tldr: Planuj 10-15 mil dziennie. Pakuj sprzęt do wodoszczelnych worków suchych, rozdzielaj wagę równomiernie i poćwicz załadunek deski przed wyprawą. Zostaw plan rejsu. Zabierz wodę, jedzenie, schronienie, nawigację i środki łączności.
  problem: Wielodniowe wyprawy kończą się porażką z powodu przepakowania, złego planowania trasy lub niedoszacowania pogody i prądu — co prowadzi do wyczerpania, awarii sprzętu lub incydentów bezpieczeństwa.
  solution: Stosuj systematyczne podejście do planowania — wybór trasy, lista sprzętu, planowanie żywności, odprawa bezpieczeństwa i plany awaryjne.
  audience: Doświadczeni użytkownicy planujący pierwszą wielodniową ekspedycję.
  steps:
    - Wybierz trasę z utrwalonymi polami biwakowymi i punktami ewakuacyjnymi
    - Planuj 10-15 mil dziennie z uwzględnieniem wiatru i prądu
    - Sprawdź tabele pływów i prognozy pogody dla całego okna wyprawy
    - Spakuj sprzęt do wodoszczelnych worków suchych — 20-30 funtów sprzętu łącznie
    - Rozdziel wagę równomiernie — najcięższe przedmioty w centrum
    - Zostaw szczegółowy plan rejsu komuś na lądzie
    - Zabierz nawigację — papierową mapę morską, kompas i zapasowy GPS
    - Spakuj awaryjne schronienie, zapasowe jedzenie i apteczkę
  faq:
    - q: Jaki dzienny dystans jest optymalny?
      a: 10-15 mil dziennie dla doświadczonych użytkowników. Początkujący powinni planować 5-8 mil. Zawsze zostawiaj zapas czasu na pogodę.
    - q: Ile wody powinienem zabrać?
      a: 1 galon na osobę dziennie. W upale 1,5 galona. Zabierz filtr do wody lub tabletki uzdatniające do uzupełnień.
    - q: Jaki element bezpieczeństwa jest najważniejszy?
      a: Łączność. Radio VHF lub komunikator satelitarny mogą uratować życie w nagłych wypadkach. Telefony komórkowe są zawodne na odludziach.

- slug: sup-fitness
  category: lifestyle
  title: 'Fitness na SUP — trening całego ciała na wodzie'
  description: Jak wiosłowanie na desce SUP buduje siłę mięśni core, równowagę i wydolność krążeniową.
  tldr: SUP angażuje mięśnie core, nogi, plecy i barki przy każdym pociągnięciu. Jednogodzinna sesja spala 300-500 kalorii. Wiosłowanie pod wiatr lub prąd podwaja intensywność. Joga na SUP dodaje pracę nad gibkością i równowagą.
  problem: Wiele osób traktuje wiosłowanie na desce jako rekreacyjną rozrywkę, a nie pełnoprawne narzędzie fitness, pomijając jego potencjał do treningu całego ciała.
  solution: Planuj sesje SUP z konkretnymi celami treningowymi — wiosłowanie wytrzymałościowe dla wydolności, interwały sprinterskie dla mocy, joga na SUP dla gibkości i wiosłowanie dystansowe dla wytrzymałości mięśniowej.
  audience: Pasjonaci fitness szukający treningu całego ciała o niskim obciążeniu stawów i wysokim zaangażowaniu.
  steps:
    - Rozgrzej się na lądzie — krążenia ramion, skręty tułowia i wymachy nóg przez 5 minut
    - Zacznij od 10 minut równomiernego wiosłowania o umiarkowanej intensywności
    - Przejdź do treningu interwałowego — 2 minuty mocnego wiosłowania, 2 minuty lekkiej regeneracji
    - Włącz pozycje jogi na SUP — psa z głową w dół, wojownika II i pozycję drzewa na desce
    - Zakończ spokojnym wiosłowaniem i rozciąganiem statycznym na desce
  faq:
    - q: Czy SUP jest lepszy dla kondycji niż bieganie?
      a: SUP zapewnia porównywalne korzyści krążeniowe przy mniejszym obciążeniu stawów. Angażuje też górną część ciała i mięśnie core bardziej niż bieganie.
    - q: Ile kalorii spala SUP?
      a: Około 300-500 kalorii na godzinę przy umiarkowanej intensywności. Wyścigi lub wiosłowanie pod wiatr mogą spalać 600-800 kalorii na godzinę.
    - q: Czy mogę zbudować mięśnie dzięki SUP?
      a: Tak. Wiosłowanie buduje mięśnie barków, pleców i core. Utrzymywanie równowagi angażuje nogi i mięśnie stabilizujące. To trening oporowy całego ciała.

- slug: sup-weight-capacity
  category: buying-guide
  title: 'Przewodnik po nośności SUP — ile wagi utrzyma deska SUP?'
  description: Zrozumienie limitów nośności desek SUP, sposób obliczania całkowitego obciążenia i wpływ przekraczania limitu na osiągi i bezpieczeństwo.
  tldr: Nigdy nie przekraczaj 80% maksymalnej nośności deski swoją wagą ciała plus sprzętem. Deska o nośności 220 funtów pasuje dla użytkownika o wadze 160 funtów z lekkim sprzętem. Przekroczenie limitu powoduje zanurzanie dziobu, leniwe prowadzenie i zwiększone ryzyko uszkodzenia.
  problem: Użytkownicy często przekraczają nośność swojej deski, co prowadzi do słabych osiągów, zanurzania i potencjalnych uszkodzeń. Producenci podają maksymalne limity, ale nie wyjaśniają bezpiecznych obciążeń roboczych.
  solution: Oblicz całkowite obciążenie (waga ciała + sprzęt + woda wchłonięta przez deskę) i pozostań poniżej 80% deklarowanej maksymalnej nośności. Ciężsi użytkownicy potrzebują desek o większej objętości z nośnością powyżej 300 funtów.
  audience: Użytkownicy o każdej wadze, szczególnie ciężsi i ci, którzy zabierają sprzęt ekspedycyjny.
  steps:
    - Znajdź maksymalną nośność nadrukowaną na swojej desce (zwykle przy zaworze)
    - Zważ siebie i cały sprzęt łącznie z wiosłem, kamizelką ratunkową, workami suchymi, skrzynką chłodzącą i akcesoriami
    - Oblicz — (Twoje całkowite obciążenie) ÷ (maksymalna nośność) × 100 = procent wykorzystania nośności
    - Celuj w 70-80% dla optymalnych osiągów i bezpieczeństwa
    - Przy przekroczeniu 80% wybierz większą deskę lub zredukuj sprzęt
  faq:
    - q: Co się stanie, jeśli przekroczę limit wagi?
      a: Deska płynie niżej, tworząc większy opór. Stabilność spada, dziób może się zanurzać, a rdzeń drop-stitch jest bardziej narażony na uszkodzenie na falach.
    - q: Czy dwie osoby mogą jechać na jednej desce SUP?
      a: Tylko jeśli łączna waga pozostaje poniżej 80% nośności. Większość standardowych desek SUP jest zaprojektowana dla jednej osoby. Jazda w tandemie wymaga deski z odpowiednim dopuszczeniem dla dwóch osób.
    - q: Czy dmuchane deski SUP mają niższą nośność niż twarde?
      a: Jakościowe deski dmuchane z konstrukcją drop-stitch mają porównywalną lub wyższą nośność niż twarde deski dzięki grubszej dystrybucji objętości.

- slug: choosing-paddle
  category: buying-guide
  title: Ako si vybrať správne SUP pádlo
  description: Sprievodca materiálmi pádiel, tvarmi listov, typmi násad a veľkosťami pre SUP.
  tldr: 'Dĺžka pádla: SUP pádla by mali byť o 6-8" vyššie než vaša výška. Tvar listu: dihedrálne listy držia priamy smer, ploché listy ponúkajú silnejší záber. Materiál násady: karbón je najľahší, sklovlákno má najlepší pomer cena/výkon, hliník je najlacnejší.'
  problem: Používanie nesprávnej veľkosti alebo materiálu pádla spôsobuje zbytočnú únavu, nízku účinnosť záberu a namáhanie kĺbov.
  solution: Prispôsobte dĺžku pádla, tvar listu, materiál násady a ohybnosť vášmu štýlu pádlovania, telesnej veľkosti a rozpočtu.
  audience: Pádlári na SUPe, ktorí si vyberajú svoje prvé alebo ďalšie pádlo.
  steps:
    - Zmerajte výšku pádla — pre všeobecné pádlovanie o 6-8" viac než vaša výška
    - Zvoľte materiál listu — nylon pre nízky rozpočet, sklovlákno pre dobrý pomer cena/výkon, karbón pre výkon
    - Zvoľte tvar listu — dihedrálny pre hladké držanie smeru, plochý pre silu, lyžicový pre preteky
    - Zvoľte typ násady — rovná pre všeobecné použitie, ohnutá pre pretekársky SUP
    - Skontrolujte ohybnosť — tuhšie násady prenášajú viac sily, ohybné násady znižujú záťaž na kĺby
  faq:
    - q: Aký je najlepší materiál pádla?
      a: Sklovlákno ponúka najlepšie vyváženie hmotnosti, odolnosti a ceny. Karbón je ľahší, ale drahší a krehší. Nylon je ťažký, ale prakticky nezničiteľný.
    - q: Ako zistím, či má moje pádlo správnu dĺžku?
      a: Postavte pádlo zvislo vedľa seba — rukoväť by mala siahať k vášmu zápästiu, keď zdvihnete ruku nad hlavu.
    - q: Mám si kúpiť jednodielne alebo nastaviteľné pádlo?
      a: Nastaviteľné pádla sú vhodné na spoločné používanie a na cestovanie. Jednodielne pádla sú ľahšie, tuhšie a účinnejšie pri pravidelnom používaní.

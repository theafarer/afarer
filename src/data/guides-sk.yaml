- slug: sup-storage-winter-care
  category: maintenance
  title: Uskladnenie SUP a zimná starostlivosť — predĺžte životnosť svojej dosky
  description: Ako správne uskladniť, vyčistiť a zazimovať vašu nafukovaciu dosku SUP. Vyhnite sa plesniam, poškodeniu UV a degradácii materiálu so správnou starostlivosťou.
  tldr: Po každom použití opláchnite sladkou vodou. Pred uskladnením úplne vysušte. Vypustite a uskladnite na chladnom, tmavom mieste mimo priameho slnečného žiarenia a extrémnych teplôt. Nikdy neuskladňujte dosku nafúknutú ani v horúcom aute. Pravidelne nanášajte UV ochranný prostriedok.
  problem: Nesprávne uskladnenie je vedúcou príčinou predčasného zlyhania SUP — plesne, rozklad materiálu, delaminácia a poškodenie ventilu teplom či chladom.
  solution: 'Dodržiavajte trojkrokovú rutinu starostlivosti: opláchnite po každej jazde, pred uskladnením dôkladne vysušte a vypustenú uskladnite v prostredí s regulovanou teplotou medzi 50-80°F (10-27°C).'
  audience: Všetci vlastníci SUP, ktorí chcú, aby im doska vydržala 5+ rokov.
  steps:
    - Opláchnite dosku, pádlo a pumpu sladkou vodou po každej jazde v slanej alebo kalnej vode
    - Čistite jemným mydlom a mäkkou hubkou — nikdy agresívnymi chemikáliami ani vysokotlakovými čističmi
    - Dosku pred vypustením úplne vysušte vonku (otvorte ventil, aby vnútorná vlhkosť unikla)
    - Úplne vypustite a zvíňajte od predku smerom k chvostu, aby ste vytlačili zvyšný vzduch
    - Batoh utrite do sucha predtým, než doň dosku uložíte
    - Uskladnite v chladnej, tmavej skrini alebo v úložnom priestore pod postelou — nikdy na priamom slnku, v horúcom aute ani v zamrznutej kôlni
  faq:
    - q: Môžem nechať SUP nafúknutý celú sezónu?
      a: Je lepšie ho vypustiť, keď sa dlhšie nepoužíva. Neustála tlaková záťaž PSI urýchľuje únavu materiálu. Ak ho nechávate viac než 2 týždne, medzi jazdami vypustite.
    - q: Ako odstránim plesne zo svojho SUP?
      a: Zmiešajte jemné mydlo s teplou vodou a kvapkou bieleho octu. Jemne vydrhnite mäkkou kefou. Dôkladne opláchnite a vysušte v tieni. Vyhnite sa bielidlu, ktoré poškodzuje PVC.
    - q: Môžem uskladniť SUP v garáži?
      a: Iba ak garáž zostáva celý rok medzi 50-80°F. Pôdy a neregulované garáže zažívajú teplotné extrémy, ktoré poškodzujú jadrá s prepájacími niťami.

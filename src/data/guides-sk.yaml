- slug: sup-yoga
  category: lifestyle
  title: 'SUP joga: kompletný sprievodca pádlovaním a jogou'
  description: Spojte paddleboarding s jogou pre zlepšenú rovnováhu, silu a duševnú prítomnosť na vode.
  tldr: SUP joga pridáva prvok instability, ktorý v porovnaní s jogou na súši výrazne zvyšuje aktiváciu stredného tela. Začnite so základnými pozíciami na širokej, stabilnej doske v pokojnej vode. Použite protišmykovú podložku paluby. Nikdy necvičte SUP jogu sami.
  problem: Tradičné jóga podložky poskytujú dokonale stabilný povrch, čím odstraňujú rovnovážnu výzvu, vďaka ktorej je SUP joga jedinečne účinná pre silu stredného tela a sústredenie.
  solution: Použite mimoriadne širokú SUP dosku (34"+) s protišmykovou podložkou po celej palube. Cvičte v pokojnej, plytkej vode. Začnite so základnými pozíciami skôr, než sa pokúsite o obrátené pozície.
  audience: Cvičenci jogy a pádlári, ktorí chcú spojiť tréning rovnováhy s duševnou prítomnosťou.
  steps:
    - Ukotvite dosku v plytkej, pokojnej vode — použite pieskovú kotvu alebo ju priviažte k móstu
    - Začnite sediacimi pozíciami — jednoduchý sed, pozícia loďky, sedací zákrut
    - Pokračujte kľačiacimi pozíciami — stôl, mačka-krava, hromový sed
    - Prejdite na stojace pozície — hora, bojovník I, bojovník II, strom
    - Cvičte pozície na rovnováhu — polmesiac, orol, tanečník
    - Ukončite savásanou — ľahnite si na dosku a vnímajte pohyb vody
  faq:
    - q: Ktorá doska je najlepšia na SUP jogu?
      a: Široká doska (34"+) s protišmykovou podložkou po celej dĺžke poskytuje najstabilnejšiu plošinu. SUP Tour 12 ponúka dobré vyváženie stability a hladkej jazdy.
    - q: Je SUP joga nebezpečná?
      a: Nie viac než joga na súši, ak ju cvičíte bezpečne. Využívajte pokojnú, plytkú vodu. Noste pútací popruh. Cvičte s partnerom. Vyhnite sa hlbokej vode počas prvých tréningov.
    - q: Potrebujem špeciálne vybavenie?
      a: Široká stabilná doska, protišmyková podložka celej paluby, pútací popruh a PFD. Niektorí cvičenci používajú na dodatočný záber vodotesnú podložku.

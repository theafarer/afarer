- slug: sup-inflation-psi-guide
  category: technical
  title: Príručka nafukovania SUP — optimálne PSI pre výkon a bezpečnosť
  description: 'Kompletný sprievodca tlakom nafukovania SUP: odporúčané rozsahy PSI, ako tlak ovplyvňuje výkon a tipy na správne použitie vašej pumpy.'
  tldr: Väčšinu nafukovacích SUP nafúknite na 12-15 PSI. Vyšší tlak = väčšia tuhosť, ale pomalšie nafukovanie. Nižší tlak = mäkší pocit, ale väčšia ohybnosť. Nikdy neprekračujte maximálne PSI uvedené na vašej doske. Používajte pumpu s presným manometrom. Studený vzduch tlak znižuje, horúce slnko ho zvyšuje.
  problem: Nedostatočne nafúknuté dosky pôsobia ťažkopádne a nadmerne sa ohýbajú. Prefúknuté dosky riskujú zlyhanie švov. Mnohí pádlari PSI len odhadujú namiesto presného merania.
  solution: Použite pumpu so vstavaným manometrom. Cieľajte na 15 PSI pre maximálnu tuhosť. Skontrolujte tlak pred každou jazdou — zmeny teploty výrazne ovplyvňujú PSI.
  audience: Všetci vlastníci nafukovacích SUP.
  steps:
    - Skontrolujte odporúčaný rozsah PSI vytlačený na vašej doske pri ventile
    - Použite dvojčinnú pumpu na nafúknutie do stredu odporúčaného rozsahu
    - Pre posledných 3-4 PSI prepnite na jednočinný režim pre presnejšiu kontrolu
    - Skontrolujte tlak manometrom — analógové manometre sú spoľahlivejšie než digitálne
    - 'Upravte podľa podmienok: vyššie PSI pre turistiku a preteky, nižšie PSI pre divokú vodu a skalnaté miesta spustenia'
    - Znovu skontrolujte tlak, keď doska 10 minút odstojí — teplotná rovnováha mení PSI
  faq:
    - q: Môžem svoj SUP prefúknuť?
      a: Áno. Prekročenie maximálneho povoleného PSI (zvyčajne 15-18 PSI) môže spôsobiť delamináciu švov a poškodiť jadro s prepájacími niťami. Vždy sa držte vytlačeného rozsahu.
    - q: Ovplyvňuje teplota PSI?
      a: Výrazne. Doska nafúknutá na 15 PSI pri 70°F môže na priamom slnku pri 95°F dosiahnuť 18 PSI. Studená voda môže tlak znížiť na 12 PSI. Po zmenách prostredia skontrolujte tlak.
    - q: Aké PSI je vhodné pre začiatočníkov?
      a: Na učenie poskytuje 12-13 PSI mierne mäkšiu platformu, ktorá je pri pádoch tolerantnejšia. So zlepšujúcimi sa zručnosťami zvyšujte tlak na 15 PSI.

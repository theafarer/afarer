- slug: sup-for-whitewater
  category: buying-guide
  title: Sprievodca SUP na divokej vode — Sprievodca nákupom nafukovacej dosky na jazdenie po riekach
  description: 'Ako vybrať SUP na divokú vodu na jazdenie po riekach: kratšie dosky, zosilnená konštrukcia, bezpečnostná výbava a pádlovacie techniky na pereje triedy I-III.'
  tldr: SUP na divokú vodu potrebujú kratšiu dĺžku (8-10'), zosilnené bočnice, vyššie PSI (15+) a viacero vzduchových komôr pre bezpečnosť. Použite rovný riečny popruh (nie zvinutý), noste prilbu a PFD a vždy pádlujte s partnerom. Začnite na perejách triedy I, než sa pustíte do ťažších perejí.
  problem: Použitie štandardného univerzálneho SUP na tečúcej vode je nebezpečné — štandardným doskám chýba manévrovateľnosť, odolnosť proti nárazom a bezpečnostné prvky potrebné na riekach.
  solution: Vyberte si SUP na divokú vodu postavený na tento účel — s krátkou dĺžkou pre obratnosť, zosilnenou konštrukciou na nárazy do kameňov a viackomorovou stavbou pre bezpečnosť.
  audience: Skúsení jazdci prechádzajúci na jazdenie po riekach.
  steps:
    - Vyberte si dosku dlhú 8-10' pre maximálnu manévrovateľnosť v perejách
    - Hľadajte zosilnenú konštrukciu bočníc a PVC vojenskej kvality
    - Zvoľte dosku s 2+ vzduchovými komorami pre rezervu v prípade prepichnutia
    - Použite rovný riečny popruh pripojený k pásu s rýchlym uvoľnením
    - Noste prilbu, PFD a vhodnú obuv na rieku
    - Začnite na perejách triedy I a postupne napredujte so skúseným partnerom
  faq:
    - q: Môžem na divokú vodu použiť bežný SUP?
      a: Neodporúča sa. Štandardné SUP nemajú odolnosť proti nárazom a na kameňoch sa môžu delaminovať. Viackomorová bezpečnosť je v riečnom prostredí kľúčová.
    - q: Aké PSI pre SUP na divokú vodu?
      a: 15+ PSI pre maximálnu tuhosť. Tvrdšia doska sa od kameňov lepšie odrazí než nedostatočne nafúkaná, ktorá sa prispôsobuje prekážkam.
    - q: Potrebujem špeciálne pádlovacie zručnosti na SUP na divokej vode?
      a: Áno. Čítanie rieky, zajazdy do zátišia, prevozy cez prúd a oporné techniky sú nevyhnutné zručnosti. Pred pokusom o triedu II+ absolvujte kurz SUP na divokej vode.

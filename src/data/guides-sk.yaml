- slug: weather-conditions
  category: safety
  title: Pochopenie poveternostných podmienok pre jazdenie na SUP
  description: Naučte sa čítať vietor, vlny, príliv a vývoj počasia, aby ste na vode prijímali bezpečné rozhodnutia.
  tldr: 'Pred každým vyplávaním skontrolujte tri veci: rýchlosť vetra (pod 10 mph pre začiatočníkov), výšku vĺn (pod 1 ft pre začiatočníkov) a teplotu vody (obliekajte sa podľa vody, nie podľa vzduchu). Vietor od brehu je nebezpečný pri každej úrovni zručností.'
  problem: Väčšina nehôd súvisiacich s počasím sa stáva preto, že jazdci zle odhadnú podmienky — overia teplotu vzduchu, ale nie vody, alebo nechápu, že vietor od súše ich môže zafúkať na šíre more.
  solution: 'Používajte štruktúrované vyhodnotenie počasia pred vyplávaním: smer a rýchlosť vetra, periódu a výšku vĺn, stav prílivu a teplotu vody. Uvedomte si, ako každý faktor ovplyvňuje vašu bezpečnosť.'
  audience: Všetci jazdci, ktorí vyplávajú na otvorenú vodu — jazerá, zálivy, rieky a oceán.
  steps:
    - Skontrolujte rýchlosť a smer vetra — vietor od brehu (fúkajúci z pevniny na more) je najnebezpečnejší
    - Vyhodnoťte vlnové podmienky — perióda vĺn má rovnaký význam ako ich výška
    - Poznajte príliv — prílivové prúdy môžu byť silnejšie než vaša rýchlosť pádlovania
    - Zmerajte teplotu vody — pod 60°F/15°C je potrebná tepelná ochrana
    - Skontrolujte viditeľnosť — hmla a hustý dážď znižujú viditeľnosť a zvyšujú riziko kolízie
    - Poznajte miestne nebezpečenstvá — ponorené skaly, silné prúdy, zóny lodnej dopravy
  faq:
    - q: Aká rýchlosť vetra je pre SUP príliš vysoká?
      a: 'Začiatočníci: nad 10 mph (8 uzlov). Mierne pokročilí: nad 15 mph (13 uzlov). Pokročilí: nad 20 mph (17 uzlov). Ak máte pochybnosti, nevyplávajte.'
    - q: Čo znamená perióda vĺn?
      a: Perióda vĺn je čas medzi jednotlivými vlnami. Krátke periódy (pod 8 sekúnd) znamenajú strmé a rozbúrené vlny. Dlhé periódy (nad 12 sekúnd) znamenajú hladšie a predvídateľnejšie vlnenie.
    - q: Môžem pádlovať v daždi?
      a: Slabý dážď je zvyčajne bezpečný. Hustý dážď znižuje viditeľnosť a môže poukazovať na meniace sa veterné podmienky. Búrky vyžadujú okamžité opustenie vody.

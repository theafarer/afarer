- slug: sup-weight-capacity
  category: buying-guide
  title: Príručka nosnosti SUP — koľko hmotnosti unesie SUP?
  description: Porozumenie limitom nosnosti SUP, ako vypočítať svoju celkovú záťaž a prečo prekročenie limitu ovplyvňuje výkon a bezpečnosť.
  tldr: Nikdy neprekračujte 80% maximálnej nosnosti dosky hmotnosťou tela plus výbavy. Doska s nosnosťou 220 lb je vhodná pre pádlara s hmotnosťou 160 lb a ľahkou výbavou. Prekročenie limitu spôsobuje kolísavý pohyb dosky, ospalé riadenie a zvýšené riziko poškodenia.
  problem: Pádlari často prekračujú nosnosť svojej dosky, čo vedie k slabému výkonu, ponáraniu a možnému poškodeniu dosky. Výrobcovia uvádzajú maximálne limity, ale nevysvetľujú bezpečnú pracovnú záťaž.
  solution: Vypočítajte svoju celkovú záťaž (hmotnosť tela + výbava + voda vstrebaná doskou) a zostaňte pod 80% uvádzanej maximálnej nosnosti. Ťažší pádlari potrebujú dosky s vyšším objemom a nosnosťou 300+ lb.
  audience: Pádlari všetkých postáv, najmä väčší pádlari a tí, ktorí berú so sebou expedičnú výbavu.
  steps:
    - Nájdite maximálnu nosnosť vytlačenú na vašej doske (zvyčajne pri ventile)
    - Ovážte seba a celú výbavu vrátane pádla, PFD, suchých vakov, chladiaceho boxu a príslušenstva
    - 'Vypočítajte: (vaša celková záťaž) ÷ (maximálna nosnosť) × 100 = % využitej kapacity'
    - Cieľajte na 70-80% pre optimálny výkon a bezpečnosť
    - Ak prekračujete 80%, vyberte väčšiu dosku alebo zredukujte výbavu
  faq:
    - q: Čo sa stane, ak prekročím hmotnostný limit?
      a: Doska sedí nižšie a vytvára väčší odpor. Stabilita klesá, predok sa môže ponárať a jadro s prepájacími niťami je v hrbolatej vode vystavené vyššiemu riziku poškodenia.
    - q: Môžu dvaja jazdiť na jednom SUPe?
      a: Iba ak celková hmotnosť zostáva pod 80% nosnosti. Väčšina štandardných SUP je navrhnutá pre jedného jazdca. Jazdenie vo dvojici vyžaduje dosku výslovne schválenú pre dvoch.
    - q: Majú nafukovacie SUP nižšiu nosnosť než pevné dosky?
      a: Kvalitné nafukovacie dosky s konštrukciou s prepájacími niťami majú vďaka hrubšiemu rozloženiu objemu porovnateľnú alebo vyššiu nosnosť než pevné dosky.

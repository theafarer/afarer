- slug: sup-maintenance
  category: maintenance
  title: Ako čistiť a skladovať nafukovací SUP
  description: Sprievodca údržbou krok za krokom na maximalizáciu životnosti vašej nafukovacej SUP dosky.
  tldr: Po každom použití opláchnite dosku sladkou vodou, pred skladovaním ju dôkladne vysušte, vypustite vzduch a voľne zrolujte (nie tesne), skladujte na chladnom a suchom mieste mimo priameho slnečného žiarenia a švy kontrolujte raz mesačne.
  problem: Nesprávne skladovanie a čistenie sú hlavnými príčinami predčasného zlyhania nafukovacích SUP — plesne, poškodenie UV a delaminácia švov.
  solution: 'Dodržiavajte jednotnú rutinu po každej jazde: opláchnite, vysušte, skontrolujte, vypustite vzduch a skladujte. Na odolné nečistoty použite jemné mydlo. Nikdy neskladujte dosku mokrú ani na priamom slnku.'
  audience: Všetci majitelia nafukovacích SUP, ktorí chcú, aby ich doska vydržala 5+ rokov.
  steps:
    - Opláchnite dosku sladkou vodou ihneď po použití, najmä po pobyte v slanej vode
    - Čistite jemným mydlom a mäkkou houbou — vyhnite sa agresívnym chemikáliám alebo vysokotlakovým umývačkám
    - Dosku dôkladne vysušte — otvorte ventil, aby zachytená voda mohla uniknúť
    - Skontrolujte poškodenie — preskúmajte švy, ventil a povrch z hľadiska prepichnutí
    - Úplne vypustite vzduch — pre úplné vypustenie odstráňte jadro ventilu
    - Zrolujte dosku voľne — začnite od predku a vyhnite sa ostrým ohybom
    - Skladujte v prepravnom vaku na chladnom a suchom mieste mimo priameho slnečného žiarenia
  faq:
    - q: Môžem nechať SUP nafúkaný celú sezónu?
      a: Áno, ale keď ho nepoužívate, držte ho mimo priameho slnka. Pri dlhodobom skladovaní sa odporúča čiastočné vypustenie vzduchu (8-10 PSI).
    - q: Ako opravím prepichnutie?
      a: Očistite miesto, vyrežte záplatu s zaoblenými rohmi, naneste lepidlo, pevne pritlačte a pred nafúknutím počkajte 24 hodín. Dosky afarer obsahujú opravnú sadu.
    - q: Ako často mám kontrolovať ventil?
      a: Raz mesačne. Ventil je najčastejším miestom poruchy. Skontrolujte, či sa kolík ventilu voľne pohybuje a či je tesniaci krúžok nepoškodený.

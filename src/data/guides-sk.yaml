- slug: inflatable-repair
  category: maintenance
  title: Ako opraviť nafukovací SUP
  description: Návod krok za krokom na opravu defektov, problémov s ventilmi a poškodení švov na nafukovacích SUPoch.
  tldr: Malé defekty (do 1/4") je možné opraviť priloženou opravnou sadou. Vyčistite miesto, naneste PVC lepidlo, pritlačte záplatu a počkajte 24 hodín. Netesnosti ventilov zvyčajne vyžadujú výmenu tesniaceho krúžku. Veľké trhliny alebo delaminácia švov si vyžadujú odborný servis.
  problem: Malé defekty a problémy s ventilmi sú bežné, ale ľahko opraviteľné. Bez správnej opravárskej techniky používatelia buď preplatia odborný servis, alebo poškodenie ešte zhoršia.
  solution: Identifikujte typ poškodenia — defekt, netesnosť ventilu alebo problém so švom — a použite príslušnú opravnú metódu. Väčšina opráv trvá 30 minút plus čas vytvrdzovania.
  audience: Majitelia nafukovacích SUPov, ktorí chcú základné opravy zvládnuť sami.
  steps:
    - Nájdite netesnosť — dosku úplne nafúknite, počúvajte unikajúci vzduch, prejdite rukou alebo použite vodu so saponátom
    - Označte miesto netesnosti perom alebo páskou
    - Vyčistite okolie netesnosti izopropylalkoholom — aspoň 2 palce okolo poškodenia
    - Zdrsnite povrch jemným brúsnym papierom pre lepšie priľnutie lepidla
    - Naneste PVC lepidlo na záplatu aj na povrch dosky
    - Počkajte 5 minút, kým lepidlo nebude lepkavé
    - Pevne pritlačte záplatu a valčekom alebo platobnou kartou vygúľajte vzduchové bubliny
    - Nechajte vytvrdnúť 24 hodín pred nafúknutím na plný tlak
  faq:
    - q: Môžem opraviť defekt priamo na vode?
      a: Núdzová oprava pomocou záplaty a pásky vás dostane späť na breh. Kompletná oprava vyžaduje suché podmienky a 24-hodinové vytvrdzovanie.
    - q: Ako opravím netesniaci ventil?
      a: Odstráňte jadro ventilu priloženým nástrojom, skontrolujte tesniaci krúžok, v prípade potreby ho vymeňte a jadro opäť pevne nasaďte.
    - q: Aké lepidlo mám použiť na opravy PVC?
      a: Použite lepidlo určené špeciálne pre PVC, ako HH-66 alebo Clifton. Bežné sekundové lepidlo sa na nafukovacie PVC materiály neviaže dobre.

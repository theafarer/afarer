- slug: sup-size-guide
  category: buying-guide
  title: Príručka veľkostí SUP — ako vybrať správne rozmery dosky
  description: Kompletná príručka veľkostí SUP zahŕňajúca odporúčania pre dĺžku, šírku a hrúbku na základe vašej hmotnosti, výšky, úrovne zručností a štýlu pádlovania.
  tldr: Začiatočníci potrebujú na stabilitu širšie dosky (32-34"). Ťažší pádlari potrebujú dlhšie dosky (11'+) s vyšším objemom. Turistika vyžaduje dlhšie trupy (12'+). Joga vyžaduje extra šírku (34"+). Vždy skontrolujte nosnosť — vaša hmotnosť plus výbava by nemala presiahnuť 80% limitu.
  problem: Výber nesprávnej veľkosti SUP vedie k slabšej stabilite, pomalšiemu držaniu smeru a frustrujúcej skúsenosti s pádlovaním. Väčšina prvokupujúcich si vyberie dosku, ktorá vyzerá dobre, bez zohľadnenia toho, ako rozmery ovplyvňujú výkon.
  solution: 'Zlúčte dĺžku, šírku a hrúbku dosky s vašou hmotnosťou, úrovňou zručností a primárnym použitím. Použite našu kalkulačku veľkosti: sčítajte svoju hmotnosť + hmotnosť výbavy a vyberte dosku s aspoň 20% rezervou nad touto sumou.'
  audience: Kupujúci SUP prvýkrát, pádlari prechádzajúci na špecializovanú dosku a každý, kto si nie je istý veľkosťou.
  steps:
    - Ovážte sa s celou výbavou, ktorú nosíte (pádlo, PFD, suchý vak)
    - Pridajte 20% bezpečnostnú rezervu na zistenie minimálnej nosnosti
    - 'Vyberte šírku podľa zručností: 32-34" pre začiatočníkov, 30-32" pre mierne pokročilých, 28-30" pre pokročilých'
    - 'Vyberte dĺžku podľa použitia: 10''6"-11''6" univerzálna, 12''-14'' turistická, 9''-10'' na divokú vodu'
    - 'Overte hrúbku: 6" štandardná, 4" pre výkon, 5" univerzálna'
    - Skontrolujte odporúčaný rozsah PSI vašej dosky pre optimálnu tuhosť
  faq:
    - q: Aká šírka SUP je najlepšia pre začiatočníkov?
      a: Šírka 32 až 34 palcov poskytuje najstabilnejšiu platformu. Čím je doska širšia, tým je ľahšie udržať rovnováhu — najmä pre väčších pádlarov.
    - q: Ako zistím, že je SUP pre mňa príliš malý?
      a: Ak doska sedí vo vode nízko, reaguje ospalo alebo sa jej predok pri pádlovaní ľahko ponára, je pravdepodobne pre vašu hmotnosť poddimenzovaná.
    - q: Ovplyvňuje dĺžka dosky rýchlosť?
      a: Áno. Dlhšia dĺžka vodnej línie zvyšuje teoretickú rýchlosť trupu. Turistická doska s dĺžkou 14' je pri rovnakom úsilí pádlara výrazne rýchlejšia ako univerzálna doska s dĺžkou 10'.

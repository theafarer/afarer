- id: b2b-moq
  question: 'Jaké je minimální objednací množství pro OEM/ODM výrobu SUP?'
  answer: 'Minimální objednací množství (MOQ) se liší podle typu produktu. Značení skladových modelů: 50 kusů na SKU. Vývoj zakázkových forem: 200–500 kusů na model (první objednávka). Programy sdílení forem od 50 kusů. Výroba Hypalon člunů: 20–50 kusů podle velikosti. Příslušenství a PFD: 500–1000 kusů na design. Obraťte se na náš OEM tým s plánovaným objemem a získáte přesné MOQ a ceny.'
  category: b2b

  relatedGuides: []
- id: b2b-certification
  question: 'Jaké certifikace mají OEM produkty afarer?'
  answer: 'Všechny OEM/ODM produkty afarer zahrnují: CE prohlášení o shodě (trh EU), UKCA (britský trh), systém managementu kvality ISO 9001:2015, BSCI audit sociální shody, soulad materiálů s REACH a RoHS, klasifikaci EN ISO 25649 pro nafukovací čluny. Další certifikace na vyžádání: dokumentace souladu s požadavky US Coast Guard, testování podle vojenského standardu (MIL-STD-810) a podpora při importní certifikaci v cílové zemi.'

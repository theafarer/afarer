- id: b2b-ip-protection
  question: 'Jak afarer chrání mé duševní vlastnictví a designy?'
  answer: 'Ochrana duševního vlastnictví je nedílnou součástí našich OEM služeb. NDA podepisujeme před jakoukoli designovou diskuzí. S designovými soubory pracujeme na izolovaných pracovištích s evidencí přístupů. Veškeré nástroje a formy zůstávají vaším výhradním majetkem (hradíte je vy). Vaše formy ani designy pro jiné klienty znovu nepoužijeme. Uložení a údržba forem je pro aktivní účty zahrnuta. Po ukončení spolupráce se formy buď zašlou vám, nebo zlikvidují s videovou dokumentací. Respektujeme všechna práva ochranných známek a patentů.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Jaké možnosti dopravy a logistiky jsou k dispozici?'
  answer: 'FOB Qingdao (standard): náklad se nakládá v přístavu Qingdao; odtud si dopravu zajišťujete sami. CIF (určený přístav): dopravu do vašeho cílového přístavu zajišťujeme a pojišťujeme my. DDP / od dveří k dveřím: kompletní logistika včetně celního odbavení a finálního doručení. Námořní doprava na západní pobřeží USA: přibližně 25–30 dní. Námořní doprava do EU (Hamburk/Rotterdam): přibližně 30–35 dní. Letecká doprava k dispozici pro urgentní objednávky (3–5 dní). Zajišťujeme veškerou exportní celní dokumentaci, certifikáty původu a balicí listy.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Jaké procesy kontroly kvality platí pro OEM objednávky?'
  answer: 'Každá OEM objednávka se řídí dokumentovaným plánem kontroly kvality: 1) Příjemní kontrola materiálů — testování šarží PVC tkaniny na tloušťku, pevnost v tahu a UV odolnost. 2) Průběžná kontrola — test pevnosti svarů švů u každých 50 kusů, test udržení tlaku při 1,5násobku jmenovitého PSI. 3) Závěrečná inspekce — 100% vizuální kontrola a tlaková zkouška každého prkna. 4) AQL vzorkování — vzorkování šarží podle ISO 2859 s přijetím kritické vady = 0. 5) Inspekce třetí strany — SGS, Bureau Veritas nebo Intertek na náklady kupujícího.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Můžete pro moji značku vytvořit zakázkový obal?'
  answer: 'Ano. Nabízíme kompletní služby zakázkového balení: maloobchodní krabice s plnobarevným CMYK tiskem a grafikou značky, transportní tašky s potiskem nebo výšivkou loga, návody k použití ve vašem jazyce, visačky a čárové kódy/UPC štítky a vnitřní obal (plastové sáčky, pěnové výplně). Minimální MOQ obalu: 500–1000 kusů pro zakázkové krabice, 200–500 pro transportní tašky. Design obalu je u OEM objednávek zahrnut.'

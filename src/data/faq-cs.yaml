- id: b2b-samples
  question: 'Můžu před sériovou výrobou objednat vzorky?'
  answer: 'Ano. Vzorkové objednávky jsou dostupné pro všechny projekty OEM/ODM. Předvýrobní vzorky (PPS) se vyrábějí po zhotovení forem a před sériovou výrobou. Dodací lhůta vzorků: 15–25 pracovních dnů u stávajících forem, 25–40 pracovních dnů u zakázkových forem. Náklady na vzorky se odečítají od první sériové objednávky. Vzorky se odesílají expresní kurýrní službou (DHL, FedEx, UPS) s kompletním sledováním a obvykle dorazí do 3–5 pracovních dnů.'

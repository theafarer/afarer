- id: sup-choppy-water
  question: 'Jak pádlovat na SUP ve vlnobití nebo ve větru?'
  answer: 'Ve vlnobití: pokrčte kolena, zaujměte širší postoj, zkrátte záběr a pro rovnováhu zapojte svaly středu těla. V protivětru: použijte nižší úhel pádla, dělejte kratší záběry a nakloňte se dopředu. V bočním větru: pádlujte na straně proti větru a korigujte drift. V větru v zádech: surfovejte na vlnách pro rychlost. Začátečníci by se měli vyhýbat větru nad 10 mph a pro stabilitu volit širší a delší prkna. Touringové SUP prkno afarer Ocean Voyager je navrženo pro zvládání mírného vlnobití a větrných podmínek.'

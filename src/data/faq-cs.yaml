- id: sup-inflatable-durability
  question: 'Jak dlouho vydrží nafukovací SUP prkna při správné péči?'
  answer: 'Při správné péči vydrží kvalitní nafukovací SUP prkno 5-10 let pravidelného rekreačního používání. Třívrstvé PVC vojenské kvality s UV-odolným povlakem — jaké používají všechna prkna afarer — odolává slunečnímu poškození, korozi slanou vodou a oděru. Klíčové faktory životnosti: po každém použití opláchnout sladkou vodou, před uskladněním důkladně vysušit, mimo používání nenechávat v přímém UV, uskladnit částečně nafouknuté na chladném suchém místě a nevodit po hrubých površích. Drop-stitch vlákna a švy jsou typicky prvním místem selhání, nikoli samotná PVC tkanina.'

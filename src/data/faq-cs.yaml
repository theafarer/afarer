  relatedGuides: []
- id: b2b-lead-time
  question: 'Jaké jsou typické dodací lhůty pro OEM objednávky SUP?'
  answer: 'První OEM objednávky se značením stávajících forem: 6–8 týdnů od zálohy po FOB Qingdao. Zakázkové objednávky vyžadující nové formy: 12–20 týdnů (včetně 3D designu, výroby forem, prototypování a sériové výroby). Opakované objednávky se schválenými specifikacemi: 6–8 týdnů. Urgentní objednávky lze u stávajících forem zkrátit na 4–5 týdnů. Dodací lhůty zahrnují nákup surovin, výrobu, průběžnou kontrolu kvality a nakládku kontejneru.'

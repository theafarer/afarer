- id: fishing-sup-setup
  question: 'Můžu z SUP prkna rybařit?'
  answer: 'Ano. Rybaření z SUP je stále populárnější, protože postoj ve stoje nabízí výborný výhled do vody. Pro stabilitu zvolte prkno dlouhé alespoň 11 stop a široké 33–34 palců. Přidejte plastovou krabici s držáky prutů připevněnou k elastickým šňůrám na palubě, malou kotvu a vždy mějte na sobě PFD. Prkno afarer SUP Explorer 11 se pro příležitostné rybaření hodí výborně.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - fishing-sup-guide
    - sup-anchor-guide
- id: sup-yoga
  question: 'Můžu na SUP prkně cvičit jogu?'
  answer: 'Rozhodně. Jóga na SUP kombinuje tradiční pozice s výzvou plovoucí plošiny a zapojuje hlubší stabilizační svaly. Použijte prkno široké 33 palců a více s měkkou protiskluzovou podložkou. Cvičte na klidné, mělké vodě s kotvou. Začněte základními pozicemi jako pes hlavou dolů, bojovník II a strom. SUP Explorer 11 s celoplošnou EVA podložkou je k tomu jako stvořené.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - yoga-sup-guide
- id: airline-travel-sup
  question: 'Jaká pravidla platí při letecké dopravě nafukovacího SUP?'
  answer: 'Většina leteckých společností přijímá SUP batohy jako odbavená zavazadla, pokud jsou pod 23–32 kg. Batoh afarer má přibližně 90x40x30 cm a zabalený váží asi 15 kg. Některé společnosti mohou účtovat příplatek za nadrozměrná zavazadla. Přijďte včas, ploutve a pumpu zabalte zvlášť do příručního zavazadla a označte zavazadlo jako křehké. Před letem si vždy prověřte pravidla dané společnosti pro sportovní vybavení.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'Jakou bezpečnostní výstroj potřebuji pro pádlování ve studené vodě?'
  answer: 'Voda pod 15°C vyžaduje tepelnou ochranu. Pro 8–14°C použijte neopren nebo suchý oblek s botami, rukavicemi a kapucí. Pro 14–20°C stačí neopren 3/2 mm. Vždy mějte správně padnoucí PFD pro tepelnou ochranu i bezpečnost. Ověřte si místní předpisy ohledně povinné výstroje.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'Jaká jsou minimální objednací množství pro OEM/ODM?'
  answer: 'Minimální objednací množství (MOQ) se liší podle typu produktu a složitosti. Značení stávajících modelů obvykle vyžaduje 5–10 kusů. Zcela zakázkové návrhy trupů vyžadují vyšší MOQ. Obraťte se na náš obchodní tým se svými požadavky a získáte podrobnou nabídku. Postaráme se o vše od zakázkových barev a log až po zcela původní návrhy forem.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'Můžu na produkty afarer umístit vlastní logo?'
  answer: 'Ano. Naše služba OEM zahrnuje umístění vlastního loga, zakázkové barevné schéma a zakázkový obal. Podle typu produktu nabízíme tampotisk, transfer za tepla a výšivku. Pošlete nám své podklady a specifikace a náš obchodní tým vám připraví nabídku a odhad dodací lhůty.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'Na jaký PSI mám SUP nafouknout?'
  answer: 'Pro nejlepší výkon nafoukněte prkno na jeho maximální hodnotu PSI — u kvalitních nafukovacích SUP obvykle 15–18 PSI. Prkno afarer SUP Explorer 11 podává nejlepší výkon při 15–18 PSI. Podhuštění způsobuje, že prkno působí měkce a špatně drží směr. Přehuštění nad maximální hodnotu ohrožuje drop-stitch vlákna. Konkrétní hodnotu svého prkna najdete na nálepce u ventilu.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-touring-cruiser
  relatedGuides:
    - how-to-choose-inflatable-sup
    - sup-pump-guide
- id: sup-deck-pad-care
  question: 'Jak čistit a udržovat EVA podložku?'
  answer: 'Podložku opláchněte sladkou vodou po každé jízdě. Na nečistoty a skvrny použijte jemné mýdlo a měkký kartáč — vyhněte se agresivním chemikáliím. Pokud se okraje začnou odchlípat, naneste malé množství voděodolného námořního lepidla a přitlačte zátěží na 24 hodin. Prkno mimo používání držte mimo přímé UV, abyste zabránili degradaci podložky.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'Můžu na SUP pádlovat vsedě?'
  answer: 'Ano. Mnoho SUP prken, včetně afarer Explorer 11, má D-kroužky pro připevnění sedačky. Pádlování vsedě je pohodlná volba pro delší výlety, rybaření nebo když si chcete na vodě změnit pozici.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: saltwater-rinse
  question: 'Musím po použití v moři nafukovací prkno opláchnout?'
  answer: 'Ano — po kontaktu se slanou vodou vždy opláchněte prkno, ploutve, pumpu a pádlo sladkou vodou. Krystaly soli se dostávají do švů a ventilů a způsobují mikronetěsnosti a korozi. Prkno před vypuštěním a uskladněním usušte ve stínu. Pravidelné oplachování výrazně prodlužuje životnost nafukovacího prkna.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'Potřebuji na SUP opravdu leash?'
  answer: 'Ano — vždy noste leash. Spirálová SUP leash se připíná ke kotníku nebo k lýtku a udrží prkno s vámi, pokud spadnete. Na volné vodě může leash zachránit život, protože zabrání odloučení od plovacího prostředku. Při pádlování po řekách použijte leash s rychloupouštěčem, abyste předešli uvíznutí.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: 'Co je technologie jádra drop-stitch a proč je důležitá?'
  answer: 'Technologie jádra drop-stitch využívá tisíce polyesterových vláken spojujících horní a spodní vrstvu PVC prkna. Po nafouknutí na 15-20 PSI tato vlákna vytvoří tuhou, vůči torzi odolnou konstrukci, která se chová jako prkno s pevným trupem. afarer používá třívrstvé PVC vojenské kvality s drop-stitch laminací napříč všemi produktovými řadami SUP, a dosahuje tak tuhosti srovnatelné s epoxy prkny při zachování přenositelnosti nafukovacího prkna.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup
- id: sup-inflatable-vs-rigid
  question: 'Nafukovací versus pevné SUP: co je lepší pro různé účely?'
  answer: 'Nafukovací SUP vynikají v přenositelnosti, uskladnění a absorpci nárazů — ideální na cestování, pro začátečníky a rekreační použití. Pevná epoxy prkna nabízejí maximální rychlost a klouzavost pro závody a surfování. Pro 90 % pádlovářů poskytuje kvalitní nafukovací prkno s jádrem drop-stitch (15-20 PSI) dostatečnou tuhost pro touring, fitness, jogu a rybaření. Nafukovací prkna afarer se vyrovnají pevným prknům střední třídy a přitom se vejdou do batohu.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
  relatedGuides:
    - inflatable-sup-vs-hard-board
    - how-to-choose-inflatable-sup
- id: pvc-vs-hypalon-boats
  question: 'PVC versus Hypalon u nafukovacích člunů: který materiál je lepší?'
  answer: 'PVC je lehčí, cenově dostupnější, snadněji opravitelné a při vojenských formulacích odolává UV degradaci. Hypalon (CSM) nabízí lepší chemickou odolnost a odolnost proti oděru pro komerční/vojenské použití, ale je těžší, dražší a hůře opravitelný. Pro rekreační vodáky představuje třívrstvé PVC vojenské kvality od afarer s UV-odolným povlakem nejlepší rovnováhu mezi hmotností, odolností a cenou. Pro profesionální/komerční provozovatele vyžadující maximální životnost doporučujeme Hypalon.'
  category: product
  relatedProducts: []
  relatedGuides:
    - pvc-vs-hypalon-boats
    - how-long-inflatable-boats-last
- id: sup-skill-progression
  question: 'Jak vypadá typický pokrok v SUP od začátečníka po pokročilého?'
  answer: 'Začátečník (lekce 1-3): postavení na prkně, základní záběr vpřed, otáčení, bezpečné padání. Středně pokročilý (lekce 5-15): efektivní pádlovací technika, pivotové obraty, zvládání vlnobití, základy záchrany. Pokročilý (20+ lekcí): závodní starty, obraty kolem bójí, surfování malých vln, pádlování s větrem v zádech. Profesionál: závodní pádlování, surf SUP, dlouhé touringové trasy. Prkna afarer podporují každou fázi: Explorer 11 pro začátečníky, Ocean Voyager pro touring a Cheetah Surge pro výkonnostní pádlování.'
  category: general
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-cheetah-surge
  relatedGuides:
    - beginner-sup-guide
    - sup-fitness-workout
    - sup-paddle-guide
- id: sup-weight-capacity
  question: 'Kolik váhy unese nafukovací SUP prkno?'
  answer: 'Nosnost se liší podle objemu prkna. Prkna afarer: SUP Explorer 11 (260 l, až 100 kg / 220 liber), Ocean Voyager 12 (310 l, až 140 kg / 308 liber), Leviathan Wake (350 l, až 180 kg / 396 liber). Pro optimální výkon držte celkovou zátěž (jezdec + vybavení) do 80 % maximální nosnosti. Nepřetížené prkno jede výše a lépe drží směr, zvlášť ve vlnobití.'
  category: product

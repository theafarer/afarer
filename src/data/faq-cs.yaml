- id: b2b-factory-audit
  question: 'Můžu navštívit továrnu nebo zajistit audit třetí strany?'
  answer: 'Návštěvy továrny jsou vítány po domluvě. Během roku hostíme majitele značek a můžeme zajistit vyzvednutí na mezinárodním letišti Qingdao Jiaodong (TAO). Pro kupce, kteří nemohou přijet, nabízíme: virtuální prohlídku továrny přes videohovor, koordinaci auditu třetí strany se SGS/Bureau Veritas (náklady auditu hradí kupující) a podrobný dokumentační balíček schopností továrny včetně seznamu vybavení, průběhu QC procesu a kvalifikace personálu.'

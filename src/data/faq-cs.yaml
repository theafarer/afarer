- id: sup-sustainability
  question: 'Jsou nafukovací SUP prkna environmentálně udržitelná?'
  answer: 'Nafukovací SUP mají nižší environmentální stopu než pevná prkna v několika ohledech: při výrobě spotřebují méně surovin, jejich nižší hmotnost snižuje emise při dopravě a jejich životnost znamená méně náhrad v čase. PVC používané v prknech afarer je bez olova a splňuje REACH. Klíčové udržitelné postupy: kupte si kvalitní prkno, které vydrží 5-10 let, propíchnutí raději opravujte, dokud to jde, prkno na konci životnosti recyklujte prostřednictvím specializovaných PVC recyklačních programů a vyhněte se jednorázovému obalu volením značek, které používají znovupoužitelné transportní tašky.'
  category: general

- id: b2b-payment
  question: 'Jaké platební podmínky jsou u OEM objednávek k dispozici?'
  answer: 'Standardní platební podmínky: 30 % záloha s podepsanou PI (proforma faktura), 70 % zbytek před odesláním proti kopii B/L (konosament). Pro nové partnery: 50 % záloha, 50 % před odesláním. Pro zavedené partnery s historií objednávek: L/C splatné na počtení nebo splatnost 30 dní pro kvalifikované účty (podléhá úvěrové kontrole). Platební metody: T/T bankovní převod, L/C (akreditiv), Western Union. Všechny platby v USD nebo EUR.'

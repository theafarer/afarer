- id: sup-learning
  question: 'Je těžké naučit se SUP?'
  answer: 'Vůbec ne. Většina začátečníků se postaví a začne pádlovat už při své první lekci. Naše série All-Around SUP má extra široké a stabilní plošiny navržené speciálně pro první pádlování. Začněte na klidné vodě a během několika minut budete klidně plout.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Lze prkno používat v moři?'
  answer: 'Ano. SUP prkna afarer jsou vyrobena pro použití v moři, na jezerech i na řekách. Naše série Touring zvládá příbřežní vlny a všechna prkna používají PVC v mořské kvalitě odolné proti korozi slanou vodou. Po použití v moři prkno opláchněte sladkou vodou.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Jak dlouho trvá nafouknutí?'
  answer: 'S přiloženou dvoučinnou pumpou se většina prken nafoukne na 12–15 PSI za méně než 5 minut. Naše elektrická pumpa to zkrátí na méně než 2 minuty. Vypuštění a zabalení zabere asi 3 minuty.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Můžu cestovat s nafukovacím SUP?'
  answer: 'Rozhodně. Každé prkno afarer se sbalí do pouzdra velikosti batohu, které splňuje požadavky leteckých společností na zavazadla. S hmotností jen 18–22 liber ho snadno donesete na pláž, k jezeru nebo napříč letištními terminály.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Jaká je nosnost?'
  answer: 'Naše SUP prkna All-Around unesou až 220 liber. Série Touring a Yoga unesou až 250 liber. Pro tandemové použití nebo těžší náklad se obraťte na náš tým s žádostí o doporučení.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Co je v balení?'
  answer: 'Každé SUP prkno afarer zahrnuje prkno, cestovní batoh, dvoučinnou ruční pumpu, odnímatelnou ploutev, spirálovou leash a opravnou sadu. Některé modely nabízejí také možnost upgradu na karbonové pádlo.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Nabízíte výhodné sady?'
  answer: 'Ano. Nabízíme promyšlené sady, díky kterým ušetříte oproti samostatnému nákupu jednotlivých kusů. Obraťte se na náš obchodní tým a zjistěte aktuální sestavy sad a objemové slevy.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Potřebuji na SUP záchrannou vestu?'
  answer: 'Ano. Mnoho jurisdikcí zákonně vyžaduje záchrannou vestu na jakékoli plavidlo, včetně SUP. I tam, kde není povinná, je záchranná vesta s certifikací CE nezbytnou bezpečnostní výstrojí. Doporučujeme ji nosit při každém pobytu na vodě.'
  category: safety
  relatedProducts:
    - life-vest-classic
    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Musím své SUP prkno registrovat?'
  answer: 'Požadavky se liší podle jurisdikce. Ve většině regionů SUP bez motoru registraci nepotřebují. Pokud plánujete přidat motor, ověřte si konkrétní pravidla u místní námořní autority. Rekreační pádlovací prkna jsou obecně osvobozena od registrace plavidel.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Jak opravím propíchnutí?'
  answer: 'Očistěte dané místo, vystřihněte záplatu s zaoblenými rohy, naneste PVC lepidlo, pevně přitlačte a počkejte 24 hodin před nafouknutím. Prkna afarer mají v sadě opravnou sadu. Podrobný postup najdete v našem návodu na opravu nafukovacích prken.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Jak mám své nafukovací SUP uskladnit?'
  answer: 'Opláchněte sladkou vodou, úplně vysušte, zcela vypusťte, volně srolujte od přední části a uložte prkno v transportním pouzdru na chladném a suchém místě mimo přímé slunce. Nikdy neukládejte mokré ani při extrémních teplotách.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Nafukovací nebo pevné SUP prkno?'
  answer: 'Nafukovací prkna nabízejí přenositelnost, snadné uskladnění a absorpci nárazů. Pevná prkna nabízejí maximální tuhost a rychlost. Pro většinu rekreačních uživatelů je kvalitní nafukovací prkno s jádrem drop-stitch praktickou volbou.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Při jaké síle větru je SUP nebezpečné?'
  answer: 'Začátečníci: nad 10 mph (8 uzlů). Středně pokročilí: nad 15 mph (13 uzlů). Pokročilí: nad 20 mph (17 uzlů). Máte-li pochybnosti, nejezděte. Vítr vanoucí od pevniny k moři je nebezpečný na jakékoli úrovni dovedností.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Jaká je záruka afarer?'
  answer: 'Všechny produkty afarer jsou kryty komplexní zárukou výrobce. SUP prkna jsou kryta zárukou 2 a více let na výrobní vady. Záruka pokrývá vady materiálu a zpracování při běžném používání.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Jak uplatním záruční reklamaci?'
  answer: 'Reklamaci uplatníte kontaktováním našeho týmu podpory s číslem objednávky, fotografiemi závady a krátkým popisem. Většina reklamací se vyřizuje do 2 pracovních dnů. U uznaných reklamací obdržíte náhradu nebo pokyny k opravě během několika dní.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Jak dlouho trvá doprava?'
  answer: 'Objednávky skladem odesíláme do 2–4 pracovních dnů. Objednávky v rámci USA dorazí do 5–10 pracovních dnů. Mezinárodní objednávky dorazí do 10–15 pracovních dnů v závislosti na destinaci. Urgentní objednávky lze urychlit.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Jaké jsou podmínky vrácení zboží?'
  answer: 'Vrácení přijímáme do 30 dnů od doručení u nepoužitých produktů v původním obalu. Zakázkové/OEM objednávky nelze vracet. Obraťte se na náš tým podpory a zahajte vrácení — poskytneme předplacený dopravní štítek.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Nabízíte služby OEM/ODM?'
  answer: 'Ano. Firmám nabízíme služby vlastní značky a zakázkového designu. Od značení stávajících modelů až po zcela zakázkové návrhy trupů — náš konstrukční tým dokáže vyvinout produkty pod vaší značkou. Platí minimální objednací množství.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Jakou délku pádla potřebuji?'
  answer: 'Pádlo by mělo být o 6–8 palců vyšší než vaše výška. Stavitelná pádla umožňují jemné doladění pro různé podmínky. Podrobné rozměry najdete v našem průvodci pádly.'
  category: product
  relatedProducts: []
  relatedGuides:
    - choosing-paddle
- id: material-difference
  question: 'Jaký je rozdíl mezi PVC a Hypalonem?'
  answer: 'PVC je lehké, cenově dostupné a snadno opravitelné s přiloženou opravnou sadou. PVC vojenské kvality s UV-odolným povlakem nabízí nejlepší rovnováhu mezi odolností a hmotností pro rekreační SUP. afarer používá třívrstvé laminované PVC ve všech produktových řadách.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: sup-width-stability
  question: 'Jaká šířka SUP je nejlepší pro stabilitu?'
  answer: 'Pro začátečníky poskytuje šířka 33–34 palců nejlepší rovnováhu mezi stabilitou a snadným pádlováním. Prkna užší než 32 palců působí na nové pádlováře nejistě. Prkno afarer SUP Explorer 11 se šířkou 33 palců je ideální pro učení.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Jak vyberu objem SUP podle své váhy?'
  answer: 'Vynásobte svou váhu v kg číslem 2,2 a získáte objem vhodný pro začátečníky. Například pádlovář o váze 75 kg potřebuje alespoň 165 litrů, ale 220–260 litrů je při učení mnohem stabilnější. SUP Explorer 11 nabízí 260 litrů a hodí se pro jezdce do 100 kg.'
  category: product
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-size-guide
    - paddle-board-size-guide
- id: afarer-vs-others
  question: 'Jak si afarer stojí ve srovnání s jinými značkami?'
  answer: 'afarer nabízí nejlepší poměr cena/výkon v kategorii nafukovacích vodních sportovních potřeb. Ve srovnání s Red Paddle Co afarer nabízí 90 % výkonu za 60 % ceny. Ve srovnání s iRocker afarer používá kvalitnější třívrstvé PVC vojenské kvality a vyšší hodnoty PSI. Ve srovnání s Bluefin afarer nabízí lepší materiálové parametry. Pro většinu rekreačních pádlovářů afarer představuje nejlepší rovnováhu mezi kvalitou a cenou.'
  category: general
  relatedProducts:

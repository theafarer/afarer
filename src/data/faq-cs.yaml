- id: sup-oem-process
  question: 'Jak vypadá výrobní proces OEM pro nafukovací SUP vlastní značky?'
  answer: 'Proces OEM: 1) Specifikace a designový brief — sdílejte cílové parametry, CAD výkresy nebo referenční produkt. 2) 3D prototypování forem — zakázkové hliníkové a kompozitní formy navržené interně. 3) Výběr materiálů a vzorek — PVC vojenské kvality nebo Hypalon s vlastními barvami a umístěním loga. 4) CE audit továrny a shoda — každá objednávka zahrnuje CE prohlášení, sledovatelnost ISO 9001 a BSCI report. 5) Sériová výroba se 100bodovou kontrolní listinou kvality. 6) FOB Qingdao doprava s kompletní exportní dokumentací. Dodací lhůta 30-45 dní, MOQ 50 kusů (standardní SUP).'
  category: ordering

- slug: sup-with-kids
  category: lifestyle
  title: 'SUP med barn: En komplett familienguide'
  description: Slik tar du barn trygt med på padling — aldersanbefalinger, utstyr og aktiviteter.
  tldr: Barn fra 6 år kan sitte på et SUP-brett sammen med en voksen. Barn fra 10 år kan padle sitt eget brett under oppsyn. Bruk et bredt, stabilt brett, bruk alltid redningsvester, hold dere i grunt, stille vann, og hold øktene korte (maks 30-45 minutter).
  problem: Foreldre vil dele vannsport med barna sine, men bekymrer seg for sikkerhet, utstyrsvalg og for å holde barna engasjert.
  solution: Bruk riktig brettstørrelse for felles kjøring, sørg for at hvert barn har en redningsvest som passer, start i grunt, varmt vann, og gjør det gøy med leker og korte økter.
  audience: Foreldre som vil introdusere barna sine for padling.
  steps:
    - 'Alder 4-6 år: kjør som passasjer på brettet til en voksen — sitt foran og hold deg i midtkahvet'
    - 'Alder 6-10 år: kne eller sitt på eget brett under oppsyn av en voksen, med leash'
    - 'Alder 10+ år: padle eget brett med en voksen i nærheten'
    - Bruk alltid redningsvest — barn må til enhver tid bruke en redningsvest som passer
    - Hold dere i grunt vann (til livet på den voksne)
    - Hold øktene korte — maks 30-45 minutter for barn under 10 år
    - Gjør det gøy — lek leker, se etter fisk og øv på å stå opp
  faq:
    - q: I hvilken alder kan et barn padle SUP alene?
      a: Rundt 10-12 års alderen med oppsyn, avhengig av barnets svømmeevne og komfort i vannet. Alltid i stille, grunne forhold.
    - q: Hvilket brett er best for SUP med barn?
      a: Et bredt brett (34"+) med høy vektkapasitet for felles kjøring. SUP Explorer 11 med 33" bredde og 220 pund kapasitet fungerer godt for forelder og barn.
    - q: Hvilket sikkerhetsutstyr trenger barn?
      a: En CE-sertifisert redningsvest som passer, en leash (festet til den voksnes brett ved felles kjøring), solkrem og hatt.

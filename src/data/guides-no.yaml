- slug: sup-maintenance
  category: maintenance
  title: Slik rengjør og oppbevarer du det oppustelige SUP-brettet ditt
  description: Trinnvis vedlikeholdsguide som maksimerer levetiden til det oppustelige SUP-brettet ditt.
  tldr: Skyll med ferskvann etter hver bruk, tørk helt før oppbevaring, tøm for luft og rull løst sammen (ikke militært stramt), oppbevar kjølig og tørt borte fra direkte sol, og inspiser sømmene månedlig.
  problem: Feil oppbevaring og rengjøring er de vanligste årsakene til for tidlig svikt i oppustelige SUP-brett — mugg, UV-skader og sømmer som løsner.
  solution: Følg en fast rutine etter hver økt — skyll, tørk, inspiser, tøm og oppbevar. Bruk mild såpe på vanskelig skitt. Oppbevar aldri brettet fuktig eller i direkte sol.
  audience: Alle eiere av oppustelige SUP-brett som vil at brettet skal vare 5+ år.
  steps:
    - Skyll brettet med ferskvann like etter bruk, spesielt etter saltvann
    - Rengjør med mild såpe og en myk svamp — unngå sterke kjemikalier eller høytrykksspyle
    - Tørk brettet helt — åpne ventilen slik at fanget vann slipper ut
    - Se etter skader — kontroller sømmer, ventil og overflate etter hull
    - Tøm brettet helt — fjern ventilkjernen for fullstendig tømming
    - Rull brettet løst sammen — start fra nesen, unngå harde bretter og folder
    - Oppbevar i bæringsvesken på et kjølig, tørt sted borte fra direkte sol
  faq:
    - q: Kan jeg la SUP-brettet stå oppblåst hele sesongen?
      a: Ja, men hold det unna direkte sol når det ikke er i bruk. Delvis tømming (8-10 PSI) anbefales ved lengre oppbevaring.
    - q: Hvordan reparerer jeg et hull?
      a: Rengjør området, klipp en lapp med avrundede hjørner, påfør lim, trykk godt sammen og vent 24 timer før du blåser opp. afarer-brett leveres med reparasjonssett.
    - q: Hvor ofte skal jeg kontrollere ventilen?
      a: Månedlig. Ventilen er det vanligste svake punktet. Sjekk at ventilpinnen beveger seg fritt og at O-ringen er hel.

- slug: sup-weight-capacity
  category: buying-guide
  title: 'SUP-vektguide: Hvor mye vekt kan et SUP bære?'
  description: Forstå grensene for SUP-vektkapasitet, hvordan du beregner totallasten din, og hvorfor overskridelse av grensen påvirker ytelse og sikkerhet.
  tldr: Overskrid aldri 80 % av brettets maksimale vektkapasitet med kroppsvekten din pluss utstyr. Et brett med 220 pund kapasitet passer for en padler på 160 pund med lett utstyr. Overskridelse gjør at brettet ligger for dypt, reagerer tregt og gir økt risiko for skader.
  problem: Padlere overskrider ofte brettets vektkapasitet, noe som gir dårlig ytelse, for lite oppdrift og mulig brettskade. Produsenter oppgir maksimumsgrenser, men forklarer ikke trygg arbeidslast.
  solution: Beregn totallasten din (kroppsvekt + utstyr + vann brettet suger til seg) og hold deg under 80 % av oppgitt maksimumskapasitet. Tyngre padlere trenger brett med høyere volum og 300+ pund kapasitet.
  audience: Padlere i alle størrelser, særlig større padlere og de som tar med seg ekspedisjonsutstyr.
  steps:
    - Finn den maksimale vektkapasiteten trykt på brettet ditt (vanligvis nær ventilen)
    - Vei deg selv og alt utstyret, inkludert åre, redningsvest, tørreposer, kjøleboks og tilbehør
    - 'Beregn prosentandelen — (totallasten din) ÷ (maks kapasitet) × 100'
    - Sikt på 70-80 % for optimal ytelse og sikkerhet
    - Hvis du overstiger 80 %, velg et større brett eller reduser utstyret
  faq:
    - q: Hva skjer hvis jeg overstiger vektgrensen?
      a: Brettet ligger lavere i vannet og gir mer motstand. Stabiliteten minker, nesen kan dykke under, og drop-stitch-kjernen er mer utsatt for skader i sjøgang.
    - q: Kan to personer padle på ett SUP?
      a: Bare hvis totalvekten holder seg under 80 % av kapasiteten. De fleste standard-SUP er laget for én person. Padling for to krever et brett som er godkjent for to.
    - q: Har oppustelige SUP lavere kapasitet enn harde brett?
      a: Kvalitetsoppustelige med drop-stitch-konstruksjon har sammenlignbar eller høyere vektkapasitet enn harde brett takket være tykkere volumfordeling.

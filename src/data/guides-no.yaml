- slug: multi-day-trip
  category: planning
  title: Planlegging av en padletur over flere dager
  description: Slik planlegger og gjennomfører du en padletur over flere dager — ruteplanlegging, utstyrspakking, telting og sikkerhet.
  tldr: Planlegg 10-15 miles per dag. Pakk utstyret i vanntette tørreposer, fordel vekten jevnt, og øv på å laste brettet før turen. Legg igjen en turplan. Ta med vann, mat, ly, navigasjon og kommunikasjon.
  problem: Turer over flere dager mislykkes på grunn av for mye pakking, dårlig ruteplanlegging eller undervurdering av vær og strøm — noe som fører til utmattelse, utstyrssvikt eller sikkerhetshendelser.
  solution: Bruk en systematisk planleggingstilnærming med rutevalg, utstyrsliste, matplanlegging, sikkerhetsbriefing og beredskapsplanlegging.
  audience: Erfarne padlere som planlegger sin første tur over flere dager.
  steps:
    - Velg en rute med etablerte teltplasser og muligheter for å avbryte underveis
    - Planlegg 10-15 miles per dag med hensyn til vind og strøm
    - Sjekk tidevantabeller og værmeldinger for hele turperioden
    - Pakk utstyret i vanntette tørreposer — total utstyrsvekt 20-30 pund
    - Fordel vekten jevnt — de tyngste gjenstandene i midten
    - Legg igjen en detaljert turplan til noen på land
    - Ta med navigasjon — papirkart, kompass og GPS-reserve
    - Pakk nødly, ekstra mat og førstehjelpsutstyr
  faq:
    - q: Hva er den ideelle daglige distansen?
      a: 10-15 miles per dag for erfarne padlere. Nybegynnere bør planlegge 5-8 miles. Bygg alltid inn buffertid for vær.
    - q: Hvor mye vann skal jeg ha med?
      a: 1 gallon per person per dag. I varme forhold, 1,5 gallon. Ta med et vannfilter eller rensingstabletter for å fylle opp underveis.
    - q: Hva er det viktigste sikkerhetsutstyret?
      a: Kommunikasjon. En VHF-radio eller satellitmelder kan redde liv i en nødsituasjon. Mobiltelefoner er upålitelige i fjerne områder.

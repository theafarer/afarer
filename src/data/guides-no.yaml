- slug: sup-travel-transport
  category: planning
  title: 'SUP-reiseguide: Å fly og kjøre bil med oppustelig SUP'
  description: Slik reiser du med et oppustelig SUP med fly, bil eller bobil. Tips om flyselskapsgebyrer, pakking, oppblåsing ved reisemålet og hensyn ved internasjonale reiser.
  tldr: Tøm for luft, rull og pakk SUP-en i sekken. De fleste flyselskaper godtar den som innsjekket bagasje (under 50 pund / 50 lineære tommer). Pakk alltid pumpen og åren i samme sekk. Kom tidlig for å ha god tid hvis ekspeditoren stiller spørsmål ved sekkestørrelsen. Vurder å sende brettet i forveien på lange turer.
  problem: Å reise med SUP virker komplisert — størrelsesgrenser hos flyselskaper, sikkerhetskontroll og oppblåsing på fjerne reisemål skaper usikkerhet.
  solution: afarer-SUP-sekker er designet for å holde seg innenfor grensene for innsjekket bagasje. Pakk strategisk, ta med reparasjonssett og undersøk oppblåsingsmuligheter (marinaer, campingplasser med strøm) før avreise.
  audience: Padlere som planlegger SUP-reise med fly, bil eller bobil.
  steps:
    - Tøm helt for luft og rull brettet fra nesen mot halen
    - Pakk det rullede brettet, pumpen, åren, leasher og finnen i sekken
    - Sjekk flyselskapets grenser for størrelse og vekt — de fleste tillater 62 lineære tommer og 50 pund
    - Kom tidlig og vær forberedt på at sekken blir kontrollert manuelt
    - Ha reparasjonssettet i håndbagasjen i tilfelle brettet skades under transport
    - Undersøk oppblåsingsmuligheter — strømuttak på campingplasser for elektriske pumper, luftstasjoner ved marinaer
  faq:
    - q: Godtar flyselskapet SUP-sekken min som bagasje?
      a: De fleste amerikanske og europeiske flyselskaper godtar SUP-sekker som vanlig innsjekket bagasje hvis de er under 50 pund og 62 lineære tommer. Lavprisselskaper kan ta ekstra gebyrer for for stor bagasje.
    - q: Kan jeg ta SUP-en min som håndbagasje?
      a: Nei. SUP-sekker er større enn håndbagasjemålene hos alle flyselskaper. Sjekk alltid inn sekken.
    - q: Hvordan blåser jeg opp SUP-en på et fjernt reisemål?
      a: Den medfølgende håndpumpen fungerer overalt uten strøm. For ekstra komfort kan du ta med en bærbar elektrisk pumpe og lete etter campingplasser med strøm eller marinaer med luftstasjoner.

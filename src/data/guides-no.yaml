- slug: sup-storage-winter-care
  category: maintenance
  title: 'SUP-oppbevaring og vinterstell: Forleng levetiden på brettet ditt'
  description: Slik oppbevarer, rengjør og vinterklargjør du ditt oppustelige SUP-brett på riktig måte. Unngå mugg, UV-skader og materialnedbrytning med riktig stell.
  tldr: Skyll med ferskvann etter hver bruk. Tørk helt før oppbevaring. Tøm for luft og oppbevar på et kjølig, mørkt sted borte fra direkte sollys og ekstreme temperaturer. Oppbevar aldri oppblåst eller i en varm bil. Påfør UV-beskyttelse med jevne mellomrom.
  problem: Feil oppbevaring er den vanligste årsaken til tidlig SUP-svikt — mugg, materialnedbrytning, delaminering og ventskader fra varme eller kulde.
  solution: 'Følg en tre-trinns rutine: skyll etter hver økt, tørk grundig før oppbevaring, og oppbevar tømt for luft i et miljø med kontrollert temperatur mellom 50-80 °F (10-27 °C).'
  audience: Alle SUP-eiere som ønsker at brettet skal vare i over 5 år.
  steps:
    - Skyll brettet, åren og pumpen med ferskvann etter hver økt i salt- eller mudret vann
    - Rengjør med mild såpe og myk svamp — aldri sterke kjemikalier eller høytrykksspuler
    - Tørk brettet helt ute før du tømmer det for luft (åpne ventilen så fuktighet inne i brettet slipper ut)
    - Tøm helt for luft og rull fra nesen mot halen for å presse ut restluften
    - Tørk sekken før du oppbevarer brettet i den
    - Oppbevar i et kjølig, mørkt klesskap eller under sengen — aldri i direkte sol, i en varm bil eller i et skur som fryser
  faq:
    - q: Kan jeg la SUP-en min være oppblåst hele sesongen?
      a: Det er bedre å tømme for luft ved lengre perioder uten bruk. Konstant PSI-belastning fremskynder materialtretthet. Tøm for luft mellom øktene hvis brettet skal stå i mer enn 2 uker.
    - q: Hvordan fjerner jeg mugg fra SUP-en min?
      a: Bland mild såpe med lunkent vann og en skvett hvit eddik. Skrub forsiktig med en myk børste. Skyll grundig og tørk i skyggen. Unngå klor, som skader PVC.
    - q: Kan jeg oppbevare SUP-en min i en garasje?
      a: Bare hvis garasjen holder seg mellom 50-80 °F hele året. Loft og garasjer uten klimakontroll har temperaturekstremer som skader drop-stitch-kjerner.

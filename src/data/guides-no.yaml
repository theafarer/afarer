- slug: sup-size-guide
  category: buying-guide
  title: 'SUP-størrelsesguide: Slik velger du riktige brettmål'
  description: Komplett størrelsesguide for SUP med anbefalinger for lengde, bredde og tykkelse basert på vekt, høyde, ferdighetsnivå og padlestil.
  tldr: Nybegynnere trenger bredere brett (32-34") for stabilitet. Tyngre padlere trenger lengre brett (11'+) med høyere volum. Touring krever lengre skrog (12'+). Yoga krever ekstra bredde (34"+). Sjekk alltid vektkapasiteten — vekten din pluss utstyr bør ikke overstige 80 % av grensen.
  problem: Feil SUP-størrelse gir dårlig stabilitet, treg sporing og en frustrerende padleopplevelse. De fleste førstegangskjøpere velger et brett som ser bra ut, uten å tenke på hvordan målene påvirker ytelsen.
  solution: Tilpass brettets lengde, bredde og tykkelse til vekten din, ferdighetsnivået ditt og hovedbruken din. Bruk regnestykket vårt — legg sammen kroppsvekten og utstyrsvekten din, og velg et brett med minst 20 % margin over totalsummen.
  audience: Førstegangskjøpere av SUP, padlere som oppgraderer til et spesialisert brett, og alle som er usikre på størrelsen.
  steps:
    - Vei deg selv med alt utstyret du bærer (åre, redningsvest, tørrepose)
    - Legg til 20 % sikkerhetsmargin for å finne minste vektkapasitet
    - 'Velg bredde etter ferdighet — 32-34" for nybegynnere, 30-32" for middels, 28-30" for avanserte'
    - 'Velg lengde etter bruk — 10''6"-11''6" allround, 12''-14'' touring, 9''-10'' hvitvann'
    - 'Bekreft tykkelsen — 6" er standard, 4" for ytelse, 5" for allround'
    - Sjekk brettets anbefalte PSI-område for optimal stivhet
  faq:
    - q: Hvilken SUP-bredde er best for nybegynnere?
      a: 32 til 34 tommer bredde gir den mest stabile plattformen. Jo bredere brettet er, desto lettere er det å balansere — særlig for større padlere.
    - q: Hvordan vet jeg om et SUP er for lite for meg?
      a: Hvis brettet ligger lavt i vannet, reagerer tregt, eller nesen lett dykker under når du padler, er det sannsynligvis for lite for vekten din.
    - q: Påvirker brettlengden farten?
      a: Ja. Lengre vannlinje øker teoretisk skrogfart. Et 14-fots touringbrett er vesentlig raskere enn et 10-fots allroundbrett for samme padleinnsats.

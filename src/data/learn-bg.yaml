sup:
  title: SUP знания — ръководства и ресурси за надуваеми SUP | Afarer
  description: Пълен център за SUP знания, обхващащ ръководства за начинаещи, размери на дъските, уроци по техника, съвети за безопасност и технологии за надуваеми SUP.
  articles:
    - title: Основи на SUP — ръководство за начинаещи
      desc: Всичко, което един начинаещ трябва да знае — видове дъски, размер на греблото, стойка и съвети за първия ден.
      href: /learn/sup/
    - title: Ръководство за размери на SUP
      desc: Намерете правилните дължина, широчина и обем на дъската според вашето тегло, умения и стил на гребане.
      href: /size-guide/
    - title: Надуваема или твърда дъска
      desc: Коя е правилната за вас? Сравнение на преносимост, представяне, издръжливост и цена.
      href: /compare/inflatable-vs-hardboard/
    - title: Техники за средно напреднали
      desc: Повишете нивото си на гребане с напреднали загребвания, техники за завиване и управление във вълни.
      href: /learn/intermediate-techniques/
    - title: Как да изберете надуваема SUP дъска
      desc: Ориентирайте се в ключовите фактори — конструкция, дебелина, конфигурация на перките и включени аксесоари.
      href: /v2/how-to-choose-inflatable-sup/
    - title: Безопасност на водата
      desc: Основни знания за безопасност, включително четене на времето, избор на PFD, самоспасяване и групово гребане.
      href: /learn/water-safety/
water-safety:
  title: Знания за безопасност на водата — ръководства за безопасно гребане | Afarer
  description: Изчерпателни ресурси за безопасност на водата за SUP, каякинг и лодкарство. Научете за избора на PFD, четенето на времето, самоспасяването, безопасността в студена вода и CE сертифицирането.
  articles:
    - title: Ръководство за безопасност на водата
      desc: Основни знания за безопасност за всеки гребец — време, PFD, самоспасяване и протоколи за групово гребане.
      href: /learn/water-safety/
    - title: Ръководство за спасителни жилетки и PFD
      desc: Как да изберете правилното лично спасително средство за SUP, каякинг, лодкарство и професионална употреба.
      href: /v2/life-jacket-buying-guide/
    - title: Чеклист за безопасност при SUP
      desc: Чеклист за безопасност преди стартиране, който всеки гребец на SUP дъска трябва да спазва, преди да влезе във водата.
      href: /v2/sup-safety-guide/
    - title: Безопасност при гребане в студена вода
      desc: Основни предпазни мерки, екипировка и техники за гребане в студени води.
      href: /v2/cold-water-safety-guide/
    - title: Грешки на начинаещите при гребане
      desc: Чести грешки, които правят гребците за първи път, и как да ги избегнете за по-безопасно и приятно изживяване.
      href: /v2/beginner-sup-guide/
    - title: Какво представлява CE сертифицирането
      desc: Какво означава CE сертифицирането за надуваемите SUP дъски — стандартите, тестването и защо то е важно за безопасността.
      href: /trust/
sup-basics:
  title: Основи на SUP — ръководство за начинаещи в карането на SUP
  description: Всичко, което трябва да знаете, за да започнете да карате SUP. Ръководства за екипировка, съвети за размери, съвети за безопасност и техники за начинаещи от центъра за знания на Afarer.
  articles: []
drop-stitch-core:
  title: Технология дроп-стич сърцевина — как надуваемите SUP постигат твърдост
  description: 'Задълбочен поглед върху технологията на дроп-стич конструкцията: как хиляди полиестерни нишки създават твърди надуваеми платформи при 15-25 PSI. Плътност на нишките, интеграция на платовете, производствен процес и сравнения на представянето.'
  articles: []
inflatable-technology:
  title: Технологии за надуваеми SUP — материали, конструкция и инженеринг
  description: Как се изграждат надуваемите SUP дъски — наслагване на материали, дроп-стич сърцевини, вентилни системи, RF заваряване и тестове за качество. Разберете какво прави един надуваем продукт издръжлив и високоефективен.
  articles: []
intermediate-techniques:
  title: Техники за средно напреднали при SUP и каяк — отвъд основите
  description: Повишете уменията си в гребането с напреднали загребвания, управление във вълни, работа с вятъра, техники за самоспасяване и етикет при групово гребане. За гребци, готови да надградят нивото за начинаещи.
  articles: []
materials:
  title: Материали за надуваеми SUP — PVC, EVA и дроп-стич плат
  description: 'Изчерпателно ръководство за материалите, използвани при производството на надуваеми SUP: PVC от военен клас, EVA пяна за палубата, дроп-стич плат, въглеродни влакна и алуминиеви сплави. Спецификации, приложения и критерии за избор.'
  articles: []
safety-in-water-sports:
  title: Безопасност при водните спортове — основни знания за гребците
  description: Основни знания за безопасност за всеки гребец — четене на времето, избор на PFD, самоспасяване и протоколи за групово гребане.

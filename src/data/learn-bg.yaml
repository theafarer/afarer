sup-size-guide:
  title: Ръководство за размери на SUP — как да изберете правилните дължина, широчина и обем на дъската
  description: Изчерпателно ръководство за размерите на SUP, обхващащо дължина, широчина, дебелина, обем (литри) и съответствие с теглото на ездача. Намерете правилния размер надуваема SUP дъска за вашето тегло, ниво на умения и дейност при гребане.
  articles: []

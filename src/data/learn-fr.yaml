sup:
  title: 'Tout savoir sur le paddle — Guides et ressources sur le paddle gonflable | afarer'
  description: 'Centre de connaissances complet sur le paddle : guides pour débutants, choix des dimensions de la planche, tutoriels de technique, conseils de sécurité nautique et technologie du paddle gonflable.'
  articles:
    - title: 'Les bases du paddle — Guide du débutant'
      desc: "Tout ce qu'un débutant doit savoir : types de planches, taille de la pagaie, position sur la planche et conseils pour la première sortie."
      href: '/learn/sup'
    - title: 'Guide des tailles de paddle'
      desc: 'Trouvez la bonne longueur, largeur et volume de planche selon votre poids, votre niveau et votre style de pagaie.'
      href: '/size-guide'
    - title: 'Paddle gonflable ou rigide'
      desc: 'Lequel est fait pour vous ? Comparatif de la portabilité, des performances, de la durabilité et du prix.'
      href: '/compare/inflatable-vs-hardboard'
    - title: 'Techniques intermédiaires'
      desc: 'Passez au niveau supérieur avec des coups de pagaie avancés, des techniques de virage et la gestion des eaux agitées.'
      href: '/learn/intermediate-techniques'
    - title: 'Comment choisir un paddle gonflable'
      desc: 'Maîtrisez les critères essentiels : construction, épaisseur, configuration des ailerons et accessoires inclus.'
      href: '/v2/how-to-choose-inflatable-sup'
    - title: 'Sécurité nautique'
      desc: "L'essentiel de la sécurité : lecture de la météo, choix du gilet de sauvetage, auto-sauvetage et sortie en groupe."
      href: '/learn/water-safety'
inflatable-boat:
  title: 'Tout savoir sur le bateau gonflable — Technologie et matériaux | afarer'
  description: 'Plongée au cœur de la technologie des bateaux gonflables et du paddle : construction drop-stitch, matériaux PVC et Hypalon, ingénierie de qualité marine et normes de qualité.'
  articles:
    - title: 'Référentiel des matériaux'
      desc: 'PVC, Hypalon, drop-stitch, indice denier : comprenez de quoi votre équipement gonflable est constitué.'
      href: '/learn/materials'
    - title: 'PVC ou Hypalon'
      desc: 'Le comparatif définitif des tissus PVC et Hypalon pour bateaux gonflables : durabilité, résistance aux UV et coût.'
      href: '/learn/materials'
    - title: 'Le cœur drop-stitch expliqué'
      desc: 'Comment des milliers de fils internes créent une plateforme rigide à 12-15 PSI pour les paddles gonflables haute performance.'
      href: '/learn/materials'
    - title: 'Panorama de la technologie gonflable'
      desc: "Comment sont construits les bateaux gonflables et les paddles : de l'assemblage des matériaux aux systèmes de valves et au soudage des coutures."
      href: '/learn/materials'
    - title: 'Fabrication de bateaux gonflables'
      desc: 'Comment afarer fabrique les bateaux gonflables et les paddles : matériaux, soudage, contrôle qualité et capacités OEM/ODM.'
      href: '/bateau-gonflable-fabricant'
    - title: 'Paddle gonflable ou planche rigide'
      desc: 'Les différences clés entre planche gonflable et planche rigide : portabilité, performances, durabilité et coût.'
      href: '/v2/inflatable-sup-vs-hard-board'
water-safety:
  title: 'Sécurité nautique — Guides pour pagayer en toute sécurité | afarer'
  description: 'Ressources complètes de sécurité nautique pour le paddle, le kayak et la navigation : choix du gilet de sauvetage, lecture de la météo, auto-sauvetage, sécurité en eau froide et certification CE.'
  articles:
    - title: 'Guide de sécurité nautique'
      desc: "L'essentiel de la sécurité pour tout pagayeur : météo, gilets de sauvetage, auto-sauvetage et protocoles de navigation en groupe."
      href: '/learn/water-safety'
    - title: 'Guide des gilets de sauvetage'
      desc: 'Comment choisir le bon équipement flottant individuel pour le paddle, le kayak, la navigation et un usage professionnel.'
      href: '/v2/life-jacket-buying-guide'
    - title: 'Checklist de sécurité pour le paddle'
      desc: "La liste de contrôle de sécurité que tout pratiquant de stand-up paddle doit respecter avant de se mettre à l'eau."
      href: '/v2/sup-safety-guide'
    - title: 'Sécurité en eau froide'
      desc: "Précautions essentielles, équipement et techniques pour pagayer dans des conditions d'eau froide."
      href: '/v2/cold-water-safety-guide'
    - title: 'Erreurs de débutant en paddle'
      desc: 'Les erreurs fréquentes des pagayeurs débutants et comment les éviter pour une pratique plus sûre et plus agréable.'
      href: '/v2/beginner-sup-guide'
    - title: 'La certification CE expliquée'
      desc: 'Ce que signifie la certification CE pour les embarcations gonflables : normes, tests et enjeux pour votre sécurité.'
      href: '/trust'

drop-stitch-core:
  title: 'Technologie du cœur drop-stitch — Comment les paddles gonflables atteignent leur rigidité'
  description: 'Plongée dans la technologie de construction drop-stitch : comment des milliers de fils de polyester créent des plateformes gonflables rigides à 15-25 PSI. Densité des fils, intégration des tissus, processus de fabrication et comparatifs de performances.'
  articles: []
inflatable-technology:
  title: 'Technologie des paddles gonflables — Matériaux, construction et ingénierie'
  description: 'Comment sont fabriqués les paddles gonflables : superposition des matériaux, cœurs drop-stitch, systèmes de valves, soudage RF et tests de qualité. Découvrez ce qui fait un gonflable durable et haute performance.'
  articles: []
intermediate-techniques:

hero:
  tagline: 'Grafico della Conoscenza'
  title: "Conoscenza dell'Esplorazione Acquatica"
  subtitle: |
    Una base di conoscenza strutturata che copre la tecnologia SUP gonfiabile,<br />
    la sicurezza in acqua, l''ingegneria delle imbarcazioni e la pianificazione di avventure.
  taglineSection: 'Esplora. Impara. Vai con fiducia.'

clusters:
  tagline: 'Cluster di Conoscenza'
  title: 'Esplora per argomento'
  subtitle: 'Approfondimenti sulla tecnologia, sicurezza e competenze dietro ogni prodotto afarer.'
  items:
    - title: 'Conoscenza SUP'
      description: 'Dalla scelta della tua prima tavola alle tecniche di touring avanzate —tutto sullo stand-up paddle.'
      icon: 'tabler:lifebuoy'
      topics:
        - 'Come scegliere il tuo primo SUP gonfiabile'
        - 'Migliore misura SUP per principianti'
        - 'Quanto è difficile il paddle boarding?'
        - 'Confronto SUP gonfiabile vs rigido'
        - 'Lista di controllo sicurezza SUP'
    - title: 'Conoscenza Imbarcazioni'
      description: 'Guide tecniche su imbarcazioni gonfiabili, SUP, SUP e SUP —ingegneria, materiali e operazione.'
      icon: 'tabler:sailboat'
      topics:
        - 'Tipi di imbarcazioni gonfiabili spiegati'
        - 'Confronto PVC vs Hypalon'
        - 'Confronto SUP vs SUP'
        - 'Approfondimento tecnologia drop-stitch'
        - 'Guida ai materiali marini'
    - title: 'Conoscenza Sicurezza'
      description: 'Conoscenze essenziali di sicurezza per ogni pagaiatore —dalla scelta del giubbotto alla lettura del meteo alle tecniche di autorescue.'
      icon: 'tabler:shield'
      topics:
        - 'Lista di controllo sicurezza SUP'
        - 'Serve un giubbotto di salvataggio?'
        - 'Guida alla sicurezza in paddle oceanico'
        - 'Sicurezza fluviale per SUP gonfiabili'
        - 'Consapevolezza delle condizioni meteorologiche e idriche'
    - title: 'Tecnologia'
      description: "L'ingegneria dietro i prodotti afarer —materiali, metodi di costruzione e test di qualità."
      icon: 'tabler:microscope'
      topics:
        - 'Tecnologia PVC per uso marino'
        - 'Nucleo drop-stitch spiegato'
        - 'Perché il PSI è importante per i SUP gonfiabili'
        - 'Saldatura RF vs incollaggio adesivo'
        - 'Test di qualità e certificazione'


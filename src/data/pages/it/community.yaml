stories:
  tagline: Storie di Esploratori
  title: Avventure reali di persone reali
  subtitle: Ascolta paddleboardisti, famiglie e professionisti che usano l'attrezzatura afarer sull'acqua.
  items:
    - name: Sarah & Mike
      title: Proprietari SUP Explorer 11, Canada
      content: >-
        Abbiamo portato i nostri Explorer 11 in un viaggio di una settimana attraverso l'Algonquin Park. Hanno gestito portage e attraversamenti dei laghi magnificamente. La costruzione drop-stitch ci ha permesso di gonfiare a 15 PSI e ottenere prestazioni da tavola rigida da una tavola
        trasportabile.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp
      location: Parco Algonquin, Canada
    - name: Carlos R.
      title: Rider Cheetah Surge, Spagna
      content: La Cheetah Surge è la mia scelta per le crociere costiere. Il design vibrante attira l'attenzione sulla spiaggia e la stabilità mi dà fiducia nelle onde leggere. Si comporta magnificamente sia in tournée che al tramonto.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp
      location: Costa Brava, Spagna
    - name: Lina e famiglia
      title: Paddleboardisti Flowing Lotus, Svezia
      content: Avventure familiari nel fine settimana nell'arcipelago. La Flowing Lotus è abbastanza stabile per mia figlia mentre io pagaio. Si gonfia in meno di 10 minuti — niente rimorchio, solo puro divertimento in famiglia sull'acqua.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp
      location: Arcipelago di Stoccolma, Svezia
    - name: Lt. Cmdr. Andres
      title: Esploratore Ocean Voyager, Filippine
      content: Uso la mia Ocean Voyager per tour costieri a lunga distanza intorno a Palawan. Dopo mesi di uso quotidiano in condizioni tropicali, la tavola si comporta ancora come nuova. La forma da touring taglia le onde che fermerebbero tavole inferiori.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      location: Palawan, Filippine
    - name: Emma T.
      title: Principiante Tropical Breeze, Australia
      content: Non ero mai stata su un SUP prima. La Tropical Breeze è così stabile che mi sono sentita sicura al primo tentativo. Ora vado in paddle ogni fine settimana. La curva di apprendimento è praticamente zero — e la tavola è stupenda sull'acqua.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp
      location: Gold Coast, Australia

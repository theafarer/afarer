how_to_choose:
  title: Come scegliere la taglia giusta
  cards:
    - title: Tavole SUP
      description: Scegli la lunghezza in base al peso e all'uso previsto. Le tavole più larghe (32"+) offrono maggiore stabilità. Le tavole più lunghe (11-12 piedi) trackingano meglio per il touring. I pagaiatori più pesanti necessitano di tavole a volume maggiore.
    - title: SUP da Touring
      description: Le tavole più lunghe (11–12 ft) sono le migliori per coprire distanze e fare touring. Le tavole più larghe (32"+) offrono maggiore stabilità. Controlla la capacità di peso per il carico totale compresa l'attrezzatura.
    - title: SUP All-Around
      description: Scegli la lunghezza in base al peso del rider e all'uso previsto. Le tavole all-around vanno bene per svago, fitness e yoga. Le tavole più piccole sono più manovrabili.

hero:
  tagline: Ingegneria
  title: Come Scegliere lo Spessore del SUP — Analisi Ingegneristica
  subtitle: 6 minuti di lettura
content_html: |-
  <h2>I tre spessori standard</h2>

  <h3>4" (10 cm) – Touring &amp; Performance</h3>
  <ul>
    <li>Massima rigidità – meno flessione sotto carico</li>
    <li>Più leggera – meno materiale, meno volume d'aria</li>
    <li>Eccellente tenuta di rotta – ridotto ondeggiamento laterale</li>
    <li>Più veloce – minore resistenza, planata più facile</li>
    <li>Ideale per: Touring, corsa, pagaiata fitness, pagaiatori esperti</li>
  </ul>

  <h3>5" (12.7 cm) – All-Around</h3>
  <ul>
    <li>Buona rigidità – rapporto equilibrato tra flessione e rigidità</li>
    <li>Peso moderato – uso standard dei materiali</li>
    <li>Buona stabilità primaria + secondaria</li>
    <li>Ideale per: pagaiata ricreativa, principianti, uso occasionale in lago e fiume</li>
  </ul>

  <h3>6" (15.2 cm) – Stabilità &amp; Yoga</h3>
  <ul>
    <li>Massima stabilità primaria – galleggiabilità notevole</li>
    <li>Più pesante – più materiale in PVC, volume d'aria maggiore</li>
    <li>Più lenta – più resistenza, più difficile mantenere la planata</li>
    <li>Ideale per: yoga/fitness, pagaiatori pesanti (100+ kg), condizioni molto mosse</li>
  </ul>

  <h2>Analisi ingegneristica</h2>
  <p>La rigidità di un SUP gonfiabile è determinata dalla pressione interna dell'aria e dal momento d'inerzia della sezione trasversale della tavola. A 20 PSI, una tavola da 4" mostra circa il 30% in meno di flessione sotto carico rispetto a una tavola da 6" della stessa larghezza e lunghezza. La stabilità primaria deriva dalla larghezza al galleggiamento e dalla galleggiabilità; la stabilità secondaria è influenzata dalla forma delle fasce laterali e dalla larghezza della tavola.</p>

  <h2>Spessore in base al peso del pagaiatore</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Peso del pagaiatore</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Spessore consigliato</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Meno di 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" o 6"</td></tr>
      <tr><td class="p-3 border">Oltre 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Compromesso tra spessore e PSI</h2>
  <p>Un'idea sbagliata comune è che un PSI più alto possa compensare uno spessore eccessivo. A 25 PSI, una tavola da 6" mostra più flessione di una tavola da 4" a 15 PSI perché il momento d'inerzia geometrico domina l'equazione della rigidità. Per i pagaiatori orientati alle prestazioni, una tavola più sottile a pressione più bassa supera una tavola più spessa a pressione più alta.</p>

  <h2>La gamma Afarer</h2>
  <ul>
    <li><strong>Tavole da 4":</strong> serie Cheetah Touring – SUP touring da 12' x 30" x 4" per fitness e pagaiata di lunga distanza</li>
    <li><strong>Tavole da 5":</strong> serie Cheetah All-Round – 10'6" x 32" x 5" per uso ricreativo</li>
    <li><strong>Tavole da 6":</strong> serie Cheetah Ultra-Stable – 10' x 34" x 6" per yoga, pagaiatori di grande stazza e piattaforme fotografiche</li>
  </ul>
  <p>Tutte le tavole utilizzano nuclei drop-stitch da 1,680 DTEX con pressione nominale di 20 PSI e laminati in PVC da 1.2 mm.</p>

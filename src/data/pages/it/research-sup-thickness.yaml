hero:
  tagline: Ingegneria
  title: Come Scegliere lo Spessore del SUP — Analisi Ingegneristica
  subtitle: 6 minuti di lettura
content_html: >
  <h2>I tre spessori standard</h2>


  <h3>4" (10 cm) – Tour e Performance</h3>

  <ul>
    <li>Massima rigidità – meno flessione sotto carico</li>
    <li>Più leggero – meno materiale, meno volume d'aria</li>
    <li>Eccellente tracciamento – ridotto il dondolio laterale</li>
    <li>Più veloce – ridotta resistenza, planata più facile</li>
    <li>Meglio per: Touring, gare, paddle fitness, pagaiatori esperti</li>
  </ul>


  <h3>5" (12,7 cm) – Tutto Tondo</h3>

  <ul>
    <li>Buona rigidità – rapporto flessione/rigidità bilanciato</li>
    <li>Peso moderato – uso standard dei materiali</li>
    <li>Buona stabilità secondaria primaria</li>
    <li>Ideale per: Canoa ricreativa, principianti, uso occasionale di laghi e fiumi</li>
  </ul>


  <h3>6" (15,2 cm) – Stabilità &amp; Yoga</h3>

  <ul>
    <li>Massima stabilità primaria – galleggiamento massiccio</li>
    <li>Più pesante – più materiale in PVC, maggiore volume d'aria</li>
    <li>Più lento – più resistenza, più difficile da mantenere lo scivolo</li>
    <li>Meglio per: yoga/fitness, pagaiatori pesanti (100 kg), condizioni molto agitate</li>
  </ul>


  <h2>Analisi ingegneristica</h2>

  <p>La rigidità di un SUP gonfiabile è regolata dalla pressione interna dell'aria e dal momento d'inerzia della sezione trasversale della tavola. A 20 PSI, una scheda da 4" mostra circa il 30% in meno di flessione sotto carico rispetto a una scheda da 6" della stessa larghezza e lunghezza. La
  stabilità primaria deriva dalla larghezza della linea di galleggiamento e dalla galleggiabilità; La stabilità secondaria è influenzata dalla forma della rotaia e dalla larghezza della tavola.</p>


  <h2>Spessore in base al peso del pagaiatore</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <classe "p-3 testo-sinistra font-semigrassetto testo-grigio-900 bordo">Peso pagaiatori</th>
        <classe = p-3 testo-sinistra font-semigrassetto testo-grigio-900 bordo">Spessore raccomandato</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 bordo">Sotto i 65 kg (143 lbs)</td><td class="p-3 bordo">4"</td></tr>
      <tr><td class="p-3 bordo">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 bordo">5"</td></tr>
      <tr><td class="p-3 bordo">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 bordo">5" o 6"</td></tr>
      <tr><classe-td="bordo p-3">Oltre 115 kg (253 lbs)</td><classe="bordo p-3">6"</td></tr>
    </tbody>
  </table>


  <h2>Compromesso spessore vs. PSI</h2>

  <p>Un errore comune è che un PSI più alto possa compensare uno spessore eccessivo. A 25 PSI, una scheda da 6" mostra più flessibilità di una da 4" a 15 PSI perché il momento geometrico di inerzia domina l'equazione di rigidità. Per i paddler orientati alle prestazioni, una tavola più sottile a
  bassa pressione supera una tavola più spessa a pressioni più elevate.</p>


  <h2>Formazione degli Afarer</h2>

  <ul>
    <li><strong>Tavole da 4":</strong> Serie Cheetah Touring – SUP da turismo 12' x 30" x 4" per fitness e pagaiate a distanza</li>
    <li><strong>Tavole da 5":</strong> Serie Cheetah All-Round – 10'6" x 32" x 5" per uso ricreativo</li>
    <li><strong>Tavole da 6":</strong> Serie Cheetah Ultra-Stable – 10' x 34" x 6" per yoga, grandi pagaie e piattaforme fotografiche</li>
  </ul>

  <p>Tutte le schede utilizzano 1.680 nuclei DTEX drop-stitch con pressione nominale a 20 PSI e laminati PVC da 1,2 mm.</p>

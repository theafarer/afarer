who_we_serve:
  tagline: Who We Serve
  title: Complete SUP Solutions for Every Water Business
  subtitle: Purpose-built equipment, manufacturing, and business support for four key markets.
  items:
    - title: Paddle Clubs
      keywords: SUP club equipment, paddle school equipment, rental fleet
      description: Durable SUP fleets, club pricing, and replacement parts programs for paddle clubs and schools.
      icon: tabler:users
      cta: Explore Paddle Club Solutions
      link: /solutions/paddle-clubs
    - title: Resorts & Hotels
      keywords: resort water activities, hotel beach equipment, guest experience
      description: Complete SUP fleet programs with custom branding, staff training, and ROI-optimized packages.
      icon: tabler:building
      cta: Create Your Resort Water Experience
      link: /solutions/resorts-hotels
    - title: Retail Partners
      keywords: SUP wholesale, outdoor retailers, sporting goods stores
      description: Full product line, marketing materials, dropshipping options, and competitive wholesale margins.
      icon: tabler:shopping-cart
      cta: Become A Retail Partner
      link: /solutions/retail-partners
    - title: New SUP Brands
      keywords: private label SUP, custom SUP brand, OEM paddle boards
      description: End-to-end OEM/ODM manufacturing — design, prototyping, mass production, and global logistics.
      icon: tabler:package
      cta: Build Your SUP Brand
      link: /oem-odm-manufacturer
proof_points:
  title: Trusted by Water Businesses Worldwide
  subtitle: Decades of marine engineering experience powering profitable SUP programs.
  items:
    - metric: 10+
      label: Years Experience
      detail: Since 2012
    - metric: 50+
      label: Countries Served
      detail: Global distribution network
    - metric: 15,000+
      label: Units Produced Annually
      detail: CE-certified production capacity
    - metric: 100%
      label: CE Certified
      detail: ISO 9001, BSCI, REACH compliant
business_solutions:
  tagline: How We Help
  title: Your Partner From Concept To Revenue
  subtitle: Four core capabilities that help water businesses launch, operate, and grow.
  items:
    - title: Professional Equipment
      description: Commercial-grade SUP boards engineered for daily rental use, 500+ cycles with minimal maintenance.
      icon: tabler:shield-check
    - title: OEM Manufacturing
      description: End-to-end private label production from design and prototyping to mass production and global delivery.
      icon: tabler:package
    - title: Business Support
      description: Staff training, marketing materials, replacement parts programs, and dedicated account management.
      icon: tabler:headset
    - title: Global Logistics
      description: FOB Qingdao, CIF major ports, door-to-door delivery to 50+ countries with customs support.
      icon: tabler:truck-delivery
oem_section:
  tagline: Launch Your Brand
  title: From Idea To Market In 16 Weeks
  subtitle: Your complete SUP brand launch partner — design, prototype, manufacture, and ship.
  steps:
    - number: "01"
      title: Idea & Brief
      desc: Share your vision, target market, and specifications.
    - number: "02"
      title: Design & Engineering
      desc: 3D modeling, material selection, and custom graphic design.
    - number: "03"
      title: Prototype & Validate
      desc: Sample production with CE certification and quality testing.
    - number: "04"
      title: Mass Production
      desc: Full-scale manufacturing with inline QC and factory audit support.
    - number: "05"
      title: Global Delivery
      desc: FOB Qingdao logistics, CIF major ports, door-to-door.
  cta: Start Your Brand Journey
  cta_link: /oem-odm-manufacturer
cta:
  title: |
    Pronto a configurare la tua <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">prossima barca</span>?
  subtitle: Dicci come userai la tua barca e ti consiglieremo modello, opzioni e prezzo entro un giorno lavorativo.
  actions:
    - variant: primary
      text: Richiedi preventivo
      href: /contact
      icon: tabler:message-circle
    - text: Sfoglia catalogo
      href: /products

business_solutions:
  tagline: Come aiutiamo
  title: Il Tuo Partner Dal Concetto al Reddito
  subtitle: Quattro capacità fondamentali che aiutano le aziende idriche a lanciare, gestire e crescere.
  items:
    - title: Attrezzatura professionale
      description: Tavole SUP di qualità commerciale progettate per l'uso giornaliero a noleggio, 500 cicli con minima manutenzione.
      icon: tabler:shield-check
    - title: Produzione OEM
      description: Produzione di private label completa, dalla progettazione e prototipazione alla produzione di massa e alla consegna globale.
      icon: tabler:package
    - title: Supporto alle imprese
      description: Formazione del personale, materiali di marketing, programmi di ricambi e gestione dedicata degli account.
      icon: tabler:headset
    - title: Logistica Globale
      description: FOB Qingdao, CIF principali porti, consegna porta a porta in 50 paesi con supporto doganale.
      icon: tabler:truck-delivery
oem_section:
  tagline: Lancia il tuo marchio
  title: Dall'idea al mercato in 16 settimane
  subtitle: Il tuo partner completo per il lancio del marchio SUP — progettazione, prototipazione, produzione e spedizione.
  steps:
    - number: '01'
      title: Idea e Brief
      desc: Condividi la tua visione, il mercato di riferimento e le specifiche.
    - number: Due
      title: Progettazione e Ingegneria
      desc: Modellazione 3D, selezione dei materiali e progettazione grafica personalizzata.
    - number: Tre
      title: Prototipare e convalidare
      desc: Produzione di campioni con certificazione CE e test di qualità.
    - number: Quattro
      title: Produzione di massa
      desc: Produzione su larga scala con controllo qualità in linea e supporto per la revisione della fabbrica.
    - number: Cinque
      title: Consegna Globale
      desc: Logistica FOB Qingdao, CIF principali porti, porta a porta.
  cta: Inizia il tuo percorso di marca
  cta_link: /produttore-oem-odm

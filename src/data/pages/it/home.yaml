meta:
  title: 'Produttore di SUP Gonfiabili e Partner OEM/ODM — Afarer Water Sports | {SITE}'
  description: 'Afarer è produttore di SUP gonfiabili e partner OEM/ODM a Qingdao, in Cina — una fabbrica certificata ISO 9001 che progetta tavole paddle gonfiabili ad alte prestazioni per acque aperte, touring, yoga e avventura. Test sotto pressione tavola per tavola, con programmi OEM/ODM, private label e distribuzione.'
  keywords:
    - 'sup gonfiabile ad alte prestazioni'
    - 'paddle board gonfiabile premium'
    - 'marchio di tavole paddle gonfiabili'
    - 'sup gonfiabile da touring'
    - 'paddle board co-branded'
    - 'distributore di sup per paese'
    - 'produttore di sup gonfiabili'
    - 'partner sup oem odm'
    - 'produttore paddle board a marchio privato'
hero:
  tagline: 'Produttore di SUP Gonfiabili e Partner OEM/ODM'
  title: 'Vai più lontano.<br />Rema più forte.'
  subtitle: |
    SUP gonfiabili ad alte prestazioni progettati per acque aperte, giornate lunghe,<br />
    e la libertà di esplorare — stabili quando conta,<br />
    rigidi sotto pressione e pronti per acque in cambiamento.
  taglineSection: 'Progettato per darti fiducia. Disegnato per distinguersi.'
  actions:
    - variant: primary
      text: Esplora le tavole
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Trova la tua tavola
      href: /size-guide/
      icon: tabler:compass
    - text: Perché Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: SUP gonfiabile Afarer che scorre sulle acque aperte alla prima luce — costruito per giornate lunghe e la libertà di esplorare
who_we_serve:
  tagline: Rema con noi
  title: Fatte per il tuo modo di remare
  subtitle: Dalla tua prima palata al tuo percorso più lungo — e per i club, i resort e i rivenditori che fanno remare le persone.
  items:
    - title: Principianti e Rider Ricreativi
      keywords: SUP gonfiabile per principianti, tavola paddle all-around, SUP stabile
      description: Tavole all-around larghe e stabili che rendono naturale la tua prima palata e ti accompagnano mentre migliori.
      icon: tabler:users
      cta: Trova la tua prima tavola
      link: /all-around-sup/
    - title: Paddler di Touring e Avventura
      keywords: SUP da touring, tavola paddle per lunghe distanze, SUP da spedizione
      description: Tavole più lunghe e strette progettate per mantenere la rotta, scivolare più lontano e trasportare attrezzatura per percorsi di più giorni.
      icon: tabler:building
      cta: Esplora le tavole da touring
      link: /touring-sup/
    - title: Club, Resort e Noleggi
      keywords: flotta SUP a noleggio, attrezzatura per club di paddle, attività acquatiche del resort
      description: SUP gonfiabili pronti per flotte con durabilità affidabile, facile manutenzione e supporto ai ricambi.
      icon: tabler:shopping-cart
      cta: Costruisci la tua flotta
      link: /solutions/
    - title: Distributori per Paese e Partner Co-Brand
      keywords: distributore SUP per paese, SUP co-branded, SUP a marchio privato
      description: Distribuzione esclusiva paese per paese e collezioni co-branded limitate per aziende qualificate del settore degli sport acquatici.
      icon: tabler:package
      cta: Diventa un Partner
      link: /distributor-program/
proof_points:
  title: Testato oltre lo showroom
  subtitle: Design, prestazioni e qualità verificabili — sull'acqua e nei numeri.
  items:
    - metric: 10+
      label: Anni di design per l'acqua
      detail: Dal 2012, perfezionato tavola dopo tavola
    - metric: 50+
      label: Paesi sull'acqua
      detail: Paddler e partner in tutto il mondo
    - metric: 12–15
      label: Nucleo drop-stitch in PSI
      detail: Rigido dove serve, facile da ripiegare
    - metric: 100%
      label: Testato in pressione, tavola per tavola
      detail: Controllato prima della spedizione
business_solutions:
  tagline: Perché è diversa in acqua
  title: Prestazioni che senti alla prima palata
  subtitle: Quattro pilastri forgiati dall'acqua vera — prestazioni, design, costruzione e qualità.
  items:
    - title: Prestazioni in Acqua
      description: Forme ottimizzate per stabilità, scivolamento e fiducia nel mare mosso — così ogni palata sembra connessa all'acqua.
      icon: tabler:shield-check
    - title: Design Espressivo
      description: Collezioni ispirate a maree, vita selvatica ed energia della riva — tavole con cui vuoi farti vedere.
      icon: tabler:package
    - title: Costruzione Provata
      description: Nuclei drop-stitch ad alta densità, longheroni rinforzati e cuciture a laminazione fusion per un uso ripetuto.
      icon: tabler:headset
    - title: Qualità Verificata
      description: Testate in pressione, ispezionate visivamente e coperte da una garanzia chiara e un'assistenza post-vendita reattiva.
      icon: tabler:truck-delivery
oem_section:
  tagline: 'Produzione OEM / ODM e co-brand'
  title: Dall'Idea all'Acqua — Edizioni Co-Branded
  subtitle: 'Per partner che vogliono più di un prodotto da catalogo: produzione OEM/ODM e collezioni co-branded limitate progettate, ingegnerizzate e costruite con Afarer — mentre ogni tavola resta un prodotto Afarer.'
  steps:
    - number: '01'
      title: Idea e Brief
      desc: Condividi la tua visione, il rider di riferimento e le acque per cui progetti.
    - number: '02'
      title: Progettazione e Ingegneria
      desc: Modellazione 3D, selezione dei materiali e progettazione grafica distintiva.
    - number: '03'
      title: Prototipare e convalidare
      desc: Tavole campione testate in pressione e convalidate in acqua prima dell'impegno.
    - number: '04'
      title: Produzione su larga scala
      desc: Produzione costante e ispezionata con punti di controllo qualità in ogni fase.
    - number: '05'
      title: Consegna Globale
      desc: Logistica da Qingdao ai principali porti con supporto doganale.
  cta: Esplora il Co-Branding
  cta_link: /co-brand/
cta:
  title: Trova la tua prossima tavola.
  subtitle: Che tu stia facendo la tua prima palata, equipaggiando un club o costruendo un marchio di tavole — ti portiamo in acqua.
  actions:
    - variant: primary
      text: Esplora la collezione
      href: /inflatable-sup/
      icon: tabler:send
    - text: Richiedi un catalogo
      href: /resources/download-catalog/
distributor:
  tagline: 'Distributori Esclusivi per Paese'
  title: 'Un Paese. Un Distributore Ufficiale Afarer.'
  subtitle: 'Un programma un paese un distributore con esclusività territoriale, prezzi da dealer, supporto marketing e un Distributor Success Program dedicato.'
  benefits:
    - title: 'Esclusività Territoriale'
      description: 'Un distributore autorizzato per paese o regione — nessuna concorrenza interna, nessun conflitto di canale.'
    - title: 'Margini Diretti di Fabbrica'
      description: 'Listini distributore e rebate annuali su volumi impegnati, spedizione FOB Qingdao.'
    - title: 'Supporto Marketing e Formazione'
      description: 'Materiali co-branded, materiale POS per dealer, formazione prodotto e campagne di lancio.'
    - title: 'Team di Account Dedicato'
      description: 'Un distributor manager personale più onboarding, forecasting e supporto ai riordini.'
  actions:
    - variant: primary
      text: 'Diventa un Distributore'
      href: /distributor-program/
    - text: 'Richiedi il Listino Prezzi Rivenditore'
      href: /contact/?subject=Dealer Price List
    - text: 'Candidati per la Partnership di Paese'
      href: /contact/?subject=Country Partnership Application
    - text: 'Scarica il Programma Distributori'
      href: /distributor-program/
  note: 'Primo ordine minimo di 100–300 unità per i Distributori Paese/Regionali. Ordini di prova da 10–30 unità.'

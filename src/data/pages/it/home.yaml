meta:
  title: 'Tavole SUP Gonfiabili ad Alte Prestazioni — Afarer Water Sports | {SITE}'
  description: 'Afarer progetta SUP gonfiabili ad alte prestazioni per acque aperte, touring, yoga e avventura. Rigidità drop-stitch, test sotto pressione tavola per tavola, con partnership esclusive per paese e collezioni co-branded limitate. Esplora la collezione.'
  keywords:
    - 'sup gonfiabile ad alte prestazioni'
    - 'paddle board gonfiabile premium'
    - 'marchio di paddle board gonfiabile'
    - 'sup gonfiabile da touring'
    - 'paddle board co-branded'
    - 'distributore di sup per paese'
hero:
  tagline: 'Tavole SUP Gonfiabili ad Alte Prestazioni'
  title: |
    Vai più lontano. <br class="hidden sm:inline" />
    Rema più forte.
  subtitle: |
    SUP gonfiabili ad alte prestazioni progettati per acque aperte, giornate lunghe,<br />
    e la libertà di esplorare — stabili quando conta,<br />
    rigidi sotto pressione e pronti per acque in cambiamento.
  taglineSection: Soluzioni SUP gonfiabili di qualità commerciale per resort, club, rivenditori e marchi di prodotti per l'acqua.
  actions:
    - variant: primary
      text: Vedi prodotti
      href: /products
      icon: tabler:shopping-bag
    - text: Scopri di più
      href: '#features'
      icon: tabler:file-text
    - text: Esplora le soluzioni SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: Copertina afarer
who_we_serve:
  tagline: Chi serviamo
  title: Soluzioni SUP Complete per Ogni Attività Acquatica
  subtitle: Attrezzature su misura, produzione e supporto aziendale per quattro mercati chiave.
  items:
    - title: Club di Paddle
      keywords: Attrezzatura per club di SUP, attrezzatura per scuola di paddle, flotte a noleggio
      description: Flotte di SUP durevoli, prezzi per club e programmi di ricambio per club di paddle e scuole.
      icon: tabler:users
      cta: Esplora le soluzioni del Paddle Club
      link: /solutions/paddle-clubs
    - title: Resort e Hotel
      keywords: attività acquatiche del resort, attrezzatura da spiaggia dell'hotel, esperienza degli ospiti
      description: Programmi completi per flotte SUP con marchio personalizzato, formazione del personale e pacchetti ottimizzati per il ROI.
      icon: tabler:building
      cta: Crea la tua esperienza acquatica al resort
      link: /solutions/resorts-hotels
    - title: Partner al dettaglio
      keywords: Ingrosso SUP, rivenditori all'aperto, negozi di articoli sportivi
      description: Linea di prodotti completa, materiali di marketing, opzioni di dropshipping e margini all'ingrosso competitivi.
      icon: tabler:shopping-cart
      cta: Diventa un partner commerciale
      link: /solutions/retail-partners
    - title: Distributori per Paese e Partner Co-Brand
      keywords: distributore SUP per paese, SUP co-branded, SUP a marchio privato
      description: Distribuzione esclusiva paese per paese e collezioni co-branded limitate per aziende qualificate del settore degli sport acquatici.
      icon: tabler:package
      cta: Diventa un Partner
      link: /distributor-program
proof_points:
  title: Fidato dalle aziende idriche di tutto il mondo
  subtitle: Decenni di esperienza nell'ingegneria marina al servizio di programmi SUP redditizi.
  items:
    - metric: Dieci
      label: Anni di esperienza
      detail: Dal 2012
    - metric: Cinquanta
      label: Paesi serviti
      detail: Rete di distribuzione globale
    - metric: '15.000'
      label: Unità prodotte annualmente
      detail: Capacità produttiva certificata CE
    - metric: 100%
      label: Certificato CE
      detail: Conforme a ISO 9001, BSCI, REACH
business_solutions:
  tagline: Come aiutiamo
  title: Il Tuo Partner Dal Concetto al Reddito
  subtitle: Quattro capacità fondamentali che aiutano le aziende idriche a lanciare, gestire e crescere.
  items:
    - title: Attrezzatura professionale
      description: Tavole SUP di qualità commerciale progettate per l'uso giornaliero a noleggio, 500 cicli con minima manutenzione.
      icon: tabler:shield-check
    - title: Collezioni Co-Branded
      description: Collezioni co-branded end-to-end — dalla progettazione all'ingegneria fino alle edizioni limitate create con Afarer, con consegna globale.
      icon: tabler:package
    - title: Supporto alle imprese
      description: Formazione del personale, materiali di marketing, programmi di ricambi e gestione dedicata degli account.
      icon: tabler:headset
    - title: Logistica Globale
      description: FOB Qingdao, CIF principali porti, consegna porta a porta in 50 paesi con supporto doganale.
      icon: tabler:truck-delivery
oem_section:
  tagline: Collezioni Co-Brand
  title: Dall'Idea all'Acqua — Edizioni Co-Branded
  subtitle: 'Per partner che vogliono più di un prodotto da catalogo: collezioni co-branded limitate progettate, ingegnerizzate e costruite con Afarer — mentre ogni tavola resta un prodotto Afarer.'
  steps:
    - number: '01'
      title: Idea e Brief
      desc: Condividi la tua visione, il mercato di riferimento e le specifiche.
    - number: Due
      title: Progettazione e Ingegneria
      desc: Modellazione 3D, selezione dei materiali e progettazione grafica personalizzata.
    - number: Tre
      title: Prototipare e convalidare
      desc: Produzione di campioni con certificazione CE e test di qualità.
    - number: Quattro
      title: Produzione di massa
      desc: Produzione su larga scala con controllo qualità e punti di verifica in ogni fase.
    - number: Cinque
      title: Consegna Globale
      desc: Logistica FOB Qingdao, CIF principali porti, porta a porta.
  cta: Esplora il Co-Branding
  cta_link: /co-brand
cta:
  title: |
    Pronto a configurare la tua <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">prossima barca</span>?
  subtitle: Dicci come userai la tua barca e ti consiglieremo modello, opzioni e prezzo entro un giorno lavorativo.
  actions:
    - variant: primary
      text: Richiedi preventivo
      href: /contact
      icon: tabler:message-circle
    - text: Sfoglia catalogo
      href: /products
distributor:
  tagline: 'Distributori Esclusivi per Paese'
  title: 'Un Paese. Un Distributore Ufficiale Afarer.'
  subtitle: 'Un programma con un distributore per paese: esclusività territoriale, prezzi da dealer, supporto marketing e un Distribution Success Program dedicato.'
  benefits:
    - title: 'Esclusività Territoriale'
      description: 'Un distributore autorizzato per paese o regione — nessuna concorrenza interna, nessun conflitto di canale.'
    - title: 'Margini Diretti di Fabbrica'
      description: 'Listini distributore e rebate annuali su volumi impegnati, spedizione FOB Qingdao.'
    - title: 'Supporto Marketing e Formazione'
      description: 'Materiali co-branded, materiale POS per dealer, formazione prodotto e campagne di lancio.'
    - title: 'Team di Account Dedicato'
      description: 'Un distributor manager personale più onboarding, forecasting e supporto ai riordini.'
  actions:
    - variant: primary
      text: 'Diventa un Distributore'
      href: /distributor-program
    - text: 'Richiedi il Listino Prezzi Rivenditore'
      href: /contact?subject=Dealer Price List
    - text: 'Candidati per la Partnership di Paese'
      href: /contact?subject=Country Partnership Application
    - text: 'Scarica il Programma Distributori'
      href: /distributor-program
  note: 'Ordini campione da 5–10 unità. Ordini di prova 10–30. Dealer autorizzato 30–50. Distributore Paese/Regionale 100–300+.'

meta:
  title: Tavole da Paddle Gonfiabili Afarer | Vai oltre. Rema più forte.
  description: Scopri le tavole da paddle gonfiabili Afarer per paddle all-around, touring, yoga, pesca e avventure all’aperto. Trova il tuo SUP perfetto ed esplora di più sull’acqua.
  keywords:
    - tavola da paddle gonfiabile
    - sup gonfiabile
    - sup all-around
    - sup da touring
    - sup da yoga
    - sup da pesca
    - tavola da paddle famiglia
    - tavola da paddle portatile
hero:
  tagline: Tavole da Paddle Gonfiabili
  title: Tavole da Paddle Gonfiabili per Ogni Avventura
  slogan: Vai oltre. Rema più forte.
  subtitle: Scopri la libertà del paddle con Afarer. Esplora SUP gonfiabili progettati con cura per giornate rilassanti al lago, avventure costiere, fitness e tutto il resto.
  taglineSection: Progettato per ispirare fiducia. Creato per distinguersi.
  actions:
    - variant: primary
      text: Trova la Tua Tavola
      href: /size-guide/
      icon: tabler:compass
    - text: Esplora i SUP
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Perché Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Tavole da paddle gonfiabili Afarer che scivolano su acqua calma all’alba — costruite per ogni avventura
who_we_serve:
  tagline: Rema Con Noi
  title: Trova il Tuo Percorso sull’Acqua
  subtitle: Ogni paddleur ha un’idea diversa di avventura. Scopri un SUP Afarer progettato per il tuo modo di remare.
  items:
    - title: Principianti & Paddleur Ricreativi
      keywords: SUP gonfiabile per principianti, tavola paddle all-around, SUP stabile
      description: Tavole all-around larghe e stabili che rendono naturale la tua prima palata e ti accompagnano mentre progredisci.
      icon: tabler:users
      cta: Trova la Tua Prima Tavola
      link: /all-around-sup/
    - title: Touring & Avventura
      keywords: SUP da touring, tavola paddle lunga distanza, SUP da spedizione
      description: Tavole più lunghe e strette costruite per mantenere la rotta, planare più lontano e trasportare attrezzatura per itinerari di più giorni.
      icon: tabler:building
      cta: Esplora i SUP da Touring
      link: /touring-sup/
    - title: Yoga & Fitness
      keywords: SUP yoga, tavola paddle fitness, SUP largo e stabile
      description: Piattaforme larghe e stabili con spazio per muoversi — per i tuoi flow all’alba, gli allenamenti e l’equilibrio in acque calme.
      icon: tabler:heart
      cta: Esplora il SUP Yoga
      link: /yoga-sup/
    - title: Pesca & Famiglia
      keywords: SUP da pesca, tavola paddle famiglia, piattaforma di pesca stabile
      description: Piattaforme stabili e pratiche per lanciare la lenza, fare gite con i bambini e godersi lunghe giornate rilassanti sull’acqua.
      icon: tabler:users
      cta: Esplora il SUP da Pesca
      link: /fishing-sup/
proof_points:
  title: Testato oltre lo showroom
  subtitle: Design, prestazioni e qualità verificabili — sull'acqua e nei numeri.
  items:
    - metric: 10+
      label: Anni di design per l'acqua
      detail: Dal 2012, perfezionato tavola dopo tavola
    - metric: 50+
      label: Paesi sull'acqua
      detail: Paddler e partner in tutto il mondo
    - metric: 12–15
      label: Nucleo drop-stitch in PSI
      detail: Rigido dove serve, facile da ripiegare
    - metric: 100%
      label: Testato in pressione, tavola per tavola
      detail: Controllato prima della spedizione
business_solutions:
  tagline: Perché Rema Diverso
  title: Prestazioni che Senti alla Prima Palata
  subtitle: Quattro pilastri plasmati dall’acqua vera — prestazioni, design, costruzione e qualità.
  items:
    - title: Prestazioni in Acqua
      description: Forme ottimizzate per stabilità, planata e sicurezza nel moto ondoso — ogni palata resta connessa all’acqua.
      icon: tabler:shield-check
    - title: Design Espressivo
      description: Collezioni ispirate a maree, vita marina ed energia della costa — tavole con cui vuoi farti vedere.
      icon: tabler:package
    - title: Costruzione Provata
      description: Anime drop-stitch ad alta densità, bordi rinforzati e cuciture laminate a fusione per un uso ripetuto.
      icon: tabler:headset
    - title: Qualità Verificata
      description: Testate in pressione, ispezionate visivamente e garantite da una garanzia chiara e un’assistenza post-vendita reattiva.
      icon: tabler:truck-delivery
cta:
  title: Trova la tua prossima tavola.
  subtitle: Che sia la tua prima palata o il percorso più lungo — ti mettiamo sull’acqua.
  actions:
    - variant: primary
      text: Esplora la Collezione
      href: /inflatable-sup/
      icon: tabler:send
    - text: Richiedi il Catalogo
      href: /resources/download-catalog/

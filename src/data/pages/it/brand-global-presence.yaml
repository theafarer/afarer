meta:
  title: 'Presenza Globale — Produttore di SUP per 50+ Paesi | {SITE}'
  description: 'afarer esporta SUP gonfiabili e barche in oltre 50 paesi in tutti i continenti. Produttore e fornitore professionale per marchi, distributori e flotte.'
  keywords:
    - 'produttore globale di SUP'
    - 'esportatore di paddle board'
    - 'fabbrica SUP Cina'
    - 'fornitore professionale di SUP'
hero:
  tagline: Presenza Globale
  title: Servendo oltre 50 paesi<br />In ogni continente
  subtitle: Dagli operatori di pattuglia costiera europea ai distributori australiani di sport acquatici alle squadre di soccorso del Medio Oriente — le barche Afarer sono sull'acqua in tutto il mondo.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: produzione e distribuzione marina globale Afarer
stats:
  title: Portata Globale
  stats:
    - title: Paesi
      amount: '50+'
    - title: Mercati di esportazione
      amount: Europa, Americhe, Asia, Medio Oriente, Oceania
    - title: Produzione
      amount: Qingdao, Cina
    - title: Magazzino USA
      amount: Montclair, CA
features3_markets:
  tagline: Mercati chiave
  title: Competenza regionale<br />per esigenze locali
  subtitle: Comprendiamo che i diversi mercati hanno requisiti normativi, preferenze e casi d'uso differenti.
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa e Regno Unito
      description: CE-certified products. Strong demand for SUP boards across EU markets. UK distributors appreciate our quick turnaround.
      icon: tabler:map-pin
    - title: America del Nord
      description: Produzione approvata dalla Guardia Costiera degli Stati Uniti. Magazzino USA a Montclair, CA per una rapida consegna sulla Costa Ovest. Crescente domanda di barche da pesca, mezzi di soccorso e SUP ricreativi.
      icon: tabler:map-pin
    - title: Australia e Oceania
      description: Strong market for SUP boats and inflatable tenders. Australian distributors value our Hypalon boats for UV resistance in harsh sun conditions. Quick shipping from our Asia facility.
      icon: tabler:map-pin
    - title: Medio Oriente
      description: Growing demand for water adventure equipment. Our commercial-grade SUPs and safety gear are popular with tour operators and rental centers. Custom configurations for high-temperature environments.
      icon: tabler:map-pin
features3_distribution:
  tagline: Rete di distribuzione
  title: Collaborare con i distributori<br />in tutto il mondo
  subtitle: Lavoriamo con distributori di attrezzature marine consolidati, marchi di sport acquatici e agenzie governative di approvvigionamento.
  isBeforeContent: false
  columns: 3
  items:
    - title: Programmi Co-Brand
      description: Produzione a marchio privato per marchi globali di sport acquatici. Gestiamo tutto, dal design alla produzione fino al drop-shipping.
      icon: tabler:building
    - title: Rete di distributori
      description: I distributori autorizzati in 20 paesi hanno stock e forniscono supporto locale. Sono benvenute le richieste di nuovi distributori.
      icon: tabler:users
    - title: Governo e istituzioni
      description: Fornitura diretta a guardie costiere, organizzazioni di ricerca e salvataggio e programmi di approvvigionamento militare. Conformità ai requisiti di approvvigionamento istituzionali.
      icon: tabler:building-community
steps2_logistics:
  title: Logistica Globale e Supporto
  subtitle: Dalla fabbrica alla destinazione — gestiamo l'intera catena di approvvigionamento.
  items:
    - title: Opzioni di spedizione
      description: Trasporto marittimo (FOB Qingdao), trasporto aereo per ordini urgenti e corriere espresso per campioni e pezzi di ricambio.
      icon: tabler:truck-delivery
    - title: Magazzino USA
      description: "Scorte disponibili a Montclair, CA per consegne rapide in tutta l'America del Nord. Costa Ovest: 2-3 giorni, Centro: 3-4 giorni, Costa Est: 4-5 giorni."
      icon: tabler:building-warehouse
    - title: Parti di ricambio
      description: Ricambi e materiali di consumo originali Afarer disponibili tutto l'anno. I pezzi di uso comune vengono spediti entro 24 ore.
      icon: tabler:package
    - title: Supporto tecnico
      description: Linea diretta con il nostro team di ingegneri per domande tecniche, consigli sulla riparazione e supporto per le modifiche. Supportiamo barche che abbiamo costruito 20 anni fa.
      icon: tabler:headset
cta:
  title: Vuoi diventare un distributore?
  subtitle: Stiamo espandendo attivamente la nostra rete di distribuzione. Contatta il nostro team export per discutere le opportunità di collaborazione.
  actions:
    - variant: primary
      text: Richiesta di collaborazione
      href: /contact
    - text: Visualizza la nostra gamma di prodotti
      href: /products

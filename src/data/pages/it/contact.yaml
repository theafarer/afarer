hero_text:
  tagline: Contatti
  title: CONTATTACI
contact_form:
  id: form
  title: Inviaci un messaggio
  subtitle: Per preventivi, domande tecniche o richieste di partnership, scrivici. Rispondiamo entro un giorno lavorativo.
  email_to: info@afarer.com
  submit_button: Invia messaggio
  success_message: Grazie! Il tuo messaggio è stato ricevuto. Ti risponderemo entro un giorno lavorativo.
  error_message: Si è verificato un errore durante l'invio. Riprova o scrivici direttamente via email.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: risolvi il seguente problema'
  fields:
    - name: firstName
      label: Nome
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Cognome
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Azienda
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Indirizzo
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: CAP
      row: 4
      step: 2
    - name: country
      label: Paese
      row: 4
      step: 2
    - name: email
      label: Email
      row: 5
      step: 2
    - name: tel
      label: Telefono
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Volume d'ordine stimato
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Necessita personalizzazione?
      row: 7
      step: 2
    - name: productInterest
      label: Categorie di prodotti di interesse
      row: 8
      step: 2
    - name: subject
      label: Oggetto
      row: 9
      step: 3
    - name: message
      label: Messaggio
      row: 10
      type: textarea
      rows: 6
      step: 3

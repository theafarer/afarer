meta:
  title: 'Contatti — Richieste di Partnership e Prodotti | {SITE}'
  description: 'Contatta afarer per richieste di partnership, co-brand e private label o flotte professionali. Produttore di SUP gonfiabili e barche, rispondiamo entro 2 giorni lavorativi.'
  keywords:
    - 'contattare afarer'
    - 'preventivo distributore SUP'
    - 'fornitore professionale di SUP'
    - 'contattare produttore SUP'
hero_text:
  tagline: Contatti
  title: CONTATTACI
contact_form:
  id: form
  title: Inviaci un messaggio
  subtitle: Per preventivi, domande tecniche o richieste di partnership, scrivici. Rispondiamo entro un giorno lavorativo.
  email_to: info@afarer.com
  submit_button: Invia la richiesta → Ottieni un preventivo
  success_message: Grazie! Il tuo messaggio è stato ricevuto. Ti risponderemo entro un giorno lavorativo.
  error_message: Si è verificato un errore durante l'invio. Riprova o scrivici direttamente via email.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: risolvi il seguente problema'
  fields:
    - name: country
      label: Paese
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: "Volume d'ordine stimato"
      row: 2
      type: select
      options:
        - value: ''
          label: Seleziona il tuo volume stimato...
        - value: sample
          label: Solo campioni / prototipi
        - value: '5-10'
          label: 5–10 unità (MOQ standard)
        - value: '100-500'
          label: 100–500 unità
        - value: '500-plus'
          label: 500+ unità (Prezzo a volume)
      step: 1
    - name: customization
      label: Necessita personalizzazione?
      row: 3
      type: select
      options:
        - value: ''
          label: Seleziona il tipo di personalizzazione...
        - value: none
          label: Prodotto standard (nessuna personalizzazione)
        - value: logo
          label: Solo logo / branding personalizzato
        - value: full
          label: Co-Brand completo (dimensione, colore, grafica, confezione)
        - value: consultation
          label: Non sicuro — serve una consulenza
      step: 1
    - name: productInterest
      label: Categorie di prodotti di interesse
      row: 4
      type: select
      options:
        - value: ''
          label: Seleziona categoria di prodotto...
        - value: all
          label: Tutti i prodotti / Catalogo completo
        - value: sup
          label: Tavole SUP / Tavole da paddle
        - value: safety
          label: Attrezzatura di sicurezza / Giubbotti di salvataggio
        - value: accessory
          label: Accessori (pompe, remi, borse)
      step: 1
    - name: firstName
      label: Nome
      row: 1
      step: 2
    - name: lastName
      label: Cognome
      row: 1
      step: 2
    - name: companyName
      label: Azienda
      row: 2
      step: 2
    - name: email
      label: Email
      row: 3
      type: email
      step: 2
    - name: tel
      label: Telefono
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: Indirizzo
      row: 4
      step: 2
    - name: zip
      label: CAP
      row: 5
      step: 2
    - name: subject
      label: Oggetto
      row: 1
      step: 3
    - name: message
      label: Messaggio
      row: 2
      type: textarea
      rows: 6
      step: 3

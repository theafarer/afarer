meta:
  title: Soluzioni per flotte di SUP da resort | {SITE}
  description: Soluzioni complete per flotte di SUP per resort e hotel. Tavole di grado commerciale, personalizzazione del marchio, formazione del personale e pacchetti ottimizzati per il ROI da 20 a 100 tavole.
hero:
  tagline: Resort e Hotel
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Ospiti del resort che si godono il SUP su una spiaggia incontaminata
roi_section:
  title: Il modello di ricavi del Resort SUP
  subtitle: Come i resort generano un reddito annuo da noleggio SUP di 50.000 - 200.000 dollari con un unico investimento.
  metrics:
    - metric: $50.000–$200.000
      label: Ricavi annuali da SUP
      detail: Per resort, basato sulla dimensione della flotta e sull'occupazione
    - metric: 4–6 mesi
      label: Periodo Medio di Rientro
      detail: Recuperare l'intero investimento della flotta in una stagione
    - metric: 40%
      label: Aumento dei ricavi
      detail: Aumento medio dopo il passaggio alle flotte Afarer
    - metric: Cinquecento
      label: Cicli di Noleggio Per Tavola
      detail: Resistenza di livello commerciale per l'uso quotidiano
packages:
  title: Sistema di Pacchetto Resort
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - Garanzia di 12 mesi + Certificato CE
      revenue: Potenziale di guadagno annuale da $50.000 a $80.000
      cta_text: Ottieni il pacchetto iniziale
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 50 pagaie + 50 giubbotti di salvataggio
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - Sessione di formazione del personale (online)
        - Garanzia di 12 mesi + Certificato CE
      revenue: Potenziale di ricavi annuali da $120.000 a $200.000
      popular: true
      cta_text: Ottieni il pacchetto Premium
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - Responsabile account dedicato
        - Ricambi prioritari (spedizione 24 ore)
        - Custom branding + logo
        - Pacchetto foto/video per marketing
        - Garanzia di 24 mesi + Certificato CE
      revenue: Potenziale di ricavo annuale di $200.000
      cta_text: Ottieni il pacchetto di punta
case_study:
  quote: Da quando siamo passati a Afarer, il nostro fatturato degli affitti SUP è aumentato del 40%. I costi di sostituzione delle tavole sono diminuiti del 60%. Abbiamo recuperato l'investimento dell'intera flotta in 4 mesi.
  author: Responsabile delle Attività Acquatiche
  location: Resort a 5 stelle, Maldive
  results:
    - label: Crescita dei ricavi
      value: 40%
    - label: Riduzione dei costi
      value: '-60%'
    - label: Periodo di recupero
      value: 4 Mesi
features:
  title: Perché i resort scelgono Afarer
  subtitle: Durata di livello commerciale, logistica globale e un partner che comprende l'ospitalità.
  items:
    - title: 500 cicli di noleggio
      description: Ogni tavola è testata per resistere a 500 cicli di noleggio in acqua salata, sole e sabbia.
      icon: tabler:shield-check
    - title: Spedizione dei pezzi in 48 ore
      description: 'I pezzi di ricambio vengono spediti entro 48 ore: il tuo reddito da noleggio non si ferma mai.'
      icon: tabler:truck-delivery
    - title: Branding personalizzato
      description: Abbina l'identità del tuo resort con colori personalizzati e logo su ogni tavola.
      icon: tabler:palette
    - title: Formazione del personale
      description: Programmi di formazione online e in sede per il tuo team di attività.
      icon: tabler:school
    - title: Logistica Globale
      description: Spedizione in 50 paesi con opzioni di trasporto consolidate.
      icon: tabler:world
    - title: Certificato CE
      description: Tutte le attrezzature sono certificate CE, ISO 9001:2015 — sicurezza e qualità garantite.
      icon: tabler:certificate
cta:
  title: Ready to upgrade your guest experience?
  subtitle: Ricevi il preventivo del tuo pacchetto resort o scarica il nostro catalogo completo dei resort.
  actions:
    - text: Prenota il pacchetto resort
      href: /contact?package=resort
      variant: primary
    - text: Scarica il catalogo dei resort
      href: /resources/download-catalog
      variant: secondary

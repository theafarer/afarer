hero:
  tagline: Guide
  title: Nuovo al SUP?
  subtitle: Guide pratiche per aiutarti a scegliere, usare e goderti le tavole SUP gonfiabili.
size_guide:
  tagline: Dimensioni e specifiche
  title: Trova la taglia giusta per le tue esigenze
  desc: Confronta le dimensioni delle tavole SUP, le capacità di peso e gli usi consigliati. Che tu abbia bisogno di un SUP da touring, di una tavola per yoga o di un SUP versatile, la nostra guida alle taglie ti aiuta a scegliere quella giusta.
  link_label: Guida a grandezza naturale con specifiche del prodotto →
  link: /size-guide
  cards:
    - title: Tavole SUP
      desc: Scegli la lunghezza in base al peso e all'uso previsto. Le tavole più larghe (32") offrono maggiore stabilità. Le tavole più lunghe (11–12 ft) sono più adatte al touring.
    - title: SUP da touring
      desc: Tavole più lunghe (11–12 ft) per coprire distanze e seguire linee dritte. Abbastanza stabili per il touring con l'attrezzatura. Controllare sempre la capacità di carico.
    - title: SUP tuttofare
      desc: Scegli la lunghezza in base al peso del cavaliere e l'uso. Tavole più larghe (32") per la stabilità. Versatile per il tempo libero e il fitness.

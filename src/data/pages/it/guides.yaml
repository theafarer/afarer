meta:
  title: 'Guide SUP — Comprare, Scegliere, Praticare | {SITE}'
  description: 'Guide SUP di afarer: come comprare, scegliere e praticare il paddle boarding. Misure, materiali e consigli di esperti per principianti e professionisti.'
  keywords:
    - "guida all'acquisto SUP"
    - 'come scegliere un SUP'
    - 'guida alle misure SUP'

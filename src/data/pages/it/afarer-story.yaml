  quality:
    title: Impegno per la qualità
    body: Dall'ispezione dei materiali ai test finali, afarer mantiene processi di qualità sistematici per fornire prodotti marini affidabili. Ogni unità viene sottoposta a test di pressione, ispezione delle giunture e verifica delle prestazioni prima della spedizione.
    items:
      - CE Certified — Tutti i prodotti soddisfano gli standard di sicurezza europei
      - ISO 9001:2015 — Sistema di gestione qualità certificato
      - UKCA Marked — Conformità per il mercato britannico
      - FCC Compliant — Conformità dei componenti elettronici negli Stati Uniti
  global:
    title: Presenza globale
    body: afarer serve clienti in molteplici mercati globali, supportando distributori, marchi outdoor e utenti marini professionali in oltre 50 paesi in Europa, Asia-Pacifico, Americhe, Medio Oriente e Africa.

timeline:
  - year: Duemiladodici
    title: Fondazione della produzione marina
    body: afarer è nata come officina specializzata in imbarcazioni gonfiabili a Qingdao, Cina, dedicata all'artigianato marino e alla produzione di gommoni. L'attenzione iniziale era sulla costruzione di prodotti gonfiabili affidabili attraverso esperienza pratica di ingegneria e disciplina produttiva.
  - year: Duemilaquindici
    title: Prima esportazione e certificazione CE
    body: I primi ordini di esportazione hanno raggiunto Giappone e Corea. La certificazione CE è stata ottenuta per le linee di prodotti principali, segnando l'ingresso di afarer nei mercati internazionali. L'azienda ha iniziato a servire utenti commerciali e ricreativi oltre la Cina.
  - year: Duemiladiciotto
    title: Espansione della fabbrica
    body: Trasferimento in un impianto di produzione di 12.000 m². Aggiunte linee di saldatura RF e capacità produttiva drop-stitch, consentendo una produzione su larga scala e sistemi di controllo qualità migliorati.
  - year: Duemilaventi
    title: Centro R&S istituito
    body: Apertura di un centro R&S dedicato con laboratorio tessuti PVC, vasca di prova idrodinamica e studio di simulazione CAD/FEA. Lo sviluppo prodotto si è concentrato sulla costruzione leggera, la durata migliorata e il design incentrato sull'utente.
  - year: Duemilaventidue
    title: Certificazione e crescita globale
    body: Conseguimento della certificazione ISO 9001. Espansione a 14 ingegneri R&S e 200+ lavoratori. I prodotti hanno raggiunto clienti in Europa, Americhe e Asia-Pacifico attraverso partnership di distribuzione e co-brand.
  - year: Duemilaventiquattro
    title: Studio di innovazione e design
    body: Lancio di uno studio di design e innovazione a servizio completo per progetti co-brand personalizzati, dal concept alla produzione. Rafforzamento delle applicazioni marine professionali, inclusi appalti di salvataggio, commerciali e governativi.
  - year: Duemilaventisei
    title: Costruire il futuro dell'esplorazione acquatica
    body: Oggi, afarer continua a sviluppare gommoni, sistemi SUP e soluzioni marine personalizzate — connettendo persone e organizzazioni con le acque del mondo. Oltre 50 paesi serviti, capacità annuale di oltre 15.000 unità.
content_founding:
  tagline: L'inizio
  title: Nato sul lungomare
  subtitle: "afarer è nata in un'officina costiera a Qingdao con una barca e una visione: costruire imbarcazioni gonfiabili in grado di resistere a reali condizioni marine."
  paragraphs:
    - Nel 2012, i nostri fondatori hanno visto un vuoto nel mercato — la maggior parte dei gommoni erano economici ma inaffidabili, o di alta qualità ma proibitivamente costosi. Credevano che ci fosse spazio per un produttore che offrisse sia qualità che valore.
    - Il primo scafo è stato costruito a mano, testato in acque locali e perfezionato in base ai feedback reali di pescatori e piccoli operatori commerciali. Quel ciclo di feedback — costruire, testare, ascoltare, migliorare — rimane al centro della nostra filosofia ingegneristica oggi.
    - Entro il 2015, la voce si era diffusa oltre Qingdao. I distributori internazionali hanno iniziato a richiedere campioni. Quello che era iniziato come un'officina locale stava diventando un fornitore globale.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Officina di produzione e fabbricazione dei primi anni di afarer
content_growth:
  tagline: Crescita e innovazione
  title: Dall'officina a un impianto di 12.000 m²
  subtitle: L'investimento continuo in persone, attrezzature e processi ha trasformato afarer in un moderno impianto di produzione marina.
  paragraphs:
    - Con la crescita della domanda, è cresciuto anche il nostro impianto. Ci siamo espansi da una piccola officina a una fabbrica di 12.000 m² con linee di produzione dedicate per gommoni SUP, imbarcazioni gonfiabili, tavole SUP e accessori.
    - Abbiamo investito in macchine da taglio CNC, saldatrici ad alta frequenza, linee di produzione drop-stitch e banchi prova completi — permettendoci di controllare ogni aspetto della qualità produttiva.
    - Oggi, il nostro team di oltre 200 persone include ingegneri navali, scienziati dei materiali, specialisti del controllo qualità e artigiani qualificati — molti dei quali sono con afarer fin dai primi giorni.
philosophy:
  tagline: Filosofia del marchio
  title: Ingegneria della Libertà sull'Acqua
  body: La libertà sull'acqua non riguarda solo il movimento. Rappresenta scoprire nuovi luoghi, creare esperienze all'aria aperta, connettere le persone con la natura e consentire missioni professionali. L'ingegneria rende possibile quella libertà.
  pillars:
    - title: Affidabilità prima di tutto
      body: Gli ambienti acquatici richiedono fiducia. I prodotti afarer sono progettati per stabilità, durata, sicurezza e prestazioni costanti.
    - title: Design incentrato sull'uomo
      body: I prodotti dovrebbero servire le persone, non la tecnologia. Ogni decisione di design inizia con la comprensione di come le persone usano le imbarcazioni, dove esplorano e quali sfide affrontano.
    - title: Esplorazione accessibile
      body: L'acqua non dovrebbe appartenere solo agli esperti. afarer crea attrezzature che permettono a più persone di vivere in sicurezza fiumi, laghi, oceani e ambienti costieri.
    - title: Innovazione continua
      body: L'innovazione non significa solo creare nuovi prodotti. Significa migliorare ogni dettaglio — materiali, strutture, produzione ed esperienza utente.
engineeringDna:
  tagline: DNA ingegneristico
  title: Come afarer crea prodotti
  areas:
    - title: Scienza dei materiali
      body: afarer si concentra sulla selezione di materiali appropriati per diversi ambienti marini. Le considerazioni chiave includono resistenza all'abrasione, resistenza ai raggi UV, stabilità alla pressione e durata a lungo termine.
      items:
        - Resistenza all'abrasione
        - Resistenza UV
        - Stabilità alla pressione
        - Durata a lungo termine
    - title: Ingegneria strutturale
      body: Le imbarcazioni gonfiabili richiedono un equilibrio preciso tra rigidità, peso, portabilità e stabilità. L'ingegneria afarer si concentra sull'ottimizzazione di questi fattori attraverso la tecnologia drop-stitch e la costruzione avanzata delle giunture.
      items:
        - Rigidità
        - Ottimizzazione del peso
        - Portabilità
        - Stabilità
    - title: Precisione di produzione
      body: 'Ogni prodotto passa attraverso processi controllati: preparazione dei materiali, taglio di precisione, saldatura e incollaggio, assemblaggio, ispezione qualità e verifica delle prestazioni.'
      items:
        - Preparazione materiali
        - Taglio di precisione
        - Saldatura e incollaggio
        - Assemblaggio e CQ
    - title: Ingegneria degli scenari d'uso
      body: I prodotti sono sviluppati attorno ad applicazioni reali — svago, avventura e uso professionale — garantendo che ogni progetto soddisfi le richieste specifiche del suo ambiente previsto.
      items:
        - Svago
        - Avventura
        - Professionale
        - Commerciale

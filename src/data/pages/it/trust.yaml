faqs_rib:
  title: 'FAQ SUP'
  subtitle: 'Domande comuni sui nostri gommoni a scafo rigido.'
  columns: 2
  items:
    - title: 'Quali dimensioni di SUP offre afarer?'
      description: 'Offriamo 35 modelli SUP da 2,5 m a 7,6 m, coprendo dai piccoli tender alle imbarcazioni da lavoro e pattuglia pesanti. Ogni modello è disponibile con multiple opzioni di configurazione.'
    - title: 'Qual è la differenza tra un SUP e un gommone tradizionale?'
      description: "Un SUP (Rigid-Hull Inflatable Boat) combina uno scafo solido in fibra di vetro o alluminio a V profondo con tubolari gonfiabili in Hypalon o PVC. Questo offre la stabilità e capacità di carico di una barca rigida con l'assorbimento degli urti e la galleggiabilità di un gonfiabile."
    - title: 'Quali motori sono compatibili con i SUP afarer?'
      description: "I nostri SUP supportano motori fuoribordo da 3 HP a 250 HP a seconda del modello. Ogni pagina prodotto elenca la potenza massima del motore. Raccomandiamo di consultare il tuo rivenditore per l'abbinamento ideale."
    - title: 'I SUP afarer sono certificati CE?'
      description: 'Sì. Tutti i modelli SUP da diporto sono certificati CE secondo gli standard europei applicabili per imbarcazioni da diporto. I modelli commerciali e da pattuglia soddisfano requisiti aggiuntivi di stabilità e carico.'
    - title: 'Qual è la garanzia sui gommoni SUP?'
      description: 'Tutti i SUP afarer sono forniti con una garanzia standard di un anno contro difetti di fabbricazione, coprendo delaminazione dello scafo, cedimento delle giunture dei tubolari, difetti delle valvole e problemi di ferramenta.'
    - title: "Quante camere d'aria hanno i SUP afarer?"
      description: "I nostri SUP hanno da 3 a 7 camere d'aria indipendenti a seconda della lunghezza del modello. Questo design multi-camera garantisce che l'imbarcazione rimanga a galla anche se un compartimento è compromesso."

faqs_inflatable:
  title: 'FAQ Gommoni'
  subtitle: 'Domande comuni sui nostri SUP, SUP e imbarcazioni gonfiabili.'
  columns: 2
  items:
    - title: 'Quali materiali sono usati nei gommoni afarer?'
      description: "Usiamo PVC di grado militare (1100 denier) e gomma Hypalon/CSM premium, a seconda del modello. Entrambi i materiali sono stabilizzati UV, resistenti all'abrasione e conformi ai regolamenti UE REACH e RoHS."
    - title: 'Quanto durano i gommoni?'
      description: 'Con cura adeguata, un gommone in PVC di qualità dura 7—0 anni, mentre i modelli in Hypalon possono durare 15—0 anni. Pulizia regolare, protezione UV e conservazione appropriata prolungano significativamente la vita utile.'
    - title: 'Quale manutenzione è richiesta per un gommone?'
      description: "La manutenzione di base include risciacquo con acqua dolce dopo ogni uso (specialmente in acqua salata), asciugatura prima della conservazione, controllo annuale delle guarnizioni delle valvole e applicazione di protezione UV sui tubolari. Evitare l'esposizione prolungata al sole quando non in uso."
    - title: 'I gommoni possono essere usati in acqua salata?'
      description: "Sì. Tutti i gommoni afarer sono progettati per uso sia in acqua dolce che salata. Raccomandiamo di risciacquare con acqua dolce e asciugare completamente dopo l'esposizione all'acqua salata per prevenire corrosione della ferramenta e cristallizzazione del sale nel tessuto."
    - title: 'Come conservare un gommone?'
      description: "Sgonfia, pulisci e asciuga completamente l'imbarcazione prima della conservazione. Arrotola senza stringere (evita pieghe strette), conserva in un luogo fresco e asciutto lontano dalla luce solare diretta e lontano da pavimenti in cemento per prevenire l'assorbimento di umidità."
    - title: 'Qual è la capacità di peso dei gommoni afarer?'
      description: 'Le capacità di peso vanno da 290 kg per i nostri modelli più piccoli a oltre 2000 kg per le imbarcazioni commerciali più grandi. Ogni pagina prodotto elenca il carico massimo per il tuo modello specifico.'

faqs_sup:
  title: 'FAQ SUP'
  subtitle: 'Domande comuni sulle nostre tavole da stand-up paddle.'
  columns: 2
  items:
    - title: 'Quali misure di SUP sono disponibili?'
      description: "Offriamo tavole SUP da 9 ft a 12 ft, inclusi design all-round, da touring, yoga e speciali. I nostri modelli più venduti includono la Tropical Breeze (10 ft) e l'Ocean Voyager (11 ft)."
    - title: "Cos'è la costruzione drop-stitch?"
      description: "La costruzione drop-stitch utilizza migliaia di fili di poliestere che collegano gli strati superiore e inferiore della tavola, permettendole di mantenere alta pressione d'aria (15—0 PSI) e ottenere una piattaforma rigida e stabile. Questo è lo standard industriale per i SUP gonfiabili premium."
    - title: 'Qual è il limite di peso per le tavole SUP?'
      description: 'Le nostre tavole SUP supportano fino a 150 kg a seconda del modello e del volume. La Leviathan Wake è il nostro modello a più alta capacità, progettato per ciclisti più pesanti e uso yoga.'
    - title: 'Offrite pacchetti SUP completi?'
      description: 'Sì. Ogni tavola SUP viene spedita con un pacchetto completo che include pagaia in alluminio a 3 pezzi, pompa manuale ad alta pressione, leash a spirale, zaino da viaggio e kit di riparazione. Alcuni modelli includono anche un set di pinne rimovibili.'
    - title: 'Qual è la garanzia sulle tavole SUP?'
      description: 'Tutte le tavole SUP afarer hanno una garanzia di un anno contro difetti di fabbricazione, inclusi cedimento delle giunture, difetti delle valvole e delaminazione dei materiali in condizioni di uso normale.'
    - title: 'Quanto tempo ci vuole per gonfiare una tavola SUP?'
      description: 'Usando la pompa manuale inclusa, un gonfiaggio completo a 15 PSI richiede circa 8—2 minuti. Per un gonfiaggio più rapido, raccomandiamo la nostra pompa elettrica afarer 12V, che gonfia una tavola in meno di 4 minuti.'


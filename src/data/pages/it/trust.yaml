      description: Siamo certificati BSCI, garantendo pratiche lavorative etiche, condizioni di lavoro sicure e responsabilità ambientale in tutta la nostra catena di fornitura.
      icon: tabler:users
    - title: REACH e RoHS
      description: Tutti i materiali —PVC, Hypalon, schiuma EVA, adesivi —sono conformi ai regolamenti UE REACH e RoHS. Niente sostanze vietate, niente compromessi.
      icon: tabler:flask
    - title: Laboratorio Test Materiali
      description: Il nostro laboratorio interno testa resistenza a trazione, resistenza UV, integrità delle giunture e abrasione per ogni lotto di tessuto prima della produzione.
      icon: tabler:microscope
    - title: Garanzia 2 Anni
      description: Ogni prodotto afarer viene fornito con una garanzia di due anni contro difetti di fabbricazione. Sosteniamo ciò che costruiamo.
      icon: tabler:shield-check

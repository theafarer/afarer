faqs_sup:
  title: FAQ SUP
  subtitle: Domande comuni sulle nostre tavole da stand-up paddle.
  columns: 2
  items:
    - title: Quali misure di SUP sono disponibili?
      description: Offriamo tavole SUP da 9 ft a 12 ft, inclusi design all-round, da touring, yoga e speciali. I nostri modelli più venduti includono la Tropical Breeze (10 ft) e l'Ocean Voyager (11 ft).
    - title: Cos'è la costruzione drop-stitch?
      description: La costruzione drop-stitch utilizza migliaia di fili di poliestere che collegano gli strati superiore e inferiore della tavola, permettendole di mantenere alta pressione d'aria (15—0 PSI) e ottenere una piattaforma rigida e stabile. Questo è lo standard industriale per i SUP gonfiabili premium.
    - title: Qual è il limite di peso per le tavole SUP?
      description: Le nostre tavole SUP supportano fino a 150 kg a seconda del modello e del volume. La Leviathan Wake è il nostro modello a più alta capacità, progettato per ciclisti più pesanti e uso yoga.
    - title: Offrite pacchetti SUP completi?
      description: Sì. Ogni tavola SUP viene spedita con un pacchetto completo che include pagaia in alluminio a 3 pezzi, pompa manuale ad alta pressione, leash a spirale, zaino da viaggio e kit di riparazione. Alcuni modelli includono anche un set di pinne rimovibili.
    - title: Qual è la garanzia sulle tavole SUP?
      description: Tutte le tavole SUP afarer hanno una garanzia di un anno contro difetti di fabbricazione, inclusi cedimento delle giunture, difetti delle valvole e delaminazione dei materiali in condizioni di uso normale.
    - title: Quanto tempo ci vuole per gonfiare una tavola SUP?
      description: Usando la pompa manuale inclusa, un gonfiaggio completo a 15 PSI richiede circa 8—2 minuti. Per un gonfiaggio più rapido, raccomandiamo la nostra pompa elettrica afarer 12V, che gonfia una tavola in meno di 4 minuti.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

features3_certifications:
  title: Certificazioni & Conformità
  subtitle: Ogni prodotto è testato e certificato in modo indipendente secondo standard internazionali.
  columns: 3
  isBeforeContent: true
  items:
    - title: Certificazione CE
      description: Tutti i SUP, SUP, SUP e SUP afarer soddisfano lo standard di sicurezza CE europeo per imbarcazioni da diporto. Ogni prodotto subisce test di pressione, galleggiabilità e carico prima di lasciare la fabbrica.
      icon: tabler:certificate
    - title: ''
      description: Il nostro impianto di 12.000 m² a Qingdao opera sotto un sistema di gestione qualità ISO 9001. Ogni lotto di produzione è tracciabile, documentato e ispezionato.
      icon: tabler:clipboard-check

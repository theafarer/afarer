warranty_section:
  title: Garanzia e Assistenza Post-Vendita
  subtitle: Supportiamo ogni prodotto con termini di garanzia chiari, elaborazione rapida delle richieste e parti di ricambio originali.
  items:
    - title: Garanzia del prodotto di 2 anni
      desc: Tutti i prodotti afarer sono coperti da una garanzia di 2 anni contro i difetti di fabbricazione — rottura delle cuciture, difetti delle valvole e delaminazione del materiale durante l'uso normale.
    - title: Supporto Parti a Vita
      desc: Ricambi originali — valvole, kit di riparazione, alette, anelli a D — disponibili per tutti i modelli. Manteniamo stampi e utensili per un minimo di 5 anni dopo la fine della produzione.
    - title: Risposta alla richiesta entro 48 ore
      desc: Le richieste di garanzia vengono riconosciute entro 48 ore. Le schede sostitutive vengono spedite entro 10 giorni lavorativi per le richieste approvate.
    - title: Rete Globale di Riparazione
      desc: Centri di riparazione autorizzati in 15 paesi. Kit di riparazione sul campo disponibili per operazioni remote. Guide di riparazione fai-da-te per danni minori.
    - title: Assistenza Clienti OEM
      desc: Account manager dedicati per partner B2B. Revisioni aziendali trimestrali, pianificazione dell'inventario e supporto marketing co-branded.
    - title: Pacchetto di certificazione
      desc: Documentazione di piena conformità fornita con ogni spedizione — Dichiarazione CE, rapporti di prova, schede di sicurezza dei materiali.
      link: /contact

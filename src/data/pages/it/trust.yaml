faqs_sup:
  title: FAQ SUP
  subtitle: Domande comuni sulle nostre tavole da stand-up paddle.
  columns: 2
  items:
    - title: Quali misure di SUP sono disponibili?
      description: Offriamo tavole SUP da 9 ft a 12 ft, inclusi design all-round, da touring, yoga e speciali. I nostri modelli più venduti includono la Tropical Breeze (10 ft) e l'Ocean Voyager (11 ft).
    - title: Cos'è la costruzione drop-stitch?
      description: >-
        La costruzione drop-stitch utilizza migliaia di fili di poliestere che collegano gli strati superiore e inferiore della tavola, permettendole di mantenere alta pressione d'aria (15–20 PSI) e ottenere una piattaforma rigida e stabile. Questo è lo standard industriale per i SUP gonfiabili
        premium.
    - title: Qual è il limite di peso per le tavole SUP?
      description: Le nostre tavole SUP supportano fino a 150 kg a seconda del modello e del volume. La Leviathan Wake è il nostro modello a più alta capacità, progettato per ciclisti più pesanti e uso yoga.
    - title: Offrite pacchetti SUP completi?
      description: Sì. Ogni tavola SUP viene spedita con un pacchetto completo che include pagaia in alluminio a 3 pezzi, pompa manuale ad alta pressione, leash a spirale, zaino da viaggio e kit di riparazione. Alcuni modelli includono anche un set di pinne rimovibili.
    - title: Qual è la garanzia sulle tavole SUP?
      description: Tutte le tavole SUP afarer hanno una garanzia di un anno contro difetti di fabbricazione, inclusi cedimento delle giunture, difetti delle valvole e delaminazione dei materiali in condizioni di uso normale.
    - title: Quanto tempo ci vuole per gonfiare una tavola SUP?
      description: Usando la pompa manuale inclusa, un gonfiaggio completo a 15 PSI richiede circa 8–12 minuti. Per un gonfiaggio più rapido, raccomandiamo la nostra pompa elettrica afarer 12V, che gonfia una tavola in meno di 4 minuti.
faqs_materials:
  title: Materiali SUP e Domande Frequenti sulla Cura
  subtitle: Domande comuni sui materiali dei nostri SUP gonfiabili, la loro cura e conservazione.
  columns: 2
  items:
    - title: Quali materiali vengono utilizzati nei SUP gonfiabili Afarer?
      description: Utilizziamo PVC di grado militare (1100 denari) con costruzione stabilizzata ai raggi UV e resistente all'abrasione, conforme alle normative UE REACH e RoHS.
    - title: Quanto durano gli SUP gonfiabili?
      description: Con la cura adeguata, un SUP gonfiabile in PVC di qualità dura 5-10 anni. La pulizia regolare, la protezione dai raggi UV e la corretta conservazione ne prolungano significativamente la durata.
    - title: Quale manutenzione è richiesta per un SUP gonfiabile?
      description: La manutenzione di base include il risciacquo con acqua dolce dopo ogni uso (specialmente in acqua salata), l'asciugatura prima della conservazione, il controllo annuale delle guarnizioni delle valvole e l'evitare esposizioni prolungate al sole quando non in uso.
    - title: Le tavole SUP gonfiabili possono essere utilizzate in acqua salata?
      description: Sì. Tutti i SUP gonfiabili Afarer sono progettati sia per l'uso in acqua dolce che in acqua salata. Si consiglia di risciacquare con acqua dolce e asciugare accuratamente dopo l'esposizione all'acqua salata.
    - title: Come si conserva un SUP gonfiabile?
      description: >-
        Sgonfiare, pulire e asciugare completamente la tavola prima della conservazione. Arrotolare allentatamente (evitare piegature strette), conservare in un luogo fresco e asciutto lontano dalla luce solare diretta e tenere lontano dai pavimenti in cemento per prevenire l'assorbimento di
        umidità.
    - title: Qual è la capacità di peso dei SUP gonfiabili Afarer?
      description: Le capacità di peso variano da 100 kg per i nostri modelli più piccoli a oltre 200 kg per le tavole più grandi. Ogni pagina del prodotto indica la portata massima del modello specifico.

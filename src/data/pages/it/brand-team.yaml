meta:
  title: 'Il Nostro Team — Ingegneri Navali e Costruttori | {SITE}'
  description: 'Fondata nel 2012 a Qingdao, afarer è stata costruita da ingegneri navali, scienziati dei materiali e appassionati di sport acquatici. Scopri il team dietro la fabbrica.'
  keywords:
    - 'team afarer'
    - 'ingegneri navali'
    - 'produttore di SUP gonfiabili'
    - 'team della fabbrica SUP'
hero:
  tagline: La nostra squadra
  title: Le persone dietro afarer<br />— Ingegneria della libertà sull'acqua
  subtitle: Fondata nel 2012 a Qingdao, in Cina, afarer è stata creata da ingegneri navali, scienziati dei materiali e appassionati di sport acquatici che credevano nell'accessibilità a livello mondiale di imbarcazioni gonfiabili di qualità professionale.
  image:
    src: /images/team-all.webp
    alt: Foto di squadra completa di Afarer — ingegneria, produzione e leadership
founding:
  tagline: La nostra fondazione
  title: Da un laboratorio costiero<br />a una struttura di 12.000 m²
  subtitle: Afarer è stata fondata da un team di ingegneri marini con decenni di esperienza combinata nella progettazione di barche gonfiabili, nella fabbricazione di PVC/Hypalon e nella produzione di attrezzature marine a livello globale.
  items:
    - title: 'Fondato: 2012'
      description: Fondata a Qingdao, in Cina — un importante centro marittimo con una profonda tradizione cantieristica.
      icon: tabler:calendar
    - title: 200 dipendenti
      description: Inclusi 50 ingegneri di R&S, specialisti del controllo qualità e tecnici di produzione.
      icon: tabler:users
    - title: Struttura di 12.000 m²
      description: Stabilimento produttivo dedicato con 6 linee di produzione per RIB, gommoni e tavole SUP.
      icon: tabler:building-factory
    - title: Oltre 50 paesi serviti
      description: Esportazione in Europa, Americhe, Medio Oriente, Asia-Pacifico e Africa.
      icon: tabler:globe
leadership:
  tagline: Leadership
  title: Gestione e Leadership Ingegneristica
  subtitle: Il nostro team di leadership riunisce una profonda competenza in ingegneria marina, commercio internazionale e gestione della qualità.
  columns: 3
  items:
    - title: Fondatore e CEO
      name: Toby Liu
      description: 15 anni nella produzione marina. In precedenza ha guidato la R&S presso un importante produttore cinese di barche. Detiene diversi brevetti nel design di barche gonfiabili.
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: Capo Ingegnere
      name: Zhang Wei
      description: 20 anni nella fabbricazione di PVC/Hypalon e nella progettazione di scafi a V profonda. Ex direttore tecnico presso un'azienda europea di ingegneria marina.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Responsabile R&S
      name: Chen Ming
      description: Dottorato in Scienza dei Materiali. Specializzato in tecnologia drop-stitch e processi di saldatura ad alta frequenza. 10 anni nei compositi tessili.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Direttore di Produzione
      name: Liu Qiang
      description: 18 anni nella produzione snella e nell'ottimizzazione delle linee di produzione. Six Sigma Black Belt. Implementato sistemi di qualità ISO 9001.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Responsabile della qualità
      name: Wang Fang
      description: 12 anni nel controllo qualità marino. Auditor certificato CE e ISO. Supervisiona i test per ogni lotto di produzione.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Direttore Vendite e Operazioni
      name: Helen Lee
      description: 15 anni nel commercio B2B internazionale. Gestito partnership co-brand e di distribuzione in oltre 30 paesi. Fluente in 4 lingue.
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Filosofia del design
  title: Design Guidato dall'Ingegneria<br />— Ogni Dettaglio Conta
  subtitle: La nostra filosofia ingegneristica si concentra su tre principi che guidano ogni prodotto che realizziamo.
  list:
    - 'Affidabilità prima di tutto: ogni prodotto afarer è testato per resistere alle condizioni del mondo reale — dalle operazioni di soccorso in acque fredde agli affitti in resort tropicali. Progettiamo in eccesso dove conta di più.'
    - 'Precisione nella produzione: Le nostre strutture utilizzano taglio CNC, saldatura ad alta frequenza e test di pressione automatizzati. Ogni cucitura, ogni valvola, ogni raccordo soddisfa le specifiche documentate.'
    - 'Innovazione continua: Il nostro team di R&S valuta continuamente nuovi materiali, metodi di produzione e miglioramenti del design. Non aspettiamo i problemi — li anticipiamo.'
cta:
  title: Vuoi discutere un progetto con il nostro team?
  subtitle: I nostri ingegneri sono pronti a dare consigli sulla selezione dei prodotti, sulla personalizzazione e sulle collezioni co-brand.
  actions:
    - variant: primary
      text: Contatta il nostro team
      href: /contact
    - text: Visualizza i nostri prodotti
      href: /products

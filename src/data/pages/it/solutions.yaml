features3_solutions:
  tagline: Soluzioni per Tipologia di Impresa
  title: SUP progettati su misura<br />Per la tua azienda
  isBeforeContent: false
  columns: 2
  items:
    - title: Resort e Hotel
      description: Programmi completi di flotte SUP per strutture ricettive — tavole durevoli, branding personalizzato e supporto alla formazione del personale.
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: Club di Paddle
      description: Flotte SUP affidabili per club di pagaia, programmi di lezioni e operazioni di membership — tavole di livello commerciale con prezzi da club.
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: Operatori di noleggio
      description: SUP ad alta rotazione progettati per l'uso quotidiano a noleggio. Resistenti ai raggi UV, ad asciugatura rapida, impilabili — progettati per l'intenso utilizzo da noleggio.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: Partner al dettaglio
      description: Vendi il marchio di SUP in più rapida crescita nel tuo mercato. Linea completa di prodotti, materiali di marketing, dropshipping e margini competitivi.
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: Distributori
      description: Territori esclusivi, portafoglio prodotti completo, gestione account dedicata. Unisciti alla nostra rete di distribuzione globale in oltre 50 paesi.
      icon: tabler:world
      link: /solutions/distributors
    - title: Costruisci il tuo marchio
      description: Produzione SUP OEM/ODM completa — design, prototipazione, produzione di massa e logistica. Lancia il tuo marchio con Afarer.
      icon: tabler:package
      link: /solutions/build-your-own-brand

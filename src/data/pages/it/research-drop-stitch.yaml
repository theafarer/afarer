  <h2>Applicazioni</h2>

  <ul>
    <li><strong>Schede SUP:</strong> spessore 4" – 6", 15 – 20 PSI, 1 – 2 filettature per pollice quadrato</li>
    <li><strong>Kayak:</strong> Camere laterali gonfiabili a fondo a punto di caduta, pavimento da 10 a 15 PSI</li>
    <li><strong>Pavimenti RIB:</strong> Pavimenti a punto cadente per tender RIB leggeri e ripiegabili, 12 – 18 PSI</li>
    <li><strong>Parafanghi barche:</strong> cucitura a caduta a bassa pressione per parafanghi sagomati con faccia piatta</li>
  </ul>


  <h2>Punto a calo vs. Ponte d'aria (fibra di vetro o nucleo di legno)</h2>

  <p>Le tavole rigide utilizzano nuclei in schiuma EPS con rinforzo in fibra di vetro o legno. Sono più leggeri, rigidi e più reattivi — ma non possono essere sgonfiati. Il punto a punto scambia un po' di rigidità per la piena portabilità. Per la maggior parte degli utenti ricreativi, le moderne
  SUPs a punto di drop a 20 PSI sono indistinguibili dalle tavole rigide di livello base.</p>


  <h2>Come Afarer usa il punto a punto sceso</h2>

  <p>Afarer utilizza un nucleo drop-stitch DTEX da 1.680 per tutta la sua gamma SUP, con 2 fili per pollice quadrato e un laminato esterno in PVC da 1,2 mm. Le schede sono classificate a 20 PSI e sottopongono un test di mantenimento di pressione di 24 ore a 1,5 volte la pressione nominale prima
  della spedizione. Le bande ferroviarie sono saldate ad aria calda con fusione a triplo strato, e le valvole di scarico di pressione sono standard su tutti i modelli.</p>

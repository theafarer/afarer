  title: Come Funziona il Drop Stitch — L'Ingegneria Dietro i Nuclei Rigidi Gonfiabili
  subtitle: 8 minuti di lettura
content_html: >
  <h2>Cos'è il punto a punto scosso?</h2>

  <p>Il punto a punto (chiamato anche "tessuto a punto a caduta" o "nucleo a punto alto") è un metodo di costruzione in cui migliaia di fili di poliestere individuali collegano gli strati superiore e inferiore di un involucro di tessuto. Quando il guscio viene gonfiato, questi filetti agiscono come
  elementi di tensione interna — impediscono ai pannelli superiore e inferiore di sporgere verso l'esterno in una forma rotonda, costringendo il pannello a rimanere piatto e rigido.</p>

  <p>Il risultato è una struttura leggera e portatile in grado di sopportare una pressione interna di 15 – 20 PSI — paragonabile alla rigidità di una tavola rigida ma completamente sgonfiabile per lo stoccaggio e il trasporto.</p>


  <h2>Come funziona: la fisica</h2>

  <p>In una struttura gonfiabile convenzionale (come un palloncino o un materasso ad aria), la pressione interna dell'aria spinge in modo uguale in tutte le direzioni. Senza costrizioni interne, la struttura diventa cilindrica o sferica. Il punto a punto sceso risolve questo problema introducendo
  rinforzi a trazione:</p>

  <ul>
    <li>Migliaia di fili collegano gli strati di tessuto superiore e inferiore</li>
    <li>Quando è gonfiato, la pressione dell'aria cerca di separare la parte superiore e inferiore</li>
    <li>Le filettature resistono a questa separazione, trasferendo il carico in tensione lungo l'asse della filettatura</li>
    <li>Il risultato è un pannello piatto e rigido che resiste alla flessione</li>
  </ul>


  <h2>Processo di costruzione</h2>

  <ol>
    <li><strong>Tessitura:</strong> I fili di poliestere vengono intrecciati simultaneamente in due strati separati di tessuto base (tipicamente 1.100 DTEX o 1.680 DTEX in poliestere rivestito in PVC). I fili sono intrecciati ad anello tra gli strati con un angolo di 90°.</li>
    <li><strong>Rivestimento:</strong> Il tessuto di base intrecciato viene rivestito con PVC (o occasionalmente TPU) utilizzando un processo di rivestimento con coltello o rivestimento calendario. Questo sigilla le filettature e crea la membrana ermetica.</li>
    <li><strong>Collage degli strati:</strong> Il nucleo a punto a goccia viene fissato agli strati laminati esterni (tipicamente PVC da 0,9 mm o 1,2 mm) tramite laminazione a caldo o adesivo.</li>
    <li><strong>Saldatura:</strong> Le fasce di rotaia vengono saldate lungo i bordi tramite saldatura ad aria calda, saldatura RF o saldatura ad alta frequenza per creare le pareti laterali della scheda.</li>
    <li><strong>Installazione valvole:</strong> vengono installate valvole Boston o valvole Halkey-Roberts, tipicamente con un meccanismo di scarico della pressione per prevenire il sovragonfio.</li>
  </ol>



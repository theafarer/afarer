  title: Come Funziona il Drop Stitch — L'Ingegneria Dietro i Nuclei Rigidi Gonfiabili
  subtitle: 8 minuti di lettura
content_html: |-
  <h2>Cos'è il drop stitch?</h2>
  <p>Il drop stitch (chiamato anche "tessuto drop-stitch" o "nucleo drop-stitch") è un metodo di costruzione in cui migliaia di singoli fili di poliestere collegano gli strati superiore e inferiore di un guscio in tessuto. Quando il guscio viene gonfiato, questi fili agiscono come elementi di tensione interna — impediscono ai pannelli superiore e inferiore di gonfiarsi verso l'esterno assumendo una forma rotonda, costringendo il pannello a rimanere piatto e rigido.</p>
  <p>Il risultato è una struttura leggera e portatile in grado di sopportare una pressione interna di 15 – 20 PSI — paragonabile alla rigidità di una tavola a guscio rigido ma completamente sgonfiabile per lo stoccaggio e il trasporto.</p>

  <h2>Come funziona: la fisica</h2>
  <p>In una struttura gonfiabile convenzionale (come un palloncino o un materassino ad aria), la pressione interna dell'aria spinge in modo uguale in tutte le direzioni. Senza vincoli interni, la struttura diventa cilindrica o sferica. Il drop stitch risolve questo problema introducendo un rinforzo a trazione:</p>
  <ul>
    <li>Migliaia di fili collegano gli strati superiore e inferiore del tessuto</li>
    <li>Quando è gonfiata, la pressione dell'aria cerca di separare la parte superiore e quella inferiore</li>
    <li>I fili resistono a questa separazione, trasferendo il carico in tensione lungo l'asse del filo</li>
    <li>Il risultato è un pannello piatto e rigido che resiste alla flessione</li>
  </ul>

  <h2>Processo di costruzione</h2>
  <ol>
    <li><strong>Tessitura:</strong> I fili di poliestere vengono tessuti simultaneamente in due strati separati di tessuto di base (tipicamente poliestere rivestito in PVC da 1,100 DTEX o 1,680 DTEX). I fili vengono tessuti ad anello tra gli strati con un angolo di 90&deg;.</li>
    <li><strong>Rivestimento:</strong> Il tessuto di base viene rivestito con PVC (o occasionalmente TPU) tramite un processo di rivestimento a coltello o a calandra. Questo sigilla i fili e crea la membrana ermetica.</li>
    <li><strong>Unione degli strati:</strong> Il nucleo drop-stitch viene unito agli strati laminati esterni (tipicamente PVC da 0.9 mm o 1.2 mm) mediante laminazione a caldo o adesivo.</li>
    <li><strong>Saldatura:</strong> Le fasce laterali vengono saldate lungo i bordi mediante saldatura ad aria calda, saldatura RF o saldatura ad alta frequenza per creare le pareti laterali della tavola.</li>
    <li><strong>Installazione delle valvole:</strong> Vengono installate valvole Boston o valvole Halkey-Roberts, tipicamente con un meccanismo di scarico della pressione per prevenire il sovragonfiaggio.</li>
  </ol>

  <h2>Indicatori chiave di qualità</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parametro</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Livello base</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Densità dei fili</td><td class="p-3 border">1 filo / sq in</td><td class="p-3 border">2 fili / sq in</td></tr>
      <tr><td class="p-3 border">Tessuto di base</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Pressione massima</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Spessore PVC</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Costruzione delle fasce laterali</td><td class="p-3 border">Piegato &amp; incollato</td><td class="p-3 border">Saldato &amp; a fusione</td></tr>
    </tbody>
  </table>

  <h2>Applicazioni</h2>
  <ul>
    <li><strong>Tavole SUP:</strong> spessore 4" – 6", 15 – 20 PSI, 1 – 2 fili/sq in</li>
    <li><strong>Kayak:</strong> pavimento drop-stitch + camere laterali gonfiabili, pavimento a 10 – 15 PSI</li>
    <li><strong>Pavimenti RIB:</strong> pavimenti drop-stitch per tender RIB leggeri e ripiegabili, 12 – 18 PSI</li>
    <li><strong>Parafanghi per barche:</strong> drop stitch a bassa pressione per parafanghi sagomati con facce piatte</li>
  </ul>

  <h2>Drop Stitch vs. Air Deck (nucleo in fibra di vetro o legno)</h2>
  <p>Le tavole a guscio rigido utilizzano nuclei in schiuma EPS con rinforzo in fibra di vetro o legno. Sono più leggere, più rigide e più reattive — ma non possono essere sgonfiate. Il drop stitch sacrifica un po' di rigidità per una portabilità totale. Per la maggior parte degli utenti ricreativi, le moderne SUP drop-stitch a 20 PSI sono indistinguibili, in termini di rigidità, dalle tavole rigide di livello base.</p>

  <h2>Come Afarer utilizza il drop stitch</h2>
  <p>Afarer utilizza un nucleo drop-stitch da 1,680 DTEX in tutta la sua gamma SUP, con 2 fili per pollice quadrato e un laminato esterno in PVC da 1.2 mm. Le tavole sono classificate a 20 PSI e vengono sottoposte a un test di tenuta della pressione di 24–48 ore a 1.25x la pressione nominale prima della spedizione. Le fasce laterali sono saldate ad aria calda con fusione a triplo strato e le valvole di sfogo della pressione sono di serie su tutti i modelli.</p>

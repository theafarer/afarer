hero:
  tagline: Laboratorio 05
  title: Laboratorio di prototipi
  subtitle: Dal modello CAD alla barca pronta per il mare — costruita, equipaggiata e testata
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Fabbricazione della barca prototipo del laboratorio Afarer
intro: >-
  Un modello CAD, per quanto dettagliato, non può rivelare come una barca si comporterà realmente finché non incontra l'acqua. Ecco perché il nostro Laboratorio Prototipi è progettato per trasformare i dati ingegneristici in un'imbarcazione fisica e navigabile nel modo più rapido e preciso
  possibile. Ogni nuovo modello Afarer — e ogni costruzione personalizzata significativa — passa attraverso questo laboratorio prima che venga avviata la produzione degli stampi.
content_html: >-
  <h2>Dove il design diventa realtà</h2>

  <p>L'officina è completamente attrezzata per la fabbricazione simultanea di scafo, tubolari e allestimenti. Questo approccio a flusso parallelo riduce i tempi di prototipazione a 8-12 settimane dal rilascio dell'ingegneria, rispetto allo standard del settore di 16-20 settimane. Quando la Sua
  applicazione richiede una soluzione specializzata, possiamo passare dal concept alla validazione in acqua in meno di tre mesi.</p>


  <h2>Capacità dell'officina</h2>

  <table>
    <thead><tr><th>Postazione di lavoro</th><th>Attrezzatura</th><th>Scopo</th></tr></thead>
    <tbody>
      <tr><td>Fabbricazione scafo</td><td>Forno di rotostampaggio (HDPE), reparto saldatura TIG (alluminio), stampi per stratificazione manuale (vetroresina)</td><td>Produzione di scafi a grandezza naturale in tutti e tre i tipi di materiale</td></tr>
      <tr><td>Assemblaggio tubolari</td><td>Pressa di saldatura RF, stazione di imbastitura ad aria calda, banco di prova di gonfiaggio</td><td>Fabbricazione di tubolari a grandezza naturale con tutti i diaframmi, i coni e le valvole</td></tr>
      <tr><td>Allestimento &amp; montaggio</td><td>Argano motore (500 kg), telaio mock-up per console, crimpatrice per tubi idraulici, pannello per cablaggi elettrici</td><td>Allestimento completo: motore, timoneria, comandi, impianto carburante, elettronica, sedili</td></tr>
      <tr><td>Banco strumentazione</td><td>Sensore di velocità GPS, misuratore di flusso carburante, accelerometri, schiera di termocoppie, data-logger</td><td>Installazione e calibrazione della strumentazione per le prove in mare</td></tr>
    </tbody>
  </table>


  <h2>Il percorso di prototipazione — passo dopo passo</h2>

  <ol>
    <li><strong>Consegna del progetto ingegneristico</strong> — Il pacchetto di progettazione (modello 3D, relazione FEA, distinta dei materiali, programma di stratificazione) viene formalmente esaminato dal responsabile dell'officina e dall'ingegnere di progetto. Eventuali criticità produttive vengono segnalate e risolte prima dell'inizio del taglio.</li>
    <li><strong>Produzione dello scafo</strong> — Lo scafo viene realizzato in base alle specifiche ingegneristiche. Per l'HDPE: il programma di rotostampaggio viene caricato dalla simulazione Moldex3D. Per l'alluminio: le lamiere tagliate a CNC vengono saldate nel reparto TIG seguendo la mappa di saldatura approvata. Per la vetroresina: si segue strato per strato il piano di stratificazione.</li>
    <li><strong>Fabbricazione dei tubolari</strong> — Il tessuto viene tagliato con sagome a pattern CNC, quindi saldato a RF in camere a grandezza naturale. Ogni camera viene gonfiata alla pressione di prova e lasciata per 24 ore per la stabilizzazione iniziale.</li>
    <li><strong>Assemblaggio &amp; allestimento</strong> — Scafo e tubolari vengono accoppiati. Il motore viene montato, timoneria e comandi vengono collegati, viene installato l'impianto carburante e tutti i circuiti elettrici vengono cablati e verificati.</li>
    <li><strong>Test statici</strong> — Prima che l'imbarcazione tocchi l'acqua, vengono eseguiti: verifica di galleggiabilità (pieno carico + 30 % di riserva), prova di pressione dell'impianto carburante, prova del ciclo di sterzata completa della timoneria, prova di continuità del collegamento di massa elettrico.</li>
    <li><strong>Programma di prove in mare</strong> — 20 ore di test in acqua, descritti in dettaglio di seguito.</li>
    <li><strong>Revisione del prototipo</strong> — Si tiene una riunione formale di approvazione con i team di ingegneria, produzione e qualità. Le eventuali modifiche di progettazione richieste vengono documentate e integrate nella versione di produzione.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Programma di prove in mare di 20 ore — Piano dei test</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Manovre in porto — conduzione a bassa velocità, retromarcia, verifica dei parabordi</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Prova di velocità — velocità massima verificata con GPS, velocità di crociera, consumo di carburante a 3 punti di giri/min</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prova di virata — diametro tattico, avanzamento e trasferimento a 20 kn, a sinistra e a destra</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prova di slamming — passaggi ripetuti in onde di 0,5–1,0 m; accelerometro sulla base del sedile di guida</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prova di stabilità — angolo di sbandamento statico con 4 membri dell'equipaggio più attrezzatura a dritta, carico disassato</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prova di resistenza — 3 ore continue alla velocità di crociera; monitoraggio delle temperature (motore, carburante, elettrica)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Ispezione finale — ispezione di tutti i sistemi a prova conclusa, serraggio/verifica di tutti gli elementi di fissaggio, documentazione dei risultati</span>
      </div>
    </div>
  </div>


  <h2>Prototipazione su misura per applicazioni uniche</h2>

  <p>L'officina di prototipazione è il luogo in cui risolviamo i problemi che le imbarcazioni di produzione standard non possono affrontare. Esempi recenti includono:</p>

  <ul>
    <li>Un mezzo di soccorso di 7,8 m per un'organizzazione di ricerca e soccorso, che richiedeva una struttura cabina su misura con protezione in caso di ribaltamento, supporti integrati per la barella e un pod sonar montato a prua — tutti prototipati, installati e testati presso il nostro stabilimento.</li>
    <li>Un gommone gonfiabile di 5,2 m per un appaltatore di rilievi idrografici, con specchio di poppa ribassato, albero strumenti rimovibile e alloggiamenti passascafo per trasduttori progettati per ridurre al minimo la turbolenza del flusso.</li>
    <li>Un tender di 4,5 m a propulsione elettrica per un superyacht, in cui il prototipo è stato utilizzato per validare autonomia, infrastruttura di ricarica e livelli di rumorosità prima che il cliente si impegnasse per una flotta di quattro unità.</li>
  </ul>


  <h2>Il nostro team di prototipazione</h2>

  <p>L'officina è composta da otto tecnici nautici polivalenti, ciascuno formato in almeno due delle tre discipline principali (scafo, tubolari, allestimento). Il responsabile del team è un maestro costruttore di barche con 16 anni di esperienza, dagli esemplari unici su misura alle serie di
  produzione. Ogni prototipo è affidato a un ingegnere di progetto dedicato, che funge da punto di contatto unico per il cliente durante tutto il processo di costruzione e di prova.</p>


  <h2>Coinvolgimento del cliente</h2>

  <p>La incoraggiamo attivamente a partecipare alle tappe fondamentali della costruzione del prototipo — in particolare alla revisione iniziale dell'allestimento e alle prove in mare. Il Suo feedback operativo in queste fasi è preziosissimo per mettere a punto l'imbarcazione prima che entri in
  produzione. Non costruiamo nel vuoto: costruiamo in partnership con Lei.</p>

  <p>Le prove in mare di 20 ore sono anche un'opportunità per il Suo team di familiarizzare con la conduzione dell'imbarcazione, la disposizione dei sistemi e i requisiti di manutenzione, garantendo una transizione agevole al servizio quando le imbarcazioni di produzione verranno consegnate.</p>

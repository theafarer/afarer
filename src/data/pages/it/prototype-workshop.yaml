hero:
  tagline: 'Laboratorio 05'
  title: 'Officina di Prototipi'
  subtitle: "Dal modello CAD alla tavola pronta per l'acqua — costruita, equipaggiata e testata"
  image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
  image_alt: "Fabbricazione della tavola prototipo dell'officina Afarer"
intro: >-
  Un modello CAD, per quanto dettagliato, non può rivelare come una tavola si comporterà realmente finché non incontra l'acqua. Ecco perché la nostra Officina Prototipi è progettata per trasformare i dati ingegneristici in una tavola fisica e pronta per l'acqua nel modo più rapido e preciso
  possibile. Ogni nuovo modello Afarer — e ogni costruzione personalizzata significativa — passa attraverso questa officina prima che vengano avviati gli stampi di produzione.
content_html: |
  <h2>Dove il design diventa realtà</h2>

  <p>L'officina è completamente attrezzata per la fabbricazione simultanea di scafo, longheroni e allestimenti. Questo approccio a flusso parallelo riduce i tempi di prototipazione a 8-12 settimane dal rilascio dell'ingegneria, rispetto allo standard del settore di 16-20 settimane. Quando la vostra
  applicazione richiede una soluzione specializzata, possiamo passare dal concept alla validazione in acqua in meno di tre mesi.</p>


  <h2>Capacità dell'officina</h2>

  <table>
    <thead><tr><th>Postazione di lavoro</th><th>Attrezzatura</th><th>Scopo</th></tr></thead>
    <tbody>
      <tr><td>Fabbricazione scafo</td><td>Taglieratrice CNC per tessuti, pressa di laminazione a caldo, stazione di preparazione dei nuclei drop-stitch</td><td>Produzione di scafi a grandezza naturale in tutti e tre i tipi di costruzione</td></tr>
      <tr><td>Assemblaggio longheroni &amp; camere</td><td>Pressa di saldatura RF, stazione di imbastitura ad aria calda, banco di prova di gonfiaggio</td><td>Fabbricazione di longheroni e camere a grandezza naturale con tutti i diaframmi e le valvole</td></tr>
      <tr><td>Allestimento &amp; montaggio</td><td>Jig di fresatura per alloggiamenti pinne, attrezzature di saldatura per supporti di carico e maniglie, stazione di taglio dei pad del ponte</td><td>Allestimento completo: pinne, supporti di carico, ancore per leash, maniglie, pad del ponte, valvole</td></tr>
      <tr><td>Banco strumentazione</td><td>Sensore di velocità GPS, trasduttori di pressione, accelerometri, schiera di termocoppie, data-logger</td><td>Installazione e calibrazione della strumentazione per le prove in mare</td></tr>
    </tbody>
  </table>


  <h2>Il percorso di prototipazione — passo dopo passo</h2>

  <ol>
    <li><strong>Consegna del progetto ingegneristico</strong> — Il pacchetto di progettazione (modello 3D, relazione FEA, distinta dei materiali, programma di stratificazione) viene formalmente esaminato dal responsabile dell'officina e dall'ingegnere di progetto. Eventuali criticità produttive vengono segnalate e risolte prima dell'inizio del taglio.</li>
    <li><strong>Produzione dello scafo</strong> — Lo scafo viene realizzato in base alle specifiche ingegneristiche. Per la costruzione a strato singolo: il nucleo drop-stitch viene laminato con la pelle in PVC specificata. Per la costruzione a doppio strato: la pelle aggiuntiva viene applicata sul laminato base prima del taglio del pattern. Per la costruzione fusa: i parametri di laminazione vengono caricati dalla scheda di processo approvata e verificati su un campione iniziale.</li>
    <li><strong>Fabbricazione dei longheroni</strong> — Il tessuto viene tagliato con sagome a pattern CNC, quindi saldato a RF in longheroni e camere a grandezza naturale. Ogni camera viene gonfiata alla pressione di prova e lasciata per 24 ore per la stabilizzazione iniziale.</li>
    <li><strong>Assemblaggio &amp; allestimento</strong> — Scafo e longheroni vengono accoppiati. Vengono montati gli alloggiamenti delle pinne e i supporti di carico, vengono installate le ancore per leash e le maniglie di trasporto, la valvola di gonfiaggio viene avvitata con la coppia corretta e il pad del ponte viene applicato e allineato.</li>
    <li><strong>Test statici</strong> — Prima che la tavola tocchi l'acqua, vengono eseguiti: verifica di galleggiabilità (pieno carico + 30 % di riserva), prova di tenuta della pressione delle camere, prova di perdita delle valvole, prova di trazione su maniglie e supporti.</li>
    <li><strong>Programma di prove in mare</strong> — 20 ore di test in acqua, descritti in dettaglio di seguito.</li>
    <li><strong>Revisione del prototipo</strong> — Si tiene una riunione formale di approvazione con i team di ingegneria, produzione e qualità. Le eventuali modifiche di progettazione richieste vengono documentate e integrate nella versione di produzione.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Programma di prove in mare di 20 ore — Piano dei test</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Familiarizzazione in acqua piatta — direzionalità a bassa velocità, virate, controllo di postura e assetto</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Prova di velocità — velocità massima verificata con GPS, velocità di crociera, ritmo sostenuto a 3 frequenze di pagaiata</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prova di virata — raggio delle virate pivot e sweep, reattività della tavola, a sinistra e a dritta</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prova su mare mosso — passaggi ripetuti in mare mosso di 0,5–1,0 m; accelerometro nella posizione del rider</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prova di stabilità — angolo di sbandamento statico con 4 rider di peso diverso, carico disassato a dritta</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prova di resistenza — 3 ore continue al ritmo di crociera; monitoraggio della pressione delle camere, della temperatura dei longheroni e dell'affaticamento del rider</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Ispezione finale — ispezione post-prova di tutti i componenti, serraggio/verifica di tutti gli elementi di fissaggio, documentazione dei risultati</span>
      </div>
    </div>
  </div>


  <h2>Prototipazione su misura per applicazioni uniche</h2>

  <p>L'officina di prototipazione è il luogo in cui risolviamo i problemi che le tavole di produzione standard non possono affrontare. Esempi recenti includono:</p>

  <ul>
    <li>Un SUP di soccorso ad alta visibilità per un'organizzazione di ricerca e soccorso, che richiedeva maniglie di presa integrate, supporti per l'attrezzatura di soccorso e uno scafo ad alta galleggiabilità per il recupero delle persone — tutti prototipati, installati e testati presso il nostro stabilimento.</li>
    <li>Un SUP da touring da spedizione per un appaltatore di rilievi idrografici, con albero strumenti rimovibile, porte sigillate per l'attrezzatura e supporto trasduttore a basso profilo progettato per ridurre al minimo la resistenza.</li>
    <li>Un SUP da pesca compatto per una flotta di resort, in cui il prototipo è stato utilizzato per validare stabilità, allestimento dell'attrezzatura e durata nell'uso giornaliero a noleggio prima che il cliente si impegnasse per una flotta di quattro unità.</li>
  </ul>


  <h2>Il nostro team di prototipazione</h2>

  <p>L'officina è composta da otto tecnici nautici polivalenti, ciascuno formato in almeno due delle tre discipline principali (scafo, longheroni, allestimento). Il responsabile del team è un maestro fabbricatore con 16 anni di esperienza, dagli esemplari unici su misura alle serie di
  produzione. Ogni prototipo è affidato a un ingegnere di progetto dedicato, che funge da punto di contatto unico per il cliente durante tutto il processo di costruzione e di prova.</p>


  <h2>Coinvolgimento del cliente</h2>

  <p>Vi incoraggiamo attivamente a partecipare alle tappe fondamentali della costruzione del prototipo — in particolare alla revisione iniziale dell'allestimento e alle prove in mare. Il vostro feedback operativo in queste fasi è preziosissimo per mettere a punto la tavola prima che entri in
  produzione. Non costruiamo nel vuoto: costruiamo in partnership con voi.</p>

  <p>Le prove in mare di 20 ore sono anche un'opportunità per il vostro team di familiarizzare con la gestione della tavola, la disposizione del ponte e i requisiti di manutenzione, garantendo una transizione agevole al servizio quando le tavole di produzione verranno consegnate.</p>

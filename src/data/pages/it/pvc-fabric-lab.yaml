intro: >-
  Il tessuto del tubo è il materiale singolarmente più critico in una barca gonfiabile. Deve resistere a un'esposizione costante ai raggi UV, a ripetuti cicli di gonfiaggio, all'abrasione contro moli e detriti, e a estremi sbalzi di temperatura — tutto questo mantenendo la sua integrità strutturale
  per anni. Presso {SITE.name}, il nostro Laboratorio di Tessuti in PVC è dedicato esclusivamente alla caratterizzazione, validazione e miglioramento continuo dei tessuti che utilizziamo in ogni barca che costruimo.
content_html: >
  <h2>La base di ogni imbarcazione gonfiabile</h2>

  <p>Non ci affidiamo esclusivamente alle schede tecniche dei fornitori. Ogni partita di tessuto in PVC e Hypalon che entra nel nostro stabilimento viene testata in modo indipendente e interno. Questo garantisce che la specifica del materiale che pubblichiamo sia la prestazione che ricevete —
  partita dopo partita, anno dopo anno.</p>


  <h2>Apparecchiature di prova standardizzate</h2>

  <p>Il nostro laboratorio tessile è dotato di strumenti di livello industriale conformi ai metodi di prova ISO, ASTM ed EN:</p>

  <table>
    <thead><tr><th>Apparecchiatura</th><th>Parametri misurati</th><th>Standard</th></tr></thead>
    <tbody>
      <tr><td>Dinamometro universale (50 kN)</td><td>Forza di rottura, allungamento a rottura, propagazione dello strappo</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>Camera di invecchiamento ad arco allo xeno</td><td>Resistenza ai raggi UV (variazione di colore, mantenimento della resistenza dopo 2000 h)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>Apparecchio di flessione a bassa temperatura</td><td>Temperatura di screpolatura da -30 °C a -50 °C</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Apparecchio di abrasione Taber</td><td>Perdita di peso dopo 1000 cicli (ruota CS-10)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>Spessimetro (digitale, risoluzione 0,001 mm)</td><td>Uniformità sulla larghezza del rotolo</td><td>ISO 2286-3</td></tr>
      <tr><td>Apparecchio di prova della colonna d'acqua</td><td>Resistenza alla penetrazione dell'acqua</td><td>ISO 811</td></tr>
    </tbody>
  </table>

  <p class="text-sm text-gray-500">* Tutte le apparecchiature vengono calibrate annualmente da laboratori accreditati di terze parti.</p>


  <h2>Dai dati alla decisione: un flusso di prova tipico</h2>

  <p>Quando arriva un nuovo tessuto candidato, segue un processo di qualificazione standardizzato in sette fasi:</p>

  <ol>
    <li><strong>Ispezione all'arrivo</strong> — controllo visivo di difetti superficiali, microfori e conformità dimensionale.</li>
    <li><strong>Mappatura dello spessore</strong> — misurazione su 20 punti lungo il rotolo; per l'accettazione è richiesto un CV &lt; 3%.</li>
    <li><strong>Prova di trazione</strong> — 5 provini in direzione ordito e trama. Minimo 3500 N/50 mm per PVC 1100 dtex.</li>
    <li><strong>Condizionamento UV</strong> — esposizione di 1000 h in camera ad arco allo xeno; è richiesto un mantenimento minimo della resistenza pari all'80 %.</li>
    <li><strong>Screpolatura a freddo</strong> — 4 h a -35 °C, quindi piegatura a 180° su un mandrino da 25 mm. Nessuna screpolatura visibile.</li>
    <li><strong>Resistenza all'abrasione</strong> — 1000 cicli, perdita di peso ≤ 0.05 g.</li>
    <li><strong>Approvazione finale</strong> — solo dopo il superamento di tutti e sette i criteri il tessuto viene rilasciato per la produzione.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">PVC 1100 dtex tipico — Mantenimento della resistenza a trazione dopo esposizione ai raggi UV</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 h<br />100%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 h<br />95%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 h<br />88%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 h<br />82%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">Concorrente<br />~65%</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Il nostro tessuto PVC 1100 dtex mantiene &gt; 80 % della resistenza a trazione dopo 2000 h di esposizione ad arco allo xeno, rispetto ai gradi industriali tipici che scendono al di sotto del 70 %.</p>
  </div>


  <h2>Il nostro team professionale</h2>

  <p>Il laboratorio è composto da due ingegneri dei materiali a tempo pieno, ciascuno in possesso di una laurea in scienza dei polimeri o ingegneria tessile e con almeno sei anni di esperienza nel settore. Sono affiancati da tre tecnici che svolgono le prove quotidiane e la registrazione dei dati.
  Il team partecipa regolarmente a prove interlaboratorio (round-robin) organizzate dall'International Organization for Standardization (ISO) per validare l'accuratezza dei nostri metodi di prova.</p>


  <h2>Risolviamo le vostre sfide sui materiali più impegnative</h2>

  <p>Ogni ambiente marino è diverso. Un'imbarcazione di pattuglia che opera nel Golfo Persico è esposta a condizioni di UV e temperatura molto diverse rispetto a un'unità di soccorso nel Mare del Nord. Il nostro laboratorio tessile vi aiuta a selezionare — o sviluppare — una specifica di tessuto
  ottimizzata per il vostro profilo operativo.</p>

  <p>Tra le soluzioni personalizzate più recenti figurano:</p>

  <ul>
    <li>Una miscela di PVC ad alta resistenza all'abrasione per un cliente militare le cui imbarcazioni vengono regolarmente portate a riva su barriere coralline (+40 % di durata all'abrasione).</li>
    <li>Una formulazione Hypalon a bassa temperatura per una stazione di ricerca artica, testata fino a -50 °C senza infragilimento.</li>
    <li>Un tessuto arancione stabilizzato al colore per una flotta di ricerca e soccorso, che mantiene la visibilità dopo 3 anni di esposizione al sole tropicale.</li>
  </ul>

  <p>Non vendiamo tessuti "pronti all'uso" nella speranza che funzionino. Testiamo, validiamo e raccomandiamo — o creiamo — una soluzione su misura per il vostro specifico profilo di missione. Questa è la differenza di {SITE.name}.</p>


  <h2>Come lavoriamo per voi</h2>

  <p>Quando ci sottoponete una sfida sui materiali, ecco cosa potete aspettarvi:</p>

  <ol>
    <li><strong>Consulenza</strong> — discutiamo il vostro ambiente operativo, gli obiettivi di prestazione e il budget.</li>
    <li><strong>Proposta</strong> — viene redatto un piano di prova con criteri di superamento/fallimento chiari e una tempistica.</li>
    <li><strong>Esecuzione</strong> — il nostro laboratorio esegue le prove e produce un rapporto dettagliato con i dati grezzi e l'analisi comparativa.</li>
    <li><strong>Raccomandazione</strong> — presentiamo una specifica di tessuto, incluse opzioni alternative se più materiali soddisfano i vostri requisiti.</li>
    <li><strong>Follow-up</strong> — dopo la consegna, restiamo a disposizione per qualsiasi domanda sui materiali in servizio.</li>
  </ol>

  <p>Il nostro obiettivo non è semplicemente vendervi un'imbarcazione. È garantire che l'imbarcazione che ricevete funzioni in modo affidabile nelle condizioni in cui operate — e tutto comincia dal tessuto.</p>

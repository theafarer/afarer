meta:
  title: 'Partner — Distribuzione e Ingrosso | {SITE}'
  description: "Diventa un partner afar: reti di distribuzione, prezzi all'ingrosso, programmi OEM/marchio privato e supporto per aziende di paddle board in tutto il mondo."
  keywords:
    - 'partner distribuzione SUP'
    - "paddle board all'ingrosso"
    - 'distributore SUP gonfiabile'
    - 'partnership SUP'
hero:
  tagline: Partner e Distribuzione
  title: Diventa un Partner afarer<br />—Rete di Distribuzione Globale
  subtitle: Unisciti alla rete globale di partner di afarer. Collaboriamo con distributori marittimi, concessionari di barche, rivenditori di attrezzature e partner di marca in 50 paesi.
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: reti di partner e distributori globali di afarer
content_programs:
  tagline: Programmi partner
  title: Programmi per Partner<br />Costruiti per la Crescita
  subtitle: Sia che tu sia un distributore, un rivenditore o un partner del marchio, afarer offre programmi progettati per supportare la tua attività.
  columns: 3
  items:
    - title: Programma per distributori
      description: Distribuzione territoriale esclusiva con prezzi basati sul volume, supporto marketing e accesso diretto alla fabbrica. È richiesto un impegno minimo basato sulla dimensione del territorio.
      icon: tabler:world
    - title: Programma Rivenditori
      description: Prezzi diretti ai rivenditori, formazione sui prodotti, materiali di marketing e supporto per la garanzia per punti vendita al dettaglio e negozi online.
      icon: tabler:building-store
    - title: Partnership OEM/ODM
      description: Produzione OEM e ODM a servizio completo con marchio personalizzato, confezionamento e specifiche del prodotto. Dal concetto al contenitore.
      icon: tabler:certificate
    - title: Partnership di marca
      description: Programmi di co-branding, private label e modelli esclusivi per marchi consolidati nel settore marino e del tempo libero all'aperto.
      icon: tabler:stars
    - title: Governo e istituzioni
      description: Programmi di fornitori preferiti per agenzie governative, guardie costiere, militari e organizzazioni umanitarie. Documentazione pronta per gare d'appalto.
      icon: tabler:building-community
    - title: Resort e Partner per Noleggio
      description: Prezzi per flotte, qualità costante e personalizzazione del marchio per resort, centri subacquei e attività di noleggio in tutto il mondo.
      icon: tabler:sun
content_benefits:
  tagline: Perché Collaborare con Noi
  title: Perché i partner scelgono afarer
  subtitle: I nostri partner beneficiano di una reale capacità produttiva, qualità costante e supporto reattivo.
  list:
    - 'Accesso Diretto alla Fabbrica: Lavora direttamente con il nostro team di produzione — senza intermediari. Ottieni risposte più rapide, prezzi migliori e piena visibilità sulla produzione.'
    - "Pronto per la personalizzazione: Brandizza i tuoi prodotti con colori, loghi, confezioni e specifiche personalizzate. Quantità minime d'ordine su misura per il tuo mercato."
    - 'Qualità garantita: produzione certificata ISO 9001 con conformità CE, UKCA e BSCI. Ogni prodotto testato prima della spedizione.'
    - 'Logistica Globale: Spedizione da Qingdao, Cina con opzioni FOB, CIF e DDP. Magazzino negli Stati Uniti a Montclair, CA per la distribuzione in Nord America.'
    - 'Supporto al marketing: cataloghi di prodotti, fotografia, documentazione tecnica e risorse digitali per supportare i tuoi sforzi di vendita.'
    - 'Formazione e supporto: Formazione sul prodotto per il vostro team di vendita, supporto tecnico per i vostri clienti e coordinamento del servizio di garanzia.'
content_process:
  tagline: Come diventare un partner
  title: Processo di Partnership Semplice
  subtitle: Il nostro processo di partnership è semplice — progettato per permetterti di vendere prodotti più lontani rapidamente.
  items:
    - title: 'Passo 1: Inviare la domanda'
      description: Completa il nostro modulo di domanda per partner con il profilo della tua azienda, il mercato di riferimento e gli interessi sui prodotti.
    - title: 'Passo 2: Revisione delle qualifiche'
      description: Il nostro team di partnership esamina la tua candidatura e ti contatta entro 3 giorni lavorativi per discutere le opportunità.
    - title: 'Fase 3: Accordo e Configurazione'
      description: Firma un accordo di partnership, crea il tuo account e ricevi prezzi riservati ai partner, materiali di marketing e campioni di prodotti.
    - title: 'Fase 4: Formazione e Lancio'
      description: Formazione sul prodotto, supporto alle vendite e materiale di marketing forniti. Sei pronto per iniziare a vendere.
cta:
  title: Pronto a diventare un partner afarer?
  subtitle: Candidati per la partnership e il nostro team risponderà entro 3 giorni lavorativi.
  actions:
    - variant: primary
      text: Candidati per la partnership
      href: /contact
    - text: Visualizza i nostri prodotti
      href: /products

faqs:
  title: 'Programma Distributori — FAQ'
  subtitle: 'Tutto ciò che i distributori chiedono prima di candidarsi.'
  items:
    - title: 'Cosa significa un distributore per paese?'
      description: 'Afarer concede a un unico distributore autorizzato diritti esclusivi per un paese o una regione. Sei padrone del tuo mercato: niente importazioni parallele, niente concorrenza interna.'
    - title: 'Qual è l’ordine minimo iniziale?'
      description: 'I distributori paese e regionali partono da 100–300 unità. I rivenditori autorizzati da 30–50 unità. Gli ordini di prova da 10–30 unità permettono di validare il mercato prima (senza protezione territoriale).'
    - title: 'Quale supporto ricevono i distributori?'
      description: 'Il programma di successo copre onboarding, pianificazione go-to-market, formazione prodotto e vendite, supporto flotta demo, asset marketing localizzati e un account manager dedicato.'
    - title: 'Come mi protegge Afarer dai conflitti di canale?'
      description: 'Ogni territorio ha esattamente un distributore autorizzato. Gli ordini diretti dalla tua regione passano da te e i prezzi proteggono il tuo margine.'
    - title: 'Quali sono le condizioni di spedizione e pagamento?'
      description: 'Gli ordini partono FOB Qingdao con documentazione export completa. Gli ordini di produzione richiedono 30% di acconto e 70% prima della spedizione; ordini di prova e campioni sono prepagati.'
    - title: 'Come faccio domanda?'
      description: 'Invia una richiesta tramite il modulo di contatto. Valutiamo l’adattamento al mercato, la presenza nel retail e la capacità logistica, poi rispondiamo entro 3 giorni lavorativi con i prossimi passi e un Contratto di Distribuzione di esempio.'

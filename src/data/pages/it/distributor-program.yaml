features:
  title: 'Perché Collaborare con Afarer'
  subtitle: 'Un modello un-paese-un-distributore con la struttura di supporto per rendere redditizio il territorio. L’esclusività si conquista e si mantiene — non è un diritto permanente.'
  columns: 3
  items:
    - title: 'Esclusività Territoriale'
      description: 'Un unico distributore autorizzato per paese o regione. Niente importazioni parallele, niente concorrenza interna. Il tuo investimento costruisce la tua fossa.'
      icon: 'tabler:shield-check'
    - title: 'Protezione dal Conflitto di Canale'
      description: 'Gli ordini diretti dalla tua regione passano attraverso di te e i prezzi proteggono il tuo margine. Afarer non vende aggirando i propri partner di paese.'
      icon: 'tabler:users'
    - title: 'Margini Diretti di Fabbrica e Sconti'
      description: 'Listino rivenditore con sconti sui volumi impegnati. Nessun intermediario. Spedizione FOB Qingdao con documentazione export completa.'
      icon: 'tabler:coins'
    - title: 'Programma di Supporto Partner in 10 Moduli'
      description: 'Onboarding, go-to-market, formazione, marketing e fondi comuni di mercato, ricambi e assistenza post-vendita, garanzia, strumenti di ordinazione e portale partner — tutto incluso nel tuo Distribution Agreement.'
      icon: 'tabler:rocket'
    - title: 'Marketing e Fondi Comuni di Mercato'
      description: 'Materiali per campagne localizzati, materiali POS per i rivenditori, kit per eventi, contenuti digitali in più lingue e supporto di co-marketing per le stagioni di lancio.'
      icon: 'tabler:mood-smile'
    - title: 'Formazione su Prodotto, Vendite e Tecnica'
      description: 'Sessioni di onboarding strutturate su prodotto, vendite e conoscenze tecniche, con materiali aggiornati man mano che la gamma evolve.'
      icon: 'tabler:presentation'
    - title: 'Ricambi e Assistenza Post-Vendita'
      description: 'Fornitura di ricambi, registrazione della garanzia e gestione dei reclami, oltre a schede prodotto e manuali per il tuo team di assistenza locale.'
      icon: 'tabler:settings'
    - title: 'Account Manager Dedicato e Portale Partner'
      description: 'Un manager personale per i distributori più l’accesso a listini, stato degli ordini e risorse di marketing tramite il portale partner Afarer.'
      icon: 'tabler:user-check'

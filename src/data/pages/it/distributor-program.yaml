faqs:
  title: 'Partner di Paese — FAQ'
  subtitle: 'Le domande che i partner di paese seri si pongono prima di candidarsi.'
  items:
    - title: 'Cosa significa davvero un paese, un distributore?'
      description: 'Afarer nomina un unico distributore autorizzato con diritti esclusivi su un territorio definito. Non vendiamo dai nostri canali globali o regionali verso un paese protetto. Il tuo possesso del territorio resta valido finché il Distribution Agreement viene rispettato.'
    - title: 'Il territorio è esclusivo per sempre?'
      description: 'No. L’esclusività è condizionata, non perpetua. Si mantiene attraverso un Distribution Agreement firmato, il completamento del primo ordine, target annuali di acquisto, stock locale, capacità post-vendita e investimento continuo sul mercato. Se questi requisiti non vengono rispettati, il territorio può essere rinegoziato o riassegnato.'
    - title: 'Qual è il primo ordine minimo?'
      description: 'I distributori di paese e regionali partono da 100–300 unità; i rivenditori autorizzati da 30–50; gli ordini di prova da 10–30 unità ti permettono di validare prima il mercato (gli ordini di prova e campione non hanno protezione territoriale). I programmi Custom e private-label seguono MOQ separati elencati nei livelli sopra indicati.'
    - title: 'Che cosa comprende il programma di supporto in 10 moduli?'
      description: 'Livelli e qualifica, protezione territoriale, MOQ / prezzi / sconti annuali, gestione di inventario e ordini, asset marketing e fondi comuni di mercato, formazione su prodotto / vendite / tecnica, ricambi e post-vendita, registrazione della garanzia, portale partner e schede prodotto, libreria degli asset marketing, calendario degli sconti annuali e liste di spedizione e imballaggio.'
    - title: 'Come mi protegge Afarer dal conflitto di canale?'
      description: 'Ogni territorio ha esattamente un distributore autorizzato. Le richieste e gli ordini diretti dalla tua regione passano attraverso di te, i moduli del sito vengono inoltrati al partner locale dove esiste, e il team globale interviene solo se un partner non risponde.'
    - title: 'Quali sono le condizioni di spedizione e pagamento?'
      description: 'Gli ordini partono FOB Qingdao con documentazione export completa. Gli ordini di produzione richiedono un acconto del 30% e il 70% prima della spedizione; gli ordini di prova e campione sono pagati in anticipo. Il tempo di consegna standard è di 30–45 giorni lavorativi, con 15–20 giorni lavorativi per le linee campione.'
    - title: 'Come faccio domanda?'
      description: 'Invia la tua candidatura tramite il modulo di contatto con i dettagli del mercato. Valutiamo l’adattamento al mercato, la presenza nel retail e la capacità logistica, poi rispondiamo entro 3 giorni lavorativi con i prossimi passi e un Distribution Agreement di esempio.'

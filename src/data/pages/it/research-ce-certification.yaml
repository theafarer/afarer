hero:
  tagline: Conformità
  title: Come funziona la certificazione CE per le imbarcazioni gonfiabili
  subtitle: 7 minuti di lettura
content_html: |-
  <h2>Cos'è la certificazione CE?</h2>
  <p>La marcatura CE (Conformit&eacute; Europ&eacute;enne) indica che un prodotto soddisfa i requisiti europei in materia di salute, sicurezza e ambiente. Per le imbarcazioni gonfiabili, il quadro normativo di riferimento dipende dalla categoria di prodotto.</p>

  <h2>Direttive applicabili</h2>

  <h3>Direttiva sulle imbarcazioni da diporto (2013/53/EU)</h3>
  <p>È la direttiva principale per la maggior parte delle barche gonfiabili, dei SUP e dei kayak. Si applica alle imbarcazioni da diporto con lunghezza dello scafo da 2,5 m a 24 m, alle barche parzialmente completate (per la fornitura OEM) e alle moto d'acqua.</p>

  <h3>Regolamento sui Dispositivi di Protezione Individuale (2016/425)</h3>
  <p>I giubbotti di salvataggio, gli ausili al galleggiamento e le attrezzature di sicurezza fornite con le imbarcazioni devono soddisfare i requisiti del Regolamento DPI, compresi l'esame di tipo (Modulo B) da parte di un organismo notificato e la garanzia della qualità di produzione (Modulo D o E).</p>

  <h2>Il processo di certificazione</h2>
  <ol>
    <li>Classificazione del prodotto: determinare la categoria di progettazione dell'imbarcazione (A – D secondo ISO 8666)</li>
    <li>Norme applicabili: EN ISO 6185 (Parti 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (targa del costruttore)</li>
    <li>Preparazione del fascicolo tecnico: disegni di progetto, distinta dei materiali, certificati dei materiali, valutazione dei rischi</li>
    <li>Prove di tipo: galleggiabilità, stabilità, capacità di carico, prove sui materiali, resistenza delle giunzioni, ritenzione dell'aria</li>
    <li>Controllo della produzione in fabbrica: audit dell'organismo notificato sui processi produttivi</li>
    <li>Dichiarazione di conformità: il produttore firma la DoC e appone la marcatura CE</li>
  </ol>

  <h2>Organismi notificati per le imbarcazioni gonfiabili</h2>
  <p>Gli organismi notificati più comuni includono Bureau Veritas (Francia), DNV GL (Germania), RINA (Italia), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Germania).</p>

  <h2>Tempistiche e costi</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fase</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Durata</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Costo tipico (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Preparazione del fascicolo tecnico</td><td class="p-3 border">2 – 4 settimane</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Prove di tipo</td><td class="p-3 border">4 – 8 settimane</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Audit in fabbrica</td><td class="p-3 border">1 – 2 giorni (in loco)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Totale (primo prodotto)</td><td class="p-3 border">8 – 14 settimane</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Cosa significa per gli acquirenti</h2>
  <p>Quando si acquistano barche gonfiabili certificate CE, verificare sempre che la marcatura CE sia sulla targa del costruttore, che esista una DoC valida, che sia indicato il numero dell'organismo notificato e che il manuale del proprietario includa le istruzioni di sicurezza nella propria lingua. Tutti i prodotti Afarer sono dotati di certificazione CE con piena tracciabilità ai rapporti di audit dell'organismo notificato.</p>

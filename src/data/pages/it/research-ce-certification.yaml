hero:
  tagline: Conformità
  title: Come funziona la certificazione CE per le imbarcazioni gonfiabili
  subtitle: 7 minuti di lettura
content_html: >
  <h2>Cos'è la certificazione CE?</h2>

  <p>La marcatura CE (Conformité Européenne) indica che un prodotto soddisfa i requisiti europei di salute, sicurezza e ambiente. Per le imbarcazioni gonfiabili, il quadro normativo rilevante dipende dalla categoria di prodotto.</p>


  <h2>Direttive applicabili</h2>


  <h3>Direttiva sulle imbarcazioni da diporto (2013/53/UE)</h3>

  <p>La direttiva principale per la maggior parte delle barche gonfiabili, SUP e kayak. Si applica a imbarcazioni da diporto da 2,5 m a 24 m di lunghezza dello scafo, barche parzialmente completate (per forniture OEM) e motoscafi individuali.</p>


  <h3>Regolamento sulle Attrezzature di Protezione Individuale (2016/425)</h3>

  <p>I giubbotti di salvataggio, gli ausili al galleggiamento e le attrezzature di sicurezza fornite con le imbarcazioni devono rispettare i requisiti del Regolamento DPI, inclusi l'esame del tipo (Modulo B) da parte di un ente notificato e la garanzia di qualità della produzione (Modulo D o E).</p>


  <h2>Il processo di certificazione</h2>

  <ol>
    <li>Classificazione del prodotto: Determinare la categoria di progettazione dell'imbarcazione (A – D secondo ISO 8666)</li>
    <li>Standard applicabili: EN ISO 6185 (Parti 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (targa costruttore)</li>
    <li>Preparazione dei file tecnici: disegni di progetto, Scheda dei materiali, certificati materiali, valutazione del rischio</li>
    <li>Test di tipo: Galleggiabilità, stabilità, capacità di carico, test dei materiali, resistenza delle giunzioni, ritenzione dell'aria</li>
    <li>Controllo della produzione in fabbrica: Audit a organismi notificati dei processi produttivi</li>
    <li>Dichiarazione di conformità: il produttore firma la DoC, applica la marcatura CE</li>
  </ol>


  <h2>Organismi notificati per imbarcazioni gonfiabili</h2>

  <p>I NB comuni includono Bureau Veritas (Francia), DNV GL (Germania), RINA (Italia), TÜV Rheinland / TÜV SÜD (Germania).</p>


  <h2>Tempistica e costi</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <class="p-3 testo-sinistra font-semigrassetto-grassetto-grigio-900 bordo">Fase</th>
        <classe "p-3 testo-sinistra font-semigrassetto testo-grigio-900 bordo">Durata</th>
        <classe "p-3 testo-sinistra font-semigrassetto testo-grigio-900 bordo">Costo tipico (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 bordo">Preparazione file tecnico</td><td class="p-3 bordo">2 – 4 settimane</td><td class="p-3 bordo">2.000 – 5.000</td></tr>
      <tr><td class="p-3 bordo">Test di tipo</td><td class="p-3 bordo">4 – 8 settimane</td><td class="p-3 bordo">8.000 – 20.000</td></tr>
      <tr><td class="p-3 border">Factory audit</td><td class="p-3 border">1 – 2 giorni (in loco)</td><td class="p-3 border">3.000 – 6.000</td></tr>
      <tr><td class="p-3 bordo">Totale (primo prodotto)</td><td class="p-3 bordo">8 – 14 settimane</td><td class="p-3 bordo">13.000 – 31.000</td></tr>
    </tbody>
  </table>


  <h2>Cosa significa questo per gli acquirenti</h2>

  <p>Quando acquisti barche gonfiabili certificate CE, verifica sempre che la marcatura CE sia sulla targa del costruttore, che esista un DoC valido, che sia indicato il numero di Notifica e che il manuale del proprietario includa istruzioni di sicurezza nella tua lingua locale. Tutti i prodotti
  Afarer portano la certificazione CE con piena tracciabilità ai rapporti di audit notificati.</p>

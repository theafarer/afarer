intro: >-
  Lo scafo è la spina dorsale di qualsiasi SUP gonfiabile. Deve essere abbastanza leggero da scivolare in modo efficiente, abbastanza resistente per gestire le rive rocciose e abbastanza rigido da convertire ogni colpo di pagaia in moto in avanti. Presso Afarer, il nostro Hull Engineering Studio combina
  modellazione CAD avanzata, analisi agli elementi finiti (FEA) e decenni di esperienza pratica nella progettazione di tavole per fornire scafi ottimizzati per la disciplina prevista — non forme generiche adattate da un catalogo.
content_html: |
  <h2>Dove la resistenza incontra l'idrodinamica</h2>
  <p>Lavoriamo con tre piattaforme costruttive primarie — nuclei in PVC drop-stitch rinforzati, laminati in vetroresina posati a mano e polietilene rotostampato — e disponiamo delle competenze ingegneristiche per progettare, simulare e validare internamente ciascuna di esse.</p>

  <h2>Strumenti di progettazione e standard</h2>
  <p>Il nostro ambiente di ingegneria digitale comprende:</p>
  <table>
    <thead><tr><th>Capacità</th><th>Software / Strumento</th><th>Applicazione</th></tr></thead>
    <tbody>
      <tr><td>Modellazione parametrica 3D</td><td>SolidWorks Professional</td><td>Superficie dello scafo, rinforzo di longheroni e centine, disposizione del ponte, punti di ancoraggio per l'attrezzatura</td></tr>
      <tr><td>Analisi agli elementi finiti</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Mappatura delle tensioni, analisi modale, simulazione di crash/urto</td></tr>
      <tr><td>Fluidodinamica computazionale</td><td>Ansys Fluent / Star-CCM+</td><td>Previsione della resistenza idrodinamica, ottimizzazione dell'assetto</td></tr>
      <tr><td>Ingegneria dei laminati</td><td>ESAComp / CADEC</td><td>Impilaggio degli strati in vetroresina, selezione del nucleo, stima del peso</td></tr>
      <tr><td>Simulazione del flusso in stampo</td><td>Moldex3D</td><td>Previsione dello spessore di parete nel rotostampaggio</td></tr>
    </tbody>
  </table>

  <h2>Il nostro flusso di lavoro ingegneristico</h2>
  <p>Ogni progetto di scafo, sia esso un modello standard o un progetto interamente personalizzato, segue un rigoroso processo in cinque fasi:</p>
  <ol>
    <li><strong>Raccolta dei concetti e dei requisiti</strong> — Ci confrontiamo con voi per definire il peso del rider e il carico utile, il range di velocità, la capacità operativa in base allo stato dell'acqua, i requisiti di trasporto ed eventuali attrezzature speciali per missione (supporti sul ponte, posizioni di ancoraggio per il carico, integrazione di accessori).</li>
    <li><strong>Superficie 3D &amp; calcolo idrostatico</strong> — La forma dello scafo viene modellata in SolidWorks e verificata per stabilità idrostatica, distribuzione dei volumi e braccio raddrizzante mediante strumenti di analisi integrati.</li>
    <li><strong>Analisi strutturale agli elementi finiti (FEA)</strong> — Vengono definiti i casi di carico: statico (rider + attrezzatura), dinamico (impatti di atterraggio sulle onde a 5g) e incaglio (urto contro una riva rocciosa a 3 m/s). I campi di tensione vengono esaminati; è obbligatorio un fattore di sicurezza ≥ 2.5.</li>
    <li><strong>Ottimizzazione della resistenza con CFD</strong> — Lo scafo viene simulato in tre condizioni di carico e a cinque velocità. La superficie bagnata, l'angolo di assetto e la resistenza residua vengono ridotti in modo iterativo.</li>
    <li><strong>Revisione del progetto &amp; rilascio</strong> — Il pacchetto ingegneristico completo (modello 3D, rapporto FEA, rapporto CFD, stima del peso, libro degli strati) viene esaminato dal nostro ingegnere senior prima del rilascio all'officina dei prototipi.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Distribuzione delle tensioni FEA — Scafo SUP da Touring (Drop-Stitch Rinforzato)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Fattore di sicurezza al carico utile massimo</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Riduzione della resistenza rispetto alla generazione precedente</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Pressione massima di slamming (limite di progetto)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Ore di calcolo FEA cumulate nel 2025</span>
      </div>
    </div>
  </div>

  <h2>Personalizzazione: il vostro scafo, le vostre regole</h2>
  <p>Nessun paddler ha requisiti identici a un altro. Un SUP da pesca necessita di uno scafo planante ampio e stabile; una tavola da touring necessita di uno scafo a spostamento che massimizza lo scivolamento; un SUP da surf necessita di longheroni reattivi e rocker calibrato. Non forziamo la vostra applicazione in una forma di scafo preesistente. Progettiamo a partire dalla vostra specifica.</p>
  <p>Esempi di recenti progetti ingegneristici di scafi personalizzati:</p>
  <ul>
    <li>Un SUP da touring allungato per un tour operator ecologico caraibico, con prua rinforzata per gli atterraggi in spiaggia (+15 % di spessore dei longheroni).</li>
    <li>Un SUP da pattugliamento ad alta visibilità per un'autorità portuale, con supporti integrati per l'attrezzatura e tactical rails.</li>
    <li>Un SUP da touring da spedizione per una flotta a noleggio, con longheroni rinforzati e ancoraggi extra per il carico.</li>
  </ul>

  <h2>I nostri ingegneri</h2>
  <p>Lo studio è diretto da un ingegnere senior con 14 anni di esperienza nella progettazione di tavole ad alte prestazioni, affiancato da due ingegneri meccanici specializzati in FEA e CFD. Tutti e tre possiedono lauree avanzate in ingegneria navale o meccanica presso università di riconosciuto livello internazionale. Il team pubblica regolarmente su riviste di settore e presenta i propri lavori in conferenze internazionali sull'ingegneria degli sport di paddle ad alte prestazioni.</p>

  <h2>Diventate nostri partner per il vostro prossimo scafo</h2>
  <p>Dal primo schizzo di concept fino al rapporto finale sulle tensioni, il nostro Hull Engineering Studio è il vostro partner nella creazione di una tavola che non è solo costruita — ma ingegnerizzata. Investiamo in anticipo le ore di simulazione affinché ogni saldatura, ogni strato di laminato e ogni curva dello scafo ci sia per un motivo.</p>
  <p>Che abbiate bisogno di una modifica minore a un modello esistente o di un progetto completamente nuovo, siamo pronti a discutere i vostri requisiti.</p>

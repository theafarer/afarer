intro: >-
  Lo scafo è la spina dorsale di qualsiasi gommone. Deve essere abbastanza leggero da planare in modo efficiente, abbastanza resistente da assorbire i carichi d'impatto e dimensionalmente stabile su un'ampia gamma di temperature. Presso Afarer, il nostro Hull Engineering Studio combina
  modellazione CAD avanzata, analisi agli elementi finiti (FEA) e decenni di esperienza pratica in architettura navale per fornire scafi ottimizzati per la loro missione prevista — non forme generiche adattate da un catalogo.
content_html: >
  <h2>Dove la resistenza incontra l'idrodinamica</h2>

  <p>Lavoriamo con tre materiali primari per lo scafo — HDPE rotostampato, alluminio di qualità marina saldato e vetroresina posata a mano — e disponiamo delle competenze ingegneristiche per progettare, simulare e validare internamente ciascuno di essi.</p>


  <h2>Strumenti di progettazione e standard</h2>

  <p>Il nostro ambiente di ingegneria digitale comprende:</p>

  <table>
    <thead><tr><th>Capacità</th><th>Software / Strumento</th><th>Applicazione</th></tr></thead>
    <tbody>
      <tr><td>Modellazione parametrica 3D</td><td>SolidWorks Professional</td><td>Superficie dello scafo, sistema di ordinatature, staffa motore, disposizione del ponte</td></tr>
      <tr><td>Analisi agli elementi finiti</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Mappatura delle tensioni, analisi modale, simulazione di crash/urto</td></tr>
      <tr><td>Fluidodinamica computazionale</td><td>Ansys Fluent / Star-CCM+</td><td>Previsione della resistenza idrodinamica, ottimizzazione dell'assetto</td></tr>
      <tr><td>Ingegneria dei laminati</td><td>ESAComp / CADEC</td><td>Impilaggio degli strati in vetroresina, selezione del nucleo, stima del peso</td></tr>
      <tr><td>Simulazione del flusso in stampo</td><td>Moldex3D</td><td>Previsione dello spessore di parete nel rotostampaggio</td></tr>
    </tbody>
  </table>


  <h2>Il nostro flusso di lavoro ingegneristico</h2>

  <p>Ogni progetto di scafo, sia esso un modello standard o un progetto interamente personalizzato, segue un rigoroso processo in cinque fasi:</p>

  <ol>
    <li><strong>Raccolta dei concetti e dei requisiti</strong> — Ci confrontiamo con voi per definire il carico utile, il range di velocità, la capacità operativa in base allo stato del mare, i requisiti di traino ed eventuali attrezzature speciali per missione (boccaporti, posizioni delle consolle, integrazione del serbatoio carburante).</li>
    <li><strong>Superficie 3D &amp; calcolo idrostatico</strong> — La forma dello scafo viene modellata in SolidWorks e verificata per la stabilità idrostatica (GM, braccio raddrizzante) mediante strumenti di analisi integrati.</li>
    <li><strong>Analisi strutturale agli elementi finiti (FEA)</strong> — Vengono definiti i casi di carico: statico (equipaggio + attrezzatura), dinamico (impatti in planata a 5g) e slamming (impatto con l'acqua dalla cresta di un'onda a 3 m/s). I campi di tensione vengono esaminati; è obbligatorio un fattore di sicurezza ≥ 2.5.</li>
    <li><strong>Ottimizzazione della resistenza con CFD</strong> — Lo scafo viene simulato in tre condizioni di carico e a cinque velocità. La superficie bagnata, l'angolo di assetto e la resistenza residua vengono ridotti in modo iterativo.</li>
    <li><strong>Revisione del progetto &amp; rilascio</strong> — Il pacchetto ingegneristico completo (modello 3D, rapporto FEA, rapporto CFD, stima del peso, libro di impilaggio) viene esaminato dal nostro architetto navale senior prima del rilascio all'officina dei prototipi.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Distribuzione delle tensioni FEA — Scafo di Battello di Pattugliamento (Alluminio 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Fattore di sicurezza al carico utile massimo</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Riduzione della resistenza rispetto alla generazione precedente</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Pressione massima di slamming (limite di progetto)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Ore di calcolo FEA cumulate nel 2025</span>
      </div>
    </div>
  </div>


  <h2>Personalizzazione: il vostro scafo, le vostre regole</h2>

  <p>Nessun operatore ha requisiti identici a un altro. Un battello per la vigilanza portuale necessita di uno scafo a V ridotta per la stabilità a bassa velocità; un natante per intercettazioni veloci necessita di una V profonda con listelli para-spruzzo; un'imbarcazione di supporto subacqueo necessita
  di un baglio ampio e di uno specchio di poppa basso. Non forziamo la vostra applicazione in una forma di scafo preesistente. Progettiamo a partire dalla vostra specifica.</p>

  <p>Esempi di recenti progetti ingegneristici di scafi personalizzati:</p>

  <ul>
    <li>Uno scafo HDPE allungato di 6,8 m per un tour operator caraibico, con prua rinforzata per gli atterraggi in spiaggia (+15 % di spessore del fondo).</li>
    <li>Un battello di pattugliamento leggero in alluminio di 7,2 m per una guardia costiera, con paratie integrate per il serbatoio carburante e irrigidimenti per gli scomparti attrezzature.</li>
    <li>Un'imbarcazione per immersioni in vetroresina di 5,5 m con specchio di poppa ribassato e doppio vano batterie, progettata per facilitare il reimbarco dei subacquei.</li>
  </ul>


  <h2>I nostri ingegneri</h2>

  <p>Lo studio è diretto da un architetto navale senior con 14 anni di esperienza nella progettazione di natanti ad alta velocità, affiancato da due ingegneri meccanici specializzati in FEA e CFD. Tutti e tre possiedono lauree avanzate in ingegneria navale o architettura navale presso università di
  riconosciuto livello internazionale. Il team pubblica regolarmente su riviste di settore e presenta i propri lavori in conferenze quali l'International Conference on High-Performance Marine Vehicles.</p>


  <h2>Diventate nostri partner per il vostro prossimo scafo</h2>

  <p>Dal primo schizzo di concept fino al rapporto finale sulle tensioni, il nostro Hull Engineering Studio è il vostro partner nella creazione di un'imbarcazione che non è solo costruita — ma ingegnerizzata. Investiamo in anticipo le ore di simulazione affinché ogni saldatura, ogni strato di
  laminato e ogni curva dello scafo ci sia per un motivo.</p>

  <p>Che abbiate bisogno di una modifica minore a un modello esistente o di un progetto completamente nuovo, siamo pronti a discutere i vostri requisiti.</p>

features3_cases:
  tagline: Casi in evidenza
  title: Soluzioni personalizzate<br />per sfide reali
  isBeforeContent: false
  columns: 3
  items:
    - title: Flotta centro subacqueo europeo
      customer: Centri Subacquei BlueMed
      country: Grecia
      industry: Immersioni e Turismo Marittimo
      challenge: >-
        Richiesti 12 SUP configurati per immersioni per una catena di centri subacquei in diverse isole greche. Ogni tavola necessitava di attacchi per attrezzatura personalizzati, spazio per 8 bombole e una piattaforma stabile per l’ingresso dei subacquei in acque libere. La flotta doveva arrivare
        entro 60 giorni per l’inizio della stagione turistica.
      solution: >-
        Prodotti 12 modelli SUP Voyager Dive con supporti integrati per l'attrezzatura, piattaforme stabili e costruzione a punti di cucitura extra larga per la stabilità in imbarco. Ogni tavola è stata marchiata con la livrea della flotta del cliente. Tutte e 12 le tavole sono state sottoposte a
        test di pressione e spedite da Qingdao entro 55 giorni.
      product: SUP Voyager Immersione
      results: Tutte e 12 le tavole sono state consegnate in tempo per la stagione turistica. La flotta è in funzione quotidiana da 18 mesi senza guasti materiali. Il cliente ha ordinato 6 unità aggiuntive nel secondo anno.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Il SUP Voyager Dive è stato la spina dorsale delle nostre operazioni di immersione quotidiane. La stabilità è eccellente e la disposizione dello spazio di stivaggio delle attrezzature mantiene il ponte pulito e sicuro per i nostri ospiti.
      icon: tabler:lifebuoy
    - title: Programma Co-Brand distributore australiano
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: Programma Co-Brand & Partnership
      challenge: >-
        Distributore australiano aveva bisogno di una gamma di tavole SUP a marchio privato a prezzi competitivi per competere con i marchi cinesi venduti direttamente ai consumatori. Necessitava di 8 modelli unici che coprissero dal principiante all'avanzato, con grafica personalizzata, imballaggio
        personalizzato e consegna diretta ai punti vendita.
      solution: >-
        Sviluppati 8 modelli di SUP (All-Around, Touring, Yoga, Bambini, Sport, Ultra-Compatto, Ultra-Stabile, Whitewater) con pacchetto grafico esclusivo australiano. Confezionamento al dettaglio personalizzato con codici QR che collegano a video di montaggio. Logistica drop-ship configurata da
        Qingdao direttamente ai negozi al dettaglio australiani.
      product: Linea SUP personalizzata (8 modelli)
      results: Dal concetto alla prima spedizione in 90 giorni. Tasso di vendita al dettaglio dell'85% nella prima stagione. Il distributore ha ampliato la partnership per includere ulteriori modelli SUP nel secondo anno.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Un commerciante ha consegnato una linea completa di SUP in 90 giorni — dal design iniziale al punto vendita. La qualità è pari a quella dei marchi che vendono a un prezzo doppio.
      icon: tabler:currency-dollar
    - title: Fornitura imbarcazioni di soccorso Medio Oriente
      customer: Autorità Nazionale di Difesa Civile
      country: Emirati Arabi Uniti
      industry: Ricerca e soccorso
      challenge: >-
        L'organizzazione di difesa civile necessitava di 20 SUP pronti per la pattuglia per la ricerca e il salvataggio costiero, la sicurezza portuale e la risposta alle inondazioni. Erano richieste tavole ad alta visibilità, equipaggiamento di sicurezza completo e conformità alle normative
        marittime locali.
      solution: >-
        Forniti 20 modelli SUP Patrol con costruzione a punto alto in arancione ad alta visibilità, pacchetti di sicurezza completi, nastro riflettente SOLAS e costruzione rinforzata. Ogni tavola era certificata CE e testata secondo gli standard applicabili. Il pacchetto di documentazione includeva
        certificati di conformità per la registrazione locale.
      product: Pattuglia SUP
      results: Flotta schierata su 5 stazioni costiere. Le schede hanno operato in calore estremo (45°C) senza alcun degrado. Prestazioni e durabilità hanno superato le specifiche.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: La SUP Patrol ha superato i nostri requisiti operativi. In condizioni di calore estremo, le tavole non mostrano segni di degrado da UV dopo 24 mesi di utilizzo quotidiano.
      icon: tabler:alert-triangle
    - title: Partnership Co-Brand europea
      customer: North Sea Marine Equipment BV
      country: Paesi Bassi
      industry: Programma Co-Brand & Partnership
      challenge: >-
        Un noto marchio europeo di prodotti marini voleva espandersi nel mercato del SUP senza investire in impianti di produzione. Aveva bisogno di un partner white-label in grado di produrre 5 modelli di SUP (da 9 a 12 piedi) con marchio privato, certificazione CE e diritti di distribuzione
        esclusivi nell'UE.
      solution: >-
        Accordo di produzione white-label stabilito per 5 modelli SUP. Ogni modello brandizzato con loghi e schema di colori del cliente. Documentazione di certificazione CE preparata per ogni modello. Diritti esclusivi di distribuzione nell'UE concessi con impegni di ordine minimo. Documentazione
        tecnica fornita per la rete di assistenza locale.
      product: Linea SUP personalizzata (5 modelli)
      results: Accordo pluriennale firmato. Primo ciclo di produzione di 50 unità spedito entro 75 giorni. Marchio lanciato alla principale fiera commerciale con ricezione positiva da parte dei rivenditori.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: 'Collaborare con Afarer ci ha permesso di entrare nel mercato del SUP senza costruire una fabbrica: hanno fornito una soluzione chiavi in mano completa con certificazione CE e documentazione di supporto per i rivenditori.'
      icon: tabler:building
    - title: Flotta resort caraibico
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Turismo e Ospitalità Marina
      challenge: >-
        Il resort di lusso aveva bisogno di una flotta completa di attrezzature per sport acquatici per le attività degli ospiti: 40 tavole SUP per tour guidati, 20 SUP aggiuntivi per l'esplorazione della laguna, 10 tavole SUP per escursioni degli ospiti, oltre agli accessori. Tutte le attrezzature
        dovevano avere il marchio personalizzato del resort e dovevano essere consegnate prima della stagione turistica di punta.
      solution: >-
        Prodotto pacchetto SUP completo: 40 tavole SUP Voyager (modello All-Around), 20 tavole SUP Explorer, 10 tavole SUP Touring, oltre a dispositivi di sicurezza individuali (PFD), pagaie, pompe e kit di riparazione. Tutte le attrezzature stampate con il logo del resort e schema di colori
        tropicale. Spedizione containerizzata con manifesto dell'inventario completo.
      product: Pacchetto SUP completo (70 unità)
      results: La flotta è arrivata 6 settimane prima della stagione di punta. I punteggi di soddisfazione degli ospiti per le attività acquatiche sono aumentati del 40% rispetto all'anno precedente. L'attrezzatura è durata 3 stagioni con solo manutenzione ordinaria.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: L'approccio del pacchetto completo significava che ricevevamo tutto ciò di cui avevamo bisogno in una sola spedizione — schede e accessori tutti marchiati e pronti per l'uso degli ospiti. I nostri ospiti amano la qualità dell'attrezzatura.
      icon: tabler:beach
    - title: Contratto pattugliamento costiero USA
      customer: Agenzia di Sicurezza Costiera Atlantica
      country: Stati Uniti
      industry: Sicurezza Marittima e Applicazione della Legge
      challenge: L'agenzia di sicurezza costiera degli Stati Uniti richiedeva SUP da pattuglia robusti per operazioni in acque aperte. Erano necessarie tavole ad alte prestazioni con equipaggiamento secondo specifiche militari e conformità alle normative della US Coast Guard.
      solution: >-
        SUP pattuglia ingegnerizzato con costruzione a drop-stitch rinforzata, schemi di colori ad alta visibilità, supporti per apparecchiature di comunicazione criptate e punti di attacco integrati per l'equipaggiamento. Tavole rinforzate per operazioni pesanti. Documentazione di conformità USCG
        fornita.
      product: Pattuglia SUP
      results: L'agenzia ha riportato un tasso di prontezza della missione del 95% nei primi 12 mesi. È stato effettuato un ordine aggiuntivo per 8 unità.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: La SUP Patrol offre alle nostre squadre le prestazioni necessarie per le operazioni in acque aperte. La costruzione rinforzata garantisce una durabilità fondamentale senza compromettere la maneggevolezza.
      icon: tabler:shield

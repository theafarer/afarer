hero:
  tagline: 'Casi studio'
  title: 'Progetti reali, risultati reali<br />—afarer in azione'
  subtitle: 'Scopri come afarer collabora con distributori, marchi e operatori in tutto il mondo per fornire soluzioni marine personalizzate per ogni applicazione.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Casi studio afarer —progetti di produzione marina personalizzati'
features3_cases:
  tagline: 'Casi in evidenza'
  title: 'Soluzioni personalizzate<br />per sfide reali'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Flotta centro subacqueo europeo'
      description: 'Fornitura di 12 gommoni SUP 520 configurati per le immersioni a una catena di centri subacquei del Mediterraneo. Rastrelliere personalizzate per bombole, scale subacquee e branding della flotta. Consegnato in 60 giorni.'
      icon: tabler:lifebuoy
    - title: 'Programma OEM distributore australiano'
      description: 'Sviluppo di una gamma di paddleboard SUP a marchio privato per un distributore australiano di sport acquatici. 8 modelli, imballaggio personalizzato e logistica drop-ship. Dal concept alla prima spedizione in 90 giorni.'
      icon: tabler:currency-dollar
    - title: 'Fornitura imbarcazioni di soccorso Medio Oriente'
      description: "Fornitura di 20 gommoni SUP 450 Patrol a un'organizzazione di protezione civile mediorientale. Ponti autosvuotanti, dotazioni di navigazione complete e tubolari arancioni ad alta visibilità. Conformità agli standard normativi locali."
      icon: tabler:alert-triangle
    - title: 'Partnership OEM marchio europeo'
      description: 'Partnership di produzione a marchio bianco con un marchio nautico europeo. 5 modelli SUP, branding privato, diritti di distribuzione esclusivi per il mercato UE. Accordo pluriennale.'
      icon: tabler:building
    - title: 'Flotta resort caraibico'
      description: 'Pacchetto completo di attrezzature per sport acquatici per un resort caraibico: 40 paddleboard SUP, 20 SUP, 10 imbarcazioni gonfiabili e accessori. Branding personalizzato del resort su tutte le attrezzature.'
      icon: tabler:beach
    - title: 'Contratto pattugliamento costiero USA'
      description: "Fornitura di gommoni SUP 600 a un'agenzia di sicurezza costiera statunitense. Configurazione bimotore, opzioni consolle blindata e integrazione elettronica militare."
      icon: tabler:shield
cta:
  title: 'Hai un progetto da discutere?'
  subtitle: 'Ogni partnership afarer inizia con una conversazione. Raccontaci le tue esigenze e svilupparemo una soluzione.'
  actions:
    - variant: primary
      text: 'Avvia il tuo progetto'
      href: /contact
    - text: 'Scopri le nostre capacità'
      href: /brand/marine-expertise

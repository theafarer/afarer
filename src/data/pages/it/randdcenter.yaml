meta:
  title: Centro R&S | {SITE}
  description: Ricerca e Sviluppo — Test dei tessuti in PVC, ingegneria dello scafo, saldatura a radiofrequenza, test idrodinamici e controllo qualità. Servizi personalizzati di R&S disponibili.
hero:
  tagline: Centro R&S
  title: Centro R&S
  subtitle: Concentrato sul progresso
intro:
  - >-
    Il Centro di Ricerca e Sviluppo (R&S) di Afarer's è la forza trainante dietro la nostra missione di rivoluzionare l'attrezzatura per sport acquatici. Offriamo agli appassionati di sport acquatici di tutto il mondo prodotti più sicuri, confortevoli e divertenti attraverso un'innovazione
    incessante nelle tavole da paddle gonfiabili (SUP) e nelle barche. Il nostro team dedicato di ingegneri, designer ed esperti appassionati di sport acquatici sta plasmando il futuro del settore, alzando costantemente gli standard di qualità, prestazioni e sostenibilità.
  - >-
    Il nostro centro di R&S riunisce sotto un unico tetto scienziati dei materiali, architetti navali e ingegneri di produzione. Dalla formulazione dei materiali e dalla simulazione dello scafo allo sviluppo dei processi di saldatura e alle prove in mare a grandezza naturale, ogni fase dello
    sviluppo del prodotto è guidata dai dati e validata dai test.
mission:
  tagline: La nostra missione
  title: Innovare il futuro degli sport acquatici
  pillars:
    - icon: lightning

vision:
  tagline: La nostra visione
  title: Plasmare il futuro degli sport acquatici
  body: >-
    afarer si sforza di guidare l'industria delle barche gonfiabili e dei SUP attraverso un'innovazione continua, una qualità incrollabile e un impegno costante per la sicurezza e la sostenibilità —arricchendo in ultima analisi le esperienze degli appassionati di sport acquatici in tutto il mondo.
    Il Centro R&S di afarer è il luogo dove la passione incontra l'innovazione, stabilendo nuovi standard per l'industria degli sport acquatici.
labs_section:
  tagline: Laboratori
  title: I nostri laboratori
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: Laboratorio di Tessuti in PVC
      description: Ricerca e test continui di tessuti tubolari in PVC e Hypalon per resistenza alla trazione, resistenza ai raggi UV, abrasione e flessibilità a basse temperature per garantire affidabilità a lungo termine negli ambienti marini.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Studio di Ingegneria Hull
      description: Progettazione basata su CAD e analisi agli elementi finiti di scafi in HDPE, alluminio e fibra di vetro. Ogni scafo viene simulato digitalmente per la distribuzione dello stress e la resistenza agli urti prima che venga costruito il primo prototipo.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: Centro di Saldatura RF
      description: Struttura dedicata alla saldatura a radiofrequenza con controllo preciso della temperatura e della pressione, producendo giunzioni ad alta resistenza e a tenuta stagna che soddisfano gli standard dell'industria nautica per i mezzi gonfiabili.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Vasca di prova idrodinamica
      description: Prove su modelli in scala nel nostro bacino di prova interno per ottimizzare la forma dello scafo, le prestazioni in planata, la stabilità e l'efficienza del carburante in una gamma di condizioni di carico e di mare.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: Laboratorio di prototipi
      description: Struttura completa per prototipazione e attrezzaggio dove vengono costruiti, montati e collaudati in mare nuovi modelli. Ogni prototipo viene sottoposto a un programma di prova in acqua della durata minima di 20 ore prima dell'approvazione alla produzione.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Laboratorio di Qualità e Ispezione
      description: Laboratorio di controllo qualità dedicato che esegue test di trazione, cicli di ritenzione dell'aria, test di sbucciatura delle cuciture e certificazione dei materiali per garantire che ogni imbarcazione che lascia il laboratorio soddisfi le nostre specifiche pubblicate.
      href: /randdcenter/quality-inspection-lab

pillars:
  - title: Avanzamento tecnologico
    desc: Pionieristici nuovi materiali, design e processi di produzione per offrire prestazioni superiori del prodotto e longevità.
    icon: tech
  - title: Materiali Avanzati
    desc: Indagare PVC all'avanguardia, Hypalon, compositi e alternative sostenibili per caratteristiche del prodotto migliorate.
    icon: materials
  - title: Sostenibilità
    desc: 'Un Impegno Fondamentale: Siamo dedicati alla gestione ambientale attraverso la produzione sostenibile e materiali riciclabili.'

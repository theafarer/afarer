capabilities:
  tagline: Capacità
  title: Capacità di R&S
  subtitle: Quattro discipline principali che ci danno il controllo completo sullo sviluppo del prodotto — dalla ricerca delle materie prime alla certificazione finale.
  groups:
    - title: Scienza dei Materiali e Tecnologia dei Tessuti
      items:
        - Analisi e ottimizzazione delle formulazioni di PVC e Hypalon
        - Stabilizzazione UV, ritardanza di fiamma e sviluppo di additivi antimicrobici
        - Ingegneria della laminazione e adesione dei tessuti multistrato
        - Test di invecchiamento accelerato (UV, termico, umidità, nebbia salina)
    - title: Ingegneria degli Scafi e Idrodinamica
      items:
        - Progettazione parametrica di scafi 3D e ottimizzazione CFD
        - Analisi agli elementi finiti per carichi strutturali e da impatto
        - Test in vasca di traino su modello in scala e convalida delle prestazioni
        - Sviluppo di scafi su misura per profili di missione speciali
    - title: Tecnologia di saldatura e giunzione
      items:
        - Sviluppo e ottimizzazione del processo di saldatura dielettrica RF
        - Metodi di saldatura ad aria calda, a cuneo caldo e a ultrasuoni
        - Qualifica dell'incollaggio adesivo e del nastro per giunzioni
        - Modellazione della resistenza delle saldature e previsione della durata
    - title: Verifica, Certificazione e Conformità
      items:
        - Gestione della qualità e test di conformità CE
        - Supporto per test e certificazioni da parte di terzi indipendenti
        - Sviluppo di protocolli di test personalizzati per la qualificazione degli approvvigionamenti
        - Analisi dei guasti in servizio e indagine sulla causa principale

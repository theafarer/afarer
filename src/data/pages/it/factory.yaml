hero:
  tagline: Fabbrica
  title: Fabbrica & Produzione
  subtitle: 12.000 m² di produzione integrata — dalla materia prima alla tavola finita
intro:
  - >-
    Come braccio produttivo di **Aquafarer LLC (USA)**, il team operativo di Qingdao di afarer controlla ogni fase della produzione — dall'arrivo delle materie prime PVC e fibra di vetro all''ispezione finale pre-spedizione della tavola finita. Il nostro impianto produttivo nella Zona di Sviluppo Economico di
    Qingdao si estende per 12.000 metri quadrati e ospita officine dedicate per taglio PVC, termosaldatura tubolari, fabbricazione stampi FRP, stampa digitale SUP, assemblaggio finale e test qualità.
  - >-
    Integrando design, ingegneria, prototipazione, produzione e test sotto lo stesso tetto, eliminiamo le inefficienze della produzione conto terzi e manteniamo il controllo diretto sulla qualità costruttiva, la selezione dei materiali e i tempi di consegna. Ogni tavola che lascia la nostra
    officina è costruita dalla nostra gente, sulle nostre attrezzature, secondo i nostri standard.

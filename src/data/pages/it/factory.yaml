qc_section:
  tagline: Controllo Qualità
  title: Processo di Test e Garanzia Qualità
  subtitle: Ogni imbarcazione subisce test obbligatori prima della spedizione. Il nostro laboratorio qualità opera indipendentemente dalla produzione e riporta direttamente alla direzione.
  steps:
    - step: "1"
      title: Ispezione Materie Prime
      desc: I tessuti PVC, Hypalon e drop-stitch subiscono test di trazione (), propagazione strappo e verifica resistenza UV prima che qualsiasi lotto entri in produzione.
    - step: "2"
      title: Test Ritenzione Aria 48 Ore
      desc: Ogni camera tubolare è gonfiata al 125% della pressione nominale e mantenuta per 48 ore. Un calo di pressione sotto il 5% attiva il rigetto automatico e la reispezione delle giunture.
    - step: "3"
      title: Test Carico e Bilanciamento
      desc: Le imbarcazioni finite sono caricate alla massima capacità nominale e testate per stabilità, bordo libero e manovrabilità. Ogni imbarcazione è testata in acqua prima dell''ispezione finale.
oem_section:
  tagline: Progetti OEM
  title: Casi Studio Partnership Marchio e OEM
  subtitle: Dal concept al container —come aiutiamo i marchi globali a lanciare e scalare le loro linee di imbarcazioni gonfiabili.
  cases:
    - challenge: Un rivenditore europeo di outdoor necessitava di una linea SUP a marchio private label con grafica ponte unica, PVC ecologico e imballaggio pronto per la vendita al dettaglio —tutto consegnato in 60 giorni.
      solution: Sviluppo di file stampa digitale personalizzati, approvvigionamento PVC conforme REACH e compressione della campionatura da 3 turni a 1 co-localizzando il team di design nella nostra fabbrica di Qingdao.
      result: 55 giorni dall''ordine firmato al FOB. 2.400 unità su 4 SKU. Ordine ripetuto prima dell''arrivo del primo container.
    - challenge: Una startup americana di sport acquatici necessitava di un SUP drop-stitch ad alte prestazioni con forma scafo personalizzata, imballaggio co-branded e certificazione BSCI per il posizionamento al dettaglio.
      solution: Adattamento dello stampo SUP drop-stitch esistente con profilo rocker modificato, sviluppo grafica imballaggio co-branded e fornitura documentazione completa audit BSCI.
      result: Elencato con successo in 3 grandi catene outdoor USA. 5.000+ unità nel primo anno con 98% tasso di sell-through.
    - challenge: Un distributore australiano richiedeva una gamma SUP certificata CE con colori tubolari personalizzati, opzione upgrade Hypalon e conformità allo standard australiano AS 1799.
      solution: Produzione campioni pre-produzione con 4 varianti colore tubolari, approvvigionamento Hypalon CSM da fornitore giapponese e coordinamento test conformità AS 1799 di terze parti.
      result: Gamma SUP di 3 modelli lanciata sul mercato AU/NZ. Seguita da vincita gara d''appalto governativa per 12 SUP da pattuglia.
faq_section:
  tagline: FAQ
  title: Domande Frequenti B2B e OEM
  questions:
    - q: Qual è la quantità minima d''ordine (MOQ) per tavole SUP gonfiabili OEM?
      a: La MOQ inizia a 5—0 unità per modelli OEM standard. Stampi personalizzati e progetti private label richiedono un minimo di 200 unità a seconda della complessità. Ordini di prova e campionature sono disponibili per lanci di nuovi marchi.
    - q: afarer possiede la certificazione BSCI?
      a: Sì. La nostra fabbrica mantiene una certificazione conformità sociale BSCI valida (rapporto audit disponibile su richiesta). Deteniamo anche  per la gestione qualità e tutti i prodotti portano la certificazione CE . La documentazione conformità REACH e RoHS è fornita con ogni spedizione OEM.
    - q: Qual è il tempo di consegna tipico per un ordine OEM?
      a: Sì. La nostra fabbrica mantiene una certificazione conformità sociale BSCI valida (rapporto audit disponibile su richiesta). Deteniamo anche  per la gestione qualità e tutti i prodotti portano la certificazione CE . La documentazione conformità REACH e RoHS è fornita con ogni spedizione OEM.
    - q: Potete spedire FOB Qingdao o CIF al nostro porto?
      a: Sì. Spediamo FOB Qingdao, CIF verso i principali porti globali e DDP per partner qualificati. Il nostro team logistico gestisce prenotazione container, documentazione export e sdoganamento. Spediamo in 50+ paesi nei mercati UE, USA, AU e Asia.
b2b_moq: "MOQ standard: 5—0 unità per modello (SUP/SUP/drop-stitch). MOQ SUP: 2— unità. Ordini di prova benvenuti per nuove partnership."
production_flow:
  tagline: Production Flow
  title: From Material to Finished Boat
  subtitle: Every boat passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: "01"
      title: Material Receiving & Incoming QC
      description: All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.
      qc_check: Tensile strength (ASTM D751), tear resistance (ISO 4674), thickness gauge, adhesive viscosity, visual defect scan
      qc_threshold: 100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect
      responsibility: Incoming QC team (3 inspectors)
    - stage: "02"
      title: CNC Cutting & Material Prep
      description: Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.
      qc_check: Dimensional check against CAD DXF files, edge quality inspection, panel count verification
      qc_threshold: Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance
      responsibility: Cutting workshop lead
    - stage: "03"
      title: Welding & Drop-Stitch Bonding
      description: Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.
      qc_check: Peel test every 50 units (ASTM D751), weld width measurement, hot-air temperature log review, visual seam inspection under backlight
      qc_threshold: Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject
      responsibility: Welding QC (2 inspectors per shift)
    - stage: "04"
      title: Assembly & Rigging
      description: "Boats move to final assembly where all components are mated: hull + tubes, valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist."
      qc_check: 100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection
      qc_threshold: "Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)"
      responsibility: Assembly team lead + line QC
    - stage: "05"
      title: Pressure Testing & Quality Hold
      description: Every chamber is inflated to 1.25× rated pressure (typically 20—5 PSI) and held for 24—8 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.
      qc_check: 24h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair
      qc_threshold: Max 5% pressure drop over 24h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch
      responsibility: Quality lab (independent of production, reports to management)
    - stage: "06"
      title: Final Inspection & Packing
      description: Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.
      qc_check: Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification
      qc_threshold: AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected
      responsibility: Final QC team (4 inspectors) + Packing team lead

material_traceability:
  tagline: Tracciabilità
  title: Tracciamento dei Materiali e Controllo dei Lotti
  description: >-
    Ogni lotto di materia prima riceve un numero di lotto unico nel nostro sistema ERP. Dall'arrivo, attraverso la produzione fino al prodotto finito, l'elenco dei materiali di ogni imbarcazione si collega al lotto del fornitore originale. Ciò consente una completa tracciabilità a monte per
    qualsiasi richiesta di qualità o conformità.
  system: ERP personalizzato (sistema interno del Gruppo Qingdao Vatrad) etichette di lotto fisiche su ogni ordine di lavoro
  coverage: Il 100% dei materiali di produzione — PVC, Hypalon, tessuto drop-stitch, adesivi, valvole, componenti, imballaggi
  records_retained: 10 anni (secondo il requisito CE 2013/53/UE)
  suppliers:
    - material: PVC di qualità marina
      source: Fornitori cinesi e coreani
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Fornitore giapponese
      certified: ISO 9001, REACH
    - material: Tessuto a punto caduto
      source: Tessitura interna   partner esterno
      certified: Controllo qualità interno fornitore ISO 9001
    - material: Valvole e Hardware
      source: Fornitori OEM cinesi
      certified: ISO 9001, certificati dei materiali per lotto

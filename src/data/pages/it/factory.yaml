qc_section:
  tagline: Controllo Qualità
  title: Processo di Test e Garanzia Qualità
  subtitle: Ogni tavola subisce test obbligatori prima della spedizione. Il nostro laboratorio qualità opera indipendentemente dalla produzione e riporta direttamente alla direzione.
  steps:
    - step: '1'
      title: Ispezione Materie Prime
      desc: I tessuti PVC e drop-stitch subiscono test di trazione (ASTM D751), propagazione strappo e verifica resistenza UV prima che qualsiasi lotto entri in produzione.
    - step: '2'
      title: Test Ritenzione Aria 24–48 Ore
      desc: Ogni camera tubolare è gonfiata al 125% della pressione nominale e mantenuta per 24–48 ore. Un calo di pressione oltre il 5% attiva il rigetto automatico e la reispezione delle giunture.
    - step: '3'
      title: Test Carico e Bilanciamento
      desc: Le tavole finite sono caricate alla massima capacità nominale e testate per stabilità e rigidità. Ogni tavola è testata in acqua prima dell'ispezione finale.
oem_section:
  tagline: Progetti OEM
  title: Casi Studio Partnership Marchio e OEM
  subtitle: Dal concept al container — come aiutiamo i marchi globali a lanciare e scalare le loro linee di SUP gonfiabili.
  cases:
    - challenge: Un rivenditore europeo di outdoor necessitava di una linea SUP a marchio private label con grafica ponte unica, PVC ecologico e imballaggio pronto per la vendita al dettaglio — tutto consegnato in 60 giorni.
      solution: Sviluppo di file stampa digitale personalizzati, approvvigionamento PVC conforme REACH e compressione della campionatura da 3 turni a 1 co-localizzando il team di design nella nostra fabbrica di Qingdao.
      result: 55 giorni dall'ordine firmato al FOB. 2.400 unità su 4 SKU. Ordine ripetuto prima dell'arrivo del primo container.
    - challenge: Una startup americana di sport acquatici necessitava di un SUP drop-stitch ad alte prestazioni con forma personalizzata, imballaggio co-branded e certificazione BSCI per il posizionamento al dettaglio.
      solution: Adattamento dello stampo SUP esistente con sagoma modificata, sviluppo grafica imballaggio co-branded e fornitura documentazione completa audit BSCI.
      result: Elencato con successo in 3 grandi catene outdoor USA. 5.000+ unità nel primo anno con 98% tasso di sell-through.
    - challenge: Un distributore australiano richiedeva una gamma SUP certificata CE con colori personalizzati e conformità agli standard australiani.
      solution: Produzione campioni pre-produzione con 4 varianti colore e coordinamento test di conformità di terze parti.
      result: Gamma SUP di 3 modelli lanciata sul mercato AU/NZ. Seguita da vincita gara d'appalto governativa per 12 SUP da pattuglia.
faq_section:
  tagline: Domande Frequenti
  title: Domande Frequenti B2B e OEM
  questions:
    - q: Qual è la quantità minima d'ordine (MOQ) per tavole SUP gonfiabili OEM?
      a: La MOQ inizia a 5–10 unità per modelli OEM standard. Stampi personalizzati e progetti private label richiedono un minimo di 200 unità a seconda della complessità. Ordini di prova e campionature sono disponibili per lanci di nuovi marchi.
    - q: afarer possiede la certificazione BSCI?
      a: Sì. La nostra fabbrica mantiene una certificazione conformità sociale BSCI valida (rapporto audit disponibile su richiesta). Deteniamo anche ISO 9001 per la gestione qualità e tutti i prodotti portano la certificazione CE. La documentazione conformità REACH e RoHS è fornita con ogni spedizione OEM.
    - q: Qual è il tempo di consegna tipico per un ordine OEM?
      a: Il tempo di consegna standard è di 30–45 giorni dall'ordine confermato e dal deposito per la produzione OEM in serie. Lo sviluppo di stampi personalizzati aggiunge 15–20 giorni per la realizzazione degli stampi. È disponibile una produzione accelerata per ordini urgenti e picchi stagionali. I campioni prototipo vengono in genere spediti entro 15–20 giorni.
    - q: Potete spedire FOB Qingdao o CIF al nostro porto?
      a: Sì. Spediamo FOB Qingdao, CIF verso i principali porti globali e DDP per partner qualificati. Il nostro team logistico gestisce prenotazione container, documentazione export e sdoganamento. Spediamo in 50+ paesi nei mercati UE, USA, AU e Asia.
b2b_moq: 'MOQ standard: 5–10 unità per modello. Ordini di prova benvenuti per nuove partnership.'
production_flow:
  tagline: Flusso di produzione
  title: Dal materiale alla tavola finita
  subtitle: Ogni tavola passa attraverso 6 fasi di produzione con punti di controllo qualità ad ogni passaggio. Nessuna scorciatoia, nessuna ispezione saltata.
  stages:
    - stage: '01'
      title: Ricezione Materiale e Controllo Qualità in Entrata
      description: Tutti i materiali in arrivo sono registrati per numero di lotto nel nostro sistema ERP. Rotoli di tessuto in PVC, nuclei drop-stitch, valvole, adesivi e componenti hardware sono messi in quarantena fino alla firma del controllo qualità.
      qc_check: Resistenza alla trazione (ASTM D751), resistenza alla lacerazione (ISO 4674), spessore, viscosità dell'adesivo, controllo visivo dei difetti
      qc_threshold: 100% dei lotti testati. Rifiutare se la resistenza alla trazione < 90% della specifica, lo strappo < minimo della specifica, o qualsiasi difetto visivo
      responsibility: Squadra QC in arrivo (3 ispettori)
    - stage: '02'
      title: Taglio CNC e preparazione dei materiali
      description: Il nesting ottimizzato dal computer dispone i pannelli sul materiale di PVC per minimizzare gli sprechi. Le macchine da taglio CNC automatiche mantengono una precisione di posizionamento di 0,1 mm.
      qc_check: Controllo dimensionale rispetto ai file CAD DXF, ispezione della qualità dei bordi, verifica del conteggio dei pannelli
      qc_threshold: Ogni 20° pannello misurato. Tolleranza ±0,5 mm. Scartare il lotto se >2% fuori tolleranza
      responsibility: Responsabile del laboratorio di taglio
    - stage: '03'
      title: Saldatura e incollaggio drop-stitch
      description: I nuclei drop-stitch sono legati ai laminati esterni in PVC mediante laminazione a caldo. Le camere dei tubi sono saldate a RF o saldate ad aria calda. Le bande dei longheroni sono saldate a fusione a tre strati.
      qc_check: Test di strappo ogni 50 unità (ASTM D751), misurazione della larghezza della saldatura, revisione del registro della temperatura dell'aria calda, ispezione visiva della cucitura sotto retroilluminazione
      qc_threshold: Forza di adesione minima 8 N/cm. Tolleranza della larghezza di saldatura ±1 mm. Qualsiasi canalizzazione visibile = scarto
      responsibility: Controllo di qualità della saldatura (2 ispettori per turno)
    - stage: '04'
      title: Assemblaggio e montaggio
      description: "Le tavole vengono trasferite all'assemblaggio finale dove tutti i componenti vengono uniti: longheroni incollati e saldati, valvole installate, D-ring, maniglie, scatole per pinne e fissaggio del sacco da trasporto. Ogni unità segue una lista di controllo di assemblaggio a 100 punti."
      qc_check: Approvazione della checklist a 100 punti per unità, test della funzione della valvola (10 cicli apertura/chiusura), verifica della coppia dell'hardware, ispezione visiva
      qc_threshold: 'Politica di zero difetti su elementi critici per la sicurezza (valvole, anelli a D, maniglie). Difetti cosmetici minori: AQL 2,5 (ISO 2859)'
      responsibility: Capo squadra di assemblaggio + controllo qualità di linea
    - stage: '05'
      title: Verifica della Pressione e Controllo Qualità
      description: Ogni camera viene gonfiata a 1,25× la pressione nominale (tipicamente 20–25 PSI) e mantenuta per 24–48 ore. I sensori di pressione registrano continuamente. Le camere che superano il 5% di perdita di pressione vengono respinte e inviate per una nuova ispezione delle cuciture.
      qc_check: Registro della pressione per 24–48 ore, calibrazione del sensore verificata quotidianamente, lettura della pressione compensata per la temperatura, ri-test della giunzione dopo la riparazione
      qc_threshold: Perdita di pressione massima del 5% in 24–48 ore a temperatura stabile. Qualsiasi camera che superi questo valore = nuovo test completo del lotto di produzione al 100%
      responsibility: Laboratorio qualità (indipendente dalla produzione, riferisce alla direzione)
    - stage: '06'
      title: Ispezione finale e imballaggio
      description: Ispezione finale visiva e funzionale. Difetti della superficie, uniformità del colore, verifica dell'etichetta/BIN, integrità dell'imballaggio e completezza degli accessori. Le unità sono sottovuoto, confezionate in scatole e palletizzate per il carico sul container.
      qc_check: Ispezione visiva completa, checklist degli accessori per SKU, test di caduta del confezionamento (1 m, campione casuale), verifica della scansione dell'etichetta/codice a barre
      qc_threshold: AQL 2,5 per difetti gravi, AQL 4,0 per difetti minori. Tolleranza zero per difetti di sicurezza. Il 100% delle unità viene ispezionato visivamente
      responsibility: Team di QC finale (4 ispettori) + Capo squadra imballaggio
workforce:

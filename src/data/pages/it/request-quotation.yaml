meta:
  title: 'Richiedi un Preventivo — Produzione OEM di SUP | {SITE}'
  description: 'Richiedi un preventivo dettagliato per il tuo progetto di SUP gonfiabile o barca. Produzione OEM/ODM, marchio privato o flotte personalizzate: rispondiamo entro 2 giorni lavorativi.'
  keywords:
    - 'richiedere preventivo SUP'
    - 'preventivo OEM paddle board'
    - 'quotazione fabbrica SUP'
    - 'prezzo SUP gonfiabile'
hero_text:
  tagline: Richiedi un preventivo
  title: Richiedi un preventivo<br />per il tuo progetto
  subtitle: Dicci i tuoi requisiti e il nostro team risponderà con un preventivo dettagliato entro 2 giorni lavorativi.
steps2_process:
  title: Come Funziona
  subtitle: Quattro semplici passi dalla richiesta di informazioni al preventivo.
  items:
    - title: 'Passo 1: Invia le tue richieste'
      description: Compila il modulo sottostante con il tipo di prodotto, la quantità e le specifiche. Più dettagli fornisci, più accurato sarà il tuo preventivo.
      icon: tabler:file-text
    - title: 'Fase 2: Esaminiamo e Consigliamo'
      description: Il nostro team di ingegneri esamina le vostre esigenze e potrebbe contattarvi per chiarimenti. Forniamo raccomandazioni sulla configurazione e le opzioni del prodotto.
      icon: tabler:users
    - title: 'Passo 3: Ricevi il tuo preventivo'
      description: Riceverai un preventivo dettagliato che include il prezzo unitario, la quantità minima d'ordine, i tempi di consegna, le condizioni di pagamento e le opzioni di spedizione. Di solito entro 48 ore.
      icon: tabler:currency-dollar
    - title: 'Fase 4: Campione e Produzione'
      description: Dopo l'accettazione del preventivo, procediamo con la produzione di campioni (se applicabile) o direttamente con la produzione di massa. Aggiornamenti regolari durante tutto il processo.
      icon: tabler:building-factory
content_form:
  tagline: Modulo di preventivo
  title: Parlaci del tuo progetto
  subtitle: Tutti i campi con * sono obbligatori.
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Centro Subacqueo
        - Pesca
        - Turismo Marino / Resort
        - Ricerca e soccorso
        - Gommone da yacht
        - Imbarcazione da lavoro commerciale
        - Governo / Militare
        - OEM / Etichetta Privata
        - Personale / Ricreativo
        - Altro
    - name: Target Market
      type: text
      placeholder: ad es. Europa, Nord America, Medio Oriente
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: ad es. consegna entro 90 giorni
    - name: Additional Requirements
      type: textarea
      options:
        - Nessuna preferenza
        - PVC di grado marina (1100 dtex)
        - Hypalon / CSM Premium
        - Scafo in vetroresina
        - Scafo in alluminio
    - name: Engine Requirement
      type: text
      placeholder: es. fuoribordo 60 CV, senza motore, doppio 115 CV
    - name: Customization Required
      type: text
      placeholder: ad esempio colori personalizzati, marchio/logo, confezionamento, accessori speciali
    - name: Timeline
      type: text
      placeholder: ad esempio consegna entro 90 giorni
    - name: Additional Requirements
      type: textarea
      placeholder: Descrivi la tua applicazione, specifiche tecniche o eventuali requisiti speciali — includi disegni di riferimento, specifiche o link se disponibili
    - name: Upload Specification
      type: file
      placeholder: Carica la tua scheda tecnica, disegno o documento di riferimento (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Carica il tuo logo o opera d'arte per la personalizzazione del marchio (AI, EPS, PNG)
cta:
  title: Preferisci discutere via email?
  subtitle: Invia la tua richiesta direttamente al nostro team di vendita e risponderemo entro 24 ore.
  actions:
    - variant: primary
      text: Inviaci un'email direttamente
      href: /contact

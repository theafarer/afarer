meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Membri del club di paddle su tavole SUP Afarer abbinate
benefits:
  title: Vantaggi della flotta del club
  subtitle: Perché i club di canottaggio in 50 paesi scelgono Afarer come loro partner per le attrezzature.
  items:
    - metric: 40%
      label: Risparmio sui costi della flotta
      detail: Prezzi al dettaglio rispetto agli sconti dei club all'ingrosso
    - metric: 48h
      label: Sostituzione dei pezzi
      detail: Minimo tempo di inattività per la tua flotta in affitto
    - metric: Cinquecento
      label: Cicli in affitto
      detail: Durata di livello commerciale per tavola
    - metric: 5 anni
      label: Durata della flotta
      detail: Con la dovuta manutenzione e cura
packages:
  title: Programmi della flotta del club
  subtitle: Scegli il programma della flotta che corrisponde alle dimensioni e alle ambizioni del tuo club.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Guida al lancio + lista di controllo per la sicurezza
        - Guida al lancio   lista di controllo per la sicurezza
        - Certificato CE — tutta l'attrezzatura
      cta_text: Avvia il tuo club
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Programma pezzi di ricambio (15% di sconto)
        - Staff training session
        - Sessione di formazione del personale (online)
        - Certificato CE — tutta l'attrezzatura
      popular: true
      cta_text: Costruisci la tua flotta
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50 schede da corsa / prestazioni
        - Full accessory set
        - Event support kit
        - Pezzi prioritari (spedizione 24h)
        - Responsabile account dedicato
        - Opzione di divise personalizzate per la squadra
        - Certificato CE — tutta l'attrezzatura
      cta_text: Ottieni flotta di concorrenza
training:
  title: Pacchetti del Centro di Formazione
  subtitle: Tutto ciò di cui una scuola di SUP ha bisogno per gestire corsi di certificazione professionale.
  items:
    - name: Instructor Starter
      features:
        - 5 tavole SUP premium (grado istruttore)
        - 5 palette in carbonio per dimostrazioni
        - 5 giubbotti di salvataggio (taglia istruttore)
        - Guida al curriculum di formazione
        - Attrezzatura certificata CE
    - name: School Full Set
      features:
        - 20 tavole SUP (miste studenti e istruttori)
        - 20 pagaie 20 giubbotti di salvataggio (diverse taglie)
        - 10 giubbotti di salvataggio per principianti
        - 4 pompe   kit di riparazione
        - Curriculum di formazione e supporto alla certificazione
        - Attrezzatura certificata CE
features:
  title: Perché i club scelgono Afarer
  subtitle: Qualità costante, pezzi veloci e prezzi all'ingrosso pensati per club in crescita.
  items:
    - title: 500 cicli di noleggio
      description: Le tavole di qualità commerciale resistono a stagioni di utilizzo quotidiano.
      icon: tabler:shield-check
    - title: Colori personalizzati
      description: Abbina l'identità del tuo club con colori personalizzati della tavola e logo.
      icon: tabler:palette
    - title: Prezzi all'ingrosso
      description: Sconti sul volume per ordini di flotte di 10 schede.
      icon: tabler:discount
    - title: Parti Veloci
      description: Pezzi di ricambio spediti entro 48 ore.
      icon: tabler:truck-delivery
    - title: Supporto alla Crescita del Club
      description: Consigli su programmi di adesione, prezzi e organizzazione di eventi.
      icon: tabler:trending-up
    - title: Certificato CE
      description: Tutte le attrezzature rispettano gli standard di sicurezza internazionali.
      icon: tabler:certificate

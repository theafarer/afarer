meta:
  title: Laboratorio di Qualità e Ispezione — Collaudi e Certificazioni RIB Conformi ISO | {SITE}
  description: Verifica della qualità indipendente per gommoni. Prove di trazione, ciclismo di ritenzione dell'aria, test di distacco delle cuciture e certificazione dei materiali. Contatta il nostro laboratorio di qualità per test di terze parti.
back_text: Torna al Centro R&S
home_label: Casa
hero:
  tagline: Laboratorio 06
  title: Laboratorio di Qualità e Ispezione
  subtitle: Verifica indipendente — ogni test superato prima della consegna
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: Laboratorio di ispezione qualità Afarer test UV
intro: >-
  Ogni barca che lascia il nostro laboratorio porta la certificazione che ha superato un insieme definito di ispezioni di qualità e test sui materiali. Il nostro Laboratorio di Qualità e Ispezione è una funzione indipendente all'interno dell'organizzazione — riporta direttamente al direttore
  generale, non alla produzione — garantendo che nessuna pressione commerciale possa compromettere il controllo di ispezione. Se un lotto di materiali o una barca completata non soddisfa le specifiche pubblicate, il laboratorio ha l'autorità di fermare la spedizione fino a quando la non conformità
  non è risolta.
content_html: >
  <h2>Fidati, ma verifica</h2>

  <p>Il laboratorio opera secondo un sistema di gestione della qualità allineato a principi riconosciuti e i nostri metodi di prova si basano sulle norme ISO, ASTM ed EN ove applicabili. Conserviamo registrazioni dettagliate di ogni prova eseguita, creando una catena di tracciabilità completa dalla
  ricezione delle materie prime alla consegna finale dell'imbarcazione.</p>


  <h2>Apparecchiature di prova e capacità</h2>

  <table>
    <thead><tr><th>Apparecchiatura</th><th>Prove eseguite</th><th>Norma / Metodo</th></tr></thead>
    <tbody>
      <tr><td>Macchina di prova universale (50 kN)</td><td>Resistenza a trazione (tessuto), resistenza alla pelatura (giunzioni), propagazione dello strappo</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Banco di prova di tenuta d'aria (programmabile)</td><td>Prova di durata gonfiaggio/sgonfiaggio per 1000 cicli, prova di mantenimento della pressione per 30 min</td><td>ISO 6185 (interna)</td></tr>
      <tr><td>Attrezzo per pelatura delle giunzioni (pelatura motorizzata a 180°)</td><td>Resistenza alla pelatura di saldature e giunzioni incollate a 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Tester di pressione idrostatica</td><td>Resistenza alla penetrazione dell'acqua del tessuto (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Spessimetro digitale &amp; micrometro</td><td>Spessore del tessuto, spessore della parete del tubo, spessore del film adesivo</td><td>ISO 2286-3</td></tr>
      <tr><td>Camera climatica</td><td>Condizionamento termico (da -40 °C a +80 °C) per prove di fessurazione a freddo e invecchiamento termico</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Spettrofotometro colore</td><td>Misurazione del colore Delta-E dopo esposizione ai raggi UV</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>I gate di ispezione — dalla materia prima alla consegna</h2>

  <p>Ogni imbarcazione segue un piano qualità definito con punti di ispezione obbligatori. Nessuna imbarcazione può saltare un gate; ogni gate deve essere approvato da un ispettore della qualità prima che inizi la fase di produzione successiva.</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Ispezione dei materiali in ingresso</p>
            <p class="text-xs text-gray-500 mt-1">Lotto di tessuto, lotto di adesivo, ferramenta — tutti controllati rispetto alla specifica di ingresso prima del rilascio alla produzione.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Ispezione delle saldature in lavorazione</p>
            <p class="text-xs text-gray-500 mt-1">Provino di saldatura del primo pezzo testato (pelatura + controllo visivo) all'inizio di ogni turno di produzione.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Prova di tenuta d'aria delle camere</p>
            <p class="text-xs text-gray-500 mt-1">Ogni camera viene pressurizzata a 1.5 volte la pressione di esercizio e mantenuta per 30 min. I dati vengono registrati per numero di serie.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Ispezione pre-consegna</p>
            <p class="text-xs text-gray-500 mt-1">Imbarcazione completa ispezionata: tutti gli elementi di fissaggio serrati alla coppia prescritta, sistemi funzionanti, nessun difetto estetico. Checklist a 100 punti.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Certificazione finale</p>
            <p class="text-xs text-gray-500 mt-1">Rapporti di prova compilati, registrazioni di ispezione esaminate, Certificato di Conformità emesso.</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>Indicatori chiave della qualità (media mobile 2025)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Resa al primo passaggio (lotto di tessuto)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Tasso di scarto delle saldature (per metro lineare)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Camere collaudate ad aria prima del montaggio</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">Conformità alla categoria di progettazione</span>
    </div>
  </div>


  <h2>Il nostro team qualità</h2>

  <p>Il laboratorio è composto da un responsabile qualità (10 anni di esperienza nel QA navale, ASQ Certified Quality Engineer), due ispettori qualità (ciascuno con certificazione NDT di Livello 2 nel controllo visivo) e un tecnico dei materiali responsabile di tutte le prove fisiche. Il team
  partecipa ogni anno a prove di competenza tramite un fornitore indipendente di terze parti per garantire che i nostri risultati di prova rimangano accurati e riproducibili.</p>


  <h2>Test indipendenti per i clienti</h2>

  <p>Il nostro Laboratorio Qualità &amp; Ispezione è disponibile per servizi di test indipendenti. Se devi verificare una specifica di tessuto, convalidare un nuovo sistema adesivo o ottenere un rapporto di prova di terze parti per una qualifica di approvvigionamento, possiamo eseguire le prove
  secondo la norma applicabile ed emettere un rapporto di prova certificato.</p>

  <p>Esempi di recenti attività di test di terze parti:</p>

  <ul>
    <li>Confronto della resistenza alla pelatura di cinque film adesivi concorrenti per un programma di approvvigionamento militare europeo.</li>
    <li>Studio di invecchiamento accelerato (UV + cicli termici) per una nuova formulazione in PVC pigmentato arancione, con misurazioni intermedie regolari a intervalli di 500 h.</li>
    <li>Convalida della tenuta d'aria di 50 valvole di ritegno prototipo per un nuovo progetto di camera ad alta pressione.</li>
  </ul>


  <h2>Il nostro impegno nei tuoi confronti</h2>

  <p>Quando ricevi un'imbarcazione {SITE.name}, ricevi anche il suo fascicolo qualità — una raccolta dei risultati di prova che si applicano alla tua imbarcazione specifica. Certificato del lotto di tessuto, prove di pelatura delle saldature, registri delle prove di tenuta d'aria delle camere e
  checklist di ispezione pre-consegna. Ogni numero è tracciabile. Ogni ispettore è identificato. Non si tratta solo di burocrazia — è la nostra promessa che ciò che abbiamo consegnato è ciò che abbiamo specificato.</p>

  <p>Se dovessi avere un problema di qualità, puoi contattare direttamente il laboratorio — i dati di contatto sono riportati sul tuo certificato di conformità. Prendiamo sul serio ogni richiesta e ci impegniamo a svolgere un'indagine formale entro 48 ore.</p>

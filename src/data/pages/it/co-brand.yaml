  subtitle: 'Condizioni tipiche di una collezione co-brand. Prezzi in USD, FOB Qingdao. I design personalizzati di copertura aggiungono 15–20 giorni lavorativi di sviluppo; i nuovi stampi sono quotati per progetto.'
  caption: 'Tutti i prodotti co-brand restano prodotti Afarer e portano l’identità del marchio Afarer. Ambito del progetto, finestra di esclusiva e condizioni finali vengono concordati nel Co-Brand Project Agreement.'

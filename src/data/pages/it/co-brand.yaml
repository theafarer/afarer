features:
  title: 'Cosa Significa il Co-Branding in Afarer'
  subtitle: 'Il co-branding è il nostro programma di collaborazione progettuale — costruito attorno al marchio Afarer, alla protezione territoriale e alle collezioni limitate, non alla produzione senza marchio.'
  columns: 3
  items:
    - title: 'I Prodotti Afarer Restano Afarer'
      description: 'Una collezione co-brand è un’edizione limitata di tavole Afarer con la tua identità integrata. Mai senza marchio, mai un marchio di terzi e mai un programma aperto di marca privata.'
      icon: 'tabler:trademark'
    - title: 'Progettato con Te'
      description: 'I tuoi colori, il naming e la tua storia danno forma alla collezione. Il nostro team di design e ingegneria si occupa di coperture, grafiche, packaging e documentazione dal brief alla consegna.'
      icon: 'tabler:pencil'
    - title: 'Per Club, Resort, Eventi e Comunità'
      description: 'Collezioni di flotta per club di paddle e resort, edizioni per eventi, gare e serie comunitarie — tutte con la qualità e la garanzia Afarer.'
      icon: 'tabler:users'
    - title: 'Protegge i Partner di Paese'
      description: 'Il co-branding convive con il nostro modello un paese, un distributore. I partner nazionali conservano il proprio territorio; le collezioni co-brand non aprono la porta a marchi paralleli nel loro mercato.'
      icon: 'tabler:shield-check'
    - title: 'Ingegneria e Standard di Qualità'
      description: 'Ogni collezione parte dalla nostra filiera certificata con documentazione CE e ISO 9001, prove di pressione e gli stessi punti di controllo qualità della nostra gamma principale.'
      icon: 'tabler:certificate'
    - title: 'Diventa un Asset di Marchio'
      description: 'Una collezione limitata co-brand costruisce la tua storia sull’acqua — margine di vendita, contenuti per i media e una ragione per far tornare gli appassionati di paddle stagione dopo stagione.'
      icon: 'tabler:star'
table:

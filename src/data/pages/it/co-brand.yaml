faqs:
  title: 'Co-Brand — Domande Frequenti'
  subtitle: 'Come funziona il co-branding di Afarer e in cosa differisce da OEM e marca privata.'
  items:
    - title: 'Il co-branding è uguale a OEM o marca privata?'
      description: 'No. Afarer non gestisce più un programma aperto di OEM/marca privata. I prodotti co-brand restano prodotti Afarer — progettati, ingegnerizzati, collaudati e garantiti dal marchio Afarer. La tua identità appare come co-brand, non come prodotto di terzi senza marchio.'
    - title: 'Chi può avviare un progetto co-brand?'
      description: 'Attività qualificate di sport acquatici: partner di paese esistenti, club di paddle, resort e hotel, organizzatori di eventi e comunità. Inviaci un brief di progetto e confermiamo l’idoneità prima di iniziare il design.'
    - title: 'Il co-branding confligge con il mio distributore di paese?'
      description: 'No. Il modello un paese, un distributore ha la priorità. Le collezioni co-brand sono coordinate con il partner locale di paese dove esiste, così nel territorio protetto non compare alcun marchio parallelo o concorrente.'
    - title: 'Qual è l’ordine minimo per una collezione co-brand?'
      description: 'Le collezioni pilota partono da 30–50 unità. Le collezioni standard sono di 50–100 unità; le edizioni grandi o multiregione di 100+ unità. I tempi di sviluppo personalizzati si concordano per progetto.'
    - title: 'Cosa spetta ad Afarer rispetto al contributo del partner?'
      description: 'Afarer possiede design del prodotto, ingegneria, materiali, costruzione, QC e garanzia. I partner contribuiscono con concept della collezione, naming, colori, apporto grafico e l’ingresso sul mercato. Così resta un unico standard di qualità sull’acqua.'
    - title: 'Come faccio richiesta?'
      description: 'Compila il modulo di richiesta co-brand con la tua attività, il mercato e l’idea di collezione. Valutiamo l’idoneità e rispondiamo entro 3 giorni lavorativi con una proposta e il Co-Brand Project Agreement.'

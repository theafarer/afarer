features3_reasons:
  tagline: Perché scegliere afarer
  title: Sette ragioni per collaborare con noi
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Produzione reale, non commercio
      description: Possediamo e gestiamo una fabbrica di 12.000 m². Quando collabori con afarer, lavori direttamente con le persone che progettano, ingegnerizzano e costruiscono i tuoi prodotti — senza intermediari.
      icon: tabler:building-factory
    - title: 2. Approccio guidato dall'ingegneria
      description: Il nostro processo di progettazione inizia dal caso d'uso, non dalla categoria di prodotto. Ottimizziamo la forma dello scafo, la selezione dei materiali e la configurazione in base a come la barca sarà effettivamente utilizzata.
      icon: tabler:engine
    - title: 3. Qualità certificata
      description: Certificato CE, sistema di qualità ISO, conforme BSCI, conforme REACH, approvato USCG. Ogni prodotto soddisfa gli standard internazionali — non solo affermazioni.
      icon: tabler:certificate
    - title: 4. Co-Branding Flessibile
      description: 'Colori dei tubi, disposizione della console, branding, confezionamento: personalizziamo secondo le vostre specifiche. Nessuna pressione sul numero minimo di ordini. Iniziate con un prototipo, scalate con fiducia.'
      icon: tabler:adjustments
    - title: 5. Logistica Globale
      description: Magazzino negli Stati Uniti in California, spedizione diretta da Qingdao, trasporto aereo per ordini urgenti. Ci occupiamo di pratiche doganali e documentazione.
      icon: tabler:truck-delivery
    - title: 6. Supporto a vita
      description: 'Supportiamo le barche che abbiamo costruito 20 anni fa. Ricambi originali, consigli tecnici, indicazioni per le riparazioni: il nostro team è disponibile quando ne avete bisogno.'
      icon: tabler:lifebuoy
    - title: 7. Specifiche Oneste
      description: Classifiche di carico reali, dimensioni reali, peso reale. Nessuna esagerazione di marketing. Quello che pubblichiamo è ciò che ottieni — verificato da test indipendenti.
      icon: tabler:ruler-measure
testimonials:
  tagline: Fidato dai marchi di tutto il mondo
  title: Cosa Dicono i Nostri Partner
  items:
    - content: Abbiamo lavorato con diversi produttori in Cina, ma Afarer si distingue per il loro supporto ingegneristico e la qualità costante. Trattano il nostro marchio come se fosse il loro.
      name: — Partner Co-Brand, marchio europeo di sport acquatici
    - content: I loro gommoni Hypalon sono in servizio nella nostra flotta da oltre 5 anni. Manutenzione minima, eccellente resistenza ai raggi UV. La garanzia di 5 anni sui tubi ci dà fiducia.
      name: — Operatore di flotte, gruppo resort del Medio Oriente
    - content: Il team di Afarer ci ha aiutato a sviluppare un design personalizzato per tavola SUP dal concetto alla produzione in 90 giorni. La qualità ha superato le nostre aspettative.
      name: — Distributore, sport acquatici australiani

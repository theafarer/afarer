meta:
  title: 'Chi Siamo — Marchio Afarer di SUP Gonfiabili e Sport Acquatici | {SITE}'
  description: "Afarer è un marchio globale di SUP gonfiabili e sport acquatici, gestito da Aquafarer LLC (USA) e costruito dal nostro team operativo di Qingdao. Scopri la nostra storia, l'ingegneria, la qualità certificata e i programmi di partnership per paese."
  keywords:
    - 'marchio di sup gonfiabili'
    - 'marchio di sport acquatici'
    - 'distributore sup per paese'
    - 'collezioni sup co-branded'
hero:
  tagline: Chi siamo
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Officina afarer
  title: |
    Ingegneria navale, <br />
    alla <span class="text-accent dark:text-white">afarer</span>
  subtitle: "Siamo nati in un'officina costiera con una tavola e una convinzione incrollabile: i prodotti nautici dovrebbero essere costruiti come se la vita dipendesse da loro — perché è così. Oggi spediamo in oltre 40 paesi, ma ogni scafo passa ancora attraverso le stesse mani che hanno fondato l'azienda."
stats:
  title: In numeri
  columns: 4
  stats:
    - title: Scafi consegnati
      amount: '2.400+'
    - title: Paesi serviti
      amount: '40'
    - title: Anni di esperienza combinata
      amount: '60'
    - title: Tempo medio di risposta (ore)
      amount: '24'
features3_what_we_build:
  title: Cosa costruiamo
  subtitle: Una linea di prodotti mirata che conosciamo a fondo — niente esperimenti a metà, niente badge engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: Tavole SUP
      description: Tavole SUP gonfiabili da 9 ft a 12 ft. Progettate per touring, yoga, pesca e uso familiare.
      icon: tabler:ship
    - title: SUP gonfiabili
      description: Tavole SUP gonfiabili in PVC da 9 ft a 12 ft. Leggere, robuste e facili da riporre.
      icon: tabler:rowing
    - title: Pack SUP premium
      description: SUP compatti e altamente specificati, costruiti su misura per il vostro marchio o per le esigenze della vostra flotta.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accessori
      description: Pagaie, pompe, coperture, borse stagne ed elettronica. Tutti compatibili con le nostre tavole.
      icon: tabler:package
    - title: Riparazione e assistenza
      description: Riparazione tavole interna, sostituzione pad e upgrade accessori.
      icon: tabler:tool
    - title: Costruzioni su misura
      description: Progettazione su progetto per clienti commerciali, scientifici e militari.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Costruzione personalizzata
steps2_values:
  title: I nostri valori
  subtitle: Tre principi che hanno plasmato ogni prodotto fin dal primo giorno.
  items:
    - title: Costruisci come se la tua famiglia ci salisse sopra
      description: Ogni scafo, ogni saldatura e ogni componente è trattato come se fosse per le nostre stesse famiglie.
      icon: tabler:heart
    - title: Ingegneria prima della vendita
      description: Se una specifica è sbagliata, modifichiamo la specifica — mai il cliente.
      icon: tabler:settings
    - title: Supporto oltre la garanzia
      description: Scafi di vent'anni ci chiamano ancora per ricambi — e rispondiamo ancora.
      icon: tabler:headset
steps2_milestones:
  title: Tappe fondamentali
  subtitle: Una versione breve della storia afarer.
  isReversed: true
  items:
    - title: Fondata in un'officina costiera
      description: Iniziata da due ingegneri navali con una CNC e un'idea incrollabile.
      icon: tabler:building-factory
    - title: Primi 1.000 scafi consegnati
      description: Raggiunto al settimo anno, principalmente tramite passaparola e clienti abituali.
      icon: tabler:circle-check
    - title: Programma di esportazione internazionale
      description: Consegna in oltre 40 paesi con partner di supporto locali in cinque continenti.
      icon: tabler:world
features2_locations:
  title: Le nostre sedi
  tagline: Trovaci
  columns: 3
  items:
    - title: Sede centrale e officina
      description: Tavole SUP gonfiabili da 9 ft a 12 ft. Progettate per touring, yoga, pesca e uso familiare.
    - title: Centro assistenza UE
      description: Porto mediterraneo — riparazione e supporto garanzia per clienti europei.
    - title: Rete partner APAC
      description: Partner di assistenza autorizzati in Australia, Giappone, Singapore e Hong Kong.
brand_hub_tagline: Marchio
brand_hub_title: Scopri il nostro marchio
brand_hub_subtitle: Approfondisci la nostra competenza in ingegneria SUP, presenza globale e i principi che ci guidano.
brand_hub_cards:
  - title: Competenza Navale
    desc: Decenni di scienza dei materiali, produzione di precisione e test reali — dalla fabbricazione in PVC al design di scafi a V profondo e tecnologia drop-stitch.
    link: /brand-marine-expertise
    link_label: Scopri di più →
  - title: Presenza Globale
    desc: Spedizione in oltre 50 paesi dal nostro stabilimento di Qingdao con partner di servizio autorizzati in Europa, Asia-Pacifico e Americhe.
    link: /brand-global-presence
    link_label: Scopri di più →
  - title: Perché afarer
    desc: 'Un marchio costruito su qualità verificata — doppia certificazione (ISO 9001 + BSCI), conformità CE e partnership esclusive per paese con collezioni co-branded limitate per aziende di sport acquatici.'
    link: /brand-why-afarer
    link_label: Scopri di più →

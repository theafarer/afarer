hero:
  tagline: Certificazioni e Standard
  title: Certificazioni di Qualità<br />e Standard di Conformità
  subtitle: I prodotti Afarer sono fabbricati in conformità con gli standard internazionali di sicurezza marittima, i sistemi di gestione della qualità e le normative ambientali.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: certificazioni di qualità di Afarer e documentazione di conformità
content_certifications:
  tagline: Le nostre certificazioni
  title: Qualità Certificata,<br />Riconosciuta a Livello Globale
  subtitle: Ogni prodotto afarer è supportato da certificazioni che dimostrano il nostro impegno per la qualità, la sicurezza e la responsabilità ambientale.
  items:
    - title: Certificato CE
      description: Tutti i prodotti Afarer rispettano i requisiti della marcatura CE europea per le imbarcazioni da diporto, garantendo il rispetto degli standard di sicurezza, salute e protezione ambientale.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Il nostro sistema di gestione della qualità è certificato ISO 9001:2015, coprendo la progettazione, la produzione e la distribuzione di imbarcazioni gonfiabili e attrezzature marine.
      icon: tabler:clipboard-check
    - title: Marcato UKCA
      description: I prodotti venduti sul mercato britannico riportano la marcatura UKCA, che conferma la conformità alle normative britanniche per le attrezzature marine e i veicoli acquatici personali.
      icon: tabler:shield
    - title: Conforme BSCI
      description: Afarer è controllato da BSCI (Business Social Compliance Initiative), dimostrando pratiche di produzione etiche, condizioni di lavoro eque e responsabilità nella catena di approvvigionamento.
      icon: tabler:heart-handshake
    - title: Conforme a REACH
      description: Tutti i materiali utilizzati nei prodotti Afarer sono conformi alle normative UE REACH sulla sicurezza chimica, garantendo l'assenza di sostanze vietate nel nostro PVC, Hypalon o componenti.
      icon: tabler:flask
    - title: Prova dei materiali
      description: I tessuti vengono testati per resistenza alla trazione, resistenza allo strappo, degradazione da UV e prestazioni a crepe da freddo. Ogni lotto di produzione viene campionato e verificato.
      icon: tabler:test-pipe
content_factory:
  tagline: Norme di fabbrica
  title: Eccellenza nella Produzione<br />—Costruito su Specifica
  subtitle: La nostra struttura di 12.000 m² opera sotto rigorosi protocolli di controllo qualità in ogni fase della produzione.
  list:
    - 'Ispezione dei materiali in arrivo: Tutte le materie prime — tessuto in PVC, Hypalon, alluminio, compensato, adesivi — vengono testate rispetto alle specifiche prima di entrare in produzione.'
    - 'Controllo Qualità in Processo: Ogni fase della produzione ha punti di controllo QC documentati. La resistenza delle saldature, l''allineamento delle cuciture, l''installazione delle valvole e la coppia dei raccordi sono verificati inline.'
    - 'Test di pressione: Ogni camera gonfiabile viene testata a pressione a 1,5× la pressione nominale per 24 ore. Il tasso di perdita deve essere zero per superare il test.'
    - 'Ispezione finale: I prodotti completati vengono ispezionati per la precisione dimensionale, la finitura estetica, la completezza degli accessori e l''integrità dell''imballaggio prima della spedizione.'
    - 'Tracciabilità del lotto: Ogni prodotto porta un numero di serie collegato ai registri del lotto di produzione, consentendo la piena tracciabilità dal materiale grezzo al prodotto finito.'
content_safety:
  tagline: Norme di Sicurezza Marittima
  title: Sicurezza Prima<br />—Progettato per un Funzionamento Affidabile
  subtitle: I prodotti Afarer sono progettati e testati per soddisfare gli standard internazionali di sicurezza marina per uso commerciale e ricreativo.
  items:
    - title: ISO 6185
      description: Le imbarcazioni gonfiabili sono conformi agli standard ISO 6185 per costruzione, stabilità, galleggiamento e capacità di carico.
      icon: tabler:sailboat
    - title: Standard ABYC
      description: I sistemi elettrici e i sistemi di carburante seguono gli standard ABYC (American Boat & Yacht Council) per un'installazione e un funzionamento sicuri.
      icon: tabler:bolt
    - title: Conformità SOLAS
      description: Le attrezzature di sicurezza e gli apparecchi di salvataggio soddisfano i requisiti SOLAS (Sicurezza della Vita in Mare) laddove applicabile.
      icon: tabler:lifebuoy
cta:
  title: Hai bisogno di prodotti certificati per il tuo progetto?
  subtitle: Contatta il nostro team per discutere i requisiti di certificazione, la documentazione e la conformità per il tuo mercato.
  actions:
    - variant: primary
      text: Richiedere i documenti di certificazione
      href: /contact
    - text: Visualizza la nostra pagina della qualità
      href: /quality

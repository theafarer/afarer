hero:
  tagline: Laboratorio 04
  title: Vasca di prova idrodinamica
  subtitle: Validare le prestazioni prima del primo prototipo a grandezza naturale
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: Test di prestazioni in vasca idrodinamica Afarer
intro: >-
  È un errore comune pensare che i test idrodinamici siano riservati alle navi oceaniche. In realtà, le prestazioni di uno scafo planante di piccole dimensioni — come un gommone da 4–6 m — dipendono altrettanto dalla sua forma subacquea quanto un petroliera dipende dal suo bulbo di prua. L'angolo di
  trim, l'area bagnata, la generazione di spruzzi e la ventilazione influenzano in modo significativo velocità, consumo di carburante e comfort di navigazione. Presso Afarer, operiamo un bacino di prova idrodinamico dedicato che ci permette di quantificare questi effetti in scala modello —
  prima di impegnare metallo e tessuto in un prototipo a grandezza naturale.
content_html: >
  <h2>Perché testare in vasca una piccola imbarcazione?</h2>

  <p>Testare in scala di modello (in genere da 1:3 a 1:5) ci consente di iterare rapidamente e in modo economicamente vantaggioso le forme dello scafo. Una settimana in vasca può produrre gli stessi dati prestazionali che richiederebbero mesi di prove per tentativi ed errori a grandezza naturale — e
  a una frazione del costo.</p>


  <h2>Specifiche della struttura</h2>

  <table>
    <thead><tr><th>Parametro</th><th>Specifica</th></tr></thead>
    <tbody>
      <tr><td>Dimensioni della vasca</td><td>35 m (L) × 3.5 m (W) × 1.8 m (D)</td></tr>
      <tr><td>Carrello di traino</td><td>Servocomandato elettrico, velocità massima 12 m/s (23 kn), precisione della velocità ± 0.5 %</td></tr>
      <tr><td>Generatore di onde</td><td>Tipo a battente, stati del mare regolari &amp; irregolari programmabili, Hs fino a 0.3 m in scala di modello</td></tr>
      <tr><td>Strumentazione</td><td>Dinamometro a 6 componenti (resistenza, forza laterale, momento di imbardata), accelerometri, inclinometri, sonde per onde</td></tr>
      <tr><td>Acquisizione dati</td><td>Campionamento a 1000 Hz per canale, visualizzazione in tempo reale + suite di post-elaborazione</td></tr>
      <tr><td>Realizzazione dei modelli</td><td>Fresatura CNC interna e stampa 3D per scafi modello fino a 1.8 m di LOA</td></tr>
    </tbody>
  </table>


  <h2>Il nostro programma di test</h2>

  <p>Un programma standard di sviluppo dello scafo nella nostra vasca segue questa sequenza:</p>

  <ol>
    <li><strong>Costruzione del modello</strong> — Un modello in scala 1:3.5 viene fresato a CNC da schiuma ad alta densità e rivestito in fibra di vetro per garantirne la rigidità. Peso e CG vengono regolati per corrispondere alla condizione di pieno carico scalata secondo Froude.</li>
    <li><strong>Prove di resistenza</strong> — Il modello viene trainato a 8-10 velocità che coprono l'intervallo operativo. La resistenza totale viene misurata e scomposta nelle componenti attritiva e residua utilizzando il metodo ITTC-1957.</li>
    <li><strong>Misurazione di assetto &amp; affondamento</strong> — L'assetto dinamico e l'affondamento vengono registrati a ogni velocità. L'obiettivo è un angolo di assetto ottimale di 4-6° per gli scafi plananti.</li>
    <li><strong>Rilievo della scia</strong> — I tagli d'onda trasversali vengono misurati a due velocità per valutare la resistenza di formazione d'onda e individuare le interazioni d'onda trasversali che potrebbero causare interferenze a poppa.</li>
    <li><strong>Comportamento in mare (opzionale)</strong> — Prove in onde regolari di prora e di poppa per misurare la resistenza aggiuntiva, l'accelerazione verticale e la probabilità di slamming.</li>
    <li><strong>Analisi dei dati &amp; raccomandazioni</strong> — Viene consegnato un rapporto completo con grafici comparativi, curve velocità/potenza e raccomandazioni progettuali specifiche per lo scafo a grandezza naturale.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Risultati tipici dei test in vasca — Resistenza vs velocità (scafo di battello di pattugliamento, scala 1:3.5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Resistenza in scala di modello (N) alle velocità scalate secondo Froude. La previsione della potenza a grandezza naturale segue il metodo di previsione delle prestazioni ITTC-1978.</p>
  </div>


  <h2>Team di esperti</h2>

  <p>La nostra vasca è gestita da un idrodinamicista con dottorato in architettura navale e 8 anni di esperienza in vasche di traino presso un importante istituto di ricerca marittimo europeo. È supportato da un tecnico che prepara tutti i modelli e la strumentazione. Il team segue le Procedure
  Raccomandate ITTC (International Towing Tank Conference) per garantire che ogni test sia ripetibile, tracciabile e difendibile a livello internazionale.</p>


  <h2>Test in vasca per lo sviluppo di scafi personalizzati</h2>

  <p>La nostra vasca non viene utilizzata solo per gli scafi progettati internamente — eseguiamo regolarmente programmi di test per i clienti che desiderano convalidare una forma di scafo personalizzata o indagare su un problema prestazionale:</p>

  <ul>
    <li><strong>Confronto tra forme di scafo</strong> — Due o più forme di scafo candidate vengono testate in condizioni identiche, fornendo un confronto oggettivo in termini di resistenza/velocità/stabilità per supportare la scelta progettuale.</li>
    <li><strong>Ottimizzazione degli appendici</strong> — Piastre interceptor, listelli paraspruzzo, flap di assetto e chiglie possono essere testati in varie configurazioni per quantificare il loro contributo individuale alla riduzione della resistenza.</li>
    <li><strong>Studio di abbinamento del motore</strong> — I dati di resistenza vengono convertiti in una curva di previsione della potenza, consentendoti di selezionare la potenza ottimale del motore per la velocità e il carico utile desiderati.</li>
  </ul>


  <h2>Perché testare con noi?</h2>

  <p>Non ci limitiamo a fornirti un insieme di numeri grezzi. I nostri rapporti traducono i dati della vasca in raccomandazioni ingegneristiche concrete: "Alza il listello paraspruzzo di 8 mm per ridurre la superficie bagnata alla velocità di crociera", "Aumenta la deadrise allo specchio di poppa di
  3° per ridurre l'accelerazione da slamming" oppure "Sposta il centro di gravità longitudinale di 150 mm verso poppa per migliorare l'assetto planante". Esci con una chiara comprensione di cosa modificare e perché.</p>

  <p>La nostra vasca è inoltre disponibile per test indipendenti di terze parti a pagamento. Se stai sviluppando uno scafo e desideri una valutazione idrodinamica imparziale ed eseguita professionalmente, la tua richiesta è benvenuta.</p>

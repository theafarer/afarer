meta:
  title: 'Capacità Produttiva — Fabbrica di 12.000 m² | {SITE}'
  description: "Capacità della fabbrica afarer: impianto di 12.000 m² che produce oltre 15.000 barche all'anno con margini di espansione. Produzione OEM/ODM su larga scala di SUP gonfiabili e barche."
  keywords:
    - 'capacità produttiva SUP'
    - 'fabbrica di SUP gonfiabili'
    - 'produzione di paddle board'
    - 'fabbrica SUP Cina'
hero:
  tagline: Capacità produttiva
  title: Capacità di produzione e produzione annua
  subtitle: Struttura di 12.000 m² che produce 15.000 barche all'anno con possibilità di espansione
intro: >-
  afarer gestisce una delle più grandi strutture dedicate alla produzione di gommoni a Qingdao, in Cina. La nostra fabbrica di 12.000 m² è organizzata in sei officine specializzate che operano in parallelo, dandoci la capacità di produrre oltre 15.000 barche all'anno nelle linee SUP, kayak, tender, RIB e attrezzature di sicurezza.
highlights:
  - value: 12.000 m²
    label: Superficie totale di produzione
    detail: Attraverso 6 laboratori specializzati
  - value: '15.000+'
    label: 'Barche prodotte annualmente'
    detail: 'SUP, kayak, imbarcazioni RIB, tender, attrezzature di sicurezza'
  - value: '200+'
    label: Forza lavoro qualificata
    detail: 25 ingegneri, 2 turni/giorno
  - value: '50+'
    label: Paesi esportatori
    detail: UE, USA, AU, Medio Oriente, Asia
  - value: 30–45
    label: Tempi di consegna standard (giorni)
    detail: Dalla conferma dell'ordine di acquisto a FOB
  - value: '10+'
    label: Anni di esperienza nell'esportazione
    detail: Dal 2012
workshops:
  - title: Produzione di tavole SUP
    description: '4 linee di assemblaggio parallele per tavole SUP gonfiabili. Ogni linea può produrre 50–80 tavole per turno. Le stazioni di stampa digitale e serigrafica funzionano contemporaneamente. Capacità annua di SUP: 8.000+ tavole.'
    output: "8.000+ SUP all'anno"
  - title: 'Produzione di imbarcazioni RIB'
    description: "Officina specializzata di carene in fibra di vetro con 6 stazioni di stampaggio per carene di imbarcazioni fino a 7,6 m. L'area di saldatura e assemblaggio dei tubi gestisce 3–6 barche contemporaneamente. Capacità annuale di RIB: 2.000+ barche."
    output: "2.000+ RIB all'anno"
  - title: 'Gommoni e SUP'
    description: 'Linee di produzione multiuso per gommoni, kayak e tender. Hot-air welding stations, RF dielectric presses, and assembly workstations are reconfigured based on order mix. Annual capacity: 5,000+ units.'
    output: '5.000+ unità/anno'
  - title: Equipaggiamento di sicurezza
    description: 'Area di produzione in camera bianca separata per giubbotti di salvataggio e attrezzature di sicurezza. Stazioni dedicate per cucitura, inserimento della schiuma e test. Capacità annuale di giubbotti di salvataggio: 50.000+ unità.'
    output: '50.000+ giubbotti di salvataggio/anno'
oem_capacity:
  moq: 'SUP: 5–10 unità | Barca: 2–5 unità | Kayak/Tender: 10–50 unità | Stampo personalizzato: 200+ unità'
  lead_time: Standard 30–45 giorni. Campione 15–20 giorni. Servizio urgente disponibile.
  payment: T/T 30% acconto, 70% prima della spedizione. L/C, Western Union accettati.

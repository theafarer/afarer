meta:
  title: 'Competenza Marina — Ingegneria in Ogni Scafo | {SITE}'
  description: 'Decenni di ingegneria navale in ogni scafo. afarer padroneggia drop stitch, PVC marino e il design professionale di SUP gonfiabili.'
  keywords:
    - 'ingegneria navale'
    - 'produttore di SUP gonfiabili'
    - 'produzione di paddle board'
hero:
  tagline: Competenza marina
  title: Decenni di Ingegneria Marina<br />in Ogni Scafo
  subtitle: Afarer combina una profonda conoscenza della scienza dei materiali, la produzione di precisione e i test nel mondo reale per produrre natanti che performano quando conta.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: team di ingegneria marina e R&S di Afarer al lavoro
expertise_materials:
  tagline: Scienza dei materiali
  title: Scegliere il materiale giusto<br />per ogni applicazione
  subtitle: Lavoriamo con due materiali principali — ciascuno selezionato per specifici casi d'uso e requisiti di prestazione.
  columns: 3
  items:
    - title: PVC di qualità marina
      description: "Tessuto in PVC da 1100 denari — il nostro materiale più versatile. Stabilizzato ai raggi UV, resistente all'abrasione e conforme REACH. Ideale per tavole SUP dove contano peso ed efficienza dei costi."
      icon: tabler:droplet
    - title: Vetroresina e Polietilene
      description: SUP in vetroresina laminata per rigidità e scivolamento premium. Polietilene rotostampato per uso intenso da noleggio e soccorso che richiede la massima resistenza agli urti.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Capacità di produzione
  title: Produzione di Precisione<br />In Ogni Fase
  subtitle: La nostra struttura di 12.000 m² è dotata di macchinari specializzati per ogni fase della produzione.
  columns: 2
  items:
    - title: Taglio CNC
      description: Il taglio controllato dal computer garantisce pannelli di tessuto precisi e ripetibili con sprechi minimi. Ogni pezzo si adatta esattamente come progettato.
      icon: tabler:cpu
    - title: Saldatura ad alta frequenza
      description: La saldatura HF industriale crea giunzioni più resistenti del materiale di base. Il controllo costante della temperatura e della pressione assicura sigilli ermetici in ogni ciclo di produzione.
      icon: tabler:bolt
    - title: Assemblaggio del nucleo Drop Stitch
      description: Migliaia di fili di poliestere collegano gli strati di tessuto superiore e inferiore, permettendo l'inflazione ad alta pressione (15-20 PSI) per tavole SUP rigide e stabili.
      icon: tabler:building-arch
    - title: Prova di pressione
      description: Ogni prodotto gonfiabile viene collaudato a pressione prima della spedizione. Le tavole vengono testate a 1,25 volte la pressione nominale — se reggono a tale pressione, garantiranno prestazioni affidabili in acqua.
      icon: tabler:wind
    - title: Test di resistenza delle cuciture
      description: Campioni casuali di ogni lotto di produzione vengono sottoposti a test distruttivi della resistenza delle cuciture. I risultati vengono registrati e sono rintracciabili a specifici cicli di produzione.
      icon: tabler:files
    - title: Prove in acqua
      description: Ogni modello affronta prove in mare prima della certificazione. I test in condizioni costiere reali convalidano prestazioni, maneggevolezza e stabilità.
      icon: tabler:droplet
expertise_design:
  tagline: Progettazione e Ingegneria
  title: Progettato per condizioni reali
  subtitle: La nostra filosofia di progettazione inizia da come verrà utilizzata la tavola, per poi costruire l'ingegneria attorno a quell'uso.
  items:
    - title: Design dello scafo prestazionale
      description: Ogni forma dello scafo è ottimizzata per il suo caso d'uso — prue a dislocamento per lo scivolamento in touring, rocker maggiore per l'agilità nel surf, profili piatti e stabili per pesca e yoga.
    - title: Sicurezza Drop-Stitch
      description: Ogni tavola presenta un nucleo drop-stitch rigido con longheroni rinforzati. Se una sezione viene danneggiata, la struttura drop-stitch ad alta resistenza a trazione mantiene la tavola operativa.
    - title: Layout del ponte ergonomico
      description: La zonizzazione del deck pad, la posizione dell'impugnatura di trasporto e i punti di ancoraggio sono progettati attorno al comfort del rider durante l'uso prolungato — che si tratti di touring, pesca o pattugliamento.
    - title: Configurazione personalizzata
      description: 'Colori dei longheroni, configurazione del deck pad, supporti per accessori, capacità di carico: ogni modello può essere personalizzato per corrispondere a requisiti operativi specifici.'
cta:
  title: Hai in mente un'applicazione specifica?
  subtitle: Il nostro team di ingegneri può offrire consigli sulla selezione dei materiali, sulla progettazione e sulla produzione per il tuo progetto.
  actions:
    - variant: primary
      text: Chiedi ai nostri ingegneri
      href: /contact
    - text: Visualizza gamma di prodotti
      href: /products

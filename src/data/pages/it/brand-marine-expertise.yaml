hero:
  tagline: Competenza marina
  title: Decenni di Ingegneria Marina<br />in Ogni Scafo
  subtitle: Afarer combina una profonda conoscenza della scienza dei materiali, la produzione di precisione e i test nel mondo reale per produrre imbarcazioni che performano quando conta.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: team di ingegneria marina e R&S di Afarer al lavoro
expertise_materials:
  tagline: Scienza dei materiali
  title: Scegliere il materiale giusto<br />per ogni applicazione
  subtitle: Lavoriamo con tre materiali principali — ciascuno selezionato per specifici casi d'uso e requisiti di prestazione.
  columns: 3
  items:
    - title: PVC di qualità marina
      description: 1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.
      icon: tabler:droplet
    - title: Hypalon/CSM di qualità premium
      description: Resistenza chimica superiore e stabilità ai raggi UV. Le barche Hypalon possono durare 15-20 anni con la dovuta cura. Raccomandate per applicazioni commerciali, di soccorso e militari dove la durata a lungo termine è fondamentale.
      icon: tabler:shield
    - title: Vetroresina e Alluminio
      description: Deep-V fiberglass hulls for RIBs and patrol boats —wave-slicing performance in rough conditions. Aluminum hulls for heavy-duty commercial workboats requiring maximum strength and load capacity.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Capacità di produzione
  title: Produzione di Precisione<br />In Ogni Fase
  subtitle: La nostra struttura di 12.000 m² è dotata di macchinari specializzati per ogni fase della produzione.
  columns: 2
  items:
    - title: Taglio CNC
      description: Il taglio controllato dal computer garantisce pannelli di tessuto precisi e ripetibili con sprechi minimi. Ogni pezzo si adatta esattamente come progettato.
      icon: tabler:cpu
    - title: Saldatura ad alta frequenza
      description: La saldatura HF industriale crea giunzioni più resistenti del materiale di base. Il controllo costante della temperatura e della pressione assicura sigilli ermetici in ogni ciclo di produzione.
      icon: tabler:bolt
    - title: Assemblaggio del nucleo a punto basso
      description: Migliaia di fili di poliestere collegano gli strati di tessuto superiore e inferiore, permettendo l'inflazione ad alta pressione (15-20 PSI) per tavole SUP e pavimenti rigidi e stabili.
      icon: tabler:building-arch
    - title: Prova di pressione
      description: Every inflatable product is pressure-tested before shipping. SUP tubes are tested at 1.5x rated pressure —if it holds there, it will perform on the water.
      icon: tabler:wind
    - title: Test di resistenza delle cuciture
      description: Campioni casuali di ogni lotto di produzione vengono sottoposti a test distruttivi della resistenza delle cuciture. I risultati vengono registrati e sono rintracciabili a specifici cicli di produzione.
      icon: tabler:files
    - title: Analisi dell'acqua
      description: Every SUP model undergoes sea trials before certification. Real-world testing in coastal conditions validates performance, handling, and stability.
      icon: tabler:droplet
expertise_design:
  tagline: Progettazione e Ingegneria
  title: Progettato per condizioni reali
  subtitle: La nostra filosofia di progettazione inizia da come verrà utilizzata la barca, per poi costruire l'ingegneria attorno a quell'uso.
  items:
    - title: Progettazione dello scafo a V profonda
      description: I nostri scafi in fibra di vetro presentano angoli di deadrise calcolati e ottimizzati per la lunghezza e l'uso previsto di ogni modello. V più accentuato per prestazioni in acque mosse, più basso per stabilità.
    - title: Sicurezza a più camere
      description: Ogni barca è dotata di 3-7 camere d'aria indipendenti. Se un compartimento viene compromesso, le camere rimanenti mantengono la barca a galla e operativa.
    - title: Layout ergonomico
      description: La posizione della console, l'altezza del tubo e il posizionamento del sedile sono progettati attorno al comfort dell'operatore durante l'uso prolungato — che si tratti di pattugliare, pescare o trasportare.
    - title: Configurazione personalizzata
      description: 'Colori dei tubi, configurazione della console, capacità del carburante, supporti per accessori: ogni modello può essere personalizzato per soddisfare requisiti operativi specifici.'
cta:
  title: Hai in mente un'applicazione specifica?
  subtitle: Il nostro team di ingegneri può offrire consigli sulla selezione dei materiali, sulla progettazione e sulla produzione per il tuo progetto.
  actions:
    - variant: primary
      text: Chiedi ai nostri ingegneri
      href: /contact
    - text: Visualizza gamma di prodotti
      href: /products

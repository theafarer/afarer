  subtitle: 'Typowe warunki kolekcji co-brand. Ceny w USD, FOB Qingdao. Niestandardowe projekty pokładów dodają 15–20 dni roboczych rozwoju; nowe formy wyceniane są indywidualnie.'
  caption: 'Wszystkie produkty co-brand pozostają produktami Afarer i noszą tożsamość marki Afarer. Zakres projektu, okno wyłączności i ostateczne warunki ustalane są w Co-Brand Project Agreement.'

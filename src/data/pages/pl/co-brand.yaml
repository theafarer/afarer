faqs:
  title: 'Co-Brand — FAQ'
  subtitle: 'Jak działa co-branding Afarer i czym różni się od OEM i marki własnej.'
  items:
    - title: 'Czy co-branding to to samo co OEM lub marka własna?'
      description: 'Nie. Afarer nie prowadzi już otwartego programu OEM/private label. Produkty co-brand pozostają produktami Afarer — projektowane, konstruowane, sprawdzane jakościowo i wspierane przez markę Afarer. Twoja tożsamość pojawia się jako co-brand, a nie jako produkt bez marki od osoby trzeciej.'
    - title: 'Kto może rozpocząć projekt co-brand?'
      description: 'Kwalifikowane firmy sportów wodnych: istniejący partnerzy krajowi, kluby paddle, resorty i hotele, organizatorzy wydarzeń i społeczności. Wyślij nam brief projektu, a potwierdzimy zasadność przed rozpoczęciem projektowania.'
    - title: 'Czy co-branding wejdzie w konflikt z moim dystrybutorem krajowym?'
      description: 'Nie. Model jeden kraj, jeden dystrybutor ma priorytet. Kolekcje co-brand są koordynowane z lokalnym partnerem krajowym, jeśli taki istnieje, więc na chronionym terytorium nie pojawia się żadna równoległa ani konkurencyjna marka.'
    - title: 'Jakie jest minimalne zamówienie kolekcji co-brand?'
      description: 'Kolekcje pilotażowe zaczynają się od 30–50 szt. Standardowe kolekcje to 50–100 szt.; duże lub wieloregionalne edycje to ponad 100 szt. Harmonogramy niestandardowego rozwoju ustalane są indywidualnie.'
    - title: 'Co stanowi jakość Afarer, a co wkład partnera?'
      description: 'Afarer jest właścicielem projektu produktu, inżynierii, materiałów, konstrukcji, QC i gwarancji. Partnerzy wnoszą koncepcję kolekcji, nazewnictwo, kolory, grafikę i wejście na rynek. Dzięki temu na wodzie obowiązuje jeden standard jakości.'
    - title: 'Jak aplikować?'
      description: 'Wypełnij formularz zapytania co-brand ze swoją firmą, rynkiem i pomysłem na kolekcję. Ocenimy dopasowanie i odpowiemy w ciągu 3 dni roboczych propozycją oraz Co-Brand Project Agreement.'

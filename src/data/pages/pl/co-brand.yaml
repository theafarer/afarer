features:
  title: 'Co oznacza co-branding w Afarer'
  subtitle: 'Co-branding to nasz program partnerstwa projektowego — zbudowany wokół marki Afarer, ochrony terytorium i limitowanych kolekcji, a nie produkcji bez marki.'
  columns: 3
  items:
    - title: 'Produkty Afarer pozostają produktami Afarer'
      description: 'Kolekcja co-brand to limitowana edycja desek Afarer z wplecioną Twoją tożsamością. Nigdy bez marki, nigdy marka osoby trzeciej i nigdy otwarty program private label.'
      icon: 'tabler:trademark'
    - title: 'Projektowane z Tobą'
      description: 'Twoje kolory, nazewnictwo i historia kształtują kolekcję. Nasz zespół projektowy i inżynieryjny zajmuje się pokładami, grafiką, opakowaniami i dokumentacją od briefu po dostawę.'
      icon: 'tabler:pencil'
    - title: 'Dla klubów, resortów, wydarzeń i społeczności'
      description: 'Kolekcje flotyllowe dla klubów paddle i resortów, edycje eventowe na zawody i serie społecznościowe — wszystkie z jakością i gwarancją Afarer.'
      icon: 'tabler:users'
    - title: 'Chroni partnerów krajowych'
      description: 'Co-branding działa obok naszego modelu jeden kraj, jeden dystrybutor. Krajowi partnerzy zachowują swoje terytorium; kolekcje co-brand nie otwierają drzwi równoległym markom na ich rynku.'
      icon: 'tabler:shield-check'
    - title: 'Inżynieria i standardy jakości'
      description: 'Każda kolekcja wychodzi z naszego certyfikowanego łańcucha dostaw z dokumentacją CE i ISO 9001, testami ciśnieniowymi i tymi samymi punktami kontrolnymi QC co nasza kolekcja podstawowa.'
      icon: 'tabler:certificate'
    - title: 'Staje się aktywem marki'
      description: 'Limitowana kolekcja co-brand buduje Twoją własną historię na wodzie — marża ze sprzedaży, treści medialne i powód, dla którego paddleboardziści wracają sezon po sezonie.'
      icon: 'tabler:star'

hero:
  tagline: Laboratorium 05
  title: Warsztat prototypów
  subtitle: Od modelu CAD do gotowej do żeglugi łodzi — zbudowana, wyposażona i sprawdzona
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Afarer prototypowy warsztat produkcji łodzi
intro: >-
  Model CAD, bez względu na to, jak szczegółowy, nie może pokazać, jak łódź będzie się rzeczywiście prowadzić, dopóki nie znajdzie się na wodzie. Dlatego nasz Warsztat Prototypów został zaprojektowany, aby przekładać dane inżynieryjne na fizyczny, morskiego użytku statek tak szybko i dokładnie, jak
  to możliwe. Każdy nowy model Afarer — i każda znacząca budowa na zamówienie — przechodzi przez ten warsztat zanim narzędzia produkcyjne zostaną zatwierdzone.
content_html: >-
  <h2>Gdzie projekt staje się rzeczywistością</h2>

  <p>Warsztat jest w pełni wyposażony do równoległej produkcji kadłuba, komór pneumatycznych i olinowania. Takie równoległe podejście do pracy skraca czas realizacji prototypu do 8-12 tygodni od wydania dokumentacji inżynieryjnej, w porównaniu z 16-20 tygodniami przyjętymi w branży. Jeśli Twoje
  zastosowanie wymaga specjalistycznego rozwiązania, możemy przejść od koncepcji do walidacji na wodzie w niecałe trzy miesiące.</p>


  <h2>Możliwości warsztatu</h2>

  <table>
    <thead><tr><th>Stanowisko pracy</th><th>Wyposażenie</th><th>Przeznaczenie</th></tr></thead>
    <tbody>
      <tr><td>Wykonanie kadłuba</td><td>Piec do rotomouldingu (HDPE), stanowisko spawalnicze TIG (aluminium), formy do ręcznego laminowania (włókno szklane)</td><td>Produkcja kadłuba w skali 1:1 we wszystkich trzech typach materiałów</td></tr>
      <tr><td>Montaż komór pneumatycznych</td><td>Prasa do spawania RF, stanowisko tackingu gorącym powietrzem, stanowisko do testów ciśnieniowych</td><td>Wykonanie komór pneumatycznych w pełnej skali wraz ze wszystkimi przegrodami, stożkami i zaworami</td></tr>
      <tr><td>Olinowanie i wyposażanie</td><td>Wciągarka silnikowa (500 kg), rama makieta konsoli, prasa do końcówek węży hydraulicznych, tablica do montażu wiązek elektrycznych</td><td>Pełne wyposażenie: silnik, układ sterowania, elementy sterujące, układ paliwowy, elektronika, fotele</td></tr>
      <tr><td>Stanowisko oprzyrządowania pomiarowego</td><td>Czujnik prędkości GPS, przepływomierz paliwa, akcelerometry, zestaw termopar, rejestrator danych</td><td>Instalacja i kalibracja aparatury pomiarowej do prób morskich</td></tr>
    </tbody>
  </table>


  <h2>Proces powstawania prototypu — krok po kroku</h2>

  <ol>
    <li><strong>Przekazanie dokumentacji inżynieryjnej</strong> — Pakiet projektowy (model 3D, raport FEA, zestawienie materiałów, harmonogram układania laminatu) jest formalnie przeglądany przez kierownika warsztatu i inżyniera projektu. Wszelkie wątpliwości produkcyjne są zgłaszane i rozwiązywane przed rozpoczęciem cięcia.</li>
    <li><strong>Produkcja kadłuba</strong> — Kadłub jest budowany zgodnie ze specyfikacją inżynieryjną. W przypadku HDPE: program rotomouldingu jest ładowany z symulacji Moldex3D. W przypadku aluminium: płyty cięte CNC są spawane w stanowisku TIG zgodnie z zatwierdzoną mapą spoin. W przypadku włókna szklanego: układ laminatu jest wykonywany warstwa po warstwie zgodnie z książką układania.</li>
    <li><strong>Wykonanie komór pneumatycznych</strong> — Tkanina jest cięta przy użyciu szablonów CNC, a następnie zgrzewana RF w komory w pełnej skali. Każda komora jest napełniana do ciśnienia próbnego i pozostawiana na 24 h w celu wstępnej stabilizacji.</li>
    <li><strong>Montaż i olinowanie</strong> — Kadłub i komory pneumatyczne są łączone. Montowany jest silnik, podłączane są układ sterowania i elementy sterujące, instalowany jest układ paliwowy, a wszystkie obwody elektryczne są okablowane i weryfikowane.</li>
    <li><strong>Testy statyczne</strong> — Zanim łódź trafi do wody, przechodzi: kontrolę wyporności (pełne obciążenie + 30 % zapasu), test ciśnieniowy układu paliwowego, test pełnego skrętu układu sterowania, test ciągłości uziemienia instalacji elektrycznej.</li>
    <li><strong>Program prób morskich</strong> — 20 godzin testów na wodzie, szczegóły poniżej.</li>
    <li><strong>Przegląd prototypu</strong> — Odbywa się formalne spotkanie zatwierdzające z zespołami inżynierii, produkcji i jakości. Wszelkie wymagane zmiany projektowe są dokumentowane i uwzględniane w wersji produkcyjnej.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-godzinny program prób morskich — harmonogram testów</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Manewry portowe — prowadzenie przy niskich prędkościach, ruch wsteczny, kontrola odbojnic</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Próba prędkości — zweryfikowana GPS prędkość maksymalna, prędkość przelotowa, zużycie paliwa przy 3 punktach obrotów RPM</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test skrętu — średnica taktyczna, wysunięcie i przesunięcie przy 20 kn, lewa i prawa burta</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test uderzeń fal — wielokrotne przejazdy przez falę 0.5–1.0 m; akcelerometr na podstawie fotela sternika</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test stateczności — statyczny kąt przechyłu przy 4 osobach załogi + sprzęcie na prawej burcie, obciążenie asymetryczne</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Przebieg wytrzymałościowy — 3 h ciągłej pracy przy prędkości przelotowej; monitoring temperatury (silnik, paliwo, elektronika)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Inspekcja końcowa — kontrola wszystkich systemów po próbach, dokręcenie/sprawdzenie wszystkich elementów złącznych, udokumentowanie ustaleń</span>
      </div>
    </div>
  </div>


  <h2>Prototypowanie na zamówienie dla nietypowych zastosowań</h2>

  <p>Warsztat prototypów to miejsce, w którym rozwiązujemy problemy, których nie mogą rozwiązać standardowe łodzie produkcyjne. Ostatnie przykłady obejmują:</p>

  <ul>
    <li>Łódź ratownicza o długości 7.8 m dla organizacji poszukiwawczo-ratowniczej, wymagający niestandardowej konstrukcji kabiny z zabezpieczeniem przed przewróceniem, zintegrowanymi mocowaniami noszy i dziobową gondolą sonaru — wszystko zaprojektowane, zamontowane i przetestowane w naszym zakładzie.</li>
    <li>Ponton o długości 5.2 m dla wykonawcy badań hydrograficznych, z obniżoną pawężą, zdejmowanym masztem pomiarowym i wnękami na przetworniki przezposzyciowe zaprojektowanymi w celu minimalizacji zakłóceń przepływu.</li>
    <li>Łódź pomocnicza o napędzie elektrycznym o długości 4.5 m dla superjachty, gdzie prototyp posłużył do walidacji zasięgu, infrastruktury ładowania i poziomu hałasu, zanim klient zdecydował się na flotę czterech jednostek.</li>
  </ul>


  <h2>Nasz zespół prototypowania</h2>

  <p>W warsztacie pracuje ośmiu wszechstronnych techników morskich, z których każdy jest przeszkolony w co najmniej dwóch z trzech kluczowych dyscyplin (kadłub, komory pneumatyczne, olinowanie). Kierownik zespołu to mistrz budowy łodzi z 16-letnim doświadczeniem obejmującym zarówno pojedyncze
  konstrukcje na zamówienie, jak i serie produkcyjne. Każdemu prototypowi przypisywany jest dedykowany inżynier projektu, który jest jedynym punktem kontaktu dla klienta przez cały proces budowy i prób.</p>


  <h2>Zaangażowanie klienta</h2>

  <p>Aktywnie zachęcamy naszych klientów do udziału w kluczowych etapach budowy prototypu — zwłaszcza w przeglądzie wstępnego wyposażenia oraz w próbach morskich. Państwa uwagi operacyjne na tych etapach są bezcenne przy dopracowywaniu łodzi przed wprowadzeniem do produkcji. Nie budujemy w próżni;
  budujemy we współpracy z Państwem.</p>

  <p>20-godzinna próba morska to również okazja dla Państwa zespołu, aby zapoznać się z prowadzeniem łodzi, rozmieszczeniem systemów i wymaganiami konserwacyjnymi, co zapewnia płynne przejście do eksploatacji po dostawie łodzi produkcyjnych.</p>

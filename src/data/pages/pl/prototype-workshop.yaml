hero:
  tagline: Laboratorium 05
  title: Warsztat prototypów
  subtitle: Od modelu CAD do deski gotowej na wodę — zbudowana, wyposażona i sprawdzona
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Afarer prototypowy warsztat produkcji desek
intro: >-
  Model CAD, bez względu na to, jak szczegółowy, nie może pokazać, jak deska będzie się rzeczywiście prowadzić, dopóki nie spotka się z wodą. Dlatego nasz Warsztat Prototypów został zaprojektowany, aby przekładać dane inżynieryjne na fizyczną deskę gotową na wodę tak szybko i dokładnie, jak
  to możliwe. Każdy nowy model Afarer — i każda znacząca budowa na zamówienie — przechodzi przez ten warsztat, zanim narzędzia produkcyjne zostaną zatwierdzone.
content_html: >-
  <h2>Gdzie projekt staje się rzeczywistością</h2>

  <p>Warsztat jest w pełni wyposażony do równoległej produkcji kadłuba, burt i olinowania. Takie równoległe podejście do pracy skraca czas realizacji prototypu do 8-12 tygodni od wydania dokumentacji inżynieryjnej, w porównaniu z 16-20 tygodniami przyjętymi w branży. Jeśli Twoje
  zastosowanie wymaga specjalistycznego rozwiązania, możemy przejść od koncepcji do walidacji na wodzie w niecałe trzy miesiące.</p>


  <h2>Możliwości warsztatu</h2>

  <table>
    <thead><tr><th>Stanowisko pracy</th><th>Wyposażenie</th><th>Przeznaczenie</th></tr></thead>
    <tbody>
      <tr><td>Wykonanie kadłuba</td><td>Cięcie tkanin CNC, prasa do laminacji termicznej, stanowisko przygotowania rdzenia drop-stitch</td><td>Produkcja kadłuba w skali 1:1 we wszystkich trzech typach konstrukcji</td></tr>
      <tr><td>Montaż burt i komór</td><td>Prasa do spawania RF, stanowisko tackingu gorącym powietrzem, przyrząd do testów nadmuchiwania</td><td>Wykonanie burt i komór w pełnej skali wraz ze wszystkimi przegrodami i zaworami</td></tr>
      <tr><td>Olinowanie i wyposażanie</td><td>Przymiar do frezowania boxów płetw, oprzyrządowanie do spawania mocowań ładunku i uchwytów, stanowisko cięcia mat pokładowych</td><td>Pełne wyposażenie: płetwy, mocowania ładunku, zatyczki leash, uchwyty, maty pokładowe, zawory</td></tr>
      <tr><td>Stanowisko oprzyrządowania pomiarowego</td><td>Czujnik prędkości GPS, przetworniki ciśnienia, akcelerometry, zestaw termopar, rejestrator danych</td><td>Instalacja i kalibracja aparatury pomiarowej do prób morskich</td></tr>
    </tbody>
  </table>


  <h2>Proces powstawania prototypu — krok po kroku</h2>

  <ol>
    <li><strong>Przekazanie dokumentacji inżynieryjnej</strong> — Pakiet projektowy (model 3D, raport FEA, zestawienie materiałów, harmonogram układania laminatu) jest formalnie przeglądany przez kierownika warsztatu i inżyniera projektu. Wszelkie wątpliwości produkcyjne są zgłaszane i rozwiązywane przed rozpoczęciem cięcia.</li>
    <li><strong>Produkcja kadłuba</strong> — Kadłub jest budowany zgodnie ze specyfikacją inżynieryjną. W przypadku konstrukcji jednowarstwowej: rdzeń drop-stitch jest laminowany określoną powłoką PVC. W przypadku konstrukcji dwuwarstwowej: dodatkowa powłoka jest nakładana na podstawowy laminat przed cięciem wykroju. W przypadku konstrukcji fused: parametry laminacji są ładowane z zatwierdzonej karty procesu i weryfikowane na próbce pierwszoserii.</li>
    <li><strong>Wykonanie komór pneumatycznych</strong> — Tkanina jest cięta przy użyciu szablonów CNC, a następnie zgrzewana RF w komory w pełnej skali. Każda komora jest napełniana do ciśnienia próbnego i pozostawiana na 24 h w celu wstępnej stabilizacji.</li>
    <li><strong>Montaż i olinowanie</strong> — Kadłub i burty są łączone. Boxy płetw i mocowania ładunku są zamontowywane, zatyczki leash i uchwyty transportowe są instalowane, zawór do nadmuchiwania jest dokręcany, a mata pokładowa jest nakładana i wyrównywana.</li>
    <li><strong>Testy statyczne</strong> — Zanim deska trafi do wody, przechodzi: kontrolę wyporności (pełne obciążenie + 30 % zapasu), test utrzymania ciśnienia w komorach, test szczelności zaworu, test wyrywania uchwytów i mocowań.</li>
    <li><strong>Program prób morskich</strong> — 20 godzin testów na wodzie, szczegóły poniżej.</li>
    <li><strong>Przegląd prototypu</strong> — Odbywa się formalne spotkanie zatwierdzające z zespołami inżynierii, produkcji i jakości. Wszelkie wymagane zmiany projektowe są dokumentowane i uwzględniane w wersji produkcyjnej.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-godzinny program prób morskich — harmonogram testów</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Oswajanie na płaskiej wodzie — prowadzenie przy niskiej prędkości, skręcanie, kontrola postawy i trymu</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Próba prędkości — zweryfikowana GPS prędkość maksymalna, prędkość przelotowa, tempo podtrzymywane przy 3 częstościach ruchów wiosłem</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test skrętu — promień skrętu obrotowego i zamachowego, reakcja deski, burta lewa i prawa</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test fal — wielokrotne przejazdy przez falę 0.5–1.0 m; akcelerometr na pozycji stania pływaka</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test stateczności — statyczny kąt przechyłu przy 4 pływakach o różnej wadze, obciążenie przesunięte na prawą burtę</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Przebieg wytrzymałościowy — 3 h ciągłego tempa przelotowego; monitoring ciśnienia w komorach, temperatury burt i zmęczenia pływaka</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Inspekcja końcowa — kontrola wszystkich systemów po próbach, dokręcenie/sprawdzenie wszystkich elementów złącznych, udokumentowanie ustaleń</span>
      </div>
    </div>
  </div>


  <h2>Prototypowanie na zamówienie dla nietypowych zastosowań</h2>

  <p>Warsztat prototypów to miejsce, w którym rozwiązujemy problemy, których nie mogą rozwiązać standardowe deski produkcyjne. Ostatnie przykłady obejmują:</p>

  <ul>
    <li>Wysoce widoczny SUP ratowniczy dla organizacji poszukiwawczo-ratowniczej, wymagający zintegrowanych uchwytów ratunkowych, mocowań sprzętu ratowniczego i kadłuba o wysokiej wyporności do ratowania poszkodowanych — wszystko zaprojektowane, zamontowane i przetestowane w naszym zakładzie.</li>
    <li>Ekspedycyjny SUP turystyczny dla wykonawcy badań hydrograficznych, ze zdejmowanym masztem pomiarowym, uszczelnionymi portami na sprzęt i niskoprofilowym mocowaniem przetwornika zaprojektowanym w celu minimalizacji oporu.</li>
    <li>Kompaktowy SUP wędkarski dla floty resortu, gdzie prototyp posłużył do walidacji stabilności, olinowania sprzętu i trwałości w codziennej eksploatacji wypożyczalni, zanim klient zdecydował się na flotę czterech desek.</li>
  </ul>


  <h2>Nasz zespół prototypowania</h2>

  <p>W warsztacie pracuje ośmiu wszechstronnych techników morskich, z których każdy jest przeszkolony w co najmniej dwóch z trzech kluczowych dyscyplin (kadłub, burta, olinowanie). Kierownik zespołu to mistrz konstrukcji z 16-letnim doświadczeniem obejmującym zarówno pojedyncze
  konstrukcje na zamówienie, jak i serie produkcyjne. Każdemu prototypowi przypisywany jest dedykowany inżynier projektu, który jest jedynym punktem kontaktu dla klienta przez cały proces budowy i prób.</p>


  <h2>Zaangażowanie klienta</h2>

  <p>Aktywnie zachęcamy naszych klientów do udziału w kluczowych etapach budowy prototypu — zwłaszcza w przeglądzie wstępnego wyposażenia oraz w próbach morskich. Państwa uwagi operacyjne na tych etapach są bezcenne przy dopracowywaniu deski przed wprowadzeniem do produkcji. Nie budujemy w próżni;
  budujemy we współpracy z Państwem.</p>

  <p>20-godzinna próba morska to również okazja dla Państwa zespołu, aby zapoznać się z prowadzeniem deski, układem pokładu i wymaganiami konserwacyjnymi, co zapewnia płynne przejście do eksploatacji po dostawie desek produkcyjnych.</p>

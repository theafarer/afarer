back_text: Powrót do badań
hero:
  tagline: Inżynieria
  title: Jak wybrać grubość SUP — analiza inżynierska
  subtitle: 'Czas czytania: 6 minut'
content_html: >
  <h2>Trzy standardowe grubości</h2>


  <h3>4" (10 cm) – Touring i występy</h3>

  <ul>
    <li>Najwyższa sztywność – mniejsze ugięcie pod obciążeniem</li>
    <li>Najlżejsze – mniej materiału, mniejsza objętość powietrza</li>
    <li>Doskonałe śledzenie – zmniejszone kołysanie na boki</li>
    <li>Najszybszy – mniejszy opór, łatwiejszy ślizg</li>
    <li>Najlepsze dla: touringu, wyścigów, fitness, kajakarstwa fizycznego, doświadczonych kajakarzy</li>
  </ul>


  <h3>5" (12,7 cm) – Wszechstronność</h3>

  <ul>
    <li>Dobra sztywność – zrównoważony stosunek zgięcia do sztywności</li>
    <li>Umiarkowana waga – standardowe zastosowanie materiałów</li>
    <li>Dobra wtórna stabilność pierwotna</li>
    <li>Najlepsze do: rekreacyjnego wiosłowania, początkujących, okazjonalnego korzystania z jezior i rzek</li>
  </ul>


  <h3>6" (15,2 cm) – Stabilność i joga</h3>

  <ul>
    <li>Najwyższa pierwotna stabilność – masywna wyporność</li>
    <li>Najcięższe – więcej materiału PVC, większa objętość powietrza</li>
    <li>Najwolniejsze – większy opór, trudniej utrzymać ślizg</li>
    <li>Najlepsze do: Jogi/fitnessu, ciężkich kajakarzy (100 kg), bardzo wzburzone warunki</li>
  </ul>


  <h2>Analiza inżynierska</h2>

  <p>Sztywność nadmuchiwanego SUP zależy od wewnętrznego ciśnienia powietrza oraz momentu bezwładności przekroju deski. Przy napięciu 20 PSI płytka 4" wykazuje około 30% mniejsze ugięcie pod obciążeniem niż płytka o tej samej szerokości i długości. Podstawowa stabilność wynika z szerokości linii
  wodnej i wyporności; stabilność wtórna zależy od kształtu szyny i szerokości deski.</p>


  <h2>Grubość według masy wiosłacza</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <TR Class="BG-Gray-100">
        <klasa="p-3 tekst-left font-półpogrubiony tekst-gray-900 border">Waga wiosłaka</th>
        <klasa="p-3 tekst-left font-półpogrubiony tekst-gray-900 border">Zalecana grubość</th>
      </tr>
    </thead>
    <tbody>
      <tr><Klasa TD="p-3 ramka">poniżej 65 kg (143 lbs)</td><td klasa="p-3 ramka">4"</td></tr>
      <tr><Klasa TD="Obramowanie P-3">65 – 90 kg (143 – 198 funtów)</td><Klasa TD="Obramka P-3">5"</td></tr>
      <tr><Klasa TD="P-3 Border">90 – 115 kg (198 – 253 lbs)</td><td Class="P-3 Border">5" lub 6"</td></tr>
      <tr><td klasa="p-3 obramka">Powyżej 115 kg (253 lbs)</td><td klasa="p-3 obramka">6"</td></tr>
    </tbody>
  </table>


  <h2>Kompromis między grubością a ciśnieniem</h2>

  <p>Powszechnym błędnym przekonaniem jest to, że wyższe ciśnienie może zrekompensować nadmierną grubość. Przy 25 PSI płytka 6" wykazuje większą elastyczność niż płytka 4" przy 15 PSI, ponieważ geometryczny moment bezwładności dominuje w równaniu sztywności. Dla kajakarzy nastawionych na osiągi
  cieńsza deska przy niższym ciśnieniu przewyższa grubszą deskę przy wyższym ciśnieniu.</p>


  <h2>Skład Afarer</h2>

  <ul>
    <li><strong>deski 4":</strong> seria Cheetah Touring – 12' x 30" x 4" SUPs turystyczne do fitnessu i wiosłowania na dystansach</li>
    <li><strong>Deski 5":</strong> Seria Cheetah All-Round – 10'6" x 32" x 5" do użytku rekreacyjnego</li>
    <li><strong>deski 6":</strong> seria Cheetah Ultra-Stable – 10' x 34" x 6" do jogi, dużych kajakarzy i platform fotograficznych</li>
  </ul>

  <p>Wszystkie deski wykorzystują rdzenie ściegu drop-stitch 1 680 DTEX o ciśnieniu 20 PSI oraz laminaty PVC o grubości 1,2 mm.</p>

hero:
  tagline: Inżynieria
  title: Jak wybrać grubość SUP — analiza inżynierska
  subtitle: 'Czas czytania: 6 minut'
content_html: |-
  <h2>Trzy standardowe grubości</h2>

  <h3>4" (10 cm) – Turystyka &amp; wydajność</h3>
  <ul>
    <li>Najwyższa sztywność – mniejsze ugięcie pod obciążeniem</li>
    <li>Najlżejsza – mniej materiału, mniejsza objętość powietrza</li>
    <li>Doskonałe prowadzenie – mniejsze kołysanie na boki</li>
    <li>Najszybsza – mniejszy opór, łatwiejszy ślizg</li>
    <li>Najlepsza do: turystyki, wyścigów, wiosłowania kondycyjnego, doświadczonych wioślarzy</li>
  </ul>

  <h3>5" (12.7 cm) – Uniwersalna</h3>
  <ul>
    <li>Dobra sztywność – zrównoważony stosunek elastyczności do sztywności</li>
    <li>Umiarkowana waga – standardowe zużycie materiału</li>
    <li>Dobra stateczność pierwotna + wtórna</li>
    <li>Najlepsza do: rekreacyjnego wiosłowania, początkujących, okazjonalnego użytku na jeziorach i rzekach</li>
  </ul>

  <h3>6" (15.2 cm) – Stateczność &amp; joga</h3>
  <ul>
    <li>Najwyższa stateczność pierwotna – ogromna wyporność</li>
    <li>Najcięższa – więcej materiału PVC, większa objętość powietrza</li>
    <li>Najwolniejsza – większy opór, trudniej utrzymać ślizg</li>
    <li>Najlepsza do: jogi/fitnessu, cięższych wioślarzy (100+ kg), bardzo wzburzonych warunków</li>
  </ul>

  <h2>Analiza inżynierska</h2>
  <p>Sztywność nadmuchiwanej deski SUP zależy od wewnętrznego ciśnienia powietrza i momentu bezwładności przekroju deski. Przy 20 PSI deska 4" wykazuje około 30% mniejsze ugięcie pod obciążeniem niż deska 6" o tej samej szerokości i długości. Stateczność pierwotna wynika z szerokości na linii wodnej i wyporności; stateczność wtórna zależy od kształtu krawędzi bocznych i szerokości deski.</p>

  <h2>Grubość w zależności od wagi wioślarza</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Waga wioślarza</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Zalecana grubość</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Poniżej 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" lub 6"</td></tr>
      <tr><td class="p-3 border">Powyżej 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Kompromis między grubością a PSI</h2>
  <p>Powszechnym błędem jest przekonanie, że wyższe PSI może zrekompensować nadmierną grubość. Przy 25 PSI deska 6" wykazuje większe ugięcie niż deska 4" przy 15 PSI, ponieważ geometryczny moment bezwładności dominuje w równaniu sztywności. Dla wioślarzy nastawionych na wydajność cieńsza deska przy niższym ciśnieniu osiąga lepsze wyniki niż grubsza deska przy wyższym ciśnieniu.</p>

  <h2>Linia produktów Afarer</h2>
  <ul>
    <li><strong>Deski 4":</strong> seria Cheetah Touring – deski turystyczne SUP 12' x 30" x 4" do fitnessu i wiosłowania na dystansie</li>
    <li><strong>Deski 5":</strong> seria Cheetah All-Round – 10'6" x 32" x 5" do użytku rekreacyjnego</li>
    <li><strong>Deski 6":</strong> seria Cheetah Ultra-Stable – 10' x 34" x 6" do jogi, dużych wioślarzy i platform fotograficznych</li>
  </ul>
  <p>Wszystkie deski wykorzystują rdzenie drop-stitch o gęstości 1,680 DTEX z ciśnieniem znamionowym 20 PSI i laminatami PVC o grubości 1.2 mm.</p>

meta:
  title: 'Kontakt — wycena OEM i producent SUP | {SITE}'
  description: 'Skontaktuj się z afareren w sprawie wycen OEM/ODM, projektów private label lub flot profesjonalnych. Producent nadmuchiwanych desek SUP i łodzi — odpowiadamy w ciągu 2 dni roboczych.'
  keywords:
    - 'kontakt afarer'
    - 'wycena paddle board OEM'
    - 'profesjonalny dostawca SUP'
    - 'kontakt producent SUP'
hero_text:
  tagline: Kontakt
  title: SKONTAKTUJ SIĘ Z NAMI
contact_form:
  id: form
  title: Wyślij wiadomość
  subtitle: W sprawie wyceny, pytań technicznych lub partnerstwa —napisz do nas. Odpowiadamy w ciągu jednego dnia roboczego.
  email_to: info@afarer.com
  submit_button: Wyślij
  success_message: Dziękujemy! Twoja wiadomość została odebrana. Odpowiemy w ciągu jednego dnia roboczego.
  error_message: Wystąpił błąd podczas wysyłania. Spróbuj ponownie lub napisz bezpośrednio na adres e-mail.
  default_country_code: Jeden
  captcha:
    label: 'Antyspam: rozwiąż następujące zadanie'
  fields:
    - name: firstName
      label: Imię
      row: 1
      type: select
      optionsKey: kraje
      step: 1
    - name: lastName
      label: Nazwisko
      row: 1
      type: select
      options:
        - value: ''
          label: Wybierz szacowaną objętość...
        - value: próbka
          label: Tylko próbki / prototypy
        - value: 5-10
          label: 5–10 jednostek (Standardowe MOQ)
        - value: 100-500
          label: 100–500 jednostek
        - value: 500 plus
          label: 500 jednostek (Cennik ilościowy)
      step: 1
    - name: companyName
      label: Firma
      row: 2
      type: select
      options:
        - value: ''
          label: Wybierz typ dostosowania...
        - value: żaden
          label: Produkt standardowy (bez personalizacji)
        - value: logo
          label: Tylko niestandardowe logo / branding
        - value: pełny
          label: Pełny OEM (rozmiar, kolor, grafika, opakowanie)
        - value: konsultacja
          label: Niepewne — potrzebna konsultacja
      step: 1
    - name: address
      label: Adres
      row: 3
      type: select
      options:
        - value: ''
          label: Wybierz kategorię produktu...
        - value: wszystko
          label: Wszystkie produkty / Pełny katalog
        - value: siema
          label: Deski SUP / Deski do paddle
        - value: bezpieczeństwo
          label: Sprzęt ochronny / Kamizelki ratunkowe
        - value: akcesorium
          label: Akcesoria (pompki, wiosła, torby)
      step: 1
    - name: zip
      label: Kod pocztowy
      row: 4
      step: 2
    - name: country
      label: Kraj
      row: 4
      step: 2
    - name: email
      label: Email
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Szacowana wielkość zamówienia
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Potrzebujesz personalizacji?
      row: 7
      step: 2
    - name: productInterest
      label: Interesujące kategorie produktów
      row: 8
      step: 2
    - name: subject
      label: Temat
      row: 9
      step: 3
    - name: message
      label: Wiadomość
      row: 10
      type: textarea
      rows: 6
      step: 3

hero_text:
  tagline: Kontakt
  title: SKONTAKTUJ SIĘ Z NAMI
contact_form:
  id: form
  title: Wyślij wiadomość
  subtitle: W sprawie wyceny, pytań technicznych lub partnerstwa —napisz do nas. Odpowiadamy w ciągu jednego dnia roboczego.
  email_to: info@afarer.com
  submit_button: Wyślij
  success_message: Dziękujemy! Twoja wiadomość została odebrana. Odpowiemy w ciągu jednego dnia roboczego.
  error_message: Wystąpił błąd podczas wysyłania. Spróbuj ponownie lub napisz bezpośrednio na adres e-mail.
  default_country_code: '+1'
  captcha:
    label: 'Antyspam: rozwiąż następujące zadanie'
  fields:
    - name: firstName
      label: Imię
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Nazwisko
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Firma
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Adres
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Kod pocztowy
      row: 4
      step: 2
    - name: country
      label: Kraj
      row: 4
      step: 2
    - name: email
      label: Email
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Szacowana wielkość zamówienia
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Potrzebujesz personalizacji?
      row: 7
      step: 2
    - name: productInterest
      label: Interesujące kategorie produktów
      row: 8
      step: 2
    - name: subject
      label: Temat
      row: 9
      step: 3
    - name: message
      label: Wiadomość
      row: 10
      type: textarea
      rows: 6
      step: 3

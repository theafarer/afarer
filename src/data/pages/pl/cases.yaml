features3_cases:
  tagline: Wybrane przypadki
  title: Niestandardowe rozwiązania<br />dla realnych wyzwań
  isBeforeContent: false
  columns: 3
  items:
    - title: Flota europejskiego centrum nurkowego
      customer: Ośrodki Nurkowe BlueMed
      country: Grecja
      industry: Nurkowanie i turystyka morska
      challenge: >-
        Wymagano 12 desek SUP skonfigurowanych pod nurkowanie dla sieci centrów nurkowych na kilku greckich wyspach. Każda deska musiała mieć niestandardowe mocowanie sprzętu, miejsce na 8 butli oraz stabilną platformę do wejścia nurka do wody otwartej. Flota musiała dotrzeć w ciągu 60 dni na
        rozpoczęcie sezonu turystycznego.
      solution: >-
        Wyprodukowano 12 modeli SUP Voyager Dive z wbudowanymi uchwytami na sprzęt, stabilnymi platformami i konstrukcją drop-stitch o zwiększonej szerokości dla stabilności podczas wsiadania. Każda deska była oznakowana malowaniem floty klienta. Wszystkie 12 desek przeszło test ciśnieniowy i
        zostało wysłane z Qingdao w ciągu 55 dni.
      product: SUP Voyager Dive
      results: Wszystkie 12 tablic dostarczono na czas na sezon turystyczny. Flota była w codziennej eksploatacji przez 18 miesięcy bez żadnych poważnych awarii. Klient zamówił dodatkowe 6 jednostek w drugim roku.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Voyager Dive był fundamentem naszych codziennych operacji nurkowych. Stabilność jest doskonała, a układ przechowywania sprzętu utrzymuje pokład czysty i bezpieczny dla naszych gości.
      icon: tabler:lifebuoy
    - title: Program OEM australijskiego dystrybutora
      customer: Pacific Watersports Sp. z o.o.
      country: Australia
      industry: Produkcja OEM/ODM
      challenge: >-
        Australijski dystrybutor potrzebował gamy desek SUP pod własną marką w konkurencyjnych cenach, aby konkurować z chińskimi markami sprzedającymi bezpośrednio konsumentom. Wymagano 8 unikalnych modeli obejmujących poziomy od początkującego po zaawansowany, z niestandardową grafiką,
        niestandardowym opakowaniem i realizacją dostaw typu drop-ship do punktów detalicznych.
      solution: >-
        Opracowano 8 modeli SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) z ekskluzywnym australijskim pakietem graficznym. Niestandardowe opakowania detaliczne z kodami QR prowadzącymi do filmów instruktażowych. Logistyka wysyłki bezpośrednio skonfigurowana z
        Qingdao do australijskich sklepów detalicznych.
      product: Niestandardowa linia SUP (8 modeli)
      results: Od koncepcji do pierwszej wysyłki w 90 dni. Wskaźnik sprzedaży detalicznej na poziomie 85% w pierwszym sezonie. Dystrybutor rozszerzył współpracę o dodatkowe modele SUP w drugim roku.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Dalekomorski dostawca dostarczył kompletną linię SUP w ciągu 90 dni — od początkowego projektu do sklepowej półki. Jakość dorównuje markom sprzedającym produkty w dwukrotnie wyższej cenie.
      icon: tabler:currency-dollar
    - title: Dostawa łodzi ratunkowych na Bliski Wschód
      customer: Krajowy Urząd Obrony Cywilnej
      country: Zjednoczone Emiraty Arabskie
      industry: Poszukiwanie i ratownictwo
      challenge: Organizacja obrony cywilnej potrzebowała 20 gotowych do patrolu desek SUP do poszukiwań i ratownictwa przybrzeżnego, ochrony portu i reagowania na powodzie. Wymagano desek o wysokiej widoczności, pełnego wyposażenia bezpieczeństwa oraz zgodności z lokalnymi przepisami morskimi.
      solution: >-
        Dostarczono 20 modeli SUP Patrol z wysokowidoczną pomarańczową konstrukcją drop-stitch, pełnymi pakietami bezpieczeństwa, taśmą odblaskową SOLAS i wzmocnioną konstrukcją. Każda deska była certyfikowana CE i testowana zgodnie z obowiązującymi normami. Pakiet dokumentacji zawierał świadectwa
        zgodności do lokalnej rejestracji.
      product: Patrol SUP
      results: Flota rozmieszczona w 5 stacjach przybrzeżnych. Panele działały w ekstremalnym upale (45°C) bez pogorszenia. Wydajność i trwałość przekroczyły specyfikacje.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Patrol przekroczył nasze wymagania operacyjne. W ekstremalnych warunkach cieplnych deski nie wykazują oznak degradacji UV po 24 miesiącach codziennego użytkowania.
      icon: tabler:alert-triangle
    - title: Partnerstwo OEM z europejską marką
      customer: North Sea Marine Equipment BV
      country: Holandia
      industry: Produkcja OEM/ODM
      challenge: >-
        Ugruntowana europejska marka morska chciała rozszerzyć działalność na rynek SUP bez inwestowania w zakłady produkcyjne. Potrzebny był partner oferujący produkty private label, zdolny do wyprodukowania 5 modeli SUP (od 9 stóp do 12 stóp) z własnym brandem, certyfikacją CE i wyłącznymi prawami
        dystrybucji w UE.
      solution: >-
        Ustanowiono umowę na produkcję w modelu white-label dla 5 modeli SUP. Każdy model oznakowany logo klienta i schematem kolorystycznym. Przygotowano dokumentację certyfikacyjną CE dla każdego modelu. Przyznano wyłączne prawa dystrybucji w UE z minimalnymi zobowiązaniami zamówieniowymi.
        Dostarczono dokumentację techniczną dla lokalnej sieci serwisowej.
      product: Linia SUP na zamówienie (5 modeli)
      results: Podpisano wieloletnią umowę. Pierwsza seria produkcyjna 50 jednostek wysłana w ciągu 75 dni. Marka zaprezentowana na głównych targach z pozytywnym odbiorem wśród dealerów.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Współpraca z afarer pozwoliła nam wejść na rynek SUP bez budowy fabryki — dostarczyli kompletne rozwiązanie pod klucz z certyfikatem CE i dokumentacją wsparcia dla dealerów.
      icon: tabler:building
    - title: Flota karaibskiego kurortu
      customer: Paradise Island Resorts Sp. z o.o.
      country: Bahamy
      industry: Turystyka morska i hotelarstwo
      challenge: >-
        Luksusowy ośrodek potrzebował pełnego wyposażenia w sprzęt wodny do zajęć dla gości: 40 desek SUP do wycieczek z przewodnikiem, 20 dodatkowych desek SUP do eksploracji laguny, 10 desek SUP na wycieczki gościnne, oraz akcesoria. Cały sprzęt musiał mieć indywidualne oznakowanie ośrodka i
        zostać dostarczony przed szczytem sezonu turystycznego.
      solution: >-
        Wyprodukowano kompletny pakiet SUP: 40 desek SUP Voyager (model All-Around), 20 desek SUP Explorer, 10 desek SUP Touring, plus kamizelki ratunkowe, wiosła, pompki i zestawy naprawcze. Cały sprzęt oznakowany logo ośrodka i w tropikalnej kolorystyce. Wysyłka kontenerowa z pełnym spisem
        inwentarza.
      product: Pełny pakiet SUP (70 jednostek)
      results: Flota przybyła 6 tygodni przed sezonem szczytowym. Wyniki satysfakcji gości z zajęć sportów wodnych wzrosły o 40% rok do roku. Sprzęt wytrzymał 3 sezony przy jedynie rutynowej konserwacji.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Podejście obejmujące pełen pakiet oznaczało, że otrzymaliśmy wszystko, czego potrzebowaliśmy w jednej przesyłce — deski i akcesoria wszystkie oznakowane marką i gotowe do użytku gości. Nasi goście uwielbiają jakość sprzętu.
      icon: tabler:beach
    - title: Kontrakt na patrol wybrzeża USA
      customer: Agencja Bezpieczeństwa Wybrzeża Atlantyckiego
      country: Stany Zjednoczone
      industry: Bezpieczeństwo morskie i egzekwowanie prawa
      challenge: Amerykańska agencja ds. bezpieczeństwa wybrzeża potrzebowała wytrzymałych desek SUP do patroli na otwartych wodach. Potrzebne były wydajne deski z wyposażeniem zgodnym ze specyfikacją wojskową i przepisami Straży Przybrzeżnej USA.
      solution: >-
        Zaprojektowana deska SUP Patrol z wzmocnioną konstrukcją drop-stitch, kolorami o wysokiej widoczności, mocowaniami do sprzętu komunikacyjnego z szyfrowaniem oraz zintegrowanymi punktami mocowania wyposażenia. Deski wzmocnione do pracy w ciężkich warunkach. Dostarczona dokumentacja zgodności
        z USCG.
      product: Patrol SUP
      results: Agencja zgłosiła 95% gotowości misji w ciągu pierwszych 12 miesięcy. Złożono dodatkowe zamówienie na 8 jednostek.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Patrol SUP zapewnia naszym załogom wydajność wymaganą do operacji na otwartych wodach. Wzmocniona konstrukcja zapewnia niezbędną trwałość bez kompromisów w manewrowości.
      icon: tabler:shield

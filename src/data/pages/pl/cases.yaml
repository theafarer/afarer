hero:
  tagline: 'Studia przypadków'
  title: 'Realne projekty, realne rezultaty<br />—afarer w działaniu'
  subtitle: 'Zobacz, jak afarer współpracuje z dystrybutorami, markami i operatorami na całym świecie, dostarczając niestandardowe rozwiązania morskie do każdego zastosowania.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Studia przypadków afarer —niestandardowe projekty produkcji morskiej'
features3_cases:
  tagline: 'Wybrane przypadki'
  title: 'Niestandardowe rozwiązania<br />dla realnych wyzwań'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Flota europejskiego centrum nurkowego'
      description: 'Dostawa 12 łodzi SUP 520 skonfigurowanych do nurkowania dla sieci centrów nurkowych na Morzu Śródziemnym. Niestandardowe stojaki na butle, drabinki nurkowe i branding floty. Dostarczone w 60 dni.'
      icon: tabler:lifebuoy
    - title: 'Program OEM australijskiego dystrybutora'
      description: 'Opracowanie serii desek SUP pod własną marką dla australijskiego dystrybutora sportów wodnych. 8 modeli, niestandardowe opakowanie i logistyka drop-ship. Od koncepcji do pierwszej wysyłki w 90 dni.'
      icon: tabler:currency-dollar
    - title: 'Dostawa łodzi ratunkowych na Bliski Wschód'
      description: 'Dostawa 20 łodzi patrolowych SUP 450 Patrol dla organizacji obrony cywilnej na Bliskim Wschodzie. Samoodsączalne pokłady, pełny zestaw nawigacyjny i jaskrawopomarańczowe rury. Zgodność z lokalnymi normami regulacyjnymi.'
      icon: tabler:alert-triangle
    - title: 'Partnerstwo OEM z europejską marką'
      description: 'Partnerstwo produkcyjne typu white-label z europejską marką morską. 5 modeli SUP, prywatne brandowanie, wyłączne prawa dystrybucji na rynek UE. Umowa wieloletnia.'
      icon: tabler:building
    - title: 'Flota karaibskiego kurortu'
      description: 'Kompletny pakiet sprzętu do sportów wodnych dla karaibskiego kurortu: 40 desek SUP, 20 kajaków, 10 łodzi pneumatycznych i akcesoria. Niestandardowe brandowanie kurortu na całym sprzęcie.'
      icon: tabler:beach
    - title: 'Kontrakt na patrol wybrzeża USA'
      description: 'Dostawa łodzi patrolowych SUP 600 dla amerykańskiej agencji bezpieczeństwa wybrzeża. Konfiguracja dwusilnikowa, opcje opancerzonego konsola i integracja elektroniki wojskowej.'
      icon: tabler:shield

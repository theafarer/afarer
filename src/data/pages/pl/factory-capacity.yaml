  description: 'Zdolność produkcyjna fabryki afarera: obiekt o powierzchni 12 000 m² produkujący ponad 15 000 łodzi rocznie, z możliwością rozwoju. Produkcja OEM/ODM na dużą skalę nadmuchiwanych desek SUP i łodzi.'

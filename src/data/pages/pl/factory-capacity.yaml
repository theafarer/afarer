  afarer prowadzi jedną z największych wyspecjalizowanych fabryk łodzi nadmuchiwanych w Qingdao w Chinach. Nasza fabryka o powierzchni 12 000 m² jest zorganizowana w sześć wyspecjalizowanych warsztatów działających równolegle, co daje nam możliwość produkcji ponad 15 000 łodzi rocznie w liniach SUP, kajaków, łodzi pomocniczych, RIB i sprzętu bezpieczeństwa.

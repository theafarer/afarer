workshops:
  - title: Produkcja desek SUP
    description: '4 równoległe linie montażowe do nadmuchiwanych desek SUP. Każda linia może wyprodukować 50–80 desek na zmianę. Stacje do druku cyfrowego i sitodruku działają równocześnie. Roczna zdolność produkcyjna SUP: 8 000 desek.'
    output: 8 000 SUP rocznie
  - title: SUP Boat Production
    description: 'Dedykowany warsztat kadłubów z włókna szklanego z 6 stanowiskami form dla kadłubów SUP do 7,6 m. Obszar spawania i montażu rur obsługuje 3–6 SUP-y jednocześnie. Roczna wydajność SUP: ponad 2 000 łodzi.'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'Wielofunkcyjne linie produkcyjne dla łodzi nadmuchiwanych, kajaków i SUP. Stanowiska zgrzewania gorącym powietrzem, prasy dielektryczne RF i stanowiska montażowe są rekonfigurowane w zależności od miksu zamówień. Roczna wydajność: ponad 5 000 sztuk.'
    output: 5 000 jednostek/rok
  - title: Sprzęt ochronny
    description: 'Oddzielna strefa produkcji czystej dla kamizelek ratunkowych i sprzętu bezpieczeństwa. Dedykowane stanowiska szycia, wkładania pianki i testowania. Roczna wydajność kamizelek ratunkowych: ponad 50 000 sztuk.'
    output: 50 000 kamizelek ratunkowych/rok
oem_capacity:

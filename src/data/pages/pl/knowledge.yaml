meta:
  title: 'Wiedza — poradniki SUP i łodzi | {SITE}'
  description: 'Baza wiedzy afarera: poradniki o nadmuchiwanych deskach SUP, materiałach na paddle boardy, wyborze łodzi i wiedzy branżowej dla marek i profesjonalistów.'
  keywords:
    - 'wiedza o SUP'
    - 'poradnik nadmuchiwany SUP'
    - 'materiały na paddle boardy'
    - 'wiedza branżowa SUP'
hero:
  tagline: Graf wiedzy
  title: Wiedza o eksploracji wody
  subtitle: |
    Ustrukturyzowana baza wiedzy obejmująca technologię nadmuchiwanych SUP,<br />
    bezpieczeństwo wodne, inżynierię łodzi i planowanie przygód.
  taglineSection: Odkrywaj. Ucz się. Ruszaj z pewnością.
clusters:
  tagline: Klastry wiedzy
  title: Odkrywaj według tematu
  subtitle: Dogłębne spojrzenie na technologię, bezpieczeństwo i umiejętności stojące za każdym produktem afarer.
  items:
    - title: Wiedza o SUP
      description: Od wyboru pierwszej deski po zaawansowane techniki turystyczne — wszystko o wiosłowaniu na stojąco.
      icon: tabler:lifebuoy
      topics:
        - Jak wybrać pierwszy nadmuchiwany SUP
        - Najlepszy rozmiar SUP dla początkujących
        - Jak trudne jest wiosłowanie na stojąco?
        - Porównanie nadmuchiwanego i sztywnego SUP
        - Lista kontrolna bezpieczeństwa SUP
    - title: Wiedza o łodziach
      description: Poradniki techniczne dotyczące łodzi nadmuchiwanych, SUP, pontonów i kajaków — inżynieria, materiały i obsługa.
      icon: tabler:sailboat
      topics:
        - Wyjaśnienie typów łodzi nadmuchiwanych
        - Porównanie PVC vs Hypalon
        - Porównanie SUP vs ponton
        - Dogłębna analiza technologii drop-stitch
        - Przewodnik po morskiej nauce o materiałach
    - title: Wiedza o bezpieczeństwie
      description: Niezbędna wiedza o bezpieczeństwie dla każdego wioślarza — od wyboru kamizelki ratunkowej po odczytywanie pogody i techniki samoratownicze.
      icon: tabler:shield
      topics:
        - Lista kontrolna bezpieczeństwa SUP
        - Czy potrzebujesz kamizelki ratunkowej?
        - Przewodnik bezpieczeństwa wiosłowania oceanicznego
        - Bezpieczeństwo rzeczne dla nadmuchiwanych kajaków
        - Świadomość pogody i warunków wodnych
    - title: Technologia
      description: Inżynieria stojąca za produktami afarer — materiały, metody konstrukcyjne i testowanie jakości.
      icon: tabler:microscope
      topics:
        - Technologia PVC klasy morskiej
        - Wyjaśnienie rdzenia drop-stitch
        - Dlaczego PSI ma znaczenie dla nadmuchiwanych SUP
        - Zgrzewanie RF vs łączenie klejowe
        - Testowanie jakości i certyfikacja
    - title: Styl życia SUP i zastosowania specjalne
      description: Specjalistyczne aktywności na SUP — joga, wędkarstwo, psy, rodziny i porady dotyczące podróży.
      icon: tabler:heart
      topics:
        - Joga SUP i medytacja na wodzie
        - Łowienie ryb z dmuchanego SUP
        - Pływanie na desce z psami i dziećmi
        - Podróżowanie z twoim SUP samolotem i samochodem
        - Nieodłączne akcesoria i wyposażenie do SUP
    - title: Porównania i odniesienia SUP
      description: Porównania obok siebie, które pomogą Ci podejmować świadome decyzje.
      icon: tabler:chart-bar
      topics:
        - SUP kontra kajak — który jest dla Ciebie odpowiedni?
        - Porównanie materiałów PVC i Hypalon
        - Bezpieczeństwo jednoprzegrodowe vs wieloprzedziałowe
        - Wyjaśnienie materiałów do desek SUP
        - Druk UV kontra grafika na bloku EVA

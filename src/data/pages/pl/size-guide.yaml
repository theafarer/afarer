hero:
  title: Przewodnik po rozmiarach i specyfikacjach
  subtitle: Wymiary, pojemności i zalecane zastosowania dla każdego produktu afarer.
categories:
  inflatable: Nadmuchiwane SUP-y i kajaki zaprojektowane z myślą o przenośności bez uszczerbku dla wydajności. Dobierz odpowiedni rozmiar do swojej wagi i stylu wiosłowania.
  sup: Stand-up paddleboards for touring, yoga, fitness, and recreational paddling. Choose by length and rider weight.
  accessory: Akcesoria i sprzęt bezpieczeństwa uzupełniający Twój sprzęt wodny. Uniwersalne rozmiary z wieloma opcjami.

how_to_choose:
  title: Jak wybrać odpowiedni rozmiar
  cards:
    - title: Deski SUP
      description: Wybierz długość na podstawie swojej wagi i przeznaczenia. Szersze deski (32"+) oferują większą stabilność. Dłuższe deski (11-12 stóp) lepiej trzymają kurs podczas turystyki. Ciężsi wioślarze potrzebują desek o większej objętości.
    - title: Deski SUP turystyczne
      description: Dłuższe deski (11–12 stóp) są najlepsze do pokonywania dystansów i turystyki. Szersze deski (32"+) oferują większą stabilność. Sprawdź nośność dla całkowitego ładunku ze sprzętem.
    - title: Uniwersalne deski SUP
      description: Wybierz długość według wagi pływaka i przeznaczenia. Deski uniwersalne sprawdzają się w rekreacji, fitnessie i jodze. Mniejsze deski są bardziej zwrotne.

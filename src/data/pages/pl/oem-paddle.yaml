faqs:
  title: 'FAQ produkcji paddleboardów OEM'
  subtitle: 'Odpowiedzi na najczęstsze pytania marek wprowadzających własny paddleboard.'
  items:
    - title: 'Jak stworzyć własną markę paddleboardów?'
      description: 'Uruchom markę w 16 tygodni: brief, projekt, prototyp z certyfikatem CE, produkcja seryjna i dostawa. Poznaj nasze pakiety OEM.'
    - title: 'Jaki jest czas produkcji?'
      description: 'Próbka gotowa w 2-3 tygodnie, produkcja seryjna w 30-45 dni w zależności od wolumenu.'
    - title: 'Czy paddleboard ma nasze logo?'
      description: 'Tak — pełna marka własna: druk logo, niestandardowe kolory, opakowania i metki w Twojej marce.'
    - title: 'Czy mogę kupować hurtowo od samego początku?'
      description: 'MOQ to 50 szt. dla modeli standardowych, z hurtowymi progami cenowymi wraz ze wzrostem wolumenu.'

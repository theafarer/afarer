hero:
  tagline: Akademia Afarer
  title: Centrum wiedzy
  subtitle: Przewodniki i tutoriale na każdym poziomie umiejętności —od podstaw SUP po zaawansowane techniki ratownicze
categories:
  - level: Początkujący
    color: from-green-500 to-emerald-600
    badge: bg-zielony-100 text-zielony-700
    guides:
      - title: Podstawy SUP
        desc: Poznaj podstawy wiosłowania na stojąco —postawa, technika wiosłowania i równowaga.
        slug: podstawy sup
      - title: Techniki wiosłowania
        desc: Wiosłowanie w przód, wiosłowanie odchylne, wiosłowanie przyciągające i niska podpora —opanuj podstawowe ruchy wiosłem.
        slug: techniki wiosłowania
      - title: Bezpieczeństwo przede wszystkim
        desc: Podstawowe praktyki bezpieczeństwa, w tym sprawdzanie pogody, używanie PFD, zasady dotyczące smyczy i samoratownictwo.
        slug: bezpieczeństwo-przede-wszystkim
  - level: Średnio zaawansowany
    color: od-niebieskiego-500 do-indygo-600
    badge: bg-niebieski-100 tekst-niebieski-700
    guides:
      - title: Podstawy turystyki kajakowej
        desc: Planowanie wielogodzinnych spływów —nawigacja, nawodnienie, tempo i odczytywanie prognoz wiatru.
        slug: niezbędne-do-podróży
      - title: Odczytywanie pogody
        desc: Interpretuj prognozy morskie, rozpoznawaj wzory chmur i rozumiej wpływ wiatru na wodę.
        slug: odczyt pogody
      - title: Podstawy nawigacji
        desc: Czytanie map, używanie kompasu, punkty GPS i planowanie trasy dla pływania przybrzeżnego.
        slug: podstawy-nawigacji
      - title: Świadomość pływów
        desc: Zrozumienie cykli pływów, prądów i ich wpływu na czas rozpoczęcia i trasę.
        slug: świadomość pływów
  - level: Zaawansowany
    color: od-fioletowego-500 do-fioletowoniebieskiego-600
    badge: tło-fioletowe-100 tekst-fioletowy-700
    guides:
      - title: Planowanie wycieczek wielodniowych
        desc: Logistyka wypraw —wybór sprzętu, planowanie posiłków, protokoły bezpieczeństwa i kontakty alarmowe.
        slug: planowanie-wycieczki-wielodniowej
      - title: Techniki ratownicze
        desc: Samoratownictwo, ratownictwo T, ratownictwo eskimoskie dla kajaków i protokoły holowania na otwartej wodzie.
        slug: techniki ratownicze
      - title: Nocne wiosłowanie
        desc: Nawigacja po zmroku —wymagania oświetleniowe, pamięć trasy, komunikacja grupowa i świadomość zagrożeń.
        slug: nocne wiosłowanie
  - level: Konserwacja
    color: od-amber-500 do-orange-600
    badge: tło-amber-100 tekst-amber-700
    guides:
      - title: Czyszczenie i pielęgnacja
        desc: Płukanie słodką wodą, ochrona przed UV, zapobieganie pleśni i odpowiednie techniki suszenia po każdej sesji.
        slug: czyszczenie-i-pielęgnacja
      - title: Przechowywanie
        desc: Najlepsze praktyki przechowywania nadmuchiwanych desek i łodzi —spuszczanie powietrza, składanie, kontrola temperatury i okres przydatności.
        slug: przewodnik-przechowywania
      - title: Podstawy napraw
        desc: Naprawa małych przebić, nieszczelnych szwów i problemów z zaworami za pomocą zestawów naprawczych PVC i technik łatania.
        slug: podstawy naprawy
      - title: Konserwacja zaworów
        desc: Identyfikacja typów zaworów (Halkey-Roberts, Boston, Leafield), czyszczenie zanieczyszczeń i wymiana wadliwych trzpieni.
        slug: konserwacja zaworów
knowledge_center_tagline: Centrum Wiedzy
knowledge_center_title: Sprzęt Morski i Przewodniki Przemysłowe
knowledge_center_subtitle: Ekspercka wiedza i przewodniki zakupowe dla profesjonalistów zajmujących się gospodarką morską, operatorów flot i miłośników sportów wodnych.
knowledge_sections:
  - title: Wiedza o deskach SUP
    tagline: Przewodniki po stand-up paddleboardzie
    desc: Wszystko o deskach SUP — projekt deski, materiały, wybór rozmiaru, konserwacja i porady zakupowe dla rekreacyjnego i komercyjnego użytku.
    guides:
      - title: Jak wybrać odpowiednią deskę SUP
        desc: Kompletny przewodnik po wyborze SUP — rozmiar, objętość, materiał, kształt i przeznaczenie.
        href: /learn/sup
      - title: Dmuchane a twarde SUP
        desc: Dmuchana deska SUP vs twarda deska epoksydowa — porównanie pod kątem przenośności, trwałości, wydajności i wartości.
        href: /compare/inflatable-vs-hardboard
      - title: 'Deski SUP: All-Around vs Touring vs Yoga'
        desc: Różne typy desek SUP — standardy konstrukcyjne, kształty, rozmiary i zalecane zastosowania.
        href: /learn/sup
      - title: Konstrukcja Drop-Stitch vs Tradycyjna
        desc: Porównaj konstrukcję drop-stitch i tradycyjną dla desek SUP pod kątem wagi, kosztów, trwałości i sztywności.
        href: /learn/drop-stitch-core
  - title: Przewodnik po dmuchanych deskach SUP
    tagline: Wiedza o dmuchanych SUP
    desc: Kompleksowe przewodniki dotyczące dmuchanych SUP-ów — materiały PCV, konstrukcja drop-stitch, normy bezpieczeństwa i najlepsze praktyki konserwacyjne.
    guides:
      - title: Przewodnik po materiale PVC
        desc: Definitywny przewodnik po materiałach PVC używanych w konstrukcji dmuchanych desek SUP.
        href: /learn/materials
      - title: Jak powstają dmuchane deski SUP
        desc: Proces produkcji — cięcie materiału, klejenie rdzenia drop-stitch, konstruowanie szwów, test ciśnieniowy i kontrola jakości.
        href: /learn/inflatable-technology
      - title: Przewodnik bezpieczeństwa SUP
        desc: Normy bezpieczeństwa, nośność, odpowiednie ciśnienie, kontrole przed wyjazdem i procedury awaryjne.
        href: /learn/water-safety
      - title: Konserwacja SUP
        desc: Czyszczenie, przechowywanie, ochrona przed UV i naprawa nadmuchiwanych desek SUP.
        href: /inflatable-sup-maintenance
  - title: Wiedza o deskach SUP
    tagline: Centrum desek SUP
    desc: Przewodniki techniczne obejmujące rodzaje desek SUP, materiały, metody konstrukcji, konserwację i bezpieczeństwo.
    guides:
      - title: Rodzaje desek SUP
        desc: SUP-y do wszystkiego, turystyki, jogi, sportu i dla dzieci — poznaj różnice i wybierz odpowiedni.
        href: /learn/sup
      - title: Technologia Drop-Stitch
        desc: Jak tysiące wewnętrznych nitek tworzy sztywne, wysokociśnieniowe struktury nadmuchiwane.
        href: /learn/drop-stitch-core
      - title: Materiały Referencyjne
        desc: Wyjaśniono oceny denier PVC, wagi tkanin, odporność na promieniowanie UV i materiały klasy morskiej.
        href: /learn/materials
      - title: Przewodnik po zakupie SUP
        desc: Porównaj różne typy desek SUP pod kątem różnych zastosowań i poziomów umiejętności.
        href: /learn/sup
  - title: Wiedza o SUP
    tagline: Przewodniki po stand-up paddleboardzie
    desc: Wszystko o deskach SUP — dmuchane kontra sztywne, wymiary desek, technologia materiałów oraz porady ekspertów dla wszystkich poziomów zaawansowania.
    guides:
      - title: Dmuchane a twarde SUP
        desc: Porównaj iSUP-y i twarde deski epoksydowe pod względem przenośności, trwałości, wydajności i wartości.
        href: /learn/sup
      - title: Przewodnik po wymiarach desek SUP
        desc: Jak długość, szerokość i grubość wpływają na stabilność, szybkość i zwrotność.
        href: /learn/sup
      - title: Konserwacja i pielęgnacja SUP
        desc: Wskazówki dotyczące czyszczenia, przechowywania, ochrony przed promieniowaniem UV i naprawy dmuchanych desek SUP.
        href: /inflatable-sup-maintenance
      - title: Wybór pierwszego SUP-a
        desc: Przewodnik dla początkujących dotyczący wyboru odpowiedniego deski SUP w zależności od wagi, poziomu umiejętności i zamierzonego zastosowania.
        href: /learn/sup
  - title: Przewodnik po operacjach wynajmu
    tagline: Zarządzanie flotą dla firm wynajmujących
    desc: Przewodniki dotyczące budowania i zarządzania flotami SUP do wypożyczania w kawiarniach na plaży, centrach sportów wodnych i obiektach hotelarskich.
    guides:
      - title: Budowanie swojej floty wynajmu
        desc: Jak wybrać odpowiednie deski SUP do Twojej wypożyczalni — trwałość, rozmiar i kwestie zwrotu z inwestycji.
        href: /solutions/rental-operators
      - title: Przewodnik po konserwacji floty
        desc: Podstawowe praktyki konserwacyjne w celu maksymalizacji żywotności deski i minimalizacji przestojów w flotach wynajmowanych.
        href: /solutions/rental-operators
  - title: Przewodnik po kurortach i hotelarstwie
    tagline: Aktywności wodne dla branży hotelarskiej
    desc: Przewodniki dotyczące uruchamiania i zarządzania programami SUP w ośrodkach wypoczynkowych, hotelach i nadwodnych miejscach docelowych.
    guides:
      - title: Rozpoczynanie programu SUP w ośrodku
        desc: Czynniki do rozważenia przy uruchamianiu zajęć dla gości na SUP — wielkość floty, zatrudnienie i modelowanie przychodów.
        href: /solutions/resorts-hotels
      - title: SUP a inne aktywności wodne
        desc: Porównaj programy SUP z innymi sportami wodnymi pod kątem doświadczeń gości i efektywności operacyjnej.
        href: /learn/sup
  - title: Przewodnik po handlu detalicznym i dystrybucji
    tagline: Partnerstwa Biznesowe SUP
    desc: Przewodniki dotyczące zostania detalicznym partnerem SUP lub dystrybutorem — planowanie zapasów, pozycjonowanie na rynku i strategie rozwoju.
    guides:
      - title: Zostanie detalistą SUP
        desc: Jak wybierać linie produktów, zarządzać zapasami i promować deski SUP w swoim sklepie detalicznym.
        href: /solutions/retail-partners
      - title: SUP dla Operacji Komercyjnych
        desc: Dlaczego nadmuchiwane deski SUP są wszechstronnym produktem dla flot komercyjnych, firm wynajmujących sprzęt i profesjonalnych operatorów.
        href: /use-cases/search-and-rescue

meta:
  title: Program Partnerski Dystrybucji SUP | {SITE}
  description: Dołącz do globalnej sieci dystrybucji Afarer. Wyłączne terytoria, pełne portfolio produktów, konkurencyjne ceny hurtowe oraz dedykowane zarządzanie kontem.
hero:
  tagline: Dystrybutorzy
  title: Dołącz do naszej globalnej<br />sieci dystrybucji
  subtitle: Ekskluzywne terytoria. Pełne portfolio produktów. Wsparcie na światowym poziomie. Afarer wysyła do ponad 50 krajów i szukamy ugruntowanych dystrybutorów sprzętu morskiego i sportów wodnych.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Afarer globalna dystrybucja i operacje wysyłkowe
benefits:
  title: Co otrzymują dystrybutorzy
  subtitle: Wszystko, czego potrzebujesz, aby odnieść sukces na swoim rynku.
  items:
    - Wyłączne prawa do terytorium
    - Kompletny katalog produktów (SUP, akcesoria, części)
    - Konkurencyjne ceny hurtowe
    - Materiały marketingowe i sprzedażowe (przetłumaczone)
    - Program szkoleniowy (produkt, sprzedaż, obsługa techniczna)
    - Wsparcie targowe
    - Przykładowy program
    - Możliwość realizacji wysyłki bezpośredniej
    - Dedykowany menedżer konta dystrybutora
    - Warunki płatności 45-60 dni

  title: Jak działa Drop Stitch — Inżynieria stojąca za nadmuchiwanymi sztywnymi rdzeniami
  subtitle: 8 minut czytania
content_html: >
  <h2>Czym jest ścieg drop?</h2>

  <p>Ścieg drop (zwany także "tkaniną typu drop-stitch" lub "rdzeniem do drop-stitch") to metoda konstrukcyjna, w której tysiące pojedynczych nitek poliestrowych łączą górną i dolną warstwę powłoki materiałowej. Gdy powłoka jest nadmuchiwana, te nici działają jak elementy napięcia wewnętrznego —
  zapobiegają wypukleniom górnych i dolnych paneli w okrągły kształt, zmuszając panel do pozostawania płaskiego i sztywnego.</p>

  <p>Efektem jest lekka, przenośna konstrukcja, która wytrzymuje ciśnienie wewnętrzne 15–20 PSI — porównywalną do sztywności płyty twardej powłoki, ale w pełni sprężalną do przechowywania i transportu.</p>


  <h2>Jak to działa: Fizyka</h2>

  <p>W konwencjonalnej konstrukcji nadmuchiwanej (takiej jak balon czy materac powietrzny) ciśnienie powietrza działa równomiernie we wszystkich kierunkach. Bez wewnętrznych ograniczeń struktura staje się cylindryczna lub kulista. Ścieg drop rozwiązuje ten problem, wprowadzając wzmocnienie
  rozciągające:</p>

  <ul>
    <li>Tysiące nici łączą górną i dolną warstwę tkaniny</li>
    <li>Po napompowaniu ciśnienie powietrza próbuje rozchylić górę i dół</li>
    <li>Nici opierają się temu rozdzieleniu, przenosząc obciążenie na napięcie wzdłuż osi gwintu</li>
    <li>Efektem jest płaski, sztywny panel, który opiera się zginaniu</li>
  </ul>


  <h2>Proces budowy</h2>

  <ol>
    <li><strong>Tkactwo:</strong> Nici poliestrowe są jednocześnie tkane w dwie oddzielne warstwy bazowej tkaniny (zazwyczaj 1 100 DTEX lub 1 680 DTEX powłokowanej PVC). Nici są splatane pętlą między warstwami pod kątem 90°.</li>
    <li><strong>Powłoka:</strong> Tkanina bazowa jest pokryta PVC (czasem TPU) przy użyciu procesu powlekania nożowego lub kalendarzowego. To uszczelnia gwinty i tworzy szczelną membranę.</li>
    <li><strong>Klejenie warstwowe:</strong> Rdzeń do ściegu drop-stitch jest łączony z zewnętrznymi, laminowanymi warstwami (zazwyczaj 0,9 mm lub 1,2 mm PVC) za pomocą laminacji cieplnej lub kleju.</li>
    <li><strong>Spawanie:</strong> Taśmy szyn są spawane wzdłuż krawędzi za pomocą spawania gorącym powietrzem, spawania RF lub spawania wysokoczęstotliwościowego, aby utworzyć boczne ścianki płyty.</li>
    <li><strong>Montaż zaworów:</strong> Instalowane są zawory Boston lub zawory Halkey-Roberts, zazwyczaj z mechanizmem odciśnieniowym, aby zapobiec nadmiernemu napompowaniu.</li>
  </ol>


  <h2>Kluczowe wskaźniki jakości</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <TR Class="BG-Gray-100">
        <klasa="p-3 tekst-left font-semibold text-gray-900 border">Parametr</th>
        <klasa="p-3 tekst-left font-semibold text-gray-900 border">Poziom podstawowy</th>
        <klasa="p-3 tekst-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Thread density</td><td class="p-3 border">1 thread / sq in</td><td class="p-3 border">2 threads / sq in</td></tr> in
      <tr><td class="p-3 border">Base fabric</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Max pressure</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">grubość PVC</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 obramowanie">Konstrukcja szynow</td><td class="p-3 obramowanie">składanie i klejenie</td><td class="p-3 ramka">spawane i spawane łącznie</td></tr>
    </tbody>
  </table>


  <h2>Zastosowania</h2>

  <ul>
    <li><strong>Płyty SUP:</strong> 4" – 6" grubości, 15 – 20 PSI, 1 – 2 gwinty na cal</li> kwadratowy
    <li><strong>Kajaki:</strong> Nadmuchiwane boczne komory podłogowe z drop-stitch, podłoga 10–15 PSI</li>
    <li><strong>Podłogi RIB:</strong> Podłogi z drop-stitch dla lekkich, pakowalnych RIB tenderów, 12 – 18 PSI</li>
    <li><strong>Błotniki łodzi:</strong> Ścieg niskociśnieniowy drop do kształtowanych błotników z płaskimi powierzchniami</li>
  </ul>


  <h2>Drop Stitch vs. Air Deck (rdzeń z włókna szklanego lub drewnianego)</h2>

  <p>Deski z twardą powłoką wykorzystują rdzenie z piany EPS z wzmocnieniem z włókna szklanego lub drewnianego. Są lżejsze, sztywniejsze i bardziej responsywne — ale nie da się ich spuścić. Ścieg drop zamienia część sztywności na rzecz pełnej przenośności. Dla większości użytkowników rekreacyjnych
  nowoczesne SUP-y z drop-stitchem o napięciu 20 PSI są nie do odróżnienia od podstawowych twardych desek pod względem sztywności.</p>


  <h2>Jak Afarer używa ściegu dropowego</h2>

  <p>Afarer stosuje w całej gamie SUP rdzeń ściegu drop-stitch o grubości 1 680 DTEX, z 2 niwami na cal kwadratowy oraz zewnętrzną laminacją PVC o grubości 1,2 mm. Płyty są ocenzurowane do 20 PSI i przechodzą 24-godzinny test utrzymania ciśnienia przy 1,5x wartości wartościowej przed wysyłką. Paski
  szynowe są spawane na gorące powietrze z potrójną warstwą fuzji, a zawory odciśnieniowe są standardem we wszystkich modelach.</p>

hero:
  tagline: Inżynieria dla niezawodnych wodnych przygód
  title: |
    Zaprojektowane do wody. <br class="hidden sm:inline" />
    Zbudowane do <span class="text-accent dark:text-white">życia na pokładzie</span>.
  subtitle: |
    <span class="hidden sm:inline"><span class="font-semibold">afarer</span> projektuje i produkuje wysokiej jakości łodzie pneumatyczne, SUP i produkty techniczne.</span>
    <span class="block mb-1 sm:hidden font-bold text-blue-600">afarer: stworzone do wydajności.</span>
    Dla profesjonalistów morskich, operatorów komercyjnych i entuzjastów wymagających niezawodności i rzemiosła.
  taglineSection: Komercyjne nadmuchiwane rozwiązania SUP dla kurortów, klubów, detalistów i marek wodnych.
  actions:
    - variant: primary
      text: Zobacz produkty
      href: /products
      icon: tabler:shopping-bag
    - text: Dowiedz się więcej
      href: '#features'
      icon: tabler:file-text
    - text: Odkrywaj rozwiązania SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: afarer okładka
who_we_serve:
  tagline: Komu służymy
  title: Kompletne rozwiązania SUP dla każdego biznesu wodnego
  subtitle: Sprzęt specjalistyczny, produkcja i wsparcie biznesowe dla czterech kluczowych rynków.
  items:
    - title: Kluby wioślarskie
      keywords: Sprzęt klubu SUP, sprzęt szkoły wioseł, flota wynajmowa
      description: Trwałe floty SUP, ceny klubowe oraz programy wymiany części dla klubów kajakowych i szkół.
      icon: tabler:users
      cta: Odkryj rozwiązania Paddle Club
      link: /solutions/paddle-clubs
    - title: Ośrodki wypoczynkowe i hotele
      keywords: atrakcje wodne w ośrodku, wyposażenie plaży hotelowej, doświadczenie gości
      description: Kompletne programy floty SUP z niestandardowym brandowaniem, szkoleniami dla personelu i pakietami zoptymalizowanymi pod ROI.
      icon: tabler:building
      cta: Stwórz swoje wodne doświadczenie w kurorcie
      link: /solutions/resorts-hotels
    - title: Partnerzy detaliczni
      keywords: Hurt SUP, sklepy z artykułami na zewnątrz, sklepy sportowe
      description: Pełna linia produktów, materiały marketingowe, opcje dropshippingu i konkurencyjne marże hurtowe.
      icon: tabler:shopping-cart
      cta: Zostań partnerem detalicznym
      link: /solutions/retail-partners
    - title: Nowe marki SUP
      keywords: private label SUP, niestandardowa marka SUP, deski wiosłowe OEM
      description: Kompleksowa produkcja OEM/ODM — projektowanie, prototypowanie, produkcja masowa i globalna logistyka.
      icon: tabler:package
      cta: Zbuduj swoją markę SUP
      link: /oem-odm-manufacturer
proof_points:
  title: Zaufane przez przedsiębiorstwa wodne na całym świecie
  subtitle: Dziesięciolecia doświadczenia w inżynierii morskiej napędzającego dochodowe programy SUP.
  items:
    - metric: Ten
      label: Lata doświadczenia
      detail: Od 2012
    - metric: Pięćdziesiąt
      label: Obsługiwane kraje
      detail: Globalna sieć dystrybucji
    - metric: 15 000
      label: Jednostki produkowane rocznie
      detail: Certyfikowana przez CE zdolność produkcyjna
    - metric: 100%
      label: Certyfikowany CE
      detail: Zgodny z ISO 9001, BSCI, REACH
business_solutions:
  tagline: Jak pomagamy
  title: Twój partner od koncepcji do przychodu
  subtitle: Cztery kluczowe możliwości, które pomagają firmom wodnym rozpoczynać działalność, działać i rozwijać się.
  items:
    - title: Profesjonalny sprzęt
      description: Deski SUP klasy komercyjnej zaprojektowane do codziennego wynajmu, 500 cykli przy minimalnej konserwacji.
      icon: tabler:shield-check
    - title: Produkcja OEM
      description: Kompleksowa produkcja pod marką własną, od projektowania i prototypowania po produkcję masową i globalną dostawę.
      icon: tabler:package
    - title: Wsparcie biznesowe
      description: Szkolenie personelu, materiały marketingowe, programy części zamiennych i dedykowane zarządzanie kontem.
      icon: tabler:headset
    - title: Globalna logistyka
      description: FOB Qingdao, CIF główne porty, dostawa door-to-door do 50 krajów z obsługą celną.
      icon: tabler:truck-delivery
oem_section:
  tagline: Uruchom swoją markę
  title: Od pomysłu do rynku w 16 tygodni
  subtitle: Twój kompletny partner wprowadzający markę SUP — projektowanie, prototypowanie, produkcja i wysyłka.
  steps:
    - number: Jeden
      title: Koncepcja i krótki opis
      desc: Podziel się swoją wizją, docelowym rynkiem i specyfikacjami.
    - number: Dwa
      title: Projektowanie i Inżynieria
      desc: Modelowanie 3D, dobór materiałów i projektowanie graficzne na zamówienie.
    - number: Trzy
      title: Prototypuj i weryfikuj
      desc: Przykładowa produkcja z certyfikatem CE i testowaniem jakości.
    - number: Cztery
      title: Masowa produkcja
      desc: Produkcja na pełną skalę z kontrolą jakości w linii i wsparciem audytu fabrycznego.
    - number: Pięć
      title: Globalna Dostawa
      desc: Logistyka FOB Qingdao, CIF główne porty, od drzwi do drzwi.
  cta: Rozpocznij swoją podróż z marką
  cta_link: /producent-oem-odm
cta:
  title: |
    Gotowy skonfigurować <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">swoją następną Łódź</span>?
  subtitle: Powiedz nam, jak będziesz używać łodzi, a w ciągu jednego dnia roboczego zaproponujemy model, opcje i cenę.
  actions:
    - variant: primary
      text: Zapytaj o cenę
      href: /contact
      icon: tabler:message-circle
    - text: Przeglądaj katalog
      href: /products

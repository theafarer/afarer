      description: FOB Qingdao, CIF główne porty, dostawa door-to-door do ponad 50 krajów z obsługą celną.
      icon: tabler:truck-delivery
oem_section:
  tagline: Kolekcje Co-Brand
  title: Od Pomysłu do Wody — Edycje Co-Branded
  subtitle: 'Dla partnerów, którzy chcą więcej niż produkt z katalogu: limitowane kolekcje co-branded projektowane, inżynierowane i budowane z Afarer — podczas gdy każda deska pozostaje produktem Afarer.'
  steps:
    - number: '01'
      title: Koncepcja i krótki opis
      desc: Podziel się swoją wizją, docelowym rynkiem i specyfikacjami.
    - number: '02'
      title: Projektowanie i Inżynieria
      desc: Modelowanie 3D, dobór materiałów i projektowanie graficzne na zamówienie.
    - number: '03'
      title: Prototypuj i weryfikuj
      desc: Przykładowa produkcja z certyfikatem CE i testowaniem jakości.
    - number: '04'
      title: Masowa produkcja
      desc: Produkcja na pełną skalę z kontrolą jakości i punktami weryfikacji na każdym etapie.
    - number: '05'
      title: Globalna Dostawa
      desc: Logistyka FOB Qingdao, CIF główne porty, od drzwi do drzwi.
  cta: Poznaj Co-Branding
  cta_link: /co-brand

meta:
  title: Deski Paddle Afarer | Płyń dalej. Mocniej.
  description: Odkryj dmuchane deski paddle Afarer do uniwersalnego pływania, turystyki, jogi, wędkarstwa i przygód na świeżym powietrzu. Znajdź idealny SUP i odkrywaj więcej na wodzie.
  keywords:
    - dmuchana deska paddle
    - dmuchany sup
    - uniwersalny sup
    - sup turystyczny
    - sup do jogi
    - sup wędkarski
    - rodzinna deska paddle
    - przenośna deska paddle
hero:
  tagline: Dmuchane Deski Paddle
  title: Dmuchane Deski Paddle na Każdą Przygodę
  slogan: Płyń dalej. Mocniej.
  subtitle: Odkryj wolność paddleboardingu z Afarer. Poznaj przemyślane dmuchane deski SUP na relaksujące dni nad jeziorem, przybrzeżne przygody, fitness i wszystko pomiędzy.
  taglineSection: Zbudowane dla pewności. Zaprojektowane, by wyróżniać się.
  actions:
    - variant: primary
      text: Znajdź Swoją Deskę
      href: /size-guide/
      icon: tabler:compass
    - text: Odkryj deski SUP
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Dlaczego Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Dmuchane deski paddle Afarer sunące po spokojnej wodzie o wschodzie słońca — zbudowane na każdą przygodę
who_we_serve:
  tagline: Płyń Razem z Nami
  title: Znajdź Swoją Drogę po Wodzie
  subtitle: Każdy paddler ma inną wizję przygody. Odkryj deskę SUP Afarer zaprojektowaną pod Twój styl pływania.
  items:
    - title: Początkujący i Rekreacyjni Paddleboardziści
      keywords: dmuchany sup dla początkujących, uniwersalna deska paddle, stabilny sup
      description: Szerokie, stabilne deski uniwersalne, przy których pierwszy zamach wiosłem jest naturalny i które rosną razem z Tobą.
      icon: tabler:users
      cta: Znajdź Swoją Pierwszą Deskę
      link: /all-around-sup/
    - title: Turystyka i Przygoda
      keywords: sup turystyczny, deska paddle na długie dystanse, sup ekspedycyjny
      description: Dłuższe, węższe deski, które trzymają kurs, suną dalej i zabierają sprzęt na wielodniowe trasy.
      icon: tabler:building
      cta: Odkryj deski turystyczne
      link: /touring-sup/
    - title: Joga i Fitness
      keywords: sup do jogi, deska fitness, szeroki stabilny sup
      description: Szerokie, stabilne platformy z przestrzenią do ruchu — na poranne praktyki, treningi i równowagę na spokojnej wodzie.
      icon: tabler:heart
      cta: Odkryj SUP do jogi
      link: /yoga-sup/
    - title: Wędkarstwo i Rodzina
      keywords: sup wędkarski, rodzinna deska paddle, stabilna platforma wędkarska
      description: Stabilne, praktyczne platformy do łowienia, pływania z dziećmi i długich relaksujących dni na wodzie.
      icon: tabler:users
      cta: Odkryj SUP wędkarski
      link: /fishing-sup/
proof_points:
  title: Testowane poza showroomem
  subtitle: Projekt, osiągi i jakość, które możesz zweryfikować — na wodzie i w liczbach.
  items:
    - metric: 10+
      label: Lat projektowania dla wody
      detail: Od 2012 roku, doskonalone deska po desce
    - metric: 50+
      label: Kraje na wodzie
      detail: Paddlerzy i partnerzy na całym świecie
    - metric: 12–15
      label: Rdzeń drop-stitch w PSI
      detail: Sztywny tam, gdzie trzeba, łatwy do spakowania
    - metric: 100%
      label: Testowany pod ciśnieniem, deska po desce
      detail: Sprawdzany przed wysyłką
business_solutions:
  tagline: Dlaczego Płynie Inaczej
  title: Wydajność, którą Czujesz od Pierwszego Zamachu
  subtitle: Cztery filary ukształtowane przez prawdziwą wodę — wydajność, design, konstrukcja i jakość.
  items:
    - title: Wydajność na Wodzie
      description: Kształty dostrojone do stabilności, ślizgu i pewności na falach — każdy zamach wiosłem łączy Cię z wodą.
      icon: tabler:shield-check
    - title: Ekspresyjny Design
      description: Kolekcje inspirowane przypływami, dziką przyrodą i energią wybrzeża — deski, z którymi chcesz się pokazywać.
      icon: tabler:package
    - title: Sprawdzona Konstrukcja
      description: Rdzenie drop-stitch o wysokiej gęstości, wzmocnione burty i termicznie łączone szwy do częstego użytku.
      icon: tabler:headset
    - title: Zweryfikowana Jakość
      description: Testowane ciśnieniowo, kontrolowane wizualnie, z jasną gwarancją i pomocnym wsparciem posprzedażowym.
      icon: tabler:truck-delivery
cta:
  title: Znajdź swoją kolejną deskę.
  subtitle: Pierwszy zamach wiosłem czy najdłuższa trasa — pomożemy Ci wypłynąć na wodę.
  actions:
    - variant: primary
      text: Odkryj Kolekcję
      href: /inflatable-sup/
      icon: tabler:send
    - text: Zamów Katalog
      href: /resources/download-catalog/

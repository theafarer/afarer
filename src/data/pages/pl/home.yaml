distributor:
  tagline: 'Ekskluzywni Dystrybutorzy Krajowi'
  title: 'Jeden Kraj. Jeden Oficjalny Dystrybutor Afarer.'
  subtitle: 'Program jeden dystrybutor na kraj z ekskluzywnością terytorialną, cenami dealerskimi, wsparciem marketingowym i dedykowanym Programem Sukcesu Dystrybutora.'
  benefits:
    - title: 'Ekskluzywność Terytorialna'
      description: 'Jeden autoryzowany dystrybutor na kraj lub region — zero wewnętrznej konkurencji, zero konfliktów kanałowych.'
    - title: 'Bezpośrednie Marże Fabryczne'
      description: 'Cenniki dystrybutorskie i roczne rabaty za zaangażowane wolumeny, wysyłka FOB Qingdao.'
    - title: 'Wsparcie Marketingowe i Szkoleniowe'
      description: 'Materiały co-branded, POS dla dealerów, szkolenia produktowe i kampanie premierowe.'
    - title: 'Dedykowany Zespół Kont'
      description: 'Osobisty opiekun dystrybutora plus wsparcie onboardingu, prognoz i zamówień ponownych.'
  actions:
    - variant: primary
      text: 'Zostań Dystrybutorem'
      href: /distributor-program
    - text: 'Poproś o Cennik Dealerski'
      href: /contact?subject=Dealer Price List
    - text: 'Aplikuj o Partnerstwo Krajowe'
      href: /contact?subject=Country Partnership Application
    - text: 'Pobierz Program Dystrybutorów'
      href: /distributor-program
  note: 'Zamówienia próbne 5–10 sztuk. Zamówienia testowe 10–30. Autoryzowany dealer 30–50. Dystrybutor krajowy/regionalny 100–300+.'

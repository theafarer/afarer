  items:
    - title: Profesjonalny sprzęt
      description: Deski SUP klasy komercyjnej zaprojektowane do codziennego wynajmu, 500 cykli przy minimalnej konserwacji.
      icon: tabler:shield-check
    - title: Kolekcje Co-Branded
      description: Kompleksowe kolekcje co-branded — od projektu i inżynierii po limitowane edycje tworzone z Afarer, z globalną dostawą.
      icon: tabler:package

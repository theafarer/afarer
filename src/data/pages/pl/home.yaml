meta:
  title: 'Pompowane SUP o wysokiej wydajności — Afarer Water Sports | {SITE}'
  description: 'Afarer projektuje wydajnościowe pompowane deski SUP do otwartych wód, touringu, jogi i przygody. Sztywność drop-stitch, testowana deska po desce pod ciśnieniem, z ekskluzywnymi partnerstwami krajowymi i limitowanymi kolekcjami co-branded. Poznaj kolekcję.'
  keywords:
    - 'wydajnościowy pompowany sup'
    - 'premium pompowany paddleboard'
    - 'marka pompowanych sup'
    - 'pompowany sup do touringów'
    - 'pompowana deska co-branded'
    - 'krajowy dystrybutor sup'
hero:
  tagline: Pompowane SUP o wysokiej wydajności
  title: |
    Płyń dalej. <br class="hidden sm:inline" />
    Wiosłuj mocniej.
  subtitle: |
    Wydajnościowe pompowane SUP zaprojektowane do otwartych wód, długich dni,<br />
    i swobody odkrywania — stabilne, gdy to ważne,<br />
    sztywne pod ciśnieniem i gotowe na zmieniającą się wodę.
  taglineSection: Komercyjne nadmuchiwane rozwiązania SUP dla kurortów, klubów, detalistów i marek wodnych.
  actions:
    - variant: primary
      text: Zobacz produkty
      href: /products
      icon: tabler:shopping-bag
    - text: Dowiedz się więcej
      href: '/afarer-story'
      icon: tabler:file-text
    - text: Odkrywaj rozwiązania SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: afarer okładka
who_we_serve:
  tagline: Komu służymy
  title: Kompletne rozwiązania SUP dla każdego biznesu wodnego
  subtitle: Sprzęt specjalistyczny, produkcja i wsparcie biznesowe dla czterech kluczowych rynków.
  items:
    - title: Kluby wioślarskie
      keywords: Sprzęt klubu SUP, sprzęt szkoły wioseł, flota wynajmowa
      description: Trwałe floty SUP, ceny klubowe oraz programy wymiany części dla klubów SUP i szkół.
      icon: tabler:users
      cta: Odkryj rozwiązania Paddle Club
      link: /solutions/paddle-clubs
    - title: Ośrodki wypoczynkowe i hotele
      keywords: atrakcje wodne w ośrodku, wyposażenie plaży hotelowej, doświadczenie gości
      description: Kompletne programy floty SUP z niestandardowym brandowaniem, szkoleniami dla personelu i pakietami zoptymalizowanymi pod ROI.
      icon: tabler:building
      cta: Stwórz swoje wodne doświadczenie w kurorcie
      link: /solutions/resorts-hotels
    - title: Partnerzy detaliczni
      keywords: Hurt SUP, sklepy z artykułami na zewnątrz, sklepy sportowe
      description: Pełna linia produktów, materiały marketingowe, opcje dropshippingu i konkurencyjne marże hurtowe.
      icon: tabler:shopping-cart
      cta: Zostań partnerem detalicznym
      link: /solutions/retail-partners
    - title: Dystrybutorzy Krajowi i Partnerzy Co-Brand
      keywords: krajowy dystrybutor sup, sup co-branded, sup pod marką własną
      description: Ekskluzywna dystrybucja kraj po kraju i limitowane kolekcje co-branded dla wykwalifikowanych firm z branży sportów wodnych.
      icon: tabler:package
      cta: Zostań Partnerem
      link: /distributor-program
proof_points:
  title: Testowane poza showroomem

features3_solutions:
  tagline: Rozwiązania według typu działalności
  title: SUP-y Zbudowane Specjalnie<br />Dla Twojego Biznesu
  isBeforeContent: false
  columns: 2
  items:
    - title: Ośrodki wypoczynkowe i hotele
      description: Kompletne programy floty SUP dla obiektów hotelarskich — trwałe deski, niestandardowe oznakowanie i wsparcie w szkoleniu personelu.
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: Kluby wioślarskie
      description: Niezawodne floty SUP dla klubów wioślarskich, programów lekcji i działań członkowskich — deski klasy komercyjnej w cenach klubowych.
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: Operatorzy wynajmu
      description: Deski SUP o wysokiej rotacji zaprojektowane do codziennego wynajmu. Odporne na UV, szybko schnące, możliwe do układania w stosy — stworzone do wynajmu na co dzień.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: Partnerzy detaliczni
      description: Sprzedawaj najszybciej rosnącą markę SUP na swoim rynku. Pełna linia produktów, materiały marketingowe, dropshipping i konkurencyjne marże.
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: Dystrybutorzy
      description: Wyłączne terytoria, pełne portfolio produktów, dedykowane zarządzanie kontem. Dołącz do naszej globalnej sieci dystrybucji w 50 krajach.
      icon: tabler:world
      link: /solutions/distributors
    - title: Zbuduj swoją własną markę
      description: Kompleksowa produkcja SUP OEM/ODM — projektowanie, prototypowanie, produkcja masowa i logistyka. Wprowadź swoją markę z Afarer.
      icon: tabler:package
      link: /solutions/build-your-own-brand

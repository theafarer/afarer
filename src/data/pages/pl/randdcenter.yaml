  title: Usługi B+R dla partnerów
  services:
    - title: Opracowywanie materiałów na zamówienie
      desc: Opracowujemy indywidualne formuły tkanin, układy laminatów i systemy klejowe dostosowane do środowiska pracy i celów wydajnościowych.
    - title: Inżynieria produktu OEM / ODM
      desc: Opracowujemy indywidualne formuły tkanin, układy laminatów i systemy klejowe dostosowane do środowiska pracy i celów wydajnościowych.
    - title: Testowanie i certyfikacja przez strony trzecie
      desc: Skorzystaj z naszych zgodnych z normą ISO laboratoriów testowych do niezależnego badania materiałów, weryfikacji produktów i wsparcia w zakresie certyfikacji.
  cta: Omów swoje wymagania dotyczące badań i rozwoju →
  cta_link: /contact
vision:
  tagline: Nasza wizja
  title: Kształtowanie przyszłości sportów wodnych
  body: >-
    Afarer dąży do przewodzenia w branży łodzi pneumatycznych i SUP poprzez ciągłe innowacje, niezachwianą jakość i niezłomne zaangażowanie w bezpieczeństwo oraz zrównoważony rozwój — ostatecznie wzbogacając doświadczenia entuzjastów sportów wodnych na całym świecie. Centrum Badawczo-Rozwojowe
    Afarer to miejsce, gdzie pasja spotyka się z innowacją, wyznaczając nowe standardy dla branży sportów wodnych.
labs_section:
  tagline: Laboratoria
  title: Nasze laboratoria
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: Laboratorium tkanin PVC
      description: Ciągłe badania i testowanie tkanin z rur PVC i Hypalon pod kątem wytrzymałości na rozciąganie, odporności na promieniowanie UV, ścieranie oraz elastyczności w niskich temperaturach w celu zapewnienia długoterminowej niezawodności w środowiskach morskich.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Studio Inżynierii Kadłubów
      description: Projektowanie wspomagane komputerowo (CAD) i analiza metodą elementów skończonych (FEM) kadłubów z HDPE, aluminium i włókna szklanego. Każdy kadłub jest cyfrowo symulowany pod kątem rozkładu naprężeń i odporności na uderzenia, zanim zostanie zbudowany pierwszy prototyp.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: Centrum Spawania RF
      description: Specjalistyczny zakład spawania częstotliwością radiową z precyzyjną kontrolą temperatury i ciśnienia, produkujący wytrzymałe, hermetyczne szwy spełniające standardy przemysłu morskiego dla sprzętu dmuchanego.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Hydrodynamiczny zbiornik testowy
      description: Testowanie modeli w skali w naszym wewnętrznym zbiorniku testowym w celu optymalizacji kształtu kadłuba, właściwości ślizgowych, stabilności i wydajności paliwowej w różnych warunkach ładunku i morza.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: Warsztat prototypów
      description: Pełnoskalowa hala prototypowania i okablowania, w której powstają nowe modele, są montowane i poddawane testom morskim. Każdy prototyp przechodzi minimalnie 20-godzinny program testów w wodzie przed zatwierdzeniem do produkcji.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Laboratorium Jakości i Kontroli
      description: Dedykowane laboratorium kontroli jakości wykonujące testy wytrzymałości na rozciąganie, cykle utrzymania powietrza, testy odrywania szwów oraz certyfikację materiałów, aby zapewnić, że każda łódź opuszczająca warsztat spełnia nasze opublikowane specyfikacje.
      href: /randdcenter/quality-inspection-lab

meta:
  title: Centrum Badań i Rozwoju | {SITE}
  description: Badania i rozwój — testowanie tkanin PCV, inżynieria kadłuba, spawanie RF, testy hydrodynamiczne oraz kontrola jakości. Dostępne niestandardowe usługi badawczo-rozwojowe.
hero:
  tagline: Centrum Badań i Rozwoju
  title: Centrum Badawczo-Rozwojowe
  subtitle: Skoncentrowany na postępie
intro:
  - >-
    Centrum Badawczo-Rozwojowe Afarera (R&D) jest siłą napędową naszej misji rewolucjonizowania sprzętu do sportów wodnych. Dzięki nieustannym innowacjom w dmuchanych deskach do paddleboardingu (SUP) i łodziach dajemy entuzjastom sportów wodnych na całym świecie bezpieczniejsze, bardziej komfortowe
    i przyjemniejsze produkty. Nasz zaangażowany zespół inżynierów, projektantów i pasjonatów sportów wodnych kształtuje przyszłość branży, konsekwentnie podnosząc poprzeczkę pod względem jakości, wydajności i zrównoważonego rozwoju.
  - >-
    Nasze centrum badań i rozwoju łączy naukowców materiałowych, projektantów okrętów i inżynierów produkcji pod jednym dachem. Od formulacji materiału i symulacji kadłuba po rozwój procesów spawania i próby morskie w pełnej skali, każdy etap w rozwoju produktu opiera się na danych i jest
    weryfikowany testami.
mission:
  tagline: Nasza misja
  title: Innowacje w przyszłości sportów wodnych
  pillars:
    - icon: lightning
      title: Postęp technologiczny
      desc: Tworzenie nowych materiałów, projektów i procesów produkcyjnych dla lepszej wydajności i długowieczności produktów.
    - icon: design
      title: Projektowanie skoncentrowane na użytkowniku
      desc: Głębokie rozumienie i przewyższanie potrzeb użytkowników poprzez ergonomiczną i intuicyjną konstrukcję produktów.
    - icon: globe
      title: Zrównoważone praktyki
      desc: Minimalizowanie naszego śladu środowiskowego poprzez wykorzystanie przyjaznych dla środowiska materiałów i procesów.
    - icon: shield
      title: Bezkompromisowe bezpieczeństwo
      desc: Zapewnienie najwyższych standardów bezpieczeństwa poprzez rygorystyczne testy i certyfikację.
pillars:
  - title: Postęp technologiczny
    desc: Tworzenie nowych materiałów, projektów i procesów produkcyjnych w celu zapewnienia lepszej wydajności produktów i długowieczności.
    icon: tech
  - title: Zaawansowane materiały
    desc: Badanie nowoczesnego PVC, Hypalonu, kompozytów i zrównoważonych alternatyw w celu poprawy właściwości produktów.
    icon: materials
  - title: Zrównoważony rozwój
    desc: 'Podstawowe zobowiązanie: Jesteśmy zaangażowani w ochronę środowiska poprzez zrównoważoną produkcję i materiały nadające się do recyklingu.'
    icon: sustainability
capabilities:
  tagline: Możliwości
  title: Możliwości badań i rozwoju
  subtitle: Cztery podstawowe dyscypliny, które dają nam pełną kontrolę nad rozwojem produktu — od badań surowców po ostateczną certyfikację.
  groups:
    - title: Nauka o materiałach i technologia tkanin
      items:
        - Analiza i optymalizacja formuł PVC i Hypalon
        - Stabilizacja UV, ognioodporność i rozwój dodatków antybakteryjnych
        - Inżynieria laminacji i adhezji tkanin wielowarstwowych
        - Przyspieszone testy starzeniowe (UV, termiczne, wilgotności, mgła solna)
    - title: Inżynieria Kadłubów i Hydrodynamika
      items:
        - Parametryczny projekt kadłuba 3D i optymalizacja CFD
        - Analiza elementów skończonych dla obciążeń strukturalnych i uderzeniowych
        - Badania w modelowym basenie aerodynamicznym i walidacja wydajności
        - Opracowanie niestandardowego kadłuba dla specjalnych profili misji
    - title: Technologia spawania i łączenia
      items:
        - Rozwój i optymalizacja procesu spawania dielektrycznego RF
        - Metody spawania gorącym powietrzem, gorącym klinem i ultradźwiękowe
        - Kwalifikacja klejenia i taśmy uszczelniającej
        - Modelowanie wytrzymałości spawu i przewidywanie trwałości
    - title: Testowanie, Certyfikacja i Zgodność
      items:
        - Zarządzanie jakością i testy zgodności CE
        - Wsparcie w zakresie niezależnych badań i certyfikacji przez strony trzecie
        - Opracowanie niestandardowego protokołu testowego w celu kwalifikacji zakupów
        - Analiza awarii w trakcie eksploatacji i badanie przyczyn źródłowych

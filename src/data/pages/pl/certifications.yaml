hero:
  tagline: Certifications & Standards
  title: 'Certyfikaty jakości<br />i standardy zgodności'
  subtitle: 'Produkty afarer są produkowane zgodnie z międzynarodowymi standardami bezpieczeństwa morskiego, systemami zarządzania jakością i przepisami ochrony środowiska.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarer quality certifications and compliance documentation
content_certifications:
  tagline: Our Certifications
  title: 'Certyfikowana jakość,<br />globalnie uznawana'
  subtitle: 'Każdy produkt afarer jest poparty certyfikatami, które potwierdzają nasze zaangażowanie w jakość, bezpieczeństwo i odpowiedzialność za środowisko.'
  items:
    - title: 'CE Certified'
      description: 'Wszystkie produkty afarer spełniają europejskie wymogi oznakowania CE dla rekreacyjnych jednostek pływających, zapewniając spełnienie standardów bezpieczeństwa, zdrowia i ochrony środowiska.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Nasz system zarządzania jakością jest certyfikowany zgodnie z ISO 9001:2015, obejmując projektowanie, produkcję i dystrybucję nadmuchiwanych jednostek pływających i sprzętu morskiego.'
      icon: tabler:clipboard-check
    - title: 'UKCA Marked'
      description: 'Produkty sprzedawane na rynku brytyjskim posiadają oznaczenie UKCA, potwierdzające zgodność z brytyjskimi przepisami dotyczącymi sprzętu morskiego i jednostek pływających.'
      icon: tabler:shield
    - title: 'BSCI Compliant'
      description: 'afarer jest audytowany przez BSCI (Business Social Compliance Initiative), co potwierdza etyczne praktyki produkcyjne, uczciwe warunki pracy i odpowiedzialność w łańcuchu dostaw.'
      icon: tabler:heart-handshake
    - title: 'REACH Compliant'
      description: 'Wszystkie materiały używane w produktach afarer są zgodne z unijnymi przepisami REACH dotyczącymi bezpieczeństwa chemicznego, zapewniając brak substancji zabronionych w naszym PVC, Hypalon lub komponentach.'
      icon: tabler:flask
    - title: 'Material Testing'
      description: 'Tkaniny są testowane pod kątem wytrzymałości na rozciąganie, odporności na rozdarcie, degradacji UV i pękania na zimno. Każda partia produkcyjna jest próbkowana i weryfikowana.'
      icon: tabler:test-pipe
content_factory:
  tagline: Factory Standards
  title: 'Doskonałość produkcyjna<br />—wykonane według specyfikacji'
  subtitle: 'Nasz zakład o powierzchni 12 000 m² działa zgodnie z rygorystycznymi protokołami kontroli jakości na każdym etapie produkcji.'
  list:
    - 'Incoming Material Inspection: All raw materials —PVC fabric, Hypalon, aluminum, plywood, adhesives —are tested against specifications before entering production.'
    - 'In-Process Quality Control: Every production stage has documented QC checkpoints. Weld strength, seam alignment, valve installation, and fitting torque are verified inline.'
    - 'Pressure Testing: Every inflatable chamber is pressure-tested at 1.5× rated pressure for 24 hours. Leak rate must be zero for passing grade.'
    - 'Final Inspection: Completed products are inspected for dimensional accuracy, cosmetic finish, accessory completeness, and packaging integrity before shipping.'
    - 'Batch Traceability: Every product carries a serial number linked to production batch records, enabling full traceability from raw material to finished goods.'
content_safety:
  tagline: Marine Safety Standards
  title: 'Bezpieczeństwo przede wszystkim<br />—zaprojektowane do niezawodnej pracy'
  subtitle: 'Produkty afarer są zaprojektowane i testowane, aby spełniać międzynarodowe standardy bezpieczeństwa morskiego do użytku komercyjnego i rekreacyjnego.'
  items:
    - title: 'ISO 6185'
      description: 'Łodzie nadmuchiwane są zgodne z normami ISO 6185 dotyczącymi konstrukcji, stateczności, pływalności i nośności.'
      icon: tabler:sailboat
    - title: 'ABYC Standards'
      description: 'Systemy elektryczne i paliwowe są zgodne z normami ABYC (American Boat & Yacht Council) dotyczącymi bezpiecznego montażu i eksploatacji.'
      icon: tabler:bolt
    - title: 'SOLAS Compliance'
      description: 'Sprzęt bezpieczeństwa i środki ratunkowe spełniają wymagania SOLAS (Safety of Life at Sea) tam, gdzie mają zastosowanie.'
      icon: tabler:lifebuoy

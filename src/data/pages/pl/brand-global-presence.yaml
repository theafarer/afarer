hero:
  tagline: Global Presence
  title: 'Obsługujemy ponad 50 krajów<br />na każdym kontynencie'
  subtitle: 'Od europejskich operatorów patroli przybrzeżnych po australijskich dystrybutorów sportów wodnych i bliskowschodnie zespoły ratownicze —łodzie afarer są na wodzie na całym świecie.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer global marine manufacturing and distribution
stats:
  title: Global Reach
  stats:
    - title: Countries
      amount: '50+'
    - title: Export Markets
      amount: Europe, Americas, Asia, Middle East, Oceania
    - title: Production
      amount: Qingdao, China
    - title: US Warehouse
      amount: Montclair, CA
features3_markets:
  tagline: Key Markets
  title: 'Regionalna wiedza specjalistyczna<br />dla lokalnych wymogów'
  subtitle: 'Rozumiemy, że różne rynki mają różne wymagania regulacyjne, preferencje i przypadki użycia.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europe & UK
      description: 'Produkty z certyfikatem CE spełniające normy EN ISO 6185. Duże zapotrzebowanie na SUP-y, łodzie nadmuchiwane i deski SUP na rynkach UE. Brytyjscy dystrybutorzy doceniają naszą szybką realizację.'
      icon: tabler:map-pin
    - title: North America
      description: 'Produkcja zatwierdzona przez US Coast Guard. Magazyn w USA w Montclair w Kalifornii do szybkiej dostawy na Zachodnim Wybrzeżu. Rosnące zapotrzebowanie na łodzie rybackie, jednostki ratownicze i rekreacyjne SUP.'
      icon: tabler:map-pin
    - title: Australia & Oceania
      description: 'Silny rynek łodzi SUP i tenderów nadmuchiwanych. Australijscy dystrybutorzy cenią nasze łodzie Hypalon za odporność na UV w trudnych warunkach słonecznych. Szybka wysyłka z naszego azjatyckiego zakładu.'
      icon: tabler:map-pin
    - title: Middle East
      description: 'Rosnące zapotrzebowanie na łodzie patrolowe i ratownicze. Nasze SUP-y z kadłubem aluminiowym są popularne wśród straży przybrzeżnej i operatorów bezpieczeństwa. Niestandardowe konfiguracje do środowisk o wysokiej temperaturze.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribution Network
  title: 'Partnerstwo z dystrybutorami<br />na całym świecie'
  subtitle: 'Współpracujemy z uznanymi dystrybutorami sprzętu morskiego, markami OEM i agencjami zamówień rządowych.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerships
      description: 'Produkcja marek własnych dla globalnych marek sportów wodnych. Zajmujemy się wszystkim od projektu przez produkcję po dropshipping.'
      icon: tabler:building
    - title: Distributor Network
      description: 'Autoryzowani dystrybutorzy w ponad 20 krajach posiadają zapasy i zapewniają lokalne wsparcie. Zapytania nowych dystrybutorów mile widziane.'
      icon: tabler:users
    - title: Government & Institutional
      description: 'Bezpośrednie dostawy do straży przybrzeżnej, organizacji poszukiwawczo-ratowniczych i programów zakupów wojskowych. Zgodność z wymogami instytucjonalnych procedur zakupowych.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Globalna logistyka i wsparcie'
  subtitle: 'Od fabryki do miejsca przeznaczenia —zarządzamy całym łańcuchem dostaw.'
  items:
    - title: Shipping Options
      description: 'Transport morski (FOB Qingdao), transport lotniczy dla pilnych zamówień i kurier ekspresowy dla próbek i części zamiennych.'
      icon: tabler:truck-delivery
    - title: US Warehouse
      description: 'Zapasy przechowywane w Montclair w Kalifornii do szybkiej dostawy w całej Ameryce Północnej. Zachodnie Wybrzeże: 2-3 dni, Centralne: 3-4 dni, Wschodnie Wybrzeże: 4-5 dni.'
      icon: tabler:building-warehouse
    - title: Spare Parts
      description: 'Oryginalne części zamienne afarer i materiały eksploatacyjne dostępne przez cały rok. Typowe części wysyłane w ciągu 24 godzin.'
      icon: tabler:package
    - title: Technical Support
      description: 'Bezpośrednia linia do naszego zespołu inżynieryjnego w sprawach technicznych, porad naprawczych i wsparcia remontowego. Wspieramy łodzie zbudowane 20 lat temu.'
      icon: tabler:headset
cta:
  title: 'Chcesz zostać dystrybutorem?'
  subtitle: 'Aktywnie rozwijamy naszą sieć dystrybucji. Skontaktuj się z naszym zespołem eksportowym, aby omówić możliwości partnerstwa.'
  actions:
    - variant: primary
      text: Partnership inquiry
      href: /contact
    - text: View our product range
      href: /products

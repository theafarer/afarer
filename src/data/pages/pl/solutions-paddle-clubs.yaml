meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Członkowie klubu wiosłowego na dopasowanych deskach SUP Afarer
benefits:
  title: Korzyści z floty klubowej
  subtitle: Dlaczego kluby wioślarskie w 50 krajach wybierają Afarer jako swojego partnera w zakresie sprzętu.
  items:
    - metric: 40%+
      label: Oszczędności kosztów floty
      detail: W porównaniu z cenami detalicznymi z rabatami dla klubów hurtowych
    - metric: 48 godz.
      label: Wymiana części
      detail: Minimalny czas przestoju dla Twojej floty wynajmu
    - metric: '500+'
      label: Cykle wynajmu
      detail: Trwałość na poziomie komercyjnym na każdej desce
    - metric: 5+ lat
      label: Czas życia floty
      detail: Przy odpowiedniej konserwacji i pielęgnacji
packages:
  title: Programy Floty Klubowej
  subtitle: Wybierz program floty, który odpowiada rozmiarowi i ambicjom Twojego klubu.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Przewodnik uruchomienia + lista kontrolna bezpieczeństwa
        - Przewodnik uruchomienia + lista kontrolna bezpieczeństwa
        - Certyfikowane CE — cały sprzęt
      cta_text: Załóż swój klub
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Program wymiany części (15% rabatu)
        - Staff training session
        - Sesja szkoleniowa dla personelu (online)
        - Certyfikowane CE — cały sprzęt
      popular: true
      cta_text: Zbuduj swoją flotę
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50 desek wyścigowych / sportowych
        - Full accessory set
        - Event support kit
        - Części priorytetowe (wysyłka w 24h)
        - Dedykowany opiekun klienta
        - Opcja niestandardowych strojów zespołowych
        - Certyfikowane CE — cały sprzęt
      cta_text: Zdobyć flotę konkurencji
training:
  title: Pakiety Centrum Szkoleniowego
  subtitle: Wszystko, czego szkoła SUP potrzebuje do prowadzenia profesjonalnych kursów certyfikacyjnych.
  items:
    - name: Instructor Starter
      features:
        - 5 premium desek SUP (klasa instruktorska)
        - 5 węglowych wioseł do pokazów
        - 5 kamizelek ratunkowych (dopasowanie przez instruktora)
        - Przewodnik po programie szkoleniowym
        - Sprzęt z certyfikatem CE
    - name: School Full Set
      features:
        - 20 desek SUP (mieszanka studentów i instruktorów)
        - 20 wioseł + 20 kamizelek ratunkowych (różne rozmiary)
        - 10 kamizelek ratunkowych dla początkujących
        - 4 pompy zestawy naprawcze
        - Program szkoleniowy i wsparcie w zakresie certyfikacji
        - Sprzęt z certyfikatem CE
features:
  title: Dlaczego kluby wybierają Afarer
  subtitle: Stała jakość, szybkie części i hurtowe ceny stworzone dla rozwijających się klubów.
  items:
    - title: 500 Wynajem Rowerów
      description: Płyty o jakości komercyjnej wytrzymują sezony codziennego użytkowania.
      icon: tabler:shield-check
    - title: Kolory niestandardowe
      description: Dopasuj tożsamość swojego klubu za pomocą niestandardowych kolorów planszy i logo.
      icon: tabler:palette
    - title: Ceny hurtowe
      description: Rabaty ilościowe przy zamówieniach flotowych na 10 desek.
      icon: tabler:discount
    - title: Szybkie części
      description: Części zamienne wysyłane w ciągu 48 godzin.
      icon: tabler:truck-delivery
    - title: Wsparcie Rozwoju Klubu
      description: Porady dotyczące programów członkowskich, cen i organizowania wydarzeń.
      icon: tabler:trending-up
    - title: Certyfikowany CE
      description: Wszystkie urządzenia spełniają międzynarodowe normy bezpieczeństwa.
      icon: tabler:certificate
cta:
  title: Gotowy, aby zbudować swój klub paddle?
  subtitle: Uzyskaj ofertę na flotę klubową lub pobierz nasz przewodnik dla początkujących w klubie.
  actions:
    - text: Zgłoś się do Floty Klubu
      href: /contact?package=club
      variant: primary
    - text: Pobierz przewodnik klubu
      href: /resources/download-catalog
      variant: secondary

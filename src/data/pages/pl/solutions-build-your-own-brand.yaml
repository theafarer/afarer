      description: 2 400 kadłubów dostarczono markom na całym świecie.
      icon: tabler:clock
    - title: Pełna certyfikacja
      description: CE / ISO / UKCA / BSCI / REACH — wszystkie certyfikowane.
      icon: tabler:certificate
    - title: 30-dniowy czas realizacji
      description: Szybciej niż średnia w branży od zamówienia do wysyłki.
      icon: tabler:truck-delivery
    - title: Niska minimalna ilość zamówienia
      description: Od 50 jednostek — najniższe w branży.
      icon: tabler:package
    - title: Projektowanie wewnętrzne

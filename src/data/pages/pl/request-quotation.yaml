hero_text:
  tagline: Get a Quote
  title: 'Poproś o wycenę<br />dla swojego projektu'
  subtitle: 'Opowiedz nam o swoich wymaganiach, a nasz zespół odpowie szczegółową wyceną w ciągu 2 dni roboczych.'
steps2_process:
  title: How It Works
  subtitle: 'Cztery proste kroki od zapytania do wyceny.'
  items:
    - title: 'Step 1: Submit Your Requirements'
      description: 'Wypełnij poniższy formularz, podając typ produktu, ilość i specyfikacje. Im więcej szczegółów podasz, tym dokładniejsza będzie Twoja wycena.'
      icon: tabler:file-text
    - title: 'Step 2: We Review & Advise'
      description: 'Nasz zespół inżynieryjny analizuje Twoje wymagania i może skontaktować się z Tobą w celu wyjaśnienia. Zapewniamy rekomendacje dotyczące konfiguracji i opcji produktu.'
      icon: tabler:users
    - title: 'Step 3: Receive Your Quote'
      description: 'Otrzymujesz szczegółową wycenę zawierającą ceny jednostkowe, MOQ, czas realizacji, warunki płatności i opcje wysyłki. Zwykle w ciągu 48 godzin.'
      icon: tabler:currency-dollar
    - title: 'Step 4: Sample & Production'
      description: 'Po akceptacji wyceny przechodzimy do produkcji próbnej (jeśli dotyczy) lub bezpośrednio do produkcji masowej. Regularne aktualizacje przez cały proces.'
      icon: tabler:building-factory
content_form:
  tagline: Quotation Form
  title: 'Opowiedz nam o swoim projekcie'
  subtitle: 'Wszystkie pola z * są wymagane.'
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
        - Custom
    - name: Quantity
      type: text
      placeholder: e.g. 50 units
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      placeholder: Describe your application, technical specifications, or any special requirements
cta:
  title: 'Prefer to discuss by email?'
  subtitle: 'Send your inquiry directly to our sales team and we will respond within 24 hours.'
  actions:
    - variant: primary
      text: Email us directly
      href: /contact

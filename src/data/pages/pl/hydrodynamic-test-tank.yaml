hero:
  tagline: Laboratorium 04
  title: Hydrodynamiczny zbiornik testowy
  subtitle: Weryfikacja wydajności przed pierwszym prototypem pełnoskalowym
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: Testy wydajnościowe w hydrodynamicznym zbiorniku do badań Afarer
intro: >-
  Powszechnym błędnym przekonaniem jest, że testy hydrodynamiczne są zarezerwowane dla statków oceanicznych. W rzeczywistości wydajność małego kadłuba ślizgowego — takiego jak 4–6 m RIB — zależy od jego kształtu podwodnego tak samo, jak duży zbiornikowiec zależy od swojego bulbous bow. Kąt trymu,
  zwilżona powierzchnia, generowanie fal i wentylacja mają dramatyczny wpływ na prędkość, zużycie paliwa i komfort jazdy. W {SITE.name} dysponujemy dedykowanym zbiornikiem do testów hydrodynamicznych, który pozwala nam ilościowo określić te efekty w skali modelu — zanim zdecydujemy się na
  pełnowymiarowy prototyp z metalu i włókna.
content_html: >
  <h2>Dlaczego warto przeprowadzić badania modelowe w basenie holowniczym?</h2>

  <p>Badania w skali modelu (zwykle od 1:3 do 1:5) pozwalają nam szybko i ekonomicznie iterować kształt kadłuba. Tydzień w basenie może dostarczyć te same dane eksploatacyjne, które w pełnej skali wymagałyby miesięcy prób i błędów — i to za ułamek kosztów.</p>


  <h2>Specyfikacja obiektu</h2>

  <table>
    <thead><tr><th>Parametr</th><th>Specyfikacja</th></tr></thead>
    <tbody>
      <tr><td>Wymiary basenu</td><td>35 m (dł.) × 3,5 m (szer.) × 1,8 m (głęb.)</td></tr>
      <tr><td>Wózek holowniczy</td><td>Napęd elektryczny serwo, prędkość maks. 12 m/s (23 węzły), dokładność prędkości ± 0,5 %</td></tr>
      <tr><td>Generator fal</td><td>Typ klapowy, programowalne regularne i nieregularne stany morza, Hs do 0,3 m w skali modelu</td></tr>
      <tr><td>Oprzyrządowanie</td><td>6-składowy dynamometr (opór, siła boczna, moment odchylający), akcelerometry, inklinometry, sondy falowe</td></tr>
      <tr><td>Akwizycja danych</td><td>Próbkowanie 1000 Hz na kanał, podgląd w czasie rzeczywistym + pakiet do post-processingu</td></tr>
      <tr><td>Wytwarzanie modeli</td><td>Wewnętrzne frezowanie CNC i druk 3D dla kadłubów modeli o długości całkowitej do 1,8 m</td></tr>
    </tbody>
  </table>


  <h2>Nasz program badań</h2>

  <p>Standardowy program opracowania kadłuba w naszym basenie przebiega w następującej kolejności:</p>

  <ol>
    <li><strong>Budowa modelu</strong> — Model w skali 1:3,5 jest frezowany CNC z pianki o wysokiej gęstości i laminowany dla zapewnienia sztywności. Masa i środek ciężkości są dopasowane do stanu pełnego obciążenia przeskalowanego wg kryterium Froude'a.</li>
    <li><strong>Pomiary oporu</strong> — Model jest holowany z prędkościami 8–10 obejmującymi zakres eksploatacyjny. Opór całkowity jest mierzony i rozkładany na składową tarcia oraz składową resztkową metodą ITTC-1957.</li>
    <li><strong>Pomiar przegłębienia i zanurzenia</strong> — Przegłębienie bieżące i zanurzenie są rejestrowane przy każdej prędkości. Celem jest optymalny kąt przegłębienia 4–6° dla kadłubów ślizgowych.</li>
    <li><strong>Badanie śladu falowego</strong> — Poprzeczne przekroje fal są mierzone przy dwóch prędkościach w celu oceny oporu falowego i identyfikacji poprzecznych interakcji falowych, które mogłyby powodować interferencje na rufie.</li>
    <li><strong>Zachowanie na fali (opcjonalnie)</strong> — Próby na fali czołowej i od rufy przy falach regularnych w celu pomiaru oporu dodatkowego, przyspieszenia pionowego oraz prawdopodobieństwa slammu.</li>
    <li><strong>Analiza danych i zalecenia</strong> — Dostarczany jest pełny raport z wykresami porównawczymi, krzywymi prędkości/mocy oraz konkretnymi zaleceniami projektowymi dla kadłuba w pełnej skali.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Typowe wyniki badań w basenie — opór w funkcji prędkości (kadłub RIB 450, skala 1:3,5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Opór w skali modelu (N) przy prędkościach przeskalowanych wg kryterium Froude'a. Prognoza mocy w pełnej skali zgodnie z metodą prognozowania osiągów ITTC-1978.</p>
  </div>


  <h2>Zespół ekspertów</h2>

  <p>Nasz basen obsługuje hydrodynamik z doktoratem w dziedzinie architektury okrętowej i 8-letnim doświadczeniem w basenach holowniczych w czołowym europejskim instytucie badań morskich. Wspiera go technik, który przygotowuje wszystkie modele i oprzyrządowanie. Zespół stosuje zalecane procedury
  ITTC (International Towing Tank Conference), aby zapewnić, że każde badanie jest powtarzalne, możliwe do prześledzenia i wiarygodne na arenie międzynarodowej.</p>


  <h2>Badania w basenie dla opracowania kadłuba na zamówienie</h2>

  <p>Nasz basen służy nie tylko kadłubom własnej konstrukcji — regularnie prowadzimy programy badawcze dla klientów, którzy chcą zweryfikować indywidualny kształt kadłuba lub zbadać problem eksploatacyjny:</p>

  <ul>
    <li><strong>Porównanie form kadłuba</strong> — Dwa lub więcej wariantów kształtu kadłuba testowanych w identycznych warunkach, co zapewnia obiektywne porównanie oporu/prędkości/stateczności, które wesprze Twoją decyzję projektową.</li>
    <li><strong>Optymalizacja urządzeń dodatkowych</strong> — Płyty interceptorowe, listwy tryskowe, płetwy odbojowe i strugi mogą być testowane w różnych konfiguracjach, aby określić ich indywidualny wkład w redukcję oporu.</li>
    <li><strong>Studium doboru silnika</strong> — Dane o oporze są przeliczane na krzywą prognozy mocy, co pozwala dobrać optymalną moc silnika do docelowej prędkości i ładowności.</li>
  </ul>


  <h2>Dlaczego warto testować z nami?</h2>

  <p>Nie przekazujemy Ci tylko zbioru surowych liczb. Nasze raporty przekształcają dane z basenu w konkretne zalecenia inżynierskie: „Podnieś listwę tryskową o 8 mm, aby zmniejszyć powierzchnię zwilżaną przy prędkości przelotowej", „Zwiększ denny wznios na pawęży o 3°, aby zmniejszyć przyspieszenie
  podczas slammu" lub „Przesuń wzdłużny środek ciężkości o 150 mm do tyłu, aby poprawić zachowanie ślizgowe". Otrzymujesz jasne zrozumienie, co zmienić i dlaczego.</p>

  <p>Nasz basen jest również dostępny do niezależnych badań prowadzonych przez strony trzecie na zasadzie usług odpłatnych. Jeśli opracowujesz kadłub i potrzebujesz bezstronnej, profesjonalnie przeprowadzonej oceny hydrodynamicznej, zapraszamy do kontaktu.</p>

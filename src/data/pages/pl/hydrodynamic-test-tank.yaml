  title: Hydrodynamiczny zbiornik testowy — holowanie modeli i optymalizacja kadłuba | {SITE}
  description: Zweryfikuj osiągi kadłuba RIB w naszym hydrodynamicznym basenie testowym. Holowanie modeli w skali, analiza poślizgu i testy wydajności paliwowej. Zarezerwuj sesję testową w basenie już dziś.

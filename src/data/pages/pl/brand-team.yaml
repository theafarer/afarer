hero:
  tagline: Our Team
  title: 'Ludzie stojący za afarer<br />—inżynieria wolności na wodzie'
  subtitle: 'Założona w 2012 roku w Qingdao w Chinach, afarer została zbudowana przez inżynierów morskich, materiałoznawców i entuzjastów sportów wodnych, którzy wierzyli w uczynienie profesjonalnych nadmuchiwanych jednostek pływających dostępnymi na całym świecie.'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'Od przybrzeżnego warsztatu<br />do obiektu o powierzchni 12 000 m²'
  subtitle: 'afarer została założona przez zespół inżynierów morskich z dziesięcioleciami łącznego doświadczenia w projektowaniu łodzi nadmuchiwanych, produkcji PVC/Hypalon i globalnej produkcji sprzętu morskiego.'
  items:
    - title: 'Founded: 2012'
      description: 'Założona w Qingdao w Chinach —głównym węźle morskim z głębokim dziedzictwem stoczniowym.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'W tym ponad 50 inżynierów R&D, specjalistów kontroli jakości i techników produkcji.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Dedykowany zakład produkcyjny z 6 liniami produkcyjnymi dla SUP-ów, łodzi nadmuchiwanych i desek SUP.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Eksport do Europy, Ameryk, Bliskiego Wschodu, Azji i Pacyfiku oraz Afryki.'
      icon: tabler:globe

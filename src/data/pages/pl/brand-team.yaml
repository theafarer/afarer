meta:
  title: 'Nasz zespół — inżynierowie morscy i budowniczowie | {SITE}'
  description: 'Założony w 2012 roku w Qingdao, afarer został zbudowany przez inżynierów morskich, specjalistów od materiałów i entuzjastów sportów wodnych. Poznaj zespół stojący za fabryką.'
  keywords:
    - 'zespół afarera'
    - 'inżynierowie morscy'
    - 'producent nadmuchiwanych desek SUP'
    - 'zespół fabryki SUP'
hero:
  tagline: Nasz Zespół
  title: Ludzie stojący za afarer<br />— inżynieria wolności na wodzie
  subtitle: Założona w 2012 roku w Qingdao w Chinach, afarer została zbudowana przez inżynierów morskich, materiałoznawców i entuzjastów sportów wodnych, którzy wierzyli w uczynienie profesjonalnych nadmuchiwanych jednostek pływających dostępnymi na całym świecie.
  image:
    src: /images/team-all.webp
    alt: Pełne zdjęcie zespołu afarer — inżynieria, produkcja i kierownictwo
founding:
  tagline: Nasze Założenie
  title: Od przybrzeżnego warsztatu<br />do obiektu o powierzchni 12 000 m²
  subtitle: afarer została założona przez zespół inżynierów morskich z dziesięcioleciami łącznego doświadczenia w projektowaniu łodzi nadmuchiwanych, produkcji PVC/Hypalon i globalnej produkcji sprzętu morskiego.
  items:
    - title: 'Założono: 2012'
      description: Założona w Qingdao w Chinach — głównym węźle morskim z głębokim dziedzictwem stoczniowym.
      icon: tabler:calendar
    - title: 200 pracowników
      description: W tym ponad 50 inżynierów R&D, specjalistów kontroli jakości i techników produkcji.
      icon: tabler:users
    - title: Obiekt o powierzchni 12 000 m²
      description: Dedykowany zakład produkcyjny z 6 liniami produkcyjnymi dla SUP-ów, łodzi nadmuchiwanych i desek SUP.
      icon: tabler:building-factory
    - title: 50 obsługiwanych krajów
      description: Eksport do Europy, Ameryk, Bliskiego Wschodu, Azji i Pacyfiku oraz Afryki.
      icon: tabler:globe
leadership:
  tagline: Przywództwo
  title: Kierownictwo i przywództwo inżynieryjne
  subtitle: Nasz zespół przywódczy łączy głęboką wiedzę w inżynierii morskiej, handlu międzynarodowym i zarządzaniu jakością.
  columns: 3
  items:
    - title: Założyciel i dyrektor generalny
      name: Toby Liu
      description: 15 lat w produkcji morskiej. Wcześniej kierował działem B+R w dużym chińskim producentcie łodzi. Posiada wiele patentów na projekty łodzi pneumatycznych.
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: Główny Inżynier
      name: Zhang Wei
      description: 20 lat doświadczenia w produkcji PVC/Hypalon i projektowaniu kadłubów typu deep-V. Były dyrektor techniczny w europejskiej firmie zajmującej się inżynierią morską.
      icon: tabler:engine
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Szef działu badań i rozwoju
      name: Chen Ming
      description: Doktorat z materiałoznawstwa. Specjalizuje się w technologii drop-stitch i procesach zgrzewania wysokiej częstotliwości. Ponad 10 lat w kompozytach tekstylnych.
      icon: tabler:flask
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Dyrektor Produkcji
      name: Liu Qiang
      description: 18 lat doświadczenia w szczupłej produkcji i optymalizacji linii produkcyjnych. Czarny pas Six Sigma. Wdrożone systemy jakości ISO 9001.
      icon: tabler:settings
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Kierownik ds. jakości
      name: Wang Fang
      description: 12 lat w kontroli jakości morskiej. Certyfikowany audytor CE i ISO. Nadzoruje testy każdej partii produkcyjnej.
      icon: tabler:shield-check
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Dyrektor ds. Sprzedaży i Operacji
      name: Helen Lee
      description: 15 lat w międzynarodowym handlu B2B. Zarządzał partnerstwami co-brand i dystrybucyjnymi w ponad 30 krajach. Biegle włada 4 językami.
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Filozofia projektowania
  title: Projektowanie zorientowane na inżynierię<br />— każdy szczegół ma znaczenie
  subtitle: Nasza filozofia inżynieryjna koncentruje się na trzech zasadach, które kierują każdym produktem, który budujemy.
  list:
    - 'Niezawodność przede wszystkim: Każdy produkt Afarer jest testowany, aby wytrzymać warunki rzeczywiste — od akcji ratunkowych w zimnej wodzie po wynajem w tropikalnych kurortach. Przeprojektowujemy tam, gdzie to ma największe znaczenie.'
    - 'Precyzja w produkcji: Nasze zakłady korzystają z cięcia CNC, spawania wysokiej częstotliwości oraz automatycznego testowania ciśnienia. Każdy szew, każdy zawór, każda armatura spełnia udokumentowane specyfikacje.'
    - 'Ciągła innowacja: Nasz zespół badawczo-rozwojowy nieustannie ocenia nowe materiały, metody produkcji i udoskonalenia projektowe. Nie czekamy na problemy — przewidujemy je.'
cta:
  title: Chcesz omówić projekt z naszym zespołem?
  subtitle: Nasi inżynierowie są gotowi doradzić w zakresie wyboru produktu, dostosowania i kolekcji co-brand.
  actions:

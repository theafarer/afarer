tests:
  - title: Test ciśnienia
    description: >-
      Komory pneumatyczne są poddawane ciśnieniu przekraczającemu zalecane limity robocze przez dłuższy czas. Weryfikuje to szczelność i integralność strukturalną materiału oraz szwów, zapewniając, że produkt wytrzyma zamierzone użytkowanie i potencjalne nadmierne napompowanie bez awarii lub
      przecieków.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: Test udarności
    description: Produkty są poddawane kontrolowanym uderzeniom o różnej wadze i pod różnymi kątami. Ocena odporności materiału na przebicia, rozdarcia i uszkodzenia spowodowane kolizjami z przeszkodami w wodzie, wykazując trwałość i długowieczność.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: Test odporności na promieniowanie UV
    description: Próbki materiału poddaje się przyspieszonemu naświetlaniu UV symulującemu lata ostrej ekspozycji słonecznej, a następnie ponownie bada zachowanie wytrzymałości na rozciąganie i odporność barw. Weryfikuje to, że mieszanki PVC i Hypalon opierają się blaknięciu, skórkowaniu i pękaniu, zapewniając długotrwałą trwałość w słonecznych warunkach morskich.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: Test odporności na ścieranie
    description: >-
      Próbki materiału są pocierane o powierzchnie ścierne przez określoną liczbę cykli pod kontrolowanym ciśnieniem. Mierzy to zdolność materiału do wytrzymywania zużycia wynikającego z wielokrotnego użytku, kontaktu z piaskiem, skałami lub innymi powierzchniami, zapewniając długoterminową
      trwałość.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: Test wydajności w niskich temperaturach
    description: Produkty są testowane w zimnych środowiskach w celu oceny funkcjonalności i trwałości w różnych warunkach temperaturowych, zapobiegając sztywności lub pękaniu w chłodniejszych wodach. Niezbędne dla łodzi przeznaczonych do użytku zimowego lub na dużych szerokościach geograficznych.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: Test wyporności i nośności
    description: Produkty są testowane z różnymi obciążeniami w celu określenia maksymalnej nośności i zapewnienia bezpiecznego wsparcia dla użytkowników i sprzętu. Każdy model ma zweryfikowaną nośność przed wprowadzeniem do sprzedaży.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: Test manewrowości
    description: Produkty są testowane pod kątem reakcji na wiosłowanie lub sterowanie silnikiem, oceniając promień skrętu i łatwość prowadzenia. Próby na wodzie potwierdzają, że rzeczywiste prowadzenie odpowiada specyfikacjom projektowym.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: Test wodoszczelności
    description: W pełni zmontowane produkty są zanurzane lub poddawane działaniu wody w celu sprawdzenia wszelkich przecieków przez szwy, zawory lub materiały. Każda łódź przechodzi obowiązkową kontrolę wodoszczelności przed wysyłką.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
testing_section:
  tagline: Procedury testowe
  title: Rygorystyczne testy na każdym etapie
commitment:
  title: Nasze zobowiązanie
  body: >-
    Dzięki tym rygorystycznym procedurom testowym {SITE} zapewnia klientom pewność, że nasze nadmuchiwane SUP i łodzie są nie tylko wydajne, ale także zbudowane, by służyć latami — gwarantując niezliczone przyjemne i bezpieczne przygody na wodzie. Nasze laboratorium jakości działa niezależnie od
    produkcji i raportuje bezpośrednio do zarządu.
  cta: Poproś o dokumentację testów
  cta_link: /contact

meta:
  title: 'Jakość i testowanie — kontrola produkcji | {SITE}'
  description: 'System jakości afarera: niezależne laboratorium testowe, procesy ISO 9001 i każda jednostka testowana przed wysyłką. Kontrola jakości produkcji nadmuchiwanych desek SUP i łodzi.'
  keywords:
    - 'kontrola jakości SUP'
    - 'testowanie nadmuchiwanych SUP'
    - 'zapewnienie jakości paddle boardów'

features3_reasons:
  tagline: Why Choose afarer
  title: 'Siedem powodów, aby z nami współpracować'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'Jesteśmy właścicielami i operatorami fabryki o powierzchni 12 000 m². Współpracując z afarer, pracujesz bezpośrednio z ludźmi, którzy projektują, konstruują i budują Twoje produkty —bez pośredników.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Nasz proces projektowania zaczyna się od przypadku użycia, a nie od kategorii produktu. Optymalizujemy kształt kadłuba, dobór materiałów i konfigurację pod kątem rzeczywistego użytkowania łodzi.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'Certyfikowane CE, system jakości ISO, zgodność z BSCI i REACH, zatwierdzone przez USCG. Każdy produkt spełnia międzynarodowe standardy —nie tylko deklaracje.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Kolory rur, układ konsoli, branding, opakowanie —dostosowujemy do Twoich specyfikacji. Bez presji minimalnego zamówienia. Zacznij od prototypu, skaluj z pewnością.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'Magazyn w USA w Kalifornii, bezpośrednia wysyłka z Qingdao, transport lotniczy dla pilnych zamówień. Zajmujemy się dokumentacją celną i papierkową.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'Wspieramy łodzie, które zbudowaliśmy 20 lat temu. Oryginalne części zamienne, porady techniczne, wskazówki naprawcze —nasz zespół jest dostępny, gdy nas potrzebujesz.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Rzeczywiste obciążenia, rzeczywiste wymiary, rzeczywista waga. Żadnych marketingowych nadmuchów. To, co publikujemy, otrzymujesz —zweryfikowane niezależnymi testami.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Trusted by Brands Worldwide
  title: What Our Partners Say
  items:
    - content: 'Współpracowaliśmy z kilkoma producentami w Chinach, ale afarer wyróżnia się wsparciem inżynieryjnym i stałą jakością. Traktują naszą markę jak własną.'
      name: '—OEM Partner, European Water Sports Brand'
    - content: 'Ich Hypalon SUP-y są w służbie naszej floty od ponad 5 lat. Minimalna konserwacja, doskonała odporność na UV. 5-letnia gwarancja na rury daje nam pewność.'
      name: '—Fleet Operator, Middle East Resort Group'
    - content: 'Zespół afarer pomógł nam opracować niestandardowy projekt deski SUP od koncepcji do produkcji w 90 dni. Jakość przekroczyła nasze oczekiwania.'
      name: '—Distributor, Australian Watersports'

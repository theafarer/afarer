meta:
  title: Rozwiązania flot SUP dla ośrodków wypoczynkowych | {SITE}
  description: Kompletne rozwiązania floty SUP dla ośrodków wypoczynkowych i hoteli. Deski klasy komercyjnej, indywidualne oznakowanie, szkolenia personelu oraz pakiety zoptymalizowane pod kątem zwrotu z inwestycji od 20 do 100 desek.
hero:
  tagline: Ośrodki wypoczynkowe i hotele
  title: Zamień nadbrzeżny teren w centrum przychodów<br />z flotami SUP premium
  subtitle: Afarer wyposaża kurorty na całym świecie w nadmuchiwane floty SUP klasy komercyjnej — od pakietów startowych z 20 deskami po flagowe programy ze 100+ deskami. Spersonalizowany branding, szkolenia personelu i części zamienne w cenie.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Goście ośrodka korzystający z deski SUP na dziewiczej plaży
roi_section:
  title: Model przychodów kurortu SUP
  subtitle: Jak kurorty generują 50 000 - 200 000 USD rocznego dochodu z wynajmu SUP z jednej inwestycji.
  metrics:
    - metric: 50 000–200 000+ USD
      label: Roczne przychody z SUP
      detail: Na ośrodek, w zależności od wielkości floty i obłożenia
    - metric: 4–6 miesięcy
      label: Średni okres zwrotu
      detail: Odzyskaj pełną inwestycję w flotę w ciągu jednego sezonu
    - metric: 40%
      label: Wzrost przychodów
      detail: Średni wzrost po przejściu na floty Afarer
    - metric: '500+'
      label: Cykl wynajmu na płytę
      detail: Trwałość klasy komercyjnej do codziennego użytku
packages:
  title: System Pakietów Resortowych
  subtitle: Wybierz pakiet dopasowany do liczby gości i celów przychodowych. Wszystkie pakiety obejmują 12-miesięczną gwarancję i certyfikację CE.
  items:
    - name: Pakiet Startowy
      tagline: Dla butikowych kurortów, do 20 gości/dzień
      features:
        - 20 desek SUP (3 rozmiary dla dorosłych/dzieci)
        - 20 wioseł (regulowane) + 20 kamizelek ratunkowych
        - 4 pompy podwójnego działania (elektryczna opcjonalnie)
        - 2 stojaki magazynowe + zestaw naprawczy
        - Własny nadruk logo na deskach
        - 12-miesięczna gwarancja + Certyfikowane CE
      revenue: Potencjalne roczne przychody w wysokości 50 000–80 000 USD
      cta_text: Pobierz pakiet startowy
    - name: Pakiet Premium
      tagline: Dla dużych kurortów, 50-100 gości/dzień
      features:
        - 50 desek SUP (5 rozmiarów, mieszana flota)
        - 50 wioseł + 50 kamizelek ratunkowych
        - 10 pomp podwójnego działania + 2 pompy elektryczne
        - 5 stojaków magazynowych + 2 wózki transportowe
        - Pełny spersonalizowany branding (deski, wiosła, torby)
        - Sesja szkoleniowa dla personelu (online)
        - Wysyłka części zamiennych w 48 godzin
        - 12-miesięczna gwarancja + Certyfikowane CE
      revenue: Potencjał rocznych przychodów w wysokości 120 000–200 000 USD
      popular: true
      cta_text: Uzyskaj pakiet Premium
    - name: Pakiet Flagowy
      tagline: Dla kurortów ultra premium, 100+ gości/dzień
      features:
        - 100+ desek SUP (pełna gama rozmiarów)
        - Kompletny zestaw akcesoriów (wiosła, kamizelki, pompy, wózki)
        - Szkolenie personelu na miejscu (2 dni)
        - Dedykowany opiekun klienta
        - Części zamienne o priorytetowym znaczeniu (wysyłka w 24h)
        - Pełny spersonalizowany branding (deski + akcesoria)
        - Pakiet zdjęć/wideo marketingowych
        - 24-miesięczna gwarancja + Certyfikat CE
      revenue: Potencjał rocznych przychodów 200 000 USD
      cta_text: Zdobądź pakiet flagowy
case_study:
  quote: Od czasu przejścia na Afarer nasze przychody z wynajmu SUP wzrosły o 40%. Koszty wymiany desek spadły o 60%. Odzyskaliśmy pełną inwestycję w flotę w ciągu 4 miesięcy.
  author: Kierownik ds. Aktywności Wodnych
  location: Ośrodek pięciogwiazdkowy, Malediwy
  results:
    - label: Wzrost przychodów
      value: +40%
    - label: Redukcja kosztów
      value: '-60%'
    - label: Okres zwrotu
      value: 4 miesiące
features:
  title: Dlaczego kurorty wybierają Afarer
  subtitle: Trwałość na poziomie przemysłowym, globalna logistyka i partner, który rozumie branżę hotelarską.
  items:
    - title: 500 Wynajem Rowerów
      description: Każda deska jest testowana, aby przetrwać 500 cykli wypożyczeń w słonej wodzie, słońcu i piasku.
      icon: tabler:shield-check
    - title: Wysyłka części w 48 godzin
      description: Części zamienne wysyłane w ciągu 48 godzin — Twój przychód z wynajmu nigdy się nie zatrzymuje.
      icon: tabler:truck-delivery
    - title: Indywidualne brandowanie
      description: Dopasuj tożsamość swojego ośrodka do niestandardowych kolorów i logo na każdej tablicy.
      icon: tabler:palette
    - title: Szkolenie personelu
      description: Programy szkoleniowe online i stacjonarne dla Twojego zespołu ds. działań.
      icon: tabler:school
    - title: Globalna logistyka
      description: Wysyłka do ponad 50 krajów z opcjami skonsolidowanego frachtu.
      icon: tabler:world
    - title: Certyfikowany CE
      description: Wszystkie urządzenia posiadają certyfikat CE, ISO 9001:2015 — bezpieczeństwo i jakość gwarantowane.
      icon: tabler:certificate

meta:
  title: Program Partnerski SUP Retail | {SITE}
  description: Become an Afarer retail partner. Full product line, professional marketing materials, dropshipping options, and competitive margins for SUP retailers.
hero:
  tagline: Partnerzy detaliczni
  title: Become An Afarer<br />Retail Partner
  subtitle: Sell the fastest-growing SUP brand in your market. Full product line, professional marketing materials, dropshipping options, and margins that make sense.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: Deski SUP Afarer wystawione w sklepie detalicznym
margin_section:
  title: Marże detaliczne i MOQ
  subtitle: Hurtowe poziomy cenowe zaprojektowane z myślą o rentowności detalicznej.
  items:
    - tier: Podstawowy Partner
      discount: 20%
      moq: 500 jednostek/rok
      margin_note: ~150–250 USD zysku na deskę
      features:
        - Dostęp do pełnej linii produktów
        - Pakiet materiałów marketingowych
        - Wsparcie e-mail
        - Dostęp do katalogu produktów
    - tier: Partner Premium
      discount: 30%
      moq: 2 000 jednostek/rok
      margin_note: ~250–400 USD zysku na deskę
      features:
        - Dedykowany opiekun klienta
        - Wyłączna ochrona terytorialna
        - Indywidualne wsparcie marketingowe
        - Pierwszy dostęp do nowych produktów
        - Szkolenia dla pracowników
    - tier: Partner flagowy
      discount: 35%
      moq: 5 000 jednostek/rok
      margin_note: ~350–500 USD zysku na płytce
      features:
        - Wspólne kampanie marketingowe
        - Wsparcie ekspozycji w sklepie
        - Szkolenie personelu na miejscu
        - Wspólne promocje w mediach społecznościowych
        - Priorytetowa alokacja produkcji
product_line:
  title: Kompletna linia produktów
  subtitle: Deska SUP dla każdego klienta, który przekroczy Twoje drzwi.
  items:
    - name: All-Round Series
      description: Bestseller — pasuje do 80% klientów
    - name: Touring Series
      description: Kajakarze wyczynowi — wyższa marża
    - name: Yoga Series
      description: Rynek niszowy — ceny premium
    - name: Kids Series
      description: Klienci rodzinni — powracający kupujący
    - name: Racing Series
      description: Rynek entuzjastów — aureola marki
    - name: Accessories
      description: Dodatki o wysokiej marży (wiosła, kamizelki, pompy, torby)
catalog:
  title: Zasoby partnera detalicznego
  subtitle: Pobierz nasz kompleksowy zestaw dla partnerów detalicznych.
  items:
    - name: 2026 Product Catalog
      desc: Pełna oferta wraz ze specyfikacjami, cenami i informacjami o zamówieniach
      icon: tabler:file-text
      link: /resources/download-catalog
    - name: Retail Partner Guide
      desc: Kalkulator marży, wskazówki merchandisingowe i najlepsze praktyki
      icon: tabler:book
      link: /resources/download-catalog
    - name: Marketing Asset Pack
      desc: Zdjęcia produktów w wysokiej rozdzielczości, zdjęcia lifestyle'owe i materiały POS
      icon: tabler:photo
      link: /media
support:
  title: Wsparcie partnerów detalicznych
  subtitle: Wszystko, czego potrzebujesz, aby sprzedawać pewnie.
  items:
    - Wysokiej rozdzielczości zdjęcia produktów (profesjonalna fotografia)
    - Zdjęcia lifestyle'owe do mediów społecznościowych, strony internetowej i katalogu
    - Materiały marketingowe — plakaty, wieszaki na półki, banery
    - Filmy szkoleniowe o produktach dla edukacji personelu
    - Pakiet treści do mediów społecznościowych (cotygodniowe posty)
    - Opisy produktów zoptymalizowane pod kątem SEO
    - Opcja dropshippingu dostępna — brak ryzyka związanego z magazynowaniem
    - Warunki płatności netto 30 dni
cta:
  title: Ready to become a partner?
  subtitle: Apply for partnership or download our retail catalog.
  actions:
    - text: Złóż wniosek o partnerstwo
      href: /contact?partner=retail
      variant: primary
    - text: Pobierz katalog detaliczny
      href: /resources/download-catalog
      variant: secondary

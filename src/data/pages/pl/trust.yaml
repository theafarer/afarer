faqs_sup:
  title: FAQ dotyczące desek SUP
  subtitle: Często zadawane pytania dotyczące naszych desek do wiosłowania na stojąco.
  columns: 2
  items:
    - title: Jakie rozmiary desek SUP są dostępne?
      description: Oferujemy deski SUP od 9 stóp do 12 stóp, w tym modele uniwersalne, turystyczne, do jogi i specjalistyczne. Nasze najlepiej sprzedające się modele to Tropical Breeze (10 stóp) i Ocean Voyager (11 stóp).
    - title: Czym jest konstrukcja drop-stitch?
      description: Konstrukcja drop-stitch wykorzystuje tysiące poliestrowych nici łączących górną i dolną warstwę deski, umożliwiając utrzymanie wysokiego ciśnienia powietrza (15—0 PSI) i uzyskanie sztywnej, stabilnej platformy. Jest to standard branżowy dla najwyższej jakości nadmuchiwanych SUP.
    - title: Jaki jest limit wagi dla desek SUP?
      description: Nasze deski SUP obsługują do 150 kg w zależności od modelu i objętości. Leviathan Wake to nasz model o największej pojemności, zaprojektowany dla większych wioślarzy i do jogi.
    - title: Czy oferujecie kompletne pakiety SUP?
      description: Tak. Każda deska SUP jest wysyłana z kompletnym pakietem zawierającym 3-częściowe wiosło aluminiowe, ręczną pompkę wysokociśnieniową, linkę spiralną, plecak podróżny i zestaw naprawczy. Niektóre modele zawierają również wymienny zestaw stateczników.
    - title: Jaka jest gwarancja na deski SUP?
      description: Wszystkie deski SUP afarer są objęte roczną gwarancją na wady produkcyjne, w tym pęknięcia szwów, wady zaworów i delaminację materiału przy normalnym użytkowaniu.
    - title: Ile czasu zajmuje pompowanie deski SUP?
      description: Przy użyciu dołączonej pompki ręcznej, pełne napompowanie do 15 PSI zajmuje około 8—2 minut. Aby przyspieszyć pompowanie, zalecamy naszą elektryczną pompkę afarer 12V, która pompuje deskę w mniej niż 4 minuty.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

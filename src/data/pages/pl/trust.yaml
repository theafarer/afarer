warranty_section:
  title: Gwarancja i wsparcie posprzedażowe
  subtitle: Stojymy za każdym produktem z jasnymi warunkami gwarancji, szybkim rozpatrywaniem roszczeń i oryginalnymi częściami zamiennymi.
  items:
    - title: 2-letnia gwarancja na produkt
      desc: Wszystkie produkty afarer objęte są 2-letnią gwarancją na wady produkcyjne — pęknięcia szwów, wady zaworów oraz rozwarstwienie materiału przy normalnym użytkowaniu.
    - title: Wsparcie części przez całe życie
      desc: Oryginalne części zamienne — zawory, zestawy naprawcze, płetwy, pierścienie D — dostępne dla wszystkich modeli. Utrzymujemy formy i narzędzia przez co najmniej 5 lat po zakończeniu produkcji.
    - title: Odpowiedź na roszczenie w ciągu 48 godzin
      desc: Roszczenia gwarancyjne rozpatrywane w ciągu 48 godzin. Płyty zastępcze wysyłane w ciągu 10 dni roboczych dla zatwierdzonych roszczeń.
    - title: Globalna Sieć Napraw
      desc: Autoryzowane centra serwisowe w 15 krajach. Zestawy naprawcze w terenie dostępne do operacji w odległych miejscach. Przewodniki do samodzielnej naprawy dla drobnych uszkodzeń.
    - title: Wsparcie klienta OEM
      desc: Dedykowani menedżerowie kont dla partnerów B2B. Kwartalne przeglądy biznesowe, planowanie zapasów i wsparcie marketingowe we współpracy przy wspólnej marce.
    - title: Pakiet certyfikacyjny
      desc: Pełna dokumentacja zgodności dostarczana z każdą przesyłką — Deklaracja CE, raporty z badań, karty charakterystyki materiałów niebezpiecznych.
      link: /contact

faqs_sup:
  title: FAQ dotyczące desek SUP
  subtitle: Często zadawane pytania dotyczące naszych desek do wiosłowania na stojąco.
  columns: 2
  items:
    - title: Jakie rozmiary desek SUP są dostępne?
      description: Oferujemy deski SUP od 9 stóp do 12 stóp, w tym modele uniwersalne, turystyczne, do jogi i specjalistyczne. Nasze najlepiej sprzedające się modele to Tropical Breeze (10 stóp) i Ocean Voyager (11 stóp).
    - title: Czym jest konstrukcja drop-stitch?
      description: Konstrukcja drop-stitch wykorzystuje tysiące poliestrowych nici łączących górną i dolną warstwę deski, umożliwiając utrzymanie wysokiego ciśnienia powietrza (15–20 PSI) i uzyskanie sztywnej, stabilnej platformy. Jest to standard branżowy dla najwyższej jakości nadmuchiwanych SUP.
    - title: Jaki jest limit wagi dla desek SUP?
      description: Nasze deski SUP obsługują do 150 kg w zależności od modelu i objętości. Leviathan Wake to nasz model o największej pojemności, zaprojektowany dla większych wioślarzy i do jogi.
    - title: Czy oferujecie kompletne pakiety SUP?
      description: Tak. Każda deska SUP jest wysyłana z kompletnym pakietem zawierającym 3-częściowe wiosło aluminiowe, ręczną pompkę wysokociśnieniową, linkę spiralną, plecak podróżny i zestaw naprawczy. Niektóre modele zawierają również wymienny zestaw stateczników.
    - title: Jaka jest gwarancja na deski SUP?
      description: Wszystkie deski SUP afarer są objęte roczną gwarancją na wady produkcyjne, w tym pęknięcia szwów, wady zaworów i delaminację materiału przy normalnym użytkowaniu.
    - title: Ile czasu zajmuje pompowanie deski SUP?
      description: Przy użyciu dołączonej pompki ręcznej, pełne napompowanie do 15 PSI zajmuje około 8–12 minut. Aby przyspieszyć pompowanie, zalecamy naszą elektryczną pompkę afarer 12V, która pompuje deskę w mniej niż 4 minuty.
faqs_materials:
  title: FAQ dotyczące materiału i pielęgnacji SUP
  subtitle: Częste pytania dotyczące materiałów naszych dmuchanych desek SUP, pielęgnacji i przechowywania.
  columns: 2
  items:
    - title: Jakie materiały są używane w nadmuchiwanych SUP-ach firmy Afarer?
      description: Używamy wojskowej klasy PVC (1100 denier) o konstrukcji odpornej na ścieranie i stabilizowanej na działanie promieni UV, zgodnej z przepisami UE REACH i RoHS.
    - title: Jak długo wytrzymują nadmuchiwane deski SUP?
      description: Przy odpowiedniej pielęgnacji wysokiej jakości dmuchany SUP z PVC wytrzymuje 5–10 lat. Regularne czyszczenie, ochrona przed promieniowaniem UV i właściwe przechowywanie znacznie wydłużają jego żywotność.
    - title: Jakie czynności konserwacyjne są wymagane dla nadmuchiwanego SUP-a?
      description: Podstawowa konserwacja obejmuje płukanie świeżą wodą po każdym użyciu (szczególnie w wodzie słonej), suszenie przed przechowywaniem, coroczną kontrolę uszczelek zaworów oraz unikanie długotrwałego narażenia na słońce, gdy nie jest używane.
    - title: Czy dmuchane deski SUP mogą być używane w wodzie słonej?
      description: Tak. Wszystkie dmuchane SUP-y Afarer są przeznaczone do używania zarówno w wodzie słodkiej, jak i słonej. Zalecamy spłukanie świeżą wodą i dokładne osuszenie po kontakcie z wodą słoną.
    - title: Jak przechowywać nadmuchiwany SUP?
      description: Spuść powietrze, oczyść i całkowicie wysusz deskę przed przechowywaniem. Zwiń luźno (unikaj ciasnych zgięć), przechowuj w chłodnym, suchym miejscu z dala od bezpośredniego światła słonecznego i trzymaj z dala od betonowych podłóg, aby zapobiec wchłanianiu wilgoci.
    - title: Jaka jest nośność dmuchanych desek SUP marki afarer?
      description: Nośność waha się od 100 kg dla naszych najmniejszych modeli do ponad 200 kg dla większych desek. Na każdej stronie produktu znajduje się informacja o maksymalnym obciążeniu dla konkretnego modelu.

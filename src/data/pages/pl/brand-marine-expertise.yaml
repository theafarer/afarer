hero:
  tagline: Marine Expertise
  title: 'Dziesięciolecia inżynierii morskiej<br />w każdym kadłubie'
  subtitle: 'afarer łączy głęboką wiedzę o materiałach, precyzyjną produkcję i rzeczywiste testy, aby tworzyć jednostki pływające, które sprawdzają się, gdy ma to znaczenie.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer marine engineering and R&D team at work
expertise_materials:
  tagline: Material Science
  title: 'Wybór odpowiedniego materiału<br />do każdego zastosowania'
  subtitle: 'Pracujemy z trzema podstawowymi materiałami —każdy wybrany do konkretnych przypadków użycia i wymagań wydajnościowych.'
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: '1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.'
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: 'Doskonała odporność chemiczna i stabilność UV. Łodzie Hypalon mogą wytrzymać 15-20 lat przy odpowiedniej pielęgnacji. Zalecane do zastosowań komercyjnych, ratowniczych i wojskowych, gdzie kluczowa jest długoterminowa trwałość.'
      icon: tabler:shield
    - title: Fiberglass & Aluminum
      description: 'Kadłuby z włókna szklanego deep-V dla SUP-ów i łodzi patrolowych —przecinające fale osiągi w trudnych warunkach. Kadłuby aluminiowe dla ciężkich komercyjnych łodzi roboczych wymagających maksymalnej wytrzymałości i ładowności.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Manufacturing Capabilities
  title: 'Precyzyjna produkcja<br />na każdym etapie'
  subtitle: 'Nasz zakład o powierzchni 12 000 m² jest wyposażony w specjalistyczne maszyny na każdym etapie produkcji.'
  columns: 2
  items:
    - title: CNC Cutting
      description: 'Cięcie sterowane komputerowo zapewnia precyzyjne, powtarzalne panele tkaniny z minimalną ilością odpadów. Każdy element pasuje dokładnie tak, jak zaprojektowano.'
      icon: tabler:cpu
    - title: High-Frequency Welding
      description: 'Przemysłowe zgrzewanie HF tworzy szwy mocniejsze niż materiał bazowy. Stała kontrola temperatury i ciśnienia zapewnia szczelne połączenia w każdej serii produkcyjnej.'
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: 'Tysiące poliestrowych nici łączy górne i dolne warstwy tkaniny, umożliwiając nadmuchiwanie pod wysokim ciśnieniem (15-20 PSI) dla sztywnych, stabilnych desek SUP i podłóg.'
      icon: tabler:building-arch
    - title: Pressure Testing
      description: 'Każdy produkt nadmuchiwany jest testowany ciśnieniowo przed wysyłką. Rury SUP są testowane przy 1,5-krotnym ciśnieniu nominalnym —jeśli wytrzyma tam, będzie działać na wodzie.'
      icon: tabler:wind
    - title: Seam Strength Testing
      description: 'Losowe próbki z każdej partii produkcyjnej przechodzą niszczące testy wytrzymałości szwów. Wyniki są rejestrowane i możliwe do prześledzenia do konkretnych serii produkcyjnych.'
      icon: tabler:files
    - title: Water Testing
      description: 'Każdy model SUP przechodzi próby morskie przed certyfikacją. Testy w rzeczywistych warunkach przybrzeżnych potwierdzają wydajność, prowadzenie i stabilność.'
      icon: tabler:droplet
expertise_design:
  tagline: Design & Engineering
  title: 'Zaprojektowane do rzeczywistych warunków'
  subtitle: 'Nasza filozofia projektowania zaczyna się od tego, jak łódź będzie używana —a następnie buduje inżynierię wokół tego przypadku użycia.'
  items:
    - title: Deep-V Hull Design
      description: "Our fiberglass hulls feature calculated deadrise angles optimized for each model's length and intended use. Steeper V for rough-water performance, shallower for stability."
    - title: Multi-Chamber Safety
      description: 'Every boat features 3-7 independent air chambers. If one compartment is compromised, the remaining chambers keep the boat afloat and operational.'
    - title: Ergonomic Layout
      description: 'Console position, tube height, and seat placement are designed around operator comfort during extended use —whether patrolling, fishing, or transporting.'
    - title: Custom Configuration
      description: 'Tube colors, console configuration, fuel capacity, accessory mounts —each model can be customized to match specific operational requirements.'
cta:
  title: 'Masz na myśli konkretne zastosowanie?'
  subtitle: 'Nasz zespół inżynieryjny może doradzić w zakresie doboru materiałów, projektowania i produkcji dla Twojego projektu.'
  actions:

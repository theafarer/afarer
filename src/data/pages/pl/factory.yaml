material_traceability:
  tagline: Śledzenie
  title: Śledzenie materiałów i kontrola partii
  description: >-
    Każda partia surowca otrzymuje unikalny numer partii w naszym systemie ERP. Od momentu przybycia, poprzez produkcję, aż do produktu końcowego, każda karta materiałowa łodzi jest powiązana z oryginalną partią dostawcy. Umożliwia to pełną identyfikowalność w górę łańcucha dla wszelkich zapytań
    dotyczących jakości lub zgodności.
  system: Niestandardowy ERP (wewnętrzny system grupy Qingdao Vatrad) fizyczne etykiety partii na każdym zleceniu produkcyjnym
  coverage: 100% materiałów produkcyjnych — PVC, Hypalon, tkaniny typu drop-stitch, kleje, zawory, okucia, opakowania
  records_retained: 10 lat (zgodnie z wymogiem CE 2013/53/UE)
  suppliers:
    - material: PCV klasy morskiej
      source: Chińscy i koreańscy dostawcy
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japoński dostawca
      certified: ISO 9001, REACH
    - material: Tkanina drop-stitch
      source: Tkactwo wewnętrzne + zewnętrzny partner
      certified: Wewnętrzna kontrola jakości dostawcy ISO 9001
    - material: Zawory i sprzęt
      source: Chińscy dostawcy OEM
      certified: ISO 9001, certyfikaty materiałowe dla każdej partii

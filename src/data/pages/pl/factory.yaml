hero:
  tagline: Fabryka
  title: Fabryka i Produkcja
  subtitle: 12.000 m2 zintegrowanej produkcji —od surowca do gotowej łodzi
intro:
  - Jako marka fabryczna **Qingdao Vatrad Group Co., Ltd.**, afarer kontroluje każdy etap produkcji —od przybycia surowych materiałów PVC i włókna szklanego do końcowej inspekcji przed dostawą gotowej łodzi. Nasz zakład produkcyjny w Strefie Rozwoju Gospodarczego Qingdao zajmuje 12.000 metrów kwadratowych i mieści dedykowane warsztaty do cięcia PVC, uszczelniania termicznego rur, produkcji kadłubów SUP z włókna szklanego, cyfrowego druku SUP, montażu końcowego i testów jakości.
  - Integrując projektowanie, inżynierię, prototypowanie, produkcję i testowanie pod jednym dachem, eliminujemy nieefektywności produkcji kontraktowej i utrzymujemy bezpośrednią kontrolę nad jakością wykonania, doborem materiałów i terminami dostaw. Każda łódź opuszczająca nasz warsztat jest budowana przez naszych ludzi, na naszym sprzęcie, według naszych standardów.

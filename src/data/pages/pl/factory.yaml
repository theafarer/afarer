qc_section:
  tagline: Kontrola Jakości
  title: Proces Testowania i Zapewnienia Jakości
  subtitle: Każda łódź przechodzi obowiązkowe testy przed wysyłką. Nasze laboratorium jakości działa niezależnie od produkcji i raportuje bezpośrednio do kierownictwa.
  steps:
    - step: "1"
      title: Inspekcja Surowców
      desc: Tkaniny PVC, Hypalon i drop-stitch przechodzą test wytrzymałości na rozciąganie (), propagację pęknięcia i weryfikację odporności na UV, zanim jakakolwiek partia wejdzie do produkcji.
    - step: "2"
      title: 48-godzinny Test Retencji Powietrza
      desc: Każda komora rury jest nadmuchiwana do 125% ciśnienia nominalnego i utrzymywana przez 48 godzin. Spadek ciśnienia poniżej 5% powoduje automatyczne odrzucenie i ponowną inspekcję szwu.
    - step: "3"
      title: Test Obciążenia i Równowagi
      desc: Ukończone łodzie są obciążane do maksymalnej ładowności nominalnej i testowane pod kątem stabilności, wolnej burty i prowadzenia. Każda jednostka jest testowana na wodzie przed końcową inspekcją.
oem_section:
  tagline: Projekty OEM
  title: Studia Przypadków Partnerstw Marki i OEM
  subtitle: Od koncepcji do kontenera —jak pomagamy globalnym markom uruchamiać i skalować linie łodzi nadmuchiwanych.
  cases:
    - challenge: Europejski sprzedawca detaliczny outdoor potrzebował linii SUP pod własną marką z unikalnymi grafikami pokładu, ekologicznym PVC i opakowaniem gotowym do sprzedaży —wszystko dostarczone w 60 dni.
      solution: Opracowaliśmy niestandardowe pliki druku cyfrowego, pozyskaliśmy PVC zgodne z REACH i skompresowaliśmy proces próbkowania z 3 rund do 1, umieszczając zespół projektowy w naszej fabryce w Qingdao.
      result: 55 dni od podpisania zamówienia do FOB. 2.400 jednostek w 4 SKU. Zamówienie powtórzone przed przybyciem pierwszego kontenera.
    - challenge: Amerykański startup sportów wodnych potrzebował wysokowydajnego kajaka drop-stitch z niestandardowym kształtem kadłuba, wspólnym brandingiem opakowania i certyfikatem BSCI do umieszczenia w sprzedaży detalicznej.
      solution: Dostosowaliśmy istniejącą formę kajaka drop-stitch ze zmodyfikowanym profilem rocker, opracowaliśmy grafikę opakowania ze wspólnym brandingiem i zapewniliśmy pełną dokumentację audytu BSCI.
      result: Z powodzeniem wprowadzony do 3 głównych amerykańskich sieci outdoor. Ponad 5.000 jednostek w pierwszym roku z 98% wskaźnikiem sprzedaży.
    - challenge: Australijski dystrybutor potrzebował certyfikowanej CE gamy SUP z niestandardowymi kolorami rur, opcją modernizacji do Hypalon i zgodnością z australijską normą AS 1799.
      solution: Wyprodukowaliśmy próbki przedprodukcyjne z 4 wariantami kolorów rur, pozyskaliśmy CSM Hypalon od japońskiego dostawcy i skoordynowaliśmy testy zgodności z AS 1799 przez stronę trzecią.
      result: Gama 3 modeli SUP wprowadzona na rynek AU/NZ. Następnie wygrany przetarg rządowy na 12 SUP-ów patrolowych.
faq_section:
  tagline: FAQ
  title: Często Zadawane Pytania B2B i OEM
  questions:
    - q: Jaka jest minimalna ilość zamówienia (MOQ) dla OEM nadmuchiwanych desek SUP?
      a: MOQ zaczyna się od 5—0 sztuk dla standardowych modeli OEM. Niestandardowe formy i projekty pod własną marką wymagają minimum 200 sztuk, w zależności od złożoności. Zamówienia próbne i serie wzorcowe są dostępne dla nowych marek.
    - q: Czy afarer posiada certyfikat BSCI?
      a: Tak. Nasza fabryka utrzymuje ważny certyfikat zgodności społecznej BSCI (raport z audytu dostępny na żądanie). Posiadamy również  do zarządzania jakością, a wszystkie produkty posiadają certyfikat CE . Dokumentacja zgodności REACH i RoHS jest dostarczana z każdą przesyłką OEM.
    - q: Jaki jest typowy czas realizacji zamówienia OEM?
      a: Tak. Nasza fabryka utrzymuje ważny certyfikat zgodności społecznej BSCI (raport z audytu dostępny na żądanie). Posiadamy również  do zarządzania jakością, a wszystkie produkty posiadają certyfikat CE . Dokumentacja zgodności REACH i RoHS jest dostarczana z każdą przesyłką OEM.
    - q: Czy możecie wysłać FOB Qingdao lub CIF do naszego portu?
      a: Tak. Wysyłamy FOB Qingdao, CIF do głównych portów świata oraz DDP dla kwalifikowanych partnerów. Nasz zespół logistyczny zarządza rezerwacją kontenerów, dokumentacją eksportową i odprawą celną. Wysyłamy do ponad 50 krajów na rynkach UE, USA, AU i Azji.
b2b_moq: "Standardowe MOQ: 5—0 sztuk na model (SUP/kajak/drop-stitch). MOQ SUP: 2— sztuk. Zamówienia próbne mile widziane dla nowych partnerstw."
production_flow:
  tagline: Production Flow
  title: From Material to Finished Boat
  subtitle: Every boat passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: "01"
      title: Material Receiving & Incoming QC
      description: All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.
      qc_check: Tensile strength (ASTM D751), tear resistance (ISO 4674), thickness gauge, adhesive viscosity, visual defect scan
      qc_threshold: 100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect
      responsibility: Incoming QC team (3 inspectors)
    - stage: "02"
      title: CNC Cutting & Material Prep
      description: Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.
      qc_check: Dimensional check against CAD DXF files, edge quality inspection, panel count verification
      qc_threshold: Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance
      responsibility: Cutting workshop lead
    - stage: "03"
      title: Welding & Drop-Stitch Bonding
      description: Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.
      qc_check: Peel test every 50 units (ASTM D751), weld width measurement, hot-air temperature log review, visual seam inspection under backlight
      qc_threshold: Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject
      responsibility: Welding QC (2 inspectors per shift)
    - stage: "04"
      title: Assembly & Rigging
      description: "Boats move to final assembly where all components are mated: hull + tubes, valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist."
      qc_check: 100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection
      qc_threshold: "Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)"
      responsibility: Assembly team lead + line QC
    - stage: "05"
      title: Pressure Testing & Quality Hold
      description: Every chamber is inflated to 1.25× rated pressure (typically 20—5 PSI) and held for 24—8 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.
      qc_check: 24h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair
      qc_threshold: Max 5% pressure drop over 24h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch
      responsibility: Quality lab (independent of production, reports to management)
    - stage: "06"
      title: Final Inspection & Packing
      description: Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.
      qc_check: Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification
      qc_threshold: AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected
      responsibility: Final QC team (4 inspectors) + Packing team lead

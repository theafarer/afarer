qc_section:
  tagline: Kontrola Jakości
  title: Proces Testowania i Zapewnienia Jakości
  subtitle: Każda łódź przechodzi obowiązkowe testy przed wysyłką. Nasze laboratorium jakości działa niezależnie od produkcji i raportuje bezpośrednio do kierownictwa.
  steps:
    - step: Jeden
      title: Inspekcja Surowców
      desc: Tkaniny PVC, Hypalon i drop-stitch przechodzą test wytrzymałości na rozciąganie (ASTM D751), propagację pęknięcia i weryfikację odporności na UV, zanim jakakolwiek partia wejdzie do produkcji.
    - step: Dwa
      title: 48-godzinny Test Retencji Powietrza
      desc: Każda komora rury jest nadmuchiwana do 125% ciśnienia nominalnego i utrzymywana przez 48 godzin. Spadek ciśnienia poniżej 5% powoduje automatyczne odrzucenie i ponowną inspekcję szwu.
    - step: Trzy
      title: Test Obciążenia i Równowagi
      desc: Ukończone łodzie są obciążane do maksymalnej ładowności nominalnej i testowane pod kątem stabilności, wolnej burty i prowadzenia. Każda jednostka jest testowana na wodzie przed końcową inspekcją.
oem_section:
  tagline: Projekty OEM
  title: Studia Przypadków Partnerstw Marki i OEM
  subtitle: Od koncepcji do kontenera — jak pomagamy globalnym markom uruchamiać i skalować linie łodzi nadmuchiwanych.
  cases:
    - challenge: Europejski sprzedawca detaliczny outdoor potrzebował linii SUP pod własną marką z unikalnymi grafikami pokładu, ekologicznym PVC i opakowaniem gotowym do sprzedaży — wszystko dostarczone w 60 dni.
      solution: Opracowaliśmy niestandardowe pliki druku cyfrowego, pozyskaliśmy PVC zgodne z REACH i skompresowaliśmy proces próbkowania z 3 rund do 1, umieszczając zespół projektowy w naszej fabryce w Qingdao.
      result: 55 dni od podpisania zamówienia do FOB. 2.400 jednostek w 4 SKU. Zamówienie powtórzone przed przybyciem pierwszego kontenera.
    - challenge: Amerykański startup sportów wodnych potrzebował wysokowydajnego kajaka drop-stitch z niestandardowym kształtem kadłuba, wspólnym brandingiem opakowania i certyfikatem BSCI do umieszczenia w sprzedaży detalicznej.
      solution: Dostosowaliśmy istniejącą formę kajaka drop-stitch ze zmodyfikowanym profilem rocker, opracowaliśmy grafikę opakowania ze wspólnym brandingiem i zapewniliśmy pełną dokumentację audytu BSCI.
      result: Z powodzeniem wprowadzony do 3 głównych amerykańskich sieci outdoor. Ponad 5.000 jednostek w pierwszym roku z 98% wskaźnikiem sprzedaży.
    - challenge: Australijski dystrybutor potrzebował certyfikowanej CE gamy SUP z niestandardowymi kolorami rur, opcją modernizacji do Hypalon i zgodnością z australijską normą AS 1799.
      solution: Wyprodukowaliśmy próbki przedprodukcyjne z 4 wariantami kolorów rur, pozyskaliśmy CSM Hypalon od japońskiego dostawcy i skoordynowaliśmy testy zgodności z AS 1799 przez stronę trzecią.
      result: Gama 3 modeli SUP wprowadzona na rynek AU/NZ. Następnie wygrany przetarg rządowy na 12 SUP-ów patrolowych.
faq_section:
  tagline: Najczęściej zadawane pytania
  title: Często Zadawane Pytania B2B i OEM
  questions:
    - q: Jaka jest minimalna ilość zamówienia (MOQ) dla OEM nadmuchiwanych desek SUP?
      a: MOQ zaczyna się od 5–10 sztuk dla standardowych modeli OEM. Niestandardowe formy i projekty pod własną marką wymagają minimum 200 sztuk, w zależności od złożoności. Zamówienia próbne i serie wzorcowe są dostępne dla nowych marek.
    - q: Czy afarer posiada certyfikat BSCI?
      a: Tak. Nasza fabryka utrzymuje ważny certyfikat zgodności społecznej BSCI (raport z audytu dostępny na żądanie). Posiadamy również ISO 9001 do zarządzania jakością, a wszystkie produkty posiadają certyfikat CE. Dokumentacja zgodności REACH i RoHS jest dostarczana z każdą przesyłką OEM.
    - q: Jaki jest typowy czas realizacji zamówienia OEM?
      a: Standardowy czas realizacji wynosi 30–45 dni od potwierdzenia zamówienia i wpłaty zaliczki przy produkcji OEM w seriach. Opracowanie niestandardowych form dodaje 15–20 dni na wykonanie narzędzi. Przyspieszona produkcja jest dostępna dla pilnych zamówień i sezonowych szczytów. Próbki prototypowe są zazwyczaj wysyłane w ciągu 15–20 dni.
    - q: Czy możecie wysłać FOB Qingdao lub CIF do naszego portu?
      a: Tak. Wysyłamy FOB Qingdao, CIF do głównych portów świata oraz DDP dla kwalifikowanych partnerów. Nasz zespół logistyczny zarządza rezerwacją kontenerów, dokumentacją eksportową i odprawą celną. Wysyłamy do ponad 50 krajów na rynkach UE, USA, AU i Azji.
b2b_moq: 'Standardowe MOQ: 5–10 sztuk na model (SUP/kajak/drop-stitch). MOQ SUP: 2–5 sztuk. Zamówienia próbne mile widziane dla nowych partnerstw.'
production_flow:
  tagline: Przepływ produkcji
  title: Od materiału do gotowej łodzi
  subtitle: Każda łódź przechodzi przez 6 etapów produkcji z punktami kontrolnymi QC na każdym kroku. Żadnych skrótów, żadnych pominiętych inspekcji.
  stages:
    - stage: '01'
      title: Odbiór materiału i kontrola jakości przy przyjęciu
      description: Wszystkie przychodzące materiały są rejestrowane według numeru partii/wiazek w naszym systemie ERP. Rolki tkaniny PVC, rdzenie z tkaniny drop-stitch, zawory, kleje i elementy sprzętowe są poddawane kwarantannie do momentu zatwierdzenia przez kontrolę jakości.
      qc_check: Wytrzymałość na rozciąganie (ASTM D751), odporność na rozdarcie (ISO 4674), grubość, lepkość kleju, skanowanie wizualne pod kątem wad
      qc_threshold: 100% partii przetestowanych. Odrzucić, jeśli wytrzymałość na rozciąganie < 90% normy, odporność na rozdzieranie < minimalnej normy lub występuje jakakolwiek wada wizualna
      responsibility: Nadchodzący zespół kontroli jakości (3 inspektorów)
    - stage: '02'
      title: Cięcie CNC i przygotowanie materiału
      description: Optymalizowane komputerowo rozmieszczanie układa panele na arkuszach PCV, aby zminimalizować odpady. Automatyczne maszyny CNC utrzymują dokładność pozycjonowania na poziomie 0,1 mm.
      qc_check: Kontrola wymiarów w porównaniu z plikami CAD DXF, inspekcja jakości krawędzi, weryfikacja liczby paneli
      qc_threshold: Każdy 20. panel mierzony. Tolerancja ±0,5 mm. Odrzucić partię, jeśli >2% poza tolerancją
      responsibility: Kierownik warsztatu cięcia
    - stage: '03'
      title: Spawanie i łączenie metodą drop-stitch
      description: Rdzenie drop-stitch są łączone z zewnętrznymi laminatami PVC za pomocą laminowania na gorąco. Komory rur są zgrzewane metodą RF lub zgrzewaniem gorącym powietrzem. Taśmy szynowe są łączone poprzez fuzję w trzech warstwach.
      qc_check: Test odrywania co 50 jednostek (ASTM D751), pomiar szerokości spawu, przegląd rejestru temperatury gorącego powietrza, wizualna inspekcja szwu pod światłem wstecznym
      qc_threshold: Siła odrywania min 8 N/cm. Tolerancja szerokości spoiny ±1 mm. Każde widoczne tworzenie kanałów = odrzut
      responsibility: Kontrola jakości spawalnictwa (2 inspektorów na zmianę)
    - stage: '04'
      title: Montaż i instalacja
      description: 'Łodzie przechodzą do końcowego montażu, gdzie wszystkie elementy są łączone: kadłub, rury, zainstalowane zawory, pierścienie D, uchwyty, skrzynki na płetwy i montaż torby transportowej. Każda jednostka podlega 100-punktowej liście kontrolnej montażu.'
      qc_check: Zatwierdzenie listy kontrolnej 100 punktów dla jednostki, test funkcji zaworu (10 cykli otwierania/zamykania), weryfikacja momentu dokręcania sprzętu, inspekcja wizualna
      qc_threshold: 'Polityka zerowej wadliwości dla elementów krytycznych dla bezpieczeństwa (zawory, pierścienie D, uchwyty). Drobne wady kosmetyczne: AQL 2,5 (ISO 2859)'
      responsibility: Kierownik zespołu montażowego + kontrola jakości na linii
    - stage: '05'
      title: Test ciśnieniowy i zatrzymanie jakości
      description: Każda komora jest napełniana do 1,25× nominalnego ciśnienia (zwykle 20–25 PSI) i utrzymywana przez 24–48 godzin. Czujniki ciśnienia rejestrują dane ciągłe. Komory, w których nastąpi spadek ciśnienia powyżej 5%, są odrzucane i wysyłane do ponownej kontroli szwów.
      qc_check: 24-godzinny zapis utrzymania ciśnienia, codziennie weryfikowana kalibracja czujnika, ciśnienie skompensowane temperaturowo, ponowne testowanie szwu po naprawie
      qc_threshold: Maksymalny spadek ciśnienia 5% przez 24h przy stabilnej temperaturze. Każda komora przekraczająca ten limit = 100% ponowny test całej partii produkcyjnej
      responsibility: Laboratorium jakości (niezależne od produkcji, podlega kierownictwu)
    - stage: '06'
      title: Ostateczna inspekcja i pakowanie
      description: Końcowa kontrola wizualna i funkcjonalna. Wady powierzchni, jednolitość kolorów, weryfikacja etykiet/KODÓW BIN, integralność opakowania oraz kompletność akcesoriów. Jednostki są pakowane próżniowo, pakowane w pudełka i układane na paletach do załadunku kontenerowego.
      qc_check: Pełna inspekcja wizualna, lista kontrolna akcesoriów według SKU, test upuszczenia opakowania (1 m, losowa próbka), weryfikacja skanowania etykiety/kodu kreskowego
      qc_threshold: AQL 2,5 dla wad poważnych, AQL 4,0 dla wad drobnych. Zerowa tolerancja dla wad zagrażających bezpieczeństwu. 100% jednostek poddanych inspekcji wizualnej
      responsibility: Końcowy zespół kontroli jakości (4 inspektorów) + Kierownik zespołu pakowania

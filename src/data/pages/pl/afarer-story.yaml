timeline:
  - year: Dwa tysiące dwanaście
    title: Fundamenty produkcji morskiej
    body: >-
      afarer rozpoczął działalność jako specjalistyczny warsztat produkcji nadmuchiwanych łodzi w Qingdao w Chinach, koncentrując się na rzemiośle morskim i produkcji pontonów. Początkowy nacisk położono na budowanie niezawodnych produktów dzięki praktycznemu doświadczeniu inżynieryjnemu i
      dyscyplinie produkcyjnej.
  - year: Dwa tysiące piętnaście
    title: Pierwszy eksport i certyfikacja CE
    body: Pierwsze zamówienia eksportowe trafiły do Japonii i Korei. Uzyskano certyfikat CE dla podstawowych linii produktów, co oznaczało wejście afarer na rynki międzynarodowe. Firma zaczęła obsługiwać użytkowników komercyjnych i rekreacyjnych poza Chinami.
  - year: Dwa tysiące osiemnaście
    title: Rozbudowa fabryki
    body: Przeprowadzka do zakładu produkcyjnego o powierzchni 12 000 m². Dodano linie zgrzewania RF i moce produkcyjne drop-stitch, umożliwiając produkcję na większą skalę i ulepszone systemy kontroli jakości.
  - year: Dwa tysiące dwadzieścia
    title: Utworzenie centrum R&D
    body: Otwarto dedykowane centrum badawczo-rozwojowe z laboratorium tkanin PVC, basenem testów hydrodynamicznych i studium symulacji CAD/FEA. Rozwój produktów rozszerzono o lekkie konstrukcje, lepszą trwałość i projektowanie zorientowane na użytkownika.
  - year: Dwa tysiące dwadzieścia dwa
    title: Certyfikacja i globalny wzrost
    body: Uzyskano certyfikat ISO 9001. Zespół rozszerzono do 14 inżynierów R&D i ponad 200 pracowników. Produkty trafiły do klientów w Europie, Ameryce oraz regionie Azji i Pacyfiku dzięki partnerstwom dystrybucyjnym i co-brand.
  - year: Dwa tysiące dwadzieścia cztery
    title: Studio innowacji i wzornictwa
    body: Uruchomiono studio projektowe i innowacyjne pełnego zakresu dla niestandardowych projektów co-brand — od koncepcji do produkcji. Wzmocniono profesjonalne zastosowania morskie, w tym dla służb ratowniczych, komercyjnych i rządowych.
  - year: Dwa tysiące dwadzieścia sześć
    title: Budując przyszłość eksploracji wód
    body: Dziś afarer kontynuuje rozwój pontonów, systemów SUP i niestandardowych rozwiązań morskich — łącząc ludzi i organizacje z wodami świata. Obsługiwanych jest 50+ krajów, roczna wydajność przekracza 15 000 jednostek.
content_founding:
  tagline: Początek
  title: Zrodzeni na wodzie
  subtitle: 'afarer rozpoczął działalność w nadmorskim warsztacie w Qingdao z jedną łodzią i wizją: budować nadmuchiwane jednostki zdolne do pracy w rzeczywistych warunkach morskich.'
  paragraphs:
    - W 2012 roku nasi założyciele dostrzegli lukę na rynku — większość pontonów była albo niedroga, ale zawodna, albo wysokiej jakości, ale zaporowo droga. Uwierzyli, że jest miejsce dla producenta oferującego zarówno jakość, jak i wartość.
    - Pierwszy kadłub został zbudowany ręcznie, przetestowany na lokalnych wodach i udoskonalony na podstawie opinii rybaków i małych operatorów komercyjnych. Ta pętla sprzężenia zwrotnego — buduj, testuj, słuchaj, ulepszaj — pozostaje do dziś w centrum naszej filozofii inżynieryjnej.
    - Do 2015 roku wieść rozeszła się poza Qingdao. Międzynarodowi dystrybutorzy zaczęli zamawiać próbki. To, co zaczęło się jako lokalny warsztat, stawało się globalnym dostawcą.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Wczesny warsztat produkcyjny afarer i proces produkcji
content_growth:
  tagline: Wzrost i innowacje
  title: Od warsztatu do obiektu o powierzchni 12 000 m²
  subtitle: Ciągłe inwestycje w ludzi, sprzęt i procesy przekształciły afarer w nowoczesny zakład produkcji morskiej.
  paragraphs:
    - Wraz ze wzrostem popytu rosnął nasz zakład. Rozszerzyliśmy się z małego warsztatu do fabryki o powierzchni 12 000 m² z dedykowanymi liniami produkcyjnymi dla łodzi SUP, pontonów, desek SUP i akcesoriów.
    - Zainwestowaliśmy w maszyny do cięcia CNC, urządzenia do zgrzewania wysokiej częstotliwości, linie produkcyjne drop-stitch i kompleksowe stanowiska testowe — co pozwala nam kontrolować każdy aspekt jakości produkcji.
    - Dziś nasz zespół liczący ponad 200 osób obejmuje inżynierów morskich, materiałoznawców, specjalistów ds. kontroli jakości i wykwalifikowanych rzemieślników — wielu z nich pracuje w afarer od początku.
philosophy:
  tagline: Filozofia marki
  title: Inżynieria wolności na wodzie
  body: Wolność na wodzie to nie tylko przemieszczanie się. To odkrywanie nowych miejsc, tworzenie doświadczeń na łonie natury, łączenie ludzi z przyrodą i realizacja profesjonalnych misji. Inżynieria czyni tę wolność możliwą.
  pillars:
    - title: Niezawodność przede wszystkim
      body: Środowisko wodne wymaga zaufania. Produkty afarer są projektowane z myślą o stabilności, trwałości, bezpieczeństwie i konsekwentnej wydajności.
    - title: Projektowanie zorientowane na człowieka
      body: Produkty powinny służyć ludziom, nie technologii. Każda decyzja projektowa zaczyna się od zrozumienia, jak ludzie używają łodzi, gdzie eksplorują i jakie napotykają wyzwania.
    - title: Dostępna eksploracja
      body: Woda nie powinna należeć tylko do ekspertów. afarer tworzy sprzęt, który pozwala większej liczbie osób bezpiecznie doświadczać rzek, jezior, oceanów i środowisk przybrzeżnych.
    - title: Ciągłe innowacje
      body: Innowacje to nie tylko tworzenie nowych produktów. To ulepszanie każdego szczegółu — materiałów, konstrukcji, produkcji i doświadczenia użytkownika.
engineeringDna:
  tagline: Inżynieryjne DNA
  title: Jak afarer tworzy produkty
  areas:
    - title: Nauka o materiałach
      body: afarer koncentruje się na doborze odpowiednich materiałów do różnych środowisk morskich. Kluczowe parametry to odporność na ścieranie, odporność na UV, stabilność ciśnienia i długoterminowa trwałość.
      items:
        - Odporność na ścieranie
        - Odporność na UV
        - Stabilność ciśnienia
        - Długoterminowa trwałość
    - title: Inżynieria konstrukcyjna
      body: Nadmuchiwane jednostki wymagają precyzyjnej równowagi między sztywnością, wagą, przenośnością i stabilnością. Inżynieria afarer koncentruje się na optymalizacji tych czynników dzięki technologii drop-stitch i zaawansowanym metodom łączenia szwów.
      items:
        - Sztywność
        - Optymalizacja wagi
        - Przenośność
        - Stabilność
    - title: Precyzja produkcji
      body: 'Każdy produkt przechodzi kontrolowane procesy: przygotowanie materiału, precyzyjne cięcie, zgrzewanie i klejenie, montaż, inspekcję jakości i weryfikację wydajności.'
      items:
        - Przygotowanie materiału
        - Precyzyjne cięcie
        - Zgrzewanie i klejenie
        - Montaż i kontrola
    - title: Inżynieria scenariuszy użytkowania
      body: Produkty są opracowywane z myślą o rzeczywistych zastosowaniach — rekreacji, przygodzie i użytku profesjonalnym — zapewniając, że każdy projekt spełnia specyficzne wymagania docelowego środowiska.
      items:
        - Rekreacja
        - Przygoda
        - Profesjonalne
        - Komercyjne

hero:
  tagline: Pozyskiwanie
  title: Przewodnik dla nabywców OEM — Pozyskiwanie nadmuchiwanego sprzętu wodnego z Azji
  subtitle: 12 minut czytania
content_html: |-
  <h2>1. Wstępna kwalifikacja: na co zwracać uwagę przy wyborze fabryki</h2>

  <h3>Certyfikaty zgodności</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – System zarządzania jakością</li>
    <li><strong>Certyfikacja CE</strong> – Zweryfikuj numer jednostki notyfikowanej</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Audyty zgodności społecznej</li>
    <li><strong>REACH / RoHS</strong> – Deklaracje zgodności materiałowej</li>
  </ul>

  <h3>Możliwości produkcyjne</h3>
  <ul>
    <li>Tkanie rdzenia drop-stitch na miejscu lub na zewnątrz</li>
    <li>Linia powlekania / laminowania PVC</li>
    <li>Sprzęt do zgrzewania RF i zgrzewania gorącym powietrzem</li>
    <li>Produkcja form na miejscu (obróbka CNC)</li>
    <li>Laboratorium badawcze (badania ciśnienia, starzenie UV, badania wytrzymałości na rozciąganie)</li>
  </ul>

  <h3>Weryfikacja doświadczenia</h3>
  <ul>
    <li>Lata doświadczenia w produkcji nadmuchiwanych jednostek pływających (minimum 5 lat)</li>
    <li>Liczba inżynierów w zespole</li>
    <li>Istniejący klienci OEM/ODM (poproś o referencje)</li>
    <li>Kierunki eksportu – czy już wysyłają na Twój rynek docelowy?</li>
  </ul>

  <h2>2. Protokoły kontroli jakości</h2>
  <p>Kontrola jakości przy dostawie materiałów: wytrzymałość na rozciąganie (ASTM D751 lub ISO 1421), odporność na rozdarcie (ASTM D2261 lub ISO 4674), siła przyczepności, punktowe kontrole starzenia UV.</p>
  <p>Kontrola jakości w trakcie produkcji: monitorowanie wytrzymałości szwów co 50 sztuk, weryfikacja momentu dokręcenia zaworów, kontrole gęstości nici drop-stitch, kontrole wymiarowe względem rysunków CAD.</p>
  <p>Inspekcja końcowa: test utrzymania ciśnienia w 100% (24 godziny, maks. spadek 5%), inspekcja wizualna, test działania zaworów, losowe badania próbek (AQL 2.5 lub 4.0 wg ISO 2859).</p>

  <h2>3. Lista kontrolna dokumentacji zgodności</h2>
  <ul>
    <li>Deklaracja zgodności (DoC) odnosząca się do właściwej dyrektywy UE</li>
    <li>Certyfikat CE od jednostki notyfikowanej</li>
    <li>Raport z badań z akredytowanego laboratorium</li>
    <li>Karty charakterystyki materiałów (MSDS)</li>
    <li>Deklaracja zgodności z REACH</li>
    <li>Specyfikacja materiałowa z identyfikowalnością dostawców</li>
    <li>Raport z inspekcji fabryki</li>
  </ul>

  <h2>4. Negocjacje MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Typ produktu</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standardowe MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Zakres negocjowalny</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Deski SUP</td><td class="p-3 border">50 – 100 szt.</td><td class="p-3 border">5 – 10 szt. (próba)</td></tr>
      <tr><td class="p-3 border">Kajaki</td><td class="p-3 border">50 – 100 szt.</td><td class="p-3 border">5 – 10 szt. (próba)</td></tr>
      <tr><td class="p-3 border">Łodzie nadmuchiwane</td><td class="p-3 border">50 – 100 szt.</td><td class="p-3 border">2 – 5 szt. (próba)</td></tr>
      <tr><td class="p-3 border">Łodzie RIB</td><td class="p-3 border">20 – 50 szt.</td><td class="p-3 border">2 – 5 szt. (próba)</td></tr>
      <tr><td class="p-3 border">Sprzęt bezpieczeństwa / akcesoria</td><td class="p-3 border">200 – 500 szt.</td><td class="p-3 border">50 – 100 szt. (próba)</td></tr>
    </tbody>
  </table>

  <h2>5. Logistyka i wysyłka</h2>
  <p>Typowe Incotermsy: <strong>FOB</strong> (fabryka dostarcza do portu wyjścia – najczęstsze), <strong>EXW</strong> (kupujący organizuje całą wysyłkę od drzwi fabryki), <strong>CIF</strong> (fabryka pokrywa fracht i ubezpieczenie do portu przeznaczenia).</p>
  <p>Produkty nadmuchiwane mają niską wagę i dużą objętość – waga objętościowa (DIM) często decyduje o koszcie wysyłki. Poproś o pakowanie próżniowe, aby zmniejszyć objętość o 50–60%. Fracht morski z Chin do UE: 25–35 dni; na zachodnie wybrzeże USA: 15–20 dni.</p>

  <h2>6. Typowe pułapki</h2>
  <ul>
    <li><strong>Brak audytu fabryki:</strong> Zawsze przeprowadzaj lub zlecaj audyt strony trzeciej (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Tylko ustne specyfikacje:</strong> Szczegółowa karta specyfikacji technicznej podpisana przez obie strony</li>
    <li><strong>Pomijanie zatwierdzenia próbek:</strong> Pisemne zatwierdzenie próbek przed produkcją masową</li>
    <li><strong>Brak kontroli jakości podczas produkcji:</strong> Inspekcja strony trzeciej w trakcie produkcji (DUPRO) i przed wysyłką (PSI)</li>
    <li><strong>Ignorowanie zgodności:</strong> Zweryfikuj certyfikację CE/UKCA przed rozpoczęciem produkcji</li>
  </ul>

  <h2>7. Dlaczego Afarer</h2>
  <p>Afarer produkuje nadmuchiwane jednostki pływające OEM/ODM od 2012 roku. Dysponując certyfikowanym zakładem ISO 9001 o powierzchni 12,000 m&sup2;, ponad 25 inżynierami i certyfikacją CE we wszystkich liniach produktowych, spełniamy każde kryterium z tego przewodnika. Oferujemy próbne MOQ dla nowych partnerów oraz pełne pakiety dokumentacji zgodności.</p>

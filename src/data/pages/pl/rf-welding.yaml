hero:
  tagline: Laboratorium 03
  title: Centrum Spawania RF
  subtitle: Technologia łączenia dielektrycznego dla spoin wytrzymujących ciśnienie
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-1-1200w.webp
  image_alt: Proces łączenia dielektrycznego spawania RF Afarer
intro: >-
  Łódź pneumatyczna jest tak niezawodna, jak jej szwy. Jeden słaby spaw może zagrozić całej komorze — a na morzu awaria komory to nie niedogodność; to zagrożenie bezpieczeństwa. W {SITE.name} zainwestowaliśmy w dedykowane Centrum Spawania Falą Radiową (RF), które łączy przemysłowe prasy do spawania
  dielektrycznego z rygorystyczną kontrolą procesu i testami po spawaniu. Każdy szew, który wykonujemy, jest dokumentowany, możliwy do śledzenia i certyfikowany, by spełniać lub przekraczać wymagania międzynarodowego standardu dla sprzętu pneumatycznego.
content_html: >-
  <h2>Nauka stojąca za spoiną</h2>

  <p>Spawanie RF wykorzystuje energię elektromagnetyczną o wysokiej częstotliwości (zazwyczaj 27.12 MHz) do wzbudzania cząsteczek polarnych w tkaninie powlekanej PVC lub Hypalonem, generując ciepło dokładnie na styku materiałów. W przeciwieństwie do spawania gorącym powietrzem lub klinem grzewczym,
  spawanie RF tworzy prawdziwe wiązanie molekularne — dwie warstwy tkaniny łączą się w jednolity materiał w strefie zgrzewania, tworząc połączenie równie mocne jak sam materiał bazowy.</p>


  <h2>Wyposażenie spawalnicze i kontrola procesu</h2>

  <p>Nasze centrum spawalnicze jest wyposażone w:</p>

  <table>
    <thead><tr><th>Maszyna</th><th>Moc / Wydajność</th><th>Zastosowanie</th></tr></thead>
    <tbody>
      <tr><td>Prasa dielektryczna RF 1</td><td>15 kW, płyta grzewcza 2000 × 600 mm</td><td>Główne spoiny wzdłużne, połączenia pawęża z komorą pneumatyczną</td></tr>
      <tr><td>Prasa dielektryczna RF 2</td><td>10 kW, płyta grzewcza 1500 × 500 mm</td><td>Spoiny przegród, mocowania stożków, łatki zaworów</td></tr>
      <tr><td>Zgrzewarka RF sterowana CNC</td><td>8 kW, stół XY 2500 × 1200 mm</td><td>Spoiny krzywoliniowe, tłoczenie logo/panele, precyzyjne łatki</td></tr>
      <tr><td>Automatyczna zgrzewarka z klinem grzewczym</td><td>Regulowana temperatura, maks. 1.2 m/min</td><td>Metoda zapasowa dla materiałów Hypalon/CSM</td></tr>
    </tbody>
  </table>

  <p>Każda prasa RF jest wyposażona w zamkniętą pętlę monitorowania temperatury i ciśnienia. Parametry spawania — moc, czas prasowania, czas chłodzenia, nacisk elektrod — są programowane dla każdego typu materiału i rejestrowane w naszym systemie Manufacturing Execution System (MES) w celu
  zapewnienia pełnej identyfikowalności.</p>


  <h2>Testy jakości spoin — każda spoina, każda łódź</h2>

  <p>Integralność spoin jest weryfikowana w ramach obowiązkowego protokołu składającego się z czterech testów:</p>

  <ol>
    <li><strong>Kontrola wizualna</strong> — 100 % spoin jest kontrolowanych wizualnie pod kątem przepaleń, przesunięć, zanieczyszczeń lub niepełnego zespolenia. Próg odrzutu: 0.5 % metrów bieżących.</li>
    <li><strong>Test odrywania</strong> — Pasek o szerokości 25 mm jest wycinany z próbki zgrzewanej w każdej partii produkcyjnej. Minimalna siła odrywania: 120 N/25 mm dla PVC 1100 dtex.</li>
    <li><strong>Test szczelności</strong> — Każda gotowa komora jest ciśnieniowana do 1.5 × ciśnienia roboczego i utrzymywana przez 30 minut. Spadek ciśnienia nie może przekraczać 2 %.</li>
    <li><strong>Test cykli termicznych</strong> — Próbki są cyklowane od -20 °C do +60 °C przez 50 cykli, a następnie ponownie poddawane testowi odrywania. Dopuszczalna utrata wytrzymałości: &lt; 10 %.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Porównanie wytrzymałości na odrywanie — spawanie RF vs gorącym powietrzem (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Zgrzewanie RF</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Gorące powietrze</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium"> min</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Spawanie RF konsekwentnie osiąga 90-95 % wytrzymałości materiału bazowego, znacznie powyżej minimum.</p>
  </div>


  <h2>Profesjonalna wiedza specjalistyczna</h2>

  <p>Nasz zespół spawalniczy jest kierowany przez starszego inżyniera procesu z 11-letnim doświadczeniem w spawaniu dielektrycznym tkanin powlekanych. Każdy operator przechodzi 6-miesięczny wewnętrzny program certyfikacji, zanim otrzyma zgodę na pracę przy spoinach produkcyjnych. Recertyfikacja jest
  wymagana corocznie i obejmuje praktyczny test spawania oceniany zgodnie z naszym wewnętrznym standardem klasy A (wytrzymałość na odrywanie ≥ 160 N/25 mm).</p>


  <h2>Niestandardowe rozwiązania spawalnicze dla wyjątkowych wymagań</h2>

  <p>Rozumiemy, że jedna specyfikacja spawania nie pasuje do każdego zastosowania. Nasze centrum spawania RF regularnie opracowuje niestandardowe konfiguracje spoin dla klientów o szczególnych wymaganiach:</p>

  <ul>
    <li><strong>Wielowarstwowe łatki wzmacniające</strong> — w obszarach o wysokim zużyciu, takich jak płozy ochronne i stożki dziobowe, opracowujemy wieloprzebiegowe zgrzewy RF, które integrują odporną na zużycie warstwę zewnętrzną bez uszczerbku dla elastyczności.</li>
    <li><strong>Spoiny przewodzące lub nieprzepuszczalne dla RF</strong> — w przypadku jednostek wojskowych lub obserwacyjnych wymagających ekranowania elektromagnetycznego, zgrzewamy warstwy siatki przewodzącej w układzie spoiny.</li>
    <li><strong>Zgrzewanie paneli zmieniających kolor</strong> — dwukolorowe panele tkaniny (np. pomarańczowy kadłub + szary pokład) zgrzewane z ukrytym zakładem, aby zachować estetykę marki bez widocznej linii łączenia.</li>
  </ul>


  <h2>Nasze zobowiązanie wobec Państwa</h2>

  <p>Każda dostarczana przez nas łódź objęta jest naszą gwarancją jakości spoin: jeśli jakakolwiek spoina ulegnie uszkodzeniu podczas normalnej eksploatacji w okresie gwarancyjnym, naprawiamy lub wymieniamy daną komorę bezpłatnie, a także przeprowadzamy analizę przyczyn źródłowych, aby zapobiec
  ponownemu wystąpieniu problemu. To nie jest po prostu gwarancja — to zobowiązanie do ciągłego doskonalenia opartego na danych z rzeczywistej eksploatacji.</p>

  <p>Wybierając {SITE.name}, wybierają Państwo spoiny, które są zaprojektowane, przetestowane i udokumentowane — a nie tylko zgrzane. Taka jest różnica między łodzią, która unosi się na wodzie, a łodzią, która działa.</p>

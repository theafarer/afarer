hero:
  tagline: Bezpieczeństwo
  title: Standardy bezpieczeństwa i certyfikacja
  subtitle: Każdy produkt afarer przechodzi rygorystyczne testy i spełnia międzynarodowe standardy bezpieczeństwa dla użytku rekreacyjnego i profesjonalnego.
certifications:
  - title: Certyfikacja CE
    description: Cały sprzęt bezpieczeństwa afarer spełnia wymogi oznakowania CE zgodnie z Europejskim Rozporządzeniem w sprawie Środków Ochrony Indywidualnej (UE) 2016/425.
  - title: Certyfikacja ISO 12402
    description: Kamizelki ratunkowe spełniają normy wyporności . Life Vest Classic zapewnia wyporność 50N+; Life Vest Pro spełnia wymogi SOLAS z automatycznym nadmuchiwaniem.
  - title: Zgodność z SOLAS
    description: Life Vest Pro jest zgodny z przepisami SOLAS (Bezpieczeństwo życia na morzu) dla operacji morskich offshore i komercyjnych.

faqs:
  title: 'Program Dystrybutorów — FAQ'
  subtitle: 'Wszystko, o co pytają dystrybutorzy przed złożeniem wniosku.'
  items:
    - title: 'Co oznacza jeden kraj, jeden dystrybutor?'
      description: 'Afarer przyznaje jednemu autoryzowanemu dystrybutorowi wyłączne prawa do kraju lub regionu. Posiadasz swój rynek — bez importu równoległego, bez wewnętrznej konkurencji.'
    - title: 'Jakie jest minimalne pierwsze zamówienie?'
      description: 'Dystrybutorzy krajowi i regionalni startują od 100–300 sztuk. Autoryzowani dealerzy od 30–50 sztuk. Zamówienia próbne od 10–30 sztuk pozwalają najpierw zweryfikować rynek (bez ochrony terytorialnej).'
    - title: 'Jakie wsparcie otrzymują dystrybutorzy?'
      description: 'Program Sukcesu Dystrybutora obejmuje wdrożenie, planowanie wejścia na rynek, szkolenia produktowe i sprzedażowe, wsparcie floty demo, zlokalizowane materiały marketingowe i dedykowanego opiekuna konta.'
    - title: 'Jak Afarer chroni mnie przed konfliktami kanałowymi?'
      description: 'Każde terytorium ma dokładnie jednego autoryzowanego dystrybutora. Bezpośrednie zamówienia z Twojego regionu przechodzą przez Ciebie, a ceny chronią Twoją marżę.'
    - title: 'Jakie są warunki dostawy i płatności?'
      description: 'Zamówienia wysyłane są FOB Qingdao z pełną dokumentacją eksportową. Zamówienia produkcyjne: 30% zaliczki i 70% przed dostawą; zamówienia próbne i próbek płatne z góry.'
    - title: 'Jak złożyć wniosek?'
      description: 'Prześlij wniosek przez formularz kontaktowy. Oceniamy dopasowanie rynkowe, obecność handlową i możliwości logistyczne, a następnie odpowiadamy w ciągu 3 dni roboczych z kolejnymi krokami i wzorem Umowy Dystrybucyjnej.'

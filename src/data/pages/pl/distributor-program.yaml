faqs:
  title: 'Partnerstwo Krajowe — FAQ'
  subtitle: 'Pytania, które zadają poważni partnerzy krajowi przed złożeniem wniosku.'
  items:
    - title: 'Co naprawdę oznacza jeden kraj, jeden dystrybutor?'
      description: 'Afarer wyznacza jednego autoryzowanego dystrybutora z wyłącznymi prawami na określonym terytorium. Nie sprzedajemy z naszych globalnych ani regionalnych kanałów do chronionego kraju. Twoje prawo do terytorium obowiązuje tak długo, jak długo spełnione są warunki Distribution Agreement.'
    - title: 'Czy terytorium jest ekskluzywne na zawsze?'
      description: 'Nie. Ekskluzywność jest warunkowa, a nie wieczysta. Jest utrzymywana dzięki podpisanemu Distribution Agreement, realizacji pierwszego zamówienia, rocznym celom zakupowym, lokalnym zapasom, zdolności serwisowej i ciągłym inwestycjom w rynek. Jeśli te warunki nie są spełnione, terytorium może zostać ponownie wynegocjowane lub przydzielone.'
    - title: 'Jakie jest minimalne pierwsze zamówienie?'
      description: 'Dystrybutorzy krajowi i regionalni startują od 100–300 sztuk; autoryzowani dealerzy od 30–50 sztuk; zamówienia próbne od 10–30 sztuk pozwalają najpierw zweryfikować rynek (zamówienia próbne i próbek nie mają ochrony terytorialnej). Programy Custom i private-label mają osobne MOQ wymienione w powyższych poziomach.'
    - title: 'Jakie wsparcie obejmuje 10-modułowy program wsparcia?'
      description: 'Poziomy i kwalifikacja, ochrona terytorialna, MOQ / ceny / roczne rabaty, zarządzanie zapasami i realizacja zamówień, materiały marketingowe i wspólne fundusze rynkowe, szkolenia produktowe / sprzedażowe / techniczne, części zamienne i serwis posprzedażowy, rejestracja gwarancji, portal partnerów oraz karty produktów, biblioteka materiałów marketingowych, harmonogram rocznych rabatów oraz listy przewozowe i pakowania.'
    - title: 'Jak Afarer chroni mnie przed konfliktami kanałowymi?'
      description: 'Każde terytorium ma dokładnie jednego autoryzowanego dystrybutora. Zapytania i bezpośrednie zamówienia z Twojego regionu przechodzą przez Ciebie, formularze ze strony są przekierowywane do lokalnego partnera, jeśli taki istnieje, a zespół globalny interweniuje tylko wtedy, gdy partner nie odpowiada.'
    - title: 'Jakie są warunki dostawy i płatności?'
      description: 'Zamówienia wysyłane są FOB Qingdao z pełną dokumentacją eksportową. Zamówienia produkcyjne wymagają 30% zaliczki i 70% przed wysyłką; zamówienia próbne i próbek są płatne z góry. Standardowy czas realizacji to 30–45 dni roboczych, a dla serii próbnych 15–20 dni roboczych.'
    - title: 'Jak złożyć wniosek?'
      description: 'Wyślij wniosek przez formularz kontaktowy wraz ze szczegółami rynku. Oceniamy dopasowanie rynkowe, obecność handlową i możliwości logistyczne, a następnie odpowiadamy w ciągu 3 dni roboczych z kolejnymi krokami i przykładowym Distribution Agreement.'

meta:
  title: 'Partnerzy — dystrybucja i hurt | {SITE}'
  description: 'Zostań partnerem afarera: sieci dystrybucyjne, ceny hurtowe, programy OEM/private label i wsparcie dla firm paddleboardowych na całym świecie.'
  keywords:
    - 'partner dystrybucyjny SUP'
    - 'paddle board hurtowo'
    - 'dystrybutor nadmuchiwanych SUP'
    - 'partnerstwo SUP'
hero:
  tagline: Partnerzy i dystrybucja
  title: Zostań partnerem afarer<br />— globalna sieć dystrybucji
  subtitle: Dołącz do globalnej sieci partnerów afarera. Współpracujemy z dystrybutorami morskim, dealerami łodzi, detalistami sprzętu i partnerami marek w 50 krajach.
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: globalna sieć partnerów i dystrybutorów afarer
content_programs:
  tagline: Programy partnerskie
  title: Programy partnerskie<br />stworzone dla wzrostu
  subtitle: Niezależnie od tego, czy jesteś dystrybutorem, dealerem czy partnerem marki, afarer oferuje programy zaprojektowane, aby wspierać Twój biznes.
  columns: 3
  items:
    - title: Program dystrybutora
      description: Dystrybucja na wyłączność terytorialną z cenami hurtowymi, wsparciem marketingowym i bezpośrednim dostępem do fabryki. Minimalne zobowiązanie wymagane w zależności od wielkości terytorium.
      icon: tabler:world
    - title: Program dla dealerów
      description: Bezpośrednie ceny dealerskie, szkolenia produktowe, materiały marketingowe i wsparcie gwarancyjne dla punktów sprzedaży detalicznej i sklepów internetowych.
      icon: tabler:building-store
    - title: Partnerstwo OEM/ODM
      description: Produkcja OEM i ODM z pełnym zakresem usług, z niestandardowym brandingiem, opakowaniem i specyfikacjami produktu. Od koncepcji do kontenera.
      icon: tabler:certificate
    - title: Partnerstwo marki
      description: Co-branding, private label i ekskluzywne programy modelowe dla uznanych marek w sektorze morskim i rekreacji na świeżym powietrzu.
      icon: tabler:stars
    - title: Rządowy i instytucjonalny
      description: Programy preferowanych dostawców dla agencji rządowych, straży przybrzeżnej, wojska i organizacji humanitarnych. Dokumentacja gotowa do przetargów.
      icon: tabler:building-community
    - title: Resort i Partner Wynajmu
      description: Ceny flotowe, stała jakość i niestandardowy branding dla ośrodków wypoczynkowych, centrów nurkowych i wypożyczalni na całym świecie.
      icon: tabler:sun
content_benefits:
  tagline: Dlaczego współpracować z nami
  title: Dlaczego partnerzy wybierają afarer
  subtitle: Nasi partnerzy korzystają z rzeczywistych zdolności produkcyjnych, stałej jakości i szybkiego wsparcia.
  list:
    - 'Bezpośredni dostęp do fabryki: Współpracuj bezpośrednio z naszym zespołem produkcyjnym — bez pośredników. Otrzymuj szybsze odpowiedzi, lepsze ceny i pełną kontrolę nad produkcją.'
    - 'Gotowe do personalizacji: Oznacz swoje produkty własnymi kolorami, logo, opakowaniami i specyfikacjami. Minimalne ilości zamówienia dostosowane do Twojego rynku.'
    - 'Gwarancja jakości: produkcja certyfikowana ISO 9001 zgodna z normami CE, UKCA i BSCI. Każdy produkt testowany przed wysyłką.'
    - 'Globalna logistyka: Wysyłka z Qingdao w Chinach z opcjami FOB, CIF i DDP. Magazyn w USA w Montclair w Kalifornii do dystrybucji w Ameryce Północnej.'
    - 'Wsparcie marketingowe: katalogi produktów, fotografia, dokumentacja techniczna oraz zasoby cyfrowe wspierające Twoje działania sprzedażowe.'
    - 'Szkolenie i wsparcie: Szkolenie produktowe dla Twojego zespołu sprzedaży, wsparcie techniczne dla Twoich klientów oraz koordynacja serwisu gwarancyjnego.'
content_process:
  tagline: Jak zostać partnerem
  title: Prosty proces partnerski
  subtitle: Nasz proces partnerski jest prosty — zaprojektowany, aby szybko zacząć sprzedawać produkty afarer.
  items:
    - title: 'Krok 1: Złóż wniosek'
      description: Wypełnij nasz formularz zgłoszeniowy partnera, podając profil firmy, rynek docelowy i zainteresowania produktowe.
    - title: 'Krok 2: Przegląd kwalifikacji'
      description: Nasz zespół ds. partnerstw analizuje Twoje zgłoszenie i kontaktuje się z Tobą w ciągu 3 dni roboczych, aby omówić możliwości.
    - title: 'Krok 3: Umowa i konfiguracja'
      description: Podpisz umowę partnerską, skonfiguruj konto i otrzymaj ceny partnerskie, materiały marketingowe i próbki produktów.
    - title: 'Krok 4: Szkolenie i uruchomienie'
      description: Szkolenie produktowe, wsparcie sprzedaży i materiały marketingowe zapewnione. Jesteś gotowy, aby rozpocząć sprzedaż.
cta:
  title: Gotowy, aby zostać partnerem afarer?
  subtitle: Złóż wniosek o partnerstwo, a nasz zespół odpowie w ciągu 3 dni roboczych.
  actions:
    - variant: primary
      text: Złóż wniosek o partnerstwo
      href: /contact
    - text: Zobacz nasze produkty
      href: /products

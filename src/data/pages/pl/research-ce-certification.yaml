hero:
  tagline: Zgodność
  title: Jak działa certyfikacja CE dla nadmuchiwanych jednostek pływających
  subtitle: 7 minut czytania
content_html: |-
  <h2>Czym jest certyfikacja CE?</h2>
  <p>Oznaczenie CE (Conformit&eacute; Europ&eacute;enne) wskazuje, że produkt spełnia wymagania UE w zakresie zdrowia, bezpieczeństwa i ochrony środowiska. W przypadku nadmuchiwanych jednostek pływających odpowiednie ramy regulacyjne zależą od kategorii produktu.</p>

  <h2>Obowiązujące dyrektywy</h2>

  <h3>Dyrektywa w sprawie rekreacyjnych jednostek pływających (2013/53/EU)</h3>
  <p>Jest to podstawowa dyrektywa dla większości nadmuchiwanych łodzi, SUP-ów i kajaków. Dotyczy rekreacyjnych jednostek pływających o długości kadłuba od 2,5 m do 24 m, łodzi częściowo wykończonych (dostawy OEM) oraz skuterów wodnych.</p>

  <h3>Rozporządzenie w sprawie środków ochrony indywidualnej (2016/425)</h3>
  <p>Kamizelki ratunkowe, środki wypornościowe i sprzęt bezpieczeństwa dostarczany z jednostkami pływającymi muszą spełniać wymagania rozporządzenia o środkach ochrony indywidualnej (PPE), w tym badanie typu (Moduł B) przez jednostkę notyfikowaną oraz kontrolę jakości produkcji (Moduł D lub E).</p>

  <h2>Proces certyfikacji</h2>
  <ol>
    <li>Klasyfikacja produktu: określenie kategorii projektowej jednostki (A – D wg ISO 8666)</li>
    <li>Obowiązujące normy: EN ISO 6185 (części 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (tabliczka producenta)</li>
    <li>Przygotowanie dokumentacji technicznej: rysunki projektowe, specyfikacja materiałowa, certyfikaty materiałów, ocena ryzyka</li>
    <li>Badania typu: wyporność, stateczność, nośność, badania materiałów, wytrzymałość szwów, szczelność powietrzna</li>
    <li>Kontrola produkcji w fabryce: audyt procesów produkcyjnych przez jednostkę notyfikowaną</li>
    <li>Deklaracja zgodności: producent podpisuje deklarację DoC i nanosi oznaczenie CE</li>
  </ol>

  <h2>Jednostki notyfikowane dla nadmuchiwanych jednostek pływających</h2>
  <p>Do typowych jednostek notyfikowanych (NB) należą Bureau Veritas (Francja), DNV GL (Niemcy), RINA (Włochy), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Niemcy).</p>

  <h2>Harmonogram i koszty</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Etap</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Czas trwania</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Typowy koszt (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Przygotowanie dokumentacji technicznej</td><td class="p-3 border">2 – 4 tygodnie</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Badania typu</td><td class="p-3 border">4 – 8 tygodni</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Audyt fabryki</td><td class="p-3 border">1 – 2 dni (na miejscu)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Razem (pierwszy produkt)</td><td class="p-3 border">8 – 14 tygodni</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Co to oznacza dla kupujących</h2>
  <p>Kupując nadmuchiwane łodzie z certyfikatem CE, zawsze sprawdzaj, czy oznaczenie CE znajduje się na tabliczce producenta, czy istnieje ważna deklaracja zgodności (DoC), czy podano numer jednostki notyfikowanej oraz czy instrukcja obsługi zawiera instrukcje bezpieczeństwa w Twoim języku. Wszystkie produkty Afarer posiadają certyfikację CE z pełną identyfikowalnością do raportów z audytów jednostek notyfikowanych.</p>

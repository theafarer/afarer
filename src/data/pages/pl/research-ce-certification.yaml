hero:
  tagline: Zgodność
  title: Jak działa certyfikacja CE dla nadmuchiwanych jednostek pływających
  subtitle: 7 minut czytania
content_html: >
  <h2>Czym jest certyfikacja CE?</h2>

  <p>Oznaczenie CE (Conformité Européenne) oznacza, że produkt spełnia wymagania zdrowotne, bezpieczeństwa i środowiska UE. W przypadku nadmuchiwanych jednostek wodnych odpowiednie ramy regulacyjne zależą od kategorii produktu.</p>


  <h2>Obowiązujące dyrektywy</h2>


  <h3>Dyrektywa o jednostkach rekreacyjnych (2013/53/UE)</h3>

  <p>Główna dyrektywa dla większości nadmuchiwanych łodzi, SUP-ów i kajaków. Dotyczy to jednostek rekreacyjnych o długości kadłuba od 2,5 m do 24 m, częściowo ukończonych łodzi (do dostaw OEM) oraz jednostek</p> wodnych dla osób prywatnych.


  <h3>Regulacja dotycząca środków ochrony osobistej (2016/425)</h3>

  <p>Kamizelki ratunkowe, środki wyporności oraz sprzęt bezpieczeństwa dostarczany do jednostek pływających muszą spełniać wymagania dotyczące przepisów PPE, w tym egzaminy typu (Moduł B) przez powiadomioną jednostkę oraz zapewnienie jakości produkcji (Moduł D lub E).</p>


  <h2>Proces certyfikacji</h2>

  <ol>
    <li>Klasyfikacja produktu: Określenie kategorii projektu rzemieślniczego (A – D zgodnie z ISO 8666)</li>
    <li>Obowiązujące normy: EN ISO 6185 (Części 1–4), EN ISO 10087 (HIN), EN ISO 14945 (tablica budowlana)</li>
    <li>Przygotowanie dokumentacji technicznej: rysunki projektowe, wykaz materiałów, certyfikaty materiałowe, ocena ryzyka</li>
    <li>Testy typowe: wyporność, stabilność, nośność, testowanie materiałów, wytrzymałość szczelin, zatrzymywanie powietrza</li>
    <li>Kontrola produkcji w fabrykach: Notyfikowany audyt procesów produkcyjnych</li>
    <li>Deklaracja zgodności: Producent podpisuje DoC, dodaje oznaczenie CE</li>
  </ol>


  <h2>Oficjalne Organy ds. Nadmuchiwanych Jednostek</h2> Pływających

  <p>Typowe NB to Bureau Veritas (Francja), DNV GL (Niemcy), RINA (Włochy), TÜV Rheinland / TÜV SÜD (Niemcy).</p>


  <h2>Harmonogram i koszty</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <TR Class="BG-Gray-100">
        <klasa="p-3 tekst-left font-semibold text-gray-900 border">Faza</th>
        <klasa="p-3 czcionka po lewej stronie tekstu-półpogrubiona ramka tekst-szara-900">Czas trwania</th>
        <klasa="p-3 czcionka po lewej stronie tekstu-półpogrubiona obramowanie tekst-szary-900">Typowy koszt (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Technical file preparation</td><td class="p-3 border">2 – 4 tygodnie</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Testy typu</td><td class="p-3 border">4 – 8 tygodni</td><td class="p-3 border">8 000 – 20 000</td></tr>
      <tr><td class="p-3 border">audyt fabryczny</td><td class="p-3 border">1 – 2 dni (na miejscu)</td><td class="p-3 border">3 000 – 6 000</td></tr>
      <tr><td class="p-3 border">Łączna (pierwszy produkt)</td><td class="p-3 border">8 – 14 tygodni</td><td class="p-3 border">13 000 – 31 000</td></tr>
    </tbody>
  </table>


  <h2>Co to oznacza dla kupujących</h2>

  <p>Kupując nadmuchiwane łodzie certyfikowane CE, zawsze upewnij się, że oznaczenie CE jest na tablicy budowniczego, że istnieje ważny DoC, że jest podaty numer Notified Body, a instrukcja obsługi zawiera instrukcje bezpieczeństwa w lokalnym języku. Wszystkie produkty Afarer posiadają certyfikat CE
  z pełną możliwością śledzenia w raportach audytowych organów notyfikowanych.</p>

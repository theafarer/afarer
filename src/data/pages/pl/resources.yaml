meta:
  title: Zasoby i pobieranie materiałów B2B | {SITE}
  description: Pobierz przewodniki produkcji OEM, katalogi produktów, raporty jakości oraz kalkulatory ROI dla firm zajmujących się nadmuchiwanymi SUP.
hero:
  tagline: Centrum Zasobów
  title: Narzędzia i zasoby<br />Dla partnerów biznesowych SUP
  subtitle: Pobierz przewodniki OEM, katalogi produktów, raporty jakości i skorzystaj z naszego kalkulatora ROI, aby zaplanować inwestycję w flotę SUP.
resources:
  - title: Katalog produktów OEM/ODM 2026
    description: Pełna oferta produktów wraz ze specyfikacjami, przedziałami cenowymi, minimalną ilością zamówienia (MOQ) oraz opcjami dostosowania dla partnerów B2B.
    icon: tabler:file-text
    type: catalog
    link: /media
    cta: Pobierz katalog
  - title: Przewodnik marki SUP z etykietą prywatną
    description: Przewodnik krok po kroku, jak uruchomić własną markę SUP — od badań rynku i projektowania po produkcję i dostawę na całym świecie.
    icon: tabler:book
    type: guide
    link: /news/private-label-sup-oem-guide
    cta: Przeczytaj przewodnik
  - title: Kalkulator zwrotu z inwestycji floty SUP
    description: Oszacuj inwestycję w flotę SUP w swoim kurorcie lub klubie, prognozowane przychody i okres zwrotu za pomocą naszego interaktywnego kalkulatora.
    icon: tabler:calculator
    type: tool
    link: '#roi-calculator'
    cta: Oblicz ROI
  - title: Raport Jakości i Certyfikacji
    description: Dokumenty certyfikacji CE, system zarządzania jakością ISO 9001, wyniki testów starzenia UV oraz dane z testu utrzymywania ciśnienia.
    icon: tabler:certificate
    type: report
    link: /evidence
    cta: Wyświetl raporty
  - title: Broszura o możliwościach fabryki
    description: Wirtualna wycieczka po naszym zakładzie produkcyjnym o powierzchni 12 000 m² z detalami linii produkcyjnej i procesami kontroli jakości.
    icon: tabler:building-factory
    type: brochure
    link: /factory
    cta: Fabryka Wycieczek
  - title: Przewodnik po przychodach floty kurortu
    description: Analiza zwrotu z inwestycji floty komercyjnych SUP z modelami cenowymi, wskaźnikami wykorzystania i wynikami rzeczywistych studiów przypadków z resortów pięciogwiazdkowych.
    icon: tabler:chart-bar
    type: guide
    link: /news/commercial-sup-fleet-roi-resorts
    cta: Przeczytaj przewodnik

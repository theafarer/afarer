  items:
    - title: Lomakohteet ja hotellit
      description: Täydelliset SUP-laivasto-ohjelmat majoitusyrityksille – kestävät laudat, mukautettu brändäys ja henkilökunnan koulutustuki.
      icon: tabler:building
      link: /solutions/resorts-hotels

      link: /solutions/retail-partners
    - title: Jakelijat
      description: Yksinoikeudelliset alueet, kattava tuotevalikoima ja omistautunut asiakkuudenhoito. Liity globaaliin jakeluverkostoomme 50+ maassa.
      icon: tabler:world
      link: /solutions/distributors
    - title: Rakenna oma brändisi
      description: End-to-end OEM/ODM SUP-valmistus — suunnittelu, prototyypit, massatuotanto ja logistiikka. Käynnistä merkkisi Afarerin kera.
      icon: tabler:package
      link: /solutions/build-your-own-brand

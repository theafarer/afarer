meta:
  title: 'Yhteystiedot — OEM-tarjoukset ja SUP-valmistaja | {SITE}'
  description: 'Ota yhteyttä afareriin OEM/ODM-tarjouksia, omien merkkien projekteja tai ammattikalustoja varten. Täytettävien SUP-lautojen ja veneiden valmistaja, vastaamme 2 arkipäivässä.'
  keywords:
    - 'ota yhteyttä afareriin'
    - 'OEM paddle board -tarjous'
    - 'ammattimainen SUP-toimittaja'
    - 'ota yhteyttä SUP-valmistajaan'
hero_text:
  tagline: Yhteystiedot
  title: OTA YHTEYTTÄ
contact_form:
  id: form
  title: Lähetä meille viesti
  subtitle: Tarjouksia, teknisiä kysymyksiä tai kumppanuustiedusteluja varten, lähetä meille viesti. Vastaamme yhden arkipäivän kuluessa.
  email_to: info@afarer.com
  submit_button: Lähetä tiedustelu →Pyydä tarjous
  success_message: Kiitos! Viestisi on saapunut postilaatikkoomme. Vastaamme yhden arkipäivän kuluessa.
  error_message: Viestisi lähettämisessä tapahtui virhe. Yritä uudelleen tai lähetä sähköpostia suoraan.
  default_country_code: '+1'
  captcha:
    label: 'Roskapostinsuojaus: ratkaise seuraava'
  fields:
    - name: firstName
      label: Etunimi
      row: 1
      type: select
      optionsKey: maata
      step: 1
    - name: lastName
      label: Sukunimi
      row: 1
      type: select
      options:
        - value: ''
          label: Valitse arvioitu tilavuus…
        - value: näyte
          label: Vain näytteet / prototyypit
        - value: 5–10
          label: 5–10 kappaleta (standardi MOQ)
        - value: 100-500
          label: 100–500 kappaletta
        - value: 500-plus
          label: 500+ kpl (määräalennus)
      step: 1
    - name: companyName
      label: Yrityksen nimi
      row: 2
      type: select
      options:
        - value: ''
          label: Valitse mukautustyyppi...
        - value: Ei yhtään
          label: Vakiotuote (ei räätälöintiä)
        - value: logo
          label: Vain mukautettu logo / brändäys
        - value: Täysi
          label: Täysi OEM (koko, väri, grafiikka, pakkaus)
        - value: konsultaatio
          label: En ole varma — tarvitsen konsultaatiota
      step: 1
    - name: address
      label: Osoite
      row: 3
      type: select
      options:
        - value: ''
          label: Valitse tuoteryhmä...
        - value: kaikki
          label: Kaikki tuotteet / koko luettelo
        - value: sup
          label: SUP-laudat / Soutulaudat
        - value: turvallisuus
          label: Turvalaitteet / pelastusliivit
        - value: lisävaruste
          label: Lisävarusteet (pumput, aomat, laukut)
      step: 1
    - name: zip
      label: Postinumero
      row: 4
      step: 2
    - name: country
      label: Maa
      row: 4
      step: 2
    - name: email
      label: Sähköposti
      row: 5
      step: 2
    - name: tel
      label: Puhelin
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Arvioitu tilausmäärä
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Tarvitaanko räätälöintiä?
      row: 7
      step: 2
    - name: productInterest
      label: Kiinnostavat tuoteryhmät
      row: 8
      step: 2
    - name: subject
      label: Aihe
      row: 9
      step: 3
    - name: message
      label: Viesti
      row: 10
      type: textarea
      rows: 6
      step: 3

hero_text:
  tagline: Yhteystiedot
  title: OTA YHTEYTTÄ
contact_form:
  id: form
  title: Lähetä meille viesti
  subtitle: Tarjouksia, teknisiä kysymyksiä tai kumppanuustiedusteluja varten, lähetä meille viesti. Vastaamme yhden arkipäivän kuluessa.
  email_to: info@afarer.com
  submit_button: Lähetä tiedustelu →Pyydä tarjous
  success_message: Kiitos! Viestisi on saapunut postilaatikkoomme. Vastaamme yhden arkipäivän kuluessa.
  error_message: Viestisi lähettämisessä tapahtui virhe. Yritä uudelleen tai lähetä sähköpostia suoraan.
  default_country_code: '+1'
  captcha:
    label: 'Roskapostinsuojaus: ratkaise seuraava'
  fields:
    - name: firstName
      label: Etunimi
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Sukunimi
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Yrityksen nimi
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Osoite
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Postinumero
      row: 4
      step: 2
    - name: country
      label: Maa
      row: 4
      step: 2
    - name: email
      label: Sähköposti
      row: 5
      step: 2
    - name: tel
      label: Puhelin
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Arvioitu tilausmäärä
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Tarvitaanko räätälöintiä?
      row: 7
      step: 2
    - name: productInterest
      label: Kiinnostavat tuoteryhmät
      row: 8
      step: 2
    - name: subject
      label: Aihe
      row: 9
      step: 3
    - name: message
      label: Viesti
      row: 10
      type: textarea
      rows: 6
      step: 3

meta:
  title: 'Yhteystiedot — Kumppanuus & tuotetiedustelut | {SITE}'
  description: 'Ota yhteyttä afareriin kumppanuus-, co-brand- ja private label -tiedusteluja varten tai ammattikalustoja varten. Täytettävien SUP-lautojen ja veneiden brändi, vastaamme 2 arkipäivässä.'
  keywords:
    - 'ota yhteyttä afareriin'
    - 'sup-jakelija tarjous'
    - 'ammattimainen SUP-toimittaja'
    - 'ota yhteyttä SUP-valmistajaan'
hero_text:
  tagline: Yhteystiedot
  title: OTA YHTEYTTÄ
contact_form:
  id: form
  title: Lähetä meille viesti
  subtitle: Tarjouksia, teknisiä kysymyksiä tai kumppanuustiedusteluja varten, lähetä meille viesti. Vastaamme yhden arkipäivän kuluessa.
  email_to: info@afarer.com
  submit_button: Lähetä tiedustelu → Pyydä tarjous
  success_message: Kiitos! Viestisi on saapunut postilaatikkoomme. Vastaamme yhden arkipäivän kuluessa.
  error_message: Viestisi lähettämisessä tapahtui virhe. Yritä uudelleen tai lähetä sähköpostia suoraan.
  default_country_code: '+1'
  captcha:
    label: 'Roskapostinsuojaus: ratkaise seuraava'
  fields:
    - name: country
      label: Maa
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: Arvioitu tilausmäärä
      row: 2
      type: select
      options:
        - value: ''
          label: Valitse arvioitu tilausmäärä...
        - value: sample
          label: Vain näytteet / prototyypit
        - value: '5-10'
          label: 5–10 kappaletta (standardi MOQ)
        - value: '100-500'
          label: 100–500 kappaletta
        - value: '500-plus'
          label: 500+ kpl (määräalennus)
      step: 1
    - name: customization
      label: Tarvitaanko räätälöintiä?
      row: 3
      type: select
      options:
        - value: ''
          label: Valitse mukautustyyppi...
        - value: none
          label: Vakiotuote (ei räätälöintiä)
        - value: logo
          label: Vain mukautettu logo / brändäys
        - value: full
          label: Täysi co-brand (koko, väri, grafiikka, pakkaus)
        - value: consultation
          label: En ole varma — tarvitsen konsultaatiota
      step: 1
    - name: productInterest
      label: Kiinnostavat tuoteryhmät
      row: 4
      type: select
      options:
        - value: ''
          label: Valitse tuoteryhmä...
        - value: all
          label: Kaikki tuotteet / koko luettelo
        - value: sup
          label: SUP-laudat / Soutulaudat
        - value: safety
          label: Turvalaitteet / pelastusliivit
        - value: accessory
          label: Lisävarusteet (pumput, melat, laukut)
      step: 1
    - name: firstName
      label: Etunimi
      row: 1
      step: 2
    - name: lastName
      label: Sukunimi
      row: 1
      step: 2
    - name: companyName
      label: Yrityksen nimi
      row: 2
      step: 2
    - name: email
      label: Sähköposti
      row: 3
      type: email
      step: 2
    - name: tel
      label: Puhelin
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: Osoite
      row: 4
      step: 2
    - name: zip
      label: Postinumero
      row: 5
      step: 2
    - name: subject
      label: Aihe
      row: 1
      step: 3
    - name: message
      label: Viesti
      row: 2
      type: textarea
      rows: 6
      step: 3

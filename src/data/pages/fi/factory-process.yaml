hero:
  tagline: Prosessi
  title: Tuotantoprosessi
  subtitle: Raaka-aineesta vesikelpoiseksi laudaksi — jokainen vaihe hallinnassamme
  back_label: Takaisin tehtaalle
  back_link: /factory/
intro: >-
  Toisin kuin brändit, jotka ulkoistavat tuotannon kolmannen osapuolen tehtaille, afarer omistaa ja operoi koko tuotantoketjunsa. Tämä vertikaalinen integraatio mahdollistaa tiukan laadunvalvonnan jokaisessa vaiheessa, nopean reagoinnin räätälöityihin vaatimuksiin ja tasaisen tuotelaadun erästä
  toiseen. Näin lauta rakennetaan laitoksessamme.
steps:
  - step: '01'
    title: Materiaalien vastaanotto ja tarkastus
    description: Jokainen saapuva PVC-kangaserä, lasikuitumatto, hartsi ja laitteisto tarkastetaan määrittelyjen mukaisesti. Kangasnäytteet testataan vetolujuuden, paksuuden tasaisuuden ja UV-kestävyyden osalta ennen tuotantoon luovutusta. Poikkeavat materiaalit asetetaan karanteeniin ja palautetaan.
    duration: 1–2 päivää
  - step: '02'
    title: Automaattinen PVC-leikkaus
    description: >-
      Hyväksytyt kankaat asetetaan automaattiselle CNC-leikkauskoneelle ja leikataan alle millimetrin tarkkuudella. Tietokoneoptimoitu sijoittelu järjestää paneelit hukan minimoimiseksi — tyypillisesti alle 5 %. Leikatut paneelit merkitään lautamallin ja kammion mukaan, niputetaan ja siirretään
      hitsauspajaan.
    duration: 2–4 tuntia per lautasarja
  - step: '03'
    title: Putkien kuumasaumaus ja hitsaus
    description: >-
      Paneelit harsitaan ja liitetään kuumasaumauskoneilla  kuumailmahitsauksella säädetyissä lämpötiloissa 200–300 °C. Pääsaumat vahvistetaan RF-dielektrisellä hitsauksella ilmatiiviitä, lujia liitoksia varten. Valmiit kammiot täytetään 1,5-kertaiseen käyttöpaineeseen 30 minuutin ilmanpysyvyyden
      varmistusta varten.
    duration: 1–2 päivää per lauta
  - step: '04'
    title: SUP-painatus ja koristelu
    description: SUP-lautojen kansigrafiikat levitetään digitaalipainatuksella täysvärisiin valokuvanlaatuisiin kuvioihin ja silkkipainatuksella kestäviin logoihin ja toistuviin kuvioihin. Tulosteet kovetetaan ja suljetaan UV- ja kulutuskestävyyttä varten.
    duration: 1–2 päivää
  - step: '05'
    title: Loppukokoonpano ja varustelu
    description: >-
      Laudat varustellaan kokoonpanolinjalla evillä, venttiileillä, EVA-kansilla ja lisävarusteilla. Jokainen yksikkö noudattaa 100-pisteistä kokoonpanotarkistuslistaa, jossa on pakollinen hyväksyntä jokaisessa vaiheessa.
    duration: 2–4 päivää
  - step: '06'
    title: Laaduntestaus ja tarkastus
    description: >-
      Jokainen valmis lauta käy läpi pakollisen laadunportin: kammioiden ilmanpysyvyystesti, laitteiden toimintatarkastus, kiinnittimien vääntömomentin varmistus ja kosmeettinen tarkastus. Räätälöidyt ja prototyyppirakennukset saavat myös vesillä tehtäviä kokeita, jotka kattavat vakauden ja
      käsiteltävyyden.
    duration: 1–2 päivää
  - step: '07'
    title: Pakkaus ja lähetys
    description: >-
      Laudat tyhjennetään, taitellaan ohjeiden mukaisesti, pakataan raskaisiin kudottuihin pusseihin tai vanerilaatikoihin ja lastataan lähetystä varten. Jokainen pakkaus merkitään mallilla, sarjanumerolla ja määränpäällä. Koordinoimme rahdinkuljettajien kanssa FCL- ja LCL-konttilähetyksiä
      maailmanlaajuisesti.
    duration: 1 päivä

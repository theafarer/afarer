intro: >-
  Yleinen väärinkäsitys on, että hydrodynaaminen testaus kuuluu vain valtamerilaivoille. Todellisuudessa pienen liukuvarunkoisen veneen — kuten 4–6 m RIB:n — suorituskyky riippuu vedenalaisesta muodosta yhtä paljon kuin tankkerin suorituskyky riippuu sen sipulikeulasta. Trim-kulma, märkäpinta-ala,
  roiskeiden syntyminen ja ilmanotto vaikuttavat dramaattisesti nopeuteen, polttoaineenkulutukseen ja ajomukavuuteen. {SITE.name}:llä on käytössään erillinen hydrodynaaminen testausallas, jonka avulla voimme mitata nämä vaikutukset mallimittakaavassa — ennen kuin sitoudumme metalliin ja kankaaseen
  täysikokoisessa prototyypissä.
content_html: >
  <h2>Miksi tank-testata pieni vene?</h2>

  <p>Testing at model scale (typically 1:3 to 1:5) gives us the ability to iterate hull shapes rapidly and cost-effectively. A week in the tank can generate the same performance data that would require months of full-scale trial-and-error — and at a fraction of the cost.</p>


  <h2>Tilojen eritelmät</h2>

  <table>
    <thead><tr><th>Parametri</th><th>Eritelmä</th></tr></thead>
    <tbody>
      <tr><td>Alton koko</td><td>35 m (P) × 3,5 m (L) × 1,8 m (K)</td></tr>
      <tr><td>Vetokärry</td><td>Sähköisesti ohjattu, huippunopeus 12 m/s (23 kn), nopeuden tarkkuus ± 0,5 %</td></tr>
      <tr><td>Aaltojen generaattori</td><td>Lapatu tyyppi, ohjelmoitavat säännölliset &amp; epäsäännölliset meritilat, Hs 0,3 m:een asti mallikokoon</td></tr>
      <tr><td>Mittauslaitteisto</td><td>6-komponenttinen dynamometri (vastus, sivuvaikutus, kallistumismomentti), kiihtyvyysanturit, inclinometerit, aaltoprobes</td></tr>
      <tr><td>Tietojen hankinta</td><td>Nauhoitus 1000 Hz kanavalta, reaaliaikainen näyttö + jälkikäsittelypaketti</td></tr>
      <tr><td>Mallin valmistus</td><td>Sisäinen CNC-millaus ja 3D-tulostus mallirunkoihin 1,8 m LOA:hen asti</td></tr>
    </tbody>
  </table>


  <h2>Testiohjelmamme</h2>

  <p>Tyyppinen runmokehitysohjelma altassamme noudattaa tätä sarjaa:</p>

  <ol>
    <li><strong>Model build</strong> — A 1:3.5 scale model is CNC-machined from high-density foam and glassed for rigidity. Weight and CG are adjusted to match Froude-scaled full-load condition.</li>
    <li><strong>Resistance runs</strong> — The model is towed at 8-10 speeds spanning the operating range. Total resistance is measured and decomposed into frictional and residuary components using the ITTC-1957 method.</li>
    <li><strong>Trim &amp; sinkage measurement</strong> — Running trim and sinkage are recorded at each speed. An optimal trim angle of 4-6° for planing hulls is the target.</li>
    <li><strong>Wake survey</strong> — Transverse wave cuts are measured at two speeds to assess wave-making resistance and identify transverse wave interactions that could cause stern interference.</li>
    <li><strong>Seakeeping (optional)</strong> — Head-sea and following-sea runs in regular waves to measure added resistance, vertical acceleration, and slamming probability.</li>
    <li><strong>Data analysis &amp; recommendations</strong> — A full report is delivered with comparative charts, speed/power curves, and specific design recommendations for the full-scale hull.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Typical Tank Test Results — Resistance vs Speed (RIB 450 hull, 1:3.5 scale)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Mallimittakaavan vastus (N) Froude-sketillä nopeuksien. Täysimittainen voimaennuste seuraa ITTC-1978 suorituskyky —ennustemetodia.</p>
  </div>


  <h2>Asiantuntijatiimi</h2>

  <p>Altamme käyttää hydrodynamiikan tutkija, jolla on tohtorin tutkinto laivojen arkkitehtuurissa ja 8 vuoden veturi-altaasta kokemusta suuressa eurooppalaisessa merentutkimuslaitoksessa. Häntä avustaa tekniikan ammattilainen, joka valmistaa kaikki mallit ja mittauslaitteistot. Tiimi noudattaa
  ITTC:n (International Towing Tank Conference) suositeltuja menettelyjä varmistaakseen, että jokainen testi on toistettavissa, jäljitettävissä ja kansainvälisesti puolustettavissa.</p>


  <h2>Alton testaus mukautettujen runkojen kehittämistä varten</h2>

  <p>Our tank is not only used for house-designed hulls — we regularly run test programmes for clients who want to validate a custom hull shape or investigate a performance issue:</p>

  <ul>
    <li><strong>Hull-form comparison</strong> — Two or more candidate hull shapes tested under identical conditions, providing an objective drag/speed/stability comparison to inform your design choice.</li>
    <li><strong>Appendage optimisation</strong> — Interceptor plates, spray rails, trim tabs, and strakes can be tested in various configurations to quantify their individual contribution to drag reduction.</li>
    <li><strong>Engine-matching study</strong> — Resistance data is converted to a power-prediction curve, allowing you to select the optimum engine horsepower for your target speed and payload.</li>
  </ul>


  <h2>Miksi testata kanssamme?</h2>

  <p>Emme vain anna sinulle joukon raaka lukuja. Raporttimme kääntävät alton tiedot toimivaksi insinöörisuositukseksi: "Nosta suihjuraita 8 mm:lla vähentääkseen märkäpintaa kulkunopeudessa", "Lisää kuolleennousu takaa perällä 3°:lla vähentääkseen lyöntikiihtyvyys", tai "Siirrä pituussuuntainen
  painopiste 150 mm taakse parantaaksesi lyöntiasennon". Lähdet selkeällä ymmärryksellä, mitä muuttaa ja miksi.</p>

  <p>Altamme on myös saatavilla riippumattomille kolmansille osapuolille testauksen maksullisena palveluna. Jos kehität rungon ja haluat puolueettoman, ammattimaisesti toteutetun hydrodynamiikan arvion, toivotamme kysymyksesi tervetulleeksi.</p>

timeline:
  - year: '2012'
    title: Venetuotannon Perusta
    body: afarer aloitti erikoistuneena kumivenepajana Qingdaossa, Kiinassa, keskittyen merenkulkualan käsityötaitoon ja kumiveneiden valmistukseen. Alkuvaiheen työ keskittyi luotettavien kumituotteiden rakentamiseen käytännön insinööritaidon ja tuotantokurin avulla.
  - year: '2015'
    title: Ensimmäinen Vienti & CE-sertifiointi
    body: Ensimmäiset vientitilaukset saapuivat Japanista ja Koreasta. CE-sertifiointi saavutettiin ydintuotelinjoille, mikä merkitsi afarerin astumista kansainvälisille markkinoille. Yritys alkoi palvella kaupallisia ja vapaa-ajan käyttäjiä Kiinan ulkopuolella.
  - year: '2018'
    title: Tehtaan Laajennus
    body: Muutti 12 000 m²:n tuotantolaitokseen. Lisäsi RF-hitsauslinjat ja drop-stitch-tuotantokapasiteetin, mikä mahdollisti laajemman valmistuksen ja paransi laadunvalvontajärjestelmiä.
  - year: '2020'
    title: T&K-keskus Perustettu
    body: Avaattiin oma T&K-keskus, jossa on PVC-kangaslaboratorio, hydrodynaaminen testiallas sekä CAD/FEA-simulaatiostudio. Tuotekehitys laajeni keskittymään kevyeen rakenteeseen, parempaan kestävyyteen ja käyttäjäkeskeiseen suunnitteluun.
  - year: '2022'
    title: Sertifiointi & Globaali Kasvu
    body: Saavutti ISO 9001 -sertifioinnin. Laajeni 14 T&K-insinööriin ja yli 200 työntekijään. Tuotteet saavuttivat asiakkaita ympäri Eurooppaa, Amerikkaa ja Aasian ja Tyynenmeren aluetta jälleenmyyjä- ja co-brand-kumppanuuksien kautta.
  - year: '2024'
    title: Innovaatio- & Designstudio
    body: Perusti täyden palvelun suunnittelu- ja innovaatiostudion räätälöityjä co-brand-projekteja varten konseptista tuotantoon. Vahvisti ammattimaisia merenkulkusovelluksia, mukaan lukien pelastus-, kaupalliset ja julkiset hankinnat.
  - year: '2026'
    title: Rakentamassa Vesilläliikkumisen Tulevaisuutta
    body: Nykyään afarer kehittää edelleen kumiveneitä, SUP-lautajärjestelmiä ja räätälöityjä merenkulkuratkaisuja — yhdistäen ihmisiä ja organisaatioita maailman vesiin. 50+ maata, 15 000+ yksikön vuosikapasiteetti.
content_founding:
  tagline: Alku
  title: Syntynyt Rannikolla
  subtitle: 'afarer aloitti rannikkopajassa Qingdaossa yhdellä veneellä ja visiolla: rakentaa kumiveneitä, jotka kestävät todellisia meriolosuhteita.'
  paragraphs:
    - Vuonna 2012 perustajamme näkivät markkinaraon — useimmat kumiveneet olivat joko edullisia mutta epäluotettavia tai korkealaatuisia mutta kohtuuttoman kalliita. He uskoivat, että oli tilaa valmistajalle, joka tarjoaa sekä laatua että arvoa.
    - Ensimmäinen runko rakennettiin käsin, testattiin paikallisilla vesillä ja hiottiin kalastajilta ja pieniltä kaupallisilta toimijoilta saadun aidon palautteen perusteella. Tämä palautesilmukka — rakenna, testaa, kuuntele, paranna — on edelleen insinöörifilosofiamme ydin.
    - Vuoteen 2015 mennessä tieto oli levinnyt Qingdaon ulkopuolelle. Kansainväliset jälleenmyyjät alkoivat pyytää näytteitä. Se, mikä alkoi paikallisena pajana, oli muuttumassa maailmanlaajuiseksi toimittajaksi.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarerin varhainen tuotantopaja ja valmistus
content_growth:
  tagline: Kasvu & Innovaatio
  title: Pajasta 12 000 m²:n Laitokseen
  subtitle: Jatkuva investointi ihmisiin, laitteisiin ja prosesseihin on muuttanut afarerin moderniksi venetuotantolaitokseksi.
  paragraphs:
    - Kysynnän kasvaessa myös laitoksemme kasvoi. Laajensimme pienestä pajasta 12 000 m²:n tehtaaksi, jossa on omat tuotantolinjat SUP-veneille, kumiveneille, SUP-laudoille ja tarvikkeille.
    - Investoimme CNC-leikkauskoneisiin, korkeataajuushitsauslaitteisiin, drop-stitch-tuotantolinjoihin ja kattaviin testauslaitteisiin — jotta voimme hallita tuotannon laatua jokaisella osa-alueella.
    - Nykyään yli 200 hengen tiimiimme kuuluu meri-insinöörejä, materiaalitutkijoita, laadunvalvonnan asiantuntijoita ja ammattitaitoisia käsityöläisiä — monet heistä ovat olleet afarerilla alkuajoista lähtien.
philosophy:
  tagline: Brändifilosofia
  title: Vapautta Vesillä Tekniikan Voimin
  body: Vapaus vesillä ei tarkoita vain liikkumista. Se tarkoittaa uusien paikkojen löytämistä, ulkoilmakokemusten luomista, ihmisten yhdistämistä luontoon ja ammattimaisten tehtävien mahdollistamista. Tekniikka tekee tuon vapauden mahdolliseksi.
  pillars:
    - title: Luotettavuus Ensin
      body: Vesiympäristöt vaativat luottamusta. afarerin tuotteet on suunniteltu vakauden, kestävyyden, turvallisuuden ja tasaisen suorituskyvyn ympärille.
    - title: Ihmiskeskeinen Suunnittelu
      body: Tuotteiden tulee palvella ihmisiä, ei teknologiaa. Jokainen suunnittelupäätös alkaa ymmärryksestä siitä, miten ihmiset käyttävät vesikulkuneuvoja, missä he tutkivat ja mitä haasteita he kohtaavat.
    - title: Saavutettava Tutkimusmatkailu
      body: Vedet eivät saa kuulua vain asiantuntijoille. afarer luo varusteita, joiden avulla yhä useammat ihmiset voivat turvallisesti kokea jokia, järviä, merta ja rannikkoympäristöjä.
    - title: Jatkuva Innovaatio
      body: Innovaatio ei tarkoita vain uusien tuotteiden luomista. Se tarkoittaa jokaisen yksityiskohdan parantamista — materiaalit, rakenteet, valmistus ja käyttökokemus.
engineeringDna:
  tagline: Insinööri-DNA
  title: Näin afarer Luo Tuotteita
  areas:
    - title: Materiaalitiede
      body: afarer keskittyy sopivien materiaalien valintaan eri meriympäristöihin. Keskeisiä huomioitavia tekijöitä ovat kulutuskestävyys, UV-kestävyys, paineenkestävyys ja pitkäaikainen kestävyys.
      items:
        - Kulutuskestävyys
        - UV-kestävyys
        - Paineenkestävyys
        - Pitkäaikainen kestävyys
    - title: Rakennesuunnittelu
      body: Kumiveneet vaativat tarkkaa tasapainoa jäykkyyden, painon, siirrettävyyden ja vakauden välillä. afarerin insinöörityö keskittyy näiden tekijöiden optimointiin drop-stitch-ydinteknologian ja edistyneen saumarakenteen avulla.
      items:
        - Jäykkyys
        - Painon optimointi
        - Siirrettävyys
        - Vakaus
    - title: Valmistustarkkuus
      body: 'Jokainen tuote käy läpi valvotut prosessit: materiaalin esivalmistelu, tarkkuusleikkaus, hitsaus ja liittäminen, kokoonpano, laaduntarkastus ja suorituskyvyn todentaminen.'
      items:
        - Materiaalin esivalmistelu
        - Tarkkuusleikkaus
        - Hitsaus & Liittäminen
        - Kokoonpano & Laadunvalvonta
    - title: Käyttäjäskenaariotekniikka
      body: Tuotteet kehitetään todellisten käyttötarkoitusten — virkistyskäytön, seikkailun ja ammattikäytön — ympärille, varmistaen että jokainen muotoilu vastaa sen käyttöympäristön erityisvaatimuksia.
      items:
        - Virkistyskäyttö
        - Seikkailu
        - Ammattikäyttö
        - Kaupallinen

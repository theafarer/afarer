intro: >-
  Painistettava vene on yhtä luotettava kuin sen nahat. Yksi heikko hitsaus voi vaarantaa koko kamarin — ja merellä kamarin vika ei ole häiriö; se on turvallisuusriski. Olemme {SITE.name} investoineet erikoistuneeseen Radio-Frequency (RF) Hitsauskeskuksessa, joka yhdistää teollisuusstandardin
  dielektrinen hitsauspainat ja tiukan prosessinvalvonnan sekä jälkihitsaus testauksen. Jokaisen nahteemme on dokumentoitu, jäljitettävissä ja todistettu täyttävän tai ylittävän vaatimukset — kansainvälinen ISO 6185 -standardi tulehdettavat veneet.
content_html: >
  <h2>Salauksen takana oleva tiede</h2>

  <p>RF-hitsaus käyttää korkeataajuuksista sähkömagneettista energiaa (tyypillisesti 27,12 MHz) polarisoitujen molekyylien virittämiseen PVC- tai Hypalon-päällystetyssä kankaassa, tuottaen lämpöä tarkasti materiaalirajapinnassa. Toisin kuin kuumailma- tai kuumakiilahitsaus, RF-hitsaus luo todellisen
  molekyylisidoksen — kaksi kangaskerrosta sulautuvat yhtenäiseksi homogeeniseksi materiaaliksi hitsausvyöhykkeessä, muodostaen liiton, joka on yhtä vahva kuin itse perusmateriaali.</p>


  <h2>Hitsauslaitteet ja prosessin hallinta</h2>

  <p>Hitsauskeskuksessa on seuraavat laitteet:</p>

  <table>
    <thead><tr><th>Kone</th><th>Teho / Kapasiteetti</th><th>Käyttö</th></tr></thead>
    <tbody>
      <tr><td>Dielektrinen RF-puristin 1</td><td>15 kW, alusta 2000 × 600 mm</td><td>Päätpitkittäissaumat, ahtaajaputkiyhdistelmät</td></tr>
      <tr><td>Dielektrinen RF-puristin 2</td><td>10 kW, alusta 1500 × 500 mm</td><td>Laipistohitsaukset, kartion kiinnitykset, venttiilipaikat</td></tr>
      <tr><td>CNC-säädettävä RF-hitsausteline</td><td>8 kW, XY-pöytä 2500 × 1200 mm</td><td>Kaarevat saumat, logo/paneeli kohopaino, tarkka paikkatöitä</td></tr>
      <tr><td>Kuumakiila-automaattihitsausteline</td><td>Vaihtuva lämpötila, max 1,2 m/min</td><td>Varaustapa Hypalon/CSM-materiaaleille</td></tr>
    </tbody>
  </table>

  <p>Jokainen RF-puristin on varustettu suljetun järjestelmän lämpötila- ja painevalvonnalla. Hitsausparametrit — teho, puristusaika, jäähdytysaika, elektrodipaine — ohjelmoidaan materiaalityypin mukaan ja tallennetaan Manufacturing Execution System (MES) -järjestelmäämme täydellistä
  jäljitettävyyttä varten.</p>


  <h2>Hitsauslaadun testit — jokainen sauma, jokainen vene</h2>

  <p>Hitsauslujuus todennetaan pakollisella nelitestiohjelmalla:</p>

  <ol>
    <li><strong>Visuaalinen tarkastus</strong> — 100 % saumoista tarkastellaan visuaalisesti läpipalamisen, epäkeskittymisen, kontaminaation tai epätäydellisen sulautumisen osalta. Hylkäämisraja: 0,5 % lineaarisista metreistä.</li>
    <li><strong>Koorrotesti</strong> — 25 mm:n levyinen nauha leikataan testikappaleesta, joka on hitsattu kunkin tuotantoerän kanssa. Vähimmäis-korruvoima: 120 N/25 mm PVC 1100 dtex -kankaalle.</li>
    <li><strong>Ilmantsapito testi</strong> — Jokainen valmistettu kammio paineistetaan 1,5 × käyttöpaineeseen ja pidetään 30 minuuttia. Paineenlasku ei saa ylittää 2 %.</li>
    <li><strong>Lämpökiertotesti</strong> -näytekoappaleet kierretään -20 °C:sta +60 °C:seen 50 kiertoa, minkä jälkeen suoritetaan uusi koorrotesti. Hyväksytty lujuuden menetys: &lt; 10 %.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Koorrosvetolujuuden vertailu — RF vs. kuumailmahitsaus (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">RF-hitsaus</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Kuumailma</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Min.</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">RF-hitsaus saavuttaa johdonmukaisesti 90–95 % perusmateriaalin lujuudesta, selvästi vähimmäisvaatimuksen yläpuolella.</p>
  </div>


  <h2>Ammatillinen asiantuntemus</h2>

  <p>Hitsausryhmämme on vanhemman prosessinsinöörin johdolla, jolla on 11 vuoden kokemus päällystettyjen tekstiilien dielektrisestä hitsauksesta. Jokainen operaattori suorittaa 6 kuukauden sisäisen sertifioinnin ennen kuin hänet sallitaan työskentelemään tuotantosaumoissa. Uudelleensertifioinnin
  vaaditaan vuosittain, mukaan lukien käytännön hitsustesti, joka arvioidaan sisäisen A-luokan standardin mukaan (korruvoima ≥ 160 N/25 mm).</p>


  <h2>Mukautetut hitsausratkaisut ainutlaatuisiin vaatimuksiin</h2>

  <p>Ymmärrämme, että yksi hitsausspesifikaatio ei sovi kaikkiin sovelluksiin. RF-hitsauskeskuksemme kehittää säännöllisesti mukautettuja saumarakenteita asiakkaille, joilla on erityisiä vaatimuksia:</p>

  <ul>
    <li><strong>Monikerroksiset vahvistuskappalet</strong> — suurikulutusalueille, kuten hankauslaitoihin ja keulakartioihin, kehitämme monivaiheisia RF-hitsauksia, jotka integroivat kulumakestöisen ulkokerroksen lujuutta rajoittamatta.</li>
    <li><strong>Johtavat tai RF-läpäisymättömät saumat</strong> — sotilas- tai valvontaveneille, jotka vaativat sähkömagneettista suojausta, hitsaamme johtavat verkkokerrokset saumapinon sisään.</li>
    <li><strong>Värin vaihtuvien paneelien hitsaus</strong> — kaksiväriset kangaspaneelit (esim. oranssi runko + harmaa yläosa) hitsataan piilollaulella, jotta brändin estetiikka säilyy näkymättömällä liitolla.</li>
  </ul>


  <h2>Sitoumuksemme sinuun</h2>

  <p>Jokainen toimittamamme vene sisältää hitsauslaatutakuumme: jos jokin sauma pettää normaalikäytössä takuujakson aikana, korjaamme tai korvaamme kyseisen kammion kustannuksetta, ja juurisyyn tutkimus suoritetaan estääksemme toistumisen. Tämä ei ole pelkkä takuu — se on sitoumus jatkuvasta
  kehityksestä, jota ohjaavat todelliset toimintatiedot.</p>

  <p>Kun valitset {SITE.name}:n, valitset saumat, jotka on suunniteltu, testattu ja dokumentoitu — ei pelkästään hitsattu. Siinä on ero veneen, joka kelluu, ja veneen, joka suoriutuu, välillä.</p>

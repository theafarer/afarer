        desc: Complete guide to selecting a SUP —size, volume, material, shape, and intended use.
        href: /learn/sup
      - title: Inflatable vs Hard SUP
        desc: Inflatable SUP vs hard epoxy board —portability, durability, performance, and value compared.
        href: /compare/inflatable-vs-hardboard
      - title: All-Around vs Touring vs Yoga SUP
        desc: Different SUP board types —construction standards, shapes, sizes, and recommended uses.
        href: /learn/sup
      - title: Drop-Stitch vs Traditional Construction
        desc: Compare drop-stitch and traditional construction for SUP boards across weight, cost, durability, and rigidity.
        href: /learn/drop-stitch-core
  - title: Inflatable SUP Guide
    tagline: Inflatable SUP Knowledge
    desc: Comprehensive guides on inflatable SUPs —PVC materials, drop-stitch construction, safety standards, and maintenance best practices.
    guides:

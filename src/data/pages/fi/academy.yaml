        desc: Definitive guide to PVC materials used in inflatable SUP board construction.
        href: /learn/materials
      - title: How Inflatable SUPs Are Made
        desc: Manufacturing process —material cutting, drop-stitch core bonding, seam construction, pressure testing, and quality control.
        href: /learn/inflatable-technology
      - title: SUP Safety Guide
        desc: Safety standards, load capacity, proper inflation, pre-departure checks, and emergency procedures.
        href: /learn/water-safety
      - title: SUP Maintenance
        desc: Cleaning, storage, UV protection, and repair of inflatable SUP boards.
        href: /inflatable-sup-maintenance
  - title: SUP Board Knowledge
    tagline: SUP Board Hub
    desc: Technical guides covering SUP board types, materials, construction methods, maintenance, and safety.
    guides:
      - title: SUP Board Types
        desc: All-around, touring, yoga, sport, and kids SUPs —learn the differences and choose the right one.
        href: /learn/sup
      - title: Drop-Stitch Technology
        desc: How thousands of internal threads create rigid, high-pressure inflatable structures.
        href: /learn/drop-stitch-core
      - title: Materials Reference
        desc: PVC denier ratings, fabric weights, UV resistance, and marine-grade materials explained.
        href: /learn/materials
      - title: SUP Buying Guide
        desc: Compare different SUP board types for different use cases and skill levels.
        href: /learn/sup
  - title: SUP Knowledge
    tagline: Stand-Up Paddleboard Guides
    desc: Everything about SUP boards —inflatable vs rigid, board dimensions, material technology, and expert advice for all skill levels.
    guides:
      - title: Inflatable vs Hard SUP
        desc: Compare iSUPs and hard epoxy boards across portability, durability, performance, and value.
        href: /learn/sup
      - title: SUP Board Dimensions Guide
        desc: How length, width, and thickness affect stability, speed, and maneuverability.
        href: /learn/sup
      - title: SUP Maintenance & Care
        desc: Cleaning, storage, UV protection, and repair tips for inflatable SUP boards.
        href: /inflatable-sup-maintenance
      - title: Choosing Your First SUP
        desc: Beginner's guide to selecting the right stand-up paddleboard for your weight, skill level, and intended use.
        href: /learn/sup
  - title: Rental Operations Guide
    tagline: Fleet Management for Rental Businesses
    desc: Guides on building and managing SUP rental fleets for beach kiosks, water sports centers, and hospitality properties.
    guides:
      - title: Building Your Rental Fleet
        desc: How to choose the right SUP boards for your rental operation —durability, sizing, and ROI considerations.
        href: /solutions/rental-operators
      - title: Fleet Maintenance Guide
        desc: Essential maintenance practices to maximize board lifespan and minimize downtime for rental fleets.
        href: /solutions/rental-operators
  - title: Resort & Hospitality Guide
    tagline: Water Activities for Hospitality
    desc: Guides on launching and managing SUP programs for resorts, hotels, and waterfront destinations.
    guides:
      - title: Starting a Resort SUP Program
        desc: Factors to consider when launching guest SUP activities —fleet sizing, staffing, and revenue modeling.
        href: /solutions/resorts-hotels
      - title: SUP vs Other Water Activities
        desc: Compare SUP programs with other water sports for guest experience and operational efficiency.
        href: /learn/sup
  - title: Retail & Distribution Guide
    tagline: SUP Business Partnerships
    desc: Guides on becoming a SUP retail partner or distributor —inventory planning, market positioning, and growth strategies.
    guides:
      - title: Becoming a SUP Retailer
        desc: How to choose product lines, manage inventory, and market SUP boards in your retail store.
        href: /solutions/retail-partners
      - title: SUP for Commercial Operations
        desc: Why inflatable SUPs are a versatile product for commercial fleets, rental businesses, and professional operators.
        href: /use-cases/search-and-rescue

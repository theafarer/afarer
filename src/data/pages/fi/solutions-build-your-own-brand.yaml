meta:
  title: Private Label SUP-valmistus | {SITE}
  description: Käynnistä oma SUP-merkkisi Afarerin kanssa. Ideasta markkinoille — täydellinen OEM/ODM-palvelu, joka sisältää suunnittelun, prototyyppien valmistuksen, tuotannon ja maailmanlaajuisen logistiikan.
hero:
  tagline: Rakenna oma brändisi
  title: Käynnistä oma<br />SUP-merkisi
  subtitle: Sinulla on visio. Meillä on tehdas, osaaminen ja toimitusketju. Yhdessä rakennamme erottuvan brändin.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: Mukautettu brändätty SUP-lauta vedessä
process:
  title: Brändisi matka
  subtitle: Ideasta markkinoille 5 vaiheessa.
  steps:
    - phase: Vaihe 1
      title: Ideointi
      period: Viikko 1-2
      items:
        - Markkinatutkimus ja kilpailija-analyysi
        - Tavoiteasiakkaan määrittely
        - Brändiasettelma-työpaja
        - Tuoterivistä strategia
    - phase: Vaihe 2
      title: Suunnittelu
      period: Viikko 3–6
      items:
        - Laudan muoto ja graafinen suunnittelu
        - Värien sovitus ja materiaalin valinta
        - Lisävarusteiden erittely
        - Pakkaus- ja etikettisuunnittelu
    - phase: Vaihe 3
      title: Prototyyppi
      period: Viikko 7–10
      items:
        - Otosten tuotanto
        - Laaduntestaus (paine, kelluvuus, UV)
        - Suunnittelun mukautukset
        - Lopullinen hyväksyntä
    - phase: Vaihe 4
      title: Tuotanto
      period: Viikko 11–14
      items:
        - Erävalmistus
        - Laadunvalvontatarkastus (per yksikkö)
        - Merirahti / lentorahti
        - Tulliselvitysasiakirjat
    - phase: Vaihe 5
      title: Käynnistys
      period: Viikko 15–16
      items:
        - Tuotekuvaus
        - Verkkotuotteen syöte
        - Markkinointimateriaalit
        - Lanseeraustuki
packages:
  title: Aloituspaketit
  subtitle: Paketit suunniteltu jokaiselle brändin kasvuvaiheelle.
  items:
    - name: Starter Brand
      tagline: 50-100 yksikköä · 2 lautamallia
      features:
        - Peruslogopainatus
        - Vakiopakkaus
        - Sähköpostituki
    - name: Growing Brand
      tagline: 300–1 000 kpl · 3–5 lautan mallia
      features:
        - Oma väri + logo
        - Mukautettu pakkaus
        - Tuotekuvat
        - Oma asiakaspäällikkö
    - name: Established Brand
      tagline: 1 000+ yksikköä · Täydellinen tuotevalikoima
      features:
        - Täydellinen mukautus
        - Premium-paketointi
        - Markkinointimateriaalit
        - Prioriteettituotanto

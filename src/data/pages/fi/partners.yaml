hero:
  tagline: Kumppanit ja jakelu
  title: Tule afarer-kumppaniksi<br />—Maailmanlaajuinen jakeluverkosto
  subtitle: Liity afarerin maailmanlaajuiseen kumppaniverkostoon. Teemme yhteistyötä merenkulkualan jakelijoiden, venekauppiaiden, varustejälleenmyyjien ja brändikumppanien kanssa yli 50 maassa.

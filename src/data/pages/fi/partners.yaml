hero:
  tagline: Partners & Distribution
  title: 'Tule afarer-kumppaniksi<br />—Maailmanlaajuinen jakeluverkosto'
  subtitle: "Join afarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries."
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: Partner Programs
  title: 'Kumppaniohjelmat<br />rakennettu kasvua varten'
  subtitle: 'Oletpa sitten jakelija, jälleenmyyjä tai brändikumppani, afarer tarjoaa ohjelmia, jotka on suunniteltu tukemaan liiketoimintaasi.'
  columns: 3
  items:
    - title: 'Distributor Program'
      description: 'Yksinomainen aluejakelu volyymihinnoittelulla, markkinointituella ja suoralla tehdasyhteydellä. Vähimmäissitoumus alueen koon mukaan.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Suorat jälleenmyyjähinnat, tuotekoulutus, markkinointimateriaalit ja takuutuki vähittäismyymälöille ja verkkokaupoille.'
      icon: tabler:building-store
    - title: 'OEM/ODM Partnership'
      description: 'Täyden palvelun OEM- ja ODM-valmistus mukautetulla brändäyksellä, pakkauksella ja tuotetiedoilla. Konseptista konttiin.'
      icon: tabler:certificate
    - title: 'Brand Partnership'
      description: 'Yhteisbrändäys, private label ja yksinoikeudelliset malliohjelmat vakiintuneille brändeille meri- ja ulkoiluvirkistyksen alalla.'
      icon: tabler:stars
    - title: 'Government & Institutional'
      description: 'Ensisijaiset toimittajaohjelmat valtion virastoille, rannikkovartiostoille, sotilas- ja humanitaarisille järjestöille. Tarjousvalmis dokumentaatio.'
      icon: tabler:building-community
    - title: 'Resort & Rental Partner'
      description: 'Laivastohinnoittelu, tasainen laatu ja mukautettu brändäys lomakohteille, sukelluskeskuksille ja vuokraustoiminnalle maailmanlaajuisesti.'
      icon: tabler:sun
content_benefits:
  tagline: Why Partner With Us
  title: 'Miksi kumppanit valitsevat afarerin'
  subtitle: 'Kumppanimme hyötyvät todellisesta valmistuskapasiteetista, tasaisesta laadusta ja reagoivasta tuesta.'
  list:
    - 'Direct Factory Access: Work directly with our manufacturing team —no middlemen. Get faster responses, better pricing, and full visibility into production.'
    - 'Customization Ready: Brand your products with custom colors, logos, packaging, and specifications. Minimum order quantities tailored to your market.'
    - 'Quality Guaranteed: ISO 9001 certified production with CE, UKCA, and BSCI compliance. Every product tested before shipping.'
    - 'Global Logistics: Shipping from Qingdao, China with FOB, CIF, and DDP options. US warehouse in Montclair, CA for North American distribution.'
    - 'Marketing Support: Product catalogs, photography, technical documentation, and digital assets to support your sales efforts.'
    - 'Training & Support: Product training for your sales team, technical support for your customers, and warranty service coordination.'
content_process:
  tagline: How to Become a Partner
  title: 'Yksinkertainen kumppanuusprosessi'
  subtitle: 'Kumppanuusprosessimme on suoraviivainen —suunniteltu saamaan sinut myymään afarer-tuotteita nopeasti.'
  items:
    - title: 'Step 1: Submit Application'
      description: 'Täytä kumppanihakemuslomakkeemme yritysprofiilillasi, kohdemarkkinallasi ja tuotekiinnostuksillasi.'
    - title: 'Step 2: Qualification Review'
      description: 'Kumppanuustiimimme tarkastelee hakemustasi ja ottaa sinuun yhteyttä 3 työpäivän kuluessa keskustellakseen mahdollisuuksista.'
    - title: 'Step 3: Agreement & Setup'
      description: 'Allekirjoita kumppanuussopimus, perusta tilisi ja saat kumppanihinnat, markkinointimateriaalit ja tuotenäytteet.'
    - title: 'Step 4: Training & Launch'
      description: 'Tuotekoulutus, myyntituki ja markkinointimateriaalit toimitetaan. Olet valmis aloittamaan myynnin.'
cta:
  title: 'Valmis tulemaan afarer-kumppaniksi?'
  subtitle: 'Hae kumppanuutta, niin tiimimme vastaa 3 työpäivän kuluessa.'
  actions:
    - variant: primary
      text: Apply for partnership
      href: /contact
    - text: View our products
      href: /products

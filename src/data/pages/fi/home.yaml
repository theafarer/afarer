meta:
  title: Afarer Ilmavat Melontalaudat | Mene pidemmälle. Aja kovempaa.
  description: Löydä Afarerin ilmavat melontalaudat monipuoliseen melontaan, retkeilyyn, joogaan, kalastukseen ja ulkoiluseikkailuihin. Löydä täydellinen SUP ja tutki vesillä enemmän.
  keywords:
    - ilmava melontalauta
    - ilmava sup
    - monikäyttöinen sup
    - retkeilysup
    - joogasup
    - kalastussup
    - perheen melontalauta
    - kannettava melontalauta
hero:
  tagline: Ilmavat Melontalaudat
  title: Ilmavat Melontalaudat Jokaiseen Seikkailuun
  slogan: Mene pidemmälle. Aja kovempaa.
  subtitle: Löydä melonnan vapaus Afarerin kanssa. Tutustu huolellisesti suunniteltuihin ilmaviin SUP-lautoihin rentoihin järvipäiviin, rannikkoseikkailuihin, kuntoiluun ja kaikkeen siltä väliltä.
  taglineSection: Rakennettu luottamusta varten. Suunniteltu erottumaan.
  actions:
    - variant: primary
      text: Etsi Lautasi
      href: /size-guide/
      icon: tabler:compass
    - text: Tutki SUP-lautoja
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Miksi Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Afarerin ilmavat melontalaudat liukuvat rauhallisen veden yli auringonnousussa — rakennettu jokaiseen seikkailuun
who_we_serve:
  tagline: Aja Kanssamme
  title: Löydä Oma Vesireittisi
  subtitle: Jokaisella melojalla on oma käsityksensä seikkailusta. Löydä Afarer SUP, joka on suunniteltu sinun tapaesi meloa.
  items:
    - title: Aloittelijat & Vapaa-ajan Melojat
      keywords: ilmava sup aloittelijoille, monikäyttöinen melontalauta, vakaa sup
      description: Leveät, vakaat monikäyttöiset laudat, jotka tekevät ensimmäisestä melontavedosta luontevan ja kasvavat mukanasi.
      icon: tabler:users
      cta: Etsi Ensimmäinen Lautasi
      link: /all-around-sup/
    - title: Retkimelonta & Seikkailu
      keywords: retkeilysup, pitkän matkan melontalauta, retkisup
      description: Pidemmät, kapeammat laudat, jotka pitävät suunnan, liukuvat pidemmälle ja kantavat varusteet monipäiväisille reiteille.
      icon: tabler:building
      cta: Tutki Retkeily-SUPeja
      link: /touring-sup/
    - title: Jooga & Kuntoilu
      keywords: joogasup, kuntoilumelontalauta, leveä vakaa sup
      description: Leveät, vakaat alustat, joissa on tilaa liikkua — auringonnousun virtauksiin, treeneihin ja tasapainoon rauhallisella vedellä.
      icon: tabler:heart
      cta: Tutki Jooga-SUPeja
      link: /yoga-sup/
    - title: Kalastus & Perhe
      keywords: kalastussup, perheen melontalauta, vakaa kalastusalusta
      description: Vakaat, käytännölliset alustat heittokalastukseen, lasten kanssa risteilyyn ja pitkiin rentoihin päiviin vedellä.
      icon: tabler:users
      cta: Tutki Kalastus-SUPeja
      link: /fishing-sup/
proof_points:
  title: Testattu näyttelyä vaativammissa olosuhteissa
  subtitle: Suunnittelu, suorituskyky ja laatu, jotka voit todentaa — vedessä ja luvuissa.
  items:
    - metric: 10+
      label: Vuosia suunnittelua vesille
      detail: Vuodesta 2012, hiottu lauta laudalta
    - metric: 50+
      label: Maata vesillä
      detail: Melojia ja kumppaneita ympäri maailmaa
    - metric: 12–15
      label: PSI drop-stitch -ydin
      detail: Jäykkä siellä, missä tarvitaan, helppo pakata
    - metric: 100%
      label: Painetestattu lauta laudalta
      detail: Tarkastettu ennen lähetystä
business_solutions:
  tagline: Miksi Aja Eroaa
  title: Suorituskyky, jonka Tunnet Ensimmäisestä Vedosta
  subtitle: Neljä pilaria, jotka todellinen vesi on muovannut — suorituskyky, design, rakenne ja laatu.
  items:
    - title: Suorituskyky Vedellä
      description: Muodot viritetty vakauteen, liukuun ja luottamukseen aallokossa — jokainen veto pysyy yhteydessä veteen.
      icon: tabler:shield-check
    - title: Ilmeikäs Design
      description: Kokoelmat, jotka ammentavat vuorovedestä, eläimistöstä ja rannikon energiasta — lautoja, joilla haluat näkyä.
      icon: tabler:package
    - title: Todistettu Rakenne
      description: Suurtiheyksiset drop-stitch-ytimet, vahvistetut reunat ja fuusiolaminoidut saumat toistuvaan käyttöön.
      icon: tabler:headset
    - title: Varmennettu Laatu
      description: Painetestatut, visuaalisesti tarkastetut ja selkeän takuun sekä reagoivan asiakaspalvelun takaamat.
      icon: tabler:truck-delivery
cta:
  title: Löydä seuraava lautasi.
  subtitle: Olipa kyse ensimmäisestä vedostasi tai pisimmästä reitistäsi — saatamme sinut vedelle.
  actions:
    - variant: primary
      text: Tutki Kokoelmaa
      href: /inflatable-sup/
      icon: tabler:send
    - text: Tilaa Katalogi
      href: /resources/download-catalog/

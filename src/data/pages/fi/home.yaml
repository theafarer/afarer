distributor:
  tagline: Maakohtaiset eksklusiiviset jakelijat
  title: Yksi maa. Yksi virallinen afarer-jakelija.
  subtitle: Yksi maa, yksi jälleenmyyjä -ohjelma, johon sisältyy alueellinen yksinoikeus, jälleenmyyntihinnat, markkinointituki ja oma Distributor Success Program.
  benefits:
    - title: Alueellinen yksinoikeus
      description: Yksi valtuutettu jälleenmyyjä maata tai aluetta kohti — ei sisäistä kilpailua, ei kanavaristiriitoja.
    - title: Suorat tehdasmarginaalit
      description: Jälleenmyyjälistahinnat ja vuosialennukset sitoutuneista volyymeista, toimitettuna FOB Qingdao.
    - title: Markkinointi- ja koulutustuki
      description: Yhteisbrändättyjä materiaaleja, myyntipisteaineistoja, tuotekoulutusta ja lanseerauskampanjoita.
    - title: Oma asiakastimi
      description: Henkilökohtainen jälleenmyyntipäällikkö sekä perehdytys-, ennuste- ja jälkitilaustukea.
  actions:
    - variant: primary
      text: Ryhdy jälleenmyyjäksi
      href: /distributor-program
    - text: Pyydä jälleenmyyjähinnasto
      href: /contact?subject=Dealer Price List
    - text: Hae maakumppanuutta
      href: /contact?subject=Country Partnership Application
    - text: Lataa jälleenmyyjäohjelma
      href: /distributor-program
  note: Näytetilaukset 5–10 kappaletta. Kokeilutilaukset 10–30. Valtuutettu jälleenmyyjä 30–50. Maa-/aluejakelija 100–300+.

who_we_serve:
  tagline: Ketkä me palvelemme
  title: Kattavat SUP-ratkaisut vesiliiketoiminnalle
  subtitle: Neljälle keskeiselle markkinalle suunnitellut laitteet, valmistus ja liiketoimintatuki.
  items:
    - title: Soutuseurat
      keywords: SUP-kerhon laitteet, melontakoulun laitteet, vuokrausten kalusto
      description: Kestävät SUP-valikoimat, kerhohinnat ja varaosapohjelmat soutukerhoille ja kouluille.
      icon: tabler:users
      cta: Tutustu melontakerhon ratkaisuihin
      link: /solutions/paddle-clubs
    - title: Lomakohteet ja hotellit
      keywords: lomakohteen vesiliikunta, hotellin rantavarusteet, vieraskokemus
      description: Täydelliset SUP-kalusto-ohjelmat räätälöidyllä brändäyksellä, henkilöstökoulutuksella ja ROI-optimoituine paketteineen.
      icon: tabler:building
      cta: Luo lomakeskuksesi vesielämys
      link: /solutions/resorts-hotels
    - title: Vähittäiskaupan kumppanit
      keywords: SUP tukku, ulkoiluretailit, urheilutarvikkeiden kaupat
      description: Kattava tuotevalikoima, markkinointimateriaalit, dropshipping-vaihtoehdot ja kilpailukykyiset tukkumarginaalit.
      icon: tabler:shopping-cart
      cta: Ryhy vähittäiskumppaniksi
      link: /solutions/retail-partners
    - title: Uudet SUP-merkit
      keywords: private label SUP, mukautettu SUP-brändi, OEM-melontalauta
      description: Kokonainen OEM/ODM-tuotanto — suunnittelu, prototyypitys, massatuotanto ja maailmanlaajuinen logistiikka.
      icon: tabler:package
      cta: Rakenna SUP-merkkiäsi
      link: /oem-odm-manufacturer
proof_points:
  title: Luotettu vesiliiketoimintojen keskuudessa maailmanlaajuisesti
  subtitle: Vuosikymmenten meriteollisuuskokemus, joka tuottaa kannattavia SUP-ohjelmia.
  items:
    - metric: 10+
      label: Vuosien kokemus
      detail: Vuodesta 2012
    - metric: 50+
      label: Toimitusmaat
      detail: Maailmanlaajuinen jakeluverkosto
    - metric: 15,000+
      label: Vuosittain valmistetut yksiköt
      detail: CE-sertifioitu tuotantokapasiteetti
    - metric: 100%
      label: CE-sertifioitu
      detail: ISO 9001, BSCI, REACH -vaatimustenmukainen
business_solutions:
  tagline: Miten autamme
  title: Kumppanisi suunnittelusta tuloksiin asti
  subtitle: Neljä ydinosaamista, jotka auttavat vesialan yrityksiä käynnistymään, toimimaan ja kasvamaan.
  items:
    - title: Ammattilaisvarusteet
      description: Kaupallisen tason SUP-laudat suunniteltu päivittäiseen vuokrauskäyttöön, yli 500 kierrosta vähäisellä huollolla.
      icon: tabler:shield-check
    - title: OEM-valmistus
      description: Kattava private label -tuotanto suunnittelusta ja prototyypeistä sarjatuotantoon ja maailmanlaajuisiin toimituksiin.
      icon: tabler:package
    - title: Liiketoiminnan tuki
      description: Henkilökunnan koulutusta, markkinointimateriaaleja, varaosaohjelmia ja omaa asiakkuudenhoitoa.
      icon: tabler:headset
    - title: Globaali logistiikka
      description: FOB Qingdao, CIF suurimpiin satamiin, ovesta ovelle toimitus yli 50 maan tullituella.
      icon: tabler:truck-delivery
oem_section:
  tagline: Käynnistä merkki
  title: Ideasta markkinoille 16 viikossa
  subtitle: Täydellinen SUP-merkin käynnistäjäkumppanisi – suunnittelu, prototyyppi, valmistus ja toimitus.
  steps:
    - number: '01'
      title: Idea ja briefi
      desc: Jaa visiosi, kohdemarkkinasi ja määrityksesi.
    - number: '02'
      title: Suunnittelu ja suunnittelu
      desc: 3D-mallinnus, materiaalien valinta ja mukautettu graafinen suunnittelu.
    - number: '03'
      title: Prototyypit ja validointi
      desc: Näytekappaleiden valmistus CE-sertifioinnilla ja laatutestauksella.
    - number: '04'
      title: Sarjatuotanto
      desc: Täysimittainen valmistus, jossa laadunvalvonta on osa tuotantolinjaa, sekä tehdasauditointituki.
    - number: '05'
      title: Globaali toimitus
      desc: FOB Qingdao logistiikka, CIF suurimpiin satamiin, ovesta ovelle.
  cta: Aloita merkkisi matka
  cta_link: /oem-odm-valmistaja
cta:
  title: |
    Valmis aloittamaan <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">OEM/ODM-projektisi</span>?
  subtitle: Kerro vaatimuksesi, ja toimitamme mukautetun tarjouksen, vähimmäistilausmäärän tiedot ja toimitusajan yhden työpäivän kuluessa.
  actions:
    - variant: primary
      text: Pyydä tarjous
      href: /contact
      icon: tabler:message-circle
    - text: Vieraile tehtaallamme
      href: /factory

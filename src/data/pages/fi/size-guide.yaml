categories:
  inflatable: Ilmavatuiset SUP-laudat suunniteltu kannettavuuteen suorituskyvystä tinkimättä. Valitse oikea koko painosi ja melontatyylisi mukaan.
  sup: Stand-up melontalautia retkiä, joogaa, kuntoa ja virkistysmelontaa varten. Valitse pittu ja melojan painon mukaan.

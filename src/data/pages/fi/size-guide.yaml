how_to_choose:
  title: Kuinka valita oikea koko
  cards:
    - title: SUP-laudat
      description: Valitse pituus painosi ja käyttötarkoituksen mukaan. Leveämmät laudat (32"+) tarjoavat enemmän vakautta. Pidemmät laudat (11-12 jalkaa) kulkevat paremmin retkikäytössä. Raskaammat melojat tarvitsevat suurempaa tilavuutta.
    - title: Retkeily-SUP-laudat
      description: Pidemmät laudat (11–12 jalkaa) sopivat parhaiten matkailuun ja retkeilyyn. Leveämmät laudat (32"+) tarjoavat enemmän vakautta. Tarkista painonkestävyys koko kuormalle varusteineen.

    - title: Dinghyt ja SUP-veneet
      description: Valitse dinghyn pituus matkustajamäärän ja käyttötarkoituksen mukaan. Suuremmat SUP-veneet (4,5 m+) sopivat merelle ja pelastustehtäviin. Pienemmät dinghyt (2,7 m) toimivat apuveneinä ja kalastusalustana.

qc_section:
  tagline: Laadunvalvonta
  title: Testaus- ja laadunvarmistusprosessi
  subtitle: Jokainen vene k?y l?pi pakollisen testauksen ennen l?hetyst?. Laatulaboratoriomme toimii riippumattomana tuotannosta ja raportoi suoraan johdolle.
  steps:
    - step: '1'
      title: Raaka-aineen tarkastus
      desc: PVC-, Hypalon- ja drop-stitch-kankaat käyvät läpi vetolujuustestauksen (ASTM D751), repeämän leviämisen ja UV-kestävyyden varmistuksen ennen kuin mikään erä menee tuotantoon.
    - step: '2'
      title: 48 tunnin ilmanpysyvyystesti
      desc: Jokainen putkikammio täytetään 125 %:iin nimellispaineesta ja pidetään 48 tuntia. Yli 5 %:n paineen lasku aiheuttaa automaattisen hylkäyksen ja sauman uudelleentarkastuksen.
    - step: '3'
      title: Kuorma- ja tasapainotestaus
      desc: Valmiit veneet kuormitetaan enimmäiskantavuuteen ja testataan vakauden, vapaan laidan ja käsiteltävyyden osalta. Jokainen alus vesitestataan ennen lopullista tarkastusta.
oem_section:
  tagline: OEM-projektit
  title: Brändi- ja OEM-kumppanuustapaustutkimukset
  subtitle: Konseptista konttiin —kuinka autamme maailmanlaajuisia brändejä lanseeraamaan ja skaalaamaan kumiveneiden tuotelinjojaan.
  cases:
    - challenge: Eurooppalainen ulkoilukauppias tarvitsi oman etiketin SUP-tuotelinjan ainutlaatuisella kansigrafiikalla, ympäristöystävällisellä PVC:llä ja vähittäismyyntivalmiilla pakkauksella —kaikki toimitettuna 60 päivässä.
      solution: Kehitimme räätälöidyt digitaalitulostustiedostot, hankimme REACH-yhteensopivan PVC:n ja tiivistimme näytteenoton 3 kierroksesta 1:een sijoittamalla suunnittelutiimin Qingdaon tehtaallemme.
      result: 55 päivää allekirjoitetusta ostotilauksesta FOB:hen. 2 400 yksikköä 4 tuotekoodilla. Uusintatilaus tehtiin ennen ensimmäisen kontin saapumista.
    - challenge: Yhdysvaltalainen vesiliikuntastartup tarvitsi suorituskykyisen drop-stitch-kajakin räätälöidyllä rungon muodolla, yhteisbrändätyllä pakkauksella ja BSCI-sertifioinnilla vähittäismyyntiä varten.
      solution: Mukautimme olemassa olevaa drop-stitch-kajakkimuottia modifioidulla keulanprofiililla, kehitimme yhteisbrändätyn pakkausgrafiikan ja toimitimme täydellisen BSCI-auditointidokumentaation.
      result: Listattu onnistuneesti 3 suuressa yhdysvaltalaisessa ulkoiluketjussa. Yli 5 000 yksikköä ensimmäisenä vuonna 98 %:n myyntiläpikäisyasteella.
    - challenge: Australialainen jakelija tarvitsi CE-sertifioidun SUP-venemalliston räätälöidyillä putkiväreillä, Hypalon-päivitysvaihtoehdolla ja Australian standardin AS 1799 vaatimustenmukaisuudella.
      solution: Tuotimme esituotantonäytteet 4 putkivärivaihtoehdolla, hankimme CSM-Hypalonin japanilaiselta toimittajalta ja koordinoimme kolmannen osapuolen AS 1799 -vaatimustenmukaisuustestauksen.
      result: 3-mallin SUP-mallisto lanseerattiin AU/NZ-markkinoilla. Seurasi valtion tarjousvoitto 12 partio-SUP-veneestä.
faq_section:
  tagline: UKK
  title: B2B- ja OEM-usein kysytyt kysymykset
  questions:
    - q: Mikä on vähimmäistilausmäärä (MOQ) OEM-kumisille SUP-laudoille?
      a: MOQ alkaa 5–10 yksiköstä vakio-OEM-malleille. Räätälöidyt muotit ja oman etiketin projektit vaativat vähintään 200 yksikköä riippuen monimutkaisuudesta. Koetilaukset ja näyte-erät ovat saatavilla uusille brändilanseerauksille.
    - q: Onko afarerilla BSCI-sertifiointi?
      a: >-
        Kyllä. Tehtaallamme on voimassa oleva BSCI-sosiaalisen vaatimustenmukaisuuden sertifiointi (auditointiraportti saatavilla pyynnöstä). Meillä on myös ISO 9001 -sertifiointi laadunhallinnalle, ja kaikki tuotteet ovat CE-sertifioituja. REACH- ja RoHS-vaatimustenmukaisuusdokumentaatio toimitetaan jokaisen
        OEM-toimituksen mukana.
    - q: Mik? on tyypillinen toimitusaika OEM-tilaukselle?
      a: Vakiotoimitusaika on 30–45 päivää vahvistetusta ostotilauksesta ja käsirahasta. Räätälöityjen muottien kehitys lisää 15–20 päivää työkalujen valmistukseen. Tarjoamme nopeutettua tuotantoa kiireellisille tilauksille ja sesonkikiireille ennen kesää (tammi–maaliskuu).
    - q: Voitteko toimittaa FOB Qingdao tai CIF satamaamme?
      a: Kyllä. Toimitamme FOB Qingdao, CIF tärkeimpiin maailmansatamiin ja DDP päteville kumppaneille. Logistiikkatiimimme hoitaa konttivarauksen, vientidokumentaation ja tulliselvityksen. Toimitamme yli 50 maahan EU:n, USA:n, AU:n ja Aasian markkinoilla.
b2b_moq: 'Vakio-MOQ: 5–10 yksikköä per malli (SUP/kajakki/drop-stitch). SUP-MOQ: 2–5 yksikköä. Koetilaukset tervetulleita uusille kumppanuuksille.'
production_flow:
  tagline: Tuotannonkulku
  title: Materiaalista valmiiksi veneeksi
  subtitle: Jokainen vene kulkee kuuden tuotantovaiheen läpi, ja jokaisessa vaiheessa on laadintatarkastuspisteitä. Ei oikoteitä, ei ohitettuja tarkastuksia.
  stages:
    - stage: '01'
      title: Materiaalivastaanotto ja saapuvan laadunvalvonta
      description: Kaikki saapuvat materiaalit kirjataan eränumeron mukaan ERP-järjestelmäämme. PVC-kangasrullat, drop-stitch-ytimet, venttiilit, liimat ja laitteisto eristetään QC-hyväksyntään asti.
      qc_check: Vetovoima (ASTM D751), repelmisaste (ISO 4674), paksuuden mittaus, liimankaantavuus, visuaalinen vikaskanaus
      qc_threshold: 100 % eristä testattu. Hylkää, jos vetolujuus < 90 % määrityksestä, repeäminen < määrityksen minimi tai mikä tahansa visuaalinen vika
      responsibility: Saapuvan tavaran laadunvalvontatiimi (3 tarkastajaa)
    - stage: '02'
      title: CNC-leikkaus ja materiaalien valmistelu
      description: Tietokoneoptimoitu paneelien asettelu PVC-materiaalille minimoi jätteen. Automaattiset CNC-leikkuukoneet ylläpitävät 0,1 mm:n sijaintitarkkuuden.
      qc_check: Mittatarkastus CAD DXF -tiedostoja vasten, reunojen laadun tarkastus, paneelimäärien varmistus
      qc_threshold: Joka 20. paneeli mitataan. Toleranssi ±0.5 mm. Erä hylätään, jos yli 2 % on toleranssin ulkopuolella
      responsibility: Leikkauspajan työnjohtaja
    - stage: '03'
      title: Hitsaus ja drop-stitch -sidonta
      description: Drop-stitch-ytimen liimataan ulkoiseen PVC-laminaattiin lämpöliimauksella. Putki kammiot ovat RF-hitsattuja tai ilmalaastettuja. Raitakärjet ovat kolmikerroksisia sulautusliimauksia.
      qc_check: Peel-testaus joka 50:n yksikön kohdalla (ASTM D751), hitsauksen leveyden mittaus, kuuman ilmalämpötilan logien tarkastus, näköteinen liittojen tarkastus takavalolla
      qc_threshold: Koorroisuus väh. 8 N/cm. Hitsin leveyden toleranssi ±1 mm. Mikä tahansa näkyvä kanaali = hylkää
      responsibility: Hitsaus QC (2 tarkastajaa/vuorossa)
    - stage: '04'
      title: Kokoonpano ja varustaminen
      description: 'Veneet siirtyvät lopputarkastukseen, jossa kaikki komponentit yhdistetään: runko + putket, venttiilit asennetaan, D-renkaat, kädensijat, evätelineet ja kantolaukun asennus. Jokainen yksikkö seuraa 100 kohdan asennuslista.'
      qc_check: 100 kohdan tarkastuslistan hyväksyntä yksikköä kohti, venttiilin toimintatesti (10 avaus/sulkukierrosta), laitteiston vääntömomenttien vahvistus, visuaalinen tarkastus
      qc_threshold: 'Nollavikapolitiikka turvallisuuksien kriittisille osille (venttiilit, D-renkaat, kahvat). Pienet kosmeettiset: AQL 2,5 (ISO 2859)'
      responsibility: Kokoonpanotiimin vetäjä + linjakohtainen laadunvalvonta
    - stage: '05'
      title: Paineentestaus ja laatupidätys
      description: Jokainen kammio täytetään 1.25× nimellispaineeseen (tyypillisesti 20–25 PSI) ja sitä pidetään paineessa 24–48 tuntia. Painetunnistimet kirjaavat tietoja jatkuvasti. Kammiot, joissa painehäviö ylittää 5 %, hylätään ja lähetetään saumojen uudelleentarkastukseen.
      qc_check: 24 tunnin paineenpitoloki, anturien kalibrointi varmistettu päivittäin, lämpötilakompensoitu painelukema, saumojen uudelleentestaus korjauksen jälkeen
      qc_threshold: Max 5 % paineen lasku 24 tunnissa vakaassa lämpötilassa. Yksikään kammio, joka ylittää tämän, = 100 % koko tuotantosarjan uudelleentestaus
      responsibility: Laadunvarmistuslaboratorio (riippumaton tuotannosta, raportoijaa johdolle)
    - stage: '06'
      title: Lopullinen tarkastus ja pakkaus
      description: Lopullinen visuaalinen ja toiminnallinen tarkastus. Pinnalliset vinohavainrot, värikonstaanttisuus, merkinnän/BIN-varmennus, pakkausintegriteetti ja lisävarusteiden täydellisyys. Yksiköt pumputetaan, kootaan laatikoihin ja lastataan palleille konttikuljetusta varten.
      qc_check: Täydellinen visuaalinen tarkastus, lisävarustelista kullekin SKU:lle, pakkauspudotustesti (1 m, satunnaisotos), etiketti/viivakoodin skannausvahvistus
      qc_threshold: AQL 2,5 suurille vioille, AQL 4,0 pienille. Nollatoleranssi turvallisuusvioille. 100 % yksiköistä visuaalisesti tarkastettu
      responsibility: Lopullinen laatuvalvontatiimi (4 tarkastajaa) + pakkausryhmän esimies

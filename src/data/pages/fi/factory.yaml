production_flow:
  tagline: Tuotannonkulku
  title: Materiaalista valmiiksi veneeksi
  subtitle: Jokainen vene kulkee kuuden tuotantovaiheen läpi, ja jokaisessa vaiheessa on laadintatarkastuspisteitä. Ei oikoteitä, ei ohitettuja tarkastuksia.
  stages:
    - stage: '01'
      title: Materiaalivastaanotto ja saapuvan laadunvalvonta
      description: Kaikki saapuvat materiaalit kirjataan eränumeron mukaan ERP-järjestelmäämme. PVC-kangasrullat, drop-stitch-ytimet, venttiilit, liimat ja laitteisto eristetään QC-hyväksyntään asti.
      qc_check: Vetovoima (ASTM D751), repelmisaste (ISO 4674), paksuuden mittaus, liimankaantavuus, visuaalinen vikaskanaus
      qc_threshold: 100 % eristä testattu. Hylkää, jos vetolujuus < 90 % määrityksestä, repeäminen < määrityksen minimi tai mikä tahansa visuaalinen vika
      responsibility: Saapuvan tavaran laadunvalvontatiimi (3 tarkastajaa)
    - stage: '02'
      title: CNC-leikkaus ja materiaalien valmistelu
      description: Tietokoneoptimoitu paneelien asettelu PVC-materiaalille minimoi jätteen. Automaattiset CNC-leikkuukoneet ylläpitävät 0,1 mm:n sijaintitarkkuuden.
      qc_check: Mittatarkastus CAD DXF -tiedostoja vasten, reunojen laadun tarkastus, paneelimäärien varmistus
      qc_threshold: Joka 20. paneeli mitataan. Toleranssi ±0.5 mm. Erä hylätään, jos yli 2 % on toleranssin ulkopuolella
      responsibility: Leikkauspajan työnjohtaja
    - stage: '03'
      title: Hitsaus ja drop-stitch -sidonta
      description: Drop-stitch-ytimen liimataan ulkoiseen PVC-laminaattiin lämpöliimauksella. Putki kammiot ovat RF-hitsattuja tai ilmalaastettuja. Raitakärjet ovat kolmikerroksisia sulautusliimauksia.
      qc_check: Peel-testaus joka 50:n yksikön kohdalla (ASTM D751), hitsauksen leveyden mittaus, kuuman ilmalämpötilan logien tarkastus, näköteinen liittojen tarkastus takavalolla
      qc_threshold: Koorroisuus väh. 8 N/cm. Hitsin leveyden toleranssi ±1 mm. Mikä tahansa näkyvä kanaali = hylkää
      responsibility: Hitsaus QC (2 tarkastajaa/vuorossa)
    - stage: '04'
      title: Kokoonpano ja varustaminen
      description: 'Veneet siirtyvät lopputarkastukseen, jossa kaikki komponentit yhdistetään: runko + putket, venttiilit asennetaan, D-renkaat, kädensijat, evätelineet ja kantolaukun asennus. Jokainen yksikkö seuraa 100 kohdan asennuslista.'
      qc_check: 100 kohdan tarkastuslistan hyväksyntä yksikköä kohti, venttiilin toimintatesti (10 avaus/sulkukierrosta), laitteiston vääntömomenttien vahvistus, visuaalinen tarkastus
      qc_threshold: 'Nollavikapolitiikka turvallisuuksien kriittisille osille (venttiilit, D-renkaat, kahvat). Pienet kosmeettiset: AQL 2,5 (ISO 2859)'
      responsibility: Kokoonpanotiimin vetäjä + linjakohtainen laadunvalvonta
    - stage: '05'
      title: Paineentestaus ja laatupidätys
      description: Jokainen kammio täytetään 1.25× nimellispaineeseen (tyypillisesti 20–25 PSI) ja sitä pidetään paineessa 24–48 tuntia. Painetunnistimet kirjaavat tietoja jatkuvasti. Kammiot, joissa painehäviö ylittää 5 %, hylätään ja lähetetään saumojen uudelleentarkastukseen.
      qc_check: 24 tunnin paineenpitoloki, anturien kalibrointi varmistettu päivittäin, lämpötilakompensoitu painelukema, saumojen uudelleentestaus korjauksen jälkeen
      qc_threshold: Max 5 % paineen lasku 24 tunnissa vakaassa lämpötilassa. Yksikään kammio, joka ylittää tämän, = 100 % koko tuotantosarjan uudelleentestaus
      responsibility: Laadunvarmistuslaboratorio (riippumaton tuotannosta, raportoijaa johdolle)
    - stage: '06'
      title: Lopullinen tarkastus ja pakkaus
      description: Lopullinen visuaalinen ja toiminnallinen tarkastus. Pinnalliset vinohavainrot, värikonstaanttisuus, merkinnän/BIN-varmennus, pakkausintegriteetti ja lisävarusteiden täydellisyys. Yksiköt pumputetaan, kootaan laatikoihin ja lastataan palleille konttikuljetusta varten.
      qc_check: Täydellinen visuaalinen tarkastus, lisävarustelista kullekin SKU:lle, pakkauspudotustesti (1 m, satunnaisotos), etiketti/viivakoodin skannausvahvistus
      qc_threshold: AQL 2,5 suurille vioille, AQL 4,0 pienille. Nollatoleranssi turvallisuusvioille. 100 % yksiköistä visuaalisesti tarkastettu
      responsibility: Lopullinen laatuvalvontatiimi (4 tarkastajaa) + pakkausryhmän esimies

intro:
  - >-
    Qingdao Vatrad Group Co., Ltd.:n tehdasbrändinä afarer hallitsee jokaista tuotannon vaihetta —raaka-PVC:n ja lasikuitumateriaalien saapumisesta valmiin veneen lopulliseen esitarkastukseen. Tuotantolaitoksemme Qingdaon talouskehitysalueella kattaa 12 000 neliömetriä ja sisältää erilliset työpajat
    PVC-leikkaukselle, putkien kuumasaumaukselle, lasikuituisten SUP-runkojen tuotannolle, SUP-digitaalipainatukselle, loppukokoonpanolle ja laaduntestaukselle.
  - >-
    Yhdistämällä suunnittelun, insinöörityön, prototyyppauksen, valmistuksen ja testauksen saman katon alle eliminoimme sopimusvalmistuksen tehottomuudet ja säilytämme suoran hallinnan rakennuslaadussa, materiaalivalinnassa ja toimitusaikatauluissa. Jokainen ty?pajaltamme lähtevä vene on rakennettu
    meidän ihmistemme toimesta, meidän laitteillamme, meidän standardeillamme.

material_traceability:
  tagline: Jäljitettävyys
  title: Materiaalien seuranta ja erävalvonta
  description: >-
    Jokainen raaka-aine-erä saa yksilöllisen eränumeron ERP-järjestelmässämme. Raaka-aineen saapumisesta tuotannon läpi valmiiksi tuotteeksi jokaisen veneen materiaaliluettelo on yhdistettävissä alkuperäiseen toimittajaerään. Tämä mahdollistaa täyden jäljitettävyyden ylöspäin kaikissa laatu- tai
    vaatimustenmukaisuuskyselyissä.
  system: Oma ERP (Qingdao Vatrad Groupin sisäinen järjestelmä) + fyysiset erätaudit jokaisella työtilauksella
  coverage: 100 % tuotantomateriaaleista — PVC, Hypalon, drop-stitch -kangas, liimat, venttiilit, metalliosat, pakkaus
  records_retained: 10 vuotta (CE 2013/53/EU -vaatimuksen mukaisesti)
  suppliers:
    - material: Meriluokan PVC
      source: Kiinalaiset ja korealaiset toimittajat
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanilainen toimittaja
      certified: ISO 9001, REACH
    - material: Drop-stitch-kangas
      source: Oma kudonta + ulkopuolinen kumppani
      certified: Sisäinen laadunvalvonta + toimittajan ISO 9001
    - material: Venttiilit ja varusteet
      source: Kiinalaiset OEM-toimittajat
      certified: ISO 9001, materiaalisertifikaatit eräkohtaisesti

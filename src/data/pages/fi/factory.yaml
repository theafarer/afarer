workshops_section:
  tagline: Työpajat
  title: Tuotantotyöpajat
  workshops:
    - title: PVC-leikkaus ja materiaalin valmistelu
      description: Automaattiset CNC-leikkauskoneet käsittelevät PVC-, Hypalon- ja drop-stitch-kankaita alle millimetrin tarkkuudella. Tietokoneoptimoitu sijoittelu minimoi materiaalihukkaa ja varmistaa, että jokainen paneeli täyttää mittamäärittelynsä ennen hitsausta.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Putkien hitsaus ja kuumasaumaus
      description: Erillinen hitsaustyöpaja kuumasaumauskoneilla ja RF-dielektrisillä puristimilla. Kuumailmatiivistimet liimaavat ja sulattavat PVC-putkikammioita, kun taas RF-hitsaus tuottaa lujia, ilmatiiviitä saumoja, jotka ylittävät ISO 6185 -vaatimukset.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: SUP-runkojen lasikuituvalmistus
      description: SUP-veneiden rungot valmistetaan käsinlaminoimalla lasikuitua polyesteri- ja vinyyliesterihartsijärjestelmillä. Jokainen kerros käsitellään käsin ja tyhjiöpussitetaan tasaisen laadun varmistamiseksi. Gelcoat-ruiskutuskoppi tuottaa korkeakiiltoisen, UV-kestävän meripinnan.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: SUP-painatus ja koristelu
      description: SUP-laudat koristellaan digitaalipainatuksella täysvärigrafiikoille ja silkkipainatuksella logoille ja toistuville kuvioille. Digitaalitulostimet tuottavat valokuvanlaatuisia kansikuvioita, kun taas silkkipainatus tuottaa kestäviä, kirkkaita brändimerkkejä.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    - title: Loppukokoonpano ja varustelu
      description: Kokoonpanolinja, jossa venttiilit, D-renkaat, kahvat, evätelineet ja kansipehmusteet asennetaan jokaiseen SUP-lautaan. Jokainen lauta noudattaa 100-pisteistä kokoonpanotarkistuslistaa, jonka tiiminvetäjä allekirjoittaa.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Laaduntestaus ja tarkastus
      description: Jokainen valmis vene käy läpi pakollisen ilmanpysyvyystestauksen, sauman vetolujuuden varmistuksen ja täydellisen järjestelmätarkastuksen ennen lähetystä. Laatulaboratoriomme toimii riippumattomana tuotannosta ja raportoi suoraan johdolle.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

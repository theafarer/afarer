  title: Miten drop-stitch toimii — Tekniikka kumipohjaisten jäykkien runkojen takana
  subtitle: 8 min lukemista
content_html: >
  <h2>Mikä on drop-stitch-rakenne?</h2>

  <p>Drop-stitch (kutsutaan myös nimellä "drop-stitch-kangas" tai "drop-stitch-sydän") on valmistusmenetelmä, jossa tuhannet yksittäiset polyesterilangat yhdistävät kankaankuoren ylä- ja alakerrokset. Kun kuori täytetään ilmalla, langat toimivat sisäisinä jännitysrakenteina —ne estävät ylä- ja
  alapaneeleita pullistumasta ulospäin pyöreäksi muodoksi ja pakottavat paneelin pysymään tasaisena ja jäykkänä.</p>

  <p>Tuloksena on kevyt ja helposti mukana kuljetettava rakenne, joka kestää 15 – 20 PSI:n sisäisen paineen —vertailukelpoinen jäykkyydeltään kovakuorisen laudan kanssa, mutta täysin tyhjennettävissä säilytystä ja kuljetusta varten.</p>


  <h2>Näin se toimii: fysiikka</h2>

  <p>Tavanomaisessa täytettävässä rakenteessa (kuten ilmapallossa tai ilmapatjassa) sisäinen ilmanpaine työntää tasaisesti kaikkiin suuntiin. Ilman sisäistä rajoitetta rakenne muuttuu sylinterimäiseksi tai pallomaiseksi. Drop-stitch ratkaisee tämän lisäämällä vetolujuutta vahvistavan rakenteen:</p>

  <ul>
    <li>Tuhannet langat yhdistävät kankaan ylä- ja alakerrokset</li>
    <li>Täytettäessä ilmanpaine pyrkii työntämään ylä- ja alakerrokset erilleen</li>
    <li>Langat vastustavat erottumista ja siirtävät kuorman jännitykseksi langan suuntaisesti</li>
    <li>Tuloksena on tasainen, jäykkä paneeli, joka vastustaa taipumista</li>
  </ul>


  <h2>Valmistusprosessi</h2>

  <ol>
    <li><strong>Kudonta:</strong> Polyesterilangat kudotaan samanaikaisesti kahteen erilliseen pohjakangaskerrokseen (tyypillisesti 1,100 DTEX tai 1,680 DTEX PVC-pinnoitettua polyesteriä). Langat kudotaan silmukkakuviona kerrosten välissä 90&deg;:n kulmassa.</li>
    <li><strong>Pinnoitus:</strong> Kudottu pohjakangas pinnoitetaan PVC:llä (tai satunnaisesti TPU:lla) kaulainpinnoitus- tai kalanterointimenetelmällä. Tämä sulkee langat ja luo ilmatiiviin kalvon.</li>
    <li><strong>Kerrosten liimaus:</strong> Drop-stitch-sydän liimataan ulkoisiin laminoituihin kerroksiin (tyypillisesti 0.9 mm tai 1.2 mm PVC) kuumalaminoinnilla tai liimaamalla.</li>
    <li><strong>Hitsaus:</strong> Reunakaistat hitsataan reunoja pitkin kuumailmahitsauksella, RF-hitsauksella tai korkeataajuushitsauksella laudan sivuseinien luomiseksi.</li>
    <li><strong>Venttiilien asennus:</strong> Asennetaan Boston- tai Halkey-Roberts-venttiilit, tyypillisesti paineenalennusmekanismilla ylitäytön estämiseksi.</li>
  </ol>


  <h2>Keskeiset laatuindikaattorit</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parametri</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Aloitustaso</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Langan tiheys</td><td class="p-3 border">1 lanka / neliötuuma</td><td class="p-3 border">2 lankaa / neliötuuma</td></tr>
      <tr><td class="p-3 border">Pohjakangas</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Enimmäispaine</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC:n paksuus</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Reunakaistan rakenne</td><td class="p-3 border">Taitettu &amp; liimattu</td><td class="p-3 border">Hitsattu &amp; sulaliitosliimattu</td></tr>
    </tbody>
  </table>


  <h2>Käyttökohteet</h2>

  <ul>
    <li><strong>SUP-laudat:</strong> 4" – 6" paksuus, 15 – 20 PSI, 1 – 2 lankaa/neliötuuma</li>
    <li><strong>Kajakit:</strong> Drop-stitch-pohja + täytettävät sivukammiot, 10 – 15 PSI:n pohja</li>
    <li><strong>RIB-pohjat:</strong> Drop-stitch-pohjat kevyisiin, pakattaviin RIB-peräveneisiin, 12 – 18 PSI</li>
    <li><strong>Veneen lepuuttajat:</strong> Matalapaineinen drop-stitch muotoiltuihin, tasapintaisiin lepuuttajiin</li>
  </ul>


  <h2>Drop-stitch vs. ilmakansi (lasikuitu- tai puusydän)</h2>

  <p>Kovakuorisissa laudoissa käytetään EPS-vaahtoydintä lasikuitu- tai puujäykisteillä. Ne ovat kevyempiä, jäykempiä ja herkempiä —mutta niitä ei voi tyhjentää. Drop-stitch vaihtaa osan jäykkyydestä täydelliseen kuljetettavuuteen. Useimmille vapaa-ajan käyttäjille nykyaikaiset
  drop-stitch-SUP-laudat 20 PSI:n paineella ovat jäykkyydeltään erottamattomia aloitustason kovakuorisista laudoista.</p>


  <h2>Näin Afarer käyttää drop-stitch-rakennetta</h2>

  <p>Afarer käyttää 1,680 DTEX drop-stitch-sydäntä koko SUP-mallistossaan, 2 langalla neliötuumaa kohti ja 1.2 mm PVC-ulkopinnoituksella. Laudat on mitoitettu 20 PSI:n paineelle ja ne käyvät läpi 24 tunnin painetestin 1.5-kertaisella nimellispaineella ennen toimitusta. Reunakaistat hitsataan
  kuumailmahitsauksella kolmikerroksisella sulaliitoksella, ja paineenalennusventtiilit ovat vakiona kaikissa malleissa.</p>

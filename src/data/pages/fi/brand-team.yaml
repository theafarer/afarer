hero:
  tagline: Tiimimme
  title: Ihmiset afarerin takana<br />—Suunnittelun vapaus vesillä
  subtitle: Vuonna 2012 Qingdaossa, Kiinassa perustettu afarer rakennettiin meri-insinöörien, materiaalitieteilijöiden ja vesiurheilun harrastajien toimesta, jotka uskoivat ammattitason kumiveneiden tekemiseen saataville maailmanlaajuisesti.
  image:
    src: /images/team-all.webp
    alt: afarerin koko tiimin kuva — suunnittelu, tuotanto ja johto
founding:
  tagline: Perustamme
  title: Rannikkopajasta<br />12 000 m² laitokseksi
  subtitle: afarer perustettiin meri-insinöörien toimesta, joilla on vuosikymmenten yhdistetty kokemus kumivenesuunnittelusta, PVC/Hypalon-valmistuksesta ja maailmanlaajuisesta merivarustevalmistuksesta.
  items:
    - title: 'Perustettu: 2012'
      description: Perustettu Qingdaossa, Kiinassa —merkittävä merenkulun keskus, jolla on syvä laivanrakennusperintö.
      icon: tabler:calendar
    - title: Yli 200 työntekijää
      description: Sisältäen 50+ T&K-insinööriä, laadunvalvonnan asiantuntijoita ja tuotantoteknikoita.
      icon: tabler:users
    - title: 12 000 m²:n laitos
      description: Erillinen tuotantolaitos, jossa on 6 tuotantolinjaa SUP-veneille, kumiveneille ja SUP-laudoille.
      icon: tabler:building-factory
    - title: Yli 50 palvellussa maassa
      description: Vie Eurooppaan, Amerikkaan, Lähi-itään, Aasia-Tyynimerelle ja Afrikkaan.

      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Suunnittelufilosofia
  title: Insinöörivetoinen suunnittelu<br />—jokainen yksityiskohta on tärkeä
  subtitle: Suunnittelufilosofiamme perustuu kolmeen periaatteeseen, jotka ohjaavat jokaista rakentamaamme tuotetta.
  list:
    - 'Luotettavuus ensin: Jokainen afarer-tuote on testattu kestämään todellisia olosuhteita – kylmän veden pelastustoimista trooppisten lomakohteiden vuokrauksiin. Suunnittelemme ylimitä, missä se on tärkeintä.'
    - 'Valmistuksen tarkkuus: Laitoksemme käyttävät CNC-leikkausta, korkeataajuushitsausta ja automatisoitua painetestausta. Jokainen sauma, jokainen venttiili ja jokainen liitin täyttää dokumentoidut vaatimukset.'
    - 'Jatkuva innovaatio: T&K-tiimimme arvioi uusia materiaaleja, tuotantomenetelmiä ja suunnitteluparannuksia jatkuvasti. Emme odota ongelmien ilmaantumista — vaan ennakoimme ne.'
cta:

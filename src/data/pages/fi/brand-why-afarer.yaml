features3_reasons:
  tagline: Why Choose afarer
  title: 'Seitsemän syytä kumppanuuteen kanssamme'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'Omistamme ja käytämme 12 000 m² tehdasta. Kun teet yhteistyötä afarerin kanssa, työskentelet suoraan ihmisten kanssa, jotka suunnittelevat, insinööri- ja rakentavat tuotteesi —ilman välittäjiä.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Suunnitteluprosessimme alkaa käyttötapauksesta, ei tuoteryhmästä. Optimoimme rungon muodon, materiaalivalinnan ja kokoonpanon sen mukaan, miten venettä todella käytetään.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'CE-sertifioitu, ISO-laatujärjestelmä, BSCI-vaatimustenmukainen, REACH-vaatimustenmukainen, USCG-hyväksytty. Jokainen tuote täyttää kansainväliset standardit —eikä vain väitteitä.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Putkien värit, konsolin asettelu, brändäys, pakkaus —räätälöimme tarpeidesi mukaan. Ei vähimmäistilauspaineita. Aloita prototyypillä, skaalaa luottavaisesti.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'Yhdysvaltain varasto Kaliforniassa, suorat lähetykset Qingdaosta, lentorahti kiireellisille tilauksille. Hoidamme tulliasiakirjat ja dokumentaation.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'Tuemme veneitä, jotka rakensimme 20 vuotta sitten. Aitoja varaosia, teknisiä neuvoja, korjausohjeita —tiimimme on käytettävissäsi kun tarvitset meitä.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Todelliset kuormitusluokitukset, todelliset mitat, todellinen paino. Ei markkinointi-inflaatiota. Se mitä julkaisemme on sitä mitä saat —riippumattoman testauksen vahvistamana.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Trusted by Brands Worldwide
  title: What Our Partners Say
  items:
    - content: 'We have worked with several manufacturers in China, but afarer stands out for their engineering support and consistent quality. They treat our brand as their own.'
      name: '—OEM Partner, European Water Sports Brand'
    - content: 'Their Hypalon RIBs have been in service with our fleet for over 5 years. Minimal maintenance, excellent UV resistance. The 5-year warranty on tubes gives us confidence.'
      name: '—Fleet Operator, Middle East Resort Group'
    - content: 'The afarer team helped us develop a custom SUP board design from concept to production in 90 days. The quality exceeded our expectations.'
      name: '—Distributor, Australian Watersports'

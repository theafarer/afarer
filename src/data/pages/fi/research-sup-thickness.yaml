meta:
  title: Näin valitset SUP-laudan paksuuden — tekninen analyysi | {SITE}
  description: 'Tekninen opas laukeavan SUP-lautan paksuuteen: kuinka 4", 5" ja 6" -taittaiset lautat eroavat jäkkyydessä, painossa, vakaudessa, jäljittämisessä ja suorituskyvyssä. Paksuussuositukset retkiä, joogaa, surfingä, kilpailua ja yleistä melontaa varten.'
back_text: Tutkimukseen
hero:
  tagline: Insinöörit
  title: Miten SUP-paksuus valitaan — Tekninen analyysi
  subtitle: 6 min lukemista
content_html: >
  <h2>Kolme vakiopaksuutta</h2>


  <h3>4" (10 cm) – Touring &amp; suorituskyky</h3>

  <ul>
    <li>Suurin jäykkyys – vähemmän taipumaa kuormituksessa</li>
    <li>Kevyin – vähemmän materiaalia, pienempi ilmamäärä</li>
    <li>Erinomainen suuntavakavuus – vähemmän sivuttaista keinuntaa</li>
    <li>Nopein – vähemmän vastusta, helpompi liuku</li>
    <li>Sopii parhaiten: touring-, kilpa- ja kuntomelontaan sekä kokeneille melojille</li>
  </ul>


  <h3>5" (12.7 cm) – Monikäyttö</h3>

  <ul>
    <li>Hyvä jäykkyys – tasapainoinen taipuman ja jäykkyyden suhde</li>
    <li>Kohtuullinen paino – vakiomateriaalien käyttö</li>
    <li>Hyvä ensisijainen + toissijainen vakavuus</li>
    <li>Sopii parhaiten: vapaa-ajan melontaan, aloittelijoille ja rentoon järvi- ja jokikäyttöön</li>
  </ul>


  <h3>6" (15.2 cm) – vakavuus &amp; jooga</h3>

  <ul>
    <li>Suurin ensisijainen vakavuus – massiivinen kelluvuus</li>
    <li>Raskain – enemmän PVC-materiaalia, suurempi ilmamäärä</li>
    <li>Hitain – enemmän vastusta, liukun säilyttäminen vaikeampaa</li>
    <li>Sopii parhaiten: joogaan/kuntoiluun, raskaille melojille (100+ kg) ja erittäin aallokkoisiin oloihin</li>
  </ul>


  <h2>Tekninen analyysi</h2>

  <p>Täytettävän SUP-laudan jäykkyys määräytyy sisäisen ilmanpaineen ja laudan poikkileikkauksen hitausmomentin mukaan. 20 PSI:n paineessa 4" lauta taipuu kuormituksessa noin 30 % vähemmän kuin saman levyinen ja pituinen 6" lauta. Ensisijainen vakavuus syntyy vesilinjan leveydestä ja kelluvuudesta;
  toissijaiseen vakavuuteen vaikuttavat laidan muoto ja laudan leveys.</p>


  <h2>Paksuus melojan painon mukaan</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Melojan paino</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Suositeltu paksuus</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Alle 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" tai 6"</td></tr>
      <tr><td class="p-3 border">Yli 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>Paksuuden ja PSI:n välinen kompromissi</h2>

  <p>Yleinen väärinkäsitys on, että korkeampi PSI voi kompensoida liiallista paksuutta. 25 PSI:n paineessa 6" lauta taipuu enemmän kuin 4" lauta 15 PSI:n paineessa, koska geometrinen hitausmomentti hallitsee jäykkyysyhtälöä. Suorituskykyä tavoitteleville melojille ohuempi lauta matalammalla
  paineella päihittää paksumman laudan korkeammalla paineella.</p>


  <h2>Afarerin mallisto</h2>

  <ul>
    <li><strong>4" laudat:</strong> Cheetah Touring -sarja – 12' x 30" x 4" touring-SUP-lautoja kunto- ja pitkämatkamela ntaan</li>
    <li><strong>5" laudat:</strong> Cheetah All-Round -sarja – 10'6" x 32" x 5" vapaa-ajan käyttöön</li>
    <li><strong>6" laudat:</strong> Cheetah Ultra-Stable -sarja – 10' x 34" x 6" joogaan, suurille melojille ja valokuvausalustoiksi</li>
  </ul>

  <p>Kaikissa laudoissa on 1 680 DTEX drop-stitch -ytimet 20 PSI:n mitoituspaineella ja 1,2 mm PVC-laminaatit.</p>

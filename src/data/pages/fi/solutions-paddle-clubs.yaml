meta:
  title: 'Paddle Club Fleet Solutions | {SITE}'
  description: 'Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.'

hero:
  tagline: Paddle Clubs
  title: 'Build Your Paddle Club<br />With Afarer'
  subtitle: 'Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Paddle club members on matching Afarer SUP boards

packages:
  title: Club Fleet Programs
  subtitle: "Choose the fleet program that matches your club's size and ambition."
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - '10 SUP boards + paddles + vests'
        - '2 pumps + 1 repair kit'
        - 'Club branding on boards'
        - 'Launch guide + safety checklist'
      cta_text: 'Start Your Club'
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - '30 SUP boards + paddles + vests'
        - '5 pumps + 2 repair kits'
        - 'Custom club colors + logo'
        - 'Replacement parts program (15% discount)'
        - 'Staff training session'
      cta_text: 'Build Your Fleet'
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - '50+ racing / performance boards'
        - 'Full accessory set'
        - 'Event support kit'
        - 'Priority parts (24h dispatch)'
        - 'Dedicated account manager'
      cta_text: 'Get Competition Fleet'

features:
  title: Why Clubs Choose Afarer
  subtitle: 'Consistent quality, fast parts, and bulk pricing built for growing clubs.'
  items:
    - title: '500+ Rental Cycles'
      description: 'Commercial-grade boards survive seasons of daily use.'
      icon: 'tabler:shield-check'
    - title: 'Custom Colors'
      description: 'Match your club identity with custom board colors and logo.'
      icon: 'tabler:palette'
    - title: 'Bulk Pricing'
      description: 'Volume discounts for fleet orders of 10+ boards.'
      icon: 'tabler:discount'
    - title: 'Fast Parts'
      description: 'Replacement parts shipped within 48 hours.'
      icon: 'tabler:truck-delivery'
    - title: 'Club Growth Support'
      description: 'Advice on membership programs, pricing, and event hosting.'
      icon: 'tabler:trending-up'
    - title: 'CE Certified'
      description: 'All equipment meets international safety standards.'
      icon: 'tabler:certificate'

cta:
  title: 'Ready to build your paddle club?'
  subtitle: 'Get your club fleet quote or download our club starter guide.'
  actions:
    - text: 'Apply for Club Fleet'
      href: '/contact?package=club'
      variant: 'primary'
    - text: 'Download Club Guide'
      href: '/resources/download-catalog'
      variant: 'secondary'

hero:
  tagline: Oppaat
  title: Uusi SUP:n parissa?
  subtitle: Käytännönläheisiä oppaita täytettävien SUP-lautojen valintaan, käyttöön ja niistä nauttimiseen.
size_guide:
  tagline: Koko ja tekniset tiedot
  title: Löydä oikea koko tarpeitasi varten
  desc: Vertaile SUP-lautasien mittoja, kuormituskykyä ja suositeltuja käyttökohteita. Tarvitsetko matkailu-SUPin, joogalautaan vai monikäyttöisen SUPin — koko-opas auttaa sinua valitsemaan oikean koon.
  link_label: Täysikokoinen opas tuotteiden eritelmillä →
  link: /size-guide
  cards:
    - title: SUP-laudat
      desc: Valitse pituus painosi ja käyttötarkoituksen mukaan. Leveämmät laudat (32"+) tarjoavat enemmän vakautta. Pidemmät laudat (11–12 ft) seuraavat paremmin matkailussa.
    - title: Matkailu-SUP-laudat
      desc: Pidemmät laudat (11–12 ft) kattamaan matkaa ja suoraan suuntaamiseen. Tarpeeksi vakaita retkeilyyn varusteiden kanssa. Tarkista aina kokonaiskuorma.
    - title: Yleiskäyttöiset SUP-laudat
      desc: Valitse pituus ajajan painon ja käyttötarkoituksen mukaan. Leveämmät laudat (32"+) tuovat vakautta. Monipuolinen virkistyskäyttöön ja kuntoiluun.

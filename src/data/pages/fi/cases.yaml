hero:
  tagline: 'Tapaustutkimukset'
  title: 'Oikeita projekteja, oikeita tuloksia<br />—afarer toiminnassa'
  subtitle: 'Katso, kuinka afarer tekee yhteistyötä jakelijoiden, brändien ja toimijoiden kanssa maailmanlaajuisesti toimittaakseen räätälöityjä merenkulun ratkaisuja jokaiseen sovellukseen.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'afarer tapaustutkimukset —räätälöityjä merenkulun valmistusprojekteja'
features3_cases:
  tagline: 'Valitut tapaukset'
  title: 'Räätälöityjä ratkaisuja<br />todellisiin haasteisiin'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Eurooppalainen sukelluskeskuslaivasto'
      description: 'Toimitettiin 12 SUP 520 -sukelluskonfiguroitua venettä Välimeren sukelluskeskusketjulle. Räätälöidyt säiliötelineet, sukellustikkaat ja laivaston brändäys. Toimitettu 60 päivässä.'
      icon: tabler:lifebuoy
    - title: 'Australialaisen jakelijan OEM-ohjelma'
      description: 'Kehitettiin private-label SUP-lautasarja australialaiselle vesiurheilujakelijalle. 8 mallia, räätälöity pakkaus ja drop-ship-logistiikka. Konseptista ensimmäiseen lähetykseen 90 päivässä.'
      icon: tabler:currency-dollar
    - title: 'Pelastusvenetoimitus Lähi-itään'
      description: 'Toimitettiin 20 SUP 450 Patrol -venettä Lähi-idän väestönsuojelujärjestölle. Itse tyhjentyvät kannet, täysi navigointilaitteisto ja korkeanäkyvyyden oranssit putket. Paikallisten säädösstandardien noudattaminen.'
      icon: tabler:alert-triangle
    - title: 'Eurooppalainen OEM-brändikumppanuus'
      description: 'White-label-valmistuskumppanuus eurooppalaisen meribrändin kanssa. 5 SUP-mallia, yksityinen brändäys, yksinoikeudelliset jakeluoikeudet EU-markkinoille. Monivuotinen sopimus.'
      icon: tabler:building
    - title: 'Karibian lomakeskuslaivasto'
      description: 'Täydellinen vesiurheiluvälinepaketti Karibian lomakeskukselle: 40 SUP-lautaa, 20 kajakkia, 10 kumivenettä ja tarvikkeita. Räätälöity lomakeskuksen brändäys kaikissa välineissä.'
      icon: tabler:beach
    - title: 'Yhdysvaltain rannikkovartioston sopimus'
      description: 'Toimitettiin SUP 600 -partioveneitä Yhdysvaltain rannikkoturvallisuusvirastolle. Kaksoismoottorikonfiguraatio, panssaroidut konsolivaihtoehdot ja sotilaselektroniikan integrointi.'
      icon: tabler:shield
cta:
  title: 'Onko sinulla projekti, josta haluat keskustella?'
  subtitle: 'Jokainen afarer-kumppanuus alkaa keskustelulla. Kerro meille vaatimuksistasi ja kehitämme ratkaisun.'
  actions:
    - variant: primary
      text: 'Aloita projektisi'
      href: /contact
    - text: 'Katso valmiuksiamme'

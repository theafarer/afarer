vision:
  tagline: Visioimme
  title: Vesiuheilun tulevaisuuden muovaaminen
  body: >-
    afarer pyrkii johtamaan täytettävien veneiden ja SUP-lautojen toimialaa jatkuvan innovoinnin, horjumattoman laadun sekä lujan turvallisuus- ja kestävyyssitoumuksen kautta — rikastaen lopulta vesiliikuntaharrastajien kokemuksia maailmanlaajuisesti. Afarerin tutkimus- ja tuotekehityskeskus on
    paikka, jossa intohimo kohtaa innovaation ja jossa asetetaan uusia standardeja vesiliikunta-alalle.
labs_section:
  tagline: Laboratoriot
  title: Laboratoriomme
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC-kangaslaboratorio
      description: Jatkuva tutkimus ja testaus PVC- ja Hypalon-putkikangauksissa vetolujuuden, UV-säilyvyyden, kohoutuksen ja matalan lämpötilan joustavuuden takaamiseksi meriympäristössä.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Rungon suunnittelustudio
      description: CAD-ohjaussuunnittelu ja rajattomeen elementtimenetelmään perustuva HDPE-, alumiini- ja lasikuiturunkojen analyysi. Jokainen runko digitaalisimuloidaan jännitysjakauman ja iskunkestävyyden osalta ennen ensimmäisen prototyyppin rakentamista.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: RF-hitsauskeskus
      description: Oma radiotaajuushitsauslaitos tarkalla lämpötila- ja paineensäädöllä, joka tuottaa korkealujuuisia, tiiviitä liitoksia, jotka täyttävät ilmatäytteisiä veneitä koskevat meriteollisuuden standardit.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Dynaaminen testiallas
      description: Mittakaavamallien testaus sisäisessä testialtaassamme runkomuodon, suorituskyvyn, vakauden ja polttoainetehokkuuden optimoimiseksi eri kuormitus- ja merioloissa.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: Prototyyppipaja
      description: Täysmittakaavan prototyyppi- ja varustuslaitos, jossa uudet mallit rakennetaan, asennetaan ja meritestataan. Jokainen prototyyppi suorittaa vähintään 20 tunnin vesitestiohjelman ennen tuotantohyväksyntää.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Laatu- ja tarkastuslaboratorio
      description: Omistettu laadunvarmistuslaboratorio suorittaa venymätestaus, ilmanpidättesyklit, saumojen irrotustestit ja materiaalisertifikaation, joka varmistaa, että jokainen työpajalta lähtevä vene täyttää julkaistut erittelymme.
      href: /randdcenter/quality-inspection-lab

meta:
  title: T&K-keskus | {SITE}
  description: Tutkimus ja tuotekehitys — PVC-kangastestaus, rungonsuunnittelu, RF-hitsaus, hydrodynaaminen testaus ja laadunvalvonta. Räätälöityjä T&K-palveluita saatavilla.
hero:
  tagline: T&K-keskus
  title: Tutkimus- ja kehityskeskus
  subtitle: Keskittynyt edistymiseen
intro:
  - >-
    afarerin Tutkimus- ja kehittämiskeskus (R&D) on voima, joka ajaa missiötämme vallankumouksellisesti muuttaa vesilajien välineitä. Autamme vesilajien harrastajia ympäri maailmaa tarjoamalla turvallisempia, mukavampia ja nautittavampia tuotteita jatkuvalla innovaatiolla ilmatäytettävien
    SUP-lautojen ja venkeiden saralla. Innokas insinööri-, suunnittelija- ja asiantuntijatiimimme muotoilee alan tulevaisuutta ja nostaa jatkuvasti rimaa laadun, suorituskyvyn ja kestävyyden osalta.
  - >-
    Tuotekehityslaitoksemme kokoaa materiaalitiedemiehiä, laivanrakennusarkkitehteja ja tuotantoinsinöörejä saman katon alle. Kankaan koostumuksesta ja runkosimulaatiosta hitsausprosessin kehittämiseen ja täysmittaisiin meritestauksiin, jokainen tuotekehityksen vaihe on dataa ohjaama ja testausta
    vahvistama.
mission:
  tagline: Meidän missiomme
  title: Vesiurheilun tulevaisuuden innovointi
  pillars:
    - icon: lightning
      title: Teknologinen kehitys
      desc: Uusien materiaalien, suunnittelujen ja valmistusmenetelmien edelläkävijä tuotteiden suorituskyvyn ja kestävyyden parantamiseksi.
    - icon: design
      title: Keskitetty käyttäjän suunnittelu
      desc: Käyttäjien tarpeiden syvällinen ymmärtäminen ja ylittäminen ergonomisella ja intuitiivisella tuotesuunnittelulla.
    - icon: globe
      title: Kestävät käytännöt
      desc: Pienennämme ympäristöjalanjälkeämme ympäristöystävällisiä materiaaleja ja prosesseja käyttämällä.
    - icon: shield
      title: Tinkimätön turvallisuus
      desc: Turvallisimman tason varmistaminen tiukan testauksen ja sertifioinnin kautta.
pillars:
  - title: Teknologinen kehitys
    desc: Uusien materiaalien, suunnittelujen ja valmistusprosessien edelläkävijä tuotteen erinomaisen suorituskyvyn ja pitkäikäisyyden varmistamiseksi.
    icon: tech
  - title: Edistyneet materiaalit
    desc: Tutkimelemme edistyneintä PVC:ää, Hypalonia, komposiitteja ja kestäviä vaihtoehtoja tuotteiden parantamiseksi.
    icon: materials
  - title: Kestävyys
    desc: 'Perussitoumus: Omistaudumme ympäristönvastuullisuuteen kestävän tuotannon ja kierrätettävien materiaalien avulla.'
    icon: sustainability
capabilities:
  tagline: Valmiudet
  title: Tutkimus- ja kehityskyvyt
  subtitle: Neljä ydintoimintoa, jotka antavat meille kattavan hallinnan tuotekehitykseen — raaka-ainetutkimuksesta lopulliseen sertifiointiin.
  groups:
    - title: Materiaalitiede ja kangasteknologia
      items:
        - PVC- ja Hypalon-formulaatioiden analyysi ja optimointi
        - UV-stabiloinnin, palonsuojan ja antimikrobisten lisäaineiden kehitys
        - Monikerroskangan liimuman ja liimauksen insinööriotos
        - Kiikeytetty ikääntymistestaus (UV, lämpötila, kosteus, suolalöyly)
    - title: Rungon suunnittelu ja dynamiikka
      items:
        - Parametrinen 3D-rungonsuunnittelu ja CFD-optimoiminen
        - Raja-elementtianalyysi rakenteellisille ja iskukuormille
        - Mittakaavamallien vetoallas-testaus ja suorituskyvyn validointi
        - Mukautetun rungon kehitys erityistehtäville
    - title: Hitsaus- ja yhdistämistekniikka
      items:
        - RF-dielektrisen hitsausprosessin kehittäminen ja optimointi
        - Kuumailma-, kuumakiila- ja ultraäänihitsausmenetelmät
        - Liimauksen ja saumanauhan kelpoisuustestaus
        - Hitsauslujuuden mallintaminen ja käyttöiän ennustaminen
    - title: Testaus, sertifiointi ja vaatimustenmukaisuus
      items:
        - Laadunhallinto ja CE-vaatimustenmukaisuustesti
        - Riippumaton kolmannen osapuolen testaus ja sertifiointituki
        - Oman testiprotokolan kehittäminen hankintakvalifikaatioon
        - Käyttövika-analyysi ja juurisyynen tutkimus

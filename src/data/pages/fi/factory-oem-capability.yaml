intro: >-
  Afarer tarjoaa kattavat OEM- ja ODM-palvelut brändeille, jakajille ja viranomaisille ympäri maailmaa. Yli 10 vuoden vientikokemuksella ja 12 000 m²:n ISO 9001- ja BSCI-sertifioidulla tehtaalla hoidamme kaiken tuotesuunnittelusta ja muun kehityksestä täysimittaiseen tuotantoon, pakkaamiseen ja
  logistiikkaan.

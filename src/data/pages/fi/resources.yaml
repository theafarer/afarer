hero_text:
  tagline: Resources
  title: 'Latauskeskus & Ostooppaat'
  subtitle: 'Tutustu tuoteluetteloihin, OEM-oppaisiin, ostajan tarkistuslistoihin ja teknisiin asiakirjoihin tehdäksesi tietoon perustuvia hankintapäätöksiä.'
features3_downloads:
  tagline: Downloads
  title: 'Tuotedokumentaatio<br />& Ostajan resurssit'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Täydellinen tuotevalikoima sisältäen SUP-veneitä, kumiveneitä, SUP-lautoja, kajakkeja ja tarvikkeita. Tekniset tiedot, kokoonpanot ja vaihtoehdot. PDF-muodossa.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'Kaikki mitä sinun tarvitsee tietää OEM/ODM-kumppanuuksista: prosessin yleiskatsaus, vähimmäistilausmäärät, räätälöintivaihtoehdot, laadunvalvonta ja toimitus.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'Kuinka valita oikea SUP: rungon materiaalit, putkien materiaalit, moottorin valinta, kokonäkökohdat ja kokoonpanovaihtoehdot eri käyttötarkoituksiin.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'Keskeisiä huomioon otettavia seikkoja valittaessa SUP-lautavalmistajaa: laatuindikaattorit, sertifiointivaatimukset, MOQ-näkökohdat ja mitä etsiä tehdastarkastuksessa.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC vs Hypalon: kestävyyden, UV-kestävyyden, käyttöiän, korjausvaihtoehtojen ja kustannusnäkökohtien vertailu eri merisovelluksiin.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'Lataa tuotebrief-mallimme. Täytä vaatimuksesi ja palauta se meille saadaksesi tarjouksen ja toteutettavuusarvion samalla viikolla.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Yleisiä kysymyksiä tuotteistamme, valmistusprosessistamme ja kumppanuusmallistamme.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ vaihtelee tuoteryhmittäin. SUP-veneet alkavat tyypillisesti 10 yksiköstä mallia kohden. SUP-laudat 50 yksiköstä. Ota yhteyttä myyntitiimiimme saadaksesi tuotekohtaisia MOQ-tietoja.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Kyllä. afarer tarjoaa näytevalmistusta arviointia varten ennen massatuotantoa. Näytekustannukset ovat neuvoteltavissa ja hyvitetään usein ensimmäistä tuotantotilausta vastaan.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Vakioehdot ovat 30% käsiraha tilauksen yhteydessä, 70% ennen lähetystä. LC-ehdot saatavilla hyväksytyille asiakkaille. Ota yhteyttä rahoitustiimiimme keskustellaksesi järjestelyistä.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Tyypilliset toimitusajat: SUP-veneet 30-45 päivää, SUP-laudat 20-30 päivää, kumiveneet 25-35 päivää. Räätälöity kehitys lisää 15-30 päivää prototyyppien valmistukseen.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'CE-sertifiointi EU-markkinoille, US Coast Guard -hyväksytty valmistus, ISO-laatujärjestelmä, BSCI-vaatimustenmukaisuus ja REACH-materiaalivaatimustenmukaisuus.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Kyllä. Tarjoamme mukautetut pakkaukset logollasi, väreilläsi ja brändi-identiteetilläsi. MOQ mukautetuille pakkauksille riippuu tuoteryhmästä.'
      icon: tabler:color-swatch
cta:
  title: 'Tarvitsetko apua oikean resurssin löytämisessä?'
  subtitle: 'Ota yhteyttä tiimiimme saadaksesi henkilökohtaista opastusta tuotevalinnasta, OEM-kumppanuuksista tai teknisistä tiedoista.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

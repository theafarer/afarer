hero:
  tagline: Materiaalit
  title: PVC vs Hypalon — tekninen vertailu ilmatäytettäville veneille
  subtitle: 10 min lukuaika
content_html: >
  <h2>Materiaaliylikatsaus</h2>


  <h3>PVC (polyvinyylikloridi)</h3>

  <p>PVC on termoplastinen polymeeri, jota käytetään laajalti täytettävien veneiden valmistuksessa. Merikäytössä se vahvistetaan tyypillisesti polyesterikankaalla (1,100 – 1,680 DTEX) ja pinnoitetaan molemmilta puolilta. Nykyaikaiset meri-PVC-formulaatiot sisältävät UV-stabilisaattoreita ja
  pehmittimiä, jotka parantavat joustavuutta ja säänkestävyyttä.</p>


  <h3>Hypalon (CSM – kloorisulfonoitu polyeteeni)</h3>

  <p>Hypalon on synteettinen kumiyhdiste (jota nykyään valmistetaan yleisesti CSM:nä sen jälkeen, kun DuPont lopetti Hypalon-tavaramerkkituotannon). Se tunnetaan poikkeuksellisesta UV- ja otsoninkestävyydestään, minkä vuoksi se on suosituin materiaali ammatti- ja sotilastason täytettäviin veneisiin,
  jotka viettävät pitkiä aikoja suorassa auringonvalossa.</p>


  <h2>Vertailu rinnakkain</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Ominaisuus</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">PVC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Hypalon (CSM)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">UV-kestävyys</td><td class="p-3 border">Hyvä (stabilisaattoreiden avulla)</td><td class="p-3 border">Erinomainen (luontaisesti)</td></tr>
      <tr><td class="p-3 border font-medium">Kulutuskestävyys</td><td class="p-3 border">Hyvä</td><td class="p-3 border">Erittäin hyvä</td></tr>
      <tr><td class="p-3 border font-medium">Vetolujuus</td><td class="p-3 border">3,000 – 5,000 N/5cm</td><td class="p-3 border">2,500 – 4,000 N/5cm</td></tr>
      <tr><td class="p-3 border font-medium">Paino (per m&sup2;)</td><td class="p-3 border">850 – 1,200 g</td><td class="p-3 border">1,100 – 1,500 g</td></tr>
      <tr><td class="p-3 border font-medium">Kylmätaipuisuus (matala lämpötila)</td><td class="p-3 border">-30&deg;C</td><td class="p-3 border">-20&deg;C</td></tr>
      <tr><td class="p-3 border font-medium">Korjattavuus</td><td class="p-3 border">Helppo (lämpöhitsaus tai liimaus)</td><td class="p-3 border">Vaatii erityisen CSM-liiman</td></tr>
      <tr><td class="p-3 border font-medium">Liitosmenetelmä</td><td class="p-3 border">RF-hitsaus, kuumailmahitsaus</td><td class="p-3 border">Käsinliimaus (kosketusliima)</td></tr>
      <tr><td class="p-3 border font-medium">Hinta (materiaali)</td><td class="p-3 border">$8 – $15 / m&sup2;</td><td class="p-3 border">$20 – $40 / m&sup2;</td></tr>
      <tr><td class="p-3 border font-medium">Käyttöikä (trooppinen aurinko)</td><td class="p-3 border">5 – 8 vuotta</td><td class="p-3 border">10 – 15 vuotta</td></tr>
    </tbody>
  </table>


  <h2>Kumman valitsisit?</h2>


  <h3>Valitse PVC, kun:</h3>

  <ul>
    <li>Budjetti on ensisijainen kriteeri</li>
    <li>Vene säilytetään poissa suorasta auringonvalosta</li>
    <li>Painolla on väliä (PVC on 15 – 25 % kevyempää)</li>
    <li>Tarvitset kylmänkestävää joustavuutta alle -20&deg;C lämpötiloissa</li>
    <li>Haluat laajemman värivalikoiman</li>
  </ul>


  <h3>Valitse Hypalon, kun:</h3>

  <ul>
    <li>Vene on kiinnitettynä tai säilytetään suorassa auringonvalossa</li>
    <li>Toimit trooppisessa tai voimakkaan UV-säteilyn ympäristössä</li>
    <li>Maksimaalinen kestävyys ja käyttöikä ovat etusijalla</li>
    <li>Varustat ammatti- tai kaupallisia laivastoja</li>
    <li>Hiekan, betonin tai laiturien aiheuttama kuluminen huolestuttaa</li>
  </ul>


  <h2>Valmistuksen erot</h2>

  <p>PVC-veneet valmistetaan RF- (radiotaajuus-) hitsauksella tai kuumailmahitsauksella, joka luo molekyylitason sidoksen pinnoitettujen kangaskerrosten välille. Tämä mahdollistaa automatisoidun, tasalaatuisen tuotannon suurella kapasiteetilla. Hypalon-veneet kootaan käsin kosketusliimalla. Jokainen
  sauma rullataan ja puristetaan käsin, mikä tekee Hypalon-tuotannosta työvoimavaltaisempaa.</p>


  <h2>Afarerin suositus</h2>

  <p>Useimmille virkistyskäyttäjille moderni, korkealaatuinen UV-stabilisoitu PVC tarjoaa parhaan tasapainon hinnan, painon, suorituskyvyn ja kestävyyden välillä. Afarer käyttää 1,680 DTEX -meri-PVC:tä kolmikerroksisella pinnoitteella kuluttaja- ja OEM-tuotelinjoissaan. Kaupallisille ja
  julkishallinnon asiakkaille, jotka altistavat veneet pitkäaikaiselle UV-säteilylle, tarjoamme pyynnöstä Hypalon-valmistusta.</p>

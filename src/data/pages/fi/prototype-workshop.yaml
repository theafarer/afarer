intro: >-
  CAD-malli, olipa se kuinka yksityiskohtainen tahansa, ei voi paljastaa, miten vene todellisuudessa käyttäytyy, ennen kuin se lasketaan veteen. Siksi prototyyppipajamme on suunniteltu muuttamaan suunnittelutiedot fyysiseksi, merikelpoiseksi veneeksi mahdollisimman nopeasti ja tarkasti. Jokainen
  uusi {SITE.name}-malli — ja jokainen merkittävä mittatilausvene — käy tämän pajan läpi ennen kuin tuotantotyökalut lyödään lukkoon.
content_html: >
  <h2>Missä suunnittelu muotoutuu todellisuudeksi</h2>

  <p>Työpaja on varustettu täysimittaisille rungon, piipujen ja riggarin samanaikaiselle valmistukselle. Tämä rinnakkainen työnkulku lyhentää prototyypin valmistusaikaa 8–12 viikkoon insinöörin luovutuksesta lähtien, verrattuna teollisuuden normiin 16–20 viikkoa. Kun sovelluksessasi vaaditaan
  erikoistunutta ratkaisua, voimme siirtyä konseptista vesikokeisiin alle kolmessa kuukaudessa.</p>


  <h2>Työpajan valmiudet</h2>

  <table>
    <thead><tr><th>Työasema</th><th>Varusteet</th><th>Tarkoitus</th></tr></thead>
    <tbody>
      <tr><td>Rungon valmistus</td><td>Kiertomuovausuuni (HDPE), TIG-hitsausbaari (alumiini), käsinlasittumis-mallit (lasikuitu)</td><td>Rungon täysmittainen valmistus kaikissa kolmessa materiaalityypissä</td></tr>
      <tr><td>Piipun kokoonpano</td><td>RF-hitsauspaine, kuuman ilman liitosasema, kuivauspaine testiviite</td><td>Täysikokoonpanoisten piipu-kokoonpanojen valmistus kaikkine suojilla, konoin ja venttiilein</td></tr>
      <tr><td>Riggaru ja asennus</td><td>Moottorin nosturi (500 kg), ohjaimen mallikehys, hydraulinen letkenpuristin, sähköasennuspaneeli</td><td>Kokonaisvarustelu: moottori, ohjaus, säätö, polttoainevälineistö, elektroniikka, istumiset</td></tr>
      <tr><td>Irtaimistobay</td><td>GPS-nopeus-anturi, polttoainevirtamittari, kiihdyttimet, termokoppisarja, tietojen tallentaja</td><td>Meretkokeen irttaimiston asennus ja kalibrointi</td></tr>
    </tbody>
  </table>


  <h2>Prototyypin matka — vaihe vaiheelta</h2>

  <ol>
    <li><strong>Insinöörin luovutus</strong> — Suunnittelupaketti (3D-malli, FEA-raportti, osalta lista, kerrosohjelma) tarkastetaan virallisesti työpajan johtajan ja projekti-insinöörin toimesta. Kaikki valmistuskysymykset merkitään ja ratkaistaan ennen leikkauksen aloittamista.</li>
    <li><strong>Rungon tuotanto</strong> — Runko rakennetaan insinöörin tarkennuksen mukaan. HDPE:lle kiertomuovausohjelma ladataan Moldex3D-simulaatiosta. Alumiinille: CNC-leikatut levyt hitataan TIG-bayssa hyväksytyn hitsauskaavion mukaisesti. Lasikuidulle: kerros-kirjaa seurataan kerros kerrallaan.</li>
    <li><strong>Piipun valmistus</strong> — Kangas leikataan CNC-pohjatietojen mukaan, sitten RF-hitataan täysikokoisiin kammioihin. Jokainen kammio puhallettiin testipaineeseen ja jäätetään 24 tuntia alustusta varten.</li>
    <li><strong>Kokoonpano ja riggaru</strong> — Runko ja piiput liitetään. Moottori ripustetaan, ohjaus ja säätö yhdistetään, polttoainevälineistö asennetaan ja kaikki sähköpiirit kytketään ja varmistetaan.</li>
    <li><strong>Staattiset testit</strong> — Ennen kuin vene koskettaa vettä, se läpäisee: kelluntatarkistus (kokolasti + 30 % varavuoro), polttoainevälineistön painekoe, ohjausjärjestelmän täys lukituskiertokoe, sähkön maapainokokkuuden jatkuvuuskoe.</li>
    <li><strong>Meretkoeohjelma</strong> — 20 tuntia vedessä testausta, yksityiskohtaisesti alla.</li>
    <li><strong>Prototyypin tarkistus</strong> — Virallinen hyväksymiskokous järjestetään insinöörien, tuotannon ja laadun tiimien kanssa. Kaikki tarvittavat suunnittelumuutokset dokumentoidaan ja sisällytetään tuotannon luovutukseen.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-Tunnin Meretkoeohjelma — Testausaikataulu</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Sataman manöövöinti — hitaankin käsittelyn perusteella, perä, fenderitarkistus</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Nopeuskokeet — GPS-tarkistettu huippunopeus, kruiisiknopeus, polttoaineen kulutus 3 RPM-kohdassa</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Kääntötestit — taktinen halkaisija, eteneminen ja siirtymä 20 solmissa, vasemmalla ja oikealla</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Koputustestit — toistuvat kulut 0,5–1,0 m aaltoissa; kiihdyttin ohjauksen paikan pohjassa</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Stabiilisuustestit — staattinen kallistuskulma 4 miehistö + varuste oikealle, epitasainen kuorma</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Kestävyysajo — 3 tuntia jatkuvasti kruiisiknopeudella; lämpötilan seuranta (moottori, polttoaine, sähkö)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Lopullinen tarkastus — tentin jälkipyyhi kaikille järjestelmille, kiristä/tarkasta kaikki kiinnitykset, dokumentoi tulokset</span>
      </div>
    </div>
  </div>


  <h2>Erityisprototyypit yksilöllisiin käyttötapauksiin</h2>

  <p>Prototyypityöpaja on se paikka, jossa ratkaistaan ne ongelmat, joita normaali tuotannon venettä ei pysty. Viimeaikaisia esimerkkejä:</p>

  <ul>
    <li>7,8 m RIB etsimisen ja pelastusjärjestölle, joka vaatii mukautettu kannen rakenteen kaatumisensuojan, integroidut istumakannattimet ja keulassa sijaitsevan sonar-kopan — kaikki prototyypit asennettu ja testattu laitoksellamme.</li>
    <li>5,2 m tulehtuva vedetilanteelle hydrografinen mittausurakoitsija, katkaisulla keulalla, irrotettavalla mittausmastolla ja läpi-runton transduser-taskuilla, jotka on suunniteltu virran häiriön minimoimiseksi.</li>
    <li>Sähköajurin 4,5 m suojusvene superveren, jossa prototyyppi käytettiin toiminnan, latausinfrastruktuurin ja melutasojen validointiin ennen kuin asiakas sitoutui neljän laivaston.</li>
  </ul>


  <h2>Prototyypintiimi</h2>

  <p>Työpajassa työskentelee kahdeksan monitaitoisia meriteknikkoa, joista jokainen on koulutettu vähintään kahdessa kolmesta ydinaluetta (runko, piipu, riggaru). Tiimin johtaja on mestari veneenrakentaja 16 vuoden kokemuksella yksilölliset kerran rakennetut rakenteet tuotantosarjoihin. Jokaiselle
  prototyypille tulee eriko projekti-insinööri, joka toimii asiakkaan ainoana yhteyshenkilönä koko rakennus- ja kokeen ajan.</p>


  <h2>Asiakkaan osallistuminen</h2>

  <p>Kannustamme aktiivisesti asiakkaitamme osallistumaan prototyypin rakennuksen tärkeisiin virstanpylväisiin — erityisesti alkuvarustelun tarkastus ja meretkoe. Toiminnallinen palaute näissä vaiheissa on arvokasta veneen hienosäätämiseksi ennen kuin tuotteisto tulee tuotantoon. Emme rakenna
  tyhjiössä; rakennamme kumppanina kanssanne.</p>

  <p>20 tunnin meretkoe on myös mahdollisuus teidän tiimienne tutustua veneen kuljetukseihin, järjestelmien asetteluun ja huolto vaatimuksiin, mikä varmistaa sujuvan siirtymisen palvelukseen kun tuotannon veneet luovutetaan.</p>

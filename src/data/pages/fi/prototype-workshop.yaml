intro: >-
  CAD-malli, olipa se kuinka yksityiskohtainen tahansa, ei voi paljastaa, miten lauta todellisuudessa käyttäytyy, ennen kuin se kohtaa veden. Siksi prototyyppipajamme on suunniteltu muuttamaan suunnittelutiedot fyysiseksi, vesikelpoiseksi laudaksi mahdollisimman nopeasti ja tarkasti. Jokainen
  uusi Afarer-malli — ja jokainen merkittävä mittatilausrakennus — käy tämän pajan läpi ennen kuin tuotantotyökalut vahvistetaan.
content_html: >
  <h2>Missä suunnittelu muuttuu todellisuudeksi</h2>

  <p>Työpaja on täysin varusteltu rungon, reunojen ja varustelun samanaikaiseen valmistukseen. Tämä rinnakkainen työnkulku lyhentää prototyypin valmistusaikaa 8–12 viikkoon insinöörin luovutuksesta lähtien, verrattuna teollisuuden normiin 16–20 viikkoa. Kun sovelluksessasi vaaditaan
  erikoistunutta ratkaisua, voimme siirtyä konseptista vesikokeisiin alle kolmessa kuukaudessa.</p>


  <h2>Työpajan valmiudet</h2>

  <table>
    <thead><tr><th>Työasema</th><th>Varusteet</th><th>Tarkoitus</th></tr></thead>
    <tbody>
      <tr><td>Rungon valmistus</td><td>CNC-kankaanleikkuri, kuumalaminointipuristin, drop-stitch-ytimen valmistusasema</td><td>Täysimittainen rungon valmistus kaikissa kolmessa rakennetyypissä</td></tr>
      <tr><td>Reunojen ja kammioden kokoonpano</td><td>RF-hitsauspuristin, kuuman ilman esikiinnitysasema, ilmanpainetestijigi</td><td>Täysikokoisten reuna- ja kammio-kokoonpanojen valmistus kaikkine väliseinineen ja venttiileineen</td></tr>
      <tr><td>Varustelu ja asennus</td><td>Eväkiskojen uritusjigi, lastikiinnikkeiden ja kahvojen hitsauskiinnikkeet, kansipehmusteen leikkausasema</td><td>Täydellinen varustelu: evät, lastikiinnikkeet, taljaplugit, kahvat, kansipehmusteet, venttiilit</td></tr>
      <tr><td>Instrumentointilahti</td><td>GPS-nopeusanturi, paineanturit, kiihtyvyysanturit, termoparritosarja, datankeruulaite</td><td>Meritestien instrumentoinnin asennus ja kalibrointi</td></tr>
    </tbody>
  </table>


  <h2>Prototyypin matka — vaihe vaiheelta</h2>

  <ol>
    <li><strong>Insinöörin luovutus</strong> — Suunnittelupaketti (3D-malli, FEA-raportti, osaluettelo, laminointiohjelma) tarkastetaan virallisesti työpajan johtajan ja projekti-insinöörin toimesta. Kaikki valmistukseen liittyvät huolenaiheet merkitään ja ratkaistaan ennen leikkauksen aloittamista.</li>
    <li><strong>Rungon tuotanto</strong> — Runko rakennetaan insinöörin spesifikaation mukaan. Yksikerrosrakenteessa drop-stitch-ydin laminoidaan määritetyllä PVC-päälliskankaalla. Kaksikerrosrakenteessa ylimääräinen päälliskangas levitetään pohjalaminaatin päälle ennen kaavan leikkaamista. Fuusiorakenteessa laminointiparametrit ladataan hyväksytystä prosessilomakkeesta ja varmistetaan ensikappaleella.</li>
    <li><strong>Reunojen valmistus</strong> — Kangas leikataan CNC-kaavamalleilla, sitten RF-hitataan täysikokoisiksi reunoiksi ja kammioiksi. Jokainen kammio paiskotaan testipaineeseen ja jätetään 24 tunniksi alkuvakautusta varten.</li>
    <li><strong>Kokoonpano ja varustelu</strong> — Runko ja reunat liitetään toisiinsa. Eväkiskot ja lastikiinnikkeet asennetaan, taljaplugit ja kantokahvat asennetaan, täyttöventtiili kiristetään paikalleen ja kansipehmuste liimataan ja kohdistetaan.</li>
    <li><strong>Staattiset testit</strong> — Ennen kuin lauta koskettaa vettä, se läpäisee: kelluntatarkistus (täysi kuorma + 30 % varalla), kammion painepitotesti, venttiilin vuototesti, kahvojen ja kiinnikkeiden vetotesti.</li>
    <li><strong>Merikoeohjelma</strong> — 20 tuntia vedessä testausta, yksityiskohtaisesti alla.</li>
    <li><strong>Prototyypin tarkistus</strong> — Virallinen hyväksymiskokous järjestetään suunnittelu-, tuotanto- ja laaturyhmien kanssa. Kaikki tarvittavat suunnittelumuutokset dokumentoidaan ja sisällytetään tuotantojulkaisuun.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20 tunnin merikoeohjelma — Testiaikataulu</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Tutustuminen tyynellä vedellä — hitaan vauhdin suuntavakaus, kääntyminen, asento- ja trimmitarkistus</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Nopeuskoe — GPS-varmistettu huippunopeus, matkanopeus, ylläpidetty vauhti 3 melontatahdissa</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Kääntötesti — työkäännöksen ja sivumelonnan säde, laudan vaste, vasen ja oikea puoli</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Aallokkotesti — toistuvat ajot 0,5–1,0 m aallokossa; kiihtyvyysanturi melojan asentokohdassa</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Vakautesti — staattinen kallistuskulma 4 eripainoisella melojalla, siirretty kuorma oikealle puolelle</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Kestävyyssuju — 3 tuntia jatkuvasti matkanopeudella; kammion paineen, reunan lämpötilan ja melojan väsymyksen seuranta</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Lopullinen tarkastus — kokeen jälkeinen tarkastus kaikille komponenteille, kiristä/tarkasta kaikki kiinnikkeet, dokumentoi havainnot</span>
      </div>
    </div>
  </div>


  <h2>Mukautettu prototyyppityö ainutlaatuisiin käyttötapauksiin</h2>

  <p>Prototyyppityöpaja on paikka, jossa ratkomme ongelmat, joita normaalit tuotantolaudat eivät pysty ratkaisemaan. Viimeaikaisia esimerkkejä:</p>

  <ul>
    <li>Korkean näkyvyyden pelastus-SUP etsintä- ja pelastusjärjestölle, joka vaatii integroituja tartuntakahvoja, varustekiinnikkeitä pelastusvälineille ja suuren kelluvuuden runkoa uhrien pelastamiseen — kaikki prototyyppinä rakennettuna, varusteltuna ja testattuna laitoksellamme.</li>
    <li>Retkeily-SUP hydrografisen mittausurakoitsijan käyttöön, irrotettavalla instrumenttimastolla, tiivistetyillä varusteporteilla ja matalalla transducer-kiinnikkeellä, joka on suunniteltu minimoimaan vesis vastus.</li>
    <li>Kompakti kalastus-SUP lomakohteen laitteistoon, jossa prototyyppiä käytettiin validoimaan vakaus, varusteriggaus ja kestävyys päivittäisessä vuokrauskäytössä ennen kuin asiakas sitoutui neljän laudan kokoonpanoon.</li>
  </ul>


  <h2>Prototyyppitiimimme</h2>

  <p>Työpajassa työskentelee kahdeksan monitaitoista meriteknikkoa, joista jokainen on koulutettu vähintään kahteen kolmesta ydinalueesta (runko, reunat, varustelu). Tiimin johtaja on mestarivalmistaja, jolla on 16 vuoden kokemus yksittäiskappaleina rakennetuista kohteista tuotantosarjoihin. Jokaiselle
  prototyypille nimetään oma projekti-insinööri, joka toimii asiakkaan ainoana yhteyshenkilönä koko rakennus- ja koeajoprosessin ajan.</p>


  <h2>Asiakkaan osallistuminen</h2>

  <p>Kannustamme asiakkaitamme aktiivisesti osallistumaan prototyypin rakennuksen tärkeisiin virstanpylväisiin — erityisesti alkuvarustelun tarkastukseen ja merikokeeseen. Toiminnallinen palaute näissä vaiheissa on arvokasta laudan hienosäätämiseksi ennen kuin se siirtyy tuotantoon. Emme rakenna
  tyhjiössä; rakennamme kumppanuutena kanssanne.</p>

  <p>20 tunnin merikoe on myös mahdollisuus tiimillesi tutustua laudan käsittelyyn, kansirakenteen asetteluun ja huoltovaatimuksiin, mikä varmistaa sujuvan siirtymän käyttöön, kun tuotantolaudat luovutetaan.</p>

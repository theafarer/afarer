workshops:
  - title: SUP-lautan valmistus
    description: '4 rinnakkaista asennuslinjaa painistettaville SUP-laudoille. Jokainen linja tuottaa 50–80 lauta vuorokaudessa. Digitaalinen painaminen ja silkkipainausasemat toimivat rinnakkain. Vuotuinen SUP-kapasiteetti: 8 000+ lautaa.'
    output: Yli 8 000 SUP:a/vuosi
  - title: SUP Boat Production
    description: 'Erillinen lasikuitu runkoverstas, jossa on 6 muottiasemaa SUP-runkoille jopa 7,6 metriin. Putkien hitsaus- ja kokoonpanoalue käsittelee 3–6 SUP-venettä samanaikaisesti. Vuotuinen SUP-kapasiteetti: 2 000+ venettä.'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'Monikäyttöiset tuotantolinjat kumiveneille, kajakeille ja jollille. Kuumailmahitsausasemat, RF-dielektriset puristimet ja kokoonpanotyöasemat konfiguroidaan uudelleen tilaussekoituksen perusteella. Vuotuinen kapasiteetti: 5 000+ yksikköä.'
    output: 5,000+ kpl/vuosi
  - title: Turvallisuusvarusteet
    description: 'Erillinen puhdastilan tuotantoalue pelastusliiveille ja turvallisuusvarusteille. Erilliset ompelu-, vaahdon asetus- ja testausasemat. Vuotuinen pelastusliivikapasiteetti: 50 000+ yksikköä.'
    output: Yli 50 000 pelastusliivityä/vuosi
oem_capacity:
  moq: 'SUP: 5–10 yksikköä | SUP: 2–5 yksikköä | Kajakki/Jolla: 10–50 yksikköä | Mukautettu muotti: 200+ yksikköä'
  lead_time: Vakio 30–45 päivää. Näyte 15–10 päivää. Kiiretilaus saatavilla.

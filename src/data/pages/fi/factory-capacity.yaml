intro: >-
  afarer ylläpitää yhtä Kiinan Qingdaon suurimmista ilmatäytettäviin veneisiin erikoistuneista tuotantolaitoksista. 12 000 m²:n tehtaamme on jaettu kuuteen erikoistuneeseen verstaaseen, jotka toimivat rinnakkain, mikä antaa meille kapasiteetin valmistaa yli 15 000 venettä vuodessa SUP-, kajakki-, jolla-, RIB- ja turvallisuusvarustelinjoilla.

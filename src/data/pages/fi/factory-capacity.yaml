workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50—0 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: SUP Boat Production
    description: 'Erillinen lasikuitu runkoverstas, jossa on 6 muottiasemaa SUP-runkoille jopa 7,6 metriin. Putkien hitsaus- ja kokoonpanoalue käsittelee 3— SUP-venettä samanaikaisesti. Vuotuinen SUP-kapasiteetti: 2 000+ venettä.'
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & SUP
    description: 'Monikäyttöiset tuotantolinjat kumiveneille, kajakeille ja jollille. Kuumailmahitsausasemat, RF-dielektriset puristimet ja kokoonpanotyöasemat konfiguroidaan uudelleen tilaussekoituksen perusteella. Vuotuinen kapasiteetti: 5 000+ yksikköä.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'Erillinen puhdastilan tuotantoalue pelastusliiveille ja turvallisuusvarusteille. Erilliset ompelu-, vaahdon asetus- ja testausasemat. Vuotuinen pelastusliivikapasiteetti: 50 000+ yksikköä.'
    output: '50,000+ life vests/year'


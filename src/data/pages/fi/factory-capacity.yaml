workshops:
  - title: SUP-lautan valmistus
    description: '4 rinnakkaista asennuslinjaa ilmatäytettäville SUP-laudoille. Jokainen linja tuottaa 50–80 lauta vuorokaudessa. Digitaalinen painaminen ja silkkipainausasemat toimivat rinnakkain. Vuotuinen SUP-kapasiteetti: 8 000+ lautaa.'
    output: Yli 8 000 SUP:a/vuosi
  - title: 'RIB-veneiden valmistus'
    description: 'Erillinen lasikuiturunkoverstas, jossa on 6 muottiasemaa venerunkoille jopa 7,6 metriin asti. Putkien hitsaus- ja kokoonpanoalue käsittelee 3–6 venettä samanaikaisesti. Vuotuinen RIB-kapasiteetti: 2 000+ venettä.'
    output: '2 000+ RIB-venettä/vuosi'
  - title: 'Ilmatäytettävät veneet ja SUP'
    description: 'Monikäyttöiset tuotantolinjat kumiveneille, kajakeille ja jollille. Kuumailmahitsausasemat, RF-dielektriset puristimet ja kokoonpanotyöasemat konfiguroidaan uudelleen tilaussekoituksen perusteella. Vuotuinen kapasiteetti: 5 000+ yksikköä.'
    output: '5 000+ kpl/vuosi'
  - title: Turvallisuusvarusteet
    description: 'Erillinen puhdastilan tuotantoalue pelastusliiveille ja turvallisuusvarusteille. Erilliset ompelu-, vaahdon asetus- ja testausasemat. Vuotuinen pelastusliivikapasiteetti: 50 000+ yksikköä.'
    output: Yli 50 000 pelastusliivejä/vuosi
oem_capacity:
  moq: 'SUP: 5–10 yksikköä | Vene: 2–5 yksikköä | Kajakki/Jolla: 10–50 yksikköä | Mukautettu muotti: 200+ yksikköä'
  lead_time: Vakio 30–45 päivää. Näyte 15–20 päivää. Kiiretilaus saatavilla.
  payment: T/T 30% käsiraha + 70% ennen lähetystä. L/C, Western Union hyväksytään.

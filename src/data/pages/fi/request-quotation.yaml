hero_text:
  tagline: Get a Quote
  title: Pyydä tarjous<br />projektiisi
  subtitle: Kerro meille vaatimuksistasi, niin tiimimme vastaa yksityiskohtaisella tarjouksella 2 työpäivän kuluessa.
steps2_process:
  title: How It Works
  subtitle: Neljä yksinkertaista vaihetta tiedustelusta tarjoukseen.
  items:
    - title: 'Step 1: Submit Your Requirements'
      description: Täytä alla oleva lomake tuotetyypillä, määrällä ja teknisillä tiedoilla. Mitä enemmän yksityiskohtia annat, sitä tarkempi tarjouksesi on.
      icon: tabler:file-text
    - title: 'Step 2: We Review & Advise'
      description: Insinööritiimimme tarkastelee vaatimuksiasi ja voi ottaa sinuun yhteyttä selvennystä varten. Annamme suosituksia tuotteen kokoonpanosta ja vaihtoehdoista.
      icon: tabler:users
    - title: 'Step 3: Receive Your Quote'
      description: Saat yksityiskohtaisen tarjouksen, joka sisältää yksikköhinnan, MOQ:n, toimitusajan, maksuehdot ja toimitusvaihtoehdot. Tyypillisesti 48 tunnin kuluessa.
      icon: tabler:currency-dollar
    - title: 'Step 4: Sample & Production'
      description: Tarjouksen hyväksymisen jälkeen siirrymme näytevalmistukseen (jos sovellettavissa) tai suoraan massatuotantoon. Säännöllisiä päivityksiä koko prosessin ajan.
      icon: tabler:building-factory
content_form:
  tagline: Quotation Form
  title: Kerro meille projektistasi
  subtitle: Kaikki *-merkityt kentät ovat pakollisia.
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Diving Center
        - Fishing
        - Marine Tourism / Resort
        - Search & Rescue
        - Yacht Tender
        - Commercial Workboat
        - Government / Military
        - OEM / Private Label
        - Personal / Recreational
        - Other
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      options:
        - No Preference
        - Marine-Grade PVC (1100 dtex)
        - Premium Hypalon / CSM
        - Fiberglass Hull
        - Aluminum Hull
    - name: Engine Requirement
      type: text
      placeholder: e.g. 60 HP outboard, no engine, twin 115 HP
    - name: Customization Required
      type: text
      placeholder: e.g. custom colors, branding/logo, packaging, special fittings
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      placeholder: Describe your application, technical specifications, or any special requirements —include reference drawings, specifications, or links if available
    - name: Upload Specification
      type: file
      placeholder: Upload your spec sheet, drawing, or reference document (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Upload your logo or artwork for custom branding (AI, EPS, PNG)
cta:
  title: Prefer to discuss by email?
  subtitle: Send your inquiry directly to our sales team and we will respond within 24 hours.
  actions:
    - variant: primary
      text: Email us directly
      href: /contact

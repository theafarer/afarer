faqs_sup:
  title: SUP-lautojen UKK
  subtitle: Yleisiä kysymyksiä seisomamelontalautailulaudoistamme.
  columns: 2
  items:
    - title: Mitä SUP-lautakokoja on saatavilla?
      description: Tarjoamme SUP-lautoja 9 jalasta 12 jalkaan, mukaan lukien yleiskäyttöiset, retkeily-, jooga- ja erikoismallit. Eniten myyviä mallejamme ovat Tropical Breeze (10 jalkaa) ja Ocean Voyager (11 jalkaa).
    - title: Mikä on drop-stitch -rakenne?
      description: Drop-stitch -rakenne käyttää tuhansia polyesterilankoja, jotka yhdistävät laudan ylä- ja alakerroksen, mahdollistaen korkean ilmanpaineen (15—0 PSI) ja jäykän, vakaan alustan. Tämä on alan standardi premium-kumilauta-SUP-laudoille.
    - title: Mikä on SUP-lautojen painoraja?
      description: SUP-lautamme tukevat jopa 150 kg mallista ja tilavuudesta riippuen. Leviathan Wake on suuritehoisin mallimme, suunniteltu suuremmille käyttäjille ja joogakäyttöön.
    - title: Tarjoatteko täydellisiä SUP-paketteja?
      description: Kyllä. Jokainen SUP-lauta toimitetaan täydellisenä pakettina, mukaan lukien 3-osainen alumiinimela, korkeapaineinen käsipumppu, kierrehihna, matkareppu ja korjaussarja. Jotkut mallit sisältävät myös irrotettavan eväsarjan.
    - title: Mikä on SUP-lautojen takuu?
      description: Kaikilla afarer SUP-laudoilla on yhden vuoden takuu valmistusvirheitä vastaan, mukaan lukien saumojen pettäminen, venttiiliviat ja materiaalin delaminaatio normaalikäytössä.
    - title: Kuinka kauan SUP-laudan täyttäminen kestää?
      description: Mukana tulevalla käsipumpulla täysi täyttö 15 PSI:hen kestää noin 8—2 minuuttia. Nopeampaa täyttöä varten suosittelemme afarer 12V sähköpumppuamme, joka täyttää laudan alle 4 minuutissa.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

warranty_section:
  title: Takuu ja jälkimarkkinointituki
  subtitle: Seisomme jokaisen tuotteen takana selkein takuuehdoin, nopealla reklamaatioiden käsittelyllä ja aidoilla varaosilla.
  items:
    - title: 2 vuoden tuotetakuu
      desc: Kaikkiin afarer-tuotteisiin sisältyy 2 vuoden takuu valmistusvirheitä vastaan — saumapettäminen, venttiilivirheet ja materiaalin delaminaatio normaalikäytössä.
    - title: Elinkaari varaosatuki
      desc: Alkuperäiset vaihdeosat — venttiilit, korjauspakkaus, kilvet, D-ringit — saatavilla kaikille malleille. Ylläpidämme muotteja ja työkaluja vähintään 5 vuotta tuotannon päätyttyä.
    - title: 48 tunnin reklamaatiovastaus
      desc: Takuita koskevat hakemukset vastaanotetaan 48 tunnin kuluessa. Korvauslautat lähetetään 10 arkipäivän kuluessa hyväksyttyjen hakemusten osalta.
    - title: Maailmanlaajuinen korjausverkosto
      desc: Valtuutetut korjaamot yli 15 maassa. Kenttäkorjaussarjat saatavilla etäisille alueille. Oma-oppaiset korjausohjeet pienemmille vaurioille.
    - title: OEM-asiakastuki
      desc: Omistettilähtöiset asiakaspäälliköt B2B-kumppaneille. Neljännesvuosittaiset liiketoiminta-arvioinnot, varastosuunnittelu ja yhteisbrändäys-markkinointituki.
    - title: Sertifiointipaketti
      desc: Täydellinen vaatimustenmukaisuusdokumentaatio toimitetaan jokaisen lähetyksen mukana — CE-vakuutus, testiraportit ja käyttöturvallisuustiedotteet.
      link: /contact

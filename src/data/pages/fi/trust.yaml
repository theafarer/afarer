faqs_rib:
  title: 'SUP-veneen UKK'
  subtitle: 'Yleisiä kysymyksiä jäykkärunkoisista kumiveneistämme.'
  columns: 2
  items:
    - title: 'Minkä kokoisia SUP-veneitä afarer tarjoaa?'
      description: 'Tarjoamme 35 SUP-mallia 2,5 metristä 7,6 metriin kattaen kaiken kompakteista tendereistä raskaisiin kaupallisiin ja partiointiveneisiin. Jokainen malli on saatavilla useilla kokoonpanovaihtoehdoilla.'
    - title: 'Mikä on ero RIBin ja perinteisen kumiveneen välillä?'
      description: 'SUP (jäykkärunkoinen kumivene) yhdistää kiinteän lasikuitu- tai alumiinirungon syvä-V-muodossa kumisiin Hypalon- tai PVC-putkiin. Tämä antaa sinulle kovan veneen vakauden ja kantavuuden yhdistettynä kumiveneen iskunvaimennukseen ja kelluvuuteen.'
    - title: 'Mitkä moottorit ovat yhteensopivia afarer SUP-veneiden kanssa?'
      description: 'SUP-veneemme tukevat perämoottoreita 3 HV:sta 250 HV:seen mallista riippuen. Jokainen tuotesivu ilmoittaa suurimman sallitun moottoritehon. Suosittelemme kysymään jälleenmyyjältäsi ihanteellista yhdistelmää.'
    - title: 'Ovatko afarer SUP-veneet CE-sertifioituja?'
      description: 'Kyllä. Kaikki vapaa-ajan SUP-mallit on CE-sertifioitu sovellettavien eurooppalaisten vapaa-ajan vesikulkuneuvojen standardien mukaisesti. Kaupalliset ja partiointimallit täyttävät lisävakaus- ja kuormitusvaatimukset.'
    - title: 'Mikä on SUP-veneiden takuu?'
      description: 'Kaikki afarer SUP-veneet toimitetaan vakio yhden vuoden takuulla valmistusvirheitä vastaan, kattaen rungon delaminoitumisen, putkisaumojen pettämisen, venttiiliviat ja laitteisto-ongelmat.'
    - title: 'Kuinka monta ilmakammiota afarer SUP-veneissä on?'
      description: 'SUP-veneissämme on 3— riippumatonta ilmakammiota mallin pituudesta riippuen. Tämä monikammioinen rakenne varmistaa, että vene pysyy pinnalla, vaikka yksi osasto vaurioituisi.'

faqs_inflatable:
  title: 'Kumiveneiden UKK'
  subtitle: 'Yleisiä kysymyksiä kumijollistamme, -kajakeistamme ja -veneistämme.'
  columns: 2
  items:
    - title: 'Mitä materiaaleja afarerin kumiveneissä käytetään?'
      description: 'Käytämme sotilaslaatuista PVC:tä (1100 denier) ja premium-Hypalon/CSM-kumia mallista riippuen. Molemmat materiaalit ovat UV-stabiloituja, kulutuskestäviä ja EU:n REACH- ja RoHS-määräysten mukaisia.'
    - title: 'Kuinka kauan kumiveneet kestävät?'
      description: 'Asianmukaisella hoidolla laadukas PVC-kumivene kestää 7—0 vuotta, kun taas Hypalon-mallit voivat kestää 15—0 vuotta. Säännöllinen puhdistus, UV-suojaus ja oikea säilytys pidentävät käyttöikää merkittävästi.'
    - title: 'Mitä huoltoa kumivene vaatii?'
      description: 'Perushuoltoon kuuluu huuhtelu makealla vedellä jokaisen käytön jälkeen (etenkin suolavedessä), kuivaus ennen säilytystä, venttiilien tiivisteiden vuosittainen tarkistus ja UV-suojan levittäminen putkiin. Vältä pitkäaikaista altistumista auringolle, kun venettä ei käytetä.'
    - title: 'Voiko kumiveneitä käyttää suolavedessä?'
      description: 'Kyllä. Kaikki afarerin kumiveneet on suunniteltu käytettäväksi sekä makeassa että suolaisessa vedessä. Suosittelemme huuhtelua makealla vedellä ja perusteellista kuivausta suolavesialtistuksen jälkeen liitoskorroosion ja kankaan suolakiteytymisen estämiseksi.'
    - title: 'Kuinka säilytän kumivenettä?'
      description: 'Tyhjennä ilma, puhdista ja kuivaa vene kokonaan ennen säilytystä. Rullaa löysästi (vältä teräviä taitoksia), säilytä viileässä ja kuivassa paikassa suojassa suoralta auringonvalolta ja pidä betonilattioiden yläpuolella kosteuden imeytymisen estämiseksi.'
    - title: 'Mikä on afarerin kumiveneiden kantavuus?'
      description: 'Kantavuudet vaihtelevat 290 kilosta pienimmille malleille yli 2000 kiloon suuremmille kaupallisille veneille. Jokainen tuotesivu ilmoittaa enimmäiskuormituksen tietylle mallillesi.'

faqs_sup:
  title: 'SUP-lautojen UKK'
  subtitle: 'Yleisiä kysymyksiä seisomamelontalautailulaudoistamme.'
  columns: 2
  items:
    - title: 'Mitä SUP-lautakokoja on saatavilla?'
      description: 'Tarjoamme SUP-lautoja 9 jalasta 12 jalkaan, mukaan lukien yleiskäyttöiset, retkeily-, jooga- ja erikoismallit. Eniten myyviä mallejamme ovat Tropical Breeze (10 jalkaa) ja Ocean Voyager (11 jalkaa).'
    - title: 'Mikä on drop-stitch -rakenne?'
      description: 'Drop-stitch -rakenne käyttää tuhansia polyesterilankoja, jotka yhdistävät laudan ylä- ja alakerroksen, mahdollistaen korkean ilmanpaineen (15—0 PSI) ja jäykän, vakaan alustan. Tämä on alan standardi premium-kumilauta-SUP-laudoille.'
    - title: 'Mikä on SUP-lautojen painoraja?'
      description: 'SUP-lautamme tukevat jopa 150 kg mallista ja tilavuudesta riippuen. Leviathan Wake on suuritehoisin mallimme, suunniteltu suuremmille käyttäjille ja joogakäyttöön.'
    - title: 'Tarjoatteko täydellisiä SUP-paketteja?'
      description: 'Kyllä. Jokainen SUP-lauta toimitetaan täydellisenä pakettina, mukaan lukien 3-osainen alumiinimela, korkeapaineinen käsipumppu, kierrehihna, matkareppu ja korjaussarja. Jotkut mallit sisältävät myös irrotettavan eväsarjan.'
    - title: 'Mikä on SUP-lautojen takuu?'
      description: 'Kaikilla afarer SUP-laudoilla on yhden vuoden takuu valmistusvirheitä vastaan, mukaan lukien saumojen pettäminen, venttiiliviat ja materiaalin delaminaatio normaalikäytössä.'
    - title: 'Kuinka kauan SUP-laudan täyttäminen kestää?'
      description: 'Mukana tulevalla käsipumpulla täysi täyttö 15 PSI:hen kestää noin 8—2 minuuttia. Nopeampaa täyttöä varten suosittelemme afarer 12V sähköpumppuamme, joka täyttää laudan alle 4 minuutissa.'


features3_certifications:
  title: Sertifioinnit ja vaatimustenmukaisuus
  subtitle: Jokainen tuote on itsenäisesti testattu ja sertifioitu kansainvälisten standardien mukaan.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE-sertifiointi
      description: Kaikki afarer SUP-laudat täyttävät Euroopan CE-turvallisuusstandardin vapaa-ajan vesikulkuneuvoille. Jokainen tuote käy läpi paine-, kelluvuus- ja kuormitustestauksen ennen tehtaalta lähtöä.
      icon: tabler:certificate
    - title: ISO 9001
      description: 12 000 m² Qingdaon laitoksemme toimii ISO 9001 -laadunhallintajärjestelmän alla. Jokainen tuotantoerä on jäljitettävissä, dokumentoitu ja tarkastettu.
      icon: tabler:clipboard-check
    - title: BSCI-sosiaalinen vaatimustenmukaisuus
      description: Olemme BSCI-sertifioituja, mikä takaa eettiset työkäytännöt, turvalliset työolosuhteet ja ympäristövastuun koko toimitusketjussamme.
      icon: tabler:users
    - title: REACH & RoHS
      description: Kaikki materiaalit — PVC, Hypalon, EVA-vaahto, liimat — täyttävät EU:n REACH- ja RoHS-määräykset. Ei kiellettyjä aineita, ei kompromisseja.
      icon: tabler:flask
    - title: Materiaalitestilaboratorio
      description: Sisäinen materiaalilaboratorio testaa vetolujuuden, UV-kestävyyden, saumojen eheyden ja kulutuskestävyyden jokaiselle kangaserälle ennen tuotantoa.
      icon: tabler:microscope
    - title: 2 vuoden takuu
      description: Jokainen afarer-tuote toimitetaan kahden vuoden takuulla valmistusvirheitä vastaan. Seisomme rakentamiemme tuotteiden takana.
      icon: tabler:shield-check
testimonials:
  tagline: Asiakkaiden luottamus
  title: Mitä asiakkaamme sanovat
  subtitle: Ensikertalaisista melojista ammattimaisiin laivasto-operaattoreihin — katso miksi he luottavat afareriin.
  items:
    - content: Varustimme koko vuokrauslaivastomme afarer SUP-veneillä. Kaksi kautta takana, nolla vikaa. CE-sertifiointi teki vakuutushyväksynnästä saumatonta.
      name: Marco V.
      title: Matkanjärjestäjä, Kroatia
    - content: Ensikertalaisena ostajana olin hermostunut laadusta. ISO-dokumentaatio ja testiraportit, jotka he jakoivat, antoivat minulle täyden luottamuksen.
      name: James T.
      title: SUP Explorer 11 -omistaja, Kanada
    - content: Teemme yhteistyötä afarerin kanssa rannikkopartioyksiköidemme osalta. Heidän QC-prosessinsa on johdonmukainen jokaisessa erässä — tällä luotettavuudella on merkitystä kriittisissä operaatioissa.
      name: Lt. Cmdr. Andres
      title: Laivaston hankinta, Filippiinit
steps2_manufacturing:
  title: Kuinka varmistamme laadun
  subtitle: Raaka-ainetarkastuksesta lopulliseen painetestaukseen — jokainen tuote käy läpi tiukan laatuketjun.
  items:
    - title: Raaka-ainetarkastus
      description: Jokainen PVC-kangasrulla testataan paksuuden, vetolujuuden ja UV-kestävyyden suhteen ennen tuotantoon tuloa.
      icon: tabler:search
    - title: Keskeneräinen QC
      description: Hitsaussaumat, venttiiliasennukset ja kammioliitokset tarkastetaan jokaisella asemalla kokoonpanon aikana.
      icon: tabler:eye
    - title: Painetestaus
      description: Jokainen kumituote täytetään 1,5-kertaiseen nimellis-PSI:hen ja pidetään 24 tuntia ilmanpysyvyyden ja saumojen eheyden varmistamiseksi.
      icon: tabler:wind
    - title: Lopputarkastus
      description: Jokainen yksikkö tarkastetaan viimeistelyn, laitteiston ja pakkauksen suhteen ennen lähetykseen hyväksymistä. Erien näytteet menevät laboratorioomme tuhoavaa testausta varten.
      icon: tabler:clipboard-check

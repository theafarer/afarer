faqs_sup:
  title: SUP-lautojen UKK
  subtitle: Yleisiä kysymyksiä seisomamelontalautailulaudoistamme.
  columns: 2
  items:
    - title: Mitä SUP-lautakokoja on saatavilla?
      description: Tarjoamme SUP-lautoja 9 jalasta 12 jalkaan, mukaan lukien yleiskäyttöiset, retkeily-, jooga- ja erikoismallit. Eniten myyviä mallejamme ovat Tropical Breeze (10 jalkaa) ja Ocean Voyager (11 jalkaa).
    - title: Mikä on drop-stitch -rakenne?
      description: Drop-stitch -rakenne käyttää tuhansia polyesterilankoja, jotka yhdistävät laudan ylä- ja alakerroksen, mahdollistaen korkean ilmanpaineen (15–20 PSI) ja jäykän, vakaan alustan. Tämä on alan standardi premium-kumilauta-SUP-laudoille.
    - title: Mikä on SUP-lautojen painoraja?
      description: SUP-lautamme tukevat jopa 150 kg mallista ja tilavuudesta riippuen. Leviathan Wake on suuritehoisin mallimme, suunniteltu suuremmille käyttäjille ja joogakäyttöön.
    - title: Tarjoatteko täydellisiä SUP-paketteja?
      description: Kyllä. Jokainen SUP-lauta toimitetaan täydellisenä pakettina, mukaan lukien 3-osainen alumiinimela, korkeapaineinen käsipumppu, kierrehihna, matkareppu ja korjaussarja. Jotkut mallit sisältävät myös irrotettavan eväsarjan.
    - title: Mikä on SUP-lautojen takuu?
      description: Kaikilla afarer SUP-laudoilla on yhden vuoden takuu valmistusvirheitä vastaan, mukaan lukien saumojen pettäminen, venttiiliviat ja materiaalin delaminaatio normaalikäytössä.
    - title: Kuinka kauan SUP-laudan täyttäminen kestää?
      description: Mukana tulevalla käsipumpulla täysi täyttö 15 PSI:hen kestää noin 8–12 minuuttia. Nopeampaa täyttöä varten suosittelemme afarer 12V sähköpumppuamme, joka täyttää laudan alle 4 minuutissa.
faqs_materials:
  title: 'SUP-materiaalit ja -huolto: UKK'
  subtitle: Usein kysytyt kysymykset täytettävien SUP-lautojen materiaaleista, hoidosta ja säilytyksestä.
  columns: 2
  items:
    - title: Mitä materiaaleja afarerin täytettävissä SUP-laudoissa käytetään?
      description: Käytämme sotilasluokan PVC:tä (1100 denieriä) UV-stabiloidulla, hankauskestävällä rakenteella, EU:n REACH- ja RoHS-määrästen mukaisena.
    - title: Kauanko tiedostamatonta SUP-lautaa kestää?
      description: Oikealla hoidolla laadukas PVC-kumilastu SUP kestää 5–10 vuotta. Säännöllinen puhdistus, UV-suojus ja oikea varastointi pidentävät huomattavasti käyttöikää.
    - title: Mitä huoltoa laukeavalle SUP:lle tarvitaan?
      description: Perushuolto sisältää huuhtomisen puhtaalla vedellä jokaisen käytön jälkeen (erityisesti suolaisessa vedessä), kuivattamisen ennen säilytystä, venttiilien tiivisteiden vuositarkistuksen ja auringon altistuksen välttämisen kun laitetta ei käytetä.
    - title: Voiko täytettäviä SUP-lautoja käyttää suolaisessa vedessä?
      description: Kyllä. Kaikki afarerin ilmatäytettävät SUP-laudat on suunniteltu sekä makeaan että suolaiseen veteen. Suosittelemme huuhtomista makealla vedellä ja kuivaamista perusteellisesti suolaisen veden jälkeen.
    - title: Kuinka säilytän puhallettavan SUP-laudan?
      description: Tyhjennä, puhdista ja kuivaa lauta kokonaan ennen varastointia. Rullaa löyhästi (vältä tiukkoja taitoksia), säilytä viileässä ja kuivassa paikassa suojassa suoralta auringonvalolta ja pidä erossa betonilattiasta kosteuden imeytymisen estämiseksi.
    - title: Mikä on afarerin puhallettavien SUP-lautojen kantavuus?
      description: Kantavuudet vaihtelevat 100 kg:sta pienimmillä malleilla yli 200 kg:aan suuremmilla laudoilla. Jokainen tuotesivu ilmoittaa mallisi maksimikuorman.

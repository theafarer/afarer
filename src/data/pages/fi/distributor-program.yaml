faqs:
  title: 'Jälleenmyyjäohjelma — UKK'
  subtitle: 'Kaikki, mitä jälleenmyyjät kysyvät ennen hakemista.'
  items:
    - title: 'Mitä tarkoittaa yksi maa, yksi jälleenmyyjä?'
      description: 'Afarer myöntää yhdelle valtuutetulle jälleenmyyjälle yksinoikeuden maahan tai alueeseen. Sinä omistat markkinasi — ei rinnakkaistuontia, ei sisäistä kilpailua.'
    - title: 'Mikä on vähimmäistilaus?'
      description: 'Maa- ja aluejälleenmyyjät aloittavat 100–300 kappaleesta. Valtuutetut jälleenmyyjät 30–50 kappaleesta. Koe-erät 10–30 kappaletta antavat sinun ensin testata markkinaa (ilman alueellista suojaa).'
    - title: 'Mitä tukea jälleenmyyjät saavat?'
      description: 'Distributor Success Program kattaa perehdytyksen, go-to-market-suunnittelun, tuote- ja myyntikoulutuksen, demo-kalustotuen, lokalisoidut markkinointimateriaalit ja omistetun asiakkuuspäällikön.'
    - title: 'Miten Afarer suojaa minut kanavaristiriidoilta?'
      description: 'Jokaisella alueella on täsmälleen yksi valtuutettu jälleenmyyjä. Alueesi suorat tilaukset ohjataan sinun kauttasi ja hinnat suojaavat marginaalisi.'
    - title: 'Mitkä ovat toimitus- ja maksuehdot?'
      description: 'Tilaukset toimitetaan FOB Qingdao täydellä vientidokumentaatiolla. Tuotantotilaukset 30% käsirahalla ja 70% ennen toimitusta; koe- ja näytetilaukset ennakkoon.'
    - title: 'Miten haen?'
      description: 'Lähetä hakemus yhteydenottolomakkeella. Arvioimme markkinasopivuuden, vähittäisnäkyvyyden ja logistiikkakyvykkyyden ja vastaamme 3 työpäivän kuluessa seuraavista vaiheista ja mallisopimuksesta.'

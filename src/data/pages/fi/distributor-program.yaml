faqs:
  title: 'Maakumppanuus — UKK'
  subtitle: 'Kysymykset, joita vakavasti asiaan suhtautuvat maarumppaanit kysyvät ennen hakemista.'
  items:
    - title: 'Mitä yksi maa, yksi jakelija todella tarkoittaa?'
      description: 'Afarer nimittää yhden valtuutetun jakelijan, jolla on yksinoikeus määriteltyyn alueeseen. Emme myy globaaleista tai alueellisista kanavistamme suojattuun maahan. Alueesi pysyy sinulla niin kauan kuin Distribution Agreement -sopimuksen ehdot täyttyvät.'
    - title: 'Onko alue yksinomainen ikuisesti?'
      description: 'Ei. Yksinoikeus on ehdollinen, ei ikuinen. Se säilytetään allekirjoitetulla Distribution Agreement -sopimuksella, ensimmäisen tilauksen toteutuksella, vuosittaisilla ostotavoitteilla, paikallisella varastolla, jälkimarkkinakapasiteetilla ja jatkuvalla markkinasijoituksella. Jos näitä ehtoja ei täyty, alue voidaan neuvotella uudelleen tai myöntää toiselle osapuolelle.'
    - title: 'Mikä on vähimmäisensimmäinen tilaus?'
      description: 'Maa- ja aluejakelijat aloittavat 100–300 kappaleesta; valtuutetut jälleenmyyjät 30–50 kappaleesta; koe-erät 10–30 kappaleesta antavat sinun testata markkinaa ensin (koe- ja näytetilaukset eivät tuota alueellista suojaa). Custom- ja private-label-ohjelmissa on omat MOQ-rajansa yllä olevien tasojen mukaisesti.'
    - title: 'Mitä 10-moduulinen tukiohjelma sisältää?'
      description: 'Tasot ja kelpoisuus, alueellinen suoja, MOQ / hinnoittelu / vuosialennukset, varastonhallinta ja tilausprosessi, markkinointimateriaalit ja yhteiset markkinarahastot, tuote-/myynti-/tekninen koulutus, varaosat ja jälkimarkkinat, takuurekisteröinti, kumppaniportaali sekä tuotetietolomakkeet, markkinointimateriaalikirjasto, vuosittainen alennustaulukko sekä kuljetus- ja pakkausluettelot.'
    - title: 'Miten Afarer suojaa minut kanavaristiriidoilta?'
      description: 'Jokaisella alueella on täsmälleen yksi valtuutettu jakelija. Alueesi tiedustelut ja suorat tilaukset ohjataan sinun kauttasi, verkkolomakkeet ohjataan paikalliselle kumppanille, kun sellainen on olemassa, ja globaali tiimi eskaloituu vain, jos kumppani ei vastaa.'
    - title: 'Mitkä ovat toimitus- ja maksuehdot?'
      description: 'Tilaukset toimitetaan FOB Qingdao täydellä vientidokumentaatiolla. Tuotantotilaukset 30% käsirahalla ja 70% ennen toimitusta; koe- ja näytetilaukset maksetaan etukäteen. Vakio toimitusaika on 30–45 työpäivää, näyte-erillä 15–20 työpäivää.'
    - title: 'Miten haen?'
      description: 'Lähetä hakemuksesi yhteydenottolomakkeella markkinatietoineen. Arvioimme markkinasopivuuden, vähittäisnäkyvyyden ja logistiikkakyvykkyyden ja vastaamme 3 työpäivän kuluessa seuraavista vaiheista ja luonnoksesta Distribution Agreement -sopimukseksi.'

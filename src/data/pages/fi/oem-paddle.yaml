      description: 'Käynnistä merkkisi 16 viikossa: brief, suunnittelu, CE-sertifioitu prototyyppi, sarjatuotanto ja toimitus. Tutustu OEM-paketteihimme.'
    - title: 'Mikä on tuotannon läpimenoaika?'
      description: 'Näyte on valmis 2-3 viikossa, sarjatuotanto 30-45 päivässä tilavuudesta riippuen.'

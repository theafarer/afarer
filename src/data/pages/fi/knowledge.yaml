hero:
  tagline: Tietokartta
  title: Vesilläliikkumisen tietämys
  subtitle: |
    Jäsennelty tietopohja, joka kattaa kumilauta-SUP-teknologian,<br />
    vesiturvallisuuden, veneilyn tekniikan ja seikkailusuunnittelun.
  taglineSection: Tutki. Opi. Liiku luottavaisesti.
clusters:
  tagline: Tietoklusterit
  title: Tutki aiheen mukaan
  subtitle: Syväsukellukset teknologiaan, turvallisuuteen ja taitoihin jokaisen afarer-tuotteen takana.
  items:
    - title: SUP-tietämys
      description: Ensimmäisen laudan valinnasta edistyneisiin retkeilytekniikoihin —kaikki seisomamelonnasta.
      icon: tabler:lifebuoy
      topics:
        - Kuinka valita ensimmäinen kumilauta SUP
        - Paras SUP-koko aloittelijoille
        - Kuinka vaikeaa seisomamelonta on?
        - Kumilauta vs kova lauta vertailu
        - SUP-turvallisuustarkistuslista
    - title: Venetietämys
      description: Tekniset oppaat kumiveneistä, RIBeistä, jollista ja kajakeista —tekniikka, materiaalit ja käyttö.
      icon: tabler:sailboat
      topics:
        - Kumivenetyypit selitettynä
        - PVC vs Hypalon vertailu
        - SUP vs Jolla vertailu
        - Drop-stitch -teknologian syväsukellus
        - Merenkulun materiaalitieteen opas
    - title: Turvallisuustietämys
      description: Olennaista turvallisuustietoa jokaiselle melojalle —PFD-valinnasta säätilan lukemiseen ja itsensä pelastamiseen.
      icon: tabler:shield
      topics:
        - SUP-turvallisuustarkistuslista
        - Tarvitsetko pelastusliivejä?
        - Merialueella melomisen turvallisuusopas
        - Jokiturvallisuus kumikajakeille
        - Sää- ja vesiolosuhteiden tiedostaminen
    - title: Teknologia
      description: Tekniikka afarer-tuotteiden takana —materiaalit, valmistusmenetelmät ja laadun testaus.
      icon: tabler:microscope
      topics:
        - Merilaatuinen PVC-teknologia
        - Drop-stitch -ydin selitettynä
        - Miksi PSI:llä on väliä kumilauta-SUPeille
        - RF-hitsaus vs liimaus
        - Laadun testaus ja sertifiointi
    - title: SUP-elämäntapa ja erityiskäyttö
      description: Erityis-SUP-toimintaa — jooga, kalastus, koirat, perheet ja matkailuvinkit.
      icon: tabler:heart
      topics:
        - SUP-jooga ja meditaatio veden päällä
        - Kalastus laukeavalla SUP:lla
        - Melontaa koirien ja lasten kanssa
        - Matkustaminen SUP-laudallasi lentokoneella ja autolla
        - SUP-lisävarusteet ja perusvarusteet
    - title: SUP-vertailut ja viitteet
      description: Rinnakkaisvertailut, jotka auttavat sinua tekemään tietoisia päätöksiä.
      icon: tabler:chart-bar
      topics:
        - SUP vai kajakki — kumpi sopii sinulle?
        - PVC- ja Hypalon-materiaalien vertailu
        - Yksikammioinen vs. monikammioinen turvallisuus
        - SUP-lautan materiaalit selitetään
        - UV-tulostus vs EVA-lohkokuvitus

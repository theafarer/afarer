meta:
  title: 'Merellinen osaaminen — tekniikkaa jokaisessa rungossa | {SITE}'
  description: 'Vuosikymmenten meritekniikkaa jokaisessa rungossa. afarer hallitsee drop stitch -rakenteen, meri-PVC:n ja ammattimaisen täytettävien veneiden ja SUP-lautojen suunnittelun.'
  keywords:
    - 'meritekniikka'
    - 'täytettävien veneiden valmistaja'
    - 'täytettävien SUP-lautojen valmistaja'
    - 'paddle board -valmistus'
hero:
  tagline: Meriurheiluasiantuntemus
  title: Vuosikymmenten meritekniikka<br />jokaisessa rungossa
  subtitle: afarer yhdistää syvällisen materiaalitieteen, tarkkuusvalmistuksen ja todellisen maailman testauksen tuottaakseen vesikulkuneuvoja, jotka suoriutuvat kun sillä on merkitystä.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp

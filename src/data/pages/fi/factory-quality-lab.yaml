hero:
  tagline: Laadunvalvontalaboratorio
  title: Testauslaboratorio ja laadintatarkastus
  subtitle: Riippumaton laadunvarmistuslaboratorio ISO 9001-prosesseilla — joka yksikkö testataan ennen lähettämistä
intro: afarerilla on oma laadunvalvontalaboratorio, joka toimii itsenäisesti tuotannosta. Jokainen raaka-aine-erä ja jokainen valmis vene kulkee dokumentoituja tarkastusprotokollia ennen vapauttamista. QC-tiimi raportoi suoraan johdolle, mikä varmistaa puolueettomat laadulliset päätökset.
highlights:
  - value: 100%
    label: Yksiköt painekokeilla
    detail: Jokainen kammi, jokainen vene
  - value: 24–48 h
    label: Ilmanpidätteston kesto
    detail: 1,25× nimellispaineessa
  - value: '&lt;5 %'
    label: Sallittu enimmäispaineen lasku
    detail: 24–48 tunnin paineenpitotesti
  - value: AQL 2.5
    label: Merkittävän virheen raja-arvo
    detail: ISO 2859:n otanta
test_procedures:
  - title: Raaka-aineen tarkastus
    description: Jokainen saapuva PVC-, Hypalon-, drop-stitch-kankaan ja laitteistoerä testataan ennen hyväksyntää. Vetoisuus (ASTM D751), repäisyvastus (ISO 4674) ja UV-vastus todennetaan. Vaatimukset täyttämättömät materiaalit eristetään ja palautetaan.
    standards:
      - ASTM D751 (tensile)
      - ISO 4674 (repeäminen)
      - ISO 4892 (UV)
  - title: Valmistuksen aikaiset laatuvalvontapisteet
    description: Tuotanto-ohjaajat suorittavat itsetarkistuksen jokaisessa vaiheessa. Laatutarkastajat suorittavat satunnaisotoksia koko vuoron ajan.Hitsausirrotustestit suoritetaan joka 50. kappaleelle. Mitat tarkistetaan joka 20. paneelista.
    standards:
      - ASTM D751 (peel)
      - Sisäinen 100 kohdan tarkistuslista
      - ISO 2859 -näytteenotto
  - title: 24–48 tunnin ilmanpitävyystesti
    description: Jokainen putkikammio paisutetaan 125 prosenttiin nimellisestä paineesta ja pidetään 24–48 tuntia. Paineanturit kirjautuvat jatkuvasti lämpökorjauksen kera. Jos yksikään kammio ylittää 5 prosenttia paineen laskusta, se käynnistää automaattisen erän uudelleentarkastuksen.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Kuormitus- ja painopistetestaus
    description: Valmistuneet veneet testataan suurimmassa luokitetussa kuormituksessa stabiilisuuden, vapaa rantaviivan ja ohjattavuuden osalta. Jokainen alus käy läpi vesitestin ennen lopullisen tarkastuksen hyväksyntää.
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: Universaali testauskone (veto)
    spec: 5 kN, ASTM D751 -määräysten mukainen
  - name: Pressure Decay Tester
    spec: Monikanavainen, 0–50 psi, datalogging
  - name: UV Weathering Chamber
    spec: ISO 4892, 1 000 h sykliä
  - name: Paksuusmittari (digitaalinen)
    spec: 0.01 mm resoluutio
  - name: Peel Tester (weld)
    spec: Moottoroitu, 50 N kapasiteetti
  - name: Temperature Chamber
    spec: '-40 °C – +100 °C'
  - name: Leak Detection Tank
    spec: 6 m × 2 m, valaistu

tests:
  - title: Painetestaus
    description: >-
      Täytettäviä kammioita altistetaan niiden suositeltuja käyttörajoja korkeammille paineille pitkien ajanjaksojen ajan. Tämä varmistaa materiaalin ja saumojen ilmatiiviyden sekä rakenteellisen eheyden varmistaen, että tuote kestää aiottua käyttöä ja mahdollista ylitäyttöä ilman vikoja tai
      vuotoja.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: Iskunkestävyystestaus
    description: Tuotteita altistetaan hallituille iskuille eri painoista ja kulmista. Tämä arvioi materiaalin kestävyyttä puhkaisuja, repeämiä ja törmäysvaurioita vastaan vedessä, osoittaen kestävyyttä ja pitkäikäisyyttä.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: UV-kestävyystestaus
    description: >-
      Täytettäviä kammioita altistetaan niiden suositeltuja käyttörajoja korkeammille paineille pitkien ajanjaksojen ajan. Tämä varmistaa materiaalin ja saumojen ilmatiiviyden sekä rakenteellisen eheyden varmistaen, että tuote kestää aiottua käyttöä ja mahdollista ylitäyttöä ilman vikoja tai
      vuotoja.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: Kulutuskestävyystestaus
    description: Materiaalinäytteitä hangataan hankaavia pintoja vastaan määrätyn määrän jaksoja hallitussa paineessa. Tämä mittaa materiaalin kykyä kestää kulutusta toistuvasta käytöstä, kosketuksesta hiekkaan, kiviin tai muihin pintoihin varmistaen pitkäaikaisen kestävyyden.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: Matalan lämpötilan suorituskykytestaus
    description: Tuotteita testataan kylmissä ympäristöissä toimivuuden ja kestävyyden arvioimiseksi eri lämpötilaolosuhteissa, estäen jäykistymistä tai halkeilua kylmemmissä vesissä. Välttämätöntä talvi- tai korkealeveysasteilla käytettäville veneille.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: Kelluvuus- ja kuormankapasiteettitestaus
    description: Tuotteita testataan eri painoilla niiden maksimaalisen kantokyvyn määrittämiseksi ja sen varmistamiseksi, että ne tukevat turvallisesti käyttäjiä ja varusteita. Jokaisen mallin ilmoitettu kapasiteetti varmennetaan ennen julkaisua.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: Ohjattavuustestaus
    description: Tuotteita testataan niiden reagointikyvyn suhteen melonta- tai moottorisyötteisiin, arvioiden kääntösädettä ja käsiteltävyyttä. Vesikokeet varmistavat, että todellinen käsiteltävyys vastaa suunnitteluvaatimuksia.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: Vesitiiviystestaus
    description: Täysin koottuja tuotteita upotetaan tai altistetaan vesisuihkulle vuotojen tarkistamiseksi saumoista, venttiileistä tai materiaaleista. Jokainen vene läpäisee pakollisen vesitiiviystarkastuksen ennen lähetystä.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
testing_section:
  tagline: Testausmenettelyt
  title: Perusteellinen testaus jokaisessa vaiheessa
commitment:
  title: Sitoumuksemme
  body: >-
    Näiden tiukkojen testausmenettelyjen avulla {SITE} tarjoaa asiakkailleen varmuuden siitä, että kumiveneemme ja SUP-lautamme ovat paitsi korkeasuorituskykyisiä, myös rakennettu kestämään —turvaten lukemattomia nautinnollisia ja turvallisia seikkailuja vesillä. Laatulaboratoriomme toimii
    riippumattomasti tuotannosta ja raportoi suoraan johdolle.
  cta: Pyydä testausdokumentaatiota
  cta_link: /contact

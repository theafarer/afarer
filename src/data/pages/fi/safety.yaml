    description: Pelastusliivit täyttävät ISO 12402 -kelluvuusstandardit. Life Vest Classic tarjoaa 50N+ kelluvuuden; Life Vest Pro täyttää SOLAS-vaatimukset automaattisella täytöllä.
  - title: SOLAS-vaatimustenmukaisuus
    description: Life Vest Pro täyttää SOLAS (Safety of Life at Sea) -määräykset merellä ja kaupallisissa merenkulkuoperaatioissa.

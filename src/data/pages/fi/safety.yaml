hero:
  tagline: Turvallisuus
  title: Turvallisuusstandardit ja -sertifiointi
  subtitle: Jokainen afarer-tuote käy läpi tiukan testauksen ja täyttää kansainväliset turvallisuusstandardit virkistys- ja ammattikäyttöön.

certifications:
  - title: CE-sertifiointi
    description: Kaikki afarerin turvavarusteet täyttävät CE-merkinnän vaatimukset Euroopan henkilönsuojainasetuksen (EU) 2016/425 mukaisesti.
  - title:
    description: Pelastusliivit täyttävät  -kelluvuusstandardit. Life Vest Classic tarjoaa 50N+ kelluvuuden; Life Vest Pro täyttää SOLAS-vaatimukset automaattisella täytöllä.
  - title: SOLAS-vaatimustenmukaisuus
    description: Life Vest Pro täyttää SOLAS (Safety of Life at Sea) -määräykset merellä ja kaupallisissa merenkulkuoperaatioissa.


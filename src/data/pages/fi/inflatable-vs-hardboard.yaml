faqs:
  - question: 'Kumpi on kestävämpi: täytettävä SUP vai kova lauta?'
    answer: Täytettävät SUP-laudat ovat yleensä kestävämpiä, koska ne kestävät kolhuja, halkeamia ja iskuvaurioita, jotka vahingoittaisivat pysyvästi kovaa lautaa.
  - question: Onko täytettävä SUP parempi aloittelijoille?
    answer: Kyllä. Täytettäviä SUP-lautoja suositellaan aloittelijoille, koska ne ovat anteeksiantavampia, helpompia kuljettaa ja aiheuttavat vähemmän todennäköisesti vammoja kaatumisissa.
  - question: Voivatko täytettävät SUP-laudat suoriutua yhtä hyvin kuin kovat laudat?
    answer: Virkistysmelonnassa ja retkeilyssä täytettävät SUP-laudat vastaavat kovien lautojen suorituskykyä. Kovat laudat ovat edelleen parempia kilpailussa ja edistyneessä surffauksessa kevyemmän painonsa ja hienostuneemman taipuisuutensa ansiosta.
body: >
  <h2>Tärkeimmät erot</h2>

  <p>Täytettävät SUP-laudat (iSUP) ja kovat laudat palvelevat samaa perustarkoitusta — seisomista ja melomista vedellä — mutta ne saavuttavat sen täysin erilaisilla valmistusmenetelmillä. Oikea valinta riippuu siitä, miten aiot käyttää lautaa.</p>


  <table>
    <tr><th>Tekijä</th><th>Täytettävä SUP</th><th>Kova lauta</th></tr>
    <tr><td>Valmistus</td><td>Tikattu PVC, puhallettu 12-15 PSI</td><td>EPS-ydin lasikuidulla tai epoksilla</td></tr>
    <tr><td>Paino</td><td>18-28 lbs (vain lauta)</td><td>20-30 lbs (vain lauta)</td></tr>
    <tr><td>Pakkauskoko</td><td>Reppu (30 x 15 x 10 tuumaa)</td><td>Täyspitkä (10-14 jalkaa)</td></tr>
    <tr><td>Kokoaminen</td><td>3-5 minuuttia täyttöön</td><td>Valmis käyttöön</td></tr>
    <tr><td>Käyttöikä</td><td>5-10 vuotta hoidolla</td><td>3-8 vuotta (altis kolhuille)</td></tr>
  </table>


  <h2>Kannettavuus</h2>

  <p><strong>Täytettävä SUP voittaa.</strong> Tämä on selvin etu. Täytettävä SUP pakkautuu reppuun, joka mahtuu auton takakonttiin, asunnon kaappiin tai lentokoneen matkatavarasäiliöön. Matkailijat, kerrostaloasukkaat ja kaikki, joilla ei ole kattotelineitä, huomaavat täytettävien SUP-lautojen olevan paljon
  käytännöllisempiä.</p>

  <p>Kovat laudat vaativat kattotelineet, suuren ajoneuvon tai erillisen säilytystilan. Niitä on vaikea kuljettaa eikä niitä voi viedä lentokoneeseen ilman erityisiä lähetyskoteloita.</p>


  <h2>Kestävyys</h2>

  <p><strong>Täytettävä SUP voittaa.</strong> Täytettävät SUP-laudat on valmistettu sotilasluokan PVC:stä, joka kestää iskuja, puhkeamisia ja UV-vaurioita. Kun pudotat täytettävän SUP-laudan tai osut kiveen, se kimpoaa. Kova lauta lohkeaisi, halkeaisi tai delaminoituisi samasta iskusta.</p>

  <p>Kovat laudat ovat alttiimpia jokapäiväiselle kulumiselle. Yksi pudotus betonille voi aiheuttaa pysyvän kolhun, joka vaikuttaa suorituskykyyn ja veden tunkeutumiseen.</p>


  <h2>Suorituskyky</h2>

  <p><strong>Kova lauta voittaa huippupäässä.</strong> Virkistysmelonnassa ja retkeilyssä kohtuullisilla nopeuksilla molemmat lautatyypit suoriutuvat samankaltaisesti. Kovilla laudoilla on etu:</p>

  <ul>
    <li><strong>Nopeus</strong> — Kovat laudat ovat kevyempiä ja jäykempiä, mikä tarkoittaa parempaa liukua ja korkeampaa huippunopeutta</li>
    <li><strong>Surffaus</strong> — Kovat laudat tarjoavat herkemmät kiskolta kiskolle -siirtymät ja paremman aaltosuorituskyvyn</li>
    <li><strong>Kilpailu</strong> — Kilpamelonta käyttää lähes yksinomaan kovia lautoja niiden paino- ja jäykkyysetujen vuoksi</li>
  </ul>

  <p>Tavalliselle virkistysmelojalle nämä suorituskykyerot ovat vähäisiä. Useimmat melojat eivät suoriudu paremmin kuin laadukkaalla täytettävällä SUP-laudalla.</p>


  <h2>Aloittelijaystävällisyys</h2>

  <p><strong>Täytettävä SUP voittaa.</strong> Täytettävät SUP-laudat ovat helpompia aloittelijoille, koska:</p>

  <ul>
    <li>Pehmeämpi kansi on mukavampi ja aiheuttaa vähemmän todennäköisesti vammoja kaatumisissa</li>
    <li>Leveämmät, paksummat täytettävät laudat tarjoavat paremman perusvakauden</li>
    <li>Pienempi investointikustannus tekee aloittamisesta helpompaa</li>
    <li>Helppo kuljetus tarkoittaa enemmän mahdollisuuksia meloa</li>
  </ul>


  <h2>Säilytys ja huolto</h2>

  <p>Täytettävät SUP-laudat vaativat kuivausta ja asianmukaista taittamista ennen säilytystä. Kovat laudat voidaan säilyttää koottuina, mutta ne tarvitsevat suojaa auringolta, lämmöltä ja iskuilta. Molemmat hyötyvät makealla vedellä huuhtelusta suolavesikäytön jälkeen.</p>


  <h2>Suositus</h2>

  <p><strong>Valitse täytettävä SUP, jos:</strong> Matkustat, sinulla on rajoitettu säilytystila, melot virkistyskäyttöön tai olet aloittelija. 90 % melojista tulee hyvin toimeen laadukkaalla täytettävällä SUP-laudalla.</p>

  <p><strong>Valitse kova lauta, jos:</strong> Kilpailet, surffaat edistyneillä aalloilla tai priorisoit maksimaalista suorituskykyä kannettavuuden ja kestävyyden sijaan.</p>


  <h2>UKK</h2>

  <h3>Kumpi on kestävämpi: täytettävä SUP vai kova lauta?</h3>

  <p>Täytettävät SUP-laudat ovat yleensä kestävämpiä, koska ne kestävät kolhuja, halkeamia ja iskuvaurioita, jotka vahingoittaisivat pysyvästi kovaa lautaa.</p>


  <h3>Onko täytettävä SUP parempi aloittelijoille?</h3>

  <p>Kyllä. Täytettäviä SUP-lautoja suositellaan aloittelijoille, koska ne ovat anteeksiantavampia, helpompia kuljettaa ja aiheuttavat vähemmän todennäköisesti vammoja kaatumisissa.</p>


  <h3>Voivatko täytettävät SUP-laudat suoriutua yhtä hyvin kuin kovat laudat?</h3>

  <p>Virkistysmelonnassa ja retkeilyssä täytettävät SUP-laudat vastaavat kovien lautojen suorituskykyä. Kovat laudat ovat edelleen parempia kilpailussa ja edistyneessä surffauksessa kevyemmän painonsa ja hienostuneemman taipuisuutensa ansiosta.</p>

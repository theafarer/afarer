features:
  title: 'Mitä co-branding tarkoittaa Afarerilla'
  subtitle: 'Co-branding on suunnittelukumppanuusohjelmamme — rakennettu Afarerin brändin, alueiden suojan ja rajattujen kokoelmien ympärille, ei brändittömän tuotannon.'
  columns: 3
  items:
    - title: 'Afarerin tuotteet pysyvät Afarerin tuotteina'
      description: 'Co-branded-kokoelma on rajattu painos Afarerin lautoja identiteettisi kudottuna osaksi. Se ei ole koskaan bränditön, ei koskaan kolmannen osapuolen brändi eikä avoin oma-merkki-ohjelma.'
      icon: 'tabler:trademark'
    - title: 'Suunniteltu kanssasi'
      description: 'Värisi, nimeämisesi ja tarinasi muovaavat kokoelmaa. Suunnittelu- ja insinööritiimimme hoitaa kannet, grafiikat, pakkaukset ja dokumentaation briefistä toimitukseen.'
      icon: 'tabler:pencil'
    - title: 'Seuroille, lomakohteille, tapahtumille & yhteisöille'
      description: 'Laivastokokoelmia melontaseuroille ja lomakohteille, tapahtumapainoksia kilpailuihin ja yhteisösarjoihin — kaikki Afarerin laadulla ja takuulla.'
      icon: 'tabler:users'
    - title: 'Suojaa maakumppanit'
      description: 'Co-branding toimii rinnakkain yksi maa – yksi jakelija -mallimme kanssa. Kansalliset kumppanit pitävät alueensa; co-brand-kokoelmat eivät avaa ovea rinnakkaisbrändeille heidän markkinoillaan.'
      icon: 'tabler:shield-check'
    - title: 'Insinöörityö & laatustandardit'
      description: 'Jokainen kokoelma toimitetaan sertifioitua toimitusketjuamme pitkin CE- ja ISO 9001 -dokumentaatiolla, painetestauksella ja samoilla QC-tarkistuspisteillä kuin ydinvalikoimassamme.'
      icon: 'tabler:certificate'
    - title: 'Muodostuu brändiomaisuudeksi'
      description: 'Rajattu co-branded-kokoelma rakentaa omaa tarinaasi vedessä — myyntikatetta, mediasisältöä ja syytä melojille palata kausi kaudelta.'
      icon: 'tabler:star'

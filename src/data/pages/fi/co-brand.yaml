faqs:
  title: 'Co-brand — UKK'
  subtitle: 'Miten Afarerin co-branding toimii ja miten se eroaa OEM:sta ja omasta merkistä.'
  items:
    - title: 'Onko co-branding sama asia kuin OEM tai oma merkki?'
      description: 'Ei. Afarer ei enää ylläpidä avointa OEM-/oma-merkki-ohjelmaa. Co-branded-tuotteet pysyvät Afarerin tuotteina — suunniteltuina, insinöörisesti toteutettuina, laaduntarkastettuina ja Afarerin brändin tukemina. Identiteettisi näkyy co-brandina, ei brändittömänä kolmannen osapuolen tuotteena.'
    - title: 'Kuka voi aloittaa co-brand-projektin?'
      description: 'Kelpuutetut vesiurheiluyritykset: nykyiset maakumppanit, melontaseurat, lomakohteet ja hotellit, tapahtumajärjestäjät ja yhteisöt. Lähetä projektibrief, niin vahvistamme soveltuvuuden ennen suunnittelun aloittamista.'
    - title: 'Ajautuuko co-branding ristiriitaan maasi jakelijan kanssa?'
      description: 'Ei. Yksi maa – yksi jakelija -mallilla on etusija. Co-brand-kokoelmat sovitetaan yhteen paikallisen maakumppanin kanssa silloin kun sellainen on, joten suojatulle alueelle ei ilmesty rinnakkais- tai kilpailevaa brändiä.'
    - title: 'Mikä on co-brand-kokoelman vähimmäistilaus?'
      description: 'Pilot-kokoelmat alkavat 30–50 kappaleesta. Vakiokokoelmat ovat 50–100 kpl; suuret tai monialueiset painokset 100+ kpl. Räätälöityjen mallien kehitysaikataulut sovitaan projektittain.'
    - title: 'Mitä on Afarerin laatu ja mitä kumppanin panos?'
      description: 'Afarer omistaa tuotesuunnittelun, insinöörityön, materiaalit, rakenteet, laadunvalvonnan ja takuun. Kumppanit tuovat kokoelman konseptin, nimeämisen, värit, grafiikan ja markkinoilleviennin. Näin vedessä pysyy yksi laatustandardi.'
    - title: 'Miten haen?'
      description: 'Täytä co-brand-yhteydenottolomake yrityksesi, markkinasi ja kokoelmaideasiasi kanssa. Arvioimme soveltuvuuden ja vastaamme 3 arkipäivässä ehdotuksella ja Co-Brand Project Agreementilla.'

intro: >-
  Runko on jokaisen täytettävän SUP-laudan selkäranka. Sen on oltava riittävän kevyt liukuakseen tehokkaasti, riittävän vahva kestääkseen kallioisia rantoja ja riittävän jäykkä muuntaakseen jokaisen melonvedon liikkeeksi eteenpäin. Afarer:ssa runkosuunnittelustudiomme yhdistää edistyneen CAD-mallinnuksen,
  elementtimenetelmälaskennan (FEA) ja vuosikymmenten käytännön lautasuunnittelukokemuksen tuottaakseen runkoja, jotka on optimoitu juuri omaan käyttötarkoitukseensa — eivät geneerisiä muotoja, jotka on poimittu luettelosta.
content_html: >
  <h2>Missä lujuus kohtaa hydrodynamiikan</h2>

  <p>Työskentelemme kolmen pääasiallisen rakennusalustan kanssa — vahvistettujen drop-stitch PVC-ytimien, käsin laminoitujen lasikuitulaminaattien ja rotaatiovalutun polyeteenin — ja meillä on tekninen osaaminen suunnitella, simuloida ja validoida jokainen näistä omassa talossa.</p>


  <h2>Suunnittelutyökalut ja standardit</h2>

  <p>Digitaalinen suunnitteluympäristömme sisältää:</p>

  <table>
    <thead><tr><th>Osaaminen</th><th>Ohjelmisto / työkalu</th><th>Sovelluskohde</th></tr></thead>
    <tbody>
      <tr><td>3D-parametrinen mallinnus</td><td>SolidWorks Professional</td><td>Rungon pinta, reuna- ja stringerivahvikkeet, kannen asettelu, varustekiinnityskohdat</td></tr>
      <tr><td>Elementtimenetelmäanalyysi</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Jännityskartoitus, ominaistaajuusanalyysi, törmäys-/iskusimulaatio</td></tr>
      <tr><td>Laskennallinen virtausdynamiikka</td><td>Ansys Fluent / Star-CCM+</td><td>Hydrodynaamisen vastuksen ennustaminen, trimmin optimointi</td></tr>
      <tr><td>Laminaattisuunnittelu</td><td>ESAComp / CADEC</td><td>Lasikuitukerrosten pinonta, ydinmateriaalin valinta, painoarvio</td></tr>
      <tr><td>Muottivirtaussimulointi</td><td>Moldex3D</td><td>Rotaatiovalun seinämäpaksuuden ennustaminen</td></tr>
    </tbody>
  </table>


  <h2>Suunnitteluprosessimme</h2>

  <p>Jokainen rungon suunnitelma — olipa kyse vakiomallista tai täysin räätälöidystä projektista — noudattaa tarkkaa viisivaiheista prosessia:</p>

  <ol>
    <li><strong>Konsepti ja vaatimusten keruu</strong> — Tapaamme sinut määrittääksemme melojan painon ja hyötykuorman, nopeusalueen, vesitilannekestävyyden, kuljetusvaatimukset ja erityiset tehtävävarusteet (kiinnityspisteet kannella, lastin kiinnityskohdat, lisävarusteiden integrointi).</li>
    <li><strong>3D-pinnanmuotoilu ja hydrostaattinen laskenta</strong> — Rungon muoto mallinnetaan SolidWorksissä ja tarkistetaan hydrostaattisen stabiilisuuden, tilavuusjakauman ja oikaisuvarren osalta sisäänrakennettuja analyysityökaluja käyttäen.</li>
    <li><strong>Rakenteellinen FEA</strong> — Kuormitustapaukset määritellään: staattinen (meloja + varusteet), dynaaminen (aaltolaskun iskut 5g) ja karilleajo (osuminen kallioiseen rantaan nopeudella 3 m/s). Jännitysjakaumat käydään läpi; varmuuskerroin ≥ 2.5 on pakollinen.</li>
    <li><strong>CFD-vastuksen optimointi</strong> — Runko simuloidaan kolmella kuormitustasolla ja viidellä nopeudella. Märkä pinta-ala, trimmikulma ja jäännösvastus pienennetään iteratiivisesti.</li>
    <li><strong>Suunnittelun tarkistus ja luovutus</strong> — Koko suunnittelupaketti (3D-malli, FEA-raportti, CFD-raportti, painoarvio, laminaattikirja) tarkistetaan vanhemman insinöörimme toimesta ennen luovutusta protopajaan.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA-jännitysjakauma — Retkeily-SUP:n runko (vahvistettu drop-stitch)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Varmuuskerroin maksimikuormalla</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Vastuksen vähennys edelliseen sukupolveen verrattuna</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Suurin lyöntipaine (suunnitteluraja)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">FEA-laskennan kokonaisaika vuonna 2025</span>
      </div>
    </div>
  </div>


  <h2>Räätälöinti: sinun runkosi, sinun sääntösi</h2>

  <p>Mikään kaksi melojaa ei ole vaatimuksiltaan samanlainen. Kalastus-SUP tarvitsee leveän, vakaan liukurungon; retkeilylauta tarvitsee siirtorungon, joka maksimoi liukumisen; surf-SUP tarvitsee responsiiviset reunat ja viritetyn rockerin. Emme pakuta käyttötarkoitustasi olemassa olevaan rungon
  muotoon. Suunnittelemme lähtien sinun spesifikaatiostasi.</p>

  <p>Esimerkkejä viimeaikaisista räätälöidyistä rungonsuunnitteluprojekteista:</p>

  <ul>
    <li>Pidennetty retkeily-SUP karibialaiselle ekoturismin matkanjärjestäjälle, vahvistettu keula rantautumisia varten (+15 % reunan paksuus).</li>
    <li>Korkean näkyvyyden partio-SUP satamaviranomaiselle, integroiduilla varustekiinnikkeillä ja taktisilla kiskoilla.</li>
    <li>Retkeily-SUP vuokrakäyttöön, vahvistetuilla reunoilla ja ylimääräisillä lastinkiinnityksillä.</li>
  </ul>


  <h2>Insinöörimme</h2>

  <p>Studiota johtaa vanhempi insinööri, jolla on 14 vuoden kokemus suorituskykyisten lautojen suunnittelusta, ja häntä tukee kaksi FEA:han ja CFD:hen erikoistunutta konetekniikan insinööriä. Kaikilla kolmella on jatkotutkinto meri- tai konetekniikasta kansainvälisesti tunnustetuista
  yliopistoista. Tiimi julkaisee säännöllisesti alan ammattilehdissä ja esiintyy kansainvälisissä konferensseissa suorituskykyisen melontaurheilun tekniikan parissa.</p>


  <h2>Kumppaninasi seuraavassa runkoprojektissasi</h2>

  <p>Ensimmäisestä konseptiluonnoksesta lopulliseen jännitysraporttiin asti rungonsuunnittelustudiomme on kumppanisi laudan luomisessa, joka ei ole vain rakennettu — vaan suunniteltu. Panostamme simulaatioaikaan etukäteen, jotta jokainen hitsi, jokainen laminaattikerros ja jokainen rungon kaari on
  olemassa syystä.</p>

  <p>Tarvitsetpa pienen muokkauksen olemassa olevaan malliin tai täysin puhtaalta pöydältä lähtevän suunnitelman, olemme valmiina keskustelemaan vaatimuksistasi.</p>

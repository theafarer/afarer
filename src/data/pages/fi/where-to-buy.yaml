  description: Selvitä, miten hankit Afarerin täytettävän melontalaudan — maasi virallisen jakelijan kautta tai suoraan Afarer-tiimiltä.
hero:
  tagline: Mistä ostaa
  title: Pääse vesille Afarer SUP-laudallasi
  subtitle: Afarer-laudat tavoittavat melojat yli 50 maassa. Löydä helpoin tapa hankkia omasi — lähimmän virallisen jälleenmyyjän kautta tai suoraan Afarer-tiimiltä.
channels:
  items:
    - title: Viralliset maakohtaiset jakelijat
      description: Afarer tekee yhteistyötä yksinoikeutettujen jakelijoiden kanssa monissa maissa. Kerro, missä melot, ja yhdistämme sinut paikalliseen jälleenmyyjään sekä hinnoitteluun ja saatavuuteen.
      cta: Etsi paikallinen jälleenmyyjäsi
      href: /contact/?subject=Where to Buy
    - title: Tilaus suoraan Afarerilta
      description: Maassasi ei ole vielä jakelijaa? Afarer-tiimi voi järjestää suorat tilaukset ja toimitukset, jotta pääset vesille asuinpisteestäsi riippumatta.
      cta: Kysy saatavuutta
      href: /contact/?subject=Where to Buy
form_intro:
  title: Kysy saatavuutta
  subtitle: Lähetä meille viesti, jossa kerrot maasi ja kiinnostavan lautasi. Tiimimme vastaa yhden arkipäivän kuluessa lähimmästä jälleenmyyjästä tai suoran tilauksen vaihtoehdoista.
business_note:
  text: Ostatko seuralle, lomakohteelle vai kaupalle? Tutustu liiketoiminta- ja kumppanuusohjelmiimme.

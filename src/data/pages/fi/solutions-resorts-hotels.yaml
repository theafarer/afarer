meta:
  title: Lomakohteen SUP-valikoimiratkaisut | {SITE}
  description: Kattavat SUP-laivastoratkaisut lomakeskuksille ja hotelleille. Kaupallisen tason laudat, mukautettu brändäys, henkilökoulutus ja ROI-optimoidut paketit 20–100+ laudasta.
hero:
  tagline: Lomakohteet ja hotellit
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Lomakkeen vieraat nauttivat SUP-lautailusta rikkumattomalla rannalla
roi_section:
  title: Lomakohteiden SUP-tulomalli
  subtitle: Näin lomakohteet tuottavat $50,000 - $200,000+ vuodessa SUP-vuokratuloja yhdellä investoinnilla.
  metrics:
    - metric: $50K–$200K+
      label: Vuotuinen SUP-liikevaihto
      detail: Kohde kohden, laivaston koon ja asiakasluvun mukaan
    - metric: 4–6 kuukautta
      label: Keskimääräinen takaisinmaksuaika
      detail: Koko laivastoinvestointi takaisin yhdessä vuodessa
    - metric: 40%
      label: Tulojen kasvu
      detail: Keskimääräinen parannus siirryttäessä Afarer-valikoimiin
    - metric: 500+
      label: Vuorokierrokset laudaa kohti
      detail: Kaupallisen tason kestävyys päivittäiseen käyttöön
packages:
  title: Lomakohteiden pakettijärjestelmä
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - 12 kuukauden takuu + CE-sertifioitu
      revenue: $50K–$80K vuosittainen liikevaihtopotentiaali
      cta_text: Hanki aloituspaketti
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 50 melaa + 50 pelastusliivää
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - Staff training session (online)
        - 12 kuukauden takuu + CE-sertifioitu
      revenue: $120K–$200K+ vuotuinen tulopotentiaali
      popular: true
      cta_text: Hanki Premium-paketti
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - Omistettu asiakaspäällikkö
        - Prioriteettikorvaruudut (24h toimitus)
        - Custom branding + logo
        - Markkinointi-kuva- ja videopaketti
        - 24 kuukauden takuu + CE-sertifioitu
      revenue: $200K+ vuosittainen tulopotentiaali
      cta_text: Hanki lippulaivapaketti
case_study:
  quote: Afareriin siirtymisen jälkeen SUP-vuokraustulomme kasvoivat 40 %. Lautojen uusintakustannukset laskivat 60 %. Saimme koko kalustoinvestoinnin takaisin 4 kuukaudessa.
  author: Vesiliikuntapäällikkö
  location: 5 tähden lomakeskus, Malediivit
  results:
    - label: Liikevaihdon kasvu
      value: +40%
    - label: Kustannusten vähennys
      value: '-60 %'
    - label: Takaisinmaksuaika
      value: 4 kuukautta
features:
  title: Miksi lomakohteet valitsevat Afarerin
  subtitle: Kaupallisen tason kestävyys, maailmanlaajuiset logistiikat ja kumppani, joka ymmärrää majoitusalan.
  items:
    - title: 500+ vuokrakertaa
      description: Jokainen lauta testataan kestämään 500+ vuokrausjaksoa suolaisessa vedessä, auringonvalossa ja hiekassa.
      icon: tabler:shield-check
    - title: Varaosien lähetys 48 tunnissa
      description: Varaosat lähetetään 48 tunnin kuluessa — vuokratulosi eivät koskaan katkea.
      icon: tabler:truck-delivery
    - title: Räätälöity brändäys
      description: Yhdistä lomakohteesi ilme räätälöidyin värein ja logoin joka laudassa.
      icon: tabler:palette
    - title: Henkilökunnan koulutus
      description: Verkkokoulutus ja paikan päälle koulutusohjelmat toimintatiimillesi.
      icon: tabler:school
    - title: Globaali logistiikka
      description: Toimitukset yli 50 maahan yhdistetyillä rahtivaihtoehdoilla.
      icon: tabler:world
    - title: CE-sertifioitu
      description: Kaikki laitteet CE-sertifioituja, ISO 9001:2015 – turvallisuus ja laatu taattu.
      icon: tabler:certificate

    - metric: 40%
      label: Tulojen kasvu
      detail: Keskimääräinen parannus siirryttäessä Afarer-valikoimiin
    - metric: 500+
      label: Vuorokierrokset laudaa kohti
      detail: Kaupallisen tason kestävyys päivittäiseen käyttöön
packages:
  title: Lomakohteiden pakettijärjestelmä
  subtitle: Valitse paketti, joka sopii vieraskapasiteettiisi ja tulotavoitteisiisi. Kaikki paketit sisältävät 12 kuukauden takuun ja CE-sertifioinnin.
  items:
    - name: Aloituspaketti
      tagline: Boutique-lomakohteille, enintään 20 vierasta/päivä
      features:
        - 20 SUP-lautaa (3 kokoa aikuisille/lapsille)
        - 20 melaa (säädettävät) + 20 pelastusliiviä
        - 4 kaksitoimista pumppua (sähköpumppu lisävarusteena)
        - 2 säilytystelinettä + korjaussetti
        - Oma logotulostus laudoilla
        - 12 kuukauden takuu + CE-sertifioitu
      revenue: $50K–$80K vuosittainen liikevaihtopotentiaali
      cta_text: Hanki aloituspaketti
    - name: Premium-paketti
      tagline: Suurille lomakohteille, 50-100 vierasta/päivä
      features:
        - 50 SUP-lautaa (5 kokoa, sekalainen kalusto)
        - 50 melaa + 50 pelastusliivää
        - 10 kaksitoimista pumppua + 2 sähköpumppua
        - 5 säilytystelinettä + 2 rullavaunua
        - Täysin räätälöity brändäys (laudat, melat, laukut)
        - Henkilöstön koulutusistunto (verkossa)
        - Varaosien lähetys 48 tunnin kuluessa
        - 12 kuukauden takuu + CE-sertifioitu
      revenue: $120K–$200K+ vuotuinen tulopotentiaali
      popular: true
      cta_text: Hanki Premium-paketti
    - name: Lippulaivapaketti
      tagline: Ultra-premium-lomakohteille, 100+ vierasta/päivä
      features:
        - 100+ SUP-lautaa (koko kokovalikoima)
        - Täydellinen lisävarustesarja (melat, liivit, pumput, vaunut)
        - Henkilöstökoulutus paikan päällä (2 päivää)
        - Omistettu asiakaspäällikkö
        - Prioriteettikorvaruudut (24h toimitus)
        - Täysin räätälöity brändäys (laudat + lisävarusteet)
        - Markkinointi-kuva- ja videopaketti
        - 24 kuukauden takuu + CE-sertifioitu
      revenue: $200K+ vuosittainen tulopotentiaali
      cta_text: Hanki lippulaivapaketti

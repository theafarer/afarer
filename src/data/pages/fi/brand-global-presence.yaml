hero:
  tagline: Global Presence
  title: 'Palvelee 50+ maata<br />kaikilla mantereilla'
  subtitle: 'Eurooppalaisista rannikkovartiostoista australialaisiin vesiurheilujakelijoihin ja Lähi-idän pelastusryhmiin —afarer-veneet ovat vesillä maailmanlaajuisesti.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer global marine manufacturing and distribution
stats:
  title: Global Reach
  stats:
    - title: Countries
      amount: '50+'
    - title: Export Markets
      amount: Europe, Americas, Asia, Middle East, Oceania
    - title: Production
      amount: Qingdao, China
    - title: US Warehouse
      amount: Montclair, CA
features3_markets:
  tagline: Key Markets
  title: 'Alueellinen asiantuntemus<br />paikallisiin vaatimuksiin'
  subtitle: 'Ymmärrämme, että eri markkinoilla on erilaiset sääntelyvaatimukset, mieltymykset ja käyttötapaukset.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europe & UK
      description: 'CE-sertifioidut tuotteet, jotka täyttävät EN ISO 6185 -standardit. Vahva kysyntä SUP-veneille, kumiveneille ja SUP-laudoille EU-markkinoilla. Brittiläiset jakelijat arvostavat nopeaa läpimenoaikaamme.'
      icon: tabler:map-pin
    - title: North America
      description: 'US Coast Guard -hyväksytty valmistus. Yhdysvaltain varasto Montclairissa, CA nopeaa länsirannikon toimitusta varten. Kasvava kysyntä kalastus- ja pelastusveneille sekä virkistys-SUP-laudoille.'
      icon: tabler:map-pin
    - title: Australia & Oceania
      description: 'Vahva markkina SUP-veneille ja kumitendereille. Australialaiset jakelijat arvostavat Hypalon-veneitämme UV-kestävyydestä kovissa auringon olosuhteissa. Nopea toimitus Aasian laitokseltamme.'
      icon: tabler:map-pin
    - title: Middle East
      description: 'Kasvava kysyntä partio- ja pelastusveneille. Alumiinirunkoiset SUP-veneemme ovat suosittuja rannikkovartioston ja turvallisuusoperaattoreiden keskuudessa. Räätälöidyt kokoonpanot korkeita lämpötiloja varten.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribution Network
  title: 'Yhteistyötä jakelijoiden kanssa<br />maailmanlaajuisesti'
  subtitle: 'Teemme yhteistyötä vakiintuneiden merialan laitejakelijoiden, OEM-brändien ja julkisten hankintatoimistojen kanssa.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerships
      description: 'Yksityisen etiketin valmistus maailmanlaajuisille vesiurheilubrändeille. Hoidamme kaiken suunnittelusta tuotantoon drop-shippaukseen.'
      icon: tabler:building
    - title: Distributor Network
      description: 'Valtuutetut jakelijat yli 20 maassa pitävät varastoa ja tarjoavat paikallista tukea. Uudet jakelijatiedustelut ovat tervetulleita.'
      icon: tabler:users
    - title: Government & Institutional
      description: 'Suora toimitus rannikkovartiostoille, etsintä- ja pelastusorganisaatioille ja sotilaallisille hankintaohjelmille. Vaatimustenmukaisuus institutionaalisten hankintavaatimusten kanssa.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Maailmanlaajuinen logistiikka & tuki'
  subtitle: 'Tehtaalta määränpäähän —hoidamme koko toimitusketjun.'
  items:
    - title: Shipping Options
      description: 'Merirahti (FOB Qingdao), lentorahti kiireellisille tilauksille ja pikalähetys näytteille ja varaosille.'
      icon: tabler:truck-delivery
    - title: US Warehouse
      description: 'Varastoa Montclairissa, CA nopeaa toimitusta varten koko Pohjois-Amerikassa. Länsirannikko: 2-3 päivää, Keskiosa: 3-4 päivää, Itärannikko: 4-5 päivää.'
      icon: tabler:building-warehouse
    - title: Spare Parts
      description: 'Aidot afarer-varaosat ja kulutustarvikkeet varastoituna ympäri vuoden. Tavalliset osat lähetetään 24 tunnin kuluessa.'
      icon: tabler:package
    - title: Technical Support
      description: 'Suora yhteys insinööritiimiimme teknisiä kysymyksiä, korjausneuvoja ja kunnostustukea varten. Tuemme veneitä, jotka rakensimme 20 vuotta sitten.'
      icon: tabler:headset
cta:
  title: 'Haluatko tulla jakelijaksi?'
  subtitle: 'Laajennamme aktiivisesti jakeluverkostoamme. Ota yhteyttä vientitiimiimme keskustellaksesi kumppanuusmahdollisuuksista.'
  actions:
    - variant: primary
      text: Partnership inquiry
      href: /contact
    - text: View our product range
      href: /products

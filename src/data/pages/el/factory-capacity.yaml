workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50—0 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: SUP Boat Production
    description: 'Εξειδικευμένο εργαστήριο κύτους υαλονήματος με 6 σταθμούς καλουπιών για κύτη SUP έως 7,6 m. Ο χώρος συγκόλλησης σωλήνων και συναρμολόγησης εξυπηρετεί 3— SUP ταυτόχρονα. Ετήσια χωρητικότητα SUP: 2.000+ σκάφη.'
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & SUP
    description: 'Πολλαπλών χρήσεων γραμμές παραγωγής για φουσκωτά σκάφη, καγιάκ και βοηθητικά σκάφη. Οι σταθμοί συγκόλλησης θερμού αέρα, οι πρέσες RF και οι σταθμοί συναρμολόγησης επαναδιαμορφώνονται βάσει της σύνθεσης παραγγελιών. Ετήσια χωρητικότητα: 5.000+ μονάδες.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'Ξεχωριστός χώρος παραγωγής καθαρού δωματίου για σωσίβια και εξοπλισμό ασφαλείας. Αφιερωμένοι σταθμοί ραψίματος, τοποθέτησης αφρού και δοκιμών. Ετήσια χωρητικότητα σωσιβίων: 50.000+ μονάδες.'
    output: '50,000+ life vests/year'


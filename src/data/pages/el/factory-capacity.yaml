hero:
  tagline: Παραγωγική Δυνατότητα
  title: Παραγωγική Δυναμικότητα & Ετήσια Παραγωγή
  subtitle: Εγκαταστάσεις 12,000 m² με παραγωγή άνω των 15,000 σκαφών ετησίως και δυνατότητα επέκτασης
intro: >-
  afarer operates one of the largest dedicated inflatable boat manufacturing facilities in Qingdao, China. Our 12,000 m² factory is organized into six specialized workshops operating in parallel, giving us the capacity to produce over 15,000 boats annually across SUP, SUP, SUP, SUP, and safety
  equipment lines.
highlights:
  - value: 12,000 m²
    label: Συνολικός χώρος παραγωγής
    detail: Σε 6 εξειδικευμένα εργαστήρια παραγωγής
  - value: 15,000+
    label: Boats produced annually
    detail: SUPs, SUPs, RIBs, SUPs, safety gear
  - value: 200+
    label: Εξειδικευμένο εργατικό δυναμικό
    detail: 25+ μηχανικοί, 2 βάρδιες/ημέρα
  - value: 50+
    label: Χώρες εξαγωγής
    detail: ΕΕ, ΗΠΑ, Αυστραλία, Μέση Ανατολή, Ασία
  - value: 30–45
    label: Τυπικός χρόνος παράδοσης (ημέρες)
    detail: Από την επιβεβαίωση παραγγελίας έως FOB
  - value: 10+
    label: Χρόνια εξαγωγικής εμπειρίας
    detail: Από το 2012
workshops:
  - title: Παραγωγή Σανίδων SUP
    description: '4 παράλληλες γραμμές συναρμολόγησης για φουσκωτές σανίδες SUP. Κάθε γραμμή μπορεί να παράγει 50–80 σανίδες ανά βάρδια. Οι σταθμοί ψηφιακής και μεταξοτυπικής εκτύπωσης λειτουργούν ταυτόχρονα. Ετήσια δυναμικότητα SUP: 8,000+ σανίδες.'
    output: 8.000+ SUP ετησίως
  - title: SUP Boat Production
    description: 'Εξειδικευμένο εργαστήριο κύτους υαλονήματος με 6 σταθμούς καλουπιών για κύτη SUP έως 7,6 m. Ο χώρος συγκόλλησης σωλήνων και συναρμολόγησης εξυπηρετεί 3–6 SUP ταυτόχρονα. Ετήσια χωρητικότητα SUP: 2.000+ σκάφη.'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'Πολλαπλών χρήσεων γραμμές παραγωγής για φουσκωτά σκάφη, καγιάκ και βοηθητικά σκάφη. Οι σταθμοί συγκόλλησης θερμού αέρα, οι πρέσες RF και οι σταθμοί συναρμολόγησης επαναδιαμορφώνονται βάσει της σύνθεσης παραγγελιών. Ετήσια χωρητικότητα: 5.000+ μονάδες.'
    output: 5,000+ μονάδες/έτος
  - title: Εξοπλισμός Ασφαλείας
    description: 'Ξεχωριστός χώρος παραγωγής καθαρού δωματίου για σωσίβια και εξοπλισμό ασφαλείας. Αφιερωμένοι σταθμοί ραψίματος, τοποθέτησης αφρού και δοκιμών. Ετήσια χωρητικότητα σωσιβίων: 50.000+ μονάδες.'
    output: 50.000+ σωσίβια/έτος
oem_capacity:
  moq: 'SUP: 5–10 units | SUP: 2–5 units | SUP/SUP: 10–50 units | Custom mould: 200+ units'
  lead_time: Τυπική παράδοση 30–45 ημέρες. Δείγμα 15–10 ημέρες. Διατίθεται επείγουσα εκτέλεση.
  payment: T/T 30% κράτηση + 70% πριν την αποστολή. L/C, Western Union αποδέκτα.

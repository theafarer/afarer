intro: >-
  Η afarer διαχειρίζεται μία από τις μεγαλύτερες ειδικές εγκαταστάσεις κατασκευής φουσκωτών σκαφών στο Qingdao της Κίνας. Το εργοστάσιο των 12.000 m² είναι οργανωμένο σε έξι εξειδικευμένα εργαστήρια που λειτουργούν παράλληλα, προσφέροντάς μας την ικανότητα να παράγουμε πάνω από 15.000 σκάφη ετησίως στις γραμμές SUP, καγιάκ, βοηθητικών σκαφών, RIB και εξοπλισμού ασφαλείας.

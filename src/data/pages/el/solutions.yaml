features3_solutions:
  tagline: Λύσεις ανά Τύπο Επιχείρησης
  title: Σανίδες SUP Σχεδιασμένες για τον Σκοπό<br />Για την Επιχείρησή σας
  isBeforeContent: false
  columns: 2
  items:
    - title: Θέρετρα & Ξενοδοχεία
      description: Πλήρη προγράμματα στόλου SUP για ιδιοκτησίες φιλοξενίας — ανθεκτικοί πίνακες, προσαρμοσμένη μάρκα και υποστήριξη εκπαίδευσης προσωπικού.
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: Λέσχες Paddle
      description: Αξιόπιστοι στόλοι SUP για συλλόγους SUP, προγράμματα μαθημάτων και λειτουργίες μελών —σανίδες επαγγελματικής ποιότητας με τιμές για συλλόγους.
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: Εταιρείες Ενοικίασης
      description: Πλεύσεις SUP υψηλής περιστροφής μηχανοδομημένες για καθημερινή χρήση ενοικιάσης. Ανθεκτικές στο UV, γρήγορης αποξήρανσης, στοιβάσιμες — σχεδιασμένες για την καθημερινή κόπο της ενοικίασης.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: Πάροχοι Λιανικής Πώλησης
      description: Πουλήστε την ταχύτερα αναπτυσσόμενη μάρκα SUP στην αγορά σας. Πλήρης σειρά προϊόντων, υλικό μάρκετινγκ, dropshipping και ανταγωνιστικά περιθώρια κέρδους.
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: Διανομείς
      description: Αποκλειστικές περιοχές, πλήρες χαρτοφυλάκιο προϊόντων, εξειδικευμένη διαχείριση λογαριασμών. Γίνετε μέλος του παγκόσμιου δικτύου διανομής μας σε περισσότερες από 50 χώρες.
      icon: tabler:world
      link: /solutions/distributors
    - title: Χτίστε τη Δική σας Μάρκα
      description: Ολοκληρωμένη κατασκευή OEM/ODM σανίδων SUP — σχεδιασμός, πρωτοτυποποίηση, μαζική παραγωγή και logistics. Ξεκινήστε τη μάρκα σας με την Afarer.
      icon: tabler:package
      link: /solutions/build-your-own-brand
cta:
  title: Δεν είστε σίγουροι ποια λύση καλύπτει τις ανάγκες σας;
  subtitle: Περιγράψτε την εφαρμογή σας στην ομάδα μας και θα σας προτείνουμε τη σωστή διαμόρφωση.
  actions:
    - variant: primary
      text: Λάβετε μια σύσταση
      href: /contact

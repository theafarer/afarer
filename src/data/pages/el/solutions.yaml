hero:
  tagline: Επιχειρηματικές Λύσεις
  title: SUP Λύσεις<br />Για κάθε επιχείρηση
  subtitle: Από resorts και λιανική πώληση έως εταιρείες ενοικίασης και παγκόσμιους διανομείς — η Afarer παρέχει ολοκληρωμένες λύσεις SUP προσαρμοσμένες στο επιχειρηματικό σας μοντέλο.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: Σανίδες SUP της Afarer για επιχειρηματικές και επαγγελματικές εφαρμογές

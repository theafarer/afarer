features:
  title: 'Δυνατότητες Κατασκευής Βαρκών'
  subtitle: 'Από το PVC έως το έτοιμο σκάφος: κάθε φουσκωτή βάρκα περνά από τα εξειδικευμένα εργαστήριά μας.'
  columns: 3
  items:
    - title: 'Εξειδικευμένα Εργαστήρια'
      description: 'Κοπή PVC, συναρμολόγηση drop-stitch, συγκόλληση υψηλής συχνότητας, συναρμολόγηση και εξειδικευμένες δοκιμές.'
      icon: 'tabler:scissors'
    - title: 'PVC & Hypalon'
      description: 'Φουσκωτές βάρκες από PVC υψηλής αντοχής ή Hypalon για τις ανάγκες και τις αγορές σας.'
      icon: 'tabler:droplet'
    - title: 'Έλεγχος Ποιότητας'
      description: 'Δοκιμές πίεσης, αντοχή ραφών, άνωση και αντοχή σε UV ελέγχονται σε κάθε σκάφος.'
      icon: 'tabler:shield-check'
    - title: 'Προσαρμογή'
      description: 'Λογότυπο, χρώματα, διαφράγματα, διαμερίσματα — μια προσαρμοσμένη φουσκωτή βάρκα με την επωνυμία σας.'
      icon: 'tabler:palette'
    - title: 'OEM / ODM'
      description: 'Ανάπτυξη προσαρμοσμένων μοντέλων για επωνυμίες, διανομείς και επαγγελματικούς στόλους.'
      icon: 'tabler:building-factory'
    - title: 'Παγκόσμια Αποστολή'
      description: 'FOB Qingdao, πλήρη κοντέινερ ή συγκεντρωμένα φορτία, υποστήριξη τελωνειακών διατυπώσεων.'
      icon: 'tabler:world'
faqs:
  title: 'Συχνές Ερωτήσεις Κατασκευής Φουσκωτών Βαρκών'
  subtitle: 'Απαντήσεις για την έναρξη του έργου OEM φουσκωτών βαρκών σας.'
  items:
    - title: 'Τι τύπους φουσκωτών βαρκών κατασκευάζετε;'
      description: 'Φουσκωτές βαρκούλες, πνευματικές λέμβους, βάρκες ψαρέματος, σκάφη εργασίας και προσαρμοσμένα μοντέλα PVC.'
    - title: 'Μπορείτε να προσαρμόσετε μια φουσκωτή βάρκα;'
      description: 'Ναι — λογότυπο, χρώματα, διαφράγματα, ενισχύσεις και επιλογές κινητήρα κατά την προδιαγραφή σας.'
    - title: 'Ποιος είναι ο χρόνος παράδοσης για έργο OEM βαρκών;'
      description: 'Το δείγμα αποστέλλεται σε 3-4 εβδομάδες, η μαζική παραγωγή σε 35-50 ημέρες ανάλογα με το μοντέλο.'

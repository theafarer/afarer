meta:
  title: 'Ζητήστε προσφορά — παραγωγή SUP OEM | {SITE}'
  description: 'Ζητήστε μια λεπτομερή προσφορά για το έργο σας με φουσκωτό SUP ή σκάφος. Παραγωγή OEM/ODM, ιδιωτική ετικέτα ή στόλοι κατά παραγγελία — απαντάμε εντός 2 εργάσιμων ημερών.'
  keywords:
    - 'αίτημα προσφοράς SUP'
    - 'προσφορά OEM paddle board'
    - 'προσφορά εργοστασίου SUP'
    - 'τιμή φουσκωτού SUP'
hero_text:
  tagline: Ζητήστε Προσφορά
  title: Ζητήστε μια Προσφορά<br />για το Έργο σας
  subtitle: Πείτε μας τις απαιτήσεις σας και η ομάδα μας θα απαντήσει με λεπτομερή προσφορά εντός 2 εργάσιμων ημερών.
steps2_process:
  title: Πώς Λειτουργεί
  subtitle: Τέσσερα απλά βήματα από το αίτημα έως την προσφορά.
  items:
    - title: 'Βήμα 1: Υποβάλετε τις Απαιτήσεις σας'
      description: Συμπληρώστε την παρακάτω φόρμα με τον τύπο προϊόντος, την ποσότητα και τις προδιαγραφές. Όσο περισσότερες λεπτομέρειες παρέχετε, τόσο πιο ακριβής θα είναι η προσφορά σας.
      icon: tabler:file-text
    - title: 'Βήμα 2: Εξετάζουμε & Συμβουλεύουμε'
      description: Η ομάδα μηχανικών μας εξετάζει τις απαιτήσεις σας και μπορεί να επικοινωνήσει μαζί σας για διευκρινίσεις. Παρέχουμε συστάσεις σχετικά με τη διαμόρφωση και τις επιλογές προϊόντος.
      icon: tabler:users
    - title: 'Βήμα 3: Λάβετε την Προσφορά σας'
      description: Λαμβάνετε μια λεπτομερή προσφορά που περιλαμβάνει τιμολόγηση ανά μονάδα, MOQ, χρόνο παράδοσης, όρους πληρωμής και επιλογές αποστολής. Συνήθως εντός 48 ωρών.
      icon: tabler:currency-dollar
    - title: 'Βήμα 4: Δείγμα & Παραγωγή'
      description: Μετά την αποδοχή της προσφοράς, προχωράμε σε παραγωγή δείγματος (εάν ισχύει) ή απευθείας σε μαζική παραγωγή. Τακτικές ενημερώσεις σε όλη τη διαδικασία.
      icon: tabler:building-factory
content_form:
  tagline: Φόρμα Προσφοράς
  title: Πείτε Μας για το Έργο σας
  subtitle: Όλα τα πεδία με * είναι υποχρεωτικά.
  contact_fields:
    firstName: Όνομα
    lastName: Επώνυμο
    companyName: Εταιρεία
    email: Email
  fields:
    - name: Κατηγορία προϊόντος
      type: select
      options:
        - Σανίδα SUP
        - Φουσκωτό SUP
        - Φουσκωτή Σανίδα SUP
        - Σωσίβιο Γιλέκο
        - Ναυτικό Αξεσουάρ
        - Προσαρμοσμένο OEM/ODM
    - name: Εφαρμογή
      type: select
      options:
        - Κέντρο Κατάδυσης
        - Ψάρεμα
        - Θαλάσσιος Τουρισμός / Εστία
        - Έρευνα & Διάσωση
        - Tender Γιοτ
        - Εμπορικό Εργατικό Πλοίο
        - Κυβέρνηση / Στρατός
        - OEM / Ιδιωτική Ετικέτα
        - Προσωπική / Ψυχαγωγική
        - Άλλο
    - name: Ποσότητα
      type: text
      placeholder: π.χ. 50 τεμάχια
    - name: Αγορά-στόχος
      type: text
      placeholder: π.χ. Ευρώπη, Βόρεια Αμερική, Μέση Ανατολή
    - name: Χώρα παράδοσης
      type: text
      placeholder: π.χ. Ιταλία, ΗΑΕ, ΗΠΑ, Αυστραλία
    - name: Προτίμηση υλικού
      type: select
      options:
        - Χωρίς Προτίμηση
        - PVC Ναυτιλιακής Ποιότητας (1100 dtex)
        - Hypalon / CSM υψηλής ποιότητας
        - Γάστρα από Fiberglass
        - Γάστρα Αλουμινίου
    - name: Απαιτήσεις κινητήρα
      type: text
      placeholder: πχ 60 HP εξωτερικός κινητήρας, χωρίς κινητήρα, δίδυμος 115 HP
    - name: Απαιτούμενη προσαρμογή
      type: text
      placeholder: π.χ. προσαρμοσμένα χρώματα, branding/λογότυπο, συσκευασία, ειδικά εξαρτήματα
    - name: Χρονοδιάγραμμα
      type: text
      placeholder: π.χ. παράδοση εντός 90 ημερών
    - name: Πρόσθετες απαιτήσεις
      type: textarea
      placeholder: Περιγράψτε την εφαρμογή σας, τις τεχνικές προδιαγραφές ή τυχόν ειδικές απαιτήσεις — συμπεριλάβετε σχέδια αναφοράς, προδιαγραφές ή συνδέσμους, εάν διατίθενται
    - name: Μεταφόρτωση προδιαγραφών
      type: file
      placeholder: Ανεβάστε το φύλλο προδιαγραφών, το σχέδιο ή το έγγραφο αναφοράς σας (PDF, DWG, DXF)
    - name: Μεταφόρτωση λογότυπου / γραφικών
      type: file
      placeholder: Ανεβάστε το λογότυπο ή τα γραφικά σας για προσαρμοσμένη σήμανση (AI, EPS, PNG)
cta:
  title: Προτιμάτε να συζητήσετε μέσω email;
  subtitle: Στείλτε το αίτημά σας απευθείας στην ομάδα πωλήσεών μας και θα απαντήσουμε εντός 24 ωρών.
  actions:
    - variant: primary
      text: Στείλτε μας email απευθείας
      href: /contact

hero:
  tagline: Partners & Distribution
  title: 'Γίνετε Συνεργάτης afarer<br />—Παγκόσμιο Δίκτυο Διανομής'
  subtitle: "Join afarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries."
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: Partner Programs
  title: 'Προγράμματα Συνεργατών<br />Σχεδιασμένα για Ανάπτυξη'
  subtitle: 'Είτε είστε διανομέας, έμπορος ή συνεργάτης επωνυμίας, η afarer προσφέρει προγράμματα σχεδιασμένα να υποστηρίζουν την επιχείρησή σας.'
  columns: 3
  items:
    - title: 'Πρόγραμμα Διανομέα'
      description: 'Αποκλειστική διανομή περιοχής με τιμολόγηση όγκου, υποστήριξη μάρκετινγκ και άμεση πρόσβαση στο εργοστάσιο. Απαιτείται ελάχιστη δέσμευση βάσει μεγέθους περιοχής.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Άμεση τιμολόγηση αντιπροσώπου, εκπαίδευση προϊόντος, υλικό μάρκετινγκ και υποστήριξη εγγύησης για φυσικά καταστήματα και ηλεκτρονικά καταστήματα.'
      icon: tabler:building-store
    - title: 'Συνεργασία OEM/ODM'
      description: 'Πλήρης κατασκευή OEM και ODM με προσαρμοσμένη επωνυμία, συσκευασία και προδιαγραφές προϊόντος. Από την ιδέα έως το κοντέινερ.'
      icon: tabler:certificate
    - title: 'Συνεργασία Επωνυμίας'
      description: 'Συν-επωνυμία, ιδιωτική ετικέτα και αποκλειστικά προγράμματα μοντέλων για καθιερωμένες επωνυμίες στον χώρο θαλάσσιας και υπαίθριας αναψυχής.'
      icon: tabler:stars
    - title: 'Κυβερνητικό & Θεσμικό'
      description: 'Προγράμματα προτιμώμενου προμηθευτή για κυβερνητικές υπηρεσίες, ακτοφυλακές, στρατιωτικές και ανθρωπιστικές οργανώσεις. Έγγραφα έτοιμα για διαγωνισμό.'
      icon: tabler:building-community
    - title: 'Συνεργάτης Θέρετρου & Ενοικιάσεων'
      description: 'Τιμολόγηση στόλου, σταθερή ποιότητα και προσαρμοσμένη επωνυμία για θέρετρα, καταδυτικά κέντρα και επιχειρήσεις ενοικίασης παγκοσμίως.'
      icon: tabler:sun
content_benefits:
  tagline: Why Partner With Us
  title: 'Γιατί οι Συνεργάτες Επιλέγουν την afarer'
  subtitle: 'Οι συνεργάτες μας επωφελούνται από πραγματική κατασκευαστική ικανότητα, σταθερή ποιότητα και άμεση υποστήριξη.'
  list:
    - 'Άμεση Πρόσβαση Εργοστασίου: Εργαστείτε απευθείας με την ομάδα κατασκευής μας —χωρίς μεσάζοντες. Ταχύτερες απαντήσεις, καλύτερες τιμές και πλήρης ορατότητα παραγωγής.'
    - 'Έτοιμο για Προσαρμογή: Τοποθετήστε την επωνυμία σας με προσαρμοσμένα χρώματα, λογότυπα, συσκευασία και προδιαγραφές. Ελάχιστες ποσότητες παραγγελίας προσαρμοσμένες στην αγορά σας.'
    - 'Ποιότητα Εγγυημένη: Πιστοποιημένη παραγωγή ISO 9001 με συμμόρφωση CE, UKCA και BSCI. Κάθε προϊόν δοκιμάζεται πριν από την αποστολή.'
    - 'Παγκόσμια Logistics: Αποστολή από Qingdao, Κίνα με επιλογές FOB, CIF και DDP. Αποθήκη ΗΠΑ στο Montclair, CA για διανομή Βόρειας Αμερικής.'
    - 'Υποστήριξη Μάρκετινγκ: Κατάλογοι προϊόντων, φωτογραφία, τεχνική τεκμηρίωση και ψηφιακά στοιχεία για την υποστήριξη των πωλήσεών σας.'
    - 'Εκπαίδευση & Υποστήριξη: Εκπαίδευση προϊόντος για την ομάδα πωλήσεών σας, τεχνική υποστήριξη για τους πελάτες σας και συντονισμό υπηρεσίας εγγύησης.'
content_process:
  tagline: How to Become a Partner
  title: 'Απλή Διαδικασία Συνεργασίας'
  subtitle: 'Η διαδικασία συνεργασίας μας είναι άμεση —σχεδιασμένη για να σας βάλει γρήγορα στην πώληση προϊόντων afarer.'
  items:
    - title: 'Βήμα 1: Υποβολή Αίτησης'
      description: 'Συμπληρώστε την αίτηση συνεργασίας με το προφίλ της εταιρείας σας, την αγορά-στόχο και τα ενδιαφέροντα προϊόντων.'
    - title: 'Βήμα 2: Αξιολόγηση Προσόντων'
      description: 'Η ομάδα συνεργασιών μας εξετάζει την αίτησή σας και επικοινωνεί μαζί σας εντός 3 εργάσιμων ημερών για να συζητήσει ευκαιρίες.'
    - title: 'Βήμα 3: Συμφωνία & Ρύθμιση'
      description: 'Υπογράψτε μια συμφωνία συνεργασίας, ρυθμίστε τον λογαριασμό σας και λάβετε τιμολόγηση συνεργάτη, υλικό μάρκετινγκ και δείγματα προϊόντων.'
    - title: 'Βήμα 4: Εκπαίδευση & Εκκίνηση'
      description: 'Παρέχεται εκπαίδευση προϊόντος, υποστήριξη πωλήσεων και διαφημιστικό υλικό. Είστε έτοιμοι να ξεκινήσετε τις πωλήσεις.'
cta:
  title: 'Έτοιμοι να γίνετε συνεργάτης afarer;'
  subtitle: 'Υποβάλετε αίτηση συνεργασίας και η ομάδα μας θα απαντήσει εντός 3 εργάσιμων ημερών.'
  actions:
    - variant: primary
      text: Apply for partnership
      href: /contact
    - text: View our products
      href: /products

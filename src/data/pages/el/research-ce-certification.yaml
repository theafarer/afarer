hero:
  tagline: Συμμόρφωση
  title: Πώς Λειτουργεί η Πιστοποίηση CE για Φουσκωτά Σκάφη
  subtitle: 7 min ανάγνωση
content_html: >
  <h2>Τι Είναι η Πιστοποίηση CE;</h2>

  <p>Η σήμανση CE (Conformit&eacute; Europ&eacute;enne) υποδηλώνει ότι ένα προϊόν πληροί τις απαιτήσεις της ΕΕ για την υγεία, την ασφάλεια και το περιβάλλον. Για τα φουσκωτά σκάφη, το σχετικό κανονιστικό πλαίσιο εξαρτάται από την κατηγορία του προϊόντος.</p>


  <h2>Ισχύουσες Οδηγίες</h2>


  <h3>Οδηγία για τα Σκάφη Αναψυχής (2013/53/EU)</h3>

  <p>Η κύρια οδηγία για τα περισσότερα φουσκωτά σκάφη, SUP και καγιάκ. Ισχύει για σκάφη αναψυχής με μήκος γάστρας από 2.5 m έως 24 m, για ημιτελή σκάφη (για προμήθεια OEM) και για ατομικά θαλάσσια οχήματα.</p>


  <h3>Κανονισμός για τον Ατομικό Προστατευτικό Εξοπλισμό (2016/425)</h3>

  <p>Τα σωσίβια, οι βοηθητικές πλευστικές συσκευές και ο εξοπλισμός ασφάλειας που διατίθενται με τα σκάφη πρέπει να πληρούν τις απαιτήσεις του Κανονισμού ΑΠΕ, συμπεριλαμβανομένης της εξέτασης τύπου (Ενότητα B) από κοινοποιημένο φορέα και της διασφάλισης ποιότητας παραγωγής (Ενότητα D ή E).</p>


  <h2>Η Διαδικασία Πιστοποίησης</h2>

  <ol>
    <li>Κατάταξη προϊόντος: Προσδιορισμός της κατηγορίας σχεδιασμού του σκάφους (A – D σύμφωνα με το ISO 8666)</li>
    <li>Ισχύοντα πρότυπα: EN ISO 6185 (Μέρη 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (πινακίδα κατασκευαστή)</li>
    <li>Προετοιμασία τεχνικού φακέλου: Σχέδια κατασκευής, Κατάλογος Υλικών (BOM), πιστοποιητικά υλικών, εκτίμηση κινδύνου</li>
    <li>Δοκιμές τύπου: Πλευστότητα, ευστάθεια, ικανότητα φόρτωσης, δοκιμές υλικών, αντοχή ραφής, διατήρηση αέρα</li>
    <li>Έλεγχος παραγωγής στο εργοστάσιο: Έλεγχος των διαδικασιών παραγωγής από κοινοποιημένο φορέα</li>
    <li>Δήλωση Συμμόρφωσης: Ο κατασκευαστής υπογράφει τη Δήλωση Συμμόρφωσης (DoC) και τοποθετεί τη σήμανση CE</li>
  </ol>


  <h2>Κοινοποιημένοι Φορείς για Φουσκωτά Σκάφη</h2>

  <p>Κοινοί κοινοποιημένοι φορείς (NB) περιλαμβάνουν τους Bureau Veritas (Γαλλία), DNV GL (Γερμανία), RINA (Ιταλία), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Γερμανία).</p>


  <h2>Χρονοδιάγραμμα και Κόστη</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Φάση</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Διάρκεια</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Τυπικό Κόστος (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Προετοιμασία τεχνικού φακέλου</td><td class="p-3 border">2 – 4 εβδομάδες</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Δοκιμές τύπου</td><td class="p-3 border">4 – 8 εβδομάδες</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Έλεγχος εργοστασίου</td><td class="p-3 border">1 – 2 ημέρες (επί τόπου)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Σύνολο (πρώτο προϊόν)</td><td class="p-3 border">8 – 14 εβδομάδες</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>


  <h2>Τι Σημαίνει Αυτό για τους Αγοραστές</h2>

  <p>Όταν αγοράζετε φουσκωτά σκάφη πιστοποιημένα κατά CE, βεβαιωθείτε πάντα ότι η σήμανση CE υπάρχει στην πινακίδα του κατασκευαστή, ότι υπάρχει έγκυρη Δήλωση Συμμόρφωσης (DoC), ότι αναφέρεται ο αριθμός του κοινοποιημένου φορέα και ότι το εγχειρίδιο χρήσης περιλαμβάνει οδηγίες ασφάλειας στην τοπική
  σας γλώσσα. Όλα τα προϊόντα Afarer φέρουν πιστοποίηση CE με πλήρη ιχνηλασιμότητα έως τις εκθέσεις ελέγχου των κοινοποιημένων φορέων.</p>

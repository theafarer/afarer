faqs:
  title: 'Συχνές Ερωτήσεις για την Παραγωγή OEM SUP'
  subtitle: 'Απαντήσεις στις πιο συνηθισμένες ερωτήσεις επωνυμιών που λανσάρουν το δικό τους SUP.'
  items:
    - title: 'Πώς δημιουργώ τη δική μου επωνυμία SUP;'
      description: 'Λανσάρετε την επωνυμία σας σε 16 εβδομάδες: σύνοψη, σχεδιασμός, πιστοποιημένο πρωτότυπο CE, μαζική παραγωγή και παράδοση. Εξερευνήστε τα πακέτα OEM μας.'
    - title: 'Ποιος είναι ο χρόνος παραγωγής;'
      description: 'Το δείγμα είναι έτοιμο σε 2-3 εβδομάδες, η μαζική παραγωγή σε 30-45 ημέρες ανάλογα με τον όγκο.'
    - title: 'Φέρει το SUP το λογότυπό μας;'
      description: 'Ναι — πλήρης ιδιωτική ετικέτα: εκτύπωση λογότυπου, προσαρμοσμένα χρώματα, συσκευασία και ετικέτες με την επωνυμία σας.'
    - title: 'Μπορώ να αγοράσω χονδρικά από την πρώτη μέρα;'
      description: 'Το MOQ είναι 50 μονάδες για τα τυπικά μοντέλα, με κλιμακωτές χονδρικές τιμές ανάλογα με τον όγκο.'

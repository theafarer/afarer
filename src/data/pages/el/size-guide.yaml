how_to_choose:
  title: Πώς να επιλέξεις το σωστό μέγεθος
  cards:
    - title: Σανίδες SUP
      description: Διάλεξε μήκος βάσει βάρους και χρήσης. Οι φαρδύτερες σανίδες (32"+) προσφέρουν μεγαλύτερη σταθερότητα. Οι μακρύτερες σανίδες (11-12 πόδια) κρατούν καλύτερα πορεία σε τουρισμό. Οι βαρύτεροι κωπηλάτες χρειάζονται σανίδες μεγαλύτερου όγκου.
    - title: Touring SUP
      description: Οι μακρύτερες σανίδες (11–12 πόδια) είναι ιδανικές για κάλυψη αποστάσεων και τουρισμό. Οι φαρδύτερες σανίδες (32"+) προσφέρουν μεγαλύτερη σταθερότητα. Ελέγξτε τη χωρητικότητα βάρους για το συνολικό φορτίο, συμπεριλαμβανομένου του εξοπλισμού.
    - title: All-Around SUP
      description: Επιλέξτε μήκος βάσει βάρους αναβάτη και χρήσης. Οι all-around σανίδες εξυπηρετούν ψυχαγωγία, γυμναστική και γιόγκα. Οι μικρότερες σανίδες είναι πιο εύκολες στον χειρισμό.

categories:
  inflatable: Φουσκωτά SUP και καγιάκ σχεδιασμένα για φορητότητα χωρίς συμβιβασμούς στην απόδοση. Επίλεξε το σωστό μέγεθος για το βάρος και το στυλ κωπηλασίας σου.
  sup: Σανίδες κωπηλασίας όρθιας στάσης για touring, γιόγκα, γυμναστική και ψυχαγωγική κωπηλασία. Επιλέξτε ανάλογα με το μήκος και το βάρος του αναβάτη.

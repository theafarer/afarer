categories:
  inflatable: Φουσκωτά SUP σχεδιασμένα για φορητότητα χωρίς συμβιβασμούς στην απόδοση. Επίλεξε το σωστό μέγεθος για το βάρος και το στυλ κωπηλασίας σου.
  sup: Σανίδες κωπηλασίας όρθιας στάσης για touring, γιόγκα, γυμναστική και ψυχαγωγική κωπηλασία. Επιλέξτε ανάλογα με το μήκος και το βάρος του αναβάτη.
  accessory: Αξεσουάρ και εξοπλισμός ασφαλείας για να συμπληρώσεις τη σανίδα SUP σου. Universal μεγέθη με πολλαπλές επιλογές.

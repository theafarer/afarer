how_to_choose:
  title: Πώς να επιλέξεις το σωστό μέγεθος
  cards:
    - title: Σανίδες SUP
      description: Διάλεξε μήκος βάσει βάρους και χρήσης. Οι φαρδύτερες σανίδες (32"+) προσφέρουν μεγαλύτερη σταθερότητα. Οι μακρύτερες σανίδες (11-12 πόδια) κρατούν καλύτερα πορεία σε τουρισμό. Οι βαρύτεροι κωπηλάτες χρειάζονται σανίδες μεγαλύτερου όγκου.
    - title: Καγιάκ
      description: Τα μονά καγιάκ (9 πόδια) είναι καλύτερα για σόλο ταξίδια και ποτάμια. Τα διπλά καγιάκ (12 πόδια) χωρούν δύο κωπηλάτες ή έναν ενήλικα με εξοπλισμό. Έλεγξε τη χωρητικότητα φόρτωσης για το συνολικό βάρος, συμπεριλαμβανομένου του εξοπλισμού.
    - title: Σκάφη και SUP
      description: Διάλεξε μήκος σκάφους βάσει αριθμού επιβατών και χρήσης. Τα μεγαλύτερα SUP (4,5 m+) είναι κατάλληλα για ανοιχτή θάλασσα και διάσωση. Τα μικρότερα σκάφη (2,7 m) χρησιμεύουν ως βοηθητικά και ψαρευτικές πλατφόρμες.

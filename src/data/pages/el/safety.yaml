hero:
  tagline: Ασφάλεια
  title: Πρότυπα ασφαλείας και πιστοποίηση
  subtitle: Κάθε προϊόν afarer υποβάλλεται σε αυστηρές δοκιμές και πληροί διεθνή πρότυπα ασφαλείας για ψυχαγωγική και επαγγελματική χρήση.
certifications:
  - title: Πιστοποίηση CE
    description: Όλος ο εξοπλισμός ασφαλείας afarer πληροί τις απαιτήσεις σήμανσης CE σύμφωνα με τον Ευρωπαϊκό Κανονισμό Μέσων Ατομικής Προστασίας (ΕΕ) 2016/425.
  - title: null
    description: Τα σωσίβια συμμορφώνονται με τα πρότυπα άνωσης . Το Life Vest Classic παρέχει άνωση 50N+· το Life Vest Pro πληροί τις απαιτήσεις SOLAS με αυτόματο φούσκωμα.
  - title: Συμμόρφωση με SOLAS
    description: Το Life Vest Pro συμμορφώνεται με τους κανονισμούς SOLAS (Ασφάλεια ζωής στη θάλασσα) για υπεράκτιες θαλάσσιες και εμπορικές επιχειρήσεις.

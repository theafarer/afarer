hero:
  tagline: Marine Expertise
  title: 'Δεκαετίες Θαλάσσιας Μηχανικής<br />σε Κάθε Κύτος'
  subtitle: 'Η afarer συνδυάζει βαθιά επιστήμη υλικών, κατασκευή ακριβείας και δοκιμές πραγματικού κόσμου για να παράγει σκάφη που αποδίδουν όταν έχει σημασία.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer marine engineering and R&D team at work
expertise_materials:
  tagline: Material Science
  title: 'Επιλέγοντας το Σωστό Υλικό<br />για Κάθε Εφαρμογή'
  subtitle: 'Δουλεύουμε με τρία βασικά υλικά —το καθένα επιλεγμένο για συγκεκριμένες περιπτώσεις χρήσης και απαιτήσεις απόδοσης.'
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: '1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.'
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: 'Ανώτερη χημική αντοχή και σταθερότητα UV. Τα σκάφη Hypalon μπορούν να διαρκέσουν 15-20 χρόνια με σωστή φροντίδα. Συνιστώνται για εμπορικές, διασωστικές και στρατιωτικές εφαρμογές όπου η μακροπρόθεσμη ανθεκτικότητα είναι κρίσιμη.'
      icon: tabler:shield
    - title: Fiberglass & Aluminum
      description: 'Κύτη υαλονήματος βαθιάς V για SUP και περιπολικά σκάφη —απόδοση κοπής κυμάτων σε δύσκολες συνθήκες. Κύτη αλουμινίου για βαρέως τύπου εμπορικά σκάφη εργασίας που απαιτούν μέγιστη αντοχή και χωρητικότητα φορτίου.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Manufacturing Capabilities
  title: 'Κατασκευή Ακριβείας<br />σε Κάθε Βήμα'
  subtitle: 'Η εγκατάστασή μας 12.000 m² είναι εξοπλισμένη με εξειδικευμένα μηχανήματα για κάθε στάδιο παραγωγής.'
  columns: 2
  items:
    - title: CNC Cutting
      description: 'Η κοπή με υπολογιστή εξασφαλίζει ακριβή, επαναλαμβανόμενα πάνελ υφάσματος με ελάχιστα απόβλητα. Κάθε κομμάτι ταιριάζει ακριβώς όπως σχεδιάστηκε.'
      icon: tabler:cpu
    - title: High-Frequency Welding
      description: 'Η βιομηχανική συγκόλληση HF δημιουργεί ραφές ισχυρότερες από το βασικό υλικό. Ο συνεπής έλεγχος θερμοκρασίας και πίεσης εξασφαλίζει αεροστεγείς σφραγίσεις σε κάθε παραγωγή.'
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: 'Χιλιάδες πολυεστερικές κλωστές συνδέουν τα πάνω και κάτω στρώματα υφάσματος, επιτρέποντας φούσκωμα υψηλής πίεσης (15-20 PSI) για άκαμπτες, σταθερές σανίδες SUP και δάπεδα.'
      icon: tabler:building-arch
    - title: Pressure Testing
      description: 'Κάθε φουσκωτό προϊόν υποβάλλεται σε δοκιμή πίεσης πριν από την αποστολή. Οι σωλήνες SUP δοκιμάζονται στο 1,5x της ονομαστικής πίεσης —αν αντέξει εκεί, θα αποδώσει στο νερό.'
      icon: tabler:wind
    - title: Seam Strength Testing
      description: 'Τυχαία δείγματα από κάθε παρτίδα παραγωγής υποβάλλονται σε καταστροφική δοκιμή αντοχής ραφής. Τα αποτελέσματα καταγράφονται και είναι ιχνηλάσιμα σε συγκεκριμένες παραγωγές.'
      icon: tabler:files
    - title: Water Testing
      description: 'Κάθε μοντέλο SUP υποβάλλεται σε θαλάσσιες δοκιμές πριν από την πιστοποίηση. Οι δοκιμές πραγματικών συνθηκών σε παράκτιες συνθήκες επικυρώνουν την απόδοση, τον χειρισμό και τη σταθερότητα.'
      icon: tabler:droplet
expertise_design:
  tagline: Design & Engineering
  title: 'Σχεδιασμένο για Πραγματικές Συνθήκες'
  subtitle: 'Η φιλοσοφία σχεδιασμού μας ξεκινά με το πώς θα χρησιμοποιηθεί το σκάφος —και στη συνέχεια χτίζει τη μηχανική γύρω από αυτήν την περίπτωση χρήσης.'
  items:
    - title: Deep-V Hull Design
      description: "Our fiberglass hulls feature calculated deadrise angles optimized for each model's length and intended use. Steeper V for rough-water performance, shallower for stability."
    - title: Multi-Chamber Safety
      description: 'Κάθε σκάφος διαθέτει 3-7 ανεξάρτητους αεροθαλάμους. Εάν ένα διαμέρισμα τεθεί εκτός λειτουργίας, οι υπόλοιποι θάλαμοι διατηρούν το σκάφος στην επιφάνεια και λειτουργικό.'
    - title: Ergonomic Layout
      description: 'Η θέση κονσόλας, το ύψος σωλήνα και η τοποθέτηση καθίσματος σχεδιάζονται με γνώμονα την άνεση του χειριστή κατά την παρατεταμένη χρήση —είτε περιπολία, ψάρεμα ή μεταφορά.'
    - title: Custom Configuration
      description: 'Χρώματα σωλήνων, διάταξη κονσόλας, χωρητικότητα καυσίμου, βάσεις αξεσουάρ —κάθε μοντέλο μπορεί να προσαρμοστεί για να ταιριάζει σε συγκεκριμένες επιχειρησιακές απαιτήσεις.'
cta:
  title: 'Έχετε κατά νου μια συγκεκριμένη εφαρμογή;'
  subtitle: 'Η ομάδα μηχανικών μας μπορεί να συμβουλεύσει για την επιλογή υλικών, τον σχεδιασμό και την κατασκευή για το έργο σας.'
  actions:
    - variant: primary
      text: Ask our engineers
      href: /contact

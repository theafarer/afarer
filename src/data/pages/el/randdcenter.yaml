rd_services:
  tagline: Προσαρμοσμένη Έρευνα & Ανάπτυξη
  title: Υπηρεσίες R&D για εταίρους
  services:
    - title: Ανάπτυξη Προσαρμοσμένων Υλικών
      desc: Αναπτύσσουμε προσαρμοσμένες συνταγές υφασμάτων, στοίβες λαμινάτ και συστήματα προσκόλλησης προσαρμοσμένα στο περιβάλλον λειτουργίας και τους στόχους απόδοσης σας.
    - title: Μηχανολογική Ανάπτυξη Προϊόντων OEM / ODM
      desc: Αναπτύσσουμε προσαρμοσμένες συνταγές υφασμάτων, στοίβες λαμινάτ και συστήματα προσκόλλησης προσαρμοσμένα στο περιβάλλον λειτουργίας και τους στόχους απόδοσης σας.
    - title: Ανεξάρτητες Δοκιμές & Πιστοποίηση από Τρίτους
      desc: Χρησιμοποιήστε τις εγκαταστάσεις δοκιμών μας σύμφωνα με τις προδιαγραφές ISO για ανεξάρτητο έλεγχο υλικών, επικύρωση προϊόντων και υποστήριξη πιστοποίησης.
  cta: Συζητήστε τις απαιτήσεις Έρευνας & Ανάπτυξης →
  cta_link: /contact
vision:
  tagline: Το Όραμά μας
  title: Διαμορφώνοντας το Μέλλον των Θαλάσσιων Σπορ
  body: >-
    Η afarer επιδιώκει να ηγηθεί του κλάδου των φουσκωτών σκαφών και των σανίδων SUP μέσω της συνεχούς καινοτομίας, της ακλόνητης ποιότητας και της σταθερής δέσμευσης στην ασφάλεια και τη βιωσιμότητα — εμπλουτίζοντας τελικά τις εμπειρίες των λάτρεων των θαλάσσιων σπορ σε όλο τον κόσμο. Το Κέντρο
    Έρευνας & Ανάπτυξης της afarer είναι το σημείο όπου το πάθος συναντά την καινοτομία, θέτοντας νέα πρότυπα για τον κλάδο των θαλάσσιων σπορ.
labs_section:
  tagline: Εργαστήρια
  title: Τα Εργαστήριά μας
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: Εργαστήριο Υφασμάτων PVC
      description: Συνεχής έρευνα και δοκιμές υφασμάτων σωλήνων PVC και Hypalon για έλκος, ανθεκτικότητα σε UV, τριβή και ευελικξία σε χαμηλές θερμοκρασίες για να διασφαλιστεί μακροχρόνια αξιοπιστία σε θαλασσινά περιβάλλοντα.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Στούντιο Μηχανικής Γάστρας
      description: Σχεδιασμός με CAD και ανάλυση πεπερασμένων στοιχείων (FEA) για γάστρες από HDPE, αλουμίνιο και fiberglass. Κάθε γάστρα προσομοιώνεται ψηφιακά ως προς την κατανομή τάσεων και την αντοχή σε κρούση πριν από την κατασκευή του πρώτου πρωτοτύπου.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: Κέντρο RF Συγκόλλησης
      description: Εξειδικευμένη εγκατάσταση συγκόλλησης ραδιοσυχνοτήτων (RF) με ακριβή έλεγχο θερμοκρασίας και πίεσης, που παράγει ραφές υψηλής αντοχής και πλήρως αεροστεγείς, σύμφωνες με τα πρότυπα της ναυτιλιακής βιομηχανίας για τα φουσκωτά σκάφη.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Δεξαμενή Υδροδυναμικών Δοκιμών
      description: Δοκιμές με μοντέλα κλίμακας στην εσωτερική μας δεξαμενή δοκιμών για τη βελτιστοποίηση της μορφής της γάστρας, των επιδόσεων πλεύσης σε υδρολίσθηση, της ευστάθειας και της οικονομίας καυσίμου σε ποικιλία συνθηκών φόρτισης και θαλάσσης.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Εργαστήριο Πρωτοτύπων
      description: Εγκατάσταση πρωτοτυποποίησης και εξοπλισμού πλήρους κλίμακας όπου τα νέα μοντέλα κατασκευάζονται, εξοπλίζονται και δοκιμάζονται στη θάλασσα. Κάθε πρωτότυπο υποβάλλεται σε πρόγραμμα δοκιμών στο νερό τουλάχιστον 20 ωρών πριν από την έγκριση παραγωγής.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Εργαστήριο Ποιότητας & Επιθεώρησης
      description: Εξειδικευμένο εργαστήριο διασφάλισης ποιότητας που διενεργεί δοκιμές εφελκυσμού, κύκλους συγκράτησης αέρα, δοκιμές αποκόλλησης ραφών και πιστοποίηση υλικών, ώστε κάθε σκάφος που βγαίνει από το εργαστήριο να πληροί τις δημοσιευμένες προδιαγραφές μας.
      href: /randdcenter/quality-inspection-lab

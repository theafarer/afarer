meta:
  title: Κέντρο Ε&Α | {SITE}
  description: Έρευνα & Ανάπτυξη — δοκιμές υφασμάτων PVC, μηχανική γάστρας, συγκόλληση RF, υδροδυναμικές δοκιμές και ποιοτικός έλεγχος. Διατίθενται προσαρμοσμένες υπηρεσίες Ε&Α.
hero:
  tagline: Κέντρο Έρευνας & Ανάπτυξης
  title: Κέντρο Έρευνας & Ανάπτυξης
  subtitle: Εστίαση στην Πρόοδο
intro:
  - >-
    Το Κέντρο Έρευνας και Ανάπτυξης (R&D) του afarer είναι η κινούσα δύναμη πίσω από την αποστολή μας να αναβαθμίσουμε τον εξοπλισμό υδατικών αθλημάτων. Ενεργοποιούμε τους ερασιτέχνες υδατικών αθλημάτων παγκοσμίως με ασφαλέστερα, πιο άνετα και πιο απόλαυστα προϊόντα μέσα από σταθερή καινοτομία σε
    αερόστατα πλωτά παντελάντια SUP και πλοία. Η αφιερωμένη ομάδα μας από μηχανικούς, σχεδιαστές και παθιασμένους ειδικούς υδατικών αθλημάτων σχεδιάζει το μέλλον της βιομηχανίας, συνεχώς υψώνοντας το επίπεδο ποιότητας, απόδοσης και βιωσιμότητας.
  - >-
    Η μονάδα Έρευνας & Ανάπτυξης μας συγκεντρώνει επιστήμονες υλικών, ναυπηγούς και μηχανικούς παραγωγής κάτω από μία στέγη. Από τη σύνθεση υφασμάτων και την προσομοίωση γάστρας έως την ανάπτυξη διαδικασιών συγκόλλησης και τις δοκιμές πλήρους κλίμακας στη θάλασσα, κάθε στάδιο ανάπτυξης προϊόντος
    καθοδηγείται από δεδομένα και επικυρώνεται μέσω δοκιμών.
mission:
  tagline: Η Αποστολή μας
  title: Καινοτομούμε το Μέλλον των Θαλάσσιων Σπορ
  pillars:
    - icon: lightning
      title: Τεχνολογική Πρόοδος
      desc: Πρωτοπορούμε σε νέα υλικά, σχέδια και μεθόδους κατασκευής για ανώτερη απόδοση και μακροζωία προϊόντων.
    - icon: design
      title: Σχεδιασμός με Επίκεντρο τον Χρήστη
      desc: Κατανόηση σε βάθος και υπέρβαση των αναγκών του χρήστη μέσω εργονομικού και διαισθητικού σχεδιασμού προϊόντων.
    - icon: globe
      title: Βιώσιμες Πρακτικές
      desc: Ελαχιστοποίηση του περιβαλλοντικού μας αποτυπώματος με τη χρήση φιλικών προς το περιβάλλον υλικών και διαδικασιών.
    - icon: shield
      title: Αδιαπραγμάτευτη Ασφάλεια
      desc: Διασφάλιση των υψηλότερων προτύπων ασφάλειας μέσω αυστηρών δοκιμών και πιστοποίησης.
pillars:
  - title: Τεχνολογική Πρόοδος
    desc: Πρωτοπόρια νέα υλικά, σχεδιασμοί και διαδικασίες κατασκευής για να προσφέρουμε ανώτερη απόδοση και μακροβιότητα προϊόντων.
    icon: tech
  - title: Προηγμένα Υλικά
    desc: Έρευνα πρωτοποριακών PVC, Ύπανιον, σύνθετων υλικών και βιώσιμων εναλλακτικών για βελτιωμένα χαρακτηριστικά προϊόντος.
    icon: materials
  - title: Βιωσιμότητα
    desc: 'Μια βασική δέσμευση: Είμαστε αφοσιωμένοι στη φροντίδα του περιβάλλοντος μέσω βιώσιμης παραγωγής και ανακυκλώσιμων υλικών.'
    icon: sustainability
capabilities:
  tagline: Δυνατότητες
  title: Δυνατότητες Έρευνας & Ανάπτυξης
  subtitle: Τέσσερις βασικοί τομείς εξειδίκευσης που μας δίνουν πλήρη έλεγχο από άκρη σε άκρη στην ανάπτυξη προϊόντων — από την έρευνα πρώτων υλών έως την τελική πιστοποίηση.
  groups:
    - title: Επιστήμη Υλικών & Τεχνολογία Υφασμάτων
      items:
        - Ανάλυση και βελτιστοποίηση της σύνθεσης PVC και Hypalon
        - Σταθεροποίηση έναντι UV, επιβραδυντικά φλόγας και ανάπτυξη αντιμικροβιακών πρόσθετων
        - Τεχνική επικάλυψης πολλαπλών στρωμάτων υφάσματος και πρόσφυσης
        - Δοκιμές επιτάχυνσης γήρανσης (UV, θερμικές, υγρασίας, αναβροχίας αλάτιος)
    - title: Μηχανική Γάστρας & Υδροδυναμική
      items:
        - Παραμετρικός σχεδιασμός κύλωσης 3D και CFD βελτιστοποίηση
        - Ανάλυση πεπερασμένων στοιχείων για δομικά φορτία και φορτία κρούσης
        - Δοκιμές σε δεξαμενή ρυμούλκησης με μοντέλα κλίμακας και επαλήθευση επιδόσεων
        - Ανάπτυξη προσαρμοσμένων γαστρών για ειδικά προφίλ αποστολών
    - title: Τεχνολογία Συγκόλλησης & Ένωσης
      items:
        - Ανάπτυξη και βελτιστοποίηση διαδικασιών διηλεκτρικής συγκόλλησης RF
        - Μέθοδοι συγκόλλησης με ζεστό αέρα, θερμή σφήνα και υπερήχους
        - Πιστοποίηση κόλλησης με συγκολλητικές ουσίες και ταινιών ραφών
        - Μοντελοποίηση αντοχής ραφών και πρόβλεψη διάρκειας ζωής
    - title: Δοκιμές, Πιστοποίηση & Συμμόρφωση
      items:
        - Διαχείριση ποιότητας και δοκιμές συμμόρφωσης CE
        - Ανεξάρτητες δοκιμές από τρίτους και υποστήριξη πιστοποίησης
        - Ανάπτυξη προσαρμοσμένου πρωτοκόλλου δοκιμών για προκρίσεις προμήθειας
        - Ανάλυση αστοχιών κατά τη λειτουργία και διερεύνηση βασικής αιτίας

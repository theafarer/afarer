intro: >-
  Ένα φουσκωτό σκάφος είναι τόσο αξιόπιστο όσο και οι ραφές του. Μία μόνο αδύναμη συγκόλληση μπορεί να θέσει σε κίνδυνο ολόκληρο τον θάλαμο — και στη θάλασσα, μια βλάβη θαλάμου δεν είναι απλώς ταλαιπωρία· αποτελεί κίνδυνο για την ασφάλεια. Στην {SITE.name}, έχουμε επενδύσει σε ένα αποκλειστικό
  Κέντρο Συγκόλλησης Ραδιοσυχνοτήτων (RF) που συνδυάζει πρέσες διηλεκτρικής συγκόλλησης βιομηχανικής κλάσης με αυστηρό έλεγχο διαδικασίας και δοκιμές μετά τη συγκόλληση. Κάθε ραφή που παράγουμε τεκμηριώνεται, είναι ιχνηλάσιμη και πιστοποιημένη ώστε να πληροί ή να υπερβαίνει τις απαιτήσεις του ISO 6185 — του
  διεθνούς προτύπου για φουσκωτά σκάφη.
content_html: >
  <h2>Η επιστήμη πίσω από τη ραφή</h2>

  <p>Η συγκόλληση RF χρησιμοποιεί ηλεκτρομαγνητική ενέργεια υψηλής συχνότητας (συνήθως 27,12 MHz) για να διεγείρει τα πολικά μόρια στο ύφασμα με επίστρωση PVC ή Hypalon, παράγοντας θερμότητα ακριβώς στη διεπιφάνεια του υλικού. Σε αντίθεση με τη συγκόλληση με ζεστό αέρα ή με θερμή σφήνα, η συγκόλληση
  RF δημιουργεί έναν πραγματικό μοριακό δεσμό — τα δύο στρώματα υφάσματος συντήκονται σε ένα ενιαίο ομοιογενές υλικό στη ζώνη συγκόλλησης, παράγοντας μια ένωση εξίσου ισχυρή με το ίδιο το μητρικό υλικό.</p>


  <h2>Εξοπλισμός συγκόλλησης και έλεγχος διαδικασίας</h2>

  <p>Το κέντρο συγκόλλησής μας είναι εξοπλισμένο με:</p>

  <table>
    <thead><tr><th>Μηχάνημα</th><th>Ισχύς / Χωρητικότητα</th><th>Εφαρμογή</th></tr></thead>
    <tbody>
      <tr><td>Διηλεκτρική πρέσα RF 1</td><td>15 kW, πλάκα 2000 × 600 mm</td><td>Κύριες διαμήκεις ραφές, ενώσεις τρανσόμ με θάλαμο</td></tr>
      <tr><td>Διηλεκτρική πρέσα RF 2</td><td>10 kW, πλάκα 1500 × 500 mm</td><td>Συγκολλήσεις διαφραγμάτων, προσαρτήσεις κώνων, μπαλώματα βαλβίδων</td></tr>
      <tr><td>Συγκολλητής RF με έλεγχο CNC</td><td>8 kW, τράπεζα XY 2500 × 1200 mm</td><td>Καμπύλες ραφές, ανάγλυφη εκτύπωση λογότυπων/πάνελ, μπαλώματα ακριβείας</td></tr>
      <tr><td>Αυτόματος συγκολλητής θερμής σφήνας</td><td>Μεταβλητή θερμοκρασία, μέγιστο 1,2 m/min</td><td>Εφεδρική μέθοδος για υλικά Hypalon/CSM</td></tr>
    </tbody>
  </table>

  <p>Κάθε πρέσα RF είναι εξοπλισμένη με παρακολούθηση θερμοκρασίας και πίεσης κλειστού βρόχου. Οι παράμετροι συγκόλλησης — ισχύς, χρόνος πίεσης, χρόνος ψύξης, πίεση ηλεκτροδίων — προγραμματίζονται ανά τύπο υλικού και καταγράφονται στο Σύστημα Εκτέλεσης Κατασκευών (MES) για πλήρη ιχνηλασιμότητα.</p>


  <h2>Δοκιμές ποιότητας συγκόλλησης — κάθε ραφή, κάθε βάρκα</h2>

  <p>Η ακεραιότητα της συγκόλλησης επαληθεύεται μέσω ενός υποχρεωτικού πρωτοκόλλου τεσσάρων δοκιμών:</p>

  <ol>
    <li><strong>Οπτική επιθεώρηση</strong> — Το 100 % των ραφών επιθεωρείται οπτικά για διατρήσεις, κακή ευθυγράμμιση, επιμολύνσεις ή ατελή σύντηξη. Όριο ποσοστού απόρριψης: 0,5 % των γραμμικών μέτρων.</li>
    <li><strong>Δοκιμή αποκόλλησης</strong> — Μια λωρίδα πλάτους 25 mm κόβεται από δοκίμιο που συγκολλάται με κάθε παρτίδα παραγωγής. Ελάχιστη δύναμη αποκόλλησης: 120 N/25 mm για PVC 1100 dtex.</li>
    <li><strong>Δοκιμή συγκράτησης αέρα</strong> — Κάθε ολοκληρωμένος θάλαμος πιέζεται στο 1,5 × της πίεσης λειτουργίας και παραμένει υπό πίεση για 30 λεπτά. Η πτώση πίεσης δεν πρέπει να υπερβαίνει το 2 %.</li>
    <li><strong>Δοκιμή θερμικής καταπόνησης</strong> — Τα δοκίμια υποβάλλονται σε 50 κύκλους από -20 °C έως +60 °C και στη συνέχεια επανελέγχονται με δοκιμή αποκόλλησης. Αποδεκτή απώλεια αντοχής: &lt; 10 %.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Σύγκριση Αντοχής Αποκόλλησης — RF vs Συγκόλληση με Θερμό Αέρα (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Συγκόλληση RF</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Θερμός Αέρας</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium"> ελάχιστο</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Η συγκόλληση RF επιτυγχάνει σταθερά το 90-95 % της αντοχής του μητρικού υλικού, αρκετά πάνω από το ελάχιστο.</p>
  </div>


  <h2>Επαγγελματική τεχνογνωσία</h2>

  <p>Η ομάδα συγκόλλησής μας διευθύνεται από ανώτερο μηχανικό διαδικασιών με 11 χρόνια εμπειρίας στη διηλεκτρική συγκόλληση επιστρωμένων υφασμάτων. Κάθε χειριστής ολοκληρώνει ένα εσωτερικό πρόγραμμα πιστοποίησης 6 μηνών πριν του επιτραπεί να εργαστεί σε ραφές παραγωγής. Η επαναπιστοποίηση είναι
  υποχρεωτική ετησίως και περιλαμβάνει πρακτική δοκιμή συγκόλλησης που αξιολογείται σύμφωνα με το εσωτερικό μας πρότυπο Grade-A (αντοχή αποκόλλησης ≥ 160 N/25 mm).</p>


  <h2>Προσαρμοσμένες λύσεις συγκόλλησης για ειδικές απαιτήσεις</h2>

  <p>Κατανοούμε ότι μια ενιαία προδιαγραφή συγκόλλησης δεν καλύπτει κάθε εφαρμογή. Το Κέντρο Συγκόλλησης RF αναπτύσσει τακτικά προσαρμοσμένες διαμορφώσεις ραφών για πελάτες με ειδικές απαιτήσεις:</p>

  <ul>
    <li><strong>Ενισχυτικά μπαλώματα πολλαπλών στρωμάτων</strong> — για περιοχές με μεγάλη φθορά, όπως οι προστατευτικές ράβδοι τριβής και οι κώνοι πλώρης, αναπτύσσουμε πολλαπλά περάσματα συγκόλλησης RF που ενσωματώνουν ανθεκτικό στη φθορά εξωτερικό στρώμα χωρίς να διακυβεύεται η ευκαμψία.</li>
    <li><strong>Αγώγιμες ή αδιαφανείς στις RF ραφές</strong> — για στρατιωτικά σκάφη ή σκάφη επιτήρησης που απαιτούν ηλεκτρομαγνητική θωράκιση, συγκολλούμε αγώγιμα πλέγματα εντός της δομής της ραφής.</li>
    <li><strong>Συγκόλληση πάνελ με αλλαγή χρώματος</strong> — πάνελ υφάσματος δύο χρωμάτων (π.χ. πορτοκαλί γάστρα + γκρι κατάστρωμα) συγκολλημένα με κρυφή επικάλυψη, ώστε να διατηρείται η αισθητική της επωνυμίας χωρίς ορατή γραμμή ένωσης.</li>
  </ul>


  <h2>Η δέσμευσή μας απέναντί σας</h2>

  <p>Κάθε βάρκα που παραδίδουμε φέρει την εγγύηση ποιότητας συγκόλλησης: εάν οποιαδήποτε ραφή αποτύχει σε κανονική χρήση εντός της περιόδου εγγύησης, επισκευάζουμε ή αντικαθιστούμε τον σχετικό θάλαμο χωρίς κανένα κόστος και διενεργείται έρευνα βασικής αιτίας για την αποτροπή επανεμφάνισης. Αυτό δεν
  είναι απλώς μια εγγύηση — είναι μια δέσμευση για συνεχή βελτίωση που βασίζεται σε πραγματικά λειτουργικά δεδομένα.</p>

  <p>Όταν επιλέγετε το {SITE.name}, επιλέγετε ραφές που έχουν σχεδιαστεί, δοκιμαστεί και τεκμηριωθεί — όχι απλώς συγκολληθεί. Αυτή είναι η διαφορά μεταξύ μιας βάρκας που επιπλέει και μιας βάρκας που αποδίδει.</p>

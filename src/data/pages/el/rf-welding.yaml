  title: Κέντρο RF Συγκόλλησης
  subtitle: Τεχνολογία διαηλεκτρικής σύνδεσης για συγκολλήσεις που κρατούν υπό πίεση
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-1-1200w.webp

hero:
  tagline: Μελέτες περιπτώσεων
  title: Πραγματικά έργα, πραγματικά αποτελέσματα<br />—afarer σε δράση
  subtitle: Δείτε πώς η afarer συνεργάζεται με διανομείς, μάρκες και φορείς εκμετάλλευσης παγκοσμίως για την παροχή προσαρμοσμένων θαλάσσιων λύσεων για κάθε εφαρμογή.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Μελέτες περιπτώσεων afarer —προσαρμοσμένα έργα θαλάσσιας κατασκευής
features3_cases:
  tagline: Επιλεγμένες περιπτώσεις
  title: Προσαρμοσμένες λύσεις<br />για πραγματικές προκλήσεις
  isBeforeContent: false
  columns: 3
  items:
    - title: Στόλος Ευρωπαϊκού Κέντρου Κατάδυσης
      customer: BlueMed Diving Centers
      country: Ελλάδα
      industry: Καταδύσεις & Θαλάσσιος Τουρισμός
      challenge: >-
        Απαιτήθηκαν 12 πλεύσεις SUP με διαμόρφωση για κατάδυση για αλυσίδα καταδυτικών κέντρων σε πολλές ελληνικές νήσους. Κάθε πλάτος χρειαζόταν προσαρμοσμένη προσάρτηση εξοπλισμού, αποθήκευση για 8 ντουζίνες και σταθερή πλατφόρμα για ωκεανική είσοδο δυτών. Η στολή πρέπει να φτάσει εντός 60 ημερών
        για την έναρξη της τουριστικής περιόδου.
      solution: >-
        Παρήγαμε 12 μοντέλα SUP Voyager Dive με ενσωματωμένες σχάρες εξοπλισμού, σταθερές πλατφόρμες και εξαιρετικά φαρδιά κατασκευή drop-stitch για σταθερότητα κατά την επιβίβαση. Κάθε σανίδα έφερε τον εταιρικό χρωματισμό του στόλου του πελάτη. Και οι 12 σανίδες ελέγχθηκαν με δοκιμή πίεσης και
        στάλθηκαν από το Qingdao εντός 55 ημερών.
      product: SUP Voyager Dive
      results: Και οι 12 σανίδες παραδόθηκαν εγκαίρως για την τουριστική σεζόν. Ο στόλος λειτουργεί καθημερινά για 18+ μήνες χωρίς καμία αστοχία υλικού. Ο πελάτης παρήγγειλε 6 επιπλέον μονάδες τον δεύτερο χρόνο.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Το SUP Voyager Dive αποτελεί τη ραχοκοκαλιά των καθημερινών καταδυτικών μας εργασιών. Η ευστάθεια είναι εξαιρετική και η διάταξη αποθήκευσης εξοπλισμού διατηρεί το κατάστρωμα καθαρό και ασφαλές για τους επισκέπτες μας.
      icon: tabler:lifebuoy
    - title: Πρόγραμμα OEM Αυστραλού Διανομέα
      customer: Pacific Watersports Pty Ltd
      country: Αυστραλία
      industry: Κατασκευή OEM/ODM
      challenge: >-
        Ένας Αυστραλός διανομέας χρειαζόταν μια σειρά σανίδων SUP ιδιωτικής ετικέτας σε ανταγωνιστικές τιμές, για να ανταγωνιστεί τις κινεζικές μάρκες που πωλούν απευθείας στους καταναλωτές. Απαιτήθηκαν 8 μοναδικά μοντέλα για όλα τα επίπεδα, από αρχάριους έως προχωρημένους, με εξατομικευμένα
        γραφικά, εξατομικευμένη συσκευασία και αποστολή απευθείας (drop-ship) στα σημεία λιανικής.
      solution: >-
        Αναπτύξαμε 8 μοντέλα SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) με αποκλειστικό πακέτο γραφικών για την Αυστραλία. Προσαρμοσμένη συσκευασία λιανικής με κωδικούς QR που οδηγούν σε βίντεο συναρμολόγησης. Logistics drop-ship διαμορφωμένα από το Qingdao
        απευθείας σε αυστραλιανά καταστήματα λιανικής.
      product: Προσαρμοσμένη Γραμμή SUP (8 μοντέλα)
      results: Από την ιδέα έως την πρώτη αποστολή σε 90 ημέρες. Ποσοστό πώλησης λιανικής 85% την πρώτη σεζόν. Ο διανομέας επέκτεινε τη συνεργασία συμπεριλαμβάνοντας επιπλέον μοντέλα SUP τον δεύτερο χρόνο.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Το afarer παρέδωσε ολοκληρωμένη γραμμή SUP σε 90 ημέρες — από την αρχική σχεδίαση μέχρι την αλιγόρουλη πώληση. Η ποιότητα ανταποκρίνεται σε μάρκες που πουλούν στο διπλάσιο της τιμής.
      icon: tabler:currency-dollar
    - title: Προμήθεια Σκαφών Διάσωσης Μέσης Ανατολής
      customer: Εθνική Αρχή Πολιτικής Άμυνας
      country: Ηνωμένα Αραβικά Εμιράτα
      industry: Έρευνα & Διάσωση
      challenge: Μια οργάνωση πολιτικής άμυνας χρειαζόταν 20 SUP έτοιμα για περιπολία για παράκτια έρευνα και διάσωση, ασφάλεια λιμένων και αντιμετώπιση πλημμυρών. Απαιτούνταν σανίδες υψηλής ορατότητας, πλήρης εξοπλισμός ασφαλείας και συμμόρφωση με τους τοπικούς κανονισμούς ναυσιπλοΐας.
      solution: >-
        Παραδώσαμε 20 μοντέλα SUP Patrol με κατασκευή drop-stitch υψηλής ορατότητας σε πορτοκαλί χρώμα, πλήρη πακέτα ασφαλείας, αντανακλαστική ταινία SOLAS και ενισχυμένη κατασκευή. Κάθε σανίδα ήταν πιστοποιημένη κατά CE και δοκιμασμένη σύμφωνα με τα ισχύοντα πρότυπα. Το πακέτο τεκμηρίωσης
        περιλάμβανε πιστοποιητικά συμμόρφωσης για την τοπική καταχώριση.
      product: SUP Patrol
      results: Στόλος αναπτυγμένος σε 5 παράκτιους σταθμούς. Οι σανίδες λειτουργούν σε ακραία ζέστη (45°C+) χωρίς καμία υποβάθμιση. Η απόδοση και η αντοχή υπερέβησαν τις προδιαγραφές.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Το SUP Patrol ξεπέρασε τις επιχειρησιακές μας απαιτήσεις. Σε συνθήκες ακραίας ζέστης, οι σανίδες δεν παρουσιάζουν κανένα σημάδι υποβάθμισης από την υπεριώδη ακτινοβολία (UV) μετά από 24 μήνες καθημερινής χρήσης.
      icon: tabler:alert-triangle
    - title: Συνεργασία OEM Ευρωπαϊκής Μάρκας
      customer: North Sea Marine Equipment BV
      country: Ολλανδία
      industry: Κατασκευή OEM/ODM
      challenge: Μια καθιερωμένη ευρωπαϊκή ναυτιλιακή μάρκα ήθελε να επεκταθεί στην αγορά SUP χωρίς να επενδύσει σε εγκαταστάσεις παραγωγής. Χρειαζόταν έναν συνεργάτη white-label ικανό να παράγει 5 μοντέλα SUP (9 ft έως 12 ft) με ιδιωτική επωνυμία, πιστοποίηση CE και αποκλειστικά δικαιώματα διανομής στην ΕΕ.
      solution: >-
        Συμφωνία κατασκευής white-label για 5 μοντέλα SUP. Κάθε μοντέλο με την εμπορική σήμαση και χρωματικό σχέδιο του πελάτη. Εγγραφή πιστοποίησης CE για κάθε μοντέλο. Αποκλειτικά δικαιώματα κατανομής στην ΕΕ με υποχρεώσεις ελάχιστης παραγγελίας. Τεκμηριωτική τεκμηρίωση για το τοπικό δίκτυο
        εξυπηρέτησης.
      product: Προσαρμοσμένη Σειρά SUP (5 μοντέλα)
      results: Υπογράφηκε πολυετής συμφωνία. Η πρώτη παραγωγική σειρά των 50 τεμαχίων αποστάλθηκε εντός 75 ημερών. Η μάρκα λανσαρίστηκε σε μεγάλη εμπορική έκθεση με θετική ανταπόκριση των αντιπροσώπων.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Η συνεργασία με την afarer μας επέτρεψε να μπούμε στην αγορά SUP χωρίς να χτίσουμε εργοστάσιο — παρέδωσαν μια πλήρη λύση «κλειδί στο χέρι» με πιστοποίηση CE και τεκμηρίωση υποστήριξης αντιπροσώπων.
      icon: tabler:building
    - title: Στόλος Θέρετρου Καραϊβικής
      customer: Paradise Island Resorts Ltd
      country: Μπαχάμες
      industry: Θαλάσσιος Τουρισμός & Φιλοξενία
      challenge: >-
        Ένα πολυτελές θέρετρο χρειαζόταν έναν πλήρη στόλο εξοπλισμού θαλάσσιων σπορ για τις δραστηριότητες των επισκεπτών: 40 σανίδες SUP για ξεναγημένες περιηγήσεις, 20 επιπλέον σανίδες SUP για εξερεύνηση της λιμνοθάλασσας, 10 σανίδες SUP για εκδρομές επισκεπτών, καθώς και αξεσουάρ. Όλος ο
        εξοπλισμός έπρεπε να φέρει προσαρμοσμένη σήμανση του θέρετρου και να παραδοθεί πριν από την αιχμή της τουριστικής περιόδου.
      solution: >-
        Παραδώσαμε πλήρες πακέτο SUP: 40 σανίδες SUP Voyager (μοντέλο All-Around), 20 σανίδες SUP Explorer, 10 σανίδες SUP Touring, καθώς και σωσίβια (PFD), κουπιά, αντλίες και κιτ επισκευής. Όλος ο εξοπλισμός φέρει εκτύπωση με το λογότυπο του θέρετρου και τροπικό χρωματικό σχεδιασμό. Αποστολή σε
        κοντέινερ με πλήρη λίστα αποθέματος.
      product: Πλήρες Πακέτο SUP (70+ μονάδες)
      results: Ο στόλος έφτασε 6 εβδομάδες πριν την κορύφωση της σεζόν. Οι βαθμοί ικανοποίησης των επισκεπτών για δραστηριότητες υδάτινων αθλημάτων αυξήθηκαν κατά 40% χρόνο προς χρόνο. Οι εξοπλισμοί ήταν σε χρήση για 3 σεζόν με μόνη τη τακτική συντήρηση.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Η προσέγγιση του πλήρους πακέτου σήμαινε ότι λάβαμε ό,τι χρειαζόμασταν σε μία αποστολή —σανίδες και αξεσουάρ, όλα με την επωνυμία μας και έτοιμα για χρήση από τους επισκέπτες. Οι επισκέπτες μας λατρεύουν την ποιότητα του εξοπλισμού.
      icon: tabler:beach
    - title: Σύμβαση Παράκτιας Περιπολίας ΗΠΑ
      customer: Atlantic Coastal Security Agency
      country: Ηνωμένες Πολιτείες
      industry: Ναυτική Ασφάλεια & Επιβολή του Νόμου
      challenge: Υπηρεσία παράκτιας ασφάλειας των ΗΠΑ ζήτησε σανίδες SUP βαρέως τύπου για περιπολίες σε ανοιχτά ύδατα. Χρειάζονταν σανίδες υψηλών επιδόσεων με εξοπλισμό στρατιωτικών προδιαγραφών και συμμόρφωση με τους κανονισμούς της Ακτοφυλακής των ΗΠΑ.
      solution: >-
        Το Engineered SUP Patrol διαθέτει ενισχυμένη κατασκευή drop-stitch, χρωματισμούς υψηλής ορατότητας, βάσεις στερέωσης κρυπτογραφημένου εξοπλισμού επικοινωνιών και ενσωματωμένα σημεία πρόσδεσης εξοπλισμού. Οι σανίδες είναι ενισχυμένες για εργασίες βαρέως τύπου. Παρέχεται τεκμηρίωση συμμόρφωσης
        με USCG.
      product: SUP Patrol
      results: Ο πράκτορας ανέφερε ποσοστό ετοιμότητας αποστολής 95% κατά τους πρώτους 12 μήνες. Τοποθετήθηκε επιπλέον παραγγελία για 8 μονάδες.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Το SUP Patrol προσφέρει στα πληρώματά μας τις επιδόσεις που απαιτούνται για επιχειρήσεις σε ανοιχτά νερά. Η ενισχυμένη κατασκευή εξασφαλίζει την κρίσιμη ανθεκτικότητα χωρίς να επηρεάζει τον χειρισμό.
      icon: tabler:shield

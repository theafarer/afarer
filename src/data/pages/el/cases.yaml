hero:
  tagline: 'Μελέτες περιπτώσεων'
  title: 'Πραγματικά έργα, πραγματικά αποτελέσματα<br />—afarer σε δράση'
  subtitle: 'Δείτε πώς η afarer συνεργάζεται με διανομείς, μάρκες και φορείς εκμετάλλευσης παγκοσμίως για την παροχή προσαρμοσμένων θαλάσσιων λύσεων για κάθε εφαρμογή.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Μελέτες περιπτώσεων afarer —προσαρμοσμένα έργα θαλάσσιας κατασκευής'
features3_cases:
  tagline: 'Επιλεγμένες περιπτώσεις'
  title: 'Προσαρμοσμένες λύσεις<br />για πραγματικές προκλήσεις'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Στόλος Ευρωπαϊκού Κέντρου Κατάδυσης'
      description: 'Προμήθεια 12 σκαφών SUP 520 με διαμόρφωση κατάδυσης σε αλυσίδα καταδυτικών κέντρων της Μεσογείου. Προσαρμοσμένες σχάρες δεξαμενών, σκάλες κατάδυσης και επωνυμία στόλου. Παράδοση σε 60 ημέρες.'
      icon: tabler:lifebuoy
    - title: 'Πρόγραμμα OEM Αυστραλού Διανομέα'
      description: 'Ανάπτυξη σειράς σανίδων SUP ιδιωτικής ετικέτας για Αυστραλό διανομέα θαλάσσιων σπορ. 8 μοντέλα, προσαρμοσμένη συσκευασία και logistics απευθείας αποστολής. Από την ιδέα έως την πρώτη αποστολή σε 90 ημέρες.'
      icon: tabler:currency-dollar
    - title: 'Προμήθεια Σκαφών Διάσωσης Μέσης Ανατολής'
      description: 'Προμήθεια 20 περιπολικών σκαφών SUP 450 Patrol σε οργανισμό πολιτικής άμυνας της Μέσης Ανατολής. Αυτοεκκενωμένα καταστρώματα, πλήρης εξοπλισμός πλοήγησης και σωλήνες υψηλής ορατότητας σε πορτοκαλί χρώμα. Συμμόρφωση με τα τοπικά ρυθμιστικά πρότυπα.'
      icon: tabler:alert-triangle
    - title: 'Συνεργασία OEM Ευρωπαϊκής Μάρκας'
      description: 'Συνεργασία κατασκευής λευκής ετικέτας με ευρωπαϊκή θαλάσσια μάρκα. 5 μοντέλα SUP, ιδιωτική επωνυμία, αποκλειστικά δικαιώματα διανομής για την αγορά της ΕΕ. Πολυετής συμφωνία.'
      icon: tabler:building
    - title: 'Στόλος Θέρετρου Καραϊβικής'
      description: 'Πλήρες πακέτο εξοπλισμού θαλάσσιων σπορ για θέρετρο της Καραϊβικής: 40 σανίδες SUP, 20 καγιάκ, 10 φουσκωτές βάρκες και αξεσουάρ. Προσαρμοσμένη επωνυμία θέρετρου σε όλο τον εξοπλισμό.'
      icon: tabler:beach
    - title: 'Σύμβαση Παράκτιας Περιπολίας ΗΠΑ'
      description: 'Προμήθεια περιπολικών σκαφών SUP 600 σε υπηρεσία παράκτιας ασφάλειας των ΗΠΑ. Διαμόρφωση διπλού κινητήρα, επιλογές θωρακισμένης κονσόλας και ενσωμάτωση στρατιωτικών ηλεκτρονικών.'
      icon: tabler:shield
cta:
  title: 'Έχετε ένα έργο που θέλετε να συζητήσετε;'
  subtitle: 'Κάθε συνεργασία με την afarer ξεκινά με μια συζήτηση. Πείτε μας τις απαιτήσεις σας και θα αναπτύξουμε μια λύση.'
  actions:
    - variant: primary
      text: 'Ξεκινήστε το έργο σας'
      href: /contact
    - text: 'Δείτε τις δυνατότητές μας'
      href: /brand/marine-expertise

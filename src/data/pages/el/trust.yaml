features3_certifications:
  title: Πιστοποιήσεις & Συμμόρφωση
  subtitle: Κάθε προϊόν δοκιμάζεται ανεξάρτητα και πιστοποιείται σύμφωνα με διεθνή πρότυπα.
  columns: 3
  isBeforeContent: true
  items:
    - title: Πιστοποίηση CE
      description: Όλα τα SUP, καγιάκ, βοηθητικά σκάφη και SUP της afarer πληρούν το ευρωπαϊκό πρότυπο ασφαλείας CE. Κάθε προϊόν υποβάλλεται σε δοκιμή πίεσης, πλευστότητας και φορτίου πριν φύγει από το εργοστάσιο.
      icon: tabler:certificate
    - title: ''
      description: Η εγκατάστασή μας 12.000 m² στο Qingdao λειτουργεί υπό σύστημα διαχείρισης ποιότητας . Κάθε παρτίδα παραγωγής είναι ιχνηλάσιμη και ελεγμένη.
      icon: tabler:clipboard-check
    - title: Κοινωνική Συμμόρφωση BSCI
      description: Είμαστε πιστοποιημένοι BSCI, διασφαλίζοντας ηθικές εργασιακές πρακτικές και περιβαλλοντική ευθύνη.
      icon: tabler:users
    - title: REACH & RoHS
      description: Όλα τα υλικά συμμορφώνονται με τους κανονισμούς REACH και RoHS της ΕΕ. Καμία ουσία υπό περιορισμό.
      icon: tabler:flask
    - title: Εργαστήριο Δοκιμών Υλικών
      description: Εσωτερικό εργαστήριο δοκιμάζει αντοχή εφελκυσμού, UV αντοχή και ακεραιότητα ραφών για κάθε παρτίδα υφάσματος.
      icon: tabler:microscope
    - title: 2ετής Εγγύηση
      description: Κάθε προϊόν afarer συνοδεύεται από διετή εγγύηση έναντι κατασκευαστικών ελαττωμάτων.
      icon: tabler:shield-check
testimonials:
  tagline: Εμπιστοσύνη Πελατών
  title: Τι λένε οι πελάτες μας
  subtitle: Από αρχάριους κωπηλάτες έως επαγγελματίες χειριστές στόλου.
  items:
    - content: Εξοπλίσαμε ολόκληρο τον στόλο ενοικίασής μας με SUP afarer. Δύο σεζόν, μηδενικές βλάβες. Η πιστοποίηση CE διευκόλυνε την έγκριση ασφάλισης.
      name: Marco V.
      title: Τουριστικός χειριστής, Κροατία
    - content: Ως πρωτάρης αγοραστής, ανησυχούσα για την ποιότητα. Η τεκμηρίωση και οι αναφορές δοκιμών που μοιράστηκαν μου έδωσαν πλήρη εμπιστοσύνη.
      name: James T.
      title: Κάτοχος SUP Explorer 11, Καναδάς
    - content: Συνεργαζόμαστε με την afarer για παράκτιες μονάδες περιπολίας. Η διαδικασία QC είναι συνεπής σε κάθε παρτίδα.
      name: Αντιπλοίαρχος Andres
      title: Ναυτικές προμήθειες, Φιλιππίνες
steps2_manufacturing:
  title: Πώς διασφαλίζουμε την ποιότητα
  subtitle: Από την επιθεώρηση πρώτων υλών έως την τελική δοκιμή πίεσης.
  items:
    - title: Επιθεώρηση Πρώτων Υλών
      description: Κάθε ρολό PVC υφάσματος ελέγχεται για πάχος, αντοχή εφελκυσμού και UV αντοχή.
      icon: tabler:search
    - title: Ποιοτικός Έλεγχος Εν Διαδικασία
      description: Οι ραφές συγκόλλησης ελέγχονται σε κάθε σταθμό κατά τη συναρμολόγηση.
      icon: tabler:eye
    - title: Δοκιμή Πίεσης
      description: Κάθε φουσκωτό προϊόν φουσκώνεται στο 1,5x της ονομαστικής PSI και διατηρείται για 24 ώρες.
      icon: tabler:wind
    - title: Τελική Επιθεώρηση
      description: Κάθε μονάδα ελέγχεται για φινίρισμα, υλικό και συσκευασία πριν την αποστολή.
      icon: tabler:clipboard-check
factory_audit:
  title: Έλεγχος Εργοστασίου & Κοινωνική Συμμόρφωση
  subtitle: Οι εγκαταστάσεις των 12,000 m2 στο Qingdao είναι ανοιχτές σε ελέγχους τρίτων φορέων. Διατηρούμε πιστοποίηση κοινωνικής συμμόρφωσης BSCI και καλωσορίζουμε επιθεωρήσεις από πελάτες.
  stats:
    - value: 12,000 m²
      label: Μονάδα παραγωγής
    - value: 200+
      label: Εξειδικευμένοι Εργαζόμενοι
    - value: 15,000+
      label: Ετήσια Παραγωγική Δυναμικότητα
    - value: BSCI
      label: Κοινωνική Συμμόρφωση
  highlights:
    - title: BSCI Πιστοποιημένο
      desc: Πιστοποίηση κοινωνικής συμμόρφωσης amfori BSCI — ηθική εργασία, ασφαλείς συνθήκες, περιβαλλοντική υπευθυνότητα.
      link: /certifications
    - title: Ανοιχτά για Επιθεώρηση
      desc: Καλωσορίζουμε τους ελέγχους εργοστασίου από πελάτες. Προγραμματίστε μια επίσκεψη ή μια εικονική ξενάγηση στις γραμμές παραγωγής μας στο Qingdao.
      link: /factory
    - title: Πλήρης Ιχνηλασιμότητα
      desc: Κάθε παρτίδα παραγωγής τεκμηριώνεται και είναι ιχνηλάσιμη — από τους αριθμούς παρτίδας πρώτων υλών έως την τελική έγκριση του ποιοτικού ελέγχου (QC).
    - title: ISO 9001:2015
      desc: Σύστημα διαχείρισης ποιότητας πιστοποιημένο από την SGS. Οι διαδικασίες μας πληρούν τα διεθνή πρότυπα κατασκευής.
      link: /certifications
warranty_section:
  title: Εγγύηση & υποστήριξη μετά την πώληση
  subtitle: Στεκόμαστε πίσω από κάθε προϊόν με σαφείς όρους εγγύησης, ταχεία διεκπεραίωση των απαιτήσεων και γνήσια ανταλλακτικά.
  items:
    - title: Εγγύηση Προϊόντος 2 Ετών
      desc: Όλα τα προϊόντα afarer φέρουν εγγύηση 2 ετών κατά των ελαττωμάτων κατασκευής — αποτυχία νήματος, ελαττώματα βαλβίδας και διασπάσεις υλικού υπό κανονική χρήση.
    - title: Δια Βίου Υποστήριξη Ανταλλακτικών
      desc: Γνήσια ανταλλακτικά αντικατάστασης — βαλβίδες, σύνολα επισκευών, πτερύγια, D-rings — διαθέσιμα για όλα τα μοντέλα. Κρατούμε μούλια και εργαλεία παραγωγής για ελάχιστα 5 χρόνια μετά το τέλος παραγωγής.
    - title: Ανταπόκριση σε Αξιώσεις εντός 48 Ωρών
      desc: Οι αιτήσεις εγγύησης επιβεβαιώνονται εντός 48 ωρών. Οι ανταλλακτικές σανίδες αποστέλλονται εντός 10 εργάσιμων ημερών για τις εγκεκριμένες αιτήσεις.
    - title: Παγκόσμιο Δίκτυο Επισκευών
      desc: Εξουσιοδοτημένα κέντρα επισκευής σε 15+ χώρες. Διατίθενται κιτ επισκευής πεδίου για απομακρυσμένες επιχειρήσεις. Οδηγοί επισκευής DIY για μικρές ζημιές.
    - title: Υποστήριξη Πελατών OEM
      desc: Αφιερωμένοι account managers για τους συνεργάτες B2B. Τριμηνιαίες ανασκοπήσεις, προγραμματισμός αποθεμάτων και υποστήριξη μάρκετινγκ με κοινή επωνυμία.
    - title: Πακέτο πιστοποιήσεων
      desc: Πλήρης τεκμηρίωση συμμόρφωσης παρέχεται με κάθε αποστολή — Δήλωση CE, εκθέσεις δοκιμών, δελτία δεδομένων ασφαλείας υλικών.
      link: /contact
trust_resources:
  title: Πηγές Εμπιστοσύνης
  subtitle: Κατεβάστε το portfolio πιστοποίησης, αναφορές QC και τεκμηρίωση συμμόρφωσης.
  items:
    - title: Χαρτοφυλάκιο Πιστοποιήσεων
      desc: Πιστοποιητικά CE, ISO 9001, BSCI, REACH, RoHS, AS 1799 σε ένα πακέτο.
    - title: Έκθεση Προτύπων Δοκιμών Ποιοτικού Ελέγχου
      desc: Δοκιμές συγκράτησης πίεσης 24 ωρών, γήρανση UV σύμφωνα με ISO, επαλήθευση αντοχής σε εφελκυσμό — πλήρης μεθοδολογία.
    - title: Προφίλ Εργοστασίου & Έκθεση Ελέγχου
      desc: Επισκόπηση της εγκατάστασης των 12,000 m² με φωτογραφίες γραμμών παραγωγής και σύνοψη ανεξάρτητου ελέγχου τρίτου μέρους.
    - title: Έγγραφο Πολιτικής Εγγύησης
      desc: Πλήρεις όροι εγγύησης, διαδικασία αξιώσεων και τιμολόγηση ανταλλακτικών.
  cta_text: Ζητήστε Έγγραφα Αξιοπιστίας
  cta_link: /contact
faqs_sup:
  title: Συχνές Ερωτήσεις SUP
  subtitle: Συνήθεις ερωτήσεις για τις σανίδες κωπηλασίας όρθιας στάσης.
  columns: 2
  items:
    - title: Τι μεγέθη SUP σανίδων είναι διαθέσιμα;
      description: Προσφέρουμε SUP σανίδες από 9 ft έως 12 ft, συμπεριλαμβανομένων all-round, τουριστικών, γιόγκα και ειδικών σχεδίων.
    - title: Τι είναι η κατασκευή drop-stitch;
      description: Η κατασκευή drop-stitch χρησιμοποιεί χιλιάδες πολυεστερικές κλωστές που συνδέουν τα πάνω και κάτω στρώματα της σανίδας, επιτρέποντάς της να συγκρατεί υψηλή πίεση αέρα.
    - title: Ποιο είναι το όριο βάρους για SUP σανίδες;
      description: Οι SUP σανίδες μας υποστηρίζουν έως 150 kg ανάλογα με το μοντέλο και τον όγκο.
    - title: Προσφέρετε πλήρη πακέτα SUP;
      description: 'Ναι. Κάθε SUP σανίδα αποστέλλεται με πλήρες πακέτο: κουπί αλουμινίου 3 τεμαχίων, χειροκίνητη αντλία υψηλής πίεσης, σχοινί ασφαλείας, σακίδιο ταξιδιού και κιτ επισκευής.'
    - title: Ποια είναι η εγγύηση στις SUP σανίδες;
      description: Όλες οι SUP σανίδες afarer φέρουν ετήσια εγγύηση έναντι κατασκευαστικών ελαττωμάτων.
    - title: Πόσο χρόνο χρειάζεται για να φουσκώσει μια SUP σανίδα;
      description: Με τη χειροκίνητη αντλία, ένα πλήρες φούσκωμα στα 15 PSI διαρκεί περίπου 8–12 λεπτά.
faqs_materials:
  title: Συχνές Ερωτήσεις για Υλικά & Φροντίδα SUP
  subtitle: Συχνές ερωτήσεις σχετικά με τα υλικά, τη φροντίδα και την αποθήκευση των φουσκωτών SUP μας.
  columns: 2
  items:
    - title: Ποια υλικά χρησιμοποιούνται στα στεγανά SUP του afarer;
      description: Χρησιμοποιούμε PVC στρατιωτικής ποιότητας (1100 denier) με κατασκευή σταθεροποιημένη στην υπεριώδη ακτινοβολία (UV) και ανθεκτική στην τριβή, σύμφωνη με τους κανονισμούς REACH και RoHS της ΕΕ.
    - title: Πόσο κράνουν οι αερόστατες πλεύσεις SUP;
      description: Με σωστή φροντίδα, ένα ποιοτικό φουσκωτό SUP από PVC διαρκεί 5–10 χρόνια. Ο τακτικός καθαρισμός, η προστασία από την υπεριώδη ακτινοβολία (UV) και η σωστή αποθήκευση παρατείνουν σημαντικά τη διάρκεια ζωής.
    - title: Τι συντήρηση απαιτείται για ένα φουσκωτό SUP;
      description: Η βασική συντήρηση περιλαμβάνει ξέπλυμα με γλυκό νερό μετά από κάθε χρήση (ειδικά σε θαλασσινό νερό), στέγνωμα πριν από την αποθήκευση, ετήσιο έλεγχο των στεγανώσεων των βαλβίδων και αποφυγή παρατεταμένης έκθεσης στον ήλιο όταν δεν χρησιμοποιείται.
    - title: Μπορούν τα φουσκωτά SUP να χρησιμοποιηθούν σε αλμυρό νερό;
      description: Ναι. Όλα τα φουσκωτά SUP της afarer έχουν σχεδιαστεί για χρήση τόσο σε γλυκό όσο και σε θαλασσινό νερό. Συνιστούμε ξέβγαλμα με γλυκό νερό και σχολαστικό στέγνωμα μετά την έκθεση σε θαλασσινό νερό.
    - title: Πώς αποθηκεύω ένα φουσκωτό SUP;
      description: Ξεφουσκώστε, καθαρίστε και στεγνώστε εντελώς τη σανίδα πριν από την αποθήκευση. Τυλίξτε τη χαλαρά (αποφύγετε τις σφιχτές πτυχές), αποθηκεύστε τη σε δροσερό, ξηρό μέρος μακριά από το άμεσο ηλιακό φως και αποφύγετε την επαφή με τσιμεντένια δάπεδα για να αποτραπεί η απορρόφηση υγρασίας.
    - title: Ποια είναι η χωρητικότητα βάρους των φουσκωτών SUP της afarer;
      description: Το μέγιστο βάρος φόρτισης κυμαίνεται από 100 kg για τα μικρότερα μοντέλα μας έως πάνω από 200 kg για τις μεγαλύτερες σανίδες. Κάθε σελίδα προϊόντος αναφέρει το μέγιστο φορτίο για το συγκεκριμένο μοντέλο σας.

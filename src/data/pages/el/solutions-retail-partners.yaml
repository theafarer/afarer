meta:
  title: Πρόγραμμα Συναδέλφων Πωλήσεων SUP | {SITE}
  description: Become an Afarer retail partner. Full product line, professional marketing materials, dropshipping options, and competitive margins for SUP retailers.
hero:
  tagline: Πάροχοι Λιανικής Πώλησης
  title: Become An Afarer<br />Retail Partner
  subtitle: Sell the fastest-growing SUP brand in your market. Full product line, professional marketing materials, dropshipping options, and margins that make sense.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Σανίδες SUP της Afarer σε κατάστημα λιανικής
margin_section:
  title: Περιθώρια Λιανικής Πώλησης & MOQ
  subtitle: Κλιμακωτές τιμές χονδρικής σχεδιασμένες για κερδοφορία στο λιανικό εμπόριο.
  items:
    - tier: Βασικός Συνεργάτης
      discount: 20%
      moq: 500 μονάδες/έτος
      margin_note: Κέρδος ~$150–250 ανά σανίδα
      features:
        - Πρόσβαση σε ολόκληρη τη γραμμή προϊόντων
        - Πακέτο διαφημιστικού υλικού
        - Υποστήριξη μέσω email
        - Πρόσβαση στον κατάλογο προϊόντων
    - tier: Premium Συνεργάτης
      discount: 30%
      moq: 2.000+ μονάδες/έτος
      margin_note: ~$250–400 κέρδος ανά πίνακα
      features:
        - Αποκλειστικός διαχειριστής λογαριασμού
        - Προστασία αποκλειστικής περιοχής
        - Προσαρμοσμένη υποστήριξη μάρκετινγκ
        - Πρώτη πρόσβαση στα νέα προϊόντα
        - Εκπαιδευτικές συνεδρίες προσωπικού
    - tier: Κορυφαίος Συνεργάτης
      discount: 35%+
      moq: 5.000+ μονάδες/έτος
      margin_note: ~$350–500+ κέρδος ανά σανίδα
      features:
        - Καμπάνιες μάρκετινγκ με συν-επωνυμία
        - Υποστήριξη προβολής εντός καταστήματος
        - Εκπαίδευση προσωπικού επί τόπου
        - Κοινές προωθήσεις στα social media
        - Προτεραιότητα στην κατανομή παραγωγής
product_line:
  title: Πλήρης Γραμμή Προϊόντων
  subtitle: Μια σανίδα SUP για κάθε πελάτη που μπαίνει από την πόρτα σας.
  items:
    - name: All-Round Series
      description: Καλύτερο σε πωλήσεις — καλύπτει το 80% των πελατών
    - name: Touring Series
      description: Κωπηλάτες υψηλών επιδόσεων — υψηλότερο περιθώριο κέρδους
    - name: Yoga Series
      description: Εξειδικευμένη αγορά — premium τιμολόγηση
    - name: Kids Series
      description: Οικογενειακοί πελάτες — επαναλαμβανόμενος αγοραστής
    - name: Racing Series
      description: Αγορά ενθουσιωδών — αύρα επωνυμίας
    - name: Accessories
      description: Πρόσθετα προϊόντα υψηλού περιθωρίου κέρδους (κουπιά, σωσίβια, αντλίες, τσάντες)
catalog:
  title: Πόροι για Συνεργάτες Λιανικής
  subtitle: Κατεβάστε το πλήρες κιτ συνεργάτη λιανικής.
  items:
    - name: 2026 Product Catalog
      desc: Πλήρης γραμμή προϊόντων με προδιαγραφές, τιμολόγηση και πληροφορίες παραγγελιών
      icon: tabler:file-text
      link: /resources/download-catalog
    - name: Retail Partner Guide
      desc: Υπολογιστής περιθωρίου κέρδους, συμβουλές merchandising και βέλτιστες πρακτικές
      icon: tabler:book
      link: /resources/download-catalog
    - name: Marketing Asset Pack
      desc: Φωτογραφίες προϊόντος υψηλής ανάλυσης, εικόνες τρόπου ζωής και υλικά POS
      icon: tabler:photo
      link: /media
support:
  title: Υποστήριξη Λιανικών Συνεργατών
  subtitle: Ό,τι χρειάζεστε για να πουλάτε με αυτοπεποίθηση.
  items:
    - Εικόνες προϊόντων υψηλής ανάλυσης (επαγγελματική φωτογράφηση)
    - Φωτογραφίες lifestyle για τα μέσα κοινωνικής δικτύωσης, τον ιστότοπο και τον κατάλογο
    - Διαφημιστικό υλικό — αφίσες, ταμπέλες ραφιού (shelf talkers), banners
    - Εκπαιδευτικά βίντεο προϊόντων για την κατάρτιση του προσωπικού
    - Πακέτο περιεχομένου κοινωνικών δικτύων (εβδομαδιαίες αναρτήσεις)
    - Περιγραφές προϊόντων βελτιστοποιημένες για SEO
    - Διαθέσιμη επιλογή dropshipping — χωρίς κίνδυνο αποθέματος
    - Όροι πληρωμής Net 30
cta:
  title: Ready to become a partner?
  subtitle: Apply for partnership or download our retail catalog.
  actions:
    - text: Αίτηση Συνεργασίας
      href: /contact?partner=retail
      variant: primary
    - text: Κατέβασε Κατάλογο Λιανικής Πώλησης
      href: /resources/download-catalog
      variant: secondary

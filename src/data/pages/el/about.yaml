meta:
  title: 'Σχετικά με την afarer — Μάρκα Φουσκωτών SUP & Θαλάσσιων Σπορ | {SITE}'
  description: 'Η afarer είναι μια παγκόσμια μάρκα φουσκωτών SUP και θαλάσσιων σπορ, που διοικείται από την Aquafarer LLC (ΗΠΑ) και την ομάδα λειτουργίας μας στο Qingdao. Ανακαλύψτε την ιστορία μας, τη μηχανική, την πιστοποιημένη ποιότητα και τα προγράμματα συνεργατών χωρών.'
  keywords:
    - 'μάρκα φουσκωτών SUP'
    - 'μάρκα φουσκωτών σκαφών'
    - 'μάρκα θαλάσσιων σπορ'
    - 'διανομέας SUP ανά χώρα'
    - 'co-branded συλλογές SUP'
hero:
  tagline: Σχετικά με την εταιρεία
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Εργαστήριο afarer
  title: |
    Ναυτική μηχανική <br />
    σε στιλ <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Ξεκινήσαμε σε ένα παραθαλάσσιο εργαστήριο με ένα σκάφος και μια ακλόνητη πεποίθηση: τα θαλάσσια προϊόντα πρέπει να σχεδιάζονται σαν να εξαρτώνται ζωές από αυτά — γιατί έτσι είναι. Σήμερα, εξάγουμε σε 40+ χώρες, αλλά κάθε γάστρα περνά ακόμα από τα ίδια χέρια που ίδρυσαν την εταιρεία.'
stats:
  title: Με αριθμούς
  columns: 4
  stats:
    - title: Παραδοθείσες γάστρες
      amount: 2.400+
    - title: Χώρες παράδοσης
      amount: '40'
    - title: Συνολική εμπειρία (έτη)
      amount: '60'
    - title: Μέσος χρόνος απόκρισης (ώρες)
      amount: '24'
features3_what_we_build:
  title: Τι κατασκευάζουμε
  subtitle: Μια εστιασμένη σειρά προϊόντων που γνωρίζουμε άριστα — χωρίς μισές λύσεις ή badge engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: Σκάφη SUP
      description: SUP με αλουμινένια γάστρα από 3,3 m έως 7,5 m. Σχεδιασμένα για περιπολία, καταδύσεις, ψάρεμα και οικογενειακή χρήση.
      icon: tabler:ship
    - title: Φουσκωτά σκάφη
      description: Φουσκωτά σκάφη από PVC και Hypalon από 2,4 m έως 4,2 m. Ελαφριά, ανθεκτικά και εύκολα στην αποθήκευση.
      icon: tabler:speedboat
    - title: Tender superyacht
      description: Συμπαγή SUP υψηλών προδιαγραφών, κατασκευασμένα κατά παραγγελία για το σχέδιο του μητρικού σκάφους.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Αξεσουάρ
      description: Ιμάντες, αντλίες, καλύμματα, αδιάβροχες τσάντες, δοχεία καυσίμου και ηλεκτρονικά. Όλα συμβατά με τα σκάφη μας.
      icon: tabler:package
    - title: Τροποποιήσεις και επισκευές
      description: Επισκευή φουσκωτών διαμερισμάτων, αναβάθμιση ηλεκτρονικών και αντικατάσταση κινητήρων.
      icon: tabler:tool
    - title: Προϊόντα κατά παραγγελία
      description: Σχεδιασμός για εμπορικούς, επιστημονικούς και στρατιωτικούς πελάτες.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Σκάφος κατά παραγγελία
steps2_values:
  title: Οι αξίες μας
  subtitle: Τρεις αρχές που διαμορφώνουν κάθε προϊόν από την πρώτη μέρα.
  items:
    - title: Χτίζε σαν να είναι η οικογένειά σου στο σκάφος
      description: Κάθε γάστρα, κάθε συγκόλληση και κάθε εξάρτημα αντιμετωπίζονται σαν να προορίζονται για τις δικές μας οικογένειες.
      icon: tabler:heart
    - title: Μηχανική πριν από την πώληση
      description: Αν η προδιαγραφή είναι λάθος, αλλάζουμε την προδιαγραφή — ποτέ τον πελάτη.
      icon: tabler:settings
    - title: Υποστήριξη πέρα από την εγγύηση
      description: Γάστρες είκοσι ετών ακόμα τηλεφωνούν για ανταλλακτικά — και ακόμα απαντάμε.
      icon: tabler:headset
steps2_milestones:
  title: Ορόσημα
  subtitle: Η σύντομη έκδοση της ιστορίας της afarer.
  isReversed: true
  items:
    - title: Ιδρύθηκε σε παραθαλάσσιο εργαστήριο
      description: Δύο ναυπηγοί μηχανικοί με μία φρέζα CNC και μια ακλόνητη ιδέα.
      icon: tabler:building-factory
    - title: Πρώτες 1.000 παραδοθείσες γάστρες
      description: Επιτεύχθηκε τον έβδομο χρόνο, κυρίως μέσω από στόμα σε στόμα και πιστών πελατών.
      icon: tabler:circle-check
    - title: Διεθνές πρόγραμμα εξαγωγών
      description: Παραδόσεις σε 40+ χώρες με τοπικούς συνεργάτες σέρβις σε πέντε ηπείρους.
      icon: tabler:world
features2_locations:
  title: Οι τοποθεσίες μας
  tagline: Πού να μας βρείτε
  columns: 3
  items:
    - title: Έδρα και εργαστήριο
      description: Παραθαλάσσιο βιομηχανικό πάρκο, κτίριο 4 — ανοιχτά Δευτ-Παρ για επισκέψεις κατόπιν ραντεβού.
    - title: Κέντρο σέρβις ΕΕ
      description: Μεσογειακό λιμάνι — τροποποιήσεις, επισκευές και υποστήριξη εγγύησης για Ευρωπαίους πελάτες.
    - title: Δίκτυο συνεργατών APAC
      description: Εξουσιοδοτημένοι συνεργάτες σέρβις στην Αυστραλία, Ιαπωνία, Σιγκαπούρη και Χονγκ Κονγκ.
brand_hub_tagline: Μάρκα
brand_hub_title: Εξερευνήστε την Επωνυμία μας
brand_hub_subtitle: Βουτήξτε πιο βαθιά στην τεχνογνωσία μας στη μηχανική SUP, την παγκόσμια παρουσία μας και τις αρχές που μας κινητοποιούν.
brand_hub_cards:
  - title: Θαλάσσια Τεχνογνωσία
    desc: Δεκαετίες επιστήμης υλικών, κατασκευής ακριβείας και δοκιμών σε πραγματικές συνθήκες — από την επεξεργασία PVC/Hypalon έως τον σχεδιασμό κύτους τύπου deep-V και την τεχνολογία drop-stitch.
    link: /brand-marine-expertise
    link_label: Μάθετε περισσότερα →
  - title: Παγκόσμια Παρουσία
    desc: Αποστολές σε 50+ χώρες από τις εγκαταστάσεις μας στο Qingdao, με εξουσιοδοτημένους συνεργάτες εξυπηρέτησης σε Ευρώπη, Ασία-Ειρηνικό και Αμερικές.
    link: /brand-global-presence
    link_label: Μάθετε περισσότερα →
  - title: Γιατί afarer;
    desc: 'Μια μάρκα βασισμένη σε επαληθευμένη ποιότητα — διπλή πιστοποίηση (ISO 9001 + BSCI), συμμόρφωση CE και αποκλειστικές συνεργασίες ανά χώρα με περιορισμένες co-branded συλλογές για επιχειρήσεις θαλάσσιων σπορ.'
    link: /brand-why-afarer
    link_label: Μάθετε περισσότερα →

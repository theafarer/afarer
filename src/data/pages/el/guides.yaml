hero:
  tagline: Οδηγοί
  title: Νέοι στο SUP;
  subtitle: Πρακτικοί οδηγοί που σας βοηθούν να διαλέξετε, να χρησιμοποιήσετε και να απολαύσετε αερόστατες πλεύσεις SUP.
size_guide:
  tagline: Μέγεθος & Προδιαγραφές
  title: Βρείτε το Σωστό Μέγεθος για τις Ανάγκες Σας
  desc: Συγκρίνετε διαστάσεις σανίδων SUP, ικανότητες φορτίου και συνιστώμενες χρήσεις. Είτε χρειάζεστε SUP για touring, σανίδα γιόγκα ή SUP γενικής χρήσης — ο οδηγός μεγεθών μας σάς βοηθά να βρείτε τη σωστή επιλογή.
  link_label: Πλήρης οδηγός μεγεθών με προδιαγραφές προϊόντος →
  link: /size-guide
  cards:
    - title: Σανίδες SUP
      desc: Επιλέξτε το μήκος με βάση το βάρος σας και τη χρήση για την οποία προορίζεται. Οι πιο φαρδιές σανίδες (32"+) προσφέρουν μεγαλύτερη σταθερότητα. Οι μακρύτερες σανίδες (11–12 ft) διατηρούν καλύτερα την πορεία τους στο touring.
    - title: Σανίδες SUP Touring
      desc: Μεγαλύτερες σανίδες (11–12 ft) για κάλυψη αποστάσεων και σταθερή πορεία. Αρκετά σταθερές για touring με εξοπλισμό. Ελέγχετε πάντα τη χωρητικότητα βάρους.
    - title: SUP All-Around
      desc: Επιλέξτε μήκος ανάλογα με το βάρος του αναβάτη και τη χρήση. Πλατιά πίνακες (32") για σταθερότητα. Πολύχρηστοι για αναψυχή και συντονισμό.

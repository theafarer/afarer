tests:
  - title: Δοκιμή πίεσης
    description: >-
      Οι αεροθάλαμοι υποβάλλονται σε πίεση που υπερβαίνει τα συνιστώμενα όρια λειτουργίας για παρατεταμένο χρονικό διάστημα. Αυτό επαληθεύει τη στεγανότητα και τη δομική ακεραιότητα του υλικού και των ραφών, διασφαλίζοντας ότι το προϊόν αντέχει την προβλεπόμενη χρήση και πιθανό υπερφούσκωμα χωρίς
      βλάβη ή διαρροές.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: Δοκιμή κρούσης
    description: Τα προϊόντα υποβάλλονται σε ελεγχόμενες κρούσεις διαφορετικών βαρών και υπό διάφορες γωνίες. Αξιολόγηση της αντοχής του υλικού σε τρυπήματα, σχισίματα και ζημιές από συγκρούσεις με εμπόδια στο νερό, αποδεικνύοντας ανθεκτικότητα και μακροζωία.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: Δοκιμή αντοχής σε UV
    description: >-
      Οι αεροθάλαμοι υποβάλλονται σε πίεση που υπερβαίνει τα συνιστώμενα όρια λειτουργίας για παρατεταμένο χρονικό διάστημα. Αυτό επαληθεύει τη στεγανότητα και τη δομική ακεραιότητα του υλικού και των ραφών, διασφαλίζοντας ότι το προϊόν αντέχει την προβλεπόμενη χρήση και πιθανό υπερφούσκωμα χωρίς
      βλάβη ή διαρροές.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: Δοκιμή αντοχής σε τριβή
    description: Δείγματα υλικού τρίβονται σε λειαντικές επιφάνειες για συγκεκριμένο αριθμό κύκλων υπό ελεγχόμενη πίεση. Μετρά την ικανότητα του υλικού να αντέχει στη φθορά από επαναλαμβανόμενη χρήση, επαφή με άμμο, βράχους ή άλλες επιφάνειες, διασφαλίζοντας μακροπρόθεσμη ανθεκτικότητα.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: Δοκιμή απόδοσης σε χαμηλές θερμοκρασίες
    description: Τα προϊόντα δοκιμάζονται σε ψυχρά περιβάλλοντα για να αξιολογηθεί η λειτουργικότητα και ανθεκτικότητά τους σε διάφορες θερμοκρασιακές συνθήκες, αποτρέποντας ακαμψία ή ρωγμές σε ψυχρότερα νερά. Απαραίτητο για σκάφη που προορίζονται για χειμερινή χρήση ή μεγάλα γεωγραφικά πλάτη.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: Δοκιμή άνωσης και ικανότητας φόρτωσης
    description: Τα προϊόντα δοκιμάζονται με διάφορα φορτία για να προσδιοριστεί η μέγιστη χωρητικότητα φόρτωσης και να διασφαλιστεί η ασφαλής υποστήριξη χρηστών και εξοπλισμού. Κάθε μοντέλο έχει επαληθευμένη χωρητικότητα φόρτωσης πριν από τη διάθεση στην αγορά.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: Δοκιμή ευελιξίας
    description: Τα προϊόντα δοκιμάζονται ως προς την απόκριση στην κωπηλασία ή τον έλεγχο κινητήρα, αξιολογώντας την ακτίνα στροφής και την ευκολία χειρισμού. Οι δοκιμές στο νερό επιβεβαιώνουν ότι η πραγματική συμπεριφορά αντιστοιχεί στις προδιαγραφές σχεδιασμού.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: Δοκιμή στεγανότητας
    description: Τα πλήρως συναρμολογημένα προϊόντα βυθίζονται ή εκτίθενται σε νερό για να ελεγχθούν τυχόν διαρροές από ραφές, βαλβίδες ή υλικά. Κάθε σκάφος υποβάλλεται σε υποχρεωτικό έλεγχο στεγανότητας πριν από την αποστολή.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp

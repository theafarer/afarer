    - [Διανομέας Χώρας / Περιοχής, 100–300, 30–45 ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Εξατομικευμένο και Private Label (στάνταρ), 50+, 30–45 ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Βαθιά Εξατομίκευση (νέα καλούπια, συσκευασία), 200+, 45–60 ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Δικαιώματα Πλήρους Σειράς Προϊόντων, 300–1, 000, 60–90 ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
faqs:
  title: 'Πρόγραμμα Διανομέων — Συχνές Ερωτήσεις'
  subtitle: 'Όλα όσα ρωτούν οι διανομείς πριν υποβάλουν αίτηση.'
  items:
    - title: 'Τι σημαίνει μία χώρα, ένας διανομέας;'
      description: 'Η Afarer παραχωρεί σε έναν μόνο εξουσιοδοτημένο διανομέα αποκλειστικά δικαιώματα για μια χώρα ή περιοχή. Εσείς κατέχετε την αγορά σας — χωρίς παράλληλες εισαγωγές, χωρίς εσωτερικό ανταγωνισμό.'
    - title: 'Ποια είναι η ελάχιστη πρώτη παραγγελία;'
      description: 'Οι διανομείς χώρας και περιοχής ξεκινούν από 100–300 τεμάχια. Οι εξουσιοδοτημένοι αντιπρόσωποι από 30–50 τεμάχια. Οι δοκιμαστικές παραγγελίες των 10–30 τεμαχίων σάς επιτρέπουν να δοκιμάσετε πρώτα την αγορά (χωρίς προστασία περιοχής).'
    - title: 'Ποια υποστήριξη λαμβάνουν οι διανομείς;'
      description: 'Το Πρόγραμμα Επιτυχίας Διανομέα καλύπτει την ενσωμάτωση, τον σχεδιασμό κυκλοφορίας στην αγορά, την εκπαίδευση προϊόντος και πωλήσεων, την υποστήριξη στόλου επίδειξης, τοπικοποιημένο υλικό μάρκετινγκ και αφιερωμένο διαχειριστή λογαριασμού.'
    - title: 'Πώς με προστατεύει η Afarer από συγκρούσεις καναλιών;'
      description: 'Κάθε περιοχή έχει ακριβώς έναν εξουσιοδοτημένο διανομέα. Οι άμεσες παραγγελίες από την περιοχή σας περνούν από εσάς και οι τιμές προστατεύουν το περιθώριό σας.'
    - title: 'Ποιες είναι οι όροι αποστολής και πληρωμής;'
      description: 'Οι παραγγελίες αποστέλλονται FOB Qingdao με πλήρη τεκμηρίωση εξαγωγής. Οι παραγγελίες παραγωγής με 30% προκαταβολή και 70% πριν την αποστολή· οι δοκιμαστικές και δειγματικές με προπληρωμή.'
    - title: 'Πώς υποβάλω αίτηση;'
      description: 'Στείλτε την αίτησή σας μέσω της φόρμας επικοινωνίας. Αξιολογούμε την καταλληλότητα, την παρουσία στο λιανικό εμπόριο και τη δυνατότητα logistics και απαντάμε εντός 3 εργάσιμων ημερών με τα επόμενα βήματα και δείγμα συμφωνίας διανομέα.'
cta:

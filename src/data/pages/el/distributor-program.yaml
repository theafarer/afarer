features:
  title: 'Γιατί Συνεργασία με την Afarer'
  subtitle: 'Σχεδιασμένο για συνεργάτες διανομής που θέλουν να αναπτύξουν επιχείρηση θαλάσσιων σπορ με μια σοβαρή μάρκα από πίσω.'
  columns: 3
  items:
    - title: 'Αποκλειστικότητα Περιοχής'
      description: 'Μια προστατευμένη αγορά χώρας ή περιοχής. Ένας διανομέας, χωρίς εσωτερικό ανταγωνισμό, χωρίς συγκρούσεις καναλιών — η επένδυσή σας χτίζει το δικό σας οχυρό.'
      icon: 'tabler:shield-check'
    - title: 'Άμεσα Περιθώρια Εργοστασίου'
      description: 'Τιμοκατάλογος διανομέα με εκπτώσεις για δεσμευμένους όγκους. Καμία ενδιάμεση. Αποστολή FOB Qingdao με πλήρη τεκμηρίωση εξαγωγής.'
      icon: 'tabler:coins'
    - title: 'Πρόγραμμα Επιτυχίας Διανομέα'
      description: 'Δομημένη ενσωμάτωση, σχεδιασμός κυκλοφορίας στην αγορά, εκπαίδευση προϊόντος και πωλήσεων, υποστήριξη στόλου επίδειξης και εργαλεία co-marketing.'
      icon: 'tabler:rocket'
    - title: 'Υποστήριξη Μάρκετινγκ και Μάρκας'
      description: 'Τοπικοποιημένα υλικά καμπάνιας, υλικά σημείου πώλησης, κιτ εκδηλώσεων και πολύγλωσσο ψηφιακό περιεχόμενο.'
      icon: 'tabler:mood-smile'
    - title: 'Αξιόπιστη Εφοδιαστική Αλυσίδα'
      description: 'Πιστοποιημένη παραγωγή ISO και CE με σταθερό ποιοτικό έλεγχο, προβλέψιμα MOQ και χρόνους παράδοσης που μπορείτε να προγραμματίσετε.'
      icon: 'tabler:building-factory'
    - title: 'Αφιερωμένος Διαχειριστής Λογαριασμού'
      description: 'Ένας προσωπικός διαχειριστής διανομής για προβλέψεις, προγραμματισμό παραγγελιών και υποστήριξη μετά την πώληση.'
      icon: 'tabler:user-check'
table:

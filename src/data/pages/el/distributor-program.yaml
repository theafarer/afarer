features:
  title: 'Γιατί Συνεργασία με την Afarer'
  subtitle: 'Ένα μοντέλο μία χώρα — ένας διανομέας με υποδομή υποστήριξης που κάνει την περιοχή να αποδίδει. Η αποκλειστικότητα κερδίζεται και διατηρείται — δεν είναι μόνιμο δικαίωμα.'
  columns: 3
  items:
    - title: 'Αποκλειστικότητα Περιοχής'
      description: 'Ένας εξουσιοδοτημένος διανομέας ανά χώρα ή περιοχή. Καμία παράλληλη εισαγωγή, κανένας εσωτερικός ανταγωνισμός. Η επένδυσή σας χτίζει το δικό σας οχυρό.'
      icon: 'tabler:shield-check'
    - title: 'Προστασία από Συγκρούσεις Καναλιών'
      description: 'Οι άμεσες παραγγελίες από την περιοχή σας δρομολογούνται μέσω εσάς και οι τιμές προστατεύουν το περιθώριό σας. Η Afarer δεν πουλά πέρα από τους συνεργάτες χώρας της.'
      icon: 'tabler:users'
    - title: 'Περιθώρια Απευθείας από το Εργοστάσιο & Εκπτώσεις'
      description: 'Τιμοκατάλογος αντιπροσώπου με εκπτώσεις για δεσμευμένους όγκους. Καμία ενδιάμεση. Αποστολή FOB Qingdao με πλήρη τεκμηρίωση εξαγωγής.'
      icon: 'tabler:coins'
    - title: 'Πρόγραμμα Υποστήριξης Συνεργάτη με 10 Ενότητες'
      description: 'Ενσωμάτωση, προσέγγιση αγοράς, εκπαίδευση, μάρκετινγκ και κοινή χρηματοδότηση της αγοράς, ανταλλακτικά και εξυπηρέτηση μετά την πώληση, εγγύηση, εργαλεία παραγγελιών και πύλη συνεργατών — καλυμμένα στη Συμφωνία Διανομής σας.'
      icon: 'tabler:rocket'
    - title: 'Μάρκετινγκ & Κοινά Ταμεία Αγοράς'
      description: 'Τοπικοποιημένα υλικά καμπάνιας, υλικά σημείου πώλησης για αντιπροσώπους, κιτ εκδηλώσεων, ψηφιακό περιεχόμενο σε πολλές γλώσσες και υποστήριξη συν-μάρκετινγκ για τις εποχές λανσαρίσματος.'
      icon: 'tabler:mood-smile'
    - title: 'Εκπαίδευση Προϊόντος, Πωλήσεων & Τεχνική'
      description: 'Δομημένες συνεδρίες ενσωμάτωσης για το προϊόν, τις πωλήσεις και τις τεχνικές γνώσεις, με ενημερωμένο υλικό καθώς εξελίσσεται η γκάμα.'
      icon: 'tabler:presentation'
    - title: 'Ανταλλακτικά & Υποστήριξη Μετά την Πώληση'
      description: 'Προμήθεια ανταλλακτικών, καταγραφή εγγυήσεων και διαχείριση απαιτήσεων, καθώς και φύλλα τεχνικών προδιαγραφών και εγχειρίδια για την τοπική ομάδα εξυπηρέτησής σας.'
      icon: 'tabler:settings'
    - title: 'Αφιερωμένος Διαχειριστής Λογαριασμού & Πύλη Συνεργατών'
      description: 'Ένας προσωπικός διαχειριστής διανομέα συν πρόσβαση σε τιμοκαταλόγους, κατάσταση παραγγελιών και πόρους μάρκετινγκ μέσω της πύλης συνεργατών της Afarer.'
      icon: 'tabler:user-check'
table:
  title: 'Επίπεδα Συνεργασίας, MOQ & Όροι Παραγγελίας'
  subtitle: 'Επιλέξτε το επίπεδο που ταιριάζει στο δυναμικό της αγοράς σας. Όλες οι τιμές σε USD, FOB Qingdao.'
  caption: 'Οι δειγματικές και δοκιμαστικές παραγγελίες (5–30 τεμάχια) δεν έχουν προστασία περιοχής. Η αποκλειστικότητα χώρας ισχύει μόνο για υπογεγραμμένες συμφωνίες Country / Regional Distributor — διατηρείται με την ολοκλήρωση της πρώτης παραγγελίας, ετήσιους στόχους αγορών, τοπικό απόθεμα, ικανότητα εξυπηρέτησης μετά την πώληση και συνεχή επένδυση στην αγορά, και δεν αποτελεί μόνιμο ή αέναο δικαίωμα.'
  head:
    - Επίπεδο Προγράμματος
    - Ελάχιστη Παραγγελία (τεμάχια)
    - Χρόνος Παράδοσης
    - Πληρωμή
  rows:
    - [Sample / Product Evaluation, 5–10, 15–20 εργάσιμες ημέρες, 100% prepaid]
    - [Trial Order, 10–30, 30–45 εργάσιμες ημέρες, 100% prepaid]
    - [Authorized Dealer, 30–50, 30–45 εργάσιμες ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Country / Regional Distributor, 100–300, 30–45 εργάσιμες ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Custom & Private Label (standard), 50+, 30–45 εργάσιμες ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Deep Custom (new molds, packaging), 200+, 45–60 εργάσιμες ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Full Product Line Rights, '300–1,000', 60–90 εργάσιμες ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
faqs:
  title: 'Συνεργασία Χώρας — Συχνές Ερωτήσεις'
  subtitle: 'Οι ερωτήσεις που κάνουν οι σοβαροί συνεργάτες χώρας πριν υποβάλουν αίτηση.'
  items:
    - title: 'Τι σημαίνει στην πραγματικότητα «μία χώρα — ένας διανομέας»;'
      description: 'Η Afarer ορίζει έναν μόνο εξουσιοδοτημένο διανομέα με αποκλειστικά δικαιώματα για μια συγκεκριμένη περιοχή. Δεν πουλάμε μέσω των παγκόσμιων ή περιφερειακών καναλιών μας σε μια προστατευμένη χώρα. Η κυριότητά σας στην περιοχή διαρκεί όσο πληρούνται οι όροι της Συμφωνίας Διανομής.'
    - title: 'Είναι η περιοχή αποκλειστική για πάντα;'
      description: 'Όχι. Η αποκλειστικότητα είναι υπό όρους, όχι αέναη. Διατηρείται μέσω υπογεγραμμένης Συμφωνίας Διανομής, ολοκλήρωσης της πρώτης παραγγελίας, ετήσιων στόχων αγορών, τοπικού αποθέματος, ικανότητας εξυπηρέτησης μετά την πώληση και συνεχούς επένδυσης στην αγορά. Αν δεν πληρούνται, η περιοχή μπορεί να επαναδιαπραγματευτεί ή να ανατεθεί εκ νέου.'
    - title: 'Ποια είναι η ελάχιστη πρώτη παραγγελία;'
      description: 'Οι διανομείς χώρας και περιφέρειας ξεκινούν από 100–300 τεμάχια· οι εξουσιοδοτημένοι αντιπρόσωποι από 30–50 τεμάχια· οι δοκιμαστικές παραγγελίες από 10–30 τεμάχια σάς επιτρέπουν να δοκιμάσετε πρώτα την αγορά (οι δοκιμαστικές και δειγματικές παραγγελίες δεν έχουν προστασία περιοχής). Τα προγράμματα εξατομίκευσης και private label ακολουθούν ξεχωριστά MOQ που αναφέρονται στα παραπάνω επίπεδα.'
    - title: 'Ποια υποστήριξη περιλαμβάνει το πρόγραμμα των 10 ενοτήτων;'
      description: 'Επίπεδα και προϋποθέσεις, προστασία περιοχής, MOQ / τιμολόγηση / ετήσιες εκπτώσεις, διαχείριση αποθέματος και εκτέλεση παραγγελιών, υλικό μάρκετινγκ και κοινά ταμεία αγοράς, εκπαίδευση προϊόντος / πωλήσεων / τεχνική, ανταλλακτικά και εξυπηρέτηση μετά την πώληση, καταγραφή εγγυήσεων, πύλη συνεργατών, καθώς και φύλλα τεχνικών προδιαγραφών, βιβλιοθήκη υλικού μάρκετινγκ, πρόγραμμα ετήσιων εκπτώσεων και λίστες αποστολής και συσκευασίας.'
    - title: 'Πώς με προστατεύει η Afarer από συγκρούσεις καναλιών;'
      description: 'Κάθε περιοχή έχει ακριβώς έναν εξουσιοδοτημένο διανομέα. Τα αιτήματα και οι άμεσες παραγγελίες από την περιοχή σας δρομολογούνται μέσω εσάς, οι φόρμες του ιστότοπου προωθούνται στον τοπικό συνεργάτη όπου υπάρχει, και η παγκόσμια ομάδα επεμβαίνει μόνο όταν ένας συνεργάτης δεν ανταποκρίνεται.'
    - title: 'Ποιοι είναι οι όροι αποστολής και πληρωμής;'
      description: 'Οι παραγγελίες αποστέλλονται FOB Qingdao με πλήρη τεκμηρίωση εξαγωγής. Οι παραγγελίες παραγωγής είναι με 30% προκαταβολή και 70% πριν την αποστολή· οι δοκιμαστικές και δειγματικές παραγγελίες είναι προπληρωμένες. Ο τυπικός χρόνος παράδοσης είναι 30–45 εργάσιμες ημέρες, με 15–20 εργάσιμες ημέρες για δειγματικές παραγωγές.'
    - title: 'Πώς υποβάλλω αίτηση;'
      description: 'Στείλτε την αίτησή σας μέσω της φόρμας επικοινωνίας με στοιχεία της αγοράς. Αξιολογούμε την καταλληλότητα της αγοράς, την παρουσία στο λιανικό εμπόριο και τη δυνατότητα logistics, και στη συνέχεια απαντάμε εντός 3 εργάσιμων ημερών με τα επόμενα βήματα και ένα δείγμα Συμφωνίας Διανομής.'

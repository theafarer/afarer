  sentence: 'Η Afarer συνεργάζεται με καταξιωμένους διανομείς της ναυτιλιακής, υπαίθριας και αθλητικής βιομηχανίας που εξυπηρετούν αλυσίδες λιανικής, στόλους ενοικίασης, σχολές θαλάσσιων σπορ, θέρετρα και κρατικούς αγοραστές με premium φουσκωτές σανίδες SUP και σκάφη.'
  audiences:

meta:
  title: 'Συνεργάτες Χώρας — Μία Χώρα, Ένας Επίσημος Διανομέας Afarer | {SITE}'
  description: 'Υποβάλετε αίτηση για να γίνετε ο επίσημος διανομέας Afarer για τη χώρα σας. Ένας εξουσιοδοτημένος συνεργάτης ανά αγορά, προστασία περιοχής, περιθώρια απευθείας από το εργοστάσιο, ετήσιες εκπτώσεις και ένα πρόγραμμα υποστήριξης συνεργάτη χώρας με 10 ενότητες για παγκόσμιους διανομείς SUP και θαλάσσιων σπορ.'
  keywords:
    - 'πρόγραμμα συνεργασίας χώρας'
    - 'γίνετε διανομέας'
    - 'διανομή SUP'
    - 'μία χώρα ένας διανομέας'
    - 'διανομέας paddle board'
    - 'διανομή θαλάσσιων σπορ'
    - 'αίτηση συνεργασίας χώρας'

hero:
  tagline: Η Ομάδα Μας
  title: Οι Άνθρωποι Πίσω από την afarer<br />—Μηχανική της Ελευθερίας στο Νερό
  subtitle: Ιδρύθηκε το 2012 στο Qingdao της Κίνας, η afarer χτίστηκε από θαλάσσιους μηχανικούς, επιστήμονες υλικών και λάτρεις των θαλάσσιων σπορ που πίστευαν στη δημιουργία επαγγελματικών φουσκωτών σκαφών προσιτών παγκοσμίως.
  image:
    src: /images/team-all.webp
    alt: Ομαδική φωτογραφία ολόκληρης της ομάδας afarer —μηχανική, παραγωγή και διοίκηση
founding:
  tagline: Η Ίδρυσή μας
  title: Από ένα Παράκτιο Εργαστήριο<br />σε μια Εγκατάσταση 12.000 m²
  subtitle: Η afarer ιδρύθηκε από μια ομάδα θαλάσσιων μηχανικών με δεκαετίες συνδυασμένης εμπειρίας στον σχεδιασμό φουσκωτών σκαφών, την κατασκευή PVC/Hypalon και την παγκόσμια κατασκευή θαλάσσιου εξοπλισμού.
  items:
    - title: 'Ίδρυση: 2012'
      description: Ιδρύθηκε στο Qingdao της Κίνας —ένα σημαντικό θαλάσσιο κέντρο με βαθιά ναυπηγική κληρονομιά.
      icon: tabler:calendar
    - title: 200+ Εργαζόμενοι
      description: Συμπεριλαμβανομένων 50+ μηχανικών Ε&Α, ειδικών ποιοτικού ελέγχου και τεχνικών παραγωγής.
      icon: tabler:users
    - title: Εγκατάσταση 12.000 m²
      description: Αποκλειστικό εργοστάσιο κατασκευής με 6 γραμμές παραγωγής για SUP, φουσκωτά σκάφη και σανίδες SUP.
      icon: tabler:building-factory
    - title: Εξυπηρέτηση 50+ Χωρών
      description: Εξαγωγές σε Ευρώπη, Αμερική, Μέση Ανατολή, Ασία-Ειρηνικό και Αφρική.
      icon: tabler:globe
leadership:
  tagline: Ηγεσία
  title: Διοίκηση & Ηγεσία Μηχανικής
  subtitle: Η ηγετική ομάδα μας συνδυάζει βαθιά τεχνογνωσία στη θαλάσσια μηχανική, το διεθνές εμπόριο και τη διαχείριση ποιότητας.
  columns: 3
  items:
    - title: Ιδρυτής & Διευθύνων Σύμβουλος
      name: Toby Liu
      description: Πάνω από 15 χρόνια στην παραγωγή ναυτικών σκευών. Πρόεδρος Έρευνας και Ανάπτυξης σε μεγάλο κατασκευαστή πλοίων της Κίνας. Κάτοχος πολλών διπλημάτων ευρείας στη σχεδίαση αερόστατων πλοίων.
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: Επικεφαλής Μηχανικός
      name: Zhang Wei
      description: Πάνω από 20 χρόνια στην κατασκευή PVC/Hypalon και στη σχεδίαση γάστρας τύπου deep-V. Πρώην τεχνικός διευθυντής σε ευρωπαϊκή εταιρεία ναυπηγικής μηχανικής.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Επικεφαλής Έρευνας & Ανάπτυξης
      name: Chen Ming
      description: Διδακτορικό στην Επιστήμη Υλικών. Ειδικεύεται στην τεχνολογία drop-stitch και σε διαδικασίες συγκόλλησης υψηλής συχνότητας. 10+ χρόνια σε υφαντικά σύνθετα υλικά.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Διευθυντής Παραγωγής
      name: Liu Qiang
      description: 18+ χρόνια στη λιτή παραγωγή (lean manufacturing) και στη βελτιστοποίηση γραμμών παραγωγής. Six Sigma Black Belt. Εφαρμογή συστημάτων ποιότητας ISO 9001.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Διευθυντής Ποιότητας
      name: Wang Fang
      description: 12+ χρόνια στον ποιοτικό έλεγχο θαλάσσιου εξοπλισμού. Πιστοποιημένος ελεγκτής CE και ISO. Επιβλέπει τις δοκιμές κάθε παρτίδας παραγωγής.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Διευθυντής Πωλήσεων & Λειτουργιών
      name: Helen Lee
      description: 15+ χρόνια στο διεθνές εμπόριο B2B. Διαχείριση συνεργασιών OEM/ODM σε 30+ χώρες. Άριστη γνώση 4 γλωσσών.
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Φιλοσοφία Σχεδιασμού
  title: Σχεδιασμός με Γνώμονα τη Μηχανική<br />—Κάθε Λεπτομέρεια Μετράει
  subtitle: Η μηχανική φιλοσοφία μας επικεντρώνεται σε τρεις αρχές που καθοδηγούν κάθε προϊόν που κατασκευάζουμε.
  list:
    - 'Αξιοπιστία Πρώτα: Κάθε προϊόν afarer δοκιμάζεται για να αντέχει σε πραγματικές συνθήκες —από επιχειρήσεις διάσωσης σε ψυχρά ύδατα έως ενοικιάσεις τροπικών θέρετρων. Κάνουμε υπερ-μηχανική εκεί που έχει μεγαλύτερη σημασία.'
    - 'Ακρίβεια Κατασκευής: Οι εγκαταστάσεις μας χρησιμοποιούν κοπή CNC, συγκόλληση υψηλής συχνότητας και αυτοματοποιημένη δοκιμή πίεσης. Κάθε ραφή, κάθε βαλβίδα, κάθε εξάρτημα πληροί τεκμηριωμένες προδιαγραφές.'
    - 'Συνεχής Καινοτομία: Η ομάδα Ε&Α μας αξιολογεί συνεχώς νέα υλικά, μεθόδους παραγωγής και βελτιώσεις σχεδιασμού. Δεν περιμένουμε προβλήματα —τα προβλέπουμε.'

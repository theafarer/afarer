hero:
  tagline: Our Team
  title: 'Οι Άνθρωποι Πίσω από την afarer<br />—Μηχανική της Ελευθερίας στο Νερό'
  subtitle: 'Ιδρύθηκε το 2012 στο Qingdao της Κίνας, η afarer χτίστηκε από θαλάσσιους μηχανικούς, επιστήμονες υλικών και λάτρεις των θαλάσσιων σπορ που πίστευαν στη δημιουργία επαγγελματικών φουσκωτών σκαφών προσιτών παγκοσμίως.'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'Από ένα Παράκτιο Εργαστήριο<br />σε μια Εγκατάσταση 12.000 m²'
  subtitle: 'Η afarer ιδρύθηκε από μια ομάδα θαλάσσιων μηχανικών με δεκαετίες συνδυασμένης εμπειρίας στον σχεδιασμό φουσκωτών σκαφών, την κατασκευή PVC/Hypalon και την παγκόσμια κατασκευή θαλάσσιου εξοπλισμού.'
  items:
    - title: 'Founded: 2012'
      description: 'Ιδρύθηκε στο Qingdao της Κίνας —ένα σημαντικό θαλάσσιο κέντρο με βαθιά ναυπηγική κληρονομιά.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'Συμπεριλαμβανομένων 50+ μηχανικών Ε&Α, ειδικών ποιοτικού ελέγχου και τεχνικών παραγωγής.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Αποκλειστικό εργοστάσιο κατασκευής με 6 γραμμές παραγωγής για SUP, φουσκωτά σκάφη και σανίδες SUP.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Εξαγωγές σε Ευρώπη, Αμερική, Μέση Ανατολή, Ασία-Ειρηνικό και Αφρική.'
      icon: tabler:globe

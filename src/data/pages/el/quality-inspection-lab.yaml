intro: >-
  Κάθε πλοίο που εξέρχεται από το εργαστήριό μας φέρει την πιστοποίηση ότι πέρασε έναν καθορισμένο σύνολο ελέγχων ποιότητας και δοκιμών υλικών. Το Εργαστήριο Ποιότητας & Ελέγχου μας είναι μια ανεξάρτητη λειτουργία εντός της οργάνωσης — αναφέρεται απευθείας στον διαχειριστή, όχι στην παραγωγή —
  διασφαλίζοντας ότι καμία εμπορική πίεση δεν μπορεί να διακόψει τον έλεγχο ποιότητας. Εάν ένα σύμπακτο υλικού ή ένα ολοκληρωμένο πλοίο δεν απαντά στην δημοσιευμένη προδιαγραφή, το εργαστήριο έχει την εξουσία να σταματήσει την αποστολή μέχρι να επιλυθεί η μη συμμόρφωση.
content_html: >
  <h2>Εμπιστοσύνη, αλλά με επαλήθευση</h2>

  <p>Το εργαστήριο λειτουργεί υπό ένα σύστημα διαχείρισης ποιότητας ευθυγραμμισμένο με τις αρχές, και οι μέθοδοι δοκιμών μας βασίζονται σε πρότυπα ISO, ASTM και EN όπου αυτά εφαρμόζονται. Τηρούμε λεπτομερή αρχεία για κάθε δοκιμή που εκτελείται, δημιουργώντας μια πλήρη αλυσίδα ιχνηλασιμότητας από την
  παραλαβή της πρώτης ύλης έως την τελική παράδοση του σκάφους.</p>


  <h2>Εξοπλισμός δοκιμών και δυνατότητες</h2>

  <table>
    <thead><tr><th>Εξοπλισμός</th><th>Δοκιμές που εκτελούνται</th><th>Πρότυπο / Μέθοδος</th></tr></thead>
    <tbody>
      <tr><td>Παγκόσμια μηχανή δοκιμών (50 kN)</td><td>Αντοχή σε εφελκυσμό (ύφασμα), αντοχή σε αποκόλληση (ραφές), διάδοση σχισίματος</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Συσκευή δοκιμής συγκράτησης αέρα (προγραμματιζόμενη)</td><td>Δοκιμή αντοχής 1000 κύκλων φουσκώματος/ξεφουσκώματος, δοκιμή συγκράτησης πίεσης 30 λεπτών</td><td>ISO 6185 (εσωτερική)</td></tr>
      <tr><td>Συσκευή αποκόλλησης ραφών (μηχανοκίνητη, αποκόλληση 180°)</td><td>Αντοχή αποκόλλησης συγκολλημένων και κολλημένων ραφών στα 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Συσκευή δοκιμής υδροστατικής στήλης</td><td>Αντοχή υφάσματος στη διείσδυση νερού (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Ψηφιακό παχύμετρο &amp; μικρόμετρο</td><td>Πάχος υφάσματος, πάχος τοιχώματος σωλήνα, πάχος μεμβράνης κόλλας</td><td>ISO 2286-3</td></tr>
      <tr><td>Θάλαμος περιβαλλοντικών δοκιμών</td><td>Προετοιμασία θερμοκρασίας (-40 °C έως +80 °C) για δοκιμές ψυχρής ρωγμάτωσης και θερμικής γήρανσης</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Φασματοφωτόμετρο χρώματος</td><td>Μέτρηση χρώματος Delta-E μετά από έκθεση σε UV</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>Τα σημεία ελέγχου — από το υλικό έως την παράδοση</h2>

  <p>Κάθε σκάφος ακολουθεί ένα καθορισμένο πλάνο ποιότητας με υποχρεωτικά σημεία επιθεώρησης. Κανένα σκάφος δεν μπορεί να παρακάμψει ένα σημείο ελέγχου· κάθε σημείο πρέπει να εγκρίνεται από επιθεωρητή ποιότητας πριν ξεκινήσει το επόμενο στάδιο παραγωγής.</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Σημείο ελέγχου 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Επιθεώρηση εισερχόμενων υλικών</p>
            <p class="text-xs text-gray-500 mt-1">Παρτίδα υφάσματος, παρτίδα κόλλας, υλικό — όλα ελέγχονται σύμφωνα με την προδιαγραφή παραλαβής πριν από την αποδέσμευση στην παραγωγή.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Σημείο ελέγχου 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Έλεγχος συγκολλήσεων κατά την παραγωγή</p>
            <p class="text-xs text-gray-500 mt-1">Δοκιμή του πρώτου δείγματος συγκόλλησης (αποκόλληση + οπτικός έλεγχος) στην αρχή κάθε βάρδιας παραγωγής.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Σημείο ελέγχου 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Δοκιμή αέρα θαλάμου</p>
            <p class="text-xs text-gray-500 mt-1">Κάθε θάλαμος πιέζεται στο 1,5 x της πίεσης λειτουργίας και συγκρατείται επί 30 λεπτά. Τα δεδομένα καταγράφονται ανά σειριακό αριθμό.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Σημείο ελέγχου 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Έλεγχος πριν από την παράδοση</p>
            <p class="text-xs text-gray-500 mt-1">Ολοκληρωμένος έλεγχος σκάφους: όλοι οι σύνδεσμοι σφιγμένοι με τη σωστή ροπή, συστήματα λειτουργικά, χωρίς αισθητικές ατέλειες. Λίστα ελέγχου 100 σημείων.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Σημείο ελέγχου 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Τελική πιστοποίηση</p>
            <p class="text-xs text-gray-500 mt-1">Συγκέντρωση εκθέσεων δοκιμών, επανεξέταση αρχείων επιθεώρησης, έκδοση Πιστοποιητικού Συμμόρφωσης.</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>Βασικές μετρήσεις ποιότητας (κινητός μέσος όρος 2025)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Ποσοστό πρώτης επιτυχούς δοκιμής (παρτίδα υφάσματος)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Ποσοστό απόρριψης συγκολλήσεων (γραμμικό μέτρο)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Θάλαμοι με δοκιμή αέρα πριν από τη συναρμολόγηση</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">Συμμόρφωση κατηγορίας σχεδιασμού</span>
    </div>
  </div>


  <h2>Η ομάδα ποιότητας μας</h2>

  <p>Το εργαστήριο στελεχώνεται από έναν υπεύθυνο ποιότητας (10 χρόνια στη διασφάλιση ποιότητας στον ναυτικό κλάδο, Πιστοποιημένος Μηχανικός Ποιότητας ASQ), δύο επιθεωρητές ποιότητας (ο καθένας με πιστοποίηση NDT Επιπέδου 2 στον οπτικό έλεγχο) και έναν τεχνικό υλικών υπεύθυνο για όλες τις φυσικές
  δοκιμές. Η ομάδα συμμετέχει ετησίως σε δοκιμές επάρκειας μέσω ανεξάρτητου τρίτου παρόχου, ώστε τα αποτελέσματα των δοκιμών μας να παραμένουν ακριβή και αναπαραγώγιμα.</p>


  <h2>Ανεξάρτητες δοκιμές για πελάτες</h2>

  <p>Το Εργαστήριο Ποιότητας &amp; Επιθεώρησής μας διατίθεται για υπηρεσίες ανεξάρτητων δοκιμών. Αν χρειάζεται να επαληθεύσετε μια προδιαγραφή υφάσματος, να επικυρώσετε ένα νέο σύστημα κόλλας ή να αποκτήσετε έκθεση δοκιμής από τρίτο για πιστοποίηση προμήθειας, μπορούμε να εκτελέσουμε τις δοκιμές
  σύμφωνα με το εφαρμοστέο πρότυπο και να εκδώσουμε πιστοποιημένη έκθεση δοκιμής.</p>

  <p>Παραδείγματα πρόσφατων δοκιμών για τρίτους:</p>

  <ul>
    <li>Σύγκριση αντοχής αποκόλλησης πέντε ανταγωνιστικών προϊόντων μεμβράνης κόλλας για ευρωπαϊκό πρόγραμμα στρατιωτικών προμηθειών.</li>
    <li>Μελέτη επιταχυνόμενης γήρανσης (UV + θερμικός κύκλος) για μια νέα σύνθεση PVC με πορτοκαλί χρωστική, με τακτικές ενδιάμεσες μετρήσεις ανά διαστήματα 500 ωρών.</li>
    <li>Επικύρωση συγκράτησης αέρα 50 πρωτοτύπων βαλβίδων με διάφραγμα για νέο σχεδιασμό σωλήνα υψηλής πίεσης.</li>
  </ul>


  <h2>Η δέσμευσή μας απέναντί σας</h2>

  <p>Όταν παραλαμβάνετε ένα σκάφος {SITE.name}, παραλαμβάνετε και τον φάκελο ποιότητάς του — μια συγκεντρωτική καταγραφή των αποτελεσμάτων δοκιμών που ισχύουν για το συγκεκριμένο σκάφος σας. Πιστοποιητικό παρτίδας υφάσματος, δοκιμές αποκόλλησης συγκολλήσεων, αρχεία καταγραφής δοκιμής αέρα θαλάμου
  και λίστα ελέγχου πριν από την παράδοση. Κάθε αριθμός είναι ιχνηλάσιμος. Κάθε επιθεωρητής ταυτοποιείται. Δεν πρόκειται απλώς για γραφειοκρατία — είναι η υπόσχεσή μας ότι ό,τι παραδώσαμε είναι ό,τι προδιαγράψαμε.</p>

  <p>Αν ποτέ έχετε κάποια ανησυχία για την ποιότητα, μπορείτε να επικοινωνήσετε απευθείας με το εργαστήριο — τα στοιχεία επικοινωνίας αναγράφονται στο πιστοποιητικό συμμόρφωσής σας. Λαμβάνουμε σοβαρά υπόψη κάθε ερώτημα και δεσμευόμαστε για επίσημη διερεύνηση εντός 48 ωρών.</p>

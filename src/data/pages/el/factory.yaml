qc_section:
  tagline: Ποιοτικός Έλεγχος
  title: Διαδικασία Δοκιμών & Διασφάλισης Ποιότητας
  subtitle: Κάθε σκάφος υποβάλλεται σε υποχρεωτική δοκιμή πριν την αποστολή.
  steps:
    - step: '1'
      title: Επιθεώρηση Πρώτων Υλών
      desc: PVC, Hypalon και drop-stitch υφάσματα υποβάλλονται σε δοκιμή εφελκυσμού (ASTM D751), έλεγχο διάδοσης σχισμής και επιβεβαίωση αντοχής στην UV πριν οποιαδήποτε παρτίδα εισέλθει στην παραγωγή.
    - step: '2'
      title: 48ωρη Δοκιμή Συγκράτησης Αέρα
      desc: Κάθε θάλαμος φουσκώνεται στο 125% της ονομαστικής πίεσης και διατηρείται για 48 ώρες.
    - step: '3'
      title: Δοκιμή Φορτίου & Ισορροπίας
      desc: Τα έτοιμα σκάφη φορτώνονται στη μέγιστη χωρητικότητα και δοκιμάζονται.
oem_section:
  tagline: OEM Έργα
  title: Μελέτες Περιπτώσεων Συνεργασίας Brand & OEM
  subtitle: Από την ιδέα έως το κοντέινερ — πώς βοηθάμε τις παγκόσμιες μάρκες να λανσάρουν και να κλιμακώνουν τις σειρές φουσκωτών SUP τους.
  cases:
    - challenge: Ευρωπαίος λιανοπωλητής εξοπλισμού υπαίθρου χρειαζόταν μια σειρά SUP ιδιωτικής ετικέτας με μοναδικά γραφικά καταστρώματος, φιλικό προς το περιβάλλον PVC και συσκευασία έτοιμη για λιανική πώληση — όλα παραδοτέα σε 60 ημέρες.
      solution: Αναπτύξαμε προσαρμοσμένα αρχεία ψηφιακής εκτύπωσης, προμηθευτήκαμε PVC συμμορφούμενο με το REACH και συμπιέσαμε τη δειγματοληψία από 3 γύρους σε 1, μεταφέροντας την ομάδα σχεδιασμού στο εργοστάσιό μας στο Qingdao.
      result: 55 ημέρες από την υπογεγραμμένη PO έως το FOB. 2.400 μονάδες σε 4 SKU. Η επαναλαμβανόμενη παραγγελία τοποθετήθηκε πριν φτάσει το πρώτο κοντέινερ.
    - challenge: Αμερικανική νεοσύστατη εταιρεία θαλάσσιων σπορ χρειαζόταν SUP drop-stitch υψηλών επιδόσεων με προσαρμοσμένο σχήμα, συσκευασία συν-επωνυμίας και πιστοποίηση BSCI για τοποθέτηση στη λιανική.
      solution: Προσαρμόσαμε το υπάρχον καλούπι SUP με τροποποιημένο περίγραμμα, αναπτύξαμε το γραφικό σχεδιασμό της συσκευασίας συν-επωνυμίας και παρείχαμε πλήρη τεκμηρίωση ελέγχου BSCI.
      result: Επιτυχής κατάταξη σε 3 μεγάλες αλυσίδες υπαίθρου των ΗΠΑ. 5.000+ μονάδες τον πρώτο χρόνο με ποσοστό εξάντλησης 98%.
    - challenge: Αυστραλός διανομέας απαιτούσε σειρά SUP πιστοποιημένη CE με προσαρμοσμένα χρώματα και συμμόρφωση με τα αυστραλιανά πρότυπα.
      solution: Παράγαμε δείγματα προ-παραγωγής με 4 χρωματικές παραλλαγές και συντονίσαμε δοκιμές συμμόρφωσης από τρίτο μέρος.
      result: Σειρά 3 μοντέλων SUP κυκλοφόρησε στην αγορά AU/NZ. Ακολούθησε ανάθεση κυβερνητικού διαγωνισμού για 12 SUP περιπολίας.
faq_section:
  tagline: FAQ
  title: Συχνές Ερωτήσεις B2B & OEM
  questions:
    - q: Ποια είναι η ελάχιστη ποσότητα παραγγελίας (MOQ) για OEM SUP;
      a: Το MOQ ξεκινά από 5–10 μονάδες για τυπικά μοντέλα.
    - q: Η afarer διαθέτει πιστοποίηση BSCI;
      a: Ναι. Το εργοστάσιό μας διατηρεί έγκυρη πιστοποίηση κοινωνικής συμμόρφωσης BSCI (έκθεση ελέγχου διαθέσιμη κατόπιν αιτήματος). Κατέχουμε επίσης πιστοποίηση ISO 9001 για τη διαχείριση ποιότητας και όλα τα προϊόντα φέρουν πιστοποίηση CE. Τεκμηρίωση συμμόρφωσης REACH και RoHS παρέχεται με κάθε αποστολή OEM.
    - q: Ποιος είναι ο τυπικός χρόνος παράδοσης OEM;
      a: Ο τυπικός χρόνος παράδοσης είναι 30–45 ημέρες από την επιβεβαιωμένη παραγγελία και την προκαταβολή για μαζική παραγωγή OEM. Η ανάπτυξη προσαρμοσμένων καλουπιών προσθέτει 15–20 ημέρες για την κατασκευή εργαλείων. Επιταχυνόμενη παραγωγή είναι διαθέσιμη για επείγουσες παραγγελίες και εποχικές αιχμές. Δείγματα πρωτοτύπου αποστέλλονται συνήθως εντός 15–20 ημερών.
    - q: Μπορείτε να αποστείλετε FOB Qingdao ή CIF;
      a: Ναι. Αποστέλλουμε FOB Qingdao, CIF σε μεγάλους παγκόσμιους λιμένες και DDP για επιλεγμένους συνεργάτες. Η ομάδα logistics μας διαχειρίζεται την κράτηση κοντέινερ, την εξαγωγική τεκμηρίωση και το τελωνειακό καθαρισμό. Αποστέλλουμε σε 50+ χώρες σε αγορές ΕΕ, ΗΠΑ, Αυστραλίας και Ασίας.
b2b_moq: 'Τυπικό MOQ: 5–10 μονάδες ανά μοντέλο (SUP/καγιάκ). SUP MOQ: 2–5 μονάδες.'
production_flow:
  tagline: Ροή Παραγωγής
  title: Από το Υλικό στο Έτοιμο Σκάφος
  subtitle: Κάθε πλοίο διέρχεται από 6 παραγωγικά στάδια με σημεία ελέγχου ποιότητας σε κάθε βήμα. Καμία συντομεύσεις, καμία αμελήσεις ελέγχων.
  stages:
    - stage: '01'
      title: Παραλαβή Υλικών & Ποιοτικός Έλεγχος Εισερχομένων
      description: Όλα τα εισερχόμενα υλικά καταγράφονται με αριθμό παρτίδας στο σύστημα ERP μας. Τα ρολά υφάσματος PVC, οι πυρήνες drop-stitch, οι βαλβίδες, τα συγκολλητικά και τα μεταλλικά εξαρτήματα παραμένουν σε καραντίνα έως ότου δοθεί η έγκριση από τον έλεγχο ποιότητας (QC).
      qc_check: Αντοχή σε εφελκυσμό (ASTM D751), αντοχή σε σχίσιμο (ISO 4674), μέτρηση πάχους, ιξώδες κόλλας, οπτικός έλεγχος ελαττωμάτων
      qc_threshold: Δοκιμάζεται το 100% των παρτίδων. Απόρριψη αν η αντοχή σε εφελκυσμό < 90% της προδιαγραφής, η αντοχή σε σχίσιμο < το ελάχιστο της προδιαγραφής ή υπάρχει οποιοδήποτε οπτικό ελάττωμα
      responsibility: Ομάδα QC εισερχομένων (3 επιθεωρητές)
    - stage: '02'
      title: Κοπή CNC & Προετοιμασία Υλικών
      description: Η βελτιστοποιημένη μέσω υπολογιστή διάταξη κοπής τοποθετεί τα πάνελ πάνω στο PVC ώστε να ελαχιστοποιείται η σπατάλη. Οι αυτόματες μηχανές κοπής CNC εξασφαλίζουν ακρίβεια θέσης 0.1 mm.
      qc_check: Έλεγχος διαστάσεων έναντι αρχείων CAD DXF, επιθεώρηση ποιότητας ακμών, επαλήθευση αριθμού πάνελ
      qc_threshold: Κάθε 20ό πάνελ ελέγχεται. Ανοχή ±0,5 mm. Απόρριψη παρτίδας εάν >2% εκτός ανοχής
      responsibility: Επικεφαλής εργαστηρίου κοπής
    - stage: '03'
      title: Συγκόλληση & Σύνδεση Drop-Stitch
      description: Οι πυρήνες drop-stitch συγκολλώνται σε εξωτερικούς PVC λαμινάτ χρησιμοποιώντας θερμικό λαμινάρισμα. Οι θερμοκοιλίες σωλήνων είναι RF συγκολλημένες ή συγκολλημένες με ζεστό αέρα. Τα ράγα ενίσχυσης είναι συγκολλημένα με τριπλή στρώση συγκόλλησης.
      qc_check: Δοκιμή αποκόλλησης κάθε 50 μονάδες (ASTM D751), μέτρηση πλάτους συγκόλλησης, έλεγχος καταγραφών θερμοκρασίας θερμού αέρα, οπτικός έλεγχος ραφής υπό οπίσθιο φωτισμό
      qc_threshold: Αντοχή αποκόλλησης ελάχ. 8 N/cm. Ανοχή πλάτους συγκόλλησης ±1 mm. Οποιαδήποτε ορατή διαμόρφωση αυλακώσεων = απόρριψη
      responsibility: Ποιοτικός έλεγχος συγκόλλησης (2 επιθεωρητές ανά βάρδια)
    - stage: '04'
      title: Συναρμολόγηση & Εξαρτισμός
      description: 'Τα σκάφη προχωρούν στη τελική συναρμολόγηση, όπου συνδέονται όλα τα εξαρτήματα: γάστρα + σωλήνες, τοποθέτηση βαλβίδων, δακτύλιοι D, λαβές, υποδοχές πτερυγίων και τοποθέτηση τσάντας μεταφοράς. Κάθε μονάδα ακολουθεί λίστα ελέγχου συναρμολόγησης 100 σημείων.'
      qc_check: Υπογραφή λίστας ελέγχου 100 σημείων ανά μονάδα, δοκιμή λειτουργίας βαλβίδων (10 κύκλοι ανοίγματος/κλεισίματος), έλεγχος ροπής εξαρτημάτων, οπτικός έλεγχος
      qc_threshold: 'Πολιτική μηδενικών ελαττωμάτων για τα κρίσιμα για την ασφάλεια εξαρτήματα (βαλβίδες, δακτύλιοι D, λαβές). Μικρά αισθητικά ελαττώματα: AQL 2.5 (ISO 2859)'
      responsibility: Επικεφαλής ομάδας συναρμολόγησης + έλεγχος ποιότητας γραμμής
    - stage: '05'
      title: Δοκιμές Πίεσης & Συγκράτηση Ποιότητας
      description: Κάθε θάλαμος γεμίζεται με αέρα σε 1,25× κανονική πίεση (συνήθως 20–25 PSI) και κρατιέται για 24–48 ώρες. Οι αισθητήρες πίεσης καταγράφουν συνεχώς. Οι θάλαμοι που ξεπερνούν την 5% πτώση πίεσης απορρίπτονται και αποστέλλονται για επαναέλεγχο των νήματων.
      qc_check: Αρχείο καταγραφής 24ωρης συγκράτησης πίεσης, καθημερινή επαλήθευση βαθμονόμησης αισθητήρων, ένδειξη πίεσης αντισταθμισμένη ως προς τη θερμοκρασία, επανέλεγχος ραφών μετά από επισκευή
      qc_threshold: Μέγιστη πτώση πίεσης 5% σε 24 ώρες σε σταθερή θερμοκρασία. Οποιαδήποτε θερμοκοιλία που υπερβαίνει αυτό = 100% επαναδοκιμή ολόκληρης παρτίας παραγωγής
      responsibility: Εργαστήριο ποιότητας (ανεξάρτητο από την παραγωγή, αναφέρεται στη διοίκηση)
    - stage: '06'
      title: Τελικός Έλεγχος & Συσκευασία
      description: Τελικός οπτικός και λειτουργικός έλεγχος. Επιφανειακά ελαττώματα, χρωματική συνέπεια, επαλήθευση ετικέτας/BIN, ακεραιότητα συσκευασίας και πληρότητα αξεσουάρ. Οι μονάδες συσκευάζονται υπό κενό, τοποθετούνται σε κουτιά και παλετοποιούνται για φόρτωση σε εμπορευματοκιβώτια.
      qc_check: Πλήρης οπτικός έλεγχος, λίστα ελέγχου αξεσουάρ ανά SKU, δοκιμή πτώσης συσκευασίας (1 m, τυχαίο δείγμα), επαλήθευση σάρωσης ετικέτας/γραμμικού κώδικα
      qc_threshold: AQL 2.5 για σοβαρά ελαττώματα, AQL 4.0 για ήσσονος σημασίας. Μηδενική ανοχή σε ελαττώματα ασφαλείας. 100% των μονάδων ελέγχονται οπτικά
      responsibility: Τελική ομάδα QC (4 ελεγκτές) + επικεφαλής ομάδας συσκευασίας
workforce:
  tagline: Οι Άνθρωποί μας
  title: Εργατικό Δυναμικό & Τεχνογνωσία
  engineers: 25+
  engineers_detail: Μηχανικοί σε R&D, σχεδιασμό μοτίου, εργαστήριο υλικών και μηχανική παραγωγή. Μέση εμπειρία 7+ χρόνια στην κατασκευή στεγανών.
  shift_pattern: 2 βάρδιες/ημέρα (07:00–15:30, 15:30–00:00). Προαιρετική νυχτερινή βάρδια για επείγουσες παραγγελίες.
  training: Μηνιαίος εκπαιδευτικός έλεγχος ποιότητας, τριμηνίες ασφαλειακές ασκήσεις, ετήσιος αξιολογητικός έλεγχος δεξιοτήτων. Οι νέοι εκλεκτοί ολοκληρώνουν 40ώρη εισαγωγική εκπαίδευση πριν ξεκινήσουν στη γραμμή παραγωγής.
  departments:
    - name: R&D & Engineering
      count: 25+
      role: Σχεδιασμός προϊόντος, μηχανική καλουπιών, εργαστήριο υλικών
    - name: Cutting & Material Prep
      count: 15
      role: Κοπή CNC, προετοιμασία πάνελ, διαχείριση υλικών
    - name: Welding & Lamination
      count: 40
      role: Συγκόλληση RF, συγκόλληση θερμού αέρα, συγκόλληση drop stitch
    - name: SUP Core Bonding
      count: 30
      role: Επικόλληση drop-stitch, θερμοσυγκόλληση, συγκόλληση λωρίδων πλευρών (rail band)
    - name: Assembly & Rigging
      count: 35

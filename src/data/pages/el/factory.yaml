workshops_section:
  tagline: Εργαστήρια
  title: Εργαστήρια Κατασκευής
  workshops:
    - title: Κοπή PVC & Προετοιμασία Υλικών
      description: Αυτόματες μηχανές κοπής CNC επεξεργάζονται PVC, Hypalon και drop-stitch υφάσματα.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Συγκόλληση Σωλήνων & Θερμοσφράγιση
      description: Εξειδικευμένο εργαστήριο συγκόλλησης με μηχανές θερμοσφράγισης και πρέσες RF.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: Παραγωγή Κύτους SUP —Υαλόνημα
      description: Κύτη SUP παράγονται με χειροκίνητη στρωμάτωση υαλονήματος.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: Εκτύπωση & Διακόσμηση SUP
      description: Οι σανίδες SUP διακοσμούνται με ψηφιακή εκτύπωση και μεταξοτυπία.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Τελική Συναρμολόγηση
      description: Γραμμή συναρμολόγησης όπου ενώνονται κύτη υαλονήματος και σωλήνες PVC.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Ποιοτικός Έλεγχος & Επιθεώρηση
      description: Κάθε έτοιμο σκάφος υποβάλλεται σε υποχρεωτική δοκιμή συγκράτησης αέρα.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


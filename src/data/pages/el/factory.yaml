material_traceability:
  tagline: Ιχνηλασιμότητα
  title: Παρακολούθηση Υλικών & Έλεγχος Σύμπακτου
  description: >-
    Κάθε παρτίδα πρώτης ύλης λαμβάνει έναν μοναδικό αριθμό παρτίδας στο σύστημα ERP μας. Από την παραλαβή, μέσω της παραγωγής έως το τελικό προϊόν, ο κατάλογος υλικών κάθε σκάφους συνδέεται με την αρχική παρτίδα του προμηθευτή. Αυτό εξασφαλίζει πλήρη ιχνηλασιμότητα προς τα πάνω για κάθε ζήτημα
    ποιότητας ή συμμόρφωσης.
  system: Προσαρμοσμένη ERP (εσωτερικό σύστημα Qingdao Vatrad Group) + φυσικά batch tags σε κάθε παραγγελία εργασίας
  coverage: 100% των υλικών παραγωγής — PVC, Hypalon, ύφασμα drop-stitch, κόλλες, βαλβίδες, εξαρτήματα, συσκευασία
  records_retained: 10 χρόνια (σύμφωνα με την απαίτηση CE 2013/53/ΕΕ)
  suppliers:
    - material: PVC ναυτιλιακής ποιότητας
      source: Κινέζοι και Κορεάτες προμηθευτές
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Ιάπωνας προμηθευτής
      certified: ISO 9001, REACH
    - material: Ύφασμα drop-stitch
      source: Εσωτερικό πλεκτικό + εξωτερικός εταίρος
      certified: Εσωτερικός έλεγχος ποιότητας + ISO 9001 προμηθευτή
    - material: Βαλβίδες & Εξαρτήματα
      source: Κινέζοι προμηθευτές OEM
      certified: ISO 9001, πιστοποιητικά υλικών ανά παρτίδα

meta:
  title: Πόροι & Λήψεις B2B | {SITE}
  description: Κατεβάστε οδηγούς κατασκευής OEM, καταλόγους προϊόντων, εκθέσεις ποιότητας και υπολογιστές ROI για επιχειρήσεις φουσκωτών SUP.
hero:
  tagline: Κέντρο Πόρων
  title: Εργαλεία & Πόροι<br />Για Επιχειρηματικούς Συνεργάτες SUP
  subtitle: Κατεβάστε οδηγούς OEM, καταλόγους προϊόντων και εκθέσεις ποιότητας, και χρησιμοποιήστε τον υπολογιστή ROI μας για να προγραμματίσετε την επένδυσή σας σε στόλο SUP.
resources:
  - title: Κατάλογος Προϊόντων OEM/ODM 2026
    description: Πλήρης σειρά προϊόντων με προδιαγραφές, βαθμίδες τιμολόγησης, MOQ και επιλογές προσαρμογής για συνεργάτες B2B.
    icon: tabler:file-text
    type: catalog
    link: /media
    cta: Λήψη Καταλόγου
  - title: Οδηγός Ιδιωτικής Ετικέτας για Επωνυμίες SUP
    description: Βήμα-βήμα οδηγός για τη δημιουργία της δικής σας μάρκας SUP — από την έρευνα αγοράς και τον σχεδιασμό έως την παραγωγή και την παγκόσμια παράδοση.
    icon: tabler:book
    type: guide
    link: /news/private-label-sup-oem-guide
    cta: Διαβάστε τον Οδηγό
  - title: Υπολογιστής ROI στόλου SUP
    description: Υπολογίστε την επένδυση στον στόλο SUP του θέρετρου ή του συλλόγου σας, τα προβλεπόμενα έσοδα και την περίοδο απόσβεσης με τον διαδραστικό υπολογιστή μας.
    icon: tabler:calculator
    type: tool
    link: '#roi-calculator'
    cta: Υπολογίστε την Απόδοση Επένδυσης (ROI)
  - title: Έκθεση Ποιότητας & Πιστοποίησης
    description: Έγγραφα πιστοποίησης CE, σύστημα διαχείρισης ποιότητας ISO 9001, αποτελέσματα δοκιμών γήρανσης UV και δεδομένα δοκιμών συγκράτησης πίεσης.
    icon: tabler:certificate
    type: report
    link: /evidence
    cta: Προβολή Αναφορών
  - title: Φυλλάδιο Δυνατοτήτων του Εργοστασίου
    description: Εικονική περιήγηση στις εγκαταστάσεις παραγωγής μας των 12,000 m² με λεπτομέρειες για τις γραμμές παραγωγής και τις διαδικασίες ελέγχου ποιότητας.
    icon: tabler:building-factory
    type: brochure
    link: /factory
    cta: Ξενάγηση στο Εργοστάσιο
  - title: Οδηγός Εσόδων Στόλου Θέρετρου
    description: Ανάλυση ROI εμπορικού στόλου SUP με μοντέλα τιμολόγησης, ποσοστά χρησιμοποίησης και πραγματικά αποτελέσματα μελετών περίπτωσης από θέρετρα 5 αστέρων.
    icon: tabler:chart-bar
    type: guide
    link: /news/commercial-sup-fleet-roi-resorts
    cta: Διαβάστε τον Οδηγό
cta:
  title: Χρειάζεστε βοήθεια για να βρείτε τον σωστό πόρο;
  subtitle: Επικοινωνήστε με την ομάδα μας για εξατομικευμένη καθοδήγηση σχετικά με την επιλογή προϊόντος, συνεργασίες OEM ή τεχνικές προδιαγραφές.
  button: Επικοινωνήστε με την Ομάδα Πωλήσεων
  link: /contact?source=resources

hero_text:
  tagline: Resources
  title: 'Κέντρο Λήψεων & Οδηγοί Αγοράς'
  subtitle: 'Πρόσβαση σε καταλόγους προϊόντων, οδηγούς OEM, λίστες ελέγχου αγοραστή και τεχνική τεκμηρίωση για να λαμβάνετε τεκμηριωμένες αποφάσεις προμηθειών.'
features3_downloads:
  tagline: Downloads
  title: 'Τεκμηρίωση Προϊόντος<br />& Πόροι Αγοραστή'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Πλήρης γκάμα προϊόντων που περιλαμβάνει σκάφη SUP, φουσκωτές βάρκες, σανίδες SUP, καγιάκ και αξεσουάρ. Προδιαγραφές, διαμορφώσεις και επιλογές. Μορφή PDF.'
      icon: tabler:file-text
    - title: 'Οδηγός Κατασκευής OEM'
      description: 'Όλα όσα πρέπει να γνωρίζετε για συνεργασίες OEM/ODM: επισκόπηση διαδικασίας, ελάχιστες ποσότητες παραγγελίας, επιλογές προσαρμογής, ποιοτικός έλεγχος και αποστολή.'
      icon: tabler:building-factory
    - title: 'Οδηγός Αγοράς Σκαφών SUP'
      description: 'Πώς να επιλέξετε το σωστό SUP: υλικά κύτους, υλικά σωλήνων, επιλογή κινητήρα, ζητήματα μεγέθους και επιλογές διαμόρφωσης για διαφορετικές εφαρμογές.'
      icon: tabler:file-description
    - title: 'Λίστα Ελέγχου Προμηθευτή SUP'
      description: 'Βασικές εκτιμήσεις κατά την επιλογή κατασκευαστή σανίδων SUP: δείκτες ποιότητας, απαιτήσεις πιστοποίησης, ζητήματα MOQ και τι να αναζητήσετε σε έναν έλεγχο εργοστασίου.'
      icon: tabler:clipboard-check
    - title: 'Οδηγός Υλικών Φουσκωτών Σκαφών'
      description: 'PVC vs Hypalon: σύγκριση ανθεκτικότητας, αντοχής UV, διάρκειας ζωής, επιλογών επισκευής και ζητημάτων κόστους για διαφορετικές θαλάσσιες εφαρμογές.'
      icon: tabler:files
    - title: 'Πρότυπο Σύντομου Παραγγελίας Προσαρμοσμένης Κατασκευής'
      description: 'Κατεβάστε το πρότυπο σύντομης περιγραφής προϊόντος. Συμπληρώστε τις απαιτήσεις σας και επιστρέψτε το σε εμάς για προσφορά και αξιολόγηση σκοπιμότητας εντός της ίδιας εβδομάδας.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Συχνές ερωτήσεις σχετικά με τα προϊόντα μας, τη διαδικασία κατασκευής και το μοντέλο συνεργασίας.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'Το MOQ ποικίλλει ανά κατηγορία προϊόντος. Τα σκάφη SUP συνήθως ξεκινούν από 10 τεμάχια ανά μοντέλο. Οι σανίδες SUP από 50 τεμάχια. Επικοινωνήστε με την ομάδα πωλήσεών μας για πληροφορίες MOQ ανά προϊόν.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Ναι. Η afarer παρέχει παραγωγή δειγμάτων για αξιολόγηση πριν από τη μαζική παραγωγή. Τα κόστη δειγμάτων είναι διαπραγματεύσιμα και συχνά πιστώνονται στην πρώτη παραγγελία παραγωγής.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Οι τυπικοί όροι είναι 30% προκαταβολή με την παραγγελία, 70% πριν από την αποστολή. Όροι LC διαθέσιμοι για επιλέξιμους πελάτες. Επικοινωνήστε με την οικονομική ομάδα μας για να συζητήσετε ρυθμίσεις.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Τυπικοί χρόνοι παράδοσης: σκάφη SUP 30-45 ημέρες, σανίδες SUP 20-30 ημέρες, φουσκωτά σκάφη 25-35 ημέρες. Η προσαρμοσμένη ανάπτυξη προσθέτει 15-30 ημέρες για πρωτοτυποποίηση.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'Πιστοποίηση CE για αγορές ΕΕ, εγκεκριμένη κατασκευή από την Ακτοφυλακή ΗΠΑ, σύστημα ποιότητας ISO, συμμόρφωση BSCI και συμμόρφωση υλικών REACH.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Ναι. Παρέχουμε προσαρμοσμένη συσκευασία με το λογότυπό σας, χρώματα και ταυτότητα επωνυμίας. Το MOQ για προσαρμοσμένη συσκευασία εξαρτάται από την κατηγορία προϊόντος.'
      icon: tabler:color-swatch
cta:
  title: 'Χρειάζεστε βοήθεια για να βρείτε τον σωστό πόρο;'
  subtitle: 'Επικοινωνήστε με την ομάδα μας για εξατομικευμένη καθοδήγηση σχετικά με την επιλογή προϊόντος, συνεργασίες OEM ή τεχνικές προδιαγραφές.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

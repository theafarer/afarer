  description: 'Η Afarer δημιουργεί περιορισμένες συλλογές φουσκωτών SUP co-branded με αναγνωρισμένους συλλόγους, θέρετρα, εκδηλώσεις, κοινότητες και συνεργάτες χωρών. Τα προϊόντα co-branded παραμένουν προϊόντα Afarer — σχεδιασμένα, μελετημένα μηχανικά και υποστηριζόμενα από την επωνυμία Afarer.'

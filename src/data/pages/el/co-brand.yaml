features:
  title: 'Τι Σημαίνει το Co-Branding στην Afarer'
  subtitle: 'Το co-branding είναι το πρόγραμμα σχεδιαστικής μας συνεργασίας — χτισμένο γύρω από την επωνυμία Afarer, την προστασία περιοχών και τις περιορισμένες συλλογές, όχι την παραγωγή χωρίς επωνυμία.'
  columns: 3
  items:
    - title: 'Τα Προϊόντα Afarer Παραμένουν Προϊόντα Afarer'
      description: 'Μια συλλογή co-branded είναι μια περιορισμένη έκδοση σανίδων Afarer με την ταυτότητά σας υφασμένη σε αυτήν. Δεν είναι ποτέ χωρίς επωνυμία, ποτέ επωνυμία τρίτου και ποτέ ένα ανοιχτό πρόγραμμα ιδιωτικής ετικέτας.'
      icon: 'tabler:trademark'
    - title: 'Σχεδιασμένο Μαζί Σας'
      description: 'Τα χρώματά σας, η ονοματολογία και η ιστορία σας διαμορφώνουν τη συλλογή. Η ομάδα σχεδιασμού και μηχανικής μας αναλαμβάνει καταστρώματα, γραφικά, συσκευασία και τεκμηρίωση από τη σύνοψη έως την παράδοση.'
      icon: 'tabler:pencil'
    - title: 'Για Συλλόγους, Θέρετρα, Εκδηλώσεις & Κοινότητες'
      description: 'Συλλογές στόλων για συλλόγους paddle και θέρετρα, εκδόσεις εκδηλώσεων για αγώνες και κοινοτικές σειρές — όλες με την ποιότητα και την εγγύηση Afarer.'
      icon: 'tabler:users'
    - title: 'Προστατεύει τους Συνεργάτες Χωρών'
      description: 'Το co-branding λειτουργεί παράλληλα με το μοντέλο μας μία χώρα — ένας διανομέας. Οι εθνικοί συνεργάτες διατηρούν την περιοχή τους· οι συλλογές co-branded δεν ανοίγουν την πόρτα σε παράλληλες επωνυμίες στην αγορά τους.'
      icon: 'tabler:shield-check'
    - title: 'Μηχανική & Πρότυπα Ποιότητας'
      description: 'Κάθε συλλογή αποστέλλεται από την πιστοποιημένη αλυσίδα εφοδιασμού μας με τεκμηρίωση CE και ISO 9001, δοκιμές πίεσης και τα ίδια σημεία ελέγχου QC με τη βασική μας σειρά.'
      icon: 'tabler:certificate'
    - title: 'Γίνεται Περιουσιακό Στοιχείο Επωνυμίας'
      description: 'Μια περιορισμένη συλλογή co-branded χτίζει τη δική σας ιστορία στο νερό — περιθώριο πώλησης, περιεχόμενο μέσων και ένας λόγος οι paddlers να επιστρέφουν σεζόν με τη σεζόν.'
      icon: 'tabler:star'
table:
  title: 'Επίπεδα Συλλογών Co-Brand'
  subtitle: 'Τυπικοί όροι συλλογών co-brand. Τιμές σε USD, FOB Qingdao. Τα προσαρμοσμένα σχέδια καταστρώματος προσθέτουν 15–20 εργάσιμες ημέρες ανάπτυξης· τα νέα καλούπια τιμολογούνται ανά έργο.'
  caption: 'Όλα τα προϊόντα co-branded παραμένουν προϊόντα Afarer και φέρουν την ταυτότητα της επωνυμίας Afarer. Το εύρος του έργου, το χρονικό παράθυρο αποκλειστικότητας και οι τελικοί όροι συμφωνούνται στο Co-Brand Project Agreement.'
  head:
    - Επίπεδο Co-Brand
    - Ελάχιστη Παραγγελία (μονάδες)
    - Χρόνος Παράδοσης
    - Πληρωμή
  rows:
    - [Πιλοτική Συλλογή, 30–50, 30–45 εργάσιμες ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Τυπική Συλλογή Co-Branded, 50–100, 30–45 εργάσιμες ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Μεγάλη / Πολυπεριφερειακή Συλλογή, 100+, 45–60 εργάσιμες ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
    - [Νέο Καλούπι ή Βαθιά Τοπικοποίηση, 200+, 60–90 εργάσιμες ημέρες, 30% προκαταβολή / 70% πριν την αποστολή]
faqs:
  title: 'Co-Brand — Συχνές Ερωτήσεις'
  subtitle: 'Πώς λειτουργεί το co-branding της Afarer και πώς διαφέρει από το OEM και την ιδιωτική ετικέτα.'
  items:
    - title: 'Είναι το co-branding το ίδιο με το OEM ή την ιδιωτική ετικέτα;'
      description: 'Όχι. Η Afarer δεν λειτουργεί πλέον ανοιχτό πρόγραμμα OEM/ιδιωτικής ετικέτας. Τα προϊόντα co-branded παραμένουν προϊόντα Afarer — σχεδιασμένα, μελετημένα μηχανικά, ελεγμένα ποιοτικά και υποστηριζόμενα από την επωνυμία Afarer. Η ταυτότητά σας εμφανίζεται ως co-brand, όχι ως προϊόν τρίτου χωρίς επωνυμία.'
    - title: 'Ποιος μπορεί να ξεκινήσει έργο co-brand;'
      description: 'Αναγνωρισμένες επιχειρήσεις θαλάσσιων σπορ: υπάρχοντες συνεργάτες χωρών, σύλλογοι paddle, θέρετρα και ξενοδοχεία, διοργανωτές εκδηλώσεων και κοινότητες. Στείλτε μας μια σύνοψη έργου και επιβεβαιώνουμε την καταλληλότητα πριν ξεκινήσει ο σχεδιασμός.'
    - title: 'Θα έρθει το co-branding σε σύγκρουση με τον διανομέα της χώρας μου;'
      description: 'Όχι. Το μοντέλο μία χώρα — ένας διανομέας έχει προτεραιότητα. Οι συλλογές co-branded συντονίζονται με τον τοπικό συνεργάτη χώρας όπου υπάρχει, ώστε καμία παράλληλη ή ανταγωνιστική επωνυμία να μην εμφανίζεται μέσα σε προστατευμένη περιοχή.'
    - title: 'Ποια είναι η ελάχιστη παραγγελία για συλλογή co-brand;'
      description: 'Οι πιλοτικές συλλογές ξεκινούν από 30–50 μονάδες. Οι τυπικές συλλογές είναι 50–100 μονάδες· οι μεγάλες ή πολυπεριφερειακές εκδόσεις 100+ μονάδες. Τα χρονοδιαγράμματα προσαρμοσμένης ανάπτυξης συμφωνούνται ανά έργο.'
    - title: 'Τι συνιστά ποιότητα Afarer έναντι της συνεισφοράς του συνεργάτη;'
      description: 'Η Afarer κατέχει τον σχεδιασμό του προϊόντος, τη μηχανική, τα υλικά, την κατασκευή, το QC και την εγγύηση. Οι συνεργάτες συνεισφέρουν την ιδέα της συλλογής, την ονοματολογία, τα χρώματα, τα γραφικά και την είσοδο στην αγορά. Αυτό κρατά ένα πρότυπο ποιότητας στο νερό.'
    - title: 'Πώς κάνω αίτηση;'
      description: 'Συμπληρώστε τη φόρμα ενδιαφέροντος co-brand με την επιχείρηση, την αγορά και την ιδέα συλλογής σας. Εξετάζουμε την καταλληλότητα και απαντάμε εντός 3 εργάσιμων ημερών με πρόταση και το Co-Brand Project Agreement.'

hero:
  tagline: Μηχανική
  title: Πώς να Επιλέξετε το Πάχος SUP — Τεχνική Ανάλυση
  subtitle: 6 λεπτά ανάγνωσης
content_html: >
  <h2>Τα Τρία Τυπικά Πάχη</h2>


  <h3>4" (10 cm) – Touring &amp; Απόδοση</h3>

  <ul>
    <li>Μέγιστη ακαμψία – λιγότερη κάμψη υπό φορτίο</li>
    <li>Το ελαφρύτερο – λιγότερο υλικό, λιγότερος όγκος αέρα</li>
    <li>Άριστη σταθερότητα πορείας – μειωμένη πλευρική ταλάντωση</li>
    <li>Το ταχύτερο – μειωμένη αντίσταση, ευκολότερη ολίσθηση</li>
    <li>Κατάλληλο για: Touring, αγώνες, προπόνηση fitness, έμπειρους κωπηλάτες</li>
  </ul>


  <h3>5" (12.7 cm) – All-Around</h3>

  <ul>
    <li>Καλή ακαμψία – ισορροπημένη αναλογία κάμψης προς ακαμψία</li>
    <li>Μέτριο βάρος – τυπική χρήση υλικών</li>
    <li>Καλή πρωτογενής + δευτερογενής ευστάθεια</li>
    <li>Κατάλληλο για: Ψυχαγωγική κωπηλασία, αρχάριους, περιστασιακή χρήση σε λίμνες και ποτάμια</li>
  </ul>


  <h3>6" (15.2 cm) – Ευστάθεια &amp; Yoga</h3>

  <ul>
    <li>Μέγιστη πρωτογενής ευστάθεια – τεράστια άνωση</li>
    <li>Το βαρύτερο – περισσότερο υλικό PVC, μεγαλύτερος όγκος αέρα</li>
    <li>Το βραδύτερο – μεγαλύτερη αντίσταση, δυσκολότερη διατήρηση της ολίσθησης</li>
    <li>Κατάλληλο για: Yoga/fitness, βαριούς κωπηλάτες (100+ kg), πολύ ταραγμένες θάλασσες</li>
  </ul>


  <h2>Τεχνική Ανάλυση</h2>

  <p>Η ακαμψία ενός φουσκωτού SUP καθορίζεται από την εσωτερική πίεση αέρα και τη ροπή αδράνειας της διατομής της σανίδας. Στα 20 PSI, μια σανίδα 4" παρουσιάζει περίπου 30% λιγότερη κάμψη υπό φορτίο από μια σανίδα 6" με το ίδιο πλάτος και μήκος. Η πρωτογενής ευστάθεια προέρχεται από το πλάτος στη
  γραμμή ίσαλου και την άνωση· η δευτερογενής ευστάθεια επηρεάζεται από το σχήμα των πλευρικών τοιχωμάτων (rails) και το πλάτος της σανίδας.</p>


  <h2>Πάχος ανά Βάρος Κωπηλάτη</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Βάρος Κωπηλάτη</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Προτεινόμενο Πάχος</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Έως 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" ή 6"</td></tr>
      <tr><td class="p-3 border">Άνω των 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>Αντιστάθμιση Πάχους vs. PSI</h2>

  <p>Μια κοινή παρανόηση είναι ότι η υψηλότερη πίεση PSI μπορεί να αντισταθμίσει το υπερβολικό πάχος. Στα 25 PSI, μια σανίδα 6" παρουσιάζει μεγαλύτερη κάμψη από μια σανίδα 4" στα 15 PSI, επειδή η γεωμετρική ροπή αδράνειας κυριαρχεί στην εξίσωση της ακαμψίας. Για κωπηλάτες που επιδιώκουν επιδόσεις,
  μια λεπτότερη σανίδα με χαμηλότερη πίεση υπερτερεί μιας παχύτερης σανίδας με υψηλότερη πίεση.</p>


  <h2>Η Γκάμα της afarer</h2>

  <ul>
    <li><strong>Σανίδες 4":</strong> Σειρά Cheetah Touring – touring SUP 12' x 30" x 4" για προπόνηση και κωπηλασία αποστάσεων</li>
    <li><strong>Σανίδες 5":</strong> Σειρά Cheetah All-Round – 10'6" x 32" x 5" για ψυχαγωγική χρήση</li>
    <li><strong>Σανίδες 6":</strong> Σειρά Cheetah Ultra-Stable – 10' x 34" x 6" για yoga, μεγαλόσωμους κωπηλάτες και πλατφόρμες φωτογραφίας</li>
  </ul>

  <p>Όλες οι σανίδες χρησιμοποιούν πυρήνες drop-stitch 1.680 DTEX με ονομαστική πίεση 20 PSI και πολυστρωματικό υλικό PVC 1,2 mm.</p>

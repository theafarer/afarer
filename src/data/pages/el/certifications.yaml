meta:
  title: 'Πιστοποιήσεις — CE, ISO 9001 και συμμόρφωση | {SITE}'
  description: 'Οι πιστοποιήσεις ποιότητας της afarer: CE (Οδηγία 2013/53/ΕΕ), ISO 9001:2015, BSCI. Συμμόρφωση και ασφάλεια για έναν κατασκευαστή φουσκωτών σανίδων SUP και σκαφών.'
  keywords:
    - 'πιστοποίηση CE paddle board'
    - 'ISO 9001 paddle board'

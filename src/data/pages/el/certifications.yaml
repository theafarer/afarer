hero:
  tagline: Certifications & Standards
  title: 'Πιστοποιήσεις Ποιότητας<br />& Πρότυπα Συμμόρφωσης'
  subtitle: 'Τα προϊόντα afarer κατασκευάζονται σύμφωνα με διεθνή πρότυπα θαλάσσιας ασφάλειας, συστήματα διαχείρισης ποιότητας και περιβαλλοντικούς κανονισμούς.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarer quality certifications and compliance documentation
content_certifications:
  tagline: Our Certifications
  title: 'Πιστοποιημένη Ποιότητα,<br />Παγκόσμια Αναγνωρισμένη'
  subtitle: 'Κάθε προϊόν afarer υποστηρίζεται από πιστοποιήσεις που αποδεικνύουν τη δέσμευσή μας για ποιότητα, ασφάλεια και περιβαλλοντική ευθύνη.'
  items:
    - title: 'CE Certified'
      description: 'Όλα τα προϊόντα afarer συμμορφώνονται με τις ευρωπαϊκές απαιτήσεις σήμανσης CE για σκάφη αναψυχής, διασφαλίζοντας ότι πληρούνται τα πρότυπα ασφάλειας, υγείας και προστασίας του περιβάλλοντος.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Το σύστημα διαχείρισης ποιότητάς μας είναι πιστοποιημένο ISO 9001:2015, καλύπτοντας τον σχεδιασμό, την κατασκευή και τη διανομή φουσκωτών σκαφών και θαλάσσιου εξοπλισμού.'
      icon: tabler:clipboard-check
    - title: 'UKCA Marked'
      description: 'Τα προϊόντα που πωλούνται στην αγορά του ΗΒ φέρουν σήμανση UKCA, επιβεβαιώνοντας τη συμμόρφωση με τους κανονισμούς του ΗΒ για θαλάσσιο εξοπλισμό και προσωπικά σκάφη.'
      icon: tabler:shield
    - title: 'BSCI Compliant'
      description: 'Η afarer ελέγχεται από την BSCI (Business Social Compliance Initiative), αποδεικνύοντας ηθικές πρακτικές κατασκευής, δίκαιες συνθήκες εργασίας και υπευθυνότητα εφοδιαστικής αλυσίδας.'
      icon: tabler:heart-handshake
    - title: 'Συμμόρφωση REACH'
      description: 'Όλα τα υλικά που χρησιμοποιούνται στα προϊόντα afarer συμμορφώνονται με τους κανονισμούς REACH της ΕΕ για χημική ασφάλεια, διασφαλίζοντας ότι δεν υπάρχουν περιορισμένες ουσίες στο PVC, Hypalon ή εξαρτήματά μας.'
      icon: tabler:flask
    - title: 'Δοκιμή Υλικών'
      description: 'Τα υφάσματα ελέγχονται για αντοχή εφελκυσμού, αντοχή σε σχίσιμο, υποβάθμιση UV και απόδοση σε ψυχρή ρωγμή. Κάθε παρτίδα παραγωγής δειγματοληπτείται και επαληθεύεται.'
      icon: tabler:test-pipe
content_factory:
  tagline: Factory Standards
  title: 'Κατασκευαστική Αριστεία<br />—Κατασκευασμένο σύμφωνα με Προδιαγραφές'
  subtitle: 'Η εγκατάστασή μας 12.000 m² λειτουργεί υπό αυστηρά πρωτόκολλα ποιοτικού ελέγχου σε κάθε στάδιο παραγωγής.'
  list:
    - 'Επιθεώρηση Εισερχόμενων Υλικών: Όλες οι πρώτες ύλες —PVC ύφασμα, Hypalon, αλουμίνιο, κόντρα πλακέ, κόλλες —ελέγχονται έναντι προδιαγραφών πριν εισέλθουν στην παραγωγή.'
    - 'Ποιοτικός Έλεγχος Εν Διαδικασία: Κάθε στάδιο παραγωγής έχει τεκμηριωμένα σημεία ελέγχου QC. Η αντοχή συγκόλλησης, η ευθυγράμμιση ραφής, η εγκατάσταση βαλβίδας και η ροπή σύνδεσης επαληθεύονται στη γραμμή.'
    - 'Δοκιμή Πίεσης: Κάθε φουσκωτός θάλαμος δοκιμάζεται στο 1,5× της ονομαστικής πίεσης για 24 ώρες. Ο ρυθμός διαρροής πρέπει να είναι μηδενικός για επιτυχία.'
    - 'Τελική Επιθεώρηση: Τα ολοκληρωμένα προϊόντα ελέγχονται για διαστατική ακρίβεια, αισθητική εμφάνιση, πληρότητα αξεσουάρ και ακεραιότητα συσκευασίας πριν από την αποστολή.'
    - 'Ιχνηλασιμότητα Παρτίδας: Κάθε προϊόν φέρει σειριακό αριθμό συνδεδεμένο με αρχεία παρτίδας παραγωγής, επιτρέποντας πλήρη ιχνηλασιμότητα από την πρώτη ύλη έως το τελικό προϊόν.'
content_safety:
  tagline: Marine Safety Standards
  title: 'Ασφάλεια Πρώτα<br />—Σχεδιασμένο για Αξιόπιστη Λειτουργία'
  subtitle: 'Τα προϊόντα afarer σχεδιάζονται και δοκιμάζονται για να πληρούν διεθνή πρότυπα θαλάσσιας ασφάλειας για εμπορική και ψυχαγωγική χρήση.'
  items:
    - title: 'ISO 6185'
      description: 'Τα φουσκωτά σκάφη συμμορφώνονται με τα πρότυπα ISO 6185 για κατασκευή, σταθερότητα, πλευστότητα και χωρητικότητα φορτίου.'
      icon: tabler:sailboat
    - title: 'ABYC Standards'
      description: 'Τα ηλεκτρικά συστήματα και τα συστήματα καυσίμων ακολουθούν τα πρότυπα ABYC για ασφαλή εγκατάσταση και λειτουργία.'
      icon: tabler:bolt
    - title: 'Συμμόρφωση SOLAS'
      description: 'Ο εξοπλισμός ασφαλείας και τα σωστικά μέσα πληρούν τις απαιτήσεις SOLAS όπου ισχύουν.'
      icon: tabler:lifebuoy
cta:
  title: 'Χρειάζεστε πιστοποιημένα προϊόντα για το έργο σας;'
  subtitle: 'Επικοινωνήστε με την ομάδα μας για να συζητήσετε τις απαιτήσεις πιστοποίησης, τεκμηρίωσης και συμμόρφωσης για την αγορά σας.'
  actions:
    - variant: primary
      text: Request certification docs
      href: /contact
    - text: View our quality page

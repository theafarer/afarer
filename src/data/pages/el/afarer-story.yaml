hero:
  tagline: Η ιστορία μας
  title: afarer —Μηχανική της ελευθερίας στο νερό
  subtitle: 'Από ένα παράκτιο συνεργείο σε έναν παγκόσμιο κατασκευαστή θαλάσσιων σκαφών —το ταξίδι μας βασίζεται σε μια πεισματική πεποίθηση: τα σκάφη πρέπει να σχεδιάζονται με υπευθυνότητα, επειδή έχουν σημασία.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Εργοστάσιο afarer και εγκατάσταση θαλάσσιας κατασκευής στο Qingdao

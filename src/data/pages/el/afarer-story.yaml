timeline:
  - year: '2012'
    title: Θεμέλιο θαλάσσιας κατασκευής
    body: Η afarer ξεκίνησε ως ένα εξειδικευμένο συνεργείο φουσκωτών σκαφών στο Qingdao της Κίνας, αφοσιωμένο στη θαλάσσια χειροτεχνία και την κατασκευή φουσκωτών βαρκών. Η αρχική εστίαση ήταν στην κατασκευή αξιόπιστων φουσκωτών προϊόντων μέσω πρακτικής μηχανικής εμπειρίας και κατασκευαστικής πειθαρχίας.
  - year: '2015'
    title: Πρώτη εξαγωγή και πιστοποίηση CE
    body: Οι πρώτες παραγγελίες εξαγωγής έφτασαν στην Ιαπωνία και την Κορέα. Η πιστοποίηση CE επιτεύχθηκε για τις βασικές σειρές προϊόντων, σηματοδοτώντας την είσοδο της afarer στις διεθνείς αγορές. Η εταιρεία άρχισε να εξυπηρετεί εμπορικούς και ψυχαγωγικούς χρήστες πέρα από την Κίνα.
  - year: '2018'
    title: Επέκταση εργοστασίου
    body: Μετεγκατάσταση σε εγκατάσταση παραγωγής 12.000 m². Προστέθηκαν γραμμές συγκόλλησης RF και δυνατότητα παραγωγής drop-stitch, επιτρέποντας κατασκευή μεγαλύτερης κλίμακας και βελτιωμένα συστήματα ποιοτικού ελέγχου.
  - year: '2020'
    title: Ίδρυση κέντρου Έ&Α
    body: Άνοιξε ένα ειδικό κέντρο έρευνας και ανάπτυξης με εργαστήριο υφασμάτων PVC, δεξαμενή υδροδυναμικών δοκιμών και στούντιο προσομοίωσης CAD/FEA. Η ανάπτυξη προϊόντων επεκτάθηκε με έμφαση στην ελαφριά κατασκευή, βελτιωμένη ανθεκτικότητα και σχεδιασμό με επίκεντρο τον χρήστη.
  - year: '2022'
    title: Πιστοποίηση και παγκόσμια ανάπτυξη
    body: Επιτεύχθηκε πιστοποίηση ISO 9001. Η ομάδα επεκτάθηκε σε 14 μηχανικούς Έ&Α και 200+ εργαζόμενους. Τα προϊόντα έφτασαν σε πελάτες σε όλη την Ευρώπη, την Αμερική και την Ασία-Ειρηνικό μέσω διανομέων και συνεργασιών OEM.
  - year: '2024'
    title: Στούντιο καινοτομίας και σχεδιασμού
    body: Λειτουργία στούντιο σχεδιασμού και καινοτομίας πλήρους φάσματος για προσαρμοσμένα έργα ODM, από τη σύλληψη έως την παραγωγή. Ενίσχυση επαγγελματικών θαλάσσιων εφαρμογών, συμπεριλαμβανομένων διασωστικών, εμπορικών και κρατικών διαγωνισμών.
  - year: '2026'
    title: Χτίζοντας το μέλλον της εξερεύνησης των υδάτων
    body: Σήμερα, η afarer συνεχίζει να αναπτύσσει φουσκωτές βάρκες, συστήματα SUP και προσαρμοσμένες θαλάσσιες λύσεις —συνδέοντας ανθρώπους και οργανισμούς με τα νερά του κόσμου. Εξυπηρετούνται 50+ χώρες, ετήσια δυναμικότητα 15.000+ μονάδων.
content_founding:
  tagline: Η αρχή
  title: Γεννημένοι στο νερό
  subtitle: 'Η afarer ξεκίνησε σε ένα παράκτιο συνεργείο στο Qingdao με μία βάρκα και ένα όραμα: να κατασκευάζει φουσκωτά σκάφη ικανά να αντιμετωπίσουν πραγματικές θαλάσσιες συνθήκες.'
  paragraphs:
    - Το 2012, οι ιδρυτές μας είδαν ένα κενό στην αγορά —τα περισσότερα φουσκωτά σκάφη ήταν είτε προσιτά αλλά αναξιόπιστα, είτε υψηλής ποιότητας αλλά απαγορευτικά ακριβά. Πίστεψαν ότι υπήρχε χώρος για έναν κατασκευαστή που προσέφερε και ποιότητα και αξία.
    - Η πρώτη γάστρα κατασκευάστηκε στο χέρι, δοκιμάστηκε in τοπικά νερά και βελτιώθηκε βάσει πραγματικών σχολίων από ψαράδες και μικρούς εμπορικούς χειριστές. Αυτός ο κύκλος ανατροφοδότησης —χτίσε, δοκίμασε, άκου, βελτίωσε —παραμένει στον πυρήνα της μηχανικής φιλοσοφίας μας σήμερα.
    - Μέχρι το 2015, η φήμη είχε εξαπλωθεί πέρα από το Qingdao. Διεθνείς διανομείς άρχισαν να ζητούν δείγματα. Αυτό που ξεκίνησε ως τοπικό συνεργείο γινόταν ένας παγκόσμιος προμηθευτής.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Πρώιμο συνεργείο παραγωγής afarer και διαδικασία κατασκευής
content_growth:
  tagline: Ανάπτυξη και καινοτομία
  title: Από συνεργείο σε εγκατάσταση 12.000 m²
  subtitle: Η συνεχής επένδυση σε ανθρώπους, εξοπλισμό και διαδικασίες έχει μετατρέψει την afarer σε μια σύγχρονη εγκατάσταση θαλάσσιας κατασκευής.
  paragraphs:
    - Καθώς η ζήτηση μεγάλωνε, μεγάλωνε και η εγκατάστασή μας. Επεκταθήκαμε από ένα μικρό συνεργείο σε ένα εργοστάσιο 12.000 m² με αποκλειστικές γραμμές παραγωγής για σκάφη SUP, φουσκωτές βάρκες, σανίδες SUP και αξεσουάρ.
    - Επενδύσαμε σε μηχανές κοπής CNC, εξοπλισμό συγκόλλησης υψηλής συχνότητας, γραμμές παραγωγής drop-stitch και ολοκληρωμένες διατάξεις δοκιμών —επιτρέποντάς μας να ελέγχουμε κάθε πτυχή της ποιότητας παραγωγής.
    - Σήμερα, η ομάδα μας 200+ ατόμων περιλαμβάνει θαλάσσιους μηχανικούς, επιστήμονες υλικών, ειδικούς ποιοτικού ελέγχου και ειδικευμένους τεχνίτες —πολλοί από τους οποίους είναι στην afarer από τα πρώτα χρόνια.
philosophy:
  tagline: Φιλοσοφία μάρκας
  title: Μηχανική της ελευθερίας στο νερό
  body: Η ελευθερία στο νερό δεν αφορά μόνο την κίνηση. Αντιπροσωπεύει την ανακάλυψη νέων τόπων, τη δημιουργία εμπειριών στη φύση, τη σύνδεση των ανθρώπων με τη φύση και την υποστήριξη επαγγελματικών αποστολών. Η μηχανική καθιστά αυτή την ελευθερία εφικτή.
  pillars:
    - title: Αξιοπιστία πρώτα
      body: Τα υδάτινα περιβάλλοντα απαιτούν εμπιστοσύνη. Τα προϊόντα afarer σχεδιάζονται γύρω από τη σταθερότητα, την ανθεκτικότητα, την ασφάλεια και τη σταθερή απόδοση.
    - title: Ανθρωποκεντρικός σχεδιασμός
      body: Τα προϊόντα πρέπει να υπηρετούν τους ανθρώπους, όχι την τεχνολογία. Κάθε σχεδιαστική απόφαση ξεκινά με την κατανόηση του πώς οι άνθρωποι χρησιμοποιούν τα σκάφη, πού εξερευνούν και ποιες προκλήσεις αντιμετωπίζουν.
    - title: Προσβάσιμη εξερεύνηση
      body: Το νερό δεν ανήκει μόνο σε ειδικούς. Η afarer δημιουργεί εξοπλισμό που επιτρέπει σε περισσότερους ανθρώπους να βιώσουν με ασφάλεια ποτάμια, λίμνες, ωκεανούς και παράκτια περιβάλλοντα.
    - title: Συνεχής καινοτομία
      body: Η καινοτομία δεν είναι μόνο η δημιουργία νέων προϊόντων. Είναι η βελτίωση κάθε λεπτομέρειας —υλικών, δομών, κατασκευής και εμπειρίας χρήστη.
engineeringDna:
  tagline: Μηχανική DNA
  title: Πώς η afarer δημιουργεί προϊόντα
  areas:
    - title: Επιστήμη υλικών
      body: Η afarer εστιάζει στην επιλογή κατάλληλων υλικών για διαφορετικά θαλάσσια περιβάλλοντα. Οι βασικές παράμετροι περιλαμβάνουν αντοχή στην τριβή, αντοχή στην υπεριώδη ακτινοβολία, σταθερότητα πίεσης και μακροπρόθεσμη ανθεκτικότητα.
      items:
        - Αντοχή στην τριβή
        - Αντοχή στην υπεριώδη ακτινοβολία
        - Σταθερότητα πίεσης
        - Μακροπρόθεσμη ανθεκτικότητα
    - title: Δομική μηχανική
      body: Τα φουσκωτά σκάφη απαιτούν ακριβή ισορροπία μεταξύ ακαμψίας, βάρους, φορητότητας και σταθερότητας. Η μηχανική της afarer εστιάζει στη βελτιστοποίηση αυτών των παραγόντων μέσω της τεχνολογίας drop-stitch και προηγμένων μεθόδων κατασκευής ραφών.
      items:
        - Ακαμψία
        - Βελτιστοποίηση βάρους
        - Φορητότητα
        - Σταθερότητα
    - title: Ακρίβεια κατασκευής
      body: 'Κάθε προϊόν περνά από ελεγχόμενες διαδικασίες: προετοιμασία υλικού, κοπή ακριβείας, συγκόλληση και συγκόλληση, συναρμολόγηση, επιθεώρηση ποιότητας και επαλήθευση απόδοσης.'
      items:
        - Προετοιμασία υλικού
        - Κοπή ακριβείας
        - Συγκόλληση και συγκόλληση
        - Συναρμολόγηση και ποιοτικός έλεγχος
    - title: Μηχανική σεναρίων χρήσης
      body: Τα προϊόντα αναπτύσσονται γύρω από πραγματικές εφαρμογές —αναψυχή, περιπέτεια και επαγγελματική χρήση —διασφαλίζοντας ότι κάθε σχέδιο ανταποκρίνεται στις συγκεκριμένες απαιτήσεις του περιβάλλοντος στο οποίο προορίζεται.
      items:
        - Αναψυχή
        - Περιπέτεια
        - Επαγγελματική
        - Εμπορική
trustSignals:
  tagline: Σήματα εμπιστοσύνης
  title: Γιατί η afarer είναι αξιόπιστος συνεργάτης
  manufacturing:
    title: Κατασκευαστική ικανότητα
    body: Εγκατάσταση παραγωγής 12.000 m² με 200+ ειδικευμένους εργαζόμενους και 14+ μηχανικούς Έ&Α. Πιστοποιημένο σύστημα διαχείρισης ποιότητας ISO 9001. Ετήσια παραγωγή 15.000+ φουσκωτών σκαφών που εξυπηρετούν 50+ χώρες.
    stats:
      - label: Μέγεθος εγκατάστασης
        value: 12.000 m²
      - label: Εργατικό δυναμικό
        value: 200+
      - label: Μηχανικοί Έ&Α
        value: 14+
      - label: Ετήσια δυναμικότητα
        value: 15.000+
  quality:
    title: Δέσμευση ποιότητας
    body: Από την επιθεώρηση υλικών έως τις τελικές δοκιμές, η afarer διατηρεί συστηματικές διαδικασίες ποιότητας για την παράδοση αξιόπιστων θαλάσσιων προϊόντων. Κάθε μονάδα υποβάλλεται σε δοκιμή πίεσης, επιθεώρηση ραφής και επαλήθευση απόδοσης πριν από την αποστολή.
    items:
      - CE Certified —Όλα τα προϊόντα πληρούν τα ευρωπαϊκά πρότυπα ασφαλείας
      - ISO 9001:2015 —Πιστοποιημένο σύστημα διαχείρισης ποιότητας
      - UKCA Marked —Συμμόρφωση για την αγορά του Ηνωμένου Βασιλείου
      - FCC Compliant —Συμμόρφωση ηλεκτρονικών εξαρτημάτων για τις ΗΠΑ
  global:
    title: Παγκόσμια παρουσία
    body: Η afarer εξυπηρετεί πελάτες σε πολλαπλές παγκόσμιες αγορές, υποστηρίζοντας διανομείς, μάρκες εξωτερικού χώρου και επαγγελματίες θαλάσσιους χρήστες σε 50+ χώρες σε Ευρώπη, Ασία-Ειρηνικό, Αμερική, Μέση Ανατολή και Αφρική.
comparison:
  tagline: Τοποθέτηση μάρκας
  title: Η afarer στην αγορά
  position: Μάρκα θαλάσσιας αναψυχής με μηχανική εστίαση, που συνδυάζει τεχνογνωσία στην κατασκευή φουσκωτών σκαφών με δυνατότητα OEM/ODM, προσαρμοσμένες λύσεις και βαθιά κατασκευαστική εμπειρία.
  strengths:
    - Τεχνογνωσία μηχανικής φουσκωτών σκαφών
    - Πλήρης δυνατότητα κατασκευής OEM/ODM
    - Προσαρμοσμένη ανάπτυξη προϊόντων και σχεδιασμός
    - Εγκατάσταση παραγωγής 12.000 m² πιστοποιημένη ISO 9001
  bestFor:
    - Χρήστες υπαίθριας αναψυχής που αναζητούν αξιόπιστα φουσκωτά σκάφη
    - Θαλάσσιοι χειριστές που χρειάζονται εξοπλισμό εμπορικής ποιότητας
    - Συνεργάτες μάρκας που χρειάζονται κατασκευή OEM/ODM
    - Επαγγελματικές οργανώσεις διάσωσης και περιπολίας

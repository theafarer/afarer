meta:
  title: Πρόγραμμα Συνεργατών Διανομής SUP | {SITE}
  description: Γίνετε μέλος του παγκόσμιου δικτύου διανομής της afarer. Αποκλειστικές περιοχές, πλήρες χαρτοφυλάκιο προϊόντων, ανταγωνιστικές τιμές χονδρικής και εξειδικευμένη διαχείριση λογαριασμού.
hero:
  tagline: Διανομείς
  title: Συμμετάσχετε στον Παγκόσμιο<br />Δίκτυο Κατανομής μας
  subtitle: Αποκλειστικές περιοχές δραστηριότητας. Πλήρες χαρτοφυλάκιο προϊόντων. Υποστήριξη παγκόσμιας κλάσης. Η afarer εξάγει σε 50+ χώρες και αναζητούμε καθιερωμένους διανομείς θαλάσσιων σπορ και ναυτικού εξοπλισμού.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Παγκόσμιες δραστηριότητες διανομής και αποστολής της Afarer
benefits:
  title: Τι Λαμβάνουν οι Διανομείς
  subtitle: Όλα όσα χρειάζεστε για να επιτύχετε στην αγορά σας.
  items:
    - Αποκλειστικά δικαιώματα περιοχής
    - Πλήρης κατάλογος προϊόντων (SUP, αξεσουάρ, τμήματα)
    - Ανταγωνιστικές τιμές χονδρικής
    - Διαφημιστικό & εμπορικό υλικό (μεταφρασμένο)
    - Πρόγραμμα εκπαίδευσης (προϊόν, πωλήσεις, συντήρηση)
    - Υποστήριξη σε εκθέσεις
    - Πρόγραμμα δειγμάτων
    - Δυνατότητα drop-ship
    - Αποκλειστικός υπεύθυνος λογαριασμού διανομέων
    - Όροι πληρωμής 45-60 ημερών

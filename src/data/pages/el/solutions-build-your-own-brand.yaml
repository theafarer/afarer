meta:
  title: Κατασκευή SUP Ιδιωτικής Ετικέτας | {SITE}
  description: Δημιουργήστε τη δική σας μάρκα SUP με την afarer. Από την ιδέα στην αγορά — πλήρης υπηρεσία OEM/ODM που περιλαμβάνει σχεδιασμό, πρωτοτυποποίηση, παραγωγή και παγκόσμια εφοδιαστική.
hero:
  tagline: Χτίστε τη Δική σας Μάρκα
  title: Ξεκινήστε το Δικό σας<br />Brand SUP
  subtitle: Εσείς έχετε το όραμα. Εμείς έχουμε το εργοστάσιο, την τεχνογνωσία και την εφοδιαστική αλυσίδα. Μαζί θα χτίσουμε μια επωνυμία που ξεχωρίζει.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Εξατομικευμένη σανίδα SUP με επωνυμία στο νερό
process:
  title: Το Ταξίδι του Brand σας
  subtitle: Από την ιδέα στην αγορά σε 5 φάσεις.
  steps:
    - phase: Φάση 1
      title: Ιδέα
      period: Εβδομάδα 1-2
      items:
        - Έρευνα αγοράς & ανάλυση ανταγωνισμού
        - Καθορισμός στοχευόμενου πελάτη
        - Εργαστήριο τοποθέτησης επωνυμίας
        - Στρατηγική γραμμής προϊόντων
    - phase: Φάση 2
      title: Σχεδιασμός
      period: Εβδομάδες 3-6
      items:
        - Σχήμα σανίδας & σχεδίαση γραφικών
        - Σύμπαιξη χρωμάτων & επιλογή υλικού
        - Προδιαγραφές αξεσουάρ
        - Σχεδιασμός Σκευασμού και Ετικέτας
    - phase: Φάση 3
      title: Πρωτότυπο
      period: Εβδομάδες 7-10
      items:
        - Παραγωγή δειγμάτων
        - Δοκιμές ποιότητας (πίεση, άνωση, UV)
        - Προσαρμογές σχεδιασμού
        - Τελική έγκριση
    - phase: Φάση 4
      title: Παραγωγή
      period: Εβδομάδα 11-14
      items:
        - Μαζική κατασκευή
        - Έλεγχος ποιότητας (ανά μονάδα)
        - Εκφορά θαλασσίων / εκφορά αεροπορικών
        - Έγγραφα εκτελωνισμού
    - phase: Φάση 5
      title: Κυκλοφορία
      period: Εβδομάδα 15-16
      items:
        - Φωτογράφηση προϊόντων
        - Ροή προϊόντων ιστοσελίδας
        - Διαφημιστικό υλικό
        - Υποστήριξη κυκλοφορίας
packages:
  title: Πακέτα Εκκίνησης
  subtitle: Πακέτα για κάθε στάδιο ανάπτυξης της μάρκας.
  items:
    - name: Starter Brand
      tagline: 50-100 μονάδες · 2 μοντέλα σανίδων
      features:
        - Βασική εκτύπωση λογότυπου
        - Τυποποιημένη συσκευασία
        - Υποστήριξη μέσω email
    - name: Growing Brand
      tagline: 300-1,000 μονάδες · 3-5 μοντέλα σανίδων
      features:
        - Προσαρμοσμένο χρώμα + λογότυπο
        - Προσαρμοσμένη συσκευασία
        - Φωτογραφίες προϊόντων
        - Αποκλειστικός υπεύθυνος
    - name: Established Brand
      tagline: 1.000+ μονάδες · Πλήρης σειρά προϊόντων
      features:
        - Πλήρης εξατομίκευση
        - Προτεινόμενη σκευασία
        - Διαφημιστικό υλικό
        - Πρώτη προτεραιότητα παραγωγής

hero_text:
  tagline: Επικοινωνία
  title: ΕΠΙΚΟΙΝΩΝΗΣΤΕ ΜΑΖΙ ΜΑΣ
contact_form:
  id: form
  title: Στείλτε μήνυμα
  subtitle: Για προσφορά, τεχνικές ερωτήσεις ή συνεργασία —γράψτε μας. Απαντάμε εντός μίας εργάσιμης ημέρας.
  email_to: info@afarer.com
  submit_button: Αποστολή
  success_message: Ευχαριστούμε! Το μήνυμά σας ελήφθη. Θα απαντήσουμε εντός μίας εργάσιμης ημέρας.
  error_message: Παρουσιάστηκε σφάλμα κατά την αποστολή. Δοκιμάστε ξανά ή γράψτε απευθείας στο email.
  default_country_code: '+1'
  captcha:
    label: 'Antispam: λύστε την παρακάτω άσκηση'
  fields:
    - name: firstName
      label: Όνομα
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Επώνυμο
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Εταιρεία
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Διεύθυνση
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Ταχ. Κώδικας
      row: 4
      step: 2
    - name: country
      label: Χώρα
      row: 4
      step: 2
    - name: email
      label: Email
      row: 5
      step: 2
    - name: tel
      label: Τηλέφωνο
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Εκτιμώμενος όγκος παραγγελίας
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Χρειάζεστε προσαρμογή;
      row: 7
      step: 2
    - name: productInterest
      label: Κατηγορίες προϊόντων ενδιαφέροντος
      row: 8
      step: 2
    - name: subject
      label: Θέμα
      row: 9
      step: 3
    - name: message
      label: Μήνυμα
      row: 10
      type: textarea
      rows: 6
      step: 3
features2_other_ways:

  title: Οδηγός Διαστασιολόγησης Στόλου
  subtitle: Υπολογίστε το μέγεθος του στόλου και τα δυνητικά έσοδα για την επιχείρηση ενοικίασής σας.
  tiers:
    - label: Μικρό Περίπτερο
      boards: 15-20
      revenue: $XX,XXX/yr
    - label: Μεσαίου Μεγέθους Επιχείρηση
      boards: 30-50
      revenue: $XX,XXX/yr
    - label: Μεγάλη Επιχείρηση Ενοικίασης Παραλίας
      boards: 50-100
      revenue: $XXX,XXX/yr
cta:
  title: Έτοιμοι να αναπτύξετε την επιχείρηση ενοικίασής σας;
  subtitle: Λάβετε τιμές ενοικίασης ή συγκρίνετε μοντέλα σανίδων για την επιχείρησή σας.

meta:
  title: Λύσεις Στόλων Ενοικίασης SUP | {SITE}
  description: Σανίδες SUP υψηλής κυκλοφορίας σχεδιασμένες για καθημερινή ενοικίαση. PVC ανθεκτικό στην UV, ενισχυμένες ραφές, υλικά ταχείας ξήρανσης. Αναπτύξτε την επιχείρηση ενοικιάσεών σας με την afarer.
hero:
  tagline: Εταιρείες Ενοικίασης
  title: Κλιμακώστε την Επιχείρηση Ενοικίασής Σας<br />Με Σιγουριά
  subtitle: Σανίδες SUP υψηλής εναλλαγής, σχεδιασμένες για καθημερινή ενοικίαση, 365 ημέρες τον χρόνο. Τα έσοδά σας δεν σταματούν ποτέ.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Πολυσύχναστο περίπτερο ενοικίασης με σανίδες SUP έτοιμες για τους επισκέπτες
features:
  title: Σχεδιασμένα για τις Απαιτήσεις της Ενοικίασης
  subtitle: Κάθε πίνακας σχεδιάζεται για 500+ κύκλους ενοικίασης με ελάχιστη συντήρηση.
  items:
    - title: 500+ Κύκλοι Ενοικίασης
      description: Δοκιμασμένος για να αντέχει στην καθημερινή χρήση σε θαλασσινό νερό, ήλιο και άμμο.
      icon: tabler:shield-check
    - title: Υφάσμα Ανθεκτικό σε UV
      description: Χωρίς ξεθώριασμα ή φθορά μετά από 1 χρόνο αποθήκευσης σε εξωτερικό χώρο.
      icon: tabler:sun
    - title: Ενισχυμένες Ραφές
      description: 3x ισχυρότερη κατασκευή από τις τυπικές φουσκωτές σανίδες.
      icon: tabler:layers-intersect
    - title: Υλικά Ταχείας Ξήρανσης
      description: Σανίδες έτοιμες για την επόμενη ενοικίαση σε λιγότερο από 30 λεπτά.
      icon: tabler:droplet
    - title: Στοιβαζόμενη Αποθήκευση
      description: Σχεδιασμός εξοικονόμησης χώρου — αποθηκεύστε 40% περισσότερες σανίδες στον ίδιο χώρο.
      icon: tabler:stack
    - title: Μεγέθη με Χρωματική Κωδικοποίηση
      description: Το προσωπικό βρίσκει άμεσα τη σωστή σανίδα χάρη στη χρωματική κωδικοποίηση των μεγεθών.
      icon: tabler:color-swatch
stats:
  title: Μετρήσεις Λειτουργίας
  stats:
    - title: Εναλλαγή Σανίδων
      amount: < 5 λεπτά
    - title: Ετήσια Συντήρηση
      amount: ~15 λεπτά/σανίδα
    - title: Αποστολή Ανταλλακτικών
      amount: 48h
    - title: Ποσοστό Ελαττωμάτων
      amount: < 0.5%

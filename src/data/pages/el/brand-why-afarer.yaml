features3_reasons:
  tagline: Why Choose afarer
  title: 'Επτά Λόγοι για Συνεργασία Μαζί Μας'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'Διαθέτουμε και λειτουργούμε εργοστάσιο 12.000 m². Όταν συνεργάζεστε με την afarer, εργάζεστε απευθείας με τους ανθρώπους που σχεδιάζουν, μηχανεύονται και κατασκευάζουν τα προϊόντα σας —χωρίς μεσάζοντες.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Η διαδικασία σχεδιασμού μας ξεκινά με την περίπτωση χρήσης, όχι με την κατηγορία προϊόντος. Βελτιστοποιούμε το σχήμα κύτους, την επιλογή υλικών και τη διαμόρφωση για το πώς θα χρησιμοποιηθεί πραγματικά το σκάφος.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'Πιστοποιημένο CE, σύστημα ποιότητας ISO, συμμόρφωση BSCI, συμμόρφωση REACH, εγκεκριμένο USCG. Κάθε προϊόν πληροί διεθνή πρότυπα —όχι απλώς ισχυρισμοί.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Χρώματα σωλήνων, διάταξη κονσόλας, επωνυμία, συσκευασία —προσαρμόζουμε σύμφωνα με τις προδιαγραφές σας. Καμία πίεση ελάχιστης παραγγελίας. Ξεκινήστε με ένα πρωτότυπο, κλιμακώστε με σιγουριά.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'Αποθήκη ΗΠΑ στην Καλιφόρνια, απευθείας αποστολή από Qingdao, αεροπορική μεταφορά για επείγουσες παραγγελίες. Χειριζόμαστε τελωνειακά έγγραφα και τεκμηρίωση.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'Υποστηρίζουμε σκάφη που κατασκευάσαμε πριν από 20 χρόνια. Γνήσια ανταλλακτικά, τεχνικές συμβουλές, καθοδήγηση επισκευής —η ομάδα μας είναι διαθέσιμη όταν μας χρειάζεστε.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Πραγματικές ονομαστικές τιμές φορτίου, πραγματικές διαστάσεις, πραγματικό βάρος. Καμία πληθωριστική προώθηση. Αυτό που δημοσιεύουμε είναι αυτό που λαμβάνετε —επαληθευμένο από ανεξάρτητες δοκιμές.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Trusted by Brands Worldwide
  title: What Our Partners Say
  items:
    - content: 'Έχουμε συνεργαστεί με πολλούς κατασκευαστές στην Κίνα, αλλά η afarer ξεχωρίζει για την τεχνική υποστήριξη και τη σταθερή ποιότητα. Αντιμετωπίζουν την επωνυμία μας σαν δική τους.'
      name: '—OEM Partner, European Water Sports Brand'
    - content: 'Τα Hypalon SUP τους είναι σε υπηρεσία με τον στόλο μας για πάνω από 5 χρόνια. Ελάχιστη συντήρηση, εξαιρετική αντοχή UV. Η 5ετής εγγύηση στους σωλήνες μας δίνει εμπιστοσύνη.'
      name: '—Fleet Operator, Middle East Resort Group'
    - content: 'Η ομάδα afarer μας βοήθησε να αναπτύξουμε ένα προσαρμοσμένο σχέδιο σανίδας SUP από την ιδέα έως την παραγωγή σε 90 ημέρες. Η ποιότητα ξεπέρασε τις προσδοκίες μας.'
      name: '—Distributor, Australian Watersports'

services:
  - title: Σχεδιασμός Προϊόντος & Μηχανική
    description: Η εσωτερική ομάδα Έρευνας & Ανάπτυξης συνεργάζεται με την ιδέα ή τις προδιαγραφές σας για την ανάπτυξη σχεδίων CAD, τρισδιάστατων μοντέλων και πρωτοτύπων. Προσφέρουμε σχεδιασμό καλουπιών, βελτιστοποίηση σχήματος γάστρας και καθοδήγηση στην επιλογή υλικών.
  - title: Προσαρμοσμένο Branding & Γραφικά
    description: Επιλογές ψηφιακής εκτύπωσης πλήρους χρώματος, μεταξοτυπίας, ανάγλυφης εκτύπωσης και ετικετών. Αναπτύσσουμε γραφικά καταστρώματος ανά επωνυμία, σήμανση πλευρικών σωληνωτών και συσκευασίες έτοιμες για λιανική πώληση.
  - title: Εξατομίκευση Υλικών & Προδιαγραφών
    description: Επιλέξτε μεταξύ κατασκευών PVC (στάνταρ, οικολογικού, επιβραδυντικού φλόγας), Hypalon/CSM, drop-stitch και υβριδικών κατασκευών. Προσαρμοσμένα χρώματα σωλήνων, βάρη υφασμάτων και επιλογές ενίσχυσης.
  - title: Σκευασία & Λογιστική
    description: Προσαρμοσμένη συσκευασία λιανικής, κουτιά ιδιωτικής επωνυμίας, συσκευασία σε κενό αέρος, παλετοποίηση και φόρτωση εμπορευματοκιβωτίων. Διαθέσιμοι όροι αποστολής FOB Qingdao, CIF ή DDP.
moq_table:
  - product: Πνεύσιμες Πλωτές Πλεύσεις SUP
    standard_moq: 5–10 μονάδες

    lead_time: 30–45 ημέρες
  - product: Σωσίβια & Ασφάλεια
    standard_moq: 100–200 μονάδες
    custom_moq: 1,000+ μονάδες
    lead_time: 20–30 ημέρες
why_us:
  - title: Κάθετη Ολοκλήρωση
    description: Κατέχουμε το εργοστάσιό μας, τα καλούπια μας και την εφοδιαστική μας αλυσίδα — χωρίς μεσάζοντες, χωρίς υπεργολάβους. Αυτό μας δίνει τον έλεγχο της ποιότητας, του κόστους και της παράδοσης.
  - title: Διπλή Πιστοποίηση
    description: Σύστημα διαχείρισης ποιότητας ISO 9001 και πιστοποίηση κοινωνικής συμμόρφωσης BSCI. Εκθέσεις ελέγχου εργοστασίου διαθέσιμες κατόπιν αιτήματος.
  - title: Συμμόρφωση CE
    description: Όλα τα τυποποιημένα μοντέλα φέρουν πιστοποίηση CE 2013/53/EU. Τα προσαρμοσμένα μοντέλα μπορούν να πιστοποιηθούν κατά CE μέσω της καθιερωμένης διαδικασίας μας.
  - title: Χαμηλό MOQ
    description: Ξεκινήστε με μόλις 5 μονάδες για τα τυπικά μοντέλα. Βοηθάμε τις αναδυόμενες μάρκες να ξεκινήσουν χωρίς υπερβολική δέσμευση αποθέματος.

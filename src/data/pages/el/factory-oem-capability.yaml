hero:
  tagline: Κατασκευή OEM/ODM
  title: Κατασκευή OEM & Ιδιωτικής Ετικέτας
  subtitle: From concept to container — customize every detail of your inflatable watercraft line
intro: >-
  το afarer προσφέρει ολοκληρωμένες υπηρεσίες OEM και ODM για μάρκες, διανομείς και κυβερνητικούς φορείς ανά τον κόσμο. Με 10+ χρόνια εξαγωγικής εμπειρίας και εργοστάσιο 12.000 m² πιστοποιημένο ISO 9001 & BSCI, διαχειριζόμαστε τα πάντα από τον σχεδιασμό προϊόντων και την ανάπτυξη μοτίου έως την
  πλήρη παραγωγή, τη σκευασία και τη λογιστική.

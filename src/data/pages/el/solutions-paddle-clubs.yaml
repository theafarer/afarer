meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Μέλη λεσχών κωπηλασίας σε αντίστοιχες σανίδες SUP Afarer
benefits:
  title: Πλεονεκτήματα Στόλου Κλαμπ
  subtitle: Γιατί σύλλογοι SUP σε περισσότερες από 50 χώρες επιλέγουν την Afarer ως συνεργάτη εξοπλισμού τους.
  items:
    - metric: 40%+
      label: Εξοικονόμηση Κόστους Στόλου
      detail: Σε σύγκριση με τις τιμές λιανικής, με εκπτώσεις χονδρικής για λέσχες
    - metric: 48h
      label: Αντικατάσταση Ανταλλακτικών
      detail: Ελάχιστος χρόνος εκτός λειτουργίας για τον στόλο ενοικίασής σας
    - metric: 500+
      label: Κύκλοι Ενοικίασης
      detail: Ανθεκτικότητα επαγγελματικής κλάσης ανά σανίδα
    - metric: 5+ Χρόνια
      label: Διάρκεια Ζωής Στόλου
      detail: Με σωστή συντήρηση και φροντίδα
packages:
  title: Προγράμματα Στόλων Συλλόγων
  subtitle: Επιλέξτε το πρόγραμμα στόλου που ταιριάζει με το μέγεθος και την ανύψωση του συλλόγου σας.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Οδηγός λανσαρίσματος + λίστα ελέγχου ασφάλειας
        - Οδηγός λανσαρίσματος + λίστα ελέγχου ασφάλειας
        - Πιστοποιημένο CE — όλος ο εξοπλισμός
      cta_text: Ξεκινήστε τη Λέσχη σας
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Πρόγραμμα ανταλλακτικών (15% έκπτωση)
        - Staff training session
        - Συνεδρία εκπαίδευσης προσωπικού (διαδικτυακά)
        - Πιστοποιημένο CE — όλος ο εξοπλισμός
      popular: true
      cta_text: Δημιουργήστε τον Στόλο σας
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50+ αγωνιστικές σανίδες / σανίδες επιδόσεων
        - Full accessory set
        - Event support kit
        - Ανταλλακτικά κατά προτεραιότητα (αποστολή εντός 24h)
        - Αποκλειστικός διαχειριστής λογαριασμού
        - Επιλογή προσαρμοσμένων εμφανίσεων ομάδας
        - Πιστοποιημένο CE — όλος ο εξοπλισμός
      cta_text: Λάβετε Στόλο Διαγωνισμού
training:
  title: Πακέτα Εκπαιδευτικών Κέντρων
  subtitle: Όλα όνα χρειάζεται ένα σχολείο SUP για τη διεξαγωγή επαγγελματικών μαθημάτων πιστοποίησης.
  items:
    - name: Instructor Starter
      features:
        - 5 premium σανίδες SUP (ποιότητας εκπαιδευτή)
        - 5 κουπιά ανθρακονημάτων για δοκιμές
        - 5 σωσίβια (μεγέθη εκπαιδευτή)
        - Οδηγός προγράμματος εκπαίδευσης
        - Εξοπλισμός πιστοποιημένος κατά CE
    - name: School Full Set
      features:
        - 20 σανίδες SUP (συνδυασμός μαθητών + εκπαιδευτών)
        - 20 κουπιά + 20 σωσίβια (σε διάφορα μεγέθη)
        - 10 βοηθήματα πλευστότητας για αρχάριους
        - 4 τρόμπες + κιτ επισκευής
        - Πρόγραμμα εκπαίδευσης & υποστήριξης πιστοποίησης
        - Εξοπλισμός πιστοποιημένος κατά CE
features:
  title: Γιατί οι Σύλλογοι Επιλέγουν την Afarer
  subtitle: Συνεπής ποιότητα, γρήγορα τμήματα και μαζική τιμολόγηση κατασκευασμένα για αναπτυσσόμενους συλλόγους.
  items:
    - title: 500+ Κύκλοι Ενοικίασης
      description: Οι σανίδες επαγγελματικής κατηγορίας αντέχουν ολόκληρες σεζόν καθημερινής χρήσης.
      icon: tabler:shield-check
    - title: Προσαρμοσμένα Χρώματα
      description: Προσαρμόστε την ταυτότητα της λέσχης σας με εξατομικευμένα χρώματα και λογότυπο στη σανίδα.
      icon: tabler:palette
    - title: Χονδρική Τιμολόγηση
      description: Εκπτώσεις όγκου για παραγγελίες στόλου από 10+ σανίδες.
      icon: tabler:discount
    - title: Ταχεία Ανταλλακτικά
      description: Τα ανταλλακτικά αποστέλλονται εντός 48 ωρών.
      icon: tabler:truck-delivery
    - title: Υποστήριξη Ανάπτυξης Λέσχης
      description: Συμβουλές για προγράμματα εγγραφής, τιμολόγηση και φιλοξενία επεισοδίων.
      icon: tabler:trending-up
    - title: CE Πιστοποιημένο
      description: Όλος ο εξοπλισμός πληροί τα διεθνή πρότυπα ασφαλείας.
      icon: tabler:certificate
cta:
  title: Έτοιμος να χτίσετε τον σύλλογο πλευσιμού σας;
  subtitle: Λάβετε προσφορά για τον στόλο του κλαμπ σας ή κατεβάστε τον εισαγωγικό οδηγό για κλαμπ.
  actions:
    - text: Υποβάλετε αίτηση για Club Fleet
      href: /contact?package=club
      variant: primary
    - text: Λήψη Οδηγού Λέσχης
      href: /resources/download-catalog
      variant: secondary

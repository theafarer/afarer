intro: >-
  Όσο λεπτομερές κι αν είναι ένα μοντέλο CAD, δεν μπορεί να αποκαλύψει πώς θα συμπεριφερθεί πραγματικά ένα σκάφος μέχρι να έρθει σε επαφή με το νερό. Γι' αυτό το Εργαστήριο Πρωτοτύπων μας έχει σχεδιαστεί για να μετατρέπει τα μηχανικά δεδομένα σε ένα φυσικό, θαλάσσιο σκάφος όσο το δυνατόν γρηγορότερα
  και ακριβέστερα. Κάθε νέο μοντέλο {SITE.name} — και κάθε σημαντική προσαρμοσμένη κατασκευή — περνά από αυτό το εργαστήριο πριν δεσμευτεί ο εξοπλισμός παραγωγής.
content_html: >
  <h2>Εκεί όπου ο σχεδιασμός γίνεται πραγματικότητα</h2>

  <p>Το εργαστήριο είναι πλήρως εξοπλισμένο για την παράλληλη κατασκευή γάστρας, σωληνωτών και εξαρτισμού. Αυτή η προσέγγιση παράλληλης ροής εργασίας μειώνει τον χρόνο ανάπτυξης πρωτοτύπου σε 8-12 εβδομάδες από την έκδοση των μηχανικών μελετών, σε σύγκριση με τον κανόνα του κλάδου των 16-20
  εβδομάδων. Όταν η εφαρμογή σας απαιτεί εξειδικευμένη λύση, μπορούμε να περάσουμε από την ιδέα στην επικύρωση στο νερό σε λιγότερο από τρεις μήνες.</p>


  <h2>Δυνατότητες εργαστηρίου</h2>

  <table>
    <thead><tr><th>Σταθμός εργασίας</th><th>Εξοπλισμός</th><th>Σκοπός</th></tr></thead>
    <tbody>
      <tr><td>Κατασκευή γάστρας</td><td>Φούρνος περιστροφικής χύτευσης (HDPE), σταθμός συγκόλλησης TIG (αλουμίνιο), καλούπια χειροκίνητης επίστρωσης (υαλοβάμβακας)</td><td>Παραγωγή γάστρας πλήρους κλίμακας και στους τρεις τύπους υλικών</td></tr>
      <tr><td>Συναρμολόγηση σωληνωτών</td><td>Πρέσα συγκόλλησης RF, σταθμός συγκόλλησης θερμού αέρα, εξάρτημα δοκιμής φουσκώματος</td><td>Κατασκευή σωληνωτών στοιχείων πλήρους μεγέθους με όλα τα διαφράγματα, τους κώνους και τις βαλβίδες</td></tr>
      <tr><td>Εξαρτισμός &amp; τοποθέτηση</td><td>Γερανός κινητήρα (500 kg), πλαίσιο προσομοίωσης κονσόλας, υδραυλική πρέσα σωληνώσεων, πίνακας ηλεκτρικών καλωδιώσεων</td><td>Πλήρης εξοπλισμός: κινητήρας, πηδαλιούχηση, χειριστήρια, σύστημα καυσίμου, ηλεκτρονικά, καθίσματα</td></tr>
      <tr><td>Σταθμός οργάνων μέτρησης</td><td>Αισθητήρας ταχύτητας GPS, μετρητής ροής καυσίμου, επιταχυνσιόμετρα, διάταξη θερμοστοιχείων, καταγραφέας δεδομένων</td><td>Εγκατάσταση και βαθμονόμηση οργάνων θαλάσσιων δοκιμών</td></tr>
    </tbody>
  </table>


  <h2>Το ταξίδι του πρωτοτύπου — βήμα βήμα</h2>

  <ol>
    <li><strong>Παράδοση μηχανικών μελετών</strong> — Το πακέτο σχεδιασμού (τρισδιάστατο μοντέλο, έκθεση FEA, λίστα υλικών, χρονοδιάγραμμα στρώσεων) εξετάζεται επίσημα από τον υπεύθυνο του εργαστηρίου και τον μηχανικό έργου. Τυχόν κατασκευαστικά ζητήματα επισημαίνονται και επιλύονται πριν ξεκινήσει η κοπή.</li>
    <li><strong>Παραγωγή γάστρας</strong> — Η γάστρα κατασκευάζεται σύμφωνα με τις μηχανικές προδιαγραφές. Για HDPE: το πρόγραμμα περιστροφικής χύτευσης φορτώνεται από την προσομοίωση Moldex3D. Για αλουμίνιο: οι πλάκες που κόβονται με CNC συγκολλούνται στον σταθμό TIG βάσει του εγκεκριμένου χάρτη συγκόλλησης. Για υαλοβάμβακα: το βιβλίο στρώσεων ακολουθείται στρώση προς στρώση.</li>
    <li><strong>Κατασκευή σωληνωτών</strong> — Το ύφασμα κόβεται με πρότυπα σχεδίων CNC και στη συνέχεια συγκολλάται με RF σε θαλάμους πλήρους μεγέθους. Κάθε θάλαμος φουσκώνεται στη δοκιμαστική πίεση και παραμένει για 24 ώρες για αρχική σταθεροποίηση.</li>
    <li><strong>Συναρμολόγηση &amp; εξαρτισμός</strong> — Η γάστρα και τα σωληνωτά στοιχεία εφαρμόζονται μεταξύ τους. Ο κινητήρας αναρτάται, η πηδαλιούχηση και τα χειριστήρια συνδέονται, το σύστημα καυσίμου εγκαθίσταται και όλα τα ηλεκτρικά κυκλώματα καλωδιώνονται και επαληθεύονται.</li>
    <li><strong>Στατικές δοκιμές</strong> — Πριν το σκάφος αγγίξει το νερό, υποβάλλεται σε: έλεγχο πλευστότητας (πλήρες φορτίο + 30 % απόθεμα), δοκιμή πίεσης συστήματος καυσίμου, δοκιμή πλήρους κύκλου συστήματος πηδαλιούχησης, δοκιμή συνέχειας ηλεκτρικής γείωσης.</li>
    <li><strong>Πρόγραμμα θαλάσσιων δοκιμών</strong> — 20 ώρες δοκιμών στο νερό, αναλυτικά παρακάτω.</li>
    <li><strong>Αξιολόγηση πρωτοτύπου</strong> — Πραγματοποιείται επίσημη συνάντηση έγκρισης με τις ομάδες μηχανικής, παραγωγής και ποιότητας. Τυχόν απαραίτητες σχεδιαστικές αλλαγές τεκμηριώνονται και ενσωματώνονται στην έκδοση παραγωγής.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Πρόγραμμα Θαλάσσιων Δοκιμών 20 Ωρών — Πρόγραμμα Δοκιμών</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Χειρισμοί στο λιμάνι — χειρισμός σε χαμηλή ταχύτητα, όπισθεν, έλεγχος προστατευτικών</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Δοκιμή ταχύτητας — μέγιστη ταχύτητα επαληθευμένη με GPS, ταχύτητα πλεύσης, κατανάλωση καυσίμου σε 3 σημεία RPM</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Δοκιμή στροφής — τακτική διάμετρος, προχώρηση και εκτόπιση σε 20 kn, αριστερά και δεξιά</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Δοκιμή πρόσκρουσης — επαναλαμβανόμενες διελεύσεις από κύμα 0.5–1.0 m· επιταχυνσιόμετρο στη βάση του καθίσματος του τιμονιού</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Δοκιμή ευστάθειας — στατική γωνία κλίσης με 4 άτομα πληρώματος + εξοπλισμό δεξιά, έκκεντρο φορτίο</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Δοκιμή αντοχής — 3 ώρες συνεχούς πλεύσης στην ταχύτητα πλεύσης· παρακολούθηση θερμοκρασίας (κινητήρας, καύσιμο, ηλεκτρικά)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Τελική επιθεώρηση — επιθεώρηση όλων των συστημάτων μετά τη δοκιμή, σύσφιξη/έλεγχος όλων των συνδετήρων, καταγραφή ευρημάτων</span>
      </div>
    </div>
  </div>


  <h2>Προσαρμοσμένη δημιουργία πρωτοτύπων για ιδιαίτερες εφαρμογές</h2>

  <p>Το Εργαστήριο Πρωτοτύπων είναι το σημείο όπου επιλύουμε προβλήματα που τα τυποποιημένα σκάφη παραγωγής δεν μπορούν να αντιμετωπίσουν. Πρόσφατα παραδείγματα περιλαμβάνουν:</p>

  <ul>
    <li>Ένα RIB 7.8 m για οργανισμό έρευνας και διάσωσης, που απαιτούσε προσαρμοσμένη κατασκευή καμπίνας με προστασία από ανατροπή, ενσωματωμένες βάσεις φορείου και πλωριαία θήκη σόναρ — όλα πρωτοτυποποιημένα, τοποθετημένα και δοκιμασμένα στις εγκαταστάσεις μας.</li>
    <li>Ένα φουσκωτό 5.2 m για εργολάβο υδρογραφικών ερευνών, με χαμηλωμένη τραβέρσα, αφαιρούμενο ιστό οργάνων και θήκες μορφοτροπέων διαμπερούς γάστρας, σχεδιασμένες ώστε να ελαχιστοποιούν τις υδροδυναμικές διαταραχές.</li>
    <li>Ένα ηλεκτροκίνητο βοηθητικό σκάφος 4.5 m για superyacht, όπου το πρωτότυπο χρησιμοποιήθηκε για την επικύρωση της αυτονομίας, της υποδομής φόρτισης και των επιπέδων θορύβου πριν ο πελάτης δεσμευτεί για στόλο τεσσάρων σκαφών.</li>
  </ul>


  <h2>Η ομάδα πρωτοτύπων μας</h2>

  <p>Το εργαστήριο στελεχώνεται από οκτώ πολυειδείς θαλάσσιους τεχνικούς, ο καθένας εκπαιδευμένος σε τουλάχιστον δύο από τους τρεις βασικούς τομείς (γάστρα, σωληνωτά, εξαρτισμός). Ο επικεφαλής της ομάδας είναι έμπειρος ναυπηγός με 16 χρόνια εμπειρίας, από μεμονωμένες προσαρμοσμένες κατασκευές έως
  σειρές παραγωγής. Κάθε πρωτότυπο ανατίθεται σε αποκλειστικό μηχανικό έργου, ο οποίος αποτελεί το μοναδικό σημείο επικοινωνίας για τον πελάτη σε όλη τη διαδικασία κατασκευής και δοκιμών.</p>


  <h2>Συμμετοχή του πελάτη</h2>

  <p>Ενθαρρύνουμε ενεργά τους πελάτες μας να παραστούν στα βασικά ορόσημα κατά την κατασκευή του πρωτοτύπου — ιδιαίτερα στην αρχική ανασκόπηση του εξοπλισμού και στη θαλάσσια δοκιμή. Τα λειτουργικά σας σχόλια σε αυτά τα στάδια είναι ανεκτίμητα για τη βελτιστοποίηση του σκάφους πριν εισέλθει στην
  παραγωγή. Δεν κατασκευάζουμε εν κενώ· κατασκευάζουμε σε συνεργασία μαζί σας.</p>

  <p>Η θαλάσσια δοκιμή των 20 ωρών αποτελεί επίσης ευκαιρία για την ομάδα σας να εξοικειωθεί με τον χειρισμό του σκάφους, τη διάταξη των συστημάτων και τις απαιτήσεις συντήρησης, διασφαλίζοντας την ομαλή μετάβαση σε λειτουργία όταν παραδοθούν τα σκάφη παραγωγής.</p>

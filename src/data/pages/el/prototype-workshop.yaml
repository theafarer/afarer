intro: >-
  Όσο λεπτομερές κι αν είναι ένα μοντέλο CAD, δεν μπορεί να αποκαλύψει πώς θα συμπεριφερθεί πραγματικά μια σανίδα μέχρι να έρθει σε επαφή με το νερό. Γι' αυτό το Εργαστήριο Πρωτοτύπων μας έχει σχεδιαστεί για να μετατρέπει τα μηχανικά δεδομένα σε μια φυσική, έτοιμη για νερό σανίδα όσο το δυνατόν
  γρηγορότερα και ακριβέστερα. Κάθε νέο μοντέλο Afarer — και κάθε σημαντική προσαρμοσμένη κατασκευή — περνά από αυτό το εργαστήριο πριν δεσμευτεί ο εξοπλισμός παραγωγής.
content_html: >
  <h2>Εκεί όπου ο σχεδιασμός γίνεται πραγματικότητα</h2>

  <p>Το εργαστήριο είναι πλήρως εξοπλισμένο για ταυτόχρονη κατασκευή κύτους, rails και εξαρτυσίας. Αυτή η προσέγγιση παράλληλης ροής εργασίας μειώνει τον χρόνο παράδοσης πρωτοτύπου σε 8-12 εβδομάδες από την έκδοση των μηχανικών μελετών, σε σύγκριση με τον κανόνα του κλάδου των 16-20
  εβδομάδων. Όταν η εφαρμογή σας απαιτεί εξειδικευμένη λύση, μπορούμε να περάσουμε από την ιδέα στην επικύρωση στο νερό σε λιγότερο από τρεις μήνες.</p>


  <h2>Δυνατότητες εργαστηρίου</h2>

  <table>
    <thead><tr><th>Σταθμός εργασίας</th><th>Εξοπλισμός</th><th>Σκοπός</th></tr></thead>
    <tbody>
      <tr><td>Κατασκευή κύτους</td><td>Μηχανή κοπής υφάσματος CNC, πρέσα θερμικής πλακόστρωσης, σταθμός προετοιμασίας πυρήνων drop-stitch</td><td>Παραγωγή κύτους πλήρους κλίμακας και στους τρεις τύπους κατασκευής</td></tr>
      <tr><td>Συναρμολόγηση rails &amp; θαλάμων</td><td>Πρέσα συγκόλλησης RF, σταθμός προκόλλησης θερμού αέρα, εξάρτημα δοκιμής φουσκώματος</td><td>Κατασκευή συγκροτημάτων rails και θαλάμων πλήρους μεγέθους με όλα τα διαφράγματα και τις βαλβίδες</td></tr>
      <tr><td>Εξάρτυση &amp; τοποθέτηση</td><td>Εξάρτημα φρεζαρίσματος θήκης πτερυγίων, στηρίγματα συγκόλλησης βάσεων φορτίου και λαβών, σταθμός κοπής πατακιών καταστρώματος</td><td>Πλήρης εξοπλισμός: πτερύγια, βάσεις φορτίου, βύσματα λουριού, λαβές, πατάκια καταστρώματος, βαλβίδες</td></tr>
      <tr><td>Σταθμός οργάνων μέτρησης</td><td>Αισθητήρας ταχύτητας GPS, μετατροπείς πίεσης, επιταχυνσιόμετρα, διάταξη θερμοστοιχείων, καταγραφέας δεδομένων</td><td>Εγκατάσταση και βαθμονόμηση οργάνων θαλάσσιων δοκιμών</td></tr>
    </tbody>
  </table>


  <h2>Το ταξίδι του πρωτοτύπου — βήμα βήμα</h2>

  <ol>
    <li><strong>Παράδοση μηχανικών μελετών</strong> — Το πακέτο σχεδιασμού (τρισδιάστατο μοντέλο, έκθεση FEA, λίστα υλικών, χρονοδιάγραμμα στρώσεων) εξετάζεται επίσημα από τον υπεύθυνο του εργαστηρίου και τον μηχανικό έργου. Τυχόν κατασκευαστικά ζητήματα επισημαίνονται και επιλύονται πριν ξεκινήσει η κοπή.</li>
    <li><strong>Παραγωγή κύτους</strong> — Το κύτος κατασκευάζεται σύμφωνα με τη μηχανική προδιαγραφή. Για κατασκευή μονής στρώσης: ο πυρήνας drop-stitch πλακοστρώνονται με το καθορισμένο εξωτερικό PVC. Για κατασκευή διπλής στρώσης: η επιπλέον στρώση εφαρμόζεται πάνω στο βασικό laminate πριν κοπεί το πρότυπο. Για συγχωνευμένη κατασκευή (fused): οι παράμετροι πλακόστρωσης φορτώνονται από το εγκεκριμένο φύλλο διαδικασίας και επαληθεύονται σε δοκιμαστικό δείγμα πρώτης κοπής.</li>
    <li><strong>Κατασκευή rails</strong> — Το ύφασμα κόβεται με πρότυπα σχεδίων CNC και στη συνέχεια συγκολλάται με RF σε rails και θαλάμους πλήρους μεγέθους. Κάθε θάλαμος φουσκώνεται στη δοκιμαστική πίεση και παραμένει για 24 ώρες για αρχική σταθεροποίηση.</li>
    <li><strong>Συναρμολόγηση &amp; εξάρτυση</strong> — Το κύτος και τα rails ενώνονται. Οι θήκες πτερυγίων και οι βάσεις φορτίου τοποθετούνται, τα βύσματα λουριού και οι λαβές μεταφοράς εγκαθίστανται, η βαλβίδα φουσκώματος σφίγγεται με συγκεκριμένη ροπή και το πατάκι καταστρώματος εφαρμόζεται και ευθυγραμμίζεται.</li>
    <li><strong>Στατικές δοκιμές</strong> — Πριν η σανίδα αγγίξει το νερό, υποβάλλεται σε: έλεγχο πλευστότητας (πλήρες φορτίο + 30 % απόθεμα), δοκιμή διατήρησης πίεσης θαλάμου, δοκιμή διαρροής βαλβίδας, δοκιμή έλξης λαβών και βάσεων.</li>
    <li><strong>Πρόγραμμα θαλάσσιων δοκιμών</strong> — 20 ώρες δοκιμών στο νερό, αναλυτικά παρακάτω.</li>
    <li><strong>Αξιολόγηση πρωτοτύπου</strong> — Πραγματοποιείται επίσημη συνάντηση έγκρισης με τις ομάδες μηχανικής, παραγωγής και ποιότητας. Τυχόν απαραίτητες σχεδιαστικές αλλαγές τεκμηριώνονται και ενσωματώνονται στην έκδοση παραγωγής.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Πρόγραμμα Θαλάσσιων Δοκιμών 20 Ωρών — Πρόγραμμα Δοκιμών</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Εξοικείωση σε ήρεμα νερά — ευθυγράμμιση σε χαμηλή ταχύτητα, στροφές, έλεγχος στάσης και trim</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Δοκιμή ταχύτητας — μέγιστη ταχύτητα επαληθευμένη με GPS, ταχύτητα πλεύσης, διατηρημένος ρυθμός σε 3 ρυθμούς κουπιού</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Δοκιμή στροφής — ακτίνα στροφής άξονα και σάρωσης, απόκριση σανίδας, αριστερά και δεξιά</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Δοκιμή τρικυμίας — επαναλαμβανόμενες διελεύσεις από τρικυμία 0.5–1.0 m· επιταχυνσιόμετρο στη θέση στάσης του αναβάτη</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Δοκιμή ευστάθειας — στατική γωνία κλίσης με 4 αναβάτες διαφορετικού βάρους, έκκεντρο φορτίο προς τα δεξιά</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Δοκιμή αντοχής — 3 ώρες συνεχούς πλεύσης σε ταχύτητα πλεύσης· παρακολούθηση πίεσης θαλάμου, θερμοκρασίας rails και κόπωσης αναβάτη</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Τελική επιθεώρηση — επιθεώρηση όλων των εξαρτημάτων μετά τη δοκιμή, σύσφιξη/έλεγχος όλων των συνδετήρων, καταγραφή ευρημάτων</span>
      </div>
    </div>
  </div>


  <h2>Προσαρμοσμένη δημιουργία πρωτοτύπων για μοναδικές εφαρμογές</h2>

  <p>Το Εργαστήριο Πρωτοτύπων είναι το σημείο όπου επιλύουμε προβλήματα που οι τυποποιημένες σανίδες παραγωγής δεν μπορούν να αντιμετωπίσουν. Πρόσφατα παραδείγματα περιλαμβάνουν:</p>

  <ul>
    <li>Ένα SUP διάσωσης υψηλής ορατότητας για οργανισμό έρευνας και διάσωσης, που απαιτούσε ενσωματωμένες λαβές αρπαγής, βάσεις για διασωστικό εξοπλισμό και κύτος υψηλής πλευστότητας για ανάρρωση τραυματιών — όλα πρωτοτυποποιημένα, τοποθετημένα και δοκιμασμένα στις εγκαταστάσεις μας.</li>
    <li>Ένα SUP touring αποστολών για εργολάβο υδρογραφικών ερευνών, με αφαιρούμενο ιστό οργάνων, σφραγισμένες θύρες εξοπλισμού και χαμηλής προφίλ βάση μετατροπέα σχεδιασμένη να ελαχιστοποιεί την αντίσταση.</li>
    <li>Ένα συμπαγές SUP ψαρέματος για στόλο θέρετρου, όπου το πρωτότυπο χρησιμοποιήθηκε για την επικύρωση της σταθερότητας, του εξαρτισμού εξοπλισμού και της ανθεκτικότητας σε καθημερινή χρήση ενοικίασης πριν ο πελάτης δεσμευτεί για στόλο τεσσάρων.</li>
  </ul>


  <h2>Η ομάδα πρωτοτύπων μας</h2>

  <p>Το εργαστήριο στελεχώνεται από οκτώ πολυειδείς θαλάσσιους τεχνικούς, ο καθένας εκπαιδευμένος σε τουλάχιστον δύο από τους τρεις βασικούς τομείς (κύτος, rails, εξάρτυση). Ο επικεφαλής της ομάδας είναι έμπειρος κατασκευαστής με 16 χρόνια εμπειρίας, από μεμονωμένες προσαρμοσμένες
  κατασκευές έως σειρές παραγωγής. Κάθε πρωτότυπο ανατίθεται σε αποκλειστικό μηχανικό έργου, ο οποίος αποτελεί το μοναδικό σημείο επικοινωνίας για τον πελάτη σε όλη τη διαδικασία κατασκευής και δοκιμών.</p>


  <h2>Συμμετοχή του πελάτη</h2>

  <p>Ενθαρρύνουμε ενεργά τους πελάτες μας να παραστούν στα βασικά ορόσημα κατά την κατασκευή του πρωτοτύπου — ιδιαίτερα στην αρχική ανασκόπηση εξοπλισμού και στη θαλάσσια δοκιμή. Τα λειτουργικά σας σχόλια σε αυτά τα στάδια είναι ανεκτίμητα για τη βελτιστοποίηση της σανίδας πριν
  εισέλθει στην παραγωγή. Δεν κατασκευάζουμε εν κενώ· κατασκευάζουμε σε συνεργασία μαζί σας.</p>

  <p>Η θαλάσσια δοκιμή των 20 ωρών αποτελεί επίσης ευκαιρία για την ομάδα σας να εξοικειωθεί με τον χειρισμό της σανίδας, τη διάταξη του καταστρώματος και τις απαιτήσεις συντήρησης, διασφαλίζοντας την ομαλή μετάβαση σε λειτουργία όταν παραδοθούν οι σανίδες παραγωγής.</p>

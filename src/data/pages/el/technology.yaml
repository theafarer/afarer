hero:
  tagline: Τεχνολογία
  title: Η τεχνολογία μας
  subtitle: Τα προϊόντα afarer είναι σχεδιασμένα με προηγμένα υλικά και καινοτόμο μηχανική για να προσφέρουν εξαιρετική απόδοση, ανθεκτικότητα και φορητότητα.
sections:
  - title: Πυρήνας Drop-Stitch
    description: Χιλιάδες εσωτερικά νήματα πολυεστέρα συνδέουν τα πάνω και κάτω στρώματα, δημιουργώντας άκαμπτη δομή στα 12-15 PSI. Αυτή είναι η ίδια τεχνολογία που χρησιμοποιείται σε επαγγελματικές σανίδες paddle και φουσκωτά SUP αγώνων.
    imageAlt: Βασικό Διάγραμμα DS
  - title: PVC Θαλάσσιας Ποιότητας
    description: Πολυστρωμένο υφασματικό υλικό PVC κατάλληλο για θαλασσινά περιβάλλοντα. Κάθε στρώση είναι fusion-welded αντί για επικόλληση, αποκλείοντας ρίσκα διάλυσης υλικού. Δοκιμάζεται για ανθεκτικότητα σε UV, διάβρωση αλάτινου νερού και τριβή.
    imageAlt: Στρώμα PVC
  - title: PVC Στρατιωτικού Επιπέδου
    description: Χρησιμοποιείται σε όλα τα μοντέλα SUP, το premium PVC προσφέρει ανώτερη αντοχή στην υπεριώδη ακτινοβολία (UV) και στα χημικά. Διατηρεί την ευελιξία του σε ακραίες θερμοκρασίες και αντιστέκεται στη φθορά.
    imageAlt: PVC
  - title: Δάπεδο Air Deck
    description: Κατασκευή φουσκωτού drop-stitch υψηλής πίεσης που παρέχει εξαιρετική ακαμψία για όρθια ιστιοπλοΐα, ψάρεμα και γιόγκα. Μειώνει τον χρόνο προετοιμασίας, το συνολικό βάρος και τον όγκο αποθήκευσης.
    imageAlt: Air Deck

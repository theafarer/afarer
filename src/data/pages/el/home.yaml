hero:
  tagline: ''
  title: |
    Σχεδιασμένα για το νερό. <br class="hidden sm:inline" />
    Κατασκευασμένα για <span class="text-accent dark:text-white">ζωή στο σκάφος</span>.
  subtitle: |
    <span class="hidden sm:inline"><span class="font-semibold">afarer</span> σχεδιάζει και κατασκευάζει υψηλής ποιότητας φουσκωτά σκάφη, SUP και τεχνικά προϊόντα.</span>
    <span class="block mb-1 sm:hidden font-bold text-blue-600">afarer: φτιαγμένη για απόδοση.</span>
    Για θαλάσσιους επαγγελματίες, εμπορικούς χειριστές και λάτρεις που απαιτούν αξιοπιστία και δεξιοτεχνία.
  taglineSection: Λύσεις φουσκωτών SUP επαγγελματικής ποιότητας για θέρετρα, συλλόγους, καταστήματα λιανικής και μάρκες θαλάσσιων σπορ.
  actions:
    - variant: primary
      text: Δείτε προϊόντα
      href: /products
      icon: tabler:shopping-bag
    - text: Μάθετε περισσότερα
      href: '#features'
      icon: tabler:file-text
    - text: Εξερευνήστε Λύσεις SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: Εξώφυλλο afarer
who_we_serve:
  tagline: Ποιον Εξυπηρετούμε
  title: Ολοκληρωμένες Λύσεις SUP για Κάθε Επιχείρηση Θαλάσσιων Δραστηριοτήτων
  subtitle: Εξοπλισμός ειδικής κατασκευής, παραγωγή και επιχειρηματική υποστήριξη για τέσσερις βασικές αγορές.
  items:
    - title: Λέσχες Paddle
      keywords: Εξοπλισμός λεσχών SUP, εξοπλισμός σχολών κωπηλασίας, στόλος ενοικιάσεων
      description: Ανθεκτικοί στόλοι SUP, τιμές για συλλόγους και προγράμματα ανταλλακτικών για λέσχες και σχολές SUP.
      icon: tabler:users
      cta: Ανακαλύψτε λύσεις για Paddle Clubs
      link: /solutions/paddle-clubs
    - title: Θέρετρα & Ξενοδοχεία
      keywords: θαλάσσιες δραστηριότητες θέρετρων, εξοπλισμός ξενοδοχειακών παραλιών, εμπειρία επισκεπτών
      description: Πλήρη προγράμματα στόλου SUP με προσαρμοσμένη μάρκα, εκπαίδευση προσωπικού και πακέτα βελτιστοποιημένα για ROI.
      icon: tabler:building
      cta: Δημιουργήστε τη Θαλάσσια Εμπειρία του Θέρετρού Σας
      link: /solutions/resorts-hotels
    - title: Πάροχοι Λιανικής Πώλησης
      keywords: Χονδρική SUP, λιανικοί έμποροι εξωτερικού χώρου, καταστήματα αθλητικών ειδών
      description: Πλήρης σειρά προϊόντων, διαφημιστικό υλικό, επιλογές dropshipping και ανταγωνιστικά περιθώρια χονδρικής.
      icon: tabler:shopping-cart
      cta: Γίνετε Συνεργάτης Λιανικής
      link: /solutions/retail-partners
    - title: Νέες Επωνυμίες SUP
      keywords: SUP ιδιωτικής ετικέτας, προσαρμοσμένη μάρκα SUP, σανίδες paddle OEM
      description: Ολοκληρωμένη κατασκευή OEM/ODM — σχεδιασμός, δημιουργία πρωτοτύπων, μαζική παραγωγή και παγκόσμια logistics.
      icon: tabler:package
      cta: Χτίστε τη Δική σας Μάρκα SUP
      link: /oem-odm-manufacturer
proof_points:
  title: Μας εμπιστεύονται επιχειρήσεις θαλάσσιων δραστηριοτήτων σε όλο τον κόσμο
  subtitle: Δεκαετίες ναυτικής μηχανολογικής εμπειρίας που τροφοδοτούν κερδοφόρα προγράμματα SUP.
  items:
    - metric: 10+
      label: Χρόνια Εμπειρίας
      detail: Από το 2012
    - metric: 50+
      label: Χώρες που Εξυπηρετούνται
      detail: Παγκόσμιο δίκτυο διανομής
    - metric: 15,000+
      label: Μονάδες Παραγωγής ετησίως
      detail: Πιστοποιημένη κατά CE παραγωγική δυναμικότητα
    - metric: 100%
      label: CE Πιστοποιημένο
      detail: Συμμόρφωση με ISO 9001, BSCI, REACH
business_solutions:
  tagline: Πώς Βοηθάμε
  title: Ο Συνεργάτης σας από την Ιδέα έως τα Έσοδα
  subtitle: Τέσσερις βασικές δυνατότητες που βοηθούν τις θαλάσσιες επιχειρήσεις να ξεκινήσουν, να λειτουργήσουν και να αναπτυχθούν.
  items:
    - title: Επαγγελματικός Εξοπλισμός
      description: Σανίδες SUP επαγγελματικής κλάσης, σχεδιασμένες για καθημερινή ενοικίαση, με 500+ κύκλους χρήσης και ελάχιστη συντήρηση.
      icon: tabler:shield-check
    - title: Κατασκευή OEM
      description: Πλήρης παραγωγή ιδιωτικής ετικέτας από τη σχεδίαση και την ανάπτυξη πρωτοτύπων έως τη μαζική παραγωγή και την παγκόσμια παράδοση.
      icon: tabler:package
    - title: Επιχειρησιακή Υποστήριξη
      description: Εκπαίδευση προσωπικού, διαφημιστικό υλικό, προγράμματα ανταλλακτικών και αποκλειστική διαχείριση λογαριασμού.
      icon: tabler:headset
    - title: Παγκόσμια Λογιστική
      description: FOB Qingdao, CIF σε μεγάλα λιμάνια, παράδοση πόρτα-πόρτα σε 50+ χώρες με υποστήριξη τελωνειακών διαδικασιών.
      icon: tabler:truck-delivery
oem_section:
  tagline: Λανσάρετε τη Μάρκα Σας
  title: Από την Ιδέα στην Αγορά σε 16 Εβδομάδες
  subtitle: Ο πλήρης συνεργάτης σας για την κυκλοφορία επωνυμίας SUP — σχεδιασμός, πρωτότυπο, παραγωγή και αποστολή.
  steps:
    - number: '01'
      title: Ιδέα & Brief
      desc: Μοιραστείτε το όραμά σας, την αγορά-στόχο και τις προδιαγραφές σας.
    - number: '02'
      title: Σχεδιασμός & Μηχανική
      desc: Τρισδιάστατη μοντελοποίηση, επιλογή υλικών και προσαρμοσμένος γραφιστικός σχεδιασμός.
    - number: '03'
      title: Πρωτότυπο & Αξιολόγηση
      desc: Παραγωγή δειγμάτων με πιστοποίηση CE και ποιοτικές δοκιμές.
    - number: '04'
      title: Μαζική Παραγωγή
      desc: Παραγωγή πλήρους κλίμακας με ενσωματωμένο έλεγχο ποιότητας και υποστήριξη ελέγχου εργοστασίου.
    - number: '05'
      title: Παγκόσμια Παράδοση
      desc: Logistics FOB Qingdao, CIF σε μεγάλα λιμάνια, πόρτα-πόρτα.
  cta: Ξεκινήστε το Ταξίδι της Μάρκας Σας
  cta_link: /oem-odm-manufacturer
cta:
  title: |
    Έτοιμος να διαμορφώσετε <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">το επόμενο σκάφος σας</span>;
  subtitle: Πείτε μας πώς θα χρησιμοποιείτε το σκάφος και εντός μίας εργάσιμης ημέρας θα προτείνουμε μοντέλο, επιλογές και τιμή.
  actions:
    - variant: primary
      text: Ζητήστε τιμή
      href: /contact
      icon: tabler:message-circle
    - text: Περιηγηθείτε στον κατάλογο
      href: /products

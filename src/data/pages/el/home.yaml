who_we_serve:
  tagline: Ποιον Εξυπηρετούμε
  title: Ολοκληρωμένες Λύσεις SUP για Κάθε Επιχείρηση Θαλάσσιων Δραστηριοτήτων
  subtitle: Εξοπλισμός ειδικής κατασκευής, παραγωγή και επιχειρηματική υποστήριξη για τέσσερις βασικές αγορές.
  items:
    - title: Λέσχες Paddle
      keywords: Εξοπλισμός λεσχών SUP, εξοπλισμός σχολών κωπηλασίας, στόλος ενοικιάσεων
      description: Ανθεκτικοί στόλοι SUP, τιμές για συλλόγους και προγράμματα ανταλλακτικών για λέσχες και σχολές SUP.
      icon: tabler:users
      cta: Ανακαλύψτε λύσεις για Paddle Clubs
      link: /solutions/paddle-clubs
    - title: Θέρετρα & Ξενοδοχεία
      keywords: θαλάσσιες δραστηριότητες θέρετρων, εξοπλισμός ξενοδοχειακών παραλιών, εμπειρία επισκεπτών
      description: Πλήρη προγράμματα στόλου SUP με προσαρμοσμένη μάρκα, εκπαίδευση προσωπικού και πακέτα βελτιστοποιημένα για ROI.
      icon: tabler:building
      cta: Δημιουργήστε τη Θαλάσσια Εμπειρία του Θέρετρού Σας
      link: /solutions/resorts-hotels
    - title: Πάροχοι Λιανικής Πώλησης
      keywords: Χονδρική SUP, λιανικοί έμποροι εξωτερικού χώρου, καταστήματα αθλητικών ειδών
      description: Πλήρης σειρά προϊόντων, διαφημιστικό υλικό, επιλογές dropshipping και ανταγωνιστικά περιθώρια χονδρικής.
      icon: tabler:shopping-cart
      cta: Γίνετε Συνεργάτης Λιανικής
      link: /solutions/retail-partners
    - title: Διανομείς Χωρών & Συνεργάτες Co-Brand
      keywords: διανομέας SUP ανά χώρα, co-branded SUP, SUP ιδιωτικής ετικέτας
      description: Αποκλειστική διανομή ανά χώρα και περιορισμένες co-branded συλλογές για επαγγελματίες του θαλάσσιου αθλητισμού.
      icon: tabler:package
      cta: Γίνετε Συνεργάτης
      link: /distributor-program
proof_points:
  title: Δοκιμασμένο πέρα από το showroom
  subtitle: Σχεδιασμός, απόδοση και ποιότητα που μπορείτε να επαληθεύσετε — στο νερό και στους αριθμούς.
  items:
    - metric: 10+
      label: Χρόνια Σχεδιασμού για το Νερό
      detail: Από το 2012, βελτιωμένο σανίδα με σανίδα
    - metric: 50+
      label: Χώρες στο Νερό
      detail: Κωπηλάτες και συνεργάτες σε όλο τον κόσμο
    - metric: 12–15
      label: Πυρήνας Drop-Stitch PSI
      detail: Άκαμπτο εκεί όπου χρειάζεται, εύκολο στη συσκευασία
    - metric: 100%
      label: Δοκιμές Πίεσης Σανίδα με Σανίδα
      detail: Επιθεωρείται πριν από την αποστολή
business_solutions:
  tagline: Πώς Βοηθάμε
  title: Ο Συνεργάτης σας από την Ιδέα έως τα Έσοδα
  subtitle: Τέσσερις βασικές δυνατότητες που βοηθούν τις θαλάσσιες επιχειρήσεις να ξεκινήσουν, να λειτουργήσουν και να αναπτυχθούν.
  items:
    - title: Επαγγελματικός Εξοπλισμός
      description: Σανίδες SUP επαγγελματικής κλάσης, σχεδιασμένες για καθημερινή ενοικίαση, με 500+ κύκλους χρήσης και ελάχιστη συντήρηση.
      icon: tabler:shield-check
    - title: Συνεργατικές Συλλογές Co-Brand
      description: Περιορισμένες co-branded συλλογές, σχεδιασμένες, μηχανολογικά εξελιγμένες και κατασκευασμένες μαζί με την afarer — κάθε σανίδα παραμένει προϊόν afarer.
      icon: tabler:package
    - title: Επιχειρησιακή Υποστήριξη
      description: Εκπαίδευση προσωπικού, διαφημιστικό υλικό, προγράμματα ανταλλακτικών και αποκλειστική διαχείριση λογαριασμού.
      icon: tabler:headset
    - title: Παγκόσμια Λογιστική
      description: FOB Qingdao, CIF σε μεγάλα λιμάνια, παράδοση πόρτα-πόρτα σε 50+ χώρες με υποστήριξη τελωνειακών διαδικασιών.
      icon: tabler:truck-delivery
oem_section:
  tagline: Συλλογές Co-Brand
  title: Από την Ιδέα στο Νερό — Co-Branded Εκδόσεις
  subtitle: 'Για συνεργάτες που θέλουν κάτι περισσότερο από ένα προϊόν καταλόγου: περιορισμένες co-branded συλλογές, σχεδιασμένες, μηχανολογικά εξελιγμένες και κατασκευασμένες μαζί με την afarer — ενώ κάθε σανίδα παραμένει προϊόν afarer.'
  steps:
    - number: '01'
      title: Ιδέα & Brief
      desc: Μοιραστείτε το όραμά σας, την αγορά-στόχο και τις προδιαγραφές σας.
    - number: '02'
      title: Σχεδιασμός & Μηχανική
      desc: Τρισδιάστατη μοντελοποίηση, επιλογή υλικών και προσαρμοσμένος γραφιστικός σχεδιασμός.
    - number: '03'
      title: Πρωτότυπο & Αξιολόγηση
      desc: Παραγωγή δειγμάτων με πιστοποίηση CE και ποιοτικές δοκιμές.
    - number: '04'
      title: Μαζική Παραγωγή
      desc: Σταθερή, ελεγχόμενη παραγωγή με σημεία ελέγχου ποιότητας σε κάθε στάδιο.
    - number: '05'
      title: Παγκόσμια Παράδοση
      desc: Logistics FOB Qingdao, CIF σε μεγάλα λιμάνια, πόρτα-πόρτα.
  cta: Εξερευνήστε το Co-Branding
  cta_link: /co-brand

meta:
  title: 'Παγκόσμια παρουσία — κατασκευαστής SUP σε πάνω από 50 χώρες | {SITE}'
  description: 'Η afarer εξάγει φουσκωτές σανίδες SUP και σκάφη σε πάνω από 50 χώρες σε όλες τις ηπείρους. Επαγγελματίας κατασκευαστής και προμηθευτής για μάρκες, διανομείς και στόλους.'
  keywords:
    - 'παγκόσμιος κατασκευαστής SUP'
    - 'εξαγωγέας paddle board'
    - 'εργοστάσιο SUP Κίνα'
    - 'επαγγελματίας προμηθευτής SUP'
hero:
  tagline: Παγκόσμια Παρουσία
  title: Εξυπηρετώντας 50+ Χώρες<br />σε Κάθε Ήπειρο
  subtitle: Από ευρωπαϊκούς χειριστές παράκτιας περιπολίας έως αυστραλιανούς διανομείς θαλάσσιων σπορ έως ομάδες διάσωσης Μέσης Ανατολής —σκάφη afarer βρίσκονται στο νερό παγκοσμίως.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'afarer: παγκόσμια ναυτική κατασκευή και διανομή'
stats:
  title: Παγκόσμια Εμβέλεια
  stats:
    - title: Χώρες
      amount: 50+
    - title: Αγορές Εξαγωγών
      amount: Ευρώπη, Αμερικές, Ασία, Μέση Ανατολή, Ωκεανία
    - title: Παραγωγή
      amount: Qingdao, China

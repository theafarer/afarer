      amount: Montclair, CA
features3_markets:
  tagline: Βασικές Αγορές
  title: Περιφερειακή Τεχνογνωσία<br />για Τοπικές Απαιτήσεις
  subtitle: Κατανοούμε ότι διαφορετικές αγορές έχουν διαφορετικές κανονιστικές απαιτήσεις, προτιμήσεις και περιπτώσεις χρήσης.
  isBeforeContent: false
  columns: 4
  items:
    - title: Ευρώπη & Ηνωμένο Βασίλειο
      description: Πιστοποιημένα προϊόντα CE που πληρούν πρότυπα EN ISO 6185. Ισχυρή ζήτηση για SUP, φουσκωτά σκάφη και σανίδες SUP σε αγορές ΕΕ. Οι διανομείς ΗΒ εκτιμούν τον γρήγορο χρόνο ολοκλήρωσής μας.
      icon: tabler:map-pin
    - title: Βόρεια Αμερική
      description: Εγκεκριμένη κατασκευή από Ακτοφυλακή ΗΠΑ. Αποθήκη ΗΠΑ στο Montclair, CA για γρήγορη παράδοση στη Δυτική Ακτή. Αυξανόμενη ζήτηση για αλιευτικά σκάφη, σκάφη διάσωσης και ψυχαγωγικά SUP.
      icon: tabler:map-pin
    - title: Αυστραλία & Ωκεανία
      description: Ισχυρή αγορά για σκάφη SUP και φουσκωτά βοηθητικά σκάφη. Οι αυστραλοί διανομείς εκτιμούν τα σκάφη Hypalon μας για αντοχή UV σε συνθήκες έντονου ήλιου. Γρήγορη αποστολή από την εγκατάστασή μας στην Ασία.
      icon: tabler:map-pin
    - title: Μέση Ανατολή
      description: Αυξανόμενη ζήτηση για περιπολικά και διασωστικά σκάφη. Τα SUP με κύτος αλουμινίου είναι δημοφιλή σε χειριστές ακτοφυλακής και ασφάλειας. Προσαρμοσμένες διαμορφώσεις για περιβάλλοντα υψηλής θερμοκρασίας.
      icon: tabler:map-pin
features3_distribution:
  tagline: Δίκτυο Κατανομής
  title: Συνεργασία με Διανομείς<br />Παγκοσμίως
  subtitle: Συνεργαζόμαστε με καθιερωμένους διανομείς θαλάσσιου εξοπλισμού, μάρκες θαλάσσιων σπορ και κυβερνητικούς οργανισμούς προμηθειών.
  isBeforeContent: false
  columns: 3
  items:
    - title: Co-Brand προγράμματα
      description: Κατασκευή ιδιωτικής ετικέτας για παγκόσμιες επωνυμίες θαλάσσιων σπορ. Χειριζόμαστε τα πάντα από τον σχεδιασμό έως την παραγωγή έως την απευθείας αποστολή.
      icon: tabler:building
    - title: Δίκτυο Διανομής
      description: Εξουσιοδοτημένοι διανομείς σε 20+ χώρες διατηρούν απόθεμα και παρέχουν τοπική υποστήριξη. Νέα αιτήματα διανομέων είναι ευπρόσδεκτα.
      icon: tabler:users
    - title: Κυβερνητικό & Θεσμικό
      description: Άμεση προμήθεια σε ακτοφυλακές, οργανώσεις έρευνας και διάσωσης και στρατιωτικά προγράμματα προμηθειών. Συμμόρφωση με θεσμικές απαιτήσεις προμηθειών.
      icon: tabler:building-community
steps2_logistics:
  title: Παγκόσμια Logistics & Υποστήριξη
  subtitle: Από το εργοστάσιο έως τον προορισμό —διαχειριζόμαστε ολόκληρη την εφοδιαστική αλυσίδα.
  items:
    - title: Επιλογές Αποστολής
      description: Θαλάσσια μεταφορά (FOB Qingdao), αεροπορική μεταφορά για επείγουσες παραγγελίες και ταχυμεταφορά για δείγματα και ανταλλακτικά.
      icon: tabler:truck-delivery
    - title: Αποθήκη ΗΠΑ
      description: 'Απόθεμα στο Montclair, CA για γρήγορη παράδοση σε όλη τη Βόρεια Αμερική. Δυτική Ακτή: 2-3 ημέρες, Κεντρικά: 3-4 ημέρες, Ανατολική Ακτή: 4-5 ημέρες.'
      icon: tabler:building-warehouse
    - title: Ανταλλακτικά
      description: Γνήσια ανταλλακτικά και αναλώσιμα afarer σε απόθεμα όλο το χρόνο. Κοινά ανταλλακτικά αποστέλλονται εντός 24 ωρών.
      icon: tabler:package
    - title: Τεχνική Υποστήριξη
      description: Άμεση γραμμή στην ομάδα μηχανικών μας για τεχνικές ερωτήσεις, συμβουλές επισκευής και υποστήριξη μετασκευής. Υποστηρίζουμε σκάφη που κατασκευάσαμε πριν από 20 χρόνια.
      icon: tabler:headset
cta:
  title: Θέλετε να γίνετε διανομέας;
  subtitle: Επεκτείνουμε ενεργά το δίκτυο διανομής μας. Επικοινωνήστε με την ομάδα εξαγωγών μας για να συζητήσετε ευκαιρίες συνεργασίας.
  actions:
    - variant: primary
      text: Αίτημα Συνεργασίας
      href: /contact
    - text: Δείτε τη γκάμα των προϊόντων μας
      href: /products

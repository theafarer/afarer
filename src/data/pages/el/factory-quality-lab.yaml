hero:
  tagline: Εργαστήριο Ποιοτικού Ελέγχου
  title: Εργαστήριο Δοκιμών & Διασφάλιση Ποιότητας
  subtitle: Ανεξάρτητο εργαστήριο ποιότητας με διαδικασίες ISO 9001 — κάθε μονάδα δοκιμάζεται πριν από την αποστολή
intro: >-
  Η afarer διαθέτει ένα αποκλειστικό εργαστήριο ποιοτικού ελέγχου που λειτουργεί ανεξάρτητα από την παραγωγή. Κάθε παρτίδα πρώτης ύλης και κάθε τελικό σκάφος περνά από τεκμηριωμένα πρωτόκολλα επιθεώρησης πριν από την αποδέσμευσή του. Η ομάδα ποιοτικού ελέγχου αναφέρεται απευθείας στη διοίκηση,
  διασφαλίζοντας αμερόληπτες αποφάσεις ποιότητας.
highlights:
  - value: 100%
    label: Μονάδες που υποβλήθηκαν σε δοκιμή πίεσης
    detail: Κάθε θάλαμος, κάθε σκάφος
  - value: 24–48 h
    label: Διάρκεια δοκιμής κράτησης αέρα
    detail: Σε πίεση 1,25× της ονομαστικής
  - value: '&lt;5%'
    label: Μέγιστη επιτρεπόμενη πτώση πίεσης
    detail: Περίοδος συγκράτησης πίεσης 24–48 ωρών
  - value: AQL 2.5
    label: Όριο σοβαρών ελαττωμάτων
    detail: Δειγματοληψία σύμφωνα με το ISO 2859
test_procedures:
  - title: Έλεγχος Πρώτων Υλών
    description: >-
      Κάθε εισερχόμενη παρτίδα PVC, Hypalon, υφάσματος drop-stitch και υλικού ελέγχεται πριν από την αποδοχή. Επαληθεύονται η αντοχή σε εφελκυσμό (ASTM D751), η αντοχή σε σχίσιμο (ISO 4674) και η αντοχή στην υπεριώδη ακτινοβολία (UV). Τα υλικά που δεν πληρούν τις προδιαγραφές τίθενται σε καραντίνα
      και επιστρέφονται.
    standards:
      - ASTM D751 (εφελκυσμός)
      - ISO 4674 (σχίσιμο)
      - ISO 4892 (UV)
  - title: Σημεία ελέγχου ποιότητας κατά τη διάρκεια της παραγωγής
    description: Οι εκμεταλλευτές παραγωγής εκτελούν αυτό-έλεγχο σε κάθε στάδιο. Οι ελεγκτές QC διενεργούν τυχαία δειγματοληψία καθόλη τη βελτίωση. Δοκιμές αποπέλευσης συγκόλλησης γίνονται κάθε 50 μονάδες. Έλεγχοι διαστάσεων πραγματοποιούνται κάθε 20η πάνελ.
    standards:
      - ASTM D751 (αποκόλληση)
      - Εσωτερική λίστα ελέγχου 100 σημείων
      - Δειγματοληψία ISO 2859
  - title: Δοκιμή Συγκράτησης Αέρα 24–48 Ωρών
    description: Κάθε θάλαμος σωλήνα φουσκώνεται στο 125% της ονομαστικής πίεσης και διατηρείται εκεί για 24–48 ώρες. Οι αισθητήρες πίεσης καταγράφουν συνεχώς με αντιστάθμιση θερμοκρασίας. Κάθε θάλαμος που παρουσιάζει πτώση πίεσης άνω του 5% ενεργοποιεί αυτόματο επανέλεγχο της παρτίδας.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Δοκιμές φορτίου & ισορροπίας
    description: Οι ολοκληρωμένες βάρκες δοκιμάζονται στη μέγιστη ονομαστική χωρητικότητα για ευστάθεια, ύψος εξάλων και χειρισμό. Κάθε σκάφος υποβάλλεται σε δοκιμή στο νερό πριν από την έγκριση της τελικής επιθεώρησης.
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: Καθολική μηχανή δοκιμών (εφελκυσμός)
    spec: 5 kN, συμμορφώση ASTM D751
  - name: Pressure Decay Tester
    spec: Πολυκαναλικό, 0–50 psi, καταγραφή δεδομένων
  - name: UV Weathering Chamber
    spec: ISO 4892, 1.000 κύκλοι ωρών
  - name: Μετρητής πάχους (ψηφιακός)
    spec: Ανάλυση 0.01 mm
  - name: Peel Tester (weld)
    spec: Ηλεκτροκίνητο, ικανότητα 50 N
  - name: Temperature Chamber
    spec: '-40 °C έως +100 °C'
  - name: Leak Detection Tank
    spec: 6 m × 2 m, με φωτισμό

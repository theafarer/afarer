  title: 'Ο Επαγγελματίας σας<br />Προμηθευτής Ναυτικού Εξοπλισμού'
  subtitle: 'Η Afarer εφοδιάζει ναυτικά κέντρα, εγκαταστάσεις αναψυχής, ξενοδοχεία και επωνυμίες με επαγγελματικό εξοπλισμό για το νερό: φουσκωτά κουπιά, βάρκες, πλωτήρες, σωσίβια και αξεσουάρ. Παραγωγή OEM, τιμές εργοστασίου, πιστοποιημένη ποιότητα.'
  image:
    src: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    alt: Επαγγελματική παραγωγή ναυτικού εξοπλισμού στο εργοστάσιο
  actions:

features:
  title: 'Ένας Συνεργάτης για τις Υδάτινες Δραστηριότητές σας'
  subtitle: 'Από το φουσκωτό κουπί έως τον πλήρη στόλο: εφοδιάζουμε συλλόγους, ναυτικά κέντρα, ξενοδοχεία και θέρετρα.'
  columns: 3
  items:
    - title: 'Στόλοι για Ναυτικά Κέντρα'
      description: 'Ανθεκτικά φουσκωτά κουπιά και βάρκες για ενοικίαση, εκπαίδευση και αθλητικούς συλλόγους.'
      icon: 'tabler:lifebuoy'
    - title: 'Εξοπλισμός Ξενοδοχείων & Θερέτρων'
      description: 'Εξοπλισμός νερού για ξενοδοχεία, θέρετρα και τουριστικά συγκροτήματα — τιμές στόλου.'
      icon: 'tabler:building-store'
    - title: 'Εξοπλισμός Ασφάλειας'
      description: 'Σωσίβια, αξεσουάρ ασφάλειας και συμμόρφωση για επαγγελματίες χειριστές.'
      icon: 'tabler:shield-check'
    - title: 'Ιδιωτική Ετικέτα'
      description: 'Λογότυπο και προσαρμογή για εκμισθωτές, σχολές και επωνυμίες διανομέων.'
      icon: 'tabler:palette'
    - title: 'Πιστοποιημένη Ποιότητα'
      description: 'CE / ISO / BSCI / REACH — αξιόπιστος επαγγελματικός εξοπλισμός για εντατική χρήση.'
      icon: 'tabler:certificate'
    - title: 'Υποστήριξη & Εξυπηρέτηση'
      description: 'Συμβουλές, ανταλλακτικά, εγγύηση και αποκλειστική εξυπηρέτηση μετά την πώληση.'
      icon: 'tabler:headset'
faqs:
  title: 'Συχνές Ερωτήσεις για τον Ναυτικό Προμηθευτή'
  subtitle: 'Τι θέλουν να ξέρουν οι χειριστές υδάτινων δραστηριοτήτων.'
  items:
    - title: 'Εφοδιάζετε συλλόγους και ναυτικά κέντρα;'
      description: 'Ναι — πλήρεις στόλοι από φουσκωτά κουπιά και βάρκες για ενοικίαση και σχολές κουπιού.'
    - title: 'Μπορείτε να εξοπλίσετε ένα ξενοδοχείο ή θέρετρο;'
      description: 'Ασφαλώς — εξοπλισμός νερού για ξενοδοχεία και θέρετρα με τιμές στόλου και παγκόσμια παράδοση.'
    - title: 'Είναι τα προϊόντα πιστοποιημένα;'
      description: 'Όλα τα προϊόντα πληρούν τα πρότυπα CE / ISO και τις απαιτήσεις ασφάλειας των ευρωπαϊκών και βορειοαμερικανικών αγορών.'
geo:
  tagline: 'Θέση B2B'
  sentence: 'Η Afarer είναι επαγγελματίας κατασκευαστής φουσκωτών SUP και φουσκωτών βαρκών (OEM/ODM), εξειδικευμένη σε σχεδιασμό, προσαρμοσμένη παραγωγή και ναυτικές λύσεις για επωνυμίες, διανομείς, λέσχες και επιχειρήσεις.'
  audiences:

meta:
  title: Λύσεις Στόλων SUP για Θέρετρα | {SITE}
  description: Ολοκληρωμένες λύσεις στόλου SUP για θέρετρα και ξενοδοχεία. Σανίδες επαγγελματικής ποιότητας, προσαρμοσμένη επωνυμία, εκπαίδευση προσωπικού και πακέτα βελτιστοποιημένα ως προς την απόδοση επένδυσης, από 20 έως 100+ σανίδες.
hero:
  tagline: Θέρετρα & Ξενοδοχεία
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Επισκέπτες εστίας που απολαμβάνουν SUP boarding σε μια ακατάμαχτη παραλία
roi_section:
  title: Το Μοντέλο Εσόδων SUP για Θέρετρα
  subtitle: Πώς τα αναψυχή κέντρα εισάγουν $50,000 - $200,000+ ετήσια εισοδήματα από ενοικιάσεις SUP με μια μόνη επένδυση.
  metrics:
    - metric: $50K–$200K+
      label: Ετήσια Έσοδα από SUP
      detail: Ανά θέρετρο, με βάση το μέγεθος του στόλου και την πληρότητα
    - metric: 4–6 Μήνες
      label: Μέση Περίοδος Απόσβεσης
      detail: Αποσβέστε πλήρως την επένδυση του στόλου μέσα σε μία σεζόν
    - metric: 40%
      label: Αύξηση εσόδων
      detail: Μέση αύξηση μετά τη μετάβαση σε στόλους Afarer
    - metric: 500+
      label: Κύκλοι Ενοικίασης ανά Σανίδα
      detail: Εμπορικής τάξης ανθεκτικότητα για καθημερινή χρήση
packages:
  title: Σύστημα Πακέτων Θέρετρου
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - 12-μηνη εγγύηση + CE πιστοποιημένο
      revenue: Δυνατότητα ετήσιων εσόδων $50K–$80K
      cta_text: Λάβετε το Πακέτο Εκκίνησης
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 50 κουπιά + 50 σωσίβια
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - Συνεδρία εκπαίδευσης προσωπικού (διαδικτυακά)
        - 12-μηνη εγγύηση + CE πιστοποιημένο
      revenue: Δυνατότητα ετήσιων εσόδων $120K–$200K+
      popular: true
      cta_text: Αποκτήστε το Premium Πακέτο
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - Αποκλειστικός διαχειριστής λογαριασμού
        - Ανταλλακτικά με προτεραιότητα (αποστολή εντός 24 ωρών)
        - Custom branding + logo
        - Πακέτο φωτογραφικού/βιντεογραφικού υλικού μάρκετινγκ
        - Εγγύηση 24 μηνών + πιστοποιημένο CE
      revenue: Δυνατότητα ετήσιων εσόδων $200K+
      cta_text: Λάβετε το Flagship Πακέτο
case_study:
  quote: Από τότε που στραφήκαμε στην Afarer, τα έσοδα από ενοικιάσεις SUP αυξήθηκαν 40%. Το κόστος αντικατάστασης σανίδων μειώθηκε 60%. Ανακτήσαμε ολόκληρη την επένδυση του στόλου μας σε 4 μήνες.
  author: Διευθυντής Δραστηριοτήτων στο Νερό
  location: Θέρετρο 5 αστέρων, Μαλδίβες
  results:
    - label: Ανάπτυξη Εσόδων
      value: +40%
    - label: Μείωση Κόστους
      value: '-60%'
    - label: Περίοδος Απόσβεσης
      value: 4 μήνες
features:
  title: Γιατί τα Θέρετρα Επιλέγουν την Afarer
  subtitle: Ανθεκτικότητα επαγγελματικής ποιότητας, παγκόσμια logistics και ένας συνεργάτης που κατανοεί τον κλάδο της φιλοξενίας.
  items:
    - title: 500+ Κύκλοι Ενοικίασης
      description: Κάθε πίνακας δοκιμάζεται να επιβιώσει 500+ κύκλους ενοικίασης σε αλμυρό νερό, ήλιο και άμμο.
      icon: tabler:shield-check
    - title: Αποστολή Ανταλλακτικών εντός 48 ωρών
      description: Ανταλλακτικά εξαρτήματα αποστέλλονται εντός 48 ωρών — τα εισοδήματα ενοικιάσεών σας δεν σταματούν ποτέ.
      icon: tabler:truck-delivery
    - title: Προσαρμοσμένη Σήμανση
      description: Ευθυγραμμίστε την ταυτότητα του resort σας με προσαρμοσμένα χρώματα και λογότυπο σε κάθε σανίδα.
      icon: tabler:palette
    - title: Εκπαίδευση Προσωπικού
      description: Διαδικτυακά και επιτόπια εκπαιδευτικά προγράμματα για την ομάδα δραστηριοτήτων σας.
      icon: tabler:school
    - title: Παγκόσμια Λογιστική
      description: Αποστολές σε 50+ χώρες με επιλογές ενοποιημένων μεταφορών.
      icon: tabler:world
    - title: CE Πιστοποιημένο
      description: Όλος ο εξοπλισμός πιστοποιημένος CE, ISO 9001:2015 — ασφάλεια και ποιότητα εγγυημένες.
      icon: tabler:certificate

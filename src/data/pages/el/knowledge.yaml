hero:
  tagline: Γράφημα Γνώσης
  title: Γνώση Εξερεύνησης Νερού
  subtitle: |
    Μια δομημένη βάση γνώσης που καλύπτει τεχνολογία φουσκωτών SUP,<br />
    ασφάλεια στο νερό, μηχανική σκαφών και σχεδιασμό περιπετειών.
  taglineSection: Εξερευνήστε. Μάθετε. Πηγαίνετε με αυτοπεποίθηση.
clusters:
  tagline: Συμπλέγματα Γνώσης
  title: Εξερευνήστε ανά θέμα
  subtitle: Βουτιά στην τεχνολογία, ασφάλεια και δεξιότητες πίσω από κάθε προϊόν afarer.
  items:
    - title: Γνώση SUP
      description: Από την επιλογή της πρώτης σανίδας έως προηγμένες τεχνικές περιήγησης.
      icon: tabler:lifebuoy
      topics:
        - Πώς να επιλέξετε το πρώτο σας φουσκωτό SUP
        - Καλύτερο μέγεθος SUP για αρχάριους
        - Πόσο δύσκολη είναι η κωπηλασία;
        - Σύγκριση φουσκωτού vs σκληρής σανίδας
        - Λίστα ελέγχου ασφαλείας SUP
    - title: Γνώση Σκαφών
      description: Τεχνικοί οδηγοί για φουσκωτές βάρκες, SUP, βοηθητικά σκάφη και καγιάκ.
      icon: tabler:sailboat
      topics:
        - Εξήγηση τύπων φουσκωτών βαρκών
        - Σύγκριση PVC vs Hypalon
        - Σύγκριση SUP vs Βοηθητικού
        - Τεχνολογία Drop-stitch σε βάθος
        - Οδηγός θαλάσσιας επιστήμης υλικών
    - title: Γνώση Ασφαλείας
      description: Απαραίτητη γνώση ασφαλείας για κάθε κωπηλάτη —από PFD έως ανάγνωση καιρού.
      icon: tabler:shield
      topics:
        - Λίστα ελέγχου ασφαλείας SUP
        - Χρειάζεστε σωσίβιο;
        - Οδηγός ασφάλειας ωκεανού
        - Ασφάλεια ποταμού για φουσκωτά καγιάκ
        - Ευαισθητοποίηση καιρού και συνθηκών νερού
    - title: Τεχνολογία
      description: Η μηχανική πίσω από τα προϊόντα afarer —υλικά, κατασκευαστικές μέθοδοι και δοκιμές ποιότητας.
      icon: tabler:microscope
      topics:
        - Τεχνολογία θαλάσσιου PVC
        - Εξήγηση πυρήνα Drop-stitch
        - Γιατί το PSI έχει σημασία για τα φουσκωτά SUP
        - RF συγκόλληση vs συγκόλληση με κόλλα
        - Δοκιμές ποιότητας και πιστοποίηση
    - title: SUP Lifestyle & Special Uses
      description: Specialized SUP activities —yoga, fishing, dogs, families, and travel tips.
      icon: tabler:heart
      topics:
        - SUP yoga and meditation on water
        - Fishing from an inflatable SUP
        - Paddle boarding with dogs and kids
        - Traveling with your SUP by air and car
        - SUP accessories and gear essentials
    - title: SUP Comparisons & References
      description: Side-by-side comparisons to help you make informed decisions.
      icon: tabler:chart-bar
      topics:
        - SUP vs kayak — which is right for you?
        - PVC vs Hypalon material comparison
        - Single chamber vs multi-chamber safety
        - SUP board materials explained
        - UV printing vs EVA block artwork

meta:
  title: 'Γνώση — Οδηγοί SUP | {SITE}'
  description: 'Η βάση γνώσεων afarer: οδηγοί για φουσκωτά SUP, υλικά paddle board, επιλογή σανίδας και πληροφορίες κλάδου για μάρκες και επαγγελματίες.'
  keywords:
    - 'γνώση SUP'
    - 'οδηγός φουσκωτό SUP'
    - 'υλικά paddle board'
    - 'πληροφορίες κλάδου SUP'
hero:
  tagline: Γράφημα Γνώσης
  title: Γνώση Εξερεύνησης Νερού
  subtitle: |
    Μια δομημένη βάση γνώσης που καλύπτει τεχνολογία φουσκωτών SUP,<br />
    ασφάλεια στο νερό, μηχανική σανίδων και σχεδιασμό περιπετειών.
  taglineSection: Εξερευνήστε. Μάθετε. Πηγαίνετε με αυτοπεποίθηση.
clusters:
  tagline: Συμπλέγματα Γνώσης
  title: Εξερευνήστε ανά θέμα
  subtitle: Βουτιά στην τεχνολογία, ασφάλεια και δεξιότητες πίσω από κάθε προϊόν afarer.
  items:
    - title: Οδηγοί Αγοράς SUP
      description: Από την επιλογή της πρώτης σας σανίδας έως προηγμένες τεχνικές touring — τα πάντα για το stand-up paddle boarding.
      icon: tabler:lifebuoy
      topics:
        - Πώς να επιλέξετε το πρώτο σας φουσκωτό SUP
        - Οδηγός μεγέθους και χωρητικότητας βάρους SUP
        - Καλύτερο SUP για αρχάριους, touring, γιόγκα και αγώνες
        - Συνηθισμένα λάθη στην αγορά SUP που πρέπει να αποφύγετε
        - Σύγκριση φουσκωτού vs σκληρής σανίδας
    - title: Μηχανική & Τεχνολογία SUP
      description: Τεχνικοί οδηγοί για φουσκωτές σανίδες SUP — υλικά, μέθοδοι κατασκευής και διαδικασίες παραγωγής.
      icon: tabler:microscope
      topics:
        - Τεχνολογία Drop-stitch σε βάθος
        - Προδιαγραφές PVC στρατιωτικής ποιότητας
        - Συγκόλληση fusion έναντι συγκόλλησης με κόλλα
        - Τεχνολογία αφρού EVA και μέθοδοι γραφικών
        - Τύποι βαλβίδων SUP και συστήματα πτερυγίων
    - title: Ασφάλεια & Συντήρηση SUP
      description: Απαραίτητη γνώση ασφαλείας για κάθε κωπηλάτη — από την επιλογή PFD έως την ανάγνωση καιρού και τη φροντίδα και επισκευή σανίδας.
      icon: tabler:shield
      topics:
        - Λίστα ελέγχου ασφαλείας SUP και απαιτήσεις PFD
        - Ασφάλεια πολλαπλών θαλάμων για απομακρυσμένα νερά
        - Οδηγός PSI φουσκώματος SUP
        - Αποθήκευση σανίδας και χειμερινή φροντίδα
        - Τεχνικές επισκευής φουσκωτών
    - title: Δεξιότητες & Τεχνικές SUP
      description: Τεχνικές κωπηλασίας, δεξιότητες touring και προπόνηση φυσικής κατάστασης για όλα τα επίπεδα.
      icon: tabler:sailboat
      topics:
        - Τεχνικές κωπηλασίας για αρχάριους
        - Προχωρημένη τεχνική κουπιού
        - Σχεδιασμός touring και αποστολών
        - Εκπαίδευση φυσικής κατάστασης και αγώνες SUP
        - Δεξιότητες σε ταραγμένα νερά και ποτάμια
    - title: Στυλ Ζωής SUP & Ειδικές Χρήσεις
      description: Εξειδικευμένες δραστηριότητες SUP — γιόγκα, ψάρεμα, σκύλοι, οικογένειες και ταξιδιωτικές συμβουλές.
      icon: tabler:heart
      topics:
        - SUP γιόγκα και διαλογισμό στο νερό
        - Ψάρεμα από φουσκωτό SUP
        - Paddle boarding με σκύλους και παιδιά
        - Ταξίδι με το SUP σας αεροπορικώς και με αυτοκίνητο
        - Αξεσουάρ SUP και βασικός εξοπλισμός
    - title: Συγκρίσεις SUP & Αναφορές
      description: Συγκρίσεις δίπλα-δίπλα που σας βοηθούν να λαμβάνετε τεκμηριωμένες αποφάσεις.
      icon: tabler:chart-bar
      topics:
        - SUP ή καγιάκ — ποιο είναι το κατάλληλο για εσάς;
        - Κατηγορίες υλικών PVC εξηγημένες
        - Ασφάλεια μονού θαλάμου έναντι πολλαπλών θαλάμων
        - Υλικά σανίδας SUP εξηγημένα
        - Εκτύπωση UV έναντι σχεδίων σε μπλοκ EVA

meta:
  title: 'איכות ובדיקות — בקרת ייצור | {SITE}'
  description: 'מערכת האיכות של afarer: מעבדת בדיקות עצמאית, תהליכי ISO 9001 ובדיקה של כל יחידה לפני משלוח. בקרת איכות לייצור SUP מתנפח.'
  keywords:
    - 'בקרת איכות SUP'

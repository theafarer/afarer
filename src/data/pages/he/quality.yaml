hero:
  tagline: 'בטחון איכות'
  title: 'בדיקות ביצועים ואיכות'
  subtitle: 'כל SUP מתנפח של afarer עובר בדיקות ביצועים ובקרת איכות קפדניות במרכז המו״פ שלנו לפני המשלוח. בדיקות האיכות המקיפות שלנו ל-SUP מספקות הוכחה מוחשית למצוינות המוצר עבור קוני OEM וסיטונאים.'


intro: 'זוהי טעות נפוצה לחשוב שבדיקות הידרודינמיות שמורות לאוניות החוצות אוקיינוסים. בפועל, הביצועים של גוף גלישה קטן — כגון SUP מתנפח — תלויים בצורתו מתחת למים לא פחות מכפי שמכלית תלויה בחרטום המעוגל שלה. זווית ההטיה, שטח הפנים הרטוב, יצירת הרסס והאוורור — לכולם השפעה דרמטית על הדאייה, המהירות ונוחות הרכיבה. ב-afarer אנו מפעילים בריכת בדיקות הידרודינמיות ייעודית המאפשרת לנו לכמת השפעות אלה בקנה מידה של דגם — לפני שאנו מתחייבים על בדים וכלים לאב-טיפוס בגודל מלא.'

content_html: |
  <h2>מדוע לבדוק גלשן פאדל בבריכת בדיקות?</h2>
  <p>בדיקות בקנה מידה של דגם (בדרך כלל 1:3 עד 1:5) מעניקות לנו יכולת לחזור במהירות ובעלות אפקטיבית על צורות גוף השיט. שבוע בבריכה יכול להניב את אותם נתוני ביצועים שהיו דורשים חודשים של ניסוי וטעייה בקנה מידה מלא — ובחלק קטן מהעלות.</p>

  <h2>מפרט המתקן</h2>
  <table>
    <thead><tr><th>פרמטר</th><th>מפרט</th></tr></thead>
    <tbody>
      <tr><td>ממדי הבריכה</td><td>35 מ׳ (אורך) × 3.5 מ׳ (רוחב) × 1.8 מ׳ (עומק)</td></tr>
      <tr><td>עגלת גרירה</td><td>הנעה חשמלית בבקרת סרוו, מהירות מרבית 12 m/s (23 קשרים), דיוק מהירות ± 0.5 %</td></tr>
      <tr><td>מחולל גלים</td><td>מסוג מדף, מצבי ים סדירים ולא סדירים הניתנים לתכנות, Hs עד 0.3 מ׳ בקנה מידה של דגם</td></tr>
      <tr><td>מכשירי מדידה</td><td>דינמומטר בן 6 רכיבים (התנגדות, כוח צידי, מומנט סבסוב), מדי תאוצה, מדי הטיה, מגשי גלים</td></tr>
      <tr><td>רכישת נתונים</td><td>דגימה של 1000 Hz לכל ערוץ, תצוגה בזמן אמת + חבילת עיבוד מאוחר</td></tr>
      <tr><td>ייצור דגמים</td><td>כרסום CNC והדפסה תלת-ממדית פנימיים לגופי שיט של דגמים עד אורך כולל של 1.8 מ׳</td></tr>
    </tbody>
  </table>

  <h2>תוכנית הבדיקות שלנו</h2>
  <p>תוכנית פיתוח סטנדרטית של גוף שיט בבריכה שלנו פועלת לפי הרצף הבא:</p>
  <ol>
    <li><strong>בניית דגם</strong> — דגם בקנה מידה 1:3.5 מעובד בכרסום CNC מקצף בצפיפות גבוהה ומצופה בזכוכית לקשיחות. המשקל ומרכז הכובד מכוונים להתאמה למצב עומס מלא בכיול Froude.</li>
    <li><strong>ריצות התנגדות</strong> — הדגם נגרר ב-8-10 מהירויות המכסות את טווח ההפעלה. ההתנגדות הכוללת נמדדת ומפורקת לרכיבי חיכוך ושארית בשיטת ITTC-1957.</li>
    <li><strong>מדידת הטיה ושקיעה</strong> — הטיה בפעולה ושקיעה נרשמות בכל מהירות. זווית הטיה מיטבית של 4-6° לגופי גלישה היא היעד.</li>
    <li><strong>סקר השובל</strong> — חתכי גלים רוחביים נמדדים בשתי מהירויות להערכת התנגדות יצירת הגלים ולזיהוי אינטראקציות של גלים רוחביים שעלולות לגרום להפרעה בירכתיים.</li>
    <li><strong>התנהגות בים (אופציונלי)</strong> — ריצות בגלי חרטום ובגלי עוקב בגלים סדירים למדידת התנגדות נוספת, תאוצה אנכית והסתברות הצלפות.</li>
    <li><strong>ניתוח נתונים והמלצות</strong> — מוגש דוח מלא עם תרשימים השוואתיים, עקומות מהירות/הספק והמלצות עיצוב ספציפיות לגוף השיט בקנה מידה מלא.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">תוצאות בדיקת בריכה טיפוסיות — התנגדות לעומת מהירות (גוף SUP לטיולים, קנה מידה 1:3.5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">התנגדות בקנה מידה של דגם (N) במהירויות מכוילות Froude. חיזוי הגרר בקנה מידה מלא פועל לפי שיטת חיזוי הביצועים ITTC-1978.</p>
  </div>

  <h2>צוות מומחים</h2>
  <p>הבריכה שלנו מופעלת על ידי הידרודינמיקאי בעל דוקטורט בדינמיקת זורמים ו-8 שנות ניסיון בבריכות גרירה במכון מחקר ימי אירופאי מרכזי. הוא נתמך על ידי טכנאי המכין את כל הדגמים ואת מכשירי המדידה. הצוות פועל לפי הנהלים המומלצים של ITTC (ועידת בריכות הגרירה הבינלאומית) כדי להבטיח שכל בדיקה תהיה ניתנת לחזרה, ניתנת למעקב ומוגנת ברמה בינלאומית.</p>

  <h2>בדיקות בריכה לפיתוח גוף שיט מותאם</h2>
  <p>הבריכה שלנו משמשת לא רק לגופי שיט בעיצוב פנימי — אנו מבצעים באופן קבוע תוכניות בדיקה עבור לקוחות המעוניינים לאמת צורת גוף שיט מותאמת או לחקור בעיית ביצועים:</p>
  <ul>
    <li><strong>השוואת צורות גוף</strong> — שתי צורות גוף מועמדות או יותר נבדקות בתנאים זהים, ומתקבלת השוואה אובייקטיבית של גרר/מהירות/יציבות לשם קבלת החלטת העיצוב שלכם.</li>
    <li><strong>מיטוב תוספות</strong> — תצורות סנפירים, פרופילי מסילות וגרסאות רוקר ניתנות לבדיקה בשילובים שונים לכימות תרומתן הפרטנית להפחתת הגרר.</li>
    <li><strong>מחקר יעילות דאייה</strong> — נתוני התנגדות מומרים לעקומת יעילות דאייה, המאפשרת לכם לאזן בין נפח גוף השיט, הרוקר והקשיחות עבור מהירות החתירה והמטען המיועדים לכם.</li>
  </ul>

  <h2>מדוע לבדוק איתנו?</h2>
  <p>אנו לא רק מוסרים לכם סדרה של מספרים גולמיים. הדוחות שלנו מתרגמים את נתוני הבריכה להמלצות הנדסיות מעשיות: "הוסיפו 8 מ״מ רוקר בחרטום כדי להפחית את השטח הרטוב בקצב שיוט", "הפחיתו את רוקר הירכתיים ב-3° כדי להאריך את קו המים בקצב טיולים", או "הזיזו את הנקודה הרחבה ביותר 150 מ״מ לכיוון הירכתיים לשיפור היציבות במסלול". אתם יוצאים עם הבנה ברורה מה לשנות ומדוע.</p>
  <p>הבריכה שלנו זמינה גם לבדיקות עצמאיות של צד שלישי, בתשלום תמורת שירות. אם אתם מפתחים גוף שיט ומעוניינים בהערכה הידרודינמית בלתי מוטית ומקצועית, נשמח לפנייתכם.</p>


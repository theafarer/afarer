content_html: |
  <h2>מהו Drop-Stitch?</h2>
  <p>Drop-Stitch (המכונה גם ״בד Drop-Stitch״ או ״ליבת Drop-Stitch״) היא שיטת מבנה שבה אלפי חוטי פוליאסטר נפרדים מחברים בין השכבה העליונה לתחתונה של מעטפת בד. כאשר המעטפת מנופחת, חוטים אלה פועלים כאלמנטים מותחים פנימיים — הם מונעים מהלוחות העליון והתחתון לבלוט החוצה לצורה עגולה, ומכריחים את הלוח להישאר שטוח וקשיח.</p>
  <p>התוצאה היא מבנה קל משקל ונייד שיכול לעמוד בלחץ פנימי של 15 – 20 PSI — קשיחות הדומה לזו של לוח קשיח, אך ניתנת לריקון מלא לאחסון ולתובלה.</p>

  <h2>כיצד זה עובד: הפיזיקה</h2>
  <p>במבנה ניפחים רגיל (כמו בלון או מזרן אוויר), לחץ האוויר הפנימי דוחף באותה עוצמה לכל הכיוונים. ללא תימוך פנימי, המבנה הופך גלילי או כדורי. Drop-Stitch פותר זאת באמצעות חיזוק במתיחה:</p>
  <ul>
    <li>אלפי חוטים מחברים בין שכבות הבד העליונה והתחתונה</li>
    <li>כאשר המבנה מנופח, לחץ האוויר מנסה לדחוק את החלק העליון והתחתון זה מזה</li>
    <li>החוטים מתנגדים להפרדה זו ומעבירים את העומס למתיחה לאורך ציר החוט</li>
    <li>התוצאה היא לוח שטוח וקשיח העמיד לכיפוף</li>
  </ul>

  <h2>תהליך הבנייה</h2>
  <ol>
    <li><strong>אריגה:</strong> חוטי פוליאסטר נארגים בו-זמנית לשתי שכבות נפרדות של בד בסיס (בדרך כלל פוליאסטר מצופה PVC מסוג 1,100 DTEX או 1,680 DTEX). החוטים נארגים בלולאות בין השכבות בזווית של 90&deg;.</li>
    <li><strong>ציפוי:</strong> בד הבסיס הארוג מצופה ב-PVC (או לעיתים ב-TPU) בתהליך ציפוי בסכין או ציפוי בקלנדר. הדבר אוטם את החוטים ויוצר את הממברנה האטומה לאוויר.</li>
    <li><strong>חיבור שכבות:</strong> ליבת ה-Drop-Stitch מחוברת לשכבות למינציה חיצוניות (בדרך כלל PVC בעובי 0.9 מ״מ או 1.2 מ״מ) באמצעות למינציה בחום או דבק.</li>
    <li><strong>ריתוך:</strong> רצועות הדפנות מרותכות לאורך הקצוות באמצעות ריתוך באוויר חם, ריתוך RF או ריתוך בתדירות גבוהה, ליצירת דפנות הלוח.</li>
    <li><strong>התקנת שסתומים:</strong> מותקנים שסתומי Boston או שסתומי Halkey-Roberts, בדרך כלל עם מנגנון שחרור לחץ למניעת ניפוח יתר.</li>
  </ol>

  <h2>מדדי איכות מרכזיים</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">פרמטר</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">רמת כניסה</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">פרימיום</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">צפיפות חוטים</td><td class="p-3 border">חוט 1 / אינץ׳ רבוע</td><td class="p-3 border">2 חוטים / אינץ׳ רבוע</td></tr>
      <tr><td class="p-3 border">בד בסיס</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">לחץ מרבי</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">עובי PVC</td><td class="p-3 border">0.6 – 0.9 מ״מ</td><td class="p-3 border">1.0 – 1.2 מ״מ</td></tr>
      <tr><td class="p-3 border">מבנה דפנות</td><td class="p-3 border">מקופל ומודבק</td><td class="p-3 border">מרותך ומחובר בהיתוך</td></tr>
    </tbody>
  </table>

  <h2>יישומים</h2>
  <ul>
    <li><strong>לוחות SUP:</strong> עובי 4״ – 6״, 15 – 20 PSI, 1 – 2 חוטים/אינץ׳ רבוע</li>
    <li><strong>קיאקים:</strong> רצפת Drop-Stitch + תאי צד ניפחים, רצפה בלחץ 10 – 15 PSI</li>
  </ul>

  <h2>Drop-Stitch לעומת סיפון אוויר (ליבת פיברגלס או עץ)</h2>
  <p>לוחות קשיחים משתמשים בליבות קצף EPS עם חיזוק פיברגלס או קורות עץ. הם קלים יותר, קשיחים יותר ורספונסיביים יותר — אך לא ניתן לרוקנם. Drop-Stitch מקריב מעט קשיחות תמורת ניידות מלאה. עבור רוב המשתמשים הפנאיים, לוחות Drop-Stitch מודרניים בלחץ 20 PSI אינם נבדלים בקשיחותם מלוחות קשיחים ברמת כניסה.</p>

  <h2>כיצד Afarer משתמשת ב-Drop-Stitch</h2>
  <p>Afarer משתמשת בליבת Drop-Stitch מסוג 1,680 DTEX בכל סדרת לוחות ה-SUP שלה, עם 2 חוטים לאינץ׳ רבוע ולמינציה חיצונית של PVC בעובי 1.2 מ״מ. הלוחות מדורגים ל-20 PSI ועוברים בדיקת החזקת לחץ של 24–48 שעות בלחץ של פי 1.25 מהלחץ המדורג לפני המשלוח. רצועות הדפנות מרותכות באוויר חם עם היתוך בשלוש שכבות, ושסתומי שחרור לחץ הם סטנדרט בכל הדגמים.</p>


meta:
  title: 'אקדמיה — מדריכי SUP ואימוני חתירה | {SITE}'
  description: 'אקדמיית afarer: מדריכים לגלשני פאדל מתנפחים, טכניקות חתירה בעמידה, בטיחות ימית וידע בתחום החומרים למתחילים ולמקצוענים.'
  keywords:
    - 'למידת חתירה בעמידה'
    - 'מדריך SUP למתחילים'
    - 'יסודות גלשן הפאדל'
    - 'טכניקת SUP'
    - 'שיעורי SUP'
hero:
  tagline: 'אקדמיית afarer'
  title: 'מרכז למידה'
  subtitle: 'מדריכים והדרכות לכל רמת מיומנות — מיסודות ה-SUP ועד טכניקות חילוץ מתקדמות'

categories:
  - level: 'מתחילים'
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: 'יסודות ה-SUP'
        desc: 'למדו את היסודות של חתירה בעמידה — עמידה, טכניקת חתירה ואיזון.'
        slug: beginner-sup-guide
      - title: 'טכניקות חתירה'
        desc: 'חתירה קדימה, חתירה סיבובית, חתירת משיכה ותמיכה נמוכה — שלטו בתנועות המשוט החיוניות.'
        slug: sup-paddle-guide
      - title: 'בטיחות קודם הכול'
        desc: 'נהלי בטיחות חיוניים לרבות בדיקות מזג אוויר, שימוש באפודת הצלה, כללי רצועה והצלה עצמית.'
        slug: sup-safety-guide
  - level: 'ביניים'
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: 'עקרונות טיולים'
        desc: 'תכנון חתירות של מספר שעות — ניווט, הידרציה, קצב וקריאת תחזיות רוח.'
        slug: touring-sup-guide
      - title: 'קריאת מזג אוויר'
        desc: 'פענחו תחזיות ימיות, זהו דפוסי עננות והבינו את השפעות הרוח על המים.'
        slug: weather-planning-water-sports
      - title: 'יסודות ניווט'
        desc: 'קריאת מפות ימיות, שימוש במצפן, נקודות ציון GPS ותכנון מסלולים לחתירה לאורך החוף.'
        slug: sup-navigation-guide
      - title: 'מודעות לגאות ושפל'
        desc: 'הבנת מחזורי גאות ושפל, זרמים, והשפעתם על תזמון ההשקה ובחירת המסלול.'
        slug: understanding-tides
  - level: 'מתקדמים'
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: 'תכנון טיולים רב-יומיים'
        desc: 'לוגיסטיקת משלחת — בחירת ציוד, תכנון מזון, נהלי בטיחות ואנשי קשר לשעת חירום.'
        slug: sup-travel-guide
      - title: 'טכניקות חילוץ'
        desc: 'הצלה עצמית, חילוץ ב-T ונהלי גרירה למים פתוחים.'
        slug: sup-self-rescue
      - title: 'חתירה לילית'
        desc: 'ניווט לאחר חשיכה — דרישות תאורה, זיכרון מסלול, תקשורת קבוצתית ומודעות למפגעים.'
        slug: ocean-safety-basics
  - level: 'תחזוקה'
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: 'ניקוי וטיפול'
        desc: 'שטיפה במים מתוקים, הגנה מפני UV, מניעת עובש וטכניקות ייבוש נכונות לאחר כל ישיבה על המים.'
        slug: inflatable-sup-maintenance
      - title: 'מדריך אחסון'
        desc: 'שיטות מומלצות לאחסון לוחות SUP מתנפחים — בריקון אוויר, קיפול, בקרת טמפרטורה וחיי מדף.'
        slug: inflatable-sup-storage
      - title: 'יסודות התיקון'
        desc: 'תקנו נקבים קטנים, דליפות תפרים ובעיות שסתום בעזרת ערכות תיקון PVC וטכניקות טלאה.'
        slug: inflatable-sup-repair
      - title: 'תחזוקת שסתומים'
        desc: 'זהו סוגי שסתומים (Halkey-Roberts, Boston, Leafield), נקו לכלוך והחליפו גבעולים פגומים.'
        slug: sup-pump-guide

knowledge_center_tagline: 'מרכז הידע'
knowledge_center_title: 'מדריכי ציוד ימי וענף'
knowledge_center_subtitle: 'ידע מקצועי ומדריכי קנייה לאנשי מקצוע ימיים, מפעילי ציים וחובבי ספורט מים.'

knowledge_sections:
  - title: 'ידע על לוחות SUP'
    tagline: 'מדריכי חתירה בעמידה'
    desc: 'הכול על לוחות SUP — עיצוב הלוח, חומרים, בחירת גודל, תחזוקה וייעוץ קנייה לשימוש פרטי ומסחרי.'
    guides:
      - title: 'כיצד לבחור את לוח ה-SUP המתאים'
        desc: 'מדריך מלא לבחירת SUP — גודל, נפח, חומר, צורה ושימוש מיועד.'
        href: '/learn/sup/'
      - title: 'SUP מתנפח מול קשיח'
        desc: 'SUP מתנפח מול לוח אפוקסי קשיח — ניידות, עמידות, ביצועים ותמורה בהשוואה.'
        href: '/compare/inflatable-vs-hardboard/'
      - title: 'רב-שימושי מול טיולים מול יוגה SUP'
        desc: 'סוגי לוחות SUP שונים — תקני בנייה, צורות, גדלים ושימושים מומלצים.'
        href: '/learn/sup/'
      - title: 'בניית Drop-Stitch מול בנייה מסורתית'
        desc: 'השוו בניית Drop-Stitch ובנייה מסורתית עבור לוחות SUP במשקל, בעלות, בעמידות ובקשיחות.'
        href: '/learn/drop-stitch-core/'
  - title: 'מדריך SUP מתנפח'
    tagline: 'ידע על SUP מתנפח'
    desc: 'מדריכים מקיפים על SUP מתנפח — חומרי PVC, מבנה Drop-Stitch, תקני בטיחות ושיטות תחזוקה מומלצות.'
    guides:
      - title: 'מדריך חומרי PVC'
        desc: 'המדריך המקיף לחומרי PVC המשמשים בבניית לוחות SUP מתנפחים.'
        href: '/learn/materials/'
      - title: 'כיצד מיוצרים SUP מתנפחים'
        desc: 'תהליך הייצור — חיתוך חומרים, חיבור ליבת Drop-Stitch, בניית תפרים, בדיקות לחץ ובקרת איכות.'
        href: '/learn/inflatable-technology/'
      - title: 'מדריך בטיחות SUP'
        desc: 'תקני בטיחות, כושר נשיאה, ניפוח נכון, בדיקות לפני יציאה ונהלי חירום.'
        href: '/learn/water-safety/'
      - title: 'תחזוקת SUP'
        desc: 'ניקוי, אחסון, הגנה מפני UV ותיקון של לוחות SUP מתנפחים.'
        href: '/v2/inflatable-sup-maintenance/'
  - title: 'ידע על לוחות SUP'
    tagline: 'מרכז לוחות SUP'
    desc: 'מדריכים טכניים העוסקים בסוגי לוחות SUP, חומרים, שיטות בנייה, תחזוקה ובטיחות.'
    guides:
      - title: 'סוגי לוחות SUP'
        desc: 'רב-שימושי, טיולים, יוגה, ספורט ו-SUP לילדים — הכירו את ההבדלים ובחרו את המתאים.'
        href: '/learn/sup/'
      - title: 'טכנולוגיית Drop-Stitch'
        desc: 'כיצד אלפי חוטים פנימיים יוצרים מבנים מתנפחים קשיחים בלחץ גבוה.'
        href: '/learn/drop-stitch-core/'
      - title: 'מדריך חומרים'
        desc: 'דירוגי דניר של PVC, משקלי בדים, עמידות ל-UV וחומרים בדרגה ימית — מוסברים.'
        href: '/learn/materials/'
      - title: 'מדריך קניית SUP'
        desc: 'השוו סוגי לוחות SUP שונים עבור מקרי שימוש ורמות מיומנות שונים.'
        href: '/learn/sup/'
  - title: 'ידע על SUP'
    tagline: 'מדריכי חתירה בעמידה'
    desc: 'הכול על לוחות SUP — מתנפח מול קשיח, ממדי לוח, טכנולוגיית חומרים וייעוץ מומחים לכל הרמות.'
    guides:
      - title: 'SUP מתנפח מול קשיח'
        desc: 'השוו iSUP ולוחות אפוקסי קשיחים בניידות, בעמידות, בביצועים ובתמורה.'
        href: '/learn/sup/'
      - title: 'מדריך ממדי לוח SUP'
        desc: 'כיצד אורך, רוחב ועובי משפיעים על יציבות, מהירות ויכולת תמרון.'
        href: '/learn/sup/'
      - title: 'תחזוקה וטיפול ב-SUP'
        desc: 'ניקוי, אחסון, הגנה מפני UV וטיפים לתיקון לוחות SUP מתנפחים.'
        href: '/v2/inflatable-sup-maintenance/'
      - title: 'בחירת ה-SUP הראשון שלכם'
        desc: 'מדריך למתחילים לבחירת גלשן החתירה בעמידה המתאים למשקל, לרמת המיומנות ולשימוש המיועד שלכם.'
        href: '/learn/sup/'
  - title: 'מדריך הפעלת השכרה'
    tagline: 'ניהול ציים לעסקי השכרה'
    desc: 'מדריכים על בנייה וניהול של ציי השכרת SUP עבור קיוסקים בחוף, מרכזי ספורט מים ונכסי הארחה.'
    guides:
      - title: 'בניית צי ההשכרה שלכם'
        desc: 'כיצד לבחור את לוחות ה-SUP המתאימים לפעילות ההשכרה שלכם — עמידות, מידות ושיקולי החזר השקעה.'
        href: '/solutions/rental-operators/'
      - title: 'מדריך תחזוקת צי'
        desc: 'שיטות תחזוקה חיוניות להארכת חיי הלוחות ולמזעור זמן השבתה בציי השכרה.'
        href: '/solutions/rental-operators/'
  - title: 'מדריך נופש והארחה'
    tagline: 'פעילויות מים לענף ההארחה'
    desc: 'מדריכים על השקה וניהול של תוכניות SUP עבור אתרי נופש, מלונות ויעדים לחופי מים.'
    guides:
      - title: 'התחלת תוכנית SUP באתר נופש'
        desc: 'גורמים שיש לשקול בעת השקת פעילויות SUP לאורחים — גודל צי, כוח אדם ומודל הכנסות.'
        href: '/solutions/resorts-hotels/'
      - title: 'SUP מול פעילויות מים אחרות'
        desc: 'השוו תוכניות SUP מול ענפי ספורט מים אחרים מבחינת חוויית האורח והיעילות התפעולית.'
        href: '/learn/sup/'
  - title: 'מדריך קמעונאות והפצה'
    tagline: 'שותפויות עסקיות בתחום ה-SUP'
    desc: 'מדריכים על הפיכה לשותף קמעונאי או מפיץ SUP — תכנון מלאי, מיצוב בשוק ואסטרטגיות צמיחה.'
    guides:
      - title: 'הפיכה לקמעונאי SUP'
        desc: 'כיצד לבחור קווי מוצר, לנהל מלאי ולשווק לוחות SUP בחנות הקמעונאית שלכם.'
        href: '/solutions/retail-partners/'
      - title: 'SUP לפעילויות מסחריות'
        desc: 'מדוע SUP מתנפחים הם מוצר רב-שימושי לציים מסחריים, לעסקי השכרה ולמפעילים מקצועיים.'
        href: '/solutions/rental-operators/'


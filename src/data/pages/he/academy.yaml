  title: 'לא בטוחים מאיפה להתחיל?'
  desc: 'השיבו על שאלון הערכת המיומנות שלנו כדי למצוא את המדריכים והציוד המתאימים לרמה שלכם.'
  label: 'צרו עמנו קשר →'
  link: /contact/

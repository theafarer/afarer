hero:
  tagline: 'שותפים והפצה'
  title: 'הפכו לשותף של afarer<br />— רשת הפצה גלובלית'
  subtitle: 'הצטרפו לרשת השותפים הגלובלית של afarer. אנו עובדים עם מפיצי ציוד ימי, סוחרי ספורט חתירה, קמעונאי ציוד ושותפי מותג ביותר מ-50 מדינות.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: 'רשת השותפים והמפיצים הגלובלית של afarer'
content_programs:
  tagline: 'תוכניות שותפים'
  title: 'תוכניות שותפים<br />שבנויות לצמיחה'
  subtitle: 'בין אם אתם מפיץ, סוחר או שותף מותג, afarer מציעה תוכניות שנועדו לתמוך בעסק שלכם.'
  columns: 3
  items:
    - title: 'תוכנית מפיצים'
      description: 'הפצה בלעדית בטריטוריה עם תמחור נפחי, תמיכה שיווקית וגישה ישירה למפעל. התחייבות מינימלית נדרשת בהתאם לגודל הטריטוריה.'
      icon: tabler:world
    - title: 'תוכנית סוחרים'
      description: 'תמחור ישיר לסוחרים, הדרכת מוצר, חומרי שיווק ותמיכת אחריות לחנויות קמעונאיות ולחנויות מקוונות.'
      icon: tabler:building-store
    - title: 'שותפות OEM/ODM'
      description: 'ייצור OEM ו-ODM בשירות מלא עם מיתוג מותאם אישית, אריזה ומפרטי מוצר. מהקונספט ועד המכולה.'
      icon: tabler:certificate
    - title: 'שותפות מותג'
      description: 'מיתוג משותף, מותג פרטי ותוכניות דגמים בלעדיות למותגות מבוססים בתחום הימי והפנאי בחיק הטבע.'
      icon: tabler:stars
    - title: 'ממשל ומוסדות'
      description: 'תוכניות ספק מועדף לסוכנויות ממשלתיות, משמרות חופים, צבא וארגוני סיוע הומניטרי. תיעוד מוכן למכרזים.'
      icon: tabler:building-community
    - title: 'שותף לנופש והשכרה'
      description: 'תמחור צי, איכות עקבית ומיתוג מותאם אישית לאתרי נופש, מרכזי צלילה ועסקי השכרה ברחבי העולם.'
      icon: tabler:sun
content_benefits:
  tagline: 'למה לשתף איתנו פעולה'
  title: 'מדוע שותפים בוחרים ב-afarer'
  subtitle: 'השותפים שלנו נהנים מיכולת ייצור אמיתית, איכות עקבית ותמיכה קשובה.'
  list:
    - 'גישה ישירה למפעל: עבדו ישירות עם צוות הייצור שלנו — בלי מתווכים. קבלו מענה מהיר יותר, מחירים טובים יותר ושקיפות מלאה בתהליך הייצור.'
    - 'מוכנות להתאמה אישית: מתגו את המוצרים שלכם בצבעים, לוגואים, אריזות ומפרטים מותאמים אישית. כמויות הזמנה מינימליות המותאמות לשוק שלכם.'
    - 'איכות מובטחת: ייצור מוסמך ISO 9001 עם עמידה בדרישות CE, UKCA ו-BSCI. כל מוצר נבדק לפני המשלוח.'
    - 'לוגיסטיקה גלובלית: משלוחים מצ׳ינגדאו שבסין עם אפשרויות FOB, CIF ו-DDP. מחסן בארה״ב במונטקלייר שבקליפורניה להפצה בצפון אמריקה.'
    - 'תמיכה שיווקית: קטלוגי מוצרים, צילומים, תיעוד טכני ונכסים דיגיטליים לתמיכה במאמצי המכירה שלכם.'
    - 'הדרכה ותמיכה: הדרכת מוצר לצוות המכירות שלכם, תמיכה טכנית ללקוחותיכם ותיאום שירות אחריות.'
content_process:
  tagline: 'כיצד להפוך לשותף'
  title: 'תהליך שותפות פשוט'
  subtitle: 'תהליך השותפות שלנו פשוט וישיר — נועד לאפשר לכם להתחיל למכור מוצרי afarer במהירות.'
  items:
    - title: 'שלב 1: הגשת מועמדות'
      description: 'מלאו את טופס המועמדות לשותפות עם פרופיל החברה שלכם, שוק היעד ותחומי העניין במוצרים.'
    - title: 'שלב 2: בדיקת התאמה'
      description: 'צוות השותפויות שלנו סוקר את המועמדות שלכם ויוצר איתכם קשר בתוך 3 ימי עסקים לדון בהזדמנויות.'
    - title: 'שלב 3: הסכם והקמה'
      description: 'חתמו על הסכם שותפות, הקימו חשבון וקבלו תמחור שותפים, חומרי שיווק ודגימות מוצר.'
    - title: 'שלב 4: הדרכה והשקה'
      description: 'הדרכת מוצר, תמיכת מכירות וחומרים שיווקיים מסופקים. אתם מוכנים להתחיל למכור.'

features3_cases:
  tagline: 'מקרים מומלצים'
  title: 'פתרונות מותאמים<br />לאתגרים אמיתיים'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'צי של מרכזי צלילה באירופה'
      customer: BlueMed Diving Centers
      country: 'יוון'
      industry: 'צלילה ותיירות ימית'
      challenge: 'נדרשו 12 SUP מותאמים לצלילה עבור רשת מרכזי צלילה באיים יווניים רבים. כל לוח נדרש לחיבור ציוד מותאם, אחסון ל-8 מיכלים ופלטפורמה יציבה לכניסת צוללנים למים פתוחים. הצי היה צריך להגיע בתוך 60 יום לקראת פתיחת עונת התיירות.'
      solution: 'ייצרנו 12 דגמי SUP Voyager Dive עם מתלי ציוד משולבים, פלטפורמות יציבות ומבנה Drop-Stitch רחב במיוחד ליציבות בעלייה ללוח. כל לוח עוטר במדי הצי של הלקוח. כל 12 הלוחות נבדקו בלחץ ונשלחו מצ׳ינגדאו בתוך 55 ימים.'
      product: SUP Voyager Dive
      results: 'כל 12 הלוחות סופקו בזמן לעונת התיירות. הצי פועל באופן יומיומי מזה 18+ חודשים ללא כשלים חומריים כלשהם. הלקוח הזמין 6 יחידות נוספות בשנה השנייה.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive הפך לעמוד השדרה של פעילות הצלילה היומיומית שלנו. היציבות מצוינת, ופריסת אחסון הציוד שומרת על הסיפון נקי ובטוח עבור האורחים שלנו.'
      icon: tabler:lifebuoy
    - title: 'תוכנית מיתוג משותף למפיץ אוסטרלי'
      customer: Pacific Watersports Pty Ltd
      country: 'אוסטרליה'
      industry: 'תוכנית מיתוג משותף ושותפות'
      challenge: 'מפיץ אוסטרלי נזקק לסדרת לוחות SUP במיתוג פרטי ובמחירים תחרותיים כדי להתחרות במותגים סיניים המוכרים ישירות לצרכן. נדרשו 8 דגמים ייחודיים המכסים את כל הרמות, ממתחילים ועד מתקדמים, עם גרפיקה מותאמת אישית, אריזות מותאמות ומימוש drop-ship לחנויות קמעונאיות.'
      solution: 'פיתחנו 8 דגמי SUP (רב-שימושי, טיולים, יוגה, ילדים, ספורט, אולטרה-קומפקטי, אולטרה-יציב, מים לבנים) עם ערכת גרפיקה אוסטרלית בלעדית. אריזות קמעונאיות מותאמות עם קודי QR המקשרים לסרטוני התקנה. לוגיסטיקת drop-ship הוגדרה מצ׳ינגדאו ישירות לחנויות קמעונאיות באוסטרליה.'
      product: 'קו SUP מותאם אישית (8 דגמים)'
      results: 'מהקונספט ועד המשלוח הראשון בתוך 90 יום. שיעור מכירה מלא קמעונאי של 85% בעונה הראשונה. המפיץ הרחיב את השותפות לדגמי SUP נוספים בשנה השנייה.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer סיפק קו SUP שלם בתוך 90 יום — מהעיצוב הראשוני ועד רצפת החנות. האיכות משתווה למותגים הנמכרים בכפליים מנקודת המחיר.'
      icon: tabler:currency-dollar
    - title: 'אספקת ציוד חילוץ למזרח התיכון'
      customer: הרשות הלאומית להגנה אזרחית
      country: 'איחוד האמירויות הערביות'
      industry: 'חיפוש והצלה'
      challenge: 'ארגון הגנה אזרחית נזקק ל-20 SUP מוכני סיור לחיפוש והצלה בחוף, אבטחת נמלים ותגובה לשיטפונות. נדרשו לוחות בנראות גבוהה, ציוד בטיחות מלא ועמידה בתקנות ימיות מקומיות.'
      solution: 'סיפקנו 20 דגמי SUP Patrol עם מבנה Drop-Stitch כתום בנראות גבוהה, ערכות בטיחות מלאות, סרט מחזיר אור SOLAS ומבנה מחוזק. כל לוח הוסמך CE ונבדק לתקנים החלים. חבילת התיעוד כללה תעודות תאימות לרישום מקומי.'
      product: SUP Patrol
      results: 'הצי נפרס ב-5 תחנות חוף. הלוחות פועלים בחום קיצוני (45°C+) ללא הידרדרות. הביצועים והעמידות חרגו מהמפרט.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol עלה על הדרישות התפעוליות שלנו. בתנאי חום קיצוניים, הלוחות אינם מציגים סימני הידרדרות UV לאחר 24 חודשי שימוש יומיומי.'
      icon: tabler:alert-triangle
    - title: 'שותפות מיתוג משותף באירופה'
      customer: North Sea Marine Equipment BV
      country: 'הולנד'
      industry: 'תוכנית מיתוג משותף ושותפות'
      challenge: 'מותג ימי אירופאי מבוסס ביקש להתרחב אל שוק ה-SUP מבלי להשקיע במתקני ייצור. נדרש שותף white-label מסוגל לייצר 5 דגמי SUP (מ-9 רגל עד 12 רגל) עם מיתוג פרטי, הסמכת CE וזכויות הפצה בלעדיות באיחוד האירופי.'
      solution: 'כרתנו הסכם ייצור white-label ל-5 דגמי SUP. כל דגם עוטר בלוגואים ובסכמת הצבעים של הלקוח. תיעוד הסמכת CE הוכן לכל דגם. זכויות הפצה בלעדיות באיחוד האירופי ניתנו בכפוף להתחייבויות הזמנה מינימליות. תיעוד טכני סופק עבור רשת שירות מקומית.'
      product: 'קו SUP מותאם אישית (5 דגמים)'
      results: 'נחתם הסכם רב-שנתי. מחזור הייצור הראשון של 50 יחידות נשלח בתוך 75 ימים. המותג הושק בתערוכת מסחר מרכזית בקבלה חיובית מצד המשווקים.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'העבודה עם afarer אפשרה לנו להיכנס לשוק ה-SUP מבלי לבנות מפעל — הם סיפקו פתרון מפתח ביד שלם עם הסמכת CE ותיעוד תמיכה למשווקים.'
      icon: tabler:building
    - title: 'צי של אתר נופש באיים הקריביים'
      customer: Paradise Island Resorts Ltd
      country: 'בהאמה'
      industry: 'תיירות ימית והארחה'
      challenge: 'אתר נופש יוקרתי נזקק לצי מלא של ציוד ספורט מים לפעילויות אורחים: 40 לוחות SUP לסיורים מודרכים, 20 SUP נוספים לחקר לגונות, 10 לוחות SUP לטיולי אורחים, וכן אביזרים. כל הציוד היה צריך לשאת מיתוג מותאם של אתר הנופש ולהגיע לפני עונת התיירות העמוסה.'
      solution: 'ייצרנו חבילת SUP מלאה: 40 לוחות SUP Voyager (דגם רב-שימושי), 20 לוחות SUP Explorer, 10 לוחות SUP Touring, וכן אפודות הצלה, משוטים, משאבות וערכות תיקון. כל הציוד הודפס עם לוגו אתר הנופש וסכמת צבעים טרופית. משלוח במכולות עם רשימת מלאי מלאה.'
      product: 'חבילת SUP מלאה (70+ יחידות)'
      results: 'הצי הגיע 6 שבועות לפני עונת השיא. ציוני שביעות הרצון של האורחים מפעילויות ספורט המים עלו ב-40% בהשוואה שנתית. הציוד מחזיק מעמד 3 עונות עם תחזוקה שוטפת בלבד.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'גישת החבילה השלמה פירושה שקיבלנו את כל מה שנדרש במשלוח אחד — לוחות ואביזרים, כולם ממותגים ומוכנים לשימוש האורחים. האורחים שלנו אוהבים את איכות הציוד.'
      icon: tabler:beach
    - title: 'חוזה סיור חופים בארה״ב'
      customer: Atlantic Coastal Security Agency
      country: 'ארצות הברית'
      industry: 'אבטחה ימית ואכיפת חוק'
      challenge: 'סוכנות אבטחה חופית אמריקאית דרשה לוחות SUP סיור כבדים לפעילויות במים פתוחים. נדרשו לוחות בביצועים גבוהים עם ציוד במפרט צבאי ועמידה בתקנות משמר החופים של ארה״ב.'
      solution: 'הנדסנו את SUP Patrol עם מבנה Drop-Stitch מחוזק, סכמות צבע בנראות גבוהה, מתלים לציוד תקשורת מוצפן ונקודות חיבור משולבות לציוד. הלוחות חוזקו לפעילויות כבדות. תיעוד תאימות USCG סופק.'
      product: SUP Patrol
      results: 'הסוכנות דיווחה על שיעור מוכנות משימתית של 95% ב-12 החודשים הראשונים. הונחה הזמנה נוספת עבור 8 יחידות.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol מעניק לצוותים שלנו את הביצועים הנדרשים לפעילויות במים פתוחים. המבנה המחוזק מספק עמידות קריטית מבלי לפגוע ביכולת התמרון.'
      icon: tabler:shield

hero:
  tagline: 'הסמכות ותקנים'
  title: 'הסמכות איכות<br />ותקני תאימות'
  subtitle: 'ייצור ה-SUP של afarer מוסמך לתקני בטיחות ימית בינלאומיים, למערכות ניהול איכות ולתקנות סביבתיות — CE, ISO 9001, UKCA, BSCI ו-REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'הסמכות האיכות של afarer ותיעוד תאימות'
content_certifications:
  tagline: 'ההסמכות שלנו'
  title: 'איכות מוסמכת,<br />מוכרת ברחבי העולם'
  subtitle: 'כל מוצר של afarer נתמך בהסמכות המעידות על מחויבותנו לאיכות, לבטיחות ולאחריות סביבתית.'
  items:
    - title: 'הסמכת CE'
      description: 'כל מוצרי afarer עומדים בדרישות סימון CE האירופי לכלי שיט לפנאי, ומבטיחים עמידה בתקני בטיחות, בריאות והגנת הסביבה.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'מערכת ניהול האיכות שלנו מוסמכת ISO 9001:2015, ומקיפה את עיצוב, הייצור וההפצה של כלי שיט מתנפחים וציוד ימי.'
      icon: tabler:clipboard-check
    - title: 'סימון UKCA'
      description: 'מוצרים הנמכרים בשוק הבריטי נושאים סימון UKCA, המאשר עמידה בתקנות בריטניה לציוד ימי ולכלי שיט אישיים.'
      icon: tabler:shield
    - title: 'עמידה ב-BSCI'
      description: 'afarer עוברת ביקורות BSCI (Business Social Compliance Initiative), המעידות על פרקטיקות ייצור אתיות, תנאי עבודה הוגנים ואחריות לאורך שרשרת האספקה.'
      icon: tabler:heart-handshake
    - title: 'עמידה ב-REACH'
      description: 'כל החומרים המשמשים במוצרי afarer עומדים בתקנות REACH של האיחוד האירופי לבטיחות כימיקלים, ומבטיחים היעדר חומרים מוגבלים ב-PVC, ב-EVA או ברכיבים שלנו.'
      icon: tabler:flask
    - title: 'בדיקות חומרים'
      description: 'הבדים נבדקים לחוזק מתיחה, עמידות בקריעה, דהיית UV וביצועים בסדקי קור. כל אצוות ייצור נדגמת ומאומתת.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'תקני מפעל'
  title: 'מצוינות ייצורית<br />— נבנה לפי מפרט'
  subtitle: 'המתקן שלנו, בשטח 12,000 מ״ר, פועל תחת פרוטוקולי בקרת איכות קפדניים בכל שלבי הייצור.'
  list:
    - 'בדיקת חומרים נכנסים: כל חומרי הגלם — בד PVC, קצף EVA, דבקים, חומרה — נבדקים מול המפרט לפני כניסתם לייצור.'
    - 'בקרת איכות בתהליך: לכל שלב ייצור נקודות ביקורת QC מתועדות. חוזק ריתוך, יישור תפרים, התקנת שסתומים ומומנט אביזרים מאומתים בזמן אמת.'
    - 'בדיקות לחץ: כל תא מתנפח נבדק בלחץ של 1.25× מהלחץ הנקוב למשך 24–48 שעות. ירידת הלחץ חייבת להישאר מתחת ל-5% כדי לעבור.'
    - 'בדיקה סופית: מוצרים מוגמרים נבדקים לדיוק מימדי, גימור אסתטי, שלמות אביזרים ושלמות אריזה לפני המשלוח.'
    - 'עקיבות אצוות: כל מוצר נושא מספר סידורי המקושר לרישומי אצוות הייצור, המאפשר עקיבות מלאה מחומר הגלם ועד המוצר המוגמר.'
content_safety:
  tagline: 'תקני בטיחות ימית'
  title: 'בטיחות תחילה<br />— מתוכנן לפעולה אמינה'
  subtitle: 'מוצרי afarer מתוכננים ונבדקים כך שיעמדו בתקני בטיחות ימית בינלאומיים לשימוש מסחרי ולפנאי.'
  items:
    - title: 'EN ISO 25649'
      description: 'SUP מתנפחים עומדים בתקני EN ISO 25649 למבנה, יציבות, ציפה וכושר נשיאה.'
      icon: tabler:sailboat
    - title: 'עמידה ב-SOLAS'
      description: 'ציוד הבטיחות ואמצעי ההצלה עומדים בדרישות SOLAS (Safety of Life at Sea) בכל מקום שבו הן חלות.'
      icon: tabler:lifebuoy

hero:
  tagline: 'אורח חיים'
  title: 'אורח החיים<br />של afarer'
  subtitle: 'נבנה עבור אלה שחיים על המים — ממגלי סוף שבוע ועד מפעילים מסחריים שנשענים על הציוד שלהם מדי יום.'

values:
  - icon: 🌊
    title: 'נולדנו על המים'
    desc: 'כל עיצוב מתחיל בהבנת התנהגות המים. אנו מהנדסים מקצה תנאי השטח פנימה — כי האוקיינוס הוא המורה שלנו, לא מקום העבודה שלנו.'
  - icon: 🔧
    title: 'בנוי להחזיק'
    desc: 'המוצר הבר-קיימא ביותר הוא זה שלא צריך החלפה. חומרים בדרגה ימית, ליבות Drop-Stitch מדורגות ל-15 PSI ותפרים שמחזיקים יותר מעונה שלמה.'
  - icon: 🏆
    title: 'נגיש מעצם העיצוב'
    desc: 'ספורט מים לא צריך להיות מותרות. ביצועים בדרגה מקצועית במחיר שהגיוני למשפחות, למדריכים ולמפעילים קטנים — לא רק לציים מסחריים.'
  - icon: 🌍
    title: 'קהילה גלובלית'
    desc: 'מחוף צ׳ינגדאו דרך אגמים באירופה, נהרות בדרום-מזרח אסיה ומפרצים באמריקות — ללקוחות שלנו יש דבר אחד משותף: אהבה להיות על המים.'
  - icon: ♻️
    title: 'ייצור אחראי'
    desc: 'קיבול ממוטב CNC מקטין את בזבוז החומרים לפחות מ-5%. מבנה עמיד מפחית מחזורי החלפה. אנו בונים לאורך חיים כי זו הבחירה הבר-קיימא ביותר.'
  - icon: 🤝
    title: 'תמיכה שנמשכת'
    desc: 'גופים בני עשרים שנה עדיין מתקשרים אלינו לחלקי חילוף. זמן המענה הממוצע שלנו לאחריות הוא 24 שעות. אנחנו לא נעלמים אחרי המכירה — אנחנו כאן לכל חיי המוצר.'


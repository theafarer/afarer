meta:
  title: 'ספק ציוד השכרת SUP ופתרונות צי | {SITE}'
  description: 'ספק ציוד השכרת SUP למפעילי השכרה. לוחות SUP מסחריים בסבב גבוה שהונדסו לשימוש יומיומי — PVC עמיד ל-UV, תפרים מחוזקים, חומרים בעלי ייבוש מהיר. הגדילו את עסק ההשכרה שלכם עם Afarer.'

hero:
  tagline: 'מפעילי השכרה'
  title: 'הגדילו את עסק ההשכרה שלכם<br />בביטחון'
  subtitle: 'ספק ציוד השכרת SUP למפעילי השכרה. לוחות SUP בסבב גבוה שהונדסו להשכרה יומיומית, 365 ימים בשנה. ההכנסות שלכם לעולם לא לוקחות יום חופש.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 'דוכן השכרה עמוס עם לוחות SUP מוכנים לאורחים'

features:
  title: 'בנוי לשגרת ההשכרה'
  subtitle: 'כל לוח הונדס ל-500+ מחזורי השכרה עם תחזוקה מינימלית.'
  items:
    - title: '500+ מחזורי השכרה'
      description: 'נבדק כדי לשרוד שימוש יומיומי במי ים, שמש וחול.'
      icon: 'tabler:shield-check'
    - title: 'בד עמיד ל-UV'
      description: 'בלי דהייה או התדרדרות לאחר שנה של אחסון בחוץ.'
      icon: 'tabler:sun'
    - title: 'תפרים מחוזקים'
      description: 'חזקים פי 3 ממבנה לוח מתנפח סטנדרטי.'
      icon: 'tabler:layers-intersect'
    - title: 'חומרים בעלי ייבוש מהיר'
      description: 'לוחות מוכנים להשכרה הבאה בתוך פחות מ-30 דקות.'
      icon: 'tabler:droplet'
    - title: 'אחסון נערם'
      description: 'עיצוב חוסך מקום — אחסנו 40% יותר לוחות באותו שטח.'
      icon: 'tabler:stack'
    - title: 'גדלים מסומנים בצבע'
      description: 'הצוות מוצא את הלוח הנכון מיד עם מידות מסומנות בצבע.'
      icon: 'tabler:color-swatch'

stats:
  title: 'מדדי תפעול'
  stats:
    - title: 'קצב חילופי לוח'
      amount: '< 5 דקות'
    - title: 'תחזוקה שנתית'
      amount: '~15 דקות/לוח'
    - title: 'משלוח חלקים'
      amount: '48 שעות'
    - title: 'שיעור פגמים'
      amount: '< 0.5%'

fleet_guide:
  title: 'מדריך לגודל צי'
  subtitle: 'העריכו את גודל הצי ואת פוטנציאל ההכנסות עבור פעילות ההשכרה שלכם.'
  tiers:
    - label: 'קיוסק קטן'
      boards: '15-20'
      revenue: 'XX,XXX USD לשנה'
    - label: 'פעילות בינונית'
      boards: '30-50'
      revenue: 'XX,XXX USD לשנה'
    - label: 'השכרת חוף גדולה'
      boards: '50-100'
      revenue: 'XXX,XXX USD לשנה'

cta:
  title: 'מוכנים להגדיל את עסק ההשכרה שלכם?'
  subtitle: 'קבלו תמחור השכרה או השוו דגמי לוחות עבור הפעילות שלכם.'
  actions:
    - text: 'קבלו תמחור השכרה'

hero:
  tagline: 'מעבדת בקרת איכות'
  title: 'מעבדת בדיקות והבטחת איכות'
  subtitle: 'מעבדת איכות עצמאית עם תהליכי ISO 9001 — כל יחידה נבדקת לפני המשלוח'

intro: 'afarer מפעילה מעבדת בקרת איכות ייעודית הפועלת באופן עצמאי מהייצור. כל מחלקה של חומר גלם וכל לוח מוגמר עוברים דרך פרוטוקולי בדיקה מתועדים לפני השחרור. צוות בקרת האיכות שלנו מדווח ישירות להנהלה, מה שמבטיח החלטות איכות אובייקטיביות.'

highlights:
  - value: '100%'
    label: 'יחידות שנבדקות בלחץ'
    detail: 'כל תא, כל לוח'
  - value: '24–48 שעות'
    label: 'משך בדיקת אחזקת אוויר'
    detail: 'בלחץ של פי 1.25 מהלחץ המדורג'
  - value: 'פחות מ-5%'
    label: 'ירידת לחץ מרבית מותרת'
    detail: 'לאורך תקופת ההחזקה של 24–48 שעות'
  - value: 'AQL 2.5'
    label: 'סף מותר לפגמים עיקריים'
    detail: 'לפי דגימת ISO 2859'

test_procedures:
  - title: 'בדיקת חומרי גלם'
    description: 'כל מחלקה נכנסת של PVC, בד Drop-Stitch וחומרה נבדקת לפני קבלה. חוזק מתיחה (ASTM D751), עמידות לקריעה (ISO 4674) ועמידות UV מאומתים. חומרים שאינם עומדים בדרישות מוכנסים לבידוד ומוחזרים.'
    standards:
      - 'ASTM D751 (מתיחה)'
      - 'ISO 4674 (קריעה)'
      - 'ISO 4892 (UV)'
  - title: 'נקודות ביקורת איכות בתהליך'
    description: 'מפעילי הייצור מבצעים בדיקה עצמית בכל שלב. מבקרי בקרת איכות מבצעים דגימה אקראית לאורך המשמרת. בדיקות קילוף ריתוך מבוצעות כל 50 יחידות. בדיקות ממדים מתבצעות בכל לוח ה-20.'
    standards:
      - 'ASTM D751 (קילוף)'
      - 'רשימת בדיקה פנימית של 100 נקודות'
      - 'דגימת ISO 2859'
  - title: 'בדיקת אחזקת אוויר של 24–48 שעות'
    description: 'כל תא צינור מנופח ל-125% מהלחץ המדורג ומוחזק למשך 24–48 שעות. חיישני לחץ רושמים ברציפות עם פיצוי טמפרטורה. כל תא שחורג מירידת לחץ של 5% מפעיל בדיקה חוזרת אוטומטית של המחלקה.'
    standards:
      - 'EN ISO 25649'
      - 'CE 2013/53/EU'
  - title: 'בדיקות עומס ואיזון'
    description: 'לוחות מוגמרים נבדקים בקיבולת המדורגת המרבית ליציבות ולקשיחות. כל לוח עובר בדיקה במים לפני אישור הבדיקה הסופית.'
    standards:
      - 'ISO 12217'
      - 'CE 2013/53/EU'


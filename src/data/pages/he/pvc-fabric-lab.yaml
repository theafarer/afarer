intro: 'בד הסיפון והדפנות הוא החומר הקריטי ביותר בלוח SUP ניפחים. עליו לעמוד בחשיפה מתמדת ל-UV, במחזורי ניפוח חוזרים, בשחיקה מול מזחים ופסולת, ובתנודות טמפרטורה קיצוניות — הכל תוך שמירה על שלמותו המבנית למשך שנים. ב-Afarer, מעבדת בדי ה-PVC מוקדשת באופן בלעדי לאפיון, לאימות ולשיפור מתמיד של הבדים שבהם אנו משתמשים בכל לוח שאנו בונים.'

content_html: |
  <h2>היסוד של כל לוח SUP ניפחים</h2>
  <p>איננו מסתמכים אך ורק על גיליונות הנתונים של הספקים. כל מחזור של בד PVC שנכנס לסדנה שלנו נבדק באופן עצמאי בבית. זה מבטיח שמפרט החומר שאנו מפרסמים הוא בדיוק ביצועי החומר שאתם מקבלים — לוט אחר לוט, שנה אחרי שנה.</p>

  <h2>ציוד בדיקה מתוקנן</h2>
  <p>מעבדת הבדים שלנו מצוידת בכלים ברמה תעשייתית העומדים בשיטות הבדיקה של ISO, ASTM ו-EN:</p>
  <table>
    <thead><tr><th>ציוד</th><th>פרמטרים הנמדדים</th><th>תקן</th></tr></thead>
    <tbody>
      <tr><td>בודק מתיחה אוניברסלי (50 kN)</td><td>כוח קריעה, התארכות בעת קריעה, התפשטות קריעה</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>תא בליית קשת קסנון</td><td>עמידות ל-UV (שינוי צבע, שימור חוזק לאחר 2000 שעות)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>בודק גמישות בטמפרטורה נמוכה</td><td>נקודת סדיקה בטמפרטורות של -30 °C עד -50 °C</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>בודק שחיקה מסוג Taber</td><td>איבוד משקל לאחר 1000 מחזורים (גלגל CS-10)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>מד עובי (דיגיטלי, רזולוציה של 0.001 מ״מ)</td><td>אחידות לרוחב הגליל</td><td>ISO 2286-3</td></tr>
      <tr><td>בודק עמוד הידרוסטטי</td><td>עמידות לחדירת מים</td><td>ISO 811</td></tr>
    </tbody>
  </table>
  <p class="text-sm text-gray-500">* כל הציוד מכויל מדי שנה על ידי מעבדות מוסמכות של צד שלישי.</p>

  <h2>מנתונים להחלטה: תהליך בדיקה טיפוסי</h2>
  <p>כאשר מגיע בד מועמד חדש, הוא עובר תהליך הסמכה מתוקנן של שבעה שלבים:</p>
  <ol>
    <li><strong>בדיקת קבלה</strong> — בדיקה ויזואלית של פגמי שטח, נקבים זעירים ועמידה ממדית.</li>
    <li><strong>מיפוי עובי</strong> — מדידה ב-20 נקודות לרוחב הגליל; לקבלה נדרש CV &lt; 3%.</li>
    <li><strong>בדיקת מתיחה</strong> — 5 דגימות בכיווני השתי והערב. מינימום 3500 N/50 מ״מ עבור PVC 1100 dtex.</li>
    <li><strong>התניה ב-UV</strong> — חשיפה של 1000 שעות בתא קשת קסנון; נדרש שימור חוזק מינימלי של 80 %.</li>
    <li><strong>סדקי קור</strong> — 4 שעות בטמפרטורה של -35 °C, ולאחר מכן כיפוף של 180° מעל מנדרל בקוטר 25 מ״מ. ללא סדקים נראים לעין.</li>
    <li><strong>עמידות לשחיקה</strong> — 1000 מחזורים, איבוד משקל ≤ 0.05 גרם.</li>
    <li><strong>אישור סופי</strong> — רק לאחר מעבר כל שבעת השערים הבד משוחרר לייצור.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">PVC טיפוסי 1100 dtex — שימור מתיחה לאחר חשיפה ל-UV</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 שע׳<br />100%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 שע׳<br />95%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 שע׳<br />88%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 שע׳<br />82%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">מתחרה<br />~65%</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">בד ה-PVC 1100 dtex שלנו שומר על חוזק מתיחה של למעלה מ-80 % לאחר חשיפה של 2000 שעות לקשת קסנון, בהשוואה לדרגות תעשייתיות טיפוסיות שיורדות מתחת ל-70 %.</p>
  </div>

  <h2>הצוות המקצועי שלנו</h2>
  <p>במעבדה מועסקים שני מהנדסי חומרים במשרה מלאה, שלכל אחד מהם תואר במדע הפולימרים או בהנדסת טקסטיל ומינימום שש שנות ניסיון בענף. מסייעים להם שלושה טכנאים המבצעים את הבדיקות השוטפות ואת רישום הנתונים. הצוות משתתף באופן קבוע בניסויי סבב בין-מעבדתיים המאורגנים על ידי הארגון הבינלאומי לתקינה (ISO) לאימות הדיוק של שיטות הבדיקה שלנו.</p>

  <h2>פותרים אתגרי חומרים מורכבים</h2>
  <p>כל סביבה ימית שונה. לוח SUP להשכרה הפועל תחת שמש טרופית חשוף לעומסי UV וטמפרטורה שונים בתכלית מלוח אגם בקווי רוחב צפוניים. מעבדת הבדים שלנו עוזרת לכם לבחור — או לפתח — מפרט בד הממוטב לפרופיל ההפעלה שלכם.</p>
  <p>פתרונות מותאמים אחרונים כוללים:</p>
  <ul>
    <li>תערובת PVC עמידה במיוחד לשחיקה עבור לקוח צבאי שהלוחות שלו מושקים באופן קבוע מחופי אלמוגים וחופים סלעיים (+40 % חיי שחיקה).</li>
    <li>נוסחת PVC לטמפרטורות נמוכות עבור משלחת ארקטית, שנבדקה עד -50 °C ללא היווצרות שבירות.</li>
    <li>בד כתום מיוצב צבע עבור צי לוחות הצלה וחילוץ, השומר על ניראות לאחר 3 שנות חשיפה לשמש טרופית.</li>
  </ul>
  <p>איננו מוכרים בדים ״מן המדף״ ומקווים שיעבדו. אנו בודקים, מאמתים וממליצים — או יוצרים — פתרון מותאם לפרופיל המשימה הספציפי שלכם. זהו ההבדל של Afarer.</p>

  <h2>כיצד אנו משרתים אתכם</h2>
  <p>כאשר אתם מביאים אלינו אתגר חומרים, הנה מה שתוכלו לצפות לו:</p>
  <ol>
    <li><strong>ייעוץ</strong> — אנו דנים בסביבת ההפעלה שלכם, ביעדי הביצועים ובתקציב.</li>
    <li><strong>הצעה</strong> — נוסחת תוכנית בדיקה עם קריטריוני מעבר/כשל ברורים ולוח זמנים.</li>
    <li><strong>ביצוע</strong> — המעבדה שלנו מריצה את הבדיקות ומפיקה דוח מפורט עם נתוני גלם וניתוח השוואתי.</li>
    <li><strong>המלצה</strong> — אנו מציגים מפרט בד, לרבות אפשרויות חלופיות אם מספר חומרים עונים לדרישותיכם.</li>
    <li><strong>מעקב</strong> — לאחר המסירה, אנו נשארים זמינים לתמיכה בכל שאלה בנושא חומרים בשירות.</li>
  </ol>
  <p>המטרה שלנו אינה רק למכור לכם לוח. היא להבטיח שהלוח שתקבלו יפעל באופן אמין בתנאים שבהם אתם חותרים — וזה מתחיל בבד.</p>


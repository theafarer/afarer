how_to_choose:
  title: כיצד לבחור את המידה הנכונה
  cards:
    - title: לוחות SUP
      description: בחרו אורך בהתאם למשקל שלכם ולשימוש המיועד. לוחות רחבים יותר (32 אינץ׳ ומעלה) מציעים יותר יציבות. לוחות ארוכים יותר (11-12 רגל) שומרים טוב יותר על מסלול בטיולים. חותרים כבדים יותר זקוקים ללוחות בנפח גבוה יותר.
    - title: לוחות SUP לטיולים
      description: לוחות ארוכים יותר (11–12 רגל) הם הטובים ביותר לכיסוי מרחקים ולטיולים. לוחות רחבים יותר (32 אינץ׳ ומעלה) מציעים יותר יציבות. בדקו את קיבולת המשקל לעומס הכולל כולל ציוד.
    - title: לוחות SUP כלליים
      description: בחרו אורך לפי משקל הרוכב והשימוש המיועד. לוחות כלליים מתאימים לפנאי, לכושר וליוגה. לוחות קטנים יותר זריזים יותר.

hero:
  tagline: 'טכנולוגיה'
  title: 'בנוי לביצועים'
  subtitle: 'כל לוח SUP ניפחים של afarer מהונדס עם מבנה Drop-Stitch ו-PVC בדרגה ימית — חומרים מדויקים ושיטות ייצור שנבדקו לסביבות ימיות תובעניות.'

sections:
  - title: 'ליבת Drop-Stitch'
    description: 'אלפי חוטי פוליאסטר פנימיים מחברים בין השכבה העליונה לתחתונה ויוצרים מבנה קשיח בלחץ 12-15 PSI. זו אותה הטכנולוגיה המשמשת בלוחות חתירה מקצועיים ובלוחות SUP מרוצים ניפחים.'
    imageAlt: 'דיאגרמת ליבת DS'
  - title: 'PVC בדרגה ימית'
    description: 'בד PVC מרובה שכבות בלמינציה המדורג לסביבות ימיות. כל שכבה מרותכת בהיתוך ולא מודבקת, מה שמבטל סיכוני היפרדות שכבות. נבדק לעמידות UV, קורוזיה במי ים ושחיקה.'
    imageAlt: 'שכבת PVC'
  - title: 'PVC בדרגה צבאית'
    description: 'בשימוש בכל דגמי ה-SUP, PVC פרימיום מספק עמידות עדיפה ל-UV ולכימיקלים. שומר על גמישות בטמפרטורות קיצוניות ומתנגד להתדרדרות.'
    imageAlt: 'PVC'
  - title: 'סיפון אוויר'
    description: 'מבנה Drop-Stitch ניפח בלחץ גבוה המספק קשיחות יוצאת דופן לעמידה, לדיג וליוגה. מקטין זמן הכנה, משקל כולל ונפח אחסון.'
    imageAlt: 'סיפון אוויר'


services:
  - title: 'עיצוב מוצר והנדסה'
    description: 'צוות המו״פ הפנימי שלנו עובד עם הקונספט או המפרט שלכם כדי לפתח שרטוטי CAD, מודלים תלת-ממדיים ואבות טיפוס. אנו מציעים עיצוב תבניות, מיטוב צורת גוף והכוונה בבחירת חומרים.'
  - title: 'מיתוג וגרפיקה מותאמים אישית'
    description: 'הדפסה דיגיטלית בצבע מלא, הדפסת משי, הטבעה ואפשרויות תווית. אנו מפתחים גרפיקת סיפון ייעודית למותג, מיתוג צינורות ואריזה מוכנה לקמעונאות.'
  - title: 'התאמת חומרים ומפרט'
    description: 'בחרו מתוך PVC (סטנדרטי, ידידותי לסביבה, עמיד באש), Drop-Stitch ומבנים היברידיים. צבעי צינור מותאמים אישית, משקלי בד ואפשרויות חיזוק.'
  - title: 'אריזה ולוגיסטיקה'
    description: 'אריזה קמעונאית מותאמת אישית, קופסאות מותג פרטי, אריזה בוואקום, הנחה על משטחים וטעינת מכולות. תנאי משלוח FOB צ׳ינגדאו, CIF או DDP.'


why_us:
  - title: 'שילוב אנכי'
    description: 'המפעל, התבניות ושרשרת האספקה בבעלותנו — בלי מתווכים, בלי קבלני משנה. הדבר מקנה לנו שליטה באיכות, בעלות ובמסירה.'
  - title: 'הסמכה כפולה'
    description: 'ניהול איכות ISO 9001 והסמכת תאימות חברתית BSCI. דוחות ביקורת מפעל זמינים לפי בקשה.'
  - title: 'תאימות CE'
    description: 'כל הדגמים הסטנדרטיים נושאים הסמכת CE 2013/53/EU. דגמים מותאמים אישית ניתנים להסמכת CE באמצעות התהליך המבוסס שלנו.'
  - title: 'MOQ נמוך'
    description: 'התחילו עם 5 יחידות בלבד לדגמים סטנדרטיים. אנו עוזרים למותגים מתחילים להשיק מבלי להעמיס על מלאי.'

intro: 'SUP מתנפח אמין רק כמו התפרים שלו. ריתוך חלש אחד עלול לפגוע בתא שלם — ובים, כשל של תא אינו אי-נוחות; הוא מפגע בטיחותי. ב-afarer השקענו במרכז ריתוך ייעודי בתדר רדיו (RF) המשלב מכבשי ריתוך דיאלקטריים בדרגה תעשייתית עם בקרת תהליך קפדנית ובדיקות לאחר ריתוך. כל תפר שאנו מייצרים מתועד, ניתן למעקב ומוסמך כעומד בדרישות EN ISO 25649 או עולה עליהן — התקן האירופי לציוד פנאי מתנפח.'

content_html: |
  <h2>המדע שמאחורי התפר</h2>
  <p>ריתוך RF משתמש באנרגיה אלקטרומגנטית בתדירות גבוהה (בדרך כלל 27.12 MHz) כדי לעורר את המולקולות הקוטביות בתוך בד מצופה PVC, ולייצר חום בדיוק בממשק החומר. בניגוד לריתוך באוויר חם או בטריז חם, ריתוך RF יוצר קשר מולקולרי אמיתי — שתי שכבות הבד מתמזגות לחומר הומוגני יחיד באזור הריתוך, ונוצר חיבור החזק כמו חומר האם עצמו.</p>

  <h2>ציוד ריתוך ובקרת תהליך</h2>
  <p>מרכז הריתוך שלנו מצויד ב:</p>
  <table>
    <thead><tr><th>מכונה</th><th>הספק / קיבולת</th><th>יישום</th></tr></thead>
    <tbody>
      <tr><td>מכבש RF דיאלקטרי 1</td><td>15 kW, לוח 2000 × 600 מ״מ</td><td>תפרים אורכיים ראשיים, חיבורי מסילה לגוף השיט</td></tr>
      <tr><td>מכבש RF דיאלקטרי 2</td><td>10 kW, לוח 1500 × 500 מ״מ</td><td>ריתוכי מחיצות, חיבורי סגירת מסילות, טלאי שסתומים</td></tr>
      <tr><td>מרתך RF מבוקר CNC</td><td>8 kW, שולחן XY 2500 × 1200 מ״מ</td><td>תפרים מעוקלים, טבעות לוגו/פאנלים, עבודת טלאים מדויקת</td></tr>
      <tr><td>מרתך טריז חם אוטומטי</td><td>טמפרטורה משתנה, עד 1.2 m/min</td><td>שיטת גיבוי לבדי מסילות PVC עבים ולעבודות תיקון</td></tr>
    </tbody>
  </table>
  <p>כל מכבש RF מצויד בניטור טמפרטורה ולחץ במעגל סגור. פרמטרי הריתוך — הספק, זמן לחיצה, זמן קירור, לחץ אלקטרודה — מתוכנתים לפי סוג החומר ונרשמים במערכת ביצוע הייצור (MES) שלנו לעקיבות מלאה.</p>

  <h2>בדיקות איכות ריתוך — כל תפר, כל לוח</h2>
  <p>שלמות הריתוך מאומתת באמצעות פרוטוקול חובה של ארבע בדיקות:</p>
  <ol>
    <li><strong>בדיקה חזותית</strong> — 100% מהתפרים נבדקים חזותית לאיתור כוויות חודרות, חוסר יישור, זיהום או היתוך חלקי. סף שיעור הדחיות: 0.5% מהמטרים הליניאריים.</li>
    <li><strong>בדיקת קילוף</strong> — רצועה ברוחב 25 מ״מ נחתכת מדגימת בדיקה שרותכה עם כל אצוות ייצור. כוח קילוף מינימלי: 120 N/25 מ״מ עבור PVC 1100 dtex.</li>
    <li><strong>בדיקת שמירת אוויר</strong> — כל תא שלם מועלה ללחץ של 1.5× מלחץ העבודה ומוחזק במשך 30 דקות. ירידת הלחץ לא תעלה על 2%.</li>
    <li><strong>בדיקת מחזורים תרמיים</strong> — דגימות בדיקה עוברות מחזורים מ-20 °C ועד +60 °C במשך 50 מחזורים, ואז נבדקות שוב בקילוף. אובדן חוזק מקובל: &lt; 10%.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">השוואת חוזק קילוף — ריתוך RF מול ריתוך באוויר חם (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">ריתוך RF</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">אוויר חם</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">מינימום</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">ריתוך RF משיג בעקביות 90-95% מחוזק חומר האם, הרבה מעל המינימום.</p>
  </div>

  <h2>מומחיות מקצועית</h2>
  <p>צוות הריתוך שלנו מנוהל על ידי מהנדס תהליך בכיר ותיק עם 11 שנות ניסיון בריתוך דיאלקטרי של טקסטיל מצופה. כל מפעיל משלים תוכנית הסמכה פנימית של 6 חודשים בטרם הותר לו לעבוד על תפרי ייצור. נדרשת הסמכה מחדש מדי שנה, ובכללה בדיקת ריתוך מעשית המוערכת מול הסטנדרט הפנימי שלנו בדרגה A (חוזק קילוף ≥ 160 N/25 מ״מ).</p>

  <h2>פתרונות ריתוך מותאמים לדרישות ייחודיות</h2>
  <p>אנו מבינים שמפרט ריתוך אחד אינו מתאים לכל יישום. מרכז הריתוך RF שלנו מפתח באופן שגרתי תצורות תפר מותאמות עבור לקוחות בעלי דרישות מיוחדות:</p>
  <ul>
    <li><strong>טלאי חיזוק רב-שכבתיים</strong> — עבור אזורים בשחיקה גבוהה כגון מסילות החרטום והירכתיים, אנו מפתחים ריתוכי RF רב-שלביים המשלבים שכבה חיצונית עמידה לשחיקה מבלי לפגוע בגמישות.</li>
    <li><strong>תפרים מוליכים או אטומים ל-RF</strong> — עבור יישומים צבאיים או יישומי מעקב הדורשים מיסוך אלקטרומגנטי, אנו מרתכים שכבות רשת מוליכה בתוך ערימת התפר.</li>
    <li><strong>ריתוך פאנלים בשינוי צבע</strong> — פאנלי בד דו-צבעיים (למשל גוף כתום + סיפון אפור) מרותכים בחפיפה מוסתרת לשמירה על אסתטיקת המותג ללא קו חיבור נראה לעין.</li>
  </ul>

  <h2>המחויבות שלנו כלפיכם</h2>
  <p>כל לוח שאנו מוסרים נושא את ערבון איכות הריתוך שלנו: אם תפר כלשהו נכשל בשירות רגיל במהלך תקופת האחריות, אנו מתקנים או מחליפים את התא הפגוע ללא עלות, ומתבצעת חקירת שורש הבעיה למניעת הישנות. זו אינה רק אחריות מוצר — זו מחויבות לשיפור מתמיד המונע על ידי נתונים תפעוליים מהעולם האמיתי.</p>
  <p>כשאתם בוחרים ב-afarer, אתם בוחרים בתפרים מהונדסים, נבדקים ומתועדים — לא רק מרותכים. זה ההבדל בין לוח שצף לבין לוח שמבצע.</p>


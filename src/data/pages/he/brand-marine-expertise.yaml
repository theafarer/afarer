meta:
  title: 'מומחיות ימית — הנדסה בכל גוף | {SITE}'
  description: 'עשרות שנות הנדסה ימית בכל גוף. afarer שולטת ב-Drop-Stitch, ב-PVC ימי ובעיצוב SUP ניפחים מקצועי.'
  keywords:
    - 'הנדסה ימית'
    - 'יצרן SUP ניפחים'
    - 'ייצור לוחות חתירה'
hero:
  tagline: 'מומחיות ימית'
  title: 'עשרות שנות הנדסה ימית<br />בכל גוף'
  subtitle: 'afarer משלבת מדע חומרים עמוק, ייצור מדויק ובדיקות בתנאים אמיתיים כדי לייצר כלי שיט שמתפקדים כשזה חשוב.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'צוות ההנדסה הימית והמו״פ של afarer בעבודה'
expertise_materials:
  tagline: 'מדע חומרים'
  title: 'בחירת החומר הנכון<br />לכל יישום'
  subtitle: 'אנו עובדים עם שני חומרי ליבה — כל אחד נבחר עבור מקרי שימוש ודרישות ביצועים ספציפיים.'
  columns: 3
  items:
    - title: 'PVC בדרגה ימית'
      description: 'בד PVC בעוצמת 1100 דנייר — החומר הרב-גוני ביותר שלנו. מיוצב UV, עמיד לשחיקה ועומד בדרישות REACH. אידיאלי ללוחות SUP שבהם משקל ויעילות עלות חשובים.'
      icon: tabler:droplet
    - title: 'פיברגלס ופוליאתילן'
      description: 'לוחות SUP מצופי פיברגלס לקשיחות והחלקה פרימיום. פוליאתילן ברוטומולדינג לשימוש כבד בהשכרה ובחילוץ הדורש עמידות מקסימלית לפגיעות.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'יכולות ייצור'
  title: 'ייצור מדויק<br />בכל שלב'
  subtitle: 'המתקן שלנו בשטח 12,000 מ״ר מצויד במכונות מיוחדות לכל שלבי הייצור.'
  columns: 2
  items:
    - title: 'חיתוך CNC'
      description: 'חיתוך בבקרה ממוחשבת מבטיח לוחות בד מדויקים וחזרים עם בזבוז מינימלי. כל חלק מתאים בדיוק כפי שתוכנן.'
      icon: tabler:cpu
    - title: 'ריתוך בתדירות גבוהה'
      description: 'ריתוך HF תעשייתי יוצר תפרים חזקים יותר מחומר הבסיס. בקרת טמפרטורה ולחץ עקבית מבטיחה אטימות לאוויר בכל ריצת ייצור.'
      icon: tabler:bolt
    - title: 'הרכבת ליבת Drop-Stitch'
      description: 'אלפי חוטי פוליאסטר מחברים בין שכבות הבד העליונה והתחתונה, ומאפשרים ניפוח בלחץ גבוה (15-20 PSI) ללוחות SUP קשיחים ויציבים.'
      icon: tabler:building-arch
    - title: 'בדיקות לחץ'
      description: 'כל מוצר ניפחים עובר בדיקת לחץ לפני המשלוח. הלוחות נבדקים בלחץ של פי 1.25 מהלחץ המדורג — אם הוא עומד שם, הוא יתפקד על המים.'
      icon: tabler:wind
    - title: 'בדיקת חוזק תפרים'
      description: 'דגימות אקראיות מכל מחלקת ייצור עוברות בדיקת חוזק תפרים הרסנית. התוצאות נרשמות וניתנות למעקב עד לריצות ייצור ספציפיות.'
      icon: tabler:files
    - title: 'בדיקות במים'
      description: 'כל דגם עובר הפלגות ניסוי בים לפני ההסמכה. בדיקות בתנאים אמיתיים בסביבת חוף מאמתות ביצועים, התנהגות ויציבות.'
      icon: tabler:droplet
expertise_design:
  tagline: 'עיצוב והנדסה'
  title: 'מהונדס לתנאים אמיתיים'
  subtitle: 'פילוסופיית העיצוב שלנו מתחילה באופן שבו הלוח ישמש — ואז בונה את ההנדסה סביב מקרה השימוש הזה.'
  items:
    - title: 'עיצוב גוף לביצועים'
      description: 'צורת כל גוף מכווננת למקרה השימוש שלו — חרטום דחיפה להחלקה בטיולים, רוקר מוגבר לזריזות בגלים, פרופילים שטוחים ויציבים לדיג וליוגה.'
    - title: 'בטיחות Drop-Stitch'
      description: 'כל לוח כולל ליבת Drop-Stitch קשיחה עם דפנות מחוזקות. אם מקטע נפגע, מבנה ה-Drop-Stitch הכוחני שומר על הלוח תפעולי.'
    - title: 'פריסת סיפון ארגונומית'
      description: 'חלוקת שכבת הסיפון, מיקום ידית הנשיאה ונקודות ההרכבה מעוצבים סביב נוחות הרוכב בשימוש ממושך — בטיולים, בדיג או בסיורים.'
    - title: 'תצורה מותאמת אישית'
      description: 'צבעי דפנות, תצורת שכבת סיפון, עגנים לאביזרים, קיבולת ציוד — כל דגם ניתן להתאמה אישית לדרישות תפעוליות ספציפיות.'
cta:
  title: 'יש לכם יישום ספציפי בראש?'
  subtitle: 'צוות ההנדסה שלנו יכול לייעץ על בחירת חומרים, עיצוב וייצור עבור הפרויקט שלכם.'
  actions:

faqs:
  title: 'מותג משותף — שאלות נפוצות'
  subtitle: 'כיצד פועל המותג המשותף של Afarer, ובמה הוא נבדל מ-OEM וממותג פרטי.'
  items:
    - title: 'האם מותג משותף זהה ל-OEM או למותג פרטי?'
      description: 'לא. Afarer כבר אינה מפעילה תוכנית OEM/מותג פרטי פתוחה. מוצרים במותג משותף נשארים מוצרי Afarer — מעוצבים, מהונדסים, נבדקים בבקרת איכות ומגובים על ידי המותג Afarer. הזהות שלכם מופיעה כמותג שותף, ולא כמוצר ללא מיתוג של צד שלישי.'
    - title: 'מי יכול להתחיל פרויקט מותג משותף?'
      description: 'עסקי ספורט ימי מוסמכים: שותפים ארציים קיימים, מועדוני חתירה, אתרי נופש ומלונות, מארגני אירועים וקהילות. שלחו לנו תדריך פרויקט ונאשר את ההתאמה לפני שמתחילה עבודת העיצוב.'
    - title: 'האם המותג המשותף יתנגש עם המפיץ הארצי שלי?'
      description: 'לא. מודל המדינה-אחת-מפיץ-אחד מקבל עדיפות. אוספי מותג משותף מתואמים עם השותף הארצי המקומי במקום שבו קיים כזה, כך שלא מופיע מותג מקביל או מתחרה בתוך טריטוריה מוגנת.'
    - title: 'מהי כמות ההזמנה המינימלית לאוסף במותג משותף?'
      description: 'אוספי פיילוט מתחילים ב-30–50 יחידות. אוספים סטנדרטיים כוללים 50–100 יחידות; מהדורות גדולות או רב-אזוריות כוללות 100+ יחידות. לוחות זמנים לפיתוח בהתאמה אישית נקבעים לפי פרויקט.'
    - title: 'מה נחשב לאיכות Afarer לעומת תרומת השותף?'
      description: 'Afarer אחראית לעיצוב המוצר, להנדסה, לחומרים, למבנה, לבקרת האיכות ולאחריות. השותפים תורמים את הקונספט של האוסף, את השמות, את הצבעים, את הגרפיקה ואת ההשקה השיווקית. כך נשמר תקן איכות אחד על המים.'
    - title: 'כיצד מגישים בקשה?'
      description: 'מלאו את טופס הפנייה למותג משותף עם פרטי העסק, השוק ורעיון האוסף שלכם. אנו נבחן את ההתאמה ונשיב בתוך 3 ימי עסקים עם הצעה ועם הסכם פרויקט המותג המשותף.'

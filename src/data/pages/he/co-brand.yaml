features:
  title: 'מה משמעות המותג המשותף ב-Afarer'
  subtitle: 'מותג משותף היא תוכנית שותפות העיצוב שלנו — בנויה סביב המותג Afarer, הגנה טריטוריאלית ואוספים מוגבלים, ולא ייצור ללא מיתוג.'
  columns: 3
  items:
    - title: 'מוצרי Afarer נשארים מוצרי Afarer'
      description: 'אוסף במותג משותף הוא מהדורה מוגבלת של לוחות Afarer עם הזהות שלכם שזורה בה. הוא לעולם אינו ללא מיתוג, לעולם אינו מותג של צד שלישי, ולעולם אינו תוכנית מותג פרטי פתוחה.'
      icon: 'tabler:trademark'
    - title: 'מעוצב איתכם'
      description: 'הצבעים, המתן שמות והסיפור שלכם מעצבים את האוסף. צוות העיצוב וההנדסה שלנו מטפל בסיפונים, בגרפיקה, באריזה ובתיעוד מהתדריך ועד המסירה.'
      icon: 'tabler:pencil'
    - title: 'למועדונים, אתרי נופש, אירועים וקהילות'
      description: 'אוספי צי למועדוני חתירה ולאתרי נופש, מהדורות אירוע למרוצים ולסדרות קהילתיות — כולם נושאים את האיכות והאחריות של Afarer.'
      icon: 'tabler:users'
    - title: 'מגן על שותפים ארציים'
      description: 'המותג המשותף פועל לצד מודל המדינה-אחת-מפיץ-אחד שלנו. שותפים לאומיים שומרים על הטריטוריה שלהם; אוספי מותג משותף אינם פותחים דלת למותגים מקבילים בשוק שלהם.'
      icon: 'tabler:shield-check'
    - title: 'תקני הנדסה ואיכות'
      description: 'כל אוסף נשלח משרשרת האספקה המוסמכת שלנו עם תיעוד CE ו-ISO 9001, בדיקות לחץ ואותן נקודות בקרת איכות כמו בסדרה המרכזית שלנו.'
      icon: 'tabler:certificate'
    - title: 'הופך לנכס מותג'
      description: 'אוסף מוגבל במותג משותף בונה את הסיפור שלכם על המים — מרווח מכירה, תוכן מדיה וסיבה לחותרים לחזור שנה אחר שנה.'
      icon: 'tabler:star'

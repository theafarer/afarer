content_html: |
  <h2>מהי הסמכת CE?</h2>
  <p>סימון CE (Conformit&eacute; Europ&eacute;enne) מעיד שהמוצר עומד בדרישות הבריאות, הבטיחות והסביבה של האיחוד האירופי. עבור כלי שיט ניפחים, המסגרת הרגולטורית הרלוונטית תלויה בקטגוריית המוצר.</p>

  <h2>הנחיות חלות</h2>

  <h3>הנחיית כלי שיט לפנאי (2013/53/EU)</h3>
  <p>ההנחיה העיקרית לכלי שיט לפנאי באיחוד האירופי. לוחות SUP ניפחים מתחת ל-2.4 מ׳ נמצאים מחוץ לתחולתה ומוסמכים במקום זאת לפי EN ISO 25649.</p>

  <h3>תקנה לציוד מגן אישי (2016/425)</h3>
  <p>אפודי הצלה, אמצעי ציפה וציוד בטיחות המסופקים עם כלי שיט חייבים לעמוד בדרישות תקנת ציוד מגן אישי, כולל בחינת דגם (מודול B) על ידי גוף מודיע והבטחת איכות ייצור (מודול D או E).</p>

  <h2>תהליך ההסמכה</h2>
  <ol>
    <li>סיווג מוצר: קביעת קטגוריית תכנון כלי השיט (A – D לפי ISO 8666)</li>
    <li>תקנים חלים: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (לוחית היצרן)</li>
    <li>הכנת תיק טכני: שרטוטי תכנון, רשימת חומרים, תעודות חומרים, הערכת סיכונים</li>
    <li>בדיקות דגם: ציפה, יציבות, קיבולת עומס, בדיקות חומרים, חוזק תפרים, אחזקת אוויר</li>
    <li>בקרת ייצור במפעל: ביקורת של גוף מודיע על תהליכי הייצור</li>
    <li>הצהרת התאמה: היצרן חותם על הצהרת ההתאמה ומצמיד סימון CE</li>
  </ol>

  <h2>גופים מודיעים לכלי שיט ניפחים</h2>
  <p>גופים מודיעים נפוצים כוללים את Bureau Veritas (צרפת), DNV GL (גרמניה), RINA (איטליה), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (גרמניה).</p>

  <h2>לוחות זמנים ועלויות</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">שלב</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">משך</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">עלות טיפוסית (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">הכנת תיק טכני</td><td class="p-3 border">2 – 4 שבועות</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">בדיקות דגם</td><td class="p-3 border">4 – 8 שבועות</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">ביקורת מפעל</td><td class="p-3 border">1 – 2 ימים (באתר)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">סה״כ (מוצר ראשון)</td><td class="p-3 border">8 – 14 שבועות</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>מה זה אומר לקונים</h2>
  <p>ברכישת לוחות SUP ניפחים מוסמכי CE, ודאו תמיד שסימון ה-CE מופיע על לוחית היצרן, שקיימת הצהרת התאמה תקפה, שמספר הגוף המודיע מופיע, ושמדריך למשתמש כולל הוראות בטיחות בשפתכם המקומית. כל מוצרי Afarer נושאים הסמכת CE עם מעקביות מלאה עד דוחות ביקורת של הגוף המודיע.</p>


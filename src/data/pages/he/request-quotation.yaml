meta:
  title: 'בקשת הצעת מחיר — ייצור SUP מסוג OEM | {SITE}'
  description: 'בקשו הצעת מחיר מפורטת לפרויקט לוחות ה-SUP הניפחים שלכם. ייצור OEM/ODM, מותג פרטי או ציים מותאמים אישית — אנו מגיבים בתוך 2 ימי עסקים.'
  keywords:
    - 'בקשת הצעת מחיר ל-sup'
    - 'הצעת מחיר ללוח חתירה oem'
    - 'הצעת מחיר ממפעל sup'
    - 'מחיר sup ניפחים'
hero_text:
  tagline: 'קבלת הצעת מחיר'
  title: 'בקשת הצעת מחיר<br />לפרויקט שלכם'
  subtitle: 'ספרו לנו על הדרישות שלכם והצוות שלנו יגיב עם הצעת מחיר מפורטת בתוך 2 ימי עסקים.'
steps2_process:
  title: 'כיצד זה עובד'
  subtitle: 'ארבעה שלבים פשוטים מהפנייה ועד הצעת המחיר.'
  items:
    - title: 'שלב 1: הגשת הדרישות שלכם'
      description: 'מלאו את הטופס למטה עם סוג המוצר, הכמות והמפרט שלכם. ככל שתספקו יותר פרטים, הצעת המחיר שלכם תהיה מדויקת יותר.'
      icon: tabler:file-text
    - title: 'שלב 2: אנו סוקרים ומייעצים'
      description: 'צוות ההנדסה שלנו סוקר את הדרישות שלכם ועשוי ליצור איתכם קשר לצורך הבהרות. אנו מספקים המלצות על תצורת המוצר והאפשרויות.'
      icon: tabler:users
    - title: 'שלב 3: קבלת הצעת המחיר'
      description: 'אתם מקבלים הצעת מחיר מפורטת הכוללת תמחור ליחידה, MOQ, זמן אספקה, תנאי תשלום ואפשרויות משלוח. בדרך כלל בתוך 48 שעות.'
      icon: tabler:currency-dollar
    - title: 'שלב 4: דגימה וייצור'
      description: 'לאחר קבלת הצעת המחיר, אנו עוברים לייצור דגימה (אם רלוונטי) או ישירות לייצור סדרתי. עדכונים קבועים לאורך כל התהליך.'
      icon: tabler:building-factory
content_form:
  tagline: 'טופס הצעת מחיר'
  title: 'ספרו לנו על הפרויקט שלכם'
  subtitle: 'כל השדות המסומנים ב-* הם שדות חובה.'
  contact_fields:
    firstName: 'שם פרטי'
    lastName: 'שם משפחה'
    companyName: 'שם החברה'
    email: 'דוא״ל'
  fields:
    - name: 'קטגוריית מוצר'
      type: select
      options:
        - 'לוח SUP'
        - 'SUP ניפחים'
        - 'לוח SUP ניפחים'
        - 'אפוד הצלה'
        - 'אביזר ימי'
        - 'OEM/ODM מותאם אישית'
    - name: 'יישום'
      type: select
      options:
        - 'מרכז צלילה'
        - 'דיג'
        - 'תיירות ימית / אתר נופש'
        - 'חיפוש והצלה'
        - 'ממשל / צבא'
        - 'OEM / מותג פרטי'
        - 'אישי / פנאי'
        - 'אחר'
    - name: 'כמות'
      type: text
      placeholder: 'למשל 50 יחידות'
    - name: 'שוק יעד'
      type: text
      placeholder: 'למשל אירופה, צפון אמריקה, המזרח התיכון'
    - name: 'מדינת אספקה'
      type: text
      placeholder: 'למשל איטליה, איחוד האמירויות, ארה״ב, אוסטרליה'
    - name: 'העדפת חומר'
      type: select
      options:
        - 'ללא העדפה'
        - 'PVC בדרגה ימית (1100 דטקס)'
        - 'גוף פיברגלס'
        - 'גוף אלומיניום'
    - name: 'דרישת הנעה'
      type: text
      placeholder: 'למשל מערך משוט סטנדרטי, משאבה חשמלית, צבעים מותאמים אישית'
    - name: 'התאמה אישית נדרשת'
      type: text
      placeholder: 'למשל צבעים מותאמים אישית, מיתוג/לוגו, אריזה, מתקנים מיוחדים'
    - name: 'לוח זמנים'
      type: text
      placeholder: 'למשל אספקה בתוך 90 יום'
    - name: 'דרישות נוספות'
      type: textarea
      placeholder: 'תארו את היישום שלכם, מפרטים טכניים או כל דרישה מיוחדת — כללו שרטוטי ייחוס, מפרטים או קישורים אם ישנם'
    - name: 'העלאת מפרט'
      type: file
      placeholder: 'העלו את גיליון המפרט, השרטוט או מסמך ייחוס (PDF, DWG, DXF)'
    - name: 'העלאת לוגו / גרפיקה'
      type: file
      placeholder: 'העלו את הלוגו או הגרפיקה שלכם למיתוג מותאם אישית (AI, EPS, PNG)'
cta:
  title: 'מעדיפים לדון בדוא״ל?'
  subtitle: 'שלחו את הפנייה שלכם ישירות לצוות המכירות שלנו ונגיב בתוך 24 שעות.'
  actions:
    - variant: primary
      text: 'שלחו לנו דוא״ל ישירות'
      href: /contact

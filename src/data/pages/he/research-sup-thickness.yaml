hero:
  tagline: 'הנדסה'
  title: 'כיצד לבחור עובי לוח SUP — ניתוח הנדסי'
  subtitle: 'זמן קריאה 6 דקות'

content_html: |
  <h2>שלושת העוביים הסטנדרטיים</h2>

  <h3>4״ (10 ס״מ) – טיולים וביצועים</h3>
  <ul>
    <li>קשיחות הגבוהה ביותר – פחות כיפוף תחת עומס</li>
    <li>הקל ביותר – פחות חומר, פחות נפח אוויר</li>
    <li>שמירה מעולה על מסלול – התנדנדות צידית מופחתת</li>
    <li>המהיר ביותר – גרר מופחת, החלקה קלה יותר</li>
    <li>הטוב ביותר עבור: טיולים, מרוצים, חתירה לכושר, חותרים מנוסים</li>
  </ul>

  <h3>5״ (12.7 ס״מ) – All-Around</h3>
  <ul>
    <li>קשיחות טובה – איזון בין גמישות לקשיחות</li>
    <li>משקל בינוני – שימוש סטנדרטי בחומרים</li>
    <li>יציבות ראשונית ומשנית טובה</li>
    <li>הטוב ביותר עבור: חתירת פנאי, מתחילים, שימוש מזדמן באגמים ובנהרות</li>
  </ul>

  <h3>6״ (15.2 ס״מ) – יציבות ויוגה</h3>
  <ul>
    <li>יציבות ראשונית הגבוהה ביותר – ציפה מסיבית</li>
    <li>הכבד ביותר – יותר חומר PVC, נפח אוויר גדול יותר</li>
    <li>האיטי ביותר – יותר גרר, קשה יותר לשמור על החלקה</li>
    <li>הטוב ביותר עבור: יוגה/כושר, חותרים כבדים (100+ ק״ג), תנאים גליים מאוד</li>
  </ul>

  <h2>ניתוח הנדסי</h2>
  <p>קשיחותו של לוח SUP ניפחים נקבעת על ידי לחץ האוויר הפנימי ומומנט ההתמד של חתך הרוחב של הלוח. בלחץ 20 PSI, לוח בעובי 4״ מציג כ-30% פחות שקיעה תחת עומס מלוח בעובי 6״ באותו רוחב ואורך. יציבות ראשונית נובעת מרוחב קו המים ומהציפה; יציבות משנית מושפעת מצורת הדפנות ומרוחב הלוח.</p>

  <h2>עובי לפי משקל החותר</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">משקל החותר</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">עובי מומלץ</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">מתחת ל-65 ק״ג</td><td class="p-3 border">4״</td></tr>
      <tr><td class="p-3 border">65 – 90 ק״ג</td><td class="p-3 border">5״</td></tr>
      <tr><td class="p-3 border">90 – 115 ק״ג</td><td class="p-3 border">5״ או 6״</td></tr>
      <tr><td class="p-3 border">מעל 115 ק״ג</td><td class="p-3 border">6״</td></tr>
    </tbody>
  </table>

  <h2>פשרה בין עובי ל-PSI</h2>
  <p>טעות נפוצה היא שלחץ PSI גבוה יותר יכול לפצות על עובי מופרז. בלחץ 25 PSI, לוח בעובי 6״ מציג יותר כיפוף מלוח בעובי 4״ בלחץ 15 PSI, מכיוון שהמומנט הגיאומטרי של ההתמד שולט במשוואת הקשיחות. עבור חותרים המכוונים לביצועים, לוח דק יותר בלחץ נמוך יותר משיג ביצועים טובים יותר מלוח עבה יותר בלחץ גבוה יותר.</p>

  <h2>סדרת Afarer</h2>
  <ul>
    <li><strong>לוחות בעובי 4״:</strong> סדרת Cheetah Touring – לוחות SUP לטיולים במידות 12׳ x 30״ x 4״ לכושר ולחתירת מרחקים</li>
    <li><strong>לוחות בעובי 5״:</strong> סדרת Cheetah All-Round – 10׳6״ x 32״ x 5״ לשימוש פנאי</li>
    <li><strong>לוחות בעובי 6״:</strong> סדרת Cheetah Ultra-Stable – 10׳ x 34״ x 6״ ליוגה, לחותרים גדולים ולפלטפורמות צילום</li>
  </ul>
  <p>כל הלוחות משתמשים בליבות Drop-Stitch מסוג 1,680 DTEX עם לחץ מדורג של 20 PSI ולמינציות PVC בעובי 1.2 מ״מ.</p>


body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    אחריות מוגבלת זו חלה על מוצרים ימיים ניפחים חדשים ממותג afarer שנרכשו ישירות מ-afarer או מסוחר או קמעונאי מורשה של afarer. תאריך התחולה הוא תאריך הרכישה הקמעונאית המקורי הניתן לאימות.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">כיסוי האחריות ומשכה</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 שנים</h3>
        <p class="text-sm text-gray-600 mt-1">שלמות בד הצינור הראשי (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 שנים</h3>
        <p class="text-sm text-gray-600 mt-1">שלמות מבנית של גוף פיברגלס</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 שנים</h3>
        <p class="text-sm text-gray-600 mt-1">יכולת החזקת אוויר בתפרי הצינורות הניפחים</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 שנים</h3>
        <p class="text-sm text-gray-600 mt-1">תפקוד שסתום הניפוח</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">שנה אחת</h3>
        <p class="text-sm text-gray-600 mt-1">אביזרים וחיבורי עזר המותקנים במפעל</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">שנה אחת*</h3>
        <p class="text-sm text-gray-600 mt-1">שימוש מסחרי, השכרה או צי — כל הרכיבים</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*שימוש מסחרי, ממשלתי, בשכר, השכרה או הדרכה מקצר את האחריות לשנה אחת. שימוש במרוצים או בתחרויות מבטל את האחריות לחלוטין.</p>
  </div>

  <h2>מה מכוסה</h2>
  <h3>בד הצינור הראשי (5 שנים)</h3>
  <p>afarer מעניק אחריות על בד הסיפון הראשי נגד הידרדרות נקבוביות הפוגעת באופן מהותי ביכולת המוצר לשמור על ניפוח תפעולי. הדבר חל על בד מצופה PVC ועל כל יתר חומרי בדי הסיפון המשמשים בייצור.</p>

  <h3>שלמות מבנית של גוף פיברגלס (5 שנים)</h3>
  <p>עבור מוצרים עם גוף מפלסטיק מחוזק פיברגלס (FRP), המבנה המרוכב הבסיסי מכוסה באחריות נגד כשל מבני עקב פגמים בחומרים או בעבודה.</p>

  <h3>יכולת החזקת אוויר בתפרי הצינורות הניפחים (5 שנים)</h3>
  <p>תפרי הצינורות הניפחים, במקומות החיבור במהלך הייצור, מכוסים באחריות נגד פגמי ייצור הגורמים לדליפת אוויר מהותית דרך התפר. בדיקה תקופתית ותחזוקה של לחצי ניפוח נאותים הם תנאי לכיסוי.</p>

  <h3>תפקוד שסתום הניפוח (5 שנים)</h3>
  <p>שסתומי ניפוח האוויר שהותקנו מלכתחילה על ידי afarer מכוסים באחריות נגד פגמי ייצור בחומרים או בעבודה המונעים מהשסתום להחזיק אוויר כפי שתוכנן.</p>

  <h3>אביזרים המותקנים במפעל (שנה אחת)</h3>
  <p>רכיבים וחיבורים המיוצרים על ידי afarer ומותקנים מלכתחילה במפעל מכוסים באחריות נגד פגמים בחומרים ובעבודה למשך שנה אחת. למעט פריטים של צד שלישי, המכוסים אך ורק באחריות היצרן שלהם.</p>

  <h2>מה אינו מכוסה</h2>
  <ul>
    <li>פגמים אסתטיים, לרבות שינוי צבע, כתמים, דהייה, הלבנה או כל שינוי במראה</li>
    <li>נקבים, חיתוכים, קרעים, קריעות או נזק פיזי אחר</li>
    <li>סדיקות שערות, סדקים, שחיקה, שפשוף או הידרדרות עקב חיכוך או מגע</li>
    <li>הידרדרות עקב חשיפה לקרינת UV, בליה או תנאי אקלים</li>
    <li>נזק ממגע עם דלקים, ממסים, חומצות, בסיסים או כימיקלים</li>
    <li>נזק עקב רשלנות, שימוש לא נכון, התעללות, תאונה או בלאי רגיל</li>
    <li>בעיות שטח בג׳לקוט או בצבע (שלפוחיות, סדיקות שערות, שינוי צבע, דהייה)</li>
    <li>נזק מחבטה, ממאמץ יתר, מהחזקה לקויה או מהובלה בנגרר</li>
    <li>נזק עקב ניפוח/ריקון לקוי או שימוש במכשירי ניפוח שאינם מאושרים</li>
    <li>ציוד, רכיבים או מערכות של צד שלישי (מכוסים על ידי יצרניהם)</li>
  </ul>

  <h2>חובת היצרן והסעד</h2>
  <p>חובתו הבלעדית והיחידה של afarer היא תיקון או החלפה, לפי בחירת afarer, של כל רכיב שנקבע כפגום בחומרים או בעבודה ומכוסה תחת אחריות זו. תיקונים או החלפות מבוצעים על ידי afarer או על ידי מרכז השירות המורשה שהוסמך על ידה. רכיבים שתוקנו או הוחלפו מכוסים באחריות רק למשך החלק שלא פג מתקופת האחריות המקורית.</p>

  <h2>תנאי האחריות</h2>
  <ul>
    <li><strong>רישום:</strong> יש לרשום את המוצר כראוי כפי שנדרש בתנאי האחריות.</li>
    <li><strong>תחזוקה:</strong> יש לתחזק את המוצר בהתאם להנחיות המפורסמות של afarer, לרבות בדיקה תקופתית ותחזוקה של לחצי ניפוח נאותים.</li>
    <li><strong>שיתוף פעולה:</strong> על הרוכש לשתף פעולה במלואו ובאופן מיידי עם afarer בכל הנוגע לתביעות אחריות.</li>
    <li><strong>הרוכש המקורי:</strong> אחריות זו מוענקת אך ורק לרוכש המשתמש הקצה המקורי ואינה ניתנת להעברה.</li>
  </ul>

  <h2>שימוש מסחרי</h2>
  <p>אם המוצר משמש לשימוש מסחרי, ממשלתי, ללא מטרות רווח, בשכר, השכרה, הדרכה או לכל מטרה אחרת שאינה שימוש פנאי פרטי, תקופת האחריות לכל הרכיבים מקוצרת לשנה (1) אחת מתאריך הרכישה הקמעונאית המקורי. שימוש במרוצים, בתחרויות מהירות או סיבולת מבטל מיד ובאופן בלתי הפיך את האחריות כולה.</p>

  <h2>כיצד להגיש תביעת אחריות</h2>
  <p>פנו ל-afarer או לסוחר המורשה שלכם עם הוכחת רכישה ותיאור מפורט של הבעיה. afarer יבחן את התביעה ויספק הנחיות לבדיקה ולשירות.</p>
  <p>לפניות בנוגע לשירות אחריות, צרו איתנו קשר דרך <a href="/contact" class="text-sky-600 underline">עמוד הקשר</a> שלנו עם מספר ההזמנה ופרטי המוצר.</p>

  <h2>פריטים של צד שלישי</h2>
  <p>ציוד, רכיבים או מערכות המיוצרים על ידי צדדים שלישיים (גם אם הותקנו על ידי afarer) מכוסים אך ורק בכל אחריות המוצעת על ידי יצרן המקור שלהם. afarer מסיר במפורש כל אחריות לפריטים כאלה של צד שלישי.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    הצהרת אחריות זו היא תקציר של אחריות היצרן המוגבלת המלאה של afarer. מסמך האחריות המשפטי המלא מחייב את כל תנאי האחריות וההגבלות. המפרט טעון שינוי ללא הודעה מוקדמת. afarer הוא מותג המופעל על ידי Aquafarer LLC (ארה״ב).
  </p>

features3_markets:
  tagline: 'שווקים מרכזיים'
  title: 'מומחיות אזורית<br />לדרישות מקומיות'
  subtitle: 'אנו מבינים שלשווקים שונים יש דרישות רגולטוריות, העדפות ומקרי שימוש שונים.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'אירופה ובריטניה'
      description: 'מוצרים מוסמכים CE. ביקוש רב ללוחות SUP בשווקי האיחוד האירופי. מפיצים בבריטניה מעריכים את זמני האספקה הקצרים שלנו.'
      icon: tabler:map-pin
    - title: 'צפון אמריקה'
      description: 'ייצור מאושר על ידי משמר החופים האמריקאי. מחסן בארה״ב במונטקלייר שבקליפורניה לאספקה מהירה לחוף המערבי. ביקוש גובר ללוחות SUP לדיג, לחילוץ ולפנאי.'
      icon: tabler:map-pin
    - title: 'אוסטרליה ואוקיאניה'
      description: 'שוק חזק ללוחות SUP ולאביזרי ספורט מים. מפיצים באוסטרליה מעריכים את מבנה ה-PVC עמיד ה-UV שלנו בתנאי שמש קשים. משלוח מהיר מהמתקן שלנו באסיה.'
      icon: tabler:map-pin
    - title: 'המזרח התיכון'
      description: 'ביקוש גובר לציוד הרפתקאות מים. לוחות ה-SUP המסחריים וציוד הבטיחות שלנו פופולריים בקרב מפעילי טיולים ומרכזי השכרה. תצורות מותאמות אישית לסביבות בטמפרטורות גבוהות.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'רשת הפצה'
  title: 'שותפות עם מפיצים<br />בכל העולם'
  subtitle: 'אנו עובדים עם מפיצי ציוד ימי מבוססים, מותגי ספורט מים וסוכנויות רכש ממשלתיות.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'תוכניות מותג משותף'
      description: 'ייצור במותג פרטי למותגי ספורט מים גלובליים. אנו מטפלים בכל — מהעיצוב, דרך הייצור ועד המשלוח הישיר.'
      icon: tabler:building
    - title: 'רשת מפיצים'
      description: 'מפיצים מורשים ביותר מ-20 מדינות מחזיקים מלאי ומספקים תמיכה מקומית. פניות של מפיצים חדשים יתקבלו בברכה.'
      icon: tabler:users
    - title: 'ממשל ומוסדות'
      description: 'אספקה ישירה למשמרות חופים, ארגוני חיפוש והצלה ותוכניות רכש צבאיות. עמידה בדרישות רכש מוסדי.'
      icon: tabler:building-community
steps2_logistics:
  title: 'לוגיסטיקה ותמיכה גלובלית'
  subtitle: 'מהמפעל ועד ליעד — אנו מנהלים את כל שרשרת האספקה.'
  items:
    - title: 'אפשרויות משלוח'
      description: 'משלוח ימי (FOB צ׳ינגדאו), משלוח אווירי להזמנות דחופות ושליח אקספרס לדגימות ולחלקי חילוף.'
      icon: tabler:truck-delivery
    - title: 'מחסן בארה״ב'
      description: 'מלאי המוחזק במונטקלייר שבקליפורניה לאספקה מהירה ברחבי צפון אמריקה. חוף מערבי: 2-3 ימים, מרכז: 3-4 ימים, חוף מזרחי: 4-5 ימים.'
      icon: tabler:building-warehouse
    - title: 'חלקי חילוף'
      description: 'חלקי חילוף ומוצצים מקוריים של afarer במלאי כל השנה. חלקים נפוצים נשלחים בתוך 24 שעות.'
      icon: tabler:package
    - title: 'תמיכה טכנית'
      description: 'קו ישיר לצוות ההנדסה שלנו לשאלות טכניות, ייעוץ תיקון ותמיכה בחלקי חילוף. אנו תומכים בלוחות שייצרנו לפני 20 שנה.'
      icon: tabler:headset
cta:
  title: 'רוצים להפוך למפיץ?'
  subtitle: 'אנו מרחיבים באופן פעיל את רשת ההפצה שלנו. צרו קשר עם צוות הייצוא שלנו לדון בהזדמנויות שותפות.'
  actions:
    - variant: primary
      text: 'פנייה לשותפות'
      href: /contact
    - text: 'צפו בטווח המוצרים שלנו'
      href: /products

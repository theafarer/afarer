meta:
  title: 'נוכחות גלובלית — יצרן SUP המשרת למעלה מ-50 מדינות | {SITE}'
  description: 'afarer מייצאת לוחות SUP ניפחים ליותר מ-50 מדינות בכל יבשת. יצרן וספק מקצועי למותגים, מפיצים וציים.'
  keywords:
    - 'יצרן sup גלובלי'
    - 'יצואן לוחות חתירה'
    - 'מפעל sup בסין'
    - 'ספק sup מקצועי'
hero:
  tagline: 'נוכחות גלובלית'
  title: 'משרתים למעלה מ-50 מדינות<br />בכל יבשת'
  subtitle: 'ממפעילי סיור חופיים באירופה, דרך מפיצי ספורט מים באוסטרליה ועד צוותי חילוץ במזרח התיכון — לוחות afarer נמצאים על המים בכל העולם.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'ייצור והפצה ימית גלובלית של afarer'

body: |
  <h2>מהו SUP מתנפח?</h2>
  <p>SUP מתנפח (גלשן חתירה בעמידה) הוא כלי שיט נייד העשוי מחומר PVC מסוג Drop-Stitch, ההופך קשיח בעת ניפוח ללחץ גבוה (12-15 PSI). בניגוד ללוחות קשיחים מסורתיים העשויים מקצף ופיברגלס, SUP מתנפח ניתן לריקון, לגלגול ולאחסון בנרתיק נשיאה בגודל תיק גב.</p>
  <p>למרות היותו מתנפח, SUP מודרני משתווה לקשיחות ולביצועים של לוחות קשיחים ברוב היישומים הפנאיים ובטיולים. החדשנות המרכזית היא <strong>מבנה Drop-Stitch</strong>: אלפי חוטי פוליאסטר מחברים את שכבות הבד העליונה והתחתונה ומונעים מהלוח להתנפח כבלון תחת לחץ.</p>

  <h2>כיצד זה עובד: טכנולוגיית Drop-Stitch</h2>
  <p>הליבה של כל SUP מתנפח היא בד ה-Drop-Stitch. במהלך הייצור נארגים אלפי חוטים בין שתי שכבות של בד מצופה PVC. כאשר הלוח מנופח:</p>
  <ul>
    <li>החוטים מושכים את הפאנלים העליון והתחתון למרחק קבוע זה מזה</li>
    <li>נוצרת פלטפורמה קשיחה ושטוחה העמידה בפני כיפוף וגמישות</li>
    <li>בלחץ 12-15 PSI משיג הלוח קשיחות הדומה ללוחות בעלי ליבת קצף EPS</li>
  </ul>

  <h2>רכיבים מרכזיים</h2>
  <ul>
    <li><strong>ליבת PVC מסוג Drop-Stitch</strong> — שכבת המבנה הראשית המקנה קשיחות</li>
    <li><strong>רצועות מסילה</strong> — קצוות מחוזקים המגינים מפני שחיקה ופגיעות</li>
    <li><strong>משטח סיפון מקצף EVA</strong> — משטח אנטי-החלקה לנוחות עמידה ולאחיזה</li>
    <li><strong>מערכת סנפירים</strong> — סנפירים נתיקים ליציבות כיוונית (בדרך כלל תצורת 2+1)</li>
    <li><strong>שסתום</strong> — שסתום חד-כיווני ללחץ גבוה לניפוח ולריקון</li>
  </ul>

  <h2>מקרי שימוש נפוצים</h2>
  <ul>
    <li><strong>חתירה במים שקטים</strong> — אגמים, מפרצים רגועים ונהרות בזרימה איטית</li>
    <li><strong>טיולים</strong> — חתירה למרחקים ארוכים במים פתוחים הדורשת יעילות דאייה</li>
    <li><strong>גלישה</strong> — גלים קטנים עד בינוניים (מתחילים עד רמת ביניים)</li>
    <li><strong>דיג</strong> — גישה שקטה למים רדודים עבור דייגים</li>
    <li><strong>כושר</strong> — יוגה על SUP, פילאטיס ואימון ליבה על המים</li>
    <li><strong>טיולים ונסיעות</strong> — עיצוב נייד ההופך אותו לאידיאלי לטיסות ולטיולי כביש</li>
  </ul>

  <h2>SUP מתנפח מול SUP קשיח: הבדלים מרכזיים</h2>
  <table>
    <tr><th>היבט</th><th>SUP מתנפח</th><th>SUP קשיח (EPS/פיברגלס)</th></tr>
    <tr><td>ניידות</td><td>מתקפל לתיק גב</td><td>דורש מתקן גג או רכב גדול</td></tr>
    <tr><td>עמידות</td><td>עמיד בפגיעות, ללא שקעים</td><td>עלול להיסדק, להשקע או להיפרד לשכבות</td></tr>
    <tr><td>אחסון</td><td>נכנס לארון או לתא מטען של רכב</td><td>דורש שטח אחסון ייעודי</td></tr>
    <tr><td>ביצועים</td><td>מצוין לפנאי ולטיולים</td><td>עדיף למרוצים ולגלישה מתקדמת</td></tr>
    <tr><td>נוחות למתחילים</td><td>סיפון רך יותר, סיכון פציעה נמוך יותר</td><td>משטח קשיח, פחות סלחני</td></tr>
    <tr><td>זמן הכנה</td><td>ניפוח של 3-5 דקות</td><td>מוכן מיד</td></tr>
  </table>

  <h2>כיצד לבחור את ה-SUP המתאים</h2>
  <p>בבחירת SUP מתנפח, שקלו את הגורמים הבאים:</p>
  <ul>
    <li><strong>נפח (ליטרים)</strong> — קובע את הציפה. נפח גבוה יותר תומך במשקל רב יותר ומקנה יציבות.</li>
    <li><strong>אורך</strong> — לוחות ארוכים יותר (11-14 רגל) שומרים טוב יותר על מסלול בטיולים; לוחות קצרים יותר (9-10 רגל) מתמרנים טוב יותר בגלישה.</li>
    <li><strong>רוחב</strong> — לוחות רחבים יותר (32-36 אינץ׳) יציבים יותר; לוחות צרים יותר (28-31 אינץ׳) מהירים יותר.</li>
    <li><strong>עובי</strong> — לוחות בני 6 אינץ׳ מציעים קשיחות מיטבית; לוחות בני 4.7 אינץ׳ קלים וניידים יותר.</li>
    <li><strong>איכות המבנה</strong> — חפשו למינציה בהיתוך או בד Drop-Stitch ארוג לעמידות.</li>
  </ul>

  <h2>שאלות נפוצות</h2>
  <h3>האם SUP מתנפח קשיח כמו לוח קשיח?</h3>
  <p>בניפוח נכון (12-15 PSI), SUP מודרני מסוג Drop-Stitch משיג קשיחות דומה לחתירה פנאית. ללוחות קשיחים עדיין יתרון במרוצים ובגלישה מתקדמת בזכות משקלם הקל יותר ומאפייני הגמישות המעודנים יותר שלהם.</p>

  <h3>כמה זמן לוקח לנפח?</h3>
  <p>עם משאבה דו-פעימתית, רוב הלוחות מגיעים ל-12-15 PSI בתוך 3-5 דקות. קיימות משאבות חשמליות המקצרות את זמן הניפוח לכ-2 דקות.</p>

  <h3>האם אפשר לקחת SUP מתנפח לטיסה?</h3>
  <p>כן. כאשר הוא מרוקן ומגולגל, רוב ה-SUP נכנסים לתיק גב העומד בדרישות המטען הנבדק של חברות התעופה. בדקו תמיד עם חברת התעופה שלכם את מגבלות הגודל והמשקל.</p>

  <h3>עד כמה SUP מתנפחים עמידים?</h3>
  <p>SUP מתנפחים עמידים במיוחד. מבנה ה-PVC בדרגה צבאית עמיד בפני פגיעות, נקבים ונזקי UV. נקבים קטנים ניתנים לתיקון בשטח בעזרת ערכת התיקון הכלולה.</p>

  <h3>איזו תחזוקה נדרשת?</h3>
  <p>שטפו במים מתוקים לאחר שימוש במי ים. אחסנו במקום קריר ויבש הרחק משמש ישירה. נפחו חלקית במהלך אחסון ממושך כדי לשמר את הצורה מבלי להעמיס על התפרים.</p>

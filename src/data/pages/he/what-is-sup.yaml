  headline: 'מהו לוח SUP מתנפח?'
  description: 'המדריך המלא לגלשני חתירה בעמידה מתנפחים: מבנה, טכנולוגיה, שימושים והשוואה ללוחות קשיחים.'
  datePublished: '2024-01-15'

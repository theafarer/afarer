faqs:
  title: 'שאלות נפוצות על ייצור משוטים OEM'
  subtitle: 'תשובות לשאלות הנפוצות ביותר ממותגים שמשיקים משוט משלהם.'
  items:
    - title: 'כיצד יוצרים מותג משוטים משלכם?'
      description: 'השיקו את המותג שלכם תוך 16 שבועות: תדריך, עיצוב, אב טיפוס מוסמך CE, ייצור המוני ומסירה. חקרו את חבילות ה-OEM שלנו.'
    - title: 'מהו זמן האספקה לייצור?'
      description: 'הדגימה מוכנה תוך 2-3 שבועות, ייצור סדרתי תוך 30-45 יום בהתאם לכמות.'
    - title: 'האם המשוט יישא את הלוגו שלנו?'
      description: 'כן — מותג פרטי מלא: הדפסת לוגו, צבעים מותאמים אישית, אריזה ותוויות במותג שלכם.'
    - title: 'האם אפשר לקנות בכמות גדולה מהיום הראשון?'
      description: 'ה-MOQ הוא 50 יחידות לדגמים סטנדרטיים, עם מדרגות תמחור סיטונאי ככל שהכמות גדלה.'

intro: 'מודל CAD, ולו המפורט ביותר, אינו יכול לחשוף כיצד לוח יתנהג בפועל עד שיפגוש את המים. לכן סדנת אבות הטיפוס שלנו נועדה לתרגם נתוני הנדסה ללוח פיזי מוכן למים במהירות ובדיוק מרביים. כל דגם חדש של Afarer — וכל בנייה מותאמת אישית משמעותית — עובר דרך סדנה זו לפני שמחויבים לכלי הייצור.'

content_html: |
  <h2>המקום שבו עיצוב הופך למציאות</h2>
  <p>הסדנה מצוידת במלואה לייצור בו-זמני של גוף הלוח, הדפנות והציוד. גישת העבודה המקבילית הזו מקצרת את זמן הובלת אב הטיפוס ל-8-12 שבועות מרגע השחרור ההנדסי, לעומת הנורמה הענפית של 16-20 שבועות. כאשר היישום שלכם דורש פתרון מתמחה, אנו יכולים לעבור מקונספט לאימות במים בתוך פחות משלושה חודשים.</p>

  <h2>יכולות הסדנה</h2>
  <table>
    <thead><tr><th>עמדת עבודה</th><th>ציוד</th><th>מטרה</th></tr></thead>
    <tbody>
      <tr><td>ייצור גוף</td><td>חותך בדים CNC, מכבש למינציה בחום, עמדת הכנת ליבת Drop-Stitch</td><td>ייצור גוף בקנה מידה מלא בכל שלושת סוגי המבנה</td></tr>
      <tr><td>הרכבת דפנות ותאים</td><td>מכבש ריתוך RF, עמדת הצמדה באוויר חם, מתקן בדיקת ניפוח</td><td>ייצור מערכות דפנות ותאים בגודל מלא עם כל המחיצות והשסתומים</td></tr>
      <tr><td>ציוד והתקנה</td><td>מתקן כרסום תיבות סנפירים, תבניות ריתוך למעגני מטען ולידיות, עמדת חיתוך שכבת סיפון</td><td>ציוד מלא: סנפירים, מעגני מטען, פקקים לרצועות נעילה, ידיות, שכבות סיפון, שסתומים</td></tr>
      <tr><td>עמדת מכשור</td><td>חיישן מהירות GPS, מתמירי לחץ, מדי תאוצה, מערך תרמוזוגות, רשם נתונים</td><td>התקנה וכיול של מכשור לניסויי ים</td></tr>
    </tbody>
  </table>

  <h2>מסע אב הטיפוס — שלב אחר שלב</h2>
  <ol>
    <li><strong>מסירה הנדסית</strong> — חבילת העיצוב (מודל תלת-ממדי, דוח FEA, מפרט חומרים, לוח שכבות) נסקרת רשמית על ידי מנהל הסדנה ומהנדס הפרויקט. כל הסתייגויות הייצור מסומנות ונפתרות לפני תחילת החיתוך.</li>
    <li><strong>ייצור הגוף</strong> — הגוף נבנה לפי המפרט ההנדסי. במבנה שכבה בודדת: ליבת ה-Drop-Stitch מוצמדת בלמינציה עם שכבת ה-PVC שצוינה. במבנה שכבה כפולה: השכבה הנוספת מוחלת מעל הלמינציה הבסיסית לפני חיתוך התבנית. במבנה מותך: פרמטרי הלמינציה נטענים מגיליון התהליך המאושר ומאומתים על דגימה ראשונה.</li>
    <li><strong>ייצור דפנות</strong> — הבד נחתך באמצעות תבניות CNC, ולאחר מכן מרותך ב-RF לדפנות ותאים בגודל מלא. כל תא מנופח ללחץ בדיקה ומושאר למשך 24 שעות לייצוב ראשוני.</li>
    <li><strong>הרכבה וציוד</strong> — הגוף והדפנות מחוברים. תיבות סנפירים ומעגני מטען מותקנים, פקקי רצועות נעילה וידיות נשיאה מורכבים, שסתום הניפוח מוברג במומנט, ושכבת הסיפון מוחלת ומיושרת.</li>
    <li><strong>בדיקות סטטיות</strong> — לפני שהלוח נוגע במים, הוא עובר: בדיקת ציפה (עומס מלא + 30 % עתודה), בדיקת החזקת לחץ לתאים, בדיקת דליפת שסתום, בדיקת משיכה לידיות ולמעגנים.</li>
    <li><strong>תוכנית ניסוי ים</strong> — 20 שעות של בדיקות במים, מפורט להלן.</li>
    <li><strong>סקירת אב טיפוס</strong> — נערכת פגישת אישור רשמית עם צוותי ההנדסה, הייצור והאיכות. כל שינויי העיצוב הנדרשים מתועדים ומשולבים בשחרור לייצור.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">תוכנית ניסוי ים של 20 שעות — לוח בדיקות</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 שע׳</span>
        <span class="flex-1">התמצאות במים שטוחים — מעקב במהירות נמוכה, פניות, בדיקת עמידה ואיזון</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 שע׳</span>
        <span class="flex-1">ניסוי מהירות — מהירות מרבית מאומתת ב-GPS, מהירות שיוט, קצב מתמשך ב-3 קצבי חתירה</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 שע׳</span>
        <span class="flex-1">בדיקת פניות — רדיוס פניית ציר ופניית סחיפה, תגובת הלוח, שמאלה וימינה</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 שע׳</span>
        <span class="flex-1">בדיקת גלים — מעברים חוזרים בגלים של 0.5–1.0 מ׳; מד תאוצה בעמדת החותר</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 שע׳</span>
        <span class="flex-1">בדיקת יציבות — זווית הטיה סטטית עם 4 חותרים במשקל משתנה, עומס מוסט לצד ימין</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 שע׳</span>
        <span class="flex-1">ריצת סיבולת — 3 שעות רצופות בקצב שיוט; ניטור לחץ התאים, טמפרטורת הדפנות ועייפות החותר</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 שע׳</span>
        <span class="flex-1">בדיקה סופית — בדיקת כל הרכיבים לאחר הניסוי, הידוק/בדיקה של כל המהדקים, תיעוד הממצאים</span>
      </div>
    </div>
  </div>

  <h2>פיתוח אבות טיפוס מותאם ליישומים ייחודיים</h2>
  <p>סדנת אבות הטיפוס היא המקום שבו אנו פותרים את הבעיות שלוחות ייצור סטנדרטיים אינם יכולים לתת עליהן מענה. דוגמאות אחרונות:</p>
  <ul>
    <li>לוח SUP חילוץ ברמת ניראות גבוהה עבור ארגון חיפוש והצלה, שדרש ידיות אחיזה משולבות, מעגני ציוד לציוד חילוץ וגוף בעל ציפה גבוהה לחילוץ נפגעים — הכל פותח כאב טיפוס, צויד ונבדק במתקן שלנו.</li>
    <li>לוח SUP טיולים משלחתי עבור קבלן סקר הידרוגרפי, עם תורן מכשירים נשלף, פתחי ציוד אטומים ומעגן ממיר נמוך שתוכנן למזער גרר.</li>
    <li>לוח SUP דיג קומפקטי עבור צי של אתר נופש, שבו אב הטיפוס שימש לאימות יציבות, ציוד ועמידות בשימוש השכרה יומיומי לפני שהלקוח התחייב לצי של ארבעה לוחות.</li>
  </ul>

  <h2>צוות פיתוח אבות הטיפוס שלנו</h2>
  <p>בסדנה מועסקים שמונה טכנאים ימיים רב-מיומנים, שכל אחד מהם הוכשר בהצלבה לפחות בשתיים מתוך שלוש הדיסציפלינות המרכזיות (גוף, דפנות, ציוד). ראש הצוות הוא יצרן אמן ותיק עם 16 שנות ניסיון, החל מבניות יחידניות מותאמות ועד סדרות ייצור. לכל אב טיפוס מוקצה מהנדס פרויקט ייעודי המשמש כנקודת הקשר היחידה עבור הלקוח לאורך תהליך הבנייה והניסוי.</p>

  <h2>מעורבות הלקוח</h2>
  <p>אנו מעודדים בהחלט את לקוחותינו להשתתף באבני דרך מרכזיות במהלך בניית אב הטיפוס — במיוחד בסקירת הציוד הראשונית ובניסוי הים. המשוב התפעולי שלכם בשלבים אלה הוא חסר ערך לעידון הלוח לפני שהוא נכנס לייצור. אנו לא בונים בחלל ריק; אנו בונים בשותפות איתכם.</p>
  <p>ניסוי הים של 20 השעות הוא גם הזדמנות לצוות שלכם להתמצא בהתנהגות הלוח, בפריסת הסיפון ובדרישות התחזוקה, מה שמבטיח מעבר חלק לשירות כאשר לוחות הייצור נמסרים.</p>


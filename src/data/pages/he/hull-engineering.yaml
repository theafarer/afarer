intro: 'הגוף הוא עמוד השדרה של כל לוח SUP ניפחים. עליו להיות קל דיו כדי לגלוש ביעילות, חזק דיו כדי להתמודד עם קווי חוף סלעיים, וקשיח דיו כדי להמיר כל חתירה לתנועה קדימה. ב-Afarer, סטודיו הנדסת הגוף שלנו משלב מידול CAD מתקדם, ניתוח אלמנטים סופיים (FEA) ועשרות שנות ניסיון מעשי בעיצוב לוחות, כדי לספק גופים הממוטבים לתחום הייעוד שלהם — ולא צורות גנריות המותאמות מקטלוג.'

content_html: |
  <h2>המקום שבו חוזק פוגש הידרודינמיקה</h2>
  <p>אנו עובדים עם שלוש פלטפורמות מבנה עיקריות — ליבות PVC מסוג Drop-Stitch מחוזקות, למינציות פיברגלס המונחות בעבודת יד ופוליאתילן בעיצוב רוטציוני — ויש לנו את היכולת ההנדסית לתכנן, לדמות ולאמת כל אחת מהן בבית.</p>

  <h2>כלי עיצוב ותקנים</h2>
  <p>סביבת ההנדסה הדיגיטלית שלנו כוללת:</p>
  <table>
    <thead><tr><th>יכולת</th><th>תוכנה / כלי</th><th>יישום</th></tr></thead>
    <tbody>
      <tr><td>מידול פרמטרי תלת-ממדי</td><td>SolidWorks Professional</td><td>משטח הגוף, חיזוק דפנות וקורות, פריסת סיפון, נקודות עיגון ציוד</td></tr>
      <tr><td>ניתוח אלמנטים סופיים</td><td>ANSYS Mechanical ו-LS-DYNA</td><td>מיפוי מאמצים, ניתוח מודאלי, סימולציית ריסוק/חבטה</td></tr>
      <tr><td>דינמיקת זורמים חישובית</td><td>Ansys Fluent / Star-CCM+</td><td>חיזוי גרר הידרודינמי, אופטימיזציית איזון</td></tr>
      <tr><td>הנדסת למינציות</td><td>ESAComp / CADEC</td><td>ערימת שכבות פיברגלס, בחירת ליבה, הערכת משקל</td></tr>
      <tr><td>סימולציית זרימת תבנית</td><td>Moldex3D</td><td>חיזוי עובי דופן בעיצוב רוטציוני</td></tr>
    </tbody>
  </table>

  <h2>תהליך העבודה ההנדסי שלנו</h2>
  <p>כל עיצוב גוף, בין אם מדובר בדגם סטנדרטי ובין אם בפרויקט מותאם אישית לחלוטין, עובר תהליך קפדני בן חמישה שלבים:</p>
  <ol>
    <li><strong>קונספט ואיסוף דרישות</strong> — אנו נפגשים איתכם כדי להגדיר את משקל הרוכב והמטען, טווח המהירויות, יכולת במצבי מים שונים, דרישות תובלה וכל ציוד משימה מיוחד (עגינות סיפון, עמדות קשירת מטען, שילוב אביזרים).</li>
    <li><strong>יצירת משטחים תלת-ממדיים וחישוב הידרוסטטי</strong> — צורת הגוף מדומה ב-SolidWorks ונבדקת ליציבות הידרוסטטית, לפילוח נפח ולמומנט יישור באמצעות כלי ניתוח מובנים.</li>
    <li><strong>ניתוח מבני FEA</strong> — מוגדרים מקרי עומס: סטטי (רוכב + ציוד), דינמי (חבטות נחיתה על גלים בתאוצה 5g) ועלייה על שרטון (פגיעה בקו חוף סלעי במהירות 3 מ׳/שנ׳). מפות המאמצים נסקרות; מקדם בטיחות ≥ 2.5 הוא חובה.</li>
    <li><strong>אופטימיזציית גרר ב-CFD</strong> — הגוף מדומה בשלושה מצבי עומס ובחמש מהירויות. שטח הגוף הרטוב, זווית האיזון והתנגדות שיורית מוקטנים באופן איטרטיבי.</li>
    <li><strong>סקירת עיצוב ושחרור</strong> — חבילת ההנדסה המלאה (מודל תלת-ממדי, דוח FEA, דוח CFD, הערכת משקל, ספר שכבות) נסקרת על ידי המהנדס הבכיר שלנו לפני השחרור לסדנת אבות הטיפוס.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">פילוח מאמצים FEA — גוף SUP לטיולים (Drop-Stitch מחוזק)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">מקדם בטיחות במטען מרבי</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">הפחתת גרר בהשוואה לדור הקודם</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">לחץ חבטה מרבי (גבול תכנון)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">זמן ריצה מצטבר של FEA בשנת 2025</span>
      </div>
    </div>
  </div>

  <h2>התאמה אישית: הגוף שלכם, הכללים שלכם</h2>
  <p>אין שני חותרים עם דרישות זהות. לוח SUP לדיג זקוק לגוף רחב ויציב; לוח לטיולים זקוק לגוף דחיקה הממקסם גלישה; לוח SUP לגלישה זקוק לדפנות רספונסיביות ולעקמומיות מכווננת. איננו כופים על היישום שלכם צורת גוף קיימת מראש. אנו מעצבים מהמפרט שלכם והלאה.</p>
  <p>דוגמאות לפרויקטים אחרונים של הנדסת גוף בהתאמה אישית:</p>
  <ul>
    <li>לוח SUP לטיולים באורך מוגדל עבור מפעיל טיולים אקולוגיים באיים הקריביים, עם חרטום מחוזק לנחיתות על חוף (+15 % עובי דפנות).</li>
    <li>לוח SUP סיור ברמת ניראות גבוהה עבור רשות נמל, עם עגינות ציוד משולבות וסדנים טקטיים.</li>
    <li>לוח SUP משלחתי לטיולים עבור צי השכרה, עם דפנות מחוזקות ועוגני קשירת מטען נוספים.</li>
  </ul>

  <h2>המהנדסים שלנו</h2>
  <p>הסטודיו בהובלת מהנדס בכיר עם 14 שנות ניסיון בעיצוב לוחות בעלי ביצועים גבוהים, בסיוע שני מהנדסי מכונות המתמחים ב-FEA וב-CFD. לכל השלושה תארים מתקדמים בהנדסה ימית או בהנדסת מכונות מאוניברסיטאות מוכרות בינלאומית. הצוות מפרסם באופן קבוע בכתבי עת ענפיים ומציג בכנסים בינלאומיים בנושא הנדסת ספורט חתירה בעל ביצועים גבוהים.</p>

  <h2>שתפו אותנו בפעולה בגוף הבא שלכם</h2>
  <p>משרטוט הקונספט הראשון ועד דוח המאמצים הסופי, סטודיו הנדסת הגוף שלנו הוא השותף שלכם ליצירת לוח שאינו רק נבנה — אלא מהונדס. אנו משקיעים את שעות הסימולציה מראש כך שלכל ריתוך, לכל שכבת למינציה ולכל עקמומיות של הגוף יש סיבה להיות שם.</p>
  <p>בין אם אתם זקוקים לשינוי קל בדגם קיים ובין אם לעיצוב חדש לגמרי מדף נקי, אנו מוכנים לדון בדרישותיכם.</p>


      description: 'כל גוף, ריתוך ומהדק מטופלים כאילו המשפחות שלנו עצמנו עתידות להשתמש בהם.'
      icon: tabler:heart
    - title: 'מהנדסים לפני שמוכרים'
      description: 'לוחות SUP ניפחים מ-9 רגל ועד 12 רגל. מעוצבים לטיולים, ליוגה, לדיג ולשימוש משפחתי.'
      icon: tabler:settings
    - title: 'תמיכה ששורדת אחרי האחריות'
      description: 'בעלי גופים בני עשרים שנה עדיין מתקשרים אלינו לחלקי חילוף, ואנחנו עדיין עונים.'
      icon: tabler:headset


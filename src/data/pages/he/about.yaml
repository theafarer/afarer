features3_what_we_build:
  title: 'מה אנו בונים'
  subtitle: 'התחלנו בסדנה חופית עם לוח אחד ואמונה עקשנית: מוצרים ימיים צריכים להיות מהונדסים כאילו שיש להם חשיבות, כי יש להם. כיום אנו מוכרים ליותר מ-40 מדינות, אך כל גוף עדיין עובר דרך אותן ידיים שהקימו את החברה.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'לוחות SUP'
      description: 'לוחות SUP ניפחים מ-9 רגל ועד 12 רגל. מעוצבים לטיולים, ליוגה, לדיג ולשימוש משפחתי.'
      icon: tabler:ship
    - title: 'לוחות SUP ניפחים'
      description: 'לוחות SUP ניפחים מ-PVC מ-9 רגל ועד 12 רגל. קלים, חזקים וקלים לאחסון.'
      icon: tabler:rowing
    - title: 'חבילות SUP פרימיום'
      description: 'לוחות SUP קומפקטיים ומפרט גבוה, הנבנים בהתאמה אישית למותג או לדרישות הצי שלכם.'
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: 'אביזרים'
      description: 'משוטים, משאבות, כיסויים, שקיות יבשות ואלקטרוניקה. כולם מתואמים ללוחות שלנו.'
      icon: tabler:package
    - title: 'תיקון ושירות'
      description: 'תיקון לוחות, החלפת שכבות סיפון ושדרוגי אביזרים — הכל בבית.'
      icon: tabler:tool
    - title: 'בניות מותאמות אישית'
      description: 'עיצוב פרויקט אחר פרויקט עבור לקוחות מסחריים, מדעיים וצבאיים.'
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: 'דיון על עיצוב והנדסת לוחות'


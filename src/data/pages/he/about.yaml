meta:
  title: 'על אודות Afarer — מותג SUP ניפחים וספורט ימי | {SITE}'
  description: 'Afarer הוא מותג גלובלי של SUP ניפחים וספורט ימי, המופעל על ידי Aquafarer LLC (ארה״ב) ונבנה על ידי צוות ההפעלה שלנו בצ׳ינגדאו. גלו את הסיפור שלנו, את ההנדסה, את האיכות המוסמכת ואת תוכניות השותפים הארציות.'
  keywords:
    - 'מותג SUP ניפחים'
    - 'מותג ספורט ימי'
    - 'מפיץ SUP ארצי'
    - 'אוספי SUP במותג משותף'
hero:
  tagline: 'על אודותינו'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'מפעל וסדנה של afarer'
  title: |
    הנדסה ימית, <br />
    נבנת בדרך של <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'התחלנו בסדנה חופית עם לוח אחד ואמונה עקשנית: מוצרים ימיים צריכים להיות מהונדסים כאילו שיש להם חשיבות, כי יש להם. כיום אנו מוכרים ליותר מ-40 מדינות, אך כל גוף עדיין עובר דרך אותן ידיים שהקימו את החברה.'


hero:
  tagline: 'רכש'
  title: 'מדריך לקוחות OEM — רכש כלי שיט מתנפחים מאסיה'
  subtitle: 'זמן קריאה 12 דקות'

content_html: |
  <h2>1. קדם-כישורים: למה לחפש במפעל</h2>

  <h3>תעודות תאימות</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – מערכת ניהול איכות</li>
    <li><strong>הסמכת CE</strong> – אמתו את מספר הגוף המוסמך</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – ביקורות תאימות חברתית</li>
    <li><strong>REACH / RoHS</strong> – הצהרות תאימות חומרים</li>
  </ul>

  <h3>יכולות ייצור</h3>
  <ul>
    <li>אריגת ליבת Drop-Stitch במקום מול מיקור חוץ</li>
    <li>קו ציפוי / למינציה של PVC</li>
    <li>ציוד ריתוך RF וריתוך באוויר חם</li>
    <li>ייצור תבניות עצמאי (עיבוד CNC)</li>
    <li>מעבדת בדיקות (בדיקות לחץ, הזדקנות UV, בדיקות מתיחה)</li>
  </ul>

  <h3>אימות ניסיון</h3>
  <ul>
    <li>שנות ותק בייצור כלי שיט מתנפחים (מינימום 5+ שנים)</li>
    <li>מספר המהנדסים בסגל</li>
    <li>לקוחות OEM/ODM קיימים (בקשו המלצות)</li>
    <li>יעדי ייצוא – האם הם כבר משגרים לשוק היעד שלכם?</li>
  </ul>

  <h2>2. פרוטוקולי בקרת איכות</h2>
  <p>בקרת איכות על חומרים נכנסים: חוזק מתיחה (ASTM D751 או ISO 1421), עמידות בקריעה (ASTM D2261 או ISO 4674), חוזק הדבקה, בדיקות ספוט של הזדקנות UV.</p>
  <p>בקרת איכות בתהליך: ניטור חוזק תפרים כל 50 יחידות, אימות מומנט שסתום, בדיקות צפיפות חוטי Drop-Stitch, בדיקות מידות מול שרטוטי CAD.</p>
  <p>בדיקה סופית: בדיקת החזקת ניפוח 100% (24 שעות, ירידה מקסימלית של 5%), בדיקה חזותית, בדיקת תפקוד שסתום, בדיקות דגימה אקראיות (AQL 2.5 או 4.0 לפי ISO 2859).</p>

  <h2>3. צ׳קליסט תיעוד תאימות</h2>
  <ul>
    <li>הצהרת תאימות (DoC) המתייחסת להנחיה הנכונה של האיחוד האירופי</li>
    <li>תעודת CE מטעם גוף מוסמך</li>
    <li>דוח בדיקה ממעבדה מוסמכת</li>
    <li>גיליונות בטיחות חומרים (MSDS)</li>
    <li>הצהרת תאימות REACH</li>
    <li>רשימת חומרים עם עקיבות אחר ספקים</li>
    <li>דוח ביקורת מפעל</li>
  </ul>

  <h2>4. משא ומתן על MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">סוג מוצר</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">MOQ סטנדרטי</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">טווח למשא ומתן</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">לוחות SUP</td><td class="p-3 border">50 – 100 יחידות</td><td class="p-3 border">5 – 10 יחידות (ניסיון)</td></tr>
      <tr><td class="p-3 border">קיאקים</td><td class="p-3 border">50 – 100 יחידות</td><td class="p-3 border">5 – 10 יחידות (ניסיון)</td></tr>
      <tr><td class="p-3 border">SUP מתנפחים</td><td class="p-3 border">50 – 100 יחידות</td><td class="p-3 border">2 – 5 יחידות (ניסיון)</td></tr>
      <tr><td class="p-3 border">בטיחות / אביזרים</td><td class="p-3 border">200 – 500 יחידות</td><td class="p-3 border">50 – 100 יחידות (ניסיון)</td></tr>
    </tbody>
  </table>

  <h2>5. לוגיסטיקה ומשלוחים</h2>
  <p>Incoterms נפוצים: <strong>FOB</strong> (המפעל מוסר לנמל היציאה – הנפוץ ביותר), <strong>EXW</strong> (הקונה מארגן את כל השילוח מדלת המפעל), <strong>CIF</strong> (המפעל משלם הובלה וביטוח עד נמל היעד).</p>
  <p>מוצרים מתנפחים הם במשקל נמוך ובנפח גבוה – משקל נפחי (DIM) קובע לעיתים קרובות את עלות השילוח. בקשו אריזה בוואקום כדי לצמצם את הנפח ב-50–60%. שילוח ימי מסין לאיחוד האירופי: 25–35 ימים; לחוף המערבי של ארה״ב: 15–20 ימים.</p>

  <h2>6. מלכודות נפוצות</h2>
  <ul>
    <li><strong>ללא ביקורת מפעל:</strong> בצעו תמיד ביקורת עצמאית או הזמינו ביקורת של צד שלישי (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>מפרטים מילוליים בלבד:</strong> גיליון מפרט טכני מפורט החתום על ידי שני הצדדים</li>
    <li><strong>דילוג על אישור דגימה:</strong> אישור כתוב על דגימות לפני ייצור סדרתי</li>
    <li><strong>ללא בקרת איכות במהלך הייצור:</strong> ביקורת של צד שלישי במהלך הייצור (DUPRO) ולפני המשלוח (PSI)</li>
    <li><strong>התעלמות מתאימות:</strong> אמתו הסמכת CE/UKCA לפני הייצור</li>
  </ul>

  <h2>7. למה Afarer</h2>
  <p>Afarer מייצרת כלי שיט מתנפחים במודל OEM/ODM מאז 2012. עם מתקן של 12,000 מ״ר מוסמך ISO 9001, 25+ מהנדסים והסמכת CE בכל קווי המוצרים, אנו עומדים בכל קריטריון במדריך זה. אנו מציעים MOQ לניסיון לשותפים חדשים וחבילות תיעוד תאימות מלאות.</p>


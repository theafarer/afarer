meta:
  title: 'מעבדת התאמה אישית — לוחות חתירה מתנפחים מותאמים אישית | {SITE}'
  description: 'לוחות חתירה מתנפחים מותאמים אישית: עיצוב בהתאמה אישית, לוגו, תבנית מותאמת אישית וייצור. שותף SUP למותג פרטי, MOQ של 50 יחידות, מוסמך CE.'
  keywords:

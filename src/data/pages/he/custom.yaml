hero:
  tagline: 'מעבדת ההתאמה האישית של afarer'
  title: 'עצבו לוח SUP<br />משלכם'
  subtitle: 'שותף SUP מותאם אישית המציע מיתוג משותף, מותג פרטי וייצור לוחות חתירה בהתאמה אישית עבור עסקים ברחבי העולם. מאב טיפוס יחיד ועד סדרות ייצור מלאות.'
  cta: 'התחילו את הפרויקט שלכם'
  footer_link: /contact/

steps_section:
  tagline: 'איך זה עובד'
  title: 'מקונספט ועד ייצור'
  subtitle: 'ארבעה צעדים מהרעיון שלכם ועד מוצר מוגמר ומוכן לים.'
  steps:
    - num: '01'
      title: 'בחרו את הלוח שלכם'
      desc: 'בחרו מתוך דגמי ה-SUP המרכזיים שלנו — all-around, טיולים, יוגה, ספורט או ילדים. בחרו גודל, חומר וצבע.'
    - num: '02'
      title: 'העלו את העיצוב שלכם'
      desc: 'שלחו לנו את הלוגו, הגרפיקה או הנחיות המותג שלכם. צוות העיצוב שלנו מכין הוכחה דיגיטלית.'
    - num: '03'
      title: 'סקירת דמות AI'
      desc: 'צפו בדמות פוטוריאליסטית שנוצרה ב-AI של הלוח המותאם אישית שלכם לפני תחילת הייצור.'
    - num: '04'
      title: 'ייצור ומסירה'
      desc: 'לאחר האישור, ההזמנה שלכם נכנסת לקו הייצור שלנו. זמני אספקה החל מ-30 יום.'

services_section:
  tagline: 'שירותים'
  title: 'שירותי ייצור למותגים גלובליים'
  subtitle: 'מודלים גמישים של התקשרות — מייצור בקבלנות ועד בניית מותג בשירות מלא.'
  items:
    - title: 'ייצור במיתוג משותף'
      desc: 'אנו מייצרים את העיצובים שלכם לפי מפרט — הקניין הרוחני שלכם, השרטוטים שלכם, תקני האיכות שלכם. הגנת NDA מלאה.'
      icon: ⚙️
    - title: 'פתרונות עיצוב'
      desc: 'בחרו מתוך 50+ פלטפורמות מוכחות והתאימו אישית גודל, צבע, גרפיקה ואריזה.'
      icon: '🎨'
    - title: 'מותג פרטי'
      desc: 'המותג שלכם על המוצרים שלנו — לוגו, אריזה, תגיות תלייה, מדריכים. מוכן לקמעונאות ישר מהקופסה.'
      icon: '🎨'
    - title: 'מיתוג מותאם אישית'
      desc: 'הדפסה על משטח הסיפון, גרפיקת גוף, מדבקות צינור ותוויות מותאמות אישית — שילוב מותג מלא.'
      icon: ⚙️

capabilities_section:
  tagline: 'יכולות'
  title: 'יכולות ייצור והתאמה אישית'
  subtitle: 'כל מה שצריך לדעת לפני שמזמינים.'
  capabilities:
    - label: 'היקף הזמנה'
      value: 'MOQ 50 יחידות (SUP)'
    - label: 'זמן אספקה'
      value: '30–45 יום סטנדרטי; 15–20 יום לאבות טיפוס'
    - label: 'התאמה אישית'
      value: 'גודל, צורה, צבע, גרפיקה, אריזה, חומרה'
    - label: 'חומרים'
      value: 'PVC, Drop-Stitch, EVA, אלומיניום'
    - label: 'הדפסה'
      value: 'דיגיטלית (CMYK), משי, העברת חום, סבלימציה'
    - label: 'הסמכה'
      value: 'CE, UKCA, FCC (תמיכה בתאימות גלובלית)'


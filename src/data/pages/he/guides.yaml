size_guide:
  tagline: 'מידות ומפרט'
  title: 'מצאו את המידה המתאימה לצרכים שלכם'
  desc: 'השוו מידות לוחות SUP, כושר נשיאה ושימושים מומלצים. בין אם אתם צריכים SUP לטיולים, לוח יוגה או SUP רב-שימושי — מדריך המידות שלנו יעזור לכם לבחור את ההתאמה הנכונה.'
  link_label: 'מדריך מידות מלא עם מפרטי מוצר ←'
  link: /size-guide/
  cards:
    - title: 'לוחות SUP'
      desc: 'בחרו אורך בהתאם למשקל שלכם ולשימוש המיועד. לוחות רחבים יותר (32"+) מציעים יציבות רבה יותר. לוחות ארוכים יותר (11–12 רגל) שומרים טוב יותר על מסלול בטיולים.'
    - title: 'SUP לטיולים'
      desc: 'לוחות ארוכים יותר (11–12 רגל) לכיסוי מרחקים ולשמירה על קו ישר. יציבים מספיק לטיולים עם ציוד. בדקו תמיד את כושר הנשיאה.'
    - title: 'SUP רב-שימושי'
      desc: 'בחרו אורך לפי משקל הרוכב והשימוש. לוחות רחבים יותר (32"+) ליציבות. גמישים לפנאי ולכושר.'

features3_reasons:
  tagline: 'למה לבחור ב-afarer'
  title: 'שבע סיבות לשתף איתנו פעולה'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. ייצור אמיתי, לא סחר קנייה ומכירה'
      description: 'אנו הבעלים והמפעילים של מפעל בשטח 12,000 מ״ר. כשאתם שותפים של afarer, אתם עובדים ישירות עם האנשים שמעצבים, מהנדסים ובונים את המוצרים שלכם — בלי מתווכים.'
      icon: tabler:building-factory
    - title: '2. גישה מונחית הנדסה'
      description: 'תהליך העיצוב שלנו מתחיל במקרה השימוש, לא בקטגוריית המוצר. אנו מייעלים את צורת הגוף, את בחירת החומרים ואת התצורה בהתאם לאופן שבו הלוח ישמש בפועל.'
      icon: tabler:engine
    - title: '3. איכות מוסמכת'
      description: 'הסמכת CE, מערכת איכות ISO, עמידה ב-BSCI, עמידה ב-REACH, אישור USCG. כל מוצר עומד בתקנים בינלאומיים — לא רק הצהרות.'
      icon: tabler:certificate
    - title: '4. מיתוג משותף גמיש'
      description: 'צבעי דפנות, פריסת סיפון, מיתוג, אריזה — אנו מתאימים אישית למפרט שלכם. בלי לחץ של כמות הזמנה מינימלית. התחילו עם אב-טיפוס, התרחבו בביטחון.'
      icon: tabler:adjustments
    - title: '5. לוגיסטיקה גלובלית'
      description: 'מחסן בארה״ב בקליפורניה, משלוח ישיר מצ׳ינגדאו, משלוח אווירי להזמנות דחופות. אנו מטפלים במסמכי המכס ובתיעוד.'
      icon: tabler:truck-delivery
    - title: '6. תמיכה לכל החיים'
      description: 'אנו תומכים בלוחות שייצרנו לפני 20 שנה. חלקי חילוף מקוריים, ייעוץ טכני, הדרכת תיקון — הצוות שלנו זמין כשאתם זקוקים לנו.'
      icon: tabler:lifebuoy
    - title: '7. מפרטים כנים'
      description: 'דירוגי עומס אמיתיים, ממדים אמיתיים, משקל אמיתי. בלי ניפוח שיווקי. מה שאנו מפרסמים הוא מה שאתם מקבלים — מאומת בבדיקות עצמאיות.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'מותגים ברחבי העולם נותנים בנו אמון'
  title: 'מה אומרים השותפים שלנו'
  items:
    - content: 'עבדנו עם כמה יצרנים בסין, אך afarer בולטת בתמיכת ההנדסה ובאיכות העקבית שלה. הם מתייחסים למותג שלנו כאילו היה שלהם.'
      name: '— שותף מיתוג משותף, מותג ספורט מים אירופי'
    - content: 'לוחות ה-SUP שלהם בשירות הצי שלנו למעלה מ-5 שנים. תחזוקה מינימלית, עמידות UV מעולה. האחריות ל-5 שנים נותנת לנו ביטחון.'
      name: '— מפעיל צי, קבוצת אתרי נופש במזרח התיכון'
    - content: 'הצוות של afarer עזר לנו לפתח עיצוב לוח SUP מותאם אישית מהקונספט ועד הייצור ב-90 יום. האיכות עלתה על הציפיות שלנו.'
      name: '— מפיץ, Watersports אוסטרליה'
cta:
  title: 'מוכנים לחוות את ההבדל?'
  subtitle: 'צרו קשר עם הצוות שלנו לדון בפרויקט שלכם. לא נדרשת התחייבות — רק ייעוץ כן על ייצור.'
  actions:
    - variant: primary
      text: 'דברו עם הצוות שלנו'
      href: /contact/
    - text: 'הורידו את קטלוג המוצרים'

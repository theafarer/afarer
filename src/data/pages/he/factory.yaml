hero:
  tagline: 'מפעל'
  title: 'מפעל וייצור'
  subtitle: '12,000 מ״ר של ייצור משולב — מחומר גלם ועד לוח מוגמר'

intro:
  - 'כזרוע הייצור של **Aquafarer LLC (USA)**, צוות התפעול של afarer בצ׳ינגדאו שולט בכל שלב של הייצור — מהגעתם של חומרי הגלם PVC ופיברגלס ועד לבדיקה הסופית שלפני המסירה של הלוח המוגמר. מתקן הייצור שלנו באזור הפיתוח הכלכלי של צ׳ינגדאו משתרע על שטח של 12,000 מ״ר ומכיל סדנות ייעודיות לחיתוך PVC, איטום תרמי של צינורות, ייצור תבניות FRP, הדפסה דיגיטלית של SUP, הרכבה סופית ובדיקות איכות.'
  - 'באמצעות שילוב של עיצוב, הנדסה, פיתוח אבות-טיפוס, ייצור ובדיקות תחת קורת גג אחת, אנו מבטלים את חוסר היעילות של ייצור בקבלנות ושומרים על שליטה ישירה באיכות הבנייה, בבחירת החומרים ובלוחות הזמנים לאספקה. כל לוח שיוצא מהסדנה שלנו נבנה על ידי האנשים שלנו, בציוד שלנו, לפי הסטנדרטים שלנו.'


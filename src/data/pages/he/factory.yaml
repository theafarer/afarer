qc_section:
  tagline: 'בקרת איכות'
  title: 'תהליך בדיקות והבטחת איכות'
  subtitle: 'כל לוח עובר בדיקות חובה לפני המשלוח. מעבדת האיכות שלנו פועלת באופן עצמאי מהייצור ומדווחת ישירות להנהלה.'
  steps:
    - step: '1'
      title: 'בדיקת חומרי גלם'
      desc: 'בדי PVC ו-Drop-Stitch עוברים בדיקות מתיחה (ASTM D751), בדיקת התפשטות קריעה ואימות עמידות ל-UV לפני שאצווה כלשהי נכנסת לייצור.'
    - step: '2'
      title: 'בדיקת שמירת אוויר של 24–48 שעות'
      desc: 'כל תא צינור מנופח ל-125% מהלחץ המדורג ומוחזק במשך 24–48 שעות. ירידת לחץ העולה על 5% מפעילה דחייה אוטומטית ובדיקת תפרים חוזרת.'
    - step: '3'
      title: 'בדיקת עומס ואיזון'
      desc: 'לוחות מוגמרים נטענים לכושר המדורג המרבי ונבדקים ליציבות ולקשיחות. כל לוח עובר בדיקת מים לפני הבדיקה הסופית.'

oem_section:
  tagline: 'פרויקטי OEM'
  title: 'מקרי בוחן של מותגים ושותפויות OEM'
  subtitle: 'מהקונספט ועד המכולה — כיצד אנו מסייעים למותגים גלובליים להשיק ולהרחיב את קווי ה-SUP המתנפחים שלהם.'
  cases:
    - challenge: 'רשת קמעונאות אירופית לציוד חוץ נזקקה לקו SUP במיתוג פרטי עם גרפיקת סיפון ייחודית, PVC ידידותי לסביבה ואריזות מוכנות לקמעונאות — הכול באספקה בתוך 60 יום.'
      solution: 'פיתחנו קבצי הדפסה דיגיטלית מותאמים אישית, סיפקנו PVC תואם REACH, וקיצרנו את תהליך הדגימה מ-3 סבבים לסבב אחד באמצעות מיקום צוות העיצוב במפעל שלנו בצ׳ינגדאו.'
      result: '55 ימים מ-PO חתום ועד FOB. 2,400 יחידות על פני 4 SKU. הזמנה חוזרת הונחה בטרם הגעת המכולה הראשונה.'
    - challenge: 'סטארטאפ אמריקאי לספורט ימי נזקק ל-SUP Drop-Stitch בביצועים גבוהים עם צורה מותאמת אישית, אריזה ממותגת משותפת והסמכת BSCI להצבה בקמעונאות.'
      solution: 'התאמנו תבנית SUP קיימת עם קווי מתאר משופרים, פיתחנו עיצוב אריזה ממותג משותף וסיפקנו תיעוד ביקורת BSCI מלא.'
      result: 'נרשם בהצלחה ב-3 רשתות ציוד חוץ אמריקאיות מובילות. מעל 5,000 יחידות בשנה הראשונה עם שיעור מכירה מלא של 98%.'
    - challenge: 'מפיץ אוסטרלי דרש סדרת SUP מוסמכת CE עם צבעים מותאמים אישית ועמידה בתקנים אוסטרליים.'
      solution: 'ייצרנו דגימות קדם-ייצור עם 4 וריאציות צבע ותיאמנו בדיקות תאימות של צד שלישי.'
      result: 'סדרת SUP בת 3 דגמים הושקה בשוק AU/NZ. בעקבותיה הושגה זכייה במכרז ממשלתי ל-12 SUP לסיור.'

faq_section:
  tagline: 'שאלות נפוצות'
  title: 'שאלות נפוצות B2B ו-OEM'
  questions:
    - q: 'מהי כמות ההזמנה המינימלית (MOQ) ללוחות SUP מתנפחים במתכונת OEM?'
      a: 'MOQ מתחיל ב-5–10 יחידות לדגמי OEM סטנדרטיים. תבניות מותאמות אישית ופרויקטים של מיתוג פרטי דורשים מינימום של 200 יחידות בהתאם למורכבות. הזמנות ניסיון והרצות דגימה זמינות להשקת מותגים חדשים.'
    - q: 'האם ל-afarer יש הסמכת BSCI?'
      a: 'כן. המפעל שלנו מחזיק בהסמכת ציות חברתי BSCI תקפה (דוח ביקורת זמין לפי בקשה). אנו גם מחזיקים ב-ISO 9001 לניהול איכות, וכל המוצרים נושאים הסמכת CE. תיעוד ציות REACH ו-RoHS מסופק עם כל משלוח OEM.'
    - q: 'מהו זמן האספקה הטיפוסי להזמנת OEM?'
      a: 'זמן אספקה סטנדרטי הוא 30–45 ימים מאישור PO ותשלום מקדמה לייצור OEM בכמויות. פיתוח תבנית מותאמת אישית מוסיף 15–20 ימים לייצור הכלים. ייצור מואץ זמין להזמנות דחופות ולעומסים עונתיים. דגימות אב-טיפוס נשלחות בדרך כלל תוך 15–20 ימים.'
    - q: 'האם תוכלו לשלוח FOB מצ׳ינגדאו או CIF לנמל שלנו?'
      a: 'כן. אנו משלוח FOB מצ׳ינגדאו, CIF לנמלים גלובליים מרכזיים ו-DDP לשותפים מוסמכים. צוות הלוגיסטיקה שלנו מנהל הזמנת מכולות, תיעוד ייצוא ושחרור מכס. אנו משלוחים ליותר מ-50 מדינות בשווקי האיחוד האירופי, ארה״ב, אוסטרליה ואסיה.'

b2b_moq: 'MOQ סטנדרטי: 5–10 יחידות לדגם. הזמנות ניסיון מוזמנות לשותפויות חדשות.'

production_flow:
  tagline: 'זרימת ייצור'
  title: 'מחומר גלם ללוח מוגמר'
  subtitle: 'כל לוח עובר 6 שלבי ייצור עם נקודות ביקורת איכות בכל שלב. ללא קיצורי דרך, ללא בדיקות שדולגות.'
  stages:
    - stage: '01'
      title: 'קבלת חומרים ובקרת איכות נכנסת'
      description: 'כל חומרי הגלם הנכנסים נרשמים לפי מספר אצווה/לוט במערכת ה-ERP שלנו. גלילי בד PVC, ליבות Drop-Stitch, שסתומים, דבקים וחומרה מוכנסים להסגר עד לאישור בקרת האיכות.'
      qc_check: 'חוזק מתיחה (ASTM D751), עמידות לקריעה (ISO 4674), מד עובי, צמיגות דבק, סריקת פגמים חזותית'
      qc_threshold: '100% מהאצוות נבדקות. דחייה אם מתיחה < 90% מהמפרט, קריעה < מינימום המפרט, או כל פגם חזותי'
      responsibility: 'צוות בקרת איכות נכנסת (3 מפקחים)'
    - stage: '02'
      title: 'חיתוך CNC והכנת חומרים'
      description: 'קינון ממוחשב ממוטב מסדר פאנלים על מלאי ה-PVC למזעור הבזבוז. מכונות חיתוך CNC אוטומטיות מחזיקות דיוק מיקום של 0.1 מ״מ.'
      qc_check: 'בדיקה ממדית מול קבצי CAD DXF, בדיקת איכות קצוות, אימות ספירת פאנלים'
      qc_threshold: 'כל פאנל עשרים נמדד. סובלנות ±0.5 מ״מ. דחיית אצווה אם יותר מ-2% חורגים מהסובלנות'
      responsibility: 'ראש סדנת החיתוך'
    - stage: '03'
      title: 'ריתוך וחיבור Drop-Stitch'
      description: 'ליבות Drop-Stitch מחוברות לשכבות PVC חיצוניות באמצעות למינציה תרמית. תאי צינור מרותכים ב-RF או באוויר חם. רצועות מסילה מותכות בשכבת מיזוג משולשת.'
      qc_check: 'בדיקת קילוף כל 50 יחידות (ASTM D751), מדידת רוחב ריתוך, סקירת יומן טמפרטורת אוויר חם, בדיקת תפרים חזותית תחת אור אחורי'
      qc_threshold: 'חוזק קילוף מינימלי 8 N/cm. סובלנות רוחב ריתוך ±1 מ״מ. כל תעלה נראית לעין = דחייה'
      responsibility: 'בקרת איכות ריתוך (2 מפקחים למשמרת)'
    - stage: '04'
      title: 'הרכבה וציוד'
      description: 'הלוחות עוברים להרכבה סופית שבה כל הרכיבים מחוברים: מסילות מודבקות ומרותכות, שסתומים מותקנים, טבעות D, ידיות, תיבות סנפירים והתאמת תיק נשיאה. כל יחידה פועלת לפי רשימת בדיקה של 100 נקודות.'
      qc_check: 'אישור רשימת בדיקה של 100 נקודות ליחידה, בדיקת תפקוד שסתום (10 מחזורי פתיחה/סגירה), אימות מומנט הידוק של חומרה, בדיקה חזותית'
      qc_threshold: 'מדיניות אפס פגמים לפריטים קריטיים לבטיחות (שסתומים, טבעות D, ידיות). פגמים קוסמטיים מינוריים: AQL 2.5 (ISO 2859)'
      responsibility: 'ראש צוות הרכבה + בקרת איכות קו ייצור'
    - stage: '05'
      title: 'בדיקת לחץ והמתנת איכות'
      description: 'כל תא מנופח ל-1.25× מהלחץ המדורג (בדרך כלל 20–25 PSI) ומוחזק במשך 24–48 שעות. חיישני לחץ רושמים ברציפות. תאים שחורגים מ-5% ירידת לחץ נדחים ונשלחים לבדיקת תפרים חוזרת.'
      qc_check: 'יומן החזקת לחץ של 24–48 שעות, כיול חיישנים מאומת מדי יום, קריאת לחץ מפוצה טמפרטורה, בדיקת תפר חוזרת לאחר תיקון'
      qc_threshold: 'מקסימום 5% ירידת לחץ במשך 24–48 שעות בטמפרטורה יציבה. כל תא שחורג = בדיקה חוזרת של 100% מאצוות הייצור כולה'
      responsibility: 'מעבדת איכות (עצמאית מהייצור, מדווחת להנהלה)'
    - stage: '06'
      title: 'בדיקה סופית ואריזה'
      description: 'בדיקה חזותית ותפקודית סופית. פגמי שטח, עקביות צבע, אימות תווית/BIN, שלמות אריזה ושלמות אביזרים. יחידות נארזות בוואקום, בקופסאות ועל משטחי העמסה לטעינת מכולות.'
      qc_check: 'בדיקה חזותית מלאה, רשימת אביזרים לפי SKU, בדיקת נפילת אריזה (1 מ׳, דגימה אקראית), אימות סריקת תווית/ברקוד'
      qc_threshold: 'AQL 2.5 לפגמים מרכזיים, AQL 4.0 לפגמים מינוריים. אפס סובלנות לפגמי בטיחות. 100% מהיחידות נבדקות חזותית'
      responsibility: 'צוות בקרת איכות סופית (4 מפקחים) + ראש צוות אריזה'


workshops_section:
  tagline: 'סדנאות'
  title: 'סדנאות ייצור'
  workshops:
    - title: 'חיתוך PVC והכנת חומרים'
      description: 'מכונות חיתוך CNC אוטומטיות מעבדות בדי PVC ו-Drop-Stitch בדיוק תת-מילימטרי. קינון ממוחשב ממוטב ממזער את בזבוז החומר ומבטיח שכל פאנל עומד במפרט הממדי שלו לפני הריתוך.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'ריתוך צינורות ואיטום תרמי'
      description: 'סדנת ריתוך ייעודית עם מכונות איטום חום ומכבשי RF דיאלקטריים. מאטמי אוויר חם מלחימים וממזגים תאי צינור PVC, ואילו ריתוכי RF מייצרים תפרים אטומים בחוזק גבוה העולים על דרישות EN ISO 25649.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'תבניות FRP וייצור חומרים מרוכבים'
      description: 'תבניות FRP מותאמות אישית לרכיבי SUP, המיוצרות בשיטת הנחה ידנית של פיברגלס עם מערכות שרף פוליאסטר ווינילאסטר. כל שכבה מגולגלת ביד ונאטמת בוואקום לאיכות עקבית. תא ריסוס ג׳לקואט מספק גימור ימי מבריק ועמיד ל-UV.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'הדפסה ועיטור SUP'
      description: 'לוחות SUP מעוטרים בהדפסה דיגיטלית לגרפיקה מלאה בצבע ובהדפסת מסך ללוגואים ולדוגמאות חוזרות. מדפסות דיגיטליות מפיקות עיצובי סיפון באיכות צילום, ואילו הדפסת מסך מספקת סימני מותג עמידים וחיים בצבע.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'הרכבה סופית וציוד'
      description: 'פס ייצור שבו ליבות Drop-Stitch מושלמות עם מסילות, מדבקות סיפון EVA מוחלות, וסנפירים, שסתומים ואביזרים מותקנים. כל לוח פועל לפי רשימת בדיקה של 100 נקודות החתומה על ידי ראש הצוות.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'בדיקות איכות ופיקוח'
      description: 'כל לוח שהושלם עובר בדיקת שמירת אוויר חובה, אימות קילוף תפרים ובדיקת מערכות מלאה לפני המשלוח. מעבדת האיכות שלנו פועלת באופן עצמאי מהייצור ומדווחת ישירות להנהלה.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


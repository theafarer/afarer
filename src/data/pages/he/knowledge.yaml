  items:
    - title: 'מדריכי קניית SUP'
      description: 'מבחירת הלוח הראשון שלכם ועד טכניקות טיול מתקדמות — הכול על חתירה בעמידה.'
      icon: 'tabler:lifebuoy'
      topics:
        - 'כיצד לבחור את ה-SUP המתנפח הראשון שלכם'
        - 'מדריך לגודל ולכושר הנשיאה של SUP'
        - 'ה-SUP הטוב ביותר למתחילים, לטיולים, ליוגה ולמרוצים'
        - 'טעויות קנייה נפוצות ב-SUP שכדאי להימנע מהן'
        - 'השוואה בין לוח מתנפח ללוח קשיח'
    - title: 'הנדסה וטכנולוגיה של SUP'
      description: 'מדריכים טכניים על לוחות SUP מתנפחים — חומרים, שיטות מבנה ותהליכי ייצור.'
      icon: 'tabler:microscope'
      topics:
        - 'צלילה לעומק לטכנולוגיית Drop-Stitch'
        - 'מפרטי PVC בדרגה צבאית'
        - 'למינציה בהיתוך מול הדבקה'
        - 'טכנולוגיית קצף EVA ושיטות גרפיקה'
        - 'סוגי שסתומי SUP ומערכות סנפירים'
    - title: 'בטיחות ותחזוקה ב-SUP'
      description: 'ידע בטיחות חיוני לכל חותר — מבחירת אפוד הצלה ועד קריאת מזג אוויר, טיפול בלוח ותיקונים.'
      icon: 'tabler:shield'
      topics:
        - 'צ׳קליסט בטיחות SUP ודרישות אפוד הצלה'
        - 'בטיחות רב-תאית למים מרוחקים'
        - 'מדריך לחצי ניפוח PSI ב-SUP'
        - 'אחסון לוחות וטיפול חורפי'
        - 'טכניקות תיקון למוצרים מתנפחים'
    - title: 'כישורים וטכניקות SUP'
      description: 'טכניקות חתירה, כישורי טיול ואימוני כושר לכל הרמות.'
      icon: 'tabler:sailboat'
      topics:
        - 'טכניקות חתירה למתחילים'
        - 'שליטה מתקדמת בתנועת המשוט'
        - 'תכנון טיולים ומסעות'
        - 'אימוני כושר ומרוצים ב-SUP'
        - 'כישורי מים לבנים ורפטינג בנהרות'
    - title: 'אורח חיים ושימושים מיוחדים ב-SUP'
      description: 'פעילויות SUP מתמחות — יוגה, דיג, כלבים, משפחות וטיפים לטיולים.'
      icon: 'tabler:heart'
      topics:
        - 'יוגה ומדיטציה על SUP במים'
        - 'דיג מ-SUP מתנפח'
        - 'חתירה עם כלבים וילדים'
        - 'נסיעות עם ה-SUP שלכם בטיסה וברכב'
        - 'אביזרי SUP וציוד חיוני'
    - title: 'השוואות ומקורות על SUP'
      description: 'השוואות זה מול זה שיעזרו לכם לקבל החלטות מושכלות.'
      icon: 'tabler:chart-bar'
      topics:
        - 'SUP מול קיאק — מה מתאים לכם?'
        - 'הסברים על דרגות חומר PVC'
        - 'בטיחות של תא יחיד מול רב-תאים'
        - 'הסברים על חומרי לוחות SUP'
        - 'הדפסת UV מול גרפיקת בלוק EVA'


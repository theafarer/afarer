features:
  title: 'מדוע לשתף פעולה עם afarer'
  subtitle: 'מודל של מדינה אחת-מפיץ אחד עם מבנה תמיכה שהופך את הטריטוריה לרווחית. בלעדיות נרכשת ומתוחזקת — אינה זכות קבועה.'
  columns: 3
  items:
    - title: 'בלעדיות טריטוריאלית'
      description: 'מפיץ מוסמך אחד לכל מדינה או אזור. ללא יבוא מקביל, ללא תחרות פנימית. ההשקעה שלכם בונה את החפירה שלכם עצמכם.'
      icon: 'tabler:shield-check'
    - title: 'הגנה מפני ניגודי ערוצים'
      description: 'הזמנות ישירות מהאזור שלכם מנותבות דרככם, והתמחור מגן על המרווח שלכם. afarer אינו מוכר מעבר לראשם של שותפיו המדינתיים.'
      icon: 'tabler:users'
    - title: 'מרווחים ישירים מהמפעל והנחות'
      description: 'מחירון סוחנים עם הנחות על כמויות מחויבות. ללא מתווכים. משלוח FOB צ׳ינגדאו עם תיעוד ייצוא מלא.'
      icon: 'tabler:coins'
    - title: 'תוכנית תמיכה לשותפים בת 10 מודולים'
      description: 'קליטה, יציאה לשוק, הדרכה, שיווק ומימון שוק משותף, חלקי חילוף ושירות לאחר מכירה, אחריות, כלי הזמנה ופורטל שותפים — הכול מכוסה בהסכם ההפצה שלכם.'
      icon: 'tabler:rocket'
    - title: 'שיווק וקרנות שוק משותפות'
      description: 'נכסי קמפיין מותאמים מקומית, חומרי נקודת מכירה לסוחנים, ערכות אירועים, תוכן דיגיטלי במספר שפות ותמיכת שיווק משותף לעונות השקה.'
      icon: 'tabler:mood-smile'
    - title: 'הדרכת מוצר, מכירות וטכנולוגיה'
      description: 'מפגשי קליטה מובנים בתחומי המוצר, המכירות והידע הטכני, עם חומרים מעודכנים ככל שמגוון המוצרים מתפתח.'
      icon: 'tabler:presentation'
    - title: 'חלקי חילוף ותמיכה לאחר מכירה'
      description: 'אספקת חלקי חילוף, רישום אחריות וטיפול בתביעות, וכן גיליונות נתונים ומדריכי מוצר לצוות השירות המקומי שלכם.'
      icon: 'tabler:settings'
    - title: 'מנהל חשבון ייעודי ופורטל שותפים'
      description: 'מנהל הפצה אישי בתוספת גישה למחירונים, סטטוס הזמנות ומשאבי שיווק דרך פורטל השותפים של afarer.'
      icon: 'tabler:user-check'

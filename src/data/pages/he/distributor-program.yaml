faqs:
  title: 'שותפות מדינתית — שאלות נפוצות'
  subtitle: 'השאלות ששותפים מדינתיים רציניים שואלים לפני הגשת מועמדות.'
  items:
    - title: 'מה באמת אומר מודל מדינה אחת-מפיץ אחד?'
      description: 'afarer ממנה מפיץ מוסמך יחיד עם זכויות בלעדיות לטריטוריה מוגדרת. אנו לא מוכרים מהערוצים הגלובליים או האזוריים שלנו אל תוך מדינה מוגנת. הבעלות שלכם על הטריטוריה תקפה כל עוד תנאי הסכם ההפצה מתקיימים.'
    - title: 'האם הטריטוריה בלעדית לנצח?'
      description: 'לא. הבלעדיות מותנית, לא צמיתה. היא מתוחזקת באמצעות הסכם הפצה חתום, השלמת ההזמנה הראשונה שלכם, יעדי רכש שנתיים, מלאי מקומי, יכולת שירות לאחר מכירה והמשך השקעה בשוק. אם אלה אינם מתקיימים, ניתן לדון מחדש בטריטוריה או להקצותה מחדש.'
    - title: 'מהי ההזמנה הראשונה המינימלית?'
      description: 'מפיצים מדינתיים ואזוריים מתחילים ב-100–300 יחידות; סוחנים מוסמכים ב-30–50 יחידות; הזמנות ניסיון של 10–30 יחידות מאפשרות לכם לאמת תחילה את השוק (הזמנות ניסיון ודגימה אינן מקנות הגנה טריטוריאלית). תוכניות של התאמה אישית ומותג פרטי פועלות לפי MOQ נפרד המפורט בדרגות לעיל.'
    - title: 'אילו תמיכה כלולה בתוכנית התמיכה בת 10 המודולים?'
      description: 'דרגות והסמכה, הגנת טריטוריה, MOQ / תמחור / הנחות שנתיות, מלאי וביצוע הזמנות, נכסי שיווק וקרנות שוק משותפות, הדרכת מוצר / מכירות / הדרכה טכנית, חלקי חילוף ושירות לאחר מכירה, רישום אחריות, פורטל השותפים, וכן גיליונות נתוני מוצר, ספריית נכסי שיווק, לוח הנחות שנתי ורשימות משלוח ואריזה.'
    - title: 'כיצד afarer מגן עליי מפני ניגודי ערוצים?'
      description: 'לכל טריטוריה יש בדיוק מפיץ מוסמך אחד. פניות והזמנות ישירות מהאזור שלכם מנותבות דרככם, טפסים באתר מועברים אל השותף המקומי היכן שקיים, והצוות הגלובלי מטפל בהסלמה רק כאשר שותף אינו מגיב.'
    - title: 'מהם תנאי המשלוח והתשלום?'
      description: 'הזמנות נשלחות FOB צ׳ינגדאו עם תיעוד ייצוא מלא. הזמנות ייצור: 30% מקדמה ו-70% לפני המשלוח; הזמנות ניסיון ודגימה בתשלום מראש. זמן אספקה סטנדרטי הוא 30–45 ימי עבודה, ו-15–20 ימי עבודה להרצות דגימה.'
    - title: 'כיצד אני מגיש מועמדות?'
      description: 'שלחו את בקשתכם דרך טופס יצירת הקשר עם פרטי השוק. אנו בודקים התאמה לשוק, נוכחות קמעונאית ויכולת לוגיסטית, ואז מגיבים בתוך 3 ימי עסקים עם הצעדים הבאים וטיוטת הסכם הפצה.'

      desc: 'שתפו את החזון שלכם, את הרוכב המיועד ואת המים שעבורם אתם מעצבים.'
    - number: '02'
      title: 'עיצוב והנדסה'
      desc: 'מידול תלת-ממדי, בחירת חומרים ועיצוב גרפי ייחודי.'
    - number: '03'
      title: 'אב טיפוס ואימות'
      desc: 'לוחות דגימה שעוברים בדיקת לחץ ואימות רכיבה לפני שאתם מתחייבים.'
    - number: '04'
      title: 'בנייה בקנה מידה גדול'
      desc: 'ייצור עקבי ומבוקר עם נקודות בדיקת איכות בכל שלב.'
    - number: '05'
      title: 'מסירה גלובלית'
      desc: 'לוגיסטיקה מצ׳ינגדאו לנמלים מרכזיים עם תמיכה במכס.'

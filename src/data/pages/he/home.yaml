business_solutions:
  tagline: 'מדוע הרכיבה שונה'
  title: 'ביצועים שמרגישים כבר בחתירה הראשונה'
  subtitle: 'ארבעה עמודי תווך שעוצבו על ידי מים אמיתיים — ביצועים, עיצוב, מבנה ואיכות.'
  items:
    - title: 'ביצועים במים'
      description: 'צורות שכוונו ליציבות, לגלישה ולביטחון במים סוערים — כך שכל חתירה מרגישה מחוברת למים.'
      icon: tabler:shield-check
    - title: 'עיצוב מביע'
      description: 'אוספים ששאבו השראה מהגאות והשפל, מחיות הבר ומהאנרגיה של קו המים — לוחות שתרצו שיראו איתכם.'
      icon: tabler:package
    - title: 'מבנה מוכח'
      description: 'ליבות Drop-Stitch בצפיפות גבוהה, דפנות מחוזקות ותפרים מלוחמים בהיתוך, שנבנו לשימוש חוזר.'
      icon: tabler:headset
    - title: 'איכות מאומתת'
      description: 'בדיקת לחץ, בדיקה ויזואלית, וגיבוי של אחריות ברורה ותמיכה לאחר מכירה ברמת תגובה גבוהה.'
      icon: tabler:truck-delivery

oem_section:
  tagline: 'ייצור OEM / ODM ומותג משותף'
  title: 'מרעיון ועד המים — מהדורות במותג משותף'
  subtitle: 'עבור שותפים שרוצים יותר ממוצר מקטלוג: ייצור OEM/ODM ואוספים מוגבלים במותג משותף, המעוצבים, מהונדסים ונבנים עם Afarer — וכל לוח נשאר מוצר Afarer.'

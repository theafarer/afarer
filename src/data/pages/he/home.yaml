who_we_serve:
  tagline: 'רכבו איתנו'
  title: 'נוצר לדרך שבה אתם רוכבים'
  subtitle: 'מהחתירה הראשונה שלכם ועד המסלול הארוך ביותר — ועבור המועדונים, אתרי הנופש והקמעונאים שממשיכים להחתיר אנשים.'
  items:
    - title: 'רוכבים בפעם הראשונה ורוכבי פנאי'
      keywords: 'SUP ניפחים למתחילים, לוח חתירה all-around, SUP יציב'
      description: 'לוחות all-around רחבים ויציבים שהופכים את החתירה הראשונה שלכם לטבעית וממשיכים ללוות אתכם ככל שאתם מתקדמים.'
      icon: tabler:users
      cta: 'מצאו את הלוח הראשון שלכם'
      link: /all-around-sup
    - title: 'חותרים לטיולים ולהרפתקאות'
      keywords: 'SUP לטיולים, לוח חתירה למרחקים ארוכים, SUP משלחתי'
      description: 'לוחות ארוכים וצרים יותר, שנבנו לשמור על קו ישר, לגלוש למרחקים גדולים יותר ולשאת ציוד למסלולים בני כמה ימים.'
      icon: tabler:building
      cta: 'גלו את לוחות הטיול'
      link: /touring-sup
    - title: 'מועדונים, אתרי נופש והשכרות'
      keywords: 'צי השכרת SUP, ציוד מועדוני חתירה, פעילויות מים באתרי נופש'
      description: 'לוחות SUP ניפחים מוכנים לצי, עם עמידות אמינה, תחזוקה קלה ותמיכה בחלקי חילוף.'
      icon: tabler:shopping-cart
      cta: 'בנו את הצי שלכם'
      link: /solutions
    - title: 'מפיצים ארציים ושותפי מותג משותף'
      keywords: 'מפיץ ארצי SUP, SUP במותג משותף, SUP במותג פרטי'
      description: 'הפצה בלעדית מדינה אחר מדינה ואוספים מוגבלים במותג משותף עבור עסקי ספורט ימי מוסמכים.'
      icon: tabler:package
      cta: 'הפכו לשותף'
      link: /distributor-program


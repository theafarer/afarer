distributor:
  tagline: 'מפיצים בלעדיים ארציים'
  title: 'מדינה אחת. מפיץ רשמי אחד של Afarer.'
  subtitle: 'תוכנית של מדינה אחת-מפיץ אחד עם בלעדיות טריטוריאלית, תמחור לסוחרים, תמיכה שיווקית ותוכנית ייעודית להצלחת מפיצים.'
  benefits:
    - title: 'בלעדיות טריטוריאלית'
      description: 'מפיץ מורשה אחד לכל מדינה או אזור — בלי תחרות פנימית, בלי ניגודי ערוצים.'
    - title: 'מרווחים ישירות מהמפעל'
      description: 'מחירוני מפיצים והנחות שנתיות על כמויות מותחייבות, במשלוח FOB צ׳ינגדאו.'
    - title: 'תמיכה שיווקית והדרכה'
      description: 'נכסים במותג משותף, חומרי נקודת מכירה לסוחרים, הדרכת מוצר וקמפיינים להשקה.'
    - title: 'צוות חשבון ייעודי'
      description: 'מנהל מפיצים אישי וכן ליווי בקליטה, תחזיות ותמיכה בהזמנות חוזרות.'
  actions:
    - variant: primary
      text: 'הפכו למפיץ'
      href: /distributor-program
    - text: 'בקשו מחירון לסוחרים'
      href: '/contact?subject=Dealer Price List'
    - text: 'הגישו מועמדות לשותפות ארצית'
      href: '/contact?subject=Country Partnership Application'
    - text: 'הורידו את תוכנית ההפצה'
      href: /distributor-program
  note: 'הזמנה ראשונה מינימלית של 100–300 יחידות למפיצים ארציים/אזוריים. הזמנות ניסיון החל מ-10–30 יחידות.'

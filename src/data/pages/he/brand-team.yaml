philosophy:
  tagline: 'פילוסופיית עיצוב'
  title: 'עיצוב מונחה הנדסה<br />— כל פרט חשוב'
  subtitle: 'פילוסופיית ההנדסה שלנו נשענת על שלושה עקרונות המנחים כל מוצר שאנו בונים.'
  list:
    - 'אמינות לפני הכול: כל מוצר של afarer נבדק כדי לעמוד בתנאים מהעולם האמיתי — מפעולות חילוץ במים קרים ועד השכרות באתרי נופש טרופיים. אנו מהנדסים יתר על המידה היכן שזה חשוב ביותר.'
    - 'דיוק ייצור: המתקנים שלנו משתמשים בחיתוך CNC, בריתוך בתדירות גבוהה ובבדיקות לחץ אוטומטיות. כל תפר, כל שסתום וכל חיבור עומדים במפרטים מתועדים.'
    - 'חדשנות מתמדת: צוות המו״פ שלנו מעריך ברציפות חומרים חדשים, שיטות ייצור ושיפורי עיצוב. אנו לא ממתינים לבעיות — אנו צופים אותן מראש.'
cta:
  title: 'רוצים לדון בפרויקט עם הצוות שלנו?'

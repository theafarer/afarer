vision:
  tagline: 'החזון שלנו'
  title: 'מעצבים את עתיד ספורט המים'
  body: 'afarer שואף להוביל את ענף ה-SUP המתנפח באמצעות חדשנות מתמדת, איכות בלתי מתפשרת ומחויבות איתנה לבטיחות ולקיימות — ובסופו של דבר להעשיר את חוויותיהם של חובבי ספורט המים ברחבי העולם. מרכז המו״פ של afarer הוא המקום שבו תשוקה פוגשת חדשנות, הקובע סטנדרטים חדשים לענף ספורט המים.'

labs_section:
  tagline: 'מעבדות'
  title: 'המעבדות שלנו'
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: 'מעבדת בדי PVC'
      description: 'מחקר ובדיקות מתמשכים של בדי סיפון PVC לחוזק מתיחה, עמידות ל-UV, שחיקה וגמישות בטמפרטורות נמוכות, כדי להבטיח אמינות ארוכת טווח בסביבות ימיות.'
      href: /randdcenter/pvc-fabric-lab/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 'סטודיו הנדסת גוף שיט'
      description: 'עיצוב מונע CAD וניתוח אלמנטים סופיים של גופי HDPE, אלומיניום ופיברגלס. כל גוף שיט עובר סימולציה דיגיטלית להתפלגות מאמצים ולעמידות בפגיעות לפני בניית אב-הטיפוס הראשון.'
      href: /randdcenter/hull-engineering/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: 'מרכז הריתוך RF'
      description: 'מתקן ריתוך בתדר רדיו ייעודי עם בקרת טמפרטורה ולחץ מדויקת, המייצר תפרים חזקים ואטומים העומדים בסטנדרטים של ענף הימייה לכלי שיט מתנפחים.'
      href: /randdcenter/rf-welding/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 'בריכת הבדיקות ההידרודינמית'
      description: 'בדיקות דגמים בקנה מידה בבריכת הבדיקות הפנימית שלנו למיטוב צורת גוף השיט, ביצועי הגלישה, היציבות ויעילות הדלק במגוון תנאי עומס וים.'
      href: /randdcenter/hydrodynamic-test-tank/
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: 'סדנת אבות-טיפוס'
      description: 'מתקן לבניית אבות-טיפוס ולציוד בקנה מידה מלא, שבו דגמים חדשים נבנים, מצוידים ונבדקים בים. כל אב-טיפוס עובר תוכנית בדיקות במים של 20 שעות לפחות לפני אישור ייצור.'
      href: /randdcenter/prototype-workshop/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 'מעבדת איכות ופיקוח'
      description: 'מעבדת הבטחת איכות ייעודית המבצעת בדיקות מתיחה, מחזורי שמירת אוויר, בדיקות קילוף תפרים והסמכת חומרים, כדי להבטיח שכל לוח היוצא מהסדנה עומד במפרטים המפורסמים שלנו.'
      href: /randdcenter/quality-inspection-lab/

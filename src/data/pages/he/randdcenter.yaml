capabilities:
  tagline: 'יכולות'
  title: 'יכולות מו״פ'
  subtitle: 'ארבע דיסציפלינות ליבה המעניקות לנו שליטה מקצה לקצה בפיתוח המוצר — ממחקר חומרי הגלם ועד להסמכה הסופית.'
  groups:
    - title: 'מדע החומרים וטכנולוגיית בדים'
      items:
        - 'ניתוח ומיטוב של ניסוחי PVC'
        - 'פיתוח תוספות ייצוב UV, עמידות לאש ואנטי-מיקרוביאליות'
        - 'למינציה של בדים רב-שכבתיים והנדסת הדבקה'
        - 'בדיקות הזדקנות מואצת (UV, תרמי, לחות, ספריי מלח)'
    - title: 'הנדסת גוף שיט והידרודינמיקה'
      items:
        - 'עיצוב גוף שיט תלת-ממדי פרמטרי ומיטוב CFD'
        - 'ניתוח אלמנטים סופיים לעומסים מבניים ולפגיעות'
        - 'בדיקות גרירה של דגמים בקנה מידה ואימות ביצועים'
        - 'פיתוח גוף שיט מותאם לפרופילי משימה מיוחדים'
    - title: 'טכנולוגיית ריתוך וחיבור'
      items:
        - 'פיתוח ומיטוב של תהליכי ריתוך דיאלקטרי RF'
        - 'שיטות ריתוך באוויר חם, בטריז חם ובאולטרסאונד'
        - 'הדבקה והסמכה של סרטי תפרים'
        - 'מידול חוזק ריתוך וחיזוי אורך חיים'
    - title: 'בדיקות, הסמכה וציות'
      items:
        - 'ניהול איכות ובדיקות ציות CE'
        - 'בדיקות עצמאיות של צד שלישי ותמיכה בהסמכה'
        - 'פיתוח פרוטוקולי בדיקה מותאמים להסמכת רכש'
        - 'ניתוח כשלים בשירות וחקירת שורש הבעיה'


meta:
  title: 'מרכז המו״פ | {SITE}'
  description: 'מחקר ופיתוח — בדיקות בדי PVC, הנדסת גוף שיט, ריתוך RF, בדיקות הידרודינמיות ובקרת איכות. שירותי מו״פ מותאמים זמינים.'

hero:
  tagline: 'מרכז המו״פ'
  title: 'מרכז המחקר והפיתוח'
  subtitle: 'ממוקדים בהתקדמות'

intro:
  - 'מרכז המחקר והפיתוח (מו״פ) של afarer הוא הכוח המניע מאחורי המשימה שלנו לחולל מהפכה בציוד ספורט המים. אנו מעצימים חובבי ספורט מים ברחבי העולם במוצרים בטוחים, נוחים ומהנים יותר באמצעות חדשנות בלתי מתפשרת בגלשני פאדל מתנפחים בעמידה (SUP). הצוות המסור שלנו — מהנדסים, מעצבים ומומחי ספורט מים נלהבים — מעצב את עתיד הענף ומציב בעקביות רף גבוה יותר לאיכות, לביצועים ולקיימות.'
  - 'מתקן המו״פ שלנו מאחד תחת קורת גג אחת מדעני חומרים, מהנדסי ימייה ומהנדסי ייצור. מניסוח בדים וסימולציית גוף שיט ועד פיתוח תהליכי ריתוך והפלגות ניסוי בקנה מידה מלא בים — כל שלב בפיתוח המוצר מונע על ידי נתונים ומאומת בבדיקות.'


stories:
  tagline: 'סיפורי מגלים'
  title: 'הרפתקאות אמיתיות מאנשים אמיתיים'
  subtitle: 'האזינו לחותרים, למשפחות ולאנשי מקצוע שמשתמשים בציוד afarer על המים.'
  items:
    - name: 'שרה ומייק'
      title: 'בעלי SUP Explorer 11, קנדה'
      content: 'לקחנו את לוחות ה-Explorer 11 שלנו לטיול של שבוע בפארק אלגונקווין. הם התמודדו יפה עם המעברות ועם חציית האגמים. מבנה ה-Drop-Stitch אפשר לנו לנפח עד 15 PSI ולקבל ביצועים של לוח קשיח מלוח שאפשר לארוז.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'פארק אלגונקווין, קנדה'
    - name: 'קרלוס ר.'
      title: 'רוכב Cheetah Surge, ספרד'
      content: 'ה-Cheetah Surge הוא הלוח המועדף עליי לשיט לאורך החוף. העיצוב החי והססגוני מושך מבטים בחוף, והיציבות נותנת לי ביטחון בגלים קלים. הוא מתפקד נהדר בין אם אני בטיול ובין אם אני נהנה פשוט מהשקיעה.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'קוסטה בראווה, ספרד'
    - name: 'לינה ומשפחתה'
      title: 'חותרות Flowing Lotus, שוודיה'
      content: 'הרפתקאות משפחתיות בסופי שבוע בארכיפלג. ה-Flowing Lotus יציב מספיק כדי שבתי תוכל לעמוד עליו בזמן שאני חותרת. מתנפח בערך ב-10 דקות — אין צורך בנגרר, פשוט כיף משפחתי טהור על המים.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'ארכיפלג סטוקהולם, שוודיה'
    - name: 'לוטננט קומנדר אנדרס'
      title: 'מגלה Ocean Voyager, הפיליפינים'
      content: 'אני משתמש ב-Ocean Voyager שלי לטיולים ארוכים לאורך החוף סביב פלאוואן. אחרי חודשים של שימוש יומיומי בתנאים טרופיים, הלוח עדיין מתפקד כמו חדש. צורת הטיול שלו חותכת גלים קלים שהיו עוצרים לוחות פחותים.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'פלאוואן, הפיליפינים'
    - name: 'אמה ט.'
      title: 'מתחילה ב-Tropical Breeze, אוסטרליה'
      content: 'מעולם לא הייתי על SUP לפני כן. ה-Tropical Breeze כל כך יציב שהרגשתי בטוחה כבר בניסיון הראשון. כיום אני חותרת בכל סוף שבוע. עקומת הלמידה היא בעצם אפס — והלוח נראה מדהים על המים.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'גולד קוסט, אוסטרליה'


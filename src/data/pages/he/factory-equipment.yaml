hero:
  tagline: 'ציוד'
  title: 'ציוד ומכונות ייצור'
  subtitle: 'ציוד בדרגה תעשייתית לחיתוך, ריתוך, הדפסה והרכבה'
  back_label: 'חזרה למפעל'
  back_link: /factory/

categories:
  - title: 'חיתוך והכנת חומרים'
    items:
      - name: 'מכונת חיתוך PVC אוטומטית'
        spec: 'בבקרת CNC, 6.5 מ׳ × 2.5 מ׳, דיוק 0.1 מ״מ'
        desc: 'מכונת חיתוך אוטומטית בבקרה ממוחשבת לבדי PVC ו-Drop-Stitch. תוכנת קיבול מייעלת את ניצולת החומר לבזבוז של פחות מ-5%.'
      - name: 'מכונת פריסת בד'
        spec: 'רוחב מרבי 3 מ׳, הזנה בבקרת מתיחה'
        desc: 'פורסת בד בשכבה אחת או מרובה במתיחה מבוקרת למניעת עיוות לפני החיתוך.'

  - title: 'ריתוך וחיבור צינורות'
    items:
      - name: 'מכונת איטום בחום'
        spec: 'ריתוך באוויר חם, טווח משתנה 200–600 מעלות, 0.5–5 מ׳/דקה'
        desc: 'מכונת איטום בחום באוויר חם לחיבור וריתוך PVC ותפרי דפנות. משמשת לקיבוע ראשוני, איטום והיתוך של תאי צינור וחיבורי מצופים.'
      - name: 'מכבש RF דיאלקטרי'
        spec: '15 קילוואט, משטח 2000 × 600 מ״מ'
        desc: 'מכבש ריתוך בתדרי רדיו לתפרים אורכיים ראשיים, רצועות דפנות וייצור תאים גדולים.'
      - name: 'מרתך RF בבקרת CNC'
        spec: '8 קילוואט, שולחן XY בגודל 2500 × 1200 מ״מ'
        desc: 'ריתוך תפרים מעוקלים מתוכנת לגיאומטריות מורכבות, טבעת לוגו ועבודות טלאי מדויקות.'

  - title: 'ייצור לוחות SUP'
    items:
      - name: 'מכבש למינציה לליבות Drop-Stitch'
        spec: 'מכבש בפורמט גדול לליבות לוח עד 14 רגל LOA'
        desc: 'למינציה מדויקת של ליבות Drop-Stitch לשכבות PVC חיצוניות. כל שכבה מחוברת בלחץ לאיכות וחוזק עקביים.'
      - name: 'מחרטת CNC (5 צירים)'
        spec: 'נפח עבודה 3 מ׳ × 2 מ׳ × 1 מ׳, ציר מקורר במים'
        desc: 'עיבוד של תיבות סנפירים, חיתוכי ידיות ורכיבי לוח מותאמים אישית.'

  - title: 'הדפסה ועיצוב לוחות SUP'
    items:
      - name: 'מדפסת דיגיטלית'
        spec: 'הזרקת דיו ברזולוציה גבוהה, עד רוחב הדפסה של 2 מ׳'
        desc: 'הדפסה דיגיטלית ישירה על בד לגרפיקת סיפון SUP צבעונית מלאה. מדפיסה דוגמאות מותאמות אישית, מעברי צבע ותמונות באיכות צילום בדיו מימי עמיד UV.'
      - name: 'מכונת הדפסת מסך'
        spec: 'ידנית וחצי-אוטומטית, רישום מרובה צבעים'
        desc: 'הדפסת מסך ללוגואים של לוחות SUP, סימני מותג ודוגמאות חוזרות. מספקת הדפסים עמידים ואטומים עם רוויית צבע חיה.'

  - title: 'הרכבה וציוד'
    items:
      - name: 'תחנת הרכבת לוחות'
        spec: 'מודולרית מתכווננת, פריסה מרובת תחנות'
        desc: 'הרכבה של תיבות סנפירים, ידיות, טבעות D, שסתומים ושכבות סיפון על לוחות SUP.'
      - name: 'מכבש התקנת שסתומים'
        spec: 'פנאומטית, לחץ מתכוונן'
        desc: 'התקנה ואיטום מדויקים של שסתומי Halkey-Roberts ו-Leafield.'
      - name: 'מכונת למינציה לשכבות סיפון'
        spec: '3 מ׳ × 1.5 מ׳, בבקרת טמפרטורה'
        desc: 'למינציה בחום של שכבות קצף EVA לחלק העליון של לוחות SUP בחוזק הדבקה עקבי.'

  - title: 'בדיקות ובקרת איכות'
    items:
      - name: 'מכשיר מתיחה אוניברסלי'
        spec: '50 קילו-ניוטון, ASTM D751'
        desc: 'בדיקות כוח שבירה, התארכות בשבירה והתפשטות קריעה למחלקות בד.'
      - name: 'עמדת בדיקת אחזקת אוויר'
        spec: 'מתוכנתת, החזקת לחץ של 30 דקות'
        desc: 'בדיקת החזקת לחץ אוטומטית לכל תא צינור לפני ההרכבה.'
      - name: 'בודק קילוף תפרים'
        spec: 'קילוף ממונע 180 מעלות ב-100 מ״מ/דקה'
        desc: 'בדיקת חוזק קילוף לתפרים מרותכים ומודבקים לפי EN ISO 25649.'
      - name: 'תא הזדקנות בקשת קסנון'
        spec: 'חשיפה של 2000 שעות'
        desc: 'בדיקת עמידות UV לשינויי צבע ושימור חוזק.'


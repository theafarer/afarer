      href: '/learn/materials/'
    - title: 'מדריך גודל SUP'
      description: 'מצאו את אורך הלוח, הרוחב והנפח המתאימים למשקל, לרמה ולסגנון החתירה שלכם.'
      icon: 'tabler:ruler'
      href: '/size-guide/'
    - title: 'טכניקות ביניים'
      description: 'שדרגו את החתירה שלכם עם תנועות משוט מתקדמות, טכניקות פנייה והתמודדות עם מים סוערים.'

featured:
  tagline: 'נושאים נבחרים'
  title: 'התחילו את מסע הלמידה שלכם'
  subtitle: 'בין אם אתם חדשים בספורט המים ובין אם אתם רוצים לשפר רמה, המדריכים שלנו מכסים הכול.'
  items:
    - title: 'יסודות ה-SUP'
      description: 'כל מה שמתחיל צריך לדעת — סוגי לוחות, מידות משוט, עמידה וטיפים ליום הראשון.'

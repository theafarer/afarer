meta:
  title: 'ייצור SUP במותג פרטי והשקת מותג מותאם אישית | {SITE}'
  description: 'יצרן SUP במותג פרטי עבור מותגי לוחות חתירה חדשים. השיקו מותג SUP משלכם עם Afarer — שירות OEM/ODM מלא הכולל עיצוב, אבות טיפוס, מיתוג מותאם אישית, ייצור ולוגיסטיקה גלובלית.'

hero:
  tagline: 'בנו מותג משלכם'
  title: 'השיקו מותג SUP<br />משלכם'
  subtitle: 'יש לכם את החזון. יש לנו את המפעל, את המומחיות ואת שרשרת האספקה. ייצור SUP במותג פרטי ופיתוח מותג SUP מותאם אישית — יחד נבנה מותג שבולט מעל כולם.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'לוח SUP ממותג מותאם אישית על המים'

process:
  title: 'מסע המותג שלכם'
  subtitle: 'מרעיון ועד שוק ב-5 שלבים.'
  steps:
    - phase: 'שלב 1'
      title: 'רעיון'
      period: 'שבוע 1-2'
      items:
        - 'מחקר שוק וניתוח מתחרים'
        - 'הגדרת לקוח היעד'
        - 'סדנת מיצוב מותג'
        - 'אסטרטגיית קו מוצרים'
    - phase: 'שלב 2'
      title: 'עיצוב'
      period: 'שבוע 3-6'
      items:
        - 'עיצוב צורת הלוח וגרפיקה'
        - 'התאמת צבעים ובחירת חומרים'
        - 'מפרט אביזרים'
        - 'עיצוב אריזה ותווית'
    - phase: 'שלב 3'
      title: 'אב טיפוס'
      period: 'שבוע 7-10'
      items:
        - 'ייצור דגימה'
        - 'בדיקות איכות (לחץ, ציפה, UV)'
        - 'התאמות עיצוב'
        - 'אישור סופי'
    - phase: 'שלב 4'
      title: 'ייצור'
      period: 'שבוע 11-14'
      items:
        - 'ייצור סדרתי'
        - 'ביקורת QC (לכל יחידה)'
        - 'מטען ימי / אווירי'
        - 'מסמכי שחרור ממכס'
    - phase: 'שלב 5'
      title: 'השקה'
      period: 'שבוע 15-16'
      items:
        - 'צילומי מוצר'
        - 'הזנת מוצרים לאתר'
        - 'חומרי שיווק'
        - 'תמיכה בהשקה'

packages:
  title: 'חבילות התחלה'
  subtitle: 'חבילות שתוכננו לכל שלב בצמיחת המותג.'
  items:
    - name: 'מותג בהתחלה'
      tagline: '50-100 יחידות · 2 דגמי לוח'
      features:
        - 'הדפסת לוגו בסיסית'
        - 'אריזה סטנדרטית'
        - 'תמיכה באימייל'
    - name: 'מותג צומח'
      tagline: '300-1,000 יחידות · 3-5 דגמי לוח'
      features:
        - 'צבע + לוגו מותאמים אישית'
        - 'אריזה מותאמת אישית'
        - 'תצלומי מוצר'
        - 'מנהל ייעודי'
    - name: 'מותג מבוסס'
      tagline: '1,000+ יחידות · קו מוצרים מלא'
      features:
        - 'התאמה אישית מלאה'
        - 'אריזת פרימיום'
        - 'חומרי שיווק'
        - 'עדיפות בייצור'


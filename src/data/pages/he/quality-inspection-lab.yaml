intro: 'כל לוח שיוצא מהסדנה שלנו נושא עימו את האישור שעבר מערך מוגדר של בדיקות איכות ובדיקות חומרים. מעבדת האיכות והבקרה שלנו היא יחידה עצמאית בארגון — היא מדווחת ישירות למנכ״ל ולא למחלקת הייצור — וכך מובטח ששום לחץ מסחרי לא יוכל לפגוע בשער הבקרה. אם מחזור חומרים או לוח מוגמר אינם עומדים במפרט המפורסם, למעבדה יש סמכות לעצור את המשלוח עד שחוסר ההתאמה יתוקן.'

content_html: |
  <h2>אמון, אך וידוא</h2>
  <p>המעבדה פועלת תחת מערכת ניהול איכות המיושרת עם עקרונות מוכרים, ושיטות הבדיקה שלנו מבוססות על תקני ISO, ASTM ו-EN בכל מקום שבו הדבר רלוונטי. אנו מנהלים רישומים מפורטים של כל בדיקה שבוצעה, וכך נוצרת שרשרת מעקב מלאה מקבלת חומרי הגלם ועד מסירת הלוח הסופית.</p>

  <h2>ציוד בדיקה ויכולות</h2>
  <table>
    <thead><tr><th>ציוד</th><th>בדיקות שבוצעו</th><th>תקן / שיטה</th></tr></thead>
    <tbody>
      <tr><td>מכונת בדיקה אוניברסלית (50 kN)</td><td>חוזק מתיחה (בד), עמידות לקילוף (תפרים), התפשטות קריעה</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>עמדת בדיקת שמירת אוויר (מתוכנתת)</td><td>עמידות ב-1000 מחזורי ניפוח/ריקון, בדיקת החזקת לחץ של 30 דקות</td><td>EN ISO 25649 (פנימי)</td></tr>
      <tr><td>מתקן בדיקת קילוף תפרים (קילוף ממונע 180°)</td><td>חוזק קילוף של תפרים מרותכים ומודבקים ב-100 מ״מ/דקה</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>בודק עמוד הידרוסטטי</td><td>עמידות בד לחדירת מים (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>מד עובי דיגיטלי ומיקרומטר</td><td>עובי בד, עובי דופן מסילה, עובי שכבת דבק</td><td>ISO 2286-3</td></tr>
      <tr><td>תא אקלים</td><td>התניה תרמית (-40 °C עד +80 °C) לבדיקות סדקי קור והזדקנות בחום</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>ספקטרופוטומטר צבע</td><td>מדידת צבע Delta-E לאחר חשיפה ל-UV</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>שערי הבקרה — מהחומר ועד המסירה</h2>
  <p>כל לוח עוקב אחר תוכנית איכות מוגדרת עם נקודות בדיקה חובה. שום לוח אינו יכול לדלג על שער; כל שער חייב להיות מאושר על ידי מפקח איכות לפני ששלב הייצור הבא מתחיל.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">שער 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">בדיקת חומרים נכנסים</p>
            <p class="text-xs text-gray-500 mt-1">מחזור בד, מחזור דבק, חומרה — הכל נבדק מול מפרט הקבלה לפני השחרור לייצור.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">שער 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">בדיקת ריתוך בתהליך</p>
            <p class="text-xs text-gray-500 mt-1">דגימת ריתוך ראשונה נבדקת (קילוף + ויזואלי) בתחילת כל משמרת ייצור.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">שער 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">בדיקת אוויר לתאים</p>
            <p class="text-xs text-gray-500 mt-1">כל תא מונע ללחץ של פי 1.5 מלחץ העבודה ומוחזק 30 דקות. הנתונים נרשמים לפי מספר סידורי.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">שער 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">בדיקה לפני מסירה</p>
            <p class="text-xs text-gray-500 mt-1">הלוח נבדק במלואו: כל המהדקים מוברגים במומנט, ההתקנים תקינים, אין פגמים אסתטיים. רשימת בדיקה של 100 סעיפים.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">שער 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">הסמכה סופית</p>
            <p class="text-xs text-gray-500 mt-1">דוחות הבדיקה נאספים, רישומי הבדיקה נסקרים ומונפקת תעודת התאמה.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>מדדי איכות מרכזיים (ממוצע נע של 2025)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">תשואת מעבר ראשון (מחזור בד)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">שיעור פסילת ריתוכים (מטר ליניארי)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">תאים שנבדקו באוויר לפני ההרכבה</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">עמידה בקטגוריית העיצוב</span>
    </div>
  </div>

  <h2>צוות האיכות שלנו</h2>
  <p>במעבדה מועסקים מנהל איכות (10 שנים בבטחת איכות ימית, מהנדס איכות מוסמך ASQ), שני מפקחי איכות (לכל אחד הסמכת NDT רמה 2 בבדיקה ויזואלית) וטכנאי חומרים האחראי לכל הבדיקות הפיזיקליות. הצוות עובר בדיקות מיומנות שנתיות באמצעות ספק עצמאי של צד שלישי כדי להבטיח שתוצאות הבדיקות שלנו יישארו מדויקות וניתנות לשחזור.</p>

  <h2>בדיקות עצמאיות עבור לקוחות</h2>
  <p>מעבדת האיכות והבקרה שלנו זמינה לשירותי בדיקה עצמאיים. אם עליכם לאמת מפרט בד, לאמת מערכת דבק חדשה או להשיג דוח בדיקה של צד שלישי לצורך הסמכת רכש, אנו יכולים לבצע את הבדיקות לפי התקן החל ולהנפיק דוח בדיקה מוסמך.</p>
  <p>דוגמאות לעבודות בדיקה אחרונות מטעם צד שלישי:</p>
  <ul>
    <li>השוואת חוזק קילוף של חמישה מוצרי סרט דבק מתחרים עבור תוכנית רכש צבאית אירופית.</li>
    <li>מחקר הזדקנות מואצת (UV + מחזורי חום) של נוסחת PVC חדשה בפיגמנטציה כתומה, עם מדידות ביניים סדירות במרווחים של 500 שעות.</li>
    <li>אימות שמירת אוויר של 50 שסתומי מחיצה לאבות טיפוס עבור תכנון תא בלחץ גבוה חדש.</li>
  </ul>

  <h2>המחויבות שלנו כלפיכם</h2>
  <p>כאשר אתם מקבלים לוח Afarer, אתם מקבלים גם את תיק האיכות שלו — רישום מאוגד של תוצאות הבדיקות החלות על הלוח הספציפי שלכם. תעודת מחזור הבד, בדיקות קילוף ריתוכים, יומני בדיקת אוויר לתאים ורשימת הבדיקה שלפני המסירה. כל מספר ניתן למעקב. כל מפקח מזוהה. זה לא רק ניירת — זו ההבטחה שלנו שמה שמסרנו הוא בדיוק מה שפרטנו.</p>
  <p>אם אי פעם תעלה אצלכם בעיה של איכות, תוכלו לפנות ישירות למעבדה — פרטי הקשר מודפסים על תעודת ההתאמה שלכם. אנו מתייחסים ברצינות לכל פנייה ומתחייבים לחקירה רשמית בתוך 48 שעות.</p>


intro: 'בניגוד למותגים המאצילים את הייצור למפעלי צד שלישי, afarer היא הבעלים והמפעילה של כל שרשרת הייצור שלה. אינטגרציה אנכית זו מאפשרת לנו לשמור על בקרת איכות קפדנית בכל שלב, להגיב במהירות לדרישות מותאמות אישית ולספק איכות מוצר עקבית מחלקה לחלקה. כך נבנה לוח במתקן שלנו.'

steps:
  - step: '01'
    title: 'קבלה ובדיקה של חומרים'
    description: 'כל מחלקה נכנסת של בד PVC, מצע פיברגלס, שרף וחומרה נבדקת מול המפרט. דגימות בד נבדקות לחוזק מתיחה, אחידות עובי ועמידות UV לפני שחרור לייצור. חומרים שאינם עומדים בדרישות מוכנסים לבידוד ומוחזרים.'
    duration: '1–2 ימים'
  - step: '02'
    title: 'חיתוך PVC אוטומטי'
    description: 'בדים מאושרים נפרשים על מכונת החיתוך האוטומטית CNC ונחתכים בדיוק תת-מילימטרי. קיבול ממוחשב מסדר את הלוחות למזעור בזבוז — בדרך כלל מתחת ל-5%. לוחות חתוכים מסומנים לפי דגם הלוח והתא, ואז נאגדים להעברה לסדנת הריתוך.'
    duration: '2–4 שעות לערכת לוח'
  - step: '03'
    title: 'איטום בחום וריתוך צינורות'
    description: 'הלוחות מקובעים ומחוברים באמצעות מכונות איטום בחום עם ריתוך באוויר חם בטמפרטורות מבוקרות של 200–300 מעלות. תפרים ראשיים מחוזקים בריתוך RF דיאלקטרי לחיבורים אטומים וחזקים. תאים שהושלמו מנופחים ל-1.5 מהלחץ העבודה לאימות אחזקת אוויר של 30 דקות.'
    duration: '1–2 ימים ללוח'
  - step: '04'
    title: 'הדפסה ועיצוב לוחות SUP'
    description: 'גרפיקת סיפון לוחות SUP מיושמת באמצעות הדפסה דיגיטלית לעיצובים צבעוניים מלאים באיכות צילום, והדפסת מסך ללוגואים ודוגמאות חוזרות עמידים. ההדפסים מקובעים ונאטמים לעמידות UV ולשחיקה.'
    duration: '1–2 ימים'
  - step: '05'
    title: 'הרכבה וציוד סופיים'
    description: 'הלוחות מצוידים על קו ההרכבה בסנפירים, שסתומים, סיפוני EVA ואביזרים. כל יחידה עוקבת אחר רשימת בדיקה של 100 נקודות עם אישור חובה בכל שלב.'
    duration: '2–4 ימים'
  - step: '06'
    title: 'בדיקות איכות ובקרה'
    description: 'כל לוח שהושלם עובד שעת איכות חובה: בדיקת אחזקת אוויר בתאים, בדיקת תפקוד חומרה, אימות מומנט הידוק ובדיקה חזותית. מבנים מותאמים אישית ואבות-טיפוס מקבלים גם הפלגות ניסוי במים הכוללות יציבות והתנהגות.'
    duration: '1–2 ימים'
  - step: '07'
    title: 'אריזה ומשלוח'
    description: 'הלוחות מרוקנים, מקופלים לפי נוהל, נארזים בשקי בד עמידים או בארגזי עץ לבוד ונטענים למשלוח. כל חבילה מסומנת בדגם, מספר סידורי ויעד. אנו מתאמים עם מובילי מטענים למשלוחי מכולות FCL ו-LCL לכל העולם.'
    duration: 'יום אחד'


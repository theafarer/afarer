faqs_sup:
  title: 'שאלות נפוצות על לוחות SUP'
  subtitle: 'שאלות נפוצות לגבי לוחות החתירה בעמידה שלנו.'
  columns: 2
  items:
    - title: 'באילו גדלים של לוחות SUP מציע afarer?'
      description: 'אנו מציעים לוחות SUP מ-9 רגל ועד 12 רגל, המכסים הכל — מלוחות all-around קומפקטיים ועד עיצובים לטיולים וייעודיים. כל דגם זמין עם מספר אפשרויות תצורה.'
    - title: 'מה ההבדל בין SUP ניפחים ל-SUP קשיח?'
      description: 'SUP ניפחים משתמש במבנה Drop-Stitch עם אלפי חוטים פנימיים המאפשרים לחץ אוויר גבוה, בעוד ש-SUP קשיח עשוי אפוקסי או פיברגלס. לוחות SUP ניפחים מציעים ניידות ונוחות אחסון מבלי להתפשר על קשיחות.'
    - title: 'מה מגבלת המשקל ללוחות SUP?'
      description: 'לוחות ה-SUP שלנו תומכים בעומס של עד 150 ק״ג בהתאם לדגם ולנפח. כל עמוד מוצר מפרט את דירוג העומס המרבי עבור הדגם הספציפי שלכם.'
    - title: 'האם לוחות SUP של afarer מוסמכים CE?'
      description: 'כן. כל דגמי ה-SUP לפנאי מוסמכים CE תחת התקנים האירופיים הרלוונטיים לשימוש פנאי.'
    - title: 'מהי האחריות על לוחות SUP?'
      description: 'כל לוחות ה-SUP של afarer מגיעים עם אחריות סטנדרטית לשנה נגד פגמי ייצור, המכסה כשל תפרים, פגמי שסתומים והיפרדות חומרים בשימוש רגיל.'
    - title: 'כמה זמן לוקח לנפח לוח SUP?'
      description: 'באמצעות משאבת היד הכלולה, ניפוח מלא עד 15 PSI אורך כ-8–12 דקות. לניפוח מהיר יותר, אנו ממליצים על המשאבה החשמלית 12V של afarer, המנפחת לוח בפחות מ-4 דקות.'

faqs_materials:
  title: 'שאלות נפוצות על חומרים וטיפול ב-SUP'
  subtitle: 'שאלות נפוצות לגבי חומרי לוחות ה-SUP הניפחים שלנו, הטיפול בהם ואחסון.'
  columns: 2
  items:
    - title: 'מאילו חומרים עשויים לוחות ה-SUP הניפחים של afarer?'
      description: 'אנו משתמשים ב-PVC ברמה צבאית (1100 דניר) עם מבנה מיוצב ל-UV ועמיד לשחיקה, העומד בתקנות REACH ו-RoHS של האיחוד האירופי.'
    - title: 'כמה זמן מחזיקים מעמד לוחות SUP ניפחים?'
      description: 'בטיפול נאות, לוח SUP ניפחים איכותי מ-PVC מחזיק 5–10 שנים. ניקוי קבוע, הגנת UV ואחסון נכון מאריכים משמעותית את תוחלת החיים.'
    - title: 'איזו תחזוקה נדרשת ללוח SUP ניפחים?'
      description: 'תחזוקה בסיסית כוללת שטיפה במים מתוקים לאחר כל שימוש (במיוחד במי ים), ייבוש לפני האחסון, בדיקת אטימות השסתומים אחת לשנה והימנעות מחשיפה ממושכת לשמש כשאינו בשימוש.'
    - title: 'האם ניתן להשתמש בלוחות SUP ניפחים במי ים?'
      description: 'כן. כל לוחות ה-SUP הניפחים של afarer מיועדים לשימוש גם במים מתוקים וגם במי ים. אנו ממליצים לשטוף במים מתוקים ולייבש היטב לאחר חשיפה למי ים.'
    - title: 'כיצד מאחסנים לוח SUP ניפחים?'
      description: 'יש לרוקן את האוויר, לנקות ולייבש את הלוח בצורה יסודית לפני האחסון. לגלגל בצורה רופפת (להימנע מקיפולים הדוקים), לאחסן במקום קריר ויבש הרחק משמש ישירה, ולהרחיק מרצפות בטון למניעת ספיחת לחות.'
    - title: 'מהי קיבולת המשקל של לוחות ה-SUP הניפחים של afarer?'
      description: 'קיבולות המשקל נעות בין 100 ק״ג בדגמים הקטנים שלנו ועד למעלה מ-200 ק״ג בלוחות גדולים יותר. כל עמוד מוצר מפרט את דירוג העומס המרבי עבור הדגם הספציפי שלכם.'


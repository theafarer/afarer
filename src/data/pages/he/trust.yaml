features3_certifications:
  title: 'הסמכות ועמידה בתקנות'
  subtitle: 'כל מוצר נבדק ומוסמך באופן עצמאי לפי תקנים בינלאומיים.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'הסמכת CE'
      description: 'כל לוחות ה-SUP של afarer עומדים בתקן הבטיחות האירופי CE לשימוש פנאי. כל מוצר עובר בדיקות לחץ, ציפה ועומס לפני שהוא עוזב את המפעל.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'מתקן צ׳ינגדאו שלנו, בשטח של 12,000 מ״ר, פועל תחת מערכת ניהול איכות ISO 9001. כל מחזור ייצור ניתן למעקב, מתועד ונבדק.'
      icon: 'tabler:clipboard-check'
    - title: 'עמידה חברתית BSCI'
      description: 'אנו מחזיקים בהסמכת BSCI, המבטיחה נוהלי עבודה אתיים, תנאי עבודה בטוחים ואחריות סביבתית לאורך שרשרת האספקה שלנו.'
      icon: 'tabler:users'
    - title: 'REACH ו-RoHS'
      description: 'כל החומרים — PVC, קצף EVA, דבקים — עומדים בתקנות REACH ו-RoHS של האיחוד האירופי. ללא חומרים מוגבלים, ללא פשרות.'
      icon: 'tabler:flask'
    - title: 'מעבדת בדיקת חומרים'
      description: 'מעבדת חומרים פנימית בודקת חוזק מתיחה, עמידות ל-UV, שלמות תפרים ושחיקה עבור כל מחזור בד לפני הייצור.'
      icon: 'tabler:microscope'
    - title: 'אחריות לשנתיים'
      description: 'כל מוצר afarer מגיע עם אחריות לשנתיים נגד פגמי ייצור. אנו עומדים מאחורי מה שאנו בונים.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'אמון לקוחות'
  title: 'מה הלקוחות שלנו אומרים'
  subtitle: 'מחותרים מתחילים ועד מפעילי ציים מקצועיים — ראו מדוע הם סומכים על afarer.'
  items:
    - content: 'ציידנו את כל צי ההשכרה שלנו בלוחות SUP של afarer. שתי עונות חלפו, אפס תקלות. הסמכת ה-CE הפכה את אישור הביטוח לקל וחלק.'
      name: 'Marco V.'
      title: 'מפעיל טיולים, קרואטיה'
    - content: 'כקונה בפעם הראשונה, הייתי חששן לגבי האיכות. תיעוד ה-ISO ודוחות הבדיקה ששיתפו איתי העניקו לי ביטחון מלא.'
      name: 'James T.'
      title: 'בעלים של דגם SUP Explorer 11, קנדה'
    - content: 'אנו עובדים עם afarer עבור יחידות הסיור החופיות שלנו. תהליך בקרת האיכות שלהם עקבי בכל מחזור — האמינות הזו חשובה בפעולות קריטיות.'
      name: 'Lt. Cmdr. Andres'
      title: 'רכש ממשלתי, הפיליפינים'

steps2_manufacturing:
  title: 'כיצד אנו מבטיחים איכות'
  subtitle: 'מבדיקת חומרי הגלם ועד בדיקת הלחץ הסופית — כל מוצר עובר שרשרת איכות קפדנית.'
  items:
    - title: 'בדיקת חומרי גלם'
      description: 'כל גליל של בד PVC נבדק לעובי, לחוזק מתיחה ולעמידות ל-UV לפני שהוא נכנס לייצור.'
      icon: 'tabler:search'
    - title: 'בקרת איכות בתהליך'
      description: 'תפרי ריתוך, התקנות שסתומים וחיבורי תאים נבדקים בכל תחנה במהלך ההרכבה.'
      icon: 'tabler:eye'
    - title: 'בדיקת לחץ'
      description: 'כל מוצר ניפחים מנופח ללחץ של 1.25x מה-PSI המדורג ומוחזק כך 24–48 שעות לאימות שמירת האוויר ושלמות התפרים.'
      icon: 'tabler:wind'
    - title: 'בדיקה סופית'
      description: 'כל יחידה נבדקת לגימור, חומרה ואריזה לפני שהיא מאושרת למשלוח. דגימות מהמחזור נשלחות למעבדה שלנו לבדיקות הרסניות.'
      icon: 'tabler:clipboard-check'


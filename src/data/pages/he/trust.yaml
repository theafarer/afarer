warranty_section:
  title: 'אחריות ותמיכה לאחר מכירה'
  subtitle: 'אנו עומדים מאחורי כל מוצר עם תנאי אחריות ברורים, עיבוד תביעות מהיר וחלקי חילוף מקוריים.'
  items:
    - title: 'אחריות מוצר לשנתיים'
      desc: 'כל מוצרי afarer נושאים אחריות לשנתיים נגד פגמי ייצור — כשל תפרים, פגמי שסתומים והיפרדות חומרים בשימוש רגיל.'
    - title: 'תמיכת חלקי חילוף לכל החיים'
      desc: 'חלקי חילוף מקוריים — שסתומים, ערכות תיקון, סנפירים, טבעות D — זמינים לכל הדגמים. אנו מחזיקים תבניות וכלים למשך 5 שנים לפחות לאחר סיום הייצור.'
    - title: 'מענה לתביעות תוך 48 שעות'
      desc: 'אישור קבלה של תביעות אחריות תוך 48 שעות. לוחות חלופיים נשלחים תוך 10 ימי עסקים לתביעות מאושרות.'
    - title: 'רשת תיקונים גלובלית'
      desc: 'מרכזי תיקון מורשים ביותר מ-15 מדינות. ערכות תיקון שדה זמינות לפעולות מרוחקות. מדריכי תיקון עצמאי לנזקים קלים.'
    - title: 'תמיכת לקוחות OEM'
      desc: 'מנהלי חשבון ייעודיים לשותפים עסקיים. סקירות עסקיות רבעוניות, תכנון מלאי ותמיכה בשיווק משותף.'
    - title: 'חבילת הסמכות'
      desc: 'תיעוד עמידה מלא המסופק עם כל משלוח — הצהרת CE, דוחות בדיקה, גיליונות בטיחות חומרים.'
      link: '/contact'


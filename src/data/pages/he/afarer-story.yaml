timeline:
  - year: '2012'
    title: 'יסודות הייצור הימי'
    body: 'afarer החל כסדנה מתמחה לכלי שיט בצ׳ינגדאו שבסין, במחויבות לאומנות ימית ולייצור כלי שיט. ההתמקדות המוקדמת הייתה בבניית מוצרים ניפחים אמינים באמצעות ניסיון הנדסי מעשי ומשמעת ייצור.'
  - year: '2015'
    title: 'ייצוא ראשון והסמכת CE'
    body: 'הזמנות הייצוא הראשונות הגיעו ליפן ולקוריאה. הושגה הסמכת CE עבור קווי המוצרים המרכזיים, מה שסימן את כניסתו של afarer לשווקים בינלאומיים. החברה החלה לשרת משתמשים מסחריים ומשתמשי פנאי מחוץ לסין.'
  - year: '2018'
    title: 'הרחבת המפעל'
    body: 'עברנו למתקן ייצור בשטח 12,000 מ״ר. נוספו קווי ריתוך RF וקיבולת ייצור Drop-Stitch, מה שאפשר ייצור בהיקף גדול יותר ושיפור מערכות בקרת האיכות.'
  - year: '2020'
    title: 'הקמת מרכז מו״פ'
    body: 'נפתח מרכז מו״פ ייעודי עם מעבדת בדי PVC, מכל בדיקות הידרודינמי וסטודיו לסימולציית CAD/FEA. פיתוח המוצרים הורחב והתמקד במבנה קל משקל, בעמידות משופרת ובעיצוב הממוקד במשתמש.'
  - year: '2022'
    title: 'הסמכה וצמיחה גלובלית'
    body: 'הושגה הסמכת ISO 9001. הצוות הורחב ל-14 מהנדסי מו״פ ולמעלה מ-200 עובדים. המוצרים הגיעו ללקוחות ברחבי אירופה, אמריקות ואסיה-פסיפיק באמצעות שותפויות הפצה ומותג משותף.'
  - year: '2024'
    title: 'סטודיו לחדשנות ועיצוב'
    body: 'הושק סטודיו עיצוב וחדשנות בשירות מלא עבור פרויקטים מותאמים אישית של מותג משותף, מהקונספט ועד לייצור. חוזקו יישומים ימיים מקצועיים, לרבות חילוץ, שימוש מסחרי וחוזים ממשלתיים.'
  - year: '2026'
    title: 'בונים את עתיד חקר המים'
    body: 'כיום afarer ממשיך לפתח מערכות SUP ואביזרים ימיים — ומחבר בין אנשים וארגונים לבין מקווי המים של העולם. מעל 50 מדינות מוגשות, קיבולת שנתית של למעלה מ-15,000 יחידות.'

content_founding:
  tagline: 'ההתחלה'
  title: 'נולד על שפת המים'
  subtitle: 'afarer התחיל בסדנה חופית בצ׳ינגדאו עם לוח אחד וחזון: לבנות כלי שיט ניפחים שיוכלו לעמוד בתנאים ימיים אמיתיים.'
  paragraphs:
    - 'ב-2012 ראו המייסדים שלנו פער בשוק — רוב כלי השיט הניפחים היו זולים אך בלתי אמינים, או איכותיים אך יקרים בצורה שאינה מאפשרת לרכוש אותם. הם האמינו שיש מקום ליצרן שיספק גם איכות וגם תמורה.'
    - 'הגוף הראשון נבנה בעבודת יד, נבדק במים מקומיים ושופר על בסיס משוב אמיתי מדייגים ומפעילים מסחריים קטנים. לולאת המשוב הזו — בנייה, בדיקה, הקשבה, שיפור — נמצאת עד היום בלב פילוסופיית ההנדסה שלנו.'
    - 'עד 2015 עברה השמועה את גבולות צ׳ינגדאו. מפיצים בינלאומיים החלו לבקש דגימות. מה שהתחיל כסדנה מקומית הפך לספק גלובלי.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'סדנת הייצור המוקדמת של afarer והמחלקת ייצור'

content_growth:
  tagline: 'צמיחה וחדשנות'
  title: 'מסדנה למתקן בשטח 12,000 מ״ר'
  subtitle: 'השקעה מתמדת באנשים, בציוד ובתהליכים הפכה את afarer למתקן ייצור ימי מודרני.'
  paragraphs:
    - 'ככל שהביקוש גדל, כך גדל גם המתקן שלנו. התרחבנו מסדנה קטנה למפעל בשטח 12,000 מ״ר עם קווי ייצור ייעודיים ללוחות SUP ולאביזרים.'
    - 'השקענו במכונות חיתוך CNC, בציוד ריתוך בתדירות גבוהה, בקווי ייצור Drop-Stitch ובעמדות בדיקה מקיפות — מה שמאפשר לנו לשלוט בכל היבט של איכות הייצור.'
    - 'כיום הצוות שלנו, ובו למעלה מ-200 עובדים, כולל מהנדסים ימיים, מדעני חומרים, מומחי בקרת איכות ובעלי מלאכה מיומנים — רבים מהם נמצאים עם afarer מהימים הראשונים.'

philosophy:
  tagline: 'פילוסופיית המותג'
  title: 'הנדסה של חופש על המים'
  body: 'חופש על המים אינו רק עניין של תנועה. הוא מייצג גילוי של מקומות חדשים, יצירת חוויות בחיק הטבע, חיבור בין אנשים לטבע והעצמת משימות מקצועיות. ההנדסה היא שהופכת את החופש הזה לאפשרי.'
  pillars:
    - title: 'אמינות לפני הכל'
      body: 'סביבות מים דורשות אמון. מוצרי afarer מתוכננים סביב יציבות, עמידות, בטיחות וביצועים עקביים.'
    - title: 'עיצוב הממוקד באדם'
      body: 'מוצרים צריכים לשרת אנשים, לא טכנולוגיה. כל החלטת עיצוב מתחילה בהבנת האופן שבו אנשים משתמשים בכלי שיט, לאן הם יוצאים לחקור ובאילו אתגרים הם נתקלים.'
    - title: 'חקר נגיש'
      body: 'המים לא צריכים להיות נחלתם של מומחים בלבד. afarer יוצרת ציוד המאפשר ליותר אנשים לחוות בבטחה נהרות, אגמים, אוקיינוסים וסביבות חוף.'
    - title: 'חדשנות מתמדת'
      body: 'חדשנות אינה רק יצירת מוצרים חדשים. היא שיפור של כל פרט — חומרים, מבנים, ייצור וחוויית משתמש.'

engineeringDna:
  tagline: 'DNA הנדסי'
  title: 'כיצד afarer יוצרת מוצרים'
  areas:
    - title: 'מדע החומרים'
      body: 'afarer מתמקדת בבחירת חומרים מתאימים לסביבות ימיות שונות. שיקולים מרכזיים כוללים עמידות לשחיקה, עמידות ל-UV, יציבות בלחץ ועמידות לטווח ארוך.'
      items: ['עמידות לשחיקה', 'עמידות ל-UV', 'יציבות בלחץ', 'עמידות לטווח ארוך']
    - title: 'הנדסה מבנית'
      body: 'כלי שיט ניפחים דורשים איזון מדויק בין קשיחות, משקל, ניידות ויציבות. ההנדסה של afarer מתמקדת באופטימיזציה של גורמים אלה באמצעות טכנולוגיית הליבה מסוג Drop-Stitch ובניית תפרים מתקדמת.'
      items: ['קשיחות', 'אופטימיזציית משקל', 'ניידות', 'יציבות']
    - title: 'דיוק ייצור'
      body: 'כל מוצר עובר תהליכים מבוקרים: הכנת חומרים, חיתוך מדויק, ריתוך והדבקה, הרכבה, בדיקת איכות ואימות ביצועים.'
      items: ['הכנת חומרים', 'חיתוך מדויק', 'ריתוך והדבקה', 'הרכבה ובקרת איכות']
    - title: 'הנדסת תרחישי משתמש'
      body: 'המוצרים מפותחים סביב יישומים אמיתיים — פנאי, הרפתקאות ושימוש מקצועי — תוך הבטחה שכל עיצוב עומד בדרישות הספציפיות של הסביבה שלה.'
      items: ['פנאי', 'הרפתקאות', 'מקצועי', 'מסחרי']


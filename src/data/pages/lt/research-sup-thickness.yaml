content_html: |
  <h2>Trys standartiniai storiai</h2>

  <h3>4" (10 cm) – Turizmas ir našumas</h3>
  <ul>
    <li>Didžiausias standumas – mažiau lankstumo esant apkrovai</li>
    <li>Pačios lengviausios – mažiau medžiagos, mažiau oro tūrio</li>
    <li>Puikus tiesus važiavimas – sumažintas šoninis siūbavimas</li>
    <li>Pačios greičiausios – mažesnis pasipriešinimas, lengvesnis čiuožimas</li>
    <li>Geriausiai tinka: turizmas, lenktynės, fitneso irklavimas, patyrusiems irkluotojams</li>
  </ul>

  <h3>5" (12.7 cm) – Universalios</h3>
  <ul>
    <li>Geras standumas – subalansuotas lankstumo ir standumo santykis</li>
    <li>Vidutinis svoris – standartinis medžiagų naudojimas</li>
    <li>Geras pirminis ir antrinis stabilumas</li>
    <li>Geriausiai tinka: poilsio irklavimas, pradedantiesiems, neformalus ežerų ir upių naudojimas</li>
  </ul>

  <h3>6" (15.2 cm) – Stabilumas ir joga</h3>
  <ul>
    <li>Didžiausias pirminis stabilumas – didžiulė plūdumo galia</li>
    <li>Pačios sunkiausios – daugiau PVC medžiagos, didesnis oro tūris</li>
    <li>Pačios lėčiausios – daugiau pasipriešinimo, sunkiau palaikyti čiuožimą</li>
    <li>Geriausiai tinka: joga/fitnesas, sunkesniems irkluotojams (100+ kg), labai bangavojančioms sąlygoms</li>
  </ul>

  <h2>Inžinerinė analizė</h2>
  <p>Pripučiamos SUP lentos standumą lemia vidinis oro slėgis ir lentos skerspjūvio inercijos momentas. Esant 20 PSI, 4" lenta esant apkrovai rodo maždaug 30 % mažiau lenkimo nei 6" lenta to paties pločio ir ilgio. Pirminis stabilumas kyla iš vandens linijos pločio ir plūdumo; antrinį stabilumą įtakoja bortelių forma ir lentos plotis.</p>

  <h2>Storis pagal irkluotojo svorį</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Irkluotojo svoris</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Rekomenduojamas storis</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Mažiau nei 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" arba 6"</td></tr>
      <tr><td class="p-3 border">Daugiau nei 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Storio ir PSI kompromisas</h2>
  <p>Dažna klaida manyti, kad aukštesnis PSI gali kompensuoti per didelį storį. Esant 25 PSI, 6" lenta rodo daugiau lankstumo nei 4" lenta esant 15 PSI, nes geometrinis inercijos momentas vyrauja standumo lygtyje. Našumui orientuotiems irkluotojams plonesnė lenta esant žemesniam slėgiui lenkia storesnę lentą esant aukštesniam slėgiui.</p>

  <h2>Afarer asortimentas</h2>
  <ul>
    <li><strong>4" lentos:</strong> Cheetah Touring serija – 12' x 30" x 4" turizmo SUP lentos fitnesui ir ilgo nuotolio irklavimui</li>
    <li><strong>5" lentos:</strong> Cheetah All-Round serija – 10'6" x 32" x 5" poilsio naudojimui</li>
    <li><strong>6" lentos:</strong> Cheetah Ultra-Stable serija – 10' x 34" x 6" jogai, stambiems irkluotojams ir fotografijos platformoms</li>
  </ul>
  <p>Visos lentos naudoja 1,680 DTEX „Drop-Stitch“ branduolius su 20 PSI nominaliu slėgiu ir 1.2 mm PVC laminatais.</p>


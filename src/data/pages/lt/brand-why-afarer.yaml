features3_reasons:
  tagline: 'Kodėl rinktis afarer'
  title: 'Septynios priežastys bendradarbiauti su mumis'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Reali gamyba, o ne prekyba'
      description: 'Mes valdome ir eksploatuojame 12,000 m² gamyklą. Bendradarbiaudami su afarer dirbate tiesiogiai su žmonėmis, kurie projektuoja, kuria ir gamina jūsų produktus — be tarpininkų.'
      icon: tabler:building-factory
    - title: '2. Inžinerijai orientuotas požiūris'
      description: 'Mūsų dizaino procesas prasideda nuo naudojimo atvejo, o ne produkto kategorijos. Optimizuojame korpuso formą, medžiagų parinkimą ir konfigūraciją pagal tai, kaip lenta iš tiesų bus naudojama.'
      icon: tabler:engine
    - title: '3. Sertifikuota kokybė'
      description: 'CE sertifikatas, ISO kokybės sistema, BSCI atitiktis, REACH atitiktis, USCG patvirtinimas. Kiekvienas produktas atitinka tarptautinius standartus — o ne tik deklaracijas.'
      icon: tabler:certificate
    - title: '4. Lankstus bendras prekės ženklas'
      description: 'Bortelių spalvos, denio išdėstymas, ženklinimas, pakavimas — pritaikome pagal jūsų specifikacijas. Jokio minimalaus užsakymo spaudimo. Pradėkite nuo prototipo, auginkite su pasitikėjimu.'
      icon: tabler:adjustments
    - title: '5. Pasaulinė logistika'
      description: 'JAV sandėlis Kalifornijoje, tiesioginis siuntimas iš Cindao, oro kroviniai skubiems užsakymams. Mes tvarkome muito dokumentus ir dokumentaciją.'
      icon: tabler:truck-delivery
    - title: '6. Ilgalaikis palaikymas'
      description: 'Mes remiame lentas, kurias pagaminome prieš 20 metų. Originalios atsarginės dalys, techniniai patarimai, remonto konsultacijos — mūsų komanda yra prieinama, kai mūsų reikia.'
      icon: tabler:lifebuoy
    - title: '7. Sąžiningos specifikacijos'
      description: 'Realios apkrovos reitingai, realūs matmenys, realus svoris. Jokios rinkodaros išpūtimo. Ką skelbiame, tą ir gaunate — patvirtinta nepriklausomo testavimo.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Pasaulinių prekės ženklų pasitikėjimas'
  title: 'Ką sako mūsų partneriai'
  items:
    - content: 'Dirbome su keliais gamintojais Kinijoje, tačiau afarer išsiskiria savo inžinerijos palaikymu ir nuosekliąja kokybe. Jie elgiasi su mūsų prekės ženklu kaip su savo.'
      name: '— Bendro prekės ženklo partneris, Europos vandens sporto prekės ženklas'
    - content: 'Jų SUP lentos mūsų flotilėje tarnauja daugiau nei 5 metus. Minimali priežiūra, puikus UV atsparumas. 5 metų garantija suteikia mums pasitikėjimo.'
      name: '— Flotilės operatorius, Artimųjų Rytų kurortų grupė'
    - content: 'afarer komanda padėjo mums sukurti individualų SUP lentos dizainą nuo koncepcijos iki gamybos per 90 dienų. Kokybė viršijo mūsų lūkesčius.'
      name: '— Platintojas, Australijos vandens sporto įmonė'
cta:

content_html: |
  <h2>Kas yra CE sertifikavimas?</h2>
  <p>CE ženklinimas (Conformit&eacute; Europ&eacute;enne) rodo, kad produktas atitinka ES sveikatos, saugos ir aplinkosaugos reikalavimus. Pripučiamoms vandens transporto priemonėms taikomas reguliavimo pagrindas priklauso nuo produkto kategorijos.</p>

  <h2>Taikomos direktyvos</h2>

  <h3>Poilsio laivų direktyva (2013/53/EU)</h3>
  <p>Pagrindinė poilsio laivų direktyva ES. Pripučiamos SUP lentos, trumpesnės nei 2.4 m, nepatenka į jos taikymo sritį ir vietoje to sertifikuojamos pagal EN ISO 25649.</p>

  <h3>Asmens apsaugos priemonių reglamentas (2016/425)</h3>
  <p>Gelbėjimosi liemenės, plūdumo priemonės ir saugos įranga, tiekiama su vandens transporto priemonėmis, turi atitikti AAP reglamento reikalavimus, įskaitant tipo tyrimą (Modulis B), kurį atlieka pranešotoji institucija, ir gamybos kokybės užtikrinimą (Modulis D arba E).</p>

  <h2>Sertifikavimo procesas</h2>
  <ol>
    <li>Produkto klasifikavimas: nustatykite laivo projektinę kategoriją (A – D pagal ISO 8666)</li>
    <li>Taikomi standartai: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (gamytojo plokštelė)</li>
    <li>Techninio failo rengimas: projektiniai brėžiniai, medžiagų sąrašas, medžiagų sertifikatai, rizikos vertinimas</li>
    <li>Tipų testavimas: plūdumas, stabilumas, apkrovos talpa, medžiagų testavimas, siūlių stipris, oro sulaikymas</li>
    <li>Gamyklos gamybos kontrolė: pranešotosios institucijos gamybos procesų auditas</li>
    <li>Atitikties deklaracija: gamintojas pasirašo AD, tvirtina CE ženklinimą</li>
  </ol>

  <h2>Pranešotosios institucijos pripučiamoms vandens transporto priemonėms</h2>
  <p>Dažnos PI yra Bureau Veritas (Prancūzija), DNV GL (Vokietija), RINA (Italija), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Vokietija).</p>

  <h2>Terminai ir išlaidos</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Etapas</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Trukmė</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tipinė kaina (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Techninio failo rengimas</td><td class="p-3 border">2 – 4 savaitės</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Tipų testavimas</td><td class="p-3 border">4 – 8 savaitės</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Gamyklos auditas</td><td class="p-3 border">1 – 2 dienos (vietoje)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Iš viso (pirmasis produktas)</td><td class="p-3 border">8 – 14 savaičių</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Ką tai reiškia pirkėjams</h2>
  <p>Pirkdami CE sertifikuotas pripučiamas SUP lentas visada patikrinkite, ar CE ženklinimas yra ant gamytojo plokštelės, ar galioja AD, ar nurodytas pranešotosios institucijos numeris ir ar naudotojo vadove yra saugos instrukcijos jūsų kalba. Visi Afarer produktai turi CE sertifikatą su pilnu atsekamumu iki pranešotosios institucijos audito ataskaitų.</p>


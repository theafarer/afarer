intro: 'CAD modelis, kad ir koks išsamus būtų, negali atskleisti, kaip lenta iš tiesų elgsis, kol ji nesusitinka su vandeniu. Būtent todėl mūsų prototipų dirbtuvės sukurtos taip, kad inžinerijos duomenis kuo greičiau ir tiksliau paverstų fizine, vandeniui paruošta lenta. Kiekvienas naujas Afarer modelis — ir kiekvienas reikšmingas individualus gaminys — praeina per šias dirbtuves, kol pradedami gamybos įrankiai.'

content_html: |
  <h2>Kur dizainas tampa realybe</h2>
  <p>Dirbtuvės yra visiškai įrengtos vienalaikiam korpuso, bortelių ir įrangos gamybai. Šis lygiagrečios darbo eigos požiūris sutrumpina prototipo pagaminimo laiką iki 8-12 savaičių nuo inžinerijos perdavimo, palyginti su pramonės norma 16-20 savaičių. Kai jūsų taikymas reikalauja specializuoto sprendimo, galime pereiti nuo koncepcijos iki patvirtinimo vandenyje per mažiau nei tris mėnesius.</p>

  <h2>Dirbtuvių galimybės</h2>
  <table>
    <thead><tr><th>Darbo vieta</th><th>Įranga</th><th>Paskirtis</th></tr></thead>
    <tbody>
      <tr><td>Korpuso gamyba</td><td>CNC audinio pjaustyklė, terminio laminavimo presas, „Drop-Stitch“ branduolio paruošimo stotis</td><td>Natūralaus dydžio korpuso gamyba visais trimis konstrukcijos tipais</td></tr>
      <tr><td>Bortelių ir kamerų surinkimas</td><td>RF suvirinimo presas, karšto oro kabliavimo stotis, pripūtimo testavimo stendas</td><td>Natūralaus dydžio bortelių ir kamerų blokų gamyba su visomis pertvaromis ir vožtuvais</td></tr>
      <tr><td>Įrangos montavimas</td><td>Pelekų dėžučių frezavimo šablonas, krovinio tvirtinimų ir rankenų suvirinimo įtaisai, denio kilimėlio pjaustymo stotis</td><td>Visapusiškas įrengimas: peleksai, krovinio tvirtinimai, saugos virvės lizdai, rankenos, denio kilimėliai, vožtuvai</td></tr>
      <tr><td>Instrumentų skyrius</td><td>GPS greičio jutiklis, slėgio davikliai, akselerometrai, termoporų masyvas, duomenų registratorius</td><td>Jūros bandymų instrumentų montavimas ir kalibravimas</td></tr>
    </tbody>
  </table>

  <h2>Prototipo kelias — žingsnis po žingsnio</h2>
  <ol>
    <li><strong>Inžinerijos perdavimas</strong> — Dizaino paketą (3D modelis, FEA ataskaita, medžiagų sąrašas, sluoksnių klojimo grafikas) formaliai peržiūri dirbtuvių vadovas ir projekto inžinierius. Bet kokios gamybos problemos pažymimos ir išsprendžiamos prieš prasidedant pjaustymui.</li>
    <li><strong>Korpuso gamyba</strong> — Korpusas statomas pagal inžinerinę specifikaciją. Vieno sluoksnio konstrukcijos atveju: „Drop-Stitch“ branduolys laminuojamas su nurodytu PVC sluoksniu. Dvigubo sluoksnio konstrukcijos atveju: papildomas sluoksnis uždedamas ant bazinio laminato prieš iškerpant ruošinį. Lydytos konstrukcijos atveju: laminavimo parametrai įkeliami iš patvirtinto proceso lapo ir tikrinami ant pirmojo pavyzdinio.</li>
    <li><strong>Bortelių gamyba</strong> — Audinys pjaunamas naudojant CNC raštų šablonus, tada RF būdu suvirinamas į natūralaus dydžio bortelius ir kameras. Kiekviena kamera pripūčiama iki bandomojo slėgio ir paliekama 24 h pradiniam stabilizavimuisi.</li>
    <li><strong>Surinkimas ir įrengimas</strong> — Korpusas ir bortelės sujungiami. Pelekų dėžutės ir krovinio tvirtinimai sumontuojami, saugos virvės lizdai ir nešimo rankenos įrengiami, pripūtimo vožtuvas sugriežtinamas, o denio kilimėlis uždedamas ir sulygiuojamas.</li>
    <li><strong>Statiniai testai</strong> — Prieš lentai paliečiant vandenį atliekama: plūdumo patikra (pilna apkrova + 30 % atsarga), kamerų slėgio laikymo testas, vožtuvo nutekėjimo testas, rankenų ir tvirtinimų tempimo testas.</li>
    <li><strong>Jūros bandymų programa</strong> — 20 valandų bandymų vandenyje, išsamiai aprašyta toliau.</li>
    <li><strong>Prototipo peržiūra</strong> — Sušaukiamas formalus patvirtinimo susirinkimas su inžinerijos, gamybos ir kokybės komandomis. Visi reikalingi dizaino pakeitimai dokumentuojami ir įtraukiami į gamybos paleidimą.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20 valandų jūros bandymų programa — testų tvarkaraštis</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Pažintis ramiame vandenyje — mažo greičio važiavimas tiesiai, posūkiai, stovėsenos ir balanso patikra</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Greičio bandymas — GPS patikrintas didžiausias greitis, kreiserinis greitis, pastovus tempas 3 irklo tempų dažniais</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Posūkio testas — sukimosi apie ašį ir plataus posūkio spindulys, lentos reakcija, kairiuoju ir dešiniuoju bortu</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Bangavimo testas — pakartotiniai važiavimai per 0.5–1.0 m bangavimą; akselerometras irkluotojo stovėsenos vietoje</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Stabilumo testas — statinis šoninio svyravimo kampas su 4 skirtingo svorio irkluotojais, poslinkio apkrova dešiniuoju bortu</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Ištvermės važiavimas — 3 h nuolatinis kreiseriniu tempu; kamerų slėgio, bortelių temperatūros ir irkluotojo nuovargio stebėjimas</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Galutinė patikra — po bandymų tikrinami visi komponentai, sutraukiami/patikrinami visi tvirtinimo elementai, dokumentuojamos išvados</span>
      </div>
    </div>
  </div>

  <h2>Individualus prototipų kūrimas unikaliems taikymams</h2>
  <p>Prototipų dirbtuvės — tai vieta, kur sprendžiame problemas, kurių standartinės gamybos lentos negali išspręsti. Naujausi pavyzdžiai:</p>
  <ul>
    <li>Labai matoma gelbėjimo SUP lenta paieškos ir gelbėjimo organizacijai, reikalaujanti integruotų rankenų, įrangos tvirtinimų gelbėjimo įrangai ir didelio plūdumo korpuso nukentėjusiems gelbėti — viskas suprojektuota, sumontuota ir išbandyta mūsų objekte.</li>
    <li>Ekspedicinė turizmo SUP lenta hidrografinių tyrimų rangovui su nuimamu instrumentų stiebu, hermetiškomis įrangos angomis ir žemo profilio keitiklio laikikliu, sukurtu taip, kad mažintų pasipriešinimą.</li>
    <li>Kompaktiška žvejybos SUP lenta kurorto flotilei, kur prototipas buvo naudojamas patvirtinti stabilumą, įrangos išdėstymą ir patvarumą kasdienėje nuomos veikloje, kad klientas galėtų įsipareigoti keturių lentų flotilei.</li>
  </ul>

  <h2>Mūsų prototipų kūrimo komanda</h2>
  <p>Dirbtuvėse dirba aštuoni daugiaprofiliai jūrinės technikos specialistai, kiekvienas papildomai apmokytas bent dviejose iš trijų pagrindinių sričių (korpusas, bortelės, įranga). Komandos vadovas — meistras gamintojas, turintis 16 metų patirties, apimančios nuo individualių vienetinių gaminių iki gamybos serijų. Kiekvienam prototipui paskiriamas atskiras projekto inžinierius, kuris viso gaminimo ir bandymų proceso metu yra vienintelis kliento kontaktinis asmuo.</p>

  <h2>Kliento įsitraukimas</h2>
  <p>Aktyviai skatiname klientus dalyvauti svarbiausiuose prototipo kūrimo etapuose — ypač pradinės įrangos peržiūroje ir jūros bandyme. Jūsų operacinis grįžtamasis ryšys šiuose etapuose yra neįkainojamas tobulinant lentą prieš jos patekimą į gamybą. Mes nekuriame atitrūkę nuo realybės; kuriame partnerystėje su jumis.</p>
  <p>20 valandų jūros bandymas taip pat yra galimybė jūsų komandai susipažinti su lentos valdymu, denio išdėstymu ir priežiūros reikalavimais, užtikrinant sklandų perėjimą prie eksploatacijos, kai bus pristatytos serijinės lentos.</p>


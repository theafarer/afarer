distributor:
  tagline: 'Išskirtiniai šalių platintojai'
  title: 'Viena šalis. Vienas oficialus Afarer platintojas.'
  subtitle: 'Vienos šalies — vieno platintojo programa su teritoriniu išskirtinumu, platintojų kainomis, rinkodaros palaikymu ir atskira platintojų sėkmės programa.'
  benefits:
    - title: 'Teritorinis išskirtinumas'
      description: 'Vienas įgaliotas platintojas kiekvienai šaliai ar regionui — jokios vidinės konkurencijos, jokio kanalų konflikto.'
    - title: 'Tiesioginiai gamyklos maržos'
      description: 'Platintojų kainoraščiai ir metinės nuolaidos už įsipareigotus kiekius, siunčiama FOB Cindao.'
    - title: 'Rinkodaros ir mokymų palaikymas'
      description: 'Bendro prekės ženklo medžiagos, platintojų POS medžiagos, produktų mokymai ir paleidimo kampanijos.'
    - title: 'Atskira klientų komanda'
      description: 'Asmeninis platintojų vadybininkas bei įvedimo, prognozavimo ir pakartotinio užsakymo palaikymas.'
  actions:
    - variant: primary
      text: 'Tapkite platintoju'
      href: /distributor-program/
    - text: 'Užklausti platintojų kainoraščio'
      href: /contact/?subject=Dealer Price List
    - text: 'Pateikti paraišką šalies partnerystei'
      href: /contact/?subject=Country Partnership Application
    - text: 'Atsisiųsti platintojų programą'
      href: /distributor-program/
  note: 'Mažiausias pirmasis užsakymas 100–300 vienetų šalies/regiono platintojams. Bandomieji užsakymai nuo 10–30 vienetų.'

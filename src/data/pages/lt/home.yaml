meta:
  title: 'Pripučiamų SUP lentų gamintojas ir OEM/ODM partneris — Afarer vandens sportas | {SITE}'
  description: 'Afarer yra pripučiamų SUP lentų gamintojas ir OEM/ODM partneris Cindao, Kinijoje — ISO 9001 sertifikuota gamykla, kurianti aukšto našumo pripučiamas irklavimo lentas atviriems vandenims, turizmui, jogai ir nuotykiams. Slėgiu išbandyta kiekviena lenta atskirai, su OEM/ODM, privataus ženklo ir platintojų programomis.'
  keywords:
    - 'aukšto našumo pripučiama sup'
    - 'premium pripučiama irklavimo lenta'
    - 'pripučiamų sup lentų prekės ženklas'
    - 'turizmo pripučiama sup'
    - 'bendro prekės ženklo irklavimo lenta'
    - 'šalies sup platintojas'
    - 'pripučiamų sup gamintojas'
    - 'sup oem odm partneris'
    - 'privataus ženklo irklavimo lentų gamintojas'
hero:
  tagline: 'Pripučiamų SUP lentų gamintojas ir OEM/ODM partneris'
  title: 'Važiuok toliau.<br />Irkluok stipriau.'
  subtitle: |
    Aukšto našumo pripučiamos SUP lentos, sukurtos atviriems vandenis, ilgoms dienoms<br />
    ir laisvei tyrinėti — stabilios, kai to reikia,<br />
    standžios spaudžiant ir pasirengusios kintantiems vandenis.
  taglineSection: 'Sukurta pasitikėjimui. Sukurta, kad išsiskirtų.'
  actions:
    - variant: primary
      text: 'Peržiūrėti lentas'
      href: /inflatable-sup/
      icon: tabler:waves
    - text: 'Raskite savo lentą'
      href: /size-guide/
      icon: tabler:compass
    - text: 'Kodėl Afarer'
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: 'Afarer pripučiama SUP lenta čiuožianti per atvirą vandenį auštant — sukurta ilgoms dienoms ir laisvei tyrinėti'

who_we_serve:
  tagline: 'Irkluokite su mumis'
  title: 'Sukurta pagal jūsų važiavimo būdą'
  subtitle: 'Nuo pirmo irklo mosto iki ilgiausio maršruto — ir klubams, kurortams bei mažmenininkams, palaikantiems žmones prie irklo.'
  items:
    - title: 'Pirmą kartą irkluojantys ir poilsio ieškantys'
      keywords: 'pradedančiųjų pripučiama SUP, universali irklavimo lenta, stabili SUP'
      description: 'Platos, stabilių universalių lentų, kurios pirmą irklo mostą padaro natūralų ir neatsilieka, kol tobulėjate.'
      icon: tabler:users
      cta: 'Raskite savo pirmą lentą'
      link: /all-around-sup/
    - title: 'Turizmo ir nuotykių irkluotojai'
      keywords: 'turizmo SUP, ilgo nuotolio irklavimo lenta, ekspedicinė SUP'
      description: 'Ilgesnės, siauresnės lentos, sukurtos važiuoti tiesiai, čiuožti toliau ir vežti įrangą kelių dienų maršrutams.'
      icon: tabler:building
      cta: 'Peržiūrėti turizmo lentas'
      link: /touring-sup/
    - title: 'Klubai, kurortai ir nuomos'
      keywords: 'SUP nuomos flotilė, irklavimo klubo įranga, kurorto vandens veikla'
      description: 'Flotilėms paruoštos pripučiamos SUP lentos su patikimu patvarumu, lengva priežiūra ir atsarginių dalių palaikymu.'
      icon: tabler:shopping-cart
      cta: 'Suformuokite savo flotilę'
      link: /solutions/
    - title: 'Šalių platintojai ir bendro prekės ženklo partneriai'
      keywords: 'šalies platintojas SUP, bendro prekės ženklo SUP, privataus ženklo SUP'
      description: 'Išskirtinis platinimas pagal šalis ir ribotos bendro prekės ženklo kolekcijos kvalifikuotoms vandens sporto įmonėms.'
      icon: tabler:package
      cta: 'Tapkite partneriu'
      link: /distributor-program/

proof_points:
  title: 'Išbandyta daugiau nei salonuose'
  subtitle: 'Dizainas, našumas ir kokybė, kuriuos galite patikrinti — vandenyje ir skaičiuose.'
  items:
    - metric: 10+
      label: 'Metų, kuriant vandeniui'
      detail: 'Nuo 2012 m., tobulinta lentą po lentos'
    - metric: 50+
      label: 'Šalių vandenyje'
      detail: 'Irkluotojai ir partneriai visame pasaulyje'
    - metric: 12–15
      label: 'PSI „Drop-Stitch“ branduolys'
      detail: 'Standus ten, kur reikia, lengvai sulankstomas'
    - metric: 100%
      label: 'Slėgiu išbandyta kiekviena lenta'
      detail: 'Patikrinta prieš siunčiant'

business_solutions:
  tagline: 'Kodėl važiuojama kitaip'
  title: 'Naudumą, kurį jaučiate pirmu mostu'
  subtitle: 'Keturios realaus vandens suformuotos atramos — našumas, dizainas, konstrukcija ir kokybė.'
  items:
    - title: 'Našumas vandenyje'
      description: 'Formos, suderintos stabilumui, čiuožimui ir pasitikėjimui bangavime — kad kiekvienas mostas jaustųsi susijungęs su vandeniu.'
      icon: tabler:shield-check
    - title: 'Ekspresyvus dizainas'
      description: 'Kolekcijos, įkvėptos potvynių, laukinės gamtos ir kranto linijos energijos — lentos, su kuriomis norite būti matomi.'
      icon: tabler:package
    - title: 'Patikrinta konstrukcija'
      description: 'Didelio tankio „Drop-Stitch“ branduoliai, sutvirtintos bortelės ir suliejimo būdu laminuotos siūlės, sukurtos pakartotiniam naudojimui.'
      icon: tabler:headset
    - title: 'Patikrinta kokybė'
      description: 'Slėgiu išbandyta, vizualiai patikrinta ir remiama aiškios garantijos bei reaguojančio popardaviminio aptarnavimo.'
      icon: tabler:truck-delivery

oem_section:
  tagline: 'OEM / ODM ir bendro prekės ženklo gamyba'
  title: 'Nuo idėjos iki vandens — bendro prekės ženklo leidiniai'
  subtitle: 'Partneriams, norintiems daugiau nei katalogo produktą: OEM/ODM gamyba ir ribotos bendro prekės ženklo kolekcijos, projektuojamos, kuriamos ir gaminamos su Afarer — tačiau kiekviena lenta išlieka Afarer produktu.'
  steps:
    - number: '01'
      title: 'Idėja ir užduotis'
      desc: 'Pasidalinkite savo vizija, tiksliniu raiteliu ir vandeniu, kuriam projektuojate.'
    - number: '02'
      title: 'Dizainas ir inžinerija'
      desc: '3D modeliavimas, medžiagų parinkimas ir išskirtinis grafinis dizainas.'
    - number: '03'
      title: 'Prototipas ir patvirtinimas'
      desc: 'Pavyzdinės lentos slėgiu išbandomos ir važiavimu patvirtinamos prieš jūsų įsipareigojimą.'
    - number: '04'
      title: 'Gamyba dideliu mastu'
      desc: 'Nuosekli, tikrinama gamyba su kokybės kontrolės taškais kiekviename etape.'
    - number: '05'
      title: 'Pristatymas visame pasaulyje'
      desc: 'Logistika iš Cindao į pagrindinius uostus su muito palaikymu.'
  cta: 'Peržiūrėti bendro prekės ženklo galimybes'
  cta_link: /co-brand/


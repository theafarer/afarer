faqs:
  title: 'OEM irklų gamybos DUK'
  subtitle: 'Atsakymai į dažniausius prekės ženklų, kuriančių savo irklą, klausimus.'
  items:
    - title: 'Kaip sukurti savo irklų prekės ženklą?'
      description: 'Paleiskite savo prekės ženklą per 16 savaičių: užduotis, dizainas, CE sertifikuotas prototipas, masinė gamyba ir pristatymas. Susipažinkite su mūsų OEM paketais.'
    - title: 'Koks yra gamybos terminas?'
      description: 'Mėginys paruošiamas per 2–3 savaites, masinė gamyba per 30–45 dienas, priklausomai nuo kiekio.'
    - title: 'Ar irklas neša mūsų logotipą?'
      description: 'Taip — pilnas privatus prekės ženklas: logotipų spausdinimas, pasirinktinės spalvos, pakuotė ir etiketės jūsų prekės ženklu.'
    - title: 'Ar galiu pirkti didmenais nuo pirmos dienos?'
      description: 'MOQ yra 50 vienetų standartiniams modeliams, su didmenų kainų lygiais, didėjant kiekiui.'

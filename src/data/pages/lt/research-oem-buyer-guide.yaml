hero:
  tagline: 'Pirkimas'
  title: 'OEM pirkėjo vadovas — pripučiamų vandens transporto priemonių pirkimas iš Azijos'
  subtitle: '12 min. skaitymo'

content_html: |
  <h2>1. Išanktinis kvalifikavimas: į ką atkreipti dėmesį gamykloje</h2>

  <h3>Atitikties sertifikatai</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Kokybės vadybos sistema</li>
    <li><strong>CE sertifikavimas</strong> – Patikrinkite pranešusiojo organo numerį</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Socialinės atitikties auditai</li>
    <li><strong>REACH / RoHS</strong> – Medžiagų atitikties deklaracijos</li>
  </ul>

  <h3>Gamybos galimybės</h3>
  <ul>
    <li>„Drop-Stitch" branduolio audimas vietoje arba užsakomasis</li>
    <li>PVC dengimo / laminavimo linija</li>
    <li>RF suvirinimo ir karšto oro suvirinimo įranga</li>
    <li>Vidinė formelių gamyba (CNC apdirbimas)</li>
    <li>Testavimo laboratorija (slėgio testavimas, UV senėjimas, tempimo testavimas)</li>
  </ul>

  <h3>Patirties patikra</h3>
  <ul>
    <li>Metai pripučiamų vandens transporto priemonių gamyboje (mažiausiai 5+ metai)</li>
    <li>Inžinierių skaičius įmonėje</li>
    <li>Esami OEM/ODM klientai (paprašykite rekomendacijų)</li>
    <li>Eksporto kryptys – ar jie jau siunčia į jūsų tikslinę rinką?</li>
  </ul>

  <h2>2. Kokybės kontrolės protokolai</h2>
  <p>Medžiagų įeinamoji kontrolė: tempimo stipris (ASTM D751 arba ISO 1421), plyšimo atsparumas (ASTM D2261 arba ISO 4674), sukibimo stipris, UV senėjimo patikros.</p>
  <p>Proceso metu atliekama kontrolė: siūlių stiprio stebėjimas kas 50 vienetų, vožtuvų sukibimo patikra, „Drop-Stitch" siūlų tankio tikrinimai, matmenų patikros pagal CAD brėžinius.</p>
  <p>Galutinė patikra: 100 % pūtimo išlaikymo testas (24 valandos, maks. 5 % kritimas), vizualinė patikra, vožtuvų funkcijos testas, atsitiktinis mėginių testavimas (AQL 2,5 arba 4,0 pagal ISO 2859).</p>

  <h2>3. Atitikties dokumentacijos kontrolinis sąrašas</h2>
  <ul>
    <li>Atitikties deklaracija (DoC), nurodanti teisingą ES direktyvą</li>
    <li>CE sertifikatas iš pranešusiojo organo</li>
    <li>Testų ataskaita iš akredituotos laboratorijos</li>
    <li>Medžiagų saugos duomenų lapai (MSDS)</li>
    <li>REACH atitikties deklaracija</li>
    <li>Medžiagų sąrašas su tiekėjų atsekamumu</li>
    <li>Gamyklos inspekcijos ataskaita</li>
  </ul>

  <h2>4. MOQ derybos</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Produkto tipas</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standartinis MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Deramas diapazonas</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP lentos</td><td class="p-3 border">50 – 100 vienetų</td><td class="p-3 border">5 – 10 vienetų (bandomasis)</td></tr>
      <tr><td class="p-3 border">Kajakai</td><td class="p-3 border">50 – 100 vienetų</td><td class="p-3 border">5 – 10 vienetų (bandomasis)</td></tr>
      <tr><td class="p-3 border">Pripučiami SUP</td><td class="p-3 border">50 – 100 vienetų</td><td class="p-3 border">2 – 5 vienetai (bandomasis)</td></tr>
      <tr><td class="p-3 border">Sauga / priedai</td><td class="p-3 border">200 – 500 vienetų</td><td class="p-3 border">50 – 100 vienetų (bandomasis)</td></tr>
    </tbody>
  </table>

  <h2>5. Logistika ir siuntimas</h2>
  <p>Dažni „Incoterms": <strong>FOB</strong> (Gamykla pristato į išvykimo uostą – dažniausiai paplitęs), <strong>EXW</strong> (Pirkėjas organizuoja visą siuntimą nuo gamyklos durų), <strong>CIF</strong> (Gamykla moka krovinio ir draudimo išlaidas iki paskirties uosto).</p>
  <p>Pripučiami produktai yra lengvo svorio, didelio tūrio – tūrinis svoris (DIM) dažnai lemia siuntimo kainą. Paprašykite vakuumuotos pakuotės, kad sumažintumėte tūrį 50–60 %. Jūrų kroviniai iš Kinijos į ES: 25–35 dienos; į JAV vakarų pakrantę: 15–20 dienų.</p>

  <h2>6. Dažnos klaidos</h2>
  <ul>
    <li><strong>Jokio gamyklos audito:</strong> Visada atlikite arba užsakykite trečiosios šalies auditą (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Tik žodinės specifikacijos:</strong> Išsamus techninės specifikacijos lapas, pasirašytas abiejų šalių</li>
    <li><strong>Mėginių patvirtinimo praleidimas:</strong> Rašytinis mėginių patvirtinimas prieš masinę gamybą</li>
    <li><strong>Jokios kontrolės gamybos metu:</strong> Trečiosios šalies inspekcija gamybos metu (DUPRO) ir prieš siuntimą (PSI)</li>
    <li><strong>Atitikties ignoravimas:</strong> Patikrinkite CE/UKCA sertifikavimą prieš gamybą</li>
  </ul>

  <h2>7. Kodėl Afarer</h2>
  <p>Afarer gamina OEM/ODM pripučiamus vandens transporto priemones nuo 2012 m. Su 12 000 m&sup2; ISO 9001 sertifikuota įmone, 25+ inžinieriais ir CE sertifikavimu visose produktų linijose, mes atitinkame kiekvieną šio vadovo kriterijų. Siūlome bandomuosius MOQ naujiems partneriams ir pilnus atitikties dokumentacijos paketus.</p>


seo:
  headline: 'afarer pripučiamų SUP lentų garantija — 5 metų ribota garantija | afarer'
  description: 'afarer suteikia 5 metų ribotą garantiją pagrindiniam denio audiniui, siūlėms ir „Drop-Stitch“ branduolio konstrukciniam vientisumui. Taip pat apima pripūtimo vožtuvus ir gamykloje sumontuotus priedus. Pilnos afarer pripučiamų SUP lentų garantijos sąlygos.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Ši ribota garantija taikoma naujiems afarer prekės ženklo pripučiamiems jūrinės technikos produktams, įsigytiems tiesiogiai iš afarer arba iš įgalioto afarer platintojo ar mažmeninio pardavėjo. Įsigaliojimo data yra patvirtinama originalaus mažmeninio pardavimo data.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garantijos apimtis ir trukmė</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Pagrindinio baliono audinio vientisumas (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Stiklo pluošto korpuso konstrukcinis vientisumas</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Pripučiamų balionų siūlių oro laikymo geba</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Pripūtimo vožtuvų veikimas</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Gamykloje sumontuoti priedai ir pagalbinė furnitūra</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 metai*</h3>
        <p class="text-sm text-gray-600 mt-1">Komercinis, nuomos ar flotilės naudojimas — visi komponentai</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komercinis, vyriausybinis, čarterinis, nuomos ar mokomasis naudojimas sutrumpina garantiją iki 1 metų. Naudojimas lenktynėse ar varžybose visiškai anuliuoja garantiją.</p>
  </div>

  <h2>Kas yra apimta</h2>
  <h3>Pagrindinis baliono audinys (5 metai)</h3>
  <p>afarer garantuoja pagrindinį denio audinį nuo porėtumo pablogėjimo, esmingai pažeidžiančio produkto gebą palaikyti darbinį pripūtimą. Tai taikoma PVC dengtam audiniui ir visoms kitoms gamyboje naudojamoms denio audinio medžiagoms.</p>

  <h3>Stiklo pluošto korpuso konstrukcinis vientisumas (5 metai)</h3>
  <p>Produktams su stiklo pluoštu armuoto plastiko (FRP) korpusu pagrindinė kompozitinė struktūra yra garantuojama nuo konstrukcinių gedimų dėl medžiagų ar darbo defektų.</p>

  <h3>Pripučiamų balionų siūlių oro laikymo geba (5 metai)</h3>
  <p>Pripučiamų balionų siūlės, sujungtos gamybos metu, yra garantuojamos nuo gamybos defektų, sukeliančių esminį oro nutekėjimą pro siūlę. Periodinė patikra ir tinkamų pripūtimo slėgių priežiūra yra garantijos sąlygos.</p>

  <h3>Pripūtimo vožtuvų veikimas (5 metai)</h3>
  <p>Oro pripūtimo vožtuvai, iš pradžių sumontuoti afarer, yra garantuojami nuo gamybos defektų medžiagose ar darbe, neleidžiančiuose vožtuvui laikyti oro kaip numatyta.</p>

  <h3>Gamykloje sumontuoti priedai (1 metai)</h3>
  <p>afarer pagaminti ir gamykloje iš pradžių sumontuoti komponentai ir furnitūra yra garantuojami nuo medžiagų ir darbo defektų vienerius metus. Tai netaikoma trečiųjų šalių daiktams, kuriems taikomos tik atitinkamų gamintojų garantijos.</p>

  <h2>Kas nėra apimta</h2>
  <ul>
    <li>Kosmetiniai trūkumai, įskaitant spalvos pasikeitimą, dėmes, blukimą, sukrešėjimą ar bet kokį išvaizdos pakitimą</li>
    <li>Dūriai, įpjovimai, įplyšimai, perskėlimai ar kiti fiziniai pažeidimai</li>
    <li>Įtrūkimai, skilimai, nudilimas, nusitrynimas ar pablogėjimas dėl trinties ar sąlyčio</li>
    <li>Pablogėjimas dėl UV šviesos poveikio, atmosferos sąlygų</li>
    <li>Pažeidimai dėl kontakto su degalais, tirpikliais, rūgštimis, šarmais ar cheminėmis medžiagomis</li>
    <li>Pažeidimai dėl neatsargumo, netinkamo naudojimo, piktnaudžiavimo, avarijos ar įprasto nusidėvėjimo</li>
    <li>Želkoto ar dažų paviršiaus problemos (pūslėjimas, įtrūkimai, spalvos pasikeitimas, blukimas)</li>
    <li>Pažeidimai dėl smūgio, perkrovos, netinkamo atrėmimo ar vežimo priekabomis</li>
    <li>Pažeidimai dėl netinkamo pripūtimo/išleidimo ar nepatvirtintų pripūtimo įrenginių naudojimo</li>
    <li>Trečiųjų šalių įranga, komponentai ar sistemos (juos dengia atitinkami gamintojai)</li>
  </ul>

  <h2>Gamintojo pareiga ir kompensavimas</h2>
  <p>Vienintelė ir išskirtinė afarer pareiga yra suremontuoti arba pakeisti, afarer pasirinkimu, bet kurį komponentą, nustatytą kaip defektuotą dėl medžiagų ar darbo ir apimtą šia garantija. Remontą ar pakeitimus atlieka afarer arba jos paskirtas įgaliotas serviso centras. Suremontuoti ar pakeisti komponentai garantuojami tik likusią originalios garantijos laikotarpio dalį.</p>

  <h2>Garantijos sąlygos</h2>
  <ul>
    <li><strong>Registracija:</strong> Produktas turi būti tinkamai užregistruotas, kaip numatyta garantijos sąlygose.</li>
    <li><strong>Priežiūra:</strong> Produktas turi būti prižiūrimas pagal afarer paskelbtas gaires, įskaitant periodinę patikrą ir tinkamų pripūtimo slėgių priežiūrą.</li>
    <li><strong>Bendradarbiavimas:</strong> Pirkėjas privalo visapusiškai ir nedelsdamas bendradarbiauti su afarer visais klausimais, susijusiais su garantiniais reikalavimais.</li>
    <li><strong>Originalus pirkėjas:</strong> Ši garantija suteikiama išimtinai originaliam galutiniam vartotojui pirkėjui ir nėra perleidžiama.</li>
  </ul>

  <h2>Komercinis naudojimas</h2>
  <p>Jei produktas naudojamas komerciniais, vyriausybiniais, ne pelno, čarterio, nuomos, mokymo ar kitais nei privataus poilsio tikslais, visų komponentų garantijos laikotarpis sutrumpinamas iki vienerių (1) metų nuo originalaus mažmeninio pardavimo datos. Naudojimas lenktynėse, greičio ar ištvermės varžybose nedelsiant ir negrąžintinai visiškai anuliuoja garantiją.</p>

  <h2>Kaip pateikti garantinį reikalavimą</h2>
  <p>Susisiekite su afarer arba jūsų įgaliotu platintoju su pirkimo įrodymu ir išsamia problema aprašymu. afarer peržiūrės reikalavimą ir pateiks patikros bei aptarnavimo instrukcijas.</p>
  <p>Dėl garantinio aptarnavimo teiraukitės per mūsų <a href="/contact/" class="text-sky-600 underline">kontaktų puslapį</a>, nurodydami užsakymo numerį ir produkto duomenis.</p>

  <h2>Trečiųjų šalių daiktai</h2>
  <p>Įranga, komponentai ar sistemos, pagaminti trečiųjų šalių (net jei sumontuoti afarer), dengiami tik atitinkamų jų gamintojų suteikta garantija. afarer aiškiai atsisako bet kokios garantinės atsakomybės už tokius trečiųjų šalių daiktus.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Šis garantijos pareiškimas yra pilnos afarer gamintojo ribotos garantijos santrauka. Visą teisinį garantijos dokumentą taiko visos garantijos sąlygos. Specifikacijos gali keistis be įspėjimo. afarer yra prekės ženklas, valdomas Aquafarer LLC (JAV).
  </p>

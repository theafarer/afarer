features3_cases:
  tagline: 'Įgarsinti atvejai'
  title: 'Pasirinktiniai sprendimai<br />realiems iššūkiams'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Europos nardymo centro parkas'
      customer: 'BlueMed Diving Centers'
      country: 'Graikija'
      industry: 'Nardymas ir jūrinis turizmas'
      challenge: 'Reikėjo 12 nardymui pritaikytų SUP tinklui nardymo centrų, esančių keliose Graikijos salose. Kiekviena lenta turėjo turėti pasirinktinę įrangos tvirtinimo sistemą, vietą 8 balionams ir stabilią platformą nardytojams patekti į atvirą vandenį. Parkas turėjo atvykti per 60 dienų prieš turizmo sezono pradžią.'
      solution: 'Pagaminta 12 SUP Voyager Dive modelių su integruotomis įrangos laikikliais, stabiliai platformomis ir ypač plačia „Drop-Stitch" konstrukcija, užtikrinančia stabilumą lipant. Kiekviena lenta ženklinta kliento parko išvaizda. Visos 12 lentų išbandytos slėgiu ir išsiųstos iš Čingdao per 55 dienas.'
      product: 'SUP Voyager Dive'
      results: 'Visos 12 lentų pristatytos laiku turizmo sezonui. Parkas eksploatuojamas kasdien 18+ mėnesių be jokių medžiagų gedimų. Klientas antrais metais užsakė 6 papildomus vienetus.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive tapo mūsų kasdieninių nardymo operacijų pagrindu. Stabilumas puikus, o įrangos laikymo išdėstymas palaiko denį švarų ir saugų mūsų svečiams.'
      icon: tabler:lifebuoy
    - title: 'Australijos platintojo bendro prekės ženklo programa'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Australija'
      industry: 'Bendro prekės ženklo ir partnerystės programa'
      challenge: 'Australijos platintojui reikėjo privataus prekės ženklo SUP lentų asortimento konkurencinga kaina, kad galėtų konkuruoti su kinų tiesioginių pardavimų prekės ženklais. Reikėjo 8 unikalių modelių, apimančių lygį nuo pradedančiųjų iki pažengusių, su pasirinktine grafika, pasirinktine pakuote ir tiesioginio pristatymo vykdymu į mažmeninės prekybos punktus.'
      solution: 'Sukurta 8 SUP modeliai (Universalus, Turizmo, Joga, Vaikų, Sporto, Itin kompaktiškas, Itin stabilus, Baltųjų vandenų) su išskirtiniu Australijos grafikos paketu. Pasirinktinė mažmeninė pakuotė su QR kodais, nukreipiančiais į surinkimo vaizdo įrašus. Tiesioginio pristatymo logistika sukonfigūruota iš Čingdao tiesiai į Australijos mažmeninės prekybos parduotuves.'
      product: 'Pasirinktinė SUP linija (8 modeliai)'
      results: 'Nuo koncepcijos iki pirmosios siuntos per 90 dienų. Mažmeninės prekybos realizacijos rodiklis 85 % pirmąjį sezoną. Platintojas antrais metais išplėtė partnerystę, įtraukdamas papildomų SUP modelių.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer pristatė visą SUP liniją per 90 dienų — nuo pradinio dizaino iki prekybos salono. Kokybė prilygsta prekės ženklams, parduodamiems už dvigubai didesnę kainą.'
      icon: tabler:currency-dollar
    - title: 'Artimųjų Rytų gelbėjimo įrangos tiekimas'
      customer: 'Nacionalinė civilinės gynybos institucija'
      country: 'Jungtiniai Arabų Emyratai'
      industry: 'Paieška ir gelbėjimas'
      challenge: 'Civilinės gynybos organizacijai reikėjo 20 patruliavimui parengtų SUP pakrantės paieškai ir gelbėjimui, uosto apsaugai ir potvynių reakcijai. Reikėjo gerai matomų lentų, visos saugos įrangos ir atitikties vietiniams jūriniams reglamentams.'
      solution: 'Pateikta 20 SUP Patrol modelių su gerai matoma oranžine „Drop-Stitch" konstrukcija, pilnais saugos paketais, SOLAS atspindinčia juosta ir sutvirtinta konstrukcija. Kiekviena lenta buvo CE sertifikuota ir išbandyta pagal taikomus standartus. Dokumentacijos pakete buvo atitikties sertifikatai vietinei registracijai.'
      product: 'SUP Patrol'
      results: 'Parkas išdėstytas 5 pakrantės stočyse. Lentos eksploatuojamos ekstremaliame karštyje (45 °C+) be jokio gedimo. Našumas ir patvarumas viršijo specifikacijas.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol viršijo mūsų operacinius reikalavimus. Ekstremalaus karščio sąlygomis lentos nerodo jokių UV gedimo požymių po 24 mėnesių kasdieninio naudojimo.'
      icon: tabler:alert-triangle
    - title: 'Europos bendro prekės ženklo partnerystė'
      customer: 'North Sea Marine Equipment BV'
      country: 'Nyderlandai'
      industry: 'Bendro prekės ženklo ir partnerystės programa'
      challenge: 'Įsitvirtinęs Europos jūrinis prekės ženklas norėjo plėstis į SUP rinką neinvestuodamas į gamybos įmones. Reikėjo baltojo prekės ženklo partnerio, galinčio pagaminti 5 SUP modelius (nuo 9 iki 12 pėdų) su privačiu prekės ženklu, CE sertifikatu ir išskirtinėmis ES platinimo teisėmis.'
      solution: 'Sudaryta baltojo prekės ženklo gamybos sutartis 5 SUP modeliams. Kiekvienas modelis ženklintas kliento logotipais ir spalvų schema. Paruošta CE sertifikavimo dokumentacija kiekvienam modeliui. Suteiktos išskirtinės ES platinimo teisės su minimaliais užsakymų įsipareigojimais. Techninė dokumentacija pateikta vietiniam aptarnavimo tinklui.'
      product: 'Pasirinktinė SUP linija (5 modeliai)'
      results: 'Pasirašyta kelerių metų sutartis. Pirmoji 50 vienetų gamybos partija išsiųsta per 75 dienas. Prekės ženklas pristatytas didelėje prekybos parodoje su teigiama prekiautojų reakcija.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Bendradarbiaudami su afarer galėjome patekti į SUP rinką nestatydami gamyklos — jie pristatė visapusišką paruoštą sprendimą su CE sertifikatu ir prekiautojų palaikymo dokumentacija.'
      icon: tabler:building
    - title: 'Karibų kurorto parkas'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahamos'
      industry: 'Jūrinis turizmas ir svetingumas'
      challenge: 'Pramogų kurortui reikėjo visiško vandens sporto įrangos parko svečių veikloms: 40 SUP lentų organizuojamoms ekskursijoms, 20 papildomų SUP lagūnų tyrinėjimui, 10 SUP lentų svečių išvykoms, taip pat priedų. Visą įrangą reikėjo ženklinti kurorto prekės ženklu ir pristatyti prieš turizmo sezono piką.'
      solution: 'Pagamintas visiškas SUP paketas: 40 SUP Voyager lentų (Universalus modelis), 20 SUP Explorer lentų, 10 SUP Touring lentų, taip pat gelbėjimo liemenės, irklai, siurbliai ir remonto rinkiniai. Visa įranga su išspausdintu kurorto logotipu ir tropine spalvų schema. Konteinerinė siunta su pilnu inventoriumi.'
      product: 'Visiškas SUP paketas (70+ vienetų)'
      results: 'Parkas atvyko 6 savaitės prieš sezono piką. Svečių pasitenkinimo vandens sporto veiklomis balai išaugo 40 % per metus. Įranga tarnauja 3 sezonus tik su įprastine priežiūra.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Visiško paketo požiūris reiškė, kad viską, ko reikėjo, gavome vienoje siuntoje — lentos ir priedai visi su prekės ženklu ir paruošti svečių naudojimui. Mūsų svečiai mėgsta įrangos kokybę.'
      icon: tabler:beach
    - title: 'JAV pakrančių patrulių sutartis'
      customer: 'Atlanto pakrantės saugumo agentūra'
      country: 'Jungtinės Valstijos'
      industry: 'Jūrinis saugumas ir teisėsauga'
      challenge: 'JAV pakrantės saugumo agentūrai reikėjo patvarių patrulių SUP atviro vandens operacijoms. Reikėjo didelio našumo lentų su karinės klasės įranga ir atitikties JAV pakrantės apsaugos reglamentams.'
      solution: 'Suprojektuotas SUP Patrol su sutvirtinta „Drop-Stitch" konstrukcija, gerai matomomis spalvų schemomis, šifruotos komunikacijos įrangos laikikliais ir integruotais įrangos tvirtinimo taškais. Lentos sutvirtintos sunkioms operacijoms. Pateikta USCG atitikties dokumentacija.'
      product: 'SUP Patrol'
      results: 'Agentūra pranešė apie 95 % misijų parengties rodiklį per pirmuosius 12 mėnesių. Pateiktas papildomas 8 vienetų užsakymas.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol suteikia mūsų įguloms našumą, reikalingą atviro vandens operacijoms. Sutvirtinta konstrukcija užtikrina kritinį patvarumą neprarandant valdymo.'
      icon: tabler:shield

meta:
  title: 'Technologija — „Drop Stitch“ ir jūrinis PVC | {SITE}'
  description: 'afarer technologijos: „drop stitch“ konstrukcija, jūrinis PVC, dvigubo sluoksnio korpusai ir aukštas slėgis. Inovacijos iš profesionalaus pripučiamų SUP lentų gamintojo.'
  keywords:
    - 'sup technologija'
    - 'drop stitch konstrukcija'
    - 'aukšto slėgio sup'
    - 'pripučiamų sup medžiagos'
hero:
  tagline: 'Technologija'
  title: 'Sukurta našumui'
  subtitle: 'Kiekviena afarer pripučiama SUP lenta sukurta su „Drop-Stitch“ konstrukcija ir jūrinės klasės PVC — tikslumo medžiagos ir gamybos metodai, išbandyti reiklioms jūrinėms aplinkoms.'

sections:
  - title: '„Drop-Stitch“ branduolys'
    description: 'Tūkstančiai vidinii poliesterinių siūlų jungia viršutinį ir apatinį sluoksnius, sukurdami standžią struktūrą esant 12-15 PSI. Tai ta pati technologija, naudojama profesionaliose irklavimo lentose ir pripučiamose lenktyninėse SUP lentose.'
    imageAlt: 'DS branduolio diagrama'
  - title: 'Jūrinės klasės PVC'
    description: 'Daugiasluoksnis laminuotas PVC audinys, patvirtintas jūrinėms aplinkoms. Kiekvienas sluoksnis yra suvirintas lydymo būdu, o ne suklijuotas, taip pašalinant atsisluoksniavimo riziką. Išbandytas atsparumui UV, jūros vandens korozijai ir dilimui.'
    imageAlt: 'PVC sluoksnis'
  - title: 'Karinių standartų PVC'
    description: 'Naudojamas visuose SUP modeliuose, aukščiausios kokybės PVC užtikrina puikų UV ir cheminį atsparumą. Išlaiko lankstumą ekstremaliose temperatūrose ir priešinasi degradacijai.'
    imageAlt: 'PVC'
  - title: 'Oro denio grindys'
    description: 'Aukšto slėgio pripučiama „Drop-Stitch“ konstrukcija, užtikrinanti išskirtinį standumą stovėjimui, žvejybai ir jogai. Sumažina paruošimo laiką, bendrą svorį ir saugojimo tūrį.'
    imageAlt: 'Oro denis'


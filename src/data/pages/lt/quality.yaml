tests:
  - title: 'Slėgio testavimas'
    description: 'Pripučiamos kameros veikiamos slėgio, viršijančio rekomenduojamas darbo ribas, ilgą laiką. Tai patikrina medžiagos ir siūlių hermetiškumą bei struktūrinį vientisumą, užtikrinant, kad produktas atlaikys numatytą naudojimą ir galimą per didelį pūtimą be gedimų ar nuotėkių.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Smūgio testavimas'
    description: 'Produktai veikiami kontroliuojamų smūgių iš įvairių svorių ir kampų. Tai įvertina medžiagos atsparumą pradūrimams, plyšimams ir žalai nuo susidūrimų su kliūtimis vandenyje, įrodant patvarumą ir ilgaamžiškumą.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'UV atsparumo testavimas'
    description: 'Medžiagų mėginiai veikiami pagreitintu UV poveikiu, imituojančiu metus žiaurios saulės, tada vėl testuojami dėl tempimo stiprio išlaikymo ir spalvų pastovumo. Tai patikrina, kad PVC junginiai atsparėja blukimui, kreidėjimui ir įtrūkimams, užtikrinant ilgalaikį patvarumą saulėtose jūrinėse aplinkose.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Abrazyvo atsparumo testavimas'
    description: 'Medžiagų mėginiai trinami prie abrazyvių paviršių nustatytą ciklų skaičių kontroliuojamame slėgyje. Tai matuoja medžiagos gebėjimą atlaikyti dilimą nuo pakartotinio naudojimo, kontakto su smėliu, akmenimis ar kitais paviršiais, užtikrinant ilgalaikį patvarumą.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Žemos temperatūros našumo testavimas'
    description: 'Produktai testuojami šaltose aplinkose, siekiant įvertinti funkcionalumą ir patvarumą įvairiose temperatūros sąlygose, užkertant kelią standumui ar įtrūkimams šaltesniame vandenyje. Būtina lentoms, skirtoms žiemos ar didelio platumos naudojimui.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Plūdrumo ir keliamosios galios testavimas'
    description: 'Produktai testuojami su įvairiais svoriais, siekiant nustatyti jų didžiausią keliamąją galią ir užtikrinti, kad jie saugiai palaikys vartotojus ir įrangą. Kiekvieno modelio įvertinta galia patvirtinama prieš išleidimą.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Manevringumo testavimas'
    description: 'Produktai testuojami dėl jų reakcijos į irklavimo ar variklio įvedimus, vertinant sukimosi spindulį ir valdymo lengvumą. Bandymai vandenyje patvirtina, kad realus valdymas atitinka dizaino specifikacijas.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Vandens nepralaidumo testavimas'
    description: 'Visiškai surinkti produktai panardinami arba veikiami vandens purslų, siekiant patikrinti, ar nėra nuotėkių per siūles, vožtuvus ar medžiagas. Kiekviena lenta praeina privalomą vandens nepralaidumo patikrą prieš siuntimą.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp


body: |
  <h2>Pagrindiniai skirtumai</h2>
  <p>Pripučiamos SUP lentos (iSUP) ir kietosios lentos atlieka tą pačią pagrindinę paskirtį — stovėjimą ir irklavimą vandenyje — tačiau jos to pasiekia visiškai skirtingais konstrukciniais metodais. Teisingas pasirinkimas priklauso nuo to, kaip planuojate naudoti lentą.</p>

  <table>
    <tr><th>Faktorius</th><th>Pripučiama SUP</th><th>Kieta SUP</th></tr>
    <tr><td>Konstrukcija</td><td>„Drop-Stitch“ PVC, pripūčiama iki 12-15 PSI</td><td>EPS putų branduolys, apvyniotas stiklo pluoštu arba epoksidu</td></tr>
    <tr><td>Svoris</td><td>18-28 lbs (tik lenta)</td><td>20-30 lbs (tik lenta)</td></tr>
    <tr><td>Sulankstomas dydis</td><td>Mapė (30 x 15 x 10 in)</td><td>Pilnas ilgis (10-14 ft)</td></tr>
    <tr><td>Paruošimas</td><td>3-5 minučių pripūtimas</td><td>Parengta naudoti</td></tr>
    <tr><td>Eksploatacijos laikas</td><td>5-10 metų prižiūrint</td><td>3-8 metai (linkusios į įdubimus)</td></tr>
  </table>

  <h2>Pernešamumas</h2>
  <p><strong>Laimi pripučiama.</strong> Tai aiškiausias pranašumas. Pripučiama SUP lenta sulankstoma į mapę, kuri telpa automobilio bagažinėje, buto spintoje arba lėktuvo bagažo lentynoje. Keliautojai, butų gyventojai ir visi be stogo laikiklių sandėliavimo galimybių supras, kad pripučiamos SUP lentos yra kur kas praktiškesnės.</p>
  <p>Kietosioms lentoms reikia stogo laikiklio, didelio automobilio arba atskiros laikymo vietos. Jas sunku transportuoti, o be specialių transportavimo dėklų jų negalima vežti lėktuvais.</p>

  <h2>Patvarumas</h2>
  <p><strong>Laimi pripučiama.</strong> Pripučiamos SUP lentos gaminamos iš karinės klasės PVC, atsparaus smūgiams, dūriams ir UV pažeidimams. Kai paleidžiate pripučiamą lentą arba atsitrenkiate į uolą, ji atšoka. Kietoji lenta nuo tokio pat smūgio suskilinėtų, įtrūktų arba delaminuotųsi.</p>
  <p>Kietosios lentos yra jautresnės kasdieniam nusidėvėjimui. Vienas numetimas ant betono gali sukelti nuolatinį įdubimą, veikiantį našumą ir leidžiantį vandeniui prasiskverbti.</p>

  <h2>Našumas</h2>
  <p><strong>Aukščiausioje klasėje laimi kietoji lenta.</strong> Esant vidutiniam greičiui, poilsio irklavimui ir turizmui abu lentų tipai veikia panašiai. Kietosios lentos turi pranašumą:</p>
  <ul>
    <li><strong>Greitis</strong> — kietosios lentos yra lengvesnės ir standesnės, kas reiškia geresnį čiuožimą ir didesnį didžiausią greitį</li>
    <li><strong>Banglentės</strong> — kietosios lentos suteikia reaktyvesnius bortelių perėjimus ir geresnį darbą su bangomis</li>
    <li><strong>Lenktynės</strong> — konkurencinėse lenktynėse beveik išimtinai naudojamos kietosios lentos dėl jų svorio ir standumo pranašumų</li>
  </ul>
  <p>Vidutiniam poilsio irkluotojui šie našumo skirtumai yra nedideli. Dauguma irkluotojų neįveiks kokybiškos pripučiamos lentos našumo.</p>

  <h2>Pritaikymas pradedantiesiems</h2>
  <p><strong>Laimi pripučiama.</strong> Pripučiamos SUP lentos pradedantiesiems yra lengvesnės, nes:</p>
  <ul>
    <li>Minkštesnis denio paviršius yra patogesnis ir rečiau sukelia traumas kritimų metu</li>
    <li>Platesnės, storesnės pripučiamos lentos suteikia daugiau pirminio stabilumo</li>
    <li>Mažesnė pradinė investicija padaro įėjimą prieinamesnį</li>
    <li>Lengvas transportavimas reiškia daugiau galimybių irkluoti</li>
  </ul>

  <h2>Laikymas ir priežiūra</h2>
  <p>Pripučiamoms SUP lentoms prieš laikymą reikia džiovinimo ir teisingo lankstymo. Kietosios lentos gali būti laikomos surinktos, tačiau joms reikia apsaugos nuo saulės, karščio ir smūgių. Abiejoms naudinga nuplauti gėlu vandeniu po naudojimo jūroje.</p>

  <h2>Rekomendacija</h2>
  <p><strong>Rinkitės pripučiamą SUP lentą, jei:</strong> keliaujate, turite ribotą laikymo vietą, irkluojate dėl poilsio arba esate pradedantysis. 90 % irkluotojų kokybiška pripučiama lenta puikiai tarnaus.</p>
  <p><strong>Rinkitės kietąją lentą, jei:</strong> dalyvaujate konkurencinėse lenktynėse, vaikotės pažangių bangų arba teikiate pirmenybę maksimaliam našumui, o ne pernešamumui ir patvarumui.</p>

  <h2>DUK</h2>
  <h3>Kuris variantas patvaresnis: pripučiama ar kieta SUP lenta?</h3>
  <p>Pripučiamos SUP lentos paprastai yra patvaresnės, nes jos atsparios įdubimams, įtrūkimams ir smūgių pažeidimams, kurie kietajai lentai sukeltų negrįžtamą žalą.</p>

  <h3>Ar pripučiama SUP lenta geresnė pradedantiesiems?</h3>
  <p>Taip. Pradedantiesiems rekomenduojamos pripučiamos SUP lentos, nes jos labiau atleidžiančios, lengviau transportuojamos ir rečiau sukelia traumas kritimų metu.</p>

  <h3>Ar pripučiamos SUP lentos gali veikti taip pat gerai kaip kietosios?</h3>
  <p>Poilsio irkluojant ir turizmui pripučiamos SUP lentos atitinka kietųjų lentų našumą. Kietosios lentos vis dar pirmauja lenktynėse ir pažangiausiame banglentėse dėl mažesnio svorio ir tobulesnės lankstumo savybių.</p>

timeline:
  - year: '2012'
    title: 'Jūrinės gamybos pamatai'
    body: 'afarer prasidėjo kaip specializuotos vandens transporto priemonių dirbtuvės Cindao, Kinijoje, įsipareigojusios jūriniam meistriškumui ir vandens transporto priemonių gamybai. Ankstyvuoju laikotarpiu pagrindinis dėmesys buvo skiriamas patikimų pripučiamų produktų kūrimui remiantis praktine inžinerijos patirtimi ir gamybos drausme.'
  - year: '2015'
    title: 'Pirmasis eksportas ir CE sertifikatas'
    body: 'Pirmieji eksporto užsakymai pasiekė Japoniją ir Korėją. Pagrindinėms produktų linijoms buvo gautas CE sertifikatas, pažymintis afarer įėjimą į tarptautines rinkas. Įmonė pradėjo aptarnauti komercinius ir poilsio vartotojus už Kinijos ribų.'
  - year: '2018'
    title: 'Gamyklos plėtra'
    body: 'Įmonė persikėlė į 12,000 m² ploto gamybos objektą. Buvo pridėtos RF suvirinimo linijos ir "Drop-Stitch" gamybos pajėgumai, leidžiantys didesnės apimties gamybą ir patobulintas kokybės kontrolės sistemas.'
  - year: '2020'
    title: 'Įkurtas tyrimų ir plėtros centras'
    body: 'Atidarytas atskiras tyrimų ir plėtros centras su PVC audinių laboratorija, hidrodinaminiu bandymų baseinu ir CAD/FEA modeliavimo studija. Produktų plėtra išsiplėtė, sutelkiant dėmesį į lengvą konstrukciją, geresnį patvarumą ir vartotojui pritaikytą dizainą.'
  - year: '2022'
    title: 'Sertifikavimas ir pasaulinė plėtra'
    body: 'Gautas ISO 9001 sertifikatas. Išsiplėsta iki 14 tyrimų ir plėtros inžinierių ir daugiau nei 200 darbuotojų. Produktai per platintojų ir bendro prekės ženklo partnerystes pasiekė klientus visoje Europoje, Amerikoje ir Azijos bei Ramiojo vandenyno regione.'
  - year: '2024'
    title: 'Inovacijų ir dizaino studija'
    body: 'Paleista visapusiškų paslaugų dizaino ir inovacijų studija individualiems bendro prekės ženklo projektams — nuo koncepcijos iki gamybos. Stiprintos profesinės jūrinės programos, įskaitant gelbėjimo, komercines ir vyriausybinę sutartis.'
  - year: '2026'
    title: 'Kuriama vandens tyrinėjimo ateitis'
    body: 'Šiandien afarer tęsia SUP sistemų ir jūrinių priedų kūrimą — siejant žmones ir organizacijas su pasaulio vandenimis. Aptarnautos 50+ šalių, 15,000+ vienetų metinis pajėgumas.'

content_founding:
  tagline: 'Pradžia'
  title: 'Gimė prie vandens'
  subtitle: 'afarer prasidėjo pakrantės dirbtuvėse Cindao su viena lenta ir vizija: kurti pripučiamas vandens transporto priemones, kurios atlaikytų tikras jūrines sąlygas.'
  paragraphs:
    - '2012 m. mūsų įkūrėjai pamatė spragą rinkoje — dauguma pripučiamų vandens transporto priemonių buvo arba pigios, bet nepatikimos, arba aukštos kokybės, bet nepriimtinai brangios. Jie tikėjo, kad yra vietos gamintojui, teikiančiam ir kokybę, ir vertę.'
    - 'Pirmasis korpusas buvo pagamintas rankomis, išbandytas vietiniuose vandenyse ir tobulintas remiantis realiais žvejų ir smulkių komercinių operatorių atsiliepimais. Tas grįžtamojo ryšio ciklas — kurti, testuoti, klausyti, tobulinti — ir šiandien išlieka mūsų inžinerijos filosofijos branduolyje.'
    - 'Iki 2015 m. žinia išplito už Cindao ribų. Tarptautiniai platintojai pradėjo prašyti pavyzdžių. Tai, kas prasidėjo kaip vietinės dirbtuvės, virto pasauliniu tiekėju.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'afarer ankstyvosios gamybos dirbtuvės ir gamyba'

content_growth:
  tagline: 'Plėtra ir inovacijos'
  title: 'Nuo dirbtuvių iki 12,000 m² ploto objekto'
  subtitle: 'Nuolatinės investicijos į žmones, įrangą ir procesus afarer pavertė modernia jūrinės gamybos įmone.'
  paragraphs:
    - 'Augant paklausai augo ir mūsų objektas. Išsiplėtėme iš mažų dirbtuvių į 12,000 m² ploto gamyklą su atskiromis SUP lentų ir priedų gamybos linijomis.'
    - 'Investavome į CNC pjaustymo stakles, aukšto dažnio suvirinimo įrangą, "Drop-Stitch" gamybos linijas ir išsamius bandymų stendus — tai leidžia mums valdyti kiekvieną gamybos kokybės aspektą.'
    - 'Šiandien mūsų daugiau nei 200 žmonių komandą sudaro jūrų inžinieriai, medžiagų mokslininkai, kokybės kontrolės specialistai ir kvalifikuoti amatininkai — daugelis jų afarer komandoje nuo ankstyvųjų dienų.'

philosophy:
  tagline: 'Prekės ženklo filosofija'
  title: 'Laisvės vandenyje inžinerija'
  body: 'Laisvė vandenyje — tai ne tik judėjimas. Tai naujų vietovių atradimas, lauko patirčių kūrimas, žmonių ryšys su gamta ir profesinių misijų įgalinimas. Inžinerija daro šią laisvę įmanomą.'
  pillars:
    - title: 'Patikimumas pirmiausia'
      body: 'Vandens aplinka reikalauja pasitikėjimo. afarer produktai kuriami atsižvelgiant į stabilumą, patvarumą, saugą ir nuoseklų našumą.'
    - title: 'Žmogaus poreikiams pritaikytas dizainas'
      body: 'Produktai turi tarnauti žmonėms, o ne technologijoms. Kiekvienas dizaino sprendimas prasideda nuo supratimo, kaip žmonės naudoja vandens transporto priemones, kur jie plaukioja ir su kokiais iššūkiais susiduria.'
    - title: 'Prieinamas tyrinėjimas'
      body: 'Vanduo neturėtų priklausyti tik ekspertams. afarer kuria įrangą, leidžiančią daugiau žmonių saugiai patirti upes, ežerus, vandenynus ir pakrančių aplinką.'
    - title: 'Nuolatinės inovacijos'
      body: 'Inovacijos — tai ne tik naujų produktų kūrimas. Tai kiekvienos detalės tobulinimas — medžiagos, konstrukcijos, gamyba ir vartotojo patirtis.'

engineeringDna:
  tagline: 'Inžinerijos DNR'
  title: 'Kaip afarer kuria produktus'
  areas:
    - title: 'Medžiagų mokslas'
      body: 'afarer daugiausia dėmesio skiria tinkamų medžiagų parinkimui skirtingoms jūrinėms aplinkoms. Pagrindiniai aspektai: atsparumas dilimui, UV atsparumas, slėgio stabilumas ir ilgalaikis patvarumas.'
      items: ['Atsparumas dilimui', 'UV atsparumas', 'Slėgio stabilumas', 'Ilgalaikis patvarumas']
    - title: 'Konstrukcinė inžinerija'
      body: 'Pripučiamoms vandens transporto priemonėms reikia tikslaus balanso tarp standumo, svorio, pernešamumo ir stabilumo. afarer inžinerija siekia optimizuoti šiuos veiksnius naudojant "Drop-Stitch" branduolio technologiją ir pažangias siūlių konstrukcijas.'
      items: ['Standumas', 'Svorio optimizavimas', 'Pernešamumas', 'Stabilumas']
    - title: 'Gamybos tikslumas'
      body: 'Kiekvienas produktas praeina kontroliuojamus procesus: medžiagų paruošimą, tikslų pjaustymą, suvirinimą ir klijavimą, surinkimą, kokybės patikrą ir našumo patvirtinimą.'
      items:
        ['Medžiagų paruošimas', 'Tikslus pjaustymas', 'Suvirinimas ir klijavimas', 'Surinkimas ir kokybės kontrolė']
    - title: 'Vartotojo scenarijų inžinerija'
      body: 'Produktai kuriami pagal realius pritaikymus — poilsį, nuotykius ir profesinį naudojimą — siekiant užtikrinti, kad kiekvienas dizainas atitiktų numatytos aplinkos specifinius reikalavimus.'
      items: ['Poilsis', 'Nuotykiai', 'Profesinis', 'Komercinis']


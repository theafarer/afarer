meta:
  title: 'Partneriai — platinimas ir didmeninė prekyba | {SITE}'
  description: 'Tapkite afarer partneriu: platinimo tinklai, didmeninės kainos, OEM/privataus ženklo programos ir palaikymas irklavimo lentų verslams visame pasaulyje.'
  keywords:
    - 'sup platinimo partneris'
    - 'irklavimo lentų didmeninė prekyba'
    - 'pripučiamų sup platintojas'
    - 'sup partnerystė'
hero:
  tagline: 'Partneriai ir platinimas'
  title: 'Tapkite afarer partneriu<br />— pasaulinis platinimo tinklas'
  subtitle: 'Prisijunkite prie afarer pasaulinio partnerių tinklo. Mes bendradarbiaujame su jūrinės technikos platintojais, irklavimo sporto pardavėjais, įrangos mažmenininkais ir prekės ženklų partneriais daugiau nei 50 šalių.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: 'afarer pasaulinis partnerių ir platintojų tinklas'
content_programs:
  tagline: 'Partnerių programos'
  title: 'Partnerių programos,<br />sukurtos augimui'
  subtitle: 'Nesvarbu, ar esate platintojas, pardavėjas ar prekės ženklo partneris, afarer siūlo programas, sukurtas jūsų verslui palaikyti.'
  columns: 3
  items:
    - title: 'Platintojų programa'
      description: 'Išskirtinis teritorijos platinimas su apimties kainomis, rinkodaros palaikymu ir tiesiogine prieiga prie gamyklos. Reikalaujamas minimalus įsipareigojimas pagal teritorijos dydį.'
      icon: tabler:world
    - title: 'Pardavėjų programa'
      description: 'Tiesioginės pardavėjų kainos, produktų mokymai, rinkodaros medžiagos ir garantijos palaikymas mažmeninės prekybos vietoms ir internetinėms parduotuvėms.'
      icon: tabler:building-store
    - title: 'OEM/ODM partnerystė'
      description: 'Visapusiška OEM ir ODM gamyba su individualiu ženklinimu, pakavimu ir produktų specifikacijomis. Nuo koncepcijos iki konteinerio.'
      icon: tabler:certificate
    - title: 'Prekės ženklo partnerystė'
      description: 'Bendro prekės ženklo, privataus ženklo ir išskirtinių modelių programos įsitvirtinusiems prekės ženklams jūrinės technikos ir lauko poilsio srityje.'
      icon: tabler:stars
    - title: 'Vyriausybinė ir institucinė'
      description: 'Pageidaujamų tiekėjų programos vyriausybinėms agentūroms, pakrantų apsaugai, kariuomenei ir humanitarinėms organizacijoms. Paraiškoms paruošta dokumentacija.'
      icon: tabler:building-community
    - title: 'Kurortų ir nuomos partneris'
      description: 'Flotilės kainos, nuosekli kokybė ir individualus ženklinimas kurortams, nardymo centrams ir nuomos operacijoms visame pasaulyje.'
      icon: tabler:sun
content_benefits:
  tagline: 'Kodėl bendradarbiauti su mumis'
  title: 'Kodėl partneriai renkasi afarer'
  subtitle: 'Mūsų partneriai naudojasi realiais gamybos pajėgumais, nuoseklia kokybe ir reaguojančiu palaikymu.'
  list:
    - 'Tiesioginė prieiga prie gamyklos: Dirbkite tiesiogiai su mūsų gamybos komanda — be tarpininkų. Gaukite greitesnius atsakymus, geresnes kainas ir pilną gamybos matomumą.'
    - 'Parengta individualizavimui: Ženklinti produktus savo spalvomis, logotipais, pakavimu ir specifikacijomis. Mažiausi užsakymo kiekiai pritaikyti jūsų rinkai.'
    - 'Garantuota kokybė: ISO 9001 sertifikuota gamyba su CE, UKCA ir BSCI atitiktimi. Kiekvienas produktas išbandomas prieš siunčiant.'
    - 'Pasaulinė logistika: Siuntimas iš Cindao, Kinijos su FOB, CIF ir DDP parinktimis. JAV sandėlis Montclair mieste, Kalifornijoje, Šiaurės Amerikos platinimui.'
    - 'Rinkodaros palaikymas: Produktų katalogai, fotografija, techninė dokumentacija ir skaitmeniniai ištekliai jūsų pardavimų pastangoms palaikyti.'
    - 'Mokymai ir palaikymas: Produktų mokymai jūsų pardavimų komandai, techninis palaikymas jūsų klientams ir garantinio aptarnavimo koordinavimas.'
content_process:
  tagline: 'Kaip tapti partneriu'
  title: 'Paprastas partnerystės procesas'
  subtitle: 'Mūsų partnerystės procesas yra paprastas — sukurtas, kad greitai pradėtumėte parduoti afarer produktus.'
  items:
    - title: '1 žingsnis: Pateikite paraišką'
      description: 'Užpildykite mūsų partnerių paraiškos formą su jūsų įmonės profiliu, tikslinė rinka ir produktais, kuriais domitės.'
    - title: '2 žingsnis: Kvalifikacijos peržiūra'
      description: 'Mūsų partnerystės komanda peržiūri jūsų paraišką ir per 3 darbo dienas susisiekia su jumis aptarti galimybių.'
    - title: '3 žingsnis: Sutartis ir sąranka'
      description: 'Pasirašykite partnerystės sutartį, sukurkite savo sąskaitą ir gaukite partnerių kainas, rinkodaros medžiagas ir produktų pavyzdžius.'
    - title: '4 žingsnis: Mokymai ir paleidimas'
      description: 'Teikiami produktų mokymai, pardavimų palaikymas ir rinkodaros medžiagos. Jūs pasirengę pradėti pardavinėti.'
cta:
  title: 'Pasirengę tapti afarer partneriu?'
  subtitle: 'Pateikite partnerystės paraišką, o mūsų komanda atsakys per 3 darbo dienas.'
  actions:
    - variant: primary
      text: 'Pateikti partnerystės paraišką'
      href: /contact
    - text: 'Peržiūrėti mūsų produktus'
      href: /products

meta:
  title: 'Pasaulinis buvimas — SUP lentų gamintojas, aptarnaujantis 50+ šalių | {SITE}'
  description: 'afarer eksportuoja pripučiamas SUP lentas į 50+ šalių kiekviename žemyne. Profesionalus gamintojas ir tiekėjas prekės ženklams, platintojams ir flotilėms.'
  keywords:
    - 'pasaulinis sup gamintojas'
    - 'irklavimo lentų eksportuotojas'
    - 'sup gamykla kinijoje'
    - 'profesionalus sup tiekėjas'
hero:
  tagline: 'Pasaulinis buvimas'
  title: 'Aptarnaujame 50+ šalių<br />kiekviename žemyne'
  subtitle: 'Nuo Europos pakrančių patrulių operatorių iki Australijos vandens sporto platintojų ir Artimųjų Rytų gelbėjimo komandų — afarer lentos yra vandenyje visame pasaulyje.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'afarer pasaulinė jūrinė gamyba ir platinimas'
stats:
  title: 'Pasaulinis pasiekiamumas'
  stats:
    - title: 'Šalys'
      amount: '50+'
    - title: 'Eksporto rinkos'
      amount: 'Europa, Amerika, Azija, Artimieji Rytai, Okeanija'

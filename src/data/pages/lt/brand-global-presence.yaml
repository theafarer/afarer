features3_markets:
  tagline: 'Pagrindinės rinkos'
  title: 'Regioninė kompetencija<br />vietiniams reikalavimams'
  subtitle: 'Suprantame, kad skirtingos rinkos turi skirtingus reguliavimo reikalavimus, pageidavimus ir naudojimo atvejus.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Europa ir JK'
      description: 'CE sertifikuoti produktai. Stipri SUP lentų paklausa ES rinkose. JK platintojai vertina mūsų greitą įvykdymą.'
      icon: tabler:map-pin
    - title: 'Šiaurės Amerika'
      description: 'JAV pakrantų apsaugos patvirtinta gamyba. JAV sandėlis Montclair mieste, Kalifornijoje, greitam pristatymui į Vakarų pakrantę. Auganti žvejybos, gelbėjimo ir poilsio SUP lentų paklausa.'
      icon: tabler:map-pin
    - title: 'Australija ir Okeanija'
      description: 'Stipri SUP lentų ir vandens sporto priedų rinka. Australijos platintojai vertina mūsų UV atsparią PVC konstrukciją sudėtingomis saulės sąlygomis. Greitas siuntimas iš mūsų Azijos objekto.'
      icon: tabler:map-pin
    - title: 'Artimieji Rytai'
      description: 'Auganti vandens nuotykių įrangos paklausa. Mūsų komercinės klasės SUP lentos ir saugos įranga populiarios tarp turizmo operatorių ir nuomos centrų. Individualios konfigūracijos aukštos temperatūros aplinkai.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Platinimo tinklas'
  title: 'Bendradarbiavimas su platintojais<br />visame pasaulyje'
  subtitle: 'Mes dirbame su įsitvirtinusiais jūrinės įrangos platintojais, vandens sporto prekės ženklais ir vyriausybinės apsipirkimo agentūromis.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Bendro prekės ženklo programos'
      description: 'Privataus ženklo gamyba pasauliniams vandens sporto prekės ženklams. Mes tvarkome viską — nuo dizaino iki gamybos ir tiesioginio siuntimo.'
      icon: tabler:building
    - title: 'Platintojų tinklas'
      description: 'Įgalioti platintojai daugiau nei 20 šalių laiko atsargas ir teikia vietinį palaikymą. Naujos platintojų užklausos laukiamos.'
      icon: tabler:users
    - title: 'Vyriausybinė ir institucinė'
      description: 'Tiesioginis tiekimas pakrantų apsaugai, paieškos ir gelbėjimo organizacijoms bei karinėms apsipirkimo programoms. Atitiktis institucinės apsipirkimo reikalavimams.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Pasaulinė logistika ir palaikymas'
  subtitle: 'Nuo gamyklos iki paskirties vietos — valdome visą tiekimo grandinę.'
  items:
    - title: 'Siuntimo parinktys'
      description: 'Jūrų kroviniai (FOB Cindao), oro kroviniai skubiems užsakymams ir greitojo kurjerio paslaugos pavyzdžiams ir atsarginėms dalims.'
      icon: tabler:truck-delivery
    - title: 'JAV sandėlis'
      description: 'Atsargos laikomos Montclair mieste, Kalifornijoje, greitam pristatymui visoje Šiaurės Amerikoje. Vakarų pakrantė: 2-3 dienos, centrinė dalis: 3-4 dienos, Rytų pakrantė: 4-5 dienos.'
      icon: tabler:building-warehouse
    - title: 'Atsarginės dalys'
      description: 'Originalios afarer atsarginės dalys ir eksploatacinės medžiagos laikomos ištisus metus. Dažniausios dalys siunčiamos per 24 valandas.'
      icon: tabler:package
    - title: 'Techninis palaikymas'
      description: 'Tiesioginė linija į mūsų inžinerijos komandą techniniams klausimams, remonto patarimams ir atsarginių dalių palaikymui. Mes remiame lentas, kurias pagaminome prieš 20 metų.'
      icon: tabler:headset
cta:
  title: 'Norite tapti platintoju?'
  subtitle: 'Aktyviai plečiame savo platinimo tinklą. Susisiekite su mūsų eksporto komanda aptarti partnerystės galimybių.'
  actions:
    - variant: primary
      text: 'Partnerystės užklausa'
      href: /contact
    - text: 'Peržiūrėti mūsų produktų asortimentą'
      href: /products

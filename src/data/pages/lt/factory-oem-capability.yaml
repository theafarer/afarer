services:
  - title: 'Produkto dizainas ir inžinerija'
    description: 'Mūsų vidinė R&D komanda dirba su jūsų koncepcija ar specifikacija, kad sukurtų CAD brėžinius, 3D modelius ir prototipus. Siūlome formelių dizainą, korpuso formos optimizavimą ir medžiagų parinkimo gaires.'
  - title: 'Pasirinktinis prekės ženklas ir grafika'
    description: 'Visų spalvų skaitmeninis spausdinimas, šilkografija, reljefas ir etikečių parinktys. Kuriame prekės ženklui būdingą denio grafiką, vamzdelių ženklinimą ir prekybai paruoštą pakuotę.'
  - title: 'Medžiagų ir specifikacijų pritaikymas'
    description: 'Pasirinkite iš PVC (standartinis, ekologiškas, liepsnai atsparus), „Drop-Stitch" ir hibridinių konstrukcijų. Pasirinktinės vamzdelių spalvos, audinių svoriai ir sutvirtinimo parinktys.'
  - title: 'Pakavimas ir logistika'
    description: 'Pasirinktinė mažmeninė pakuotė, privataus prekės ženklo dėžės, vakuumuotas pakavimas, padėklų formavimas ir konteinerių pakrovimas. FOB Čingdao, CIF arba DDP siuntimo sąlygos prieinamos.'

moq_table:
  - product: 'Pripučiamos SUP lentos'
    standard_moq: '5–10 vienetų'
    custom_moq: '200+ vienetų'
    lead_time: '30–45 dienos'
  - product: 'Gelbėjimo liemenės ir sauga'
    standard_moq: '100–200 vienetų'
    custom_moq: '1 000+ vienetų'
    lead_time: '20–30 dienų'

why_us:
  - title: 'Vertikali integracija'
    description: 'Mes valdome savo gamyklą, formeles ir tiekimo grandinę — jokių tarpininkų, jokių subrangovų. Tai suteikia mums kontrolę kokybei, kainai ir pristatymui.'
  - title: 'Dvigubas sertifikavimas'
    description: 'ISO 9001 kokybės vadyba ir BSCI socialinės atitikties sertifikavimas. Gamyklos audito ataskaitos prieinamos pareikalavus.'
  - title: 'CE atitiktis'
    description: 'Visi standartiniai modeliai turi CE 2013/53/ES sertifikatą. Pasirinktiniai modeliai gali būti CE sertifikuoti per mūsų įtvirtintą procesą.'
  - title: 'Žemas MOQ'
    description: 'Pradėkite nuo tik 5 vienetų standartiniams modeliams. Mes padedame naujiems prekės ženklams pradėti neperkraunant atsargų.'

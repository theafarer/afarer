intro: 'afarer siūlo išsamias OEM ir ODM paslaugas prekės ženklams, platintojams ir vyriausybinėms institucijoms visame pasaulyje. Turėdami 10+ metų eksporto patirties ir 12 000 m² ISO 9001 bei BSCI sertifikuotą gamyklą, mes valdome viską — nuo produkto dizaino ir formelių kūrimo iki viso masto gamybos, pakavimo ir logistikos.'


  description: 'Afarer yra pasaulinis pripučiamų SUP lentų ir vandens sporto prekės ženklas, valdomas Aquafarer LLC (JAV) ir kuriamas mūsų Cindao operacijų komandos. Sužinokite mūsų istoriją, inžineriją, sertifikuotą kokybę ir šalių partnerių programas.'

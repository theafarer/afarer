stories:
  tagline: 'Tyrinėtojų istorijos'
  title: 'Tikri nuotykiai iš tikrų žmonių'
  subtitle: 'Paklausykite irkluotojų, šeimų ir profesionalų, kurie vandenyje naudoja afarer įrangą.'
  items:
    - name: 'Sarah ir Mike'
      title: 'SUP Explorer 11 savininkai, Kanada'
      content: 'Savo Explorer 11 lentes pasiėmėme savaitės kelionėn per Algonquin parką. Jos puikiai atlaikė perkėlas ir ežerų kirtojimus. „Drop-Stitch“ konstrukcija reiškė, kad galėjome pripūsti iki 15 PSI ir gauti kietos lentos našumą iš sulankstomos lentos.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Algonquin parkas, Kanada'
    - name: 'Carlos R.'
      title: 'Cheetah Surge raitelis, Ispanija'
      content: 'Cheetah Surge yra mano pirmasis pasirinkimas pakrančių plaukiojimams. Ryškus dizainas paplūdimyje atkreipia dėmesį, o stabilumas suteikia man pasitikėjimo lengvame bangavime. Ji valdoma puikiai, nesvarbu, ar turizmo reisu, ar tiesiog mėgaujuosi saulėlydžiu.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Ispanija'
    - name: 'Lina ir šeima'
      title: 'Flowing Lotus irkluotojai, Švedija'
      content: 'Savaitgalio šeimos nuotykiai salyne. Flowing Lotus pakankamai stabili, kad ant jos galėtų stovėti mano dukra, kol aš irkluoju. Pripučiama per maždaug 10 minučių — priekabos nereikia, tik tyras šeimos džiaugsmas vandenyje.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Stokholmo salynas, Švedija'
    - name: 'Lt. Cmdr. Andres'
      title: 'Ocean Voyager tyrinėtojas, Filipinai'
      content: 'Savo Ocean Voyager naudoju ilgo nuotolio pakrančių turams aplink Palavaną. Po mėnesių kasdienio naudojimo atogrąžų sąlygomis lenta vis dar veikia kaip nauja. Turizmo forma kerta bangavimą, kuris sustabdytų silpnesnes lentas.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palavanas, Filipinai'
    - name: 'Emma T.'
      title: 'Tropical Breeze pirmą kartą išbandžiusi, Australija'
      content: 'Anksčiau niekada nebuvau ant SUP lentos. Tropical Breeze tokia stabili, kad pasijutau užtikrintai jau pirmą kartą. Dabar irkluoju kiekvieną savaitgalį. Mokymosi kreivė iš esmės nulinė — o lenta vandenyje atrodo nuostabiai.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Australija'


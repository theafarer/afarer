hero:
  tagline: 'Gyvenimo būdas'
  title: 'afarer<br />gyvenimo būdas'
  subtitle: 'Sukurta tiems, kurie gyvena ant vandens — nuo savaitgalio tyrinėtojų iki komercinių operatorių, kurie kiekvieną dieną pasitiki savo įranga.'

values:
  - icon: 🌊
    title: 'Gimęs ant vandens'
    desc: 'Kiekvienas dizainas prasideda nuo vandens elgsenos supratimo. Mes projektuojame nuo sąlygų ribos į vidų — nes vandenynas mums mokytojas, o ne darbo vieta.'
  - icon: 🔧
    title: 'Sukurta ilgai tarnauti'
    desc: 'Išsamiausiai tvarus produktas yra tas, kurio nereikia keisti. Jūrinės klasės medžiagos, „Drop-Stitch“ branduoliai, patvirtinti iki 15 PSI, ir siūlės, išliekančios ilgiau nei sezonas.'
  - icon: '🏆'
    title: 'Prieinamas pagal dizainą'
    desc: 'Vandens sportas neturėtų būti prabanga. Profesionalaus lygio našumas už kainą, kuri turi prasmę šeimoms, gidams ir smulkiems operatoriams — ne tik komercinėms flotilėms.'
  - icon: 🌍
    title: 'Pasaulinė bendruomenė'
    desc: 'Nuo Cindao kranto iki ežerų Europoje, upių Pietryčių Azijoje ir įlankų Amerikoje — mūsų klientus sieja vienas dalykas: meilė būti ant vandens.'
  - icon: ♻️
    title: 'Atsakinga gamyba'
    desc: 'CNC optimizuotas išdėstymas sumažina medžiagų atliekas iki mažiau nei 5 %. Patvari konstrukcija mažina keitimo ciklus. Mes kuriame ilgaamžiškumui, nes tai tvariausias pasirinkimas.'
  - icon: 🤝
    title: 'Palaikymas, kuris išlieka'
    desc: 'Dvidešimt metų turintys korpusai vis dar skambina mums dėl atsargine dalių. Mūsų garantinio atsako vidurkis — 24 valandos. Mes neišnykstame pardavę — esame visam produkto gyvenimui.'


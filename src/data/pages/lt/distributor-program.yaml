faqs:
  title: 'Šalių partnerystė — DUK'
  subtitle: 'Klausimai, kurių klausia rimti šalių partneriai prieš teikdami paraišką.'
  items:
    - title: 'Ką iš tiesų reiškia viena šalis — vienas platintojas?'
      description: 'Afarer skiria vieną įgaliotą platintoją su išskirtinėmis teisėmis apibrėžtai teritorijai. Mes neparduodame iš savo pasaulinių ar regioninių kanalų į apsaugotą šalį. Jūsų teritorijos nuosavybė galioja, kai laikomasi Platinimo sutarties.'
    - title: 'Ar teritorija išskirtinė visam laikui?'
      description: 'Ne. Išskirtinumas sąlyginis, ne amžinas. Jis palaikomas pasirašyta Platinimo sutartimi, pirmojo užsakymo įvykdymu, kasmetiniais pirkimo tikslais, vietinėmis atsargomis, pardavimų aptarnavimo galimybėmis ir tęsiamomis rinkos investicijomis. Jei šios sąlygos nesilaikoma, teritorija gali būti peržiūrėta arba perskirta.'
    - title: 'Koks yra minimalus pirmasis užsakymas?'
      description: 'Šalies ir regioniniai platintojai pradeda nuo 100–300 vienetų; įgalioti prekiautojai — nuo 30–50 vienetų; bandomieji užsakymai nuo 10–30 vienetų leidžia jums pirmiausia patikrinti rinką (bandomieji ir mėginių užsakymai nesuteikia teritorijos apsaugos). Pasirinktinės ir privataus prekės ženklo programos vadovaujasi atskirais MOQ, nurodytais aukščiau pateiktuose lygiuose.'
    - title: 'Koks palaikymas įtrauktas į 10 modulių palaikymo programą?'
      description: 'Lygiai ir kvalifikacija, teritorijos apsauga, MOQ / kainodara / kasmetės premijos, atsargos ir užsakymų vykdymas, rinkodaros medžiaga ir bendras rinkos finansavimas, produkto / pardavimų / techniniai mokymai, atsarginės dalys ir pardavimų aptarnavimas, garantijos registracija, partnerių portalas bei produkto duomenų lapai, rinkodaros medžiagos biblioteka, kasmetinis premijų grafikas ir siuntimo bei pakavimo sąrašai.'
    - title: 'Kaip Afarer apsaugo mane nuo kanalų konfliktų?'
      description: 'Kiekvienoje teritorijoje yra tiksliai vienas įgaliotas platintojas. Užklausos ir tiesioginiai užsakymai iš jūsų regiono nukreipiami per jus, svetainės formos persiunčiamos vietiniam partneriui, jei toks yra, o pasaulinė komanda įsikiša tik tada, kai partneris neatsako.'
    - title: 'Kokios yra siuntimo ir apmokėjimo sąlygos?'
      description: 'Užsakymai siunčiami FOB Čingdao su pilna eksporto dokumentacija. Gamybos užsakymai — 30 % avansas ir 70 % prieš siuntimą; bandomieji ir mėginių užsakymai apmokami iš anksto. Standartinis pagaminimo terminas — 30–45 darbo dienos, o mėginių serijoms — 15–20 darbo dienų.'
    - title: 'Kaip pateikti paraišką?'
      description: 'Atsiųskite paraišką per kontaktų formą su rinkos detalėmis. Mes peržiūrime rinkos tinkamumą, mažmeninę buvimą ir logistikos galimybes, tada atsakome per 3 darbo dienas su tolesniais žingsniais ir pavyzdine Platinimo sutartimi.'

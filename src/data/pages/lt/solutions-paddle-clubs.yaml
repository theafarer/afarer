meta:
  title: 'Irklavimo klubų SUP įranga ir parkų sprendimai | {SITE}'
  description: 'Išsamios SUP parkų programos irklavimo klubams ir mokykloms. Starto paketai, profesionalūs parkai, lenktynių lentos, mokymo centrų rinkiniai ir atsarginių dalių palaikymas.'

hero:
  tagline: 'Irklavimo klubai ir mokyklos'
  title: 'Paleiskite, valdykite ir plėskite savo irklavimo klubą<br />su komercinės klasės SUP parkais'
  subtitle: 'SUP klubų įrangos tiekėjas irklavimo klubams ir SUP mokykloms visame pasaulyje — patvarios komercinės lentos, klubų didmenų kainos, pasirinktinis prekės ženklas ir greitos atsarginės dalys, kad galėtumėte sutelkti dėmesį į savo bendruomenės augimą.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 'Irklavimo klubo nariai vienodomis Afarer SUP lentomis'

benefits:
  title: 'Klubo parko pranašumai'
  subtitle: 'Kodėl irklavimo klubai 50+ šalių renkasi Afarer kaip savo įrangos partnerį.'
  items:
    - metric: '40%+'
      label: 'Parko išlaidų taupymas'
      detail: 'Palyginti su mažmeninėmis kainomis su klubų didmenų nuolaidomis'
    - metric: '48 val.'
      label: 'Dalių pakeitimas'
      detail: 'Minimalios prastovos jūsų nuomos parkui'
    - metric: '500+'
      label: 'Nuomos ciklai'
      detail: 'Komercinės klasės patvarumas vienai lentai'
    - metric: '5+ metai'
      label: 'Parko tarnavimo laikas'
      detail: 'Su tinkama priežiūra ir rūpesčiu'

packages:
  title: 'Klubo parko programos'
  subtitle: 'Pasirinkite parko programą, atitinkančią jūsų klubo dydį ir ambicijas.'
  items:
    - name: 'Starto paketas'
      tagline: 'Naujiems klubams, iki 30 narių'
      features:
        - '10 SUP lentų (universalios + turizmo mišinys)'
        - '10 irklų + 10 gelbėjimo liemenių'
        - '2 dviejų veiksmų siurbliai + remonto rinkinys'
        - 'Klubo prekės ženklas ant lentų (logotipo spausdinimas)'
        - 'Paleidimo vadovas + saugos kontrolinis sąrašas'
        - 'CE sertifikuota — visa įranga'
      cta_text: 'Pradėkite savo klubą'
    - name: 'Profesionalus parkas'
      tagline: 'Įsitvirtinusiems klubams, 50–100 narių'
      features:
        - '30 SUP lentų (3 dydžių parinktys)'
        - '30 irklų + 30 gelbėjimo liemenių'
        - '5 siurbliai + 2 remonto rinkiniai + saugojimo stovas'
        - 'Pasirinktinės klubo spalvos + logotipas ant lentų'
        - 'Atsarginių dalių programa (15 % nuolaida)'
        - 'Personalo mokymų seansas (internetu)'
        - 'CE sertifikuota — visa įranga'
      popular: true
      cta_text: 'Sukurkite savo parką'
    - name: 'Lenktynių parkas'
      tagline: 'Lenktynių klubams, renginiams, varžyboms'
      features:
        - '50+ lenktynių / didelio našumo lentų'
        - 'Visiškas priedų rinkinys (irklu, liemenės, siurbliai)'
        - 'Renginių paramos rinkinys (starto bojos, žymekliai)'
        - 'Prioritetinės dalys (išsiuntimas per 24 val.)'
        - 'Skiriamasis sąskaitų vadybininkas'
        - 'Pasirinktinės komandos uniformų parinktis'
        - 'CE sertifikuota — visa įranga'
      cta_text: 'Gauti lenktynių parką'

training:
  title: 'Mokymo centrų paketai'
  subtitle: 'Viskas, ko SUP mokyklai reikia profesionaliems sertifikavimo kursams vykdyti.'
  items:
    - name: 'Instruktoriaus starto rinkinys'
      features:
        - '5 kokybiškos SUP lentos (instruktoriaus klasė)'
        - '5 anglies irklai demonstracijoms'
        - '5 gelbėjimo liemenės (instruktoriaus dydis)'
        - 'Mokymo programos vadovas'
        - 'CE sertifikuota įranga'
    - name: 'Visiškas mokyklos rinkinys'
      features:
        - '20 SUP lentų (mokinių + instruktorių mišinys)'
        - '20 irklų + 20 gelbėjimo liemenių (įvairūs dydžiai)'
        - '10 plūdrumo pagalbos priemonių pradedantiesiems'
        - '4 siurbliai + remonto rinkiniai'
        - 'Mokymo programa ir sertifikavimo parama'
        - 'CE sertifikuota įranga'

features:
  title: 'Kodėl klubai renkasi Afarer'
  subtitle: 'Nuosekli kokybė, greitos dalys ir didmenų kainos, sukurtos augantiems klubams.'
  items:
    - title: '500+ nuomos ciklų'
      description: 'Komercinės klasės lentos išgyvena kasdieninio naudojimo sezonus.'
      icon: 'tabler:shield-check'
    - title: 'Pasirinktinės spalvos'
      description: 'Atitinkite savo klubo tapatybę su pasirinktinėmis lentų spalvomis ir logotipu.'
      icon: 'tabler:palette'
    - title: 'Didmenų kainos'
      description: 'Kiekio nuolaidos parko užsakymams nuo 10+ lentų.'
      icon: 'tabler:discount'
    - title: 'Greitos dalys'
      description: 'Atsarginės dalys išsiunčiamos per 48 valandas.'
      icon: 'tabler:truck-delivery'
    - title: 'Klubo augimo parama'
      description: 'Patarimai dėl narystės programų, kainodaros ir renginių organizavimo.'
      icon: 'tabler:trending-up'
    - title: 'CE sertifikuota'
      description: 'Visa įranga atitinka tarptautinius saugos standartus.'
      icon: 'tabler:certificate'

cta:
  title: 'Pasirengę kurti savo irklavimo klubą?'
  subtitle: 'Gaukite savo klubo parko pasiūlymą arba atsisiųskite mūsų klubų pradžios vadovą.'
  actions:
    - text: 'Teikti paraišką dėl klubo parko'
      href: '/contact?package=club'

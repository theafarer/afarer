meta:
  title: 'Gamybos procesas — nuo žaliavos iki SUP lentos | {SITE}'
  description: 'Nuo žaliavos iki jūrai paruoštos SUP lentos: kiekvienas afarer gamybos proceso žingsnis mūsų kontrolėje — nuo pjaustymo ir suvirinimo iki testavimo.'
  keywords:
    - 'sup gamybos procesas'
    - 'pripučiamų sup gamykla'
    - 'irklavimo lentų gamybos žingsniai'
    - 'pvc supvirinimas sup'
hero:
  tagline: 'Procesas'
  title: 'Gamybos procesas'
  subtitle: 'Nuo žaliavos iki vandeniui paruoštos lentos — kiekvienas žingsnis mūsų kontrolėje'
  back_label: 'Grįžti į gamyklą'
  back_link: /factory

intro: 'Skirtingai nuo prekės ženklų, kurie gamybą perleidžia trečiosioms šalims, afarer valdo ir eksploatuoja visą savo gamybos grandinę. Ši vertikali integracija leidžia mums palaikyti griežtą kokybės kontrolę kiekviename etape, greitai reaguoti į individualius reikalavimus ir užtikrinti nuoseklią produktų kokybę partija po partijos. Štai kaip mūsų objekte gimsta lenta.'

steps:
  - step: '01'
    title: 'Medžiagų gavimas ir patikra'
    description: 'Kiekviena įeinanti PVC audinio, stiklo pluošto sluoksnių, dervos ir furnitūros partija yra tikrinama pagal specifikaciją. Audinių pavyzdžiai prieš išleidžiant į gamybą išbandomi dėl tempimo stiprio, storio vientisumo ir UV atsparumo. neatitinkančios medžiagos izoliuojamos ir grąžinamos.'
    duration: '1–2 dienos'
  - step: '02'
    title: 'Automatinis PVC pjaustymas'
    description: 'Patvirtinti audiniai klojami ant automatinės CNC pjaustymo mašinos ir pjaunami su mažesniu nei milimetro tikslumu. Kompiuterio optimizuotas išdėstymas ruožinius išdėsto taip, kad atliekos būtų minimalios — paprastai mažiau nei 5 %. Iškirpti ruožiniai pažymimi pagal lentų modelį ir kamerą, tada suskirstomi į ryšulius perdavimui į suvirinimo dirbtuves.'
    duration: '2–4 valandos vienam lentų rinkiniui'
  - step: '03'
    title: 'Balionų terminis sandarinimas ir suvirinimas'
    description: 'Ruožiniai jungiami ir klijuojami naudojant terminio sandarinimo mašinas su karšto oro suvirinimu esant kontroliuojamai 200–300 °C temperatūrai. Pagrindinės siūlės sutvirtinamos RF dielektriniu suvirinimu oro nelaidžioms, didelio stiprio jungtims. Baigtos kameros pripūčiamos iki 1.5× darbinio slėgio 30 minučių oro sulaikymo patvirtinimui.'
    duration: '1–2 dienos vienai lentai'
  - step: '04'
    title: 'SUP spausdinimas ir dekoravimas'
    description: 'SUP lentų denio grafika tepama naudojant skaitmeninį spausdinimą visų spalvų nuotraukų kokybės dizainams ir šilkografiją patvariems logotipams bei pasikartojantiems raštams. Atspaudai kietinami ir sandarinami UV ir dilimo atsparumui.'
    duration: '1–2 dienos'
  - step: '05'
    title: 'Galutinis surinkimas ir įranga'
    description: 'Lentos aprūpinamos surinkimo linijoje peleksais, vožtuvais, EVA deniais ir priedais. Kiekvienas vienetas seka 100 punktų surinkimo kontrolinį sąrašą su privalomu patvirtinimu kiekviename etape.'
    duration: '2–4 dienos'
  - step: '06'
    title: 'Kokybės testavimas ir patikra'
    description: 'Kiekviena baigta lenta atlieka privalomą kokybės barjerą: kameros oro sulaikymo testą, furnitūros veikimo patikrą, tvirtinimų sukimo momento patvirtinimą ir kosmetinę apžiūrą. Individualūs ir prototipiniai gaminiai taip pat atlieka bandymus vandenyje, apimančius stabilumą ir valdymą.'
    duration: '1–2 dienos'
  - step: '07'
    title: 'Pakavimas ir siuntimas'
    description: 'Lentos išleidžiamos orą, sulankstomos pagal procedūrą, supakuojamos į tvirtus audinius maišus arba faneros dėžes ir pakraunamos siuntimui. Kiekvienas paketas pažymimas modeliu, serijiniu numeriu ir paskirties vieta. Mes koordinuojame su krovinių ekspeditoriais FCL ir LCL konteinerių siuntimams visame pasaulyje.'
    duration: '1 diena'


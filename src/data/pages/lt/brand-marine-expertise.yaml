meta:
  title: 'Jūrinė kompetencija — inžinerija kiekviename korpuse | {SITE}'
  description: 'Kelerios jūrinės inžinerijos dešimtmečiai kiekviename korpuse. afarer valdo „Drop-Stitch“, jūrinį PVC ir profesionalų pripučiamų SUP lentų dizainą.'
  keywords:
    - 'jūrinė inžinerija'
    - 'pripučiamų SUP gamintojas'
    - 'irklavimo lentų gamyba'
hero:
  tagline: 'Jūrinė kompetencija'
  title: 'Kelerių dešimtmečių jūrinės inžinerijos<br />patirtis kiekviename korpuse'
  subtitle: 'afarer derina gilų medžiagų mokslą, precizinę gamybą ir realius bandymus, kad sukurtų vandens transporto priemones, veikiančias tada, kai to reikia.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'afarer jūrinės inžinerijos ir tyrimų komanda darbe'
expertise_materials:
  tagline: 'Medžiagų mokslas'
  title: 'Teisingos medžiagos parinkimas<br />kiekvienam taikymui'
  subtitle: 'Dirbame su dviem pagrindinėmis medžiagomis — kiekviena parinkta pagal specifinius naudojimo atvejus ir našumo reikalavimus.'
  columns: 3
  items:
    - title: 'Jūrinės klasės PVC'
      description: '1100 denjerų PVC audinys — universaliausia mūsų medžiaga. UV stabilizuota, atspari dilimui ir atitinkanti REACH. Ideali SUP lentoms, kur svorio ir kainos efektyvumas svarbus.'
      icon: tabler:droplet
    - title: 'Stiklo pluoštas ir polietilenas'
      description: 'Stiklo pluoštu laminuotos SUP lentos aukštam standumui ir čiuožimui. Rotacinio liespjimo polietilenas sunkiai nuomos ir gelbėjimo veiklai, reikalaujančiai maksimalaus smūgių atsparumo.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Gamybos galimybės'
  title: 'Precizinė gamyba<br />kiekviename žingsnyje'
  subtitle: 'Mūsų 12,000 m² objektas aprūpintas specializuota mašinomis kiekvienam gamybos etapui.'
  columns: 2
  items:
    - title: 'CNC pjaustymas'
      description: 'Kompiuteriu valdomas pjaustymas užtikrina tikslius, kartojamus audinio ruožinius su minimaliomis atliekomis. Kiekviena detalė tinka tiksliai taip, kaip suprojektuota.'
      icon: tabler:cpu
    - title: 'Aukšto dažnio suvirinimas'
      description: 'Pramoninis AD suvirinimas sukuria siūles, stipresnes už pagrindinę medžiagą. Nuoseklus temperatūros ir slėgio valdymas užtikrina oro nelaidžius sandarus kiekvienoje gamybos serijoje.'
      icon: tabler:bolt
    - title: '„Drop-Stitch“ branduolio surinkimas'
      description: 'Tūkstančiai poliesterinių siūlų jungia viršutinius ir apatinius audinio sluoksnius, leisdami aukšto slėgio pripūtimą (15-20 PSI) standžioms, stabiloms SUP lentoms.'
      icon: tabler:building-arch
    - title: 'Slėgio testavimas'
      description: 'Kiekvienas pripučiamas produktas prieš siuntimą yra slėgio išbandomas. Lentos testuojamos esant 1.25x nominaliam slėgiui — jei laiko ten, veiks ir vandenyje.'
      icon: tabler:wind
    - title: 'Siūlių stiprio testavimas'
      description: 'Atsitiktiniai kiekvienos gamybos partijos pavyzdžiai atlieka destruktyvų siūlių stiprio testavimą. Rezultatai registruojami ir susieti su konkrečiomis gamybos serijomis.'
      icon: tabler:files
    - title: 'Vandens testavimas'
      description: 'Kiekvienas modelis prieš sertifikavimą atlieka jūros bandymus. Realūs bandymai pakrančių sąlygomis patvirtina našumą, valdymą ir stabilumą.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Dizainas ir inžinerija'
  title: 'Sukurta realioms sąlygoms'
  subtitle: 'Mūsų dizaino filosofija prasideda nuo to, kaip lenta bus naudojama — o tada inžinerija statoma aplink tą naudojimo atvejį.'
  items:
    - title: 'Našaus korpuso dizainas'
      description: 'Kiekviena korpuso forma suderinta pagal jos naudojimo atvejį — išstumiamosios priekinės dalys turizmo čiuožimui, papildomas rokeris banglentės vikrumui, plokščios stabilios profilio formos žvejybai ir jogai.'
    - title: '„Drop-Stitch“ saugumas'
      description: 'Kiekviena lenta turi standų „Drop-Stitch“ branduolį su sutvirtintomis bortelėmis. Jei kuri nors dalis pažeidžiama, didelio stiprio „Drop-Stitch“ struktūra leidžia lentai išlikti eksploatuojamai.'
    - title: 'Ergonomiškas denio išdėstymas'
      description: 'Denio kilimėlių zonavimas, nešimo rankenos padėtis ir tvirtinimo taškai suprojektuoti pagal irkluotojo komfortą ilgalaikiam naudojimui — nesvarbu, ar tai turizmas, žvejyba, ar patruliavimas.'
    - title: 'Individuali konfigūracija'
      description: 'Bortelių spalvos, denio kilimėlio konfigūracija, priedų tvirtinimai, įrangos talpa — kiekvienas modelis gali būti pritaikytas pagal konkrečius eksploatacijos reikalavimus.'
cta:
  title: 'Turite konkretų taikymą mintyse?'
  subtitle: 'Mūsų inžinerijos komanda gali patarti dėl medžiagų parinkimo, dizaino ir gamybos jūsų projektui.'
  actions:
    - variant: primary
      text: 'Paklauskite mūsų inžinierių'
      href: /contact/
    - text: 'Peržiūrėti produktų asortimentą'
      href: /products/

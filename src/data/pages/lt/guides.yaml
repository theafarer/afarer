size_guide:
  tagline: 'Dydis ir specifikacijos'
  title: 'Raskite tinkamą dydį savo poreikiams'
  desc: 'Palyginkite SUP lentų matmenis, keliamąją galią ir rekomenduojamus naudojimus. Nesvarbu, ar jums reikia turizmo SUP, jogos lentos ar universalios SUP — mūsų dydžių vadovas padės išsirinkti tinkamą.'
  link_label: 'Visas dydžių vadovas su produkto specifikacijomis →'
  link: /size-guide/
  cards:
    - title: 'SUP lentos'
      desc: 'Pasirinkite ilgį pagal savo svorį ir numatytą naudojimą. Platesnės lentos (32"+) suteikia daugiau stabilumo. Ilgesnės lentos (11–12 pėdų) geriau laiko kryptį turizmui.'
    - title: 'Turizmo SUP'
      desc: 'Ilgesnės lentos (11–12 pėdų) atstumo įveikimui ir tiesiamam judėjimui. Pakankamai stabilios turizmui su įranga. Visada patikrinkite keliamąją galią.'
    - title: 'Universalios SUP'
      desc: 'Pasirinkite ilgį pagal raitelio svorį ir naudojimą. Platesnės lentos (32"+) stabilumui. Universalios rekreacijai ir treniravimuisi.'

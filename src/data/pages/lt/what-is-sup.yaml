body: |
  <h2>Kas yra pripučiamas SUP?</h2>
  <p>Pripučiamas SUP (stovėjimo irklentė) yra pernešamas vandens transportas, pagamintas iš „Drop-Stitch" PVC medžiagos, kuris tampa standus, kai pučiamas iki aukšto slėgio (12–15 PSI). Skirtingai nuo tradicinių kietų lentų, pagamintų iš putplasčio ir stiklo pluošto, pripučiamas SUP gali būti nuleistas, susuktas ir laikomas nešiojamojo kuprinės dydžio dėkle.</p>
  <p>Nepaisant to, kad yra pripučiamas, šiuolaikiniai SUP atitinka kietų lentų standumą ir našumą daugeliui rekreacinių ir turizmo taikymų. Pagrindinė inovacija yra <strong>„Drop-Stitch" konstrukcija</strong>: tūkstančiai poliestero siūlų jungia viršutinį ir apatinį audinio sluoksnius, neleisdami lentai išsipūsti esant slėgiui.</p>

  <h2>Kaip tai veikia: „Drop-Stitch" technologija</h2>
  <p>Kiekvieno pripučiamo SUP branduolys yra „Drop-Stitch" audinys. Gamybos metu tūkstančiai siūlų audžiami tarp dviejų PVC dengto audinio sluoksnių. Kai lenta yra pripūsta:</p>
  <ul>
    <li>Siūlai traukia viršutinius ir apatinius skydus į fiksuotą atstumą</li>
    <li>Tai sukuria standžią, plokščią platformą, atsparią lenkimui ir lankstymui</li>
    <li>Esant 12–15 PSI, lenta pasiekia standumą, palyginamą su EPS putplasčio branduolio lentomis</li>
  </ul>

  <h2>Pagrindiniai komponentai</h2>
  <ul>
    <li><strong>PVC „Drop-Stitch" branduolys</strong> — Pagrindinis struktūrinis sluoksnis, suteikiantis standumą</li>
    <li><strong>Bortų juostos</strong> — Sutvirtinti kraštai, apsaugantys nuo abrazyvo ir smūgių</li>
    <li><strong>EVA putplasčio denio kilimėlis</strong> — Nesislystantis paviršius stovėjimo komfortui ir sukibimui</li>
    <li><strong>Pelekų sistema</strong> — Nuimami pelekai kryptingam stabilumui (paprastai 2+1 konfigūracija)</li>
    <li><strong>Vožtuvas</strong> — Aukšto slėgio vienpusis vožtuvas pūtimui ir nuleidimui</li>
  </ul>

  <h2>Dažni naudojimo atvejai</h2>
  <ul>
    <li><strong>Irklavimas stovinčiame vandenyje</strong> — Ežerai, ramios įlankos ir lėtai tekantys upės</li>
    <li><strong>Turizmas</strong> — Ilgo nuotolio irklavimas atvirame vandenyje, reikalaujantis slydimo efektyvumo</li>
    <li><strong>Bangų slankiojimas</strong> — Mažos ir vidutinės bangos (nuo pradedančiųjų iki vidutinio lygio)</li>
    <li><strong>Žvejyba</strong> — Tyli, seklaus vandens prieiga žvejams</li>
    <li><strong>Treniravimasis</strong> — SUP joga, pilatesas ir centro treniruotės vandenyje</li>
    <li><strong>Kelionės</strong> — Pernešamas dizainas daro jį idealų oro linijoms ir kelionėms automobiliu</li>
  </ul>

  <h2>Pripučiama arba kietą SUP: pagrindiniai skirtumai</h2>
  <table>
    <tr><th>Aspektas</th><th>Pripučiamas SUP</th><th>Kietas SUP (EPS/stiklo pluoštas)</th></tr>
    <tr><td>Pernešamumas</td><td>Telpa į kuprinę</td><td>Reikalauja stogo laikiklio ar didelio automobilio</td></tr>
    <tr><td>Patvarumas</td><td>Atsparus smūgiams, jokių įdubimų</td><td>Gali įtrūkti, įdubti ar išsisluoksniuoti</td></tr>
    <tr><td>Saugojimas</td><td>Telpa į spintą ar automobilio bagažinę</td><td>Reikalauja atskiros saugojimo vietos</td></tr>
    <tr><td>Našumas</td><td>Puikus rekreacijai ir turizmui</td><td>Pranašesnis lenktynėms ir pažangiam bangų slankiojimui</td></tr>
    <tr><td>Draugiškumas pradedantiesiems</td><td>Minkštesnis denis, mažesnė traumų rizika</td><td>Kietas paviršius, mažiau atlaidus</td></tr>
    <tr><td>Paruošimo laikas</td><td>3–5 minutės pūtimo</td><td>Parengtas naudoti</td></tr>
  </table>

  <h2>Kaip išsirinkti tinkamą SUP</h2>
  <p>Rinkdamiesi pripučiamą SUP, atsižvelkite į šiuos veiksnius:</p>
  <ul>
    <li><strong>Tūris (litrai)</strong> — Nulemia plūdrumą. Didesnis tūris palaiko daugiau svorio ir suteikia stabilumą.</li>
    <li><strong>Ilgis</strong> — Ilgesnės lentos (11–14 pėdų) geriau laiko kryptį turizmui; trumpesnės lentos (9–10 pėdų) yra manevringesnės bangų slankiojimui.</li>
    <li><strong>Plotis</strong> — Platesnės lentos (32–36 coliai) stabilesnės; siauresnės lentos (28–31 coliai) greitesnės.</li>
    <li><strong>Storis</strong> — 6 colių lentos suteikia optimalų standumą; 4,7 colių lentos yra lengvesnės ir labiau pernešamos.</li>
    <li><strong>Konstrukcijos kokybė</strong> — Ieškokite suliejimo laminuoto ar audyto „Drop-Stitch" patvarumui.</li>
  </ul>

  <h2>Dažniausiai užduodami klausimai</h2>
  <h3>Ar pripučiamas SUP toks pat standus kaip kietą lenta?</h3>
  <p>Esant tinkamam pūtimui (12–15 PSI), šiuolaikiniai „Drop-Stitch" SUP pasiekia palyginamą standumą rekreaciniam irklavimui. Kietos lentos vis dar turi pranašumą lenktynėms ir pažangiam bangų slankiojimui dėl lengvesnio svorio ir tobulesnių lankstumo savybių.</p>

  <h3>Kiek laiko trunka pripūsti?</h3>
  <p>Su dviejų veiksmų siurbliu dauguma lentų pasiekia 12–15 PSI per 3–5 minutes. Elektriniai siurbliai yra prieinami ir sutrumpina pūtimo laiką iki maždaug 2 minučių.</p>

  <h3>Ar galiu vežti pripučiamą SUP lėktuvu?</h3>
  <p>Taip. Nuleista ir susukta, dauguma SUP telpa į kuprinę, atitinkančią oro linijų registruoto bagažo reikalavimus. Visada pasitikrinkite su savo oro linijomis dėl dydžio ir svorio limitų.</p>

  <h3>Kiek patvarūs yra pripučiami SUP?</h3>
  <p>Pripučiami SUP yra labai patvarūs. Karinės klasės PVC konstrukcija atspari smūgiams, pradūrimams ir UV žalai. Nedideles pradūrimo vietas galima sutvarkyti vietoje su pridedamu remonto rinkiniu.</p>

  <h3>Kokia priežiūra reikalinga?</h3>
  <p>Nuplaukite gėlu vandeniu po naudojimo sūriame vandenyje. Laikykite vėsioje, sausoje vietoje atokiau nuo tiesioginių saulės spindulių. Ilgalaikio saugojimo metu iš dalies pripūskite, kad išlaikytumėte formą nepertempdami siūlių.</p>

meta:
  title: 'Sertifikatai — CE, ISO 9001 ir atitiktis | {SITE}'
  description: 'afarer kokybės sertifikatai: CE (EN ISO 25649), ISO 9001:2015, BSCI. Atitiktis ir sauga pripučiamų SUP gamintojui.'
  keywords:
    - 'ce sertifikavimas sup'
    - 'iso 9001 sup'
    - 'jūrinė atitiktis'
    - 'irklentės sertifikavimas'
hero:
  tagline: 'Sertifikatai ir standartai'
  title: 'Kokybės sertifikatai<br />ir atitikties standartai'
  subtitle: 'afarer SUP gamyba yra sertifikuota pagal tarptautinius jūrinės saugos standartus, kokybės vadybos sistemas ir aplinkosaugos reglamentus — CE, ISO 9001, UKCA, BSCI ir REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'afarer kokybės sertifikatai ir atitikties dokumentacija'
content_certifications:
  tagline: 'Mūsų sertifikatai'
  title: 'Sertifikuota kokybė,<br />pripažinta visame pasaulyje'
  subtitle: 'Kiekvienas afarer produktas yra patvirtintas sertifikatais, įrodančiais mūsų įsipareigojimą kokybei, saugai ir aplinkosaugos atsakomybei.'
  items:
    - title: 'CE sertifikuota'
      description: 'Visi afarer produktai atitinka Europos CE ženklinimo reikalavimus rekreaciniams vandens transporto priemonėms, užtikrinant saugos, sveikatos ir aplinkos apsaugos standartus.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Mūsų kokybės vadybos sistema yra ISO 9001:2015 sertifikuota, apimanti pripučiamų vandens transporto priemonių ir jūrinės įrangos dizainą, gamybą ir platinimą.'
      icon: tabler:clipboard-check
    - title: 'UKCA ženklu pažymėta'
      description: 'Produktai, parduodami JK rinkoje, turi UKCA ženklą, patvirtinantį atitiktį JK reglamentams jūrinei įrangai ir asmeninėms vandens transporto priemonėms.'
      icon: tabler:shield
    - title: 'BSCI atitiktis'
      description: 'afarer yra BSCI (Business Social Compliance Initiative) audituota, įrodanti etišką gamybos praktiką, sąžiningas darbo sąlygas ir tiekimo grandinės atsakomybę.'
      icon: tabler:heart-handshake
    - title: 'REACH atitiktis'
      description: 'Visos medžiagos, naudojamos afarer produktuose, atitinka ES REACH reglamentus dėl cheminės saugos, užtikrinant, kad mūsų PVC, EVA ar komponentuose nėra apribotų medžiagų.'
      icon: tabler:flask
    - title: 'Medžiagų testavimas'
      description: 'Audiniai yra testuojami dėl tempimo stiprio, plyšimo atsparumo, UV gedimo ir šalčio įtrūkimų našumo. Kiekviena gamybos partija yra mėginama ir tikrinama.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Gamyklos standartai'
  title: 'Gamybos meistriškumas<br />— sukurta pagal specifikacijas'
  subtitle: 'Mūsų 12 000 m² įmonė veikia pagal griežtus kokybės kontrolės protokolus kiekvienoje gamybos stadijoje.'
  list:
    - 'Įeinamoji medžiagų patikra: visos žaliavos — PVC audinys, EVA putplastis, klijai, furnitūra — yra tikrinamos pagal specifikacijas prieš patenkant į gamybą.'
    - 'Kokybės kontrolė gamybos metu: kiekviena gamybos stadija turi dokumentuotus QC kontrolinius taškus. Suvirinimo stipris, siūlių suderinimas, vožtuvų montavimas ir furnitūros sukibimas tikrinami eigoje.'
    - 'Slėgio testavimas: kiekviena pripučiama kamera yra slėgio testuojama esant 1,25 karto didesniam nei nominalusis slėgis 24–48 valandas. Slėgio kritimas turi likti žemiau 5 %, kad būtų įvertinta teigiamai.'
    - 'Galutinė patikra: baigti produktai yra tikrinami dėl matmenų tikslumo, kosmetinės apdailos, priedų pilnumo ir pakuotės vientisumo prieš siuntimą.'
    - 'Partijų atsekamumas: kiekvienas produktas turi serijinį numerį, susietą su gamybos partijos įrašais, leidžiantį pilną atsekamumą nuo žaliavos iki baigtų prekių.'
content_safety:
  tagline: 'Jūrinės saugos standartai'
  title: 'Sauga visų pirma<br />— sukurta patikimai eksploatacijai'
  subtitle: 'afarer produktai yra suprojektuoti ir išbandyti, kad atitiktų tarptautinius jūrinės saugos standartus komerciniam ir rekreaciniam naudojimui.'
  items:
    - title: 'EN ISO 25649'
      description: 'Pripučiami SUP atitinka EN ISO 25649 standartus dėl konstrukcijos, stabilumo, plūdrumo ir keliamosios galios.'
      icon: tabler:sailboat
    - title: 'SOLAS atitiktis'
      description: 'Saugos įranga ir gelbėjimo priemonės atitinka SOLAS (Safety of Life at Sea) reikalavimus, kai taikoma.'
      icon: tabler:lifebuoy

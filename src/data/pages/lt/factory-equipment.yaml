meta:
  title: 'Gamyklos įranga — pjaustymas, RF suvirinimas ir spausdinimas | {SITE}'
  description: 'Pramoninės klasės afarer gamybos įranga: PVC pjaustymas, RF suvirinimas, skaitmeninis spausdinimas, surinkimas ir pripučiamų SUP lentų testavimas.'
  keywords:
    - 'sup gamybos įranga'
    - 'pripučiamų sup gamykla'
    - 'rf pvc suvirinimas'
    - 'irklavimo lentų gamyba'
hero:
  tagline: 'Įranga'
  title: 'Gamybos įranga ir mašinos'
  subtitle: 'Pramoninės klasės įranga pjaustymui, suvirinimui, spausdinimui ir surinkimui'
  back_label: 'Grįžti į gamyklą'
  back_link: /factory/

categories:
  - title: 'Pjaustymas ir medžiagų paruošimas'
    items:
      - name: 'Automatinė PVC pjaustymo mašina'
        spec: 'CNC valdoma, 6.5 m × 2.5 m, 0.1 mm tikslumas'
        desc: 'Kompiuteriu valdoma automatinė pjaustymo mašina PVC ir „Drop-Stitch“ audiniams. Įrengimo programinė įranga optimizuoja medžiagų panaudojimą iki mažiau nei 5 % atliekų.'
      - name: 'Audinių klojimo mašina'
        spec: 'Maksimalus plotis 3 m, įtempio valdomas padavimas'
        desc: 'Kloja audinį vienu ar keliais sluoksniais su kontroliuojamu įtempio, kad būtų išvengta deformacijos prieš pjaustymą.'

  - title: 'Balionų suvirinimas ir jungimas'
    items:
      - name: 'Terminio sandarinimo mašina'
        spec: 'Karšto oro suvirinimas, reguliuojama 200–600 °C, 0.5–5 m/min'
        desc: 'Karšto oro terminio sandarinimo mašina PVC ir bortelių siūlėms jungti ir suvirinti. Naudojama balionų kamerų ir plūdžių jungtims kabliuoti, sandarinti ir lieti.'
      - name: 'Dielektrinis RF presas'
        spec: '15 kW, plokštė 2000 × 600 mm'
        desc: 'Radijo dažnio suvirinimo presas pagrindinėms išilginėms siūlėms, bortelių juostoms ir didelių kamerų gamybai.'
      - name: 'CNC valdomas RF suvirintojas'
        spec: '8 kW, XY stalo plotas 2500 × 1200 mm'
        desc: 'Programuojamas kreivinių siūlių suvirinimas sudėtingoms geometrijoms, logotipų reljefams ir precizinėms lopams.'

  - title: 'SUP lentų gamyba'
    items:
      - name: '„Drop-Stitch“ branduolio laminavimo presas'
        spec: 'Didelio formato presas lentų branduoliams iki 14 ft LOA'
        desc: 'Precizinis „Drop-Stitch“ branduolių laminavimas su išoriniais PVC laminatais. Kiekvienas sluoksnis suklijuojamas slėgiu dėl nuoseklios kokybės ir stiprio.'
      - name: 'CNC freza (5 ašių)'
        spec: '3 m × 2 m × 1 m darbinis plotas, vandens aušinamas velenas'
        desc: 'Pelekų dėžučių, rankenų išpjovų ir individualių lentų komponentų apdirbimas.'

  - title: 'SUP spausdinimas ir dekoravimas'
    items:
      - name: 'Skaitmeninis spausdintuvas'
        spec: 'Didelės raiškos rašalinių spausdinimas, iki 2 m pločio'
        desc: 'Tiesioginis ant audinio skaitmeninis spausdinimas visų spalvų SUP denio grafikai. Spausdina individualius raštus, gradientus ir nuotraukų kokybės vaizdus su UV atspariais vandens pagrindo rašalais.'
      - name: 'Šilkografijos mašina'
        spec: 'Rankinė ir pusiau automatinė, daugiaspalvė registracija'
        desc: 'Šilkografija SUP lentų logotipams, prekių ženklų ženklams ir pasikartojantiems raštams. Suteikia patvarius, nepermatomus atspaudus su ryškiu spalvų sodrumu.'

  - title: 'Surinkimas ir įranga'
    items:
      - name: 'Lentų surinkimo stotis'
        spec: 'Modulinė, reguliuojama, daugiasienė išdėstymo'
        desc: 'Pelekų dėžučių, rankenų, D žiedų, vožtuvų ir denio kilimėlių surinkimas ant SUP lentų.'
      - name: 'Vožtuvų montavimo presas'
        spec: 'Pneumatinis, reguliuojamas slėgis'
        desc: 'Precizinis Halkey-Roberts ir Leafield vožtuvų montavimas ir sandarinimas.'
      - name: 'Denio kilimėlio laminatorius'
        spec: '3 m × 1.5 m, temperatūros valdymas'
        desc: 'Terminis EVA putų denio kilimėlių laminavimas prie SUP lentų viršaus su nuosekliu suklijavimo stipriu.'

  - title: 'Testavimas ir kokybės kontrolė'
    items:
      - name: 'Universalus tempimo testeris'
        spec: '50 kN, ASTM D751'
        desc: 'Trūkimo jėgos, trūkimo tempimo ir plėšimosi plitimo testavimas audinių partijoms.'
      - name: 'Oro sulaikymo testavimo stendas'
        spec: 'Programuojamas, 30 min. slėgio laikymas'
        desc: 'Automatizuotas slėgio laikymo testas kiekvienai baliono kameroi prieš surinkimą.'
      - name: 'Siūlių lupimo testeris'
        spec: 'Variklinis 180° lupimas esant 100 mm/min'
        desc: 'Suvirintų ir klijuotų siūlių lupimo stiprio testavimas pagal EN ISO 25649.'
      - name: 'Ksenono lanko atmosferos kamera'
        spec: '2000 h poveikis'
        desc: 'UV atsparumo testavimas spalvos pasikeitimui ir stiprio išlaikymui.'


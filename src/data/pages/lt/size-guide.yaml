how_to_choose:
  title: Kaip pasirinkti tinkamą dydį
  cards:
    - title: SUP lentos
      description: Rinkitės ilgį pagal savo svorį ir numatomą naudojimą. Platesnės lentos (32"+) suteikia daugiau stabilumo. Ilgesnės lentos (11-12 pėdų) geriau laiko kryptį turizmui. Sunkesniems irkluotojams reikalingos didesnės talpos lentos.
    - title: Turizmo SUP lentos
      description: Ilgesnės lentos (11–12 pėdų) geriausiai tinka distancijoms įveikti ir turizmui. Platesnės lentos (32"+) suteikia daugiau stabilumo. Patikrinkite svorio talpą visai apkrovai, įskaitant įrangą.
    - title: Universalios SUP lentos
      description: Rinkitės ilgį pagal raitelio svorį ir numatomą naudojimą. Universalios lentos tinka poilsio pramogoms, fitnesui ir jogai. Mažesnės lentos yra manevringesnės.

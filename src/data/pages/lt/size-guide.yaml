categories:
  inflatable: Pripučiamos SUP lentos, sukurtos mobilumui neaukojant našumo. Parinkite tinkamą dydį pagal savo svorį ir irklavimo stilių.
  sup: Stovimosios irklavimo lentos turizmui, jogai, fitnesui ir poilsio irklavimui. Rinkitės pagal ilgį ir raitelio svorį.

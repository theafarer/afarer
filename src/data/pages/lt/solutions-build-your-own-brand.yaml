meta:
  title: 'Privataus prekės ženklo SUP gamyba ir pasirinktinio prekės ženklo paleidimas | {SITE}'
  description: 'Privataus prekės ženklo SUP gamintojas naujiems irklentės prekės ženklams. Paleiskite savo SUP prekės ženklą su Afarer — visos OEM/ODM paslaugos, įskaitant dizainą, prototipus, pasirinktinį prekės ženklą, gamybą ir pasaulinę logistiką.'

hero:
  tagline: 'Sukurkite savo prekės ženklą'
  title: 'Paleiskite savo<br />SUP prekės ženklą'
  subtitle: 'Jūs turite viziją. Mes turime gamyklą, kompetencijas ir tiekimo grandinę. Privataus prekės ženklo SUP gamyba ir pasirinktinio SUP prekės ženklo kūrimas — kartu sukursime prekės ženklą, kuris išsiskirs.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Pasirinktinio prekės ženklo SUP lenta vandenyje'

process:
  title: 'Jūsų prekės ženklo kelionė'
  subtitle: 'Nuo idėjos iki rinkos per 5 etapus.'
  steps:
    - phase: '1 etapas'
      title: 'Idėja'
      period: '1–2 savaitė'
      items:
        - 'Rinkos tyrimai ir konkurentų analizė'
        - 'Tikslinio kliento apibrėžimas'
        - 'Prekės ženklo pozicionavimo dirbtuvės'
        - 'Produktų linijos strategija'
    - phase: '2 etapas'
      title: 'Dizainas'
      period: '3–6 savaitė'
      items:
        - 'Lentos forma ir grafinis dizainas'
        - 'Spalvų derinimas ir medžiagų parinkimas'
        - 'Priedų specifikacija'
        - 'Pakuotės ir etikečių dizainas'
    - phase: '3 etapas'
      title: 'Prototipas'
      period: '7–10 savaitė'
      items:
        - 'Mėginių gamyba'
        - 'Kokybės testavimas (slėgis, plūdrumas, UV)'
        - 'Dizaino patikslinimai'
        - 'Galutinis patvirtinimas'
    - phase: '4 etapas'
      title: 'Gamyba'
      period: '11–14 savaitė'
      items:
        - 'Masinė gamyba'
        - 'QC patikra (kiekvienam vienetui)'
        - 'Jūrų / oro krovinys'
        - 'Muito išvalymo dokumentai'
    - phase: '5 etapas'
      title: 'Paleidimas'
      period: '15–16 savaitė'
      items:
        - 'Produktų fotografija'
        - 'Svetainės produktų sklaida'
        - 'Rinkodaros medžiagos'
        - 'Paleidimo parama'

packages:
  title: 'Startuolių paketai'
  subtitle: 'Paketai, sukurti kiekvienam prekės ženklo augimo etapui.'
  items:
    - name: 'Pradedantis prekės ženklas'
      tagline: '50–100 vienetų · 2 lentų modeliai'
      features:
        - 'Paprastas logotipų spausdinimas'
        - 'Standartinė pakuotė'
        - 'El. pašto parama'
    - name: 'Augantis prekės ženklas'
      tagline: '300–1 000 vienetų · 3–5 lentų modeliai'
      features:
        - 'Pasirinktinė spalva + logotipas'
        - 'Pasirinktinė pakuotė'
        - 'Produktų nuotraukos'
        - 'Skiriamasis vadybininkas'
    - name: 'Įsitvirtinęs prekės ženklas'
      tagline: '1 000+ vienetų · visa produktų linija'
      features:
        - 'Visiškas pritaikymas'
        - 'Premium pakuotė'
        - 'Rinkodaros medžiagos'
        - 'Prioritetinė gamyba'


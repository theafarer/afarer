intro: 'Kiekviena lenta, išvykstanti iš mūsų dirbtuvių, turi sertifikatą, patvirtinantį, kad ji išlaikė nustatytą kokybės patikrų ir medžiagų testų rinkinį. Mūsų kokybės ir patikros laboratorija yra nepriklausoma padalinio funkcija organizacijoje — ji atsiskaito tiesiogiai generaliniam direktoriui, o ne gamybai — taip užtikrinant, kad joks komercinis spaudimas negali pažeisti patikros barjero. Jei medžiagų partija ar baigta lenta neatitinka paskelbtos specifikacijos, laboratorija turi įgaliojimus sustabdyti siuntimą, kol neatitiktis bus pašalinta.'

content_html: |
  <h2>Pasitikėkite, bet patikrinkite</h2>
  <p>Laboratorija veikia pagal kokybės vadybos sistemą, suderintą su principais, o mūsų testų metodai, kai taikoma, grindžiami ISO, ASTM ir EN standartais. Mes vedame išsamius kiekvieno atlikto testo įrašus, sudarydami visišką atsekamumo grandinę nuo žaliavų gavimo iki galutinio lentos pristatymo.</p>

  <h2>Testavimo įranga ir galimybės</h2>
  <table>
    <thead><tr><th>Įranga</th><th>Atliekami testai</th><th>Standartas / metodas</th></tr></thead>
    <tbody>
      <tr><td>Universalioji bandymų mašina (50 kN)</td><td>Tempimo stipris (audinys), lupimo atsparumas (siūlės), plėšimosi plitimas</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Oro sulaikymo testavimo stendas (programuojamas)</td><td>1000 ciklų pripūtimo/išleidimo ištvermė, 30 min. slėgio laikymo testas</td><td>EN ISO 25649 (vidinis)</td></tr>
      <tr><td>Siūlių lupimo stendas (variklinis 180° lupimas)</td><td>Suvirintų ir klijuotų siūlių lupimo stipris esant 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Hidrostatinio stulpelio testeris</td><td>Audinio atsparumas vandens prasiskverbimui (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Skaitmeninis storio matuoklis ir mikrometras</td><td>Audinio storis, bortelės sienelės storis, klijų plėvelės storis</td><td>ISO 2286-3</td></tr>
      <tr><td>Aplinkos kamera</td><td>Temperatūros kondicionavimas (-40 °C iki +80 °C) šalčio įtrūkimų ir terminio senėjimo testams</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Spalvų spektrofotometras</td><td>Delta-E spalvos matavimas po UV poveikio</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Patikros barjerai — nuo medžiagos iki pristatymo</h2>
  <p>Kiekviena lenta vyksta pagal nustatytą kokybės planą su privalomais patikros taškais. Nė viena lenta negali apeiti barjero; kiekvieną barjerą turi patvirtinti kokybės inspektorius, kad galėtų prasidėti kitas gamybos etapas.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Barjeras 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Įeinančių medžiagų patikra</p>
            <p class="text-xs text-gray-500 mt-1">Audinio partija, klijų partija, furnitūra — viskas tikrinama pagal įeinančių medžiagų specifikaciją prieš išleidžiant į gamybą.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Barjeras 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Gamybos eigos suvirinimo patikra</p>
            <p class="text-xs text-gray-500 mt-1">Pirmasis suvirinimo pavyzdys išbandomas (lupimas + vizuali patikra) kiekvienos gamybos pamainos pradžioje.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Barjeras 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kameros oro testas</p>
            <p class="text-xs text-gray-500 mt-1">Kiekviena kamera slėgiama iki 1.5 x darbinio slėgio, laikoma 30 min. Duomenys registruojami pagal serijinį numerį.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Barjeras 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Priešpristatymo patikra</p>
            <p class="text-xs text-gray-500 mt-1">Tikrinama visa lenta: visi tvirtinimo elementai sugriežtinti, furnitūra veikia, nėra kosmetinių defektų. 100 punktų kontrolinis sąrašas.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Barjeras 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Galutinis sertifikavimas</p>
            <p class="text-xs text-gray-500 mt-1">Testų ataskaitos sudaromos, patikros įrašai peržiūrimi, išduodamas atitikties sertifikatas.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Pagrindiniai kokybės rodikliai (2025 m. slenkamasis vidurkis)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Pirminio išlaikymo rodiklis (audinio partija)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Suvirinimo atmetimo rodiklis (linijinis metras)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Kameros išbandytos oru prieš surinkimą</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">Projektinės kategorijos atitiktis</span>
    </div>
  </div>

  <h2>Mūsų kokybės komanda</h2>
  <p>Laboratorijoje dirba kokybės vadybininkas (10 metų jūrinės kokybės užtikrinimo patirties, ASQ sertifikuotas kokybės inžinierius), du kokybės inspektoriai (kiekvienas su 2 lygio NDT sertifikatu vizualiesiems bandymams) ir medžiagų technikas, atsakingas už visus fizinius bandymus. Komanda kasmet atlieka kompetencijos patikrinimą per nepriklausomą trečiosios šalies teikėją, siekdama užtikrinti, kad mūsų testų rezultatai išliktų tikslūs ir atkartojami.</p>

  <h2>Nepriklausomas testavimas klientams</h2>
  <p>Mūsų kokybės ir patikros laboratorija teikia nepriklausomo testavimo paslaugas. Jei reikia patikrinti audinio specifikaciją, patvirtinti naują klijavimo sistemą ar gauti trečiosios šalies testų ataskaitą pirkimo kvalifikacijai, galime atlikti testus pagal taikomą standartą ir išduoti sertifikuotą testų ataskaitą.</p>
  <p>Naujausių trečiųjų šalių testavimo darbų pavyzdžiai:</p>
  <ul>
    <li>Penkių konkurencinių klijų plėvelės produktų lupimo stiprio palyginimas Europos karinės apginklavimo pirkimo programai.</li>
    <li>Pagreinto senėjimo tyrimas (UV + terminiai ciklai) naujai oranžinio pigmento PVC formuluotei, su reguliariais tarpiniais matavimais kas 500 h.</li>
    <li>Oro sulaikymo patvirtinimas 50 prototipinių pertvarų vožtuvų naujam aukšto slėgio kameros dizainui.</li>
  </ul>

  <h2>Mūsų įsipareigojimas jums</h2>
  <p>Gaudami Afarer lentą, jūs taip pat gaunate jos kokybės dosjė — sudarytą testų rezultatų, taikomų jūsų konkrečiai lentai, įrašą. Audinio partijos sertifikatas, suvirinimo lupimo testai, kamerų oro testų žurnalai ir priešpristatymo patikros kontrolinis sąrašas. Kiekvienas skaičius atsekamas. Kiekvienas inspektorius identifikuojamas. Tai ne tuščias popierių darbas — tai mūsų pažadas, kad tai, ką pristatėme, yra būtent tai, ką nurodėme.</p>
  <p>Jei kils kokybės klausimų, galite susisiekti su laboratorija tiesiogiai — kontaktiniai duomenys yra atspausdinti jūsų atitikties sertifikate. Kiekvieną užklausą vertiname rimtai ir įsipareigojame atlikti oficialų tyrimą per 48 valandas.</p>


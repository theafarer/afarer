philosophy:
  tagline: 'Dizaino filosofija'
  title: 'Inžinerinis dizainas<br />— kiekviena detalė svarbi'
  subtitle: 'Mūsų inžinerinė filosofija paremta trimis principais, kurie vadovauja kiekvienam mūsų kuriamam produktui.'
  list:
    - 'Patikimumas visų pirma: kiekvienas afarer produktas yra testuojamas, kad atlaikytų realaus pasaulio sąlygas — nuo šalto vandens gelbėjimo operacijų iki tropinių kurortų nuomos. Mes per daug sutvirtiname ten, kur tai svarbiausia.'
    - 'Gamybos preciziškumas: mūsų įmonės naudoja CNC pjaustymą, aukšto dažnio suvirinimą ir automatizuotą slėgio testavimą. Kiekviena siūlė, kiekvienas vožtuvas, kiekvienas sutvarkymas atitinka dokumentuotas specifikacijas.'
    - 'Nuolatinės inovacijos: mūsų R&D komanda nuolat vertina naujas medžiagas, gamybos metodus ir dizaino patobulinimus. Mes nelaukiame problemų — mes jų numatome.'
cta:
  title: 'Norite aptarti projektą su mūsų komanda?'

hero:
  tagline: 'Mūsų komanda'
  title: 'Žmonės už afarer<br />— inžinerinė laisvė vandenyje'
  subtitle: 'Įkurta 2012 m. Čingdao, Kinijoje, afarer buvo sukurta jūrų inžinierių, medžiagotyrininkų ir vandens sporto entuziastų, tikėjusių, kad profesionalaus lygio pripučiami vandens transporto priemonės turėtų būti prieinamos visame pasaulyje.'
  image:
    src: /images/team-all.webp
    alt: 'afarer visos komandos nuotrauka — inžinerija, gamyba ir vadovavimas'
founding:
  tagline: 'Mūsų įkūrimas'
  title: 'Nuo pakrantės dirbtuvių<br />iki 12 000 m² įmonės'
  subtitle: 'afarer įkūrė jūrų inžinierių komanda su dešimtmečių bendra patirtimi pripučiamų SUP dizaine, PVC gamyboje ir pasaulinėje jūrinės įrangos gamyboje.'
  items:
    - title: 'Įkurta: 2012'
      description: 'Įsteigta Čingdao, Kinijoje — didelis jūrinis centras su giliu laivų statybos paveldu.'
      icon: tabler:calendar
    - title: '200+ darbuotojų'
      description: 'Įskaitant 50+ R&D inžinierius, kokybės kontrolės specialistus ir gamybos technikus.'
      icon: tabler:users
    - title: '12 000 m² įmonė'
      description: 'Specializuotas gamybos cechas su 6 gamybos linijomis pripučiamoms SUP lentoms.'
      icon: tabler:building-factory
    - title: '50+ aptarnaujamų šalių'
      description: 'Eksportuojame į Europą, Ameriką, Artimuosius Rytus, Azijos ir Ramiojo vandenyno regioną bei Afriką.'
      icon: tabler:globe

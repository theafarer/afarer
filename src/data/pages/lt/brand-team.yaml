meta:
  title: 'Mūsų komanda — jūrų inžinieriai ir kūrėjai | {SITE}'
  description: 'Įkurta 2012 m. Čingdao, afarer buvo sukurta jūrų inžinierių, medžiagotyrininkų ir vandens sporto entuziastų. Susipažinkite su komanda, stovinčia už gamyklos.'
  keywords:
    - 'afarer komanda'
    - 'jūrų inžinieriai'
    - 'pripučiamų sup gamintojas'

content_html: |
  <h2>Kas yra „Drop-Stitch“?</h2>
  <p>„Drop-Stitch“ (dar vadinama „drop-stitch audiniu“ arba „drop-stitch branduoliu“) yra konstrukcijos metodas, kuriame tūkstančiai atskirų poliesterinių siūlų sujungia audinio apvalkalo viršutinį ir apatinį sluoksnius. Kai apvalkalas pripūčiamas, šie siūlai veikia kaip vidiniai tempimo elementai — jie neleidžia viršutinėms ir apatinėms plokštėms išsisklaidyti į apvalią formą ir priverčia plokštę išlikti plokščia ir standi.</p>
  <p>Rezultatas — lengva, pernešama konstrukcija, atlaikanti 15 – 20 PSI vidinį slėgį — palyginama su kietosios lentos standumu, tačiau visiškai išleidžiama orą laikymui ir transportavimui.</p>

  <h2>Kaip tai veikia: fizika</h2>
  <p>Įprastoje pripučiamoje konstrukcijoje (pvz., balione ar čiužinyje) vidinis oro slėgis spaudžia vienodai visomis kryptimis. Be vidinio suvaržymo konstrukcija tampa cilindriška arba sferinė. „Drop-Stitch“ tai išsprendžia įvedant tempimo sutvirtinimą:</p>
  <ul>
    <li>Tūkstančiai siūlų sujungia viršutinius ir apatinius audinio sluoksnius</li>
    <li>Pripūždami oro slėgis bando išstumti viršų ir apačią į šonus</li>
    <li>Siūlai priešinasi šiam išskyrimui, perduodami apkrovą į tempimą išilgai siūlo ašies</li>
    <li>Rezultatas — plokščia, standi plokštė, priešinasi lenkimui</li>
  </ul>

  <h2>Konstrukcijos procesas</h2>
  <ol>
    <li><strong>Audimas:</strong> Poliesteriniai siūlai audžiami vienu metu į du atskirus bazinio audinio sluoksnius (paprastai 1,100 DTEX arba 1,680 DTEX PVC dengtas poliesterys). Siūlai audžiami kilpomis tarp sluoksnių 90&deg; kampu.</li>
    <li><strong>Dengimas:</strong> Austas bazinis audinys padengiamas PVC (arba kartais TPU) naudojant peilio dengimo arba kalendravimo procesą. Tai užsandarina siūlus ir sukuria oro nelaidžią membraną.</li>
    <li><strong>Sluoksnių suklijavimas:</strong> „Drop-Stitch“ branduolys suklijuojamas su išoriniais laminuotais sluoksniais (paprastai 0.9 mm arba 1.2 mm PVC) naudojant terminį laminavimą ar klijus.</li>
    <li><strong>Suvirinimas:</strong> Bortelių juostos suvirinamos išilgai kraštų naudojant karšto oro suvirinimą, RF suvirinimą arba aukšto dažnio suvirinimą, sukuriant lentos šonines sienas.</li>
    <li><strong>Vožtuvų montavimas:</strong> Montuojami Boston arba Halkey-Roberts vožtuvai, paprastai su slėgio atlaisvinimo mechanizmu, kad būtų išvengta per didelio pripūtimo.</li>
  </ol>

  <h2>Pagrindiniai kokybės rodikliai</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parametras</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Pradinis lygis</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Siūlų tankis</td><td class="p-3 border">1 siūlas / kv. in</td><td class="p-3 border">2 siūlai / kv. in</td></tr>
      <tr><td class="p-3 border">Bazinis audinys</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Didžiausias slėgis</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC storis</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Bortelių konstrukcija</td><td class="p-3 border">Sulenkta ir suklijuota</td><td class="p-3 border">Suvirinta ir suliejimo būdu sujungta</td></tr>
    </tbody>
  </table>

  <h2>Taikymai</h2>
  <ul>
    <li><strong>SUP lentos:</strong> 4" – 6" storis, 15 – 20 PSI, 1 – 2 siūlai/kv. in</li>
    <li><strong>Baidarės:</strong> „Drop-Stitch“ dugnas + pripučiamos šoninės kameros, 10 – 15 PSI dugnui</li>
  </ul>

  <h2>„Drop-Stitch“ ir oro denis (stiklo pluošto arba medinis branduolys)</h2>
  <p>Kietosios lentos naudoja EPS putų branduolius su stiklo pluošto arba mediniais stringerių sutvirtinimais. Jos yra lengvesnės, standesnės ir reaktyvesnės — tačiau jų negalima išleisti iš oro. „Drop-Stitch“ mainais už dalį standumo suteikia visišką pernešamumą. Daugumai poilsio vartotojų šiuolaikinės 20 PSI „Drop-Stitch“ SUP lentos pagal standumą beveik nesiskiria nuo pradinio lygio kietųjų lentų.</p>

  <h2>Kaip Afarer naudoja „Drop-Stitch“</h2>
  <p>Afarer visame SUP asortimente naudoja 1,680 DTEX „Drop-Stitch“ branduolį su 2 siūlais kvadratiniam coliui ir 1.2 mm PVC išoriniu laminatu. Lentos yra skirtos 20 PSI ir prieš siuntimą atlieka 24–48 valandų slėgio laikymo testą esant 1.25x nominaliam slėgiui. Bortelių juostos suvirinamos karštu oru su trigubu sluoksnių suliejimu, o slėgio atlaisvinimo vožtuvai yra standartiniai visuose modeliuose.</p>


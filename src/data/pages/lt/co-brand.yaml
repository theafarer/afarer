faqs:
  title: 'Bendras prekės ženklas — DUK'
  subtitle: 'Kaip veikia Afarer bendro prekės ženklo modelis ir kuo jis skiriasi nuo OEM ir privataus ženklo.'
  items:
    - title: 'Ar bendras prekės ženklas yra tas pats kaip OEM ar privatus ženklas?'
      description: 'Ne. Afarer nebevykdo atviros OEM/privataus ženklo programos. Bendro prekės ženklo produktai išlieka Afarer produktais — projektuojami, kuriami, kokybiškai tikrinami ir palaikomi Afarer prekės ženklo. Jūsų tapatybė atsiranda kaip bendras prekės ženklas, o ne kaip be ženklo trečiosios šalies produktas.'
    - title: 'Kas gali pradėti bendro prekės ženklo projektą?'
      description: 'Kvalifikuotos vandens sporto įmonės: esami šalių partneriai, irklavimo klubai, kurortai ir viešbučiai, renginių organizatoriai ir bendruomenės. Atsiųskite mums projekto aprašymą, o mes patvirtinsime tinkamumą prieš prasidedant dizaino darbams.'
    - title: 'Ar bendras prekės ženklas nesuderinamas su mano šalies platintoju?'
      description: 'Ne. Vienos šalies — vieno platintojo modelis turi pirmenybę. Bendro prekės ženklo kolekcijos koordinuojamos su vietiniu šalies partneriu, jei toks yra, todėl apsaugotoje teritorijoje neatsiranda joks lygiagretus ar konkuruojantis prekės ženklas.'
    - title: 'Koks yra mažiausias bendro prekės ženklo kolekcijos užsakymas?'
      description: 'Bandomosios kolekcijos prasideda nuo 30–50 vienetų. Standartinės kolekcijos — 50–100 vienetų; dideli ar kelių regionų leidiniai — 100+ vienetų. Individualios plėtros terminai suderinami pagal projektą.'
    - title: 'Kas sudaro Afarer kokybę, o kas partnerio indėlį?'
      description: 'Afarer priklauso produkto dizainas, inžinerija, medžiagos, konstrukcija, kokybės kontrolė ir garantija. Partneriai prisideda prie kolekcijos koncepcijos, pavadinimų, spalvų, grafikos ir rinkodaros. Tai palaiko vieną kokybės standartą vandenyje.'
    - title: 'Kaip pateikti paraišką?'
      description: 'Užpildykite bendro prekės ženklo užklausos formą su jūsų įmone, rinka ir kolekcijos idėja. Mes peržiūrėsime atitikimą ir per 3 darbo dienas atsakysime su pasiūlymu ir Bendro prekės ženklo projekto sutartimi.'

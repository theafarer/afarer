      revenue: 'XX XXX USD/metus'
    - label: 'Vidutinio dydžio verslas'
      boards: '30–50'
      revenue: 'XX XXX USD/metus'
    - label: 'Didelė paplūdimio nuoma'
      boards: '50–100'
      revenue: 'XXX XXX USD/metus'

cta:

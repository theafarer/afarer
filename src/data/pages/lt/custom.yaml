meta:
  title: 'Pritaikymo laboratorija — pasirinktinės pripučiamos irklentės | {SITE}'
  description: 'Pasirinktinės pripučiamos irklentės: individualus dizainas, logotipas, pasirinktinė formelė ir gamyba. Privataus prekės ženklo SUP partneris, MOQ 50 vienetų, CE sertifikuota.'
  keywords:
    - 'pasirinktinių irklentių gamintojas'
    - 'pasirinktinis pripučiamas sup'
    - 'irklentė su logotipu'
    - 'privatus prekės ženklas pripučiamam sup'
    - 'irklentės gamyba'
hero:
  tagline: 'afarer pritaikymo laboratorija'
  title: 'Sukurkite savo<br />SUP lentą'
  subtitle: 'Pasirinktinio SUP partneris, siūlantis bendrą prekės ženklą, privatų prekės ženklą ir individualią irklentės gamybą verslams visame pasaulyje. Nuo vieno prototipo iki pilnų gamybos serijų.'
  cta: 'Pradėkite savo projektą'
  footer_link: /contact

steps_section:
  tagline: 'Kaip tai veikia'
  title: 'Nuo koncepcijos iki gamybos'
  subtitle: 'Keturi žingsniai nuo jūsų idėjos iki baigto, jūrai paruošto produkto.'
  steps:
    - num: '01'
      title: 'Pasirinkite savo lentą'
      desc: 'Pasirinkite iš mūsų pagrindinių SUP modelių — universalus, turizmo, joga, sporto ar vaikų. Pasirinkite dydį, medžiagą ir spalvą.'
    - num: '02'
      title: 'Įkelkite savo dizainą'
      desc: 'Atsiųskite mums savo logotipą, dizainą ar prekės ženklo gaires. Mūsų dizaino komanda paruoš skaitmeninį maketą.'
    - num: '03'
      title: 'AI maketo peržiūra'
      desc: 'Peržiūrėkite fotorealistinį AI sugeneruotą maketą jūsų pasirinktinei lentai prieš gamybos pradžią.'
    - num: '04'
      title: 'Gamyba ir pristatymas'
      desc: 'Patvirtinus, jūsų užsakymas patenka į mūsų gamybos liniją. Terminai nuo 30 dienų.'

services_section:
  tagline: 'Paslaugos'
  title: 'Gamybos paslaugos pasauliniams prekės ženklams'
  subtitle: 'Lankstūs bendradarbiavimo modeliai — nuo sutartinės gamybos iki visapusiško prekės ženklo kūrimo.'
  items:
    - title: 'Bendra prekės ženklo gamyba'
      desc: 'Mes gaminame jūsų dizainus pagal specifikacijas — jūsų intelektinė nuosavybė, jūsų brėžiniai, jūsų kokybės standartai. Pilna NDA apsauga.'
      icon: '⚙️'
    - title: 'Dizaino sprendimai'
      desc: 'Pasirinkite iš 50+ įrodytų platformų ir pritaikykite dydį, spalvą, grafiką ir pakuotę.'
      icon: '🎨'
    - title: 'Privatus prekės ženklas'
      desc: 'Jūsų prekės ženklas ant mūsų produktų — logotipas, pakuotė, kabinamos etiketės, vadovai. Paruošta mažmeninei prekybai iškart iš dėžės.'
      icon: '🎨'
    - title: 'Pasirinktinis prekės ženklas'
      desc: 'Denio kilimėlio spausdinimas, korpuso grafika, vamzdelio lipdukai ir pasirinktinės etiketės — pilna prekės ženklo integracija.'
      icon: '⚙️'

capabilities_section:
  tagline: 'Galimybės'
  title: 'Gamybos ir pritaikymo galimybės'
  subtitle: 'Viskas, ką reikia žinoti prieš pateikiant užsakymą.'
  capabilities:
    - label: 'Užsakymo kiekis'
      value: 'MOQ 50 vienetų (SUP)'
    - label: 'Terminas'
      value: '30–45 dienos standartinis; 15–20 dienų prototipams'
    - label: 'Pritaikymas'
      value: 'Dydis, forma, spalva, grafika, pakuotė, furnitūra'
    - label: 'Medžiagos'
      value: 'PVC, „Drop-Stitch", EVA, aliuminis'
    - label: 'Spausdinimas'
      value: 'Skaitmeninis (CMYK), šilkografija, terminis perkėlimas, sublimacija'
    - label: 'Sertifikavimas'
      value: 'CE, UKCA, FCC (parama pasaulinei atitikčiai)'


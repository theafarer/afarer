workshops_section:
  tagline: 'Cechai'
  title: 'Gamybos cechai'
  workshops:
    - title: 'PVC pjaustymas ir medžiagų paruošimas'
      description: 'Automatinės CNC pjaustymo mašinos apdoroja PVC ir „Drop-Stitch" audinius milimetro dalies tikslumu. Kompiuteriu optimizuotas išdėstymas minimizuoja medžiagų atliekas ir užtikrina, kad kiekvienas skydas atitiktų savo matmenų specifikaciją prieš suvirinimą.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Vamzdelių suvirinimas ir terminis sandarinimas'
      description: 'Atskiras suvirinimo cechas su terminio sandarinimo mašinomis ir RF dielektriniais presais. Karšto oro terminiai sandarintuvai jungia ir sulieja PVC vamzdelių kameras, o RF suvirinimas sukuria didelio stiprumo oro nepraleidžiančias siūles, viršijančias EN ISO 25649 reikalavimus.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'FRP formelės ir kompozicinių medžiagų gamyba'
      description: 'Pasirinktinės FRP formelės SUP komponentams, gaminamos naudojant rankinį stiklo pluošto klojimą su poliestro ir vinilesterinės dervos sistemomis. Kiekvienas sluoksnis rankomis iškočiojamas ir vakuumuojamas nuosekliai kokybei. Gelio sluoksnio dažymo kabina suteikia blizgų, UV atsparų jūrinį paviršių.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'SUP spausdinimas ir dekoravimas'
      description: 'SUP lentos dekoruojamos naudojant skaitmeninį spausdinimą visos spalvų paletės grafikai ir šilkografiją logotipams bei pasikartojantiems raštams. Skaitmeniniai spausdintuvai kuria foto kokybės denio dizainus, o šilkografija suteikia patvarius, ryškius prekės ženklų ženklus.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Galutinis surinkimas ir aprūpinimas'
      description: 'Surinkimo linija, kurioje „Drop-Stitch" branduoliai užbaigiami bortais, EVA deniai klijuojami, o pelekai, vožtuvai ir priedai montuojami. Kiekviena lenta seka 100 punktų surinkimo kontrolinį sąrašą, kurį patvirtina komandos vadovas.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Kokybės testavimas ir patikra'
      description: 'Kiekviena baigta lenta privalomai atlieka oro sulaikymo testavimą, siūlių atplyšimo patikrą ir visų sistemų patikrą prieš siuntimą. Mūsų kokybės laboratorija veikia nepriklausomai nuo gamybos ir atsiskaito tiesiogiai vadovybei.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


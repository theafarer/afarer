qc_section:
  tagline: 'Kokybės kontrolė'
  title: 'Testavimo ir kokybės užtikrinimo procesas'
  subtitle: 'Kiekviena lenta privalomai testuojama prieš siuntimą. Mūsų kokybės laboratorija veikia nepriklausomai nuo gamybos ir atsiskaito tiesiogiai vadovybei.'
  steps:
    - step: '1'
      title: 'Žaliavų patikra'
      desc: 'PVC ir „Drop-Stitch" audiniai atlieka tempimo testavimą (ASTM D751), plyšimo plitimo ir UV atsparumo patikrą, kol bet kuri partija patenka į gamybą.'
    - step: '2'
      title: '24–48 valandų oro sulaikymo testas'
      desc: 'Kiekviena vamzdelio kamera pučiama iki 125 % nominalaus slėgio ir išlaikoma 24–48 valandas. Slėgio kritimas, viršijantis 5 %, automatiškai sukelia atmetimą ir siūlių pakartotinę patikrą.'
    - step: '3'
      title: 'Apkrovos ir balanso testavimas'
      desc: 'Baigtos lentos apkraunamos iki didžiausios nominalios galios ir testuojamos stabilumui ir standumui. Kiekviena lenta bandoma vandenyje prieš galutinę patikrą.'

oem_section:
  tagline: 'OEM projektai'
  title: 'Prekės ženklų ir OEM partnerystės atvejų analizė'
  subtitle: 'Nuo koncepcijos iki konteinerio — kaip mes padedame pasauliniams prekės ženklams paleisti ir plėsti jų pripučiamų SUP linijas.'
  cases:
    - challenge: 'Europos lauko prekybos mažmenininkui reikėjo privataus prekės ženklo SUP linijos su unikalia denio grafika, ekologišku PVC ir prekybai paruošta pakuote — viską pristatyti per 60 dienų.'
      solution: 'Sukūrėme pasirinktinius skaitmeninio spausdinimo failus, įsigijome REACH atitinkantį PVC ir sutrumpinome modeliavimą nuo 3 etapų iki 1, dizaino komandą apgyvendinę šalia mūsų Čingdao gamyklos.'
      result: '55 dienos nuo pasirašyto PO iki FOB. 2 400 vienetų 4 SKU. Pakartotinis užsakymas pateiktas dar prieš atvykstant pirmajam konteineriui.'
    - challenge: 'JAV vandens sporto startuoliui reikėjo didelio našumo „Drop-Stitch" SUP su pasirinktine forma, bendros prekės ženklo pakuote ir BSCI sertifikatu mažmeninės prekybos vietai.'
      solution: 'Pritaikėme esamą SUP formelę su pakeista kontūro linija, sukūrėme bendros prekės ženklo pakuotės dizainą ir pateikėme visą BSCI audito dokumentaciją.'
      result: 'Sėkmingai įtraukta į 3 didžiausias JAV lauko prekybos grandines. 5 000+ vienetų per pirmuosius metus su 98 % realizacijos rodikliu.'
    - challenge: 'Australijos platintojui reikėjo CE sertifikuotos SUP linijos su pasirinktinėmis spalvomis ir atitiktimi Australijos standartams.'
      solution: 'Pagaminome priešgamybinius pavyzdžius su 4 spalvų variantais ir koordinavome trečiosios šalies atitikties testavimą.'
      result: '3 modelių SUP linija pristatyta AU/NZ rinkoje. Vėliau laimėtas valstybės konkursas 12 patrulių SUP.'

faq_section:
  tagline: 'DUK'
  title: 'B2B ir OEM dažniausiai užduodami klausimai'
  questions:
    - q: 'Koks yra minimalus užsakymo kiekis (MOQ) OEM pripučiamoms SUP lentoms?'
      a: 'MOQ prasideda nuo 5–10 vienetų standartiniams OEM modeliams. Pasirinktinės formelės ir privataus prekės ženklo projektams reikia mažiausiai 200 vienetų, priklausomai nuo sudėtingumo. Bandomieji užsakymai ir modelių serijos prieinami naujiems prekės ženklams paleisti.'
    - q: 'Ar afarer turi BSCI sertifikatą?'
      a: 'Taip. Mūsų gamykla palaiko galiojantį BSCI socialinės atitikties sertifikatą (audito ataskaita prieinama pareikalavus). Taip pat turime ISO 9001 kokybės vadybai, o visi produktai turi CE sertifikatą. REACH ir RoHS atitikties dokumentacija piteikiama su kiekviena OEM siunta.'
    - q: 'Koks yra įprastas OEM užsakymo pagaminimo terminas?'
      a: 'Standartinis terminas yra 30–45 dienos nuo patvirtinto PO ir avanso masinei OEM gamybai. Pasirinktinės formelės kūrimas prideda 15–20 dienų įrankių gamybai. Pagreitinta gamyba prieinama skubiems užsakymams ir sezoninėms piko bangoms. Prototipai paprastai siunčiami per 15–20 dienų.'
    - q: 'Ar galite siųsti FOB Čingdao arba CIF į mūsų uostą?'
      a: 'Taip. Siunčiame FOB Čingdao, CIF į didelius pasaulio uostus ir DDP kvalifikuotiems partneriams. Mūsų logistikos komanda valdo konteinerių rezervavimą, eksporto dokumentaciją ir muito išvalymą. Siunčiame į 50+ šalių ES, JAV, AU ir Azijos rinkose.'

b2b_moq: 'Standartinis MOQ: 5–10 vienetų vienam modeliui. Bandomieji užsakymai laukiami naujoms partnerystėms.'

production_flow:
  tagline: 'Gamybos eiga'
  title: 'Nuo medžiagos iki baigtos lentos'
  subtitle: 'Kiekviena lenta praeina 6 gamybos etapus su QC kontroliniais taškais kiekviename žingsnyje. Jokių trumpinių, jokių praleistų patikrų.'
  stages:
    - stage: '01'
      title: 'Medžiagų gavimas ir įeinamoji kontrolė'
      description: 'Visos gaunamos medžiagos užregistruojamos pagal partijos numerį mūsų ERP sistemoje. PVC audinio rulonai, „Drop-Stitch" branduoliai, vožtuvai, klijai ir furnitūra sulaikomi iki QC patvirtinimo.'
      qc_check: 'Tempimo stipris (ASTM D751), plyšimo atsparumas (ISO 4674), storio matuoklis, klijų klampa, vizualinis defektų skenavimas'
      qc_threshold: '100 % partijų testuojama. Atmesti, jei tempimas < 90 % specifikacijos, plyšimas < mažiausios specifikacijos arba bet koks vizualinis defektas'
      responsibility: 'Įeinamosios QC komanda (3 inspektoriai)'
    - stage: '02'
      title: 'CNC pjaustymas ir medžiagų paruošimas'
      description: 'Kompiuteriu optimizuotas išdėstymas talpina skydus PVC atsargose, kad būtų sumažintos atliekos. Automatinės CNC pjaustymo mašinos palaiko 0,1 mm pozicinį tikslumą.'
      qc_check: 'Matmenų patikra pagal CAD DXF failus, briaunų kokybės patikra, skydų skaičiaus verifikavimas'
      qc_threshold: 'Kiekvienas 20-tas skydas išmatuojamas. Tolerancija ±0,5 mm. Atmesti partiją, jei >2 % viršija toleranciją'
      responsibility: 'Pjaustymo cecho vadovas'
    - stage: '03'
      title: 'Suvirinimas ir „Drop-Stitch" suklijavimas'
      description: '„Drop-Stitch" branduoliai suklijuojami su išoriniais PVC laminatais naudojant terminį laminavimą. Vamzdelių kameros suvirinamos RF arba karšto oro būdu. Bortų juostos suliejamos trisluoksnės.'
      qc_check: 'Atplyšimo testas kas 50 vienetų (ASTM D751), suvirinimo pločio matavimas, karšto oro temperatūros žurnalo peržiūra, vizualinė siūlių patikra prieblandoje'
      qc_threshold: 'Atplyšimo stipris mažiausiai 8 N/cm. Suvirinimo pločio tolerancija ±1 mm. Bet koks matomas kanalas = atmetimas'
      responsibility: 'Suvirinimo QC (2 inspektoriai pamainoje)'
    - stage: '04'
      title: 'Surinkimas ir aprūpinimas'
      description: 'Lentos keliauja į galutinį surinkimą, kur visi komponentai sujungiami: bortai klijuojami ir suvirinami, vožtuvai montuojami, D žiedai, rankenos, peleko dėžutės ir nešiojimo maišų tvirtinimas. Kiekvienas vienetas seka 100 punktų surinkimo kontrolinį sąrašą.'
      qc_check: '100 punktų sąrašo patvirtinimas kiekvienam vienetui, vožtuvo funkcijos testas (10 atidarymo/uždarymo ciklų), furnitūros sukibimo verifikavimas, vizualinė patikra'
      qc_threshold: 'Nulio defektų politika saugai kritiškiems elementams (vožtuvai, D žiedai, rankenos). Nedideli kosmetiniai: AQL 2,5 (ISO 2859)'
      responsibility: 'Surinkimo komandos vadovas + linijos QC'
    - stage: '05'
      title: 'Slėgio testavimas ir kokybės sulaikymas'
      description: 'Kiekviena kamera pučiama iki 1,25 karto nominalaus slėgio (paprastai 20–25 PSI) ir išlaikoma 24–48 valandas. Slėgio davikliai registruoja nuolat. Kameros, kurių slėgio kritimas viršija 5 %, atmetamos ir siunčiamos siūlių pakartotinei patikrai.'
      qc_check: '24–48 val. slėgio išlaikymo žurnalas, daviklių kalibravimas tikrinamas kasdien, temperatūros kompensuojamas slėgio rodmuo, siūlių pakartotinis testas po remonto'
      qc_threshold: 'Maksimalus 5 % slėgio kritimas per 24–48 val. esant stabiliai temperatūrai. Bet kuri kamera, viršijanti šį rodiklį = 100 % visos gamybos partijos pakartotinis testas'
      responsibility: 'Kokybės laboratorija (nepriklausoma nuo gamybos, atsiskaito vadovybei)'
    - stage: '06'
      title: 'Galutinė patikra ir pakavimas'
      description: 'Galutinė vizualinė ir funkcinė patikra. Paviršiaus defektai, spalvų pastovumas, etikečių/BIN verifikavimas, pakuotės vientisumas ir priedų pilnumas. Vienetai vakuumuojami, dėžuojami ir kraunami ant padėklų konteinerio pakrovimui.'
      qc_check: 'Pilna vizualinė patikra, priedų sąrašas pagal SKU, pakuotės metimo testas (1 m, atsitiktinė imtis), etikečių/brūkšninių kodų skenavimo verifikavimas'
      qc_threshold: 'AQL 2,5 dideliems defektams, AQL 4,0 nedideliems. Nulinė tolerancija saugos defektams. 100 % vienetų vizualiai tikrinama'
      responsibility: 'Galutinės QC komanda (4 inspektoriai) + Pakavimo komandos vadovas'


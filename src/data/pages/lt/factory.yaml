  title: 'Gamykla ir gamyba'
  subtitle: '12 000 m² integruotos gamybos — nuo žaliavos iki baigtos lentos'

intro:
  - 'Kaip **Aquafarer LLC (JAV)** gamybos padalinys, afarer Čingdao operacijų komanda kontroliuoja kiekvieną gamybos etapą — nuo PVC ir stiklo pluošto žaliavų gavimo iki galutinio baigtos lentos pristatymo patikrinimo. Mūsų gamybos įmonė Čingdao ekonominio vystymo zonoje užima 12 000 kvadratinių metrų ir talpina atskirus cechus PVC pjaustymui, vamzdelių terminiam suvirinimui, FRP formelių gamybai, SUP skaitmeniniam spausdinimui, galutiniam surinkimui ir kokybės testavimui.'
  - 'Integruodami dizainą, inžineriją, prototipų gamybą, gamybą ir testavimą po vienu stogu, mes pašaliname sutartinės gamybos neefektyvumą ir išlaikome tiesioginę kontrolę surinkimo kokybei, medžiagų pasirinkimui ir pristatymo terminams. Kiekviena lenta, paliekanti mūsų cechą, yra pagaminta mūsų žmonių, mūsų įranga, pagal mūsų standartus.'


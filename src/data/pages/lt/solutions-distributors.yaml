  tagline: 'Platintojai'
  title: 'Prisijunkite prie mūsų pasaulinio<br />platinimo tinklo'
  subtitle: 'SUP didmenų platinimo partnerystės programa su išskirtinėmis teritorijomis, visu pripučiamų SUP produktų portfeliu ir pasaulinio lygio parama. Afarer siunčia į 50+ šalių — ieškome įsitvirtinusių jūrinės ir vandens sporto prekių platintojų.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Afarer pasaulinis platinimas ir siuntimo operacijos'


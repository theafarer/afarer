meta:
  title: 'Akademija — SUP vadovai ir irklavimo mokymai | {SITE}'
  description: 'afarer Akademija: pripučiamų irklentių vadovai, stovėjimo irklente technika, jūrinė sauga ir medžiagų žinios pradedantiesiems ir profesionalams.'
  keywords:
    - 'mokykitės stovėjimo irklente'
    - 'sup pradedančiųjų vadovas'
    - 'irklentės pagrindai'
    - 'sup technika'
    - 'sup pamokos'
hero:
  tagline: 'afarer Akademija'
  title: 'Mokymų centras'
  subtitle: 'Vadovai ir instrukcijos kiekvienam įgūdžių lygiui — nuo SUP pagrindų iki pažangių gelbėjimo technikų'

categories:
  - level: 'Pradedantysis'
    color: 'from-green-500 to-emerald-600'
    badge: 'bg-green-100 text-green-700'
    guides:
      - title: 'SUP pagrindai'
        desc: 'Išmokite stovėjimo irklente pagrindų — pozicija, irklo technika ir pusiausvyra.'
        slug: beginner-sup-guide
      - title: 'Irklo technikos'
        desc: 'Pirmyn trauktukas, apžingsnis, trauktukas į šoną ir žemas atraminis mostas — įvaldykite pagrindinius irklo judesius.'
        slug: sup-paddle-guide
      - title: 'Sauga visų pirma'
        desc: 'Esminės saugos praktikos, įskaitant orų patikrą, gelbėjimo liemenės naudojimą, pavadžio taisykles ir savisaugą.'
        slug: sup-safety-guide
  - level: 'Vidutinis'
    color: 'from-blue-500 to-indigo-600'
    badge: 'bg-blue-100 text-blue-700'
    guides:
      - title: 'Turizmo esmė'
        desc: 'Kelių valandų irklavimo planavimas — navigacija, hidratacija, tempas ir vėjo prognozių skaitymas.'
        slug: touring-sup-guide
      - title: 'Orų skaitymas'
        desc: 'Interpretyuokite jūrines prognozes, atpažinkite debesų raštus ir supraskite vėjo poveikį vandeniui.'
        slug: weather-planning-water-sports
      - title: 'Navigacijos pagrindai'
        desc: 'Jūrlapių skaitymas, kompaso naudojimas, GPS taškai ir maršruto planavimas pakrančių irklavimui.'
        slug: sup-navigation-guide
      - title: 'Potvynių supratimas'
        desc: 'Supraskite potvynių ir atoslūgių ciklus, sroves ir jų poveikį išplaukimo laikui ir maršrutams.'
        slug: understanding-tides
  - level: 'Pažengęs'
    color: 'from-purple-500 to-violet-600'
    badge: 'bg-purple-100 text-purple-700'
    guides:
      - title: 'Kelių dienų kelionių planavimas'
        desc: 'Ekspedicijų logistika — įrangos pasirinkimas, maisto planavimas, saugos protokolai ir pagalbos kontaktai.'
        slug: sup-travel-guide
      - title: 'Gelbėjimo technikos'
        desc: 'Savisauga, T gelbėjimas ir buksiavimo protokolai atviroje jūroje.'
        slug: sup-self-rescue
      - title: 'Naktinis irklavimas'
        desc: 'Navigacija tamsoje — apšvietimo reikalavimai, maršruto atmintis, grupės komunikacija ir pavojų suvokimas.'
        slug: ocean-safety-basics
  - level: 'Priežiūra'
    color: 'from-amber-500 to-orange-600'
    badge: 'bg-amber-100 text-amber-700'
    guides:
      - title: 'Valymas ir priežiūra'
        desc: 'Skalavimas gėlu vandeniu, UV apsauga, pelėsių prevencija ir tinkamas džiovinimas po kiekvienos sesijos.'
        slug: inflatable-sup-maintenance
      - title: 'Saugojimo vadovas'
        desc: 'Geriausios pripučiamų SUP lentų saugojimo praktikos — nuleidimas, lankstymas, temperatūros kontrolė ir galiojimo laikas.'
        slug: inflatable-sup-storage
      - title: 'Remonto pagrindai'
        desc: 'Sutvarkykite smulkias pradūrimo vietas, siūlių nuotėkius ir vožtuvų problemas su PVC remonto rinkiniais ir lopų technikomis.'
        slug: inflatable-sup-repair
      - title: 'Vožtuvų priežiūra'
        desc: 'Atpažinkite vožtuvų tipus (Halkey-Roberts, Boston, Leafield), išvalykite šiukšles ir pakeiskite sugedusias dalis.'
        slug: sup-pump-guide

knowledge_center_tagline: 'Žinių centras'
knowledge_center_title: 'Jūrinės įrangos ir pramonės vadovai'
knowledge_center_subtitle: 'Ekspertų žinios ir pirkimo vadovai jūrininkams profesionalams, parko operatoriams ir vandens sporto entuziastams.'

knowledge_sections:
  - title: 'SUP lentų žinios'
    tagline: 'Stovėjimo irklente vadovai'
    desc: 'Viskas apie SUP lentas — lentų dizainas, medžiagos, dydžių parinkimas, priežiūra ir pirkimo patarimai rekreaciniam ir komerciniam naudojimui.'
    guides:
      - title: 'Kaip išsirinkti tinkamą SUP lentą'
        desc: 'Išsamus SUP pasirinkimo vadovas — dydis, tūris, medžiaga, forma ir numatyta paskirtis.'
        href: '/learn/sup/'
      - title: 'Pripučiama arba kietą SUP'
        desc: 'Pripučiama SUP prieš kietą epoksidinę lentą — pernešamumas, patvarumas, našumas ir vertė.'
        href: '/compare/inflatable-vs-hardboard/'
      - title: 'Universalus, turizmo ar joga SUP'
        desc: 'Skirtingi SUP lentų tipai — konstrukcijos standartai, formos, dydžiai ir rekomenduojami naudojimo būdai.'
        href: '/learn/sup/'
      - title: '„Drop-Stitch" arba tradicinė konstrukcija'
        desc: 'Palyginkite „Drop-Stitch" ir tradicinę SUP lentų konstrukciją pagal svorį, kainą, patvarumą ir standumą.'
        href: '/learn/drop-stitch-core/'
  - title: 'Pripučiamų SUP vadovas'
    tagline: 'Pripučiamų SUP žinios'
    desc: 'Išsamūs vadovai apie pripučiamus SUP — PVC medžiagos, „Drop-Stitch" konstrukcija, saugos standartai ir priežiūros geriausios praktikos.'
    guides:
      - title: 'PVC medžiagų vadovas'
        desc: 'Galutinis PVC medžiagų, naudojamų pripučiamų SUP lentų konstrukcijoje, vadovas.'
        href: '/learn/materials/'
      - title: 'Kaip gaminami pripučiami SUP'
        desc: 'Gamybos procesas — medžiagų pjaustymas, „Drop-Stitch" branduolio suklijavimas, siūlių konstrukcija, slėgio testavimas ir kokybės kontrolė.'
        href: '/learn/inflatable-technology/'
      - title: 'SUP saugos vadovas'
        desc: 'Saugos standartai, keliamoji galia, tinkamas pripūtimas, patikros prieš išvykstant ir procedūros avarinėms situacijoms.'
        href: '/learn/water-safety/'
      - title: 'SUP priežiūra'
        desc: 'Pripučiamų SUP lentų valymas, saugojimas, UV apsauga ir remontas.'
        href: '/v2/inflatable-sup-maintenance/'
  - title: 'SUP lentų žinios'
    tagline: 'SUP lentų centras'
    desc: 'Techniniai vadovai, apimantys SUP lentų tipus, medžiagas, konstrukcijos metodus, priežiūrą ir saugą.'
    guides:
      - title: 'SUP lentų tipai'
        desc: 'Universalios, turizmo, joga, sporto ir vaikų SUP — sužinokite skirtumus ir išsirinkite tinkamą.'
        href: '/learn/sup/'
      - title: '„Drop-Stitch" technologija'
        desc: 'Kaip tūkstančiai vidinių siūlų kuria standžias, aukšto slėgio pripučiamas struktūras.'
        href: '/learn/drop-stitch-core/'
      - title: 'Medžiagų vadovas'
        desc: 'PVC denjero reitingai, audinių svoriai, UV atsparumas ir jūrinės kokybės medžiagos paaiškintos.'
        href: '/learn/materials/'
      - title: 'SUP pirkimo vadovas'
        desc: 'Palyginkite skirtingus SUP lentų tipus įvairioms paskirtims ir įgūdžių lygiams.'
        href: '/learn/sup/'
  - title: 'SUP žinios'
    tagline: 'Stovėjimo irklente vadovai'
    desc: 'Viskas apie SUP lentas — pripučiama arba standi, lentų matmenys, medžiagų technologijos ir ekspertų patarimai visiems įgūdžių lygiams.'
    guides:
      - title: 'Pripučiama arba kietą SUP'
        desc: 'Palyginkite iSUP ir kietas epoksidines lentas pagal pernešamumą, patvarumą, našumą ir vertę.'
        href: '/learn/sup/'
      - title: 'SUP lentų matmenų vadovas'
        desc: 'Kaip ilgis, plotis ir storis veikia stabilumą, greitį ir manevringumą.'
        href: '/learn/sup/'
      - title: 'SUP priežiūra ir rūpinimasis'
        desc: 'Pripučiamų SUP lentų valymo, saugojimo, UV apsaugos ir remonto patarimai.'
        href: '/v2/inflatable-sup-maintenance/'
      - title: 'Pirmosios SUP pasirinkimas'
        desc: 'Pradedančiųjų vadovas, kaip išsirinkti tinkamą stovėjimo irklentę pagal jūsų svorį, įgūdžių lygį ir numatytą naudojimą.'
        href: '/learn/sup/'
  - title: 'Nuomos operacijų vadovas'
    tagline: 'Parko valdymas nuomos verslams'
    desc: 'Vadovai, kaip kurti ir valdyti SUP nuomos parkus paplūdimio kioskams, vandens sporto centrams ir svetingumo objektams.'
    guides:
      - title: 'Nuomos parko kūrimas'
        desc: 'Kaip išsirinkti tinkamas SUP lentas jūsų nuomos verslui — patvarumas, dydžiai ir ROI aspektai.'
        href: '/solutions/rental-operators/'
      - title: 'Parko priežiūros vadovas'
        desc: 'Esminės priežiūros praktikos, maksimizuojančios lentų tarnavimo laiką ir minimizuojančios prastovas nuomos parkams.'
        href: '/solutions/rental-operators/'
  - title: 'Kurortų ir svetingumo vadovas'
    tagline: 'Vandens veikla svetingumo sektoriui'
    desc: 'Vadovai, kaip paleisti ir valdyti SUP programas kurortams, viešbučiams ir pakrantės vietovėms.'
    guides:
      - title: 'Kurorto SUP programos pradžia'
        desc: 'Veiksniai, kuriuos verta apsvarstyti paleidžiant svečių SUP veiklą — parko dydis, personalas ir pajamų modeliavimas.'
        href: '/solutions/resorts-hotels/'
      - title: 'SUP prieš kitas vandens veiklas'
        desc: 'Palyginkite SUP programas su kitais vandens sportais pagal svečių patirtį ir operacinį efektyvumą.'
        href: '/learn/sup/'
  - title: 'Mažmeninės prekybos ir platinimo vadovas'
    tagline: 'SUP verslo partnerystės'
    desc: 'Vadovai, kaip tapti SUP mažmeninės prekybos partneriu ar platintoju — atsargų planavimas, rinkos pozicionavimas ir augimo strategijos.'
    guides:
      - title: 'SUP mažmenininko tapimas'
        desc: 'Kaip pasirinkti produktų linijas, valdyti atsargas ir prekiauti SUP lentomis jūsų parduotuvėje.'
        href: '/solutions/retail-partners/'
      - title: 'SUP komercinėms operacijoms'
        desc: 'Kodėl pripučiami SUP yra universalus produktas komerciniams parkams, nuomos verslams ir profesionaliems operatoriams.'
        href: '/solutions/rental-operators/'


  cta_text: 'Užklausti pasitikėjimo išteklių'
  cta_link: '/contact'

faqs_sup:
  title: 'SUP lentų DUK'
  subtitle: 'Dažni klausimai apie mūsų SUP lentas.'
  columns: 2
  items:
    - title: 'Kokių dydžių SUP lentas afarer siūlo?'
      description: 'Siūlome SUP lentas nuo 9 ft iki 12 ft, apimančias viską — nuo kompaktiškų universalių lentų iki turizmo ir specialiųjų dizainų. Kiekvienas modelis prieinamas su keliomis konfigūracijos parinktimis.'
    - title: 'Kuo skiriasi pripučiama SUP lenta nuo kietos SUP lentos?'
      description: 'Pripučiama SUP lenta naudoja "Drop-Stitch" konstrukciją su tūkstančiais vidinių siūlų, leidžiančių aukštą oro slėgį, o kietą SUP lentą sudaro epoksidinė derva arba stiklo pluoštas. Pripučiamos SUP lentos suteikia pernešimo ir laikymo patogumą neaukodamos standumo.'
    - title: 'Koks SUP lentų svorio limitas?'
      description: 'Mūsų SUP lentos atlaiko iki 150 kg priklausomai nuo modelio ir tūrio. Kiekvieno produkto puslapyje nurodytas maksimalus apkrovos įvertis jūsų konkrečiam modeliui.'
    - title: 'Ar afarer SUP lentos turi CE sertifikatą?'
      description: 'Taip. Visi poilsio SUP modeliai yra CE sertifikuoti pagal taikytinus Europos standartus, skirtus poilsio naudojimui.'
    - title: 'Kokia SUP lentų garantija?'
      description: 'Visos afarer SUP lentos turi standartinę vienerių metų garantiją nuo gamybos defektų, apimančią siūlių gedimus, vožtuvų defektus ir medžiagų delaminaciją esant normaliam naudojimui.'
    - title: 'Kiek laiko trunka pripūsti SUP lentą?'
      description: 'Naudojant pridedamą rankinį siurblį, pilnas pripūtimas iki 15 PSI trunka maždaug 8–12 minučių. Greitesniam pripūtimui rekomenduojame mūsų afarer 12V elektrinį siurblį, kuris lentą pripučia per mažiau nei 4 minutes.'

faqs_materials:
  title: 'SUP medžiagų ir priežiūros DUK'
  subtitle: 'Dažni klausimai apie mūsų pripučiamų SUP lentų medžiagas, priežiūrą ir laikymą.'
  columns: 2
  items:
    - title: 'Kokios medžiagos naudojamos afarer pripučiamose SUP lentose?'
      description: 'Naudojame karinės klasės PVC (1100 denjerų) su UV stabilizuota, atsparia dilimui konstrukcija, atitinkančia ES REACH ir RoHS reglamentus.'
    - title: 'Kiek laiko tarnauja pripučiamos SUP lentos?'
      description: 'Tinkamai prižiūrint, kokybiška PVC pripučiama SUP lenta tarnauja 5–10 metų. Reguliarus valymas, UV apsauga ir tinkamas laikymas ženkliai prailgina eksploatacijos laiką.'
    - title: 'Kokios priežiūros reikia pripučiamai SUP lentai?'
      description: 'Pagrindinė priežiūra apima skalavimą gėlu vandeniu po kiekvieno naudojimo (ypač jūros vandenyje), džiovinimą prieš laikymą, vožtuvų sandarų tikrinimą kasmet ir ilgos saulės ekspozicijos vengimą nenaudojant.'
    - title: 'Ar pripučiamas SUP lentas galima naudoti jūros vandenyje?'
      description: 'Taip. Visos afarer pripučiamos SUP lentos sukurtos tiek gėlam, tiek jūros vandeniui. Rekomenduojame nuplauti gėlu vandeniu ir kruopščiai išdžiovinti po kontakto su jūros vandeniu.'
    - title: 'Kaip laikyti pripučiamą SUP lentą?'
      description: 'Prieš laikymą lentą visiškai išleiskite orą, išvalykite ir išdžiovinkite. Vyniokite laisvai (venkite stiprių lenkimų), laikykite vėsioje, sausoje vietoje atokiau nuo tiesioginių saulės spindulių ir nestatykite ant betoninių grindų, kad būtų išvengta drėgmės susigėrimo.'
    - title: 'Kokią apkrovą atlaiko afarer pripučiamos SUP lentos?'
      description: 'Svorio talpos svyruoja nuo 100 kg mažiausiems mūsų modeliams iki daugiau nei 200 kg didesnėms lentoms. Kiekvieno produkto puslapyje nurodytas maksimalus apkrovos įvertis jūsų konkrečiam modeliui.'


warranty_section:
  title: 'Garantija ir popardaviminis aptarnavimas'
  subtitle: 'Už kiekvieną produktą atsakome su aiškiomis garantijos sąlygomis, greitu pretenzijų tvarkymu ir originaliomis atsarginėmis dalimis.'
  items:
    - title: '2 metų produkto garantija'
      desc: 'Visi afarer produktai turi 2 metų garantiją nuo gamybos defektų — siūlių gedimų, vožtuvų defektų ir medžiagų delaminacijos esant normaliam naudojimui.'
    - title: 'Ilgalaikis atsarginių dalių palaikymas'
      desc: 'Originalios atsarginės dalys — vožtuvai, remonto rinkiniai, peleksai, D žiedai — prieinamos visiems modeliams. Formas ir įrankius palaikome mažiausiai 5 metus po gamybos pabaigos.'
    - title: 'Atsakymas į pretenzijas per 48 valandas'
      desc: 'Garantinės pretenzijos užregistruojamos per 48 valandas. Pakaitinės lentos patvirtintoms pretenzijoms išsiunčiamos per 10 darbo dienų.'
    - title: 'Pasaulinis remonto tinklas'
      desc: 'Įgalioti remonto centrai daugiau nei 15 šalių. Lauko remonto rinkiniai prieinami nuotolinėms operacijoms. Savarankiško remonto vadovai smulkiems pažeidimams.'
    - title: 'OEM klientų aptarnavimas'
      desc: 'Paskirti klientų vadybininkai B2B partneriams. Ketvirtinės verslo peržiūros, atsargų planavimas ir bendro prekės ženklo rinkodaros palaikymas.'
    - title: 'Sertifikavimo paketas'
      desc: 'Su kiekviena siunta pateikiama pilna atitikties dokumentacija — CE deklaracija, testų ataskaitos, medžiagų saugos duomenų lapai.'
      link: '/contact'


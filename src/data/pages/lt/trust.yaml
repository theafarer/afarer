features3_certifications:
  title: 'Sertifikatai ir atitiktis'
  subtitle: 'Kiekvienas produktas yra nepriklausomai išbandomas ir sertifikuojamas pagal tarptautinius standartus.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'CE sertifikavimas'
      description: 'Visos afarer SUP lentos atitinka Europos CE saugos standartą, skirtą poilsio naudojimui. Kiekvienas produktas prieš palikdamas gamyklą atlieka slėgio, plūdumo ir apkrovos testus.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'Mūsų 12,000 m² ploto objektas Cindao veikia pagal ISO 9001 kokybės vadybos sistemą. Kiekviena gamybos partija yra atsekama, dokumentuojama ir tikrinama.'
      icon: 'tabler:clipboard-check'
    - title: 'BSCI socialinė atitiktis'
      description: 'Mes turime BSCI sertifikatą, užtikrinantį etiškas darbo praktikas, saugias darbo sąlygas ir aplinkosauginę atsakomybę visoje mūsų tiekimo grandinėje.'
      icon: 'tabler:users'
    - title: 'REACH ir RoHS'
      description: 'Visos medžiagos — PVC, EVA putos, klijai — atitinka ES REACH ir RoHS reglamentus. Jokių apribotųjų medžiagų, jokių kompromisų.'
      icon: 'tabler:flask'
    - title: 'Medžiagų testavimo laboratorija'
      description: 'Vidinė medžiagų laboratorija prieš gamybą išbando kiekvieną audinio partiją dėl tempimo stiprio, UV atsparumo, siūlių vientisumo ir atsparumo dilimui.'
      icon: 'tabler:microscope'
    - title: '2 metų garantija'
      description: 'Kiekvienas afarer produktas turi dvejų metų garantiją nuo gamybos defektų. Mes atsakome už tai, ką gaminame.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'Klientų pasitikėjimas'
  title: 'Ką sako mūsų klientai'
  subtitle: 'Nuo pirmą kartą irkluojančių iki profesionalių flotilės operatorių — sužinokite, kodėl jie pasitiki afarer.'
  items:
    - content: 'Savo visą nuomos flotilę aprūpinome afarer SUP lentomis. Praėjo du sezonai — nulis gedimų. CE sertifikatas draudimo patvirtinimą padarė labai sklandų.'
      name: 'Marco V.'
      title: 'Turizmo operatorius, Kroatija'
    - content: 'Kaip pirmą kartą perkantis pirkėjas jaudinausi dėl kokybės. Jų pateikta ISO dokumentacija ir testų ataskaitos suteikė man visišką pasitikėjimą.'
      name: 'James T.'
      title: 'SUP Explorer 11 savininkas, Kanada'
    - content: 'Su afarer dirbame dėl mūsų pakrančių patrulių vienetų. Jų kokybės kontrolės procesas nuoseklus kiekvienoje partijoje — toks patikimumas svarbus itin kritinėse operacijose.'
      name: 'Lt. Cmdr. Andres'
      title: 'Vyriausybiniai pirkimai, Filipinai'

steps2_manufacturing:
  title: 'Kaip užtikriname kokybę'
  subtitle: 'Nuo žaliavų patikros iki galutinio slėgio testavimo — kiekvienas produktas praeina griežtą kokybės grandinę.'
  items:
    - title: 'Žaliavų patikra'
      description: 'Kiekvienas PVC audinio ritinys prieš patekdamas į gamybą yra tikrinamas dėl storio, tempimo stiprio ir UV atsparumo.'
      icon: 'tabler:search'
    - title: 'Gamybos eigos kokybės kontrolė'
      description: 'Suvirinimo siūlės, vožtuvų montavimas ir kamerų jungtys yra tikrinami kiekvienoje stotyje surinkimo metu.'
      icon: 'tabler:eye'
    - title: 'Slėgio testavimas'
      description: 'Kiekvienas pripučiamas produktas yra pripūčiamas iki 1.25x nominalaus PSI ir laikomas 24–48 valandas oro sulaikymo ir siūlių vientisumo patikrinimui.'
      icon: 'tabler:wind'
    - title: 'Galutinė patikra'
      description: 'Kiekvienas vienetas prieš patvirtinant siuntimui yra tikrinamas dėl apdailos, furnitūros ir pakavimo. Partijos mėginiai siunčiami į mūsų laboratoriją destruktyviems testams.'
      icon: 'tabler:clipboard-check'


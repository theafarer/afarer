meta:
  title: 'Mokslinių tyrimų ir plėtros centras | {SITE}'
  description: 'Moksliniai tyrimai ir plėtra — PVC audinių testavimas, korpusų inžinerija, RF suvirinimas, hidrodinaminis testavimas ir kokybės kontrolė. Pasirinktinės R&D paslaugos prieinamos.'

hero:
  tagline: 'Mokslinių tyrimų ir plėtros centras'
  title: 'Mokslinių tyrimų ir plėtros centras'
  subtitle: 'Sutelktas į pažangą'

intro:
  - 'afarer Mokslinių tyrimų ir plėtros (R&D) centras yra varomoji jėga už mūsų misijos revoliucionizuoti vandens sporto įrangą. Mes suteikiame galimybę vandens sporto entuziastams visame pasaulyje naudotis saugesniais, patogesniais ir malonesniais produktais per atkaklų inovacijas pripučiamose stovėjimo irklentėse (SUP). Mūsų skirta inžinierių, dizainerių ir aistringų vandens sporto ekspertų komanda formuoja pramonės ateitį, nuolat keldama kokybės, našumo ir tvarumo kartelę.'
  - 'Mūsų R&D įrenginys vienoje vietoje sujungia medžiagotyrininkus, jūrų inžinierius ir gamybos inžinierius. Nuo audinio formuliavimo ir korpuso modeliavimo iki suvirinimo proceso kūrimo ir viso dydžio jūros bandymų, kiekvieną produkto vystymo etapą skatina duomenys ir patvirtina testavimas.'

mission:
  tagline: 'Mūsų misija'
  title: 'Kuriantys vandens sporto ateitį'
  pillars:

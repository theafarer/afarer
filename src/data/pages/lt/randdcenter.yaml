    - icon: 'design'
      title: 'Vartotojo poreikius atitinkantis dizainas'
      desc: 'Gilus vartotojų poreikių supratimas ir jų viršijimas per ergonomišką ir intuityvų produkto dizainą.'
    - icon: 'globe'
      title: 'Tvarios praktikos'
      desc: 'Minimizuojantys mūsų pėdsaką aplinkai naudojant ekologiškas medžiagas ir procesus.'
    - icon: 'shield'
      title: 'Besąlygiška sauga'
      desc: 'Užtikrinantys aukščiausius saugos standartus per griežtą testavimą ir sertifikavimą.'

pillars:
  - title: 'Technologinė pažanga'
    desc: 'Pionieriai naujose medžiagose, dizaine ir gamybos procesuose, siekiantys puikaus produkto našumo ir ilgaamžiškumo.'
    icon: 'tech'
  - title: 'Pažangios medžiagos'
    desc: 'Tiriantys pažangiausias PVC, kompozitus ir tvarias alternatyvas geresnėms produkto savybėms.'
    icon: 'materials'
  - title: 'Tvarumas'
    desc: 'Pagrindinis įsipareigojimas: esame skirti aplinkosaugai per tvarią gamybą ir perdirbamas medžiagas.'

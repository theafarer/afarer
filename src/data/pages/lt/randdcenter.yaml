capabilities:
  tagline: 'Galimybės'
  title: 'R&D galimybės'
  subtitle: 'Keturios pagrindinės disciplinos, suteikiančios mums visapusišką kontrolę produkto vystymui — nuo žaliavų tyrimų iki galutinio sertifikavimo.'
  groups:
    - title: 'Medžiagotyra ir audinių technologijos'
      items:
        - 'PVC formuliavimo analizė ir optimizavimas'
        - 'UV stabilizavimo, liepsnos atsparumo ir antimikrobinių priedų kūrimas'
        - 'Daugiasluoksnių audinių laminavimas ir sukibimo inžinerija'
        - 'Pagreitintas senėjimo testavimas (UV, terminis, drėgmės, druskos rūko)'
    - title: 'Korpusų inžinerija ir hidrodinamika'
      items:
        - 'Parametrinis 3D korpuso dizainas ir CFD optimizavimas'
        - 'Baigtinių elementų analizė struktūrinėms ir smūgio apkrovoms'
        - 'Mažo modelio buksiavimo baseino testavimas ir našumo patvirtinimas'
        - 'Pasirinktinis korpuso vystymas specialiems misijų profiliams'
    - title: 'Suvirinimo ir jungimo technologijos'
      items:
        - 'RF dielektrinio suvirinimo proceso kūrimas ir optimizavimas'
        - 'Karšto oro, karšto pleišto ir ultragarso suvirinimo metodai'
        - 'Klijavimas ir siūlių juostų kvalifikavimas'
        - 'Suvirinimo stiprio modeliavimas ir tarnavimo laiko prognozė'
    - title: 'Testavimas, sertifikavimas ir atitiktis'
      items:
        - 'Kokybės vadyba ir CE atitikties testavimas'
        - 'Nepriklausomas trečiųjų šalių testavimas ir sertifikavimo parama'
        - 'Pasirinktinių testų protokolų kūrimas pirkimų kvalifikavimui'
        - 'Eksploatacijos gedimų analizė ir priežasčių tyrimas'


faqs:
  - question: 'Ar galima stovėti ir žvejoti iš pripučiamos SUP lentos?'
    answer: 'Taip. Platesnės pripučiamos SUP lentos (33 coliai ar daugiau) suteikia pakankamai stabilumo stovėjimui ir metimui. Viso ilgio EVA denio kilimėliai užtikrina saugų stovėjimą esant šlapiaiems.'
  - question: 'Ar pripučiama SUP lenta tinka žvejybai?'
    answer: 'Pripučiamos SUP lentos yra puikios žvejybos platformos, ypač žvejojant seklumose ir sekliuose vandenyse. Platus dizainas suteikia lengvą prieigą prie įrankių ir įrangos.'
  - question: 'Kiek įrangos galiu pasiimti ant pripučiamos SUP lentos?'
    answer: 'Dauguma pripučiamų SUP lentų atlaiko 220-300 lbs bendros talpos (irkluotojas ir įranga). Tipinė žvejybos įranga su įrankiais, šaldytuvu ir saugos priemonėmis prideda 20-40 lbs. Patikrinkite lentos tūrio įvertį, kad užtikrintumėte pakankamą talpą.'
body: |
  <h2>Kodėl žvejoti iš pripučiamos vandens transporto priemonės?</h2>
  <p>Pripučiamos SUP lentos žvejams siūlo unikalių pranašumų, kurių tradicinės valtys negali pasiekti. Jų seklus grimzlė leidžia patekti į vandenis, kurių variklinės valtys negali pasiekti, o tyli artyn prisiartinimas minimalizuoja trikdymą žuvims. Pernešamumo faktorius reiškia, kad galite žvejoti nuotoliniuose ežeruose, upėse ir pakrančių zonose be priekabos ar valties rampų.</p>
  <p>Pagrindiniai pranašumai:</p>
  <ul>
    <li><strong>Tylumas</strong> — Nėra variklio triukšmo, todėl galite prisiartinti prie žuvų jų neišgąsdindami</li>
    <li><strong>Prieiga prie sekaus vandens</strong> — Vos kelių colių grimzlė leidžia žvejoti pelkėse, upeliuose ir seklumose</li>
    <li><strong>Pernešamumas</strong> — Pasiekite nuotolines vietas, kurių valtimi nepasieksite</li>
    <li><strong>Stovėjimo galimybė</strong> — SUP lentos leidžia stovėti geresniam vandens matomumui</li>
  </ul>

  <h2>Stabilumo reikalavimai</h2>
  <p>Žvejybai reikia stabiliųjų platformų. Rinkdamiesi pripučiamą vandens transporto priemonę žvejybai teikite pirmenybę:</p>
  <ul>
    <li><strong>Plotis</strong> — Platesnės lentos (33-36 coliai) suteikia geresnį stabilumą stovint ir metant</li>
    <li><strong>Storis</strong> — 6 colių lentos suteikia didesnį standumą ir svorio talpą įrangai</li>
    <li><strong>Tūris</strong> — Didesnis tūris (300+ litrų) atlaiko bendrą žvejo ir įrangos svorį</li>
    <li><strong>Denio paviršius</strong> — Viso ilgio EVA putų denio kilimėlis suteikia neslystantį sukibimą esant šlapiaiems</li>
  </ul>

  <h2>Suderinamumas su įranga</h2>
  <p>Tipinė pripučiamos žvejybos įranga apima:</p>
  <ul>
    <li><strong>Meškerių laikikliai</strong> — Užsegami arba prie denio montuojami meškerių laikikliai, leidžiantys irkluoti be rankų</li>
    <li><strong>Dėžė arba šaldytuvas</strong> — Pritvirtintas prie denio guminiais tvirtinimais įrankiams ir laimikiui</li>
    <li><strong>Inkaro sistema</strong> — Lengvas, sulankstomas inkaras arba kuolas srovės laikymuisi</li>
    <li><strong>Irklo saugos virvė</strong> — Laiko irklą prisegtą, kai abiejų rankų reikia žvejybai</li>
    <li><strong>Asmeninis gelbėjimosi priemonė (PFD)</strong> — Būtina saugos įranga kiekvienam žvejui</li>
  </ul>

  <h2>Rekomenduojami vandens transporto priemonių tipai žvejybai</h2>
  <p>Skirtingiems žvejybos scenarijams tinka skirtingi tipai:</p>

  <h3>SUP lentos žvejybai</h3>
  <p>Geriausiai tinka: žvejyba seklumose, ežerų lydekininkystė, žvejyba matant sekiame vandenyje. Pakelta stovėjimo padėtis suteikia puikų matomumą. Stabilumui rinkitės platesnę turizmo ar universalų SUP.</p>

  <h3>SUP lentos žvejybai</h3>
  <p>Geriausiai tinka: kelių asmenų žvejybos išvykos, sunkios įrangos vežimas ir saugomos pakrančių vandens. SUP lentos siūlo denio erdvę ir svorio talpą išlikdamos pernešamos.</p>

  <h2>Saugos svarstymai</h2>
  <ul>
    <li>Visada dėvėkite gelbėjimosi priemonę — žvejyba apima stovėjimą, metimą ir įrangos judinimą, kas padidina kritimo riziką</li>
    <li>Prieš išvykdami patikrinkite orą ir vandens sąlygas</li>
    <li>Turėkite švilpuką, telefoną vandeniui atspariame dėkle ir pagrindinį remonto rinkinį</li>
    <li>Praneškite kam nors savo žvejybos vietą ir numatomą grįžimo laiką</li>
  </ul>

  <h2>DUK</h2>
  <h3>Ar galima stovėti ir žvejoti iš pripučiamos SUP lentos?</h3>
  <p>Taip. Platesnės pripučiamos SUP lentos (33 coliai ar daugiau) suteikia pakankamai stabilumo stovėjimui ir metimui. Viso ilgio EVA denio kilimėliai užtikrina saugų stovėjimą esant šlapiaiems.</p>

  <h3>Kiek įrangos galiu pasiimti ant pripučiamos SUP lentos?</h3>
  <p>Dauguma pripučiamų SUP lentų atlaiko 220-300 lbs bendros talpos (irkluotojas ir įranga). Tipinė žvejybos įranga su įrankiais, šaldytuvu ir saugos priemonėmis prideda 20-40 lbs. Patikrinkite lentos tūrio įvertį, kad užtikrintumėte pakankamą talpą.</p>

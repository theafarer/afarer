hero:
  tagline: Технологии
  title: Наши технологии
  subtitle: Продукты afarer разработаны с использованием передовых материалов и инновационной инженерии для обеспечения исключительной производительности, долговечности и портативности.
sections:
  - title: Ядро с каплевидным стежком
    description: Тысячи внутренних полиэстеровых нитей соединяют верхний и нижний слои, создавая жесткую структуру при давлении 12-15 PSI. Это та же технология, которая используется в профессиональных паддлбордах и надувных гоночных SUP.
    imageAlt: Диаграмма ядра DS
  - title: ПВХ морского класса
    description: Многослойная ламинированная ПВХ-ткани, предназначенная для морских условий. Каждый слой сварен с помощью термофузии, а не склеен, что исключает риск расслоения. Протестирована на устойчивость к УФ-лучам, коррозии от соленой воды и истиранию.
    imageAlt: ПВХ слой
  - title: Военный ПВХ
    description: Используется на всех моделях SUP, премиальный ПВХ обеспечивает превосходную устойчивость к УФ-излучению и химическим веществам. Сохраняет гибкость при экстремальных температурах и устойчива к разрушению.
    imageAlt: ПВХ
  - title: Пол аэродрома
    description: Конструкция надувного изделия с высокообъемной капроновой тесьмой, обеспечивающая исключительную жесткость для стояния, рыбалки и йоги. Сокращает время подготовки, общий вес и объем хранения.
    imageAlt: Авианосная палуба

hero:
  tagline: Безопасность
  title: Стандарты безопасности и сертификация
  subtitle: Каждый продукт afarer проходит строгие испытания и соответствует международным стандартам безопасности для рекреационного и профессионального использования.

certifications:
  - title: Сертификация CE
    description: Все средства безопасности afarer соответствуют требованиям маркировки CE согласно Европейскому регламенту о средствах индивидуальной защиты (EU) 2016/425.
  - title:
    description: Спасательные жилеты соответствуют стандартам плавучести . Life Vest Classic обеспечивает плавучесть 50N+; Life Vest Pro соответствует требованиям SOLAS с автоматическим надуванием.
  - title: Соответствие SOLAS
    description: Life Vest Pro соответствует правилам SOLAS (Безопасность жизни на море) для морских и коммерческих морских операций.


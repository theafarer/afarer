hero:
  tagline: Технология
  title: Как работает техника Drop Stitch — инженерия надувных жестких ядер
  subtitle: 8 минут чтения
content_html: >
  <h2>Что такое дроп-стеч?</h2>

  <p>Дроп-стеч (также называемый «дроп-стечковой ткань» или «дроп-стечковый ядро») — это метод изготовления, при котором тысячи отдельных полиэстеровых нитей соединяют верхний и нижний слои тканевой оболочки. Когда корпус надувается, эти нити действуют как внутренние натяжные элементы — они
  предотвращают выпячивание верхней и нижней панелей наружу в круглую форму, заставляя панель оставаться плоской и жёсткой.</p>

  <p>В результате получилась лёгкая, портативная конструкция, способная выдерживать внутреннее давление 15–20 PSI — сопоставимую с жесткостью платы с твёрдой оболочкой, но полностью надуваемая для хранения и транспортировки</p>.


  <h2>Как это работает: Физика</h2>

  <p>В обычной надувной конструкции (например, воздушном шаре или надувном матрасе) внутреннее давление воздуха одинаково движется во все направления. Без внутренних ограничений структура становится цилиндрической или сферической. Дроп-стежок решает эту проблему, вводя растянутое усиление:</p>

  <ul>
    <li>Тысячи нитей соединяют верхний и нижний слои ткани</li>
    <li>При надувании давление воздуха пытается разогнать верх и низ</li>
    <li>Резьба сопротивляется этому разделению, передавая нагрузку в натяжение вдоль оси резьбы</li>
    <li>В результате получается плоская, жёсткая панель, устойчивая к изгибу</li>
  </ul>


  <h2>Процесс строительства</h2>

  <ol>
    <li><strong>Ткачество:</strong> Полиэстеровые нити одновременно вплетаются в два отдельных слоя основы (обычно 1 100 DTEX или 1 680 DTEX с полиэстером с ПВХ). Нити переплетаются между слоями под углом 90°.</li>
    <li><strong>Покрытие:</strong> Ткань основания покрывается ПВХ (или иногда TPU) с помощью ножевого или календарного покрытия. Это герметизирует резьбу и создаёт герметичную мембрану.</li>
    <li><strong>Склеивание слоёв:</strong> Ядро с капельным швом склеивается с внешними ламинированными слоями (обычно 0,9 мм или 1,2 мм ПВХ) с помощью теплового ламинирования или клея</li>.
    <li><strong>Сварка:</strong> Рельсовые ленты сваривают по краям с помощью горячей сварки, RF или высокочастотной сварки для создания боковых стенок плиты.</li>
    <li><strong>Установка клапанов:</strong> Устанавливаются бостонские клапаны или клапаны Halkey-Roberts, обычно с механизмом сброса давления для предотвращения чрезмерной надувки.</li>
  </ol>


  <h2>Ключевые показатели качества</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <TR класс="BG-Gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">параметр</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Начальный уровень</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 граница">Плотность потока</td><td class="p-3 граница">1 поток / квадрат дюйм<</td>td class="p-3 граница">2 потока / квадрат в</td></tr>
      <tr><td class="p-3 border">базовая ткань</td><td class="p-3 граница">1,100 DTEX</td><td class="p-3 граница">1,680 DTEX</td></tr>
      <tr><td класс="p-3 граница">Максимальное давление</td><td класс="p-3 граница">12 – 15 PSI</td><td класс="p-3 граница">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">толщина ПВХ</td><td класс="p-3 граница">0,6 – 0,9</td> мм<td класс="p-3 граница">1,0 – 1,2 мм</td></tr>
      <tr><td class="p-3 граница">Железнодорожное строительство</td><td class="p-3 граница">Складенная и склеенная</td><td класс="p-3 граница">Сварная и плавно-склеенная</td></tr>
    </tbody>
  </table>


  <h2>Применение</h2>

  <ul>
    <li><strong>SUP платы:</strong> толщина 4" – 6", давление 15 – 20 PSI, 1–2 резьбы/кв.</li> дюйм
    <li><strong>Каяки:</strong> надувные боковые камеры с дроп-швом, пол под давлением 10–15 PSI</li>
    <li><strong>Полы RIB:</strong> Полы с дроп-швом для лёгких, упаковываемых RIB тендеров, давление 12–18 PSI</li>
    <li><strong>Крылья для лодки:</strong> Дроп-шов с низким давлением для формированных крыльев с плоскими поверхностями</li>
  </ul>


  <h2>Дроп-стечка против воздушной палубы (стекловолокно или деревянное сердцевина)</h2>

  <p>Платы с твердой оболочкой используют пенопластовые сердечники EPS с армированием стекловолокна или деревянного стрингера. Они легче, жёстче и более отзывчивы — но их нельзя сдуть. Дроп-стеч отменяет часть жёсткости ради полной портативности. Для большинства любителей современные дроп-стичные
  SUP-системы при давлении 20 PSI неотличимы от базовых жёстких досок по жёсткости</p>.


  <h2>Как Afarer использует дроп-стеч</h2>

  <p>Afarer использует сердечник DTEX с дроп-швом 1 680 во всей линейке SUP, с 2 нитями на квадратный дюйм и наружным ламинатом ПВХ толщиной 1,2 мм. Платы рассчитаны на 20 PSI и проходят 24-часовое испытание давления при номинальном давлении 1,5x перед отправкой. Рельсовые ленты свариваются горячим
  воздухом с трёхслойным плавлением, а клапаны сброса давления стандартны для всех моделей.</p>

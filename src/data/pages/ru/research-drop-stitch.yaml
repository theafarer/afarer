hero:
  tagline: Технология
  title: Как работает техника Drop Stitch — инженерия надувных жестких ядер
  subtitle: 8 минут чтения
content_html: |-
  <h2>Что такое Drop Stitch?</h2>
  <p>Drop stitch (также называемый "ткань drop-stitch" или "сердечник drop-stitch") — это метод производства, при котором тысячи отдельных полиэстерных нитей соединяют верхний и нижний слои тканевой оболочки. При надувании оболочки эти нити действуют как внутренние растягивающие элементы — они не дают верхней и нижней панелям выпучиваться наружу в круглую форму, заставляя панель оставаться плоской и жёсткой.</p>
  <p>В результате получается лёгкая, портативная конструкция, которая выдерживает внутреннее давление 15 – 20 PSI — по жёсткости сравнимая с доской с жёстким корпусом, но полностью сдуваемая для хранения и транспортировки.</p>

  <h2>Как это работает: физика</h2>
  <p>В обычной надувной конструкции (например, в воздушном шаре или надувном матрасе) внутреннее давление воздуха действует одинаково во всех направлениях. Без внутреннего удержания конструкция становится цилиндрической или сферической. Drop stitch решает эту проблему, добавляя растягивающее армирование:</p>
  <ul>
    <li>Тысячи нитей соединяют верхний и нижний слои ткани</li>
    <li>При надувании давление воздуха стремится раздвинуть верх и низ</li>
    <li>Нити противодействуют этому разделению, переводя нагрузку в натяжение вдоль оси нити</li>
    <li>В результате получается плоская жёсткая панель, устойчивая к изгибу</li>
  </ul>

  <h2>Процесс производства</h2>
  <ol>
    <li><strong>Ткачество:</strong> Полиэстерные нити вплетаются одновременно в два отдельных слоя базовой ткани (обычно это полиэстер с ПВХ-покрытием плотностью 1,100 DTEX или 1,680 DTEX). Нити соединяют слои петлевым плетением под углом 90&deg;.</li>
    <li><strong>Покрытие:</strong> Базовую ткань покрывают ПВХ (или иногда TPU) методом ножевого или каландрового нанесения. Это герметизирует нити и создаёт воздухонепроницаемую мембрану.</li>
    <li><strong>Склеивание слоёв:</strong> Сердечник drop-stitch соединяют с внешними ламинированными слоями (обычно ПВХ толщиной 0.9 mm или 1.2 mm) методом термоламинации или с помощью клея.</li>
    <li><strong>Сварка:</strong> Бортовые полосы привариваются по краям сваркой горячим воздухом, RF-сваркой или высокочастотной сваркой для создания боковых стенок доски.</li>
    <li><strong>Установка клапанов:</strong> Устанавливаются клапаны Boston или Halkey-Roberts, обычно с механизмом сброса давления для предотвращения перекачивания.</li>
  </ol>

  <h2>Ключевые показатели качества</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Параметр</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Начальный уровень</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Премиум</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Плотность нитей</td><td class="p-3 border">1 нить / sq in</td><td class="p-3 border">2 нити / sq in</td></tr>
      <tr><td class="p-3 border">Базовая ткань</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Максимальное давление</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Толщина ПВХ</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Конструкция борта</td><td class="p-3 border">Со складыванием &amp; склейкой</td><td class="p-3 border">Сварка &amp; сплавление</td></tr>
    </tbody>
  </table>

  <h2>Применение</h2>
  <ul>
    <li><strong>SUP-доски:</strong> толщина 4" – 6", 15 – 20 PSI, 1 – 2 нити/sq in</li>
    <li><strong>Байдарки:</strong> пол из drop-stitch + надувные боковые камеры, давление пола 10 – 15 PSI</li>
    <li><strong>Полы RIB:</strong> полы из drop-stitch для лёгких, компактных тендеров RIB, 12 – 18 PSI</li>
    <li><strong>Лодочные кранцы:</strong> drop-stitch низкого давления для фасонных кранцев с плоскими гранями</li>
  </ul>

  <h2>Drop Stitch против Air Deck (сердечник из стеклопластика или дерева)</h2>
  <p>Доски с жёстким корпусом используют пенополистирольные сердечники EPS с армированием из стеклопластика или деревянных стрингеров. Они легче, жёстче и отзывчивее — но их нельзя сдуть. Drop stitch жертвует частью жёсткости ради полной портативности. Для большинства любителей современные SUP-доски с drop-stitch при 20 PSI по жёсткости неотличимы от начальных жёстких досок.</p>

  <h2>Как Afarer использует drop stitch</h2>
  <p>Afarer использует сердечник drop-stitch плотностью 1,680 DTEX во всей линейке SUP: 2 нити на квадратный дюйм и внешний ламинат из ПВХ толщиной 1.2 mm. Доски рассчитаны на 20 PSI и перед отгрузкой проходят 24-часовой тест удержания давления при 1.5x номинального давления. Бортовые полосы свариваются горячим воздухом с трёхслойным сплавлением, а предохранительные клапаны сброса давления входят в стандартную комплектацию всех моделей.</p>

meta:
  title: Производство SUP под частной маркой | {SITE}
  description: Запустите собственный бренд SUP с Afarer. От идеи до рынка — полный сервис OEM/ODM, включая разработку, прототипирование, производство и глобальную логистику.
hero:
  tagline: Создайте свой собственный бренд
  title: Запустите свой собственный<br />бренд SUP
  subtitle: У вас есть видение. У нас есть фабрика, экспертиза и цепочка поставок. Вместе мы создадим бренд, который выделяется.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Прокатная SUP-доска с индивидуальным брендом на воде
process:
  title: Путь вашего бренда
  subtitle: От идеи до рынка в 5 этапов.
  steps:
    - phase: Фаза 1
      title: Идея
      period: Неделя 1-2
      items:
        - Маркетинговые исследования и анализ конкурентов
        - Определение целевого клиента
        - Мастерская по позиционированию бренда
        - Стратегия линейки продуктов
    - phase: Фаза 2
      title: Дизайн
      period: Неделя 3-6
      items:
        - Форма доски и графический дизайн
        - Подбор цвета и материалов
        - Спецификация аксессуара
        - Дизайн упаковки и этикетки
    - phase: Фаза 3
      title: Прототип
      period: Неделя 7-10
      items:
        - Пример производства
        - Тестирование качества (давление, плавучесть, ультрафиолет)
        - Корректировки дизайна
        - Окончательное утверждение
    - phase: Фаза 4
      title: Производство
      period: Неделя 11-14
      items:
        - Массовое производство
        - Инспекция ОТК (за единицу)
        - Морские перевозки / авиаперевозки
        - Документы для таможенного оформления
    - phase: Фаза 5
      title: Запуск
      period: Неделя 15-16
      items:
        - Фотография продукта
        - Канал продуктов сайта
        - Маркетинговые материалы
        - Поддержка запуска
packages:
  title: Пакеты для стартапов
  subtitle: Пакеты, разработанные для каждого этапа развития бренда.
  items:
    - name: Starter Brand
      tagline: 50-100 единиц · 2 модели плат
      features:
        - Базовая печать логотипа
        - Стандартная упаковка
        - Поддержка по электронной почте
    - name: Growing Brand
      tagline: 300–1 000 единиц · 3–5 моделей плат
      features:
        - Логотип индивидуального цвета
        - Индивидуальная упаковка
        - Фотографии продукта
        - Посвящённый менеджер
    - name: Established Brand
      tagline: 1 000 единиц · Полная линейка продукции
      features:
        - Полная настройка
        - Премиальная упаковка
        - Маркетинговые материалы
        - Приоритетное производство

hero_text:
  tagline: Контакты
  title: СВЯЖИТЕСЬ С НАМИ
contact_form:
  id: form
  title: Отправьте нам сообщение
  subtitle: По вопросам цен, техническим вопросам или партнёрству —напишите нам. Мы отвечаем в течение одного рабочего дня.
  email_to: info@afarer.com
  submit_button: Отправить
  success_message: Спасибо! Ваше сообщение получено. Мы ответим в течение одного рабочего дня.
  error_message: Произошла ошибка при отправке. Попробуйте снова или напишите нам напрямую по электронной почте.
  default_country_code: '+1'
  captcha:
    label: 'Антиспам: решите следующую задачу'
  fields:
    - name: firstName
      label: Имя
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Фамилия
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Компания
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Адрес
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Индекс
      row: 4
      step: 2
    - name: country
      label: Страна
      row: 4
      step: 2
    - name: email
      label: Email
      row: 5
      step: 2
    - name: tel
      label: Телефон
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Предполагаемый объем заказа
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Нужна кастомизация?
      row: 7
      step: 2
    - name: productInterest
      label: Интересующие категории продуктов
      row: 8
      step: 2
    - name: subject
      label: Тема
      row: 9
      step: 3
    - name: message
      label: Сообщение
      row: 10
      type: textarea
      rows: 6
      step: 3

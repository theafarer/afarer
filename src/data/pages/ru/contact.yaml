hero_text:
  tagline: Контакты
  title: СВЯЖИТЕСЬ С НАМИ
contact_form:
  id: form
  title: Отправьте нам сообщение
  subtitle: По вопросам цен, техническим вопросам или партнёрству —напишите нам. Мы отвечаем в течение одного рабочего дня.
  email_to: info@afarer.com
  submit_button: Отправить
  success_message: Спасибо! Ваше сообщение получено. Мы ответим в течение одного рабочего дня.
  error_message: Произошла ошибка при отправке. Попробуйте снова или напишите нам напрямую по электронной почте.
  default_country_code: Один
  captcha:
    label: 'Антиспам: решите следующую задачу'
  fields:
    - name: firstName
      label: Имя
      row: 1
      type: select
      optionsKey: страны
      step: 1
    - name: lastName
      label: Фамилия
      row: 1
      type: select
      options:
        - value: ''
          label: Выберите ваш предполагаемый объем...
        - value: образец
          label: Только образцы / прототипы
        - value: 5-10
          label: 5–10 единиц (стандартный минимальный заказ)
        - value: 100-500
          label: 100–500 единиц
        - value: более 500
          label: 500 единиц (Объемное ценообразование)
      step: 1
    - name: companyName
      label: Компания
      row: 2
      type: select
      options:
        - value: ''
          label: Выберите тип настройки...
        - value: нет
          label: Стандартный продукт (без кастомизации)
        - value: логотип
          label: Только индивидуальный логотип / фирменный стиль
        - value: полный
          label: Полный OEM (размер, цвет, графика, упаковка)
        - value: консультация
          label: Не уверен — нужна консультация
      step: 1
    - name: address
      label: Адрес
      row: 3
      type: select
      options:
        - value: ''
          label: Выберите категорию продукта...
        - value: все
          label: Все продукты / Полный каталог
        - value: привет
          label: SUP доски / паддлборды
        - value: безопасность
          label: Средства безопасности / Спасательные жилеты
        - value: аксессуар
          label: Аксессуары (насосы, весла, сумки)
      step: 1
    - name: zip
      label: Индекс
      row: 4
      step: 2
    - name: country
      label: Страна
      row: 4
      step: 2
    - name: email
      label: Email
      row: 5
      step: 2
    - name: tel
      label: Телефон
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Предполагаемый объем заказа
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Нужна кастомизация?
      row: 7
      step: 2
    - name: productInterest
      label: Интересующие категории продуктов
      row: 8
      step: 2
    - name: subject
      label: Тема
      row: 9
      step: 3
    - name: message
      label: Сообщение
      row: 10
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: Другие способы связаться с нами
  columns: 3
  items:
    - title: Отдел продаж
      description: Цены, конфигурации, заявки дилеров и оптовые заказы.
      icon: tabler:shopping-bag
    - title: Техподдержка
      description: Гарантия, ремонт, запчасти и вопросы эксплуатации.
      icon: tabler:tool
    - title: Пресса и партнёрства
      description: Медиа-киты, спонсорство и отраслевое сотрудничество.
      icon: tabler:news
    - title: Телефон
      description: 86 13305324192
      icon: tabler:headset
    - title: Электронная почта
      description: info@afarer.com
      icon: tabler:mail
    - title: Головной офис
      description: Зона экономического развития, Лайси, Циндао, Китай, 266600
      icon: tabler:map-pin
map:
  title: Наше местоположение
  subtitle: Приезжайте в гости
  address: Зона экономического развития, Лайси, Циндао, Китай, 266600
  zoom: 15

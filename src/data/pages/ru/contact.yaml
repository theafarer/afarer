meta:
  title: 'Контакты — запросы о партнёрстве и продукции SUP | {SITE}'
  description: 'Свяжитесь с afarera по вопросам партнёрства, со-бренда и private label или профессиональных флотов. Производитель надувных SUP-досок и лодок, отвечаем в течение 2 рабочих дней.'
  keywords:
    - 'контакты afarera'
    - 'запрос дистрибьютора SUP'
    - 'профессиональный поставщик SUP'
    - 'контакты производителя SUP'
hero_text:
  tagline: Контакты
  title: СВЯЖИТЕСЬ С НАМИ
contact_form:
  id: form
  title: Отправьте нам сообщение
  subtitle: По вопросам цен, техническим вопросам или партнёрству — напишите нам. Мы отвечаем в течение одного рабочего дня.
  email_to: info@afarer.com
  submit_button: Отправить запрос → Получить смету
  success_message: Спасибо! Ваше сообщение получено. Мы ответим в течение одного рабочего дня.
  error_message: Произошла ошибка при отправке. Попробуйте снова или напишите нам напрямую по электронной почте.
  default_country_code: '+1'
  captcha:
    label: 'Антиспам: решите следующую задачу'
  fields:
    - name: country
      label: Страна
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: Предполагаемый объем заказа
      row: 2
      type: select
      options:
        - value: ''
          label: Выберите ваш предполагаемый объем...
        - value: sample
          label: Только образцы / прототипы
        - value: '5-10'
          label: 5–10 единиц (стандартный MOQ)
        - value: '100-500'
          label: 100–500 единиц
        - value: '500-plus'
          label: 500+ единиц (Объемное ценообразование)
      step: 1
    - name: customization
      label: Нужна кастомизация?
      row: 3
      type: select
      options:
        - value: ''
          label: Выберите тип настройки...
        - value: none
          label: Стандартный продукт (без кастомизации)
        - value: logo
          label: Только индивидуальный логотип / фирменный стиль
        - value: full
          label: Полный со-бренд (размер, цвет, графика, упаковка)
        - value: consultation
          label: Не уверен — нужна консультация
      step: 1
    - name: productInterest
      label: Интересующие категории продуктов
      row: 4
      type: select
      options:
        - value: ''
          label: Выберите категорию продукта...
        - value: all
          label: Все продукты / Полный каталог
        - value: sup
          label: SUP доски / паддлборды
        - value: safety
          label: Средства безопасности / Спасательные жилеты
        - value: accessory
          label: Аксессуары (насосы, весла, сумки)
      step: 1
    - name: firstName
      label: Имя
      row: 1
      step: 2
    - name: lastName
      label: Фамилия
      row: 1
      step: 2
    - name: companyName
      label: Компания
      row: 2
      step: 2
    - name: email
      label: Email
      row: 3
      type: email
      step: 2
    - name: tel
      label: Телефон
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: Адрес
      row: 4
      step: 2
    - name: zip
      label: Индекс
      row: 5
      step: 2
    - name: subject
      label: Тема
      row: 1
      step: 3
    - name: message
      label: Сообщение
      row: 2
      type: textarea
      rows: 6
      step: 3

    - title: Пресса и партнёрства
      description: Медиа-киты, спонсорство и отраслевое сотрудничество.
      icon: tabler:news
    - title: Телефон
      description: '+86 13305324192'
      icon: tabler:headset
    - title: Электронная почта
      description: info@afarer.com
      icon: tabler:mail
    - title: Головной офис
      description: Зона экономического развития, Лайси, Циндао, Китай, 266600

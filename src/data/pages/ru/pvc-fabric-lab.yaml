hero:
  tagline: Лабораторная 01
  title: Лаборатория ПВХ тканей
  subtitle: Научное испытание материалов — от волокна до готовой трубы
  image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
  image_alt: Лаборатория испытаний тканей из ПВХ Afarer
intro: >-
  Ткань для баллонов является самым важным материалом в надувной лодке. Она должна выдерживать постоянное воздействие ультрафиолетовых лучей, многократные циклы надувания, трение о причалы и мусор, а также экстремальные перепады температуры — и при этом сохранять свою структурную целостность на
  протяжении многих лет. В {SITE.name} наша Лаборатория ПВХ-тканей занимается исключительно характеристикой, проверкой и постоянным улучшением тканей, которые мы используем в каждой построенной нами лодке.
content_html: >
  <h2>Основа каждой надувной лодки</h2>

  <p>Мы не полагаемся исключительно на паспорта данных поставщиков. Каждая партия ткани ПВХ и Hypalon, поступающая в наш цех, независимо тестируется собственными силами. Это гарантирует, что публикуемые нами характеристики материала соответствуют тем показателям, которые вы реально получаете, —
  партия за партией, год за годом.</p>


  <h2>Стандартизированное испытательное оборудование</h2>

  <p>Наша лаборатория тканей оснащена оборудованием промышленного класса, соответствующим методам испытаний ISO, ASTM и EN:</p>

  <table>
    <thead><tr><th>Оборудование</th><th>Измеряемые параметры</th><th>Стандарт</th></tr></thead>
    <tbody>
      <tr><td>Универсальная разрывная машина (50 кН)</td><td>Разрушающее усилие, удлинение при разрыве, распространение разрыва</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>Ксеноновая камера атмосферных испытаний</td><td>Стойкость к УФ-излучению (изменение цвета, сохранение прочности после 2000 ч)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>Испытатель на изгиб при низких температурах</td><td>Точка растрескивания при -30 °C до -50 °C</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Испытатель на истирание Taber</td><td>Потеря массы после 1000 циклов (ролик CS-10)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>Толщиномер (цифровой, разрешение 0.001 мм)</td><td>Равномерность по ширине рулона</td><td>ISO 2286-3</td></tr>
      <tr><td>Испытатель гидростатического напора</td><td>Сопротивление проникновению воды</td><td>ISO 811</td></tr>
    </tbody>
  </table>

  <p class="text-sm text-gray-500">* Все оборудование ежегодно калибруется сторонними аккредитованными лабораториями.</p>


  <h2>От данных к решению: типичный процесс испытаний</h2>

  <p>Когда поступает новый образец ткани, он проходит стандартизированный процесс квалификации из семи этапов:</p>

  <ol>
    <li><strong>Входной контроль</strong> — визуальная проверка на поверхностные дефекты, проколы и соответствие размерам.</li>
    <li><strong>Картирование толщины</strong> — измерение в 20 точках по рулону; для приемки требуется CV &lt; 3%.</li>
    <li><strong>Испытание на растяжение</strong> — 5 образцов в направлениях основы и утка. Минимум 3500 Н/50 мм для ПВХ 1100 dtex.</li>
    <li><strong>УФ-кондиционирование</strong> — экспозиция 1000 ч в ксеноновой камере; требуется сохранение прочности не менее 80 %.</li>
    <li><strong>Испытание на холодное растрескивание</strong> — 4 ч при -35 °C, затем изгиб на 180° вокруг оправки диаметром 25 мм. Без видимых трещин.</li>
    <li><strong>Стойкость к истиранию</strong> — 1000 циклов, потеря массы ≤ 0.05 г.</li>
    <li><strong>Утверждение и допуск</strong> — только после прохождения всех семи этапов ткань допускается в производство.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Типичный ПВХ 1100 dtex — сохранение прочности на разрыв после УФ-облучения</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 ч<br />100%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 ч<br />95%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 ч<br />88%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 ч<br />82%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">Конкурент<br />~65%</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Ткань ПВХ 1100 dtex сохраняет &gt; 80 % прочности на разрыв после 2000 ч облучения в ксеноновой камере, тогда как типичные промышленные сорта снижают этот показатель ниже 70 %.</p>
  </div>


  <h2>Наша профессиональная команда</h2>

  <p>The lab is staffed by two full-time material engineers, each holding a degree in polymer science or textile engineering with a minimum of six years of industry experience. They are supported by three technicians who perform day-to-day testing and data logging. The team regularly participates in
  inter-laboratory round-robin trials organised by the International Organization for Стандартization (ISO) to validate the accuracy of our test methods.</p>


  <h2>Решение самых сложных задач с материалами</h2>

  <p>Каждая морская среда уникальна. Патрульный катер, работающий в Персидском заливе, сталкивается с совершенно иными условиями УФ-излучения и температуры, чем спасательное судно в Северном море. Наша лаборатория тканей помогает вам выбрать — или разработать — спецификацию ткани, оптимизированную
  под ваш профиль эксплуатации.</p>

  <p>Недавние индивидуальные решения включают:</p>

  <ul>
    <li>Высокостойкая к истиранию композиция ПВХ для военного заказчика, чьи лодки регулярно выходят на коралловые рифы (+40 % срок службы при истирании).</li>
    <li>Низкотемпературная композиция Hypalon для арктической исследовательской станции, испытанная до -50 °C без охрупчивания.</li>
    <li>Стабилизированная по цвету оранжевая ткань для флота поисково-спасательных судов, сохраняющая видимость после 3 лет тропического солнечного воздействия.</li>
  </ul>

  <p>Мы не продаем ткани «как есть» в надежде, что они подойдут. Мы тестируем, проверяем и рекомендуем — или создаем — индивидуальное решение под ваш конкретный профиль задач. В этом и заключается отличие {SITE.name}.</p>


  <h2>Как мы работаем с вами</h2>

  <p>Когда вы обращаетесь к нам с задачей по материалам, вот чего вы можете ожидать:</p>

  <ol>
    <li><strong>Консультация</strong> — мы обсуждаем вашу эксплуатационную среду, целевые показатели производительности и бюджет.</li>
    <li><strong>Предложение</strong> — составляется план испытаний с четкими критериями «годен / не годен» и графиком работ.</li>
    <li><strong>Проведение испытаний</strong> — наша лаборатория выполняет испытания и готовит подробный отчет с исходными данными и сравнительным анализом.</li>
    <li><strong>Рекомендация</strong> — мы представляем спецификацию ткани, включая альтернативные варианты, если вашим требованиям соответствуют несколько материалов.</li>
    <li><strong>Сопровождение</strong> — после поставки мы остаемся на связи для поддержки по любым вопросам, связанным с материалом в эксплуатации.</li>
  </ol>

  <p>Наша цель — не просто продать вам лодку. Наша цель — гарантировать, что лодка, которую вы получите, надежно работает в тех условиях, в которых вы ее эксплуатируете, — и все начинается с ткани.</p>

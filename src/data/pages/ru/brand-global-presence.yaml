  title: Обслуживаем более 50 стран<br />на всех континентах
  subtitle: От европейских операторов прибрежного патрулирования до австралийских дистрибьюторов водных видов спорта и спасательных команд Ближнего Востока — лодки afarer на воде по всему миру.

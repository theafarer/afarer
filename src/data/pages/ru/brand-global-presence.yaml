features3_markets:
  tagline: Ключевые рынки
  title: Региональный опыт<br />для местных требований
  subtitle: Мы понимаем, что на разных рынках разные нормативные требования, предпочтения и случаи использования.
  isBeforeContent: false
  columns: 4
  items:
    - title: Европа и Великобритания
      description: Продукция с сертификацией CE, соответствующая стандартам EN ISO 6185. Высокий спрос на SUP, надувные лодки и SUP-доски на рынках ЕС. Британские дистрибьюторы ценят нашу быструю обработку заказов.
      icon: tabler:map-pin
    - title: Северная Америка
      description: Производство, одобренное береговой охраной США. Склад в США в Монтклер, Калифорния, для быстрой доставки на Западном побережье. Растущий спрос на рыболовные лодки, спасательные суда и рекреационные SUP.
      icon: tabler:map-pin
    - title: Австралия и Океания
      description: Сильный рынок для SUP-лодок и надувных тендеров. Австралийские дистрибьюторы ценят наши лодки из Hypalon за УФ-стойкость в суровых солнечных условиях. Быстрая доставка с нашего азиатского предприятия.
      icon: tabler:map-pin
    - title: Ближний Восток
      description: Растущий спрос на патрульные и спасательные катера. Наши SUP с алюминиевым корпусом популярны среди береговой охраны и операторов безопасности. Индивидуальные конфигурации для условий высоких температур.
      icon: tabler:map-pin
features3_distribution:
  tagline: Распределительная сеть
  title: Сотрудничество с дистрибьюторами<br />по всему миру
  subtitle: Мы работаем с авторитетными дистрибьюторами морского оборудования, брендами водных видов спорта и государственными закупочными организациями.
  isBeforeContent: false
  columns: 3
  items:
    - title: Со-бренд программы
      description: 'Производство под частной маркой для глобальных брендов водных видов спорта. Мы занимаемся всем: от дизайна до производства и прямой доставки.'
      icon: tabler:building
    - title: Сеть дистрибьюторов
      description: Авторизованные дистрибьюторы в более чем 20 странах имеют запасы и предоставляют локальную поддержку. Приветствуются запросы новых дистрибьюторов.
      icon: tabler:users
    - title: Правительственный и институциональный
      description: Прямые поставки береговой охране, поисково-спасательным организациям и программам военных закупок. Соответствие требованиям институциональных закупок.
      icon: tabler:building-community
steps2_logistics:
  title: Глобальная логистика и поддержка
  subtitle: От фабрики до места назначения — мы управляем всей цепочкой поставок.
  items:
    - title: Варианты доставки
      description: Морские перевозки (FOB Циндао), авиаперевозки для срочных заказов и экспресс-доставка для образцов и запчастей.
      icon: tabler:truck-delivery
    - title: Склад в США
      description: 'Запас хранится в Монтклер, Калифорния, для быстрой доставки по Северной Америке. Западное побережье: 2-3 дня, Центр: 3-4 дня, Восточное побережье: 4-5 дней.'
      icon: tabler:building-warehouse
    - title: Запасные части
      description: Оригинальные запасные части afarer и расходные материалы постоянно в наличии. Стандартные детали отгружаются в течение 24 часов.
      icon: tabler:package
    - title: Техническая поддержка
      description: Прямая линия с нашей инженерной командой для технических вопросов, советов по ремонту и поддержки переоборудования. Мы поддерживаем лодки, построенные 20 лет назад.
      icon: tabler:headset
cta:
  title: Хотите стать дистрибьютором?
  subtitle: Мы активно расширяем нашу дистрибьюторскую сеть. Свяжитесь с нашей экспортной командой, чтобы обсудить возможности партнерства.
  actions:
    - variant: primary
      text: Запрос о партнерстве
      href: /contact
    - text: Просмотрите наш ассортимент продукции
      href: /products

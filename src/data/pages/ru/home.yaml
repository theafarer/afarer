meta:
  title: Надувные SUP-борды Afarer | Иди дальше. Греби сильнее.
  description: Откройте надувные сапборды Afarer для универсального катания, туринга, йоги, рыбалки и приключений на природе. Найдите свой идеальный SUP и исследуйте больше на воде.
  keywords:
    - надувной сапборд
    - надувной sup
    - универсальный sup
    - туринговый sup
    - sup для йоги
    - sup для рыбалки
    - семейный сапборд
    - портативный сапборд
hero:
  tagline: Надувные сапборды
  title: Надувные сапборды для любых приключений
  slogan: Иди дальше. Греби сильнее.
  subtitle: Откройте свободу гребли с Afarer. Исследуйте продуманные надувные SUP-борды для спокойных дней на озере, приключений у побережья, фитнеса и многого другого.
  taglineSection: Создано для уверенности. Сконструировано, чтобы выделяться.
  actions:
    - variant: primary
      text: Найти свой борд
      href: /size-guide/
      icon: tabler:compass
    - text: Смотреть SUP-борды
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Почему Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Надувные сапборды Afarer скользят по спокойной воде на рассвете — созданы для любых приключений
who_we_serve:
  tagline: Гребите с нами
  title: Найдите свой путь по воде
  subtitle: У каждого гребца своё представление об приключении. Откройте сапборд Afarer, созданный под ваш стиль катания.
  items:
    - title: Новички и любители
      keywords: надувной sup для новичков, универсальный сапборд, стабильный sup
      description: Широкие, стабильные универсальные борды, с которыми первый гребок ощущается естественно и которые растут вместе с вами.
      icon: tabler:users
      cta: Найти первый борд
      link: /all-around-sup/
    - title: Туринг и приключения
      keywords: туринговый sup, сапборд для дальних дистанций, экспедиционный sup
      description: Более длинные и узкие борды, которые держат курс, скользят дальше и везут снаряжение в многодневных походах.
      icon: tabler:building
      cta: Смотреть туринг-борды
      link: /touring-sup/
    - title: Йога и фитнес
      keywords: sup для йоги, фитнес-сапборд, широкий стабильный sup
      description: Широкие, стабильные платформы со свободой движений — для утренних практик, тренировок и баланса на тихой воде.
      icon: tabler:heart
      cta: Смотреть SUP для йоги
      link: /yoga-sup/
    - title: Рыбалка и семья
      keywords: sup для рыбалки, семейный сапборд, стабильная рыболовная платформа
      description: Стабильные, практичные платформы для рыбалки, катания с детьми и долгих спокойных дней на воде.
      icon: tabler:users
      cta: Смотреть SUP для рыбалки
      link: /fishing-sup/
proof_points:
  title: Испытано за пределами шоурума
  subtitle: Дизайн, характеристики и качество, которые можно проверить — на воде и в цифрах.
  items:
    - metric: 10+
      label: Годы дизайна для воды
      detail: С 2012 года, совершенствуя доску за доской
    - metric: 50+
      label: Страны на воде
      detail: Паддлеры и партнёры по всему миру
    - metric: 12–15
      label: Ядро drop-stitch в PSI
      detail: Жёсткий там, где нужно, компактный в сложенном виде
    - metric: 100%
      label: Испытано под давлением, доска за доской
      detail: Проверяется перед отправкой
business_solutions:
  tagline: Почему он едет иначе
  title: Характер, который чувствуется с первого гребка
  subtitle: Четыре столпа, отточенных реальной водой — производительность, дизайн, конструкция и качество.
  items:
    - title: Ходовые качества
      description: Формы, настроенные на стабильность, скольжение и уверенность на волне — каждый гребок сливается с водой.
      icon: tabler:shield-check
    - title: Выразительный дизайн
      description: Коллекции, вдохновлённые приливами, дикой природой и энергией побережья — борды, с которыми хочется быть заметным.
      icon: tabler:package
    - title: Проверенная конструкция
      description: Плотные drop-stitch сердечники, усиленные боковины и сварные швы, рассчитанные на постоянную эксплуатацию.
      icon: tabler:headset
    - title: Проверенное качество
      description: Испытания под давлением, визуальный контроль, понятная гарантия и отзывчивая поддержка после покупки.
      icon: tabler:truck-delivery
cta:
  title: Найдите свой следующий борд.
  subtitle: Первый гребок или самый длинный маршрут — мы выведем вас на воду.
  actions:
    - variant: primary
      text: Открыть коллекцию
      href: /inflatable-sup/
      icon: tabler:send
    - text: Запросить каталог
      href: /resources/download-catalog/

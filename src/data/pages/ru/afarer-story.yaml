timeline:
  - year: Две тысячи двенадцать
    title: Основание морского производства
    body: >-
      afarer начинался как специализированная мастерская по производству надувных катеров в Циндао, Китай, ориентированная на морское мастерство и производство надувных лодок. Основной упор делался на создание надежных надувных изделий благодаря практическому инженерному опыту и производственной
      дисциплине.
  - year: Две тысячи пятнадцатый
    title: Первый экспорт и сертификация CE
    body: Первые экспортные заказы поступили в Японию и Корею. Была получена сертификация CE для основных линеек продукции, ознаменовав выход afarer на международные рынки. Компания начала обслуживать коммерческих и частных пользователей за пределами Китая.
  - year: Две тысячи восемнадцать
    title: Расширение завода
    body: Переезд на производственное предприятие площадью 12,000 м². Добавлены линии RF-сварки и производственные мощности по даровому стежку, что позволило увеличить масштабы производства и улучшить системы контроля качества.
  - year: Две тысячи двадцать
    title: Создание исследовательского центра
    body: Открыт специализированный научно-исследовательский центр с лабораторией ПВХ-тканей, гидродинамическим испытательным бассейном и студией моделирования CAD/FEA. Разработка продуктов расширилась в направлении легких конструкций, повышенной долговечности и пользовательского дизайна.
  - year: Две тысячи двадцать два
    title: Сертификация и глобальный рост
    body: Получена сертификация ISO 9001. Штат расширен до 14 инженеров R&D и более 200 рабочих. Продукция начала поступать к клиентам по всей Европе, Америке и Азиатско-Тихоокеанскому региону через дистрибьюторские и со-бренд партнерства.
  - year: Две тысячи двадцать четыре
    title: Студия инноваций и дизайна
    body: Запущена студия полного цикла дизайна и инноваций для индивидуальных со-бренд проектов — от концепции до производства. Усилены профессиональные морские направления, включая спасательные, коммерческие и государственные заказы.
  - year: Две тысячи двадцать шесть
    title: Создавая будущее исследования вод
    body: Сегодня afarer продолжает разрабатывать надувные лодки, SUP-системы и индивидуальные морские решения, соединяя людей и организации с водными просторами мира. Обслуживается более 50 стран, годовая мощность — свыше 15,000 единиц.
content_founding:
  tagline: Начало
  title: Рожденные на воде
  subtitle: 'afarer начинался в прибрежной мастерской в Циндао с одной лодки и видения: создавать надувные суда, способные выдерживать реальные морские условия.'
  paragraphs:
    - В 2012 году наши основатели увидели пробел на рынке — большинство надувных лодок были либо доступными, но ненадежными, либо качественными, но непомерно дорогими. Они поверили, что есть место для производителя, предлагающего и качество, и ценность.
    - Первый корпус был построен вручную, испытан в местных водах и доработан на основе реальных отзывов рыбаков и небольших коммерческих операторов. Этот цикл обратной связи — строить, тестировать, слушать, улучшать — остается основой нашей инженерной философии по сей день.
    - К 2015 году молва распространилась за пределы Циндао. Международные дистрибьюторы начали запрашивать образцы. То, что начиналось как местная мастерская, становилось глобальным поставщиком.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Ранняя производственная мастерская afarer и процесс производства
content_growth:
  tagline: Рост и инновации
  title: От мастерской до предприятия площадью 12,000 м²
  subtitle: Постоянные инвестиции в людей, оборудование и процессы превратили afarer в современное морское производственное предприятие.
  paragraphs:
    - По мере роста спроса росло и наше предприятие. Мы расширились от небольшой мастерской до завода площадью 12,000 м² с выделенными производственными линиями для SUP-лодок, надувных лодок, SUP-досок и аксессуаров.
    - Мы инвестировали в станки ЧПУ, оборудование высокочастотной сварки, линии дарового стежка и комплексные испытательные стенды — что позволяет нам контролировать каждый аспект качества производства.
    - Сегодня наша команда из более чем 200 человек включает морских инженеров, материаловедов, специалистов по контролю качества и квалифицированных мастеров — многие из них работают в afarer с первых дней.
philosophy:
  tagline: Философия бренда
  title: Инженерная свобода на воде
  body: Свобода на воде — это не только перемещение. Это возможность открывать новые места, создавать впечатления на природе, соединять людей с природой и выполнять профессиональные задачи. Инженерия делает эту свободу возможной.
  pillars:
    - title: Надежность прежде всего
      body: Водная среда требует доверия. Продукция afarer разработана с учетом стабильности, долговечности, безопасности и неизменного качества.
    - title: Человеко-ориентированный дизайн
      body: Продукты должны служить людям, а не технологиям. Каждое дизайнерское решение начинается с понимания того, как люди используют водный транспорт, где они исследуют и с какими трудностями сталкиваются.
    - title: Доступные исследования
      body: Вода не должна принадлежать только экспертам. afarer создает оборудование, которое позволяет большему числу людей безопасно знакомиться с реками, озерами, океанами и прибрежными зонами.
    - title: Непрерывные инновации
      body: Инновации — это не только создание новых продуктов. Это улучшение каждой детали — материалов, конструкций, производства и пользовательского опыта.
engineeringDna:
  tagline: Инженерная ДНК
  title: Как afarer создает продукты
  areas:
    - title: Материаловедение
      body: afarer уделяет особое внимание выбору подходящих материалов для различных морских условий. Ключевые параметры включают устойчивость к истиранию, стойкость к УФ-излучению, стабильность давления и долговечность.
      items:
        - Стойкость к истиранию
        - УФ-стойкость
        - Стабильность давления
        - Долговечность
    - title: Конструкционное проектирование
      body: Надувные суда требуют точного баланса между жесткостью, весом, портативностью и устойчивостью. Инженерия afarer направлена на оптимизацию этих факторов с помощью технологии дарного стежка и современных методов соединения швов.
      items:
        - Жесткость
        - Оптимизация веса
        - Портативность
        - Устойчивость
    - title: Точность производства
      body: 'Каждое изделие проходит контролируемые процессы: подготовку материалов, точный раскрой, сварку и склеивание, сборку, контроль качества и проверку характеристик.'
      items:
        - Подготовка материала
        - Точный раскрой
        - Сварка и склеивание
        - Сборка и ОТК
    - title: Инженерия сценариев использования
      body: Продукты разрабатываются с учетом реальных применений — отдыха, приключений и профессионального использования — гарантируя, что каждая конструкция отвечает специфическим требованиям своей целевой среды.
      items:
        - Отдых
        - Приключения
        - Профессиональное
        - Коммерческое

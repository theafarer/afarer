warranty_section:
  title: Гарантия и послепродажная поддержка
  subtitle: Мы поддерживаем каждый продукт с прозрачными условиями гарантии, быстрой обработкой претензий и оригинальными заменяющими деталями.
  items:
    - title: 2-летняя гарантия на продукт
      desc: Все продукты Afarer имеют 2-летнюю гарантию от производственных дефектов — разрыв швов, дефекты клапанов и расслоение материала при нормальном использовании.
    - title: Пожизненная поддержка запасных частей
      desc: Оригинальные запасные части — клапаны, ремонтные комплекты, ребра, D-образные кольца — доступны для всех моделей. Мы сохраняем формы и инструменты как минимум 5 лет после окончания производства.
    - title: Ответ на претензию в течение 48 часов
      desc: Гарантийные претензии рассматриваются в течение 48 часов. Замена плат осуществляется в течение 10 рабочих дней для одобренных претензий.
    - title: Глобальная сеть ремонта
      desc: Авторизованные ремонтные центры в 15 странах. Наборы для полевых ремонтов доступны для работы в удалённых районах. Руководства по самостоятельному ремонту для незначительных повреждений.
    - title: Поддержка клиентов OEM
      desc: Выделенные аккаунт-менеджеры для B2B-партнеров. Ежеквартальные обзоры бизнеса, планирование запасов и совместная маркетинговая поддержка с брендом.
    - title: Пакет сертификации
      desc: Полная документация о соответствии предоставляется с каждой поставкой — декларация CE, отчет об испытаниях, паспорта безопасности материалов.
      link: /contact

faqs_rib:
  title: 'Часто задаваемые вопросы о SUP'
  subtitle: 'Часто задаваемые вопросы о наших лодках с жестким корпусом.'
  columns: 2
  items:
    - title: 'Какие размеры SUP-лодок предлагает afarer?'
      description: 'Мы предлагаем 35 моделей SUP от 2,5 м до 7,6 м, охватывая всё от компактных тендеров до тяжелых коммерческих и патрульных судов. Каждая модель доступна с множеством опций конфигурации.'
    - title: 'В чем разница между SUP и традиционной надувной лодкой?'
      description: 'SUP (жестко-корпусная надувная лодка) сочетает твердый стеклопластиковый или алюминиевый глубокий V-корпус с надувными трубами из Hypalon или ПВХ. Это дает устойчивость и грузоподъемность жесткой лодки с амортизацией и плавучестью надувной.'
    - title: 'Какие двигатели совместимы с SUP afarer?'
      description: 'Наши SUP поддерживают подвесные двигатели от 3 л.с. до 250 л.с. в зависимости от модели. На странице каждого продукта указана максимальная мощность двигателя. Рекомендуем проконсультироваться с дилером.'
    - title: 'Сертифицированы ли SUP afarer по CE?'
      description: 'Да. Все модели SUP для отдыха сертифицированы CE в соответствии с применимыми европейскими стандартами для прогулочных плавсредств. Коммерческие и патрульные модели соответствуют дополнительным требованиям по устойчивости и нагрузке.'
    - title: 'Какая гарантия на SUP-лодки?'
      description: 'Все SUP afarer поставляются со стандартной однолетней гарантией на производственные дефекты, покрывающей расслоение корпуса, отказ трубных швов, дефекты клапанов и проблемы с фурнитурой.'
    - title: 'Сколько воздушных камер у SUP afarer?'
      description: 'Наши SUP имеют от 3 до 7 независимых воздушных камер в зависимости от длины модели. Эта многокамерная конструкция гарантирует, что лодка остается на плаву, даже если один отсек поврежден.'

faqs_inflatable:
  title: 'Часто задаваемые вопросы о надувных лодках'
  subtitle: 'Часто задаваемые вопросы о наших надувных тузиках, байдарках и лодках.'
  columns: 2
  items:
    - title: 'Какие материалы используются в надувных лодках afarer?'
      description: 'Мы используем ПВХ военного класса (1100 денье) и премиальный Hypalon/CSM-каучук, в зависимости от модели. Оба материала стабилизированы от УФ, устойчивы к истиранию и соответствуют правилам ЕС REACH и RoHS.'
    - title: 'Как долго служат надувные лодки?'
      description: 'При правильном уходе качественная ПВХ-лодка служит 7—0 лет, а модели из Hypalon могут прослужить 15—0 лет. Регулярная чистка, УФ-защита и правильное хранение значительно продлевают срок службы.'
    - title: 'Какой уход требуется надувной лодке?'
      description: 'Основной уход включает ополаскивание пресной водой после каждого использования (особенно в соленой воде), сушку перед хранением, ежегодную проверку уплотнений клапанов и нанесение УФ-защиты на трубы. Избегайте длительного пребывания на солнце, когда не используется.'
    - title: 'Можно ли использовать надувные лодки в соленой воде?'
      description: 'Да. Все надувные лодки afarer предназначены для использования как в пресной, так и в соленой воде. Рекомендуется ополаскивать пресной водой и тщательно сушить после контакта с соленой водой для предотвращения коррозии фурнитуры и кристаллизации соли на ткани.'
    - title: 'Как хранить надувную лодку?'
      description: 'Спустите воздух, очистите и высушите лодку перед хранением. Скатайте свободно (избегайте тугих складок), храните в прохладном сухом месте вдали от прямых солнечных лучей и держите подальше от бетонных полов, чтобы предотвратить впитывание влаги.'
    - title: 'Какова грузоподъемность надувных лодок afarer?'
      description: 'Грузоподъемность варьируется от 290 кг для наших самых маленьких моделей до более 2000 кг для крупных коммерческих судов. На странице каждого продукта указана максимальная нагрузка для вашей конкретной модели.'

faqs_sup:
  title: 'Часто задаваемые вопросы о SUP'
  subtitle: 'Часто задаваемые вопросы о наших досках для гребли стоя.'
  columns: 2
  items:
    - title: 'Какие размеры SUP-досок доступны?'
      description: 'Мы предлагаем SUP-доски от 9 до 12 футов, включая универсальные, туринговые, йога и специальные дизайны. Наши бестселлеры включают Tropical Breeze (10 футов) и Ocean Voyager (11 футов).'
    - title: 'Что такое конструкция drop-stitch?'
      description: 'Конструкция drop-stitch использует тысячи полиэфирных нитей, соединяющих верхний и нижний слои доски, что позволяет ей удерживать высокое давление воздуха (15—0 PSI) и обеспечивать жесткую, стабильную платформу. Это отраслевой стандарт для премиальных надувных SUP.'
    - title: 'Каков предел веса для SUP-досок?'
      description: 'Наши SUP-доски выдерживают до 150 кг в зависимости от модели и объема. Leviathan Wake —наша модель с наибольшей вместимостью, предназначенная для крупных райдеров и занятий йогой.'
    - title: 'Предлагаете ли вы полные комплекты SUP?'
      description: 'Да. Каждая SUP-доска поставляется с полным комплектом, включающим трехсекционное алюминиевое весло, ручной насос высокого давления, спиральный лиш, рюкзак для переноски и ремонтный набор. Некоторые модели также включают съемный набор плавников.'
    - title: 'Какая гарантия на SUP-доски?'
      description: 'Все SUP-доски afarer имеют однолетнюю гарантию на производственные дефекты, включая отказ швов, дефекты клапанов и расслоение материала при нормальном использовании.'
    - title: 'Сколько времени занимает надувание SUP-доски?'
      description: 'С помощью ручного насоса полное надувание до 15 PSI занимает примерно 8—2 минут. Для более быстрого надувания мы рекомендуем наш электрический насос afarer 12В, который надувает доску менее чем за 4 минуты.'


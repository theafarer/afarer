      desc: Warranty claims acknowledged within 48 hours. Replacement boards shipped within 10 business days for approved claims.
    - title: Global Repair Network
      desc: Authorised repair centres in 15+ countries. Field repair kits available for remote operations. DIY repair guides for minor damage.

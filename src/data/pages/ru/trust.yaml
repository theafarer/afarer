steps2_manufacturing:
  title: Как мы обеспечиваем качество
  subtitle: От проверки сырья до финального теста давлением —каждый продукт проходит строгую цепочку контроля качества.
  items:
    - title: Проверка сырья
      description: Каждый рулон ПВХ-ткани проверяется на толщину, прочность на разрыв и УФ-стойкость перед поступлением в производство.
      icon: tabler:search
    - title: Контроль в процессе
      description: Сварные швы, установка клапанов и соединения камер проверяются на каждой станции во время сборки.
      icon: tabler:eye
    - title: Испытание давлением
      description: Каждый надувной продукт надувается до 1,5x номинального PSI и выдерживается в течение 24 часов для проверки удержания воздуха и целостности швов.
      icon: tabler:wind
    - title: Финальная проверка
      description: Каждый блок проверяется на отделку, фурнитуру и упаковку перед утверждением к отгрузке. Образцы партий отправляются в лабораторию для разрушающих испытаний.
      icon: tabler:clipboard-check

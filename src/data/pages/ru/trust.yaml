faqs_sup:
  title: Часто задаваемые вопросы о SUP
  subtitle: Часто задаваемые вопросы о наших досках для гребли стоя.
  columns: 2
  items:
    - title: Какие размеры SUP-досок доступны?
      description: Мы предлагаем SUP-доски от 9 до 12 футов, включая универсальные, туринговые, йога и специальные дизайны. Наши бестселлеры включают Tropical Breeze (10 футов) и Ocean Voyager (11 футов).
    - title: Что такое конструкция drop-stitch?
      description: Конструкция drop-stitch использует тысячи полиэфирных нитей, соединяющих верхний и нижний слои доски, что позволяет ей удерживать высокое давление воздуха (15–20 PSI) и обеспечивать жесткую, стабильную платформу. Это отраслевой стандарт для премиальных надувных SUP.
    - title: Каков предел веса для SUP-досок?
      description: Наши SUP-доски выдерживают до 150 кг в зависимости от модели и объема. Leviathan Wake — наша модель с наибольшей вместимостью, предназначенная для крупных райдеров и занятий йогой.
    - title: Предлагаете ли вы полные комплекты SUP?
      description: Да. Каждая SUP-доска поставляется с полным комплектом, включающим трехсекционное алюминиевое весло, ручной насос высокого давления, спиральный лиш, рюкзак для переноски и ремонтный набор. Некоторые модели также включают съемный набор плавников.
    - title: Какая гарантия на SUP-доски?
      description: Все SUP-доски afarer имеют однолетнюю гарантию на производственные дефекты, включая отказ швов, дефекты клапанов и расслоение материала при нормальном использовании.
    - title: Сколько времени занимает надувание SUP-доски?
      description: С помощью ручного насоса полное надувание до 15 PSI занимает примерно 8–12 минут. Для более быстрого надувания мы рекомендуем наш электрический насос afarer 12В, который надувает доску менее чем за 4 минуты.
faqs_materials:
  title: Материал SUP и часто задаваемые вопросы по уходу
  subtitle: Распространённые вопросы о материалах наших надувных SUP, уходе и хранении.
  columns: 2
  items:
    - title: Какие материалы используются в надувных SUP-досках Afarer?
      description: Мы используем армированный ПВХ военного класса (1100 ден), с УФ-стабилизированным, стойким к истиранию материалом, соответствующим нормам ЕС REACH и RoHS.
    - title: Как долго служат надувные SUP?
      description: При надлежащем уходе качественный надувной SUP из ПВХ служит 5–10 лет. Регулярная чистка, защита от ультрафиолетовых лучей и правильное хранение значительно продлевают срок службы.
    - title: Какое обслуживание требуется для надувной SUP?
      description: Базовое обслуживание включает промывку пресной водой после каждого использования (особенно в соленой воде), сушку перед хранением, ежегодную проверку уплотнений клапанов и избегание длительного воздействия солнца, когда изделие не используется.
    - title: Можно ли использовать надувные SUP в солёной воде?
      description: Да. Все надувные SUP-доски от Afarer предназначены как для пресной, так и для соленой воды. Мы рекомендуем ополаскивать их пресной водой и тщательно высушивать после использования в соленой воде.
    - title: Как мне хранить надувной SUP?
      description: Сдуйте, очистите и полностью высушите доску перед хранением. Скатывайте свободно (избегайте плотных складок), храните в прохладном сухом месте вдали от прямых солнечных лучей и не ставьте на бетонный пол, чтобы предотвратить впитывание влаги.
    - title: Какова грузоподъемность надувных SUP-досок Afarer?
      description: Грузоподъёмность варьируется от 100 кг для наших самых маленьких моделей до более 200 кг для более крупных досок. На странице каждого продукта указано максимально допустимое количество нагрузки для вашей конкретной модели.

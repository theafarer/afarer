features3_certifications:
  title: Сертификаты и соответствие
  subtitle: Каждый продукт независимо протестирован и сертифицирован по международным стандартам.
  columns: 3
  isBeforeContent: true
  items:
    - title: Сертификация CE
      description: Все SUP, байдарки, тузики и SUP afarer соответствуют европейскому стандарту безопасности CE для прогулочных плавсредств. Каждое изделие проходит испытания давлением, плавучестью и нагрузкой перед отправкой с фабрики.
      icon: tabler:certificate
    - title: ISO 9001
      description: Наше производственное предприятие площадью 12 000 м² в Циндао работает по системе менеджмента качества ISO 9001. Каждая партия продукции отслеживается, документируется и проходит проверку.
      icon: tabler:clipboard-check
    - title: Социальное соответствие BSCI
      description: Мы сертифицированы BSCI, что гарантирует этичные трудовые практики, безопасные условия труда и экологическую ответственность во всей цепочке поставок.
      icon: tabler:users
    - title: REACH и RoHS
      description: Все материалы — ПВХ, Hypalon, пена EVA, клеи — соответствуют правилам ЕС REACH и RoHS. Никаких запрещенных веществ, никаких компромиссов.
      icon: tabler:flask
    - title: Лаборатория испытаний материалов
      description: Внутренняя лаборатория испытывает прочность на разрыв, УФ-стойкость, целостность швов и истирание для каждой партии ткани перед производством.
      icon: tabler:microscope
    - title: Гарантия 2 года
      description: Каждый продукт afarer поставляется с двухлетней гарантией на производственные дефекты. Мы отвечаем за то, что создаем.
      icon: tabler:shield-check

hero:
  tagline: Partners & Distribution
  title: 'Станьте партнером afarer<br />—глобальная дистрибьюторская сеть'
  subtitle: "Join afarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries."
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: Partner Programs
  title: 'Партнерские программы<br />созданы для роста'
  subtitle: 'Являетесь ли вы дистрибьютором, дилером или бренд-партнером, afarer предлагает программы, разработанные для поддержки вашего бизнеса.'
  columns: 3
  items:
    - title: 'Distributor Program'
      description: 'Эксклюзивная территориальная дистрибуция с оптовыми ценами, маркетинговой поддержкой и прямым доступом к фабрике. Минимальные обязательства в зависимости от размера территории.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Прямые дилерские цены, обучение продукту, маркетинговые материалы и гарантийная поддержка для розничных точек и интернет-магазинов.'
      icon: tabler:building-store
    - title: 'OEM/ODM Partnership'
      description: 'Полносервисное производство OEM и ODM с индивидуальным брендингом, упаковкой и спецификациями продукта. От концепции до контейнера.'
      icon: tabler:certificate
    - title: 'Brand Partnership'
      description: 'Кобрендинг, частные марки и эксклюзивные модельные программы для известных брендов в сфере морского и наружного отдыха.'
      icon: tabler:stars
    - title: 'Government & Institutional'
      description: 'Программы предпочтительных поставщиков для государственных учреждений, береговой охраны, военных и гуманитарных организаций. Документация, готовая к тендерам.'
      icon: tabler:building-community
    - title: 'Resort & Rental Partner'
      description: 'Цены для флота, стабильное качество и индивидуальный брендинг для курортов, дайвинг-центров и прокатных операций по всему миру.'
      icon: tabler:sun
content_benefits:
  tagline: Why Partner With Us
  title: 'Почему партнеры выбирают afarer'
  subtitle: 'Наши партнеры получают выгоду от реальных производственных мощностей, стабильного качества и оперативной поддержки.'
  list:
    - 'Direct Factory Access: Work directly with our manufacturing team —no middlemen. Get faster responses, better pricing, and full visibility into production.'
    - 'Customization Ready: Brand your products with custom colors, logos, packaging, and specifications. Minimum order quantities tailored to your market.'
    - 'Quality Guaranteed: ISO 9001 certified production with CE, UKCA, and BSCI compliance. Every product tested before shipping.'
    - 'Global Logistics: Shipping from Qingdao, China with FOB, CIF, and DDP options. US warehouse in Montclair, CA for North American distribution.'
    - 'Marketing Support: Product catalogs, photography, technical documentation, and digital assets to support your sales efforts.'
    - 'Training & Support: Product training for your sales team, technical support for your customers, and warranty service coordination.'
content_process:
  tagline: How to Become a Partner
  title: 'Простой процесс партнерства'
  subtitle: 'Наш процесс партнерства прост и понятен —разработан, чтобы вы могли быстро начать продавать продукцию afarer.'
  items:
    - title: 'Step 1: Submit Application'
      description: 'Заполните нашу форму заявки партнера с профилем компании, целевым рынком и интересами в продуктах.'
    - title: 'Step 2: Qualification Review'
      description: 'Наша команда по партнерству рассматривает вашу заявку и связывается с вами в течение 3 рабочих дней для обсуждения возможностей.'
    - title: 'Step 3: Agreement & Setup'
      description: 'Подпишите партнерское соглашение, настройте свой аккаунт и получите партнерские цены, маркетинговые материалы и образцы продукции.'
    - title: 'Step 4: Training & Launch'
      description: 'Обучение продукту, поддержка продаж и маркетинговые материалы предоставляются. Вы готовы начать продажи.'
cta:
  title: 'Готовы стать партнером afarer?'
  subtitle: 'Подайте заявку на партнерство, и наша команда ответит в течение 3 рабочих дней.'
  actions:
    - variant: primary
      text: Apply for partnership
      href: /contact
    - text: View our products
      href: /products

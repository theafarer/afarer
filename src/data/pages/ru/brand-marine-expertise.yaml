meta:
  title: 'Морская экспертиза — инженерия в каждом корпусе | {SITE}'
  description: 'Десятилетия морской инженерии в каждом корпусе. afarera владеет конструкцией drop stitch, морским ПВХ и профессиональным проектированием надувных SUP.'
  keywords:
    - 'морская инженерия'
    - 'производитель надувных SUP-досок'
    - 'производство paddle board'
hero:
  tagline: Морская экспертиза
  title: Десятилетия морского инжиниринга<br />в каждом корпусе
  subtitle: afarer сочетает глубокое материаловедение, прецизионное производство и реальные испытания для создания плавсредств, которые работают, когда это важно.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: команда морской инженерии и НИОКР Afarer за работой
expertise_materials:
  tagline: Наука о материалах
  title: Выбор правильного материала<br />для каждого применения
  subtitle: Мы работаем с двумя основными материалами — каждый выбран для конкретных случаев использования и требований к производительности.
  columns: 3
  items:
    - title: ПВХ морского класса
      description: Ткань ПВХ 1100 денье — наш самый универсальный материал. УФ-стабилизированный, износостойкий и соответствующий REACH. Идеален для SUP-досок, где важны вес и экономическая эффективность.
      icon: tabler:droplet
    - title: Стеклопластик и полиэтилен
      description: Стеклопластиковые SUP для премиальной жесткости и скольжения. Ротационно-формованный полиэтилен для интенсивного проката и спасательного применения, требующего максимальной ударопрочности.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Производственные возможности
  title: Прецизионное производство<br />на каждом этапе
  subtitle: Наше предприятие площадью 12 000 м² оснащено специализированным оборудованием для каждого этапа производства.
  columns: 2
  items:
    - title: ЧПУ резка
      description: Компьютеризированный раскрой обеспечивает точные, повторяемые панели ткани с минимальными отходами. Каждая деталь подходит точно, как задумано.
      icon: tabler:cpu
    - title: Высокочастотная сварка
      description: Промышленная ВЧ-сварка создает швы прочнее основного материала. Постоянный контроль температуры и давления обеспечивает герметичные уплотнения в каждом производственном цикле.
      icon: tabler:bolt
    - title: Сборка сердцевины с пропущенными стежками
      description: Тысячи полиэфирных нитей соединяют верхний и нижний слои ткани, обеспечивая надув под высоким давлением (15-20 PSI) для жестких, стабильных SUP-досок и полов.
      icon: tabler:building-arch
    - title: Испытание под давлением
      description: Каждое надувное изделие проходит проверку давлением перед отправкой. Трубы SUP тестируются при давлении в 1,25 раза выше номинального — если выдерживает там, будет работать на воде.
      icon: tabler:wind
    - title: Испытание прочности шва
      description: Случайные образцы из каждой производственной партии проходят разрушающий тест прочности швов. Результаты регистрируются и отслеживаются до конкретных производственных серий.
      icon: tabler:files
    - title: Тестирование воды
      description: Каждая модель SUP проходит морские испытания перед сертификацией. Реальное тестирование в прибрежных условиях подтверждает производительность, управляемость и устойчивость.
      icon: tabler:droplet
expertise_design:
  tagline: Дизайн и инжиниринг
  title: Спроектировано для реальных условий
  subtitle: Наша философия дизайна начинается с того, как доска будет использоваться, — затем строит инжиниринг вокруг этого случая использования.
  items:
    - title: Конструкция производительного корпуса
      description: Каждая форма корпуса настроена под свой сценарий использования — водоизмещающие носы для скольжения в турах, добавленный рокер для маневренности в сёрфе, плоские стабильные профили для рыбалки и йоги.
    - title: Безопасность drop-stitch
      description: Каждая доска имеет жесткую сердцевину drop-stitch с усиленными бортами. Если секция повреждена, высокопрочная структура drop-stitch сохраняет доску в рабочем состоянии.
    - title: Эргономичная компоновка палубы
      description: Зонирование деки, положение ручки для переноски и точки крепления спроектированы с учетом комфорта райдера при длительном использовании — в турах, на рыбалке или на патрулировании.
    - title: Пользовательская конфигурация
      description: Цвета бортов, конфигурация падов, крепления аксессуаров, вместимость снаряжения — каждая модель может быть настроена в соответствии с конкретными эксплуатационными требованиями.

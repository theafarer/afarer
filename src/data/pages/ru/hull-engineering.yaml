intro: >-
  Корпус — это основа любой надувной SUP-доски. Он должен быть достаточно лёгким для эффективного скольжения, достаточно прочным, чтобы выдерживать скалистые берега, и достаточно жёстким, чтобы преобразовывать каждый гребок в поступательное движение. В Afarer наша студия инжиниринга корпуса сочетает
  передовое CAD-моделирование, анализ методом конечных элементов (FEA) и десятилетия практического опыта проектирования досок, чтобы создавать корпуса, оптимизированные для их конкретной дисциплины — а не универсальные формы, адаптированные из каталога.
content_html: >
  <h2>Там, где прочность встречается с гидродинамикой</h2>

  <p>Мы работаем с тремя основными конструктивными платформами — усиленными сердечниками из drop-stitch ПВХ, ламинатами из стеклопластика ручной укладки и ротационно формованным полиэтиленом — и обладаем инженерными возможностями для проектирования, моделирования и проверки каждой из них на собственном производстве.</p>


  <h2>Инструменты проектирования и стандарты</h2>

  <p>Наша цифровая инженерная среда включает:</p>

  <table>
    <thead><tr><th>Возможность</th><th>Программное обеспечение / Инструмент</th><th>Применение</th></tr></thead>
    <tbody>
      <tr><td>3D-параметрическое моделирование</td><td>SolidWorks Professional</td><td>Поверхность корпуса, усиление рельсов и стрингеров, компоновка палубы, точки крепления снаряжения</td></tr>
      <tr><td>Метод конечных элементов</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Карты напряжений, модальный анализ, моделирование ударов и столкновений</td></tr>
      <tr><td>Вычислительная гидродинамика</td><td>Ansys Fluent / Star-CCM+</td><td>Прогнозирование гидродинамического сопротивления, оптимизация дифферента</td></tr>
      <tr><td>Инжиниринг ламинатов</td><td>ESAComp / CADEC</td><td>Укладка слоев стеклопластика, выбор сердечника, оценка массы</td></tr>
      <tr><td>Моделирование течения расплава в форме</td><td>Moldex3D</td><td>Прогнозирование толщины стенки при ротационном формовании</td></tr>
    </tbody>
  </table>


  <h2>Наш инженерный процесс</h2>

  <p>Каждая конструкция корпуса — стандартная модель или полностью индивидуальный проект — проходит строгий пятиэтапный процесс:</p>

  <ol>
    <li><strong>Сбор концепции и требований</strong> — Мы встречаемся с вами, чтобы определить вес райдера и полезную нагрузку, скоростной диапазон, условия воды, требования к транспортировке и любое специальное оборудование (палубные крепления, места фиксации груза, интеграция аксессуаров).</li>
    <li><strong>3D-моделирование поверхности и гидростатический расчет</strong> — Форма корпуса моделируется в SolidWorks и проверяется на гидростатическую остойчивость, распределение объёма и восстанавливающий момент с помощью встроенных инструментов анализа.</li>
    <li><strong>Прочностной анализ методом конечных элементов (МКЭ)</strong> — Определяются расчетные случаи: статические (райдер + снаряжение), динамические (удары при посадке на волну при 5g) и посадка на мель (удар о скалистый берег на скорости 3 м/с). Анализируются контуры напряжений; обязательным является коэффициент запаса ≥ 2.5.</li>
    <li><strong>Оптимизация сопротивления с помощью CFD</strong> — Корпус моделируется при трех вариантах загрузки и на пяти скоростях. Смоченная поверхность, угол дифферента и остаточное сопротивление последовательно уменьшаются.</li>
    <li><strong>Проверка конструкции и выпуск</strong> — Полный инженерный пакет (3D-модель, отчет МКЭ, отчет CFD, оценка массы, книга слоев) проверяется нашим старшим инженером перед передачей в прототипную мастерскую.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Распределение напряжений по МКЭ — корпус туристической SUP (усиленный drop-stitch)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Коэффициент запаса при максимальной полезной нагрузке</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Снижение сопротивления по сравнению с предыдущим поколением</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 кН/м²</span>
        <span class="text-gray-500">Пиковое ударное давление (проектный предел)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 ч</span>
        <span class="text-gray-500">Суммарное время расчетов МКЭ в 2025 году</span>
      </div>
    </div>
  </div>


  <h2>Кастомизация: ваш корпус — ваши правила</h2>

  <p>Ни у каких двух гребцов нет одинаковых требований. Рыболовной SUP нужен широкий, стабильный глиссирующий корпус; туристической доске — водоизмещающий корпус, максимизирующий скольжение; серфинговой SUP — отзывчивые рельсы и настроенный рокер. Мы не подгоняем вашу задачу под существующую
  форму корпуса. Мы проектируем, исходя из вашего технического задания.</p>

  <p>Примеры недавних проектов по индивидуальному проектированию корпусов:</p>

  <ul>
    <li>Удлинённая туристическая SUP для карибского оператора экотуров, с усиленным носом для высадки на пляж (+15 % толщины рельса).</li>
    <li>Высокозаметная патрульная SUP для портовых властей, с интегрированными креплениями для снаряжения и тактическими рельсами.</li>
    <li>Экспедиционная туристическая SUP для прокатного флота, с усиленными рельсами и дополнительными креплениями для груза.</li>
  </ul>


  <h2>Наши инженеры</h2>

  <p>Студию возглавляет старший инженер с 14-летним опытом проектирования высокоэффективных досок; его поддерживают два инженера-механика, специализирующихся на МКЭ и CFD. Все трое имеют ученые степени в области морского или машиностроительного инжиниринга, полученные в международно признанных
  университетах. Команда регулярно публикуется в отраслевых журналах и выступает на международных конференциях по инжинирингу высокоэффективных изделий для паддл-спорта.</p>


  <h2>Станьте нашим партнером в создании вашего следующего корпуса</h2>

  <p>От первого концептуального эскиза до итогового отчета по напряжениям наша студия инжиниринга корпуса — ваш партнер в создании доски, которая не просто построена, а инженерно проработана. Мы вкладываем часы моделирования заранее, чтобы каждый шов, каждый слой ламината и каждый изгиб корпуса
  были на месте не случайно.</p>

  <p>Нужна ли вам небольшая доработка существующей модели или совершенно новый проект «с чистого листа» — мы готовы обсудить ваши требования.</p>

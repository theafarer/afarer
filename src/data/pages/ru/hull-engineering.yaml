intro: >-
  Корпус является основой любого РИБа или надувной лодки. Он должен быть достаточно лёгким, чтобы эффективно идти по планированию, достаточно прочным, чтобы поглощать ударные нагрузки, и сохранять стабильные размеры в широком диапазоне температур. В Afarer наша студия проектирования корпусов
  сочетает передовое CAD-моделирование, анализ методом конечных элементов (FEA) и десятилетия практического опыта в судостроении, чтобы создавать корпуса, оптимизированные для их конкретной задачи — а не универсальные формы, адаптированные из каталога.
content_html: >
  <h2>Там, где прочность встречается с гидродинамикой</h2>

  <p>Мы работаем с тремя основными материалами корпуса — ротационно формованным HDPE, сварным алюминием морского класса и стеклопластиком ручной укладки — и обладаем инженерными возможностями для проектирования, моделирования и проверки каждого из них на собственном производстве.</p>


  <h2>Инструменты проектирования и стандарты</h2>

  <p>Наша цифровая инженерная среда включает:</p>

  <table>
    <thead><tr><th>Возможность</th><th>Программное обеспечение / Инструмент</th><th>Применение</th></tr></thead>
    <tbody>
      <tr><td>3D-параметрическое моделирование</td><td>SolidWorks Professional</td><td>Поверхность корпуса, система стрингеров, кронштейн двигателя, компоновка палубы</td></tr>
      <tr><td>Метод конечных элементов</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Карты напряжений, модальный анализ, моделирование ударов и столкновений</td></tr>
      <tr><td>Вычислительная гидродинамика</td><td>Ansys Fluent / Star-CCM+</td><td>Прогнозирование гидродинамического сопротивления, оптимизация дифферента</td></tr>
      <tr><td>Инжиниринг ламинатов</td><td>ESAComp / CADEC</td><td>Укладка слоев стеклопластика, выбор сердечника, оценка массы</td></tr>
      <tr><td>Моделирование течения расплава в форме</td><td>Moldex3D</td><td>Прогнозирование толщины стенки при ротационном формовании</td></tr>
    </tbody>
  </table>


  <h2>Наш инженерный процесс</h2>

  <p>Каждая конструкция корпуса — стандартная модель или полностью индивидуальный проект — проходит строгий пятиэтапный процесс:</p>

  <ol>
    <li><strong>Сбор концепции и требований</strong> — Мы встречаемся с вами, чтобы определить полезную нагрузку, диапазон скоростей, допустимое волнение моря, буксировочные требования и любое специальное служебное оборудование (палубные люки, расположение консоли, интеграция топливных баков).</li>
    <li><strong>3D-моделирование поверхности и гидростатический расчет</strong> — Форма корпуса моделируется в SolidWorks и проверяется на гидростатическую остойчивость (GM, плечо восстанавливающего момента) с помощью встроенных инструментов анализа.</li>
    <li><strong>Прочностной анализ методом конечных элементов (МКЭ)</strong> — Определяются расчетные случаи: статические (экипаж + снаряжение), динамические (удары при глиссировании при 5g) и ударные (сброс с гребня волны на скорости 3 м/с). Анализируются контуры напряжений; обязательным является коэффициент запаса ≥ 2.5.</li>
    <li><strong>Оптимизация сопротивления с помощью CFD</strong> — Корпус моделируется при трех вариантах загрузки и на пяти скоростях. Смоченная поверхность, угол дифферента и остаточное сопротивление последовательно уменьшаются.</li>
    <li><strong>Проверка конструкции и выпуск</strong> — Полный инженерный пакет (3D-модель, отчет МКЭ, отчет CFD, оценка массы, книга слоев) проверяется нашим старшим инженером-кораблестроителем перед передачей в прототипную мастерскую.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Распределение напряжений по МКЭ — корпус патрульного катера (алюминий 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Коэффициент запаса при максимальной полезной нагрузке</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Снижение сопротивления по сравнению с предыдущим поколением</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 кН/м²</span>
        <span class="text-gray-500">Пиковое ударное давление (проектный предел)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 ч</span>
        <span class="text-gray-500">Суммарное время расчетов МКЭ в 2025 году</span>
      </div>
    </div>
  </div>


  <h2>Кастомизация: ваш корпус — ваши правила</h2>

  <p>У двух разных операторов никогда не бывает одинаковых требований. Патрульному катеру для гавани нужен корпус с малой килеватостью для остойчивости на малых скоростях; быстроходному перехватчику — глубокое V с брызгоотбойниками; лодке для дайвинга — широкий корпус и низкий транец. Мы не подгоняем
  вашу задачу под существующую форму корпуса. Мы проектируем, исходя из вашего технического задания.</p>

  <p>Примеры недавних проектов по индивидуальной разработке корпусов:</p>

  <ul>
    <li>Удлиненный корпус из HDPE длиной 6.8 м для карибского туроператора с усиленным носом для высадки на пляж (+15 % толщина днища).</li>
    <li>Легкий алюминиевый патрульный катер длиной 7.2 м для береговой охраны с интегрированными перегородками топливных баков и ребрами жесткости шкафов для оборудования.</li>
    <li>Стеклопластиковая лодка для дайвинга длиной 5.5 м с заниженным транцем и двумя аккумуляторными боксами, спроектированная для удобного подъема ныряльщиков на борт.</li>
  </ul>


  <h2>Наши инженеры</h2>

  <p>Конструкторское бюро возглавляет старший инженер-кораблестроитель с 14-летним опытом проектирования высокоскоростных судов; его поддерживают два инженера-механика, специализирующихся на МКЭ и CFD. Все трое имеют ученые степени в области морского машиностроения или кораблестроения, полученные в
  международно признанных университетах. Команда регулярно публикуется в отраслевых журналах и выступает на таких конференциях, как Международная конференция по высокоскоростным морским судам.</p>


  <h2>Станьте нашим партнером в создании вашего следующего корпуса</h2>

  <p>От первого концептуального эскиза до итогового отчета по напряжениям наше бюро по проектированию корпусов — ваш партнер в создании лодки, которая не просто построена, а инженерно проработана. Мы вкладываем часы моделирования заранее, чтобы каждый шов, каждый слой ламината и каждый изгиб корпуса
  были на месте не случайно.</p>

  <p>Нужна ли вам небольшая доработка существующей модели или совершенно новый проект «с чистого листа» — мы готовы обсудить ваши требования.</p>

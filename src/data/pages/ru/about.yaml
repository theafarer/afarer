meta:
  title: 'О afarer — надувной SUP и бренд водных видов спорта | {SITE}'
  description: 'afarer — глобальный бренд надувных SUP и водных видов спорта, управляемый Aquafarer LLC (США) и командой нашей операционной базы в Циндао. Узнайте о нашей истории, инженерии, сертифицированном качестве и партнёрских программах по странам.'
  keywords:
    - 'бренд надувных SUP'
    - 'бренд надувных лодок'
    - 'бренд водных видов спорта'
    - 'страновой дистрибьютор SUP'
    - 'кобрендинговые коллекции SUP'
hero:
  tagline: О нас
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Фабрика и цех afarer
  title: |
    Морское машиностроение <br />
    в стиле <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Мы начинали в прибрежной мастерской с одной лодкой и твёрдым убеждением: морские изделия должны разрабатываться так, будто от них зависят жизни — потому что так и есть. Сегодня мы отгружаем в 40+ стран, но каждый корпус по-прежнему проходит через те же руки, что основали компанию.'
stats:
  title: В цифрах
  columns: 4
  stats:
    - title: Доставлено корпусов
      amount: '2 400+'
    - title: Стран доставки
      amount: '40'

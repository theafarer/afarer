features3_what_we_build:
  title: Что мы строим
  subtitle: Сфокусированная линейка продукции, которую мы знаем досконально — никаких недоработанных экспериментов и чужих брендов.
  columns: 3
  isBeforeContent: true
  items:
    - title: SUP-лодки
      description: SUP с алюминиевыми корпусами от 3,3 до 7,5 м. Разработаны для патрулирования, дайвинга, рыбалки и семейного отдыха.
      icon: tabler:ship
    - title: Надувные лодки
      description: Надувные лодки из ПВХ и Hypalon от 2,4 до 4,2 м. Лёгкие, прочные и удобные в хранении.
      icon: tabler:speedboat
    - title: Тендеры для суперъяхт
      description: Компактные SUP с высокими характеристиками, изготовленные под стиль вашей яхты.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Аксессуары
      description: Вёсла, насосы, чехлы, гермомешки, топливные баки и электроника. Всё совместимо с нашими лодками.
      icon: tabler:package
    - title: Модернизация и ремонт
      description: Замена баллонов, модернизация электроники и обновление двигателей.
      icon: tabler:tool
    - title: Изделия на заказ
      description: Проектирование под конкретную задачу для коммерческих, научных и военных заказчиков.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Обсуждение дизайна лодки
steps2_values:
  title: Наши ценности
  subtitle: Три принципа, которые формируют каждый продукт с первого дня.
  items:
    - title: Строй так, будто в лодке твоя семья
      description: Каждый корпус, сварной шов и крепёж обрабатываются так, будто ими будут пользоваться наши собственные семьи.
      icon: tabler:heart
    - title: Разрабатывай до продажи
      description: Если спецификация неверна, мы меняем спецификацию — а не клиента.
      icon: tabler:settings
    - title: Поддержка, переживающая гарантию
      description: Двадцатилетние корпуса всё ещё звонят нам за запчастями, и мы всё ещё отвечаем.
      icon: tabler:headset
steps2_milestones:
  title: Вехи
  subtitle: Краткая версия истории afarer.
  isReversed: true
  items:
    - title: Основана в прибрежной мастерской
      description: Начата двумя корабельными инженерами с ЧПУ-станком и упрямой идеей.
      icon: tabler:building-factory
    - title: Первые 1 000 доставленных корпусов
      description: Достигнуто на седьмой год, в основном через «сарафанное радио» и постоянных клиентов.
      icon: tabler:circle-check
    - title: Международная экспортная программа
      description: Отгрузка в 40+ стран с локализованными партнёрами по поддержке на пяти континентах.
      icon: tabler:world
features2_locations:
  title: Наши офисы
  tagline: Где нас найти
  columns: 3
  items:
    - title: Головной офис и цех
      description: SUP с алюминиевыми корпусами от 3,3 до 7,5 м. Разработаны для патрулирования, дайвинга, рыбалки и семейного отдыха.
    - title: Сервисный центр ЕС
      description: Средиземноморский порт — модернизация, ремонт и гарантийное обслуживание для европейских клиентов.
    - title: Партнёрская сеть АТР
      description: Авторизованные сервисные партнёры в Австралии, Японии, Сингапуре и Гонконге.
brand_hub_tagline: Бренд
brand_hub_title: Исследуйте наш бренд
brand_hub_subtitle: Dive deeper into our marine engineering expertise, global presence, and the principles that drive us.
brand_hub_cards:
  - title: Морская экспертиза
    desc: Десятилетия исследований в области материаловедения, прецизионного производства и испытаний в реальных условиях — от изготовления из ПВХ/Гипалона до проектирования корпуса с глубокой V-формой и технологии drop-stitch.
    link: /brand-marine-expertise
    link_label: Узнать больше →
  - title: Глобальное присутствие
    desc: Доставка в более чем 50 стран с нашего предприятия в Циндао с уполномоченными сервисными партнёрами по всей Европе, Азиатско-Тихоокеанскому региону и Америке.
    link: /brand-global-presence
    link_label: Узнать больше →
  - title: Почему afarer
    desc: 'Бренд, построенный на проверенном качестве — двойная сертификация (ISO 9001 + BSCI), соответствие CE и эксклюзивные партнёрства по странам с ограниченными кобрендинговыми коллекциями для предприятий водных видов спорта.'
    link: /brand-why-afarer
    link_label: Узнать больше →

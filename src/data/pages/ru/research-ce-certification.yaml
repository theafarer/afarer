hero:
  tagline: Соответствие
  title: Как работает сертификация CE для надувных водных судов
  subtitle: Чтение займёт 7 минут
content_html: >
  <h2>Что такое сертификация CE?</h2>

  <p>Маркировка CE (Conformité Européenne) указывает, что продукт соответствует требованиям ЕС по охране здоровья, безопасности и окружающей среды. Для надувных водных судов соответствующая нормативная база зависит от категории продукции.</p>


  <h2>Применимые директивы</h2>


  Директива о рекреационных <h3>судах (2013/53/EU)</h3>

  <p>Основная задача для большинства надувных лодок — SUPs и каяков. Он применяется к рекреационным судам длиной корпуса от 2,5 м до 24 м, частично готовым лодкам (для поставки OEM) и личным водным судам.</p>


  <h3>Регламент о средствах индивидуальной защиты (2016/425)</h3>

  <p>Спасательные жилеты, средства плавучести и средства безопасности, поставляемые с водными судами, должны соответствовать требованиям Регламента СИЗ, включая типовую экспертизу (Модуль B) уведомленным органом и контроль качества производства (Модуль D или E).</p>


  <h2>Процесс сертификации</h2>

  <ol>
    <li>Классификация продукции: определить категорию ремесленного дизайна (A – D согласно ISO 8666)</li>
    <li>Применимые стандарты: EN ISO 6185 (части 1–4), EN ISO 10087 (HIN), EN ISO 14945 (строительный номер)</li>
    <li>Подготовка технической документации: проектные чертежи, материальный лист, сертификаты материалов, оценка рисков</li>
    <li>Типовые испытания: плавучость, устойчивость, грузоподъёмность, испытания материалов, прочность шва, удержание воздуха</li>
    <li>Заводский производственный контроль: Аудит производственных процессов уведомлённым органом</li>
    <li>Декларация соответствия: производитель подписывает DoC, наставляет маркировку CE</li>
  </ol>


  <h2>Уведомленные органы для надувных водных судов</h2>

  <p>Распространённые NB включают Bureau Veritas (Франция), DNV GL (Германия), RINA (Италия), TÜV Rheinland / TÜV SÜD (Германия).</p>


  <h2>Хронология и стоимость</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <TR класс="BG-Gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">фаза</th>
        <th class="p-3 текст-слева шрифт-полужирный текст-серый-900 рамка">Длительность</th>
        <th class="p-3 text-left font-semibold text-gray-border">Типичная стоимость (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Подготовка технического файла</td><td class="p-3 граница">2 – 4 недели</td><td class="p-3 граница">2 000 – 5 000</td></tr>
      <tr><TD класс="P-3 граница">Типовое тестирование</td><TD класс="P-3 граница">4 – 8 недель</td><TD класс="P-3 граница">8 000 – 20 000</td></tr>
      <tr><TD класс="P-3 граница">Заводской аудит</td><td class="P-3 граница">1 – 2 дня (на месте)</td><TD класс="P-3 граница">3 000 – 6 000</td></tr>
      <tr><td class="p-3 граница">Всего (первый продукт)</td><td class="p-3 граница">8 – 14 недель</td><TD класс="P-3 граница">13 000 – 31 000</td></tr>
    </tbody>
  </table>


  <h2>Что это значит для покупателей</h2>

  <p>При покупке надувных судов сертифицированных CE всегда проверяйте маркировку CE на номерной знаке производителя, наличие действующего DoC, указанный номер уведомленного органа, а в руководстве пользователя есть инструкции по безопасности на вашем местном языке. Все продукты Afarer имеют
  сертификацию CE с полной прослеживаемостью к отчетам аудита уведомленных органов.</p>

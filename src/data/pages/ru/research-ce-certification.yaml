hero:
  tagline: Соответствие
  title: Как работает сертификация CE для надувных водных судов
  subtitle: Чтение займёт 7 минут
content_html: |-
  <h2>Что такое сертификация CE?</h2>
  <p>Маркировка CE (Conformit&eacute; Europ&eacute;enne) означает, что продукт соответствует требованиям ЕС в области охраны здоровья, безопасности и окружающей среды. Для надувных плавсредств применимая нормативная база зависит от категории продукции.</p>

  <h2>Применимые директивы</h2>

  <h3>Директива о прогулочных судах (2013/53/EU)</h3>
  <p>Основная директива для большинства надувных лодок, SUP-досок и байдарок. Она распространяется на прогулочные суда длиной корпуса от 2.5 m до 24 m, на частично достроенные лодки (для поставок OEM) и гидроциклы.</p>

  <h3>Регламент о средствах индивидуальной защиты (2016/425)</h3>
  <p>Спасательные жилеты, средства плавучести и защитное снаряжение, поставляемые с плавсредствами, должны соответствовать требованиям Регламента о СИЗ, включая типовое испытание (модуль B) уведомлённым органом и контроль качества производства (модуль D или E).</p>

  <h2>Процесс сертификации</h2>
  <ol>
    <li>Классификация продукции: определение категории конструкции судна (A – D по ISO 8666)</li>
    <li>Применимые стандарты: EN ISO 6185 (части 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (табличка изготовителя)</li>
    <li>Подготовка технического файла: чертежи, спецификация материалов, сертификаты на материалы, оценка рисков</li>
    <li>Типовые испытания: плавучесть, остойчивость, грузоподъёмность, испытания материалов, прочность швов, удержание воздуха</li>
    <li>Производственный контроль на фабрике: аудит производственных процессов уведомлённым органом</li>
    <li>Декларация о соответствии: изготовитель подписывает DoC и наносит маркировку CE</li>
  </ol>

  <h2>Уведомлённые органы для надувных плавсредств</h2>
  <p>К распространённым NB относятся Bureau Veritas (Франция), DNV GL (Германия), RINA (Италия), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Германия).</p>

  <h2>Сроки и стоимость</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Этап</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Срок</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Типичная стоимость (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Подготовка технического файла</td><td class="p-3 border">2 – 4 недели</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Типовые испытания</td><td class="p-3 border">4 – 8 недель</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Аудит фабрики</td><td class="p-3 border">1 – 2 дня (на месте)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Итого (первый продукт)</td><td class="p-3 border">8 – 14 недель</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Что это значит для покупателей</h2>
  <p>При покупке надувных лодок с сертификацией CE всегда проверяйте, что маркировка CE нанесена на табличку изготовителя, существует действующая DoC, указан номер уведомлённого органа, а руководство пользователя содержит инструкции по безопасности на вашем языке. Вся продукция Afarer имеет сертификацию CE с полной прослеживаемостью до отчётов об аудитах уведомлённого органа.</p>

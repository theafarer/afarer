hero:
  tagline: Лабораторная работа 03
  title: Центр сварки РФ
  subtitle: Технология диэлектрической сварки для швов, выдерживающих давление
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-1-1200w.webp
  image_alt: Диэлектрический процесс сварки и склеивания Afarer RF
intro: >-
  Надежность надувной лодки зависит только от её швов. Один слабый сварной шов может поставить под угрозу всю секцию — и в море потеря герметичности секции — это не просто неудобство; это опасность для жизни. В {SITE.name} мы инвестировали в специализированный центр радиочастотной (RF) сварки,
  который сочетает в себе промышленные диэлектрические сварочные прессы с строгим контролем процессов и постсварочным тестированием. Каждый шов, который мы производим, документируется, прослеживается и сертифицирован в соответствии с международными стандартами для надувных судов, и даже превышает их
  требования.
content_html: >-
  <h2>Наука, стоящая за швом</h2>

  <p>RF-сварка использует высокочастотную электромагнитную энергию (обычно 27.12 MHz) для возбуждения полярных молекул в ткани с PVC- или Hypalon-покрытием, генерируя тепло точно на границе раздела материалов. В отличие от сварки горячим воздухом или горячим клином, RF-сварка создаёт настоящую
  молекулярную связь — два слоя ткани сплавляются в единый гомогенный материал в зоне сварного шва, образуя соединение, прочность которого не уступает прочности основного материала.</p>


  <h2>Сварочное оборудование и контроль процесса</h2>

  <p>Наш сварочный центр оснащён:</p>

  <table>
    <thead><tr><th>Станок</th><th>Мощность / Производительность</th><th>Применение</th></tr></thead>
    <tbody>
      <tr><td>Диэлектрический RF-пресс 1</td><td>15 kW, плита 2000 × 600 mm</td><td>Основные продольные швы, соединения транца с баллоном</td></tr>
      <tr><td>Диэлектрический RF-пресс 2</td><td>10 kW, плита 1500 × 500 mm</td><td>Швы перегородок, крепления конусов, заплаты под клапаны</td></tr>
      <tr><td>RF-сварочный аппарат с CNC-управлением</td><td>8 kW, XY-стол 2500 × 1200 mm</td><td>Криволинейные швы, тиснение логотипов и панелей, прецизионные заплаты</td></tr>
      <tr><td>Автоматический сварочный аппарат с горячим клином</td><td>Регулируемая температура, макс. 1.2 m/min</td><td>Резервный метод для материалов Hypalon/CSM</td></tr>
    </tbody>
  </table>

  <p>Каждый RF-пресс оснащён замкнутой системой контроля температуры и давления. Параметры сварки — мощность, время прессования, время охлаждения, давление электрода — программируются для каждого типа материала и записываются в нашей системе управления производством (MES) для полной
  прослеживаемости.</p>


  <h2>Испытания качества сварных швов — каждый шов, каждая лодка</h2>

  <p>Целостность сварных швов проверяется по обязательному протоколу из четырёх испытаний:</p>

  <ol>
    <li><strong>Визуальный осмотр</strong> — 100 % швов осматриваются на предмет прожогов, смещения, загрязнений или неполного сплавления. Порог отбраковки: 0.5 % погонных метров.</li>
    <li><strong>Испытание на отслаивание ()</strong> — Из контрольного образца, сваренного с каждой производственной партией, вырезается полоса шириной 25 mm. Минимальное усилие отслаивания: 120 N/25 mm для PVC 1100 dtex.</li>
    <li><strong>Испытание на воздухонепроницаемость</strong> — Каждая готовая камера нагнетается до 1.5 × рабочего давления и выдерживается в течение 30 минут. Падение давления не должно превышать 2 %.</li>
    <li><strong>Испытание на термоциклирование</strong> — Образцы подвергаются 50 циклам от -20 °C до +60 °C, затем снова испытываются на отслаивание. Допустимая потеря прочности: &lt; 10 %.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Сравнение прочности на отслаивание — RF-сварка против сварки горячим воздухом (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">RF-сварка</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Горячий воздух</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Минимум</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">RF-сварка стабильно достигает 90-95 % прочности основного материала, что значительно превышает минимальный показатель.</p>
  </div>


  <h2>Профессиональная экспертиза</h2>

  <p>Нашу сварочную команду возглавляет ведущий инженер-технолог с 11-летним опытом в диэлектрической сварке тканей с покрытием. Каждый оператор проходит 6-месячную программу внутренней сертификации, прежде чем ему будет разрешено работать над серийными швами. Переаттестация требуется ежегодно и
  включает практическое испытание сварного шва в соответствии с нашим внутренним стандартом класса A (прочность на отслаивание ≥ 160 N/25 mm).</p>


  <h2>Индивидуальные сварочные решения для особых требований</h2>

  <p>Мы понимаем, что одна сварочная спецификация не подходит для каждой задачи. Наш Центр RF-сварки регулярно разрабатывает индивидуальные конфигурации швов для клиентов с особыми требованиями:</p>

  <ul>
    <li><strong>Многослойные армирующие заплаты</strong> — для зон повышенного износа, таких как привальные брусья и носовые конусы, мы разрабатываем многоходовые RF-сварные швы, которые интегрируют износостойкий внешний слой без ущерба для гибкости.</li>
    <li><strong>Токопроводящие или RF-непрозрачные швы</strong> — для военных или патрульных судов, требующих электромагнитного экранирования, мы ввариваем токопроводящие сетчатые слои в структуру шва.</li>
    <li><strong>Сварка панелей с изменением цвета</strong> — двухцветные тканевые панели (например, оранжевый корпус + серая палуба) свариваются со скрытым перехлёстом, чтобы сохранить эстетику бренда без видимой линии соединения.</li>
  </ul>


  <h2>Наши обязательства перед вами</h2>

  <p>Каждая лодка, которую мы поставляем, несёт нашу гарантию качества сварных швов: если в течение гарантийного срока при нормальной эксплуатации выйдет из строя любой шов, мы бесплатно отремонтируем или заменим повреждённую камеру и проведём расследование первопричины, чтобы предотвратить
  повторение. Это не просто гарантия — это стремление к постоянному совершенствованию на основе реальных эксплуатационных данных.</p>

  <p>Когда вы выбираете {SITE.name}, вы выбираете швы, которые спроектированы, испытаны и документированы, — а не просто сварены. В этом разница между лодкой, которая держится на воде, и лодкой, которая работает.</p>

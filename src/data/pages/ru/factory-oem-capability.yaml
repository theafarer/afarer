meta:
  title: 'Производство OEM и собственных марок | {SITE}'
  description: 'От концепции до контейнера: настройте каждую деталь вашей линейки надувных SUP. Полный сервис OEM/ODM для брендов paddle board под собственной маркой.'
  keywords:
    - 'производство SUP OEM'
    - 'собственная марка paddle board'
    - 'OEM надувной SUP'
    - 'фабрика SUP на заказ'
hero:
  tagline: Производство OEM/ODM
  title: OEM и производство под частной маркой
  subtitle: From concept to container —customize every detail of your inflatable watercraft line
intro: >-
  Afarer предлагает комплексные услуги OEM и ODM для брендов, дистрибьюторов и государственных учреждений по всему миру. С 10-летним опытом экспорта и заводом площадью 12 000 м², сертифицированным по ISO 9001 и BSCI, мы занимаемся всем – от разработки продуктов и создания форм до полномасштабного
  производства, упаковки и логистики.

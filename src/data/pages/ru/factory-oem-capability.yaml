services:
  - title: Проектирование и инженерия продукции
    description: Наша внутренняя команда НИОКР работает с вашей концепцией или техническим заданием для разработки чертежей CAD, 3D моделей и прототипов. Мы предлагаем проектирование форм, оптимизацию формы корпуса и рекомендации по выбору материалов.
  - title: Индивидуальный брендинг и графика
    description: Полноцветная цифровая печать, шелкография, тиснение и варианты этикеток. Мы разрабатываем графику колод, брендинг тюбиков и упаковку, готовую для розничной продажи.
  - title: Настройка материала и спецификации
    description: Выбирайте из ПВХ (стандартный, экологически чистый, огнестойкий), Хипалон/CSM, дроп-стич и гибридные конструкции. Индивидуальные цвета труб, плотность ткани и варианты усиления.
  - title: Упаковка и логистика
    description: Индивидуальная розничная упаковка, коробки с частной торговой маркой, вакуумная упаковка, паллетирование и погрузка контейнеров. Условия поставки FOB Циндао, CIF или DDP доступны.
moq_table:
  - product: Надувные SUP-доски
    standard_moq: 5–10 единиц
    custom_moq: 200 единиц
    lead_time: 30–45 дней
  - product: Спасательные жилеты и безопасность
    standard_moq: 100–200 единиц
    custom_moq: 1 000 единиц
    lead_time: 20–30 дней
why_us:
  - title: Вертикальная интеграция
    description: Мы владеем нашей фабрикой, формами и цепочкой поставок — без посредников, без субподрядчиков. Это дает нам контроль над качеством, стоимостью и сроками поставки.
  - title: Двойная сертификация
    description: Сертификация системы менеджмента качества ISO 9001 и социального соответствия BSCI. Отчеты о проверках завода доступны по запросу.
  - title: Соответствие стандарту CE
    description: Все стандартные модели имеют сертификат CE 2013/53/EU. Индивидуальные модели могут быть сертифицированы CE через наш установленный процесс.
  - title: Низкий минимальный заказ
    description: Начинайте всего с 5 единиц для стандартных моделей. Мы помогаем новым брендам запускаться без чрезмерных обязательств по запасам.

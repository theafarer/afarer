meta:
  title: Решения для флота SUP курорта | {SITE}
  description: Полные решения для флота SUP для курортов и отелей. Доски коммерческого класса, индивидуальный брендинг, обучение персонала и пакеты с оптимизированной окупаемостью от 20 до 100 досок.
hero:
  tagline: Курорты и отели
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Гости курорта наслаждаются занятиями SUP-серфингом на нетронутом пляже
roi_section:
  title: Модель дохода курортного SUP
  subtitle: Как курорты зарабатывают от $50 000 до $200 000 ежегодного дохода от аренды SUP с одной инвестиции.
  metrics:
    - metric: $50 тыс.–$200 тыс.
      label: Годовой доход от SUP
      detail: По курорту, в зависимости от размера флота и заполняемости
    - metric: 4–6 месяцев
      label: Средний срок окупаемости
      detail: Окупить полные инвестиции в флот за один сезон
    - metric: 40%
      label: Рост доходов
      detail: Средний прирост после перехода на флоты Afarer
    - metric: Пятьсот
      label: Арендные циклы на плату
      detail: Прочность коммерческого уровня для повседневного использования
packages:
  title: Система курортного пакета
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - 12-месячная гарантия + Сертификат CE
      revenue: 'Потенциальный годовой доход: 50–80 тыс. долларов США'
      cta_text: Получить стартовый пакет
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 50 весёл + 50 спасательных жилетов
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - Сессия по обучению персонала (онлайн)
        - 12-месячная гарантия + Сертификат CE
      revenue: Потенциал годового дохода $120K–$200K
      popular: true
      cta_text: Получить премиум-пакет
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - Выделенный менеджер по работе с клиентами
        - Запчасти приоритетной замены (отправка в течение 24 часов)
        - Custom branding + logo
        - Маркетинговый пакет фото/видео
        - 24-месячная гарантия + Сертификат CE
      revenue: Потенциальный годовой доход $200 000
      cta_text: Получить флагманский пакет
case_study:
  quote: С момента перехода на Afarer, наш доход от аренды SUP увеличился на 40%. Расходы на замену досок снизились на 60%. Мы вернули полную инвестицию в наш парк за 4 месяца.
  author: Менеджер по водным мероприятиям
  location: Пятизвёздочный курорт, Мальдивы
  results:
    - label: Рост доходов
      value: 40%
    - label: Сокращение затрат
      value: '-60%'
    - label: Срок окупаемости
      value: 4 месяца
features:
  title: Почему курорты выбирают Afarer
  subtitle: Коммерческая прочность, глобальная логистика и партнёр, который понимает сферу гостеприимства.
  items:
    - title: 500 арендных велосипедов
      description: Каждая доска тестируется на выживание в 500 циклов аренды в солёной воде, на солнце и в песке.
      icon: tabler:shield-check
    - title: Отправка запчастей в течение 48 часов
      description: Запасные части отправляются в течение 48 часов — ваш доход от аренды никогда не останавливается.
      icon: tabler:truck-delivery
    - title: Пользовательский брендинг
      description: Согласуйте идентичность вашего курорта с индивидуальными цветами и логотипом на каждой доске.
      icon: tabler:palette
    - title: Обучение персонала
      description: Онлайн и очные обучающие программы для вашей команды по деятельности.
      icon: tabler:school
    - title: Глобальная логистика
      description: Доставка в более чем 50 стран с вариантами консолидации грузов.
      icon: tabler:world
    - title: Сертификат CE
      description: Все оборудования сертифицировано по CE, ISO 9001:2015 — гарантия безопасности и качества.
      icon: tabler:certificate

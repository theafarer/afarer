packages:
  title: Система курортного пакета
  subtitle: Выберите пакет, соответствующий вашей вместимости гостей и целям по доходам. Все пакеты включают 12-месячную гарантию и сертификацию CE.
  items:
    - name: Стартовый пакет
      tagline: Для бутик-курортов, до 20 гостей в день
      features:
        - 20 SUP-досок (3 размера для взрослых/детей)
        - 20 весел (регулируемые) + 20 спасательных жилетов
        - 4 помпы двойного действия (электрическая опционально)
        - 2 стойки для хранения + ремкомплект
        - Индивидуальная печать логотипа на досках
        - 12-месячная гарантия + Сертификат CE
      revenue: 'Потенциальный годовой доход: 50–80 тыс. долларов США'
      cta_text: Получить стартовый пакет
    - name: Премиум-пакет
      tagline: Для больших курортов, 50-100 гостей в день
      features:
        - 50 SUP-досок (5 размеров, смешанный флот)
        - 50 весёл + 50 спасательных жилетов
        - 10 помп двойного действия + 2 электрические помпы
        - 5 стоек для хранения + 2 тележки
        - Полный индивидуальный брендинг (доски, весла, сумки)
        - Сессия по обучению персонала (онлайн)
        - Отправка запчастей в течение 48 часов
        - 12-месячная гарантия + Сертификат CE
      revenue: Потенциал годового дохода $120K–$200K
      popular: true
      cta_text: Получить премиум-пакет
    - name: Флагманский пакет
      tagline: Для ультрапремиальных курортов, 100+ гостей в день
      features:
        - 100+ SUP-досок (полная линейка размеров)
        - Полный комплект аксессуаров (весла, жилеты, помпы, тележки)
        - Обучение персонала на месте (2 дня)
        - Выделенный менеджер по работе с клиентами
        - Запчасти приоритетной замены (отправка в течение 24 часов)
        - Полный индивидуальный брендинг (доски + аксессуары)
        - Маркетинговый пакет фото/видео
        - 24-месячная гарантия + Сертификат CE
      revenue: Потенциальный годовой доход $200 000
      cta_text: Получить флагманский пакет

tests:
  - title: Испытание давлением
    description: >-
      Надувные камеры подвергаются давлению, превышающему рекомендуемые рабочие пределы, в течение длительного времени. Это проверяет герметичность и структурную целостность материала и швов, гарантируя, что изделие выдерживает предполагаемое использование и возможное перекачивание без отказов или
      утечек.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: Испытание на удар
    description: Изделия подвергаются контролируемым ударам различными грузами и под разными углами. Это оценивает устойчивость материала к проколам, разрывам и повреждениям от столкновений с препятствиями в воде, демонстрируя долговечность.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: Испытание на стойкость к УФ-излучению
    description: Образцы материалов проходят ускоренное УФ-облучение, имитирующее годы интенсивного солнца, а затем повторно испытываются на сохранение прочности на разрыв и цветостойкость. Это подтверждает, что компаунды ПВХ и Hypalon устойчивы к выцветанию, мелению и растрескиванию, обеспечивая долговечность в солнечных морских условиях.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: Испытание на истирание
    description: Образцы материала трутся об абразивные поверхности в течение заданного количества циклов под контролируемым давлением. Это измеряет способность материала выдерживать износ от многократного использования, контакта с песком, камнями или другими поверхностями, обеспечивая долгосрочную прочность.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: Испытание при низких температурах
    description: Изделия тестируются в холодных условиях для оценки функциональности и долговечности в различных температурных режимах, предотвращая жесткость или растрескивание в холодной воде. Необходимо для лодок, предназначенных для зимнего использования или высоких широт.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: Испытание плавучести и грузоподъемности
    description: Изделия тестируются с различными грузами для определения максимальной грузоподъемности и обеспечения безопасной поддержки пользователей и снаряжения. Номинальная грузоподъемность каждой модели проверяется перед выпуском.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: Испытание маневренности
    description: Изделия тестируются на реакцию на греблю или управление мотором, оценивая радиус поворота и легкость управления. Натурные испытания на воде подтверждают, что реальные характеристики соответствуют проектным спецификациям.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: Испытание на водонепроницаемость
    description: Полностью собранные изделия погружаются в воду или подвергаются воздействию водяного распыла для проверки на наличие утечек через швы, клапаны или материалы. Каждая лодка проходит обязательную проверку водонепроницаемости перед отправкой.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp

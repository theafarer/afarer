      link: /solutions/resorts-hotels
    - title: Клубы по паддл-теннису
      description: Надежные флоты SUP для клубов по гребле на досках, программ уроков и операций с членством — доски коммерческого класса по клубным ценам.
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: Арендные операторы
      description: SUP-доски для высокой нагрузки, разработанные для ежедневной аренды. Устойчивы к УФ-излучению, быстро сохнут, складываются в стопку — созданы для интенсивного использования в аренде.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: Розничные партнеры
      description: Продавайте самый быстрорастущий бренд SUP на вашем рынке. Полная линейка продукции, маркетинговые материалы, дропшиппинг и конкурентные маржи.
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: Дистрибьюторы
      description: Эксклюзивные территории, полный ассортимент продукции, индивидуальное управление аккаунтом. Присоединяйтесь к нашей глобальной дистрибьюторской сети более чем в 50 странах.
      icon: tabler:world
      link: /solutions/distributors
    - title: Создайте свой собственный бренд
      description: Полный цикл производства SUP по модели OEM/ODM — проектирование, прототипирование, массовое производство и логистика. Запустите свой бренд с Afarer.
      icon: tabler:package
      link: /solutions/build-your-own-brand

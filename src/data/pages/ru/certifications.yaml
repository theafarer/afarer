hero:
  tagline: Сертификаты и стандарты
  title: Сертификаты качества<br />и стандарты соответствия
  subtitle: Продукция afarer производится в соответствии с международными стандартами безопасности на море, системами управления качеством и экологическими нормами.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: сертификаты качества и документация по соблюдению требований
content_certifications:
  tagline: Наши сертификаты
  title: Сертифицированное качество,<br />признанное во всем мире
  subtitle: Каждый продукт afarer подкреплен сертификатами, демонстрирующими нашу приверженность качеству, безопасности и экологической ответственности.
  items:
    - title: Сертификат CE
      description: Вся продукция afarer соответствует европейским требованиям маркировки CE для прогулочных судов, обеспечивая соблюдение стандартов безопасности, здоровья и защиты окружающей среды.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Наша система управления качеством сертифицирована по ISO 9001:2015, охватывая проектирование, производство и распространение надувных плавсредств и морского оборудования.
      icon: tabler:clipboard-check
    - title: Маркировка UKCA
      description: Продукты, продаваемые на рынке Великобритании, имеют маркировку UKCA, подтверждающую соответствие британским нормам для морского оборудования и гидроциклов.
      icon: tabler:shield
    - title: Соответствует требованиям BSCI
      description: afarer имеет аудит BSCI (Business Social Compliance Initiative), демонстрирующий этические производственные практики, справедливые условия труда и ответственность в цепочке поставок.
      icon: tabler:heart-handshake
    - title: Соответствует требованиям REACH
      description: Все материалы, используемые в продукции afarer, соответствуют нормативам ЕС REACH по химической безопасности, гарантируя отсутствие ограниченных веществ в нашем ПВХ, Hypalon или компонентах.
      icon: tabler:flask
    - title: Испытание материалов
      description: Ткани тестируются на прочность на разрыв, сопротивление раздиру, УФ-деградацию и стойкость к растрескиванию на холоде. Каждая производственная партия отбирается и проверяется.
      icon: tabler:test-pipe
content_factory:
  tagline: Заводские стандарты
  title: Производственное превосходство<br />—изготовлено по спецификации
  subtitle: Наше предприятие площадью 12 000 м² работает в соответствии со строгими протоколами контроля качества на каждом этапе производства.
  list:
    - 'Инспекция поступающего материала: Все сырьевые материалы — ПВХ-ткань, Hypalon, алюминий, фанера, клеи — проверяются на соответствие спецификациям перед поступлением в производство.'
    - 'Контроль качества в процессе производства: На каждом этапе производства есть задокументированные контрольные точки качества. Прочность сварных швов, выравнивание швов, установка клапанов и момент затяжки фитингов проверяются на линии.'
    - 'Тестирование под давлением: Каждая надувная камера подвергается испытанию давлением в 1,5 раза превышающим номинальное на протяжении 24 часов. Утечка воздуха должна отсутствовать для получения удовлетворительной оценки.'
    - 'Окончательная инспекция: готовые изделия проверяются на точность размеров, качество внешнего вида, комплектность аксессуаров и целостность упаковки перед отправкой.'
    - 'Отслеживаемость партии: Каждый продукт имеет серийный номер, связанный с записями о производственной партии, что обеспечивает полную отслеживаемость от сырья до готовой продукции.'
content_safety:
  tagline: Стандарты морской безопасности
  title: Безопасность прежде всего<br />—разработано для надежной работы
  subtitle: Продукция afarer разработана и протестирована в соответствии с международными стандартами безопасности на море для коммерческого и рекреационного использования.
  items:
    - title: ISO 6185
      description: Надувные лодки соответствуют стандартам ISO 6185 по конструкции, устойчивости, плавучести и грузоподъемности.
      icon: tabler:sailboat
    - title: Стандарты ABYC
      description: Электрические и топливные системы соответствуют стандартам ABYC (Американский совет по лодкам и яхтам) для безопасной установки и эксплуатации.
      icon: tabler:bolt
    - title: Соответствие требованиям СОЛАС
      description: Оборудование безопасности и спасательные средства соответствуют требованиям SOLAS (Международная конвенция по охране человеческой жизни на море) в применимых случаях.
      icon: tabler:lifebuoy

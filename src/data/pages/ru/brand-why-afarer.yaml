features3_reasons:
  tagline: Почему выбрать afarer
  title: Семь причин сотрудничать с нами
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Настоящее производство, а не торговля
      description: Мы владеем и управляем фабрикой площадью 12 000 м². Когда вы сотрудничаете с afarer, вы работаете напрямую с людьми, которые проектируют, разрабатывают и производят ваши продукты —без посредников.
      icon: tabler:building-factory
    - title: 2. Подход, основанный на инженерии
      description: Наш процесс проектирования начинается с варианта использования, а не с категории продукта. Мы оптимизируем форму корпуса, выбор материалов и конфигурацию в соответствии с тем, как лодка будет фактически использоваться.
      icon: tabler:engine
    - title: 3. Сертифицированное качество
      description: Сертифицировано CE, система качества ISO, соответствие BSCI, REACH, одобрено USCG. Каждый продукт соответствует международным стандартам —не просто заявлениям.
      icon: tabler:certificate
    - title: 4. Гибкий OEM/ODM
      description: Цвета труб, расположение консоли, брендинг, упаковка —мы настраиваем по вашим спецификациям. Без давления минимального заказа. Начните с прототипа, масштабируйтесь с уверенностью.
      icon: tabler:adjustments
    - title: 5. Глобальная логистика
      description: Склад в США в Калифорнии, прямая отгрузка из Циндао, авиаперевозка для срочных заказов. Мы занимаемся таможенным оформлением и документацией.
      icon: tabler:truck-delivery
    - title: 6. Пожизненная поддержка
      description: Мы поддерживаем лодки, построенные 20 лет назад. Оригинальные запчасти, технические консультации, руководство по ремонту —наша команда доступна, когда вы нуждаетесь в нас.
      icon: tabler:lifebuoy
    - title: 7. Честные спецификации
      description: Реальные номинальные нагрузки, реальные размеры, реальный вес. Без маркетинговых преувеличений. Что мы публикуем, то вы и получаете —проверено независимым тестированием.
      icon: tabler:ruler-measure
testimonials:
  tagline: Доверяют бренды по всему миру
  title: Что говорят наши партнеры
  items:
    - content: Мы работали с несколькими производителями в Китае, но afarer выделяется своей инженерной поддержкой и стабильным качеством. Они относятся к нашему бренду как к своему собственному.
      name: —OEM Partner, European Water Sports Brand
    - content: Их Hypalon SUP находятся в эксплуатации в нашем флоте более 5 лет. Минимальное обслуживание, отличная УФ-стойкость. 5-летняя гарантия на трубы дает нам уверенность.
      name: —Fleet Operator, Middle East Resort Group
    - content: Команда afarer помогла нам разработать индивидуальный дизайн SUP-доски от концепции до производства за 90 дней. Качество превзошло наши ожидания.
      name: —Distributor, Australian Watersports

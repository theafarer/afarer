meta:
  title: 'Академия — руководства по SUP и тренировка гребли | {SITE}'
  description: 'Академия afarera: руководства по надувным paddle board, техники stand up paddle, морская безопасность и знания о материалах для новичков и профессионалов.'
  keywords:
    - 'обучение stand up paddle'
    - 'руководство по SUP для новичков'
    - 'основы paddle board'
    - 'техники SUP'
    - 'уроки SUP'
hero:
  tagline: Академия Афарер
  title: Учебный центр
  subtitle: Руководства и учебные пособия для любого уровня подготовки —от основ SUP до продвинутых техник спасения
categories:
  - level: Начинающий
    color: от-зеленого-500 до-изумрудного-600
    badge: bg-зеленый-100 текст-зеленый-700
    guides:
      - title: Основы SUP
        desc: Изучите основы гребли стоя —стойка, техника гребка и равновесие.
        slug: основы sup
      - title: Техники гребли
        desc: Гребок вперед, отводящий гребок, подтягивающий гребок и низкий упор —освойте основные движения веслом.
        slug: техники гребли
      - title: Безопасность прежде всего
        desc: Основные правила безопасности, включая проверку погоды, использование PFD, правила использования лиша и самоспасение.
        slug: безопасность прежде всего
  - level: Средний
    color: от-синего-500 к-индиго-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Основы турпоходов
        desc: Планирование многочасовых сплавов —навигация, гидратация, темп и чтение прогнозов ветра.
        slug: необходимые вещи для путешествия
      - title: Чтение погоды
        desc: Интерпретируйте морские прогнозы, определяйте типы облаков и понимайте влияние ветра на воду.
        slug: метеопрогноз
      - title: Основы навигации
        desc: Чтение карт, использование компаса, GPS-путевые точки и планирование маршрутов для прибрежного плавания.
        slug: основы-навигации
      - title: Понимание приливов
        desc: Понимание циклов приливов, течений и их влияния на время старта и маршрут.
        slug: осведомлённость о приливах
  - level: Продвинутый
    color: от-фуксия-500 до-фиолетовый-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Планирование многодневных походов
        desc: Логистика экспедиции —выбор снаряжения, планирование питания, протоколы безопасности и аварийные контакты.
        slug: планирование-многодневной-поездки
      - title: Техники спасения
        desc: Самоспасение, T-спасение, эскимосское спасение для байдарок и протоколы буксировки на открытой воде.
        slug: спасательные техники
      - title: Ночная гребля
        desc: Навигация в темноте —требования к освещению, память маршрута, групповая коммуникация и осведомленность об опасностях.
        slug: ночная гребля
  - level: Обслуживание
    color: от-янтарного-500 до-оранжевого-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Чистка и уход
        desc: Промывка пресной водой, защита от УФ, предотвращение плесени и правильные методы сушки после каждого использования.
        slug: чистка-и-уход
      - title: Руководство по хранению
        desc: Лучшие практики хранения надувных досок и лодок —спуск воздуха, складывание, контроль температуры и срок службы.
        slug: руководство по хранению
      - title: Основы ремонта
        desc: Устранение мелких проколов, утечек в швах и проблем с клапанами с помощью ремкомплектов PVC и техник заплат.
        slug: основы ремонта
      - title: Обслуживание клапанов
        desc: Определение типов клапанов (Halkey-Roberts, Boston, Leafield), очистка от мусора и замена неисправных штоков.
        slug: обслуживание клапанов
knowledge_center_tagline: Центр знаний
knowledge_center_title: Справочники по морскому оборудованию и промышленности
knowledge_center_subtitle: Экспертные знания и руководства по покупке для морских специалистов, операторов флота и любителей водных видов спорта.
knowledge_sections:
  - title: Знания о досках SUP
    tagline: Руководства по стоячему серфингу на доске с веслом
    desc: Все о досках для SUP — конструкция доски, материалы, выбор размера, уход и советы по покупке для рекреационного и коммерческого использования.
    guides:
      - title: Как выбрать подходящую SUP-доску
        desc: Полное руководство по выбору SUP — размер, объем, материал, форма и предполагаемое использование.
        href: /learn/sup
      - title: Надувной против твёрдого SUP
        desc: Надувной SUP против жесткой эпоксидной доски — сравнение переносимости, стойкости, производительности и стоимости.
        href: /compare/inflatable-vs-hardboard
      - title: All-Around против Touring против Yoga SUP
        desc: Разные типы SUP-досок — стандарты конструкции, формы, размеры и рекомендуемое использование.
        href: /learn/sup
      - title: Drop-Stitch против традиционной конструкции
        desc: Сравните конструкцию с дроп-стич и традиционную конструкцию SUP-досок по весу, стоимости, долговечности и жесткости.
        href: /learn/drop-stitch-core
  - title: Руководство по надувным SUP
    tagline: Знания об надувных SUP
    desc: Комплексные руководства по надувным SUP — материалы из ПВХ, конструкция с технологией drop-stitch, стандарты безопасности и лучшие практики по обслуживанию.
    guides:
      - title: Руководство по материалу ПВХ
        desc: Детальное руководство по материалам ПВХ, используемым в конструкции надувных SUP-досок.
        href: /learn/materials
      - title: Как производятся надувные SUP
        desc: Производственный процесс — резка материала, склеивание сердечника с капельной строчкой, конструирование швов, испытание под давлением и контроль качества.
        href: /learn/inflatable-technology
      - title: Руководство по безопасности SUP
        desc: Стандарты безопасности, грузоподъемность, правильное давление, проверки перед отправлением и аварийные процедуры.
        href: /learn/water-safety
      - title: Техническое обслуживание SUP
        desc: Чистка, хранение, защита от ультрафиолета и ремонт надувных SUP-досок.
        href: /inflatable-sup-maintenance
  - title: Знания о досках SUP
    tagline: Центр доски SUP
    desc: Технические руководства, охватывающие типы SUP-досок, материалы, методы конструкции, обслуживание и безопасность.
    guides:
      - title: Типы досок для SUP
        desc: SUP-доски для универсального использования, туризма, йоги, спорта и детей — узнайте различия и выберите подходящую.
        href: /learn/sup
      - title: Технология Drop-Stitch
        desc: Как тысячи внутренних нитей создают жесткие надувные конструкции под высоким давлением.
        href: /learn/drop-stitch-core
      - title: Справочник по материалам
        desc: Оценки плотности ПВХ, вес тканей, стойкость к ультрафиолету и материалы морского класса объяснены.
        href: /learn/materials
      - title: Руководство по покупке SUP
        desc: Сравните различные типы досок для SUP для разных случаев использования и уровней навыков.
        href: /learn/sup
  - title: Знания по SUP
    tagline: Руководства по стоячему серфингу на доске с веслом
    desc: Все о досках для SUP — надувные против жестких, размеры досок, материал и технологии, а также советы экспертов для всех уровней подготовки.
    guides:
      - title: Надувной против твёрдого SUP
        desc: Сравните надувные SUP-доски и жесткие эпоксидные доски по портативности, прочности, производительности и стоимости.
        href: /learn/sup
      - title: Руководство по размерам досок для SUP
        desc: Как длина, ширина и толщина влияют на устойчивость, скорость и маневренность.
        href: /learn/sup
      - title: Обслуживание и уход за SUP
        desc: Советы по чистке, хранению, защите от ультрафиолета и ремонту надувных SUP-досок.
        href: /inflatable-sup-maintenance
      - title: Выбор вашего первого SUP
        desc: Руководство для начинающих по выбору подходящего сапборда в зависимости от вашего веса, уровня навыков и предполагаемого использования.
        href: /learn/sup
  - title: Руководство по арендным операциям
    tagline: Управление автопарком для арендного бизнеса
    desc: Руководства по созданию и управлению парками аренды SUP для пляжных киосков, водных спортивных центров и объектов гостеприимства.
    guides:
      - title: Создание вашего автопарка для аренды
        desc: Как выбрать подходящие сап-серфборды для вашего проката — учитывая прочность, размер и рентабельность.
        href: /solutions/rental-operators
      - title: Руководство по техническому обслуживанию флота
        desc: Основные методы обслуживания для максимизации срока службы досок и минимизации простоя арендного парка.
        href: /solutions/rental-operators
  - title: Путеводитель по курортам и гостиничному обслуживанию
    tagline: Водные виды деятельности для индустрии гостеприимства
    desc: Руководства по запуску и управлению программами SUP для курортов, отелей и прибрежных мест отдыха.
    guides:
      - title: Начало программы SUP в курорте
        desc: Факторы, которые следует учитывать при запуске гостевых мероприятий по SUP — размер флота, укомплектованность персоналом и моделирование доходов.
        href: /solutions/resorts-hotels
      - title: SUP против других водных видов спорта
        desc: Сравните программы SUP с другими водными видами спорта с точки зрения опыта гостей и операционной эффективности.
        href: /learn/sup
  - title: Руководство по розничной торговле и дистрибуции
    tagline: Деловые партнерства SUP
    desc: Руководства по становлению розничным партнером или дистрибьютором SUP — планирование запасов, позиционирование на рынке и стратегии роста.
    guides:
      - title: Становление розничным продавцом SUP
        desc: Как выбирать ассортимент продукции, управлять запасами и продвигать SUP-доски в вашем розничном магазине.
        href: /solutions/retail-partners
      - title: SUP для коммерческих операций
        desc: Почему надувные SUP являются универсальным продуктом для коммерческих флотов, арендных бизнесов и профессиональных операторов.
        href: /use-cases/search-and-rescue

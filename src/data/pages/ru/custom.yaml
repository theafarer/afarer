  subtitle: Четыре шага от вашей идеи до готовой, готовой к морю лодки.
  steps:
    - num: Один
      title: Выберите доску
      desc: Выберите из наших основных моделей — SUP, байдарка, тузик или SUP. Укажите размер, материал и цвет.
    - num: Два
      title: Загрузите дизайн
      desc: Отправьте нам ваш логотип, графику или бренд-гайд. Наша команда дизайнеров подготовит цифровой пробник.
    - num: Три

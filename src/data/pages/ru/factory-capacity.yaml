workshops:
  - title: Производство досок SUP
    description: '4 параллельные сборочные линии для надувных SUP-досок. Каждая линия может выпускать 50–80 досок за смену. Станции цифровой и трафаретной печати работают одновременно. Годовая мощность производства SUP: 8 000 досок.'
    output: 8 000 SUP в год
  - title: SUP Boat Production
    description: 'Специализированный цех стеклопластиковых корпусов с 6 формовочными станциями для SUP-корпусов до 7,6 м. Участок сварки и сборки труб обрабатывает 3–6 SUP одновременно. Годовая мощность SUP: более 2 000 лодок.'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'Многоцелевые производственные линии для надувных лодок, байдарок и шлюпок. Станции горячей сварки, RF-диэлектрические прессы и сборочные рабочие места перенастраиваются в зависимости от состава заказа. Годовая мощность: более 5 000 единиц.'
    output: 5 000 единиц в год
  - title: Средства безопасности
    description: 'Отдельная чистая производственная зона для спасательных жилетов и оборудования безопасности. Специализированные станции шитья, вставки пены и тестирования. Годовая мощность спасательных жилетов: более 50 000 единиц.'
    output: 50 000 спасательных жилетов в год
oem_capacity:
  moq: 'SUP: 5–10 units | SUP: 2–5 units | SUP/SUP: 10–50 units | Custom mould: 200+ units'
  lead_time: Стандарт 30–45 дней. Образец 15–10 дней. Срочная обработка доступна.
  payment: T/T 30% депозит, 70% до отгрузки. Принимаются L/C, Western Union.

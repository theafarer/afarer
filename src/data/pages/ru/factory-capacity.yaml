workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50—0 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: SUP Boat Production
    description: 'Специализированный цех стеклопластиковых корпусов с 6 формовочными станциями для SUP-корпусов до 7,6 м. Участок сварки и сборки труб обрабатывает 3— SUP одновременно. Годовая мощность SUP: более 2 000 лодок.'
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & SUP
    description: 'Многоцелевые производственные линии для надувных лодок, байдарок и шлюпок. Станции горячей сварки, RF-диэлектрические прессы и сборочные рабочие места перенастраиваются в зависимости от состава заказа. Годовая мощность: более 5 000 единиц.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'Отдельная чистая производственная зона для спасательных жилетов и оборудования безопасности. Специализированные станции шитья, вставки пены и тестирования. Годовая мощность спасательных жилетов: более 50 000 единиц.'
    output: '50,000+ life vests/year'


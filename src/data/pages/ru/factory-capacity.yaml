intro: afarer operates one of the largest dedicated inflatable boat manufacturing facilities in Qingdao, China. Our 12,000 m² factory is organized into six specialized workshops operating in parallel, giving us the capacity to produce over 15,000 boats annually across SUP, SUP, SUP, SUP, and safety equipment lines.


hero:
  tagline: Руководства
  title: Новичок в SUP?
  subtitle: Практические руководства, которые помогут вам выбрать, использовать и получать удовольствие от надувных SUP-досок.
size_guide:
  tagline: Размеры и характеристики
  title: Найдите подходящий размер для ваших нужд
  desc: Сравните размеры SUP-досок, грузоподъемность и рекомендуемое использование. Независимо от того, нужна ли вам доска для туринга, йоги или универсальная доска — наш гид по размерам поможет вам выбрать подходящую.
  link_label: Полный справочник с характеристиками продукта →
  link: /size-guide
  cards:
    - title: SUP доски
      desc: Выбирайте длину, исходя из вашего веса и предназначения использования. Более широкие доски (32") обеспечивают большую устойчивость. Более длинные доски (11—2 фута) лучше подходят для туринга.
    - title: Туринговые SUP
      desc: Более длинные доски (11—2 фута) для преодоления расстояний и езды прямо. Достаточно устойчивые для туринга с снаряжением. Всегда проверяйте грузоподъёмность.
    - title: Универсальные SUP
      desc: Выбирайте длину по весу и использованию всадника. Более широкие доски (32") для устойчивости. Универсально для отдыха и фитнеса.

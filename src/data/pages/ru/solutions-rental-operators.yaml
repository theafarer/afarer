meta:
  title: Решения для аренды флота SUP | {SITE}
  description: SUP-доски с высокой популярностью, разработанные для ежедневной аренды. УФ-стойкий ПВХ, усиленные швы, быстро сохнущие материалы. Развивайте свой арендный бизнес с Afarer.
hero:
  tagline: Арендные операторы
  title: Масштабируйте свой арендный бизнес<br />С уверенностью
  subtitle: SUP-доски с высокой проходимостью, разработанные для ежедневной аренды, 365 дней в году. Ваш доход никогда не отдыхает.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Оживлённый прокатный киоск с досками для SUP, готовыми для гостей
features:
  title: Создано для арендного изнурения
  subtitle: Каждая доска рассчитана на 500 циклов аренды с минимальным обслуживанием.
  items:
    - title: 500 арендных велосипедов
      description: Проверено на выносливость при ежедневном использовании в солёной воде, на солнце и в песке.
      icon: tabler:shield-check
    - title: УФ-устойчивая ткань
      description: Отсутствие выцветания или деградации после 1 года хранения на улице.
      icon: tabler:sun
    - title: Усиленные швы
      description: В 3 раза прочнее стандартной конструкции надувной доски.
      icon: tabler:layers-intersect
    - title: Материалы быстрого высыхания
      description: Доски готовы к следующей аренде менее чем за 30 минут.
      icon: tabler:droplet
    - title: Складируемое хранилище
      description: Компактный дизайн — храните на 40% больше досок на той же площади.
      icon: tabler:stack
    - title: Размеры по цвету
      description: Персонал мгновенно берет правильную доску с цветовой кодировкой размеров.
      icon: tabler:color-swatch
stats:
  title: Метрики операций
  stats:
    - title: Кадровая ротация совета
      amount: < 5 мин
    - title: Ежегодное обслуживание
      amount: ~15 мин/доска
    - title: Отправка деталей
      amount: 48ч
    - title: Коэффициент дефектности
      amount: < 0,5%
fleet_guide:
  title: Руководство по размеру автопарка
  subtitle: Оцените размер автопарка и потенциал дохода для вашей арендной компании.
  tiers:
    - label: Маленький киоск
      boards: 15-20
      revenue: $XX,XXX/год
    - label: Операция среднего размера
      boards: 30-50
      revenue: $XX,XXX/год
    - label: Большой пляжный дом
      boards: 50-100
      revenue: $XXX,XXX/год
cta:
  title: Готовы масштабировать свой арендный бизнес?
  subtitle: Получите цены на аренду или сравните модели плат для вашего предприятия.
  actions:
    - text: Узнать цену аренды
      href: /contact?package=rental
      variant: primary
    - text: Сравнить модели плат
      href: /compare
      variant: secondary

how_to_choose:
  title: Как выбрать правильный размер
  cards:
    - title: SUP-доски
      description: Выбирайте длину в зависимости от вашего веса и предполагаемого использования. Более широкие доски (32"+) обеспечивают большую устойчивость. Более длинные доски (11-12 футов) лучше держат курс для туринга. Более тяжелым гребцам нужны доски большего объема.
    - title: Туринговые SUP-доски
      description: Более длинные доски (11–12 футов) лучше всего подходят для преодоления дистанций и туринга. Более широкие доски (32"+) обеспечивают большую устойчивость. Проверьте грузоподъемность для общей нагрузки включая снаряжение.

    - title: Универсальные SUP-доски
      description: Выбирайте длину по весу райдера и предполагаемому использованию. Универсальные доски подходят для отдыха, фитнеса и йоги. Доски меньшего размера более маневренные.

hero:
  tagline: Лабораторная работа 05
  title: Мастерская прототипов
  subtitle: От модели CAD до готовой к морю лодки — построена, оснащена и проверена
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
  image_alt: Изготовление прототипной мастерской лодки Afarer
intro: >-
  3D-модель в CAD, каким бы подробным она ни была, не может показать, как лодка будет себя вести на воде, пока она с ней не столкнется. Именно поэтому наша мастерская прототипов создана для того, чтобы как можно быстрее и точнее превращать инженерные данные в физическое, мореплавательное судно.
  Каждая новая модель {SITE.name} — и каждая значительная индивидуальная сборка — проходит через эту мастерскую перед тем, как начинается изготовление производственных инструментов.
content_html: >-
  <h2>Где дизайн становится реальностью</h2>

  <p>Цех полностью оснащён для одновременного изготовления корпуса, баллонов и такелажа. Такой подход с параллельными рабочими процессами сокращает срок изготовления прототипа до 8-12 недель с момента инженерной передачи, по сравнению с отраслевой нормой в 16-20 недель. Если ваша задача требует
  специализированного решения, мы можем пройти путь от концепции до испытаний на воде менее чем за три месяца.</p>


  <h2>Возможности цеха</h2>

  <table>
    <thead><tr><th>Рабочее место</th><th>Оборудование</th><th>Назначение</th></tr></thead>
    <tbody>
      <tr><td>Изготовление корпуса</td><td>Печь ротационного формования (HDPE), участок TIG-сварки (алюминий), формы ручной выкладки (стеклопластик)</td><td>Полномасштабное производство корпусов во всех трёх типах материалов</td></tr>
      <tr><td>Сборка баллонов</td><td>Пресс для RF-сварки, станция прихваточной сварки горячим воздухом, стенд для испытаний надувных изделий</td><td>Изготовление баллонов в полном размере со всеми перегородками, конусами и клапанами</td></tr>
      <tr><td>Такелаж и оснастка</td><td>Моторный подъёмник (500 kg), рама-макет консоли, обжимное устройство для гидравлических шлангов, стенд электрожгутов</td><td>Полное оснащение: двигатель, рулевое управление, приборы, топливная система, электроника, сиденья</td></tr>
      <tr><td>Измерительный пост</td><td>GPS-датчик скорости, расходомер топлива, акселерометры, термопарная матрица, регистратор данных</td><td>Установка и калибровка измерительного оборудования для ходовых испытаний</td></tr>
    </tbody>
  </table>


  <h2>Путь прототипа — шаг за шагом</h2>

  <ol>
    <li><strong>Инженерная передача</strong> — Комплект конструкторской документации (3D-модель, отчёт FEA, спецификация материалов, график выкладки) официально рассматривается руководителем цеха и инженером проекта. Все вопросы по производству отмечаются и решаются до начала раскроя.</li>
    <li><strong>Изготовление корпуса</strong> — Корпус строится в соответствии с инженерной спецификацией. Для HDPE: программа ротационного формования загружается из симуляции Moldex3D. Для алюминия: листы CNC-раскроя свариваются на участке TIG-сварки по утверждённой карте сварных швов. Для стеклопластика: карта выкладки слоёв соблюдается слой за слоем.</li>
    <li><strong>Изготовление баллонов</strong> — Ткань раскраивается с использованием шаблонов CNC, затем сваривается методом RF-сварки в камеры полного размера. Каждая камера надувается до испытательного давления и выдерживается 24 h для первичной стабилизации.</li>
    <li><strong>Сборка и такелаж</strong> — Корпус и баллоны соединяются. Устанавливается двигатель, подключаются рулевое управление и приборы, монтируется топливная система, выполняются и проверяются все электрические цепи.</li>
    <li><strong>Статические испытания</strong> — Прежде чем лодка коснётся воды, проводятся: проверка плавучести (полная нагрузка + 30 % запаса), испытание топливной системы под давлением, цикловое испытание рулевого управления на полный ход, проверка непрерывности цепи заземления.</li>
    <li><strong>Программа ходовых испытаний</strong> — 20 часов испытаний на воде, подробнее описано ниже.</li>
    <li><strong>Приёмка прототипа</strong> — Проводится официальное совещание по приёмке с участием инженерных и производственных групп и отдела качества. Все необходимые изменения конструкции документируются и вносятся в производственную версию.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Программа 20-часовых ходовых испытаний — график испытаний</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Маневрирование в гавани — управление на малом ходу, задний ход, проверка кранцев</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Скоростные испытания — максимальная скорость по GPS, крейсерская скорость, расход топлива при трёх режимах RPM</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Испытание на циркуляцию — тактический диаметр, выдвиг и смещение на 20 kn, левый и правый борт</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Испытание на удар о волну — многократные проходы по волнению 0.5–1.0 m; акселерометр на основании сиденья рулевого</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Испытание на остойчивость — статический угол крена с экипажем из 4 человек + грузом на правый борт, смещённая нагрузка</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Испытание на выносливость — 3 h непрерывного хода на крейсерской скорости; контроль температуры (двигатель, топливо, электрооборудование)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Финальный осмотр — послеиспытательный осмотр всех систем, подтяжка и проверка всех креплений, документирование результатов</span>
      </div>
    </div>
  </div>


  <h2>Индивидуальное прототипирование для уникальных задач</h2>

  <p>Цех прототипирования — это место, где мы решаем задачи, с которыми не справляются стандартные серийные лодки. Последние примеры включают:</p>

  <ul>
    <li>RIB длиной 7.8 m для поисково-спасательной организации, требующий индивидуальной конструкции кабины с защитой от опрокидывания, встроенными креплениями для носилок и носовым контейнером для гидролокатора — всё было спроектировано, смонтировано и испытано на нашем предприятии.</li>
    <li>Надувная лодка 5.2 m для подрядчика гидрографических изысканий со срезанным транцем, съёмной мачтой для приборов и закладными нишами для датчиков в днище, спроектированными для минимизации возмущения потока.</li>
    <li>Электрический тузик 4.5 m для суперяхты, где прототип использовался для проверки дальности хода, зарядной инфраструктуры и уровня шума, прежде чем заказчик заказал серию из четырёх лодок.</li>
  </ul>


  <h2>Наша команда прототипирования</h2>

  <p>В цехе работают восемь многопрофильных специалистов по судостроению, каждый из которых прошёл перекрёстное обучение как минимум по двум из трёх основных дисциплин (корпус, баллон, такелаж). Руководитель команды — мастер-судостроитель с 16-летним опытом: от единичных заказов до серийного
  производства. Каждому прототипу назначается отдельный инженер проекта, который служит единой точкой контакта для клиента на протяжении всего процесса изготовления и испытаний.</p>


  <h2>Участие клиента</h2>

  <p>Мы настоятельно рекомендуем нашим клиентам присутствовать на ключевых этапах изготовления прототипа — особенно на предварительном осмотре оснастки и на ходовых испытаниях. Ваши замечания по эксплуатации на этих этапах неоценимы для доводки лодки перед запуском в производство. Мы не работаем в
  вакууме — мы работаем в партнёрстве с вами.</p>

  <p>20-часовые ходовые испытания — это также возможность для вашей команды ознакомиться с управляемостью лодки, расположением систем и требованиями к техническому обслуживанию, что обеспечивает плавный переход к эксплуатации после поставки серийных лодок.</p>

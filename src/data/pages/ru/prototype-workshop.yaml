hero:
  tagline: Лабораторная работа 05
  title: Мастерская прототипов
  subtitle: От модели CAD до готовой к воде доски — построена, оснащена и проверена
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Изготовление досок в прототипной мастерской Afarer
intro: >-
  3D-модель в CAD, каким бы подробным она ни была, не может показать, как доска будет вести себя на воде, пока она с ней не встретится. Именно поэтому наша мастерская прототипов создана для того, чтобы как можно быстрее и точнее превращать инженерные данные в физическую, готовую к воде доску.
  Каждая новая модель Afarer — и каждая значительная индивидуальная сборка — проходит через эту мастерскую перед тем, как будет изготовлена производственная оснастка.
content_html: >-
  <h2>Где дизайн становится реальностью</h2>

  <p>Цех полностью оснащён для одновременного изготовления корпуса, рельсов и такелажа. Такой подход с параллельными рабочими процессами сокращает срок изготовления прототипа до 8-12 недель с момента инженерной передачи, по сравнению с отраслевой нормой в 16-20 недель. Если ваша задача требует
  специализированного решения, мы можем пройти путь от концепции до испытаний на воде менее чем за три месяца.</p>


  <h2>Возможности цеха</h2>

  <table>
    <thead><tr><th>Рабочее место</th><th>Оборудование</th><th>Назначение</th></tr></thead>
    <tbody>
      <tr><td>Изготовление корпуса</td><td>Раскройщик ткани с ЧПУ, пресс термо-ламинации, участок подготовки сердечников drop-stitch</td><td>Полномасштабное производство корпусов всех трёх конструктивных типов</td></tr>
      <tr><td>Сборка рельсов и камер</td><td>Пресс RF-сварки, станция прихваточной сварки горячим воздухом, стенд для надувных испытаний</td><td>Изготовление рельсовых и камерных сборок полного размера со всеми перегородками и клапанами</td></tr>
      <tr><td>Такелаж и оснастка</td><td>Кондуктор для плавниковых коробок, оснастка для приварки креплений груза и ручек, станок для резки настилов</td><td>Полное оснащение: плавники, крепления груза, отверстия для леши, ручки, настилы, клапаны</td></tr>
      <tr><td>Измерительный пост</td><td>GPS-датчик скорости, датчики давления, акселерометры, термопарная матрица, регистратор данных</td><td>Установка и калибровка измерительного оборудования для морских испытаний</td></tr>
    </tbody>
  </table>


  <h2>Путь прототипа — шаг за шагом</h2>

  <ol>
    <li><strong>Инженерная передача</strong> — Комплект конструкторской документации (3D-модель, отчёт FEA, спецификация материалов, график выкладки) официально рассматривается руководителем цеха и инженером проекта. Все вопросы по производству отмечаются и решаются до начала раскроя.</li>
    <li><strong>Изготовление корпуса</strong> — Корпус строится в соответствии с инженерной спецификацией. Для однослойной конструкции: сердечник drop-stitch ламинируется указанным ПВХ-слоем. Для двухслойной конструкции: дополнительный слой наносится на базовый ламинат перед раскроем. Для фузионной конструкции: параметры ламинации загружаются из утверждённой технологической карты и проверяются на первом образце.</li>
    <li><strong>Изготовление рельсов</strong> — Ткань раскраивается с использованием шаблонов CNC, затем сваривается методом RF-сварки в рельсы и камеры полного размера. Каждая камера надувается до испытательного давления и выдерживается 24 h для первичной стабилизации.</li>
    <li><strong>Сборка и такелаж</strong> — Корпус и рельсы соединяются. Устанавливаются плавниковые коробки и крепления груза, монтируются отверстия для леши и ручки для переноски, клапан накачки устанавливается с регламентированным моментом затяжки, настил наклеивается и выравнивается.</li>
    <li><strong>Статические испытания</strong> — Прежде чем доска коснётся воды, проводятся: проверка плавучести (полная нагрузка + 30 % запаса), испытание камер на удержание давления, тест клапана на утечку, испытание ручек и креплений на отрыв.</li>
    <li><strong>Программа морских испытаний</strong> — 20 часов испытаний на воде, подробнее описано ниже.</li>
    <li><strong>Приёмка прототипа</strong> — Проводится официальное совещание по приёмке с участием инженерных и производственных групп и отдела качества. Все необходимые изменения конструкции документируются и вносятся в производственную версию.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Программа 20-часовых морских испытаний — график испытаний</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Знакомство на спокойной воде — курсовая устойчивость на малой скорости, повороты, проверка стойки и дифферента</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Скоростные испытания — максимальная скорость, подтверждённая GPS, крейсерская скорость, удерживаемый темп при 3 частотах гребков</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Испытание на повороты — радиус разворота на месте и дугой, реакция доски, левый и правый борт</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Испытание на chop — многократные проходы по волнению 0.5–1.0 m; акселерометр в позиции стойки райдера</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Испытание на устойчивость — статический угол крена с 4 райдерами разного веса, смещённая нагрузка на правый борт</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Испытание на выносливость — 3 h непрерывного движения на крейсерском темпе; контроль давления в камерах, температуры рельсов и усталости райдера</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Финальный осмотр — послеиспытательный осмотр всех компонентов, подтяжка и проверка всех креплений, документирование результатов</span>
      </div>
    </div>
  </div>


  <h2>Индивидуальное прототипирование для уникальных задач</h2>

  <p>Цех прототипирования — это место, где мы решаем задачи, с которыми не справляются стандартные серийные доски. Последние примеры включают:</p>

  <ul>
    <li>Высокозаметная спасательная SUP для поисково-спасательной организации, требующая интегрированных ручек для захвата, креплений для спасательного снаряжения и корпуса с высокой плавучестью для подъёма пострадавших — всё спроектировано, смонтировано и испытано на нашем предприятии.</li>
    <li>Экспедиционная туристическая SUP для подрядчика гидрографических изысканий со съёмной мачтой для приборов, герметичными портами для снаряжения и низкопрофильным креплением датчика, спроектированным для минимизации сопротивления.</li>
    <li>Компактная рыболовная SUP для курортного флота, где прототип использовался для проверки устойчивости, крепления снаряжения и долговечности при ежедневной аренде, прежде чем заказчик заказал флот из четырёх досок.</li>
  </ul>


  <h2>Наша команда прототипирования</h2>

  <p>В цехе работают восемь многопрофильных морских техников, каждый из которых прошёл перекрёстное обучение как минимум по двум из трёх основных дисциплин (корпус, рельс, такелаж). Руководитель команды — мастер-изготовитель с 16-летним опытом: от единичных заказов до серийного
  производства. Каждому прототипу назначается отдельный инженер проекта, который служит единой точкой контакта для клиента на протяжении всего процесса изготовления и испытаний.</p>


  <h2>Участие клиента</h2>

  <p>Мы настоятельно рекомендуем нашим клиентам присутствовать на ключевых этапах изготовления прототипа — особенно на предварительном осмотре оснащения и на морских испытаниях. Ваши замечания по эксплуатации на этих этапах неоценимы для доводки доски перед запуском в производство. Мы не работаем в
  вакууме — мы работаем в партнёрстве с вами.</p>

  <p>20-часовые морские испытания — это также возможность для вашей команды ознакомиться с управляемостью доски, компоновкой палубы и требованиями к техническому обслуживанию, что обеспечивает плавный переход к эксплуатации после поставки серийных досок.</p>

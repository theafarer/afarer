hero:
  tagline: Закупки
  title: Руководство покупателя OEM — Закупка надувных водных судов из Азии
  subtitle: 'Время чтения: 12 минут'
content_html: >
  <h2>1. Предквалификация: на что обращать внимание на заводе</h2>


  <h3>Сертификаты соответствия</h3>

  <ul>
    <li><strong>ISO 9001:2015</strong> – Система управления качеством</li>
    <li><strong>Сертификация CE</strong> — проверка номера уведомленного органа</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Аудиты социального соответствия</li>
    <li><strong>REACH / RoHS</strong> – Декларации о соответствии материалам</li>
  </ul>


  <h3>Производственные возможности</h3>

  <ul>
    <li>Ткачество сердечника с дроп-швом внутри компании против внешнего</li> направления
    <li>ПВХ-покрытие / линия ламинирования</li>
    <li>Оборудование для радиочастотной сварки и сварки на горячем воздухе</li>
    <li>Изготовление форм на собственном месте (обработка с ЧПУ)</li>
    <li>Лаборатория испытаний (испытания под давлением, УФ-старение, испытания на растяжение)</li>
  </ul>


  <h3>Проверка опыта</h3>

  <ul>
    <li>Годы работы в производстве надувных водных судов (минимум 5 лет)</li>
    <li>Количество инженеров в штате</li>
    <li>Существующие OEM/ODM-клиенты (запрос ссылок)</li>
    <li>Экспортные направления — уже ли они отправляются на ваш целевой рынок?</li>
  </ul>


  <h2>2. Протоколы контроля качества</h2>

  <p>Качество качества материала: прочность на растяжение (ASTM D751 или ISO 1421), устойчивость к разрыву (ASTM D2261 или ISO 4674), прочность на адгезию, точечные проверки старения при ультрафиолете</p>.

  <p>Контроль контроля в процессе: контроль прочности шва каждые 50 единиц, проверка крутящего момента клапана, проверка плотности нити с дроп-швом, проверка размеров по чертежам CAD</p>.

  <p>Итоговый осмотр: тест на 100% надувку (24 часа, максимальное падение 5%), визуальный осмотр, тест функции клапана, случайный выборочный тест (AQL 2.5 или 4.0 по ISO 2859).</p>


  <h2>3. Контрольный список документации по соблюдению</h2> требований

  <ul>
    <li>Декларация соответствия (DoC), ссылающаяся на корректную директиву ЕС</li>
    <li>Сертификат CE от уведомленного органа</li>
    <li>Отчёт о тесте аккредитованной лаборатории</li>
    <li>Технические данные по безопасности материалов (MSDS)</li>
    <li>Декларация о соблюдении REACH</li>
    <li>Список материалов с отслеживаемостью поставщика</li>
    <li>Отчет о заводской инспекции</li>
  </ul>


  <h2>4. Переговоры по MOQ</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <TR класс="BG-Gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Product Type</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">стандартный MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Оборотный диапазон</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP Boards</td><td class="p-3 border">50 – 100 единиц</td><TD класс="P-3 граница">5 – 10 единиц (испытательный)</td></tr>
      <tr><td class="P-3 Border"></td>Каяки<TD класс="P-3 Border">50 – 100 единиц</td><TD Class="P-3 Border">5 – 10 единиц (испытательные)</td></tr>
      <tr><td класс="P-3 Border"></td>Надувные лодки<td класс="p-3 border">50 – 100 единиц</td><TD класс="P-3 Border">2 – 5 единиц (испытательные)</td></tr>
      <tr><td class="p-3 border">RIB Boats</td><td class="p-3 border">20 – 50 единиц</td><TD класс="P-3 Border">2 – 5 единиц (испытательные)</td></tr>
      <tr><td class="p-3 border">Безопасность / аксессуары</td><td class="p-3 border">200 – 500 единиц</td><TD класс="P-3 граница">50 – 100 единиц (испытательный)</td></tr>
    </tbody>
  </table>


  <h2>5. Логистика и судоходство</h2>

  <p>Распространённые инкотермы: <strong>FOB</strong> (завод доставляет в порт отправления — чаще всего), <strong>EXW</strong> (покупатель организует всю доставку от заводских дверей), <strong>CIF</strong> (завод оплачивает груз и страховку до порта назначения).</p>

  <p>Надувные изделия имеют небольшой вес, большой объем — объёмный вес (DIM) часто определяет стоимость доставки. Запросите вакуумную упаковку, чтобы сократить объём на 50–60%. Морские грузоперевозки из Китая в ЕС: 25–35 дней; до западного побережья США: 15–20 дней.</p>


  <h2>6. Распространённые подводные камни</h2>

  <ul>
    <li><strong>Нет заводского аудита:</strong> всегда проводите или заказывайте аудит третьей стороны (QIMA, SGS, Bureau Veritas).</li>
    <li><strong>Только устные характеристики:</strong> подробный технический лист спецификаций, подписанный обеими сторонами</li>
    <li><strong>Пропуск одобрения образца:</strong> письменное одобрение образцов перед массовым производством</li>
    <li><strong>Отсутствие контроля качества во время производства:</strong> сторонняя инспекция во время производства (DUPRO) и перед отправкой (PSI)</li>
    <li><strong>Игнорирование соблюдения:</strong> проверьте сертификацию CE/UKCA перед производством</li>
  </ul>


  <h2>7. Почему Афарер</h2>

  <p>Afarer производит надувные судна OEM/ODM с 2012 года. Имея сертифицированное по ISO 9001 предприятие площадью 12 000 м², 25 инженеров и сертификацию CE по всем линейкам продукции, мы соответствуем всем критериям этого руководства. Мы предлагаем пробные MOQ для новых партнёров и полные пакеты
  документации по соблюдению требований.</p>

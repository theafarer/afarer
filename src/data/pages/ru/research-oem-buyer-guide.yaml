hero:
  tagline: Закупки
  title: Руководство покупателя OEM — Закупка надувных водных судов из Азии
  subtitle: 'Время чтения: 12 минут'
content_html: |-
  <h2>1. Предварительная квалификация: на что обратить внимание при выборе фабрики</h2>

  <h3>Сертификаты соответствия</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Система менеджмента качества</li>
    <li><strong>Сертификация CE</strong> – Проверьте номер уведомлённого органа</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Аудиты социального соответствия</li>
    <li><strong>REACH / RoHS</strong> – Декларации о соответствии материалов</li>
  </ul>

  <h3>Производственные возможности</h3>
  <ul>
    <li>Собственное плетение сердечника drop-stitch или аутсорсинг</li>
    <li>Линия покрытия / ламинации ПВХ</li>
    <li>Оборудование для RF-сварки и сварки горячим воздухом</li>
    <li>Собственное производство форм (CNC-обработка)</li>
    <li>Испытательная лаборатория (испытания давлением, УФ-старение, испытания на разрыв)</li>
  </ul>

  <h3>Проверка опыта</h3>
  <ul>
    <li>Годы производства надувных плавсредств (минимум 5+ лет)</li>
    <li>Количество инженеров в штате</li>
    <li>Существующие клиенты OEM/ODM (запросите рекомендации)</li>
    <li>Экспортные направления – поставляют ли они уже в ваш целевой рынок?</li>
  </ul>

  <h2>2. Протоколы контроля качества</h2>
  <p>Входной контроль материалов: прочность на разрыв (ASTM D751 или ISO 1421), сопротивление раздиру (ASTM D2261 или ISO 4674), прочность сцепления, точечные проверки УФ-старения.</p>
  <p>Контроль в процессе производства: мониторинг прочности швов каждые 50 единиц, проверка крутящего момента клапанов, проверки плотности нитей drop-stitch, проверки размеров по чертежам CAD.</p>
  <p>Финальная инспекция: 100% тест удержания давления (24 часа, падение не более 5%), визуальный осмотр, тест работы клапанов, выборочные испытания образцов (AQL 2.5 или 4.0 по ISO 2859).</p>

  <h2>3. Контрольный список документации о соответствии</h2>
  <ul>
    <li>Декларация о соответствии (DoC) со ссылкой на правильную директиву ЕС</li>
    <li>Сертификат CE от уведомлённого органа</li>
    <li>Отчёт об испытаниях из аккредитованной лаборатории</li>
    <li>Паспорта безопасности материалов (MSDS)</li>
    <li>Декларация о соответствии REACH</li>
    <li>Спецификация материалов с прослеживаемостью поставщиков</li>
    <li>Отчёт об инспекции фабрики</li>
  </ul>

  <h2>4. Переговоры по MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Тип продукции</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Стандартный MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Диапазон для переговоров</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP-доски</td><td class="p-3 border">50 – 100 шт.</td><td class="p-3 border">5 – 10 шт. (пробная партия)</td></tr>
      <tr><td class="p-3 border">Байдарки</td><td class="p-3 border">50 – 100 шт.</td><td class="p-3 border">5 – 10 шт. (пробная партия)</td></tr>
      <tr><td class="p-3 border">Надувные лодки</td><td class="p-3 border">50 – 100 шт.</td><td class="p-3 border">2 – 5 шт. (пробная партия)</td></tr>
      <tr><td class="p-3 border">Лодки RIB</td><td class="p-3 border">20 – 50 шт.</td><td class="p-3 border">2 – 5 шт. (пробная партия)</td></tr>
      <tr><td class="p-3 border">Безопасность / Аксессуары</td><td class="p-3 border">200 – 500 шт.</td><td class="p-3 border">50 – 100 шт. (пробная партия)</td></tr>
    </tbody>
  </table>

  <h2>5. Логистика и доставка</h2>
  <p>Распространённые Incoterms: <strong>FOB</strong> (фабрика доставляет до порта отправления – наиболее распространённый), <strong>EXW</strong> (покупатель сам организует всю доставку от дверей фабрики), <strong>CIF</strong> (фабрика оплачивает фрахт и страховку до порта назначения).</p>
  <p>Надувные изделия имеют малый вес и большой объём – объёмный вес (DIM) часто определяет стоимость доставки. Запросите вакуумную упаковку для уменьшения объёма на 50–60%. Морская перевозка из Китая в ЕС: 25–35 дней; до западного побережья США: 15–20 дней.</p>

  <h2>6. Частые ошибки</h2>
  <ul>
    <li><strong>Нет аудита фабрики:</strong> Всегда проводите или заказывайте аудит третьей стороны (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Только устные спецификации:</strong> Нужен подробный технический лист спецификаций, подписанный обеими сторонами</li>
    <li><strong>Пропуск утверждения образцов:</strong> Письменное утверждение образцов перед серийным производством</li>
    <li><strong>Нет контроля качества во время производства:</strong> Инспекция третьей стороной во время производства (DUPRO) и перед отгрузкой (PSI)</li>
    <li><strong>Игнорирование соответствия:</strong> Проверьте сертификацию CE/UKCA до начала производства</li>
  </ul>

  <h2>7. Почему Afarer</h2>
  <p>Afarer производит надувные плавсредства OEM/ODM с 2012 года. Обладая сертифицированным по ISO 9001 предприятием площадью 12,000 m&sup2;, штатом из 25+ инженеров и сертификацией CE всех линеек продукции, мы соответствуем каждому критерию из этого руководства. Мы предлагаем пробные MOQ для новых партнёров и полные комплекты документации о соответствии.</p>

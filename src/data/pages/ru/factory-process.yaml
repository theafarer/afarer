intro: >-
  В отличие от брендов, которые передают производство сторонним фабрикам, afarer владеет и управляет всей своей производственной цепочкой. Эта вертикальная интеграция позволяет нам поддерживать строгий контроль качества на каждом этапе, быстро реагировать на индивидуальные требования и обеспечивать
  стабильное качество продукции партия за партией. Вот как строится доска на нашем предприятии.
steps:
  - step: '01'
    title: Приемка и входной контроль материалов
    description: >-
      Каждая поступающая партия PVC-ткани, стекломата, смолы и фурнитуры проверяется на соответствие спецификации. Образцы ткани тестируются на прочность на растяжение, равномерность толщины и стойкость к УФ перед допуском в производство. Несоответствующие материалы помещаются в карантин и
      возвращаются.
    duration: 1–2 дня
  - step: '02'
    title: Автоматическая резка PVC
    description: >-
      Одобренные ткани укладываются на автоматическую раскройную машину CNC и режутся с субмиллиметровой точностью. Компьютерно-оптимизированный расклад располагает панели для минимизации отходов — обычно ниже 5%. Вырезанные панели маркируются по модели доски и камере, затем комплектуются для
      передачи в сварочный цех.
    duration: 2–4 часа на комплект доски
  - step: '03'
    title: Термосварка и сварка труб
    description: >-
      Панели прихватываются и соединяются с помощью машин термосварки с горячим воздухом при контролируемых температурах 200–300 °C. Основные швы усиливаются RF-диэлектрической сваркой для герметичных высокопрочных соединений. Готовые камеры надуваются до 1,5× рабочего давления для 30-минутной
      проверки воздухонепроницаемости.
    duration: 1–2 дня на доску
  - step: '04'
    title: Печать SUP и декорирование
    description: Графика дека доски SUP наносится с помощью цифровой печати для полноцветных дизайнов фотографического качества и шелкографии для прочных логотипов и повторяющихся узоров. Отпечатки отверждаются и герметизируются для стойкости к УФ и истиранию.
    duration: 1–2 дня
  - step: '05'
    title: Финальная сборка и оснащение
    description: >-
      Доски оснащаются на сборочной линии плавниками, клапанами, EVA-настилами и аксессуарами. Каждое изделие проходит 100-точечный сборочный контрольный список с обязательной подписью на каждом этапе.
    duration: 2–4 дня
  - step: '06'
    title: Контроль качества и инспекция
    description: >-
      Каждая готовая доска проходит обязательный контроль качества: испытание камер на воздухонепроницаемость, проверку функционирования фурнитуры, проверку момента затяжки крепежа и косметическую инспекцию. Индивидуальные и прототипные сборки также проходят натурные испытания на воде, включая
      устойчивость и управляемость.
    duration: 1–2 дня
  - step: '07'
    title: Упаковка и отгрузка
    description: Доски сдуваются, складываются по процедуре, упаковываются в плотные тканые мешки или фанерные ящики и загружаются для отгрузки. Каждая упаковка маркируется моделью, серийным номером и пунктом назначения. Мы координируем с экспедиторами FCL и LCL контейнерные перевозки по всему миру.
    duration: 1 день

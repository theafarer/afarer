hero:
  tagline: 'Примеры работ'
  title: 'Реальные проекты, реальные результаты<br />—afarer в деле'
  subtitle: 'Узнайте, как afarer сотрудничает с дистрибьюторами, брендами и операторами по всему миру, предлагая индивидуальные морские решения для любых задач.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Примеры работ afarer —индивидуальные проекты морского производства'
features3_cases:
  tagline: 'Избранные проекты'
  title: 'Индивидуальные решения<br />для реальных задач'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Флот европейского дайвинг-центра'
      description: 'Поставка 12 катеров SUP 520 с дайв-конфигурацией для сети средиземноморских дайвинг-центров. Индивидуальные стойки для баллонов, дайвинг-трапы и брендирование флота. Доставлено за 60 дней.'
      icon: tabler:lifebuoy
    - title: 'OEM-программа австралийского дистрибьютора'
      description: 'Разработка линейки SUP-досок под частной маркой для австралийского дистрибьютора водных видов спорта. 8 моделей, индивидуальная упаковка и логистика прямой поставки. От концепции до первой отгрузки за 90 дней.'
      icon: tabler:currency-dollar
    - title: 'Поставка спасательных катеров на Ближний Восток'
      description: 'Поставка 20 патрульных катеров SUP 450 Patrol организации гражданской обороны на Ближнем Востоке. Самосливные палубы, полное навигационное оборудование и оранжевые баллоны высокой видимости. Соответствие местным нормативным стандартам.'
      icon: tabler:alert-triangle
    - title: 'Партнерство OEM с европейским брендом'
      description: 'Партнерство по производству white-label с европейским морским брендом. 5 моделей SUP, частный брендинг, эксклюзивные права распространения на рынке ЕС. Многолетнее соглашение.'
      icon: tabler:building
    - title: 'Флот карибского курорта'
      description: 'Полный пакет оборудования для водных видов спорта для карибского курорта: 40 SUP-досок, 20 байдарок, 10 надувных лодок и аксессуаров. Индивидуальный брендинг курорта на всем оборудовании.'
      icon: tabler:beach
    - title: 'Контракт на береговое патрулирование США'
      description: 'Поставка патрульных катеров SUP 600 агентству береговой безопасности США. Двухдвигательная конфигурация, бронированные консоли и интеграция военной электроники.'
      icon: tabler:shield

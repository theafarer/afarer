features3_cases:
  tagline: Избранные проекты
  title: Индивидуальные решения<br />для реальных задач
  isBeforeContent: false
  columns: 3
  items:
    - title: Флот европейского дайвинг-центра
      customer: Дайвинг-центры BlueMed
      country: Греция
      industry: Дайвинг и морской туризм
      challenge: >-
        Требовалось 12 досок SUP с дайвинг-конфигурацией для сети дайвинг-центров на нескольких греческих островах. Каждая доска должна была иметь индивидуальное крепление для снаряжения, место для хранения 8 баллонов и стабильную платформу для выхода дайвера в открытое море. Флот должен был прибыть
        в течение 60 дней к началу туристического сезона.
      solution: >-
        Произведено 12 моделей SUP Voyager Dive с интегрированными стойками для снаряжения, устойчивыми платформами и сверхширокой конструкцией с дроп-стич для стабильности при посадке. Каждая доска была брендирована в стилистике флота клиента. Все 12 досок прошли испытание на давление и были
        отправлены из Циндао в течение 55 дней.
      product: SUP Вояджер Дайв
      results: Все 12 досок поставлены вовремя к туристическому сезону. Флот эксплуатируется ежедневно уже 18 месяцев без каких-либо значительных неисправностей. Клиент заказал 6 дополнительных единиц во втором году.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP Voyager Dive был основой наших ежедневных дайвинг-операций. Стабильность отличная, а расположение места для хранения снаряжения держит палубу чистой и безопасной для наших гостей.
      icon: tabler:lifebuoy
    - title: Со-бренд программа австралийского дистрибьютора
      customer: Pacific Watersports Pty Ltd
      country: Австралия
      industry: Со-бренд и партнёрская программа
      challenge: >-
        Австралийскому дистрибьютору понадобилась линейка досок для SUP под частной маркой по конкурентоспособной цене, чтобы конкурировать с китайскими брендами, продающими напрямую потребителям. Требовалось 8 уникальных моделей для начинающих и продвинутых, с индивидуальной графикой,
        индивидуальной упаковкой и дропшиппингом в розничные магазины.
      solution: >-
        Разработаны 8 моделей SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) с эксклюзивным австралийским графическим пакетом. Индивидуальная розничная упаковка с QR-кодами, ведущими на видео с инструкциями по сборке. Логистика прямой поставки настроена из
        Циндао прямо в австралийские розничные магазины.
      product: Индивидуальная линия SUP (8 моделей)
      results: От концепции до первой поставки за 90 дней. Розничный уровень продаж составил 85% в первый сезон. Дистрибьютор расширил сотрудничество, включив дополнительные модели SUP во второй год.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Компания Afarer поставила полную линию SUP за 90 дней — от начального дизайна до розничного магазина. Качество соответствует брендам, продающимся по цене в два раза выше.
      icon: tabler:currency-dollar
    - title: Поставка спасательных катеров на Ближний Восток
      customer: Национальное управление гражданской обороны
      country: Объединённые Арабские Эмираты
      industry: Поиск и спасение
      challenge: Организации гражданской обороны потребовалось 20 САП-досок, готовых к патрулированию, для прибрежного поиска и спасения, охраны портов и реагирования на наводнения. Требовались доски с высокой видимостью, полное спасательное снаряжение и соблюдение местных морских правил.
      solution: >-
        Поставлено 20 моделей SUP Patrol с конструкцией из оранжевого дропа-стича повышенной видимости, полными пакетами безопасности, светоотражающей лентой SOLAS и усиленной конструкцией. Каждая доска была сертифицирована по CE и протестирована в соответствии с применимыми стандартами. Пакет
        документации включал сертификаты соответствия для местной регистрации.
      product: Патруль SUP
      results: Флот развернут на 5 прибрежных станциях. Платы работали в экстремальной жаре (45°C) без ухудшения. Производительность и долговечность превысили спецификации.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP Patrol превзошел наши эксплуатационные требования. В условиях экстремальной жары доски не показывают признаков повреждения от УФ-излучения после 24 месяцев ежедневного использования.
      icon: tabler:alert-triangle
    - title: Европейское со-бренд партнёрство
      customer: Северное море Морское оборудование BV
      country: Нидерланды
      industry: Со-бренд и партнёрская программа
      challenge: >-
        Известный европейский морской бренд хотел выйти на рынок SUP без инвестиций в производственные мощности. Требовался партнёр по белой маркировке, способный производить 5 моделей SUP (от 9 до 12 футов) с индивидуальной брендинговой маркировкой, сертификацией CE и эксклюзивными правами на
        дистрибуцию в ЕС.
      solution: >-
        Заключено соглашение о производстве под собственным брендом для 5 моделей SUP. Каждая модель маркирована логотипами клиента и цветовой схемой. Подготовлена документация для сертификации CE для каждой модели. Предоставлены исключительные права на распространение в ЕС с обязательными
        минимальными заказами. Предоставлена техническая документация для местной сети сервисного обслуживания.
      product: Индивидуальная линия SUP (5 моделей)
      results: Подписан многолетний контракт. Первый производственный выпуск в количестве 50 единиц отправлен в течение 75 дней. Бренд представлен на крупной выставке с положительным откликом дилеров.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Сотрудничество с afarer позволило нам выйти на рынок SUP без строительства собственного завода — они предоставили полноценное «под ключ» решение с сертификацией CE и документацией для поддержки дилеров.
      icon: tabler:building
    - title: Флот карибского курорта
      customer: Курорты Острова Рая ООО
      country: Багамы
      industry: Морской туризм и гостиничное дело
      challenge: >-
        Роскошному курорту требовался полный комплект водного спортивного оборудования для активностей гостей: 40 досок SUP для организованных туров, 20 дополнительных досок SUP для изучения лагуны, 10 досок SUP для экскурсий гостей, а также аксессуары. Все оборудование должно было иметь
        индивидуальный брендинг курорта и должно было быть доставлено до пикового туристического сезона.
      solution: >-
        Произведен полный комплект SUP: 40 досок SUP Voyager (модель All-Around), 20 досок SUP Explorer, 10 досок SUP Touring, а также спасательные жилеты, весла, насосы и ремонтные наборы. Все оборудование имеет логотип курорта и тропическую цветовую гамму. Контейнерная отгрузка с полным
        инвентарным списком.
      product: Полный комплект SUP (70 единиц)
      results: Флот прибыл за 6 недель до пикового сезона. Показатели удовлетворенности гостей водными видами спорта увеличились на 40% по сравнению с прошлым годом. Оборудование прослужило 3 сезона при проведении только планового обслуживания.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Подход с полным комплектом означал, что мы получили все необходимое в одной поставке — доски и аксессуары, все с брендом и готовое к использованию гостями. Нашим гостям очень нравится качество оборудования.
      icon: tabler:beach
    - title: Контракт на береговое патрулирование США
      customer: Атлантическое агентство прибрежной безопасности
      country: Соединённые Штаты
      industry: Морская безопасность и правоприменение
      challenge: Американское агентство по безопасности побережья требовало прочные патрульные SUP для операций в открытой воде. Были нужны высокопроизводительные доски с военным оборудованием и соответствием нормам Береговой охраны США.
      solution: >-
        Спроектированный патрульный SUP с усиленной конструкцией из сшитого поперечными нитями материала, схемами окраски повышенной видимости, креплениями для шифрованного коммуникационного оборудования и встроенными точками крепления оборудования. Доски усилены для выполнения тяжёлых операций.
        Предоставлена документация о соответствии требованиям USCG.
      product: Патруль SUP
      results: Агентство сообщило о 95% уровне готовности к выполнению миссий за первые 12 месяцев. Размещён дополнительный заказ на 8 единиц.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Патрульная SUP обеспечивает нашим экипажам производительность, необходимую для операций на открытой воде. Усиленная конструкция обеспечивает критическую прочность без ущерба для управляемости.
      icon: tabler:shield

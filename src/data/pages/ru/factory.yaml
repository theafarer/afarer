qc_section:
  tagline: Контроль качества
  title: Процесс тестирования и обеспечения качества
  subtitle: Каждая доска проходит обязательное тестирование перед отправкой. Лаборатория качества независима от производства и подчиняется руководству.
  steps:
    - step: '1'
      title: Инспекция сырья
      desc: ПВХ и drop-stitch ткани проходят тестирование на растяжение (ASTM D751), распространение разрыва и УФ-стойкость перед поступлением в производство.
    - step: '2'
      title: 24–48-часовой тест удержания воздуха
      desc: Каждая камера надувается до 125% номинального давления и выдерживается 24–48 часов. Падение давления свыше 5% вызывает автоматическое отклонение.
    - step: '3'
      title: Тестирование нагрузки и баланса
      desc: Готовые доски загружаются до максимальной расчетной грузоподъемности и тестируются на устойчивость и жесткость. Каждая доска проходит водные испытания перед финальной инспекцией.
oem_section:
  tagline: OEM проекты
  title: Кейсы партнерства брендов и OEM
  subtitle: От концепции до контейнера — как мы помогаем глобальным брендам запускать и масштабировать линейки надувных SUP-досок.
  cases:
    - challenge: Европейскому ритейлеру нужна была private-label SUP-линейка с уникальной графикой, экологичным ПВХ и готовой к ритейлу упаковкой — все за 60 дней.
      solution: Разработали файлы цифровой печати, нашли REACH-совместимый ПВХ, сократили сэмплирование с 3 раундов до 1, разместив команду дизайнеров на нашей фабрике в Циндао.
      result: 55 дней от подписания заказа до FOB. 2 400 единиц, 4 SKU. Повторный заказ до прибытия первого контейнера.
    - challenge: Американский стартап водных видов спорта нуждался в высокопроизводительной drop-stitch SUP-доске с индивидуальной формой, ко-брендовой упаковкой и сертификацией BSCI для розничного размещения.
      solution: Адаптировали существующую SUP-форму с измененным контуром, разработали дизайн ко-брендовой упаковки и предоставили полную документацию аудита BSCI.
      result: Успешный запуск в 3 крупных сетях США. 5 000+ единиц за первый год с 98% уровнем продаж.
    - challenge: Австралийский дистрибьютор требовал CE-сертифицированную линейку SUP с индивидуальными цветами и соответствием австралийским стандартам.
      solution: Произвели предсерийные образцы в 4 цветовых вариантах и организовали стороннее тестирование на соответствие.
      result: 3-модельная линейка SUP запущена на рынке Австралии и Новой Зеландии. За ней последовала победа в государственном тендере на 12 патрульных SUP.
faq_section:
  tagline: ЧАВО
  title: Часто задаваемые вопросы B2B и OEM
  questions:
    - q: Каков минимальный объем заказа (MOQ) для OEM надувных SUP-досок?
      a: MOQ начинается от 5–10 единиц для стандартных OEM моделей. Индивидуальные формы и проекты private label требуют минимум 200 единиц в зависимости от сложности. Пробные заказы и опытные партии доступны для запуска новых брендов.
    - q: Имеет ли afarer сертификацию BSCI?
      a: Да. Наша фабрика поддерживает действующую сертификацию BSCI по социальной ответственности (отчет аудита доступен по запросу). Мы также имеем сертификацию ISO 9001 для управления качеством, и все продукты имеют сертификацию CE. Документация соответствия REACH и RoHS предоставляется с каждой OEM-партией.
    - q: Каков типичный срок поставки OEM заказа?
      a: Стандартный срок 30–45 дней с подтверждения заказа. Разработка формы добавляет 15–20 дней. Доступно ускоренное производство.
    - q: Можете ли вы отгрузить FOB Циндао или CIF в наш порт?
      a: Да. Мы отгружаем FOB Циндао, CIF в крупные мировые порты и DDP для квалифицированных партнеров. Наша логистическая команда организует бронирование контейнеров, экспортную документацию и таможенное оформление. Мы отгружаем более чем в 50 стран на рынках ЕС, США, Австралии и Азии.
b2b_moq: 'Стандартный MOQ: 5–10 единиц на модель. Пробные заказы приветствуются для новых партнёрств.'
production_flow:
  tagline: Производственный процесс
  title: От материала до готовой доски
  subtitle: Каждая доска проходит через 6 этапов производства с контрольными проверками качества на каждом этапе. Никаких сокращений, никаких пропусков инспекций.
  stages:
    - stage: '01'
      title: Прием материалов и входной контроль качества
      description: Все поступающие материалы регистрируются по номеру партии/лоте в нашей ERP-системе. Рулоны ПВХ-тканей, сердечники с капельным швом, клапаны, клеи и комплектующие находятся на карантине до утверждения ОТК.
      qc_check: Прочность на растяжение (ASTM D751), разрывная прочность (ISO 4674), измерение толщины, вязкость клея, визуальная проверка на дефекты
      qc_threshold: Протестировано 100% партий. Отвергнуть, если прочность на разрыв < 90% от спецификации, разрыв < минимального значения по спецификации или имеется любой визуальный дефект
      responsibility: Прибывающая команда КК (3 инспектора)
    - stage: '02'
      title: ЧПУ резка и подготовка материалов
      description: Компьютерная оптимизация раскроя размещает панели на ПВХ-материале для минимизации отходов. Автоматические станки с ЧПУ обеспечивают точность позиционирования 0,1 мм.
      qc_check: Проверка размеров по CAD DXF файлам, инспекция качества кромок, проверка количества панелей
      qc_threshold: Каждый 20-й панель измеряется. Допуск ±0,5 мм. Отклоняйте партию, если более 2% за пределами допуска
      responsibility: Руководитель цеха резки
    - stage: '03'
      title: Сварка и склеивание с использованием технологии Drop-Stitch
      description: Сердечники с прерывистой стежкой соединяются с внешними ПВХ-ламинированными слоями с помощью термоламинации. Камеры труб сварены с помощью радиочастотной сварки или сварки горячим воздухом. Рельсовые полосы склеены трёхслойной методом фьюжн-бонда.
      qc_check: Тест на отрыв каждые 50 единиц (ASTM D751), измерение ширины сварного шва, просмотр журнала температуры горячего воздуха, визуальный осмотр шва под подсветкой
      qc_threshold: Прочность на отрыв минимум 8 Н/см. Допуск ширины сварного шва ±1 мм. Любая видимая канализация = отклонить
      responsibility: Контроль качества сварки (2 инспектора на смену)
    - stage: '04'
      title: Сборка и такелаж
      description: 'Доски поступают на финальную сборку, где соединяются все компоненты: рельсы склеены и сварены, установлены клапаны, D-образные кольца, ручки, гнезда для плавников и крепление для сумки для переноски. Каждое изделие проходит проверку по 100-точечному контрольному списку сборки.'
      qc_check: Подтверждение по 100-пунктовому контрольному списку для каждого блока, тест работы клапана (10 циклов открытия/закрытия), проверка затяжки аппаратуры, визуальный осмотр
      qc_threshold: 'Политика нулевого брака для критически важных элементов безопасности (клапаны, D-образные кольца, ручки). Незначительные косметические дефекты: AQL 2,5 (ISO 2859)'
      responsibility: Руководитель сборочной бригады + линейный контроль качества
    - stage: '05'
      title: Испытание под давлением и удержание качества
      description: Каждая камера надувается до 1,25× номинального давления (обычно 20–25 PSI) и удерживается в течение 24–48 часов. Датчики давления ведут непрерывный контроль. Камеры, у которых падение давления превышает 5%, отклоняются и направляются на повторный осмотр швов.
      qc_check: Журнал удержания давления за 24–48 часов, ежедневная проверка калибровки датчика, показание давления с температурной компенсацией, повторная проверка шва после ремонта
      qc_threshold: Максимальное падение давления 5% за 24–48 часов при стабильной температуре. Любая камера, превышающая это значение = 100% повторное тестирование всей производственной партии
      responsibility: Лаборатория качества (независимая от производства, подчиняется руководству)
    - stage: '06'
      title: Окончательная проверка и упаковка
      description: Окончательный визуальный и функциональный осмотр. Дефекты поверхности, однородность цвета, проверка этикетки/ящика, целостность упаковки и комплектность аксессуаров. Единицы продукции упакованы вакуумно, помещены в коробки и уложены на поддоны для загрузки в контейнер.
      qc_check: Полный визуальный осмотр, проверка принадлежностей по каждой SKU, тест падения упаковки (1 м, случайная выборка), проверка сканирования этикетки/штрих-кода
      qc_threshold: AQL 2,5 для основных дефектов, AQL 4,0 для незначительных. Нулевая терпимость к дефектам, связанным с безопасностью. 100% единиц проверяются визуально
      responsibility: Окончательная группа контроля качества (4 инспектора) Руководитель упаковочной команды

workshops_section:
  tagline: Цеха
  title: Производственные цеха
  workshops:
    - title: Раскрой ПВХ и подготовка материалов
      description: Автоматические ЧПУ-раскройные машины обрабатывают ПВХ, Hypalon и drop-stitch ткани с субмиллиметровой точностью. Компьютерно-оптимизированный расклад минимизирует отходы материала.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Сварка труб и термосварка
      description: Специализированный сварочный цех с машинами термосварки  и RF-прессами. Горячевоздушные сварочные аппараты соединяют ПВХ-камеры труб, а RF-сварка создает высокопрочные герметичные швы, превышающие требования .
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: Производство SUP-корпусов —стеклопластик
      description: Корпуса SUP-лодок производятся методом ручной выкладки стеклопластика с полиэфирными и винилэфирными смолами. Каждый слой раскатывается вручную и вакуумируется для стабильного качества.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: Печать и декорирование SUP
      description: SUP-доски декорируются цифровой печатью  для полноцветной графики и шелкографией  для логотипов. Цифровые принтеры создают фото-качественные рисунки палубы.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Финальная сборка и оснастка
      description: Сборочная линия, где стеклопластиковые корпуса и ПВХ-трубы соединяются, монтируются двигатели, подключаются системы управления и проводка. Каждая лодка проходит 100-точечный чек-лист.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Контроль качества и инспекция
      description: Каждая готовая лодка проходит обязательное тестирование удержания воздуха, верификацию швов и полную проверку систем перед отправкой. Лаборатория качества работает независимо от производства.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

hero:
  tagline: Фабрика
  title: Фабрика и производство
  subtitle: 12 000 м² интегрированного производства — от сырья до готовой доски
intro:
  - >-
    Как производственное подразделение **Aquafarer LLC (USA)**, команда afarer в Циндао контролирует каждый этап производства — от поступления сырья ПВХ и стекловолокна до финальной предэкспортной проверки готовой доски. Наше производственное помещение в зоне экономического развития Циндао занимает 12 000 квадратных метров и включает специализированные
    цеха для раскроя ПВХ, термосварки труб, производства форм из стеклопластика (FRP), цифровой печати SUP, финальной сборки и контроля качества.
  - >-
    Объединяя дизайн, инженерию, прототипирование, производство и тестирование под одной крышей, мы устраняем неэффективность контрактного производства и сохраняем прямой контроль над качеством сборки, выбором материалов и сроками поставки. Каждая доска, покидающая наш цех, построена нашими людьми,
    на нашем оборудовании, по нашим стандартам.

workshops_section:
  tagline: Цеха
  title: Производственные цеха
  workshops:
    - title: Раскрой ПВХ и подготовка материалов
      description: Автоматические ЧПУ-раскройные машины обрабатывают ПВХ и drop-stitch ткани с субмиллиметровой точностью. Компьютерно-оптимизированный расклад минимизирует отходы материала и обеспечивает соответствие каждой панели размерной спецификации перед сваркой.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Сварка труб и термосварка
      description: Специализированный сварочный цех с машинами термосварки и RF-прессами. Горячевоздушные сварочные аппараты соединяют ПВХ-камеры труб, а RF-сварка создает высокопрочные герметичные швы, превышающие требования EN ISO 25649.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: Формы FRP и композитное производство
      description: Индивидуальные формы из стеклопластика (FRP) для компонентов SUP производятся методом ручной выкладки стекловолокна с полиэфирными и винилэфирными смолами. Каждый слой раскатывается вручную и вакуумируется для стабильного качества. Кабина гелькоутного напыления обеспечивает высокоглянцевую, УФ-стойкую морскую отделку.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: Печать и декорирование SUP
      description: SUP-доски декорируются цифровой печатью для полноцветной графики и шелкографией для логотипов и повторяющихся узоров. Цифровые принтеры создают фото-качественные рисунки палубы, а шелкография обеспечивает долговечные, яркие фирменные знаки.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Финальная сборка и оснастка
      description: Сборочная линия, где сердечники drop-stitch отделываются рельсами, наносятся EVA-настилы, устанавливаются плавники, клапаны и аксессуары. Каждая доска проходит 100-точечный чек-лист, утверждаемый руководителем бригады.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Контроль качества и инспекция
      description: Каждая готовая доска проходит обязательное тестирование удержания воздуха, проверку отслаивания швов и полную проверку систем перед отправкой. Лаборатория качества работает независимо от производства и подчиняется руководству.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

material_traceability:
  tagline: Прослеживаемость
  title: Отслеживание материалов и контроль партий
  description: >-
    Каждой партии сырья присваивается уникальный номер партии в нашей системе ERP. От момента поступления через производство до готового продукта, спецификация каждой партии продукции связана с исходной партией поставщика. Это обеспечивает полную прослеживаемость вверх по цепочке на случай любых
    вопросов качества или соответствия требованиям.
  system: Настраиваемая ERP-система (внутренняя система группы Qingdao Vatrad) + физические теги партий на каждом производственном заказе
  coverage: 100% производственных материалов — ПВХ, ткань с капельной строчкой, клеи, клапаны, фурнитура, упаковка
  records_retained: 10 лет (в соответствии с требованием CE 2013/53/EU)
  suppliers:

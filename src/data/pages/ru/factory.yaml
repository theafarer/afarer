material_traceability:
  tagline: Traceability
  title: Material Tracking & Batch Control
  description: Every batch of raw material is assigned a unique lot number in our ERP system. From arrival through production to the finished product, each boat's bill of materials links back to the original supplier batch. This enables full upstream traceability for any quality or compliance inquiry.
  system: Custom ERP (Qingdao Vatrad Group internal system) + physical batch tags on each work order
  coverage: 100% of production materials —PVC, Hypalon, drop-stitch fabric, adhesives, valves, hardware, packaging
  records_retained: 10 years (per CE 2013/53/EU requirement)
  suppliers:
    - material: Marine-grade PVC
      source: Chinese and Korean suppliers
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch fabric
      source: In-house weaving + external partner
      certified: Internal QC + supplier ISO 9001
    - material: Valves & Hardware
      source: Chinese OEM suppliers
      certified: ISO 9001, material certs per batch

hero:
  tagline: Наша команда
  title: Люди, стоящие за afarer<br />—инжиниринг свободы на воде
  subtitle: Основанная в 2012 году в Циндао, Китай, afarer была создана морскими инженерами, материаловедами и энтузиастами водных видов спорта, которые верили в то, что профессиональные надувные плавсредства должны быть доступны во всем мире.
  image:
    src: /images/team-all.webp
    alt: Полная командная фотография Afarer — инженерия, производство и руководство
founding:
  tagline: Наше основание
  title: От прибрежной мастерской<br />до предприятия площадью 12 000 м²
  subtitle: afarer была основана командой морских инженеров с десятилетиями совокупного опыта в проектировании надувных лодок, производстве ПВХ/Hypalon и глобальном производстве морского оборудования.
  items:
    - title: 'Основан: 2012'
      description: Основана в Циндао, Китай —крупном морском узле с глубокими судостроительными традициями.
      icon: tabler:calendar
    - title: 200 сотрудников
      description: Включая более 50 инженеров R&D, специалистов по контролю качества и производственных техников.
      icon: tabler:users
    - title: Помещение площадью 12 000 м²
      description: Специализированный производственный завод с 6 производственными линиями для SUP, надувных лодок и SUP-досок.
      icon: tabler:building-factory
    - title: Обслуживаем 50 стран
      description: Экспорт в Европу, Америку, Ближний Восток, Азиатско-Тихоокеанский регион и Африку.
      icon: tabler:globe
leadership:
  tagline: Лидерство
  title: Руководство и инженерное лидерство
  subtitle: Наша руководящая команда объединяет глубокий опыт в морском инжиниринге, международной торговле и управлении качеством.
  columns: 3
  items:
    - title: Основатель и генеральный директор
      name: Toby Liu
      description: 15 лет в судостроении. Ранее руководил НИОКР в крупной китайской компании по производству лодок. Имеет несколько патентов на дизайн надувных лодок.
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: Главный инженер
      name: Zhang Wei
      description: 20 лет в производстве из ПВХ/Гипалона и проектировании корпусов с глубоким V-образным дном. Бывший технический директор европейской судостроительной компании.
      icon: tabler:engine
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Руководитель отдела НИОКР
      name: Chen Ming
      description: Кандидат наук в области материаловедения. Специализируется на технологии drop-stitch и высокочастотной сварке. Более 10 лет в текстильных композитах.
      icon: tabler:flask
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Директор по производству
      name: Liu Qiang
      description: 18 лет в бережливом производстве и оптимизации производственных линий. Черный пояс Six Sigma. Внедрил системы качества ISO 9001.
      icon: tabler:settings
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Менеджер по качеству
      name: Wang Fang
      description: 12 лет в контроле качества морской продукции. Сертифицированный аудитор CE и ISO. Контролирует тестирование каждой производственной партии.
      icon: tabler:shield-check
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Директор по продажам и операциям
      name: Helen Lee
      description: 15 лет в международной B2B торговле. Управлял со-бренд и дистрибьюторскими партнёрствами в 30 странах. Свободно владею 4 языками.
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Философия дизайна
  title: Инженерно-ориентированный дизайн<br />—каждая деталь имеет значение
  subtitle: Наша инженерная философия сосредоточена на трех принципах, которые определяют каждый продукт, который мы создаем.
  list:
    - 'Надежность прежде всего: каждый продукт afarer проходит испытания на устойчивость к реальным условиям — от спасательных операций в холодной воде до аренды в тропических курортах. Мы перестраиваем конструкции с большим запасом там, где это наиболее важно.'
    - 'Точное производство: наши производственные мощности используют ЧПУ-резку, высокочастотную сварку и автоматическое испытание под давлением. Каждый шов, каждый клапан, каждая арматура соответствуют документированным спецификациям.'
    - 'Непрерывные инновации: Наша команда НИОКР постоянно оценивает новые материалы, производственные методы и улучшения дизайна. Мы не ждем проблем — мы их предвидим.'

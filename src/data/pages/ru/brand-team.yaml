hero:
  tagline: Our Team
  title: 'Люди, стоящие за afarer<br />—инжиниринг свободы на воде'
  subtitle: 'Основанная в 2012 году в Циндао, Китай, afarer была создана морскими инженерами, материаловедами и энтузиастами водных видов спорта, которые верили в то, что профессиональные надувные плавсредства должны быть доступны во всем мире.'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'От прибрежной мастерской<br />до предприятия площадью 12 000 м²'
  subtitle: 'afarer была основана командой морских инженеров с десятилетиями совокупного опыта в проектировании надувных лодок, производстве ПВХ/Hypalon и глобальном производстве морского оборудования.'
  items:
    - title: 'Founded: 2012'
      description: 'Основана в Циндао, Китай —крупном морском узле с глубокими судостроительными традициями.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'Включая более 50 инженеров R&D, специалистов по контролю качества и производственных техников.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Специализированный производственный завод с 6 производственными линиями для SUP, надувных лодок и SUP-досок.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Экспорт в Европу, Америку, Ближний Восток, Азиатско-Тихоокеанский регион и Африку.'
      icon: tabler:globe

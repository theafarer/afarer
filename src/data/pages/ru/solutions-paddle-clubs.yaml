packages:
  title: Клубные программы флота
  subtitle: Выберите программу флота, которая соответствует размеру и амбициям вашего клуба.
  items:
    - name: Стартовый пакет
      tagline: Для новых клубов, до 30 участников
      features:
        - 10 SUP-досок (микс all-round + touring)
        - 10 весел + 10 спасательных жилетов
        - 2 помпы двойного действия + ремкомплект
        - Брендинг клуба на досках (печать логотипа)
        - Руководство по запуску + контрольный список безопасности
        - Сертификат CE — все оборудование
      cta_text: Начните свой клуб
    - name: Профессиональный флот
      tagline: Для сложившихся клубов, 50-100 участников
      features:
        - 30 SUP-досок (3 варианта размера)
        - 30 весел + 30 спасательных жилетов
        - 5 помп + 2 ремкомплекта + стойка для хранения
        - Индивидуальные цвета клуба + логотип на досках
        - Программа замены запчастей (скидка 15%)
        - Сессия по обучению персонала (онлайн)
        - Сертификат CE — все оборудование
      popular: true
      cta_text: Постройте свой флот
    - name: Гоночный флот
      tagline: Для гоночных клубов, событий, соревнований
      features:
        - 50+ гоночных / производительных плат
        - Полный комплект аксессуаров (весла, жилеты, помпы)
        - Комплект поддержки мероприятий (стартовые буи, разметка)
        - Приоритетные детали (отправка в течение 24 часов)
        - Выделенный менеджер по работе с клиентами
        - Вариант индивидуальной формы для команды
        - Сертификат CE — все оборудование
      cta_text: Получить гоночный флот

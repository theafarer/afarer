meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Члены клуба гребли на одинаковых досках Afarer SUP
benefits:
  title: Преимущества клубного флота
  subtitle: Почему гребные клубы в 50 странах выбирают Afarer в качестве своего партнёра по оборудованию.
  items:
    - metric: 40%
      label: Снижение затрат на автопарк
      detail: Против розничных цен с оптовыми скидками клубов
    - metric: 48ч
      label: Замена деталей
      detail: Минимальные простои для вашего автопарка в аренду
    - metric: Пятьсот
      label: Прокатные велосипеды
      detail: Коммерческая прочность каждой доски
    - metric: 5 лет
      label: Срок службы флота
      detail: При надлежащем уходе и обслуживании
packages:
  title: Клубные программы флота
  subtitle: Выберите программу флота, которая соответствует размеру и амбициям вашего клуба.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Launch guide + safety checklist
        - Руководство по запуску   контрольный список безопасности
        - Сертификат CE — все оборудование
      cta_text: Начните свой клуб
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Replacement parts program (15% discount)
        - Staff training session
        - Сессия по обучению персонала (онлайн)
        - Сертификат CE — все оборудование
      popular: true
      cta_text: Постройте свой флот
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50 гоночных / производительных плат
        - Full accessory set
        - Event support kit
        - Приоритетные детали (отправка в течение 24 часов)
        - Выделенный менеджер по работе с клиентами
        - Вариант индивидуальной формы для команды
        - Сертификат CE — все оборудование
      cta_text: Получить гоночный флот
training:
  title: Пакеты учебного центра
  subtitle: Всё, что нужно школе SUP для проведения курсов профессиональной сертификации.
  items:
    - name: Instructor Starter
      features:
        - 5 премиальных SUP-досок (инструкторского уровня)
        - 5 углеродных весель для демонстраций
        - 5 спасательных жилетов (подгонка инструктора)
        - Руководство по учебной программе
        - Оборудование с сертификатом CE
    - name: School Full Set
      features:
        - 20 SUP-досок (смешанный состав студентов и инструкторов)
        - 20 весёл 20 спасательных жилетов (разных размеров)
        - 10 спасательных жилетов для начинающих
        - 4 насоса   комплекта для ремонта
        - Учебная программа и поддержка сертификации
        - Оборудование с сертификатом CE
features:
  title: Почему клубы выбирают Afarer
  subtitle: Постоянное качество, быстрые поставки деталей и оптовые цены, созданные для растущих клубов.
  items:
    - title: 500 арендных велосипедов
      description: Коммерческие доски выдерживают сезоны ежедневного использования.
      icon: tabler:shield-check
    - title: Пользовательские цвета
      description: Соответствуйте идентичности вашего клуба с помощью индивидуальных цветов доски и логотипа.
      icon: tabler:palette
    - title: Оптовые цены
      description: Скидки на объем для заказов автопарка от 10 плат.
      icon: tabler:discount
    - title: Быстрые части
      description: Запчасти отправляются в течение 48 часов.
      icon: tabler:truck-delivery
    - title: Поддержка роста клуба
      description: Советы по программам членства, ценообразованию и организации мероприятий.
      icon: tabler:trending-up
    - title: Сертификат CE
      description: Все оборудование соответствует международным стандартам безопасности.
      icon: tabler:certificate
cta:
  title: Готовы создать свой паддл-клуб?
  subtitle: Получите предложение для вашего клубного автопарка или скачайте наше руководство для начинающих клуба.
  actions:
    - text: Подать заявку на клубный флот

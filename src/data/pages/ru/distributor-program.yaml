features:
  title: 'Почему Afarer — Ваш Партнер'
  subtitle: 'Создано для дистрибьюторов, которые хотят развивать бизнес водных видов спорта с серьезным брендом за спиной.'
  columns: 3
  items:
    - title: 'Территориальная Эксклюзивность'
      description: 'Защищенный рынок в стране или регионе. Один дистрибьютор, никакой внутренней конкуренции, никаких конфликтов каналов — ваши инвестиции создают вашу собственную защиту.'
      icon: 'tabler:shield-check'
    - title: 'Прямые Заводские Маржи'
      description: 'Дилерский прайс-лист со скидками за согласованные объемы. Без посредников. Отгрузка FOB Qingdao с полным пакетом экспортных документов.'
      icon: 'tabler:coins'
    - title: 'Программа Успеха Дистрибьютора'
      description: 'Структурированный онбординг, планирование выхода на рынок, обучение по продукту и продажам, поддержка демо-парка и инструменты совместного маркетинга.'
      icon: 'tabler:rocket'
    - title: 'Маркетинговая и Брендовая Поддержка'
      description: 'Локализованные материалы кампаний, POS-материалы, событийные кейсы и многоязычный цифровой контент.'
      icon: 'tabler:mood-smile'
    - title: 'Надежная Цепочка Поставок'
      description: 'Производство с сертификацией ISO и CE, стабильный контроль качества, предсказуемые MOQ и сроки поставки, под которые можно планировать.'
      icon: 'tabler:building-factory'
    - title: 'Персональный Менеджер'
      description: 'Личный менеджер по дистрибуции для прогнозирования, планирования заказов и постпродажной поддержки.'
      icon: 'tabler:user-check'

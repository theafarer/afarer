faqs:
  title: 'Страновое партнерство — Частые вопросы'
  subtitle: 'Вопросы, которые серьезные страновые партнеры задают перед подачей заявки.'
  items:
    - title: 'Что на самом деле значит «одна страна — один дистрибьютор»?'
      description: 'Afarer назначает единственного авторизованного дистрибьютора с эксклюзивными правами на определенную территорию. Мы не продаем на защищенную страну через наши глобальные или региональные каналы. Ваша территория сохраняется, пока соблюдается Дистрибьюторское соглашение.'
    - title: 'Эксклюзивность территории бессрочна?'
      description: 'Нет. Эксклюзивность условна, а не бессрочна. Она поддерживается подписанным Дистрибьюторским соглашением, выполнением первого заказа, ежегодными объемами закупок, локальным складом, возможностью послепродажного обслуживания и постоянными инвестициями в рынок. Если эти условия не соблюдаются, территория может быть пересмотрена или передана другому партнеру.'
    - title: 'Каков минимальный первый заказ?'
      description: 'Страновые и региональные дистрибьюторы начинают со 100–300 единиц; авторизованные дилеры — с 30–50 единиц; тестовые заказы от 10–30 единиц позволяют сначала проверить рынок (тестовые и пробные заказы не дают территориальной защиты). Программы кастомизации и private label следуют отдельным MOQ, указанным в уровнях выше.'
    - title: 'Какая поддержка входит в программу из 10 модулей?'
      description: 'Уровни и квалификация, защита территории, MOQ / цены / ежегодные бонусы, управление складом и исполнение заказов, маркетинговые материалы и совместные фонды на рынок, обучение по продукту / продажам / техническим вопросам, запасные части и послепродажное обслуживание, регистрация гарантии, партнерский портал, а также технические паспорта продуктов, библиотека маркетинговых материалов, график ежегодных бонусов и отгрузочные и упаковочные листы.'
    - title: 'Как Afarer защищает меня от конфликтов каналов?'
      description: 'У каждой территории ровно один авторизованный дистрибьютор. Запросы и прямые заказы из вашего региона проходят через вас, формы на сайте перенаправляются местному партнеру, если он существует, а глобальная команда подключается, только если партнер не отвечает.'
    - title: 'Каковы условия отгрузки и оплаты?'
      description: 'Заказы отгружаются FOB Qingdao с полным пакетом экспортных документов. Производственные заказы — 30% предоплата и 70% до отгрузки; тестовые и пробные заказы оплачиваются заранее. Стандартный срок поставки — 30–45 рабочих дней, для пробных партий — 15–20 рабочих дней.'
    - title: 'Как подать заявку?'
      description: 'Отправьте заявку через форму обратной связи с данными о вашем рынке. Мы оцениваем соответствие рынку, розничное присутствие и логистические возможности, затем отвечаем в течение 3 рабочих дней с дальнейшими шагами и образцом Дистрибьюторского соглашения.'

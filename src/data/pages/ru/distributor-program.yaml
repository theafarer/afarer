faqs:
  title: 'Дилерская программа — Частые вопросы'
  subtitle: 'Все, что дистрибьюторы спрашивают перед подачей заявки.'
  items:
    - title: 'Что значит одна страна — один дистрибьютор?'
      description: 'Afarer предоставляет единственному авторизованному дистрибьютору исключительные права на страну или регион. Вы владеете своим рынком — никакого параллельного импорта и внутренней конкуренции.'
    - title: 'Каков минимальный первый заказ?'
      description: 'Дистрибьюторы страны и региона начинают со 100–300 штук. Авторизованные дилеры — от 30–50 штук. Тестовые заказы от 10–30 штук позволяют сначала проверить рынок (без территориальной защиты).'
    - title: 'Какую поддержку получают дистрибьюторы?'
      description: 'Программа успеха дистрибьютора включает онбординг, планирование выхода на рынок, обучение продукту и продажам, поддержку демо-парка, локализованные маркетинговые материалы и персонального менеджера.'
    - title: 'Как Afarer защищает меня от конфликтов каналов?'
      description: 'У каждой территории ровно один авторизованный дистрибьютор. Прямые заказы из вашего региона проходят через вас, а цены защищают вашу маржу.'
    - title: 'Каковы условия доставки и оплаты?'
      description: 'Заказы отгружаются FOB Qingdao с полным пакетом экспортных документов. Производственные заказы — 30% аванс и 70% до отгрузки; тестовые и пробные заказы — предоплата.'
    - title: 'Как подать заявку?'
      description: 'Отправьте заявку через форму обратной связи. Мы оцениваем соответствие рынку, розничное присутствие и логистические возможности и отвечаем в течение 3 рабочих дней с дальнейшими шагами и образцом дистрибьюторского договора.'

hero_text:
  tagline: Resources
  title: 'Центр загрузок и руководства покупателя'
  subtitle: 'Получите доступ к каталогам продукции, руководствам OEM, чек-листам покупателя и технической документации для принятия обоснованных решений о закупках.'
features3_downloads:
  tagline: Downloads
  title: 'Документация по продукции<br />и ресурсы для покупателя'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Полный ассортимент продукции, включая SUP-лодки, надувные лодки, SUP-доски, байдарки и аксессуары. Спецификации, конфигурации и опции. Формат PDF.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'Все, что нужно знать о партнерстве OEM/ODM: обзор процесса, минимальные объемы заказа, возможности кастомизации, контроль качества и доставка.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'Как выбрать правильный SUP: материалы корпуса, материалы труб, выбор двигателя, размеры и варианты конфигурации для различных применений.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'Ключевые соображения при выборе производителя SUP-досок: показатели качества, требования сертификации, MOQ и на что обратить внимание при аудите фабрики.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC против Hypalon: сравнение долговечности, УФ-стойкости, срока службы, вариантов ремонта и стоимости для различных морских применений.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'Загрузите наш шаблон брифа продукта. Заполните ваши требования и отправьте нам для получения предложения и оценки可能性 в течение недели.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Часто задаваемые вопросы о нашей продукции, производственном процессе и модели партнерства.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ варьируется в зависимости от категории продукта. SUP-лодки обычно начинаются от 10 единиц на модель. SUP-доски от 50 единиц. Свяжитесь с нашей командой продаж для получения информации о MOQ для конкретного продукта.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Да. afarer предоставляет производство образцов для оценки перед массовым производством. Стоимость образцов обсуждается и часто засчитывается в первый производственный заказ.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Стандартные условия: 30% депозит при заказе, 70% перед отгрузкой. Аккредитивы доступны для соответствующих клиентов. Свяжитесь с нашим финансовым отделом для обсуждения.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Типичные сроки: SUP-лодки 30-45 дней, SUP-доски 20-30 дней, надувные лодки 25-35 дней. Индивидуальная разработка добавляет 15-30 дней на прототипирование.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'Сертификация CE для рынков ЕС, производство, одобренное береговой охраной США, система качества ISO, соответствие BSCI и REACH.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Да. Мы предоставляем индивидуальную упаковку с вашим логотипом, цветами и брендом. MOQ для индивидуальной упаковки зависит от категории продукта.'
      icon: tabler:color-swatch
cta:
  title: 'Нужна помощь в поиске нужного ресурса?'
  subtitle: 'Свяжитесь с нашей командой для индивидуальной консультации по выбору продукции, партнерству OEM или техническим спецификациям.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

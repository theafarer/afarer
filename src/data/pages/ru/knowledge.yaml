hero:
  tagline: База знаний
  title: Знания об исследовании воды
  subtitle: |
    Структурированная база знаний, охватывающая технологию надувных SUP,<br />
    безопасность на воде, инженерию лодок и планирование приключений.
  taglineSection: Исследуйте. Учитесь. Действуйте с уверенностью.
clusters:
  tagline: Кластеры знаний
  title: Исследуйте по теме
  subtitle: Глубокое погружение в технологии, безопасность и навыки, стоящие за каждым продуктом afarer.
  items:
    - title: Знания о SUP
      description: От выбора первой доски до продвинутых техник туринга —всё о гребле стоя.
      icon: tabler:lifebuoy
      topics:
        - Как выбрать первый надувной SUP
        - Лучший размер SUP для начинающих
        - Насколько сложна гребля стоя?
        - Сравнение надувной и жесткой доски
        - Чек-лист безопасности SUP
    - title: Знания о лодках
      description: Технические руководства по надувным лодкам, SUP, тузикам и байдаркам —инженерия, материалы и эксплуатация.
      icon: tabler:sailboat
      topics:
        - 'Типы надувных лодок: объяснение'
        - Сравнение ПВХ и Hypalon
        - 'SUP против Тузика: сравнение'
        - 'Технология Drop-stitch: глубокое погружение'
        - Руководство по морским материалам
    - title: Безопасность
      description: Основные знания по безопасности для каждого гребца —от выбора PFD до чтения погоды и техник самоспасения.
      icon: tabler:shield
      topics:
        - Чек-лист безопасности SUP
        - Нужен ли вам спасательный жилет?
        - Руководство по безопасности в океане
        - Безопасность на реках для надувных байдарок
        - Оценка погоды и состояния воды
    - title: Технологии
      description: Инженерия продуктов afarer —материалы, методы производства и контроль качества.
      icon: tabler:microscope
      topics:
        - Технология морского ПВХ
        - 'Drop-stitch core: объяснение'
        - Почему PSI важен для надувных SUP
        - RF-сварка против клеевого соединения
        - Тестирование качества и сертификация
    - title: SUP Lifestyle & Special Uses
      description: Specialized SUP activities —yoga, fishing, dogs, families, and travel tips.
      icon: tabler:heart
      topics:
        - SUP yoga and meditation on water
        - Fishing from an inflatable SUP
        - Paddle boarding with dogs and kids
        - Traveling with your SUP by air and car
        - SUP accessories and gear essentials
    - title: SUP Comparisons & References
      description: Side-by-side comparisons to help you make informed decisions.
      icon: tabler:chart-bar
      topics:
        - SUP vs kayak — which is right for you?
        - PVC vs Hypalon material comparison
        - Single chamber vs multi-chamber safety
        - SUP board materials explained
        - UV printing vs EVA block artwork

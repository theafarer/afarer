  title: Лаборатория качества и инспекции — тестирование и сертификация РИБ в соответствии с ISO | {SITE}
  description: Независимая проверка качества надувных лодок. Испытания на растяжение, циклы удержания воздуха, тесты на разрыв швов и сертификация материалов. Свяжитесь с нашей лабораторией качества для проведения стороннего тестирования.

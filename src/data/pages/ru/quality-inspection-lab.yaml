hero:
  tagline: Лабораторная работа 06
  title: Лаборатория качества и инспекции
  subtitle: Независимая проверка — каждый тест пройден перед поставкой
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: Лаборатория проверки качества Afarer, ультрафиолетовое испытание
intro: >-
  Каждое судно, покидающее нашу мастерскую, сопровождается сертификатом, подтверждающим, что оно прошло определённый набор проверок качества и испытаний материалов. Наша Лаборатория Качества и Инспекции является независимой функцией внутри организации — она подчиняется напрямую управляющему
  директору, а не производству — что гарантирует, что никакое коммерческое давление не сможет повлиять на процесс инспекции. Если партия материалов или готовое судно не соответствуют опубликованным спецификациям, лаборатория имеет право приостановить отгрузку до устранения несоответствия.
content_html: >-
  <h2>Доверяй, но проверяй</h2>

  <p>Лаборатория работает в рамках системы менеджмента качества, основанной на соответствующих принципах, а наши методы испытаний базируются на стандартах ISO, ASTM и EN везде, где это применимо. Мы ведём подробные записи о каждом проведённом испытании, создавая полную цепочку прослеживаемости от
  приёмки сырья до окончательной поставки лодки.</p>


  <h2>Испытательное оборудование и возможности</h2>

  <table>
    <thead><tr><th>Оборудование</th><th>Проводимые испытания</th><th>Стандарт / Метод</th></tr></thead>
    <tbody>
      <tr><td>Универсальная испытательная машина (50 kN)</td><td>Прочность на разрыв (ткань), сопротивление отслаиванию (швы), распространение раздира</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Стенд проверки воздухоудержания (программируемый)</td><td>Испытание на выносливость: 1000 циклов надувания/спускания, испытание на удержание давления в течение 30 мин</td><td>ISO 6185 (внутренний)</td></tr>
      <tr><td>Приспособление для отслаивания швов (механизированное отслаивание под углом 180°)</td><td>Прочность сварных и клеевых швов на отслаивание при 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Прибор для определения гидростатического напора</td><td>Сопротивление ткани проникновению воды (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Цифровой толщиномер и микрометр</td><td>Толщина ткани, толщина стенки баллона, толщина клеевой плёнки</td><td>ISO 2286-3</td></tr>
      <tr><td>Климатическая камера</td><td>Температурная подготовка (от -40 °C до +80 °C) для испытаний на растрескивание при низкой температуре и термостарение</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Спектрофотометр цвета</td><td>Измерение цветового различия Delta-E после воздействия УФ-излучения</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>Контрольные точки — от материала до отгрузки</h2>

  <p>Каждая лодка проходит по утверждённому плану качества с обязательными контрольными точками. Ни одна лодка не может пропустить контрольную точку; каждая из них должна быть подписана инспектором по качеству до начала следующего производственного этапа.</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Контроль входных материалов</p>
            <p class="text-xs text-gray-500 mt-1">Партия ткани, партия клея, фурнитура — всё проверяется на соответствие входной спецификации перед передачей в производство.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Промежуточный контроль сварки</p>
            <p class="text-xs text-gray-500 mt-1">Первый сварной образец-свидетель в начале каждой производственной смены испытывается на отслаивание и проверяется визуально.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Пневмоиспытание баллона</p>
            <p class="text-xs text-gray-500 mt-1">Каждый баллон нагнетается до давления 1.5 x рабочего и выдерживается 30 мин. Данные регистрируются по серийному номеру.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Предотгрузочный контроль</p>
            <p class="text-xs text-gray-500 mt-1">Проверяется полностью собранная лодка: все крепёжные элементы затянуты с требуемым моментом, системы работоспособны, отсутствуют косметические дефекты. Контрольный лист на 100 пунктов.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Финальная сертификация</p>
            <p class="text-xs text-gray-500 mt-1">Сформированы протоколы испытаний, проверены записи контроля, выдан Сертификат соответствия.</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>Ключевые показатели качества (скользящее среднее за 2025 г.)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Выход годных с первого раза (партия ткани)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Доля брака сварных швов (на погонный метр)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Баллоны проходят пневмоиспытание перед сборкой</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">Соответствие категории проектирования</span>
    </div>
  </div>


  <h2>Наша команда по качеству</h2>

  <p>В лаборатории работают руководитель по качеству (10 лет опыта в области обеспечения качества в морской отрасли, сертифицированный инженер по качеству ASQ), два инспектора по качеству (каждый имеет сертификацию NDT уровня 2 по визуальному контролю — неразрушающий контроль) и техник по
  материалам, отвечающий за все физические испытания. Команда ежегодно проходит проверку квалификации у независимого стороннего провайдера, чтобы гарантировать точность и воспроизводимость результатов наших испытаний.</p>


  <h2>Независимые испытания для клиентов</h2>

  <p>Наша лаборатория качества и контроля доступна для оказания услуг независимых испытаний. Если вам необходимо проверить спецификацию ткани, подтвердить новую клеевую систему или получить протокол сторонних испытаний для квалификации при закупках, мы можем провести испытания по применимому
  стандарту и выдать сертифицированный протокол.</p>

  <p>Примеры недавних сторонних испытаний:</p>

  <ul>
    <li>Сравнение прочности на отслаивание пяти конкурирующих клеевых плёночных продуктов для европейской программы военных закупок.</li>
    <li>Исследование ускоренного старения (УФ-облучение + термоциклирование) для новой рецептуры оранжевого ПВХ с регулярными промежуточными измерениями с интервалом 500 h.</li>
    <li>Подтверждение воздухоудержания 50 прототипных клапанов-перегородок для новой конструкции баллона высокого давления.</li>
  </ul>


  <h2>Наши обязательства перед вами</h2>

  <p>Когда вы получаете лодку {SITE.name}, вместе с ней вы получаете и её досье по качеству — сводный рекорд результатов испытаний, относящихся к вашей конкретной лодке. Сертификат на партию ткани, испытания сварных швов на отслаивание, журналы пневмоиспытаний баллонов и предотгрузочный контрольный
  лист. Каждое значение прослеживаемо. Каждый инспектор идентифицирован. Это не просто документы — это наша гарантия того, что мы поставили именно то, что было заявлено в спецификации.</p>

  <p>Если у вас возникнут вопросы по качеству, вы можете напрямую связаться с лабораторией — контактные данные указаны на вашем сертификате соответствия. Мы серьёзно относимся к каждому обращению и обязуемся провести официальное расследование в течение 48 часов.</p>

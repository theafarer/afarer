      desc: Разработка новых материалов, конструкций и производственных технологий для улучшения характеристик продукта и его долговечности.
    - icon: design
      title: Ориентированный на пользователя дизайн
      desc: Глубокое понимание и превосхождение потребностей пользователей через эргономичный и интуитивно понятный дизайн продукта.
    - icon: globe
      title: Устойчивые практики
      desc: Минимизация нашего воздействия на окружающую среду за счет использования экологически чистых материалов и процессов.
    - icon: shield
      title: Бескомпромиссная безопасность
      desc: Обеспечение высочайших стандартов безопасности посредством строгого тестирования и сертификации.
pillars:
  - title: Технологический прогресс
    desc: Создание новых материалов, конструкций и производственных процессов для обеспечения высокой производительности продукта и долговечности.
    icon: tech
  - title: Передовые материалы
    desc: Исследование передовых ПВХ, Хипалон, композитов и устойчивых альтернатив для улучшения характеристик продукции.
    icon: materials
  - title: Устойчивость
    desc: 'Основное обязательство: Мы привержены охране окружающей среды через устойчивое производство и использование перерабатываемых материалов.'
    icon: sustainability
capabilities:
  tagline: Возможности
  title: Возможности НИОКР
  subtitle: Четыре ключевые дисциплины, которые дают нам полный контроль над разработкой продукта — от исследования сырья до окончательной сертификации.
  groups:
    - title: Наука о материалах и технология тканей
      items:
        - Анализ и оптимизация состава ПВХ и Hypalon
        - Разработка добавок для УФ-стабилизации, огнестойкости и антимикробной защиты
        - Инженерия ламинирования и склеивания многоуровневых тканей
        - Испытания на ускоренное старение (УФ, тепло, влажность, сольной туман)
    - title: Инженерия корпуса и гидродинамика
      items:
        - Параметрическое 3D проектирование корпуса и оптимизация с помощью CFD
        - Анализ методом конечных элементов для конструкционных и ударных нагрузок
        - Испытания в опытовом гидродинамическом бассейне моделей и подтверждение характеристик
        - Разработка индивидуального корпуса для специальных профилей миссий
    - title: Технология сварки и соединения
      items:
        - Разработка и оптимизация процесса диэлектрической сварки с использованием ВЧ
        - Методы сварки горячим воздухом, горячим клином и ультразвуком
        - Квалификация клеевого соединения и шовной ленты
        - Моделирование прочности сварного шва и прогнозирование срока службы
    - title: Тестирование, сертификация и соответствие
      items:
        - Управление качеством и тестирование на соответствие требованиям CE
        - Поддержка независимого тестирования и сертификации третьими сторонами
        - Разработка индивидуального протокола тестирования для квалификации закупок
        - Анализ отказов в эксплуатации и расследование основных причин

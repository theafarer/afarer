meta:
  title: Центр НИОКР | {SITE}
  description: Научно-исследовательская и опытно-конструкторская работа — испытания ПВХ тканей, проектирование корпуса, радиочастотная сварка, гидродинамические испытания и контроль качества. Доступны индивидуальные НИОКР услуги.
hero:
  tagline: Центр научно-исследовательских и опытно-конструкторских работ
  title: Центр НИОКР
  subtitle: Сосредоточены на прогрессе
intro:
  - >-
    Центр научных исследований и разработок (R&D) Afarer's является движущей силой нашей миссии по революции в области водного спортивного оборудования. Мы обеспечиваем любителей водных видов спорта по всему миру более безопасными, комфортными и приятными в использовании продуктами благодаря
    постоянным инновациям в надувных паддлбордах (SUP) и лодках. Наша преданная команда инженеров, дизайнеров и увлеченных экспертов водных видов спорта формирует будущее отрасли, постоянно повышая стандарты качества, производительности и устойчивости.
  - >-
    Наш научно-исследовательский центр объединяет специалистов по материалам, судостроителей и инженеров-производственников под одной крышей. От разработки состава материалов и моделирования корпуса до разработки сварочного процесса и полномасштабных морских испытаний, каждый этап разработки
    продукта управляется данными и подтверждается тестированием.
mission:
  tagline: Наша миссия
  title: Инновации в будущем водных видов спорта
  pillars:

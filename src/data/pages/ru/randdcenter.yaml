rd_services:
  tagline: Кастомные исследования и разработки
  title: Научно-исследовательские и опытно-конструкторские услуги для партнеров
  services:
    - title: Разработка индивидуальных материалов
      desc: Мы разрабатываем индивидуальные составы тканей, слоистые пленочные структуры и клеевые системы, адаптированные к вашей рабочей среде и целевым показателям производительности.
    - title: Инжиниринг продукции OEM / ODM
      desc: Мы разрабатываем индивидуальные составы тканей, слоистые пленочные структуры и клеевые системы, адаптированные к вашей рабочей среде и целевым показателям производительности.
    - title: Тестирование и сертификация сторонними организациями
      desc: Используйте наши испытательные лаборатории, соответствующие стандарту ISO, для независимого тестирования материалов, проверки продукции и поддержки сертификации.
  cta: Обсудите ваши требования к НИОКР →
  cta_link: /contact
vision:
  tagline: Наша Визия
  title: Формируя будущее водных видов спорта
  body: >-
    Компания afarer стремится лидировать в индустрии надувных лодок и SUP через постоянные инновации, неизменное качество и твёрдую приверженность безопасности и устойчивому развитию — в конечном итоге обогащая опыт любителей водных видов спорта по всему миру. Исследовательский и
    опытно-конструкторский центр afarer — это место, где страсть встречается с инновациями, устанавливая новые стандарты для индустрии водных видов спорта.
labs_section:
  tagline: Лаборатории
  title: Наши лаборатории
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: Лаборатория ПВХ тканей
      description: Непрерывные исследования и испытания тканей труб из ПВХ и Hypalon на прочность на разрыв, устойчивость к УФ-излучению, истиранию и гибкость при низких температурах для обеспечения долгосрочной надежности в морских условиях.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Инженерная студия Hull
      description: Проектирование с использованием САПР и конечно-элементный анализ корпусов из ПНД, алюминия и стеклопластика. Каждый корпус цифрово моделируется для распределения напряжений и устойчивости к ударам до того, как будет построен первый прототип.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: Центр сварки РФ
      description: Специализированное предприятие по радиочастотной сварке с точным контролем температуры и давления, производящее высокопрочные, герметичные швы, соответствующие стандартам морской промышленности для надувных судов.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Гидродинамическая испытательная камера
      description: Испытания масштабной модели в нашем внутреннем испытательном бассейне для оптимизации формы корпуса, планирующих характеристик, устойчивости и топливной эффективности при различных нагрузках и условиях моря.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: Мастерская прототипов
      description: Полноценное подразделение по прототипированию и оснащению, где создаются новые модели, их устанавливают и проводят морские испытания. Каждый прототип проходит минимум 20 часов испытаний на воде перед утверждением к производству.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Лаборатория качества и инспекции
      description: Специализированная лаборатория контроля качества, выполняющая испытания на растяжение, циклы удержания воздуха, испытания на разрыв швов и сертификацию материалов, чтобы каждая лодка, покидающая мастерскую, соответствовала нашим опубликованным спецификациям.
      href: /randdcenter/quality-inspection-lab

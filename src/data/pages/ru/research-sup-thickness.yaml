meta:
  title: Как выбрать толщину SUP — инженерный анализ | {SITE}
  description: 'Техническое руководство по толщине надувных SUP-досок: чем отличаются доски толщиной 4, 5 и 6 дюймов по жесткости, весу, стабильности, курсовой устойчивости и характеристикам. Рекомендации по толщине для туринга, йоги, серфинга, гонок и универсального гребного использования.'
back_text: Назад к исследованиям
hero:
  tagline: Инженерное дело
  title: Как выбрать толщину SUP — инженерный анализ
  subtitle: Чтение займёт 6 минут
content_html: |-
  <h2>Три стандартные толщины</h2>

  <h3>4" (10 cm) – Турпоходы &amp; производительность</h3>
  <ul>
    <li>Максимальная жёсткость – меньше прогиба под нагрузкой</li>
    <li>Самая лёгкая – меньше материала, меньше объёма воздуха</li>
    <li>Отличная курсовая устойчивость – меньше раскачивания из стороны в сторону</li>
    <li>Самая быстрая – меньше сопротивление, легче глиссирование</li>
    <li>Лучше всего подходит для: турпоходов, гонок, фитнес-гребли, опытных райдеров</li>
  </ul>

  <h3>5" (12.7 cm) – Универсальная</h3>
  <ul>
    <li>Хорошая жёсткость – сбалансированное соотношение гибкости и жёсткости</li>
    <li>Умеренный вес – стандартный расход материала</li>
    <li>Хорошая первичная + вторичная остойчивость</li>
    <li>Лучше всего подходит для: любительской гребли, новичков, нерегулярного использования на озёрах и реках</li>
  </ul>

  <h3>6" (15.2 cm) – Устойчивость &amp; йога</h3>
  <ul>
    <li>Максимальная первичная остойчивость – огромная плавучесть</li>
    <li>Самая тяжёлая – больше материала PVC, больше объём воздуха</li>
    <li>Самая медленная – больше сопротивление, труднее поддерживать глиссирование</li>
    <li>Лучше всего подходит для: йоги/фитнеса, тяжёлых райдеров (100+ kg), очень неспокойной воды</li>
  </ul>

  <h2>Инженерный анализ</h2>
  <p>Жёсткость надувной SUP-доски определяется внутренним давлением воздуха и моментом инерции поперечного сечения доски. При 20 PSI доска толщиной 4" под нагрузкой прогибается примерно на 30% меньше, чем доска 6" той же ширины и длины. Первичная остойчивость обеспечивается шириной ватерлинии и плавучестью; на вторичную остойчивость влияют форма борта и ширина доски.</p>

  <h2>Толщина в зависимости от веса райдера</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Вес райдера</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Рекомендуемая толщина</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">До 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" или 6"</td></tr>
      <tr><td class="p-3 border">Более 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Компромисс между толщиной и PSI</h2>
  <p>Распространённое заблуждение состоит в том, что более высокое PSI может компенсировать чрезмерную толщину. При 25 PSI доска 6" прогибается больше, чем доска 4" при 15 PSI, потому что геометрический момент инерции доминирует в уравнении жёсткости. Для райдеров, ориентированных на производительность, более тонкая доска при более низком давлении превосходит более толстую доску при более высоком давлении.</p>

  <h2>Линейка Afarer</h2>
  <ul>
    <li><strong>Доски 4":</strong> серия Cheetah Touring – турпоходные SUP-доски 12' x 30" x 4" для фитнеса и гребли на дальние дистанции</li>
    <li><strong>Доски 5":</strong> серия Cheetah All-Round – 10'6" x 32" x 5" для любительского использования</li>
    <li><strong>Доски 6":</strong> серия Cheetah Ultra-Stable – 10' x 34" x 6" для йоги, крупных райдеров и фотоплатформ</li>
  </ul>
  <p>Все доски используют сердечники drop-stitch плотностью 1,680 DTEX с номинальным давлением 20 PSI и ламинатом из PVC толщиной 1.2 mm.</p>

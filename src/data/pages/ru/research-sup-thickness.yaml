hero:
  tagline: Инженерное дело
  title: Как выбрать толщину SUP — инженерный анализ
  subtitle: Чтение займёт 6 минут
content_html: >
  <h2>Три стандартных толщины</h2>


  <h3>4" (10 см) – Гастроли и выступления</h3>

  <ul>
    <li>Максимальная жёсткость — меньше гибкости под нагрузкой</li>
    <li>Самый лёгкий — меньше материала, меньше объёма воздуха</li>
    <li>Отличное сопровождение — уменьшение раскачиваний из стороны в</li> сторону
    <li>Самый быстрый — снижение сопротивления, более лёгкое планирование</li>
    <li>Лучшие для: туринга, гонок, фитнес-гребли, опытных гребцов</li>
  </ul>


  <h3>5" (12,7 см) – Многоборье</h3>

  <ul>
    <li>Хорошая жёсткость — сбалансированное отношение гибкости к жесткости</li>
    <li>Умеренный вес — стандартное использование материалов</li>
    <li>Хорошая первичная вторичная стабильность</li>
    Лучшие для: рекреационной <li>гребли, начинающих, непринуждённого использования озера и реки</li>
  </ul>


  <h3>6" (15,2 см) – Стабильность и йога</h3>

  <ul>
    <li>Самая высокая первичная устойчивость — мощная плавучесть</li>
    <li>Самое тяжёлое — больше ПВХ-материала, больший объём воздуха</li>
    <li>Самый медленный — больше сопротивления, сложнее поддерживать планирование</li>
    <li>Лучшие для: йоги/фитнеса, тяжелых гребцов (100 кг), очень бурных условий</li>
  </ul>


  <h2>Инженерный анализ</h2>

  <p>Жёсткость надувного SUP определяется внутренним давлением воздуха и моментом инерции поперечного сечения доски. При давлении 20 PSI 4" плата показывает примерно на 30% меньшее прогиба под нагрузкой, чем плата 6" такой же ширины и длины. Основная устойчивость обеспечивается шириной ватерлинии и
  плавучостью; Вторичная устойчивость зависит от формы рельса и ширины доски.</p>


  <h2>Толщина по весу гребца</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <TR класс="BG-Gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">вес веса</th> веса
        <th class="p-3 text-left-font-semibold text-gray-border">рекомендуемая толщина</th>
      </tr>
    </thead>
    <tbody>
      <tr><TD класс="P-3 граница">Менее 65 кг (143 фунта)</td><TD класс="P-3 граница">4"</td></tr>
      <tr><TD класс="P-3 Border">65 – 90 кг (143 – 198 фунтов)</td><TD Class="P-3 Border">5"</td></tr>
      <tr><TD класс="P-3 Border">90 – 115 кг (198 – 253 фунта)</td><TD Class="P-3 Border">5" или 6"</td></tr>
      <tr><td class="P-3 граница">Свыше 115 кг (253 фунта)</td><td class="P-3 граница">6"</td></tr>
    </tbody>
  </table>


  <h2>Толщина против PSI — компромисс</h2>

  <p>Распространённое заблуждение состоит в том, что более высокий PSI может компенсировать чрезмерную толщину. При давлении 25 PSI плата диаметром 6" демонстрирует больше гибкости, чем плата 4" при 15 PSI, поскольку геометрический момент инерции доминирует в уравнении жесткости. Для гребцов,
  ориентированных на производительность, более тонкая доска при низком давлении превосходит более толстую доску при высоком давлении.</p>


  <h2>Состав Afarer</h2>

  <ul>
    <li><strong>Доски 4":</strong> серия Cheetah Touring – туринговые SUP размером 12' x 30" x 4" для фитнеса и гребли на дистанции</li>
    <li><strong>Доски 5":</strong> серия Cheetah All-Round – 10'6" x 32" x 5" для рекреационного использования</li>
    <li><strong>Доски диаметром 6":</strong> серия Cheetah Ultra-Stable — 10' x 34" x 6" для йоги, больших гребцов и фотоплатформ</li>
  </ul>

  <p>Все платы оснащены 1 680 дроп-стечками DTEX с давлением 20 PSI и ламинированными ПВХ толщиной 1,2 мм.</p>

hero:
  tagline: Лаборатория контроля качества
  title: Испытательная лаборатория и контроль качества
  subtitle: Независимая лаборатория качества с процессами ISO 9001 — каждая единица тестируется перед отправкой
intro: >-
  Компания Afarer управляет специализированной лабораторией контроля качества, которая работает независимо от производства. Каждая партия сырья и каждое готовое судно проходят через документированные протоколы инспекции перед выпуском. Наша команда контроля качества напрямую подчиняется руководству,
  обеспечивая беспристрастные решения по качеству.
highlights:
  - value: 100%
    label: Блоки проверены на давление
    detail: Каждая камера, каждая лодка
  - value: 48 ч
    label: Продолжительность испытания на удержание воздуха
    detail: При 1,25-кратном номинальном давлении
  - value: <5%
    label: Максимально допустимое падение давления
    detail: Срок удержания более 24 часов
  - value: AQL 2.5
    label: Порог крупного дефекта
    detail: По выборке ISO 2859
test_procedures:
  - title: Инспекция сырья
    description: Каждая поступающая партия ПВХ, Hypalon, ткани с капельным швом и фурнитуры проверяется перед принятием. Испытываются прочность на разрыв (ASTM D751), стойкость к разрыву (ISO 4674) и устойчивость к ультрафиолету. Несоответствующие материалы помещаются на карантин и возвращаются.
    standards:
      - ASTM D751 (на разрыв)
      - ISO 4674 (разрыв)
      - ISO 4892 (УФ)
  - title: Контрольные точки качества в процессе
    description: Операторы производства проводят самоинспекцию на каждом этапе. Аудиторы ОТК осуществляют случайную выборку на протяжении всей смены. Испытания на отслоение сварного шва проводятся каждые 50 единиц. Проверка размеров проводится каждая 20-я панель.
    standards:
      - ASTM D751 (отрыв)
      - Внутренний контрольный список на 100 пунктов
      - Выборка ISO 2859
  - title: 48-часовой тест на удержание воздуха
    description: Каждая трубчатая камера надувается до 125% номинального давления и удерживается в течение 48 часов. Датчики давления ведут непрерывный учет с компенсацией температуры. Любая камера, у которой давление падает более чем на 5%, вызывает автоматическую повторную проверку партии.
    standards:
      - ISO 6185
      - CE 2013/53/ЕС
  - title: Тестирование нагрузки и баланса
    description: Готовые лодки тестируются на максимальную расчетную нагрузку на устойчивость, надводный борт и управляемость. Каждое судно проходит водные испытания перед окончательным одобрением проверки.
    standards:
      - ISO 12217
      - CE 2013/53/ЕС
equipment:
  - name: Universal Testing Machine (tensile)
    spec: 5 кН, соответствует стандарту ASTM D751
  - name: Pressure Decay Tester
    spec: Многоканальный, 0—0 фунтов на квадратный дюйм, регистрация данных
  - name: UV Weathering Chamber
    spec: ISO 4892, 1 000 часовых циклов
  - name: Thickness Gauge (digital)
    spec: разрешение 0,01 мм
  - name: Peel Tester (weld)
    spec: Моторизованный, грузоподъемность 50 Н
  - name: Temperature Chamber
    spec: '-40 °C до 100 °C'
  - name: Leak Detection Tank
    spec: 6 м × 2 м, освещённый

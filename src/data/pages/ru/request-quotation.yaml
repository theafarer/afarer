meta:
  title: 'Запросить предложение — производство SUP OEM | {SITE}'
  description: 'Запросите детальное предложение для вашего проекта надувного SUP или лодки. Производство OEM/ODM, собственная марка или флоты на заказ — отвечаем в течение 2 рабочих дней.'
  keywords:
    - 'запрос предложения SUP'
    - 'предложение OEM paddle board'
    - 'предложение фабрики SUP'
    - 'цена надувного SUP'
hero_text:
  tagline: Получить предложение
  title: Запросить предложение<br />для вашего проекта
  subtitle: Расскажите нам о ваших требованиях, и наша команда ответит с подробным предложением в течение 2 рабочих дней.
steps2_process:
  title: Как это работает
  subtitle: Четыре простых шага от запроса до предложения.
  items:
    - title: 'Шаг 1: Отправьте ваши требования'
      description: Заполните форму ниже с указанием типа продукта, количества и спецификаций. Чем больше деталей вы предоставите, тем точнее будет ваше предложение.
      icon: tabler:file-text
    - title: 'Шаг 2: Мы рассматриваем и даем рекомендации'
      description: Наша инженерная команда рассматривает ваши требования и может связаться с вами для уточнения. Мы предоставляем рекомендации по конфигурации и опциям продукта.
      icon: tabler:users
    - title: 'Шаг 3: Получите вашу смету'
      description: Вы получаете подробное предложение, включающее цены за единицу, MOQ, сроки поставки, условия оплаты и варианты доставки. Обычно в течение 48 часов.
      icon: tabler:currency-dollar
    - title: 'Шаг 4: Образец и производство'
      description: После принятия предложения мы переходим к производству образцов (если применимо) или сразу к массовому производству. Регулярные обновления на протяжении всего процесса.
      icon: tabler:building-factory
content_form:
  tagline: Форма запроса цены
  title: Расскажите нам о вашем проекте
  subtitle: Все поля с * обязательны для заполнения.
  contact_fields:
    firstName: Имя
    lastName: Фамилия
    companyName: Компания
    email: Email
  fields:
    - name: Категория товара
      type: select
      options:
        - SUP-доска
        - Надувной SUP
        - Надувная SUP-доска
        - Спасательный жилет
        - Морской аксессуар
        - OEM/ODM на заказ
    - name: Применение
      type: select
      options:
        - Дайвинг-центр
        - Рыбалка
        - Морской туризм / Курорт
        - Поиск и спасение
        - Яхтенный тендер
        - Коммерческое рабочее судно
        - Правительство / Военные
        - ОЕМ / Частная марка
        - Личное / Развлекательное
        - Другое
    - name: Количество
      type: text
      placeholder: напр. 50 шт.
    - name: Целевой рынок
      type: text
      placeholder: напр. Европа, Северная Америка, Ближний Восток
    - name: Страна доставки
      type: text
      placeholder: напр. Италия, ОАЭ, США, Австралия
    - name: Предпочтительный материал
      type: select
      options:
        - Без предпочтений
        - Морской ПВХ (1100 дтекс)
        - Премиум Гипалон / CSM
        - Стеклопластиковый корпус
        - Алюминиевый корпус
    - name: Требования к двигателю
      type: text
      placeholder: например, 60 л.с. подвесной, без двигателя, двойной 115 л.с.
    - name: Необходимая кастомизация
      type: text
      placeholder: например, индивидуальные цвета, брендинг/логотип, упаковка, специальные элементы
    - name: Сроки
      type: text
      placeholder: например, доставка в течение 90 дней
    - name: Дополнительные требования
      type: textarea
      placeholder: Опишите ваше приложение, технические характеристики или любые специальные требования — включите прилагаемые чертежи, спецификации или ссылки, если они доступны
    - name: Загрузить спецификацию
      type: file
      placeholder: Загрузите ваш технический паспорт, чертеж или справочный документ (PDF, DWG, DXF)
    - name: Загрузить логотип / иллюстрацию
      type: file
      placeholder: Загрузите ваш логотип или произведение искусства для индивидуального брендинга (AI, EPS, PNG)
cta:
  title: Предпочитаете обсудить по электронной почте?
  subtitle: Отправьте ваш запрос напрямую нашей команде продаж, и мы ответим в течение 24 часов.
  actions:
    - variant: primary
      text: Напишите нам напрямую
      href: /contact

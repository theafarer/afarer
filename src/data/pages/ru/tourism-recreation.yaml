faqs:
  - question: Какие типы надувных SUP для туризма и отдыха производит afarer?
    answer: afarer производит туристические SUP (touring), универсальные SUP (all-around), йога-SUP, рыболовные SUP и общие рекреационные надувные SUP. Все модели доступны для производства OEM/ODM с индивидуальным брендированием.
  - question: Какие материалы afarer использует для надувных SUP туристического класса?
    answer: >-
      Мы используем морской ПВХ высокой прочности на растяжение с многослойными покрытиями для превосходной устойчивости к УФ-излучению, истиранию и долгого срока службы. Все ткани закупаются у авторитетных мировых поставщиков и проходят строгий входной
      контроль.
  - question: Предоставляет ли afarer сертификацию CE для рекреационных SUP?
    answer: Да. Все стандартные модели имеют сертификацию CE для доступа на рынок ЕС. Наша фабрика сертифицирована по ISO 9001. UKCA, FCC и другие сертификаты доступны по запросу для партнёров OEM/ODM.
  - question: Может ли afarer настроить графику и брендинг для туроператоров?
    answer: Да — полный комплекс услуг OEM/ODM, включая печать индивидуальных логотипов на бордах, фирменную упаковку, графику для флота и решения private label. Мы предлагаем цифровую печать для полноцветной графики и шелкографию для долговечных логотипов.
  - question: Какая гарантия на туристические и рекреационные SUP afarer?
    answer: Надувные SUP afarer поставляются с 3-летней ограниченной гарантией производителя, покрывающей дефекты продукции и изготовления. Расширенные варианты гарантии доступны для операторов коммерческих флотов.
body: >
  <h2>Стандарт afarer — Приверженность безупречному морскому мастерству</h2>

  <p>В обширном и динамичном мире морского отдыха надувной SUP является воплощением универсальности, удобства и доступности. От спокойных рыболовных походов на тихих озёрах до неспешных прибрежных прогулок — надувные SUP служат множеству целей.</p>

  <p>Однако не все надувные SUP одинаковы. Истинная ценность надувного SUP определяется не только назначением, но и целостностью конструкции, качеством материалов и точностью проектирования. afarer зарекомендовала себя как премиальный разработчик и
  производитель, создающая надувные SUP, спроектированные для совершенства в каждом сегменте туризма и отдыха.</p>


  <h2>Наука о материалах: Основа долговечности</h2>

  <p>Выбор материалов — важнейший фактор, определяющий долговечность и производительность надувного SUP. afarer вкладывает значительные ресурсы в поиск, испытания и закупку лучших тканей и компонентов, доступных в мире.</p>

  <ul>
    <li><strong>Отборное сырьё:</strong> Морской ПВХ высокой прочности на растяжение с многослойными покрытиями, выбранный для повышенной прочности, УФ-стойкости и устойчивости к истиранию.</li>
    <li><strong>Конструкция Drop-Stitch:</strong> Тысячи внутренних полиэстровых нитей соединяют верхний и нижний слои, создавая жёсткую структуру при 12-15 PSI.</li>
    <li><strong>Термосварные швы:</strong> Наши ПВХ-конструкции используют исключительно термосварные швы (RF-сварка), обеспечивающие прочные, герметичные соединения, превышающие требования ISO.</li>
    <li><strong>Расширенная УФ-защита:</strong> ПВХ-ткани с гарантированной УФ-защитой для SUP, часто подвергаемых интенсивному солнечному излучению.</li>
  </ul>


  <h2>Философия проектирования: Точная инженерия для каждого сегмента</h2>

  <p>Наша команда проектировщиков состоит из опытных дизайнеров бордов и специалистов по надувным технологиям, которые используют передовое ПО CAD и реальные испытания для создания бордов с высокой гидродинамической эффективностью, исключительной стабильностью и прочностью.</p>


  <h3>Рыболовные SUP</h3>

  <p>Разработаны для устойчивости и бесшумности. Рыболовные конфигурации включают крепления для удилищ, точки крепления снаряжения и тихие, стабильные платформы, сводящие к минимуму беспокойство рыбы.</p>


  <h3>Йога- и фитнес-SUP</h3>

  <p>Широкие, стабильные платформы с дека-покрытием во всю длину для йоги на воде, фитнеса и групповых растяжек. Конструкция drop-stitch сохраняет платформу абсолютно жёсткой под ногами.</p>


  <h3>Универсальные и туристические SUP</h3>

  <p>Высокоплотная конструкция drop-stitch с ПВХ военного класса, рассчитанная на 18 PSI для исключительной жёсткости. Полные комплекты аксессуаров включают насос, рюкзак, leash, ремкомплект и весло.</p>


  <h2>Производственное совершенство: Точность на каждом этапе</h2>

  <p>afarer привлекает высококвалифицированных техников, мастеров своего дела. Наше производство оснащено передовым оборудованием, включая автоматические режущие станки с ЧПУ, RF-диэлектрические сварочные машины, термовоздушные сварочные аппараты и цифровые принтеры. Каждый SUP следует
  документированным процедурам с прослеживаемостью.</p>

  <p>Наша многоуровневая система контроля качества включает строгие проверки на каждом этапе производства, завершающиеся всесторонними испытаниями каждого готового борда перед отгрузкой. Приверженность качеству заложена с самого начала, а не просто проверяется в конце.</p>


  <h2>Контроль качества и испытания</h2>

  <ul>
    <li><strong>100% тест на удержание воздуха:</strong> Каждая камера испытывается давлением сверх рабочих пределов для проверки герметичности.</li>
    <li><strong>Проверка швов на отслаивание:</strong> Прочность сварных и клеевых соединений проверяется физическими испытаниями на отслаивание.</li>
    <li><strong>Валидация УФ-стойкости:</strong> Материалы подвергаются симулированному солнечному излучению для оценки стойкости к деградации.</li>
    <li><strong>Испытания на истирание:</strong> Образцы материалов испытываются на абразивных поверхностях для оценки износостойкости.</li>
    <li><strong>Полная проверка систем:</strong> Каждый борд проходит финальную проверку перед одобрением к отгрузке.</li>
  </ul>


  <h2>Почему выбирают afarer для вашего туристического и рекреационного флота</h2>

  <p>С нашей сертифицированной ISO и CE фабрикой площадью 12 000 м² в Циндао, Китай, afarer предлагает туроператорам, прокатным флотам и рекреационным брендам надёжного производственного партнёра. Наши услуги OEM/ODM включают индивидуальное брендирование, private label, упаковку и
  логистическую поддержку. Стандартный минимальный заказ от 50 единиц со сроками выполнения 30–45 дней.</p>

  <p>Каждый SUP afarer — это вложение в непревзойдённое качество, долговечность и производительность — гарантирующее вашим гостям безопасные и незабываемые впечатления на воде.</p>

faqs:
  title: 'Ко-Бренд — Частые Вопросы'
  subtitle: 'Как работает ко-брендинг Afarer и чем он отличается от OEM и private label.'
  items:
    - title: 'Ко-брендинг — это то же самое, что OEM или private label?'
      description: 'Нет. Afarer больше не ведёт открытую программу OEM/private label. Продукты ко-бренда остаются продуктами Afarer — спроектированными, разработанными, проверенными и поддержанными брендом Afarer. Ваша идентичность появляется как ко-бренд, а не как сторонний продукт без марки.'
    - title: 'Кто может начать ко-бренд проект?'
      description: 'Квалифицированные компании водного спорта: действующие страновые партнёры, паддл-клубы, курорты и отели, организаторы мероприятий и сообщества. Отправьте нам бриф проекта, и мы подтвердим соответствие до начала дизайн-работ.'
    - title: 'Не будет ли ко-брендинг конфликтовать с моим страновым дистрибьютором?'
      description: 'Нет. Модель «одна страна — один дистрибьютор» имеет приоритет. Ко-брендовые коллекции координируются с местным страновым партнёром, если он есть, поэтому параллельный или конкурирующий бренд не появится на защищённой территории.'
    - title: 'Каков минимальный заказ ко-брендовой коллекции?'
      description: 'Пилотные коллекции начинаются с 30–50 штук. Стандартные коллекции — 50–100 штук; большие или мультирегиональные версии — 100+ штук. Сроки индивидуальной разработки согласовываются по проекту.'
    - title: 'Что относится к качеству Afarer, а что — к вкладу партнёра?'
      description: 'Afarer владеет дизайном продукта, инжинирингом, материалами, конструкцией, QC и гарантией. Партнёры вносят концепцию коллекции, нейминг, цвета, графические идеи и выход на рынок. Так на воде сохраняется единый стандарт качества.'
    - title: 'Как подать заявку?'
      description: 'Заполните форму запроса ко-бренда с информацией о вашем бизнесе, рынке и идее коллекции. Мы оценим соответствие и ответим в течение 3 рабочих дней с предложением и Co-Brand Project Agreement.'

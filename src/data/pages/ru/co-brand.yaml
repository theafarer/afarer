features:
  title: 'Что Значит Ко-Брендинг в Afarer'
  subtitle: 'Ко-брендинг — наша программа дизайн-партнёрства, построенная вокруг бренда Afarer, защиты территории и лимитированных коллекций, а не производства без бренда.'
  columns: 3
  items:
    - title: 'Продукты Afarer Остаются Продуктами Afarer'
      description: 'Ко-брендовая коллекция — это лимитированная серия досок Afarer с вплетённой в неё вашей идентичностью. Никогда без бренда, никогда сторонний бренд и никогда открытая программа private label.'
      icon: 'tabler:trademark'
    - title: 'Спроектировано С Вами'
      description: 'Ваши цвета, нейминг и история формируют коллекцию. Наша команда дизайнеров и инженеров занимается деками, графикой, упаковкой и документацией от брифа до поставки.'
      icon: 'tabler:pencil'
    - title: 'Для Клубов, Курортов, Мероприятий и Сообществ'
      description: 'Флотские коллекции для паддл-клубов и курортов, событийные версии для гонок и общественных серий — всё с качеством и гарантией Afarer.'
      icon: 'tabler:users'
    - title: 'Защищает Страновых Партнёров'
      description: 'Ко-брендинг идёт рядом с нашей моделью «одна страна — один дистрибьютор». Национальные партнёры сохраняют свою территорию; ко-брендовые коллекции не открывают дверь параллельным брендам на их рынке.'
      icon: 'tabler:shield-check'
    - title: 'Инжиниринг и Стандарты Качества'
      description: 'Каждая коллекция отгружается с нашей сертифицированной цепочки поставок с документацией CE и ISO 9001, испытаниями давлением и теми же точками контроля качества, что и наша основная линейка.'
      icon: 'tabler:certificate'
    - title: 'Становится Активом Бренда'
      description: 'Лимитированная ко-брендовая коллекция строит вашу собственную историю на воде — маржа продаж, контент для медиа и причина возвращаться паддлерам сезон за сезоном.'
      icon: 'tabler:star'

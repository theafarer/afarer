tests:
  - title: Test de Pression
    description: Les chambres gonflables sont soumises à des pressions dépassant leurs limites de fonctionnement recommandées pendant des périodes prolongées. Cela vérifie l’étanchéité et l’intégrité structurelle du matériau et des joints, garantissant que le produit peut résister à l’utilisation prévue et à une éventuelle surpression sans défaillance ni fuite.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: Test d'Impact
    description: Les produits sont soumis à des impacts contrôlés de différents poids et angles. Cela évalue la résistance du matériau aux forces d'impact et identifie les points de défaillance potentiels.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: Tests de Résistance UV
    description: Les chambres gonflables sont soumises à des pressions dépassant leurs limites de fonctionnement recommandées pendant des périodes prolongées. Cela vérifie l’étanchéité et l’intégrité structurelle du matériau et des joints, garantissant que le produit peut résister à l’utilisation prévue et à une éventuelle surpression sans défaillance ni fuite.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: Test de Résistance à l'Abrasion
    description: Des échantillons de matériau sont frottés contre des surfaces abrasives pendant un nombre de cycles spécifié sous pression contrôlée. Cela mesure la résistance du tissu à l'usure due au sable, au béton et aux surfaces rugueuses.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: Tests de Performance à Basse Température
    description: Les produits sont testés dans des environnements froids pour évaluer la fonctionnalité et la durabilité dans diverses conditions de température, prévenant la rigidité ou la fissuration dans les eaux plus froides. Essentiel pour les bateaux destinés à un usage hivernal ou en haute latitude.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: Test de Flottabilité et Capacité de Charge
    description: Les produits sont testés avec différents poids pour déterminer leur capacité de charge maximale et garantir qu'ils supportent la charge utile prévue sans défaillance structurelle.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: Tests de Maniabilité
    description: Les produits sont testés pour leur réactivité aux commandes de pagaie ou de moteur, évaluant le rayon de braquage et la facilité de maniement. Les essais sur l’eau valident que le comportement réel correspond aux spécifications de conception.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: Tests d'Étanchéité
    description: Les produits entièrement assemblés sont immergés ou soumis à un pulvérisation d’eau pour vérifier les fuites à travers les joints, les valves ou les matériaux. Chaque bateau passe un contrôle d’étanchéité obligatoire avant expédition.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp

hero:
  tagline: Partners & Distribution
  title: 'Devenez Partenaire afarer<br />—Réseau Mondial'
  subtitle: 'Rejoignez le réseau mondial afarer. Nous travaillons avec des distributeurs dans 50+ pays.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: Partner Programs
  title: 'Programmes Partenaires<br />Conçus pour la Croissance'
  subtitle: 'Distributeur, revendeur ou partenaire de marque – nous avons des programmes pour vous.'
  columns: 3
  items:
    - title: 'Programme Distributeur'
      description: 'Distribution exclusive avec tarifs volume, support marketing et accès usine.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Tarifs revendeur, formation, matériel marketing et support garantie.'
      icon: tabler:building-store
    - title: 'Partenariat OEM/ODM'
      description: 'Fabrication OEM/ODM complète avec branding, emballage et spécifications personnalisés.'
      icon: tabler:certificate
    - title: 'Partenariat de Marque'
      description: 'Co-branding, marque blanche et programmes exclusifs pour marques établies.'
      icon: tabler:stars
    - title: 'Gouvernement & Institutionnel'
      description: 'Programmes fournisseur préférentiel pour agences, garde-côtes, armée et humanitaire.'
      icon: tabler:building-community
    - title: 'Partenaire Resort & Location'
      description: 'Tarifs flotte, qualité constante et branding pour resorts, centres de plongée et locations.'
      icon: tabler:sun
content_benefits:
  tagline: Why Partner With Us
  title: 'Pourquoi les Partenaires Choisissent afarer'
  subtitle: 'Nos partenaires bénéficient de capacité de fabrication réelle, qualité constante et support réactif.'
  list:
    - 'Accès direct à l’usine : travaillez directement avec notre équipe de fabrication'
    - 'Personnalisation prête : marquez vos produits avec des couleurs, logos et emballages personnalisés'
    - 'Qualité garantie : production certifiée ISO 9001 avec conformité CE, UKCA et BSCI'
    - 'Logistique mondiale : expédition depuis Qingdao, Chine avec options FOB, CIF et DDP'
    - 'Support marketing : catalogues produits, photographie, documentation technique et ressources numériques'
    - 'Formation et support : formation produit pour votre équipe commerciale, support technique pour vos clients'
content_process:
  tagline: How to Become a Partner
  title: 'Processus de Partenariat Simple'
  subtitle: 'Notre processus est simple – conçu pour vous faire vendre rapidement.'
  items:
    - title: 'Étape 1 : Soumettre la Candidature'
      description: 'Formulaire de candidature avec profil, marché cible et intérêts produits.'
    - title: 'Étape 2 : Examen de Qualification'
      description: 'Notre équipe examine votre candidature et vous contacte sous 3 jours ouvrés.'
    - title: 'Étape 3 : Accord & Configuration'
      description: "Signez l'accord, créez votre compte, recevez tarifs et échantillons."
    - title: 'Étape 4 : Formation & Lancement'
      description: 'Formation produit, support commercial et documentation fournis. Vous êtes prêt à vendre.'
cta:
  title: 'Prêt à devenir partenaire afarer ?'
  subtitle: 'Postulez pour un partenariat. Réponse sous 3 jours ouvrés.'
  actions:
    - variant: primary
      text: Apply for partnership
      href: /contact
    - text: View our products

clusters:
  tagline: Knowledge Clusters
  title: Explorer par sujet
  subtitle: Plongées dans la technologie, la sécurité et le savoir-faire derrière chaque produit afarer.
  items:
    - title: Guides d'Achat SUP
      description: Du choix de votre première planche aux techniques de randonnée avancées — tout sur le stand-up paddle.
      icon: tabler:lifebuoy
      topics:
        - Comment choisir votre premier SUP gonflable

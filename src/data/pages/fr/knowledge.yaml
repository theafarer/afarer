        - Comparaison gonflable vs planche rigide
    - title: Ingénierie et technologie SUP
      description: Guides techniques sur les planches SUP gonflables — matériaux, méthodes de construction et procédés de fabrication.
      icon: tabler:microscope
      topics:
        - Plongée dans la technologie drop-stitch
        - Spécifications PVC qualité militaire
        - Laminage par fusion vs collage adhésif
        - Technologie de mousse EVA et méthodes d'illustration
        - Types de valves SUP et systèmes d'ailerons
    - title: Sécurité et Entretien SUP
      description: Connaissances de sécurité essentielles pour chaque pagayeur — du choix du gilet de sauvetage à la lecture de la météo, en passant par l'entretien et la réparation de la planche.
      icon: tabler:shield
      topics:
        - Checklist sécurité SUP et exigences VFI
        - Sécurité multi-chambres pour eaux isolées
        - Guide PSI de gonflage SUP
        - Stockage de la planche et entretien hivernal
        - Techniques de réparation gonflable
    - title: Compétences et Techniques SUP
      description: Techniques de pagaie, compétences de randonnée et entraînement physique pour tous les niveaux.
      icon: tabler:sailboat
      topics:
        - Techniques de pagaie pour débutants
        - Maîtrise des coups de pagaie intermédiaires
        - Planification de randonnées et expéditions
        - Entraînement fitness et course SUP
        - Compétences en eaux vives et rivière
    - title: Style de vie SUP et usages spéciaux
      description: Activités SUP spécialisées — yoga, pêche, chiens, familles et conseils voyage.
      icon: tabler:heart
      topics:
        - Yoga SUP et méditation sur l'eau
        - Pêche depuis un SUP gonflable
        - Paddle avec chiens et enfants
        - Voyager avec votre SUP en avion et en voiture
        - Accessoires SUP et équipements essentiels
    - title: Comparaisons et références SUP
      description: Comparaisons côte à côte pour vous aider à prendre des décisions éclairées.
      icon: tabler:chart-bar
      topics:
        - SUP vs kayak — quel est le bon pour vous ?
        - Comparaison des matériaux PVC vs Hypalon
        - Sécurité chambre simple vs multi-chambres
        - Matériaux des planches SUP expliqués
        - Impression UV vs blocs EVA

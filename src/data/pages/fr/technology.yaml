meta:
  title: 'Technologie — Drop Stitch & PVC Marine | {SITE}'
  description: "Technologies afarer : drop stitch, PVC marine, construction double couche et haute pression. L'innovation d'un fabricant professionnel de SUP gonflables."
  keywords:
    - 'technologie SUP'

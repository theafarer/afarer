intro: Contrairement aux marques qui externalisent la production dans des usines tierces, afarer possède et opère toute sa chaîne de fabrication. Cette intégration verticale nous permet de maintenir un contrôle qualité strict à chaque étape, de répondre rapidement aux exigences personnalisées et de fournir une qualité produit constante lot après lot. Voici comment une planche est construite dans notre installation.

steps:
  - step: '01'
    title: Réception et Inspection des Matériaux
    description: Chaque lot entrant de tissu PVC, de mat de fibres de verre, de résine et de quincaillerie est inspecté par rapport à la spécification. Des échantillons de tissu sont testés pour la résistance à la traction, l'uniformité de l'épaisseur et la résistance aux UV avant leur libération en production. Les matériaux non conformes sont mis en quarantaine et retournés.
    duration: 1–2 jours
  - step: '02'
    title: Découpe Automatique du PVC
    description: Les tissus approuvés sont posés sur la machine de découpe automatique CNC et découpés avec une précision submillimétrique. Le placement optimisé par ordinateur organise les panneaux afin de minimiser les déchets — généralement moins de 5 %. Les panneaux découpés sont étiquetés par modèle de planche et par chambre, puis regroupés pour être transférés vers l'atelier de soudure.
    duration: 2–4 heures par kit de planche
  - step: '03'
    title: Thermosoudure et Soudure des Tubes
    description: Les panneaux sont pointés et assemblés à l'aide de machines de thermosoudure par soudage à air chaud à des températures contrôlées de 200–300 °C. Les coutures principales sont renforcées par soudure diélectrique RF pour des joints étanches à haute résistance. Les chambres terminées sont gonflées à 1.5× la pression de travail pour une validation de rétention d'air de 30 minutes.
    duration: 1–2 jours par planche
  - step: '04'
    title: Impression et Décoration SUP
    description: Les graphiques de pont des planches SUP sont appliqués par impression numérique pour des designs pleine couleur de qualité photo, et par sérigraphie pour des logos durables et des motifs répétés. Les impressions sont durcies et scellées pour résister aux UV et à l'abrasion.
    duration: 1–2 jours
  - step: '05'
    title: Assemblage Final et Gréement
    description: Les planches sont gréées sur la chaîne d'assemblage avec les ailerons, valves, ponts EVA et accessoires. Chaque unité suit une liste de contrôle d'assemblage de 100 points avec validation obligatoire à chaque étape.
    duration: 2–4 jours
  - step: '06'
    title: Contrôle Qualité et Inspection
    description: "Chaque planche terminée passe par un contrôle qualité obligatoire : test de rétention d'air des chambres, vérification du fonctionnement de la quincaillerie, contrôle du couple de serrage et inspection esthétique. Les constructions personnalisées et les prototypes font également l'objet d'essais en eau couvrant la stabilité et la maniabilité."
    duration: 1–2 jours
  - step: '07'
    title: Emballage et Expédition
    description: Les planches sont dégonflées, pliées selon la procédure, emballées dans des sacs tissés renforcés ou des caisses en contreplaqué, puis chargées pour expédition. Chaque colis est étiqueté avec le modèle, le numéro de série et la destination. Nous coordonnons avec des transitaires les expéditions FCL et LCL vers le monde entier.
    duration: 1 jour


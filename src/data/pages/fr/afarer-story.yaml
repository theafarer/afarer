      - Certifié CE — Tous les produits répondent aux normes européennes
      - ISO 9001:2015 — Système de management de la qualité certifié
      - Marquage UKCA — Conformité au marché britannique
      - Conforme FCC — Conformité des composants électroniques américains
  global:
    title: Présence mondiale
    body: afarer sert des clients sur plusieurs marchés mondiaux, soutenant les distributeurs, les marques de plein air et les utilisateurs marins professionnels dans plus de 50 pays à travers l'Europe, l'Asie-Pacifique, les Amériques, le Moyen-Orient et l'Afrique.

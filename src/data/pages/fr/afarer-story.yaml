hero:
  tagline: Our Story
  title: afarer — L'ingénierie de la liberté sur l'eau
  subtitle: D'un atelier côtier à un fabricant marin mondial — notre parcours est construit sur la conviction que les embarcations méritent une ingénierie rigoureuse.

timeline:
  - year: '2012'
    title: Fondation de Fabrication Marine
    body: afarer a commencé comme un atelier spécialisé d’embarcations à Qingdao, en Chine, engagé dans l’artisanat marin et la fabrication d’embarcations. L’accent initial était la construction de produits gonflables fiables grâce à une expérience pratique en ingénierie et à la discipline de fabrication.
  - year: '2015'
    title: Première Exportation et Certification CE
    body: Les premières commandes à l'export ont atteint le Japon et la Corée. La certification CE a été obtenue pour les gammes de produits principales, marquant l'entrée d'afarer sur le marché mondial des bateaux gonflables.
  - year: '2018'
    title: Extension de l'Usine
    body: Déménagement dans une installation de production de 12 000 m². Ajout de lignes de soudure RF et de capacité de production drop-stitch, permettant une fabrication à plus grande échelle et des systèmes de contrôle qualité améliorés.
  - year: '2020'
    title: Centre R&D Établi
    body: Ouverture d’un centre R&D dédié avec laboratoire de tissu PVC, bassin d’essais hydrodynamiques et studio de simulation CAO/FEA. Le développement de produits s’est élargi pour se concentrer sur la construction légère, la durabilité améliorée et le design centré sur l’utilisateur.
  - year: '2022'
    title: Certification et Croissance Mondiale
    body: Certification ISO 9001 obtenue. Expansion à 14 ingénieurs R&D et 200+ employés. Produits distribués en Europe, Amériques et Asie-Pacifique.
  - year: '2024'
    title: Studio d'Innovation et Design
    body: Lancement d’un studio de design et d’innovation multiservice pour des projets ODM personnalisés, du concept à la production. Renforcement des applications marines professionnelles incluant les appels d’offres de sauvetage, commerciaux et gouvernementaux.
  - year: '2026'
    title: Construire l'Avenir de l'Exploration Aquatique
    body: Aujourd'hui, afarer continue de développer des systèmes SUP et des accessoires marins —connectant les personnes et les organisations au monde de l'exploration aquatique.
content_founding:
  tagline: Le Début
  title: Né sur le Front de Mer
  subtitle: 'afarer a commencé dans un atelier côtier à Qingdao avec un bateau et une vision : construire des embarcations gonflables capables d''affronter les conditions marines réelles.'
  paragraphs:
    - En 2012, nos fondateurs ont vu une lacune sur le marché — la plupart des embarcations gonflables étaient soit abordables mais peu fiables, soit de haute qualité mais prohibitivement chères. Ils croyaient qu’il y avait de la place pour un fabricant offrant à la fois qualité et valeur.
    - La première coque a été construite à la main, testée dans les eaux locales et affinée sur la base des retours réels des pêcheurs et des petits opérateurs commerciaux. Cette boucle de rétroaction — construire, tester, écouter, améliorer — reste au cœur de notre philosophie d’ingénierie aujourd’hui.
    - En 2015, la réputation avait dépassé Qingdao. Des distributeurs internationaux ont demandé des échantillons.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer early production workshop and manufacturing
content_growth:
  tagline: Croissance et Innovation
  title: De l'Atelier à l'Installation de 12 000 m²
  subtitle: L'investissement continu dans les équipes, équipements et processus a transformé afarer en une installation de fabrication marine moderne.
  paragraphs:
    - Avec la demande croissante, nous sommes passés d'un petit atelier à une usine de 12 000 m² avec des lignes de production dédiées.
    - Nous avons investi dans des machines de découpe CNC, des équipements de soudure haute fréquence, des lignes de production drop-stitch et des bancs d’essai complets — nous permettant de contrôler tous les aspects de la qualité de production.
    - Aujourd’hui, notre équipe de plus de 200 personnes comprend des ingénieurs marins, des scientifiques des matériaux, des spécialistes du contrôle qualité et des artisans qualifiés — dont beaucoup sont chez afarer depuis les débuts.
philosophy:
  tagline: Philosophie de la Marque
  title: L'ingénierie de la liberté sur l'eau
  body: La liberté sur l’eau ne se résume pas au mouvement. Elle représente la découverte de nouveaux lieux, la création d’expériences en plein air, la connexion des personnes avec la nature et la réalisation de missions professionnelles. L’ingénierie rend cette liberté possible.
  pillars:
    - title: La Fiabilité Avant Tout
      body: Les environnements aquatiques exigent la confiance. Les produits afarer sont conçus pour la stabilité, la durabilité et la sécurité.
    - title: Conception Centrée sur l'Humain
      body: Les produits doivent servir les personnes, pas la technologie. Chaque décision de conception commence par comprendre comment les gens utilisent les embarcations, où ils explorent et à quels défis ils font face.
    - title: Exploration Accessible
      body: L’eau ne devrait pas appartenir seulement aux experts. afarer crée des équipements qui permettent à plus de personnes de vivre en toute sécurité les rivières, les lacs, les océans et les environnements côtiers.
    - title: Innovation Continue
      body: L'innovation ne consiste pas seulement à créer de nouveaux produits. C'est améliorer chaque détail — matériaux, structures, fabrication et expérience utilisateur.
engineeringDna:
  tagline: ADN d'Ingénierie
  title: Comment afarer crée ses produits
  areas:
    - title: Science des Matériaux
      body: afarer se concentre sur la sélection de matériaux appropriés pour différents environnements marins. Les considérations clés incluent la résistance à l'abrasion, la résistance UV, la stabilité à la pression et la durabilité à long terme.
      items:
        - Résistance à l'Abrasion
        - Résistance UV
        - Stabilité de Pression
        - Durabilité à Long Terme
    - title: Ingénierie Structurelle
      body: Les embarcations gonflables nécessitent un équilibre précis entre rigidité, poids, portabilité et stabilité. L’ingénierie afarer se concentre sur l’optimisation de ces facteurs grâce à la technologie drop-stitch et à la construction avancée des joints.
      items:
        - Rigidité
        - Optimisation du Poids
        - Portabilité
        - Stabilité
    - title: Précision de Fabrication
      body: 'Chaque produit passe par des processus contrôlés : préparation, découpe, soudure, assemblage, inspection qualité et vérification des performances.'
      items:
        - Préparation des Matériaux
        - Découpe de Précision
        - Soudure et Assemblage
        - Assemblage et CQ
    - title: Ingénierie des Scénarios d'Utilisation
      body: Les produits sont développés autour d'applications réelles — loisirs, aventure et usage professionnel — garantissant que chaque conception répond aux exigences spécifiques de son environnement prévu.
      items:
        - Loisirs
        - Aventure
        - Professionnel
        - Commercial

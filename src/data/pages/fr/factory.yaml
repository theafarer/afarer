material_traceability:
  tagline: Traçabilité
  title: Suivi des Matières et Contrôle des Lots
  description: Chaque lot de matière première reçoit un numéro de lot unique in our ERP system. From arrival through production to the finished product, each boat's bill of materials links back to the original supplier batch. This enables full upstream traceability for any quality or compliance inquiry.
  system: ERP personnalisé (système interne Qingdao Vatrad) + étiquettes de lot physiques sur chaque ordre
  coverage: 100 % des matériaux de production — PVC, Hypalon, tissu drop-stitch, adhésifs, valves, quincaillerie, emballage
  records_retained: 10 ans (selon exigence CE 2013/53/UE)
  suppliers:
    - material: PVC qualité marine
      source: Fournisseurs chinois et coréens
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Fournisseur japonais
      certified: ISO 9001, REACH
    - material: Tissu drop-stitch
      source: Tissage interne + partenaire externe
      certified: CQ interne + fournisseur ISO 9001
    - material: Valves et Quincaillerie
      source: Fournisseurs OEM chinois
      certified: ISO 9001, certificats matériaux par lot

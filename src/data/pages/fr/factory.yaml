qc_section:
  tagline: Contrôle qualité
  title: Processus de Test et Assurance Qualité
  subtitle: Chaque bateau subit des tests obligatoires avant expédition. Le laboratoire qualité est indépendant de la production.
  steps:
    - step: '1'
      title: Inspection des Matières Premières
      desc: Les tissus PVC, Hypalon et drop-stitch subissent des tests de traction (ASTM D751), de propagation de déchirure et de vérification de résistance UV avant qu’un lot n’entre en production.
    - step: '2'
      title: Test de Rétention d'Air 24–48 Heures
      desc: Chaque chambre est gonflée à 125 % de la pression nominale pendant 24–48h. Une chute >5 % déclenche un rejet et une réinspection.
    - step: '3'
      title: Test de Charge et d'Équilibre
      desc: Les bateaux sont chargés à capacité maximale et testés pour la stabilité, le franc-bord et la maniabilité. Chaque embarcation est testée dans l'eau.
oem_section:
  tagline: Projets OEM
  title: Études de Cas Partenariats Marque et OEM
  subtitle: Du concept au conteneur — comment nous aidons les marques mondiales à lancer et développer leurs gammes de SUP gonflables.
  cases:
    - challenge: Un détaillant européen avait besoin d'une gamme SUP marque blanche avec graphiques uniques, PVC écologique et emballage prêt vente — livré en 60 jours.
      solution: Développement de fichiers numériques, approvisionnement PVC conforme REACH et réduction de l'échantillonnage de 3 à 1 tour en co-implantant l'équipe design à Qingdao.
      result: 55 jours du bon de commande au FOB. 2 400 unités sur 4 SKUs. Commande renouvelée avant l'arrivée du premier conteneur.
    - challenge: Une startup américaine avait besoin d'un SUP drop-stitch haute performance avec forme personnalisée et certification BSCI.
      solution: Adaptation du moule SUP, développement des visuels d'emballage co-marqué et documentation d'audit BSCI complète.
      result: Listé dans 3 grandes chaînes outdoor américaines. 5 000+ unités en 1ère année avec 98 % de taux d'écoulement.
    - challenge: Un distributeur australien avait besoin d'une gamme SUP certifiée CE avec couleurs personnalisées.
      solution: Production d'échantillons de pré-série avec 4 variantes de couleur et tests de conformité tiers.
      result: Gamme SUP 3 modèles lancée sur le marché AU/NZ. Suivie d'un appel d'offres gagné pour 12 SUP de patrouille.
faq_section:
  tagline: FAQ
  title: Questions Fréquentes B2B et OEM
  questions:
    - q: Quel est le volume minimum de commande (MOQ) pour les planches SUP gonflables OEM ?
      a: Le MOQ commence à 5–10 unités pour les modèles OEM standard. Les moules personnalisés et les projets de marque de distributeur nécessitent un minimum de 200 unités selon la complexité. Les commandes d’essai et les séries d’échantillons sont disponibles pour les lancements de nouvelles marques.
    - q: afarer détient-il la certification BSCI ?
      a: Oui. Notre usine maintient une certification de conformité sociale BSCI valide (rapport d'audit disponible sur demande). Nous détenons également la certification ISO 9001 pour la gestion de la qualité et tous les produits portent la certification CE. La documentation de conformité REACH et RoHS est fournie avec chaque expédition OEM.
    - q: Quel est le délai habituel pour une commande OEM ?
      a: Le délai standard est de 30 à 45 jours à partir de la commande confirmée et de l'acompte pour la production OEM en série. Le développement de moules personnalisés ajoute 15 à 20 jours pour l'outillage. Une production accélérée est disponible pour les commandes urgentes et les pics saisonniers. Les échantillons de prototype sont généralement expédiés sous 15 à 20 jours.
    - q: Pouvez-vous expédier FOB Qingdao ou CIF jusqu'à notre port ?
      a: Oui. Nous expédions FOB Qingdao, CIF vers les grands ports mondiaux et DDP pour les partenaires qualifiés. Notre équipe logistique gère la réservation des conteneurs, la documentation d’exportation et le dédouanement. Nous expédions vers plus de 50 pays sur les marchés UE, États-Unis, Australie et Asie.
b2b_moq: 'MOQ standard : 5–10 unités par modèle. Commandes d’essai bienvenues pour les nouveaux partenariats.'
production_flow:
  tagline: Flux de Production
  title: De la Matière au Bateau Fini
  subtitle: Chaque bateau passe par 6 étapes de production avec des points de contrôle à chaque étape. Aucun raccourci.
  stages:
    - stage: '01'
      title: Réception des matériaux et CQ entrant
      description: Tous les matériaux entrants sont enregistrés dans notre ERP. Les rouleaux PVC, cœurs drop-stitch, valves et quincaillerie sont en quarantaine jusqu'à validation CQ.
      qc_check: Résistance traction (ASTM D751), résistance déchirure (ISO 4674), jauge d'épaisseur, viscosité adhésif, scan défauts visuels
      qc_threshold: 100 % des lots testés. Rejet si traction < 90 %, déchirure < min ou tout défaut visuel
      responsibility: Équipe CQ entrant (3 inspecteurs)
    - stage: '02'
      title: Découpe CNC et préparation
      description: Le calepinage optimisé dispose les panneaux sur le stock PVC pour minimiser les déchets. Les machines CNC maintiennent une précision de 0,1 mm.
      qc_check: Vérification dimensionnelle contre fichiers CAD DXF, inspection qualité des bords, vérification du nombre de panneaux
      qc_threshold: Chaque 20ème panneau mesuré. Tolérance ±0,5 mm. Rejet du lot si >2 % hors tolérance
      responsibility: Responsable atelier découpe
    - stage: '03'
      title: Soudure et liaison drop-stitch
      description: Les cœurs drop-stitch sont liés aux stratifiés PVC par thermolamination. Les chambres sont soudées par RF ou air chaud.
      qc_check: Test de pelage tous les 50 unités, mesure largeur soudure, revue température air chaud, inspection visuelle des joints sous rétroéclairage
      qc_threshold: Résistance pelage min 8 N/cm. Tolérance largeur soudure ±1 mm. Tout cannelure visible = rejet
      responsibility: CQ soudure (2 inspecteurs par équipe)
    - stage: '04'
      title: Assemblage et gréement
      description: "Les bateaux passent à l'assemblage final : coque + tubes, valves, anneaux D, poignées, boîtiers d'aileron et sac de transport. Chaque unité suit une checklist 100 points."
      qc_check: Validation checklist 100 points par unité, test fonction valve, vérification couple de serrage, inspection visuelle
      qc_threshold: 'Politique zéro défaut sur les éléments de sécurité. Défauts mineurs : AQL 2.5 (ISO 2859)'
      responsibility: Chef d'équipe assemblage + CQ ligne
    - stage: '05'
      title: Test de pression et retenue qualité
      description: Chaque chambre est gonflée à 1,25× la pression nominale (généralement 20–25 PSI) et maintenue pendant 24 à 48 heures. Les capteurs de pression enregistrent en continu. Les chambres dont la chute de pression dépasse 5 % sont rejetées et renvoyées pour réinspection des soudures.
      qc_check: Journal de maintien de pression 24–48h, étalonnage capteurs quotidien, lecture compensée en température, re-test après réparation
      qc_threshold: Max 5% de chute de pression sur 24–48h à température stable. Tout dépassement = re-test 100 % du lot
      responsibility: Laboratoire qualité (indépendant de la production, rapporte à la direction)
    - stage: '06'
      title: Inspection finale et emballage
      description: Inspection visuelle et fonctionnelle finale. Défauts de surface, cohérence des couleurs, vérification des étiquettes/BIN, intégrité de l’emballage et intégralité des accessoires. Les unités sont conditionnées sous vide, mises en boîte et palettisées pour le chargement en conteneur.
      qc_check: Inspection visuelle complète, checklist accessoires par SKU, test chute emballage (1 m), vérification code-barres
      qc_threshold: AQL 2.5 défauts majeurs, AQL 4.0 défauts mineurs. Tolérance zéro défauts sécurité. 100 % des unités inspectées visuellement.
      responsibility: Équipe CQ finale (4 inspecteurs) + Chef d'équipe emballage

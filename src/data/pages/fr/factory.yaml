workshops_section:
  tagline: Ateliers
  title: Ateliers de Fabrication
  workshops:
    - title: Découpe PVC et Préparation des Matériaux
      description: Les machines CNC traitent les tissus PVC, Hypalon et drop-stitch avec une précision submillimétrique. Le calepinage optimisé minimise les déchets et garantit les spécifications dimensionnelles.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Soudure de Tubes et Thermoscellage
      description: Atelier de soudure dédié avec machines de thermosoudure et presses diélectriques RF. Les thermosoudeuses à air chaud lient et fusionnent les chambres des tubes PVC, tandis que les soudures RF produisent des joints étanches à haute résistance qui dépassent les exigences ISO 6185.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: Liaison du Cœur Drop-Stitch
      description: Les cœurs drop-stitch sont liés aux stratifiés PVC par thermolamination. Des milliers de fils polyester créent une structure rigide à 12-15 PSI. Les bandes de bord sont fusionnées en triple couche.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Impression et Décoration SUP
      description: Les planches SUP sont décorées par impression numérique pour les graphiques couleur et sérigraphie pour les logos et motifs répétés. Les imprimantes numériques produisent des designs de pont qualité photo, tandis que la sérigraphie offre des marques de marque durables et vives.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Assemblage Final et Montage
      description: Chaîne d'assemblage où valves, anneaux D, poignées, boîtiers d'aileron et pads sont installés. Chaque planche suit une checklist 100 points validée par le chef d'équipe.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Tests Qualité et Inspection
      description: Chaque bateau subit un test de rétention d'air, vérification de pelage et contrôle complet des systèmes avant expédition. Le laboratoire qualité est indépendant de la production.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

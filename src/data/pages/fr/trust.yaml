steps2_manufacturing:
  title: Comment nous assurons la qualité
  subtitle: De l'inspection des matières premières au test de pression final — chaque produit passe par une chaîne qualité rigoureuse.
  items:
    - title: Inspection des Matières Premières
      description: Chaque rouleau de tissu PVC est testé pour l'épaisseur, la résistance à la traction et aux UV avant d'entrer en production.
      icon: tabler:search
    - title: CQ en cours
      description: Les soudures, installations de valves et liaisons de chambres sont inspectées à chaque poste d'assemblage.
      icon: tabler:eye
    - title: Test de Pression
      description: Chaque produit gonflable est gonflé à 1,5x le PSI nominal et maintenu pendant 24 heures pour vérifier la rétention d'air et l'intégrité des soudures.
      icon: tabler:wind
    - title: Inspection finale
      description: Chaque unité est inspectée pour la finition, le matériel et l'emballage before being approved for shipment. Batch samples go to our lab for destructive testing.
      icon: tabler:clipboard-check

faqs_sup:
  title: FAQ Planches SUP
  subtitle: Questions fréquentes sur nos planches de paddle.
  columns: 2
  items:
    - title: Quelles tailles de planches SUP afarer propose-t-il ?
      description: Nous proposons des planches SUP de 9 ft à 12 ft, couvrant tout, des planches polyvalentes compactes aux designs de randonnée et spécialisés. Chaque modèle est disponible avec de multiples options de configuration.
    - title: Quelle est la différence entre un SUP gonflable et un SUP rigide ?
      description: Un SUP gonflable utilise une construction drop-stitch avec des milliers de fils internes permettant une haute pression d'air, tandis qu'un SUP rigide utilise de l'époxy ou de la fibre de verre. Les SUP gonflables offrent portabilité et commodité de rangement sans sacrifier la rigidité.
    - title: Quel est le poids maximum pour les planches SUP ?
      description: Nos planches SUP supportent jusqu’à 150 kg selon le modèle et le volume. Chaque page produit indique la charge maximale pour votre modèle spécifique.
    - title: Les SUP afarer sont-ils certifiés CE ?
      description: Oui. Tous les modèles SUP récréatifs sont certifiés CE selon les normes européennes applicables.
    - title: Quelle est la garantie sur les planches SUP ?
      description: Tous les SUP afarer bénéficient d'une garantie standard d'un an contre les défauts de fabrication, couvrant les défaillances de joints, les défauts de valves et le délaminage.
    - title: Combien de temps faut-il pour gonfler une planche SUP ?
      description: Avec la pompe manuelle incluse, un gonflage complet à 15 PSI prend environ 8 à 12 minutes. Pour un gonflage plus rapide, nous recommandons notre pompe électrique afarer 12V, qui gonfle une planche en moins de 4 minutes.
faqs_materials:
  title: FAQ sur les Matériaux et l'Entretien des SUP
  subtitle: Questions fréquentes sur les matériaux, l'entretien et le stockage de nos SUP gonflables.
  columns: 2
  items:
    - title: Quels matériaux sont utilisés dans les SUP gonflables afarer ?
      description: Nous utilisons du PVC de qualité militaire (1100 deniers) avec construction stabilisée UV et résistante à l’abrasion, conforme aux règlements UE REACH et RoHS.
    - title: Combien de temps durent les SUP gonflables ?
      description: Avec un entretien approprié, un SUP gonflable en PVC de qualité dure 5 à 10 ans. Un nettoyage régulier, une protection UV et un stockage adapté prolongent considérablement la durée de vie.
    - title: Quel entretien est requis pour un SUP gonflable ?
      description: L'entretien de base comprend le rinçage à l'eau douce après chaque utilisation (surtout en eau salée), le séchage avant stockage, la vérification annuelle des valves et l'évitement d'une exposition prolongée au soleil.
    - title: Les SUP gonflables peuvent-ils être utilisés en eau salée ?
      description: Oui. Tous les SUP gonflables afarer sont conçus pour une utilisation en eau douce et en eau salée. Nous recommandons de rincer à l'eau douce et de sécher soigneusement après une exposition à l'eau salée.
    - title: Comment stocker un SUP gonflable ?
      description: Dégonflez, nettoyez et séchez complètement la planche avant stockage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: Quelle est la capacité de poids des SUP gonflables afarer ?
      description: Les capacités de poids vont de 100 kg pour nos plus petits modèles à plus de 200 kg pour les planches plus grandes. Chaque page produit indique la charge maximale pour votre modèle spécifique.

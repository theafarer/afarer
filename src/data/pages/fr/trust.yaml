faqs_sup:
  title: FAQ Planches SUP
  subtitle: Questions courantes sur nos planches de stand-up paddle.
  columns: 2
  items:
    - title: Quelles tailles de planches SUP sont disponibles ?
      description: Nous proposons des planches SUP de 9 pi à 12 pi, incluant des designs polyvalents, de randonnée, yoga et spécialisés. Nos modèles les plus vendus incluent la Tropical Breeze (10 pi) et l'Ocean Voyager (11 pi).
    - title: Qu'est-ce que la construction drop-stitch ?
      description: La construction drop-stitch utilise des milliers de fils polyester reliant les couches supérieure et inférieure de la planche, lui permettant de maintenir une pression d'air élevée (15—0 PSI) et d'offrir une plateforme rigide et stable. C'est la norme industrielle pour les SUP gonflables premium.
    - title: Quelle est la limite de poids pour les planches SUP ?
      description: Nos planches SUP supportent jusqu'à 150 kg selon le modèle et le volume. La Leviathan Wake est notre modèle à plus haute capacité, conçu pour les gabarits plus lourds et l'utilisation en yoga.
    - title: Proposez-vous des kits SUP complets ?
      description: Oui. Chaque planche SUP est livrée avec un kit complet incluant une pagaie aluminium 3 pièces, une pompe manuelle haute pression, une laisse spirale, un sac à dos de voyage et un kit de réparation. Certains modèles incluent également un jeu d'ailerons amovibles.
    - title: Quelle est la garantie sur les planches SUP ?
      description: Toutes les planches SUP afarer bénéficient d'une garantie d'un an contre les défauts de fabrication, incluant la défaillance des joints, les défauts de valves et le délaminage des matériaux en usage normal.
    - title: Combien de temps faut-il pour gonfler une planche SUP ?
      description: Avec la pompe manuelle fournie, un gonflage complet à 15 PSI prend environ 8 à 12 minutes. Pour un gonflage plus rapide, nous recommandons notre pompe électrique afarer 12V, qui gonfle une planche en moins de 4 minutes.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

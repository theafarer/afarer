intro: La coque est l’épine dorsale de tout RIB ou bateau gonflable. Elle doit être assez légère pour déjauger efficacement, assez solide pour absorber les charges d’impact et dimensionnellement stable sur une large plage de températures. Chez {SITE.name}, notre Studio d’Ingénierie de Coque combine la modélisation CAO avancée, l’analyse par éléments finis (FEA) et des décennies d’expérience pratique en architecture navale pour livrer des coques optimisées pour leur mission prévue — pas des formes génériques adaptées d’un catalogue.
content_html: |-
  <h2>Là où la force rencontre l'hydrodynamique</h2>
  <p>Nous travaillons avec trois matériaux de coque principaux — le HDPE moulé par rotation, le PEHD thermoplastique et le composite fibre de verre. Chaque matériau offre des avantages distincts pour des applications spécifiques. Nos coques en fibre de verre sont conçues avec des angles de quille calculés, optimisés pour chaque longueur de modèle et son utilisation prévue.</p>

  <h2>Matériaux de coque</h2>
  <ul>
    <li><strong>HDPE moulé par rotation :</strong> Haute résistance aux chocs, idéal pour les bateaux de travail</li>
    <li><strong>PEHD thermoplastique :</strong> Léger, excellent pour les vitesses de déjaugeage</li>
    <li><strong>Composite fibre de verre :</strong> Rigidité maximale, idéal pour les performances haut de gamme</li>
  </ul>

  <h2>Angles de quille</h2>
  <p>Un V plus prononcé pour le large offre une meilleure pénétration des vagues et un confort accru. Un angle plus plat pour les eaux intérieures offre une meilleure stabilité et un tirant d'eau réduit. Nos conceptions sont optimisées par CAO et vérifiées par des tests en conditions réelles.</p>

intro: C'est une idée reçue courante que les tests hydrodynamiques sont réservés aux navires océaniques. En réalité, les performances des petits bateaux gonflables bénéficient tout autant des essais en bassin de carène.
content_html: |-
  <h2>Pourquoi tester un petit bateau en bassin ?</h2>
  <p>Les essais en bassin à échelle réduite (généralement 1:3 à 1:5) permettent d'itérer rapidement sur les formes de coque avant l'engagement dans les moules de production. Notre bassin d'essai est équipé de capteurs de force, de caméras haute vitesse et d'un système de génération de vagues.</p>

  <h2>Ce que nous mesurons</h2>
  <ul>
    <li><strong>Résistance à l'avancement :</strong> Traînée en fonction de la vitesse et de l'état de la mer</li>
    <li><strong>Stabilité :</strong> Courbes de stabilité statique et dynamique</li>
    <li><strong>Comportement en vagues :</strong> Roulis, tangage et pilonnement dans diverses conditions</li>
    <li><strong>Distribution des pressions :</strong> Carte des pressions sur la coque pour l'optimisation structurelle</li>
  </ul>

  <h2>Avantages des essais en bassin</h2>
  <p>Contrairement à la seule CFD, les essais en bassin capturent les effets d'interface air-eau, les phénomènes de déjaugeage et les comportements transitoires que les simulations numériques peinent à prédire avec précision.</p>

features:
  title: 'Ce que le Co-Branding Signifie chez afarer'
  subtitle: 'Le co-branding est notre programme de partenariat de conception — construit autour de la marque afarer, de la protection de territoire et de collections limitées, et non d’une production sans marque.'
  columns: 3
  items:
    - title: 'Les Produits afarer Restent des Produits afarer'
      description: 'Une collection co-marquée est une édition limitée de planches afarer intégrant votre identité. Ce n’est jamais sans marque, jamais une marque tierce, et jamais un programme open private-label.'
      icon: 'tabler:trademark'
    - title: 'Conçu Avec Vous'
      description: 'Vos couleurs, votre nom et votre histoire façonnent la collection. Notre équipe de conception et d’ingénierie gère les decks, graphismes, emballages et documentation du brief à la livraison.'
      icon: 'tabler:pencil'
    - title: 'Pour Clubs, Resorts, Événements & Communautés'
      description: 'Collections de flotte pour paddle clubs et resorts, éditions événementielles pour courses et séries communautaires — toutes avec la qualité et la garantie afarer.'
      icon: 'tabler:users'
    - title: 'Protège les Partenaires Pays'
      description: 'Le co-branding s’inscrit dans notre modèle un-pays-un-distributeur. Les partenaires nationaux conservent leur territoire ; les collections co-marquées n’ouvrent pas la porte à des marques parallèles sur leur marché.'
      icon: 'tabler:shield-check'
    - title: 'Standards d’Ingénierie & de Qualité'
      description: 'Chaque collection part de notre chaîne d’approvisionnement certifiée avec documentation CE et ISO 9001, tests de pression et les mêmes points de contrôle qualité que notre gamme principale.'
      icon: 'tabler:certificate'
    - title: 'Devient un Atout de Marque'
      description: 'Une collection co-marquée en édition limitée construit votre propre histoire sur l’eau — marge de revente, contenu média et une raison pour les pagayeurs de revenir saison après saison.'
      icon: 'tabler:star'

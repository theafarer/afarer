faqs:
  title: 'Co-Brand — FAQ'
  subtitle: 'Comment fonctionne le co-branding afarer, et en quoi il diffère de l’OEM et de la marque privée.'
  items:
    - title: 'Le co-branding est-il identique à l’OEM ou à la marque privée ?'
      description: 'Non. afarer ne gère plus de programme OEM/marque privée ouvert. Les produits co-marqués restent des produits afarer — conçus, ingénierés, contrôlés qualité et soutenus par la marque afarer. Votre identité apparaît en co-marque, pas comme un produit tiers sans marque.'
    - title: 'Qui peut démarrer un projet co-brand ?'
      description: 'Les entreprises qualifiées du secteur nautique : partenaires pays existants, paddle clubs, resorts et hôtels, organisateurs d’événements et communautés. Envoyez-nous un brief de projet et nous confirmons l’éligibilité avant le début du travail de conception.'
    - title: 'Le co-branding entrera-t-il en conflit avec mon distributeur pays ?'
      description: 'Non. Le modèle un-pays-un-distributeur est prioritaire. Les collections co-marquées sont coordonnées avec le partenaire pays local lorsqu’il en existe un, de sorte qu’aucune marque parallèle ou concurrente n’apparaît dans un territoire protégé.'
    - title: 'Quelle est la commande minimale pour une collection co-marquée ?'
      description: 'Les collections pilotes commencent à 30–50 unités. Les collections standard sont de 50–100 unités ; les éditions grandes ou multi-régions sont de 100+ unités. Les délais de développement personnalisés sont convenus par projet.'
    - title: 'Quelle part revient à la qualité afarer par rapport à l’apport du partenaire ?'
      description: 'afarer maîtrise la conception produit, l’ingénierie, les matériaux, la construction, le contrôle qualité et la garantie. Les partenaires contribuent au concept de collection, au nom, aux couleurs, aux apports graphiques et à la mise sur le marché. Cela maintient un seul standard de qualité sur l’eau.'
    - title: 'Comment puis-je postuler ?'
      description: 'Remplissez le formulaire de demande co-brand avec votre entreprise, votre marché et votre idée de collection. Nous évaluons la pertinence, puis répondons sous 3 jours ouvrés avec une proposition et l’Accord de Projet Co-Brand.'

intro: Chaque bateau qui quitte notre atelier est certifié avoir passé un ensemble défini d'inspections qualité et d'essais matériaux. Notre laboratoire qualité et inspection est une fonction indépendante au sein de l'organisation — il rend compte directement au directeur général, et non à la production — garantissant qu'aucune pression commerciale ne peut compromettre le point d'inspection. Si un lot de matériaux ou un bateau achevé ne respecte pas la spécification publiée, le laboratoire a l'autorité d'arrêter l'expédition jusqu'à la résolution de la non-conformité.
content_html: |-
  <h2>Confiance, mais vérifié</h2>
  <p>Notre laboratoire d'inspection qualité opère sous un système de management de la qualité aligné sur les principes ISO 9001. Nos méthodes de test sont conformes aux normes internationales et nos techniciens sont certifiés pour chaque procédure.</p>

  <h2>Protocoles de test</h2>
  <ul>
    <li><strong>Test de pression à 100 % :</strong> Chaque chambre est testée à 1,5x la pression nominale</li>
    <li><strong>Test d'étanchéité :</strong> Surveillance de la chute de pression sur 24 heures</li>
    <li><strong>Test des soudures :</strong> Vérification de la résistance au pelage</li>
    <li><strong>Test des valves :</strong> Fonctionnalité et étanchéité</li>
    <li><strong>Inspection visuelle :</strong> Chaque produit est inspecté avant expédition</li>
  </ul>

  <h2>Traçabilité</h2>
  <p>Chaque produit possède un numéro de série unique qui permet de retracer tous les tests, matériaux et étapes de fabrication. Cela garantit une responsabilité et une qualité totales.</p>

  <h2>Certifications</h2>
  <p>Notre laboratoire est équipé pour tester selon les normes ISO, ASTM et CE. Nous entretenons des relations avec des laboratoires accrédités pour les tests nécessitant des équipements spécialisés.</p>

  description: "Laboratoire d'essais et assurance qualité afarer : tests de pression, vieillissement UV, résistance à la traction pour SUP gonflables et bateaux pneumatiques."
  keywords:
    - 'contrôle qualité SUP'
    - 'test SUP gonflable'
    - 'qualité paddle gonflable'

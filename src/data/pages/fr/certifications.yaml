content_certifications:
  tagline: Nos Certifications
  title: Qualité Certifiée,<br />Reconnue Mondialement
  subtitle: Chaque produit afarer est soutenu par des certifications attestant de notre engagement envers la qualité et la sécurité.
  items:
    - title: Certifié CE
      description: Tous les produits afarer sont conformes aux exigences de marquage CE pour les embarcations de loisir, garantissant la sécurité et la protection de l'environnement.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Notre système de gestion de la qualité est certifié ISO 9001:2015, couvrant la conception, la fabrication et la distribution d’embarcations gonflables et d’équipements marins.
      icon: tabler:clipboard-check
    - title: Marquage UKCA
      description: Les produits vendus sur le marché britannique portent le marquage UKCA, confirmant la conformité aux règlements britanniques pour les équipements marins et les embarcations personnelles.
      icon: tabler:shield
    - title: Conforme BSCI
      description: afarer est audité BSCI (Initiative de Conformité Sociale des Entreprises), démontrant des pratiques de fabrication éthiques, des conditions de travail équitables et une responsabilité de la chaîne d'approvisionnement.
      icon: tabler:heart-handshake
    - title: Conforme REACH
      description: Tous les matériaux utilisés dans les produits afarer sont conformes au règlement européen REACH pour la sécurité chimique.
      icon: tabler:flask
    - title: Tests des Matériaux
      description: Les tissus sont testés pour la résistance à la traction, la résistance à la déchirure, la dégradation UV et les performances de fissuration à froid. Chaque lot de production est échantillonné et vérifié.
      icon: tabler:test-pipe
content_factory:
  tagline: Factory Standards
  title: Excellence de Fabrication<br />— Conforme aux Spécifications
  subtitle: Notre usine de 12 000 m² fonctionne sous des protocoles de contrôle qualité stricts à chaque étape.
  list:
    - 'Inspection des Matières Entrantes : Toutes les matières premières — tissu PVC, Hypalon, aluminium, contreplaqué, adhésifs — sont testées par rapport aux spécifications avant d’entrer en production.'
    - 'Contrôle Qualité en Cours de Processus : Chaque étape de production a des points de contrôle qualité documentés. La résistance de la soudure, l’alignement des joints, l’installation des valves et le couple de serrage sont vérifiés en ligne.'
    - 'Test de Pression : Chaque chambre gonflable est testée sous pression à 1,25 fois la pression nominale pendant 24 à 48 heures. La chute de pression doit rester inférieure à 5 % pour obtenir une note de passage.'
    - 'Inspection Finale : Les produits finis sont inspectés pour la précision dimensionnelle, la finition esthétique, l’intégralité des accessoires et l’intégrité de l’emballage avant expédition.'
    - 'Traçabilité des lots : chaque produit porte un numéro de série lié aux enregistrements des lots de production, permettant une traçabilité complète de la matière première au produit fini.'
content_safety:
  tagline: Marine Safety Standards
  title: Sécurité Avant Tout<br />— Conçu pour un Fonctionnement Fiable
  subtitle: Les produits afarer sont conçus et testés selon les normes de sécurité maritime internationales.
  items:
    - title: ISO 6185
      description: Les bateaux gonflables sont conformes aux normes ISO 6185 pour la construction, la stabilité et la flottabilité.
      icon: tabler:sailboat
    - title: Normes ABYC
      description: Les systèmes électriques et de carburant sont conformes aux normes ABYC (American Boat & Yacht Council) pour une installation et une utilisation sûres.
      icon: tabler:bolt
    - title: Conformité SOLAS
      description: Les équipements de sécurité et dispositifs de sauvetage répondent aux exigences SOLAS (Sécurité de la Vie en Mer) le cas échéant.
      icon: tabler:lifebuoy

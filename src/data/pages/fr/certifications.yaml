hero:
  tagline: Certifications et Normes
  title: Certifications Qualité<br />et Normes de Conformité
  subtitle: Les produits afarer sont fabriqués conformément aux normes internationales de sécurité maritime.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp

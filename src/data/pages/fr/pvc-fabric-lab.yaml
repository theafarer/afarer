intro: Le tissu du tube est le matériau le plus critique d’un bateau gonflable. Il doit résister à une exposition UV constante, à des cycles de gonflage répétés, à l’abrasion contre les quais et les débris, et à des variations extrêmes de température — tout en maintenant son intégrité structurelle pendant des années. Chez {SITE.name}, notre Laboratoire de Tissu PVC est dédié exclusivement à la caractérisation, la validation et l’amélioration continue des tissus que nous utilisons dans chaque bateau que nous construisons.
content_html: |-
  <h2>Le fondement de chaque bateau gonflable</h2>
  <p>Nous ne nous fions pas uniquement aux fiches techniques des fournisseurs. Chaque lot de tissu PVC et Hypalon est testé dans notre laboratoire avant d'être approuvé pour la production. Nos protocoles de test couvrent la résistance à la traction, la résistance à la déchirure, l'adhérence et la résistance aux UV.</p>

  <h2>Tests de matériaux</h2>
  <ul>
    <li><strong>Résistance à la traction :</strong> ASTM D751 / ISO 1421</li>
    <li><strong>Résistance à la déchirure :</strong> ASTM D2261 / ISO 4674</li>
    <li><strong>Résistance d'adhérence :</strong> Test de pelage à 180°</li>
    <li><strong>Résistance aux UV :</strong> Vieillissement accéléré (700+ heures)</li>
    <li><strong>Flexibilité à froid :</strong> Test de pliage à -30°C</li>
  </ul>

  <h2>Contrôle qualité</h2>
  <p>Chaque lot est testé avec des échantillons prélevés à trois endroits de la largeur du rouleau. Les résultats sont enregistrés dans notre système MES avec traçabilité complète jusqu'au fournisseur et à la date de production.</p>

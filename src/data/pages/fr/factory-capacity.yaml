intro: afarer exploite l'une des plus grandes installations dédiées à la fabrication de bateaux gonflables à Qingdao, en Chine. Notre usine de 12 000 m² est organisée en six ateliers spécialisés opérant en parallèle, nous donnant la capacité de produire plus de 15 000 bateaux par an sur les lignes SUP, kayak, dériveurs, RIB et équipements de sécurité.

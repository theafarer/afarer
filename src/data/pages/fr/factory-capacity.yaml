workshops:
  - title: Production de planches SUP
    description: "4 lignes d'assemblage parallèles pour SUP gonflables. Chaque ligne produit 50–80 planches par équipe. Capacité annuelle SUP : 8 000+ planches."
    output: 8 000+ SUP/an
  - title: 'Production de bateaux RIB'
    description: "Atelier spécialisé de coques en fibre de verre avec 6 stations de moulage pour des coques de bateaux jusqu'à 7,6 m. La zone de soudage et d'assemblage des tubes traite 3–6 bateaux simultanément. Capacité annuelle de RIB : 2 000+ bateaux."
    output: '2 000+ RIB/an'
  - title: 'Bateaux gonflables et SUP'
    description: "Lignes de production polyvalentes pour bateaux gonflables, kayaks et dériveurs. Postes de soudure à air chaud, presses diélectriques RF et postes d'assemblage sont reconfigurés en fonction du mix de commandes. Capacité annuelle : plus de 5 000 unités."
    output: 5 000+ unités/an
  - title: Équipements de sécurité
    description: 'Zone de production en salle blanche séparée pour les gilets de sauvetage et les équipements de sécurité. Postes de couture, d’insertion de mousse et de test dédiés. Capacité annuelle de gilets de sauvetage : plus de 50 000 unités.'
    output: 50 000+ gilets/an
oem_capacity:
  moq: 'SUP : 5–10 unités | Bateau : 2–5 unités | Kayak/Dériveur : 10–50 unités | Moule personnalisé : 200+ unités'
  lead_time: Standard 30–45 jours. Échantillon 15–20 jours. Express disponible.
  payment: T/T 30 % d’acompte + 70 % avant expédition. L/C, Western Union acceptés.

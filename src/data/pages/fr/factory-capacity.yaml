workshops:
  - title: Production de planches SUP
    description: '4 lignes d''assemblage parallèles pour SUP gonflables. Chaque ligne produit 50—0 planches par équipe. Capacité annuelle SUP : 8 000+ planches.'
    output: 8 000+ SUP/an
  - title: Production de planches SUP
    description: Capacité de production élargie pour les planches SUP utilisant des lignes d’assemblage supplémentaires. Le collage des âmes drop-stitch, l’impression numérique et les postes d’assemblage fonctionnent simultanément.
    output: Capacité SUP étendue
  - title: Planches SUP et accessoires
    description: 'Lignes de production polyvalentes pour planches SUP et accessoires. Postes de soudure à air chaud, presses diélectriques RF et postes d’assemblage sont reconfigurés en fonction du mix de commandes. Capacité annuelle : plus de 5 000 unités.'
    output: 5 000+ unités/an
  - title: Équipements de sécurité
    description: 'Zone de production en salle blanche séparée pour les gilets de sauvetage et les équipements de sécurité. Postes de couture, d’insertion de mousse et de test dédiés. Capacité annuelle de gilets de sauvetage : plus de 50 000 unités.'
    output: 50 000+ gilets/an

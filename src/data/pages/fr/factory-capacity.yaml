intro: afarer exploite l'une des plus grandes installations de fabrication de SUP gonflables dédiées à Qingdao, en Chine. Notre usine de 12 000 m² est organisée en six ateliers spécialisés opérant en parallèle, nous donnant la capacité de produire plus de 15 000 planches par an sur les lignes SUP et équipements de sécurité.

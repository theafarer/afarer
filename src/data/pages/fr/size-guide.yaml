  cards:
    - title: Planches SUP
      description: Choisissez la longueur selon votre poids et votre usage. Les planches plus larges (32"+) offrent plus de stabilité.
    - title: SUP de Randonnée
      description: Les planches plus longues (11–12 ft) sont les meilleures pour couvrir de la distance et la randonnée. Les planches plus larges (32"+) offrent plus de stabilité. Vérifiez la capacité de poids pour la charge totale incluant l’équipement.

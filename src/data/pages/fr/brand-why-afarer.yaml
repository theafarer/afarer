features3_reasons:
  tagline: Why Choose afarer
  title: 'Sept Raisons de Partenariat'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'Nous possédons une usine de 12 000 m². Travaillez directement avec les concepteurs – sans intermédiaires.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Notre conception part du cas d’utilisation, pas de la catégorie.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'CE, ISO, BSCI, REACH, USCG. Chaque produit respecte les normes internationales.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Couleurs, disposition, branding, emballage – nous personnalisons selon vos spécifications.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'Entrepôt US en Californie, expédition directe depuis Qingdao, fret aérien pour urgences.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'Nous supportons les bateaux construits il y a 20 ans. Pièces d’origine, conseils.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Vraies capacités, vraies dimensions, vrai poids. Pas d’inflation marketing.'
      icon: tabler:ruler-measure

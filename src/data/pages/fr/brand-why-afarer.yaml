features3_reasons:
  tagline: Pourquoi Choisir afarer
  title: Sept Raisons de S'associer à Nous
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Véritable Fabrication, Pas du Courtage
      description: Nous possédons et exploitons une usine de 12 000 m². Vous travaillez directement avec les concepteurs et fabricants — sans intermédiaires.
      icon: tabler:building-factory
    - title: 2. Approche Pilotée par l'Ingénierie
      description: Notre processus de conception commence par le cas d'usage, pas par la catégorie de produit.
      icon: tabler:engine
    - title: 3. Qualité Certifiée
      description: Certifié CE, ISO, BSCI, REACH, approuvé USCG. Chaque produit répond aux normes internationales — pas seulement des affirmations.
      icon: tabler:certificate
    - title: 4. Co-Branding Flexible
      description: Couleurs des tubes, disposition de la console, marque, emballage — nous personnalisons selon vos spécifications. Aucune pression de commande minimum. Commencez par un prototype, passez à l'échelle en toute confiance.
      icon: tabler:adjustments
    - title: 5. Logistique Mondiale
      description: Entrepôt US en Californie, expédition directe depuis Qingdao, fret aérien pour les commandes urgentes. Nous gérons les formalités douanières et la documentation.
      icon: tabler:truck-delivery
    - title: 6. Support à Vie
      description: Nous soutenons les bateaux construits il y a 20 ans. Pièces d'origine, conseils techniques, réparations — notre équipe est disponible.
      icon: tabler:lifebuoy
    - title: 7. Spécifications Honnêtes
      description: Vraies capacités, vraies dimensions, vrai poids. Pas d'inflation marketing. Ce que nous publions est ce que vous obtenez — vérifié par des tests indépendants.
      icon: tabler:ruler-measure
testimonials:
  tagline: Approuvé par les Marques du Monde Entier
  title: Ce Que Disent Nos Partenaires
  items:
    - content: Nous avons travaillé avec plusieurs fabricants en Chine, mais afarer se distingue par son support d’ingénierie et sa qualité constante. Ils traitent notre marque comme la leur.
      name: —Partenaire Co-Brand, European Water Sports Brand
    - content: Leurs RIB Hypalon sont en service dans notre flotte depuis plus de 5 ans. Entretien minimal, excellente résistance UV. La garantie de 5 ans sur les tubes nous donne confiance.
      name: —Opérateur de Flotte, Middle East Resort Group
    - content: L'équipe afarer nous a aidés à développer un SUP personnalisé du concept à la production en 90 jours. La qualité a dépassé nos attentes.
      name: —Distributeur, Australian Watersports

services:
  - title: Conception et Ingénierie Produit
    description: Notre équipe R&D interne travaille avec votre concept ou vos spécifications pour développer des dessins CAO, des modèles 3D et des prototypes. Nous proposons la conception de moules, l’optimisation de la forme de coque et des conseils de sélection de matériaux.
  - title: Personnalisation de Marque et Graphismes
    description: Impression numérique couleur, sérigraphie, gaufrage et options d’étiquettes. Nous développons des graphiques de pont spécifiques à la marque, du branding sur tubes et un emballage prêt pour la vente au détail.
  - title: Personnalisation Matériaux et Spécifications
    description: Choisissez parmi PVC (standard, écologique, ignifugé), Hypalon/CSM, drop-stitch et constructions hybrides. Couleurs personnalisées disponibles.
  - title: Emballage et Logistique
    description: Emballage de vente au détail personnalisé, boîtes marque de distributeur, conditionnement sous vide, palettisation et chargement en conteneur. Conditions FOB Qingdao, CIF ou DDP disponibles.

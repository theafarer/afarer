why_us:
  - title: Intégration Verticale
    description: Nous possédons notre usine, nos moules et notre chaîne d’approvisionnement — pas d’intermédiaires, pas de sous-traitants. Cela nous donne le contrôle sur la qualité, les coûts et la livraison.
  - title: Double Certification
    description: Gestion de la qualité ISO 9001 et certification de conformité sociale BSCI. Rapports d’audit d’usine disponibles sur demande.
  - title: Conformité CE
    description: Tous les modèles standard sont certifiés CE 2013/53/UE. Les modèles personnalisés peuvent être certifiés CE via notre processus établi.
  - title: MOQ Bas
    description: Commencez avec seulement 5 unités pour les modèles standard. Nous aidons les marques émergentes à se lancer sans surcharger les stocks.

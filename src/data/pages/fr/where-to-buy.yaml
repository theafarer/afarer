meta:
  title: Où acheter les planches de paddle gonflables Afarer | Afarer
  description: Découvrez comment acheter une planche de paddle gonflable Afarer — via un distributeur officiel dans votre pays ou directement auprès de l'équipe Afarer.
hero:
  tagline: Où acheter
  title: Prenez votre SUP Afarer sur l’eau
  subtitle: Les planches Afarer atteignent des pagayeurs dans plus de 50 pays. Trouvez le moyen le plus simple d'obtenir la vôtre — via un distributeur officiel près de chez vous ou directement auprès de l'équipe Afarer.
channels:
  items:
    - title: Distributeurs officiels par pays
      description: Afarer travaille avec des distributeurs exclusifs dans de nombreux pays. Dites-nous où vous pagayez et nous vous mettrons en relation avec votre revendeur local, ses tarifs et ses disponibilités.
      cta: Trouvez votre revendeur local
      href: /contact/?subject=Where to Buy
    - title: Commande directe auprès d'Afarer
      description: Pas encore de distributeur dans votre pays ? L'équipe Afarer peut organiser des commandes directes et la livraison afin que vous puissiez profiter de l'eau, où que vous viviez.
      cta: Demander la disponibilité
      href: /contact/?subject=Where to Buy
form_intro:
  title: Renseignez-vous sur la disponibilité
  subtitle: Envoyez-nous un message avec votre pays et la planche qui vous intéresse. Notre équipe vous répondra sous un jour ouvré avec votre revendeur le plus proche ou les options de commande directe.
business_note:
  text: Vous achetez pour un club, un resort ou un magasin ? Découvrez nos programmes business et partenariats.
  cta: Pour les partenaires commerciaux
  href: /solutions/

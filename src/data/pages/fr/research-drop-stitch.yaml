content_html: |-
  <h2>Qu'est-ce que le Drop Stitch ?</h2>
  <p>Le drop stitch (ou « tissu à couture tombante ») est une méthode de construction dans laquelle des milliers de fils de polyester individuels relient les couches supérieure et inférieure d'une enveloppe en tissu. Lorsque l'enveloppe est gonflée, ces fils agissent comme des membres de tension internes — ils empêchent les panneaux supérieur et inférieur de se gonfler vers l'extérieur en forme ronde, forçant le panneau à rester plat et rigide.</p>
  <p>Le résultat est une structure légère et portable qui peut supporter 15 – 20 PSI de pression interne — comparable à la rigidité d'une planche à coque rigide mais entièrement dégonflable pour le stockage et le transport.</p>

  <h2>Comment ça marche : La physique</h2>
  <p>Dans une structure gonflable conventionnelle (comme un ballon ou un matelas pneumatique), la pression d'air interne pousse également dans toutes les directions. Sans retenue interne, la structure devient cylindrique ou sphérique. Le drop stitch résout ce problème en introduisant un renfort de tension :</p>
  <ul>
    <li>Des milliers de fils relient les couches de tissu supérieure et inférieure</li>
    <li>Lors du gonflage, la pression d'air tente d'écarter le dessus et le dessous</li>
    <li>Les fils résistent à cette séparation, transférant la charge en tension le long de l'axe du fil</li>
    <li>Le résultat est un panneau plat et rigide qui résiste à la flexion</li>
  </ul>

  <h2>Processus de construction</h2>
  <ol>
    <li><strong>Tissage :</strong> Les fils polyester sont tissés simultanément dans deux couches séparées de tissu de base (généralement du polyester enduit PVC de 1 100 DTEX ou 1 680 DTEX). Les fils sont tissés en boucle entre les couches à un angle de 90&deg;.</li>
    <li><strong>Enduction :</strong> Le tissu de base tissé est enduit de PVC (ou parfois de TPU) par un processus d'enduction au couteau ou au calendrier. Cela scelle les fils et crée la membrane étanche à l'air.</li>
    <li><strong>Liaison des couches :</strong> L'âme drop-stitch est liée aux couches laminées externes (généralement du PVC de 0,9 mm ou 1,2 mm) par thermocollage ou adhésif.</li>
    <li><strong>Soudure :</strong> Les bandes de rail sont soudées le long des bords par soudure à air chaud, soudure RF ou soudure haute fréquence pour créer les parois latérales de la planche.</li>
    <li><strong>Installation des valves :</strong> Des valves Boston ou Halkey-Roberts sont installées, généralement avec un mécanisme de surpression pour éviter le surgonflage.</li>
  </ol>

  <h2>Indicateurs clés de qualité</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Paramètre</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Entrée de gamme</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Densité des fils</td><td class="p-3 border">1 fil / po²</td><td class="p-3 border">2 fils / po²</td></tr>
      <tr><td class="p-3 border">Tissu de base</td><td class="p-3 border">1 100 DTEX</td><td class="p-3 border">1 680 DTEX</td></tr>
      <tr><td class="p-3 border">Pression max</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Épaisseur PVC</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 border">Construction du rail</td><td class="p-3 border">Plissé et collé</td><td class="p-3 border">Soudé et fusionné</td></tr>
    </tbody>
  </table>

  <h2>Applications</h2>
  <ul>
    <li><strong>Planches SUP :</strong> Épaisseur 4–6 po, 15–20 PSI, 1–2 fils/po²</li>
    <li><strong>Kayaks :</strong> Plancher drop-stitch + chambres latérales gonflables, plancher 10–15 PSI</li>
    <li><strong>Planchers RIB :</strong> Planchers drop-stitch pour annexes RIB légères et pliables, 12–18 PSI</li>
    <li><strong>Défenses de bateau :</strong> Drop-stitch basse pression pour défenses profilées à faces plates</li>
  </ul>

  <h2>Drop Stitch vs Plancher Air Deck (âme fibre de verre ou bois)</h2>
  <p>Les planches à coque rigide utilisent des âmes en mousse EPS avec renfort en fibre de verre ou lattes de bois. Elles sont plus légères, plus rigides et plus réactives — mais elles ne peuvent pas être dégonflées. Le drop stitch échange une certaine rigidité contre une portabilité totale. Pour la plupart des utilisateurs récréatifs, les SUP drop-stitch modernes à 20 PSI sont impossibles à distinguer des planches rigides d'entrée de gamme en termes de rigidité.</p>

  <h2>Comment afarer utilise le Drop Stitch</h2>
  <p>Afarer utilise une âme drop-stitch de 1 680 DTEX dans toute sa gamme SUP, avec 2 fils par pouce carré et un laminé PVC externe de 1,2 mm. Les planches sont homologuées à 20 PSI et subissent un test de maintien de pression de 24 heures à 1,5 fois la pression nominale avant expédition. Les bandes de rail sont soudées à l'air chaud avec fusion triple couche, et les valves de surpression sont de série sur tous les modèles.</p>

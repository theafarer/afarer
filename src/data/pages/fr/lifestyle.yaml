meta:
  title: 'Lifestyle — Paddle, Aventure & Exploration | {SITE}'
  description: 'Le style de vie afarer : paddle mer, lac et rivière, SUP voyage et aventure. Inspirez-vous pour vos prochaines sorties nautiques avec un SUP gonflable.'
  keywords:
    - 'paddle lifestyle'
    - 'paddle mer'

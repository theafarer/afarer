hero:
  tagline: Lifestyle
  title: Le Style de Vie<br />afarer
  subtitle: Conçu pour ceux qui vivent sur l'eau — des explorateurs du week-end aux opérateurs professionnels qui dépendent de leur équipement chaque jour.
values:
  - icon: 🌊
    title: Born on the Water
    desc: Chaque conception commence par comprendre le comportement de l'eau. Nous concevons à partir des conditions extrêmes vers l'intérieur — car l'océan est notre professeur, pas notre lieu de travail.
  - icon: 🔧
    title: Built to Last
    desc: Le produit le plus durable est celui qui n'a pas besoin d'être remplacé. Matériaux de qualité marine, âmes drop-stitch évaluées à 15 PSI et joints qui durent plus longtemps que la saison.
  - icon: 🏆
    title: Accessible par Conception
    desc: Les sports nautiques ne devraient pas être un luxe. Des performances de qualité professionnelle à un prix qui a du sens pour les familles, les guides et les petits opérateurs — pas seulement les flottes commerciales.
  - icon: 🌍
    title: Communauté Mondiale
    desc: 'De la côte de Qingdao aux lacs d’Europe, aux rivières d’Asie du Sud-Est et aux baies des Amériques — nos clients partagent une chose : l’amour d’être sur l’eau.'
  - icon: ♻️
    title: Fabrication Responsable
    desc: Le placement optimisé par CNC réduit les déchets de matériaux à moins de 5 %. Une construction durable réduit les cycles de remplacement. Nous construisons pour durer, car c'est le choix le plus durable.
  - icon: 🤝
    title: Un Support Qui Dure
    desc: Des coques de vingt ans nous appellent encore pour des pièces de rechange. Notre réponse de garantie est en moyenne de 24 heures. Nous ne disparaissons pas après la vente — nous sommes là pour la durée de vie du produit.

meta:
  title: 'Académie — Guides SUP & Bateaux Gonflables | {SITE}'
  description: "Centre d'apprentissage afarer : guides du paddle gonflable, techniques de stand up paddle, sécurité nautique et matériaux pour embarqueurs et professionnels."
  keywords:
    - 'apprendre le SUP'
    - 'guide paddle débutant'
    - 'bases du paddle'
    - 'technique paddle'
    - 'cours SUP'
hero:
  tagline: Académie afarer
  title: Centre d'Apprentissage
  subtitle: Guides et tutoriels pour tous les niveaux — des bases du SUP aux techniques de sauvetage avancées
categories:
  - level: Débutant
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: Bases du SUP
        desc: Apprenez les fondamentaux du paddle — posture, technique de pagaie et équilibre.
        slug: sup-basics
      - title: Techniques de pagaie
        desc: Pagaie avant, balayage, traction et appui bas — maîtrisez les mouvements essentiels.
        slug: paddle-techniques
      - title: Sécurité avant tout
        desc: 'Pratiques de sécurité essentielles : vérifications météo, utilisation du gilet, règles de leash et auto-sauvetage.'
        slug: safety-first
  - level: Intermédiaire
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Essentiels du touring
        desc: Planification de pagayages de plusieurs heures — navigation, hydratation, rythme et lecture des prévisions de vent.
        slug: touring-essentials
      - title: Lecture météo
        desc: Interprétez les prévisions marines, identifiez les types de nuages et comprenez les effets du vent sur l'eau.
        slug: weather-reading
      - title: Bases de navigation
        desc: Lecture de cartes, utilisation de la boussole, points GPS et planification d'itinéraires pour le pagayage côtier.
        slug: navigation-basics
      - title: Connaissance des marées
        desc: Comprendre les cycles de marée, les courants et leur impact sur le timing de lancement et l'itinéraire.
        slug: tidal-awareness
  - level: Avancé
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planification de voyages multi-jours
        desc: Logistique d'expédition — sélection d'équipement, planification alimentaire, protocoles de sécurité et contacts d'urgence.
        slug: multi-day-trip-planning
      - title: Techniques de sauvetage
        desc: Auto-sauvetage, sauvetage en T et protocoles de remorquage en eau libre.
        slug: rescue-techniques
      - title: Pagaie nocturne
        desc: Navigation de nuit — exigences d'éclairage, mémoire d'itinéraire, communication de groupe et sensibilisation aux dangers.
        slug: night-paddling
  - level: Entretien
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Nettoyage et entretien
        desc: Rinçage à l'eau douce, protection UV, prévention des moisissures et techniques de séchage après chaque session.
        slug: cleaning-and-care
      - title: Guide de stockage
        desc: Meilleures pratiques de stockage des planches SUP gonflables — dégonflage, pliage, contrôle de la température et durée de vie.
        slug: storage-guide
      - title: Bases de réparation
        desc: Réparation de petites perforations, fuites de joint et problèmes de valve avec kits de réparation PVC.
        slug: repair-basics
      - title: Entretien des valves
        desc: Identifier les types de valves, nettoyer les débris et remplacer les tiges défectueuses.
        slug: valve-maintenance
knowledge_center_tagline: Centre de Connaissances
knowledge_center_title: Guides équipement marin et industrie
knowledge_center_subtitle: Connaissances expertes et guides d'achat pour professionnels marins, opérateurs de flottes et amateurs de sports nautiques.
knowledge_sections:
  - title: Connaissance des planches SUP
    tagline: Guides de planches à pagaie
    desc: Tout sur les planches SUP — design, matériaux, sélection de taille, entretien et conseils d'achat pour usage récréatif et commercial.
    guides:
      - title: Comment choisir la bonne planche SUP ?
        desc: Guide complet pour choisir un SUP — taille, volume, matériau, forme et usage prévu.
        href: /learn/sup
      - title: SUP gonflable vs rigide
        desc: SUP gonflable vs planche époxy rigide — portabilité, durabilité, performance et rapport qualité-prix.
        href: /compare/inflatable-vs-hardboard
      - title: SUP polyvalent vs touring vs yoga
        desc: Différents types de planches SUP — normes de construction, formes, tailles et usages recommandés.
        href: /learn/sup
      - title: Drop-Stitch vs construction traditionnelle
        desc: Comparez la construction drop-stitch et traditionnelle pour les planches SUP en termes de poids, coût, durabilité et rigidité.
        href: /learn/drop-stitch-core
  - title: Guide SUP gonflable
    tagline: Connaissances SUP gonflable
    desc: Guides complets sur les SUP gonflables — matériaux PVC, construction drop-stitch, normes de sécurité et meilleures pratiques d'entretien.
    guides:
      - title: Guide des Matériaux PVC
        desc: Guide définitif des matériaux PVC utilisés dans la construction des planches SUP gonflables.
        href: /learn/materials
      - title: Comment les SUP gonflables sont fabriqués
        desc: Processus de fabrication — découpe des matériaux, assemblage du cœur drop-stitch, construction des joints, test de pression et contrôle qualité.
        href: /learn/inflatable-technology
      - title: Guide sécurité SUP
        desc: Normes de sécurité, capacité de charge, gonflage correct, vérifications avant départ et procédures d'urgence.
        href: /learn/water-safety
      - title: Entretien SUP
        desc: Nettoyage, stockage, protection UV et réparation des planches SUP gonflables.
        href: /inflatable-sup-maintenance
  - title: Connaissance des planches SUP
    tagline: Centre SUP
    desc: Guides techniques couvrant les types de planches SUP, matériaux, méthodes de construction, entretien et sécurité.
    guides:
      - title: Types de planches SUP
        desc: SUP tout-terrain, touring, yoga, sport et enfants — apprenez les différences et choisissez le bon.
        href: /learn/sup
      - title: Technologie Drop-Stitch
        desc: Comment des milliers de fils internes créent des structures gonflables rigides à haute pression.
        href: /learn/drop-stitch-core
      - title: Référence des Matériaux
        desc: Indices denier PVC, poids des tissus, résistance UV et matériaux qualité marine expliqués.
        href: /learn/materials
      - title: Guide d'achat SUP
        desc: Comparez différents types de planches SUP pour différents cas d'usage et niveaux de compétence.
        href: /learn/sup
  - title: Connaissances SUP
    tagline: Guides de planches à pagaie
    desc: Tout sur les planches SUP — gonflable vs rigide, dimensions, technologie des matériaux et conseils d'experts.
    guides:
      - title: SUP gonflable vs rigide
        desc: Comparez les iSUP et les planches epoxy dures en termes de portabilité, durabilité, performance et valeur.
        href: /learn/sup
      - title: Guide des Dimensions de Planches SUP
        desc: Comment la longueur, la largeur et l'épaisseur affectent la stabilité, la vitesse et la maniabilité.
        href: /learn/sup
      - title: Entretien et Soin des SUP
        desc: Conseils de nettoyage, stockage, protection UV et réparation pour planches SUP gonflables.
        href: /inflatable-sup-maintenance
      - title: Choisir Votre Premier SUP
        desc: Guide du débutant pour choisir la planche de paddle adaptée à votre poids, niveau et usage.
        href: /learn/sup
  - title: Guide des Opérations de Location
    tagline: Gestion de flotte pour locations
    desc: Guides pour constituer et gérer des flottes SUP de location pour kiosques de plage, centres nautiques et hôtellerie.
    guides:
      - title: Construire votre flotte de location
        desc: Comment choisir les planches SUP pour votre activité de location — durabilité, taille et considérations de ROI.
        href: /solutions/rental-operators
      - title: Guide d'entretien de flotte
        desc: Pratiques d'entretien essentielles pour maximiser la durée de vie et minimiser les temps d'arrêt.
        href: /solutions/rental-operators
  - title: Guide pour Complexes et Hôtellerie
    tagline: Activités Nautiques pour l'Hôtellerie
    desc: Guides pour lancer et gérer des programmes SUP dans les complexes, hôtels et destinations balnéaires.
    guides:
      - title: Lancer un Programme SUP en Complexe
        desc: Facteurs à considérer pour lancer des activités SUP — taille de flotte, personnel et modélisation des revenus.
        href: /solutions/resorts-hotels
      - title: SUP vs Autres Activités Nautiques
        desc: Comparez les programmes SUP avec d'autres sports nautiques pour l'expérience client et l'efficacité opérationnelle.
        href: /learn/sup
  - title: Guide de Vente au Détail et Distribution
    tagline: Partenariats commerciaux SUP
    desc: Guides pour devenir partenaire de vente au détail ou distributeur SUP — planification des stocks, positionnement et stratégies de croissance.
    guides:
      - title: Devenir Détaillant SUP
        desc: Comment choisir les gammes de produits, gérer les stocks et commercialiser les planches SUP dans votre magasin.
        href: /solutions/retail-partners
      - title: SUP pour Opérations Commerciales
        desc: Pourquoi les SUP gonflables sont un produit polyvalent pour les flottes commerciales et les opérateurs professionnels.
        href: /use-cases/search-and-rescue

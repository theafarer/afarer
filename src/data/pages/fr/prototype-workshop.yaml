intro: Un modèle CAO, aussi détaillé soit-il, ne peut révéler comment un bateau se comportera vraiment sur l'eau. C'est pourquoi notre Atelier de Prototypage traduit les données d'ingénierie en un navire physique le plus rapidement possible. Chaque nouveau modèle {SITE.name} — et chaque construction personnalisée — passe par cet atelier.
content_html: |-
  <h2>Là où le design devient réalité</h2>
  <p>Notre atelier est entièrement équipé pour la fabrication simultanée de coques, tubes et accessoires. Des machines de découpe CNC aux postes de soudage RF, chaque étape est réalisée par des techniciens qualifiés avec des années d'expérience.</p>

  <h2>Capacités</h2>
  <ul>
    <li>Découpe CNC de tissus et films PVC</li>
    <li>Soudure RF sur presses diélectriques 15 kW</li>
    <li>Soudure à air chaud et thermocollage</li>
    <li>Assemblage manuel et collage de précision</li>
    <li>Tests d'étanchéité 100 % à 1,5x la pression nominale</li>
  </ul>

  <h2>Prototypage rapide</h2>
  <p>Nous pouvons produire des prototypes fonctionnels en 2–3 semaines, permettant aux clients d'évaluer la conception avant l'engagement en production. Notre processus itératif garantit que le produit final répond exactement aux spécifications.</p>

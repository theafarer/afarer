meta:
  title: 'Équipements — Découpe, Soudure RF & Impression | {SITE}'
  description: 'Équipements et machines de fabrication afarer : découpe PVC, soudure RF, impression numérique, assemblage et tests pour SUP gonflables et bateaux.'
  keywords:
    - 'équipement fabrication SUP'
    - 'usine paddle gonflable'
    - 'machine soudure PVC'
    - 'production paddle gonflable'
hero:
  tagline: Équipement
  title: Équipements et Machines de Fabrication
  subtitle: Équipement de qualité industrielle pour la découpe, soudure, impression et assemblage
  back_label: Retour à l'Usine
  back_link: /factory
categories:
  - title: Découpe et Préparation des Matériaux
    items:
      - name: Machine de découpe PVC automatique
        spec: Contrôle CNC, 6,5 m × 2,5 m, précision 0,1 mm
        desc: Machine de découpe automatique commandée par ordinateur pour tissus PVC, Hypalon et drop-stitch. Le logiciel de nesting optimise l’utilisation des matériaux à moins de 5 % de déchets.
      - name: Étaloir de Tissu
        spec: 3 m de largeur max, alimentation à tension contrôlée
        desc: Dispose le tissu en une ou plusieurs couches avec une tension contrôlée pour éviter la déformation avant la découpe.
  - title: Soudure et Assemblage de Tubes
    items:
      - name: Machine de thermoscellage
        spec: Soudure à air chaud, variable 200–600 °C, 0,5–4 m/min
        desc: Machine de thermosoudure à air chaud pour le collage et la soudure des joints de tubes PVC et Hypalon. Utilisée pour le pointage, le scellement et la fusion des chambres de tubes et des joints de flotteurs.
      - name: Presse Diélectrique RF
        spec: 15 kW, plateau 2000 × 600 mm
        desc: Presse de soudure radiofréquence pour les joints longitudinaux principaux, les joints tableau-arrière/tubes et la fabrication de grandes chambres.
      - name: Soudeuse RF à Commande CNC
        spec: 8 kW, table XY 2500 × 1200 mm
        desc: Soudure programmable de joints courbes pour géométries complexes, gaufrage de logo et patchwork de précision.
  - title: Fabrication de planches SUP
    items:
      - name: Presse de laminage cœur drop-stitch
        spec: Presse grand format pour âmes de planches jusqu’à 14 ft LOA
        desc: Laminage de précision des âmes drop-stitch sur les stratifiés PVC externes. Chaque couche est liée sous pression pour une qualité et une résistance constantes.
      - name: Défonceuse CNC (5 axes)
        spec: 3 m × 2 m × 1 m enveloppe, broche refroidie par eau
        desc: Usinage de boîtiers d’ailerons, découpes de poignées et composants de planches personnalisés.
  - title: Impression et Décoration SUP
    items:
      - name: Imprimante numérique
        spec: Jet d'encre haute résolution, jusqu'à 2 m de largeur
        desc: Impression numérique directe sur tissu pour graphismes SUP couleur. Prints custom patterns, gradients, and photo-quality images with UV-resistantwater-based inks.
      - name: Machine de sérigraphie
        spec: Manuel et semi-automatique, registration multicolore
        desc: Sérigraphie pour logos de planches SUP, marques de fabrique et motifs répétés. Fournit des impressions durables et opaques avec une saturation de couleur vibrante.
  - title: Assemblage et gréement
    items:
      - name: Poste d'Assemblage de Planches
        spec: Disposition modulaire ajustable multi-postes
        desc: Assemblage des boîtiers d'aileron, poignées, anneaux en D, valves et pads de pont sur les planches SUP.
      - name: Presse d'Installation de Valve
        spec: Pneumatique, pression ajustable
        desc: Installation de précision et étanchéité des valves Halkey-Roberts et Leafield.
      - name: Lamineur de Pad de Pont
        spec: 3 m × 1,5 m, température contrôlée
        desc: Laminage thermique des pads de pont en mousse EVA sur le dessus des SUP avec une force de liaison constante.
  - title: Tests et Contrôle Qualité
    items:
      - name: Testeur de Traction Universel
        spec: 50 kN, ASTM D751
        desc: Test de force de rupture, d'allongement et de propagation de déchirure pour les lots de tissu.
      - name: Banc de Test de Rétention d'Air
        spec: Programmable, maintien de pression 30 min
        desc: Test de maintien de pression automatisé pour chaque chambre avant assemblage.
      - name: Testeur de Pelage des Joints
        spec: Pelage motorisé à 180° à 100 mm/min
        desc: Test de résistance au pelage des soudures et des joints collés selon ISO 6185.
      - name: Chambre de Vieillissement au Xénon
        spec: Exposition 2000 h
        desc: Test de résistance UV pour le changement de couleur et le maintien de la résistance.

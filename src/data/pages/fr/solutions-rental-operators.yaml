meta:
  title: 'Location SUP — Flottes Professionnelles | {SITE}'
  description: 'Planches SUP haute rotation pour la location quotidienne : PVC résistant aux UV, coutures renforcées, matériaux à séchage rapide. Flottes pour loueurs professionnels.'
  keywords:
    - 'paddle pour location professionnelle'
    - 'flotte SUP location'
    - 'fournisseur paddle location'
    - 'SUP location'
hero:
  tagline: Opérateurs de Location
  title: Développez Votre Activité de Location<br />En Toute Confiance
  subtitle: Planches SUP haut-rotation conçues pour l'utilisation locative quotidienne, 365 jours par an. Vos revenus ne prennent jamais de repos.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Busy rental kiosk with SUP boards ready for guests
features:
  title: Conçu pour la Location Intensive
  subtitle: Chaque planche est conçue pour 500+ cycles de location avec un entretien minimal.
  items:
    - title: 500+ Cycles de Location
      description: Testée pour résister à l'utilisation quotidienne en eau salée, soleil et sable.
      icon: tabler:shield-check
    - title: Tissu Résistant aux UV
      description: Aucune décoloration ou dégradation après 1 an de stockage extérieur.
      icon: tabler:sun
    - title: Joints Renforcés
      description: 3x plus résistant que la construction standard de planche gonflable.
      icon: tabler:layers-intersect
    - title: Matériaux à Séchage Rapide
      description: Planches prêtes pour la prochaine location en moins de 30 minutes.
      icon: tabler:droplet
    - title: Rangement Empilable
      description: Design gain de place — stockez 40 % de planches supplémentaires dans la même zone.
      icon: tabler:stack
    - title: Tailles Codées par Couleur
      description: Le personnel saisit la bonne planche instantanément grâce au code couleur des tailles.
      icon: tabler:color-swatch
stats:
  title: Métriques Opérationnelles
  stats:
    - title: Renouvellement des Planches
      amount: < 5 min
    - title: Entretien Annuel
      amount: ~15 min/planche
    - title: Expédition des Pièces
      amount: 48h
    - title: Taux de Défauts
      amount: < 0,5 %
fleet_guide:
  title: Guide de dimensionnement de flotte
  subtitle: Estimez la taille de la flotte et le potentiel de revenus pour votre activité de location.
  tiers:
    - label: Petit Kiosque
      boards: 15-20
      revenue: $XX XXX/an
    - label: Opération Moyenne
      boards: 30-50
      revenue: $XX XXX/an
    - label: Grande Location de Plage
      boards: 50-100
      revenue: $XXX XXX/an
cta:
  title: Prêt à développer votre activité de location ?
  subtitle: Obtenez des tarifs de location ou comparez les modèles de planches pour votre activité.
  actions:

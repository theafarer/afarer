  services:
    - title: Développement de Matériaux Personnalisés
      desc: Nous développons des formulations de tissu personnalisées, des empilements de stratifiés et des systèmes adhésifs adaptés à votre environnement d’exploitation et à vos objectifs de performance.
    - title: Ingénierie Produit OEM/ODM

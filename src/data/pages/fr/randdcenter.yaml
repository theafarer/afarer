vision:
  tagline: Notre Vision
  title: Façonner l'Avenir des Sports Nautiques
  body: afarer s'efforce de mener l'industrie des bateaux gonflables et SUP grâce à une innovation continue, une qualité inébranlable et un engagement ferme envers la sécurité et la durabilité — enrichissant finalement les expériences des passionnés de sports nautiques dans le monde entier. Le Centre R&D afarer est là où la passion rencontre l'innovation, établissant de nouvelles normes pour l'industrie des sports nautiques.
labs_section:
  tagline: Labs
  title: Nos Laboratoires
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: Laboratoire Tissu PVC
      description: Recherche et tests continus des tissus de tubes PVC et Hypalon pour la résistance à la traction, la résistance UV, l’abrasion et la flexibilité à basse température pour garantir une fiabilité à long terme dans les environnements marins.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Studio d'ingénierie de coque
      description: Conception assistée par CAO et analyse par éléments finis of HDPE, aluminum, and fiberglass hulls. Every hull is digitally simulated for stress distribution and impact resistance before the first prototype is built.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: Centre de Soudure RF
      description: Installation de soudure radiofréquence dédiée avec contrôle précis de la température et de la pression, produisant des joints étanches à haute résistance qui répondent aux normes de l’industrie maritime pour les embarcations gonflables.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Bassin d'Essais Hydrodynamiques
      description: Tests sur modèles réduits dans notre bassin d’essais interne pour optimiser la forme de coque, les performances de déjaugeage, la stabilité et l’efficacité énergétique dans une gamme de conditions de charge et de mer.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Atelier de Prototypage
      description: Installation de prototypage et de gréement grandeur nature où les nouveaux modèles sont construits, équipés et testés en mer. Chaque prototype subit un programme de test en eau d’au moins 20 heures avant l’approbation de production.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Laboratoire Qualité et Inspection
      description: Laboratoire d’assurance qualité dédié effectuant des tests de traction, des cycles de rétention d’air, des tests de pelage des joints et la certification des matériaux pour garantir que chaque bateau quittant l’atelier répond à nos spécifications publiées.
      href: /randdcenter/quality-inspection-lab

meta:
  title: Centre R&D | {SITE}
  description: Recherche et Développement — tests de tissu PVC, ingénierie de coque, soudure RF, tests hydrodynamiques et contrôle qualité. Services R&D personnalisés disponibles.
hero:
  tagline: Centre R&D
  title: Centre R & D
  subtitle: Axé sur le Progrès
intro:
  - 'Le Centre de Recherche et Développement (R&D) d''afarer est le moteur de notre mission : révolutionner les équipements de sports nautiques grâce à la science des matériaux, l''ingénierie structurelle et la recherche hydrodynamique.'
  - Notre installation R&D rassemble des scientifiques des matériaux, des architectes navals et des ingénieurs de production sous un même toit. De la formulation des tissus et de la simulation de coque au développement des processus de soudure et aux essais en mer grandeur nature, chaque étape du développement de produit est guidée par les données et validée par des tests.
mission:
  tagline: Notre Mission
  title: Innover l'Avenir des Sports Nautiques
  pillars:
    - icon: lightning
      title: Avancée Technologique
      desc: Pionnier des nouveaux matériaux, designs et fabrications pour des performances et une longévité supérieures.
    - icon: design
      title: Conception Centrée sur l'Utilisateur
      desc: Comprendre et dépasser les besoins des utilisateurs par un design ergonomique et intuitif.
    - icon: globe
      title: Pratiques Durables
      desc: Minimiser notre empreinte environnementale en utilisant des matériaux et procédés écologiques.
    - icon: shield
      title: Sécurité Sans Compromis
      desc: Assurer les plus hauts standards de sécurité grâce à des tests rigoureux et une certification.
pillars:
  - title: Avancée Technologique
    desc: Pionnier des matériaux, designs et procédés de fabrication pour des performances supérieures.
    icon: tech
  - title: Matériaux Avancés
    desc: Recherche sur le PVC, Hypalon, composites et alternatives durables pour des caractéristiques améliorées.
    icon: Matériaux
  - title: Durabilité
    desc: 'Un engagement central : nous sommes dédiés à la gestion environnementale par une fabrication durable.'
    icon: sustainability
capabilities:
  tagline: Capacités
  title: Capacités R&D
  subtitle: Quatre disciplines principales qui nous donnent un contrôle de bout en bout sur le développement des produits — de la recherche sur les matières premières à la certification finale.
  groups:
    - title: Science des Matériaux et Technologie des Tissus
      items:
        - Analyse et optimisation des formulations PVC et Hypalon
        - Stabilisation UV, ignifugation et développement d’additifs antimicrobiens
        - Ingénierie de laminage et d’adhésion de tissus multicouches
        - Test de vieillissement accéléré (UV, thermique, humidité, brouillard salin)
    - title: Ingénierie de Coque et Hydrodynamique
      items:
        - Conception paramétrique 3D de coque et optimisation CFD
        - Analyse par éléments finis pour les charges structurelles et d'impact
        - Essais de remorquage sur modèle réduit et validation des performances
        - Développement de coque personnalisé pour missions spéciales
    - title: Technologie de Soudure et Assemblage
      items:
        - Développement et optimisation du processus de soudure diélectrique RF
        - Méthodes de soudure à air chaud, à coin chaud et par ultrasons
        - Qualification des collages et des bandes de joint
        - Modélisation de la résistance de la soudure et prévision de la durée de vie
    - title: Tests, Certification et Conformité
      items:
        - Gestion de la qualité et tests de conformité CE
        - Support de tests et certification par tiers indépendant
        - Développement de protocole de test personnalisé pour qualification d'achat
        - Analyse de défaillance en service et investigation des causes profondes

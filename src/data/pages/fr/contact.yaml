meta:
  title: 'Contact — Demandes de Partenariat & Produits | {SITE}'
  description: 'Contactez afarer pour une demande de partenariat, de co-brand ou de marque privée, ou pour une flotte professionnelle. Fabricant de SUP gonflables et bateaux pneumatiques.'
  keywords:
    - 'contacter afarer'
    - 'devis distributeur SUP'
    - 'fournisseur SUP professionnel'
    - 'contact fabricant paddle'
hero_text:
  tagline: Contact
  title: PRENEZ CONTACT
contact_form:
  id: form
  title: Envoyez-nous un message
  subtitle: Pour les devis, questions techniques ou demandes de partenariat, écrivez-nous. Nous répondons sous un jour ouvré.
  email_to: info@afarer.com
  submit_button: Envoyer une Demande → Obtenir un Devis
  success_message: Merci ! Votre message a bien été reçu. Nous répondons sous un jour ouvré.
  error_message: Une erreur s'est produite. Veuillez réessayer ou nous envoyer un email directement.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam : veuillez résoudre'
  fields:
    - name: country
      label: Pays
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: Volume de Commande Estimé
      row: 2
      type: select
      options:
        - value: ''
          label: Sélectionnez votre volume estimé...
        - value: sample
          label: Échantillons / Prototypes uniquement
        - value: '5-10'
          label: 5–10 unités (MOQ Standard)
        - value: '100-500'
          label: 100–500 unités
        - value: '500-plus'
          label: 500+ unités (Tarifs dégressifs)
      step: 1
    - name: customization
      label: Personnalisation nécessaire ?
      row: 3
      type: select
      options:
        - value: ''
          label: Sélectionnez le type de personnalisation...
        - value: none
          label: Produit standard (sans personnalisation)
        - value: logo
          label: Logo personnalisé / Marquage uniquement
        - value: full
          label: Co-Brand Complet (taille, couleur, graphismes, emballage)
        - value: consultation
          label: Pas sûr — besoin de conseil
      step: 1
    - name: productInterest
      label: "Catégories de Produits d'Intérêt"
      row: 4
      type: select
      options:
        - value: ''
          label: Sélectionnez une catégorie...
        - value: all
          label: Tous les produits / Catalogue complet
        - value: sup
          label: SUP / Planches à pagaie
        - value: safety
          label: Équipement de Sécurité / Gilets
        - value: accessory
          label: Accessoires (pompes, pagaies, sacs)
      step: 1
    - name: firstName
      label: Prénom
      row: 1
      step: 2
    - name: lastName
      label: Nom
      row: 1
      step: 2
    - name: companyName
      label: "Nom de l'entreprise"
      row: 2
      step: 2
    - name: email
      label: E-mail
      row: 3
      type: email
      step: 2
    - name: tel
      label: TEL
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: Adresse
      row: 4
      step: 2
    - name: zip
      label: Code Postal
      row: 5
      step: 2
    - name: subject
      label: Sujet
      row: 1
      step: 3
    - name: message
      label: Message
      row: 2
      type: textarea
      rows: 6
      step: 3

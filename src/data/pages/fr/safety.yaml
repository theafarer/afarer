hero:
  tagline: Sécurité
  title: Normes et certification de sécurité
  subtitle: Chaque produit afarer subit des tests rigoureux et répond aux normes de sécurité internationales pour un usage récréatif et professionnel.

certifications:
  - title: Certification CE
    description: Tous les équipements de sécurité afarer sont conformes aux exigences de marquage CE du règlement européen sur les équipements de protection individuelle (UE) 2016/425.
  - title:
    description: Les gilets de sauvetage répondent aux normes de flottaison . Le Life Vest Classic offre une flottabilité de 50N+ ; le Life Vest Pro répond aux exigences SOLAS avec gonflage automatique.
  - title: Conformité SOLAS
    description: Le Life Vest Pro est conforme aux réglementations SOLAS (Sécurité de la vie en mer) pour les opérations maritimes offshore et commerciales.


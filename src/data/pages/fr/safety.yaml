hero:
  tagline: Sécurité
  title: Normes de Sécurité et Certification
  subtitle: Chaque produit afarer subit des tests rigoureux and meets international safety standards for recreational and professional use.
certifications:
  - title: Certification CE
    description: Tout l'équipement de sécurité afarer est conforme au Règlement européen sur les Équipements de Protection Individuelle (UE) 2016/425.
  - title: Certification ISO 12402
    description: Les gilets de sauvetage répondent aux normes de flottabilité ISO 12402. Le Life Vest Classic offre une flottabilité de 50N+ ; le Life Vest Pro répond aux exigences SOLAS avec gonflage automatique.
  - title: Conformité SOLAS
    description: Le Life Vest Pro est conforme aux règlements SOLAS (Sécurité de la Vie en Mer) pour les opérations marines offshore et commerciales.

  title: Fabricant Premium de SUP Gonflables<br />&amp; Partenaire OEM
  subtitle: |
    Conception et fabrication de planches de paddle gonflables pour les marques mondiales,<br />les complexes hôteliers, les clubs de paddle et les entreprises d'aventures nautiques.<br />Partenaire OEM/ODM avec une installation de 12 000 m² et une production certifiée CE.
  taglineSection: Solutions SUP gonflables de qualité commerciale pour complexes, clubs, détaillants et marques nautiques.
  actions:
    - variant: primary
      text: Demander un devis OEM
      href: /oem-odm-manufacturer
      icon: tabler:package
    - text: Télécharger le catalogue
      href: /resources/download-catalog
      icon: tabler:file-text
    - text: Explorer les solutions SUP

distributor:
  tagline: Distributeurs Exclusifs Pays
  title: Un pays. Un distributeur officiel Afarer.
  subtitle: Un programme avec un distributeur par pays, incluant exclusivité territoriale, tarifs revendeur, support marketing et un programme de réussite distributeur dédié.
  benefits:
    - title: Exclusivité Territoriale
      description: Un distributeur agréé par pays ou région — aucune concurrence interne, aucun conflit de canal.
    - title: Marges Directes Usine
      description: Listes de prix distributeur et remises annuelles sur volumes engagés, expédiés FOB Qingdao.
    - title: 'Support Marketing & Formation'
      description: Supports co-marqués, matériel POS revendeur, formations produit et campagnes de lancement.
    - title: Équipe Compte Dédiée
      description: Un responsable distributeur personnel plus un support d’intégration, de prévision et de réapprovisionnement.
  actions:
    - variant: primary
      text: Devenir Distributeur
      href: /distributor-program
    - text: Demander la Liste de Prix Revendeur
      href: /contact?subject=Dealer Price List
    - text: Postuler pour un Partenariat Pays
      href: /contact?subject=Country Partnership Application
    - text: Télécharger le Programme Distributeur
      href: /distributor-program
  note: Commandes d’échantillons de 5–10 unités. Commandes d’essai de 10–30. Revendeur agréé de 30–50. Distributeur Pays/Région de 100–300+.

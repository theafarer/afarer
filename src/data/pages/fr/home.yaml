business_solutions:
  tagline: Notre accompagnement
  title: Votre partenaire du concept au chiffre d'affaires
  subtitle: Quatre capacités clés qui aident les entreprises nautiques à lancer, opérer et se développer.
  items:
    - title: Équipement professionnel
      description: Planches SUP qualité commerciale conçues pour location quotidienne, 500+ cycles avec entretien minimal.
      icon: tabler:shield-check
    - title: Fabrication OEM
      description: Production marque blanche complète de la conception au prototypage jusqu'à la production de masse et la livraison mondiale.
      icon: tabler:package
    - title: Soutien commercial
      description: Formation du personnel, matériel marketing, programmes pièces de rechange et gestion de compte dédiée.
      icon: tabler:headset
    - title: Logistique mondiale
      description: FOB Qingdao, CIF ports principaux, livraison porte-à-porte dans 50+ pays avec assistance douanière.
      icon: tabler:truck-delivery
oem_section:
  tagline: Lancez votre marque
  title: De l'idée au marché en 16 semaines
  subtitle: Votre partenaire complet pour le lancement de marque SUP — conception, prototype, fabrication et expédition.
  steps:
    - number: '01'
      title: Idée & cahier des charges
      desc: Partagez votre vision, votre marché cible et vos spécifications.
    - number: '02'
      title: Conception & ingénierie
      desc: Modélisation 3D, sélection des matériaux et conception graphique personnalisée.
    - number: '03'
      title: Prototype & validation
      desc: Production d'échantillons avec certification CE et tests de qualité.
    - number: '04'
      title: Production de masse
      desc: Fabrication à grande échelle avec contrôle qualité en ligne et assistance aux audits d'usine.
    - number: '05'
      title: Livraison mondiale
      desc: Logistique FOB Qingdao, CIF ports principaux, porte-à-porte.
  cta: Commencez votre aventure de marque
  cta_link: /oem-odm-manufacturer
cta:
  title: Prêt à développer votre entreprise d'aventures nautiques ?
  subtitle: Que vous lanciez un club, équipiez un complexe ou construisiez une marque — nous sommes là pour vous aider.
  actions:
    - variant: primary
      text: Démarrer votre projet
      href: /contact
      icon: tabler:send
    - text: Télécharger le guide OEM
      href: /resources/download-catalog

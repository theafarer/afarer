meta:
  title: 'Planches de SUP Gonflables Haute Performance — Afarer Water Sports | {SITE}'
  description: 'Afarer conçoit des SUP gonflables haute performance pour le large, le touring, le yoga et l’aventure. Rigidité drop-stitch, planches testées sous pression une par une, avec des partenariats pays exclusifs et des collections co-brandées limitées. Découvrez la collection.'
  keywords:
    - 'SUP gonflable haute performance'
    - 'paddle gonflable premium'
    - 'marque de SUP gonflable'
    - 'SUP gonflable touring'
    - 'paddle co-brandé'
    - 'distributeur SUP par pays'
hero:
  tagline: Planches de SUP Gonflables Haute Performance
  title: Allez plus loin.<br />Ridez plus fort.
  subtitle: |
    Des SUP gonflables haute performance conçus pour le large, les longues journées,<br />
    et la liberté d'explorer — stables quand c'est important,<br />
    rigides sous pression, et prêts pour des eaux changeantes.
  taglineSection: Solutions SUP gonflables de qualité commerciale pour complexes, clubs, détaillants et marques nautiques.
  actions:
    - variant: primary
      text: Explorer les planches
      href: /inflatable-sup
      icon: tabler:waves
    - text: Télécharger le catalogue
      href: /resources/download-catalog
      icon: tabler:file-text
    - text: Explorer les solutions SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: Planches SUP gonflables afarer au bord d'un complexe tropical — flotte commerciale pour entreprises nautiques

  image:
    src: ~/assets/images/hero-image.webp
    alt: Planches SUP gonflables afarer au bord d'un complexe tropical — flotte commerciale pour entreprises nautiques
who_we_serve:
  tagline: Notre clientèle
  title: Des solutions SUP complètes pour chaque entreprise nautique
  subtitle: Équipements sur mesure, fabrication et soutien commercial pour quatre marchés clés.
  items:
    - title: Clubs de paddle
      keywords: Équipement pour clubs SUP, écoles de paddle, flottes de location
      description: Flottes SUP durables, tarifs clubs et programmes de pièces de rechange pour clubs et écoles de paddle.
      icon: tabler:users
      cta: Explorer les solutions pour clubs
      link: /solutions/paddle-clubs
    - title: Complexes et hôtels
      keywords: activités nautiques en complexe, équipement de plage hôtelier, expérience client
      description: Programmes complets de flottes SUP avec marque personnalisée, formation du personnel et forfaits optimisés ROI.
      icon: tabler:building
      cta: Créer votre expérience nautique
      link: /solutions/resorts-hotels
    - title: Partenaires de vente au détail
      keywords: Vente en gros SUP, magasins de plein air, articles de sport
      description: Gamme complète, matériel marketing, options de dropshipping et marges de gros compétitives.
      icon: tabler:shopping-cart
      cta: Devenir partenaire de vente
      link: /solutions/retail-partners
    - title: Nouvelles marques SUP
      keywords: SUP marque blanche, marque SUP personnalisée, planches OEM
      description: Fabrication OEM/ODM complète — conception, prototypage, production de masse et logistique mondiale.
      icon: tabler:package
      cta: Construire votre marque SUP
      link: /oem-odm-manufacturer
proof_points:
  title: Approuvé par les entreprises nautiques du monde entier

philosophy:
  tagline: Design Philosophy
  title: 'Conception Axée sur l’Ingénierie<br />—Chaque Détail Compte'
  subtitle: 'Notre philosophie d’ingénierie repose sur trois principes directeurs.'
  list:
    - 'Fiabilité d’abord : chaque produit afarer est testé pour résister aux conditions réelles'
    - 'Précision de fabrication : nos installations utilisent la découpe CNC, le soudage haute fréquence'
    - 'Innovation continue : notre équipe R&D évalue les nouveaux matériaux, méthodes de production et designs'

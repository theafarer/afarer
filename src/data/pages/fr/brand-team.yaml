hero:
  tagline: Our Team
  title: 'Les Personnes Derrière afarer<br />—L’Ingénierie de la Liberté'
  subtitle: 'Fondé en 2012 à Qingdao, en Chine, afarer a été construit par des ingénieurs marins, des scientifiques des matériaux'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'D’un Atelier Côtier<br />à une Installation de 12 000 m²'
  subtitle: 'afarer a été fondé par une équipe d’ingénieurs maritimes avec des décennies d’expérience.'
  items:
    - title: 'Founded: 2012'
      description: 'Établi à Qingdao, Chine – un pôle maritime majeur.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'Dont 50+ ingénieurs R&D, spécialistes CQ et techniciens.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Usine dédiée avec 6 lignes de production pour SUP, pneumatiques et SUP.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Exportation vers Europe, Amériques, Moyen-Orient, Asie-Pacifique et Afrique.'
      icon: tabler:globe
leadership:
  tagline: Leadership
  title: 'Direction & Leadership Technique'
  subtitle: 'Notre équipe de direction réunit une expertise approfondie en ingénierie maritime, commerce international et management de la qualité.'

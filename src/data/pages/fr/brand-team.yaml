meta:
  title: 'Notre Équipe — Ingénieurs & Fabricants Nautiques | {SITE}'
  description: "Rencontrez l'équipe d'ingénieurs et de spécialistes derrière afarer : R&D, usine, contrôle qualité et support client pour fabricant de SUP et bateaux gonflables."
  keywords:
    - 'équipe afarer'
    - 'ingénieurs marine'
    - 'fabricant SUP gonflable'
    - 'équipe R&D nautique'
hero:
  tagline: Notre équipe
  title: Les Personnes Derrière afarer<br />— L'ingénierie de la Liberté sur l'Eau
  subtitle: Fondé en 2012 à Qingdao, en Chine, afarer a été construit par des ingénieurs marins, des scientifiques des matériaux et des passionnés de sports nautiques qui croyaient en la possibilité de rendre les embarcations gonflables de qualité professionnelle accessibles dans le monde entier.
  image:
    src: /images/team-all.webp
    alt: Photo de toute l’équipe afarer — ingénierie, production et direction
founding:
  tagline: Notre Fondation
  title: D'un Atelier Côtier<br />à une Installation de 12 000 m²
  subtitle: afarer a été fondée par une équipe d'ingénieurs marins avec des décennies d'expérience combinée dans la conception de bateaux gonflables, la fabrication PVC/Hypalon et la fabrication mondiale d'équipements marins.
  items:
    - title: 'Fondé : 2012'
      description: Établi à Qingdao, Chine — un pôle maritime majeur avec un riche héritage de construction navale.
      icon: tabler:calendar
    - title: 200+ Employés
      description: Incluant plus de 50 ingénieurs R&D, spécialistes du contrôle qualité et techniciens de production.
      icon: tabler:users
    - title: Installation de 12 000 m²
      description: Usine de fabrication dédiée avec 6 lignes de production pour RIB, bateaux gonflables et planches SUP.
      icon: tabler:building-factory
    - title: 50+ pays desservis
      description: Exportation vers l'Europe, les Amériques, le Moyen-Orient, l'Asie-Pacifique et l'Afrique.
      icon: tabler:globe

philosophy:
  tagline: Philosophie de Conception
  title: Conception Pilotée par l'Ingénierie<br />— Chaque Détail Compte
  subtitle: Notre philosophie d'ingénierie repose sur trois principes qui guident chaque produit.
  list:
    - "Fiabilité d'Abord : Chaque produit afarer est testé pour résister aux conditions réelles — des opérations de sauvetage en eau froide aux locations de resorts tropicaux. Nous sur-concevons là où c'est le plus important."
    - 'Précision de Fabrication : Nos installations utilisent la découpe CNC, la soudure haute fréquence et les tests de pression automatisés. Chaque joint, chaque valve, chaque raccord répond aux spécifications documentées.'
    - 'Innovation Continue : notre équipe R&D evaluates new materials, production methods, and design improvements continuously. We do not wait for problems — we anticipate them.'

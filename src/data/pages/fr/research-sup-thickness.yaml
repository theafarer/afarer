content_html: |-
  <h2>Les trois épaisseurs standard</h2>

  <h3>4 po (10 cm) – Randonnée &amp; Performance</h3>
  <ul>
    <li>Rigidité maximale – moins de flexibilité sous charge</li>
    <li>Plus légère – moins de matériau, moins de volume d'air</li>
    <li>Excellent maintien de cap – balancement latéral réduit</li>
    <li>Plus rapide – traînée réduite, glisse plus facile</li>
    <li>Idéale pour : Randonnée, course, fitness, pagayeurs expérimentés</li>
  </ul>

  <h3>5 po (12,7 cm) – Polyvalente</h3>
  <ul>
    <li>Bonne rigidité – rapport flexibilité/rigidité équilibré</li>
    <li>Poids modéré – utilisation standard de matériau</li>
    <li>Bonne stabilité primaire et secondaire</li>
    <li>Idéale pour : Pagayage récréatif, débutants, lac et rivière calme</li>
  </ul>

  <h3>6 po (15,2 cm) – Stabilité &amp; Yoga</h3>
  <ul>
    <li>Stabilité primaire maximale – flottabilité massive</li>
    <li>Plus lourde – plus de matériau PVC, volume d'air plus grand</li>
    <li>Plus lente – plus de traînée, maintien de glisse plus difficile</li>
    <li>Idéale pour : Yoga/fitness, pagayeurs lourds (100+ kg), conditions très agitées</li>
  </ul>

  <h2>Analyse technique</h2>
  <p>La rigidité d'un SUP gonflable est régie par la pression d'air interne et le moment d'inertie de la section transversale de la planche. À 20 PSI, une planche de 4 po présente environ 30 % moins de déflexion sous charge qu'une planche de 6 po de même largeur et longueur. La stabilité primaire provient de la largeur à la flottaison et de la flottabilité ; la stabilité secondaire est influencée par la forme du rail et la largeur de la planche.</p>

  <h2>Épaisseur selon le poids du pagayeur</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Poids du pagayeur</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Épaisseur recommandée</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Moins de 65 kg (143 lb)</td><td class="p-3 border">4 po</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lb)</td><td class="p-3 border">5 po</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lb)</td><td class="p-3 border">5 po ou 6 po</td></tr>
      <tr><td class="p-3 border">Plus de 115 kg (253 lb)</td><td class="p-3 border">6 po</td></tr>
    </tbody>
  </table>

  <h2>Compromis épaisseur vs PSI</h2>
  <p>Une idée reçue courante est qu'un PSI plus élevé peut compenser une épaisseur excessive. À 25 PSI, une planche de 6 po présente plus de flexibilité qu'une planche de 4 po à 15 PSI, car le moment d'inertie géométrique domine l'équation de rigidité. Pour les pagayeurs axés sur la performance, une planche plus fine à pression plus faible surpasse une planche plus épaisse à pression plus élevée.</p>

  <h2>Gamme afarer</h2>
  <ul>
    <li><strong>Planches 4 po :</strong> Série Cheetah Touring – 12' x 30" x 4" SUP de randonnée pour le fitness et la distance</li>
    <li><strong>Planches 5 po :</strong> Série Cheetah All-Round – 10'6" x 32" x 5" pour usage récréatif</li>
    <li><strong>Planches 6 po :</strong> Série Cheetah Ultra-Stable – 10' x 34" x 6" pour yoga, grands pagayeurs et plateformes photo</li>
  </ul>
  <p>Toutes les planches utilisent des âmes drop-stitch de 1 680 DTEX avec pression nominale de 20 PSI et laminés PVC de 1,2 mm.</p>

subtitle: afarer garantit la qualité de chaque produit marin gonflable que nous fabriquons. Cette Garantie Limitée énonce les termes et la couverture de votre produit afarer.
seo:
  headline: Garantie Bateau Gonflable afarer — Garantie Limitée 5 Ans | afarer
  description: afarer offre une garantie limitée de 5 ans sur le tissu des tubes principaux, les joints et l'intégrité structurelle de la coque en fibre de verre. Couvre également les valves de gonflage et les accessoires installés en usine. Conditions générales complètes pour la garantie des bateaux gonflables afarer.
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Cette garantie limitée s'applique aux nouveaux produits marins gonflables de marque afarer achetés directement auprès d'afarer ou d'un revendeur ou détaillant agréé afarer. La date d'entrée en vigueur est la date vérifiable de l'achat au détail d'origine.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Couverture et durée de la garantie</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Ans</h3>
        <p class="text-sm text-gray-600 mt-1">Intégrité du tissu principal des tubes (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Ans</h3>
        <p class="text-sm text-gray-600 mt-1">Intégrité structurelle de la coque en fibre de verre</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Ans</h3>
        <p class="text-sm text-gray-600 mt-1">Étanchéité des soudures des tubes gonflables</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Ans</h3>
        <p class="text-sm text-gray-600 mt-1">Fonctionnalité des valves de gonflage</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 An</h3>
        <p class="text-sm text-gray-600 mt-1">Accessoires et raccords installés en usine</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 An*</h3>
        <p class="text-sm text-gray-600 mt-1">Usage commercial, location ou flotte — tous les composants</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*L'usage commercial, gouvernemental, de charters, location ou pédagogique réduit la garantie à 1 an. L'utilisation en course ou compétition annule la garantie entièrement.</p>
  </div>

  <h2>Ce qui est couvert</h2>
  <h3>Tissu principal des tubes (5 Ans)</h3>
  <p>afarer garantit le tissu principal des tubes contre la détérioration de porosité qui compromet substantiellement la capacité du produit à maintenir le gonflage opérationnel. Cela s'applique au tissu enduit CSM (Hypalon) et à tous les autres matériaux de tube utilisés dans la fabrication.</p>

  <h3>Intégrité structurelle de la coque en fibre de verre (5 Ans)</h3>
  <p>Pour les produits avec une coque en plastique renforcé de fibre de verre (FRP), la structure composite fondamentale est garantie contre les défaillances structurelles dues à des défauts de matériaux ou de fabrication.</p>

  <h3>Étanchéité des soudures des tubes gonflables (5 Ans)</h3>
  <p>Les soudures des tubes gonflables, là où elles sont assemblées lors de la fabrication, sont garanties contre les défauts de fabrication qui entraînent une fuite d'air substantielle à travers la soudure. L'inspection périodique et le maintien des pressions de gonflage appropriées sont des conditions de la couverture.</p>

  <h3>Fonctionnalité des valves de gonflage (5 Ans)</h3>
  <p>Les valves de gonflage installées à l'origine par afarer sont garanties contre les défauts de fabrication qui empêchent la valve de retenir l'air comme conçu.</p>

  <h3>Accessoires installés en usine (1 An)</h3>
  <p>Les composants et raccords fabriqués par afarer et installés à l'origine en usine sont garantis contre les défauts de matériau et de fabrication pendant un an. Cela exclut les articles de tiers, qui sont couverts uniquement par leurs garanties fabricants respectives.</p>

  <h2>Ce qui n'est pas couvert</h2>
  <ul>
    <li>Défauts esthétiques incluant décoloration, taches, déteinte, farinage ou toute altération d'apparence</li>
    <li>Perforations, coupures, déchirures ou autres dommages physiques</li>
    <li>Fissuration, abrasion, éraflure ou détérioration due au frottement ou au contact</li>
    <li>Dégradation due à l'exposition aux UV, aux intempéries ou aux conditions atmosphériques</li>
    <li>Dommages dus au contact avec des carburants, solvants, acides, alcalis ou produits chimiques</li>
    <li>Dommages dus à la négligence, à une mauvaise utilisation, à un abus, à un accident ou à l'usure normale</li>
    <li>Problèmes de gelcoat ou de peinture (cloques, fissuration, décoloration, déteinte)</li>
    <li>Dommages dus aux chocs, à la contrainte, à un support inapproprié ou au remorquage</li>
    <li>Dommages dus à un gonflage/dégonflage inapproprié ou à l'utilisation de dispositifs non approuvés</li>
    <li>Équipements, composants ou systèmes de tiers (couverts par leurs fabricants respectifs)</li>
  </ul>

  <h2>Obligation et recours du fabricant</h2>
  <p>La seule et exclusive obligation d'afarer est la réparation ou le remplacement, au choix d'afarer, de tout composant jugé défectueux en matériaux ou fabrication et couvert par cette garantie. Les réparations ou remplacements sont effectués par afarer ou son centre de service agréé désigné. Les composants réparés ou remplacés ne sont garantis que pour la partie non expirée de la période de garantie d'origine.</p>

  <h2>Conditions de la garantie</h2>
  <ul>
    <li><strong>Enregistrement :</strong> Le produit doit être correctement enregistré comme exigé dans les conditions de garantie.</li>
    <li><strong>Entretien :</strong> Le produit doit être entretenu conformément aux directives publiées par afarer, incluant l'inspection périodique et le maintien des pressions de gonflage appropriées.</li>
    <li><strong>Coopération :</strong> L'acheteur doit coopérer pleinement et rapidement avec afarer dans toutes les affaires relatives aux réclamations de garantie.</li>
    <li><strong>Acheteur d'origine :</strong> Cette garantie est étendue exclusivement à l'acheteur utilisateur final d'origine et n'est pas transférable.</li>
  </ul>

  <h2>Usage commercial</h2>
  <p>Si le produit est utilisé à des fins commerciales, gouvernementales, à but non lucratif, de charter, location, pédagogique ou à toute autre fin que l'usage récréatif privé, la période de garantie pour tous les composants est réduite à un (1) an à compter de la date d'achat au détail d'origine. L'utilisation en course, compétition de vitesse ou d'endurance annule immédiatement et irrévocablement la garantie dans son intégralité.</p>

  <h2>Comment faire une réclamation de garantie</h2>
  <p>Contactez afarer ou votre revendeur agréé avec une preuve d'achat et une description détaillée du problème. afarer examinera la réclamation et fournira des instructions pour l'inspection et le service.</p>
  <p>Pour les demandes de service sous garantie, veuillez nous contacter via notre <a href="/contact" class="text-sky-600 underline">page de contact</a> avec votre numéro de commande et les détails du produit.</p>

  <h2>Articles de tiers</h2>
  <p>Les équipements, composants ou systèmes fabriqués par des tiers (même s'ils sont installés par afarer) sont couverts exclusivement par toute garantie offerte par leur fabricant respectif. afarer décline expressément toute responsabilité de garantie pour ces articles de tiers.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Ce document de garantie est un résumé de la garantie limitée complète du fabricant afarer. Le document juridique complet de la garantie régit toutes les conditions et termes de la garantie. Les spécifications peuvent être modifiées sans préavis. afarer est une marque de Qingdao Vatrad Group.
  </p>

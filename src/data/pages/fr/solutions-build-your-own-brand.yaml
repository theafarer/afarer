meta:
  title: 'Créer sa Marque de Paddle — Fabricant OEM | {SITE}'
  description: "Lancez votre propre marque de paddle gonflable avec afarer : de l'idée au marché. Service OEM/ODM complet, prototypage, moule personnalisé et marque privée."
  keywords:
    - 'créer marque de paddle'
    - 'paddle marque privée'
    - 'OEM paddle gonflable'
    - 'fabricant paddle pour marque privée'
hero:
  tagline: Construisez Votre Propre Marque
  title: Lancez Votre Propre<br />Marque SUP
  subtitle: Vous avez la vision. Nous avons l'usine, l'expertise et la chaîne d'approvisionnement. Ensemble, nous construirons une marque qui se démarque.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Planche SUP personnalisée d'une marque sur l'eau
process:
  title: Votre Parcours de Marque
  subtitle: De l'idée au marché en 5 phases.
  steps:
    - phase: Phase 1
      title: Idée
      period: Week 1-2
      items:
        - Étude de marché et analyse concurrentielle
        - Définition du client cible
        - Atelier de positionnement de marque
        - Stratégie de gamme de produits
    - phase: Phase 2
      title: Design
      period: Week 3-6
      items:
        - Forme de planche et design graphique
        - Assortiment des couleurs et sélection des matériaux
        - Spécification des accessoires
        - Conception d'emballage et d'étiquette
    - phase: Phase 3
      title: Prototype
      period: Week 7-10
      items:
        - Production d'échantillons
        - Tests qualité (pression, flottabilité, UV)
        - Ajustements de design
        - Approbation finale
    - phase: Phase 4
      title: Production
      period: Week 11-14
      items:
        - Fabrication en série
        - Inspection CQ (par unité)
        - Fret maritime / aérien
        - Documents de dédouanement
    - phase: Phase 5
      title: Lancement
      period: Week 15-16
      items:
        - Photographie du produit
        - Flux produits web
        - Matériel marketing
        - Support au lancement
packages:
  title: Packs de Démarrage
  subtitle: Forfaits conçus pour chaque étape de la croissance de la marque.
  items:
    - name: Marque Démarrage
      tagline: 50–100 unités · 2 modèles
      features:
        - Impression de logo basique
        - Emballage standard
        - Support par email
    - name: Marque en Croissance
      tagline: 300–1 000 unités · 3–5 modèles
      features:
        - Couleur personnalisée + logo
        - Emballage personnalisé
        - Photos produits
        - Gestionnaire dédié
    - name: Marque Établie
      tagline: 1 000+ unités · Gamme complète
      features:
        - Personnalisation complète
        - Emballage premium
        - Documents marketing
        - Production prioritaire

faqs:
  title: 'Programme Distributeur — FAQ'
  subtitle: 'Tout ce que les distributeurs demandent avant de postuler.'
  items:
    - title: 'Que signifie « un pays, un distributeur » ?'
      description: 'Afarer accorde à un seul distributeur agréé des droits exclusifs sur un pays ou une région. Vous êtes maître de votre marché — aucune importation parallèle, aucune concurrence interne.'
    - title: 'Quelle est la commande initiale minimale ?'
      description: 'Les distributeurs pays et région démarrent à 100–300 unités. Les revendeurs agréés à partir de 30–50 unités. Les commandes d’essai de 10–30 unités permettent de valider le marché d’abord (sans protection territoriale).'
    - title: 'Quel support reçoivent les distributeurs ?'
      description: 'Le programme de réussite couvre l’intégration, la mise sur le marché, la formation produit et vente, la flotte de démonstration, les supports marketing localisés et un gestionnaire de compte dédié.'
    - title: 'Comment Afarer me protège des conflits de canal ?'
      description: 'Chaque territoire compte exactement un distributeur agréé. Les commandes directes de votre région transitent par vous et les prix protègent votre marge.'
    - title: 'Quelles sont les conditions d’expédition et de paiement ?'
      description: 'Les commandes partent en FOB Qingdao avec documentation complète. Les commandes de production sont payées à 30% d’acompte puis 70% avant expédition ; essais et échantillons en prépaiement.'
    - title: 'Comment postuler ?'
      description: 'Envoyez votre candidature via le formulaire de contact. Nous évaluons l’adéquation marché, la présence en retail et la capacité logistique, puis répondons sous 3 jours ouvrés avec les prochaines étapes et un contrat de distribution type.'
cta:

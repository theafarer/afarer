features:
  title: 'Pourquoi S’associer à Afarer'
  subtitle: 'Un modèle « un pays, un distributeur » avec la structure de soutien qui rend le territoire rentable. L’exclusivité se gagne et se maintient — elle n’est pas un droit permanent.'
  columns: 3
  items:
    - title: 'Exclusivité Territoriale'
      description: 'Un distributeur agréé par pays ou région. Pas d’importations parallèles, pas de concurrence interne. Votre investissement bâtit votre propre rempart.'
      icon: 'tabler:shield-check'
    - title: 'Protection Contre les Conflits de Canal'
      description: 'Les commandes directes de votre région transitent par vous, et les prix protègent votre marge. Afarer ne vend pas en contournant ses partenaires pays.'
      icon: 'tabler:users'
    - title: 'Marges Direct Usine & Remises'
      description: 'Liste de prix revendeur avec remises sur volumes engagés. Aucun intermédiaire. Expédition FOB Qingdao avec documentation d’exportation complète.'
      icon: 'tabler:coins'
    - title: 'Programme de Soutien Partenaire en 10 Modules'
      description: 'Intégration, mise sur le marché, formation, marketing et fonds marketing conjoints, pièces de rechange et après-vente, garantie, outils de commande et portail partenaire — couverts par votre Distribution Agreement.'
      icon: 'tabler:rocket'
    - title: 'Marketing & Fonds Marketing Conjoints'
      description: 'Supports de campagne localisés, matériel de point de vente, kits événementiels, contenu digital multilingue et soutien co-marketing pour les saisons de lancement.'
      icon: 'tabler:mood-smile'
    - title: 'Formation Produit, Vente & Technique'
      description: 'Sessions d’intégration structurées sur les connaissances produit, vente et techniques, avec des supports actualisés au fil de l’évolution de la gamme.'
      icon: 'tabler:presentation'
    - title: 'Pièces de Rechange & Support Après-Vente'
      description: 'Fourniture de pièces de rechange, enregistrement des garanties et traitement des réclamations, fiches techniques et manuels produits pour votre équipe de service local.'
      icon: 'tabler:settings'
    - title: 'Gestionnaire de Compte Dédié & Portail Partenaire'
      description: 'Un responsable distributeur personnel ainsi qu’un accès aux listes de prix, au suivi des commandes et aux ressources marketing via le portail partenaire Afarer.'
      icon: 'tabler:user-check'
table:
  title: 'Niveaux de Partenariat, MOQ & Conditions de Commande'
  subtitle: 'Choisissez le niveau adapté à votre potentiel de marché. Tous les prix en USD, FOB Qingdao.'
  caption: 'Les commandes d’échantillons et d’essai (5–30 unités) ne comportent aucune protection territoriale. L’exclusivité pays ne s’applique qu’aux accords Country / Regional Distributor signés — elle se maintient par la réalisation de la première commande, des objectifs d’achat annuels, un stock local, une capacité après-vente et un investissement continu sur le marché, et ne constitue pas un droit permanent ou perpétuel.'
  head:
    - Niveau du Programme
    - Commande Minimale (unités)
    - Délai
    - Paiement
  rows:
    - [Échantillon / Évaluation Produit, 5–10, 15–20 jours ouvrés, 100% prepaid]
    - [Commande d’essai, 10–30, 30–45 jours ouvrés, 100% prepaid]
    - [Authorized Dealer, 30–50, 30–45 jours ouvrés, 30% d’acompte / 70% avant expédition]
    - [Country / Regional Distributor, 100–300, 30–45 jours ouvrés, 30% d’acompte / 70% avant expédition]
    - [Custom & Private Label (standard), 50+, 30–45 jours ouvrés, 30% d’acompte / 70% avant expédition]
    - [Deep Custom (new molds, packaging), 200+, 45–60 jours ouvrés, 30% d’acompte / 70% avant expédition]
    - [Full Product Line Rights, '300–1,000', 60–90 jours ouvrés, 30% d’acompte / 70% avant expédition]
faqs:
  title: 'Partenariat Pays — FAQ'
  subtitle: 'Les questions que se posent les partenaires pays sérieux avant de postuler.'
  items:
    - title: 'Que signifie vraiment « un pays, un distributeur » ?'
      description: 'Afarer nomme un distributeur agréé unique disposant de droits exclusifs sur un territoire défini. Nous ne vendons pas depuis nos canaux mondiaux ou régionaux dans un pays protégé. Vous êtes propriétaire de votre territoire tant que la Distribution Agreement est respectée.'
    - title: 'Le territoire est-il exclusif pour toujours ?'
      description: 'Non. L’exclusivité est conditionnelle, pas perpétuelle. Elle se maintient par un accord Distribution Agreement signé, la réalisation de votre première commande, des objectifs d’achat annuels, un stock local, une capacité après-vente et un investissement continu sur le marché. Si ces éléments ne sont pas réunis, le territoire peut être renégocié ou réattribué.'
    - title: 'Quelle est la première commande minimale ?'
      description: 'Les distributeurs pays et régionaux démarrent à 100–300 unités ; les revendeurs agréés à 30–50 unités ; les commandes d’essai de 10–30 unités permettent de valider d’abord le marché (les commandes d’essai et d’échantillons ne comportent aucune protection territoriale). Les programmes personnalisés et marque privée suivent des MOQ distincts listés dans les niveaux ci-dessus.'
    - title: 'Que couvre le programme de soutien en 10 modules ?'
      description: 'Niveaux et qualification, protection territoriale, MOQ / tarifs / remises annuelles, gestion des stocks et exécution des commandes, supports marketing et fonds marketing conjoints, formation produit / vente / technique, pièces de rechange et après-vente, enregistrement des garanties, portail partenaire, fiches techniques produits, bibliothèque de supports marketing, échéancier des remises annuelles et listes d’expédition et d’emballage.'
    - title: 'Comment Afarer me protège-t-il des conflits de canal ?'
      description: 'Chaque territoire compte exactement un distributeur agréé. Les demandes et commandes directes de votre région transitent par vous, les formulaires du site sont transmis au partenaire local lorsqu’il en existe un, et l’équipe mondiale n’intervient qu’en l’absence de réponse du partenaire.'
    - title: 'Quelles sont les conditions d’expédition et de paiement ?'
      description: 'Les commandes partent en FOB Qingdao avec documentation d’exportation complète. Les commandes de production sont payées à 30% d’acompte puis 70% avant expédition ; les commandes d’essai et d’échantillons sont payées d’avance. Le délai standard est de 30–45 jours ouvrés, et de 15–20 jours ouvrés pour les séries d’échantillons.'
    - title: 'Comment postuler ?'
      description: 'Envoyez votre candidature via le formulaire de contact avec les informations sur votre marché. Nous évaluons l’adéquation au marché, la présence en retail et la capacité logistique, puis vous répondons sous 3 jours ouvrés avec les prochaines étapes et un exemple de Distribution Agreement.'

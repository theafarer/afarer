size_guide:
  tagline: Tailles et Spécifications
  title: Trouvez la Bonne Taille pour Vos Besoins
  desc: Comparez les dimensions, capacités de poids, and recommended uses. Whether you need a touring SUP, a yoga board, or an all-around SUP — our size guide helps you choose the right fit.
  link_label: Guide des tailles complet avec spécifications →
  link: /size-guide
  cards:
    - title: Planches SUP
      desc: Choisissez la longueur selon votre poids and intended use. Wider boards (32"+) offer more stability. Longer boards (11–12 ft) track better for touring.
    - title: SUP de Randonnée
      desc: Planches plus longues (11–12 ft) pour couvrir de la distance et garder le cap. Assez stables pour la randonnée avec équipement. Vérifiez toujours la capacité de poids.
    - title: SUP Polyvalents
      desc: Choisissez la longueur selon le poids et l'usage. Wider boards (32"+) for stability. Versatile for recreation and fitness.

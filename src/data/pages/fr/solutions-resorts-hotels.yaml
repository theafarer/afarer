meta:
  title: Solutions de flotte SUP pour complexes | {SITE}
  description: Solutions complètes de flottes SUP pour complexes et hôtels. Planches qualité commerciale, marque personnalisée, formation du personnel et forfaits optimisés de 20 à 100+ planches.
hero:
  tagline: Complexes et hôtels
  title: Transformez Votre Front de Mer en Centre de Revenus<br />Avec des Flottes SUP Premium
  subtitle: afarer équipe les complexes du monde entier avec des flottes SUP gonflables de qualité commerciale — du pack de démarrage de 20 planches aux programmes phares de 100+ planches. Marque personnalisée, formation du personnel et pièces de rechange incluses.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Resort guests enjoying SUP boarding on a pristine beach
roi_section:
  title: Le Modèle de Revenu SUP Resort
  subtitle: Comment les complexes génèrent 50 000 $ - 200 000 $+ de revenus annuels de location SUP avec un seul investissement.
  metrics:
    - metric: 50K$–200K$+
      label: Revenu SUP annuel
      detail: Par complexe, selon la taille de la flotte et le taux d'occupation
    - metric: 4–6 Mois
      label: Période de retour sur investissement moyenne
      detail: Récupérez l'investissement total de la flotte en une saison
    - metric: 40%
      label: Augmentation des Revenus
      detail: Augmentation moyenne après passage aux flottes Afarer
    - metric: 500+
      label: Cycles de Location par Planche
      detail: Durabilité de qualité commerciale pour un usage quotidien
packages:
  title: Système de Pack Resort
  subtitle: Choisissez le forfait adapté à votre capacité d'accueil et vos objectifs de revenus. Tous les forfaits incluent une garantie de 12 mois et la certification CE.
  items:
    - name: Pack de Démarrage
      tagline: Pour les complexes boutique, jusqu'à 20 clients/jour
      features:
        - 20 planches SUP (3 tailles adultes/enfants)
        - 20 pagaies (réglables) + 20 gilets de sauvetage
        - 4 pompes double action (électrique en option)
        - 2 râteliers de rangement + kit de réparation
        - Impression de logo personnalisé sur les planches
        - Garantie 12 mois + certification CE
      revenue: Potentiel de revenus annuels 50K$–80K$
      cta_text: Obtenir le Pack Démarrage
    - name: Pack Premium
      tagline: Pour grands complexes, 50–100 clients/jour
      features:
        - 50 planches SUP (5 tailles, flotte mixte)
        - 50 pagaies + 50 gilets de sauvetage
        - 10 pompes double action + 2 pompes électriques
        - 5 râteliers de rangement + 2 chariots
        - Marque personnalisée complète (planches, pagaies, sacs)
        - Session de formation (en ligne)
        - Expédition des pièces de rechange sous 48h
        - Garantie 12 mois + certification CE
      revenue: Potentiel de revenus annuels 120K$–200K$+
      popular: true
      cta_text: Obtenir le Pack Premium
    - name: Pack Flagship
      tagline: Pour complexes ultra-premium, 100+ clients/jour
      features:
        - 100+ planches SUP (gamme complète)
        - Ensemble d'accessoires complet (pagaies, gilets, pompes, chariots)
        - Formation du personnel sur site (2 jours)
        - Gestionnaire de compte dédié
        - Pièces de rechange prioritaires (expédition 24h)
        - Marque personnalisée complète (planches + accessoires)
        - Pack photo/vidéo marketing
        - Garantie 24 mois + certification CE
      revenue: Potentiel de revenus annuels 200K$+
      cta_text: Obtenir le Pack Flagship
case_study:
  quote: Depuis que nous sommes passés chez Afarer, nos revenus de location de SUP ont augmenté de 40 %. Les coûts de remplacement des planches ont chuté de 60 %. Nous avons récupéré notre investissement total de flotte en 4 mois.
  author: Gestionnaire d'Activités Nautiques
  location: Resort 5 étoiles, Maldives
  results:
    - label: Croissance des Revenus
      value: +40%
    - label: Réduction des Coûts
      value: '-60%'
    - label: Période de Remboursement
      value: 4 Mois
features:
  title: Pourquoi les Resorts Choisissent Afarer
  subtitle: Durabilité qualité commerciale, logistique mondiale et un partenaire qui comprend l'hôtellerie.
  items:
    - title: 500+ Cycles de Location
      description: Chaque planche est testée pour résister à 500+ cycles de location en eau salée, soleil et sable.
      icon: tabler:shield-check
    - title: Expédition Pièces 48h
      description: Pièces de rechange expédiées sous 48h — vos revenus de location ne s'arrêtent jamais.
      icon: tabler:truck-delivery
    - title: Branding Personnalisé
      description: Personnalisez chaque planche aux couleurs et au logo de votre complexe.
      icon: tabler:palette
    - title: Formation du Personnel
      description: Programmes de formation en ligne et sur site pour votre équipe d'activités.
      icon: tabler:school
    - title: Logistique mondiale
      description: Expédition vers 50+ pays avec options de fret consolidé.
      icon: tabler:world
    - title: Certifié CE
      description: Tout l'équipement certifié CE, ISO 9001:2015 — sécurité et qualité garanties.
      icon: tabler:certificate

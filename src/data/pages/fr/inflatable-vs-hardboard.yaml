faqs:
  - question: 'Quel est le plus durable : SUP gonflable ou rigide ?'
    answer: Les SUP gonflables sont généralement plus durables car ils résistent aux bosses, fissures et impacts qui endommageraient définitivement une planche rigide.
  - question: Un SUP gonflable est-il meilleur pour les débutants ?
    answer: Oui. Les SUP gonflables sont recommandés pour les débutants car ils sont plus indulgents, plus faciles à transporter et moins susceptibles de causer des blessures en cas de chute.
  - question: Les SUP gonflables performent-ils aussi bien que les planches rigides ?
    answer: Pour la pagaie récréative et la randonnée, les SUP gonflables égalent les performances des planches rigides. Les planches rigides excellent encore en course et en surf avancé grâce à leur poids plus léger et leur flexibilité raffinée.
body: |-
  <h2>Différences fondamentales</h2>
  <p>Les SUP gonflables (iSUP) et les planches rigides servent le même objectif fondamental — se tenir debout et pagayer sur l'eau — mais y parviennent par des constructions radicalement différentes. Chaque type a des forces et des faiblesses distinctes qui le rendent mieux adapté à des utilisations et des utilisateurs spécifiques.</p>

  <h2>Construction et matériaux</h2>
  <h3>SUP gonflable</h3>
  <p>Les iSUP sont construits à partir de tissu PVC à drop-stitch, avec des milliers de fils polyester reliant les couches supérieure et inférieure. L'ensemble du panneau est laminé entre des couches PVC externes et gonflé à 12–20 PSI. Les bandes de rail sont soudées pour former les bords latéraux, et un tapis de pont en mousse EVA est collé sur le dessus. Le résultat est une planche qui peut être dégonflée, roulée et rangée dans un sac de la taille d'un sac à dos.</p>

  <h3>Planche rigide</h3>
  <p>Les planches rigides (ou « epoxy ») sont généralement construites avec une âme en mousse EPS (polystyrène expansé) renforcée de lattes en bois, le tout enveloppé dans des couches de fibre de verre et de résine epoxy. Certaines planches haut de gamme utilisent du carbone ou du bois. Ces planches ne peuvent pas être dégonflées et nécessitent un rangement dédié.</p>

  <h2>Comparaison côte à côte</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Aspect</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Gonflable</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Rigide (Epoxy)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">Poids</td><td class="p-3 border">7–13 kg</td><td class="p-3 border">6–10 kg</td></tr>
      <tr><td class="p-3 border font-medium">Portabilité</td><td class="p-3 border">Excellent – se range dans un sac</td><td class="p-3 border">Limité – nécessite un toit de voiture</td></tr>
      <tr><td class="p-3 border font-medium">Durabilité</td><td class="p-3 border">Très élevée – résiste aux chocs</td><td class="p-3 border">Modérée – se fissure/fend sous impact</td></tr>
      <tr><td class="p-3 border font-medium">Rigidité</td><td class="p-3 border">Bonne à 15–20 PSI</td><td class="p-3 border">Excellente – rigide de façon permanente</td></tr>
      <tr><td class="p-3 border font-medium">Performance</td><td class="p-3 border">Excellente pour usage récréatif</td><td class="p-3 border">Supérieure pour course et surf</td></tr>
      <tr><td class="p-3 border font-medium">Stockage</td><td class="p-3 border">Se glisse dans un placard</td><td class="p-3 border">Nécessite un espace dédié</td></tr>
      <tr><td class="p-3 border font-medium">Prix</td><td class="p-3 border">Généralement plus élevé</td><td class="p-3 border">Généralement plus bas</td></tr>
      <tr><td class="p-3 border font-medium">Préparation</td><td class="p-3 border">3–5 min de gonflage</td><td class="p-3 border">Prêt à l'emploi</td></tr>
    </tbody>
  </table>

  <h2>Quand choisir un SUP gonflable</h2>
  <ul>
    <li><strong>Vous voyagez fréquemment :</strong> La portabilité est inégalée pour les voyages en avion et les road trips</li>
    <li><strong>Espace de rangement limité :</strong> Idéal pour les appartements ou l'utilisation en van/camping-car</li>
    <li><strong>Vous pagayez dans des eaux rocheuses ou peu profondes :</strong> La construction gonflable absorbe les chocs là où une planche rigide s'endommagerait</li>
    <li><strong>Débutants et pagayeurs occasionnels :</strong> Le pont plus souple est plus confortable et pardonne mieux les chutes</li>
    <li><strong>Sports nautiques multi-usages :</strong> Pêche, yoga, fitness, randonnée – un seul appareil polyvalent</li>
  </ul>

  <h2>Quand choisir une planche rigide</h2>
  <ul>
    <li><strong>Course et compétition :</strong> Les planches rigides sont plus légères et plus rapides avec un meilleur rendement de glisse</li>
    <li><strong>Surf avancé :</strong> Les planches rigides offrent un meilleur retour d'information et une meilleure réponse dans les vagues</li>
    <li><strong>Le poids compte :</strong> Les planches rigides sont généralement 1–3 kg plus légères que les gonflables équivalentes</li>
    <li><strong>Vous avez un espace de rangement dédié :</strong> Garage, abri de jardin ou porte-bagages de toit permanent</li>
    <li><strong>Budget limité :</strong> Les planches rigides d'entrée de gamme sont généralement moins chères que les gonflables équivalentes</li>
  </ul>

  <h2>Performance à long terme</h2>
  <p>Les SUP gonflables modernes haute pression (15–20 PSI) ont considérablement réduit l'écart de rigidité avec les planches rigides. Pour la plupart des pagayeurs récréatifs, les différences de performance sont marginales. Les avantages décisifs sont la portabilité et la durabilité pour les gonflables, contre le poids et la réponse pour les rigides.</p>

  <h2>Recommandation d'afarer</h2>
  <p>Pour 95 % des pagayeurs, un SUP gonflable de qualité offre le meilleur rapport qualité-prix global. Afarer se spécialise dans les SUP gonflables prémium avec des âmes drop-stitch de 1 680 DTEX et un laminé PVC de 1,2 mm, offrant une rigidité et des performances comparables aux planches rigides d'entrée de gamme, avec l'avantage supplémentaire de la portabilité et de la durabilité.</p>

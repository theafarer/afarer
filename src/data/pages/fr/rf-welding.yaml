intro: Un bateau gonflable n'est aussi fiable que ses soudures. Une seule soudure faible peut compromettre une chambre entière. Chez {SITE.name}, nous avons investi dans un Centre de Soudure RF dédié combinant des presses de soudure diélectrique industrielles avec un contrôle de processus rigoureux.
content_html: |-
  <h2>La science derrière la soudure</h2>
  <p>La soudure RF utilise de l'énergie électromagnétique haute fréquence (généralement 27,12 MHz) pour exciter les molécules polaires dans le tissu enduit PVC ou Hypalon, générant de la chaleur précisément à l'interface du matériau. Contrairement à la soudure à air chaud ou à coin chaud, la soudure RF crée une véritable liaison moléculaire —les deux couches de tissu fusionnent en un seul matériau homogène dans la zone de soudure, produisant un joint aussi résistant que le matériau lui-même.</p>

  <h2>Cycle de soudure RF</h2>
  <ul>
    <li><strong>Chargement :</strong> Les pièces sont placées entre des électrodes en laiton
    </li>
    <li><strong>Pressage :</strong> Les électrodes se ferment avec une force contrôlée
    </li>
    <li><strong>Soudure :</strong> L'énergie RF est appliquée pendant 2–8 secondes selon l'épaisseur
    </li>
    <li><strong>Refroidissement :</strong> Le joint refroidit sous pression pour cristalliser la liaison
    </li>
    <li><strong>Déchargement :</strong> La pièce finie est retirée pour inspection</li>
  </ul>

  <h2>Contrôle qualité</h2>
  <p>Chaque soudure est inspectée visuellement et testée selon notre protocole obligatoire à quatre niveaux : inspection visuelle, test de pelage, test d'étanchéité et cyclage thermique. Notre équipe de soudage est dirigée par un ingénieur senior avec 11 ans d'expérience.</p>

  <h2>Notre engagement</h2>
  <p>Chaque bateau que nous livrons est accompagné de notre garantie de qualité de soudure : si une soudure défaille en service normal pendant la période de garantie, nous réparons ou remplaçons la chambre concernée sans frais. Choisir afarer, c'est choisir des soudures conçues, testées et documentées —pas simplement soudées.</p>

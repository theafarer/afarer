meta:
  title: 'Clubs de Paddle — Flottes & Équipements | {SITE}'
  description: 'Programmes complets de flottes SUP pour clubs et écoles de paddle : packs de démarrage, planches de compétition et équipements professionnels durables.'
  keywords:
    - 'fournisseur paddle club'
    - 'flotte SUP club'
    - 'équipement paddle club'
    - 'solution nautique club sportif'
hero:
  tagline: Clubs de Paddle et Écoles
  title: Lancez, gérez et développez votre club de paddle<br />avec des flottes SUP de qualité commerciale
  subtitle: afarer équipe les clubs de paddle et écoles SUP du monde entier avec des planches durables, des prix de gros, une marque personnalisée et des pièces de rechange rapides.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Membres d'un club de paddle sur des planches SUP Afarer assorties
benefits:
  title: Avantages de la flotte club
  subtitle: Pourquoi les clubs de paddle de 50+ pays choisissent afarer comme partenaire d'équipement.
  items:
    - metric: 40%+
      label: Économies sur la Flotte
      detail: Vs. prix de détail avec remises clubs en gros
    - metric: 48h
      label: Remplacement de Pièces
      detail: Temps d’arrêt minimal pour votre flotte de location
    - metric: 500+
      label: Cycles de Location
      detail: Durabilité de qualité commerciale par planche
    - metric: 5+ Ans
      label: Durée de Vie de la Flotte
      detail: Avec un entretien et des soins appropriés
packages:
  title: Programmes de flotte club
  subtitle: Choisissez le programme de flotte adapté à la taille et aux ambitions de votre club.
  items:
    - name: Pack de démarrage
      tagline: Pour nouveaux clubs, jusqu’à 30 membres
      features:
        - 10 planches SUP (mix polyvalent + randonnée)
        - 10 pagaies + 10 gilets de sauvetage
        - 2 pompes double action + kit de réparation
        - Marque du club sur les planches (impression logo)
        - Guide de lancement + checklist de sécurité
        - Certifié CE — tout l'équipement
      cta_text: Lancez Votre Club
    - name: Flotte professionnelle
      tagline: Pour clubs établis, 50-100 membres
      features:
        - 30 planches SUP (3 options de taille)
        - 30 pagaies + 30 gilets de sauvetage
        - 5 pompes + 2 kits de réparation + râtelier
        - Couleurs du club + logo sur les planches
        - Programme de pièces de rechange (15% de réduction)
        - Session de formation (en ligne)
        - Certifié CE — tout l'équipement
      popular: true
      cta_text: Construisez Votre Flotte
    - name: Flotte de compétition
      tagline: Pour clubs de course, événements, compétitions
      features:
        - 50+ planches de course/performance
        - Ensemble d'accessoires complet (pagaies, gilets, pompes)
        - Kit de support événementiel (bouées départ, marqueurs)
        - Pièces prioritaires (expédition 24h)
        - Gestionnaire de compte dédié
        - Option d'uniformes d'équipe personnalisés
        - Certifié CE — tout l'équipement
      cta_text: Obtenir la Flotte Competition
training:
  title: Packs centre de formation
  subtitle: Tout ce dont une école de SUP a besoin pour organiser des cours de certification professionnels.
  items:
    - name: Pack Débutant Instructeur
      features:
        - 5 planches SUP premium (qualité instructeur)
        - 5 pagaies carbone pour démos
        - 5 gilets de sauvetage (taille instructeur)
        - Guide du programme de formation
        - Équipement certifié CE
    - name: Pack Complet École
      features:
        - 20 planches SUP (mix étudiants + instructeurs)
        - 20 pagaies + 20 gilets de sauvetage (tailles variées)
        - 10 aides à la flottabilité pour débutants
        - 4 pompes + kits de réparation
        - Programme de formation et support de certification
        - Équipement certifié CE
features:
  title: Pourquoi les clubs choisissent Afarer
  subtitle: Qualité constante, pièces rapides et tarifs de gros conçus pour les clubs en croissance.
  items:
    - title: 500+ Cycles de Location
      description: Les planches qualité commerciale résistent à des saisons d'utilisation quotidienne.
      icon: tabler:shield-check
    - title: Couleurs Personnalisées
      description: Personnalisez les planches aux couleurs et au logo de votre club.
      icon: tabler:palette
    - title: Tarifs de Gros
      description: Remises sur volume pour commandes de flottes de 10+ planches.
      icon: tabler:discount
    - title: Pièces Rapides
      description: Pièces de rechange expédiées sous 48h.
      icon: tabler:truck-delivery
    - title: Soutien à la Croissance du Club
      description: Conseils sur les programmes d'adhésion, la tarification et l'organisation d'événements.
      icon: tabler:trending-up
    - title: Certifié CE
      description: Tout l'équipement répond aux normes de sécurité internationales.
      icon: tabler:certificate

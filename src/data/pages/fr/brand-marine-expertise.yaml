meta:
  title: 'Expertise Marine — Ingénierie de Bateaux Gonflables | {SITE}'
  description: "Des décennies d'ingénierie marine dans chaque coque. afarer maîtrise le drop stitch, le PVC marine et la conception de bateaux gonflables et SUPs professionnels."
  keywords:
    - 'ingénierie marine'
    - 'fabricant équipement nautique'
    - 'expertise bateaux gonflables'
    - 'fabrication paddle gonflable'
hero:
  tagline: Expertise marine
  title: Des Décennies d'Ingénierie Marine<br />dans Chaque Coque
  subtitle: afarer combine science des matériaux, fabrication de précision et tests réels pour produire des embarcations performantes.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Équipe d'ingénierie marine et R&D d'afarer au travail
expertise_materials:
  tagline: Science des Matériaux
  title: Choisir le Bon Matériau<br />pour Chaque Application
  subtitle: Nous travaillons avec trois matériaux principaux — chacun sélectionné pour des cas d'usage spécifiques.
  columns: 3
  items:
    - title: PVC qualité marine
      description: Tissu PVC 1100 deniers — notre matériau le plus polyvalent. Stabilisé UV, résistant à l'abrasion et conforme REACH. Idéal pour les SUP où le poids et le rapport qualité-prix comptent.
      icon: tabler:droplet
    - title: Hypalon/CSM Premium
      description: Résistance chimique et stabilité UV supérieures. Les bateaux Hypalon peuvent durer 15 à 20 ans avec un entretien approprié. Recommandés pour les applications commerciales, de sauvetage et militaires où la durabilité à long terme est essentielle.
      icon: tabler:shield
    - title: Fibre de Verre et Aluminium
      description: Coques en V profond pour les conditions difficiles. Aluminum hulls for heavy-duty commercial applications requiring maximum strength and load capacity.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Capacités de Fabrication
  title: Fabrication de Précision<br />à Chaque Étape
  subtitle: Notre installation de 12 000 m² est équipée de machines spécialisées pour chaque étape.
  columns: 2
  items:
    - title: Découpe CNC
      description: La découpe commandée par ordinateur garantit des panneaux de tissu précis et reproductibles avec un minimum de déchets. Chaque pièce s’adapte exactement comme conçu.
      icon: tabler:cpu
    - title: Soudure Haute Fréquence
      description: La soudure HF industrielle crée des joints plus résistants que le matériau de base. Un contrôle constant de la température et de la pression garantit des joints étanches sur chaque lot de production.
      icon: tabler:bolt
    - title: Assemblage du Cœur Drop-Stitch
      description: Des milliers de fils de polyester relient les couches de tissu supérieure et inférieure, permettant un gonflage haute pression (15-20 PSI) pour des planches SUP et planchers rigides et stables.
      icon: tabler:building-arch
    - title: Test de Pression
      description: Chaque produit gonflable est testé sous pression before shipping. Tubes are tested at 1.5x rated pressure — if it holds there, it will perform on the water.
      icon: tabler:wind
    - title: Test de Résistance des Joints
      description: Des échantillons aléatoires de chaque lot de production subissent des tests destructifs de résistance des joints. Les résultats sont enregistrés et traçables jusqu’aux séries de production spécifiques.
      icon: tabler:files
    - title: Tests Nautiques
      description: Chaque modèle subit des essais en mer avant certification. Real-world testing in coastal conditions validates performance, handling, and stability.
      icon: tabler:droplet
expertise_design:
  tagline: Conception & ingénierie
  title: Conçu pour des Conditions Réelles
  subtitle: Notre philosophie commence par l'utilisation du bateau — puis construit l'ingénierie autour de ce cas d'usage.
  items:
    - title: Conception de coque en V profond
      description: Nos coques en fibre de verre offrent des angles de quille calculés, optimisés pour chaque longueur de modèle et son utilisation. Un V plus prononcé pour le large, plus plat pour les eaux intérieures.
    - title: Sécurité Multi-Chambres
      description: Chaque bateau dispose de 3 à 7 chambres à air indépendantes. If one compartment is compromised, the remaining chambers keep the boat afloat and operational.
    - title: Disposition Ergonomique
      description: La position de la console, la hauteur des tubes et l’emplacement du siège sont conçus pour le confort de l’opérateur lors d’une utilisation prolongée — que ce soit pour la patrouille, la pêche ou le transport.
    - title: Configuration Personnalisée
      description: Couleurs des tubes, configuration de la console, capacité de carburant, supports d'accessoires — chaque modèle peut être personnalisé pour répondre à des exigences opérationnelles spécifiques.

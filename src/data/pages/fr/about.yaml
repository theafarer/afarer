meta:
  title: 'À propos d’Afarer — Marque de SUP Gonflables & Sports Nautiques | {SITE}'
  description: 'Afarer est une marque mondiale de SUP gonflables et de sports nautiques, opérée par Aquafarer LLC (USA) et construite par notre Qingdao Operation Team. Découvrez notre histoire, notre ingénierie, notre qualité certifiée et nos programmes de partenaires pays.'
  keywords:
    - 'marque de SUP gonflable'
    - 'marque de sports nautiques'
    - 'distributeur SUP par pays'
    - 'collections de SUP co-brandées'
    - 'SUP gonflable'
hero:
  tagline: À propos de nous
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Usine et atelier afarer
  title: |-
    Ingénierie marine, <br />
    faite à la manière <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Nous avons commencé dans un atelier côtier avec un bateau et une conviction inébranlable : les produits marins doivent être conçus comme s’ils comptaient, parce qu’ils comptent. Aujourd’hui, nous expédions dans plus de 40 pays, mais chaque coque passe encore entre les mêmes mains qui ont fondé l’entreprise.'

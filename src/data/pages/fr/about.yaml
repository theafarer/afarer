brand_hub_cards:
  - title: Expertise marine
    desc: Des décennies de science des matériaux, de fabrication de précision et de tests réels — de la fabrication PVC/Hypalon à la conception de coque en V profond et la technologie drop-stitch.
    link: /brand-marine-expertise
    link_label: En savoir plus →
  - title: Présence mondiale
    desc: Expédition dans plus de 50 pays depuis notre installation de Qingdao avec des partenaires de service agréés en Europe, Asie-Pacifique et Amériques.
    link: /brand-global-presence
    link_label: En savoir plus →
  - title: Pourquoi afarer
    desc: Une marque fondée sur une qualité vérifiée — double certification (ISO 9001 + BSCI), conformité CE, et des partenariats pays exclusifs avec des collections co-brandées limitées pour les entreprises nautiques.
    link: /brand-why-afarer
    link_label: En savoir plus →

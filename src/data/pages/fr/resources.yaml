    - title: 'Guide d’Achat Bateau SUP'
      description: 'Comment choisir le bon SUP : matériaux, moteur, taille et configuration.'
      icon: tabler:file-description
    - title: 'Liste de Contrôle Fournisseur SUP'
      description: "Considérations clés pour choisir un fabricant SUP : qualité, certifications, MOQ,         audit d'usine."
      icon: tabler:clipboard-check
    - title: 'Guide des Matériaux pour Bateaux Pneumatiques'
      description: 'PVC vs Hypalon : durabilité, résistance UV, durée de vie, réparation, coût.'

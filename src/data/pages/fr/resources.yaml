faqs:
  title: Frequently Asked Questions
  subtitle: 'Questions sur nos produits, processus et partenariat.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'La MOQ varie selon la catégorie. SUP à partir de 10, SUP à partir de 50 unités.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Oui, afarer propose des échantillons. Coûts négociables, souvent crédités.'
      icon: tabler:package
    - title: What payment terms are available?
      description: '30% dépôt, 70% avant expédition. LC pour clients éligibles.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Délais typiques : SUP 30-45j, SUP 20-30j, pneumatiques 25-35j. Prototypage +15-30j.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'Certification CE, USCG, ISO, BSCI, REACH.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Oui. Emballage personnalisé avec logo, couleurs et identité.'
      icon: tabler:color-swatch
cta:
  title: 'Besoin d’aide pour trouver la ressource ?'
  subtitle: 'Contactez notre équipe pour des conseils sur les produits, partenariats OEM ou spécifications.'
  actions:

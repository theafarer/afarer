hero:
  tagline: 'Études de cas'
  title: 'Vrais projets, vrais résultats<br />—afarer en action'
  subtitle: "Découvrez comment afarer s'associe à des distributeurs, marques et opérateurs du monde entier pour fournir des solutions marines personnalisées pour chaque application."
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Études de cas afarer —projets de fabrication marine personnalisés'
features3_cases:
  tagline: 'Cas sélectionnés'
  title: 'Solutions personnalisées<br />pour de vrais défis'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Flotte de centre de plongée européen'
      description: 'Fourniture de 12 bateaux SUP 520 configurés pour la plongée à une chaîne de centres de plongée méditerranéens. Râteliers à bouteilles personnalisés, échelles de plongée et image de marque de la flotte. Livré en 60 jours.'
      icon: tabler:lifebuoy
    - title: 'Programme OEM distributeur australien'
      description: "Développement d'une gamme de planches SUP à marque privée pour un distributeur australien de sports nautiques. 8 modèles, emballage personnalisé et logistique de livraison directe. Du concept à la première expédition en 90 jours."
      icon: tabler:currency-dollar
    - title: 'Fourniture de bateaux de sauvetage Moyen-Orient'
      description: 'Fourniture de 20 bateaux SUP 450 Patrol à une organisation de défense civile du Moyen-Orient. Ponts autovideurs, équipements de navigation complets et tubes orange haute visibilité. Conformité aux normes réglementaires locales.'
      icon: tabler:alert-triangle
    - title: 'Partenariat OEM marque européenne'
      description: 'Partenariat de fabrication en marque blanche avec une marque maritime européenne. 5 modèles SUP, marque privée, droits de distribution exclusifs pour le marché UE. Accord pluriannuel.'
      icon: tabler:building
    - title: 'Flotte de complexe caribéen'
      description: "Package complet d'équipements de sports nautiques pour un complexe caribéen : 40 planches SUP, 20 SUPs, 10 bateaux gonflables et accessoires. Image de marque personnalisée du complexe sur tout l'équipement."
      icon: tabler:beach
    - title: 'Contrat de patrouille côtière américaine'
      description: 'Fourniture de bateaux de patrouille SUP 600 à une agence de sécurité côtière américaine. Configuration bimoteur, options de console blindée et intégration électronique militaire.'
      icon: tabler:shield
cta:
  title: 'Vous avez un projet à discuter ?'
  subtitle: 'Chaque partenariat afarer commence par une conversation. Dites-nous vos besoins et nous développerons une solution.'
  actions:
    - variant: primary
      text: 'Lancez votre projet'
      href: /contact
    - text: 'Voir nos capacités'
      href: /brand/marine-expertise

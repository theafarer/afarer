features3_cases:
  tagline: Cas Présentés
  title: Solutions Personnalisées<br />Pour des Défis Réels
  isBeforeContent: false
  columns: 3
  items:
    - title: Flotte de Centre de Plongée Européen
      customer: BlueMed Diving Centers
      country: Grèce
      industry: Plongée et Tourisme Marin
      challenge: 12 SUP configurés pour la plongée nécessaires pour une chaîne de centres de plongée dans plusieurs îles grecques. Chaque planche nécessitait un attache d’équipement personnalisé, un stockage pour 8 bouteilles et une plateforme stable pour l’entrée des plongeurs en eau libre. La flotte devait arriver dans les 60 jours pour le début de la saison touristique.
      solution: Production de 12 modèles SUP Voyager Dive avec râteliers intégrés, plateformes stables et construction drop-stitch extra-large pour la stabilité d’embarquement. Chaque planche a été marquée aux couleurs de la flotte client. Les 12 planches testées sous pression et expédiées de Qingdao en 55 jours.
      product: SUP Voyager Dive
      results: Les 12 planches livrées à temps pour la saison touristique. Flotte en opération quotidienne depuis 18+ mois sans défaillance. 6 unités supplémentaires commandées.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Le SUP Voyager Dive est le pilier de nos opérations de plongée quotidiennes. La stabilité est excellente et l'agencement de stockage du matériel garde le pont propre et sûr pour nos invités.
      icon: tabler:lifebuoy
    - title: Programme Co-Brand Distributeur Australien
      customer: Pacific Watersports Pty Ltd
      country: Australie
      industry: Programme Co-Brand et Partenariat
      challenge: Un distributeur australien avait besoin d'une gamme de SUP en marque blanche à prix compétitifs. 8 modèles uniques du débutant à l'avancé, avec graphismes personnalisés et expédition directe.
      solution: Développement de 8 modèles SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) with exclusive Australian graphics package. Custom retail packaging with QR codes linking to setup videos. Drop-ship logistics configured from Qingdao direct to Australian retail stores.
      product: Gamme SUP Personnalisée (8 modèles)
      results: Du concept à la première expédition en 90 jours. Taux d’écoulement en magasin de 85 % la première saison. Le distributeur a élargi le partenariat pour inclure des modèles SUP supplémentaires en deuxième année.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: afarer a livré une gamme SUP complète en 90 jours — du design initial au magasin. La qualité égale celle des marques vendant à deux fois le prix.
      icon: tabler:currency-dollar
    - title: Fourniture d'Équipement de Sauvetage Moyen-Orient
      customer: Autorité Nationale de Défense Civile
      country: Émirats Arabes Unis
      industry: Recherche et Sauvetage
      challenge: Une organisation de défense civile avait besoin de 20 SUP prêts pour la patrouille pour le sauvetage côtier, la sécurité portuaire et la réponse aux inondations. Planches haute visibilité, équipement de sécurité complet et conformité aux réglementations maritimes locales.
      solution: Fourniture de 20 modèles SUP Patrol avec construction drop-stitch orange haute visibilité, packs de sécurité complets, ruban réfléchissant SOLAS et construction renforcée. Chaque planche était certifiée CE et testée selon les normes applicables. Le pack de documentation comprenait les certificats de conformité pour l’enregistrement local.
      product: SUP Patrol
      results: Flotte déployée dans 5 stations côtières. Les planches fonctionnent dans une chaleur extrême (45°C+) sans dégradation. Les performances et la durabilité ont dépassé les spécifications.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Le SUP Patrol a dépassé nos exigences opérationnelles. Dans des conditions de chaleur extrême, les planches ne montrent aucun signe de dégradation UV après 24 mois d'utilisation quotidienne.
      icon: tabler:alert-triangle
    - title: Partenariat Co-Brand Européen
      customer: North Sea Marine Equipment BV
      country: Pays-Bas
      industry: Programme Co-Brand et Partenariat
      challenge: Une marque marine européenne établie souhaitait se lancer sur le marché du SUP sans investir dans des installations de fabrication. Elle avait besoin d’un partenaire white-label capable de produire 5 modèles SUP (9 ft à 12 ft) avec branding privé, certification CE et droits de distribution exclusifs dans l’UE.
      solution: Accord de fabrication white-label établi pour 5 modèles SUP. Chaque modèle marqué avec les logos et le schéma de couleurs du client. Documentation de certification CE préparée pour chaque modèle. Droits de distribution exclusifs dans l’UE accordés avec engagements de commande minimum. Documentation technique fournie pour le réseau de service local.
      product: Gamme SUP Personnalisée (5 modèles)
      results: Accord pluriannuel signé. Première série de production de 50 unités expédiée en 75 jours. Marque lancée lors d’un grand salon professionnel avec un accueil positif des revendeurs.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Travailler avec afarer nous a permis d’entrer sur le marché du SUP sans construire d’usine — ils ont livré une solution clé en main complète avec certification CE et documentation de support revendeur.
      icon: tabler:building
    - title: Flotte de Complexe des Caraïbes
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Tourisme Marin et Hôtellerie
      challenge: 'Un resort de luxe avait besoin d’une flotte d’équipement nautique complète pour les activités des clients : 40 planches SUP pour les visites guidées, 20 SUP supplémentaires pour l’exploration du lagon, 10 planches SUP pour les excursions, plus des accessoires. Tout l’équipement devait porter le branding du resort et être livré avant la haute saison touristique.'
      solution: 'Pack SUP complet produit : 40 planches SUP Voyager (modèle polyvalent), 20 planches SUP Explorer, 10 planches SUP Touring, plus VFI, pagaies, pompes et kits de réparation. Tout l’équipement imprimé avec le logo du resort et des couleurs tropicales. Expédition conteneurisée avec manifeste d’inventaire complet.'
      product: Pack SUP Complet (70+ unités)
      results: Flotte arrivée 6 semaines avant la haute saison. Les scores de satisfaction des clients pour les activités nautiques ont augmenté de 40 % d’une année sur l’autre. L’équipement a duré 3 saisons avec seulement un entretien de routine.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: L'approche pack complet signifiait que nous recevions tout ce dont nous avions besoin en une seule expédition — planches et accessoires tous marqués et prêts pour l'utilisation par les clients. Nos invités adorent la qualité de l'équipement.
      icon: tabler:beach
    - title: Contrat de Patrouille Côtière Américain
      customer: Atlantic Coastal Security Agency
      country: États-Unis
      industry: Sécurité Maritime et Application de la Loi
      challenge: Une agence de sécurité côtière américaine avait besoin de SUP de patrouille robustes pour les opérations en eau libre. Planches haute performance avec équipement militaire et conformité aux règlements de la Garde côtière américaine.
      solution: SUP Patrol conçu avec construction drop-stitch renforcée, schémas de couleurs haute visibilité, supports d’équipement de communication cryptés et points d’attache intégrés. Planches renforcées pour opérations intensives. Documentation de conformité USCG fournie.
      product: SUP Patrol
      results: Taux de disponibilité de 95 % rapporté sur 12 mois. Commande supplémentaire de 8 unités.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Le SUP Patrol offre à nos équipages les performances requises pour les opérations en eau libre. La construction renforcée offre une durabilité critique sans compromettre la maniabilité.
      icon: tabler:shield

hero:
  tagline: Conformité
  title: Comment fonctionne la Certification CE
  subtitle: 7 min read
content_html: |-
  <h2>Qu'est-ce que la certification CE ?</h2>
  <p>Le marquage CE (Conformité Européenne) indique qu'un produit répond aux exigences européennes en matière de santé, de sécurité et d'environnement. Pour les embarcations gonflables, le cadre réglementaire applicable dépend de la catégorie du produit.</p>

  <h2>Directives applicables</h2>

  <h3>Directive relative aux navires de plaisance (2013/53/EU)</h3>
  <p>La directive principale pour la plupart des bateaux gonflables, SUP et kayaks. Elle s'applique aux navires de plaisance de 2,5 m à 24 m de longueur de coque, aux bateaux incomplets (pour fourniture OEM) et aux embarcations motorisées personnelles.</p>

  <h3>Règlement relatif aux équipements de protection individuelle (2016/425)</h3>
  <p>Les gilets de sauvetage, aides à la flottabilité et équipements de sécurité fournis avec les embarcations doivent répondre aux exigences du règlement EPI, y compris l'examen de type (Module B) par un organisme notifié et l'assurance qualité de la production (Module D ou E).</p>

  <h2>Le processus de certification</h2>
  <ol>
    <li>Classification du produit : Déterminer la catégorie de conception du navire (A – D selon ISO 8666)</li>
    <li>Normes applicables : EN ISO 6185 (Parties 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (plaque constructeur)</li>
    <li>Préparation du dossier technique : Plans de conception, nomenclature, certificats matières, analyse des risques</li>
    <li>Essais de type : Flottabilité, stabilité, capacité de charge, essais matières, résistance des soudures, étanchéité</li>
    <li>Contrôle de production en usine : Audit de l'organisme notifié des processus de fabrication</li>
    <li>Déclaration de conformité : Le fabricant signe la DoC, appose le marquage CE</li>
  </ol>

  <h2>Organismes notifiés pour les embarcations gonflables</h2>
  <p>Les ON courants incluent Bureau Veritas (France), DNV GL (Allemagne), RINA (Italie), TÜV Rheinland / TÜV SÜD (Allemagne).</p>

  <h2>Délais et coûts</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Phase</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Durée</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Coût typique (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Préparation du dossier technique</td><td class="p-3 border">2 – 4 semaines</td><td class="p-3 border">2 000 – 5 000</td></tr>
      <tr><td class="p-3 border">Essais de type</td><td class="p-3 border">4 – 8 semaines</td><td class="p-3 border">8 000 – 20 000</td></tr>
      <tr><td class="p-3 border">Audit d'usine</td><td class="p-3 border">1 – 2 jours (sur site)</td><td class="p-3 border">3 000 – 6 000</td></tr>
      <tr><td class="p-3 border">Total (premier produit)</td><td class="p-3 border">8 – 14 semaines</td><td class="p-3 border">13 000 – 31 000</td></tr>
    </tbody>
  </table>

  <h2>Ce que cela signifie pour les acheteurs</h2>
  <p>Lors de l'achat de bateaux gonflables certifiés CE, vérifiez toujours que le marquage CE figure sur la plaque constructeur, qu'une DoC valide existe, que le numéro de l'organisme notifié est indiqué et que le manuel du propriétaire inclut les consignes de sécurité dans votre langue locale. Tous les produits Afarer sont certifiés CE avec une traçabilité complète jusqu'aux rapports d'audit des organismes notifiés.</p>

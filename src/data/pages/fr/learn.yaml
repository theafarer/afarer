  title: Apprendre
  subtitle: |-
    Guides, tutoriels et analyses approfondies — tout ce dont vous avez besoin pour explorer<br />
    l'eau en toute confiance. Du choix de votre premier SUP à la maîtrise des techniques avancées.
  taglineSection: Connaissances pour chaque pagayeur. Du débutant au professionnel.
featured:
  tagline: Featured Topics
  title: Commencer votre apprentissage
  subtitle: Que vous débutiez dans les sports nautiques ou cherchiez à progresser, nos guides sont là pour vous.
  items:
    - title: Bases du SUP
      description: Tout ce qu'un débutant doit savoir — types de planches, taille de pagaie, position et conseils pour le premier jour.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Gonflable vs Planche Rigide
      description: Quel est le bon choix pour vous ? Nous comparons portabilité, performance, durabilité et coût côte à côte.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Sécurité Aquatique
      description: Connaissances de sécurité essentielles pour chaque pagayeur —weather, PFDs, self-rescue, and more.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Guide des matériaux
      description: PVC vs Hypalon, technologie drop-stitch, indices denier — comprenez de quoi est fait votre équipement.
      icon: tabler:flask
      href: /learn/materials
    - title: Guide des tailles SUP
      description: Trouvez la bonne longueur, largeur et volume de planche pour votre poids, niveau et style de pagaie.
      icon: tabler:ruler
      href: /size-guide
    - title: Techniques Intermédiaires
      description: Améliorez votre pagaie avec des coups avancés, des techniques de virage et la maîtrise des eaux agitées.
      icon: tabler:droplet
      href: /v2/intermediate-techniques

meta:
  title: 'Sertifikāti — CE, ISO 9001 un atbilstība | {SITE}'
  description: 'afarer kvalitātes sertifikāti: CE (EN ISO 25649), ISO 9001:2015, BSCI. Atbilstība un drošība piepūšamo SUP ražotājam.'
  keywords:
    - 'ce sertifikācija sup'
    - 'iso 9001 sup'
    - 'jūras atbilstība'
    - 'airu dēļu sertifikācija'
hero:
  tagline: 'Sertifikāti un standarti'
  title: 'Kvalitātes sertifikāti<br />un atbilstības standarti'
  subtitle: 'afarer SUP ražošana ir sertificēta atbilstoši starptautiskajiem jūras drošības standartiem, kvalitātes vadības sistēmām un vides normatīviem — CE, ISO 9001, UKCA, BSCI un REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'afarer kvalitātes sertifikāti un atbilstības dokumentācija'
content_certifications:
  tagline: 'Mūsu sertifikāti'
  title: 'Sertificēta kvalitāte,<br />atzīta visā pasaulē'
  subtitle: 'Katru afarer produktu apliecina sertifikāti, kas demonstrē mūsu apņemšanos kvalitātei, drošībai un vides atbildībai.'
  items:
    - title: 'CE sertificēts'
      description: 'Visi afarer produkti atbilst Eiropas CE marķējuma prasībām atpūtas peldlīdzekļiem, nodrošinot drošības, veselības aizsardzības un vides aizsardzības standartu ievērošanu.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Mūsu kvalitātes vadības sistēma ir ISO 9001:2015 sertificēta un aptver piepūšamo peldlīdzekļu un jūras aprīkojuma dizainu, ražošanu un izplatīšanu.'
      icon: tabler:clipboard-check
    - title: 'UKCA marķēts'
      description: 'Produkti, kas tiek pārdoti Apvienotās Karalistes tirgū, nes UKCA marķējumu, apliecinot atbilstību Apvienotās Karalistes normatīviem jūras aprīkojumam un personīgajiem peldlīdzekļiem.'
      icon: tabler:shield
    - title: 'BSCI atbilstība'
      description: 'afarer ir BSCI (Business Social Compliance Initiative) auditēts, demonstrējot ētisku ražošanas praksi, taisnīgus darba apstākļus un piegādes ķēdes atbildību.'
      icon: tabler:heart-handshake
    - title: 'REACH atbilstība'
      description: 'Visi afarer produktos izmantotie materiāli atbilst ES REACH normatīviem ķīmiskajai drošībai, nodrošinot, ka mūsu PVC, EVA vai komponentos nav ierobežotu vielu.'
      icon: tabler:flask
    - title: 'Materiālu testēšana'
      description: 'Audumi tiek testēti uz stiepes izturību, plīsumizturību, UV degradāciju un aukstuma plaisāšanu. Katra ražošanas partija tiek izlasē un verificēta.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Rūpnīcas standarti'
  title: 'Ražošanas izcilība<br />— būvēts pēc specifikācijas'
  subtitle: 'Mūsu 12,000 m² objekts darbojas saskaņā ar stingriem kvalitātes kontroles protokoliem katrā ražošanas posmā.'
  list:
    - 'Ienākošo materiālu pārbaude: Visi izejmateriāli — PVC audums, EVA putas, līmes, furnitūra — tiek testēti pret specifikācijām pirms nonākšanas ražošanā.'
    - 'Procesa kvalitātes kontrole: Katram ražošanas posmam ir dokumentēti kvalitātes kontroles punkti. Metinājuma izturība, šuvju līdzinājums, vārstu uzstādīšana un furnitūras moments tiek verificēti procesā.'
    - 'Spiediena testēšana: Katra piepūšamā kamera tiek testēta ar spiedienu 1,25× nominālais 24–48 stundas. Lai tests būtu izturēts, spiediena kritumam jāpaliek zem 5%.'
    - 'Gala pārbaude: Pabeigti produkti pirms nosūtīšanas tiek pārbaudīti uz izmēru precizitāti, kosmētisko apdari, piederumu pilnīgumu un iepakojuma integritāti.'
    - 'Partiju izsekojamība: Katrs produkts nes sērijas numuru, kas ir saistīts ar ražošanas partijas ierakstiem, nodrošinot pilnu izsekojamību no izejmateriāla līdz gatavajai produkcijai.'
content_safety:
  tagline: 'Jūras drošības standarti'
  title: 'Drošība pirmajā vietā<br />— radīts uzticamai ekspluatācijai'
  subtitle: 'afarer produkti ir izstrādāti un testēti, lai atbilstu starptautiskajiem jūras drošības standartiem komerciālai un atpūtas lietošanai.'
  items:
    - title: 'EN ISO 25649'
      description: 'Piepūšamie SUP atbilst EN ISO 25649 standartiem konstrukcijai, stabilitātei, peldētspējai un slodzes ietilpībai.'
      icon: tabler:sailboat
    - title: 'SOLAS atbilstība'
      description: 'Drošības aprīkojums un glābšanas līdzekļi, kur piemērojams, atbilst SOLAS (Safety of Life at Sea) prasībām.'
      icon: tabler:lifebuoy

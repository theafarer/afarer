faqs:
  title: 'Kopīgs zīmols — biežāk uzdotie jautājumi'
  subtitle: 'Kā darbojas Afarer kopīgais zīmols un kā tas atšķiras no OEM un privātā zīmola.'
  items:
    - title: 'Vai kopīgais zīmols ir tas pats, kas OEM vai privātais zīmols?'
      description: 'Nē. Afarer vairs neīsteno atvērtu OEM/privātā zīmola programmu. Kopīga zīmola produkti paliek Afarer produkti — izstrādāti, konstruēti, kvalitātes pārbaudīti un atbalstīti ar Afarer zīmolu. Jūsu identitāte parādās kā kopīgs zīmols, nevis kā nezīmola trešās puses produkts.'
    - title: 'Kas var sākt kopīga zīmola projektu?'
      description: 'Kvalificēti ūdens sporta uzņēmumi: esošie valstu partneri, airu klubi, kūrorti un viesnīcas, pasākumu organizatori un kopienas. Atsūtiet mums projekta aprakstu, un mēs apstiprinām piemērotību, pirms sākas dizaina darbs.'
    - title: 'Vai kopīgais zīmols konfliktēs ar manu valsts izplatītāju?'
      description: 'Nē. Modelis «viena valsts — viens izplatītājs» ir prioritārs. Kopīga zīmola kolekcijas tiek saskaņotas ar vietējo valsts partneri, ja tāds ir, tāpēc aizsargātā teritorijā neparādās neviens paralēls vai konkurējošs zīmols.'
    - title: 'Kāds ir minimālais pasūtījums kopīga zīmola kolekcijai?'
      description: 'Pilotkolekcijas sākas ar 30–50 vienībām. Standarta kolekcijas ir 50–100 vienības; lieli vai vairāku reģionu izdevumi ir 100+ vienības. Pielāgotas izstrādes termiņi tiek vienoti katram projektam atsevišķi.'
    - title: 'Kas pieder Afarer kvalitātei un kas partnera ieguldījumam?'
      description: 'Afarer pieder produkta dizains, inženierija, materiāli, konstrukcija, kvalitātes kontrole un garantija. Partneri sniedz kolekcijas konceptu, nosaukumus, krāsas, grafikas ierosinājumus un tirgus iešanas plānu. Tādējādi uz ūdens tiek uzturēts viens kvalitātes standarts.'
    - title: 'Kā pieteikties?'
      description: 'Aizpildiet kopīga zīmola pieprasījuma formu, norādot savu uzņēmumu, tirgu un kolekcijas ideju. Mēs izvērtējam atbilstību un 3 darba dienu laikā atbildam ar piedāvājumu un Kopīga zīmola projekta līgumu.'

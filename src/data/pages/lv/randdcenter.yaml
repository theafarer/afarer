rd_services:
  tagline: 'Pielāgota P&I'
  title: 'P&I pakalpojumi partneriem'
  services:
    - title: 'Pielāgota materiālu izstrāde'
      desc: 'Mēs izstrādājam pielāgotas audumu formulas, laminātu slāņus un līmēšanas sistēmas, kas pielāgotas jūsu ekspluatācijas videi un veiktspējas mērķiem.'
    - title: 'OEM / ODM produktu inženierija'
      desc: 'Mēs izstrādājam pielāgotas audumu formulas, laminātu slāņus un līmēšanas sistēmas, kas pielāgotas jūsu ekspluatācijas videi un veiktspējas mērķiem.'
    - title: 'Trešās puses testēšana un sertifikācija'
      desc: 'Izmantojiet mūsu ISO atbilstošās testēšanas iekārtas neatkarīgai materiālu testēšanai, produktu validācijai un sertifikācijas atbalstam.'
  cta: 'Apspriediet savas P&I prasības →'

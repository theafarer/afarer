meta:
  title: 'Pētniecības un izstrādes centrs | {SITE}'
  description: 'Pētniecība un izstrāde — PVC audumu testēšana, korpusu inženierija, RF metināšana, hidrodinamiskā testēšana un kvalitātes kontrole. Pieejami pielāgoti P&I pakalpojumi.'

hero:
  tagline: 'Pētniecības un izstrādes centrs'
  title: 'Pētniecības un izstrādes centrs'
  subtitle: 'Fokuss uz progresu'

intro:
  - 'afarer Pētniecības un izstrādes (P&I) centrs ir dzinējspēks mūsu misijai revolucionizēt ūdenssporta aprīkojumu. Mēs sniedzam ūdenssporta entuziastiem visā pasaulē drošākus, ērtākus un patīkamākus produktus, neatlaidīgi inovējot piepūšamajos stāvus airēšanas dēļos (SUP). Mūsu veltītā inženieru, dizaineru un aizrautīgu ūdenssporta ekspertu komanda veido nozares nākotni, pastāvīgi ceļot kvalitātes, veiktspējas un ilgtspējas latiņu.'
  - 'Mūsu P&I centrs apvieno materiālzinātniekus, jūras inženierus un ražošanas inženierus zem viena jumta. No audumu formulu izstrādes un korpusu simulācijas līdz metināšanas procesu attīstībai un pilna mēroga jūras izmēģinājumiem katru produktu izstrādes posmu vada dati un validē testēšana.'

mission:
  tagline: 'Mūsu misija'
  title: 'Inovējot ūdenssporta nākotni'
  pillars:
    - icon: lightning
      title: 'Tehnoloģiskā attīstība'
      desc: 'Jaunu materiālu, dizainu un ražošanas pioneir darbs augstākai produktu veiktspējai un kalpošanas ilgumam.'
    - icon: design
      title: 'Lietotājam centrēts dizains'
      desc: 'Padziļināta lietotāju vajadzību izpratne un pārsniegšana, izmantojot ergonomisku un intuitīvu produktu dizainu.'
    - icon: globe
      title: 'Ilgtspējīga prakse'
      desc: 'Mūsu vides pēdu samazināšana, izmantojot videi draudzīgus materiālus un procesus.'
    - icon: shield
      title: 'Nekompromisa drošība'
      desc: 'Augstāko drošības standartu nodrošināšana ar stingru testēšanu un sertifikāciju.'

pillars:
  - title: 'Tehnoloģiskā attīstība'
    desc: 'Jaunu materiālu, dizainu un ražošanas procesu pioneir darbs, lai nodrošinātu izcilu produktu veiktspēju un ilgmūžību.'
    icon: tech
  - title: 'Advancēti materiāli'
    desc: 'Modernāko PVC, kompozītu un ilgtspējīgu alternatīvu izpēte uzlabotām produktu īpašībām.'
    icon: materials
  - title: 'Ilgtspēja'
    desc: 'Pamatapsolījums: esam veltīti videi atbildīgai rīcībai, izmantojot ilgtspējīgu ražošanu un pārstrādājamus materiālus.'
    icon: sustainability

capabilities:
  tagline: 'Iespējas'
  title: 'P&I iespējas'
  subtitle: 'Četras pamatdisciplīnas, kas dod mums pilnu kontroli pār produktu izstrādi — no izejvielu pētniecības līdz galīgai sertifikācijai.'
  groups:
    - title: 'Materiālzinātne un audumu tehnoloģijas'
      items:
        - 'PVC formulu analīze un optimizācija'
        - 'UV stabilizācijas, liesmas aiztures un pretmikrobu piedevu izstrāde'
        - 'Daudzslāņu audumu laminācija un līmēšanas inženierija'
        - 'Paātrināta novecošanās testēšana (UV, termiskā, mitrums, sāls migla)'
    - title: 'Korpusu inženierija un hidrodinamika'
      items:
        - 'Parametriskā 3D korpusu dizains un CFD optimizācija'
        - 'Galīgo elementu analīze strukturālajām un trieciena slodzēm'
        - 'Mēroga modeļu vilkšanas baseina testēšana un veiktspējas validācija'
        - 'Pielāgotu korpusu izstrāde īpašiem uzdevumu profiliem'
    - title: 'Metināšanas un savienošanas tehnoloģijas'
      items:
        - 'RF dielektriskās metināšanas procesa izstrāde un optimizācija'
        - 'Karstā gaisa, karstā ķīļa un ultraskaņas metināšanas metodes'
        - 'Līmēšana un šuvju lentes kvalifikācija'
        - 'Metinājuma izturības modelēšana un kalpošanas laika prognozēšana'
    - title: 'Testēšana, sertifikācija un atbilstība'
      items:
        - 'Kvalitātes vadība un CE atbilstības testēšana'
        - 'Neatkarīga trešās puses testēšana un sertifikācijas atbalsts'
        - 'Pielāgotu testu protokolu izstrāde iepirkumu kvalifikācijai'
        - 'Ekspluatācijas bojājumu analīze un pamatcēloņu izmeklēšana'


faqs:
  title: 'OEM airu ražošanas BUJ'
  subtitle: 'Atbildes uz biežākajiem jautājumiem no zīmoliem, kas palaiž savu airi.'
  items:
    - title: 'Kā izveidot savu airu zīmolu?'
      description: 'Palaidiet savu zīmolu 16 nedēļās: uzdevums, dizains, CE sertificēts prototips, masveida ražošana un piegāde. Iepazīstieties ar mūsu OEM paketēm.'
    - title: 'Kāds ir ražošanas izpildes laiks?'
      description: 'Parauga gatavs 2-3 nedēļās, lielapjoma ražošana 30-45 dienās atkarībā no apjoma.'
    - title: 'Vai airis nes mūsu logotipu?'
      description: 'Jā — pilns privātais zīmols: logotipa drukāšana, pielāgotas krāsas, iepakojums un etiķetes ar jūsu zīmolu.'
    - title: 'Vai varu pirkt vairumā no pirmās dienas?'
      description: 'MOQ ir 50 vienības standarta modeļiem, ar vairumtirdzniecības cenu līmeņiem, palielinoties apjomam.'

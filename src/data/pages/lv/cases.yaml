features3_cases:
  tagline: 'Izceltie gadījumi'
  title: 'Pielāgoti risinājumi<br />reālām problēmām'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Eiropas niršanas centra flote'
      customer: 'BlueMed Diving Centers'
      country: 'Grieķija'
      industry: 'Niršana un jūras tūrisms'
      challenge: 'Bija nepieciešami 12 niršanai pielāgoti SUP niršanas centru ķēdei vairākās Grieķijas salās. Katram dēlim vajadzēja pielāgotu ekipējuma stiprinājumu, glabāšanas vietu 8 baloniem un stabilu platformu nirēju iekāpšanai atklātā ūdenī. Flotei bija jāierodas 60 dienu laikā līdz tūrisma sezonas sākumam.'
      solution: 'Izgatavojām 12 SUP Voyager Dive modeļus ar integrētām ekipējuma statnēm, stabilām platformām un īpaši plašu Drop-Stitch konstrukciju iekāpšanas stabilitātei. Katrs dēlis tika noformēts ar klienta flotes liveriju. Visi 12 dēļi tika testēti ar spiedienu un nosūtīti no Cindao 55 dienu laikā.'
      product: 'SUP Voyager Dive'
      results: 'Visi 12 dēļi piegādāti laikus tūrisma sezonai. Flote ikdienā darbojas jau 18+ mēnešus bez viena materiāla bojājuma. Klients otrajā gadā pasūtīja 6 papildu vienības.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive ir kļuvis par mūsu ikdienas niršanas operāciju pamatu. Stabilitāte ir izcilīga, un ekipējuma novietojums uztur klājumu tīru un drošu mūsu viesiem.'
      icon: tabler:lifebuoy
    - title: 'Austrālijas izplatītāja kopīgā zīmola programma'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Austrālija'
      industry: 'Kopīgā zīmola un partnerības programma'
      challenge: 'Austrālijas izplatītājam bija nepieciešama privātā zīmola SUP dēļu līnija konkurētspējīgā cenā, lai konkurētu ar Ķīnas zīmoliem, kas pārdod tieši patērētājiem. Bij nepieciešami 8 unikāli modeļi no iesācēju līdz pieredzējušo līmenim, ar pielāgotu grafiku, pielāgotu iepakojumu un drop-ship piegādi mazumtirdzniecības vietām.'
      solution: 'Izstrādājām 8 SUP modeļus (universālie, tūrisma, joga, bērnu, sporta, ultra-kompaktie, ultra-stabilie, baltajiem ūdeņiem) ar ekskluzīvu Austrālijas grafikas paketi. Pielāgots mazumtirdzniecības iepakojums ar QR kodiem, kas ved uz iestatīšanas video. Drop-ship loģistika konfigurēta no Cindao tieši uz Austrālijas mazumtirdzniecības veikaliem.'
      product: 'Pielāgota SUP līnija (8 modeļi)'
      results: 'No koncepta līdz pirmajai sūtījumam 90 dienās. Mazumtirdzniecības realizācijas līmenis 85% pirmajā sezonā. Izplatītājs otrajā gadā paplašināja partnerību, iekļaujot papildu SUP modeļus.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer piegādāja pilnu SUP līniju 90 dienās — no sākotnējā dizaina līdz mazumtirdzniecības plauktam. Kvalitāte atbilst zīmoliem, ko pārdod par divreiz augstāku cenu.'
      icon: tabler:currency-dollar
    - title: 'Tuvo Austrumu glābšanas aprīkojuma piegāde'
      customer: 'Nacionālā civilās aizsardzības pārvalde'
      country: 'Apvienotie Arābu Emirāti'
      industry: 'Meklēšana un glābšana'
      challenge: 'Civilās aizsardzības iestādei bija nepieciešami 20 patrūļai gatavi SUP piekrastes meklēšanai un glābšanai, ostu drošībai un plūdu reaģēšanai. Bij nepieciešami labi redzami dēļi, pilns drošības aprīkojums un atbilstība vietējiem jūrlielu noteikumiem.'
      solution: 'Piegādājām 20 SUP Patrol modeļus ar augsta redzamības oranžo Drop-Stitch konstrukciju, pilnām drošības paketēm, SOLAS atstarojošo lenti un pastiprinātu konstrukciju. Katrs dēlis bija CE sertificēts un testēts atbilstoši piemērojamiem standartiem. Dokumentācijas paketē iekļauti atbilstības sertifikāti vietējai reģistrācijai.'
      product: 'SUP Patrol'
      results: 'Flote izvietota 5 piekrastes stacijās. Dēļi darbojušies ekstremālā karstumā (45°C+) bez degradācijas. Veiktspēja un izturība pārsniedza specifikācijas.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol pārsniedza mūsu operatīvās prasības. Ekstremālos karstuma apstākļos dēļi pēc 24 mēnešu ikdienas lietošanas neuzrāda UV degradācijas pazīmes.'
      icon: tabler:alert-triangle
    - title: 'Eiropas kopīgā zīmola partnerība'
      customer: 'North Sea Marine Equipment BV'
      country: 'Nīderlande'
      industry: 'Kopīgā zīmola un partnerības programma'
      challenge: 'Eiropas jūras zīmols vēlējās paplašināties SUP tirgū neinvestējot ražošanas objektos. Bij nepieciešams balto etiķešu partneris, kas spēj ražot 5 SUP modeļus (no 9 ft līdz 12 ft) ar privātu zīmolējumu, CE sertifikāciju un ekskluzīvām ES izplatīšanas tiesībām.'
      solution: 'Noslēdzām balto etiķešu ražošanas vienošanos 5 SUP modeļiem. Katrs modelis nozīmēts ar klienta logotipiem un krāsu shēmu. Katram modelim sagatavota CE sertifikācijas dokumentācija. Piešķirtas ekskluzīvas ES izplatīšanas tiesības ar minimālā pasūtījuma saistībām. Tehniskā dokumentācija nodrošināta vietējam servisa tīklam.'
      product: 'Pielāgota SUP līnija (5 modeļi)'
      results: 'Parakstīta daudzu gadu vienošanās. Pirmā 50 vienību ražošanas partija nosūtīta 75 dienu laikā. Zīmols prezentēts lielā tirdzniecības izstādē ar pozitīvu dīleru uztveri.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Sadarbība ar afarer ļāva mums ieiet SUP tirgū bez rūpnīcas būvēšanas — viņi piegādāja pilnīgu gatavu risinājumu ar CE sertifikāciju un dīleru atbalsta dokumentāciju.'
      icon: tabler:building
    - title: 'Karību kūrorta flote'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahamu salas'
      industry: 'Jūras tūrisms un viesmīlība'
      challenge: 'Greznajam kūrortam bija nepieciešama pilnīga ūdenssporta aprīkojuma flote viesu aktivitātēm: 40 SUP dēļi ekskursijām ar gida pavadību, 20 papildu SUP lagūnas izpētei, 10 SUP dēļi viesu izbraucieniem, kā arī piederumi. Viss aprīkojums vajadzēja pielāgotu kūrorta nozīmējumu un bija jānogādā pirms tūrisma sezonas maksimuma.'
      solution: 'Izgatavojām pilnu SUP paketi: 40 SUP Voyager dēļus (universālais modelis), 20 SUP Explorer dēļus, 10 SUP Touring dēļus, kā arī glābšanas vestes, airus, sūkņus un remonta komplektus. Viss aprīkojums ar kūrorta logotipu un tropu krāsu shēmu. Konteineru sūtījums ar pilnu krājumu sarakstu.'
      product: 'Pilna SUP pakete (70+ vienības)'
      results: 'Flote ieradās 6 nedēļas pirms sezonas maksimuma. Viesu apmierinātības vērtējums ūdenssporta aktivitātēm pieauga par 40% gadu no gada. Aprīkojums kalpojis 3 sezonas tikai ar parasto apkopi.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Pilnās paketes pieeja nozīmēja, ka visu nepieciešamo saņēmām vienā sūtījumā — dēļi un piederumi ar nozīmējumu un gatavi viesu lietošanai. Mūsu viesiem patīk aprīkojuma kvalitāte.'
      icon: tabler:beach
    - title: 'ASV piekrastes patrūļas līgums'
      customer: 'Atlantic Coastal Security Agency'
      country: 'Amerikas Savienotās Valstis'
      industry: 'Jūras drošība un tiesībaizsardzība'
      challenge: 'ASV piekrastes drošības aģentūrai bija nepieciešami smagai lietošanai paredzēti patrūļas SUP operācijām atklātā ūdenī. Bij nepieciešami augstas veiktspējas dēļi ar militāra standarta ekipējumu un atbilstību ASV Krasta apsardzes noteikumiem.'
      solution: 'Izstrādājām SUP Patrol ar pastiprinātu Drop-Stitch konstrukciju, augsta redzamības krāsu shēmām, šifrētas komunikācijas iekārtu stiprinājumiem un integrētiem ekipējuma piestiprināšanas punktiem. Dēļi pastiprināti smagai darbībai. Nodrošināta USCG atbilstības dokumentācija.'
      product: 'SUP Patrol'
      results: 'Aģentūra ziņoja par 95% uzdevumu gatavības līmeni pirmajos 12 mēnešos. Izdarīts papildu pasūtījums uz 8 vienībām.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol sniedz mūsu apkalpēm veiktspēju, kas nepieciešama operācijām atklātā ūdenī. Pastiprinātā konstrukcija nodrošina izšķirošu izturību, nezaudējot vadāmību.'
      icon: tabler:shield

meta:
  title: 'Rūpnīcas aprīkojums — griešana, RF metināšana un druka | {SITE}'
  description: 'Rūpnieciska līmeņa afarer ražošanas aprīkojums: PVC griešana, RF metināšana, digitālā druka, montāža un piepūšamo SUP dēļu testēšana.'
  keywords:
    - 'sup ražošanas aprīkojums'
    - 'piepūšamo sup rūpnīca'
    - 'rf metināšana pvc'
    - 'airu dēļu ražošana'
hero:
  tagline: 'Aprīkojums'
  title: 'Ražošanas aprīkojums un mašīnas'
  subtitle: 'Rūpnieciska līmeņa aprīkojums griešanai, metināšanai, drukai un montāžai'
  back_label: 'Atpakaļ uz rūpnīcu'
  back_link: /factory

categories:
  - title: 'Griešana un materiālu sagatavošana'
    items:
      - name: 'Automatizētā PVC griešanas mašīna'
        spec: 'CNC kontrolēta, 6.5 m × 2.5 m, 0.1 mm precizitāte'
        desc: 'Ar datoru kontrolēta automātiskā griešanas mašīna PVC un Drop-Stitch audumiem. Izkārtojuma programmatūra optimizē materiālu izmantošanu, atkritumus samazinot zem 5%.'
      - name: 'Auduma izklājējs'
        spec: 'Maksimālais platums 3 m, ar sprieguma kontroli vadāma pievade'
        desc: 'Izklāj audumu vienā vai vairākos slāņos ar kontrolētu spriegumu, lai novērstu deformāciju pirms griešanas.'

  - title: 'Cilindru metināšana un līmēšana'
    items:
      - name: 'Termiskās noslēgšanas mašīna'
        spec: 'Karstā gaisa metināšana, regulējams 200–600 °C, 0.5–5 m/min'
        desc: 'Karstā gaisa termiskās noslēgšanas mašīna PVC un sānu malu šuvju līmēšanai un metināšanai. Izmanto kameru un peldošo savienojumu piestiprināšanai, noslēgšanai un kausēšanai.'
      - name: 'Dielektriskā RF prese'
        spec: '15 kW, plātne 2000 × 600 mm'
        desc: 'Radiofrekvences metināšanas prese galvenajām garenajām šuvēm, sānu malu joslām un lielo kameru izgatavošanai.'
      - name: 'CNC kontrolēts RF metinātājs'
        spec: '8 kW, XY galds 2500 × 1200 mm'
        desc: 'Programmējama izliekto šuvju metināšana sarežģītām ģeometrijām, logotipu reljefam un precīzai plāksteru darbam.'

  - title: 'SUP dēļu ražošana'
    items:
      - name: 'Drop-Stitch kodola laminēšanas prese'
        spec: 'Lielformāta prese dēļu kodoliem līdz 14 pēdu LOA'
        desc: 'Precīza Drop-Stitch kodolu laminēšana ar ārējiem PVC laminātiem. Katrs slānis tiek spiediena līmēts nemainīgai kvalitātei un stiprībai.'
      - name: 'CNC frēzmašīna (5 asi)'
        spec: 'Darba telpa 3 m × 2 m × 1 m, ar ūdeni dzesēts vārpsts'
        desc: 'Spuru kastu, rokturu izgriezumu un pielāgotu dēļu komponentu apstrāde.'

  - title: 'SUP druka un noformējums'
    items:
      - name: 'Digitālais printeris'
        spec: 'Augstas izšķirtspējas tintes druka, līdz 2 m drukas platums'
        desc: 'Tieša digitālā druka uz auduma pilnkrāsas SUP klāja grafikai. Drukā pielāgotus rakstus, pārejas un foto kvalitātes attēlus ar UV izturīgām uz ūdens bāzes tintēm.'
      - name: 'Sitiena drukas mašīna'
        spec: 'Manuāla un pusautomātiska, daudzkrāsu reģistrācija'
        desc: 'Sitiena druka SUP dēļu logotipiem, zīmolu zīmēm un atkārtojošiem rakstiem. Nodrošina izturīgus, necaurspīdīgus uzdrukumus ar spilgtu krāsu piesātinājumu.'

  - title: 'Montāža un aprīkošana'
    items:
      - name: 'Dēļu montāžas stacija'
        spec: 'Modulāra, regulējama, daudzstaciju izkārtojums'
        desc: 'Spuru kastu, rokturu, D-gredzenu, vārstu un klāja pārklājumu montāža uz SUP dēļiem.'
      - name: 'Vārstu uzstādīšanas prese'
        spec: 'Pneimatiska, regulējams spiediens'
        desc: 'Precīza Halkey-Roberts un Leafield vārstu uzstādīšana un noslēgšana.'
      - name: 'Klāja pārklājuma laminators'
        spec: '3 m × 1.5 m, ar temperatūras kontroli'
        desc: 'EVA putuplasta klāja pārklājumu termiskā laminēšana pie SUP dēļu augšdaļas ar nemainīgu līmes stiprību.'

  - title: 'Testēšana un kvalitātes kontrole'
    items:
      - name: 'Universālais stiepes testētājs'
        spec: '50 kN, ASTM D751'
        desc: 'Plīšanas spēka, pagarinājuma plīstot un plīsuma izplatības testēšana audumu partijām.'
      - name: 'Gaisa noturības testēšanas iekārta'
        spec: 'Programmējama, 30 min spiediena noturēšana'
        desc: 'Automatizēts spiediena noturēšanas tests katrai kameras cilpai pirms montāžas.'
      - name: 'Šuvju atlobīšanas testētājs'
        spec: 'Motorizēta 180° atlobīšana pie 100 mm/min'
        desc: 'Metinājumu un līmēto šuvju atlobīšanas stiprības testēšana saskaņā ar EN ISO 25649.'
      - name: 'Ksenona loka atmosfēras iedarbes kamera'
        spec: '2000 h iedarbība'
        desc: 'UV izturības testēšana krāsas maiņas un izturības saglabāšanas noteikšanai.'


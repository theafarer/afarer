workshops_section:
  tagline: 'Cehi'
  title: 'Ražošanas cehi'
  workshops:
    - title: 'PVC griešana un materiālu sagatavošana'
      description: 'Automātiskās CNC griešanas mašīnas apstrādā PVC un Drop-Stitch audumus ar precizitāti, kas mazāka par vienu milimetru. Ar datoru optimizēta paneļu izkārtojuma izmantošana samazina materiālu atkritumus un nodrošina, ka katrs panels pirms metināšanas atbilst izmēru specifikācijai.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Balonu metināšana un termiskā hermetizācija'
      description: 'Specializēta metināšanas darbnīca ar termiskās hermetizācijas mašīnām un RF dielektriskajām presēm. Karstā gaisa hermetizācijas iekārtas savieno un sapludina PVC balonu kameras, savukārt RF metinājumi veido augstas izturības hermētiskas šuves, kas pārsniedz EN ISO 25649 prasības.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'FRP veidnes un kompozītu izgatavošana'
      description: 'Pielāgotas FRP veidnes SUP komponentiem, kas izgatavotas, izmantojot stikla šķiedras rokas pārklāšanas veidošanu ar poliesteru un vinilesteru sveķu sistēmām. Katrs slānis tiek veltnēts ar rokām un iepakots vakuumā vienmērīgas kvalitātes nodrošināšanai. Želejvirsmas krāsošanas kabīne nodrošina augsta spīduma, UV izturīgu jūras apdari.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'SUP druka un noformējums'
      description: 'SUP dēļi tiek noformēti, izmantojot digitālo druku pilnkrāsu grafikai un sitiena druku logotipiem un atkārtojošiem rakstiem. Digitālie printeri rada fotokvalitātes klājuma dizainu, savukārt sitiena druka nodrošina izturīgas, košas zīmolu zīmes.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Galīgā montāža un aprīkošana'
      description: 'Montāžas līnija, kurā Drop-Stitch kodoli tiek pabeigti ar sānu sliedēm, tiek uzklāti EVA klājumi un uzstādīti spurņi, vārsti un piederumi. Katrs dēlis iziet 100 punktu montāžas kontrolsarakstu, ko apstiprina komandas vadītājs.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Kvalitātes testēšana un pārbaude'
      description: 'Katrs pabeigtais dēlis pirms nosūtīšanas iziet obligāto gaisa noturības testēšanu, šuvju atdalīšanas pārbaudi un pilnu sistēmu pārbaudi. Mūsu kvalitātes laboratorija darbojas neatkarīgi no ražošanas un ziņo tieši vadībai.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


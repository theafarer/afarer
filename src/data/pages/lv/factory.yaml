  system: 'Pielāgota ERP sistēma (Cindao Vatrad Group iekšējā sistēma) + fiziskas partiju etiķetes uz katra darba pasūtījuma'
  coverage: '100% ražošanas materiālu — PVC, Drop-Stitch audums, līmes, vārsti, furnitūra, iepakojums'
  records_retained: '10 gadi (saskaņā ar CE 2013/53/EU prasību)'
  suppliers:

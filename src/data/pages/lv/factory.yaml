intro:
  - 'Kā **Aquafarer LLC (ASV)** ražošanas struktūrvienība afarer Cindao operāciju komanda kontrolē katru ražošanas posmu — no izejvielu PVC un stikla šķiedras materiālu ierašanās līdz gatavā dēļa pēcpiegādes pārbaudei. Mūsu ražošanas objekts Cindao ekonomiskās attīstības zonā aizņem 12,000 kvadrātmetru un ietver specializētus cehus PVC griešanai, balonu termiskai hermetizācijai, FRP veidņu izgatavošanai, SUP digitālajai drukai, galīgajai montāžai un kvalitātes testēšanai.'
  - 'Integrējot dizainu, inženieriju, prototipu izstrādi, ražošanu un testēšanu zem viena jumta, mēs novēršam līgumražošanas neefektivitāti un saglabājam tiešu kontroli pār izgatavošanas kvalitāti, materiālu izvēli un piegādes termiņiem. Katrs dēlis, kas pamet mūsu darbnīcu, ir uzbūvēts ar mūsu cilvēku rokām, ar mūsu iekārtām un atbilstoši mūsu standartiem.'


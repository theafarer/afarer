qc_section:
  tagline: 'Kvalitātes kontrole'
  title: 'Testēšanas un kvalitātes nodrošināšanas process'
  subtitle: 'Katrs dēlis pirms nosūtīšanas iziet obligātu testēšanu. Mūsu kvalitātes laboratorija darbojas neatkarīgi no ražošanas un ziņo tieši vadībai.'
  steps:
    - step: '1'
      title: 'Izejvielu pārbaude'
      desc: 'PVC un Drop-Stitch audumi pirms jebkuras partijas nonākšanas ražošanā iziet stiepes testēšanu (ASTM D751), plīsuma izplatības un UV izturības pārbaudi.'
    - step: '2'
      title: '24–48 stundu gaisa noturības tests'
      desc: 'Katra balonu kamera tiek piepūsta līdz 125% no nominālā spiediena un noturēta 24–48 stundas. Spiediena kritums, kas pārsniedz 5%, izraisa automātisku noraidījumu un šuvju atkārtotu pārbaudi.'
    - step: '3'
      title: 'Slodzes un līdzsvara testēšana'
      desc: 'Pabeigtie dēļi tiek slodzēti līdz maksimālajai nominālajai ietilpībai un testēti uz stabilitāti un stingrību. Katrs dēlis pirms gala pārbaudes tiek testēts ūdenī.'

oem_section:
  tagline: 'OEM projekti'
  title: 'Zīmolu un OEM partnerības gadījumu piemēri'
  subtitle: 'No koncepta līdz konteineram — kā mēs palīdzam globālajiem zīmoliem uzsākt un paplašināt to piepūšamo SUP līnijas.'
  cases:
    - challenge: 'Eiropas āra aktivitāšu mazumtirgotājam bija nepieciešama SUP līnija ar privāto zīmolu, unikālu klājuma grafiku, videi draudzīgu PVC un tirdzniecībai gatavu iepakojumu — viss jānogādā 60 dienu laikā.'
      solution: 'Izstrādājām pielāgotus digitālās drukas failus, iegādājāmies REACH atbilstošu PVC un saīsinājām paraugu izstrādi no 3 kārtām uz 1, izvietojot dizaina komandu mūsu Cindao rūpnīcā.'
      result: '55 dienas no parakstīta pirkuma pasūtījuma līdz FOB. 2,400 vienības 4 SKU klāstā. Atkārtots pasūtījums iesniegts pirms pirmā konteinera ierašanās.'
    - challenge: 'ASV ūdenssporta jaunuzņēmumam bija nepieciešams augstas veiktspējas Drop-Stitch SUP ar pielāgotu formu, kopīga zīmola iepakojumu un BSCI sertifikātu izvietošanai mazumtirdzniecībā.'
      solution: 'Pielāgojām esošo SUP veidni ar mainītu kontūru, izstrādājām kopīga zīmola iepakojuma māksliniecisko noformējumu un sniedzām pilnu BSCI audita dokumentāciju.'
      result: 'Veiksmīgi iekļauts 3 lielu ASV āra aktivitāšu tīklu sortimentā. 5,000+ vienības pirmajā gadā ar 98% realizācijas līmeni.'
    - challenge: 'Austrālijas izplatītājam bija nepieciešama CE sertificēta SUP līnija ar pielāgotām krāsām un atbilstība Austrālijas standartiem.'
      solution: 'Izgatavojām pirmsražošanas paraugus ar 4 krāsu variantiem un koordinējām neatkarīgu trešās puses atbilstības testēšanu.'
      result: '3 modeļu SUP līnija uzsākta AU/NZ tirgū. Vēlāk iegūta uzvara valsts konkursā uz 12 patrūļas SUP.'

faq_section:
  tagline: 'BUJ'
  title: 'B2B un OEM biežāk uzdotie jautājumi'
  questions:
    - q: 'Kāds ir minimālais pasūtījuma daudzums (MOQ) OEM piepūšamajiem SUP dēļiem?'
      a: 'MOQ sākas no 5–10 vienībām standarta OEM modeļiem. Pielāgotu veidņu un privātā zīmola projektiem atkarībā no sarežģītības ir nepieciešamas vismaz 200 vienības. Jaunu zīmolu palaišanai ir pieejami izmēģinājuma pasūtījumi un paraugu partijas.'
    - q: 'Vai afarer ir BSCI sertifikāts?'
      a: 'Jā. Mūsu rūpnīca uztur derīgu BSCI sociālās atbilstības sertifikātu (audita pārskats pieejams pēc pieprasījuma). Mums ir arī ISO 9001 kvalitātes vadības sertifikāts, un visiem produktiem ir CE sertifikāts. Ar katru OEM sūtījumu tiek piegādāta REACH un RoHS atbilstības dokumentācija.'
    - q: 'Kāds ir tipiskais izpildes laiks OEM pasūtījumam?'
      a: 'Standarta izpildes laiks lielapjoma OEM ražošanai ir 30–45 dienas no apstiprināta pirkuma pasūtījuma un priekšapmaksas. Pielāgotu veidņu izstrāde pievieno 15–20 dienas. Steidzamiem pasūtījumiem un sezonas pieprasījuma pikiem ir pieejama paātrinātā ražošana. Prototipu paraugi parasti tiek nosūtīti 15–20 dienu laikā.'
    - q: 'Vai jūs varat nosūtīt kravu FOB Cindao vai CIF uz mūsu ostu?'
      a: 'Jā. Mēs nosūtām FOB Cindao, CIF uz lielākajām pasaules ostām un DDP kvalificētiem partneriem. Mūsu loģistikas komanda pārvalda konteineru rezervēšanu, eksporta dokumentāciju un muitas formalitātes. Mēs piegādājam uz 50+ valstīm ES, ASV, AU un Āzijas tirgos.'

b2b_moq: 'Standarta MOQ: 5–10 vienības uz modeli. Jaunām partnerībām laipni gaidāmi izmēģinājuma pasūtījumi.'

production_flow:
  tagline: 'Ražošanas plūsma'
  title: 'No materiāla līdz gatavam dēlim'
  subtitle: 'Katrs dēlis iziet 6 ražošanas posmus ar kvalitātes kontroles punktiem katrā solī. Bez saīsinājumiem, bez izlaistām pārbaudēm.'
  stages:
    - stage: '01'
      title: 'Materiālu saņemšana un ienākošā kvalitātes kontrole'
      description: 'Visi ienākošie materiāli tiek reģistrēti pēc partijas numura mūsu ERP sistēmā. PVC auduma ruļļi, Drop-Stitch kodoli, vārsti, līmes un furnitūra tiek turēti karantīnā līdz kvalitātes kontroles apstiprinājumam.'
      qc_check: 'Stiepes izturība (ASTM D751), plīsumizturība (ISO 4674), biezuma mērījums, līmes viskozitāte, vizuālo defektu skenēšana'
      qc_threshold: 'Testētas 100% partiju. Noraidīt, ja stiepe < 90% no specifikācijas, plīsums < min. specifikācijas vai konstatēts jebkurš vizuāls defekts'
      responsibility: 'Ienākošās kvalitātes kontroles komanda (3 pārbaudītāji)'
    - stage: '02'
      title: 'CNC griešana un materiālu sagatavošana'
      description: 'Ar datoru optimizēts izkārtojums izvieto paneļus uz PVC krājumiem, lai samazinātu atkritumus. Automātiskās CNC griešanas mašīnas uztur 0.1 mm pozicionēšanas precizitāti.'
      qc_check: 'Izmēru pārbaude pret CAD DXF failiem, šķautnes kvalitātes pārbaude, paneļu skaita verificēšana'
      qc_threshold: 'Katrs 20. panelis tiek izmērīts. Tolerance ±0.5 mm. Noraidīt partiju, ja >2% ārpus tolerances'
      responsibility: 'Griešanas ceha vadītājs'
    - stage: '03'
      title: 'Metināšana un Drop-Stitch savienošana'
      description: 'Drop-Stitch kodoli tiek savienoti ar ārējiem PVC laminātiem, izmantojot termisko lamināciju. Balonu kameras tiek metinātas ar RF vai karstā gaisa metināšanu. Sānu joslas tiek savienotas ar trīsslāņu kausēšanas metodi.'
      qc_check: 'Atdalīšanas tests ik 50 vienības (ASTM D751), metinājuma platuma mērījums, karstā gaisa temperatūras žurnāla pārskats, vizuāla šuvju pārbaude pret gaismu'
      qc_threshold: 'Atdalīšanas izturība vismaz 8 N/cm. Metinājuma platuma tolerance ±1 mm. Jebkurš redzams defekts = noraidījums'
      responsibility: 'Metināšanas kvalitātes kontrole (2 pārbaudītāji maiņā)'
    - stage: '04'
      title: 'Montāža un aprīkošana'
      description: 'Dēļi nonāk galīgajā montāžā, kur tiek savienoti visi komponenti: sānu malas tiek pielīmētas un metinātas, uzstādīti vārsti, D-gredzeni, rokturi, spurņu kastes un pārnēsāšanas maisi. Katra vienība iziet 100 punktu montāžas kontrolsarakstu.'
      qc_check: '100 punktu kontrolsaraksta apstiprinājums katrai vienībai, vārsta darbības tests (10 atvēršanas/aizvēršanas cikli), furnitūras pievilkšanas momenta pārbaude, vizuāla pārbaude'
      qc_threshold: 'Nulles defektu politika drošībai kritiskajiem elementiem (vārsti, D-gredzeni, rokturi). Nelieli kosmētiskie defekti: AQL 2.5 (ISO 2859)'
      responsibility: 'Montāžas komandas vadītājs + līnijas kvalitātes kontrole'
    - stage: '05'
      title: 'Spiediena testēšana un kvalitātes aizture'
      description: 'Katra kamera tiek piepūsta līdz 1,25× nominālajam spiedienam (parasti 20–25 PSI) un noturēta 24–48 stundas. Spiediena sensori reģistrē rādījumus nepārtraukti. Kameras ar spiediena kritumu, kas pārsniedz 5%, tiek noraidītas un nosūtītas šuvju atkārtotai pārbaudei.'
      qc_check: '24–48 h spiediena noturēšanas žurnāls, sensoru kalibrācija pārbaudīta katru dienu, ar temperatūru kompensēts spiediena rādījums, šuvju atkārtots tests pēc remonta'
      qc_threshold: 'Maksimāli 5% spiediena kritums 24–48 h laikā pie stabila temperatūras režīma. Jebkura kamera, kas pārsniedz šo robežu = 100% atkārtota visas ražošanas partijas testēšana'
      responsibility: 'Kvalitātes laboratorija (neatkarīga no ražošanas, ziņo vadībai)'
    - stage: '06'
      title: 'Gala pārbaude un iepakošana'
      description: 'Gala vizuālā un funkcionālā pārbaude. Virsmas defekti, krāsas viendabīgums, etiķešu/BIN pārbaude, iepakojuma integritāte un piederumu pilnīgums. Vienības tiek iepakotas vakuumā, kastēs un uz paletēm konteineru iekraušanai.'
      qc_check: 'Pilna vizuālā pārbaude, piederumu kontrolsaraksts katram SKU, iepakojuma kritiena tests (1 m, nejauša izlase), etiķetes/svītrkoda skenēšanas pārbaude'
      qc_threshold: 'AQL 2.5 lielajiem defektiem, AQL 4.0 nelielajiem. Nulles tolerance drošības defektiem. Vizuāli pārbaudītas 100% vienību'
      responsibility: 'Gala kvalitātes kontroles komanda (4 pārbaudītāji) + iepakošanas komandas vadītājs'


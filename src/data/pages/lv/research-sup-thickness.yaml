content_html: |
  <h2>Trīs standarta biezumi</h2>

  <h3>4" (10 cm) – tūrismam un veiktspējai</h3>
  <ul>
    <li>Vislielākā stingrība – mazāka elastība zem slodzes</li>
    <li>Visviegliākais – mazāk materiāla, mazāks gaisa tilpums</li>
    <li>Izcila taisnvirziena noturība – mazāka šūpošanās no sāniem uz sāniem</li>
    <li>Ātrākais – mazāka pretestība, vieglāka slīdēšana</li>
    <li>Vispiemērotākais: tūrismam, sacensībām, fitnesa airēšanai, pieredzējušiem airētājiem</li>
  </ul>

  <h3>5" (12.7 cm) – universāls</h3>
  <ul>
    <li>Laba stingrība – līdzsvarots elastības un stingrības attiecība</li>
    <li>Vidējs svars – standarta materiālu patēriņš</li>
    <li>Laba pamat- un sekundārā stabilitāte</li>
    <li>Vispiemērotākais: atpūtas airēšanai, iesācējiem, ikvienai ezeru un upju lietošanai</li>
  </ul>

  <h3>6" (15.2 cm) – stabilitātei un jogai</h3>
  <ul>
    <li>Visaugstākā pamatstabilitāte – milzīga peldspēja</li>
    <li>Smagākais – vairāk PVC materiāla, lielāks gaisa tilpums</li>
    <li>Lēnākais – lielāka pretestība, grūtāk uzturēt slīdēšanu</li>
    <li>Vispiemērotākais: jogai/fitnesam, smagākiem airētājiem (100+ kg), ļoti viļņotiem apstākļiem</li>
  </ul>

  <h2>Inženierijas analīze</h2>
  <p>Piepūšamā SUP stingrību nosaka iekšējais gaisa spiediens un dēļa šķērsgriezuma inerces moments. Pie 20 PSI 4" dēlis zem slodzes izrāda aptuveni par 30% mazāku izlieci nekā tāda paša platuma un garuma 6" dēlis. Pamatstabilitāte nāk no ūdenslīnijas platuma un peldspējas; sekundāro stabilitāti ietekmē sānu malas forma un dēļa platums.</p>

  <h2>Biezums pēc airētāja svara</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Airētāja svars</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Ieteicamais biezums</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Zem 65 kg (143 mārciņas)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 mārciņas)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 mārciņas)</td><td class="p-3 border">5" vai 6"</td></tr>
      <tr><td class="p-3 border">Virs 115 kg (253 mārciņas)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Biezuma un PSI attiecība</h2>
  <p>Izplatīts maldoms ir tas, ka augstāks PSI var kompensēt pārmērīgu biezumu. Pie 25 PSI 6" dēlis izrāda lielāku elastību nekā 4" dēlis pie 15 PSI, jo stingrības vienājumā dominē ģeometriskais inerces moments. Uz veiktspēju orientētiem airētājiem tievāks dēlis zemākā spiedienā pārspēj biezāku dēli augstākā spiedienā.</p>

  <h2>Afarer klāsts</h2>
  <ul>
    <li><strong>4" dēļi:</strong> Cheetah Touring sērija – 12' x 30" x 4" tūrisma SUP dēļi fitnesam un tālsatiksmei</li>
    <li><strong>5" dēļi:</strong> Cheetah All-Round sērija – 10'6" x 32" x 5" atpūtas lietošanai</li>
    <li><strong>6" dēļi:</strong> Cheetah Ultra-Stable sērija – 10' x 34" x 6" jogai, liela auguma airētājiem un fotogrāfiju platformām</li>
  </ul>
  <p>Visi dēļi izmanto 1,680 DTEX Drop-Stitch kodolus ar 20 PSI nominālo spiedienu un 1.2 mm PVC laminātiem.</p>


      description: Afarer sadarbojas ar ekskluzīviem izplatītājiem daudzās valstīs. Pasakiet, kur airējat, un mēs jūs savienosim ar vietējo tirgotāju, cenām un pieejamību.
      cta: Atrodiet savu vietējo tirgotāju
      href: /contact/?subject=Where to Buy
    - title: Pasūtiet tieši no Afarer
      description: Jūsu valstī vēl nav izplatītāja? Afarer komanda var nokārtot tiešos pasūtījumus un piegādi, lai jūs varētu doties ūdenī, kur vien jūs dzīvojat.
      cta: Vaicāt par pieejamību
      href: /contact/?subject=Where to Buy
form_intro:
  title: Vaicājiet par pieejamību
  subtitle: Atsūtiet mums ziņu ar savu valsti un jūs interesējošo dēli. Mūsu komanda atbildēs vienas darba dienas laikā ar tuvāko tirgotāju vai tieša pasūtījuma iespējām.
business_note:
  text: Pērkat klubam, kūrortam vai veikalam? Iepazīstieties ar mūsu biznesa un partnerības programmām.

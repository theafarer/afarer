meta:
  title: Kur iegādāties Afarer piepūšamos SUP dēļus | Afarer
  description: Uzziniet, kā iegādāties Afarer piepūšamo SUP dēli — caur oficiālo izplatītāju savā valstī vai tieši no Afarer komandas. Pasakiet, kur airējat, un mēs norādīsim jūsu tuvāko tirgotāju.
hero:
  tagline: Kur iegādāties
  title: Dabūjiet savu Afarer SUP ūdenī
  subtitle: Afarer dēļus izmanto airētāji vairāk nekā 50 valstīs. Atrodiet vienkāršāko veidu, kā iegūt savējo — caur tuvumā esošo oficiālo izplatītāju vai tieši no Afarer komandas.
channels:
  items:

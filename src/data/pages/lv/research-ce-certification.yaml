content_html: |
  <h2>Kas ir CE sertifikācija?</h2>
  <p>CE marķējums (Conformit&eacute; Europ&eacute;enne) norāda, ka produkts atbilst ES veselības, drošības un vides prasībām. Piepūšamajiem peldlīdzekļiem piemērojamais regulatīvais ietvars atkarīgs no produkta kategorijas.</p>

  <h2>Piemērojamās direktīvas</h2>

  <h3>Atpūtas peldlīdzekļu direktīva (2013/53/EU)</h3>
  <p>Galvenā direktīva atpūtas peldlīdzekļiem ES. Piepūšamie SUP dēļi zem 2.4 m neietilpst tās darbības jomā un tiek sertificēti saskaņā ar EN ISO 25649.</p>

  <h3>Personīgo aizsardzības līdzekļu regula (2016/425)</h3>
  <p>Glābšanas vestēm, peldspējas līdzekļiem un drošības aprīkojumam, kas tiek piegādāts kopā ar peldlīdzekļiem, jāatbilst Personīgo aizsardzības līdzekļu regulas prasībām, tostarp tipa pārbaudei (B modulis), ko veic paziņotā iestāde, un ražošanas kvalitātes nodrošinājumam (D vai E modulis).</p>

  <h2>Sertifikācijas process</h2>
  <ol>
    <li>Produkta klasifikācija: nosaka peldlīdzekļa dizaina kategoriju (A – D saskaņā ar ISO 8666)</li>
    <li>Piemērojamie standarti: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (ražotāja plāksne)</li>
    <li>Tehniskās datnes sagatavošana: dizaina rasējumi, materiālu specifikācija, materiālu sertifikāti, riska izvērtējums</li>
    <li>Tipa testēšana: peldspēja, stabilitāte, kravnesība, materiālu testēšana, šuvju stiprība, gaisa noturība</li>
    <li>Rūpnīcas ražošanas kontrole: paziņotās iestādes audits ražošanas procesos</li>
    <li>Atbilstības deklarācija: ražotājs paraksta DoC un piestiprina CE marķējumu</li>
  </ol>

  <h2>Paziņotās iestādes piepūšamajiem peldlīdzekļiem</h2>
  <p>Biežākās paziņotās iestādes ir Bureau Veritas (Francija), DNV GL (Vācija), RINA (Itālija), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Vācija).</p>

  <h2>Laika grafiks un izmaksas</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Posms</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Ilgums</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tipiskās izmaksas (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Tehniskās datnes sagatavošana</td><td class="p-3 border">2 – 4 nedēļas</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Tipa testēšana</td><td class="p-3 border">4 – 8 nedēļas</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Rūpnīcas audits</td><td class="p-3 border">1 – 2 dienas (uz vietas)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Kopā (pirmais produkts)</td><td class="p-3 border">8 – 14 nedēļas</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Ko tas nozīmē pircējiem</h2>
  <p>Pērkot CE sertificētus piepūšamos SUP dēļus, vienmēr pārbaudiet, ka CE marķējums ir uz ražotāja plāksnes, ka pastāv derīga atbilstības deklarācija, ka ir norādīts paziņotās iestādes numurs un ka lietošanas instrukcijā ir drošības norādījumi jūsu vietējā valodā. Visi Afarer produkti nes CE sertifikāciju ar pilnu izsekojamību līdz paziņotās iestādes audita atskaitēm.</p>


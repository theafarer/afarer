intro: 'Atšķirībā no zīmoliem, kas ražošanu uztic trešo pušu rūpnīcām, afarer pieder un tiek pārvaldīta visa tā ražošanas ķēde. Šāda vertikālā integrācija ļauj mums uzturēt stingru kvalitātes kontroli katrā posmā, ātri reaģēt uz pielāgotām prasībām un nodrošināt konsekventu produktu kvalitāti partiju pēc partijas. Tātad — kā mūsu ražotnē tiek būvēts dēlis.'

steps:
  - step: '01'
    title: 'Materiālu saņemšana un pārbaude'
    description: 'Katra ienākošā PVC auduma, stiklšķiedas paklāja, sveķu un furnitūras partija tiek pārbaudīta pret specifikāciju. Auduma paraugi pirms nodošanas ražošanai tiek testēti uz stiepes stiprību, biezuma viendabīgumu un UV izturību. Neatbilstoši materiāli tiek izolēti un atgriezti.'
    duration: '1–2 dienas'
  - step: '02'
    title: 'Automatizēta PVC griešana'
    description: 'Apstiprinātie audumi tiek uzlikti uz automatizētā CNC griešanas mašīnas un sagriezti ar submilimetra precizitāti. Datoroptimizēta izkārtojuma plānošana izvieto paneļus tā, lai minimizētu atkritumus — parasti zem 5%. Sagrieztie paneļi tiek marķēti pēc dēļa modeļa un kameras, tad sasegti pārvadāšanai uz metināšanas darbnīcu.'
    duration: '2–4 stundas uz dēļa komplektu'
  - step: '03'
    title: 'Cauruļu termiskā lodēšana un metināšana'
    description: 'Paneļi tiek piestiprināti un savienoti, izmantojot termiskās lodēšanas mašīnas ar karstā gaisa metināšanu kontrolētā 200–300 °C temperatūrā. Galvenās šuves tiek pastiprinātas ar RF dielektrisko metināšanu, iegūstot hermētiskus, augstas stiprības savienojumus. Pabeigtās kameras tiek piepūstas līdz 1,5× darba spiedienam 30 minūšu gaisa noturības pārbaudei.'
    duration: '1–2 dienas uz dēli'
  - step: '04'
    title: 'SUP drukāšana un noformējums'
    description: 'SUP dēļu klāja grafika tiek uzklāta, izmantojot digitālo druku pilnkrāsu fotokvalitātes dizainiem un situ druku izturīgiem logotipiem un atkārtojošiem rakstiem. Drukas tiek sacietētas un aizzīmogotas UV un berzes izturībai.'
    duration: '1–2 dienas'
  - step: '05'
    title: 'Gala montāža un aprīkošana'
    description: 'Dēļi tiek aprīkoti montāžas līnijā ar spurēm, vārstiem, EVA klājiem un aksesuāriem. Katra vienība seko 100 punktu montāžas kontrolsarakstam ar obligātu apstiprinājumu katrā posmā.'
    duration: '2–4 dienas'
  - step: '06'
    title: 'Kvalitātes testēšana un pārbaude'
    description: 'Katrs pabeigtais dēlis iziet obligāto kvalitātes vārtu pārbaudi: kameras gaisa noturības tests, furnitūras funkcionalitātes pārbaude, stiprinājumu skrūvēšanas momenta verifikācija un vizuālā pārbaude. Pielāgotie un prototipa būvējumi papildus saņem izmēģinājumus ūdenī, pārbaudot stabilitāti un vadāmību.'
    duration: '1–2 dienas'
  - step: '07'
    title: 'Iepakošana un nosūtīšana'
    description: 'Dēļi tiek izlaists gaiss, salocīti saskaņā ar procedūru, iepakoti izturīgos auduma maisos vai finiera kastēs un iekrauti nosūtīšanai. Katra pakete ir marķēta ar modeli, sērijas numuru un galamērķi. Mēs sadarbojamies ar kravu ekspeditoriem FCL un LCL konteineru sūtījumiem visā pasaulē.'
    duration: '1 diena'


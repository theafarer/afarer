hero:
  tagline: 'Partneri un izplatīšana'
  title: 'Kļūstiet par afarer partneri<br />— globāls izplatīšanas tīkls'
  subtitle: 'Pievienojieties afarer globālajam partneru tīklam. Mēs sadarbojamies ar jūras aprīkojuma izplatītājiem, airu sporta tirgotājiem, aprīkojuma mazumtirgotājiem un zīmolu partneriem 50+ valstīs.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: 'afarer globālais partneru un izplatītāju tīkls'
content_programs:
  tagline: 'Partneru programmas'
  title: 'Partneru programmas,<br />veidotas izaugsmei'
  subtitle: 'Neatkarīgi no tā, vai esat izplatītājs, tirgotājs vai zīmola partneris, afarer piedāvā programmas, kas radītas, lai atbalstītu jūsu uzņēmumu.'
  columns: 3
  items:
    - title: 'Izplatītāju programma'
      description: 'Ekskluzīva izplatīšana teritorijā ar apjoma cenām, mārketinga atbalstu un tiešu piekļuvi rūpnīcai. Nepieciešama minimālā apņemšanās atkarībā no teritorijas lieluma.'
      icon: tabler:world
    - title: 'Tirgotāju programma'
      description: 'Tiešās tirgotāju cenas, produktu apmācība, mārketinga materiāli un garantijas atbalsts mazumtirdzniecības vietām un interneta veikaliem.'
      icon: tabler:building-store
    - title: 'OEM/ODM partnerība'
      description: 'Pilna servisa OEM un ODM ražošana ar pielāgotu zīmolradi, iepakojumu un produkta specifikācijām. No koncepta līdz konteinerim.'
      icon: tabler:certificate
    - title: 'Zīmolu partnerība'
      description: 'Kopīgs zīmols, privātais zīmols un ekskluzīvas modeļu programmas etabliem zīmoliem jūras un āra atpūtas nozarē.'
      icon: tabler:stars
    - title: 'Valsts un institucionālie klienti'
      description: 'Priekšrocību piegādātāju programmas valsts iestādēm, krasta apsardzei, armijai un humānitārajām organizācijām. Konkursu dokumentācija gatava.'
      icon: tabler:building-community
    - title: 'Kūrortu un nomas partneri'
      description: 'Flotes cenas, nemainīga kvalitāte un pielāgota zīmolrade kūrortiem, niršanas centriem un nomas operatoriem visā pasaulē.'
      icon: tabler:sun
content_benefits:
  tagline: 'Kāpēc sadarboties ar mums'
  title: 'Kāpēc partneri izvēlas afarer'
  subtitle: 'Mūsu partneri gūst labumu no īstām ražošanas spējām, nemainīgas kvalitātes un atsaucīga atbalsta.'
  list:
    - 'Tieša piekļuve rūpnīcai: strādājiet tieši ar mūsu ražošanas komandu — bez starpniekiem. Iegūstiet ātrākas atbildes, labākas cenas un pilnīgu ražošanas pārredzamību.'
    - 'Gatavība pielāgošanai: piešķiriet saviem produktiem pielāgotas krāsas, logotipus, iepakojumu un specifikācijas. Minimālie pasūtījuma apjomi pielāgoti jūsu tirgum.'
    - 'Garantēta kvalitāte: ISO 9001 sertificēta ražošana ar CE, UKCA un BSCI atbilstību. Katrs produkts pirms nosūtīšanas tiek testēts.'
    - 'Globālā loģistika: nosūtīšana no Cindao, Ķīnā ar FOB, CIF un DDP opcijām. ASV noliktava Montklērā, Kalifornijā, Ziemeļamerikas izplatīšanai.'
    - 'Mārketinga atbalsts: produktu katalogi, fotogrāfijas, tehniskā dokumentācija un digitālie materiāli jūsu pārdošanas atbalstam.'
    - 'Apmācība un atbalsts: produktu apmācība jūsu pārdošanas komandai, tehniskais atbalsts jūsu klientiem un garantijas servisa koordinācija.'
content_process:
  tagline: 'Kā kļūt par partneri'
  title: 'Vienkāršs partnerības process'
  subtitle: 'Mūsu partnerības process ir vienkāršs — izstrādāts, lai jūs varētu ātri sākt pārdot afarer produktus.'
  items:
    - title: '1. solis: iesniedziet pieteikumu'
      description: 'Aizpildiet mūsu partneru pieteikuma formu, norādot savu uzņēmuma profilu, mērķa tirgu un produktu intereses.'
    - title: '2. solis: kvalifikācijas izvērtēšana'
      description: 'Mūsu partnerības komanda izskata jūsu pieteikumu un 3 darba dienu laikā sazinās ar jums, lai apspriestu iespējas.'
    - title: '3. solis: līgums un iestatīšana'
      description: 'Parakstiet partnerības līgumu, izveidojiet savu kontu un saņemiet partneru cenas, mārketinga materiālus un produktu paraugus.'
    - title: '4. solis: apmācība un startēšana'
      description: 'Tiek nodrošināta produktu apmācība, pārdošanas atbalsts un mārketinga materiāli. Jūs esat gatavi sākt pārdot.'
cta:
  title: 'Gatavi kļūt par afarer partneri?'
  subtitle: 'Pieteicieties partnerībai, un mūsu komanda atbildēs 3 darba dienu laikā.'
  actions:
    - variant: primary
      text: 'Pieteikties partnerībai'
      href: /contact
    - text: 'Apskatiet mūsu produktus'
      href: /products

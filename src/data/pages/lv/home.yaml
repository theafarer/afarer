who_we_serve:
  tagline: 'Brauciet kopā ar mums'
  title: 'Radīts jūsu braukšanas stilam'
  subtitle: 'No pirmā aira viciena līdz garākajam maršrutam — un klubiem, kūrortiem un mazumtirgotājiem, kas palīdz cilvēkiem airēt.'
  items:
    - title: 'Iesācēji un atpūtas braucēji'
      keywords: 'iesācēja piepūšamais SUP, universālais airu dēlis, stabils SUP'
      description: 'Plati, stabili universālie dēļi, ar kuriem pirmais aira viciens šķiet dabisks un kas uztur līdzi, attīstoties jūsu prasmēm.'
      icon: tabler:users
      cta: 'Atrodiet savu pirmo dēli'
      link: /all-around-sup
    - title: 'Tūrisma un piedzīvojumu airētāji'
      keywords: 'tūrisma SUP, tālsatiksmes airu dēlis, ekspedīcijas SUP'
      description: 'Garāki, šaurāki dēļi, kas radīti, lai turētu taisnu virzienu, slīdētu tālāk un nestu kravu vairāku dienu maršrutiem.'
      icon: tabler:building
      cta: 'Iepazīstieties ar tūrisma dēļiem'
      link: /touring-sup
    - title: 'Klubi, kūrorti un nomas'
      keywords: 'SUP nomas flote, airu kluba aprīkojums, kūrorta ūdens aktivitātes'
      description: 'Flotei gatavi piepūšamie SUP dēļi ar uzticamu izturību, vienkāršu apkopi un rezerves daļu atbalstu.'
      icon: tabler:shopping-cart
      cta: 'Izveidojiet savu floti'
      link: /solutions
    - title: 'Valsts izplatītāji un kopīga zīmola partneri'
      keywords: 'valsts izplatītājs SUP, kopīga zīmola SUP, privātā zīmola SUP'
      description: 'Ekskluzīva izplatīšana pa valstīm un ierobežotas kopīga zīmola kolekcijas kvalificētiem ūdens sporta uzņēmumiem.'
      icon: tabler:package
      cta: 'Kļūstiet par partneri'
      link: /distributor-program

proof_points:

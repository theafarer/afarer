  description: 'Afarer ir piepūšamo SUP dēļu ražotājs un OEM/ODM partneris Cindao, Ķīnā — ISO 9001 sertificēta rūpnīca, kas izstrādā augstas veiktspējas piepūšamos airu dēļus atklātam ūdenim, tūrismam, jogai un piedzīvojumiem. Spiediena testēti dēļi pa vienam, kā arī OEM/ODM, privātā zīmola un izplatītāju programmas.'
  keywords:
    - 'augstas veiktspējas piepūšamais sup'

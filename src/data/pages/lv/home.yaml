who_we_serve:
  tagline: Airē Kopā Ar Mums
  title: Atrodi Savu Ceļu uz Ūdens
  subtitle: Katram airētājam ir sava priekšstats par piedzīvojumu. Atklāj Afarer SUP, kas veidots ap tavu airēšanas stilu.
  items:
    - title: Iesācēji un Vaļasprieka Airētāji
      keywords: piepūšams sup iesācējiem, daudzpusīgs pādelbords, stabils sup
      description: Plati, stabili daudzpusīgie bordi, ar kuriem pirmais airējiena vēziens šķiet dabisks un kas izaug līdzi ar tevi.
      icon: tabler:users
      cta: Atrodi Savu Pirmo Bordu
      link: /all-around-sup/
    - title: Tūrisms un Piedzīvojumi
      keywords: tūrisma sup, garās distances pādelbords, ekspedīcijas sup
      description: Garāki, šaurāki bordi, kas notur kursu, slīd tālāk un pārvadā ekipējumu vairāku dienu maršrutiem.
      icon: tabler:building
      cta: Izpēti Tūrisma SUP
      link: /touring-sup/
    - title: Joga un Fitness
      keywords: jogas sup, fitness pādelbords, plats stabils sup
      description: Platas, stabilas platformas ar kustības telpu — saullēkta plūsmām, treniņiem un līdzsvaram mierīgā ūdenī.
      icon: tabler:heart
      cta: Izpēti Jogas SUP
      link: /yoga-sup/
    - title: Makšķerēšana un Ģimene
      keywords: makšķerēšanas sup, ģimenes pādelbords, stabila makšķerēšanas platforma
      description: Stabilas, praktiskas platformas makšķerēšanai, airēšanai ar bērniem un garām, relaksējošām dienām uz ūdens.
      icon: tabler:users
      cta: Izpēti Makšķerēšanas SUP
      link: /fishing-sup/
proof_points:
  title: Pārbaudīts vairāk nekā izstāžu zālē
  subtitle: Dizains, veiktspēja un kvalitāte, ko varat pārbaudīt — uz ūdens un skaitļos.
  items:
    - metric: 10+
      label: Gadi, projektējot ūdenim
      detail: Kopš 2012. gada, pilnveidots dēli pa dēlim
    - metric: 50+
      label: Valstis uz ūdens
      detail: Airētāji un partneri visā pasaulē
    - metric: 12–15
      label: PSI Drop-Stitch kodols
      detail: Stingrs, kur tas svarīgi, ērti salokāms
    - metric: 100%
      label: Spiediena testēts katrs dēlis
      detail: Pārbaudīts pirms nosūtīšanas
business_solutions:
  tagline: Kāpēc Tas Brauc Citādi
  title: Veiktspēja, ko Sajūti jau Pirmajā Vēzienā
  subtitle: Četri pīlāri, ko veidojis īstais ūdens — veiktspēja, dizains, konstrukcija un kvalitāte.
  items:
    - title: Veiktspēja uz Ūdens
      description: Formas, pielāgotas stabilitātei, slīdēšanai un pārliecībai viļņos — katrs vēziens paliek sasaistīts ar ūdeni.
      icon: tabler:shield-check
    - title: Izteiksmīgs Dizains
      description: Kolekcijas, ko iedvesmojušas paisumi, savvaļa un krasta enerģija — bordi, ar kuriem vēlies būt redzams.
      icon: tabler:package
    - title: Pārbaudīta Konstrukcija
      description: Augsta blīvuma drop-stitch kodoli, pastiprinātas malas un kausējumā laminētas šuves atkārtotai lietošanai.
      icon: tabler:headset
    - title: Pārbaudīta Kvalitāte
      description: Spiedienā testēti, vizuāli pārbaudīti un nodrošināti ar skaidru garantiju un atsaucīgu pēcpārdošanas atbalstu.
      icon: tabler:truck-delivery

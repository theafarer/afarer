  title: Piepūšamie Pādelbordi Katram Piedzīvojumam
  slogan: Brauc tālāk. Airē spēcīgāk.
  subtitle: Atklāj airēšanas brīvību ar Afarer. Izpēti rūpīgi izstrādātus piepūšamos SUP relaksējošām dienām ezerā, piekrastes piedzīvojumiem, fitnesam un visam, kas pa vidu.

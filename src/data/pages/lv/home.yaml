      detail: 'Pārbaudīts pirms nosūtīšanas'

business_solutions:
  tagline: 'Kāpēc brauciens ir atšķirīgs'
  title: 'Veiktspēja, ko izjūtat jau ar pirmo aira vicienu'
  subtitle: 'Četri pīlāri, veidoti pēc īsta ūdens — veiktspēja, dizains, konstrukcija un kvalitāte.'
  items:
    - title: 'Veiktspēja uz ūdens'
      description: 'Formas, noregulētas stabilitātei, slīdēšanai un pārliecībai viļņos — lai katrs aira viciens justos saistīts ar ūdeni.'
      icon: tabler:shield-check
    - title: 'Izteiksmīgs dizains'
      description: 'Kolekcijas, iedvesmotas no plūdmaņu, savvaļas dzīvniekiem un piekrastes enerģijas — dēļi, ar kuriem vēlaties tikt redzēti.'
      icon: tabler:package
    - title: 'Pārbaudīta konstrukcija'
      description: 'Augsta blīvuma Drop-Stitch kodoli, pastiprinātas sānu malas un fūzijas laminētas šuves, radītas atkārtotai lietošanai.'
      icon: tabler:headset
    - title: 'Pārbaudīta kvalitāte'
      description: 'Spiediena testēti, vizuāli pārbaudīti un nodrošināti ar skaidru garantiju un atsaucīgu pēcpārdošanas atbalstu.'
      icon: tabler:truck-delivery

oem_section:
  tagline: 'OEM / ODM un kopīga zīmola ražošana'
  title: 'No idejas līdz ūdenim — kopīga zīmola izdevumi'
  subtitle: 'Partneriem, kuri vēlas vairāk nekā kataloga produktu: OEM/ODM ražošana un ierobežotas kopīga zīmola kolekcijas, kuras Afarer izstrādā, konstruē un būvē — turpinot katru dēli saglabāt kā Afarer produktu.'
  steps:
    - number: '01'
      title: 'Ideja un uzdevums'
      desc: 'Dalieties ar savu vīziju, mērķa braucēju un ūdeni, kam dizainu veidojat.'
    - number: '02'
      title: 'Dizains un inženierija'
      desc: '3D modelēšana, materiālu izvēle un atšķirīgs grafiskais dizains.'
    - number: '03'
      title: 'Prototips un validācija'
      desc: 'Parauga dēļi tiek spiediena testēti un izmēģināti ūdenī, pirms jūs apņematies.'
    - number: '04'
      title: 'Ražošana apjomā'
      desc: 'Nemainīga, pārbaudīta ražošana ar kvalitātes kontroles punktiem katrā posmā.'
    - number: '05'
      title: 'Globāla piegāde'
      desc: 'Loģistika no Cindao uz lielajām ostām ar muitas atbalstu.'
  cta: 'Iepazīstieties ar kopīga zīmola iespējām'
  cta_link: /co-brand


distributor:
  tagline: 'Ekskluzīvie valstu izplatītāji'
  title: 'Viena valsts. Viens oficiālais Afarer izplatītājs.'
  subtitle: 'Programma «viena valsts — viens izplatītājs» ar teritorijas ekskluzivitāti, izplatītāju cenām, mārketinga atbalstu un īpašu izplatītāju atbalsta programmu.'
  benefits:
    - title: 'Teritorijas ekskluzivitāte'
      description: 'Viens autorizēts izplatītājs uz valsti vai reģionu — bez iekšējas konkurences un kanālu konfliktiem.'
    - title: 'Cenas tieši no rūpnīcas'
      description: 'Izplatītāju cenrāži un gada atlaides par apņēmības apjomiem, piegāde FOB Cindao.'
    - title: 'Mārketinga un apmācības atbalsts'
      description: 'Kopīga zīmola materiāli, izplatītāju tirdzniecības vietas materiāli, produktu apmācības un ieviešanas kampaņas.'
    - title: 'Atveltīta kontu komanda'
      description: 'Personīgs izplatītāju menedžeris, kā arī ievadapmācības, prognozēšanas un atkārtotu pasūtījumu atbalsts.'
  actions:
    - variant: primary
      text: 'Kļūt par izplatītāju'
      href: /distributor-program
    - text: 'Pieprasīt izplatītāju cenrādi'
      href: /contact?subject=Dealer Price List
    - text: 'Pieteikties valsts partnerībai'
      href: /contact?subject=Country Partnership Application
    - text: 'Lejupielādēt izplatītāju programmu'

timeline:
  - year: '2012'
    title: 'Jūras ražošanas pamats'
    body: 'afarer sākās kā specializēta peldlīdzekļu darbnīca Cindao, Ķīnā, kas bija veltīta jūras amatniecībai un peldlīdzekļu ražošanai. Agrīnais uzsvars bija uzticamu piepūšamo produktu radīšana, balstoties uz praktisko inženierijas pieredzi un ražošanas disciplīnu.'
  - year: '2015'
    title: 'Pirmais eksports un CE sertifikācija'
    body: 'Pirmie eksporta pasūtījumi sasniedza Japānu un Koreju. CE sertifikācija tika iegūta galvenajām produktu līnijām, atzīmējot afarer ienākšanu starptautiskajos tirgos. Uzņēmums sāka apkalpot komerciālos un atpūtas lietotājus arī ārpus Ķīnas.'
  - year: '2018'
    title: 'Rūpnīcas paplašināšana'
    body: 'Notika pārcelšanās uz 12,000 m² ražošanas objektu. Tika pievienotas RF metināšanas līnijas un Drop-Stitch ražošanas jauda, ļaujot lielāka mēroga ražošanu un uzlabotas kvalitātes kontroles sistēmas.'
  - year: '2020'
    title: 'Izveidots pētniecības un attīstības centrs'
    body: 'Tika atvērts atveltīts pētniecības un attīstības centrs ar PVC auduma laboratoriju, hidrodinamisko testu baseinu un CAD/FEA simulācijas studiju. Produktu izstrāde paplašinājās, koncentrējoties uz vieglu konstrukciju, uzlabotu izturību un uz lietotāju vērstu dizainu.'
  - year: '2022'
    title: 'Sertifikācija un globāla izaugsme'
    body: 'Tika iegūts ISO 9001 sertifikāts. Komanda paplašinājās līdz 14 pētniecības un attīstības inženieriem un vairāk nekā 200 strādniekiem. Produkti, izmantojot izplatītāju un kopīga zīmola partnerības, sasniedza klientus visā Eiropā, Amerikā un Āzijas un Klusā okeāna reģionā.'
  - year: '2024'
    title: 'Inovāciju un dizaina studija'
    body: 'Tika laista klajā pilna servisa dizaina un inovāciju studija pielāgotiem kopīga zīmola projektiem — no koncepta līdz ražošanai. Tika stiprinātas profesionālas jūras lietojumprogrammas, tostarp glābšanas, komerciālie un valsts līgumi.'
  - year: '2026'
    title: 'Nākotnes ūdens izpētes veidošana'
    body: 'Šodien afarer turpina izstrādāt SUP sistēmas un jūras aksesuārus — savienojot cilvēkus un organizācijas ar pasaules ūdeņiem. Apkalpotas 50+ valstis, gada jauda 15,000+ vienību.'

content_founding:
  tagline: 'Sākums'
  title: 'Dzimis piekrastē'
  subtitle: 'afarer sākās Cindao piekrastes darbnīcā ar vienu dēli un vīziju: radīt piepūšamus peldlīdzekļus, kas spētu tikt galā ar īstiem jūras apstākļiem.'
  paragraphs:
    - '2012. gadā mūsu dibinātāji pamanīja robu tirgū — vairums piepūšamo peldlīdzekļu bija vai nu pieejami, bet neuzticami, vai arī augstas kvalitātes, bet nesamērīgi dārgi. Viņi ticēja, ka ir vieta ražotājam, kas sniedz gan kvalitāti, gan vērtību.'
    - 'Pirmais korpuss tika uzbūvēts ar rokām, pārbaudīts vietējos ūdeņos un uzlabots, balstoties uz īstām zvejnieku un mazo komerciālo operatoru atsauksmēm. Šī atgriezeniskās saites cilpa — būvēt, testēt, klausīties, uzlabot — joprojām veido mūsu inženierijas filozofijas kodolu.'
    - 'Līdz 2015. gadam vēsts par mums bija izplatījusies aiz Cindao robežām. Starptautiskie izplatītāji sāka pieprasīt paraugus. Tas, kas sākās kā vietēja darbnīca, kļuva par globālu piegādātāju.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'afarer agrīnā ražošanas darbnīca un ražošana'

content_growth:
  tagline: 'Izaugsme un inovācijas'
  title: 'No darbnīcas līdz 12,000 m² objektam'
  subtitle: 'Nepārtrauktas investīcijas cilvēkos, aprīkojumā un procesos ir pārvērtušas afarer par modernu jūras ražošanas uzņēmumu.'
  paragraphs:
    - 'Pieaugot pieprasījumam, auga arī mūsu objekts. Mēs paplašinājāmies no mazas darbnīcas līdz 12,000 m² rūpnīcai ar atveltītām ražošanas līnijām SUP dēļiem un aksesuāriem.'
    - 'Mēs investējām CNC griešanas iekārtās, augstfrekvences metināšanas aprīkojumā, Drop-Stitch ražošanas līnijās un visaptverošās testēšanas iekārtās — tas ļauj mums kontrolēt katru ražošanas kvalitātes aspektu.'
    - 'Šodien mūsu komandā, kurā ir vairāk nekā 200 darbinieku, strādā jūras inženieri, materiālu zinātnieki, kvalitātes kontroles speciālisti un kvalificēti amatnieki — daudzi no viņiem ir ar afarer kopš pirmajām dienām.'

philosophy:
  tagline: 'Zīmola filozofija'
  title: 'Brīvības inženierija uz ūdens'
  body: 'Brīvība uz ūdens nav tikai kustība. Tā ietver jaunu vietu atklāšanu, āra pieredžu radīšanu, cilvēku savienošanu ar dabu un profesionālu misiju īstenošanu. Inženierija padara šo brīvību iespējamu.'
  pillars:
    - title: 'Uzticamība pirmajā vietā'
      body: 'Ūdens vide prasa uzticēšanos. afarer produkti ir izstrādāti, koncentrējoties uz stabilitāti, izturību, drošību un nemainīgu veiktspēju.'
    - title: 'Uz cilvēku vērsts dizains'
      body: 'Produktiem jākalpo cilvēkiem, nevis tehnoloģijām. Katrs dizaina lēmums sākas ar izpratni par to, kā cilvēki lieto peldlīdzekļus, kur viņi dodas izpētē un ar kādiem izaicinājumiem saskaras.'
    - title: 'Pieejama izpēte'
      body: 'Ūdens nedrīkst piederēt tikai ekspertiem. afarer rada aprīkojumu, kas ļauj vairāk cilvēkiem droši piedzīvot upes, ezerus, okeānus un piekrastes vides.'
    - title: 'Nepārtrauktas inovācijas'
      body: 'Inovācija nav tikai jaunu produktu radīšana. Tā ir katras detaļas pilnveide — materiāli, struktūras, ražošana un lietotāja pieredze.'

engineeringDna:
  tagline: 'Inženierijas DNS'
  title: 'Kā afarer rada produktus'
  areas:
    - title: 'Materiālu zinātne'
      body: 'afarer koncentrējas uz piemērotu materiālu izvēli dažādām jūras vidēm. Galvenie kritēriji ir pretestība berzei, UV izturība, spiediena stabilitāte un ilgtermiņa izturība.'
      items: ['Pretestība berzei', 'UV izturība', 'Spiediena stabilitāte', 'Ilgtermiņa izturība']
    - title: 'Strukturālā inženierija'
      body: 'Piepūšamajiem peldlīdzekļiem nepieciešama precīza stingrības, svara, pārvadājamības un stabilitātes līdzsvarošana. afarer inženierija koncentrējas uz šo faktoru optimizāciju, izmantojot Drop-Stitch kodola tehnoloģiju un progresīvu šuvju konstrukciju.'
      items: ['Stingrība', 'Svara optimizācija', 'Pārvadājamība', 'Stabilitāte']
    - title: 'Ražošanas precizitāte'
      body: 'Katrs produkts iziet kontrolētus procesus: materiālu sagatavošana, precīza griešana, metināšana un līmēšana, montāža, kvalitātes pārbaude un veiktspējas verificēšana.'
      items: ['Materiālu sagatavošana', 'Precīza griešana', 'Metināšana un līmēšana', 'Montāža un kvalitātes kontrole']
    - title: 'Lietotāja scenāriju inženierija'
      body: 'Produkti tiek izstrādāti, balstoties uz reāliem lietojumiem — atpūta, piedzīvojumi un profesionāla lietošana —, nodrošinot, ka katrs dizains atbilst paredzētās vides specifiskajām prasībām.'
      items: ['Atpūta', 'Piedzīvojumi', 'Profesionāla lietošana', 'Komerciāla lietošana']


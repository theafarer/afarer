meta:
  title: 'Jūras kompetence — inženierija katrā korpusā | {SITE}'
  description: 'Gadu desmiti jūras inženierijas katrā korpusā. afarer pārvalda Drop Stitch, jūras PVC un profesionālu piepūšamo SUP dizainu.'
  keywords:
    - 'jūras inženierija'
    - 'piepūšamo SUP ražotājs'
    - 'airu dēļu ražošana'
hero:
  tagline: 'Jūras kompetence'
  title: 'Gadu desmiti jūras inženierijas<br />katrā korpusā'
  subtitle: 'afarer apvieno dziļu materiālu zinātni, precīzu ražošanu un reālu testēšanu, lai radītu peldlīdzekļus, kas darbojas, kad tas ir svarīgi.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'afarer jūras inženierijas un pētniecības komanda darbā'
expertise_materials:
  tagline: 'Materiālu zinātne'
  title: 'Pareizā materiāla izvēle<br />katram lietojumam'
  subtitle: 'Mēs strādājam ar diviem pamata materiāliem — katrs izvēlēts konkrētiem lietojumiem un veiktspējas prasībām.'
  columns: 3
  items:
    - title: 'Jūras līmeņa PVC'
      description: '1100 denjē PVC audums — mūsu universālākais materiāls. UV stabilizēts, pret berzi izturīgs un REACH atbilstīgs. Ideāls SUP dēļiem, kur svarīgs ir svars un izmaksu efektivitāte.'
      icon: tabler:droplet
    - title: 'Stiklšķiedra un polietilēns'
      description: 'Stiklšķiedras laminēti SUP dēļi premium stingrībai un slīdēšanai. Rotācijas veidā veidots polietilēns smagai nomas un glābšanas lietošanai, kur nepieciešama maksimāla triecienizturība.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Ražošanas iespējas'
  title: 'Precīza ražošana<br />katrā solī'
  subtitle: 'Mūsu 12,000 m² objekts ir aprīkots ar specializētām iekārtām katram ražošanas posmam.'
  columns: 2
  items:
    - title: 'CNC griešana'
      description: 'Datora kontrolēta griešana nodrošina precīzus, atkārtojamus auduma paneļus ar minimāliem atkritumiem. Katra detaļa ietilpst tieši kā izprojektēts.'
      icon: tabler:cpu
    - title: 'Augstfrekvences metināšana'
      description: 'Rūpnieciska HF metināšana rada šuves, kas ir stiprākas par pamata materiālu. Nemainīga temperatūras un spiediena kontrole nodrošina gaisu necaurlaidīgus savienojumus visās ražošanas partijās.'
      icon: tabler:bolt
    - title: 'Drop Stitch kodola montāža'
      description: 'Tūkstošiem poliestera diegu savieno augšējo un apakšējo auduma slāni, ļaujot augsta spiediena piepūšanu (15-20 PSI) stingriem, stabiliem SUP dēļiem.'
      icon: tabler:building-arch
    - title: 'Spiediena testēšana'
      description: 'Katrs piepūšamais produkts pirms nosūtīšanas tiek spiediena testēts. Dēļi tiek testēti pie 1.25x nominālā spiediena — ja tas iztur, tas darbosies uz ūdens.'
      icon: tabler:wind
    - title: 'Šuvju stiprības testēšana'
      description: 'Gadījuma paraugi no katras ražošanas partijas iziet destruktīvu šuvju stiprības testēšanu. Rezultāti tiek reģistrēti un izsekojami līdz konkrētām ražošanas partijām.'
      icon: tabler:files
    - title: 'Testēšana ūdenī'
      description: 'Katrs modelis pirms sertifikācijas iziet jūras testus. Reāla testēšana piekrastes apstākļos apstiprina veiktspēju, vadāmību un stabilitāti.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Dizains un inženierija'
  title: 'Izstrādāts reāliem apstākļiem'
  subtitle: 'Mūsu dizaina filozofija sākas ar to, kā dēlis tiks izmantots — un pēc tam ap šo lietojumu tiek veidota inženierija.'
  items:
    - title: 'Veiktspējas korpusa dizains'
      description: 'Katra korpusa forma ir noregulēta tā lietojumam — izspiedošas priekšdaļas tūrisma slīdēšanai, pievienots rokeris sērfinga veiklībai, platas stabilas profila formas makšķerēšanai un jogai.'
    - title: 'Drop-Stitch drošība'
      description: 'Katram dēlim ir stingrs Drop-Stitch kodols ar pastiprinātām sānu malām. Ja kāda daļa tiek bojāta, augstas stiepes Drop-Stitch struktūra uztur dēli darbspējīgu.'
    - title: 'Ergonomisks klāja izkārtojums'
      description: 'Klāja pārklājuma zonējums, pārnešanas roktura pozīcija un stiprinājuma punkti ir izstrādāti braucēja ērtībai ilgstošā lietošanā — vai nu tūrismā, makšķerēšanā vai patruļā.'
    - title: 'Pielāgota konfigurācija'
      description: 'Sānu malu krāsas, klāja pārklājuma konfigurācija, aksesuāru stiprinājumi, kravietilpība — katrs modelis var tikt pielāgots konkrētām ekspluatācijas prasībām.'
cta:
  title: 'Vai prātā ir kāds konkrēts lietojums?'
  subtitle: 'Mūsu inženieru komanda var konsultēt materiālu izvēles, dizaina un ražošanas jautājumos jūsu projektam.'
  actions:
    - variant: primary
      text: 'Vaicājiet mūsu inženieriem'
      href: /contact/
    - text: 'Apskatiet produktu klāstu'
      href: /products/

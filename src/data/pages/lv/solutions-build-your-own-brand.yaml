meta:
  title: 'Privātā zīmola SUP ražošana un pielāgota zīmola palaišana | {SITE}'
  description: 'Privātā zīmola SUP ražotājs jauniem airu dēļu zīmoliem. Palaidiet savu SUP zīmolu ar Afarer — pilns OEM/ODM serviss, ietverot dizainu, prototipēšanu, pielāgotu zīmolējumu, ražošanu un globālo loģistiku.'

hero:
  tagline: 'Izveidojiet savu zīmolu'
  title: 'Palaidiet savu<br />SUP zīmolu'
  subtitle: 'Jums ir redzējums. Mums ir rūpnīca, kompetence un piegādes ķēde. Privātā zīmola SUP ražošana un pielāgota SUP zīmola izstrāde — kopā mēs izveidosim zīmolu, kas izceļas.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Pielāgota zīmola SUP dēlis uz ūdens'

process:
  title: 'Jūsu zīmola ceļš'
  subtitle: 'No idejas līdz tirgum 5 posmos.'
  steps:
    - phase: '1. posms'
      title: 'Ideja'
      period: '1.-2. nedēļa'
      items:
        - 'Tirgus izpēte un konkurentu analīze'
        - 'Mērķa klientu definēšana'
        - 'Zīmola pozicionēšanas darbnīca'
        - 'Produktu līnijas stratēģija'
    - phase: '2. posms'
      title: 'Dizains'
      period: '3.-6. nedēļa'
      items:
        - 'Dēļa forma un grafiskais dizains'
        - 'Krāsu saskaņošana un materiālu izvēle'
        - 'Piederumu specifikācija'
        - 'Iepakojuma un etiķešu dizains'
    - phase: '3. posms'
      title: 'Prototips'
      period: '7.-10. nedēļa'
      items:
        - 'Paraugu ražošana'
        - 'Kvalitātes testēšana (spiediens, peldētspēja, UV)'
        - 'Dizaina pielāgojumi'
        - 'Gala apstiprinājums'
    - phase: '4. posms'
      title: 'Ražošana'
      period: '11.-14. nedēļa'
      items:
        - 'Lielapjoma ražošana'
        - 'Kvalitātes kontroles pārbaude (katrai vienībai)'
        - 'Jūras / gaisa krava'
        - 'Muitas dokumentācija'
    - phase: '5. posms'
      title: 'Palaišana'
      period: '15.-16. nedēļa'
      items:
        - 'Produktu fotogrāfēšana'
        - 'Produktu plūsma tīmekļa vietnei'
        - 'Mārketinga materiāli'
        - 'Palaišanas atbalsts'

packages:
  title: 'Starta paketes'
  subtitle: 'Paketes, kas izstrādātas katram zīmola izaugsmes posmam.'
  items:
    - name: 'Sākuma zīmols'
      tagline: '50-100 vienības · 2 dēļu modeļi'
      features:
        - 'Pamata logotipa drukāšana'
        - 'Standarta iepakojums'
        - 'Atbalsts e-pastā'
    - name: 'Augošs zīmols'
      tagline: '300-1,000 vienības · 3-5 dēļu modeļi'
      features:
        - 'Pielāgota krāsa + logotips'
        - 'Pielāgots iepakojums'
        - 'Produktu fotogrāfijas'
        - 'Atveltīts menedžeris'
    - name: 'Esošs zīmols'
      tagline: '1,000+ vienības · pilna produktu līnija'
      features:
        - 'Pilna pielāgošana'
        - 'Premium iepakojums'
        - 'Mārketinga materiāli'
        - 'Prioritārā ražošana'


      icon: 'tabler:certificate'
    - title: '30 dienu izpildes laiks'
      description: 'Ātrāk nekā nozares vidēji no pasūtījuma līdz nosūtīšanai.'
      icon: 'tabler:truck-delivery'
    - title: 'Zems MOQ'
      description: 'No 50 vienībām — zemākais nozarē.'
      icon: 'tabler:package'
    - title: 'Pašu dizains'

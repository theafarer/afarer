content_html: |
  <h2>Kas ir Drop Stitch?</h2>
  <p>Drop Stitch (saukts arī par "drop-stitch audumu" vai "drop-stitch kodolu") ir konstrukcijas metode, kurā tūkstošiem atsevišķu poliestera diegu savieno auduma apvalka augšējo un apakšējo slāni. Kad apvalks tiek piepūsts, šie diegi darbojas kā iekšēji stiepes elementi — tie neļauj augšējam un apakšējam panelim izliekties uz āru noapaļojoties, un piespiež paneli palikt plakans un stingrs.</p>
  <p>Rezultāts ir viegla, pārvadājama konstrukcija, kas iztur 15 – 20 PSI iekšējo spiedienu — salīdzināma ar cietā dēļa stingrību, taču pilnībā atspiežama glabāšanai un transportēšanai.</p>

  <h2>Kā tas darbojas: fizika</h2>
  <p>Parastā piepūšamā konstrukcijā (piemēram, balonā vai gaisa matracī) iekšējais gaisa spiediens spiež vienādi visos virzienos. Bez iekšējas sašaurināšanas konstrukcija kļūst cilindriska vai sfēriska. Drop Stitch to atrisina, ieviešot stiepes pastiprinājumu:</p>
  <ul>
    <li>Tūkstošiem diegu savieno augšējo un apakšējo auduma slāni</li>
    <li>Piepūšot, gaisa spiediens mēģina izstumt augšējo un apakšējo daļu vienu no otras</li>
    <li>Diegi pretojas šai atdalīšanai, pārnesot slodzi uz stiepi gar diega asi</li>
    <li>Rezultāts ir plakans, stingrs panelis, kas pretojas liekšanai</li>
  </ul>

  <h2>Konstrukcijas process</h2>
  <ol>
    <li><strong>Aušana:</strong> Poliestera diegi tiek vienlaikus austi divos atsevišķos pamatauduma slāņos (parasti 1,100 DTEX vai 1,680 DTEX PVC pārklāts poliesters). Diegi starp slāņiem tiek austi cilpu veidā 90&deg; leņķī.</li>
    <li><strong>Pārklāšana:</strong> Austošais pamataudums tiek pārklāts ar PVC (vai reizēm TPU), izmantojot naža pārklāšanas vai kalandra pārklāšanas procesu. Tas noslēdz diegus un veido gaisu necaurlaidīgu membrānu.</li>
    <li><strong>Slāņu līmēšana:</strong> Drop-Stitch kodols tiek pielīmēts pie ārējiem laminētajiem slāņiem (parasti 0.9 mm vai 1.2 mm PVC), izmantojot termisko laminēšanu vai līmi.</li>
    <li><strong>Metināšana:</strong> Sānu malu joslas tiek metinātas gar malām, izmantojot karstā gaisa metināšanu, RF metināšanu vai augstfrekvences metināšanu, lai izveidotu dēļa sānu sienas.</li>
    <li><strong>Vārstu uzstādīšana:</strong> Tiek uzstādīti Boston vai Halkey-Roberts vārsti, parasti ar spiediena atslēgšanas mehānismu, lai novērstu pārpūšanu.</li>
  </ol>

  <h2>Galvenie kvalitātes rādītāji</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parametrs</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Iesācēju līmenis</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Diegu blīvums</td><td class="p-3 border">1 diegs / kv. colla</td><td class="p-3 border">2 diegi / kv. colla</td></tr>
      <tr><td class="p-3 border">Pamataudums</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Maksimālais spiediens</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC biezums</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Sānu malu konstrukcija</td><td class="p-3 border">Salocīts un pielīmēts</td><td class="p-3 border">Metināts un fūzijā savienots</td></tr>
    </tbody>
  </table>

  <h2>Lietojumi</h2>
  <ul>
    <li><strong>SUP dēļi:</strong> 4" – 6" biezums, 15 – 20 PSI, 1 – 2 diegi/kv. colla</li>
    <li><strong>Kajaki:</strong> Drop-Stitch grīda + piepūšamās sānu kameras, 10 – 15 PSI grīdai</li>
  </ul>

  <h2>Drop Stitch pret gaisa klāju (stiklšķiedras vai koka kodols)</h2>
  <p>Cietie dēļi izmanto EPS putuplasta kodolus ar stiklšķiedras vai koka stingeru pastiprinājumu. Tie ir vieglāki, stingrāki un reaģējošāki — taču tos nevar atspiedēt. Drop Stitch upurē daļu stingrības pilnas pārvadājamības labad. Lielākajai daļai atpūtas lietotāju mūsdienu 20 PSI Drop-Stitch SUP dēļi pēc stingrības nav atšķirami no iesācēju cietajiem dēļiem.</p>

  <h2>Kā Afarer izmanto Drop Stitch</h2>
  <p>Afarer visā savā SUP dēļu klāstā izmanto 1,680 DTEX Drop-Stitch kodolu ar 2 diegiem uz kvadrātcollu un 1.2 mm PVC ārējo laminātu. Dēļi ir paredzēti 20 PSI spiedienam un pirms nosūtīšanas iziet 24–48 stundu spiediena noturēšanas testu pie 1.25x nominālā spiediena. Sānu malu joslas tiek metinātas ar karsto gaisu, izmantojot trīsslāņu fūziju, un spiediena atslēgšanas vārsti ir standarta visos modeļos.</p>


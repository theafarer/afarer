  - name: 'UV novecošanas kamera'
    spec: 'ISO 4892, 1,000 h cikli'
  - name: 'Biezuma mērītājs (digitāls)'
    spec: '0.01 mm izšķirtspēja'
  - name: 'Atlobīšanas testētājs (metinājums)'
    spec: 'Ar motoru, 50 N jauda'
  - name: 'Temperatūras kamera'
    spec: '-40 °C līdz +100 °C'
  - name: 'Noplūžu noteikšanas tvertne'
    spec: '6 m × 2 m, ar apgaismojumu'

intro: 'afarer pārvalda īpašu kvalitātes kontroles laboratoriju, kas darbojas neatkarīgi no ražošanas. Katra izejvielu partija un katrs pabeigtais dēlis pirms nodošanas iziet dokumentētus pārbaudes protokolus. Mūsu kvalitātes kontroles komanda atskaitas tieši vadībai, kas nodrošina objektīvus kvalitātes lēmumus.'


test_procedures:
  - title: 'Izejvielu pārbaude'
    description: 'Katra ienākošā PVC, Drop-Stitch auduma un furnitūras partija tiek testēta pirms pieņemšanas. Tiek verificēta stiepes stiprība (ASTM D751), plīšanas izturība (ISO 4674) un UV izturība. Neatbilstoši materiāli tiek izolēti un atgriezti.'
    standards:
      - 'ASTM D751 (stiepe)'
      - 'ISO 4674 (plīšana)'
      - 'ISO 4892 (UV)'
  - title: 'Kvalitātes kontroles punkti procesā'
    description: 'Ražošanas operatori katrā posmā veic pašpārbaudi. Kvalitātes auditori visas maiņas laikā veic nejaušu izlasi. Metinājumu atlobīšanas testi tiek veikti ik pēc 50 vienībām. Izmēru pārbaudes notiek ik pēc 20 paneļa.'
    standards:
      - 'ASTM D751 (atlobīšana)'
      - 'Iekšējs 100 punktu kontrolsaraksts'
      - 'ISO 2859 izlase'
  - title: '24–48 stundu gaisa noturības tests'
    description: 'Katra caurules kamera tiek piepūsta līdz 125% no nominālā spiediena un noturēta 24–48 stundas. Spiediena sensori reģistrē nepārtraukti ar temperatūras kompensāciju. Jebkura kamera, kas pārsniedz 5% spiediena kritumu, izraisa automātisku partijas atkārtotu pārbaudi.'
    standards:
      - 'EN ISO 25649'
      - 'CE 2013/53/EU'
  - title: 'Kravnesības un līdzsvara testēšana'
    description: 'Pabeigtie dēļi tiek testēti pie maksimālās nominālās kravnesības uz stabilitāti un stingrību. Katrs dēlis pirms gala pārbaudes apstiprinājuma iziet testēšanu ūdenī.'
    standards:
      - 'ISO 12217'
      - 'CE 2013/53/EU'

equipment:
  - name: 'Universālā testēšanas mašīna (stiepe)'

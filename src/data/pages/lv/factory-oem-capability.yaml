  - product: 'Glābšanas vestes un drošība'
    standard_moq: '100–200 vienības'
    custom_moq: '1,000+ vienības'
    lead_time: '20–30 dienas'

why_us:
  - title: 'Vertikālā integrācija'
    description: 'Mēs piederam savai rūpnīcai, veidnēm un piegādes ķēdei — nav starpnieku, nav apakšuzņēmēju. Tas dod mums kontroli pār kvalitāti, izmaksām un piegādi.'
  - title: 'Dubultā sertifikācija'
    description: 'ISO 9001 kvalitātes vadības un BSCI sociālās atbilstības sertifikācija. Rūpnīcas audita pārskati pieejami pēc pieprasījuma.'
  - title: 'CE atbilstība'
    description: 'Visiem standarta modeļiem ir CE 2013/53/EU sertifikācija. Pielāgotie modeļi var tikt CE sertificēti caur mūsu izveidoto procesu.'
  - title: 'Zems MOQ'
    description: 'Sāciet jau ar 5 vienībām standarta modeļiem. Mēs palīdzam topošiem zīmoliem startēt, nepārslogojot krājumus.'

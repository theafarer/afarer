intro: 'afarer piedāvā vispusīgus OEM un ODM pakalpojumus zīmoliem, izplatītājiem un valsts iestādēm visā pasaulē. Ar 10+ gadu eksporta pieredzi un 12,000 m² ISO 9001 un BSCI sertificētu rūpnīcu mēs pārvaldām visu — no produktu dizaina un veidņu izstrādes līdz pilna mēroga ražošanai, iepakojumam un loģistikai.'


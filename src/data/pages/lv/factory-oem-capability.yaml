services:
  - title: 'Produktu dizains un inženierija'
    description: 'Mūsu pašu pētniecības un izstrādes komanda strādā ar jūsu konceptu vai specifikāciju, lai izstrādātu CAD rasējumus, 3D modeļus un prototipus. Mēs piedāvājam veidņu dizainu, korpusa formas optimizāciju un materiālu izvēles norādījumus.'
  - title: 'Pielāgots zīmolējums un grafika'
    description: 'Pilnkrāsu digitālā druka, sitiena druka, reljefs un etiķešu opcijas. Mēs izstrādājam zīmolam specifisku klājuma grafiku, balonu zīmolējumu un mazumtirdzniecībai gatavu iepakojumu.'
  - title: 'Materiālu un specifikāciju pielāgošana'
    description: 'Izvēlieties no PVC (standarta, videi draudzīgs, ugunsizturīgs), Drop-Stitch un hibrīda konstrukcijām. Pielāgotas balonu krāsas, auduma svari un pastiprinājuma opcijas.'
  - title: 'Iepakojums un loģistika'
    description: 'Pielāgots mazumtirdzniecības iepakojums, privātā zīmola kastes, vakuumpackēšana, paletizēšana un konteineru iekraušana. Pieejami FOB Cindao, CIF vai DDP piegādes nosacījumi.'

moq_table:

  description: 'Pilnīgas SUP flotes programmas airu klubiem un skolām. Starta paketes, profesionālas flotes, sacensību dēļi, mācību centru komplekti un rezerves daļu atbalsts.'

hero:
  tagline: 'Airu klubi un skolas'
  title: 'Uzsāciet, vadiet un attīstiet savu airu klubu<br />ar komerciāla līmeņa SUP flotēm'
  subtitle: 'SUP klubu aprīkojuma piegādātājs airu klubiem un SUP skolām visā pasaulē — izturīgi komerciālie dēļi, kluba vairumtirdzniecības cenas, pielāgots zīmolējums un ātras rezerves daļas, lai jūs varētu koncentrēties savas kopienas izaugsmei.'
  image:

packages:
  title: 'Kluba flotes programmas'
  subtitle: 'Izvēlieties flotes programmu, kas atbilst jūsu kluba izmēram un ambīcijām.'
  items:
    - name: 'Starta pakete'
      tagline: 'Jauniem klubiem, līdz 30 dalībniekiem'
      features:
        - '10 SUP dēļi (universālo un tūrisma maisījums)'
        - '10 airi + 10 glābšanas vestes'
        - '2 divfāzes sūkņi + remonta komplekts'
        - 'Kluba zīmolējums uz dēļiem (logotipa drukājums)'
        - 'Palaišanas ceļvedis + drošības kontrolsaraksts'
        - 'CE sertificēts — viss aprīkojums'
      cta_text: 'Sāciet savu klubu'
    - name: 'Profesionālā flote'
      tagline: 'Esošiem klubiem, 50-100 dalībniekiem'
      features:
        - '30 SUP dēļi (3 izmēru opcijas)'
        - '30 airi + 30 glābšanas vestes'
        - '5 sūkņi + 2 remonta komplekti + glabāšanas statne'
        - 'Pielāgotas kluba krāsas + logotips uz dēļiem'
        - 'Rezerves daļu programma (15% atlaide)'
        - 'Personāla apmācības sesija (tiešsaistē)'
        - 'CE sertificēts — viss aprīkojums'
      popular: true
      cta_text: 'Izveidojiet savu floti'
    - name: 'Sacensību flote'
      tagline: 'Sacensību klubiem, pasākumiem, kompeticijām'
      features:
        - '50+ sacensību / veiktspējas dēļi'
        - 'Pilns piederumu komplekts (airi, vestes, sūkņi)'
        - 'Pasākumu atbalsta komplekts (starta bojas, marķieri)'
        - 'Prioritārās daļas (nosūtīšana 24 h laikā)'
        - 'Atveltīts konta menedžeris'
        - 'Pielāgotu komandas formu opcija'
        - 'CE sertificēts — viss aprīkojums'
      cta_text: 'Iegādāties sacensību floti'


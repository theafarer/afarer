hero:
  tagline: 'Dzīvesveids'
  title: 'afarer<br />dzīvesveids'
  subtitle: 'Radīts tiem, kas dzīvo uz ūdens — no nedēļas nogales pētniekiem līdz komerciālajiem operatoriem, kuri katru dienu paļaujas uz savu aprīkojumu.'

values:
  - icon: 🌊
    title: 'Dzimis uz ūdens'
    desc: 'Katrs dizains sākas ar ūdens uzvedības izpratni. Mēs konstruējam no apstākļu robežas uz iekšpusi — jo okeāns ir mūsu skolotājs, ne darba vieta.'
  - icon: 🔧
    title: 'Būvēts, lai kalpotu'
    desc: 'Videi draudzīgākais produkts ir tas, kas nav jānomaina. Jūras līmeņa materiāli, Drop-Stitch kodoli ar 15 PSI vērtējumu un šuves, kas pārdzīvo sezonu.'
  - icon: 🏆
    title: 'Pieejams pēc dizaina'
    desc: 'Ūdens sports nedrīkst būt greznuma prece. Profesionāla līmeņa veiktspēja par cenu, kas ir saprātīga ģimenēm, gidiem un mazajiem operatoriem — ne tikai komerciālajām flotēm.'
  - icon: 🌍
    title: 'Globāla kopiena'
    desc: 'No Cindao krasta līdz Eiropas ezeriem, Dienvidaustrumāzijas upēm un Amerikas līčiem — mūsu klientiem ir kopīgs viens: mīlestība uz būšanu uz ūdens.'
  - icon: ♻️
    title: 'Atbildīga ražošana'
    desc: 'CNC optimizēts izkārtojums samazina materiālu atkritumus zem 5%. Izturīga konstrukcija mazina nomaiņas ciklus. Mēs būvējam ilgmūžībai, jo tā ir videi draudzīgākā izvēle.'
  - icon: 🤝
    title: 'Atbalsts, kas ilgst'
    desc: 'Divdesmit gadus vecie korpusi vēl aizvien zvana mums pēc rezerves daļām. Mūsu garantijas atbildes vidējais laiks ir 24 stundas. Mēs nepazūdam pēc pārdošanas — mēs esam šeit visu produkta mūžu.'


philosophy:
  tagline: 'Dizaina filozofija'
  title: 'Inženierijas vadīts dizains<br />— katra detaļa ir svarīga'
  subtitle: 'Mūsu inženiertehniskā filozofija balstās uz trim principiem, kas vada katru mūsu būvēto produktu.'
  list:
    - 'Uzticamība pirmajā vietā: Katrs afarer produkts tiek testēts, lai izturētu reālos apstākļus — no glābšanas operācijām aukstā ūdenī līdz tropu kūrortu nomai. Mēs pārspīlēti stingri konstruējam tur, kur tas ir svarīgāk.'
    - 'Ražošanas precizitāte: Mūsu objekti izmanto CNC griešanu, augstfrekvences metināšanu un automatizētu spiediena testēšanu. Katra šuve, katrs vārsts, katrs savienojums atbilst dokumentētām specifikācijām.'
    - 'Nepārtraukta inovācija: Mūsu pētniecības un izstrādes komanda pastāvīgi izvērtē jaunus materiālus, ražošanas metodes un dizaina uzlabojumus. Mēs negaidām problēmas — mēs tās prognozējam.'
cta:
  title: 'Vēlaties apspriest projektu ar mūsu komandu?'

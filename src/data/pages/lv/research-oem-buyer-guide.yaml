content_html: |
  <h2>1. Priekškvalifikācija: ko meklēt rūpnīcā</h2>

  <h3>Atbilstības sertifikāti</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Kvalitātes vadības sistēma</li>
    <li><strong>CE sertifikācija</strong> – Pārbaudiet paziņotās iestādes numuru</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Sociālās atbilstības auditi</li>
    <li><strong>REACH / RoHS</strong> – Materiālu atbilstības deklarācijas</li>
  </ul>

  <h3>Ražošanas iespējas</h3>
  <ul>
    <li>Drop-Stitch kodolu aušana pašu spēkiem vai ārpakalpojums</li>
    <li>PVC pārklājuma / laminācijas līnija</li>
    <li>RF metināšanas un karstā gaisa metināšanas iekārtas</li>
    <li>Pašu veidņu izgatavošana (CNC apstrāde)</li>
    <li>Testēšanas laboratorija (spiediena testēšana, UV novecošana, stiepes testēšana)</li>
  </ul>

  <h3>Pieredzes verificēšana</h3>
  <ul>
    <li>Gadi piepūšamo peldlīdzekļu ražošanā (vismaz 5+ gadi)</li>
    <li>Inženieru skaits štatā</li>
    <li>Esošie OEM/ODM klienti (pieprasiet atsauksmes)</li>
    <li>Eksporta galamērķi – vai viņi jau nosūta uz jūsu mērķa tirgu?</li>
  </ul>

  <h2>2. Kvalitātes kontroles protokoli</h2>
  <p>Ienākošā materiālu kvalitātes kontrole: stiepes izturība (ASTM D751 vai ISO 1421), plīsumizturība (ASTM D2261 vai ISO 4674), līmēšanas izturība, UV novecošanas izlases pārbaudes.</p>
  <p>Procesa kvalitātes kontrole: šuvju izturības uzraudzība ik 50 vienības, vārstu momento verificēšana, Drop-Stitch diegu blīvuma pārbaudes, izmēru pārbaudes pret CAD rasējumiem.</p>
  <p>Gala pārbaude: 100% piepūšanas noturēšanas tests (24 stundas, maks. 5% kritums), vizuālā pārbaude, vārstu darbības tests, izlases testēšana (AQL 2.5 vai 4.0 saskaņā ar ISO 2859).</p>

  <h2>3. Atbilstības dokumentācijas kontrolsaraksts</h2>
  <ul>
    <li>Atbilstības deklarācija (DoC) ar atsauci uz pareizo ES direktīvu</li>
    <li>CE sertifikāts no paziņotās iestādes</li>
    <li>Testa pārskats no akreditētas laboratorijas</li>
    <li>Materiālu drošības datu lapas (MSDS)</li>
    <li>REACH atbilstības deklarācija</li>
    <li>Materiālu saraksts ar piegādātāju izsekojamību</li>
    <li>Rūpnīcas pārbaudes pārskats</li>
  </ul>

  <h2>4. MOQ sarunas</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Produkta veids</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standarta MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Sarunu diapazons</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP dēļi</td><td class="p-3 border">50 – 100 vienības</td><td class="p-3 border">5 – 10 vienības (izmēģinājums)</td></tr>
      <tr><td class="p-3 border">Kajaki</td><td class="p-3 border">50 – 100 vienības</td><td class="p-3 border">5 – 10 vienības (izmēģinājums)</td></tr>
      <tr><td class="p-3 border">Piepūšamie SUP</td><td class="p-3 border">50 – 100 vienības</td><td class="p-3 border">2 – 5 vienības (izmēģinājums)</td></tr>
      <tr><td class="p-3 border">Drošība / piederumi</td><td class="p-3 border">200 – 500 vienības</td><td class="p-3 border">50 – 100 vienības (izmēģinājums)</td></tr>
    </tbody>
  </table>

  <h2>5. Loģistika un piegāde</h2>
  <p>Biežākie Incoterms nosacījumi: <strong>FOB</strong> (rūpnīca piegādā uz izbraukšanas ostu – visizplatītākais), <strong>EXW</strong> (pircējs organizē visu piegādi no rūpnīcas durvīm), <strong>CIF</strong> (rūpnīca apmaksā kravu un apdrošināšanu līdz galamērķa ostai).</p>
  <p>Piepūšamie produkti ir zema svara un liela tilpuma – tilpumais svars (DIM) bieži nosaka piegādes izmaksas. Pieprasiet vakuumpackētu iepakojumu, lai samazinātu tilpumu par 50–60%. Jūras krava no Ķīnas uz ES: 25–35 dienas; uz ASV rietumu krastu: 15–20 dienas.</p>

  <h2>6. Biežākās kļūdas</h2>
  <ul>
    <li><strong>Bez rūpnīcas audita:</strong> Vienmēr veiciet vai pasūtiet trešās puses auditu (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Tikai mutvārdu specifikācijas:</strong> Detalizēta tehniskās specifikācijas lapa, ko parakstījušas abas puses</li>
    <li><strong>Paraugu apstiprināšanas izlaišana:</strong> Rakstisks apstiprinājums paraugiem pirms lielapjoma ražošanas</li>
    <li><strong>Bez kvalitātes kontroles ražošanas laikā:</strong> Trešās puses pārbaude ražošanas laikā (DUPRO) un pirms nosūtīšanas (PSI)</li>
    <li><strong>Atbilstības ignorēšana:</strong> Verificējiet CE/UKCA sertifikāciju pirms ražošanas</li>
  </ul>

  <h2>7. Kāpēc Afarer</h2>
  <p>Afarer ražo OEM/ODM piepūšamos peldlīdzekļus kopš 2012. gada. Ar 12,000 m&sup2; ISO 9001 sertificētu objektu, 25+ inženieriem un CE sertifikāciju visās produktu līnijās mēs atbilstam katram šī ceļveža kritērijam. Mēs piedāvājam izmēģinājuma MOQ jauniem partneriem un pilnas atbilstības dokumentācijas paketes.</p>


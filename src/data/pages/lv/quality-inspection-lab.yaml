intro: 'Katrs dēlis, kas atstāj mūsu darbnīcu, nes sertifikāciju, ka tas ir izgājis noteiktu kvalitātes pārbaužu un materiālu testu kopu. Mūsu Kvalitātes un pārbaudes laboratorija ir neatkarīga funkcija organizācijā — tā atskaitas tieši izpilddirektoram, nevis ražošanai —, tādējādi nodrošinot, ka neviens komerciāls spiediens nevar ietekmēt pārbaudes posmu. Ja materiāla partija vai pabeigts dēlis neatbilst publicētajai specifikācijai, laboratorijai ir pilnvaras apturēt nosūtīšanu, līdz neatbilstība ir novērsta.'

content_html: |
  <h2>Uzticies, bet pārbaudi</h2>
  <p>Laboratorija darbojas saskaņā ar kvalitātes vadības sistēmu, kas atbilst principiem, un mūsu testēšanas metodes, kur vien piemērojams, balstās uz ISO, ASTM un EN standartiem. Mēs uzturam detalizētus ierakstus par katru veikto testu, radot pilnīgu izsekojamības ķēdi no izejvielu saņemšanas līdz gala dēļa piegādei.</p>

  <h2>Testēšanas iekārtas un iespējas</h2>
  <table>
    <thead><tr><th>Iekārta</th><th>Veiktie testi</th><th>Standarts / metode</th></tr></thead>
    <tbody>
      <tr><td>Universālā testēšanas iekārta (50 kN)</td><td>Stiepes izturība (audums), atlobīšanās pretestība (šuves), plīsuma izplatība</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Gaisa noturības testēšanas iekārta (programmējama)</td><td>1000 ciklu piepūšanas/atspiedēšanas izturība, 30 min spiediena noturēšanas tests</td><td>EN ISO 25649 (iekšējs)</td></tr>
      <tr><td>Šuvju atlobīšanas ierīce (motorizēta 180° atlobīšana)</td><td>Metinājumu un līmēto šuvju atlobīšanas izturība pie 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Hidrostatiskā spiediena testētājs</td><td>Auduma pretestība ūdens iekļūšanai (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Ciparu biezuma mērītājs un mikrometrs</td><td>Auduma biezums, sānu malas sienas biezums, līmes plēves biezums</td><td>ISO 2286-3</td></tr>
      <tr><td>Klimatiskā kamera</td><td>Temperatūras kondicionēšana (-40 °C līdz +80 °C) aukstuma plaisāšanas un termiskās novecošanas testiem</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Krāsu spektrofotometrs</td><td>Delta-E krāsas mērīšana pēc UV iedarbības</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Pārbaudes posmi — no materiāla līdz piegādei</h2>
  <p>Katrs dēlis seko noteiktam kvalitātes plānam ar obligātiem pārbaudes punktiem. Neviens dēlis nevar izlaist posmu; katru posmu pirms nākamās ražošanas stadijas sākuma jāapstiprina kvalitātes inspektoram.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">1. posms</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Ienākošo materiālu pārbaude</p>
            <p class="text-xs text-gray-500 mt-1">Auduma partija, līmes partija, furnitūra — viss tiek pārbaudīts pret ienākošo specifikāciju pirms nodošanas ražošanai.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">2. posms</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Metinājumu pārbaude procesā</p>
            <p class="text-xs text-gray-500 mt-1">Pirmā metinājuma paraugs tiek testēts (atlobīšana + vizuāla pārbaude) katras ražošanas maiņas sākumā.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">3. posms</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kameru gaisa tests</p>
            <p class="text-xs text-gray-500 mt-1">Katra kamera tiek saspiesta līdz 1.5 x darba spiedienam un turēta 30 min. Dati tiek reģistrēti pēc sērijas numura.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">4. posms</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Pārbaude pirms piegādes</p>
            <p class="text-xs text-gray-500 mt-1">Tiek pārbaudīts viss dēlis: visi stiprinājumi pievilkti ar noteiktu momentu, furnitūra funkcionāla, bez kosmētiskiem defektiem. 100 punktu kontrolsaraksts.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">5. posms</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Galīgā sertifikācija</p>
            <p class="text-xs text-gray-500 mt-1">Sagatavotas testu atskaites, izskatīti pārbaudes ieraksti, izsniegts atbilstības sertifikāts.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Galvenie kvalitātes rādītāji (2025. gada ritošais vidējais)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Pirmās pārbaudes iznākums (auduma partija)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Metinājumu noraidījumu līmenis (lineārais metrs)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Kameras tiek gaisa testētas pirms montāžas</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">Dizaina kategorijas atbilstība</span>
    </div>
  </div>

  <h2>Mūsu kvalitātes komanda</h2>
  <p>Laboratorijā strādā kvalitātes vadītājs (10 gadi jūras nozares kvalitātes nodrošināšanā, ASQ sertificēts kvalitātes inženieris), divi kvalitātes inspektori (katram ar 2. līmeņa NDT sertifikātu vizuālajā testēšanā) un materiālu tehniķis, kas atbild par visu fizisko testēšanu. Komanda katru gadu iziet prasmju pārbaudi, izmantojot neatkarīgu trešās puses pakalpojumu sniedzēju, lai nodrošinātu, ka mūsu testu rezultāti ir precīzi un atkārtojami.</p>

  <h2>Neatkarīga testēšana klientiem</h2>
  <p>Mūsu Kvalitātes un pārbaudes laboratorija piedāvā arī neatkarīgus testēšanas pakalpojumus. Ja jums jāpārbauda auduma specifikācija, jāvalidē jauna līmes sistēma vai jāiegūst trešās puses testa atskaite iepirkuma kvalifikācijai, mēs varam veikt testus atbilstoši piemērojamajam standartam un izsniegt sertificētu testa atskaiti.</p>
  <p>Pēdējo trešās puses testēšanas darbu piemēri:</p>
  <ul>
    <li>Piecu konkurējošu līmes plēvju produktu atlobīšanas izturības salīdzinājums Eiropas militārā iepirkuma programmai.</li>
    <li>Paātrinātās novecošanas pētījums (UV + termiskā ciklēšana) jaunai oranži pigmentētai PVC formulācijai ar regulāriem starpmērījumiem ik pēc 500 h.</li>
    <li>50 prototipa starpsienu vārstu gaisa noturības validācija jaunam augsta spiediena kameras dizainam.</li>
  </ul>

  <h2>Mūsu apņemšanās jums</h2>
  <p>Saņemot Afarer dēli, jūs saņemat arī tā kvalitātes dosjē — apkopotu ierakstu par testu rezultātiem, kas attiecas uz jūsu konkrēto dēli. Auduma partijas sertifikāts, metinājumu atlobīšanas testi, kameru gaisa testu žurnāli un pārbaudes kontrolsaraksts pirms piegādes. Katrs skaitlis ir izsekojams. Katrs inspektors ir identificēts. Šī nav tikai dokumentācija — tas ir mūsu solījums, ka piegādātais ir tieši tas, ko esam norādījuši.</p>
  <p>Ja jums jebkad rodas kvalitātes bažas, varat sazināties ar laboratoriju tieši — kontaktinformācija ir norādīta jūsu atbilstības sertifikātā. Katru jautājumu uztveram nopietni un apņemamies uzsākt formālu izmeklēšanu 48 stundu laikā.</p>


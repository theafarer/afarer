seo:
  headline: 'afarer piepūšamo SUP dēļu garantija — 5 gadu ierobežotā garantija | afarer'
  description: 'afarer piedāvā 5 gadu ierobežotu garantiju uz galveno klāja audumu, šuvēm un Drop-Stitch kodola strukturālo integritāti. Tāpat tiek segti piepūšanas vārsti un rūpnīcā uzstādītie aksesuāri. Pilni afarer piepūšamo SUP dēļu garantijas nosacījumi.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Šī ierobežotā garantija attiecas uz jauniem afarer zīmola piepūšamajiem jūras produktiem, kas iegādāti tieši no afarer vai no autorizēta afarer izplatītāja vai mazumtirgotāja. Stāšanās spēkā datums ir verificējamais sākotnējā mazumtirdzniecības pirkuma datums.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garantijas segums un ilgums</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 gadi</h3>
        <p class="text-sm text-gray-600 mt-1">Galvenā cilindra auduma integritāte (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 gadi</h3>
        <p class="text-sm text-gray-600 mt-1">Stiklšķiedras korpusa strukturālā integritāte</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 gadi</h3>
        <p class="text-sm text-gray-600 mt-1">Piepūšamā cilindra šuvju gaisa noturības spēja</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 gadi</h3>
        <p class="text-sm text-gray-600 mt-1">Piepūšanas vārsta darbība</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 gads</h3>
        <p class="text-sm text-gray-600 mt-1">Rūpnīcā uzstādītie aksesuāri un palīgfurnitūra</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 gads*</h3>
        <p class="text-sm text-gray-600 mt-1">Komerciāla, nomas vai flotes lietošana — visi komponenti</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komerciāla, valsts, čartera, nomas vai apmācību lietošana saīsina garantiju līdz 1 gadam. Sacensību vai konkurences lietošana pilnībā anulē garantiju.</p>
  </div>

  <h2>Kas ir segts</h2>
  <h3>Galvenais cilindra audums (5 gadi)</h3>
  <p>afarer garantē galveno klāja audumu pret porainības pasliktināšanos, kas būtiski apdraud produkta spēju uzturēt darba piepūšanu. Tas attiecas uz PVC pārklātu audumu un visiem pārējiem ražošanā izmantotajiem klāja auduma materiāliem.</p>

  <h3>Stiklšķiedras korpusa strukturālā integritāte (5 gadi)</h3>
  <p>Produktiem ar stiklšķiedras pastiprinātas plastmasas (FRP) korpusu pamata kompozīta struktūra ir garantēta pret strukturālu bojājumu, kas radies materiālu vai izpildījuma defektu dēļ.</p>

  <h3>Piepūšamā cilindra šuvju gaisa noturības spēja (5 gadi)</h3>
  <p>Piepūšamo cilindru šuves, kas savienotas ražošanas laikā, ir garantētas pret ražošanas defektiem, kas izraisa būtisku gaisa noplūdi caur šuvi. Periodiska pārbaude un atbilstoša piepūšanas spiediena uzturēšana ir seguma nosacījumi.</p>

  <h3>Piepūšanas vārsta darbība (5 gadi)</h3>
  <p>Gaisa piepūšanas vārsti, ko sākotnēji uzstādījis afarer, ir garantēti pret ražošanas defektiem materiālos vai izpildījumā, kas neļauj vārstam noturēt gaisu, kā paredzēts.</p>

  <h3>Rūpnīcā uzstādītie aksesuāri (1 gads)</h3>
  <p>Komponenti un furnitūra, ko ražojis afarer un kas sākotnēji uzstādīti rūpnīcā, ir garantēti pret materiāla un izpildījuma defektiem vienu gadu. Tas neietver trešo pušu vienumus, kurus sedz tikai to ražotāju garantijas.</p>

  <h2>Kas nav segts</h2>
  <ul>
    <li>Kosmētiski trūkumi, tostarp krāsas maiņa, notraipīšana, izbalēšana, kreveļošanās vai jebkādas izskata izmaiņas</li>
    <li>Punkcijas, griezumi, plīsumi, ieplīšana vai citi fiziski bojājumi</li>
    <li>Matēšanās, plaisāšana, berze, skrāpējumi vai pasliktināšanās berzes vai saskares dēļ</li>
    <li>Degradācija UV starojuma, atmosfēras iedarbes vai vides apstākļu dēļ</li>
    <li>Bojājumi, kas radušies saskarē ar degvielām, šķīdinātājiem, skābēm, sārmiem vai ķīmiskām vielām</li>
    <li>Bojājumi neuzmanības, nepareizas lietošanas, rupjas rīcības, negadījuma vai normālas nodilšanas dēļ</li>
    <li>Gelcoat vai krāsas virsmas problēmas (pūslīši, matēšanās, krāsas maiņa, izbalēšana)</li>
    <li>Bojājumi trieciena, slodzes, nepareiza atbalsta vai transportēšanas ar piekabi dēļ</li>
    <li>Bojājumi nepareizas piepūšanas/atspiedēšanas vai neatļautu piepūšanas iekārtu lietošanas dēļ</li>
    <li>Trešo pušu aprīkojums, komponenti vai sistēmas (tos sedz to ražotāji)</li>
  </ul>

  <h2>Ražotāja pienākums un līdzekļi</h2>
  <p>afarer vienīgais un ekskluzīvais pienākums ir afarer izvēles iespēju remontēt vai aizstāt jebkuru komponentu, kas atzīts par defektīvu materiālos vai izpildījumā un ir segts ar šo garantiju. Remonts vai aizvietošana tiek veikta afarer vai tā norādītajā autorizētajā servisa centrā. Remontētiem vai aizvietotiem komponentiem garantija attiecas tikai uz sākotnējās garantijas perioda vēl nebeigušos daļu.</p>

  <h2>Garantijas nosacījumi</h2>
  <ul>
    <li><strong>Reģistrācija:</strong> Produkts ir pareizi jāreģistrē, kā noteikts garantijas nosacījumos.</li>
    <li><strong>Apkope:</strong> Produkts ir jāapkopo saskaņā ar afarer publicētajiem norādījumiem, tostarp veicot periodisku pārbaudi un uzturot atbilstošu piepūšanas spiedienu.</li>
    <li><strong>Sadarbība:</strong> Pircējam ir pilnībā un savlaicīgi jāsadarbojas ar afarer visos ar garantijas prasībām saistītajos jautājumos.</li>
    <li><strong>Sākotnējais pircējs:</strong> Šī garantija tiek piešķirta tikai sākotnējam gala lietotājam un nav pārvedama.</li>
  </ul>

  <h2>Komerciāla lietošana</h2>
  <p>Ja produkts tiek izmantots komerciāliem, valsts, bezpeļņas, čartera, nomas, apmācības vai jebkādiem citiem mērķiem, izņemot privātu atpūtas lietošanu, garantijas periods visiem komponentiem tiek saīsināts līdz vienam (1) gadam no sākotnējā mazumtirdzniecības pirkuma datuma. Lietošana sacīkstēs, ātruma vai izturības sacensībās nekavējoties un neatgriezeniski anulē garantiju pilnībā.</p>

  <h2>Kā iesniegt garantijas prasījumu</h2>
  <p>Sazinieties ar afarer vai savu autorizēto izplatītāju, uzrādot pirkuma apliecinājumu un detalizētu problēmas aprakstu. afarer izskatīs prasījumu un sniegs norādījumus pārbaudei un servisam.</p>
  <p>Jautājumos par garantijas servisu, lūdzu, sazinieties ar mums, izmantojot mūsu <a href="/contact" class="text-sky-600 underline">kontakta lapu</a>, norādiet pasūtījuma numuru un produkta datus.</p>

  <h2>Trešo pušu vienumi</h2>
  <p>Aprīkojumu, komponentus vai sistēmas, ko ražojušas trešās puses (pat ja tās uzstādījis afarer), sedz tikai to ražotāju piedāvātās garantijas. afarer izslēdz jebkādu garantijas atbildību par šādiem trešo pušu vienumiem.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Šis garantijas paziņojums ir pilnīgās afarer ražotāja ierobežotās garantijas kopsavilkums. Visus garantijas nosacījumus regulē pilnais juridiskais garantijas dokuments. Specifikācijas var tikt mainītas bez iepriekšēja brīdinājuma. afarer ir zīmols, ko pārvalda Aquafarer LLC (ASV).
  </p>

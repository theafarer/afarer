faqs:
  title: 'Valsts partnerība — BUJ'
  subtitle: 'Jautājumi, ko nopietni valsts partneri uzdod pirms pieteikšanās.'
  items:
    - title: 'Ko tiešām nozīmē viena valsts — viens izplatītājs?'
      description: 'Afarer ieceļ vienu pilnvarotu izplatītāju ar ekskluzīvām tiesībām noteiktai teritorijai. Mēs nepārdodam no saviem globālajiem vai reģionālajiem kanāliem aizsargātajā valstī. Jūsu teritorijas īpašums ir spēkā, kamēr tiek ievērota Izplatīšanas vienošanās.'
    - title: 'Vai teritorija ir ekskluzīva uz mūžu?'
      description: 'Nē. Ekskluzivitāte ir nosacīta, nevis mūžīga. To uztur parakstīta Izplatīšanas vienošanās, pirmā pasūtījuma izpilde, ikgadējie iepirkuma mērķi, vietējie krājumi, pēcpārdošanas spējas un pastāvīgas investīcijas tirgū. Ja šie nosacījumi netiek izpildīti, teritoriju var pārrunāt vai piešķirt citam.'
    - title: 'Kāds ir minimālais pirmais pasūtījums?'
      description: 'Valsts un reģionālie izplatītāji sāk ar 100–300 vienībām; pilnvarotie dīleri ar 30–50 vienībām; izmēģinājuma pasūtījumi no 10–30 vienībām ļauj vispirms validēt tirgu (izmēģinājuma un paraugu pasūtījumiem nav teritorijas aizsardzības). Pielāgošanas un privātā zīmola programmām ir atsevišķi MOQ, kas norādīti līmeņos augstāk.'
    - title: 'Kāds atbalsts ir iekļauts 10 moduļu atbalsta programmā?'
      description: 'Līmeņi un kvalifikācija, teritorijas aizsardzība, MOQ / cenas / ikgadējās atlaides, krājumi un pasūtījumu izpilde, mārketinga materiāli un kopīgie tirgus fondi, produkta / pārdošanas / tehniskā apmācība, rezerves daļas un pēcpārdošanas serviss, garantijas reģistrācija, partneru portāls, kā arī produktu datu lapas, mārketinga materiālu bibliotēka, ikgadējais atlaižu grafiks un nosūtīšanas un iepakošanas saraksti.'
    - title: 'Kā Afarer mani aizsargā no kanālu konfliktiem?'
      description: 'Katrai teritorijai ir tieši viens pilnvarots izplatītājs. Pieprasījumi un tiešie pasūtījumi no jūsu reģiona tiek novirzīti caur jums, tīmekļa vietnes veidlapas tiek pārsūtītas vietējam partnerim, ja tāds ir, un globālā komanda eskalē tikai tad, ja partneris neatbild.'
    - title: 'Kādi ir nosūtīšanas un maksājuma nosacījumi?'
      description: 'Pasūtījumi tiek nosūtīti FOB Cindao ar pilnu eksporta dokumentāciju. Ražošanas pasūtījumiem 30% priekšapmaksa un 70% pirms nosūtīšanas; izmēģinājuma un paraugu pasūtījumi tiek priekšapmaksāti. Standarta izpildes laiks ir 30–45 darba dienas, paraugu partijām 15–20 darba dienas.'
    - title: 'Kā pieteikties?'
      description: 'Nosūtiet pieteikumu, izmantojot kontaktformu, norādiet informāciju par tirgu. Mēs izvērtējam atbilstību tirgum, mazumtirdzniecības klātbūtni un loģistikas spējas, un atbildam 3 darba dienu laikā ar nākamajiem soļiem un parauga Izplatīšanas vienošanos.'

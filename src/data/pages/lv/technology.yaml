hero:
  tagline: 'Tehnoloģija'
  title: 'Radīts veiktspējai'
  subtitle: 'Katru afarer piepūšamo SUP dēli konstruē ar Drop-Stitch konstrukciju un jūras līmeņa PVC — precīziem materiāliem un ražošanas metodēm, kas pārbaudītas prasīgai jūras videi.'

sections:
  - title: 'Drop-Stitch kodols'
    description: 'Tūkstoši iekšēju poliestera diegu savieno augšējo un apakšējo slāni, radot stingru struktūru pie 12-15 PSI. Tā ir pati tehnoloģija, ko izmanto profesionālos airu dēļos un piepūšamajos sacensību SUP.'
    imageAlt: 'DS kodola diagramma'
  - title: 'Jūras līmeņa PVC'
    description: 'Daudzslāņu laminēts PVC audums, vērtēts jūras videi. Katrs slānis ir termiski metināts, nevis līmēts, kas izslēdz delaminācijas risku. Testēts UV izturībai, sālsūdens korozijai un berzei.'
    imageAlt: 'PVC slānis'
  - title: 'Militārā līmeņa PVC'
    description: 'Tiek izmantots visos SUP modeļos; augstvērtīgais PVC nodrošina izcilu UV un ķīmisko izturību. Saglabā elastību ekstremālās temperatūrās un pretojas noārdīšanai.'
    imageAlt: 'PVC'
  - title: 'Gaisa klāja grīda'
    description: 'Augsta spiediena piepūšamā Drop-Stitch konstrukcija, kas nodrošina izcilu stingrību stāvēšanai, makšķerēšanai un jogai. Samazina sagatavošanas laiku, kopējo svaru un uzglabāšanas tilpumu.'
    imageAlt: 'Gaisa klājs'


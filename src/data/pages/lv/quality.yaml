tests:
  - title: 'Spiediena testēšana'
    description: 'Piepūšamās kameras tiek pakļautas spiedienam, kas ilgstoši pārsniedz ieteicamās darba robežas. Tas verificē materiāla un šuvju hermētiskumu un strukturālo integritāti, nodrošinot, ka produkts iztur paredzēto lietošanu un iespējamu pārpūšanu bez bojājumiem vai noplūdēm.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Trieciena testēšana'
    description: 'Produkti tiek pakļauti kontrolētiem triecieniem no dažādiem svariem un leņķiem. Tas novērtē materiāla izturību pret caurumiem, plīsumiem un bojājumiem no sadursmēm ar šķēršļiem ūdenī, demonstrējot izturību un ilgmūžību.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'UV pretestības testēšana'
    description: 'Materiālu paraugi iziet paātrinātu UV iedarbību, kas simulē gadus ilgu spēcīgu saules starojumu, pēc tam tiek atkārtoti testēti uz stiepes izturības saglabāšanu un krāsas noturību. Tas verificē, ka PVC savienojumi pretojas izbalēšanai, krīšanai un plaisāšanai, nodrošinot ilgtermiņa izturību saulainā jūras vidē.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Berzes izturības testēšana'
    description: 'Materiālu paraugi tiek berzēti pret abrazīvām virsmām noteiktu ciklu skaitu kontrolētā spiedienā. Tas mēra materiāla spēju izturēt nodilumu no atkārtotas lietošanas, saskares ar smiltīm, akmeņiem vai citām virsmām, nodrošinot ilgtermiņa izturību.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Zemas temperatūras veiktspējas testēšana'
    description: 'Produkti tiek testēti aukstā vidē, lai novērtētu funkcionalitāti un izturību dažādos temperatūras apstākļos, novēršot stīvumu vai plaisāšanu aukstākos ūdeņos. Neatlaidzami dēļiem, kas paredzēti ziemas vai augstu platuma grādu lietošanai.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Peldētspējas un slodzes ietilpības testēšana'
    description: 'Produkti tiek testēti ar dažādiem svariem, lai noteiktu to maksimālo slodzes ietilpību un nodrošinātu, ka tie droši uztur lietotājus un ekipējumu. Katra modeļa nominālā ietilpība tiek verificēta pirms izlaišanas.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Manevrētspējas testēšana'
    description: 'Produkti tiek testēti uz to reaģēšanu uz airēšanas vai dzinēja iedarbību, izvērtējot pagriešanās rādiusu un vadāmības ērtumu. Testi ūdenī validē, ka reālā vadāmība atbilst dizaina specifikācijām.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Ūdensnecaurlaidības testēšana'
    description: 'Pilnībā samontētie produkti tiek iegremdēti vai pakļauti ūdens strūklakai, lai pārbaudītu noplūdes caur šuvēm, vārstiem vai materiāliem. Katrs dēlis pirms nosūtīšanas iziet obligāto ūdensnecaurlaidības pārbaudi.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp


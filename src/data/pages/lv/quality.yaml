  tagline: 'Kvalitātes nodrošināšana'
  title: 'Veiktspējas un kvalitātes testēšana'
  subtitle: 'Katrs afarer piepūšamais SUP pirms nosūtīšanas iziet stingru veiktspējas un kvalitātes kontroles testēšanu mūsu Pētniecības un izstrādes centrā. Mūsu vispusīgā SUP kvalitātes testēšana sniedz taustāmus produktu izcilības pierādījumus OEM un vairumtirdzniecības pircējiem.'


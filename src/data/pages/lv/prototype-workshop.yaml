intro: 'Ne cik detalizēts arī būtu CAD modelis, tas nevar parādīt, kā dēlis patiesībā uzvedīsies, līdz tas saskaras ar ūdeni. Tāpēc mūsu Prototipu darbnīca ir izveidota, lai pēc iespējas ātrāk un precīzāk pārvērstu inženierijas datus fiziskā, ūdenim gatavā dēlī. Katrs jaunais Afarer modelis — un katrs nozīmīgs pielāgots būvējums — iziet cauri šai darbnīcai, pirms tiek uzsākta ražošanas tehnoloģiskā aprīkojuma izgatavošana.'

content_html: |
  <h2>Kur dizains kļūst par realitāti</h2>
  <p>Darbnīca ir pilnībā aprīkota vienlaicīgai korpusa, sānu malu un aprīkojuma izgatavošanai. Šāda paralēlā darba plūsma saīsina prototipa izgatavošanas laiku līdz 8-12 nedēļām no inženierijas nodošanas, salīdzinot ar nozares standartu 16-20 nedēļas. Ja jūsu lietojumprogrammai nepieciešams specializēts risinājums, mēs varam nonākt no koncepta līdz validācijai ūdenī mazāk nekā trīs mēnešos.</p>

  <h2>Darbnīcas iespējas</h2>
  <table>
    <thead><tr><th>Darba vieta</th><th>Aprīkojums</th><th>Nolūks</th></tr></thead>
    <tbody>
      <tr><td>Korpusa izgatavošana</td><td>CNC auduma griezējs, termiskās laminēšanas prese, Drop-Stitch kodola sagatavošanas stacija</td><td>Pilna mēroga korpusa ražošana visos trīs konstrukcijas veidos</td></tr>
      <tr><td>Sānu malu un kameru montāža</td><td>RF metināšanas prese, karstā gaisa piestiprināšanas stacija, piepūšanas testēšanas ierīce</td><td>Pilna izmēra sānu malu un kameru mezglu izgatavošana ar visām starpsienām un vārstiem</td></tr>
      <tr><td>Aprīkošana un furnitūras uzstādīšana</td><td>Spuru kastes frēzēšanas ierīce, kravu stiprinājumu un rokturu metināšanas veidnes, klāja pārklājuma griešanas stacija</td><td>Pilnīga aprīkošana: spuras, kravu stiprinājumi, drošības auklas pieslēgvietas, rokturi, klāja pārklājumi, vārsti</td></tr>
      <tr><td>Instrumentācijas nodalījums</td><td>GPS ātruma sensors, spiediena pārveidotāji, akselerometri, termopāru masīvs, datu reģistrators</td><td>Jūras testu instrumentācijas uzstādīšana un kalibrēšana</td></tr>
    </tbody>
  </table>

  <h2>Prototipa ceļš — soli pa solim</h2>
  <ol>
    <li><strong>Inženierijas nodošana</strong> — Dizaina paketi (3D modelis, FEA atskaite, materiālu specifikācija, klāšanas shēma) formāli izskata darbnīcas vadītājs un projekta inženieris. Visas ražošanas bažas tiek atzīmētas un novērstas pirms griešanas sākuma.</li>
    <li><strong>Korpusa ražošana</strong> — Korpuss tiek būvēts atbilstoši inženierijas specifikācijai. Vienslāņu konstrukcijai: Drop-Stitch kodols tiek laminēts ar norādīto PVC ārējo slāni. Divslāņu konstrukcijai: papildu slānis tiek uzklāts uz pamata lamināta pirms šablona izgriešanas. Kausētajai konstrukcijai: laminēšanas parametri tiek ielādēti no apstiprinātās procesu lapas un pārbaudīti uz pirmā parauga.</li>
    <li><strong>Sānu malu izgatavošana</strong> — Audums tiek griezts pēc CNC šabloniem, pēc tam RF metināts pilna izmēra sānu malās un kamerās. Kamera tiek piepūsta līdz testēšanas spiedienam un atstāta uz 24 h sākotnējai stabilizācijai.</li>
    <li><strong>Montāža un aprīkošana</strong> — Korpuss un sānu malas tiek savienoti. Tiek uzstādītas spuru kastes un kravu stiprinājumi, uzstādītas drošības auklas pieslēgvietas un pārnešanas rokturi, piepūšanas vārsts pievilkts ar noteiktu momentu, kā arī uzklāts un izlīdzināts klāja pārklājums.</li>
    <li><strong>Statiskie testi</strong> — Pirms dēlis saskaras ar ūdeni, tas iziet: peldspējas pārbaudi (pilna slodze + 30 % rezerve), kameru spiediena noturēšanas testu, vārsta noplūdes testu, rokturu un stiprinājumu izraušanas testu.</li>
    <li><strong>Jūras testu programma</strong> — 20 stundas testēšanas ūdenī, sīkāk aprakstītas tālāk.</li>
    <li><strong>Prototipa izvērtēšana</strong> — Tiek rīkota formāla apstiprināšanas sanāksme ar inženierijas, ražošanas un kvalitātes komandām. Visas nepieciešamās dizaina izmaiņas tiek dokumentētas un iekļautas ražošanas laidienā.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20 stundu jūras testu programma — testu grafiks</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Iepazīšanās uz klata ūdens — vadāmība zema ātrumā, griešanās, stājas un līdzsvara pārbaude</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Ātruma tests — ar GPS verificēts maksimālais ātrums, ilgstošas braukšanas ātrums, noturīgs temps pie 3 airēšanas ritmiem</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Griešanās tests — pagrieziena uz vietas un plaša pagrieziena rādiuss, dēļa reakcija, kreisais un labais borts</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Viļņu tests — atkārtoti braucieni caur 0.5–1.0 m viļņiem; akselerometrs braucēja stājas pozīcijā</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Stabilitātes tests — statiskais sānsveres leņķis ar 4 dažāda svara braucējiem, nobīdīta slodze uz labo bortu</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Izturības brauciens — 3 h nepārtraukti braukšanas tempā; kameru spiediena, sānu malas temperatūras un braucēja noguruma uzraudzība</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Galīgā pārbaude — visu komponentu pārbaude pēc testiem, visu stiprinājumu pievilkšana un pārbaude, atklājumu dokumentēšana</span>
      </div>
    </div>
  </div>

  <h2>Pielāgota prototipēšana unikāliem lietojumiem</h2>
  <p>Prototipu darbnīca ir vieta, kur mēs risinām problēmas, kuras standarta ražošanas dēļi nespēj atrisināt. Nesenie piemēri:</p>
  <ul>
    <li>Augsta redzamības glābšanas SUP dēlis meklēšanas un glābšanas organizācijai, kuram nepieciešami integrēti tveršanas rokturi, aprīkojuma stiprinājumi glābšanas iekārtām un augstas peldspējas korpuss cietušā izglābšanai — viss tika prototipēts, aprīkots un testēts mūsu objektā.</li>
    <li>Ekspedīciju tūrisma SUP dēlis hidrogrāfiskās izpētes uzņēmumam ar noņemamu instrumentu mastu, hermētiskām aprīkojuma atverēm un zema profila tranducera stiprinājumu, kas izstrādāts pretestības samazināšanai.</li>
    <li>Kompakts makšķerēšanas SUP dēlis kūrorta flotei, kur prototips tika izmantots, lai validētu stabilitāti, aprīkojuma izvietojumu un izturību ikdienas nomas lietošanā, pirms klients apņēmās iegādāties četru dēļu floti.</li>
  </ul>

  <h2>Mūsu prototipēšanas komanda</h2>
  <p>Darbnīcā strādā astoņi daudzpusīgi jūras tehniķi, no kuriem katrs ir apguvis vismaz divas no trim pamata disciplīnām (korpuss, sānu malas, aprīkošana). Komandas vadītājs ir izgatavošanas meistars ar 16 gadu pieredzi — no individuāliem vienreizējiem būvējumiem līdz ražošanas sērijām. Katram prototipam tiek piešķirts atsevišķs projekta inženieris, kas visa būvēšanas un testēšanas procesa laikā ir klienta vienīgais kontaktpunkts.</p>

  <h2>Klienta iesaiste</h2>
  <p>Mēs aktīvi aicinām savus klientus piedalīties galvenajos prototipa būvēšanas posmos — īpaši sākotnējā aprīkojuma izvērtēšanā un jūras testos. Jūsu praktiskās atsauksmes šajos posmos ir nenovērtējamas dēļa pilnveidē pirms tā nonākšanas ražošanā. Mēs nebūvējam noplūgtā sētā; mēs būvējam partnerībā ar jums.</p>
  <p>20 stundu jūras tests ir arī iespēja jūsu komandai iepazīties ar dēļa vadāmību, klāja izkārtojumu un apkopes prasībām, kas nodrošina vienmērīgu pāreju ekspluatācijā, kad ražošanas dēļi tiek piegādāti.</p>


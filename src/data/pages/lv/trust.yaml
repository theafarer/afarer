warranty_section:
  title: 'Garantija un pēcpārdošanas atbalsts'
  subtitle: 'Mēs stāvam aiz katra produkta ar skaidriem garantijas nosacījumiem, ātru prasījumu izskatīšanu un īstām rezerves daļām.'
  items:
    - title: '2 gadu produkta garantija'
      desc: 'Visiem afarer produktiem ir 2 gadu garantija pret ražošanas defektiem — šuvju plīsumi, vārstu defekti un materiālu delaminācija normālā lietošanā.'
    - title: 'Detaļu atbalsts visu kalpošanas laiku'
      desc: 'Īstas rezerves daļas — vārsti, remonta komplekti, spuras, D-gredzeni — pieejamas visiem modeļiem. Mēs uzturam veidnes un iekārtas vismaz 5 gadus pēc ražošanas beigām.'
    - title: 'Atbilde uz prasījumiem 48 stundu laikā'
      desc: 'Garantijas prasījumi tiek apstiprināti 48 stundu laikā. Aizvietotie dēļi apstiprinātu prasījumu gadījumā tiek nosūtīti 10 darba dienu laikā.'
    - title: 'Globāls remonta tīkls'
      desc: 'Autorizēti remonta centri 15+ valstīs. Lauka remonta komplekti pieejami attālinātām operācijām. Pašrocīgas remonta instrukcijas nelieliem bojājumiem.'
    - title: 'OEM klientu atbalsts'
      desc: 'Atveltīti konta menedžeri B2B partneriem. Ceturkšņa biznesa pārskati, krājumu plānošana un kopīga zīmola mārketinga atbalsts.'
    - title: 'Sertifikācijas pakete'
      desc: 'Pilna atbilstības dokumentācija tiek piegādāta ar katru sūtījumu — CE deklarācija, testu atskaites, materiālu drošības datu lapas.'
      link: '/contact'


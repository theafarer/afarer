features3_certifications:
  title: 'Sertifikāti un atbilstība'
  subtitle: 'Katrs produkts ir neatkarīgi pārbaudīts un sertificēts atbilstoši starptautiskiem standartiem.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'CE sertifikācija'
      description: 'Visi afarer SUP dēļi atbilst Eiropas CE drošības standartam atpūtas lietošanai. Katrs produkts pirms rūpnīcas atstāšanas tiek pakļauts spiediena, peldspējas un slodzes testiem.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'Mūsu 12,000 m² lielā Cindao rūpnīca darbojas saskaņā ar ISO 9001 kvalitātes vadības sistēmu. Katra ražošanas partija ir izsekojama, dokumentēta un pārbaudīta.'
      icon: 'tabler:clipboard-check'
    - title: 'BSCI sociālā atbilstība'
      description: 'Mēs esam BSCI sertificēti, kas nodrošina ētisku darba praksi, drošus darba apstākļus un vides atbildību visā mūsu piegāžu ķēdē.'
      icon: 'tabler:users'
    - title: 'REACH un RoHS'
      description: 'Visi materiāli — PVC, EVA putuplasts, līmes — atbilst ES REACH un RoHS regulām. Nav aizliegtu vielu, nav kompromisu.'
      icon: 'tabler:flask'
    - title: 'Materiālu testēšanas laboratorija'
      description: 'Iekšējā materiālu laboratorija pirms ražošanas pārbauda stiepes izturību, UV izturību, šuvju integritāti un pretberzes īpašības katrai auduma partijai.'
      icon: 'tabler:microscope'
    - title: '2 gadu garantija'
      description: 'Katram afarer produktam ir divu gadu garantija pret ražošanas defektiem. Mēs stāvam aiz tā, ko radām.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'Klientu uzticība'
  title: 'Ko saka mūsu klienti'
  subtitle: 'No pirmajiem airētājiem līdz profesionāliem flotes operatoriem — uzziniet, kāpēc viņi uzticas afarer.'
  items:
    - content: 'Mēs aprīkojām visu savu nomas floti ar afarer SUP dēļiem. Divas sezonas vēlāk — nulle avāriju. CE sertifikāts padarīja apdrošināšanas apstiprināšanu vienkāršu.'
      name: 'Marco V.'
      title: 'Tūrisma operators, Horvātija'
    - content: 'Kā pircējs pirmajā reizē es raizējos par kvalitāti. ISO dokumentācija un testu atskaites, ar kurām viņi dalījās, deva man pilnīgu pārliecību.'
      name: 'James T.'
      title: 'SUP Explorer 11 īpašnieks, Kanāda'
    - content: 'Mēs sadarbojamies ar afarer mūsu piekrastes patruļas vienībām. Viņu kvalitātes kontroles process ir nemainīgs katrai partijai — šī uzticamība ir svarīga misijai kritiskās operācijās.'
      name: 'Lt. Cmdr. Andres'
      title: 'Valsts iepirkumi, Filipīnas'

steps2_manufacturing:
  title: 'Kā mēs nodrošinām kvalitāti'
  subtitle: 'No izejvielu pārbaudes līdz galīgajai spiediena testēšanai — katrs produkts iziet stingru kvalitātes ķēdi.'
  items:
    - title: 'Izejvielu pārbaude'
      description: 'Katrs PVC auduma rullis pirms nonākšanas ražošanā tiek pārbaudīts uz biezumu, stiepes izturību un UV izturību.'
      icon: 'tabler:search'
    - title: 'Kvalitātes kontrole procesā'
      description: 'Metinājuma šuves, vārstu uzstādīšana un kameru savienojumi montāžas laikā tiek pārbaudīti katrā darba vietā.'
      icon: 'tabler:eye'
    - title: 'Spiediena testēšana'
      description: 'Katrs piepūšamais produkts tiek uzpūsts līdz 1.25x nominālā PSI un turēts 24–48 stundas, lai pārbaudītu gaisa noturību un šuvju integritāti.'
      icon: 'tabler:wind'
    - title: 'Galīgā pārbaude'
      description: 'Katra vienība pirms apstiprināšanas nosūtīšanai tiek pārbaudīta uz apdari, furnitūru un iepakojumu. Partijas paraugi nonāk mūsu laboratorijā destruktīvai testēšanai.'
      icon: 'tabler:clipboard-check'


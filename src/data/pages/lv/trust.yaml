faqs_sup:
  title: 'Biežāk uzdotie jautājumi par SUP dēļiem'
  subtitle: 'Bieži uzdotie jautājumi par mūsu stāvēšanas airu dēļiem.'
  columns: 2
  items:
    - title: 'Kāda izmēra SUP dēļus afarer piedāvā?'
      description: 'Mēs piedāvājam SUP dēļus no 9 pēdām līdz 12 pēdām — no kompaktiem universāliem dēļiem līdz tūrisma un specializētiem dizainiem. Katrs modelis ir pieejams ar vairākām konfigurācijas opcijām.'
    - title: 'Kāda ir atšķirība starp piepūšamo SUP un cieto SUP?'
      description: 'Piepūšamais SUP izmanto Drop-Stitch konstrukciju ar tūkstošiem iekšēju diegu, kas ļauj izturēt augstu gaisa spiedienu, savukārt cietais SUP izmanto epoksīda vai stikla šķiedras materiālu. Piepūšamie SUP dēļi piedāvā pārvadāšanas un uzglabāšanas ērtību, nezaudējot stingrību.'
    - title: 'Kāds ir svara ierobežojums SUP dēļiem?'
      description: 'Mūsu SUP dēļi atkarībā no modeļa un tilpuma iztur līdz 150 kg. Katrā produkta lapā ir norādīts maksimālais slodzes vērtējums jūsu konkrētajam modelim.'
    - title: 'Vai afarer SUP dēļi ir CE sertificēti?'
      description: 'Jā. Visi atpūtas SUP modeļi ir CE sertificēti saskaņā ar piemērojamiem Eiropas standartiem atpūtas lietošanai.'
    - title: 'Kāda garantija attiecas uz SUP dēļiem?'
      description: 'Visiem afarer SUP dēļiem ir standarta viena gada garantija pret ražošanas defektiem, kas aptver šuvju plīsumus, vārstu defektus un materiālu delamināciju normālā lietošanā.'
    - title: 'Cik ilgs laiks nepieciešams SUP dēļa piepūšanai?'
      description: 'Izmantojot komplektā iekļauto roku sūkni, pilna piepūšana līdz 15 PSI aizņem aptuveni 8–12 minūtes. Ātrākai piepūšanai mēs iesakām afarer 12V elektrisko sūkni, kas piepūš dēli mazāk nekā 4 minūtēs.'

faqs_materials:
  title: 'Biežāk uzdotie jautājumi par SUP materiāliem un kopšanu'
  subtitle: 'Bieži uzdotie jautājumi par mūsu piepūšamo SUP materiāliem, kopšanu un uzglabāšanu.'
  columns: 2
  items:
    - title: 'Kādi materiāli tiek izmantoti afarer piepūšamajos SUP dēļos?'
      description: 'Mēs izmantojam militārā līmeņa PVC (1100 denjē) ar UV stabilizētu, pret berzi izturīgu konstrukciju, kas atbilst ES REACH un RoHS regulām.'
    - title: 'Cik ilgi kalpo piepūšamie SUP dēļi?'
      description: 'Ar pareizu kopšanu kvalitatīvs PVC piepūšamais SUP kalpo 5–10 gadus. Regulāra tīrīšana, UV aizsardzība un pareiza uzglabāšana ievērojami pagarina kalpošanas laiku.'
    - title: 'Kāda apkope ir nepieciešama piepūšamajam SUP?'
      description: 'Pamata apkope ietver skalošanu ar saldūdeni pēc katras lietošanas (īpaši sālsūdenī), izžāvēšanu pirms uzglabāšanas, vārstu blīvju pārbaudi reizi gadā un ilgstošas tiešas saules starojuma izvairīšanos, ja dēlis netiek lietots.'
    - title: 'Vai piepūšamos SUP dēļus var lietot sālsūdenī?'
      description: 'Jā. Visi afarer piepūšamie SUP dēļi ir paredzēti lietošanai gan saldūdenī, gan sālsūdenī. Pēc sālsūdens lietošanas iesakām noskalot ar saldūdeni un rūpīgi izžāvēt.'
    - title: 'Kā uzglabāt piepūšamo SUP?'
      description: 'Pirms uzglabāšanas dēli atspiediet, notīriet un pilnībā izžāvējiet. Satiniet brīvi (izvairieties no ciešām krokām), uzglabājiet vēsā, sausā vietā prom no tiešiem saules stariem un turiet prom no betona grīdas, lai novērstu mitruma uzsūkšanos.'
    - title: 'Kāda ir afarer piepūšamo SUP dēļu svarietilpība?'
      description: 'Svarietilpība svārstās no 100 kg mazākajiem modeļiem līdz vairāk nekā 200 kg lielākajiem dēļiem. Katrā produkta lapā ir norādīts maksimālais slodzes vērtējums jūsu konkrētajam modelim.'


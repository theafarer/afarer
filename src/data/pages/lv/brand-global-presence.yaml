features3_markets:
  tagline: 'Galvenie tirgi'
  title: 'Reģionālā kompetence<br />vietējām prasībām'
  subtitle: 'Mēs saprotam, ka dažādiem tirgiem ir atšķirīgas regulatīvās prasības, preferences un lietošanas gadījumi.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Eiropa un Apvienotā Karaliste'
      description: 'CE sertificēti produkti. Spēcīgs pieprasījums pēc SUP dēļiem ES tirgos. Apvienotās Karalistes izplatītāji novērtē mūsu ātro izpildi.'
      icon: tabler:map-pin
    - title: 'Ziemeļamerika'
      description: 'ASV Krasta apsardzes apstiprināta ražošana. ASV noliktava Montklērā, Kalifornijā, ātrai piegādei Rietumu krastā. Augošs pieprasījums pēc makšķerēšanas, glābšanas un atpūtas SUP dēļiem.'
      icon: tabler:map-pin
    - title: 'Austrālija un Okeānija'
      description: 'Spēcīgs tirgus SUP dēļiem un ūdens sporta aksesuāriem. Austrālijas izplatītāji novērtē mūsu UV izturīgo PVC konstrukciju skarbos saules apstākļos. Ātra piegāde no mūsu Āzijas objekta.'
      icon: tabler:map-pin
    - title: 'Tuvie Austrumi'
      description: 'Augošs pieprasījums pēc ūdens piedzīvojumu aprīkojuma. Mūsu komerciālā līmeņa SUP dēļi un drošības aprīkojums ir populārs starp tūrisma operatoriem un nomas centriem. Pielāgotas konfigurācijas augstas temperatūras vidēm.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Izplatīšanas tīkls'
  title: 'Partnerība ar izplatītājiem<br />visā pasaulē'
  subtitle: 'Mēs sadarbojamies ar atzītiem jūras aprīkojuma izplatītājiem, ūdens sporta zīmoliem un valsts iepirkumu aģentūrām.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Kopīga zīmola programmas'
      description: 'Privātā zīmola ražošana globāliem ūdens sporta zīmoliem. Mēs pārvaldām visu — no dizaina līdz ražošanai un tiešajai nosūtīšanai.'
      icon: tabler:building
    - title: 'Izplatītāju tīkls'
      description: 'Autorizēti izplatītāji 20+ valstīs uztur krājumus un sniedz vietējo atbalstu. Jauni izplatītāju pieprasījumi ir gaidīti.'
      icon: tabler:users
    - title: 'Valsts un institucionālie klienti'
      description: 'Tieša piegāde krasta apsardzēm, meklēšanas un glābšanas organizācijām un militārajam iepirkumam. Atbilstība institucionālajām iepirkumu prasībām.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Globālā loģistika un atbalsts'
  subtitle: 'No rūpnīcas līdz galamērķim — mēs pārvaldām visu piegāžu ķēdi.'
  items:
    - title: 'Piegādes iespējas'
      description: 'Jūras kravu pārvadājumi (FOB Cindao), gaisa pārvadājumi steidzamiem pasūtījumiem un ekspreses kurjers paraugiem un rezerves daļām.'
      icon: tabler:truck-delivery
    - title: 'ASV noliktava'
      description: 'Krājumi Montklērā, Kalifornijā, ātrai piegādei visā Ziemeļamerikā. Rietumu krasts: 2-3 dienas, centrālā daļa: 3-4 dienas, Austrumu krasts: 4-5 dienas.'
      icon: tabler:building-warehouse
    - title: 'Rezerves daļas'
      description: 'Īstās afarer rezerves daļas un palīgmateriāli krājumos visu gadu. Biežākās daļas tiek nosūtītas 24 stundu laikā.'
      icon: tabler:package
    - title: 'Tehniskais atbalsts'
      description: 'Tieša līnija uz mūsu inženieru komandu tehniskiem jautājumiem, remonta padomiem un rezerves daļu atbalstam. Mēs atbalstām arī dēļus, ko uzbūvējām pirms 20 gadiem.'
      icon: tabler:headset
cta:
  title: 'Vēlaties kļūt par izplatītāju?'
  subtitle: 'Mēs aktīvi paplašinām savu izplatīšanas tīklu. Sazinieties ar mūsu eksporta komandu, lai apspriestu partnerības iespējas.'
  actions:
    - variant: primary
      text: 'Partnerības pieprasījums'
      href: /contact
    - text: 'Apskatiet mūsu produktu klāstu'
      href: /products

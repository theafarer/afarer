features3_reasons:
  tagline: 'Kāpēc izvēlēties afarer'
  title: 'Septiņi iemesli sadarboties ar mums'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Īsta ražošana, nevis tirdzniecība'
      description: 'Mēs esam 12,000 m² rūpnīcas īpašnieki un pārvaldītāji. Sadarbojoties ar afarer, jūs strādājat tieši ar cilvēkiem, kuri izstrādā, konstruē un būvē jūsu produktus — bez starpniekiem.'
      icon: tabler:building-factory
    - title: '2. Uz inženieriju balstīta pieeja'
      description: 'Mūsu dizaina process sākas ar lietojuma gadījumu, nevis produktu kategoriju. Mēs optimizējam korpusa formu, materiālu izvēli un konfigurāciju atbilstoši tam, kā dēlis tiešām tiks izmantots.'
      icon: tabler:engine
    - title: '3. Sertificēta kvalitāte'
      description: 'CE sertificēts, ISO kvalitātes sistēma, BSCI atbilstība, REACH atbilstība, USCG apstiprinājums. Katrs produkts atbilst starptautiskiem standartiem — ne tikai apgalvojumiem.'
      icon: tabler:certificate
    - title: '4. Elastīgs kopīgais zīmols'
      description: 'Sānu malu krāsas, klāja izkārtojums, zīmolrade, iepakojums — mēs pielāgojam jūsu specifikācijām. Bez minimālā pasūtījuma spiediena. Sāciet ar prototipu, paplašinieties ar pārliecību.'
      icon: tabler:adjustments
    - title: '5. Globālā loģistika'
      description: 'ASV noliktava Kalifornijā, tieša piegāde no Cindao, gaisa pārvadājumi steidzamiem pasūtījumiem. Mēs pārvaldām muitas formalitātes un dokumentāciju.'
      icon: tabler:truck-delivery
    - title: '6. Atbalsts visu kalpošanas laiku'
      description: 'Mēs atbalstām arī dēļus, ko uzbūvējām pirms 20 gadiem. Īstās rezerves daļas, tehniskie padomi, remonta norādījumi — mūsu komanda ir pieejama, kad jums tā nepieciešama.'
      icon: tabler:lifebuoy
    - title: '7. Godīgas specifikācijas'
      description: 'Īsti slodzes vērtējumi, īsti izmēri, īsts svars. Bez mārketinga piepūšanas. To, ko publicējam, jūs arī saņemat — apstiprināts ar neatkarīgu testēšanu.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Globālo zīmolu uzticēšanās'
  title: 'Ko saka mūsu partneri'
  items:
    - content: 'Mēs esam strādājuši ar vairākiem ražotājiem Ķīnā, taču afarer izceļas ar savu inženieru atbalstu un nemainīgo kvalitāti. Viņi attiecas pret mūsu zīmolu kā pret savējo.'
      name: '— Kopīga zīmola partneris, Eiropas ūdens sporta zīmols'
    - content: 'Viņu SUP dēļi mūsu flotē ir ekspluatācijā vairāk nekā 5 gadus. Minimāla apkope, lieliska UV izturība. 5 gadu garantija dod mums pārliecību.'
      name: '— Flotes operators, Tuvo Austrumu kūrortu grupa'
    - content: 'afarer komanda palīdzēja mums izstrādāt pielāgotu SUP dēļa dizainu no koncepta līdz ražošanai 90 dienās. Kvalitāte pārsniedza mūsu cerības.'
      name: '— Izplatītājs, Austrālijas ūdens sports'

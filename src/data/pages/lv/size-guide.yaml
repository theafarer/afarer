  title: Kā izvēlēties pareizo izmēru
  cards:
    - title: SUP dēļi
      description: Izvēlieties garumu, pamatojoties uz savu svaru un paredzēto lietojumu. Platāki dēļi (32"+) piedāvā vairāk stabilitātes. Garāki dēļi (11-12 pēdas) labāk notur virzienu tūrismam. Smagākiem airētājiem vajadzīgi lielāka tilpuma dēļi.
    - title: Tūrisma SUP
      description: Garāki dēļi (11–12 pēdas) ir vislabākie attālumu veikšanai un tūrismam. Platāki dēļi (32"+) piedāvā vairāk stabilitātes. Pārbaudiet kravnesību kopējai slodzei, ieskaitot aprīkojumu.
    - title: Universālie SUP
      description: Izvēlieties garumu pēc braucēja svara un paredzētā lietojuma. Universālie dēļi der atpūtai, fitnesam un jogai. Mazāki dēļi ir manevrēt spējīgāki.

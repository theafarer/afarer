stories:
  tagline: 'Pētnieku stāsti'
  title: 'Īsti piedzīvojumi no īstiem cilvēkiem'
  subtitle: 'Uzklausiet airētājus, ģimenes un profesionāļus, kuri uz ūdens izmanto afarer aprīkojumu.'
  items:
    - name: 'Sarah un Mike'
      title: 'SUP Explorer 11 īpašnieki, Kanāda'
      content: 'Mēs paņēmām savus Explorer 11 nedēļu ilgam ceļojumam cauri Algonkinas parkam. Tie lieliski tika galā ar pārnesumiem un ezeru šķērsošanu. Drop-Stitch konstrukcija nozīmēja, ka varējām piepūst līdz 15 PSI un iegūt cietā dēļa veiktspēju no salokāma dēļa.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Algonkinas parks, Kanāda'
    - name: 'Carlos R.'
      title: 'Cheetah Surge braucējs, Spānija'
      content: 'Cheetah Surge ir mans pirmais lūgums piekrastes braucieniem. Dzīvīgais dizains pludmalē piesaista skatienus, un stabilitāte dod man pārliecību vieglos viļņos. Tas darbojas lieliski gan tūrismā, gan vienkārši baudot saulrietu.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Kosta Brava, Spānija'
    - name: 'Lina un ģimene'
      title: 'Flowing Lotus airētāji, Zviedrija'
      content: 'Nedēļas nogales ģimenes piedzīvojumi arhipelāgā. Flowing Lotus ir pietiekami stabils, lai mana meita varētu uz tā stāvēt, kamēr es airēju. Uzpūšas aptuveni 10 minūtēs — nav nepieciešama piekabe, tikai tīras ģimenes izklaides uz ūdens.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Stokholmas arhipelāgs, Zviedrija'
    - name: 'Lt. Cmdr. Andres'
      title: 'Ocean Voyager pētnieks, Filipīnas'
      content: 'Es izmantoju savu Ocean Voyager tālsatiksmes piekrastes tūrēm ap Palavanu. Pēc vairāku mēnešu ikdienas lietošanas tropiskos apstākļos dēlis joprojām darbojas kā jauns. Tūrisma forma šķērso viļņus, kas apturētu vājākus dēļus.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palavana, Filipīnas'
    - name: 'Emma T.'
      title: 'Tropical Breeze iesācēja, Austrālija'
      content: 'Pirms tam nekad nebiju bijusi uz SUP dēļa. Tropical Breeze ir tik stabils, ka jutu pārliecību jau pirmajā reizē. Tagad airēju katru nedēļas nogali. Apmācības līkne praktiski ir nulle — un dēlis uz ūdens izskatās lieliski.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Austrālija'


hero:
  tagline: 'afarer pielāgošanas laboratorija'
  title: 'Izveidojiet savu<br />SUP dēli'
  subtitle: 'Pielāgota SUP partnerība, piedāvājot kopīgu zīmolu, privāto zīmolu un individuālu airu dēļu ražošanu uzņēmumiem visā pasaulē. No viena prototipa līdz pilnas ražošanas partijām.'
  cta: 'Sāciet savu projektu'
  footer_link: /contact/

steps_section:
  tagline: 'Kā tas darbojas'
  title: 'No koncepta līdz ražošanai'
  subtitle: 'Četri soļi no jūsu idejas līdz gatavam, jūrai gatavam produktam.'
  steps:
    - num: '01'
      title: 'Izvēlieties savu dēli'
      desc: 'Izvēlieties no mūsu pamata SUP modeļiem — universālie, tūrisma, joga, sporta vai bērnu. Izvēlieties izmēru, materiālu un krāsu.'
    - num: '02'
      title: 'Augšupielādējiet savu dizainu'
      desc: 'Nosūtiet mums savu logotipu, māksliniecisko noformējumu vai zīmola vadlīnijas. Mūsu dizaina komanda sagatavos digitālu paraqdruku.'
    - num: '03'
      title: 'AI maketa izskatīšana'
      desc: 'Apskatiet fotoreālistisku ar MI ģenerētu jūsu pielāgotā dēļa maketu pirms ražošanas sākuma.'
    - num: '04'
      title: 'Ražošana un piegāde'
      desc: 'Pēc apstiprinājuma jūsu pasūtījums nonāk mūsu ražošanas līnijā. Izpildes laiks no 30 dienām.'

services_section:
  tagline: 'Pakalpojumi'
  title: 'Ražošanas pakalpojumi globāliem zīmoliem'
  subtitle: 'Elastīgi sadarbības modeļi — no līgumražošanas līdz pilna servisa zīmolu veidošanai.'
  items:
    - title: 'Kopīga zīmola ražošana'
      desc: 'Mēs ražojam jūsu dizainus pēc specifikācijas — jūsu intelektuālais īpašums, jūsu rasējumi, jūsu kvalitātes standarti. Pilna NDA aizsardzība.'
      icon: ⚙️
    - title: 'Dizaina risinājumi'
      desc: 'Izvēlieties no 50+ pārbaudītām platformām un pielāgojiet izmēru, krāsu, grafiku un iepakojumu.'
      icon: '🎨'
    - title: 'Privātais zīmols'
      desc: 'Jūsu zīmols uz mūsu produktiem — logotips, iepakojums, piekariņi, instrukcijas. Gatavs mazumtirdzniecībai uzreiz no kastes.'
      icon: '🎨'
    - title: 'Pielāgots zīmolējums'
      desc: 'Klājuma paklāja drukāšana, korpusa grafika, balonu uzlīmes un pielāgotas etiķetes — pilna zīmola integrācija.'
      icon: ⚙️


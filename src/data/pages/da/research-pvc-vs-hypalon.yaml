hero:
  tagline: Materialer
  title: PVC vs. Hypalon — teknisk sammenligning til oppustelige både
  subtitle: 10 minutters læsetid
content_html: >
  <h2>Materialeoversigt</h2>


  <h3>PVC (polyvinylchlorid)</h3>

  <p>PVC er en termoplastisk polymer, der i vid udstrækning bruges til fremstilling af oppustelige både. Til marineformål er den typisk forstærket med et polyestervæv (1,100 – 1,680 DTEX) og coated på begge sider. Moderne marine-PVC-formuleringer indeholder UV-stabilisatorer og blødgørere, som
  forbedrer fleksibiliteten og vejrbestandigheden.</p>


  <h3>Hypalon (CSM – chlorosulfoneret polyethylen)</h3>

  <p>Hypalon er en syntetisk gummiblanding (produceres i dag generisk som CSM, efter at DuPont ophørte med Hypalon-varemærket). Materialet er kendt for enestående UV- og ozonbestandighed, hvilket gør det til det foretrukne valg for professionelle og militærkvalitets oppustelige både, der i lange
  perioder er udsat for direkte sollys.</p>


  <h2>Sammenligning side om side</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Egenskab</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">PVC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Hypalon (CSM)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">UV-bestandighed</td><td class="p-3 border">God (med stabilisatorer)</td><td class="p-3 border">Fremragende (iboende)</td></tr>
      <tr><td class="p-3 border font-medium">Slidbestandighed</td><td class="p-3 border">God</td><td class="p-3 border">Meget god</td></tr>
      <tr><td class="p-3 border font-medium">Trækstyrke</td><td class="p-3 border">3,000 – 5,000 N/5cm</td><td class="p-3 border">2,500 – 4,000 N/5cm</td></tr>
      <tr><td class="p-3 border font-medium">Vægt (pr. m&sup2;)</td><td class="p-3 border">850 – 1,200 g</td><td class="p-3 border">1,100 – 1,500 g</td></tr>
      <tr><td class="p-3 border font-medium">Kuldefleksibilitet (lav temperatur)</td><td class="p-3 border">-30&deg;C</td><td class="p-3 border">-20&deg;C</td></tr>
      <tr><td class="p-3 border font-medium">Reparationsmuligheder</td><td class="p-3 border">Let (varmesvejsning eller klæbemiddel)</td><td class="p-3 border">Kræver særligt CSM-klæbemiddel</td></tr>
      <tr><td class="p-3 border font-medium">Samlingsmetode</td><td class="p-3 border">RF-svejsning, varmluftssvejsning</td><td class="p-3 border">Håndlimning (kontaktlim)</td></tr>
      <tr><td class="p-3 border font-medium">Omkostning (materiale)</td><td class="p-3 border">$8 – $15 / m&sup2;</td><td class="p-3 border">$20 – $40 / m&sup2;</td></tr>
      <tr><td class="p-3 border font-medium">Levetid (tropisk sol)</td><td class="p-3 border">5 – 8 år</td><td class="p-3 border">10 – 15 år</td></tr>
    </tbody>
  </table>


  <h2>Hvilken skal du vælge?</h2>


  <h3>Vælg PVC, når:</h3>

  <ul>
    <li>Budget er den vigtigste faktor</li>
    <li>Båden opbevares uden for direkte sollys</li>
    <li>Vægten har betydning (PVC er 15 – 25 % lettere)</li>
    <li>Du har brug for fleksibilitet ved lave temperaturer under -20&deg;C</li>
    <li>Du ønsker et bredere udvalg af farvemuligheder</li>
  </ul>


  <h3>Vælg Hypalon, når:</h3>

  <ul>
    <li>Båden fortøjes eller opbevares i direkte sollys</li>
    <li>Du befinder dig i et tropisk miljø eller med høj UV-eksponering</li>
    <li>Maksimal holdbarhed og levetid er prioriteten</li>
    <li>Du udruster professionelle eller kommercielle flåder</li>
    <li>Slid fra sand, beton eller broer er en bekymring</li>
  </ul>


  <h2>Fremstillingsmæssige forskelle</h2>

  <p>PVC-både fremstilles ved hjælp af RF-svejsning (radiofrekvens) eller varmluftssvejsning, som skaber en molekylær binding mellem de coatede stoflag. Det muliggør automatiseret, ensartet produktion med høj kapacitet. Hypalon-både samles ved håndlimning med kontaktlim. Hver søm rulles og presses
  manuelt, hvilket gør Hypalon-produktionen mere arbejdskrævende.</p>


  <h2>afarer-anbefaling</h2>

  <p>For de fleste fritidsbrugere tilbyder moderne PVC i høj kvalitet med UV-stabilisatorer den bedste balance mellem pris, vægt, ydeevne og holdbarhed. afarer anvender 1,680 DTEX marine-PVC med tredobbelt coating til sine forbruger- og OEM-produktlinjer. Til kommercielle og offentlige kunder, der
  kræver langvarig UV-eksponering, tilbyder vi Hypalon-produktion på forespørgsel.</p>

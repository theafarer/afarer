meta:
  title: Private label SUP-produktion | {SITE}
  description: Lancer dit eget SUP-brand med Afarer. Fra idé til marked — fuld OEM/ODM-service inklusive design, prototyping, produktion og global logistik.
hero:
  tagline: Byg dit eget brand
  title: Lancer dit eget<br />SUP-brand
  subtitle: Du har visionen. Vi har fabrikken, ekspertisen og forsyningskæden. Sammen bygger vi et brand, der skiller sig ud.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: Specialtilpasset brandet SUP-board på vandet
process:
  title: Din brandrejse
  subtitle: Fra idé til marked i 5 faser.
  steps:
    - phase: Fase 1
      title: Idé
      period: Uge 1-2
      items:
        - Markedsundersøgelser & konkurrentanalyse
        - Definition af målgruppen
        - Workshop om brandpositionering
        - Produktlinjestrategi
    - phase: Fase 2
      title: Design
      period: Uge 3-6
      items:
        - Boardets form & grafisk design
        - Farveafstemning og materialevalg
        - Specifikation af tilbehør
        - Emballage- og labeledesign
    - phase: Fase 3
      title: Prototype
      period: Uge 7-10
      items:
        - Prøveproduktion
        - Kvalitetstest (tryk, opdrift, UV)
        - Designtilpasninger
        - Endelig godkendelse
    - phase: Fase 4
      title: Produktion
      period: Uge 11-14
      items:
        - Bulkproduktion
        - QC-inspektion (pr. enhed)
        - Havfragt / luftfragt
        - Toldklaringsdokumenter
    - phase: Fase 5
      title: Lancering
      period: Uge 15-16
      items:
        - Produktfotografering
        - Produktfeed til hjemmesiden
        - Markedsføringsmaterialer
        - Lanceringssupport
packages:
  title: Startup-pakker
  subtitle: Pakker designet til alle faser af brandets vækst.
  items:
    - name: Starter Brand
      tagline: 50-100 enheder · 2 board-modeller
      features:
        - Grundlæggende logotryk
        - Standardemballage
        - E-mail-support
    - name: Growing Brand
      tagline: 300-1,000 enheder · 3-5 boardmodeller
      features:
        - Tilpasset farve + logo
        - Tilpasset emballage
        - Produktfotos
        - Dedikeret projektleder
    - name: Established Brand
      tagline: 1,000+ enheder · Komplet produktsortiment
      features:
        - Fuld tilpasning
        - Premium-emballage
        - Markedsføringsmateriale
        - Prioriteret produktion
features:
  title: Hvorfor brands vælger Afarer
  subtitle: 10+ års OEM-erfaring, fuld certificering og den laveste MOQ i branchen.
  items:
    - title: 10+ års OEM-erfaring
      description: 2.400+ skrog leveret til brands verden over.
      icon: tabler:clock
    - title: Fuld certificering
      description: CE / ISO / UKCA / BSCI / REACH — alt certificeret.
      icon: tabler:certificate
    - title: 30 dages leveringstid
      description: Hurtigere end branchegennemsnittet fra ordre til forsendelse.
      icon: tabler:truck-delivery
    - title: Lav MOQ
      description: Fra 50 enheder — det laveste i branchen.
      icon: tabler:package
    - title: Internt design
      description: Fuld designstøtte fra koncept til endelig grafik.
      icon: tabler:palette
    - title: Global logistik
      description: Support med søfragt, luftfragt og fortoldning.
      icon: tabler:world
cta:
  title: Klar til at lancere dit brand?
  subtitle: Start din brandrejse, eller download vores OEM-guide.
  actions:

hero_text:
  tagline: Contact
  title: GET IN TOUCH
contact_form:
  id: form
  title: Send os en besked
  subtitle: Tilbud, tekniske spørgsmål eller partnerskabshenvendelser —skriv til os. Vi svarer inden for én arbejdsdag.
  email_to: info@afarer.com
  submit_button: Send forespørgsel →Få et tilbud
  success_message: Tak! Din besked er landet i vores indbakke. Vi svarer inden for én arbejdsdag.
  error_message: Noget gik galt ved afsendelse af din besked. Prøv igen eller send os en e-mail direkte.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: løs venligst følgende'
  fields:
    - name: firstName
      label: Fornavn
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Efternavn
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Virksomhedsnavn
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Adresse
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Postnummer
      row: 4
      step: 2
    - name: country
      label: Land
      row: 4
      step: 2
    - name: email
      label: E-mail
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Forventet ordremængde
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Brug for tilpasning?
      row: 7
      step: 2
    - name: productInterest
      label: Produktkategorier af interesse
      row: 8
      step: 2
    - name: subject
      label: Emne
      row: 9
      step: 3
    - name: message
      label: Besked
      row: 10
      type: textarea
      rows: 6
      step: 3

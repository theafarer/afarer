hero:
  tagline: Partners & Distribution
  title: 'Bliv en afarer-partner<br />—Globalt distributionsnetværk'
  subtitle: "Join afarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries."
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: Partner Programs
  title: 'Partnerprogrammer<br />bygget til vækst'
  subtitle: 'Uanset om du er distributør, forhandler eller brandpartner, tilbyder afarer programmer designet til at støtte din virksomhed.'
  columns: 3
  items:
    - title: 'Distributor Program'
      description: 'Eksklusiv territoriedistribution med volumenpriser, markedsføringsstøtte og direkte fabrikkadgang. Minimumsforpligtelse baseret på territoriestørrelse.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Direkte forhandlerpriser, produkttræning, markedsføringsmaterialer og garantistøtte til detailbutikker og onlinebutikker.'
      icon: tabler:building-store
    - title: 'OEM/ODM Partnership'
      description: 'Fullservice OEM- og ODM-fremstilling med tilpasset branding, emballage og produktspecifikationer. Fra koncept til container.'
      icon: tabler:certificate
    - title: 'Brand Partnership'
      description: 'Co-branding, private label og eksklusive modelprogrammer for etablerede brands inden for marine- og friluftsrekreation.'
      icon: tabler:stars
    - title: 'Government & Institutional'
      description: 'Foretrukne leverandørprogrammer for offentlige myndigheder, kystvagter, militære og humanitære organisationer. Tilbudsklar dokumentation.'
      icon: tabler:building-community
    - title: 'Resort & Rental Partner'
      description: 'Flådeprising, konsekvent kvalitet og tilpasset branding til resorts, dykkercentre og udlejningsvirksomheder verden over.'
      icon: tabler:sun
content_benefits:
  tagline: Why Partner With Us
  title: 'Hvorfor partnere vælger afarer'
  subtitle: 'Vores partnere drager fordel af reel fremstillingskapacitet, konsekvent kvalitet og responsiv support.'
  list:
    - 'Direct Factory Access: Work directly with our manufacturing team —no middlemen. Get faster responses, better pricing, and full visibility into production.'
    - 'Customization Ready: Brand your products with custom colors, logos, packaging, and specifications. Minimum order quantities tailored to your market.'
    - 'Quality Guaranteed: ISO 9001 certified production with CE, UKCA, and BSCI compliance. Every product tested before shipping.'
    - 'Global Logistics: Shipping from Qingdao, China with FOB, CIF, and DDP options. US warehouse in Montclair, CA for North American distribution.'
    - 'Marketing Support: Product catalogs, photography, technical documentation, and digital assets to support your sales efforts.'
    - 'Training & Support: Product training for your sales team, technical support for your customers, and warranty service coordination.'
content_process:
  tagline: How to Become a Partner
  title: 'Enkel partnerskabsproces'
  subtitle: 'Vores partnerskabsproces er ligetil —designet til at få dig til at sælge afarer-produkter hurtigt.'
  items:
    - title: 'Step 1: Submit Application'
      description: 'Udfyld vores partneransøgningsformular med din virksomhedsprofil, målmarked og produktinteresser.'
    - title: 'Step 2: Qualification Review'
      description: 'Vores partnerskabsteam gennemgår din ansøgning og kontakter dig inden for 3 hverdage for at diskutere muligheder.'
    - title: 'Step 3: Agreement & Setup'
      description: 'Underskriv en partnerskabsaftale, opret din konto og modtag partnerpriser, markedsføringsmaterialer og produktprøver.'
    - title: 'Step 4: Training & Launch'
      description: 'Produkttræning, salgsstøtte og markedsføringsmaterialer leveres. Du er klar til at begynde at sælge.'
cta:
  title: 'Klar til at blive en afarer-partner?'
  subtitle: 'Ansøg om partnerskab, og vores team svarer inden for 3 hverdage.'
  actions:
    - variant: primary
      text: Apply for partnership
      href: /contact
    - text: View our products
      href: /products

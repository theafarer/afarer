meta:
  title: 'Viden — SUP- & bådguides | {SITE}'
  description: 'afarers vidensbase: guides om oppustelige SUP-brædder, paddle board-materialer, bådvalg og brancheindsigt for brands og professionelle.'
  keywords:
    - 'SUP viden'
    - 'oppustelig SUP guide'
    - 'paddle board materialer'
    - 'SUP brancheindsigt'
hero:
  tagline: Vidensgraf
  title: Vandudforskningsviden
  subtitle: |
    En struktureret vidensbase, der dækker oppustelig SUP-teknologi,<br />
    vandsikkerhed, bådteknik og eventyrplanlægning.
  taglineSection: Udforsk. Lær. Gå med tillid.
clusters:
  tagline: Vidensklynger
  title: Udforsk efter emne
  subtitle: Dybdegående dyk ned i teknologien, sikkerheden og færdighederne bag hvert afarer-produkt.
  items:
    - title: SUP-viden
      description: Fra valg af dit første bræt til avancerede turteknikker — alt om paddleboarding.
      icon: tabler:lifebuoy
      topics:
        - Sådan vælger du dit første oppustelige SUP
        - Bedste SUP-størrelse til begyndere
        - Hvor svært er paddleboarding?
        - Oppustelig vs hård plade sammenligning
        - SUP-sikkerhedstjekliste
    - title: SUP-teknik og teknologi
      description: Tekniske guider om oppustelige SUP-boards — materialer, konstruktionsmetoder og produktionsprocesser.
      icon: tabler:microscope
      topics:
        - Drop-stitch teknologi i dybden
        - PVC-specifikationer i militær kvalitet
        - Fusionseglaminering vs. klæbning
        - EVA-skumteknologi og grafikmetoder
        - SUP-ventiltyper og finnesystemer

    - title: Sikkerhedsviden
      description: Væsentlig sikkerhedsviden for enhver padler — fra PFD-valg til vejrlæsning til selvbjergningsteknikker.
      icon: tabler:shield
      topics:
        - SUP-sikkerhedstjekliste
        - Har du brug for en redningsvest?
        - Sikkerhedsguide til havpadling
        - Reparationsteknikker til oppustelige produkter
        - Vejr- og vandforholdsbevidsthed
    - title: Teknologi
      description: Ingeniørarbejdet bag afarer-produkter — materialer, konstruktionsmetoder og kvalitetstestning.
      icon: tabler:microscope
      topics:
        - Marine-grade PVC-teknologi
        - Drop-stitch kerne forklaret
        - Hvorfor PSI betyder noget for oppustelige SUP'er
        - RF-svejsning vs klæbebinding
        - Kvalitetstestning og certificering
    - title: SUP-livsstil og særlige anvendelser
      description: Specialiserede SUP-aktiviteter — yoga, fiskeri, hunde, familier og rejsetips.
      icon: tabler:heart
      topics:
        - SUP-yoga og meditation på vandet
        - Fiskeri fra et opslåeligt SUP-board
        - Paddleboarding med hunde og børn
        - Rejse med din SUP med fly og bil
        - SUP-tilbehør og essentielt udstyr
    - title: SUP-sammenligninger og referencer
      description: Side-by-side-sammenligninger, der hjælper dig med at træffe velinformerede beslutninger.
      icon: tabler:chart-bar
      topics:
        - SUP vs. kajak — hvilken passer til dig?
        - 'Materialesammenligning: PVC vs Hypalon'
        - 'Sikkerhed: enkeltkammer vs. multi-kammer'
        - SUP-boardmaterialer forklaret
        - UV-print vs. EVA-blokmotiv

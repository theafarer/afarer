hero:
  tagline: Vidensgraf
  title: Vandudforskningsviden
  subtitle: |
    En struktureret vidensbase, der dækker oppustelig SUP-teknologi,<br />
    vandsikkerhed, bådteknik og eventyrplanlægning.
  taglineSection: Udforsk. Lær. Gå med tillid.
clusters:
  tagline: Vidensklynger
  title: Udforsk efter emne
  subtitle: Dybdegående dyk ned i teknologien, sikkerheden og færdighederne bag hvert afarer-produkt.
  items:
    - title: SUP-viden
      description: Fra valg af dit første bræt til avancerede turteknikker —alt om paddleboarding.
      icon: tabler:lifebuoy
      topics:
        - Sådan vælger du dit første oppustelige SUP
        - Bedste SUP-størrelse til begyndere
        - Hvor svært er paddleboarding?
        - Oppustelig vs hård plade sammenligning
        - SUP-sikkerhedstjekliste
    - title: Bådviden
      description: Tekniske guider om oppustelige både, SUP'er, joller og kajakker —teknik, materialer og drift.
      icon: tabler:sailboat
      topics:
        - Oppustelige bådtyper forklaret
        - PVC vs Hypalon sammenligning
        - SUP vs Jolle sammenligning
        - Drop-stitch teknologi dybdegående
        - Marine materialevidenskabsguide
    - title: Sikkerhedsviden
      description: Væsentlig sikkerhedsviden for enhver padler —fra PFD-valg til vejrlæsning til selvbjergningsteknikker.
      icon: tabler:shield
      topics:
        - SUP-sikkerhedstjekliste
        - Har du brug for en redningsvest?
        - Sikkerhedsguide til havpadling
        - Flodsikkerhed for oppustelige kajakker
        - Vejr- og vandforholdsbevidsthed
    - title: Teknologi
      description: Ingeniørarbejdet bag afarer-produkter —materialer, konstruktionsmetoder og kvalitetstestning.
      icon: tabler:microscope
      topics:
        - Marine-grade PVC-teknologi
        - Drop-stitch kerne forklaret
        - Hvorfor PSI betyder noget for oppustelige SUP'er
        - RF-svejsning vs klæbebinding
        - Kvalitetstestning og certificering
    - title: SUP Lifestyle & Special Uses
      description: Specialized SUP activities —yoga, fishing, dogs, families, and travel tips.
      icon: tabler:heart
      topics:
        - SUP yoga and meditation on water
        - Fishing from an inflatable SUP
        - Paddle boarding with dogs and kids
        - Traveling with your SUP by air and car
        - SUP accessories and gear essentials
    - title: SUP Comparisons & References
      description: Side-by-side comparisons to help you make informed decisions.
      icon: tabler:chart-bar
      topics:
        - SUP vs kayak — which is right for you?
        - PVC vs Hypalon material comparison
        - Single chamber vs multi-chamber safety
        - SUP board materials explained
        - UV printing vs EVA block artwork

hero_text:
  tagline: Resources
  title: 'Downloadecenter & Køberguides'
  subtitle: 'Få adgang til produktkataloger, OEM-guider, købersjekklister og teknisk dokumentation for at træffe informerede indkøbsbeslutninger.'
features3_downloads:
  tagline: Downloads
  title: 'Produktdokumentation<br />& Køberressourcer'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Komplet produktsortiment inklusive SUP-både, oppustelige både, SUP-brædder, kajakker og tilbehør. Specifikationer, konfigurationer og muligheder. PDF-format.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'Alt du har brug for at vide om OEM/ODM-partnerskaber: procesoversigt, minimumsordre, tilpasningsmuligheder, kvalitetskontrol og forsendelse.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'Sådan vælger du den rigtige SUP: skrogmaterialer, slangematerialer, motorvalg, størrelsesovervejelser og konfigurationsmuligheder til forskellige anvendelser.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'Vigtige overvejelser ved valg af SUP-brætproducent: kvalitetsindikatorer, certificeringskrav, MOQ-overvejelser og hvad du skal kigge efter ved en fabriksaudit.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC vs Hypalon: sammenligning af holdbarhed, UV-bestandighed, levetid, reparationsmuligheder og omkostningsovervejelser til forskellige marine anvendelser.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'Download vores produktbrief-skabelon. Udfyld dine krav og returner den til os for et tilbud og gennemførlighedsvurdering i samme uge.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Almindelige spørgsmål om vores produkter, fremstillingsproces og partnerskabsmodel.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ varierer efter produktkategori. SUP-både starter typisk fra 10 enheder per model. SUP-brædder fra 50 enheder. Kontakt vores salgsteam for produktspecifik MOQ-information.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Ja. afarer tilbyder prøveproduktion til evaluering før masseproduktion. Prøveomkostninger er forhandlingsbare og krediteres ofte den første produktionsordre.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Standardvilkår er 30% depositum ved bestilling, 70% før forsendelse. LC-vilkår tilgængelige for kvalificerede kunder. Kontakt vores økonomiafdeling for at drøfte arrangementer.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Typiske leveringstider: SUP-både 30-45 dage, SUP-brædder 20-30 dage, oppustelige både 25-35 dage. Tilpasset udvikling tilføjer 15-30 dage til prototyping.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'CE-certificering til EU-markeder, US Coast Guard godkendt fremstilling, ISO-kvalitetssystem, BSCI-overholdelse og REACH-materialeoverholdelse.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Ja. Vi leverer tilpasset emballage med dit logo, farver og brandidentitet. MOQ for tilpasset emballage afhænger af produktkategorien.'
      icon: tabler:color-swatch
cta:
  title: 'Har du brug for hjælp til at finde den rigtige ressource?'
  subtitle: 'Kontakt vores team for personlig vejledning om produktvalg, OEM-partnerskaber eller tekniske specifikationer.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

meta:
  title: B2B-ressourcer & downloads | {SITE}
  description: Download OEM-produktionsguides, produktkataloger, kvalitetsrapporter og ROI-beregnere til virksomheder inden for oppustelige SUP.
hero:
  tagline: Ressourcecenter
  title: Værktøjer og ressourcer<br />Til SUP-forretningspartnere
  subtitle: Download OEM-guides, produktkataloger og kvalitetsrapporter, og brug vores ROI-beregner til at planlægge din investering i en SUP-flåde.
resources:
  - title: 2026 OEM/ODM-produktkatalog
    description: Komplet produktsortiment med specifikationer, prisniveauer, MOQ og tilpasningsmuligheder til B2B-partnere.
    icon: tabler:file-text
    type: catalog
    link: /media
    cta: Download katalog
  - title: Guide til private label SUP-mærker
    description: Trin-for-trin-guide til at lancere dit eget SUP-brand — fra markedsanalyse og design til produktion og global levering.
    icon: tabler:book
    type: guide
    link: /news/private-label-sup-oem-guide
    cta: Læs guiden
  - title: ROI-beregner til SUP-flåder
    description: Beregn din investering i en SUP-flåde til resort eller klub, forventet omsætning og tilbagebetalingstid med vores interaktive lommeregner.
    icon: tabler:calculator
    type: tool
    link: '#roi-calculator'
    cta: Beregn ROI
  - title: Kvalitets- og certificeringsrapport
    description: CE-certificeringsdokumenter, ISO 9001-kvalitetsstyring, resultater af UV-ældningstest og data fra trykholdetest.
    icon: tabler:certificate
    type: report
    link: /evidence
    cta: Se rapporter
  - title: Brochure om fabrikkens kapacitet
    description: Virtuel rundvisning i vores 12.000 m² store produktionsfacilitet med detaljer om produktionslinjerne og kvalitetskontrolprocesserne.
    icon: tabler:building-factory
    type: brochure
    link: /factory
    cta: Besøg fabrikken
  - title: Guide til flådeindtægter for resorts
    description: ROI-analyse af kommercielle SUP-flåder med prismodeller, udnyttelsesgrader og resultater fra virkelige case studies fra 5-stjernede resorts.
    icon: tabler:chart-bar
    type: guide
    link: /news/commercial-sup-fleet-roi-resorts
    cta: Læs guiden
cta:
  title: Har du brug for skræddersyet support?
  subtitle: Kontakt vores B2B-team for personlig vejledning om dit projekt.
  button: Kontakt salgsteamet
  link: /contact?source=resources

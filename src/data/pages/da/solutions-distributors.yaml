benefits:
  title: Hvad distributører får
  subtitle: Alt, hvad du skal bruge for at få succes på dit marked.
  items:
    - Eksklusive territorierettigheder
    - Komplet produktkatalog (SUP, tilbehør, reservedele)
    - Konkurrencedygtige engrospriser
    - Marketing- og salgsmaterialer (oversat)
    - Træningsprogram (produkt, salg, vedligeholdelse)
    - Messesupport
    - Prøveprogram
    - Drop-ship-mulighed
    - Dedikeret account manager til distributører
    - Betalingsvilkår på 45-60 dage

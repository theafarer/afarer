meta:
  title: SUP-distributionspartnerprogram | {SITE}
  description: Bliv en del af Afarers globale distributionsnetværk. Eksklusive territorier, komplet produktportefølje, konkurrencedygtige engrospriser og dedikeret kundehåndtering.
hero:
  tagline: Distributører
  title: Bliv en del af vores globale<br />distributionsnetværk
  subtitle: Eksklusive territorier. Komplet produktsortiment. Support i verdensklasse. Afarer leverer til 50+ lande, og vi søger etablerede distributører inden for marine og vandsport.

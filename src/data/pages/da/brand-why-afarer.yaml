features3_reasons:
  tagline: Hvorfor vælge afarer
  title: Syv grunde til at samarbejde med os
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Ægte produktion, ikke handel
      description: Vi ejer og driver en 12.000 m² fabrik. Når du samarbejder med afarer, arbejder du direkte med folkene, der designer, konstruerer og bygger dine produkter — uden mellemmænd.
      icon: tabler:building-factory
    - title: 2. Ingeniørledet tilgang
      description: Vores designproces starter med anvendelsestilfældet, ikke produktkategorien. Vi optimerer skrogform, materialvalg og konfiguration til hvordan båden faktisk vil blive brugt.
      icon: tabler:engine
    - title: 3. Certificeret kvalitet
      description: CE-certificeret, ISO-kvalitetssystem, BSCI-overholdelse, REACH-overholdelse, USCG-godkendt. Hvert produkt opfylder internationale standarder — ikke bare påstande.
      icon: tabler:certificate
    - title: 4. Fleksibelt co-branding
      description: Rørfarver, konsollayout, branding, emballage — vi tilpasser til dine specifikationer. Intet minimum ordrepres. Start med en prototype, skaler med tillid.
      icon: tabler:adjustments
    - title: 5. Global logistik
      description: US-lager i Californien, direkte forsendelse fra Qingdao, luftfragt til hasteordrer. Vi håndterer toldpapirer og dokumentation.
      icon: tabler:truck-delivery
    - title: 6. Livslang support
      description: Vi støtter både vi byggede for 20 år siden. Ægte reservedele, teknisk rådgivning, reparationsvejledning — vores team er tilgængeligt når du har brug for os.
      icon: tabler:lifebuoy
    - title: 7. Ærlige specifikationer
      description: Virkelige lastklassifikationer, virkelige dimensioner, virkelig vægt. Ingen markedsføringsinflation. Hvad vi offentliggør, er hvad du får — verificeret af uafhængig test.
      icon: tabler:ruler-measure
testimonials:
  tagline: Betroet af brands over hele verden
  title: Hvad vores partnere siger
  items:
    - content: Vi har samarbejdet med flere producenter i Kina, men afarer skiller sig ud med deres tekniske support og konsekvente kvalitet. De behandler vores brand, som var det deres eget.
      name: — Co-brand-partner, europæisk vandsportsmærke
    - content: Deres Hypalon-RIB'er har været i drift hos vores flåde i over 5 år. Minimal vedligeholdelse, fremragende UV-bestandighed. Den 5-årige garanti på rørene giver os tryghed.
      name: — Flådeoperatør, resortkoncern i Mellemøsten
    - content: Afarer-teamet hjalp os med at udvikle et skræddersyet SUP-brætdesign fra koncept til produktion på 90 dage. Kvaliteten oversteg vores forventninger.
      name: — Distributør, australsk vandsport
cta:
  title: Klar til at opleve forskellen?
  subtitle: Kontakt vores team for at drøfte dit projekt. Ingen forpligtelse kræves — bare ærlige råd om fremstilling.
  actions:

  title: OEM-køberguide – indkøb af oppustelige fartøjer fra Asien | {SITE}
  description: 'Omfattende guide til sourcing af oppustelige både, SUP-brædder, kajakker og RIB''er hos asiatiske producenter: tjekliste til fabriksevaluering, QC-protokoller, verifikation af overholdelse, MOQ-forhandling, leveringsbetingelser og almindelige faldgruber.'

qc_section:
  tagline: Kvalitetskontrol
  title: Test- og kvalitetssikringsproces
  subtitle: Hver båd gennemgår obligatoriske tests, før den afsendes. Vores kvalitetslaboratorium arbejder uafhængigt af produktionen og rapporterer direkte til ledelsen.
  steps:
    - step: '1'
      title: Inspektion af råmaterialer
      desc: PVC-, Hypalon- og drop-stitch-stoffer gennemgår træktest (ASTM D751), rivningsforplantning og verifikation af UV-resistens, før nogen batch sendes i produktion.
    - step: '2'
      title: Lufttæthedstest i 48 timer
      desc: Hvert rørkammer pustes op til 125 % af det nominelle tryk og holdes i 48 timer. Et trykfald på under 5 % udløser automatisk afvisning og ny kontrol af sømmen.
    - step: '3'
      title: Belastnings- & balancetest
      desc: Færdige både lastes til maksimal nominel kapacitet og testes for stabilitet, fribord og manøvreevne. Hver båd vandtestes før den endelige inspektion.
oem_section:
  tagline: OEM-projekter
  title: 'Case studies: brand- & OEM-partnerskaber'
  subtitle: Fra koncept til container — sådan hjælper vi globale brands med at lancere og skalere deres oppustelige SUP-linjer.
  cases:
    - challenge: En europæisk outdoor-forhandler havde brug for en private-label SUP-serie med unikke dækgrafikker, miljøvenligt PVC og detailklar emballage — alt leveret på 60 dage.
      solution: Udviklede specialtilpassede digitale printfiler, indkøbte REACH-kompatibel PVC og reducerede stikprøvekontrollen fra 3 runder til 1 ved at placere designteamet på vores fabrik i Qingdao.
      result: 55 dage fra underskrevet PO til FOB. 2.400 enheder fordelt på 4 SKU'er. Genbestilling afgivet, før den første container ankom.
    - challenge: En amerikansk watersports-startup havde brug for et højtydende drop-stitch-SUP med specialform, co-brandet emballage og BSCI-certificering til detailmarkedet.
      solution: Tilpassede en eksisterende SUP-form med ændret omrids, udviklede co-brandet emballagegrafik og leverede fuld BSCI-auditdokumentation.
      result: Med succes optaget i 3 store amerikanske outdoor-kæder. 5.000+ enheder i første år med en salgsgennemstrømning på 98%.
    - challenge: En australsk distributør efterspurgte en CE-certificeret SUP-serie med specialtilpassede farver og overholdelse af australske standarder.
      solution: Producerede præproduktionsprøver i 4 farvevarianter og koordinerede tredjeparts compliance-testning.
      result: SUP-serie med 3 modeller lanceret på AU/NZ-markedet. Efterfulgt af sejr i et offentligt udbud om 12 patrulje-SUP-brætter.
faq_section:
  tagline: Ofte stillede spørgsmål
  title: B2B & OEM — ofte stillede spørgsmål
  questions:
    - q: Hvad er minimumsordreantallet (MOQ) for OEM-oppustelige SUP-brædder?
      a: MOQ starter ved 5–10 enheder for standard-OEM-modeller. Specialforme og private-label-projekter kræver et minimum på 200 enheder afhængigt af kompleksitet. Prøveordrer og samplekørsler er tilgængelige for nye brandlanceringer.
    - q: Har afarer BSCI-certificering?
      a: Ja. Vores fabrik har en gyldig BSCI-certificering for social overholdelse (auditrapport kan udleveres på forespørgsel). Vi har desuden ISO 9001 til kvalitetsstyring, og alle produkter bærer CE-certificering. Dokumentation for REACH- og RoHS-overholdelse medfølger ved hver OEM-forsendelse.
    - q: Hvad er den typiske leveringstid for en OEM-ordre?
      a: Standardleveringstiden er 30–45 dage fra bekræftet ordre og depositum ved OEM-serieproduktion. Udvikling af specialforme tilføjer 15–20 dage til værktøjsfremstilling. Fremskyndet produktion er tilgængelig for hastende ordrer og sæsonspidser. Prototypeprøver sendes typisk inden for 15–20 dage.
    - q: Kan I sende FOB Qingdao eller CIF til vores havn?
      a: Ja. Vi leverer FOB Qingdao, CIF til store globale havne og DDP for kvalificerede partnere. Vores logistikteam varetager containerbooking, eksportdokumentation og toldbehandling. Vi leverer til 50+ lande på tværs af EU-, USA-, AU- og Asien-markederne.
b2b_moq: 'Standard MOQ: 5–10 enheder pr. model (SUP/drop-stitch). SUP MOQ: 2–5 enheder. Prøveordrer velkomne til nye partnerskaber.'
production_flow:
  tagline: Produktionsflow
  title: Fra materiale til færdig båd
  subtitle: Hver båd gennemgår 6 produktionsfaser med QC-kontrolpunkter ved hvert trin. Ingen genveje, ingen oversprungne inspektioner.
  stages:
    - stage: '01'
      title: Materialemodtagelse & indgående kvalitetskontrol
      description: Alle indgående materialer registreres med batch-/lotnummer i vores ERP-system. PVC-stofruller, drop stitch-kerner, ventiler, klæbemidler og beslag sættes i karantæne, indtil QC har godkendt.
      qc_check: Trækstyrke (ASTM D751), rivestyrke (ISO 4674), tykkelsesmåling, klæbemiddelviskositet, visuel fejlkontrol
      qc_threshold: 100% af partierne testes. Kassér, hvis trækstyrken < 90% af specifikationen, rivestyrken < spec-minimum, eller der er visuelle defekter.
      responsibility: Team til indgående kvalitetskontrol (3 inspektører)
    - stage: '02'
      title: CNC-skæring & materialeforberedelse
      description: Computeroptimeret layout (nesting) placerer panelerne på PVC-materialet for at minimere spild. Automatiske CNC-skæremaskiner holder en positionsnøjagtighed på 0,1 mm.
      qc_check: Dimensionskontrol mod CAD DXF-filer, inspektion af kantkvalitet, verifikation af panelantal
      qc_threshold: Hver 20. bane måles. Tolerance ±0,5 mm. Afvis partiet, hvis over 2 % ligger uden for tolerancen
      responsibility: Leder af skæreværksted
    - stage: '03'
      title: Svejsning og drop-stitch-sammenføjning
      description: Drop-stitch-kerner bindes til de ydre PVC-laminater ved varmelaminering. Slangekamre svejses med RF-svejsning eller varmluftssvejsning. Rælingsbånd er fusionsbundet i tre lag.
      qc_check: Peeltest af hver 50. enhed (ASTM D751), måling af svejsebredde, gennemgang af temperaturlog for varmluft og visuel inspektion af sømme med bagbelysning
      qc_threshold: Afrivningsstyrke min. 8 N/cm. Tolerance for svejsebredde ±1 mm. Enhver synlig kanalisering = kassation
      responsibility: Svejse-QC (2 inspektører per skift)
    - stage: '04'
      title: Samling og rigging
      description: 'Bådene overgår til slutmontage, hvor alle komponenter samles: skrog + slanger, monterede ventiler, D-ringe, håndtag, finnekasser og tilpasning af transporttaske. Hver enhed følger en 100-punkts monteringscheckliste.'
      qc_check: Godkendelse via 100-punkts-tjekliste pr. enhed, ventilfunktionstest (10 åbnings-/lukkecyklusser), kontrol af hardwarets tilspændingsmoment, visuel inspektion
      qc_threshold: 'Nul-fejl-politik for sikkerhedskritiske komponenter (ventiler, D-ringe, håndtag). Mindre kosmetiske afvigelser: AQL 2,5 (ISO 2859)'
      responsibility: Samlingsholdets leder + linje-QC
    - stage: '05'
      title: Tryktestning & kvalitetskontrol
      description: Hvert kammer pustes op til 1.25× det nominelle tryk (typisk 20–25 PSI) og holdes i 24–48 timer. Tryksensorer logger løbende. Kamre, der overskrider et trykfald på 5 %, kasseres og sendes til fornyet inspektion af sømmene.
      qc_check: 24-timers log over trykfastholdelse, daglig verifikation af sensorkalibrering, temperaturkompenseret trykaflæsning, omtest af sømme efter reparation
      qc_threshold: Maks. 5 % trykfald over 24 timer ved stabil temperatur. Overskrider en kammer dette = 100 % gen-test af hele produktionspartiet
      responsibility: Kvalitetslaboratorium (uafhængigt af produktionen, refererer til ledelsen)
    - stage: '06'
      title: Endelig kontrol & pakning
      description: Endelig visuel og funktionel inspektion. Overfladefejl, farvekonsistens, kontrol af label/BIN, emballagens integritet og komplet tilbehør. Enhederne vakuumpakkes, kasseres og palleteres til containerlæsning.
      qc_check: Fuld visuel inspektion, tilbehørstjekliste pr. SKU, faldtest af emballage (1 m, tilfældig stikprøve), verificering via scanning af etiket/stregkode
      qc_threshold: AQL 2,5 for væsentlige fejl, AQL 4,0 for mindre fejl. Nultolerance ved sikkerhedsfejl. 100 % af enhederne inspiceres visuelt.
      responsibility: Endeligt QC-team (4 inspektører) + pakketeamets leder

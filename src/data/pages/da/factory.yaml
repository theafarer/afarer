workshops_section:
  tagline: Værksteder
  title: Produktionsværksteder
  workshops:
    - title: PVC-skæring & materialeforberedelse
      description: Automatiske CNC-skæremaskiner forarbejder PVC-, Hypalon- og drop-stitch-stoffer med præcision på under en millimeter. Computeroptimeret nesting minimerer materialespild og sikrer, at hver panel opfylder sin dimensionsspecifikation, før svejsning.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Rørsvejsning & varmeforsegling
      description: Dedikeret svejseværksted med varmeforseglingsmaskiner og RF-dielektriske presser. Varmluftsforseglere binder og svejser PVC-kammerrør sammen, mens RF-svejsninger giver stærke, lufttætte sømme, der overgår ISO 6185-kravene.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: Drop-Stitch kernebinding
      description: Drop-stitch-kernerne på SUP-boards bindes til de ydre PVC-laminater ved varmelaminering. Tusindvis af indre polyestertråde forbinder top- og bundlag og skaber en stiv struktur ved 12-15 PSI. Kantbåndene er fusionssvejset i tre lag for styrke langs kanterne.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: SUP-tryk og dekoration
      description: SUP-boards dekoreres med digitaltryk til fuldfarvegrafik og serigrafi til logoer og gentagne mønstre. Digitale printere producerer dækdesign i fotokvalitet, mens serigrafi giver holdbare, levende brandmarkeringer.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Endelig samling og tilpasning
      description: Samlebånd, hvor ventiler, D-ringe, håndtag, finnekasser og dækpuder monteres på hvert SUP-bræt. Hvert bræt følger en samlecheckliste med 100 punkter, som godkendes af teamlederen.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Kvalitetstest & inspektion
      description: Alle færdige både gennemgår obligatorisk lufttæthedstest, kontrol af sømmenes vedhæftning og et fuldt systemsjek inden afsendelse. Vores kvalitetslaboratorium arbejder uafhængigt af produktionen og rapporterer direkte til ledelsen.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

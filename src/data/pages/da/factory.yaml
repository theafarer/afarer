material_traceability:
  tagline: Sporbarhed
  title: Materialesporing & batchkontrol
  description: Hvert parti råmateriale tildeles et unikt lotnummer i vores ERP-system. Fra ankomst gennem produktion til færdigt produkt knytter hver båds stykliste sig tilbage til leverandørens oprindelige parti. Det muliggør fuld sporbarhed opstrøms ved enhver henvendelse om kvalitet eller overholdelse.
  system: Skræddersyet ERP (Qingdao Vatrad Groups interne system) + fysiske batchetiketter på hver arbejdsordre
  coverage: 100% af produktionsmaterialerne — PVC, Hypalon, drop-stitch-stof, klæbemidler, ventiler, hardware, emballage
  records_retained: 10 år (i henhold til CE 2013/53/EU-kravet)
  suppliers:
    - material: PVC af marinekvalitet
      source: Kinesiske og koreanske leverandører
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japansk leverandør
      certified: ISO 9001, REACH
    - material: Drop-stitch-stof
      source: Internt væveri + ekstern partner
      certified: Intern kvalitetskontrol + leverandørens ISO 9001
    - material: Ventiler & beslag
      source: Kinesiske OEM-leverandører
      certified: ISO 9001, materialecertifikater pr. batch

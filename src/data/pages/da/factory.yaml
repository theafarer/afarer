intro:
  - >-
    Som fabriksbrand under **Qingdao Vatrad Group Co., Ltd.** kontrollerer afarer alle produktionsled — fra ankomsten af rå PVC-materialer til den endelige inspektion af det færdige SUP-bræt inden levering. Vores produktionsanlæg i Qingdao Economic Development Zone strækker sig over 12.000
    kvadratmeter og huser dedikerede værksteder til PVC-skæring, samling af drop-stitch-kerner, digital tryk på SUP-brætter, slutmontage og kvalitetstestning.
  - >-
    Ved at samle design, ingeniørarbejde, prototyping, produktion og testning under ét tag eliminerer vi ineffektiviteten ved kontraktproduktion og bevarer den direkte kontrol over byggekvalitet, materialevalg og leveringstider. Hver SUP, der forlader vores værksted, er bygget af vores folk, på
    vores udstyr, efter vores standarder.

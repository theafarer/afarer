hero:
  tagline: Teknologi
  title: Bygget til ydeevne
  subtitle: Hvert afarer board er konstrueret med præcisionsmaterialer og fremstillingsmetoder testet til maritime miljøer.
sections:
  - title: Drop-stitch kerne
    description: Tusindvis af interne polyestertråde forbinder top- og bundlag og skaber en stiv struktur ved 12-15 PSI.
    imageAlt: DS kerne diagram
  - title: Militær-grade PVC
    description: Flerlags lamineret PVC-stof klassificeret til maritime miljøer. Hvert lag er smeltesvejset.
    imageAlt: PVC lag
  - title: Hypalon slanger
    description: Hypalon (CSM) gummi giver overlegen UV- og kemikaliebestandighed sammenlignet med standard PVC.
    imageAlt: Hypalon
  - title: Air Deck gulv
    description: Højtryks oppusteligt gulvsystem, der erstatter traditionelle krydsfinér- eller aluminiumsgulve.
    imageAlt: Air Deck

timeline:
  - year: '2012'
    title: Maritimt Produktionsgrundlag
    body: afarer begyndte som et specialiseret værksted for oppustelige vandfartøjer i Qingdao, Kina, med fokus på maritimt håndværk og produktion af oppustelige både. Det tidlige arbejde handlede om at bygge pålidelige oppustelige produkter gennem praktisk ingeniørerfaring og produktionsdisciplin.
  - year: '2015'
    title: Første Eksport & CE-certificering
    body: De første eksportordrer nåede Japan og Korea. CE-certificering blev opnået for kerneproduktlinjerne, hvilket markerede afarers indtog på internationale markeder. Virksomheden begyndte at betjene kommercielle og fritidsbrugere uden for Kina.
  - year: '2018'
    title: Fabriksudvidelse
    body: Flyttede til et 12.000 m² stort produktionsanlæg. Tilføjede RF-svejselinjer og drop-stitch-produktionskapacitet, hvilket muliggjorde større produktion og forbedrede kvalitetskontrolsystemer.
  - year: '2020'
    title: FoU-center Etableret
    body: Åbnede et dedikeret FoU-center med PVC-stoflaboratorium, hydrodynamisk testtank og CAD/FEA-simuleringsstudio. Produktudviklingen blev udvidet til at fokusere på let konstruktion, forbedret holdbarhed og brugercentreret design.
  - year: '2022'
    title: Certificering & Global Vækst
    body: Opnåede ISO 9001-certificering. Udvidede til 14 FoU-ingeniører og over 200 medarbejdere. Produkterne nåede kunder i hele Europa, Amerika og Asien-Stillehavsområdet gennem distributør- og co-brand-partnerskaber.
  - year: '2024'
    title: Innovations- & Designstudie
    body: Lancerede et full-service design- og innovationsstudie for skræddersyede co-brand-projekter, fra koncept til produktion. Styrkede professionelle maritime applikationer inklusive redning, kommercielle og offentlige udbud.
  - year: '2026'
    title: At Bygge Fremtiden for Vandudforskning
    body: I dag fortsætter afarer med at udvikle oppustelige både, SUP-systemer og skræddersyede maritime løsninger — og forbinder mennesker og organisationer med verdens have. 50+ lande betjent, 15.000+ enheder i årlig kapacitet.
content_founding:
  tagline: Begyndelsen
  title: Født ved Vandkanten
  subtitle: 'afarer startede i et kystværksted i Qingdao med én båd og en vision: at bygge oppustelige vandfartøjer, der kan klare virkelige maritime forhold.'
  paragraphs:
    - I 2012 så vores grundlæggere et hul på markedet — de fleste oppustelige både var enten prisvenlige men upålidelige, eller af høj kvalitet men uoverkommeligt dyre. De troede på, at der var plads til en producent, der leverede både kvalitet og værdi.
    - Det første skrog blev bygget i hånden, testet i lokale farvande og forfinet baseret på ægte feedback fra fiskere og mindre kommercielle operatører. Den feedback-loop — byg, test, lyt, forbedre — er stadig kernen i vores ingeniørfilosofi i dag.
    - I 2015 havde rygtet spredt sig ud over Qingdao. Internationale distributører begyndte at efterspørge prøver. Det, der startede som et lokalt værksted, var ved at blive en global leverandør.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarers tidlige produktionsværksted og fremstilling
content_growth:
  tagline: Vækst & Innovation
  title: Fra Værksted til 12.000 m² Facilitet
  subtitle: Kontinuerlige investeringer i mennesker, udstyr og processer har forvandlet afarer til en moderne maritim produktionsfacilitet.
  paragraphs:
    - I takt med at efterspørgslen voksede, voksede vores facilitet også. Vi udvidede fra et lille værksted til en 12.000 m² stor fabrik med dedikerede produktionslinjer til SUP-både, oppustelige både, SUP-brædder og tilbehør.
    - Vi investerede i CNC-skæremaskiner, højfrekvent svejseudstyr, drop-stitch-produktionslinjer og omfattende testrigge — så vi kan kontrollere alle aspekter af produktionskvaliteten.
    - I dag består vores team på over 200 af mariningeniører, materialeforskere, kvalitetskontrolspecialister og dygtige håndværkere — mange af dem har været med afarer siden de tidlige dage.
philosophy:
  tagline: Brandfilosofi
  title: Ingeniørkunst for Frihed på Vandet
  body: Frihed på vandet handler ikke kun om bevægelse. Det handler om at opdage nye steder, skabe udendørsoplevelser, forbinde mennesker med naturen og muliggøre professionelle missioner. Ingeniørkunsten gør den frihed mulig.
  pillars:
    - title: Pålidelighed Først
      body: Vandmiljøer kræver tillid. afarers produkter er designet omkring stabilitet, holdbarhed, sikkerhed og ensartet ydeevne.
    - title: Menneskecentreret Design
      body: Produkter skal tjene mennesker, ikke teknologi. Hver designbeslutning begynder med at forstå, hvordan mennesker bruger vandfartøjer, hvor de udforsker, og hvilke udfordringer de står over for.
    - title: Tilgængelig Udforskning
      body: Vand bør ikke kun tilhøre eksperter. afarer skaber udstyr, der gør det muligt for flere mennesker sikkert at opleve floder, søer, have og kystmiljøer.
    - title: Kontinuerlig Innovation
      body: Innovation handler ikke kun om at skabe nye produkter. Det handler om at forbedre hver detalje — materialer, strukturer, fremstilling og brugeroplevelse.
engineeringDna:
  tagline: Ingeniør-DNA
  title: Hvordan afarer Skaber Produkter
  areas:
    - title: Materialevidenskab
      body: afarer fokuserer på at vælge egnede materialer til forskellige marine miljøer. Vigtige overvejelser inkluderer slidstyrke, UV-bestandighed, trykstabilitet og langsigtet holdbarhed.
      items:
        - Slidstyrke
        - UV-bestandighed
        - Trykstabilitet
        - Langsigtet holdbarhed
    - title: Konstruktionsteknik
      body: Oppustelige vandfartøjer kræver en præcis balance mellem stivhed, vægt, portabilitet og stabilitet. afarers ingeniørkunst fokuserer på at optimere disse faktorer gennem drop-stitch-kerneteknologi og avanceret sømkonstruktion.
      items:
        - Stivhed
        - Vægtoptimering
        - Portabilitet
        - Stabilitet
    - title: Produktionspræcision
      body: 'Hvert produkt gennemgår kontrollerede processer: materialeforberedelse, præcisionsskæring, svejsning og samling, montage, kvalitetsinspektion og ydelsesverifikation.'
      items:
        - Materialeforberedelse
        - Præcisionsskæring
        - Svejsning & Samling
        - Montage & Kvalitetskontrol
    - title: Brugerscenarioteknik
      body: Produkter udvikles omkring virkelige anvendelser — rekreation, eventyr og professionel brug — og sikrer, at hvert design opfylder de specifikke krav i dets tilsigtede miljø.
      items:
        - Rekreation
        - Eventyr
        - Professionelt
        - Kommercielt

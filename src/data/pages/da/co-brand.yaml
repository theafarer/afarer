faqs:
  title: 'Co-brand — FAQ'
  subtitle: 'Hvordan Afarer co-branding fungerer, og hvordan det adskiller sig fra OEM og private label.'
  items:
    - title: 'Er co-branding det samme som OEM eller private label?'
      description: 'Nej. Afarer driver ikke længere et åbent OEM/private label-program. Co-brand-produkter forbliver Afarer-produkter — designet, konstrueret, kvalitetstestet og båret af Afarer-brandet. Jeres identitet optræder som et co-brand, ikke som et upræget tredjepartsprodukt.'
    - title: 'Hvem kan starte et co-brand-projekt?'
      description: 'Kvalificerede vandsportsvirksomheder: eksisterende landepartnere, paddleklubber, resorts og hoteller, eventarrangører og fællesskaber. Send os en projektkort beskrivelse, og vi bekræfter anvendeligheden, før designarbejdet begynder.'
    - title: 'Vil co-branding komme i konflikt med min landedistributør?'
      description: 'Nej. Modellen med ét land, én distributør har forrang. Co-brand-kollektioner koordineres med den lokale landepartner, hvor en sådan findes, så ingen parallel eller konkurrerende brand optræder inden for et beskyttet territorium.'
    - title: 'Hvad er minimumsordren på en co-brand-kollektion?'
      description: 'Pilotkollektioner starter ved 30–50 stk. Standardkollektioner er 50–100 stk.; store eller multiregionale udgaver er 100+ stk. Tidsplaner for skræddersyet udvikling aftales pr. projekt.'
    - title: 'Hvad udgør Afarer-kvalitet kontra partnerbidrag?'
      description: 'Afarer ejer produktdesign, konstruktion, materialer, opbygning, QC og garanti. Partnere bidrager med kollektionskoncept, naming, farver, grafik input og go-to-market. Det holder én kvalitetsstandard på vandet.'
    - title: 'Hvordan ansøger jeg?'
      description: 'Udfyld co-brand-forespørgselsformularen med jeres virksomhed, marked og kollektionsidé. Vi gennemgår passende match og svarer inden for 3 hverdage med et forslag og Co-Brand Project Agreement.'

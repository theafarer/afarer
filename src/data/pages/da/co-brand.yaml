features:
  title: 'Hvad co-branding betyder hos Afarer'
  subtitle: 'Co-branding er vores designsamarbejdsprogram — bygget omkring Afarer-brandet, territorialbeskyttelse og begrænsede kollektioner, ikke upræget produktion.'
  columns: 3
  items:
    - title: 'Afarer-produkter forbliver Afarer-produkter'
      description: 'En co-brand-kollektion er en begrænset udgave af Afarer-boards med jeres identitet vævet ind. Aldrig upræget, aldrig et tredjepartsbrand og aldrig et åbent private label-program.'
      icon: 'tabler:trademark'
    - title: 'Designet med jer'
      description: 'Jeres farver, naming og historie former kollektionen. Vores design- og konstruktionsteam håndterer dæk, grafik, emballage og dokumentation fra brief til levering.'
      icon: 'tabler:pencil'
    - title: 'Til klubber, resorts, events & fællesskaber'
      description: 'Flådekollektioner til paddleklubber og resorts, event-udgaver til løb og fællesskabsserier — alle med Afarers kvalitet og garanti.'
      icon: 'tabler:users'
    - title: 'Beskytter landepartnere'
      description: 'Co-branding kører ved siden af vores model med ét land, én distributør. Nationale partnere beholder deres territorium; co-brand-kollektioner åbner ikke døren for parallelle brands på deres marked.'
      icon: 'tabler:shield-check'
    - title: 'Ingeniørarbejde & kvalitetsstandarder'
      description: 'Hver kollektion afsendes fra vores certificerede forsyningskæde med CE- og ISO 9001-dokumentation, tryktest og de samme QC-kontrolpunkter som vores kernekollektion.'
      icon: 'tabler:certificate'
    - title: 'Bliver en aktiv for jeres brand'
      description: 'En begrænset co-brand-kollektion bygger jeres egen historie på vandet — dækningsbidrag, medieindhold og en grund til, at paddlere vender tilbage sæson efter sæson.'
      icon: 'tabler:star'

meta:
  title: Sådan vælger du SUP-tykkelse — teknisk analyse | {SITE}
  description: 'Teknisk guide til tykkelsen af opslåelige SUP-boards: hvordan boards på 4", 5" og 6" adskiller sig med hensyn til stivhed, vægt, stabilitet, retningsstabilitet og ydeevne. Anbefalinger til tykkelse ved touring, yoga, surfing, racing og all-around-padling.'
back_text: Tilbage til Forskning
hero:
  tagline: Teknik
  title: Sådan vælger du SUP-tykkelse — teknisk analyse
  subtitle: 6 minutters læsning
content_html: >
  <h2>De tre standardtykkelser</h2>


  <h3>4" (10 cm) – Touring &amp; performance</h3>

  <ul>
    <li>Højeste stivhed – mindre fleks under belastning</li>
    <li>Lettest – mindre materiale, mindre luftvolumen</li>
    <li>Fremragende kursstabilitet – mindre rulning fra side til side</li>
    <li>Hurtigst – mindre modstand, lettere glid</li>
    <li>Bedst til: touring, racing, fitness-padling og øvede padlere</li>
  </ul>


  <h3>5" (12,7 cm) – All-Around</h3>

  <ul>
    <li>God stivhed – afbalanceret forhold mellem fleks og stivhed</li>
    <li>Moderat vægt – standardmaterialeforbrug</li>
    <li>God primær + sekundær stabilitet</li>
    <li>Bedst til: rekreativ padling, begyndere og afslappet brug på sø og flod</li>
  </ul>


  <h3>6" (15,2 cm) – Stabilitet &amp; yoga</h3>

  <ul>
    <li>Højeste primære stabilitet – massiv opdrift</li>
    <li>Tungest – mere PVC-materiale, større luftvolumen</li>
    <li>Langsomst – mere modstand, sværere at holde glidet i gang</li>
    <li>Bedst til: yoga/fitness, tunge padlere (100+ kg) og meget urolige forhold</li>
  </ul>


  <h2>Teknisk analyse</h2>

  <p>Stivheden af en oppustelig SUP bestemmes af det indre lufttryk og inertimomentet af boardets tværsnit. Ved 20 PSI viser et 4" board cirka 30 % mindre nedbøjning under belastning end et 6" board med samme bredde og længde. Den primære stabilitet kommer fra bredden ved vandlinjen og opdriften;
  den sekundære stabilitet påvirkes af kantformen (rail) og boardets bredde.</p>


  <h2>Tykkelse efter padlerens vægt</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Padlervægt</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Anbefalet tykkelse</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Under 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" eller 6"</td></tr>
      <tr><td class="p-3 border">Over 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>Tykkelse vs. PSI-afvejning</h2>

  <p>En udbredt misforståelse er, at højere PSI kan opveje overdreven tykkelse. Ved 25 PSI viser et 6" board mere fleks end et 4" board ved 15 PSI, fordi det geometriske inertimoment dominerer stivhedsligningen. For præstationsorienterede padlere klarer et tyndere board ved lavere tryk sig bedre end
  et tykkere board ved højere tryk.</p>


  <h2>Afarer-sortimentet</h2>

  <ul>
    <li><strong>4" boards:</strong> Cheetah Touring-serien – 12' x 30" x 4" touring-SUPs til fitness og distanceture</li>
    <li><strong>5" boards:</strong> Cheetah All-Round-serien – 10'6" x 32" x 5" til rekreativ brug</li>
    <li><strong>6" boards:</strong> Cheetah Ultra-Stable-serien – 10' x 34" x 6" til yoga, store padlere og som platform til fotografering</li>
  </ul>

  <p>Alle boards bruger 1.680 DTEX drop-stitch-kerner med et nominelt tryk på 20 PSI og 1,2 mm PVC-laminater.</p>

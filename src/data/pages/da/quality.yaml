tests:
  - title: Tryktestning
    description: Oppustelige kamre udsættes for tryk, der overstiger anbefalede driftsgrænser i længere perioder.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: Stødtestning
    description: Produkter udsættes for kontrollerede stød fra forskellige vægte og vinkler.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: UV-modstandstestning
    description: Færdige produkter udsættes for simuleret sollys i længere perioder.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: Slidstyrketestning
    description: Materialeprøver gnides mod slibende overflader i et bestemt antal cyklusser.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: Lavtemperaturtestning
    description: Produkter testes i kolde miljøer for funktionalitet og holdbarhed.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: Opdrifts- og belastningstestning
    description: Produkter testes med forskellige vægte for at bestemme maksimal bæreevne.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: Manøvredygtighedstestning
    description: Produkter testes for reaktion på pagaj- eller motorinput.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: Vandtæthedstestning
    description: Fuldstændigt samlede produkter nedsænkes eller udsættes for vandsprøjt for at kontrollere lækager.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp

founding:
  tagline: Vores grundlæggelse
  title: Fra en kystværksted<br />til en 12.000 m² facilitet
  subtitle: afarer blev grundlagt af et team af marineingeniører med årtiers kombineret erfaring inden for design af oppustelige både, PVC/Hypalon-fremstilling og global fremstilling af marineudstyr.

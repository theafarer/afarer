      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Designfilosofi
  title: Ingeniør-ledet design<br />—hver detalje tæller
  subtitle: Vores ingeniørfilosofi er centreret omkring tre principper, der styrer hvert produkt vi bygger.
  list:
    - 'Pålidelighed først: Ethvert afarer-produkt er testet til at modstå virkelige forhold —fra redningsoperationer i koldt vand til udlejning på tropiske resorts. Vi overdimensionerer, hvor det betyder mest.'
    - 'Produktionspræcision: Vores faciliteter anvender CNC-skæring, højfrekvenssvejsning og automatiseret tryktestning. Hver søm, hver ventil og hver beslag lever op til dokumenterede specifikationer.'
    - 'Løbende innovation: Vores R&D-team vurderer løbende nye materialer, produktionsmetoder og designforbedringer. Vi venter ikke på problemer —vi foregriber dem.'
cta:

    - title: 200+ medarbejdere
      description: Inklusive 50+ FoU-ingeniører, kvalitetskontrolspecialister og produktionsteknikere.
      icon: tabler:users
    - title: Facilitet på 12,000 m²
      description: Dedikeret fremstillingsanlæg med 6 produktionslinjer til SUP'er, oppustelige både og SUP-brædder.
      icon: tabler:building-factory
    - title: 50+ betjente lande
      description: Eksporterer til Europa, Amerika, Mellemøsten, Asien-Stillehavet og Afrika.

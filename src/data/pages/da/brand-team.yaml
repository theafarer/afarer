hero:
  tagline: Our Team
  title: 'Menneskerne bag afarer<br />—Konstruktionsfrihed på vandet'
  subtitle: 'Grundlagt i 2012 i Qingdao, Kina, blev afarer bygget af marineingeniører, materialforskere og vandsportsentusiaster, der troede på at gøre professionelle oppustelige fartøjer tilgængelige verden over.'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'Fra en kystværksted<br />til en 12.000 m² facilitet'
  subtitle: 'afarer blev grundlagt af et team af marineingeniører med årtiers kombineret erfaring inden for design af oppustelige både, PVC/Hypalon-fremstilling og global fremstilling af marineudstyr.'
  items:
    - title: 'Founded: 2012'
      description: 'Etableret i Qingdao, Kina —et stort maritimt knudepunkt med dyb skibsbygningsarv.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'Inklusive 50+ FoU-ingeniører, kvalitetskontrolspecialister og produktionsteknikere.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: "Dedikeret fremstillingsanlæg med 6 produktionslinjer til SUP'er, oppustelige både og SUP-brædder."
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Eksporterer til Europa, Amerika, Mellemøsten, Asien-Stillehavet og Afrika.'
      icon: tabler:globe

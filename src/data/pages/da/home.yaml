meta:
  title: 'Performance oppustelige SUP-boards — Afarer Water Sports | {SITE}'
  description: "afarer designer performance-oppustelige SUP'er til åbent vand, touring, yoga og eventyr. Drop-stitch-stivhed, tryktestet board for board, med eksklusive landepartnerskaber og begrænsede co-branded kollektioner. Udforsk kollektionen."
  keywords:
    - 'performance oppustelig sup'
    - 'premium oppusteligt paddleboard'
    - 'oppusteligt sup board brand'
    - 'touring oppustelig sup'
    - 'co-branded paddleboard'
    - 'lande-sup-distributør'
hero:
  tagline: 'Performance-oppustelige SUP-boards'
  title: 'Kom længere.<br />Padl stærkere.'
  subtitle: |-
    Performance-oppustelige SUP'er designet til åbent vand, lange dage,<br />
    og friheden til at udforske — stabile, når det gælder,<br />
    stive under pres og klar til foranderligt vand.
  taglineSection: Professionelle opslåelige SUP-løsninger til resorts, klubber, forhandlere og vandsportsbrands.
  actions:
    - variant: primary
      text: Udforsk boards
      href: /inflatable-sup
      icon: tabler:waves
    - text: Hent katalog
      href: /resources/download-catalog
      icon: tabler:file-text
    - text: Udforsk SUP-løsninger
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: afarer oppustelige SUP boards ved vandkanten på et tropisk resort — kommerciel flåde til vandforretninger
who_we_serve:
  tagline: Hvem vi betjener
  title: Komplette SUP-løsninger til enhver vandvirksomhed
  subtitle: Formålsbygget udstyr, produktion og forretningsstøtte til fire nøglemarkeder.
  items:
    - title: Paddleklubber
      keywords: SUP-klubudstyr, udstyr til paddelskoler, udlejningsflåde
      description: Holdbare SUP-flåder, klubpriser og reservedelsprogrammer til padleklubber og skoler.
      icon: tabler:users
      cta: Udforsk Paddle Club-løsninger
      link: /solutions/paddle-clubs
    - title: Resorts og hoteller
      keywords: vandaktiviteter på resorts, strandudstyr til hoteller, gæsteoplevelse
      description: Komplette SUP-flådeprogrammer med tilpasset branding, personaleuddannelse og ROI-optimerede pakker.
      icon: tabler:building
      cta: Skab din resorts vandoplevelse
      link: /solutions/resorts-hotels
    - title: Detailpartnere
      keywords: SUP-grossister, udendørsforhandlere og sportsudstyrsbutikker
      description: Fuld produktlinje, markedsføringsmateriale, dropshipping-muligheder og konkurrencedygtige engrosmargener.
      icon: tabler:shopping-cart
      cta: Bliv detailpartner
      link: /solutions/retail-partners
    - title: Landedistributører & co-brand-partnere
      keywords: lande-SUP-distributør, co-branded SUP, private label SUP
      description: Eksklusiv distribution land for land og begrænsede co-branded kollektioner for kvalificerede vandsportsvirksomheder.
      icon: tabler:package
      cta: Bliv partner
      link: /distributor-program
proof_points:
  title: Testet ud over showroomet
  subtitle: Design, ydeevne og kvalitet, du kan verificere — på vandet og i tallene.
  items:
    - metric: 10+
      label: Års erfaring med design til vandet
      detail: Siden 2012, forfinet bræt for bræt
    - metric: 50+
      label: Lande på vandet
      detail: Paddlere og partnere verden over
    - metric: 12–15
      label: PSI drop-stitch-kerne
      detail: Stivt, hvor det betyder noget, nemt at pakke sammen
    - metric: 100%
      label: Trykprøvet bræt for bræt
      detail: Kontrolleret før afskibelse
business_solutions:
  tagline: Sådan hjælper vi
  title: Din partner fra koncept til omsætning
  subtitle: Fire kernekompetencer, der hjælper vandvirksomheder med at starte, drive og vækste.
  items:
    - title: Professionelt udstyr
      description: Professionelle SUP-boards konstrueret til daglig udlejning, 500+ udlejninger med minimal vedligeholdelse.
      icon: tabler:shield-check
    - title: Co-brand-kollektioner
      description: Begrænsede co-branded kollektioner designet, konstrueret og bygget sammen med afarer — hvert board forbliver et afarer-produkt.
      icon: tabler:package
    - title: Businesssupport
      description: Uddannelse af personale, markedsføringsmaterialer, programmer for reservedele samt dedikeret kontostyring.
      icon: tabler:headset
    - title: Global logistik
      description: FOB Qingdao, CIF til større havne, levering dør til dør til 50+ lande med toldsupport.
      icon: tabler:truck-delivery
oem_section:
  tagline: Co-brand-kollektioner
  title: Fra idé til vandet — co-branded udgaver
  subtitle: 'For partnere, der ønsker mere end et katalogprodukt: begrænsede co-branded kollektioner designet, konstrueret og bygget sammen med afarer — mens hvert board forbliver et afarer-produkt.'
  steps:
    - number: '01'
      title: Idé & brief
      desc: Del din vision, dit målmarked og dine specifikationer.
    - number: '02'
      title: Design & engineering
      desc: 3D-modellering, materialevalg og tilpasset grafisk design.
    - number: '03'
      title: Prototype & validering
      desc: Prøveproduktion med CE-certificering og kvalitetstest.
    - number: '04'
      title: Masseproduktion
      desc: Produktion i fuld skala med kvalitetskontrol undervejs og støtte til fabriksaudit.
    - number: '05'
      title: Global levering
      desc: FOB Qingdao-logistik, CIF større havne, dør-til-dør.
  cta: Udforsk co-branding
  cta_link: /co-brand
cta:
  title: Klar til at opbygge din vandoplevelsesvirksomhed?
  subtitle: Uanset om du starter en klub, udstyrer et resort eller opbygger et brand — vi er her for at hjælpe.
  actions:
    - variant: primary
      text: Start dit projekt
      href: /contact
      icon: tabler:send
    - text: Hent OEM-guide
      href: /resources/download-catalog
distributor:
  tagline: Landseksklusive distributører
  title: Ét land. Én officiel afarer-distributør.
  subtitle: Ét program med én distributør pr. land, territorie-eksklusivitet, forhandlerpriser, marketingstøtte og et dedikeret Distributor Success Program.
  benefits:
    - title: Territorie-eksklusivitet
      description: Én autoriseret distributør pr. land eller region — ingen intern konkurrence, ingen kanalkonflikter.
    - title: Direkte fabriksmargener
      description: Distributørprislister og årlige rabatter på aftalte volumener, afsendt FOB Qingdao.
    - title: Marketing- og træningssupport
      description: Co-brandede aktiver, POS-materialer til forhandlere, produkttræning og launch-kampagner.
    - title: Dedikeret account team
      description: En personlig distributørmanger samt onboarding-, prognose- og genbestillingssupport.
  actions:
    - variant: primary
      text: Bliv distributør
      href: /distributor-program
    - text: Anmod om forhandlerprisliste
      href: /contact?subject=Dealer Price List
    - text: Ansøg om landepartnerskab
      href: /contact?subject=Country Partnership Application
    - text: Hent distributørprogrammet
      href: /distributor-program
  note: Eksempelordrer fra 5–10 enheder. Prøveordrer 10–30. Autoriseret forhandler 30–50. Lands-/regional distributør 100–300+.

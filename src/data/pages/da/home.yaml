hero:
  tagline: 'Velkommen til afarer'
  title: |
    Fabrik til gummibåde —<br class="hidden sm:inline" />
    OEM/ODM <span class="text-accent dark:text-white">producent</span>
  subtitle: |
    <span class="hidden sm:inline"><span class="font-semibold">afarer</span> er en Kina-baseret OEM/ODM-producent af CE-certificerede gummibåde, SUP boards, kajakker, SUP-både og maritimt sikkerhedsudstyr.</span>
    <span class="block mb-1 sm:hidden font-bold text-blue-600">afarer: pålidelig fabrik siden 2012.</span>
    Vi betjener B2B-kunder i 50+ lande med engros, private label, specialdesign og komplette forsyningskædeløsninger.

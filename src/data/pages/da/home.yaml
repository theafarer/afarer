business_solutions:
  tagline: Sådan hjælper vi
  title: Din partner fra koncept til omsætning
  subtitle: Fire kernekompetencer, der hjælper vandvirksomheder med at starte, drive og vækste.
  items:
    - title: Professionelt udstyr
      description: Professionelle SUP-boards konstrueret til daglig udlejning, 500+ udlejninger med minimal vedligeholdelse.
      icon: tabler:shield-check
    - title: OEM-fremstilling
      description: Komplet private label-produktion fra design og prototyping til serieproduktion og global levering.
      icon: tabler:package
    - title: Businesssupport
      description: Uddannelse af personale, markedsføringsmaterialer, programmer for reservedele samt dedikeret kontostyring.
      icon: tabler:headset
    - title: Global logistik
      description: FOB Qingdao, CIF til større havne, levering dør til dør til 50+ lande med toldsupport.
      icon: tabler:truck-delivery
oem_section:
  tagline: Lancer dit brand
  title: Fra idé til marked på 16 uger
  subtitle: Din komplette partner til lancering af et SUP-brand — design, prototype, produktion og forsendelse.
  steps:
    - number: '01'
      title: Idé & brief
      desc: Del din vision, dit målmarked og dine specifikationer.
    - number: '02'
      title: Design & engineering
      desc: 3D-modellering, materialevalg og tilpasset grafisk design.
    - number: '03'
      title: Prototype & validering
      desc: Prøveproduktion med CE-certificering og kvalitetstest.
    - number: '04'
      title: Masseproduktion
      desc: Produktion i fuld skala med kvalitetskontrol undervejs og støtte til fabriksaudit.
    - number: '05'
      title: Global levering
      desc: FOB Qingdao-logistik, CIF større havne, dør-til-dør.
  cta: Start din brandrejse
  cta_link: /oem-odm-manufacturer
cta:
  title: Klar til at opbygge din vandoplevelsesvirksomhed?
  subtitle: Uanset om du starter en klub, udstyrer et resort eller opbygger et brand — vi er her for at hjælpe.
  actions:
    - variant: primary
      text: Start dit projekt
      href: /contact
      icon: tabler:send
    - text: Download OEM-guide
      href: /resources/download-catalog

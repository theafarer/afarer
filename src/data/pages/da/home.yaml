who_we_serve:
  tagline: Hvem vi betjener
  title: Komplette SUP-løsninger til enhver vandvirksomhed
  subtitle: Formålsbygget udstyr, produktion og forretningsstøtte til fire nøglemarkeder.
  items:
    - title: Paddleklubber
      keywords: SUP-klubudstyr, udstyr til paddelskoler, udlejningsflåde
      description: Holdbare SUP-flåder, klubpriser og reservedelsprogrammer til padleklubber og skoler.
      icon: tabler:users
      cta: Udforsk Paddle Club-løsninger
      link: /solutions/paddle-clubs
    - title: Resorts og hoteller
      keywords: vandaktiviteter på resorts, strandudstyr til hoteller, gæsteoplevelse
      description: Komplette SUP-flådeprogrammer med tilpasset branding, personaleuddannelse og ROI-optimerede pakker.
      icon: tabler:building
      cta: Skab din resorts vandoplevelse
      link: /solutions/resorts-hotels
    - title: Detailpartnere
      keywords: SUP-grossister, udendørsforhandlere og sportsudstyrsbutikker
      description: Fuld produktlinje, markedsføringsmateriale, dropshipping-muligheder og konkurrencedygtige engrosmargener.
      icon: tabler:shopping-cart
      cta: Bliv detailpartner
      link: /solutions/retail-partners
    - title: Nye SUP-brands
      keywords: private label SUP, skræddersyet SUP-brand, OEM paddle boards
      description: End-to-end OEM/ODM-produktion — design, prototyping, serieproduktion og global logistik.
      icon: tabler:package
      cta: Opbyg dit SUP-brand
      link: /oem-odm-manufacturer

features:
  id: features
  tagline: Hvorfor afarer
  title: Hvad du får med afarer
  subtitle: Årtiers maritim ingeniørerfaring, destilleret til en fokuseret produktlinje. Bygget robust, testet på havet, støttet for livet.
  columns: 2
  items:
    - title: Maritime materialer
      description: Tunge PVC, Hypalon og aluminiumsskrog valgt til UV-, slid- og saltvandsbestandighed.
      icon: tabler:shield-check
    - title: Produktionsklar kvalitet
      description: Hvert skrog tryktestes, hver svejsning inspiceres. Vi sender kun, hvad vi selv ville sætte på vandet.
      icon: tabler:certificate
    - title: Modulært design
      description: Tilpas slangelayout, konsolposition, brændstofkapacitet og tilbehør til din mission.
      icon: tabler:layout-grid
    - title: Ærlige specifikationer
      description: Reelle belastningsværdier, reelle dimensioner, reel vægt. Aldrig markedsføringsoverdrivelse.
      icon: tabler:ruler-measure
    - title: Hurtig levering og reservedele
      description: Almindelige modeller sendes på få dage. Ægte reservedele og forbrugsvarer på lager året rundt.
      icon: tabler:truck-delivery
    - title: Livstidssupport
      description: Direkte linje til vores ingeniørteam for tekniske spørgsmål, reparationer og ombygningsrådgivning.
      icon: tabler:lifebuoy
featured_products:
  id: featured
  title: Fremhævede produkter
  subtitle: Håndplukket fra vores aktuelle katalog —de mest populære modeller i denne sæson.
  linkText: Se alle produkter
  linkUrl: /products
content_workshop:
  isReversed: true
  tagline: Inde i værkstedet
  title: Fra skrogtegning til levering, hvert trin forbliver internt
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Kvalitet du kan se, føle og måle</h3>
  items:
    - title: Designet af marinearkitekter
      description: Skroglinjer tegnes internt og itereres gennem CFD-analyse før den første prototype rammer vandet.
    - title: Svejset og samlet i vores egen facilitet
      description: Slangesvejsning, konsolmontering og udrustning sker under samme tag, så vi kontrollerer kvaliteten i hvert trin.
    - title: Testet på havet før afsendelse
      description: Hver model gennemfører en flertimers søprøve, der dækker planing, drejning, topfart og laststyring.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer produktionsværksted
steps:
  title: Fra specifikation til søsætning i fem trin
  items:
    - title: 'Trin 1: <span class="font-medium">Konfigurer</span>'
      description: Vælg en model, vælg dine muligheder, anmod om tilbud online eller telefonisk. Vores team svarer inden for én hverdag.
      icon: tabler:list-numbers
    - title: 'Trin 2: <span class="font-medium">Bekræft</span>'
      description: Vi bekræfter specifikationer, leveringstid og samlede omkostninger skriftligt. Ingen overraskelser, ingen skjulte gebyrer.
      icon: tabler:checks
    - title: 'Trin 3: <span class="font-medium">Byg</span>'
      description: Produktionen starter i vores værksted. Vi sender fremskridtsfotos ved vigtige milepæle.
      icon: tabler:tool
    - title: 'Trin 4: <span class="font-medium">Lever</span>'
      description: Vugget, krympeindpakket og sendt ad søvejen eller luftvejen. Toldpapirer håndteres fra start til slut.
      icon: tabler:truck-loading
    - title: 'Trin 5: <span class="font-medium">Support</span>'
      description: To års skroggaranti plus livstids teknisk support. Reservedele sendes inden for 48 timer.
      icon: tabler:headset
blog_latest:
  title: Fra journalen
  information: |
    Artikler, tekniske noter og casestudier fra ingeniørteamet.
    Nye indlæg tilføjes, når et projekt afsendes, en standard opdateres, eller nogen har en historie værd at fortælle.
faqs:
  title: Ofte stillede spørgsmål
  subtitle: Almindelige forespørgsler om afarer gummibåde, garantier, forsendelse og OEM/ODM-partnerskaber. Hvis dit ikke er her, kontakt os.
  columns: 2
  items:
    - title: Hvor er afarers US-lager, og hvor lang tid tager levering?
      description: 'Vores US-lager er i Montclair, CA. Vestkysten: 2-3 dage. Centralt USA: 3-4 dage. Østkysten: 4-5 dage. International forsendelse er også tilgængelig.'
      icon: tabler:truck-delivery
    - title: Hvad er afarers garantipolitik for gummibåde?
      description: afarer gummibåde er dækket af 5 års begrænset garanti på slangeintegritet, sømme, glasfiber skrog og ventiler. Fabriksinstalleret tilbehør er dækket i 1 år.
      icon: tabler:shield-check
    - title: Inkluderer afarer både registreringspapirer?
      description: Ja, hver afarer gummibåd inkluderer nødvendige papirer til registrering. US Coast Guard godkendt til produktion.
      icon: tabler:file-text
cta:
  title: |
    Klar til at starte dit <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">OEM/ODM-projekt</span>?
  subtitle: Fortæl os dine krav, og vi giver et tilpasset tilbud, MOQ-detaljer og leveringstid inden for én hverdag.
  actions:
    - variant: primary
      text: Anmod om tilbud
      href: /contact
      icon: tabler:message-circle
    - text: Besøg vores fabrik
      href: /factory

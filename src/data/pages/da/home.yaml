meta:
  title: Afarer Oppustelige Paddleboards | Gå længere. Kør hårdere.
  description: Opdag Afarer oppustelige paddleboards til allround-paddling, touring, yoga, fiskeri og friluftseventyr. Find din perfekte SUP og udforsk mere på vandet.
  keywords:
    - oppusteligt paddleboard
    - oppustelig sup
    - allround sup
    - touring sup
    - yoga sup
    - fiskerisup
    - familie paddleboard
    - portabelt paddleboard
hero:
  tagline: Oppustelige Paddleboards
  title: Oppustelige Paddleboards til ethvert Eventyr
  slogan: Gå længere. Kør hårdere.
  subtitle: Opdag friheden ved paddling med Afarer. Udforsk gennemtænkte oppustelige SUPs til afslappede dage ved søen, kysteventyr, fitness og alt derimellem.
  taglineSection: Bygget til tryghed. Designet til at skille sig ud.
  actions:
    - variant: primary
      text: Find dit Board
      href: /size-guide/
      icon: tabler:compass
    - text: Udforsk SUP
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Hvorfor Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Afarer oppustelige paddleboards glider henover stille vand ved solopgang — bygget til ethvert eventyr
who_we_serve:
  tagline: Kør Med Os
  title: Find din Vej på Vandet
  subtitle: Hver paddler har sin egen idé om eventyr. Opdag en Afarer SUP designet til din måde at paddle på.
  items:
    - title: Begyndere & Fritidspaddlere
      keywords: oppustelig sup til begyndere, allround paddleboard, stabil sup
      description: Brede, stabile allround-boards der får dit første pagajslag til at føles naturligt og følger dig, efterhånden som du bliver bedre.
      icon: tabler:users
      cta: Find dit første Board
      link: /all-around-sup/
    - title: Touring & Eventyr
      keywords: touring sup, langturspaddleboard, ekspeditionssup
      description: Længere, smallere boards bygget til at holde kursen, glide længere og bære udstyr til ture over flere dage.
      icon: tabler:building
      cta: Udforsk Touring SUP
      link: /touring-sup/
    - title: Yoga & Fitness
      keywords: yoga sup, fitness paddleboard, bred og stabil sup
      description: Brede, stabile platformer med plads til bevægelse — til solopgangsflows, træning og balance på stille vand.
      icon: tabler:heart
      cta: Udforsk Yoga SUP
      link: /yoga-sup/
    - title: Fiskeri & Familie
      keywords: fiskerisup, familie paddleboard, stabil fiskeplatform
      description: Stabile, praktiske platformer til fiskeri, ture med børnene og lange, afslappede dage på vandet.
      icon: tabler:users
      cta: Udforsk Fiskerisup
      link: /fishing-sup/
proof_points:
  title: Testet ud over showroomet
  subtitle: Design, ydeevne og kvalitet, du kan verificere — på vandet og i tallene.
  items:
    - metric: 10+
      label: Års erfaring med design til vandet
      detail: Siden 2012, forfinet bræt for bræt
    - metric: 50+
      label: Lande på vandet
      detail: Paddlere og partnere verden over
    - metric: 12–15
      label: PSI drop-stitch-kerne
      detail: Stivt, hvor det betyder noget, nemt at pakke sammen
    - metric: 100%
      label: Trykprøvet bræt for bræt
      detail: Kontrolleret før afskibelse
business_solutions:
  tagline: Derfor Føles Andet
  title: Ydelse du Føler ved første Pagajslag
  subtitle: Fire søjler formet af ægte vand — ydelse, design, konstruktion og kvalitet.
  items:
    - title: Ydelse på Vandet
      description: Former finpudset til stabilitet, glide og tryghed i bølger — hvert pagajslag føles forbundet med vandet.
      icon: tabler:shield-check
    - title: Ekspressivt Design
      description: Kollektioner inspireret af tidevand, dyreliv og kystens energi — boards du gerne vil ses med.
      icon: tabler:package
    - title: Bevist Konstruktion
      description: Drop-stitch-kerner med høj densitet, forstærkede rælinger og fusionslaminerede sømme til gentagen brug.
      icon: tabler:headset
    - title: Verificeret Kvalitet
      description: Tryktestet, visuelt inspiceret og dækket af en klar garanti og responsiv service.
      icon: tabler:truck-delivery
cta:
  title: Find dit næste board.
  subtitle: Uanset om det er dit første pagajslag eller din længste rute — vi får dig ud på vandet.
  actions:
    - variant: primary
      text: Udforsk Kollektionen
      href: /inflatable-sup/
      icon: tabler:send
    - text: Bestil Kataloget
      href: /resources/download-catalog/

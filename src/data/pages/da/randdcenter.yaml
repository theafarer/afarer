meta:
  title: R&D-center | {SITE}
  description: Forskning og udvikling — test af PVC-stof, skrogkonstruktion, RF-svejsning, hydrodynamisk testning og kvalitetskontrol. Skræddersyede R&D-services er tilgængelige.
hero:
  tagline: F&U-center
  title: R & D-center
  subtitle: Fokuseret på fremgang
intro:
  - >-
    afarer’s forsknings- og udviklingscenter (R&D) er drivkraften bag vores mission om at revolutionere udstyr til vandsport. Vi giver vandsportsentusiaster over hele verden sikrere, mere komfortable og mere fornøjelige produkter gennem vedholdende innovation inden for oppustelige stand-up
    paddleboards (SUP) og både. Vores dedikerede team af ingeniører, designere og passionerede vandsportseksperter former branchens fremtid og hæver konstant barren for kvalitet, ydeevne og bæredygtighed.
  - Vores R&D-facilitet samler materialeforskere, marinearkitekter og produktionsingeniører under ét tag. Fra stofformulering og skrogsimulering til udvikling af svejseprocesser og fuldskala søforsøg — hvert trin i produktudviklingen er datadrevet og valideret gennem testning.
mission:
  tagline: Vores mission
  title: Vi innoverer fremtiden for vandsport
  pillars:
    - icon: lightning
      title: Teknologisk udvikling
      desc: Vi er pionerer inden for nye materialer, designs og fremstilling med fokus på overlegen ydeevne og lang levetid.
    - icon: design
      title: Brugercentreret design
      desc: Vi forstår og overgår brugernes behov gennem ergonomisk og intuitivt produktdesign.
    - icon: globe
      title: Bæredygtig praksis
      desc: Vi minimerer vores miljøaftryk ved at anvende miljøvenlige materialer og processer.
    - icon: shield
      title: Kompromisløs sikkerhed
      desc: Vi sikrer de højeste sikkerhedsstandarder gennem grundig testning og certificering.
pillars:
  - title: Teknologisk udvikling
    desc: Vi baner vejen for nye materialer, designs og produktionsprocesser for at levere overlegen ydeevne og lang levetid.
    icon: tech
  - title: Avancerede materialer
    desc: Vi undersøger banebrydende PVC, Hypalon, kompositmaterialer og bæredygtige alternativer for forbedrede produktegenskaber.
    icon: materials
  - title: Bæredygtighed
    desc: 'En kerneforpligtelse: Vi er dedikerede til miljøansvar gennem bæredygtig produktion og genanvendelige materialer.'
    icon: sustainability
capabilities:
  tagline: Kapaciteter
  title: R&D-kapaciteter
  subtitle: Fire kernekompetencer, der giver os fuld kontrol over produktudviklingen fra ende til anden — fra råmaterialeforskning til endelig certificering.
  groups:
    - title: Materialevidenskab & stofteknologi
      items:
        - Analyse og optimering af PVC- og Hypalon-formuleringer
        - Udvikling af UV-stabilisering, flammehæmning og antibakterielle additiver
        - Laminering af flerlagsstof og adhæsionsteknologi
        - Accelereret ældningstest (UV, varme, fugt, saltvandståge)
    - title: Skrogkonstruktion og hydrodynamik
      items:
        - Parametrisk 3D-skrogdesign og CFD-optimering
        - Finite element-analyse for strukturelle og stødbelastninger
        - Slæbetanktest med skalamodeller og validering af ydeevne
        - Udvikling af specialskrog til særlige missionsprofiler
    - title: Svejse- og samlingsteknologi
      items:
        - Udvikling og optimering af RF-dielektrisk svejseproces
        - Varmluft-, varmkile- og ultralydssvejsemetoder
        - Kvalificering af limning og sømtape
        - Modellering af svejsestyrke og forudsigelse af levetid
    - title: Testning, certificering & overensstemmelse
      items:
        - Kvalitetsstyring og CE-overensstemmelsestest
        - Uafhængig tredjepartstestning og certificeringssupport
        - Udvikling af skræddersyede testprotokoller til indkøbskvalificering
        - Analyse af fejl i drift og undersøgelse af grundårsager

rd_services:
  tagline: Skræddersyet R&D
  title: R&D-services til partnere
  services:
    - title: Skræddersyet materialeudvikling
      desc: Vi udvikler skræddersyede stofsammensætninger, laminatopbygninger og limesystemer, der er tilpasset dit driftsmiljø og dine præstationsmål.
    - title: OEM / ODM-produktteknik
      desc: Vi udvikler skræddersyede stofsammensætninger, laminatopbygninger og limesystemer, der er tilpasset dit driftsmiljø og dine præstationsmål.
    - title: Tredjeparts testning & certificering
      desc: Brug vores ISO-kompatible testfaciliteter til uafhængig materialetestning, produktvalidering og certificeringssupport.
  cta: Drøft dine R&D-krav →
  cta_link: /contact
vision:
  tagline: Vores vision
  title: Vi former fremtiden for vandsport
  body: >-
    afarer stræber efter at føre an i branchen for oppustelige både og SUP gennem løbende innovation, uforbeholden kvalitet og en urokkelig forpligtelse til sikkerhed og bæredygtighed —og dermed berige vandsportsentusiasters oplevelser verden over. afarer R&D Center er, hvor passion møder
    innovation, og hvor der sættes nye standarder for vandsportsbranchen.
labs_section:
  tagline: Laboratorier
  title: Vores laboratorier
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC-stoflaboratorium
      description: Løbende forskning og test af PVC- og Hypalon-rørstoffer med hensyn til trækstyrke, UV-bestandighed, slidstyrke og fleksibilitet ved lave temperaturer for at sikre langsigtet pålidelighed i marine miljøer.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Skrog-engineeringstudio
      description: CAD-baseret design og finite element-analyse af HDPE-, aluminium- og glasfiberskrog. Ethvert skrog simuleres digitalt for spændingsfordeling og slagfasthed, før det første prototype er bygget.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: RF-svejsecenter
      description: Dedikeret radiofrekvenssvejsefacilitet med præcis temperatur- og trykstyring, der producerer stærke, lufttætte sømme, som lever op til den maritime industris standarder for oppustelige fartøjer.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Hydrodynamisk testtank
      description: Test med skalamodeller i vores egen testtank for at optimere skrogform, planingsevne, stabilitet og brændstofeffektivitet under forskellige last- og søforhold.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: Prototypeværksted
      description: Fuldskala-facilitet til prototyping og rigging, hvor nye modeller bygges, udstyres og søprøves. Hver prototype gennemgår et testprogram på mindst 20 timer på vandet, før produktionen godkendes.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Kvalitets- og inspektionslaboratorium
      description: Dedikeret kvalitetssikringslaboratorium, der udfører træktest, luftretentionscyklusser, sømpeeling-test og materialecertificering for at sikre, at hver båd, der forlader værkstedet, lever op til vores offentliggjorte specifikationer.
      href: /randdcenter/quality-inspection-lab

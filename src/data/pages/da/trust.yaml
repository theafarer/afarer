faqs_sup:
  title: SUP-brædder FAQ
  subtitle: Almindelige spørgsmål om vores paddleboards.
  columns: 2
  items:
    - title: Hvilke SUP-brætstørrelser er tilgængelige?
      description: Vi tilbyder SUP-brædder fra 9 ft til 12 ft, inklusive all-round, touring, yoga og specialdesigns. Vores bedst sælgende modeller inkluderer Tropical Breeze (10 ft) og Ocean Voyager (11 ft).
    - title: Hvad er drop-stitch-konstruktion?
      description: Drop-stitch-konstruktion bruger tusindvis af polyestertråde, der forbinder brættets top- og bundlag, hvilket gør det muligt at holde højt lufttryk (15-20 PSI) og opnå en stiv, stabil platform. Dette er industristandarden for premium oppustelige SUP'er.
    - title: Hvad er vægtgrænsen for SUP-brædder?
      description: Vores SUP-brædder understøtter op til 150 kg afhængigt af model og volumen. Leviathan Wake er vores model med højest kapacitet, designet til større ryttere og yogabrug.
    - title: Tilbyder du komplette SUP-pakker?
      description: Ja. Hvert SUP-bræt leveres med en komplet pakke inklusive 3-delt aluminiumspagaj, højtryks håndpumpe, spiralsnor, rejserygsæk og reparationssæt. Nogle modeller inkluderer også et aftageligt finnesæt.
    - title: Hvad er garantien på SUP-brædder?
      description: Alle afarer SUP-brædder har et-års garanti mod produktionsfejl, inklusive sømfejl, ventilfejl og materialedelaminering under normal brug.
    - title: Hvor lang tid tager det at pumpe et SUP-bræt op?
      description: Ved brug af den medfølgende håndpumpe tager fuld oppumpning til 15 PSI cirka 8-12 minutter. For hurtigere oppumpning anbefaler vi vores afarer 12V elektriske pumpe, der pumper et bræt op på under 4 minutter.
faqs_materials:
  title: SUP-materiale- og pleje-FAQ
  subtitle: Almindelige spørgsmål om vores oppustelige SUP-materialer, pleje og opbevaring.
  columns: 2
  items:
    - title: Hvilke materialer anvendes i afarer oppustelige SUPs?
      description: Vi bruger PVC i militær kvalitet (1100 denier) med UV-stabiliseret, slidstærk konstruktion, der overholder EU's REACH- og RoHS-regler.
    - title: Hvor længe holder oppustelige SUP-boards?
      description: Med korrekt pleje holder en kvalitets-PVC-opblæselig SUP i 5–10 år. Regelmæssig rengøring, UV-beskyttelse og korrekt opbevaring forlænger levetiden betydeligt.
    - title: Hvilken vedligeholdelse kræver en oppustelig SUP?
      description: Grundlæggende vedligeholdelse omfatter skylning med ferskvand efter hver brug (især i saltvand), tørring før opbevaring, årlig kontrol af ventiltætninger og undgåelse af længerevarende solpåvirkning, når udstyret ikke er i brug.
    - title: Kan oppustelige SUP'er bruges i saltvand?
      description: Ja. Alle oppustelige SUP-brætter fra afarer er designet til både ferskvand og saltvand. Vi anbefaler at skylle brætterne med ferskvand og tørre dem grundigt efter ophold i saltvand.
    - title: Hvordan opbevarer jeg en oppustelig SUP?
      description: Tøm luften ud af boardet, og rengør og tør det helt, før det opbevares. Rul det løst (undgå stramme folder), opbevar det køligt og tørt og beskyttet mod direkte sollys, og lad det ikke stå på betongulve for at undgå fugtsugning.
    - title: Hvad er vægtkapaciteten for afarer-oppustelige SUP-brædder?
      description: Bæreevnen spænder fra 100 kg på vores mindste modeller til over 200 kg på de større boards. Hver produktside viser den maksimale lastkapacitet for din specifikke model.

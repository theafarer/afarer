warranty_section:
  title: Garanti og eftersalgsservice
  subtitle: Vi står bag hvert eneste produkt med klare garantibetingelser, hurtig reklamationsbehandling og ægte reservedele.
  items:
    - title: 2 års produktgaranti
      desc: Alle afarer-produkter har 2 års garanti mod fabrikationsfejl — svigtende sømme, defekte ventiler og delaminering af materialet ved normal brug.
    - title: Livsvarig reservedelssupport
      desc: Ægte reservedele — ventiler, reparationssæt, finner, D-ringe — fås til alle modeller. Vi vedligeholder forme og værktøj i mindst 5 år efter produktionens ophør.
    - title: 48-timers svar på reklamationer
      desc: Garantikrav bekræftes inden for 48 timer. Erstatningsbrædder sendes inden for 10 arbejdsdage ved godkendte krav.
    - title: Globalt reparationsnetværk
      desc: Autoriserede reparationscentre i 15+ lande. Reparationssæt til felten er tilgængelige til fjerntliggende operationer. Gør-det-selv-reparationsguider til mindre skader.
    - title: OEM-kundesupport
      desc: Dedikerede account managers til B2B-partnere. Kvartalsvise forretningsgennemgange, lagerplanlægning og støtte til co-brandet markedsføring.
    - title: Certificeringspakke
      desc: Fuld overensstemmelsesdokumentation medfølger med hver forsendelse — CE-erklæring, testrapporter og sikkerhedsdatablade.
      link: /contact

  tagline: Laboratorium 04
  title: Hydrodynamisk testtank
  subtitle: Validering af ydeevnen, før den første prototype i fuld størrelse
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: Præstationstest i Afarers hydrodynamiske testtank
intro: >-
  Det er en udbredt misforståelse, at hydrodynamiske test kun er forbeholdt havskibe. I virkeligheden er ydeevnen af et lille planende skrog — f.eks. en RIB på 4–6 m — lige så afhængig af sin undervandsform, som en olietanker er af sin bulbøs bov. Trimvinkel, våd skrogflade, sprøjtdannelse og
  ventilation har alle en markant indvirkning på fart, brændstofforbrug og kørekomfort. Hos Afarer driver vi en dedikeret hydrodynamisk testtank, som gør os i stand til at kvantificere disse effekter i modelskala — inden vi binder metal og stof til en prototype i fuld størrelse.
content_html: >
  <h2>Hvorfor bassinteste en lille båd?</h2>

  <p>Test i modelskala (typisk 1:3 til 1:5) giver os mulighed for hurtigt og omkostningseffektivt at udvikle skrogformer. En uge i bassinet kan frembringe de samme præstationsdata, som ville kræve måneder med fuldskala-forsøg – og til en brøkdel af omkostningerne.</p>


  <h2>Facilitetens specifikationer</h2>

  <table>
    <thead><tr><th>Parameter</th><th>Specifikation</th></tr></thead>
    <tbody>
      <tr><td>Bassinets dimensioner</td><td>35 m (L) × 3.5 m (W) × 1.8 m (D)</td></tr>
      <tr><td>Slæbevogn</td><td>Elektrisk servodrevet, maks. hastighed 12 m/s (23 kn), hastighedsnøjagtighed ± 0.5 %</td></tr>
      <tr><td>Bølgegenerator</td><td>Klaptype, programmerbare regelmæssige &amp; uregelmæssige søtilstande, Hs op til 0.3 m i modelskala</td></tr>
      <tr><td>Instrumentering</td><td>6-komponent dynamometer (modstand, sidekraft, girmoment), accelerometre, hældningsmålere, bølgesonder</td></tr>
      <tr><td>Dataopsamling</td><td>Sampling ved 1000 Hz pr. kanal, realtidsvisning + efterbehandlingspakke</td></tr>
      <tr><td>Modelproduktion</td><td>Intern CNC-fræsning og 3D-print af modelskrog op til 1.8 m LOA</td></tr>
    </tbody>
  </table>


  <h2>Vores testprogram</h2>

  <p>Et standardprogram for skrogudvikling i vores bassin følger denne rækkefølge:</p>

  <ol>
    <li><strong>Modelbygning</strong> – En model i skala 1:3.5 CNC-fræses af højdensitetsskum og belægges med glasfiber for stivhed. Vægt og CG justeres, så de matcher Froude-skalerede fuldlastforhold.</li>
    <li><strong>Modstandskørsler</strong> – Modellen slæbes ved 8-10 hastigheder, der dækker driftsområdet. Den samlede modstand måles og opdeles i friktions- og restmodstandskomponenter ved hjælp af ITTC-1957-metoden.</li>
    <li><strong>Måling af trim &amp; synkning</strong> – Trim og synkning under kørsel registreres ved hver hastighed. Målet er en optimal trimvinkel på 4-6° for planingsskrog.</li>
    <li><strong>Kølvandsundersøgelse</strong> – Tværgående bølgesnit måles ved to hastigheder for at vurdere bølgemodstanden og identificere tværgående bølgeinteraktioner, der kan forårsage agterskibsinterferens.</li>
    <li><strong>Sødygtighed (valgfrit)</strong> – Kørsler i modsø og medsø med regelmæssige bølger for at måle tillægsmodstand, vertikal acceleration og sandsynlighed for slamming.</li>
    <li><strong>Dataanalyse &amp; anbefalinger</strong> – Der leveres en komplet rapport med sammenlignende diagrammer, hastigheds-/effektkurver og konkrete designanbefalinger til fuldskala-skroget.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Typiske bassintestresultater – modstand vs. hastighed (RIB 450-skrog, skala 1:3.5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Modstand i modelskala (N) ved Froude-skalerede hastigheder. Effektforudsigelse i fuld skala følger ITTC-1978-metoden til præstationsforudsigelse.</p>
  </div>


  <h2>Ekspertteam</h2>

  <p>Vores bassin drives af en hydrodynamiker med en ph.d. i skibsarkitektur og 8 års erfaring med slæbebassiner fra et større europæisk maritimt forskningsinstitut. Han støttes af en tekniker, der forbereder alle modeller og instrumentering. Teamet følger ITTC's (International Towing Tank
  Conference) anbefalede procedurer for at sikre, at hver test er reproducerbar, sporbar og internationalt forsvarlig.</p>


  <h2>Bassintest til udvikling af specialskrog</h2>

  <p>Vores bassin bruges ikke kun til skrog, vi selv har designet – vi kører jævnligt testprogrammer for kunder, der vil validere et specialskrog eller undersøge et præstationsproblem:</p>

  <ul>
    <li><strong>Sammenligning af skrogformer</strong> – To eller flere kandidatskrogformer testes under identiske forhold og giver en objektiv sammenligning af modstand/hastighed/stabilitet til grundlag for dit designvalg.</li>
    <li><strong>Optimering af appendager</strong> – Interceptorplader, spraylister, trimklapper og kølstrimler kan testes i forskellige konfigurationer for at kvantificere deres individuelle bidrag til reduktion af modstand.</li>
    <li><strong>Undersøgelse af motormatchning</strong> – Modstandsdata omregnes til en effektforudsigelseskurve, så du kan vælge den optimale motorstørrelse i hk til din ønskede hastighed og nyttelast.</li>
  </ul>


  <h2>Hvorfor teste hos os?</h2>

  <p>Vi giver dig ikke blot en række rå tal. Vores rapporter omsætter bassindata til brugbare tekniske anbefalinger: "Hæv spraylisten 8 mm for at reducere den våde skrogoverflade ved marchhastighed", "Øg bundstigningen ved hækspejlet med 3° for at reducere slamming-accelerationen" eller "Flyt det
  langsgående tyngdepunkt 150 mm agterover for en bedre planingsholdning". Du går derfra med en klar forståelse af, hvad der skal ændres, og hvorfor.</p>

  <p>Vores bassin er desuden tilgængeligt til uafhængig tredjepartstestning på honorarbasis. Hvis du udvikler et skrog og ønsker en uvildig, professionelt udført hydrodynamisk vurdering, modtager vi gerne din henvendelse.</p>

    - [Testordre, 10–30, 30–45 dage, 100% forudbetaling]
    - [Autoriseret Forhandler, 30–50, 30–45 dage, 30% depositum / 70% inden forsendelse]
    - [Lands- / Regionaldistributør, 100–300, 30–45 dage, 30% depositum / 70% inden forsendelse]
    - [Custom & Private Label (standard), 50+, 30–45 dage, 30% depositum / 70% inden forsendelse]
    - [Dyb tilpasning (nye forme, emballage), 200+, 45–60 dage, 30% depositum / 70% inden forsendelse]
    - [Rettigheder til hele produktlinjen, 300–1, 000, 60–90 dage, 30% depositum / 70% inden forsendelse]
faqs:
  title: 'Distributørprogram — FAQ'
  subtitle: 'Alt, distributører spørger om, før de ansøger.'
  items:
    - title: 'Hvad betyder ét land, én distributør?'
      description: 'Afarer giver en enkelt autoriseret distributør eksklusive rettigheder for et land eller en region. Du ejer dit marked — ingen parallelimport, ingen intern konkurrence.'
    - title: 'Hvad er minimum første ordre?'
      description: 'Lands- og regionaldistributører starter ved 100–300 enheder. Autorierede forhandlere fra 30–50 enheder. Testordrer fra 10–30 enheder lader dig validere markedet først (uden territorial beskyttelse).'
    - title: 'Hvilken støtte får distributører?'
      description: 'Distributor Success Program dækker onboarding, go-to-market-planlægning, produkt- og salgstræning, demo-flåde-støtte, lokaliserede marketingmaterialer og en dedikeret account manager.'
    - title: 'Hvordan beskytter Afarer mig mod kanalkonflikter?'
      description: 'Hvert territorium har præcis én autoriseret distributør. Direkte ordrer fra din region går gennem dig, og priserne beskytter din margin.'
    - title: 'Hvad er forsendelses- og betalingsvilkårene?'
      description: 'Ordrer sendes FOB Qingdao med fuld eksportdokumentation. Produktionsordrer med 30% depositum og 70% inden forsendelse; test- og prøveordrer er forudbetalt.'
    - title: 'Hvordan ansøger jeg?'
      description: 'Send en ansøgning via kontaktformularen. Vi vurderer markedstilpasning, detaljeringsnærvær og logistik-kapacitet og svarer inden for 3 arbejdsdage med de næste skridt og et eksempel på distributøraftale.'
cta:
  title: 'Klar til at eje dit marked?'
  subtitle: 'Ansøg til Afarer-distributørprogrammet og få svar inden for 3 arbejdsdage.'
  actions:
    - text: 'Ansøg om distributionsret'
      href: /contact?subject=Distributor Application
      variant: primary
    - text: 'Download distributørprogrammet'
      href: /distributor-program
      variant: secondary

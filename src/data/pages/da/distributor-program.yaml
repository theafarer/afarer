features:
  title: 'Hvorfor et partnerskab med Afarer'
  subtitle: 'En ét-land-én-distributør-model med den støttestruktur, der får territoriet til at betale sig. Eksklusivitet tjenes og fastholdes — ikke en permanent ret.'
  columns: 3
  items:
    - title: 'Territorie-eksklusivitet'
      description: 'Én autoriseret distributør pr. land eller region. Ingen parallelimport, ingen intern konkurrence. Din investering bygger din egen voldgrav.'
      icon: 'tabler:shield-check'
    - title: 'Beskyttelse mod kanalkonflikter'
      description: 'Direkte ordrer fra din region går gennem dig, og prisfastsættelsen beskytter din margin. Afarer sælger ikke uden om sine landepartnere.'
      icon: 'tabler:users'
    - title: 'Direkte fabriksmargener & rabatter'
      description: 'Forhandlerprisliste med rabatter på aftalte volumener. Ingen mellemmænd. FOB Qingdao-forsendelse med fuld eksportdokumentation.'
      icon: 'tabler:coins'
    - title: 'Supportprogram med 10 moduler'
      description: 'Onboarding, go-to-market, træning, marketing og fælles markedsfinansiering, reservedele og eftersalg, garanti, bestillingsværktøjer og et partnerportal — dækket i din Distribution Agreement.'
      icon: 'tabler:rocket'
    - title: 'Marketing & fælles markedsfonde'
      description: 'Lokaliserede kampagnematerialer, forhandler-POS-materialer, event-kits, digitalt indhold på flere sprog og co-marketingstøtte til lanceringssæsonerne.'
      icon: 'tabler:mood-smile'
    - title: 'Produkt-, salgs- & teknisk træning'
      description: 'Strukturerede onboarding-sessioner om produkt-, salgs- og teknisk viden, med opdaterede materialer, efterhånden som sortimentet udvikler sig.'
      icon: 'tabler:presentation'
    - title: 'Reservedele & eftersalgsstøtte'
      description: 'Forsyning med reservedele, garantiregistrering og behandling af garantikrav samt produktdatablade og manualer til dit lokale serviceteam.'
      icon: 'tabler:settings'
    - title: 'Dedikeret account manager & partnerportal'
      description: 'En personlig distributørmanager plus adgang til prislister, ordrestatus og marketingressourcer via Afarer-partnerportalen.'
      icon: 'tabler:user-check'

    - [Deep Custom (nye forme, emballage), 200+, 45–60 arbejdsdage, 30% deposit / 70% before shipment]
    - [Full Product Line Rights, '300–1.000', 60–90 arbejdsdage, 30% deposit / 70% before shipment]
faqs:
  title: 'Landepartnerskab — FAQ'
  subtitle: 'De spørgsmål, som seriøse landepartnere stiller, før de ansøger.'
  items:
    - title: 'Hvad betyder ét-land-én-distributør egentlig?'
      description: 'Afarer udpeger én enkelt autoriseret distributør med eksklusive rettigheder for et afgrænset territorium. Vi sælger ikke fra vores globale eller regionale kanaler ind i et beskyttet land. Dit territorium gælder, så længe Distribution Agreement overholdes.'
    - title: 'Er territoriet eksklusivt for evigt?'
      description: 'Nej. Eksklusivitet er betinget, ikke permanent. Den fastholdes gennem en underskrevet Distribution Agreement, gennemførelse af din første ordre, årlige indkøbsmål, lokalt lager, eftersalgskapacitet og fortsat markedsinvestering. Hvis disse ikke overholdes, kan territoriet genforhandles eller tildeles en anden.'
    - title: 'Hvad er minimum første ordre?'
      description: 'Lands- og regionaldistributører starter ved 100–300 enheder; Authorized Dealers ved 30–50 enheder; testordrer fra 10–30 enheder lader dig validere markedet først (test- og prøveordrer giver ingen territorial beskyttelse). Custom- og private-label-programmer følger separate MOQs som anført i niveauerne ovenfor.'
    - title: 'Hvilken støtte omfatter supportprogrammet med 10 moduler?'
      description: 'Niveauer og kvalifikation, territoriebeskyttelse, MOQ / priser / årlige rabatter, lager og ordreudførelse, marketingmaterialer og fælles markedsfonde, produkt- / salgs- / teknisk træning, reservedele og eftersalg, garantiregistrering, partnerportalen samt produktdatablade, marketingmaterialebibliotek, årlig rabatplan og forsendelses- og pakkelister.'
    - title: 'Hvordan beskytter Afarer mig mod kanalkonflikter?'
      description: 'Hvert territorium har præcis én autoriseret distributør. Henvendelser og direkte ordrer fra din region går gennem dig, websiteformularer videresendes til den lokale partner, hvis der findes en, og det globale team eskalerer kun, når en partner ikke svarer.'
    - title: 'Hvad er forsendelses- og betalingsvilkårene?'
      description: 'Ordrer sendes FOB Qingdao med fuld eksportdokumentation. Produktionsordrer er 30% depositum med 70% inden forsendelse; test- og prøveordrer er forudbetalt. Standard leveringstid er 30–45 arbejdsdage, med 15–20 arbejdsdage for prøvekørsler.'
    - title: 'Hvordan ansøger jeg?'
      description: 'Send din ansøgning via kontaktformularen med markedsoplysninger. Vi vurderer markedstilpasning, detailtilstedeværelse og logistikkapacitet og svarer inden for 3 arbejdsdage med de næste skridt og en eksempel-Distribution Agreement.'

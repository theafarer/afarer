  caption: 'Prøve- og testordrer (5–30 enheder) giver ingen territorial beskyttelse. Landeeksklusivitet gælder kun for underskrevne Country / Regional Distributor-aftaler — den fastholdes gennem gennemførelse af den første ordre, årlige indkøbsmål, lokalt lager, eftersalgskapacitet og fortsat markedsinvestering og er ikke en permanent eller evig ret.'

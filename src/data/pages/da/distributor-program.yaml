table:
  title: 'Programniveauer & Ordrevilkår'
  subtitle: 'Vælg det niveau, der matcher dit markedspotentiale. Alle priser i USD, FOB Qingdao.'
  caption: 'Prøveordrer (5–10 enheder) giver ingen territorial beskyttelse. Vilkårene aftales i din distributøraftale, før nogen forsendelse.'
  head:
    - Programniveau
    - Minimumsordre (enheder)
    - Leveringstid
    - Betaling

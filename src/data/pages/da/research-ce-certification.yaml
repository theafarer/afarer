  title: Sådan fungerer CE-certificering for oppustelige fartøjer | {SITE}
  description: Komplet guide til CE-certificering af oppustelige både, SUP-brædder og kajakker. Gældende direktiver (2013/53/EU RCD, PPE 2016/425), testprotokoller, bemyndigede organer, krav til teknisk dossier og producentens forpligtelser.

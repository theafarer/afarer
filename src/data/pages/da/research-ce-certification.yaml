hero:
  tagline: Overholdelse
  title: Sådan fungerer CE-certificering for oppustelige vandfartøjer
  subtitle: 7 minutters læsetid
content_html: >-
  <h2>Hvad er CE-certificering?</h2>

  <p>CE-mærkning (Conformit&eacute; Europ&eacute;enne) betyder, at et produkt opfylder EU's krav til sundhed, sikkerhed og miljø. For oppustelige fartøjer afhænger den relevante lovgivningsmæssige ramme af produktkategorien.</p>


  <h2>Gældende direktiver</h2>


  <h3>Fritidsfartøjsdirektivet (2013/53/EU)</h3>

  <p>Det primære direktiv for de fleste oppustelige både, SUPs og kajakker. Det gælder for fritidsfartøjer med en skroglængde på 2.5 m til 24 m, delvist færdigbyggede både (til OEM-levering) og vandscootere.</p>


  <h3>Forordningen om personlige værnemidler (2016/425)</h3>

  <p>Redningsveste, flydehjælpemidler og sikkerhedsudstyr, der leveres med fartøjer, skal opfylde kravene i PPE-forordningen, herunder typeprøvning (modul B) hos et bemyndiget organ og produktionskvalitetssikring (modul D eller E).</p>


  <h2>Certificeringsprocessen</h2>

  <ol>
    <li>Produktklassificering: Fastlæg fartøjets designkategori (A – D iht. ISO 8666)</li>
    <li>Gældende standarder: EN ISO 6185 (del 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (producentplade)</li>
    <li>Udarbejdelse af teknisk dokumentation: designtegninger, materialeliste (Bill of Materials), materialecertifikater, risikovurdering</li>
    <li>Typeprøvning: opdrift, stabilitet, lasteevne, materialetestning, sømstyrke, lufttæthed</li>
    <li>Fabrikkens produktionskontrol: audit af produktionsprocesser hos et bemyndiget organ</li>
    <li>Overensstemmelseserklæring: Producenten underskriver DoC og påfører CE-mærkning</li>
  </ol>


  <h2>Bemyndigede organer for oppustelige fartøjer</h2>

  <p>Almindelige NB'er omfatter Bureau Veritas (Frankrig), DNV GL (Tyskland), RINA (Italien), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Tyskland).</p>


  <h2>Tidsplan og omkostninger</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fase</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Varighed</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Typisk pris (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Udarbejdelse af teknisk dokumentation</td><td class="p-3 border">2 – 4 uger</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Typeprøvning</td><td class="p-3 border">4 – 8 uger</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Fabriksaudit</td><td class="p-3 border">1 – 2 dage (på stedet)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">I alt (første produkt)</td><td class="p-3 border">8 – 14 uger</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>


  <h2>Hvad dette betyder for købere</h2>

  <p>Når du køber CE-certificerede oppustelige både, skal du altid kontrollere, at CE-mærkningen er på producentpladen, at der findes en gyldig DoC, at det bemyndigede organs nummer er angivet, og at brugerhåndbogen indeholder sikkerhedsanvisninger på dit lokale sprog. Alle Afarer-produkter er
  CE-certificerede med fuld sporbarhed til auditrapporter fra bemyndigede organer.</p>

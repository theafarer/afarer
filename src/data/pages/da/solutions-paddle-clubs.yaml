meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Paddleklubmedlemmer på matchende Afarer SUP-brætter
benefits:
  title: Fordele ved klubflåde
  subtitle: Hvorfor padleklubber i mere end 50 lande vælger Afarer som deres udstyrspartner.
  items:
    - metric: 40%+
      label: Besparelser på flådeomkostninger
      detail: Sammenlignet med detailpriser, med mængderabatter til klubber
    - metric: 48h
      label: Udskiftning af dele
      detail: Minimal nedetid for din udlejningsflåde
    - metric: 500+
      label: Udlejningscyklusser
      detail: Kommerciel holdbarhed per board
    - metric: 5+ år
      label: Flådens levetid
      detail: Med korrekt vedligeholdelse og pleje
packages:
  title: Programmer til klubflåder
  subtitle: Vælg det flådeprogram, der matcher din klubs størrelse og ambitioner.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Lanceringsguide + sikkerhedstjekliste
        - Lanceringsguide + sikkerhedstjekliste
        - CE-certificeret — alt udstyr
      cta_text: Start din klub
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Program for reservedelsudskiftning (15% rabat)
        - Staff training session
        - Personaleuddannelse (online)
        - CE-certificeret — alt udstyr
      popular: true
      cta_text: Byg din flåde
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - Over 50 racer- og performance-boards
        - Full accessory set
        - Event support kit
        - Prioriterede reservedele (afsendelse inden for 24 t)
        - Dedikeret kundeansvarlig
        - Mulighed for specialdesignede teamuniformer
        - CE-certificeret — alt udstyr
      cta_text: Få konkurrenceflåden
training:
  title: Træningscenter-pakker
  subtitle: Alt, hvad en SUP-skole har brug for til at afholde professionelle certificeringskurser.
  items:
    - name: Instructor Starter
      features:
        - 5 premium SUP-boards (instruktørkvalitet)
        - 5 kulfiber-padler til demoer
        - 5 redningsveste (instruktørpasform)
        - Guide til træningsforløb
        - CE-certificeret udstyr
    - name: School Full Set
      features:
        - 20 SUP-boards (blanding af elever og instruktører)
        - 20 padler + 20 redningsveste (forskellige størrelser)
        - 10 opdriftshjælpemidler til begyndere
        - 4 pumper + reparationssæt
        - Træningsprogram og certificeringsstøtte
        - CE-certificeret udstyr
features:
  title: Hvorfor klubber vælger Afarer
  subtitle: Ensartet kvalitet, hurtige reservedele og mængdepriser, designet til voksende klubber.
  items:
    - title: 500+ udlejninger
      description: Brædder i kommerciel kvalitet klarer sæsoner med daglig brug.
      icon: tabler:shield-check
    - title: Specialfarver
      description: Match din klubprofil med skræddersyede board-farver og logo.
      icon: tabler:palette
    - title: Bulkpriser
      description: Mængderabat på flådeordrer med 10+ boards.
      icon: tabler:discount
    - title: Hurtige reservedele
      description: Reservedele afsendes inden for 48 timer.
      icon: tabler:truck-delivery
    - title: Støtte til klubvækst
      description: Rådgivning om medlemsprogrammer, priser og afholdelse af events.
      icon: tabler:trending-up
    - title: CE-certificeret
      description: Alt udstyr opfylder internationale sikkerhedsstandarder.
      icon: tabler:certificate
cta:
  title: Klar til at bygge din paddleklub?
  subtitle: Få et tilbud på din klubflåde eller hent vores startguide til klubber.
  actions:
    - text: Søg om Club Fleet
      href: /contact?package=club
      variant: primary
    - text: Hent klubguide
      href: /resources/download-catalog
      variant: secondary

features3_solutions:
  tagline: Løsninger efter virksomhedstype
  title: SUP-boards bygget til formålet<br />til din virksomhed
  isBeforeContent: false
  columns: 2
  items:
    - title: Resorts og hoteller
      description: Komplette SUP-flådeprogrammer til hotel- og ferieejendomme — holdbare brætter, tilpasset branding og støtte til personaletræning.
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: Paddleklubber
      description: Pålidelige SUP-flåder til padleklubber, undervisningsprogrammer og medlemsaktiviteter —brædder i kommerciel kvalitet til klubpriser.
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: Udlejningsoperatører
      description: High-rotation SUP-boards konstrueret til daglig udlejning. UV-bestandige, hurtigttørrende, stablebare — designet til at klare udlejningens slid.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: Detailpartnere
      description: Sælg det hurtigst voksende SUP-brand på dit marked. Komplet produktsortiment, markedsføringsmateriale, dropshipping og konkurrencedygtige marginer.
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: Distributører
      description: Eksklusive områder, komplet produktportefølje og dedikeret kundeadministration. Bliv en del af vores globale distributionsnetværk i over 50 lande.
      icon: tabler:world
      link: /solutions/distributors
    - title: Byg dit eget brand
      description: Fuldt integreret OEM/ODM-SUP-produktion — design, prototyping, serieproduktion og logistik. Lancér dit brand med Afarer.
      icon: tabler:package
      link: /solutions/build-your-own-brand

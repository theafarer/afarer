hero:
  tagline: Marin ekspertise
  title: Årtiers marineingeniørarbejde<br />i hvert skrog
  subtitle: afarer kombinerer dyb materialvidenskab, præcisionsfremstilling og virkelighedstestning for at producere fartøjer, der yder når det tæller.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarers marine engineering- og R&D-team i arbejde
expertise_materials:
  tagline: Materialevidenskab
  title: Vælg det rigtige materiale<br />til hver anvendelse
  subtitle: Vi arbejder med tre kernematerialer —hver valgt til specifikke anvendelsestilfælde og ydelseskrav.
  columns: 3
  items:
    - title: PVC af marinekvalitet
      description: 1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Overlegen kemisk resistens og UV-stabilitet. Hypalon-både kan holde 15-20 år med ordentlig pleje. Anbefales til kommercielle, rednings- og militære applikationer, hvor langsigtet holdbarhed er kritisk.
      icon: tabler:shield
    - title: Fiberglas og aluminium
      description: Dyb V-formet glasfiberskrog til SUP'er og patruljebåde —bølgeskærende ydeevne under barske forhold. Aluminiumsskrog til tunge kommercielle arbejdsbåde, der kræver maksimal styrke og lastkapacitet.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Produktionskapacitet
  title: Præcisionsfremstilling<br />ved hvert trin
  subtitle: Vores 12.000 m² facilitet er udstyret med specialiseret maskineri til hvert produktionstrin.
  columns: 2
  items:
    - title: CNC-skæring
      description: Computerstyret skæring sikrer præcise, gentagelige stofpaneler med minimalt spild. Hvert stykke passer nøjagtigt som designet.
      icon: tabler:cpu
    - title: Højfrekvenssvejsning
      description: Industriel HF-svejsning skaber sømme stærkere end basismaterialet. Konsekvent temperatur- og trykkontrol sikrer lufttætte forseglinger på tværs af hver produktionskørsel.
      icon: tabler:bolt
    - title: Samling af drop stitch-kerner
      description: Tusindvis af polyestertråde forbinder øvre og nedre stoflag, hvilket muliggør højtryksoppustning (15-20 PSI) til stive, stabile SUP-brædder og gulve.
      icon: tabler:building-arch
    - title: Tryktestning
      description: Hvert oppusteligt produkt trykprøves før forsendelse. SUP-rør testes ved 1,5x nominelt tryk —hvis det holder der, vil det præstere på vandet.
      icon: tabler:wind
    - title: Test af sømstyrke
      description: Tilfældige prøver fra hver produktionsbatch gennemgår destruktiv sømstyrketestning. Resultater logges og kan spores til specifikke produktionskørsler.
      icon: tabler:files
    - title: Vandtest
      description: Hver SUP-model gennemgår søprøver før certificering. Virkelighedstestning i kystforhold validerer ydelse, håndtering og stabilitet.
      icon: tabler:droplet
expertise_design:
  tagline: Design & engineering
  title: Konstrueret til virkelige forhold
  subtitle: Vores designfilosofi starter med hvordan båden skal bruges —derefter bygger vi konstruktionen omkring det anvendelsestilfælde.
  items:
    - title: Deep-V-skrogdesign
      description: Vores glasfiber-skrog har beregnede deadrise-vinkler, der er optimeret til hver models længde og tilsigtede anvendelse. Stejlere V-form for ydeevne i uroligt vand, fladere bund for stabilitet.
    - title: Sikkerhed med flere kamre
      description: Hver båd har 3-7 uafhængige luftkamre. Hvis et rum kompromitteres, holder de resterende kamre båden flydende og operativ.
    - title: Ergonomisk udformning
      description: Konsolposition, rørhøjde og sædeplacering er designet omkring operatørens komfort under længere tids brug —hvad enten det er patruljering, fiskeri eller transport.
    - title: Specialtilpasset konfiguration
      description: Rørfarver, konsolkonfiguration, brændstofkapacitet, tilbehørsbeslag —hver model kan tilpasses til at matche specifikke operationelle krav.
cta:
  title: Har du en specifik applikation i tankerne?

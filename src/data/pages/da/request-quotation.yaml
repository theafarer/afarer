meta:
  title: 'Anmod om et tilbud — OEM-SUP-produktion | {SITE}'
  description: 'Anmod om et detaljeret tilbud til dit oppustelige SUP- eller bådprojekt. OEM/ODM-produktion, private label eller tilpassede flåder — vi svarer inden for 2 arbejdsdage.'
  keywords:
    - 'anmod om SUP-tilbud'
    - 'OEM paddle board tilbud'
    - 'SUP-fabrik tilbud'
    - 'pris oppustelig SUP'
hero_text:
  tagline: Få et tilbud
  title: Anmod om et tilbud<br />til dit projekt
  subtitle: Fortæl os om dine krav, så svarer vores team med et detaljeret tilbud inden for 2 hverdage.
steps2_process:
  title: Sådan fungerer det
  subtitle: Fire enkle trin fra forespørgsel til tilbud.
  items:
    - title: 'Trin 1: Indsend dine krav'
      description: Udfyld formularen nedenfor med din produkttype, mængde og specifikationer. Jo flere detaljer du giver, desto mere nøjagtigt bliver dit tilbud.
      icon: tabler:file-text
    - title: 'Trin 2: Vi gennemgår & rådgiver'
      description: Vores ingeniørteam gennemgår dine krav og kan kontakte dig for afklaring. Vi giver anbefalinger om produktkonfiguration og muligheder.
      icon: tabler:users
    - title: 'Trin 3: Modtag dit tilbud'
      description: Du modtager et detaljeret tilbud inklusive enhedspris, MOQ, leveringstid, betalingsbetingelser og forsendelsesmuligheder. Typisk inden for 48 timer.
      icon: tabler:currency-dollar
    - title: 'Trin 4: Prøver & produktion'
      description: Efter tilbudsgodkendelse går vi videre til prøveproduktion (hvis relevant) eller direkte til masseproduktion. Regelmæssige opdateringer gennem hele processen.
      icon: tabler:building-factory
content_form:
  tagline: Tilbudsformular
  title: Fortæl os om dit projekt
  subtitle: Alle felter med * er påkrævet.
  contact_fields:
    firstName: Fornavn
    lastName: Efternavn
    companyName: Virksomhedsnavn
    email: E-mail
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Dykkercenter
        - Fiskeri
        - Marin turisme / resort
        - Eftersøgning og redning
        - Yacht-tender
        - Kommerciel arbejdsbåd
        - Regering / militær
        - OEM / Private label
        - Privat / fritid
        - Andet
    - name: Target Market
      type: text
      placeholder: f.eks. Europa, Nordamerika, Mellemøsten
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: f.eks. levering inden for 90 dage
    - name: Additional Requirements
      type: textarea
      options:
        - Ingen præference
        - PVC i maritim kvalitet (1100 dtex)
        - Premium Hypalon / CSM
        - Glasfiberskrog
        - Aluminiumsskrog
    - name: Engine Requirement
      type: text
      placeholder: f.eks. 60 HP påhængsmotor, ingen motor, to 115 HP
    - name: Customization Required
      type: text
      placeholder: f.eks. tilpassede farver, branding/logo, emballage, specialbeslag
    - name: Timeline
      type: text
      placeholder: f.eks. levering inden for 90 dage
    - name: Additional Requirements
      type: textarea
      placeholder: Beskriv din anvendelse, tekniske specifikationer eller eventuelle særlige krav — medtag referencetegninger, specifikationer eller links, hvis tilgængelige
    - name: Upload Specification
      type: file
      placeholder: Upload dit specifikationsark, din tegning eller et referencedokument (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Upload dit logo eller din grafik til tilpasset branding (AI, EPS, PNG)
cta:
  title: Foretrækker du at aftale nærmere på e-mail?
  subtitle: Send din forespørgsel direkte til vores salgsteam, så svarer vi inden for 24 timer.
  actions:
    - variant: primary
      text: Skriv til os på mail
      href: /contact

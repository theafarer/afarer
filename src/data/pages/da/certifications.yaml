  description: 'afarers kvalitetscertificeringer: CE (direktiv 2013/53/EU), ISO 9001:2015, BSCI. Overholdelse og sikkerhed for en producent af oppustelige SUP-brædder og både.'
  keywords:
    - 'CE-certificering paddle board'
    - 'ISO 9001 paddle board'
    - 'nautisk overholdelse'
    - 'paddle board certificering'
hero:
  tagline: Certificeringer & standarder
  title: Kvalitetscertificeringer<br />& Overholdelsesstandarder
  subtitle: afarer produkter fremstilles i overensstemmelse med internationale marine sikkerhedsstandarder, kvalitetsstyringssystemer og miljøbestemmelser.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarers kvalitetscertificeringer og compliance-dokumentation
content_certifications:
  tagline: Vores certificeringer
  title: Certificeret kvalitet,<br />globalt anerkendt
  subtitle: Hvert afarer-produkt understøttes af certificeringer, der demonstrerer vores engagement i kvalitet, sikkerhed og miljøansvar.
  items:
    - title: CE-certificeret
      description: Alle afarer-produkter opfylder europæiske CE-mærkningskrav for rekreative fartøjer, hvilket sikrer, at sikkerheds-, sundheds- og miljøbeskyttelsesstandarder opfyldes.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Vores kvalitetsstyringssystem er ISO 9001:2015-certificeret og dækker design, fremstilling og distribution af oppustelige fartøjer og marineudstyr.
      icon: tabler:clipboard-check
    - title: UKCA-mærket
      description: Produkter solgt på det britiske marked bærer UKCA-mærkning, der bekræfter overholdelse af britiske regler for marineudstyr og personlige fartøjer.
      icon: tabler:shield
    - title: BSCI-certificeret
      description: afarer er BSCI (Business Social Compliance Initiative) revideret, hvilket demonstrerer etisk fremstillingspraksis, fair arbejdsforhold og ansvar i forsyningskæden.
      icon: tabler:heart-handshake
    - title: REACH-kompatibel
      description: Alle materialer, der bruges i afarer-produkter, overholder EU's REACH-regler for kemikaliesikkerhed og sikrer, at der ikke er begrænsede stoffer i vores PVC, Hypalon eller komponenter.
      icon: tabler:flask
    - title: Materialetestning
      description: Stoffer testes for trækstyrke, rivestyrke, UV-nedbrydning og koldcrack-ydeevne. Hver produktionsbatch prøvetages og verificeres.
      icon: tabler:test-pipe
content_factory:
  tagline: Fabriksstandarder
  title: Fremstillings-excellence<br />— bygget til specifikation
  subtitle: Vores 12.000 m² facilitet opererer under strenge kvalitetskontrolprotokoller ved hvert produktionstrin.
  list:
    - 'Modtagelseskontrol af materialer: Alle råmaterialer — PVC-stof, Hypalon, aluminium, krydsfiner, klæbemidler — testes mod specifikationerne, før de går i produktion.'
    - 'Kvalitetskontrol under produktionen: Hvert produktionstrin har dokumenterede QC-kontrolpunkter. Svejsestyrke, sømjustering, ventilinstallation og monteringsmoment verificeres inline.'
    - 'Tryktest: Hvert oppusteligt kammer tryktestes ved 1,5× nominelt tryk i 24 timer. Lækageraten skal være nul for at bestå.'
    - 'Endelig inspektion: Færdige produkter inspiceres for dimensionsnøjagtighed, kosmetisk finish, komplet tilbehør og emballagens integritet, før de afsendes.'
    - 'Batchsporbarhed: Ethvert produkt bærer et serienummer knyttet til produktionsbatchregistreringerne, hvilket sikrer fuld sporbarhed fra råmateriale til færdigvare.'
content_safety:
  tagline: Marine sikkerhedsstandarder
  title: Sikkerhed først<br />— designet til pålidelig drift
  subtitle: afarer-produkter er designet og testet til at opfylde internationale marine sikkerhedsstandarder til kommerciel og rekreativ brug.
  items:
    - title: ISO 6185
      description: Oppustelige både opfylder ISO 6185-standarder for konstruktion, stabilitet, opdrift og lastkapacitet.
      icon: tabler:sailboat
    - title: ABYC-standarder
      description: Elektriske systemer og brændstofsystemer følger ABYC-standarder (American Boat & Yacht Council) for sikker installation og drift.
      icon: tabler:bolt
    - title: SOLAS-overholdelse
      description: Sikkerhedsudstyr og redningsapparater opfylder SOLAS-krav (Safety of Life at Sea) hvor relevant.
      icon: tabler:lifebuoy
cta:
  title: Har du brug for certificerede produkter til dit projekt?
  subtitle: Kontakt vores team for at diskutere certificeringskrav, dokumentation og overholdelse for dit marked.
  actions:
    - variant: primary
      text: Anmod om certificeringsdokumenter
      href: /contact
    - text: Se vores kvalitetsside
      href: /quality

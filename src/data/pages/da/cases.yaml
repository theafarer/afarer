hero:
  tagline: 'Casestudier'
  title: 'Virkelige projekter, virkelige resultater<br />—afarer i aktion'
  subtitle: 'Se hvordan afarer samarbejder med distributører, mærker og operatører verden over for at levere skræddersyede marine løsninger til enhver applikation.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'afarer casestudier —skræddersyede marine produktionsprojekter'
features3_cases:
  tagline: 'Udvalgte cases'
  title: 'Skræddersyede løsninger<br />til virkelige udfordringer'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Europæisk dykkercenterflåde'
      description: 'Leverede 12 SUP 520 dykkerkonfigurerede både til en middelhavskæde af dykkercentre. Specialfremstillede tankstativer, dykkerstiger og flådebranding. Leveret på 60 dage.'
      icon: tabler:lifebuoy
    - title: 'Australsk distributør-OEM-program'
      description: 'Udviklede et private-label SUP-board-sortiment til en australsk vandsportsdistributør. 8 modeller, specialemballage og drop-ship-logistik. Fra koncept til første forsendelse på 90 dage.'
      icon: tabler:currency-dollar
    - title: 'Redningsbådslevering Mellemøsten'
      description: 'Leverede 20 SUP 450 Patrol-både til en civilforsvarsorganisation i Mellemøsten. Selvlænsende dæk, fuldt navigationsudstyr og højsynlige orange slanger. Overholdelse af lokale regulatoriske standarder.'
      icon: tabler:alert-triangle
    - title: 'Europæisk OEM-brandpartnerskab'
      description: 'White-label-produktionspartnerskab med et europæisk maritimt mærke. 5 SUP-modeller, privat branding, eksklusive distributionsrettigheder for EU-markedet. Flerårig aftale.'
      icon: tabler:building
    - title: 'Caribisk resortflåde'
      description: 'Komplet vandsportsudstyrspakke til et caribisk resort: 40 SUP-boards, 20 kajakker, 10 oppustelige både og tilbehør. Specialdesignet resort-branding på alt udstyr.'
      icon: tabler:beach
    - title: 'US-kystpatruljekontrakt'
      description: 'Leverede SUP 600 patruljebåde til et amerikansk kystsikkerhedsagentur. Tomotorkonfiguration, pansrede konsolmuligheder og militær elektronisk integration.'
      icon: tabler:shield
cta:
  title: 'Har du et projekt, du gerne vil diskutere?'

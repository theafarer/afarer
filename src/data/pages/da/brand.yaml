hero:
  tagline: Brand
  title: afarer brandet
  subtitle: Kvalitet, innovation og pålidelighed —det er afarer.
story:
  tagline: Vores historie
  title: Opbygning af tillid siden 2012
  body: |
    afarer blev grundlagt med en klar vision —at producere premium gummibåde og vandsportsudstyr, der holder til virkelige forhold. På over et årti er vi vokset fra et lille værksted til en globalt anerkendt producent.
mission:
  tagline: Mission
  title: Vores mission
  body: At levere højkvalitets, innovative og prismæssigt overkommelige vandsportsprodukter, der gør vandaktiviteter tilgængelige for alle.

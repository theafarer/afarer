  title: Produktionskapacitet & årlig produktion
  subtitle: 'Facilitet på 12.000 m², der producerer 15.000+ både om året med plads til at skalere'
intro: >-
  afarer driver et af de største dedikerede produktionsanlæg til oppustelige både i Qingdao i Kina. Vores fabrik på 12.000 m² er organiseret i seks specialiserede værksteder, der kører parallelt, hvilket giver os kapaciteten til at producere over 15.000 både årligt på tværs af linjerne for SUP, kajakker, joller, RIB og sikkerhedsudstyr.

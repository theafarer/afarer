    description: 'Multifunktionsproduktionslinjer til oppustelige SUP-boards. Varmluftssvejsestationer, RF-dielektriske presser og monteringsarbejdsstationer omkonfigureres baseret på ordremiks. Årlig kapacitet: 5.000+ enheder.'

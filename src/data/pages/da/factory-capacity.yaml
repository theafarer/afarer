workshops:
  - title: Produktion af SUP boards
    description: '4 parallelle samlebånd til oppustelige SUP-boards. Hvert bånd kan producere 50–80 boards per skift. Stationer til digitaltryk og serigrafi kører samtidigt. Årlig SUP-kapacitet: 8.000+ boards.'
    output: 8.000+ SUP-boards/år
  - title: 'Produktion af RIB-både'
    description: 'Dedikeret glasfiberskrogsværksted med 6 formstationer til bådskrog op til 7,6 m. Rørsvejse- og monteringsområde håndterer 3–6 både samtidigt. Årlig RIB-kapacitet: 2.000+ både.'
    output: '2.000+ RIB-både/år'
  - title: 'Oppustelige både og SUP'
    description: 'Multiproduktionslinjer til oppustelige både, kajakker og joller. Varmluftssvejsestationer, RF-dielektriske presser og monteringsarbejdsstationer omkonfigureres baseret på ordremiks. Årlig kapacitet: 5.000+ enheder.'
    output: '5.000+ enheder/år'
  - title: Sikkerhedsudstyr
    description: 'Separat renrumsproduktionsområde til redningsveste og sikkerhedsudstyr. Dedikerede sy-, skumindførings- og teststationer. Årlig redningsvestkapasitet: 50.000+ enheder.'
    output: '50.000+ redningsveste/år'
oem_capacity:
  moq: 'SUP: 5–10 enheder | Båd: 2–5 enheder | Kajak/Jolle: 10–50 enheder | Tilpasset form: 200+ enheder'
  lead_time: Standard 30–45 dage. Prøve 15–20 dage. Hasteordre tilgængelig.
  payment: T/T 30% depositum + 70% før forsendelse. L/C, Western Union accepteres.

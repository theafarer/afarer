workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50—0 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: SUP Boat Production
    description: "Dedikeret glasfiber skrogværksted med 6 formstationer til SUP-skrog op til 7,6 m. Rørsvejse- og monteringsområde håndterer 3— SUP'er samtidigt. Årlig SUP-kapacitet: 2.000+ både."
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & SUP
    description: 'Multiproduktionslinjer til oppustelige både, kajakker og joller. Varmluftssvejsestationer, RF-dielektriske presser og monteringsarbejdsstationer omkonfigureres baseret på ordremiks. Årlig kapacitet: 5.000+ enheder.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'Separat renrumsproduktionsområde til redningsveste og sikkerhedsudstyr. Dedikerede sy-, skumindførings- og teststationer. Årlig redningsvestkapasitet: 50.000+ enheder.'
    output: '50,000+ life vests/year'


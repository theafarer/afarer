faqs:
  title: 'FAQ om OEM-produktion af paddleboards'
  subtitle: 'Svar på de mest almindelige spørgsmål fra brands, der lancerer deres eget paddleboard.'
  items:
    - title: 'Hvordan skaber jeg mit eget paddleboard-brand?'
      description: 'Lancer jeres brand på 16 uger: brief, design, CE-certificeret prototype, masseproduktion og levering. Udforsk vores OEM-pakker.'
    - title: 'Hvad er produktionstiden?'
      description: 'Prøven er klar på 2-3 uger, masseproduktion på 30-45 dage afhængigt af volumen.'
    - title: 'Bærer paddleboardet vores logo?'
      description: 'Ja — fuld private label: logoprint, egne farver, emballage og labels i jeres brand.'
    - title: 'Kan jeg købe engros fra dag ét?'
      description: 'MOQ er 50 stk. til standardmodeller, med engrospristrin efterhånden som volumen stiger.'

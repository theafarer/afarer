      description: Startet af to marinearkitekter med en CNC-fræser og en stædig idé.
      icon: tabler:building-factory
    - title: Første 1,000 skrog leveret
      description: Vi er nu nået til vores syvende år, hovedsageligt gennem mund-til-mund-anbefalinger og tilbagevendende kunder.
      icon: tabler:circle-check

features3_what_we_build:
  title: Det, vi bygger
  subtitle: 'Vi startede i et kystnært værksted med én båd og en urokkelig overbevisning: marineprodukter skal konstrueres, som om de betyder noget – for det gør de. I dag leverer vi til over 40 lande, men hvert skrog passerer stadig gennem de samme hænder, der startede virksomheden.'
  columns: 3
  isBeforeContent: true
  items:
    - title: SUP-brætter
      description: Opslåelige SUP-boards fra 9 ft til 12 ft. Designet til touring, yoga, fiskeri og familiebrug.
      icon: tabler:ship
    - title: Oppustelige SUPs
      description: PVC-oppustelige SUP-brædder fra 9 ft til 12 ft. Lette, robuste og nemme at opbevare.
      icon: tabler:speedboat
    - title: Premium SUP-pakker
      description: Kompakte, højspecifikke SUPs specialbygget til at matche dit brands eller din flådes krav.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Tilbehør
      description: Padler, pumper, betræk, tørtasker og elektronik. Alt sammen afstemt med vores boards.
      icon: tabler:package
    - title: Renovering & reparation
      description: Intern brætreparation, udskiftning af dækpuder og opgradering af tilbehør.
      icon: tabler:tool
    - title: Skræddersyede konstruktioner
      description: Projektbaseret design for kommercielle, videnskabelige og militære kunder.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Båddesign og teknisk udvikling

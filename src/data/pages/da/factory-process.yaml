    icon: tabler:flame
  - title: Montering
    description: Kvalificerede teknikere monterer ventiler, tilbehør og fittings.
    icon: tabler:tool
  - title: Test
    description: Hvert produkt gennemgår tryk-, opdrifts- og inspektionstest.
    icon: tabler:clipboard-check
  - title: Pakning
    description: Produkter pakkes omhyggeligt og gøres klar til forsendelse.
    icon: tabler:package

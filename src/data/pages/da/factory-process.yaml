meta:
  title: 'Produktionsproces — Fra råmateriale til SUP | {SITE}'
  description: 'Fra råmateriale til søklar SUP: hvert trin i afarers produktionsproces under vores kontrol, fra skæring og svejsning til testning.'
  keywords:
    - 'SUP produktionsproces'
    - 'oppustelig SUP-fabrik'
    - 'paddle board produktionstrin'
    - 'PVC-svejsning SUP'
hero:
  tagline: Produktionsproces
  title: Vores produktionsproces
  subtitle: Fra råmateriale til færdigt produkt — hvert trin er kvalitetsstyret.
  back_label: Tilbage til fabrikken
  back_link: /factory
intro: >-
  I modsætning til brands, der outsourcer produktionen til tredjepartsfabrikker, ejer og driver afarer hele sin produktionskæde. Denne vertikale integration gør os i stand til at opretholde streng kvalitetskontrol i alle faser, reagere hurtigt på kundetilpassede krav og levere ensartet
  produktkvalitet batch efter batch. Sådan bygges et SUP-board hos os.
steps:
  - step: '01'
    title: Skæring
    description: Automatiske CNC maskiner skærer præcist stoffer efter specifikationer.
    duration: 1– dage
  - step: '02'
    title: Svejsning
    description: RF og varmluftssvejsning skaber stærke, lufttætte samlinger.
    duration: 2–4 timer pr. bådkit
  - step: '03'
    title: Montering
    description: Kvalificerede teknikere monterer ventiler, tilbehør og fittings.
    duration: 1–2 dage pr. båd
  - step: '04'
    title: Test
    description: Hvert produkt gennemgår tryk-, opdrifts- og inspektionstest.
    duration: 1–2 dage per board
  - step: '05'
    title: Pakning
    description: Produkter pakkes omhyggeligt og gøres klar til forsendelse.
    duration: 1– dage
  - step: '06'
    title: Endelig samling og tilpasning
    description: Ventiler, D-ringe, håndtag, finnekasser og dækmåtter monteres på samlebåndet. Hvert board følger en 100-punkts monteringscheckliste med obligatorisk godkendelse ved hvert trin.
    duration: 1– dage
  - step: '07'
    title: Kvalitetstest & inspektion
    description: >-
      Hvert færdigt bræt gennemgår en obligatorisk kvalitetskontrol: lufttæthedstest af kamre, funktionstjek af beslag, verifikation af tilspændingsmoment på fastgørelser samt visuel inspektion. Skræddersyede og prototype-modeller gennemgår desuden test på vandet, der dækker stabilitet og
      håndtering.
    duration: 1– dage
  - step: '08'
    title: Pakning & forsendelse
    description: Boards pumpes ned, foldes efter proceduren, pakkes i kraftige vævede tasker eller detailkasser og lastes til forsendelse. Hver pakke mærkes med model, serienummer og destination. Vi koordinerer med speditører for FCL- og LCL-containersendinger over hele verden.
    duration: 1 dag

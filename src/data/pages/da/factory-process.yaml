hero:
  tagline: Proces
  title: Produktionsproces
  subtitle: Fra råmateriale til vandklar board — hvert trin under vores kontrol
  back_label: Tilbage til fabrikken
  back_link: /factory
intro: >-
  I modsætning til brands, der outsourcer produktionen til tredjepartsfabrikker, ejer og driver afarer hele sin produktionskæde. Denne vertikale integration gør os i stand til at opretholde streng kvalitetskontrol i alle faser, reagere hurtigt på kundetilpassede krav og levere ensartet
  produktkvalitet batch efter batch. Sådan bygges et board i vores fabrik.
steps:
  - step: '01'
    title: Modtagelse & inspektion af materialer
    description: >-
      Hver indkommende batch af PVC-stof, fiberglasmatte, harpiks og beslag inspiceres i forhold til specifikationen. Stofprøver testes for trækstyrke, ensartet tykkelse og UV-bestandighed, før de frigives til produktion. Materialer, der ikke lever op til specifikationerne,
      isoleres og returneres.
    duration: 1–2 dage
  - step: '02'
    title: Automatisk PVC-skæring
    description: >-
      Godkendte stoffer lægges på den automatiske CNC-klipemaskine og klippes med sub-millimeter præcision. Computeroptimeret nesting placerer panelerne, så spildet minimeres — typisk under 5%. De klippede paneler mærkes med boardmodel og kammer og bundtes til transport til
      svejseværkstedet.
    duration: 2–4 timer pr. boardkit
  - step: '03'
    title: Varmforsegling & svejsning af rør
    description: >-
      Paneler hæftes og samles på varmforseglingsmaskiner med varmluftssvejsning ved kontrollerede temperaturer på 200–300 °C. Hovedsømmene forstærkes med RF-dielektrisk svejsning for lufttætte samlinger med høj styrke. Færdige kamre oppustes til 1.5× arbejdstryk for 30 minutters
      validering af luftfasthed.
    duration: 1–2 dage pr. board
  - step: '04'
    title: SUP-print & dekoration
    description: >-
      Grafik på SUP-boardets dæk påføres med digitaltryk til fotorealistiske designs i fuld farve og silketryk til holdbare logoer og gentagne mønstre. Trykkene hærdes og forsegles for UV- og slidbestandighed.
    duration: 1–2 dage
  - step: '05'
    title: Endelig montering & udrustning
    description: >-
      Boards udrustes på samlebåndet med finner, ventiler, EVA-dæk og tilbehør. Hver enhed følger en 100-punkts monteringscheckliste med obligatorisk godkendelse ved hvert trin.
    duration: 2–4 dage
  - step: '06'
    title: Kvalitetstest & inspektion
    description: >-
      Hvert færdigt board gennemgår en obligatorisk kvalitetsport: lufttæthedstest af kamre, funktionstjek af beslag, verifikation af tilspændingsmoment på fastgørelser samt kosmetisk inspektion. Skræddersyede boards og prototyper gennemfører desuden prøver på vandet, der dækker
      stabilitet og manøvreevne.
    duration: 1–2 dage
  - step: '07'
    title: Pakning & forsendelse
    description: >-
      Boards luftes ud, foldes efter proceduren, pakkes i kraftige vævede tasker eller krydsfinerkasser og lastes til forsendelse. Hver pakke mærkes med model, serienummer og destination. Vi koordinerer med speditører for FCL- og LCL-containersendinger over hele verden.
    duration: 1 dag

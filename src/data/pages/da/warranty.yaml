seo:
  headline: afarer garanti for gummibåde —5 års begrænset garanti | afarer
  description: afarer tilbyder 5 års begrænset garanti på primært slangestof, sømme og glasfiberskrog.
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Denne begrænsede garanti gælder for nye oppustelige maritime produkter med afarer-mærket, der er købt direkte hos afarer eller hos en autoriseret afarer-forhandler eller detailhandler. Ikrafttrædelsesdatoen er den verificerbare dato for det oprindelige detailkøb.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garantidækning og varighed</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 år</h3>
        <p class="text-sm text-gray-600 mt-1">Primært slangestofs integritet (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 år</h3>
        <p class="text-sm text-gray-600 mt-1">Glasfiberskrogets strukturelle integritet</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 år</h3>
        <p class="text-sm text-gray-600 mt-1">Oppustelige slangesømmes evne til at holde på luften</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 år</h3>
        <p class="text-sm text-gray-600 mt-1">Funktionaliteten af påfyldningsventiler</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 år</h3>
        <p class="text-sm text-gray-600 mt-1">Fabriksinstalleret tilbehør og hjælpefittings</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 år*</h3>
        <p class="text-sm text-gray-600 mt-1">Kommercielt brug, udlejning eller flådebrug — alle komponenter</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Kommercielt, statsligt, charter-, leje- eller undervisningsmæssigt brug reducerer garantien til 1 år. Brug i væddeløb eller konkurrence gør garantien fuldstændig ugyldig.</p>
  </div>

  <h2>Hvad er dækket</h2>
  <h3>Primært slangestof (5 år)</h3>
  <p>afarer garanterer for hovedslangestoffet mod porøsitetsforringelse, der i væsentlig grad kompromitterer produktets evne til at opretholde driftsmæssig oppumpning. Dette gælder for CSM (Hypalon)-belagt stof og alle andre slangestofmaterialer, der anvendes i produktionen.</p>

  <h3>Glasfiberskrogets strukturelle integritet (5 år)</h3>
  <p>For produkter med et skrog af glasfiberarmeret plast (FRP) garanteres den grundlæggende kompositstruktur mod strukturelle fejl på grund af fejl i materialer eller udførelse.</p>

  <h3>Oppustelige slangesømmes evne til at holde på luften (5 år)</h3>
  <p>Sømmene på de oppustelige slanger, hvor de er forbundet under produktionen, er garanteret mod produktionsfejl, der medfører væsentlig luftlækage gennem sømmen. Regelmæssig inspektion og vedligeholdelse af passende oppumpningstryk er betingelser for dækningen.</p>

  <h3>Funktionaliteten af påfyldningsventiler (5 år)</h3>
  <p>Påfyldningsventiler, der oprindeligt er installeret af afarer, er garanteret mod produktionsfejl i materialer eller udførelse, der forhindrer ventilen i at holde på luften som designet.</p>

  <h3>Fabriksinstalleret tilbehør (1 år)</h3>
  <p>Komponenter og fittings, der er fremstillet af afarer og oprindeligt installeret på fabrikken, er garanteret mod fejl i materiale og udførelse i ét år. Dette omfatter ikke tredjepartsgenstande, som kun er dækket af deres respektive producenters garantier.</p>

  <h2>Hvad er ikke dækket</h2>
  <ul>
    <li>Kosmetiske fejl, herunder misfarvning, pletter, falming, kridtning eller enhver ændring i udseende</li>
    <li>Huller, snit, rifter, revner eller anden fysisk skade</li>
    <li>Krakelering, revner, slid, afskrabning eller forringelse på grund af friktion eller kontakt</li>
    <li>Forringelse på grund af udsættelse for UV-lys, vejrlig eller atmosfæriske forhold</li>
    <li>Skader fra kontakt med brændstoffer, opløsningsmidler, syrer, baser eller kemikalier</li>
    <li>Skader fra forsømmelse, forkert brug, misbrug, ulykker eller normal slitage</li>
    <li>Gelcoat- eller malingsproblemer (blærer, krakelering, misfarvning, falming)</li>
    <li>Skader fra stød, belastning, forkert støtte eller trailertransport</li>
    <li>Skader fra forkert oppumpning/afpumpning eller brug af ikke-godkendte oppumpningsenheder</li>
    <li>Tredjepartsudstyr, komponenter eller systemer (dækket af deres respektive producenter)</li>
  </ul>

  <h2>Producentens forpligtelse og udbedring</h2>
  <p>afarers eneste og eksklusive forpligtelse er reparation eller udskiftning, efter afarers valg, af enhver komponent, der vurderes at have fejl i materialer eller udførelse og er dækket af denne garanti. Reparationer eller udskiftninger udføres af afarer eller dets udpegede autoriserede servicefacilitet. Reparerede eller udskiftede komponenter er kun garanteret for den uudløbne del af den oprindelige garantiperiode.</p>

  <h2>Garantibetingelser</h2>
  <ul>
    <li><strong>Registrering:</strong> Produktet skal være korrekt registreret som krævet i garantiens vilkår.</li>
    <li><strong>Vedligeholdelse:</strong> Produktet skal vedligeholdes i overensstemmelse med afarers offentliggjorte retningslinjer, herunder regelmæssig inspektion og vedligeholdelse af passende oppumpningstryk.</li>
    <li><strong>Samarbejde:</strong> Køberen skal fuldt og hurtigt samarbejde med afarer i alle forhold vedrørende garantikrav.</li>
    <li><strong>Oprindelig køber:</strong> Denne garanti gives udelukkende til den oprindelige slutbrugerkøber og kan ikke overdrages.</li>
  </ul>

  <h2>Kommerciel brug</h2>
  <p>Hvis produktet bruges til kommercielt, statsligt, nonprofit-, charter-, leje-, undervisningsmæssigt eller ethvert andet formål end privat fritidsbrug, reduceres garantiperioden for alle komponenter til ét (1) år fra den oprindelige dato for detailkøbet. Brug i væddeløb, hastigheds- eller udholdenhedskonkurrencer gør straks og uigenkaldeligt hele garantien ugyldig.</p>

  <h2>Sådan gør du et garantikrav</h2>
  <p>Kontakt afarer eller din autoriserede forhandler med købsbevis og en detaljeret beskrivelse af problemet. afarer vil gennemgå kravet og give instruktioner om inspektion og service.</p>
  <p>For garantiservicehenvendelser kan du kontakte os via vores <a href="/contact" class="text-sky-600 underline">kontaktside</a> med dit ordrenummer og produktoplysninger.</p>

  <h2>Tredjepartsgenstande</h2>
  <p>Udstyr, komponenter eller systemer fremstillet af tredjeparter (selvom de er installeret af afarer) er udelukkende dækket af enhver garanti, som deres respektive producent tilbyder. afarer fraskriver sig udtrykkeligt ethvert garantiansvar for sådanne tredjepartsgenstande.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Denne garantierklæring er et resumé af den fulde afarer Producentens begrænsede garanti. Det fulde juridiske garantidokument styrer alle garantibetingelser og -vilkår. Specifikationer kan ændres uden varsel. afarer er et mærke fra Qingdao Vatrad Group.
  </p>

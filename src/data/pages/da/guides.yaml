hero:
  tagline: Guides
  title: Ny til SUP?
  subtitle: Praktiske guides, der hjælper dig med at vælge, bruge og nyde oppustelige SUP-boards.
size_guide:
  tagline: Størrelse & specifikationer
  title: Find den rette størrelse til dine behov
  desc: Sammenlign SUP-brætters dimensioner, vægtkapacitet og anbefalede anvendelser. Uanset om du har brug for en touring-SUP, et yogabræt eller en all-around SUP — hjælper vores størrelsesguide dig med at vælge den rette model.
  link_label: Fuld størrelsesguide med produktspecifikationer →
  link: /size-guide
  cards:
    - title: SUP-boards
      desc: Vælg længden ud fra din vægt og dit brugsformål. Bredere brætter (32"+) giver mere stabilitet. Længere brætter (11—2 ft) holder kursen bedre ved touring.
    - title: Touring-SUP'er
      desc: Længere boards (11—2 ft) til at tilbagelægge lange distancer og holde kursen lige. Stabile nok til touring med udstyr. Tjek altid vægtkapaciteten.
    - title: All-round SUP-brædder
      desc: Vælg længde ud fra rytterens vægt og brug. Bredere boards (32"+) giver stabilitet. Alsidige til rekreation og fitness.

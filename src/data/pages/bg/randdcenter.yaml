meta:
  title: 'R&D център | {SITE}'
  description: 'Изследвания и разработки — изпитвания на PVC плат, инженеринг на корпуси, RF заваряване, хидродинамични изпитвания и контрол на качеството. Налични персонализирани R&D услуги.'

hero:
  tagline: 'R&D център'
  title: 'R & D център'
  subtitle: 'Съсредоточени върху прогреса'

intro:
  - 'Центърът за изследвания и разработки (R&D) на afarer е движещата сила зад нашата мисия да революционизираме оборудването за водни спортове. Даваме възможност на любителите на водните спортове по целия свят да ползват по-безопасни, по-удобни и по-приятни продукти чрез неуморни иновации в надуваемите дъски за сърф с гребло в изправено положение (SUP). Нашият специализиран екип от инженери, дизайнери и запалени експерти по водните спортове оформя бъдещето на индустрията, повишавайки постоянно летвата за качество, представяне и устойчивост.'
  - 'Нашият R&D комплекс събира под един покрив специалисти по материали, морски инженери и производствени инженери. От формулата на плата и симулацията на корпуса до разработването на процеса на заваряване и пълномащабните морски изпитвания, всеки етап от разработката на продукта се управлява от данни и се валидира чрез изпитвания.'

mission:
  tagline: 'Нашата мисия'
  title: 'Иновираме бъдещето на водните спортове'
  pillars:
    - icon: lightning
      title: 'Технологичен напредък'
      desc: 'Пионери в новите материали, дизайни и производствени методи за превъзходно представяне и дълготрайност на продуктите.'
    - icon: design
      title: 'Дизайн, фокусиран върху потребителя'
      desc: 'Дълбоко разбиране и надхвърляне на потребителските нужди чрез ергономичен и интуитивен продуктов дизайн.'
    - icon: globe
      title: 'Устойчиви практики'
      desc: 'Минимизиране на нашия екологичен отпечатък чрез използване на екологични материали и процеси.'
    - icon: shield
      title: 'Безкомпромисна безопасност'
      desc: 'Осигуряване на най-високите стандарти за безопасност чрез строги изпитвания и сертифициране.'

pillars:
  - title: 'Технологичен напредък'
    desc: 'Пионери в новите материали, дизайни и производствени процеси, за да доставим превъзходно представяне и дълготрайност на продуктите.'
    icon: tech
  - title: 'Напреднали материали'
    desc: 'Изследване на авангардни PVC, композити и устойчиви алтернативи за подобрени продуктови характеристики.'
    icon: materials
  - title: 'Устойчивост'
    desc: 'Основен ангажимент: Посветени сме на опазването на околната среда чрез устойчиво производство и рециклируеми материали.'
    icon: sustainability

capabilities:
  tagline: 'Възможности'
  title: 'R&D възможности'
  subtitle: 'Четири основни дисциплини, които ни дават пълен контрол върху разработката на продукти — от изследванията на суровините до финалното сертифициране.'
  groups:
    - title: 'Материалознание и технология на платовете'
      items:
        - 'Анализ и оптимизация на PVC формули'
        - 'Разработване на UV стабилизатори, огнеустойчивост и антимикробни добавки'
        - 'Многослойно ламиниране на платове и инженеринг на сцеплението'
        - 'Ускорени изпитвания на стареене (UV, термични, влажност, солена мъгла)'
    - title: 'Инженеринг на корпуси и хидродинамика'
      items:
        - 'Параметричен 3D дизайн на корпуси и CFD оптимизация'
        - 'Анализ с крайни елементи за конструктивни и ударни натоварвания'
        - 'Изпитвания на мащабни модели в опитен басейн и валидиране на представянето'
        - 'Разработка на персонализирани корпуси за специални мисии'
    - title: 'Технологии за заваряване и съединяване'
      items:
        - 'Разработване и оптимизация на RF диелектрични процеси на заваряване'
        - 'Методи на заваряване с горещ въздух, горещ клин и ултразвук'
        - 'Адхезивно свързване и квалифициране на ленти за шевове'
        - 'Моделиране на якостта на заварките и прогнозиране на жизнения цикъл'
    - title: 'Изпитвания, сертифициране и съответствие'
      items:
        - 'Управление на качеството и изпитвания за съответствие с CE'
        - 'Независими изпитвания от трети страни и подкрепа при сертифициране'
        - 'Разработване на персонализирани тестови протоколи за квалифициране при обществени поръчки'
        - 'Анализ на експлоатационни повреди и изследване на първопричините'


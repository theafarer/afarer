    - title: 'OEM / ODM продуктов инженеринг'
      desc: 'Разработваме персонализирани формули на платове, пакети от ламинати и адхезивни системи, съобразени с вашата работна среда и целеви показатели.'
    - title: 'Изпитвания и сертифициране от трети страни'
      desc: 'Използвайте нашите съобразени с ISO изпитвателни съоръжения за независими изпитвания на материали, валидиране на продукти и подкрепа при сертифициране.'
  cta: 'Обсъдете вашите R&D изисквания →'
  cta_link: /contact/

vision:
  tagline: 'Нашето виждане'
  title: 'Оформяме бъдещето на водните спортове'
  body: 'afarer се стреми да води индустрията на надуваемите SUP чрез непрекъснати иновации, непоколебимо качество и твърд ангажимент към безопасността и устойчивостта — като в крайна сметка обогатява преживяванията на любителите на водните спортове по целия свят. R&D центърът на afarer е мястото, където страстта среща иновацията, и поставя нови стандарти за индустрията на водните спортове.'

labs_section:
  tagline: 'Лаборатории'
  title: 'Нашите лаборатории'
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: 'Лаборатория за PVC платове'
      description: 'Непрекъснати изследвания и изпитвания на PVC палубни платове за якост на опън, UV устойчивост, абразия и гъвкавост при ниски температури, за да се гарантира дългосрочна надеждност в морска среда.'
      href: /randdcenter/pvc-fabric-lab/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 'Студио за инженеринг на корпуси'
      description: 'Дизайн с CAD и анализ с крайни елементи на корпуси от HDPE, алуминий и фибростъкло. Всеки корпус се симулира цифрочно за разпределение на напреженията и ударна устойчивост, преди да бъде построен първият прототип.'
      href: /randdcenter/hull-engineering/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: 'RF център за заваряване'
      description: 'Специализирано съоръжение за заваряване с радио честота с прецизен контрол на температурата и налягането, което произвежда високоякостни херметични шевове, отговарящи на стандартите на морската индустрия за надуваеми плавателни съдове.'
      href: /randdcenter/rf-welding/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 'Хидродинамичен опитен басейн'
      description: 'Изпитвания на мащабни модели в нашия собствен опитен басейн за оптимизиране на формата на корпуса, глисиращото представяне, стабилността и ефективността в диапазон от условия на натоварване и море.'
      href: /randdcenter/hydrodynamic-test-tank/
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: 'Цех за прототипи'
      description: 'Съоръжение за прототипиране и оборудване в реален мащаб, където новите модели се изграждат, оборудват и изпитват в морето. Всеки прототип преминава минимум 20-часова програма за изпитвания във вода, преди да бъде одобрен за производство.'
      href: /randdcenter/prototype-workshop/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 'Лаборатория за качество и контрол'
      description: 'Специализирана лаборатория за осигуряване на качеството, която извършва изпитвания на опън, цикли на задържане на въздуха, тестове на шевовете на белене и сертифициране на материали, за да гарантира, че всяка дъска, напускаща цеха, отговаря на нашите публикувани спецификации.'
      href: /randdcenter/quality-inspection-lab/

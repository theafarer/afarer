intro: 'Един CAD модел, колкото и подробен да е, не може да разкрие как наистина ще се държи една дъска, докато не срещне водата. Затова нашата работилница за прототипи е проектирана да превежда инженерните данни в реална, готова за вода дъска възможно най-бързо и точно. Всеки нов модел Afarer — и всяко значимо персонализирано изграждане — минава през тази работилница, преди да бъдат ангажирани производствените инструменти.'

content_html: |
  <h2>Мястото, където дизайнът става реалност</h2>
  <p>Работилницата е напълно оборудвана за едновременна изработка на корпус, бордове и такелаж. Този подход на паралелен работен процес съкращава времето за прототип до 8–12 седмици от инженерното одобрение, в сравнение с индустриалната норма от 16–20 седмици. Когато вашето приложение изисква специализирано решение, ние можем да преминем от концепция до валидиране във вода за по-малко от три месеца.</p>

  <h2>Възможности на работилницата</h2>
  <table>
    <thead><tr><th>Работно място</th><th>Оборудване</th><th>Предназначение</th></tr></thead>
    <tbody>
      <tr><td>Изработка на корпус</td><td>CNC машина за рязане на тъкан, преса за топлинно ламиниране, станция за подготовка на Drop-Stitch сърцевина</td><td>Производство на корпуси в реален мащаб и при трите типа конструкция</td></tr>
      <tr><td>Сглобяване на бордове и камери</td><td>RF прес за заваряване, станция за предварително фиксиране с горещ въздух, стенд за изпитване чрез надуване</td><td>Изработка на полноразмерни възли на бордове и камери с всички прегради и вентили</td></tr>
      <tr><td>Такелаж и обзавеждане</td><td>Шаблон за фрезоване на гнезда за перки, fixture за заваряване на крепежи за багаж и дръжки, станция за рязане на палубни подложки</td><td>Пълно обзавеждане: перки, крепежи за багаж, отвори за поводи, дръжки, палубни подложки, вентили</td></tr>
      <tr><td>Отсек за инструментация</td><td>GPS датчик за скорост, датчици за налягане, акселерометри, термодвойков масив, регистратор на данни</td><td>Инсталиране и калибриране на инструментацията за морските изпитвания</td></tr>
    </tbody>
  </table>

  <h2>Пътят на прототипа — стъпка по стъпка</h2>
  <ol>
    <li><strong>Инженерно предаване</strong> — Дизайн пакетът (3D модел, FEA доклад, спецификация на материалите, план на пластовете) се преглежда официално от ръководителя на работилницата и проектния инженер. Всяки производствени съображения се отбелязват и разрешават, преди да започне рязането.</li>
    <li><strong>Производство на корпуса</strong> — Корпусът се изгражда съгласно инженерната спецификация. При еднослойна конструкция: Drop-Stitch сърцевината се ламинира с определения PVC външен слой. При двуслойна конструкция: допълнителният слой се нанася върху основния ламинат, преди шаблонът да бъде изрязан. При слепена конструкция: параметрите на ламиниране се зареждат от одобрения технологичен лист и се проверяват върху първи контролен образец.</li>
    <li><strong>Изработка на бордовете</strong> — Тъканта се рязе с CNC шаблони, след което се RF заварява в полноразмерни бордове и камери. Всяка камера се надува до изпитвателно налягане и се оставя за 24 h за първоначална стабилизация.</li>
    <li><strong>Сглобяване и такелаж</strong> — Корпусът и бордовете се съединяват. Гнездата за перки и крепежите за багаж се монтират, отворите за поводи и дръжките за носене се инсталират, вентилът за надуване се навива с определен момент, а палубната подложка се поставя и изравнява.</li>
    <li><strong>Статични изпитвания</strong> — Преди дъската да докосне вода, тя преминава през: проверка на плавателността (пълно натоварване + 30 % резерв), изпитване на задържане на налягането в камерите, изпитване на изтичане през вентила, изпитване на опън на дръжките и крепежите.</li>
    <li><strong>Програма за морски изпитвания</strong> — 20 часа изпитвания във вода, описани подробно по-долу.</li>
    <li><strong>Преглед на прототипа</strong> — Провежда се официално заключително съвещание с екипите по инженеринг, производство и качество. Всички необходими промени в дизайна се документират и вграждат в производственото одобрение.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-часова програма за морски изпитвания — График</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Привикване в спокойна вода — следене и завиване при ниска скорост, проверка на стойката и балансирането</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Изпитване на скоростта — максимална скорост, потвърдена с GPS, круизна скорост, устойчиво темпо при 3 темпа на гребане</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Изпитване на завиването — радиус на завиване на пети и с дъгово гребане, реакция на дъската налево и надясно</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Изпитване в вълнение — многократни преминавания през вълнение от 0,5–1,0 m; акселерометър на позицията на ездача</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Изпитване на стабилността — статичен наклон на борда с 4 ездачи с различно тегло, изместен товар към десния борд</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Изпитване на издръжливостта — 3 h непрекъснато при круизно темпо; наблюдение на налягането в камерите, температурата на бордовете и умората на ездача</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Финална инспекция — следизпитвателна проверка на всички компоненти, затегляне/проверка на всички крепежи, документиране на констатациите</span>
      </div>
    </div>
  </div>

  <h2>Персонализирано прототипиране за уникални приложения</h2>
  <p>Работилницата за прототипи е мястото, където решаваме проблеми, които стандартните производствени дъски не могат да адресират. Скорошни примери включват:</p>
  <ul>
    <li>Високо видима спасителна SUP дъска за организация за издирване и спасяване, изискваща интегрирани дръжки за хващане, крепежи за спасително оборудване и корпус с висока плавателност за спасяване на пострадали — изцяло прототипирана, оборудвана и изпитана в нашето предприятие.</li>
    <li>Експедиционна туристическа SUP дъска за изпълнител на хидрографски проучвания, със сваляна мачта за инструменти, херметически затворени отвори за оборудване и ниско профилно крепление за транзистор, проектирано да намали съпротивлението.</li>
    <li>Компактна SUP дъска за риболов за флот на курорт, при която прототипът беше използван за валидиране на стабилността, такелажа на оборудването и издръжливостта при ежедневна употреба под наем, преди клиентът да се ангажира с флот от четири дъски.</li>
  </ul>

  <h2>Нашият екип за прототипиране</h2>
  <p>В работилницата работят осем морски техници с широк профил, всеки от които е обучен кросно в поне две от трите основни дисциплини (корпус, бордове, такелаж). Ръководителят на екипа е майстор-изпълнител с 16 години опит — от персонализирани единични изработки до производствени серии. За всеки прототип се определя отделен проектен инженер, който служи като единна точка за контакт с клиента през целия процес на изграждане и изпитване.</p>

  <h2>Участие на клиента</h2>
  <p>Активно насърчаваме нашите клиенти да присъстват на ключовите етапи по време на изграждането на прототипа — по-специално на първоначалния преглед на обзавеждането и на морските изпитвания. Вашата оперативна обратна връзка на тези етапи е безценна за фина настройка на дъската, преди да навлезе в производство. Ние не изграждаме в изолация; ние изграждаме в партньорство с вас.</p>
  <p>20-часовото морско изпитване също е възможност вашият екип да се запознае с управлението на дъската, разположението на палубата и изискванията за поддръжка, което осигурява плавен преход към експлоатация при доставката на производствените дъски.</p>


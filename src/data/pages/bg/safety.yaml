certifications:
  - title: 'Сертификация CE'
    description: 'Цялото спасително оборудване afarer съответства на изискванията за маркировка CE съгласно Европейския регламент за лични предпазни средства (ЕС) 2016/425.'
  - title: 'Сертификация ISO 12402'
    description: 'Спасителните жилетки отговарят на стандартите за плавателност ISO 12402. Класическата спасителна жилетка осигурява 50N+ плавателност; професионалната спасителна жилетка отговаря на изискванията на SOLAS с автоматично надуване.'
  - title: 'Съответствие с SOLAS'
    description: 'Професионалната спасителна жилетка съответства на регламентите SOLAS (Безопасност на човешкия живот в морето) за офшорни и търговски морски операции.'


meta:
  title: 'Оборудване на фабриката — рязане, RF заваряване и печат | {SITE}'
  description: 'Индустриално оборудване на afarer: рязане на PVC, RF заваряване, цифров печат, сглобяване и изпитвания за надуваеми SUP дъски.'
  keywords:
    - 'оборудване за производство на sup'
    - 'фабрика за надуваеми sup'
    - 'rf заваряване на pvc'
    - 'производство на дъски за гребане'
hero:
  tagline: 'Оборудване'
  title: 'Производствено оборудване и машини'
  subtitle: 'Индустриално оборудване за рязане, заваряване, печат и сглобяване'
  back_label: 'Обратно към фабриката'
  back_link: /factory/

categories:
  - title: 'Рязане и подготовка на материали'
    items:
      - name: 'Автоматична машина за рязане на PVC'
        spec: 'CNC управлявана, 6,5 m × 2,5 m, точност 0,1 mm'
        desc: 'Компютърно управлявана автоматична машина за рязане на PVC и Drop-Stitch тъкани. Софтуерът за вложка оптимизира използването на материала до под 5% отпадъци.'
      - name: 'Разпъвач на тъкан'
        spec: 'максимална ширина 3 m, подаване с контролирано напрежение'
        desc: 'Поставя тъканта в един или няколко слоя с контролирано напрежение, за да предотврати деформации преди рязането.'

  - title: 'Заваряване и слепване на тръби'
    items:
      - name: 'Машина за топлинно запечатване'
        spec: 'заваряване с горещ въздух, вариращо 200–600 °C, 0,5–5 m/min'
        desc: 'Машина за топлинно запечатване с горещ въздух за слепване и заваряване на PVC и бордови шевове. Използва се за предварително фиксиране, запечатване и свързване на тръбни камери и съединения на поплавъци.'
      - name: 'Диелектрична RF преса'
        spec: '15 kW, плоча 2000 × 600 mm'
        desc: 'Преса за заваряване с радиочестота за основните надлъжни шевове, бордовите ленти и изработката на големи камери.'
      - name: 'CNC управляван RF заваръч'
        spec: '8 kW, XY маса 2500 × 1200 mm'
        desc: 'Програмируемо заваряване на извити шевове за сложни геометрии, релефни лого и прецизна кръпка работа.'

  - title: 'Производство на SUP дъски'
    items:
      - name: 'Преса за ламиниране на Drop-Stitch сърцевини'
        spec: 'преса с голям формат за сърцевини на дъски до 14 фута LOA'
        desc: 'Прецизно ламиниране на Drop-Stitch сърцевини към външни PVC ламинати. Всеки слой е свързан под налягане за последователно качество и якост.'
      - name: 'CNC фрезов станок (5 оси)'
        spec: 'работно пространство 3 m × 2 m × 1 m, водно охлаждан вретен'
        desc: 'Обработка на гнезда за перки, отвори за дръжки и персонализирани компоненти на дъски.'

  - title: 'Печат и декорация на SUP'
    items:
      - name: 'Цифров принтер'
        spec: 'висока резолюция струен печат, ширина на печата до 2 m'
        desc: 'Дигитален печат директно върху тъкан за пълноцветни палубни графики на SUP. Отпечатва персонализирани шарки, градиенти и изображения с фото качество с UV-устойчиви водни мастила.'
      - name: 'Машина за шелкография'
        spec: 'ръчна и полуавтоматична, многоцветна регистрация'
        desc: 'Шелкография за лого на SUP дъски, маркови знаци и повтарящи се шарки. Осигурява трайни, плътни отпечатъци с наситени цветове.'

  - title: 'Сглобяване и такелаж'
    items:
      - name: 'Станция за сглобяване на дъски'
        spec: 'модулна регулируема, многопосилно разположение'
        desc: 'Сглобяване на гнезда за перки, дръжки, D-пръстени, вентили и палубни подложки върху SUP дъските.'
      - name: 'Преса за монтиране на вентили'
        spec: 'пневматична, регулируемо налягане'
        desc: 'Прецизно монтиране и запечатване на вентили Halkey-Roberts и Leafield.'
      - name: 'Ламинатор за палубни подложки'
        spec: '3 m × 1,5 m, с контрол на температурата'
        desc: 'Топлинно ламиниране на EVA палубни подложки към горната част на SUP дъските с постоянна якост на слепването.'

  - title: 'Изпитвания и контрол на качеството'
    items:
      - name: 'Универсален тестер за опън'
        spec: '50 kN, ASTM D751'
        desc: 'Изпитване на разривна сила, удължаване при скъсване и разпространение на разкъсване за партиди тъкани.'
      - name: 'Стенд за изпитване на задържане на въздух'
        spec: 'програмируем, 30-минутно задържане на налягане'
        desc: 'Автоматизирано изпитване на задържане на налягане за всяка тръбна камера преди сглобяване.'
      - name: 'Тестер за отлепване на шевове'
        spec: 'моторизирано отлепване на 180° при 100 mm/min'
        desc: 'Изпитване на якостта на отлепване на заварени и слепени шевове съгласно EN ISO 25649.'
      - name: 'Камера за стареене с ксенонова дъга'
        spec: '2000 h излагане'
        desc: 'Изпитване на UV устойчивост за промяна в цвета и запазване на якостта.'


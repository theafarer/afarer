how_to_choose:
  title: 'Как да изберете правилния размер'
  cards:
    - title: 'SUP дъски'
      description: 'Изберете дължина според вашето тегло и предназначена употреба. По-широките дъски (32"+) предлагат повече стабилност. По-дългите дъски (11–12 фута) следят по-добре за туризъм. По-тежките гребци се нуждаят от дъски с по-висок обем.'
    - title: 'Туристически SUP'
      description: 'По-дългите дъски (11–12 фута) са най-подходящи за покриване на разстояния и туризъм. По-широките дъски (32"+) предлагат повече стабилност. Проверете товароносимостта за общото натоварване, включително оборудването.'
    - title: 'Универсални SUP'
      description: 'Изберете дължина според теглото на ездача и предназначената употреба. Универсалните дъски служат за отдих, фитнес и йога. По-малките дъски са по-маневрени.'

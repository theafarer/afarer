categories:
  inflatable: Надуваеми SUP дъски, проектирани за преносимост без компромис с производителността. Съобразете правилния размер с вашето тегло и стил на гребане.
  sup: Дъски за стоене прав върху вода за туризъм, йога, фитнес и рекреативно гребане. Изберете по дължина и тегло на ездача.
  accessory: Аксесоари и спасително оборудване в допълнение към вашата SUP дъска. Универсални размери с множество опции.

  tagline: 'Казуси'
  title: 'Реални проекти, реални резултати<br />— afarer в действие'
  subtitle: 'Вижте как afarer си партнира с дистрибутори, марки и оператори по целия свят, за да доставя персонализирани морски решения за всяко приложение.'

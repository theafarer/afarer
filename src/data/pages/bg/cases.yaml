features3_cases:
  tagline: 'Представени казуси'
  title: 'Персонализирани решения<br />за реални предизвикателства'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Флотилия на европейски център за гмуркане'
      customer: 'BlueMed Diving Centers'
      country: 'Гърция'
      industry: 'Гмуркане и морски туризъм'
      challenge: 'Изискваха се 12 SUP, конфигурирани за гмуркане, за верига от центрове за гмуркане на няколко гръцки острова. Всяка дъска трябваше да има персонализирани крепления за оборудване, място за съхранение на 8 бутилки и стабилна платформа за влизане на водолази в открита вода. Флотилията трябваше да пристигне в рамките на 60 дни за началото на туристическия сезон.'
      solution: 'Произведохме 12 модела SUP Voyager Dive с вградени стойки за оборудване, стабилни платформи и екстра широка Drop-Stitch конструкция за стабилност при качване. Всяка дъска беше брандирана с ливреята на флотилията на клиента. Всичките 12 дъски бяха изпитани под налягане и експедирани от Циндао в рамките на 55 дни.'
      product: 'SUP Voyager Dive'
      results: 'Всичките 12 дъски бяха доставени навреме за туристическия сезон. Флотилията е в ежедневна експлоатация от 18+ месеца без нито един материален дефект. Клиентът поръча 6 допълнителни единици през втората година.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive е гръбнакът на нашите ежедневни операции по гмуркане. Стабилността е отлична, а подредбата за съхранение на оборудването поддържа палубата чиста и безопасна за нашите гости.'
      icon: tabler:lifebuoy
    - title: 'Програма за съвместна марка с австралийски дистрибутор'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Австралия'
      industry: 'Програма за съвместни марки и партньорства'
      challenge: 'Австралийски дистрибутор се нуждаеше от гама SUP дъски под собствена марка на конкурентни цени, за да се конкурира с китайските марки, продаващи директно на потребителите. Изискваха се 8 уникални модела, обхващащи от начинаещи до напреднали, с персонализирани графики, персонализирани опаковки и дропшипинг изпълнение до търговските обекти.'
      solution: 'Разработихме 8 SUP модела (универсален, туристически, йога, детски, спортен, ултракомпактен, ултрастабилен, за бързи води) с ексклузивен австралийски графичен пакет. Персонализирани търговски опаковки с QR кодове, водещи към видеа за настройка. Дропшипинг логистиката беше конфигурирана от Циндао директно до австралийските търговски магазини.'
      product: 'Персонализирана SUP линия (8 модела)'
      results: 'От концепцията до първата пратка за 90 дни. Процент на продаваемост на едро от 85% през първия сезон. Дистрибуторът разшири партньорството с допълнителни SUP модели през втората година.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer достави пълна SUP линия за 90 дни — от първоначалния дизайн до търговската зала. Качеството съответства на марки, продавани на два пъти по-висока цена.'
      icon: tabler:currency-dollar
    - title: 'Доставка на спасително оборудване за Близкия изток'
      customer: 'Национална агенция за гражданска защита'
      country: 'Обединени арабски емирства'
      industry: 'Издирване и спасяване'
      challenge: 'Организация за гражданска защита се нуждаеше от 20 патрулно готови SUP за крайбрежно издирване и спасяване, пристанищна охрана и реагиране при наводнения. Изискваха се дъски с висока видимост, пълно спасително оборудване и съответствие с местните морски разпоредби.'
      solution: 'Доставихме 20 модела SUP Patrol с високо видима оранжева Drop-Stitch конструкция, пълни пакети за безопасност, рефлектираща лента SOLAS и подсилена конструкция. Всяка дъска беше CE сертифицирана и изпитана по приложимите стандарти. Пакетът документация включваше сертификати за съответствие за местна регистрация.'
      product: 'SUP Patrol'
      results: 'Флотилията е разположена в 5 крайбрежни станции. Дъските работят при екстремна жега (45°C+) без деградация. Представянето и издръжливостта надхвърлиха спецификациите.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol надхвърли нашите оперативни изисквания. При екстремни горещини дъските не показват признаци на UV деградация след 24 месеца ежедневно използване.'
      icon: tabler:alert-triangle
    - title: 'Европейско партньорство със съвместна марка'
      customer: 'North Sea Marine Equipment BV'
      country: 'Нидерландия'
      industry: 'Програма за съвместни марки и партньорства'
      challenge: 'Утвърдена европейска морска марка искаше да навлезе в пазара на SUP, без да инвестира в производствени мощности. Нуждаеше се от партньор за бяла марка, способен да произвежда 5 SUP модела (от 9 до 12 фута) с частно брандиране, CE сертифициране и изключителни права за дистрибуция в ЕС.'
      solution: 'Установихме споразумение за производство под бяла марка за 5 SUP модела. Всеки модел беше брандиран с логата и цветовата схема на клиента. Подготвена беше CE документация за всеки модел. Предоставени бяха изключителни права за дистрибуция в ЕС с минимални ангажименти за поръчки. Предоставена беше техническа документация за локалната сервизна мрежа.'
      product: 'Персонализирана SUP линия (5 модела)'
      results: 'Подписано многогодишно споразумение. Първата производствена серия от 50 броя беше експедирана в рамките на 75 дни. Марката беше представена на голям търговски изложение с положителен прием от дилърите.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Сътрудничеството с afarer ни позволи да влезем в пазара на SUP, без да строим фабрика — те доставиха пълно ключово решение с CE сертифициране и документация за дилърска поддръжка.'
      icon: tabler:building
    - title: 'Флотилия на карибски курорт'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Бахамски острови'
      industry: 'Морски туризъм и хотелиерство'
      challenge: 'Луксозен курорт се нуждаеше от пълна флотилия оборудване за водни спортове за активности на гостите: 40 SUP дъски за екскурзии с водач, 20 допълнителни SUP за изследване на лагуната, 10 SUP дъски за гостеви екскурзии, плюс аксесоари. Цялото оборудване трябваше да носи брандинга на курорта и да бъде доставено преди пиковия туристически сезон.'
      solution: 'Произведохме пълен SUP пакет: 40 дъски SUP Voyager (универсален модел), 20 дъски SUP Explorer, 10 дъски SUP Touring, плюс спасителни жилетки, гребла, помпи и ремонтни комплекти. Цялото оборудване беше отпечатано с логото и тропическата цветова схема на курорта. Контейнерна пратка с пълна описна листовка.'
      product: 'Пълен SUP пакет (70+ единици)'
      results: 'Флотилията пристигна 6 седмици преди пиковия сезон. Оценките на гостите за водните спортове се повишиха с 40% спрямо предходната година. Оборудването издържа 3 сезона само с рутинна поддръжка.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Подходът с пълен пакет означаваше, че получихме всичко необходимо в една пратка — дъски и аксесоари, всички брандирани и готови за използване от гостите. Нашите гости оценяват качеството на оборудването.'
      icon: tabler:beach
    - title: 'Договор за крайбрежен патрул в САЩ'
      customer: 'Atlantic Coastal Security Agency'
      country: 'Съединени щати'
      industry: 'Морска сигурност и правоприлагане'
      challenge: 'Американска агенция за крайбрежна сигурност изискваше патрулни SUP за тежки условия при операции на открита вода. Нуждаеха се високоефективни дъски с оборудване по военни спецификации и съответствие с разпоредбите на Бреговата охрана на САЩ.'
      solution: 'Проектирахме SUP Patrol с подсилена Drop-Stitch конструкция, цветови схеми с висока видимост, крепления за шифрована комуникационна апаратура и интегрирани точки за закрепване на оборудване. Дъските са подсилени за тежки операции. Предоставена беше документация за съответствие с USCG.'
      product: 'SUP Patrol'
      results: 'Агенцията докладва 95% готовност за мисии през първите 12 месеца. Направена е допълнителна поръчка за 8 броя.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol дава на нашите екипажи представянето, необходимо за операции на открита вода. Подсилената конструкция осигурява критична издръжливост, без да се жертва управляемостта.'
      icon: tabler:shield

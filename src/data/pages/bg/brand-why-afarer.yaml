features3_reasons:
  tagline: 'Защо да изберете afarer'
  title: 'Седем причини да партнирате с нас'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Реално производство, не търговия'
      description: 'Притежаваме и управляваме фабрика с площ 12 000 m². Когато партнирате с afarer, работите директно с хората, които проектират, разработват и изграждат вашите продукти — без посредници.'
      icon: tabler:building-factory
    - title: '2. Подход, воден от инженеринга'
      description: 'Нашият дизайнерски процес започва от случая на употреба, а не от продуктовата категория. Оптимизираме формата на корпуса, избора на материали и конфигурацията според това как реално ще се използва дъската.'
      icon: tabler:engine
    - title: '3. Сертифицирано качество'
      description: 'Сертифицирано по CE, качество по ISO, съответствие с BSCI, REACH, одобрено от USCG. Всеки продукт отговаря на международните стандарти — не просто твърдения.'
      icon: tabler:certificate
    - title: '4. Гъвкава съвместна марка'
      description: 'Цветове на бордовете, разположение на палубата, брандиране, опаковка — персонализираме според вашите спецификации. Без натиск за минимална поръчка. Започнете с прототип, разраствайте се с увереност.'
      icon: tabler:adjustments
    - title: '5. Глобална логистика'
      description: 'Американски склад в Калифорния, директни доставки от Циндао, въздушен транспорт за спешни поръчки. Ние се грижим за митническите документи и документацията.'
      icon: tabler:truck-delivery
    - title: '6. Доживотна поддръжка'
      description: 'Поддържаме дъски, изградени преди 20 години. Оригинални резервни части, технически съвети, насоки за ремонт — нашият екип е на разположение, когато имате нужда от нас.'
      icon: tabler:lifebuoy
    - title: '7. Честни спецификации'
      description: 'Реални товарни класи, реални размери, реално тегло. Без маркетингови надувания. Това, което публикуваме, е това, което получавате — потвърдено от независими изпитвания.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Доверие от марки по целия свят'
  title: 'Какво казват нашите партньори'
  items:
    - content: 'Работили сме с няколко производители в Китай, но afarer се откроява с инженерната си поддръжка и последователното си качество. Отнасят се към нашата марка като към тяхна собствена.'
      name: '— Партньор със съвместна марка, европейска марка за водни спортове'
    - content: 'Техните SUP дъски са в експлоатация в нашия флот от над 5 години. Минимална поддръжка, отлична UV устойчивост. 5-годишната гаранция ни дава увереност.'
      name: '— Оператор на флот, курортна група в Близкия изток'
    - content: 'Екипът на afarer ни помогна да разработим персонализиран дизайн на SUP дъска от концепция до производство за 90 дни. Качеството надмина очакванията ни.'
      name: '— Дистрибутор, австралийски водни спортове'

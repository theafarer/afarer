intro: 'Често срещано погрешно схващане е, че хидродинамичните изпитвания са запазени за океански кораби. В действителност представянето на малък глисиращ корпус — като надуваема SUP дъска — зависи от подводната форма точно толкова, колкото танкерът от своя булб. Ъгълът на диферента, омокрената площ, образуването на пръски и вентилацията оказват драматично влияние върху плъзгането, скоростта и комфорта на возене. В Afarer работим със специализиран хидродинамичен опитен басейн, който ни позволява да количествено оценим тези ефекти в мащаб на модел — преди да вложим плат и инструменти в прототип в реален размер.'

content_html: |
  <h2>Защо да изпитваме дъска за гребане в басейн?</h2>
  <p>Изпитванията в мащаб на модел (обикновено 1:3 до 1:5) ни дават възможност бързо и рентабилно да итерираме форми на корпуса. Седмица в басейна може да генерира същите данни за представяне, които биха изискали месеци проби и грешки в реален мащаб — и при част от разходите.</p>

  <h2>Спецификации на съоръжението</h2>
  <table>
    <thead><tr><th>Параметър</th><th>Спецификация</th></tr></thead>
    <tbody>
      <tr><td>Размери на басейна</td><td>35 м (дължина) × 3,5 м (ширина) × 1,8 м (дълбочина)</td></tr>
      <tr><td>Теглеща каретка</td><td>Електрическа със сервоуправление, макс. скорост 12 м/с (23 възела), точност на скоростта ± 0,5 %</td></tr>
      <tr><td>Вълногенератор</td><td>Клапен тип, програмируеми регулярни &amp; нерегулярни морски състояния, Hs до 0,3 м в мащаб на модела</td></tr>
      <tr><td>Измервателна апаратура</td><td>6-компонентен динамометър (съпротивление, странична сила, момент на въртене), акселерометри, инклинометри, вълнови сензори</td></tr>
      <tr><td>Събиране на данни</td><td>Дискретизация 1000 Hz на канал, екран в реално време + пакет за последваща обработка</td></tr>
      <tr><td>Изработка на модели</td><td>Собствено CNC фрезоване и 3D печат за корпуси на модели до 1,8 м LOA</td></tr>
    </tbody>
  </table>

  <h2>Нашата програма за изпитвания</h2>
  <p>Стандартна програма за разработка на корпус в нашия басейн следва тази последователност:</p>
  <ol>
    <li><strong>Изграждане на модела</strong> — Модел в мащаб 1:3,5 се обработва на CNC машина от високоплътна пяна и се покрива със стъклопласт за коравина. Теглото и центърът на тежестта се настройват да съответстват на състояние на пълно натоварване, мащабирано по Фруд.</li>
    <li><strong>Изпитвания за съпротивление</strong> — Моделът се тегли при 8–10 скорости, обхващащи работния диапазон. Общото съпротивление се измерва и се разлага на компоненти от триене и остатъчни по метода ITTC-1957.</li>
    <li><strong>Измерване на диферент &amp; потъване</strong> — Работният диферент и потъването се записват при всяка скорост. Целта е оптимален ъгъл на диферента 4–6° за глисиращи корпуси.</li>
    <li><strong>Изследване на вълновата диря</strong> — Напречните срезове на вълните се измерват при две скорости за оценка на вълнообразуващото съпротивление и откриване на напречни вълнови взаимодействия, които биха могли да предизвикат интерференция при кърмата.</li>
    <li><strong>Мореходност (по избор)</strong> — Пробеги срещу вълната и по вълната в регулярни вълни за измерване на допълнителното съпротивление, вертикалното ускорение и вероятността за удари.</li>
    <li><strong>Анализ на данни &amp; препоръки</strong> — Доставя се пълен доклад със сравнителни графики, криви скорост/мощност и конкретни дизайнерски препоръки за корпуса в реален мащаб.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Типични резултати от изпитване в басейна — съпротивление спрямо скорост (корпус на туристическа SUP, мащаб 1:3,5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Съпротивление в мащаб на модела (N) при скорости, мащабирани по Фруд. Прогнозата за съпротивлението в реален мащаб следва метода за прогнозиране на представянето ITTC-1978.</p>
  </div>

  <h2>Експертен екип</h2>
  <p>Нашият басейн се управлява от хидродинамик с докторска степен по флуидна механика и 8 години опит в опитни басейни в голям европейски морски изследователски институт. Той се подпомага от техник, който подготвя всички модели и апаратурата. Екипът спазва Препоръчителните процедури на ITTC (International Towing Tank Conference), за да гарантира, че всяко изпитване е възпроизводимо, проследимо и международно защитимо.</p>

  <h2>Изпитвания в басейна за разработка на персонализиран корпус</h2>
  <p>Нашият басейн се използва не само за корпуси от наш собствен дизайн — редовно изпълняваме програми за изпитвания за клиенти, които искат да валидират персонализирана форма на корпуса или да изследват проблем с представянето:</p>
  <ul>
    <li><strong>Сравнение на форми на корпуса</strong> — Две или повече кандидат-форми се изпитват при идентични условия, което осигурява обективно сравнение на съпротивление/скорост/стабилност, за да подкрепи вашия дизайнерски избор.</li>
    <li><strong>Оптимизация на приложените части</strong> — Конфигурации на перки, профили на ръбовете и варианти на рокера могат да се изпитват в различни комбинации за количествена оценка на индивидуалния им принос за намаляване на съпротивлението.</li>
    <li><strong>Изследване на ефективността на плъзгане</strong> — Данните за съпротивлението се преобразуват в крива на ефективността на плъзгане, което ви позволява да балансирате обема на корпуса, рокера и коравината за вашата целева скорост на гребане и товар.</li>
  </ul>

  <h2>Защо да изпитвате при нас?</h2>
  <p>Не ви даваме само набор от сурови числа. Нашите доклади превеждат данните от басейна в приложими инженерни препоръки: "Добавете 8 мм рокер на носа, за да намалите омокрената площ при круизна скорост", "Намалете рокера на кърмата с 3°, за да удължите водолинията при туристическа скорост" или "Преместете най-широката точка 150 мм към кърмата за по-добра курсова устойчивост". Напускате с ясно разбиране какво да промените и защо.</p>
  <p>Нашият басейн е наличен също за независими изпитвания от трети страни срещу заплащане. Ако разработвате корпус и искате непредубедена, професионално изпълнена хидродинамична оценка, очакваме вашето запитване.</p>


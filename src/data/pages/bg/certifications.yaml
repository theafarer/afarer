meta:
  title: 'Сертификати — CE, ISO 9001 и съответствие | {SITE}'
  description: 'Сертификати за качество на afarer: CE (EN ISO 25649), ISO 9001:2015, BSCI. Съответствие и безопасност за производител на надуваеми SUP.'
  keywords:
    - 'ce сертифициране sup'
    - 'iso 9001 sup'
    - 'морско съответствие'
    - 'сертифициране на дъски за гребане'
hero:
  tagline: 'Сертификати и стандарти'
  title: 'Сертификати за качество<br />и стандарти за съответствие'
  subtitle: 'Производството на SUP дъски afarer е сертифицирано по международни морски стандарти за безопасност, системи за управление на качеството и екологични разпоредби — CE, ISO 9001, UKCA, BSCI и REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'сертификати за качество на afarer и документация за съответствие'
content_certifications:
  tagline: 'Нашите сертификати'
  title: 'Сертифицирано качество,<br />признато в глобален мащаб'
  subtitle: 'Всеки продукт afarer е подкрепен от сертификати, които доказват нашия ангажимент към качество, безопасност и екологична отговорност.'
  items:
    - title: 'CE сертифициране'
      description: 'Всички продукти afarer съответстват на европейските изисквания за CE маркировка за плавателни съдове за отдих, гарантирайки спазването на стандартите за безопасност, здраве и опазване на околната среда.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Нашата система за управление на качеството е сертифицирана по ISO 9001:2015, обхващайки проектирането, производството и дистрибуцията на надуваеми плавателни съдове и морско оборудване.'
      icon: tabler:clipboard-check
    - title: 'UKCA маркировка'
      description: 'Продуктите, продавани на пазара в Обединеното кралство, носят UKCA маркировка, потвърждаваща съответствие с разпоредбите на Обединеното кралство за морско оборудване и лични плавателни съдове.'
      icon: tabler:shield
    - title: 'Съответствие с BSCI'
      description: 'afarer е одитирана по BSCI (Business Social Compliance Initiative), което доказва етични производствени практики, справедливи условия на труд и отговорност във веригата за доставки.'
      icon: tabler:heart-handshake
    - title: 'Съответствие с REACH'
      description: 'Всички материали, използвани в продуктите afarer, съответстват на регламента REACH на ЕС за химическа безопасност, гарантирайки липса на ограничени вещества в нашите PVC, EVA или компоненти.'
      icon: tabler:flask
    - title: 'Изпитвания на материали'
      description: 'Платовете се изпитват за якост на опън, съпротивление на разкъсване, UV деградация и поведение при ниски температури. Всяка производствена партида се подлага на извадкова проверка.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Стандарти на фабриката'
  title: 'Производствено съвършенство<br />— изградено по спецификация'
  subtitle: 'Нашият комплекс от 12 000 м² работи при строги протоколи за контрол на качеството на всеки етап от производството.'
  list:
    - 'Входящ контрол на материалите: Всички суровини — PVC плат, EVA пяна, лепила, крепежни елементи — се изпитват спрямо спецификациите, преди да влязат в производството.'
    - 'Междинен контрол на качеството: Всеки производствен етап има документирани контролни точки. Якостта на заварките, съответствието на шевовете, монтирането на клапаните и моментът на затягане се проверяват в потока.'
    - 'Изпитване под налягане: Всяка надуваема камера се изпитва под налягане при 1,25× номиналното за 24–48 часа. Спадът на налягането трябва да остане под 5% за положителна оценка.'
    - 'Финален контрол: Завършените продукти се проверяват за размерна точност, козметично покритие, пълнота на аксесоарите и цялост на опаковката преди експедиция.'
    - 'Проследяемост на партидите: Всеки продукт носи сериен номер, свързан с регистрите на производствената партида, което позволява пълна проследяемост от суровината до готовите стоки.'
content_safety:
  tagline: 'Морски стандарти за безопасност'
  title: 'Безопасността на първо място<br />— проектирано за надеждна работа'
  subtitle: 'Продуктите afarer са проектирани и изпитани да отговарят на международните морски стандарти за безопасност за търговска и рекреативна употреба.'
  items:
    - title: 'EN ISO 25649'
      description: 'Надуваемите SUP съответстват на стандартите EN ISO 25649 за конструкция, стабилност, плавателност и товароносимост.'
      icon: tabler:sailboat
    - title: 'Съответствие с SOLAS'
      description: 'Спасителното оборудване и спасителните средства отговарят на изискванията на SOLAS (Safety of Life at Sea), когато е приложимо.'
      icon: tabler:lifebuoy

meta:
  title: 'Custom Lab — Персонализирани надуваеми дъски за гребане | {SITE}'
  description: 'Персонализирани надуваеми дъски за гребане: дизайн по поръчка, лого, персонализирана форма и производство. SUP партньор под собствена марка, MOQ 50 броя, CE сертифицирано.'
  keywords:
    - 'производител на персонализирани дъски за гребане'
    - 'персонализирана надуваема sup'
    - 'дъска за гребане с лого'
    - 'надуваема sup под собствена марка'
    - 'производство на дъски за гребане'
hero:
  tagline: afarer Custom Lab
  title: Проектирайте своя собствена<br />SUP дъска
  subtitle: Партньор за персонализирани SUP, предлагащ съвместна марка, собствена марка и производство на дъски за гребане по поръчка за бизнеси по целия свят. От единичен прототип до пълни производствени серии.
  cta: Стартирайте вашия проект
  footer_link: /contact/

steps_section:
  tagline: Как работи
  title: От концепцията до производството
  subtitle: Четири стъпки от вашата идея до готов продукт, готов за морето.
  steps:
    - num: '01'
      title: Изберете вашата дъска
      desc: Изберете от нашите основни SUP модели — универсални, туристически, йога, спортни или детски. Определете размер, материал и цвят.
    - num: '02'
      title: Качете вашия дизайн
      desc: Изпратете ни вашето лого, художествено оформление или насоки за марката. Нашият дизайнерски екип подготвя дигитален проект.
    - num: '03'
      title: Преглед на AI макет
      desc: Вижте фотореалистичен AI-генериран макет на вашата персонализирана дъска, преди да започне производството.
    - num: '04'
      title: Производство и доставка
      desc: След одобрение вашата поръчка влиза в нашата производствена линия. Срокове за изпълнение от 30 дни.

services_section:
  tagline: Услуги
  title: Производствени услуги за глобални марки
  subtitle: Гъвкави модели на сътрудничество — от договорно производство до изграждане на марка с пълна услуга.
  items:
    - title: Производство със съвместна марка
      desc: Произвеждаме вашите дизайни по спецификация — вашата интелектуална собственост, вашите чертежи, вашите стандарти за качество. Пълна NDA защита.
      icon: ⚙️
    - title: Дизайнерски решения
      desc: Изберете измежду 50+ доказани платформи и персонализирайте размер, цвят, графики и опаковка.
      icon: '🎨'
    - title: Собствена марка
      desc: Вашата марка върху нашите продукти — лого, опаковка, етикети с връзки, наръчници. Готови за продажба директно от кутията.
      icon: '🎨'
    - title: Персонализирано брандиране
      desc: Печат на палубната подложка, графики по корпуса, деколи по тръбите и персонализирани етикети — пълна интеграция на марката.
      icon: ⚙️

capabilities_section:
  tagline: Възможности
  title: Възможности за производство и персонализация
  subtitle: Всичко, което трябва да знаете, преди да направите поръчката си.
  capabilities:
    - label: Обем на поръчката
      value: MOQ 50 броя (SUP)
    - label: Срок за изпълнение
      value: 30–45 дни стандартно; 15–20 дни за прототипи
    - label: Персонализация
      value: Размер, форма, цвят, графики, опаковка, крепежни елементи
    - label: Материали
      value: PVC, Drop-Stitch, EVA, алуминий
    - label: Печат
      value: Дигитален (CMYK), ситопечат, термопренос, сублимация
    - label: Сертифициране
      value: CE, UKCA, FCC (подкрепа за глобално съответствие)


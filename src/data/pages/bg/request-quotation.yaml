meta:
  title: 'Заявете оферта — OEM производство на SUP дъски | {SITE}'
  description: 'Заявете детайлна оферта за вашия проект за надуваеми SUP дъски. OEM/ODM производство, частен етикет или персонализирани флотилии — отговаряме в рамките на 2 работни дни.'
  keywords:
    - 'заявете оферта за sup'
    - 'оферта за oem дъска за гребане'
    - 'оферта от sup фабрика'
    - 'цена на надуваема sup'
hero_text:
  tagline: 'Получете оферта'
  title: 'Заявете оферта<br />за вашия проект'
  subtitle: 'Разкажете ни за вашите изисквания и нашият екип ще отговори с детайлна оферта в рамките на 2 работни дни.'
steps2_process:
  title: 'Как работи'
  subtitle: 'Четири прости стъпки от запитването до офертата.'
  items:
    - title: 'Стъпка 1: Изпратете вашите изисквания'
      description: 'Попълнете формуляра по-долу с вашия тип продукт, количество и спецификации. Колкото повече детайли предоставите, толкова по-точна ще бъде вашата оферта.'
      icon: tabler:file-text
    - title: 'Стъпка 2: Преглеждаме и съветваме'
      description: 'Нашият инженерен екип преглежда вашите изисквания и може да се свърже с вас за уточняване. Предоставяме препоръки за конфигурацията и опциите на продукта.'
      icon: tabler:users
    - title: 'Стъпка 3: Получавате вашата оферта'
      description: 'Получавате детайлна оферта, включваща единични цени, MOQ, срок на доставка, платежни условия и опции за транспортиране. Обикновено в рамките на 48 часа.'
      icon: tabler:currency-dollar
    - title: 'Стъпка 4: Мостра и производство'
      description: 'След приемане на офертата преминаваме към производството на мостра (ако е приложимо) или директно към серийно производство. Редовни актуализации през целия процес.'
      icon: tabler:building-factory
content_form:
  tagline: 'Формуляр за оферта'
  title: 'Разкажете ни за вашия проект'
  subtitle: 'Всички полета със * са задължителни.'
  contact_fields:
    firstName: 'Собствено име'
    lastName: 'Фамилно име'
    companyName: 'Име на компанията'
    email: 'Имейл'
  fields:
    - name: 'Продуктова категория'
      type: select
      options:
        - 'SUP дъска'
        - 'Надуваема SUP'
        - 'Надуваема SUP дъска'
        - 'Спасителна жилетка'
        - 'Морски аксесоар'
        - 'Персонализиран OEM/ODM'
    - name: 'Приложение'
      type: select
      options:
        - 'Център за гмуркане'
        - 'Риболов'
        - 'Морски туризъм / курорт'
        - 'Издирване и спасяване'
        - 'Държавни / военни'
        - 'OEM / частен етикет'
        - 'Лични / рекреативни цели'
        - 'Друго'
    - name: 'Количество'
      type: text
      placeholder: 'напр. 50 броя'
    - name: 'Целеви пазар'
      type: text
      placeholder: 'напр. Европа, Северна Америка, Близък изток'
    - name: 'Държава за доставка'
      type: text
      placeholder: 'напр. Италия, ОАЕ, САЩ, Австралия'
    - name: 'Предпочитание за материал'
      type: select
      options:
        - 'Без предпочитание'
        - 'PVC с морски клас (1100 dtex)'
        - 'Фибергласов корпус'
        - 'Алуминиев корпус'
    - name: 'Изискване за задвижване'
      type: text
      placeholder: 'напр. стандартна конфигурация с гребло, електрическа помпа, персонализирани цветове'
    - name: 'Необходима персонализация'
      type: text
      placeholder: 'напр. персонализирани цветове, брандиране/лого, опаковка, специални фитинги'
    - name: 'Срокове'
      type: text
      placeholder: 'напр. доставка в рамките на 90 дни'
    - name: 'Допълнителни изисквания'
      type: textarea
      placeholder: 'Опишете вашето приложение, техническите спецификации или всякакви специални изисквания — прилага и референтни чертежи, спецификации или линкове, ако има такива'
    - name: 'Качване на спецификация'
      type: file
      placeholder: 'Качете вашия технически лист, чертеж или референтен документ (PDF, DWG, DXF)'
    - name: 'Качване на лого / артворк'
      type: file
      placeholder: 'Качете вашето лого или артворк за персонализирано брандиране (AI, EPS, PNG)'
cta:
  title: 'Предпочитате да обсъдите по имейл?'
  subtitle: 'Изпратете вашето запитване директно на нашия търговски екип и ще отговорим в рамките на 24 часа.'
  actions:
    - variant: primary
      text: 'Пишете ни директно'
      href: /contact

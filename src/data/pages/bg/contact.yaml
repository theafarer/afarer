      description: Оферти, конфигурации, кандидатстване на дилъри и поръчки на едро.
      icon: tabler:shopping-bag
    - title: Техническа поддръжка
      description: Гаранция, ремонти, резервни части и въпроси за експлоатация.
      icon: tabler:tool
    - title: Преса и партньорства
      description: Прес пакети, спонсорство и индустриално сътрудничество.
      icon: tabler:news
    - title: Телефон
      description: +86 13305324192
      icon: tabler:headset
    - title: Имейл
      description: info@afarer.com
      icon: tabler:mail
    - title: Централа
      description: Икономическа зона за развитие, Лайси, Циндао, Китай, 266600
      icon: tabler:map-pin

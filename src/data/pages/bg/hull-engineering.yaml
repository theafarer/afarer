intro: 'Корпусът е гръбнакът на всяка надуваема SUP дъска. Той трябва да е достатъчно лек, за да се плъзга ефективно, достатъчно як, за да понася скалисти брегове, и достатъчно твърд, за да превръща всеки замах на греблото в движение напред. В Afarer нашето студио за корпусно инженерство съчетава напреднало CAD моделиране, анализ чрез крайни елементи (FEA) и десетилетия практически опит в дизайна на дъски, за да създава корпуси, оптимизирани за предназначената им дисциплина — а не генерични форми, адаптирани от каталог.'

content_html: |
  <h2>Мястото, където якостта среща хидродинамиката</h2>
  <p>Работим с три основни конструктивни платформи — подсилени Drop-Stitch PVC сърцевини, ръчно полагани фибергласови ламинати и ротационно формовани полиетилен — и разполагаме с инженерни възможности да проектираме, симулираме и валидираме всяка от тях на място.</p>

  <h2>Инструменти и стандарти за дизайн</h2>
  <p>Нашата цифрова инженерна среда включва:</p>
  <table>
    <thead><tr><th>Възможност</th><th>Софтуер / инструмент</th><th>Приложение</th></tr></thead>
    <tbody>
      <tr><td>3D параметрично моделиране</td><td>SolidWorks Professional</td><td>Повърхност на корпуса, подсилване на бордовете и надлъжните греди, разположение на палубата, точки за монтиране на оборудване</td></tr>
      <tr><td>Анализ чрез крайни елементи</td><td>ANSYS Mechanical и LS-DYNA</td><td>Картиране на напреженията, модален анализ, симулация на удари и сблъсъци</td></tr>
      <tr><td>Изчислителна флуидна динамика</td><td>Ansys Fluent / Star-CCM+</td><td>Прогнозиране на хидродинамичното съпротивление, оптимизиране на балансирането</td></tr>
      <tr><td>Ламинатно инженерство</td><td>ESAComp / CADEC</td><td>Подреждане на фибергласовите пластове, избор на сърцевина, оценка на теглото</td></tr>
      <tr><td>Симулация на потока в матрица</td><td>Moldex3D</td><td>Прогнозиране на дебелината на стената при ротационно формоване</td></tr>
    </tbody>
  </table>

  <h2>Нашият инженерен работен процес</h2>
  <p>Всеки дизайн на корпус, независимо дали е стандартен модел или изцяло персонализиран проект, следва строг пететапен процес:</p>
  <ol>
    <li><strong>Концепция и събиране на изисквания</strong> — Срещаме се с вас, за да определим теглото на ездача и полезния товар, скоростния диапазон, възможностите при различно състояние на водата, транспортните изисквания и всяко специално мисионно оборудване (палубни крепежи, позиции за привързване на багаж, интеграция на аксесоари).</li>
    <li><strong>3D повърхностно моделиране и хидростатично изчисление</strong> — Формата на корпуса се моделира в SolidWorks и се проверява за хидростатична стабилност, разпределение на обема и възстановителен момент чрез вградените аналитични инструменти.</li>
    <li><strong>Структурен FEA</strong> — Дефинират се случаи на натоварване: статични (ездач + оборудване), динамични (удари при кацане във вълни при 5g) и засядане (удар в скалист бряг при 3 m/s). Преглеждат се контурите на напреженията; коефициентът на безопасност ≥ 2,5 е задължителен.</li>
    <li><strong>CFD оптимизация на съпротивлението</strong> — Корпусът се симулира при три условия на натоварване и пет скорости. Потопената повърхност, ъгълът на накланяне и остатъчното съпротивление се намаляват итеративно.</li>
    <li><strong>Преглед и одобрение на дизайна</strong> — Целият инженерен пакет (3D модел, FEA доклад, CFD доклад, оценка на теглото, пластов документ) се преглежда от нашия старши инженер, преди да бъде предаден на работилницата за прототипи.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA разпределение на напреженията — корпус на туристическа SUP (подсилен Drop-Stitch)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Коефициент на безопасност при максимален товар</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Намаляване на съпротивлението спрямо предходното поколение</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Пиково налягане при удар (проектна граница)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Натрупано FEA изчислително време през 2025 г.</span>
      </div>
    </div>
  </div>

  <h2>Персонализация: вашият корпус, вашите правила</h2>
  <p>Няма двама гребци с еднакви изисквания. SUP дъската за риболов се нуждае от широк, стабилен глисиращ корпус; туристическата дъска — от водоизместващ корпус, максимизиращ плъзгането; сърф SUP дъската — от отзывчиви бордове и настроен рокер. Ние не вмъкваме вашето приложение в предварително съществуваща форма на корпуса. Проектираме възходящо от вашата спецификация.</p>
  <p>Примери за скорошни персонализирани корпусни инженерни проекти:</p>
  <ul>
    <li>Удължена туристическа SUP дъска за екотуристически оператор от Карибите, с подсилен нос за кацане на плажа (+15 % дебелина на бордовете).</li>
    <li>Високо видима патрулна SUP дъска за пристанищна власт, с интегрирани крепежи за оборудване и тактически бордове.</li>
    <li>Експедиционна туристическа SUP дъска за флот под наем, с подсилени бордове и допълнителни точки за привързване на багаж.</li>
  </ul>

  <h2>Нашите инженери</h2>
  <p>Студиото се ръководи от старши инженер с 14 години опит в дизайна на високопроизводителни дъски, подкрепен от двама машиностроителни инженери, специализирани в FEA и CFD. И тримата имат научни степени в морското или машиностроителното инженерство от международно признати университети. Екипът редовно публикува в специализирани издания и представя доклади на международни конференции по инженеринг на високопроизводителните гребни спортове.</p>

  <h2>Партнирайте с нас за следващия ви корпус</h2>
  <p>От първата скица на концепцията до финалния доклад за напреженията, нашето студио за корпусно инженерство е ваш партньор в създаването на дъска, която не е просто изградена — а инженерно проектирана. Инвестираме изчислителните часове симулации предварително, така че всеки заваръчен шев, всеки пласт ламинат и всяка извивка на корпуса да са там с причина.</p>
  <p>Независимо дали се нуждаете от малка модификация на съществуващ модел или от изцяло нов дизайн от чист лист, готови сме да обсъдим вашите изисквания.</p>


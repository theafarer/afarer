hero:
  tagline: 'Лайфстайл'
  title: 'Лайфстайлът<br />на afarer'
  subtitle: 'Създадено за онези, които живеят на водата — от седмичните изследователи до търговските оператори, които разчитат на своето оборудване всеки ден.'

values:
  - icon: 🌊
    title: 'Родени на водата'
    desc: 'Всеки дизайн започва с разбиране на това как се държи водата. Инженерстваме от ръба на условията навътре — защото океанът е нашият учител, а не нашето работно място.'
  - icon: 🔧
    title: 'Изградено да издържи'
    desc: 'Най-устойчивият продукт е този, който не се нуждае от подмяна. Материали с морски клас, Drop-Stitch сърцевини с номинално налягане 15 PSI и шевове, които надживяват сезона.'
  - icon: 🏆
    title: 'Достъпност чрез дизайн'
    desc: 'Водните спортове не бива да са лукс. Производителност с професионален клас на цена, която има смисъл за семейства, гидове и малки оператори — не само за търговски флотилии.'
  - icon: 🌍
    title: 'Глобална общност'
    desc: 'От крайбрежието на Циндао до езерата в Европа, реките в Югоизточна Азия и заливите в Америка — нашите клиенти споделят едно: любов към престоя на водата.'
  - icon: ♻️
    title: 'Отговорно производство'
    desc: 'CNC-оптимизираното подреждане намалява отпадъците от материал под 5%. Издръжливата конструкция намалява циклите на подмяна. Изграждаме за дълголетие, защото това е най-устойчивият избор.'
  - icon: 🤝
    title: 'Поддръжка, която продължава'
    desc: 'Двадесетгодишни корпуси все още ни звънят за резервни части. Нашият гаранционен отговор е средно 24 часа. Не изчезваме след продажбата — тук сме за целия живот на продукта.'


meta:
  title: 'B2B ресурси и изтегляния | {SITE}'
  description: 'Изтеглете наръчници за OEM производство, продуктови каталози, доклади за качество и калкулатори за ROI за бизнес с надуваеми SUP дъски.'

hero:
  tagline: 'Ресурсен център'
  title: 'Инструменти и ресурси<br />за SUP бизнес партньори'

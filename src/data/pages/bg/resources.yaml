resources:
  - title: 'Продуктов каталог OEM/ODM за 2026 г.'
    description: 'Пълна продуктова гама със спецификации, ценови нива, MOQ и опции за персонализация за B2B партньори.'
    icon: 'tabler:file-text'
    type: 'catalog'
    link: '/media'
    cta: 'Изтеглете каталога'
  - title: 'Наръчник за SUP марка с частен етикет'
    description: 'Стъпка по стъпка наръчник за стартиране на ваша собствена SUP марка — от пазарните проучвания и дизайна до производството и глобалната доставка.'
    icon: 'tabler:book'
    type: 'guide'
    link: '/news/private-label-sup-oem-guide'

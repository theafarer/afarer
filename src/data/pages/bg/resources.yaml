    type: 'report'
    link: '/evidence'
    cta: 'Вижте докладите'
  - title: 'Брошура за възможностите на фабриката'
    description: 'Виртуална обиколка на нашето производствено предприятие с площ 12 000 m² с детайли за производствените линии и процесите за контрол на качеството.'
    icon: 'tabler:building-factory'
    type: 'brochure'
    link: '/factory'
    cta: 'Обиколка на фабриката'
  - title: 'Наръчник за приходите от курортен флот'
    description: 'Анализ на ROI на търговски SUP флот с модели на ценообразуване, степени на използване и резултати от реални казуси от петзвездни курорти.'
    icon: 'tabler:chart-bar'
    type: 'guide'
    link: '/news/commercial-sup-fleet-roi-resorts'
    cta: 'Прочетете наръчника'


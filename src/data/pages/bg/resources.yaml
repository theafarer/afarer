    description: 'Оценете вашата инвестиция в SUP флот за курорт или клуб, прогнозираните приходи и периода на възвръщаемост с нашия интерактивен калкулатор.'
    icon: 'tabler:calculator'
    type: 'tool'
    link: '#roi-calculator'
    cta: 'Изчислете ROI'
  - title: 'Доклад за качество и сертификация'
    description: 'Документи за сертифициране по CE, управление на качеството по ISO 9001, резултати от UV стареене и данни от изпитвания на задържане на налягане.'

content_html: |
  <h2>Какво е сертифициране по CE?</h2>
  <p>Маркировката CE (Conformit&eacute; Europ&eacute;enne) показва, че продуктът отговаря на изискванията на ЕС за здраве, безопасност и околна среда. За надуваеми плавателни съдове приложимата регулаторна рамка зависи от продуктовата категория.</p>

  <h2>Приложими директиви</h2>

  <h3>Директива за плавателни съдове за отдих (2013/53/EU)</h3>
  <p>Основната директива за плавателни съдове за отдих в ЕС. Надуваемите SUP дъски под 2,4 m не попадат в обхвата ѝ и вместо това се сертифицират съгласно EN ISO 25649.</p>

  <h3>Регламент за лични предпазни средства (2016/425)</h3>
  <p>Спасителните жилетки, плавателните помощни средства и спасителното оборудване, доставяни с плавателните съдове, трябва да отговарят на изискванията на Регламента за PPE, включително типово изпитване (Модул B) от нотифициран орган и осигуряване на качеството на производството (Модул D или E).</p>

  <h2>Процесът на сертифициране</h2>
  <ol>
    <li>Класификация на продукта: Определяне на проектната категория на съда (A – D съгласно ISO 8666)</li>
    <li>Приложими стандарти: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (плочка на производителя)</li>
    <li>Подготовка на техническото досие: Конструкторски чертежи, спецификация на материалите, сертификати за материали, оценка на риска</li>
    <li>Типови изпитвания: Плавателност, стабилност, товароносимост, изпитване на материали, якост на шевовете, задържане на въздух</li>
    <li>Контрол на фабричното производство: Одит на производствените процеси от нотифициран орган</li>
    <li>Декларация за съответствие: Производителят подписва DoC и поставя маркировката CE</li>
  </ol>

  <h2>Нотифицирани органи за надуваеми плавателни съдове</h2>
  <p>Чести нотифицирани органи включват Bureau Veritas (Франция), DNV GL (Германия), RINA (Италия), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Германия).</p>

  <h2>Срокове и разходи</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Фаза</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Продължителност</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Типична стойност (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Подготовка на техническото досие</td><td class="p-3 border">2 – 4 седмици</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Типови изпитвания</td><td class="p-3 border">4 – 8 седмици</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Одит на фабриката</td><td class="p-3 border">1 – 2 дни (на място)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Общо (първи продукт)</td><td class="p-3 border">8 – 14 седмици</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Какво означава това за купувачите</h2>
  <p>При покупка на надуваеми SUP дъски, сертифицирани по CE, винаги проверявайте дали маркировката CE е върху плочката на производителя, дали съществува валидна DoC, дали е посочен номерът на нотифицирания орган и дали ръководството за потребителя включва инструкции за безопасност на вашия местен език. Всички продукти на Afarer носят сертификация по CE с пълна проследяемост до одитните доклади на нотифицирания орган.</p>


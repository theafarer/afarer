size_guide:
  tagline: Размер и спецификации
  title: Намерете правилния размер за вашите нужди
  desc: Сравнете размерите на SUP дъските, товароносимостта и препоръчаните употреби. Независимо дали ви е необходима туристическа SUP, йога дъска или универсална SUP — нашият наръчник за размери ви помага да изберете подходящата.
  link_label: 'Пълен наръчник за размери със спецификации на продуктите →'
  link: /size-guide/
  cards:
    - title: SUP дъски
      desc: Изберете дължина според вашето тегло и предназначената употреба. По-широките дъски (32"+) предлагат повече стабилност. По-дългите дъски (11–12 фута) се движат по-право при туризъм.
    - title: Туристически SUP
      desc: По-дълги дъски (11–12 фута) за покриване на разстояния и право движение. Достатъчно стабилни за туризъм с оборудване. Винаги проверявайте товароносимостта.
    - title: Универсални SUP
      desc: Изберете дължина според теглото на ездача и употребата. По-широки дъски (32"+) за стабилност. Универсални за отдих и фитнес.

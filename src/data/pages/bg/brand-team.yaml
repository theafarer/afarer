  title: 'Хората зад afarer<br />— инженерство за свобода на водата'
  subtitle: 'Основан през 2012 г. в Циндао, Китай, afarer е изграден от морски инженери, специалисти по материали и любители на водните спортове, които вярват в достъпността на професионалното надуваемо плавателно оборудване по целия свят.'

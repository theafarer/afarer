philosophy:
  tagline: 'Дизайн философия'
  title: 'Дизайн, воден от инженеринга<br />— всеки детайл има значение'
  subtitle: 'Нашата инженерна философия се центрира около три принципа, които водят всеки продукт, който изграждаме.'
  list:
    - 'Надеждността на първо място: Всеки продукт afarer е изпитан да устоява на реални условия — от операции за спасяване в студени води до наемане в тропически курорти. Прекалено надграждаме там, където е най-важно.'
    - 'Производствена прецизност: Нашите съоръжения използват CNC рязане, заваряване с висока честота и автоматизирани изпитвания под налягане. Всеки шев, всяка клапа, всяка скоба отговаря на документирани спецификации.'
    - 'Непрекъсната иновация: Нашият R&D екип непрекъснато оценява нови материали, производствени методи и подобрения в дизайна. Не чакаме проблемите — предвиждаме ги.'
cta:
  title: 'Искате да обсъдите проект с нашия екип?'

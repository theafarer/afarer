tests:
  - title: 'Изпитване под налягане'
    description: 'Надуваемите камери се подлагат на налягания, надхвърлящи препоръчаните работни граници, за продължителни периоди. Това проверява херметичността и конструктивната цялост на материала и шевовете, гарантирайки, че продуктът може да понесе предвидената употреба и потенциално надуване отвъд нормата, без повреди или течове.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Изпитване на удари'
    description: 'Продуктите се подлагат на контролирани удари с различни тежести и под различни ъгли. Това оценява съпротивлението на материала срещу пробиви, разкъсвания и повреди от сблъсъци с препятствия във водата, демонстрирайки издръжливост и дълготрайност.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'Изпитване на UV устойчивост'
    description: 'Мостри от материалите преминават през ускорено UV облъчване, симулиращо години агресивно слънце, след което отново се изпитват за запазване на якостта на опън и цветоустойчивост. Това потвърждава, че PVC съставите устояват на избеляване, мелеене и напукване, гарантирайки дълготрайност в слънчеви морски среди.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Изпитване на устойчивост на абразия'
    description: 'Мостри от материалите се търкат срещу абразивни повърхности за определен брой цикли при контролирано налягане. Това измерва способността на материала да устоява на износване от многократна употреба, контакт с пясък, скали или други повърхности, гарантирайки дълготрайност.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Изпитване на представяне при ниски температури'
    description: 'Продуктите се изпитват в студени среди за оценка на функционирането и издръжливостта при различни температурни условия, предотвратявайки сковаване или напукване в по-студени води. Незаменимо за дъски, предназначени за зимна употреба или във високи географски ширини.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Изпитване на плавателност и товароносимост'
    description: 'Продуктите се изпитват с различни тежести за определяне на максималната им товароносимост и гарантиране, че безопасно поемат потребители и оборудване. Товароносимостта на всеки модел се проверява преди пускането му на пазара.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Изпитване на маневреност'
    description: 'Продуктите се изпитват за реакцията си на гребане или моторно задвижване, като се оценява радиусът на завиване и лекотата на управление. Изпитвания на вода потвърждават, че реалното управление съответства на дизайнерските спецификации.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Изпитване за водонепропускливост'
    description: 'Напълно сглобените продукти се потапят или подлагат на водна струя за проверка на течове през шевовете, клапаните или материалите. Всяка дъска преминава задължителна проверка за водонепропускливост преди експедиция.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp


qc_section:
  tagline: 'Контрол на качеството'
  title: 'Процес на изпитвания и осигуряване на качеството'
  subtitle: 'Всяка дъска преминава задължителни изпитвания преди експедиция. Нашата лаборатория за качество работи независимо от производството и докладва директно на ръководството.'
  steps:
    - step: '1'
      title: 'Входящ контрол на суровините'
      desc: 'PVC и Drop-Stitch платовете преминават изпитвания на опън (ASTM D751), разкъсване и проверка на UV устойчивост, преди която и да е партида да влезе в производството.'
    - step: '2'
      title: 'Изпитване за задържане на въздуха за 24–48 часа'
      desc: 'Всяка тръбна камера се надува до 125% от номиналното налягане и се задържа 24–48 часа. Спад на налягането над 5% води до автоматично отхвърляне и повторна проверка на шевовете.'
    - step: '3'
      title: 'Изпитване на товар и баланс'
      desc: 'Завършените дъски се натоварват до максималния номинален капацитет и се изпитват за стабилност и жесткост. Всяка дъска се изпитва във вода преди финалния контрол.'

oem_section:
  tagline: 'OEM проекти'
  title: 'Казуси за партньорства с марки и OEM'
  subtitle: 'От концепцията до контейнера — как помагаме на глобални марки да стартират и разрастват своите линии за надуваеми SUP.'
  cases:
    - challenge: 'Европейски търговец на стоки за активна почивка се нуждаеше от линия SUP под собствена марка с уникални палубни графики, екологично PVC и опаковки, готови за търговска продажба — всичко доставено за 60 дни.'
      solution: 'Разработихме персонализирани файлове за дигитален печат, осигурихме PVC, съответстващо на REACH, и съкратихме изготвянето на мостри от 3 кръга на 1, като настаннихме дизайнерския екип в нашата фабрика в Циндао.'
      result: '55 дни от подписания PO до FOB. 2400 броя в 4 SKU. Повторна поръчка е направена, преди първият контейнер да пристигне.'
    - challenge: 'Американски стартъъп за водни спортове се нуждаеше от високоефективна Drop-Stitch SUP дъска с персонализирана форма, съвместно брандирана опаковка и BSCI сертифициране за разполагане в търговската мрежа.'
      solution: 'Адаптирахме съществуващ SUP калъп с изменен контур, разработихме артърк за съвместно брандирана опаковка и предоставихме пълна документация за BSCI одит.'
      result: 'Успешно разположени в 3 големи американски вериги за активна почивка. 5000+ броя през първата година с 98% процент на продаваемост.'
    - challenge: 'Австралийски дистрибутор изискваше CE-сертифицирана SUP гама с персонализирани цветове и съответствие с австралийските стандарти.'
      solution: 'Произведохме предпизводствени мостри в 4 цветови варианта и координирахме изпитвания за съответствие от независима страна.'
      result: 'SUP гама от 3 модела, стартирана на пазара в AU/NZ. Последвана от спечелена държавна обществена поръчка за 12 патрулни SUP.'

faq_section:
  tagline: 'Често задавани въпроси'
  title: 'Често задавани въпроси за B2B и OEM'
  questions:
    - q: 'Какво е минималното количество за поръчка (MOQ) за OEM надуваеми SUP дъски?'
      a: 'MOQ започва от 5–10 броя за стандартни OEM модели. Персонализираните калъпи и проектите под собствена марка изискват минимум 200 броя в зависимост от сложността. Пробни поръчки и мостри са налични за стартиране на нови марки.'
    - q: 'Има ли afarer BSCI сертифициране?'
      a: 'Да. Нашата фабрика поддържа валидно BSCI сертифициране за социално съответствие (одитният доклад е наличен при поискване). Притежаваме също ISO 9001 за управление на качеството и всички продукти носят CE сертифициране. Документацията за съответствие с REACH и RoHS се предоставя с всяка OEM пратка.'
    - q: 'Какъв е типичният срок за изпълнение на OEM поръчка?'
      a: 'Стандартният срок за изпълнение е 30–45 дни от потвърдения PO и депозит за серийно OEM производство. Разработката на персонализиран калъп добавя 15–20 дни за инструменти. Налично е ускорено производство за спешни поръчки и сезонни пикове. Прототипните мостри обикновено се експедират в рамките на 15–20 дни.'
    - q: 'Можете ли да доставите FOB Циндао или CIF до нашето пристанище?'
      a: 'Да. Доставяме FOB Циндао, CIF до големи глобални пристанища и DDP за квалифицирани партньори. Нашият логистичен екип управлява резервирането на контейнери, износната документация и митническото оформяне. Доставяме в 50+ държави в пазарите на ЕС, САЩ, AU и Азия.'

b2b_moq: 'Стандартен MOQ: 5–10 броя на модел. Пробните поръчки са добре дошли за нови партньорства.'

production_flow:
  tagline: 'Производствен поток'
  title: 'От материала до готовата дъска'
  subtitle: 'Всяка дъска преминава през 6 производствени етапа с контролни точки на всяка крачка. Без заобиколни пътища, без пропуснати проверки.'
  stages:
    - stage: '01'
      title: 'Приемане на материали и входящ контрол'
      description: 'Всички входящи материали се регистрират по номер на партида/лот в нашата ERP система. Рула PVC плат, Drop-Stitch центрове, клапани, лепила и крепежни елементи се поставят в карантина до одобрение от контрола на качеството.'
      qc_check: 'Якост на опън (ASTM D751), съпротивление на разкъсване (ISO 4674), измерване на дебелината, вискозитет на лепилото, визуален скенер за дефекти'
      qc_threshold: '100% от партидите се изпитват. Отхвърляне при опън < 90% от спецификацията, разкъсване под минималната спецификация или какъвто и да е визуален дефект'
      responsibility: 'Екип за входящ контрол (3 инспектори)'
    - stage: '02'
      title: 'CNC рязане и подготовка на материали'
      description: 'Компютърно оптимизираната разкройка подрежда панелите върху PVC платното, за да минимизира отпадъка. Автоматичните CNC машини за рязане поддържат позиционна точност 0,1 мм.'
      qc_check: 'Размерна проверка спрямо CAD DXF файлове, контрол на качеството на ръбовете, проверка на броя панели'
      qc_threshold: 'Всеки 20-и панел се измерва. Допуск ±0,5 мм. Партидата се отхвърля, ако >2% са извън допуска'
      responsibility: 'Ръководител на цеха за рязане'
    - stage: '03'
      title: 'Заваряване и свързване на Drop-Stitch'
      description: 'Drop-Stitch центровете се свързват с външните PVC ламинати чрез термично ламиниране. Тръбните камери се заваряват с RF или с горещ въздух. Бордовите ленти се спояват в три слоя.'
      qc_check: 'Тест на белене на всеки 50 броя (ASTM D751), измерване ширината на заварката, преглед на температурния дневник на горещия въздух, визуален контрол на шевовете под контражур'
      qc_threshold: 'Минимална якост на белене 8 N/cm. Допуск на ширината на заварката ±1 мм. Видими канали = отхвърляне'
      responsibility: 'Контрол на качеството при заваряване (2 инспектори на смяна)'
    - stage: '04'
      title: 'Монтаж и оборудване'
      description: 'Дъските преминават към окончателен монтаж, където всички компоненти се съединяват: ръбовете се лепят и заваряват, монтират се клапани, D-пръстени, дръжки, гнезда за перки и чанта за пренасяне. Всяка единица следва 100-точков монтажен контролен списък.'
      qc_check: 'Потвърждение на 100-точковия списък за всяка единица, функционален тест на клапана (10 цикъла отваряне/затваряне), проверка на момента на затягане на крепежите, визуален контрол'
      qc_threshold: 'Политика на нулеви дефекти за критичните за безопасността елементи (клапани, D-пръстени, дръжки). Незначителни козметични: AQL 2.5 (ISO 2859)'
      responsibility: 'Ръководител на монтажния екип + контрол по линията'
    - stage: '05'
      title: 'Изпитване под налягане и задържане за качество'
      description: 'Всяка камера се надува до 1,25× номиналното налягане (обикновено 20–25 PSI) и се задържа 24–48 часа. Датчиците на налягането водят непрекъснат запис. Камерите със спад на налягането над 5% се отхвърлят и се изпращат за повторна проверка на шевовете.'
      qc_check: 'Дневник на задържането под налягане 24–48 ч, ежедневна проверка на калибрацията на сензорите, температурно компенсирано отчитане на налягането, повторен тест на шевовете след ремонт'
      qc_threshold: 'Максимум 5% спад на налягането за 24–48 ч при стабилна температура. Всяка камера, надвишаваща това = 100% повторно изпитване на цялата производствена партида'
      responsibility: 'Лаборатория за качество (независима от производството, докладва на ръководството)'
    - stage: '06'
      title: 'Финален контрол и опаковане'
      description: 'Финален визуален и функционален контрол. Повърхностни дефекти, еднаквост на цвета, проверка на етикети/BIN, цялост на опаковката и пълнота на аксесоарите. Единиците се вакуумират, опаковат в кутии и палетизират за товарене в контейнери.'
      qc_check: 'Пълен визуален контрол, списък с аксесоари по SKU, тест на падане на опаковката (1 м, случайна извадка), проверка чрез сканиране на етикети/баркодове'
      qc_threshold: 'AQL 2.5 за големи дефекти, AQL 4.0 за малки. Нулева толерантност към дефекти, засягащи безопасността. 100% от единиците минават визуален контрол'
      responsibility: 'Финален екип за контрол на качеството (4 инспектори) + ръководител на екипа за опаковане'


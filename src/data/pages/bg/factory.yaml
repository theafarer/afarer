intro:
  - 'Като производственото звено на **Aquafarer LLC (САЩ)**, екипът на afarer в Циндао контролира всеки етап от производството — от пристигането на суровините PVC и фибростъкло до финалния контрол преди доставката на готовата дъска. Нашият производствен комплекс в Икономическата зона за развитие на Циндао обхваща 12 000 квадратни метра и включва специализирани цехове за рязане на PVC, термично запечатване на тръби, изработка на FRP калъпи, дигитален печат на SUP, окончателен монтаж и изпитвания на качеството.'
  - 'Чрез интегрирането на дизайн, инженеринг, прототипиране, производство и изпитвания под един покрив елиминираме неефективността на договорното производство и поддържаме директен контрол върху качеството на изработката, избора на материали и сроковете за доставка. Всяка дъска, която напуска нашия цех, е изработена от нашите хора, на нашето оборудване, според нашите стандарти.'


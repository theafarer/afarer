workshops_section:
  tagline: 'Цехове'
  title: 'Производствени цехове'
  workshops:
    - title: 'Рязане и подготовка на PVC'
      description: 'Автоматични CNC машини за рязане обработват PVC и Drop-Stitch платове с прецизност под милиметър. Компютърно оптимизираната разкройка минимизира отпадъка от материал и гарантира, че всеки панел отговаря на размерните спецификации преди заваряване.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Заваряване на тръби и термично запечатване'
      description: 'Специализиран цех за заваряване с машини за термично запечатване и RF диелектрични преси. Уредите за запечатване с горещ въздух свързват и спояват камерите на PVC тръбите, а RF заварките образуват високоякостни херметични шевове, надхвърлящи изискванията на EN ISO 25649.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'FRP калъпи и композитна изработка'
      description: 'Персонализирани FRP калъпи за SUP компоненти, изработени чрез ръчно полагане на фибростъкло с полиестерни и винилестерни смолни системи. Всеки слой се полага на ръка и се формова под вакуум за постоянно качество. Кабината за пръскане на гелкоут осигурява покритие с висок гланц, устойчиво на UV, за морски условия.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Печат и декориране на SUP'
      description: 'SUP дъските се декорират чрез дигитален печат за пълноцветни графики и ситопечат за лога и повтарящи се мотиви. Дигиталните принтери създават палубни дизайни с фотографско качество, а ситопечатът осигурява трайни, наситени брандови знаци.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Окончателен монтаж и оборудване'
      description: 'Монтажна линия, където Drop-Stitch центровете се завършват с бордови ръбове, поставят се EVA палуби и се монтират перки, клапани и аксесоари. Всяка дъска следва 100-точков монтажен контролен списък, потвърден от ръководителя на екипа.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Изпитвания и контрол на качеството'
      description: 'Всяка завършена дъска преминава задължителни изпитвания за задържане на въздуха, проверка на шевовете на белене и пълен системен контрол преди експедиция. Нашата лаборатория за качество работи независимо от производството и докладва директно на ръководството.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


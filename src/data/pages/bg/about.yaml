meta:
  title: 'За Afarer — марка за надуваеми SUP дъски и водни спортове | {SITE}'
  description: 'Afarer е глобална марка за надуваеми SUP дъски и водни спортове, управлявана от Aquafarer LLC (САЩ) и изградена от нашия екип в Циндао. Открийте нашата история, инженеринга, сертифицираното качество и програмите за национални партньори.'
  keywords:
    - 'марка надуваеми SUP дъски'
    - 'марка за водни спортове'
    - 'национален дистрибутор на sup'
    - 'колекции sup със съвместна марка'
hero:
  tagline: 'За нас'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'фабрика и работилница на afarer'
  title: |
    Морско инженерство, <br />
    изградено по <span class="text-accent dark:text-white">afarer</span> начина
  subtitle: 'Започнахме в крайбрежна работилница с една дъска и упорито убеждение: морските продукти трябва да се проектират така, сякаш имат значение, защото е точно така. Днес изпращаме продукти в над 40 държави, но всеки корпус все още минава през същите ръце, които основаха компанията.'


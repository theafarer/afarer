timeline:
  - year: '2012'
    title: 'Основите на морското производство'
    body: 'afarer започна като специализирана работилница за плавателни съдове в Циндао, Китай, отдадена на морския занаят и производството на плавателни съдове. Първоначалният фокус беше изграждането на надеждни надуваеми продукти чрез практически инженерен опит и производствена дисциплина.'
  - year: '2015'
    title: 'Първи износ и сертификация CE'
    body: 'Първите износни поръчки достигнаха Япония и Корея. Постигната бе сертификация CE за основните продуктови линии, което отбеляза навлизането на afarer на международните пазари. Компанията започна да обслужва търговски и рекреативни потребители извън Китай.'
  - year: '2018'
    title: 'Разширяване на фабриката'
    body: 'Преместихме се в производствено предприятие с площ 12 000 m². Добавихме линии за RF заваряване и капацитет за производство на Drop-Stitch, което позволи производство в по-голям мащаб и подобрени системи за контрол на качеството.'
  - year: '2020'
    title: 'Създаден център за R&D'
    body: 'Отворихме специализиран център за R&D с лаборатория за PVC тъкани, хидродинамичен изпитвателен басейн и студио за CAD/FEA симулации. Разработката на продукти се разшири с фокус върху леките конструкции, подобрената издръжливост и дизайна, ориентиран към потребителя.'
  - year: '2022'
    title: 'Сертификация и глобален растеж'
    body: 'Постигнахме сертификация ISO 9001. Разширихме се до 14 инженери в R&D и над 200 работници. Продуктите достигнаха клиенти в цяла Европа, Америка и Азиатско-тихоокеанския регион чрез партньорства с дистрибутори и съвместни марки.'
  - year: '2024'
    title: 'Студио за иновации и дизайн'
    body: 'Стартирахме студио за дизайн и иновации с пълно обслужване за персонализирани проекти със съвместни марки — от концепция до производство. Укрепихме професионалните морски приложения, включително спасителни, търговски и държавни поръчки.'
  - year: '2026'
    title: 'Изграждане на бъдещето на водните изследвания'
    body: 'Днес afarer продължава да разработва SUP системи и морски аксесоари — свързвайки хора и организации с водите на света. Обслужвани са над 50 държави, годишен капацитет над 15 000 броя.'

content_founding:
  tagline: 'Началото'
  title: 'Родени на края на водата'
  subtitle: 'afarer стартира в крайбрежна работилница в Циндао с една дъска и визия: да създава надуваеми плавателни съдове, способни да издържат на истински морски условия.'
  paragraphs:
    - 'През 2012 г. нашите основатели видяха празнота на пазара — повечето надуваеми плавателни съдове бяха или достъпни, но ненадеждни, или с високо качество, но непозволено скъпи. Те вярваха, че има място за производител, който предлага както качество, така и стойност.'
    - 'Първият корпус беше изграден на ръка, изпитан в местни води и усъвършенстван въз основа на реална обратна връзка от рибари и малки търговски оператори. Този цикъл — изграждай, изпитвай, слушай, подобрявай — остава в основата на нашата инженерна философия и днес.'
    - 'До 2015 г. славата се разпространи отвъд Циндао. Международни дистрибутори започнаха да искат мостри. Това, което започна като местна работилница, се превръщаше в глобален доставчик.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'ранна производствена работилница и производство на afarer'

content_growth:
  tagline: 'Растеж и иновации'
  title: 'От работилница до предприятие с площ 12 000 m²'
  subtitle: 'Постоянните инвестиции в хора, оборудване и процеси превърнаха afarer в модерно морско производствено предприятие.'
  paragraphs:
    - 'С нарастването на търсенето растеше и нашето предприятие. Разширихме се от малка работилница до фабрика с площ 12 000 m² с отделени производствени линии за SUP дъски и аксесоари.'
    - 'Инвестирахме в CNC машини за рязане, оборудване за заваряване с високочестотен ток, производствени линии за Drop-Stitch и изчерпателни изпитвателни стендове — което ни позволява да контролираме всеки аспект на производственото качество.'
    - 'Днес нашият екип от над 200 души включва морски инженери, специалисти по материали, експерти по контрола на качеството и опитни занаятчии — много от които са с afarer от ранните дни.'

philosophy:
  tagline: 'Философия на марката'
  title: 'Инженерна свобода върху водата'
  body: 'Свободата върху водата не е само движение. Тя представлява откриване на нови места, създаване на преживявания на открито, свързване на хората с природата и осъществяване на професионални мисии. Инженерството прави тази свобода възможна.'
  pillars:
    - title: 'Надеждността на първо място'
      body: 'Водната среда изисква доверие. Продуктите afarer са проектирани около стабилност, издръжливост, безопасност и постоянна производителност.'
    - title: 'Дизайн, ориентиран към човека'
      body: 'Продуктите трябва да служат на хората, а не на технологиите. Всяко дизайнерско решение започва с разбирането как хората използват плавателните съдове, къде се приключват и какви предизвикателства срещат.'
    - title: 'Достъпно приключение'
      body: 'Водата не бива да принадлежи само на експертите. afarer създава оборудване, което позволява на повече хора безопасно да се докоснат до реки, езера, океани и крайбрежни среди.'
    - title: 'Непрекъснати иновации'
      body: 'Иновацията не е само създаване на нови продукти. Тя е подобряване на всеки детайл — материали, конструкции, производство и потребителско преживяване.'

engineeringDna:
  tagline: 'Инженерна ДНК'
  title: 'Как afarer създава продукти'
  areas:
    - title: 'Наука за материалите'
      body: 'afarer се фокусира върху избора на подходящи материали за различни морски среди. Ключовите съображения включват устойчивост на износване, UV устойчивост, стабилност на налягането и дълготрайна издръжливост.'
      items: ['Устойчивост на износване', 'UV устойчивост', 'Стабилност на налягането', 'Дълготрайна издръжливост']
    - title: 'Конструктивно инженерство'
      body: 'Надуваемите плавателни съдове изискват прецизен баланс между твърдост, тегло, преносимост и стабилност. Инженерството на afarer се фокусира върху оптимизирането на тези фактори чрез основната технология Drop-Stitch и усъвършенстваната конструкция на шевовете.'
      items: ['Твърдост', 'Оптимизация на теглото', 'Преносимост', 'Стабилност']
    - title: 'Производствена прецизност'
      body: 'Всеки продукт преминава през контролирани процеси: подготовка на материалите, прецизно рязане, заваряване и слепване, сглобяване, инспекция на качеството и проверка на производителността.'
      items: ['Подготовка на материалите', 'Прецизно рязане', 'Заваряване и слепване', 'Сглобяване и контрол']
    - title: 'Инженерство по потребителски сценарии'
      body: 'Продуктите се разработват около реални приложения — отдих, приключения и професионална употреба — гарантирайки, че всеки дизайн отговаря на конкретните изисквания на предназначената среда.'
      items: ['Отдих', 'Приключение', 'Професионална употреба', 'Търговска употреба']


hero:
  tagline: 'Лаборатория за контрол на качеството'
  title: 'Изпитвателна лаборатория и осигуряване на качеството'
  subtitle: 'Независима лаборатория за качество с процеси по ISO 9001 — всяка единица се изпитва преди изпращане'

intro: 'afarer поддържа специализирана лаборатория за контрол на качеството, която работи независимо от производството. Всяка партида суровини и всяка завършена дъска преминава през документирани протоколи за инспекция, преди да бъде одобрена. Нашият екип за контрол на качеството докладва директно на ръководството, което гарантира безпристрастни качествени решения.'

highlights:
  - value: '100%'
    label: 'Изпитани на налягане единици'
    detail: 'Всяка камера, всяка дъска'
  - value: '24–48 h'
    label: 'Продължителност на изпитването на задържане на въздуха'
    detail: 'При 1,25× номинално налягане'
  - value: '&lt;5%'
    label: 'Максимално допустим спад на налягането'
    detail: 'През 24–48 часовия период на задържане'
  - value: 'AQL 2.5'
    label: 'Праг за основни дефекти'
    detail: 'Съгласно извадка по ISO 2859'

test_procedures:
  - title: 'Инспекция на суровините'
    description: 'Всяка входяща партида PVC, Drop-Stitch тъкан и фурнитура се изпитва преди приемане. Проверяват се якост на опън (ASTM D751), устойчивост на разкъсване (ISO 4674) и UV устойчивост. Несъответстващите материали се подлагат на карантина и се връщат.'
    standards:
      - 'ASTM D751 (опън)'
      - 'ISO 4674 (разкъсване)'
      - 'ISO 4892 (UV)'
  - title: 'Контролни точки по време на производството'
    description: 'Производствените оператори извършват самоинспекция на всеки етап. Одиторите за контрол на качеството провеждат случайни проверки през целия екип. Изпитвания на отлепване на заваръци се извършват на всеки 50 единици. Размерни проверки се правят на всеки 20-ти панел.'
    standards:
      - 'ASTM D751 (отлепване)'
      - 'Вътрешен 100-точков контролен списък'
      - 'Извадка по ISO 2859'
  - title: '24–48 часово изпитване на задържане на въздуха'
    description: 'Всяка тръбна камера се надува до 125% от номиналното налягане и се задържа 24–48 часа. Датчиците за налягане записват непрекъснато с температурна компенсация. Всяка камера, надвишаваща 5% спад на налягането, задейства автоматична повторна инспекция на партидата.'
    standards:
      - 'EN ISO 25649'
      - 'CE 2013/53/EU'
  - title: 'Изпитване на товар и баланс'
    description: 'Завършените дъски се изпитват при максимален номинален капацитет за стабилност и твърдост. Всяка дъска преминава изпитване във вода преди финалното одобрение на инспекцията.'
    standards:
      - 'ISO 12217'
      - 'CE 2013/53/EU'

equipment:
  - name: 'Универсална изпитвателна машина (опън)'
    spec: '5 kN, съответстваща на ASTM D751'
  - name: 'Тестер за спад на налягане'
    spec: 'многоканален, 0–50 psi, регистрация на данни'
  - name: 'Камера за UV стареене'
    spec: 'ISO 4892, цикли от 1,000 h'
  - name: 'Дебелиномер (цифров)'
    spec: 'резолюция 0,01 mm'
  - name: 'Тестер за отлепване (заварен шев)'
    spec: 'моторизиран, капацитет 50 N'
  - name: 'Температурна камера'
    spec: '-40 °C до +100 °C'
  - name: 'Резервоар за откриване на течове'
    spec: '6 m × 2 m, осветен'

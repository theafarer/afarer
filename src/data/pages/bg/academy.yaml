meta:
  title: 'Академия — наръчници за SUP и обучение по гребане | {SITE}'
  description: 'afarer Академия: наръчници за надуваеми дъски за гребане, техники на сърфа с гребло в изправено положение, морска безопасност и знания за материали за начинаещи и професионалисти.'
  keywords:
    - 'научете сърф с гребло в изправено положение'
    - 'наръчник за SUP за начинаещи'
    - 'основи на SUP дъската'
    - 'SUP техника'
    - 'SUP уроци'
hero:
  tagline: 'afarer Академия'
  title: 'Учебен център'
  subtitle: 'Наръчници и уроци за всяко ниво на умение — от основите на SUP до напреднали техники за спасяване'

categories:
  - level: 'Начинаещи'
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: 'Основи на SUP'
        desc: 'Научете основите на сърфа с гребло в изправено положение — стойка, техника на гребането и баланс.'
        slug: beginner-sup-guide
      - title: 'Техники на греблото'
        desc: 'Гребане напред, дъговидно гребане, притеглящо гребане и ниска опора — усъвършенствайте основните движения с греблото.'
        slug: sup-paddle-guide
      - title: 'Безопасността на първо място'
        desc: 'Основни практики за безопасност, включително проверка на времето, използване на спасителна жилетка, правила за повода и самоспасяване.'
        slug: sup-safety-guide
  - level: 'Средно напреднали'
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: 'Основи на туристическото каране'
        desc: 'Планиране на многочасови преходи — навигация, хидратация, темпо и четене на прогнозите за вятъра.'
        slug: touring-sup-guide
      - title: 'Четене на времето'
        desc: 'Тълкувайте морските прогнози, разпознавайте облачните форми и разберете ефекта на вятъра върху водата.'
        slug: weather-planning-water-sports
      - title: 'Основи на навигацията'
        desc: 'Четене на карти, работа с компас, GPS точки и планиране на маршрути за крайбрежно гребане.'
        slug: sup-navigation-guide
      - title: 'Осъзнатост за приливите'
        desc: 'Разбиране на приливно-отливните цикли, теченията и тяхното влияние върху времето за потегляне и избора на маршрут.'
        slug: understanding-tides
  - level: 'Напреднали'
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: 'Планиране на многодневни пътувания'
        desc: 'Логистика на експедиции — избор на оборудване, планиране на храната, протоколи за безопасност и контакти при спешност.'
        slug: sup-travel-guide
      - title: 'Техники за спасяване'
        desc: 'Самоспасяване, Т-спасяване и буксиране на открита вода.'
        slug: sup-self-rescue
      - title: 'Гребане през нощта'
        desc: 'Навигация след настъпване на тъмнината — изисквания за осветление, запаметяване на маршрута, комуникация в група и осъзнатост за опасностите.'
        slug: ocean-safety-basics
  - level: 'Поддръжка'
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: 'Почистване и грижа'
        desc: 'Изплакване с прясна вода, UV защита, предотвратяване на плесен и правилни техники за сушене след всяка сесия.'
        slug: inflatable-sup-maintenance
      - title: 'Наръчник за съхранение'
        desc: 'Най-добри практики за съхранение на надуваеми SUP дъски — спускане на въздуха, сгъване, температурен контрол и срок на съхранение.'
        slug: inflatable-sup-storage
      - title: 'Основи на ремонта'
        desc: 'Отстранете малки пробиви, течове по шевовете и проблеми с клапана с ремонтни комплекти за PVC и техники за поставяне на пластири.'
        slug: inflatable-sup-repair
      - title: 'Поддръжка на клапана'
        desc: 'Разпознайте типовете клапани (Halkey-Roberts, Boston, Leafield), почистете замърсяванията и подменете дефектните стъбла.'
        slug: sup-pump-guide

knowledge_center_tagline: 'Център за знания'
knowledge_center_title: 'Наръчници за морско оборудване и индустрията'
knowledge_center_subtitle: 'Експертни знания и наръчници за покупка за морски професионалисти, оператори на флотилии и любители на водните спортове.'

knowledge_sections:
  - title: 'Знания за SUP дъските'
    tagline: 'Наръчници за SUP дъски'
    desc: 'Всичко за SUP дъските — дизайн, материали, избор на размер, поддръжка и съвети за покупка за рекреативна и търговска употреба.'
    guides:
      - title: 'Как да изберете правилната SUP дъска'
        desc: 'Пълен наръчник за избор на SUP — размер, обем, материал, форма и предназначение.'
        href: '/learn/sup/'
      - title: 'Надуваема срещу твърда SUP'
        desc: 'Надуваема SUP срещу твърда епоксидна дъска — сравнение на преносимостта, издръжливостта, представянето и стойността.'
        href: '/compare/inflatable-vs-hardboard/'
      - title: 'Универсална, туристическа или йога SUP'
        desc: 'Различни типове SUP дъски — стандарти за конструкция, форми, размери и препоръчителна употреба.'
        href: '/learn/sup/'
      - title: 'Drop-Stitch срещу традиционна конструкция'
        desc: 'Сравнете Drop-Stitch и традиционната конструкция за SUP дъски по тегло, цена, издръжливост и жесткост.'
        href: '/learn/drop-stitch-core/'
  - title: 'Наръчник за надуваеми SUP'
    tagline: 'Знания за надуваеми SUP'
    desc: 'Изчерпателни наръчници за надуваеми SUP — PVC материали, Drop-Stitch конструкция, стандарти за безопасност и най-добри практики за поддръжка.'
    guides:
      - title: 'Наръчник за PVC материали'
        desc: 'Категоричен наръчник за PVC материалите, използвани в конструкцията на надуваеми SUP дъски.'
        href: '/learn/materials/'
      - title: 'Как се произвеждат надуваемите SUP'
        desc: 'Производствен процес — рязане на материали, свързване на Drop-Stitch центъра, изграждане на шевовете, изпитване под налягане и контрол на качеството.'
        href: '/learn/inflatable-technology/'
      - title: 'Наръчник за безопасност при SUP'
        desc: 'Стандарти за безопасност, товароносимост, правилно надуване, проверки преди потегляне и процедури при спешност.'
        href: '/learn/water-safety/'
      - title: 'Поддръжка на SUP'
        desc: 'Почистване, съхранение, UV защита и ремонт на надуваеми SUP дъски.'
        href: '/v2/inflatable-sup-maintenance/'
  - title: 'Знания за SUP дъските'
    tagline: 'SUP център'
    desc: 'Технически наръчници, обхващащи типове SUP дъски, материали, методи на конструкция, поддръжка и безопасност.'
    guides:
      - title: 'Типове SUP дъски'
        desc: 'Универсални, туристически, йога, спортни и детски SUP — научете разликите и изберете правилната.'
        href: '/learn/sup/'
      - title: 'Drop-Stitch технология'
        desc: 'Как хилядите вътрешни нишки създават корави надуваеми конструкции за високо налягане.'
        href: '/learn/drop-stitch-core/'
      - title: 'Довправка за материали'
        desc: 'Показатели ден на PVC, тегло на платовете, UV устойчивост и материали с морски клас — обяснени.'
        href: '/learn/materials/'
      - title: 'Наръчник за покупка на SUP'
        desc: 'Сравнете различни типове SUP дъски за различни случаи на употреба и нива на умение.'
        href: '/learn/sup/'
  - title: 'Знания за SUP'
    tagline: 'Наръчници за SUP дъски'
    desc: 'Всичко за SUP дъските — надуваеми срещу твърди, размери на дъската, материални технологии и експертни съвети за всички нива на умение.'
    guides:
      - title: 'Надуваема срещу твърда SUP'
        desc: 'Сравнете iSUP и твърди епоксидни дъски по преносимост, издръжливост, представяне и стойност.'
        href: '/learn/sup/'
      - title: 'Наръчник за размерите на SUP дъската'
        desc: 'Как дължината, ширината и дебелината влияят на стабилността, скоростта и маневреността.'
        href: '/learn/sup/'
      - title: 'Поддръжка и грижа за SUP'
        desc: 'Съвети за почистване, съхранение, UV защита и ремонт на надуваеми SUP дъски.'
        href: '/v2/inflatable-sup-maintenance/'
      - title: 'Изборът на вашата първа SUP'
        desc: 'Наръчник за начинаещи за избор на правилната SUP дъска според вашето тегло, ниво на умение и предназначение.'
        href: '/learn/sup/'
  - title: 'Наръчник за наемни операции'
    tagline: 'Управление на флотилии за бизнес с наемане'
    desc: 'Наръчници за изграждане и управление на SUP флотилии за наемане за плажни сергии, центрове за водни спортове и хотелиерски обекти.'
    guides:
      - title: 'Изграждане на вашата наемна флотилия'
        desc: 'Как да изберете правилните SUP дъски за вашата наемна операция — издръжливост, размери и съображения за възвръщаемост.'
        href: '/solutions/rental-operators/'
      - title: 'Наръчник за поддръжка на флотилията'
        desc: 'Основни практики за поддръжка, за да увеличите максимално живота на дъските и намалите престоя на наемните флотилии.'
        href: '/solutions/rental-operators/'
  - title: 'Наръчник за курорти и хотелиерство'
    tagline: 'Водни активности за хотелиерството'
    desc: 'Наръчници за стартиране и управление на SUP програми за курорти, хотели и крайбрежни дестинации.'
    guides:
      - title: 'Стартиране на SUP програма в курорт'
        desc: 'Фактори, които да вземете предвид при стартирането на SUP активности за гости — размер на флотилията, персонал и моделиране на приходите.'
        href: '/solutions/resorts-hotels/'
      - title: 'SUP срещу други водни активности'
        desc: 'Сравнете SUP програмите с други водни спортове по клиентско преживяване и оперативна ефективност.'
        href: '/learn/sup/'
  - title: 'Наръчник за търговия и дистрибуция'
    tagline: 'Бизнес партньорства в SUP'
    desc: 'Наръчници как да станете търговски партньор или дистрибутор на SUP — планиране на наличностите, пазарно позициониране и стратегии за растеж.'
    guides:
      - title: 'Как да станете SUP търговец'
        desc: 'Как да изберете продуктни линии, да управлявате наличностите и да пласирате SUP дъски в вашия магазин.'
        href: '/solutions/retail-partners/'
      - title: 'SUP за търговски операции'
        desc: 'Защо надуваемите SUP са универсален продукт за търговски флотилии, бизнес с наемане и професионални оператори.'
        href: '/solutions/rental-operators/'


seo:
  headline: 'Гаранция за надуваеми SUP дъски afarer — 5-годишна ограничена гаранция | afarer'
  description: 'afarer предлага 5-годишна ограничена гаранция за основната палубна тъкан, шевовете и конструктивната цялост на Drop-Stitch сърцевината. Обхваща също вентилите за надуване и фабрично монтираните аксесоари. Пълни условия на гаранцията за надуваеми SUP дъски afarer.'

body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Настоящата ограничена гаранция се прилага за нови надуваеми морски продукти с марка afarer, закупени директно от afarer или от оторизиран търговец или дилър на afarer. Началната дата е проверимата дата на първоначалната покупка на дребно.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Обхват и срок на гаранцията</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 години</h3>
        <p class="text-sm text-gray-600 mt-1">Цялост на основната тръбна тъкан (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 години</h3>
        <p class="text-sm text-gray-600 mt-1">Конструктивна цялост на фибергласовия корпус</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 години</h3>
        <p class="text-sm text-gray-600 mt-1">Способността на шевовете на надуваемите тръби да задържат въздух</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 години</h3>
        <p class="text-sm text-gray-600 mt-1">Функционалност на вентила за надуване</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 година</h3>
        <p class="text-sm text-gray-600 mt-1">Фабрично монтирани аксесоари и спомагателни фитинги</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 година*</h3>
        <p class="text-sm text-gray-600 mt-1">Търговска употреба, наемане или флотна експлоатация — всички компоненти</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Търговска, държавна, чартърна, наемна или учебна употреба намалява гаранцията до 1 година. Употребата в състезания по надбягване или състезания изцяло анулира гаранцията.</p>
  </div>

  <h2>Какво се покрива</h2>
  <h3>Основна тръбна тъкан (5 години)</h3>
  <p>afarer гарантира основната палубна тъкан срещу порьозно влошаване, което съществено компрометира способността на продукта да поддържа работно налягане. Това се отнася за PVC покрита тъкан и за всички други материали на палубната тъкан, използвани в производството.</p>

  <h3>Конструктивна цялост на фибергласовия корпус (5 години)</h3>
  <p>За продукти с корпус от фибергласово подсилена пластмаса (FRP) основната композитна конструкция е гарантирана срещу конструктивна повреда вследствие на дефекти в материалите или изпълнението.</p>

  <h3>Способността на шевовете на надуваемите тръби да задържат въздух (5 години)</h3>
  <p>Шевовете на надуваемите тръби, по местата на съединяване по време на производството, са гарантирани срещу производствени дефекти, които водят до съществено изтичане на въздух през шева. Периодичната инспекция и поддръжката на подходящи налягания на надуване са условие за покритието.</p>

  <h3>Функционалност на вентила за надуване (5 години)</h3>
  <p>Вентилите за надуване, първоначално монтирани от afarer, са гарантирани срещу производствени дефекти в материалите или изпълнението, които предотвратяват задържането на въздух от вентила, както е предвидено.</p>

  <h3>Фабрично монтирани аксесоари (1 година)</h3>
  <p>Компонентите и фитингите, произведени от afarer и първоначално монтирани в фабриката, са гарантирани срещу дефекти в материалите и изпълнението за срок от една година. Това не включва артикули на трети страни, които се покриват само от съответните производствени гаранции.</p>

  <h2>Какво не се покрива</h2>
  <ul>
    <li>Козметични недостатъци, включително обезцветяване, петна, избледняване, посветляване или всякаква промяна във вида</li>
    <li>Пробиви, разрези, разкъсвания или други физически повреди</li>
    <li>Напукване на повърхностния слой, пукнатини, износване, надраскване или влошаване от триене или контакт</li>
    <li>Деградация вследствие на UV лъчи, атмосферни влияния или метеорологични условия</li>
    <li>Щети от контакт с горива, разтворители, киселини, основи или химикали</li>
    <li>Щети от небрежност, неправилна употреба, злоупотреба, злополука или нормално износване</li>
    <li>Проблеми с повърхността на гелкоута или боята (образуване на мехури, напукване, обезцветяване, избледняване)</li>
    <li>Щети от удар, напрежение, неподходяща опора или транспортиране на ремарке</li>
    <li>Щети от неправилно надуване/изпускане или използване на неодобрени устройства за надуване</li>
    <li>Оборудване, компоненти или системи на трети страни (покрити от съответните им производители)</li>
  </ul>

  <h2>Задължение на производителя и средство за защита</h2>
  <p>Единственото и изключително задължение на afarer е ремонтът или подмяната, по избор на afarer, на всеки компонент, определен като дефектен в материалите или изпълнението и покрит от настоящата гаранция. Ремонтите или подмяните се извършват от afarer или от негов определен оторизиран сервиз. Компонентите, ремонтирани или подменени, са гарантирани само за неизтеклия остатък от първоначалния гаранционен период.</p>

  <h2>Гаранционни условия</h2>
  <ul>
    <li><strong>Регистрация:</strong> Продуктът трябва да бъде надлежно регистриран, както е предвидено в гаранционните условия.</li>
    <li><strong>Поддръжка:</strong> Продуктът трябва да се поддържа в съответствие с публикуваните указания на afarer, включително периодична инспекция и поддръжка на подходящи налягания на надуване.</li>
    <li><strong>Сътрудничество:</strong> Купувачът трябва да сътрудничи изцяло и своевременно на afarer по всички въпроси, свързани с гаранционни рекламации.</li>
    <li><strong>Първоначален купувач:</strong> Настоящата гаранция се предоставя изключително на първоначалния крайен потребител и не е прехвърляема.</li>
  </ul>

  <h2>Търговска употреба</h2>
  <p>Ако продуктът се използва за търговски, държавни, нестопански, чартърни, наемни, учебни цели или за какъвто и да е друг цел, различен от частна рекреативна употреба, гаранционният период за всички компоненти се намалява на една (1) година от първоначалната дата на покупка на дребно. Употребата в състезания по скорост или издръжливост незабавно и необратимо анулира гаранцията изцяло.</p>

  <h2>Как да подадете гаранционна рекламация</h2>
  <p>Свържете се с afarer или с вашия оторизиран дилър с доказателство за покупка и подробно описание на проблема. afarer ще прегледа рекламацията и ще предостави инструкции за инспекция и обслужване.</p>
  <p>За запитвания относно гаранционно обслужване, моля, свържете се с нас чрез нашата <a href="/contact" class="text-sky-600 underline">контактна страница</a> с номера на вашата поръчка и данни за продукта.</p>

  <h2>Артикули на трети страни</h2>
  <p>Оборудването, компонентите или системите, произведени от трети страни (дори когато са монтирани от afarer), се покриват изключително от евентуалната гаранция, предлагана от съответния им производител. afarer изрично не поема никаква гаранционна отговорност за такива артикули на трети страни.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Настоящото гаранционно изложение е резюме на пълната ограничена производствена гаранция на afarer. Пълният правен гаранционен документ урежда всички гаранционни условия. Спецификациите подлежат на промяна без предизвестие. afarer е марка, управлявана от Aquafarer LLC (САЩ).
  </p>

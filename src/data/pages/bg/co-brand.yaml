faqs:
  title: 'Съвместна марка — често задавани въпроси'
  subtitle: 'Как работи съвместната марка на Afarer и как се различава от OEM и частния етикет.'
  items:
    - title: 'Съвместната марка същото ли е като OEM или частния етикет?'
      description: 'Не. Afarer вече не поддържа отворена програма за OEM/частни етикети. Продуктите със съвместна марка остават продукти на Afarer — проектирани, инженерно разработени, проверени за качество и подкрепени от марката Afarer. Вашата идентичност се появява като съвместна марка, а не като продукт на трета страна без марка.'
    - title: 'Кой може да стартира проект със съвместна марка?'
      description: 'Квалифицирани водноспортни бизнеса: съществуващи национални партньори, клубове по гребане, курорти и хотели, организатори на събития и общности. Изпратете ни проектно задание и потвърждаваме приложимостта, преди да започне дизайнерската работа.'
    - title: 'Ще влезе ли съвместната марка в конфликт с моя национален дистрибутор?'
      description: 'Не. Моделът „една страна — един дистрибутор“ има приоритет. Колекциите със съвместна марка се координират с местния национален партньор, когато такъв съществува, така че в защитена територия да не се появява паралелна или конкурираща се марка.'
    - title: 'Каква е минималната поръчка за колекция със съвместна марка?'
      description: 'Пилотните колекции започват от 30–50 броя. Стандартните колекции са 50–100 броя; големите или мултирегионалните издания са 100+ броя. Сроковете за персонализирана разработка се договарят по проект.'
    - title: 'Какво представлява качеството на Afarer спрямо приноса на партньора?'
      description: 'Afarer притежава продуктовия дизайн, инженеринга, материалите, конструкцията, контрола на качеството и гаранцията. Партньорите допринасят с концепцията за колекцията, наименованията, цветовете, графичния принос и извеждането на пазара. Така на водата се поддържа единен качествен стандарт.'
    - title: 'Как да кандидатствам?'
      description: 'Попълнете формуляра за запитване за съвместна марка с вашия бизнес, пазар и идея за колекция. Преглеждаме съответствието и отговаряме в рамките на 3 работни дни с предложение и Споразумение за проект със съвместна марка.'

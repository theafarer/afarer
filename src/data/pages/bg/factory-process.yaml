intro: 'За разлика от марки, които възлагат производството на външни фабрики, afarer притежава и управлява цялата си производствена верига. Тази вертикална интеграция ни позволява да поддържаме строг контрол на качеството на всеки етап, да реагираме бързо на персонализирани изисквания и да доставяме последователно качество на продукта партида след партида. Ето как се изгражда една дъска в нашето предприятие.'

steps:
  - step: '01'
    title: 'Приемане и инспекция на материали'
    description: 'Всяка входяща партида PVC тъкан, фибергласово влакно, смола и фурнитура се инспектира спрямо спецификацията. Мостри от тъканта се изпитват за якост на опън, еднородност на дебелината и UV устойчивост, преди да бъдат предадени на производството. Несъответстващите материали се подлагат на карантина и се връщат.'
    duration: '1–2 дни'
  - step: '02'
    title: 'Автоматично рязане на PVC'
    description: 'Одобрените тъкани се поставят на автоматичната CNC машина за рязане и се нарязват с точност под милиметъра. Компютърно оптимизираното подреждане разполага панелите така, че да минимизира отпадъците — обикновено под 5%. Изрязаните панели се етикетират по модел дъска и камера и се пакетират за прехвърляне към заваръчната работилница.'
    duration: '2–4 часа на комплект дъска'
  - step: '03'
    title: 'Топлинно запечатване и заваряване на тръбите'
    description: 'Панелите се фиксиранат предварително и се слепват с машини за топлинно запечатване чрез заваряване с горещ въздух при контролирани температури от 200–300 °C. Основните шевове се подсилват с RF диелектрично заваряване за херметични, високояки съединения. Завършените камери се надуват до 1,5× работното налягане за 30-минутна валидация на задържането на въздуха.'
    duration: '1–2 дни на дъска'
  - step: '04'
    title: 'Печат и декорация на SUP'
    description: 'Палубните графики на SUP дъските се нанасят чрез цифров печат за пълноцветни дизайни с фото качество и чрез шелкография за трайни лого и повтарящи се шарки. Отпечатъците се втвърдяват и запечатват за UV и износваща устойчивост.'
    duration: '1–2 дни'
  - step: '05'
    title: 'Финално сглобяване и такелаж'
    description: 'Дъските се оборудват на поточната линия с перки, вентили, EVA палуби и аксесоари. Всяка единица следва 100-точков контролен списък за сглобяване със задължително подписване на всеки етап.'
    duration: '2–4 дни'
  - step: '06'
    title: 'Изпитване и инспекция на качеството'
    description: 'Всяка завършена дъска преминава през задължителна контрольна точка за качество: изпитване на задържане на въздуха в камерите, проверка на функциите на фурнитурата, проверка на момента на затягане на крепежите и козметична инспекция. Персонализираните и прототипните изграждания получават също изпитвания във вода, обхващащи стабилността и управлението.'
    duration: '1–2 дни'
  - step: '07'
    title: 'Опаковане и изпращане'
    description: 'Дъските се спускат, сгъват по процедура, опаковат се в здрави тъкани торби или шайби от шперплат и се товарят за изпращане. Всеки пакет е етикетиран с модел, сериен номер и местоназначение. Координираме се с товарните експедитори за контейнерни пратки FCL и LCL по целия свят.'
    duration: '1 ден'


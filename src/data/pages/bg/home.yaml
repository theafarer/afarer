who_we_serve:
  tagline: 'Яхнете с нас'
  title: 'Създадени за начина, по който яздите'
  subtitle: 'От първия ви замах до най-дългия ви маршрут — и за клубовете, курортите и търговците, които държат хората на водата.'
  items:
    - title: 'Начинаещи и ездачи за отдих'
      keywords: 'надуваема sup за начинаещи, универсална дъска за гребане, стабилна sup'
      description: 'Широки, стабилни универсални дъски, които правят първия ви замах естествен и се развиват заедно с вас.'
      icon: tabler:users
      cta: 'Намерете първата си дъска'
      link: /all-around-sup
    - title: 'Туристически и приключенски гребци'
      keywords: 'туристическа sup, дъска за дълги разстояния, експедиционна sup'
      description: 'По-дълги и по-тесни дъски, създадени да държат права посока, да се плъзгат по-далеч и да носят оборудване за многодневни маршрути.'
      icon: tabler:building
      cta: 'Разгледайте туристическите дъски'
      link: /touring-sup
    - title: 'Клубове, курорти и наемане'
      keywords: 'флот за наемане на sup, оборудване за клубове по гребане, водни активности в курорти'
      description: 'Надуваеми SUP дъски, готови за флот, с надеждна издръжливост, лесна поддръжка и поддръжка на резервни части.'
      icon: tabler:shopping-cart
      cta: 'Изградете своя флот'
      link: /solutions
    - title: 'Национални дистрибутори и партньори със съвместна марка'
      keywords: 'национален дистрибутор sup, sup със съвместна марка, sup с частен етикет'
      description: 'Изключителна дистрибуция страна по страна и ограничени колекции със съвместна марка за квалифицирани водноспортни бизнеса.'
      icon: tabler:package
      cta: 'Станете партньор'
      link: /distributor-program

proof_points:
  title: 'Изпитани отвъд шоурума'
  subtitle: 'Дизайн, производителност и качество, които можете да проверите — на водата и в цифрите.'
  items:
    - metric: '10+'
      label: 'Години проектиране за водата'
      detail: 'От 2012 г., усъвършенствани дъска по дъска'
    - metric: '50+'
      label: 'Държави на водата'
      detail: 'Гребци и партньори по целия свят'
    - metric: '12–15'
      label: 'PSI Drop-Stitch сърцевина'
      detail: 'Твърда, където има значение, лесна за пакетиране'
    - metric: '100%'
      label: 'Изпитана на налягане дъска по дъска'
      detail: 'Инспектирана преди изпращане'

business_solutions:
  tagline: 'Защо се язди различно'
  title: 'Производителност, която усещате при първия замах'
  subtitle: 'Четири стълба, оформени от реалната вода — производителност, дизайн, конструкция и качество.'
  items:
    - title: 'Производителност във водата'
      description: 'Форми, настроени за стабилност, плъзгане и увереност при вълнение — така че всеки замах да се усеща свързан с водата.'
      icon: tabler:shield-check
    - title: 'Изразителен дизайн'
      description: 'Колекции, вдъхновени от приливите, дивата природа и енергията на бреговата линия — дъски, с които искате да ви виждат.'
      icon: tabler:package
    - title: 'Доказана конструкция'
      description: 'Drop-Stitch сърцевини с висока плътност, подсилени бордове и фузионно ламинирани шевове, изградени за многократна употреба.'
      icon: tabler:headset
    - title: 'Проверено качество'
      description: 'Изпитани на налягане, визуално инспектирани и подкрепени от ясна гаранция и отзывчива следпродажбена поддръжка.'
      icon: tabler:truck-delivery

oem_section:
  tagline: 'OEM / ODM производство и съвместни марки'
  title: 'От идеята до водата — издания със съвместна марка'
  subtitle: 'За партньори, които искат повече от каталожен продукт: OEM/ODM производство и ограничени колекции със съвместна марка, проектирани, инженерно разработени и изградени с Afarer — като всяка дъска остава продукт на Afarer.'
  steps:
    - number: '01'
      title: 'Идея и задание'
      desc: 'Споделете вашата визия, целевия ездач и водата, за която проектирате.'
    - number: '02'
      title: 'Дизайн и инженеринг'
      desc: '3D моделиране, избор на материали и отличителен графичен дизайн.'
    - number: '03'
      title: 'Прототип и валидиране'
      desc: 'Мостри, изпитани на налягане и валидирани във вода, преди да се ангажирате.'
    - number: '04'
      title: 'Производство в мащаб'
      desc: 'Последователно, инспектирано производство с контролни точки за качество на всеки етап.'
    - number: '05'
      title: 'Глобална доставка'
      desc: 'Логистика от Циндао до основните пристанища с митническа поддръжка.'
  cta: 'Разгледайте съвместните марки'
  cta_link: /co-brand


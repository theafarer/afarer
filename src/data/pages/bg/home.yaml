meta:
  title: Надувни SUP Дъски Afarer | Върви по-далеч. Греби по-силно.
  description: Открий надувните SUP дъски на Afarer за универсално гребане, туринг, йога, риболов и приключения на открито. Намери своя идеален SUP и изследвай повече на водата.
  keywords:
    - надувна sup дъска
    - надувно sup
    - универсално sup
    - туринг sup
    - sup за йога
    - sup за риболов
    - семейна sup дъска
    - преносима sup дъска
hero:
  tagline: Надувни SUP Дъски
  title: Надувни SUP Дъски за Всяко Приключение
  slogan: Върви по-далеч. Греби по-силно.
  subtitle: Открий свободата на гребането с Afarer. Разгледай обмислени надувни SUP дъски за спокойни дни на езерото, крайбрежни приключения, фитнес и всичко между тях.
  taglineSection: Създадено за увереност. Проектирано да се откроява.
  actions:
    - variant: primary
      text: Намери Своата Дъска
      href: /size-guide/
      icon: tabler:compass
    - text: Разгледай SUP Дъските
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Защо Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Надувни SUP дъски Afarer се пързалат по спокойна вода по изгрев — създадени за всяко приключение
who_we_serve:
  tagline: Греби с Нас
  title: Намери Своя Път по Водата
  subtitle: Всеки гребец има различна представа за приключение. Открий SUP дъска Afarer, създадена около твоя стил на каране.
  items:
    - title: Начинаещи и Рекреативни Гребци
      keywords: надувно sup за начинаещи, универсална sup дъска, стабилно sup
      description: Широки, стабилни универсални дъски, с които първото загребване се усеща естествено и които растат с теб.
      icon: tabler:users
      cta: Намери Първата Си Дъска
      link: /all-around-sup/
    - title: Туринг и Приключения
      keywords: туринг sup, sup дъска за дълги разстояния, експедиционно sup
      description: По-дълги и по-тесни дъски, които държат курса, пързалат по-далеч и носят екипировка за многодневни маршрути.
      icon: tabler:building
      cta: Разгледай Туринг SUP
      link: /touring-sup/
    - title: Йога и Фитнес
      keywords: sup за йога, фитнес sup дъска, широко стабилно sup
      description: Широки, стабилни платформи с пространство за движение — за утринни практики, тренировки и баланс на спокойна вода.
      icon: tabler:heart
      cta: Разгледай SUP за Йога
      link: /yoga-sup/
    - title: Риболов и Семейство
      keywords: sup за риболов, семейна sup дъска, стабилна риболовна платформа
      description: Стабилни, практични платформи за риболов, разходки с децата и дълги спокойни дни на водата.
      icon: tabler:users
      cta: Разгледай SUP за Риболов
      link: /fishing-sup/
proof_points:
  title: Изпитани отвъд шоурума
  subtitle: Дизайн, производителност и качество, които можете да проверите — на водата и в цифрите.
  items:
    - metric: 10+
      label: Години проектиране за водата
      detail: От 2012 г., усъвършенствани дъска по дъска
    - metric: 50+
      label: Държави на водата
      detail: Гребци и партньори по целия свят
    - metric: 12–15
      label: PSI Drop-Stitch сърцевина
      detail: Твърда, където има значение, лесна за пакетиране
    - metric: 100%
      label: Изпитана на налягане дъска по дъска
      detail: Инспектирана преди изпращане
business_solutions:
  tagline: Защо Кара Различно
  title: Производителност, която Усещаш от Първото Загребване
  subtitle: Четири стълба, оформени от истинската вода — производителност, дизайн, конструкция и качество.
  items:
    - title: Производителност на Водата
      description: Форми, настроени за стабилност, пързалене и увереност във вълни — всяко загребване остава свързано с водата.
      icon: tabler:shield-check
    - title: Изразителен Дизайн
      description: Колекции, вдъхновени от приливите, дивата природа и енергията на брега — дъски, с които искаш да те виждат.
      icon: tabler:package
    - title: Доказана Конструкция
      description: Drop-stitch сърца с висока плътност, подсилени бордове и фузионно ламинирани шевове за многократна употреба.
      icon: tabler:headset
    - title: Проверено Качество
      description: Тествани под налягане, визуално инспектирани и подкрепени от ясна гаранция и отзивчиво следпродажбено обслужване.
      icon: tabler:truck-delivery
cta:
  title: Намери следващата си дъска.
  subtitle: Първото загребване или най-дългият ти маршрут — извеждаме те на водата.
  actions:
    - variant: primary
      text: Разгледай Колекцията
      href: /inflatable-sup/
      icon: tabler:send
    - text: Заяви Каталог
      href: /resources/download-catalog/

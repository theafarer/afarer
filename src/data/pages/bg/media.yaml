    title: Лого и бренд кит
    desc: Официални файлове с логото на afarer, цветова палитра, типография и насоки за марката.
    items:
      - Основно лого (PNG/SVG/EPS)
      - Иконна марка
      - Цветова палитра
      - Типографски спецификации
      - Насоки за марката PDF
  - id: catalogs
    title: PDF каталози
    desc: Продуктови каталози, технически листове и техническа документация за изтегляне.

features3_markets:
  tagline: 'Ключови пазари'
  title: 'Регионална експертиза<br />за локални изисквания'
  subtitle: 'Разбираме, че различните пазари имат различни регулаторни изисквания, предпочитания и случаи на употреба.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Европа и Обединеното кралство'
      description: 'Продукти, сертифицирани по CE. Силено търсене на SUP дъски в пазарите на ЕС. Дистрибуторите в Обединеното кралство ценят бързото ни изпълнение.'
      icon: tabler:map-pin
    - title: 'Северна Америка'
      description: 'Производство, одобрено от Бреговата охрана на САЩ. Американски склад в Монтклер, Калифорния за бърза доставка по западното крайбрежие. Растящо търсене на SUP дъски за риболов, спасяване и отдих.'
      icon: tabler:map-pin
    - title: 'Австралия и Океания'
      description: 'Силен пазар за SUP дъски и аксесоари за водни спортове. Австралийските дистрибутори ценят нашата UV-устойчива PVC конструкция при сурови слънчеви условия. Бърза доставка от нашето азиатско предприятие.'
      icon: tabler:map-pin
    - title: 'Близък изток'
      description: 'Растящо търсене на оборудване за водни приключения. Нашите SUP дъски от търговски клас и спасителното оборудване са популярни сред туроператорите и центровете за наемане. Персонализирани конфигурации за среди с високи температури.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Дистрибуторска мрежа'
  title: 'Партнираме с дистрибутори<br />по целия свят'
  subtitle: 'Работим с утвърдени дистрибутори на морско оборудване, марки за водни спортове и държавни поръчки.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Програми със съвместна марка'
      description: 'Производство с частен етикет за глобални марки за водни спортове. Ние се грижим за всичко — от дизайна до производството и директната доставка.'
      icon: tabler:building
    - title: 'Дистрибуторска мрежа'
      description: 'Оторизирани дистрибутори в над 20 държави поддържат наличности и осигуряват локална поддръжка. Запитвания от нови дистрибутори са добре дошли.'
      icon: tabler:users
    - title: 'Държавни и институционални'
      description: 'Директни доставки за брегови охрана, организации за издирване и спасяване и военни поръчки. Съответствие с институционалните изисквания за обществени поръчки.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Глобална логистика и поддръжка'
  subtitle: 'От фабриката до местоназначението — ние управляваме цялата верига за доставки.'
  items:
    - title: 'Опции за транспортиране'
      description: 'Морски транспорт (FOB Циндао), въздушен транспорт за спешни поръчки и експресен куриер за мостри и резервни части.'
      icon: tabler:truck-delivery
    - title: 'Американски склад'
      description: 'Наличности в Монтклер, Калифорния за бърза доставка в цяла Северна Америка. Западно крайбрежие: 2–3 дни, Централна част: 3–4 дни, Източно крайбрежие: 4–5 дни.'
      icon: tabler:building-warehouse
    - title: 'Резервни части'
      description: 'Оригинални резервни части и консумативи afarer, налични целогодишно. Често срещани части се изпращат в рамките на 24 часа.'
      icon: tabler:package
    - title: 'Техническа поддръжка'
      description: 'Директна линия към нашия инженерен екип за технически въпроси, съвети за ремонт и поддръжка на резервни части. Поддържаме дъски, изградени преди 20 години.'
      icon: tabler:headset

meta:
  title: 'Технология — Drop-Stitch и морски PVC | {SITE}'
  description: 'Технологиите на afarer: Drop-Stitch конструкция, морски PVC, двуслойни изграждания и високо налягане. Иновации от професионален производител на надуваеми SUP дъски.'
  keywords:
    - 'sup технология'
    - 'drop-stitch конструкция'

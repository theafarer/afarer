hero:
  tagline: 'Технология'
  title: 'Създадени за производителност'
  subtitle: 'Всяка надуваема SUP дъска afarer е проектирана с Drop-Stitch конструкция и PVC с морски клас — прецизни материали и производствени методи, изпитани за взискателни морски среди.'

sections:
  - title: 'Drop-Stitch сърцевина'
    description: 'Хиляди вътрешни полиестерни нишки свързват горния и долния слой, създавайки твърда конструкция при 12–15 PSI. Това е същата технология, използвана в професионалните дъски за гребане и надуваемите състезателни SUP.'
    imageAlt: 'Диаграма на DS сърцевината'
  - title: 'PVC с морски клас'
    description: 'Многослойна ламинарана PVC тъкан, предназначена за морски среди. Всеки слой е фузионно заварен, а не слепен, което елиминира риска от разслояване. Изпитана за UV устойчивост, корозия от солена вода и износване.'
    imageAlt: 'PVC слой'
  - title: 'PVC с военен клас'
    description: 'Използван във всички SUP модели, премиум PVC осигурява превъзходна UV и химична устойчивост. Запазва гъвкавостта си при екстремни температури и устоява на деградация.'
    imageAlt: 'PVC'
  - title: 'Въздушна палуба'
    description: 'Надуваема Drop-Stitch конструкция с високо налягане, осигуряваща изключителна твърдост за стоене прав, риболов и йога. Намалява времето за подготовка, общото тегло и обема за съхранение.'
    imageAlt: 'Въздушна палуба'


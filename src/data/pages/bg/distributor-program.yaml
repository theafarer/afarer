faqs:
  title: 'Партньорство по държави — често задавани въпроси'
  subtitle: 'Въпросите, които сериозните държавни партньори задават, преди да кандидатстват.'
  items:
    - title: 'Какво наистина означава една-държава-един-дистрибутор?'
      description: 'Afarer назначава един-единствен упълномощен дистрибутор с изключителни права за определена територия. Не продаваме от нашите глобални или регионални канали в защитена държава. Вашата собственост върху територията важи, докато се спазва Дистрибуторското споразумение.'
    - title: 'Територията изключителна ли е завинаги?'
      description: 'Не. Изключителността е условна, не постоянна. Поддържа се чрез подписано Дистрибуторско споразумение, изпълнение на първата поръчка, годишни цели за покупки, местен склад, следпродажбени възможности и продължаващи пазарни инвестиции. Ако тези условия не се спазват, територията може да бъде преразгледана или прехвърлена.'
    - title: 'Каква е минималната първа поръчка?'
      description: 'Държавните и регионалните дистрибутори започват от 100–300 броя; упълномощените дилъри от 30–50 броя; пробните поръчки от 10–30 броя ви позволяват първо да валидирате пазара (пробните и мострените поръчки не носят териториална закрила). Персонализираните програми и програмите под собствена марка следват отделни MOQ, посочени в нивата по-горе.'
    - title: 'Каква подкрепа включва 10-модуловата програма за подкрепа?'
      description: 'Нива и квалификация, закрила на територията, MOQ / ценообразуване / годишни бонуси, наличности и изпълнение на поръчки, маркетингови активи и съвместни пазарни фондове, обучение по продукт / продажби / техника, резервни части и следпродажбено обслужване, регистрация на гаранция, партньорският портал и технически листа на продуктите, библиотека с маркетингови активи, годишно бонусно разписание и товарителни и опаковъчни листи.'
    - title: 'Как Afarer ме пази от конфликт на каналите?'
      description: 'Всяка територия има точно един упълномощен дистрибутор. Запитванията и директните поръчки от вашия регион се насочват през вас, формулярите на уебсайта се препращат към местния партньор, когато има такъв, а глобалният екип ескалира само когато партньор не отговаря.'
    - title: 'Какви са условията за доставка и плащане?'
      description: 'Поръчките се експедират FOB Циндао с пълна износна документация. Производствените поръчки са с 30% депозит и 70% преди експедиция; пробните и мострените поръчки се плащат предварително. Стандартният срок за изпълнение е 30–45 работни дни, като за мостри той е 15–20 работни дни.'
    - title: 'Как да кандидатствам?'
      description: 'Изпратете кандидатурата си чрез контактния формуляр с детайли за пазара. Преглеждаме съответствието с пазара, търговското присъствие и логистичните възможности, след което отговаряме в рамките на 3 работни дни със следващите стъпки и образец на Дистрибуторско споразумение.'

meta:
  title: 'Производство на SUP под собствена марка и стартиране на персонализирана марка | {SITE}'
  description: 'Производител на SUP под собствена марка за нови марки дъски за гребане. Стартирайте своя собствена SUP марка с Afarer — пълна OEM/ODM услуга, включваща проектиране, прототипи, персонализирано брандиране, производство и глобална логистика.'

hero:
  tagline: Изградете своя собствена марка
  title: 'Стартирайте своя собствена<br />SUP марка'
  subtitle: 'Вие имате визията. Ние имаме фабриката, експертизата и веригата за доставки. Производство на SUP под собствена марка и разработване на персонализирани SUP марки — заедно ще изградим марка, която се откроява.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Персонализирана брандирана SUP дъска на вода

process:
  title: Пътят на вашата марка
  subtitle: 'От идеята до пазара в 5 фази.'
  steps:
    - phase: 'Фаза 1'
      title: 'Идея'
      period: 'Седмица 1-2'
      items:
        - 'Пазарно проучване и анализ на конкурентите'
        - 'Дефиниране на целевия клиент'
        - 'Семинар за позициониране на марката'
        - 'Стратегия за продуктовата линия'
    - phase: 'Фаза 2'
      title: 'Проектиране'
      period: 'Седмица 3-6'
      items:
        - 'Форма на дъската и графично проектиране'
        - 'Съответствие на цветовете и избор на материали'
        - 'Спецификация на аксесоарите'
        - 'Проектиране на опаковка и етикети'
    - phase: 'Фаза 3'
      title: 'Прототип'
      period: 'Седмица 7-10'
      items:
        - 'Производство на мостра'
        - 'Изпитвания на качеството (налягане, плавателност, UV)'
        - 'Корекции по дизайна'
        - 'Финално одобрение'
    - phase: 'Фаза 4'
      title: 'Производство'
      period: 'Седмица 11-14'
      items:
        - 'Серийно производство'
        - 'QC инспекция (за всяка единица)'
        - 'Морски / въздушен товарен транспорт'
        - 'Документи за митническо оформяне'
    - phase: 'Фаза 5'
      title: 'Стартиране'
      period: 'Седмица 15-16'
      items:
        - 'Продуктова фотография'
        - 'Продуктова информация за уебсайта'
        - 'Маркетингови материали'
        - 'Подкрепа при стартирането'

packages:
  title: Пакети за стартиране
  subtitle: 'Пакети, проектирани за всеки етап от растежа на марката.'
  items:
    - name: Стартова марка
      tagline: '50-100 броя · 2 модела дъски'
      features:
        - 'Основен печат на лого'
        - 'Стандартна опаковка'
        - 'Поддръжка по имейл'
    - name: Растяща марка
      tagline: '300-1 000 броя · 3-5 модела дъски'
      features:
        - 'Персонализиран цвят + лого'
        - 'Персонализирана опаковка'
        - 'Продуктови снимки'
        - 'Личен мениджър'
    - name: Утвърдена марка
      tagline: '1 000+ броя · Пълна продуктова линия'
      features:
        - 'Пълна персонализация'
        - 'Премиум опаковка'
        - 'Маркетингови материали'
        - 'Приоритетно производство'


content_html: |
  <h2>1. Предварителна квалификация: какво да търсите във фабриката</h2>

  <h3>Сертификати за съответствие</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Система за управление на качеството</li>
    <li><strong>CE сертифициране</strong> – Проверете номера на нотифицирания орган</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Одити за социално съответствие</li>
    <li><strong>REACH / RoHS</strong> – Декларации за съответствие на материалите</li>
  </ul>

  <h3>Производствени възможности</h3>
  <ul>
    <li>Собствено тъкане на Drop-Stitch центъра срещу възложено външно</li>
    <li>Линия за PVC покритие / ламиниране</li>
    <li>Оборудване за RF заваряване и заваряване с горещ въздух</li>
    <li>Собствено изработване на калъпи (CNC обработка)</li>
    <li>Изпитвателна лаборатория (изпитвания под налягане, UV стареене, изпитвания на опън)</li>
  </ul>

  <h3>Проверка на опита</h3>
  <ul>
    <li>Години в производството на надуваеми плавателни съдове (минимум 5+ години)</li>
    <li>Брой инженери в щата</li>
    <li>Съществуващи OEM/ODM клиенти (заявете референции)</li>
    <li>Дестинации за износ – вече ли доставят към вашия целеви пазар?</li>
  </ul>

  <h2>2. Протоколи за контрол на качеството</h2>
  <p>Входящ контрол на материалите: якост на опън (ASTM D751 или ISO 1421), съпротивление на разкъсване (ASTM D2261 или ISO 4674), якост на сцепление, изборъчни проверки на UV стареене.</p>
  <p>Междинен контрол: наблюдение на якостта на шевовете на всеки 50 броя, проверка на момента на затягане на клапаните, проверки на плътността на Drop-Stitch нишките, размерни проверки спрямо CAD чертежи.</p>
  <p>Финален контрол: 100% тест на задържане под налягане (24 часа, макс. 5% спад), визуален контрол, функционален тест на клапаните, изпитвания на случайни извадки (AQL 2.5 или 4.0 съгласно ISO 2859).</p>

  <h2>3. Чеклист на документацията за съответствие</h2>
  <ul>
    <li>Декларация за съответствие (DoC), позоваваща се на правилната директива на ЕС</li>
    <li>CE сертификат от нотифициран орган</li>
    <li>Протокол от изпитвания от акредитирана лаборатория</li>
    <li>Паспорти за безопасност на материалите (MSDS)</li>
    <li>Декларация за съответствие с REACH</li>
    <li>Спецификация на материалите с проследяемост на доставчиците</li>
    <li>Доклад от инспекция на фабриката</li>
  </ul>

  <h2>4. Преговори за MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Тип продукт</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Стандартен MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Диапазон за преговори</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP дъски</td><td class="p-3 border">50 – 100 броя</td><td class="p-3 border">5 – 10 броя (пробни)</td></tr>
      <tr><td class="p-3 border">Каяци</td><td class="p-3 border">50 – 100 броя</td><td class="p-3 border">5 – 10 броя (пробни)</td></tr>
      <tr><td class="p-3 border">Надуваеми SUP</td><td class="p-3 border">50 – 100 броя</td><td class="p-3 border">2 – 5 броя (пробни)</td></tr>
      <tr><td class="p-3 border">Спасително оборудване / аксесоари</td><td class="p-3 border">200 – 500 броя</td><td class="p-3 border">50 – 100 броя (пробни)</td></tr>
    </tbody>
  </table>

  <h2>5. Логистика и доставка</h2>
  <p>Чести условия Incoterms: <strong>FOB</strong> (Фабриката доставя до пристанището на заминаване – най-често срещано), <strong>EXW</strong> (Купувачът организира цялата доставка от вратата на фабриката), <strong>CIF</strong> (Фабриката плаща товарния транспорт и застраховката до пристанището на пристигане).</p>
  <p>Надуваемите продукти са с ниско тегло и голям обем – обемното тегло (DIM) често определя разходите за доставка. Заявете вакуумирана опаковка, за да намалите обема с 50–60%. Морски товарен транспорт от Китай до ЕС: 25–35 дни; до западното крайбрежие на САЩ: 15–20 дни.</p>

  <h2>6. Чести грешки</h2>
  <ul>
    <li><strong>Липса на одит на фабриката:</strong> Винаги извършвайте или възложете одит на независима страна (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Само устни спецификации:</strong> Детайлен технически лист със спецификации, подписан от двете страни</li>
    <li><strong>Пропускане на одобрението на мостри:</strong> Писмено одобрение на мострите преди серийно производство</li>
    <li><strong>Липса на контрол по време на производството:</strong> Инспекция от независима страна по време на производство (DUPRO) и преди експедиция (PSI)</li>
    <li><strong>Пренебрегване на съответствието:</strong> Проверете CE/UKCA сертифицирането преди производството</li>
  </ul>

  <h2>7. Защо Afarer</h2>
  <p>Afarer произвежда OEM/ODM надуваеми плавателни съдове от 2012 г. С комплекс от 12 000 м&sup2;, сертифициран по ISO 9001, 25+ инженери и CE сертифициране на всички продуктови линии, ние отговаряме на всеки критерий от този наръчник. Предлагаме пробни MOQ за нови партньори и пълни пакети с документация за съответствие.</p>


content_programs:
  tagline: 'Партньорски програми'
  title: 'Партньорски програми,<br />изградени за растеж'
  subtitle: 'Независимо дали сте дистрибутор, дилър или марков партньор, afarer предлага програми, проектирани да подкрепят вашия бизнес.'
  columns: 3
  items:
    - title: 'Дистрибуторска програма'
      description: 'Изключителна териториална дистрибуция с обемни цени, маркетингова поддръжка и директен достъп до фабриката. Изисква се минимален ангажимент според размера на територията.'
      icon: tabler:world
    - title: 'Дилърска програма'
      description: 'Директни дилърски цени, продуктово обучение, маркетингови материали и гаранционна поддръжка за физически магазини и онлайн магазини.'
      icon: tabler:building-store
    - title: 'OEM/ODM партньорство'
      description: 'Пълнообхватно OEM и ODM производство с персонализирано брандиране, опаковка и продуктови спецификации. От концепцията до контейнера.'
      icon: tabler:certificate
    - title: 'Марково партньорство'
      description: 'Съвместни марки, частни етикети и програми с изключителни модели за утвърдени марки в сферата на морските и recreational активности.'
      icon: tabler:stars
    - title: 'Държавни и институционални'
      description: 'Програми за предпочитан доставчик за държавни агенции, брегови охрана, военни и хуманитарни организации. Документация, готова за обществени поръчки.'
      icon: tabler:building-community
    - title: 'Партньор за курорти и наемане'
      description: 'Флотни цени, последователно качество и персонализирано брандиране за курорти, гмуркане центрове и операции за наемане по целия свят.'
      icon: tabler:sun
content_benefits:
  tagline: 'Защо да партнирате с нас'
  title: 'Защо партньорите избират afarer'
  subtitle: 'Нашите партньори се възползват от реални производствени възможности, последователно качество и отзывчива поддръжка.'
  list:
    - 'Директен достъп до фабриката: Работете директно с нашия производствен екип — без посредници. Получете по-бързи отговори, по-добри цени и пълна видимост на производството.'
    - 'Готовност за персонализация: Брандирайте вашите продукти с персонализирани цветове, лого, опаковка и спецификации. Минимални количества за поръчка, съобразени с вашия пазар.'
    - 'Гарантирано качество: Производство, сертифицирано по ISO 9001, със съответствие CE, UKCA и BSCI. Всеки продукт е изпитан преди изпращане.'
    - 'Глобална логистика: Изпращане от Циндао, Китай с опции FOB, CIF и DDP. Американски склад в Монтклер, Калифорния за дистрибуция в Северна Америка.'
    - 'Маркетингова поддръжка: Продуктови каталози, фотография, техническа документация и дигитални активи в подкрепа на вашите продажби.'
    - 'Обучение и поддръжка: Продуктово обучение за вашия търговски екип, техническа поддръжка за вашите клиенти и координация на гаранционното обслужване.'
content_process:
  tagline: 'Как да станете партньор'
  title: 'Прост партньорски процес'
  subtitle: 'Нашият партньорски процес е ясен — проектиран да започнете да продавате продукти afarer бързо.'
  items:
    - title: 'Стъпка 1: Подайте кандидатура'
      description: 'Попълнете нашия формуляр за кандидатстване за партньорство с профила на вашата компания, целевия пазар и продуктовите интереси.'
    - title: 'Стъпка 2: Преглед на квалификацията'
      description: 'Нашият екип за партньорства преглежда вашата кандидатура и се свързва с вас в рамките на 3 работни дни, за да обсъди възможностите.'
    - title: 'Стъпка 3: Споразумение и настройка'
      description: 'Подпишете споразумение за партньорство, открийте ваша сметка и получете партньорски цени, маркетингови материали и продуктови мостри.'
    - title: 'Стъпка 4: Обучение и стартиране'
      description: 'Осигурени са продуктово обучение, поддръжка на продажбите и маркетингови материали. Готови сте да започнете продажби.'

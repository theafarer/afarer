stories:
  tagline: 'Истории на изследователи'
  title: 'Истински приключения от истински хора'
  subtitle: 'Чуйте от гребци, семейства и професионалисти, които използват оборудването на afarer на водата.'
  items:
    - name: 'Сара и Майк'
      title: 'Собственици на SUP Explorer 11, Канада'
      content: 'Взехме нашите Explorer 11 на седмично пътуване през парк Алгонкин. Те се справиха прекрасно с преносите през суша и езерните преходи. Drop-Stitch конструкцията означаваше, че можахме да надуеме до 15 PSI и да получим представяне на твърда дъска от дъска, която се пакетира.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Парк Алгонкин, Канада'
    - name: 'Карлос Р.'
      title: 'Ездач на Cheetah Surge, Испания'
      content: 'Cheetah Surge е моят избор за крайбрежни круизи. Живописният дизайн обръща глави на плажа, а стабилността ми дава увереност при леко вълнение. Управлява се прекрасно — независимо дали туризъм или просто се наслаждавам на залеза.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Коста Брава, Испания'
    - name: 'Лина и семейството'
      title: 'Гребци на Flowing Lotus, Швеция'
      content: 'Седмични семейни приключения из архипелага. Flowing Lotus е достатъчно стабилна, за да стои дъщеря ми върху нея, докато греба. Надува се за около 10 минути — без ремарке, чисто семейство забавление на водата.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Стокхолмски архипелаг, Швеция'
    - name: 'Капитан-лейтенант Андрес'
      title: 'Изследовател с Ocean Voyager, Филипини'
      content: 'Използвам своя Ocean Voyager за дълги крайбрежни обиколки около Палаван. След месеци ежедневна употреба в тропически условия дъската все още се представя като нова. Туристическата форма прорязва вълнение, което би спряло по-слабите дъски.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Палаван, Филипини'
    - name: 'Ема Т.'
      title: 'Начинаеща с Tropical Breeze, Австралия'
      content: 'Никога преди не бях правила SUP. Tropical Breeze е толкова стабилна, че се почувствах уверена от първия опит. Сега гребам всяка седмица. Кривата на обучение е практически нулева — а дъската изглежда невероятно на водата.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Голд Коуст, Австралия'


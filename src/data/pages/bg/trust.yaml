faqs_sup:
  title: 'Често задавани въпроси за SUP дъските'
  subtitle: 'Чести въпроси за нашите дъски за стоене прав.'
  columns: 2
  items:
    - title: 'Какви размери SUP дъски предлага afarer?'
      description: 'Предлагаме SUP дъски от 9 до 12 фута, обхващащи всичко — от компактни универсални дъски до туристически и специализирани дизайни. Всеки модел е наличен с множество опции за конфигурация.'
    - title: 'Каква е разликата между надуваема SUP дъска и твърда SUP дъска?'
      description: 'Надуваемата SUP дъска използва конструкция Drop-Stitch с хиляди вътрешни нишки, позволяващи високо въздушно налягане, докато твърдата SUP дъска използва епоксидна смола или фиберглас. Надуваемите SUP дъски предлагат преносимост и удобство при съхранение, без да се жертва твърдостта.'
    - title: 'Какво е тегловното ограничение за SUP дъските?'
      description: 'Нашите SUP дъски издържат до 150 kg в зависимост от модела и обема. Всяка продуктова страница посочва максималната товароносимост за вашия модел.'
    - title: 'SUP дъските на afarer сертифицирани ли са по CE?'
      description: 'Да. Всички модели SUP за отдих са сертифицирани по CE съгласно приложимите европейски стандарти за употреба за отдих.'
    - title: 'Каква е гаранцията на SUP дъските?'
      description: 'Всички SUP дъски на afarer идват със стандартна едногодишна гаранция срещу производствени дефекти, покриваща разрушаване на шевове, дефекти на вентили и разслояване на материалите при нормална употреба.'
    - title: 'Колко време отнема надуването на SUP дъска?'
      description: 'С включената ръчна помпа пълното надуване до 15 PSI отнема приблизително 8–12 минути. За по-бързо надуване препоръчваме нашата електрическа помпа afarer 12V, която надува дъска за под 4 минути.'

faqs_materials:
  title: 'Често задавани въпроси за материали и грижи'
  subtitle: 'Чести въпроси за нашите материали за надуваеми SUP дъски, грижите и съхранението им.'
  columns: 2
  items:
    - title: 'От какви материали са направени надуваемите SUP дъски на afarer?'
      description: 'Използваме PVC с военен клас (1100 ден) с UV-стабилизирана, устойчива на износване конструкция, съответстваща на регламентите REACH и RoHS на ЕС.'
    - title: 'Колко дълго издържат надуваемите SUP дъски?'
      description: 'При правилна грижа качествената надуваема SUP дъска от PVC издържа 5–10 години. Редовното почистване, UV защитата и правилното съхранение значително удължават експлоатационния живот.'
    - title: 'Каква поддръжка изисква една надуваема SUP дъска?'
      description: 'Основната поддръжка включва изплакване с прясна вода след всяка употреба (особено в солена вода), сушене преди съхранение, годишна проверка на уплътненията на вентилите и избягване на продължително излагане на слънце, когато дъската не се използва.'
    - title: 'Могат ли надуваемите SUP дъски да се използват в солена вода?'
      description: 'Да. Всички надуваеми SUP дъски на afarer са проектирани за употреба както в сладка, така и в солена вода. Препоръчваме изплакване с прясна вода и основно сушене след контакт със солена вода.'
    - title: 'Как да съхранявам надуваема SUP дъска?'
      description: 'Изпуснете, почистете и напълно изсушете дъската преди съхранение. Навийте на ръка (избягвайте тесни сгъвки), съхранявайте на хладно и сухо място, далеч от директна слънчева светлина, и не я поставяйте директно върху бетонен под, за да предотвратите просмукването на влага.'
    - title: 'Какъв е товароносимият капацитет на надуваемите SUP дъски на afarer?'
      description: 'Товароносимостта варира от 100 kg за най-малките ни модели до над 200 kg за по-големите дъски. Всяка продуктова страница посочва максималната товароносимост за вашия модел.'


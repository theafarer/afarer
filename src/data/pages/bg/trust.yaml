steps2_manufacturing:
  title: 'Как осигуряваме качеството'
  subtitle: 'От входящия контрол на суровините до финалното изпитване на налягане — всеки продукт преминава през строга качествена верига.'
  items:
    - title: 'Входящ контрол на суровините'
      description: 'Всяко руло PVC тъкан се изпитва за дебелина, якост на опън и UV устойчивост, преди да влезе в производството.'
      icon: 'tabler:search'
    - title: 'Оперативен контрол по време на производството'
      description: 'Заварените шевове, монтажът на вентилите и съединенията между камерите се проверяват на всеки работен пост по време на сглобяването.'
      icon: 'tabler:eye'
    - title: 'Изпитване на налягане'
      description: 'Всеки надуваем продукт се надува до 1,25 пъти номиналното PSI и се задържа 24–48 часа за проверка на задържането на въздуха и целостта на шевовете.'
      icon: 'tabler:wind'
    - title: 'Финална инспекция'
      description: 'Всяка единица се проверява за обработка, фурнитура и опаковка, преди да бъде одобрена за изпращане. Образци от партидата отиват в нашата лаборатория за разрушителни изпитвания.'
      icon: 'tabler:clipboard-check'


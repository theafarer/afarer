      description: 'Основни знания за безопасност, които всеки гребащ трябва да притежава — време, спасителни жилетки, самоспасяване и други.'
      icon: 'tabler:shield'
      href: '/learn/water-safety'
    - title: 'Наръчник за материали'
      description: 'Класове PVC, Drop-Stitch технология, ден рейтинг — разберайте от какво е направено вашето оборудване.'
      icon: 'tabler:flask'
      href: '/learn/materials'
    - title: 'Наръчник за размери на SUP'
      description: 'Намерете правилните дължина, ширина и обем на дъската според вашето тегло, умение и стил на гребане.'
      icon: 'tabler:ruler'
      href: '/size-guide'
    - title: 'Техники за средно напреднали'
      description: 'Повишете нивото на вашето гребане с напреднали удари, техники за завиване и управление в бурна вода.'
      icon: 'tabler:droplet'
      href: '/learn/intermediate-techniques'


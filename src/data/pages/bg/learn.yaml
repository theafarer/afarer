featured:
  tagline: 'Представени теми'
  title: 'Започнете вашето обучително пътуване'
  subtitle: 'Дали сте нови във водните спортове или искате да повишите нивото си, нашите наръчници ви покриват.'
  items:
    - title: 'Основи на SUP'
      description: 'Всичко, което един начинаещ трябва да знае — типове дъски, размер на греблото, стойка и съвети за първия ден.'
      icon: 'tabler:lifebuoy'
      href: '/learn/sup'
    - title: 'Надуваема срещу твърда дъска'
      description: 'Коя е правилната за вас? Сравняваме преносимост, представяне, издръжливост и цена едно до друго.'

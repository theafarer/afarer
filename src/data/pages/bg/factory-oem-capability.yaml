    lead_time: 30–45 дни
  - product: Спасителни жилетки и безопасност
    standard_moq: 100–200 броя
    custom_moq: 1 000+ броя
    lead_time: 20–30 дни

why_us:
  - title: Вертикална интеграция
    description: Притежаваме нашата фабрика, форми и верига за доставки — без посредници, без подизпълнители. Това ни дава контрол върху качеството, разходите и доставката.
  - title: Двойна сертификация
    description: ISO 9001 управление на качеството и BSCI сертификация за социално съответствие. Одитни доклади за фабриката са налични при поискване.
  - title: CE съответствие
    description: Всички стандартни модели носят CE 2013/53/EU сертифициране. Персонализираните модели могат да бъдат CE сертифицирани чрез нашия установен процес.
  - title: Ниско MOQ
    description: Започнете само с 5 броя за стандартни модели. Помагаме на новите марки да стартират, без да поемат излишни складови наличности.

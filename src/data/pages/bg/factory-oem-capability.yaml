  tagline: OEM/ODM производство
  title: OEM и производство под собствена марка
  subtitle: От концепцията до контейнера — персонализирайте всеки детайл от вашата линия за надуваеми SUP

intro: afarer предлага изчерпателни OEM и ODM услуги за марки, дистрибутори и правителствени агенции по целия свят. С 10+ години опит в износа и фабрика от 12 000 м², сертифицирана по ISO 9001 и BSCI, ние се грижим за всичко — от проектирането на продукта и разработването на форми до производство в пълен мащаб, опаковане и логистика.


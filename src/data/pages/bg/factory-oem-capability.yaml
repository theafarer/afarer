services:
  - title: Проектиране и инженеринг на продукта
    description: Нашият собствен R&D екип работи с ваша концепция или спецификация, за да разработи CAD чертежи, 3D модели и прототипи. Предлагаме проектиране на форми, оптимизация на формата на корпуса и насоки при избора на материали.
  - title: Персонализирано брандиране и графики
    description: Пълноцветен дигитален печат, ситопечат, щамповане и варианти с етикети. Разработваме графики за палубата, специфични за марката, брандиране на тръбите и опаковки, готови за продажба на дребно.
  - title: Персонализация на материали и спецификации
    description: Изберете измежду PVC (стандартно, екологично, самозагасващо се), Drop-Stitch и хибридни конструкции. Персонализирани цветове на тръбите, тегло на плата и варианти за подсилване.
  - title: Опаковане и логистика
    description: Персонализирана търговска опаковка, кутии под собствена марка, вакуумно пакетиране, палетизиране и товарене на контейнери. Налични условия за доставка FOB Циндао, CIF или DDP.

moq_table:
  - product: Надуваеми SUP дъски
    standard_moq: 5–10 броя

meta:
  title: 'Как да изберете дебелина на SUP дъската — инженерен анализ | {SITE}'
  description: 'Техническо ръководство за дебелината на надуваемите SUP дъски: как се различават дъските с 4", 5" и 6" по твърдост, тегло, стабилност, следене и производителност. Препоръки за дебелина за туризъм, йога, сърф, състезания и универсално гребане.'
back_text: 'Обратно към изследванията'

hero:
  tagline: 'Инженерство'
  title: 'Как да изберете дебелина на SUP дъската — инженерен анализ'
  subtitle: 'Време за четене: 6 мин'

content_html: |
  <h2>Трите стандартни дебелини</h2>

  <h3>4" (10 cm) – Туризъм и производителност</h3>
  <ul>
    <li>Най-висока твърдост – по-малко огъване под товар</li>
    <li>Най-лека – по-малко материал, по-малък въздушен обем</li>
    <li>Отлично следене – намалено клатене от страна на страна</li>
    <li>Най-бърза – намалено съпротивление, по-лесно плъзгане</li>
    <li>Най-подходяща за: Туризъм, състезания, фитнес гребане, опитни гребци</li>
  </ul>

  <h3>5" (12,7 cm) – Универсална</h3>
  <ul>
    <li>Добра твърдост – балансирано съотношение между гъвкавост и твърдост</li>
    <li>Умерено тегло – стандартна употреба на материал</li>
    <li>Добра първична и вторична стабилност</li>
    <li>Най-подходяща за: Рекреативно гребане, начинаещи, неангажиращо каране по езера и реки</li>
  </ul>

  <h3>6" (15,2 cm) – Стабилност и йога</h3>
  <ul>
    <li>Най-висока първична стабилност – огромна плавателност</li>
    <li>Най-тежка – повече PVC материал, по-голям въздушен обем</li>
    <li>Най-бавна – повече съпротивление, по-трудно поддържане на плъзгането</li>
    <li>Най-подходяща за: Йога/фитнес, тежки гребци (100+ kg), много вълнение</li>
  </ul>

  <h2>Инженерен анализ</h2>
  <p>Твърдостта на една надуваема SUP се определя от вътрешното въздушно налягане и момента на инерция на напречното сечение на дъската. При 20 PSI дъска с дебелина 4" показва приблизително с 30% по-малко прогиване под товар от дъска с дебелина 6" със същата ширина и дължина. Първичната стабилност идва от ширината по водолинията и плавателността; вторичната стабилност се влияе от формата на бордовете и ширината на дъската.</p>

  <h2>Дебелина според теглото на гребеца</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Тегло на гребеца</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Препоръчителна дебелина</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Под 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" или 6"</td></tr>
      <tr><td class="p-3 border">Над 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Компромис между дебелина и PSI</h2>
  <p>Често срещано погрешно схващане е, че по-високото PSI може да компенсира прекомерната дебелина. При 25 PSI дъска с дебелина 6" показва повече огъване от дъска с дебелина 4" при 15 PSI, защото геометричният момент на инерция доминира в уравнението на твърдостта. За гребци, ориентирани към производителност, по-тънката дъска при по-ниско налягане надминава по-дебелата дъска при по-високо налягане.</p>

  <h2>Гамата на Afarer</h2>
  <ul>
    <li><strong>Дъски с 4":</strong> серия Cheetah Touring – 12' x 30" x 4" туристически SUP за фитнес и гребане на дълги разстояния</li>
    <li><strong>Дъски с 5":</strong> серия Cheetah All-Round – 10'6" x 32" x 5" за рекреативна употреба</li>
    <li><strong>Дъски с 6":</strong> серия Cheetah Ultra-Stable – 10' x 34" x 6" за йога, едри гребци и фотографски платформи</li>
  </ul>
  <p>Всички дъски използват Drop-Stitch сърцевини 1 680 DTEX с номинално налягане 20 PSI и PVC ламинати с дебелина 1,2 mm.</p>


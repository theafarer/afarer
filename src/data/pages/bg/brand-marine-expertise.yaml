meta:
  title: 'Морска експертиза — инженерство във всеки корпус | {SITE}'
  description: 'Десетилетия морско инженерство във всеки корпус. afarer владее Drop-Stitch, морски PVC и професионален дизайн на надуваеми SUP дъски.'
  keywords:
    - 'морско инженерство'
    - 'производител на надуваеми SUP дъски'
    - 'производство на дъски за гребане'
hero:
  tagline: 'Морска експертиза'
  title: 'Десетилетия морско инженерство<br />във всеки корпус'
  subtitle: 'afarer съчетава дълбока наука за материалите, прецизно производство и реални изпитвания, за да произвежда плавателни съдове, които се представят, когато има значение.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'морското инженерство и R&D екипът на afarer на работа'
expertise_materials:
  tagline: 'Наука за материалите'
  title: 'Изборът на правилния материал<br />за всяко приложение'
  subtitle: 'Работим с два основни материала — всеки избран за конкретни случаи на употреба и изисквания за производителност.'
  columns: 3
  items:
    - title: 'PVC с морски клас'
      description: 'PVC тъкан 1100 ден — нашият най-универсален материал. UV-стабилизиран, устойчив на износване и съответстващ на REACH. Идеален за SUP дъски, където теглото и ефективността на разходите имат значение.'
      icon: tabler:droplet
    - title: 'Фиберглас и полиетилен'
      description: 'SUP дъски с фибергласов ламинат за премиум твърдост и плъзгане. Ротационно формован полиетилен за тежка наемна и спасителна употреба, изискваща максимална ударна устойчивост.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Производствени възможности'
  title: 'Прецизно производство<br />на всеки етап'
  subtitle: 'Нашето предприятие с площ 12 000 m² е оборудвано със специализирани машини за всеки етап на производството.'
  columns: 2
  items:
    - title: 'CNC рязане'
      description: 'Компютърно управляваното рязане осигурява прецизни, повтарящи се тъканни панели с минимални отпадъци. Всяка част пасва точно според дизайна.'
      icon: tabler:cpu
    - title: 'Заваряване с високочестотен ток'
      description: 'Индустриалното HF заваряване създава шевове, по-здрави от основния материал. Последователен контрол на температурата и налягането осигурява херметични уплътнения във всяка производствена серия.'
      icon: tabler:bolt
    - title: 'Сглобяване на Drop-Stitch сърцевина'
      description: 'Хиляди полиестерни нишки свързват горния и долния слой тъкан, позволявайки надуване при високо налягане (15–20 PSI) за твърди, стабилни SUP дъски.'
      icon: tabler:building-arch
    - title: 'Изпитване на налягане'
      description: 'Всеки надуваем продукт се изпитва на налягане преди изпращане. Дъските се изпитват при 1,25 пъти номиналното налягане — ако издържи там, ще се представи на водата.'
      icon: tabler:wind
    - title: 'Изпитване на якостта на шевовете'
      description: 'Случайни мостри от всяка производствена партида преминават през разрушително изпитване на якостта на шевовете. Резултатите се регистрират и са проследими до конкретни производствени серии.'
      icon: tabler:files
    - title: 'Изпитване във вода'
      description: 'Всеки модел преминава през морски изпитвания преди сертификация. Реалните изпитвания в крайбрежни условия валидират производителността, управлението и стабилността.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Дизайн и инженерство'
  title: 'Проектирани за реални условия'
  subtitle: 'Нашата дизайнерска философия започва от това как ще се използва дъската — след което изгражда инженерството около този случай на употреба.'
  items:
    - title: 'Производителен дизайн на корпуса'
      description: 'Всяка форма на корпуса е настроена за своя случай на употреба — водоизместващи носове за туристическо плъзгане, добавен рокер за сърф гъвкавост, плоски стабилни профили за риболов и йога.'
    - title: 'Drop-Stitch безопасност'
      description: 'Всяка дъска има твърда Drop-Stitch сърцевина с подсилени бордове. Ако някой участък е повреден, високоякната Drop-Stitch структура поддържа дъската работоспособна.'
    - title: 'Ергономично разположение на палубата'
      description: 'Зониране на палубната подложка, позиция на дръжката за носене и точки за монтиране са проектирани около комфорта на ездача при продължителна употреба — независимо дали е туризъм, риболов или патрул.'
    - title: 'Персонализирана конфигурация'
      description: 'Цветове на бордовете, конфигурация на палубната подложка, крепежи за аксесоари, капацитет за багаж — всеки модел може да бъде персонализиран според конкретни оперативни изисквания.'

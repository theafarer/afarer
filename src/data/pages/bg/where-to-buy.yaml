meta:
  title: Къде да купите надуваеми paddle дъски Afarer | Afarer
  description: Научете как да купите надуваема paddle дъска Afarer — чрез официален дистрибутор във вашата държава или директно от екипа на Afarer.
hero:
  tagline: Къде да купите
  title: Излезте на водата с вашия Afarer SUP
  subtitle: Дъските Afarer достигат до гребци в повече от 50 държави. Намерете най-лесния начин да се сдобиете с вашата — чрез официален дистрибутор наблизо или директно от екипа на Afarer.
channels:
  items:
    - title: Официални дистрибутори по държави
      description: Afarer работи с изключителни дистрибутори в много държави. Кажете ни къде гребате и ще ви свържем с вашия местен търговец, цени и наличност.
      cta: Намерете местния си търговец
      href: /contact/?subject=Where to Buy
    - title: Директна поръчка от Afarer
      description: Още няма дистрибутор във вашата държава? Екипът на Afarer може да уреди директни поръчки и доставка, за да излезете на водата, където и да живеете.
      cta: Запитване за наличност
      href: /contact/?subject=Where to Buy
form_intro:
  title: Запитване за наличност
  subtitle: Изпратете ни съобщение с държавата си и дъската, която ви интересува. Екипът ни ще отговори в рамките на един работен ден с най-близкия търговец или варианти за директна поръчка.
business_note:
  text: Пазарувате за клуб, курорт или магазин? Разгледайте нашите бизнес и партньорски програми.
  cta: За бизнес партньори

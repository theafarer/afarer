intro: 'Всяка дъска, която напуска нашата работилница, носи сертификацията, че е преминала определен набор от инспекции на качеството и изпитвания на материалите. Нашата лаборатория за качество и инспекция е независима функция в организацията — тя докладва директно на управляващия директор, а не на производството — което гарантира, че никакъв търговски натиск не може да компрометира инспекционния контрол. Ако партида материал или завършена дъска не отговаря на публикуваната спецификация, лабораторията има правомощието да спре изпращането, докато несъответствието не бъде отстранено.'

content_html: |
  <h2>Доверявай се, но проверявай</h2>
  <p>Лабораторията работи по система за управление на качеството, съобразена с принципите, а нашите методи за изпитване се основават на стандартите ISO, ASTM и EN, когато е приложимо. Поддържаме подробни записи на всяко извършено изпитване, създавайки пълна верига за проследяемост от приемането на суровините до доставката на финалната дъска.</p>

  <h2>Изпитвателно оборудване и възможности</h2>
  <table>
    <thead><tr><th>Оборудване</th><th>Изпитвания</th><th>Стандарт / метод</th></tr></thead>
    <tbody>
      <tr><td>Универсална изпитвателна машина (50 kN)</td><td>Якост на опън (тъкан), устойчивост на отлепване (шевове), разпространение на разкъсване</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Стенд за изпитване на задържане на въздух (програмируем)</td><td>Издръжливост при 1000 цикъла надуване/изпускане, 30-минутно изпитване на задържане на налягане</td><td>EN ISO 25649 (вътрешен)</td></tr>
      <tr><td>Устройство за отлепване на шевове (моторизирано отлепване на 180°)</td><td>Якост на отлепване на заварени и слепени шевове при 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Тестер за хидростатично налягане</td><td>Устойчивост на проникване на вода на тъканта (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Цифров дебелиномер и микрометър</td><td>Дебелина на тъканта, дебелина на стената на борда, дебелина на адхезивния филм</td><td>ISO 2286-3</td></tr>
      <tr><td>Климатична камера</td><td>Температурно кондициониране (-40 °C до +80 °C) за изпитвания на студено напукване и топлинно стареене</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Спектрофотометър за цвят</td><td>Измерване на цвета Delta-E след UV излагане</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Инспекционните контролни точки — от материала до доставката</h2>
  <p>Всяка дъска следва определен план за качество със задължителни инспекционни точки. Нито една дъска не може да пропусне контролна точка; всяка точка трябва да бъде подписана от инспектор по качеството, преди да започне следващият производствен етап.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Входяща инспекция на материалите</p>
            <p class="text-xs text-gray-500 mt-1">Партида тъкан, партида адхезив, фурнитура — всичко се проверява спрямо входящата спецификация преди предаване към производството.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Инспекция на заваръците по време на процеса</p>
            <p class="text-xs text-gray-500 mt-1">Първи заваръчен образец, изпитан (отлепване + визуален контрол) в началото на всеки производствен екип.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Въздушно изпитване на камерите</p>
            <p class="text-xs text-gray-500 mt-1">Всяка камера се надува до 1,5 пъти работното налягане и се задържа 30 мин. Данните се записват по сериен номер.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Инспекция преди доставка</p>
            <p class="text-xs text-gray-500 mt-1">Цялостна инспекция на дъската: всички крепежни елементи затегнати, фитингите функционират, без козметични дефекти. Контролен списък от 100 точки.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Точка 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Финална сертификация</p>
            <p class="text-xs text-gray-500 mt-1">Изпитвателните доклади са съставени, инспекционните записи прегледани, издаден е сертификат за съответствие.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Ключови показатели за качеството (пълзяща средна стойност за 2025 г.)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Добив при първо преминаване (партида тъкан)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Процент брак при заваряване (линеен метър)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Камери, изпитани на въздух преди сглобяване</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">Съответствие с проектната категория</span>
    </div>
  </div>

  <h2>Нашият екип по качество</h2>
  <p>Лабораторията се състои от мениджър качество (10 години в морския контрол на качеството, ASQ Certified Quality Engineer), двама инспектори по качеството (всеки със сертификат NDT ниво 2 за визуално изпитване) и техник по материалите, отговорен за всички физически изпитвания. Екипът преминава годишни проверки на професионалната компетентност чрез независим външен доставчик на услуги, за да гарантираме, че нашите резултати от изпитванията остават точни и възпроизводими.</p>

  <h2>Независими изпитвания за клиенти</h2>
  <p>Нашата лаборатория за качество и инспекция предлага услуги за независими изпитвания. Ако трябва да проверите спецификация на тъкан, да валидирате нова адхезивна система или да получите изпитвателен доклад от независима страна за квалификация в обществена поръчка, ние можем да извършим изпитванията съгласно приложимия стандарт и да издадем сертифициран изпитвателен доклад.</p>
  <p>Примери от скорошната ни работа по изпитвания от независими страни:</p>
  <ul>
    <li>Сравнение на якостта на отлепване на пет конкурентни адхезивни филма за европейска военна програма за обществени поръчки.</li>
    <li>Проучване на ускорено стареене (UV + термични цикли) за нова PVC формула с оранжев пигмент, с редовни междинни измервания на всеки 500 h.</li>
    <li>Валидиране на задържането на въздуха при 50 прототипни клапани за прегради за нов дизайн на камера с високо налягане.</li>
  </ul>

  <h2>Нашият ангажимент към вас</h2>
  <p>Когато получите дъска Afarer, получавате също и нейното досие за качество — съставен запис на резултатите от изпитванията, приложими за вашата конкретна дъска. Сертификат за партидата тъкан, изпитвания на отлепване на заваръците, журнали от въздушните изпитвания на камерите и контролен списък за инспекцията преди доставка. Всяко число е проследимо. Всеки инспектор е идентифициран. Това не е просто документация — това е нашето обещание, че това, което доставихме, е точно това, което специфицирахме.</p>
  <p>Ако някога имате забележка относно качеството, можете да се свържете директно с лабораторията — контактните данни са отпечатани върху вашия сертификат за съответствие. Подхождаме сериозно към всяко запитване и се ангажираме с официално разследване в рамките на 48 часа.</p>


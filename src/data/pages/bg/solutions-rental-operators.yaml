meta:
  title: 'Доставчик на SUP оборудване за наемане и решения за флотилии | {SITE}'
  description: 'Доставчик на SUP оборудване за наемане за оператори. Търговски SUP дъски с висока ротация, проектирани за ежедневна употреба — UV-устойчив PVC, подсилени шевове, бързо съхнещи материали. Разширете вашия бизнес за наемане с Afarer.'

hero:
  tagline: Оператори на наемане
  title: 'Разширете вашия бизнес за наемане<br />с увереност'
  subtitle: 'Доставчик на SUP оборудване за наемане за оператори. SUP дъски с висока ротация, проектирани за ежедневно наемане, 365 дни в годината. Вашите приходи никога не почиват.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Оживено куче за наемане с SUP дъски, готови за гости

features:
  title: Създадени за натоварването при наемане
  subtitle: 'Всяка дъска е проектирана за 500+ цикъла на наемане с минимална поддръжка.'
  items:
    - title: '500+ цикъла на наемане'
      description: 'Изпитани да оцелеят след ежедневна употреба в солена вода, слънце и пясък.'
      icon: 'tabler:shield-check'
    - title: 'UV-устойчив плат'
      description: 'Без избеляване или деградация след 1 година съхранение на открито.'
      icon: 'tabler:sun'
    - title: 'Подсилени шевове'
      description: '3 пъти по-здрави от стандартната конструкция на надуваема дъска.'
      icon: 'tabler:layers-intersect'
    - title: 'Бързо съхнещи материали'
      description: 'Дъски, готови за следващо наемане за по-малко от 30 минути.'
      icon: 'tabler:droplet'
    - title: 'Съхранение чрез подреждане'
      description: 'Пестящ пространство дизайн — съхранявайте с 40% повече дъски на същата площ.'
      icon: 'tabler:stack'
    - title: 'Размери с цветово кодиране'
      description: 'Персоналът взима правилната дъска мигновено благодарение на цветовото кодиране на размерите.'
      icon: 'tabler:color-swatch'


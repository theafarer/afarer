content_html: |
  <h2>Какво е Drop-Stitch?</h2>
  <p>Drop-Stitch (наричана още „Drop-Stitch тъкан“ или „Drop-Stitch сърцевина“) е метод на конструкция, при който хиляди отделни полиестерни нишки свързват горния и долния слой на тъканна обвивка. Когато обвивката се надуе, тези нишки действат като вътрешни елементи на опън — те не позволяват на горния и долния панел да се издуват навън в кръгла форма, принуждавайки панела да остане плосък и твърд.</p>
  <p>Резултатът е лека, преносима конструкция, която издържа вътрешно налягане от 15 – 20 PSI — сравнимо с твърдостта на дъска с твърд корпус, но напълно спускаема за съхранение и транспорт.</p>

  <h2>Как работи: физиката</h2>
  <p>В една конвенционална надуваема конструкция (като балон или въздушен дюшек) вътрешното въздушно налягане избутва еднакво във всички посоки. Без вътрешно задържане конструкцията става цилиндрична или сферична. Drop-Stitch решава това, като въвежда опъчно подсилване:</p>
  <ul>
    <li>Хиляди нишки свързват горния и долния слой тъкан</li>
    <li>При надуване въздушното налягане се стреми да избута горния и долния слой един от друг</li>
    <li>Нишките се съпротивляват на това разделяне, пренасяйки натоварването в опън по оста на нишката</li>
    <li>Резултатът е плосък, твърд панел, който устоява на огъване</li>
  </ul>

  <h2>Производствен процес</h2>
  <ol>
    <li><strong>Тъкане:</strong> Полиестерни нишки се тъкат едновременно в два отделни слоя основна тъкан (обикновено 1 100 DTEX или 1 680 DTEX полиестер с PVC покритие). Нишките се вплитат примерно между слоевете под ъгъл 90&deg;.</li>
    <li><strong>Покритие:</strong> Тъканата основа се покрива с PVC (или понякога TPU) чрез процес на покритие с нож или календърно покритие. Това уплътнява нишките и създава херметичната мембрана.</li>
    <li><strong>Слепване на слоевете:</strong> Drop-Stitch сърцевината се слепва с външни ламинирани слоеве (обикновено 0,9 mm или 1,2 mm PVC) чрез топлинно ламиниране или адхезив.</li>
    <li><strong>Заваряване:</strong> Бордовите ленти се заваряват по краищата чрез заваряване с горещ въздух, RF заваряване или заваряване с високочестотен ток, за да се образуват страничните стени на дъската.</li>
    <li><strong>Монтаж на вентили:</strong> Монтират се Boston вентили или Halkey-Roberts вентили, обикновено с механизъм за обезналягане, който предотвратява пренадуването.</li>
  </ol>

  <h2>Ключови качествени показатели</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Параметър</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Входно ниво</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Премиум</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Плътност на нишките</td><td class="p-3 border">1 нишка / кв. инч</td><td class="p-3 border">2 нишки / кв. инч</td></tr>
      <tr><td class="p-3 border">Основна тъкан</td><td class="p-3 border">1 100 DTEX</td><td class="p-3 border">1 680 DTEX</td></tr>
      <tr><td class="p-3 border">Максимално налягане</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Дебелина на PVC</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 border">Конструкция на борда</td><td class="p-3 border">Сгънат и слепен</td><td class="p-3 border">Заварен и фузионно свързан</td></tr>
    </tbody>
  </table>

  <h2>Приложения</h2>
  <ul>
    <li><strong>SUP дъски:</strong> дебелина 4" – 6", 15 – 20 PSI, 1 – 2 нишки/кв. инч</li>
    <li><strong>Каяци:</strong> Drop-Stitch под + надуваеми странични камери, 10 – 15 PSI за пода</li>
  </ul>

  <h2>Drop-Stitch срещу твърда палуба (фибергласова или дървена сърцевина)</h2>
  <p>Дъските с твърд корпус използват EPS пенести сърцевини с подсилване от фиберглас или дървени надлъжни греди. Те са по-леки, по-твърди и по-отзывчиви — но не могат да се спускат. Drop-Stitch разменя част от твърдостта за пълна преносимост. За повечето recreational потребители съвременните Drop-Stitch SUP дъски при 20 PSI са неотличими по твърдост от входното ниво на твърдите дъски.</p>

  <h2>Как Afarer използва Drop-Stitch</h2>
  <p>Afarer използва 1 680 DTEX Drop-Stitch сърцевина в цялата си SUP гама, с 2 нишки на квадратен инч и 1,2 mm PVC външен ламинат. Дъските са рассчитени на 20 PSI и преминават 24–48 часово изпитване на задържане на налягане при 1,25 пъти номиналното налягане преди изпращане. Бордовите ленти са заварени с горещ въздух с трислойна фузия, а вентилите за обезналягане са стандартни за всички модели.</p>


hero:
  tagline: Laboratório de Controle de Qualidade
  title: Laboratório de Testes e Garantia de Qualidade
  subtitle: Laboratório de qualidade independente com processos ISO 9001 — cada unidade testada antes do envio
intro: >-
  A Farer opera um laboratório de controle de qualidade dedicado que funciona de forma independente da produção. Cada lote de matéria-prima e cada barco acabado passa por protocolos de inspeção documentados antes da liberação. Nossa equipe de QC se reporta diretamente à administração, garantindo
  decisões de qualidade imparciais.
highlights:
  - value: 100%
    label: Unidades testadas quanto à pressão
    detail: Cada câmara, cada barco
  - value: 48 h
    label: Duração do teste de retenção de ar
    detail: A 1,25× a pressão nominal
  - value: <5%
    label: Queda de pressão máxima permitida
    detail: Período de retenção superior a 24 horas
  - value: AQL 2,5
    label: Limiar de defeito grave
    detail: Amostragem conforme ISO 2859
test_procedures:
  - title: Inspeção de Matéria-Prima
    description: Cada lote recebido de PVC, Hypalon, tecido drop-stitch e ferragens é testado antes da aceitação. A resistência à tração (ASTM D751), resistência ao rasgo (ISO 4674) e resistência aos raios UV são verificadas. Materiais não conformes são colocados em quarentena e devolvidos.
    standards:
      - ASTM D751 (tração)
      - ISO 4674 (rasgo)
      - ISO 4892 (UV)
  - title: Pontos de Verificação de Controle de Qualidade em Processo
    description: Os operadores de produção realizam autoinspeção em cada etapa. Auditores de QC conduzem amostragem aleatória durante todo o turno. Testes de descascamento de solda são realizados a cada 50 unidades. Verificações dimensionais acontecem a cada 20º painel.
    standards:
      - ASTM D751 (desgaste)
      - Checklist interno de 100 pontos
      - Amostragem ISO 2859
  - title: Teste de Retenção de Ar de 48 Horas
    description: Cada câmara do tubo é inflada a 125% da pressão nominal e mantida por 48 horas. Sensores de pressão registram continuamente com compensação de temperatura. Qualquer câmara que exceda uma queda de pressão de 5% aciona a re-inspeção automática do lote.
    standards:
      - ISO 6185
      - CE 2013/53/UE
  - title: Teste de Carga e Balanceamento
    description: Os barcos concluídos são testados na capacidade máxima nominal para estabilidade, bordo livre e manuseio. Cada embarcação passa por testes na água antes da aprovação da inspeção final.
    standards:
      - ISO 12217
      - CE 2013/53/UE
equipment:
  - name: Máquina universal de ensaios (tração)
    spec: 5 kN, conforme ASTM D751
  - name: Pressure Decay Tester
    spec: Multicanal, 0–50 psi, registro de dados
  - name: UV Weathering Chamber
    spec: ISO 4892, ciclos de 1.000 h
  - name: Medidor de espessura (digital)
    spec: resolução de 0,01 mm
  - name: Peel Tester (weld)
    spec: Motorizado, capacidade de 50 N
  - name: Temperature Chamber
    spec: '-40 °C a 100 °C'
  - name: Leak Detection Tank
    spec: 6 m × 2 m, iluminado

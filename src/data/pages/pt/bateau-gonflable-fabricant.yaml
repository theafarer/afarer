faqs:
  title: 'FAQ de Fabrico de Barcos Infláveis'
  subtitle: 'Respostas para lançar o seu projeto OEM de barcos infláveis.'
  items:
    - title: 'Que tipos de barcos infláveis fabricam?'
      description: 'Tender infláveis, dinghies pneumáticos, barcos de pesca, barcos de trabalho e modelos de PVC à medida.'
    - title: 'Podem personalizar um barco inflável?'
      description: 'Sim — logótipo, cores, anteparas, reforços e opções de motor conforme a sua especificação.'
    - title: 'Qual é o prazo de um projeto OEM de barcos?'
      description: 'A amostra é expedida em 3-4 semanas e a produção em série em 35-50 dias, dependendo do modelo.'

hero_text:
  tagline: Obter um Orçamento
  title: Solicite um Orçamento<br />para seu Projeto
  subtitle: Conte-nos seus requisitos. Respondemos com orçamento detalhado em 2 dias úteis.
steps2_process:
  title: Como Funciona
  subtitle: Quatro etapas simples da consulta ao orçamento.
  items:
    - title: 'Etapa 1: Envie seus requisitos'
      description: Preencha o formulário com tipo de produto, quantidade e especificações.
      icon: tabler:file-text
    - title: 'Etapa 2: Revisamos & aconselhamos'
      description: Nossa equipe de engenharia analisa seus requisitos e recomenda configurações.
      icon: tabler:users
    - title: 'Etapa 3: Receba seu orçamento'
      description: Você recebe um orçamento detalhado com preços, MOQ, prazos, condições de pagamento e envio. Geralmente em 48 horas.
      icon: tabler:currency-dollar
    - title: 'Etapa 4: Amostra & Produção'
      description: Após aceitação do orçamento, seguimos para produção de amostras ou diretamente para
      icon: tabler:building-factory
content_form:
  tagline: Formulário de Cotação
  title: Fale sobre seu projeto
  subtitle: Todos os campos com * são obrigatórios.
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Centro de Mergulho
        - Pesca
        - Turismo Marítimo / Resort
        - Busca e Resgate
        - Lanchinha de iate
        - Embarcação Comercial de Trabalho
        - Governo / Militar
        - OEM / Marca Própria
        - Pessoal / Recreativo
        - Outro
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      options:
        - Sem preferência
        - PVC Grau Marinho (1100 dtex)
        - Hypalon / CSM Premium
        - Casco de fibra de vidro
        - Casco de Alumínio
    - name: Engine Requirement
      type: text
      placeholder: por exemplo, motor de popa 60 HP, sem motor, duplo 115 HP
    - name: Customization Required
      type: text
      placeholder: por exemplo, cores personalizadas, marca/logo, embalagem, acessórios especiais
    - name: Timeline
      type: text
      placeholder: por exemplo, entrega em até 90 dias
    - name: Additional Requirements
      type: textarea
      placeholder: Descreva sua aplicação, especificações técnicas ou quaisquer requisitos especiais — inclua desenhos de referência, especificações ou links, se disponíveis
    - name: Upload Specification
      type: file
      placeholder: Envie sua folha de especificações, desenho ou documento de referência (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Envie seu logo ou arte para personalização de marca (AI, EPS, PNG)
cta:
  title: Prefere discutir por e-mail?
  subtitle: Envie sua consulta diretamente à nossa equipe de vendas. Respondemos em 24 horas.
  actions:
    - variant: primary
      text: Envie-nos um e-mail diretamente
      href: /contact

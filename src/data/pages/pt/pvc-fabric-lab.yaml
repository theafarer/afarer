intro: >-
  O tecido do tubo é o material mais crítico em um bote inflável. Ele deve resistir à exposição constante aos raios UV, a ciclos repetidos de inflação, à abrasão contra píeres e detritos, e a variações extremas de temperatura — tudo isso enquanto mantém sua integridade estrutural por anos. No
  Afarer, nosso Laboratório de Tecidos de PVC é dedicado exclusivamente à caracterização, validação e melhoria contínua dos tecidos que usamos em cada barco que construímos.
content_html: >
  <h2>A base de toda embarcação inflável</h2>

  <p>Não dependemos apenas das fichas técnicas dos fornecedores. Cada lote de tecido de PVC e Hypalon que chega à nossa oficina é testado de forma independente internamente. Isso garante que a especificação de material que publicamos é o desempenho de material que você recebe — lote após lote, ano
  após ano.</p>


  <h2>Equipamentos de teste padronizados</h2>

  <p>Nosso laboratório de tecidos está equipado com instrumentos de nível industrial que estão em conformidade com os métodos de teste ISO, ASTM e EN:</p>

  <table>
    <thead><tr><th>Equipamento</th><th>Parâmetros Medidos</th><th>Norma</th></tr></thead>
    <tbody>
      <tr><td>Máquina universal de tração (50 kN)</td><td>Força de ruptura, alongamento na ruptura, propagação de rasgo</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>Câmara de intemperismo por arco de xénon</td><td>Resistência aos raios UV (mudança de cor, retenção de resistência após 2000 h)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>Testador de flexão a baixa temperatura</td><td>Ponto de fissuração a -30 °C a -50 °C</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Testador de abrasão Taber</td><td>Perda de peso após 1000 ciclos (roda CS-10)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>Medidor de espessura (digital, resolução de 0,001 mm)</td><td>Uniformidade ao longo da largura do rolo</td><td>ISO 2286-3</td></tr>
      <tr><td>Testador de pressão hidrostática</td><td>Resistência à penetração de água</td><td>ISO 811</td></tr>
    </tbody>
  </table>

  <p class="text-sm text-gray-500">* Todos os equipamentos são calibrados anualmente por laboratórios acreditados de terceiros.</p>


  <h2>Dos dados à decisão: um fluxo de trabalho de teste típico</h2>

  <p>Quando um novo tecido candidato chega, ele segue um processo padronizado de qualificação em sete etapas:</p>

  <ol>
    <li><strong>Inspeção de recebimento</strong> — verificação visual de defeitos de superfície, microperfurações e conformidade dimensional.</li>
    <li><strong>Mapeamento de espessura</strong> — medição em 20 pontos ao longo do rolo; exige-se CV &lt; 3% para aprovação.</li>
    <li><strong>Ensaio de tração</strong> — 5 corpos de prova nas direções de urdume e trama. Mínimo de 3500 N/50 mm para PVC de 1100 dtex.</li>
    <li><strong>Condicionamento UV</strong> — exposição de 1000 h em câmara de arco de xénon; retenção mínima de 80 % de resistência exigida.</li>
    <li><strong>Fissuração a frio</strong> — 4 h a -35 °C e, em seguida, dobra de 180° sobre um mandril de 25 mm. Sem fissuração visível.</li>
    <li><strong>Resistência à abrasão</strong> — 1000 ciclos, perda de peso ≤ 0,05 g.</li>
    <li><strong>Aprovação final</strong> — somente após a passagem em todas as sete etapas o tecido é liberado para produção.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">PVC 1100 dtex típico — Retenção de Tração Após Exposição UV</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 h<br />100%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 h<br />95%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 h<br />88%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 h<br />82%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">Concorrente<br />~65%</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Nosso tecido de PVC 1100 dtex retém &gt; 80 % da resistência à tração após 2000 h de exposição ao arco de xénon, em comparação com graus típicos do setor que caem abaixo de 70 %.</p>
  </div>


  <h2>Nossa equipe profissional</h2>

  <p>O laboratório conta com dois engenheiros de materiais em tempo integral, cada um com diploma em ciência de polímeros ou engenharia têxtil e no mínimo seis anos de experiência no setor. Eles são apoiados por três técnicos que realizam os testes do dia a dia e o registro de dados. A equipe
  participa regularmente de ensaios interlaboratoriais organizados pela International Organization for Standardization (ISO) para validar a precisão de nossos métodos de teste.</p>


  <h2>Resolvendo seus desafios de material mais difíceis</h2>

  <p>Todo ambiente marítimo é diferente. Uma embarcação de patrulha que opera no Golfo Pérsico enfrenta condições de UV e temperatura muito diferentes das de uma embarcação de resgate no Mar do Norte. Nosso Laboratório de Tecidos ajuda você a selecionar — ou desenvolver — uma especificação de tecido
  otimizada para o seu perfil de operação.</p>

  <p>Soluções personalizadas recentes incluem:</p>

  <ul>
    <li>Uma mistura de PVC de alta resistência à abrasão para um cliente militar cujas embarcações encalham regularmente em recifes de coral (+40 % de vida útil em abrasão).</li>
    <li>Uma formulação de Hypalon de baixa temperatura para uma estação de pesquisa no Ártico, testada até -50 °C sem fragilização.</li>
    <li>Um tecido laranja com estabilização de cor para uma frota de busca e salvamento, mantendo a visibilidade após 3 anos de exposição ao sol tropical.</li>
  </ul>

  <p>Não vendemos tecidos "prontos" e torcemos para que funcionem. Testamos, validamos e recomendamos — ou criamos — uma solução sob medida para o seu perfil de missão específico. Essa é a diferença da Afarer.</p>


  <h2>Como nós o atendemos</h2>

  <p>Quando você nos traz um desafio de material, é isso que você pode esperar:</p>

  <ol>
    <li><strong>Consultoria</strong> — discutimos seu ambiente de operação, metas de desempenho e orçamento.</li>
    <li><strong>Proposta</strong> — um plano de testes é elaborado com critérios claros de aprovação/reprovação e um cronograma.</li>
    <li><strong>Execução</strong> — nosso laboratório realiza os testes e produz um relatório detalhado com dados brutos e análise comparativa.</li>
    <li><strong>Recomendação</strong> — apresentamos uma especificação de tecido, incluindo opções alternativas se vários materiais atenderem aos seus requisitos.</li>
    <li><strong>Acompanhamento</strong> — após a entrega, permanecemos disponíveis para apoiar quaisquer dúvidas sobre materiais em serviço.</li>
  </ol>

  <p>Nosso objetivo não é simplesmente vender uma embarcação para você. É garantir que a embarcação que você recebe tenha um desempenho confiável nas condições em que você opera — e isso começa com o tecido.</p>

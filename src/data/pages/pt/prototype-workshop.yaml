hero:
  tagline: Laboratório 05
  title: Oficina de Protótipos
  subtitle: Do modelo CAD ao barco pronto para o mar — construído, equipado e comprovado
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
  image_alt: Fabricação de barco em oficina protótipo Afarer
intro: >-
  Um modelo CAD, não importa o quão detalhado, não pode revelar como um barco realmente se comportará até encontrar a água. É por isso que nosso Atelier de Protótipos é projetado para traduzir dados de engenharia em uma embarcação física e navegável o mais rápida e precisamente possível. Cada novo
  modelo {SITE.name} — e cada construção personalizada significativa — passa por este atelier antes que as ferramentas de produção sejam definidas.
content_html: >
  <h2>Onde o design se torna realidade</h2>

  <p>A oficina está totalmente equipada para a fabricação simultânea de casco, tubos e aparelhagem. Essa abordagem de fluxo de trabalho paralelo reduz o prazo de entrega do protótipo para 8-12 semanas a partir da liberação de engenharia, em comparação com a norma do setor de 16-20 semanas. Quando
  sua aplicação exige uma solução especializada, podemos passar do conceito à validação na água em menos de três meses.</p>


  <h2>Capacidades da oficina</h2>

  <table>
    <thead><tr><th>Posto de trabalho</th><th>Equipamento</th><th>Finalidade</th></tr></thead>
    <tbody>
      <tr><td>Fabricação de casco</td><td>Forno de moldagem rotacional (HDPE), cabine de soldagem TIG (alumínio), moldes de laminação manual (fibra de vidro)</td><td>Produção de cascos em escala real nos três tipos de material</td></tr>
      <tr><td>Montagem dos tubos</td><td>Prensa de soldagem RF, estação de pontoagem a ar quente, gabarito de teste de inflação</td><td>Fabricação de conjuntos de tubos em tamanho real com todos os defletores, cones e válvulas</td></tr>
      <tr><td>Aparelhagem e montagem</td><td>Guindaste para motor (500 kg), estrutura simuladora de console, prensa para mangueiras hidráulicas, painel de chicotes elétricos</td><td>Equipamento completo: motor, direção, controles, sistema de combustível, eletrônica, assentos</td></tr>
      <tr><td>Baião de instrumentação</td><td>Sensor de velocidade GPS, medidor de fluxo de combustível, acelerômetros, conjunto de termopares, registrador de dados</td><td>Instalação e calibração da instrumentação de provas de mar</td></tr>
    </tbody>
  </table>


  <h2>A jornada do protótipo — passo a passo</h2>

  <ol>
    <li><strong>Entrega de engenharia</strong> — O pacote de projeto (modelo 3D, relatório FEA, lista de materiais, cronograma de laminação) é formalmente revisado pelo líder da oficina e pelo engenheiro de projeto. Quaisquer preocupações de fabricação são sinalizadas e resolvidas antes do início do corte.</li>
    <li><strong>Produção do casco</strong> — O casco é construído de acordo com a especificação de engenharia. Para HDPE: o programa de moldagem rotacional é carregado a partir da simulação Moldex3D. Para alumínio: as chapas cortadas a CNC são soldadas na cabine TIG seguindo o mapa de soldagem aprovado. Para fibra de vidro: o manual de laminação é seguido camada por camada.</li>
    <li><strong>Fabricação dos tubos</strong> — O tecido é cortado com gabaritos de padrão CNC e depois soldado por RF em câmaras de tamanho real. Cada câmara é inflada à pressão de teste e deixada por 24 h para estabilização inicial.</li>
    <li><strong>Montagem e aparelhagem</strong> — Casco e tubos são unidos. O motor é instalado, a direção e os controles são conectados, o sistema de combustível é instalado e todos os circuitos elétricos são cabeados e verificados.</li>
    <li><strong>Testes estáticos</strong> — Antes de a embarcação entrar na água, ela passa por: verificação de flutuabilidade (carga total + 30 % de reserva), teste de pressão do sistema de combustível, teste de ciclo de giro completo da direção, teste de continuidade do aterramento elétrico.</li>
    <li><strong>Programa de provas de mar</strong> — 20 horas de testes na água, detalhadas abaixo.</li>
    <li><strong>Revisão do protótipo</strong> — É realizada uma reunião formal de aprovação com as equipes de engenharia, produção e qualidade. Quaisquer alterações de projeto necessárias são documentadas e incorporadas à liberação de produção.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Programa de Provas de Mar de 20 Horas — Cronograma de Testes</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Manobra em porto — manuseio em baixa velocidade, marcha à ré, verificação de defensas</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Prova de velocidade — velocidade máxima verificada por GPS, velocidade de cruzeiro, consumo de combustível em 3 pontos de RPM</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Teste de viragem — diâmetro tático, avanço e transferência a 20 kn, bombordo e estibordo</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Teste de slam — passagens repetidas por ondas de 0.5–1.0 m; acelerômetro na base do assento do piloto</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Teste de estabilidade — ângulo de inclinação estático com 4 tripulantes + equipamento a estibordo, carga deslocada</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prova de resistência — 3 h contínuas em velocidade de cruzeiro; monitoramento de temperatura (motor, combustível, elétrica)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Inspeção final — inspeção pós-prova de todos os sistemas, aperto/verificação de todos os fixadores, documentação das constatações</span>
      </div>
    </div>
  </div>


  <h2>Prototipagem personalizada para aplicações exclusivas</h2>

  <p>A Oficina de Protótipos é onde resolvemos os problemas que as embarcações de produção padrão não conseguem resolver. Exemplos recentes incluem:</p>

  <ul>
    <li>Um RIB de 7.8 m para uma organização de busca e salvamento, exigindo uma estrutura de cabine personalizada com proteção contra capotamento, suportes integrados para maca e um compartimento de sonar montado na proa — tudo prototipado, instalado e testado em nossa unidade.</li>
    <li>Uma embarcação inflável de 5.2 m para uma contratada de levantamento hidrográfico, com espelho de popa rebaixado, mastro de instrumentos removível e bolsas de transdutor atravessando o casco projetadas para minimizar a perturbação do fluxo.</li>
    <li>Uma lancha de serviço de 4.5 m com propulsão elétrica para um superiate, onde o protótipo foi usado para validar a autonomia, a infraestrutura de carregamento e os níveis de ruído antes de o cliente se comprometer com uma frota de quatro embarcações.</li>
  </ul>


  <h2>Nossa equipe de prototipagem</h2>

  <p>A oficina conta com oito técnicos navais multiqualificados, cada um com treinamento cruzado em pelo menos duas das três disciplinas principais (casco, tubo, aparelhagem). O líder da equipe é um mestre construtor de embarcações com 16 anos de experiência, desde construções personalizadas únicas
  até séries de produção. Cada protótipo recebe um engenheiro de projeto dedicado que atua como ponto único de contato para o cliente durante todo o processo de construção e provas.</p>


  <h2>Participação do cliente</h2>

  <p>Incentivamos ativamente nossos clientes a participar dos marcos importantes durante a construção do protótipo — especialmente a revisão inicial de equipagem e as provas de mar. Seu feedback operacional durante essas etapas é inestimável para ajustar a embarcação antes de ela entrar em produção.
  Não construímos no vácuo; construímos em parceria com você.</p>

  <p>As provas de mar de 20 horas também são uma oportunidade para sua equipe se familiarizar com o manuseio da embarcação, o layout dos sistemas e os requisitos de manutenção, garantindo uma transição tranquila para o serviço quando as embarcações de produção forem entregues.</p>

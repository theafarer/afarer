timeline:
  - year: Dois Mil e Doze
    title: Fundação da fabricação marítima
    body: >-
      A afarer começou como uma oficina especializada em embarcações infláveis em Qingdao, China, comprometida com o artesanato marítimo e a fabricação de botes infláveis. O foco inicial era construir produtos infláveis confiáveis por meio de experiência prática em engenharia e disciplina de
      fabricação.
  - year: Dois Mil e Quinze
    title: Primeira exportação e certificação CE
    body: Os primeiros pedidos de exportação chegaram ao Japão e à Coreia. A certificação CE foi obtida para as linhas de produtos principais, marcando a entrada da afarer nos mercados internacionais. A empresa começou a atender usuários comerciais e recreativos além da China.
  - year: Dois Mil e Dezoito
    title: Expansão da fábrica
    body: Mudança para uma instalação de produção de 12.000 m². Adição de linhas de soldagem RF e capacidade de produção drop-stitch, permitindo fabricação em maior escala e sistemas de controle de qualidade aprimorados.
  - year: Dois Mil e Vinte
    title: Centro de P&D estabelecido
    body: Abertura de um centro de P&D dedicado com laboratório de tecidos PVC, tanque de teste hidrodinâmico e estúdio de simulação CAD/FEA. O desenvolvimento de produtos expandiu-se para focar em construção leve, durabilidade melhorada e design centrado no usuário.
  - year: Dois Mil e Vinte e Dois
    title: Certificação e crescimento global
    body: Conquista da certificação ISO 9001. Expansão para 14 engenheiros de P&D e 200+ trabalhadores. Os produtos alcançaram clientes na Europa, Américas e Ásia-Pacífico por meio de parcerias de distribuição e co-brand.
  - year: Dois Mil e Vinte e Quatro
    title: Estúdio de inovação e design
    body: Lançamento de um estúdio completo de design e inovação para projetos co-brand personalizados, do conceito à produção. Fortalecimento de aplicações marítimas profissionais, incluindo licitações de resgate, comerciais e governamentais.
  - year: Dois Mil e Vinte e Seis
    title: Construindo o futuro da exploração aquática
    body: Hoje, a afarer continua a desenvolver botes infláveis, sistemas SUP e soluções marítimas personalizadas — conectando pessoas e organizações às águas do mundo. Mais de 50 países atendidos, capacidade anual de mais de 15.000 unidades.
content_founding:
  tagline: O começo
  title: Nascido na orla
  subtitle: 'A afarer começou em uma oficina costeira em Qingdao com um barco e uma visão: construir embarcações infláveis capazes de suportar condições marítimas reais.'
  paragraphs:
    - Em 2012, nossos fundadores viram uma lacuna no mercado — a maioria dos botes infláveis era acessível mas pouco confiável, ou de alta qualidade mas proibitivamente caros. Eles acreditavam que havia espaço para um fabricante que oferecesse tanto qualidade quanto valor.
    - O primeiro casco foi construído à mão, testado em águas locais e refinado com base em feedback real de pescadores e pequenos operadores comerciais. Esse ciclo de feedback — construir, testar, ouvir, melhorar — permanece no centro da nossa filosofia de engenharia hoje.
    - Em 2015, a notícia se espalhou para além de Qingdao. Distribuidores internacionais começaram a solicitar amostras. O que começou como uma oficina local estava se tornando um fornecedor global.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Oficina de produção inicial e fabricação da afarer
content_growth:
  tagline: Crescimento e inovação
  title: Da oficina a uma instalação de 12.000 m²
  subtitle: O investimento contínuo em pessoas, equipamentos e processos transformou a afarer em uma instalação moderna de fabricação marítima.
  paragraphs:
    - À medida que a demanda crescia, nossa instalação também crescia. Expandimos de uma pequena oficina para uma fábrica de 12.000 m² com linhas de produção dedicadas para botes SUP, botes infláveis, pranchas SUP e acessórios.
    - Investimos em máquinas de corte CNC, equipamentos de soldagem de alta frequência, linhas de produção drop-stitch e bancos de teste abrangentes — permitindo-nos controlar todos os aspectos da qualidade de produção.
    - Hoje, nossa equipe de mais de 200 pessoas inclui engenheiros navais, cientistas de materiais, especialistas em controle de qualidade e artesãos qualificados — muitos dos quais estão na afarer desde os primeiros dias.
philosophy:
  tagline: Filosofia da marca
  title: Engenharia da Liberdade na Água
  body: Liberdade na água não é apenas sobre movimento. Representa descobrir novos lugares, criar experiências ao ar livre, conectar pessoas com a natureza e permitir missões profissionais. A engenharia torna essa liberdade possível.
  pillars:
    - title: Confiabilidade em primeiro lugar
      body: Ambientes aquáticos exigem confiança. Os produtos afarer são projetados para estabilidade, durabilidade, segurança e desempenho consistente.
    - title: Design centrado no ser humano
      body: Os produtos devem servir as pessoas, não a tecnologia. Cada decisão de design começa com a compreensão de como as pessoas usam as embarcações, onde exploram e quais desafios enfrentam.
    - title: Exploração acessível
      body: A água não deve pertencer apenas aos especialistas. A afarer cria equipamentos que permitem que mais pessoas experimentem com segurança rios, lagos, oceanos e ambientes costeiros.
    - title: Inovação contínua
      body: Inovação não é apenas criar novos produtos. É melhorar cada detalhe — materiais, estruturas, fabricação e experiência do usuário.
engineeringDna:
  tagline: DNA de engenharia
  title: Como a afarer cria produtos
  areas:
    - title: Ciência dos materiais
      body: A afarer concentra-se na seleção de materiais adequados para diferentes ambientes marinhos. As principais considerações incluem resistência à abrasão, resistência UV, estabilidade à pressão e durabilidade a longo prazo.
      items:
        - Resistência à abrasão
        - Resistência UV
        - Estabilidade à pressão
        - Durabilidade a longo prazo
    - title: Engenharia estrutural
      body: Embarcações infláveis exigem um equilíbrio preciso entre rigidez, peso, portabilidade e estabilidade. A engenharia da afarer foca em otimizar esses fatores através da tecnologia drop-stitch e da construção avançada de costuras.
      items:
        - Rigidez
        - Otimização de peso
        - Portabilidade
        - Estabilidade
    - title: Precisão de fabricação
      body: 'Cada produto passa por processos controlados: preparação de materiais, corte de precisão, soldagem e colagem, montagem, inspeção de qualidade e verificação de desempenho.'
      items:
        - Preparação de materiais
        - Corte de precisão
        - Soldagem e colagem
        - Montagem e CQ
    - title: Engenharia de cenários de uso
      body: Os produtos são desenvolvidos em torno de aplicações reais — recreação, aventura e uso profissional — garantindo que cada design atenda às demandas específicas do seu ambiente pretendido.
      items:
        - Recreação
        - Aventura
        - Profissional
        - Comercial

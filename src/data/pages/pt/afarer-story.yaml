  quality:
    title: Compromisso com a qualidade
    body: Da inspeção de materiais aos testes finais, a afarer mantém processos de qualidade sistemáticos para fornecer produtos marítimos confiáveis. Cada unidade passa por teste de pressão, inspeção de costuras e verificação de desempenho antes do envio.
    items:
      - CE Certified — Todos os produtos atendem aos padrões de segurança europeus
      - ISO 9001:2015 — Sistema de gestão de qualidade certificado
      - UKCA Marked — Conformidade para o mercado britânico
      - FCC Compliant — Conformidade de componentes eletrônicos nos EUA
  global:
    title: Presença global
    body: A afarer atende clientes em vários mercados globais, apoiando distribuidores, marcas outdoor e usuários marítimos profissionais em mais de 50 países na Europa, Ásia-Pacífico, Américas, Oriente Médio e África.

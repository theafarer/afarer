  tagline: Conformidade
  title: Como Funciona a Certificação CE para Embarcações Infláveis
  subtitle: Leitura de 7 min
content_html: |-
  <h2>O que é a Certificação CE?</h2>
  <p>A marcação CE (Conformit&eacute; Europ&eacute;enne) indica que um produto cumpre os requisitos da UE em matéria de saúde, segurança e ambiente. Para embarcações insufláveis, o quadro regulamentar aplicável depende da categoria do produto.</p>

  <h2>Diretivas Aplicáveis</h2>

  <h3>Diretiva das Embarcações de Recreio (2013/53/UE)</h3>
  <p>A diretiva principal para a maioria dos barcos insufláveis, SUPs e caiaques. Aplica-se a embarcações de recreio com comprimento de casco entre 2.5 m e 24 m, a embarcações parcialmente construídas (para fornecimento OEM) e a motas de água.</p>

  <h3>Regulamento de Equipamento de Proteção Individual (2016/425)</h3>
  <p>Os coletes salva-vidas, auxiliares de flutuabilidade e equipamentos de segurança fornecidos com as embarcações devem cumprir os requisitos do Regulamento EPI, incluindo o exame de tipo (Módulo B) por um organismo notificado e a garantia de qualidade da produção (Módulo D ou E).</p>

  <h2>O Processo de Certificação</h2>
  <ol>
    <li>Classificação do produto: Determinar a categoria de conceção da embarcação (A – D, conforme ISO 8666)</li>
    <li>Normas aplicáveis: EN ISO 6185 (Partes 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (placa do construtor)</li>
    <li>Preparação do processo técnico: Desenhos de conceção, Lista de Materiais, certificados de materiais, avaliação de riscos</li>
    <li>Ensaios de tipo: Flutuabilidade, estabilidade, capacidade de carga, ensaio de materiais, resistência das costuras, retenção de ar</li>
    <li>Controlo de produção em fábrica: Auditoria do organismo notificado aos processos de fabrico</li>
    <li>Declaração de Conformidade: O fabricante assina a DoC e afixa a marcação CE</li>
  </ol>

  <h2>Organismos Notificados para Embarcações Insufláveis</h2>
  <p>Os organismos notificados (NB) comuns incluem Bureau Veritas (França), DNV GL (Alemanha), RINA (Itália), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Alemanha).</p>

  <h2>Prazos e Custos</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fase</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Duração</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Custo Típico (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Preparação do processo técnico</td><td class="p-3 border">2 – 4 semanas</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Ensaios de tipo</td><td class="p-3 border">4 – 8 semanas</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Auditoria à fábrica</td><td class="p-3 border">1 – 2 dias (no local)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Total (primeiro produto)</td><td class="p-3 border">8 – 14 semanas</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>O Que Isto Significa para os Compradores</h2>
  <p>Ao adquirir barcos insufláveis com certificação CE, verifique sempre se a marcação CE está na placa do construtor, se existe uma DoC válida, se o número do organismo notificado está indicado e se o manual do proprietário inclui instruções de segurança no seu idioma local. Todos os produtos Afarer possuem certificação CE com rastreabilidade total para os relatórios de auditoria do organismo notificado.</p>

hero:
  tagline: Conformidade
  title: Como Funciona a Certificação CE para Embarcações Infláveis
  subtitle: Leitura de 7 min
content_html: >
  <h2>O que é a certificação CE?</h2>

  <p>A marcação CE (Conformité Européenne) indica que um produto atende aos requisitos da UE de saúde, segurança e meio ambiente. Para embarcações infláveis, o marco regulatório relevante depende da categoria de produto.</p>


  <h2>Diretivas Aplicáveis</h2>


  <h3>Diretiva de Embarcações Recreativas (2013/53/UE)</h3>

  <p>A diretriz principal para a maioria dos barcos infláveis, SUPs e caiaques. Aplica-se a embarcações recreativas de 2,5 m a 24 m de comprimento de casco, barcos parcialmente concluídos (para fornecimento OEM) e embarcações pessoais.</p>


  <h3>Regulamento de Equipamentos de Proteção Individual (2016/425)</h3>

  <p>Coletes salva-vidas, auxílios à flutuabilidade e equipamentos de segurança fornecidos com embarcações devem atender aos requisitos do Regulamento de EPI, incluindo exame de tipo (Módulo B) por um órgão notificado e garantia de qualidade da produção (Módulo D ou E).</p>


  <h2>O Processo de Certificação</h2>

  <ol>
    <li>Classificação do produto: Determinar a categoria de projeto de embarcações (A – D conforme ISO 8666)</li>
    <li>Normas aplicáveis: EN ISO 6185 (Partes 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (placa do construtor)</li>
    <li>Preparação de arquivos técnicos: desenhos de projeto, Lista de Materiais, certificados de materiais, avaliação de risco</li>
    <li>Teste de tipo: Flutuabilidade, estabilidade, capacidade de carga, teste de material, resistência da junta, retenção de ar</li>
    <li>Controle de produção em fábrica: Auditoria de órgãos notificados dos processos de fabricação</li>
    <li>Declaração de Conformidade: Fabricante assina o DoC, afixa a marcação CE</li>
  </ol>


  <h2>Organismos Notificados para Embarcações Infláveis</h2>

  <p>As NBs comuns incluem Bureau Veritas (França), DNV GL (Alemanha), RINA (Itália), TÜV Rheinland / TÜV SÜD (Alemanha).</p>


  <h2>Cronograma e Custos</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <ª classe="p-3 texto-fonte esquerda-texto seminegrito-cinza-borda 900">Fase</th>
        <ª classe="p-3 texto-esquerda-letra semi-negrito texto-cinza-borda 900">Duração</th>
        <ª classe="p-3 texto-fonte esquerda-texto seminegrito-cinza-borda 900">Custo Típico (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 borda">Preparação técnica de arquivo</td><td class="p-3 borda">2 – 4 semanas</td><td class="p-3 borda">2.000 – 5.000</td></tr>
      <tr><classe td="fronteira p-3">Teste de tipo</td><classe td="fronteira p-3">4 – 8 semanas</td><classe td="fronteira p-3">8.000 – 20.000</td></tr>
      <tr><classe td="fronteira p-3">Auditoria de fábrica</td><classe td="fronteira p-3">1 – 2 dias (no local)</td><classe td="fronteira p-3">3.000 – 6.000</td></tr>
      <tr><classe td="fronteira p-3">Total (primeiro produto)</td><classe td="fronteira p-3">8 – 14 semanas</td><classe td="fronteira p-3">13.000 – 31.000</td></tr>
    </tbody>
  </table>


  <h2>O que isso significa para os compradores</h2>

  <p>Ao adquirir barcos infláveis certificados CE, sempre verifique se a marcação CE está na placa do construtor, existe um documento válido, o número do Corpo Notificado está listado e o manual do proprietário inclui instruções de segurança no idioma local. Todos os produtos Afarer possuem
  certificação CE com total rastreabilidade para relatórios de auditoria de órgãos notificados.</p>

workshops:
  - title: Produção de Pranchas de SUP
    description: '4 linhas de montagem paralelas para pranchas infláveis de SUP. Cada linha pode produzir 50-80 pranchas por turno. Estações de impressão digital e serigrafia funcionam simultaneamente. Capacidade anual de SUP: 8.000+ pranchas.'
    output: '8.000+ SUPs/ano'
  - title: 'Produção de Barcos RIB'
    description: 'Oficina especializada de cascos de fibra de vidro com 6 estações de molde para cascos de barco até 7,6 m. A área de soldadura e montagem de tubos manuseia 3–6 barcos simultaneamente. Capacidade anual de RIB: 2.000+ barcos.'
    output: '2.000+ RIBs/ano'
  - title: 'Botes infláveis e SUP'
    description: 'Linhas de produção multiuso para botes infláveis, caiaques e dingues. As estações de soldadura de ar quente, prensas dielétricas de RF e postos de montagem são reconfigurados conforme o mix de pedidos. Capacidade anual: 5.000+ unidades.'
    output: '5.000+ unidades/ano'
  - title: Equipamento de Segurança
    description: 'Área de produção em sala limpa separada para coletes salva-vidas e equipamentos de segurança. Estações dedicadas de costura, inserção de espuma e testes. Capacidade anual de coletes salva-vidas: 50.000+ unidades.'
    output: '50.000+ coletes salva-vidas/ano'
oem_capacity:
  moq: 'SUP: 5–10 unidades | Barco: 2–5 unidades | Caiaque/Dingue: 10–50 unidades | Molde personalizado: 200+ unidades'
  lead_time: Padrão 30–45 dias. Amostra 15–20 dias. Urgente disponível.
  payment: T/T 30% depósito + 70% antes do envio. L/C, Western Union aceitos.

hero:
  tagline: Capacidade de Produção
  title: Capacidade de Fabricação e Produção Anual
  subtitle: Instalação de 12.000 m² produzindo 15.000 barcos por ano com espaço para expansão
intro: >-
  A afarer opera uma das maiores instalações dedicadas à fabricação de barcos infláveis em Qingdao, na China. A nossa fábrica de 12.000 m² está organizada em seis oficinas especializadas que operam em paralelo, o que nos dá capacidade para produzir mais de 15.000 barcos por ano nas linhas de SUP, caiaques, dingues, RIB e equipamentos de segurança.

hero:
  tagline: 'Estudos de caso'
  title: 'Projetos reais, resultados reais<br />—afarer em ação'
  subtitle: 'Veja como a afarer faz parcerias com distribuidores, marcas e operadores em todo o mundo para fornecer soluções marinhas personalizadas para cada aplicação.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Estudos de caso afarer —projetos de fabricação marinha personalizados'
features3_cases:
  tagline: 'Casos em destaque'
  title: 'Soluções personalizadas<br />para desafios reais'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Frota de centro de mergulho europeu'
      description: 'Fornecimento de 12 barcos SUP 520 configurados para mergulho a uma rede de centros de mergulho mediterrâneos. Suportes personalizados para tanques, escadas de mergulho e branding da frota. Entregue em 60 dias.'
      icon: tabler:lifebuoy
    - title: 'Programa OEM distribuidor australiano'
      description: 'Desenvolvimento de uma linha de pranchas SUP de marca própria para um distribuidor australiano de esportes aquáticos. 8 modelos, embalagem personalizada e logística drop-ship. Do conceito ao primeiro embarque em 90 dias.'
      icon: tabler:currency-dollar
    - title: 'Fornecimento de botes de resgate Oriente Médio'
      description: 'Fornecimento de 20 botes SUP 450 Patrol a uma organização de defesa civil do Oriente Médio. Conveses autodrenantes, pacotes de navegação completos e tubos laranja de alta visibilidade. Conformidade com normas regulatórias locais.'
      icon: tabler:alert-triangle
    - title: 'Parceria OEM marca europeia'
      description: 'Parceria de fabricação de marca branca com uma marca marítima europeia. 5 modelos SUP, marca própria, direitos exclusivos de distribuição para o mercado UE. Acordo plurianual.'
      icon: tabler:building
    - title: 'Frota de resort caribenho'
      description: 'Pacote completo de equipamentos de esportes aquáticos para um resort caribenho: 40 pranchas SUP, 20 caiaques, 10 botes infláveis e acessórios. Marca personalizada do resort em todos os equipamentos.'
      icon: tabler:beach
    - title: 'Contrato de patrulha costeira dos EUA'
      description: 'Fornecimento de botes de patrulha SUP 600 a uma agência de segurança costeira dos EUA. Configuração bimotor, opções de console blindado e integração de eletrônicos militares.'
      icon: tabler:shield
cta:
  title: 'Tem um projeto para discutir?'
  subtitle: 'Cada parceria afarer começa com uma conversa. Conte-nos seus requisitos e desenvolveremos uma solução.'
  actions:
    - variant: primary
      text: 'Inicie seu projeto'
      href: /contact
    - text: 'Ver nossas capacidades'
      href: /brand/marine-expertise

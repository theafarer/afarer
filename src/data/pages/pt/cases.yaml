features3_cases:
  tagline: Casos em destaque
  title: Soluções personalizadas<br />para desafios reais
  isBeforeContent: false
  columns: 3
  items:
    - title: Frota de centro de mergulho europeu
      customer: Centros de Mergulho BlueMed
      country: Grécia
      industry: Mergulho e Turismo Marinho
      challenge: >-
        Foram necessários 12 SUPs configurados para mergulho para uma cadeia de centros de mergulho em várias ilhas gregas. Cada prancha precisava de acessórios personalizados, armazenamento para 8 cilindros e plataforma estável para entrada de mergulhadores em mar aberto. A frota precisava chegar
        dentro de 60 dias para o início da temporada turística.
      solution: >-
        Produzidos 12 modelos SUP Voyager Dive com racks de equipamentos integrados, plataformas estáveis e construção extra-larga em drop-stitch para estabilidade ao embarcar. Cada prancha foi personalizada com a pintura da frota do cliente. Todas as 12 pranchas foram submetidas a teste de pressão
        e enviadas de Qingdao em 55 dias.
      product: Mergulho SUP Voyager
      results: Todas as 12 placas foram entregues no prazo para a temporada turística. A frota está em operação diária há 18 meses sem falhas materiais. O cliente pediu 6 unidades adicionais no segundo ano.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: O SUP Voyager Dive tem sido a espinha dorsal de nossas operações diárias de mergulho. A estabilidade é excelente, e o layout de armazenamento de equipamentos mantém o convés limpo e seguro para nossos convidados.
      icon: tabler:lifebuoy
    - title: Programa Co-Brand distribuidor australiano
      customer: Pacific Watersports Pty Ltd
      country: Austrália
      industry: Programa Co-Brand e Parceria
      challenge: >-
        Distribuidor australiano precisava de uma linha de pranchas SUP de marca própria com preços competitivos para competir com marcas chinesas que vendem diretamente ao consumidor. Necessitava de 8 modelos únicos cobrindo do iniciante ao avançado, com gráficos personalizados, embalagem
        personalizada e atendimento drop-ship para pontos de venda.
      solution: >-
        Desenvolveu 8 modelos de SUP (All-Around, Touring, Yoga, Crianças, Esporte, Ultra-Compacto, Ultra-Estável, Águas Brancas) com pacote de gráficos exclusivo australiano. Embalagem personalizada para varejo com códigos QR vinculando a vídeos de configuração. Logística de envio direto
        configurada de Qingdao diretamente para lojas de varejo na Austrália.
      product: Linha de SUP Personalizada (8 modelos)
      results: Do conceito à primeira remessa em 90 dias. Taxa de venda no varejo de 85% na primeira temporada. Distribuidor ampliou a parceria para incluir modelos adicionais de SUP no segundo ano.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Um transportador entregou uma linha completa de SUP em 90 dias — do design inicial à prateleira de varejo. A qualidade é equivalente à de marcas que vendem ao dobro do preço.
      icon: tabler:currency-dollar
    - title: Fornecimento de botes de resgate Oriente Médio
      customer: Autoridade Nacional de Defesa Civil
      country: Emirados Árabes Unidos
      industry: Busca e Resgate
      challenge: >-
        A organização de defesa civil precisava de 20 SUPs prontos para patrulha para busca e resgate costeiro, segurança portuária e resposta a inundações. Era necessário que as pranchas tivessem alta visibilidade, equipamento de segurança completo e conformidade com os regulamentos marítimos
        locais.
      solution: >-
        Foram fornecidos 20 modelos de SUP Patrol com construção em drop-stitch laranja de alta visibilidade, pacotes completos de segurança, fita refletiva SOLAS e construção reforçada. Cada prancha era certificada pelo CE e testada conforme os padrões aplicáveis. O pacote de documentação incluía
        certificados de conformidade para registro local.
      product: Patrulha de SUP
      results: Frota implantada em 5 estações costeiras. Placas têm operado em calor extremo (45°C) sem degradação. Desempenho e durabilidade superaram as especificações.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: O SUP Patrol excedeu nossos requisitos operacionais. Em condições de calor extremo, as pranchas não apresentam sinais de degradação por UV após 24 meses de uso diário.
      icon: tabler:alert-triangle
    - title: Parceria Co-Brand Europeia
      customer: Equipamentos Marinhos do Mar do Norte BV
      country: Países Baixos
      industry: Programa Co-Brand e Parceria
      challenge: >-
        Marca europeia consolidada no setor marítimo queria expandir para o mercado de SUP sem investir em instalações de fabricação. Precisava de um parceiro white-label capaz de produzir 5 modelos de SUP (2,74 m a 3,66 m) com marca própria, certificação CE e direitos exclusivos de distribuição na
        UE.
      solution: >-
        Acordo de fabricação white-label estabelecido para 5 modelos SUP. Cada modelo com marcas e esquema de cores do cliente. Documentação de certificação CE preparada para cada modelo. Direitos de distribuição exclusivos na UE concedidos com compromissos de pedido mínimo. Documentação técnica
        fornecida para a rede de serviço local.
      product: Linha de SUP Personalizada (5 modelos)
      results: Acordo de vários anos assinado. Primeiro lote de produção de 50 unidades enviado dentro de 75 dias. Marca lançada em grande feira comercial com recepção positiva dos revendedores.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Trabalhar com a Afarer nos permitiu entrar no mercado de SUP sem construir uma fábrica — eles forneceram uma solução completa turnkey com certificação CE e documentação de suporte ao revendedor.
      icon: tabler:building
    - title: Frota de resort caribenho
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Turismo Marítimo e Hospitalidade
      challenge: >-
        Resort de luxo precisava de uma frota completa de equipamentos para esportes aquáticos para atividades dos hóspedes: 40 pranchas de SUP para passeios guiados, 20 SUPs adicionais para exploração da lagoa, 10 pranchas de SUP para excursões dos hóspedes, além de acessórios. Todo o equipamento
        precisava de personalização com a marca do resort e devia ser entregue antes da alta temporada turística.
      solution: >-
        Produziu pacote completo de SUP: 40 pranchas SUP Voyager (modelo All-Around), 20 pranchas SUP Explorer, 10 pranchas SUP Touring, além de coletes salva-vidas, remos, bombas e kits de reparo. Todo o equipamento impresso com o logotipo do resort e esquema de cores tropicais. Envio em contêiner
        com manifesto completo de inventário.
      product: Pacote completo de SUP (70 unidades)
      results: A frota chegou 6 semanas antes da alta temporada. As pontuações de satisfação dos hóspedes para atividades aquáticas aumentaram 40% em relação ao ano anterior. O equipamento durou 3 temporadas apenas com manutenção de rotina.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: A abordagem de pacote completo significava que recebíamos tudo o que precisávamos em um único envio — placas e acessórios, todos com a marca e prontos para o uso dos hóspedes. Nossos hóspedes adoram a qualidade dos equipamentos.
      icon: tabler:beach
    - title: Contrato de patrulha costeira dos EUA
      customer: Agência de Segurança da Costa Atlântica
      country: Estados Unidos
      industry: Segurança Marítima e Aplicação da Lei
      challenge: A agência de segurança costeira dos EUA precisava de SUPs de patrulha de alta resistência para operações em águas abertas. Necessitava de pranchas de alto desempenho com equipamentos de especificação militar e conformidade com os regulamentos da Guarda Costeira dos EUA.
      solution: >-
        SUP de patrulha projetado com construção reforçada em drop-stitch, esquemas de cores de alta visibilidade, suportes para equipamentos de comunicação criptografada e pontos integrados de fixação de equipamentos. Pranchas reforçadas para operações de alta resistência. Documentação de
        conformidade com a USCG fornecida.
      product: Patrulha de SUP
      results: A agência relatou uma taxa de prontidão de missão de 95% nos primeiros 12 meses. Pedido adicional feito para 8 unidades.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: O SUP Patrol oferece às nossas equipes o desempenho necessário para operações em mar aberto. A construção reforçada fornece durabilidade crítica sem comprometer a manobrabilidade.
      icon: tabler:shield

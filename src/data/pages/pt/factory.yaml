qc_section:
  tagline: Controle de Qualidade
  title: Processo de Testes e Garantia da Qualidade
  subtitle: Cada barco passa por testes obrigatórios antes do envio. Nosso laboratório de qualidade opera independentemente da produção e reporta diretamente à gerência.
  steps:
    - step: "1"
      title: Inspeção de Matéria-Prima
      desc: Tecidos de PVC, Hypalon e drop-stitch passam por teste de tração (), propagação de rasgo e verificação de resistência UV antes de qualquer lote entrar em produção.
    - step: "2"
      title: Teste de Retenção de Ar de 48 Horas
      desc: Cada câmara de tubo é inflada a 125% da pressão nominal e mantida por 48 horas. A queda de pressão abaixo de 5% aciona rejeição automática e reinspeção da junta.
    - step: "3"
      title: Teste de Carga e Equilíbrio
      desc: Os barcos concluídos são carregados até a capacidade máxima nominal e testados quanto a estabilidade, borda livre e manuseio. Cada embarcação é testada na água antes da inspeção final.
oem_section:
  tagline: Projetos OEM
  title: Estudos de Caso de Parcerias de Marca e OEM
  subtitle: Do conceito ao contêiner —como ajudamos marcas globais a lançar e escalar suas linhas de embarcações infláveis.
  cases:
    - challenge: Um varejista europeu de atividades ao ar livre precisava de uma linha de SUP de marca própria com gráficos de deck exclusivos, PVC ecológico e embalagem pronta para varejo —tudo entregue em 60 dias.
      solution: Desenvolvemos arquivos de impressão digital personalizados, compramos PVC em conformidade com REACH e comprimimos a amostragem de 3 rodadas para 1, colocalizando a equipe de design em nossa fábrica em Qingdao.
      result: 55 dias do pedido assinado ao FOB. 2.400 unidades em 4 SKUs. Pedido repetido antes da chegada do primeiro contêiner.
    - challenge: Uma startup americana de esportes aquáticos precisava de um caiaque drop-stitch de alto desempenho com formato de casco personalizado, embalagem com marca compartilhada e certificação BSCI para colocação no varejo.
      solution: Adaptamos o molde existente do caiaque drop-stitch com perfil de rocker modificado, desenvolvemos a arte da embalagem com marca compartilhada e fornecemos documentação completa de auditoria BSCI.
      result: Listado com sucesso em 3 grandes redes americanas de atividades ao ar livre. Mais de 5.000 unidades no primeiro ano com taxa de sell-through de 98%.
    - challenge: Um distribuidor australiano precisava de uma linha de RIBs certificada CE com cores de tubo personalizadas, opção de atualização para Hypalon e conformidade com a Norma Australiana AS 1799.
      solution: Produzimos amostras de pré-produção com 4 variantes de cor de tubo, compramos CSM Hypalon de fornecedor japonês e coordenamos testes de conformidade AS 1799 de terceiros.
      result: Linha de 3 modelos SUP lançada no mercado AU/NZ. Seguida por vitória em licitação governamental para 12 RIBs de patrulha.
faq_section:
  tagline: FAQ
  title: Perguntas Frequentes B2B e OEM
  questions:
    - q: Qual é a quantidade mínima de pedido (MOQ) para pranchas SUP infláveis OEM?
      a: A MOQ começa em 5—0 unidades para modelos OEM padrão. Moldes personalizados e projetos de marca própria exigem um mínimo de 200 unidades, dependendo da complexidade. Pedidos de teste e execuções de amostra estão disponíveis para lançamentos de novas marcas.
    - q: A afarer possui certificação BSCI?
      a: Sim. Nossa fábrica mantém certificação de conformidade social BSCI válida (relatório de auditoria disponível mediante solicitação). Também possuímos  para gestão da qualidade e todos os produtos possuem certificação CE . Documentação de conformidade REACH e RoHS fornecida com cada remessa OEM.
    - q: Qual é o prazo de entrega típico para um pedido OEM?
      a: O prazo padrão é de 30 a 45 dias a partir do pedido confirmado e depósito. O desenvolvimento de molde personalizado adiciona 15 a 20 dias para ferramentas. Oferecemos produção acelerada para pedidos urgentes e picos sazonais durante a janela de pré-verão (janeiro a março).
    - q: Podem enviar FOB Qingdao ou CIF para o nosso porto?
      a: Sim. Enviamos FOB Qingdao, CIF para os principais portos globais e DDP para parceiros qualificados. Nossa equipe de logística gerencia reserva de contêineres, documentação de exportação e desembaraço aduaneiro. Embarcamos para mais de 50 países nos mercados da UE, EUA, AU e Ásia.
b2b_moq: "MOQ padrão: 5 a 10 unidades por modelo (SUP/caiaque/drop-stitch). MOQ SUP: 2 a 5 unidades. Pedidos de teste são bem-vindos para novas parcerias."
production_flow:
  tagline: Production Flow
  title: From Material to Finished Boat
  subtitle: Every boat passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: "01"
      title: Material Receiving & Incoming QC
      description: All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.
      qc_check: Tensile strength (ASTM D751), tear resistance (ISO 4674), thickness gauge, adhesive viscosity, visual defect scan
      qc_threshold: 100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect
      responsibility: Incoming QC team (3 inspectors)
    - stage: "02"
      title: CNC Cutting & Material Prep
      description: Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.
      qc_check: Dimensional check against CAD DXF files, edge quality inspection, panel count verification
      qc_threshold: Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance
      responsibility: Cutting workshop lead
    - stage: "03"
      title: Welding & Drop-Stitch Bonding
      description: Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.
      qc_check: Peel test every 50 units (ASTM D751), weld width measurement, hot-air temperature log review, visual seam inspection under backlight
      qc_threshold: Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject
      responsibility: Welding QC (2 inspectors per shift)
    - stage: "04"
      title: Assembly & Rigging
      description: "Boats move to final assembly where all components are mated: hull + tubes, valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist."
      qc_check: 100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection
      qc_threshold: "Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)"
      responsibility: Assembly team lead + line QC
    - stage: "05"
      title: Pressure Testing & Quality Hold
      description: Every chamber is inflated to 1.25× rated pressure (typically 20—5 PSI) and held for 24—8 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.
      qc_check: 24h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair
      qc_threshold: Max 5% pressure drop over 24h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch
      responsibility: Quality lab (independent of production, reports to management)
    - stage: "06"
      title: Final Inspection & Packing
      description: Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.
      qc_check: Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification
      qc_threshold: AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected
      responsibility: Final QC team (4 inspectors) + Packing team lead

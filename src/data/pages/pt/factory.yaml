qc_section:
  tagline: Controle de Qualidade
  title: Processo de Testes e Garantia da Qualidade
  subtitle: Cada barco passa por testes obrigatórios antes do envio. Nosso laboratório de qualidade opera independentemente da produção e reporta diretamente à gerência.
  steps:
    - step: '1'
      title: Inspeção de Matéria-Prima
      desc: Tecidos de PVC, Hypalon e drop-stitch passam por teste de tração (ASTM D751), propagação de rasgo e verificação de resistência UV antes de qualquer lote entrar em produção.
    - step: '2'
      title: Teste de Retenção de Ar de 48 Horas
      desc: Cada câmara de tubo é inflada a 125% da pressão nominal e mantida por 48 horas. A queda de pressão abaixo de 5% aciona rejeição automática e reinspeção da junta.
    - step: '3'
      title: Teste de Carga e Equilíbrio
      desc: Os barcos concluídos são carregados até a capacidade máxima nominal e testados quanto a estabilidade, borda livre e manuseio. Cada embarcação é testada na água antes da inspeção final.
oem_section:
  tagline: Projetos OEM
  title: Estudos de Caso de Parcerias de Marca e OEM
  subtitle: Do conceito ao contêiner — como ajudamos marcas globais a lançar e escalar suas linhas de embarcações infláveis.
  cases:
    - challenge: Um varejista europeu de atividades ao ar livre precisava de uma linha de SUP de marca própria com gráficos de deck exclusivos, PVC ecológico e embalagem pronta para varejo — tudo entregue em 60 dias.
      solution: Desenvolvemos arquivos de impressão digital personalizados, compramos PVC em conformidade com REACH e comprimimos a amostragem de 3 rodadas para 1, colocalizando a equipe de design em nossa fábrica em Qingdao.
      result: 55 dias do pedido assinado ao FOB. 2.400 unidades em 4 SKUs. Pedido repetido antes da chegada do primeiro contêiner.
    - challenge: Uma startup americana de esportes aquáticos precisava de um caiaque drop-stitch de alto desempenho com formato de casco personalizado, embalagem com marca compartilhada e certificação BSCI para colocação no varejo.
      solution: Adaptamos o molde existente do caiaque drop-stitch com perfil de rocker modificado, desenvolvemos a arte da embalagem com marca compartilhada e fornecemos documentação completa de auditoria BSCI.
      result: Listado com sucesso em 3 grandes redes americanas de atividades ao ar livre. Mais de 5.000 unidades no primeiro ano com taxa de sell-through de 98%.
    - challenge: Um distribuidor australiano precisava de uma linha de RIBs certificada CE com cores de tubo personalizadas, opção de atualização para Hypalon e conformidade com a Norma Australiana AS 1799.
      solution: Produzimos amostras de pré-produção com 4 variantes de cor de tubo, compramos CSM Hypalon de fornecedor japonês e coordenamos testes de conformidade AS 1799 de terceiros.
      result: Linha de 3 modelos SUP lançada no mercado AU/NZ. Seguida por vitória em licitação governamental para 12 RIBs de patrulha.
faq_section:
  tagline: Perguntas Frequentes
  title: Perguntas Frequentes B2B e OEM
  questions:
    - q: Qual é a quantidade mínima de pedido (MOQ) para pranchas SUP infláveis OEM?
      a: A MOQ começa em 5–10 unidades para modelos OEM padrão. Moldes personalizados e projetos de marca própria exigem um mínimo de 200 unidades, dependendo da complexidade. Pedidos de teste e execuções de amostra estão disponíveis para lançamentos de novas marcas.
    - q: A afarer possui certificação BSCI?
      a: >-
        Sim. Nossa fábrica mantém certificação de conformidade social BSCI válida (relatório de auditoria disponível mediante solicitação). Também possuímos ISO 9001 para gestão da qualidade e todos os produtos possuem certificação CE. Documentação de conformidade REACH e RoHS fornecida com cada remessa
        OEM.
    - q: Qual é o prazo de entrega típico para um pedido OEM?
      a: O prazo padrão é de 30 a 45 dias a partir do pedido confirmado e depósito. O desenvolvimento de molde personalizado adiciona 15 a 20 dias para ferramentas. Oferecemos produção acelerada para pedidos urgentes e picos sazonais durante a janela de pré-verão (janeiro a março).
    - q: Podem enviar FOB Qingdao ou CIF para o nosso porto?
      a: Sim. Enviamos FOB Qingdao, CIF para os principais portos globais e DDP para parceiros qualificados. Nossa equipe de logística gerencia reserva de contêineres, documentação de exportação e desembaraço aduaneiro. Embarcamos para mais de 50 países nos mercados da UE, EUA, AU e Ásia.
b2b_moq: 'MOQ padrão: 5 a 10 unidades por modelo (SUP/caiaque/drop-stitch). MOQ SUP: 2 a 5 unidades. Pedidos de teste são bem-vindos para novas parcerias.'
production_flow:
  tagline: Fluxo de Produção
  title: Do Material ao Barco Acabado
  subtitle: Cada barco passa por 6 estágios de produção com pontos de verificação de QC em cada etapa. Sem atalhos, sem inspeções puladas.
  stages:
    - stage: '01'
      title: Recebimento de Materiais e Controle de Qualidade de Entrada
      description: Todos os materiais recebidos são registrados por número de lote/lote no nosso sistema ERP. Rolos de tecido PVC, núcleos de costura drop-stitch, válvulas, adesivos e ferragens são colocados em quarentena até a aprovação do controle de qualidade.
      qc_check: Resistência à tração (ASTM D751), resistência ao rasgo (ISO 4674), medidor de espessura, viscosidade do adesivo, inspeção visual de defeitos
      qc_threshold: 100% dos lotes testados. Rejeitar se a resistência à tração < 90% da especificação, rasgo < mínimo da especificação, ou qualquer defeito visual
      responsibility: Equipe de QC chegando (3 inspetores)
    - stage: '02'
      title: Corte CNC e Preparação de Material
      description: O aninhamento otimizado por computador organiza os painéis no estoque de PVC para minimizar o desperdício. Máquinas de corte CNC automáticas mantêm uma precisão posicional de 0,1 mm.
      qc_check: Verificação dimensional contra arquivos CAD DXF, inspeção da qualidade das bordas, verificação da contagem de painéis
      qc_threshold: Cada 20º painel medido. Tolerância ±0,5 mm. Rejeitar lote se >2% fora da tolerância
      responsibility: Líder de oficina de corte
    - stage: '03'
      title: Soldagem e Ligação por Ponto de Queda
      description: Núcleos de drop-stitch são ligados a laminados externos de PVC usando laminação a quente. As câmaras dos tubos são soldadas por RF ou soldagem a ar quente. As faixas do trilho são unidas por fusão de três camadas.
      qc_check: Teste de descascamento a cada 50 unidades (ASTM D751), medição da largura da solda, revisão do registro de temperatura do ar quente, inspeção visual da costura sob luz de fundo
      qc_threshold: Resistência à descamação mínima 8 N/cm. Tolerância da largura da solda ±1 mm. Qualquer canalização visível = rejeitar
      responsibility: Controle de Qualidade de Soldagem (2 inspetores por turno)
    - stage: '04'
      title: Montagem e Equipamento
      description: 'Os barcos seguem para a montagem final, onde todos os componentes são unidos: casco, tubos, válvulas instaladas, anéis em D, alças, caixas de quilha e instalação da bolsa de transporte. Cada unidade segue uma lista de verificação de montagem de 100 pontos.'
      qc_check: Assinatura de verificação de checklist de 100 pontos por unidade, teste de função da válvula (10 ciclos de abrir/fechar), verificação de torque do hardware, inspeção visual
      qc_threshold: 'Política de zero defeito em itens críticos para segurança (válvulas, anéis em D, alças). Cosmético menor: AQL 2,5 (ISO 2859)'
      responsibility: Líder de equipe de montagem + QC de linha
    - stage: '05'
      title: Testes de Pressão e Retenção de Qualidade
      description: Cada câmara é inflada para 1,25× a pressão nominal (tipicamente 20–25 PSI) e mantida por 24–48 horas. Sensores de pressão registram continuamente. Câmaras que excedem queda de pressão de 5% são rejeitadas e enviadas para reinspeção da costura.
      qc_check: Registro de pressão mantida por 24h, calibração do sensor verificada diariamente, leitura de pressão compensada pela temperatura, reteste da junta após reparo
      qc_threshold: Queda de pressão máxima de 5% em 24h em temperatura estável. Qualquer câmara que exceder isso = re-teste de 100% de todo o lote de produção
      responsibility: Laboratório de qualidade (independente da produção, reporta-se à administração)
    - stage: '06'
      title: Inspeção Final e Embalagem
      description: Inspeção visual e funcional final. Defeitos na superfície, consistência de cor, verificação de rótulo/BIN, integridade da embalagem e completude dos acessórios. As unidades são embaladas a vácuo, colocadas em caixas e paletizadas para carregamento em contêiner.
      qc_check: Inspeção visual completa, checklist de acessórios por SKU, teste de queda da embalagem (1 m, amostra aleatória), verificação de leitura de etiqueta/código de barras
      qc_threshold: AQL 2,5 para defeitos graves, AQL 4,0 para defeitos menores. Tolerância zero para defeitos de segurança. 100% das unidades inspecionadas visualmente
      responsibility: Equipe final de QC (4 inspetores) + Líder da equipe de embalagem

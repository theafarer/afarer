hero:
  tagline: Fábrica
  title: Fábrica e Fabricação
  subtitle: 12.000 m2 de fabricação integrada —da matéria-prima ao barco acabado

intro:
  - Como uma marca-fábrica da **Qingdao Vatrad Group Co., Ltd.**, a afarer controla cada etapa da produção —desde a chegada das matérias-primas de PVC e fibra de vidro até a inspeção final pré-entrega do barco acabado. Nossa instalação de fabricação na Zona de Desenvolvimento Econômico de Qingdao abrange 12.000 metros quadrados e abriga oficinas dedicadas para corte de PVC, selagem térmica de tubos, produção de cascos SUP em fibra de vidro, impressão digital SUP, montagem final e testes de qualidade.
  - Ao integrar design, engenharia, prototipagem, fabricação e testes sob o mesmo teto, eliminamos as ineficiências da fabricação por contrato e mantemos controle direto sobre a qualidade de construção, seleção de materiais e prazos de entrega. Cada barco que sai da nossa oficina é construído por nossa equipe, em nossos equipamentos, de acordo com nossos padrões.


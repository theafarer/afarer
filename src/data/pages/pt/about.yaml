features3_what_we_build:
  title: O que construímos
  subtitle: 'Começámos numa oficina costeira com uma prancha e uma convicção teimosa: os produtos marítimos devem ser projetados como se fizessem diferença, porque fazem. Hoje enviamos para mais de 40 países, mas cada casco ainda passa pelas mesmas mãos que fundaram a empresa.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Pranchas SUP
      description: Pranchas SUP infláveis de 9 ft a 12 ft. Projetadas para touring, yoga, pesca e uso familiar.
      icon: tabler:ship
    - title: SUPs Infláveis
      description: Pranchas SUP infláveis em PVC de 9 ft a 12 ft. Leves, resistentes e fáceis de arrumar.
      icon: tabler:rowing
    - title: Pacotes SUP Premium
      description: SUPs compactos e de alta especificação, construídos à medida para corresponder aos requisitos da sua marca ou frota.
      icon: tabler:crown

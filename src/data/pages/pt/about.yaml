meta:
  title: 'Sobre a Afarer — Marca de SUP Inflável e de Esportes Aquáticos | {SITE}'
  description: 'A Afarer é uma marca global de SUP inflável e esportes aquáticos, operada pela Aquafarer LLC (EUA) e construída pela nossa equipe de operações em Qingdao. Descubra nossa história, nossa engenharia, a qualidade certificada e os programas de parceria por país.'
  keywords:
    - 'marca de sup inflável'
    - 'marca de barcos infláveis'
    - 'marca de esportes aquáticos'
    - 'distribuidor de sup por país'
    - 'coleções de sup co-branded'
hero:
  tagline: Sobre nós
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Oficina afarer
  title: |
    Engenharia naval, <br />
    feita à <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Começámos numa oficina costeira com um barco e uma convicção teimosa: os produtos navais devem ser projetados como se fizessem diferença, porque fazem. Hoje enviamos para mais de 40 países, mas cada casco ainda passa pelas mesmas mãos que fundaram a empresa.'
stats:
  title: Em números
  columns: 4
  stats:
    - title: Cascos entregues
      amount: Dois mil e quatrocentos
    - title: Países de destino
      amount: Quarenta
    - title: Anos de experiência combinada
      amount: Sessenta
    - title: Resposta média de garantia (horas)
      amount: Vinte e Quatro
features3_what_we_build:
  title: O que construímos
  subtitle: 'Começámos numa oficina costeira com um barco e uma convicção teimosa: os produtos navais devem ser projetados como se fizessem diferença, porque fazem. Hoje enviamos para mais de 40 países, mas cada casco ainda passa pelas mesmas mãos que fundaram a empresa.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Barcos SUP
      description: RIBs de casco de alumínio de 3,3 m a 7,5 m. Projetados para patrulha, mergulho, pesca e uso familiar.
      icon: tabler:ship
    - title: Barcos insufláveis
      description: SUPs insufláveis em PVC e Hypalon de 2,4 m a 4,2 m. Leves, resistentes e fáceis de arrumar.
      icon: tabler:speedboat
    - title: Tenders para superiates
      description: RIBs compactos e de alta especificação construídos à medida para combinar com o visual do seu iate.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Acessórios
      description: Remos, bombas, capas, sacos estanques, depósitos de combustível e eletrônica. Tudo compatível com os nossos barcos.
      icon: tabler:package
    - title: Reequipamento e reparação
      description: Substituição de tubos, retrofitting de eletrônica e upgrades de motor na nossa oficina.
      icon: tabler:tool
    - title: Construções personalizadas
      description: Projeto projeto-a-projeto para clientes comerciais, científicos e militares.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Construção de barco personalizado
steps2_values:
  title: Os nossos valores
  subtitle: Três princípios que moldam cada produto desde o primeiro dia.
  items:
    - title: Construir como se levasse a sua família
      description: Cada casco, soldadura e fixador é tratado como se fosse para a nossa própria família usar.
      icon: tabler:heart
    - title: Projetar antes de vender
      description: RIBs de casco de alumínio de 3,3 m a 7,5 m. Projetados para patrulha, mergulho, pesca e uso familiar.
      icon: tabler:settings
    - title: Apoio que supera a garantia
      description: Cascos com vinte anos ainda nos ligam a pedir peças, e nós continuamos a atender.
      icon: tabler:headset

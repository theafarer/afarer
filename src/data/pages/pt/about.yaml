  columns: 3
  isAfterContent: true
  items:
    - title: Acessórios
      description: Remos, bombas, capas, sacos estanques e eletrônica. Tudo compatível com as nossas pranchas.
      icon: tabler:package
    - title: Reparação e assistência
      description: Reparação de pranchas na nossa oficina, substituição de pads e upgrades de acessórios.
      icon: tabler:tool
    - title: Construções personalizadas
      description: Projeto projeto-a-projeto para clientes comerciais, científicos e militares.
      icon: tabler:hammer

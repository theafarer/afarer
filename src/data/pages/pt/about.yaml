meta:
  title: 'Sobre a Afarer — Marca de SUP Inflável e de Esportes Aquáticos | {SITE}'
  description: 'A Afarer é uma marca global de SUP inflável e esportes aquáticos, operada pela Aquafarer LLC (EUA) e construída pela nossa equipe de operações em Qingdao. Descubra nossa história, nossa engenharia, a qualidade certificada e os programas de parceria por país.'
  keywords:
    - 'marca de sup inflável'
    - 'marca de esportes aquáticos'
    - 'distribuidor de sup por país'
    - 'coleções de sup co-branded'
hero:
  tagline: Sobre nós
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Oficina afarer
  title: |
    Engenharia marítima, <br />
    feita à <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Começámos numa oficina costeira com uma prancha e uma convicção teimosa: os produtos marítimos devem ser projetados como se fizessem diferença, porque fazem. Hoje enviamos para mais de 40 países, mas cada casco ainda passa pelas mesmas mãos que fundaram a empresa.'

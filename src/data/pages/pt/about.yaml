brand_hub_tagline: Marca
brand_hub_title: Explore a nossa marca
brand_hub_subtitle: Aprofunde-se na nossa experiência em engenharia SUP, presença global e os princípios que nos orientam.
brand_hub_cards:
  - title: Experiência Marítima
    desc: Décadas de ciência de materiais, fabricação de precisão e testes reais — desde a fabricação de PVC até o design de casco em V profundo e tecnologia drop-stitch.
    link: /brand-marine-expertise
    link_label: Saiba mais →
  - title: Presença Global
    desc: Envio para mais de 50 países a partir da nossa unidade em Qingdao com parceiros de serviço autorizados na Europa, Ásia-Pacífico e Américas.
    link: /brand-global-presence
    link_label: Saiba mais →
  - title: Por que a afarer
    desc: Uma marca construída sobre qualidade verificada — dupla certificação (ISO 9001 + BSCI), conformidade CE e parcerias exclusivas por país, com coleções limitadas co-branded para empresas de esportes aquáticos.
    link: /brand-why-afarer
    link_label: Saiba mais →

tests:
  - title: Teste de Pressão
    description: >-
      As câmaras infláveis são submetidas a pressões que excedem os seus limites operacionais recomendados por períodos prolongados. Isto verifica a estanqueidade e integridade estrutural do material e costuras, garantindo que o produto suporta o uso pretendido e potencial sobre-inflação sem falhas
      ou fugas.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: Teste de Impacto
    description: Os produtos são submetidos a impactos controlados de vários pesos e ângulos. Isto avalia a resistência do material a perfurações, rasgos e danos de colisões com obstáculos na água, demonstrando durabilidade e longevidade.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: Teste de Resistência UV
    description: >-
      As câmaras infláveis são submetidas a pressões que excedem os seus limites operacionais recomendados por períodos prolongados. Isto verifica a estanqueidade e integridade estrutural do material e costuras, garantindo que o produto suporta o uso pretendido e potencial sobre-inflação sem falhas
      ou fugas.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: Teste de Resistência à Abrasão
    description: Amostras de material são esfregadas contra superfícies abrasivas por um número especificado de ciclos sob pressão controlada. Isto mede a capacidade do material de suportar desgaste do uso repetido, contato com areia, rochas ou outras superfícies, garantindo durabilidade a longo prazo.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: Teste de Desempenho em Baixa Temperatura
    description: Os produtos são testados em ambientes frios para avaliar funcionalidade e durabilidade em várias condições de temperatura, prevenindo rigidez ou rachaduras em águas mais frias. Essencial para barcos destinados a uso no inverno ou em altas latitudes.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: Teste de Flutuabilidade e Capacidade de Carga
    description: Os produtos são testados com vários pesos para determinar sua capacidade máxima de carga e garantir que suportam usuários e equipamentos com segurança. A capacidade nominal de cada modelo é verificada antes do lançamento.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: Teste de Manobrabilidade
    description: Os produtos são testados quanto à resposta a comandos de remo ou motor, avaliando raio de viragem e facilidade de manuseio. Testes na água validam se o manuseio real corresponde às especificações de projeto.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: Teste de Estanqueidade
    description: Os produtos totalmente montados são submersos ou sujeitos a pulverização de água para verificar possíveis fugas através de costuras, válvulas ou materiais. Cada barco passa por uma verificação obrigatória de estanqueidade antes do envio.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
testing_section:
  tagline: Procedimentos de Teste
  title: Testes Rigorosos em Cada Etapa
commitment:
  title: Nosso Compromisso
  body: >-
    Através destes rigorosos procedimentos de teste, a {SITE} garante aos clientes que os nossos SUP e barcos infláveis não são apenas de alto desempenho, mas também construídos para durar —garantindo inúmeras aventuras seguras e agradáveis na água. O nosso laboratório de qualidade opera
    independentemente da produção e reporta diretamente à administração.
  cta: Solicitar documentação de testes
  cta_link: /contact

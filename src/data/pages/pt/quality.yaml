hero:
  tagline: Garantia da Qualidade
  title: Testes de Desempenho e Qualidade
  subtitle: Cada barco inflável e SUP da afarer passa por rigorosos testes de desempenho e qualidade no nosso Centro de P&D antes do envio. Nossos testes abrangentes fornecem prova tangível da excelência do produto.

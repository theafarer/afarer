features:
  title: 'O Que Significa o Co-Branding na Afarer'
  subtitle: 'O co-branding é o nosso programa de parceria de design — construído em torno da marca Afarer, da proteção territorial e de coleções limitadas, não de produção sem marca.'
  columns: 3
  items:
    - title: 'Os Produtos Afarer Continuam a Ser Afarer'
      description: 'Uma coleção co-brand é uma edição limitada de pranchas Afarer com a sua identidade integrada. Nunca sem marca, nunca uma marca de terceiros e nunca um programa aberto de marca própria.'
      icon: 'tabler:trademark'
    - title: 'Concebido Consigo'
      description: 'As suas cores, naming e história dão forma à coleção. A nossa equipa de design e engenharia trata dos decks, gráficos, embalagem e documentação, do briefing à entrega.'
      icon: 'tabler:pencil'
    - title: 'Para Clubes, Resorts, Eventos e Comunidades'
      description: 'Coleções de frota para clubes de paddle e resorts, edições de evento para provas e séries comunitárias — todas com a qualidade e a garantia Afarer.'
      icon: 'tabler:users'
    - title: 'Protege os Parceiros de País'
      description: 'O co-branding corre ao lado do nosso modelo um país, um distribuidor. Os parceiros nacionais mantêm o seu território; as coleções co-brand não abrem a porta a marcas paralelas no seu mercado.'
      icon: 'tabler:shield-check'
    - title: 'Engenharia e Padrões de Qualidade'
      description: 'Cada coleção sai da nossa cadeia de fornecimento certificada com documentação CE e ISO 9001, testes de pressão e os mesmos pontos de controlo de qualidade da nossa gama principal.'
      icon: 'tabler:certificate'
    - title: 'Torna-se um Ativo de Marca'
      description: 'Uma coleção limitada co-brand constrói a sua própria história na água — margem de venda, conteúdo para media e uma razão para os praticantes de paddle regressarem época após época.'
      icon: 'tabler:star'

faqs:
  title: 'Co-Brand — Perguntas Frequentes'
  subtitle: 'Como funciona o co-branding da Afarer e em que difere do OEM e da marca própria.'
  items:
    - title: 'O co-branding é o mesmo que OEM ou marca própria?'
      description: 'Não. A Afarer já não mantém um programa aberto de OEM/marca própria. Os produtos co-brand continuam a ser produtos Afarer — concebidos, engenheirados, testados e apoiados pela marca Afarer. A sua identidade aparece como co-brand, não como um produto de terceiros sem marca.'
    - title: 'Quem pode iniciar um projeto co-brand?'
      description: 'Negócios de desportos aquáticos qualificados: parceiros de país existentes, clubes de paddle, resorts e hotéis, organizadores de eventos e comunidades. Envie-nos um briefing de projeto e confirmamos a adequação antes do início do design.'
    - title: 'O co-branding entra em conflito com o meu distribuidor de país?'
      description: 'Não. O modelo um país, um distribuidor tem prioridade. As coleções co-brand são coordenadas com o parceiro local de país quando existe, pelo que nenhuma marca paralela ou concorrente aparece dentro de um território protegido.'
    - title: 'Qual é a encomenda mínima para uma coleção co-brand?'
      description: 'As coleções piloto começam em 30–50 unidades. As coleções standard são de 50–100 unidades; as edições grandes ou multirregião de 100+ unidades. Os cronogramas de desenvolvimento personalizado são acordados por projeto.'
    - title: 'O que compete à Afarer versus o contributo do parceiro?'
      description: 'A Afarer é proprietária do design do produto, engenharia, materiais, construção, QC e garantia. Os parceiros contribuem com o conceito da coleção, naming, cores, input gráfico e a entrada no mercado. Assim se mantém um único standard de qualidade na água.'
    - title: 'Como me candidato?'
      description: 'Preencha o formulário de contacto co-brand com o seu negócio, mercado e ideia de coleção. Avaliamos a adequação e respondemos em 3 dias úteis com uma proposta e o Co-Brand Project Agreement.'

meta:
  title: 'Custom Lab — Paddle Boards Infláveis Personalizados | {SITE}'
  description: 'Paddle boards infláveis personalizados: design sob medida, logotipo, molde próprio e produção. Parceiro SUP de marca própria, MOQ 50 unidades, certificado CE.'
  keywords:
    - 'fabricante de paddle board personalizado'
    - 'SUP inflável personalizado'
    - 'paddle board com logotipo'
    - 'SUP inflável de marca própria'
    - 'fabricação de paddle board'
hero:
  tagline: Laboratório Personalizado Afarer
  title: Projete o Seu Próprio<br />Barco
  subtitle: Serviços de co-brand, marca própria e fabricação de paddle boards sob medida para empresas em todo o mundo. De um único protótipo a séries de produção completas.
  cta: Inicie o seu projeto
  footer_link: /contato
steps_section:
  tagline: Como funciona
  title: Do conceito à produção
  subtitle: Quatro passos da sua ideia a um barco acabado e pronto para o mar.
  steps:
    - num: Um
      title: Escolha a Sua Prancha
      desc: Selecione dos nossos modelos principais —SUP, caiaque, dingue ou SUP. Escolha tamanho, material e cor.
    - num: Dois
      title: Envie o Seu Design
      desc: Envie-nos o seu logótipo, arte ou diretrizes de marca. A nossa equipa de design prepara uma prova digital.
    - num: Três
      title: Revisão de Mockup IA
      desc: Veja um mockup fotorrealista gerado por IA da sua prancha personalizada antes do início da produção.
    - num: Quatro
      title: Produção e Entrega
      desc: Após aprovação, a sua encomenda entra na nossa linha de produção certificada ISO. Prazos a partir de 30 dias.
services_section:
  tagline: Serviços
  title: Serviços de fabrico para marcas globais
  subtitle: Modelos de envolvimento flexíveis —desde fabrico por contrato até construção completa de marca.
  items:
    - title: Produção Co-Brand
      desc: Produzimos os seus designs conforme especificação —sua PI, seus desenhos, seus padrões de qualidade. Proteção NDA total.
      icon: ⚙️
    - title: Soluções de Design
      desc: Escolha entre mais de 50 plataformas comprovadas e personalize tamanho, cor, gráficos e embalagem.
      icon: 🎨
    - title: Marca Própria
      desc: A sua marca nos nossos produtos —logótipo, embalagem, etiquetas, manuais. Pronto para venda a retalho.
      icon: 🎨
    - title: Branding Personalizado
      desc: Impressão no deck, gráficos de casco, decalques nos tubos e etiquetas personalizadas —integração total da marca.
      icon: ⚙️
capabilities_section:
  tagline: Capacidades
  title: Capacidades de produção e personalização
  subtitle: Tudo o que precisa saber antes de fazer a sua encomenda.
  capabilities:
    - label: Volume de encomenda
      value: MOQ 5–10 unidades (SUP/caiaque), 2–5 unidades (SUP)
    - label: Prazo de entrega
      value: 30–45 dias padrão; 15–20 dias para protótipos
    - label: Personalização
      value: Tamanho, forma, cor, gráficos, embalagem, ferragens
    - label: Materiais
      value: PVC, Hypalon, drop-stitch, fibra de vidro, alumínio
    - label: Impressão
      value: Digital (CMYK), serigrafia, transferência térmica, sublimação
    - label: Certificação
      value: CE, UKCA, FCC (suporte para conformidade global)
why_section:
  tagline: Porquê a afarer
  title: Uma fábrica. Um padrão. Zero compromissos.
  points:
    - text: Instalação de fabrico integrada de 12 000 m²
      highlight: 12 000 m²
    - text: Mais de 200 trabalhadores qualificados e engenheiros
      highlight: Duzentos
    - text: Mais de 15 000 barcos produzidos anualmente
      highlight: 15 000+
    - text: Sistema de gestão da qualidade certificado
      highlight: null
    - text: Produtos certificados CE para o mercado da UE
      highlight: CE
  cta: Ver detalhes da fábrica
  cta_link: /fábrica
  contact:
    title: Pronto para discutir o seu projeto?
    desc: A nossa equipa responde em 24 horas com um orçamento preliminar.

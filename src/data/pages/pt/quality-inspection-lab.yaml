meta:
  title: Laboratório de Qualidade & Inspeção — Testes e Certificação de RIB em Conformidade com ISO | {SITE}
  description: Verificação de qualidade independente para botes infláveis. Testes de tração, ciclos de retenção de ar, testes de descolamento de costura e certificação de material. Entre em contato com nosso laboratório de qualidade para testes por terceiros.
back_text: De volta ao Centro de P&D
home_label: Início
hero:
  tagline: Laboratório 06
  title: Laboratório de Qualidade e Inspeção
  subtitle: Verificação independente — todos os testes aprovados antes da entrega
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: Laboratório de inspeção de qualidade Afarer teste UV
intro: >-
  Cada barco que sai de nossa oficina carrega a certificação de que passou por um conjunto definido de inspeções de qualidade e testes de materiais. Nosso Laboratório de Qualidade e Inspeção é uma função independente dentro da organização — ele se reporta diretamente ao diretor-gerente, não à
  produção — garantindo que nenhuma pressão comercial possa comprometer a etapa de inspeção. Se um lote de material ou um barco concluído não atender às especificações publicadas, o laboratório tem autoridade para interromper o envio até que a não conformidade seja resolvida.
content_html: >
  <h2>Confiança, mas com verificação</h2>

  <p>O laboratório opera sob um sistema de gestão da qualidade alinhado com princípios, e os nossos métodos de ensaio baseiam-se nas normas ISO, ASTM e EN sempre que aplicável. Mantemos registos detalhados de cada ensaio realizado, criando uma cadeia completa de rastreabilidade desde a receção da
  matéria-prima até à entrega final do barco.</p>


  <h2>Equipamento de ensaio e capacidades</h2>

  <table>
    <thead><tr><th>Equipamento</th><th>Ensaios realizados</th><th>Norma / Método</th></tr></thead>
    <tbody>
      <tr><td>Máquina de ensaio universal (50 kN)</td><td>Resistência à tração (tecido), resistência ao descasque (costuras), propagação de rasgo</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Bancada de ensaio de retenção de ar (programável)</td><td>Resistência a 1000 ciclos de inflar/desinflar, ensaio de manutenção de pressão de 30 min</td><td>ISO 6185 (interno)</td></tr>
      <tr><td>Grampo de descasque de costuras (descasque motorizado de 180°)</td><td>Resistência ao descasque de soldaduras e costuras coladas a 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Aparelho de coluna de água hidrostática</td><td>Resistência do tecido à penetração de água (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Medidor digital de espessura &amp; micrómetro</td><td>Espessura do tecido, espessura da parede do tubo, espessura do filme adesivo</td><td>ISO 2286-3</td></tr>
      <tr><td>Câmara ambiental</td><td>Condicionamento de temperatura (-40 °C a +80 °C) para ensaios de fissuração a frio e envelhecimento térmico</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Espectrofotómetro de cor</td><td>Medição da cor Delta-E após exposição UV</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>Os pontos de controlo da inspeção — do material à entrega</h2>

  <p>Cada barco segue um plano de qualidade definido com pontos de inspeção obrigatórios. Nenhum barco pode saltar um ponto de controlo; cada ponto deve ser aprovado por um inspetor da qualidade antes de se iniciar a fase de produção seguinte.</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspeção de materiais recebidos</p>
            <p class="text-xs text-gray-500 mt-1">Lote de tecido, lote de adesivo, ferragens — tudo verificado em relação à especificação de receção antes da libertação para produção.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspeção de soldadura em processo</p>
            <p class="text-xs text-gray-500 mt-1">Amostra de soldadura da primeira peça testada (descasque + visual) no início de cada turno de produção.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Ensaio de ar da câmara</p>
            <p class="text-xs text-gray-500 mt-1">Cada câmara pressurizada a 1.5 x a pressão de trabalho, mantida durante 30 min. Dados registados por número de série.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspeção pré-entrega</p>
            <p class="text-xs text-gray-500 mt-1">Barco completo inspecionado: todos os fixadores apertados com o binário correto, sistemas funcionais, sem defeitos estéticos. Lista de verificação de 100 pontos.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Certificação final</p>
            <p class="text-xs text-gray-500 mt-1">Relatórios de ensaio compilados, registos de inspeção revistos, Certificado de Conformidade emitido.</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>Principais métricas de qualidade (média móvel de 2025)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Rendimento de primeira passagem (lote de tecido)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Taxa de rejeição de soldadura (metro linear)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Câmaras testadas ao ar antes da montagem</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">Conformidade com a categoria de design</span>
    </div>
  </div>


  <h2>A nossa equipa de qualidade</h2>

  <p>O laboratório é composto por um gestor de qualidade (10 anos em garantia de qualidade marítima, ASQ Certified Quality Engineer), dois inspetores de qualidade (cada um com certificação NDT de Nível 2 em ensaios visuais) e um técnico de materiais responsável por todos os ensaios físicos. A equipa
  realiza anualmente testes de proficiência através de um fornecedor independente de terceiros para garantir que os nossos resultados de ensaio permanecem exatos e reproduzíveis.</p>


  <h2>Ensaios independentes para clientes</h2>

  <p>O nosso Laboratório de Qualidade &amp; Inspeção está disponível para serviços de ensaio independentes. Se precisar de verificar uma especificação de tecido, validar um novo sistema de adesivo ou obter um relatório de ensaio de terceiros para uma qualificação de aquisição, podemos realizar os
  ensaios de acordo com a norma aplicável e emitir um relatório de ensaio certificado.</p>

  <p>Exemplos de trabalhos recentes de ensaio por terceiros:</p>

  <ul>
    <li>Comparação da resistência ao descasque de cinco produtos concorrentes de filme adesivo para um programa europeu de aquisições militares.</li>
    <li>Estudo de envelhecimento acelerado (UV + ciclagem térmica) para uma nova formulação de PVC pigmentado de laranja, com medições intercalares regulares em intervalos de 500 h.</li>
    <li>Validação da retenção de ar de 50 válvulas de defletor protótipo para um novo design de tubo de alta pressão.</li>
  </ul>


  <h2>O nosso compromisso consigo</h2>

  <p>Quando recebe um barco {SITE.name}, recebe também o seu dossiê de qualidade — um registo compilado dos resultados de ensaio aplicáveis ao seu barco específico. Certificado do lote de tecido, ensaios de descasque de soldadura, registos do ensaio de ar da câmara e lista de verificação da inspeção
  pré-entrega. Cada número é rastreável. Cada inspetor é identificado. Isto não é apenas papelada — é a nossa promessa de que o que entregamos é o que especificámos.</p>

  <p>Se alguma vez tiver uma preocupação de qualidade, pode contactar diretamente o laboratório — os dados de contacto estão impressos no seu certificado de conformidade. Levamos todas as questões a sério e comprometemo-nos a realizar uma investigação formal no prazo de 48 horas.</p>

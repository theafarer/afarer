hero:
  tagline: Segurança
  title: Padrões e certificação de segurança
  subtitle: Cada produto afarer passa por testes rigorosos e atende aos padrões internacionais de segurança para uso recreativo e profissional.
certifications:
  - title: Certificação CE
    description: Todos os equipamentos de segurança afarer cumprem os requisitos de marcação CE sob o Regulamento Europeu de Equipamentos de Proteção Individual (UE) 2016/425.
  - title: Certificação ISO 12402
    description: Os coletes salva-vidas atendem aos padrões de flutuação ISO 12402. O Life Vest Classic fornece flutuabilidade 50N+; o Life Vest Pro atende aos requisitos SOLAS com inflação automática.
  - title: Conformidade SOLAS
    description: O Life Vest Pro está em conformidade com os regulamentos SOLAS (Segurança da Vida no Mar) para operações marítimas offshore e comerciais.

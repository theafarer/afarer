meta:
  title: Onde comprar pranchas de paddle infláveis Afarer | Afarer
  description: Descubra como comprar uma prancha de paddle inflável Afarer — através de um distribuidor oficial no seu país ou diretamente da equipa Afarer.
hero:
  tagline: Onde comprar
  title: Leve o seu SUP Afarer para a água
  subtitle: As pranchas Afarer chegam a remadores em mais de 50 países. Descubra a forma mais simples de obter a sua — através de um distribuidor oficial perto de si ou diretamente da equipa Afarer.
channels:
  items:
    - title: Distribuidores oficiais por país
      description: A Afarer trabalha com distribuidores exclusivos em muitos países. Diga-nos onde rema e conectaremos você ao seu revendedor local, preços e disponibilidade.
      cta: Encontre o seu revendedor local
      href: /contact/?subject=Where to Buy
    - title: Encomenda direta à Afarer
      description: Ainda não há distribuidor no seu país? A equipa Afarer pode organizar encomendas diretas e envios para que você aproveite a água onde mora.
      cta: Pedir disponibilidade
      href: /contact/?subject=Where to Buy
form_intro:
  title: Pergunte sobre a disponibilidade
  subtitle: Envie-nos uma mensagem com o seu país e a prancha que lhe interessa. A nossa equipa responderá em um dia útil com o revendedor mais próximo ou opções de encomenda direta.
business_note:

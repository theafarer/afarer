rd_services:
  tagline: P&D Personalizado
  title: Serviços de P&D para Parceiros
  services:
    - title: Desenvolvimento de Material Personalizado
      desc: Nós desenvolvemos formulações de tecidos personalizadas, camadas de laminados e sistemas adesivos adaptados ao seu ambiente operacional e aos seus objetivos de desempenho.
    - title: Engenharia de Produto OEM / ODM
      desc: Nós desenvolvemos formulações de tecidos personalizadas, camadas de laminados e sistemas adesivos adaptados ao seu ambiente operacional e aos seus objetivos de desempenho.
    - title: Testes e Certificação por Terceiros
      desc: Use nossas instalações de teste compatíveis com a ISO para testes independentes de materiais, validação de produtos e suporte à certificação.
  cta: Discuta seus requisitos de P&D →
  cta_link: /contato
vision:
  tagline: Nossa Visão
  title: Moldando o Futuro dos Esportes Aquáticos
  body: >-
    Afarer se esforça para liderar a indústria de barcos infláveis e SUP por meio da inovação contínua, qualidade inabalável e um compromisso firme com a segurança e a sustentabilidade — enriquecendo, em última análise, as experiências dos entusiastas de esportes aquáticos em todo o mundo. O Centro
    de P&D da Afarer é onde a paixão encontra a inovação, estabelecendo novos padrões para a indústria de esportes aquáticos.
labs_section:
  tagline: Laboratórios
  title: Nossos Laboratórios
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: Laboratório de Tecido de PVC
      description: Pesquisa e testes contínuos de tecidos de tubos de PVC e Hypalon para resistência à tração, resistência aos raios UV, abrasão e flexibilidade em baixas temperaturas para garantir confiabilidade a longo prazo em ambientes marinhos.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Estúdio de Engenharia Hull
      description: Design conduzido por CAD e análise por elementos finitos de cascos de HDPE, alumínio e fibra de vidro. Cada casco é simulado digitalmente para distribuição de tensão e resistência a impactos antes que o primeiro protótipo seja construído.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: Centro de Soldagem RF
      description: Instalação dedicada de soldagem por radiofrequência com controle preciso de temperatura e pressão, produzindo costuras resistentes e herméticas que atendem aos padrões da indústria naval para embarcações infláveis.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Tanque de Teste Hidrodinâmico
      description: Teste em escala reduzida em nosso tanque de testes interno para otimizar a forma do casco, desempenho em planeio, estabilidade e eficiência de combustível em uma variedade de cargas e condições do mar.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Oficina de Protótipos
      description: Instalação de prototipagem e preparação em escala completa onde novos modelos são construídos, ajustados e testados no mar. Cada protótipo passa por um programa de teste mínimo de 20 horas na água antes da aprovação para produção.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Laboratório de Qualidade e Inspeção
      description: Laboratório de garantia de qualidade dedicado realizando testes de tração, ciclos de retenção de ar, testes de descolamento de costura e certificação de materiais para garantir que cada barco que sai da oficina atenda às nossas especificações publicadas.
      href: /randdcenter/quality-inspection-lab

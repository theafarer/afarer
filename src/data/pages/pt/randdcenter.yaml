meta:
  title: Centro de P&D | {SITE}
  description: Pesquisa & Desenvolvimento — Testes de tecido de PVC, engenharia de casco, soldagem por RF, testes hidrodinâmicos e controle de qualidade. Serviços personalizados de P&D disponíveis.
hero:
  tagline: Centro de P&D
  title: Centro de P&D
  subtitle: Focado no Progresso
intro:
  - >-
    O Centro de Pesquisa e Desenvolvimento (P&D) da afarer é a força motriz por trás de nossa missão de revolucionar os equipamentos para esportes aquáticos. Capacitamos entusiastas de esportes aquáticos em todo o mundo com produtos mais seguros, confortáveis e agradáveis por meio de inovação
    incessante em pranchas infláveis de stand-up paddle (SUPs) e barcos. Nossa equipe dedicada de engenheiros, designers e especialistas apaixonados por esportes aquáticos está moldando o futuro da indústria, elevando consistentemente o padrão de qualidade, desempenho e sustentabilidade.
  - >-
    Nossa instalação de P&D reúne cientistas de materiais, arquitetos navais e engenheiros de produção sob o mesmo teto. Desde a formulação de materiais e simulação do casco até o desenvolvimento de processos de soldagem e testes em escala real no mar, cada etapa do desenvolvimento do produto é
    guiada por dados e validada por testes.

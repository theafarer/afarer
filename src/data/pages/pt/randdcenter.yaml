capabilities:
  tagline: Capacidades
  title: Capacidades de P&D
  subtitle: Quatro disciplinas principais que nos dão controle de ponta a ponta sobre o desenvolvimento de produtos — desde a pesquisa de matérias-primas até a certificação final.
  groups:
    - title: Ciência dos Materiais e Tecnologia de Tecidos
      items:
        - Análise e otimização da formulação de PVC e Hypalon
        - Desenvolvimento de estabilização UV, retardância à chama e aditivos antimicrobianos
        - Engenharia de laminação e adesão de tecidos em múltiplas camadas
        - Teste de envelhecimento acelerado (UV, térmico, umidade, spray de sal)
    - title: Engenharia de Casco e Hidrodinâmica
      items:
        - Design paramétrico de casco 3D e otimização CFD
        - Análise por elementos finitos para cargas estruturais e de impacto
        - Testes em tanque de reboque de modelo em escala e validação de desempenho
        - Desenvolvimento de casco personalizado para perfis de missão especiais
    - title: Tecnologia de Soldagem e União
      items:
        - Desenvolvimento e otimização do processo de soldagem dielétrica por RF
        - Métodos de soldagem por ar quente, cunha quente e ultrassônica
        - Qualificação de colagem adesiva e fita de costura
        - Modelagem da resistência de solda e previsão de vida útil
    - title: Testes, Certificação e Conformidade
      items:
        - Gestão da qualidade e testes de conformidade CE
        - Suporte de testes e certificação por terceiros independentes
        - Desenvolvimento de protocolo de teste personalizado para qualificação de aquisição
        - Análise de falhas em serviço e investigação da causa raiz

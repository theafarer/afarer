pillars:
  - title: Avanço Tecnológico
    desc: Inovando em novos materiais, designs e processos de fabricação para oferecer desempenho superior do produto e longevidade.
    icon: tech
  - title: Materiais Avançados
    desc: Investigando PVC, Hypalon, compósitos e alternativas sustentáveis de ponta para características aprimoradas do produto.
    icon: materials
  - title: Sustentabilidade
    desc: 'Um Compromisso Central: Estamos dedicados à gestão ambiental por meio de manufatura sustentável e materiais recicláveis.'

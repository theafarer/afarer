features3_reasons:
  tagline: Por que escolher a afarer
  title: Sete Razões para Fazer Parceria
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Fabricação Real, Não Comércio
      description: Possuímos uma fábrica de 12.000 m². Trabalhe diretamente com os projetistas – sem intermediários.
      icon: tabler:building-factory
    - title: 2. Abordagem Liderada pela Engenharia
      description: Nosso design começa com o caso de uso, não com a categoria.
      icon: tabler:engine
    - title: 3. Qualidade Certificada
      description: CE, ISO, BSCI, REACH, USCG. Cada produto atende padrões internacionais.
      icon: tabler:certificate
    - title: 4. Co-branding Flexível
      description: Cores, layout, marca, embalagem – personalizamos conforme suas especificações.
      icon: tabler:adjustments
    - title: 5. Logística Global
      description: Armazém na Califórnia, envio direto de Qingdao, frete aéreo para urgências.
      icon: tabler:truck-delivery
    - title: 6. Suporte Vitalício
      description: Apoiamos barcos construídos há 20 anos. Peças originais, conselhos.
      icon: tabler:lifebuoy
    - title: 7. Especificações Honestas
      description: Capacidades reais, dimensões reais, peso real. Sem inflação de marketing.
      icon: tabler:ruler-measure

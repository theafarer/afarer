meta:
  title: Soluções para Frota de SUP de Resort | {SITE}
  description: Soluções completas de frota de SUP para resorts e hotéis. Pranchas de nível comercial, personalização de marca, treinamento de equipe e pacotes otimizados para ROI de 20 a 100 pranchas.
hero:
  tagline: Resorts e Hotéis
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Hóspedes do resort aproveitando o stand up paddle em uma praia intocada
roi_section:
  title: O Modelo de Receita de SUP do Resort
  subtitle: Como resorts geram de $50.000 a $200.000 de renda anual com aluguel de SUP com um único investimento.
  metrics:
    - metric: US$50 mil–US$200 mil+
      label: Receita Anual de SUP
      detail: Por resort, com base no tamanho da frota e na ocupação
    - metric: 4–6 meses
      label: Período Médio de Retorno
      detail: Recupere o investimento total da frota em uma temporada
    - metric: 40%
      label: Aumento de Receita
      detail: Aumento médio após a mudança para frotas Afarer
    - metric: '500+'
      label: Ciclos de Aluguel Por Placa
      detail: Durabilidade de nível comercial para uso diário
packages:
  title: Sistema de Pacotes de Resort
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - Garantia de 12 meses + Certificado CE
      revenue: Potencial de receita anual de US$50 mil a US$80 mil
      cta_text: Obter Pacote Inicial
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 50 remos + 50 coletes salva-vidas
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - Sessão de treinamento da equipe (online)
        - Garantia de 12 meses + Certificado CE
      revenue: Potencial de receita anual de US$ 120 mil a US$ 200 mil
      popular: true
      cta_text: Adquirir Pacote Premium
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - Gerente de conta dedicado
        - Peças de reposição prioritárias (envio em 24h)
        - Custom branding + logo
        - Pacote de fotos/vídeos de marketing
        - Garantia de 24 meses + Certificado CE
      revenue: Potencial de receita anual de $200 mil
      cta_text: Obter Pacote Principal
case_study:
  quote: Desde que mudamos para a Afarer, nossa receita com aluguel de SUP aumentou 40%. Os custos de substituição de pranchas caíram 60%. Recuperamos todo o investimento da nossa frota em 4 meses.
  author: Gerente de Atividades Aquáticas
  location: Resort 5 estrelas, Maldivas
  results:
    - label: Crescimento da Receita
      value: +40%
    - label: Redução de Custos
      value: '-60%'
    - label: Período de Retorno
      value: 4 Meses
features:
  title: Por Que Resorts Escolhem Afarer
  subtitle: Durabilidade de nível comercial, logística global e um parceiro que entende de hospitalidade.
  items:
    - title: 500 Ciclos de Aluguel
      description: Cada prancha é testada para sobreviver a 500 ciclos de aluguel em água salgada, sol e areia.
      icon: tabler:shield-check
    - title: Expedição de Peças em 48h
      description: Peças de reposição enviadas em até 48 horas — sua receita de aluguel nunca para.
      icon: tabler:truck-delivery
    - title: Marca Personalizada
      description: Combine a identidade do seu resort com cores e logotipo personalizados em cada quadro.
      icon: tabler:palette
    - title: Treinamento de Equipe
      description: Programas de treinamento online e presencial para sua equipe de atividades.
      icon: tabler:school
    - title: Logística Global
      description: Envio para mais de 50 países com opções de frete consolidado.
      icon: tabler:world
    - title: Certificado CE
      description: Todos os equipamentos certificados CE, ISO 9001:2015 — segurança e qualidade garantidas.
      icon: tabler:certificate
cta:
  title: Ready to upgrade your guest experience?
  subtitle: Obtenha seu orçamento de pacote de resort ou baixe nosso catálogo completo de resorts.
  actions:
    - text: Obter Pacote de Resort
      href: /contact?package=resort
      variant: primary
    - text: Baixar Catálogo do Resort
      href: /resources/download-catalog
      variant: secondary

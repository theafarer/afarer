meta:
  title: Programa de Parceiro de Distribuição SUP | {SITE}
  description: Junte-se à rede de distribuição global da Afarer. Territórios exclusivos, portfólio completo de produtos, preços competitivos no atacado e gerenciamento de contas dedicado.
hero:
  tagline: Distribuidores
  title: Junte-se à Nossa Rede Global<br />de Distribuição
  subtitle: Territórios exclusivos. Portfólio completo de produtos. Suporte de classe mundial. Afarer envia para mais de 50 países e estamos procurando distribuidores estabelecidos de produtos náuticos e esportes aquáticos.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Distribuição e operações de envio globais da Afarer
benefits:
  title: O que os Distribuidores Recebem
  subtitle: Tudo o que você precisa para ter sucesso no seu mercado.
  items:
    - Direitos exclusivos de território
    - Catálogo completo de produtos (SUP, acessórios, peças)
    - Preços competitivos no atacado
    - Materiais de marketing e vendas (traduzidos)
    - Programa de treinamento (produto, vendas, manutenção)
    - Apoio à feira comercial
    - Programa de exemplo
    - Capacidade de dropshipping
    - Gerente de conta dedicado a distribuidores
    - Condições de pagamento de 45 a 60 dias

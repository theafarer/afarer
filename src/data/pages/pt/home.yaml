meta:
  title: 'Fabricante de SUP Infláveis e Parceiro OEM/ODM — Afarer Water Sports | {SITE}'
  description: 'A Afarer é fabricante de SUP infláveis e parceira OEM/ODM em Qingdao, na China — uma fábrica certificada ISO 9001 que projeta pranchas de paddle infláveis de performance para águas abertas, touring, ioga e aventura. Pranchas testadas sob pressão uma a uma, com programas OEM/ODM, de marca própria e de distribuição.'
  keywords:
    - 'sup inflável de performance'
    - 'paddle board inflável premium'
    - 'marca de prancha de sup inflável'
    - 'sup inflável de touring'
    - 'paddle board co-branded'
    - 'distribuidor de sup por país'
hero:
  tagline: 'Fabricante de SUP Infláveis e Parceiro OEM/ODM'
  title: |
    Vá Mais Longe. <br class="hidden sm:inline" />
    Reme Mais Forte.
  subtitle: |
    SUPs infláveis de performance projetados para águas abertas, dias longos,<br />
    e a liberdade de explorar — estáveis quando importa,<br />
    rígidos sob pressão e prontos para águas em mudança.
  taglineSection: Soluções infláveis de SUP de nível comercial para resorts, clubes, varejistas e marcas de produtos aquáticos.
  actions:
    - variant: primary
      text: Ver produtos
      href: /products
      icon: tabler:shopping-bag
    - text: Saber mais
      href: '/afarer-story'
      icon: tabler:file-text
    - text: Explore soluções de SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: Imagem principal afarer
who_we_serve:
  tagline: A Quem Servimos
  title: Soluções SUP completas para todos os negócios de água
  subtitle: Equipamentos, fabricação e suporte empresarial projetados especificamente para quatro mercados principais.
  items:
    - title: Clubes de Paddle
      keywords: Equipamentos para clube de SUP, equipamentos para escola de stand up paddle, frota de aluguel
      description: Frotas duráveis de SUP, preços de clube e programas de peças de reposição para clubes e escolas de remo.
      icon: tabler:users
      cta: Explore as Soluções do Paddle Club
      link: /solutions/paddle-clubs
    - title: Resorts e Hotéis
      keywords: atividades aquáticas no resort, equipamentos de praia do hotel, experiência dos hóspedes
      description: Complete programas de frota de SUP com branding personalizado, treinamento de equipe e pacotes otimizados para ROI.
      icon: tabler:building
      cta: Crie Sua Experiência Aquática no Resort
      link: /solutions/resorts-hotels
    - title: Parceiros de Varejo
      keywords: Atacado de SUP, lojas de varejo ao ar livre, lojas de artigos esportivos
      description: Linha completa de produtos, materiais de marketing, opções de dropshipping e margens competitivas de atacado.
      icon: tabler:shopping-cart
      cta: Torne-se um Parceiro de Varejo
      link: /solutions/retail-partners
    - title: Distribuidores por País e Parceiros Co-Brand
      keywords: distribuidor de SUP por país, SUP co-branded, SUP de marca própria
      description: Distribuição exclusiva país a país e coleções limitadas co-branded para empresas qualificadas do setor de esportes aquáticos.
      icon: tabler:package
      cta: Torne-se um Parceiro
      link: /distributor-program
proof_points:
  title: Testado além do showroom
  subtitle: Design, desempenho e qualidade que pode verificar — na água e nos números.
  items:
    - metric: 10+
      label: Anos a projetar para a água
      detail: Desde 2012, refinado prancha por prancha
    - metric: 50+
      label: Países na água
      detail: Paddlers e parceiros em todo o mundo
    - metric: 12–15
      label: Núcleo drop-stitch em PSI
      detail: Rígido onde importa, fácil de embalar
    - metric: 100%
      label: Testado sob pressão, prancha por prancha
      detail: Inspecionado antes do envio
business_solutions:
  tagline: Como Nós Ajudamos
  title: Seu Parceiro Do Conceito À Receita
  subtitle: Quatro capacidades principais que ajudam empresas de água a lançar, operar e crescer.
  items:
    - title: Equipamento Profissional
      description: Pranchas de SUP de nível comercial projetadas para uso diário em aluguel, 500 ciclos com manutenção mínima.
      icon: tabler:shield-check
    - title: Coleções Co-Branded
      description: Coleções co-branded de ponta a ponta — do design e engenharia até as edições limitadas criadas com a Afarer, com entrega global.
      icon: tabler:package
    - title: Apoio Empresarial
      description: Treinamento de equipe, materiais de marketing, programas de peças de reposição e gestão de conta dedicada.
      icon: tabler:headset
    - title: Logística Global
      description: FOB Qingdao, CIF principais portos, entrega porta a porta para mais de 50 países com suporte aduaneiro.
      icon: tabler:truck-delivery
oem_section:
  tagline: 'Fabricação OEM / ODM e Co-Brand'
  title: Da Ideia à Água — Edições Co-Branded
  subtitle: 'Para parceiros que querem mais do que um produto de catálogo: fabricação OEM/ODM e coleções limitadas co-branded concebidas, desenvolvidas e construídas com a Afarer — enquanto cada prancha continua a ser um produto Afarer.'
  steps:
    - number: '01'
      title: Ideia & Resumo
      desc: Compartilhe sua visão, mercado-alvo e especificações.
    - number: '02'
      title: Design e Engenharia
      desc: Modelagem 3D, seleção de materiais e design gráfico personalizado.
    - number: '03'
      title: Prototipar e Validar
      desc: Produção de amostra com certificação CE e teste de qualidade.
    - number: '04'
      title: Produção em Massa
      desc: Fabricação em escala com controle de qualidade e pontos de verificação em cada etapa.
    - number: '05'
      title: Entrega Global
      desc: Logística FOB Qingdao, CIF principais portos, porta a porta.
  cta: Explore o Co-Branding
  cta_link: /co-brand
cta:
  title: |
    Pronto para especificar o seu <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">próximo barco</span>?
  subtitle: Diga-nos como usa o seu barco e recomendaremos um modelo, opções e um preço num dia útil.
  actions:
    - variant: primary
      text: Pedir orçamento
      href: /contact
      icon: tabler:message-circle
    - text: Ver catálogo
      href: /products
distributor:
  tagline: 'Distribuidores Exclusivos por País'
  title: 'Um País. Um Distribuidor Oficial Afarer.'
  subtitle: 'Um programa de um distribuidor por país, com exclusividade territorial, preços de revenda, suporte de marketing e um Distributor Success Program dedicado.'
  benefits:
    - title: 'Exclusividade Territorial'
      description: 'Um distribuidor autorizado por país ou região — sem concorrência interna, sem conflito de canal.'
    - title: 'Margens Diretas de Fábrica'
      description: 'Listas de preços de distribuidor e rebates anuais por volume comprometido, embarcados FOB Qingdao.'
    - title: 'Suporte de Marketing e Treinamento'
      description: 'Materiais co-branded, materiais POS para revendedores, treinamento de produto e campanhas de lançamento.'
    - title: 'Equipe de Conta Dedicada'
      description: 'Um gestor pessoal de distribuidores além de suporte de onboarding, previsão e reabastecimento.'
  actions:
    - variant: primary
      text: 'Torne-se Distribuidor'
      href: /distributor-program
    - text: 'Solicitar Lista de Preços de Revenda'
      href: /contact?subject=Dealer Price List
    - text: 'Candidatar-se à Parceria de País'
      href: /contact?subject=Country Partnership Application
    - text: 'Baixar o Programa de Distribuidores'
      href: /distributor-program
  note: 'Amostras a partir de 5–10 unidades. Pedidos de teste de 10–30. Dealer autorizado de 30–50. Distribuidor por País/Região de 100–300+.'

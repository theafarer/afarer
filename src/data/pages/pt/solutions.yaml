features3_solutions:
  tagline: Soluções Por Tipo de Negócio
  title: SUPs Projetados<br />Para o Seu Negócio
  isBeforeContent: false
  columns: 2
  items:
    - title: Resorts e Hotéis
      description: Programas completos de frota de SUP para propriedades de hospitalidade — pranchas duráveis, branding personalizado e suporte para treinamento de equipe.
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: Clubes de Paddle
      description: Frotas de SUP confiáveis para clubes de remo, programas de aula e operações de associação — pranchas de nível comercial com preços para clubes.
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: Operadores de Aluguel
      description: Pranchas de SUP de alta rotatividade projetadas para uso diário em aluguel. Resistentes aos raios UV, de secagem rápida, empilháveis — feitas para o ritmo do aluguel.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: Parceiros de Varejo
      description: Venda a marca de SUP que mais cresce no seu mercado. Linha completa de produtos, materiais de marketing, dropshipping e margens competitivas.
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: Distribuidores
      description: Territórios exclusivos, portfólio completo de produtos, gestão de contas dedicada. Junte-se à nossa rede global de distribuição em 50 países.
      icon: tabler:world
      link: /solutions/distributors
    - title: Construa Sua Própria Marca
      description: Fabricação SUP OEM/ODM de ponta a ponta — design, prototipagem, produção em massa e logística. Lance sua marca com a Afarer.
      icon: tabler:package
      link: /solutions/build-your-own-brand
cta:

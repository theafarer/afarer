hero:
  tagline: Certifications & Standards
  title: 'Certificações de Qualidade<br />& Padrões de Conformidade'
  subtitle: 'Os produtos afarer são fabricados em conformidade com padrões internacionais de segurança marítima, sistemas de gestão da qualidade e regulamentações ambientais.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarer quality certifications and compliance documentation
content_certifications:
  tagline: Our Certifications
  title: 'Qualidade Certificada,<br />Reconhecida Globalmente'
  subtitle: 'Cada produto afarer é apoiado por certificações que demonstram nosso compromisso com a qualidade, segurança e responsabilidade ambiental.'
  items:
    - title: 'CE Certified'
      description: 'Todos os produtos afarer cumprem os requisitos de marcação CE.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Nosso SGQ é certificado ISO 9001:2015 para projeto, fabricação e distribuição.'
      icon: tabler:clipboard-check
    - title: 'UKCA Marked'
      description: 'Os produtos vendidos no Reino Unido possuem a marcação UKCA.'
      icon: tabler:shield
    - title: 'BSCI Compliant'
      description: 'afarer é auditado BSCI por práticas éticas de fabricação.'
      icon: tabler:heart-handshake
    - title: 'Conforme REACH'
      description: 'Todos os materiais usados nos produtos afarer estão em conformidade com o regulamento REACH da UE'
      icon: tabler:flask
    - title: 'Teste de Materiais'
      description: 'Os tecidos são testados para resistência, UV e fissuração a frio. Cada lote é verificado.'
      icon: tabler:test-pipe
content_factory:
  tagline: Factory Standards
  title: 'Excelência de Fabricação<br />—Construído sob Especificação'
  subtitle: 'Nossa instalação de 12.000 m² opera sob protocolos rigorosos de controle de qualidade.'
  list:
    - 'Inspeção de materiais recebidos: todas as matérias-primas – tecido PVC, Hypalon, alumínio, compensado'
    - 'Controle de qualidade em processo: cada etapa de produção tem pontos de verificação de CQ documentados'
    - 'Teste de pressão: cada câmara inflável é testada a 1,5× a pressão nominal por 24h'
    - 'Inspeção final: produtos acabados são inspecionados quanto à precisão dimensional, acabamento estético'
    - 'Rastreabilidade de lotes: cada produto possui um número de série vinculado aos registros do lote de produção'
content_safety:
  tagline: Marine Safety Standards
  title: 'Segurança Primeiro<br />—Projetado para Operação Confiável'
  subtitle: 'Os produtos afarer são projetados e testados para atender padrões internacionais de segurança marítima.'
  items:
    - title: 'ISO 6185'
      description: 'Os botes infláveis estão em conformidade com a ISO 6185.'
      icon: tabler:sailboat
    - title: 'ABYC Standards'
      description: 'Os sistemas elétricos e de combustível seguem os padrões ABYC.'
      icon: tabler:bolt
    - title: 'Conformidade SOLAS'
      description: 'Equipamentos de segurança e salvatagem atendem aos requisitos SOLAS.'
      icon: tabler:lifebuoy
cta:
  title: 'Precisa de produtos certificados?'
  subtitle: 'Contate-nos para requisitos de certificação, documentação e conformidade.'
  actions:
    - variant: primary
      text: Request certification docs
      href: /contact
    - text: View our quality page
      href: /quality

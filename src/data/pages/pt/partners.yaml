hero:
  tagline: Parceiros e Distribuição
  title: Torne-se Parceiro afarer<br />—Rede Global de Distribuição
  subtitle: Junte-se à rede global afarer. Trabalhamos com distribuidores em 50+ países.
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: uma rede global de parceiros e distribuidores
content_programs:
  tagline: Programas de Parceiros
  title: Programas de Parceiros<br />Projetados para o Crescimento
  subtitle: Distribuidor, revendedor ou parceiro de marca – temos programas para você.
  columns: 3
  items:
    - title: Programa de Distribuidor
      description: Distribuição exclusiva com preços por volume, marketing e acesso à fábrica.
      icon: tabler:world
    - title: Programa de Revendedores
      description: Preços de revendedor, treinamento, materiais de marketing e suporte de garantia.
      icon: tabler:building-store
    - title: Parceria OEM/ODM
      description: Fabricação OEM/ODM completa com marca, embalagem e especificações personalizadas.
      icon: tabler:certificate
    - title: Parceria de Marca
      description: Co-branding, marca própria e programas exclusivos para marcas estabelecidas.
      icon: tabler:stars
    - title: Governo & Institucional
      description: Programas de fornecedor preferencial para agências, guarda costeira, exército e organizações humanitárias.
      icon: tabler:building-community
    - title: Parceiro de Resort & Aluguel
      description: Preços de frota, qualidade constante e marca personalizada para resorts, centros de mergulho e aluguéis.
      icon: tabler:sun
content_benefits:
  tagline: Por Que Parceria Conosco
  title: Por que os Parceiros Escolhem afarer
  subtitle: Nossos parceiros se beneficiam de capacidade de fabricação real, qualidade constante e suporte receptivo.
  list:
    - 'Acesso direto à fábrica: trabalhe diretamente com nossa equipe de fabricação'
    - 'Personalização pronta: marque seus produtos com cores, logotipos e embalagens personalizados'
    - 'Qualidade garantida: produção certificada ISO 9001 com conformidade CE, UKCA e BSCI'
    - 'Logística global: envio de Qingdao, China com opções FOB, CIF e DDP'
    - 'Suporte de marketing: catálogos de produtos, fotografia, documentação técnica e ativos digitais'
    - 'Treinamento e suporte: treinamento de produtos para sua equipe de vendas, suporte técnico para seus clientes'
content_process:
  tagline: Como se Tornar um Parceiro
  title: Processo de Parceria Simples
  subtitle: Nosso processo é simples – projetado para vender rapidamente.
  items:
    - title: 'Etapa 1: Enviar Candidatura'
      description: Formulário de candidatura com perfil, mercado-alvo e interesses de produto.
    - title: 'Etapa 2: Revisão de Qualificação'
      description: Nossa equipe analisa sua candidatura e entra em contato em 3 dias úteis.
    - title: 'Etapa 3: Acordo & Configuração'
      description: Assine o acordo, configure sua conta, receba preços e amostras.
    - title: 'Etapa 4: Treinamento & Lançamento'
      description: Treinamento, suporte de vendas e materiais fornecidos. Pronto para vender.
cta:
  title: Pronto para ser parceiro afarer?
  subtitle: Candidate-se para parceria. Respondemos em 3 dias úteis.
  actions:
    - variant: primary
      text: Candidatar-se à parceria
      href: /contact
    - text: Veja nossos produtos
      href: /products

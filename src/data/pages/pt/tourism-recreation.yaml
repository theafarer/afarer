faqs:
  - question: Que tipos de SUPs insufláveis para turismo e recreação a afarer fabrica?
    answer: A afarer fabrica SUPs de passeio (touring), SUPs versáteis (all-around), SUPs de yoga, SUPs de pesca e SUPs insufláveis recreativos em geral. Todos os modelos estão disponíveis para fabricação OEM/ODM com branding personalizado.
  - question: Quais materiais a afarer utiliza para SUPs insufláveis de qualidade turística?
    answer: >-
      Utilizamos PVC marinho de alta resistência à tração com revestimentos multicamadas para superior resistência aos raios UV, à abrasão e maior longevidade. Todos os tecidos são provenientes de fornecedores globais renomados e passam por rigorosa inspeção de
      recebimento.
  - question: A afarer fornece certificação CE para SUPs recreativos?
    answer: Sim. Todos os modelos padrão possuem certificação CE para acesso ao mercado da UE. Nossa fábrica é certificada ISO 9001. UKCA, FCC e outras certificações disponíveis mediante solicitação para parceiros OEM/ODM.
  - question: A afarer pode personalizar gráficos e branding para operadores turísticos?
    answer: Sim — serviços completos de OEM/ODM, incluindo impressão de logotipo personalizado nas pranchas, embalagem com marca, gráficos de frota e soluções de marca própria. Oferecemos impressão digital para gráficos em cores integrais e serigrafia para logotipos duráveis.
  - question: Qual é a garantia dos SUPs de turismo e recreação da afarer?
    answer: Os SUPs insufláveis da afarer vêm com garantia limitada do fabricante de 3 anos, cobrindo produtos defeituosos e acabamento. Opções de garantia estendida disponíveis para operadores de frotas comerciais.
body: >
  <h2>O padrão afarer — Um compromisso com o artesanato marítimo impecável</h2>

  <p>No vasto e dinâmico mundo da recreação marítima, o SUP insuflável é um testemunho de versatilidade, conveniência e acessibilidade. De expedições de pesca tranquilas em lagos serenos a passeios costeiros descontraídos, os SUPs insufláveis servem a uma multiplicidade de propósitos.</p>

  <p>No entanto, nem todos os SUPs insufláveis são iguais. A verdadeira medida de um SUP insuflável está não apenas na sua aplicação pretendida, mas na integridade da sua construção, na qualidade dos seus materiais e na precisão do seu design. A afarer se destaca como designer e fabricante
  premium, produzindo SUPs insufláveis projetados para a excelência em cada segmento de turismo e recreação.</p>


  <h2>Ciência dos materiais: A base da durabilidade</h2>

  <p>A escolha dos materiais é o fator mais crítico para determinar a longevidade e o desempenho de um SUP insuflável. A afarer investe recursos consideráveis na identificação, teste e aquisição dos melhores tecidos e componentes disponíveis globalmente.</p>

  <ul>
    <li><strong>Aquisição superior de tecidos:</strong> PVC marinho de alta resistência à tração com revestimentos multicamadas, selecionado para maior durabilidade, resistência UV e resistência à abrasão.</li>
    <li><strong>Construção Drop-Stitch:</strong> Milhares de fios internos de poliéster conectam as camadas superior e inferior, criando uma estrutura rígida a 12-15 PSI.</li>
    <li><strong>Costuras termossoldadas:</strong> Nossas construções em PVC utilizam exclusivamente costuras termossoldadas (soldagem RF) que produzem uniões de alta resistência e herméticas que excedem os requisitos ISO.</li>
    <li><strong>Proteção UV prolongada:</strong> Tecidos de PVC com garantias de proteção UV para SUPs frequentemente expostos à luz solar intensa.</li>
  </ul>


  <h2>Filosofia de design: Engenharia de precisão para cada segmento</h2>

  <p>Nossa equipe de design é composta por designers de pranchas experientes e especialistas em tecnologia insuflável que aproveitam software CAD avançado e testes reais para criar pranchas hidrodinamicamente eficientes, excepcionalmente estáveis e robustas.</p>


  <h3>SUPs de pesca</h3>

  <p>Projetados para estabilidade e operação silenciosa. As configurações específicas para pesca incluem suportes para vara, pontos de fixação de equipamento e plataformas silenciosas e estáveis que minimizam o distúrbio dos peixes.</p>


  <h3>SUPs de yoga e fitness</h3>

  <p>Plataformas largas e estáveis com deck pads de comprimento total para yoga na água, fitness e sessões de alongamento em grupo. A construção drop-stitch mantém a plataforma firme sob os pés.</p>


  <h3>SUPs versáteis e de passeio</h3>

  <p>Construção drop-stitch de alta densidade com PVC de grau militar, avaliado em 18 PSI para rigidez excepcional. Kits completos de acessórios incluem bomba, mochila, leash, kit de reparo e remo.</p>


  <h2>Excelência na fabricação: Precisão em cada etapa</h2>

  <p>A afarer emprega técnicos altamente qualificados, mestres do seu ofício. Nossa instalação de produção é equipada com máquinas de ponta, incluindo máquinas de corte CNC automáticas, soldadoras dielétricas RF, soldadoras de ar quente e impressoras digitais. Cada SUP segue procedimentos
  documentados com rastreabilidade.</p>

  <p>Nosso sistema multicamadas de controle de qualidade inclui verificações rigorosas em cada etapa de fabricação, culminando em testes abrangentes de cada prancha acabada antes do envio. Este compromisso com a qualidade é incorporado desde o início, não meramente inspecionado no final.</p>


  <h2>Controle de qualidade e testes</h2>

  <ul>
    <li><strong>Teste de retenção de ar 100%:</strong> Cada câmara é testada sob pressão além dos limites operacionais para verificar a hermeticidade.</li>
    <li><strong>Verificação de descascamento de costuras:</strong> A resistência de soldas e colas é verificada por meio de testes físicos de descascamento.</li>
    <li><strong>Validação de resistência UV:</strong> Os materiais são expostos à luz solar simulada para avaliar a resistência à degradação.</li>
    <li><strong>Testes de abrasão:</strong> Amostras de materiais são testadas contra superfícies abrasivas para avaliar a resistência ao desgaste.</li>
    <li><strong>Verificação completa de sistemas:</strong> Cada prancha passa por inspeção final antes da aprovação de envio.</li>
  </ul>


  <h2>Por que escolher a afarer para sua frota de turismo e recreação</h2>

  <p>Com nossa fábrica de 12.000 m² certificada ISO e CE em Qingdao, na China, a afarer oferece aos operadores turísticos, frotas de aluguel e marcas de recreação um parceiro de fabricação confiável. Nossos serviços OEM/ODM incluem branding personalizado, marca própria, embalagem e suporte
  logístico. Quantidade mínima de pedido padrão a partir de 50 unidades com prazos de entrega de 30–45 dias.</p>

  <p>Cada SUP afarer é um investimento em qualidade, durabilidade e desempenho incomparáveis — garantindo que seus convidados desfrutem de experiências seguras e memoráveis na água.</p>

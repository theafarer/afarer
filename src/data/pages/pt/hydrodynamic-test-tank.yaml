hero:
  tagline: Laboratório 04
  title: Tanque de Teste Hidrodinâmico
  subtitle: Validando o desempenho antes do primeiro protótipo em escala total
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: Teste de desempenho em tanque hidrodinâmico Afarer
intro: >-
  É um equívoco comum acreditar que os testes hidrodinâmicos são reservados apenas para navios de alto mar. Na realidade, o desempenho de um pequeno casco de planeio — como um RIB de 4 a 6 m — depende tanto de sua forma submersa quanto um petroleiro depende de seu bulbo de proa. Ângulo de trim, área
  molhada, geração de spray e ventilação têm todos um efeito dramático na velocidade, consumo de combustível e conforto da viagem. No {SITE.name}, operamos um tanque de teste hidrodinâmico dedicado que nos permite quantificar esses efeitos em escala de modelo — antes de comprometer metal e tecido em
  um protótipo em tamanho real.
content_html: >
  <h2>Porquê ensaiar um barco pequeno em tanque de reboque?</h2>

  <p>Testar à escala de modelo (tipicamente de 1:3 a 1:5) dá-nos a capacidade de iterar as formas do casco de forma rápida e económica. Uma semana no tanque pode gerar os mesmos dados de desempenho que exigiriam meses de tentativa e erro em escala real — e a uma fração do custo.</p>


  <h2>Especificações das instalações</h2>

  <table>
    <thead><tr><th>Parâmetro</th><th>Especificação</th></tr></thead>
    <tbody>
      <tr><td>Dimensões do tanque</td><td>35 m (C) × 3.5 m (L) × 1.8 m (P)</td></tr>
      <tr><td>Carro de reboque</td><td>Acionamento por servomotor elétrico, velocidade máxima 12 m/s (23 kn), precisão da velocidade ± 0.5 %</td></tr>
      <tr><td>Gerador de ondas</td><td>Tipo palheta, estados de mar regulares &amp; irregulares programáveis, Hs até 0.3 m à escala de modelo</td></tr>
      <tr><td>Instrumentação</td><td>Dinamómetro de 6 componentes (resistência, força lateral, momento de guinada), acelerómetros, inclinómetros, sondas de ondas</td></tr>
      <tr><td>Aquisição de dados</td><td>Amostragem a 1000 Hz por canal, visualização em tempo real + pacote de pós-processamento</td></tr>
      <tr><td>Fabrico de modelos</td><td>Fresagem CNC interna e impressão 3D para cascos de modelo até 1.8 m de comprimento total</td></tr>
    </tbody>
  </table>


  <h2>O nosso programa de ensaios</h2>

  <p>Um programa padrão de desenvolvimento de casco no nosso tanque segue esta sequência:</p>

  <ol>
    <li><strong>Construção do modelo</strong> — Um modelo à escala de 1:3.5 é fresado por CNC em espuma de alta densidade e revestido com fibra de vidro para garantir rigidez. O peso e o CG são ajustados para corresponder à condição de plena carga escalada por Froude.</li>
    <li><strong>Ensaios de resistência</strong> — O modelo é rebocado a 8-10 velocidades que cobrem o intervalo de operação. A resistência total é medida e decomposta em componentes friccionais e residuais pelo método ITTC-1957.</li>
    <li><strong>Medição do trim &amp; do afundamento</strong> — O trim de marcha e o afundamento são registados a cada velocidade. O objetivo é um ângulo de trim ideal de 4-6° para cascos de planeio.</li>
    <li><strong>Levantamento da esteira</strong> — As secções transversais das ondas são medidas a duas velocidades para avaliar a resistência de formação de ondas e identificar interações de ondas transversais que possam causar interferência na popa.</li>
    <li><strong>Comportamento no mar (opcional)</strong> — Corridas em mar de proa e em mar de popa com ondas regulares para medir a resistência adicional, a aceleração vertical e a probabilidade de slamming.</li>
    <li><strong>Análise de dados &amp; recomendações</strong> — É entregue um relatório completo com gráficos comparativos, curvas de velocidade/potência e recomendações específicas de projeto para o casco em escala real.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Resultados típicos de ensaio no tanque — Resistência vs Velocidade (casco RIB 450, escala 1:3.5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Resistência em escala de modelo (N) às velocidades escaladas por Froude. A previsão de potência em escala real segue o método de previsão de desempenho ITTC-1978.</p>
  </div>


  <h2>Equipa especializada</h2>

  <p>O nosso tanque é operado por um hidrodinamista com doutoramento em arquitetura naval e 8 anos de experiência em tanques de reboque num importante instituto europeu de investigação marítima. É apoiado por um técnico que prepara todos os modelos e a instrumentação. A equipa segue os Procedimentos
  Recomendados da ITTC (International Towing Tank Conference) para garantir que cada ensaio é repetível, rastreável e internacionalmente defensável.</p>


  <h2>Ensaios em tanque para desenvolvimento de cascos personalizados</h2>

  <p>O nosso tanque não é utilizado apenas para cascos de design próprio — realizamos regularmente programas de ensaio para clientes que pretendem validar uma forma de casco personalizada ou investigar um problema de desempenho:</p>

  <ul>
    <li><strong>Comparação de formas de casco</strong> — Duas ou mais formas de casco candidatas ensaiadas em condições idênticas, fornecendo uma comparação objetiva de resistência/velocidade/estabilidade para fundamentar a sua escolha de projeto.</li>
    <li><strong>Otimização de apêndices</strong> — Placas interceptoras, réguas anti-respingos, aletas de trim e fasquias podem ser ensaiadas em várias configurações para quantificar a sua contribuição individual para a redução da resistência.</li>
    <li><strong>Estudo de correspondência do motor</strong> — Os dados de resistência são convertidos numa curva de previsão de potência, permitindo selecionar a potência ideal do motor para a velocidade e a carga útil pretendidas.</li>
  </ul>


  <h2>Porquê ensaiar connosco?</h2>

  <p>Não lhe damos apenas um conjunto de números brutos. Os nossos relatórios traduzem os dados do tanque em recomendações de engenharia acionáveis: "Eleve a régua anti-respingos em 8 mm para reduzir a superfície molhada à velocidade de cruzeiro", "Aumente o deadrise na popa em 3° para reduzir a
  aceleração de slamming", ou "Desloque o centro de gravidade longitudinal 150 mm para ré para melhorar a atitude de planeio". O cliente termina com uma compreensão clara do que alterar e porquê.</p>

  <p>O nosso tanque está também disponível para ensaios independentes por terceiros mediante remuneração por serviço. Se estiver a desenvolver um casco e pretender uma avaliação hidrodinâmica imparcial e executada profissionalmente, aguardamos o seu contacto.</p>

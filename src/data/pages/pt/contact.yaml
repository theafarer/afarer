hero_text:
  tagline: Contacto
  title: ENTRE EM CONTACTO
contact_form:
  id: form
  title: Envie-nos uma mensagem
  subtitle: Para orçamentos, questões técnicas ou propostas de parceria, escreva-nos. Respondemos num dia útil.
  email_to: info@afarer.com
  submit_button: Enviar mensagem
  success_message: Obrigado! A sua mensagem chegou à nossa caixa de entrada. Responderemos num dia útil.
  error_message: Ocorreu um erro ao enviar a sua mensagem. Tente novamente ou envie-nos um e-mail diretamente.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: por favor, resolva o seguinte'
  fields:
    - name: firstName
      label: Primeiro Nome
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Último Nome
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Nome da Empresa
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Morada
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Código Postal
      row: 4
      step: 2
    - name: country
      label: País
      row: 4
      step: 2
    - name: email
      label: E-mail
      row: 5
      step: 2
    - name: tel
      label: TEL
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Volume estimado do pedido
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Precisa de personalização?
      row: 7
      step: 2
    - name: productInterest
      label: Categorias de produtos de interesse
      row: 8
      step: 2
    - name: subject
      label: Assunto
      row: 9
      step: 3
    - name: message
      label: Mensagem
      row: 10
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: Outras formas de nos contactar
  columns: 3
  items:
    - title: Vendas
      description: Orçamentos, configurações, candidaturas a distribuidor e encomendas em volume.
      icon: tabler:shopping-bag
    - title: Apoio técnico
      description: Garantia, reparações, peças sobresselentes e questões de operação.
      icon: tabler:tool
    - title: Imprensa e parcerias
      description: Kits de imprensa, patrocínios e colaboração no setor.
      icon: tabler:news
    - title: Telefone
      description: +86 13305324192
      icon: tabler:headset
    - title: E-mail
      description: info@afarer.com
      icon: tabler:mail
    - title: Sede
      description: Economic Development Zone, Laixi, Qingdao, China, 266600
      icon: tabler:map-pin
map:
  title: A nossa localização
  subtitle: Visite-nos na nossa sede
  address: Economic Development Zone, Laixi, Qingdao, China, 266600
  zoom: 15

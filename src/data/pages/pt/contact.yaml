meta:
  title: 'Contato — Consultas de Parceria e Produtos | {SITE}'
  description: 'Contate a afarer para consultas de parceria, co-brand e marca própria, ou frotas profissionais. Fabricante de SUP inflável e barcos, respondemos em 2 dias úteis.'
  keywords:
    - 'contatar a afarer'
    - 'orçamento distribuidor de SUP'
    - 'fornecedor profissional de SUP'
    - 'contatar fabricante de SUP'
hero_text:
  tagline: Contacto
  title: ENTRE EM CONTACTO
contact_form:
  id: form
  title: Envie-nos uma mensagem
  subtitle: Para orçamentos, questões técnicas ou propostas de parceria, escreva-nos. Respondemos num dia útil.
  email_to: info@afarer.com
  submit_button: Enviar mensagem
  success_message: Obrigado! A sua mensagem chegou à nossa caixa de entrada. Responderemos num dia útil.
  error_message: Ocorreu um erro ao enviar a sua mensagem. Tente novamente ou envie-nos um e-mail diretamente.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: por favor, resolva o seguinte'
  fields:
    - name: firstName
      label: Primeiro Nome
      row: 1
      type: select
      optionsKey: países
      step: 1
    - name: lastName
      label: Último Nome
      row: 1
      type: select
      options:
        - value: ''
          label: Selecione seu volume estimado...
        - value: amostra
          label: Apenas amostras / protótipos
        - value: 5-10
          label: 5–10 unidades (MOQ padrão)
        - value: 100-500
          label: 100–500 unidades
        - value: mais de 500
          label: 500 unidades (Preços por volume)
      step: 1
    - name: companyName
      label: Nome da Empresa
      row: 2
      type: select
      options:
        - value: ''
          label: Selecione o tipo de personalização...
        - value: nenhum
          label: Produto padrão (sem personalização)
        - value: logo
          label: Apenas Logotipo / Marca Personalizada
        - value: cheio
          label: Co-brand completo (tamanho, cor, gráficos, embalagem)
        - value: consulta
          label: Não tenho certeza — preciso de consulta
      step: 1
    - name: address
      label: Morada
      row: 3
      type: select
      options:
        - value: ''
          label: Selecione a categoria do produto...
        - value: todos
          label: Todos os produtos / Catálogo completo
        - value: e aí
          label: Pranchas de SUP / Pranchas de Stand Up Paddle
        - value: segurança
          label: Equipamento de Segurança / Coletes Salva-vidas
        - value: acessório
          label: Acessórios (bombas, remos, bolsas)
      step: 1
    - name: zip
      label: Código Postal
      row: 4
      step: 2
    - name: country
      label: País
      row: 4
      step: 2
    - name: email
      label: E-mail
      row: 5
      step: 2
    - name: tel
      label: TEL
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Volume estimado do pedido
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Precisa de personalização?
      row: 7
      step: 2
    - name: productInterest
      label: Categorias de produtos de interesse
      row: 8
      step: 2
    - name: subject
      label: Assunto
      row: 9
      step: 3
    - name: message
      label: Mensagem
      row: 10
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: Outras formas de nos contactar
  columns: 3
  items:

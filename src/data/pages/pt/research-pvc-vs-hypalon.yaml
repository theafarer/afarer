hero:
  tagline: Materiais
  title: PVC vs Hypalon — Comparação Técnica para Barcos Infláveis
  subtitle: Leitura de 10 min
content_html: |-
  <h2>Visão Geral dos Materiais</h2>

  <h3>PVC (Cloreto de Polivinilo)</h3>
  <p>O PVC é um polímero termoplástico amplamente utilizado no fabrico de barcos insufláveis. Para aplicações marítimas, é normalmente reforçado com um tecido de poliéster (1,100 – 1,680 DTEX) e revestido em ambos os lados. As formulações modernas de PVC marítimo incluem estabilizadores UV e plastificantes para melhorar a flexibilidade e a resistência às intempéries.</p>

  <h3>Hypalon (CSM – Polietileno Clorossulfonado)</h3>
  <p>O Hypalon é um composto de borracha sintética (agora produzido genericamente como CSM, depois de a DuPont ter descontinuado a marca Hypalon). É reconhecido pela excecional resistência aos raios UV e ao ozono, o que o torna o material preferido para barcos insufláveis profissionais e de grau militar que passam longos períodos sob luz solar direta.</p>

  <h2>Comparação Lado a Lado</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Propriedade</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">PVC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Hypalon (CSM)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">Resistência aos UV</td><td class="p-3 border">Boa (com estabilizadores)</td><td class="p-3 border">Excelente (inerente)</td></tr>
      <tr><td class="p-3 border font-medium">Resistência à abrasão</td><td class="p-3 border">Boa</td><td class="p-3 border">Muito boa</td></tr>
      <tr><td class="p-3 border font-medium">Resistência à tração</td><td class="p-3 border">3,000 – 5,000 N/5cm</td><td class="p-3 border">2,500 – 4,000 N/5cm</td></tr>
      <tr><td class="p-3 border font-medium">Peso (por m&sup2;)</td><td class="p-3 border">850 – 1,200 g</td><td class="p-3 border">1,100 – 1,500 g</td></tr>
      <tr><td class="p-3 border font-medium">Flexão a frio (baixa temperatura)</td><td class="p-3 border">-30&deg;C</td><td class="p-3 border">-20&deg;C</td></tr>
      <tr><td class="p-3 border font-medium">Capacidade de reparação</td><td class="p-3 border">Fácil (soldadura a quente ou adesivo)</td><td class="p-3 border">Requer adesivo CSM especial</td></tr>
      <tr><td class="p-3 border font-medium">Método de união</td><td class="p-3 border">Soldadura RF, soldadura a ar quente</td><td class="p-3 border">Colagem manual (cimento de contacto)</td></tr>
      <tr><td class="p-3 border font-medium">Custo (material)</td><td class="p-3 border">$8 – $15 / m&sup2;</td><td class="p-3 border">$20 – $40 / m&sup2;</td></tr>
      <tr><td class="p-3 border font-medium">Vida útil (sol tropical)</td><td class="p-3 border">5 – 8 anos</td><td class="p-3 border">10 – 15 anos</td></tr>
    </tbody>
  </table>

  <h2>Qual Deve Escolher?</h2>

  <h3>Escolha PVC Quando:</h3>
  <ul>
    <li>O orçamento é uma preocupação principal</li>
    <li>O barco será armazenado fora da luz solar direta</li>
    <li>O peso é importante (o PVC é 15 – 25% mais leve)</li>
    <li>Precisa de flexibilidade em clima frio abaixo de -20&deg;C</li>
    <li>Quer uma gama mais ampla de opções de cores</li>
  </ul>

  <h3>Escolha Hypalon Quando:</h3>
  <ul>
    <li>O barco será atracado ou armazenado sob luz solar direta</li>
    <li>Está num ambiente tropical ou de elevada exposição UV</li>
    <li>A durabilidade e a vida útil máximas são a prioridade</li>
    <li>Está a equipar frotas profissionais ou comerciais</li>
    <li>A abrasão por areia, betão ou docas é uma preocupação</li>
  </ul>

  <h2>Diferenças de Fabrico</h2>
  <p>Os barcos de PVC são fabricados com soldadura RF (radiofrequência) ou soldadura a ar quente, que cria uma ligação molecular entre as camadas de tecido revestido. Isto permite uma produção automatizada e consistente com elevado rendimento. Os barcos de Hypalon são montados com colagem manual com cimento de contacto. Cada costura é enrolada e pressionada manualmente, o que torna a produção de Hypalon mais intensiva em mão de obra.</p>

  <h2>Recomendação da Afarer</h2>
  <p>Para a maioria dos utilizadores recreativos, o PVC marítimo moderno de alta qualidade com estabilizadores UV oferece o melhor equilíbrio entre custo, peso, desempenho e durabilidade. A Afarer utiliza PVC marítimo de 1,680 DTEX com revestimento de três camadas para as suas linhas de produtos de consumo e OEM. Para clientes comerciais e governamentais que necessitam de exposição UV prolongada, oferecemos fabrico em Hypalon mediante pedido.</p>

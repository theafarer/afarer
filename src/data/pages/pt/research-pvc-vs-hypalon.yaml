hero:
  tagline: Materiais
  title: PVC vs Hypalon — Comparação Técnica para Barcos Infláveis
  subtitle: Leitura de 10 min
content_html: >
  <h2>Visão Geral do Material</h2>


  <h3>PVC (Policloreto de Vinila)</h3>

  <p>O PVC é um polímero termoplástico amplamente utilizado na fabricação de barcos infláveis. Para aplicações marítimas, normalmente é reforçado com um scrim de poliéster (1.100 – 1.680 DTEX) e revestido em ambos os lados. Formulações modernas de PVC marinho incluem estabilizadores UV e
  plastificantes para melhorar a flexibilidade e a resistência às intempéries.</p>


  <h3>Hypalon (CSM – Polietileno Clorosulfonado)</h3>

  <p>Hypalon é um composto de borracha sintética (atualmente produzido genericamente como CSM após a DuPont descontinuar a marca Hypalon). É reconhecida por sua excepcional resistência aos raios UV e ozônio, tornando-se o material preferido para barcos infláveis profissionais e militares que passam
  longos períodos sob luz solar direta.</p>


  <h2>Comparação Lado a Lado</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <ª classe="p-3 texto-fonte esquerda-texto seminegrito-cinza-borda 900">Propriedade</th>
        <ª classe="p-3 texto-esquerda-fonte semi-negrito texto-cinza-900 borda">PVC</th>
        <ª classe="p-3 texto-fonte esquerda-texto seminegrito-cinza-borda 900">Hypalon (CSM)</th>
      </tr>
    </thead>
    <tbody>
      <tr><classe td="fonte borda p-média">resistência UV</td><classe td="borda p-3">Boa (com estabilizadores)</td><classe td="borda p-3">Excelente (inerente)</td></tr>
      <tr><td class="p-3 borda fonte-média">Resistência à abrasão</td><td class="p-3 borda">Bom</td><td class="p-3 borda">Muito bom</td></tr>
      <tr><classe td="fonte da borda p-3 média">Resistência à tração</td><classe td="borda p-3">3.000 – 5.000 N/5cm</td><classe td="borda p-3">2.500 – 4.000 N/5cm</td></tr>
      <tr><td class="p-3 borda fonte-média">Peso (por m²)</td><td class="p-3 borda">850 – 1.200 g</td><td class="p-3 borda">1.100 – 1.500 g</td></tr>
      <tr><td class="p-3 borda fonte-média">Cold flex (baixa temperatura)</td><td class="p-3 borda">-30°C</td><td class="p-3 borda">-20°C</td></tr>
      <tr><td class="p-3 border font-medium">Reparabilidade</td><td class="p-3 borda">Easy (solda térmica ou adesivo)</td><td class="p-3 borda">Requer adesivo especial CSM</td></tr>
      <tr><td class="p-3 borda fonte-média">Método de união</td><td class="p-3 borda">Soldagem RF, soldagem a ar quente</td><td class="borda p-3">Colagem manual (cimento de contato)</td></tr>
      <tr><td class="p-3 borda fonte-médio">Custo (material)</td><td class="p-3 borda">$8 – $15 / m²</td><td class="p-3 borda">$20 – $40 / m²</td></tr>
      <tr><classe td="fonte borda p-3" >Vida útil (sol tropical)</td><classe td="borda p-3">5 – 8 anos</td><classe td="borda p-3">10 – 15 anos</td></tr>
    </tbody>
  </table>


  <h2>Qual você deve escolher?</h2>


  <h3>Escolha PVC quando:</h3>

  <ul>
    <li>O orçamento é uma preocupação primária</li>
    <li>O barco será guardado fora da luz solar direta</li>
    <li>O peso importa (PVC é 15 a 25% mais leve)</li>
    <li>Você precisa de flexibilidade em clima frio abaixo de -20°C</li>
    <li>Você quer uma gama maior de opções de cores</li>
  </ul>


  <h3>Escolha Hypalon quando:</h3>

  <ul>
    <li>O barco será ancorado ou armazenado sob luz solar direta</li>
    <li>Você está em um ambiente tropical ou com alto nível UV</li>
    <li>Durabilidade máxima e longevidade são prioridades</li>
    <li>Você está equipando frotas profissionais ou comerciais</li>
    <li>Abrasão causada por areia, concreto ou docas é uma preocupação</li>
  </ul>


  <h2>Diferenças na Fabricação</h2>

  <p>Barcos de PVC são fabricados usando soldagem por RF (radiofrequência) ou soldagem a ar quente, que cria uma ligação molecular entre as camadas de tecido revestido. Isso permite uma produção automatizada, consistente e com alta taxa de trabalho. Os barcos Hypalon são montados usando colagem
  manual com cimento de contato. Cada emenda é laminada e prensada manualmente, tornando a produção do Hypalon mais intensiva em mão de obra.</p>


  <h2>Recomendação do Afarer</h2>

  <p>Para a maioria dos usuários recreativos, o PVC moderno de alta qualidade com estabilizadores UV oferece o melhor equilíbrio entre custo, peso, desempenho e durabilidade. A Afarer utiliza PVC marinho DTEX 1.680 com revestimento de três camadas para suas linhas de produtos de consumo e OEM. Para
  clientes comerciais e governamentais que necessitam de exposição prolongada aos raios UV, oferecemos fabricação de Hypalon sob demanda.</p>

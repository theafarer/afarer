intro: >-
  O casco é a espinha dorsal de qualquer RIB ou barco inflável. Ele deve ser leve o suficiente para planejar eficientemente, forte o suficiente para absorver cargas de impacto e dimensionalmente estável em uma ampla faixa de temperatura. No Afarer, nosso Estúdio de Engenharia de Casco combina
  modelagem avançada em CAD, análise por elementos finitos (FEA) e décadas de experiência prática em arquitetura naval para entregar cascos otimizados para sua missão específica — e não formas genéricas adaptadas de um catálogo.
content_html: >
  <h2>Onde a força encontra a hidrodinâmica</h2>

  <p>Trabalhamos com três materiais principais de casco — HDPE rotomoldado, alumínio de grau marítimo soldado e fibra de vidro laminada à mão — e temos capacidade de engenharia para projetar, simular e validar cada um internamente.</p>


  <h2>Ferramentas de projeto e normas</h2>

  <p>Nosso ambiente de engenharia digital inclui:</p>

  <table>
    <thead><tr><th>Capacidade</th><th>Software / Ferramenta</th><th>Aplicação</th></tr></thead>
    <tbody>
      <tr><td>Modelagem paramétrica 3D</td><td>SolidWorks Professional</td><td>Superfície do casco, sistema de longarinas, suporte do motor, disposição do convés</td></tr>
      <tr><td>Análise de elementos finitos</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Mapeamento de tensões, análise modal, simulação de colisão/impacto</td></tr>
      <tr><td>Fluidodinâmica computacional</td><td>Ansys Fluent / Star-CCM+</td><td>Previsão do arrasto hidrodinâmico, otimização do trim</td></tr>
      <tr><td>Engenharia de laminados</td><td>ESAComp / CADEC</td><td>Empilhamento de camadas de fibra de vidro, seleção do núcleo, estimativa de peso</td></tr>
      <tr><td>Simulação de fluxo no molde</td><td>Moldex3D</td><td>Previsão da espessura de parede na rotomoldagem</td></tr>
    </tbody>
  </table>


  <h2>Nosso fluxo de trabalho de engenharia</h2>

  <p>Todo projeto de casco, seja um modelo padrão ou um projeto totalmente personalizado, segue um rigoroso processo de cinco etapas:</p>

  <ol>
    <li><strong>Conceito e levantamento de requisitos</strong> — Reunimo-nos com você para definir carga útil, faixa de velocidade, capacidade para condições de mar, requisitos de reboque e qualquer equipamento especial de missão (escotilhas de convés, posições de console, integração do tanque de combustível).</li>
    <li><strong>Superfícies 3D e cálculo hidrostático</strong> — A forma do casco é modelada no SolidWorks e verificada quanto à estabilidade hidrostática (GM, braço de endireitamento) usando ferramentas de análise integradas.</li>
    <li><strong>FEA estrutural</strong> — São definidos casos de carga: estático (tripulação + equipamento), dinâmico (impactos de planagem a 5g) e batida de proa (queda de uma crista de onda a 3 m/s). Os contornos de tensão são analisados; é obrigatório um fator de segurança ≥ 2,5.</li>
    <li><strong>Otimização do arrasto por CFD</strong> — O casco é simulado em três condições de carga e cinco velocidades. A área da superfície molhada, o ângulo de trim e a resistência residual são reduzidos iterativamente.</li>
    <li><strong>Revisão e liberação do projeto</strong> — O pacote completo de engenharia (modelo 3D, relatório de FEA, relatório de CFD, estimativa de peso, livro de laminados) é revisado pelo nosso arquiteto naval sênior antes da liberação para a oficina de protótipos.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Distribuição de Tensões FEA — Casco RIB 450 Patrol (Alumínio 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Fator de segurança na carga útil máxima</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Redução do arrasto em relação à geração anterior</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Pressão máxima de batida de proa (limite de projeto)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Tempo acumulado de execução de FEA em 2025</span>
      </div>
    </div>
  </div>


  <h2>Personalização: o seu casco, as suas regras</h2>

  <p>Não existem dois operadores com requisitos idênticos. Um RIB de patrulha portuária precisa de um casco em V raso para estabilidade em baixa velocidade; uma embarcação de intercepção rápida precisa de um V profundo com bordas antispray; um barco de apoio ao mergulho precisa de uma boca larga e
  um espelho de popa baixo. Não impomos a sua aplicação a uma forma de casco pré-existente. Projetamos a partir da sua especificação.</p>

  <p>Exemplos de projetos recentes de engenharia de casco personalizado:</p>

  <ul>
    <li>Um casco HDPE de 6,8 m alongado para um operador turístico do Caribe, com proa reforçada para encalhes em praia (+15 % de espessura no fundo).</li>
    <li>Um RIB de alumínio leve de 7,2 m para uma guarda costeira, com anteparas integradas no tanque de combustível e reforços no armário de equipamentos.</li>
    <li>Uma lancha de mergulho de fibra de vidro de 5,5 m com espelho de popa rebaixado e caixas de bateria duplas, projetada para facilitar o reembarque de mergulhadores.</li>
  </ul>


  <h2>Nossos engenheiros</h2>

  <p>O estúdio é liderado por um arquiteto naval sênior com 14 anos de experiência em projeto de embarcações de alta velocidade, apoiado por dois engenheiros mecânicos especializados em FEA e CFD. Os três possuem diplomas avançados em engenharia naval ou arquitetura naval de universidades
  reconhecidas internacionalmente. A equipe publica regularmente em periódicos do setor e apresenta trabalhos em conferências como a International Conference on High-Performance Marine Vehicles.</p>


  <h2>Faça parceria conosco no seu próximo casco</h2>

  <p>Do primeiro esboço de conceito ao relatório final de tensões, o nosso Estúdio de Engenharia de Casco é o seu parceiro na criação de uma embarcação que não é apenas construída — mas projetada. Investimos horas de simulação antecipadamente para que cada solda, cada camada de laminado e cada curva
  do casco esteja lá por um motivo.</p>

  <p>Quer você precise de uma pequena modificação em um modelo existente ou de um projeto totalmente novo, estamos prontos para discutir seus requisitos.</p>

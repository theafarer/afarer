  description: 'Guia técnico sobre a espessura de pranchas SUP infláveis: como pranchas de 4", 5" e 6" diferem em rigidez, peso, estabilidade, rastreio e desempenho. Recomendações de espessura para touring, yoga, surf, corrida e remada geral.'

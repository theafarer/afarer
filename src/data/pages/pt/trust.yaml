faqs_sup:
  title: FAQs sobre Pranchas SUP
  subtitle: Perguntas comuns sobre nossas pranchas de stand-up paddle.
  columns: 2
  items:
    - title: Quais tamanhos de prancha SUP estão disponíveis?
      description: Oferecemos pranchas SUP de 9 pés a 12 pés, incluindo designs versáteis, de travessia, ioga e especializados. Nossos modelos mais vendidos incluem o Tropical Breeze (10 pés) e o Ocean Voyager (11 pés).
    - title: O que é construção drop-stitch?
      description: A construção drop-stitch usa milhares de fios de poliéster conectando as camadas superior e inferior da prancha, permitindo que ela mantenha alta pressão de ar (15—0 PSI) e alcance uma plataforma rígida e estável. Este é o padrão da indústria para SUPs infláveis premium.
    - title: Qual é o limite de peso para pranchas SUP?
      description: Nossas pranchas SUP suportam até 150 kg, dependendo do modelo e volume. A prancha Leviathan Wake é nosso modelo de maior capacidade, projetada para pilotos maiores e uso de ioga.
    - title: Vocês oferecem pacotes completos de SUP?
      description: Sim. Cada prancha SUP é enviada com um pacote completo incluindo remo de alumínio de 3 peças, bomba manual de alta pressão, leash de coil, mochila de viagem e kit de reparo. Alguns modelos também incluem um conjunto de barbatanas removível.
    - title: Qual é a garantia das pranchas SUP?
      description: Todas as pranchas SUP afarer têm garantia de um ano contra defeitos de fabricação, incluindo falha de junta, defeitos de válvula e delaminação de material sob uso normal.
    - title: Quanto tempo leva para inflar uma prancha SUP?
      description: Usando a bomba manual incluída, uma inflagem completa a 15 PSI leva aproximadamente 8 a 12 minutos. Para inflagem mais rápida, recomendamos nossa bomba elétrica afarer 12V, que infla uma prancha em menos de 4 minutos.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

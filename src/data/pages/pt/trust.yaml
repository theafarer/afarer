warranty_section:
  title: Garantia e Suporte Pós-Venda
  subtitle: Nós apoiamos cada produto com termos de garantia claros, processamento rápido de reivindicações e peças de reposição genuínas.
  items:
    - title: Garantia do Produto de 2 Anos
      desc: Todos os produtos Afarer possuem garantia de 2 anos contra defeitos de fabricação — falha de costura, defeitos na válvula e delaminação do material sob uso normal.
    - title: Suporte de Peças Vitalício
      desc: Peças de reposição genuínas — válvulas, kits de reparo, aletas, anéis em D — disponíveis para todos os modelos. Mantemos moldes e ferramentas por no mínimo 5 anos após o término da produção.
    - title: Resposta à Reivindicação em 48 Horas
      desc: Reclamações de garantia reconhecidas em até 48 horas. Placas de substituição enviadas em até 10 dias úteis para reclamações aprovadas.
    - title: Rede Global de Reparos
      desc: Centros de reparo autorizados em 15 países. Kits de reparo de campo disponíveis para operações remotas. Guias de reparo faça você mesmo para danos menores.
    - title: Suporte ao Cliente OEM
      desc: Gerentes de conta dedicados para parceiros B2B. Revisões de negócios trimestrais, planejamento de inventário e suporte de marketing co-branded.
    - title: Pacote de Certificação
      desc: Documentação completa de conformidade fornecida com cada remessa — Declaração CE, relatórios de teste, fichas de dados de segurança de materiais.
      link: /contact

steps2_manufacturing:
  title: Como garantimos a qualidade
  subtitle: Da inspeção de matéria-prima ao teste final de pressão —cada produto passa por uma cadeia de qualidade rigorosa.
  items:
    - title: Inspeção de Matéria-Prima
      description: Cada rolo de tecido PVC é testado quanto à espessura, resistência à tração e resistência UV antes de entrar em produção.
      icon: tabler:search
    - title: CQ em Processo
      description: Juntas soldadas, instalações de válvulas e uniões de câmara são inspecionados em cada estação durante a montagem.
      icon: tabler:eye
    - title: Teste de Pressão
      description: Cada produto inflável é inflado a 1,5x o PSI nominal e mantido por 24 horas para verificar a retenção de ar e a integridade das juntas.
      icon: tabler:wind
    - title: Inspeção Final
      description: Cada unidade é inspecionada quanto ao acabamento, hardware e embalagem antes de ser aprovada para envio. Amostras de lotes vão para nosso laboratório para testes destrutivos.
      icon: tabler:clipboard-check

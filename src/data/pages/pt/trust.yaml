features3_certifications:
  title: Certificações e Conformidade
  subtitle: Cada produto é testado e certificado de forma independente de acordo com os padrões internacionais.
  columns: 3
  isBeforeContent: true
  items:
    - title: Certificação CE
      description: Todos os SUPs, caiaques, dingues e RIBs afarer atendem ao padrão europeu de segurança CE para embarcações de recreio. Cada produto passa por testes de pressão, flutuabilidade e carga antes de sair da fábrica.
      icon: tabler:certificate
    - title: ''
      description: Nossa instalação de 12.000 m² em Qingdao opera sob um sistema de gestão da qualidade ISO 9001. Cada lote de produção é rastreável, documentado e inspecionado.
      icon: tabler:clipboard-check
    - title: Conformidade Social BSCI
      description: Somos certificados BSCI, garantindo práticas trabalhistas éticas, condições de trabalho seguras e responsabilidade ambiental em toda a nossa cadeia de suprimentos.
      icon: tabler:users
    - title: REACH e RoHS
      description: Todos os materiais —PVC, Hypalon, espuma EVA, adesivos —cumprem os regulamentos REACH e RoHS da UE. Sem substâncias restritas, sem concessões.
      icon: tabler:flask
    - title: Laboratório de Testes de Materiais
      description: O laboratório de materiais interno testa resistência à tração, resistência UV, integridade de juntas e abrasão para cada lote de tecido antes da produção.
      icon: tabler:microscope
    - title: Garantia de 2 Anos
      description: Cada produto afarer vem com garantia de dois anos contra defeitos de fabricação. Apoiamos o que construímos.
      icon: tabler:shield-check
testimonials:

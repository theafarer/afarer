faqs_sup:
  title: FAQs sobre Pranchas SUP
  subtitle: Perguntas comuns sobre nossas pranchas de stand-up paddle.
  columns: 2
  items:
    - title: Quais tamanhos de prancha SUP estão disponíveis?
      description: Oferecemos pranchas SUP de 9 pés a 12 pés, incluindo designs versáteis, de travessia, ioga e especializados. Nossos modelos mais vendidos incluem o Tropical Breeze (10 pés) e o Ocean Voyager (11 pés).
    - title: O que é construção drop-stitch?
      description: A construção drop-stitch usa milhares de fios de poliéster conectando as camadas superior e inferior da prancha, permitindo que ela mantenha alta pressão de ar (15–20 PSI) e alcance uma plataforma rígida e estável. Este é o padrão da indústria para SUPs infláveis premium.
    - title: Qual é o limite de peso para pranchas SUP?
      description: Nossas pranchas SUP suportam até 150 kg, dependendo do modelo e volume. A prancha Leviathan Wake é nosso modelo de maior capacidade, projetada para pilotos maiores e uso de ioga.
    - title: Vocês oferecem pacotes completos de SUP?
      description: Sim. Cada prancha SUP é enviada com um pacote completo incluindo remo de alumínio de 3 peças, bomba manual de alta pressão, leash de coil, mochila de viagem e kit de reparo. Alguns modelos também incluem um conjunto de barbatanas removível.
    - title: Qual é a garantia das pranchas SUP?
      description: Todas as pranchas SUP afarer têm garantia de um ano contra defeitos de fabricação, incluindo falha de junta, defeitos de válvula e delaminação de material sob uso normal.
    - title: Quanto tempo leva para inflar uma prancha SUP?
      description: Usando a bomba manual incluída, uma inflagem completa a 15 PSI leva aproximadamente 8 a 12 minutos. Para inflagem mais rápida, recomendamos nossa bomba elétrica afarer 12V, que infla uma prancha em menos de 4 minutos.
faqs_materials:
  title: FAQs sobre Material e Cuidados com SUP
  subtitle: Perguntas comuns sobre os materiais, cuidados e armazenamento do nosso SUP inflável.
  columns: 2
  items:
    - title: Quais materiais são usados nos SUPs infláveis afarer?
      description: Usamos PVC de grau militar (1100 denier) com construção resistente à abrasão e estabilizada contra UV, conforme os regulamentos REACH e RoHS da UE.
    - title: Quanto tempo duram os SUPs infláveis?
      description: Com os cuidados adequados, um SUP inflável de PVC de qualidade dura de 5 a 10 anos. Limpeza regular, proteção contra UV e armazenamento adequado aumentam significativamente a vida útil.
    - title: Qual manutenção é necessária para um SUP inflável?
      description: A manutenção básica inclui enxaguar com água doce após cada uso (especialmente em água salgada), secar antes de guardar, verificar as vedações das válvulas anualmente e evitar a exposição prolongada ao sol quando não estiver em uso.
    - title: Os SUPs infláveis podem ser usados em água salgada?
      description: Sim. Todos os SUPs infláveis da afarer são projetados para uso em água doce e salgada. Recomendamos enxaguar com água doce e secar completamente após a exposição à água salgada.
    - title: Como eu guardo um SUP inflável?
      description: Desflaute, limpe e seque completamente a prancha antes de guardá-la. Enrole de forma frouxa (evite dobras apertadas), armazene em um local fresco e seco, longe da luz solar direta, e mantenha longe de pisos de concreto para evitar a absorção de umidade.
    - title: Qual é a capacidade de peso dos SUPs infláveis da Afarer?
      description: As capacidades de peso variam de 100 kg para nossos modelos menores a mais de 200 kg para os modelos maiores. Cada página de produto lista a classificação de carga máxima para o seu modelo específico.

faqs_rib:
  title: 'FAQs sobre Barcos SUP'
  subtitle: 'Perguntas comuns sobre nossos botes infláveis de casco rígido.'
  columns: 2
  items:
    - title: 'Quais tamanhos de barcos SUP a afarer oferece?'
      description: 'Oferecemos 35 modelos SUP que variam de 2,5 m a 7,6 m, cobrindo desde tenders compactos até embarcações comerciais e de patrulha de serviço pesado. Cada modelo está disponível com múltiplas opções de configuração.'
    - title: 'Qual é a diferença entre um SUP e um bote inflável tradicional?'
      description: 'Um SUP (Rigid-Hull Inflatable Boat) combina um casco sólido em V profundo de fibra de vidro ou alumínio com tubos infláveis de Hypalon ou PVC. Isso oferece a estabilidade e capacidade de carga de um barco rígido com a absorção de choque e flutuabilidade de um inflável.'
    - title: 'Quais motores são compatíveis com os RIBs afarer?'
      description: 'Nossos RIBs suportam motores de popa de 3 HP a 250 HP, dependendo do modelo. Cada página de produto lista a potência máxima do motor recomendada. Recomendamos consultar seu revendedor para a combinação ideal.'
    - title: 'Os RIBs afarer são certificados CE?'
      description: 'Sim. Todos os modelos SUP recreativos são certificados CE de acordo com as normas europeias aplicáveis para embarcações de recreio. Os modelos comerciais e de patrulha atendem a requisitos adicionais de estabilidade e carga.'
    - title: 'Qual é a garantia dos barcos SUP?'
      description: 'Todos os RIBs afarer vêm com garantia padrão de um ano contra defeitos de fabricação, cobrindo delaminação do casco, falha de junta do tubo, defeitos de válvula e problemas de hardware.'
    - title: 'Quantas câmaras de ar os RIBs afarer possuem?'
      description: 'Nossos RIBs possuem de 3 a 7 câmaras de ar independentes, dependendo do comprimento do modelo. Este design de múltiplas câmaras garante que o barco permaneça flutuando mesmo se um compartimento for comprometido.'

faqs_inflatable:
  title: 'FAQs sobre Botes Infláveis'
  subtitle: 'Perguntas comuns sobre nossos dingues infláveis, caiaques e barcos.'
  columns: 2
  items:
    - title: 'Quais materiais são usados nos botes infláveis afarer?'
      description: 'Usamos PVC de grau militar (1100 denier) e borracha Hypalon/CSM premium, dependendo do modelo. Ambos os materiais são estabilizados contra UV, resistentes à abrasão e estão em conformidade com os regulamentos REACH e RoHS da UE.'
    - title: 'Quanto tempo duram os botes infláveis?'
      description: 'Com os cuidados adequados, um bote inflável de PVC de qualidade dura de 7 a 10 anos, enquanto os modelos Hypalon podem durar de 15 a 20 anos. Limpeza regular, proteção UV e armazenamento adequado prolongam significativamente a vida útil.'
    - title: 'Qual manutenção é necessária para um bote inflável?'
      description: 'A manutenção básica inclui enxágue com água doce após cada uso (especialmente em água salgada), secagem antes do armazenamento, verificação anual das vedações das válvulas e aplicação de protetor UV nos tubos. Evite exposição prolongada ao sol quando não estiver em uso.'
    - title: 'Botes infláveis podem ser usados em água salgada?'
      description: 'Sim. Todos os botes infláveis afarer são projetados para uso em água doce e salgada. Recomendamos enxaguar com água doce e secar completamente após a exposição à água salgada para evitar corrosão das ferragens e cristalização de sal no tecido.'
    - title: 'Como armazenar um bote inflável?'
      description: 'Esvazie, limpe e seque completamente o barco antes de armazenar. Enrole frouxamente (evite dobras apertadas), guarde em local fresco e seco, longe da luz solar direta, e mantenha longe de pisos de concreto para evitar absorção de umidade.'
    - title: 'Qual é a capacidade de peso dos botes infláveis afarer?'
      description: 'As capacidades de peso variam de 290 kg para nossos modelos menores a mais de 2.000 kg para embarcações comerciais maiores. Cada página de produto lista a capacidade máxima de carga para seu modelo específico.'

faqs_sup:
  title: 'FAQs sobre Pranchas SUP'
  subtitle: 'Perguntas comuns sobre nossas pranchas de stand-up paddle.'
  columns: 2
  items:
    - title: 'Quais tamanhos de prancha SUP estão disponíveis?'
      description: 'Oferecemos pranchas SUP de 9 pés a 12 pés, incluindo designs versáteis, de travessia, ioga e especializados. Nossos modelos mais vendidos incluem o Tropical Breeze (10 pés) e o Ocean Voyager (11 pés).'
    - title: 'O que é construção drop-stitch?'
      description: 'A construção drop-stitch usa milhares de fios de poliéster conectando as camadas superior e inferior da prancha, permitindo que ela mantenha alta pressão de ar (15—0 PSI) e alcance uma plataforma rígida e estável. Este é o padrão da indústria para SUPs infláveis premium.'
    - title: 'Qual é o limite de peso para pranchas SUP?'
      description: 'Nossas pranchas SUP suportam até 150 kg, dependendo do modelo e volume. A prancha Leviathan Wake é nosso modelo de maior capacidade, projetada para pilotos maiores e uso de ioga.'
    - title: 'Vocês oferecem pacotes completos de SUP?'
      description: 'Sim. Cada prancha SUP é enviada com um pacote completo incluindo remo de alumínio de 3 peças, bomba manual de alta pressão, leash de coil, mochila de viagem e kit de reparo. Alguns modelos também incluem um conjunto de barbatanas removível.'
    - title: 'Qual é a garantia das pranchas SUP?'
      description: 'Todas as pranchas SUP afarer têm garantia de um ano contra defeitos de fabricação, incluindo falha de junta, defeitos de válvula e delaminação de material sob uso normal.'
    - title: 'Quanto tempo leva para inflar uma prancha SUP?'
      description: 'Usando a bomba manual incluída, uma inflagem completa a 15 PSI leva aproximadamente 8 a 12 minutos. Para inflagem mais rápida, recomendamos nossa bomba elétrica afarer 12V, que infla uma prancha em menos de 4 minutos.'


hero:
  tagline: afarer Academy
  title: Centro de Aprendizagem
  subtitle: Guias e tutoriais para todos os níveis —desde básicos de SUP a técnicas avançadas de resgate

categories:
  - level: Iniciante
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: Fundamentos de SUP
        desc: Aprenda os fundamentos do paddleboarding em pé —postura, técnica de remada e equilíbrio.
        slug: sup-basics
      - title: Técnicas de Remo
        desc: Remada para frente, remada de varredura, remada de tração e brace baixo —domine os movimentos essenciais do remo.
        slug: paddle-techniques
      - title: Segurança Primeiro
        desc: Práticas essenciais de segurança incluindo verificação meteorológica, uso de PFD, regras de leash e autorresgate.
        slug: safety-first
  - level: Intermediário
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Essenciais de Passeio
        desc: Planeamento de remadas de várias horas —navegação, hidratação, ritmo e leitura de previsões de vento.
        slug: touring-essentials
      - title: Leitura Meteorológica
        desc: Interprete previsões marinhas, identifique padrões de nuvens e entenda os efeitos do vento na água.
        slug: weather-reading
      - title: Fundamentos de Navegação
        desc: Leitura de cartas, uso de bússola, waypoints GPS e planeamento de rotas para remada costeira.
        slug: navigation-basics
      - title: Consciência das Marés
        desc: Compreensão dos ciclos de marés, correntes e como afetam o timing de lançamento e a rota.
        slug: tidal-awareness
  - level: Avançado
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planeamento de Viagens de Vários Dias
        desc: Logística de expedição —seleção de equipamento, planeamento de refeições, protocolos de segurança e contactos de emergência.
        slug: multi-day-trip-planning
      - title: Técnicas de Resgate
        desc: Autorresgate, resgate T, resgate esquimó para caiaques e protocolos de reboque em águas abertas.
        slug: rescue-techniques
      - title: Remada Noturna
        desc: Navegação após o anoitecer —requisitos de iluminação, memória de rota, comunicação em grupo e consciência de perigos.
        slug: night-paddling
  - level: Manutenção
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Limpeza e Cuidados
        desc: Enxaguamento com água doce, proteção UV, prevenção de bolor e técnicas adequadas de secagem após cada sessão.
        slug: cleaning-and-care
      - title: Guia de Armazenamento
        desc: Melhores práticas para armazenar pranchas e barcos infláveis —desinsuflação, dobragem, controlo de temperatura e vida útil.
        slug: storage-guide
      - title: Fundamentos de Reparação
        desc: Repare pequenos furos, fugas em costuras e problemas de válvulas com kits de reparação PVC e técnicas de remendo.
        slug: repair-basics
      - title: Manutenção de Válvulas
        desc: Identifique tipos de válvulas (Halkey-Roberts, Boston, Leafield), limpe detritos e substitua hastes defeituosas.
        slug: valve-maintenance


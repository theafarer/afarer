meta:
  title: Programa de Parceiro Varejista SUP | {SITE}
  description: Programa de parceria de atacado SUP para varejistas e lojas de artigos esportivos. Linha completa de produtos, opções de dropshipping, margens de atacado competitivas de 20–35% e MOQ baixo para começar.
hero:
  tagline: Parceiros de Varejo
  title: Venda SUPs infláveis premium<br />com margens que funcionam
  subtitle: Torne-se parceiro de varejo da Afarer — leve a marca SUP de crescimento mais rápido do seu mercado com preços de atacado completos, dropshipping, materiais de marketing profissionais e suporte dedicado.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Pranchas Afarer SUP exibidas em uma loja de varejo
margin_section:
  title: Margens de Varejo e MOQ
  subtitle: Camadas de preços por atacado projetadas para a lucratividade no varejo.
  items:
    - tier: Parceiro Básico
      discount: 20%
      moq: 500 unidades/ano
      margin_note: ~$150–250 de lucro por placa
      features:
        - Acesso à linha completa de produtos
        - Pacote de materiais de marketing
        - Suporte por e-mail
        - Acesso ao catálogo de produtos
    - tier: Parceiro Premium
      discount: 30%
      moq: 2.000 unidades/ano
      margin_note: ~$250–400 de lucro por placa
      features:
        - Gerente de conta dedicado
        - Proteção exclusiva de território
        - Suporte de marketing personalizado
        - Primeiro acesso a novos produtos
        - Sessões de treinamento de equipe
    - tier: Parceiro Principal
      discount: 35%
      moq: 5.000 unidades/ano
      margin_note: ~US$350–500 de lucro por placa
      features:
        - Campanhas de marketing co-branded
        - Suporte para exibição na loja
        - Treinamento de equipe no local
        - Promoções conjuntas nas redes sociais
        - Alocação prioritária de produção
product_line:
  title: Linha Completa de Produtos
  subtitle: Uma prancha de SUP para cada cliente que entrar pela sua porta.
  items:
    - name: All-Round Series
      description: Mais vendido — serve para 80% dos clientes
    - name: Touring Series
      description: Remadores de alto desempenho — margem maior
    - name: Yoga Series
      description: Mercado de nicho — precificação premium
    - name: Kids Series
      description: Clientes familiares — comprador recorrente
    - name: Racing Series
      description: Mercado de entusiastas — halo da marca
    - name: Accessories
      description: Complementos de alta margem (remo, coletes, bombas, bolsas)
catalog:
  title: Recursos para Parceiros de Varejo
  subtitle: Baixe nosso kit abrangente para parceiros de varejo.
  items:
    - name: 2026 Product Catalog
      desc: Linha completa com especificações, preços e informações de pedido
      icon: tabler:file-text
      link: /resources/download-catalog
    - name: Retail Partner Guide
      desc: Calculadora de margem, dicas de merchandising e melhores práticas
      icon: tabler:book
      link: /resources/download-catalog
    - name: Marketing Asset Pack
      desc: Fotos de produtos em alta resolução, imagens de estilo de vida e materiais de PDV
      icon: tabler:photo
      link: /media
support:
  title: Suporte ao Parceiro de Varejo
  subtitle: Tudo o que você precisa para vender com confiança.
  items:
    - Imagens de produtos em alta resolução (fotografia profissional)
    - Fotos de estilo de vida para redes sociais, site e catálogo
    - Materiais de marketing — pôsteres, etiquetas de prateleira, banners
    - Vídeos de treinamento de produtos para a educação da equipe
    - Pacote de conteúdo para redes sociais (postagens semanais)
    - Descrições de produtos otimizadas para SEO
    - Opção de dropshipping disponível — sem risco de estoque
    - Condições de pagamento Net 30
cta:
  title: Pronto para se tornar parceiro de varejo da Afarer?
  subtitle: Candidate-se à parceria ou baixe nosso catálogo de varejo para começar.
  actions:
    - text: Candidatar-se à Parceria
      href: /contact?partner=retail
      variant: primary
    - text: Baixar Catálogo de Varejo
      href: /resources/download-catalog
      variant: secondary

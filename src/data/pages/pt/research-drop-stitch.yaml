  title: Como Funciona o Drop Stitch — A Engenharia por Trás dos Núcleos Rígidos Infláveis
  subtitle: Leitura de 8 min
content_html: >
  <h2>O que é ponto de gota?</h2>

  <p>Ponto de gota (também chamado de "tecido de ponto de volta" ou "núcleo de ponto de gota") é um método de construção no qual milhares de fios individuais de poliéster conectam as camadas superior e inferior de uma camada de tecido. Quando a carcaça é inflada, essas roscas atuam como elementos de
  tensão interna — elas impedem que os painéis superior e inferior se projetem para fora formando uma forma arredondada, forçando o painel a permanecer plano e rígido.</p>

  <p>O resultado é uma estrutura leve e portátil, capaz de suportar pressão interna de 15 a 20 PSI — comparável à rigidez de uma placa de carcaça rígida, mas totalmente desinflavel para armazenamento e transporte.</p>


  <h2>Como Funciona: A Física</h2>

  <p>Em uma estrutura inflável convencional (como um balão ou um colchão inflável), a pressão interna do ar empurra igualmente em todas as direções. Sem restrições internas, a estrutura torna-se cilíndrica ou esférica. O ponto de queda resolve isso ao introduzir reforço de tração:</p>

  <ul>
    <li>Milhares de fios conectam as camadas superior e inferior do tecido</li>
    <li>Quando inflado, a pressão do ar tenta afastar o topo e a base</li>
    <li>As roscas resistem a essa separação, transferindo a carga para a tensão ao longo do eixo da rosca</li>
    <li>O resultado é um painel plano e rígido que resiste à flexão</li>
  </ul>


  <h2>Processo de Construção</h2>

  <ol>
    <li><strong>Tecelagem:</strong> As linhas de poliéster são tecidas simultaneamente em duas camadas separadas de tecido base (tipicamente 1.100 DTEX ou 1.680 DTEX de poliéster revestido com PVC). Os fios são entrelaçados em laço entre as camadas em um ângulo de 90°.</li>
    <li><strong>Revestimento:</strong> O tecido base tecido é revestido com PVC (ou ocasionalmente TPU) usando um processo de revestimento com faca ou caldo. Isso sela as roscas e cria a membrana hermética.</li>
    <li><strong>Aderência de camadas:</strong> O núcleo do ponto de queda é fixado às camadas laminadas externas (tipicamente PVC de 0,9 mm ou 1,2 mm) usando laminação térmica ou adesivo.</li>
    <li><strong>Soldagem:</strong> As faixas de trilho são soldadas ao longo das bordas usando soldagem a ar quente, RF ou soldagem de alta frequência para criar as paredes laterais da placa.</li>
    <li><strong>Instalação de válvulas:</strong> Válvulas Boston ou válvulas Halkey-Roberts são instaladas, normalmente com um mecanismo de alívio de pressão para evitar superinflação.</li>
  </ol>



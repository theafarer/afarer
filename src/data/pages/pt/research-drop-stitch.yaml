  title: Como Funciona o Drop Stitch — A Engenharia por Trás dos Núcleos Rígidos Infláveis
  subtitle: Leitura de 8 min
content_html: |-
  <h2>O que é o Drop Stitch?</h2>
  <p>O drop stitch (também designado "tecido drop-stitch" ou "núcleo drop-stitch") é um método de construção em que milhares de fios individuais de poliéster ligam as camadas superior e inferior de um invólucro de tecido. Quando o invólucro é insuflado, estes fios funcionam como elementos de tração internos — impedem que os painéis superior e inferior se projetem para fora numa forma redonda, forçando o painel a permanecer plano e rígido.</p>
  <p>O resultado é uma estrutura leve e portátil que suporta 15 – 20 PSI de pressão interna — comparável à rigidez de uma prancha de casco rígido, mas totalmente desinsuflável para armazenamento e transporte.</p>

  <h2>Como Funciona: A Física</h2>
  <p>Numa estrutura insuflável convencional (como um balão ou um colchão de ar), a pressão interna do ar empurra igualmente em todas as direções. Sem contenção interna, a estrutura torna-se cilíndrica ou esférica. O drop stitch resolve isto através de reforço por tração:</p>
  <ul>
    <li>Milhares de fios ligam as camadas superior e inferior do tecido</li>
    <li>Quando insuflado, a pressão do ar tenta separar a parte superior da inferior</li>
    <li>Os fios resistem a essa separação, transferindo a carga para tração ao longo do eixo do fio</li>
    <li>O resultado é um painel plano e rígido que resiste à flexão</li>
  </ul>

  <h2>Processo de Construção</h2>
  <ol>
    <li><strong>Tecelagem:</strong> Os fios de poliéster são tecidos simultaneamente em duas camadas separadas de tecido base (normalmente poliéster revestido a PVC de 1,100 DTEX ou 1,680 DTEX). Os fios são tecidos em laçada entre as camadas num ângulo de 90&deg;.</li>
    <li><strong>Revestimento:</strong> O tecido base tecido é revestido com PVC (ou ocasionalmente TPU) através de um processo de revestimento por espátula ou por cilindro. Isto sela os fios e cria a membrana estanque ao ar.</li>
    <li><strong>Ligação de camadas:</strong> O núcleo drop-stitch é ligado a camadas exteriores laminadas (normalmente PVC de 0.9 mm ou 1.2 mm) através de laminação a quente ou adesivo.</li>
    <li><strong>Soldadura:</strong> As cintas laterais (rail bands) são soldadas ao longo dos rebordos com soldadura a ar quente, soldadura RF ou soldadura de alta frequência, para criar as paredes laterais da prancha.</li>
    <li><strong>Instalação de válvulas:</strong> São instaladas válvulas Boston ou válvulas Halkey-Roberts, normalmente com um mecanismo de alívio de pressão para evitar a sobre-insuflação.</li>
  </ol>

  <h2>Principais Indicadores de Qualidade</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parâmetro</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Nível de Entrada</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Densidade de fios</td><td class="p-3 border">1 fio / sq in</td><td class="p-3 border">2 fios / sq in</td></tr>
      <tr><td class="p-3 border">Tecido base</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Pressão máxima</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Espessura do PVC</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Construção da cinta</td><td class="p-3 border">Dobrada &amp; colada</td><td class="p-3 border">Soldada &amp; fusionada</td></tr>
    </tbody>
  </table>

  <h2>Aplicações</h2>
  <ul>
    <li><strong>Pranchas de SUP:</strong> 4" – 6" de espessura, 15 – 20 PSI, 1 – 2 fios/sq in</li>
    <li><strong>Caiaques:</strong> Piso em drop stitch + câmaras laterais insufláveis, piso de 10 – 15 PSI</li>
    <li><strong>Pisos de RIB:</strong> Pisos em drop stitch para tender RIB leves e compactáveis, 12 – 18 PSI</li>
    <li><strong>Defensas de barco:</strong> Drop stitch de baixa pressão para defensas moldadas com faces planas</li>
  </ul>

  <h2>Drop Stitch vs. Deck de Ar (Núcleo de Fibra de Vidro ou Madeira)</h2>
  <p>As pranchas de casco rígido usam núcleos de espuma EPS com reforço de fibra de vidro ou longarinas de madeira. São mais leves, mais rígidas e mais responsivas — mas não podem ser desinsufladas. O drop stitch troca alguma rigidez por portabilidade total. Para a maioria dos utilizadores recreativos, os SUPs modernos em drop stitch a 20 PSI são indistinguíveis, em rigidez, das pranchas rígidas de nível de entrada.</p>

  <h2>Como a Afarer Utiliza o Drop Stitch</h2>
  <p>A Afarer utiliza um núcleo drop-stitch de 1,680 DTEX em toda a sua linha de SUPs, com 2 fios por polegada quadrada e um laminado exterior de PVC de 1.2 mm. As pranchas estão classificadas para 20 PSI e são submetidas a um teste de retenção de pressão de 24–48 horas a 1.25x a pressão nominal antes do envio. As cintas laterais são soldadas a ar quente com fusão de três camadas, e as válvulas de alívio de pressão são padrão em todos os modelos.</p>

  <h2>Aplicações</h2>

  <ul>
    <li><strong>Placas SUP:</strong> 4" – 6" de espessura, 15 – 20 PSI, 1 – 2 roscas por polegada quadrada</li>
    <li><strong>Caiaques:</strong> Câmaras laterais infláveis com piso de ponto de descida, piso de 10 a 15 PSI</li>
    <li><strong>Pisos RIB:</strong> Pisos com ponto de queda para tenders RIB leves e compactáveis, 12 – 18 PSI</li>
    <li><strong>Para-lamas de barco:</strong> Ponto drop de baixa pressão para para-lamas moldados com faces planas</li>
  </ul>


  <h2>Ponto Drop vs. Air Deck (fibra de vidro ou núcleo de madeira)</h2>

  <p>Placas de casca rígida usam núcleos de espuma EPS com reforço de fibra de vidro ou madeira. Eles são mais leves, rígidos e mais responsivos — mas não podem ser esvaziados. Ponto de queda troca um pouco de rigidez por portabilidade total. Para a maioria dos usuários recreativos, os SUP modernos
  de drop-stitch a 20 PSI são indistinguíveis dos hardboards de entrada em rigidez.</p>


  <h2>Como o Afarer Usa o Ponto Drop</h2>

  <p>A Afarer utiliza um núcleo drop-point DTEX de 1.680 em toda sua linha SU, com 2 fios por polegada quadrada e um laminado externo de PVC de 1,2 mm. As placas são classificadas para 20 PSI e passam por um teste de manutenção de pressão de 24 horas a 1,5x a pressão nominal antes do envio. As
  bandas de trilho são soldadas a quente com fusão em três camadas, e válvulas de alívio de pressão são padrão em todos os modelos.</p>

geo:
  tagline: 'Quem Você Vai Atender'
  sentence: 'A Afarer se associa a distribuidores estabelecidos de náutica, outdoor e esportes que atendem redes de varejo, frotas de aluguel, escolas de esportes aquáticos, resorts e compradores governamentais com pranchas de SUP infláveis premium e embarcações.'
  audiences:
    - 'Distribuidores Marítimos e Náuticos'
    - 'Varejo de Outdoor e Esportes'
    - 'Operadores de Aluguel e Resorts'
    - 'Escolas de Esportes Aquáticos'

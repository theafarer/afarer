features:
  title: 'Por Que Se Associar à Afarer'
  subtitle: 'Feito para parceiros de canal que querem crescer um negócio de esportes aquáticos com uma marca séria por trás.'
  columns: 3
  items:
    - title: 'Exclusividade Territorial'
      description: 'Um mercado de país ou região protegido. Um único distribuidor, sem concorrência interna, sem conflito de canal — o seu investimento constrói o seu próprio fosso.'
      icon: 'tabler:shield-check'
    - title: 'Margens Diretas de Fábrica'
      description: 'Lista de preços de distribuidor com rebates por volume comprometido. Sem intermediários. Envio FOB Qingdao com documentação completa de exportação.'
      icon: 'tabler:coins'
    - title: 'Programa de Sucesso do Distribuidor'
      description: 'Onboarding estruturado, planejamento de go-to-market, treinamento de produto e vendas, apoio a frota de demonstração e ferramentas de co-marketing.'
      icon: 'tabler:rocket'
    - title: 'Suporte de Marketing e Marca'
      description: 'Materiais de campanha localizados, materiais de ponto de venda, kits para eventos e conteúdo digital em vários idiomas.'
      icon: 'tabler:mood-smile'
    - title: 'Cadeia de Suprimentos Confiável'
      description: 'Fabricação certificada ISO e CE com controle de qualidade consistente, MOQ previsíveis e prazos que você pode planejar.'
      icon: 'tabler:building-factory'
    - title: 'Gerente de Conta Dedicado'
      description: 'Um gerente de distribuição pessoal para previsão, planejamento de pedidos e suporte pós-venda.'
      icon: 'tabler:user-check'
table:
  title: 'Níveis do Programa e Condições de Pedido'
  subtitle: 'Escolha o nível que combina com o potencial do seu mercado. Todos os preços em USD, FOB Qingdao.'
  caption: 'Pedidos de amostra (5–10 unidades) não incluem proteção territorial. As condições são acordadas no seu Contrato de Distribuidor antes de qualquer envio.'
  head:
    - Nível do Programa
    - Pedido Mínimo (unidades)
    - Prazo de Entrega
    - Pagamento
  rows:
    - [Amostra / Avaliação de Produto, 5–10, 15–20 dias úteis, 100% pré-pago]
    - [Pedido Experimental, 10–30, 30–45 dias, 100% pré-pago]
    - [Revendedor Autorizado, 30–50, 30–45 dias, 30% de sinal / 70% antes do envio]
    - [Distribuidor País / Regional, 100–300, 30–45 dias, 30% de sinal / 70% antes do envio]
    - [Personalizado e Marca Própria (padrão), 50+, 30–45 dias, 30% de sinal / 70% antes do envio]
    - [Personalização Profunda (novos moldes, embalagem), 200+, 45–60 dias, 30% de sinal / 70% antes do envio]
    - [Direitos de Linha Completa de Produtos, 300–1, 000, 60–90 dias, 30% de sinal / 70% antes do envio]
faqs:
  title: 'Programa de Distribuidores — FAQ'
  subtitle: 'Tudo o que os distribuidores perguntam antes de se candidatar.'
  items:
    - title: 'O que significa um distribuidor por país?'
      description: 'A Afarer concede a um único distribuidor autorizado direitos exclusivos para um país ou região. Você é dono do seu mercado — sem importação paralela, sem concorrência interna.'
    - title: 'Qual é o pedido inicial mínimo?'
      description: 'Distribuidores de país e região começam com 100–300 unidades. Revendedores autorizados a partir de 30–50 unidades. Pedidos experimentais de 10–30 unidades permitem validar o mercado antes (sem proteção territorial).'
    - title: 'Qual suporte os distribuidores recebem?'
      description: 'O programa de sucesso do distribuidor cobre onboarding, planejamento de go-to-market, treinamento de produto e vendas, apoio à frota de demonstração, materiais de marketing localizados e gerente de conta dedicado.'
    - title: 'Como a Afarer me protege de conflitos de canal?'
      description: 'Cada território tem exatamente um distribuidor autorizado. Pedidos diretos da sua região passam por você e os preços protegem a sua margem.'
    - title: 'Quais são as condições de envio e pagamento?'
      description: 'Os pedidos são enviados FOB Qingdao com documentação completa de exportação. Pedidos de produção exigem 30% de sinal e 70% antes do envio; pedidos experimentais e de amostra são pré-pagos.'
    - title: 'Como faço para me candidatar?'
      description: 'Envie uma solicitação pelo formulário de contato. Avaliamos adequação ao mercado, presença no varejo e capacidade logística, e respondemos em 3 dias úteis com os próximos passos e um Contrato de Distribuidor modelo.'
cta:
  title: 'Pronto para ser dono do seu mercado?'
  subtitle: 'Candidate-se ao Programa de Distribuidores da Afarer e receba uma resposta em 3 dias úteis.'

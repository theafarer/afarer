faqs:
  title: 'Parceria de País — FAQ'
  subtitle: 'As perguntas que parceiros de país sérios fazem antes de se candidatar.'
  items:
    - title: 'O que significa de verdade «um país, um distribuidor»?'
      description: 'A Afarer nomeia um único distribuidor autorizado com direitos exclusivos para um território definido. Não vendemos pelos nossos canais globais ou regionais dentro de um país protegido. Você é dono do seu território enquanto a Distribution Agreement for cumprida.'
    - title: 'O território é exclusivo para sempre?'
      description: 'Não. A exclusividade é condicional, não perpétua. Ela é mantida por uma Distribution Agreement assinada, pela conclusão do seu primeiro pedido, metas anuais de compra, estoque local, capacidade de pós-venda e investimento contínuo no mercado. Se essas condições não forem cumpridas, o território pode ser renegociado ou reatribuído.'
    - title: 'Qual é o primeiro pedido mínimo?'
      description: 'Distribuidores de país e regionais começam com 100–300 unidades; revendedores autorizados, com 30–50 unidades; pedidos experimentais de 10–30 unidades permitem validar o mercado primeiro (pedidos de teste e amostra não têm proteção territorial). Programas personalizados e de marca própria seguem MOQ separados listados nos níveis acima.'
    - title: 'O que o programa de suporte de 10 módulos inclui?'
      description: 'Níveis e qualificação, proteção territorial, MOQ / preços / rebates anuais, estoque e execução de pedidos, materiais de marketing e fundos conjuntos de marketing, treinamento de produto / vendas / técnico, peças de reposição e pós-venda, registro de garantia, portal do parceiro, fichas técnicas de produto, biblioteca de materiais de marketing, cronograma de rebates anuais e listas de envio e embalagem.'
    - title: 'Como a Afarer me protege de conflitos de canal?'
      description: 'Cada território tem exatamente um distribuidor autorizado. Consultas e pedidos diretos da sua região passam por você, os formulários do site são encaminhados ao parceiro local quando existe um, e a equipe global só intervém quando um parceiro não responde.'
    - title: 'Quais são as condições de envio e pagamento?'
      description: 'Os pedidos são enviados FOB Qingdao com documentação completa de exportação. Pedidos de produção exigem 30% de sinal e 70% antes do envio; pedidos de teste e amostra são pagos antecipadamente. O prazo padrão é de 30–45 dias úteis, e de 15–20 dias úteis para séries de amostra.'
    - title: 'Como faço para me candidatar?'
      description: 'Envie sua candidatura pelo formulário de contato com as informações do seu mercado. Avaliamos adequação ao mercado, presença no varejo e capacidade logística, e respondemos em 3 dias úteis com os próximos passos e um modelo de Distribution Agreement.'

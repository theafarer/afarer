features:
  title: 'Por Que Se Associar à Afarer'
  subtitle: 'Um modelo de um país, um distribuidor com a estrutura de suporte para tornar o território rentável. A exclusividade é conquistada e mantida — não é um direito permanente.'
  columns: 3
  items:
    - title: 'Exclusividade Territorial'
      description: 'Um distribuidor autorizado por país ou região. Sem importações paralelas, sem concorrência interna. Seu investimento constrói seu próprio fosso.'
      icon: 'tabler:shield-check'
    - title: 'Proteção Contra Conflito de Canal'
      description: 'Pedidos diretos da sua região passam por você e os preços protegem sua margem. A Afarer não vende contornando seus parceiros de país.'
      icon: 'tabler:users'
    - title: 'Margens Diretas de Fábrica e Rebates'
      description: 'Lista de preços de revenda com rebates por volume comprometido. Sem intermediários. Envio FOB Qingdao com documentação completa de exportação.'
      icon: 'tabler:coins'
    - title: 'Programa de Suporte ao Parceiro com 10 Módulos'
      description: 'Onboarding, go-to-market, treinamento, marketing e fundos conjuntos de marketing, peças de reposição e pós-venda, garantia, ferramentas de pedido e portal do parceiro — cobertos pelo seu Distribution Agreement.'
      icon: 'tabler:rocket'
    - title: 'Marketing e Fundos Conjuntos de Marketing'
      description: 'Materiais de campanha localizados, materiais de ponto de venda, kits para eventos, conteúdo digital em vários idiomas e suporte de co-marketing para as temporadas de lançamento.'
      icon: 'tabler:mood-smile'
    - title: 'Treinamento de Produto, Vendas e Técnico'
      description: 'Sessões de onboarding estruturadas sobre conhecimento de produto, vendas e aspectos técnicos, com materiais atualizados à medida que a linha evolui.'
      icon: 'tabler:presentation'
    - title: 'Peças de Reposição e Suporte Pós-Venda'
      description: 'Fornecimento de peças de reposição, registro de garantia e tratamento de reclamações, fichas técnicas e manuais de produto para sua equipe de serviço local.'
      icon: 'tabler:settings'
    - title: 'Gerente de Conta Dedicado e Portal do Parceiro'
      description: 'Um gerente de distribuição pessoal, além de acesso a listas de preços, status de pedidos e recursos de marketing pelo portal do parceiro Afarer.'
      icon: 'tabler:user-check'

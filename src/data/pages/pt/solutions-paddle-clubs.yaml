meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Membros do clube de remo em pranchas Afarer SUP combinando
benefits:
  title: Benefícios da Frota do Clube
  subtitle: Por que clubes de remo em mais de 50 países escolhem a Afarer como seu parceiro de equipamentos.
  items:
    - metric: 40%
      label: Economia de Custos da Frota
      detail: Vs. preços ao varejo com descontos de clubes de compra em volume
    - metric: 48h
      label: Substituição de Peças
      detail: Tempo de inatividade mínimo para sua frota de aluguel
    - metric: Quinhentos
      label: Ciclos de Aluguel
      detail: Durabilidade de nível comercial por placa
    - metric: 5 anos
      label: Vida útil da frota
      detail: Com manutenção e cuidado adequados
packages:
  title: Programas de Frota do Clube
  subtitle: Escolha o programa de frota que corresponda ao tamanho e à ambição do seu clube.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Launch guide + safety checklist
        - Guia de lançamento   lista de verificação de segurança
        - Certificado CE — todos os equipamentos
      cta_text: Comece Seu Clube
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Replacement parts program (15% discount)
        - Staff training session
        - Sessão de treinamento da equipe (online)
        - Certificado CE — todos os equipamentos
      popular: true
      cta_text: Construa Sua Frota
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50 pranchas de corrida / alto desempenho
        - Full accessory set
        - Event support kit
        - Peças prioritárias (envio em 24h)
        - Gerente de conta dedicado
        - Opção de uniformes personalizados para equipe
        - Certificado CE — todos os equipamentos
      cta_text: Obter Frota de Competição
training:
  title: Pacotes do Centro de Treinamento
  subtitle: Tudo o que uma escola de SUP precisa para ministrar cursos de certificação profissional.
  items:
    - name: Instructor Starter
      features:
        - 5 pranchas SUP premium (nível instrutor)
        - 5 remos de carbono para demonstrações
        - 5 coletes salva-vidas (tamanho do instrutor)
        - Guia de currículo de treinamento
        - Equipamento certificado CE
    - name: School Full Set
      features:
        - 20 pranchas de SUP (mix de alunos e instrutores)
        - 20 remos   20 coletes salva-vidas (vários tamanhos)
        - 10 coletes salva-vidas para iniciantes
        - 4 bombas   kits de reparo
        - Currículo de treinamento e suporte à certificação
        - Equipamento certificado CE
features:
  title: Por Que os Clubes Escolhem a Afarer
  subtitle: Qualidade consistente, peças rápidas e preços em quantidade feitos para clubes em crescimento.
  items:
    - title: 500 Ciclos de Aluguel
      description: Tabuleiros de grau comercial sobrevivem a temporadas de uso diário.
      icon: tabler:shield-check
    - title: Cores Personalizadas
      description: Combine a identidade do seu clube com cores e logotipo personalizados do quadro.
      icon: tabler:palette
    - title: Preço por volume
      description: Descontos por volume para pedidos de frota de 10 placas.
      icon: tabler:discount
    - title: Peças Rápidas
      description: Peças de reposição enviadas em até 48 horas.
      icon: tabler:truck-delivery
    - title: Apoio ao Crescimento de Clubes
      description: Conselhos sobre programas de associação, precificação e organização de eventos.
      icon: tabler:trending-up
    - title: Certificado CE
      description: Todos os equipamentos atendem aos padrões internacionais de segurança.
      icon: tabler:certificate
cta:
  title: Pronto para construir seu clube de paddle?
  subtitle: Obtenha sua cotação de frota do clube ou baixe nosso guia inicial do clube.
  actions:
    - text: Inscreva-se para a Frota do Clube
      href: /contact?package=club
      variant: primary
    - text: Baixar Guia do Clube
      href: /resources/download-catalog
      variant: secondary

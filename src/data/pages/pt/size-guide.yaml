how_to_choose:
  title: Como escolher o tamanho certo
  cards:
    - title: Pranchas SUP
      description: Escolha o comprimento com base no seu peso e uso pretendido. Pranchas mais largas (32"+) oferecem mais estabilidade. Pranchas mais longas (11-12 pés) trackeiam melhor para touring. Remadores mais pesados precisam de pranchas de maior volume.
    - title: SUPs de Touring
      description: Pranchas mais longas (11–12 pés) são as melhores para percorrer distâncias e touring. Pranchas mais largas (32"+) oferecem mais estabilidade. Verifique a capacidade de peso para a carga total incluindo o equipamento.

    - title: Botes
      description: Escolha o comprimento do bote pelo número de passageiros e uso pretendido. Botes menores (2,7 m) funcionam como tender e plataformas de pesca.

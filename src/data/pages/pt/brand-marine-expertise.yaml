hero:
  tagline: Marine Expertise
  title: 'Décadas de Engenharia Naval<br />em Cada Casco'
  subtitle: 'afarer combina ciência dos materiais, fabricação de precisão e testes reais.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer marine engineering and R&D team at work
expertise_materials:
  tagline: Material Science
  title: 'Escolher o Material Certo<br />para Cada Aplicação'
  subtitle: 'Trabalhamos com três materiais principais – cada um para casos específicos.'
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: '1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.'
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: 'Resistência química e estabilidade UV superiores. Barcos Hypalon duram 15-20 anos. Recomendado para usos comerciais, resgate e militares.'
      icon: tabler:shield
    - title: Fiberglass & Aluminum
      description: 'Cascos Deep-V em fibra de vidro para RIBs e patrulha. Cascos de alumínio para trabalho pesado.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Manufacturing Capabilities
  title: 'Fabricação de Precisão<br />em Cada Etapa'
  subtitle: 'Nossa instalação de 12.000 m² é equipada com máquinas especializadas.'
  columns: 2
  items:
    - title: CNC Cutting
      description: 'O corte controlado por computador garante painéis precisos e repetíveis.'
      icon: tabler:cpu
    - title: High-Frequency Welding
      description: 'A soldagem HF industrial cria juntas mais fortes que o material base.'
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: 'Milhares de fios de poliéster conectam camadas para inflação de alta pressão (15-20 PSI).'
      icon: tabler:building-arch
    - title: Pressure Testing
      description: 'Cada produto inflável é testado sob pressão antes do envio.'
      icon: tabler:wind
    - title: Seam Strength Testing
      description: 'Amostras aleatórias passam por testes destrutivos de resistência.'
      icon: tabler:files
    - title: Water Testing
      description: 'Cada modelo SUP passa por testes de mar antes da certificação.'
      icon: tabler:droplet
expertise_design:
  tagline: Design & Engineering
  title: 'Projetado para Condições Reais'
  subtitle: 'Nossa filosofia de design começa com o uso do barco.'
  items:
    - title: Deep-V Hull Design
      description: "Our fiberglass hulls feature calculated deadrise angles optimized for each model's length and intended use. Steeper V for rough-water performance, shallower for stability."
    - title: Multi-Chamber Safety
      description: 'Cada barco possui 3-7 câmaras de ar independentes. Se um compartimento for comprometido, os demais'
    - title: Ergonomic Layout
      description: 'A posição do console, altura do tubo e colocação do assento são projetadas para conforto'
    - title: Custom Configuration
      description: 'Cores dos tubos, configuração do console, capacidade de combustível, suportes para acessórios – cada modelo personalizável'
cta:
  title: 'Tem uma aplicação específica?'
  subtitle: 'Nossa equipe de engenharia aconselha sobre materiais, design e fabricação.'
  actions:
    - variant: primary
      text: Ask our engineers
      href: /contact
    - text: View product range
      href: /products

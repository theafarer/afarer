  title: 'Fabricação OEM e de Marca Própria | {SITE}'
  description: 'Do conceito ao contêiner: personalize cada detalhe da sua linha de SUP inflável. Serviço OEM/ODM completo para marcas de paddle board de marca própria.'
  keywords:
    - 'fabricação OEM de SUP'

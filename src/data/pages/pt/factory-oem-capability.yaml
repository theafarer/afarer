hero:
  tagline: Fabricação OEM/ODM
  title: Fabricação OEM e Marca Própria
  subtitle: From concept to container — customize every detail of your inflatable watercraft line
intro: >-
  A afarer oferece serviços abrangentes de OEM e ODM para marcas, distribuidores e agências governamentais em todo o mundo. Com 10 anos de experiência em exportação e uma fábrica de 12.000 m² certificada ISO 9001 e BSCI, cuidamos de tudo, desde o design do produto e desenvolvimento de moldes até a
  produção em larga escala, embalagem e logística.

hero:
  tagline: Our Team
  title: 'As Pessoas Por Trás da afarer<br />—Engenharia da Liberdade'
  subtitle: 'Fundado em 2012 em Qingdao, China, a afarer foi construída por engenheiros navais, cientistas de materiais'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'De uma Oficina Costeira<br />a uma Instalação de 12.000 m²'
  subtitle: 'afarer foi fundado por uma equipe de engenheiros navais com décadas de experiência.'
  items:
    - title: 'Founded: 2012'
      description: 'Estabelecido em Qingdao, China – um importante centro marítimo.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'Incluindo 50+ engenheiros P&D, especialistas em controle de qualidade.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Fábrica dedicada com 6 linhas de produção para RIBs, infláveis e SUP.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Exportação para Europa, Américas, Oriente Médio, Ásia-Pacífico e África.'
      icon: tabler:globe
leadership:
  tagline: Leadership
  title: 'Liderança de Gestão & Engenharia'
  subtitle: 'Nossa equipe de liderança reúne expertise em engenharia naval, comércio internacional e gestão da qualidade.'
  columns: 3
  items:
    - title: 'Founder & CEO'
      name: 'Toby Liu'
      description: '15+ years in marine manufacturing. Previously led R&D at a major Chinese boat manufacturer. Holds multiple patents in inflatable boat design.'
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: 'Chief Engineer'
      name: 'Zhang Wei'
      description: '20+ years in PVC/Hypalon fabrication and deep-V hull design. Former technical director at a European marine engineering firm.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Head of R&D'
      name: 'Chen Ming'
      description: 'Doutorado em Ciência dos Materiais. Especializado em tecnologia drop-stitch e soldagem de alta frequência'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Diretor de Produção'
      name: 'Liu Qiang'
      description: '18+ years in lean manufacturing and production line optimization. Six Sigma Black Belt. Implemented ISO 9001 quality systems.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'

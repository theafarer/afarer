leadership:
  tagline: Liderança
  title: Liderança de Gestão & Engenharia
  subtitle: Nossa equipe de liderança reúne expertise em engenharia naval, comércio internacional e gestão da qualidade.
  columns: 3
  items:
    - title: Fundador e CEO
      name: Toby Liu
      description: 15 anos em fabricação marítima. Anteriormente liderou P&D em um grande fabricante de barcos chinês. Possui múltiplas patentes em design de barcos infláveis.
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: Engenheiro-Chefe
      name: Zhang Wei
      description: 20 anos em fabricação de PVC/Hypalon e design de casco Deep-V. Ex-diretor técnico em uma empresa europeia de engenharia naval.
      icon: tabler:engine
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Chefe de P&D
      name: Chen Ming
      description: Doutorado em Ciência dos Materiais. Especializado em tecnologia drop-stitch e soldagem de alta frequência
      icon: tabler:flask
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Diretor de Produção
      name: Liu Qiang
      description: 18 anos em manufatura enxuta e otimização de linhas de produção. Black Belt em Six Sigma. Implementou sistemas de qualidade ISO 9001.
      icon: tabler:settings
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Gerente de Qualidade
      name: Wang Fang
      description: 12 anos em controle de qualidade marinha. Auditor certificado CE e ISO. Supervisiona os testes de cada lote de produção.
      icon: tabler:shield-check
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Diretor de Vendas e Operações
      name: Helen Lee
      description: 15 anos em comércio B2B internacional. Gerenciou parcerias co-brand e de distribuição em 30 países. Fluente em 4 idiomas.
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Filosofia de Design
  title: Design Liderado por Engenharia<br />— Cada Detalhe Importa
  subtitle: Nossa filosofia de engenharia se concentra em três princípios.
  list:
    - 'Confiabilidade primeiro: cada produto afarer é testado para suportar condições reais'
    - 'Precisão de fabricação: nossas instalações usam corte CNC, soldagem de alta frequência'
    - 'Inovação contínua: nossa equipe de P&D avalia novos materiais, métodos de produção e designs'

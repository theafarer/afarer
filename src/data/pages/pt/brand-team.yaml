      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Design Philosophy
  title: 'Design Liderado por Engenharia<br />—Cada Detalhe Importa'
  subtitle: 'Nossa filosofia de engenharia se concentra em três princípios.'
  list:
    - 'Confiabilidade primeiro: cada produto afarer é testado para suportar condições reais'
    - 'Precisão de fabricação: nossas instalações usam corte CNC, soldagem de alta frequência'
    - 'Inovação contínua: nossa equipe de P&D avalia novos materiais, métodos de produção e designs'
cta:

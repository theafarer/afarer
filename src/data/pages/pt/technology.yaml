meta:
  title: 'Tecnologia — Drop Stitch e PVC Naval | {SITE}'
  description: 'Tecnologias afarer: construção drop stitch, PVC naval, estruturas de dupla camada e alta pressão. Inovação de um fabricante profissional de SUP inflável.'
  keywords:
    - 'tecnologia de SUP'
    - 'construção drop stitch'
    - 'SUP de alta pressão'
    - 'materiais de SUP inflável'
hero:
  tagline: Tecnologia
  title: Nossa tecnologia
  subtitle: Os produtos afarer são projetados com materiais avançados e engenharia inovadora para oferecer desempenho, durabilidade e portabilidade excepcionais.
sections:
  - title: Núcleo de Pontos Soltos
    description: Milhares de fios internos de poliéster conectam as camadas superior e inferior, criando uma estrutura rígida a 12-15 PSI. Esta é a mesma tecnologia usada em pranchas de stand-up paddle profissionais e SUPs infláveis de corrida.
    imageAlt: Diagrama Principal do DS
  - title: PVC Grau Marinho
    description: Tecido de PVC laminado em múltiplas camadas, classificado para ambientes marinhos. Cada camada é soldada por fusão em vez de colada, eliminando riscos de delaminação. Testado para resistência a UV, corrosão por água salgada e abrasão.
    imageAlt: Camada de PVC
  - title: PVC de grau militar
    description: Usado em todos os modelos SUP, o PVC premium oferece resistência superior aos raios UV e a produtos químicos. Mantém a flexibilidade em temperaturas extremas e resiste à degradação.
    imageAlt: PVC
  - title: Piso da Plataforma Aérea
    description: Construção inflável de alta pressão com drop-stitch oferecendo rigidez excepcional para ficar em pé, pescar e praticar yoga. Reduz o tempo de montagem, o peso total e o volume de armazenamento.
    imageAlt: Convés de Ar

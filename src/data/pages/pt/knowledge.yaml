meta:
  title: 'Conhecimento — Guias de SUP e Barcos | {SITE}'
  description: 'Base de conhecimento afar: guias sobre SUPs infláveis, materiais de paddle board, seleção de barcos e insights do setor para marcas e profissionais.'
  keywords:
    - 'conhecimento de SUP'
    - 'guia de SUP inflável'
    - 'materiais de paddle board'
    - 'insights do setor de SUP'
hero:
  tagline: Grafo de Conhecimento
  title: Conhecimento em Exploração Aquática
  subtitle: |
    Uma base de conhecimento estruturada cobrindo tecnologia de SUP inflável,<br />
    segurança aquática, engenharia de barcos e planejamento de aventuras.
  taglineSection: Explore. Aprenda. Vá com confiança.
clusters:
  tagline: Clusters de Conhecimento
  title: Explore por tópico
  subtitle: Aprofundamentos na tecnologia, segurança e habilidades por trás de cada produto afarer.
  items:
    - title: Conhecimento em SUP
      description: Desde escolher sua primeira prancha até técnicas avançadas de travessia — tudo sobre stand-up paddle.
      icon: tabler:lifebuoy
      topics:
        - Como escolher seu primeiro SUP inflável
        - Melhor tamanho de SUP para iniciantes
        - Qual a dificuldade do paddle board?
        - 'Comparação: inflável vs prancha rígida'
        - Lista de verificação de segurança SUP
    - title: Conhecimento em Barcos
      description: Guias técnicos sobre botes infláveis, RIBs, dingues e caiaques — engenharia, materiais e operação.
      icon: tabler:sailboat
      topics:
        - Tipos de botes infláveis explicados
        - Comparação PVC vs Hypalon
        - Comparação SUP vs Dingue
        - Aprofundamento em tecnologia drop-stitch
        - Guia de ciência dos materiais marítimos
    - title: Conhecimento em Segurança
      description: Conhecimento essencial de segurança para cada remador — desde seleção de colete salva-vidas até leitura meteorológica e técnicas de auto-resgate.
      icon: tabler:shield
      topics:
        - Lista de verificação de segurança SUP
        - Você precisa de um colete salva-vidas?
        - Guia de segurança para remo em oceano
        - Segurança em rios para caiaques infláveis
        - Consciência meteorológica e condições da água
    - title: Tecnologia
      description: A engenharia por trás dos produtos afarer — materiais, métodos de construção e testes de qualidade.
      icon: tabler:microscope
      topics:
        - Tecnologia de PVC de grau marítimo
        - Núcleo drop-stitch explicado
        - Por que o PSI é importante para SUPs infláveis
        - Soldagem RF vs colagem adesiva
        - Testes de qualidade e certificação
    - title: Estilo de Vida SUP e Usos Especiais
      description: Atividades de SUP especializadas — ioga, pesca, cães, famílias e dicas de viagem.
      icon: tabler:heart
      topics:
        - Yoga SUP e meditação na água
        - Pesca de um SUP inflável
        - Stand up paddle com cães e crianças
        - Viajando com seu SUP de avião e carro
        - Acessórios e equipamentos essenciais para SUP
    - title: Comparações e Referências de SUP
      description: Comparações lado a lado para ajudá-lo a tomar decisões informadas.
      icon: tabler:chart-bar
      topics:
        - SUP vs caiaque — qual é o certo para você?
        - Comparação de material PVC vs Hypalon
        - Segurança de câmara única vs câmara múltipla
        - Materiais de prancha de SUP explicados
        - Impressão UV vs arte em bloco de EVA

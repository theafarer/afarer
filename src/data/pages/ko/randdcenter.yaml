meta:
  title: 연구개발센터 | {SITE}
  description: 연구 및 개발 — PVC 직물 테스트, 선체 엔지니어링, RF 용접, 수역학 테스트 및 품질 관리. 맞춤형 R&D 서비스 제공.
hero:
  tagline: 연구개발센터
  title: R&D 센터
  subtitle: 진보에 집중
intro:
  - afarer 연구개발(R&D)센터는 수상 스포츠 장비를 혁신하겠다는 사명을 뒷받침하는 핵심 동력입니다. 인플레이터블 스탠드업 패들보드(SUP) 및 보트에 대한 끊임없는 혁신을 통해 전 세계 수상 스포츠 애호가들에게 더 안전하고, 더 편안하며, 더 즐거운 제품을 제공합니다. 우리 엔지니어, 디자이너 및 열정적인 수상 스포츠 전문가로 구성된 전담 팀은 산업의 미래를 만들어가며, 품질, 성능 및 지속가능성의 기준을 지속적으로 높이고 있습니다.
  - 당사의 R&D 시설은 소재 과학자, 조선설계사 및 생산 엔지니어를 하나의 지붕 아래에 모읍니다. 직물 배합 및 선체 시뮬레이션부터 용접 공정 개발 및 전면 해상 시험까지, 제품 개발의 모든 단계는 데이터에 의해 주도되고 테스트로 검증됩니다.
mission:
  tagline: 우리의 미션
  title: 수상 스포츠의 미래 혁신
  pillars:
    - icon: lightning
      title: 기술 발전
      desc: 우수한 제품 성능과 내구성을 위한 새로운 소재, 설계 및 제조 기술 개척.
    - icon: design
      title: 사용자 중심 설계
      desc: 인체공학적이고 직관적인 제품 설계를 통해 사용자 니즈를 깊이 이해하고 초월합니다.
    - icon: globe
      title: 지속가능한 운영
      desc: 친환경 자재 및 공정을 활용하여 환경 발자국을 최소화합니다.
    - icon: shield
      title: 타협 없는 안전
      desc: 철저한 테스트 및 인증을 통한 최고 수준의 안전 기준 확보.
pillars:
  - title: 기술 발전
    desc: 우수한 제품 성능과 내구성을 제공하기 위해 새로운 소재, 디자인, 제조 공정을 선도합니다.
    icon: tech
  - title: 첨단 소재
    desc: 향상된 제품 특성을 위한 최첨단 PVC, 하이팔론, 복합소재 및 지속가능한 대안 연구.
    icon: materials
  - title: 지속가능성
    desc: '핵심 가치: 지속가능한 제조와 재활용 소재를 통한 환경 보전에 전념하고 있습니다.'
    icon: sustainability
capabilities:
  tagline: 역량
  title: 연구개발 역량
  subtitle: 원자재 연구부터 최종 인증까지 제품 개발의 전체 과정을 통제하는 4대 핵심 분야.
  groups:
    - title: 소재 과학 및 직물 기술
      items:
        - PVC 및 Hypalon 제형 분석 및 최적화
        - UV 안정화, 난연성 및 항균 첨가제 개발
        - 다층 직물 라미네이션 및 접착 엔지니어링
        - 가속 노화 테스트(UV, 열, 습도, 염수 분무)
    - title: 선체 공학 및 유체역학
      items:
        - 파라메트릭 3D 선체 설계 및 CFD 최적화
        - 구조적 및 충격 하중에 대한 유한 요소 분석
        - 축소 모델 예인 수조 테스트 및 성능 검증
        - 특수 임무 프로파일을 위한 맞춤형 선체 개발
    - title: 용접 및 접합 기술
      items:
        - RF 유전체 용접 공정 개발 및 최적화
        - 핫에어, 핫웨지 및 초음파 용접 방식
        - 접착제 본딩 및 이음새 테이프 자격 인증
        - 용접 강도 모델링 및 수명 예측
    - title: 테스트, 인증 및 적합성
      items:
        - 품질 관리 및 CE 적합성 테스트
        - 독립 제3자 테스트 및 인증 지원
        - 조달 자격을 위한 맞춤 테스트 프로토콜 개발
        - 사용 중 고장 분석 및 근본 원인 조사

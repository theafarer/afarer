rd_services:
  tagline: 커스텀 R&D
  title: 파트너를 위한 R&D 서비스
  services:
    - title: 맞춤형 소재 개발
      desc: 고객의 운영 환경과 성능 목표에 맞춘 맞춤 원단 제형, 라미네이트 스택 및 접착제 시스템을 개발합니다.
    - title: OEM / ODM 제품 엔지니어링
      desc: 고객의 운영 환경과 성능 목표에 맞춘 맞춤 원단 제형, 라미네이트 스택 및 접착제 시스템을 개발합니다.
    - title: 제3자 테스트 및 인증
      desc: 독립적인 소재 시험, 제품 검증 및 인증 지원을 위해 ISO 규격을 충족하는 시험 시설을 이용하세요.
  cta: 연구개발 요구사항을 상담하세요 →
  cta_link: /contact
vision:
  tagline: 우리의 비전
  title: 수상 스포츠의 미래를 만들어갑니다
  body: afarer는 지속적인 혁신, 흔들리지 않는 품질, 안전과 지속가능성에 대한 확고한 의지를 통해 인플레이션 보트 및 SUP 산업을 선도하기 위해 노력하며, 궁극적으로 전 세계 수상 스포츠 매니아들의 경험을 풍부하게 합니다. afarer R&D 센터는 열정과 혁신이 만나는 곳으로, 수상 스포츠 산업의 새로운 기준을 설정합니다.
labs_section:
  tagline: 연구실
  title: 당사 연구소
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC 원단 연구소
      description: 해양 환경에서의 장기 신뢰성을 보장하기 위해 인장 강도, UV 저항성, 내마모성, 저온 유연성에 대한 PVC 및 Hypalon 튜브 원단의 지속적인 연구와 테스트를 수행합니다.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 선체 엔지니어링 스튜디오
      description: CAD 기반 설계 및 HDPE, 알루미늄, 유리섬유 선체의 유한요소 해석. 첫 프로토타입 제작 전 모든 선체의 응력 분포 및 충격 저항이 디지털 시뮬레이션됩니다.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: RF 용접 센터
      description: 정밀 온도 및 압력 제어를 갖춘 전용 고주파 용접 시설로, 인플레이터블 보트의 해양 산업 표준을 충족하는 고강도 기밀 이음새를 생산합니다.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 유체역학 테스트 탱크
      description: 자체 시험 수조에서의 축소 모델 테스트를 통해 다양한 적재 및 해상 조건에서 선체 형상, 계획 성능, 안정성 및 연료 효율을 최적화합니다.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      title: 프로토타입 워크숍
      description: 새로운 모델을 제작, 장착 및 해상 시험하는 완전한 규모의 프로토타입 및 장착 시설. 모든 프로토타입은 생산 승인 전 최소 20시간의 수중 테스트 프로그램을 거칩니다.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 품질 및 검사 연구소
      description: 인장 시험, 공기 유지 순환 시험, 이음매 박리 시험, 소재 인증을 수행하는 전담 품질 보증 실험실을 운영하여, 작업장을 떠나는 모든 보트가 공개된 사양을 충족하도록 보장합니다.
      href: /randdcenter/quality-inspection-lab

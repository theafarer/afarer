      link: /certifications
warranty_section:
  title: 보증 및 애프터서비스 지원
  subtitle: 명확한 보증 조건, 빠른 클레임 처리 및 정품 교체 부품으로 모든 제품에 대해 책임을 다합니다.
  items:
    - title: 2년 제품 보증
      desc: 모든 afarer 제품은 일반 사용 하에서의 이음새 결함, 밸브 결함 및 소재 박리에 대한 2년 제조 결함 보증을 제공합니다.
    - title: 평생 부품 지원
      desc: 정품 교체 부품 — 밸브, 수리 키트, 핀, D링 — 모든 모델에 제공됩니다. 생산 종료 후 최소 5년간 금형과 공구를 유지합니다.
    - title: 48시간 클레임 대응
      desc: 보증 청구는 48시간 이내 접수됩니다. 승인된 청구에 대해 10 영업일 이내 교체 보드가 배송됩니다.
    - title: 글로벌 수리 네트워크
      desc: 15개국 이상의 공인 수리 센터. 원격 작업용 현장 수리 키트 제공. 경미한 손상용 DIY 수리 가이드.
    - title: OEM 고객 지원
      desc: B2B 파트너를 위한 전담 어카운트 매니저를 배정합니다. 분기별 비즈니스 리뷰, 재고 계획, 공동 브랜드 마케팅을 지원합니다.
    - title: 인증 패키지
      desc: 모든 출하에 완전한 준수 문서를 제공합니다 — CE 선언서, 시험 보고서, 물질안전보건자료.
      link: /contact
trust_resources:
  title: 신뢰 자료
  subtitle: 인증 포트폴리오, QC 보고서 및 규정 준수 문서를 다운로드하세요.
  items:
    - title: 인증 포트폴리오
      desc: CE, ISO 9001, BSCI, REACH, RoHS, AS 1799 인증서를 하나의 패키지로 제공.
    - title: QC 테스트 기준 보고서
      desc: 24시간 내압 보유 시험, ISO 기준 자외선 노화 시험, 인장 강도 검증 — 완전한 시험 방법론.
    - title: 공장 프로필 및 감사 보고서
      desc: 생산 라인 사진 및 제3자 감사 요약이 포함된 12,000 m² 시설 개요.
    - title: 보증 정책 문서
      desc: 전체 보증 조건, 클레임 절차, 교체 부품 가격 정책을 제공합니다.
  cta_text: 신뢰 자료 요청
  cta_link: /contact
faqs_sup:
  title: SUP 보드 FAQ
  subtitle: 스탠드업 패들 보드에 대한 일반적인 질문.
  columns: 2
  items:
    - title: 어떤 SUP 보드 크기를 사용할 수 있습니까?
      description: 9ft에서 12ft까지의 SUP 보드를 제공합니다.
    - title: 드롭 스티치 구조란 무엇입니까?
      description: 수천 개의 폴리에스터 실이 보드의 상층과 하층을 연결하여 높은 공기압을 유지합니다.
    - title: SUP 보드의 중량 제한은 얼마입니까?
      description: 모델과 부피에 따라 최대 150kg까지 지원합니다.
    - title: 완전한 SUP 패키지를 제공합니까?
      description: 예. 모든 SUP 보드에는 3피스 알루미늄 패들, 고압 핸드 펌프 등이 포함된 완전한 패키지가 제공됩니다.
    - title: SUP 보드의 보증은 무엇입니까?
      description: 모든 afarer SUP 보드에는 제조 결함에 대한 1년 보증이 제공됩니다.
    - title: SUP 보드를 팽창하는 데 얼마나 걸립니까?
      description: 포함된 핸드 펌프를 사용하면 15 PSI까지 완전 팽창에 약 8-12분이 소요됩니다.
faqs_materials:
  title: SUP 소재 및 관리 FAQ
  subtitle: 인플레이터블 SUP 소재, 관리 및 보관에 대한 자주 묻는 질문.
  columns: 2
  items:
    - title: afarer 인플레이션 SUP에 사용되는 소재는 무엇인가요?
      description: 군사 등급 PVC(1100데니어)를 사용하며, UV 안정화 및 내마모성 구조를 갖추고 EU REACH 및 RoHS 규정을 준수합니다.
    - title: 인플레이트 SUP는 얼마나 오래 사용할 수 있나요?
      description: 적절한 관리를 통해 고품질 PVC 인플레이터블 SUP는 5~10년간 사용할 수 있습니다. 정기적인 세척, UV 차단, 적절한 보관이 사용 수명을 크게 연장합니다.
    - title: 인플레이터블 SUP에 필요한 유지보수는 무엇입니까?
      description: 기본 유지보수에는 사용 후 매번 담수로 헹구기(특히 염수에서), 보관 전 건조, 밸브 씰 연간 점검, 사용하지 않을 때 장시간 햇빛 노출 회피가 포함됩니다.
    - title: 인플레이션블 SUP를 해수에서 사용할 수 있나요?
      description: 네. 모든 afarer 팽창식 SUP는 담수 및 해수 사용을 위해 설계되었습니다. 해수 노출 후에는 담수로 헹구고 완전히 건조시키는 것을 권장합니다.
    - title: 인플레이터블 SUP은 어떻게 보관하나요?
      description: 보관 전에 공기를 빼고, 깨끗이 세척한 후 완전히 건조하세요. 느슨하게 말아서 (단단한 접힘 방지) 서늘하고 건조한 곳에 보관하며, 직접적인 햇빛을 피하고, 습기 흡수를 방지하기 위해 콘크리트 바닥 위에 두지 마세요.
    - title: afarer 인플레이터블 SUP의 중량 용량은 얼마인가요?
      description: 최대 하중은 가장 작은 모델의 100kg부터 더 큰 보드의 200kg 이상까지 다양합니다. 각 제품 페이지에 특정 모델의 최대 하중 등급이 나와 있습니다.

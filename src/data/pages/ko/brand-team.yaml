meta:
  title: '우리 팀 — 선박 엔지니어와 제작자 | {SITE}'
  description: '2012년 칭다오에서 설립된 afarer는 선박 엔지니어, 소재 전문가, 수상 스포츠 애호가들이 함께 만들었습니다. 공장을 이끄는 팀을 소개합니다.'
  keywords:
    - 'afarer 팀'
    - '선박 엔지니어'
    - '팽창식 SUP 보드 제조사'
    - 'SUP 공장 팀'
hero:
  tagline: 우리의 팀
  title: 멀리 떨어져 있는 사람들<br />—물 위의 자유 공학
  subtitle: 2012년 중국 칭다오에서 설립된 afarer는 전문가 수준의 팽창식 선박을 전 세계적으로 이용할 수 있도록 하겠다는 신념을 가진 해양 엔지니어, 재료 과학자 및 수상 스포츠 애호가들이 제작했습니다.
  image:
    src: /images/team-all.webp
    alt: 아페러 전체 팀 사진 — 엔지니어링, 생산, 경영진
founding:
  tagline: 우리의 설립
  title: 해안 작업장에서<br />12,000 m² 규모의 시설로
  subtitle: afarer는 풍선 보트 설계, PVC/Hypalon 제조 및 글로벌 해양 장비 제조 분야에서 수십 년의 경험을 쌓은 해양 엔지니어 팀에 의해 설립되었습니다.
  items:
    - title: '설립: 2012년'
      description: 깊은 조선 역사를 지닌 주요 해양 허브인 중국 칭다오에 설립되었습니다.
      icon: tabler:calendar
    - title: 200명 이상의 직원
      description: 50명 이상의 R&D 엔지니어, 품질 관리 전문가, 생산 기술자를 포함합니다.
      icon: tabler:users
    - title: 12,000 m² 시설
      description: SUP, 공기주입식 보트, SUP 보드용 생산 라인 6개를 갖춘 전용 제조 공장입니다.
      icon: tabler:building-factory
    - title: 50개국 이상 서비스
      description: 유럽, 미주, 중동, 아시아 태평양 및 아프리카로 수출됩니다.
      icon: tabler:globe
leadership:
  tagline: 리더십
  title: 경영 및 엔지니어링 리더십
  subtitle: 우리의 리더십 팀은 해양 엔지니어링, 국제 무역 및 품질 관리에 대한 심층적인 전문 지식을 하나로 모았습니다.
  columns: 3
  items:
    - title: 창립자 겸 CEO
      name: Toby Liu
      description: 15년 이상의 해양 제조 경험. 이전에 중국 대형 보트 제조업체의 R&D를 총괄했으며, 인플레이터블 보트 디자인 관련 다수의 특허를 보유하고 있습니다.
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: 수석 엔지니어
      name: Zhang Wei
      description: PVC/Hypalon 제조 및 딥-V 선체 설계 분야에서 20년 이상의 경력. 유럽 해양 엔지어링 회사 전 기술 이사.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: 연구개발 책임자
      name: Chen Ming
      description: 재료과학 박사. 드롭 스티치 기술 및 고주파 용접 공정을 전문으로 합니다. 섬유 복합재 분야에서 10년 이상 경력.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: 생산 이사
      name: Liu Qiang
      description: 18년 이상의 린 제조 및 생산 라인 최적화 경험. 식스 시그마 블랙 벨트. ISO 9001 품질 시스템 구축.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: 품질 관리자
      name: Wang Fang
      description: 해양 품질 관리 12년 이상 경력. CE 및 ISO 인증 심사원. 모든 생산 배치의 시험을 총괄.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: 영업 및 운영 이사
      name: Helen Lee
      description: 국제 B2B 무역 15년 이상의 경력. 30개국 이상에서 공동 브랜드 및 유통 파트너십을 운영. 4개 언어 구사.
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: 디자인 철학
  title: 엔지니어링 주도 설계<br />—모든 세부 사항이 중요
  subtitle: 우리의 엔지니어링 철학은 우리가 만드는 모든 제품의 지침이 되는 세 가지 원칙에 중점을 두고 있습니다.
  list:
    - '신뢰성 우선: 모든 afarer 제품은 실제 환경에서의 내구성을 위해 테스트됩니다 — 냉수 구조작업부터 열대 리조트 렌탈까지. 중요한 부분에 과도한 공학적 설계를 적용합니다.'
    - '제조 정밀도: 자사 시설은 CNC 절단, 고주파 용접 및 자동화 압력 테스트를 사용합니다. 모든 이음새, 모든 밸브, 모든 피팅이 문서화된 사양을 충족합니다.'
    - '지속적 혁신: 우리 R&D팀은 새로운 소재, 생산 방법 및 디자인 개선을 지속적으로 평가합니다. 우리는 문제를 기다리지 않습니다 — 미리 예측합니다.'
cta:
  title: 우리 팀과 프로젝트에 대해 논의하고 싶으신가요?
  subtitle: 우리 엔지니어들은 제품 선택, 맞춤화, 공동 브랜드 컬렉션에 관해 조언해 드릴 준비가 되어 있습니다.
  actions:
    - variant: primary
      text: 우리 팀에 문의하세요
      href: /contact
    - text: 제품 보기
      href: /products

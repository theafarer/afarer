meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: afarer SUP 보드로 통일된 패들 클럽 회원
benefits:
  title: 클럽 편대 혜택
  subtitle: 50개국 이상의 패들 클럽이 왜 아페르를 장비 파트너로 선택하는지.
  items:
    - metric: 40% 이상
      label: 선단 비용 절감
      detail: 대량 클럽 할인 대비 소매 가격
    - metric: 48h
      label: 부품 교체
      detail: 렌탈 플리트 다운타임 최소화
    - metric: 500건 이상
      label: 렌탈 사이클
      detail: 보드당 상업용 등급 내구성
    - metric: 5년 이상
      label: 편성 수명
      detail: 적절한 유지보수와 관리를 통해
packages:
  title: 클럽 함대 프로그램
  subtitle: 귀하의 클럽 규모와 목표에 맞는 플릿 프로그램을 선택하십시오.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - 출시 가이드 + 안전 체크리스트
        - 출시 가이드 + 안전 체크리스트
        - CE 인증 — 모든 장비
      cta_text: 클럽 시작하기
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - 교체 부품 프로그램 (15% 할인)
        - Staff training session
        - 직원 교육 세션(온라인)
        - CE 인증 — 모든 장비
      popular: true
      cta_text: 플리트 구축
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50+ 레이싱 / 퍼포먼스 보드
        - Full accessory set
        - Event support kit
        - 우선 부품(24시간 출고)
        - 전담 관리자
        - 맞춤 팀 유니폼 옵션
        - CE 인증 — 모든 장비
      cta_text: 대회용 펢대 구매
training:
  title: 훈련 센터 패키지
  subtitle: SUP 학교가 전문 인증 과정을 운영하는 데 필요한 모든 것.
  items:
    - name: Instructor Starter
      features:
        - 5개 프리미엄 SUP 보드 (강사 등급)
        - 데모용 카본 패들 5개
        - 구명조끼 5개 (인스트럭터 사이즈)
        - 교육 커리큘럼 가이드
        - CE 인증 장비
    - name: School Full Set
      features:
        - 20개 SUP 보드 (강사 + 학생 혼합)
        - 패들 20개 + 구명조끼 20개(다양한 사이즈)
        - 초보자용 부력 보조 장비 10개
        - 공기 펌프 4개 + 수리 키트
        - 교육 커리큘럼 및 인증 지원
        - CE 인증 장비
features:
  title: 클럽이 아페르를 선택하는 이유
  subtitle: 성장하는 클럽을 위한 균일한 품질, 신속한 부품 공급 및 대량 가격.
  items:
    - title: 500회 이상의 대여 사이클
      description: 상업용 등급 보드는 매일 사용하는 환경에서도 여러 시즌을 버팀니다.
      icon: tabler:shield-check
    - title: 커스텀 색상
      description: 커스텀 보드 색상과 로고로 클럽의 아이덴티티를 표현하세요.
      icon: tabler:palette
    - title: 대량 구매 가격
      description: 10개 이상 보드 플리트 주문 시 대량 할인.
      icon: tabler:discount
    - title: 빠른 부품
      description: 교체 부품 48시간 이내 발송.
      icon: tabler:truck-delivery
    - title: 클럽 성장 지원
      description: 멤버십 프로그램, 가격 정책, 행사 운영에 대한 조언.
      icon: tabler:trending-up
    - title: CE 인증
      description: 모든 장비는 국제 안전 기준을 충족합니다.
      icon: tabler:certificate
cta:
  title: 패들 클럽을 구축할 준비가 되셨습니까?
  subtitle: 클럽 선단 견적을 받거나 클럽 스타터 가이드를 다운로드하세요.
  actions:
    - text: 클럽 플리트 신청
      href: /contact?package=club
      variant: primary
    - text: 클럽 가이드 다운로드
      href: /resources/download-catalog
      variant: secondary

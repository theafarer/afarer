    alt: afarer 히어로 이미지
who_we_serve:
  tagline: 우리의 서비스 대상
  title: 모든 수상 비즈니스를 위한 완전한 SUP 솔루션
  subtitle: 4개 핵심 시장을 위한 맞춤형 장비, 제조 및 비즈니스 지원.
  items:
    - title: 패들 클럽
      keywords: SUP 클럽 장비, 패들 스쿨 장비, 렌탈 플리트
      description: 내구성 있는 SUP 플릿, 클럽 가격 정책 및 교체 부품 프로그램으로 팬들 클럽 및 스쿨에 제공.
      icon: tabler:users
      cta: 패들 클럽 솔루션 살펴보기
      link: /solutions/paddle-clubs
    - title: 리조트 및 호텔
      keywords: 리조트 수상 활동, 호텔 해변 장비, 고객 경험
      description: 맞춤 브랜딩, 직원 교육 및 ROI 최적화 패키지를 포함한 완전한 SUP fleet 프로그램.
      icon: tabler:building
      cta: 리조트 워터 경험을 만들어보세요
      link: /solutions/resorts-hotels
    - title: 리테일 파트너
      keywords: SUP 도매, 아웃도어 리테일러, 스포츠용품 매장
      description: 풀 제품 라인, 마케팅 자료, 드롭시핑 옵션, 경쟁력 있는 도매 마진.
      icon: tabler:shopping-cart
      cta: 리테일 파트너가 되십시오
      link: /solutions/retail-partners
    - title: 국가 유통업자 & 공동 브랜드 파트너
      keywords: 국가 SUP 유통업자, 공동 브랜드 SUP, 프라이빗 라벨 SUP
      description: 우수 수상 스포츠 사업체를 위한 국가별 독점 유통과 한정판 공동 브랜드 컬렉션.
      icon: tabler:package
      cta: 파트너 되기
      link: /distributor-program
proof_points:
  title: 전 세계 수상 비즈니스의 신뢰를 받는 파트너
  subtitle: 수십 년간의 해양공학 경험이 수익성 높은 SUP 프로그램을 뒷받침합니다.
  items:
    - metric: 10건 이상
      label: 경력 연수
      detail: 2012년부터
    - metric: 50+
      label: 서비스 국가
      detail: 글로벌 유통 네트워크
    - metric: 15,000 이상
      label: 연간 생산 대수
      detail: CE 인증 생산 능력
    - metric: 100%
      label: CE 인증
      detail: ISO 9001, BSCI, REACH 준수
business_solutions:
  tagline: 도움을 드리는 방법
  title: 컨셉에서 수익까지 당신의 파트너
  subtitle: 수상 비즈니스의 출시, 운영 및 성장을 지원하는 네 가지 핵심 역량.
  items:
    - title: 전문 장비
      description: 매일의 렌탈 사용을 위해 설계된 상업용 등급 SUP 보드로, 최소한의 유지보수로 500회 이상의 사용 사이클을 지원합니다.
      icon: tabler:shield-check
    - title: 공동 브랜드 컬렉션
      description: afarer와 함께 설계, 엔지니어링, 제작되는 한정판 공동 브랜드 컬렉션 — 보드는 항상 afarer의 제품으로 남습니다.
      icon: tabler:package
    - title: 비즈니스 지원
      description: 직원 교육, 마케팅 자료, 교체 부품 프로그램 및 전담 관리자 지원.
      icon: tabler:headset
    - title: 글로벌 물류
      description: FOB 칭다오, CIF 주요 항구, 통관 지원과 함께 50개국 이상 문 앞 배송.
      icon: tabler:truck-delivery
oem_section:
  tagline: 공동 브랜드 컬렉션
  title: 아이디어에서 물 위까지 — 공동 브랜드 에디션
  subtitle: '카탈로그 상품 이상을 원하는 파트너를 위해: afarer와 함께 설계, 엔지니어링, 제작되는 한정판 공동 브랜드 컬렉션 — 모든 보드는 afarer의 제품으로 남습니다.'
  steps:
    - number: '01'
      title: 아이디어 및 브리프
      desc: 비전, 타겟 시장 및 사양을 공유해 주세요.
    - number: '02'
      title: 디자인 & 엔지니어링
      desc: 3D 모델링, 소재 선정 및 맞춤형 그래픽 디자인.
    - number: '03'
      title: 프로토타입 및 검증
      desc: CE 인증 및 품질 테스트를 포함한 샘플 생산.
    - number: '04'
      title: 대량 생산
      desc: 인라인 QC 및 공장 감사 지원을 갖춘 완전한 규모의 제조.
    - number: '05'
      title: 글로벌 배송
      desc: FOB 칭다오 물류, CIF 주요 항만, 도어 투 도어.
  cta: 공동 브랜딩 살펴보기
  cta_link: /co-brand
cta:
  title: |
    지금 바로 <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">OEM/ODM 프로젝트</span>를 시작해 보시겠습니까?
  subtitle: 요구 사항을 알려주시면 영업일 기준 1일 이내에 맞춤 견적, 최소 주문 수량 및 리드 타임을 제공해 드립니다.
  actions:
    - variant: primary
      text: 견적 요청
      href: /contact
      icon: tabler:message-circle
    - text: 공장 방문
      href: /factory
distributor:
  tagline: '국가 독점 유통업자'
  title: '한 국가. 단 하나의 공식 afarer 유통업자.'
  subtitle: '국가당 하나의 유통업자를 통해 지역 독점권, 대리점 가격, 마케팅 지원, 전담 유통업자 성공 프로그램을 제공합니다.'
  benefits:
    - title: '지역 독점권'
      description: '국가 또는 지역당 공인 유통업자 1곳 — 내부 경쟁 없음, 채널 갈등 없음.'
    - title: '공장 직판 마진'
      description: '유통업자 가격표와 약정 수량에 대한 연간 리베이트, FOB 칭다오 선적.'
    - title: '마케팅 및 교육 지원'
      description: '공동 브랜드 자산, 딜러 POS 자료, 제품 교육, 출시 캠페인을 제공합니다.'
    - title: '전담 계정 팀'
      description: '전담 유통 매니저와 함께 온보딩, 수요 예측, 재주문을 지원합니다.'
  actions:
    - variant: primary
      text: '유통업자 되기'
      href: /distributor-program
    - text: '딜러 가격표 요청'
      href: /contact?subject=Dealer Price List
    - text: '국가 파트너십 신청'
      href: /contact?subject=Country Partnership Application
    - text: '유통업자 프로그램 다운로드'
      href: /distributor-program
  note: '샘플 주문 5–10대. 시험 주문 10–30대. 인증 딜러 30–50대. 국가/지역 유통업자 100–300+대.'

meta:
  title: '고성능 팽창식 SUP 보드 — Afarer Water Sports | {SITE}'
  description: 'afarer는 오픈워터, 투어링, 요가, 모험을 위한 고성능 팽창식 SUP를 설계합니다. 드롭 스티치 강성, 보드 하나하나 압력 테스트, 국가 독점 파트너십과 한정판 공동 브랜드 컬렉션. 컬렉션을 살펴보세요.'
  keywords:
    - '고성능 팽창식 SUP'
    - '프리미엄 팽창식 패들보드'
    - '팽창식 SUP 보드 브랜드'
    - '투어링 팽창식 SUP'
    - '공동 브랜드 패들보드'
    - '국가 SUP 유통업자'
hero:
  tagline: 고성능 팽창식 SUP 보드
  title: 더 멀리.<br />더 강하게.
  subtitle: |
    오픈워터, 긴 하루, 그리고 탐험의 자유를 위해 설계된 고성능 팽창식 SUP —<br />
    중요한 순간에 안정적이고,<br />
    압력 속에서도 강하며, 변화하는 물에 대비합니다.
  taglineSection: 탐험을 위해 설계되고, 신뢰성을 위해 엔지니어링되었으며, 글로벌 파트너를 위해 만들어졌습니다.
  actions:
    - variant: primary
      text: 제품 둘러보기

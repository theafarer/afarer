meta:
  title: '지식 — SUP·보트 가이드 | {SITE}'
  description: 'afarer 지식 베이스: 브랜드와 전문가를 위한 팽창식 SUP 보드, 패들보드 소재, 보트 선택, 업계 인사이트 가이드.'
  keywords:
    - 'SUP 지식'
    - '팽창식 SUP 가이드'
    - '패들보드 소재'
    - 'SUP 업계 인사이트'
hero:
  tagline: 지식 그래프
  title: 수상 탐험 지식
  subtitle: |
    팽창식 SUP 기술, 수상 안전,<br />
    보트 엔지니어링 및 모험 계획을 다루는 구조화된 지식 기반.
  taglineSection: 탐험하세요. 배우세요. 자신감 있게 나아가세요.
clusters:
  tagline: 지식 클러스터
  title: 주제별 탐험
  subtitle: 모든 afarer 제품의 기술, 안전 및 기술에 대한 심층 분석.
  items:
    - title: SUP 지식
      description: 첫 번째 보드 선택부터 고급 투어링 기술까지 — 스탠드업 패들 보딩의 모든 것.
      icon: tabler:lifebuoy
      topics:
        - 첫 번째 팽창식 SUP 선택 방법
        - 초보자에게 가장 적합한 SUP 크기
        - 패들 보딩은 얼마나 어려운가요?
        - 팽창식 vs 하드 보드 비교
        - SUP 안전 체크리스트
    - title: 보트 지식
      description: 팽창식 보트, SUP, 딩기 및 카약에 대한 기술 가이드.
      icon: tabler:sailboat
      topics:
        - 팽창식 보트 유형 설명
        - PVC vs Hypalon 비교
        - SUP vs 딩기 비교
        - 드롭 스티치 기술 심층 분석
        - 해양 재료 과학 가이드
    - title: 안전 지식
      description: 모든 패들러를 위한 필수 안전 지식 — PFD 선택부터 기상 판독까지.
      icon: tabler:shield
      topics:
        - SUP 안전 체크리스트
        - 구명조끼가 필요한가요?
        - 해양 패들링 안전 가이드
        - 팽창식 카약을 위한 강 안전
        - 기상 및 수질 조건 인식
    - title: 기술
      description: afarer 제품의 엔지니어링 — 재료, 제조 방법 및 품질 테스트.
      icon: tabler:microscope
      topics:
        - 해양 등급 PVC 기술
        - 드롭 스티치 코어 설명
        - 팽창식 SUP에서 PSI가 중요한 이유
        - RF 용접 vs 접착 본딩
        - 품질 테스트 및 인증
    - title: SUP 라이프스타일 및 특수 용도
      description: 전문 SUP 활동 — 요가, 낚시, 반려견, 가족 및 여행 팁.
      icon: tabler:heart
      topics:
        - 수상에서의 SUP 요가와 명상
        - 인플레이터블 SUP에서 낚시하기
        - 반려견 및 어린이와 함께하는 패들보딩
        - 항공기 및 자동차로 SUP 여행하기
        - SUP 액세서리 및 필수 장비
    - title: SUP 비교 및 참고 자료
      description: 현명한 의사결정을 돕는 나란한 비교 정보.
      icon: tabler:chart-bar
      topics:
        - SUP vs 카약 — 어떤 것이 적합할까?
        - PVC vs 하이팔론 소재 비교
        - 단일 챔버 vs 다중 챔버 안전성
        - SUP 보드 소재 설명
        - UV 프린팅 vs EVA 블록 아트워크

workshops:
  - title: SUP 보드 생산
    description: '인플레이션 SUP 보드용 4개 병렬 조립 라인. 각 라인은 교대당 50–80개의 보드를 생산할 수 있습니다. 디지털 프린팅과 스크린 프린팅 공정이 동시에 진행됩니다. 연간 SUP 생산 능력: 8,000개 이상.'
    output: 연간 8,000대 이상 SUP
  - title: 'RIB 보트 생산'
    description: '최대 7.6m 길이의 보트 선체를 위한 6개의 몰드 스테이션을 갖춘 유리섬유 선체 전용 작업장입니다. 튜브 용접 및 조립 영역은 3–6척의 보트를 동시에 처리합니다. 연간 RIB 수용력: 2,000척 이상의 보트.'
    output: '연간 2,000척 이상 RIB'
  - title: '풍선 보트 & SUP'
    description: '풍선 보트, 카약, 소형 보트를 위한 다목적 생산 라인입니다. 열풍 용접 스테이션, RF 유전체 프레스 및 조립 워크스테이션은 주문 구성에 따라 재구성됩니다. 연간 생산능력: 5,000+ 유닛.'
    output: 연 5,000대 이상
  - title: 안전 장비
    description: '구명조끼 및 안전 장비를 위한 별도의 클린룸 생산 공간. 전용 봉제, 폼 삽입 및 테스트 스테이션. 연간 구명 조끼 용량: 50,000+ 단위.'
    output: 연간 50,000개 이상의 구명조끼

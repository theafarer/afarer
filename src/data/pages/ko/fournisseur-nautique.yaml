  title: '마린 공급업체 FAQ'
  subtitle: '워터 운영자들이 알고 싶어하는 것.'
  items:
    - title: '클럽과 마린 센터에도 공급하나요?'
      description: '네 — 대여 및 패들 학교를 위한 인플래터블 패들과 보트의 완전한 플릿을 공급합니다.'
    - title: '호텔이나 리조트 장비 조달이 가능한가요?'
      description: '물론입니다 — 호텔·리조트용 워터 장비를 플릿 가격으로 전 세계 납품합니다.'
    - title: '제품이 인증되어 있나요?'
      description: '모든 제품은 CE / ISO 규격과 유럽·북미 시장의 안전 요건을 충족합니다.'

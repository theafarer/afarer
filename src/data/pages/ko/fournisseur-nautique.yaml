features:
  title: '워터 액티비티의 파트너'
  subtitle: '인플래터블 패들부터 완전한 플릿까지: 클럽, 마린 센터, 호텔, 리조트에 공급합니다.'
  columns: 3
  items:
    - title: '마린 센터용 플릿'
      description: '대여, 훈련, 스포츠 클럽을 위한 내구성 높은 인플래터블 패들과 보트.'
      icon: 'tabler:lifebuoy'
    - title: '호텔 & 리조트 장비'
      description: '호텔, 리조트, 휴양 마을을 위한 워터 장비 — 플릿 가격 적용.'
      icon: 'tabler:building-store'
    - title: '안전 장비'
      description: '구명조끼, 안전 액세서리, 전문 운영자를 위한 규정 준수.'
      icon: 'tabler:shield-check'
    - title: '프라이빗 레이블'
      description: '대여 운영자, 학교, 유통사 브랜드를 위한 로고와 맞춤 제작.'
      icon: 'tabler:palette'
    - title: '인증 품질'
      description: 'CE / ISO / BSCI / REACH — 집중 사용에 견디는 신뢰성 있는 전문 장비.'
      icon: 'tabler:certificate'
    - title: '지원 & 서비스'
      description: '컨설팅, 예비 부품, 보증, 전담 사후 서비스.'
      icon: 'tabler:headset'

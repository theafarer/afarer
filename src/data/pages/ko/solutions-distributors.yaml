meta:
  title: SUP 유통 파트너 프로그램 | {SITE}
  description: Afarer의 글로벌 유통 네트워크에 참여하세요. 독점 영역, 완전한 제품 포트폴리오, 경쟁력 있는 도매 가격 및 전담 관리 서비스를 제공합니다.
hero:
  tagline: 유통업체
  title: 글로벌<br />유통 네트워크에 합류하세요
  subtitle: 독점 territory. 완전한 제품 포트폴리오. 세계적 수준의 지원. Afarer는 50개국 이상으로 배송하며 기존 해양 및 수상 스포츠 유통업체를 찾고 있습니다.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Afarer 글로벌 유통 및 물류 운영
benefits:
  title: 디스트리뷰터가 얻는 것
  subtitle: 시장에서 성공하기 위해 필요한 모든 것.
  items:
    - 독점 지역 권한
    - 완전한 제품 카탈로그 (SUP, 액세서리, 부품)
    - 경쟁력 있는 도매 가격
    - 마케팅 및 영업 자료(번역 완료)
    - 교육 프로그램(제품, 영업, 유지보수)
    - 전시회 참가 지원
    - 샘플 프로그램
    - 드롭십 배송 역량
    - 전담 유통업체 담당 매니저
    - 45~60일 결제 조건
coverage:
  title: 현재 유통
  subtitle: 아페러는 현재 이 시장들에 직접 서비스를 제공하고 있습니다.
  regions:
    - name: 유럽
      countries: 프랑스, 독일, 영국, 스페인, 이탈리아, 네덜란드, 스웨덴, 노르웨이, 폴란드, 그리스
    - name: 아시아
      countries: 일본, 대한민국, 중국, 태국, 싱가포르
    - name: 중동
      countries: UAE, 사우디아라비아
    - name: 아메리카
      countries: 미국, 캐나다, 브라질, 멕시코
    - name: 오세아니아

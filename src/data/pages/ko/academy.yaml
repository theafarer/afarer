knowledge_center_tagline: 지식 센터
knowledge_center_title: 해양 장비 및 산업 가이드
knowledge_center_subtitle: 해양 전문가, 플릿 운영자, 그리고 수상 스포츠 애호가를 위한 전문 지식과 구매 가이드.
knowledge_sections:
  - title: SUP 보드 지식
    tagline: 스탠드업 패들보드 가이드
    desc: SUP 보드의 모든 것 — 보드 디자인, 소재, 사이즈 선택, 유지보수 및 레크리에이션·상업용 구매 가이드.
    guides:
      - title: 올바른 SUP 보드 선택 방법
        desc: SUP 선택 완전 가이드 — 사이즈, 부피, 소재, 형태 및 용도.
        href: /learn/sup
      - title: 인플레이터블 vs 하드 SUP
        desc: 인플레이터블 SUP vs 하드 에폭시 보드 —휴대성, 내구성, 성능 및 가치 비교.
        href: /compare/inflatable-vs-hardboard
      - title: 올라운드 vs 투어링 vs 요가 SUP
        desc: 다양한 SUP 보드 유형 — 제작 기준, 형태, 크기 및 권장 용도.
        href: /learn/sup
      - title: .Drop-Stitch 방식 vs 전통적 방식
        desc: SUP 보드의 드롭스티치 및 전통적 제조 방식을 무게, 비용, 내구성, 강성 면에서 비교합니다.
        href: /learn/drop-stitch-core
  - title: 인플레이터블 SUP 가이드
    tagline: 인플레이션 SUP 지식
    desc: 인플레이션블 SUP에 대한 종합 가이드 — PVC 소재, 드롭스티치 구조, 안전 기준 및 유지보수 모범 사례.
    guides:
      - title: PVC 소재 가이드
        desc: 인플레이터블 SUP 보드 제작에 사용되는 PVC 소재에 대한 확실한 가이드입니다.
        href: /learn/materials
      - title: 인플레이터블 SUP 제조 공정
        desc: 제조 공정 — 소재 절단, 드롭스티치 코어 본딩, 이음새 구조, 압력 테스트 및 품질 관리.
        href: /learn/inflatable-technology
      - title: SUP 안전 가이드
        desc: 안전 기준, 적재 용량, 적절한 공기 충전, 출발 전 점검 및 비상 절차.
        href: /learn/water-safety
      - title: SUP 유지보수
        desc: 인플레이트 SUP 보드의 청소, 보관, UV 차단 및 수리.
        href: /inflatable-sup-maintenance
  - title: SUP 보드 지식
    tagline: SUP 보드 허브
    desc: SUP 보드 유형, 소재, 제조 방법, 유지보수 및 안전에 관한 기술 가이드.
    guides:
      - title: SUP 보드 유형
        desc: 올라운드, 투어링, 요가, 스포츠, 키즈 SUP — 차이점을 파악하고 적합한 제품을 선택하세요.
        href: /learn/sup
      - title: 드롭 스티치 기술
        desc: 수천 개의 내부 스레드가 어떻게 견고하고 고압의 인플레이터블 구조를 만드는지 소개합니다.
        href: /learn/drop-stitch-core
      - title: 소재 참조
        desc: PVC 데니어 등급, 원단 중량, 자외선 내성 및 해양 등급 소재 설명.
        href: /learn/materials
      - title: SUP 구매 가이드
        desc: 다양한 용도와 숙련도에 따른 다른 SUP 보드 유형을 비교합니다.
        href: /learn/sup
  - title: SUP 지식
    tagline: 스탠드업 패들보드 가이드
    desc: SUP 보드에 대한 모든 것 — 인플레이트 vs 리지드, 보드 치수, 소재 기술, 그리고 모든 수준의 전문가 조언.
    guides:
      - title: 인플레이터블 vs 하드 SUP
        desc: iSUP와 하드 에폭시 보드를 휴대성, 내구성, 성능, 가성비 면에서 비교합니다.
        href: /learn/sup
      - title: SUP 보드 치수 가이드
        desc: 길이, 너비, 두께가 안정성, 속도, 기동성에 미치는 영향.
        href: /learn/sup
      - title: SUP 유지보수 및 관리
        desc: 팽창식 SUP 보드 세척, 보관, UV 보호 및 수리 팁.
        href: /inflatable-sup-maintenance
      - title: 첫 SUP 보드 선택하기
        desc: 초보자를 위한 적합한 스탠드업 패들보드 선택 가이드 — 체중, 기술 수준 및 용도별.
        href: /learn/sup
  - title: 렌탈 운영 가이드
    tagline: 렌탈 사업을 위한 fleet 관리
    desc: 비치 키오스크, 워터스포츠 센터, 숙박 시설용 SUP 렌탈 플릿 구축 및 관리 가이드.
    guides:
      - title: 렌탈 편성 구축
        desc: 렌탈 운영에 맞는 SUP 보드 선택 방법 — 내구성, 사이징, ROI 고려 사항.
        href: /solutions/rental-operators
      - title: 함대 유지보수 가이드
        desc: 렌탈 플릿의 보드 수명을 극대화하고 다운타임을 최소화하기 위한 필수 유지보수 절차.
        href: /solutions/rental-operators
  - title: 리조트 및 호텔 가이드
    tagline: Hospitality를 위한 수상 활동
    desc: 리조트, 호텔 및 수변 목적지를 위한 SUP 프로그램 런칭 및 운영 가이드.
    guides:
      - title: 리조트 SUP 프로그램 시작하기
        desc: 게스트 SUP 프로그램 론칭 시 고려 요소 — 플리트 규모, 인력 배치 및 수익 모델링.
        href: /solutions/resorts-hotels
      - title: SUP vs 기타 수상 활동
        desc: 고객 경험 및 운영 효율성을 위해 다른 수상 스포츠와 SUP 프로그램을 비교합니다.
        href: /learn/sup
  - title: 소매 및 유통 가이드
    tagline: SUP 비즈니스 파트너십
    desc: SUP 리셀러 또는 디스터리뷰터가 되기 위한 가이드 — 재고 계획, 시장 포지셔닝, 성장 전략.
    guides:
      - title: SUP 리테일러 되기
        desc: 소매 매장에서 제품 라인 선택, 재고 관리 및 SUP 보드 마케팅 방법.
        href: /solutions/retail-partners
      - title: 상업적 운영을 위한 SUP
        desc: 인플레이션블 SUP가 상업용 플리트, 렌탈 사업 및 전문 운영자에게 다양한 제품인 이유.
        href: /use-cases/search-and-rescue

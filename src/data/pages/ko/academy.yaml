meta:
  title: '아카데미 — SUP 가이드와 패들 트레이닝 | {SITE}'
  description: 'afarer 아카데미: 팽창식 패들보드 가이드, 스탠드업 패들 테크닉, 선박 안전, 초보자와 전문가를 위한 소재 지식.'
  keywords:
    - '스탠드업 패들 배우기'
    - 'SUP 초보자 가이드'
    - '패들보드 기초'
    - 'SUP 테크닉'
    - 'SUP 레슨'
hero:
  tagline: afarer Academy
  title: Learning Center
  subtitle: 모든 실력 수준을 위한 가이드와 튜토리얼 — SUP 기초부터 고급 구조 테크닉까지
categories:
  - level: Beginner
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Basics
        desc: 스탠드업 패들보딩의 기초를 배워보세요 — 자세, 스트로크 테크닉, 밸런스까지.
        slug: beginner-sup-guide
      - title: Paddle Techniques
        desc: 포워드 스트로크, 스윕 스트로크, 드로 스트로크, 로우 브레이스 — 필수 패들 동작을 완벽히 익히세요.
        slug: sup-paddle-guide
      - title: Safety First
        desc: 날씨 확인, PFD 사용, 리시 규칙, 셀프 리스큐 등 필수 안전 수칙을 다룹니다.
        slug: sup-safety-guide
  - level: Intermediate
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Touring Essentials
        desc: 수시간 패들링 계획 — 네비게이션, 수분 보충, 페이스 조절, 바람 예보 읽는 법.
        slug: touring-sup-guide
      - title: Weather Reading
        desc: 해상 예보 해석, 구름 패턴 파악, 바람이 수면에 미치는 영향 이해하기.
        slug: weather-planning-water-sports
      - title: Navigation Basics
        desc: 해도 읽기, 나침반 사용, GPS 웨이포인트, 연안 패들링을 위한 경로 계획.
        slug: sup-navigation-guide
      - title: Tidal Awareness
        desc: 조석 주기와 해류의 이해, 출항 시기와 항로에 미치는 영향 알아보기.
        slug: understanding-tides
  - level: Advanced
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Multi-Day Trip Planning
        desc: 원정 물류 — 장비 선택, 식량 계획, 안전 프로토콜, 비상 연락처.
        slug: sup-travel-guide
      - title: Rescue Techniques
        desc: 오픈 워터를 위한 셀프 리스큐, T-리스큐, 토잉 프로토콜.
        slug: sup-self-rescue
      - title: Night Paddling
        desc: 야간 네비게이션 — 조명 요건, 경로 기억, 그룹 커뮤니케이션, 위험 인식.
        slug: ocean-safety-basics
  - level: Maintenance
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Cleaning & Care
        desc: 매 세션 후 민물 세척, UV 보호, 곰팡이 예방, 올바른 건조 테크닉.
        slug: inflatable-sup-maintenance
      - title: Storage Guide
        desc: 팽창식 SUP 보드 보관 모범 사례 — 완전 공기 배출, 접기, 온도 관리, 보관 수명.
        slug: inflatable-sup-storage
      - title: Repair Basics
        desc: PVC 리페어 키트와 패치 테크닉으로 작은 펑크, 실밥 누수, 밸브 문제 해결하기.
        slug: inflatable-sup-repair
      - title: Valve Maintenance
        desc: 밸브 타입(Halkey-Roberts, Boston, Leafield) 구분, 이물질 제거, 고장난 스템 교체.
        slug: sup-pump-guide
knowledge_center_tagline: Knowledge Center
knowledge_center_title: 해양 장비 & 업계 가이드
knowledge_center_subtitle: 해양 전문가, 플리트 운영자, 수상 스포츠 애호가를 위한 전문 지식과 구매 가이드.
knowledge_sections:
  - title: SUP Board Knowledge
    tagline: 스탠드업 패들보드 가이드
    desc: SUP 보드의 모든 것 — 보드 디자인, 소재, 사이즈 선택, 유지보수, 레저 및 상업용 구매 조언까지.
    guides:
      - title: 올바른 SUP 보드를 고르는 방법
        desc: SUP 선택 완전 가이드 — 사이즈, 부피, 소재, 형태, 사용 목적.
        href: /learn/sup
      - title: Inflatable vs Hard SUP
        desc: 팽창식 SUP와 하드 에폭시 보드 비교 — 휴대성, 내구성, 성능, 가치.
        href: /compare/inflatable-vs-hardboard
      - title: 올라운드 vs 투어링 vs 요가 SUP
        desc: 다양한 SUP 보드 타입 — 제조 표준, 형태, 사이즈, 추천 용도.
        href: /learn/sup
      - title: Drop-Stitch vs 전통 제조 방식
        desc: 무게, 비용, 내구성, 강성을 기준으로 SUP 보드의 drop-stitch 구조와 전통 구조를 비교합니다.
        href: /learn/drop-stitch-core
  - title: Inflatable SUP Guide
    tagline: 팽창식 SUP 지식
    desc: 팽창식 SUP 종합 가이드 — PVC 소재, drop-stitch 구조, 안전 기준, 유지보수 모범 사례.
    guides:
      - title: PVC Material Guide
        desc: 팽창식 SUP 보드 제조에 사용되는 PVC 소재에 대한 확실한 가이드.
        href: /learn/materials
      - title: 팽창식 SUP가 만들어지는 과정
        desc: 제조 공정 — 소재 재단, drop-stitch 코어 접합, 심(seam) 제작, 압력 테스트, 품질 관리.
        href: /learn/inflatable-technology
      - title: SUP Safety Guide
        desc: 안전 기준, 적재 용량, 올바른 공기 주입, 출항 전 점검, 비상 절차.
        href: /learn/water-safety
      - title: SUP Maintenance
        desc: 팽창식 SUP 보드의 세척, 보관, UV 보호, 수리.
        href: /v2/inflatable-sup-maintenance
  - title: SUP Board Knowledge
    tagline: SUP Board Hub
    desc: SUP 보드 타입, 소재, 제조 공법, 유지보수, 안전을 다루는 기술 가이드.
    guides:
      - title: SUP Board Types
        desc: 올라운드, 투어링, 요가, 스포츠, 키즈 SUP — 차이점을 배우고 나에게 맞는 제품을 선택하세요.
        href: /learn/sup
      - title: Drop-Stitch Technology
        desc: 수천 개의 내부 스레드가 단단한 고압 팽창 구조를 만드는 원리.
        href: /learn/drop-stitch-core
      - title: Materials Reference
        desc: PVC 데니어 등급, 원단 무게, UV 저항성, 마린급 소재에 대한 설명.
        href: /learn/materials
      - title: SUP Buying Guide
        desc: 다양한 사용 목적과 실력 수준에 맞는 SUP 보드 타입 비교.
        href: /learn/sup
  - title: SUP Knowledge
    tagline: 스탠드업 패들보드 가이드
    desc: SUP 보드의 모든 것 — 팽창식 vs 하드, 보드 치수, 소재 기술, 모든 실력 수준을 위한 전문가 조언.
    guides:
      - title: Inflatable vs Hard SUP
        desc: 휴대성, 내구성, 성능, 가치 측면에서 iSUP와 하드 에폭시 보드를 비교합니다.
        href: /learn/sup
      - title: SUP 보드 치수 가이드
        desc: 길이, 폭, 두께가 안정성, 속도, 기동성에 미치는 영향.
        href: /learn/sup
      - title: SUP Maintenance & Care
        desc: 팽창식 SUP 보드를 위한 세척, 보관, UV 보호, 수리 팁.
        href: /v2/inflatable-sup-maintenance
      - title: Choosing Your First SUP
        desc: 체중, 실력 수준, 사용 목적에 맞는 스탠드업 패들보드를 고르는 초보자 가이드.
        href: /learn/sup
  - title: Rental Operations Guide
    tagline: 렌탈 비즈니스를 위한 플리트 관리
    desc: 비치 키오스크, 수상 스포츠 센터, 호스피탈리티 업체를 위한 SUP 렌탈 플리트 구축 및 운영 가이드.
    guides:
      - title: 렌탈 플리트 구축하기
        desc: 렌탈 사업에 맞는 SUP 보드 선택법 — 내구성, 사이징, ROI 고려 사항.
        href: /solutions/rental-operators
      - title: Fleet Maintenance Guide
        desc: 렌탈 플리트의 보드 수명을 극대화하고 가동 중단을 최소화하는 필수 유지보수 방법.
        href: /solutions/rental-operators
  - title: 리조트 & 호스피탈리티 가이드
    tagline: 호스피탈리티를 위한 수상 액티비티
    desc: 리조트, 호텔, 워터프런트 여행지를 위한 SUP 프로그램 론칭 및 운영 가이드.
    guides:
      - title: 리조트 SUP 프로그램 시작하기
        desc: 게스트 SUP 액티비티 론칭 시 고려할 요소 — 플리트 규모, 인력 배치, 수익 모델링.
        href: /solutions/resorts-hotels
      - title: SUP vs 기타 수상 액티비티
        desc: 게스트 경험과 운영 효율성 측면에서 SUP 프로그램과 다른 수상 스포츠를 비교합니다.
        href: /learn/sup
  - title: 리테일 & 유통 가이드
    tagline: SUP 비즈니스 파트너십
    desc: SUP 리테일 파트너 또는 유통사가 되는 법 — 재고 계획, 시장 포지셔닝, 성장 전략.
    guides:
      - title: Becoming a SUP Retailer
        desc: 리테일 매장에서 제품 라인 선택, 재고 관리, SUP 보드 마케팅 방법.
        href: /solutions/retail-partners
      - title: 상업용 운영을 위한 SUP
        desc: 팽창식 SUP가 상업용 플리트, 렌탈 비즈니스, 프로페셔널 운영자에게 다재다능한 제품인 이유.
        href: /use-cases/search-and-rescue

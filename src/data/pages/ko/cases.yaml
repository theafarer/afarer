features3_cases:
  tagline: 주요 사례
  title: 맞춤형 솔루션<br />실제 도전 과제 해결
  isBeforeContent: false
  columns: 3
  items:
    - title: 유럽 다이빙 센터 선단
      customer: BlueMed Diving Centers
      country: 그리스
      industry: 다이빙 및 해양 관광
      challenge: 그리스 여러 섬에 걸친 다이빙 센터 체인에 12대의 다이빙 구성 SUP가 필요했습니다. 각 보드에는 맞춤형 장비 부착, 8개 탱크 보관, 개방수역 다이버 진입을 위한 안정적인 플랫폼이 필요했습니다. fleet은 관광 시즌 시작 전 60일 이내에 도착해야 했습니다.
      solution: 통합 장비 랙, 안정적인 플랫폼, 탑승 안정성을 위한 초광폭 드롭스티치 구조를 갖춘 12대의 SUP Voyager Dive 모델을 제작했습니다. 각 보드에는 고객 플릿 브랜딩이 적용되었으며, 12대 모두 압력 테스트를 거쳐 55일 이내에 청도에서 배송되었습니다.
      product: SUP 보야저 다이브
      results: 12개 보드 모두 관광 시즌에 맞춰 납품되었습니다. 해당 편대는 18개월 이상 매일 운용 중이며 소재 결함이 단 한 건도 없었습니다. 고객은 2년차에 추가 6개를 주문했습니다.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP Voyager Dive는 일상적인 다이빙 운영의 중추 역할을 하고 있습니다. 뛰어난 안정성을 갖추고 있으며, 장비 수납 레이아웃이 갑판을 깨끗하고 안전하게 유지하여 고객들에게 쾌적한 환경을 제공합니다.
      icon: tabler:lifebuoy
    - title: 호주 유통업체 공동 브랜드 프로그램
      customer: Pacific Watersports Pty Ltd
      country: 호주
      industry: 공동 브랜드 및 파트너십 프로그램
      challenge: 호주 유통사가 중국 직거래 브랜드에 대응할 경쟁력 있는 가격의 프라이빗레이블 SUP 보드 라인이 필요했습니다. 초보자부터 상급자까지 8가지 고유 모델, 커스텀 그래픽, 커스텀 포장, 리테일 아웃풋으로 드롭쉬핑 이행이 필요했습니다.
      solution: 호주 독점 그래픽 패키지와 함께 8종의 SUP 모델(올라운드, 투어링, 요가, 키즈, 스포츠, 울트라 컴팩트, 울트라 스테이블, 화이트워터)을 개발했습니다. 셋업 영상으로 연결되는 QR 코드가 포함된 맞춤형 리테일 패키징을 제공하며, 칭다오에서 호주 리테일 매장까지 직송되는 드롭십 물류를 구성했습니다.
      product: 커스텀 SUP 라인 (8개 모델)
      results: 컨셉부터 첫 출하까지 90일. 첫 시즌 리테일 판매율 85%. 유통업체가 2년차에 추가 SUP 모델을 포함하도록 파트너십을 확대했습니다.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: afarer는 초기 디자인부터 소매점까지 90일 만에 완전한 SUP 라인을 납품했습니다. 품질은 두 배 가격에 판매하는 브랜드에 필적합니다.
      icon: tabler:currency-dollar
    - title: 중동 구조선 공급
      customer: 국가 민방위청
      country: 아랍에미리트
      industry: 수색 및 구조
      challenge: 민방위 조직이 해안 수색 구조, 항만 보안, 홍수 대응을 위해 20대의 순찰용 SUP가 필요했습니다. 고가시성 보드, 완전한 안전 장비, 그리고 현지 해양 규정 준수가 요구되었습니다.
      solution: 고가시성 오렌지색 드롭스티치 구조, 완전한 안전 패키지, SOLAS 반사 테이프 및 보강 구조를 갖춘 20대의 SUP 패트롤 모델을 공급하였습니다. 각 보드는 CE 인증을 받았으며 해당 표준에 따라 시험되었습니다. 문서 패키지에는 현지 등록을 위한 적합 인증서가 포함되었습니다.
      product: SUP 패트롤
      results: 5개 해안 기지에 배치된 플리트. 보드는 극한 고온(45°C 이상)에서도 성능 저하 없이 운용 중. 성능 및 내구도가 사양을 초과 달성.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP Patrol은 당사의 운영 요건을 뛰어넘었습니다. 극한 고온 조건에서도 보드는 24개월간 매일 사용 후에도 UV 열화 징후가 전혀 없습니다.
      icon: tabler:alert-triangle
    - title: 유럽 공동 브랜드 파트너십
      customer: North Sea Marine Equipment BV
      country: 네덜란드
      industry: 공동 브랜드 및 파트너십 프로그램
      challenge: 기존 유럽 해양 브랜드가 제조 시설 투자 없이 SUP 시장에 진출하고자 했습니다. 프라이빗 브랜딩, CE 인증 및 EU 독점 유통권을 갖춘 5개 SUP 모델(9피트~12피트) 생산이 가능한 화이트라벨 파트너가 필요했습니다.
      solution: 5개 SUP 모델에 대한 화이트라벨 제조 계약을 체결했습니다. 각 모델은 고객 로고와 컬러 스킴으로 브랜딩되었습니다. 각 모델에 대한 CE 인증 문서가 준비되었습니다. 최소 주문 약속과 함께 독점 EU 유통 권리가 부여되었습니다. 현지 서비스 네트워크를 위한 기술 문서가 제공되었습니다.
      product: 맞춤형 SUP 라인 (5개 모델)
      results: 다년 계약 체결. 첫 번째 생산 런 50대를 75일 이내에 납품. 주요 무역 박람회에서 브랜드를 론칭하여 딜러들로부터 긍정적인 반응을 얻음.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: 아페러와의 협업으로 공장 건설 없이 SUP 시장에 진출할 수 있었습니다 — CE 인증과 딜러 지원 문서를 갖춘 완전한 턴키 솔루션을 납품했습니다.
      icon: tabler:building
    - title: 카리브해 리조트 선단
      customer: Paradise Island Resorts Ltd
      country: 바하마
      industry: 해양 관광 및 호텔
      challenge: '고급 리조트에서 투숙객 활동을 위한 완전한 수상 스포츠 장비 플리트를 필요로 함: 가이드 투어용 SUP 보드 40개, 라군 탐험용 SUP 20개, 투숙객 투어용 SUP 보드 10개 및 액세서리. 모든 장비에 맞춤 리조트 브랜딩이 필요하며 성수기 전 납품이 요구됨.'
      solution: '완전한 SUP 패키지 생산: SUP Voyager 보드 40척(올라운드 모델), SUP Explorer 보드 20척, SUP Touring 보드 10척, 그리고 PFD, 패들, 펌프, 수리 키트 포함. 모든 장비에 리조트 로고 및 열대 색상 구도 인쇄. 전량 적재 명세서와 함께 컨테이너 운송.'
      product: 전체 SUP 패키지(70대 이상)
      results: 피크 시즌 6주 전에 플리트가 도착했습니다. 수상 스포츠 활동에 대한 게스트 만족도가 전년 대비 40% 상승했으며, 장비는 일상적인 정비만으로 3개 시즌 동안 사용되었습니다.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: 완전한 패키지 방식으로 한 번의 출하로 필요한 모든 것을 받았습니다 — 보드와 액세서리 모두 브랜딩되어 고객 사용 준비가 완료되었습니다. 고객들이 장비 품질에 만족하고 있습니다.
      icon: tabler:beach
    - title: 미국 해안 경비 계약
      customer: 대서양 연안 보안 기관
      country: 미국
      industry: 해양 안보 및 법 집행
      challenge: 미국 해안 경비 기관은 개방 수역 순찰을 위한 하이드루트 SUP를 요청했습니다. 군사 등급 장비와 미국 해안경비대 규정을 준수하는 고성능 보드가 필요했습니다.
      solution: 강화된 드롭스티치 구조, 고가시성 색상 구성, 암호화 통신 장비 마운트, 통합 장비 부착점을 갖춘 엔지니어링 SUP 순찰보드를 설계했습니다. 중부하 작업을 위한 보강이 이루어졌으며, USCG 규정 준수 문서를 제공합니다.
      product: SUP 패트롤
      results: 기관은 첫 12개월 동안 95%의 임무 준비 달성률을 보고하였습니다. 추가로 8대를 발주하였습니다.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP 패트롤은 우리 승무원들에게 오픈 워터 운영에 필요한 성능을 제공합니다. 강화된 구조는 핸들링을 타협하지 않으면서 중요한 내구성을 제공합니다.
      icon: tabler:shield

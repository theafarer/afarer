hero:
  tagline: '사례 연구'
  title: '실제 프로젝트, 실제 결과<br />— afarer의 실행'
  subtitle: 'afarer가 전 세계 유통업체, 브랜드, 운영자와 협력하여 모든 응용 분야에 맞춤형 해양 솔루션을 제공하는 방법을 확인하세요.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'afarer 사례 연구 — 맞춤형 해양 제조 프로젝트'
features3_cases:
  tagline: '주요 사례'
  title: '맞춤형 솔루션<br />실제 도전 과제 해결'
  isBeforeContent: false
  columns: 3
  items:
    - title: '유럽 다이빙 센터 선단'
      description: '지중해 다이빙 센터 체인에 SUP 520 다이빙 구성 보트 12척 공급. 맞춤형 탱크 랙, 다이빙 사다리, 선단 브랜딩. 60일 내 납품.'
      icon: tabler:lifebuoy
    - title: '호주 유통업체 OEM 프로그램'
      description: '호주 수상 스포츠 유통업체를 위한 자체 브랜드 SUP 보드 시리즈 개발. 8개 모델, 맞춤형 포장, 드롭십 물류. 컨셉에서 첫 선적까지 90일.'
      icon: tabler:currency-dollar
    - title: '중동 구조선 공급'
      description: '중동 민방위 기관에 SUP 450 Patrol 보트 20척 공급. 자체 배수 데크, 전체 내비게이션 장비, 고시성 주황색 튜브. 현지 규제 표준 준수.'
      icon: tabler:alert-triangle
    - title: '유럽 OEM 브랜드 파트너십'
      description: '유럽 해양 브랜드와의 화이트 라벨 제조 파트너십. 5개 SUP 모델, 자체 브랜딩, EU 시장 독점 유통권. 다년 계약.'
      icon: tabler:building
    - title: '카리브해 리조트 선단'
      description: '카리브해 리조트용 종합 수상 스포츠 장비 패키지: SUP 보드 40개, 카약 20척, 팽창식 보트 10척, 액세서리. 모든 장비에 맞춤형 리조트 브랜딩.'
      icon: tabler:beach
    - title: '미국 해안 경비 계약'
      description: '미국 해안 보안 기관에 SUP 600 순찰정 공급. 트윈 엔진 구성, 장갑 콘솔 옵션, 군용 전자 장비 통합.'
      icon: tabler:shield
cta:
  title: '논의하고 싶은 프로젝트가 있으신가요?'
  subtitle: '모든 afarer 파트너십은 대화로 시작됩니다. 귀하의 요구 사항을 알려주시면 솔루션을 개발해 드리겠습니다.'
  actions:
    - variant: primary
      text: '프로젝트 시작하기'
      href: /contact
    - text: '역량 살펴보기'
      href: /brand/marine-expertise

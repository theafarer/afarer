hero:
  tagline: Lab 04
  title: 유체역학 테스트 탱크
  subtitle: 첫 풀스케일 프로토타입 제작 전 성능 검증
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: afarer 수력학 테스트 탱크 성능 시험
intro: 수동역학 테스트는 대양 항해 선박에만 국한된다는 것은 흔한 오해입니다. 실제로 소형 플레인잉 선체 — 예를 들어 4–6m RIB — 의 성능은 선체의 수중 형태에 의해 유류선이 벌지 bow에 의존하는 것만큼 크게 좌우됩니다. 트림 각도, 수선면적, 분수 생성 및 환기는 모두 속도, 연료 소비 및 승차감에 큰 영향을 미칩니다. Afarer에서는 전면 프로토타입에 금속과 직물을 투입하기 전에 모델 스케일에서 이러한 효과를 정량화할 수 있는 전용 수동역학 테스트 탱크를 운영하고 있습니다.
content_html: |-
  <h2>왜 소형 보트를 탱크 테스트하나요?</h2>
  <p>모델 스케일(보통 1:3~1:5)에서의 테스트를 통해 선체 형상을 빠르고 비용 효율적으로 반복 개선할 수 있습니다. 탱크에서 일주일간의 테스트로 전체 스케일에서 수개월이 소요되는 trial-and-error와 동일한 성능 데이터를 확보할 수 있으며, 비용은 극히 일부에 불과합니다.</p>

  <h2>시설 사양</h2>
  <table>
    <thead><tr><th>매개변수</th><th>사양</th></tr></thead>
    <tbody>
      <tr><td>탱크 치수</td><td>35m (길이) × 3.5m (폭) × 1.8m (깊이)</td></tr>
      <tr><td>견인 캐리지</td><td>전기 서보 구동, 최고 속도 12m/s (23kn), 속도 정확도 ± 0.5%</td></tr>
      <tr><td>파도 발생기</td><td>플랩형, 프로그래밍 가능한 규칙 및 불규칙 해상도, 모델 스케일 기준 Hs 최대 0.3m</td></tr>
      <tr><td>계측 장비</td><td>6-component 다이나모미터(항력, 측력, 요 момент), 가속도계, 경사계, 파도 프로브</td></tr>
      <tr><td>데이터 수집</td><td>채널당 1000Hz 샘플링, 실시간 표시 + 후처리 슈트</td></tr>
      <tr><td>모델 제작</td><td>최대 1.8m LOA 모델 선체를 위한 사내 CNC 밀링 및 3D 프린팅</td></tr>
    </tbody>
  </table>

  <h2>테스트 프로그램</h2>
  <p>저희 탱크에서의 표준 선체 개발 프로그램은 다음 순서로 진행됩니다:</p>
  <ol>
    <li><strong>모델 제작</strong> — 1:3.5 스케일 모델을 고밀도 폼에서 CNC 가공하고 유리섬유 코팅으로 강성을 확보합니다. 중량과 무게 중심(CG)은 Froude 스케일 전하 조건에 맞게 조정됩니다.</li>
    <li><strong>항력 시험</strong> — 운용 범위를 아우르는 8~10개 속도에서 모델을 견인합니다. 총 항력을 측정하고 ITTC-1957 방법으로 마찰 항력과 잔류 항력으로 분해합니다.</li>
    <li><strong>트림 및 침수 측정</strong> — 각 속도에서 항해 트림과 침수량을 기록합니다. 플레닝 선체의 최적 트림 각도는 4~6도를 목표로 합니다.</li>
    <li><strong>후류 조사</strong> — 2개 속도에서 횡파 단면을 측정하여 유발 저항을 평가하고 선미 간섭을 유발할 수 있는 횡파 상호작용을 식별합니다.</li>
    <li><strong>항해성 (선택)</strong> — 규칙 파에서 정 순항 및 순박 시험을 통해 추가 항력, 수직 가속도 및 타격 확률을 측정합니다.</li>
    <li><strong>데이터 분석 및 권고사항</strong> — 비교 차트, 속도/전력 곡선 및 전체 스케일 선체에 대한 구체적인 설계 권고사항이 포함된 전체 보고서를 제공합니다.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">일반 탱크 테스트 결과 — 항력 vs 속도 (RIB 450 선체, 1:3.5 스케일)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Froude 스케일 속도에서의 모델 스케일 항력(N). 전체 스케일 전력 예측은 ITTC-1978 성능 예측 방법을 따릅니다.</p>
  </div>

  <h2>전문 팀</h2>
  <p>저희 탱크는 조선해양공학 박사 학위를 보유하고 유럽 주요 해양 연구소에서 8년간의 탱크 견인 경험을 갖춘 수력학 전문가가 운영합니다. 모든 모델과 계측 장비를 준비하는 기술자가 지원하며, ITTC(국제탱크회의) 권장 절차를 준수하여 모든 테스트가 반복 가능하고 추적 가능하며 국제적으로 방어 가능한 수준으로 수행됩니다.</p>

  <h2>맞춤 선체 개발을 위한 탱크 테스트</h2>
  <p>저희 탱크는 자사 설계 선체에만 사용되는 것이 아니라, 맞춤 선체 형상 검증이나 성능 문제 조사를 원하는 고객을 위한 테스트 프로그램도 정기적으로 수행합니다:</p>
  <ul>
    <li><strong>선체 형상 비교</strong> — 동일한 조건에서 2개 이상의 후보 선체 형상을 테스트하여 설계 선택에 활용할 수 있는 객관적인 항력/속도/안정성 비교를 제공합니다.</li>
    <li><strong>부속체 최적화</strong> — 인터셉터 플레이트, 스프레이 레일, 트림 탭 및 스트레이크를 다양한 구성으로 테스트하여 항력 감소에 대한 각각의 기여도를 정량화합니다.</li>
    <li><strong>엔진 매칭 연구</strong> — 항력 데이터를 전력 예측 곡선으로 변환하여 목표 속도와 적재량에 최적의 엔진 마력도를 선택할 수 있도록 합니다.</li>
  </ul>

  <h2>왜 저희와 함께 테스트하나요?</h2>
  <p>단순한 원시 숫자 세트가 아닌, 탱크 데이터를 실행 가능한 엔지니어링 권고사항으로 해석한 보고서를 제공합니다. "크루즈 속도에서 젖은 표면적을 줄이기 위해 스프레이 레일을 8mm 높이세요", "타격 가속도를 줄이기 위해 트랜섬 데드라이즈를 3도 높이세요", 또는 "플레닝 자세 개선을 위해 종방향 무게 중심을 150mm 후방으로 이동하세요" 등 무엇을 어떻게 바꿔야 하는지 명확한 이해를 갖고 돌아가실 수 있습니다.</p>
  <p>저희 탱크는 유상 서비스 기반의 독립적인 제3자 테스트에도 이용 가능합니다. 선체를 개발 중이며 객관적이고 전문적으로 수행되는 수력학 평가를 원하시는 경우, 언제든 문의해 주십시오.</p>

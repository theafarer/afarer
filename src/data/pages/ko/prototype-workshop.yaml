hero:
  tagline: 연구실 05
  title: 프로토타입 워크숍
  subtitle: CAD 모델부터 해상 운항 가능한 보트까지 — 제조, 장착 및 실증 완료
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
  image_alt: Afarer 프로토타입 워크숍 보트 제작
intro: 어떤 CAD 모델이든 아무리 정교하더라도 물과 만나기 전까지는 실제 조종 성능을 알 수 없습니다. 그래서 프로토타입 워크숍은 엔지니어링 데이터를 물 위에서 실제로 운항하는 선박으로 가능한 한 빠르고 정확하게 변환하도록 설계되었습니다. 모든 새로운 {SITE.name} 모델과 모든 중요한 맞춤 제작 제품은 양산 금형 투입 전에 이 워크숍을 거칩니다.
content_html: |
  <h2>디자인이 현실이 되는 곳</h2>
  <p>워크숍은 선체, 튜브 및 조종 장비의 동시 제작을 위해 완비되어 있습니다. 이 병렬 워크플로우 접근 방식은 엔지니어링 릴리스 후 프로토타입 리드타임을 8~12주로 단축하며, 업계 표준인 16~20주에 비해 크게 줄어듭니다. 귀하의 응용 분야에 맞춤형 솔루션이 필요할 경우, 개념에서 수상 검증까지 3개월 이내에 진행할 수 있습니다.</p>

  <h2>워크숍 역량</h2>
  <table>
    <thead><tr><th>작업장</th><th>장비</th><th>용도</th></tr></thead>
    <tbody>
      <tr><td>선체 제작</td><td>회전 성형 오븐(HDPE), TIG 용접 베이(알루미늄), 수동 적층 몰드(유리섬유)</td><td>세 가지 소재 유형 모두에서의 전-scale 선체 생산</td></tr>
      <tr><td>튜브 조립</td><td>RF 용접 프레스, 핫에어 타킹 스테이션, 팽창 테스트 지그</td><td>모든 배플, 콘 및 밸브를 포함한 전-scale 튜브 어셈블리 제작</td></tr>
      <tr><td>조종 장비 &amp; 피팅</td><td>엔진 호이스트(500kg), 콘솔 목업 프레임, 유압 호스 크림퍼, 전기 배선 보드</td><td>완전한 장비 설치: 엔진, 조타 장치, 제어 장치, 연료 시스템, 전자 장비, 좌석</td></tr>
      <tr><td>계측기 베이</td><td>GPS 속도 센서, 연료 흐름계, 가속도계, 열전대 어레이, 데이터 로거</td><td>해상 시험 계측기 설치 및 보정</td></tr>
    </tbody>
  </table>

  <h2>프로토타입 여정 — 단계별</h2>
  <ol>
    <li><strong>엔지니어링 인수인계</strong> — 설계 패키지(3D 모델, FEA 보고서, 자재 명세서, 적층 스케줄)가 워크숍 리드 및 프로젝트 엔지니어에 의해 공식적으로 검토됩니다. 모든 제조 관련 문제가 절단 시작 전에 발견되고 해결됩니다.</li>
    <li><strong>선체 생산</strong> — 선체는 엔지니어링 사양에 따라 제작됩니다. HDPE: Moldex3D 시뮬레이션에서 회전 성형 프로그램이 로드됩니다. 알루미늄: 승인된 용접 맵에 따라 CNC 절단 플레이트가 TIG 베이에서 용접됩니다. 유리섬유: 레이어별로 적층 BOOK이 따릅니다.</li>
    <li><strong>튜브 제작</strong> — 직물은 CNC 패턴 템플릿을 사용하여 절단된 후 전-scale 챔버로 RF 용접됩니다. 각 챔버는 테스트 압력으로 팽창되어 24시간 동안 초기 안정화를 위해 방치됩니다.</li>
    <li><strong>조립 &amp; 조종 장비</strong> — 선체와 튜브가 결합됩니다. 엔진이 설치되고, 조타 장치 및 제어 장치가 연결되며, 연료 시스템이 설치되고, 모든 전기 회로가 배선 및 검증됩니다.</li>
    <li><strong>정적 테스트</strong> — 보트가 물에 닿기 전에 다음과 같은 테스트를 수행합니다: 부력 검사(전하중 + 30% 예비), 연료 시스템 압력 테스트, 조타 시스템 전잠금 사이클 테스트, 전기 접지 연속성 테스트.</li>
    <li><strong>해상 시험 프로그램</strong> — 아래에 상세히 설명된 20시간의 수중 테스트.</li>
    <li><strong>프로토타입 리뷰</strong> — 엔지니어링, 생산 및 품질 팀과 함께 공식 인수 회의가 개최됩니다. 필요한 설계 변경 사항은 문서화되고 생산 릴리스에 통합됩니다.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20시간 해상 시험 프로그램 — 테스트 일정</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">항만 기동 — 저속 조작, 후진, 스트레이크 검사</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">속도 시험 — GPS 검증 최고 속도, 크루즈 속도, 3개 RPM 지점에서의 연료 소비량</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">회전 테스트 — 20kn에서 좌현 및 우현의 전술 직경, 전진 및 양상</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">충격 테스트 — 0.5~1.0m 파도를 통과하는 반복 주행; 조타석 베이스에 가속도계 장착</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">안정성 테스트 — 우현에 4명의 승무원 + 장비를 실은 정적 경사각, 오프셋 하중</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">내구성 주행 — 크루즈 속도로 3시간 연속; 온도 모니터링(엔진, 연료, 전기)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">최종 검사 — 시험 후 모든 시스템 검사, 모든 고정장치 조이기/검사, 결과 문서화</span>
      </div>
    </div>
  </div>

  <h2>독특한 응용을 위한 맞춤형 프로토타이핑</h2>
  <p>프로토타입 워크숍은 표준 생산 보트가 해결할 수 없는 문제를 해결하는 곳입니다. 최근 사례는 다음과 같습니다:</p>
  <ul>
    <li>수색 및 구조 조직을 위한 7.8m RIB로, 전복 방지 기능이 있는 맞춤형 캐빈 구조, 통합 스트레처 마운트 및 선수 장착 소나 포드가 필요했습니다 — 모두 우리 시설에서 프로토타이핑, 장비 설치 및 테스트되었습니다.</li>
    <li>수로 측량 계약자를 위한 5.2m 인플레이터블로, 절단된 트랜섬, 탈착식 계측기 마스트 및 유동 방해를 최소화하도록 설계된 관통식 트랜스듀서 포켓이 있습니다.</li>
    <li>슈퍼요트용 전기 구동 4.5m tender로, 고객이 4대의 fleet 구매를 결정하기 전에 프로토타입이 주행 거리, 충전 인프라 및 소음 수준을 검증하는 데 사용되었습니다.</li>
  </ul>

  <h2>프로토타이핑 팀</h2>
  <p>워크숍은 세 가지 핵심 분야(선체, 튜브, 조종 장비) 중 최소 두 분야에서 교차 훈련을 받은 8명의 다기능 해양 기술자로 구성되어 있습니다. 팀 리드는 맞춤형 단일 제작부터 생산 시리즈까지 16년의 경험을 가진 마스터 보트 빌더입니다. 모든 프로토타입에는 제작 및 시험 과정 전반에 걸쳐 고객의 단일 연락점 역할을 하는 전담 프로젝트 엔지니어가 배정됩니다.</p>

  <h2>고객 참여</h2>
  <p>우리는 고객이 프로토타입 제작 중 핵심 마일스톤에 참석하도록 적극 권장합니다 — 특히 초기 장비 검토와 해상 시험. 이 단계에서의 귀하의 운영 피드백은 보트가 생산에 들어가기 전 미세 조정에 매우 가치가 있습니다. 우리는 진공 상태에서 제작하지 않습니다; 귀하와 파트너십을 맺어 제작합니다.</p>
  <p>20시간 해상 시험은 또한 귀하의 팀이 보트의 조작, 시스템 레이아웃 및 유지보수 요구사항에 익숙해지고, 생산 보트 납품 시 원활한 서비스 전환을 보장할 수 있는 기회이기도 합니다.</p>

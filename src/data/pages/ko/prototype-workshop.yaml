meta:
  title: 프로토타입 워크숍 — 풀스케일 RIB 프로토타입 제작 및 해상 시험 | {SITE}
  description: CAD에서 해상 시험 준비 완료 보트까지 8-12주. 프로토타입 워크숍에서 맞춤형 RIB 및 팽창식 보트를 제작, 장착 및 해상 시험을 수행합니다. 지금 프로토타입 프로젝트를 시작하세요.

meta:
  title: OEM 구매 가이드 — 아시아 인플레이트 수상선 조달 | {SITE}
  description: '아시아 제조업체로부터 인플레이터블 보트, SUP, 카약, RIB를 조달하기 위한 종합 가이드: 공장 평가 체크리스트, QC 프로토콜, 규정 준수 검증, MOQ 협상, 운송 조건 및 일반적인 함정.'
back_text: 연구로 돌아가기
hero:
  tagline: 조달
  title: OEM 구매자 가이드 — 아시아에서 인플레이션 수자국 조달
  subtitle: 12분 읽기
content_html: |-
  <h2>1. 사전 자격 심사: 공장에서 무엇을 확인해야 하는가</h2>

  <h3>규격 인증서</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> — 품질 관리 시스템</li>
    <li><strong>CE 인증</strong> — Notified Body 번호 확인</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> — 사회 책임 감사</li>
    <li><strong>REACH / RoHS</strong> — 소재 적합성 선언</li>
  </ul>

  <h3>제조 역량</h3>
  <ul>
    <li>드롭 스티치 코어 사내 직조 vs 외주</li>
    <li>PVC 코팅/라미네이션 라인</li>
    <li>RF 용접 및 열풍 용접 장비</li>
    <li>사내 금형 제작(CNC 가공)</li>
    <li>테스트 랩(압력 테스트, UV 노화, 인장 시험)</li>
  </ul>

  <h3>경력 확인</h3>
  <ul>
    <li>팽창식 수상선박 제조 경력(최소 5년 이상)</li>
    <li>직원 엔지니어 수</li>
    <li>기존 OEM/ODM 고객(참조 요청)</li>
    <li>수출 목적지 — 대상 시장으로 이미 배송 중인가?</li>
  </ul>

  <h2>2. 품질 관리 프로토콜</h2>
  <p>원자재 입고 QC: 인장 강도(ASTM D751 또는 ISO 1421), 찢김 저항(ASTM D2261 또는 ISO 4674), 접착 강도, UV 노화 스팟 체크.</p>
  <p>공정 중 QC: 50유닛마다 침 strength 모니터링, 밸브 토크 확인, 드롭 스티치 실 밀도 확인, CAD 도면 대비 치수 검사.</p>
  <p>최종 검사: 100% 인플레이션 홀드 테스트(24시간, 최대 5% 손실), 시각 검사, 밸브 기능 테스트, 무작위 샘플 테스트(AQL 2.5 또는 4.0, ISO 2859 기준).</p>

  <h2>3. 적합성 문서 체크리스트</h2>
  <ul>
    <li>적합성 선언서(DoC) — EU 지침 참조</li>
    <li>인정 기관의 CE 인증서</li>
    <li>인정 실험실 시험 보고서</li>
    <li>소재 안전 데이터 시트(MSDS)</li>
    <li>REACH 적합성 선언</li>
    <li>공급업체 추적 가능한 BOM</li>
    <li>공장 감사 보고서</li>
  </ul>

  <h2>4. MOQ 협상</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">제품 유형</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">표준 MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">협상 가능 범위</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP 보드</td><td class="p-3 border">50 — 100개</td><td class="p-3 border">5 — 10개(시범)</td></tr>
      <tr><td class="p-3 border">카약</td><td class="p-3 border">50 — 100개</td><td class="p-3 border">5 — 10개(시범)</td></tr>
      <tr><td class="p-3 border">팽창식 보트</td><td class="p-3 border">50 — 100개</td><td class="p-3 border">2 — 5개(시범)</td></tr>
      <tr><td class="p-3 border">RIB 보트</td><td class="p-3 border">20 — 50개</td><td class="p-3 border">2 — 5개(시범)</td></tr>
      <tr><td class="p-3 border">안전/액세서리</td><td class="p-3 border">200 — 500개</td><td class="p-3 border">50 — 100개(시범)</td></tr>
    </tbody>
  </table>

  <h2>5. 물류 및 운송</h2>
  <p>주요 Incoterms: <strong>FOB</strong>(공장에서 출발 항구까지 인도 — 가장 일반적), <strong>EXW</strong>(구매자가 공장 문에서 모든 운송 주관), <strong>CIF</strong>(공장이 목적 항구까지 운임 및 보험 부담).</p>
  <p>팽창식 제품은 저무게 대부피 — 부피중량(DIM)이 운송 비용을 결정하는 경우가 많습니다. 부피를 50–60% 줄이기 위해 진공 포장 요청을 권장합니다. 중국에서 EU까지 해운: 25–35일; 미국 서해안: 15–20일.</p>

  <h2>6. 흔한 실수</h2>
  <ul>
    <li><strong>공장 감사 없음:</strong> 항상 제3자 감사(QIMA, SGS, Bureau Veritas)를 수행하거나 위탁하세요</li>
    <li><strong>구두 사양만:</strong> 양측이 서명한 상세 기술 사양서</li>
    <li><strong>샘플 승인 생략:</strong> 대량 생산 전 샘플에 대한 서면 승인</li>
    <li><strong>생산 중 QC 없음:</strong> 생산 중 제3자 검사(DUPRO) 및 출하 전(PSI)</li>
    <li><strong>적합성 무시:</strong> 생산 전 CE/UKCA 인증 확인</li>
  </ul>

  <h2>7. Afarer를 선택하는 이유</h2>
  <p>Afarer는 2012년부터 OEM/ODM 팽창식 수상선박을 제조해 왔습니다. 12,000 m&sup2; ISO 9001 인증 시설, 25명 이상의 엔지니어, 모든 제품 라인에 걸친 CE 인증을 보유하고 있으며, 이 가이드의 모든 요건을 충족합니다. 신규 파트너를 위한 시험 MOQ 및 전체 적합성 문서 패키지를 제공합니다.</p>

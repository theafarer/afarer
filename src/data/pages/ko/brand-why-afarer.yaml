features3_reasons:
  tagline: 더 먼 곳을 선택하는 이유
  title: 우리와 협력해야 하는 7가지 이유
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. 실제 제조, 거래 아님
      description: 우리는 12,000m² 규모의 공장을 소유 및 운영하고 있습니다. afarer와 파트너십을 맺으면 중개인 없이 제품을 설계, 엔지니어링, 제작하는 사람들과 직접 협력하게 됩니다.
      icon: tabler:building-factory
    - title: 2. 엔지니어링 중심 접근법
      description: 우리의 디자인 프로세스는 제품 카테고리가 아닌 사용 사례에서 시작됩니다. 보트가 실제로 사용되는 방식에 맞게 선체 모양, 재료 선택 및 구성을 최적화합니다.
      icon: tabler:engine
    - title: 3. 인증된 품질
      description: CE 인증, ISO 품질 시스템, BSCI 준수, REACH 준수, USCG 승인. 모든 제품은 주장뿐만 아니라 국제 표준을 충족합니다.
      icon: tabler:certificate
    - title: 4. 유연한 OEM/ODM
      description: 튜브 색상, 콘솔 레이아웃, 브랜딩, 포장 등 귀하의 사양에 맞게 맞춤화됩니다. 최소 주문 압력이 없습니다. 프로토타입으로 시작하여 자신있게 확장하세요.
      icon: tabler:adjustments
    - title: 5. 글로벌 물류
      description: 캘리포니아에 있는 미국 창고, 칭다오에서 직접 배송, 긴급 주문을 위한 항공 화물. 우리는 세관 서류 및 서류를 처리합니다.
      icon: tabler:truck-delivery
    - title: 6. 평생 지원
      description: 우리는 20년 전에 제작한 보트를 지원합니다. 순정 예비 부품, 기술 조언, 수리 안내 — 필요할 때 언제든지 저희 팀에 연락하실 수 있습니다.
      icon: tabler:lifebuoy
    - title: 7. 정직한 사양
      description: 실제 하중 등급, 실제 치수, 실제 중량. 마케팅 인플레이션이 없습니다. 우리가 게시하는 내용은 독립적인 테스트를 통해 검증된 결과입니다.
      icon: tabler:ruler-measure
testimonials:
  tagline: 전 세계 브랜드의 신뢰를 받는
  title: 파트너의 의견
  items:
    - content: 중국에서 여러 제조업체와 협력했지만, 아페러는 엔지니어링 지원과 일관된 품질로 뛰어납니다. 그들은 우리 브랜드를 자기 브랜드처럼 소중히 여깁니다.
      name: —OEM Partner, European Water Sports Brand
    - content: 그들의 Hypalon RIB는 5년 이상 우리 함대에서 운용되어 왔습니다. 최소한의 유지보수와 뛰어난 UV 내성을 자랑하며, 튜브에 대한 5년 보증이 우리에게 신뢰를 줍니다.
      name: —Fleet Operator, Middle East Resort Group
    - content: afarer 팀은 컨셉부터 생산까지 90일 만에 맞춤형 SUP 보드 디자인 개발을 지원하였습니다. 품질이 기대를 뛰어넘었습니다.
      name: —Distributor, Australian Watersports

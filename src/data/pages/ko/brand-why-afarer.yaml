  subtitle: 모든 제조업체가 동일하게 만들어지는 것은 아닙니다. 전 세계 유통업체, 브랜드, 운영업체가 선호하는 파트너인 afarer의 이유는 다음과 같습니다.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer의 제조 품질과 전문성

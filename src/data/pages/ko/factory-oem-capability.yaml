hero:
  tagline: OEM/ODM 제조
  title: OEM 및 프라이빗 라벨 제조
  subtitle: From concept to container — customize every detail of your inflatable watercraft line
intro: afarer는 전 세계 브랜드, 유통업체 및 정부 기관에 포괄적인 OEM 및 ODM 서비스를 제공합니다. 10년 이상의 수출 경험과 12,000 m² 규모의 ISO 9001 및 BSCI 인증 공장에서 제품 설계, 금형 개발부터 대규모 생산, 포장, 물류까지 모든 과정을 처리합니다.
highlight:
  - value: 10건 이상
    label: OEM 경험 연수
    detail: 2012년부터
  - value: 50+
    label: 수출 대상국
    detail: 글로벌 네트워크
  - value: 200+
    label: 완료된 커스텀 프로젝트
    detail: 전 제품 라인
  - value: 30–45
    label: 표준 리드타임(일)
    detail: PO부터 FOB까지
services:
  - title: 제품 설계 및 엔지어링
    description: 자체 R&D 팀이 귀사의 컨셉이나 사양에 맞춰 CAD 도면, 3D 모델 및 프로토타입을 개발합니다. 금형 설계, 선체 형태 최적화 및 소재 선택 가이드를 제공합니다.
  - title: 맞춤 브랜딩 및 그래픽
    description: 풀컬러 디지털 프린팅, 스크린 프린팅, 엠보싱, 라벨 옵션을 제공하며, 브랜드별 갑판 그래픽, 튜브 브랜딩, 소매 패키징을 개발합니다.
  - title: 소재 및 사양 맞춤 제작
    description: PVC(표준, 친환경, 내화성), Hypalon/CSM, 드롭스티치, 하이브리드 구조 중 선택 가능. 튜브 색상, 직물 무게, 강화 옵션을 커스터마이징할 수 있습니다.
  - title: 포장 및 물류
    description: 커스텀 리테일 포장, 프라이빗레이블 박스, 진공 포장, 팔레타이징 및 컨테이너 적재. FOB Qingdao, CIF, DDP 운송 조건 가능.
moq_table:
  - product: 인플레이터블 SUP 보드
    standard_moq: 5–10대
    custom_moq: 200+ 대
    lead_time: 30–45일
  - product: 구명조끼 및 안전
    standard_moq: 100–200대
    custom_moq: 1,000대 이상
    lead_time: 20–30일
why_us:
  - title: 수직 계열화
    description: 우리는 공장, 금형, 공급망을 직접 소유하고 있어 중간상인이나 하도급업체가 없습니다. 이를 통해 품질, 비용, 납기에 대한 통제를 할 수 있습니다.
  - title: 이중 인증
    description: ISO 9001 품질 관리 및 BSCI 사회 책임 인증. 공장 감사 보고서는 요청 시 제공됩니다.
  - title: CE 인증
    description: 모든 표준 모델은 CE 2013/53/EU 인증을 보유하고 있습니다. 커스텀 모델은 당사의 확립된 프로세스를 통해 CE 인증을 받을 수 있습니다.
  - title: 낮은 MOQ
    description: 표준 모델의 경우 최소 5대부터 시작할 수 있습니다. 우리는 신규 브랜드가 재고를 과도하게 확보하지 않고 출시할 수 있도록 지원합니다.

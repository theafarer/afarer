meta:
  title: 'OEM 및 자체 브랜드 생산 | {SITE}'
  description: '컨셉에서 컨테이너까지: 팽창식 SUP 시리즈의 모든 디테일을 맞춤화하세요. 자체 브랜드 패들보드를 위한 완전한 OEM/ODM 서비스.'
  keywords:
    - 'OEM SUP 생산'

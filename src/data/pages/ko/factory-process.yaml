intro: 생산을 외부 공장에 아웃소싱하는 브랜드와 달리, afarer는 제조 체인 전체를 소유하고 운영합니다. 이 수직 통합을 통해 모든 단계에서 엄격한 품질 관리를 유지하고, 맞춤 요구사항에 신속하게 대응하며, 배치마다 일관된 제품 품질을 제공할 수 있습니다. 다음은 당사 시설에서 보트가 제조되는 과정입니다.
steps:
  - step: '01'
    title: 자재 입고 및 검사
    description: 입고되는 모든 PVC 원단, 유리 섬유 매트, 수지, 하드웨어 배치는 사양에 따라 검사됩니다. 원단 샘플은 생산에 투입되기 전에 인장 강도, 두께 균일성 및 내자외성 테스트를 거칩니다. 부적합 자재는 격리되어 반품됩니다.
    duration: 1~2일
  - step: '02'
    title: 자동 PVC 절단
    description: 입고되는 모든 PVC 원단, 유리 섬유 매트, 수지, 하드웨어 배치는 사양에 따라 검사됩니다. 원단 샘플은 생산에 투입되기 전에 인장 강도, 두께 균일성 및 내자외성 테스트를 거칩니다. 부적합 자재는 격리되어 반품됩니다.
    duration: 보트 키트당 2~4시간
  - step: '03'
    title: 자재 입고 및 검사
    description: 승인된 원단은 자동 CNC 절단기에 배치되어 서브밀리미터 정밀도로 절단됩니다. 컴퓨터 최적화 네스팅으로 패널 배열을 최적화하여 일반적으로 5% 미만의 폐기율을 달성합니다. 절단된 패널은 보트 모델과 챔버별로 라벨링된 후 용접 작업장으로 보내집니다.
    duration: 보트 키트당 2~4시간
  - step: '04'
    title: FRP SUP 선체 성형
    description: 패널은 200~600°C의 제어된 온도에서 열풍 용접 방식으로 열 밀봉기(압교기)를 사용하여 가접 및 접합됩니다. 주요 이음새는 RF 유전체 용접으로 보강되어 기밀, 고강도 접합부를 형성합니다. 완성된 챔버는 작동 압력의 1.5배로 30분간 가압하여 기밀 검증을 받습니다.
    duration: 보트 키트당 2~4시간
  - step: '05'
    title: 자재 입고 및 검사
    description: 입고되는 모든 PVC 원단, 유리 섬유 매트, 수지, 하드웨어 배치는 사양에 따라 검사됩니다. 원단 샘플은 생산에 투입되기 전에 인장 강도, 두께 균일성 및 내자외성 테스트를 거칩니다. 부적합 자재는 격리되어 반품됩니다.
    duration: 1~2일
  - step: '06'
    title: 자재 입고 및 검사
    description: 승인된 원단은 자동 CNC 절단기에 배치되어 서브밀리미터 정밀도로 절단됩니다. 컴퓨터 최적화 네스팅으로 패널 배열을 최적화하여 일반적으로 5% 미만의 폐기율을 달성합니다. 절단된 패널은 보트 모델과 챔버별로 라벨링된 후 용접 작업장으로 보내집니다.
    duration: 1~2일
  - step: '07'
    title: 자재 입고 및 검사
    description: 입고되는 모든 PVC 원단, 유리 섬유 매트, 수지, 하드웨어 배치는 사양에 따라 검사됩니다. 원단 샘플은 생산에 투입되기 전에 인장 강도, 두께 균일성 및 내자외성 테스트를 거칩니다. 부적합 자재는 격리되어 반품됩니다.

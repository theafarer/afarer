meta:
  title: '글로벌 진출 — 50개국 이상에 공급하는 SUP 제조사 | {SITE}'
  description: 'afarer는 팽창식 SUP 보드와 보트를 모든 대륙 50개국 이상에 수출합니다. 브랜드, 유통사, 함대를 위한 전문 제조사이자 공급업체입니다.'
  keywords:
    - '글로벌 SUP 제조사'
    - '패들보드 수출업체'
    - 'SUP 공장 중국'
    - '전문 SUP 공급업체'
hero:
  tagline: 글로벌 입지
  title: 모든 대륙에 걸쳐 50개 이상의 국가에<br />서비스 제공
  subtitle: 유럽 ​​해안 순찰대원부터 호주 수상 스포츠 유통업체, 중동 구조팀에 이르기까지 전 세계적으로 더 먼 곳의 보트가 물 위에 있습니다.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer 글로벌 해양 제조 및 유통
stats:
  title: 글로벌 네트워크
  stats:
    - title: 국가
      amount: 50+
    - title: 수출 시장
      amount: 유럽, 아메리카, 아시아, 중동, 오세아니아
    - title: 생산
      amount: 중국 칭다오
    - title: 미국 창고
      amount: Montclair, CA
features3_markets:
  tagline: 핵심 시장
  title: 현지 요구 사항에 대한<br />지역 전문성
  subtitle: 우리는 시장마다 규제 요구사항, 선호도, 사용 사례가 다르다는 것을 알고 있습니다.
  isBeforeContent: false
  columns: 4
  items:
    - title: 유럽 및 영국
      description: EN ISO 6185 표준을 충족하는 CE 인증 제품입니다. EU 시장 전반에 걸쳐 SUP, 풍선 보트, SUP 보드에 대한 수요가 높습니다. 영국 유통업체는 우리의 빠른 처리 시간을 높이 평가합니다.
      icon: tabler:map-pin
    - title: 북미
      description: 미국 해안경비대가 제조를 승인했습니다. 빠른 서해안 배송을 위해 캘리포니아 주 몽클레어에 있는 미국 창고. 어선, 구조선, 레크리에이션 SUP에 대한 수요가 증가하고 있습니다.
      icon: tabler:map-pin
    - title: 호주 및 오세아니아
      description: SUP 보트 및 팽창식 입찰에 대한 강력한 시장. 호주 유통업체는 가혹한 태양 조건에서 UV 저항력이 뛰어난 Hypalon 보트를 높이 평가합니다. 아시아 시설에서 빠른 배송.
      icon: tabler:map-pin
    - title: 중동
      description: 순찰선과 구조선에 대한 수요가 증가하고 있습니다. 우리의 알루미늄 선체 RIB는 해안 경비대 및 보안 담당자에게 인기가 있습니다. 고온 환경을 위한 맞춤형 구성.
      icon: tabler:map-pin
features3_distribution:
  tagline: 유통망
  title: 전 세계 대리점과의 파트너십<br />
  subtitle: 우리는 기존 해양 장비 유통업체, 수상 스포츠 브랜드, 정부 조달 기관과 협력하고 있습니다.
  isBeforeContent: false
  columns: 3
  items:
    - title: 공동 브랜드 프로그램
      description: 글로벌 수상 스포츠 브랜드를 위한 자체 상표 제조. 우리는 디자인부터 생산, 직송까지 모든 것을 처리합니다.
      icon: tabler:building
    - title: 유통 네트워크
      description: 20개 이상 국가의 공인 대리점에서 재고를 보유하고 현지 지원을 제공합니다. 새로운 대리점 문의를 환영합니다.
      icon: tabler:users
    - title: 정부 및 공공기관
      description: 해안 경비대, 수색 및 구조 조직, 군사 조달 프로그램에 직접 공급합니다. 기관 조달 요구 사항을 준수합니다.
      icon: tabler:building-community
steps2_logistics:
  title: 글로벌 물류 및 지원
  subtitle: 공장에서 목적지까지 — 우리는 전체 공급망을 관리합니다.
  items:
    - title: 배송 옵션
      description: 해상 화물(FOB 칭다오), 긴급 주문을 위한 항공 화물, 샘플 및 예비 부품을 위한 특급 택배.
      icon: tabler:truck-delivery
    - title: 미국 창고
      description: '북미 전역의 빠른 배송을 위해 캘리포니아 주 몽클레어에 재고가 보관되어 있습니다. 서해안: 2-3일, 중부: 3-4일, 동해안: 4-5일.'
      icon: tabler:building-warehouse
    - title: 예비 부품
      description: 정품 afarer 예비 부품 및 소모품을 연중 내내 보관합니다. 일반 부품은 24시간 이내에 배송됩니다.
      icon: tabler:package
    - title: 기술 지원
      description: 기술적인 질문, 수리 조언, 수리 지원을 위해 당사 엔지니어링 팀에 직접 연락하세요. 우리는 20년 전에 제작한 보트를 지원합니다.
      icon: tabler:headset
cta:
  title: 유통업자가 되고 싶나요?
  subtitle: 유통망을 적극적으로 확대하고 있습니다. 파트너십 기회에 대해 논의하려면 수출팀에 문의하세요.
  actions:
    - variant: primary
      text: 제휴문의
      href: /contact
    - text: 제품 라인업 보기
      href: /products

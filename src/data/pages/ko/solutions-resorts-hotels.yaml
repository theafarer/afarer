meta:
  title: 리조트 SUP 플릿 솔루션 | {SITE}
  description: 리조트 및 호텔을 위한 완전한 SUP 편성 솔루션. 상업용 등급 보드, 맞춤 브랜딩, 스태프 교육 및 20대에서 100대 이상까지의 ROI 최적화 패키지.
hero:
  tagline: 리조트 및 호텔
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 깨끗한 해변에서 SUP를 즐기는 리조트 투숙객
roi_section:
  title: 리조트 SUP 수익 모델
  subtitle: 리조트가 단일 투자로 연간 $50,000 - $200,000 이상의 SUP 렌탈 수익을 창출하는 방법.
  metrics:
    - metric: $50K–$200K+
      label: 연간 SUP 매출
      detail: 리조트별, 플릿 규모 및 객실 점유율 기준
    - metric: 4~6개월
      label: 평균 투자 회수 기간
      detail: 1시즌 내 전체 플리트 투자비 회수
    - metric: 40%
      label: 매출 증가
      detail: Afarer 플릿 전환 후 평균 매출 증가
    - metric: 500건 이상
      label: 보드당 렌탈 사이클 수
      detail: 일일 사용을 위한 상용 등급 내구성
packages:
  title: 리조트 패키지 시스템
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - 12개월 보증 + CE 인증
      revenue: 연간 수익 잠재력 $50K–$80K
      cta_text: 스타터 패키지 받기
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 패들 50개 + 구명조끼 50개
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - 직원 교육 세션(온라인)
        - 12개월 보증 + CE 인증
      revenue: 연간 수익 잠재력 $120K–$200K+
      popular: true
      cta_text: 프리미엄 패키지 받기
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - 전담 관리자
        - 우선 교체 부품 (24시간 내 출고)
        - Custom branding + logo
        - 마케팅 사진/영상 패키지
        - 24개월 보증 + CE 인증
      revenue: 연간 $200K 이상의 매출 잠재력
      cta_text: 플래그십 패키지 구매
case_study:
  quote: 아페르로 전환한 이래, SUP 대여 수익이 40% 증가했으며, 보드 교체 비용은 60% 감소했습니다. 전체 함대 투자금을 4개월 만에 회수했습니다.
  author: 수상 활동 관리자
  location: 5성급 리조트, 몰디브
  results:
    - label: 매출 성장
      value: +40%
    - label: 비용 절감
      value: '-60%'
    - label: 투자 회수 기간
      value: 4개월
features:
  title: 리조트가 Afarer를 선택하는 이유
  subtitle: 상업용 등급의 내구성, 글로벌 물류 및 환대 산업을 이해하는 파트너.
  items:
    - title: 500회 이상의 대여 사이클
      description: 모든 보드는 염수, 자외선, 모래 환경에서 500회 이상의 렌탈 사이클을 견딜 수 있도록 테스트됩니다.
      icon: tabler:shield-check
    - title: 48시간 부품 출고
      description: 48시간 이내 교체 부품 배송 — 귀하의 렌탈 수익이 중단되지 않습니다.
      icon: tabler:truck-delivery
    - title: 맞춤 브랜딩
      description: 모든 보드에 맞춤 색상과 로고를 적용하여 리조트 아이덴티티를 연출하세요.
      icon: tabler:palette
    - title: 직원 교육
      description: 활동(액티비티) 팀을 위한 온라인 및 현장 교육 프로그램.
      icon: tabler:school
    - title: 글로벌 물류
      description: 합적 화물 옵션과 함께 50개국 이상으로 배송.
      icon: tabler:world
    - title: CE 인증
      description: 모든 장비 CE 인증, ISO 9001:2015 — 안전과 품질이 보장됩니다.
      icon: tabler:certificate
cta:
  title: Ready to upgrade your guest experience?
  subtitle: 리조트 패키지 견적을 받거나 완전한 리조트 카탈로그를 다운로드하십시오.
  actions:
    - text: 리조트 패키지 신청
      href: /contact?package=resort
      variant: primary
    - text: 리조트 카탈로그 다운로드
      href: /resources/download-catalog
      variant: secondary

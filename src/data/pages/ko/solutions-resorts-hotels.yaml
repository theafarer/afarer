meta:
  title: 리조트 SUP 플릿 솔루션 | {SITE}
  description: 리조트 및 호텔을 위한 완전한 SUP 편성 솔루션. 상업용 등급 보드, 맞춤 브랜딩, 스태프 교육 및 20대에서 100대 이상까지의 ROI 최적화 패키지.
hero:
  tagline: 리조트 및 호텔
  title: 워터프론트를 수익 센터로 바꾸세요<br />프리미엄 SUP 플릿으로
  subtitle: afarer는 전 세계 리조트에 상업용 급 공기주입식 SUP 플릿을 공급합니다 — 20대 규모의 스타터 패키지부터 100대 이상의 플래그십 프로그램까지. 맞춤 브랜딩, 직원 교육, 교체 부품이 포함됩니다.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 깨끗한 해변에서 SUP를 즐기는 리조트 투숙객
roi_section:
  title: 리조트 SUP 수익 모델
  subtitle: 리조트가 단일 투자로 연간 $50,000 - $200,000 이상의 SUP 렌탈 수익을 창출하는 방법.
  metrics:
    - metric: $50K–$200K+
      label: 연간 SUP 매출
      detail: 리조트별, 플릿 규모 및 객실 점유율 기준
    - metric: 4~6개월
      label: 평균 투자 회수 기간
      detail: 1시즌 내 전체 플리트 투자비 회수
    - metric: 40%
      label: 매출 증가
      detail: Afarer 플릿 전환 후 평균 매출 증가
    - metric: 500건 이상
      label: 보드당 렌탈 사이클 수
      detail: 일일 사용을 위한 상용 등급 내구성
packages:
  title: 리조트 패키지 시스템
  subtitle: 고객 수용 규모와 수익 목표에 맞는 패키지를 선택하세요. 모든 패키지에는 12개월 보증과 CE 인증이 포함됩니다.
  items:
    - name: 스타터 패키지
      tagline: 부티크 리조트용, 1일 최대 20명
      features:
        - SUP 보드 20장(성인/어린이용 3가지 사이즈)
        - 패들 20개(조절식)+구명조끼 20벌
        - 2WAY 펌프 4대(전동 옵션)
        - 보관 랙 2개+수리 키트
        - 보드에 맞춤 로고 인쇄
        - 12개월 보증 + CE 인증
      revenue: 연간 수익 잠재력 $50K–$80K
      cta_text: 스타터 패키지 받기
    - name: 프리미엄 패키지
      tagline: 대형 리조트용, 1일 50~100명
      features:
        - SUP 보드 50장(5가지 사이즈, 혼합 플릿)
        - 패들 50개 + 구명조끼 50개
        - 2WAY 펌프 10대+전동 펌프 2대
        - 보관 랙 5개+롤러 카트 2대
        - 풀 맞춤 브랜딩(보드, 패들, 백)
        - 직원 교육 세션(온라인)
        - 48시간 이내 교체 부품 출고
        - 12개월 보증 + CE 인증
      revenue: 연간 수익 잠재력 $120K–$200K+
      popular: true
      cta_text: 프리미엄 패키지 받기
    - name: 플래그십 패키지
      tagline: 울트라 프리미엄 리조트용, 1일 100명 이상
      features:
        - SUP 보드 100장 이상(전 사이즈 구비)
        - 풀 액세서리 세트(패들, 구명조끼, 펌프, 카트)
        - 현장 직원 교육(2일)
        - 전담 관리자
        - 우선 교체 부품 (24시간 내 출고)
        - 풀 맞춤 브랜딩(보드+액세서리)
        - 마케팅 사진/영상 패키지
        - 24개월 보증 + CE 인증
      revenue: 연간 $200K 이상의 매출 잠재력
      cta_text: 플래그십 패키지 구매
case_study:
  quote: 아페르로 전환한 이래, SUP 대여 수익이 40% 증가했으며, 보드 교체 비용은 60% 감소했습니다. 전체 함대 투자금을 4개월 만에 회수했습니다.
  author: 수상 활동 관리자
  location: 5성급 리조트, 몰디브
  results:
    - label: 매출 성장
      value: +40%
    - label: 비용 절감
      value: '-60%'
    - label: 투자 회수 기간
      value: 4개월
features:
  title: 리조트가 Afarer를 선택하는 이유
  subtitle: 상업용 등급의 내구성, 글로벌 물류 및 환대 산업을 이해하는 파트너.
  items:
    - title: 500회 이상의 대여 사이클
      description: 모든 보드는 염수, 자외선, 모래 환경에서 500회 이상의 렌탈 사이클을 견딜 수 있도록 테스트됩니다.
      icon: tabler:shield-check
    - title: 48시간 부품 출고
      description: 48시간 이내 교체 부품 배송 — 귀하의 렌탈 수익이 중단되지 않습니다.
      icon: tabler:truck-delivery
    - title: 맞춤 브랜딩
      description: 모든 보드에 맞춤 색상과 로고를 적용하여 리조트 아이덴티티를 연출하세요.
      icon: tabler:palette
    - title: 직원 교육
      description: 활동(액티비티) 팀을 위한 온라인 및 현장 교육 프로그램.
      icon: tabler:school
    - title: 글로벌 물류
      description: 합적 화물 옵션과 함께 50개국 이상으로 배송.
      icon: tabler:world
    - title: CE 인증
      description: 모든 장비 CE 인증, ISO 9001:2015 — 안전과 품질이 보장됩니다.
      icon: tabler:certificate

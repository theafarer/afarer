  title: 워터프론트를 수익 센터로 바꿀 준비가 되셨나요?
  subtitle: 리조트 패키지 견적을 받거나 완전한 리조트 카탈로그를 다운로드하십시오.
  actions:
    - text: 리조트 패키지 신청

hero:
  tagline: 품질 관리 연구소
  title: 시험 연구소 및 품질 보증
  subtitle: ISO 9001 프로세스를 갖춘 독립 품질 실험실 — 모든 제품이 출하 전 테스트 완료
intro: afarer는 생산과 독립적으로 운영되는 전담 품질 관리 실험실을 운영하고 있습니다. 모든 원자재 배치와 완제품 보트는 출하 전 문서화된 검사 프로토콜을 거칩니다. QC 팀은 경영진에게 직접 보고하여 공정한 품질 결정을 보장합니다.
highlights:
  - value: 100%
    label: 내압 시험 완료된 유닛
    detail: 모든 챔버, 모든 보트
  - value: 48 h
    label: 공기 유지 시험 시간
    detail: 1.25× 정격 압력 기준
  - value: '&lt;5%'
    label: 최대 허용 압력 강하
    detail: 24시간 이상 보관 기간
  - value: AQL 2.5
    label: 중대 결함 기준
    detail: ISO 2859 샘플링 기준
test_procedures:
  - title: 원자재 검사
    description: PVC, Hypalon, 드롭스티치 원단, 하드웨어 등 모든 입고 배치는 승인 전에 테스트됩니다. 인장 강도(ASTM D751), 내파성(ISO 4674), 내UV성이 검증되며, 부적합 자재는 격리 후 반송됩니다.
    standards:
      - ASTM D751 (인장)
      - ISO 4674 (인열)
      - ISO 4892 (UV)
  - title: 공정 중 품질 관리 체크포인트
    description: 생산 작업자는 각 공정 단계에서 자체 점검을 실시합니다. QC 감사관은 교대 근무 내내 무작위 샘플링을 수행합니다. 용접 박리 테스트는 50개 유닛마다, 치수 검사는 20번째 패널마다 실시됩니다.
    standards:
      - ASTM D751 (박리)
      - 내부 100점 체크리스트
      - ISO 2859 샘플링
  - title: 48시간 공기 유지 테스트
    description: 모든 튜브 챔버는 정격 압력의 125%로 팽창되어 48시간 동안 유지됩니다. 압력 센서는 온도 보상과 함께 연속적으로 기록됩니다. 압력 강하가 5%를 초과하는 챔버는 자동으로 배치 재검사를 받습니다.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: 하중 및 균형 테스트
    description: 완성된 보트는 최대 정격 용량에서 안정성, 갑판 높이 및 조작성을 시험합니다. 각 선박은 최종 검사 승인 전 수중 시험을 거칩니다.
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: Universal Testing Machine (tensile)
    spec: 5 kN, ASTM D751 규격 충족
  - name: Pressure Decay Tester
    spec: 다채널, 0—0 psi, 데이터 로깅
  - name: UV Weathering Chamber
    spec: ISO 4892, 1,000시간 사이클
  - name: Thickness Gauge (digital)
    spec: 0.01mm 해상도
  - name: Peel Tester (weld)
    spec: 모터 구동, 50N 용량
  - name: Temperature Chamber
    spec: '-40°C ~ +100°C'
  - name: Leak Detection Tank
    spec: 6m × 2m, 조명 시설 포함

meta:
  title: '견적 요청 — OEM SUP 생산 | {SITE}'
  description: '팽창식 SUP 또는 보트 프로젝트에 대한 상세 견적을 요청하세요. OEM/ODM 생산, 자체 브랜드, 맞춤 함대 — 영업일 기준 2일 이내 답변.'
  keywords:
    - 'SUP 견적 요청'
    - 'OEM 패들보드 견적'
    - 'SUP 공장 견적'
    - '팽창식 SUP 가격'
hero_text:
  tagline: 견적 받기
  title: 귀하의 프로젝트에 대한<br />견적 요청
  subtitle: 귀하의 요구 사항을 알려주시면 저희 팀에서 영업일 기준 2일 이내에 자세한 견적을 보내드리겠습니다.
steps2_process:
  title: 이용 방법
  subtitle: 문의부터 견적까지 간단한 4단계.
  items:
    - title: '1단계: 요구사항 제출'
      description: 아래 양식에 제품 유형, 수량, 사양을 입력하세요. 자세한 내용을 제공할수록 견적이 더 정확해집니다.
      icon: tabler:file-text
    - title: '2단계: 검토 및 자문'
      description: 당사 엔지니어링 팀은 귀하의 요구 사항을 검토한 후 확인을 위해 귀하에게 연락할 수 있습니다. 제품 구성 및 옵션에 대한 권장 사항을 제공합니다.
      icon: tabler:users
    - title: '3단계: 견적 받기'
      description: 단가, MOQ, 리드타임, 결제 조건, 배송 옵션을 포함한 자세한 견적을 받아보실 수 있습니다. 일반적으로 48시간 이내입니다.
      icon: tabler:currency-dollar
    - title: '4단계: 샘플 & 생산'
      description: 견적 승인 후 샘플 제작(해당되는 경우)을 진행하거나 직접 대량 생산을 진행합니다. 프로세스 전반에 걸쳐 정기적인 업데이트가 이루어집니다.
      icon: tabler:building-factory
content_form:
  tagline: 견적 의뢰서
  title: 귀하의 프로젝트에 대해 알려주십시오
  subtitle: '*가 있는 모든 필드는 필수입니다.'
  contact_fields:
    firstName: 이름
    lastName: 성
    companyName: 회사명
    email: 이메일
  fields:
    - name: 제품 카테고리
      type: select
      options:
        - SUP 보드
        - 인플래터블 SUP
        - 인플래터블 SUP 보드
        - 구명조끼
        - 마린 액세서리
        - 커스텀 OEM/ODM
    - name: 용도
      type: select
      options:
        - 다이빙 센터
        - 낚시
        - 해양 관광 / 리조트
        - 수색 및 구조
        - 요트 텐더
        - 상용 작업선
        - 정부 / 군사
        - OEM / 프라이빗 라벨
        - 개인/레저용
        - 기타
    - name: 수량
      type: text
      placeholder: '예: 50개'
    - name: 목표 시장
      type: text
      placeholder: '예: 유럽, 북미, 중동'
    - name: 배송 국가
      type: text
      placeholder: '예: 이탈리아, UAE, 미국, 호주'
    - name: 소재 선호
      type: select
      options:
        - 선호 없음
        - 마린 등급 PVC(1100 dtex)
        - 프리미엄 하이퍼론 / CSM
        - 유리섬유 선체
        - 알루미늄 선체
    - name: 엔진 요구사항
      type: text
      placeholder: '예: 60HP 아웃보드, 엔진 미장착, 트윈 115HP'
    - name: 커스터마이징 요구사항
      type: text
      placeholder: '예: 맞춤 색상, 브랜딩/로고, 패키징, 특수 장비'
    - name: 납품 일정
      type: text
      placeholder: '예: 90일 이내 납품'
    - name: 추가 요구사항
      type: textarea
      placeholder: 응용 분야, 기술 사양 또는 특별한 요구사항을 설명해 주세요 — 참고 도면, 사양 또는 링크가 있으면 포함해 주세요.
    - name: 사양서 업로드
      type: file
      placeholder: 사양 시트, 도면 또는 참고 문서를 업로드하십시오 (PDF, DWG, DXF)
    - name: 로고/아트워크 업로드
      type: file
      placeholder: 맞춤 브랜딩을 위해 로고 또는 아트워크를 업로드하세요 (AI, EPS, PNG)
cta:
  title: 이메일로 상담을 원하시나요?
  subtitle: 영업 팀에 직접 문의해 주시면 24시간 이내에 응답하겠습니다.
  actions:
    - variant: primary
      text: 이메일로 직접 문의하기
      href: /contact

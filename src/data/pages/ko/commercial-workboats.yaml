faqs:
  - question: afarer는 어떤 유형의 상업용 작업선을 제조합니까?
    answer: afarer는 순찰 및 보안, 다이빙 지원, 수로 측량, 운송 및 해상 물류를 위한 팽창식 작업선을 제조합니다.
  - question: afarer 상업용 작업선에는 어떤 재료가 사용됩니까?
    answer: 해양 등급 Hypalon(CSM/Neoprene)과 고인장 PVC를 다층 코팅과 함께 사용합니다.
  - question: afarer는 특정 상업용 응용 분야에 맞게 작업선을 맞춤 제작할 수 있습니까?
    answer: 예 — 맞춤형 튜브 레이아웃, 강화 러빙 스트레이크 및 장비 통합을 포함한 완전한 OEM/ODM 서비스를 제공합니다.
  - question: afarer 작업선은 어떤 인증을 보유하고 있습니까?
    answer: 모든 표준 모델은 CE 인증을 보유합니다. 당사 공장은 인증을 받았습니다.
  - question: afarer는 상업 운영자를 위한 함대 가격을 제공합니까?
    answer: 예. 함대 및 다중 유닛 주문에 대해 계층별 가격을 제공합니다.
body: |-
  <h2>상업용 해양 환경을 위해 제작됨</h2>
  <p>상업용 작업선은 레크리에이션 등급 장비를 빠르게 압도할 수 있는 조건에서 작동합니다. 긴 작업 시간, 무거운 페이로드, 반복적인 접안, 연료 및 화학물질 노출, 원격 또는 해상 환경에서의 작업은 진정한 상업용 등급 제조만이 제공할 수 있는 구조적 무결성 수준을 요구합니다.</p>
  <p>afarer 인플레이터블 보트는 이러한 까다로운 용도에 맞게 특별히 설계되고 제작됩니다. 중국 칭다오에 위치한 12,000 m²  & CE 인증 공장은 전 세계 상업 운영자의 엄격한 요구 사항을 충족하는 작업선을 생산합니다.</p>

  <h2>재료 과학: 상업용 등급 내구성</h2>
  <p>상업용 작업선의 기반은 재료 구조입니다. afarer는 생산 승인 전에 각각 철저한 테스트를 거친 프리미엄 등급의 패브릭과 구성 요소만 선택합니다.</p>
  <ul>
    <li><strong>Hypalon (CSM/Neoprene):</strong> 극한 사용 상업용 응용 분야를 위한 당사의 선호 재료. UV, 화학물질(연료, 오일, 배기가스), 마모 및 극한 온도에 대한 우수한 저항성. 적절한 유지보수 시 20년 이상의 사용 수명.</li>
    <li><strong>고인장 PVC:</strong> 무게 절감이 중요한 응용 분야용. 10년 이상을 보장하는 확장된 UV 보호 기능을 갖춘 해양 등급 PVC. 최대 접합 강도를 위한 열용접 이음매.</li>
    <li><strong>강화 패브릭:</strong> 다층 폴리에스터 또는 나일론 베이스 패브릭이 뛰어난 인열 강도와 내천공성을 제공합니다.</li>
    <li><strong>프리미엄 접착제:</strong> 가수분해 및 환경 분해에 강한 해양 특수 접착제.</li>
  </ul>

  <h2>설계 철학: 임무 특화 성능을 위해 설계됨</h2>
  <p>모든 afarer 상업용 작업선은 운영 환경에 대한 명확한 이해를 바탕으로 설계됩니다. 당사의 엔지니어링 팀은 상업 운영자와 직접 협력하여 특정 임무 프로필에서 탁월한 성능을 발휘하는 선박을 개발합니다.</p>

  <h3>순찰 및 보안 보트</h3>
  <p>뛰어난 핸들링과 안정성을 갖춘 지속적인 고속 운항을 위해 설계되었습니다. 반복적인 좌초에 대비한 강화 선체, 헤비듀티 러빙 스트레이크, 승무원 인체공학과 장비 통합에 최적화된 콘솔 구성 등의 기능을 갖추고 있습니다.</p>

  <h3>다이빙 지원 선박</h3>
  <p>쉽게 접근할 수 있는 튜브 설계, 장비 데크, 탱크 랙 및 다이빙 사다리 시스템으로 구성됩니다. 정박 중 안정성이 운항 성능과 함께 우선시됩니다. 장비 고정을 위한 다중 D-링과 타이다운 지점.</p>

  <h3>측량 및 연구 플랫폼</h3>
  <p>수로 측량, 환경 모니터링 및 과학 연구를 위한 조용하고 안정적인 플랫폼. 낮은 항적 선체 설계로 데이터 수집 중 교란을 최소화합니다. 맞춤형 콘솔 레이아웃으로 전자 장치와 계측기를 수용합니다.</p>

  <h3>유틸리티 및 인원 운송</h3>
  <p>해안, 정박 선박 및 해상 시설 사이에서 승무원, 보급품 및 장비를 운송하는 실용 선박. 안정적이고 예측 가능한 핸들링과 높은 페이로드 용량.</p>

  <h2>제조 우수성</h2>
  <p>상업용 작업선 제조는 레크리에이션 기준을 초과하는 정밀도와 일관성을 요구합니다. afarer의 생산 시설 특징:</p>
  <ul>
    <li>일관된 패널 치수를 위한 서브밀리미터 정밀도의 자동 CNC 절단기</li>
    <li>고강도 기밀 이음매를 생성하는 RF 유전체 용접 프레스</li>
    <li>튜브 접합용 열풍 열 밀봉 장비</li>
    <li>각 제조 단계의 전담 품질 관리</li>
    <li>완성된 모든 선박의 100% 공기 유지 및 이음매 박리 테스트</li>
  </ul>

  <h2>품질 보증 및 인증</h2>
  <p>모든 afarer 상업용 작업선은 납품 전에 포괄적인 테스트를 거칩니다:</p>
  <ul>
    <li>운영 한계를 초과하는 압력 테스트</li>
    <li>이음매 박리 검증</li>
    <li>내UV성 검증</li>
    <li>내마모성 테스트</li>
    <li>부력 및 적재 용량 검증</li>
    <li>전체 시스템 점검 및 해상 시운전</li>
  </ul>
  <p>상업 운영자는 선적 전에 제3자 검사(SGS, BV)를 요청할 수 있습니다. 테스트 보고서, 재료 인증서 및 적합성 선언을 포함한 전체 문서 패키지가 모든 선박과 함께 제공됩니다.</p>

  <h2>상업 운영자를 위한 OEM/ODM 파트너십</h2>
  <p>afarer는 상업용 작업선 운영자, 정부 기관 및 해양 장비 유통업체를 위한 포괄적인 OEM/ODM 서비스를 제공합니다:</p>
  <ul>
    <li><strong>맞춤 설계:</strong> 운영 요구 사항에 맞게 설계된 임무 특화 구성</li>
    <li><strong>함대 브랜딩:</strong> 전체 함대에 걸친 일관된 도장 및 식별</li>
    <li><strong>대량 생산:</strong> 상업 사양의 경우 최소 주문 수량 5대</li>
    <li><strong>글로벌 물류:</strong> 자체 화물 관리로 FOB 칭다오, CIF, DDP 제공</li>
    <li><strong>애프터 세일즈 지원:</strong> 글로벌 파트너 네트워크를 통한 기술 문서, 예비 부품 및 보증 서비스</li>
  </ul>

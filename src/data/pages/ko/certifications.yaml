hero:
  tagline: 인증 및 표준
  title: 품질 인증<br />및 규정 준수 표준
  subtitle: afarer 제품은 국제 해양 안전 표준, 품질 관리 시스템 및 환경 규정을 준수하여 제조됩니다.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarer 품질 인증 및 규격 준수 문서
content_certifications:
  tagline: 우리의 인증
  title: 인증된 품질,<br />세계적으로 인정받는 제품
  subtitle: 모든 afarer 제품은 품질, 안전 및 환경적 책임에 대한 약속을 입증하는 인증으로 뒷받침됩니다.
  items:
    - title: CE 인증
      description: 모든 afarer 제품은 레저용 선박에 대한 유럽 CE 마크 요구 사항을 준수하여 안전, 건강 및 환경 보호 표준을 충족합니다.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: 당사의 품질 관리 시스템은 ISO 9001:2015 인증을 받았으며 팽창식 선박 및 해양 장비의 설계, 제조 및 유통을 다루고 있습니다.
      icon: tabler:clipboard-check
    - title: UKCA 마크 취득
      description: 영국 시장에서 판매되는 제품에는 해양 장비 및 개인 선박에 대한 영국 규정 준수를 확인하는 UKCA 표시가 있습니다.
      icon: tabler:shield
    - title: BSCI 준수
      description: afarer는 BSCI(비즈니스 사회 준수 이니셔티브) 감사를 받아 윤리적인 제조 관행, 공정한 노동 조건 및 공급망 책임을 입증합니다.
      icon: tabler:heart-handshake
    - title: REACH 적합
      description: afarer 제품에 사용되는 모든 재료는 화학 안전에 대한 EU REACH 규정을 준수하여 PVC, Hypalon 또는 구성 요소에 제한 물질이 없음을 보장합니다.
      icon: tabler:flask
    - title: 소재 테스트
      description: 직물은 인장 강도, 인열 저항성, UV 분해 및 저온 균열 성능에 대한 테스트를 거칩니다. 모든 생산 배치는 샘플링되고 검증됩니다.
      icon: tabler:test-pipe
content_factory:
  tagline: 공장 표준
  title: 제조 우수성<br />—사양에 맞춰 제작
  subtitle: 12,000m² 규모의 당사 시설은 생산의 모든 단계에서 엄격한 품질 관리 프로토콜에 따라 운영됩니다.
  list:
    - '입고 자재 검사: 모든 원자재(PVC 원단, 하이프론, 알루미늄, 합판, 접착제)는 생산 투입 전 사양에 따라 테스트를 거칩니다.'
    - '공정 중 품질 관리: 모든 생산 단계에 문서화된 QC 체크포인트가 있습니다. 용접 강도, 이음매 정렬, 밸브 설치, 피팅 토크가 인라인에서 검증됩니다.'
    - '압력 테스트: 모든 공기 주입 챔버는 정격 압력의 1.5배에서 24시간 동안 압력 테스트를 받습니다. 합격 기준은 누출률이 제로여야 합니다.'
    - '최종 검사: 완제품은 출하 전 치수 정확도, 외관 마감, 액세서리 완비 및 포장 무결성에 대해 검사됩니다.'
    - '배치 추적성: 모든 제품은 생산 배치 기록과 연결된 시리얼 번호를 가지고 있어 원자재부터 완제품까지 완전한 추적이 가능합니다.'
content_safety:
  tagline: 해양 안전 표준
  title: 안전 제일<br />—신뢰할 수 있는 작동을 위한 설계
  subtitle: afarer 제품은 상업 및 레크리에이션 용도에 대한 국제 해양 안전 표준을 충족하도록 설계되고 테스트되었습니다.
  items:
    - title: ISO 6185
      description: 풍선 보트는 구조, 안정성, 부력 및 적재 용량에 대한 ISO 6185 표준을 준수합니다.
      icon: tabler:sailboat
    - title: ABYC 규격
      description: 전기 시스템과 연료 시스템은 안전한 설치 및 작동을 위해 ABYC(American Boat & Yacht Council) 표준을 따릅니다.
      icon: tabler:bolt
    - title: SOLAS 인증
      description: 안전 장비 및 구명 장비는 해당되는 경우 SOLAS(해상에서의 생명 안전) 요구 사항을 충족합니다.
      icon: tabler:lifebuoy
cta:
  title: 귀하의 프로젝트에 인증된 제품이 필요하십니까?
  subtitle: 귀하의 시장에 대한 인증 요구 사항, 문서 및 규정 준수에 대해 논의하려면 당사 팀에 문의하십시오.
  actions:
    - variant: primary
      text: 인증서류 요청
      href: /contact
    - text: 품질 페이지 보기
      href: /quality

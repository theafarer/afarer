meta:
  title: SUP 두께 선택 방법 — 엔지니어링 분석 | {SITE}
  description: '팽창식 SUP 보드 두께에 관한 기술 가이드: 4인치, 5인치, 6인치 보드가 강성, 무게, 안정성, 트래킹 및 성능에서 어떻게 다른지. 투어링, 요가, 서핑, 레이싱, 올라운드 패들링을 위한 두께 권장 사항.'
back_text: 연구로 돌아가기
hero:
  tagline: 엔지니어링
  title: SUP 두께 선택 방법 — 공학적 분석
  subtitle: 6분 읽기
content_html: "<h2>세 가지 표준 두께</h2>\n\n<h3>4\" (10 cm) – 투어 &amp; 퍼포먼스</h3>\n<ul>\n  <li>최고 강성 – 하중 시 부하가 적은 벤딩</li>\n  <li>가장 가볍다 – 자재 적게, 기하 부피 적게</li>\n  <li>훌륭한 트래킹 – 좌우 흔들림 감소</li>\n  <li>가장 빠르다 – 저항 감소, 부드러운 글라이드</li>\n  <li>추천 용도: 투어, 레이스, 피트니스 패들링, 숙련 패들러</li>\n</ul>\n\n<h3>5\" (12.7 cm) – 올어라운드</h3>\n<ul>\n  <li>좋은 강성 – 부하와 강성의 균형</li>\n  <li>적당한 중량 – 표준 자재 사용</li>\n  <li>좋은 1차 + 2차 안정성</li>\n  <li>추천 용도: 레저 패들링, 초보자, 일상적인 호수 및 강 사용</li>\n</ul>\n\n<h3>6\" (15.2 cm) – 안정성 &amp; 요가</h3>\n<ul>\n  <li>최고 1차 안정성 – 막대한 부력</li>\n  <li>무겁다 – 더 많은 PVC 자재, 더 큰 기하 부피</li>\n  <li>가장 느리다 – 더 많은 저항, 글라이드 유지 어려움</li>\n  <li>추천 용도: 요가/피트니스, 고중량 패들러 (100kg 이상), 거친 환경</li>\n</ul>\n\n<h2>공학적 분석</h2>\n<p>인플레이터블 SUP의 강성은 내부 기압과 보드 단면의 관성 모멘트에 의해 좌우되며, 20 PSI에서 4\" 보드는 같은 너비와 길이의 6\" 보드보다 약 30% 적은 하중 하부하를 보입니다. 1차 안정성은 수선면 너비와 부력에 의해 발생하며, 2차 안정성은 레일 형태와 보드 너비에 영향을 받습니다.</p>\n\n<h2>패들러 중량별 두께</h2>\n<table class=\"w-full text-sm border-collapse\">\n  <thead>\n    <tr class=\"bg-gray-100\">\n      <th class=\"p-3 text-left font-semibold text-gray-900 border\">패들러 중량</th>\n      <th class=\"p-3 text-left font-semibold text-gray-900 border\">추천 두께</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td class=\"p-3 border\">65kg 이하 (143 lbs)</td><td class=\"p-3 border\">4\"</td></tr>\n    <tr><td class=\"p-3 border\">65 – 90kg (143 – 198 lbs)</td><td class=\"p-3 border\">5\"</td></tr>\n    <tr><td class=\"p-3 border\">90 – 115kg (198 – 253 lbs)</td><td class=\"p-3 border\">5\" 또는 6\"</td></tr>\n    <tr><td class=\"p-3 border\">115kg 이상 (253 lbs)</td><td class=\"p-3 border\">6\"</td></tr>\n  </tbody>\n</table>\n\n<h2>두께 vs. PSI 트레이드오프</h2>\n<p>높은 PSI로 과도한 두께를 보충할 수 있다는 것은 흔한 오해입니다. 25 PSI에서 6\" 보드는 15 PSI에서 4\" 보드보다 더 많은 부하를 보이며, 이는 단면 관성 모멘트가 강성 공식에서 지배적이기 때문입니다. 퍼포먼스를 중시하는 패들러에게는 낮은 압력의 얇은 보드가 높은 압력의 두꺼운 보드보다 우수합니다.</p>\n\n<h2>Afarer 라인업</h2>\n<ul>\n  <li><strong>4\" 보드:</strong> Cheetah Touring 시리즈 – 12' x 30\" x 4\" 퍼포먼스 및 장거리 패들링용 투어 SUP</li>\n  <li><strong>5\" 보드:</strong> Cheetah All-Round 시리즈 – 10'6\" x 32\" x 5\" 레저용</li>\n  <li><strong>6\" 보드:</strong> Cheetah Ultra-Stable 시리즈 – 10' x 34\" x 6\" 요가, 고중량 패들러, 촬영 플랫폼용</li>\n</ul>\n<p>모든 보드는 1,680 DTEX 드롭스티치 코어, 20 PSI 정격 압력, 1.2mm PVC 라미네이트를 사용합니다.</p>\n"

meta:
  title: B2B 리소스 및 다운로드 | {SITE}
  description: 인플레이터블 SUP 비즈니스를 위한 OEM 제조 가이드, 제품 카탈로그, 품질 보고서, ROI 계산기를 다운로드하세요.
hero:
  tagline: 리소스 센터
  title: 도구 및 리소스<br />SUP 비즈니스 파트너를 위한
  subtitle: OEM 가이드, 제품 카탈로그, 품질 보고서를 다운로드하고 ROI 계산기를 사용하여 SUP 선단 투자를 계획하세요.
resources:
  - title: 2026 OEM/ODM 제품 카탈로그
    description: 사양, 가격대, MOQ 및 B2B 파트너를 위한 커스텀 옵션이 포함된 완전한 제품 라인업.
    icon: tabler:file-text
    type: catalog
    link: /media
    cta: 카탈로그 다운로드
  - title: 프라이빗 라벨 SUP 브랜드 가이드
    description: 자체 SUP 브랜드 론칭 단계별 가이드 — 시장 조사 및 디자인부터 생산 및 글로벌 배송까지.
    icon: tabler:book
    type: guide
    link: /news/private-label-sup-oem-guide
    cta: 가이드 읽기
  - title: SUP fleet ROI 계산기
    description: 인터랙티브 계산기를 통해 리조트 또는 클럽의 SUP 플릿 투자, 예상 수익 및 투자 회수 기간을 산출해 보세요.
    icon: tabler:calculator
    type: tool
    link: '#roi-calculator'
    cta: ROI 계산
  - title: 품질 및 인증 보고서
    description: CE 인증 문서, ISO 9001 품질 관리, UV 노화 테스트 결과, 압력 유지 테스트 데이터.
    icon: tabler:certificate
    type: report
    link: /evidence
    cta: 보고서 보기
  - title: 공장 역량 브로슈어
    description: 생산 라인 상세 사양 및 품질 관리 프로세스를 포함한 12,000 m² 제조 시설 가상 투어.
    icon: tabler:building-factory
    type: brochure
    link: /factory
    cta: 공장 방문
  - title: 리조트 플리트 수익 가이드
    description: 5성급 리조트의 실제 사례 연구 결과를 반영한 상용 SUP 플리트 ROI 분석, 가격 모델 및 가동률 포함.
    icon: tabler:chart-bar
    type: guide
    link: /news/commercial-sup-fleet-roi-resorts
    cta: 가이드 읽기
cta:
  title: 올바른 리소스를 찾는 데 도움이 필요하십니까?
  subtitle: 제품 선택, OEM 파트너십 또는 기술 사양에 대한 맞춤형 안내를 받으려면 당사 팀에 문의하세요.
  button: 영업팀 문의
  link: /contact?source=resources

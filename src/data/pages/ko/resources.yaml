hero_text:
  tagline: Resources
  title: '센터 및 구매자 가이드 다운로드'
  subtitle: '정보에 입각한 조달 결정을 내리는 데 도움이 되는 제품 카탈로그, OEM 가이드, 구매자 체크리스트 및 기술 문서에 액세스하세요.'
features3_downloads:
  tagline: Downloads
  title: '제품 문서<br />및 구매자 리소스'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'SUP 보트, 풍선 보트, SUP 보드, 카약 및 액세서리를 포함한 전체 제품 범위. 사양, 구성 및 옵션. PDF 형식.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'OEM/ODM 파트너십에 대해 알아야 할 모든 것: 프로세스 개요, 최소 주문 수량, 사용자 정의 옵션, 품질 관리 및 배송.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: '올바른 RIB를 선택하는 방법: 선체 재료, 튜브 재료, 엔진 선택, 크기 고려 사항 및 다양한 응용 분야에 대한 구성 옵션.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'SUP 보드 제조업체를 선택할 때 주요 고려 사항: 품질 지표, 인증 요구 사항, MOQ 고려 사항 및 공장 감사에서 찾아야 할 사항.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC 대 Hypalon: 다양한 해양 응용 분야에 대한 내구성, UV 저항성, 수명, 수리 옵션 및 비용 고려 사항 비교.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: '제품 개요 템플릿을 다운로드하세요. 요구 사항을 작성하고 같은 주 견적 및 타당성 평가를 위해 당사에 보내주십시오.'
      icon: tabler:template
faqs:
  title: '자주 묻는 질문'
  subtitle: '제품, 제조 프로세스, 파트너십 모델에 대한 일반적인 질문입니다.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ는 제품 카테고리에 따라 다릅니다. SUP 보트는 일반적으로 모델당 10개부터 시작됩니다. 50개 단위의 SUP 보드. 제품별 MOQ 정보는 영업팀에 문의하세요.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: '예. afarer는 대량 생산 전 평가를 위한 샘플 생산을 제공합니다. 샘플 비용은 협상 가능하며 첫 번째 생산 주문에 반영되는 경우가 많습니다.'
      icon: tabler:package
    - title: What payment terms are available?
      description: '표준 조건은 주문 시 보증금 30%, 배송 전 70%입니다. 적격 고객에게 LC 조건이 제공됩니다. 준비에 대해 논의하려면 재무팀에 문의하세요.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: '일반적인 리드 타임: SUP 보트 30-45일, SUP 보드 20-30일, 풍선 보트 25-35일. 맞춤형 개발에는 프로토타입 제작에 15~30일이 추가됩니다.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'EU 시장에 대한 CE 인증, 미국 해안 경비대 승인 제조, ISO 품질 시스템, BSCI 준수 및 REACH 재료 준수.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: '예. 우리는 귀하의 로고, 색상 및 브랜드 아이덴티티를 담은 맞춤형 포장을 제공합니다. 맞춤형 포장에 대한 MOQ는 제품 카테고리에 따라 다릅니다.'
      icon: tabler:color-swatch
cta:
  title: '올바른 리소스를 찾는 데 도움이 필요하십니까?'
  subtitle: '제품 선택, OEM 파트너십 또는 기술 사양에 대한 맞춤형 안내를 받으려면 당사 팀에 문의하세요.'
  actions:
    - variant: primary
      text: '우리 팀에 문의하세요'
      href: /contact

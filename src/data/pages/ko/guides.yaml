hero:
  tagline: 가이드
  title: SUP가 처음이신가요?
  subtitle: 인플레이트 SUP 보드를 선택하고, 사용하고, 즐기는 데 도움이 되는 실용적인 가이드.
size_guide:
  tagline: 크기 및 사양
  title: 귀하의 요구에 맞는 적절한 크기를 찾아보십시오
  desc: SUP 보드 치수, 하중 용량, 권장 용도를 비교해 보세요. 투어링 SUP, 요가 보드, 올라운드 SUP 중 어떤 것이든 — 사이즈 가이드가 적합한 선택을 도와드립니다.
  link_label: 제품 사양이 포함된 전체 사이즈 가이드 →
  link: /size-guide
  cards:
    - title: SUP 보드
      desc: 체중과 사용 용도에 따라 길이를 선택하세요. 더 넓은 보드(32"+)는 안정성이 더 높고, 더 긴 보드(11—2 ft)는 투어링 시 직진성이 더 좋습니다.
    - title: 투어링 SUP
      desc: 더 긴 보드(11~12피트)로 장거리 이동과 직선 주행이 가능합니다. 장비를 실은 투어링에 충분히 안정적입니다. 항상 중량 용량을 확인하세요.
    - title: 올라운드 SUP
      desc: 라이더 체중과 용도에 따라 길이를 선택하세요. 안정성을 위해 더 넓은 보드(32인치 이상)를 추천합니다. 레저와 피트니스에 다양하게 활용할 수 있습니다.

hero_text:
  tagline: 문의하기
  title: 문의하기
contact_form:
  id: form
  title: 메시지 보내기
  subtitle: 견적, 기술 문의 또는 제휴 문의는 이곳으로 보내주세요. 1영업일 이내에 답변드립니다.
  email_to: info@afarer.com
  submit_button: 메시지 보내기
  success_message: 감사합니다! 메시지를 받았습니다. 1영업일 이내에 답변드리겠습니다.
  error_message: 메시지 전송 중 오류가 발생했습니다. 다시 시도하거나 직접 이메일을 보내주세요.
  default_country_code: '+1'
  captcha:
    label: '안티스팸: 다음 문제를 풀어주세요'
  fields:
    - name: firstName
      label: 이름
      row: 1
    - name: lastName
      label: 성
      row: 1
    - name: companyName
      label: 회사명
      row: 2
    - name: address
      label: 주소
      row: 3
    - name: zip
      label: 우편번호
      row: 4
    - name: country
      label: 국가
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: 이메일
      row: 5
      type: email
    - name: tel
      label: 전화번호
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: 예상 주문 수량
      row: 6
      type: select
      options:
        - value: ''
          label: 예상 수량을 선택하세요...
        - value: sample
          label: 샘플 / 프로토타입만
        - value: '5-10'
          label: 50–100개 (표준 MOQ)
        - value: '100-500'
          label: 100–500개
        - value: '500-plus'
          label: 500+개 (볼륨 가격)
    - name: customization
      label: 맞춤 제작이 필요하십니까?
      row: 7
      type: select
      options:
        - value: ''
          label: 맞춤 유형을 선택하세요...
        - value: none
          label: 표준 제품 (맞춤 없음)
        - value: logo
          label: 로고 / 브랜딩만 맞춤
        - value: full
          label: 전체 OEM (크기, 색상, 그래픽, 포장)
        - value: consultation
          label: 잘 모르겠음 — 상담 필요
    - name: productInterest
      label: 관심 제품 카테고리
      row: 8
      type: select
      options:
        - value: ''
          label: 제품 카테고리를 선택하세요...
        - value: all
          label: 모든 제품 / 전체 카탈로그
        - value: sup
          label: SUP 보드 / 패들보드
        - value: SUP
          label: 팽창식 카약
        - value: SUP
          label: SUP 보트
        - value: SUP
          label: 딩기 / 텐더
        - value: safety
          label: 안전 장비 / 구명조끼
        - value: accessory
          label: 액세서리 (펌프, 노, 가방)

    - name: subject
      label: 제목
      row: 9
    - name: message
      label: 메시지
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: 다른 연락 방법
  columns: 3
  items:
    - title: 영업 문의
      description: 견적, 설정, 딜러 신청, 대량 주문.
      icon: tabler:shopping-bag
    - title: 기술 지원
      description: 보증, 수리, 부품, 운영 관련 질문.
      icon: tabler:tool
    - title: 언론 및 제휴
      description: 미디어 키트, 스폰서십, 업계 협업.
      icon: tabler:news
    - title: 전화
      description: '+86 13305324192'
      icon: tabler:headset
    - title: 이메일
      description: info@afarer.com
      icon: tabler:mail
    - title: 본사
      description: Economic Development Zone, Laixi, Qingdao, China, 266600
      icon: tabler:map-pin
map:
  title: 위치
  subtitle: 본사로 방문해 주세요
  address: Economic Development Zone, Laixi, Qingdao, China, 266600
  zoom: 15

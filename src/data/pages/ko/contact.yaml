meta:
  title: '문의하기 — 파트너십 및 제품 문의 | {SITE}'
  description: '파트너십, 공동 브랜드 및 자체 라벨 문의, 전문 함대에 대해 afarer에 문의하세요. 팽창식 SUP 보드·보트 제조사, 영업일 기준 2일 이내 답변.'
  keywords:
    - 'afarer 문의'
    - 'SUP 유통사 견적'
    - '전문 SUP 공급업체'
    - 'SUP 제조사 문의'
hero_text:
  tagline: 문의하기
  title: 우리 팀에 문의하세요
contact_form:
  id: form
  title: 메시지 보내기
  subtitle: 견적, 기술 문의 또는 제휴 문의는 이곳으로 보내주세요. 1영업일 이내에 답변드립니다.
  email_to: info@afarer.com
  submit_button: 문의 보내기 → 견적 받기
  success_message: 감사합니다! 메시지를 받았습니다. 1영업일 이내에 답변드리겠습니다.
  error_message: 메시지 전송 중 오류가 발생했습니다. 다시 시도하거나 직접 이메일을 보내주세요.
  default_country_code: '+1'
  captcha:
    label: '안티스팸: 다음 문제를 풀어주세요'
  fields:
    - name: country
      label: 국가
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: 예상 주문 수량
      row: 2
      type: select
      options:
        - value: ''
          label: 예상 거래량을 선택하세요...
        - value: sample
          label: 샘플/프로토타입만
        - value: '5-10'
          label: 5–10대 (표준 MOQ)
        - value: '100-500'
          label: 100–500대
        - value: '500-plus'
          label: 500대 이상 (대량 구매 할인)
      step: 1
    - name: customization
      label: 맞춤 제작이 필요하십니까?
      row: 3
      type: select
      options:
        - value: ''
          label: 맞춤 유형 선택...
        - value: none
          label: 표준 제품 (맞춤 제작 없음)
        - value: logo
          label: 맞춤 로고/브랜딩 전용
        - value: full
          label: 풀 공동 브랜드(사이즈, 색상, 그래픽, 패키징)
        - value: consultation
          label: 확실하지 않음 — 상담 필요
      step: 1
    - name: productInterest
      label: 관심 제품 카테고리
      row: 4
      type: select
      options:
        - value: ''
          label: 제품 카테고리 선택...
        - value: all
          label: 전체 제품 / 전체 카탈로그
        - value: sup
          label: SUP 보드 / 패들보드
        - value: safety
          label: 안전 장비 / 구명 조끼
        - value: accessory
          label: 액세서리(펌프, 패들, 가방)
      step: 1
    - name: firstName
      label: 이름
      row: 1
      step: 2
    - name: lastName
      label: 성
      row: 1
      step: 2
    - name: companyName
      label: 회사명
      row: 2
      step: 2
    - name: email
      label: 이메일
      row: 3
      type: email
      step: 2
    - name: tel
      label: 전화번호
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: 주소
      row: 4
      step: 2
    - name: zip
      label: 우편번호
      row: 5
      step: 2
    - name: subject
      label: 제목
      row: 1
      step: 3
    - name: message
      label: 메시지
      row: 2
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: 다른 연락 방법
  columns: 3
  items:
    - title: 영업 문의
      description: 견적, 설정, 딜러 신청, 대량 주문.
      icon: tabler:shopping-bag
    - title: 기술 지원
      description: 보증, 수리, 부품, 운영 관련 질문.
      icon: tabler:tool
    - title: 언론 및 제휴
      description: 미디어 키트, 스폰서십, 업계 협업.
      icon: tabler:news
    - title: 전화
      description: +86 13305324192
      icon: tabler:headset
    - title: 이메일
      description: info@afarer.com
      icon: tabler:mail
    - title: 본사
      description: 중국 칭다오시 라이시 경제개발구, 266600
      icon: tabler:map-pin
map:
  title: 위치
  subtitle: 본사로 방문해 주세요
  address: 중국 칭다오시 라이시 경제개발구, 266600
  zoom: 15

faqs:
  title: 'OEM 패들 생산 FAQ'
  subtitle: '자체 패들 브랜드를 론칭하는 브랜드가 가장 많이 묻는 질문.'
  items:
    - title: '나만의 패들 브랜드는 어떻게 만드나요?'
      description: '16주 만에 브랜드를 론칭하세요: 브리프, 디자인, CE 인증 시제품, 양산, 납품. OEM 패키지를 확인해 보세요.'
    - title: '생산 리드 타임은 얼마나 되나요?'
      description: '샘플은 2~3주, 양산은 물량에 따라 30~45일입니다.'
    - title: '패들에 저희 로고가 들어가나요?'
      description: '네 — 완전한 프라이빗 레이블: 로고 인쇄, 맞춤 색상, 패키지, 라벨을 고객 브랜드로.'
    - title: '첫 주문부터 대량 구매가 가능한가요?'
      description: '표준 모델의 MOQ는 50개이며, 물량에 따라 도매 가격 단계가 적용됩니다.'

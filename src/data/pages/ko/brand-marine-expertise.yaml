meta:
  title: '선박 전문성 — 모든 선체에 담긴 공학 | {SITE}'
  description: '수십 년의 선박 공학이 모든 선체에. afarer는 드롭 스티치 구조, 마린 PVC, 팽창식 보트와 SUP 보드의 전문 설계에 정통합니다.'
  keywords:
    - '선박 공학'
    - '팽창식 보트 제조사'
    - '팽창식 SUP 보드 제조사'
    - '패들보드 생산'
hero:
  tagline: 해양 전문 지식
  title: 모든 선체에서<br />수십 년간의 해양 공학
  subtitle: afarer는 심층적인 재료 과학, 정밀 제조 및 실제 테스트를 결합하여 중요한 순간에 성능을 발휘하는 선박을 생산합니다.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 작업 중인 afarer 해양공학 및 R&D팀
expertise_materials:
  tagline: 재료 과학
  title: 모든 용도에 적합한<br />재료 선택
  subtitle: 우리는 특정 사용 사례와 성능 요구 사항에 맞게 각각 선택된 세 가지 핵심 재료를 사용하여 작업합니다.
  columns: 3
  items:
    - title: 해양 등급 PVC
      description: 1100 denier PVC fabric — our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.
      icon: tabler:droplet
    - title: 프리미엄 하이팔론/CSM
      description: 우수한 내화학성과 UV 안정성. Hypalon 보트는 적절한 관리를 통해 15~20년 동안 사용할 수 있습니다. 장기적인 내구성이 중요한 상업용, 구조용, 군사용으로 권장됩니다.
      icon: tabler:shield
    - title: 유리섬유 및 알루미늄
      description: SUP 및 순찰선용 Deep-V 섬유유리 선체 — 거친 환경에서 파도를 가르는 성능. 최대의 강도와 적재 용량을 요구하는 대형 상업용 작업선용 알루미늄 선체입니다.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 제조 역량
  title: 모든 단계에서<br />정밀 제조
  subtitle: 12,000 m² 규모의 당사 시설에는 모든 생산 단계에 맞는 특수 기계가 장착되어 있습니다.
  columns: 2
  items:
    - title: CNC 절단
      description: 컴퓨터로 제어되는 절단은 낭비를 최소화하면서 정밀하고 반복 가능한 패브릭 패널을 보장합니다. 모든 부분이 디자인한 대로 정확하게 맞습니다.
      icon: tabler:cpu
    - title: 고주파 용접
      description: 산업용 HF 용접은 모재보다 더 강한 이음새를 만듭니다. 일관된 온도 및 압력 제어는 모든 생산 실행에서 기밀 밀봉을 보장합니다.
      icon: tabler:bolt
    - title: 드롭스티치 코어 조립
      description: 수천 개의 폴리에스터 실이 상단과 하단 패브릭 레이어를 연결하여 견고하고 안정적인 SUP 보드와 바닥에 고압 팽창(15-20PSI)을 허용합니다.
      icon: tabler:building-arch
    - title: 내압 시험
      description: 모든 팽창식 제품은 배송 전에 압력 테스트를 거칩니다. SUP 튜브는 정격 압력의 1.5배에서 테스트됩니다. 이 압력을 유지하면 물 위에서도 작동합니다.
      icon: tabler:wind
    - title: 이음새 강도 테스트
      description: 각 생산 배치의 무작위 샘플은 파괴적인 솔기 강도 테스트를 거칩니다. 결과는 특정 생산 실행에 대해 기록되고 추적 가능합니다.
      icon: tabler:files
    - title: 수중 시험
      description: 모든 SUP 모델은 인증 전 해상 시험을 거칩니다. 해안 조건에서의 실제 테스트를 통해 성능, 핸들링 및 안정성이 검증되었습니다.
      icon: tabler:droplet
expertise_design:
  tagline: 디자인 및 엔지니어링
  title: 실제 조건에 맞게 설계됨
  subtitle: 우리의 디자인 철학은 보트를 어떻게 사용할 것인지부터 시작하여 해당 사용 사례를 중심으로 엔지니어링을 구축합니다.
  items:
    - title: 딥-V 선체 디자인
      description: 당사의 유리섬유 선체는 각 모델의 길이와 용도에 맞게 최적화된 계산된 데드라이즈 각도를 갖추고 있습니다. 험한 해상 조건에서는 스티프한 V형으로 성능을, 안정성이 필요한 경우에는 완만한 각도를 제공합니다.
    - title: 멀티챔버 안전
      description: 모든 보트에는 3~7개의 독립된 공기 챔버가 있습니다. 한 구획이 손상되면 나머지 챔버가 보트를 해상 및 작동 상태로 유지합니다.
    - title: 인체공학적 레이아웃
      description: 콘솔 위치, 튜브 높이 및 시트 배치는 순찰, 낚시, 이동 등 장시간 사용하는 동안 작업자의 편안함을 중심으로 설계되었습니다.
    - title: 맞춤 구성
      description: 튜브 색상, 콘솔 구성, 연료 용량, 액세서리 마운트 등 각 모델을 특정 작동 요구 사항에 맞게 맞춤 설정할 수 있습니다.

hero:
  tagline: 안전
  title: 안전 기준 및 인증
  subtitle: 모든 afarer 제품은 엄격한 테스트를 거쳐 레크리에이션 및 전문가용 국제 안전 기준을 충족합니다.

certifications:
  - title: CE 인증
    description: 모든 afarer 안전 장비는 유럽 개인 보호 장비 규정(EU) 2016/425에 따른 CE 마킹 요구 사항을 준수합니다.
  - title: ISO 12402
    description: 구명조끼는  부력 기준을 충족합니다. Life Vest Classic은 50N+ 부력을 제공하며, Life Vest Pro는 자동 팽창 기능으로 SOLAS 요구 사항을 충족합니다.
  - title: SOLAS 준수
    description: Life Vest Pro는 해양 및 상업 해상 작업을 위한 SOLAS(해상 인명 안전) 규정을 준수합니다.


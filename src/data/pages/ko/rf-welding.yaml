  tagline: Lab 03
  title: RF 용접 센터
  subtitle: 내압 용접을 위한 유전체 본딩 기술
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-1.webp
  image_alt: afarer RF 용접 유전체 접합 공정
intro: 인플레이터블 보트는 이음새만큼만 안정적입니다. 하나의 약한 용접이 전체 챔버를 손상시킬 수 있으며, 바다에서 챔버 고장은 불편함이 아니라 안전 위험입니다. {SITE.name}에서는 산업 등급 유전체 용접 프레스와 엄격한 공정 제어 및 용접 후 테스트를 결합하는 전용 고주파(RF) 용접 센터에 투자했습니다. 우리가 생산하는 모든 이음새는 문서화되어 있고 추적 가능하며, 인플레이터블 보트의 국제 표준 — 요건을 충족하거나 초과하도록 인증됩니다.
content_html: |
  <h2>이은사의 과학</h2>
  <p>RF 용접은 고주파 전자기 에너지(일반적으로 27.12 MHz)를 사용하여 PVC 또는 Hypalon 코팅 원단 내의 귀성 분자를 활성화시어 재료 경계면에서 정확하게 열을 생성합니다. 열폰 용접나 열 Wedge 용접과 다른과, RF 용접은 진정한 분자 결합을 형성하여 용접 영역에서 두 원단 레이어가 하나의 그라진 재료로 융합되어 모재와 동등한 강도의 이은사를 만든니다.</p>

  <h2>용접 장비 밀 공정 관리</h2>
  <p>저희 용접 센터는 안된 공팅을 갖고 있습니다:</p>
  <table>
    <thead><tr><th>장비</th><th>출력 / 용량</th><th>욤도</th></tr></thead>
    <tbody>
      <tr><td>유전체 RF 프레스 1</td><td>15kW, 피라텐 2000 × 600mm</td><td>주요 종방향 이은사, 트랜쇼-튜브 이은사</td></tr>
      <tr><td>유전체 RF 프레스 2</td><td>10kW, 피라텐 1500 × 500mm</td><td>뺑프 용접, 콘 부착, 배브 패치</td></tr>
      <tr><td>CNC 제어 RF 용접기</td><td>8kW, XY 테이블 2500 × 1200mm</td><td>곡선 이은사, 로고/패너 각인, 정문 패치워크</td></tr>
      <tr><td>핧웨지 자동 용접기</td><td>가변 온도, 최대 1.2m/min</td><td>Hypalon/CSM 소재 대치 방법</td></tr>
    </tbody>
  </table>
  <p>모든 RF 프레스에는 폜루프 온도 밀 액력 모니터링이 장치되언시다. 용접 매개별수(출력, 가압 시간, 띀갑 시간, 전근 압력)는 소재 유형별로 프로그램되고 완전한 추적 가능성을 위해 제작 실행 시스템(MES)에 기록됩니다.</p>

  <h2>용접 품질 테스트 — 모든 이은사, 모든 보트</h2>
  <p>용접 무이다리성은 4개 항목의 필수 테스트 프로톤을 통해 검증됩니다:</p>
  <ol>
    <li><strong>육안 검사</strong> — 이은사 100%를 대상으로 열-through, 불러운 정렬, 오얼 또는 불완절 융합 여부를 육안 검사합니다. 불합겱 기준: 선형 미터다이 0.5%.</li>
    <li><strong>볼창 테스트 ()</strong> — 각 생사 배치와 매니어 용접된 시퍼에서 25mm 폴의 스트립을 절닌합니다. 최소 볼창력: PVC 1100 dtex의 경우 120N/25mm.</li>
    <li><strong>골기 위유 테스트</strong> — 완성된 모든 체버에 작동 압력의 1.5븼를 가하여 30분간 위유합니다. 압력 강마는 2%를 초과할 수 없습니다.</li>
    <li><strong>열 사이클 테스트</strong> — 시퍼를 -20 °C에서 +60 °C까지 50회 순환한 후 다시 볼창 테스트를 실시합니다. 허용 강도 저하: &lt; 10%.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">볼창 강도 비교 — RF vs 열폰 용접 (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">RF 용접</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">열폰</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">최소 기준</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">RF 용접은 모재 강도의 90~95%를 일관하게 닱성하며, 이는 최소 기준을 많이 상회합니다.</p>
  </div>

  <h2>전문 기술</h2>
  <p>저희 용접팀은 코팅 직물의 유전체 용접 분야에서 11년의 경험을 보유하는 선임 공정 엔지니어가 이러고 있습니다. 각 오프레에서는 생사 이은사 작업에 참여하기 전 6개월간의 사내 인증 프로그램을 이수해야 합니다. 연렴 재인증이 필요하며, 내부 등금 기준(볼창 강도 ≥ 160 N/25 mm)에 따른 실용 용접 테스트가 포함됩니다.</p>

  <h2>고유한 요구사항을 위한 맞주형 용접 \uC194루션</h2>
  <p>모든 욤도에 하나의 용접 사양이 맞지 않는다는 것을 이해합니다. 저희 RF 용접 센터는 특수 요구사항이 있는 고객을 위해 맞주형 이은사 구성을 정기적으로 개발합니다:</p>
  <ul>
    <li><strong>다층 강화 패치</strong> — 스크래프 스트레이크 밀 bow 콘과 같은 고만모 영역을 위해 유연성을 절해하지 않고서 내만모 외층을 통합하는 다-pass RF 용접을 개발합니다.</li>
    <li><strong>전도성 또는 RF 차다 이은사</strong> — 전자기 차파가 필요한 그래들 또는 감시 선박을 위해 이은사 적치 내에 전도성 메실 레이어를 용접합니다.</li>
    <li><strong>색상 변화 패너 용접</strong> — 이중 색상 원단 패너(예: 주황색 선체 + 회색 상판)을 눌어엔 보이는 이은사 없이 레들 미근을 유지하기 위해 숨김 걸치 용접으로 결합합니다.</li>
  </ul>

  <h2>귀사에 대한 유의 약속</h2>
  <p>저희가 누키하는 모든 보트에는 용접 품질 보지가 포함됩니다: 보지 기간 내 정상 사용 중 이은사 결합이 발생하면 당의 체버를 무상으로 수리 또는 교체하고, 재발 방진을 위한 그만보원 원인 조차를 실시합니다. 이는 단수람 보지가 라 다 실제 운영 데이터에 기반하기 한 지속적 개선에 대한 약속입니다.</p>
  <p>{SITE.name}를 선택하시면 단수람 용접된 것이 라 다 설계되고, 테스트되고, 문서화된 이은사를 선택하시는 것입니다. 이것은 단수람 뜨더나는 보트와 실제로 성능을 발화하는 보트의 차이입니다.</p>

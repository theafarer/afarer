meta:
  title: SUP 리테일 파트너 프로그램 | {SITE}
  description: Become an Afarer retail partner. Full product line, professional marketing materials, dropshipping options, and competitive margins for SUP retailers.
hero:
  tagline: 리테일 파트너
  title: Become An Afarer<br />Retail Partner
  subtitle: Sell the fastest-growing SUP brand in your market. Full product line, professional marketing materials, dropshipping options, and margins that make sense.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 소매점에 진열된 아페르 SUP 보드
margin_section:
  title: 리테일 마진 및 최소주문수량
  subtitle: 소매 수익성을 위해 설계된 도매 가격 등급.
  items:
    - tier: 기본 파트너
      discount: 20%
      moq: 500개/년
      margin_note: 보드당 수익 ~$150–250
      features:
        - 전체 제품 라인 접근
        - 마케팅 자료 패키지
        - 이메일 지원
        - 제품 카탈로그 접근
    - tier: 프리미엄 파트너
      discount: 30%
      moq: 연간 2,000대 이상
      margin_note: 보드당 약 $250~400 수익
      features:
        - 전담 관리자
        - 독점 지역 보호
        - 맞춤형 마케팅 지원
        - 신제품 우선 접근
        - 직원 교육 세션
    - tier: 플래그십 파트너
      discount: 35%+
      moq: 연간 5,000대 이상
      margin_note: 보드당 ~–500+ 수익
      features:
        - 공동 브랜드 마케팅 캠페인
        - 매장 진열 지원
        - 현장 스태프 교육
        - 공동 소셜 미디어 프로모션
        - 우선 생산 배정
product_line:
  title: 완전한 제품 라인
  subtitle: 문을 들어서는 모든 고객을 위한 SUP 보드.
  items:
    - name: All-Round Series
      description: 베스트셀러 — 80% 고객에게 적합
    - name: Touring Series
      description: 프로 퍼포먼스 패들러 — 높은 마진
    - name: Yoga Series
      description: 니치(틈새) 시장 — 프리미엄 가격
    - name: Kids Series
      description: 가족 고객 — 재구매 고객
    - name: Racing Series
      description: 마니아 시장 — 브랜드 명성
    - name: Accessories
      description: 고마진 액세서리(패들, 조끼, 펌프, 가방)
catalog:
  title: 리테일 파트너 리소스
  subtitle: 종합 리테일 파트너 키트를 다운로드하세요.
  items:
    - name: 2026 Product Catalog
      desc: 사양, 가격, 주문 정보를 포함한 전체 라인업
      icon: tabler:file-text
      link: /resources/download-catalog
    - name: Retail Partner Guide
      desc: 마진 계산기, 판매 촉진 팁, 모범 사례
      icon: tabler:book
      link: /resources/download-catalog
    - name: Marketing Asset Pack
      desc: 고해상도 제품 사진, 라이프스타일 이미지 및 POS 자료
      icon: tabler:photo
      link: /media
support:
  title: 소매 파트너 지원
  subtitle: 자신 있게 판매하기 위한 모든 것.
  items:
    - 고해상도 제품 이미지(전문 사진 촬영)
    - 소셜 미디어, 웹사이트, 카탈로그용 라이프스타일 사진
    - 마케팅 자료 — 포스터, 진열대 안내판, 배너
    - 직원 교육용 제품 교육 영상
    - 소셜 미디어 콘텐츠 패키지(주간 게시물)
    - SEO 최적화 제품 설명
    - 드롭십핑 옵션 가능 — 재고 리스크 없음
    - Net 30 결제 조건
cta:
  title: Ready to become a partner?
  subtitle: Apply for partnership or download our retail catalog.
  actions:
    - text: 파트너십 신청
      href: /contact?partner=retail
      variant: primary
    - text: 리테일 카탈로그 다운로드
      href: /resources/download-catalog
      variant: secondary

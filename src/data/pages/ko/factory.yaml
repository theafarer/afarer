material_traceability:
  tagline: 추적 가능성
  title: 자재 추적 및 배치 관리
  description: 모든 원자재 배치는 ERP 시스템에서 고유한 로트 번호를 부여받습니다. 입고부터 생산, 완제품까지 각 보트의 자재 명세서는 원래 공급업체 배치로 연결됩니다. 이를 통해 품질 또는 컴플라이언스 관련 문의 시 완전한 상위 추적이 가능합니다.
  system: 맞춤형 ERP(칭다오 Vatrad 그룹 내부 시스템) + 각 작업 지시서에 물리적 배치 태그 부착
  coverage: 생산 자재 100% 검사 — PVC, Hypalon, 드롭스티치 직물, 접착제, 밸브, 하드웨어, 포장
  records_retained: 10년 (CE 2013/53/EU 요구사항에 따라)
  suppliers:
    - material: 해양 등급 PVC
      source: 중국 및 한국 공급업체
      certified: ISO 9001, REACH, RoHS
    - material: 하이퍼론 (CSM)
      source: 일본 공급업체
      certified: ISO 9001, REACH
    - material: 드롭스티치 원단
      source: 자체 직조 + 외부 파트너
      certified: 사내 QC + 공급업체 ISO 9001
    - material: 밸브 및 하드웨어
      source: 중국 OEM 공급업체
      certified: ISO 9001, 배치별 자재 인증서
qc_dashboard:
  tagline: 숫자로 보는 QC
  title: 품질 관리 지표
  subtitle: 당사 생산 라인의 실제 합격/불합격 데이터입니다. 품질랩은 생산 부서와 독립적으로 운영되며, 결과를 경영진에게 직접 보고합니다.
  stats:
    - value: 100%
      label: 내압 시험 완료된 유닛
      detail: 모든 보트, 모든 챔버, 모든 배치
    - value: <5%
      label: 최대 허용 압력 강하
      detail: 1.25× 정격 압력에서 24시간 이상
    - value: AQL 2.5
      label: 중대 결함 기준
      detail: ISO 2859 샘플링 기준 준수
    - value: 24–48h
      label: 내압 유지 시간
      detail: 제품 카테고리에 따라
    - value: 1.25×
      label: 테스트 압력 대 등급 압력
      detail: 모든 챔버에 대한 안전 마진
    - value: 0%
      label: 안전 결함 허용 오차
      detail: 밸브, D-링, 이음매(실), 부력

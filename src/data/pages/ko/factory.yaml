qc_section:
  tagline: 품질 관리
  title: 테스트 및 품질 보증 프로세스
  subtitle: 모든 보트는 선적 전 의무 테스트를 거칩니다. 당사 품질 연구소는 생산과 독립적으로 운영되며 경영진에 직접 보고합니다.
  steps:
    - step: '1'
      title: 원자재 검사
      desc: PVC, Hypalon, 드롭스티치 원단은 생산 투입 전 인장 테스트, 인열 전파, 자외선 저항성 검증을 거칩니다.
    - step: '2'
      title: 48시간 공기 유지 테스트
      desc: 모든 튜브 챔버는 정격 압력의 125%까지 팽창 후 48시간 유지됩니다. 압력 강하가 5%를 초과하면 자동 폐기 및 심지 재검사가 진행됩니다.
    - step: '3'
      title: 하중 및 밸런스 테스트
      desc: 완성된 보트는 최대 정격 용량으로 적재되어 안정성, 프리보드, 조종성에 대해 테스트됩니다. 각 선박은 최종 검사 전 수중 테스트를 거칩니다.
oem_section:
  tagline: OEM 프로젝트
  title: 브랜드 및 OEM 파트너십 사례 연구
  subtitle: 컨셉부터 컨테이너까지 — 글로벌 브랜드가 인플러터블 수상 레저 기재 라인을 론칭하고 확장하도록 돕는 방법.
  cases:
    - challenge: 유럽 아웃도어 소매업체는 고유한 데크 그래픽, 친환경 PVC, 리테일 준비 포장이 적용된 프라이빗 라벨 SUP 라인을 60일 내에 납품받아야 했습니다.
      solution: 맞춤 디지털 인쇄 파일을 개발하고 REACH 준수 PVC를 조달했으며, 디자인 팀을 청도 공장에 배치해 샘플링을 3회에서 1회로 압축했습니다.
      result: 서명된 PO부터 FOB까지 55일 소요. 4개 SKU에 걸쳐 2,400대 생산. 첫 컨테이너 도착 전 재주문 확정.
    - challenge: 미국 수상 스포츠 스타트업은 맞춤 선체 형상, 공동 브랜드 포장, 리테일 입점을 위한 BSCI 인증이 적용된 고성능 드롭스티치 카약이 필요했습니다.
      solution: 기존 드롭스티치 카약 금형에 수정된 로커 프로파일을 적용하고 공동 브랜드 포장 아트워크를 개발했으며 전체 BSCI 감사 문서를 제공했습니다.
      result: 미국 주요 아웃도어 체인 3곳에 정식 입점. 첫해 5,000대 이상 판매, 98% 판매율 기록.
    - challenge: 호주 유통사는 맞춤 튜브 색상, Hypalon 업그레이드 옵션, 호주 기준 AS 1799 준수가 적용된 CE 인증 SUP 라인이 필요했습니다.
      solution: 4가지 튜브 색상 변형의 시제품을 생산하고 일본 공급업체에서 CSM Hypalon을 조달했으며 제3자 AS 1799 준수 테스트를 조율했습니다.
      result: AU/NZ 시장에 3개 모델 SUP 라인 론칭. 이어 12대의 순찰용 SUP 정부 입찰 수주.
faq_section:
  tagline: 자주 묻는 질문
  title: B2B 및 OEM 자주 묻는 질문
  questions:
    - q: OEM 인플러터블 SUP 보드의 최소 주문 수량(MOQ)은 얼마인가요?
      a: 표준 OEM 모델의 MOQ는 5–10대부터 시작합니다. 맞춤 금형 및 프라이빗 라벨 프로젝트는 복잡도에 따라 최소 200대가 필요합니다. 신규 브랜드 론칭을 위한 시험 주문 및 샘플 생산도 가능합니다.
    - q: 아쿠아페어는 BSCI 인증을 보유하고 있나요?
      a: 네. 당사 공장은 유효한 BSCI 사회적 책임 인증을 유지하고 있습니다(감사 보고서는 요청 시 제공). 또한 품질 경영을 위한 인증과 모든 제품의 CE 인증을 보유하고 있습니다. 모든 OEM 선적물에는 REACH 및 RoHS 준수 문서가 동봉됩니다.
    - q: OEM 주문의 일반적인 리드타임은 어떻게 되나요?
      a: 표준 리드타임은 PO 및 계약금 확정 후 30–45일입니다. 맞춤 금형 개발은 금형 제작에 15–20일이 추가됩니다. 긴급 주문과 여름 철(1–3월) 성수기 물량을 위한 신속 생산도 제공합니다.
    - q: FOB 청도 또는 당사 항구까지 CIF로 선적 가능한가요?
      a: 네. FOB 청도, 주요 글로벌 항구까지 CIF, 자격을 갖춘 파트너에게는 DDP로 선적합니다. 당사 물류 팀이 컨테이너 예약, 수출 서류, 통관을 관리합니다. EU, 미국, 호주, 아시아 시장의 50개 이상 국가로 선적합니다.
b2b_moq: '표준 MOQ: 모델당 5–10대 (SUP/카약/드롭스티치). SUP MOQ: 2–5대. 신규 파트너십을 위해 시험 주문 환영.'
production_flow:
  tagline: 생산 흐름
  title: 원자재에서 완성 보트까지
  subtitle: 모든 보트는 6단계 생산 공정을 거치며, 각 단계마다 QC 검문소가 있습니다. 편법이나 검사 생략은 없습니다.
  stages:
    - stage: '01'
      title: 자재 입고 및 incoming QC
      description: 모든 incoming 자재는 ERP 시스템에서 배치/로트 번호로 기록됩니다. PVC 직물 롤, 드롭스티치 코어, 밸브, 접착제, 하드웨어는 QC 승인 전까지 격리됩니다.
      qc_check: 인장 강도(ASTM D751), 내파괴력(ISO 4674), 두께 게이지, 접착제 점도, 육안 결함 스캔
      qc_threshold: 배치의 100% 시험. 인장 강도 specifications의 90% 미만, 찢김 최소치 미달, 또는 외관 결함 시 불합격
      responsibility: 입고 QC 팀(검사원 3명)
    - stage: '02'
      title: CNC 절단 및 소재 준비
      description: 컴퓨터 최적화 네스팅으로 PVC 원단에 패널을 배치하여 폐기물을 최소화합니다. 자동 CNC 절단기가 0.1mm 위치 정확도를 유지합니다.
      qc_check: CAD DXF 파일에 대한 치수 검사, 가장자리 품질 검사, 패널 수량 검증
      qc_threshold: 20번째 패널마다 측정. 공차 ±0.5mm. 공차 초과율 2% 이상일 경우 해당 배치 폐기.
      responsibility: 절단 작업장 담당자
    - stage: '03'
      title: 용접 및 Drop-Stitch 본딩
      description: 드롭스티치 코어는 열 라미네이션을 사용하여 외부 PVC 라미네이트에 접합됩니다. 튜브 챔버는 RF 용접 또는 열풍 용접되며, 레일 밴드는 3중 레이어 융합 접합됩니다.
      qc_check: 50유닛당 박리 시험 (ASTM D751), 용접 폭 측정, 핫에어 온도 로그 검토, 백라이트 하 시각적 이음새 검사
      qc_threshold: 박리 강도 최소 8 N/cm. 용접 너비 공차 ±1mm. 눈에 보이는 채널링 = 불합격
      responsibility: 용접 QC(교대당 검사관 2명)
    - stage: '04'
      title: 조립 및 마감
      description: 보트는 최종 조립 단계로 이동하며, 선체 + 튜브 결합, 밸브 설치, D-링, 핸들, 핀 박스, 캐리백 피팅 등 모든 부품이 결합됩니다. 각 유닛은 100개 항목의 조립 체크리스트에 따라 진행됩니다.
      qc_check: 유닛당 100개 항목 체크리스트 확인, 밸브 작동 테스트 (10회 개폐 사이클), 하드웨어 토크 검증, 시각적 검사
      qc_threshold: '안전 핵심 부품(밸브, D링, 핸들)에 대한 무결점 정책. 경미한 외관 결점: AQL 2.5 (ISO 2859)'
      responsibility: 조립팀 리드 + 라인 QC
    - stage: '05'
      title: 압력 테스트 및 품질 보류
      description: 모든 챔버는 정격 압력의 1.25배(일반적으로 20–25 PSI)로 팽창되어 24–48시간 동안 유지됩니다. 압력 센서는 연속적으로 기록됩니다. 압력 강하가 5%를 초과하는 챔버는 불합격 처리되어 이음새 재검사를 받습니다.
      qc_check: 24시간 내압 로그, 일일 센서 캘리브레이션 검증, 온도 보정 압력 측정, 수리 후 이음매 재검사
      qc_threshold: 안정된 온도에서 24시간 내 최대 5% 압력 강하. 이 기준을 초과하는 챔버 = 전체 생산 배치의 100% 재테스트
      responsibility: 품질 실험실 (생산과 독립, 경영진에 보고)
    - stage: '06'
      title: 최종 검사 및 포장
      description: 최종 육안 및 기능 검사. 표면 결함, 색상 균일성, 라벨/BIN 확인, 포장 무결성 및 액세서리 완비 점검. 제품은 진공 포장, 박스 입수 및 팔레트 적재 후 컨테이너에 적재됩니다.
      qc_check: 전체 시각 검사, SKU별 액세서리 체크리스트, 포장 낙하 시험(1m, 무작위 샘플), 라벨/바코드 스캔 검증
      qc_threshold: 주요 결함 AQL 2.5, 경미한 결함 AQL 4.0. 안전 결함에 대해서는 무관용 원칙을 적용합니다. 전체 유닛 100% 육안 검사 실시
      responsibility: 최종 QC팀 (4명의 검사원) + 포장팀 리더
workforce:

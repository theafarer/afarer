faqs:
  - question: 팽창식 보트를 수색 및 구조 작전에 적합하게 만드는 것은 무엇입니까?
    answer: 내구성, 안정성, 얕은 수심 기능 및 신속한 배치가 핵심입니다.
  - question: afarer는 SAR 팽창식 보트에 어떤 재료를 사용합니까?
    answer: Hypalon(CSM/Neoprene) 및 고인장 PVC를 모두 제공합니다.
  - question: afarer는 특정 SAR 임무 프로필에 맞게 보트를 맞춤 제작할 수 있습니까?
    answer: 예. 완전한 OEM/ODM 맞춤화를 제공합니다.
  - question: afarer SAR 보트는 미국 해안경비대 승인을 받았습니까?
    answer: 예. afarer 팽창식 보트는 미국 해안경비대 제조 승인을 받았습니다.
  - question: SAR 보트 주문의 일반적인 리드 타임은 얼마입니까?
    answer: 주문 확인 후 30-45일.
body: |-
  <h2>생명 구조 임무에서의 우수성에 대한 약속</h2>
  <p>수색 및 구조 작업에서는 오류의 여지가 없습니다. 배치되는 장비는 위험하고 예측할 수 없는 환경에서 흔들림 없는 신뢰성, 뛰어난 성능, 그리고 절대적인 안전을 제공하는 탁월한 것이어야 합니다.</p>
  <p>afarer는 완벽한 제품을 생산한다는 원칙에 기반하여 설립되었습니다. 이는 초기 설계 개념부터 최종 인도에 이르기까지 당사 운영의 모든 측면에 스며드는 철학입니다. 최대 16피트로 제작되는 당사의 팽창식 보트는 엄격한 엔지니어링, 프리미엄 등급의 재료, 그리고 모든 중요한 단계에서 가장 엄격한 품질 요구 사항에 의해 관리되는 제조 공정의 결정체입니다.</p>

  <h2>SAR를 위한 첨단 재료의 afarer 표준</h2>
  <p>신뢰할 수 있는 SAR 팽창식 보트의 기반은 구조 재료의 품질에 있습니다. 거친 해안선, 수중 잔해, 강렬한 자외선, 화학 물질 노출과 같은 극한의 구조 조건은 타협 없는 내구성과 장수명을 제공하는 재료를 요구합니다.</p>

  <h3>Hypalon(CSM/Neoprene): 견고성의 기준</h3>
  <p>Hypalon은 오랫동안 뛰어난 내구성으로 높이 평가받아 왔습니다. 자외선, 극한 온도, 광범위한 화학 물질에 대한 우수한 내성 덕분에 상업용 및 군사용 애플리케이션의 전통적인 선택이 되었습니다. 제대로 관리된 Hypalon 보트는 종종 20년을 초과하는 인상적인 사용 수명을 제공할 수 있습니다. afarer는 코팅 일관성과 기본 원단 무결성에까지 이르는 엄격한 품질 관리를 통해 최고 등급의 Hypalon만을 사용하도록 보장합니다.</p>

  <h3>고인장 PVC: 우수성을 위해 설계</h3>
  <p>무게 절감을 우선시하는 애플리케이션의 경우, afarer는 특수 제조된 코팅을 여러 층으로 적용한 마린 등급의 고인장 PVC를 사용합니다. 당사의 PVC 원단은 10년을 초과하는 확장된 자외선 보호 보증을 제공합니다. 당사 품질의 핵심은 열용접(RF) 솔기만을 독점적으로 사용하여, 저급 구조물에서 흔한 접착 솔기와 관련된 결합 열화 위험을 제거하는 것입니다.</p>

  <h2>SAR 작전을 위한 설계 철학</h2>
  <p>SAR 작전은 팽창식 보트 설계에 독특한 요구를 부과합니다. afarer는 미션 특화 엔지니어링을 통해 이러한 요구를 해결합니다:</p>
  <ul>
    <li><strong>다중 챔버 이중화:</strong> 여러 개의 독립적인 에어 챔버가 하나의 챔버가 손상되어도 보트가 작동 상태를 유지하도록 보장합니다.</li>
    <li><strong>고시인성 구성:</strong> 항공 및 수상 식별을 위한 인터내셔널 오렌지, 옐로우 또는 맞춤형 고시인성 색상 구성.</li>
    <li><strong>강화 구조:</strong> 헤비듀티 러빙 스트레이크, 강화 플로어 패널, 견인 및 리프팅을 위한 강화된 부착 지점.</li>
    <li><strong>신속 배치 설계:</strong> 1분 1초가 중요한 상황에서 빠른 팽창과 진수에 최적화되어 있습니다.</li>
    <li><strong>정지 시 안정성:</strong> 넓은 빔 설계가 피해자 수습 작업에 탁월한 안정성을 제공합니다.</li>
  </ul>

  <h2>필수 장비 통합</h2>
  <p>SAR 팽창식 보트는 미션 크리티컬 장비의 통합이 필요합니다. afarer는 전용 장착 시스템을 갖춘 보트를 설계합니다:</p>
  <ul>
    <li>플래닝 속도에 충분한 출력의 선외 모터</li>
    <li>항법 및 통신 장비</li>
    <li>탐조등 및 비상 조명 시스템</li>
    <li>들것 및 의료 장비 고정 시스템</li>
    <li>다이브 사다리 및 회수 플랫폼</li>
    <li>운항 불능 선박용 견인 시스템</li>
  </ul>

  <h2>SAR 등급 신뢰성을 위한 품질 관리 및 테스트</h2>
  <p>모든 afarer SAR 보트는 인도 전에 엄격한 테스트를 거칩니다. 여기에는 작동 한계를 초과하는 압력에서의 100% 공기 보유 테스트, 솔기 박리 검증, 자외선 저항성 검증, 마모 테스트, 전체 시스템 점검이 포함됩니다. 당사의 품질 연구소는 생산과 독립적으로 운영되며 경영진에게 직접 보고합니다.</p>

  <h2>구조 기관을 위한 OEM/ODM</h2>
  <p>afarer는 정부 구조 기관, 소방서, 해안경비대 유닛, 해양 경찰과 직접 협력하여 맞춤형 SAR 보트 솔루션을 개발합니다. 당사의 OEM/ODM 서비스에는 다음이 포함됩니다:</p>
  <ul>
    <li>미션 특화 설계 및 엔지니어링</li>
    <li>맞춤형 색상 구성 및 기관 브랜딩</li>
    <li>전문 장비 통합</li>
    <li>함대 표준화 프로그램</li>
    <li>기술 문서 및 교육 자료</li>
    <li>지속적인 예비 부품 및 보증 지원</li>
  </ul>

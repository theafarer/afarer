hero:
  tagline: 기술
  title: 당사의 기술
  subtitle: afarer 제품은 고급 소재와 혁신적인 엔지니어링으로 설계되어 탁월한 성능, 내구성 및 휴대성을 제공합니다.
sections:
  - title: 드롭 스티치 코어
    description: 수천 개의 내부 폴리에스터 실이 상단과 하단 레이어를 연결하여 12-15 PSI에서 단단한 구조를 형성합니다. 이는 전문 패들보드 및 인플레이션 레이싱 SUP에 사용되는 동일한 기술입니다.
    imageAlt: DS 핵심 다이어그램
  - title: 해양 등급 PVC
    description: 해양 환경 등급의 다층 라미네이트 PVC 원단. 각 층은 본딩이 아닌 융착 용접으로 결합되어 박리 위험을 제거했습니다. UV 저항성, 염수 부식, 마모에 대해 테스트 완료.
    imageAlt: PVC 레이어
  - title: 군사 등급 PVC
    description: 모든 SUP 모델에 사용되는 프리미엄 PVC는 우수한 UV 및 화학적 저항성을 제공합니다. 극한의 온도에서도 유연성을 유지하고 열화에 강합니다.
    imageAlt: PVC
  - title: 에어 덱 플로어
    description: 스탠딩, 낚시, 요가에 탁월한 강성을 제공하는 고압 인플레이터블 드롭스티치 구조입니다. 셋업 시간, 전체 무게, 보관 부피를 줄여줍니다.
    imageAlt: 에어 데크

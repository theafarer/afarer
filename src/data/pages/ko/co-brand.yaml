features:
  title: 'Afarer의 코브랜딩이란'
  subtitle: '코브랜딩은 Afarer 브랜드, 영역 보호, 한정판 컬렉션을 중심에 둔 디자인 파트너십 프로그램입니다 — 무브랜드 생산이 아닙니다.'
  columns: 3
  items:
    - title: 'Afarer 제품은 Afarer 제품으로 남습니다'
      description: '코브랜드 컬렉션은 고객의 아이덴티티를 담은 Afarer 보드의 한정 에디션입니다. 무브랜드도, 제3자 브랜드도, 개방형 프라이빗 레이블 프로그램도 아닙니다.'
      icon: 'tabler:trademark'
    - title: '함께 디자인'
      description: '고객의 색상, 네이밍, 스토리가 컬렉션을 만듭니다. 당사의 디자인·엔지니어링 팀이 브리프부터 납품까지 데크, 그래픽, 패키지, 문서를 담당합니다.'
      icon: 'tabler:pencil'
    - title: '클럽, 리조트, 이벤트 & 커뮤니티를 위한 프로그램'
      description: '패들 클럽과 리조트를 위한 플릿 컬렉션, 레이스와 커뮤니티 시리즈를 위한 이벤트 에디션 — 모두 Afarer의 품질과 보증이 함께합니다.'
      icon: 'tabler:users'
    - title: '국가 파트너 보호'
      description: '코브랜딩은 1국가 1유통사 모델과 함께 운영됩니다. 국가 파트너는 자국 영역을 유지하며, 코브랜드 컬렉션이 해당 시장에 병행 브랜드의 문을 열지 않습니다.'
      icon: 'tabler:shield-check'
    - title: '엔지니어링 & 품질 기준'
      description: '모든 컬렉션은 CE 및 ISO 9001 문서, 압력 테스트, 코어 라인과 동일한 QC 체크포인트를 갖춘 인증 공급망에서 출하됩니다.'
      icon: 'tabler:certificate'
    - title: '브랜드 자산이 됩니다'
      description: '한정판 코브랜드 컬렉션은 물 위에 고객만의 스토리를 쌓습니다 — 판매 마진, 미디어 콘텐츠, 그리고 패들러가 시즌마다 다시 찾는 이유가 됩니다.'
      icon: 'tabler:star'
table:
  title: '코브랜드 컬렉션 티어'
  subtitle: '일반적인 코브랜드 컬렉션 조건. 가격은 USD, FOB 칭다오 기준. 맞춤 데크 디자인은 개발에 15~20영업일이 추가되며, 신규 금형은 프로젝트별 견적입니다.'
  caption: '모든 코브랜드 제품은 Afarer 제품이며 Afarer 브랜드 아이덴티티를 담습니다. 프로젝트 범위, 독점 기간, 최종 조건은 코브랜드 프로젝트 계약서에서 합의합니다.'
  head:
    - 코브랜드 티어
    - 최소 주문 수량(개)
    - 리드 타임
    - 결제 조건
  rows:
    - [파일럿 컬렉션, 30–50, 30–45영업일, 30% 계약금 / 70% 출하 전 결제]
    - [스탠다드 코브랜드 컬렉션, 50–100, 30–45영업일, 30% 계약금 / 70% 출하 전 결제]
    - [대형 / 다중 지역 컬렉션, 100+, 45–60영업일, 30% 계약금 / 70% 출하 전 결제]
    - [신규 금형 또는 딥 로컬라이제이션, 200+, 60–90영업일, 30% 계약금 / 70% 출하 전 결제]
faqs:
  title: '코브랜드 — FAQ'
  subtitle: 'Afarer 코브랜딩의 작동 방식과 OEM·프라이빗 레이블과의 차이.'
  items:
    - title: '코브랜딩이 OEM이나 프라이빗 레이블과 같은가요?'
      description: '아닙니다. Afarer는 더 이상 개방형 OEM/프라이빗 레이블 프로그램을 운영하지 않습니다. 코브랜드 제품은 여전히 Afarer 제품입니다 — 디자인, 엔지니어링, 품질 검사, 보증 모두 Afarer 브랜드가 담당합니다. 고객의 아이덴티티는 코브랜드로 표시되며, 무브랜드 제3자 제품이 되지 않습니다.'
    - title: '누가 코브랜드 프로젝트를 시작할 수 있나요?'
      description: '검증된 워터스포츠 기업입니다: 기존 국가 파트너, 패들 클럽, 리조트·호텔, 이벤트 주최자, 커뮤니티. 프로젝트 브리프를 보내주시면 디자인 시작 전 적합성을 확인합니다.'
    - title: '코브랜딩이 해당 국가 유통사와 충돌하나요?'
      description: '아니요. 1국가 1유통사 모델이 우선합니다. 코브랜드 컬렉션은 현지 국가 파트너가 있는 경우 해당 파트너와 조율되므로, 보호된 영역 내에 병행·경쟁 브랜드가 나타나지 않습니다.'
    - title: '코브랜드 컬렉션의 최소 주문 수량은?'
      description: '파일럿 컬렉션은 30~50개부터 시작합니다. 스탠다드 컬렉션은 50~100개, 대형·다중 지역 에디션은 100개 이상입니다. 맞춤 개발 일정은 프로젝트별로 합의합니다.'
    - title: 'Afarer의 역할과 파트너의 기여는 어떻게 나뉘나요?'
      description: 'Afarer는 제품 디자인, 엔지니어링, 소재, 구조, QC, 보증을 소유합니다. 파트너는 컬렉션 콘셉트, 네이밍, 색상, 그래픽, 시장 진출을 담당합니다. 이를 통해 물 위의 품질 기준을 하나로 유지합니다.'
    - title: '어떻게 신청하나요?'
      description: '코브랜드 문의 양식에 사업 정보, 시장, 컬렉션 아이디어를 입력해 주세요. 적합성을 검토한 후 3영업일 이내에 제안서와 코브랜드 프로젝트 계약서로 회신합니다.'

timeline:
  - year: '2012'
    title: 해양 제조 기반 구축
    body: afarer는 중국 칭다오에서 전문 고무보트 작업장으로 시작하여 해양 장인정신과 고무보트 제조에 전념했습니다. 초기에는 실용적인 엔지니어링 경험과 제조 기술을 바탕으로 신뢰할 수 있는 고무보트 제품을 만드는 데 집중했습니다.
  - year: '2015'
    title: 첫 수출 및 CE 인증
    body: 첫 수출 주문이 일본과 한국에 도착했습니다. 핵심 제품 라인에 대한 CE 인증을 획득하여 afarer의 국제 시장 진출을 알렸습니다. 중국을 넘어 상업용 및 레저용 사용자에게 서비스를 제공하기 시작했습니다.
  - year: '2018'
    title: 공장 확장
    body: 12,000 m² 생산 시설로 이전했습니다. RF 용접 라인과 드롭스티치 생산 능력을 추가하여 대규모 제조와 향상된 품질 관리 시스템을 구현했습니다.
  - year: '2020'
    title: 연구개발 센터 설립
    body: PVC 패브릭 연구소, 수역학 시험 수조, CAD/FEA 시뮬레이션 스튜디오를 갖춘 전용 연구개발 센터를 열었습니다. 경량 구조, 향상된 내구성, 사용자 중심 디자인에 초점을 맞춘 제품 개발을 확대했습니다.
  - year: '2022'
    title: 인증 및 글로벌 성장
    body: ISO 9001 인증을 획득했습니다. 14명의 연구개발 엔지니어와 200명 이상의 직원으로 확장했습니다. 유럽, 미주, 아시아태평양 지역의 고객에게 유통업체 및 OEM 파트너십을 통해 제품을 공급했습니다.
  - year: '2024'
    title: 혁신 및 디자인 스튜디오
    body: 맞춤형 ODM 프로젝트를 위한 풀서비스 디자인 및 혁신 스튜디오를 출시하여 컨셉부터 생산까지 지원합니다. 구조, 상업, 정부 입찰 등 전문 해양 응용 분야를 강화했습니다.
  - year: '2026'
    title: 수상 탐험의 미래를 구축하다
    body: 오늘날 afarer는 고무보트, SUP 시스템, 맞춤형 해양 솔루션을 지속적으로 개발하여 사람들과 조직을 세계의 수역과 연결하고 있습니다. 50개국 이상에 서비스를 제공하며 연간 15,000대 이상의 생산 능력을 보유하고 있습니다.
content_founding:
  tagline: 시작
  title: 수변에서 태어나다
  subtitle: afarer는 칭다오의 해안 작업장에서 단 한 척의 보트와 「실제 해양 조건을 견딜 수 있는 고무보트를 만든다」는 비전으로 시작되었습니다.
  paragraphs:
    - 2012년, 창업자들은 시장의 격차를 발견했습니다. 대부분의 고무보트는 저렴하지만 신뢰성이 부족하거나, 고품질이지만 엄청나게 비쌌습니다. 품질과 가치를 모두 제공하는 제조업체가 자리할 여지가 있다고 그들은 믿었습니다.
    - 첫 번째 선체는 수작업으로 제작되었고, 현지 해역에서 테스트되었으며, 어부와 소규모 상업 운영자들의 실제 피드백을 바탕으로 개선되었습니다. 「만들고, 테스트하고, 듣고, 개선한다」는 이 피드백 루프는 오늘날까지 우리 엔지니어링 철학의 핵심입니다.
    - 2015년까지 소문은 칭다오를 넘어 퍼졌습니다. 해외 유통업체들이 샘플을 요청하기 시작했습니다. 지역 작업장으로 시작된 것이 글로벌 공급업체로 성장하고 있었습니다.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer 초기 생산 작업장 및 제조 현장
content_growth:
  tagline: 성장과 혁신
  title: 작업장에서 12,000 m² 시설로
  subtitle: 인력, 장비, 프로세스에 대한 지속적인 투자가 afarer를 현대적인 해양 제조 시설로 탈바꿈시켰습니다.
  paragraphs:
    - 수요가 증가함에 따라 시설도 확장되었습니다. 소규모 작업장에서 SUP 보트, 고무보트, SUP 보드, 액세서리 전용 생산 라인을 갖춘 12,000 m² 공장으로 성장했습니다.
    - CNC 절단기, 고주파 용접 장비, 드롭스티치 생산 라인, 종합 테스트 장비에 투자하여 생산 품질의 모든 측면을 통제할 수 있게 되었습니다.
    - 현재 200명 이상의 팀에는 해양 엔지니어, 재료 과학자, 품질 관리 전문가, 숙련된 장인들이 포함되어 있으며, 이들 중 다수는 초기부터 afarer와 함께해 왔습니다.
philosophy:
  tagline: 브랜드 철학
  title: 수상의 자유를 엔지니어링하다
  body: 수상의 자유는 단순한 이동만을 의미하지 않습니다. 새로운 장소를 발견하고, 야외 경험을 창출하며, 사람들을 자연과 연결하고, 전문적인 임무를 가능하게 하는 것입니다. 엔지니어링이 그 자유를 실현합니다.
  pillars:
    - title: 신뢰성 우선
      body: 수상 환경에서는 신뢰가 필수입니다. afarer 제품은 안정성, 내구성, 안전성, 일관된 성능을 중심으로 설계되었습니다.
    - title: 인간 중심 디자인
      body: 제품은 기술이 아닌 사람을 위해 봉사해야 합니다. 모든 디자인 결정은 사람들이 수상선박을 어떻게 사용하고, 어디를 탐험하며, 어떤 도전에 직면하는지 이해하는 것에서 시작됩니다.
    - title: 접근 가능한 탐험
      body: 물은 전문가만의 것이 아닙니다. afarer는 더 많은 사람들이 안전하게 강, 호수, 바다, 해안 환경을 경험할 수 있도록 장비를 만듭니다.
    - title: 지속적인 혁신
      body: 혁신은 신제품을 만드는 것만이 아닙니다. 재료, 구조, 제조, 사용자 경험 등 모든 세부 사항을 개선하는 것입니다.
engineeringDna:
  tagline: 엔지니어링 DNA
  title: afarer가 제품을 만드는 방법
  areas:
    - title: 재료 과학
      body: afarer는 다양한 해양 환경에 적합한 재료를 선정하는 데 중점을 둡니다. 주요 고려 사항에는 내마모성, 내UV성, 압력 안정성, 장기 내구성이 포함됩니다.
      items:
        - 내마모성
        - 내UV성
        - 압력 안정성
        - 장기 내구성
    - title: 구조 엔지니어링
      body: 고무보트는 강성, 무게, 휴대성, 안정성 간의 정밀한 균형이 필요합니다. afarer 엔지니어링은 드롭스티치 코어 기술과 고급 이음매 구조를 통해 이러한 요소를 최적화하는 데 중점을 둡니다.
      items:
        - 강성
        - 무게 최적화
        - 휴대성
        - 안정성
    - title: 제조 정밀도
      body: 모든 제품은 재료 준비, 정밀 절단, 용접 및 접합, 조립, 품질 검사, 성능 검증의 통제된 프로세스를 거칩니다.
      items:
        - 재료 준비
        - 정밀 절단
        - 용접 및 접합
        - 조립 및 품질 관리
    - title: 사용자 시나리오 엔지니어링
      body: 제품은 실제 응용 분야(레크리에이션, 모험, 전문가용)를 기반으로 개발되며, 각 디자인이 의도된 환경의 특정 요구 사항을 충족하도록 보장합니다.
      items:
        - 레크리에이션
        - 모험
        - 전문가용
        - 상업용
trustSignals:
  tagline: 신뢰의 증표
  title: afarer가 신뢰할 수 있는 파트너인 이유
  manufacturing:
    title: 제조 역량
    body: 12,000 m² 생산 시설에 200명 이상의 숙련된 직원과 14명 이상의 연구개발 엔지니어. ISO 9001 인증 품질 관리 시스템. 연간 15,000대 이상의 고무보트를 생산하여 50개국 이상에 공급합니다.
    stats:
      - label: 시설 면적
        value: 12,000 m²
      - label: 직원 수
        value: 200+
      - label: 연구개발 엔지니어
        value: 14+
      - label: 연간 생산 능력
        value: 15,000 이상
  quality:
    title: 품질 약속
    body: 재료 검사부터 최종 테스트까지, afarer는 체계적인 품질 프로세스를 유지하여 신뢰할 수 있는 해양 제품을 제공합니다. 모든 제품은 출하 전에 압력 테스트, 이음매 검사, 성능 검증을 거칩니다.
    items:
      - CE Certified — 모든 제품이 유럽 안전 기준을 충족합니다
      - ISO 9001:2015 — 품질 관리 시스템 인증 완료
      - UKCA Marked — 영국 시장 적합성 인증
      - FCC Compliant — 미국 전자 부품 적합성 인증
  global:
    title: 글로벌 프레즌스
    body: afarer는 유럽, 아시아태평양, 미주, 중동, 아프리카의 50개국 이상에서 유통업체, 아웃도어 브랜드, 전문 해양 사용자를 지원하며 다양한 글로벌 시장의 고객에게 서비스를 제공합니다.

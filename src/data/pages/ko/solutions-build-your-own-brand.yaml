meta:
  title: 프라이빗 라벨 SUP 제조 | {SITE}
  description: Afarer와 함께 자체 SUP 브랜드를 론칭하세요. 아이디어에서 시장 출시까지 — 디자인, 프로토타이핑, 생산 및 글로벌 물류를 포함한 완전한 OEM/ODM 서비스.
hero:
  tagline: 자신만의 브랜드를 구축하세요
  title: 자신만의<br />SUP 브랜드 론칭
  subtitle: 여러분의 비전이 있습니다. 우리에게는 공장, 전문성 및 공급망이 있습니다. 함께 돋보이는 브랜드를 구축합시다.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: 수면 위의 맞춤 브랜딩 SUP 보드
process:
  title: 귀사의 브랜드 여정
  subtitle: 아이디어에서 시장까지 5단계.
  steps:
    - phase: 1단계
      title: 아이디어
      period: 1-2주차
      items:
        - 시장 조사 및 경쟁사 분석
        - 타겟 고객 정의
        - 브랜드 포지셔닝 워크숍
        - 제품 라인 전략
    - phase: 2단계
      title: 디자인
      period: 3~6주차
      items:
        - 보드 형태 및 그래픽 디자인
        - 색상 매칭 및 소재 선정
        - 액세서리 사양
        - 포장 및 라벨 디자인
    - phase: 3단계
      title: 프로토타입
      period: 7-10주차
      items:
        - 샘플 생산
        - 품질 테스트 (압력, 부력, UV)
        - 설계 조정
        - 최종 승인
    - phase: 4단계
      title: 생산
      period: 11-14주차
      items:
        - 대량 생산
        - QC 검사 (단위당)
        - 해상 운송 / 항공 운송
        - 통관 서류
    - phase: 5단계
      title: 출시
      period: 15-16주차
      items:
        - 제품 사진 촬영
        - 웹사이트 제품 피드
        - 마케팅 자료
        - 런칭 지원
packages:
  title: 스타트업 패키지
  subtitle: 브랜드 성장의 모든 단계를 위한 패키지.
  items:
    - name: Starter Brand
      tagline: 50~100개 × 2종 보드 모델
      features:
        - 기본 로고 인쇄
        - 표준 포장
        - 이메일 지원
    - name: Growing Brand
      tagline: 300-1,000개 — 3-5가지 보드 모델
      features:
        - 커스텀 컬러 + 로고
        - 맞춤형 패키징
        - 제품 사진
        - 전담 매니저
    - name: Established Brand
      tagline: 1,000개 이상 — 전체 제품 라인
      features:
        - 완전한 맞춤 제작
        - 프리미엄 패키징
        - 마케팅 자료
        - 우선 생산
features:
  title: 왜 브랜드가 Afarer를 선택하는가
  subtitle: 10년 이상의 OEM 경험, 완벽한 인증, 업계 최저 MOQ.
  items:
    - title: 10년 이상 OEM 경험
      description: 전 세계 브랜드에 2,400개 이상의 선체를 납품했습니다.
      icon: tabler:clock
    - title: 완전한 인증
      description: CE / ISO / UKCA / BSCI / REACH — 모두 인증 완료.
      icon: tabler:certificate
    - title: 30일 리드타임
      description: 주문에서 배송까지 업계 평균보다 빠른 납기.
      icon: tabler:truck-delivery
    - title: 낮은 MOQ
      description: 최소 50대부터 — 업계 최저 수량.
      icon: tabler:package
    - title: 사내 디자인
      description: 컨셉부터 최종 아트워크까지 완전한 디자인 지원.
      icon: tabler:palette
    - title: 글로벌 물류
      description: 해상 운송, 항공 운송 및 통관 지원.
      icon: tabler:world
cta:
  title: 브랜드를 출시할 준비가 되셨나요?
  subtitle: 브랜드 여정을 시작하거나 OEM 가이드를 다운로드하세요.
  actions:
    - text: 귀하의 브랜드 여정을 시작하십시오
      href: /contact?package=oem
      variant: primary
    - text: OEM 가이드 다운로드
      href: /resources/download-catalog
      variant: secondary

hero:
  tagline: 규정 준수
  title: 팽창식 수상선박의 CE 인증 절차
  subtitle: 7분 읽기
content_html: |
  <h2>CE 인증이란?</h2>
  <p>CE 마크(Conformité Européenne)는 제품이 EU의 보건, 안전 및 환경 요건을 충족함을 나타냅니다. 인플레이션 수자국의 경우 관련 규제 프레임워크는 제품 카테고리에 따라 달라집니다.</p>

  <h2>적용 가능한 지침</h2>

  <h3>레저용 선박 지침(2013/53/EU)</h3>
  <p>대부분의 인플레이션 보트, SUP, 카약에 적용되는 주요 지침입니다. 선체 길이 2.5m~24m의 레저용 선박, 부분 완성 보트(OEM 공급용) 및 개인 수자국에 적용됩니다.</p>

  <h3>개인 보호구 규칙(2016/425)</h3>
  <p>수자국과 함께 공급되는 구명조끼, 부력 보조기 및 안전 장비는 인정 기관에 의한 형식 시험(Module B) 및 생산 품질 보증(Module D 또는 E)을 포함한 PPE 규칙 요건을 충족해야 합니다.</p>

  <h2>인증 프로세스</h2>
  <ol>
    <li>제품 분류: 선박 설계 카테고리 결정(ISO 8666에 따른 A–D)</li>
    <li>적용 표준: EN ISO 6185(제1–4부), EN ISO 10087(HIN), EN ISO 14945(제조사 판넬)</li>
    <li>기술 서류 준비: 설계 도면, 자재 명세서, 자재 인증서, 위험 평가</li>
    <li>형식 시험: 부력, 안정성, 하중 용량, 자재 시험, 이음새 강도, 기밀성</li>
    <li>공장 생산 관리: 인정 기관의 제조 공정 감사</li>
    <li>적합성 선언: 제조사가 DoC 서명, CE 마크 부착</li>
  </ol>

  <h2>인플레이션 수자국 인정 기관</h2>
  <p>일반적인 NB에는 Bureau Veritas(프랑스), DNV GL(독일), RINA(이탈리아), TÜV Rheinland / TÜV SÜD(독일)가 있습니다.</p>

  <h2>일정 및 비용</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">단계</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">소요 기간</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">일반적인 비용(EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">기술 서류 준비</td><td class="p-3 border">2–4주</td><td class="p-3 border">2,000–5,000</td></tr>
      <tr><td class="p-3 border">형식 시험</td><td class="p-3 border">4–8주</td><td class="p-3 border">8,000–20,000</td></tr>
      <tr><td class="p-3 border">공장 감사</td><td class="p-3 border">1–2일(현장)</td><td class="p-3 border">3,000–6,000</td></tr>
      <tr><td class="p-3 border">총 합계(첫 번째 제품)</td><td class="p-3 border">8–14주</td><td class="p-3 border">13,000–31,000</td></tr>
    </tbody>
  </table>

  <h2>구매자에게 의미하는 것</h2>
  <p>CE 인증 인플레이션 보트를 구매할 때는 항상 CE 마크가 제조사 판넬에 있는지, 유효한 DoC가 있는지, 인정 기관 번호가 기재되어 있는지, 소유자 설명서에 현지 언어로 된 안전 지침이 포함되어 있는지 확인하세요. 모든 Afarer 제품은 인정 기관 감사 보고서까지 완전한 추적성이 가능한 CE 인증을 보유하고 있습니다.</p>

  description: 인플레이터블 보트, SUP 및 카약을 위한 CE 인증 완전 가이드. 적용 지침(2013/53/EU RCD, PPE 2016/425), 테스트 프로토콜, 지정 기관, 기술 파일 요구사항 및 제조업체 의무.

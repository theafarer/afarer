    - [테스트 주문, 10–30, 30~45일, 100% 선결제]
    - [공인 딜러, 30–50, 30~45일, 계약금 30% / 출하 전 70%]
    - [국가 / 지역 유통업자, 100–300, 30~45일, 계약금 30% / 출하 전 70%]
    - [맞춤 및 자체 브랜드 (표준), 50+, 30~45일, 계약금 30% / 출하 전 70%]
    - [심층 맞춤화 (새 금형, 포장), 200+, 45~60일, 계약금 30% / 출하 전 70%]
    - [전체 제품 라인 권리, 300–1, 000, 60~90일, 계약금 30% / 출하 전 70%]
faqs:
  title: '유통업자 프로그램 — 자주 묻는 질문'
  subtitle: '유통업자들이 신청하기 전에 묻는 모든 것.'
  items:
    - title: '한 국가, 한 유통업자는 무슨 뜻인가요?'
      description: 'Afarer는 국가 또는 지역에 대해 단일 공인 유통업자에게 독점권을 부여합니다. 시장은 여러분의 것입니다. 병행 수입도 내부 경쟁도 없습니다.'
    - title: '최소 첫 주문은 얼마인가요?'
      description: '국가·지역 유통업자는 100~300개, 공인 딜러는 30~50개부터 시작합니다. 테스트 주문은 10~30개로 먼저 시장을 검증할 수 있습니다(지역 보호 없음).'
    - title: '유통업자는 어떤 지원을 받나요?'
      description: '유통업자 성공 프로그램에는 온보딩, 시장 진출 계획, 제품·판매 교육, 데모 플리트 지원, 현지화된 마케팅 자료, 전담 담당자가 포함됩니다.'
    - title: 'Afarer는 채널 갈등으로부터 저를 어떻게 보호하나요?'
      description: '각 지역에는 공인 유통업자가 정확히 한 명 있습니다. 해당 지역의 직접 주문은 모두 여러분을 통해 처리되며, 가격은 마진을 보호하도록 설정됩니다.'
    - title: '배송 및 결제 조건은 무엇인가요?'
      description: '주문은 완전한 수출 서류와 함께 FOB 칭다오로 발송됩니다. 생산 주문은 계약금 30%, 출하 전 70%; 테스트·샘플 주문은 선결제입니다.'
    - title: '어떻게 신청하나요?'
      description: '문의 양식으로 신청서를 보내주세요. 시장 적합성, 소매 유통망, 물류 역량을 평가하고 영업일 기준 3일 이내에 다음 단계와 유통 계약서 양식을 회신합니다.'

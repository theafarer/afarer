faqs:
  title: '국가 파트너십 — FAQ'
  subtitle: '진지한 국가 파트너들이 신청 전에 묻는 질문들.'
  items:
    - title: '한 국가 한 유통업자가 정확히 무엇을 의미하나요?'
      description: 'Afarer는 정의된 영역에 대해 독점권을 가진 단일 공인 유통업자를 지정합니다. 보호받는 국가에 우리의 글로벌 또는 지역 채널에서 판매하지 않습니다. Distribution Agreement 조건을 충족하는 한 여러분의 영역 소유권은 유지됩니다.'
    - title: '영역 독점권이 영원한가요?'
      description: '아니요. 독점권은 조건부이며 영구적이지 않습니다. 서명된 Distribution Agreement, 첫 주문 완료, 연간 구매 목표, 현지 재고, 애프터서비스 역량, 지속적인 시장 투자를 통해 유지됩니다. 이러한 조건이 충족되지 않으면 영역은 재협상되거나 재배정될 수 있습니다.'
    - title: '최소 첫 주문은 얼마인가요?'
      description: '국가 및 지역 유통업자는 100–300 units부터, 공인 딜러는 30–50 units, 테스트 주문은 10–30 units로 먼저 시장을 검증할 수 있습니다 (테스트 및 샘플 주문에는 지역 보호가 적용되지 않습니다). Custom 및 Private Label 프로그램은 위 등급에 명시된 별도의 MOQ를 따릅니다.'
    - title: '10개 모듈 지원 프로그램에는 어떤 지원이 포함되나요?'
      description: '등급 및 자격, 영역 보호, MOQ / 가격 / 연간 리베이트, 재고 및 주문 실행, 마케팅 자산 및 공동 시장 펀드, 제품 / 판매 / 기술 교육, 예비 부품 및 애프터서비스, 보증 등록, 파트너 포털, 그리고 제품 데이터시트, 마케팅 자산 라이브러리, 연간 리베이트 일정, 배송 및 포장 목록.'
    - title: 'Afarer는 채널 갈등에서 저를 어떻게 보호하나요?'
      description: '각 영역에는 정확히 한 명의 공인 유통업자가 있습니다. 해당 지역의 문의 및 직접 주문은 모두 여러분을 통해 처리되고, 웹사이트 양식은 현지 파트너가 있는 경우 해당 파트너에게 전달되며, 글로벌 팀은 파트너가 응답하지 않을 때만 개입합니다.'
    - title: '배송 및 결제 조건은 무엇인가요?'
      description: '주문은 완전한 수출 서류와 함께 FOB Qingdao로 발송됩니다. 생산 주문은 계약금 30%와 출하 전 70%; 테스트 및 샘플 주문은 선결제입니다. 표준 리드타임은 30–45 영업일이며, 샘플 생산은 15–20 영업일입니다.'
    - title: '어떻게 신청하나요?'
      description: '문의 양식을 통해 시장 세부 정보와 함께 신청서를 보내주세요. 시장 적합성, 소매 유통망, 물류 역량을 검토한 후 3 영업일 이내에 다음 단계와 샘플 Distribution Agreement로 답변드립니다.'

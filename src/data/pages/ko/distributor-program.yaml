    - title: '공장 직판 마진 및 리베이트'
      description: '약정 수량에 따른 리베이트가 포함된 딜러 가격표. 중간상 없음. 완전한 수출 서류와 함께 FOB Qingdao 배송.'
      icon: 'tabler:coins'
    - title: '10개 모듈 파트너 지원 프로그램'
      description: '온보딩, 시장 진출, 교육, 마케팅 및 공동 시장 펀드, 예비 부품 및 애프터서비스, 보증, 주문 도구, 파트너 포털 — 모두 Distribution Agreement에 포함됩니다.'
      icon: 'tabler:rocket'
    - title: '마케팅 및 공동 시장 펀드'
      description: '현지화된 캠페인 자산, 딜러 판매 시점 자료, 이벤트 키트, 다국어 디지털 콘텐츠, 그리고 출시 시즌을 위한 공동 마케팅 지원.'
      icon: 'tabler:mood-smile'
    - title: '제품·판매·기술 교육'
      description: '제품, 판매, 기술 지식에 대한 체계적인 온보딩 세션과 라인업이 발전함에 따라 업데이트되는 교육 자료.'
      icon: 'tabler:presentation'
    - title: '예비 부품 및 애프터서비스 지원'
      description: '예비 부품 공급, 보증 등록 및 클레임 처리, 그리고 현지 서비스 팀을 위한 제품 데이터시트와 매뉴얼.'
      icon: 'tabler:settings'
    - title: '전담 담당 매니저 및 파트너 포털'
      description: '개인 전담 유통 매니저와 함께 Afarer 파트너 포털을 통한 가격표, 주문 상태, 마케팅 리소스 접근 권한.'
      icon: 'tabler:user-check'
table:
  title: '파트너십 등급, MOQ 및 주문 조건'
  subtitle: '시장 잠재력에 맞는 등급을 선택하세요. 모든 가격은 USD, FOB Qingdao 기준입니다.'
  caption: '샘플 및 테스트 주문 (5–30 units)은 지역 보호 대상이 아닙니다. 국가 독점권은 서명된 Country / Regional Distributor 계약에만 적용됩니다. 이는 첫 주문 완료, 연간 구매 목표, 현지 재고, 애프터서비스 역량, 지속적인 시장 투자를 통해 유지되며, 영구적이거나 무기한의 권리가 아닙니다.'

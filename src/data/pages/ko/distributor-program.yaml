features:
  title: 'Afarer와 파트너십을 맺어야 하는 이유'
  subtitle: '믿을 수 있는 브랜드와 함께 수상 스포츠 비즈니스를 구축하려는 채널 파트너를 위해 설계되었습니다.'
  columns: 3
  items:
    - title: '지역 독점권'
      description: '국가 또는 지역에서 보호되는 시장. 유통업자 한 곳, 내부 경쟁 없음, 채널 갈등 없음 — 투자가 곧 자신만의 해자입니다.'
      icon: 'tabler:shield-check'
    - title: '공장 직판 마진'
      description: '약정 수량에 따른 할인이 적용된 유통업자 가격표. 중간상 없음. 완전한 수출 서류 포함 FOB 칭다오 배송.'
      icon: 'tabler:coins'
    - title: '유통업자 성공 프로그램'
      description: '체계적인 온보딩, 시장 진출 계획, 제품·판매 교육, 데모 플리트 지원, 공동 마케팅 도구.'
      icon: 'tabler:rocket'
    - title: '마케팅 및 브랜드 지원'
      description: '현지화된 캠페인 자료, 판매 시점 자료, 이벤트 키트, 다국어 디지털 콘텐츠.'
      icon: 'tabler:mood-smile'
    - title: '신뢰할 수 있는 공급망'
      description: 'ISO·CE 인증 생산, 일관된 품질 관리, 예측 가능한 MOQ, 계획할 수 있는 납기 일정.'
      icon: 'tabler:building-factory'
    - title: '전담 담당자'
      description: '수요 예측, 주문 계획, 애프터서비스 지원을 위한 개인 전담 유통 매니저.'
      icon: 'tabler:user-check'

meta:
  title: SUP 렌탈 플리트 솔루션 | {SITE}
  description: 일일 렌탈 사용을 위해 설계된 고빈도 사용형 SUP 보드. UV 저항 PVC, 보강된 시임, 빨리 마르는 소재. Afarer와 함께 렌탈 비즈니스를 확장하세요.
hero:
  tagline: 렌탈 운영업체
  title: 자신 있게 대여 사업을 확장하세요<br />
  subtitle: 연 365일 매일 렌탈 사용을 위해 설계된 고회전율 SUP 보드. 귀하의 수익은 하루도 쉬지 않습니다.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 게스트를 위한 SUP 보드가 준비된 번화한 렌탈 키오스크
features:
  title: 렌탈 사용에 최적화
  subtitle: 모든 보드는 최소한의 유지보수로 500회 이상의 렌탈 사이클을 견디도록 설계되었습니다.
  items:
    - title: 500회 이상의 대여 사이클
      description: 해수, 자외선, 모래에서의 일일 사용을 견디도록 테스트됨.
      icon: tabler:shield-check
    - title: 자외선 차단 직물
      description: 1년간 야외 보관 후 변색이나 열화 없음.
      icon: tabler:sun
    - title: 강화 시임
      description: 표준 팽창식 보드 구조 대비 3배 강력.
      icon: tabler:layers-intersect
    - title: 쾌속 건조 소재
      description: 보드가 30분 이내에 다음 렌탈 준비 완료.
      icon: tabler:droplet
    - title: 적층 보관
      description: 공간 절약 디자인 — 동일 면적에 40% 더 많은 보드를 보관할 수 있습니다.
      icon: tabler:stack
    - title: 색상 코딩 사이즈
      description: 스태프가 색상 코딩된 사이즈로 즉시 적절한 보드를 선택할 수 있습니다.
      icon: tabler:color-swatch
stats:
  title: 운영 지표
  stats:
    - title: 보드 회전율
      amount: < 5분
    - title: 연간 유지보수
      amount: ~15분/보드
    - title: 부품 출하
      amount: 48h
    - title: 불량률
      amount: < 0.5%
fleet_guide:
  title: 플리트 규격 가이드
  subtitle: 귀하의 렌탈 운영을 위한 fleet 규모 및 수익 잠재력을 추정합니다.
  tiers:
    - label: 소규모 키오스크
      boards: 15-20
      revenue: $XX,XXX/yr
    - label: 중규모 운영
      boards: 30-50
      revenue: $XX,XXX/yr
    - label: 대형 해변 렌탈
      boards: 50-100
      revenue: $XXX,XXX/년
cta:
  title: 렌탈 사업을 확장할 준비가 되셨나요?
  subtitle: 렌탈 가격 확인 또는 운영에 맞는 보드 모델 비교.
  actions:
    - text: 렌탈 가격 확인
      href: /contact?package=rental
      variant: primary
    - text: 보드 모델 비교
      href: /compare
      variant: secondary

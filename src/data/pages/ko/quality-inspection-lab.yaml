meta:
  title: 품질 및 검사 랩 — ISO 규격 RIB 테스트 및 인증 | {SITE}
  description: 인플레이터블 보트에 대한 독립적인 품질 검증 서비스입니다. 인장 테스트, 공기 유지 사이클 테스트, 이음매 박리 테스트, 소재 인증을 제공하며, 제3자 테스트는 당사 품질랩으로 문의하십시오.
back_text: R&D 센터로 돌아가기
home_label: 홈
hero:
  tagline: 연구실 06
  title: 품질 및 검사 연구소
  subtitle: 독립적 검증 — 납품 전 모든 테스트 통과
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: Afarer 품질 검사 연구소 UV 테스트
intro: 우리 작업장을 떠나는 모든 보트는 정해진 품질 검사 및 소재 시험을 통과한 인증을 갖추고 있습니다. 품질 및 검사 실험실은 조직 내 독립 기능으로 — 생산 부서가 아닌 대표이사에게 직접 보고하여 — 어떤 상업적 압력도 검사 기준을 훼손할 수 없도록 보장합니다. 원자재 배치 또는 완성 보트가 공개 사양을 충족하지 못할 경우, 실험실은 적합성이 해소될 때까지 출하를 중단할 권한을 보유합니다.
content_html: |
  <h2>신뢰하지만, 검증하세요</h2>
  <p>우리 실험실은 원칙에 부합하는 품질 관리 시스템 하에서 운영되며, 테스트 방법은 가능한 모든 경우 ISO, ASTM, EN 기준을 기반으로 합니다. 수행된 모든 테스트의 상세한 기록을 유지하여, 원자재 입고부터 최종 보트 납품까지 완전한 추적 체인을 구축합니다.</p>

  <h2>테스트 장비 및 역량</h2>
  <table>
    <thead><tr><th>장비</th><th>수행 테스트</th><th>기준 / 방법</th></tr></thead>
    <tbody>
      <tr><td>범용 시험기 (50 kN)</td><td>인장 강도 (원단), 박리 저항 (이음새), 파열 전파</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>공기 유지 테스트 장비 (프로그래밍 가능)</td><td>1000회 충전/방전 내구성, 30분 압력 유지 테스트</td><td>ISO 6185 (내부 기준)</td></tr>
      <tr><td>이음새 박리 시험기 (모터 구동 180° 박리)</td><td>용접 및 접착 이음새 박리 강도 (100 mm/min)</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>수두 시험기</td><td>원단의 침수 저항성 (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>디지털 두께계 및 마이크로미터</td><td>원단 두께, 튜브 벽 두께, 접착 필름 두께</td><td>ISO 2286-3</td></tr>
      <tr><td>환경 챔버</td><td>온도 조건 (-40°C ~ +80°C) 저온 균열 및 열 노화 테스트</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>색채 분광광도계</td><td>UV 노출 후 Delta-E 색상 측정</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>검사 게이트 — 원자재에서 납품까지</h2>
  <p>모든 보트는 필수 검사 지점이 포함된 정의된 품질 계획을 따릅니다. 어떤 보트도 게이트를 건너뛸 수 없으며, 각 게이트는 다음 생산 단계가 시작되기 전에 품질 검사관의 승인을 받아야 합니다.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">게이트 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">입고 자재 검사</p>
            <p class="text-xs text-gray-500 mt-1">원단 배치, 접착제 배치, 하드웨어 — 생산 투입 전 입고 사양에 따라 모두 검사됩니다.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">게이트 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">공정 중 용접 검사</p>
            <p class="text-xs text-gray-500 mt-1">각 생산 교대 시작 시 최초 용접 시편 테스트 (박리 + 육안 검사).</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">게이트 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">챔버 공기 테스트</p>
            <p class="text-xs text-gray-500 mt-1">각 챔버를 작동 압력의 1.5배로 가압하여 30분간 유지. 시리얼 넘버별로 데이터 기록.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">게이트 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">출하 전 검사</p>
            <p class="text-xs text-gray-500 mt-1">완제품 보트 검사: 모든 고정 장치 토크 체결, 시스템 기능 정상, 외관상 결함 없음. 100항목 체크리스트.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">게이트 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">최종 인증</p>
            <p class="text-xs text-gray-500 mt-1">테스트 보고서 작성, 검사 기록 검토, 적합성 인증서 발행.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>핵심 품질 지표 (2025년 이동 평균)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">초도 합격률 (원단 배치)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">용접 불합격률 (선형 미터)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">조립 전 챔버 공기 테스트 완료</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">설계 카테고리 준수</span>
    </div>
  </div>

  <h2>우리의 품질 팀</h2>
  <p>우리 실험실은 품질 관리 책임자(해양 QA 10년 경력, ASQ 공인 품질 엔지니어), 두 명의 품질 검사관(각각 육안 검사 NDT 2급 자격 보유), 그리고 모든 물리적 테스트를 담당하는 자재 기술자로 구성됩니다. 이 팀은 독립된 제3자 제공업체를 통해 연간 숙련도 테스트를 수행하여 테스트 결과의 정확성과 재현성을 보장합니다.</p>

  <h2>고객을 위한 독립 테스트</h2>
  <p>우리의 품질 및 검사 실험실은 독립 테스트 서비스를 제공합니다. 원단 사양 검증, 새로운 접착 시스템 유효성 확인, 또는 조달 자격을 위한 제3자 테스트 보고서가 필요한 경우, 해당 기준에 따라 테스트를 수행하고 인증된 테스트 보고서를 발행할 수 있습니다.</p>
  <p>최근 제3자 테스트 작업 사례:</p>
  <ul>
    <li>유럽 군사 조달 프로그램을 위한 5종 경쟁 접착 필름 제품의 박리 강도 비교.</li>
    <li>새로운 주황색 안료 PVC 제형의 가속 노화 연구 (UV + 열 순환), 500시간 간격의 정기 중간 측정.</li>
    <li>새로운 고압 튜브 설계를 위한 50개 프로토타입 배플 밸브의 공기 유지 유효성 검증.</li>
  </ul>

  <h2>고객에 대한 우리의 약속</h2>
  <p>{SITE.name} 보트를 수령하시면 해당 보트에 적용되는 테스트 결과의 편집된 기록인 품질 문서도 함께 제공됩니다. 원단 배치 인증서, 용접 박리 테스트, 챔버 공기 테스트 기록, 출하 전 검사 체크리스트. 모든 수치는 추적이 가능합니다. 모든 검사관은 확인 가능합니다. 이것은 단순한 서류 작업이 아닙니다 — 우리가 명시한 사양대로 납품했다는 우리의 약속입니다.</p>
  <p>품질 관련 우려 사항이 있으시면 실험실에 직접 연락하실 수 있습니다 — 연락처는 적합성 인증서에 인쇄되어 있습니다. 모든 문의를 진지하게 받아들이며, 48시간 이내에 공식 조사를 진행할 것을 약속드립니다.</p>

meta:
  title: 'Center za raziskave in razvoj | {SITE}'
  description: 'Raziskave in razvoj — preskušanje tkanin PVC, inženiring trupov, varjenje RF, hidrodinamično preskušanje in nadzor kakovosti. Storitve raziskav in razvoja po meri so na voljo.'

hero:
  tagline: 'Center za raziskave in razvoj'
  title: 'Center za raziskave in razvoj'
  subtitle: 'Usmerjeni v napredek'

intro:
  - 'Center afarer za raziskave in razvoj (R&D) je gonilna sila našega poslanstva preoblikovanja opreme za vodne športe. Ljubiteljem vodnih športov po vsem svetu omogočamo varnejše, bolj udobne in prijetnejše izdelke z neomajnim inoviranjem na področju napihljivih desk za stoječe veslanje (SUP). Naša predana ekipa inženirjev, oblikovalcev in strastnih strokovnjakov za vodne športe oblikuje prihodnost panoge in dosledno dviguje merila kakovosti, zmogljivosti in trajnosti.'
  - 'Naša raziskovalno-razvojna naprava povezuje znanstvenike s področja materialov ter pomorske in proizvodne inženirje pod eno streho. Od formulacij tkanin in simulacij trupov do razvoja postopkov varjenja in preskušanj na morju v polni velikosti je vsaka stopnja razvoja izdelka podprta s podatki in potrjena s preskušanjem.'

mission:
  tagline: 'Naše poslanstvo'
  title: 'Inoviranje prihodnosti vodnih športov'
  pillars:
    - icon: lightning
      title: 'Tehnološki napredek'
      desc: 'Pionirstvo novih materialov, oblik in proizvodnje za vrhunsko zmogljivost in dolgo življenjsko dobo izdelkov.'
    - icon: design
      title: 'Oblikovanje osredotočeno na uporabnika'
      desc: 'Globoko razumevanje in preseganje potreb uporabnikov z ergonomskim in intuitivnim oblikovanjem izdelkov.'
    - icon: globe
      title: 'Trajnostne prakse'
      desc: 'Zmanjševanje našega okoljskega odtisa z uporabo okolju prijaznih materialov in postopkov.'
    - icon: shield
      title: 'Neomajna varnost'
      desc: 'Zagotavljanje najvišjih varnostnih standardov z doslednim preskušanjem in certificiranjem.'

pillars:
  - title: 'Tehnološki napredek'
    desc: 'Pionirstvo novih materialov, oblik in proizvodnih postopkov za vrhunsko zmogljivost in dolgo življenjsko dobo izdelkov.'
    icon: tech
  - title: 'Napredni materiali'
    desc: 'Raziskovanje najsodobnejših materialov PVC, kompozitov in trajnostnih alternativ za izboljšane lastnosti izdelkov.'
    icon: materials
  - title: 'Trajnost'
    desc: 'Temeljna zaveza: Posvečeni smo skrbni za okolje s trajnostno proizvodnjo in recikliranimi materiali.'
    icon: sustainability

capabilities:
  tagline: 'Zmožnosti'
  title: 'Zmožnosti raziskav in razvoja'
  subtitle: 'Štiri temeljne discipline, ki nam dajejo popoln nadzor nad razvojem izdelkov — od raziskav surovin do končne certifikacije.'
  groups:
    - title: 'Znanost o materialih in tehnologija tkanin'
      items:
        - 'Analiza in optimizacija formulacij PVC'
        - 'Razvoj dodatkov za stabilizacijo proti UV, negorljivost in antimikrobno zaščito'
        - 'Večplastna laminacija tkanin in inženiring oprijema'
        - 'Pospešeno preskušanje staranja (UV, toplota, vlažnost, slana meglica)'
    - title: 'Inženiring trupov in hidrodinamika'
      items:
        - 'Parametrično 3D oblikovanje trupov in optimizacija CFD'
        - 'Analiza končnih elementov za strukturne in udarne obremenitve'
        - 'Preskušanje vlečenja modelov v merilu in preverjanje zmogljivosti'
        - 'Razvoj trupov po meri za posebne profile uporabe'
    - title: 'Tehnologija varjenja in spajanja'
      items:
        - 'Razvoj in optimizacija postopka dielektričnega varjenja RF'
        - 'Metode varjenja z vročim zrakom, vročim klinom in z ultrazvokom'
        - 'Lepljenje in kvalifikacija lepilnih trakov za šive'
        - 'Modeliranje trdnosti varov in napoved življenjske dobe'
    - title: 'Preskušanje, certifikacija in skladnost'
      items:
        - 'Upravljanje kakovosti in preskušanje skladnosti s CE'
        - 'Neodvisno preskušanje tretjih oseb in podpora pri certifikaciji'
        - 'Razvoj protokolov preskušanj po meri za kvalifikacijo javnih naročil'
        - 'Analiza odpovedi v uporabi in raziskovanje vzrokov'


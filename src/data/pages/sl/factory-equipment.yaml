meta:
  title: 'Tovarniška oprema — rezanje, VF-varjenje in tiskanje | {SITE}'
  description: 'Industrijska proizvodna oprema afarer: rezanje PVC, VF-varjenje, digitalno tiskanje, sestavljanje in preskušanje napihljivih desk SUP.'
  keywords:
    - 'oprema za proizvodnjo sup'
    - 'tovarna napihljivih sup'
    - 'vf-varjenje pvc'
    - 'proizvodnja desk za veslanje'
hero:
  tagline: 'Oprema'
  title: 'Proizvodna oprema in stroji'
  subtitle: 'Industrijska oprema za rezanje, varjenje, tiskanje in sestavljanje'
  back_label: 'Nazaj na tovarno'
  back_link: /factory/

categories:
  - title: 'Rezanje in priprava materialov'
    items:
      - name: 'Avtomatski stroj za rezanje PVC'
        spec: 'CNC-krmiljen, 6,5 m × 2,5 m, natančnost 0,1 mm'
        desc: 'Računalniško krmiljen avtomatski stroj za rezanje PVC in tkanin drop-stitch. Programska oprema za gnezdenje optimizira izrabo materiala na manj kot 5 % odpadkov.'
      - name: 'Razgrnjalnik tkanin'
        spec: 'največja širina 3 m, napajanje z nadzorom napetosti'
        desc: 'Polaga tkanino v eni ali več plasteh z nadzorovano napetostjo, da se pred rezanjem prepreči popačenje.'

  - title: 'Varjenje in spajanje cevi'
    items:
      - name: 'Stroj za toplotno zavarjevanje'
        spec: 'varjenje z vročim zrakom, nastavljivo 200–600 °C, 0,5–5 m/min'
        desc: 'Stroj za toplotno zavarjevanje z vročim zrakom za spajanje in varjenje PVC ter šivov robov. Uporablja se za začasno spajkanje, tesnjenje in zlivanje komor cevi in spojev plovcev.'
      - name: 'Dielektrična VF-presa'
        spec: '15 kW, pladenj 2000 × 600 mm'
        desc: 'Radiofrekvenčna varilna presa za glavne vzdolžne šive, robne pasove in izdelavo velikih komor.'
      - name: 'VF-varilni stroj s krmiljenjem CNC'
        spec: '8 kW, XY-miza 2500 × 1200 mm'
        desc: 'Programirljivo varjenje zakrivljenih šivov za kompleksne geometrije, reliefne logotipe in natančno krpanje.'

  - title: 'Izdelava desk SUP'
    items:
      - name: 'Presa za laminiranje jeder drop-stitch'
        spec: 'presa velikega formata za jedra desk do 14 ft dolžine'
        desc: 'Natančno laminiranje jeder drop-stitch na zunanje laminate iz PVC. Vsaka plast je prilepljena pod pritiskom za dosledno kakovost in trdnost.'
      - name: 'CNC-freza (5-osna)'
        spec: 'delovni prostor 3 m × 2 m × 1 m, vodno hlajeno vreteno'
        desc: 'Obdelava mest za plavutke, izrezi za ročaje in komponente desk po meri.'

  - title: 'Tiskanje in okraševanje desk SUP'
    items:
      - name: 'Digitalni tiskalnik'
        spec: 'visokoločljivostni brizgalni tisk, širina tiska do 2 m'
        desc: 'Digitalno tiskanje neposredno na tkanino za polnobarvno grafiko palub SUP. Natisne vzorce po meri, prelive in fotografije kakovosti z vodnimi črnili, odpornimi na UV.'
      - name: 'Stroj za sitotisk'
        spec: 'ročno in polavtomatsko, večbarvna registracija'
        desc: 'Sitotisk logotipov desk SUP, znamk in ponavljajočih se vzorcev. Zagotavlja trajne, pokrivne odtiske z živahno nasičenostjo barv.'

  - title: 'Sestavljanje in opremljanje'
    items:
      - name: 'Postaja za sestavljanje desk'
        spec: 'modularna nastavljiva, večpostavna razporeditev'
        desc: 'Sestavljanje mest za plavutke, ročajev, D-obročev, ventilov in palubnih blazin na deske SUP.'
      - name: 'Presa za vgradnjo ventilov'
        spec: 'pnevmatska, nastavljiv tlak'
        desc: 'Natančna vgradnja in tesnjenje ventilov Halkey-Roberts in Leafield.'
      - name: 'Laminator palubnih blazin'
        spec: '3 m × 1,5 m, nadzor temperature'
        desc: 'Toplotno laminiranje palubnih blazin iz EVA-pene na zgornje ploskve desk SUP z dosledno trdnostjo spoja.'

  - title: 'Preskušanje in kontrola kakovosti'
    items:
      - name: 'Univerzalna natezna naprava'
        spec: '50 kN, ASTM D751'
        desc: 'Preskušanje pretrgalne sile, raztezka ob pretrgu in širjenja strga za serije tkanin.'
      - name: 'Naprava za preskus zadrževanja zraka'
        spec: 'programirljiva, 30-minutno zadrževanje tlaka'
        desc: 'Avtomatiziran preskus zadrževanja tlaka za vsako komoro cevi pred sestavljanjem.'
      - name: 'Preizkuševalec luščenja šivov'
        spec: 'motorizirano luščenje 180° pri 100 mm/min'
        desc: 'Preskušanje trdnosti luščenja varjenih in lepljenih šivov po EN ISO 25649.'
      - name: 'Klimatska komora s ksenonsko oblo'
        spec: 'izpostavljenost 2000 h'
        desc: 'Preskušanje odpornosti na UV glede spremembe barve in ohranitve trdnosti.'

cta:
  title: 'Zanima vas ogled tovarne?'
  desc: 'Obiskovalce na našem objektu v Qingdaou z veseljem sprejemamo. Osebno si oglejte našo opremo in procese.'
  label: 'Dogovorite obisk →'
  link: /contact/

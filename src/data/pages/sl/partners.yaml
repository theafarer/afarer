meta:
  title: 'Partnerji — distribucija in prodaja na debelo | {SITE}'
  description: 'Postanite partner afarer: distribucijska omrežja, cene na debelo, programi OEM/zasebnih znamk in podpora podjetjem za deske za veslanje po vsem svetu.'
  keywords:
    - 'distribucijski partner sup'
    - 'prodaja desk za veslanje na debelo'
    - 'distributer napihljivih sup'
    - 'partnerstvo sup'
hero:
  tagline: 'Partnerji in distribucija'
  title: 'Postanite partner afarer<br />— globalno distribucijsko omrežje'
  subtitle: 'Pridružite se globalnemu omrežju partnerjev afarer. Sodelujemo z pomorskimi distributerji, prodajalci veslaške opreme, trgovci z opremo in partnerji znamk v več kot 50 državah.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: 'globalno omrežje partnerjev in distributerjev afarer'
content_programs:
  tagline: 'Programi za partnerje'
  title: 'Programi za partnerje,<br />zgrajeni za rast'
  subtitle: 'Ne glede na to, ali ste distributer, prodajalec ali partner znamke, afarer ponuja programe, zasnovane za podporo vašemu podjetju.'
  columns: 3
  items:
    - title: 'Program za distributerje'
      description: 'Ekskluzivna teritorialna distribucija z volumenskimi cenami, podporo pri trženju in neposrednim dostopom do tovarne. Zahtevana najmanjša zavezanost glede na velikost ozemlja.'
      icon: tabler:world
    - title: 'Program za prodajalce'
      description: 'Neposredne prodajne cene za trgovce, usposabljanje o izdelkih, tržen materiali in garancijska podpora za prodajna mesta in spletne trgovine.'
      icon: tabler:building-store
    - title: 'Partnerstvo OEM/ODM'
      description: 'Celovita proizvodnja OEM in ODM z znamčenjem po meri, embalažo in specifikacijami izdelkov. Od koncepta do kontejnerja.'
      icon: tabler:certificate
    - title: 'Partnerstvo znamk'
      description: 'Skupne znamke, zasebne znamke in programi ekskluzivnih modelov za uveljavljene znamke na področju pomorske rekreacije in rekreacije na prostem.'
      icon: tabler:stars
    - title: 'Vladne in institucionalne stranke'
      description: 'Programi prednostnega dobavitelja za vladne agencije, obalne straže, vojsko in humanitarne organizacije. Dokumentacija, pripravljena za javna naročila.'
      icon: tabler:building-community
    - title: 'Partner letovišč in najemnikov'
      description: 'Cene za flote, dosledna kakovost in znamčenje po meri za letovišča, potapljaške centre in najemne operacije po vsem svetu.'
      icon: tabler:sun
content_benefits:
  tagline: 'Zakaj partnerstvo z nami'
  title: 'Zakaj partnerji izbirajo afarer'
  subtitle: 'Naši partnerji imajo koristi od prave proizvodne zmožnosti, dosledne kakovosti in odzivne podpore.'
  list:
    - 'Neposreden dostop do tovarne: delajte neposredno z našo proizvodno ekipo — brez posrednikov. Hitrejši odgovori, boljše cene in popoln vpogled v proizvodnjo.'
    - 'Pripravljenost na prilagoditve: opremite svoje izdelke z barvami, logotipi, embalažo in specifikacijami po meri. Najmanjše količine naročil, prilagojene vašemu trgu.'
    - 'Zagotovljena kakovost: proizvodnja s certifikatom ISO 9001 s skladnostjo CE, UKCA in BSCI. Vsak izdelek preskušen pred odpošiljanjem.'
    - 'Globalna logistika: odpošiljanje iz Qingdaoa na Kitajskem z možnostmi FOB, CIF in DDP. Skladišče v ZDA v Montclairju v Kaliforniji za distribucijo po Severni Ameriki.'
    - 'Podpora trženju: katalogi izdelkov, fotografije, tehnična dokumentacija in digitalna sredstva za podporo vašim prodajnim prizadevanjem.'
    - 'Usposabljanje in podpora: usposabljanje o izdelkih za vašo prodajno ekipo, tehnična podpora za vaše stranke in koordinacija garancijskega servisa.'
content_process:
  tagline: 'Kako postati partner'
  title: 'Preprost proces partnerstva'
  subtitle: 'Naš proces partnerstva je preprost — zasnovan tako, da začnete prodajati izdelke afarer čim prej.'
  items:
    - title: 'Korak 1: oddaja prijave'
      description: 'Izpolnite naš obrazec za prijavo partnerjev s profilom podjetja, ciljnim trgom in zanimanjem za izdelke.'
    - title: 'Korak 2: pregled kvalifikacije'
      description: 'Naša ekipa za partnerstva pregleda vašo prijavo in vas v 3 delovnih dneh kontaktira za pogovor o priložnostih.'
    - title: 'Korak 3: pogodba in nastavitev'
      description: 'Podpišite pogodbo o partnerstvu, nastavite svoj račun in prejmite partnerske cene, tržen material in vzorce izdelkov.'
    - title: 'Korak 4: usposabljanje in zagon'
      description: 'Usposabljanje o izdelkih, prodajna podpora in tržen material. Pripravljeni ste na začetek prodaje.'
cta:
  title: 'Pripravljeni postati partner afarer?'
  subtitle: 'Prijavite se na partnerstvo in naša ekipa bo odgovorila v 3 delovnih dneh.'
  actions:
    - variant: primary
      text: 'Prijavite se na partnerstvo'
      href: /contact/
    - text: 'Poglejte naše izdelke'
      href: /products/

body: |
  <h2>Kaj je napihljiva SUP deska?</h2>
  <p>Napihljiva SUP deska (deska za stoječe veslanje) je prenosno plovilo iz materiala drop-stitch PVC, ki ob napihovanju na visok tlak (12-15 PSI) postane toga. Za razliko od tradicionalnih trdih desk iz pene in steklenih vlaken se napihljivo SUP desko lahko izpusti, zloži in shrani v nosilno torbo velikosti nahrbtnika.</p>
  <p>Kljub napihljivosti sodobne SUP deske v večini rekreacijskih in turističnih namenov dosegajo togost in zmogljivost trdih desk. Ključna inovacija je <strong>konstrukcija drop-stitch</strong>: tisoči poliestrskih niti povezujejo zgornjo in spodnjo plast tkanine in preprečujejo, da bi se deska ob pritisku napihnila kot balon.</p>

  <h2>Kako deluje: tehnologija Drop-Stitch</h2>
  <p>Jedro vsake napihljive SUP deske je tkanina drop-stitch. Med proizvodnjo se med dve plasti tkanine s PVC-prevleko vplete tisoči niti. Ko je deska napihnjena:</p>
  <ul>
    <li>Niti pritegnejo zgornje in spodnje panele na fiksno razdaljo</li>
    <li>To ustvari togo, ravno platformo, ki se upira upogibanju</li>
    <li>Pri 12-15 PSI deska doseže togost, primerljivo z deskami z jedrom iz pene EPS</li>
  </ul>

  <h2>Ključne komponente</h2>
  <ul>
    <li><strong>Jedro iz PVC drop-stitch</strong> — Primarna strukturna plast, ki zagotavlja togost</li>
    <li><strong>Robne tračnice</strong> — Ojačani robovi, ki ščitijo pred obrabo in udarci</li>
    <li><strong>Podloga iz pene EVA</strong> — Protizdrsljiva površina za udobje stoje in oprijem</li>
    <li><strong>Sistem plavuti</strong> — Odstranljive plavuti za stabilnost smeri (običajno konfiguracija 2+1)</li>
    <li><strong>Ventil</strong> — Visokotlačni enosmerni ventil za napihovanje in izpuščanje</li>
  </ul>

  <h2>Pogosti primeri uporabe</h2>
  <ul>
    <li><strong>Veslanje po mirni vodi</strong> — Jezera, mirni zalivi in počasi tekoče reke</li>
    <li><strong>Turistično veslanje</strong> — Dolge razdalje na odprti vodi, ki zahtevajo učinkovito drsenje</li>
    <li><strong>Surfanje</strong> — Majhni do srednji valovi (od začetnika do srednje ravni)</li>
    <li><strong>Ribolov</strong> — Tihi dostop do plitvih voda za ribiče</li>
    <li><strong>Fitness</strong> — Joga na SUP, pilates in treng jedra na vodi</li>
    <li><strong>Potovanja</strong> — Prenosna zasnova je idealna za letalska in avtomobilska potovanja</li>
  </ul>

  <h2>Napihljiva proti trdi SUP deski: ključne razlike</h2>
  <table>
    <tr><th>Vidik</th><th>Napihljiva SUP deska</th><th>Trda SUP deska (EPS/steklena vlakna)</th></tr>
    <tr><td>Prenosljivost</td><td>Zloži se v nahrbtnik</td><td>Zahteva strešni nosilec ali veliko vozilo</td></tr>
    <tr><td>Trajnost</td><td>Odporna na udarce, brez vdolbin</td><td>Lahko se razpoke, vdolbi ali delaminira</td></tr>
    <tr><td>Shranjevanje</td><td>Prosti v omari ali prtljažniku</td><td>Potrebuje poseben prostor za shranjevanje</td></tr>
    <tr><td>Zmogljivost</td><td>Odlična za rekreacijo in turizem</td><td>Vrhunska za dirkanje in napredno surfanje</td></tr>
    <tr><td>Prijaznost do začetnikov</td><td>Mehkejša paluba, manjše tveganje poškodb</td><td>Trda površina, manj odpušča</td></tr>
    <tr><td>Čas priprave</td><td>3-5 minut napihovanja</td><td>Takoj pripravljena</td></tr>
  </table>

  <h2>Kako izbrati pravo SUP desko</h2>
  <p>Pri izbiri napihljive SUP deske upoštevajte te dejavnike:</p>
  <ul>
    <li><strong>Volumen (litri)</strong> — Določa plovnost. Večji volumen nosi večjo težo in zagotavlja stabilnost.</li>
    <li><strong>Dolžina</strong> — Daljše deske (11-14 ft) se bolje držijo smeri za turizem; krajše deske (9-10 ft) so bolj vodljive za surfanje.</li>
    <li><strong>Širina</strong> — Širše deske (32-36 in) so bolj stabilne; ožje deske (28-31 in) so hitrejše.</li>
    <li><strong>Debelina</strong> — 6-palčne deske ponujajo optimalno togost; 4.7-palčne deske so lažje in bolj prenosljive.</li>
    <li><strong>Kakovost konstrukcije</strong> — Za trajnost izberite fuzijsko laminirane ali tkane drop-stitch.</li>
  </ul>

  <h2>Pogosta vprašanja</h2>
  <h3>Je napihljiva SUP deska tako toga kot trda deska?</h3>
  <p>Pri pravilnem napihovanju (12-15 PSI) sodobne SUP deske drop-stitch dosegajo primerljivo togost za rekreacijsko veslanje. Trde deske imajo še vedno prednost pri dirkanju in naprednem surfanju zaradi manjše teže in bolj dodelanih lastnosti upogiba.</p>

  <h3>Koliko časa traja napihovanje?</h3>
  <p>Z dvojno delujočo črpalko večina desk doseže 12-15 PSI v 3-5 minutah. Električne črpalke so na voljo in skrajšajo čas napihovanja na približno 2 minuti.</p>

  <h3>Ali lahko napihljivo SUP desko vzamem v letalo?</h3>
  <p>Da. Izpuščena in zložena večina SUP desk sodi v nahrbtnik, ki ustreza zahtevam letalske oddane prtljage. Vedno preverite omejitve velikosti in teže pri svoji letalski družbi.</p>

  <h3>Kako trajne so napihljive SUP deske?</h3>
  <p>Napihljive SUP deske so zelo trajne. Konstrukcija iz PVC vojaške kakovosti se upira udarcem, prebojem in poškodbam zaradi UV. Manjše preboje lahko popravite na terenu s priloženim reparaturnim kompletom.</p>

  <h3>Kakšno vzdrževanje je potrebno?</h3>
  <p>Po uporabi v slani vodi izperite s sladko vodo. Hranite na hladnem, suhem mestu stran od neposredne sončne svetlobe. Med dolgotrajnim shranjevanjem desko delno napihnite, da ohranite obliko brez obremenjevanja šivov.</p>

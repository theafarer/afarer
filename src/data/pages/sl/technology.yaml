hero:
  tagline: Tehnologija
  title: Zgrajeno za zmogljivost
  subtitle: Vsako napihljivo desko SUP afarer zasnujemo s konstrukcijo drop-stitch in pomorskim PVC — natančni materiali in proizvodne metode, preskušene za zahtevna morska okolja.

sections:
  - title: Jedro Drop-Stitch
    description: Tisoče notranjih poliestrskih nitic povezuje zgornjo in spodnjo plast ter ustvarja tog struktur pri 12–15 PSI. Gre za isto tehnologijo, ki se uporablja v profesionalnih deskah za veslanje in napihljivih dirkalnih deskah SUP.
    imageAlt: Diagram jedra DS
  - title: Pomorski PVC
    description: Večplastna laminirana tkanina PVC, ocenjena za pomorska okolja. Vsaka plast je zvarjena z zlivanjem in ne lepljena, kar odpravlja tveganja delaminacije. Preskušena za odpornost proti UV, koroziji zaradi slane vode in obrabi.
    imageAlt: Plast PVC
  - title: Vojaški PVC
    description: Uporablja se na vseh modelih SUP; premium PVC ponuja vrhunsko odpornost proti UV in kemikalijam. Ohranja prožnost pri ekstremnih temperaturah in se upira razgradnji.
    imageAlt: PVC
  - title: Paluba Air Deck
    description: Napihljiva konstrukcija drop-stitch z visokim tlakom, ki zagotavlja izjemno togost za stoje, ribolov in jogo. Zmanjšuje čas priprave, skupno maso in prostor za shranjevanje.
    imageAlt: Air Deck


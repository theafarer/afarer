meta:
  title: 'Certifikati — CE, ISO 9001 in skladnost | {SITE}'
  description: 'Certifikati kakovosti afarer: CE (EN ISO 25649), ISO 9001:2015, BSCI. Skladnost in varnost proizvajalca napihljivih SUP desk.'
  keywords:
    - 'certifikat ce sup'
    - 'iso 9001 sup'
    - 'pomorska skladnost'
    - 'certifikacija veslaških desk'
hero:
  tagline: 'Certifikati in standardi'
  title: 'Certifikati kakovosti<br />in standardi skladnosti'
  subtitle: 'Proizvodnja SUP desk afarer je certificirana po mednarodnih standardih pomorske varnosti, sistemih upravljanja kakovosti in okoljskih predpisih — CE, ISO 9001, UKCA, BSCI in REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'certifikati kakovosti afarer in dokumentacija o skladnosti'
content_certifications:
  tagline: 'Naši certifikati'
  title: 'Certificirana kakovost,<br />svetovno priznana'
  subtitle: 'Vsak izdelek afarer podpirajo certifikati, ki dokazujejo našo zavezanost kakovosti, varnosti in okoljski odgovornosti.'
  items:
    - title: 'Certifikat CE'
      description: 'Vsi izdelki afarer ustrezajo evropskim zahtevam označevanja CE za rekreacijska plovila, kar zagotavlja izpolnjevanje standardov varnosti, zdravja in varstva okolja.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Naš sistem upravljanja kakovosti je certificiran po ISO 9001:2015 in zajema oblikovanje, proizvodnjo in distribucijo napihljivih plovil ter pomorske opreme.'
      icon: tabler:clipboard-check
    - title: 'Označevanje UKCA'
      description: 'Izdelki, prodajani na trgu Združenega kraljestva, nosijo oznako UKCA, ki potrjuje skladnost s predpisi Združenega kraljestva za pomorsko opremo in osebna plovila.'
      icon: tabler:shield
    - title: 'Skladnost z BSCI'
      description: 'afarer je reviziran po BSCI (Business Social Compliance Initiative), kar dokazuje etične proizvodne prakse, poštene delovne pogoje in odgovornost v dobavni verigi.'
      icon: tabler:heart-handshake
    - title: 'Skladnost z REACH'
      description: 'Vsi materiali v izdelkih afarer ustrezajo predpisom EU REACH o kemični varnosti, kar zagotavlja, da v naših materialih PVC, EVA ali komponentah ni omejenih snovi.'
      icon: tabler:flask
    - title: 'Preskušanje materialov'
      description: 'Tkanine se preskušajo na natezno trdnost, odpornost na trganje, razgradnjo zaradi UV in zmogljivost pri hladnem lomu. Vsaka proizvodna serija se vzorči in preveri.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Standardi tovarne'
  title: 'Proizvodna odličnost<br />— izdelano po specifikacijah'
  subtitle: 'Naš obrat s 12,000 m² deluje po strogih protokolih nadzora kakovosti na vsaki stopnji proizvodnje.'
  list:
    - 'Pregled dohodnega materiala: Vsi surovi materiali — tkanina PVC, pena EVA, lepila, okovje — se pred vstopom v proizvodnjo preskusijo glede na specifikacije.'
    - 'Nadzor kakovosti med proizvodnjo: Vsaka proizvodna stopnja ima dokumentirane kontrolne točke QC. Trdnost varov, poravnava šivov, vgradnja ventilov in navor priključkov se preverjajo v liniji.'
    - 'Preskušanje tlaka: Vsaka napihljiva komora se 24–48 ur preskusi na tlak 1.25× nazivnega tlaka. Padec tlaka mora za opravljenost ostati pod 5 %.'
    - 'Končni pregled: Končani izdelki se pred odpošiljanjem pregledajo za dimenzijsko natančnost, kozmetični zaključek, popolnost dodatkov in celovitost embalaže.'
    - 'Sledljivost serij: Vsak izdelek nosi serijsko številko, povezano z evidenco proizvodnih serij, kar omogoča popolno sledljivost od surovine do končnega izdelka.'
content_safety:
  tagline: 'Standardi pomorske varnosti'
  title: 'Varnost na prvem mestu<br />— zasnovano za zanesljivo delovanje'
  subtitle: 'Izdelki afarer so oblikovani in preskušeni tako, da izpolnjujejo mednarodne standarde pomorske varnosti za komercialno in rekreacijsko uporabo.'
  items:
    - title: 'EN ISO 25649'
      description: 'Napihljive SUP deske ustrezajo standardom EN ISO 25649 za konstrukcijo, stabilnost, plovnost in nosilnost.'
      icon: tabler:sailboat
    - title: 'Skladnost s SOLAS'
      description: 'Varnostna oprema in rešilna sredstva tam, kjer je primerno, izpolnjujejo zahteve SOLAS (Safety of Life at Sea).'
      icon: tabler:lifebuoy
cta:
  title: 'Potrebujete certificirane izdelke za svoj projekt?'
  subtitle: 'Stopite v stik z našo ekipo in se pogovorite o zahtevah certifikacije, dokumentaciji in skladnosti za vaš trg.'
  actions:
    - variant: primary
      text: 'Zahtevajte dokumente o certifikaciji'
      href: /contact/
    - text: 'Oglejte si našo stran o kakovosti'
      href: /quality/

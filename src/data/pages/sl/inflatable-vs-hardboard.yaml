faqs:
  - question: 'Katera je bolj trajna: napihljiva ali trda deska SUP?'
    answer: 'Napihljive deske SUP so na splošno bolj trajne, ker se upirajo vdrtinam, razpokam in poškodbam od udarcev, ki bi trdo desko trajno poškodovali.'
  - question: 'Ali je napihljiva deska SUP boljša za začetnike?'
    answer: 'Da. Napihljive deske SUP priporočamo začetnikom, ker so bolj odpuščajoče, lažje za prevoz in ob padcu manj verjetno povzročijo poškodbo.'
  - question: 'Ali lahko napihljive deske SUP dosegajo zmogljivost trdih desk?'
    answer: 'Pri rekreacijskem veslanju in turizmu napihljive deske SUP dosegajo zmogljivost trdih desk. Trde deske še vedno blestijo v dirkanju in naprednem surfanju zaradi lažje mase in dodelane prožnosti.'
body: |
  <h2>Osnovne razlike</h2>
  <p>Napihljive deske SUP (iSUP) in trde deske služita istemu temeljnemu namenu — stoje in veslanju na vodi — vendar ga dosežeta s popolnoma različnimi konstrukcijskimi metodami. Prava izbira je odvisna od tega, kako nameravate desko uporabljati.</p>

  <table>
    <tr><th>Dejavnik</th><th>Napihljiva deska SUP</th><th>Trda deska SUP</th></tr>
    <tr><td>Konstrukcija</td><td>Drop-stitch PVC, napihnjena na 12–15 PSI</td><td>Jedro iz EPS-pene, ovito s steklenimi vlakni ali epoksidom</td></tr>
    <tr><td>Masa</td><td>18–28 lbs (samo deska)</td><td>20–30 lbs (samo deska)</td></tr>
    <tr><td>Pakirana velikost</td><td>Nahrbtnik (30 x 15 x 10 in)</td><td>Celotna dolžina (10–14 ft)</td></tr>
    <tr><td>Priprava</td><td>3–5 minut napihovanja</td><td>Pripravljena za uporabo</td></tr>
    <tr><td>Življenjska doba</td><td>5–10 let z ustrezno nego</td><td>3–8 let (nagnjene k vdrtinam)</td></tr>
  </table>

  <h2>Prenosljivost</h2>
  <p><strong>Napihljiva zmaga.</strong> To je najjasnejša prednost. Napihljiva deska SUP se pakira v nahrbtnik, ki ustreza v prtljažnik avtomobila, omaro stanovanja ali letalski prtljažni prostor. Popotniki, prebivalci stanovanj in vsi brez strešnega prtljažnika bodo ugotovili, da so napihljive deske SUP veliko bolj praktične.</p>
  <p>Trde deske zahtevajo strešni prtljažnik, veliko vozilo ali namenski prostor za shranjevanje. Težko jih je prevažati in brez posebnih transportnih kovčkov jih ni mogoče vzeti na letalo.</p>

  <h2>Trajnost</h2>
  <p><strong>Napihljiva zmaga.</strong> Napihljive deske SUP so izdelane iz vojaškega PVC, ki se upira udarcem, prebodom in poškodbam od UV. Ko napihljivo desko spustite ali zadenete ob kamn, se odbije. Trda deska bi pri istem udarcu dobila vdrtino, razpoko ali se delaminirala.</p>
  <p>Trde deske so bolj podvržene vsakodnevni obrabi. En sam padec na beton lahko povzroči trajno vdrtino, ki vpliva na zmogljivost in omogoča vdor vode.</p>

  <h2>Zmogljivost</h2>
  <p><strong>Trda deska zmaga na vrhu.</strong> Pri rekreacijskem veslanju in turizmu pri zmernih hitrostih sta vrsti desk enakovredni. Trde deske imajo prednost pri:</p>
  <ul>
    <li><strong>Hitrost</strong> — trde deske so lažje in togejše, kar pomeni boljše drsenje in višjo največjo hitrost</li>
    <li><strong>Surfanje</strong> — trde deske omogočajo odzivnejše prehode z roba na rob in boljše zmogljivosti na valovih</li>
    <li><strong>Dirkanje</strong> — tekmovalno dirkanje skoraj izključno uporablja trde deske zaradi prednosti pri masi in togosti</li>
  </ul>
  <p>Za povprečnega rekreacijskega veslača so te razlike v zmogljivosti marginalne. Večina veslačev ne bo presegla zmogljivosti kakovostne napihljive deske.</p>

  <h2>Prijaznost do začetnikov</h2>
  <p><strong>Napihljiva zmaga.</strong> Napihljive deske SUP so za začetnike lažje, ker:</p>
  <ul>
    <li>mehkejša površina palube je bolj udobna in ob padcu manj verjetno povzroči poškodbo</li>
    <li>širše in debelejše napihljive deske ponujajo več primarne stabilnosti</li>
    <li>nižja vstopna investicija olajša začetek</li>
    <li>enostaven prevoz pomeni več priložnosti za veslanje</li>
  </ul>

  <h2>Shranjevanje in vzdrževanje</h2>
  <p>Napihljive deske SUP je treba pred shranjevanjem posušiti in pravilno zložiti. Trde deske je mogoče shraniti sestavljene, vendar potrebujejo zaščito pred soncem, toploto in udarci. Obe vrsti imata korist od izpiranja s sladko vodo po uporabi v slani vodi.</p>

  <h2>Priporočilo</h2>
  <p><strong>Izberite napihljivo desko SUP, če:</strong> potujete, imate omejen prostor za shranjevanje, veslate rekreacijsko ali ste začetnik. 90 % veslačev bo dobro postreženih s kakovostno napihljivo desko.</p>
  <p><strong>Izberite trdo desko, če:</strong> dirkate tekmovalno, surfate na zahtevnih valovih ali prednost dajete največji zmogljivosti pred prenosljivostjo in trajnostjo.</p>

  <h2>Pogosta vprašanja</h2>
  <h3>Katera je bolj trajna: napihljiva ali trda deska SUP?</h3>
  <p>Napihljive deske SUP so na splošno bolj trajne, ker se upirajo vdrtinam, razpokam in poškodbam od udarcev, ki bi trdo desko trajno poškodovali.</p>

  <h3>Ali je napihljiva deska SUP boljša za začetnike?</h3>
  <p>Da. Napihljive deske SUP priporočamo začetnikom, ker so bolj odpuščajoče, lažje za prevoz in ob padcu manj verjetno povzročijo poškodbo.</p>

  <h3>Ali lahko napihljive deske SUP dosegajo zmogljivost trdih desk?</h3>
  <p>Pri rekreacijskem veslanju in turizmu napihljive deske SUP dosegajo zmogljivost trdih desk. Trde deske še vedno blestijo v dirkanju in naprednem surfanju zaradi lažje mase in dodelane prožnosti.</p>

hero:
  tagline: 'Laboratorij 06'
  title: 'Laboratorij za kakovost in inšpekcijo'
  subtitle: 'Neodvisno preverjanje — vsak preskus opravljen pred dobavo'
  image: 'https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp'

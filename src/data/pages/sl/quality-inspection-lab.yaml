intro: 'Vsaka deska, ki zapusti našo delavnico, nosi potrdilo, da je opravila določen niz pregledov kakovosti in preskusov materialov. Naš laboratorij za kakovost in inšpekcijo je neodvisna funkcija v organizaciji — poroča neposredno direktorju podjetja in ne proizvodnji — s čimer je zagotovljeno, da noben komercialni pritisk ne more ogroziti inšpekcijskega preverjanja. Če serija materiala ali dokončana deska ne izpolnjuje objavljene specifikacije, ima laboratorij pooblastilo zaustaviti odpošiljanje, dokler se neskladnost ne odpravi.'

content_html: |
  <h2>Zaupaj, a preveri</h2>
  <p>Laboratorij deluje po sistemu upravljanja kakovosti, usklajenem z načeli, naše preskusne metode pa temeljijo na standardih ISO, ASTM in EN, kjer je to mogoče. Vodimo podrobne evidence o vsakem opravljenem preskusu in s tem ustvarjamo popolno verigo sledljivosti od prejema surovin do dostave končne deske.</p>

  <h2>Preskusna oprema in zmožnosti</h2>
  <table>
    <thead><tr><th>Oprema</th><th>Opravljeni preskusi</th><th>Standard / metoda</th></tr></thead>
    <tbody>
      <tr><td>Univerzalna preskusna naprava (50 kN)</td><td>Natezna trdnost (tkanina), odpornost na luščenje (šivi), širjenje strga</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Naprava za preskus zadrževanja zraka (programirljiva)</td><td>Vzdržljivost 1000 ciklov napihovanja/izpuščanja, 30-minutni preskus zadrževanja tlaka</td><td>EN ISO 25649 (interno)</td></tr>
      <tr><td>Naprava za luščenje šivov (motorizirano luščenje 180°)</td><td>Trdnost luščenja varjenih in lepljenih šivov pri 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Preizkuševalec hidrostatskega stolpca</td><td>Odpornost tkanine na prodiranje vode (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Digitalni merilnik debeline &amp; mikrometer</td><td>Debelina tkanine, debelina stene robu, debelina lepilnega filma</td><td>ISO 2286-3</td></tr>
      <tr><td>Klimatska komora</td><td>Pogojenje s temperaturo (-40 °C do +80 °C) za preskuse hladne razpoke in toplotnega staranja</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Barvni spektrofotometer</td><td>Merjenje barvne razlike Delta-E po izpostavitvi UV</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Inšpekcijska preverjanja — od materiala do dostave</h2>
  <p>Vsaka deska sledi določenemu načrtu kakovosti z obveznimi inšpekcijskimi točkami. Nobena deska ne more preskočiti preverjanja; vsako preverjanje mora pred začetkom naslednje proizvodne stopnje potrditi inšpektor kakovosti.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Preverjanje 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inšpekcija vhodnega materiala</p>
            <p class="text-xs text-gray-500 mt-1">Serija tkanine, serija lepila, okovje — vse preverjeno glede na vhodno specifikacijo pred sprostitvijo v proizvodnjo.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Preverjanje 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inšpekcija varjenja med proizvodnjo</p>
            <p class="text-xs text-gray-500 mt-1">Prvi varjeni vzorec preizkušen (luščenje + vizualno) na začetku vsake proizvodne izmene.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Preverjanje 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Zračni preskus komor</p>
            <p class="text-xs text-gray-500 mt-1">Vsaka komora napolnjena na 1,5-kratni delovni tlak, zadržan 30 min. Podatki se beležijo po serijski številki.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Preverjanje 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inšpekcija pred dobavo</p>
            <p class="text-xs text-gray-500 mt-1">Popoln pregled deske: vsi vezni elementi priviti, okovje deluje, brez kozmetičnih napak. Kontrolni seznam s 100 točkami.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Preverjanje 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Končna certifikacija</p>
            <p class="text-xs text-gray-500 mt-1">Poročila o preskusih zložena, inšpekcijski zapisi pregledani, izdana izjava o skladnosti.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Ključne meritve kakovosti (kotno povprečje 2025)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99,7 %</span>
      <span class="text-xs text-gray-500">Uspešnost že pri prvem pregledu (serija tkanine)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0,2 %</span>
      <span class="text-xs text-gray-500">Stopnja zavrnjenih varov (tekoči meter)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Komore zračno preskušane pred sestavljanjem</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">Skladnost s projektno kategorijo</span>
    </div>
  </div>

  <h2>Naša ekipa za kakovost</h2>
  <p>V laboratoriju dela vodja kakovosti (10 let na področju pomorske kontrole kakovosti, ASQ Certified Quality Engineer), dva inšpektorja kakovosti (vsak s certifikatom NDT stopnje 2 za vizualno preskušanje) in tehnik za materiale, odgovoren za vsa fizična preskušanja. Ekipa letno opravlja preverjanje usposobljenosti pri neodvisnem ponudniku — tretji osebi — da so naši rezultati preskusov vedno natančni in ponovljivi.</p>

  <h2>Neodvisno preskušanje za stranke</h2>
  <p>Naš laboratorij za kakovost in inšpekcijo je na voljo za neodvisne preskusne storitve. Če morate preveriti specifikacijo tkanine, potrditi nov sistem lepljenja ali pridobiti poročilo tretje osebe za kvalifikacijo v javnem naročilu, lahko preskuse izvedemo po ustreznem standardu in izdamo certificirano preskusno poročilo.</p>
  <p>Primeri nedavnih del pri preskušanju za tretje osebe:</p>
  <ul>
    <li>Primerjava trdnosti luščenja petih konkurenčnih izdelkov lepilnega filma za evropski vojaški nabavni program.</li>
    <li>Študija pospešenega staranja (UV + toplotno cikliranje) za novo formulacijo oranžno pigmentiranega PVC, z rednimi vmesnimi meritvami v intervalih 500 h.</li>
    <li>Validacija zadrževanja zraka pri 50 prototipnih pregradnih ventilih za novo zasnovo visokotlačne komore.</li>
  </ul>

  <h2>Naša zaveza vam</h2>
  <p>Ko prejmete desko Afarer, prejmete tudi njen kakovostni dosje — zbrani zapis rezultatov preskusov, ki veljajo za vašo konkretno desko. Certifikat serije tkanine, preskusi luščenja varov, dnevniki zračnih preskusov komor in kontrolni seznam pred dobavo. Vsaka številka je sledljiva. Vsak inšpektor je identificiran. To ni le birokracija — to je naša obljuba, da je bilo dobavljeno tisto, kar je bilo določeno v specifikaciji.</p>
  <p>Če se kdaj pojavi dvom o kakovosti, se lahko obrnete neposredno na laboratorij — kontaktni podatki so natisnjeni na vašem potrdilu o skladnosti. Vsako vprašanje jemljemo resno in se zavezujemo do formalne preiskave v 48 urah.</p>


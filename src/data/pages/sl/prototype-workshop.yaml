intro: 'CAD-model, ne glede na to, kako podroben je, ne more razkriti, kako se bo deska dejansko obnašala, dokler ne pride v stik z vodo. Prav zato je naša delavnica prototipov zasnovana tako, da inženirske podatke čim hitreje in natančneje pretvori v fizično desko, pripravljeno na vodo. Vsak novi model Afarer — in vsaka pomembnejša izdelava po meri — preide skozi to delavnico, preden se zavežejo proizvodna orodja.'

content_html: |
  <h2>Kjer oblikovanje postane resničnost</h2>
  <p>Delavnica je popolnoma opremljena za istočasno izdelavo trupa, robov in opreme. Ta pristop vzporednega poteka dela skrajša čas izdelave prototipa na 8–12 tednov od inženirske sprostitve, v primerjavi s panžnim povprečjem 16–20 tednov. Ko vaša aplikacija zahteva specializirano rešitev, lah od koncepta do validacije na vodi pridemo v manj kot treh mesecih.</p>

  <h2>Zmožnosti delavnice</h2>
  <table>
    <thead><tr><th>Delovna postaja</th><th>Oprema</th><th>Namen</th></tr></thead>
    <tbody>
      <tr><td>Izdelava trupa</td><td>CNC-rezalnik tkanin, presa za toplotno laminiranje, postaja za pripravo jedra drop-stitch</td><td>Izdelava trupov v polni velikosti v vseh treh vrstah konstrukcije</td></tr>
      <tr><td>Sestavljanje robov &amp; komor</td><td>VF-varilna presa, postaja za začasno spajkanje z vročim zrakom, naprava za preskus napihovanja</td><td>Izdelava robov in sklopov komor v polni velikosti z vsemi pregradami in ventili</td></tr>
      <tr><td>Opremljanje &amp; vgradnja</td><td>Predloga za frezanje mest za plavutke, priprave za varjenje tovornih nosilcev in ročajev, postaja za rezanje palubnih blazin</td><td>Popolna oprema: plavutke, tovorni nosilci, čepi za varovalno vrvico, ročaji, palubne blazine, ventili</td></tr>
      <tr><td>Inštrumentacijski prostor</td><td>GPS-hitrostni senzor, tlakovni pretvorniki, pospeškomerji, niz termočlenov, podatkovni zapisovnik</td><td>Vgradnja in umerjanje inštrumentacije za preskuse na morju</td></tr>
    </tbody>
  </table>

  <h2>Pot prototipa — korak za korakom</h2>
  <ol>
    <li><strong>Inženirsko predajo</strong> — Projektno dokumentacijo (3D-model, poročilo FEA, kosovnica, razpored laminiranja) formalno pregledata vodja delavnice in projektni inženir. Morebitne proizvodne pomisleke označijo in odpravijo, preden se rezanje začne.</li>
    <li><strong>Izdelava trupa</strong> — Trup je zgrajen po inženirski specifikaciji. Za enoslojno konstrukcijo: jedro drop-stitch se laminira s specificirano prevleko iz PVC. Za dvoslojno konstrukcijo: dodatna prevleka se naloži čez osnovni laminat, preden se izreže kroj. Za zlito konstrukcijo: parametri laminiranja se naložijo iz odobrenega procesnega lista in preverijo na prvem vzorcu.</li>
    <li><strong>Izdelava robov</strong> — Tkanina se reže z CNC-predlogami vzorcev, nato se z VF-varjenjem sestavi v robove in komore v polni velikosti. Vsaka komora se napihne na preskusni tlak in pusti 24 h za začetno stabilizacijo.</li>
    <li><strong>Sestavljanje &amp; opremljanje</strong> — Trup in robovi se spojita. Vgradijo se mesta za plavutke in tovorni nosilci, namestijo se čepi za varovalno vrvico in nošilni ročaji, ventil za napihovanje se privije, palubna blazina pa se prilepi in poravna.</li>
    <li><strong>Statični preskusi</strong> — Preden se deska dotakne vode, opravi: preverjanje plovnosti (polna obremenitev + 30 % rezerve), preskus zadrževanja tlaka v komorah, preskus puščanja ventila, natezni preskus ročajev in nosilcev.</li>
    <li><strong>Program preskusov na morju</strong> — 20 ur preskušanja v vodi, podrobno opisano spodaj.</li>
    <li><strong>Pregled prototipa</strong> — Izvede se formalni sestanek potrditve z ekipami za inženiring, proizvodnjo in kakovost. Vse potrebne spremembe oblikovanja se dokumentirajo in vključijo v proizvodno sprostitev.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-urni program preskusov na morju — urnik preskusov</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Uvajanje na mirni vodi — sledenje pri nizki hitrosti, obračanje, preverjanje stojišča in trimma</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Preskus hitrosti — z GPS preverjena največja hitrost, hitrost križarjenja, vzdrževanje tempa pri 3 hitrostih zavesljev</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Preskus obračanja — radij obračanja okoli osi in z lovilnim zavesljem, odziv deske, na levo in desno</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Preskus na kratkih valovih — ponovljeni prevozi skozi valove višine 0,5–1,0 m; pospeškomer na mestu stojišča veslača</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Preskus stabilnosti — statični nagib s 4 veslači različnih tež, zamaknjena obremenitev na desno stran</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Vzdržljivostna vožnja — 3 h neprekinjeno v tempu križarjenja; spremljanje tlaka v komorah, temperature robov in utrujenosti veslača</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Končni pregled — pregled vseh komponent po preskusu, privijanje/preverjanje vseh vezil, dokumentiranje ugotovitev</span>
      </div>
    </div>
  </div>

  <h2>Izdelava prototipov po meri za edinstvene aplikacije</h2>
  <p>Delavnica prototipov je kraj, kjer rešujemo težave, ki jih standardne proizvodne deske ne morejo obravnavati. Nedavni primeri:</p>
  <ul>
    <li>Reševalna deska SUP z visoko vidljivostjo za organizacijo iskanja in reševanja, z integriranimi prijemalnimi ročaji, nosilci za reševalno opremo in trupom z visoko plovnostjo za reševanje poškodovancev — vse izdelano, opremljeno in preskušeno v našem objektu.</li>
    <li>Ekspedicijska turistična deska SUP za izvajalca hidrografske raziskave, z odstranljivim jamborom za inštrumente, zapečatenimi vhodi za opremo in nizkim nosilcem pretvornika, zasnovanim tako, da zmanjšuje upor.</li>
    <li>Kompaktna ribiška deska SUP za floto letovišča, kjer je prototip služil za preverjanje stabilnosti, opremljanja z opremo in trajnosti pri vsakodnevni najemni uporabi, preden se je stranka odločila za floto štirih desk.</li>
  </ul>

  <h2>Naša ekipa za izdelavo prototipov</h2>
  <p>V delavnici dela osem veščih pomorskih tehnikov, vsak navzkrižno usposobljen v vsaj dveh od treh jedrnih disciplin (trup, rob, oprema). Vodja ekipe je mojster izdelovalec s 16 leti izkušenj, od izdelav po meri v posameznih izvedbah do proizvodnih serij. Vsakemu prototipu je dodeljen posvečen projektni inženir, ki je edina kontaktna oseba za stranko skozi celoten proces izdelave in preskusov.</p>

  <h2>Vpletenost stranke</h2>
  <p>Stranke aktivno spodbujamo, da se udeležijo ključnih mejnikov med izdelavo prototipa — zlasti prvega pregleda opremljanja in preskusa na morju. Vaša operativna povratna informacija v teh fazah je neocenljiva za podroben nastavitev deske, preden ta vstopi v proizvodnjo. Ne gradimo v vakuumu; gradimo v partnerstvu z vami.</p>
  <p>20-urni preskus na morju je za vašo ekipo tudi priložnost, da se seznani z obnašanjem deske, razporeditvijo palube in zahtevami vzdrževanja, kar zagotavlja gladek prehod v uporabo, ko so proizvodne deske dostavljene.</p>


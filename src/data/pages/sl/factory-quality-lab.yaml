    detail: Pri 1,25× ocenjenega tlaka
  - value: '&lt;5%'
    label: Največji dovoljen padec tlaka
    detail: V obdobju zadrževanja 24–48 ur
  - value: AQL 2.5
    label: Prag glavnih napak

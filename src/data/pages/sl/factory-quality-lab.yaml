test_procedures:
  - title: Pregled surovin
    description: Vsaka dohodna serija PVC, drop-stitch tkanine in okovja se pred sprejemom preskusi. Preverijo se natezna trdnost (ASTM D751), odpornost proti trganju (ISO 4674) in odpornost proti UV. Neustrezni materiali se dajo v karanteno in vrnejo.
    standards:
      - ASTM D751 (natezna trdnost)
      - ISO 4674 (trganje)
      - ISO 4892 (UV)
  - title: Kontrolne točke QC med proizvodnjo
    description: Proizvodni operaterji na vsaki stopnji izvajajo samopregled. Revizorji QC med izmeno izvajajo naključno vzorčenje. Preskusi luščenja varov se izvedejo na vsakih 50 enot. Dimenzijske preglede izvajamo na vsakem 20. panelu.
    standards:
      - ASTM D751 (luščenje)
      - Interni kontrolni seznam s 100 točkami
      - Vzorčenje ISO 2859
  - title: Preskus zadrževanja zraka 24–48 ur
    description: Vsaka komora cevi se napihne na 125 % ocenjenega tlaka in zadrži 24–48 ur. Tlačni senzorji neprekinjeno beležijo s kompenzacijo temperature. Vsaka komora, ki preseže 5-odstotni padec tlaka, sproži samodejni ponovni pregled serije.
    standards:
      - EN ISO 25649
      - CE 2013/53/EU
  - title: Preskušanje obremenitve in ravnovesja
    description: Dokončane deske se pri največji ocenjeni nosilnosti preskušajo na stabilnost in togost. Vsaka deska pred končno odobritvijo pregleda opravi preskušanje v vodi.
    standards:
      - ISO 12217
      - CE 2013/53/EU


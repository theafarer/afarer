intro: afarer upravlja namenski laboratorij za nadzor kakovosti, ki deluje neodvisno od proizvodnje. Vsaka serija surovin in vsaka dokončana deska pred sprostitvijo gre skozi dokumentirane protokole pregleda. Naša ekipa QC poroča neposredno vodstvu, kar zagotavlja nepristranske odločitve o kakovosti.

highlights:
  - value: 100%
    label: Tlačno preskušenih enot
    detail: Vsaka komora, vsaka deska

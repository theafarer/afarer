philosophy:
  tagline: 'Oblikovalska filozofija'
  title: 'Oblikovanje pod vodstvom inženirjev<br />— vsaka podrobnost je pomembna'
  subtitle: 'Naša inženirska filozofija temelji na treh načelih, ki usmerjajo vsak izdelek, ki ga izdelamo.'
  list:
    - 'Zanesljivost na prvem mestu: Vsak izdelek afarer je preskušen, da zdrži realne razmere — od reševalnih operacij v hladni vodi do najema v tropskih letoviščih. Kjer je najpomembneje, konstruiramo z rezervo.'
    - 'Proizvodna natančnost: Naše naprave uporabljajo rezanje CNC, varjenje visoke frekvence in samodejno preskušanje tlaka. Vsak šiv, vsak ventil, vsak priključek ustreza dokumentiranim specifikacijam.'
    - 'Stalne inovacije: Naša ekipa za raziskave in razvoj neprestano ocenjuje nove materiale, proizvodne metode in izboljšave oblikovanja. Ne čakamo na težave — jih predvidevamo.'
cta:

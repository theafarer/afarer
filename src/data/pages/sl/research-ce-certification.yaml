content_html: |
  <h2>Kaj je certifikacija CE?</h2>
  <p>Označba CE (Conformit&eacute; Europ&eacute;enne) pomeni, da izdelek izpolnjuje zahteve EU glede zdravja, varnosti in okolja. Za napihljiva plovila je od relevantnega regulativnega okvira odvisna kategorija izdelka.</p>

  <h2>Uporabne direktive</h2>

  <h3>Direktiva o rekreacijskih plovilih (2013/53/EU)</h3>
  <p>Primarna direktiva za rekreacijska plovila v EU. Napihljive deske SUP, krajše od 2,4 m, niso v njenem obsegu in se namesto tega certificirajo po EN ISO 25649.</p>

  <h3>Uredba o osebni zaščitni opremi (2016/425)</h3>
  <p>Rešilni jopiči, pripomočki za vzgon in varnostna oprema, dobavljeni s plovili, morajo izpolnjevati zahteve Uredbe o OOP, vključno s preskusom tipa (modul B) pri notificiranem organu in zagotavljanjem kakovosti proizvodnje (modul D ali E).</p>

  <h2>Postopek certificiranja</h2>
  <ol>
    <li>Klasifikacija izdelka: določitev kategorije zasnove plovila (A – D po ISO 8666)</li>
    <li>Uporabni standardi: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (proizvajalčeva plošča)</li>
    <li>Priprava tehnične dokumentacije: risbe zasnove, seznam materialov, certifikati materialov, ocena tveganj</li>
    <li>Preskušanje tipa: vzgon, stabilnost, nosilnost, preskušanje materialov, trdnost šivov, zadrževanje zraka</li>
    <li>Nadzor proizvodnje v tovarni: revizija proizvodnih procesov s strani notificiranega organa</li>
    <li>Izjava o skladnosti: proizvajalec podpiše Izjo o skladnosti in pritrdi označbo CE</li>
  </ol>

  <h2>Notificirani organi za napihljiva plovila</h2>
  <p>Pogosti notificirani organi so Bureau Veritas (Francija), DNV GL (Nemčija), RINA (Italija), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Nemčija).</p>

  <h2>Časovnica in stroški</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Faza</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Trajanje</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tipični strošek (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Priprava tehnične dokumentacije</td><td class="p-3 border">2 – 4 tedni</td><td class="p-3 border">2.000 – 5.000</td></tr>
      <tr><td class="p-3 border">Preskušanje tipa</td><td class="p-3 border">4 – 8 tednov</td><td class="p-3 border">8.000 – 20.000</td></tr>
      <tr><td class="p-3 border">Revizija tovarne</td><td class="p-3 border">1 – 2 dneva (na lokaciji)</td><td class="p-3 border">3.000 – 6.000</td></tr>
      <tr><td class="p-3 border">Skupaj (prvi izdelek)</td><td class="p-3 border">8 – 14 tednov</td><td class="p-3 border">13.000 – 31.000</td></tr>
    </tbody>
  </table>

  <h2>Kaj to pomeni za kupce</h2>
  <p>Pri nakupu napihljivih desk SUP s certifikatom CE vedno preverite, da je označba CE na proizvajalčevi plošči, da obstaja veljavna Izjava o skladnosti, da je navedena številka notificiranega organa in da priročnik za uporabnika vsebuje varnostna navodila v vašem jeziku. Vsi izdelki Afarer imajo certifikat CE s popolno sledljivostjo do poročil o revizijah notificiranega organa.</p>


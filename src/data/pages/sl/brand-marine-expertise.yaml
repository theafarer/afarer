meta:
  title: 'Pomorsko strokovno znanje — inženiring v vsakem trupu | {SITE}'
  description: 'Desetletja pomorskega inženiringa v vsakem trupu. afarer obvlada drop-stitch, pomorski PVC in profesionalno oblikovanje napihljivih desk SUP.'
  keywords:
    - 'pomorski inženiring'
    - 'proizvajalec napihljivih desk sup'
    - 'proizvodnja desk za veslanje'
hero:
  tagline: 'Pomorsko strokovno znanje'
  title: 'Desetletja pomorskega inženiringa<br />v vsakem trupu'
  subtitle: 'afarer združuje globoko znanost o materialih, natančno proizvodnjo in preizkušanje v resničnem svetu za ustvarjanje plovil, ki delujejo, ko je to pomembno.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'pomorski inženiring afarer in ekipa za R&D pri delu'
expertise_materials:
  tagline: 'Znanost o materialih'
  title: 'Izbira pravega materiala<br />za vsako aplikacijo'
  subtitle: 'Delamo z dvema jedrnima materialoma — vsak izbran za specifične primere uporabe in zahteve zmogljivosti.'
  columns: 3
  items:
    - title: 'Pomorski PVC'
      description: 'Tkanina PVC 1100 denier — naš najbolj vsestranski material. Stabiliziran proti UV, odporen proti obrabi in skladen z REACH. Idealen za deske SUP, kjer sta pomembni masa in cenovna učinkovitost.'
      icon: tabler:droplet
    - title: 'Steklena vlakna in polietilen'
      description: 'Deske SUP, laminirane s steklenimi vlakni, za vrhunsko togost in drsenje. Rotacijsko oblikovan polietilen za zahtevno najemno in reševalno uporabo, ki zahteva največjo odpornost proti udarcem.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Proizvodne zmožnosti'
  title: 'Natančna proizvodnja<br />na vsakem koraku'
  subtitle: 'Naš objekt s površino 12.000 m² je opremljen s specializiranimi stroji za vsako stopnjo proizvodnje.'
  columns: 2
  items:
    - title: 'Rezanje CNC'
      description: 'Računalniško krmiljeno rezanje zagotavlja natančne, ponovljive panele tkanine z minimalnimi odpadki. Vsak kos ustreza točno zasnovanemu.'
      icon: tabler:cpu
    - title: 'Visokofrekvenčno varjenje'
      description: 'Industrijsko VF-varjenje ustvarja šive, močnejše od osnovnega materiala. Dosleden nadzor temperature in tlaka zagotavlja zračotesne spoje pri vsaki proizvodni seriji.'
      icon: tabler:bolt
    - title: 'Sestavljanje jeder drop-stitch'
      description: 'Tisoči poliestrskih nitic povezujejo zgornjo in spodnjo plast tkanine ter omogočajo napihovanje pri visokem tlaku (15–20 PSI) za toge, stabilne deske SUP.'
      icon: tabler:building-arch
    - title: 'Preskušanje pod tlakom'
      description: 'Vsak napihljiv izdelek je pred odpošiljanjem preskušen pod tlakom. Deske se preskušajo pri 1,25-kratnem nazivnem tlaku — če zdrži tam, bo delovala na vodi.'
      icon: tabler:wind
    - title: 'Preskušanje trdnosti šivov'
      description: 'Naključni vzorci iz vsake proizvodne serije prestanejo destruktivno preskušanje trdnosti šivov. Rezultati se beležijo in sledijo do posameznih proizvodnih serij.'
      icon: tabler:files
    - title: 'Preskušanje v vodi'
      description: 'Vsak model pred certifikacijo opravi preskuse na morju. Preizkušanje v resničnih obalnih razmerah potrjuje zmogljivost, obnašanje in stabilnost.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Oblikovanje in inženiring'
  title: 'Zasnovano za resnične razmere'
  subtitle: 'Naša filozofija oblikovanja se začne pri tem, kako bo deska uporabljena — nato okoli te uporabe zgradi inženiring.'
  items:
    - title: 'Oblikovanje zmogljivih trupov'
      description: 'Vsaka oblika trupa je uglašena za svoj primer uporabe — izrivni premci za turistično drsenje, dodan rocker za surfanje, ravni stabilni profili za ribolov in jogo.'
    - title: 'Varnost drop-stitch'
      description: 'Vsaka deska ima togem jedru drop-stitch z ojačenimi robovi. Če je odsek poškodovan, visokonatezna konstrukcija drop-stitch ohrani desko delujočo.'
    - title: 'Ergonomska razporeditev palube'
      description: 'Coniranje palubnih blazin, položaj nošilnega ročaja in pritrdilne točke so zasnovani okoli udobja veslača pri dolgotrajni uporabi — ne glede na to, ali gre za turizem, ribolov ali patruljiranje.'
    - title: 'Konfiguracija po meri'
      description: 'Barve robov, konfiguracija palubne blazine, nosilci dodatkov, nosilnost opreme — vsak model je mogoče prilagoditi specifičnim operativnim zahtevam.'
cta:
  title: 'Imate v mislih specifično aplikacijo?'
  subtitle: 'Naša inženirska ekipa vam lahko svetuje o izbiri materialov, oblikovanju in proizvodnji za vaš projekt.'
  actions:

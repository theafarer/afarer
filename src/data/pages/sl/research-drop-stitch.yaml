content_html: |
  <h2>Kaj je drop-stitch?</h2>
  <p>Drop-stitch (imenovan tudi "tkanina drop-stitch" ali "jedro drop-stitch") je konstrukcijska metoda, pri kateri tisoče posameznih poliestrskih nitic povezuje zgornjo in spodnjo plast tkanega ovoja. Ko se ovoj napihne, te nitice delujejo kot notranji vlečni elementi — preprečujejo, da bi se zgornji in spodnji panel izbočila v okroglo obliko, in silita panel, da ostane raven in tog.</p>
  <p>Rezultat je lahka, prenosljiva konstrukcija, ki zdrži notranji tlak 15–20 PSI — primerljivo s togostjo trde deske, vendar jo je mogoče za shranjevanje in prevoz popolnoma izpustiti.</p>

  <h2>Kako deluje: fizika</h2>
  <p>V običajni napihljivi konstrukciji (kot balon ali zračna vzmetnica) notranji zračni tlak pritiska enakomerno v vse smeri. Brez notranje zadržbe konstrukcija dobi valjasto ali sferično obliko. Drop-stitch to rešuje z uvedbo vlečne ojačitve:</p>
  <ul>
    <li>tisoči nitic povezujejo zgornjo in spodnjo plast tkanine</li>
    <li>ko je napihnjena, zračni tlak poskuša potisniti zgornjo in spodnjo plast narazen</li>
    <li>nitice se upirajo temu ločevanju in prenašajo obremenitev v vleko vzdolž osi nitice</li>
    <li>rezultat je raven, tog panel, ki se upira upogibu</li>
  </ul>

  <h2>Proces izdelave</h2>
  <ol>
    <li><strong>Tkanje:</strong> Poliestrske nitice se istočasno vtkejo v dve ločeni plasti osnovne tkanine (običajno 1.100 DTEX ali 1.680 DTEX poliestr s PVC-prevleko). Nitice se zankasto vtknejo med plasti pod kotom 90&deg;.</li>
    <li><strong>Prevleka:</strong> Tkana osnovna tkanina se obda s PVC (občasno s TPU) s postopkom prevleke z nožem ali kalendarske prevleke. To zapečati nitice in ustvari zračotesno membrano.</li>
    <li><strong>Vezanje plasti:</strong> Jedro drop-stitch se s toplotnim laminiranjem ali lepilom veže na zunanje laminirane plasti (običajno 0,9 mm ali 1,2 mm PVC).</li>
    <li><strong>Varjenje:</strong> Robni pasovi se varijo vzdolž robov z varjenjem z vročim zrakom, VF-varjenjem ali visokofrekvenčnim varjenjem, da nastanejo stenske stene deske.</li>
    <li><strong>Vgradnja ventilov:</strong> Vgradijo se ventili Boston ali Halkey-Roberts, običajno z mehanizmom za zmanjševanje tlaka proti prekomernemu napihovanju.</li>
  </ol>

  <h2>Ključni kazalniki kakovosti</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Vstopni razred</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Gostota nitic</td><td class="p-3 border">1 nitica / kv. palec</td><td class="p-3 border">2 nitici / kv. palec</td></tr>
      <tr><td class="p-3 border">Osnovna tkanina</td><td class="p-3 border">1.100 DTEX</td><td class="p-3 border">1.680 DTEX</td></tr>
      <tr><td class="p-3 border">Največji tlak</td><td class="p-3 border">12–15 PSI</td><td class="p-3 border">18–22 PSI</td></tr>
      <tr><td class="p-3 border">Debelina PVC</td><td class="p-3 border">0,6–0,9 mm</td><td class="p-3 border">1,0–1,2 mm</td></tr>
      <tr><td class="p-3 border">Konstrukcija robov</td><td class="p-3 border">Zloženo &amp; prilepljeno</td><td class="p-3 border">Varjeno &amp; fuzijsko vezano</td></tr>
    </tbody>
  </table>

  <h2>Aplikacije</h2>
  <ul>
    <li><strong>Deske SUP:</strong> debelina 4"–6", 15–20 PSI, 1–2 nitici/kv. palec</li>
    <li><strong>Kajaki:</strong> pod drop-stitch + napihljive stranske komore, 10–15 PSI poda</li>
  </ul>

  <h2>Drop-stitch proti zračnemu podu (jedro iz steklenih vlaken ali lesa)</h2>
  <p>Trde deske uporabljajo jedra iz EPS-pene z ojačitvijo iz steklenih vlaken ali lesenih vzdolžnikov. Lažje so, togejše in odzivnejše — vendar jih ni mogoče izpustiti. Drop-stitch zamenja del togosti za popolno prenosljivost. Za večino rekreacijskih uporabnikov so sodobne deske SUP s drop-stitch pri 20 PSI po togosti neločljive od vstopnih trdih desk.</p>

  <h2>Kako Afarer uporablja drop-stitch</h2>
  <p>Afarer v svoji ponudbi desk SUP uporablja jedro drop-stitch 1.680 DTEX z dvema niticama na kvadratni palec in zunanjo laminatno plastjo iz PVC debeline 1,2 mm. Deske so ocenjene na 20 PSI in pred odpošiljanjem prestanejo 24–48-urni preskus zadrževanja tlaka pri 1,25-kratnem nazivnem tlaku. Robni pasovi so varjeni z vročim zrakom s troplastno fuzijo, ventili za zmanjševanje tlaka pa so standard pri vseh modelih.</p>


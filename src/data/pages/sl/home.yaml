meta:
  title: Afarer Napihljivi Paddleboardi | Zapluj dlje. Veslaj močneje.
  description: Odkrijte Afarer napihljive paddleboarde za vsestransko veslanje, turizem, jogo, ribolov in pustolovščine v naravi. Poiščite svoj popoln SUP in raziskujte več po vodi.
  keywords:
    - napihljivi paddleboard
    - napihljivi sup
    - vsestranski sup
    - turistični sup
    - sup za jogo
    - sup za ribolov
    - družinski paddleboard
    - prenosni paddleboard
hero:
  tagline: Napihljivi Paddleboardi
  title: Napihljivi Paddleboardi za Vsako Pustolovščino
  slogan: Zapluj dlje. Veslaj močneje.
  subtitle: Odkrijte svobodo veslanja z Afarerjem. Raziskujte premišljeno zasnovane napihljive SUPe za sproščene dneve na jezeru, obalne pustolovščine, fitnes in vse vmes.
  taglineSection: Zgrajeno za zaupanje. Oblikovano, da izstopa.
  actions:
    - variant: primary
      text: Poiščite Svojo Desko
      href: /size-guide/
      icon: tabler:compass
    - text: Raziskujte SUPe
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Zakaj Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Afarer napihljivi paddleboardi drsijo po mirni vodi ob sončnem vzhodu — ustvarjeni za vsako pustolovščino
who_we_serve:
  tagline: Veslajte z Nami
  title: Poiščite Svojo Pot po Vodi
  subtitle: Vsak veslač ima drugačno predstavo o pustolovščini. Odkrijte SUP Afarer, zasnovan za vaš slog vožnje.
  items:
    - title: Začetniki in Rekreacijski Veslači
      keywords: napihljivi sup za začetnike, vsestranski paddleboard, stabilni sup
      description: Široke, stabilne vsestranske deske, pri katerih je prvi zavesljaj naraven in ki rastejo skupaj z vami.
      icon: tabler:users
      cta: Poiščite Svojo Prvo Desko
      link: /all-around-sup/
    - title: Turizem in Pustolovščina
      keywords: turistični sup, paddleboard za dolge razdalje, ekspedicijski sup
      description: Daljše, ožje deske, ki držijo smer, drsijo dlje in nosijo opremo za večdnevne poti.
      icon: tabler:building
      cta: Raziskujte Turistične SUPe
      link: /touring-sup/
    - title: Joga in Fitnes
      keywords: sup za jogo, fitnes paddleboard, širok stabilen sup
      description: Široke, stabilne platforme s prostorom za gibanje — za jutranje tokove, treninge in ravnotežje na mirni vodi.
      icon: tabler:heart
      cta: Raziskujte SUP za Jogo
      link: /yoga-sup/
    - title: Ribolov in Družina
      keywords: sup za ribolov, družinski paddleboard, stabilna ribiška platforma
      description: Stabilne, praktične platforme za ribolov, vožnjo z otroki in dolge sproščene dneve na vodi.
      icon: tabler:users
      cta: Raziskujte SUP za Ribolov
      link: /fishing-sup/
proof_points:
  title: Preizkušeno onstran razstavnega prostora
  subtitle: Oblikovanje, zmogljivost in kakovost, ki jih lahko preverite — na vodi in v številkah.
  items:
    - metric: 10+
      label: Let oblikovanja za vodo
      detail: Od leta 2012, izpopolnjevano deska za desko
    - metric: 50+
      label: Držav na vodi
      detail: Veslači in partnerji po vsem svetu
    - metric: 12–15
      label: PSI jedro drop-stitch
      detail: Togo, kjer je pomembno, enostavno za pakiranje
    - metric: 100%
      label: Preskušeno pod tlakom deska za desko
      detail: Pregledano pred odpošiljanjem
business_solutions:
  tagline: Zakaj Drsi Drugače
  title: Zmogljivost, ki jo Čutite pri Prvem Zavesljaju
  subtitle: Štirje stebri, oblikovani s pravo vodo — zmogljivost, dizajn, konstrukcija in kakovost.
  items:
    - title: Zmogljivost na Vodi
      description: Oblike uglašene za stabilnost, drsanje in zaupanje na valovih — vsak zavesljaj ostaja povezan z vodo.
      icon: tabler:shield-check
    - title: Izrazit Dizajn
      description: Kolekcije, navdihnjene s plimovanjem, divjino in energijo obale — deske, s katerimi želite biti opaženi.
      icon: tabler:package
    - title: Dokazana Konstrukcija
      description: Drop-stitch jedra visoke gostote, ojačani robovi in fuzijsko laminirani šivi za večkratno uporabo.
      icon: tabler:headset
    - title: Preverjena Kakovost
      description: Preizkušeni pod tlakom, vizualno pregledani in pokriti z jasno garancijo in odzivno podporo po prodaji.
      icon: tabler:truck-delivery
cta:
  title: Poiščite svojo naslednjo desko.
  subtitle: Prvi zavesljaj ali najdaljša pot — spravili vas bomo na vodo.
  actions:
    - variant: primary
      text: Raziskujte Kolekcijo
      href: /inflatable-sup/
      icon: tabler:send
    - text: Zahtevajte Katalog
      href: /resources/download-catalog/

meta:
  title: 'Kakovost in preskušanje — nadzor proizvodnje | {SITE}'
  description: 'Sistem kakovosti afarer: neodvisen preskusni laboratorij, postopki ISO 9001 in vsaka enota preskušena pred odpošiljanjem. Nadzor kakovosti proizvodnje napihljivih SUP desk.'
  keywords:
    - 'nadzor kakovosti sup'
    - 'preskušanje napihljivih sup'
    - 'zagotavljanje kakovosti veslaških desk'
    - 'kakovost tovarne sup'
hero:
  tagline: 'Zagotavljanje kakovosti'
  title: 'Preskušanje zmogljivosti in kakovosti'
  subtitle: 'Vsako napihljivo SUP desko afarer pred odpošiljanjem v našem centru za raziskave in razvoj čaka temeljito preskušanje zmogljivosti in nadzor kakovosti. Naše celovito preskušanje kakovosti SUP ponuja oprijemljiv dokaz odličnosti izdelkov za kupce OEM in veleprodaje.'


  title: 'Strogo preskušanje na vsaki stopnji'

commitment:
  title: 'Naša zaveza'
  body: 'S temi strogimi postopki preskušanja {SITE} strankam zagotavlja, da so naše napihljive SUP deske ne le zmogljive, ampak tudi trajno grajene — za neštete prijetne in varne dogodivščine na vodi. Naš laboratorij kakovosti deluje neodvisno od proizvodnje in poroča neposredno vodstvu.'
  cta: 'Zahtevajte dokumentacijo o preskušanju'
  cta_link: /contact

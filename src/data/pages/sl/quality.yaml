tests:
  - title: 'Preskušanje tlaka'
    description: 'Napihljive komore se dalj časa izpostavi tlakom, ki presegajo priporočene obratovalne meje. To preverja zrakotesnost in strukturno celovitost materiala in šivov ter zagotavlja, da izdelek prenese predvideno uporabo in morebitno prenapihovanje brez odpovedi ali puščanj.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Preskušanje udarcev'
    description: 'Izdelki se izpostavi nadzorovanim udarcem z različnimi utežmi in pod različnimi koti. To ocenjuje odpornost materiala na preboje, trganje in poškodbe zarki trkov z ovirami v vodi ter dokazuje trajnost in dolgoživost.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'Preskušanje odpornosti proti UV'
    description: 'Vzorci materialov se izpostavi pospešeni izpostavljenosti UV, ki simulira leta ostre sončne svetlobe, nato se ponovno preskusijo ohranitev natezne trdnosti in barvna obstojnost. To preverja, da mešanice PVC kljubujejo bledenju, kredenju in razpokam, kar zagotavlja dolgoročno trajnost v sončnih morskih okoljih.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Preskušanje odpornosti proti obrabi'
    description: 'Vzorci materialov se pod nadzorovanim pritiskom drgnejo ob abrazivne površine določeno število ciklov. To meri sposobnost materiala, da prenese obrabo zaradi večkratne uporabe ter stika s peskom, kamni ali drugimi površinami, kar zagotavlja dolgoročno trajnost.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Preskušanje zmogljivosti pri nizkih temperaturah'
    description: 'Izdelki se preskuša v hladnih okoljih za oceno delovanja in trajnosti v različnih temperaturnih razmerah ter preprečitev togosti ali razpok v hladnejših vodah. Bistveno za deske, namenjene zimski uporabi ali uporabi na visokih geografskih širinah.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Preskušanje plovnosti in nosilnosti'
    description: 'Izdelki se preskuša z različnimi utežmi za določitev njihove največje nosilnosti in zagotovitev, da varno podpirajo uporabnike in opremo. Nazivna nosilnost vsakega modela se preveri pred izdajo.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Preskušanje vodljivosti'
    description: 'Izdelki se preskuša za odzivnost na veslanje ali motorni pogon, pri čemer se ocenjujeta obračalni radij in lahkotnost upravljanja. Preskušanja na vodi potrdijo, da se ravnanje v praksi ujema z oblikovnimi specifikacijami.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Preskušanje vodotesnosti'
    description: 'Popolnoma sestavljeni izdelki se potopi ali izpostavi razprševanju vode za preverjanje morebitnih puščanj skozi šive, ventile ali materiale. Vsaka deska pred odpošiljanjem opravi obvezen pregled vodotesnosti.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp

testing_section:

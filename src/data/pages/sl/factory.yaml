workshops_section:
  tagline: 'Delavnice'
  title: 'Proizvodne delavnice'
  workshops:
    - title: 'Rezanje PVC in priprava materiala'
      description: 'Samodejni CNC rezalni stroji obdelujejo tkanini PVC in drop-stitch s natančnostjo pod milimetrom. Računalniško optimizirana razporeditev delov zmanjšuje odpadke materiala in zagotavlja, da vsak panel pred varjenjem ustreza dimenzijskim specifikacijam.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Varjenje tub in toplotno spajanje'
      description: 'Namenska varilna delavnica s stroji za toplotno spajanje in RF dielektričnimi presami. Toplotni spajalniki z vročim zrakom spajajo in zlivajo komore PVC tub, RF varjeni šivi pa ustvarjajo zrakotesne šive visoke trdnosti, ki presegajo zahteve standarda EN ISO 25649.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'FRP kalupi in izdelava kompozitov'
      description: 'Kalupi iz FRP po meri za komponente SUP, izdelani z ročnim polaganjem steklenih vlaken in poliestrskimi ter vinilestrskimi sistemi smol. Vsak sloj se ročno pritisne in vakuumsko stisne za dosledno kakovost. Kabina za nanos gelcoata zagotavlja visokosijajen, UV-odporen morski zaključek.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Tiskanje in dekoriranje SUP'
      description: 'SUP deske se okrašujejo z digitalnim tiskom za večbarvno grafiko in s sitotiskom za logotipe ter ponavljajoče se vzorce. Digitalni tiskalniki ustvarjajo fotorealistične motive palub, sitotisk pa prinaša trajne in živahne blagovne zmote.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Končno sestavljanje in opremljanje'
      description: 'Montažna linija, kjer se drop-stitch jedra zaključijo z robovi, pritrdijo EVA palube ter vgradijo plavuti, ventili in dodatki. Vsaka deska sledi 100-točkovnemu kontrolnemu seznamu sestavljanja, ki ga potrdi vodja ekipe.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Preskušanje kakovosti in pregled'
      description: 'Vsaka končana deska pred odpošiljanjem opravi obvezno preskušanje zadrževanja zraka, preverjanje luščenja šivov in popoln pregled sistemov. Naš laboratorij kakovosti deluje neodvisno od proizvodnje in poroča neposredno vodstvu.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


qc_section:
  tagline: 'Nadzor kakovosti'
  title: 'Postopek preskušanja in zagotavljanja kakovosti'
  subtitle: 'Vsaka deska pred odpošiljanjem opravi obvezno preskušanje. Naš laboratorij kakovosti deluje neodvisno od proizvodnje in poroča neposredno vodstvu.'
  steps:
    - step: '1'
      title: 'Pregled surovih materialov'
      desc: 'Tkanini PVC in drop-stitch pred vstopom serije v proizvodnjo opravita natezno preskušanje (ASTM D751), preskušanje širjenja trganja in preverjanje odpornosti proti UV.'
    - step: '2'
      title: 'Preskušanje zadrževanja zraka 24–48 ur'
      desc: 'Vsaka komora tube se napihne na 125 % nazivnega tlaka in ga zadrži 24–48 ur. Padec tlaka, ki presega 5 %, sproži samodejno zavrnitev in ponovni pregled šivov.'
    - step: '3'
      title: 'Preskušanje obremenitve in ravnovesja'
      desc: 'Končane deske se obremeni do največje nazivne nosilnosti in preskusi na stabilnost in togost. Vsaka deska se pred končnim pregledom preskusi v vodi.'

oem_section:
  tagline: 'Projekti OEM'
  title: 'Primeri sodelovanja z znamkami in partnerstev OEM'
  subtitle: 'Od koncepta do zabojnika — kako pomagamo svetovnim znamkam pri zagonu in širitvi njihovih linij napihljivih SUP desk.'
  cases:
    - challenge: 'Evropski trgovec z opremo za prostočasne dejavnosti je potreboval linijo SUP desk z zasebno znamko, edinstveno grafiko palub, okolju prijazen PVC in maloprodajno pripravljeno embalažo — vse dostavljeno v 60 dneh.'
      solution: 'Razvili smo datoteke digitalnega tiska po meri, priskrbeli PVC, skladen z REACH, in skrajšali vzorčenje s 3 krogov na 1 tako, da smo oblikovalsko ekipo namestili v našo tovarno v Qingdaou.'
      result: '55 dni od podpisane naročilnice do FOB. 2,400 kosov v 4 SKU-jih. Ponovno naročilo je bilo oddano, preden je prispel prvi zabojnik.'
    - challenge: 'Ameriško zagonsko podjetje za vodne športe je potrebovalo visokozmogljivo drop-stitch SUP desko z obliko po meri, sooblikovano embalažo in certifikacijo BSCI za maloprodajno postavitev.'
      solution: 'Prilagodili smo obstoječi kalup SUP s spremenjeno obliko, razvili grafiko sooblikovane embalaže in predložili celotno dokumentacijo revizije BSCI.'
      result: 'Uspešno uvrščeno v 3 glavne ameriške verige za opremo za prostočasne dejavnosti. 5,000+ kosov v prvem letu s 98-odstotno stopnjo prodaje.'
    - challenge: 'Avstralski distributer je zahteval paletto SUP desk s certifikatom CE, barvami po meri in skladnostjo z avstralskimi standardi.'
      solution: 'Izdelali smo predproizvodne vzorce s 4 barvnimi različicami in usklajevali preskušanje skladnosti pri tretji osebi.'
      result: 'Linija 3 modelov SUP je bila predstavljena na trgu AU/NZ. Sledila je zmaga na javnem razpisu za 12 patruljnih SUP desk.'

faq_section:
  tagline: 'Pogosta vprašanja'
  title: 'Pogosta vprašanja B2B in OEM'
  questions:
    - q: 'Kolikšna je minimalna količina naročila (MOQ) za napihljive SUP deske OEM?'
      a: 'MOQ se začne pri 5–10 kosih za standardne modele OEM. Kalupi po meri in projekti zasebnih znamk zahtevajo najmanj 200 kosov, odvisno od zapletenosti. Poskusna naročila in vzorčne serije so na voljo za nove blagovne znamke.'
    - q: 'Ali ima afarer certifikat BSCI?'
      a: 'Da. Naša tovarna ohranja veljavno certifikacijo socialne skladnosti BSCI (revizijsko poročilo je na voljo na zahtevo). Imamo tudi ISO 9001 za upravljanje kakovosti, vsi izdelki pa nosijo certifikat CE. Dokumentacija o skladnosti s REACH in RoHS je priložena vsaki pošiljki OEM.'
    - q: 'Kakšen je običajni rok dobave za naročilo OEM?'
      a: 'Standardni rok dobave je 30–45 dni od potrjene naročilnice in akontacije za serijsko proizvodnjo OEM. Razvoj kalupa po meri doda 15–20 dni za izdelavo orodja. Pospešena proizvodnja je na voljo za nujna naročila in sezonske vrhove. Prototipni vzorci se običajno odpošljejo v 15–20 dneh.'
    - q: 'Ali lahko dostavite FOB Qingdao ali CIF do našega pristanišča?'
      a: 'Da. Dostavljamo FOB Qingdao, CIF do večjih svetovnih pristanišč in DDP za kvalificirane partnerje. Naša logistična ekipa ureja rezervacijo zabojnikov, izvozno dokumentacijo in carinsko odpravljanje. Dostavljamo v 50+ držav po vsem svetu, vključno s trgi EU, ZDA, Avstralije in Azije.'

b2b_moq: 'Standardni MOQ: 5–10 kosov na model. Poskusna naročila so dobrodošla za nova partnerstva.'

production_flow:
  tagline: 'Potek proizvodnje'
  title: 'Od materiala do končne deske'
  subtitle: 'Vsaka deska gre skozi 6 proizvodnih stopenj s kontrolnimi točkami QC na vsakem koraku. Bližnjic ni, pregledi se ne preskočijo.'
  stages:
    - stage: '01'
      title: 'Prejem materiala in vhodni QC'
      description: 'Vsi dohodni materiali se zabeležijo po številki serije/lota v našem ERP sistemu. Role tkanine PVC, drop-stitch jedra, ventili, lepila in okovje so v karanteni do potrditve QC.'
      qc_check: 'Natezna trdnost (ASTM D751), odpornost na trganje (ISO 4674), merjenje debeline, viskoznost lepila, optični pregled napak'
      qc_threshold: 'Preskuša se 100 % serij. Zavrnitev, če je natezna trdnost < 90 % specifikacije, trganje < najmanjše vrednosti specifikacije ali katera koli vidna napaka'
      responsibility: 'Vhodna ekipa QC (3 kontrolorji)'
    - stage: '02'
      title: 'Rezanje CNC in priprava materiala'
      description: 'Računalniško optimizirana razporeditev delov umesti panele na PVC material in tako zmanjša odpadke. Samodejni CNC rezalni stroji ohranjajo pozicijsko natančnost 0.1 mm.'
      qc_check: 'Dimenzijski pregled glede na datoteke CAD DXF, pregled kakovosti robov, preverjanje števila panelov'
      qc_threshold: 'Meri se vsak 20. panel. Toleranca ±0.5 mm. Serija se zavrne, če je >2 % zunaj tolerance'
      responsibility: 'Vodja delavnice za rezanje'
    - stage: '03'
      title: 'Varjenje in spajanje drop-stitch'
      description: 'Drop-stitch jedra se s toplotno laminacijo spojijo z zunanjimi laminati PVC. Komore tub so RF-varjene ali varjene z vročim zrakom. Robne tračnice so fuzijsko spajane v treh plasteh.'
      qc_check: 'Preskušanje luščenja na vsakih 50 kosov (ASTM D751), merjenje širine varjenega šiva, pregled dnevnika temperatur varjenja z vročim zrakom, optični pregled šivov pod osvetlitvijo'
      qc_threshold: 'Najmanjša trdnost luščenja 8 N/cm. Toleranca širine šiva ±1 mm. Vsak viden kanal = zavrnitev'
      responsibility: 'QC varjenja (2 kontrolorja na izmeno)'
    - stage: '04'
      title: 'Sestavljanje in opremljanje'
      description: 'Deske se premaknejo na končno sestavljanje, kjer se spojijo vse komponente: robovi so prilepljeni in privarjeni, ventili vgrajeni, D-obročki, ročaji, ohišja plavuti in torbe za prenos pritrjeni. Vsak kos sledi 100-točkovnemu kontrolnemu seznamu sestavljanja.'
      qc_check: 'Potrditev 100-točkovnega kontrolnega seznama za vsak kos, preskušanje delovanja ventila (10 ciklov odpiranja/zapiranja), preverjanje navora okovja, optični pregled'
      qc_threshold: 'Politika ničelnih napak za varnostno kritične artikel (ventili, D-obročki, ročaji). Manjše kozmetične napake: AQL 2.5 (ISO 2859)'
      responsibility: 'Vodja montažne ekipe + QC linije'
    - stage: '05'
      title: 'Preskušanje tlaka in zadržanje kakovosti'
      description: 'Vsaka komora se napihne na 1.25× nazivnega tlaka (običajno 20–25 PSI) in ga zadrži 24–48 ur. Tlačni senzorji neprestano beležijo. Komore s padcem tlaka nad 5 % se zavrnejo in pošljejo na ponovni pregled šivov.'
      qc_check: 'Dnevnik vzdrževanja tlaka 24–48 h, vsakodnevno preverjanje umeritve senzorjev, odčitek tlaka s kompenzacijo temperature, ponovni preskus šiva po popravilu'
      qc_threshold: 'Največ 5 % padca tlaka v 24–48 h pri stabilni temperaturi. Vsaka komora, ki to preseže = 100-odstotni ponovni preskus celotne proizvodne serije'
      responsibility: 'Laboratorij kakovosti (neodvisen od proizvodnje, poroča vodstvu)'
    - stage: '06'
      title: 'Končni pregled in pakiranje'
      description: 'Končni optični in funkcionalni pregled. Površinske napake, doslednost barv, preverjanje oznak/BIN, celovitost embalaže in popolnost dodatkov. Kosi se vakuumsko zapakirajo, vložijo v škatle in postavijo na palete za nalaganje zabojnikov.'
      qc_check: 'Popoln optični pregled, kontrolni seznam dodatkov po SKU, preskušanje padca embalaže (1 m, naključni vzorec), preverjanje oznak/črtne kode'
      qc_threshold: 'AQL 2.5 za večje napake, AQL 4.0 za manjše. Ničelna toleranca za varnostne napake. 100 % kosov se optično pregleda'
      responsibility: 'Končna ekipa QC (4 kontrolorji) + vodja pakirne ekipe'


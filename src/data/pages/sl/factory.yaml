intro:
  - 'Kot proizvodni krak **Aquafarer LLC (ZDA)** operativna ekipa afarer v Qingdaou nadzoruje vsako stopnjo proizvodnje — od prihoda surovih materialov PVC in steklenih vlaken do končnega pregleda pred odpošiljanjem. Naša proizvodna naprava v gospodarski razvojni coni Qingdao obsega 12,000 kvadratnih metrov in zajema namenske delavnice za rezanje PVC, toplotno spajanje tub, izdelavo FRP kalupov, digitalni tisk SUP, končno sestavljanje in preskušanje kakovosti.'
  - 'Z združitvijo oblikovanja, inženiringa, izdelave prototipov, proizvodnje in preskušanja pod eno streho odpravljamo neučinkovitost pogodbene proizvodnje in ohranjamo neposreden nadzor nad kakovostjo izdelave, izbiro materialov in roki dobav. Vsako desko, ki zapusti našo delavnico, izdelajo naši ljudje — na naši opremi in po naših standardih.'


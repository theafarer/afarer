certifications:
  - title: Certifikat CE
    description: Vsa varnostna oprema afarer izpolnjuje zahteve označbe CE po evropski Uredbi o osebni zaščitni opremi (EU) 2016/425.
  - title: Certifikat ISO 12402
    description: Rešilni jopiči izpolnjujejo standarde vzgona ISO 12402. Rešilni jopič Classic nudi vzgon 50 N ali več; rešilni jopič Pro izpolnjuje zahteve SOLAS s samodejnim napihovanjem.
  - title: Skladnost s SOLAS
    description: Rešilni jopič Pro je skladen z regulativami SOLAS (Safety of Life at Sea) za predmorske in komercialne pomorske operacije.


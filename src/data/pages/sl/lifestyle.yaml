hero:
  tagline: Življenjski slog
  title: Življenjski slog<br />afarer
  subtitle: Ustvarjeno za tiste, ki živijo na vodi — od vikend raziskovalcev do komercialnih operaterjev, ki se vsak dan zanašajo na svojo opremo.

values:
  - icon: 🌊
    title: Rojeno na vodi
    desc: Vsaka zasnova se začne z razumevanjem, kako se voda obnaša. Inženiring izvajamo od roba razmer navznoter — ker je ocean naš učitelj, ne naš delovni prostor.
  - icon: 🔧
    title: Zgrajeno za trajnost
    desc: Najbolj trajnosten izdelek je tisti, ki ga ni treba zamenjati. Pomorski materiali, drop-stitch jedra z ocenitvijo do 15 PSI in šivi, ki preživijo sezono.
  - icon: '🏆'
    title: Dostopno po zasnovi
    desc: Vodni športi ne bi smeli biti luksuz. Profesionalne zmogljivosti po ceni, ki ima smisel za družine, vodiče in male operaterje — ne le za komercialne flote.
  - icon: 🌍
    title: Globalna skupnost
    desc: 'Od obale Qingdaoa do jezer v Evropi, rek v jugovzhodni Aziji in zalivov v Ameriki — naše stranke povezuje eno: ljubezen do življenja na vodi.'
  - icon: ♻️
    title: Odgovorno proizvodnjo
    desc: CNC-optimizirana razporeditev zmanjšuje odpadek materiala pod 5 %. Trajna konstrukcija zmanjšuje cikle zamenjav. Gradimo za dolgo življenjsko dobo, ker je to najbolj trajnostna izbira.
  - icon: 🤝
    title: Podpora, ki traja
    desc: Lastniki dvajset let starih trupov nas še vedno kličejo po nadomestnih delih. Naš povprečni odziv na garancijske zahteve je 24 ur. Ne izginemo po prodaji — smo tu za celotno življenjsko dobo izdelka.


faqs:
  - question: 'Ali lahko na napihljivi deski SUP stojite in ribarite?'
    answer: 'Da. Širše napihljive deske SUP (33 palcev ali več) zagotavljajo dovolj stabilnosti za stojo in zabacanje. Palubne blazine EVA po celotni dolžini nudijo varen oprijem, ko so mokre.'
  - question: 'Ali je napihljiva deska SUP dobra za ribolov?'
    answer: 'Napihljive deske SUP so odlične ribiške platforme, zlasti za ribolov na plitvinah in pokrivanje plitvih voda. Široke zasnove omogočajo lahek dostop do ribiške opreme in pripomočkov.'
  - question: 'Koliko opreme lahko vzamem na napihljivo desko SUP?'
    answer: 'Večina napihljivih desk SUP nosi skupno nosilnost 220–300 lbs (veslač plus oprema). Tipična ribiška oprema s pripomočki, hladilnikom in varnostno opremo doda 20–40 lbs. Preverite volumensko oceno deske in se prepričajte o ustrezni nosilnosti.'
body: |
  <h2>Zakaj ribariti z napihljivim plovilom?</h2>
  <p>Napihljive deske SUP ribičem nudijo edinstvene prednosti, ki jih tradicionalni čolni ne morejo ponuditi. Njihov plitki ugrez omogoča dostop do voda, ki jih motorni čolni ne dosežejo, tiho približevanje pa zmanjšuje motnje za ribe. Prenosljivost pomeni, da lahko ribarite na odmaknjenih jezerih, rekah in obalnih območjih brez prikolice ali čolnske rampe.</p>
  <p>Ključne prednosti vključujejo:</p>
  <ul>
    <li><strong>Pritočnost</strong> — brez hrupa motorja se ribam lahko približate, ne da bi jih preplašili</li>
    <li><strong>Dostop do plitvih voda</strong> — ugrez le nekaj palcev omogoča ribolov v močvirjih, potokih in na plitvinah</li>
    <li><strong>Prenosljivost</strong> — plovilo odpeljete do odmaknjenih lokacij, ki jih čoln ne doseže</li>
    <li><strong>Zmožnost stoje</strong> — deske SUP omogočajo stojo za boljši pregled nad vodo</li>
  </ul>

  <h2>Zahteve glede stabilnosti</h2>
  <p>Ribolov zahteva stabilno platformo. Pri izbiri napihljivega plovila za ribolov dajte prednost:</p>
  <ul>
    <li><strong>Širini</strong> — širše deske (33–36 palcev) zagotavljajo boljšo stabilnost za stojo in zabacanje</li>
    <li><strong>Debelini</strong> — deske z debelino 6 palcev nudijo večjo togost in nosilnost za opremo</li>
    <li><strong>Prostornini</strong> — večja prostornina (300+ litrov) nosi skupno maso ribiča in opreme</li>
    <li><strong>Površini palube</strong> — palubna blazina iz EVA-pene po celotni dolžini nudi protizdrsni oprijem, ko je mokra</li>
  </ul>

  <h2>Združljivost opreme</h2>
  <p>Tipična napihljiva ribiška oprema vključuje:</p>
  <ul>
    <li><strong>Nosilci ribiških palic</strong> — priklopljeni ali na palubo pritrjeni nosilci za veslanje brez rok</li>
    <li><strong>Zabojnik ali hladilnik</strong> — pritrjen na palubo z elastiknimi privezi za pripomočke in ulov</li>
    <li><strong>Sidrni sistem</strong> — lahek zložljivi sidri ali kol za zadrževanje v toku</li>
    <li><strong>Vrvica za veslo</strong> — vesalo ostane pritrjeno, ko sta za ribolov potrebni obe roki</li>
    <li><strong>Rešilni jopič (PFD)</strong> — nujna varnostna oprema za vse ribiče</li>
  </ul>

  <h2>Priporočene vrste plovil za ribolov</h2>
  <p>Različnim ribiškim scenarijem ustrezajo različne vrste plovil:</p>

  <h3>Deske SUP za ribolov</h3>
  <p>Najboljše za: ribolov na plitvinah, lovljenje basov na jezerih, ribolov s opazovanjem v plitvi vodi. Dvignjen položaj stoje omogoča odlično vidljivost. Za stabilnost izberite širšo turistično ali vsestransko desko SUP.</p>

  <h3>Deske SUP za ribolov</h3>
  <p>Najboljše za: večosebne ribiške izlete, prenašanje težke opreme in zavarovane obalne vode. Deske SUP ponujajo prostor na palubi in nosilnost, hkrati pa ostajajo prenosljive.</p>

  <h2>Varnostni vidiki</h2>
  <ul>
    <li>Vedno nosite rešilni jopič — ribolov vključuje stojo, zabacanje in premikanje opreme, kar povečuje tveganje padca</li>
    <li>Pred odhodom preverite vremenske razmere in razmere na vodi</li>
    <li>Vzemite s seboj piščalko, telefon v vodotesnem etuiju in osnovni komplet za popravilo</li>
    <li>Sporočite nekomu svojo ribiško lokacijo in predviden čas vrnitve</li>
  </ul>

  <h2>Pogosta vprašanja</h2>
  <h3>Ali lahko na napihljivi deski SUP stojite in ribarite?</h3>
  <p>Da. Širše napihljive deske SUP (33 palcev ali več) zagotavljajo dovolj stabilnosti za stojo in zabacanje. Palubne blazine EVA po celotni dolžini nudijo varen oprijem, ko so mokre.</p>

  <h3>Koliko opreme lahko vzamem na napihljivo desko SUP?</h3>
  <p>Večina napihljivih desk SUP nosi skupno nosilnost 220–300 lbs (veslač plus oprema). Tipična ribiška oprema s pripomočki, hladilnikom in varnostno opremo doda 20–40 lbs. Preverite volumensko oceno deske in se prepričajte o ustrezni nosilnosti.</p>

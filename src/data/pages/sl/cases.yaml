features3_cases:
  tagline: 'Izpostavljeni primeri'
  title: 'Rešitve po meri<br />za realne izzive'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Flota evropskega potapljaškega centra'
      customer: 'Potapljaški centri BlueMed'
      country: 'Grčija'
      industry: 'Potapljanje in morski turizem'
      challenge: 'Zahtevali so 12 SUP desk s potapljaško konfiguracijo za verigo potapljaških centrov na več grških otokih. Vsaka deska je morala imeti pritrditve opreme po meri, prostor za 8 jeklenk in stabilno platformo za vstop potapljačev v odprto vodo. Flota je morala prispeti v 60 dneh, preden se začne turistična sezona.'
      solution: 'Izdelali smo 12 modelov SUP Voyager Dive z integriranimi nosilci opreme, stabilnimi platformami in široko konstrukcijo drop-stitch za stabilnost ob vkrcanju. Vsaka deska je bila opremljena z grafiko flote stranke. Vseh 12 desk je bilo preskušenih na tlak in odposlanih iz Qingdaoa v 55 dneh.'
      product: 'SUP Voyager Dive'
      results: 'Vseh 12 desk je bilo dostavljenih pravočasno za turistično sezono. Flota je v vsakodnevni uporabi 18+ mesecev brez odpovedi materiala. Stranka je v drugem letu naročila 6 dodatnih kosov.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive je hrbtenica naših vsakodnevnih potapljaških operacij. Stabilnost je odlična, razporeditev prostora za opremo pa drži palubo čisto in varno za naše goste.'
      icon: tabler:lifebuoy
    - title: 'Program sooblikovanja znamke z avstralskim distributerjem'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Avstralija'
      industry: 'Program sooblikovanja znamk in partnerstev'
      challenge: 'Avstralski distributer je potreboval linijo SUP desk z zasebno znamko po konkurenčnih cenah za tekmovanje s kitajskimi znamkami, ki prodajajo neposredno potrošnikom. Zahtevali so 8 unikatnih modelov od začetniške do napredne ravni, z grafiko po meri, embalažo po meri in izpolnjevanjem drop-ship za maloprodajne prodajalne.'
      solution: 'Razvili smo 8 modelov SUP (vsestranski, turistični, joga, otroški, športni, ultra-kompaktni, ultra-stabilni, za divje vode) z ekskluzivno avstralsko grafično opremo. Maloprodajna embalaža po meri s QR-kodami, ki vodijo do videov za nastavitev. Logistika drop-ship nastavljena iz Qingdaoa neposredno v avstralske trgovine.'
      product: 'Linija SUP po meri (8 modelov)'
      results: 'Od koncepta do prve pošiljke v 90 dneh. Maloprodajna stopnja prodaje 85 % v prvi sezoni. Distributer je v drugem letu razširil partnerstvo na dodatne modele SUP.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer je v 90 dneh dostavil celotno linijo SUP — od prve skice do maloprodajne police. Kakovost je primerljiva z znamkami, ki se prodajajo po dvojno višji ceni.'
      icon: tabler:currency-dollar
    - title: 'Dobava reševalne opreme na Bližnjem vzhodu'
      customer: 'Nacionalna uprava za civilno zaščito'
      country: 'Združeni arabski emirati'
      industry: 'Iskanje in reševanje'
      challenge: 'Organizacija civilne zaščite je potrebovala 20 patruljnim pripravljenih SUP desk za obalno iskanje in reševanje, varnost pristanišč in odziv na poplave. Zahtevali so dobro vidne deske, popolno varnostno opremo in skladnost z lokalnimi pomorskimi predpisi.'
      solution: 'Dobavili smo 20 modelov SUP Patrol z dobro vidno oranžno konstrukcijo drop-stitch, popolnimi varnostnimi kompleti, odbojnim trakom SOLAS in ojačano konstrukcijo. Vsaka deska je bila certificirana CE in preskušena po uporabnih standardih. Paket dokumentacije je vključeval certifikate skladnosti za lokalno registracijo.'
      product: 'SUP Patrol'
      results: 'Flota je razporejena po 5 obalnih postajah. Deske delujejo v ekstremni vročini (45 °C+) brez znakov poslabšanja. Zmogljivost in trajnost sta presegli specifikacije.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol je presegel naše operativne zahteve. V razmerah skrajne vročine deske po 24 mesecih vsakodnevne uporabe ne kažejo znakov razgradnje zaradi UV-žarkov.'
      icon: tabler:alert-triangle
    - title: 'Evropsko partnerstvo sooblikovanja znamke'
      customer: 'North Sea Marine Equipment BV'
      country: 'Nizozemska'
      industry: 'Program sooblikovanja znamk in partnerstev'
      challenge: 'Uveljavljena evropska pomorska znamka se je želela razširiti na trg SUP brez naložb v proizvodne obrate. Potrebovala je partnerja za belo oznako, ki zmore izdelati 5 modelov SUP (od 9 do 12 ft) z zasebnim označevanjem, certifikacijo CE in ekskluzivnimi pravicami distribucije v EU.'
      solution: 'Sklenili smo sporazum o proizvodnji z belo oznako za 5 modelov SUP. Vsak model je opremljen z logotipi in barvno shemo stranke. Dokumentacija o certifikaciji CE je pripravljena za vsak model. Podeljene so bile ekskluzivne pravice distribucije v EU z minimalnimi naročilnimi obveznostmi. Tehnična dokumentacija je zagotovljena za lokalno servisno omrežje.'
      product: 'Linija SUP po meri (5 modelov)'
      results: 'Podpisan večletni sporazum. Prva proizvodna serija 50 kosov je bila odposlana v 75 dneh. Znamka je bila predstavljena na pomembnem sejmu s pozitivnim odzivom trgovcev.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Sodelovanje z afarer nam je omogočilo vstop na trg SUP brez gradnje tovarne — dobavili so celovito rešitev po principu ključ v roke s certifikacijo CE in dokumentacijo za podporo trgovcem.'
      icon: tabler:building
    - title: 'Flota karibskega letovišča'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahami'
      industry: 'Morski turizem in gostinstvo'
      challenge: 'Luksuzno letovišče je potrebovalo popolno floto opreme za vodne športe za dejavnosti gostov: 40 SUP desk za vodene oglede, 20 dodatnih SUP za raziskovanje lagune, 10 SUP desk za izlete gostov ter dodatno opremo. Vsa oprema je morala imeti znamko letovišča po meri in biti dostavljena pred vrhom turistične sezone.'
      solution: 'Izdelali smo popoln paket SUP: 40 desk SUP Voyager (vsestranski model), 20 desk SUP Explorer, 10 desk SUP Touring ter rešilne jopiče, vesla, črpalke in reparaturne kompleta. Vsa oprema je natisnjena z logotipom letovišča in tropsko barvno shemo. Pošiljka v zabojniku s popolnim seznamom inventarja.'
      product: 'Popoln paket SUP (70+ kosov)'
      results: 'Flota je prispela 6 tednov pred vrhom sezone. Ocena zadovoljstva gostov z dejavnostmi na vodi se je v primerjavi s prejšnjim letom povečala za 40 %. Oprema traja že 3 sezone z le rutinskim vzdrževanjem.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Pristop popolnega paketa je pomenil, da smo prejeli vse, kar smo potrebovali, v eni sami pošiljki — deske in dodatki, vsi z znamko in pripravljeni za uporabo gostov. Naši gostje odlično ocenjujejo kakovost opreme.'
      icon: tabler:beach
    - title: 'Naročilo obalne patrulje ZDA'
      customer: 'Atlantska agencija za obalno varnost'
      country: 'Združene države Amerike'
      industry: 'Pomorska varnost in izvrševanje zakonov'
      challenge: 'Agencija za obalno varnost ZDA je zahtevala patruljne SUP deske za zahtevne odprtovodne operacije. Potrebovali so visokozmogljive deske z opremo vojaških specifikacij in skladnostjo s predpisi ameriške obalne straže.'
      solution: 'Konstruirali smo SUP Patrol z ojačano konstrukcijo drop-stitch, dobro vidnimi barvnimi shemami, nosilci za šifrirano komunikacijsko opremo in integriranimi točkami za pritrditev opreme. Deske so ojačane za zahtevne operacije. Zagotovljena je bila dokumentacija o skladnosti z USCG.'
      product: 'SUP Patrol'
      results: 'Agencija je v prvih 12 mesecih poročala o 95-odstotni pripravljenosti za naloge. Sledilo je dodatno naročilo 8 kosov.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol našim posadkam zagotavlja zmogljivost, ki jo zahtevajo odprtovodne operacije. Ojačana konstrukcija nudi ključno trajnost brez kompromisov pri upravljanju.'
      icon: tabler:shield

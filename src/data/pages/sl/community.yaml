stories:
  tagline: 'Zgodbe raziskovalcev'
  title: 'Prave dogodivščine pravih ljudi'
  subtitle: 'Poslušajte veslače, družine in profesionalce, ki na vodi uporabljajo opremo afarer.'
  items:
    - name: 'Sarah in Mike'
      title: 'Lastnika SUP Explorer 11, Kanada'
      content: 'Naši deski Explorer 11 sva vzela na tedenski izlet skozi park Algonquin. Čudovito sta prestali prenašanja in prečkanja jezer. Konstrukcija drop-stitch je pomenila, da sva ju lahko napihnila na 15 PSI in dobila zmogljivost trde deske iz deske, ki se pakuje.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Park Algonquin, Kanada'
    - name: 'Carlos R.'
      title: 'Veslač Cheetah Surge, Španija'
      content: 'Cheetah Surge je moja prva izbira za obalno križarjenje. Živahno oblikovanje na plaži privlači poglede, stabilnost pa mi daje zaupanje pri lažjih valovih. Odlično se obnese, ne glede na to, ali potujem ali le uživam ob sončnem zahodu.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Španija'
    - name: 'Lina in družina'
      title: 'Veslački Flowing Lotus, Švedska'
      content: 'Vikend družinske dogodivščine na otočju. Flowing Lotus je dovolj stabilna, da lahko nanjo stoji moja hči, medtem ko jaz veslam. Napihne se v približno 10 minutah — brez prikolice, samo čista družinska zabava na vodi.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Stockholmsko otočje, Švedska'
    - name: 'Lt. Cmdr. Andres'
      title: 'Raziskovalec Ocean Voyager, Filipini'
      content: 'Svoj Ocean Voyager uporabljam za dolge obalne ture po Palawanu. Po mesecih vsakodnevne uporabe v tropskih razmerah se deska še vedno obnaša kot nova. Turistična oblika reže valove, ki bi ustavili slabše deske.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palawan, Filipini'
    - name: 'Emma T.'
      title: 'Prvič na Tropical Breeze, Avstralija'
      content: 'Prej še nikoli nisem bila na deski SUP. Tropical Breeze je tako stabilna, da sem ob prvem poskusu že čutila zaupanje. Zdaj veslam vsak vikend. Učna krivulja je praktično nič — deska pa na vodi izgleda neverjetno.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Avstralija'


intro: Za razliko od znamk, ki proizvodnjo prepuščajo zunanjim tovarnam, afarer poseduje in upravlja celotno proizvodno verigo. Ta navpična integracija nam omogoča strog nadzor kakovosti v vsaki fazi, hiter odziv na zahteve po meri in dosledno kakovost izdelkov iz serije v serijo. Tako se deska izdela v našem obratu.

steps:
  - step: '01'
    title: Prevzem in pregled materiala
    description: Vsako dobro serijsko blago iz tkanine PVC, steklenih vlaken, smole in okovja se pregleda v skladu s specifikacijo. Vzorci tkanine se pred sprostitvijo v proizvodnjo preskusijo na natezno trdnost, enakomernost debeline in odpornost proti UV. Neustrezni materiali se dajo v karanteno in vrnejo.
    duration: 1–2 dneva
  - step: '02'
    title: Samodejno rezanje PVC
    description: Odobrene tkanine se položijo na samodejni rezalni stroj CNC in razrežejo z natančnostjo pod milimetrom. Računalniško optimizirana razporeditev ureja panele tako, da se odpadek minimizira — običajno pod 5 %. Razrezani paneli se označijo po modelu deske in komori ter povežejo v svežnje za prenos v varilno delavnico.
    duration: 2–4 ure na komplet deske
  - step: '03'
    title: Toplotno zapiranje in varjenje cevi
    description: Paneli se pritrdijo in spojijo s stroji za toplotno zapiranje z varjenjem z vročim zrakom pri nadzorovanih temperaturah 200–300 °C. Glavni šivi se ojačijo z RF dielektričnim varjenjem za zrakotesne, visokotrdne spoje. Dokončane komore se napihnejo na 1,5× delovnega tlaka za 30-minutno preverjanje zadrževanja zraka.
    duration: 1–2 dneva na desko
  - step: '04'
    title: Tiskanje in dekoriranje SUP
    description: Grafike na palubah deske SUP se nanašajo z digitalnim tiskom za celobarvne motive v fotokakovosti in s sitotiskom za trajne logotipe in ponavljajoče vzorce. Tiski se utrdijo in zapečatijo za odpornost proti UV in obrabi.
    duration: 1–2 dneva
  - step: '05'
    title: Končna sestava in oprema
    description: Deske se na montažni liniji opremijo s peresami, ventili, palubami EVA in dodatki. Vsaka enota sledi kontrolnemu seznamu s 100 točkami z obveznim potrditvijo v vsaki fazi.
    duration: 2–4 dnevi
  - step: '06'
    title: Preskušanje kakovosti in pregled
    description: 'Vsaka dokončana deska gre skozi obvezne preveritve kakovosti: preskus zadrževanja zraka v komorah, preverjanje delovanja okovja, preverjanje navora pritrdilnih elementov in kozmetični pregled. Izdelki po meri in prototipi opravijo tudi preizkuse v vodi, ki zajemajo stabilnost in vodenje.'
    duration: 1–2 dneva
  - step: '07'
    title: Pakiranje in odprema
    description: Deske se izpustijo, zložijo po postopku, zapakirajo v trpežne tkane vreče ali ločene zaboj iz vezanega lesa in naložijo za odpošiljanje. Vsak paket je označen z modelom, serijsko številko in destinacijo. Za pošiljke FCL in LCL po vsem svetu usklajujemo s špediterji.
    duration: 1 dan


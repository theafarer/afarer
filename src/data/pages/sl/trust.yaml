warranty_section:
  title: 'Garancija in podpora po prodaji'
  subtitle: 'Za vsak izdelek jamčimo z jasnimi garancijskimi pogoji, hitro obdelavo zahtevkov in originalnimi nadomestnimi deli.'
  items:
    - title: '2-letna garancija na izdelek'
      desc: 'Vsi izdelki afarer imajo 2-letno garancijo proti proizvodnim napakam — odpoved šivov, napake ventilov in luščenje materiala pri normalni uporabi.'
    - title: 'Podpora delov vse življenje'
      desc: 'Originalni nadomestni deli — ventili, kompleti za popravilo, plavutke, D-obroči — so na voljo za vse modele. Kalupe in orodja ohranjamo najmanj 5 let po koncu proizvodnje.'
    - title: 'Odgovor na zahtevek v 48 urah'
      desc: 'Garancijske zahtevke potrdimo v 48 urah. Nadomestne deske za odobrene zahtevke odpošljemo v 10 delovnih dneh.'
    - title: 'Globalno servisno omrežje'
      desc: 'Pooblaščeni servisni centri v 15+ državah. Kompleti za popravilo na terenu za oddaljene operacije. Vodniki za samostojno popravilo za manjšo škodo.'
    - title: 'Podpora strankam OEM'
      desc: 'Posvečeni upravitelji računov za partnerje B2B. Četrtletni poslovni pregledi, načrtovanje zalog in podpora pri trženju skupnih znamk.'
    - title: 'Certifikacijski paket'
      desc: 'Z vsako pošiljko je priložena popolna dokumentacija o skladnosti — CE-izjava, poročila o preizkusih, varnostni listi materialov.'
      link: '/contact'


  title: 'Viri o zaupanju'
  subtitle: 'Prenesite naš certifikacijski portfelj, poročila kontrole kakovosti in dokumentacijo o skladnosti.'
  items:
    - title: 'Certifikacijski portfelj'
      desc: 'Certifikati CE, ISO 9001, BSCI, REACH, RoHS, AS 1799 v enem paketu.'
    - title: 'Poročilo o standardih preskusov kontrole kakovosti'
      desc: '24–48-urni preskusi zadrževanja tlaka, staranje z UV po ISO, preverjanje natezne trdnosti — popolna metodologija.'
    - title: 'Profil tovarne in poročilo o reviziji'
      desc: 'Pregled objekta s površino 12.000 m² s fotografijami proizvodnih linij in povzetkom revizije tretje osebe.'
    - title: 'Dokument o garancijski politiki'
      desc: 'Popolni garancijski pogoji, postopek zahtevkov in cene nadomestnih delov.'
  cta_text: 'Zahtevajte vire o zaupanju'
  cta_link: '/contact'

faqs_sup:
  title: 'Pogosta vprašanja o deskah SUP'
  subtitle: 'Pogosta vprašanja o naših deskah za stoječe veslanje.'
  columns: 2
  items:
    - title: 'Katere velikosti desk SUP ponuja afarer?'
      description: 'Ponujamo deske SUP od 9 do 12 čevljev, ki pokrivajo vse od kompaktnih vsestranskih desk do turističnih in specialnih modelov. Vsak model je na voljo z več možnostmi konfiguracije.'
    - title: 'Kakšna je razlika med napihljivo desko SUP in trdo desko SUP?'
      description: 'Napihljiva deska SUP uporablja konstrukcijo drop-stitch s tisoči notranjih nitic, ki omogočajo visok zračni tlak, trda deska SUP pa epoksi ali steklena vlakna. Napihljive deske SUP ponujajo prenosljivost in priročno shranjevanje, ne da bi žrtvovale togost.'
    - title: 'Kolikšna je omejitev teže desk SUP?'
      description: 'Naše deske SUP nosijo do 150 kg, odvisno od modela in prostornine. Na strani vsakega izdelka je navedena največja dovoljena obremenitev za vaš model.'
    - title: 'Ali so deske SUP afarer certificirane po CE?'
      description: 'Da. Vsi rekreacijski modeli SUP so certificirani po CE v skladu z veljavnimi evropskimi standardi za rekreacijsko uporabo.'
    - title: 'Kakšna je garancija na deske SUP?'
      description: 'Vse deske SUP afarer imajo standardno enoletno garancijo proti proizvodnim napakam, ki pokriva odpoved šivov, napake ventilov in luščenje materiala pri normalni uporabi.'
    - title: 'Kako dolgo traja napihnitev deske SUP?'
      description: 'Z vključeno ročno črpalko traja popolno napihovanje do 15 PSI približno 8–12 minut. Za hitrejše napihovanje priporočamo našo električno črpalko afarer 12V, ki napihne desko v manj kot 4 minutah.'

faqs_materials:
  title: 'Pogosta vprašanja o materialih SUP'
  subtitle: 'Pogosta vprašanja o materialih, negi in shranjevanju naših napihljivih desk SUP.'
  columns: 2
  items:
    - title: 'Kateri materiali se uporabljajo v napihljivih deskah SUP afarer?'
      description: 'Uporabljamo vojaški PVC (1100 denier) s konstrukcijo, stabilizirano proti UV in odporno proti obrabi, v skladu z uredbama EU REACH in RoHS.'
    - title: 'Kako dolgo trajajo napihljive deske SUP?'
      description: 'Z ustrezno nego kakovostna napihljiva deska SUP iz PVC traja 5–10 let. Redno čiščenje, zaščita pred UV in pravilno shranjevanje bistveno podaljšajo življenjsko dobo.'
    - title: 'Kakšno vzdrževanje zahteva napihljiva deska SUP?'
      description: 'Osnovno vzdrževanje vključuje izpiranje s sladko vodo po vsaki uporabi (zlasti v slani vodi), sušenje pred shranjevanjem, letno preverjanje tesnil ventilov in izogibanje dolgotrajni izpostavljenosti soncu, ko se deska ne uporablja.'
    - title: 'Ali je napihljive deske SUP mogoče uporabljati v slani vodi?'
      description: 'Da. Vse napihljive deske SUP afarer so zasnovane za uporabo tako v sladki kot slani vodi. Po stiku s slano vodo priporočamo izpiranje s sladko vodo in temeljito sušenje.'
    - title: 'Kako shranim napihljivo desko SUP?'
      description: 'Desko pred shranjevanjem popolnoma izpustite, očistite in osušite. Rahljano zvijte (izogibajte se ostrim pregibom), shranite na hladnem in suhem mestu stran od neposredne sončne svetlobe in jo ne hranite na betonskih tleh, da preprečite vlečenje vlage.'
    - title: 'Kolikšna je nosilnost napihljivih desk SUP afarer?'
      description: 'Nosilnost se giblje od 100 kg pri naših najmanjših modelih do več kot 200 kg pri večjih deskah. Na strani vsakega izdelka je navedena največja dovoljena obremenitev za vaš model.'


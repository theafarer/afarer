features3_certifications:
  title: 'Certifikati in skladnost'
  subtitle: 'Vsak izdelek je neodvisno preizkušen in certificiran po mednarodnih standardih.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'Certifikacija CE'
      description: 'Vse deske SUP afarer izpolnjujejo evropski varnostni standard CE za rekreacijsko uporabo. Vsak izdelek pred odhodom iz tovarne prestane preizkuse tlaka, plovnosti in obremenitve.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'Naš objekt v Qingdaou s površino 12.000 m² deluje po sistemu upravljanja kakovosti ISO 9001. Vsaka proizvodna serija je sledljiva, dokumentirana in pregledana.'
      icon: 'tabler:clipboard-check'
    - title: 'Družbena skladnost BSCI'
      description: 'Certificirani smo po BSCI, kar zagotavlja etične delovne prakse, varne delovne razmere in okoljsko odgovornost v celotni dobaviteljski verigi.'
      icon: 'tabler:users'
    - title: 'REACH in RoHS'
      description: 'Vsi materiali — PVC, EVA pena, lepila — so skladni z uredbama EU REACH in RoHS. Brez omejenih snovi, brez kompromisov.'
      icon: 'tabler:flask'
    - title: 'Laboratorij za preizkušanje materialov'
      description: 'Interni laboratorij za materiale preizkuša natezno trdnost, odpornost na UV, celovitost šivov in odpornost proti obrabi za vsak los tkanine pred proizvodnjo.'
      icon: 'tabler:microscope'
    - title: '2-letna garancija'
      description: 'Vsak izdelek afarer ima dvoletno garancijo proti proizvodnim napakam. Za svoje izdelke jamčimo.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'Zaupanje strank'
  title: 'Kaj pravijo naše stranke'
  subtitle: 'Od veslačev začetnikov do profesionalnih upravljavcev flot — poglejte, zakaj zaupajo afarer.'
  items:
    - content: 'Svojo celotno najemno floto smo opremili z deskami SUP afarer. Po dveh sezonah nič odpovedi. Certifikacija CE je omogočila brezhibno odobritev zavarovanja.'
      name: 'Marco V.'
      title: 'Upravljavec turističnih izletov, Hrvaška'
    - content: 'Kot kupec prvič sem bil nervozen glede kakovosti. Dokumentacija ISO in poročila o preizkusih, ki so jih delili z mano, so mi dala popolno zaupanje.'
      name: 'James T.'
      title: 'Lastnik SUP Explorer 11, Kanada'
    - content: 'Z afarerjem sodelujemo pri naših enotah za obalni nadzor. Njihov proces kontrole kakovosti je dosleden pri vsaki seriji — ta zanesljivost je ključna pri misijah z najvišjo stopnjo odgovornosti.'
      name: 'Lt. Cmdr. Andres'
      title: 'Vladna javna naročila, Filipini'

steps2_manufacturing:
  title: 'Kako zagotavljamo kakovost'
  subtitle: 'Od pregleda surovin do končnega preizkusa tlaka — vsak izdelek gre skozi rigorozno kakovostno verigo.'
  items:
    - title: 'Pregled surovin'
      description: 'Vsak zvitek tkanine PVC je pred vstopom v proizvodnjo preizkušen na debelino, natezno trdnost in odpornost na UV.'
      icon: 'tabler:search'
    - title: 'Kontrola kakovosti med proizvodnjo'
      description: 'Varjene šive, vgrajene ventile in spoji komor pregledamo na vsaki postaji med sestavljanjem.'
      icon: 'tabler:eye'
    - title: 'Preizkus tlaka'
      description: 'Vsak napihljiv izdelek se napihne na 1,25-kratni nazivni PSI in se vzdržuje 24–48 ur za preverjanje zadrževanja zraka in celovitosti šivov.'
      icon: 'tabler:wind'
    - title: 'Končni pregled'
      description: 'Vsako enoto pred odobritvijo za odpremo pregledamo glede zaključne obdelave, okovja in embalaže. Vzorce serije pošljemo v naš laboratorij na destruktivne preizkuse.'
      icon: 'tabler:clipboard-check'


meta:
  title: 'Proizvodnja SUP pod zasebno znamko in zagon znamke po meri | {SITE}'
  description: 'Proizvajalec SUP desk pod zasebno znamko za nove znamke veslaških desk. Zaženite svojo znamko SUP z Afarer — popolna storitev OEM/ODM, vključno z oblikovanjem, prototipi, blagovno znamko po meri, proizvodnjo in globalno logistiko.'

hero:
  tagline: 'Zgradite svojo znamko'
  title: 'Zaženite svojo<br />znamko SUP'
  subtitle: 'Vi imate vizijo. Mi imamo tovarno, strokovno znanje in dobavno verigo. Proizvodnja SUP desk pod zasebno znamko in razvoj znamke SUP po meri — skupaj bomo zgradili znamko, ki izstopa.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Deska SUP z znamko po meri na vodi'

process:
  title: 'Pot vaše znamke'
  subtitle: 'Od ideje do trga v 5 stopnjah.'
  steps:
    - phase: 'Stopnja 1'
      title: 'Ideja'
      period: 'Teden 1-2'
      items:
        - 'Raziskava trga in analiza konkurence'
        - 'Opredelitev ciljnih strank'
        - 'Delavnica o pozicioniranju znamke'
        - 'Strategija linije izdelkov'
    - phase: 'Stopnja 2'
      title: 'Oblikovanje'
      period: 'Teden 3-6'
      items:
        - 'Oblika deske in grafično oblikovanje'
        - 'Ujemanje barv in izbira materialov'
        - 'Specifikacija dodatkov'
        - 'Oblikovanje embalaže in etiket'
    - phase: 'Stopnja 3'
      title: 'Prototip'
      period: 'Teden 7-10'
      items:
        - 'Proizvodnja vzorca'
        - 'Preskušanje kakovosti (tlak, plovnost, UV)'
        - 'Prilagoditve oblikovanja'
        - 'Končna odobritev'
    - phase: 'Stopnja 4'
      title: 'Proizvodnja'
      period: 'Teden 11-14'
      items:
        - 'Serijska proizvodnja'
        - 'Pregled QC (za vsako enoto)'
        - 'Pomorski / letalski prevoz'
        - 'Dokumenti za carinsko razjasnitev'
    - phase: 'Stopnja 5'
      title: 'Zagon'
      period: 'Teden 15-16'
      items:
        - 'Fotografiranje izdelkov'
        - 'Spletni vir podatkov o izdelkih'
        - 'Trženjska gradiva'
        - 'Podpora ob zagonu'

packages:
  title: 'Paketi za zagon'
  subtitle: 'Paketi, zasnovani za vsako stopnjo rasti znamke.'
  items:
    - name: 'Začetna znamka'
      tagline: '50-100 enot · 2 modela desk'
      features:
        - 'Osnovni tisk logotipa'
        - 'Standardna embalaža'
        - 'Podpora po e-pošti'
    - name: 'Rastoča znamka'
      tagline: '300-1.000 enot · 3-5 modelov desk'
      features:
        - 'Barva po meri + logotip'
        - 'Embalaža po meri'
        - 'Fotografije izdelkov'
        - 'Posvečen upravitelj'
    - name: 'Uveljavljena znamka'
      tagline: '1.000+ enot · celotna linija izdelkov'
      features:
        - 'Popolna prilagoditev'
        - 'Premium embalaža'
        - 'Trženjska gradiva'
        - 'Prednostna proizvodnja'


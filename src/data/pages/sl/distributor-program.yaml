faqs:
  title: 'Državno partnerstvo — pogosta vprašanja'
  subtitle: 'Vprašanja, ki jih resni državni partnerji zastavijo pred prijavo.'
  items:
    - title: 'Kaj model ena država–en distributer dejansko pomeni?'
      description: 'Afarer imenuje enega samega pooblaščenega distributerja z ekskluzivnimi pravicami za določeno ozemlje. Ne prodajamo iz svojih globalnih ali regionalnih kanalov v zaščiteno državo. Lastništvo vašega ozemlja velja, dokler so izpolnjene obveznosti distribucijskega sporazuma.'
    - title: 'Je ozemlje ekskluzivno za vedno?'
      description: 'Ne. Ekskluzivnost je pogojna, ne večna. Ohranja se s podpisanim distribucijskim sporazumom, izvedbo prvega naročila, letnimi nakupnimi cilji, lokalno zalogo, poprodajnimi zmožnostmi in nadaljnjimi naložbami v trg. Če ti pogoji niso izpolnjeni, se lahko ozemlje znova pogaja ali prenese.'
    - title: 'Kolikšno je najmanjše prvo naročilo?'
      description: 'Državni in regionalni distributerji začnejo pri 100–300 kosih; pooblaščeni trgovci pri 30–50 kosih; poskusna naročila od 10–30 kosov vam omogočajo, da najprej preverite trg (poskusna in vzorčna naročila ne nosijo ozemeljske zaščite). Programi po meri in zasebnih znamk sledijo ločenim MOQ, navedenim v ravneh zgoraj.'
    - title: 'Kakšna podpora je vključena v program podpore z 10 moduli?'
      description: 'Ravni in kvalifikacije, zaščita ozemlja, MOQ / cene / letni popusti, zaloga in izvedba naročil, tržna sredstva in skupna tržna sredstva, usposabljanje o izdelkih / prodaji / tehniki, rezervni deli in poprodajne storitve, registracija garancije, portal za partnerje ter podatki o izdelkih, knjižnica trženih sredstev, letni razpored popustov ter transportni in pakirni seznami.'
    - title: 'Kako me Afarer ščiti pred konflikti prodajnih kanalov?'
      description: 'Vsako ozemlje ima natanko enega pooblaščenega distributerja. Poizvedbe in neposredna naročila iz vaše regije se usmerjajo skozi vas, spletni obrazci se posredujejo lokalnemu partnerju, kjer ta obstaja, globalna ekipa pa posreduje šele, ko partner ne odgovori.'
    - title: 'Kakšni so pogoji dostave in plačila?'
      description: 'Naročila se odpošiljajo FOB Qingdao s popolno izvozno dokumentacijo. Proizvodna naročila: 30 % akontacija in 70 % pred odpošiljanjem; poskusna in vzorčna naročila so predplačana. Standardni rok dobave je 30–45 delovnih dni, za vzorčne serije 15–20 delovnih dni.'
    - title: 'Kako se prijavim?'
      description: 'Pošljite vlogo prek kontaktnega obrazca s podrobnostmi o trgu. Pregledamo ujemanje s trgom, maloprodajno prisotnost in logistične zmožnosti, nato v 3 delovnih dneh odgovorimo z naslednjimi koraki in vzorčnim distribucijskim sporazumom.'

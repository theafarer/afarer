content_html: |
  <h2>1. Predkvalifikacija: na kaj biti pozoren pri tovarni</h2>

  <h3>Certifikati o skladnosti</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Sistem upravljanja kakovosti</li>
    <li><strong>Certifikacija CE</strong> – Preverite številko notificiranega organa</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Revizije socialne skladnosti</li>
    <li><strong>REACH / RoHS</strong> – Izjave o skladnosti materialov</li>
  </ul>

  <h3>Proizvodne zmožnosti</h3>
  <ul>
    <li>Lastno tkanje jedra drop-stitch ali zunanje izvajanje</li>
    <li>Linija za prevleke in laminacijo PVC</li>
    <li>Oprema za varjenje RF in varjenje z vročim zrakom</li>
    <li>Lastna izdelava kalupov (obdelava CNC)</li>
    <li>Preskusni laboratorij (preskušanje tlaka, staranje z UV, natezno preskušanje)</li>
  </ul>

  <h3>Preverjanje izkušenj</h3>
  <ul>
    <li>Let v proizvodnji napihljivih plovil (najmanj 5+ let)</li>
    <li>Število inženirjev v zaposlitvi</li>
    <li>Obstoječe stranke OEM/ODM (zahtevajte reference)</li>
    <li>Izvozne destinacije – ali že dostavljajo na vaš ciljni trg?</li>
  </ul>

  <h2>2. Protokoli nadzora kakovosti</h2>
  <p>Vhodni QC materiala: natezna trdnost (ASTM D751 ali ISO 1421), odpornost na trganje (ASTM D2261 ali ISO 4674), trdnost oprijema, nadzorne preglede staranja z UV.</p>
  <p>QC med proizvodnjo: spremljanje trdnosti šivov na vsakih 50 kosov, preverjanje navora ventilov, kontrole gostote niti drop-stitch, dimenzijski pregledi glede na risbe CAD.</p>
  <p>Končni pregled: 100-odstotni preskus zadrževanja napihnjenosti (24 ur, največ 5-odstotni padec), optični pregled, preskus delovanja ventilov, preskušanje naključnih vzorcev (AQL 2.5 ali 4.0 po ISO 2859).</p>

  <h2>3. Kontrolni seznam dokumentacije o skladnosti</h2>
  <ul>
    <li>Izjava o skladnosti (DoC) s sklicem na pravilno direktivo EU</li>
    <li>Certifikat CE notificiranega organa</li>
    <li>Preskusno poročilo akreditiranega laboratorija</li>
    <li>Varnostni listi materialov (MSDS)</li>
    <li>Izjava o skladnosti z REACH</li>
    <li>Kosovnica s sledljivostjo dobaviteljev</li>
    <li>Poročilo o pregledu tovarne</li>
  </ul>

  <h2>4. Pogajanja o MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Vrsta izdelka</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standardni MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Obseg pogajanj</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP deske</td><td class="p-3 border">50 – 100 kosov</td><td class="p-3 border">5 – 10 kosov (poskusno)</td></tr>
      <tr><td class="p-3 border">Kajaki</td><td class="p-3 border">50 – 100 kosov</td><td class="p-3 border">5 – 10 kosov (poskusno)</td></tr>
      <tr><td class="p-3 border">Napihljive SUP deske</td><td class="p-3 border">50 – 100 kosov</td><td class="p-3 border">2 – 5 kosov (poskusno)</td></tr>
      <tr><td class="p-3 border">Varnostna oprema / dodatki</td><td class="p-3 border">200 – 500 kosov</td><td class="p-3 border">50 – 100 kosov (poskusno)</td></tr>
    </tbody>
  </table>

  <h2>5. Logistika in dostava</h2>
  <p>Pogosti incoterms: <strong>FOB</strong> (tovarna dostavi do pristanišča odhoda – najpogostejše), <strong>EXW</strong> (kupec uredi vso dostavo od vrat tovarne), <strong>CIF</strong> (tovarna plača prevoz in zavarovanje do pristanišča cilja).</p>
  <p>Napihljivi izdelki so lahkotni, a prostorninski – prostorninska teža (DIM) pogosto določa stroške dostave. Zahtevajte vakuumsko pakirano embalažo za zmanjšanje volumna za 50–60 %. Pomorski prevoz iz Kitajske v EU: 25–35 dni; na zahodno obalo ZDA: 15–20 dni.</p>

  <h2>6. Pogoste pasti</h2>
  <ul>
    <li><strong>Brez revizije tovarne:</strong> Vedno izvedite revizijo sami ali jo naročite pri tretji osebi (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Samo ustne specifikacije:</strong> Podroben tehnični list specifikacij, podpisan s strani obeh strani</li>
    <li><strong>Preskakovanje odobritve vzorcev:</strong> Pisna potrditev vzorcev pred serijsko proizvodnjo</li>
    <li><strong>Brez QC med proizvodnjo:</strong> Inšpiciranje tretje osebe med proizvodnjo (DUPRO) in pred odpošiljanjem (PSI)</li>
    <li><strong>Preziranje skladnosti:</strong> Preverite certifikacijo CE/UKCA pred proizvodnjo</li>
  </ul>

  <h2>7. Zakaj Afarer</h2>
  <p>Afarer od leta 2012 izdeluje napihljiva plovila OEM/ODM. Z obratom s 12,000 m&sup2;, certifikatom ISO 9001, 25+ inženirji in certifikacijo CE v vseh proizvodnih linijah izpolnjujemo vsako merilo iz tega vodnika. Novim partnerjem ponujamo poskusne MOQ in popolne pakete dokumentacije o skladnosti.</p>


  subtitle: '6 min branja'

content_html: |
  <h2>Tri standardne debeline</h2>

  <h3>4" (10 cm) – Turizem in zmogljivost</h3>
  <ul>
    <li>Najvišja togost – manj upogiba pod obremenitvijo</li>
    <li>Najlažja – manj materiala, manj zračnega volumna</li>
    <li>Odlično držanje smeri – zmanjšano bočno guganje</li>
    <li>Najhitrejša – zmanjšen upor, lažje drsenje</li>
    <li>Najboljša za: turistično veslanje, dirkanje, fitnes veslanje, izkušene veslače</li>
  </ul>

  <h3>5" (12,7 cm) – Vsestranska</h3>
  <ul>
    <li>Dobra togost – uravnoteženo razmerje med upogljivostjo in togostjo</li>
    <li>Zmerna masa – standardna poraba materiala</li>
    <li>Dobra primarna in sekundarna stabilnost</li>
    <li>Najboljša za: rekreacijsko veslanje, začetnike, sproščeno uporabo na jezerih in rekah</li>
  </ul>

  <h3>6" (15,2 cm) – Stabilnost in joga</h3>
  <ul>
    <li>Najvišja primarna stabilnost – velik vzgon</li>
    <li>Najtežja – več materiala PVC, večji zračni volumen</li>
    <li>Najpočasnejša – več upora, težje ohranjanje drsenja</li>
    <li>Najboljša za: jogo/fitnes, težje veslače (100+ kg), zelo valovite razmere</li>
  </ul>

  <h2>Inženirska analiza</h2>
  <p>Togost napihljive deske SUP določata notranji zračni tlak in vztrajnostni moment prereza deske. Pri 20 PSI kaže deska z 4" približno 30 % manj upogiba pod obremenitvijo kot deska z 6" enake širine in dolžine. Primarna stabilnost izhaja iz širine vodne črte in vzgona; na sekundarno stabilnost vplivata oblika robov in širina deske.</p>

  <h2>Debelina glede na maso veslača</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Masa veslača</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Priporočena debelina</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Pod 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" ali 6"</td></tr>
      <tr><td class="p-3 border">Nad 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Razmerje med debelino in PSI</h2>
  <p>Pogosta zmerna je, da višji PSI lahko nadomesti prekomerno debelino. Pri 25 PSI kaže deska z 6" več upogiba kot deska z 4" pri 15 PSI, ker geometrični vztrajnostni moment prevladuje v enačbi togosti. Za zmogljivostno usmerjene veslače deska tanjša pri nižjem tlaku prekaša debelejšo desko pri višjem tlaku.</p>

  <h2>Ponudba Afarer</h2>
  <ul>
    <li><strong>Deske z 4":</strong> serija Cheetah Touring – turistične deske SUP 12' x 30" x 4" za fitnes in dolgo razdalje</li>
    <li><strong>Deske s 5":</strong> serija Cheetah All-Round – 10'6" x 32" x 5" za rekreacijsko uporabo</li>
    <li><strong>Deske z 6":</strong> serija Cheetah Ultra-Stable – 10' x 34" x 6" za jogo, velike veslače in fotografske platforme</li>
  </ul>
  <p>Vse deske uporabljajo jedra iz drop-stitcha z 1.680 DTEX, ocenjenim tlakom 20 PSI in laminati PVC debeline 1,2 mm.</p>


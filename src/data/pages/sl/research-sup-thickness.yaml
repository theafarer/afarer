  description: 'Tehnični vodnik po debelini napihljivih desk SUP: kako se deske z 4", 5" in 6" razlikujejo v togosti, masi, stabilnosti, držanju smeri in zmogljivosti. Priporočila debeline za turistično veslanje, jogo, surfanje, dirkanje in vsestransko veslanje.'
back_text: 'Nazaj na raziskave'


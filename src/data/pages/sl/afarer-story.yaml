timeline:
  - year: '2012'
    title: 'Temelji pomorske proizvodnje'
    body: 'afarer je začel kot specializirana delavnica za plovila v Qingdaou na Kitajskem, zavezana pomorski obrti in proizvodnji plovil. Zgodnje obdobje je bilo osredotočeno na izdelovanje zanesljivih napihljivih izdelkov s praktičnimi inženirskimi izkušnjami in proizvodno disciplino.'
  - year: '2015'
    title: 'Prvi izvoz in certifikacija CE'
    body: 'Prva izvozna naročila so dosegla Japonsko in Korejo. Za jedrne izdelkovne linije je bila pridobljena certifikacija CE, kar je označilo vstop afarer na mednarodne trge. Podjetje je začelo oskrbovati komercialne in rekreacijske uporabnike tudi izven Kitajske.'
  - year: '2018'
    title: 'Širitev tovarne'
    body: 'Preselili smo se v proizvodni objekt s površino 12.000 m². Dodali smo linije za VF-varjenje in kapaciteto proizvodnje drop-stitch, kar je omogočilo obsežnejšo proizvodnjo in izboljšane sisteme kontrole kakovosti.'
  - year: '2020'
    title: 'Ustanovitev centra za R&D'
    body: 'Odprli smo namenski center za razvoj in raziskave z laboratorijem za tkanine PVC, preskusnim bazenom za hidrodinamiko in studiem za simulacije CAD/FEA. Razvoj izdelkov se je razširil na lahko konstrukcijo, izboljšano trajnost in oblikovanje, osredotočeno na uporabnika.'
  - year: '2022'
    title: 'Certifikacija in globalna rast'
    body: 'Pridobili smo certifikacijo ISO 9001. Razširili smo se na 14 inženirjev R&D in več kot 200 delavcev. Izdelki so prek distributerjev in partnerstev za skupne blagovne znamke dosegli stranke po Evropi, Amerikah in azijsko-pacifiški regiji.'
  - year: '2024'
    title: 'Studio za inovacije in oblikovanje'
    body: 'Zagnali smo celovit studio za oblikovanje in inovacije za projekte skupnih blagovnih znamk po meri, od koncepta do proizvodnje. Okrepili smo profesionalne pomorske aplikacije, vključno z reševanjem, komercialnimi in vladnimi pogodbami.'
  - year: '2026'
    title: 'Gradnja prihodnosti raziskovanja voda'
    body: 'Danes afarer še naprej razvija sisteme SUP in pomorske dodatke — povezuje ljudi in organizacije z vodami sveta. Oskrbovanih več kot 50 držav, letna kapaciteta več kot 15.000 enot.'

content_founding:
  tagline: 'Začetek'
  title: 'Rojeni na obali'
  subtitle: 'afarer je začel v obalni delavnici v Qingdaou z eno desko in vizijo: izdelovati napihljiva plovila, ki zmorejo prave pomorske razmere.'
  paragraphs:
    - 'Leta 2012 so naši ustanovitelji opazili vrzel na trgu — večina napihljivih plovil je bila bodisi cenovno dostopna, a nezanesljiva, bodisi kakovostna, a nedopustno draga. Verjeli so, da je prostor za proizvajalca, ki ponuja tako kakovost kot vrednost.'
    - 'Prvi trup je bil izdelan ročno, preizkušen v lokalnih vodah in izpopolnjen na podlagi resničnih povratnih informacij ribičev in malih komercialnih operaterjev. Ta krog povratnih informacij — izdelaj, preizkusi, poslušaj, izboljšaj — ostaja jedro našega inženirskega prepričanja še danes.'
    - 'Do leta 2015 se je glas razširil izven Qingdaoa. Mednarodni distributerji so začeli zahtevati vzorce. Tisto, kar se je začelo kot lokalna delavnica, je postajalo globalni dobavitelj.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'zgodnja proizvodna delavnica afarer in proizvodnja'

content_growth:
  tagline: 'Rast in inovacije'
  title: 'Od delavnice do objekta s površino 12.000 m²'
  subtitle: 'Nenehna vlaganja v ljudi, opremo in procese so afarer preoblikovala v sodoben proizvodni objekt za pomorsko opremo.'
  paragraphs:
    - 'Ko je povpraševanje raslo, je rasel tudi naš objekt. Iz majhne delavnice smo se razširili v tovarno s površino 12.000 m² z namenskimi proizvodnimi linijami za deske SUP in dodatke.'
    - 'Vložili smo v CNC-stroje za rezanje, opremo za visokofrekvenčno varjenje, proizvodne linije drop-stitch in celovite preizkušalne naprave — kar nam omogoča nadzor nad vsakim vidikom kakovosti proizvodnje.'
    - 'Danes naša ekipa z več kot 200 člani vključuje pomorske inženirje, materialne znanstvenike, specialiste za kontrolo kakovosti in vešče obrtnike — mnogi od njih so z afarerjem od zgodnjih dni.'

philosophy:
  tagline: 'Filozofija blagovne znamke'
  title: 'Inženiring svobode na vodi'
  body: 'Svoboda na vodi ni le gibanje. Predstavlja odkrivanje novih krajev, ustvarjanje doživetij na prostem, povezovanje ljudi z naravo in omogočanje profesionalnih misij. Inženiring to svobodo omogoča.'
  pillars:
    - title: 'Zanesljivost na prvem mestu'
      body: 'Vodna okolja zahtevajo zaupanje. Izdelki afarer so zasnovani okoli stabilnosti, trajnosti, varnosti in doslednih zmogljivosti.'
    - title: 'Oblikovanje, osredotočeno na človeka'
      body: 'Izdelki naj služijo ljudem, ne tehnologiji. Vsaka odločitev pri oblikovanju se začne z razumevanjem, kako ljudje uporabljajo plovila, kje raziskujejo in s katerimi izzivi se srečujejo.'
    - title: 'Dostopno raziskovanje'
      body: 'Voda ne bi smela pripadati le strokovnjakom. afarer ustvarja opremo, ki več ljudem omogoča varno doživetje rek, jezer, oceanov in obalnih okolij.'
    - title: 'Nenehne inovacije'
      body: 'Inovacija ni le ustvarjanje novih izdelkov. Je izboljševanje vsake podrobnosti — materialov, konstrukcij, proizvodnje in uporabniške izkušnje.'

engineeringDna:
  tagline: 'Inženirska DNK'
  title: 'Kako afarer ustvarja izdelke'
  areas:
    - title: 'Znanost o materialih'
      body: 'afarer se osredotoča na izbiro ustreznih materialov za različna pomorska okolja. Ključna merila vključujejo odpornost proti obrabi, odpornost na UV, stabilnost tlaka in dolgoročno trajnost.'
      items: ['Odpornost proti obrabi', 'Odpornost na UV', 'Stabilnost tlaka', 'Dolgoročna trajnost']
    - title: 'Konstrukcijski inženiring'
      body: 'Napihljiva plovila zahtevajo natančno ravnovesje med togostjo, težo, prenosljivostjo in stabilnostjo. Inženiring afarer se osredotoča na optimizacijo teh dejavnikov s tehnologijo jedra drop-stitch in napredno konstrukcijo šivov.'
      items: ['Togost', 'Optimizacija teže', 'Prenosljivost', 'Stabilnost']
    - title: 'Proizvodna natančnost'
      body: 'Vsak izdelek gre skozi nadzorovane procese: priprava materialov, natančno rezanje, varjenje in lepljenje, sestavljanje, pregled kakovosti in preverjanje zmogljivosti.'
      items: ['Priprava materialov', 'Natančno rezanje', 'Varjenje in lepljenje', 'Sestavljanje in kontrola kakovosti']
    - title: 'Inženiring uporabniških scenarijev'
      body: 'Izdelki se razvijajo okoli resničnih aplikacij — rekreacije, pustolovščin in profesionalne uporabe — kar zagotavlja, da vsak model izpolnjuje specifične zahteve svojega predvidenega okolja.'
      items: ['Rekreacija', 'Pustolovščina', 'Profesionalno', 'Komercialno']


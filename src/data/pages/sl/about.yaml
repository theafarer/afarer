meta:
  title: 'O znamki Afarer — znamka napihljivih desk SUP in vodnih športov | {SITE}'
  description: 'Afarer je globalna znamka napihljivih desk SUP in vodnih športov, ki jo upravlja Aquafarer LLC (ZDA), gradila pa jo je naša operativna ekipa v Qingdaou. Odkrijte našo zgodbo, inženiring, certificirano kakovost in programe državnih partnerjev.'
  keywords:
    - 'znamka napihljivih desk SUP'
    - 'znamka vodnih športov'
    - 'državni distributer sup'
    - 'kolekcije sup s skupno znamko'
hero:
  tagline: 'O nas'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'tovarna in delavnica afarer'
  title: |
    Pomorski inženiring, <br />
    zgrajen na način <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Začeli smo v obalni delavnici z eno desko in trmastim prepričanjem: pomorski izdelki morajo biti inženirsko zasnovani, kot da so pomembni, ker so. Danes odpošiljamo v več kot 40 držav, vsak trup pa še vedno preide skozi iste roke, ki so začele podjetje.'


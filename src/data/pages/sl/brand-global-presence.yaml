features3_markets:
  tagline: 'Ključni trgi'
  title: 'Regionalno strokovno znanje<br />za lokalne zahteve'
  subtitle: 'Razumemo, da imajo različni trgi različne regulativne zahteve, preference primere uporabe.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Evropa in Združeno kraljestvo'
      description: 'Izdelki s certifikatom CE. Močno povpraševanje po deskah SUP na trgih EU. Distributerji v Združenem kraljestvu cenijo našo hitro obratno dobo.'
      icon: tabler:map-pin
    - title: 'Severna Amerika'
      description: 'Proizvodnja, odobrena s strani ameriške obalne straže. Skladišče v ZDA v Montclairju v Kaliforniji za hitro dostavo na zahodno obalo. Rastoče povpraševanje po ribiških, reševalnih in rekreacijskih deskah SUP.'
      icon: tabler:map-pin
    - title: 'Avstralija in Oceanija'
      description: 'Močan trg za deske SUP in dodatke za vodne športe. Avstralski distributerji cenijo našo konstrukcijo iz PVC, odporno na UV, v ostrih sončnih razmerah. Hitra odprema iz našega azijskega objekta.'
      icon: tabler:map-pin
    - title: 'Bližnji vzhod'
      description: 'Rastoče povpraševanje po opremi za vodne dogodivščine. Naše deske SUP komercialnega razreda in varnostna oprema so priljubljene pri operaterjih izletov in najemnih centrih. Konfiguracije po meri za visokotemperaturna okolja.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Distribucijsko omrežje'
  title: 'Partnerstvo z distributerji<br />po vsem svetu'
  subtitle: 'Sodelujemo z uveljavljenimi distributerji pomorske opreme, znamkami vodnih športov in vladnimi naročniki.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Programi skupnih znamk'
      description: 'Proizvodnja zasebnih znamk za globalne znamke vodnih športov. Poskrbimo za vse od oblikovanja do proizvodnje in neposredne odpošiljanja.'
      icon: tabler:building
    - title: 'Omrežje distributerjev'
      description: 'Pooblaščeni distributerji v več kot 20 državah hranijo zaloge in zagotavljajo lokalno podporo. Nove povpraševanja distributerjev so dobrodošla.'
      icon: tabler:users
    - title: 'Vladne in institucionalne stranke'
      description: 'Neposredna oskrba obalnih straž, organizacij za iskanje in reševanje ter vojaških nabavnih programov. Skladnost z institucionalnimi nabavnimi zahtevami.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Globalna logistika in podpora'
  subtitle: 'Od tovarne do destinacije — upravljamo celotno dobaviteljsko verigo.'
  items:
    - title: 'Možnosti odpošiljanja'
      description: 'Morski prevoz (FOB Qingdao), letalski prevoz za nujna naročila in hitri kuri za vzorce in nadomestne dele.'
      icon: tabler:truck-delivery
    - title: 'Skladišče v ZDA'
      description: 'Zaloge v Montclairju v Kaliforniji za hitro dostavo po Severni Ameriki. Zahodna obala: 2–3 dni, srednji del: 3–4 dni, vzhodna obala: 4–5 dni.'
      icon: tabler:building-warehouse
    - title: 'Nadomestni deli'
      description: 'Originalni nadomestni deli in potrošni material afarer na zalogi vse leto. Pogosti deli se odpošljejo v 24 urah.'
      icon: tabler:package
    - title: 'Tehnična podpora'
      description: 'Neposredna linija do naše inženirske ekipe za tehnična vprašanja, nasvete za popravila in podporo nadomestnih delov. Podpiramo deske, ki smo jih izdelali pred 20 leti.'
      icon: tabler:headset

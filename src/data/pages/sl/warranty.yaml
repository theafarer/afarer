subtitle: 'afarer jamči za kakovost vsakega napihljivega pomorskega izdelka, ki ga izdelamo. Ta omejena garancija določa pogoje in obseg pokritja za vaš izdelek afarer.'
seo:
  headline: 'Garancija afarer za napihljive deske SUP — 5-letna omejena garancija | afarer'
  description: 'afarer nudi 5-letno omejeno garancijo na glavno tkanino palube, šive in strukturno celovitost jedra drop-stitch. Pokriva tudi ventile za napihovanje in tovarniško vgrajene dodatke. Popolni pogoji garancije za napihljive deske SUP afarer.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Ta omejena garancija velja za nove napihljive pomorske izdelke z znamko afarer, kupljene neposredno pri afarerju ali pri pooblaščenem prodajalcu oz. trgovcu afarer. Začetni datum je preverljiv datum prvotnega maloprodajnega nakupa.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Obseg in trajanje garancije</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Strukturna celovitost glavne tkanine cevi (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Strukturna celovitost trupa iz steklenih vlaken</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Zmožnost zadrževanja zraka v šivih napihljivih cevi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Delovanje ventilov za napihovanje</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 leto</h3>
        <p class="text-sm text-gray-600 mt-1">Tovarniško vgrajeni dodatki in pomožni okovji</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 leto*</h3>
        <p class="text-sm text-gray-600 mt-1">Komercialna, najemna ali flotna uporaba — vse komponente</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komercialna, vladna, čarterska, najemna ali poučna uporaba skrajša garancijo na 1 leto. Uporaba v dirkah ali tekmovanjih garancijo v celoti prekliče.</p>
  </div>

  <h2>Kaj garancija pokriva</h2>
  <h3>Glavna tkanina cevi (5 let)</h3>
  <p>afarer jamči za glavno tkanino palube proti poslabšanju poroznosti, ki bistveno ogrozi sposobnost izdelka, da ohranja delovni tlak. To velja za tkanino s prevleko iz PVC in vse druge materiale tkanine palube, uporabljene pri izdelavi.</p>

  <h3>Strukturna celovitost trupa iz steklenih vlaken (5 let)</h3>
  <p>Za izdelke s trupom iz plastike, ojačane s steklenimi vlakni (FRP), jamčimo za osnovno kompozitno konstrukcijo proti strukturni odpovedi zaradi napak v materialih ali izdelavi.</p>

  <h3>Zmožnost zadrževanja zraka v šivih napihljivih cevi (5 let)</h3>
  <p>Šivi napihljivih cevi, spojeni med izdelavo, so zajeti z garancijo proti proizvodnim napakam, ki povzročijo obsežno uhajanje zraka skozi šiv. Občasni pregled in vzdrževanje ustreznih tlakov napihovanja sta pogoja pokritja.</p>

  <h3>Delovanje ventilov za napihovanje (5 let)</h3>
  <p>Ventili za napihovanje, ki jih je prvotno vgradil afarer, so zajeti z garancijo proti proizvodnim napakam v materialih ali izdelavi, ki preprečujejo, da bi ventil po zasnovi zadrževal zrak.</p>

  <h3>Tovarniško vgrajeni dodatki (1 leto)</h3>
  <p>Komponente in okovji, ki jih izdeluje afarer in so bili prvotno vgrajeni v tovarni, so zajeti z garancijo proti napakam v materialu in izdelavi za obdobje enega leta. To ne velja za izdelke tretjih oseb, ki so pokriti le z garancijami svojih proizvajalcev.</p>

  <h2>Kaj garancija ne pokriva</h2>
  <ul>
    <li>Kozmetične napake, vključno z razbarvanjem, madeži, bledenjem, raz beljenjem ali katero koli spremembo videza</li>
    <li>Preboji, zareze, strgi, raztrganine ali druga fizična škoda</li>
    <li>Mrežaste razpoke, pokanje, obraba, odrgnine ali poslabšanje zaradi trenja ali stika</li>
    <li>Poslabšanje zaradi izpostavljenosti UV-svetlobi, vremenskim vplivom ali atmosferskim razmeram</li>
    <li>Škoda zaradi stika z gorivi, topili, kislinami, alkalijami ali kemikalijami</li>
    <li>Škoda zaradi malomarnosti, neprimerne uporabe, zlorabe, nesreče ali običajne obrabe</li>
    <li>Težave s površino gelcoata ali barve (mehurjenje, mrežaste razpoke, razbarvanje, bledenje)</li>
    <li>Škoda zaradi udarca, obremenitve, neprimerne podpore ali prevoza s prikolico</li>
    <li>Škoda zaradi nepravilnega napihovanja/izpuščanja ali uporabe neodobrenih naprav za napihovanje</li>
    <li>Oprema, komponente ali sistemi tretjih oseb (pokriti z garancijami svojih proizvajalcev)</li>
  </ul>

  <h2>Obveznost proizvajalca in rešitev</h2>
  <p>Edina in izključna obveznost afarerja je popravilo ali zamenjava — po presoji afarerja — vsake komponente, za katero se ugotovi, da je napakna v materialih ali izdelavi in je pokrita s to garancijo. Popravila ali zamenjave izvaja afarer ali njegova določena pooblaščena servisna ustanova. Za popravljene ali zamenjane komponente velja garancija le za neiztečeni del prvotnega garancijskega obdobja.</p>

  <h2>Pogoji garancije</h2>
  <ul>
    <li><strong>Registracija:</strong> Izdelek mora biti pravilno registriran, kot določajo garancijski pogoji.</li>
    <li><strong>Vzdrževanje:</strong> Izdelek je treba vzdrževati v skladu z objavljenimi smernicami afarer, vključno z občasnimi pregledi in vzdrževanjem ustreznih tlakov napihovanja.</li>
    <li><strong>Sodelovanje:</strong> Kupec mora popolnoma in pravočasno sodelovati z afarerjem pri vseh zadevah v zvezi z garancijskimi zahtevki.</li>
    <li><strong>Prvotni kupec:</strong> Ta garancija je izključno namenjena prvotnemu končnemu uporabniku in ni prenosljiva.</li>
  </ul>

  <h2>Komercialna uporaba</h2>
  <p>Če se izdelek uporablja za komercialne, vladne, neprofitne, čarterske, najemne, poučne namene ali kateri koli namen, ki ni zasebna rekreacija, se garancijsko obdobje za vse komponente skrajša na eno (1) leto od prvotnega datuma maloprodajnega nakupa. Uporaba na dirkah ter hitrostnih ali vzdržljivostnih tekmovanjih garancijo takoj in nepreklicno v celoti prekliče.</p>

  <h2>Kako uveljavite garancijski zahtevek</h2>
  <p>Stopite v stik z afarerjem ali vašim pooblaščenim prodajalcem z dokazilom o nakupu in podrobnim opisom težave. afarer bo pregledal zahtevek in posredoval navodila za pregled ter servisiranje.</p>
  <p>Za povpraševanja o garancijskem servisu nas kontaktirajte prek naše <a href="/contact" class="text-sky-600 underline">kontaktne strani</a> s številko naročila in podrobnostmi o izdelku.</p>

  <h2>Izdelki tretjih oseb</h2>
  <p>Oprema, komponente ali sistemi, ki jih izdelujejo tretje osebe (tudi če jih je vgradil afarer), so izključno pokriti z morebitno garancijo njihovih proizvajalcev. afarer izrecno zavrača vsakršno garancijsko odgovornost za takšne izdelke tretjih oseb.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Ta garancijska izjava je povzetek popolne omejene proizvajalčeve garancije afarer. Popolni pravni garancijski dokument ureja vse garancijske pogoje. Specifikacije se lahko spremenijo brez predhodnega obvestila. afarer je blagovna znamka, ki jo upravlja Aquafarer LLC (ZDA).
  </p>

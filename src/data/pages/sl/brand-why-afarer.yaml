features3_reasons:
  tagline: 'Zakaj izbrati afarer'
  title: 'Sedem razlogov za partnerstvo z nami'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Prava proizvodnja, ne trgovina'
      description: 'Tovarno s površino 12.000 m² smo lastniki in jo upravljamo sami. Ko sklenete partnerstvo z afarerjem, delate neposredno z ljudmi, ki oblikujejo, inženirsko zasnujejo in izdelajo vaše izdelke — brez posrednikov.'
      icon: tabler:building-factory
    - title: '2. Pristop, ki ga vodi inženiring'
      description: 'Naš proces oblikovanja se začne s primerom uporabe, ne s kategorijo izdelka. Obliko trupa, izbiro materialov in konfiguracijo optimiziramo glede na to, kako bo deska dejansko uporabljena.'
      icon: tabler:engine
    - title: '3. Certificirana kakovost'
      description: 'Certifikat CE, sistem kakovosti ISO, skladnost z BSCI, skladnost z REACH, odobritev USCG. Vsak izdelek izpolnjuje mednarodne standarde — ne le obljube.'
      icon: tabler:certificate
    - title: '4. Prilagodljive skupne znamke'
      description: 'Barve robov, razporeditev palube, znamčenje, embalaža — prilagodimo vašim specifikacijam. Brez pritiska najmanjšega naročila. Začnite s prototipom, povečujte s samozavestjo.'
      icon: tabler:adjustments
    - title: '5. Globalna logistika'
      description: 'Skladišče v ZDA v Kaliforniji, neposredna odprema iz Qingdaoa, letalski prevoz za nujna naročila. Carinsko papirstvo in dokumentacijo urejamo mi.'
      icon: tabler:truck-delivery
    - title: '6. Vseživljenjska podpora'
      description: 'Podpiramo deske, ki smo jih izdelali pred 20 leti. Originalni nadomestni deli, tehnični nasveti, navodila za popravila — naša ekipa je na voljo, ko nas potrebujete.'
      icon: tabler:lifebuoy
    - title: '7. Iskrene specifikacije'
      description: 'Prave nosilnosti, prave mere, prava masa. Brez trženjskega napihovanja. Kar objavimo, to prejmete — preverjeno z neodvisnim preskušanjem.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Zaupanje znamk po vsem svetu'
  title: 'Kaj pravijo naši partnerji'
  items:
    - content: 'Sodelovali smo z več proizvajalci na Kitajskem, vendar afarer izstopa po inženirski podpori in dosledni kakovosti. Z našo znamko ravnamo, kot da bi bila njihova.'
      name: '— Partner skupne znamke, evropska znamka vodnih športov'
    - content: 'Njihove deske SUP so v naši floti v uporabi več kot 5 let. Minimalno vzdrževanje, odlična odpornost na UV. Petletna garancija nam daje zaupanje.'
      name: '— Upravljavec flote, bližnjevzhodna skupina letovišč'
    - content: 'Ekipa afarer nam je pomagala razviti oblikovanje deske SUP po meri od koncepta do proizvodnje v 90 dneh. Kakovost je presegla naša pričakovanja.'
      name: '— Distributer, avstralski vodni športi'

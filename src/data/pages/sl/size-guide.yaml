hero:
  title: Vodnik po velikostih in specifikacijah
  subtitle: Dimenzije, nosilnosti in priporočene uporabe za vsak izdelek afarer.
categories:
  inflatable: Napihljive deske SUP, zasnovane za prenosljivost brez žrtvovanja zmogljivosti. Primerjajte pravo velikost z svojo maso in stilom veslanja.
  sup: Deske za stoječe veslanje za turizem, jogo, fitnes in rekreacijsko veslanje. Izberite glede na dolžino in maso voznika.
  accessory: Dodatki in varnostna oprema kot dopolnilo k vaši deski SUP. Univerzalne velikosti z več možnostmi.

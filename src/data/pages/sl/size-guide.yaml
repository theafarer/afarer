how_to_choose:
  title: Kako izbrati pravo velikost
  cards:
    - title: Deske SUP
      description: Izberite dolžino glede na svojo maso in predvideno uporabo. Širše deske (32"+) ponujajo več stabilnosti. Daljše deske (11–12 ft) se bolje držijo smeri za turizem. Težji veslači potrebujejo deske z večjim volumnom.
    - title: Turistične deske SUP
      description: Daljše deske (11–12 ft) so najboljše za premoščanje razdalj in turizem. Širše deske (32"+) ponujajo več stabilnosti. Preverite nosilnost za skupno obremenitev skupaj z opremo.
    - title: Vsestranske deske SUP
      description: Izberite dolžino glede na maso voznika in predvideno uporabo. Vsestranske deske so primerne za rekreacijo, fitnes in jogo. Manjše deske so bolj vodljive.

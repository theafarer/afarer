services:
  - title: 'Oblikovanje in inženirstvo izdelkov'
    description: 'Naša lastna ekipa za raziskave in razvoj dela z vašim konceptom ali specifikacijo ter razvije risbe CAD, 3D-modele in prototipe. Ponujamo oblikovanje kalupov, optimizacijo oblike trupa in svetovanje pri izbiri materialov.'
  - title: 'Znamka in grafika po meri'
    description: 'Celobarvni digitalni tisk, sitotisk, reliefni tisk in možnosti etiket. Razvijamo grafiko palub, znamčenje cevi in maloprodajno embalažo, prilagojeno znamki.'
  - title: 'Prilagoditev materialov in specifikacij'
    description: 'Izbirajte med PVC (standardni, okolju prijazen, težko vnetljiv), drop-stitch in hibridnimi konstrukcijami. Barve cevi po meri, teže tkanin in možnosti ojačitve.'
  - title: 'Embalaža in logistika'
    description: 'Maloprodajna embalaža po meri, škatle zasebnih znamk, vakuumsko pakiranje, paletizacija in nalaganje kontejnerjev. Na voljo pogoji dostave FOB Qingdao, CIF ali DDP.'


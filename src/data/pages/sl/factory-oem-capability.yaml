intro: 'afarer ponuja celovite storitve OEM in ODM za znamke, distributerje in vladne ustanove po vsem svetu. Z več kot 10 leti izkušenj z izvozom in tovarno s 12,000 m² s certifikatoma ISO 9001 in BSCI poskrbimo za vse — od oblikovanja izdelka in razvoja kalupov do obsežne proizvodnje, embalaže in logistike.'


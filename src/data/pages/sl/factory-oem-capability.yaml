why_us:
  - title: 'Vertikalna integracija'
    description: 'Tovarna, kalupi in dobavna veriga so naša — brez posrednikov, brez podizvajalcev. To nam daje nadzor nad kakovostjo, stroški in dostavo.'
  - title: 'Dvojna certificiranost'
    description: 'Upravljanje kakovosti ISO 9001 in certifikat socialne skladnosti BSCI. Poročila o reviziji tovarne so na voljo na zahtevo.'
  - title: 'Skladnost s CE'
    description: 'Vsi standardni modeli nosijo certifikat CE 2013/53/EU. Modeli po meri je mogoče certificirati po CE prek našega uveljavljenega postopka.'
  - title: 'Nizek MOQ'
    description: 'Začnite že z 5 enotami pri standardnih modelih. Pomagamo nastajajočim znamkam pri zagonu brez preveč zaloge.'

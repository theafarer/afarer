faqs:
  title: 'Skupna znamka — pogosta vprašanja'
  subtitle: 'Kako deluje skupna znamka Afarer in kako se razlikuje od OEM in zasebnih znamk.'
  items:
    - title: 'Ali je skupna znamka enako kot OEM ali zasebna znamka?'
      description: 'Ne. Afarer ne izvaja več odprtega programa OEM/zasebnih znamk. Izdelki s skupno znamko ostajajo izdelki Afarer — oblikovani, inženirsko zasnovani, pregledani in podprti z blagovno znamko Afarer. Vaša identiteta se prikaže kot soznamka, ne kot neoznačen izdelek tretje osebe.'
    - title: 'Kdo lahko začne projekt skupne znamke?'
      description: 'Kvalificirana podjetja za vodne športe: obstoječi državni partnerji, veslaški klubi, letovišča in hoteli, organizatorji dogodkov ter skupnosti. Pošljite nam projektno predstavitev in pred začetkom oblikovalskega dela potrdimo primernost.'
    - title: 'Ali bo skupna znamka v sporu z mojim državnim distributerjem?'
      description: 'Ne. Model ena-država-en-distributer ima prednost. Kolekcije s skupno znamko se usklajujejo z lokalnim državnim partnerjem, kjer ta obstaja, tako da na zavarovanem ozemlju ne nastane vzporedna ali konkurenčna znamka.'
    - title: 'Kolikšno je najmanjše naročilo za kolekcijo s skupno znamko?'
      description: 'Pilotne kolekcije se začnejo pri 30–50 enotah. Standardne kolekcije obsegajo 50–100 enot; velike ali večregionalne izdaje 100+ enot. Časovnice razvoja po meri se dogovorijo po projektu.'
    - title: 'Kaj predstavlja kakovost Afarer in kaj prispevek partnerja?'
      description: 'Afarer je lastnik oblikovanja izdelka, inženiringa, materialov, konstrukcije, kontrole kakovosti in garancije. Partnerji prispevajo koncept kolekcije, poimenovanje, barve, grafične predloge in trg dostop. Tako na vodi ostaja en sam kakovostni standard.'
    - title: 'Kako se prijavim?'
      description: 'Izpolnite povpraševalni obrazec za skupno znamko s podatki o svojem podjetju, trgu in ideji za kolekcijo. Pregledamo ustreznost in v 3 delovnih dneh odgovorimo s predlogom ter pogodbo o projektu skupne znamke.'

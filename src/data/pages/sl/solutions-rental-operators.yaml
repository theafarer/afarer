meta:
  title: 'Dobavitelj opreme za najem SUP in rešitve za flote | {SITE}'
  description: 'Dobavitelj opreme za najem SUP za operaterje najema. Komercialne deske SUP za visoko obratno, zasnovane za vsakodnevno uporabo — UV-odporen PVC, ojačeni šivi, hitro sušeči materiali. Povečajte svoje najemno podjetje z Afarer.'

hero:
  tagline: 'Operaterji najema'
  title: 'Povečajte svoje najemno podjetje<br />z zaupanjem'
  subtitle: 'Dobavitelj opreme za najem SUP za operaterje najema. Deske SUP za visoko obratno, zasnovane za vsakodnevni najem, 365 dni na leto. Vaši prihodki si nikoli ne vzamejo prostega dneva.'
  image:

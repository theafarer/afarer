    - title: '500+ najemnih ciklov'
      description: 'Preskušeno za vsakodnevno uporabo v slani vodi, soncu in pesku.'
      icon: 'tabler:shield-check'
    - title: 'UV-odporna tkanina'
      description: 'Brez bledenja ali razgradnje po 1 letu shranjevanja na prostem.'
      icon: 'tabler:sun'
    - title: 'Ojačeni šivi'
      description: '3x močnejši od standardne konstrukcije napihljivih desk.'
      icon: 'tabler:layers-intersect'
    - title: 'Hitro sušeči materiali'
      description: 'Deske so pripravljene za naslednji najem v manj kot 30 minutah.'
      icon: 'tabler:droplet'
    - title: 'Skladiščenje v skladih'
      description: 'Prostorsko varčna zasnova — na istem prostoru shranite 40 % več desk.'
      icon: 'tabler:stack'
    - title: 'Barvno kodirane velikosti'
      description: 'Osebje z barvno kodiranimi velikostmi takoj zgrabi pravo desko.'
      icon: 'tabler:color-swatch'


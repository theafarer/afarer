meta:
  title: SUP-utstyr og flåteløsninger for padleklubber | {SITE}
  description: Komplette SUP-flåteprogrammer for padleklubber og skoler. Startpakker, profesjonelle flåter, konkurransebrett, sett til treningssentre og reservedelsstøtte.
hero:
  tagline: Padleklubber og Skoler
  title: Start, driv og utvikle padleklubben din<br />med SUP-flåter i kommersiell kvalitet
  subtitle: SUP-utstyrsleverandør for padleklubber og SUP-skoler over hele verden — holdbare kommersielle brett, klubbpriser ved volumkjøp, skreddersydd merkevareprofil og raske reservedeler, slik at du kan fokusere på å få fellesskapet ditt til å vokse.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Padleklubbmedlemmer på matchende Afarer SUP-brett
benefits:
  title: Flåtefordeler for klubber
  subtitle: Hvorfor padleklubber i over 50 land velger Afarer som sin utstyrsleverandør.
  items:
    - metric: 40%+
      label: Flåtebesparelser
      detail: Vs. utsalgspriser med bulkklubb-rabatter
    - metric: 48h
      label: Reservedeler
      detail: Minimal nedetid for din utleieflåte
    - metric: 500+
      label: Utleiesykler
      detail: Kommersiell holdbarhet per brett
    - metric: 5+ år
      label: Flåtens levetid
      detail: Med riktig vedlikehold og pleie
packages:
  title: Klubbflåteprogrammer
  subtitle: Velg flåteprogrammet som passer klubbens størrelse og ambisjon.
  items:
    - name: Startpakke
      tagline: For nye klubber, opptil 30 medlemmer
      features:
        - 10 SUP-brett (miks av all-round + touring)
        - 10 padleårer + 10 redningsvester
        - 2 dobbeltvirkende pumper + reperasjonssett
        - Klubbbranding på brettene (logotrykk)
        - Lanseringsguide + sikkerhetssjekkliste
        - CE-sertifisert — alt utstyr
      cta_text: Start din klubb
    - name: Profesjonell Flåte
      tagline: For etablerte klubber, 50-100 medlemmer
      features:
        - 30 SUP-brett (3 størrelsesvalg)
        - 30 padleårer + 30 redningsvester
        - 5 pumper + 2 reperasjonssett + oppbevaringsstativ
        - Klubbens egne farger + logo på brettene
        - Program for reservedeler (15% rabatt)
        - Personopplæringssesjon (online)
        - CE-sertifisert — alt utstyr
      popular: true
      cta_text: Bygg flåten din
    - name: Konkurranseflåte
      tagline: For racerklubber, events, konkurranser
      features:
        - 50+ race-/ytelsesbrett
        - Komplett tilbehørssett (padleårer, vester, pumper)
        - Eventstøttesett (startbøyer, markeringer)
        - Prioriterte deler (24t utsending)
        - Dedikert kontaktperson
        - Tilpassede teamuniformer som valg
        - CE-sertifisert — alt utstyr
      cta_text: Få konkurranseflåte
training:
  title: Treningsenterpakker
  subtitle: Alt en SUP-skole trenger for å drive profesjonelle sertifiseringskurs.
  items:
    - name: Startpakke for instruktører
      features:
        - 5 premium SUP-brett (instruktørkvalitet)
        - 5 karbonårer for demonstrasjoner
        - 5 redningsvester (instruktørstørrelse)
        - Opplæringssiddeplanveiledning
        - CE-sertifisert utstyr
    - name: Komplett sett for skoler
      features:
        - 20 SUP-brett (blanding av studenter og instruktører)
        - 20 padler + 20 redningsvester (ulike størrelser)
        - 10 flytehjelpemidler for nybegynnere
        - 4 pumper + reparasjonssett
        - Opplæringsplan og sertifiseringsstøtte
        - CE-sertifisert utstyr
features:
  title: Hvorfor klubber velger Afarer
  subtitle: Konsekvent kvalitet, raske deler og bulkpriser bygget for voksende klubber.
  items:
    - title: 500+ utleiesykluser
      description: Kommersielle brett overlever sesonger med daglig bruk.
      icon: tabler:shield-check
    - title: Egendefinerte farger
      description: Tilpass din klubbidentitet med tilpassede brett og logo.
      icon: tabler:palette
    - title: Partipriser
      description: Rabatt ved volumordre på 10+ brett.
      icon: tabler:discount
    - title: Rask deltelevering
      description: Reservedeler sendt innen 48 timer.
      icon: tabler:truck-delivery
    - title: Støtte for klubbvekst
      description: Råd om medlemskapsprogrammer, prismodeller og arrangementavholdelse.
      icon: tabler:trending-up
    - title: CE-sertifisert
      description: Alt utstyr oppfyller internasjonale sikkerhetsstandarder.
      icon: tabler:certificate
cta:
  title: Klar til å bygge padleklubben din?
  subtitle: Få tilbud for din klubbflåte eller last ned vår klubbstartguide.
  actions:
    - text: Søk om klubbflåte
      href: /contact?package=club
      variant: primary
    - text: Last ned klubbguide
      href: /resources/download-catalog
      variant: secondary

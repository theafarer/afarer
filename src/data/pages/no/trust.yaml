faqs_sup:
  title: SUP-brett FAQ
  subtitle: Vanlige spørsmål om våre paddleboard.
  columns: 2
  items:
    - title: Hvilke SUP-brettstørrelser er tilgjengelige?
      description: Vi tilbyr SUP-brett fra 9 ft til 12 ft, inkludert all-round, touring, yoga og spesialdesign. Våre bestselgende modeller inkluderer Tropical Breeze (10 ft) og Ocean Voyager (11 ft).
    - title: Hva er drop-stitch-konstruksjon?
      description: Drop-stitch-konstruksjon bruker tusenvis av polyestertråder som forbinder topp- og bunnlaget på brettet, slik at det kan holde høyt lufttrykk (15–20 PSI) og oppnå en stiv, stabil plattform. Dette er industristandarden for premium oppblåsbare SUP-er.
    - title: Hva er vektgrensen for SUP-brett?
      description: SUP-brettene våre støtter opptil 150 kg avhengig av modell og volum. Leviathan Wake er modellen vår med høyest kapasitet, designet for større brukere og yogabruk.
    - title: Tilbyr du komplette SUP-pakker?
      description: Ja. Hvert SUP-brett leveres med en komplett pakke som inkluderer 3-delt aluminiumspadle, høytrykks håndpumpe, spiralfeste, reiseryggsekk og reparasjonssett. Noen modeller inkluderer også et avtakbart finnesett.
    - title: Hva er garantien på SUP-brett?
      description: Alle afarer SUP-brett har ett års garanti mot produksjonsfeil, inkludert sømfeil, ventilfeil og materialdelaminering under normal bruk.
    - title: Hvor lang tid tar det å pumpe opp et SUP-brett?
      description: Ved bruk av den medfølgende håndpumpen tar full oppumping til 15 PSI omtrent 8–12 minutter. For raskere oppumping anbefaler vi afarer 12V elektrisk pumpe, som pumper opp et brett på under 4 minutter.
faqs_materials:
  title: SUP-material- og pleie-FAQ
  subtitle: Vanlige spørsmål om våre oppblåsbare SUP-materialer, vedlikehold og lagring.
  columns: 2
  items:
    - title: Hvilke materialer brukes i afarer oppblåsbare SUP-er?
      description: Vi bruker militærgrad PVC (1100 denier) med UV-stabilisert, slitebestandig konstruksjon, i samsvar med EU REACH- og RoHS-forskrifter.
    - title: Hvor lenge varer oppblåsbare SUP-er?
      description: Med riktig pleie varer en kvalitets-PVC oppblåsbar SUP i 5–10 år. Regelmessig rengjøring, UV-beskyttelse og riktig lagring forlenger levetiden vesentlig.
    - title: Hvilket vedlikehold kreves for et oppblåsbart SUP-brett?
      description: Grunnleggende vedlikehold inkluderer skylling med ferskvann etter hvert bruk (spesielt i saltvann), tørking før lagring, årlig sjekk av ventilforseglinger, og unngå langvarig soleksponering når brettet ikke er i bruk.
    - title: Kan oppblåsbare SUP-brett brukes i saltvann?
      description: Ja. Alle afarer oppblåsbare SUP-er er designet for bruk i både ferskvann og saltvann. Vi anbefaler å skylle med ferskvann og tørke grundig etter eksponering for saltvann.
    - title: Hvordan oppbevarer jeg en oppblåsbar SUP?
      description: Tøm, rengjør og tørk brettet helt før lagring. Rull løst (unngå tette folder), lagr på et kjølig, tørt sted vekk fra direkte sollys, og hold unna betonggulv for å unngå fuktsuging.
    - title: Hvor mye vekt tåler afarer oppblåsbare SUP-er?
      description: Vektkapasiteter varierer fra 100 kg for våre minste modeller til over 200 kg for større brett. Hver produktside viser maksimal lasteevne for din spesifikke modell.

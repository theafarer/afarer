features3_certifications:
  title: Sertifiseringer og overholdelse
  subtitle: Hvert produkt er uavhengig testet og sertifisert etter internasjonale standarder.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE-sertifisering
      description: Alle afarer SUP-er oppfyller den europeiske CE-sikkerhetsstandarden for rekreasjonsfartøy. Hvert produkt gjennomgår trykk-, oppdrifts- og lastetesting før det forlater fabrikken.
      icon: tabler:certificate
    - title: ISO 9001
      description: Vårt 12.000 m² Qingdao-anlegg opererer under et kvalitetsstyringssystem i samsvar med ISO 9001. Hver produksjonsbatch er sporbar, dokumentert og inspisert.
      icon: tabler:clipboard-check
    - title: BSCI sosial overholdelse
      description: Vi er BSCI-sertifisert, noe som sikrer etisk arbeidspraksis, trygge arbeidsforhold og miljøansvar på tvers av forsyningskjeden vår.
      icon: tabler:users
    - title: REACH og RoHS
      description: Alle materialer — PVC, Hypalon, EVA-skum, lim — overholder EUs REACH- og RoHS-forskrifter. Ingen forbudte stoffer, ingen kompromisser.
      icon: tabler:flask
    - title: Materialtestlaboratorium
      description: Internt materialelaboratorium tester strekkfasthet, UV-bestandighet, sømintegritet og slitestyrke for hvert stoffparti før produksjon.
      icon: tabler:microscope
    - title: 2 års garanti
      description: Hvert afarer-produkt leveres med to års garanti mot produksjonsfeil. Vi står for det vi bygger.
      icon: tabler:shield-check
testimonials:
  tagline: Kundetillit
  title: Hva våre kunder sier
  subtitle: Fra førstegangspadlere til profesjonelle flåteoperatører — se hvorfor de stoler på afarer.
  items:
    - content: Vi utstyrte hele utleieflåten vår med afarer SUP-er. To sesonger inn, null feil. CE-sertifiseringen gjorde forsikringsgodkjenningen sømløs.
      name: Marco V.
      title: Turarrangør, Kroatia
    - content: Som førstegangskjøper var jeg nervøs for kvaliteten. ISO-dokumentasjonen og testrapportene de delte ga meg full tillit.
      name: James T.
      title: SUP Explorer 11-eier, Canada
    - content: Vi samarbeider med afarer for kystpatruljeenhetene våre. QC-prosessen deres er konsistent på tvers av hver batch — den påliteligheten betyr noe i oppdragskritiske operasjoner.
      name: Lt. Cmdr. Andres
      title: Marineinnkjøp, Filippinene
steps2_manufacturing:
  title: Slik sikrer vi kvalitet
  subtitle: Fra råvareinspeksjon til endelig trykktesting — hvert produkt gjennomgår en streng kvalitetskjede.
  items:
    - title: Råvareinspeksjon
      description: Hver rull PVC-stoff testes for tykkelse, strekkfasthet og UV-bestandighet før den går inn i produksjon.
      icon: tabler:search
    - title: Løpende QC
      description: Sveisesømmer, ventilinstallasjoner og kammertilkoblinger inspiseres ved hver stasjon under montering.
      icon: tabler:eye
    - title: Trykktesting
      description: Hvert oppblåsbart produkt pumpes opp til 1,25x nominelt PSI og holdes i 24–48 timer for å verifisere luftretensjon og sømintegritet.
      icon: tabler:wind
    - title: Sluttinspeksjon
      description: Hver enhet inspiseres for finish, maskinvare og emballasje før den godkjennes for forsendelse. Batchprøver sendes til laboratoriet vårt for destruktiv testing.
      icon: tabler:clipboard-check

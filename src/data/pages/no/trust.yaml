faqs_sup:
  title: SUP-brett FAQ
  subtitle: Vanlige spørsmål om våre paddleboard.
  columns: 2
  items:
    - title: Hvilke SUP-brettstørrelser er tilgjengelige?
      description: Vi tilbyr SUP-brett fra 9 ft til 12 ft, inkludert all-round, touring, yoga og spesialdesign. Våre bestselgende modeller inkluderer Tropical Breeze (10 ft) og Ocean Voyager (11 ft).
    - title: Hva er drop-stitch-konstruksjon?
      description: Drop-stitch-konstruksjon bruker tusenvis av polyestertråder som forbinder topp- og bunnlaget på brettet, slik at det kan holde høyt lufttrykk (15–20 PSI) og oppnå en stiv, stabil plattform. Dette er industristandarden for premium oppblåsbare SUP-er.
    - title: Hva er vektgrensen for SUP-brett?
      description: SUP-brettene våre støtter opptil 150 kg avhengig av modell og volum. Leviathan Wake er modellen vår med høyest kapasitet, designet for større brukere og yogabruk.
    - title: Tilbyr du komplette SUP-pakker?
      description: Ja. Hvert SUP-brett leveres med en komplett pakke som inkluderer 3-delt aluminiumspadle, høytrykks håndpumpe, spiralfeste, reiseryggsekk og reparasjonssett. Noen modeller inkluderer også et avtakbart finnesett.
    - title: Hva er garantien på SUP-brett?
      description: Alle afarer SUP-brett har ett års garanti mot produksjonsfeil, inkludert sømfeil, ventilfeil og materialdelaminering under normal bruk.
    - title: Hvor lang tid tar det å pumpe opp et SUP-brett?
      description: Ved bruk av den medfølgende håndpumpen tar full oppumping til 15 PSI omtrent 8–12 minutter. For raskere oppumping anbefaler vi afarer 12V elektrisk pumpe, som pumper opp et brett på under 4 minutter.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

warranty_section:
  title: Garanti og ettersalgssupport
  subtitle: Vi står bak hvert produkt med klare garantivilkår, rask reklamasjonsbehandling og ekte reservedeler.
  items:
    - title: 2 års produktgaranti
      desc: Alle afarer-produkter har 2 års garanti mot produksjonsfeil — sømfeil, ventilfeil og materialdelaminering under normal bruk.
    - title: Levetidsstøtte for deler
      desc: Originale reservedeler — ventiler, reparasjonssett, finner, D-ringer — tilgjengelige for alle modeller. Vi vedlikeholder formsprøyter og verktøy i minimum 5 år etter produksjonsslutt.
    - title: 48 timers reklamasjonssvar
      desc: Garantikrav bekreftes innen 48 timer. Erstatningsbrett sendes innen 10 virkedager for godkjente krav.
    - title: Globalt reparasjonsnettverk
      desc: Autoriserte reparasjonssentre i 15+ land. Feltrerreparasjonssett tilgjengelig for fjerntliggende operasjoner. Selvhjelpsguider for mindre skader.
    - title: OEM kundesupport
      desc: Dedikerte kontoansvarlige for B2B-partnere. Kvartalsvise forretningsgjennomganger, lagerplanlegging og co-brandet markedsføringsstøtte.
    - title: Sertifiseringspakke
      desc: Fullstendig samsvarsdokumentasjon levert med hver forsendelse — CE-erklæring, testrapporter, sikkerhetsdatablader for materialer.
      link: /contact

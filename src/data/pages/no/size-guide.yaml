how_to_choose:
  title: Slik velger du riktig størrelse
  cards:
    - title: SUP-brett
      description: Velg lengde basert på vekt og bruksområde. Bredere brett (32"+) gir mer stabilitet. Lengre brett (11-12 fot) holder kursen bedre under tur. Tyngre padlere trenger brett med større volum.
    - title: Touring SUP-brett
      description: Lengre brett (11–12 fot) er best for å dekke avstand og touring. Bredere brett (32"+) gir mer stabilitet. Sjekk vektkapasiteten for total last inkludert utstyr.

    - title: All-round SUP-brett
      description: Velg lengde etter brukervekt og bruksområde. All-round-brett egner seg til fritid, trening og yoga. Mindre brett er mer manøvrerbare.

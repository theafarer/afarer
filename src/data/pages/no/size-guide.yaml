categories:
  inflatable: Oppblåsbare SUP-brett designet for bærbarhet uten å gå på kompromiss med ytelsen. Velg riktig størrelse etter vekt og padlingsstil.
  sup: Stående padlebrett for touring, yoga, trening og fritidspadling. Velg etter lengde og brukervekt.

intro: >-
  Det er en vanlig misoppfatning at hydrodynamisk testing er forbeholdt havgående skip. I virkeligheten er ytelsen til et lite planleggende skrog – som en 4–6 m oppblåsbar båt – like avhengig av undervannsformen som en tankskip er av dets bulbous bow. Trimvinkel, våt overflate, sprutdannelse og ventilasjon har
  alle dramatisk effekt på hastighet, drivstofforbruk og kjørekomfort. Hos Afarer opererer vi en dedikert hydrodynamisk testtank som lar oss kvantifisere disse effektene i modellskala – før vi forplikter metall og stoff til en fullskalaprototype.
content_html: >-
  <h2>Hvorfor utføre tanktest av en liten båt?</h2>

  <p>Testing på modellskala (typisk 1:3 til 1:5) gir oss muligheten til å iterere skrogformer raskt og kostnadseffektivt. En uke i tanken kan generere de samme prestasjonsdataene som ellers ville kreve måneder med fullskala prøving og feiling — og til en brøkdel av kostnaden.</p>


  <h2>Anleggsspesifikasjoner</h2>

  <table>
    <thead><tr><th>Parameter</th><th>Spesifikasjon</th></tr></thead>
    <tbody>
      <tr><td>Tankdimensjoner</td><td>35 m (L) × 3,5 m (B) × 1,8 m (D)</td></tr>
      <tr><td>Trekkevogn</td><td>Elektrisk servodrevet, maks hastighet 12 m/s (23 kn), hastighetsnøyaktighet ± 0,5 %</td></tr>
      <tr><td>Bølgegenerator</td><td>Flap-type, programmerbare regelmässige og uregelmässige sjøtilstander, Hs opptil 0,3 m på modellskala</td></tr>
      <tr><td>Instrumentering</td><td>6-komponents dynamometer (motstand, sidekraft, yaw-moment), akselerometere, inklinometere, bølgesonder</td></tr>
      <tr><td>Datainnsamling</td><td>Prøvetaking ved 1000 Hz per kanal, sanntidsvisning + etterbehandlingspakke</td></tr>
      <tr><td>Modellfabrikasjon</td><td>Husprodusert CNC-fresing og 3D-utskrift av modellskrog opptil 1,8 m LOA</td></tr>
    </tbody>
  </table>


  <h2>Vårt testprogram</h2>

  <p>Et standard skrogutviklingsprogram i vår tank følger denne rekkefølgen:</p>

  <ol>
    <li><strong>Modellbygg</strong> — En 1:3,5-skalamodell CNC-freses fra høydensitetskum og forsterkes med glassfiber for stivhet. Vekt og tyngdepunkt justeres for å matche Froude-skalert full-lasts tilstand.</li>
    <li><strong>Motstandsmålinger</strong> — Modellen slepes ved 8–10 hastigheter som dekker driftsområdet. Total motstand måles og deles inn i friksjons- og restkomponenter ved hjelp av ITTC-1957-metoden.</li>
    <li><strong>Trim- og synkemåling</strong> — Løpende trim og synking registreres ved hver hastighet. Et optimalt trimvinkel på 4–6° for planende skrog er målet.</li>
    <li><strong>Bølgeundersøkelse</strong> — Tverrgående bølgesnitt måles ved to hastigheter for å vurdere bølgedanningsmotstand og identifisere tverrgående bølgeinteraksjoner som kan forårsake hekkforstyrrelser.</li>
    <li><strong>Sjøegenskaper (valgfritt)</strong> — Mot- og medsjøløp i regelmässige bølger for å måle tilleggsmodstand, vertikal akselerasjon og sannsynlighet for planingssjokk.</li>
    <li><strong>Dataanalyse og anbefalinger</strong> — En fullstendig rapport leveres med sammenligningsdiagrammer, hastighets/kraft-kurver og spesifikke designtips for det fullskala skroget.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Typiske tanktestresultater — Motstand vs. hastighet (patruljebåtskrog, 1:3,5-skala)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Modellskalert motstand (N) ved Froude-skalerte hastigheter. Fullskalert effektforutsigelse følger ITTC-1978-prestasjonsforutsigelsesmetoden.</p>
  </div>


  <h2>Ekspertteam</h2>

  <p>Vår tank betjenes av en hydrodynamiker med doktorgrad i marinarkitektur og 8 års erfaring fra trekkbasseng ved et større europeisk maritimt forskningsinstitutt. Han støttes av en tekniker som forbereder alle modeller og instrumentering. Teamet følger ITTC (International Towing Tank Conference)
  anbefalte prosedyrer for å sikre at hvert test er reproduserbart, sporbart og internasjonalt forsvartbart.</p>


  <h2>Tanktesting for skreddersydd skrogutvikling</h2>

  <p>Vår tank brukes ikke bare til husdesignede skrog — vi kjører regelmessig testprogrammer for kunder som ønsker å validere en tilpasset skrogform eller undersøke et prestasjonsproblem:</p>

  <ul>
    <li><strong>Skrogform-sammenligning</strong> — To eller flere kandidatskrog testet under identiske forhold, og gir en objektiv sammenligning av motstand/hastighet/stabilitet for å informere ditt designvalg.</li>
    <li><strong>Optimalisering av tilbehør</strong> — Interceptorplater, sprøytebeskyttelse, trimflaps og strøk kan testes i ulike konfigurasjoner for å kvantifisere deres individuelle bidrag til motstandsreduksjon.</li>
    <li><strong>Motor-tilpasningsstudie</strong> — Motstandsdata konverteres til en effektforutsigelseskurve, slik at du kan velge optimal motorhestekrefter for din målhastighet og nyttelast.</li>
  </ul>


  <h2>Hvorfor teste hos oss?</h2>

  <p>Vi gir deg ikke bare et sett med rå tall. Våre rapporter oversetter tankdata til handlingsrettede ingeniøranbefalinger: «Hev sprøytebeskyttelsen med 8 mm for å redusere våt overflate ved marsjfart», «Øk dødvinkel ved hekken med 3° for å redusere planingsakselerasjon», eller «Flytt det
  longitudinale tyngdepunktet 150 mm akterut for forbedret planingsholdning». Du går med en klar forståelse av hva som bør endres og hvorfor.</p>

  <p>Vår tank er også tilgjengelig for uavhengig tredjepartstesting på betalingsbasis. Hvis du utvikler et skrog og ønsker en upartisk, profesjonelt gjennomført hydrodynamisk vurdering, er du velkommen til å kontakte oss.</p>

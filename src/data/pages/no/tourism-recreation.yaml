headline: Ingeniørmessig perfeksjon i produksjon av oppustelige SUPs for turisme og fritid
subtitle: Fra guidede fisketurer til kystfarter — afarer setter standarden for holdbarhet, sikkerhet og ytelse innen oppustelige SUPs.

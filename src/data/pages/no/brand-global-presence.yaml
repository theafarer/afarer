meta:
  title: 'Global Tilstedeværelse — SUP-produsent som betjener 50+ land | {SITE}'
  description: 'afar eksporterer oppblåsbare SUPer og båter til over 50 land på alle kontinenter. Profesjonell produsent og leverandør for merker, distributører og flåter.'
  keywords:
    - 'global SUP-produsent'
    - 'paddle board eksportør'
    - 'SUP-fabrikk Kina'
    - 'profesjonell SUP-leverandør'
hero:
  tagline: Global tilstedeværelse
  title: Betjener 50+ land<br />over alle kontinenter
  subtitle: Fra europeiske kystpatruljeoperatører til australske vannsportsdistributører til redningsteam i Midtøsten —afarer-båter er på vannet over hele verden.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer global maritim produksjon og distribusjon
stats:
  title: Global rekkevidde
  stats:
    - title: Land
      amount: 50+
    - title: Eksportmarkeder
      amount: Europa, Amerika, Asia, Midtøsten, Oseania
    - title: Produksjon
      amount: Qingdao, Kina
    - title: USA-lager
      amount: Montclair, CA
features3_markets:
  tagline: Nøkkelmarkeder
  title: Regional ekspertise<br />for lokale krav
  subtitle: Vi forstår at ulike markeder har ulike regulatoriske krav, preferanser og bruksområder.
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa og Storbritannia
      description: CE-sertifiserte produkter som oppfyller EN ISO 6185-standarder. Sterk etterspørsel etter SUP-er, oppblåsbare båter og SUP-brett på EU-markeder. Britiske distributører setter pris på vår raske behandling.
      icon: tabler:map-pin
    - title: Nord-Amerika
      description: US Coast Guard godkjent produksjon. US-lager i Montclair, CA for rask levering til vestkysten. Økende etterspørsel etter fiske- og redningsbåter og rekreasjons-SUP-er.
      icon: tabler:map-pin
    - title: Australia og Oseania
      description: Sterkt marked for SUP-båter og oppblåsbare tendere. Australske distributører verdsetter Hypalon-båtene våre for UV-bestandighet under harde solforhold. Rask frakt fra vårt asiatiske anlegg.
      icon: tabler:map-pin
    - title: Midtøsten
      description: Økende etterspørsel etter patrulje- og redningsbåter. SUP-ene våre med aluminiumsskrog er populære hos kystvakt- og sikkerhetsoperatører. Tilpassede konfigurasjoner for høytemperaturmiljøer.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribusjonsnettverk
  title: Samarbeider med distributører<br />over hele verden
  subtitle: Vi samarbeider med etablerte marine utstyrsdistributører, vannsportsmerkevarer og offentlige innkjøpsetater.
  isBeforeContent: false
  columns: 3
  items:
    - title: Co-brand-programmer
      description: Private label-produksjon for globale vannsportsmerkevarer. Vi håndterer alt fra design til produksjon til drop-shipping.
      icon: tabler:building
    - title: Distributørnettverk
      description: Autoriserte distributører i 20+ land har lager og gir lokal støtte. Nye distributørforespørsler velkomne.
      icon: tabler:users
    - title: Statlig og institusjonell
      description: Direkte forsyning til kystvakter, søk- og redningsorganisasjoner og militære innkjøpsprogrammer. Samsvar med institusjonelle innkjøpskrav.
      icon: tabler:building-community
steps2_logistics:
  title: Global logistikk & støtte
  subtitle: Fra fabrikk til destinasjon —vi håndterer hele forsyningskjeden.
  items:
    - title: Fraktalternativer
      description: Sjøfrakt (FOB Qingdao), luftfrakt for hasteordre og ekspressbud for prøver og reservedeler.
      icon: tabler:truck-delivery
    - title: USA-lager
      description: 'Lager i Montclair, CA for rask levering over hele Nord-Amerika. Vestkysten: 2-3 dager, Sentralt: 3-4 dager, Østkysten: 4-5 dager.'
      icon: tabler:building-warehouse
    - title: Reservedeler
      description: Ekte afarer-reservedeler og forbruksvarer på lager året rundt. Vanlige deler sendes innen 24 timer.
      icon: tabler:package
    - title: Teknisk support
      description: Direktlinje til ingeniørteamet vårt for tekniske spørsmål, reparasjonsråd og ombyggingsstøtte. Vi støtter båter vi bygget for 20 år siden.
      icon: tabler:headset
cta:
  title: Vil du bli distributør?
  subtitle: Vi utvider aktivt distribusjonsnettverket vårt. Kontakt eksportteamet vårt for å diskutere partnerskapsmuligheter.
  actions:
    - variant: primary
      text: Partnerspørsel
      href: /contact
    - text: Se vårt produktsortiment
      href: /products

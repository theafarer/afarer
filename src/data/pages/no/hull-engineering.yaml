intro: >-
  Skroget er ryggraden til enhver RIB eller oppblåsbar båt. Det må være lett nok til å planere effektivt, sterkt nok til å absorbere støtlaster og dimensjonsstabile over et bredt temperaturområde. Hos {SITE.name} kombinerer vårt skrogengineeringstudio avansert CAD-modellering, endelig elementanalyse
  (FEA) og tiår med praktisk skipsarkitekturerfaring for å levere skrog som er optimalisert for sitt tiltenkte formål — ikke generiske former tilpasset fra en katalog.
content_html: >
  <h2>Der styrke møter hydrodynamikk</h2>

  <p>Vi arbeider med tre primære skrogmaterialer — rotasjonsstøpt HDPE, sveist marinegrad aluminium og håndlagt glassfiber — og har ingeniørkapasiteten til å designe, simulere og validere hver enkelt internt.</p>


  <h2>Designverktøy og standarder</h2>

  <p>Vårt digitale ingeniørmiljø inkluderer:</p>

  <table>
    <thead><tr><th>Funksjon</th><th>Programvare / Verktøy</th><th>Applikasjon</th></tr></thead>
    <tbody>
      <tr><td>3D parametrisk modellering</td><td>SolidWorks Professional</td><td>Skrogoverflate, stringersystem, motorbrakett, dekklayout</td></tr>
      <tr><td>Endelige elementanalyse</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Spenningskartlegging, modalanalyse, kollisjons-/påvirkningssimulering</td></tr>
      <tr><td>Beregningsmessig fluodynamikk</td><td>Ansys Fluent / Star-CCM+</td><td>Hydrodynamisk dragforutsigelse, trimoptimalisering</td></tr>
      <tr><td>Laminat ingeniør</td><td>ESAComp / CADEC</td><td>Glassfiberlagsstabling, kjernevalg, vekt-estimering</td></tr>
      <tr><td>Formflyt simulering</td><td>Moldex3D</td><td>Rotasjonsstøping veggtykkelsesforutsigelse</td></tr>
    </tbody>
  </table>


  <h2>Vår ingeniørarbeidsflyt</h2>

  <p>Hvert skrogdesign, enten det er en standardmodell eller et fullstendig skreddersydd prosjekt, følger en rigorøs femtrinnsprosess:</p>

  <ol>
    <li><strong>Konsept og kravinnsamling</strong> — Vi møter deg for å definere nyttelast, hastighetsområde, sjøtilstandskapasitet, slepekrav og eventuelt spesielt oppdragsutrustning (dekselluker, konsollplasseringer, drivstofftankintegrasjon).</li>
    <li><strong>3D-overflate og hydrostatisk beregning</strong> — Skrogformen modelleres i SolidWorks og kontrolleres for hydrostatisk stabilitet (GM, rettende arm) ved hjelp av innebygde analyseverktøy.</li>
    <li><strong>Strukturell FEA</strong> — Lasttilfeller defineres: statisk (mannskap + utstyr), dynamisk (planleggingpåvirkninger ved 5g) og slamming (fall fra bølgetopp ved 3 m/s). Spenningskonturer gjennomgås; sikkerhetsfaktor — minimum 2,5 er obligatorisk.</li>
    <li><strong>CFD-dragoptimalisering</strong> — Skroget simuleres ved tre lasttilstander og fem hastigheter. Våt overflateareal, trimvinkel og restmotstand reduseres iterativt.</li>
    <li><strong>Designgjennomgang og utgivelse</strong> — Den komplette ingeniørpakken (3D-modell, FEA-rapport, CFD-rapport, vekt-estimering, plakkbok) gjennomgås av vår senior navalarkitekt før utgivelse til prototypverkstedet.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA-spenningsfordeling — RIB 450 Patrol-skrog (Aluminium 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2,8 : 1</span>
        <span class="text-gray-500">Sikkerhetsfaktor ved maks nyttelast</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15,2 %</span>
        <span class="text-gray-500">Dragreduksjon vs forrige generasjon</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Topp slammingstrykk (designgrense)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 t</span>
        <span class="text-gray-500">Kumulativ FEA-kjøretid i 2025</span>
      </div>
    </div>
  </div>


  <h2>Skreddersying: ditt skrog, dine regler</h2>

  <p>Ingen to operatører har identiske krav. En havnepatrulje-RIB trenger et V-skrog for stabilitet ved lav hastighet; et hurtigintersepsjonsfartøy trenger et dypt V med sprutskinner; et dykkerbåtfartøy trenger bredt skrog og lav akterspeil. Vi tvinger ikke applikasjonen din inn i en forutbestemt
  skrogform. Vi designer fra din spesifikasjon og oppover.</p>

  <p>Eksempler på nylige skreddersydde skrogprosjekter:</p>

  <ul>
    <li>Et forlenget 6,8 m HDPE-skrog for en karibisk turoperatør, med forsterket baug for strandlandinger (+15 % bunn tykkelse).</li>
    <li>Et lett aluminiums 7,2 m RIB for et kystvakt, med integrerte drivstofftank-skillevegger og utstyrsromforsterkere.</li>
    <li>Et glassfiber 5,5 m dykkerbåt med senket akterspeil og to batteribokser, designet for enkel gjeninntrenging av snorklere.</li>
  </ul>


  <h2>Våre ingeniører</h2>

  <p>Studiet ledes av en senior navalarkitekt med 14 års erfaring innen hurtigbåtdesign, støttet av to maskiningeniører spesialisert innen FEA og CFD. Alle tre har avanserte grader i marinteknikk eller navalarkitektur fra internasjonalt anerkjente universiteter. Teamet publiserer jevnlig i
  bransjetidsskrifter og presenterer på konferanser som International Conference on High-Performance Marine Vehicles.</p>


  <h2>Partnere med oss på ditt neste skrog</h2>

  <p>Fra det første konseptskissen til den endelige spenningsrapporten, er vårt Skrogengineering-studio din partner i å skape en båt som ikke bare er bygget — men ingeniørmessig designet. Vi investerer simuleringstimene på forhånd slik at hvert sveise, hvert laminatlag og hver kurve på skroget er
  der av en grunn.</p>

  <p>Enten du trenger en mindre modifisering av en eksisterende modell eller et fullstendig nytt design, er vi klare til å diskutere dine behov.</p>

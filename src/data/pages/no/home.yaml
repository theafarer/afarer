oem_section:
  tagline: 'OEM / ODM- og co-brand-produksjon'
  title: Fra idé til vann — co-branded utgaver
  subtitle: 'For partnere som vil ha mer enn et katalogprodukt: OEM/ODM-produksjon og begrensede co-branded kolleksjoner designet, konstruert og bygget sammen med afarer — mens hvert brett forblir et afarer-produkt.'
  steps:
    - number: '01'
      title: Idé og brief
      desc: Del din visjon, målgruppe og spesifikasjoner.
    - number: '02'
      title: Design og ingeniørfag
      desc: 3D-modellering, materialvalg og tilpasset grafisk design.
    - number: '03'
      title: Prototyp og valider
      desc: Prøveproduksjon med CE-sertifisering og kvalitetstesting.
    - number: '04'
      title: Storskalaproduksjon
      desc: Fullskala produksjon med inline kvalitetskontroll og fabrikkauditstøtte.
    - number: '05'
      title: Global levering
      desc: FOB Qingdao logistikk, CIF hovedhavner, dør-til-dør.
  cta: Utforsk co-branding
  cta_link: /co-brand

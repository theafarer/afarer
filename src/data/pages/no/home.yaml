distributor:
  tagline: 'Landseksklusive distributører'
  title: 'Ett land. Én offisiell afarer-distributør.'
  subtitle: 'Et program med én distributør per land, med territoriell eksklusivitet, forhandlerpriser, markedsføringsstøtte og et dedikert Distributor Success Program.'
  benefits:
    - title: 'Territoriell eksklusivitet'
      description: 'Én autorisert distributør per land eller region — ingen intern konkurranse, ingen kanalkonflikter.'
    - title: 'Direkte fabrikkmarginer'
      description: 'Distributørprislister og årlige rabatter på avtalte volumer, sendt FOB Qingdao.'
    - title: 'Markedsførings- og opplæringsstøtte'
      description: 'Co-brandede eiendeler, POS-materiell for forhandlere, produktopplæring og lanseringskampanjer.'
    - title: 'Dedikert konto-team'
      description: 'En personlig distributørleder pluss onboarding-, prognose- og bestillingsstøtte.'
  actions:
    - variant: primary
      text: 'Bli distributør'
      href: /distributor-program
    - text: 'Be om forhandlerprisliste'
      href: /contact?subject=Dealer Price List
    - text: 'Søk om landspartnerskap'
      href: /contact?subject=Country Partnership Application
    - text: 'Last ned distributørprogrammet'
      href: /distributor-program
  note: 'Eksempelbestillinger fra 5–10 enheter. Prøvebestillinger 10–30. Autorisert forhandler 30–50. Lands-/regional distributør 100–300+.'

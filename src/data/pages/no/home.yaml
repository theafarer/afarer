who_we_serve:
  tagline: Hvem vi betjener
  title: Komplette SUP-løsninger for alle vannvirksomheter
  subtitle: Spesialbygget utstyr, produksjon og forretningsstøtte for fire nøkkelmarkeder.
  items:
    - title: Padleklubber
      keywords: SUP-klubbutstyr, padleskoleutstyr, utleieflåte
      description: Holdbare SUP-flåter, klubbpriser og reservedelsprogrammer for padleklubber og skoler.
      icon: tabler:users
      cta: Utforsk padleklubbløsninger
      link: /solutions/paddle-clubs
    - title: Resorter og hoteller
      keywords: Ferieested-vannaktiviteter, hotellstrendutstyr, gjesteopplevelse
      description: Komplette SUP-flåteprogrammer med tilpasset merkevare, ansattopplæring og ROI-optimerte pakker.
      icon: tabler:building
      cta: Skap ditt resort vannopplevelse
      link: /solutions/resorts-hotels
    - title: Detaljhandelspartnere
      keywords: SUP-engros, sportsbutikker, sportsforretninger
      description: Fullstendig produktlinje, markedsføringsmateriell, dropshipping-alternativer og konkurransedyktige grossistmarginer.
      icon: tabler:shopping-cart
      cta: Bli en forhandlerpartner
      link: /solutions/retail-partners
    - title: Nye SUP-merker
      keywords: privat merkevare SUP, tilpasset SUP-merke, OEM padlebrett
      description: Helt-eide OEM/ODM-produksjon — design, prototyping, storskalaproduksjon og global logistikk.
      icon: tabler:package
      cta: Bygg ditt SUP-merke
      link: /oem-odm-manufacturer
proof_points:
  title: Betraktet av vannvirksomheter over hele verden
  subtitle: Tiår med marinteknisk erfaring som driver lønnsomme SUP-programmer.
  items:
    - metric: 10+
      label: Års erfaring
      detail: Siden 2012
    - metric: 50+
      label: Land vi betjener
      detail: Globalt distribusjonsnettverk
    - metric: 15 000+
      label: Enheter produsert årlig
      detail: CE-sertifisert produksjonskapasitet
    - metric: 100%
      label: CE-sertifisert
      detail: Samsvar med ISO 9001, BSCI, REACH
business_solutions:
  tagline: Hvordan vi hjelper
  title: Din partner fra konsept til inntekt
  subtitle: Fire kjernekompetanser som hjelper vannvirksomheter med å starte, drive og vokse.
  items:
    - title: Profesjonelt utstyr
      description: Kommersielle SUP-brett konstruert for daglig utleie, 500+ sykluser med minimalt vedlikehold.
      icon: tabler:shield-check
    - title: OEM-produksjon
      description: Helhetlig private label-produksjon fra design og prototyping til storskalaproduksjon og global levering.
      icon: tabler:package
    - title: Bedriftsstøtte
      description: Personelltrening, markedsføringsmateriell, reservedelsprogrammer og dedikert kontoadministrasjon.
      icon: tabler:headset
    - title: Global logistikk
      description: FOB Qingdao, CIF hovedhavner, dør-til-dør-levering til 50+ land med tollstøtte.
      icon: tabler:truck-delivery
oem_section:
  tagline: Lanser ditt merke
  title: Fra idé til marked på 16 uker
  subtitle: Din komplette partner for lansering av SUP-merke — design, prototype, produksjon og forsendelse.
  steps:
    - number: '01'
      title: Idé og brief
      desc: Del din visjon, målgruppe og spesifikasjoner.
    - number: '02'
      title: Design og ingeniørfag
      desc: 3D-modellering, materialvalg og tilpasset grafisk design.
    - number: '03'
      title: Prototyp og valider
      desc: Prøveproduksjon med CE-sertifisering og kvalitetstesting.
    - number: '04'
      title: Storskalaproduksjon
      desc: Fullskala produksjon med inline kvalitetskontroll og fabrikkauditstøtte.
    - number: '05'
      title: Global levering
      desc: FOB Qingdao logistikk, CIF hovedhavner, dør-til-dør.
  cta: Start din merkevare-reise
  cta_link: /oem-odm-manufacturer
cta:
  title: |
    Klar til å konfigurere <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">din neste båt</span>?
  subtitle: Fortell oss hvordan du skal bruke båten, så foreslår vi modell, alternativer og pris innen én virkedag.
  actions:
    - variant: primary
      text: Be om pristilbud
      href: /contact
      icon: tabler:message-circle
    - text: Bla i katalogen
      href: /products

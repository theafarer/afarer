hero:
  tagline: Partners & Distribution
  title: 'Bli en afarer-partner<br />—Globalt distribusjonsnettverk'
  subtitle: "Join afarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries."
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: Partner Programs
  title: 'Partnerprogram<br />bygget for vekst'
  subtitle: 'Enten du er distributør, forhandler eller merkevarepartner, tilbyr afarer programmer designet for å støtte din virksomhet.'
  columns: 3
  items:
    - title: 'Distributor Program'
      description: 'Eksklusiv territoriedistribusjon med volumsprising, markedsføringsstøtte og direkte fabrikktilgang. Minimumsforpliktelse basert på territoriestørrelse.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Direkte forhandlerpriser, produktopplæring, markedsføringsmateriale og garantistøtte for butikklokaler og nettbutikker.'
      icon: tabler:building-store
    - title: 'OEM/ODM Partnership'
      description: 'Fullservice OEM- og ODM-produksjon med tilpasset merkevarebygging, emballasje og produktspesifikasjoner. Fra konsept til container.'
      icon: tabler:certificate
    - title: 'Brand Partnership'
      description: 'Sammerkevarebygging, private label og eksklusive modellprogrammer for etablerte merkevarer innen marin- og friluftsrekreasjon.'
      icon: tabler:stars
    - title: 'Government & Institutional'
      description: 'Foretrukne leverandørprogrammer for offentlige etater, kystvakter, militære og humanitære organisasjoner. Anbudsklar dokumentasjon.'
      icon: tabler:building-community
    - title: 'Resort & Rental Partner'
      description: 'Flåteprising, konsistent kvalitet og tilpasset merkevarebygging for resorter, dykkesentre og utleievirksomheter over hele verden.'
      icon: tabler:sun
content_benefits:
  tagline: Why Partner With Us
  title: 'Hvorfor partnere velger afarer'
  subtitle: 'Partnerne våre drar nytte av reell produksjonskapasitet, konsistent kvalitet og responsiv støtte.'
  list:
    - 'Direct Factory Access: Work directly with our manufacturing team —no middlemen. Get faster responses, better pricing, and full visibility into production.'
    - 'Customization Ready: Brand your products with custom colors, logos, packaging, and specifications. Minimum order quantities tailored to your market.'
    - 'Quality Guaranteed: ISO 9001 certified production with CE, UKCA, and BSCI compliance. Every product tested before shipping.'
    - 'Global Logistics: Shipping from Qingdao, China with FOB, CIF, and DDP options. US warehouse in Montclair, CA for North American distribution.'
    - 'Marketing Support: Product catalogs, photography, technical documentation, and digital assets to support your sales efforts.'
    - 'Training & Support: Product training for your sales team, technical support for your customers, and warranty service coordination.'
content_process:
  tagline: How to Become a Partner
  title: 'Enkel partnerskapsprosess'
  subtitle: 'Partnerskapsprosessen vår er grei —designet for å få deg til å selge afarer-produkter raskt.'
  items:
    - title: 'Step 1: Submit Application'
      description: 'Fyll ut partnersøknadsskjemaet vårt med din firmaprofil, målmarked og produktinteresser.'
    - title: 'Step 2: Qualification Review'
      description: 'Partnerskapsteamet vårt gjennomgår søknaden din og kontakter deg innen 3 virkedager for å diskutere muligheter.'
    - title: 'Step 3: Agreement & Setup'
      description: 'Signer en partnerskapsavtale, sett opp kontoen din og motta partnerpriser, markedsføringsmateriale og produktprøver.'
    - title: 'Step 4: Training & Launch'
      description: 'Produktopplæring, salgsstøtte og markedsføringsmateriell leveres. Du er klar til å begynne å selge.'
cta:
  title: 'Klar til å bli en afarer-partner?'
  subtitle: 'Søk om partnerskap og teamet vårt vil svare innen 3 virkedager.'
  actions:
    - variant: primary
      text: Apply for partnership
      href: /contact
    - text: View our products
      href: /products

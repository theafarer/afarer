meta:
  title: 'Be om tilbud — OEM-SUP-produksjon | {SITE}'
  description: 'Be om et detaljert tilbud for ditt oppblåsbare SUP- eller båtprosjekt. OEM/ODM-produksjon, private label eller tilpassede flåter — vi svarer innen 2 virkedager.'
  keywords:
    - 'be om SUP-tilbud'
    - 'OEM paddle board tilbud'
    - 'SUP-fabrikk tilbud'
    - 'pris oppblåsbar SUP'
hero_text:
  tagline: Få et tilbud
  title: Be om et tilbud<br />for ditt prosjekt
  subtitle: Fortell oss om dine krav, så svarer teamet vårt med et detaljert tilbud innen 2 virkedager.
steps2_process:
  title: Slik fungerer det
  subtitle: Fire enkle steg fra forespørsel til tilbud.
  items:
    - title: 'Steg 1: Send inn dine krav'
      description: Fyll ut skjemaet nedenfor med produkttype, mengde og spesifikasjoner. Jo mer detalj du oppgir, desto mer nøyaktig blir tilbudet ditt.
      icon: tabler:file-text
    - title: 'Trinn 2: Vi vurderer og gir råd'
      description: Vårt ingeniørteam gjennomgår dine krav og kan kontakte deg for avklaring. Vi gir anbefalinger om produktkonfigurasjon og alternativer.
      icon: tabler:users
    - title: 'Trinn 3: Motta ditt tilbud'
      description: Du mottar et detaljert tilbud inkludert enhetspris, MOQ, ledetid, betalingsbetingelser og fraktalternativer. Vanligvis innen 48 timer.
      icon: tabler:currency-dollar
    - title: 'Trinn 4: Prøve og produksjon'
      description: Etter tilbudsgodkjennelse går vi videre til prøveproduksjon (hvis aktuelt) eller direkte til masseproduksjon. Regelmessige oppdateringer gjennom hele prosessen.
      icon: tabler:building-factory
content_form:
  tagline: Tilbudsforespørsel
  title: Fortell oss om prosjektet ditt
  subtitle: Alle felt med * er påkrevd.
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Dykkesenter
        - Fiske
        - Marin turisme / resort
        - Søk og redning
        - Yacht-tender
        - Kommersiell arbeidsbåt
        - Statlig / militært
        - OEM / eget merke
        - Personlig / Fritid
        - Annet
    - name: Target Market
      type: text
      placeholder: f.eks. Europa, Nord-Amerika, Midtøsten
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: f.eks. levering innen 90 dager
    - name: Additional Requirements
      type: textarea
      options:
        - Ingen preferanse
        - Marin-grade PVC (1100 dtex)
        - Premium Hypalon / CSM
        - Glassfiberskrog
        - Aluminiumsskrog
    - name: Engine Requirement
      type: text
      placeholder: f.eks. 60 HK utenbordsmotor, ingen motor, to 115 HK
    - name: Customization Required
      type: text
      placeholder: f.eks. tilpassede farger, merkevare/logo, emballasje, spesielle tilbehør
    - name: Timeline
      type: text
      placeholder: f.eks. levering innen 90 dager
    - name: Additional Requirements
      type: textarea
      placeholder: Beskriv din applikasjon, tekniske spesifikasjoner eller eventuelle spesielle krav — inkluder referansetegninger, spesifikasjoner eller lenker hvis tilgjengelig
    - name: Upload Specification
      type: file
      placeholder: Last opp spesifikasjonsarket, tegningen eller referansedokumentet ditt (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Last opp logoen eller grafikken din for tilpasset merking (AI, EPS, PNG)
cta:
  title: Foretrekker du å diskutere via e-post?
  subtitle: Send din henvendelse direkte til vårt salgsteam, så svarer vi innen 24 timer.
  actions:
    - variant: primary
      text: Send oss en e-post direkte
      href: /contact

hero:
  tagline: 'Kasusstudier'
  title: 'Virkelige prosjekter, virkelige resultater<br />—afarer i aksjon'
  subtitle: 'Se hvordan afarer samarbeider med distributører, merkevarer og operatører over hele verden for å levere skreddersydde marine løsninger for hver applikasjon.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'afarer kasusstudier —skreddersydde marine produksjonsprosjekter'
features3_cases:
  tagline: 'Utvalgte kasus'
  title: 'Skreddersydde løsninger<br />for virkelige utfordringer'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Europeisk dykkersenterflåte'
      description: 'Leverte 12 SUP 520 dykkonfigurerte båter til en middelhavsbasert dykkersenterkjede. Tilpassede tankstativ, dykkerstiger og flåtebranding. Levert på 60 dager.'
      icon: tabler:lifebuoy
    - title: 'Australsk distributør-OEM-program'
      description: 'Utviklet et privat merkevare SUP-brettsortiment for en australsk vannsportdistributør. 8 modeller, tilpasset emballasje og drop-ship-logistikk. Fra konsept til første forsendelse på 90 dager.'
      icon: tabler:currency-dollar
    - title: 'Redningsbåtleveranse Midtøsten'
      description: 'Leverte 20 SUP 450 Patrol-båter til en sivilforsvarsorganisasjon i Midtøsten. Selvlensende dekk, fullt navigasjonsutstyr og høysynlige oransje slanger. Overholdelse av lokale regulatoriske standarder.'
      icon: tabler:alert-triangle
    - title: 'Europeisk OEM-merkevarepartnerskap'
      description: 'White-label-produksjonspartnerskap med et europeisk maritimt merke. 5 SUP-modeller, privat merkevarebygging, eksklusive distribusjonsrettigheter for EU-markedet. Flerårig avtale.'
      icon: tabler:building
    - title: 'Karibisk resortflåte'
      description: 'Komplett vannsportsutstyrspakke for et karibisk feriested: 40 SUP-brett, 20 kajakker, 10 oppblåsbare båter og tilbehør. Tilpasset resortbranding på alt utstyr.'
      icon: tabler:beach
    - title: 'US-kystpatruljekontrakt'
      description: 'Leverte SUP 600 patruljebåter til et amerikansk kystsikkerhetsbyrå. Tomotorkonfigurasjon, pansrede konsollalternativer og militær elektronikkintegrering.'
      icon: tabler:shield
cta:

meta:
  title: Hvordan velge SUP-tykkelse — ingeniøranalyse | {SITE}
  description: 'Teknisk guide til tykkelse på oppblåsbare SUP-brett: hvordan 4", 5" og 6" brett skiller seg i stivhet, vekt, stabilitet, sporing og yteevne. Tykkelsesanbefalinger for touring, yoga, surfing, racing og allround padling.'
back_text: Tilbake til forskning
hero:
  tagline: Ingeniørvirksomhet
  title: Hvordan velge SUP-tykkelse — ingeniøranalyse
  subtitle: 6 minutters lesetid
content_html: >
  <h2>De tre standardtykkelsene</h2>


  <h3>4" (10 cm) – Touring og ytelse</h3>

  <ul>
    <li>Høyeste stivhet – mindre fleksjon under belastning</li>
    <li>Lettest – mindre materiale, mindre luftvolum</li>
    <li>Utmerket sporbarhet – redusert side-til-side-svingning</li>
    <li>Raskest – redusert drag, enklere glide</li>
    <li>Best for: Touring, racing, fitness-padling, erfarne padlere</li>
  </ul>


  <h3>5" (12,7 cm) – Allround</h3>

  <ul>
    <li>God stivhet – balansert fleks-forhold til stivhet</li>
    <li>Moderat vekt – standard materialbruk</li>
    <li>God primær- + sekundærstabilitet</li>
    <li>Best for: Fritidspadling, nybegynnere, uformell bruk på innsjø og elv</li>
  </ul>


  <h3>6" (15,2 cm) – Stabilitet og yoga</h3>

  <ul>
    <li>Høyeste primærstabilitet – enorm oppdrift</li>
    <li>Tungest – mer PVC-materiale, større luftvolum</li>
    <li>Langsomst – mer drag, vanskeligere å opprettholde glid</li>
    <li>Best for: Yoga/fitness, tunge padlere (100+ kg), svært urolige forhold</li>
  </ul>


  <h2>Teknisk analyse</h2>

  <p>Stivheten til en oppblåsbar SUP styres av internt lufttrykk og tverrsnittets treghetsmoment. Ved 20 PSI viser et 4"-brett omtrent 30 % mindre nedbøyning under belastning enn et 6"-brett med samme bredde og lengde. Primærstabilitet kommer fra vannlinjebredde og oppdrift; sekundærstabilitet
  påvirkes av railform og brettbredde.</p>


  <h2>Tykkelse etter padlevekt</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Padlevekt</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Anbefalt tykkelse</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Under 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65–90 kg (143–198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90–115 kg (198–253 lbs)</td><td class="p-3 border">5" eller 6"</td></tr>
      <tr><td class="p-3 border">Over 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>Tykkelse vs. PSI-avveining</h2>

  <p>En vanlig misoppfatning er at høyere PSI kan kompensere for overdreven tykkelse. Ved 25 PSI viser et 6"-brett mer fleksjon enn et 4"-brett ved 15 PSI fordi geometrisk treghetsmoment dominerer stivhetslikningen. For ytelsesorienterte padlere overgår et tynnere brett ved lavere trykk et tykkere
  brett ved høyere trykk.</p>


  <h2>Afarer-sortiment</h2>

  <ul>
    <li><strong>4"-brett:</strong> Cheetah Touring-serien – 12' x 30" x 4" touring-SUP-er for fitness og distansepadling</li>
    <li><strong>5"-brett:</strong> Cheetah All-Round-serien – 10'6" x 32" x 5" for fritidsbruk</li>
    <li><strong>6"-brett:</strong> Cheetah Ultra-Stable-serien – 10' x 34" x 6" for yoga, tunge padlere og fotograferingsplattformer</li>
  </ul>

  <p>Alle brett benytter 1 680 DTEX drop-stitch-kjerner med 20 PSI nominelt trykk og 1,2 mm PVC-laminater.</p>

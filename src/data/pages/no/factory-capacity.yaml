workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50—0 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: SUP Boat Production
    description: 'Dedikert glassfiber skrogverksted med 6 formstasjoner for SUP-skrog opp til 7,6 m. Rørsveise- og monteringsområde håndterer 3— SUP-er samtidig. Årlig SUP-kapasitet: 2.000+ båter.'
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & SUP
    description: 'Multiproduksjonslinjer for oppblåsbare båter, kajakker og joller. Varmluftssveisestasjoner, RF-dielektriske presser og monteringsarbeidsstasjoner omkonfigureres basert på ordremiks. Årlig kapasitet: 5.000+ enheter.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'Eget renromsproduksjonsområde for redningsvester og sikkerhetsutstyr. Dedikerte sy-, skuminnsettings- og teststasjoner. Årlig redningsvestkapasitet: 50.000+ enheter.'
    output: '50,000+ life vests/year'


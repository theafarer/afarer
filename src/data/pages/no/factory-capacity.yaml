workshops:
  - title: SUP-brettproduksjon
    description: '4 parallele monteringslinjer for oppblåsbare SUP-brett. Hver linje kan produsere 50–80 brett per skift. Digitaltrykk og silketrykkstasjoner kjøres samtidig. Årlig SUP-kapasitet: 8 000+ brett.'
    output: 8 000+ SUP i året
  - title: SUP Boat Production
    description: 'Dedikert glassfiber skrogverksted med 6 formstasjoner for SUP-skrog opp til 7,6 m. Rørsveise- og monteringsområde håndterer 3–6 SUP-er samtidig. Årlig SUP-kapasitet: 2.000+ båter.'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'Multiproduksjonslinjer for oppblåsbare båter, kajakker og joller. Varmluftssveisestasjoner, RF-dielektriske presser og monteringsarbeidsstasjoner omkonfigureres basert på ordremiks. Årlig kapasitet: 5.000+ enheter.'
    output: 5 000+ enheter/år
  - title: Sikkerhetsutstyr
    description: 'Eget renromsproduksjonsområde for redningsvester og sikkerhetsutstyr. Dedikerte sy-, skuminnsettings- og teststasjoner. Årlig redningsvestkapasitet: 50.000+ enheter.'
    output: 50 000+ redningsvester/år
oem_capacity:
  moq: 'SUP: 5–10 enheter | SUP: 2–5 enheter | Kajakk/Jolle: 10–50 enheter | Tilpasset form: 200+ enheter'
  lead_time: Standard 30–45 dager. Prøve 15–20 dager. Hasteordre tilgjengelig.
  payment: T/T 30% depositum + 70% før forsendelse. L/C, Western Union aksepteres.

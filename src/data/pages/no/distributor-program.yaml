faqs:
  title: 'Landpartnerskap — FAQ'
  subtitle: 'Spørsmålene seriøse landpartnere stiller før de søker.'
  items:
    - title: 'Hva betyr egentlig ett land, én distributør?'
      description: 'Afarer utnevner én autorisert distributør med eksklusive rettigheter for et definert territorium. Vi selger ikke fra våre globale eller regionale kanaler inn i et beskyttet land. Ditt territorieierskap gjelder så lenge Distribution Agreement oppfylles.'
    - title: 'Er territoriet eksklusivt for alltid?'
      description: 'Nei. Eksklusivitet er betinget, ikke evigvarende. Den opprettholdes gjennom en signert Distribution Agreement, gjennomføring av din første ordre, årlige innkjøpsmål, lokalt lager, ettersalgskapasitet og fortsatt markedsinvestering. Hvis disse ikke oppfylles, kan territoriet reforhandles eller tildeles på nytt.'
    - title: 'Hva er minimum første ordre?'
      description: 'Lands- og regionaldistributører starter på 100–300 enheter; autoriserte forhandlere på 30–50 enheter; testordrer fra 10–30 enheter lar deg validere markedet først (test- og prøveordrer gir ingen territoriebeskyttelse). Custom- og private-label-programmer følger egne MOQ-er oppført i nivåene ovenfor.'
    - title: 'Hva omfatter det 10-moduls støtteprogrammet?'
      description: 'Nivåer og kvalifisering, territoriebeskyttelse, MOQ / priser / årlige rabatter, lagerstyring og ordreekspedisjon, markedsføringsmateriell og felles markedsfond, produkt-/salg-/teknisk opplæring, reservedeler og ettersalg, garantiregistrering, partnerportalen, samt produktdatablader, bibliotek for markedsføringsmateriell, årlig rabattskjema og frakt- og pakklister.'
    - title: 'Hvordan beskytter Afarer meg mot kanalkonflikter?'
      description: 'Hvert territorium har nøyaktig én autorisert distributør. Forespørsler og direkte ordrer fra din region rutes gjennom deg, nettsideskjemaer videresendes til den lokale partneren der en finnes, og det globale teamet eskalerer kun når en partner ikke svarer.'
    - title: 'Hvilke frakt- og betalingsvilkår gjelder?'
      description: 'Ordrer sendes FOB Qingdao med full eksportdokumentasjon. Produksjonsordrer med 30% depositum og 70% før forsendelse; test- og prøveordrer betales på forhånd. Standard leveringstid er 30–45 arbeidsdager, med 15–20 arbeidsdager for prøveproduksjon.'
    - title: 'Hvordan søker jeg?'
      description: 'Send søknaden din via kontaktskjemaet med markedsinformasjon. Vi vurderer markedstilpasning, detaljhandelsnærvær og logistikkapasitet, og svarer deretter innen 3 virkedager med neste steg og et utkast til Distribution Agreement.'

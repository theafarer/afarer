features:
  title: 'Hvorfor Samarbeide med Afarer'
  subtitle: 'Bygget for kanalpartnere som vil bygge en vannsportsvirksomhet med et seriøst merke i ryggen.'
  columns: 3
  items:
    - title: 'Territoriell Eksklusivitet'
      description: 'Et beskyttet marked i et land eller en region. Én distributør, ingen intern konkurranse, ingen kanalkonflikter — investeringen din bygger din egen vollgrav.'
      icon: 'tabler:shield-check'
    - title: 'Direkte Fabrikkmarginer'
      description: 'Distributørprisliste med rabatter på avtalte volumer. Ingen mellomledd. FOB Qingdao-frakt med full eksportdokumentasjon.'
      icon: 'tabler:coins'
    - title: 'Distributor Success Program'
      description: 'Strukturert onboarding, go-to-market-planlegging, produkt- og salgstrening, demo-flåtestøtte og co-marketingverktøy.'
      icon: 'tabler:rocket'
    - title: 'Markeds- & Merkestøtte'
      description: 'Lokaliserte kampanjemateriell, POS-materiell, eventkits og flerspråklig digitalt innhold.'
      icon: 'tabler:mood-smile'
    - title: 'Pålitelig Supply Chain'
      description: 'ISO- og CE-sertifisert produksjon med konsistent kvalitetskontroll, forutsigbare MOQs og leveringstider du kan planlegge rundt.'
      icon: 'tabler:building-factory'
    - title: 'Dedikert Kontaktperson'
      description: 'En personlig distribusjonssjef for prognoser, ordreplanlegging og ettermarkedsstøtte.'
      icon: 'tabler:user-check'
table:
  title: 'Programnivåer & Ordrevilkår'
  subtitle: 'Velg nivået som matcher markedspotensialet ditt. Alle priser i USD, FOB Qingdao.'
  caption: 'Prøveordrer (5–10 enheter) gir ingen territoriell beskyttelse. Vilkårene avtales i distributøravtalen din før eventuell forsendelse.'
  head:
    - Programnivå
    - Minimumsordre (enheter)
    - Leveringstid
    - Betaling
  rows:
    - [Prøve / Produktevaluering, 5–10, 15–20 arbeidsdager, 100% forskuddsbetalt]
    - [Testordre, 10–30, 30–45 dager, 100% forskuddsbetalt]
    - [Autorisert Forhandler, 30–50, 30–45 dager, 30% depositum / 70% før forsendelse]
    - [Lands- / Regionaldistributør, 100–300, 30–45 dager, 30% depositum / 70% før forsendelse]
    - [Custom & Private Label (standard), 50+, 30–45 dager, 30% depositum / 70% før forsendelse]
    - [Dyp tilpasning (nye former, emballasje), 200+, 45–60 dager, 30% depositum / 70% før forsendelse]
    - [Rettigheter til hele produktlinjen, 300–1, 000, 60–90 dager, 30% depositum / 70% før forsendelse]
faqs:
  title: 'Distributørprogram — FAQ'
  subtitle: 'Alt distributører spør om før de søker.'
  items:
    - title: 'Hva betyr ett land, én distributør?'
      description: 'Afarer gir én autorisert distributør eksklusive rettigheter for et land eller en region. Du eier markedet ditt — ingen parallellimport, ingen intern konkurranse.'
    - title: 'Hva er minimum første ordre?'
      description: 'Lands- og regionaldistributører starter på 100–300 enheter. Autoriserte forhandlere fra 30–50 enheter. Testordrer fra 10–30 enheter lar deg validere markedet først (uten territoriell beskyttelse).'
    - title: 'Hvilken støtte får distributører?'
      description: 'Distributor Success Program omfatter onboarding, go-to-market-planlegging, produkt- og salgstrening, demo-flåtestøtte, lokaliserte markedsføringsressurser og en dedikert kontaktperson.'
    - title: 'Hvordan beskytter Afarer meg mot kanalkonflikter?'
      description: 'Hvert territorium har nøyaktig én autorisert distributør. Direkte ordrer fra din region går gjennom deg, og prisene er satt for å beskytte marginen din.'
    - title: 'Hvilke er frakt- og betalingsvilkårene?'
      description: 'Ordrer sendes FOB Qingdao med full eksportdokumentasjon. Produksjonsordrer med 30% depositum og 70% før forsendelse; test- og prøveordrer betales på forhånd.'
    - title: 'Hvordan søker jeg?'
      description: 'Send en søknad via kontaktskjemaet. Vi vurderer markedsmatch, detaljhandelsnærvær og logistikkapasitet, og svarer innen 3 virkedager med neste steg og et eksempel på distributøravtale.'
cta:
  title: 'Klar til å eie markedet ditt?'
  subtitle: 'Søk på Afarer-distributørprogrammet og få svar innen 3 virkedager.'
  actions:
    - text: 'Søk om distribusjon'
      href: /contact?subject=Distributor Application
      variant: primary
    - text: 'Last ned distributørprogrammet'
      href: /distributor-program
      variant: secondary

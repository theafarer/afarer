meta:
  title: 'Om afarer — Inflatable SUP- & vannsportsmerke | {SITE}'
  description: 'afarer er et globalt inflatable SUP- og vannsportsmerke, drevet av Aquafarer LLC (USA) og bygget av vårt Qingdao-operasjonsteam. Oppdag vår historie, ingeniørkunst, sertifiserte kvalitet og landspartnerprogrammer.'
  keywords:
    - 'inflatable sup merke'
    - 'vannsportsmerke'
    - 'sup-distributør per land'
    - 'co-branded sup kolleksjoner'
hero:
  tagline: Om selskapet
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer-verksted
  title: |
    Marine engineering <br />
    i <span class="text-accent dark:text-white">afarer</span>-stil
  subtitle: 'Vi startet i et kystverksted med ett brett og en urokkelig overbevisning: marine produkter bør ingeniørfremstilles som om de betyr noe — for det gjør de. I dag leverer vi til over 40 land, men hvert skrog går fortsatt gjennom de samme hendene som startet selskapet.'
stats:
  title: I tall
  columns: 4
  stats:
    - title: Leverte skrog
      amount: 2 400+
    - title: Leveringsland
      amount: '40'
    - title: Samlet erfaring (år)
      amount: '60'
    - title: Gjennomsnittlig responstid (t)
      amount: '24'
features3_what_we_build:
  title: Hva vi bygger
  subtitle: En fokusert produktlinje vi kan ut og inn — ingen halvhjertede løsninger eller badge engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: SUP-brett
      description: Oppblåsbare SUP-brett fra 9 til 12 fot. Designet for touring, yoga, fiske og familiebruk.
      icon: tabler:ship
    - title: Oppblåsbare SUP-er
      description: PVC-oppblåsbare SUP-brett fra 9 til 12 fot. Lette, slitesterke og enkle å oppbevare.
      icon: tabler:rowing
    - title: Premium SUP-pakker
      description: Kompakte SUP-er med høye spesifikasjoner, skreddersydd etter dine merkevare- eller flåtekrav.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Tilbehør
      description: Padleårer, pumper, trekk, vanntette vesker og elektronikk. Alt tilpasset våre brett.
      icon: tabler:package
    - title: Reparasjon og service
      description: Brettreparasjon internt, utskifting av dekkplater og tilbehørsoppgraderinger.
      icon: tabler:tool
    - title: Produkter på bestilling
      description: Design for kommersielle, vitenskapelige og militære kunder.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Brettdesign og ingeniørdiskusjon
steps2_values:
  title: Våre verdier
  subtitle: Tre prinsipper som former hvert produkt fra dag én.
  items:
    - title: Bygg som om det bærer familien din
      description: Hvert skrog, hver sveis og hver komponent behandles som om de skulle brukes av våre egne familier.
      icon: tabler:heart
    - title: Ingeniørkunst før salg
      description: Hvis spesifikasjonen er feil, endrer vi spesifikasjonen — aldri kunden.
      icon: tabler:settings
    - title: Støtte utover garantien
      description: Tjue år gamle skrog ringer fortsatt etter deler — og vi svarer fortsatt.
      icon: tabler:headset
steps2_milestones:
  title: Milepæler
  subtitle: Kortversjonen av afarers historie.
  isReversed: true
  items:
    - title: Grunnlagt i et kystverksted
      description: To marineingeniører med én CNC-fres og en urokkelig idé.
      icon: tabler:building-factory
    - title: Første 1 000 leverte skrog
      description: Oppnådd i det syvende året, hovedsakelig gjennom jungeltelegrafen og faste kunder.
      icon: tabler:circle-check
    - title: Internasjonalt eksportprogram
      description: Leveranser til 40+ land med lokale servicepartnere på fem kontinenter.
      icon: tabler:world
features2_locations:
  title: Våre lokasjoner
  tagline: Hvor du finner oss
  columns: 3
  items:
    - title: Hovedkontor og verksted
      description: Kystnært industripark, bygning 4 — åpent man-fre for besøk etter avtale.
    - title: EU-servicesenter
      description: Middelhavshavn — modifikasjoner, reparasjoner og garantistøtte for europeiske kunder.
    - title: APAC-partnernettverk
      description: Autoriserte servicepartnere i Australia, Japan, Singapore og Hongkong.
brand_hub_tagline: Merkevare
brand_hub_title: Utforsk merkevaren vår
brand_hub_subtitle: Dykk dypere ned i vår ingeniørkompetanse innen SUP, vår globale tilstedeværelse og prinsippene som driver oss.
brand_hub_cards:
  - title: Marin ekspertise
    desc: Tiår med materialvitenskap, presisjonsproduksjon og testing i praksis — fra PVC-fremstilling til dyp-V-skrogdesign og drop-stitch-teknologi.
    link: /brand-marine-expertise/
    link_label: Les mer →
  - title: Global tilstedeværelse
    desc: Frakt til 50+ land fra vårt anlegg i Qingdao med autoriserte servicepartnere i Europa, Asia-Stillehavet og Amerika.
    link: /brand-global-presence/
    link_label: Les mer →
  - title: Hvorfor afarer
    desc: Et merke bygget på verifisert kvalitet — dobbel sertifisering (ISO 9001 + BSCI), CE-samsvar og eksklusive landspartnerskap med begrensede co-branded kolleksjoner for vannsportbedrifter.
    link: /brand-why-afarer/
    link_label: Les mer →

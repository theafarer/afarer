meta:
  title: 'Sertifiseringer — CE, ISO 9001 & samsvar | {SITE}'
  description: 'afars kvalitetssertifiseringer: CE (direktiv 2013/53/EU), ISO 9001:2015, BSCI. Samsvar og sikkerhet for en produsent av oppblåsbare SUPer og båter.'
  keywords:
    - 'CE-sertifisering paddle board'
    - 'ISO 9001 paddle board'
    - 'nautisk samsvar'
    - 'paddle board sertifisering'
hero:
  tagline: Sertifiseringer og standarder
  title: Kvalitetssertifiseringer<br />& Overholdelsesstandarder
  subtitle: afarer produkter produseres i samsvar med internasjonale marine sikkerhetsstandarder, kvalitetsstyringssystemer og miljøbestemmelser.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarer kvalitetssertifiseringer og samsvarsdokumentasjon
content_certifications:
  tagline: Våre sertifiseringer
  title: Sertifisert kvalitet,<br />globalt anerkjent
  subtitle: Hvert afarer-produkt støttes av sertifiseringer som viser vår forpliktelse til kvalitet, sikkerhet og miljøansvar.
  items:
    - title: CE-sertifisert
      description: Alle afarer-produkter oppfyller europeiske CE-merkingkrav for rekreasjonsfartøyer, og sikrer at sikkerhets-, helse- og miljøvernstandarder oppfylles.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Kvalitetsstyringssystemet vårt er ISO 9001:2015-sertifisert og dekker design, produksjon og distribusjon av oppblåsbare farkoster og marineutstyr.
      icon: tabler:clipboard-check
    - title: UKCA-merket
      description: Produkter solgt på det britiske markedet bærer UKCA-merking, som bekrefter samsvar med britiske forskrifter for marineutstyr og personlige vannscootere.
      icon: tabler:shield
    - title: BSCI-samsvarig
      description: afarer er BSCI (Business Social Compliance Initiative) revidert, noe som viser etisk produksjonspraksis, rettferdige arbeidsforhold og ansvar i forsyningskjeden.
      icon: tabler:heart-handshake
    - title: REACH-kompatibel
      description: Alle materialer som brukes i afarer-produkter overholder EUs REACH-forskrifter for kjemikaliesikkerhet, og sikrer at ingen begrensede stoffer finnes i vår PVC, Hypalon eller komponenter.
      icon: tabler:flask
    - title: Materialtesting
      description: Stoffer testes for strekkfasthet, rivestyrke, UV-nedbrytning og kaldsprekkytelse. Hver produksjonsbatch prøvetas og verifiseres.
      icon: tabler:test-pipe
content_factory:
  tagline: Fabrikkstandarder
  title: Produksjonseksellens<br />—bygget til spesifikasjon
  subtitle: 12.000 m²-anlegget vårt opererer under strenge kvalitetskontrollprotokoller på hvert produksjonstrinn.
  list:
    - 'Inngående materialinspeksjon: Alle råmaterialer — PVC-stoff, Hypalon, aluminium, finer, lim — testes mot spesifikasjoner før de settes i produksjon.'
    - 'Kontroll under produksjon: Hvert produksjonsstadium har dokumenterte kvalitetskontrollpunkter. Sveise-styrke, sømjustering, ventilinstallasjon og monteringsmoment verifiseres inline.'
    - 'Trykktesting: Hvert oppblåsbart kammer trykktestes ved 1,5× nominelt trykk i 24 timer. Lekkasjerate må være null for å bestå.'
    - 'Sluttinspeksjon: Ferdige produkter inspiseres for dimensjonsnøyaktighet, overflatekvalitet, tilbehørskompletthet og emballasjeintegritet før forsendelse.'
    - 'Batchsporing: Hvert produkt bærer et serienummer knyttet til produksjonsbatchposter, som muliggjør full sporing fra råmateriale til ferdig vare.'
content_safety:
  tagline: Marine sikkerhetsstandarder
  title: Sikkerhet først<br />—designet for pålitelig drift
  subtitle: afarer-produkter er designet og testet for å oppfylle internasjonale marine sikkerhetsstandarder for kommersiell og rekreasjonsbruk.
  items:
    - title: ISO 6185
      description: Oppblåsbare båter oppfyller ISO 6185-standarder for konstruksjon, stabilitet, oppdrift og lastekapasitet.
      icon: tabler:sailboat
    - title: ABYC-standarder
      description: Elektriske systemer og drivstoffsystemer følger ABYC-standarder (American Boat & Yacht Council) for sikker installasjon og drift.
      icon: tabler:bolt
    - title: SOLAS-samsvar
      description: Sikkerhetsutstyr og redningsapparater oppfyller SOLAS-krav (Safety of Life at Sea) der det er aktuelt.
      icon: tabler:lifebuoy
cta:
  title: Trenger du sertifiserte produkter for prosjektet ditt?
  subtitle: Kontakt teamet vårt for å diskutere sertifiseringskrav, dokumentasjon og overholdelse for ditt marked.
  actions:
    - variant: primary
      text: Be om sertifiseringsdokumenter
      href: /contact
    - text: Se vår kvalitetsside
      href: /quality

meta:
  title: SUP-utleieløsninger for flåte | {SITE}
  description: SUP-brett med høy rotasjon, konstruert for daglig utleiebruk. UV-bestandig PVC, forsterkede sømmer, hurtigtørkende materialer. Skaler utleievirksomheten din med Afarer.
hero:
  tagline: Utleieoperatører
  title: Skaler din utleievirksomhet<br />med tillit
  subtitle: Høyt rotasjons-SUP-brett konstruert for daglig utleiebruk, 365 dager i året. Din inntekt tar aldri en fridag.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Travel utleiebod med SUP-bord klare for gjester
features:
  title: Bygget for utleiebruk
  subtitle: Hvert brett er konstruert for 500+ utleiesykluser med minimalt vedlikehold.
  items:
    - title: 500+ utleiesykluser
      description: Testet for å tåle daglig bruk i saltvann, sol og sand.
      icon: tabler:shield-check
    - title: UV-bestandig tekstil
      description: Ingen falming eller nedbrytning etter 1 års utendørs lagring.
      icon: tabler:sun
    - title: Forsterkede sømmer
      description: 3 ganger sterkere enn standard oppblåsbar brettkonstruksjon.
      icon: tabler:layers-intersect
    - title: Hurtigtørkende materialer
      description: Brett klare for neste utleie på under 30 minutter.
      icon: tabler:droplet
    - title: Stabelbar lagring
      description: Plassbesparende design — lagre 40 % flere brett i samme område.
      icon: tabler:stack
    - title: Fargekodede størrelser
      description: Ansatte velger riktig brett umiddelbart med fargekodet størrelse.
      icon: tabler:color-swatch
stats:
  title: Driftsmålinger
  stats:
    - title: Brettomsetning
      amount: < 5 min
    - title: Årlig vedlikehold
      amount: ~15 min/brett
    - title: Reservedelforsendelse
      amount: 48h
    - title: Feilrate
      amount: < 0,5 %
fleet_guide:
  title: Guide for flåtestørrelse
  subtitle: Estimer flåtestørrelsen og inntektspotensialet for din utleievirksomhet.
  tiers:
    - label: Liten utleiebod
      boards: 15-20
      revenue: $XX XXX/år
    - label: Mellomstor drift
      boards: 30–50
      revenue: $XX XXX/år
    - label: Stor strandutleie
      boards: 50-100
      revenue: $XXX,XXX/år
cta:
  title: Klar til å skalere utleievirksomheten din?
  subtitle: Få utleiepriser eller sammenlign brettmodeller for din virksomhet.
  actions:
    - text: Få utleiepriser
      href: /contact?package=rental
      variant: primary
    - text: Sammenlign brettmodeller
      href: /compare
      variant: secondary

qc_section:
  tagline: Kvalitetskontroll
  title: Test- og kvalitetssikringsprosess
  subtitle: Hver båt gjennomgår obligatorisk testing før frakt. Kvalitetslaben vår opererer uavhengig av produksjonen og rapporterer direkte til ledelsen.
  steps:
    - step: "1"
      title: Råvareinspeksjon
      desc: PVC-, Hypalon- og drop-stitch-stoffer gjennomgår strekktesting, rivingsspredning og UV-bestandighetsverifisering før en batch slippes inn i produksjonen.
    - step: "2"
      title: 48-timers lufttetthetstest
      desc: Hvert rørkammer pumpes til 125 % av nominelt trykk og holdes i 48 timer. Trykkfall under 5 % utløser automatisk avvisning og ny søminspeksjon.
    - step: "3"
      title: Last- og balansetest
      desc: Ferdige båter lastes til maksimal vurdert kapasitet og testes for stabilitet, fribord og manøvrering. Hver båt vannprøves før endelig inspeksjon.
oem_section:
  tagline: OEM-prosjekter
  title: Merkevare- og OEM-partnerskaps casestudier
  subtitle: Fra konsept til container —hvordan vi hjelper globale merker med å lansere og skalere oppblåsbare båtlinjer.
  cases:
    - challenge: En europeisk utendørsforhandler trengte en private-label SUP-linje med unik dekkgrafikk, miljøvennlig PVC og detaljhandelsklar emballasje —alt levert på 60 dager.
      solution: Vi utviklet tilpassede digitale trykkfiler, hentet REACH-kompatibel PVC og komprimerte prøvetaking fra 3 runder til 1 ved å plassere designteamet på fabrikken vår i Qingdao.
      result: 55 dager fra signert PO til FOB. 2 400 enheter fordelt på 4 SKU-er. Gjentatt bestilling lagt før første container ankom.
    - challenge: En amerikansk vannsportsstartup trengte en høyytelses drop-stitch-kajakk med tilpasset skrogform, sammerkevareemballasje og BSCI-sertifisering for detaljhandelsplassering.
      solution: Vi tilpasset en eksisterende drop-stitch-kajakkform med modifisert rockerprofil, utviklet sammerkevareemballasjegrafikk og leverte full BSCI-revisjonsdokumentasjon.
      result: Vellykket lansert i 3 store amerikanske utendørskjeder. Over 5 000 enheter første år med 98 % salgsgjennomstrømming.
    - challenge: En australsk distributør trengte et CE-sertifisert SUP-utvalg med tilpassede rørfarger, Hypalon-oppgraderingsalternativ og samsvar med australsk standard AS 1799.
      solution: Vi produserte førproduksjonsprøver med 4 rørfargevarianter, hentet CSM Hypalon fra japansk leverandør og koordinerte tredjeparts AS 1799-samsvarstesting.
      result: 3-modells SUP-utvalg lansert i AU/NZ-markedet. Deretter vunnet et offentlig anbud for 12 patrulje-SUP-er.
faq_section:
  tagline: FAQ
  title: B2B- og OEM vanlige spørsmål
  questions:
    - q: Hva er minimumsbestillingsmengde (MOQ) for OEM av oppblåsbare SUP-brett?
      a: MOQ starter på 5—0 enheter for standard OEM-modeller. Tilpassede former og private-label-prosjekter krever minimum 200 enheter avhengig av kompleksitet. Prøvebestillinger og testserier er tilgjengelige for nye merkelanseringer.
    - q: Er afarer BSCI-sertifisert?
      a: Ja. Fabrikken vår opprettholder gyldig BSCI-sosialt samsvarssertifikat (revisjonsrapport tilgjengelig på forespørsel). Vi har også sertifisert kvalitetsstyring, og alle produkter er CE-sertifiserte. REACH- og RoHS-samsvarsdokumentasjon følger med hver OEM-forsendelse.
    - q: Hva er typisk leveringstid for en OEM-bestilling?
      a: MOQ starter på 5–10 enheter for standard OEM-modeller. Tilpassede former og private-label-prosjekter krever minimum 200 enheter avhengig av kompleksitet. Prøvebestillinger og testserier er tilgjengelige for nye merkelanseringer.
    - q: Kan dere sende FOB Qingdao eller CIF til havnen vår?
      a: Ja. Vi sender FOB Qingdao, CIF til større globale havner og DDP for kvalifiserte partnere. Logistikkteamet vårt håndterer containerbooking, eksportdokumentasjon og tollearbeid. Vi sender til 50+ land på tvers av EU-, USA-, AU- og Asia-markedene.
b2b_moq: "Standard MOQ: 5—0 enheter per modell (SUP/kajakk/drop-stitch). SUP MOQ: 2— enheter. Prøvebestillinger velkommen for nye partnerskap."
production_flow:
  tagline: Production Flow
  title: From Material to Finished Boat
  subtitle: Every boat passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: "01"
      title: Material Receiving & Incoming QC
      description: All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.
      qc_check: Tensile strength (ASTM D751), tear resistance (ISO 4674), thickness gauge, adhesive viscosity, visual defect scan
      qc_threshold: 100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect
      responsibility: Incoming QC team (3 inspectors)
    - stage: "02"
      title: CNC Cutting & Material Prep
      description: Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.
      qc_check: Dimensional check against CAD DXF files, edge quality inspection, panel count verification
      qc_threshold: Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance
      responsibility: Cutting workshop lead
    - stage: "03"
      title: Welding & Drop-Stitch Bonding
      description: Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.
      qc_check: Peel test every 50 units (ASTM D751), weld width measurement, hot-air temperature log review, visual seam inspection under backlight
      qc_threshold: Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject
      responsibility: Welding QC (2 inspectors per shift)
    - stage: "04"
      title: Assembly & Rigging
      description: "Boats move to final assembly where all components are mated: hull + tubes, valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist."
      qc_check: 100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection
      qc_threshold: "Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)"
      responsibility: Assembly team lead + line QC
    - stage: "05"
      title: Pressure Testing & Quality Hold
      description: Every chamber is inflated to 1.25× rated pressure (typically 20—5 PSI) and held for 24—8 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.
      qc_check: 24h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair
      qc_threshold: Max 5% pressure drop over 24h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch
      responsibility: Quality lab (independent of production, reports to management)
    - stage: "06"
      title: Final Inspection & Packing
      description: Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.
      qc_check: Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification
      qc_threshold: AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected
      responsibility: Final QC team (4 inspectors) + Packing team lead

material_traceability:
  tagline: Sporbarhet
  title: Materialsporing og batchkontroll
  description: Hvert parti råvare tildeles et unikt partinummer i vårt ERP-system. Fra ankomst gjennom produksjon til ferdig produkt, er hver båts stykklister knyttet tilbake til opprinnelig leverandørparti. Dette muliggjør full oppstrøms sporet for ethvert kvalitets- eller samsvarsspørsmål.
  system: Tilpasset ERP (Qingdao Vatrad Groups interne system) + fysiske batchkoder på hver arbeidsordre
  coverage: 100 % av produksjonsmaterialene — PVC, Hypalon, drop-stitch-stoff, lim, ventiler, beslag, emballasje
  records_retained: 10 år (i henhold til CE 2013/53/EU-krav)
  suppliers:
    - material: Marin-grade PVC
      source: Kinesiske og koreanske leverandører
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japansk leverandør
      certified: ISO 9001, REACH
    - material: Drop-stitch-stoff
      source: Intern veving + ekstern partner
      certified: Intern QC + leverandør ISO 9001
    - material: Ventiler og maskinvare
      source: Kinesiske OEM-leverandører
      certified: ISO 9001, materialsertifikater per batch

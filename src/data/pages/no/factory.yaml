workshops_section:
  tagline: Verksteder
  title: Produksjonsverksteder
  workshops:
    - title: PVC-kutting og materialforberedelse
      description: Automatiske CNC-kuttmaskiner bearbeider PVC-, Hypalon- og drop-stitch-stoffer med submillimeter-presisjon. Datamaskinoptimalisert plassering minimerer materialsvinn og sikrer at hver panel oppfyller sine dimensjonsspesifikasjoner før sveising.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Rørsveising og varmeforsegling
      description: Dedikert sveiseverksted med varmluftssveisemaskiner og dielektriske RF-presser. Varmluftssveisere føyer sammen og smelter PVC-rørkamre, mens RF-sveising produserer høyfaste, lufttette sømmer som overgår kravene.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: SUP-skrogproduksjon —glassfiber
      description: SUP-båtskrog produseres ved håndopplegning av glassfiber med polyester- og vinylesterharpikssystemer. Hvert lag håndrulles og vakuumpakkes for jevn kvalitet. Gelcoat-sprøytebod gir en høyglanset, UV-bestandig marin overflate.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: SUP-trykk og dekorasjon
      description: SUP-brett dekoreres med digitaltrykk for helfarget grafikk og silketrykk for logoer og gjentakende mønstre. Digitale skrivere produserer fotokvalitets dekkdesign, mens silketrykk leverer holdbare, livlige merkevaremerker.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    - title: Sluttmontering og rigging
      description: Monteringslinje der glassfberskrog og PVC-rør sammenføyes, motorer monteres, styring og kontroller kobles, og elektriske systemer kobles til. Hver båt følger en 100-punkts monteringssjekkliste som teamleder signerer.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Kvalitetstesting og inspeksjon
      description: Hver ferdig båt gjennomgår obligatorisk lufttetthetstesting, sømrivningskontroll og full systemkontroll før frakt. Kvalitetslaben vår opererer uavhengig av produksjonen og rapporterer direkte til ledelsen.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

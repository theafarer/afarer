hero:
  tagline: Fabrikk
  title: Fabrikk og produksjon
  subtitle: 12 000 m² integrert produksjon —fra råvare til ferdig båt
intro:
  - Som et fabrikkmerke under **Qingdao Vatrad Group Co., Ltd.** har afarer kontroll over hvert steg i produksjonen —fra mottak av rå PVC- og glassfibermaterialer til endelig forhåndskontroll av den ferdige båten. Produksjonsanlegget vårt i Qingdao Economic Development Zone dekker 12 000 kvadratmeter og rommer dedikerte verksteder for PVC-kutting, rørsveising, glassfiber-SUP-skrogproduksjon, digitalt SUP-trykk, sluttmontering og kvalitetstesting.
  - Ved å integrere design, ingeniørkunst, prototyping, produksjon og testing under ett tak eliminerer vi ineffektiviteten ved kontraktsproduksjon og opprettholder direkte kontroll over byggekvalitet, materialvalg og leveringstider. Hver båt som forlater verkstedet vårt er bygget av våre folk, på vårt utstyr, etter våre standarder.

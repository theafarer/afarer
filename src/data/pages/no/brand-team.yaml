hero:
  tagline: Our Team
  title: 'Menneskene bak afarer<br />—Konstruksjonsfrihet på vannet'
  subtitle: 'Grunnlagt i 2012 i Qingdao, Kina, ble afarer bygget av marineingeniører, materialforskere og vannsportsentusiaster som trodde på å gjøre profesjonelle oppblåsbare farkoster tilgjengelige over hele verden.'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'Fra et kystverksted<br />til et 12.000 m² anlegg'
  subtitle: 'afarer ble grunnlagt av et team marineingeniører med flere tiår kombinert erfaring innen design av oppblåsbare båter, PVC/Hypalon-produksjon og global produksjon av marineutstyr.'
  items:
    - title: 'Founded: 2012'
      description: 'Etablert i Qingdao, Kina —et stort maritimt knutepunkt med dyp skipsbyggingsarv.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'Inkludert 50+ FoU-ingeniører, kvalitetskontrollspesialister og produksjonsteknikere.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Dedikert produksjonsanlegg med 6 produksjonslinjer for SUP-er, oppblåsbare båter og SUP-brett.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Eksporterer til Europa, Amerika, Midtøsten, Asia-Stillehavet og Afrika.'
      icon: tabler:globe

philosophy:
  tagline: Designfilosofi
  title: Ingeniør-ledet design<br />—hver detalj teller
  subtitle: Ingeniørfilosofien vår er sentrert rundt tre prinsipper som veileder hvert produkt vi bygger.
  list:
    - 'Pålitelighet først: Hvert afarer-produkt er testet for å tåle virkelige forhold — fra redningsoperasjoner i kaldt vann til utleie i tropiske feriesteder. Vi overkonstruerer der det betyr mest.'
    - 'Presis produksjon: Våre anlegg bruker CNC-kutting, høyfrekvens sveising og automatisert trykktesting. Hver søm, hvert ventil, hvert fitting oppfyller dokumenterte spesifikasjoner.'
    - 'Kontinuerlig innovasjon: Vårt FoU-team evaluerer kontinuerlig nye materialer, produksjonsmetoder og desigforbedringer. Vi venter ikke på problemer — vi forutser dem.'
cta:
  title: Ønsker du å diskutere et prosjekt med teamet vårt?
  subtitle: Ingeniørene våre er klare til å gi råd om produktvalg, tilpasning og OEM/ODM-partnerskap.
  actions:
    - variant: primary
      text: Kontakt vårt team
      href: /contact
    - text: Se våre produkter
      href: /products

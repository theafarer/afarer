hero:
  tagline: Teknologi
  title: Hvordan drop stitch fungerer — ingeniørfaget bak oppblåsbare stive kjerner
  subtitle: 8 minutters lesetid
content_html: >
  <h2>Hva er Drop Stitch?</h2>

  <p>Drop stitch (også kalt «drop-stitch-stoff» eller «drop-stitch-kjerne») er en konstruksjonsmetode der tusenvis av enkelte polyestertråder forbinder topplaget og bunnet av et stoffskall. Når skallet blåses opp, fungerer disse trådene som indre spenningsmedlemmer — de forhindrer at topplaget og
  bunnet buler utover til en rund form, og tvinger panelet til å forbli flatt og stivt.</p>

  <p>Resultatet er en lett, bærbar konstruksjon som tåler 15 – 20 PSI indre trykk — sammenlignbar med stivheten til et hardt boppbrett, men fullt ut tømbart for oppbevaring og transport.</p>


  <h2>Hvordan det fungerer: Fysikken</h2>

  <p>I en konvensjonell oppblåsbar konstruksjon (som en ballong eller en luftmadrass) presser det indre lufttrykket jevnt i alle retninger. Uten indre begrensning blir konstruksjonen sylindrisk eller sfærisk. Drop stitch løser dette ved å innføre strekkforsterkning:</p>

  <ul>
    <li>Tusenvis av tråder forbinder topplaget og bunnet av stoffet</li>
    <li>Når det blåses opp, prøver lufttrykket å skyve top og bunn fra hverandre</li>
    <li>Trådene motstår denne separasjonen og overfører lasten til spenning langs trådaksen</li>
    <li>Resultatet er et flatt, stivt panel som motstår bøyning</li>
  </ul>


  <h2>Konstruksjonsprosess</h2>

  <ol>
    <li><strong>Fletting:</strong> Polyestertråder flettes samtidig inn i to separate lag av grunnstof (typisk 1 100 DTEX eller 1 680 DTEX PVC-belagt polyester). Trådene flettes i sløyfer mellom lagene i en 90&deg; vinkel.</li>
    <li><strong>Belegging:</strong> Det flettede grunnstoffet belagres med PVC (eller noen ganger TPU) ved hjelp av knivbelegging eller kalenderbelegging. Dette forsegler trådene og skaper den lufttette membranen.</li>
    <li><strong>Lagbinding:</strong> Drop-stitch-kjernen bindes til ytre laminerte lag (typisk 0,9 mm eller 1,2 mm PVC) ved hjelp av varmelaminering eller lim.</li>
    <li><strong>Sveising:</strong> Kantbånd sveises langs kantene ved bruk av varmluftssveising, RF-sveising eller høyfrekvenssveising for å danne brettets sidevegger.</li>
    <li><strong>Montering av ventiler:</strong> Boston-ventiler eller Halkey-Roberts-ventiler monteres, typisk med en trykkavlastningsmekanisme for å forhindre overoppblåsing.</li>
  </ol>


  <h2>Viktige kvalitetsindikatorer</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Inngangsnivå</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Trådtetthet</td><td class="p-3 border">1 tråd / kvadrat tomme</td><td class="p-3 border">2 tråder / kvadrat tomme</td></tr>
      <tr><td class="p-3 border">Grunnstoff</td><td class="p-3 border">1 100 DTEX</td><td class="p-3 border">1 680 DTEX</td></tr>
      <tr><td class="p-3 border">Maks trykk</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC-tykkelse</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 border">Kantkonstruksjon</td><td class="p-3 border">Brettet &amp; limt</td><td class="p-3 border">Sveiset &amp; fusion-bundet</td></tr>
    </tbody>
  </table>


  <h2>bruksområder</h2>

  <ul>
    <li><strong>SUP-brett:</strong> 4" – 6" tykkelse, 15 – 20 PSI, 1 – 2 tråder/kvadrat tomme</li>
    <li><strong>Kajakker:</strong> Drop-stitch-bunn + oppblåsbare sidekammer, 10 – 15 PSI bunn</li>
    <li><strong>RIB-bunner:</strong> Drop-stitch-bunner for lette, sammenleggbare RIB-joller, 12 – 18 PSI</li>
    <li><strong>Båtputestøtter:</strong> Lavtrykks-drop-stitch for formstøpte putestøtter med flate flater</li>
  </ul>


  <h2>Drop Stitch vs. Air Deck (glassfiber eller trekkjerne)</h2>

  <p>Harde brett bruker EPS-skumkjerner med glassfiber- eller trestrengforsterkning. De er lettere, stivere og mer responsive — men de kan ikke tømmes for luft. Drop stitch ofrer noe stivhet for full bærbarhet. For de fleste rekreasjonsbrukere er moderne drop-stitch SUP-er ved 20 PSI ikke å skille
  fra inngangsnivå harde brett når det gjelder stivhet.</p>


  <h2>Hvordan Afarer bruker Drop Stitch</h2>

  <p>Afarer bruker en 1 680 DTEX drop-stitch-kjerne i hele SUP-sortimentet, med 2 tråder per kvadrat tomme og et 1,2 mm PVC-ytre laminat. Brettene er vurdert til 20 PSI og gjennomgår en 24–48 timers trykktest ved 1,25x vurdert trykk før forsendelse. Kantbåndene er varmluftssveist med trelags fusion, og
  trykkavlastningsventiler er standard på alle modeller.</p>

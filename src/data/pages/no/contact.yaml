    - title: Teknisk støtte
      description: Garanti, reparasjoner, deler og bruksspørsmål.
      icon: tabler:tool
    - title: Presse og partnerskap
      description: Mediepakker, sponsorater og bransjesamarbeid.
      icon: tabler:news
    - title: Telefon
      description: +86 13305324192
      icon: tabler:headset
    - title: E-post
      description: info@afarer.com
      icon: tabler:mail
    - title: Hovedkontor
      description: Økonomisk utviklingssone, Laixi, Qingdao, Kina, 266600
      icon: tabler:map-pin
map:
  title: Vår lokasjon

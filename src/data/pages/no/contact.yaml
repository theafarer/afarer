meta:
  title: 'Kontakt — Partnerskap & produktforespørsler | {SITE}'
  description: 'Kontakt afarer for partnerskaps-, co-brand- og private label-henvendelser, eller profesjonelle flåter. Merke for oppblåsbare SUP-er og båter, vi svarer innen 2 virkedager.'
  keywords:
    - 'kontakt afarer'
    - 'sup distributør tilbud'
    - 'profesjonell SUP-leverandør'
    - 'kontakt SUP-produsent'
hero_text:
  tagline: Kontakt
  title: KONTAKT OSS
contact_form:
  id: form
  title: Send en melding
  subtitle: Angående pristilbud, tekniske spørsmål eller partnerskap — send oss en melding. Vi svarer innen én virkedag.
  email_to: info@afarer.com
  submit_button: Send forespørsel → Be om tilbud
  success_message: Takk! Meldingen din er mottatt. Vi svarer innen én virkedag.
  error_message: Det oppstod en feil under sending. Prøv igjen eller send en e-post direkte.
  default_country_code: '+1'
  captcha:
    label: 'Antispam: løs følgende oppgave'
  fields:
    - name: country
      label: Land
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: Estimert ordrevolum
      row: 2
      type: select
      options:
        - value: ''
          label: Velg estimert volum...
        - value: sample
          label: Kun prøver / prototyper
        - value: '5-10'
          label: 5–10 enheter (standard MOQ)
        - value: '100-500'
          label: 100–500 enheter
        - value: '500-plus'
          label: 500+ enheter (volumpriser)
      step: 1
    - name: customization
      label: Behov for tilpasning?
      row: 3
      type: select
      options:
        - value: ''
          label: Velg tilpasningstype...
        - value: none
          label: Standardprodukt (ingen tilpasning)
        - value: logo
          label: Kun tilpasset logo / merkevarebygging
        - value: full
          label: Fullstendig co-brand (størrelse, farge, grafikk, emballasje)
        - value: consultation
          label: Usikker — trenger konsultasjon
      step: 1
    - name: productInterest
      label: Produktkategorier av interesse
      row: 4
      type: select
      options:
        - value: ''
          label: Velg produktkategori...
        - value: all
          label: Alle produkter / Fullstendig katalog
        - value: sup
          label: SUP-brett / Padlebrett
        - value: safety
          label: Sikkerhetsutstyr / redningsvester
        - value: accessory
          label: Tilbehør (pumper, årer, bagger)
      step: 1
    - name: firstName
      label: Fornavn
      row: 1
      step: 2
    - name: lastName
      label: Etternavn
      row: 1
      step: 2
    - name: companyName
      label: Bedrift
      row: 2
      step: 2
    - name: email
      label: E-post
      row: 3
      type: email
      step: 2
    - name: tel
      label: Telefon
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: Adresse
      row: 4
      step: 2
    - name: zip
      label: Postnummer
      row: 5
      step: 2
    - name: subject
      label: Emne
      row: 1
      step: 3
    - name: message
      label: Melding
      row: 2
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: Andre måter å kontakte oss på
  columns: 3
  items:
    - title: Salgsforespørsler
      description: Pristilbud, konfigurasjoner, forhandlerhenvendelser og engrosordrer.

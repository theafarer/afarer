hero_text:
  tagline: Kontakt
  title: KONTAKT OSS
contact_form:
  id: form
  title: Send en melding
  subtitle: Angående pristilbud, tekniske spørsmål eller partnerskap —send oss en melding. Vi svarer innen én virkedag.
  email_to: info@afarer.com
  submit_button: Send
  success_message: Takk! Meldingen din er mottatt. Vi svarer innen én virkedag.
  error_message: Det oppstod en feil under sending. Prøv igjen eller send en e-post direkte.
  default_country_code: '+1'
  captcha:
    label: 'Antispam: løs følgende oppgave'
  fields:
    - name: firstName
      label: Fornavn
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Etternavn
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Bedrift
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Adresse
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Postnummer
      row: 4
      step: 2
    - name: country
      label: Land
      row: 4
      step: 2
    - name: email
      label: E-post
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Estimert ordrevolum
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Behov for tilpasning?
      row: 7
      step: 2
    - name: productInterest
      label: Produktkategorier av interesse
      row: 8
      step: 2
    - name: subject
      label: Emne
      row: 9
      step: 3
    - name: message
      label: Melding
      row: 10
      type: textarea
      rows: 6
      step: 3

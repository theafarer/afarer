hero_text:
  tagline: Kontakt
  title: KONTAKT OSS
contact_form:
  id: form
  title: Send en melding
  subtitle: Angående pristilbud, tekniske spørsmål eller partnerskap —send oss en melding. Vi svarer innen én virkedag.
  email_to: info@afarer.com
  submit_button: Send
  success_message: Takk! Meldingen din er mottatt. Vi svarer innen én virkedag.
  error_message: Det oppstod en feil under sending. Prøv igjen eller send en e-post direkte.
  default_country_code: '+1'
  captcha:
    label: 'Antispam: løs følgende oppgave'
  fields:
    - name: firstName
      label: Fornavn
      row: 1
      type: select
      optionsKey: land
      step: 1
    - name: lastName
      label: Etternavn
      row: 1
      type: select
      options:
        - value: ''
          label: Velg estimert volum...
        - value: prøve
          label: Kun prøver / prototyper
        - value: 5-10
          label: 5–10 enheter (standard minimumsordre)
        - value: 100-500
          label: 100–500 enheter
        - value: 500 pluss
          label: 500+ enheter (volumpriser)
      step: 1
    - name: companyName
      label: Bedrift
      row: 2
      type: select
      options:
        - value: ''
          label: Velg tilpasningstype...
        - value: ingen
          label: Standardprodukt (ingen tilpasning)
        - value: logo
          label: Kun tilpasset logo / merkevarebygging
        - value: full
          label: Fullstendig OEM (størrelse, farge, grafikk, emballasje)
        - value: konsultasjon
          label: Usikker — trenger konsultasjon
      step: 1
    - name: address
      label: Adresse
      row: 3
      type: select
      options:
        - value: ''
          label: Velg produktkategori...
        - value: alle
          label: Alle produkter / Fullstendig katalog
        - value: sup
          label: SUP-brett / Padlebrett
        - value: sikkerhet
          label: Sikkerhetsutstyr / redningsvester
        - value: tilbehør
          label: Tilbehør (pumper, årer, bagger)
      step: 1
    - name: zip
      label: Postnummer
      row: 4
      step: 2
    - name: country
      label: Land
      row: 4
      step: 2
    - name: email
      label: E-post
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Estimert ordrevolum
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Behov for tilpasning?
      row: 7
      step: 2
    - name: productInterest
      label: Produktkategorier av interesse
      row: 8
      step: 2
    - name: subject
      label: Emne
      row: 9
      step: 3
    - name: message
      label: Melding
      row: 10
      type: textarea
      rows: 6
      step: 3

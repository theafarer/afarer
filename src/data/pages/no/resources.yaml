hero_text:
  tagline: Resources
  title: 'Nedlastningssenter & Kjøperguider'
  subtitle: 'Få tilgang til produktkataloger, OEM-guider, kjøpersjekklister og teknisk dokumentasjon for å ta informerte innkjøpsbeslutninger.'
features3_downloads:
  tagline: Downloads
  title: 'Produktdokumentasjon<br />& Kjøperressurser'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Komplett produktspekter inkludert SUP-båter, oppblåsbare båter, SUP-brett, kajakker og tilbehør. Spesifikasjoner, konfigurasjoner og alternativer. PDF-format.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'Alt du trenger å vite om OEM/ODM-partnerskap: prosessoversikt, minimumsordremengder, tilpasningsmuligheter, kvalitetskontroll og frakt.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'Hvordan velge riktig SUP: skrogmaterialer, slangematerialer, motorvalg, størrelseshensyn og konfigurasjonsalternativer for ulike applikasjoner.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'Viktige hensyn ved valg av SUP-brettprodusent: kvalitetsindikatorer, sertifiseringskrav, MOQ-hensyn og hva du skal se etter i en fabrikkaudit.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC vs Hypalon: sammenligning av holdbarhet, UV-bestandighet, levetid, reparasjonsmuligheter og kostnadshensyn for ulike marine applikasjoner.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'Last ned vår produktbrief-mal. Fyll inn dine krav og returner den til oss for et tilbud og gjennomførbarhetsvurdering samme uke.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Vanlige spørsmål om våre produkter, produksjonsprosess og partnerskapsmodell.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ varierer etter produktkategori. SUP-båter starter vanligvis fra 10 enheter per modell. SUP-brett fra 50 enheter. Kontakt salgsteamet vårt for produktspesifikk MOQ-informasjon.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Ja. afarer tilbyr prøveproduksjon for evaluering før masseproduksjon. Prøvekostnader er forhandlingsbare og krediteres ofte den første produksjonsordren.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Standardvilkår er 30% depositum ved bestilling, 70% før forsendelse. LC-vilkår tilgjengelig for kvalifiserte kunder. Kontakt økonomiavdelingen vår for å diskutere ordninger.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Typiske ledetider: SUP-båter 30-45 dager, SUP-brett 20-30 dager, oppblåsbare båter 25-35 dager. Tilpasset utvikling legger til 15-30 dager for prototyping.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'CE-sertifisering for EU-markeder, US Coast Guard godkjent produksjon, ISO-kvalitetssystem, BSCI-overholdelse og REACH-materialoverholdelse.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Ja. Vi tilbyr tilpasset emballasje med din logo, farger og merkevareidentitet. MOQ for tilpasset emballasje avhenger av produktkategorien.'
      icon: tabler:color-swatch
cta:
  title: 'Trenger du hjelp til å finne riktig ressurs?'
  subtitle: 'Kontakt teamet vårt for personlig veiledning om produktvalg, OEM-partnerskap eller tekniske spesifikasjoner.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

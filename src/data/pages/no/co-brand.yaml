features:
  title: 'Hva co-branding betyr hos Afarer'
  subtitle: 'Co-branding er vårt designsamarbeidsprogram — bygget rundt Afarer-merket, vern av territorium og begrensede kolleksjoner, ikke umerket produksjon.'
  columns: 3
  items:
    - title: 'Afarer-produkter forblir Afarer-produkter'
      description: 'En co-brand-kolleksjon er en begrenset utgave av Afarer-brett med identiteten din flettet inn. Aldri umerket, aldri et tredjepartsmerke og aldri et åpent private label-program.'
      icon: 'tabler:trademark'
    - title: 'Designet med deg'
      description: 'Fargene, navnene og historien din former kolleksjonen. Design- og konstruksjonsteamet vårt håndterer dekk, grafikk, emballasje og dokumentasjon fra brief til levering.'
      icon: 'tabler:pencil'
    - title: 'For klubber, resorts, arrangementer og fellesskap'
      description: 'Flåtekolleksjoner for padleklubber og resorts, arrangementsutgaver for løp og fellesskapsserier — alle med Afarers kvalitet og garanti.'
      icon: 'tabler:users'
    - title: 'Verner om landpartnere'
      description: 'Co-branding går hånd i hånd med modellen vår med ett land, én distributør. Nasjonale partnere beholder territoriet sitt; co-brand-kolleksjoner åpner ikke døren for parallelle merker i markedet deres.'
      icon: 'tabler:shield-check'
    - title: 'Ingeniørarbeid og kvalitetsstandarder'
      description: 'Hver kolleksjon sendes fra vår sertifiserte forsyningskjede med CE- og ISO 9001-dokumentasjon, trykktesting og de samme QC-kontrollpunktene som hovedkolleksjonen vår.'
      icon: 'tabler:certificate'
    - title: 'Blir en merkevare'
      description: 'En begrenset co-brand-kolleksjon bygger din egen historie på vannet — dekningsgrad, medieinnhold og en grunn til at padlere kommer tilbake sesong etter sesong.'
      icon: 'tabler:star'

faqs:
  title: 'Co-Brand — FAQ'
  subtitle: 'Hvordan co-branding hos Afarer fungerer, og hvordan det skiller seg fra OEM og private label.'
  items:
    - title: 'Er co-branding det samme som OEM eller private label?'
      description: 'Nei. Afarer driver ikke lenger et åpent OEM/private label-program. Co-brand-produkter forblir Afarer-produkter — designet, konstruert, kvalitetstestet og båret av Afarer-merket. Identiteten din opptrer som et co-brand, ikke som et umerket tredjepartsprodukt.'
    - title: 'Hvem kan starte et co-brand-prosjekt?'
      description: 'Kvalifiserte vannsportsbedrifter: eksisterende landpartnere, padleklubber, resorts og hoteller, arrangementsarrangører og fellesskap. Send oss en prosjektbrief, og vi bekrefter anvendeligheten før designarbeidet begynner.'
    - title: 'Kommer co-branding i konflikt med landdistributøren min?'
      description: 'Nei. Modellen med ett land, én distributør går foran. Co-brand-kolleksjoner koordineres med den lokale landpartneren der en finnes, slik at ingen parallelt eller konkurrerende merke opptrer innenfor et beskyttet territorium.'
    - title: 'Hva er minimumsbestillingen for en co-brand-kolleksjon?'
      description: 'Pilotkolleksjoner starter på 30–50 stk. Standardkolleksjoner er 50–100 stk.; store eller multiregionale utgaver er 100+ stk. Tidsplaner for egendefinert utvikling avtales per prosjekt.'
    - title: 'Hva utgjør Afarer-kvalitet kontra partnerbidrag?'
      description: 'Afarer eier produktdesign, konstruksjon, materialer, oppbygging, QC og garanti. Partnere bidrar med kolleksjonskonsept, navnsetting, farger, grafisk innspill og go-to-market. Det holder én kvalitetsstandard på vannet.'
    - title: 'Hvordan søker jeg?'
      description: 'Fyll ut co-brand-forespørselsskjemaet med bedriften, markedet og kolleksjonsidéen din. Vi går gjennom treff, og svarer innen 3 virkedager med et forslag og Co-Brand Project Agreement.'

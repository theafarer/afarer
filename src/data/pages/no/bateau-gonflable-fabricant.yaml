      description: 'Logo, farger, skott, rom — en oppustelig båt på bestilling i ditt merke.'
      icon: 'tabler:palette'
    - title: 'OEM / ODM'
      description: 'Utvikling av spesialmodeller for merker, distributører og profesjonelle flåter.'
      icon: 'tabler:building-factory'
    - title: 'Global frakt'
      description: 'FOB Qingdao, fulle containere eller konsolidert last, støtte til tollbehandling.'
      icon: 'tabler:world'
faqs:

  subtitle: 'Svar for å lansere OEM-prosjektet ditt for oppustelige båter.'
  items:
    - title: 'Hvilke typer oppustelige båter produserer dere?'
      description: 'Oppustelige tendere, joller, fiskebåter, arbeidsbåter og spesialmodeller i PVC.'
    - title: 'Kan dere tilpasse en oppustelig båt?'
      description: 'Ja — logo, farger, skott, forsterkninger og motoralternativer etter din spesifikasjon.'
    - title: 'Hva er leveringstiden for et båt-OEM-prosjekt?'
      description: 'Prøven sendes på 3-4 uker, masseproduksjon på 35-50 dager avhengig av modellen.'

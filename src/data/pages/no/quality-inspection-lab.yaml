home_label: Hjem
hero:
  tagline: Lab 06
  title: Kvalitets- og inspeksjonslaboratorium
  subtitle: Uavhengig verifisering — enhver test bestått før levering
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: Afarer kvalitetsinspeksjonslaboratorium UV-testing
intro: >-
  Hver båt som forlater vårt verksted bærer sertifiseringen på at den har bestått et definert sett kvalitetsinspeksjoner og materialtester. Vårt kvalitets- og inspeksjonslaboratorium er en uavhengig funksjon i organisasjonen — det rapporterer direkte til administrerende direktør, ikke til produksjon
  — noe som sikrer at intet kommersielt press kan kompromittere inspeksjonsporten. Hvis et materialparti eller en ferdig båt ikke oppfyller den publiserte spesifikasjonen, har laboratoriet myndighet til å stanse forsendelsen til ikke-samsvar er løst.
content_html: >
  <h2>Stol på, men verifiser</h2>

  <p>Laboratoriet drives under et kvalitetsstyringssystem i samsvar med prinsippene, og våre testmetoder er basert på ISO-, ASTM- og EN-standarder der det er aktuelt. Vi opprettholder detaljerte registre over hver utført test og skaper en fullstendig sporbarhetskjede fra råvaremottak til endelig
  båtlevering.</p>


  <h2>Testutstyr og kapasiteter</h2>

  <table>
    <thead><tr><th>Utstyr</th><th>Utførte tester</th><th>Standard / Metode</th></tr></thead>
    <tbody>
      <tr><td>Universell testmaskin (50 kN)</td><td>Trekkfasthet (stoff), peel-motstand (sømmer), rivspredning</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Lufttett testutstyr (programmerbart)</td><td>1000-syklusers oppblåsning/lufting, 30 min trykkholdtest</td><td>ISO 6185 (intern)</td></tr>
      <tr><td>Sømpeel-jig (motorisert 180° peel)</td><td>Sveise- og limsøm peel-styrke ved 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Hydrostatisk hodeduktester</td><td>Vanninntrengningsmotstand for stoff (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Digital tykkelsesmåler og mikrometer</td><td>Stofftykkelse, rørveggtykkelse, limfilms tykkelse</td><td>ISO 2286-3</td></tr>
      <tr><td>Miljøkammer</td><td>Temperaturkondisjonering (-40 °C til +80 °C) for kuldesprekk- og varmealdringstester</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Fargespektrofotometer</td><td>Delta-E-fargemåling etter UV-eksponering</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>Inspeksjonsportene — fra materiell til levering</h2>

  <p>Hver båt følger en definert kvalitetsplan med obligatoriske inspeksjonspunkter. Ingen båt kan hoppe over en port; hver port må godkjennes av en kvalitetsinspektør før neste produksjonsstadium begynner.</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Port 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Innkommende materiellinspeksjon</p>
            <p class="text-xs text-gray-500 mt-1">Stoffbatch, limbatch, maskinvare — alt kontrolleres mot innkommende spesifikasjon før frigjøring til produksjon.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Port 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Sveisinspeksjon under prosess</p>
            <p class="text-xs text-gray-500 mt-1">Første sveisesveip testet (peel + visuelt) ved start av hvert produksjonsskift.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Port 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kammer-lufttest</p>
            <p class="text-xs text-gray-500 mt-1">Hvert kammer pressuriseres til 1,5 x arbeidstrykk, holdes i 30 min. Data loggføres per serienummer.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Port 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Forleveringsinspeksjon</p>
            <p class="text-xs text-gray-500 mt-1">Komplett båt inspisert: alle festeelementer riktig strammet, systemer funksjonelle, ingen kosmetiske feil. 100-punkts sjekkliste.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Port 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Sluttsertifisering</p>
            <p class="text-xs text-gray-500 mt-1">Testrapporter kompilert, inspeksjonslogger gjennomgått, samsvarserklæring utstedt.</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>Nøkkelkvalitetsmåltall (rullende gjennomsnitt 2025)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99,7 %</span>
      <span class="text-xs text-gray-500">Førstegangsutfall (stoffbatch)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0,2 %</span>
      <span class="text-xs text-gray-500">Sveiseavvisningsrate (lineær meter)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Kamre lufttestet før montering</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">Designkategorisamsvar</span>
    </div>
  </div>


  <h2>Vårt kvalitetsteam</h2>

  <p>Laboratoriet bemannes av en kvalitetssjef (10 års erfaring med marinkvalitet, ASQ-sertifisert kvalitetsingeniør), to kvalitetsinspektører (begge med nivå 2 NDT-sertifisering i visuell testing) og en materialtekniker ansvarlig for all fysisk testing. Teamet gjennomgår årlig kompetansetesting
  gjennom en uavhengig tredjepartsleverandør for å sikre at testresultatene våre forblir nøyaktige og reproduserbare.</p>


  <h2>Uavhengige tester for kunder</h2>

  <p>Vårt kvalitets- og inspeksjonslaboratorium er tilgjengelig for uavhengige testingstjenester. Hvis du trenger å verifisere en stoffspesifikasjon, validere et nytt limsystem eller oppnå en tredjeparts testrapport for anskaffelseskvalifisering, kan vi utføre testene i henhold til gjeldende
  standard og utstede en sertifisert testrapport.</p>

  <p>Eksempler på nylig tredjepartstestarbeid:</p>

  <ul>
    <li>Peel-styrke-sammenligning av fem konkurrerende limfilmsprodukter for et europeisk militært anskaffelsesprogram.</li>
    <li>Akselerert aldringsstudie (UV + termisk syklus) for en ny oransjepigmentert PVC-formulering, med regelmessige mellommålinger med 500 timers intervaller.</li>
    <li>Lufttett-validering av 50 prototypebaffelventiler for et nytt høytrykksrørdesign.</li>
  </ul>


  <h2>Vårt engasjement overfor deg</h2>

  <p>Når du mottar en {SITE.name}-båt, mottar du også dens kvalitetsdokumentasjon — en kompilert register over testresultatene som gjelder for din spesifikke båt. Stoffbatch-sertifikat, sveisepeeltester, kammer-lufttestlogger og forleveringsinspeksjonssjekkliste. Hvert tall er sporbar. Hver
  inspektør er identifisert. Dette er ikke bare papirarbeid — det er vårt løfte om det vi leverte er det vi spesifiserte.</p>

  <p>Hvis du noen gang har en kvalitetsbekymring, kan du kontakte laboratoriet direkte — kontaktinformasjonen er utskrevet på samsvarserklæringen din. Vi tar ethvert spørsmål alvorlig og forplikter oss til en formell undersøkelse innen 48 timer.</p>

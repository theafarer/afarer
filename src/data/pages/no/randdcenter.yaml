meta:
  title: FoU-senter | {SITE}
  description: Forskning og utvikling – PVC-stofftesting, skrogteknikk, RF-sveising, hydrodynamisk testing og kvalitetskontroll. Tilpassede FoU-tjenester tilgjengelig.
hero:
  tagline: FoU-senter
  title: FoU-senter
  subtitle: Fokusert på fremgang
intro:
  - >-
    afarers forsknings- og utviklingsavdeling (R&D) er drivkraften bak vårt oppdrag å revolusjonere vannsportsutstyr. Vi gir ventuspentusiaster over hele verden sikrere, mer komfortable og mer fornøyelige produkter gjennom utrettelig innovasjon innen oppblåsbare padlebord (SUP-er) og båter. Vårt
    dedikerte team av ingeniører, designere og lidenskapelige vannsportseksperter former fremtiden for bransjen og hever stadig listen for kvalitet, ytelse og bærekraft.
  - Vår FoU-fasilitet samler materialvitenskapsfolk, navalarkitekter og produksjonsingeniører under ett tak. Fra stoffformulering og skrogsimulering til sveiseprosessutvikling og fullskala sjøforsøk, hvert stadium av produktutviklingen drives av data og valideres gjennom testing.
mission:
  tagline: Vår misjon
  title: Innovasjon av fremtiden for vannsport
  pillars:
    - icon: lightning
      title: Teknologisk utvikling
      desc: Pionervirksomhet innen nye materialer, design og produksjon for overlegen ytelse og levetid.
    - icon: design
      title: Brukersentrert design
      desc: Dyp forståelse og overgåelse av brukerbehov gjennom ergonomisk og intuitiv produktdesign.
    - icon: globe
      title: Bærekraftig praksis
      desc: Minimering av vårt miljøavtrykk ved bruk av miljøvennlige materialer og prosesser.
    - icon: shield
      title: Kompromissløs sikkerhet
      desc: Sikrer de høyeste sikkerhetsstandardene gjennom grundig testing og sertifisering.
pillars:
  - title: Teknologisk utvikling
    desc: Pionervirksomhet innen nye materialer, design og produksjonsprosesser for å levere overlegen ytelse og levetid.
    icon: tech
  - title: Avanserte materialer
    desc: Utforskning av banebrytende PVC, Hypalon, kompositter og bærekraftige alternativer for forbedrede produktegenskaper.
    icon: materials
  - title: Bærekraft
    desc: 'En kjerneforpliktelse: Vi er dedikert til miljøansvar gjennom bærekraftig produksjon og resirkulerbare materialer.'
    icon: sustainability
capabilities:
  tagline: Ferdigheter
  title: FoU-kapasiteter
  subtitle: Fire kjerneområder som gir oss full kontroll over produktutvikling — fra råmaterialforskning til sluttsertifisering.
  groups:
    - title: Materialvitenskap og tekstilteknologi
      items:
        - PVC- og Hypalon-formuleringsoptimalisering og -analyse
        - UV-stabilisering, flammehemming og utvikling av antimikrobielle tilsetningsstoffer
        - Flerlags stofflaminering og vedheftingsteknologi
        - Akselerert aldringstesting (UV, termisk, fuktighet, saltspray)
    - title: Skrogteknikk og hydrodynamikk
      items:
        - Parametrisk 3D-skrogdesign og CFD-optimalisering
        - Endelig elementanalyse for strukturelle og støtbelastninger
        - Modelltowingtank-testing og ytelsesvalidering
        - Tilpasset skrogutvikling for spesielle oppdragsprofiler
    - title: Sveiseteknologi og sammenføyingsteknologi
      items:
        - RF-dielektrisk sveise prosessutvikling og optimalisering
        - Varmluft-, varmkile- og ultralyd-sveise metoder
        - Limbinding og sømteipkvalifisering
        - Modellering av sveiseholdbarhet og levetidsforutsigelse
    - title: Testing, sertifisering og etterlevelse
      items:
        - Kvalitetsledelse og CE-samsvarstesting
        - Uavhengig tredjepartstesting og sertifiseringsstøtte
        - Utvikling av tilpassede testprotokoller for innkjøpskvalifisering
        - Driftsfeilanalyse og årsaksundersøkelse

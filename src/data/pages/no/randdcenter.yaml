rd_services:
  tagline: Skreddersydd FoU
  title: F&U-tjenester for partnere
  services:
    - title: Tilpasset materialutvikling
      desc: Vi utvikler tilpassede stoffformuleringer, laminatstakker og limsystemer skreddersydd for ditt driftsmiljø og ytelsesmål.
    - title: OEM / ODM-produktutvikling
      desc: Vi utvikler tilpassede stoffformuleringer, laminatstakker og limsystemer skreddersydd for ditt driftsmiljø og ytelsesmål.
    - title: Tredjepartstesting og sertifisering
      desc: Benytt våre ISO-sertifiserte testfasiliteter for uavhengig materialtesting, produktvalidering og sertifiseringsstøtte.
  cta: Discuss your R&D requirements →
  cta_link: /contact
vision:
  tagline: Vår visjon
  title: Forme fremtiden for vannsport
  body: >-
    afarer arbeider for å lede oppblåsbare båter og SUP-industrien gjennom kontinuerlig innovasjon, urokkelig kvalitet og et ubrytelig engasjement for sikkerhet og bærekraft – og beriker dermed opplevelsene til vannsportentusiaster over hele verden. afarer FoU-senteret er der lidenskap møter
    innovasjon, og setter nye standarder for vannsportsindustrien.
labs_section:
  tagline: Laboratorier
  title: Våre laboratorier
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC-stofflaboratorium
      description: Kontinuerlig forskning og testing av PVC- og Hypalon-rørmateriale for trekkfasthet, UV-resistens, slitasje og fleksibilitet ved lave temperaturer for å sikre langsiktig pålitelighet i marine miljøer.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Skrogteknisk studio
      description: CAD-drevet design og endelig elementanalyse av HDPE-, aluminiums- og glassfiberskrog. Hvert skrog simuleres digitalt for spenningsfordeling og støtmotstand før den første prototypen bygges.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: RF-sveisesenter
      description: Dedikert sveiseanlegg for radiofrekvenssveising med presis temperatur- og trykkontroll, som produserer høyfester tetteste sommer som oppfyller marineindustriens standarder for oppblåsbare farkoster.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Hydrodynamisk testtank
      description: Modelltesting i vår interne testtank for å optimalisere skrogform, planeytelse, stabilitet og drivstoffeffektivitet under ulike last- og sjøforhold.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypverksted
      description: Fullskala prototyping og utrustning der nye modeller bygges, utrustes og prøvekjøres. Hver prototype gjennomgår minimum 20 timers vanntest før produksjonsgodkjenning.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Kvalitets- og inspeksjonslaboratorium
      description: Dedikert kvalitetssikringslaboratorium som utfører trekktesting, luftlTesting, sømskalltester og materialgodkjenning for å sikre at hver båt som forlater verkstedet oppfyller våre publiserte spesifikasjoner.
      href: /randdcenter/quality-inspection-lab

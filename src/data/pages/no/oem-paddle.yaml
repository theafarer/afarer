faqs:
  title: 'FAQ om OEM-produksjon av paddleboards'
  subtitle: 'Svar på de vanligste spørsmålene fra merker som lanserer sitt eget paddleboard.'
  items:
    - title: 'Hvordan skaper jeg mitt eget paddleboard-merke?'
      description: 'Lanser merket ditt på 16 uker: brief, design, CE-sertifsert prototype, masseproduksjon og levering. Utforsk OEM-pakkene våre.'
    - title: 'Hva er produksjonstiden?'
      description: 'Prøven er klar på 2-3 uker, masseproduksjon på 30-45 dager avhengig av volum.'
    - title: 'Har paddleboardet logoen vår?'
      description: 'Ja — full private label: trykking av logo, egne farger, emballasje og merkelapper i ditt merke.'
    - title: 'Kan jeg kjøpe engros fra dag én?'
      description: 'MOQ er 50 stk. for standardmodeller, med engrospristrinn etter hvert som volumet øker.'

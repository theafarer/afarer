timeline:
  - year: '2012'
    title: Grunnlaget for Maritim Produksjon
    body: afarer begynte som et spesialisert verksted for oppblåsbare vannfarkoster i Qingdao, Kina, med fokus på maritimt håndverk og produksjon av oppblåsbare båter. Det tidlige arbeidet handlet om å bygge pålitelige oppblåsbare produkter gjennom praktisk ingeniørerfaring og produksjonsdisiplin.
  - year: '2015'
    title: Første Eksport & CE-sertifisering
    body: De første eksportordrene nådde Japan og Korea. CE-sertifisering ble oppnådd for kjerne produktlinjer, som markerte afarers inntreden i internasjonale markeder. Selskapet begynte å betjene kommersielle og fritidsbrukere utenfor Kina.
  - year: '2018'
    title: Fabrikkutvidelse
    body: Flyttet til et 12 000 m² stort produksjonsanlegg. La til RF-sveiselinjer og drop-stitch-produksjonskapasitet, noe som muliggjorde større produksjon og forbedrede kvalitetskontrollsystemer.
  - year: '2020'
    title: FoU-senter Etablert
    body: Åpnet et dedikert FoU-senter med PVC-stofflab, hydrodynamisk testtank og CAD/FEA-simuleringsstudio. Produktutviklingen ble utvidet til å fokusere på lett konstruksjon, forbedret holdbarhet og brukersentrert design.
  - year: '2022'
    title: Sertifisering & Global Vekst
    body: Oppnådde ISO 9001-sertifisering. Utvidet til 14 FoU-ingeniører og over 200 ansatte. Produktene nådde kunder over hele Europa, Amerika og Asia-Stillehavsregionen gjennom distributør- og co-brand-partnerskap.
  - year: '2024'
    title: Innovasjons- & Designstudio
    body: Lanserte et fullservice design- og innovasjonsstudio for skreddersydde co-brand-prosjekter, fra konsept til produksjon. Styrket profesjonelle maritime applikasjoner inkludert redning, kommersielle og offentlige anbud.
  - year: '2026'
    title: Å Bygge Fremtiden for Vannutforskning
    body: I dag fortsetter afarer å utvikle oppblåsbare båter, SUP-systemer og skreddersydde maritime løsninger — og forbinder mennesker og organisasjoner med verdens vann. 50+ land betjent, 15 000+ enheter i årlig kapasitet.
content_founding:
  tagline: Begynnelsen
  title: Født ved Vannkanten
  subtitle: 'afarer startet i et kystverksted i Qingdao med én båt og en visjon: å bygge oppblåsbare vannfarkoster som tåler virkelige maritime forhold.'
  paragraphs:
    - I 2012 så grunnleggerne våre et hull i markedet — de fleste oppblåsbare båter var enten rimelige men upålitelige, eller av høy kvalitet men uoverkommelig dyre. De trodde det var plass for en produsent som leverte både kvalitet og verdi.
    - Det første skroget ble bygget for hånd, testet i lokale farvann og forbedret basert på virkelige tilbakemeldinger fra fiskere og mindre kommersielle operatører. Den tilbakemeldingssløyfen — bygg, test, lytt, forbedre — er fortsatt kjernen i vår ingeniørfilosofi i dag.
    - Innen 2015 hadde ryktet spredt seg utenfor Qingdao. Internasjonale distributører begynte å etterspørre prøver. Det som startet som et lokalt verksted var i ferd med å bli en global leverandør.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarers tidlige produksjonsverksted og tilvirkning
content_growth:
  tagline: Vekst & Innovasjon
  title: Fra Verksted til 12 000 m² Anlegg
  subtitle: Kontinuerlige investeringer i mennesker, utstyr og prosesser har forvandlet afarer til et moderne maritimt produksjonsanlegg.
  paragraphs:
    - Etter hvert som etterspørselen vokste, vokste også anlegget vårt. Vi utvidet fra et lite verksted til en 12 000 m² stor fabrikk med dedikerte produksjonslinjer for SUP-båter, oppblåsbare båter, SUP-brett og tilbehør.
    - Vi investerte i CNC-skjæremaskiner, høyfrekvens-sveiseutstyr, drop-stitch-produksjonslinjer og omfattende testrigger — slik at vi kan kontrollere alle aspekter av produksjonskvaliteten.
    - I dag består teamet vårt på over 200 av mariningeniører, materialforskere, kvalitetskontrollspesialister og dyktige håndverkere — mange av dem har vært med afarer siden de tidlige dagene.
philosophy:
  tagline: Merkevarefilosofi
  title: Ingeniørkunst for Frihet på Vannet
  body: Frihet på vannet handler ikke bare om bevegelse. Det handler om å oppdage nye steder, skape utendørsopplevelser, koble mennesker med naturen og muliggjøre profesjonelle oppdrag. Ingeniørkunsten gjør den friheten mulig.
  pillars:
    - title: Pålitelighet Først
      body: Vannmiljøer krever tillit. afarers produkter er designet rundt stabilitet, holdbarhet, sikkerhet og jevn ytelse.
    - title: Menneskesentrert Design
      body: Produkter skal tjene mennesker, ikke teknologi. Hver designbeslutning begynner med å forstå hvordan mennesker bruker vannfarkoster, hvor de utforsker og hvilke utfordringer de møter.
    - title: Tilgjengelig Utforskning
      body: Vann skal ikke bare tilhøre eksperter. afarer lager utstyr som gjør at flere mennesker trygt kan oppleve elver, innsjøer, hav og kystmiljøer.
    - title: Kontinuerlig Innovasjon
      body: Innovasjon handler ikke bare om å skape nye produkter. Det handler om å forbedre hver detalj — materialer, strukturer, produksjon og brukeropplevelse.
engineeringDna:
  tagline: Ingeniør-DNA
  title: Hvordan afarer Skaper Produkter
  areas:
    - title: Materialvitenskap
      body: afarer fokuserer på å velge egnede materialer for ulike marine miljøer. Viktige hensyn inkluderer slitestyrke, UV-bestandighet, trykkstabilitet og langsiktig holdbarhet.
      items:
        - Slitestyrke
        - UV-bestandighet
        - Trykkstabilitet
        - Langsiktig holdbarhet
    - title: Konstruksjonsteknikk
      body: Oppblåsbare vannfarkoster krever en presis balanse mellom stivhet, vekt, portabilitet og stabilitet. afarers ingeniørkunst fokuserer på å optimalisere disse faktorene gjennom drop-stitch-kjerneteknologi og avansert sømkonstruksjon.
      items:
        - Stivhet
        - Vektoptimalisering
        - Portabilitet
        - Stabilitet
    - title: Produksjonspresisjon
      body: 'Hvert produkt gjennomgår kontrollerte prosesser: materialforberedelse, presisjonsskjæring, sveising og sammenføyning, montering, kvalitetsinspeksjon og ytelsesverifisering.'
      items:
        - Materialforberedelse
        - Presisjonsskjæring
        - Sveising & Sammenføyning
        - Montering & KS
    - title: Brukerscene-teknikk
      body: Produkter utvikles rundt virkelige bruksområder — rekreasjon, eventyr og profesjonell bruk — og sikrer at hvert design møter de spesifikke kravene i det tiltenkte miljøet.
      items:
        - Rekreasjon
        - Eventyr
        - Profesjonelt
        - Kommersielt

meta:
  title: 'Академија — SUP водичи и обука веслања | {SITE}'
  description: 'afarer Академија: водичи за надуване плоче за веслање, технике стојећег веслања, безбедност на води и знање о материјалима за почетнике и професионалце.'
  keywords:
    - 'научи стојеће веслање'
    - 'sup водич за почетнике'
    - 'основе веслачке плоче'
    - 'sup техника'
    - 'sup часови'
hero:
  tagline: 'afarer Академија'
  title: 'Центар за учење'
  subtitle: 'Водичи и туторијали за сваки ниво вештине — од SUP основа до напредних техника спашавања'

categories:
  - level: 'Почетник'
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: 'SUP основе'
        desc: 'Научите основе веслања стојећи на плочи — став, техника замаха и равнотежа.'
        slug: beginner-sup-guide
      - title: 'Технике веслања'
        desc: 'Замах напред, замах луком, привлачење и ниско одржавање — савладајте основне покрете веслања.'
        slug: sup-paddle-guide
      - title: 'Безбедност на првом месту'
        desc: 'Кључне безбедносне праксе укључујући проверу времена, употребу PFD, правила поводника и самоспашавање.'
        slug: sup-safety-guide
  - level: 'Средњи ниво'
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: 'Основе туринг веслања'
        desc: 'Планирање вишесатног веслања — навигација, хидрација, темпо и читање прогнозе ветра.'
        slug: touring-sup-guide
      - title: 'Читање времена'
        desc: 'Тумачите морске прогнозе, препознајте шаблоне облака и разумејте утицај ветра на воду.'
        slug: weather-planning-water-sports
      - title: 'Основе навигације'
        desc: 'Читање карата, употреба компаса, GPS тачке и планирање рута за обално веслање.'
        slug: sup-navigation-guide
      - title: 'Свест о плими'
        desc: 'Разумевање циклуса плиме и осеке, струја и како утичу на време поласка и избор руте.'
        slug: understanding-tides
  - level: 'Напредни ниво'
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: 'Планирање вишедневних путовања'
        desc: 'Логистика експедиције — избор опреме, планирање хране, безбедносни протоколи и контакти за хитне случајеве.'
        slug: sup-travel-guide
      - title: 'Технике спашавања'
        desc: 'Самоспашавање, T-спашавање и протоколи вучења за отворену воду.'
        slug: sup-self-rescue
      - title: 'Ноћно веслање'
        desc: 'Навигација после мрака — захтеви за осветљење, памћење руте, комуникација у групи и свест о опасностима.'
        slug: ocean-safety-basics
  - level: 'Одржавање'
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: 'Чишћење и нега'
        desc: 'Испирање слатком водом, UV заштита, превенција плесни и правилне технике сушења након сваке сесије.'
        slug: inflatable-sup-maintenance
      - title: 'Водич за чување'
        desc: 'Најбоље праксе чувања надуваних SUP плоча — издувавање, склапање, контрола температуре и рок трајања.'
        slug: inflatable-sup-storage
      - title: 'Основе поправке'
        desc: 'Поправите мале пробоје, цурења на шавовима и проблеме са вентилима помоћу PVC комплетâ за поправку и техника закрпљивања.'
        slug: inflatable-sup-repair
      - title: 'Одржавање вентила'
        desc: 'Препознајте типове вентила (Halkey-Roberts, Boston, Leafield), очистите нечистоћу и замените неисправне стабљике.'
        slug: sup-pump-guide

knowledge_center_tagline: 'Центар знања'
knowledge_center_title: 'Водичи за морску опрему и индустрију'
knowledge_center_subtitle: 'Стручна знања и водичи за куповину за морске професионалце, оператере флотâ и љубитеље водених спортова.'

knowledge_sections:
  - title: 'Знање о SUP плочама'
    tagline: 'Водичи за плоче за стојеће веслање'
    desc: 'Све о SUP плочама — дизајн плоче, материјали, избор величине, одржавање и савети за куповину за рекреативну и комерцијалну употребу.'
    guides:
      - title: 'Како изабрати праву SUP плочу'
        desc: 'Комплетан водич за избор SUP плоче — величина, запремина, материјал, облик и намена.'
        href: '/learn/sup'
      - title: 'Надувана наспрам тврде SUP плоче'
        desc: 'Надувана SUP плоча у односу на тврду епоксидну плочу — преносивост, издржљивост, перформансе и вредност у поређењу.'
        href: '/compare/inflatable-vs-hardboard'
      - title: 'Универзална, туринг или јога SUP плоча'
        desc: 'Различити типови SUP плоча — стандарди израде, облици, величине и препоручене намене.'
        href: '/learn/sup'
      - title: 'Drop-Stitch наспрам традиционалне израде'
        desc: 'Упоредите Drop-Stitch и традиционалну израду SUP плоча по тежини, цени, издржљивости и крутости.'
        href: '/learn/drop-stitch-core'
  - title: 'Водич за надуване SUP плоче'
    tagline: 'Знање о надуваним SUP плочама'
    desc: 'Опширни водичи о надуваним SUP плочама — PVC материјали, Drop-Stitch израда, стандарди безбедности и најбоље праксе одржавања.'
    guides:
      - title: 'Водич кроз PVC материјале'
        desc: 'Дефинитивни водич кроз PVC материјале који се користе у изради надуваних SUP плоча.'
        href: '/learn/materials'
      - title: 'Како се праве надуване SUP плоче'
        desc: 'Производни процес — сечење материјала, спајање Drop-Stitch језгра, израда шавова, тестирање притиска и контрола квалитета.'
        href: '/learn/inflatable-technology'
      - title: 'SUP водич за безбедност'
        desc: 'Стандарди безбедности, носивост, правилно надувавање, провере пред полазак и процедуре у хитним случајевима.'
        href: '/learn/water-safety'
      - title: 'Одржавање SUP плоча'
        desc: 'Чишћење, чување, UV заштита и поправка надуваних SUP плоча.'
        href: '/v2/inflatable-sup-maintenance'
  - title: 'Знање о SUP плочама'
    tagline: 'Средиште за SUP плоче'
    desc: 'Технички водичи који обухватају типове SUP плоча, материјале, методе израде, одржавање и безбедност.'
    guides:
      - title: 'Типови SUP плоча'
        desc: 'Универзалне, туринг, јога, спортске и дечје SUP плоче — сазнајте разлике и изаберите праву.'
        href: '/learn/sup'
      - title: 'Drop-Stitch технологија'
        desc: 'Како хиљаде унутрашњих конца стварају круте надуване структуре под високим притиском.'
        href: '/learn/drop-stitch-core'
      - title: 'Референца материјала'
        desc: 'PVC денјер оцене, тежине тканина, UV отпорност и материјали морског квалитета објашњени.'
        href: '/learn/materials'
      - title: 'SUP водич за куповину'
        desc: 'Упоредите различите типове SUP плоча за различите намене и нивое вештина.'
        href: '/learn/sup'
  - title: 'SUP знање'
    tagline: 'Водичи за плоче за стојеће веслање'
    desc: 'Све о SUP плочама — надуване наспрам тврдих, димензије плоча, технологија материјала и стручни савети за све нивое вештина.'
    guides:
      - title: 'Надувана наспрам тврде SUP плоче'
        desc: 'Упоредите iSUP плоче и тврде епоксидне плоче по преносивости, издржљивости, перформансама и вредности.'
        href: '/learn/sup'
      - title: 'Водич кроз димензије SUP плоча'
        desc: 'Како дужина, ширина и дебљина утичу на стабилност, брзину и покретљивост.'
        href: '/learn/sup'
      - title: 'Одржавање и нега SUP плоча'
        desc: 'Савети за чишћење, чување, UV заштиту и поправку надуваних SUP плоча.'
        href: '/v2/inflatable-sup-maintenance'
      - title: 'Избор ваше прве SUP плоче'
        desc: 'Водич за почетнике за избор праве плоче за стојеће веслање према вашој тежини, нивоу вештине и намени.'
        href: '/learn/sup'
  - title: 'Водич за изнајмљивање'
    tagline: 'Управљање флотом за бизнисе изнајмљивања'
    desc: 'Водичи о изградњи и управљању флотама SUP плоча за изнајмљивање за плажне киоске, центре водених спортова и угоститељске објекте.'
    guides:
      - title: 'Изградња ваше флоте за изнајмљивање'
        desc: 'Како изабрати праве SUP плоче за ваш бизнис изнајмљивања — издржљивост, величине и ROI разматрања.'
        href: '/solutions/rental-operators'
      - title: 'Водич за одржавање флоте'
        desc: 'Кључне праксе одржавања за максимизирање животног века плоча и минимизирање застоја флотâ за изнајмљивање.'
        href: '/solutions/rental-operators'
  - title: 'Водич за одморалишта и угоститељство'
    tagline: 'Водене активности за угоститељство'
    desc: 'Водичи о лансирању и управљању SUP програмима за одморалишта, хотеле и дестинације на обали воде.'
    guides:
      - title: 'Покретање SUP програма у одморалишту'
        desc: 'Фактори које треба размотрити приликом покретања SUP активности за госте — величина флоте, особље и моделирање прихода.'
        href: '/solutions/resorts-hotels'
      - title: 'SUP наспрам других водених активности'
        desc: 'Упоредите SUP програме са другим воденим спортовима по искуству гостију и оперативној ефикасности.'
        href: '/learn/sup'
  - title: 'Водич за малопродају и дистрибуцију'
    tagline: 'SUP пословна партнерства'
    desc: 'Водичи о томе како постати SUP малопродајни партнер или дистрибутер — планирање залиха, позиционирање на тржишту и стратегије раста.'
    guides:
      - title: 'Како постати SUP малопродаја'
        desc: 'Како изабрати линије производа, управљати залихама и пласирати SUP плоче у вашој малопродајној радњи.'
        href: '/solutions/retail-partners'
      - title: 'SUP плоче за комерцијалне операције'
        desc: 'Зашто су надуване SUP плоче свестран производ за комерцијалне флоте, бизнисе изнајмљивања и професионалне оператере.'
        href: '/solutions/rental-operators'


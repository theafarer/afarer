meta:
  title: 'Затражите понуду — OEM производња SUP дасака | {SITE}'
  description: 'Затражите детаљну понуду за свој пројекат надувних SUP дасака. OEM/ODM производња, приватна марка или прилагођене флоте — одговарамо у року од 2 радна дана.'
  keywords:
    - 'затражите понуду за sup'
    - 'oem понуда за даске за веслање'
    - 'понуда sup фабрике'
    - 'цена надувних sup дасака'
hero_text:
  tagline: 'Добијте понуду'
  title: 'Затражите понуду<br />за ваш пројекат'
  subtitle: 'Реците нам о својим захтевима, а наш тим ће одговорити детаљном понудом у року од 2 радна дана.'
steps2_process:
  title: 'Како функционише'
  subtitle: 'Четири једноставна корака од упита до понуде.'
  items:
    - title: 'Корак 1: Поднесите своје захтеве'
      description: 'Попуните образац испод са типом производа, количином и спецификацијама. Што више детаља наведете, понуда ће бити прецизнија.'
      icon: tabler:file-text
    - title: 'Корак 2: Прегледавамо и саветујемо'
      description: 'Наш инжењерски тим прегледа ваше захтеве и може вас контактирати ради појашњења. Дајемо препоруке за конфигурацију производа и опције.'
      icon: tabler:users
    - title: 'Корак 3: Примите своју понуду'
      description: 'Добијате детаљну понуду која укључује цену по јединици, MOQ, рок испоруке, услове плаћања и опције транспорта. Обично у року од 48 сати.'
      icon: tabler:currency-dollar
    - title: 'Корак 4: Узорак и производња'
      description: 'Након прихватања понуде, прелазимо на производњу узорка (ако је применљиво) или директно на серијску производњу. Редовне информације током целог процеса.'
      icon: tabler:building-factory
content_form:
  tagline: 'Образац за понуду'
  title: 'Реците нам о свом пројекту'
  subtitle: 'Сва поља са * су обавезна.'
  contact_fields:
    firstName: 'Име'
    lastName: 'Презиме'
    companyName: 'Назив компаније'
    email: 'Е-пошта'
  fields:
    - name: 'Категорија производа'
      type: select
      options:
        - 'SUP даска'
        - 'Надувна SUP даска'
        - 'Надувна SUP даска'
        - 'Спасилачки прслук'
        - 'Поморска опрема'
        - 'Прилагођени OEM/ODM'
    - name: 'Примењеност'
      type: select
      options:
        - 'Центар за роњење'
        - 'Риболов'
        - 'Поморски туризам / одмаралиште'
        - 'Претрага и спасавање'
        - 'Влада / војска'
        - 'OEM / приватна марка'
        - 'Лично / рекреативно'
        - 'Друго'
    - name: 'Количина'
      type: text
      placeholder: 'нпр. 50 јединица'
    - name: 'Циљно тржиште'
      type: text
      placeholder: 'нпр. Европа, Северна Америка, Блиски исток'
    - name: 'Земља испоруке'
      type: text
      placeholder: 'нпр. Италија, УАЕ, САД, Аустралија'
    - name: 'Преференца материјала'
      type: select
      options:
        - 'Без преференце'
        - 'Поморски PVC (1100 dtex)'
        - 'Фиберглас труп'
        - 'Алуминијумски труп'
    - name: 'Захтев за погон'
      type: text
      placeholder: 'нпр. стандардна конфигурација весла, електрична пумпа, прилагођене боје'
    - name: 'Потребно прилагођавање'
      type: text
      placeholder: 'нпр. прилагођене боје, брендирање/логотип, паковање, специјални оков'
    - name: 'Временски оквир'
      type: text
      placeholder: 'нпр. испорука у року од 90 дана'
    - name: 'Додатни захтеви'
      type: textarea
      placeholder: 'Опишите своју примену, техничке спецификације или посебне захтеве — приложите референтне цртеже, спецификације или линкове ако су доступни'
    - name: 'Отпремите спецификацију'
      type: file
      placeholder: 'Отпремите свој лист спецификација, цртеж или референтни документ (PDF, DWG, DXF)'
    - name: 'Отпремите логотип / графички дизајн'
      type: file
      placeholder: 'Отпремите свој логотип или графички дизајн за прилагођено брендирање (AI, EPS, PNG)'
cta:
  title: 'Преферишете да разговарате путем е-поште?'
  subtitle: 'Пошаљите свој упит директно нашем продајном тиму и одговорићемо у року од 24 сата.'
  actions:
    - variant: primary
      text: 'Пошаљите нам директно е-пошту'
      href: /contact

  title: Изађите на воду са својим Afarer SUP-ом
  subtitle: Даске Afarer стижу до веслача у више од 50 земаља. Пронађите најједноставнији начин да дођете до своје — преко званичног дистрибутера у вашој близини или директно од тима Afarer.
channels:
  items:

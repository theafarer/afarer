intro: 'Труп је окосница сваке надувне SUP даске. Мора бити довољно лаган да ефикасно клизи, довољно чврст да издржи стеновите обале и довољно крут да сваки замах веслом претвори у кретање напред. Код Afarer-а, наш Студио за инжењеринг трупова комбинује напредно CAD моделирање, анализу коначних елемената (FEA) и деценије практичног искуства у дизајну дасака како би испоручио трупове оптимизоване за намењену дисциплину — а не генеричке облике преузете из каталога.'

content_html: |
  <h2>Где се чврстоћа сусреће са хидродинамиком</h2>
  <p>Радимо са три примарне конструкционе платформе — ојачана drop-stitch PVC језгра, ручно слагани фиберглас ламинати и ротационо обликовани полиетилен — и поседујемо инжењерски капацитет да сваку од њих дизајнирамо, симулирамо и валидирамо у кући.</p>

  <h2>Алати и стандарди за дизајн</h2>
  <p>Наше дигитално инжењерско окружење укључује:</p>
  <table>
    <thead><tr><th>Могућност</th><th>Софтвер / Алат</th><th>Примењ</th></tr></thead>
    <tbody>
      <tr><td>3D параметарско моделирање</td><td>SolidWorks Professional</td><td>Површина трупа, ојачање руба и уздужнице, распоред палубе, тачке за причвршћивање опреме</td></tr>      <tr><td>Анализа коначних елемената</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Мапирање напона, модална анализа, симулација судара/удара</td></tr>
      <tr><td>Рачунска динамика флуида</td><td>Ansys Fluent / Star-CCM+</td><td>Предвиђање хидродинамичког отпора, оптимизација поравнања</td></tr>
      <tr><td>Инжењеринг ламината</td><td>ESAComp / CADEC</td><td>Слагање фиберглас слојева, одабир језгра, процена тежине</td></tr>
      <tr><td>Симулација протока у калупу</td><td>Moldex3D</td><td>Предвиђање дебљине зида при ротационом обликовању</td></tr>
    </tbody>
  </table>

  <h2>Наш инжењерски ток рада</h2>
  <p>Сваки дизајн трупа, без обзира да ли је стандардни модел или потпуно прилагођен пројекат, прати ригорозан процес у пет фаза:</p>
  <ol>
    <li><strong>Концепт и прикупљање захтева</strong> — Састанемо се са вама како бисмо дефинисали тежину возача и терет, опсег брзине, способност на различитим стањима воде, захтеве транспорта и сву специјалну опрему за мисију (носачи на палуби, позиције за везивање терета, интеграција додатне опреме).</li>
    <li><strong>3D површинско моделирање и хидростатички прорачун</strong> — Облик трупа се моделира у SolidWorks-у и проверава на хидростатичку стабилност, расподелу запремине и момент исправљања помоћу уграђених алата за анализу.</li>
    <li><strong>Структурна FEA</strong> — Дефинишу се случајеви оптерећења: статички (возач + опрема), динамички (удари при слетању на талас при 5g) и насукавање (ударац у стеновиту обалу при 3 m/s). Прегледају се контуре напона; безбедносни фактор ≥ 2.5 је обавезан.</li>
    <li><strong>CFD оптимизација отпора</strong> — Труп се симулира при три стања оптерећења и пет брзина. Површина квашења, угао поравнања и резидуални отпор итеративно се смањују.</li>
    <li><strong>Преглед и пуштање дизајна</strong> — Комплетан инжењерски пакет (3D модел, FEA извештај, CFD извештај, процена тежине, књига слојева) прегледа наш виши инжењер пре пуштања прототипској радионици.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA дистрибуција напона — Труп туринг SUP даске (ојачано drop-stitch)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Безбедносни фактор при максималном терету</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Смањење отпора у односу на претходну генерацију</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Вршни притисак ударa о воду (гранична вредност дизајна)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Укупно FEA време рада у 2025. години</span>
      </div>
    </div>
  </div>

  <h2>Прилагођавање: ваш труп, ваша правила</h2>
  <p>Ниједна два веслача немају идентичне захтеве. SUP даска за риболов захтева широк, стабилан глизајући труп; туринг даска захтева труп за истиснину који максимизира клизање; сурф SUP даска захтева одзивне рубове и подешен rocker. Не форсирамо вашу примену у постојећи облик трупа. Дизајнирамо од ваше спецификације надаље.</p>
  <p>Примери недавних пројеката прилагођеног инжењеринга трупова:</p>
  <ul>
    <li>Продужена туринг SUP даска за карибског еко-тур оператера, са ојачаним прамцем за слетања на плажу (+15 % дебљине руба).</li>
    <li>Патролна SUP даска велике видљивости за управу луке, са интегрисаним носачима опреме и тактичким шинама.</li>
    <li>Експедициона туринг SUP даска за флоту за изнајмљивање, са ојачаним рубовима и додатним везовима за терет.</li>
  </ul>

  <h2>Наши инжењери</h2>
  <p>Студиом руководи виши инжењер са 14 година искуства у дизајну високо перформансних дасака, а подржавају га два механичка инжењера специјализована за FEA и CFD. Сва тројица имају дипломе напредног нивоа из поморског или машинског инжењерства са међународно признатих универзитета. Тим редовно објављује у индустријским часописима и представља рад на међународним конференцијама из области инжењерства перформансних спортова веслања.</p>

  <h2>Партнерство са нама на вашем следећем трупу</h2>
  <p>Од прве скице концепта до финалног извештаја о напонима, наш Студио за инжењеринг трупова ваш је партнер у стварању даске која није само направљена — већ инжењерски конструисана. Улажемо сате симулације унапред тако да сваки завар, сваки слој ламината и свака крива трупа постоје са разлогом.</p>
  <p>Без обзира да ли вам треба мања модификација постојећег модела или потпуно нов дизајн од нуле, спремни смо да разговарамо о вашим захтевима.</p>


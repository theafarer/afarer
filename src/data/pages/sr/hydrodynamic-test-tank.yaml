intro: 'Уобичајена је заблуда да је хидродинамичко тестирање резервисано за бродове на океанским пловидбама. У стварности, перформансе малог глисирајућег трупа — као што је надувана SUP плоча — једнако зависе од његовог облика испод воде као што танкер зависи од своје заобљене прамчане испупчености. Угао нагиба, омочена површина, стварање прскања и вентилација драматично утичу на клизање, брзину и удобност вожње. У оквиру бренда afarer радимо у посебном хидродинамичком испитном базену који нам омогућава да квантификујемо ове ефекте на моделу у размери — пре него што посветимо материјал и алате прототипу у пуној величини.'

content_html: |
  <h2>Зашто тестирати веслачку плочу у базену?</h2>
  <p>Тестирање на моделу у размери (обично 1:3 до 1:5) омогућава нам да брзо и исплативо побољшавамо облике трупа. Недеља дана у базену може дати исте податке о перформансама за које би били потребни месеци покушаја и грешака у пуној величини — а за делић трошка.</p>

  <h2>Спецификације објекта</h2>
  <table>
    <thead><tr><th>Параметар</th><th>Спецификација</th></tr></thead>
    <tbody>
      <tr><td>Димензије базена</td><td>35 m (L) × 3.5 m (W) × 1.8 m (D)</td></tr>
      <tr><td>Колица за вучу</td><td>Електрична са серво управљањем, максимална брзина 12 m/s (23 kn), прецизност брзине ± 0.5 %</td></tr>
      <tr><td>Генератор таласа</td><td>Типа клапне, програмабилна правилна и неправилна стања мора, Hs до 0.3 m на моделу у размери</td></tr>
      <tr><td>Инструментација</td><td>Шестокомпонентни динамометар (отпор, бочна сила, момент скретања), акцелерометри, инклинометри, сонде за таласе</td></tr>
      <tr><td>Прикупљање података</td><td>Узорковање на 1000 Hz по каналу, приказ у реалном времену + пакет за накнадну обраду</td></tr>
      <tr><td>Израда модела</td><td>Сопствено CNC фрезеровање и 3D штампа за моделе трупова до 1.8 m LOA</td></tr>
    </tbody>
  </table>

  <h2>Наш тест програм</h2>
  <p>Стандардни програм развоја трупа у нашем базену следи ову секвенцу:</p>
  <ol>
    <li><strong>Израда модела</strong> — Модел у размери 1:3.5 CNC фрезерује се од пене велике густине и ојачава стаклопластиком ради крутости. Тежина и центар гравитације подешавају се тако да одговарају услову пуног оптерећења скалираном по Фрудовом броју.</li>
    <li><strong>Пролази отпора</strong> — Модел се вуче при 8-10 брзина које обухватају радни опсег. Укупан отпор се мери и раставља на компоненту трења и резидуални отпор методом ITTC-1957.</li>
    <li><strong>Мерење нагиба и увлачења</strong> — Нагиб при кретању и увлачење бележе се при свакој брзини. Циљ је оптималан угао нагиба од 4-6° за глисирајуће трупове.</li>
    <li><strong>Испитивање трага</strong> — Попречни пресеци таласа мере се при две брзине ради процене отпора стварања таласа и идентификације међудејства попречних таласа која могу изазвати сметње на крми.</li>
    <li><strong>Понашање на таласима (опционално)</strong> — Пролази у челним и зањењујућим таласима у правилним таласима ради мерења додатног отпора, вертикалног убрзања и вероватноће удара о воду.</li>
    <li><strong>Анализа података и препоруке</strong> — Испоручује се комплетан извештај са упоредним графиконима, кривама брзина/снага и конкретним дизајн препорукама за труп у пуној величини.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Типични резултати теста у базену — Отпор у односу на брзину (туринг SUP труп, размера 1:3.5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Отпор модела у размери (N) при брзинама скалираним по Фрудовом броју. Предвиђање отпора у пуној величини прати ITTC-1978 метод предвиђања перформанси.</p>
  </div>

  <h2>Стручни тим</h2>
  <p>Нашим базеном рукује хидродинамичар са докторатом из механике флуида и 8 година искуства у базенима за вучу у великом европском поморском истраживачком институту. Он добија подршку техничара који припрема све моделе и инструментацију. Тим прати Препоручене процедуре ITTC (International Towing Tank Conference) како би се осигурало да је сваки тест поновљив, као и да се може пратити и међународно бранити.</p>

  <h2>Тестирање у базену за развој прилагођеног трупа</h2>
  <p>Наш базен се не користи само за трупове сопственог дизајна — редовно спроводимо тест програме за клијенте који желе да потврде прилагођени облик трупа или истраже проблем перформанси:</p>
  <ul>
    <li><strong>Поређење облика трупа</strong> — Два или више кандидатских облика трупа тестирају се под идентичним условима, пружајући објективно поређење отпора/брзине/стабилности ради информисаног избора дизајна.</li>
    <li><strong>Оптимизација додатака</strong> — Конфигурације пераја, профили рубних трака и варијанте закривљења могу се тестирати у различитим комбинацијама ради квантификовања њиховог појединачног доприноса смањењу отпора.</li>
    <li><strong>Студија ефикасности клизања</strong> — Подаци о отпору претварају се у криву ефикасности клизања, омогућавајући вам да уравнотежите запремину трупа, закривљење и крутост за циљану брзину веслања и носивост.</li>
  </ul>

  <h2>Зашто тестирати са нама?</h2>
  <p>Не дајемо вам само скуп сирових бројки. Наши извештаји преводе податке из базена у применљиве инжењерске препоруке: „Додајте 8 mm закривљења на прамцу да смањите омочену површину при крстарећој брзини“, „Смањите закривљење на крми за 3° да продужите водену линију при туринг брзини“ или „Померите најширу тачку 150 mm уназад ради бољег држања правца“. Одлазите са јасним разумевањем шта треба променити и зашто.</p>
  <p>Наш базен је такође доступан за независно тестирање треће стране на бази накнаде за услугу. Ако развијате труп и желите непристрасну, професионално спроведену хидродинамичку процену, радо примамо ваш упит.</p>


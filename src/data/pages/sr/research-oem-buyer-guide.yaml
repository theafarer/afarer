  subtitle: 'Читање од 12 минута'

content_html: |
  <h2>1. Предквалификација: На шта обратити пажњу код фабрике</h2>

  <h3>Сертификати усклађености</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Систем управљања квалитетом</li>
    <li><strong>CE сертификација</strong> – Проверите број нотификованог тела</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Ревизије социјалне усклађености</li>
    <li><strong>REACH / RoHS</strong> – Изјаве о усклађености материјала</li>
  </ul>

  <h3>Производне могућности</h3>
  <ul>
    <li>Ткање Drop-Stitch језгра у сопственој производњи наспрам уговарања са спољним извођачима</li>
    <li>Линија за PVC премазивање / ламинање</li>
    <li>Опрема за RF заваривање и заваривање топлим ваздухом</li>
    <li>Сопствена израда калупа (CNC обрада)</li>
    <li>Испитна лабораторија (тестирање притиска, UV старење, тестирање затезања)</li>
  </ul>

  <h3>Верификација искуства</h3>
  <ul>
    <li>Године у производњи надуваних пловила (минимум 5+ година)</li>
    <li>Број инжењера у сталном запослењу</li>
    <li>Постојећи OEM/ODM клијенти (затражите референце)</li>
    <li>Дестинације извоза – да ли већ шаљу на ваше циљно тржиште?</li>
  </ul>

  <h2>2. Протоколи контроле квалитета</h2>
  <p>Улазна контрола материјала: затезна чврстоћа (ASTM D751 или ISO 1421), отпорност на цепање (ASTM D2261 или ISO 4674), чврстоћа лепљења, спорадичне провере UV старења.</p>
  <p>Контрола у процесу: надзор чврстоће шавова на сваких 50 јединица, верификација момента вентила, провере густине Drop-Stitch конца, димензионалне провере према CAD цртежима.</p>
  <p>Завршни преглед: 100% тест задржавања надувавања (24 сата, максимум 5% пада), визуелни преглед, тест функције вентила, тестирање случајних узорака (AQL 2.5 или 4.0 према ISO 2859).</p>

  <h2>3. Контрольна листа документације о усклађености</h2>
  <ul>
    <li>Изјава о усклађености (DoC) уз упуту на одговарајућу EU директиву</li>
    <li>CE сертификат од нотификованог тела</li>
    <li>Извештај о тестирању од акредитоване лабораторије</li>
    <li>Безбедносни листови материјала (MSDS)</li>
    <li>Изјава о усклађености са REACH прописима</li>
    <li>Списак материјала са трасабилношћу добављача</li>
    <li>Извештај о инспекцији фабрике</li>
  </ul>

  <h2>4. Преговарање о MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Тип производа</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Стандардни MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Распон за преговоре</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP плоче</td><td class="p-3 border">50 – 100 јединица</td><td class="p-3 border">5 – 10 јединица (пробно)</td></tr>
      <tr><td class="p-3 border">Кајаци</td><td class="p-3 border">50 – 100 јединица</td><td class="p-3 border">5 – 10 јединица (пробно)</td></tr>
      <tr><td class="p-3 border">Надуване SUP плоче</td><td class="p-3 border">50 – 100 јединица</td><td class="p-3 border">2 – 5 јединица (пробно)</td></tr>
      <tr><td class="p-3 border">Безбедносна опрема / Опрема</td><td class="p-3 border">200 – 500 јединица</td><td class="p-3 border">50 – 100 јединица (пробно)</td></tr>
    </tbody>
  </table>

  <h2>5. Логистика и испорука</h2>
  <p>Чести Incoterms услови: <strong>FOB</strong> (Фабрика испоручује до луке поласка – најчешћи), <strong>EXW</strong> (Купац организује сав превоз од врата фабрике), <strong>CIF</strong> (Фабрика плаћа терет и осигурање до луке одредишта).</p>
  <p>Надувани производи су мале тежине и велике запремине – волуменска тежина (DIM) често одређује трошак испоруке. Затражите паковање у вакууму да смањите запремину за 50–60%. Поморски терет из Кине до EU: 25–35 дана; до западне обале САД: 15–20 дана.</p>

  <h2>6. Честе грешке</h2>
  <ul>
    <li><strong>Без ревизије фабрике:</strong> Увек спроведите или наручите ревизију треће стране (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Само усмене спецификације:</strong> Детаљан технички лист спецификација потписан од обе стране</li>
    <li><strong>Прескакање одобрења узорака:</strong> Писмена потврда узорака пре серијске производње</li>
    <li><strong>Без контроле квалитета током производње:</strong> Инспекција треће стране током производње (DUPRO) и пре испоруке (PSI)</li>
    <li><strong>Игнорисање усклађености:</strong> Проверите CE/UKCA сертификацију пре производње</li>
  </ul>

  <h2>7. Зашто afarer</h2>
  <p>afarer производи OEM/ODM надувана пловила од 2012. године. Са погоном од 12,000 m&sup2; сертификoваном по ISO 9001, са 25+ инжењера и CE сертификацијом свих линија производа, испуњавамо сваки критеријум из овог водича. Нудимо пробне MOQ вредности за нове партнере и комплетне пакете документације о усклађености.</p>


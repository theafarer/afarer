  <h2>Шта је обухваћено</h2>
  <h3>Главна тканина цеви (5 година)</h3>
  <p>afarer гарантује главну тканину палубе против погоршања порозности које значајно угрожава способност производа да одржи радни притисак надувавања. Ово се примењује на PVC пресвучену тканину и све друге материјале тканине палубе коришћене у производњи.</p>

  <h3>Структурни интегритет фиберглас трупа (5 година)</h3>
  <p>За производе са трупом од фиберглас ојачане пластике (FRP), основна композитна структура је гарантована против структурног отказа услед дефеката у материјалима или изради.</p>

  <h3>Способност задржавања ваздуха шавова надувне цеви (5 година)</h3>
  <p>Шавови надувних цеви, тамо где су спојени током производње, гарантовани су против производних дефеката који резултирају значајним цурењем ваздуха кроз шав. Периодична контрола и одржавање одговарајућих притисака надувавања представљају услов обухвата.</p>

  <h3>Функционалност вентила за надувавање (5 година)</h3>
  <p>Вентили за надувавање ваздухом које је оригинално инсталирао afarer гарантовани су против производних дефеката у материјалима или изради који спречавају вентил да задржи ваздух како је дизајниран.</p>

  <h3>Опрема инсталирана у фабрици (1 година)</h3>
  <p>Компоненте и оков које производи afarer и који су оригинално инсталирани у фабрици гарантовани су против дефеката у материјалу и изради у трајању од једне године. Ово искључује ставке трећих страна, које су покривене само гаранцијама својих произвођача.</p>

  <h2>Шта није обухваћено</h2>
  <ul>
    <li>Козметички недостаци укључујући промену боје, мрље, изблеђивање, кређање или било коју промену изгледа</li>
    <li>Убоди, резови, кидања, цепања или друга физичка оштећења</li>
    <li>Пуцање по површини, пукотине, хабање, огреботине или пропадање услед трења или контакта</li>
    <li>Деградација услед излагања UV светлости, атмосферским утицајима или временским условима</li>
    <li>Оштећења услед контакта са горивима, растварачима, киселинама, алкалијама или хемикалијама</li>
    <li>Оштећења услед немара, неодговарајуће употребе, злоупотребе, несреће или нормалног хабања</li>
    <li>Проблеми површине gelcoata или боје (пликовање, пуцање, промена боје, изблеђивање)</li>
    <li>Оштећења услед удара, напрезања, неодговарајуће подупирања или транспорта приколицом</li>
    <li>Оштећења услед погрешног надувавања/испуштања ваздуха или употребе неодобрених уређаја за надувавање</li>
    <li>Опрема, компоненте или системи трећих страна (покривени гаранцијама својих произвођача)</li>
  </ul>

  <h2>Обавеза произвођача и правни лек</h2>
  <p>Једина и искључива обавеза afarera је поправка или замена, по избору afarera, било које компоненте за коју се утврди да има дефект у материјалима или изради и која је обухваћена овом гаранцијом. Поправке или замене обавља afarer или његова одређена овлашћена сервисна установа. За компоненте које су поправљене или замењене гаранција важи само за неистекли део оригиналног гаранцијског периода.</p>

  <h2>Услови гаранције</h2>
  <ul>
    <li><strong>Регистрација:</strong> Производ мора бити правилно регистрован као што је прописано гаранцијским условима.</li>
    <li><strong>Одржавање:</strong> Производ мора се одржавати у складу са објављеним смерницама afarera, укључујући периодичну контролу и одржавање одговарајућих притисака надувавања.</li>
    <li><strong>Сарадња:</strong> Купац мора у потпуности и благовремено сарађивати са afarer-ом у свим питањима која се тичу гаранцијских потраживања.</li>
    <li><strong>Оригинални купац:</strong> Ова гаранција пружа се искључиво оригиналном крајњем кориснику и није преносива.</li>
  </ul>

  <h2>Комерцијална употреба</h2>
  <p>Ако се производ користи у комерцијалне, владине, непрофитне, чартер, закупне, инструкторске или било које друге сврхе осим приватне рекреативне употребе, гаранцијски период за све компоненте смањује се на једну (1) годину од оригиналног датума малопродајне куповине. Употреба у тркама, брзинским или издржљивосним такмичењима одмах и неповратно поништава гаранцију у потпуности.</p>

  <h2>Како поднети гаранцијско потраживање</h2>
  <p>Контактирајте afarer или вашег овлашћеног дилера са доказом о куповини и детаљним описом проблема. afarer ће размотрити потраживање и доставити упутства за контролу и сервисирање.</p>
  <p>За упите у вези са гаранцијским сервисом, молимо контактирајте нас преко наше <a href="/contact" class="text-sky-600 underline">странице за контакт</a> са вашим бројем поруџбине и детаљима производа.</p>

  <h2>Ставке трећих страна</h2>
  <p>Опрема, компоненте или системи које производе треће стране (чак и ако их је инсталирао afarer) покривени су искључиво гаранцијом коју нуди њихов произвођач. afarer изричито одбија сваку гаранцијску одговорност за такве ставке трећих страна.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Ова изјава о гаранцији представља резиме потпуне Ограничене произвођачке гаранције afarera. Потпуни правни документ о гаранцији управља свим гаранцијским условима. Спецификације су подложне променама без претходне најаве. afarer је бренд којим управља Aquafarer LLC (САД).
  </p>

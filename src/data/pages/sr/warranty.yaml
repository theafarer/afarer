body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Ова ограничена гаранција примењује се на нове надувне производе за воде са afarer брендом купљене директно од afarera, од овлашћеног afarer дилера или продавца. Датум ступања на снагу је провериви датум оригиналне малопродајне куповине.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Обухват и трајање гаранције</h2>

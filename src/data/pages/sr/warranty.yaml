    </div>
    <p class="text-xs text-gray-500 mt-4">*Комерцијална, владина, чартер, закупна, изајмљивачка или инструкторска употреба смањује гаранцију на 1 годину. Употреба у тркама или такмичењима у потпуности поништава гаранцију.</p>

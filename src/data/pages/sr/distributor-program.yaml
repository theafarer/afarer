faqs:
  title: 'Партнерство по земљи — FAQ'
  subtitle: 'Питања која озбиљни државни партнери постављају пре пријаве.'
  items:
    - title: 'Шта заиста значи модел једна земља — један дистрибутер?'
      description: 'afarer именује једног овлашћеног дистрибутера са ексклузивним правима за дефинисану територију. Не продајемо из наших глобалних или регионалних канала у заштићену земљу. Ваше власништво над територијом важи све док се испуњава Уговор о дистрибуцији.'
    - title: 'Да ли је територија ексклузивна заувек?'
      description: 'Не. Ексклузивност је условна, не вечита. Одржава се потписаним Уговором о дистрибуцији, завршетком ваше прве поруџбине, годишњим циљевима куповине, локалним залихама, способношћу услуга након продаје и континуираним улагањем у тржиште. Ако се ови услови не испуне, територија може бити поново преговарана или додељена другом партнеру.'
    - title: 'Колика је минимална прва поруџбина?'
      description: 'Државни и регионални дистрибутери почињу од 100–300 јединица; овлашћени дилери од 30–50 јединица; пробне поруџбине од 10–30 јединица омогућавају вам да прво потврдите тржиште (пробне и узорне поруџбине не носе заштиту територије). Прилагођени програми и програми приватне ознаке прате посебне MOQ вредности наведене у нивоима изнад.'
    - title: 'Која подршка је укључена у програм подршке са 10 модула?'
      description: 'Нивои и квалификације, заштита територије, MOQ / цене / годишњи попусти, инвентар и извршење поруџбина, маркетиншки материјали и заједнички фондови за тржиште, обука о производима / продаји / техници, резервни делови и услуге након продаје, регистрација гаранције, портал за партнере, као и технички листови производа, библиотека маркетиншких материјала, распоред годишњих попуста и листе испоруке и паковања.'
    - title: 'Како ме afarer штити од сукоба канала?'
      description: 'Свака територија има тачно једног овлашћеног дистрибутера. Упити и директне поруџбине из вашег региона усмеравају се кроз вас, обрасци са веб-сајта прослеђују се локалном партнеру тамо где он постоји, а глобални тим ескалира само када партнер не одговори.'
    - title: 'Који су услови испоруке и плаћања?'
      description: 'Поруџбине се шаљу FOB Ћингдао са комплетном извозном документацијом. Производне поруџбине су 30% аванса и 70% пре испоруке; пробне и узорне поруџбине се плаћају унапред. Стандардно време испоруке је 30–45 радних дана, уз 15–20 радних дана за пробне серије.'
    - title: 'Како се пријављујем?'
      description: 'Пошаљите пријаву преко контакт обрасца са детаљима о тржишту. Прегледамо усклађеност са тржиштем, малопродајно присуство и логистичке могућности, а затим одговарамо у року од 3 радна дана са следећим корацима и узорком Уговора о дистрибуцији.'

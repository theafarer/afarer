meta:
  title: 'Поморска стручност — Инжењеринг у сваком трупу | {SITE}'
  description: 'Декеније поморског инжењерства у сваком трупу. afarer влада drop stitch технологијом, поморским PVC-ом и професионалним дизајном надувних SUP дасака.'
  keywords:
    - 'поморски инжењеринг'
    - 'произвођач надувних SUP дасака'
    - 'производња дасака за веслање'
hero:
  tagline: 'Поморска стручност'
  title: 'Декеније поморског инжењерства<br />у сваком трупу'
  subtitle: 'afarer комбинује дубоку науку о материјалима, прецизну производњу и тестирање у стварним условима како би произвео пловила која имају перформансе када је најважније.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'afarer поморски инжењерски и R&D тим на раду'
expertise_materials:
  tagline: 'Наука о материјалима'
  title: 'Избор правог материјала<br />за сваку примену'
  subtitle: 'Радимо са два кључна материјала — сваки одабран за конкретне случајеве употребе и захтеве перформанси.'
  columns: 3
  items:
    - title: 'Поморски PVC'
      description: 'PVC тканина од 1100 денера — наш најсвестранији материјал. UV стабилизована, отпорна на хабање и у складу са REACH. Идеална за SUP даске где су тежина и исплативост важни.'
      icon: tabler:droplet
    - title: 'Фиберглас и полиетилен'
      description: 'SUP даске ламиниране фибергласом за премиум крутост и клизање. Ротационо обликован полиетилен за тешку употребу у изнајмљивању и спасавању која захтева максималну отпорност на удар.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Производни капацитети'
  title: 'Прецизна производња<br />у сваком кораку'
  subtitle: 'Наш објекат од 12,000 m² опремљен је специјализованом машинеријом за сваку фазу производње.'
  columns: 2
  items:
    - title: 'CNC сечење'
      description: 'Рачунарски контролисано сечење обезбеђује прецизне, поновљиве панеле тканине са минималним отпадом. Сваки део уклапа се тачно како је дизајнирано.'
      icon: tabler:cpu
    - title: 'Заваривање високе фреквенције'
      description: 'Индустријско HF заваривање ствара шавове јаче од основног материјала. Доследна контрола температуре и притиска обезбеђује непропусне заптивке у свакој производној серији.'
      icon: tabler:bolt
    - title: 'Монтажа drop-stitch језгра'
      description: 'Хиљаде полиестарских конца повезује горње и доње слојеве тканине, омогућавајући надувавање под високим притиском (15-20 PSI) за круте, стабилне SUP даске.'
      icon: tabler:building-arch
    - title: 'Тестирање притиска'
      description: 'Сваки надувни производ тестира се на притисак пре отпреме. Даске се тестирају на 1.25x номиналног притиска — ако издржи тамо, издржаће на води.'
      icon: tabler:wind
    - title: 'Тестирање чврстоће шавова'
      description: 'Случајни узорци из сваке производне серије пролазе деструктивно тестирање чврстоће шавова. Резултати се бележе и могу се пратити до конкретних производних серија.'
      icon: tabler:files
    - title: 'Тестирање на води'
      description: 'Сваки модел пролази испитивање на мору пре сертификације. Тестирање у стварним обалским условима потврђује перформансе, понашање и стабилност.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Дизајн и инжењерство'
  title: 'Конструисано за стварне услове'
  subtitle: 'Наша филозофија дизајна полази од тога како ће се даска користити — а затим гради инжењерство око тог случаја употребе.'
  items:
    - title: 'Дизајн перформансних трупова'
      description: 'Сваки облик трупа подешен је за своју намену — прамци за истиснину ради клизања на турингу, додатни rocker за агилност на таласима, равни стабилни профили за риболов и јогу.'
    - title: 'Drop-stitch безбедност'
      description: 'Свака даска има круто drop-stitch језгро са ојачаним рубовима. Ако је неки део оштећен, високо затезна drop-stitch структура одржава даску употребљивом.'
    - title: 'Ергономски распоред палубе'
      description: 'Зонирање подлоге палубе, положај ручке за ношење и тачке монтаже дизајнирани су око удобности возача током дуге употребе — било да је реч о турингу, риболову или патроли.'
    - title: 'Прилагођена конфигурација'
      description: 'Боје рубова, конфигурација подлоге палубе, носачи опреме, капацитет терета — сваки модел се може прилагодити специфичним оперативним захтевима.'

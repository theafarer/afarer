faqs:
  title: 'Ко-бренд — честа питања'
  subtitle: 'Како функционише Afarer ко-брендирање и чиме се разликује од OEM-а и приватне марке.'
  items:
    - title: 'Да ли је ко-брендирање исто што и OEM или приватна марка?'
      description: 'Не. Afarer више не води отворени OEM/приватни програм. Ко-бренд производи остају Afarer производи — дизајнирани, конструисани, проверени и подржани брендом Afarer. Ваш идентитет се појављује као ко-бренд, а не као производ треће стране без бренда.'
    - title: 'Ко може да започне ко-бренд пројекат?'
      description: 'Квалификовани бизниси водених спортова: постојећи партнери по земљама, веслачки клубови, одмаралишта и хотели, организатори догађаја и заједнице. Пошаљите нам кратак опис пројекта и потврдићемо применљивост пре почетка радова на дизајну.'
    - title: 'Да ли ће ко-брендирање бити у сукобу са мојим дистрибутером за земљу?'
      description: 'Не. Модел једна земља — један дистрибутер има предност. Ко-бренд колекције се координишу са локалним партнером за земљу где он постоји, тако да се ниједан паралелни или конкурентски бренд не појављује у оквиру заштићене територије.'
    - title: 'Колика је минимална поруџбина за ко-бренд колекцију?'
      description: 'Пилот колекције почињу од 30–50 јединица. Стандардне колекције су 50–100 јединица; велика или мулти-регионална издања су 100+ јединица. Рокови прилагођеног развоја договарају се по пројекту.'
    - title: 'Шта чини Afarer квалитет, а што допринос партнера?'
      description: 'Afarer је власник дизајна производа, инжењеринга, материјала, конструкције, контроле квалитета и гаранције. Партнери доприносе концептом колекције, именовањем, бојама, графичким уносом и изласком на тржиште. Тиме се одржава један стандард квалитета на води.'
    - title: 'Како се пријављујем?'
      description: 'Попуните упитни образац за ко-бренд са својим бизнисом, тржиштем и идејом за колекцију. Прегледамо усаглашеност, а затим одговарамо у року од 3 радна дана са предлогом и Споразумом о ко-бренд пројекту.'

how_to_choose:
  title: Како изабрати одговарајућу величину
  cards:
    - title: SUP даске
      description: Изаберите дужину на основу своје тежине и намењене употребе. Шире даске (32"+) пружају више стабилности. Дуже даске (11-12 ft) боље држе правац за туре. Тежи веслачи требају даске веће запремине.
    - title: Туринг SUP даске
      description: Дуже даске (11–12 ft) најбоље су за преваљивање дистанце и туре. Шире даске (32"+) пружају више стабилности. Проверите носивост за укупно оптерећење укључујући опрему.
    - title: All-around SUP даске
      description: Изаберите дужину према тежини возача и намењеној употреби. All-around даске служе за рекреацију, фитнес и јогу. Мање даске су покретљивије.

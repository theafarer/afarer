services:
  - title: 'Дизајн и инжењерство производа'
    description: 'Наш тим за истраживање и развој ради са вашим концептом или спецификацијом на развоју CAD цртежа, 3D модела и прототипова. Нудимо дизајн калупа, оптимизацију облика трупа и смернице за избор материјала.'
  - title: 'Прилагођено брендирање и графике'
    description: 'Дигитална штампа у пуним бојама, сито-штампа, рељефна обрада и опције етикета. Развијамо графике на поду специфичне за бренд, брендирање цеви и паковање спремно за малопродају.'
  - title: 'Прилагођавање материјала и спецификација'
    description: 'Изаберите између PVC (стандардни, еколошки, тешко запаљиви), Drop-Stitch и хибридних конструкција. Прилагођене боје цеви, тежине тканине и опције ојачања.'
  - title: 'Паковање и логистика'
    description: 'Прилагођено малопродајно паковање, кутије за приватне ознаке, вакуум паковање, палетизација и утовар контејнера. Доступни услови испоруке FOB Ћингдао, CIF или DDP.'


why_us:
  - title: 'Вертикална интеграција'
    description: 'Поседујемо нашу фабрику, калупе и ланац снабдевања — без посредника, без подизвођача. То нам даје контролу над квалитетом, трошковима и испоруком.'
  - title: 'Двострука сертификација'
    description: 'ISO 9001 управљање квалитетом и BSCI социјална усаглашеност. Извештаји о аудиту фабрике доступни на захтев.'
  - title: 'CE усаглашеност'
    description: 'Сви стандардни модели носе CE 2013/53/EU сертификат. Прилагођени модели могу бити CE сертификовани кроз наш устаљени процес.'
  - title: 'Низак MOQ'
    description: 'Започните са свега 5 јединица за стандардне моделе. Помажемо брендовима у успону да лансирају без преоптерећења залихама.'

intro: 'afarer нуди свеобухватне OEM и ODM услуге за брендове, дистрибутере и владине агенције широм света. Са 10+ година извозног искуства и фабриком од 12,000 m² сертификованом према ISO 9001 и BSCI, обављамо све — од дизајна производа и развоја калупа до производње у пуном обиму, паковања и логистике.'


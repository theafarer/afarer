      href: '/learn/materials/'
    - title: 'Водич за величину SUP плоче'
      description: 'Пронађите праву дужину, ширину и запремину плоче за вашу тежину, вештину и стил веслања.'
      icon: 'tabler:ruler'
      href: '/size-guide/'

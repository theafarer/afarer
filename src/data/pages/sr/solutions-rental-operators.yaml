meta:
  title: 'Добављач опреме за изнајмљивање SUP плоча и решења за флоте | {SITE}'
  description: 'Добављач опреме за изнајмљивање SUP плоча за оператере изнајмљивања. Комерцијалне SUP плоче високе ротације конструисане за свакодневну употребу — UV отпоран PVC, ојачани шавови, материјали који се брзо суше. Развијте ваш бизнис изнајмљивања са afarer.'

hero:
  tagline: 'Оператери изнајмљивања'
  title: 'Развијте ваш бизнис изнајмљивања<br />са самопоуздањем'
  subtitle: 'Добављач опреме за изнајмљивање SUP плоча за оператере изнајмљивања. SUP плоче високе ротације конструисане за свакодневно изнајмљивање, 365 дана годишње. Ваш приход никада не одмара.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 'Заузет киоск за изнајмљивање са SUP плочама спремним за госте'

features:
  title: 'Направљено за тешке услове изнајмљивања'
  subtitle: 'Свака плоча је конструисана за 500+ циклуса изнајмљивања уз минимално одржавање.'
  items:
    - title: '500+ циклуса изнајмљивања'
      description: 'Тестирано да издржи свакодневну употребу у сланој води, на сунцу и у песку.'
      icon: 'tabler:shield-check'
    - title: 'Тканина отпорна на UV'
      description: 'Без блеђења или деградације након 1 године чувања на отвореном.'
      icon: 'tabler:sun'
    - title: 'Ојачани шавови'
      description: '3x чвршћи од стандардне конструкције надуваних плоча.'
      icon: 'tabler:layers-intersect'
    - title: 'Материјали који се брзо суше'
      description: 'Плоче спремне за следеће изнајмљивање за мање од 30 минута.'
      icon: 'tabler:droplet'
    - title: 'Складиштење слагањем'
      description: 'Дизајн који штеди простор — чувајте 40% више плоча на истој површини.'
      icon: 'tabler:stack'
    - title: 'Величине означене бојама'
      description: 'Особље тренутно узима праву плочу захваљујући величинама означеним бојама.'
      icon: 'tabler:color-swatch'


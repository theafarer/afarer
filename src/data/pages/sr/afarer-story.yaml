timeline:
  - year: '2012'
    title: 'Основа производње опреме за воде'
    body: 'afarer је почео као специјализована радионица за пловила у Ћингдаоу у Кини, посвећена занатству и производњи пловила. Рани фокус био је изградња поузданих надувних производа кроз практично инжењерско искуство и производну дисциплину.'
  - year: '2015'
    title: 'Први извоз и CE сертификација'
    body: 'Прве извозне поруџбине стигле су у Јапан и Кореју. CE сертификација је остварена за кључне линије производа, чиме је обележен улазак afarer-а на међународна тржишта. Компанија је почела да опслужује комерцијалне и рекреативне кориснике ван Кине.'
  - year: '2018'
    title: 'Проширење фабрике'
    body: 'Преселили смо се у производни објекат од 12,000 m². Додали смо RF линије за заваривање и капацитет drop-stitch производње, што је омогућило производњу у већем обиму и побољшане системе контроле квалитета.'
  - year: '2020'
    title: 'Оснивање R&D центра'
    body: 'Отворен је посвећен R&D центар са лабораторијом за PVC тканину, хидродинамичким тест базеном и CAD/FEA симулацијским студијом. Развој производа проширен је на лагану конструкцију, побољшану издржљивост и дизајн усмерен на корисника.'
  - year: '2022'
    title: 'Сертификација и глобални раст'
    body: 'Остварена је ISO 9001 сертификација. Проширени смо на 14 R&D инжењера и 200+ радника. Производи су стигли до купаца широм Европе, Америке и Азијско-пацифичког региона кроз партнерства са дистрибутерима и ко-брендовима.'
  - year: '2024'
    title: 'Студио за иновације и дизајн'
    body: 'Покренут је студио за дизајн и иновације пуне услуге за прилагођене ко-бренд пројекте, од концепта до производње. Учвршћене су професионалне поморске примене, укључујући спасилачке, комерцијалне и владине уговоре.'
  - year: '2026'
    title: 'Изградња будућности истраживања вода'
    body: 'Данас afarer наставља да развија SUP системе и опрему за воде — повезујући људе и организације са водама света. Преко 50 обслужених земаља, годишњи капацитет од 15,000+ јединица.'

content_founding:
  tagline: 'Почетак'
  title: 'Рођено на обали'
  subtitle: 'afarer је почео у обалској радионици у Ћингдаоу са једном даском и визијом: да гради надувна пловила способна за стварне услове на води.'
  paragraphs:
    - 'Године 2012. наши оснивачи су уочили празнину на тржишту — већина надувних пловила била је или приступачна али непоуздана, или високог квалитета али недозвољиво скупа. Веровали су да има места за произвођача који нуди и квалитет и вредност.'
    - 'Први труп изграђен је ручно, тестиран у локалним водама и усавршаван на основу стварних повратних информација рибара и малих комерцијалних оператора. Тај круг повратних информација — гради, тестирај, слушај, побољшај — и данас остаје у срж наше инжењерске филозофије.'
    - 'До 2015. године глас се проширио ван Ћингдаоа. Међународни дистрибутери почели су да траже узорке. Оно што је почело као локална радионица постајало је глобални добављач.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'рана afarer производна радионица и производња'

content_growth:
  tagline: 'Раст и иновације'
  title: 'Од радионице до објекта од 12,000 m²'
  subtitle: 'Континуирана улагања у људе, опрему и процесе претворила су afarer у савремени производни погон опреме за воде.'
  paragraphs:
    - 'Како је потражња расла, растао је и наш објекат. Проширили смо се из мале радионице у фабрику од 12,000 m² са посвећеним производним линијама за SUP даске и опрему.'
    - 'Уложили смо у CNC машине за сечење, опрему за заваривање високе фреквенције, drop stitch производне линије и свеобухватне тестне уређаје — што нам омогућава да контролишемо сваки аспект квалитета производње.'
    - 'Данас наш тим од 200+ људи укључује инжењере за воде, стручњаке за материјале, специјалисте контроле квалитета и веште занатлије — од којих су многи са afarer-ом од раних дана.'

philosophy:
  tagline: 'Филозофија бренда'
  title: 'Инжењерство слободе на води'
  body: 'Слобода на води није само кретање. Она представља откривање нових места, стварање искустава на отвореном, повезивање људи са природом и омогућавање професионалних мисија. Инжењерство чини ту слободу могућом.'
  pillars:
    - title: 'Поузданост на првом месту'
      body: 'Водена окружења захтевају поверење. afarer производи дизајнирани су око стабилности, издржљивости, безбедности и доследних перформанси.'
    - title: 'Дизајн усмерен на човека'
      body: 'Производи треба да служе људима, а не технологији. Свака одлука о дизајну почиње разумевањем како људи користе пловила, где истражују и са којим изазовима се суочавају.'
    - title: 'Приступачно истраживање'
      body: 'Вода не треба да припада само експертима. afarer ствара опрему која омогућава већем броју људи да безбедно доживе реке, језера, океане и обална окружења.'
    - title: 'Континуиране иновације'
      body: 'Иновација није само стварање нових производа. То је побољшавање сваког детаља — материјала, структура, производње и корисничког искуства.'

engineeringDna:
  tagline: 'Инжењерски ДНК'
  title: 'Како afarer ствара производе'
  areas:
    - title: 'Наука о материјалима'
      body: 'afarer се фокусира на одабир одговарајућих материјала за различита водена окружења. Кључни критеријуми укључују отпорност на хабање, UV отпорност, стабилност притиска и дугорочну издржљивост.'
      items: ['Отпорност на хабање', 'UV отпорност', 'Стабилност притиска', 'Дугорочна издржљивост']
    - title: 'Структурно инжењерство'
      body: 'Надувна пловила захтевају прецизан баланс између крутости, тежине, преносивости и стабилности. afarer инжењеринг фокусира се на оптимизацију ових фактора кроз кључну drop-stitch технологију и напредну конструкцију шавова.'
      items: ['Крутост', 'Оптимизација тежине', 'Преносивост', 'Стабилност']
    - title: 'Производна прецизност'
      body: 'Сваки производ пролази кроз контролисане процесе: припрема материјала, прецизно сечење, заваривање и спајање, монтажа, контрола квалитета и провера перформанси.'
      items: ['Припрема материјала', 'Прецизно сечење', 'Заваривање и спајање', 'Монтажа и контрола квалитета']
    - title: 'Инжењерство корисничких сценарија'
      body: 'Производи се развијају око стварних примена — рекреација, авантура и професионална употреба — чиме се обезбеђује да сваки дизајн испуњава специфичне захтеве намењеног окружења.'
      items: ['Рекреација', 'Авантура', 'Професионално', 'Комерцијално']


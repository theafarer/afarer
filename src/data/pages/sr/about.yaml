features3_what_we_build:
  title: 'Шта градимо'
  subtitle: 'Почели смо у обалској радионици са једном даском и тврдоглавим уверењем: поморски производи треба да буду инжењерски грађени као да су важни, јер јесу. Данас шаљемо у преко 40 земаља, али сваки труп и даље пролази кроз исте руке које су основале компанију.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'SUP даске'
      description: 'Надувне SUP даске од 9 ft до 12 ft. Дизајниране за туринг, јогу, риболов и породичну употребу.'
      icon: tabler:ship
    - title: 'Надувни SUP-ови'
      description: 'PVC надувне SUP даске од 9 ft до 12 ft. Лаке, чврсте и лаке за складиштење.'
      icon: tabler:rowing
    - title: 'Премиум SUP пакети'
      description: 'Компактни SUP-ови високих спецификација прилагођено изграђени према вашем бренду или захтевима флоте.'
      icon: tabler:crown


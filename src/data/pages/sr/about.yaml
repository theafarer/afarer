  items:
    - title: 'Опрема'
      description: 'Весла, пумпе, навлаке, водонепропусне торбе и електроника. Све усклађено са нашим даскама.'
      icon: tabler:package
    - title: 'Поправка и сервис'
      description: 'Поправка дасака у нашој радионици, замена подлога и надоградња опреме.'
      icon: tabler:tool
    - title: 'Прилагођене израде'
      description: 'Дизајн пројекат по пројекат за комерцијалне, научне и војне клијенте.'

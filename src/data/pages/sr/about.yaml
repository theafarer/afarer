meta:
  title: 'О Afarer-у — Бренд надувних SUP дасака и водених спортова | {SITE}'
  description: 'Afarer је глобални бренд надувних SUP дасака и водених спортова, којим управља Aquafarer LLC (САД), а гради га наш тим у Ћингдаоу. Откријте нашу причу, инжењеринг, сертификован квалитет и програме партнерства по земљама.'
  keywords:
    - 'бренд надувних SUP дасака'
    - 'бренд водених спортова'
    - 'дистрибутер sup дасака по земљама'
    - 'ко-бренд sup колекције'
hero:
  tagline: 'О нама'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'afarer фабрика и радионица'
  title: |
    Поморски инжењеринг, <br />
    грађен на <span class="text-accent dark:text-white">afarer</span> начин
  subtitle: 'Почели смо у обалској радионици са једном даском и тврдоглавим уверењем: поморски производи треба да буду инжењерски грађени као да су важни, јер јесу. Данас шаљемо у преко 40 земаља, али сваки труп и даље пролази кроз исте руке које су основале компанију.'


features3_reasons:
  tagline: 'Зашто изабрати afarer'
  title: 'Седам разлога за партнерство са нама'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Стварна производња, не трговина'
      description: 'Поседујемо и водимо фабрику од 12,000 m². Када склапате партнерство са afarer-ом, радите директно са људима који дизајнирају, конструишу и праве ваше производе — без посредника.'
      icon: tabler:building-factory
    - title: '2. Приступ вођен инжењерингом'
      description: 'Наш процес дизајна почиње случајем употребе, а не категоријом производа. Оптимизујемо облик трупа, избор материјала и конфигурацију према томе како ће се даска заиста користити.'
      icon: tabler:engine
    - title: '3. Сертификован квалитет'
      description: 'CE сертификовано, ISO систем квалитета, BSCI усаглашено, REACH усаглашено, USCG одобрено. Сваки производ испуњава међународне стандарде — не само тврдње.'
      icon: tabler:certificate
    - title: '4. Флексибилно ко-брендирање'
      description: 'Боје рубова, распоред палубе, брендирање, паковање — прилагођавамо вашим спецификацијама. Без притиска минималне поруџбине. Започните са прототипом, растите са самопоуздањем.'
      icon: tabler:adjustments
    - title: '5. Глобална логистика'
      description: 'Складиште у САД у Калифорнији, директна испорука из Ћингдаоа, ваздушни терет за хитне поруџбине. Обрађујемо царинску документацију и пратеће папире.'
      icon: tabler:truck-delivery
    - title: '6. Доживотна подршка'
      description: 'Подржавамо даске које смо направили пре 20 година. Оригинални резервни делови, технички савети, упутства за поправку — наш тим је доступан када вам треба.'
      icon: tabler:lifebuoy
    - title: '7. Искрене спецификације'
      description: 'Стварне оцене носивости, стварне димензије, стварна тежина. Без маркетиншког надувавања. Оно што објављујемо јесте оно што добијате — верификовано независним тестирањем.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Поверење брендова широм света'
  title: 'Шта кажу наши партнери'
  items:
    - content: 'Сарађивали смо са неколико произвођача у Кини, али се afarer издваја по инжењерској подршци и доследном квалитету. Односе се према нашем бренду као према свом.'
      name: '— Ко-бренд партнер, европски бренд спортова на води'
    - content: 'Њихове SUP даске у нашој флоти су у служби већ преко 5 година. Минимално одржавање, одлична UV отпорност. Петогодишња гаранција даје нам самопоуздање.'
      name: '— Оператор флоте, група одмаралишта са Блиског истока'
    - content: 'Тим afarer-а помогао нам је да развијемо прилагођен дизајн SUP даске од концепта до производње за 90 дана. Квалитет је надмашио наша очекивања.'
      name: '— Дистрибутер, аустралијски спортови на води'

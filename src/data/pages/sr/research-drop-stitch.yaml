  title: 'Како функционише Drop Stitch — Инжењеринг иза надувних крутх језгара'
  subtitle: 'Читање од 8 min'

content_html: |
  <h2>Шта је Drop Stitch?</h2>
  <p>Drop stitch (такође названа „drop-stitch тканина“ или „drop-stitch језгро“) је метода конструкције у којој хиљаде појединачних полиестарских конца повезују горњи и доњи слој тканине. Када се тканина надува, ови концеви делују као унутрашњи затегнути елементи — спречавају горње и доње панеле да се избоче у заобљен облик, приморавајући панел да остане раван и крут.</p>
  <p>Резултат је лака, преносива структура која може да издржи 15 – 20 PSI унутрашњег притиска — упоредиво са крутости чврсте даске, али потпуно испустива ради складиштења и транспорта.</p>

  <h2>Како функционише: физика</h2>
  <p>У конвенционалној надувној структури (као балон или душек на надувавање), унутрашњи притисак ваздуха гура подједнако у свим смеровима. Без унутрашњег ограничења, структура постаје цилиндрична или сферична. Drop stitch то решава увођењем затезног ојачања:</p>
  <ul>
    <li>Хиљаде конца повезују горњи и доњи слој тканине</li>
    <li>Када се надува, притисак ваздуха покушава да раздвоји горњи и доњи слој</li>
    <li>Конци се опиру том раздвајању, преносећи оптерећење у затезање дуж осе конца</li>
    <li>Резултат је раван, крут панел који се опире савијању</li>
  </ul>

  <h2>Процес израде</h2>
  <ol>
    <li><strong>Ткање:</strong> Полиестарски концеви ткају се истовремено у два одвојена слоја основне тканине (обично 1,100 DTEX или 1,680 DTEX PVC пресвучен полиестар). Конци се ткају у петље између слојева под углом од 90&deg;.</li>
    <li><strong>Пресвлачење:</strong> Ткана основна тканина пресвлачи се PVC-ом (или повремено TPU-ом) помоћу процеса пресвлачења ножем или календарског пресвлачења. Ово заптива конце и ствара непропусну мембрану за ваздух.</li>
    <li><strong>Спајање слојева:</strong> Drop-stitch језгро се везује за спољашње ламиниране слојеве (обично 0.9 mm или 1.2 mm PVC) помоћу топлотног ламинирања или лепка.</li>
    <li><strong>Заваривање:</strong> Траке рубова заварују се дуж ивица топлим ваздухом, RF заваривањем или заваривањем високе фреквенције како би се створили бочни зидови даске.</li>
    <li><strong>Уградња вентила:</strong> Boston или Halkey-Roberts вентили се инсталирају, обично са механизмом за ублажавање притиска како би се спречило прекомерно надувавање.</li>
  </ol>

  <h2>Кључни показатељи квалитета</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Параметар</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Почетни ниво</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Премиум</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Густина конца</td><td class="p-3 border">1 конца / sq in</td><td class="p-3 border">2 конца / sq in</td></tr>      <tr><td class="p-3 border">Основна тканина</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Максимални притисак</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Дебљина PVC-а</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Конструкција руба</td><td class="p-3 border">Преклопљено и лепљено</td><td class="p-3 border">Заварено и фузионо спојено</td></tr>
    </tbody>
  </table>

  <h2>Примене</h2>
  <ul>
    <li><strong>SUP даске:</strong> дебљина 4" – 6", 15 – 20 PSI, 1 – 2 конца/sq in</li>
    <li><strong>Кајаци:</strong> Drop-stitch под + надувне бочне коморе, под на 10 – 15 PSI</li>
  </ul>

  <h2>Drop Stitch наспрам ваздушне палубе (фиберглас или дрвено језгро)</h2>
  <p>Чврсте даске користе EPS језгра од пене са ојачањем од фибергласа или дрвених уздужница. Лакше су, круће и одзивније — али се не могу испустити. Drop stitch жртвује део крутости за потпуну преносивост. За већину рекреативних корисника, модерне drop-stitch SUP даске на 20 PSI неразликују се од почетничких чврстих дасака по крутости.</p>

  <h2>Како Afarer користи Drop Stitch</h2>
  <p>Afarer користи 1,680 DTEX drop-stitch језгро у целој SUP линији, са 2 конца по квадратном инчу и 1.2 mm PVC спољашњим ламинатом. Даске су оцењене на 20 PSI и пролазе тест задржавања притиска од 24–48 сати на 1.25x номиналног притиска пре отпреме. Траке рубова заварују се топлим ваздухом са троструком фузијом, а вентили за ублажавање притиска стандардни су на свим моделима.</p>


intro: 'Свака даска која напушта нашу радионицу носи потврду да је прошла дефинисани скуп контрола квалитета и тестова материјала. Наша Лабораторија за квалитет и контролу независна је функција у оквиру организације — извештава директно директору, а не производњи — чиме се обезбеђује да никакав комерцијални притисак не може да угрози контролну тачку. Ако партија материјала или завршена даска не испуњава објављену спецификацију, лабораторија има овлашћење да заустави отпрему док се несагласност не отклони.'

content_html: |
  <h2>Веруј, али провери</h2>
  <p>Лабораторија послује у оквиру система управљања квалитетом усклађеног са принципима, а наше методе тестирања заснивају се на ISO, ASTM и EN стандардима где год је то применљиво. Водимо детаљне евиденције о сваком обављеном тесту, стварајући потпун ланац трагивости од пријема сировина до финалне испоруке даске.</p>

  <h2>Опрема и могућности тестирања</h2>
  <table>
    <thead><tr><th>Опрема</th><th>Тестови који се изводе</th><th>Стандард / Метода</th></tr></thead>
    <tbody>
      <tr><td>Универзална тестна машина (50 kN)</td><td>Затезна чврстоћа (ткиво), отпорност на откидање (шавови), ширење кидања</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Уређај за тест задржавања ваздуха (програмибилан)</td><td>Издржљивост на 1000 циклуса надувавања/испуштања, тест задржавања притиска од 30 min</td><td>EN ISO 25649 (интерно)</td></tr>
      <tr><td>Направа за откидање шава (моторизовано откидање од 180°)</td><td>Чврстоћа откидања завареног и лепљеног шава при 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Тестер хидростатичког притиска</td><td>Отпорност тканине на продор воде (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Дигитални мерач дебљине и микрометар</td><td>Дебљина тканине, дебљина зида руба, дебљина лепљивог филма</td><td>ISO 2286-3</td></tr>
      <tr><td>Климатска комора</td><td>Климатизација температуре (-40 °C до +80 °C) за тестове хладног пуцања и топлотног старења</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Спектрофотометар за боје</td><td>Мерење боје Делта-E након UV излагања</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Контролне тачке — од материјала до испоруке</h2>
  <p>Свака даска прати дефинисан план квалитета са обавезним контролним тачкама. Ниједна даска не може да прескочи тачку; сваку тачку мора потврдити инспектор квалитета пре почетка следеће фазе производње.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Тачка 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Контрола улазног материјала</p>
            <p class="text-xs text-gray-500 mt-1">Партија тканине, партија лепка, оков — све се проверава према улазној спецификацији пре пуштања у производњу.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Тачка 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Контрола завара током производње</p>
            <p class="text-xs text-gray-500 mt-1">Први узорак завара тестира се (откидање + визуелни преглед) на почетку сваке производне смене.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Тачка 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Тест ваздуха комора</p>
            <p class="text-xs text-gray-500 mt-1">Свака комора се притискује на 1.5 x радног притиска и држи 30 min. Подаци се бележе по серијском броју.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Тачка 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Преглед пред испоруку</p>
            <p class="text-xs text-gray-500 mt-1">Комплетна даска се прегледа: сви причвршћивачи стегнути, опрема функционална, без козметичких дефеката. Листа провере од 100 тачака.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Тачка 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Финална сертификација</p>
            <p class="text-xs text-gray-500 mt-1">Извештаји о тестирању се састављају, евиденције контроле прегледају и издаје се Потврда о усаглашености.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Кључни показатељи квалитета (клизни просек за 2025.)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Принос из првог пролаза (партија тканине)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Стопа одбацивања завара (по метру дужине)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Коморе тестиране на ваздух пре монтаже</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">Усаглашеност са категоријом дизајна</span>
    </div>
  </div>

  <h2>Наш тим за квалитет</h2>
  <p>Лабораторијом руководи менаџер квалитета (10 година у морском осигурању квалитета, ASQ Certified Quality Engineer), два инспектора квалитета (сваки са сертификатом NDT нивоа 2 у визуелном тестирању) и техничар за материјале задужен за сва физичка тестирања. Тим пролази годишње тестирање стручности код независног провајдера треће стране како бисмо осигурали да наши резултати тестирања остану тачни и поновљиви.</p>

  <h2>Независно тестирање за клијенте</h2>
  <p>Наша Лабораторија за квалитет и контролу доступна је за услуге независног тестирања. Ако треба да верификујете спецификацију тканине, потврдите нови систем лепљења или набавите тест извештај треће стране за квалификацију у набавци, ми можемо извести тестове према применљивом стандарду и издати сертификован тест извештај.</p>
  <p>Примери недавног тестирања за треће стране:</p>
  <ul>
    <li>Поређење чврстоће откидања пет конкурентских производа лепљивог филма за европски војни програм набавке.</li>
    <li>Студија убрзаног старења (UV + термички циклуси) за нову наранџасту PVC формулацију, са редовним међумерењима на сваких 500 h.</li>
    <li>Валидација задржавања ваздуха 50 прототипских вентила преграда за нови дизајн коморе под високим притиском.</li>
  </ul>

  <h2>Наша обавеза према вама</h2>
  <p>Када примите Afarer даску, добијате и њен досије квалитета — састављену евиденцију резултата тестирања који се односе на вашу конкретну даску. Сертификат партије тканине, тестови откидања завара, дневници теста ваздуха комора и листа прегледа пред испоруку. Сваки број је могуће пратити. Сваки инспектор је идентификован. То није само папирологија — то је наше обећање да је оно што смо испоручили оно што смо специфицирали.</p>
  <p>Ако икада имате забринутост у вези са квалитетом, можете директно контактирати лабораторију — контакт подаци су одштампани на вашој потврди о усаглашености. Сериозно схватамо сваки упит и обавезујемо се на формалну истрагу у року од 48 сати.</p>


intro: 'CAD модел, без обзира на детаљност, не може открити како ће се даска заиста понашати док не сретне воду. Зато је наша Прототипска радионица дизајнирана да инжењерске податке претвори у физичку даску спремну за воду што брже и прецизније. Сваки нови Afarer модел — и свака значајна прилагођена израда — пролази кроз ову радионицу пре него што се посвете производни алати.'

content_html: |
  <h2>Где дизајн постаје стварност</h2>
  <p>Радионица је потпуно опремљена за истовремену израду трупа, рубова и опреме. Овај приступ паралелног тока рада скраћује време израде прототипа на 8-12 недеља од инжењерског пуштања, у поређењу са индустријским просеком од 16-20 недеља. Када ваша примена захтева специјализовано решење, можемо прећи од концепта до валидације на води за мање од три месеца.</p>

  <h2>Могућности радионице</h2>
  <table>
    <thead><tr><th>Радна станица</th><th>Опрема</th><th>Намена</th></tr></thead>
    <tbody>
      <tr><td>Израда трупа</td><td>CNC машина за сечење тканине, преса за топло ламинирање, станица за припрему drop-stitch језгра</td><td>Производња трупа у пуној величини у сва три типа конструкције</td></tr>
      <tr><td>Монтажа рубова и комора</td><td>RF преса за заваривање, станица за прелиминарно спајање топлим ваздухом, тест направа за надувавање</td><td>Израда рубова и склопова комора у пуној величини са свим преградама и вентилима</td></tr>
      <tr><td>Опремање и уградња</td><td>Направа за фрезерско уграђивање кућишта пераја, уређаји за заваривање носача терета и ручки, станица за сечење подлога за палубу</td><td>Комплетно опремање: пераје, носачи терета, чепови за поводник, ручке, подлоге за палубу, вентили</td></tr>
      <tr><td>Одељење за инструментацију</td><td>GPS сензор брзине, сензори притиска, акцелерометри, низ термопарова, бележилац података</td><td>Инсталација и калибрација инструментације за испитивање на мору</td></tr>
    </tbody>
  </table>

  <h2>Пут прототипа — корак по корак</h2>
  <ol>
    <li><strong>Инжењерска предаја</strong> — Пакет дизајна (3D модел, FEA извештај, листа материјала, распоред слојева) формално прегледавају вођа радионице и пројектни инжењер. Све производне забринутости се означавају и решавају пре почетка сечења.</li>
    <li><strong>Производња трупа</strong> — Труп се гради према инжењерској спецификацији. За конструкцију са једним слојем: drop-stitch језгро се ламинира са специфицираним PVC омотачем. За конструкцију са два слоја: додатни слој се наноси преко основног ламината пре сечења шаблона. За спојену конструкцију: параметри ламинирања се учитавају из одобреног листа процеса и верификују на првом узорку.</li>
    <li><strong>Израда рубова</strong> — Ткантина се сеце помоћу CNC шаблона, а затим RF заварује у рубове и коморе у пуној величини. Свака комора се надува на тестни притисак и оставља 24 h ради почетне стабилизације.</li>
    <li><strong>Монтажа и опремање</strong> — Труп и рубови се спајају. Кућишта пераја и носачи терета се уграђују, чепови за поводник и ручке за ношење се инсталирају, вентил за надувавање се стеже, а подлога за палубу наноси и поравнава.</li>
    <li><strong>Статички тестови</strong> — Пре него што даска додирне воду, она пролази: проверу пловности (пуно оптерећење + 30 % резерве), тест задржавања притиска комора, тест пропуштања вентила, тест извлачења ручки и носача.</li>
    <li><strong>Програм испитивања на мору</strong> — 20 сати тестирања у води, детаљно описано у наставку.</li>
    <li><strong>Преглед прототипа</strong> — Одржава се формални састанак потврде са инжењерским, производним тимом и тимом за квалитет. Све потребне измене дизајна документују се и уграђују у производно пуштање.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Програм испитивања на мору од 20 сати — Распоред тестирања</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Упознавање на мирној води — вођење при ниској брзини, скретање, провера става и поравнања</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Тест брзине — GPS потврђена максимална брзина, крстарска брзина, одржив темпо при 3 учесталости замаха</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Тест скретања — полупречник окрета око осе и окрета замахом, одзив даске, на левој и десној страни</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Тест на таласима — поновљени пролази кроз таласе од 0.5–1.0 m; акцелерометар на позицији става веслача</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Тест стабилности — статички угао нагиба са 4 веслача различите тежине, померено оптерећење на десну страну</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Тест издржљивости — 3 h непрекидно у крстарском темпу; праћење притиска у коморама, температуре рубова и умора веслача</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Завршни преглед — преглед свих компоненти након испитивања, стезање/провера свих причвршћивача, документовање налаза</span>
      </div>
    </div>
  </div>

  <h2>Прилагођено прототиповање за јединствене примене</h2>
  <p>Прототипска радионица је место где решавамо проблеме које стандардне производне даске не могу да реше. Недавни примери укључују:</p>
  <ul>
    <li>Спасилачка SUP даска велике видљивости за организацију за претрагу и спасавање, са интегрисаним ручкама за хватање, носачима опреме за спасавање и трупом велике пловности за извлачење повређених — све прототипски израђено, опремљено и тестирано у нашем објекту.</li>
    <li>Експедициона туристичка SUP даска за извођача хидрографских истраживања, са уклоњивим јарболом за инструменте, запечаћеним отворима за опрему и ниским носачем сонара дизајнираним да минимизира отпор.</li>
    <li>Компактна SUP даска за риболов за флоту одмаралишта, где је прототип коришћен за валидацију стабилности, опремања и издржљивости у свакодневној употреби за изнајмљивање пре него што се клијент обавезао на флоту од четири даске.</li>
  </ul>

  <h2>Наш тим за прототиповање</h2>
  <p>У радионици ради осам вештих морских техничара, од којих је сваки обучен барем у две од три кључне дисциплине (труп, руб, опремање). Вођа тима је мајстор израде са 16 година искуства, од јединствених прилагођених израда до производних серија. Сваком прототипу се додељује посвећен пројектни инжењер који је једина тачка контакта за клијента током целог процеса израде и испитивања.</p>

  <h2>Укљученост клијента</h2>
  <p>Активно охрабрујемо наше клијенте да присуствују кључним етапама током израде прототипа — посебно првом прегледу опремања и испитивању на мору. Ваше оперативне повратне информације током ових фаза непроцењиве су за фино подешавање даске пре него што уђе у производњу. Не градимо у вакууму; градимо у партнерству са вама.</p>
  <p>Испитивање на мору од 20 сати такође је прилика да се ваш тим упозна са понашањем даске, распоредом палубе и захтевима одржавања, чиме се обезбеђује глатак прелазак у службу када се испоруче производне даске.</p>


tests:
  - title: 'Тестирање притиска'
    description: 'Надуване коморе излажу се притисцима који превазилазе препоручене радне лимите током дужег периода. Ово верификује херметичност и структурни интегритет материјала и шавова, осигуравајући да производ може да издржи предвиђену употребу и потенцијално преувеличано надувавање без отказивања или цурења.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Тестирање удара'
    description: 'Производи се излажу контролисаним ударцима различитих тежина и под различитим угловима. Ово процењује отпорност материјала на пробијање, цепање и оштећења од судара са препрекама у води, показујући издржљивост и дуговечност.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'Тестирање UV отпорности'
    description: 'Узорци материјала пролазе кроз убрзано UV излагање које симулира године оштрог сунчевог зрачења, а затим се поново тестирају на задржавање затезне чврстоће и постојаност боје. Ово верификује да PVC једињења одолевају блеђењу, прекривању кредом и пуцању, осигуравајући дугорочну издржљивост у сунчаним морским срединама.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Тестирање отпорности на хабање'
    description: 'Узорци материјала трљају се о абразивне површине одређени број циклуса под контролисаним притиском. Ово мери способност материјала да издржи хабање од поновљене употребе, контакта са песком, стенама или другим површинама, осигуравајући дугорочну издржљивост.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Тестирање перформанси на ниским температурама'
    description: 'Производи се тестирају у хладним срединама како би се проценила функционалност и издржљивост у различитим температурним условима, спречавајући укоченост или пуцање у хладнијим водама. Неопходно за плоче намењене зимској употреби или употреби на високим географским ширинама.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Тестирање пловности и носивости'
    description: 'Производи се тестирају са различитим тежинама како би се одредила њихова максимална носивост и осигурало да безбедно подржавају кориснике и опрему. Носивост сваког модела верификује се пре лансирања.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Тестирање маневрисивности'
    description: 'Производи се тестирају на одзив на веслање или погон мотора, процењујући полупречник окретања и лакоћу руковања. Испитивања на води потврђују да се руковање у стварним условима поклапа са спецификацијама дизајна.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Тестирање водонепропусности'
    description: 'Потпуно састављени производи потапају се или прскају водом како би се проверило да ли постоји цурење кроз шавове, вентиле или материјале. Свака плоча пролази обавезну проверу водонепропусности пре отпреме.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp


stories:
  tagline: 'Приче истраживача'
  title: 'Стварне авантуре стварних људи'
  subtitle: 'Чујте од веслача, породица и професионалаца који користе afarer опрему на води.'
  items:
    - name: 'Sarah и Mike'
      title: 'Власници SUP Explorer 11, Канада'
      content: 'Повели смо наше Explorer 11 на путовање од недељу дана кроз парк Algonquin. Сјајно су поднели преноске и преласке језера. Drop-stitch конструкција значила је да смо могли да надувамо до 15 PSI и добијемо перформансе чврсте даске од даске која се пакује.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Парк Algonquin, Канада'
    - name: 'Carlos R.'
      title: 'Возач Cheetah Surge, Шпанија'
      content: 'Cheetah Surge ми је први избор за обално крстарење. Живахни дизајн окреће главе на плажи, а стабилност ми даје самопоуздање на лаким таласима. Вози се предивно, било да турингам или само уживам у заласку сунца.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Шпанија'
    - name: 'Lina и породица'
      title: 'Веслачи Flowing Lotus, Шведска'
      content: 'Породичне викенд авантуре на архипелагу. Flowing Lotus је довољно стабилан да моја ћерка стоји на њему док ја веслам. Надува се за око 10 минута — без приколице, само чиста породична забава на води.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Стокхолмски архипелаг, Шведска'
    - name: 'Lt. Cmdr. Andres'
      title: 'Истраживач Ocean Voyager, Филипини'
      content: 'Користим свој Ocean Voyager за дуге обалне туре око Palawana. Након месеци свакодневне употребе у тропским условима, даска се и даље понаша као нова. Туринг облик се пробија кроз таласе који би зауставили слабије даске.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palawan, Филипини'
    - name: 'Emma T.'
      title: 'Почетница на Tropical Breeze, Аустралија'
      content: 'Никада раније нисам била на SUP дасци. Tropical Breeze је толико стабилан да сам се осећала самопоуздано већ при првом покушају. Сада веслам сваког викенда. Крива учења је практично нула — а даска изгледа невероватно на води.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Аустралија'


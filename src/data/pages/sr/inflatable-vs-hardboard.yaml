faqs:
  - question: 'Која је издржљивија: надувна или чврста SUP даска?'
    answer: 'Надувне SUP даске су генерално издржљивије јер одолевају удубљењима, пукотинама и оштећењима од удара која би трајно оштетила чврсту даску.'
  - question: 'Да ли је надувна SUP даска боља за почетнике?'
    answer: 'Да. Надувне SUP даске препоручују се почетницима јер су толерантније, лакше за транспорт и мање вероватно да изазову повреду при падовима.'
  - question: 'Да ли надувне SUP даске могу да постижу перформансе као чврсте даске?'
    answer: 'За рекреативно веслање и туринг, надувне SUP даске парирају перформансама чврстих дасака. Чврсте даске и даље предњаче у тркама и напредном сурфовању због лакше тежине и прецизнијег флексa.'
body: |
  <h2>Кључне разлике</h2>
  <p>Надувне SUP даске (iSUP) и чврсте даске служе истој основној сврси — стојању и веслању на води — али је постижу потпуно различитим методама конструкције. Прави избор зависи од тога како планирате да користите даску.</p>

  <table>
    <tr><th>Фактор</th><th>Надувна SUP даска</th><th>Чврста SUP даска</th></tr>
    <tr><td>Конструкција</td><td>Drop-stitch PVC, надувa се до 12-15 PSI</td><td>EPS језгро од пене обложено фибергласом или епоксијем</td></tr>
    <tr><td>Тежина</td><td>18-28 lbs (само даска)</td><td>20-30 lbs (само даска)</td></tr>
    <tr><td>Величина упаковано</td><td>Ранац (30 x 15 x 10 in)</td><td>Пуна дужина (10-14 ft)</td></tr>
    <tr><td>Припрема</td><td>3-5 минута надувавања</td><td>Спремно за употребу</td></tr>
    <tr><td>Животни век</td><td>5-10 година уз бригу</td><td>3-8 година (подложна удубљењима)</td></tr>
  </table>

  <h2>Преносивост</h2>
  <p><strong>Надувна даска побеђује.</strong> Ово је најочигледнија предност. Надувна SUP даска се пакује у ранац који стаје у пртљажник аутомобила, ормар у стану или пртљажни простор авиона. Путници, станари и сви без кровних носача сматраће надувне SUP даске далеко практичнијима.</p>
  <p>Чврсте даске захтевају кровни носач, велико возило или посвећен простор за складиштење. Тешко се транспортују и не могу се носити у авион без специјалних транспортних кутија.</p>

  <h2>Издржљивост</h2>
  <p><strong>Надувна даска побеђује.</strong> Надувне SUP даске израђене су од војног PVC-а који одолева ударцима, убодима и UV оштећењима. Када испустите надувну даску или ударите у стену, она се одбије. Чврста даска би се на исти удар испуцала, напукла или раздвојила слојеве.</p>
  <p>Чврсте даске су подложније свакодневном хабању. Један пад на бетон може изазвати трајно удубљење које утиче на перформансе и продор воде.</p>

  <h2>Перформансе</h2>
  <p><strong>Чврста даска побеђује на врхунском нивоу.</strong> За рекреативно веслање и туринг при умереним брзинама, оба типа дасака имају сличне перформансе. Чврсте даске имају предност у:</p>
  <ul>
    <li><strong>Брзина</strong> — Чврсте даске су лакше и крутије, што значи боље клизање и већа максимална брзина</li>
    <li><strong>Сурфовање</strong> — Чврсте даске нуде одзивније преласе са руба на руб и боље перформансе на таласима</li>
    <li><strong>Трке</strong> — Такмичарске трке користе скоро искључиво чврсте даске због предности у тежини и крутости</li>
  </ul>
  <p>За просечног рекреативног веслача, ове разлике у перформансама су маргиналне. Већина веслача неће надмашити квалитетну надувну даску.</p>

  <h2>Пријатељскост за почетнике</h2>
  <p><strong>Надувна даска побеђује.</strong> Надувне SUP даске су лакше за почетнике јер:</p>
  <ul>
    <li>Мекша површина палубе удобнија је и мање вероватно да изазове повреду при падовима</li>
    <li>Шире и дебље надувне даске нуде већу примарну стабилност</li>
    <li>Нижа почетна инвестиција чини улазак приступачнијим</li>
    <li>Лак транспорт значи више прилика за веслање</li>
  </ul>

  <h2>Складиштење и одржавање</h2>
  <p>Надувне SUP даске захтевају сушење и правилно савијање пре складиштења. Чврсте даске могу се складиштити склопљене, али им је потребна заштита од сунца, топлоте и удара. Обе користе од испирања слатком водом након употребе у сланој води.</p>

  <h2>Препорука</h2>
  <p><strong>Изаберите надувну SUP даску ако:</strong> путујете, имате ограничен простор за складиштење, веслате рекреативно или сте почетник. 90% веслача биће добро опслужено квалитетном надувном даском.</p>
  <p><strong>Изаберите чврсту даску ако:</strong> трчате такмичарски, сурфујете напредне таласе или дајете предност максималним перформансама над преносивошћу и издржљивошћу.</p>

  <h2>Честа питања</h2>
  <h3>Која је издржљивија: надувна или чврста SUP даска?</h3>
  <p>Надувне SUP даске су генерално издржљивије јер одолевају удубљењима, пукотинама и оштећењима од удара која би трајно оштетила чврсту даску.</p>

  <h3>Да ли је надувна SUP даска боља за почетнике?</h3>
  <p>Да. Надувне SUP даске препоручују се почетницима јер су толерантније, лакше за транспорт и мање вероватно да изазову повреду при падовима.</p>

  <h3>Да ли надувне SUP даске могу да постижу перформансе као чврсте даске?</h3>
  <p>За рекреативно веслање и туринг, надувне SUP даске парирају перформансама чврстих дасака. Чврсте даске и даље предњаче у тркама и напредном сурфовању због лакше тежине и прецизнијег флексa.</p>

meta:
  title: Афарер Надувни СУП Даске | Иди даље. Веслај јаче.
  description: Откријте Афарер надувне СУП даске за свестрано веслање, туринг, јогу, риболов и авантуре у природи. Пронађите свој савршен СУП и истражите више на води.
  keywords:
    - надувна суп даска
    - надувни суп
    - свестрани суп
    - туринг суп
    - суп за јогу
    - суп за риболов
    - породична суп даска
    - преносива суп даска
hero:
  tagline: Надувни СУП Даске
  title: Надувне СУП Даске за Сваку Авантуру
  slogan: Иди даље. Веслај јаче.
  subtitle: Откријте слободу веслања са Афарером. Истражите промишљено дизајниране надувне СУП даске за опуштене дане на језеру, обалне авантуре, фитнес и све између.
  taglineSection: Конструисано за самопоуздање. Дизајнирано да се истакне.
  actions:
    - variant: primary
      text: Пронађи Своју Даску
      href: /size-guide/
      icon: tabler:compass
    - text: Истражи СУП Даске
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Зашто Афарер
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Афарер надувне СУП даске клизе по мирној води у зору — направљене за сваку авантуру
who_we_serve:
  tagline: Веслајте с Нама
  title: Пронађите Свој Пут по Води
  subtitle: Сваки веслач има другачију идеју авантуре. Откријте СУП Афарер дизајниран за ваш стил вожње.
  items:
    - title: Почетници и Рекреативни Веслачи
      keywords: надувни суп за почетнике, свестрана суп даска, стабилни суп
      description: Широке, стабилне свестране даске које први замах чине природним и расту са вама.
      icon: tabler:users
      cta: Пронађите Своју Прву Даску
      link: /all-around-sup/
    - title: Туринг и Авантура
      keywords: туринг суп, суп даска за велике удаљености, експедициони суп
      description: Дуже, уже даске које држе правац, клизу даље и носе опрему за вишедневне руте.
      icon: tabler:building
      cta: Истражите Туринг СУП
      link: /touring-sup/
    - title: Јога и Фитнес
      keywords: суп за јогу, фитнес суп даска, широк стабилан суп
      description: Широке, стабилне платформе са простором за кретање — за јутарње токове, тренинге и равнотежу на мирној води.
      icon: tabler:heart
      cta: Истражите СУП за Јогу
      link: /yoga-sup/
    - title: Риболов и Породица
      keywords: суп за риболов, породична суп даска, стабилна риболовна платформа
      description: Стабилне, практичне платформе за риболов, вожњу са децом и дуге опуштене дане на води.
      icon: tabler:users
      cta: Истражите СУП за Риболов
      link: /fishing-sup/
proof_points:
  title: Тестирано изван излога
  subtitle: Дизајн, перформансе и квалитет који можете да верификујете — на води и у бројкама.
  items:
    - metric: 10+
      label: Година дизајнирања за воду
      detail: Од 2012, усавршавано даска по даска
    - metric: 50+
      label: Земаља на води
      detail: Веслачи и партнери широм света
    - metric: 12–15
      label: PSI drop-stitch језгро
      detail: Круто где треба, лако за паковање
    - metric: 100%
      label: Тестирано на притисак даска по даска
      detail: Проверено пре отпреме
business_solutions:
  tagline: Зашто Вози Другачије
  title: Перформансе које Осећате од Првог Замаха
  subtitle: Четири стуба обликована стварном водом — перформансе, дизајн, конструкција и квалитет.
  items:
    - title: Перформансе на Води
      description: Облици подешени за стабилност, клизање и самопоуздање на таласима — сваки замах остаје повезан са водом.
      icon: tabler:shield-check
    - title: Изразит Дизајн
      description: Колекције инспирисане плимом, дивљином и енергијом обале — даске са којима желите да будете виђени.
      icon: tabler:package
    - title: Доказана Конструкција
      description: Drop-stitch језгра велике густине, ојачане ивице и фузијски ламинирани шавови за вишекратну употребу.
      icon: tabler:headset
    - title: Потврђен Квалитет
      description: Тестирани под притиском, визуелно прегледани и покривени јасном гаранцијом и одзивном подршком након продаје.
      icon: tabler:truck-delivery
cta:
  title: Пронађите своју следећу даску.
  subtitle: Први замах или најдужа рута — извећемо вас на воду.
  actions:
    - variant: primary
      text: Истражите Колекцију
      href: /inflatable-sup/
      icon: tabler:send
    - text: Затражите Каталог
      href: /resources/download-catalog/

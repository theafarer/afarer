  tagline: 'Зашто се вози другачије'
  title: 'Перформансе које осећате при првом замаху'
  subtitle: 'Четири стуба обликована стварном водом — перформансе, дизајн, конструкција и квалитет.'
  items:
    - title: 'Перформансе на води'
      description: 'Облици подешени за стабилност, клизање и самопоуздање на таласима — тако да се сваки замах осећа повезано са водом.'

      title: 'Идеја и кратак опис'
      desc: 'Поделите своју визију, циљног возача и воду за коју дизајнирате.'
    - number: '02'
      title: 'Дизајн и инжењеринг'
      desc: '3D моделирање, одабир материјала и препознатљив графички дизајн.'
    - number: '03'
      title: 'Прототип и валидација'
      desc: 'Узорне даске тестиране на притисак и валидиране у вожњи пре ваше обавезе.'
    - number: '04'
      title: 'Производња у великом обиму'
      desc: 'Доследна, контролисана производња са контролним тачкама квалитета у свакој фази.'
    - number: '05'
      title: 'Глобална испорука'
      desc: 'Логистика од Ћингдаоа до великих лука уз царинску подршку.'

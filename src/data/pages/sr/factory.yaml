intro:
  - 'Као производни огранак компаније **Aquafarer LLC (USA)**, afarer тим за пословање у Ћингдаоу контролише сваку фазу производње — од пријема сировина од PVC-а и стаклопластике до завршног прегледа пре испоруке готове плоче. Наш производни погон у Ћингдаошкој привредној развојној зони обухвата 12,000 квадратних метара и садржи наменске радионице за сечење PVC-а, топлотно спајање цеви, израду FRP калупа, дигиталну штампу SUP плоча, завршну монтажу и тестирање квалитета.'
  - 'Обједињавањем дизајна, инжењеринга, израде прототипова, производње и тестирања под једним кровом елиминишемо неефикасност уговорне производње и одржавамо директну контролу над квалитетом израде, избором материјала и роковима испоруке. Свака плоча која напусти нашу радионицу израђена је од наших људи, на нашој опреми, према нашим стандардима.'


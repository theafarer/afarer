workshops_section:
  tagline: 'Радионице'
  title: 'Производне радионице'
  workshops:
    - title: 'Сечење PVC-а и припрема материјала'
      description: 'Аутоматске CNC машине за сечење обрађују PVC и Drop-Stitch тканине са прецизношћу испод милиметра. Рачунарски оптимизован распоред делова минимизира отпад материјала и осигурава да сваки панел испуњава димензионалну спецификацију пре заваривања.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Заваривање цеви и топлотно спајање'
      description: 'Наменска радионица за заваривање са машинама за топлотно спајање и RF диелектричним пресама. Уређаји за топлотно спајање топлим ваздухом везују и стапају коморе PVC цеви, док RF завари производе шавове високе чврстоће непропустљиве за ваздух који превазилазе захтеве стандарда EN ISO 25649.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'FRP калупи и израда композита'
      description: 'Прилагођени FRP калупи за SUP компоненте, израђени ручним ламинањем стаклопластике са системима полиестерских и винилестерских смола. Сваки слој се ручно ваља и пакује у вакууму ради доследног квалитета. Кабина за прскање гелкоутом пружа сјајну, UV-отпорну завршну обраду за морске услове.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Штампа и декорација SUP плоча'
      description: 'SUP плоче се декоришу дигиталном штампом за графику у пуним бојама и сито-штампом за логотипе и понављајуће шаблоне. Дигитални штампачи производе дизајне палубе фотографског квалитета, док сито-штампа даје трајне, живописне бренд ознаке.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Завршна монтажа и опремање'
      description: 'Монтажна линија на којој се Drop-Stitch језгра завршавају рубним тракама, наносе EVA палубе и инсталирају пераје, вентили и опрема. Свака плоча прати контрольну листу монтаже са 100 тачака коју потврђује вођа тима.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Тестирање и контрола квалитета'
      description: 'Свака завршена плоча пролази обавезно тестирање задржавања ваздуха, проверу лепљења шавова и комплетну проверу система пре испоруке. Наша лабораторија квалитета послује независно од производње и извештава директно менаџменту.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


qc_section:
  tagline: 'Контрола квалитета'
  title: 'Процес тестирања и осигурања квалитета'
  subtitle: 'Свака плоча пролази обавезно тестирање пре испоруке. Наша лабораторија квалитета послује независно од производње и извештава директно менаџменту.'
  steps:
    - step: '1'
      title: 'Преглед сировина'
      desc: 'PVC и Drop-Stitch тканине пролазе тест затезне чврстоће (ASTM D751), тест отпорности на цепање и проверу UV отпорности пре него што било која серија уђе у производњу.'
    - step: '2'
      title: 'Тест задржавања ваздуха од 24–48 сати'
      desc: 'Свака комора цеви се надува на 125% номиналног притиска и држи 24–48 сати. Пад притиска већи од 5% аутоматски означава одбацивање и поновни преглед шавова.'
    - step: '3'
      title: 'Тестирање оптерећења и равнотеже'
      desc: 'Завршене плоче се оптерећују до максималног номиналног капацитета и тестирају на стабилност и крутост. Свака плоча се тестира у води пре завршног прегледа.'

oem_section:
  tagline: 'OEM пројекти'
  title: 'Студије случаја партнерства са брендовима и OEM'
  subtitle: 'Од концепта до контејнера — како помажемо глобалним брендовима да лансирају и прошире своје линије надуваних SUP плоча.'
  cases:
    - challenge: 'Европском малопродајном ланцу опреме за природу била је потребна линија SUP плоча са приватном ознаком, јединственом графиком палубе, еколошки прихватљивим PVC-ом и паковањем спремним за малопродају — све испоручено за 60 дана.'
      solution: 'Развили смо прилагођене фајлове за дигиталну штампу, набавили PVC у складу са REACH прописима и скратили израду узорака са 3 круга на 1 смештајући дизајнерски тим у нашој фабрици у Ћингдаоу.'
      result: '55 дана од потписаног PO до FOB. 2,400 јединица у 4 SKU. Понављена поруџбина наручена пре доласка првог контејнера.'
    - challenge: 'Америчком стартапу за водене спортове била је потребна високо перформантна Drop-Stitch SUP плоча прилагођеног облика, са заједнички брендираним паковањем и BSCI сертификатом за пласман у малопродаји.'
      solution: 'Прилагодили смо постојећи SUP калуп са измењеном контуром, развили заједнички брендирано паковање и обезбедили комплетну BSCI ревизијску документацију.'
      result: 'Успешно пласирано у 3 велика америчка ланца опреме за природу. 5,000+ јединица у првој години са 98% стопом продаје.'
    - challenge: 'Аустралијски дистрибутер захтевао је CE сертификовану линију SUP плоча са прилагођеним бојама и усклађеност са аустралијским стандардима.'
      solution: 'Произвели смо предпроизводне узорке у 4 варијанте боја и координирали тестирање усклађености од стране независне треће стране.'
      result: 'Линија од 3 SUP модела лансирана на тржишту AU/NZ. Потом је освојена државна тендерска понуда за 12 патролних SUP плоча.'

faq_section:
  tagline: 'FAQ'
  title: 'Често постављена питања за B2B и OEM'
  questions:
    - q: 'Колика је најмања количина наруџбине (MOQ) за OEM надуване SUP плоче?'
      a: 'MOQ почиње од 5–10 јединица за стандардне OEM моделе. Прилагођени калупи и пројекти са приватном ознаком захтевају минимум 200 јединица у зависности од сложености. Пробне поруџбине и пробне серије су доступне за лансирање нових брендова.'
    - q: 'Да ли afarer поседује BSCI сертификат?'
      a: 'Да. Наша фабрика одржава важећи BSCI сертификат социјалне усклађености (ревизијски извештај доступан на захтев). Такође поседујемо ISO 9001 за управљање квалитетом, а сви производи носе CE сертификат. Документација о усклађености са REACH и RoHS прописима доставља се уз сваку OEM пошиљку.'
    - q: 'Које је уобичајено време испоруке за OEM поруџбину?'
      a: 'Стандардно време испоруке је 30–45 дана од потврђеног PO и аванса за серијску OEM производњу. Развој прилагођених калупа додаје 15–20 дана за израду алата. Убрзана производња је доступна за хитне поруџбине и сезонске шпицеве. Узорци прототипова се обично шаљу у року од 15–20 дана.'
    - q: 'Можете ли испоручити FOB Ћингдао или CIF до наше луке?'
      a: 'Да. Шаљемо FOB Ћингдао, CIF до већих глобалних лука и DDP за квалификоване партнере. Наш логистички тим управља резервацијом контејнера, извозном документацијом и царинским процедурама. Шаљемо у 50+ земаља на тржиштима EU, US, AU и Азије.'

b2b_moq: 'Стандардни MOQ: 5–10 јединица по моделу. Пробне поруџбине су добродошле за нова партнерства.'

production_flow:
  tagline: 'Производни ток'
  title: 'Од материјала до готове плоче'
  subtitle: 'Свака плоча пролази кроз 6 фаза производње са QC контролним тачкама на сваком кораку. Без пречица, без изостављених прегледа.'
  stages:
    - stage: '01'
      title: 'Пријем материјала и улазна контрола'
      description: 'Сви материјали који пристижу бележе се по броју серије и лота у нашем ERP систему. Ролои PVC тканине, Drop-Stitch језгра, вентили, лепкови и оков се стављају у карантин до потврде QC.'
      qc_check: 'Затезна чврстоћа (ASTM D751), отпорност на цепање (ISO 4674), мерење дебљине, вискозност лепка, визуелно скенирање дефеката'
      qc_threshold: 'Тестира се 100% серија. Одбацује се ако је затезање < 90% спецификације, цепање < минимума спецификације или постоји било какав визуелни дефект'
      responsibility: 'Тим за улазну контролу (3 инспектора)'
    - stage: '02'
      title: 'CNC сечење и припрема материјала'
      description: 'Рачунарски оптимизован распоред поставља панеле на PVC материјал ради минимизирања отпада. Аутоматске CNC машине за сечење одржавају позицијску прецизност од 0.1 mm.'
      qc_check: 'Димензионална контрола према CAD DXF фајловима, преглед квалитета ивица, провера броја панела'
      qc_threshold: 'Мери се сваки 20. панел. Толеранција ±0.5 mm. Одбацује се серија ако је >2% ван толеранције'
      responsibility: 'Вођа радионице за сечење'
    - stage: '03'
      title: 'Заваривање и спајање Drop-Stitch језгра'
      description: 'Drop-Stitch језгра се спајају са спољашњим PVC ламинатима топлотним ламинањем. Коморе цеви се заварују RF или топловаздушним заваривањем. Рубне траке се спајају фузијом у три слоја.'
      qc_check: 'Тест лепљења на сваких 50 јединица (ASTM D751), мерење ширине завара, преглед дневника температуре топлог ваздуха, визуелни преглед шавова под позадинским осветљењем'
      qc_threshold: 'Чврстоћа лепљења минимум 8 N/cm. Толеранција ширине завара ±1 mm. Било какво видљиво каналисање = одбацивање'
      responsibility: 'QC заваривања (2 инспектора по смени)'
    - stage: '04'
      title: 'Монтажа и опремање'
      description: 'Плоче прелазе на завршну монтажу где се спајају све компоненте: рубне траке се лепе и заварују, вентили инсталирају, D-прстенови, ручке, кућишта пераја и постављање торбе за ношење. Свака јединица прати контрольну листу монтаже са 100 тачака.'
      qc_check: 'Потврда контрольне листе са 100 тачака по јединици, тест функције вентила (10 циклуса отварања/затварања), провера момента окова, визуелни преглед'
      qc_threshold: 'Политика нуле дефеката на критичним ставкама безбедности (вентили, D-прстенови, ручке). Мањи козметички дефекти: AQL 2.5 (ISO 2859)'
      responsibility: 'Вођа тима за монтажу + QC линије'
    - stage: '05'
      title: 'Тестирање притиска и задржавање ради контроле'
      description: 'Свака комора се надува на 1.25× номиналног притиска (обично 20–25 PSI) и држи 24–48 сати. Сензори притиска континуирано бележе. Коморе са падом притиска већим од 5% се одбацују и шаљу на поновни преглед шавова.'
      qc_check: 'Дневник задржавања притиска 24–48h, калибрација сензора се проверава свакодневно, очитавање притиска компензовано на температуру, поновни тест шавова после поправке'
      qc_threshold: 'Максимално 5% пада притиска током 24–48h на стабилној температури. Било која комора која то премашује = 100% поновно тестирање целе производне серије'
      responsibility: 'Лабораторија квалитета (независна од производње, извештава менаџменту)'
    - stage: '06'
      title: 'Завршни преглед и паковање'
      description: 'Завршни визуелни и функционални преглед. Површински дефекти, уједначеност боја, провера етикета и BIN ознака, интегритет паковања и потпуност опреме. Јединице се пакују у вакууму, смештају у кутије и палетизирају за утовар у контејнер.'
      qc_check: 'Комплетан визуелни преглед, листа опреме по SKU, тест пада паковања (1 m, случајни узорак), провера скенирања етикете и бар кода'

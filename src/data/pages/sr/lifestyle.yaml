hero:
  tagline: 'Животни стил'
  title: 'afarer<br />животни стил'
  subtitle: 'Направљено за оне који живе на води — од викенд истраживача до комерцијалних оператера који се сваког дана ослањају на своју опрему.'

values:
  - icon: 🌊
    title: 'Рођени на води'
    desc: 'Сваки дизајн почиње разумевањем тога како се вода понаша. Пројектујемо од ивице услова ка унутрашњости — јер је океан наш учитељ, а не наше радно место.'
  - icon: 🔧
    title: 'Грађено да траје'
    desc: 'Најодрживији производ је онај који не треба мењати. Материјали морског квалитета, drop-stitch језгра оцењена на 15 PSI и шавови који надживљавају сезону.'
  - icon: '🏆'
    title: 'Доступно по дизајну'
    desc: 'Водени спортови не би требало да буду луксуз. Професионални квалитет перформанси по цени која има смисла за породице, водиче и мале оператере — не само за комерцијалне флоте.'
  - icon: 🌍
    title: 'Глобална заједница'
    desc: 'Од обале Qingdaoa до језера у Европи, река у Југоисточној Азији и залива у Америци — наши купци деле једно: љубав према боравку на води.'
  - icon: ♻️
    title: 'Одговорна производња'
    desc: 'CNC оптимизовано угњежђивање смањује отпад материјала испод 5%. Издржљива конструкција смањује циклусе замене. Градимо за дуговечност јер је то најодрживији избор.'
  - icon: 🤝
    title: 'Подршка која траје'
    desc: 'Трупови стари двадесет година још увек нас зову за резервне делове. Наш одговор на гарантне захтеве у просеку износи 24 сата. Не нестајемо након продаје — ту смо за читав живот производа.'


faqs:
  title: 'FAQ OEM производње весала'
  subtitle: 'Одговори на најчешћа питања брендова који лансирају сопствено весло.'
  items:
    - title: 'Како да креирам сопствени бренд весала?'
      description: 'Лансирајте свој бренд за 16 недеља: бриф, дизајн, CE сертификован прототип, серијска производња и испорука. Истражите наше OEM пакете.'
    - title: 'Колики је производни рок?'
      description: 'Узорак је спреман за 2-3 недеље, серијска производња за 30-45 дана, у зависности од количине.'
    - title: 'Да ли весло носи наш логотип?'
      description: 'Да — потпуна приватна ознака: штампа логотипа, прилагођене боје, паковање и етикете у вашем бренду.'
    - title: 'Могу ли да купујем на велико од првог дана?'
      description: 'MOQ износи 50 јединица за стандардне моделе, са ценовним нивоима за велико како се количина повећава.'

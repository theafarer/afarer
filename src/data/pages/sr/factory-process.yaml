intro: 'За разлику од брендова који аутсорсују производњу трећим фабрикама, afarer поседује и води свој цели производни ланац. Ова вертикална интеграција омогућава нам да одржимо строгу контролу квалитета у свакој фази, брзо одговоримо на прилагођене захтеве и испоручимо доследан квалитет производа серију за серијом. Ево како се даска гради у нашем објекту.'

steps:
  - step: '01'
    title: 'Пријем и контрола материјала'
    description: 'Свака долазећа партија PVC тканине, фиберглас прекривача, смоле и окова прегледа се према спецификацији. Узорци тканине тестирају се на затезну чврстоћу, уједначеност дебљине и UV отпорност пре пуштања у производњу. Несагласни материјали се стављају у карантин и враћају.'
    duration: '1–2 дана'
  - step: '02'
    title: 'Аутоматско сечење PVC-а'
    description: 'Одобрене тканине постављају се на аутоматску CNC машину за сечење и сецују са прецизношћу испод милиметра. Рачунарски оптимизовано угњежђивање распоређује панеле ради минимизирања отпада — обично испод 5%. Исецени панели означавају се по моделу даске и комори, а затим пакују за пренос у радионицу за заваривање.'
    duration: '2–4 сата по комплету даске'
  - step: '03'
    title: 'Топлотно заптивање и заваривање цеви'
    description: 'Панели се прелиминарно причвршћују и спајају помоћу машина за топлотно заптивање са заваривањем топлим ваздухом на контролисаним температурама од 200–300 °C. Главни шавови ојачавају се RF диелектричним заваривањем за непропусне, чврсте спојеве. Завршене коморе надувају се на 1.5× радног притиска ради 30-минутне валидације задржавања ваздуха.'
    duration: '1–2 дана по дасци'
  - step: '04'
    title: 'Штампање и декорација SUP дасака'
    description: 'Графике палуба SUP дасака наносе се дигиталним штампањем за дизајне у пуним бојама фотографског квалитета и сито-штампом за трајне логотипе и поновљене шаблоне. Отисци се стврдњавају и заптивају ради UV отпорности и отпорности на хабање.'
    duration: '1–2 дана'
  - step: '05'
    title: 'Финална монтажа и опремање'
    description: 'Даске се опремају на монтажној линији са перајама, вентилима, EVA палубама и опремом. Свака јединица прати листу монтаже од 100 тачака са обавезним потврђивањем у свакој фази.'
    duration: '2–4 дана'
  - step: '06'
    title: 'Тестирање квалитета и контрола'
    description: 'Свака завршена даска пролази обавезну контролну тачку квалитета: тест задржавања ваздуха комора, провера функције окова, верификација момента причвршћивача и козметички преглед. Прилагођене и прототипске израде такође пролазе испитивања на води која обухватају стабилност и понашање.'
    duration: '1–2 дана'
  - step: '07'
    title: 'Паковање и отпрема'
    description: 'Даске се испуштају, савијају према процедури, пакују у издржљиве ткане вреће или сандуке од шперплоче и утоварују ради испоруке. Сваки пакет означава се моделом, серијским бројем и дестинацијом. Координирамо са шпедитерима за FCL и LCL контејнерске пошиљке широм света.'
    duration: '1 дан'


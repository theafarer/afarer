  - question: 'Које материјале afarer користи за надуване SUP плоче туристичког квалитета?'
    answer: 'Користимо PVC морског квалитета високе затезне чврстоће са вишеслојним премазима ради супериорне UV отпорности, отпорности на абразију и дуговечности. Све тканине набављају се од угледних глобалних добављача и пролазе ригорозну улазну контролу.'
  - question: 'Да ли afarer обезбеђује CE сертификат за рекреативне SUP плоче?'

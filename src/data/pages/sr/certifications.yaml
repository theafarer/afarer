meta:
  title: 'Сертификације — CE, ISO 9001 и усаглашеност | {SITE}'
  description: 'Сертификације квалитета afarer: CE (EN ISO 25649), ISO 9001:2015, BSCI. Усаглашеност и безбедност за произвођача надуваних SUP плоча.'
  keywords:
    - 'ce сертификација sup'
    - 'iso 9001 sup'
    - 'наутичка усаглашеност'
    - 'сертификација плоча за веслање'
hero:
  tagline: 'Сертификације и стандарди'
  title: 'Сертификације квалитета<br />и стандарди усаглашености'
  subtitle: 'afarer производња SUP плоча сертификована је према међународним стандардима безбедности на води, системима управљања квалитетом и еколошким прописима — CE, ISO 9001, UKCA, BSCI и REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'afarer сертификације квалитета и документација о усаглашености'
content_certifications:
  tagline: 'Наше сертификације'
  title: 'Сертификован квалитет,<br />глобално признат'
  subtitle: 'Сваки afarer производ подржан је сертификацијама које показују нашу посвећеност квалитету, безбедности и еколошкој одговорности.'
  items:
    - title: 'CE сертификат'
      description: 'Сви afarer производи испуњавају европске захтеве CE обележавања за пловила за рекреацију, чиме се обезбеђује да су испуњени стандарди безбедности, здравља и заштите животне средине.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Наш систем управљања квалитетом сертификован је према ISO 9001:2015 и обухвата дизајн, производњу и дистрибуцију надуваних пловила и опреме за воде.'
      icon: tabler:clipboard-check
    - title: 'UKCA обележје'
      description: 'Производи који се продају на тржишту УК носе UKCA обележје, што потврђује усаглашеност са прописима УК за опрему за воде и лична пловила.'
      icon: tabler:shield
    - title: 'BSCI усаглашеност'
      description: 'afarer је BSCI (Business Social Compliance Initiative) аудитован, што показује етичке производне праксе, фер услове рада и одговорност у ланцу снабдевања.'
      icon: tabler:heart-handshake
    - title: 'REACH усаглашеност'
      description: 'Сви материјали коришћени у afarer производима испуњавају прописе EU REACH о хемијској безбедности, чиме се обезбеђује да у нашим материјалима PVC, EVA или компонентама нема ограничених супстанци.'
      icon: tabler:flask
    - title: 'Тестирање материјала'
      description: 'Тканине се тестирају на затезну чврстоћу, отпорност на цепање, UV деградацију и понашање на хладном пуцању. Свака производна серија се узоркује и верификује.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Стандарди фабрике'
  title: 'Изврсност у производњи<br />— израђено према спецификацији'
  subtitle: 'Наш објекат од 12,000 m² послује под строгим протоколима контроле квалитета у свакој фази производње.'
  list:
    - 'Контрола улазних материјала: Сви сирови материјали — PVC тканина, EVA пена, лепкови, оков — тестирају се према спецификацијама пре уласка у производњу.'
    - 'Контрола квалитета у процесу: Свака фаза производње има документоване контролне тачке контроле квалитета. Чврстоћа заваривања, поравнатост шавова, уградња вентила и момент затезања прикључака верификују се у току процеса.'
    - 'Тестирање притиска: Свака надувана комора тестира се на притиску од 1.25× номиналног притиска током 24–48 сати. Пад притиска мора остати испод 5% да би се оцена сматрала положеном.'
    - 'Завршна контрола: Завршени производи прегледају се на тачност димензија, козметички завршетак, потпуност опреме и интегритет паковања пре испоруке.'
    - 'Трагљивост серија: Сваки производ носи серијски број повезан са евиденцијом производне серије, што омогућава потпуну трагљивост од сировог материјала до готових производа.'
content_safety:
  tagline: 'Стандарди безбедности на води'
  title: 'Безбедност на првом месту<br />— дизајнирано за поуздан рад'
  subtitle: 'afarer производи дизајнирани су и тестирани тако да испуњавају међународне стандарде безбедности на води за комерцијалну и рекреативну употребу.'
  items:
    - title: 'EN ISO 25649'
      description: 'Надувани SUP плоче испуњавају стандарде EN ISO 25649 за конструкцију, стабилност, пловност и носивост.'
      icon: tabler:sailboat
    - title: 'SOLAS усаглашеност'
      description: 'Опрема за безбедност и уређаји за спасавање испуњавају SOLAS (Safety of Life at Sea) захтеве тамо где се примењују.'
      icon: tabler:lifebuoy

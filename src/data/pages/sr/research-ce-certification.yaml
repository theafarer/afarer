content_html: |
  <h2>Шта је CE сертификација?</h2>
  <p>CE ознака (Conformit&eacute; Europ&eacute;enne) означава да производ испуњава захтеве ЕУ у погледу здравља, безбедности и животне средине. За надувна пловила, релевантни регулаторни оквир зависи од категорије производа.</p>

  <h2>Применљиве директиве</h2>

  <h3>Директива о пловилима за рекреацију (2013/53/EU)</h3>
  <p>Примарна директива за пловила за рекреацију у ЕУ. Надувне SUP даске краће од 2.4 m не спадају у њен обим и сертификују се према EN ISO 25649.</p>

  <h3>Уредба о личној заштитној опреми (2016/425)</h3>
  <p>Спасилачки прслуци, помагала за пловност и сигурносна опрема испоручена уз пловила морају испуњавати захтеве Уредбе о PPE, укључујући испитивање типа (Модул B) од стране нотификованог тела и осигурање квалитета производње (Модул D или E).</p>

  <h2>Процес сертификације</h2>
  <ol>
    <li>Класификација производа: Одредите категорију дизајна пловила (A – D према ISO 8666)</li>
    <li>Применљиви стандарди: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (плоча произвођача)</li>
    <li>Припрема техничке документације: Цртежи дизајна, листа материјала, сертификати материјала, процена ризика</li>
    <li>Испитивање типа: Пловност, стабилност, носивост, тестирање материјала, чврстоћа шавова, задржавање ваздуха</li>
    <li>Контрола фабричке производње: Ревизија производних процеса од стране нотификованог тела</li>
    <li>Декларација о усаглашености: Произвођач потписује DoC и поставља CE ознаку</li>
  </ol>

  <h2>Нотификована тела за надувна пловила</h2>
  <p>Уобичајена нотификована тела укључују Bureau Veritas (Француска), DNV GL (Немачка), RINA (Италија), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Немачка).</p>

  <h2>Рокови и трошкови</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Фаза</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Трајање</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Типичан трошак (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Припрема техничке документације</td><td class="p-3 border">2 – 4 недеље</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Испитивање типа</td><td class="p-3 border">4 – 8 недеља</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Ревизија фабрике</td><td class="p-3 border">1 – 2 дана (на лицу места)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Укупно (први производ)</td><td class="p-3 border">8 – 14 недеља</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Шта ово значи за купце</h2>
  <p>При куповини CE сертификованих надувних SUP дасака, увек проверите да ли је CE ознака на плочи произвођача, да ли постоји важећа DoC, да ли је наведен број нотификованог тела и да ли упутство за кориснике садржи сигурносна упутства на вашем локалном језику. Сви Afarer производи носе CE сертификацију са потпуном трагивошћу до извештаја о ревизији нотификованог тела.</p>


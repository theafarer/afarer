    spec: 'Вишеканални, 0–50 psi, бележење података'
  - name: 'Климатска комора за UV старење'
    spec: 'ISO 4892, циклуси од 1,000 h'
  - name: 'Мерач дебљине (дигитални)'
    spec: 'Резолуција 0.01 mm'
  - name: 'Тестер откидања (завар)'

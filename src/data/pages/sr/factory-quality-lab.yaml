test_procedures:
  - title: 'Контрола сировина'
    description: 'Свака долазећа партија PVC-а, drop-stitch тканине и окова тестира се пре прихватања. Верификују се затезна чврстоћа (ASTM D751), отпорност на кидање (ISO 4674) и UV отпорност. Несагласни материјали се стављају у карантин и враћају.'
    standards:
      - 'ASTM D751 (затезање)'
      - 'ISO 4674 (кидање)'
      - 'ISO 4892 (UV)'
  - title: 'QC контролне тачке током производње'
    description: 'Производни оператери обављају самоуправну контролу у свакој фази. QC ревизори спроводе случајно узорковање током смене. Тестови откидања завара изводе се на сваких 50 јединица. Димензионе провере обављају се на сваком 20. панелу.'
    standards:
      - 'ASTM D751 (откидање)'
      - 'Интерна листа провере од 100 тачака'
      - 'ISO 2859 узорковање'
  - title: 'Тест задржавања ваздуха од 24–48 сати'
    description: 'Свака комора цеви надува се на 125% номиналног притиска и држи 24–48 сати. Сензори притиска континуирано бележе податке са температурном компензацијом. Свака комора која премаши пад притиска од 5% покреће аутоматску поновну контролу серије.'
    standards:
      - 'EN ISO 25649'
      - 'CE 2013/53/EU'
  - title: 'Тестирање оптерећења и баланса'
    description: 'Завршене даске тестирају се при максималној номиналној носивости на стабилност и крутост. Свака даска пролази тестирање на води пре коначног одобрења контроле.'
    standards:
      - 'ISO 12217'
      - 'CE 2013/53/EU'

equipment:

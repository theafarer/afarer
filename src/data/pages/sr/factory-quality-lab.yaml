intro: 'afarer води посвећену лабораторију за контролу квалитета која ради независно од производње. Свака партија сировина и свака завршена даска пролази кроз документоване протоколе контроле пре пуштања. Наш QC тим извештава директно менаџменту, чиме се обезбеђују непристрасне одлуке о квалитету.'

highlights:
  - value: 100%
    label: 'Јединица тестирано на притисак'
    detail: 'Свака комора, свака даска'
  - value: 24–48 h
    label: 'Трајање теста задржавања ваздуха'

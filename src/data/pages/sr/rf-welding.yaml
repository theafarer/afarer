intro: 'Надувана SUP плоча поуздана је колико и њени шавови. Један слаб завар може угрозити целу комору — а на мору отказ коморе није непријатност; то је опасност по безбедност. У оквиру бренда afarer уложили смо у наменски Центар за заваривање радио-фреквенцијом (RF) који комбинује индустријске диелектричне пресе за заваривање са ригорозном контролом процеса и тестирањем након заваривања. Сваки шав који произведемо документован је, може се пратити и сертификован је да испуњава или превазилази захтеве стандарда EN ISO 25649 — европског стандарда за надувану опрему за рекреацију.'

content_html: |
  <h2>Наука иза шава</h2>
  <p>RF заваривање користи електромагнетну енергију високе фреквенције (обично 27.12 MHz) за побуђивање поларних молекула у тканини премазаној PVC-ом, стварајући топлоту управо на граници материјала. За разлику од заваривања топлим ваздухом или врућим клином, RF заваривање ствара праву молекуларну везу — два слоја тканине стапају се у јединствен хомоген материјал у зони завара, производећи спој који је подједнако чврст као и основни материјал.</p>

  <h2>Опрема за заваривање и контрола процеса</h2>
  <p>Наш центар за заваривање опремљен је са:</p>
  <table>
    <thead><tr><th>Машина</th><th>Снага / Капацитет</th><th>Примена</th></tr></thead>
    <tbody>
      <tr><td>Диелектрична RF преса 1</td><td>15 kW, плоча 2000 × 600 mm</td><td>Главни уздужни шавови, спојеви рубне траке и трупа</td></tr>
      <tr><td>Диелектрична RF преса 2</td><td>10 kW, плоча 1500 × 500 mm</td><td>Завари преграда, затворни спојеви рубних трака, закрпе за вентиле</td></tr>
      <tr><td>RF заваривач са CNC управљањем</td><td>8 kW, XY сто 2500 × 1200 mm</td><td>Закривљени шавови, утисковање логотипа и панела, прецизно закрпљивање</td></tr>
      <tr><td>Аутоматски заваривач врућим клином</td><td>Променљива температура, максимум 1.2 m/min</td><td>Резервна метода за дебелу PVC тканину рубних трака и поправке</td></tr>
    </tbody>
  </table>
  <p>Свака RF преса опремљена је надгледањем температуре и притиска у затвореној петљи. Параметри завара — снага, време пресовања, време хлађења, притисак електроде — програмирају се по типу материјала и бележе у нашем Систему за управљање производњом (MES) ради потпуне трасабилности.</p>

  <h2>Тестови квалитета завара — сваки шав, свака плоча</h2>
  <p>Интегритет завара верификује се обавезним протоколом од четири теста:</p>
  <ol>
    <li><strong>Визуелни преглед</strong> — 100 % шавова се визуелно прегледа на пробој од прегревања, неправилно поравнање, контаминацију или непотпуно стапање. Граница стопе одбацивања: 0.5 % линеарних метара.</li>
    <li><strong>Тест лепљења</strong> — Трака ширине 25 mm сесе из тест узорка завареног са сваком производном серијом. Минимална сила лепљења: 120 N/25 mm за PVC 1100 dtex.</li>
    <li><strong>Тест задржавања ваздуха</strong> — Свака завршена комора притиска се на 1.5 × радног притиска и држи 30 минута. Пад притиска не сме премаши 2 %.</li>
    <li><strong>Тест топлотног циклуса</strong> — Узорци пролазе кроз 50 циклуса од -20 °C до +60 °C, а затим се поново тестирају на лепљење. Прихватљив губитак чврстоће: &lt; 10 %.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Поређење чврстоће лепљења — RF наспрам заваривања топлим ваздухом (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">RF завар</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Топли ваздух</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Мин</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">RF заваривање доследно постиже 90-95 % чврстоће основног материјала, што је знатно изнад минимума.</p>
  </div>

  <h2>Професионална стручност</h2>
  <p>Наш тим за заваривање предводи виши инжењер процеса са 11 година искуства у диелектричном заваривању премазаних текстила. Сваки оператор завршава шестомесечни интерни програм сертификације пре него што добије дозволу да ради на производним шавовима. Поновна сертификација захтева се сваке године, укључујући практични тест завара који се оцењује према нашем интерном стандарду категорије А (чврстоћа лепљења ≥ 160 N/25 mm).</p>

  <h2>Прилагођена решења заваривања за јединствене захтеве</h2>
  <p>Разумемо да се једна спецификација заваривања не уклапа у сваку примену. Наш Центар за RF заваривање редовно развија прилагођене конфигурације шавова за клијенте са посебним захтевима:</p>
  <ul>
    <li><strong>Вишеслојне ојачавајуће закрпе</strong> — за зоне великог хабања као што су прамчане и крмене рубне траке, развијамо вишепролазне RF заваре који интегришу отпоран спољашњи слој без угрожавања флексибилности.</li>
    <li><strong>Проводљиви или RF-непровидни шавови</strong> — за војне или надзорне примене које захтевају електромагнетно заклањање, заварујемо слојеве проводљиве мреже унутар структуре шава.</li>
    <li><strong>Заваривање панела са променом боје</strong> — двобојни панели тканине (нпр. наранџаст труп + сива палуба) заварени са скривеним преклапањем ради очувања естетике бренда без видљиве линије споја.</li>
  </ul>

  <h2>Наша обавеза према вама</h2>
  <p>Свака плоча коју испоручимо носи нашу гаранцију квалитета завара: ако било који шав откаже у нормалној употреби у гарантном року, поправљамо или замењујемо погођену комору без накнаде и спроводи се истраживање основног узрока ради спречавања поновног појављивања. То није само гаранција — то је посвећеност континуираном побољшању вођена стварним оперативним подацима.</p>
  <p>Када изаберете afarer, бирате шавове који су пројектовани, тестирани и документовани — а не само заварени. То је разлика између плоче која плута и плоче која има перформансе.</p>


meta:
  title: 'Опрема фабрике — Сечење, RF заваривање и штампање | {SITE}'
  description: 'Индустријска afarer производна опрема: PVC сечење, RF заваривање, дигитално штампање, монтажа и тестирање за надувне SUP даске.'
  keywords:
    - 'опрема за производњу sup дасака'
    - 'фабрика надувних sup дасака'
    - 'rf заваривање pvc'
    - 'производња дасака за веслање'
hero:
  tagline: 'Опрема'
  title: 'Производна опрема и машинерија'
  subtitle: 'Индустријска опрема за сечење, заваривање, штампање и монтажу'
  back_label: 'Назад у фабрику'
  back_link: /factory

categories:
  - title: 'Сечење и припрема материјала'
    items:
      - name: 'Аутоматска машина за сечење PVC-а'
        spec: 'CNC контролисана, 6.5 m × 2.5 m, тачност 0.1 mm'
        desc: 'Рачунарски контролисана аутоматска машина за сечење PVC-а и drop-stitch тканина. Софтвер за угњежђивање оптимизује искоришћење материјала на отпад испод 5%.'
      - name: 'Распремач тканине'
        spec: 'максимална ширина 3 m, довод са контролом затезања'
        desc: 'Поставља тканину у једном или више слојева са контролисаним затезањем како би се спречила деформација пре сечења.'

  - title: 'Заваривање и спајање цеви'
    items:
      - name: 'Машина за топлотно заптивање'
        spec: 'заваривање топлим ваздухом, променљиво 200–600 °C, 0.5–5 m/min'
        desc: 'Машина за топлотно заптивање топлим ваздухом за спајање и заваривање PVC-а и шавова рубова. Користи се за прелиминарно причвршћивање, заптивање и стапање комора цеви и спојева пловака.'
      - name: 'Диелектрична RF преса'
        spec: '15 kW, плоча 2000 × 600 mm'
        desc: 'Преса за заваривање радио-фреквенцијом за главне уздужне шавове, траке рубова и израду великих комора.'
      - name: 'CNC контролисани RF заваривач'
        spec: '8 kW, XY сто 2500 × 1200 mm'
        desc: 'Програмабилно заваривање закривљених шавова за сложене геометрије, утисивање логотипа и прецизан рад са закрпама.'

  - title: 'Производња SUP дасака'
    items:
      - name: 'Преса за ламинирање drop-stitch језгара'
        spec: 'Преса великог формата за језгра дасака до 14 ft укупне дужине'
        desc: 'Прецизно ламинирање drop-stitch језгара са спољашњим PVC ламинатима. Сваки слој се спаја под притиском ради доследног квалитета и чврстоће.'
      - name: 'CNC рутер (5-осни)'
        spec: 'радни простор 3 m × 2 m × 1 m, водом хлађено вретено'
        desc: 'Обрада кућишта пераја, отвора за ручке и прилагођених компоненти дасака.'

  - title: 'Штампање и декорација SUP дасака'
    items:
      - name: 'Дигитални штампач'
        spec: 'Висока резолуција inkjet, ширина штампе до 2 m'
        desc: 'Дигитално штампање директно на тканину за графике палуба SUP дасака у пуним бојама. Штампа прилагођене шаблоне, прелазе боја и слике фотографског квалитета UV отпорним воденим мастилима.'
      - name: 'Машина за сито-штампу'
        spec: 'Ручна и полуаутоматска, вишебојна регистрација'
        desc: 'Сито-штампа за логотипе SUP дасака, знаке брендова и поновљене шаблоне. Обезбеђује трајне, непровидне отиске са живим засићењем боја.'

  - title: 'Монтажа и опремање'
    items:
      - name: 'Станица за монтажу дасака'
        spec: 'Модуларна подесива, вишестанциони распоред'
        desc: 'Монтажа кућишта пераја, ручки, D-прстенова, вентила и подлога палуба на SUP даске.'
      - name: 'Преса за уградњу вентила'
        spec: 'Пнеуматска, подесиви притисак'
        desc: 'Прецизна уградња и заптивање Halkey-Roberts и Leafield вентила.'
      - name: 'Ламинатор подлога палубе'
        spec: '3 m × 1.5 m, контрола температуре'
        desc: 'Топлотно ламинирање EVA подлога од пене на горње стране SUP дасака са доследном чврстоћом споја.'

  - title: 'Тестирање и контрола квалитета'
    items:
      - name: 'Универзални тестер затезне чврстоће'
        spec: '50 kN, ASTM D751'
        desc: 'Тестирање силе кидања, издужења при кидању и ширења кидања за партије тканине.'
      - name: 'Уређај за тест задржавања ваздуха'
        spec: 'Програмабилни, задржавање притиска 30 min'
        desc: 'Аутоматизовани тест задржавања притиска за сваку комору цеви пре монтаже.'
      - name: 'Тестер откидања шава'
        spec: 'Моторизовано откидање од 180° при 100 mm/min'
        desc: 'Тестирање чврстоће откидања заварених и лепљених шавова према EN ISO 25649.'
      - name: 'Климатска комора са ксенон луком'
        spec: 'Излагање 2000 h'
        desc: 'Тестирање UV отпорности на промену боје и задржавање чврстоће.'


hero:
  tagline: 'Технологија'
  title: 'Грађено за перформансе'
  subtitle: 'Свака afarer надувна SUP даска пројектована је са drop-stitch конструкцијом и PVC-ом морског квалитета — прецизни материјали и производне методе тестиране за захтевна морска окружења.'

sections:
  - title: 'Drop-stitch језгро'
    description: 'Хиљаде унутрашњих полиестарских нити повезују горњи и доњи слој, стварајући круту структуру при 12-15 PSI. Ово је иста технологија која се користи у професионалним даскама за веслање и надувним тркачким SUP даскама.'
    imageAlt: 'Дијаграм DS језгра'
  - title: 'PVC морског квалитета'
    description: 'Вишеслојна ламинирана PVC тканина оцењена за морска окружења. Сваки слој је стапљен заваривањем, а не лепљењем, чиме се елиминишу ризици деламинације. Тестирана на UV отпорност, корозију од слане воде и хабање.'
    imageAlt: 'PVC слој'
  - title: 'PVC војног квалитета'
    description: 'Користи се на свим SUP моделима, премиум PVC пружа надмоћну UV и хемијску отпорност. Одржава флексибилност при екстремним температурама и одолева деградацији.'
    imageAlt: 'PVC'
  - title: 'Палуба од ваздуха'
    description: 'Надувна drop-stitch конструкција под високим притиском која пружа изузетну крутост за стајање, риболов и јогу. Смањује време подешавања, укупну тежину и запремину за складиштење.'
    imageAlt: 'Ваздушна палуба'


meta:
  title: 'Технологија — Drop Stitch и морски PVC | {SITE}'
  description: 'afarer технологије: drop stitch конструкција, морски PVC, двослојне израде и висок притисак. Иновације од професионалног произвођача надувних SUP дасака.'
  keywords:
    - 'sup технологија'

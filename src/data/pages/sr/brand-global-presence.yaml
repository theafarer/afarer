features3_markets:
  tagline: 'Кључна тржишта'
  title: 'Регионална стручност<br />за локалне захтеве'
  subtitle: 'Разумемо да различита тржишта имају различите регулаторне захтеве, преференције и случајеве употребе.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Европа и УК'
      description: 'CE сертификовани производи. Јака потражња за SUP даскама на тржиштима ЕУ. Дистрибутери у УК цене наше брзе рокове испоруке.'
      icon: tabler:map-pin
    - title: 'Северна Америка'
      description: 'Производња одобрена од стране Обалске страже САД. Складиште у САД у Монтклеру у Калифорнији за брзу испоруку на Западну обалу. Растућа потражња за риболовним, спасилачким и рекреативним SUP даскама.'
      icon: tabler:map-pin
    - title: 'Аустралија и Океанија'
      description: 'Јако тржиште за SUP даске и опрему за спортове на води. Аустралијски дистрибутери цене нашу UV отпорну PVC конструкцију у оштрим сунчаним условима. Брза испорука из нашег азијског објекта.'
      icon: tabler:map-pin
    - title: 'Блиски исток'
      description: 'Растућа потражња за опремом за водене авантуре. Наше комерцијалне SUP даске и сигурносна опрема популарни су код тур оператера и центара за изнајмљивање. Прилагођене конфигурације за средине са високим температурама.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Дистрибутивна мрежа'
  title: 'Партнерство са дистрибутерима<br />широм света'
  subtitle: 'Сарадујемо са етаблираним дистрибутерима поморске опреме, брендовима спортова на води и владиним агенцијама за набавку.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Ко-бренд програми'
      description: 'Производња приватних марка за глобалне брендове спортова на води. Обрађујемо све — од дизајна, преко производње, до директне испоруке.'
      icon: tabler:building
    - title: 'Дистрибутерска мрежа'
      description: 'Овлашћени дистрибутери у 20+ земаља држе залихе и пружају локалну подршку. Нове дистрибутерске упите радо примамо.'
      icon: tabler:users
    - title: 'Владин и институционални сектор'
      description: 'Директна испорука обалским стражама, организацијама за претрагу и спасавање и војним програмима набавке. Усаглашеност са захтевима институционалних набавки.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Глобална логистика и подршка'
  subtitle: 'Од фабрике до дестинације — управљамо целим ланцем снабдевања.'
  items:
    - title: 'Опције испоруке'
      description: 'Поморски терет (FOB Ћингдао), ваздушни терет за хитне поруџбине и експресни курир за узорке и резервне делове.'
      icon: tabler:truck-delivery
    - title: 'Складиште у САД'
      description: 'Залихе у Монтклеру у Калифорнији за брзу испоруку широм Северне Америке. Западна обала: 2-3 дана, централни део: 3-4 дана, Источна обала: 4-5 дана.'
      icon: tabler:building-warehouse
    - title: 'Резервни делови'
      description: 'Оригинални afarer резервни делови и потрошни материјал на залихама током целе године. Чести делови шаљу се у року од 24 сата.'
      icon: tabler:package
    - title: 'Техничка подршка'
      description: 'Директна линија до нашег инжењерског тима за техничка питања, савете за поправку и подршку за резервне делове. Подржавамо даске које смо направили пре 20 година.'
      icon: tabler:headset

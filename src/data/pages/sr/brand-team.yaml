philosophy:
  tagline: 'Филозофија дизајна'
  title: 'Дизајн вођен инжењерингом<br />— Сваки детаљ је важан'
  subtitle: 'Наша инжењерска филозофија почива на три принципа који воде сваки производ који градимо.'
  list:
    - 'Поузданост на првом месту: Сваки afarer производ се тестира да издржи стварне услове — од спасилачких операција у хладној води до изнајмљивања у тропским одморалиштима. Вишак инжењеринга улагамо тамо где је најважнији.'
    - 'Прецизност производње: Наши погони користе CNC сечење, заваривање високом фреквенцијом и аутоматизовано тестирање притиска. Сваки шав, сваки вентил, сваки фитинг испуњава документоване спецификације.'
    - 'Континуиране иновације: Наш R&D тим непрестано вреднује нове материјале, производне методе и побољшања дизајна. Не чекамо проблеме — предвиђамо их.'

content_programs:
  tagline: 'Партнерски програми'
  title: 'Партнерски програми<br />изграђени за раст'
  subtitle: 'Без обзира да ли сте дистрибутер, дилер или партнер бренда, afarer нуди програме дизајниране да подрже ваш бизнис.'
  columns: 3
  items:
    - title: 'Програм за дистрибутере'
      description: 'Ексклузивна територијална дистрибуција са ценама по количини, маркетиншком подршком и директним приступом фабрици. Потребна је минимална обавеза у зависности од величине територије.'
      icon: tabler:world
    - title: 'Програм за дилере'
      description: 'Директне цене за дилере, обука о производима, маркетиншки материјали и гаранцијска подршка за малопродајне локације и онлајн продавнице.'
      icon: tabler:building-store
    - title: 'OEM/ODM партнерство'
      description: ' Потпуна OEM и ODM производња уз прилагођено брендирање, паковање и спецификације производа. Од концепта до контејнера.'
      icon: tabler:certificate
    - title: 'Партнерство брендова'
      description: 'Ко-брендирање, приватна марка и програми ексклузивних модела за етаблиране брендове у области поморске и рекреативне делатности на отвореном.'
      icon: tabler:stars
    - title: 'Владин и институционални програм'
      description: 'Програми преферентног добављача за владине агенције, обалске страже, војску и хуманитарне организације. Документација спремна за тендере.'
      icon: tabler:building-community
    - title: 'Партнер за одмаралишта и изнајмљивање'
      description: 'Цене за флоте, доследан квалитет и прилагођено брендирање за одмаралишта, центре за роњење и операције изнајмљивања широм света.'
      icon: tabler:sun
content_benefits:
  tagline: 'Зашто постати партнер са нама'
  title: 'Зашто партнери бирају afarer'
  subtitle: 'Наши партнери имају користи од стварног производног капацитета, доследног квалитета и одзивне подршке.'
  list:
    - 'Директан приступ фабрици: Радите директно са нашим производним тимом — без посредника. Добијате брже одговоре, боље цене и потпун увид у производњу.'
    - 'Спремност за прилагођавање: Брендирајте своје производе прилагођеним бојама, логотипима, паковањем и спецификацијама. Минималне количине поруџбине прилагођене вашем тржишту.'
    - 'Гарантован квалитет: ISO 9001 сертификована производња са CE, UKCA и BSCI усаглашеношћу. Сваки производ тестиран пре отпреме.'
    - 'Глобална логистика: Испорука из Ћингдаоа у Кини са опцијама FOB, CIF и DDP. Складиште у САД у Монтклеру у Калифорнији за дистрибуцију у Северној Америци.'
    - 'Маркетиншка подршка: Каталози производа, фотографије, техничка документација и дигитални материјали за подршку вашим продајним напорима.'
    - 'Обука и подршка: Обука о производима за ваш продајни тим, техничка подршка за ваше купце и координација гаранцијског сервиса.'
content_process:
  tagline: 'Како постати партнер'
  title: 'Једноставан процес партнерства'
  subtitle: 'Наш процес партнерства је једноставан — дизајниран да брзо почнете да продајете afarer производе.'
  items:
    - title: 'Корак 1: Поднесите пријаву'
      description: 'Попуните наш образац за пријаву партнера са профилом ваше компаније, циљним тржиштем и интересовањима за производе.'
    - title: 'Корак 2: Преглед квалификације'
      description: 'Наш тим за партнерства прегледа вашу пријаву и контактира вас у року од 3 радна дана како би разговарали о могућностима.'
    - title: 'Корак 3: Споразум и подешавање'
      description: 'Потпишите споразум о партнерству, отворите свој рачун и добијте партнерске цене, маркетиншке материјале и узорке производа.'
    - title: 'Корак 4: Обука и лансирање'
      description: 'Обезбеђена је обука о производима, продајна подршка и маркетиншки материјали. Спремни сте да почнете са продајом.'

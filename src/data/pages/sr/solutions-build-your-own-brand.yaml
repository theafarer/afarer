meta:
  title: 'Производња SUP плоча под приватном ознаком и лансирање прилагођеног бренда | {SITE}'
  description: 'Произвођач SUP плоча под приватном ознаком за нове брендове плоча за веслање. Лансирајте свој бренд SUP плоча са afarer — потпуна OEM/ODM услуга укључујући дизајн, прототипове, прилагођено брендирање, производњу и глобалну логистику.'

hero:
  tagline: 'Изградите сопствени бренд'
  title: 'Лансирајте сопствени<br />бренд SUP плоча'
  subtitle: 'Ви имате визију. Ми имамо фабрику, стручност и ланац снабдевања. Производња SUP плоча под приватном ознаком и развој прилагођеног бренда SUP плоча — заједно ћемо изградити бренд који се истиче.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Прилагођено брендирана SUP плоча на води'

process:
  title: 'Пут вашег бренда'
  subtitle: 'Од идеје до тржишта у 5 фаза.'
  steps:
    - phase: 'Фаза 1'
      title: 'Идеја'
      period: 'Недеља 1-2'
      items:
        - 'Истраживање тржишта и анализа конкуренције'
        - 'Дефинисање циљних купаца'
        - 'Радионица позиционирања бренда'
        - 'Стратегија линије производа'
    - phase: 'Фаза 2'
      title: 'Дизајн'
      period: 'Недеља 3-6'
      items:
        - 'Облик плоче и графички дизајн'
        - 'Усклађивање боја и избор материјала'
        - 'Спецификација опреме'
        - 'Дизајн паковања и етикета'
    - phase: 'Фаза 3'
      title: 'Прототип'
      period: 'Недеља 7-10'
      items:
        - 'Производња узорка'
        - 'Тестирање квалитета (притисак, пловност, UV)'
        - 'Прилагођавања дизајна'
        - 'Коначно одобрење'
    - phase: 'Фаза 4'
      title: 'Производња'
      period: 'Недеља 11-14'
      items:
        - 'Серијска производња'
        - 'Контрола квалитета (по јединици)'
        - 'Поморски / ваздушни терет'
        - 'Документи за царинско збрињавање'
    - phase: 'Фаза 5'
      title: 'Лансирање'
      period: 'Недеља 15-16'
      items:
        - 'Фотографије производа'
        - 'Фид производа за веб-сајт'
        - 'Маркетиншки материјали'
        - 'Подршка при лансирању'


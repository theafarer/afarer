faqs_sup:
  title: 'Честа питања о SUP даскама'
  subtitle: 'Честа питања о нашим даскама за стојеће веслање.'
  columns: 2
  items:
    - title: 'Које величине SUP дасака afarer нуди?'
      description: 'Нудимо SUP даске од 9 ft до 12 ft, покривајући све — од компактних универзалних дасака до дасака за туринг и специјалних дизајна. Сваки модел је доступан са више опција конфигурације.'
    - title: 'Која је разлика између надувне и чврсте SUP даске?'
      description: 'Надувна SUP даска користи drop-stitch конструкцију са хиљадама унутрашњих конца који омогућавају висок притисак ваздуха, док чврста SUP даска користи епокси или фиберглас. Надувне SUP даске нуде преносивост и погодност складиштења без жртвовања крутости.'
    - title: 'Колика је граница тежине за SUP даске?'
      description: 'Наше SUP даске подржавају до 150 kg у зависности од модела и запремине. Свака страница производа наводи максималну носивост за ваш конкретан модел.'
    - title: 'Да ли су afarer SUP даске CE сертификоване?'
      description: 'Да. Сви рекреативни SUP модели сертификовани су CE према важећим европским стандардима за рекреативну употребу.'
    - title: 'Колика је гаранција на SUP даске?'
      description: 'Све afarer SUP даске долазе са стандардном једногодишњом гаранцијом против производних дефеката, која покрива отказ шава, дефекте вентила и одвајање материјала при нормалној употреби.'
    - title: 'Колико времена је потребно за надувавање SUP даске?'
      description: 'Помоћу прилагодне ручне пумпе потпуно надувавање на 15 PSI траје приближно 8–12 минута. За брже надувавање препоручујемо нашу afarer 12V електричну пумпу, која надува даску за мање од 4 минута.'

faqs_materials:
  title: 'Честа питања о материјалима и одржавању SUP дасака'
  subtitle: 'Честа питања о материјалима, одржавању и складиштењу наших надувних SUP дасака.'
  columns: 2
  items:
    - title: 'Који материјали се користе у afarer надувним SUP даскама?'
      description: 'Користимо војни PVC (1100 денера) са UV-стабилизованом конструкцијом отпорном на хабање, у складу са прописима ЕУ REACH и RoHS.'
    - title: 'Колико трају надувне SUP даске?'
      description: 'Уз правилно одржавање, квалитетна надувна SUP даска од PVC-а траје 5–10 година. Редовно чишћење, UV заштита и правилно складиштење значајно продужавају век употребе.'
    - title: 'Какво одржавање је потребно за надувну SUP даску?'
      description: 'Основно одржавање укључује испирање слатком водом након сваке употребе (посебно у сланој води), сушење пре складиштења, годишњу проверу заптивки вентила и избегавање дуготрајне изложености сунчуевој светлости када се даска не користи.'
    - title: 'Да ли се надувне SUP даске могу користити у сланој води?'
      description: 'Да. Све afarer надувне SUP даске дизајниране су и за слатку и за слану воду. Препоручујемо испирање слатком водом и темељно сушење након излагања сланој води.'
    - title: 'Како да складиштим надувну SUP даску?'
      description: 'Испустите ваздух, очистите и потпуно осушите даску пре складиштења. Уваљајте је слободно (избегавајте чврсто савијање), складиштите на хладном и сувом месту даље од директне сунчеве светлости и држите је подаље од бетонских подова како бисте спречили упијање влаге.'
    - title: 'Колики је капацитет тежине afarer надувних SUP дасака?'
      description: 'Носивост се креће од 100 kg за наше најмање моделе до преко 200 kg за веће даске. Свака страница производа наводи максималну носивост за ваш конкретан модел.'


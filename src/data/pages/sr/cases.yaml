features3_cases:
  tagline: 'Истакнути случајеви'
  title: 'Прилагођена решења<br />за стварне изазове'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Флота европског центра за роњење'
      customer: BlueMed Diving Centers
      country: 'Грчка'
      industry: 'Роњење и морски туризам'
      challenge: 'Био је потребан 12 SUP плоча конфигурисаних за роњење за ланац центара за роњење на више грчких острва. Свака плоча је требала прилагођене носаче опреме, простор за 8 боца и стабилну платформу за улазак рониоца у отворену воду. Флота је морала стићи у року од 60 дана за почетак туристичке сезоне.'
      solution: 'Произведено 12 модела SUP Voyager Dive са интегрисаним носачима опреме, стабилним платформама и екстра широком Drop-Stitch израдом за стабилност при укрцавању. Свака плоча је брендирана бојама флоте купца. Све 12 плоча тестирано је на притисак и послато из Ћингдаоа у року од 55 дана.'
      product: SUP Voyager Dive
      results: 'Све 12 плоча испоручено је на време за туристичку сезону. Флота је у свакодневној операцији 18+ месеци без једног отказа материјала. Купац је наручио 6 додатних јединица у другој години.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive је окосница наших свакодневних операција роњења. Стабилност је одлична, а распоред складиштења опреме одржава палубу чистом и безбедном за наше госте.'
      icon: tabler:lifebuoy
    - title: 'Програм заједничког брендирања са аустралијским дистрибутером'
      customer: Pacific Watersports Pty Ltd
      country: 'Аустралија'
      industry: 'Програм заједничког брендирања и партнерства'
      challenge: 'Аустралијском дистрибутеру била је потребна линија SUP плоча са приватном ознаком по конкурентним ценама како би се такмичио са кинеским брендовима који продају директно потрошачима. Било је потребно 8 јединствених модела од почетничког до напредног нивоа, са прилагођеном графиком, прилагођеним паковањем и директном испоруком у малопродајне објекте.'
      solution: 'Развијено је 8 SUP модела (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) са ексклузивним аустралијским графичким пакетом. Прилагођено малопродајно паковање са QR кодовима који воде до видео снимака за подешавање. Логистика директне испоруке конфигурисана је из Ћингдаоа директно у аустралијске малопродајне радње.'
      product: 'Прилагођена SUP линија (8 модела)'
      results: 'Од концепта до прве пошиљке за 90 дана. Малопродајна стопа продаје од 85% у првој сезони. Дистрибутер је проширио партнерство додатним SUP моделима у другој години.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer је испоручио комплетну SUP линију за 90 дана — од почетног дизајна до малопродајних полица. Квалитет одговара брендовима који се продају по двоструко вишој цени.'
      icon: tabler:currency-dollar
    - title: 'Испорука опреме за спашавање на Блиском истоку'
      customer: Национална управа за цивилну одбрану
      country: 'Уједињени Арапски Емирати'
      industry: 'Претрага и спашавање'
      challenge: 'Организацији цивилне одбране било је потребно 20 SUP плоча спремних за патролу за обалну претрагу и спашавање, обезбеђење лука и одговор на поплаве. Биле су потребне плоче велике видљивости, комплетна безбедносна опрема и усклађеност са локалним поморским прописима.'
      solution: 'Испоручено је 20 модела SUP Patrol са наранџастом Drop-Stitch израдом велике видљивости, комплетним безбедносним пакетима, SOLAS рефлективном траком и ојачаном израдом. Свака плоча је CE сертификована и тестирана према примењивим стандардима. Документациони пакет укључивао је сертификате усклађености за локалну регистрацију.'
      product: SUP Patrol
      results: 'Флота је распоређена на 5 обалних станица. Плоче раде у екстремној врућини (45°C+) без деградације. Перформансе и издржљивост су премашиле спецификације.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol је премашио наше оперативне захтеве. У условима екстремне врућине, плоче не показују знаке UV деградације након 24 месеца свакодневне употребе.'
      icon: tabler:alert-triangle
    - title: 'Европско партнерство заједничког брендирања'
      customer: North Sea Marine Equipment BV
      country: 'Холандија'
      industry: 'Програм заједничког брендирања и партнерства'
      challenge: 'Утврђени европски морски бренд желео је да се прошири на SUP тржиште без улагања у производне погоне. Био му је потребан партнер за производњу под приватном ознаком способан да произведе 5 SUP модела (од 9 ft до 12 ft) са приватним брендирањем, CE сертификацијом и ексклузивним правима дистрибуције у EU.'
      solution: 'Успостављен је уговор о производњи под приватном ознаком за 5 SUP модела. Сваки модел је брендиран логотипима и палетом боја купца. Документација CE сертификације припремљена је за сваки модел. Ексклузивна права дистрибуције у EU додељена су са обавезама минималних поруџбина. Техничка документација обезбеђена је за локалну сервисну мрежу.'
      product: 'Прилагођена SUP линија (5 модела)'
      results: 'Потписан је вишегодишњи уговор. Прва производна серија од 50 јединица испоручена је у року од 75 дана. Бренд је лансиран на великом сајму са позитивним пријемом код дилера.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Сарадња са брендом afarer омогућила нам је да уђемо на SUP тржиште без градње фабрике — испоручили су комплетно решење кључ у руке са CE сертификацијом и документацијом за подршку дилерима.'
      icon: tabler:building
    - title: 'Флота карипског одморалишта'
      customer: Paradise Island Resorts Ltd
      country: 'Бахами'
      industry: 'Морски туризам и угоститељство'
      challenge: 'Луксузном одморалишту била је потребна комплетна флота опреме за водене спортове за активности гостију: 40 SUP плоча за вођене туре, 20 додатних SUP плоча за истраживање лагуне, 10 SUP плоча за излете гостију, плус опрема. Сва опрема је требала прилагођено брендирање одморалишта и морала је бити испоручена пре врхунца туристичке сезоне.'
      solution: 'Произведен је комплетан SUP пакет: 40 плоча SUP Voyager (модел All-Around), 20 плоча SUP Explorer, 10 плоча SUP Touring, плус PFD уређаји, весла, пумпе и комплети за поправку. Сва опрема је штампана логотипом одморалишта и тропском палетом боја. Пошиљка у контејнерима са комплетном листом инвентара.'
      product: 'Комплетан SUP пакет (70+ јединица)'
      results: 'Флота је стигла 6 недеља пре врхунца сезоне. Оцене задовољства гостију за активности водених спортова порасле су 40% у односу на претходну годину. Опрема траје 3 сезоне уз само рутинско одржавање.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Приступ комплетног пакета значио је да смо све што нам је било потребно добили у једној пошиљци — плоче и опрема, све брендирано и спремно за употребу гостију. Нашим гостима се допада квалитет опреме.'
      icon: tabler:beach
    - title: 'Уговор о обалној патроли у САД'
      customer: Atlantic Coastal Security Agency
      country: 'Сједињене Државе'
      industry: 'Поморска безбедност и спровођење закона'
      challenge: 'Америчкој агенцији за обалну безбедност биле су потребне изузетно издржљиве патролне SUP плоче за операције на отвореној води. Биле су потребне плоче високих перформанси са опремом војних спецификација и усклађеношћу са прописима Обалске страже САД.'
      solution: 'Конструисан је SUP Patrol са ојачаном Drop-Stitch израдом, палетима боја велике видљивости, носачима опреме за шифрирану комуникацију и интегрисаним тачкама за качење опреме. Плоче су ојачане за тешке операције. Обезбеђена је USCG документација о усклађености.'
      product: SUP Patrol
      results: 'Агенција је пријавила 95% стопу спремности мисија током првих 12 месеци. Додатна поруџбина је наручена за 8 јединица.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol пружа нашим посадама перформансе потребне за операције на отвореној води. Ојачана израда обезбеђује кључну издржљивост без угрожавања управљивости.'
      icon: tabler:shield

rd_services:
  tagline: 'Прилагођени R&D'
  title: 'R&D услуге за партнере'
  services:
    - title: 'Развој прилагођених материјала'
      desc: 'Развијамо прилагођене формулације тканина, стекове ламината и системе лепкова прилагођене вашем радном окружењу и циљевима перформанси.'
    - title: 'OEM / ODM инжењеринг производа'
      desc: 'Развијамо прилагођене формулације тканина, стекове ламината и системе лепкова прилагођене вашем радном окружењу и циљевима перформанси.'
    - title: 'Тестирање и сертификација треће стране'
      desc: 'Користите наше тест објекте у складу са ISO стандардима за независно тестирање материјала, валидацију производа и подршку сертификацији.'
  cta: 'Разговор о вашим R&D захтевима →'
  cta_link: /contact

vision:
  tagline: 'Наша визија'
  title: 'Обликовање будућности водених спортова'
  body: 'afarer настоји да води индустрију надуваних SUP плоча кроз континуиране иновације, непоколебљив квалитет и чврсту посвећеност безбедности и одрживости — чиме на крају обогаћује искуства љубитеља водених спортова широм света. afarer R&D центар је место где се страст сусреће са иновацијама, постављајући нове стандарде за индустрију водених спортова.'

labs_section:
  tagline: 'Лабораторије'
  title: 'Наше лабораторије'
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: 'Лабораторија за PVC тканине'
      description: 'Континуирано истраживање и тестирање PVC тканина за палубе на затезну чврстоћу, UV отпорност, отпорност на абразију и флексибилност на ниским температурама ради дугорочне поузданости у морским окружењима.'
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 'Студијо за инжењеринг трупа'
      description: 'CAD дизајн и анализа коначних елемената трупова од HDPE-а, алуминијума и стаклопластике. Сваки труп се дигитално симулира на расподелу напрезања и отпорност на удар пре израде првог прототипа.'
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: 'Центар за RF заваривање'
      description: 'Наменски објекат за заваривање радио-фреквенцијом са прецизном контролом температуре и притиска, који производи шавове велике чврстоће непропустљиве за ваздух у складу са стандардима морске индустрије за надувана пловила.'
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 'Хидродинамички испитни базен'
      description: 'Тестирање модела у размери у нашем интерном испитном базену ради оптимизације облика трупа, перформанси глисирања, стабилности и ефикасности у широком опсегу услова оптерећења и стања мора.'
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: 'Радионица прототипова'
      description: 'Објекат за израду и опремање прототипова у пуној величини где се нови модели граде, опремају и тестирају на мору. Сваки прототип пролази тест програм у води од најмање 20 сати пре одобрења производње.'
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 'Лабораторија за квалитет и контролу'
      description: 'Наменска лабораторија за осигурање квалитета која спроводи тестирање затезања, циклусе задржавања ваздуха, тестове лепљења шавова и сертификацију материјала како би се осигурало да свака плоча која напушта радионицу испуњава наше објављене спецификације.'
      href: /randdcenter/quality-inspection-lab

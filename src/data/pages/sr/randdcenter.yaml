meta:
  title: 'R&D центар | {SITE}'
  description: 'Истраживање и развој — тестирање PVC тканина, инжењеринг трупа, RF заваривање, хидродинамичко тестирање и контрола квалитета. Доступне су прилагођене R&D услуге.'

hero:
  tagline: 'R&D центар'
  title: 'R & D центар'
  subtitle: 'Усмерен на напредак'

intro:
  - 'Истраживачко-развојни (R&D) центар бренда afarer покретачка је снага наше мисије да револуционаришемо опрему за водене спортове. Љубитеље водених спортова широм света опремамо безбеднијим, удобнијим и пријатнијим производима кроз непрестане иновације у надуваним плочама за стојеће веслање (SUP). Наш посвећени тим инжењера, дизајнера и страствених стручњака за водене спортове обликује будућност индустрије, непрестано подижући летвицу квалитета, перформанси и одрживости.'
  - 'Наш R&D објекат окупља научнике из области материјала, поморске инжењере и инжењере производње под једним кровом. Од формулације тканине и симулације трупа до развоја процеса заваривања и испитивања на мору у пуној величини, сваку фазу развоја производа покрећу подаци, а потврђују тестови.'

mission:
  tagline: 'Наша мисија'
  title: 'Иновирање будућности водених спортова'
  pillars:
    - icon: lightning
      title: 'Технолошки напредак'
      desc: 'Пионирски приступ новим материјалима, дизајну и производњи ради супериорних перформанси и дуговечности производа.'
    - icon: design
      title: 'Дизајн усмерен на корисника'
      desc: 'Дубоко разумевање и превазилажење потреба корисника кроз ергономски и интуитиван дизајн производа.'
    - icon: globe
      title: 'Одрживе праксе'
      desc: 'Минимизирање нашег утицаја на животну средину коришћењем еколошки прихватљивих материјала и процеса.'
    - icon: shield
      title: 'Безбедност без компромиса'
      desc: 'Обезбеђивање највиших стандарда безбедности кроз ригорозно тестирање и сертификацију.'

pillars:
  - title: 'Технолошки напредак'
    desc: 'Пионирски приступ новим материјалима, дизајну и производним процесима ради супериорних перформанси и дуговечности производа.'
    icon: tech
  - title: 'Напредни материјали'
    desc: 'Истраживање најсавременијих PVC материјала, композита и одрживих алтернатива ради побољшаних карактеристика производа.'
    icon: materials
  - title: 'Одрживост'
    desc: 'Основна обавеза: Посвећени смо бризи о животној средини кроз одрживу производњу и материјале који се могу рециклирати.'
    icon: sustainability

capabilities:
  tagline: 'Могућности'
  title: 'R&D могућности'
  subtitle: 'Четири кључне дисциплине које нам дају потпуну контролу над развојем производа — од истраживања сировина до коначне сертификације.'
  groups:
    - title: 'Наука о материјалима и технологија тканина'
      items:
        - 'Анализа и оптимизација PVC формулација'
        - 'UV стабилизација, спречавање запаљивости и развој антимикробних адитива'
        - 'Вишеслојно ламинање тканина и инжењеринг лепљења'
        - 'Тестирање убрзаног старења (UV, топлотно, влажност, слани спреј)'
    - title: 'Инжењеринг трупа и хидродинамика'
      items:
        - 'Параметарски 3D дизајн трупа и CFD оптимизација'
        - 'Анализа коначних елемената за структурна и ударна оптерећења'
        - 'Тестирање модела у размери у базену за вучу и потврда перформанси'
        - 'Развој прилагођених трупова за специјалне профиле мисија'
    - title: 'Технологија заваривања и спајања'
      items:
        - 'Развој и оптимизација процеса RF диелектричног заваривања'
        - 'Методе заваривања топлим ваздухом, врућим клином и ултразвуком'
        - 'Лепљење лепковима и квалификовање трака за шавове'
        - 'Моделовање чврстоће завара и предвиђање животног века'
    - title: 'Тестирање, сертификација и усклађеност'
      items:
        - 'Управљање квалитетом и тестирање CE усклађености'
        - 'Независно тестирање треће стране и подршка сертификацији'
        - 'Развој прилагођених тест протокола за квалификацију у набави'
        - 'Анализа отказа у употреби и истраживање основних узрока'


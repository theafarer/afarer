content_html: |
  <h2>Три стандардне дебљине</h2>

  <h3>4" (10 cm) – Туринг и перформансе</h3>
  <ul>
    <li>Највећа крутост – мање савијања под оптерећењем</li>
    <li>Најлакше – мање материјала, мања запремина ваздуха</li>
    <li>Одлично вођење – смањено љуљање са стране на страну</li>
    <li>Најбрже – смањен отпор, лакше клизање</li>
    <li>Најбоље за: Туринг, трке, фитнес веслање, искушне веслаче</li>
  </ul>

  <h3>5" (12.7 cm) – Универзално</h3>
  <ul>
    <li>Добра крутост – избалансиран однос флека и крутости</li>
    <li>Умерена тежина – стандардна потрошња материјала</li>
    <li>Добра примарна + секундарна стабилност</li>
    <li>Најбоље за: Рекреативно веслање, почетнике, опуштену употребу на језерима и рекама</li>
  </ul>

  <h3>6" (15.2 cm) – Стабилност и јога</h3>
  <ul>
    <li>Највећа примарна стабилност – огромна пловност</li>
    <li>Најтеже – више PVC материјала, већа запремина ваздуха</li>
    <li>Најспорије – већи отпор, теже одржавање клизања</li>
    <li>Најбоље за: Јогу/фитнес, тешке веслаче (100+ kg), веома таласне услове</li>
  </ul>

  <h2>Инжењерска анализа</h2>
  <p>Крутост надувне SUP даске одређена је унутрашњим притиском ваздуха и моментом инерције попречног пресека даске. При 20 PSI, даска од 4" показује приближно 30% мање савијања под оптерећењем од даске од 6" исте ширине и дужине. Примарна стабилност потиче од ширине водене линије и пловности; на секундарну стабилност утичу облик рубова и ширина даске.</p>

  <h2>Дебљина према тежини веслача</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Тежина веслача</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Препоручена дебљина</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Испод 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" или 6"</td></tr>
      <tr><td class="p-3 border">Преко 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Однос дебљине и PSI</h2>
  <p>Честа заблуда је да виши PSI може надокнадити прекомерну дебљину. При 25 PSI, даска од 6" показује више флека од даске од 4" при 15 PSI јер геометријски момент инерције доминира једначином крутости. За веслаче оријентисане на перформансе, тања даска при нижем притиску надмашује дебљу даску при вишем притиску.</p>

  <h2>Afarer линија</h2>
  <ul>
    <li><strong>Даске од 4":</strong> Cheetah Touring серија – 12' x 30" x 4" туринг SUP даске за фитнес и веслање на даљину</li>
    <li><strong>Даске од 5":</strong> Cheetah All-Round серија – 10'6" x 32" x 5" за рекреативну употребу</li>
    <li><strong>Даске од 6":</strong> Cheetah Ultra-Stable серија – 10' x 34" x 6" за јогу, велике веслаче и фотографске платформе</li>
  </ul>
  <p>Све даске користе 1,680 DTEX drop-stitch језгра са номиналним притиском од 20 PSI и 1.2 mm PVC ламинатима.</p>


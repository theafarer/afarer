stories:
  tagline: 探索者故事
  title: 來自真實人物的真實冒險
  subtitle: 聽聽使用afarer裝備在水上活動的劃槳者、家庭和專業人員的親身經歷。
  items:
    - name: Sarah 和 Mike
      title: SUP Explorer 11擁有者，加拿大
      content: 我們帶著Explorer 11在阿爾岡金公園進行了一週之旅。它們完美地應對了搬運和湖泊穿越。滴塑結構讓我們可以充氣到15 PSI，從可打包的板子獲得硬板的性能。
      image: https://assets.afarer.com/images/afarer/products/afarer-sup-allround-board.webp
      location: 阿爾岡金公園，加拿大
    - name: Carlos R.
      title: Cheetah Surge騎手，西班牙
      content: Cheetah Surge是我沿海巡遊的首選。鮮豔的設計在沙灘上引人注目，穩定性讓我在輕波中充滿信心。無論是旅行還是欣賞日落，它都表現出色。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1.webp
      location: 布拉瓦海岸，西班牙
    - name: Lina和家人
      title: Flowing Lotus劃槳者，瑞典
      content: 週末在群島上的家庭冒險。Flowing Lotus足夠穩定，我女兒可以站在上面而我在劃槳。不到10分鐘充氣完畢——不需要拖車，只有純粹的水上家庭樂趣。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1.webp
      location: 斯德哥爾摩群島，瑞典
    - name: Andres中校
      title: Ocean Voyager探險家，菲律賓
      content: 我用我的Ocean Voyager在巴拉望周圍進行長距離沿海旅行。在熱帶條件下每天使用數月後，板子仍然像新的一樣。旅行形狀能切開那些會阻止較弱板子的波浪。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      location: 巴拉望，菲律賓
    - name: Emma T.
      title: Tropical Breeze初學者，澳大利亞
      content: 我以前從未玩過SUP。Tropical Breeze非常穩定，我第一次嘗試就充滿信心。現在我每個週末都劃。學習曲線基本為零——而且板子在水上看起來很棒。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1.webp
      location: 黃金海岸，澳大利亞

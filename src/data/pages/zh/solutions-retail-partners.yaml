meta:
  title: SUP 零售合作夥伴計畫 | {SITE}
  description: 成為 Afarer 零售合作夥伴。完整產品線、專業行銷素材、代發貨選項，以及為 SUP 零售商提供的具競爭力利潤。
hero:
  tagline: 零售合作夥伴
  title: 成為 Afarer<br />零售合作夥伴
  subtitle: 在您的市場銷售成長最快的 SUP 品牌。完整產品線、專業行銷素材、代發貨選項，以及合理的利潤空間。
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: 零售店展示的 Afarer SUP 板
margin_section:
  title: Retail Margins & MOQ
  subtitle: Wholesale pricing tiers designed for retail profitability.
  items:
    - tier: Basic Partner
      discount: 20%
      moq: 500 units/yr
      margin_note: ~$150–250 profit per board
      features:
        - Access to full product line
        - Marketing materials package
        - Email support
        - Product catalog access
    - tier: Premium Partner
      discount: 30%
      moq: 2,000+ units/yr
      margin_note: ~$250–400 profit per board
      features:
        - Dedicated account manager
        - Exclusive territory protection
        - Custom marketing support
        - First access to new products
        - Staff training sessions
    - tier: Flagship Partner
      discount: 35%+
      moq: 5,000+ units/yr
      margin_note: ~$350–500+ profit per board
      features:
        - Co-branded marketing campaigns
        - In-store display support
        - On-site staff training
        - Joint social media promotions
        - Priority production allocation
product_line:
  title: 完整產品線
  subtitle: 適合每位進門顧客的 SUP 板。
  items:
    - name: 全能系列
      description: 熱銷款 — 適合 80% 顧客
    - name: 旅行系列
      description: 性能划槳者 — 較高利潤
    - name: 瑜珈系列
      description: 利基市場 — 高定價
    - name: 兒童系列
      description: 家庭顧客 — 回購率高
    - name: 競速系列
      description: 愛好者市場 — 品牌光環
    - name: 配件
      description: 高利潤附加產品（槳、救生衣、打氣筒、背包）

meta:
  title: '技術 — Drop-Stitch 與船用 PVC | {SITE}'
  description: 'Afarer 的技術：Drop-Stitch 結構、船用 PVC、雙層結構與高壓充氣。來自專業充氣式 SUP 板製造商的創新。'
  keywords:
    - 'SUP 技術'
    - 'Drop-Stitch 結構'
    - '高壓 SUP'
    - '充氣式 SUP 材料'
hero:
  tagline: 技術
  title: 我們的技術
  subtitle: afarer 產品採用先進材料和創新工程技術設計，提供卓越的性能、耐用性和便攜性。
sections:
  - title: 核心技術
    description: 數千條內部聚酯縫線連接上下兩層，在 12-15 PSI 下形成剛性結構。這正是專業槳板與充氣式競速 SUP 所使用的相同技術。
    imageAlt: DS Core Diagram
  - title: 船舶級 PVC
    description: 專為船用環境設計的多層複合 PVC 布料。每一層皆以熱融合焊接而非膠合，徹底消除分層風險。並通過抗紫外線、耐海水腐蝕與耐磨損測試。
    imageAlt: PVC Layer
  - title: Military-Grade PVC
    description: 所有 SUP 型號均採用高級 PVC，提供優異的抗紫外線與耐化學性。在極端溫度下仍保持彈性並抵抗劣化。
    imageAlt: PVC
  - title: Air Deck Floor
    description: 高壓充氣式織點芯材結構，為站立、釣魚與瑜珈提供卓越的剛性。同時縮短組裝時間、降低整體重量與收納體積。
    imageAlt: Air Deck

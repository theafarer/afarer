hero:
  tagline: 技術
  title: 我們的技術
  subtitle: afarer 產品採用先進材料和創新工程技術設計，提供卓越的性能、耐用性和便攜性。
sections:
  - title: 核心技術
    description: Thousands of internal polyester threads connect the top and bottom layers, creating a rigid structure at 12-15 PSI. This is the same technology used in professional paddle boards and inflatable racing SUPs.
    imageAlt: DS Core Diagram
  - title: 船舶級 PVC
    description: Multi-layer laminated PVC fabric rated for marine environments. Each layer is fusion-welded rather than glued, eliminating delamination risks. Tested for UV resistance, saltwater corrosion, and abrasion.
    imageAlt: PVC Layer
  - title: Military-Grade PVC
    description: Used on all SUP models, premium PVC provides superior UV and chemical resistance. Maintains flexibility in extreme temperatures and resists degradation.
    imageAlt: PVC
  - title: Air Deck Floor
    description: High-pressure inflatable drop-stitch construction providing exceptional rigidity for standing, fishing, and yoga. Reduces setup time, overall weight, and storage volume.
    imageAlt: Air Deck

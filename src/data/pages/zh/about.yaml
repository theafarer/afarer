features3_what_we_build:
  title: 我們的產品
  subtitle: 一條我們瞭如指掌的專注產品線——沒有半成品實驗，沒有貼牌工程。
  columns: 3
  isBeforeContent: true
  items:
    - title: SUP 槳板
      description: 9 至 12 英尺充氣 SUP 槳板。適用於旅行、瑜伽、釣魚和家庭使用。
      icon: tabler:ship
    - title: 充氣 SUP
      description: 9 至 12 英尺 PVC 充氣 SUP 槳板。輕巧、堅固、易於收納。
      icon: tabler:speedboat
    - title: 高級 SUP 套裝
      description: 緊湊、高規格的 SUP，根據您的品牌或船隊需求定製。
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: 配件
      description: 槳、打氣筒、保護套、防水袋和電子配件。全部與我們的槳板匹配。
      icon: tabler:package
    - title: 改裝與維修
      description: 廠內管道更換、電子設備改造和發動機升級。
      icon: tabler:tool
    - title: 定製建造
      description: 為商業、科研和軍用客戶提供逐項目定製設計。
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: 船體設計與工程研討
steps2_values:
  title: 我們的價值觀
  subtitle: 從第一天起就塑造每個產品的三項原則。
  items:
    - title: 像承載自己家人一樣打造
      description: 每個船體、焊縫和緊固件都如同為家人打造。
      icon: tabler:heart
    - title: 先工程後銷售
      description: 如果規格有誤，我們改規格——而不是改客戶。
      icon: tabler:settings
    - title: 比保修更持久的支持
      description: 二十年前的船體仍會向我們訂購備件，我們依然接聽電話。
      icon: tabler:headset
steps2_milestones:
  title: 里程碑
  subtitle: afarer 故事的簡版。
  isReversed: true
  items:
    - title: 在沿海車間創立
      description: 由兩位船舶建築師以一台 CNC 銑床和一個固執的想法起步。
      icon: tabler:building-factory
    - title: 首批 1,000 船體已交付
      description: 在第七年達成，主要依靠口碑和回頭客。
      icon: tabler:circle-check
    - title: 國際出口計劃
      description: 現已發貨至 40 多個國家，在五大洲擁有本地化支持合作伙伴。
      icon: tabler:world
features2_locations:
  title: 我們的位置
  tagline: 找到我們
  columns: 3
  items:
    - title: 總部與車間
      description: 沿海工業園區，4 號樓——週一至週五開放，參觀請預約。
    - title: 歐盟服務中心
      description: 地中海港口——為歐洲客戶提供改裝、維修和保修支持。
    - title: 亞太合作伙伴網絡
      description: 在澳大利亞、日本、新加坡和香港設有授權服務合作伙伴。

meta:
  title: '關於 Afarer — 充氣式 SUP 板與水上運動品牌 | {SITE}'
  description: 'Afarer 是全球充氣式 SUP 板與水上運動品牌，由 Aquafarer LLC（美國）營運，並由我們的青島營運團隊打造。歡迎了解我們的故事、工程技術、認證品質與國家合作夥伴計劃。'
  keywords:
    - '充氣式 SUP 板品牌'
    - '水上運動品牌'
    - '國家 SUP 經銷商'
    - '聯名 SUP 系列'
hero:
  tagline: 關於我們
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer 工廠及車間
  title: |
    海洋工程，<br />
    以 <span class="text-accent dark:text-white">afarer</span> 的方式打造
  subtitle: '我們從一間沿海車間起步，只有一艘船和一個堅定的信念：海洋產品應當被認真對待，因為它們至關重要。如今我們的產品銷往 40 多個國家，但每一副船體仍由創辦團隊的雙手親手把關。'
stats:

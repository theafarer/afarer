hero:
  tagline: 關於我們
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer 工廠及車間
  title: |
    船舶工程，<br />
    以 <span class="text-accent dark:text-white">afarer</span> 的方式打造
  subtitle: 我們在一間沿海車間裡起步，只有一條船和一個執著的信念：船用產品應當以認真的態度來製造——因為它們確實關乎生命。如今，我們發貨到 40 多個國家，但每一條船體仍然經過創始團隊親手把關。
stats:
  title: 數據一覽
  columns: 4
  stats:
    - title: 已交付船體
      amount: 2,400+
    - title: 已發貨國家
      amount: '40'
    - title: 累計經驗年限

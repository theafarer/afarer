timeline:
  - year: '2012'
    title: 海洋製造基礎
    body: afarer 始於中國青島的一家專業充氣艇作坊，致力於海洋工藝和充氣艇製造。早期重點是通過實際工程經驗和製造紀律打造可靠的充氣產品。
  - year: '2015'
    title: 首次出口和 CE 認證
    body: 首批出口訂單抵達日本和韓國。核心產品線獲得 CE 認證，標誌著 afarer 進入國際市場。公司開始服務中國以外的商業和休閒用戶。
  - year: '2018'
    title: 工廠擴建
    body: 搬遷至 12,000 平方米的生產設施。新增 RF 焊接線和滴塑生產線，實現更大規模生產和改進的質量控制系統。
  - year: '2020'
    title: 研發中心成立
    body: 設立專用研發中心，配備 PVC 面料實驗室、水動力測試槽和 CAD/FEA 仿真工作室。產品開發重點轉向輕量化結構、改進耐用性和以用戶為中心的設計。
  - year: '2022'
    title: 認證與全球增長
    body: 獲得 ISO 9001 認證。研發團隊擴展至 14 人，員工總數達 200 人以上。產品通過分銷商和 OEM 合作進入歐洲、美洲和亞太市場。
  - year: '2024'
    title: 創新與設計工作室
    body: 推出全流程設計和創新工作室，提供從概念到生產的定製 ODM 項目。加強了專業海洋應用，包括救援、商業和政府項目。
  - year: '2026'
    title: 構建水上探索的未來
    body: 今天，afarer 繼續開發充氣船、SUP 系統和定製化海洋解決方案，連接全球用戶與水上世界。服務 50 多個國家，年產能 15,000 件以上。
content_founding:
  tagline: 創業之初
  title: 誕生於水岸
  subtitle: afarer 始於青島的一個沿海作坊，僅有一艘船和一個願景：製造能夠應對真實海洋環境的充氣艇。
  paragraphs:
    - 2012 年，我們的創始人發現市場存在空白——大多數充氣船要麼價格低廉但不可靠，要麼質量上乘但價格昂貴。他們相信存在一個既能提供品質又能保證價值的製造商空間。
    - 第一艘船體純手工打造，在當地水域測試，並根據漁民和小型商業運營商的反饋不斷改進。這種"製造、測試、傾聽、改進"的反饋循環至今仍是我們的工程哲學核心。
    - 到 2015 年，afarer 的名聲已傳遍青島之外。國際分銷商開始索取樣品。最初的小作坊正在成為全球供應商。
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer 早期生產車間和製造場景
content_growth:
  tagline: 成長與創新
  title: 從作坊到 12,000 平方米工廠
  subtitle: 持續對人員、設備和流程的投資已將 afarer 打造成現代化海洋製造企業。
  paragraphs:
    - 隨著需求的增長，我們的設施也在不斷擴大。從一個小作坊發展為 12,000 平方米的工廠，擁有充氣船、SUP 艇、SUP 板和配件的專用生產線。
    - 我們投資了 CNC 切割機、高頻焊接設備、滴塑生產線和全面的測試設備，使我們能夠控制生產質量的每一個環節。
    - 如今，我們 200 多人的團隊包括海洋工程師、材料科學家、質量控制專家和熟練工匠——其中許多人自 afarer 創業初期就加入公司。
philosophy:
  tagline: 品牌理念
  title: 水上自由工程
  body: 水上自由不僅僅是移動。它代表著發現新地方、創造戶外體驗、連接人與自然以及實現專業使命。工程讓這種自由成為可能。
  pillars:
    - title: 可靠性優先
      body: 水上環境需要信任。afarer 產品圍繞穩定性、耐用性、安全性和一致性能而設計。
    - title: 以人為本的設計
      body: 產品應服務於人，而非技術。每個設計決策都始於理解人們如何使用船艇、在哪裡探索以及面臨什麼挑戰。
    - title: 觸手可及的探索
      body: 水域不應僅屬於專家。afarer 創造讓更多人能夠安全體驗江河湖海和沿海環境的裝備。
    - title: 持續創新
      body: 創新不僅是創造新產品。它關乎改進每一個細節——材料、結構、製造和用戶體驗。
engineeringDna:
  tagline: 工程基因
  title: afarer 如何打造產品
  areas:
    - title: 材料科學
      body: afarer 專注於為不同海洋環境選擇合適的材料。關鍵考慮因素包括耐磨性、耐紫外線性、壓力穩定性和長期耐用性。
      items:
        - 耐磨性
        - 耐紫外線
        - 壓力穩定性
        - 長期耐用
    - title: 結構工程
      body: 充氣艇需要在剛性、重量、便攜性和穩定性之間達到精確平衡。afarer 工程團隊通過滴塑核心技術和先進接縫結構優化這些因素。
      items:
        - 剛性
        - 重量優化
        - 便攜性
        - 穩定性
    - title: 製造精度
      body: 每件產品都經過可控流程：材料準備、精密切割、焊接粘合、組裝、質量檢驗和性能驗證。
      items:
        - 材料準備
        - 精密切割
        - 焊接粘合
        - 組裝質檢
    - title: 應用場景工程
      body: 產品圍繞實際應用開發——休閒、探險和專業使用——確保每種設計滿足其預期環境的特定需求。
      items:
        - 休閒
        - 探險
        - 專業
        - 商業

intro: 船體是任何 RIB 或充氣船的結構核心。它必須足夠輕以實現高效的滑行，足夠強以吸收衝擊載荷，並在寬廣的溫度範圍內保持尺寸穩定。在 {SITE.name}，我們的船體工程實驗室結合先進的 CAD 建模、有限元素分析 (FEA) 及數十年實務船舶建築經驗，交付針對特定任務優化的船體——而非從型錄中套用的通用形狀。
content_html: |
  <h2>強度與流體動力學的完美結合</h2>
  <p>我們使用三種主要船體材料——迴轉成型 HDPE、焊接海洋級鋁合金與手工鋪設玻璃纖維——並具備於內部設計、模擬與驗證每一種材料的工程能力。</p>

  <h2>設計工具與標準</h2>
  <p>我們的數位工程環境包括：</p>
  <table>
    <thead><tr><th>能力</th><th>軟體 / 工具</th><th>應用</th></tr></thead>
    <tbody>
      <tr><td>3D 參數化建模</td><td>SolidWorks Professional</td><td>船體曲面、縱骨系統、引擎支架、甲板配置</td></tr>
      <tr><td>有限元素分析</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>應力分佈、模態分析、碰撞／衝擊模擬</td></tr>
      <tr><td>計算流體力學</td><td>Ansys Fluent / Star-CCM+</td><td>流體阻力預測、縱傾最佳化</td></tr>
      <tr><td>層壓工程</td><td>ESAComp / CADEC</td><td>玻璃纖維鋪層、芯材選用、重量估算</td></tr>
      <tr><td>模具流動模擬</td><td>Moldex3D</td><td>迴轉成型壁厚預測</td></tr>
    </tbody>
  </table>

  <h2>我們的工程流程</h2>
  <p>每個船體設計，無論是標準型號或完全客製專案，皆遵循嚴謹的五階段流程：</p>
  <ol>
    <li><strong>概念與需求收集</strong> — 我們與您會面，共同定義載荷、速度包線、海況能力、拖曳需求，以及任何特殊任務設備（甲板艙口、操控台位置、油箱整合）。</li>
    <li><strong>3D 曲面與靜水力計算</strong> — 船體造型在 SolidWorks 中建模，並使用內建分析工具檢查靜水力穩定性（GM、復原力臂）。</li>
    <li><strong>結構有限元素分析（FEA）</strong> — 定義各負載工況：靜態（船員＋裝備）、動態（5g 下的滑行衝擊）及砰擊（從 3 m/s 波峰掉落）。審查應力分佈；安全係數 ≥ 2.5 為強制要求。</li>
    <li><strong>CFD 阻力最佳化</strong> — 船體在三種載重狀態與五種速度下進行模擬。濕表面積、縱傾角與剩餘阻力經反覆迭代逐步降低。</li>
    <li><strong>設計審查與放行</strong> — 完整工程文件包（3D 模型、FEA 報告、CFD 報告、重量估算、鋪層目錄）在放行至原型車間前，由我們的首席船舶工程師審查。</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA 應力分佈 — RIB 450 巡邏船體（鋁合金 5083）</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">最大載荷下的安全係數</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">相較上一代降低阻力</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">峰值砰擊壓力（設計極限）</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">2025 年累計 FEA 運算時數</span>
      </div>
    </div>
  </div>

  <h2>客製化：您的船體，您作主</h2>
  <p>沒有任何兩位營運商的需求完全相同。港口巡邏 RIB 需要淺Ｖ型船體以確保低速穩定性；快速攔截艇需要配備噴濺導軌的深Ｖ型船體；潛水支援船需要寬橫樑與低艉板。我們不會將您的應用硬塞進既有的船體形狀，而是從您的規格出發向上設計。</p>
  <p>近期客製船體工程專案範例：</p>
  <ul>
    <li>為加勒比海旅遊業者打造的加長型 6.8 公尺 HDPE 船體，配備強化船首以利沙灘登岸（底板厚度 +15 %）。</li>
    <li>為海岸警衛隊打造的輕量化鋁合金 7.2 公尺 RIB，配備整合式油箱隔板與裝備櫃加強筋。</li>
    <li>玻璃纖維 5.5 公尺潛水艇，採用降低式艉板與雙電池箱，專為浮潛者輕鬆回船而設計。</li>
  </ul>

  <h2>我們的工程團隊</h2>
  <p>本實驗室由一位在高速船艇設計領域擁有 14 年經驗的首席船舶工程師主持，另有兩位專精於 FEA 與 CFD 的機械工程師協力。三位皆取得國際知名大學的輪機工程或船舶工程高等學位。該團隊定期於產業期刊發表論文，並在「高性能船艇國際會議」（International Conference on High-Performance Marine Vehicles）等研討會上發表演說。</p>

  <h2>攜手打造您的下一艘船體</h2>
  <p>從第一張概念草圖到最終應力報告，我們的船體工程實驗室是您打造船艇的合作夥伴——這艘船不僅是被建造出來，更是被精心工程設計。我們在前期投入模擬時數，讓每一道焊縫、每一層積層，以及船體的每一條曲線皆有存在的理由。</p>
  <p>無論您需要對現有型號進行小幅修改，或是完全從零開始的設計，我們隨時準備與您討論需求。</p>

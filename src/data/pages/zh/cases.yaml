features3_cases:
  tagline: 精選案例
  title: 定製解決方案<br />應對真實挑戰
  isBeforeContent: false
  columns: 3
  items:
    - title: 歐洲潛水中心船隊
      description: 向地中海潛水中心連鎖店供應 12 艘 SUP 520 潛水配置船。定製氣瓶架、潛水梯和船隊標識。60 天內交付。
      icon: tabler:lifebuoy
    - title: 澳大利亞分銷商 OEM 項目
      description: 為一家澳大利亞水上運動分銷商開發自有品牌 SUP 槳板系列。8 個型號，定製包裝，代發物流。從概念到首次發貨 90 天。
      icon: tabler:currency-dollar
    - title: 中東救援船供應
      description: 向中東民防組織供應 20 艘 SUP 450 Patrol 巡邏艇。自排水甲板、全套導航設備、高可見度橙色氣管。符合當地監管標準。
      icon: tabler:alert-triangle
    - title: 歐洲 OEM 品牌合作
      description: 與歐洲船艇品牌的白標製造合作。5 款 SUP 型號，自有品牌，歐盟市場獨家經銷權。多年協議。
      icon: tabler:building
    - title: 加勒比度假村船隊
      description: 加勒比度假村全套水上運動裝備包：40 塊 SUP 槳板、20 艘皮划艇、10 艘充氣船及配件。所有裝備定製度假村品牌標識。
      icon: tabler:beach
    - title: 美國海岸巡邏合同
      description: 向美國海岸安全機構供應 SUP 600 巡邏艇。雙發動機配置、裝甲控制台選項、軍用級電子集成。
      icon: tabler:shield

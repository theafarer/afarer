features3_cases:
  tagline: 精選案例
  title: 定製解決方案<br />應對真實挑戰
  isBeforeContent: false
  columns: 3
  items:
    - title: 歐洲潛水中心船隊
      customer: BlueMed 潛水中心
      country: 希臘
      industry: 潛水與海洋旅遊
      challenge: 希臘多座島嶼的連鎖潛水中心需要 12 塊潛水專用配置的 SUP 板。每塊板都需要定製裝備掛載點、可存放 8 個氣瓶的空間，以及供潛水員於開放水域登板的穩定平台。整個船隊需在旅遊旺季開始前的 60 天內送達。
      solution: 生產了 12 款 SUP Voyager Dive 型號，配備整合式裝備架、穩定平台及加寬 drop-stitch 結構以確保登板穩定性。每塊板面均印有客戶船隊識別圖樣。全部 12 塊板均通過壓力測試，並在 55 天內從青島發貨。
      product: SUP Voyager 潛水板
      results: 全部 12 塊板於旅遊旺季前如期交付。船隊已連續日常運作 18 個月以上，材料零故障。客戶於第二年追加訂購 6 塊。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Voyager Dive 一直是我們日常潛水作業的核心裝備。其穩定性極佳，裝備收納佈局使甲板保持整潔，為我們的客人提供安全的使用環境。
      icon: tabler:lifebuoy
    - title: 澳大利亞分銷商 OEM 項目
      customer: Pacific Watersports 有限公司
      country: 澳大利亞
      industry: OEM/ODM 製造
      challenge: 澳大利亞分銷商需要以具競爭力的價格推出自有品牌 SUP 板系列，以便與中國直銷消費品牌競爭。要求涵蓋從入門到進階的 8 款獨特型號，並配備客製圖案、客製包裝，以及直送零售通路的 drop-ship 出貨服務。
      solution: 開發了 8 款 SUP 型號（全能型、旅行型、瑜伽型、兒童型、運動型、超緊湊型、超穩定型、激流型），配備澳洲獨家圖案套件。自訂零售包裝附 QR code 連結至組裝教學影片。從青島直發澳洲零售店的 drop-ship 物流配置。
      product: 定製 SUP 產品線（8 款型號）
      results: 從概念到首批出貨僅用 90 天。首季零售售罄率達 85%。經銷商在第二年擴大合作範圍，增加更多 SUP 型號。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: afarer 在 90 天內交付了完整的 SUP 產品線——從初始設計到零售上架。品質可媲美售價兩倍的競爭品牌。
      icon: tabler:currency-dollar
    - title: 中東救援設備供應
      customer: 國家民防局
      country: 阿拉伯聯合酋長國
      industry: 搜索與救援
      challenge: 民防組織需要 20 塊具備巡邏能力的 SUP 板，用於沿海搜救、港口保安及洪水應急。要求高辨識度板面、完整安全設備，並符合當地海事法規。
      solution: 供應 20 塊 SUP Patrol 型號，採用高辨識度橙色 drop-stitch 結構，配備完整安全裝備、SOLAS 反光貼條及強化構造。每塊板均通過 CE 認證並依適用標準進行測試。文件包內含在地註冊所需的合規證書。
      product: SUP Patrol 巡邏板
      results: 船隊已部署至 5 個沿海站點。板面在極端高溫（45°C 以上）環境下運作，未出現任何性能退化。性能與耐用性均超越規格要求。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Patrol 超越了我們的作業需求。在極端高溫條件下，經過 24 個月的每日使用，板面未出現任何紫外線退化的跡象。
      icon: tabler:alert-triangle
    - title: 歐洲 OEM 品牌合作
      customer: 北海船舶設備公司
      country: 荷蘭
      industry: OEM/ODM 製造
      challenge: 一家成熟的歐洲海洋品牌希望在無須投資製造設施的情況下進軍 SUP 市場，需要一位能生產 5 款 SUP 型號（9 ft 至 12 ft）的白牌合作伙伴，並提供自有品牌、CE 認證及歐盟獨家經銷權。
      solution: 簽訂 5 款 SUP 型號的白牌製造協議。每款型號均印製客戶標誌並採用客戶配色方案。為每款型號準備 CE 認證文件。授予歐盟獨家經銷權，並附最低訂購承諾。同時提供技術文件，支援當地服務網絡。
      product: 定製 SUP 產品線（5 款型號）
      results: 簽訂多年期合作協議。首批 50 件在 75 天內出貨。品牌於大型貿易展會亮相，獲得經銷商熱烈迴響。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: 與 afarer 合作讓我們無需建造工廠即可進入 SUP 市場——他們交付了完整的 turnkey 解決方案，涵蓋 CE 認證與經銷商支援文件。
      icon: tabler:building
    - title: 加勒比度假村船隊
      customer: 天堂島度假村有限公司
      country: 巴哈馬
      industry: 海洋旅遊與酒店業
      challenge: '豪華度假村需要一套完整的水上運動裝備船隊，以供賓客活動使用：40 塊 SUP 板用於導覽行程、額外 20 塊 SUP 板用於潟湖探索、10 塊 SUP 板用於賓客出遊，另含配件。所有裝備皆需印製度假村客製品牌標識，並須在旅遊旺季到來前交付。'
      solution: '生產完整 SUP 套裝：40 塊 SUP Voyager 板（全能型）、20 塊 SUP Explorer 板、10 塊 SUP Touring 板，另含 PFD、槳、泵及維修套件。所有設備均印有度假村標誌與熱帶色彩主題。整櫃裝運並附完整庫存清單。'
      product: 完整 SUP 套裝（70+ 件）
      results: 船隊在旺季前 6 週送達。水上運動活動的客人滿意度評分年增 40%。設備歷經 3 個季度僅需常規保養。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: 完整套裝方案意味著我們在一次出貨中就收到了所有所需裝備——板面與配件均已印製品牌標識並可直接提供客人使用。我們的客人非常滿意設備品質。
      icon: tabler:beach
    - title: 美國海岸巡邏合同
      customer: 大西洋海岸安全局
      country: 美國
      industry: 海上安全與執法
      challenge: 美國沿海安全機構需要重型巡邏 SUP 板用於外海作業。要求高性能板面、軍規設備，並符合美國海岸防衛隊法規。
      solution: 設計製造 SUP Patrol，採用強化 drop-stitch 結構、高辨識度色彩方案、加密通訊設備安裝座及整合式設備掛載點。板面經強化處理以應對重型作業需求。提供 USCG 合規文件。
      product: SUP Patrol 巡邏板
      results: 該機構報告首 12 個月的任務就緒率達 95%。已追加訂購 8 台。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Patrol 為我們的團隊提供了外海作業所需的卓越性能。強化結構帶來關鍵的耐用性，同時不影響操控表現。
      icon: tabler:shield

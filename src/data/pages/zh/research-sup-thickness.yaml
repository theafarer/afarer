hero:
  tagline: 工程
  title: 如何選擇 SUP 厚度 — 工程分析
  subtitle: 閱讀時間：6 分鐘
content_html: |
  <h2>三種標準厚度</h2>

  <h3>4 吋（10 cm）— 旅行與性能型</h3>
  <ul>
    <li>最高剛性 — 負載下彎曲最小</li>
    <li>最輕 — 材料更少、空氣體積更小</li>
    <li>優異航向穩定性 — 減少左右搖晃</li>
    <li>最快 — 阻力更小，滑行更輕鬆</li>
    <li>最適合：旅行、競速、健身划槳、經驗豐富的划槳者</li>
  </ul>

  <h3>5 吋（12.7 cm）— 全能型</h3>
  <ul>
    <li>剛性良好 — 彎曲與剛度的平衡比例</li>
    <li>重量適中 — 標準材料用量</li>
    <li>初級與次級穩定性均佳</li>
    <li>最適合：休閒划槳、初學者、湖泊與河流一般使用</li>
  </ul>

  <h3>6 吋（15.2 cm）— 穩定性與瑜珈型</h3>
  <ul>
    <li>最高初級穩定性 — 浮力極佳</li>
    <li>最重 — 更多 PVC 材料，更大空氣體積</li>
    <li>最慢 — 阻力更大，維持滑行較困難</li>
    <li>最適合：瑜珈/健身、體重較重者（100 kg 以上）、非常波浪的環境</li>
  </ul>

  <h2>工程分析</h2>
  <p>充氣 SUP 的剛性由內部氣壓和板身截面的慣性矩決定。在 20 PSI 下，4 吋板在負載下的彎曲量比相同寬度和長度的 6 吋板減少約 30%。初級穩定性來自水線寬度和浮力；次級穩定性則受邊條形狀和板寬影響。</p>

  <h2>依體重選擇厚度</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">划槳者體重</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">建議厚度</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">65 kg 以下（143 lbs）</td><td class="p-3 border">4 吋</td></tr>
      <tr><td class="p-3 border">65 – 90 kg（143 – 198 lbs）</td><td class="p-3 border">5 吋</td></tr>
      <tr><td class="p-3 border">90 – 115 kg（198 – 253 lbs）</td><td class="p-3 border">5 吋或 6 吋</td></tr>
      <tr><td class="p-3 border">115 kg 以上（253 lbs）</td><td class="p-3 border">6 吋</td></tr>
    </tbody>
  </table>

  <h2>厚度與 PSI 的權衡</h2>
  <p>一個常見的誤解是較高的 PSI 可以補償過大的厚度。在 25 PSI 下，6 吋板的彎曲量仍然大於 15 PSI 下的 4 吋板，因為幾何慣性矩在剛性方程式中佔主導地位。對於注重性能的划槳者來說，較低壓力下的較薄板在性能上優於較高壓力下的較厚板。</p>

  <h2>Afarer 產品系列</h2>
  <ul>
    <li><strong>4 吋板：</strong>Cheetah Touring 系列 – 12' x 30" x 4" 旅行 SUP，適合健身與長距離划槳</li>
    <li><strong>5 吋板：</strong>Cheetah All-Round 系列 – 10'6" x 32" x 5" 休閒使用</li>
    <li><strong>6 吋板：</strong>Cheetah Ultra-Stable 系列 – 10' x 34" x 6" 適合瑜珈、體重較重者及攝影平台</li>
  </ul>
  <p>所有板身均採用 1,680 DTEX 織點芯材，額定壓力 20 PSI，搭配 1.2 mm PVC 貼合。</p>

  subtitle: '閱讀時間：12 分鐘'

content_html: |
  <h2>1. 資格預審：工廠應具備的條件</h2>

  <h3>合規證書</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – 品質管理系統</li>
    <li><strong>CE 認證</strong> – 確認指定機構編號</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – 社會合規稽核</li>
    <li><strong>REACH / RoHS</strong> – 材料合規聲明</li>
  </ul>

  <h3>製造能力</h3>
  <ul>
    <li>織點芯材內部編織 vs. 外包</li>
    <li>PVC 塗佈 / 貼合生產線</li>
    <li>RF 焊接與熱風焊接設備</li>
    <li>內部模具製造（CNC 加工）</li>
    <li>測試實驗室（壓力測試、UV 老化、拉伸測試）</li>
  </ul>

  <h3>經驗驗證</h3>
  <ul>
    <li>充氣船製造年資（至少 5 年以上）</li>
    <li>在職工程師人數</li>
    <li>現有 OEM/ODM 客戶（要求提供推薦）</li>
    <li>出口目的地——是否已出貨至您的目標市場？</li>
  </ul>

  <h2>2. 品質管控流程</h2>
  <p>材料進料品管：拉伸強度（ASTM D751 或 ISO 1421）、抗撕裂強度（ASTM D2261 或 ISO 4674）、黏合強度、UV 老化抽檢。</p>
  <p>製程品管：每 50 件監測接縫強度、氣閥扭力驗證、織點芯材織線密度檢查、依 CAD 圖紙進行尺寸檢查。</p>
  <p>最終檢驗：100% 充氣保壓測試（24 小時，壓降不超過 5%）、目視檢查、氣閥功能測試、隨機抽樣測試（依 ISO 2859 AQL 2.5 或 4.0）。</p>

  <h2>3. 合規文件核對清單</h2>
  <ul>
    <li>引用正確歐盟指令的符合性聲明（DoC）</li>
    <li>指定機構出具的 CE 證書</li>
    <li>認可實驗室的測試報告</li>
    <li>材料安全數據表（MSDS）</li>
    <li>REACH 合規聲明</li>
    <li>含供應商追溯資訊的材料清單</li>
    <li>工廠檢驗報告</li>
  </ul>

  <h2>4. MOQ 談判</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">產品類型</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">標準 MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">可談範圍</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP 板</td><td class="p-3 border">50 – 100 件</td><td class="p-3 border">5 – 10 件（試單）</td></tr>
      <tr><td class="p-3 border">獨木舟</td><td class="p-3 border">50 – 100 件</td><td class="p-3 border">5 – 10 件（試單）</td></tr>
      <tr><td class="p-3 border">充氣船</td><td class="p-3 border">50 – 100 件</td><td class="p-3 border">2 – 5 件（試單）</td></tr>
      <tr><td class="p-3 border">RIB 充氣艇</td><td class="p-3 border">20 – 50 件</td><td class="p-3 border">2 – 5 件（試單）</td></tr>
      <tr><td class="p-3 border">安全 / 配件</td><td class="p-3 border">200 – 500 件</td><td class="p-3 border">50 – 100 件（試單）</td></tr>
    </tbody>
  </table>

  <h2>5. 物流與運輸</h2>
  <p>常用 Incoterms：<strong>FOB</strong>（工廠送達出發港 – 最常見）、<strong>EXW</strong>（買方自行安排從工廠門口的全部運輸）、<strong>CIF</strong>（工廠支付運費及保險至目的港）。</p>
  <p>充氣產品屬於低重量、高體積商品——體積重量（DIM）通常決定運費。要求使用真空壓縮包裝可減少 50–60% 體積。從中國到歐盟的海運：25–35 天；到美國西岸：15–20 天。</p>

  <h2>6. 常見陷阱</h2>
  <ul>
    <li><strong>未進行工廠稽核：</strong>務必自行執行或委託第三方稽核（QIMA、SGS、Bureau Veritas）</li>
    <li><strong>僅有口頭規格：</strong>需有雙方簽署的詳細技術規格書</li>
    <li><strong>跳過樣品確認：</strong>量產前需書面簽署樣品核准</li>
    <li><strong>生產中無品管：</strong>生產中（DUPRO）及出貨前（PSI）進行第三方檢驗</li>
    <li><strong>忽略合規：</strong>量產前確認 CE/UKCA 認證</li>
  </ul>

  <h2>7. 為什麼選擇 Afarer</h2>
  <p>Afarer 自 2012 年起從事 OEM/ODM 充氣船製造。擁有 12,000 平方公尺 ISO 9001 認證廠房、25 名以上工程師，全產品線通過 CE 認證，滿足本指南中的每一項標準。我們為新合作夥伴提供試單 MOQ 及完整合規文件套件。</p>


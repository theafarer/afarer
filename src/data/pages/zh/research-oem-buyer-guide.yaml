hero:
  tagline: 採購
  title: OEM 採購指南 — 從亞洲採購充氣船艇
  subtitle: 閱讀時間：12 分鐘
content_html: |
  <h2>1. 前置資格審查：工廠該看哪些重點</h2>

  <h3>合規證書</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – 品質管理系統</li>
    <li><strong>CE 認證</strong> – 查驗公告機構編號</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – 社會合規審核</li>
    <li><strong>REACH / RoHS</strong> – 材料合規聲明</li>
  </ul>

  <h3>製造能力</h3>
  <ul>
    <li>織點芯材為自行織造還是委外</li>
    <li>PVC 塗層／貼合產線</li>
    <li>RF 焊接與熱風焊接設備</li>
    <li>自有模具製造（CNC 加工）</li>
    <li>測試實驗室（壓力測試、UV 老化、拉伸測試）</li>
  </ul>

  <h3>經驗查證</h3>
  <ul>
    <li>充氣船艇製造年資（至少 5 年以上）</li>
    <li>在職工程師人數</li>
    <li>現有 OEM/ODM 客戶（索取推薦名單）</li>
    <li>出口目的地 – 是否已出貨至您的目標市場？</li>
  </ul>

  <h2>2. 品質控管流程</h2>
  <p>進料品管：拉伸強度（ASTM D751 或 ISO 1421）、抗撕裂性（ASTM D2261 或 ISO 4674）、黏合強度、UV 老化抽檢。</p>
  <p>製程品管：每 50 件監測接縫強度、氣閥扭力查驗、織點芯材縫線密度檢查、依 CAD 圖面進行尺寸檢查。</p>
  <p>最終檢驗：100% 充氣保持測試（24 小時，最大壓降 5%）、外觀檢查、氣閥功能測試、隨機抽樣測試（依 ISO 2859，AQL 2.5 或 4.0）。</p>

  <h2>3. 合規文件檢查清單</h2>
  <ul>
    <li>載明正確歐盟指令的符合性聲明（DoC）</li>
    <li>公告機構核發的 CE 證書</li>
    <li>認可實驗室的測試報告</li>
    <li>物質安全資料表（MSDS）</li>
    <li>REACH 合規聲明</li>
    <li>具供應商可追溯性的物料清單</li>
    <li>工廠檢驗報告</li>
  </ul>

  <h2>4. MOQ 談判</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">產品類型</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">標準 MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">可議範圍</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP 槳板</td><td class="p-3 border">50 – 100 件</td><td class="p-3 border">5 – 10 件（試單）</td></tr>
      <tr><td class="p-3 border">獨木舟</td><td class="p-3 border">50 – 100 件</td><td class="p-3 border">5 – 10 件（試單）</td></tr>
      <tr><td class="p-3 border">充氣船</td><td class="p-3 border">50 – 100 件</td><td class="p-3 border">2 – 5 件（試單）</td></tr>
      <tr><td class="p-3 border">RIB 艇</td><td class="p-3 border">20 – 50 件</td><td class="p-3 border">2 – 5 件（試單）</td></tr>
      <tr><td class="p-3 border">安全／配件</td><td class="p-3 border">200 – 500 件</td><td class="p-3 border">50 – 100 件（試單）</td></tr>
    </tbody>
  </table>

  <h2>5. 物流與運輸</h2>
  <p>常見的國際貿易條件：<strong>FOB</strong>（工廠交貨至啟運港 – 最常見）、<strong>EXW</strong>（買方自行安排自工廠出貨的所有運輸）、<strong>CIF</strong>（工廠支付至目的港的運費與保險）。</p>
  <p>充氣產品重量輕、體積大 – 體積重（DIM）往往是運費的決定因素。要求真空包裝可將體積減少 50–60%。從中國至歐盟的海運：25–35 天；至美國西岸：15–20 天。</p>

  <h2>6. 常見陷阱</h2>
  <ul>
    <li><strong>未做工廠審核：</strong>務必自行執行或委託第三方審核（QIMA、SGS、Bureau Veritas）</li>
    <li><strong>僅有口頭規格：</strong>應備有雙方簽署的詳細技術規格書</li>
    <li><strong>略過樣品確認：</strong>量產前須對樣品書面簽核</li>
    <li><strong>生產期間無人品管：</strong>生產期間（DUPRO）與出貨前（PSI）安排第三方檢驗</li>
    <li><strong>忽視合規：</strong>生產前查驗 CE/UKCA 認證</li>
  </ul>

  <h2>7. 為何選擇 Afarer</h2>
  <p>Afarer 自 2012 年起即從事 OEM/ODM 充氣船艇製造。我們擁有 12,000 m&sup2; 的 ISO 9001 認證廠區、25 位以上工程師，且全產品線均通過 CE 認證，完全符合本指南的每一項標準。我們為新合作夥伴提供試單 MOQ 及完整的合規文件包。</p>

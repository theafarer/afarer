hero_text:
  tagline: 聯繫方式
  title: 聯繫我們
contact_form:
  id: form
  title: 發送消息
  subtitle: 如需報價、技術諮詢或合作垂詢，請給我們留言。我們會在一個工作日內回覆。
  email_to: info@afarer.com
  submit_button: 發送消息
  success_message: 謝謝！您的消息已收到。我們會在一個工作日內回覆。
  error_message: 發送消息時出錯。請重試或直接給我們發送郵件。
  default_country_code: '+1'
  captcha:
    label: 反垃圾：請解答以下問題
  fields:
    - name: country
      label: 名字
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: 姓氏
      row: 2
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: customization
      label: 公司
      row: 3
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: productInterest
      label: 地址
      row: 4
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: firstName
      label: 郵政編碼
      row: 1
      step: 2
    - name: lastName
      label: 國家
      row: 1
      step: 2
    - name: companyName
      label: 郵箱
      row: 2
      step: 2
    - name: email
      label: 電話
      row: 3
      type: email
      step: 2
    - name: tel
      label: 預估訂單量
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: 需要定製嗎？
      row: 4
      step: 2
    - name: zip
      label: 感興趣的產品類別
      row: 5
      step: 2
    - name: subject
      label: 主題
      row: 1
      step: 3
    - name: message
      label: 留言
      row: 2
      type: textarea
      rows: 6
      step: 3

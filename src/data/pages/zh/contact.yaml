meta:
  title: '聯絡我們 — 合作與產品諮詢 | {SITE}'
  description: '如有合作、品牌共創與自有品牌相關諮詢，或專業船隊需求，歡迎聯繫 Afarer。作為充氣式 SUP 板與充氣船製造商，我們會在 2 個工作天內回覆。'
  keywords:
    - '聯絡 Afarer'
    - 'SUP 分銷商報價'
    - '專業 SUP 供應商'
    - 'SUP 製造商聯繫'
hero_text:
  tagline: 聯繫方式
  title: 聯繫我們
contact_form:
  id: form
  title: 發送消息
  subtitle: 如需報價、技術諮詢或合作垂詢，請給我們留言。我們會在一個工作日內回覆。
  email_to: info@afarer.com
  submit_button: 發送消息
  success_message: 謝謝！您的消息已收到。我們會在一個工作日內回覆。
  error_message: 發送消息時出錯。請重試或直接給我們發送郵件。
  default_country_code: '+1'
  captcha:
    label: 反垃圾：請解答以下問題
  fields:
    - name: country
      label: 名字
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: 姓氏
      row: 2
      type: select
      options:
        - value: ''
          label: 請選擇您的預估訂單量...
        - value: sample
          label: 僅樣品／原型
        - value: 5-10
          label: 5–10 件（標準 MOQ）
        - value: 100-500
          label: 100–500 件
        - value: 500-plus
          label: 500+ 件（量大優惠價）
      step: 1
    - name: customization
      label: 公司
      row: 3
      type: select
      options:
        - value: ''
          label: 請選擇定製類型...
        - value: none
          label: 標準產品（無需定製）
        - value: logo
          label: 僅需客製標誌 / 品牌
        - value: full
          label: 完整品牌共創（尺寸、顏色、圖形、包裝）
        - value: consultation
          label: 不確定——需要諮詢
      step: 1
    - name: productInterest
      label: 地址
      row: 4
      type: select
      options:
        - value: ''
          label: 請選擇產品類別...
        - value: all
          label: 全部產品／完整型錄
        - value: sup
          label: SUP 板／立槳板
        - value: safety
          label: 安全裝備／救生衣
        - value: accessory
          label: 配件（打氣筒、槳、袋）
      step: 1
    - name: firstName
      label: 郵政編碼
      row: 1
      step: 2
    - name: lastName
      label: 國家
      row: 1
      step: 2
    - name: companyName
      label: 郵箱
      row: 2
      step: 2
    - name: email
      label: 電話
      row: 3
      type: email
      step: 2
    - name: tel
      label: 預估訂單量
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: 需要定製嗎？
      row: 4
      step: 2
    - name: zip
      label: 感興趣的產品類別
      row: 5
      step: 2
    - name: subject
      label: 主題
      row: 1
      step: 3
    - name: message
      label: 留言
      row: 2
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: 其他聯繫方式
  columns: 3
  items:
    - title: 銷售諮詢
      description: 報價、配置、經銷商申請和大宗訂單。
      icon: tabler:shopping-bag
    - title: 技術支持
      description: 保修、維修、配件和操作問題。
      icon: tabler:tool
    - title: 媒體與合作伙伴
      description: 媒體資料包、贊助和行業合作。
      icon: tabler:news
    - title: 電話
      description: +86 13305324192
      icon: tabler:headset
    - title: 郵箱
      description: info@afarer.com
      icon: tabler:mail
    - title: 總部地址
      description: Economic Development Zone, Laixi, Qingdao, China, 266600
      icon: tabler:map-pin
map:
  title: 我們的位置
  subtitle: 歡迎光臨總部

  headline: 海事安全與國防用充氣船 — OEM 製造 | afarer
  description: 'afarer 為海事安全與國防應用製造充氣船：海岸巡邏、部隊防護、快速應變與安全作業。採用 Hypalon 與 PVC 構造，獲得 CE 認證，並提供 MIL-SPEC 配置。'

hero:
  tagline: 實驗室 05
  title: 原型車間
  subtitle: 從 CAD 模型到就緒出海——建造、裝配並驗證
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
  image_alt: afarer 原型車間船艇製造
intro: 無論 CAD 模型多麼精細，在實際入水之前都無法真正展現船艇的操控表現。這正是我們原型車間存在的意義——盡快且精準地將工程數據轉化為實體海上船艇。每一款新的 {SITE.name} 型號——以及每一個重要的客製建造——在投入量產模具之前，都必須經過這個車間的洗禮。
content_html: |
  <h2>設計化為現實之處</h2>
  <p>車間配備完善，可同時進行船體、氣囊與舾裝的製造。這種平行作業流程可將原型交期從工程發佈算起縮短至 8-12 週，相較於業界常態的 16-20 週。當您的應用需要特殊化解決方案時，我們能在三個月內從概念邁入水上實測驗證。</p>

  <h2>車間能力</h2>
  <table>
    <thead><tr><th>工作站</th><th>設備</th><th>用途</th></tr></thead>
    <tbody>
      <tr><td>船體製造</td><td>旋轉成型爐（HDPE）、TIG 焊接站（鋁）、手積層模具（玻璃纖維）</td><td>三種材質的全尺寸船體生產</td></tr>
      <tr><td>氣囊組裝</td><td>RF 高頻焊接壓床、熱風點固工作站、充氣測試治具</td><td>製作含所有隔艙、錐體與閥門的全尺寸氣囊總成</td></tr>
      <tr><td>舾裝與安裝</td><td>引擎吊架（500 kg）、操控台實木模型架、液壓管壓接鉗、線束板</td><td>完整配備：引擎、操舵、控制系統、燃油系統、電子設備、座椅</td></tr>
      <tr><td>儀器區</td><td>GPS 速度感測器、燃油流量計、加速度計、熱電偶陣列、數據記錄器</td><td>海上試航儀器的安裝與校正</td></tr>
    </tbody>
  </table>

  <h2>原型開發流程 — 逐步解析</h2>
  <ol>
    <li><strong>工程交接</strong> — 設計資料包（3D 模型、FEA 報告、物料清單、積層排程）由車間負責人與專案工程師正式審查。任何製造疑慮都會在開料前提出並解決。</li>
    <li><strong>船體生產</strong> — 依工程規範建造船體。HDPE：旋轉成型程式由 Moldex3D 模擬結果載入。鋁：CNC 切割板材依核准的焊接圖在 TIG 站焊接。玻璃纖維：依積層書逐層施工。</li>
    <li><strong>氣囊製造</strong> — 以 CNC 圖案模板裁切布材，再以 RF 高頻焊接成全尺寸氣室。每個氣室充氣至測試壓力，並靜置 24 小時進行初期穩定化。</li>
    <li><strong>組裝與舾裝</strong> — 船體與氣囊完成對接。掛上引擎，連接操舵與控制系統，安裝燃油系統，所有電路完成配線並通過驗證。</li>
    <li><strong>靜態測試</strong> — 船艇下水前須通過：浮力檢查（滿載 + 30 % 備用浮力）、燃油系統壓力測試、操舵系統全鎖死循環測試、電氣接地導通測試。</li>
    <li><strong>海上試航計畫</strong> — 20 小時的水上測試，詳述如後。</li>
    <li><strong>原型審查</strong> — 與工程、生產及品質團隊召開正式的簽核會議。所有必要的設計變更皆記錄在案，並納入量產版本。</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20 小時海上試航計畫 — 測試時程</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">港口操縱 — 低速操控、倒車、碰墊檢查</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">速度測試 — GPS 驗證的最高速度、巡航速度，以及 3 個轉速點的油耗</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">迴轉測試 — 在 20 kn 下量測戰術直徑、前進距離與橫移距離，左右舷均測</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">拍擊測試 — 在 0.5–1.0 m 碎浪中重複航行；加速度計安裝於操舵座椅底座</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">穩定性測試 — 4 名船員加裝備偏置於右舷時的靜態橫傾角量測</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">續航測試 — 以巡航速度連續航行 3 小時；監測溫度（引擎、燃油、電氣系統）</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">最終檢查 — 試航後全面檢查所有系統，鎖緊／檢查所有緊固件，並記錄發現</span>
      </div>
    </div>
  </div>

  <h2>特殊應用的客製原型</h2>
  <p>原型車間正是我們解決標準量產船型無法應對之問題的地方。近期案例包括：</p>
  <ul>
    <li>為搜救機構打造的一艘 7.8 m RIB，需要具防滾保護的客製艙體結構、整合式擔架固定座，以及船艏安裝的聲納吊艙 — 全部在我們的廠區完成原型製作、安裝與測試。</li>
    <li>為水文測量承包商打造的一艘 5.2 m 充氣艇，配備降低式艉板、可拆卸儀器桅杆，以及船體貫穿孔式換能器凹槽，皆為減少水流擾動而設計。</li>
    <li>為超級遊艇打造的電動驅動 4.5 m 交通艇，在客戶確認訂購四艘船隊之前，以原型驗證續航里程、充電基礎設施與噪音水準。</li>
  </ul>

  <h2>我們的原型製作團隊</h2>
  <p>車間由八位技能多元的船舶技術人員組成，每一位皆在三大核心領域（船體、氣囊、舾裝）中至少交叉受訓兩項。團隊負責人是一位資深造船師，擁有 16 年從客製單艘打造到量產系列的豐富經驗。每個原型專案都會指派一位專屬專案工程師，在整個建造與試航過程中作為客戶的單一聯絡窗口。</p>

  <h2>客戶參與</h2>
  <p>我們積極鼓勵客戶參與原型建造期間的關鍵里程碑 — 尤其是初期舾裝審查與海上試航。您在這些階段的實際操作回饋，對於船艇進入量產前的細部調整具有無可取代的價值。我們不是在真空中造船；我們是與您攜手合作。</p>
  <p>這 20 小時的海上試航同時也是您的團隊熟悉船艇操控、系統配置與保養需求的機會，確保量產船交付後能順利銜接日常使用。</p>

hero:
  tagline: '技術'
  title: '織點芯材如何運作 — 充氣硬核的工程原理'
  subtitle: '閱讀時間：8 分鐘'

content_html: |
  <h2>什麼是織點芯材？</h2>
  <p>織點芯材（亦稱「織點織物」或「織點芯層」）是一種結構方法，數千條獨立聚酯纖維線連接織物外殼的頂層和底層。當外殼充氣時，這些織線充當內部拉力構件——它們阻止頂層和底層向外膨脹成圓形，迫使板面保持平坦和堅硬。</p>
  <p>其結果是一種輕巧、可攜帶的結構，能夠承受 15 – 20 PSI 的內部壓力——剛性可媲美硬殼板，但可完全放氣以便存放和運輸。</p>

  <h2>運作原理：物理機制</h2>
  <p>在傳統充氣結構（如氣球或氣墊床）中，內部空氣壓力向各方向均等施壓。若無內部約束，結構會變成圓柱形或球形。織點芯材透過引入拉力強化來解決此問題：</p>
  <ul>
    <li>數千條織線連接頂層和底層織物</li>
    <li>充氣時，空氣壓力試圖將頂層和底層推開</li>
    <li>織線抵抗此一分離，將載荷轉化為沿織線軸向的拉力</li>
    <li>結果是一塊平坦、堅硬且抗彎曲的板面</li>
  </ul>

  <h2>製造流程</h2>
  <ol>
    <li><strong>編織：</strong>聚酯纖維線同時編入兩層獨立的基布（通常為 1,100 DTEX 或 1,680 DTEX PVC 塗層聚酯纖維）。織線以 90° 角在兩層之間環狀編織。</li>
    <li><strong>塗層：</strong>編織基布以 PVC（或偶爾使用 TPU）進行刮刀塗佈或壓延塗佈，密封織線並形成氣密薄膜。</li>
    <li><strong>層壓貼合：</strong>織點芯材透過熱貼合或黏合劑與外層疊層（通常為 0.9 mm 或 1.2 mm PVC）結合。</li>
    <li><strong>焊接：</strong>沿邊緣使用熱風焊接、RF 焊接或高頻焊接焊接邊帶，形成板身側壁。</li>
    <li><strong>氣閥安裝：</strong>安裝 Boston 閥或 Halkey-Roberts 閥，通常配備洩壓機構以防止過度充氣。</li>
  </ol>

  <h2>關鍵品質指標</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">參數</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">入門級</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">高階級</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">織線密度</td><td class="p-3 border">1 條/平方吋</td><td class="p-3 border">2 條/平方吋</td></tr>
      <tr><td class="p-3 border">基布</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">最大壓力</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC 厚度</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">邊條結構</td><td class="p-3 border">摺疊黏合</td><td class="p-3 border">焊接融合</td></tr>
    </tbody>
  </table>

  <h2>應用領域</h2>
  <ul>
    <li><strong>SUP 板：</strong>4" – 6" 厚度，15 – 20 PSI，1 – 2 條/平方吋</li>
    <li><strong>獨木舟：</strong>織點芯材底板 + 充氣側艙，底板 10 – 15 PSI</li>
    <li><strong>RIB 底板：</strong>輕巧可收納 RIB 小艇的織點芯材底板，12 – 18 PSI</li>
    <li><strong>船用護舷：</strong>低壓織點芯材用於成型平面前端護舷</li>
  </ul>

  <h2>織點芯材 vs. 硬板（玻璃鋼或木芯）</h2>
  <p>硬殼板使用 EPS 泡棉芯材搭配玻璃鋼或木條加強筋。它們更輕、更硬、反應更靈敏——但無法放氣。織點芯材以些微剛性換取完全可攜帶性。對大多數休閒使用者而言，現代 20 PSI 的織點芯材 SUP 在剛性上與入門級硬板幾乎無異。</p>

  <h2>Afarer 如何運用織點芯材</h2>
  <p>Afarer 在其 SUP 全系列中使用 1,680 DTEX 織點芯材，每平方吋 2 條織線，搭配 1.2 mm PVC 外層貼合。板身額定壓力 20 PSI，出廠前須在 1.5 倍額定壓力下進行 24 小時保壓測試。邊條以三層融合熱風焊接，全型號標配洩壓閥。</p>


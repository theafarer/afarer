hero:
  tagline: 技術
  title: 織點芯材如何運作 — 充氣硬核的工程原理
  subtitle: 閱讀時間：8 分鐘
content_html: |
  <h2>什麼是織點芯材（Drop Stitch）？</h2>
  <p>織點芯材（又稱「織點布」或「織點芯」）是一種構造工法，透過數千條獨立的聚酯縫線將布料外殼的上下層連接起來。當外殼充氣時，這些縫線作為內部張力構件——防止上下層板向外鼓成圓弧狀，使板面保持平整且堅硬。</p>
  <p>其成果是一種輕量、便攜的結構，可承受 15 – 20 PSI 的內部壓力——剛性媲美硬殼板，卻可完全放氣以便收納與運輸。</p>

  <h2>運作原理：物理學</h2>
  <p>在傳統的充氣結構（如氣球或充氣床墊）中，內部氣壓會均勻地向四面八方推擠。若無內部拘束，結構便會膨脹成圓柱或球體。織點芯材透過導入張力強化來解決此問題：</p>
  <ul>
    <li>數千條縫線連接上下布料層</li>
    <li>充氣時，氣壓試圖將上下層撐開</li>
    <li>縫線抵抗這種分離，將負載轉化為沿縫線軸向的張力</li>
    <li>最終形成平整、堅硬且抗彎曲的板面</li>
  </ul>

  <h2>構造製程</h2>
  <ol>
    <li><strong>織造：</strong>聚酯縫線同時織入兩層獨立的基布（通常為 1,100 DTEX 或 1,680 DTEX 的 PVC 塗層聚酯）。縫線以 90&deg; 角在兩層之間環織。</li>
    <li><strong>塗層：</strong>以刮刀塗佈或壓延塗佈製程，將織造基布塗上 PVC（或偶爾使用 TPU）。此步驟密封縫線並形成氣密薄膜。</li>
    <li><strong>層間貼合：</strong>以熱貼合或黏合劑將織點芯材與外層貼合層（通常為 0.9 mm 或 1.2 mm PVC）結合。</li>
    <li><strong>焊接：</strong>沿邊緣以熱風焊接、RF 焊接或高頻焊接將側邊條焊接，形成板身的側壁。</li>
    <li><strong>氣閥安裝：</strong>安裝 Boston 氣閥或 Halkey-Roberts 氣閥，通常配備洩壓機構以防止過度充氣。</li>
  </ol>

  <h2>關鍵品質指標</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">參數</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">入門級</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">頂級</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">縫線密度</td><td class="p-3 border">每平方英吋 1 條縫線</td><td class="p-3 border">每平方英吋 2 條縫線</td></tr>
      <tr><td class="p-3 border">基布</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">最大壓力</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC 厚度</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">側邊條構造</td><td class="p-3 border">摺疊黏合</td><td class="p-3 border">焊接熔接</td></tr>
    </tbody>
  </table>

  <h2>應用</h2>
  <ul>
    <li><strong>SUP 槳板：</strong>4" – 6" 厚度、15 – 20 PSI、每平方英吋 1 – 2 條縫線</li>
    <li><strong>獨木舟：</strong>織點芯材底板 + 充氣側浮艙，底板 10 – 15 PSI</li>
    <li><strong>RIB 底板：</strong>用於輕量、可收納 RIB 附屬艇的織點芯材底板，12 – 18 PSI</li>
    <li><strong>船艇護舷：</strong>低壓織點芯材用於具平整面的成型護舷</li>
  </ul>

  <h2>織點芯材 vs. 氣室底板（玻璃纖維或木芯）</h2>
  <p>硬殼板採用 EPS 泡棉芯，搭配玻璃纖維或木質縱樑強化。它們更輕、更硬、反應更靈敏——但無法放氣。織點芯材以部分剛性換取完全的便攜性。對大多數休閒使用者而言，20 PSI 的現代織點芯材 SUP 在剛性上與入門級硬板幾乎無異。</p>

  <h2>Afarer 如何使用織點芯材</h2>
  <p>Afarer 在其全系列 SUP 中採用 1,680 DTEX 織點芯材，每平方英吋 2 條縫線，並搭配 1.2 mm PVC 外層貼合。板身額定壓力為 20 PSI，出貨前須經 1.5 倍額定壓力的 24 小時壓力保持測試。側邊條以熱風焊接進行三層熔接，所有型號均標配洩壓閥。</p>

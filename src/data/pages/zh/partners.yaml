hero:
  tagline: 合作伙伴與分銷
  title: 成為 afarer 合作伙伴<br />——全球分銷網絡
  subtitle: Join afarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries.
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer 全球合作伙伴與分銷商網絡
content_programs:
  tagline: 合作伙伴計劃
  title: 合作伙伴計劃<br />為增長而生
  subtitle: 無論您是分銷商、經銷商還是品牌合作伙伴，afarer 都提供旨在支持您業務的計劃。
  columns: 3
  items:
    - title: 分銷商計劃
      description: 獨家區域分銷，享有批量定價、營銷支持和直接工廠通道。根據區域規模設定最低承諾要求。
      icon: tabler:world
    - title: 經銷商計劃
      description: 為零售門店和在線商店提供直接經銷商價格、產品培訓、營銷材料和保修支持。
      icon: tabler:building-store
    - title: OEM/ODM 合作
      description: 提供全方位 OEM 和 ODM 製造服務，包括定製品牌、包裝和產品規格。從概念到集裝箱。
      icon: tabler:certificate
    - title: 品牌合作
      description: Co-branding, private label, and exclusive model programs for established brands in the marine and outdoor recreation space.
      icon: tabler:stars
    - title: 政府與機構
      description: 為政府機構、海岸警衛隊、軍隊和人道主義組織提供優選供應商計劃。提供招標就緒的文件。
      icon: tabler:building-community
    - title: 度假村與租賃合作伙伴
      description: Fleet pricing, consistent quality, and custom branding for resorts, diving centers, and rental operations worldwide.
      icon: tabler:sun
content_benefits:
  tagline: 為什麼與我們合作
  title: 為什麼合作伙伴選擇 afarer
  subtitle: 我們的合作伙伴受益於真實的製造能力、穩定的質量和快速響應的支持。
  list:
    - 直接工廠通道：直接與我們的製造團隊合作——沒有中間商。獲得更快的響應、更優的價格和完全的生產透明度。
    - 定製就緒：用定製顏色、標誌、包裝和規格打造您的品牌。最小起訂量根據您的市場量身定製。
    - 質量保證：通過 ISO 9001 認證的生產，符合 CE、UKCA 和 BSCI 標準。每件產品發貨前均經過測試。
    - 全球物流：從中國青島發貨，支持 FOB、CIF 和 DDP 選項。美國倉庫位於加州蒙克萊爾，服務北美分銷。
    - 營銷支持：產品目錄、攝影、技術文檔和數字資產，助力您的銷售工作。
    - 培訓與支持：為您的銷售團隊提供產品培訓，為您的客戶提供技術支持，以及保修服務協調。
content_process:
  tagline: 如何成為合作伙伴
  title: 簡單的合作流程
  subtitle: 我們的合作流程簡單直接——旨在讓您快速開始銷售 afarer 產品。
  items:
    - title: 第一步：提交申請
      description: 填寫我們的合作伙伴申請表，提供公司簡介、目標市場和產品意向。
    - title: 第二步：資質審核
      description: 我們的合作團隊審核您的申請，並在 3 個工作日內聯繫您討論合作機會。
    - title: 第三步：協議與設置
      description: 簽署合作協議，設置您的賬戶，並獲取合作伙伴價格、營銷材料和產品樣品。
    - title: 第四步：培訓與啟動
      description: 提供產品培訓、銷售支持和營銷資料。您即可開始銷售。
cta:
  title: 準備好成為 afarer 合作伙伴了嗎？
  subtitle: 申請合作，我們的團隊將在 3 個工作日內回覆。
  actions:

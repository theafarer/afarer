meta:
  title: 研發中心 | {SITE}
  description: Research & Development — PVC fabric testing, hull engineering, RF welding, hydrodynamic testing, and quality control. Custom R&D services available.
hero:
  tagline: 研發中心
  title: 研發中心
  subtitle: 專注於進步
intro:
  - afarer's Research and Development (R&D) Center is the driving force behind our mission to revolutionize water sports equipment. We empower water sports enthusiasts globally with safer, more comfortable, and more enjoyable products through relentless innovation in inflatable stand-up paddle boards (SUPs) and boats. Our dedicated team of engineers, designers, and passionate water sports experts are shaping the future of the industry, consistently raising the bar for quality, performance, and sustainability.
  - Our R&D facility brings together material scientists, naval architects, and production engineers under one roof. From fabric formulation and hull simulation to welding process development and full-scale sea trials, every stage of product development is driven by data and validated by testing.
mission:
  tagline: 我們的使命
  title: 創新水上運動的未來
  pillars:
    - icon: lightning
      title: 技術進步
      desc: 開創新材料、設計與製造，實現卓越的產品性能與使用壽命。
    - icon: design
      title: 以使用者為中心的設計
      desc: 透過人體工學與直覺化的產品設計，深入理解並超越使用者需求。
    - icon: globe
      title: 永續實踐
      desc: 透過使用環保材料與製程，將環境足跡降至最低。
    - icon: shield
      title: 不妥協的安全
      desc: 透過嚴格測試與認證，確保最高安全標準。
pillars:
  - title: 技術進步
    desc: 開創新材料、設計與製造流程，實現卓越的產品性能與使用壽命。
    icon: tech
  - title: 先進材料
    desc: 研究尖端 PVC、Hypalon、複合材料及永續替代方案，提升產品特性。
    icon: materials
  - title: 永續發展
    desc: 核心承諾：我們致力於透過永續製造與可回收材料，實踐環境管理責任。
    icon: sustainability
capabilities:
  tagline: 能力
  title: 研發能力
  subtitle: 四大核心領域賦予我們對產品開發的端到端控制 — 從原材料研究到最終認證。
  groups:
    - title: 材料科學與織物技術
      items:
        - PVC 與 Hypalon 配方分析與優化
        - UV 穩定、阻燃及抗菌添加劑開發
        - 多層織物貼合與黏著工程
        - 加速老化測試（UV、熱、濕度、鹽霧）
    - title: 船體工程與流體動力學
      items:
        - 參數化 3D 船體設計和 CFD 優化
        - 結構與衝擊載荷有限元素分析
        - 縮尺模型拖曳水池測試與性能驗證
        - 針對特殊任務的定製船體開發
    - title: 焊接與連接技術
      items:
        - RF 介電焊接製程開發與優化
        - 熱風、熱楔、超音波焊接方法
        - 黏著接合與接縫膠帶認證
        - 焊接強度建模與壽命預測
    - title: 測試、認證與合規
      items:
        - 品質管理與 CE 合規測試
        - 獨立第三方測試與認證支援
        - 採購驗收的客製測試計畫制定
        - 使用中故障分析與根本原因調查

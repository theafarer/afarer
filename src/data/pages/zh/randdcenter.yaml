rd_services:
  tagline: 客製研發
  title: 合作夥伴研發服務
  services:
    - title: 客製材料開發
      desc: 我們根據您的營運環境與性能目標，開發量身定制的織物配方、複合疊層與黏著系統。
    - title: OEM / ODM 產品工程
      desc: 我們根據您的營運環境與性能目標，開發量身定制的織物配方、複合疊層與黏著系統。
    - title: 第三方測試與認證
      desc: 使用我們的 ISO 合規測試設施，進行獨立材料測試、產品驗證及認證支援。
  cta: 討論您的研發需求 →
  cta_link: /contact

vision:
  tagline: 我們的願景
  title: 塑造水上運動的未來
  body: Afarer 致力於透過持續創新、不妥協的品質以及對安全與永續的堅定承諾，引領充氣船與 SUP 產業的發展，最終豐富全球水上運動愛好者的體驗。Afarer 研發中心是熱情與創新的交會點，為水上運動產業樹立新標竿。

labs_section:
  tagline: 實驗室
  title: 我們的實驗室
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC 織物實驗室
      description: 對 PVC 與 Hypalon 管材織物進行持續研究與測試，包括拉伸強度、UV 抗性、耐磨性及低溫彈性，確保在海洋環境中的長期可靠性。
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 船體工程工作室
      description: HDPE、鋁合金及玻璃鋼船體的 CAD 驅動設計與有限元素分析。每個船體在建造第一個原型之前，都經過應力分佈與抗衝擊性的數位模擬。
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: 高頻焊接中心
      description: 配備精密溫度與壓力控制的專業射頻焊接設施，生產符合充氣船海洋產業標準的高強度氣密接縫。
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 流體動力測試水池
      description: 在自有測試水池中進行縮尺模型測試，優化船體外形、滑行性能、穩定性及燃油效率，涵蓋多種載重與海況。
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      title: 原型車間
      description: 全尺寸原型製作與裝配設施，新型號在此建造、安裝並進行海上測試。每個原型在量產核准前，必須完成至少 20 小時的水上測試計畫。
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 品質檢驗實驗室
      description: 專用品質保證實驗室，進行拉伸測試、氣密循環測試、接縫剝離測試及材料認證，確保出廠的每艘船均符合公佈規格。
      href: /randdcenter/quality-inspection-lab

rd_services:
  tagline: 客製研發
  title: 合作夥伴研發服務
  services:
    - title: 客製材料開發
      desc: 我們根據您的營運環境與性能目標，開發量身定制的織物配方、複合疊層與黏著系統。
    - title: OEM / ODM 產品工程
      desc: 我們根據您的營運環境與性能目標，開發量身定制的織物配方、複合疊層與黏著系統。
    - title: 第三方測試與認證
      desc: 使用我們的 ISO 合規測試設施，進行獨立材料測試、產品驗證及認證支援。
  cta: 討論您的研發需求 →
  cta_link: /contact
vision:
  tagline: 我們的願景
  title: 塑造水上運動的未來
  body: afarer strives to lead the inflatable boat and SUP industry through continuous innovation, unwavering quality, and a steadfast commitment to safety and sustainability —ultimately enriching the experiences of water sports enthusiasts worldwide. The afarer R&D Center is where passion meets innovation, setting new standards for the water sports industry.
labs_section:
  tagline: 實驗室
  title: 我們的實驗室
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC 織物實驗室
      description: 對 PVC 與 Hypalon 管材織物進行持續研究與測試，包括拉伸強度、UV 抗性、耐磨性及低溫彈性，確保在海洋環境中的長期可靠性。
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Hull Engineering Studio
      description: CAD-driven design and finite element analysis of HDPE, aluminum, and fiberglass hulls. Every hull is digitally simulated for stress distribution and impact resistance before the first prototype is built.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: 高頻焊接中心
      description: Dedicated radio-frequency welding facility with precision temperature and pressure control, producing high-strength, airtight seams that meet marine industry standards for inflatable craft.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 流體動力測試水池
      description: Scale-model testing in our in-house test tank to optimize hull form, planing performance, stability, and fuel efficiency across a range of load and sea conditions.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      title: 原型車間
      description: 全尺寸原型製作與裝配設施，新型號在此建造、安裝並進行海上測試。每個原型在量產核准前，必須完成至少 20 小時的水上測試計畫。
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 品質檢驗實驗室
      description: Dedicated quality assurance lab performing tensile testing, air-retention cycling, seam peel tests, and material certification to ensure every boat leaving the workshop meets our published specifications.
      href: /randdcenter/quality-inspection-lab

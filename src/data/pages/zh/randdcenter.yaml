meta:
  title: '研發中心 | {SITE}'
  description: '研究與開發 — PVC 織物測試、船體工程、高頻焊接、流體動力測試及品質管控。提供客製研發服務。'

hero:
  tagline: 研發中心
  title: 研發中心
  subtitle: 專注於進步

intro:
  - Afarer 的研發中心是推動我們革新水上運動裝備使命的核心力量。透過在充氣立槳板（SUP）及船艇領域的持續創新，我們為全球水上運動愛好者提供更安全、更舒適、更具樂趣的產品。我們的工程師、設計師及充滿熱情的水上運動專家團隊，正在塑造產業的未來，不斷提升品質、性能與永續性的標竿。
  - 我們的研發設施匯聚了材料科學家、船舶工程師及生產工程師。從織物配方與船體模擬，到焊接製程開發與實船測試，產品開發的每一階段都由數據驅動並經過測試驗證。

mission:
  tagline: 我們的使命
  title: 創新水上運動的未來
  pillars:
    - icon: lightning
      title: 技術進步
      desc: 開創新材料、設計與製造，實現卓越的產品性能與使用壽命。
    - icon: design
      title: 以使用者為中心的設計
      desc: 透過人體工學與直覺化的產品設計，深入理解並超越使用者需求。
    - icon: globe
      title: 永續實踐
      desc: 透過使用環保材料與製程，將環境足跡降至最低。
    - icon: shield
      title: 不妥協的安全
      desc: 透過嚴格測試與認證，確保最高安全標準。

pillars:
  - title: 技術進步
    desc: 開創新材料、設計與製造流程，實現卓越的產品性能與使用壽命。
    icon: tech
  - title: 先進材料
    desc: 研究尖端 PVC、Hypalon、複合材料及永續替代方案，提升產品特性。
    icon: materials
  - title: 永續發展
    desc: '核心承諾：我們致力於透過永續製造與可回收材料，實踐環境管理責任。'
    icon: sustainability

capabilities:
  tagline: 能力
  title: 研發能力
  subtitle: 四大核心領域賦予我們對產品開發的端到端控制 — 從原材料研究到最終認證。
  groups:
    - title: 材料科學與織物技術
      items:
        - PVC 與 Hypalon 配方分析與優化
        - UV 穩定、阻燃及抗菌添加劑開發
        - 多層織物貼合與黏著工程
        - 加速老化測試（UV、熱、濕度、鹽霧）
    - title: 船體工程與流體動力學
      items:
        - 參數化 3D 船體設計與 CFD 優化
        - 結構與衝擊載荷有限元素分析
        - 縮尺模型拖曳水池測試與性能驗證
        - 特殊任務船型的客製船體開發
    - title: 焊接與連接技術
      items:
        - RF 介電焊接製程開發與優化
        - 熱風、熱楔、超音波焊接方法
        - 黏著接合與接縫膠帶認證
        - 焊接強度建模與壽命預測
    - title: 測試、認證與合規
      items:
        - 品質管理與 CE 合規測試
        - 獨立第三方測試與認證支援
        - 採購驗收的客製測試計畫制定
        - 使用中故障分析與根本原因調查


meta:
  title: '索取報價 — OEM SUP 生產 | {SITE}'
  description: '為你的充氣式 SUP 或船艇專案索取詳細報價。無論是 OEM/ODM 生產、自有品牌或客製船隊，我們都會在 2 個工作天內回覆。'
  keywords:
    - '索取 SUP 報價'
    - 'OEM 立槳板報價'
    - 'SUP 工廠報價'
    - '充氣式 SUP 價格'
hero_text:
  tagline: 獲取報價
  title: 為您的項目<br />請求報價
  subtitle: 告訴我們您的需求，我們的團隊將在 2 個工作日內回覆詳細報價。
steps2_process:
  title: 運作方式
  subtitle: 從詢價到報價只需四個簡單步驟。
  items:
    - title: 第一步：提交您的需求
      description: 填寫下面的表格，註明產品類型、數量和規格。您提供的細節越多，報價就越準確。
      icon: tabler:file-text
    - title: 第二步：我們審核與建議
      description: 我們的工程團隊審核您的需求，並可能聯繫您進行確認。我們提供產品配置和選型建議。
      icon: tabler:users
    - title: 第三步：收到報價
      description: 您將收到詳細報價，包括單價、MOQ、交期、付款方式和運輸選項。通常在 48 小時內。
      icon: tabler:currency-dollar
    - title: 第四步：樣品與大貨生產
      description: 報價確認後，我們進行樣品製作（如適用）或直接進入大貨生產。全程定期更新進度。
      icon: tabler:building-factory
content_form:
  tagline: 報價表單
  title: 告訴我們您的項目
  subtitle: 帶 * 的字段為必填項。
  contact_fields:
    firstName: 名字
    lastName: 姓氏
    companyName: 公司
    email: 電郵
  fields:
    - name: 產品類別
      type: select
      options:
        - SUP 槳板
        - 充氣 SUP
        - SUP 板
        - 救生衣
        - 船用配件
        - 定製 OEM/ODM
    - name: 應用領域
      type: select
      options:
        - 潛水中心
        - 釣魚
        - 海洋旅遊 / 度假村
        - 搜索與救援
        - 遊艇接駁
        - 商業工作船
        - 政府 / 軍用
        - OEM / 貼牌
        - 個人 / 休閒
        - 其他
    - name: 數量
      type: text
      placeholder: 例如 50 件
    - name: 目標市場
      type: text
      placeholder: 例如歐洲、北美、中東
    - name: 送達國家
      type: text
      placeholder: 例如意大利、阿聯酋、美國、澳大利亞
    - name: 材料偏好
      type: select
      options:
        - 無偏好
        - 船舶級 PVC（1100 dtex）
        - 高級 Hypalon / CSM
        - 玻璃鋼船體
        - 鋁合金船體
    - name: 引擎需求
      type: text
      placeholder: 例如 60 HP 舷外機、無引擎、雙 115 HP
    - name: 所需定製
      type: text
      placeholder: 例如定製顏色、品牌/標誌、包裝、特殊配件
    - name: 時間線
      type: text
      placeholder: 例如 90 天內交貨
    - name: 其他要求
      type: textarea
      placeholder: 描述您的應用場景、技術規格或任何特殊要求——如有參考圖紙、規格書或連結請一併附上
    - name: 上傳規格書
      type: file
      placeholder: 上傳您的規格表、圖紙或參考文件（PDF、DWG、DXF）
    - name: 上傳標誌 / 設計稿
      type: file
      placeholder: 上傳您的標誌或設計稿用於定製品牌（AI、EPS、PNG）
cta:
  title: 更傾向於通過電子郵件討論？
  subtitle: 直接將您的詢價發送給我們的銷售團隊，我們將在 24 小時內回覆。
  actions:
    - variant: primary
      text: 直接給我們發郵件
      href: /contact

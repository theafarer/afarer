packages:
  title: 俱樂部船隊方案
  subtitle: 選擇符合您俱樂部規模與抱負的船隊方案。
  items:
    - name: 創業套裝
      tagline: 適合：新俱樂部，最多 30 名會員
      features:
        - 10 張 SUP 板 + 槳 + 救生衣
        - 2 個打氣筒 + 1 組修補套件
        - 俱樂部品牌標誌於板上
        - 啟動指南 + 安全檢查表
      cta_text: 啟動俱樂部
    - name: 專業船隊
      tagline: 適合：成熟俱樂部，50-100 名會員
      features:
        - 30 張 SUP 板 + 槳 + 救生衣
        - 5 個打氣筒 + 2 組修補套件
        - 客製俱樂部顏色 + 標誌
        - 備品計畫（15% 折扣）
        - 員工培訓課程
      cta_text: 打造船隊
    - name: 比賽船隊
      tagline: 適合：競速俱樂部、活動、比賽
      features:
        - 50+ 競速 / 性能板
        - 完整配件組
        - 活動支援套件
        - 優先備品（24 小時發貨）
        - 專屬客戶經理
      cta_text: 取得比賽船隊
training:
  title: 培訓中心套裝
  subtitle: SUP 學校開展專業認證課程所需的一切。
  items:
    - name: 教練入門套裝
      features:
        - 5 張高級 SUP 板（教練級）
        - 5 支碳纖維槳（示範用）
        - 5 件救生衣（教練款）
        - 培訓課程指南
        - CE 認證設備
    - name: 學校全套裝
      features:
        - 20 張 SUP 板（學員 + 教練混合）
        - 20 支槳 + 20 件救生衣（多種尺寸）
        - 10 件初學者輔助浮力裝置
        - 4 個打氣筒 + 修補套件
        - 培訓課程與認證支援
        - CE 認證設備
features:

      description: 商用級板身可承受數季的日常使用。
      icon: tabler:shield-check
    - title: 客製顏色
      description: 以客製板色和標誌呼應俱樂部形象。
      icon: tabler:palette
    - title: 批量價格
      description: 10 張以上船隊訂單享有數量折扣。
      icon: tabler:discount
    - title: 快速備品
      description: 備用零件 48 小時內出貨。
      icon: tabler:truck-delivery
    - title: 俱樂部成長支援

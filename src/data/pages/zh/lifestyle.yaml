  title: afarer<br />生活方式
  subtitle: 為那些在水上生活的人而生——從週末探險者到每天依賴裝備的商業用戶。
values:
  - icon: 🌊
    title: 源於水上
    desc: 每個設計都始於對水的理解。我們從極限條件向內設計——因為海洋是我們的老師，而不是我們的工作場所。
  - icon: 🔧
    title: 經久耐用
    desc: 每個設計都始於對水的理解。我們從極限條件向內設計——因為海洋是我們的老師，而不是我們的工作場所。
  - icon: 🏆
    title: 人人可及
    desc: 每個設計都始於對水的理解。我們從極限條件向內設計——因為海洋是我們的老師，而不是我們的工作場所。
  - icon: 🌍
    title: 全球社區
    desc: 每個設計都始於對水的理解。我們從極限條件向內設計——因為海洋是我們的老師，而不是我們的工作場所。
  - icon: ♻️
    title: 負責任的製造
    desc: CNC優化套裁將材料浪費控制在5%以下。耐用結構減少更換週期。我們為長壽而製造，因為這是最可持續的選擇。
  - icon: 🤝
    title: 負責任的製造
    desc: 二十年前的船殼仍然可以聯繫我們購買備件。我們的保修響應平均24小時。銷售之後我們不會消失——我們在產品的整個生命週期內都在這裡。

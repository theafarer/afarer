philosophy:
  tagline: 設計理念
  title: 工程主導的設計<br />——每個細節都很重要
  subtitle: 我們的工程理念圍繞三個原則，指導我們生產的每件產品。
  list:
    - 可靠性第一：每件 afarer 產品都經過測試，能夠承受真實條件——從冷水救援作業到熱帶度假村租賃。我們在最關鍵的地方過度設計。
    - 製造精度：我們的工廠使用 CNC 切割、高頻焊接和自動壓力測試。每條接縫、每個閥門、每個配件都符合文件化規格。
    - 持續創新：我們的研發團隊持續評估新材料、生產方法和設計改進。我們不等待問題出現——我們預見問題。

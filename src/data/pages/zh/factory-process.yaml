intro: 與將生產外包給第三方工廠的品牌不同，afarer 擁有並運營完整的製造鏈。這種垂直整合使我們能在每個階段保持嚴格的品質管控、快速回應客製需求，並穩定交付高品質產品。以下是 SUP 板在我們工廠中的製造過程。
steps:
  - step: '01'
    title: 材料接收與檢驗
    description: 每批進廠的PVC面料、玻璃纖維氈、樹脂和五金件都按照規格進行檢查。面料樣品在放行生產前進行拉伸強度、厚度均勻性和抗紫外線測試。不合格材料被隔離並退回。
    duration: 1–2天
  - step: '02'
    title: 自動PVC裁切
    description: 經核准的面料鋪設於自動 CNC 切割機上，以亞毫米精度進行切割。計算機優化排版配置面板以最小化浪費，通常低於 5%。切割完成的面板按船型及氣室標示，隨後打包轉運至焊接車間。
    duration: 2–4 hours per boat kit
  - step: '03'
    title: 材料接收與檢驗
    description: 面板使用熱封機（壓膠機）在200–600°C的受控溫度下進行熱風焊接定位和粘合。主縫採用高頻介質焊接進行加固，形成氣密、高強度的接頭。完成的氣室充氣至1.5倍工作壓力，保持30分鐘進行氣密性驗證。
    duration: 1–2 days per boat
  - step: '04'
    title: 落針式芯材粘合
    description: 面板使用熱封機（壓膠機）在200–600°C的受控溫度下進行熱風焊接定位和粘合。主縫採用高頻介質焊接進行加固，形成氣密、高強度的接頭。完成的氣室充氣至1.5倍工作壓力，保持30分鐘進行氣密性驗證。
    duration: 1–2 days per board
  - step: '05'
    title: SUP 印刷與裝飾
    description: 每批進廠的PVC面料、玻璃纖維氈、樹脂和五金件都按照規格進行檢查。面料樣品在放行生產前進行拉伸強度、厚度均勻性和抗紫外線測試。不合格材料被隔離並退回。
    duration: 1–2天
  - step: '06'
    title: 最終組裝與裝配
    description: 面板使用熱封機（壓膠機）在200–600°C的受控溫度下進行熱風焊接定位和粘合。主縫採用高頻介質焊接進行加固，形成氣密、高強度的接頭。完成的氣室充氣至1.5倍工作壓力，保持30分鐘進行氣密性驗證。
    duration: 1–2天
  - step: '07'
    title: 材料接收與檢驗
    description: '每塊完成的板均須通過強制品質關卡：氣室氣密性測試、五金件功能檢查、緊固件扭力驗證及外觀檢驗。客製及原型品另進行水上測試，涵蓋穩定性與操控性能。'
    duration: 1–2天
  - step: '08'
    title: 材料接收與檢驗
    description: 每批進廠的PVC面料、玻璃纖維氈、樹脂和五金件都按照規格進行檢查。面料樣品在放行生產前進行拉伸強度、厚度均勻性和抗紫外線測試。不合格材料被隔離並退回。
    duration: 1–2天

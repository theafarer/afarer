hero:
  tagline: 流程
  title: 製造流程
  subtitle: 從原材料到可下海的船隻——每一步都在我們的掌控之中
  back_label: 返回工廠
  back_link: /factory
intro: 與將生產外包給第三方工廠的品牌不同，afarer擁有並運營其整個製造鏈。這種垂直整合使我們能夠在每個環節保持嚴格的質量控制，快速響應定製需求，並批次接批次地提供一致的產品質量。以下是我們工廠中一艘船的製造過程。
steps:
  - step: '01'
    title: 材料接收與檢驗
    description: 每批進廠的PVC面料、玻璃纖維氈、樹脂和五金件都按照規格進行檢查。面料樣品在放行生產前進行拉伸強度、厚度均勻性和抗紫外線測試。不合格材料被隔離並退回。
    duration: 1–2天
  - step: '02'
    title: 自動PVC裁切
    description: 合格面料鋪設在自動CNC裁切機上，以亞毫米精度裁剪。計算機優化套裁安排面板以最小化浪費——通常低於5%。裁切後的面板按船型編號和氣室標記，然後打包送往焊接車間。
    duration: 每套船2–4小時
  - step: '03'
    title: 材料接收與檢驗
    description: 面板使用熱封機（壓膠機）在200–600°C的受控溫度下進行熱風焊接定位和粘合。主縫採用高頻介質焊接進行加固，形成氣密、高強度的接頭。完成的氣室充氣至1.5倍工作壓力，保持30分鐘進行氣密性驗證。
    duration: 每套船2–4小時
  - step: '04'
    title: 玻璃鋼RIB船殼成型
    description: 面板使用熱封機（壓膠機）在200–600°C的受控溫度下進行熱風焊接定位和粘合。主縫採用高頻介質焊接進行加固，形成氣密、高強度的接頭。完成的氣室充氣至1.5倍工作壓力，保持30分鐘進行氣密性驗證。
    duration: 每套船2–4小時

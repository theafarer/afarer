hero:
  tagline: 流程
  title: 製造流程
  subtitle: 從原材料到可下水的 SUP——每一步都在我們的控制之下
  back_label: 返回工廠
  back_link: /factory
intro: Unlike brands that outsource production to third-party factories, afarer owns and operates its entire manufacturing chain. This vertical integration allows us to maintain strict quality control at every stage, respond quickly to custom requirements, and deliver consistent product quality batch after batch. Here is how a SUP board is built in our facility.
steps:
  - step: '01'
    title: 材料接收與檢驗
    description: 每批進廠的PVC面料、玻璃纖維氈、樹脂和五金件都按照規格進行檢查。面料樣品在放行生產前進行拉伸強度、厚度均勻性和抗紫外線測試。不合格材料被隔離並退回。
    duration: 1–2天
  - step: '02'
    title: 自動PVC裁切
    description: Approved fabrics are laid on the automatic CNC cutting machine and cut with sub-millimetre accuracy. Computer-optimised nesting arranges panels to minimise waste —typically below 5%. Cut panels are labelled by boat model and chamber, then bundled for transfer to the welding workshop.
    duration: 2–4 hours per boat kit
  - step: '03'
    title: 材料接收與檢驗
    description: 面板使用熱封機（壓膠機）在200–600°C的受控溫度下進行熱風焊接定位和粘合。主縫採用高頻介質焊接進行加固，形成氣密、高強度的接頭。完成的氣室充氣至1.5倍工作壓力，保持30分鐘進行氣密性驗證。
    duration: 1–2 days per boat
  - step: '04'
    title: 落針式芯材粘合
    description: 面板使用熱封機（壓膠機）在200–600°C的受控溫度下進行熱風焊接定位和粘合。主縫採用高頻介質焊接進行加固，形成氣密、高強度的接頭。完成的氣室充氣至1.5倍工作壓力，保持30分鐘進行氣密性驗證。
    duration: 1–2 days per board
  - step: '05'
    title: SUP 印刷與裝飾
    description: 每批進廠的PVC面料、玻璃纖維氈、樹脂和五金件都按照規格進行檢查。面料樣品在放行生產前進行拉伸強度、厚度均勻性和抗紫外線測試。不合格材料被隔離並退回。
    duration: 1–2天
  - step: '06'
    title: 最終組裝與裝配
    description: 面板使用熱封機（壓膠機）在200–600°C的受控溫度下進行熱風焊接定位和粘合。主縫採用高頻介質焊接進行加固，形成氣密、高強度的接頭。完成的氣室充氣至1.5倍工作壓力，保持30分鐘進行氣密性驗證。
    duration: 1–2天
  - step: '07'
    title: 材料接收與檢驗
    description: 'Every completed board undergoes mandatory quality gate: chamber air-retention test, hardware function check, fastener torque verification, and cosmetic inspection. Custom and prototype builds also receive in-water trials covering stability and handling.'
    duration: 1–2天
  - step: '08'
    title: 材料接收與檢驗
    description: 每批進廠的PVC面料、玻璃纖維氈、樹脂和五金件都按照規格進行檢查。面料樣品在放行生產前進行拉伸強度、厚度均勻性和抗紫外線測試。不合格材料被隔離並退回。
    duration: 1–2天

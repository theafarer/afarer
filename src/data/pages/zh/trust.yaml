faqs_rib:
  title: RIB船常見問題
  subtitle: 關於我們硬殼充氣艇的常見問題。
  columns: 2
  items:
    - title: afarer提供哪些尺寸的RIB船？
      description: 我們提供35款RIB型號，從2.5米到7.6米，涵蓋緊湊型接駁艇到重型商業和巡邏艇。每款型號都有多種配置選項。
    - title: RIB和傳統充氣船有什麼區別？
      description: SUP（硬殼充氣艇）將實心玻璃鋼或鋁製深V船體與充氣Hypalon或PVC管相結合。這提供了硬船的穩定性和負載能力以及充氣船的減震和浮力。
    - title: 哪些發動機與afarer RIB兼容？
      description: 我們的RIB支持3 HP到250 HP的舷外發動機，具體取決於型號。每個產品頁面都列出了最大額定功率。建議諮詢經銷商以獲得最佳匹配。
    - title: afarer RIB是否經過CE認證？
      description: 是的。所有休閒RIB型號均根據適用的歐洲休閒船艇標準獲得CE認證。商業和巡邏型號滿足額外的穩定性和負載要求。
    - title: RIB船的保修是什麼？
      description: 所有afarer RIB均附帶標準的一年製造缺陷保修，涵蓋船體分層、管縫失效、閥門缺陷和硬件問題。
    - title: afarer RIB有多少個氣室？
      description: 我們的RIB根據型號長度配備3到7個獨立氣室。這種多氣室設計確保即使一個隔間受損，船仍能漂浮。
faqs_inflatable:
  title: 充氣船常見問題
  subtitle: 關於我們充氣小艇、皮艇和船的常見問題。
  columns: 2
  items:
    - title: afarer充氣船使用什麼材料？
      description: 根據型號，我們使用軍用級PVC（1100旦尼爾）和優質Hypalon/CSM橡膠。兩種材料都經過抗紫外線穩定處理、耐磨，並符合歐盟REACH和RoHS法規。
    - title: 充氣船能用多久？
      description: 妥善保養下，優質PVC充氣船可使用7-10年，而Hypalon型號可使用15-20年。定期清潔、防曬和正確存放可顯著延長使用壽命。
    - title: 充氣船需要什麼維護？
      description: 基本維護包括每次使用後用淡水沖洗（尤其在鹹水中）、存放前乾燥、每年檢查閥門密封圈以及塗抹防曬劑。不用時避免長時間暴曬。
    - title: 充氣船可以在鹹水中使用嗎？
      description: 可以。所有afarer充氣船都設計用於淡水和鹹水。建議在鹹水使用後用淡水沖洗並徹底乾燥，以防止配件腐蝕和織物鹽結晶。
    - title: 如何存放充氣船？
      description: 存放前放氣、清潔並完全乾燥。鬆散捲起（避免緊折），存放在遠離直射陽光的陰涼乾燥處，不要放在混凝土地板上以防止吸溼。
    - title: afarer充氣船的承重能力是多少？
      description: 承重範圍從最小型號的290公斤到大型商業船的2000公斤以上。每個產品頁面都列出了具體型號的最大負載等級。
faqs_sup:
  title: SUP板常見問題
  subtitle: 關於我們站立式槳板的常見問題。
  columns: 2
  items:
    - title: 有哪些SUP板尺寸可供選擇？
      description: 我們提供從9英尺到12英尺的SUP板，包括全能型、旅行型、瑜伽型和特殊設計。我們的暢銷型號包括Tropical Breeze（10英尺）和Ocean Voyager（11英尺）。
    - title: 什麼是滴塑結構？
      description: 滴塑結構使用數千根聚酯線連接板的頂層和底層，使其能夠保持高氣壓（15-20 PSI）並實現剛性、穩定的平臺。這是優質充氣SUP的行業標準。
    - title: SUP板的重量限制是多少？
      description: 我們的SUP板根據型號和體積支持高達150公斤。Leviathan Wake是我們容量最大的型號，專為較大騎手和瑜伽使用而設計。
    - title: 你們提供完整的SUP套裝嗎？
      description: 是的。每塊SUP板都附帶完整套裝，包括三節鋁製槳、高壓手泵、螺旋 leash、旅行背包和維修套件。部分型號還包括可拆卸尾鰭組。
    - title: SUP板的保修是什麼？
      description: 所有afarer SUP板均附帶一年製造缺陷保修，包括正常使用下的接縫失效、閥門缺陷和材料分層。
    - title: SUP板充氣需要多長時間？
      description: 使用附帶手泵，完全充氣到15 PSI約需8-12分鐘。如需更快充氣，我們推薦使用afarer 12V電動泵，可在4分鐘內完成充氣。

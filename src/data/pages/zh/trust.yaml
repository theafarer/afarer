faqs_sup:
  title: SUP板常見問題
  subtitle: 關於我們站立式槳板的常見問題。
  columns: 2
  items:
    - title: 有哪些SUP板尺寸可供選擇？
      description: 我們提供從9英尺到12英尺的SUP板，包括全能型、旅行型、瑜伽型和特殊設計。我們的暢銷型號包括Tropical Breeze（10英尺）和Ocean Voyager（11英尺）。
    - title: 什麼是滴塑結構？
      description: 滴塑結構使用數千根聚酯線連接板的頂層和底層，使其能夠保持高氣壓（15-20 PSI）並實現剛性、穩定的平臺。這是優質充氣SUP的行業標準。
    - title: SUP板的重量限制是多少？
      description: 我們的SUP板根據型號和體積支持高達150公斤。Leviathan Wake是我們容量最大的型號，專為較大騎手和瑜伽使用而設計。
    - title: 你們提供完整的SUP套裝嗎？
      description: 是的。每塊SUP板都附帶完整套裝，包括三節鋁製槳、高壓手泵、螺旋 leash、旅行背包和維修套件。部分型號還包括可拆卸尾鰭組。
    - title: SUP板的保修是什麼？
      description: 所有afarer SUP板均附帶一年製造缺陷保修，包括正常使用下的接縫失效、閥門缺陷和材料分層。
    - title: SUP板充氣需要多長時間？
      description: 使用附帶手泵，完全充氣到15 PSI約需8-12分鐘。如需更快充氣，我們推薦使用afarer 12V電動泵，可在4分鐘內完成充氣。
faqs_materials:
  title: 材料常見問題
  subtitle: 關於材料的常見疑問。
  columns: 2
  items:
    - title: afarer 充氣式 SUP 板使用哪些材料？
      description: 我們採用軍規 PVC（1100 denier），具抗紫外線穩定與耐磨構造，符合歐盟 REACH 與 RoHS 法規。
    - title: 充氣式 SUP 板的使用壽命有多長？
      description: 妥善保養下，優質 PVC 充氣式 SUP 板可使用 5 至 10 年。定期清潔、防紫外線保護及正確存放可顯著延長使用壽命。
    - title: 充氣式 SUP 板需要哪些保養？
      description: 基本保養包括每次使用後以清水沖洗（尤其在海水環境中使用後）、存放前徹底乾燥、每年檢查閥門密封件，以及閒置時避免長時間日曬。
    - title: 充氣式 SUP 板可以在海水中使用嗎？
      description: 可以。所有 afarer 充氣式 SUP 板均設計用於淡水與海水環境。建議在海水環境使用後以清水沖洗並徹底乾燥。
    - title: 如何存放充氣式 SUP 板？
      description: 存放前請放氣、清潔並徹底乾燥板身。鬆捲存放（避免緊密摺疊），置於陰涼乾燥處避免陽光直射，並避免直接接觸水泥地面以防潮氣吸附。
    - title: afarer 充氣式 SUP 板的承重能力是多少？
      description: 承重能力從最小型號的 100 公斤到較大板型的 200 公斤以上不等。各產品頁面均列出您所選型號的最大承重規格。

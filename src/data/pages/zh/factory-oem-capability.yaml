hero:
  tagline: OEM/ODM 製造
  title: OEM 與自有品牌製造
  subtitle: 從概念到出貨 — 客製化您充氣 SUP 產品線的每一個細節

intro: Afarer 為全球品牌、經銷商及政府機構提供全面的 OEM 與 ODM 服務。憑藉 10 年以上出口經驗及 12,000 平方公尺的 ISO 9001 與 BSCI 認證廠房，我們處理從產品設計、模具開發到量產、包裝及物流的所有環節。

highlight:
  - value: 10+
    label: 年 OEM 經驗
    detail: 自 2012 年起
  - value: 50+
    label: 出口國家
    detail: 全球覆蓋
  - value: 200+
    label: 已完成客製專案
    detail: 涵蓋全產品線
  - value: 30–45
    label: 標準交期（天）
    detail: 從訂單到出貨

services:
  - title: 產品設計與工程
    description: 我們的內部研發團隊根據您的概念或規格，開發 CAD 圖紙、3D 模型及原型。我們提供模具設計、船體形狀優化及材料選擇指導。
  - title: 客製品牌與圖案
    description: 全彩數位印刷、網版印刷、壓印及標籤選項。我們開發專屬品牌甲板圖案、管材品牌標識及零售包裝。
  - title: 材料與規格客製化
    description: 可選擇 PVC（標準、環保、阻燃）、Hypalon/CSM、織點芯材及混合結構。客製管材顏色、織物重量及強化選項。
  - title: 包裝與物流
    description: 客製零售包裝、自有品牌紙箱、真空包裝、棧板打包及貨櫃裝載。可提供 FOB 青島、CIF 或 DDP 運輸條款。

moq_table:
  - product: 充氣 SUP 板
    standard_moq: 50–100 件
    custom_moq: 200+ 件
    lead_time: 30–45 天
  - product: 救生衣與安全裝備
    standard_moq: 100–200 件
    custom_moq: 1,000+ 件
    lead_time: 20–30 天

why_us:
  - title: 垂直整合
    description: 我們擁有自己的工廠、模具及供應鏈 — 無中間商、無分包商。這使我們能夠全面掌控品質、成本及交期。
  - title: 雙重認證
    description: ISO 9001 品質管理及 BSCI 社會合規認證。可依要求提供工廠稽核報告。
  - title: CE 合規
    description: 所有標準型號均具備 CE 2013/53/EU 認證。客製型號可透過我們既定的流程取得 CE 認證。
  - title: 低 MOQ
    description: 標準型號最低僅需 5 件即可起訂。我們協助新興品牌在不承擔過多庫存壓力的情況下推出產品。

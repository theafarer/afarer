intro: 管材織物是充氣船中最關鍵的單一材料。它必須承受持續的紫外線照射、反覆的充放氣循環、與碼頭及碎片的摩擦，以及極端的溫度變化——同時在數年間維持結構完整性。在 {SITE.name}，我們的 PVC 織物實驗室專注於每一艘船所用織物的特性分析、驗證與持續改進。
content_html: |
  <h2>每一艘充氣船的基礎</h2>
  <p>我們不單單依賴供應商的數據表。每一批進入我們車間的 PVC 與 Hypalon 織物，都會在廠內獨立測試。這確保我們公布的材質規格，就是您實際收到的材質性能 — 批批如此，年年如此。</p>

  <h2>標準化測試設備</h2>
  <p>我們的織物實驗室配備符合 ISO、ASTM 與 EN 測試方法的工業級儀器：</p>
  <table>
    <thead><tr><th>設備</th><th>量測參數</th><th>標準</th></tr></thead>
    <tbody>
      <tr><td>萬能拉伸試驗機（50 kN）</td><td>斷裂力、斷裂伸長率、撕裂擴展</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>氙弧耐候試驗箱</td><td>UV 耐候性（色變、2000 小時後的強度保持率）</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>低溫撓曲試驗機</td><td>-30 °C 至 -50 °C 的龜裂點</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Taber 耐磨試驗機</td><td>1000 次循環後的重量損失（CS-10 磨輪）</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>厚度計（數位式，解析度 0.001 mm）</td><td>整捲寬度的均勻度</td><td>ISO 2286-3</td></tr>
      <tr><td>水壓測試儀</td><td>抗水滲透性</td><td>ISO 811</td></tr>
    </tbody>
  </table>
  <p class="text-sm text-gray-500">* 所有設備每年均由第三方認證實驗室校正。</p>

  <h2>從數據到決策：典型的測試流程</h2>
  <p>當新的候選織物送達時，會依循一套標準化的七步驟驗證流程：</p>
  <ol>
    <li><strong>進料檢驗</strong> — 目視檢查表面缺陷、針孔與尺寸符合性。</li>
    <li><strong>厚度分布量測</strong> — 在整捲織物上進行 20 點量測；CV &lt; 3% 方可驗收。</li>
    <li><strong>拉伸測試</strong> — 經向與緯向各取 5 個試樣。1100 dtex PVC 的最低要求為 3500 N/50 mm。</li>
    <li><strong>UV 老化處理</strong> — 在氙弧箱中曝晒 1000 小時；強度保持率至少須達 80 %。</li>
    <li><strong>低溫龜裂</strong> — 在 -35 °C 下放置 4 小時，然後繞 25 mm 心軸彎折 180°。不得出現可見龜裂。</li>
    <li><strong>耐磨性</strong> — 1000 次循環，重量損失 ≤ 0.05 g。</li>
    <li><strong>核准簽核</strong> — 唯有通過全部七道關卡後，織物才會放行進入生產。</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">典型 PVC 1100 dtex — UV 曝晒後的拉伸強度保持率</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 h<br />100%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 h<br />95%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 h<br />88%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 h<br />82%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">競爭品牌<br />~65%</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">我們的 PVC 1100 dtex 織物在 2000 小時氙弧曝晒後仍保有 &gt; 80 % 的拉伸強度，而一般業界等級往往會降到 70 % 以下。</p>
  </div>

  <h2>我們的專業團隊</h2>
  <p>實驗室由兩位全職材料工程師主持，各自擁有高分子科學或紡織工程學位，並具備至少六年的業界經驗。另有三位技術人員負責日常測試與數據記錄。團隊定期參與由國際標準化組織（ISO）主辦的實驗室間比對測試（round-robin trials），以驗證我們測試方法的準確性。</p>

  <h2>解決您最棘手的材料挑戰</h2>
  <p>每個海洋環境都不盡相同。在波斯灣執勤的巡邏艇，與在北海水域的救難艇所面對的 UV 與溫度條件截然不同。我們的織物實驗室協助您選擇 — 或開發 — 最適合您作業特性的織物規格。</p>
  <p>近期的客製方案包括：</p>
  <ul>
    <li>為船艇經常在珊瑚礁擱淺的軍方客戶開發的高耐磨 PVC 配方（耐磨壽命提升 40 %）。</li>
    <li>為北極研究站開發的低溫 Hypalon 配方，經 -50 °C 測試仍不脆化。</li>
    <li>為搜救船隊開發的色彩穩定橘色織物，在熱帶烈日下曝晒 3 年後仍維持高度可辨識性。</li>
  </ul>
  <p>我們不會販售「現成」織物然後寄望它們能行。我們會測試、驗證，並推薦 — 或創造 — 專為您任務特性打造的解決方案。這就是 {SITE.name} 的與眾不同之處。</p>

  <h2>我們如何為您服務</h2>
  <p>當您帶著材料挑戰前來時，您可以期待以下流程：</p>
  <ol>
    <li><strong>諮詢</strong> — 我們討論您的作業環境、性能目標與預算。</li>
    <li><strong>提案</strong> — 草擬一份含明確合格／不合格標準與時程的測試計畫。</li>
    <li><strong>執行</strong> — 我們的實驗室執行測試，產出含原始數據與比較分析的詳盡報告。</li>
    <li><strong>建議</strong> — 我們提出織物規格建議；若有多種材料符合您的需求，也會提供替代選項。</li>
    <li><strong>後續追蹤</strong> — 交貨之後，我們仍持續為您解答任何使用上的材料疑問。</li>
  </ol>
  <p>我們的目標不只是賣給您一艘船，而是確保您收到的船艇能在您的作業環境中可靠運行 — 而這一切，始於織物。</p>

hero:
  tagline: 生產能力
  title: 製造能力與年產量
  subtitle: 12,000 m² 工廠每年生產 15,000+ 艘船艇，且具備擴展空間
intro: afarer 運營著中國青島最大的專業充氣艇製造設施之一。我們的 12,000 m² 工廠設有六個並行運行的專業車間，使我們具備年產 15,000 多艘船艇的能力，涵蓋 SUP、皮划艇、小艇、SUP 和安全設備生產線。
highlights:
  - value: 12,000 m²
    label: 總製造面積
    detail: 跨越 6 個專業車間
  - value: 15,000+
    label: 年產量
    detail: SUP、皮划艇、SUP、小艇、安全裝備
  - value: 200+
    label: 熟練員工
    detail: 25+ 名工程師，雙班制
  - value: 50+
    label: 出口國家
    detail: 歐盟、美國、澳大利亞、中東、亞洲
  - value: 30—5
    label: 標準交期（天）
    detail: 從 PO 確認到 FOB 發貨
  - value: 10+
    label: 出口經驗年限
    detail: 始於 2012 年
workshops:
  - title: SUP 板生產
    description: 4 條並行充氣 SUP 板裝配線。每條線每班可生產 50–70 塊板。數字印刷和絲網印刷工位同時運行。SUP 年產能：8,000+ 塊。
    output: 8,000+ SUP/年
  - title: SUP 艇生產
    description: 專用玻璃鋼船體車間，配有 6 個模具工位，SUP 船體最長 7.6 m。管焊接和裝配區同時處理 3–5 艘 SUP。SUP 年產能：2,000+ 艘。
    output: 2,000+ SUP/年
  - title: 充氣艇與小艇
    description: 充氣艇、皮划艇和小艇的多用途生產線。熱風焊接工位、RF 介質壓力機和裝配工作站根據訂單組合重新配置。年產能：5,000+ 件。
    output: 5,000+ 件/年
  - title: 安全設備
    description: 單獨的潔淨室生產區用於救生衣和安全設備。專用縫紉、泡沫插入和測試工位。救生衣年產能：50,000+ 件。
    output: 50,000+ 件救生衣/年
oem_capacity:
  moq: SUP：5-10 件 | SUP：2-5 艘 | 皮划艇/小艇：10-50 件 | 定製模具：200+ 件
  lead_time: 標準 30-45 天。樣品 15-20 天。可加急。
  payment: 電匯 30% 定金 + 70% 發貨前付清。接受信用證、西聯匯款。

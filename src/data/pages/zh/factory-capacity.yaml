workshops:
  - title: SUP 板生產
    description: 4 條並行充氣 SUP 板裝配線。每條線每班可生產 50–70 塊板。數字印刷和絲網印刷工位同時運行。SUP 年產能：8,000+ 塊。
    output: 8,000+ SUP/年
  - title: SUP 槳板生產
    description: 利用額外裝配線擴展 SUP 板生產能力。Drop-stitch 芯材粘合、數位印刷及組裝站同步運行。
    output: 2,000+ SUP/年
  - title: SUP 槳板與配件
    description: 'SUP 板與配件多用途產線。熱風焊接站、RF 介質壓力機及組裝工作站依訂單組合靈活調配。年產能：5,000+ 件。'
    output: 5,000+ 件/年
  - title: 安全裝備
    description: '獨立潔淨室生產區域，專門生產救生衣及安全裝備。設有專用縫紉、泡棉填充及測試站。救生衣年產能：50,000+ 件。'
    output: 年產 50,000+ 件救生衣
oem_capacity:
  moq: 'SUP：5–10 件 | 定製模具：200+ 件'
  lead_time: 標準 30-45 天。樣品 15-20 天。可加急。
  payment: 電匯 30% 定金 + 70% 發貨前付清。接受信用證、西聯匯款。

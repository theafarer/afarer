intro: afarer 在中國青島經營規模最大的專業充氣式 SUP 製造基地之一。我們的 12,000 m² 工廠分為六個專業車間並行運作，賦予我們每年超過 15,000 塊船艇的產能，涵蓋 SUP 與安全裝備產線。

workshops:
  - title: SUP 板生產
    description: 4 條並行充氣 SUP 板裝配線。每條線每班可生產 50–70 塊板。數字印刷和絲網印刷工位同時運行。SUP 年產能：8,000+ 塊。
    output: 8,000+ SUP/年
  - title: SUP 槳板生產
    description: Expanded production capacity for SUP boards utilizing additional assembly lines. Drop-stitch core bonding, digital printing, and assembly stations run concurrently.
    output: 2,000+ SUP/年
  - title: SUP 槳板與配件
    description: "Multi-purpose production lines for SUP boards and accessories. Hot-air welding stations, RF dielectric presses, and assembly workstations are reconfigured based on order mix. Annual capacity: 5,000+ units."
    output: 5,000+ 件/年
  - title: 安全裝備
    description: "Separate clean-room production area for life vests and safety equipment. Dedicated sewing, foam insertion, and testing stations. Annual life vest capacity: 50,000+ units."
    output: 年產 50,000+ 件救生衣
oem_capacity:
  moq: "SUP: 5—0 units | Custom mould: 200+ units"
  lead_time: 標準 30-45 天。樣品 15-20 天。可加急。
  payment: 電匯 30% 定金 + 70% 發貨前付清。接受信用證、西聯匯款。

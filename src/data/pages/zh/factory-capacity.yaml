hero:
  tagline: 生產能力
  title: 製造能力與年產量
  subtitle: 12,000 m² 廠房，年產 15,000+ SUP，具備擴展空間
intro: afarer operates one of the largest dedicated inflatable SUP manufacturing facilities in Qingdao, China. Our 12,000 m² factory is organized into six specialized workshops operating in parallel, giving us the capacity to produce over 15,000 boards annually across SUP and safety equipment lines.

hero:
  tagline: 指南
  title: SUP 新手？
  subtitle: 實用指南，協助您選擇、使用並享受充氣 SUP 板的樂趣。
size_guide:
  tagline: 尺寸與規格
  title: 找到適合您的尺寸
  desc: 比較 SUP 板尺寸、載重能力與推薦用途。無論您需要旅行 SUP、瑜珈板還是全能 SUP，我們的尺寸指南都能協助您選擇合適的產品。
  link_label: 完整尺寸指南（含產品規格）→
  link: /size-guide
  cards:
    - title: SUP 板
      desc: 根據體重和用途選擇長度。較寬的板子（32 吋以上）穩定性更高。較長的板子（11–12 呎）在旅行時航向更穩定。
    - title: 旅行 SUP
      desc: 較長板身（11–12 呎），適合長距離航行與直線追蹤。穩定度足以搭載裝備旅行。請務必檢查載重能力。
    - title: 全能 SUP
      desc: 根據體重和用途選擇長度。較寬板身（32 吋以上）提供穩定性。適合休閒與健身的多用途選擇。

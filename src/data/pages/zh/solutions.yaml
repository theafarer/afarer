features3_solutions:
  tagline: 按業務類型分類的方案
  title: '為您的業務<br />量身打造 SUP'
  isBeforeContent: false
  columns: 2
  items:
    - title: 度假村與飯店
      description: 為酒店物業提供完整 SUP 船隊方案 — 耐用板身、客製品牌及員工培訓支援。
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: 槳板俱樂部
      description: 為槳板俱樂部、課程及會員制營運提供可靠的 SUP 船隊 — 商用級板身，享有俱樂部價格。
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: 租賃業者
      description: 專為每日租賃使用設計的高週轉 SUP 板。抗 UV、快乾、可堆疊 — 專為租賃高強度使用而設計。
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: 零售合作夥伴
      description: 在您的市場銷售成長最快的 SUP 品牌。完整產品線、行銷素材、代發貨及具競爭力的利潤。
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: 經銷商
      description: 獨家區域代理、完整產品組合、專屬客戶管理。加入我們覆蓋 50+ 國的全球經銷網絡。
      icon: tabler:world
      link: /solutions/distributors
    - title: 建立自有品牌
      description: 端到端 OEM/ODM SUP 製造 — 設計、打樣、量產及物流。與 Afarer 一起推出您的品牌。
      icon: tabler:package
      link: /solutions/build-your-own-brand

meta:
  title: '自有品牌 SUP 製造 | {SITE}'
  description: '與 Afarer 一起推出您的自有 SUP 品牌。從概念到市場 — 完整的 OEM/ODM 服務，包括設計、打樣、生產及全球物流。'

hero:
  tagline: 建立自有品牌
  title: '推出您的<br />自有 SUP 品牌'
  subtitle: '您有願景。我們有工廠、專業知識及供應鏈。共同打造一個脫穎而出的品牌。'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: 水上的客製品牌 SUP 板

process:
  title: 您的品牌之旅
  subtitle: '從概念到市場，分五個階段。'
  steps:
    - phase: '第一階段'
      title: '構思'
      period: '第 1-2 週'
      items:
        - '市場研究與競爭分析'
        - '目標客戶定義'
        - '品牌定位討論'
        - '產品線策略'
    - phase: '第二階段'
      title: '設計'
      period: '第 3-6 週'
      items:
        - '板形與圖案設計'
        - '配色與材料選擇'
        - '配件規格'
        - '包裝與標籤設計'
    - phase: '第三階段'
      title: '打樣'
      period: '第 7-10 週'
      items:
        - '樣品生產'
        - '品質測試（壓力、浮力、UV）'
        - '設計調整'
        - '最終核准'
    - phase: '第四階段'
      title: '生產'
      period: '第 11-14 週'
      items:
        - '批量製造'
        - '品管檢驗（逐件）'
        - '海運 / 空運'
        - '通關文件'
    - phase: '第五階段'
      title: '上市'
      period: '第 15-16 週'
      items:
        - '產品攝影'
        - '網站產品上架'
        - '行銷素材'
        - '上市支援'

packages:
  title: 創業方案
  subtitle: '專為品牌成長各個階段設計的方案。'
  items:
    - name: 初創品牌
      tagline: '50-100 件 · 2 款板型'
      features:
        - '基本標誌印刷'
        - '標準包裝'
        - '電子郵件支援'
    - name: 成長品牌
      tagline: '300-1,000 件 · 3-5 款板型'
      features:
        - '客製顏色 + 標誌'
        - '客製包裝'
        - '產品照片'
        - '專屬客戶經理'
    - name: 成熟品牌
      tagline: '1,000+ 件 · 完整產品線'
      features:
        - '全面客製化'
        - '高級包裝'
        - '行銷輔銷材料'
        - '優先生產排程'

features:
  title: 品牌選擇 Afarer 的理由
  subtitle: '10 年以上 OEM 經驗、完整認證、業界最低 MOQ。'
  items:
    - title: '10 年以上 OEM 經驗'
      description: '已為全球品牌交付 2,400+ 船體。'
      icon: 'tabler:clock'
    - title: '完整認證'
      description: 'CE / ISO / UKCA / BSCI / REACH — 全數認證。'
      icon: 'tabler:certificate'
    - title: '30 天交期'
      description: '從訂單到出貨，快於業界平均。'
      icon: 'tabler:truck-delivery'
    - title: '低 MOQ'
      description: '最低 50 件起訂 — 業界最低。'
      icon: 'tabler:package'
    - title: '內部設計'
      description: '從概念到完稿的完整設計支援。'
      icon: 'tabler:palette'
    - title: '全球物流'
      description: '海運、空運及通關支援。'
      icon: 'tabler:world'

cta:
  title: '準備推出您的品牌？'
  subtitle: '開始您的品牌之旅或下載我們的 OEM 指南。'
  actions:
    - text: '開始品牌之旅'
      href: '/contact?package=oem'
      variant: 'primary'
    - text: '下載 OEM 指南'
      href: '/resources/download-catalog'
      variant: 'secondary'

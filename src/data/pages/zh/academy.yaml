meta:
  title: '學院 — SUP 指南與划槳訓練 | {SITE}'
  description: 'Afarer 學院：充氣式立槳板指南、站立式划槳技巧、水上安全與材料知識，適合初學者與專業人士。'
  keywords:
    - '學習站立式划槳'
    - 'SUP 入門指南'
    - '立槳板基礎'
    - 'SUP 技巧'
    - 'SUP 課程'
hero:
  tagline: afarer學院
  title: 學習中心
  subtitle: 適合各個技能水平的指南和教程——從SUP基礎到高級救援技巧
categories:
  - level: 初學者
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP基礎
        desc: 學習站立槳板的基本要領——姿勢、劃槳技巧和平衡。
        slug: beginner-sup-guide
      - title: 劃槳技巧
        desc: 前劃、掃劃、拉槳和低位支撐——掌握基本的劃槳動作。
        slug: sup-paddle-guide
      - title: 安全第一
        desc: 基本安全實踐，包括天氣檢查、救生衣使用、腳繩規則和自救。
        slug: sup-safety-guide
  - level: 中級
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: 旅行要點
        desc: 規劃多小時的划行——導航、補水、配速和解讀風向預報。
        slug: touring-sup-guide
      - title: 天氣判讀
        desc: 解讀海洋預報、識別雲型、瞭解風對水面的影響。
        slug: weather-planning-water-sports
      - title: 導航基礎
        desc: 海圖閱讀、指南針使用、GPS航點設置和沿海划行路線規劃。
        slug: sup-navigation-guide
      - title: 潮汐意識
        desc: 瞭解潮汐週期、水流及其對出發時間和路線的影響。
        slug: understanding-tides
  - level: 高級
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: 多日旅行規劃
        desc: 遠徵後勤——裝備選擇、食物規劃、安全協議和緊急聯繫人。
        slug: sup-travel-guide
      - title: 救援技巧
        desc: 自救、T 型救援和開闊水域拖曳方案。
        slug: sup-self-rescue
      - title: 夜間划行
        desc: 夜間導航——照明要求、路線記憶、群體溝通和危險意識。
        slug: ocean-safety-basics
  - level: 維護保養
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: 清潔與保養
        desc: 每次使用後用淡水沖洗、紫外線防護、防黴處理和正確的乾燥技巧。
        slug: inflatable-sup-maintenance
      - title: 存放指南
        desc: 充氣 SUP 板的最佳存放實踐——放氣、摺疊、溫度控制與保存期限。
        slug: inflatable-sup-storage
      - title: 維修基礎
        desc: 使用PVC修補套件和貼片技術修復小孔、接縫漏氣和閥門問題。
        slug: inflatable-sup-repair
      - title: 閥門維護
        desc: 識別閥門類型（Halkey-Roberts、Boston、Leafield）、清理雜物、更換故障閥杆。
        slug: sup-pump-guide
knowledge_center_tagline: 知識中心
knowledge_center_title: 船用設備與行業指南
knowledge_center_subtitle: 為海洋專業人士、船隊運營商和水上運動愛好者提供的專業知識與選購指南。
knowledge_sections:
  - title: SUP 槳板知識
    tagline: 站立式槳板指南
    desc: 關於 SUP 板的一切——板體設計、材料、尺寸選擇、維護保養，以及休閒與商業用途的選購建議。
    guides:
      - title: 如何選擇合適的 SUP 槳板
        desc: 選擇 SUP 的完整指南——尺寸、容積、材料、形狀和預期用途。
        href: /learn/sup
      - title: 充氣 vs 硬板 SUP
        desc: 充氣 SUP 與硬質環氧樹脂板的便攜性、耐用性、性能和價值對比。
        href: /compare/inflatable-vs-hardboard
      - title: 商用 SUP 與休閒 SUP 對比
        desc: 不同 SUP 槳板類型——結構標準、形狀、尺寸和推薦用途。
        href: /learn/sup
      - title: 落針式 vs 傳統結構
        desc: 比較 drop-stitch 與傳統結構在 SUP 板上的重量、成本、耐用性和剛性方面的差異。
        href: /learn/drop-stitch-core
  - title: 充氣 SUP 指南
    tagline: 充氣 SUP 知識
    desc: 充氣 SUP 的全面指南——PVC 材料、drop-stitch 結構、安全標準與維護保養最佳實踐。
    guides:
      - title: PVC 與 Hypalon 材料指南
        desc: 充氣 SUP 槳板製造中使用的 PVC 材料權威指南。
        href: /learn/materials
      - title: 充氣 SUP 是如何製造的
        desc: 製造工藝——材料切割、高頻焊接、接縫構造、壓力測試和質量控制。
        href: /learn/inflatable-technology
      - title: SUP 安全指南
        desc: 安全標準、負載能力、正確充氣、出發前檢查和應急程序。
        href: /learn/water-safety
      - title: SUP 維護保養
        desc: 充氣 SUP 槳板的清潔、存放、紫外線防護和維修。
        href: /v2/inflatable-sup-maintenance
  - title: SUP 槳板知識
    tagline: SUP 槳板中心
    desc: 涵蓋 SUP 板類型、材料、製造工藝、維護保養與安全的技術指南。
    guides:
      - title: SUP 槳板類型
        desc: 全能、旅行、瑜伽、運動和兒童 SUP——瞭解差異並選擇適合您的。
        href: /learn/sup
      - title: 拉絲技術
        desc: 數千根內部拉絲如何創建剛性、高壓充氣結構。
        href: /learn/drop-stitch-core
      - title: 材料參考
        desc: PVC 旦尼爾等級、面料重量、抗紫外線性能和船舶級材料詳解。
        href: /learn/materials
      - title: SUP 購買指南
        desc: 針對不同使用場景和技能水平比較 SUP 槳板類型。
        href: /learn/sup
  - title: SUP 知識
    tagline: 站立槳板指南
    desc: 關於 SUP 板的一切——充氣與硬板對比、板體尺寸、材料技術以及適合各技能水平的專家建議。
    guides:
      - title: 充氣 SUP 與硬板 SUP 對比
        desc: 比較 iSUP 和硬環氧樹脂板在便攜性、耐用性、性能和性價比方面的差異。
        href: /learn/sup
      - title: SUP 板尺寸指南
        desc: 長度、寬度和厚度如何影響穩定性、速度和機動性。
        href: /learn/sup
      - title: SUP 維護與保養
        desc: 充氣 SUP 板的清潔、存放、紫外線防護和維修技巧。
        href: /v2/inflatable-sup-maintenance
      - title: 選擇您的第一塊 SUP
        desc: 為初學者提供根據體重、技能水平和預期用途選擇合適站立槳板的指南。
        href: /learn/sup
  - title: 租賃運營指南
    tagline: 租賃業務船隊管理
    desc: 為海灘小店、水上運動中心和物業提供 SUP 租賃船隊的建設和管理指南。
    guides:
      - title: 打造您的租賃船隊
        desc: 如何為您的租賃業務選擇合適的 SUP 板——耐用性、尺寸和投資回報率考慮。
        href: /solutions/rental-operators
      - title: 船隊維護指南
        desc: 最大限度延長槳板壽命並減少租賃船隊停機時間的基本維護實踐。
        href: /solutions/rental-operators
  - title: 度假村與酒店指南
    tagline: 酒店水上活動
    desc: 關於為度假村、酒店和濱水目的地啟動和管理 SUP 項目的指南。
    guides:
      - title: 啟動度假村 SUP 項目
        desc: 啟動 SUP 賓客活動時需考慮的因素——船隊規模、人員配置和收入模型。
        href: /solutions/resorts-hotels
      - title: SUP 與其他水上活動對比
        desc: 從客人體驗和運營效率方面比較 SUP 項目與其他水上運動。
        href: /learn/sup
  - title: 零售與分銷指南
    tagline: SUP 商業合作
    desc: 關於成為 SUP 零售合作伙伴或分銷商的指南——庫存規劃、市場定位和增長策略。
    guides:
      - title: 成為 SUP 零售商
        desc: 如何選擇產品線、管理庫存以及在零售店中營銷 SUP 板。
        href: /solutions/retail-partners
      - title: 商業運營中的 SUP
        desc: 為什麼充氣 SUP 是適用於商業船隊、租賃業務和專業運營商的多功能產品。
        href: /use-cases/search-and-rescue

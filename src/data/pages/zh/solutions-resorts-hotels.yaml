meta:
  title: 度假村 SUP 船隊方案 | {SITE}
  description: Complete SUP fleet solutions for resorts and hotels. Commercial-grade boards, custom branding, staff training, and ROI-optimized packages from 20 to 100+ boards.
hero:
  tagline: 度假村與飯店
  title: 為您的貴賓打造<br />優質水上體驗
  subtitle: Afarer equips resorts worldwide with commercial-grade inflatable SUP fleets — from 20-board starter packages to 100+ board flagship programs. Custom branding, staff training, and replacement parts included.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 度假村貴賓在 pristine 沙灘享受 SUP 立槳
roi_section:
  title: 度假村 SUP 投資回報
  subtitle: 度假村如何通過單次投資實現年 SUP 租賃收入 $50,000 - $200,000+。
  metrics:
    - metric: $50K–$200K+
      label: Annual SUP Revenue
      detail: 按度假村計算，基於船隊規模和入住率
    - metric: 4–6 Months
      label: Average Payback Period
      detail: 一個季節內收回全部船隊投資
    - metric: 40%
      label: Revenue Increase
      detail: 轉用 Afarer 船隊後的平均提升
    - metric: 500+
      label: Rental Cycles Per Board
      detail: 商用級耐用性，適用於日常使用
packages:
  title: 度假村方案系統
  subtitle: 選擇符合您貴賓容量與營收目標的方案。
  items:
    - name: 入門方案
      tagline: 適合：精品度假村，每日最多 20 位貴賓
      features:
        - 20 張 SUP 板（混合尺寸）
        - 20 支槳（可調節）+ 20 件救生衣
        - 4 個雙動打氣筒
        - 2 個存放架
        - 1 組修補套件
        - 12 個月保修 + CE 認證
      revenue: 年收入潛力 $50K–$80K
      cta_text: 取得入門方案
    - name: 高級方案
      tagline: 適合：大型度假村，每日 50-100 位貴賓
      features:
        - 50 張 SUP 板（混合尺寸）
        - 50 支槳 + 50 件救生衣
        - 10 個雙動打氣筒
        - 5 個存放架 / 推車
        - 2 組修補套件
        - 所有板身客製品牌
        - 員工培訓課程（線上）
        - 12 個月保修 + CE 認證
      revenue: 年收入潛力 $120K–$200K+
      popular: true
      cta_text: 取得高級方案
    - name: 旗艦方案
      tagline: 適合：超高端度假村，每日 100 位以上貴賓
      features:
        - 100+ 張 SUP 板
        - 完整配件組
        - 現場員工培訓
        - 專屬客戶經理
        - 優先備品（24 小時發貨）
        - 客製品牌 + 標誌
        - 營銷照片/視頻套裝
        - 24 個月保修 + CE 認證
      revenue: 年收入潛力 $200K+
      cta_text: 取得旗艦方案
case_study:
  quote: 自合作以來，我們的 SUP 出租率提升了 60%，客人滿意度大幅提高。
  author: 水上活動經理
  location: 五星級度假村，馬爾代夫
  results:
    - label: Revenue Growth
      value: +40%
    - label: Cost Reduction
      value: '-60%'
    - label: 回本週期
      value: 4 Months
features:
  title: 度假村選擇 Afarer 的理由
  subtitle: 商用級耐用性、全球物流，以及了解酒店業的合作夥伴。
  items:
    - title: 500+ 租賃循環
      description: 每張板經過測試，可在海水、陽光及沙灘中承受 500+ 租賃循環。
      icon: tabler:shield-check
    - title: 48 小時備品發貨
      description: 備用零件 48 小時內出貨 — 您的租賃收入從不中斷。
      icon: tabler:truck-delivery
    - title: 客製品牌
      description: 以客製顏色和標誌在每張板上呼應度假村形象。
      icon: tabler:palette
    - title: 員工培訓
      description: 為您的活動團隊提供線上及現場培訓課程。
      icon: tabler:school
    - title: 全球物流
      description: 出貨至 50 多個國家，提供合併貨運選項。
      icon: tabler:world
    - title: CE 認證
      description: 所有裝備 CE 認證、ISO 9001:2015 — 安全與品質有保障。
      icon: tabler:certificate
cta:
  title: 準備升級您的貴賓體驗？
  subtitle: 取得度假村方案報價或下載我們的完整度假村目錄。
  actions:
    - text: 取得度假村方案
      href: /contact?package=resort
      variant: primary
    - text: 下載度假村目錄
      href: /resources/download-catalog
      variant: secondary

intro: 一個常見的誤解是流體動力測試僅適用於遠洋船舶。實際上，小型滑行船體（例如 4–6 公尺的 RIB）對其水下形狀的依賴程度，與油輪對球鼻艏的依賴程度一樣高。縱傾角、浸水面積、噴濺生成及通氣現象對速度、油耗及乘坐舒適度均有顯著影響。在 {SITE.name}，我們運營專用的流體動力測試水池，可在投入金屬和面料製造全尺寸原型之前，以比例模型量化這些效應。
content_html: |
  <h2>為什麼要在水池中測試小船？</h2>
  <p>以模型比例（通常為 1:3 至 1:5）進行測試，讓我們能夠快速且經濟地迭代船體形狀。在水池中進行一週測試所獲得的性能數據，等同於全尺寸原型需耗費數月試誤才能取得的成果——且成本僅為其中一小部分。</p>

  <h2>設施規格</h2>
  <table>
    <thead><tr><th>參數</th><th>規格</th></tr></thead>
    <tbody>
      <tr><td>水池尺寸</td><td>35 m (L) × 3.5 m (W) × 1.8 m (D)</td></tr>
      <tr><td>拖曳台車</td><td>電動伺服驅動，最高速度 12 m/s (23 kn)，速度精度 ± 0.5 %</td></tr>
      <tr><td>造波機</td><td>襟板式，可程式化規則與不規則海況，模型尺度下有義波高（Hs）最高 0.3 m</td></tr>
      <tr><td>量測儀器</td><td>六分量測力計（阻力、側向力、偏航力矩）、加速度計、傾斜儀、波高探針</td></tr>
      <tr><td>資料擷取</td><td>每通道 1000 Hz 取樣，即時顯示與後處理套件</td></tr>
      <tr><td>模型製作</td><td>廠內 CNC 銑削與 3D 列印，適用於總長最長 1.8 m 的船體模型</td></tr>
    </tbody>
  </table>

  <h2>我們的測試計畫</h2>
  <p>我們水池中的標準船體開發計畫依循下列流程：</p>
  <ol>
    <li><strong>模型建造</strong> — 以高密度泡棉 CNC 加工 1:3.5 比例模型，並以玻璃纖維包覆以確保剛性。重量與重心（CG）皆調整至符合傅汝德（Froude）縮尺下的滿載狀態。</li>
    <li><strong>阻力測試</strong> — 模型以涵蓋操作範圍的 8-10 種速度進行拖曳。測量總阻力，並以 ITTC-1957 方法分解為摩擦阻力與剩餘阻力分量。</li>
    <li><strong>縱傾與下沉量量測</strong> — 記錄每一速度下的航行縱傾與下沉量。滑行船體的最佳縱傾角以 4-6° 為目標。</li>
    <li><strong>伴流量測</strong> — 在兩種速度下量測橫向波剖面，以評估興波阻力，並辨識可能造成船尾干擾的橫向波交互作用。</li>
    <li><strong>耐海性（選配）</strong> — 於規則波中進行頂浪與順浪測試，以量測附加阻力、垂直加速度與拍擊機率。</li>
    <li><strong>資料分析與建議</strong> — 交付完整報告，內含比較圖表、速度／功率曲線，以及針對全尺寸船體的具體設計建議。</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">典型水池測試結果 — 阻力對比速度（RIB 450 船體，1:3.5 比例）</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">模型尺度阻力 (N) 對應傅汝德（Froude）縮尺速度。全尺寸功率預估依循 ITTC-1978 性能預估方法。</p>
  </div>

  <h2>專業團隊</h2>
  <p>我們的水池由一位擁有船舶工程博士學位、並曾在歐洲大型海事研究機構累積 8 年拖曳水池經驗的流體動力學專家操作。另有一位技術人員協助他準備所有模型與量測儀器。團隊遵循 ITTC（國際拖曳水池會議）建議程序，以確保每一次測試皆可重複、可追溯，且符合國際認可標準。</p>

  <h2>客製船體開發的水池測試</h2>
  <p>我們的水池不僅用於自有設計的船體—我們也定期為希望驗證客製船型或調查性能問題的客戶執行測試計畫：</p>
  <ul>
    <li><strong>船型比較</strong> — 在相同條件下測試兩種以上的候選船型，提供客觀的阻力／速度／穩定性比較，作為您設計決策的參考。</li>
    <li><strong>附屬件最佳化</strong> — 攔截板、防濺條、縱傾調整片與減搖鰭可在各種配置下測試，以量化各自對降低阻力的貢獻。</li>
    <li><strong>引擎匹配研究</strong> — 將阻力數據轉換為功率預估曲線，讓您能為目標速度與載重選擇最佳引擎馬力。</li>
  </ul>

  <h2>為何與我們一同測試？</h2>
  <p>我們交付的不只是一組原始數據。我們的報告將水池數據轉化為可實際執行的工程建議：「將防濺條提高 8 mm 以減少巡航速度下的浸水面積」、「將艉部底角（deadrise）增加 3° 以降低拍擊加速度」，或「將縱向重心後移 150 mm 以改善滑行姿態」。您離開時將清楚了解該改變什麼，以及為何如此改變。</p>
  <p>我們的水池也提供付費的獨立第三方測試服務。如果您正在開發船體，並希望獲得公正、專業執行的流體動力評估，歡迎與我們聯繫。</p>

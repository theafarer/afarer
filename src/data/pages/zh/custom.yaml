steps_section:
  tagline: 操作流程
  title: 從概念到生產
  subtitle: 為全球企業提供OEM、ODM、自有品牌和定製品牌服務。從單個原型到完整批量生產。
  steps:
    - num: "01"
      title: 選擇您的板型
      desc: Select from our core SUP models —all-around, touring, yoga, sport, or kids. Pick size, material, and colour.
    - num: "02"
      title: 上傳您的設計
      desc: 發送您的標誌、設計稿或品牌指南。我們的設計團隊準備數位打樣。
    - num: "03"
      title: AI樣圖審閱
      desc: 在生產開始前查看您定製槳板的 AI 生成逼真效果圖。
    - num: "04"
      title: 選擇您的板型
      desc: Once approved, your order enters our  production line. Lead times from 30 days.
services_section:
  tagline: 服務
  title: 設計您自己的<br />水上運動裝備
  subtitle: 為全球企業提供OEM、ODM、自有品牌和定製品牌服務。從單個原型到完整批量生產。
  items:
    - title: OEM製造
      desc: We produce your designs to spec —your IP, your drawings, your quality standards. Full NDA protection.
      icon: ⚙️
    - title: ODM解決方案
      desc: 從 50+ 成熟平台中選擇，定製尺寸、顏色、圖案和包裝。
      icon: 🎨
    - title: 自有品牌
      desc: 您的品牌在我們的產品上——標誌、包裝、掛牌、說明書。開箱即可零售。
      icon: 🎨
    - title: 定製品牌
      desc: 甲板墊印刷、船體圖案、氣管貼紙和定製標籤——全面品牌整合。
      icon: ⚙️
capabilities_section:
  tagline: 能力
  title: 設計您自己的<br />水上運動裝備
  subtitle: 為全球企業提供OEM、ODM、自有品牌和定製品牌服務。從單個原型到完整批量生產。
  capabilities:
    - label: 訂單數量
      value: MOQ 5–10 units (SUP)
    - label: 交期
      value: 30–45 days standard; 15–20 days for prototypes
    - label: 定製範圍
      value: 尺寸、形狀、顏色、圖案、包裝、硬件
    - label: 材料
      value: PVC、Hypalon、拉絲布、玻璃鋼、鋁合金
    - label: 印刷工藝
      value: 數碼印刷（CMYK）、絲網印刷、熱轉印、熱昇華
    - label: 認證
      value: CE、、UKCA、FCC（支持全球合規）

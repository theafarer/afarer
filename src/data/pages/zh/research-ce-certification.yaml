hero:
  tagline: 合規
  title: 充氣船艇的 CE 認證如何運作
  subtitle: 閱讀時間：7 分鐘
content_html: |
  <h2>什麼是 CE 認證？</h2>
  <p>CE 標誌（Conformit&eacute; Europ&eacute;enne，歐洲合格認證）表示產品符合歐盟的健康、安全與環保要求。對於充氣船艇而言，相關的監管框架取決於產品類別。</p>

  <h2>適用指令</h2>

  <h3>休閒船舶指令（2013/53/EU）</h3>
  <p>適用於大多數充氣船、SUP 槳板與獨木舟的主要指令，涵蓋船體長度 2.5 公尺至 24 公尺的休閒船舶、半成品船（供 OEM 供應）以及個人水上載具。</p>

  <h3>個人防護裝備法規（2016/425）</h3>
  <p>隨船舶提供的救生衣、浮力輔助裝置與安全裝備必須符合 PPE 法規要求，包括由公告機構進行型式檢驗（模組 B）以及生產品質保證（模組 D 或 E）。</p>

  <h2>認證流程</h2>
  <ol>
    <li>產品分類：確定船舶設計類別（依 ISO 8666 為 A – D）</li>
    <li>適用標準：EN ISO 6185（第 1 – 4 部分）、EN ISO 10087（HIN 船身識別碼）、EN ISO 14945（製造商銘牌）</li>
    <li>技術文件準備：設計圖紙、物料清單、材料證書、風險評估</li>
    <li>型式測試：浮力、穩定性、承載能力、材料測試、接縫強度、氣密保持</li>
    <li>工廠生產控管：公告機構對製造流程的審核</li>
    <li>符合性聲明：製造商簽署 DoC 並加貼 CE 標誌</li>
  </ol>

  <h2>充氣船艇的公告機構</h2>
  <p>常見的公告機構包括 Bureau Veritas（法國）、DNV GL（德國）、RINA（義大利）、T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D（德國）。</p>

  <h2>時間與費用</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">階段</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">時間</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">典型費用（歐元）</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">技術文件準備</td><td class="p-3 border">2 – 4 週</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">型式測試</td><td class="p-3 border">4 – 8 週</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">工廠審核</td><td class="p-3 border">1 – 2 天（現場）</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">總計（首件產品）</td><td class="p-3 border">8 – 14 週</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>這對買家意味著什麼</h2>
  <p>採購 CE 認證的充氣船時，務必確認 CE 標誌已印在製造商銘牌上、具備有效的符合性聲明（DoC）、列出公告機構編號，且使用手冊包含您當地語言的說明。所有 Afarer 產品均具備 CE 認證，並可完整追溯至公告機構的審核報告。</p>

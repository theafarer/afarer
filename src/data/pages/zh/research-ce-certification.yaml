content_html: |
  <h2>什麼是 CE 認證？</h2>
  <p>CE 標誌（Conformité Européenne）表示產品符合歐盟健康、安全及環保要求。對於充氣船隻，相關法規框架取決於產品類別。</p>

  <h2>適用法規</h2>

  <h3>休閒船艇指令（2013/53/EU）</h3>
  <p>這是大多數充氣船、SUP 及獨木舟的主要法規。適用於船長 2.5 米至 24 米的休閒船艇、半成品船（供 OEM 供應）及個人水上設備。</p>

  <h3>個人防護裝備法規（2016/425）</h3>
  <p>隨船附送的救生衣、浮力輔助裝置及安全裝備須符合 PPE 法規要求，包括由指定機構進行型式檢驗（B 模組）及生產品質保證（D 或 E 模組）。</p>

  <h2>認證流程</h2>
  <ol>
    <li>產品分類：確定船舶設計類別（依 ISO 8666 之 A – D 類）</li>
    <li>適用標準：EN ISO 6185（第 1 – 4 部分）、EN ISO 10087（HIN）、EN ISO 14945（製造商標牌）</li>
    <li>技術文件準備：設計圖紙、材料清單、材料證明、風險評估</li>
    <li>型式測試：浮力、穩定性、載重能力、材料測試、接縫強度、氣密性</li>
    <li>工廠生產控制：指定機構對製造流程進行稽核</li>
    <li>符合性聲明：製造商簽署 DoC，貼附 CE 標誌</li>
  </ol>

  <h2>充氣船隻的指定機構</h2>
  <p>常見的指定機構包括 Bureau Veritas（法國）、DNV GL（德國）、RINA（義大利）、TÜV Rheinland / TÜV SÜD（德國）。</p>

  <h2>時程與費用</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">階段</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">所需時間</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">典型費用（歐元）</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">技術文件準備</td><td class="p-3 border">2 – 4 週</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">型式測試</td><td class="p-3 border">4 – 8 週</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">工廠稽核</td><td class="p-3 border">1 – 2 天（現場）</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">總計（首項產品）</td><td class="p-3 border">8 – 14 週</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>這對買家意味著什麼</h2>
  <p>購買 CE 認證充氣船時，請務必確認：CE 標誌位於製造商標牌上、具備有效 DoC、列出指定機構編號，且使用手冊包含您當地語言的安全說明。所有 Afarer 產品均具備 CE 認證，並可完整追溯至指定機構的稽核報告。</p>


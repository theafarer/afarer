meta:
  title: '工廠設備 — 裁切、高頻焊接與印刷 | {SITE}'
  description: 'Afarer 的工業級生產設備：PVC 裁切、高頻焊接、數位印刷、組裝，以及充氣式 SUP 板與充氣船的測試。'
  keywords:
    - 'SUP 生產設備'
    - '充氣式 SUP 工廠'
    - 'PVC 高頻焊接'
    - '立槳板生產'
hero:
  tagline: 設備
  title: 製造設備與機械
  subtitle: 用於切割、焊接、印刷和組裝的工業級設備
  back_label: 返回工廠
  back_link: /factory
categories:
  - title: 切割與材料準備
    items:
      - name: 自動PVC切割機
        spec: CNC控制, 6.5 m × 2.5 m, 0.1 mm精度
        desc: 用於PVC、Hypalon和drop-stitch面料的計算機控制自動切割機。排料軟件將材料利用率優化至低於5%的廢料。
      - name: 布料鋪展機
        spec: 最大寬度3 m, 張力控制送料
        desc: 以受控張力將布料鋪成單層或多層，以防切割前變形。
  - title: 管材焊接與粘接
    items:
      - name: 熱封機
        spec: 熱風焊接, 可變200–600 °C, 0.5–5 m/min
        desc: 用於連接和焊接PVC及Hypalon管材接縫的熱風熱封機。用於管材腔室和浮體接頭的固定、密封和熔合。
      - name: 介電RF壓力機
        spec: 15 kW, 壓板2000 × 600 mm
        desc: 用於主要縱向接縫、尾板-管材接頭和大型腔室製造的高頻焊接壓力機。
      - name: CNC控制的RF焊機
        spec: 8 kW, XY工作臺2500 × 1200 mm
        desc: 用於複雜幾何形狀、徽標壓花和精密補片的程序化曲線接縫焊接。
  - title: SUP 槳板製造
    items:
      - name: 玻璃纖維手工鋪層模具
        spec: 大幅面壓力機，適用於長達 14 英尺的槳板芯材
        desc: 採用聚酯和乙烯基酯樹脂系統的傳統手工鋪層玻璃纖維成型。每層手工滾壓並真空袋壓，以確保層壓板質量與強度一致。
      - name: 膠衣噴塗房
        spec: 溫度控制, 過濾空氣通風
        desc: 尾鰭盒、手柄開口和定製槳板部件的加工。
  - title: SUP印刷與裝飾
    items:
      - name: 數字打印機
        spec: 高分辨率噴墨, 打印寬度達2 m
        desc: 用於全綵SUP甲板圖形的直接織物數字印刷。使用抗紫外線的水性墨水打印定製圖案、漸變和照片質量圖像。
      - name: 絲網印刷機
        spec: 手動和半自動, 多色套印
        desc: 用於SUP板徽標、品牌標誌和重複圖案的絲網印刷。提供耐用、不透明的印刷，色彩飽和鮮豔。
  - title: 組裝與裝配
    items:
      - name: 發動機葫蘆
        spec: 500 kg承重, 可調橫杆
        desc: 安全安裝2.5至60馬力的舷外發動機。
      - name: 控制台樣架
        spec: 高度和角度可調
        desc: 安裝前對轉向、節流和儀表盤進行預裝配。
      - name: 液壓軟管壓接機
        spec: 最大1" ID, 數字壓力錶
        desc: 帶有壓制接頭的定製長度液壓轉向軟管組件。
  - title: 測試與質量控制
    items:
      - name: 萬能拉力試驗機
        spec: 50 kN，/ ASTM D751
        desc: 面料批次的斷裂力、斷裂伸長率和撕裂擴展測試。
      - name: 保氣測試臺
        spec: 可編程, 保壓30分鐘
        desc: 組裝前對每個管材腔室的自動保壓測試。
      - name: 接縫剝離測試儀
        spec: 電動180°剝離, 100 mm/min
        desc: 根據ISO 6185對焊接和粘合接縫的剝離強度測試。
      - name: 氙弧老化試驗箱
        spec: 2000 h暴露
        desc: 針對變色和強度保持的紫外線耐受性測試。

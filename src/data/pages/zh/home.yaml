who_we_serve:
  tagline: 我們的客戶
  title: 為每個水上業務提供完整的 SUP 解決方案
  subtitle: 為四個關鍵市場提供專用設備、製造和業務支援。
  items:
    - title: 槳板俱樂部
      keywords: SUP 俱樂部設備, 槳板學校設備, 租賃船隊
      description: 為槳板俱樂部和學校提供耐用的 SUP 船隊、會員定價和更換零件計劃。
      icon: tabler:users
      cta: 探索槳板俱樂部方案
      link: /solutions/paddle-clubs
    - title: 度假村與酒店
      keywords: 度假村水上活動, 酒店沙灘設備, 賓客體驗
      description: 提供包含定製品牌、員工培訓和 ROI 最優化套餐的完整 SUP 船隊計劃。
      icon: tabler:building
      cta: 打造度假村水上體驗
      link: /solutions/resorts-hotels
    - title: 零售合作夥伴
      keywords: SUP 批發, 戶外零售商, 體育用品店
      description: 提供完整產品線、營銷材料、代發貨選項和具競爭力的批發利潤。
      icon: tabler:shopping-cart
      cta: 成為零售合作夥伴
      link: /solutions/retail-partners
    - title: 新 SUP 品牌
      keywords: 貼牌 SUP, 定製 SUP 品牌, OEM 槳板
      description: 一站式 OEM/ODM 製造 — 設計、打樣、量產和全球物流。
      icon: tabler:package
      cta: 打造您的 SUP 品牌
      link: /oem-odm-manufacturer
proof_points:
  title: 全球水上企業的信賴之選
  subtitle: 數十年的船舶工程經驗，為您的 SUP 項目保駕護航。
  items:
    - metric: 10+
      label: 年經驗
      detail: 自 2012 年
    - metric: 50+
      label: 服務國家
      detail: 全球分銷網絡
    - metric: 15,000+
      label: 年產量
      detail: CE 認證產能
    - metric: 100%
      label: CE 認證
      detail: 符合 ISO 9001、BSCI、REACH 標準
business_solutions:
  tagline: 我們的服務
  title: 從概念到營收的合作夥伴
  subtitle: 四項核心能力，幫助水上業務啟動、運營和增長。
  items:
    - title: 專業設備
      description: 專為日常租賃設計的商用級 SUP 槳板，500+ 次使用週期，維護成本極低。
      icon: tabler:shield-check
    - title: OEM 製造
      description: 從設計和打樣到量產和全球交付的一站式貼牌生產。
      icon: tabler:package
    - title: 業務支援
      description: 員工培訓、營銷材料、更換零件計劃和專屬客戶經理。
      icon: tabler:headset
    - title: 全球物流
      description: 青島 FOB、主要港口 CIF、送貨上門至 50+ 國家，含報關支援。
      icon: tabler:truck-delivery
oem_section:
  tagline: 推出您的品牌
  title: 從創意到上市僅需 16 週
  subtitle: 您的 SUP 品牌全面啟動合作夥伴 — 設計、打樣、製造、出貨。
  steps:
    - number: "01"
      title: 創意與簡報
      desc: 分享您的願景、目標市場和規格要求。
    - number: "02"
      title: 設計與工程
      desc: 3D 建模、材料選擇和定製圖案設計。
    - number: "03"
      title: 打樣與驗證
      desc: 樣品生產，含 CE 認證和質量測試。
    - number: "04"
      title: 批量生產
      desc: 全面量產，配備在線 QC 和工廠審核支援。
    - number: "05"
      title: 全球交付
      desc: 青島 FOB 物流、主要港口 CIF、送貨上門。
  cta: 開始您的品牌之旅
  cta_link: /oem-odm-manufacturer
cta:
  title: |
    準備好開始您的 <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">OEM/ODM 項目</span>？
  subtitle: 告訴我們您的需求，我們將在一個工作日內提供定製報價、最小起訂量詳情和交貨期。
  actions:
    - variant: primary
      text: 獲取報價
      href: /contact
      icon: tabler:message-circle
    - text: 參觀工廠
      href: /factory

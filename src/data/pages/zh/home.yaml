meta:
  title: '高性能充氣 SUP 槳板 — Afarer 水上運動 | {SITE}'
  description: 'Afarer 以運動性能與設計表達為核心，設計適用於開放水域、長途巡航、瑜珈與探險的高性能充氣 SUP。Drop-stitch 高剛性結構、逐板壓力測試，並提供清晰保固。探索全系列。'
  keywords:
    - '高性能充氣 SUP'
    - '高階充氣槳板'
    - '充氣 SUP 板品牌'
    - '長途充氣 SUP'
    - '充氣立槳板'
hero:
  tagline: 高性能充氣 SUP 槳板
  title: |
    划得更遠。<br />駕馭更強。
  subtitle: |
    為開放水域、長日巡航與探索自由而設計的高性能充氣 SUP——<br />
    關鍵時刻穩定，壓力之下剛性十足，<br />
    隨時準備面對變化的水面。
  taglineSection: 為自信而造，為獨特而設計。
  actions:
    - variant: primary
      text: 探索槳板
      href: /inflatable-sup
      icon: tabler:waves
    - text: 找到你的板
      href: /size-guide
      icon: tabler:compass
    - text: 認識 Afarer
      href: /afarer-story
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Afarer 充氣 SUP 在晨光中滑行於開放水域——為長日巡航與探索自由而造
who_we_serve:
  tagline: 與我們一同划行
  title: 為你的划行方式而造
  subtitle: 從第一槳到最長的路線——也為那些讓更多人上水的俱樂部、度假村與零售夥伴。
  items:
    - title: 新手與休閒玩家
      keywords: 新手充氣 SUP, 全能槳板, 穩定 SUP
      description: 寬體穩定全能板，讓第一槳就自然流暢，並陪伴你一路進步。
      icon: tabler:users
      cta: 找到你的第一塊板
      link: /all-around-sup
    - title: 長途與探險玩家
      keywords: 長途 SUP, 遠距離槳板, 探險 SUP
      description: 更長更窄的板型，直線追蹤、滑行更遠，可攜帶多日探險裝備。
      icon: tabler:building
      cta: 探索長途槳板
      link: /touring-sup
    - title: 俱樂部、度假村與租賃
      keywords: SUP 租賃船隊, 槳板俱樂部設備, 度假村水上活動
      description: 適合組建船隊的耐用充氣 SUP，維護簡單，並提供零件更換支援。
      icon: tabler:shopping-cart
      cta: 組建你的船隊
      link: /solutions
    - title: 零售與品牌合作夥伴
      keywords: 自有品牌 SUP, 訂製 SUP 品牌, 批發槳板
      description: 獨特設計、設計協作與穩定供貨，助力零售商與新興水上運動品牌。
      icon: tabler:package
      cta: 與 Afarer 合作
      link: /oem-odm-manufacturer
proof_points:
  title: 超越展間的實測
  subtitle: 可以驗證的設計、性能與品質——在水上，也在數字裡。
  items:
    - metric: 10+
      label: 年水上設計經驗
      detail: 自 2012 年以來逐板精進
    - metric: 50+
      label: 遍布全球水域
      detail: 世界各地的玩家與合作夥伴
    - metric: 12–15
      label: PSI Drop-Stitch 核心
      detail: 需要剛性處剛性，收納也輕鬆
    - metric: 100%
      label: 逐板壓力測試
      detail: 出廠前逐一檢測
business_solutions:
  tagline: 為何上板感受不同
  title: 第一槳就能感受到的性能
  subtitle: 由真實水域打造的四大支柱——而不只是製造能力。
  items:
    - title: 水上性能
      description: 為穩定性、滑行與風浪信心調校的板型——每一槳都與水面連結。
      icon: tabler:shield-check
    - title: 設計表達
      description: 從潮汐、海洋生物與岸線能量汲取靈感的系列——你樂於與之同行的板。
      icon: tabler:package
    - title: 經得起考驗的結構
      description: 高密度 drop-stitch 核心、強化邊軌與熱熔接縫，為反覆使用而生。
      icon: tabler:headset
    - title: 可驗證的品質
      description: 壓力測試、外觀檢驗，並提供清晰保固與快速的售後支援。
      icon: tabler:truck-delivery
oem_section:
  tagline: Afarer Studio
  title: 從靈感到水面——可規模化的設計合作
  subtitle: 為想要超越量產目錄的零售商與新興品牌：協作設計、務實工程，以及可規模化交付的產品。
  steps:
    - number: '01'
      title: 創意與簡報
      desc: 分享你的願景、目標玩家與設計水域。
    - number: '02'
      title: 設計與工程
      desc: 3D 建模、材料選擇與獨特的圖像設計。
    - number: '03'
      title: 打樣與驗證
      desc: 樣板經壓力測試與真實水域驗證後再投入。
    - number: '04'
      title: 規模化生產
      desc: 每個階段皆設品質檢查點的穩定量產。
    - number: '05'
      title: 全球交付
      desc: 從青島到主要港口的物流與報關支援。
  cta: 啟動設計專案
  cta_link: /oem-odm-manufacturer
cta:
  title: 找到你的下一塊板。
  subtitle: 無論是划出第一槳、為俱樂部配置設備，還是打造一個板類品牌——我們帶你上水。
  actions:
    - variant: primary
      text: 探索全系列
      href: /inflatable-sup
      icon: tabler:send
    - text: 索取目錄
      href: /resources/download-catalog

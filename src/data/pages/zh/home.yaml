meta:
  title: '高性能充氣 SUP 槳板 — Afarer 水上運動 | {SITE}'
  description: 'Afarer 以運動性能與設計表達為核心，設計適用於開放水域、長途巡航、瑜珈與探險的高性能充氣 SUP。Drop-stitch 高剛性結構、逐板壓力測試，並提供獨家國家合作與限量聯名系列。探索全系列。'
  keywords:
    - '高性能充氣 SUP'
    - '高階充氣槳板'
    - '充氣 SUP 板品牌'
    - '長途充氣 SUP'
    - '聯名槳板'
    - '國家 SUP 經銷商'
hero:
  tagline: 高性能充氣 SUP 槳板
  title: |
    划得更遠。<br />駕馭更強。
  subtitle: |
    為開放水域、長日巡航與探索自由而設計的高性能充氣 SUP——<br />
    關鍵時刻穩定，壓力之下剛性十足，<br />
    隨時準備面對變化的水面。
  taglineSection: 為自信而造，為獨特而設計。
  actions:
    - variant: primary
      text: 探索槳板
      href: /inflatable-sup
      icon: tabler:waves
    - text: 找到你的板
      href: /size-guide
      icon: tabler:compass
    - text: 認識 Afarer
      href: /afarer-story
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Afarer 充氣 SUP 在晨光中滑行於開放水域——為長日巡航與探索自由而造
who_we_serve:
  tagline: 與我們一同划行
  title: 為你的划行方式而造
  subtitle: 從第一槳到最長的路線——也為那些讓更多人上水的俱樂部、度假村與零售夥伴。
  items:
    - title: 新手與休閒玩家
      keywords: 新手充氣 SUP, 全能槳板, 穩定 SUP
      description: 寬體穩定全能板，讓第一槳就自然流暢，並陪伴你一路進步。
      icon: tabler:users
      cta: 找到你的第一塊板
      link: /all-around-sup
    - title: 長途與探險玩家
      keywords: 長途 SUP, 遠距離槳板, 探險 SUP
      description: 更長更窄的板型，直線追蹤、滑行更遠，可攜帶多日探險裝備。
      icon: tabler:building
      cta: 探索長途槳板
      link: /touring-sup
    - title: 俱樂部、度假村與租賃
      keywords: SUP 租賃船隊, 槳板俱樂部設備, 度假村水上活動
      description: 適合組建船隊的耐用充氣 SUP，維護簡單，並提供零件更換支援。
      icon: tabler:shopping-cart
      cta: 組建你的船隊
      link: /solutions
    - title: 國家經銷商與聯名合作夥伴
      keywords: 國家 SUP 經銷商, 聯名 SUP, 自有品牌 SUP
      description: 為合格的水上運動企業提供國家獨家經銷與限量聯名系列。
      icon: tabler:package
      cta: 成為合作夥伴
      link: /distributor-program
proof_points:
  title: 超越展間的實測
  subtitle: 可以驗證的設計、性能與品質——在水上，也在數字裡。
  items:
    - metric: 10+
      label: 年水上設計經驗
      detail: 自 2012 年以來逐板精進
    - metric: 50+
      label: 遍布全球水域
      detail: 世界各地的玩家與合作夥伴
    - metric: 12–15
      label: PSI Drop-Stitch 核心
      detail: 需要剛性處剛性，收納也輕鬆
    - metric: 100%
      label: 逐板壓力測試
      detail: 出廠前逐一檢測
business_solutions:
  tagline: 為何上板感受不同
  title: 第一槳就能感受到的性能
  subtitle: 由真實水域打造的四大支柱——而不只是製造能力。
  items:
    - title: 水上性能
      description: 為穩定性、滑行與風浪信心調校的板型——每一槳都與水面連結。
      icon: tabler:shield-check
    - title: 設計表達
      description: 從潮汐、海洋生物與岸線能量汲取靈感的系列——你樂於與之同行的板。
      icon: tabler:package
    - title: 經得起考驗的結構
      description: 高密度 drop-stitch 核心、強化邊軌與熱熔接縫，為反覆使用而生。
      icon: tabler:headset
    - title: 可驗證的品質
      description: 壓力測試、外觀檢驗，並提供清晰保固與快速的售後支援。
      icon: tabler:truck-delivery
oem_section:
  tagline: 聯名系列
  title: 從靈感到水面——聯名系列
  subtitle: 為想要超越量產目錄的合作夥伴：與 Afarer 共同設計、工程與打造的限量聯名系列——每塊板仍是 Afarer 的產品。
  steps:
    - number: '01'
      title: 創意與簡報
      desc: 分享你的願景、目標玩家與設計水域。
    - number: '02'
      title: 設計與工程
      desc: 3D 建模、材料選擇與獨特的圖像設計。
    - number: '03'
      title: 打樣與驗證
      desc: 樣板經壓力測試與真實水域驗證後再投入。
    - number: '04'
      title: 規模化生產
      desc: 每個階段皆設品質檢查點的穩定量產。
    - number: '05'
      title: 全球交付
      desc: 從青島到主要港口的物流與報關支援。
  cta: 探索聯名合作
  cta_link: /co-brand
cta:
  title: 找到你的下一塊板。
  subtitle: 無論是划出第一槳、為俱樂部配置設備，還是打造一個板類品牌——我們帶你上水。
  actions:
    - variant: primary
      text: 探索全系列
      href: /inflatable-sup
      icon: tabler:send
    - text: 索取目錄
      href: /resources/download-catalog
distributor:
  tagline: 國家獨家經銷商
  title: 一國。一位官方 Afarer 經銷商。
  subtitle: 一國一獨家代理計劃：區域獨家授權、經銷商價格、行銷支援，以及專屬的 Distributor Success Program 經銷商成功計劃。
  benefits:
    - title: 區域獨家授權
      description: 每個國家或地區僅一家授權經銷商——無內部競爭，無渠道衝突。
    - title: 工廠直供利潤
      description: 經銷商價格表與年度返利，FOB 青島出貨。
    - title: 行銷與培訓支援
      description: 聯合品牌素材、店頭行銷物料、產品培訓與上市推廣。
    - title: 專屬客戶團隊
      description: 專屬經理對接，搭配 Distributor Success Program 的入駐、預測與補貨支援。
  actions:
    - variant: primary
      text: 成為經銷商
      href: /distributor-program
    - text: 索取經銷商價格表
      href: /contact?subject=Dealer Price List
    - text: 申請國家獨家合作
      href: /contact?subject=Country Partnership Application
    - text: 下載經銷商計劃
      href: /distributor-program
  note: 樣品訂單 5–10 件起；試單 10–30 件；授權經銷商 30–50 件；國家/區域經銷商 100–300+ 件。

      description: 青島 FOB、主要港口 CIF、送貨上門至 50+ 國家，含報關支援。
      icon: tabler:truck-delivery
oem_section:
  tagline: 推出您的品牌
  title: 從創意到上市僅需 16 週
  subtitle: 您的 SUP 品牌全面啟動合作夥伴 — 設計、打樣、製造、出貨。
  steps:
    - number: "01"
      title: 創意與簡報
      desc: 分享您的願景、目標市場和規格要求。
    - number: "02"
      title: 設計與工程
      desc: 3D 建模、材料選擇和定製圖案設計。
    - number: "03"
      title: 打樣與驗證
      desc: 樣品生產，含 CE 認證和質量測試。
    - number: "04"
      title: 批量生產
      desc: 全面量產，配備在線 QC 和工廠審核支援。
    - number: "05"
      title: 全球交付
      desc: 青島 FOB 物流、主要港口 CIF、送貨上門。
  cta: 開始您的品牌之旅
  cta_link: /oem-odm-manufacturer
cta:
  title: 準備好開展您的水上運動業務了嗎？
  subtitle: 無論是創辦俱樂部、裝備度假村，還是打造品牌——我們隨時為您提供幫助。
  actions:
    - variant: primary
      text: 啟動您的項目
      href: /contact
      icon: tabler:send
    - text: 下載 OEM 指南
      href: /resources/download-catalog

features3_markets:
  tagline: 關鍵市場
  title: 區域專長<br />滿足本地需求
  subtitle: 我們瞭解不同市場有不同的法規要求、偏好和使用場景。
  isBeforeContent: false
  columns: 4
  items:
    - title: 歐洲與英國
      description: CE-certified products. Strong demand for SUP boards across EU markets. UK distributors appreciate our quick turnaround.
      icon: tabler:map-pin
    - title: 北美
      description: US Coast Guard approved manufacturing. US warehouse in Montclair, CA for fast West Coast delivery. Growing demand for fishing boats, rescue craft, and recreational SUPs.
      icon: tabler:map-pin
    - title: 澳大利亞與大洋洲
      description: Strong market for SUP boards and water sports accessories. Australian distributors value our UV-resistant PVC construction in harsh sun conditions. Quick shipping from our Asia facility.
      icon: tabler:map-pin
    - title: 中東
      description: Growing demand for water adventure equipment. Our commercial-grade SUPs and safety gear are popular with tour operators and rental centers. Custom configurations for high-temperature environments.
      icon: tabler:map-pin
features3_distribution:
  tagline: 分銷網絡
  title: 與全球分銷商<br />合作
  subtitle: 我們與成熟的船舶設備分銷商、OEM 品牌和政府採購機構合作。
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM 合作
      description: 為全球水上運動品牌提供自有品牌製造。我們處理從設計到生產再到一件代發的一切事宜。
      icon: tabler:building
    - title: 分銷商網絡
      description: 20 多個國家的授權分銷商持有庫存並提供本地支持。歡迎新分銷商諮詢。
      icon: tabler:users
    - title: 政府與機構
      description: 直接供應給海岸警衛隊、搜索救援組織和軍事採購項目。符合機構採購要求。
      icon: tabler:building-community
steps2_logistics:
  title: 全球物流與支持
  subtitle: 從工廠到目的地——我們管理整個供應鏈。
  items:
    - title: 運輸選項
      description: 海運（FOB 青島）、急單空運、樣品和備件快遞。
      icon: tabler:truck-delivery
    - title: 美國倉庫
      description: 庫存存放在加州蒙克萊爾，可快速配送至北美各地。西海岸：2-3 天，中部：3-4 天，東海岸：4-5 天。
      icon: tabler:building-warehouse
    - title: 備件
      description: 正品 afarer 備件和耗材全年備貨。常用零件 24 小時內發貨。
      icon: tabler:package
    - title: 技術支持
      description: Direct line to our engineering team for technical questions, repair advice, and refit support. We support boats we built 20 years ago.
      icon: tabler:headset
cta:
  title: 想成為分銷商嗎？
  subtitle: 我們正在積極擴展分銷網絡。聯繫我們的出口團隊討論合作機會。
  actions:
    - variant: primary
      text: 合作諮詢
      href: /contact
    - text: 查看我們的產品系列
      href: /products

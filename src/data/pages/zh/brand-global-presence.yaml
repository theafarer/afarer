hero:
  tagline: 全球佈局
  title: 服務 50+ 個國家<br />遍佈每個大洲
  subtitle: 從歐洲沿海巡邏運營商到澳大利亞水上運動分銷商，再到中東救援隊——afarer 船艇在全球水域馳騁。
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer 全球船用製造與分銷
stats:
  title: 全球覆蓋
  stats:
    - title: 覆蓋國家
      amount: 50+
    - title: 出口市場
      amount: 歐洲、美洲、亞洲、中東、大洋洲
    - title: 生產基地
      amount: 中國青島
    - title: 美國倉庫

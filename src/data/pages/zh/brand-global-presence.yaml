meta:
  title: '全球佈局 — 供應 50 多國的 SUP 製造商 | {SITE}'
  description: 'Afarer 將充氣式 SUP 板與充氣船出口至全球各大洲 50 多國。是品牌、經銷商與船隊值得信賴的專業製造商與供應商。'
  keywords:
    - '全球 SUP 製造商'
    - '立槳板出口商'
    - 'SUP 工廠 中國'
    - '專業 SUP 供應商'
hero:
  tagline: 全球佈局
  title: 服務 50+ 個國家<br />遍佈每個大洲
  subtitle: 從歐洲沿海巡邏單位到澳大利亞水上運動分銷商，再到中東救援團隊——afarer 船艇遍布全球水域。
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer 全球海洋製造與分銷網絡
stats:
  title: 全球覆蓋
  stats:
    - title: 覆蓋國家
      amount: 50+
    - title: 出口市場
      amount: 歐洲、美洲、亞洲、中東、大洋洲
    - title: 生產基地
      amount: 中國青島
    - title: 美國倉庫
      amount: 加州蒙克萊爾
features3_markets:
  tagline: 關鍵市場
  title: 區域專長<br />滿足本地需求
  subtitle: 我們瞭解不同市場有不同的法規要求、偏好和使用場景。
  isBeforeContent: false
  columns: 4
  items:
    - title: 歐洲與英國
      description: CE 認證產品。歐盟市場對 SUP 板需求強勁。英國分銷商尤其讚賞我們快速的交期。
      icon: tabler:map-pin
    - title: 北美
      description: 獲美國海岸警衛隊批准的製造資質。在加州蒙克萊爾設有美國倉庫，實現西海岸快速交付。釣魚船、救援艇和休閒 SUP 的需求持續增長。
      icon: tabler:map-pin
    - title: 澳大利亞與大洋洲
      description: SUP 板和水上運動配件的強勁市場。澳大利亞分銷商高度評價我們在強烈日照條件下具備優異抗紫外線性能的 PVC 製品。從我們的亞太工廠快速發貨。
      icon: tabler:map-pin
    - title: 中東
      description: 水上探險裝備需求持續增長。我們的商用級 SUP 和安全裝備深受旅遊運營商和租賃中心歡迎。提供適應高溫環境的定製配置方案。
      icon: tabler:map-pin
features3_distribution:
  tagline: 分銷網絡
  title: 與全球分銷商<br />合作
  subtitle: 我們與成熟的船舶設備分銷商、OEM 品牌和政府採購機構合作。
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM 合作
      description: 為全球水上運動品牌提供自有品牌製造。我們處理從設計到生產再到一件代發的一切事宜。
      icon: tabler:building
    - title: 分銷商網絡
      description: 20 多個國家的授權分銷商持有庫存並提供本地支持。歡迎新分銷商諮詢。
      icon: tabler:users
    - title: 政府與機構
      description: 直接供應給海岸警衛隊、搜索救援組織和軍事採購項目。符合機構採購要求。
      icon: tabler:building-community
steps2_logistics:
  title: 全球物流與支持
  subtitle: 從工廠到目的地——我們管理整個供應鏈。
  items:
    - title: 運輸選項
      description: 海運（FOB 青島）、急單空運、樣品和備件快遞。
      icon: tabler:truck-delivery
    - title: 美國倉庫
      description: 庫存存放在加州蒙克萊爾，可快速配送至北美各地。西海岸：2-3 天，中部：3-4 天，東海岸：4-5 天。
      icon: tabler:building-warehouse
    - title: 備件
      description: 正品 afarer 備件和耗材全年備貨。常用零件 24 小時內發貨。
      icon: tabler:package
    - title: 技術支持
      description: 直通工程團隊的專屬聯繫通道，為技術問題、維修建議和改裝支持提供專業服務。即使是我們 20 年前建造的船體，我們依然全力支持。
      icon: tabler:headset
cta:
  title: 想成為分銷商嗎？
  subtitle: 我們正在積極擴展分銷網絡。聯繫我們的出口團隊討論合作機會。
  actions:
    - variant: primary
      text: 合作諮詢
      href: /contact
    - text: 查看我們的產品系列
      href: /products

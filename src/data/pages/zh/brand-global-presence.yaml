hero:
  tagline: 全球佈局
  title: 服務 50+ 個國家<br />遍佈每個大洲
  subtitle: From European coastal patrol operators to Australian water sports distributors to Middle East rescue teams —afarer boats are on the water worldwide.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer global marine manufacturing and distribution
stats:
  title: 全球覆蓋
  stats:
    - title: 覆蓋國家
      amount: 50+
    - title: 出口市場
      amount: 歐洲、美洲、亞洲、中東、大洋洲
    - title: 生產基地
      amount: 中國青島
    - title: 美國倉庫

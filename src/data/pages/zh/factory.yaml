hero:
  tagline: 工廠
  title: 工廠與製造
  subtitle: 12,000平方米集成製造——從原材料到成品船
intro:
  - 作為 **青島沃特雷德集團有限公司** 的工廠品牌，afarer控制生產的每個階段——從原材料到成品船的最後交付前檢查。我們在青島經濟開發區的製造設施佔地12,000平方米，擁有專門的PVC切割、管熱封、玻璃鋼RIB船體生產、SUP數字印刷、最終裝配和質量測試車間。
  - 通過將設計、工程、原型製作、製造和測試整合在同一屋簷下，我們消除了合同製造的低效率，並保持對建造質量、材料選擇和交付時間的直接控制。

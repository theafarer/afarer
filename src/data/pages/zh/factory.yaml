hero:
  tagline: 工廠
  title: 工廠與製造
  subtitle: 12,000 m² 整合製造 — 從原材料到成品 SUP
intro:
  - As a factory brand of **Qingdao Vatrad Group Co., Ltd.**, afarer controls every stage of production —from the arrival of raw PVC materials to the final pre-delivery inspection of the finished SUP. Our manufacturing facility in the Qingdao Economic Development Zone spans 12,000 square metres and houses dedicated workshops for PVC cutting, drop-stitch core bonding, SUP digital printing, final assembly, and quality testing.
  - 通過將設計、工程、原型製作、製造和測試整合在同一屋簷下，我們消除了合同製造的低效率，並保持對建造質量、材料選擇和交付時間的直接控制。

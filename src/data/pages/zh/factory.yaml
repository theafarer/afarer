workshops_section:
  tagline: 車間
  title: 製造車間
  workshops:
    - title: PVC切割與材料準備
      description: 自動CNC切割機以亞毫米精度處理PVC、Hypalon和滴塑面料。計算機優化排版最小化材料浪費。
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 管焊接與熱封
      description: 專用焊接車間配備熱封機和RF介質壓力機。熱風熱封機粘合PVC管室，RF焊接產生超過要求的高強度氣密接縫。
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 落針式芯材粘合
      description: SUP board drop-stitch cores are bonded to outer PVC laminates using heat lamination. Thousands of internal polyester threads connect top and bottom layers, creating a rigid structure at 12-15 PSI. Rail bands are triple-layer fusion bonded for edge strength.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
    - title: SUP印刷與裝飾
      description: SUP板採用數字印刷進行全綵圖形裝飾，絲網印刷用於標誌和重複圖案。數字打印機產生照片質量的甲板設計。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
    - title: 最終裝配與安裝
      description: Assembly line where valves, D-rings, handles, fin boxes, and deck pads are installed on each SUP board. Each board follows a 100-point assembly checklist signed off by the team lead.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 質量測試與檢驗
      description: Every completed boat undergoes mandatory air-retention testing, seam peel verification, and a full systems check before shipping. Our quality lab operates independently from production and reports directly to management.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

qc_section:
  tagline: 質量控制
  title: 測試與質量保證流程
  subtitle: 每艘船艇出貨前均須通過強制性測試。我們的品質實驗室獨立於生產部門運作，直接向管理層報告。
  steps:
    - step: '1'
      title: 原材料檢驗
      desc: PVC、Hypalon和滴塑面料在進入生產前經過拉伸測試、撕裂傳播和抗紫外線驗證。
    - step: '2'
      title: 48小時氣密性測試
      desc: 每個管室充氣至額定壓力的125%並保持48小時。壓力下降超過5%將自動觸發拒收和接縫重新檢查。
    - step: '3'
      title: 負載與平衡測試
      desc: 完成的船艇裝載至最大額定容量，測試穩定性、乾舷及操控性能。每艘船艇在最終檢驗前均進行水上測試。
oem_section:
  tagline: OEM項目
  title: 品牌與OEM合作案例研究
  subtitle: 從概念到集裝箱——我們如何幫助全球品牌推出和擴展其充氣 SUP 產品線。
  cases:
    - challenge: 歐洲戶外零售商需要自有品牌SUP產品線，具有獨特甲板圖形、環保PVC和零售就緒包裝——全部在60天內交付。
      solution: 開發定製數字打印文件，採購符合REACH的PVC，將取樣從3輪減少到1輪。
      result: 從簽署PO到FOB 55天。2,400件，4個SKU。第一批集裝箱到達前已下重複訂單。
    - challenge: 美國水上運動新創公司需要高性能 drop-stitch SUP，具備定製造型、聯合品牌包裝及 BSCI 認證，以符合零售上架要求。
      solution: 改造既有 SUP 模具並調整外型輪廓，開發聯合品牌包裝設計圖稿，並提供完整的 BSCI 稽核文件。
      result: 成功進入3家美國主要戶外連鎖店。第一年5,000+件，售罄率98%。
    - challenge: 澳大利亞分銷商需要CE認證的RIB系列，具有定製管顏色、Hypalon升級選項和符合澳大利亞標準AS 1799。
      solution: 生產4種管顏色變體的預生產樣品，從日本供應商採購CSM Hypalon，協調第三方AS 1799合規測試。
      result: 3型號RIB系列在澳新市場推出，隨後贏得12艘巡邏RIB的政府招標。
faq_section:
  tagline: 常見問題
  title: B2B和OEM常見問題
  questions:
    - q: OEM充氣SUP板的最小訂單量（MOQ）是多少？
      a: 標準OEM型號的MOQ從5–10艘起。定製模具和自有品牌項目根據複雜度需要至少200艘。新品牌推出可提供試訂單和樣品運行。
    - q: afarer是否持有BSCI認證？
      a: 是的。我們的工廠保持有效的BSCI社會合規認證。我們還持有質量管理認證，所有產品均帶有CE認證。每批OEM貨物均提供REACH和RoHS合規文件。
    - q: OEM訂單的典型交貨期是多少？
      a: 標準交貨期為確認PO和定金後30-45天。定製模具開發增加15-20天。我們為緊急訂單和季節性高峰期提供加急生產。
    - q: 你們能按FOB青島或CIF運送到我們的港口嗎？
      a: 是的。我們按FOB青島、CIF全球主要港口和DDP為合格合作伙伴發貨。我們的物流團隊管理集裝箱預訂、出口文件和清關。我們發貨到全球50多個國家。
b2b_moq: '標準 MOQ：每型號 5–10 件。歡迎新合作夥伴下試訂單。'
production_flow:
  tagline: 生產流程
  title: 精益求精的製造工藝
  subtitle: 標準化生產流程，確保每件產品的一致性和質量。
  stages:
    - stage: '01'
      title: 材料接收與來料 QC
      description: 所有進貨材料均按批次號碼登錄至 ERP 系統。PVC 布捲、drop-stitch 芯材、閥門、黏合劑及五金件在獲得 QC 簽核前均予以隔離。
      qc_check: 拉伸強度（ASTM D751）、撕裂強度（ISO 4674）、厚度量測、黏合劑黏度、目視缺陷掃描
      qc_threshold: 100% 批次全數檢驗。拉伸強度低於規格 90%、撕裂強度低於最低標準或有任何外觀缺陷即拒收
      responsibility: 來料 QC 團隊（3 人）
    - stage: '02'
      title: CNC 切割與材料準備
      description: 計算機優化排版將面板配置於 PVC 材料上以最小化浪費。自動 CNC 切割機保持 0.1 mm 的位置精度。
      qc_check: 對照 CAD DXF 檔案進行尺寸檢查、邊緣品質檢驗及面板數量驗證
      qc_threshold: 每 20 片面板進行一次測量。公差 ±0.5 mm。超出公差之面板超過 2% 則整批拒收
      responsibility: 切割車間主管
    - stage: '03'
      title: 焊接與落針式粘合
      description: Drop-stitch 芯材透過熱層壓與外層 PVC 粘合。管狀氣室採用 RF 焊接或熱風焊接。側帶採用三層融合粘合。
      qc_check: 每 50 件進行剝離測試（ASTM D751）、焊縫寬度量測、熱風溫度記錄審查、背光下目視接縫檢驗
      qc_threshold: 剝離強度最低 8 N/cm。焊縫寬度公差 ±1 mm。任何可見溝槽 = 拒收
      responsibility: 焊接 QC（每班 2 人）
    - stage: '04'
      title: 組裝與裝配
      description: '船艇進入最終組裝階段，所有部件組合：船體加管道、安裝閥門、D 形環、把手、鰭盒及提袋配件。每個單位遵循 100 點組裝檢查表。'
      qc_check: 每單位 100 點檢查表簽核、閥門功能測試（10 次開關循環）、五金件扭力驗證、外觀檢驗
      qc_threshold: '安全關鍵項目零缺陷政策（閥門、D 形環、把手）。輕微外觀問題：AQL 2.5（ISO 2859）'
      responsibility: 組裝團隊主管 + 產線 QC
    - stage: '05'
      title: 壓力測試與質量保持
      description: 每個氣室充氣至額定壓力的 1.25 倍（通常為 20–25 PSI）並保持 24–48 小時。壓力感測器持續記錄。壓降超過 5% 的氣室予以拒收並送回接縫複檢。
      qc_check: 24 小時保壓日誌、感測器每日校準驗證、溫度補償壓力讀數、修復後接縫複測
      qc_threshold: 穩定溫度下 24 小時內壓降最高 5%。任何氣室超出此標準 = 該批次全數複測
      responsibility: 質量實驗室（獨立於生產，向管理層報告）
    - stage: '06'
      title: 最終檢驗與包裝
      description: 最終視覺與功能檢驗。檢查表面瑕疵、色彩一致性、標籤/料號驗證、包裝完整性及配件齊全度。產品經真空包裝、裝箱及棧板包裝以進行貨櫃裝載。
      qc_check: 全面視覺檢驗、每個 SKU 配件清單檢查、包裝跌落測試（1 公尺，隨機抽樣）、標籤/條碼掃描驗證
      qc_threshold: 主要缺陷 AQL 2.5、次要缺陷 AQL 4.0。安全缺陷零容忍。100% 產品目視檢驗
      responsibility: 最終 QC 團隊（4 人）+ 包裝團隊主管

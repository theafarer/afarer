faqs:
  title: '國家合作夥伴 — 常見問題'
  subtitle: '認真的國家合作夥伴在申請前會問的問題。'
  items:
    - title: '「一國一經銷商」究竟是什麼意思？'
      description: 'Afarer 指定唯一一位授權經銷商，對既定區域擁有獨家權利。我們不會從全球或區域通路銷售進入受保護的國家。只要達成 Distribution Agreement，您對區域的所有權就持續有效。'
    - title: '區域獨家權會永久有效嗎？'
      description: '不會。獨家權是有條件的，而非永久。它透過簽署的 Distribution Agreement、完成首單、年度採購目標、當地庫存、售後能力與持續的市場投資來維繫。若未滿足這些條件，區域可能被重新協商或重新指派。'
    - title: '首單最低訂購量是多少？'
      description: '國家與區域經銷商從 100–300 units 起；授權經銷商為 30–50 units；試單 10–30 units 讓您先行驗證市場 (試單與樣品訂單不具區域保護)。Custom 與 Private Label 計劃依循上方等級所列的獨立 MOQ。'
    - title: '10 模組支援計劃包含哪些支援？'
      description: '等級與資格認證、區域保護、MOQ / 定價 / 年度返利、庫存與訂單執行、行銷素材與聯合市場基金、產品 / 銷售 / 技術培訓、零件與售後、保固註冊、夥伴入口網站，以及產品規格表、行銷素材庫、年度返利時程表與出貨及包裝清單。'
    - title: 'Afarer 如何保護我免於通路衝突？'
      description: '每個區域剛好只有一位授權經銷商。來自您區域的詢價與直接訂單均透過您處理；網站表單在當地有夥伴時會轉介給對方；全球團隊僅在夥伴未回應時才介入處理。'
    - title: '運送與付款條款為何？'
      description: '訂單以 FOB Qingdao 出貨，附完整出口文件。生產訂單為 30% 訂金、出貨前 70%；試單與樣品訂單全額預付。標準交期為 30–45 工作天，樣品生產為 15–20 工作天。'
    - title: '我該如何申請？'
      description: '透過聯絡表單附上市場詳情送出申請。我們評估市場契合度、零售佈局與物流能力，然後在 3 個工作日內回覆後續步驟與範本 Distribution Agreement。'

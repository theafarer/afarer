faqs:
  title: '經銷商計劃 — 常見問題'
  subtitle: '經銷商在申請前常問的所有問題。'
  items:
    - title: '一國一經銷商是什麼意思？'
      description: 'Afarer 授予單一授權經銷商某個國家或地區的獨家權利。您擁有您的市場——無平行輸入、無內部競爭。'
    - title: '首單最低訂購量是多少？'
      description: '國家與區域經銷商從 100–300 件起。授權經銷商從 30–50 件起。試單 10–30 件讓您先驗證市場（不享區域保護）。'
    - title: '經銷商會獲得哪些支援？'
      description: '經銷商成功計劃涵蓋導入、上市規劃、產品與銷售培訓、展示船隊支援、本地化行銷素材，以及專屬客戶經理。'
    - title: 'Afarer 如何保護我免於通路衝突？'
      description: '每個區域只有一家授權經銷商。來自您區域的直接訂單均透過您處理，並以保護您利潤的方式定價。'
    - title: '運送與付款條件為何？'
      description: '訂單以 FOB 青島出貨，包含完整出口文件。生產訂單 30% 訂金、出貨前 70%；試單與樣品訂單全額預付。'
    - title: '如何申請？'
      description: '透過聯絡表單送出申請。我們評估市場契合度、零售佈局與物流能力，然後在 3 個工作日內回覆下一步與範本經銷商合約。'
cta:

hero:
  tagline: '實驗室 06'
  title: '品質檢驗實驗室'
  subtitle: '獨立驗證 — 每項測試在出貨前均通過'
  image: 'https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp'
  image_alt: 'Afarer 品質檢驗實驗室 UV 測試'

intro: '從我們車間出廠的每艘船都附有認證，證明其已通過一系列定義的品質檢驗及材料測試。我們的品質檢驗實驗室是組織內的獨立職能部門——它直接向總經理報告，而非生產部門——確保沒有任何商業壓力能夠影響檢驗關卡。如果某批材料或成品船未達到公布的規格，實驗室有權中止出貨，直到不符合項目解決為止。'

content_html: |
  <h2>信任，但需驗證</h2>
  <p>實驗室依據 ISO 9001 原則運作品質管理系統，我們的測試方法在適用情況下基於 ISO、ASTM 及 EN 標準。我們詳細記錄執行的每項測試，建立從原材料接收到最終船隻交付的完整追溯鏈。</p>

  <h2>測試設備與能力</h2>
  <table>
    <thead><tr><th>設備</th><th>執行的測試</th><th>標準 / 方法</th></tr></thead>
    <tbody>
      <tr><td>萬能試驗機（50 kN）</td><td>拉伸強度（織物）、剝離強度（接縫）、撕裂傳播</td><td>ISO 1421、ISO 4674</td></tr>
      <tr><td>氣密測試台（可程式）</td><td>1000 次充氣/放氣耐久性、30 分鐘保壓測試</td><td>ISO 6185（內部）</td></tr>
      <tr><td>接縫剝離治具（電動 180° 剝離）</td><td>焊接與黏合接縫在 100 mm/min 下的剝離強度</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>耐水壓測試儀</td><td>織物抗水滲透性（0–1000 mbar）</td><td>ISO 811</td></tr>
      <tr><td>數位厚度計與測微器</td><td>織物厚度、管壁厚度、膠膜厚度</td><td>ISO 2286-3</td></tr>
      <tr><td>環境試驗箱</td><td>溫度調節（-40°C 至 +80°C），用於低溫破裂及熱老化測試</td><td>ISO 188、ISO 4675</td></tr>
      <tr><td>色彩分光光度計</td><td>UV 曝曬後的 Delta-E 顏色量測</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>檢驗關卡 — 從材料到交貨</h2>
  <p>每艘船都遵循定義的品質計畫，包含強制檢驗點。沒有船隻能跳過關卡；每個關卡必須由品質檢驗員簽署核准後，才能進入下一生產階段。</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">進料檢驗</p>
            <p class="text-xs text-gray-500 mt-1">織物批次、黏合劑批次、五金配件——放行至生產前，全部對照進廠規格進行檢查。</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">製程焊接檢驗</p>
            <p class="text-xs text-gray-500 mt-1">每個生產班次開始時測試首件焊接樣本（剝離 + 目視）。</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">氣室氣密測試</p>
            <p class="text-xs text-gray-500 mt-1">每個氣室加壓至工作壓力的 1.5 倍，保持 30 分鐘。依序號記錄數據。</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">出貨前檢驗</p>
            <p class="text-xs text-gray-500 mt-1">整船檢查：所有緊固件鎖緊、系統功能正常、無外觀缺陷。100 點檢查表。</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">最終認證</p>
            <p class="text-xs text-gray-500 mt-1">彙編測試報告、審查檢驗記錄、核發符合性證書。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>關鍵品質指標（2025 年滾動平均）</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7%</span>
      <span class="text-xs text-gray-500">首次通過率（織物批次）</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">< 0.2%</span>
      <span class="text-xs text-gray-500">焊接拒收率（線性公尺）</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100%</span>
      <span class="text-xs text-gray-500">組裝前氣室經氣密測試</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">設計類別合規</span>
    </div>
  </div>

  <h2>我們的品質團隊</h2>
  <p>實驗室由一位品質經理（10 年海事品管經驗，ASQ 認證品質工程師）、兩位品質檢驗員（各持有二級 NDT 目視檢測認證）及一位負責所有物理測試的材料技術員組成。團隊每年透過獨立第三方機構進行能力驗證，確保我們的測試結果保持準確且可再現。</p>

  <h2>客戶獨立測試服務</h2>
  <p>我們的品質檢驗實驗室提供獨立測試服務。如果您需要驗證織物規格、驗證新的黏合劑系統，或為採購驗收取得第三方測試報告，我們可以依照適用標準執行測試並核發認證測試報告。</p>
  <p>近期第三方測試工作範例：</p>
  <ul>
    <li>為歐洲軍方採購項目進行的五種競爭性黏合膠膜產品剝離強度比較。</li>
    <li>新型橙色顏料 PVC 配方的加速老化研究（UV + 熱循環），每 500 小時間隔進行定期量測。</li>
    <li>新型高壓氣管設計的 50 個原型隔板閥門的氣密性驗證。</li>
  </ul>

  <h2>我們對您的承諾</h2>
  <p>當您收到 {SITE.name} 船隻時，您也將收到其品質檔案——一份彙編記錄，包含適用於您特定船隻的測試結果：織物批次證書、焊接剝離測試、氣室氣密測試記錄及出貨前檢驗檢查表。每個數字都可追溯。每位檢驗員都可識別。這不僅是文件——這是我們對所交付產品符合規格的承諾。</p>
  <p>如果您有任何品質疑慮，可以直接聯絡實驗室——聯絡資訊印在您的符合性證書上。我們認真對待每項查詢，並承諾在 48 小時內啟動正式調查。</p>


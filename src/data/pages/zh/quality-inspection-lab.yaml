meta:
  title: 品質檢驗實驗室 — ISO 合規 RIB 測試與認證 | {SITE}
  description: 充氣船的獨立品質驗證。拉伸測試、氣密循環、接縫剝離測試及材料認證。聯絡我們的品質實驗室進行第三方測試。
back_text: 返回研發中心
home_label: 首頁
hero:
  tagline: 實驗室 06
  title: 品質檢驗實驗室
  subtitle: 獨立驗證 — 每項測試在出貨前均通過
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: Afarer 品質檢驗實驗室 UV 測試
intro: 每一艘離開我們車間的船都附有通過一系列品質檢驗和材料測試的認證。我們的品質與檢驗實驗室是組織內的獨立職能——直接向總經理彙報，而非向生產部門——確保不會有任何商業壓力影響檢驗關卡。如果某批材料或某艘完工船艇未達公布規範，實驗室有權暫停出貨，直至不合格項得到解決。
content_html: |
  <h2>信任，但需查證</h2>
  <p>實驗室在符合品質管理原則的系統下運作，我們的測試方法在適用之處皆以 ISO、ASTM 與 EN 標準為基礎。我們對每次執行的測試都保留詳細記錄，建立從原物料進廠到最終船艇交付的完整追溯鏈。</p>

  <h2>測試設備與能力</h2>
  <table>
    <thead><tr><th>設備</th><th>執行測試</th><th>標準／方法</th></tr></thead>
    <tbody>
      <tr><td>萬能試驗機（50 kN）</td><td>拉伸強度（織物）、剝離強度（接縫）、撕裂擴展</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>氣密測試平台（可程式化）</td><td>1000 次充氣／洩氣循環耐久、30 分鐘保壓測試</td><td>ISO 6185（廠內）</td></tr>
      <tr><td>接縫剝離治具（電動 180° 剝離）</td><td>以 100 mm/min 速度測試焊接與膠合接縫的剝離強度</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>水壓測試儀</td><td>織物的抗水滲透性（0–1000 mbar）</td><td>ISO 811</td></tr>
      <tr><td>數位厚度計與測微計</td><td>織物厚度、氣囊壁厚、膠膜厚度</td><td>ISO 2286-3</td></tr>
      <tr><td>環境試驗箱</td><td>溫度調節（-40 °C 至 +80 °C），用於低溫龜裂與熱老化測試</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>色彩分光光度計</td><td>UV 曝晒後的 Delta-E 色彩差異量測</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>檢驗關卡 — 從材料到交付</h2>
  <p>每一艘船都遵循一份含有強制性檢驗點的既定品質計畫。任何船舶都不得跳過關卡；每一道關卡都必須由品質檢驗員簽核，才能進入下一個生產階段。</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">進料檢驗</p>
            <p class="text-xs text-gray-500 mt-1">織物批次、黏合劑批次、五金配件 — 放行至生產前，皆依進料規格逐項核對。</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">製程中焊接檢驗</p>
            <p class="text-xs text-gray-500 mt-1">每個生產班次開始時，對首件焊接試片進行測試（剝離＋目視）。</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">氣室氣密測試</p>
            <p class="text-xs text-gray-500 mt-1">每個氣室加壓至工作壓力的 1.5 倍並保壓 30 分鐘。數據按序號記錄。</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">交貨前檢驗</p>
            <p class="text-xs text-gray-500 mt-1">整船檢驗：所有緊固件依規定扭力鎖緊、各系統功能正常、無外觀缺陷。採用 100 點檢查清單。</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">關卡 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">最終認證</p>
            <p class="text-xs text-gray-500 mt-1">彙整測試報告、審查檢驗記錄、簽發符合性證明書。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>關鍵品質指標（2025 年滾動平均）</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">一次通過良率（織物批次）</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">焊接不良率（每延米）</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">組裝前完成氣密測試的氣室</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">設計類別符合性</span>
    </div>
  </div>

  <h2>我們的品質團隊</h2>
  <p>實驗室由一位品質經理（10 年船舶品管經驗、ASQ 認證品質工程師）、兩位品質檢驗員（各自具備目視檢測二級 NDT 認證），以及一位負責所有物理測試的材料技術人員組成。團隊每年透過獨立第三方機構進行能力驗證測試，確保我們的測試結果維持準確且可重現。</p>

  <h2>為客戶提供的獨立測試</h2>
  <p>我們的品質與檢驗實驗室提供獨立測試服務。如果您需要驗證織物規格、驗證新的黏合系統，或取得供採購資格認定使用的第三方測試報告，我們可以依適用標準執行測試，並簽發經認證的測試報告。</p>
  <p>近期第三方測試工作的實例：</p>
  <ul>
    <li>為歐洲軍方採購計畫所做的五款競爭性黏合薄膜產品剝離強度比較。</li>
    <li>針對新型橘色矯色 PVC 配方進行的加速老化研究（UV＋熱循環），每 500 小時定期進行中間檢測。</li>
    <li>針對新型高壓氣囊設計的 50 個原型隔艙閥氣密性驗證。</li>
  </ul>

  <h2>我們對您的承諾</h2>
  <p>當您收到一艘 {SITE.name} 船艇時，同時也會收到它的品質檔案 — 一份適用於您這艘船的測試結果彙編記錄。織物批次證書、焊接剝離測試、氣室氣密測試記錄與交貨前檢驗清單。每一個數字都可追溯，每一位檢驗員都有記錄。這不只是文書作業 — 這是我們的承諾：我們交付的，正是我們所規格的。</p>
  <p>如果您對品質有任何疑慮，可以直接聯繫實驗室 — 聯絡方式印在您的符合性證明書上。我們重視每一項詢問，並承諾在 48 小時內展開正式調查。</p>

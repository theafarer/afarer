features3_reasons:
  tagline: 為什麼選擇 afarer
  title: 與我們合作的七大理由
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. 真實製造，而非貿易
      description: 我們擁有並運營 12,000 m² 的工廠。與 afarer 合作，您直接與設計、開發和製造您產品的人合作——沒有中間商。
      icon: tabler:building-factory
    - title: 2. 工程主導的方法
      description: 我們的設計流程從使用場景開始，而非產品類別。我們根據船艇的實際使用方式來優化船體形狀、材料選擇和配置。
      icon: tabler:engine
    - title: 3. 認證質量
      description: CE 認證、ISO 質量體系、BSCI 合規、REACH 合規、USCG 批准。每件產品都符合國際標準——不僅僅是宣稱。
      icon: tabler:certificate
    - title: 4. 靈活的 OEM/ODM
      description: 管顏色、控制台佈局、品牌、包裝——我們根據您的規格定製。沒有最低訂單壓力。從原型開始，自信地擴展。
      icon: tabler:adjustments
    - title: 5. 全球物流
      description: 美國加州倉庫、從青島直運、緊急訂單空運。我們處理報關文件和單據。
      icon: tabler:truck-delivery
    - title: 6. 終身支持
      description: 我們支持 20 年前建造的船艇。正品備件、技術建議、維修指導——當您需要時，我們的團隊隨時為您服務。
      icon: tabler:lifebuoy
    - title: 7. 誠信規格
      description: 真實載荷等級、真實尺寸、真實重量。沒有營銷誇大。我們公佈的就是您得到的——經獨立測試驗證。
      icon: tabler:ruler-measure
testimonials:
  tagline: 受全球品牌信賴
  title: 合作伙伴的評價
  items:
    - content: 我們與中國的幾家製造商合作過，但 afarer 以其工程支持和穩定的質量脫穎而出。他們把我們的品牌當作自己的品牌。
      name: ——OEM 合作伙伴，歐洲水上運動品牌
    - content: 他們的 Hypalon SUP 已在我們船隊服役超過 5 年。維護極少，抗紫外線性能卓越。5 年管保修讓我們充滿信心。
      name: ——船隊運營商，中東度假村集團
    - content: afarer 團隊幫助我們在 90 天內從概念到生產開發了一款定製 SUP 板。質量超出了我們的預期。
      name: ——分銷商，澳大利亞水上運動

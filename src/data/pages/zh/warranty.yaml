headline: afarer 製造商有限質保
subtitle: afarer 為我們製造的每一件充氣式航海產品品質提供保障。本有限保固條款詳細說明您的 afarer 產品的保固範圍與適用條件。
seo:
  headline: afarer 充氣船保固——5 年有限保固 | afarer
  description: afarer 為主氣囊面料、接縫及玻璃纖維船體結構完整性提供 5 年有限保固，同時涵蓋充氣閥門及原廠安裝配件。詳見 afarer 充氣船保固的完整條款與細則。
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    本有限保固適用於直接向 afarer 或經授權的 afarer 經銷商或零售商購買的全新 afarer 品牌充氣式船艇產品。生效日期為可查證之原始零售購買日期。
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">保固範圍與期限</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Years</h3>
        <p class="text-sm text-gray-600 mt-1">主氣囊面料完整性（CSM/PVC）</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Years</h3>
        <p class="text-sm text-gray-600 mt-1">玻璃纖維船體結構完整性</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Years</h3>
        <p class="text-sm text-gray-600 mt-1">充氣氣囊接縫氣密能力</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Years</h3>
        <p class="text-sm text-gray-600 mt-1">充氣閥功能</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Year</h3>
        <p class="text-sm text-gray-600 mt-1">原廠安裝之配件與輔助五金</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Year*</h3>
        <p class="text-sm text-gray-600 mt-1">商業、租賃或船隊用途—所有組件</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*商業、政府、包船、租賃或教學使用會將保固縮短至 1 年。競速或比賽使用將完全使保固失效。</p>
  </div>

  <h2>保固涵蓋的內容</h2>
  <h3>主氣囊面料（5 年）</h3>
  <p>afarer 保證主氣囊面料不會發生孔隙劣化，此類劣化會嚴重損害產品維持正常充氣狀態的能力。此保證適用於 CSM（Hypalon）塗層面料及製造中所用的所有其他氣囊面料材質。</p>

  <h3>玻璃纖維船體結構完整性（5 年）</h3>
  <p>對於配備玻璃纖維強化塑膠（FRP）船體的產品，其基礎複合結構在因材料或工藝瑕疵而發生結構失效方面享有保固。</p>

  <h3>充氣氣囊接縫氣密能力（5 年）</h3>
  <p>充氣氣囊在製造過程中接合處的接縫，在因製造瑕疵導致接縫大量漏氣方面享有保固。定期檢查並維持適當的充氣壓力為保固生效之條件。</p>

  <h3>充氣閥功能（5 年）</h3>
  <p>afarer 原廠安裝的充氣閥，在因材料或工藝瑕疵導致閥門無法依設計保持氣壓方面享有保固。</p>

  <h3>原廠安裝之配件（1 年）</h3>
  <p>由 afarer 製造並於原廠安裝的組件與五金，其材料與工藝瑕疵享有一年保固。此項不包含第三方產品，該類產品僅由各製造商自身之保固涵蓋。</p>

  <h2>保固不涵蓋的內容</h2>
  <ul>
    <li>外觀瑕疵，包括變色、污漬、褪色、粉化或任何外觀改變</li>
    <li>穿刺、割傷、撕裂、扯破或其他物理性損壞</li>
    <li>因摩擦或接觸造成的龜裂、開裂、磨損、刮傷或劣化</li>
    <li>因紫外線曝晒、日晒雨淋或大氣條件造成的降解</li>
    <li>因接觸燃油、溶劑、酸、鹼或化學品造成的損壞</li>
    <li>因疏忽、不當使用、濫用、意外或正常磨耗造成的損壞</li>
    <li>膠衣或漆面問題（起泡、龜裂、變色、褪色）</li>
    <li>因撞擊、應力、支撐不當或拖運造成的損壞</li>
    <li>因不當充氣／洩氣或使用未經核准的充氣設備造成的損壞</li>
    <li>第三方設備、組件或系統（由各製造商自行提供保固）</li>
  </ul>

  <h2>製造商之義務與補償</h2>
  <p>afarer 唯一且專屬之義務，為依 afarer 之選擇，對經判定存在材料或工藝瑕疵並受本保固涵蓋之任何組件進行維修或更換。維修或更換由 afarer 或其指定之授權服務據點執行。經維修或更換之組件，僅於原保固期尚未屆滿之剩餘期間內享有保固。</p>

  <h2>保固條件</h2>
  <ul>
    <li><strong>註冊：</strong>產品必須依照保固條款之規定完成正式註冊。</li>
    <li><strong>保養：</strong>產品必須依照 afarer 公布之指引進行保養，包括定期檢查並維持適當之充氣壓力。</li>
    <li><strong>配合：</strong>購買者必須就所有與保固索賠相關之事項，充分且即時地配合 afarer。</li>
    <li><strong>原始購買者：</strong>本保固僅延伸至原始終端購買者，且不可轉讓。</li>
  </ul>

  <h2>商業用途</h2>
  <p>若產品用於商業、政府、非營利、包船、租賃、教學或任何非私人休閒之用途，所有組件之保固期限將縮短為自原始零售購買日期起一（1）年。用於競速、速度或耐力比賽將立即且不可撤銷地使保固完全失效。</p>

  <h2>如何提出保固索賠</h2>
  <p>聯絡 afarer 或您的授權經銷商，並提供購買證明與問題之詳細說明。afarer 將審查您的索賠，並提供檢查與維修之指示。</p>
  <p>如需保固維修服務查詢，請透過我們的<a href="/contact" class="text-sky-600 underline">聯絡頁面</a>與我們聯絡，並附上您的訂單編號與產品詳細資料。</p>

  <h2>第三方產品</h2>
  <p>由第三方製造之設備、組件或系統（即使由 afarer 安裝），僅由各製造商所提供之任何保固涵蓋。afarer 明確聲明對該類第三方產品不承擔任何保固責任。</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    本保固聲明為完整 afarer 製造商有限保固之摘要。正式法律保固文件統轄所有保固條款與條件。規格如有變更，恕不另行通知。afarer 是由 Aquafarer LLC（美國）營運之品牌。
  </p>

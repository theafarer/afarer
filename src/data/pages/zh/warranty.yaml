label: 質保
headline: afarer 製造商有限質保
subtitle: afarer 為我們生產的每一件充氣船艇產品的質量提供保障。此有限質保闡明瞭您的 afarer 產品的條款和覆蓋範圍。
seo:
  headline: afarer 充氣船質保 — 5年有限質保 | afarer
  description: afarer 對主要氣囊布料的完整性、接縫和玻璃鋼船體結構完整性提供 5 年有限質保。同時涵蓋充氣閥和工廠安裝的配件。afarer 充氣船質保的完整條款和條件。
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    本有限質保適用於直接從 afarer 或 afarer 授權經銷商處購買的 afarer 品牌全新充氣船艇產品。生效日期為可驗證的原始零售購買日期。
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">質保範圍與期限</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 年</h3>
        <p class="text-sm text-gray-600 mt-1">主要氣囊布料完整性（CSM/PVC）</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 年</h3>
        <p class="text-sm text-gray-600 mt-1">玻璃鋼船體結構完整性</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 年</h3>
        <p class="text-sm text-gray-600 mt-1">充氣氣囊接縫氣密性</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 年</h3>
        <p class="text-sm text-gray-600 mt-1">充氣閥功能性</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 年</h3>
        <p class="text-sm text-gray-600 mt-1">工廠安裝的配件和輔助裝置</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 年*</h3>
        <p class="text-sm text-gray-600 mt-1">商業、租賃或船隊使用 — 所有部件</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*商業、政府、包租、租賃或教學使用將質保期縮短至 1 年。在比賽或競賽中使用將完全使質保失效。</p>
  </div>

  <h2>涵蓋範圍</h2>
  <h3>主要氣囊布料（5 年）</h3>
  <p>afarer 保證主要氣囊布料不會出現影響產品維持正常充氣能力的孔隙劣化。這適用於 CSM（Hypalon）塗層布料和製造中使用的所有其他氣囊材料。</p>

  <h3>玻璃鋼船體結構完整性（5 年）</h3>
  <p>對於帶有玻璃鋼（GRP）船體的產品，基本複合結構保證不會因材料或工藝缺陷而導致結構故障。</p>

  <h3>充氣氣囊接縫氣密性（5 年）</h3>
  <p>充氣氣囊的接縫保證不會出現因製造缺陷導致的通過接縫的大量漏氣。定期檢查和保持適當的充氣壓力是享受質保的條件。</p>

  <h3>充氣閥功能性（5 年）</h3>
  <p>afarer 原裝充氣閥保證不會因材料或製造缺陷而無法按設計保持氣壓。</p>

  <h3>工廠安裝的配件（1 年）</h3>
  <p>afarer 製造並在工廠原裝安裝的部件和裝置在一年內保證沒有材料和工藝缺陷。這不包括第三方產品，這些產品僅由其各自制造商的保修覆蓋。</p>

  <h2>不涵蓋範圍</h2>
  <ul>
    <li>外觀缺陷，包括變色、汙漬、褪色、起霜或任何外觀改變</li>
    <li>穿刺、割傷、撕裂或其他物理損壞</li>
    <li>因摩擦或接觸導致的龜裂、磨損、擦傷或劣化</li>
    <li>因暴露於紫外線、天氣或大氣條件導致的降解</li>
    <li>因接觸燃料、溶劑、酸、鹼或化學品造成的損壞</li>
    <li>因疏忽、不當使用、濫用、事故或正常磨損造成的損壞</li>
    <li>膠衣或漆面問題（起泡、龜裂、變色、褪色）</li>
    <li>因撞擊、壓力、不當支撐或拖車運輸造成的損壞</li>
    <li>因不當充氣/放氣或使用未經批准的充氣設備造成的損壞</li>
    <li>第三方設備、部件或系統（由其各自制造商覆蓋）</li>
  </ul>

  <h2>製造商的義務與補救措施</h2>
  <p>afarer 的唯一和排他性義務是維修或更換（由 afarer 選擇）被確定為在材料或工藝上存在缺陷且在本質保範圍內的任何部件。維修或更換由 afarer 或其指定的授權服務中心執行。維修或更換的部件僅對原始質保期的剩餘部分提供質保。</p>

  <h2>質保條件</h2>
  <ul>
    <li><strong>註冊：</strong> 必須按照質保條款的要求正確註冊產品。</li>
    <li><strong>維護：</strong> 必須按照 afarer 發佈的指南維護產品，包括定期檢查和保持適當的充氣壓力。</li>
    <li><strong>配合：</strong> 購買者必須在與質保索賠有關的所有事項上與 afarer 充分、及時地配合。</li>
    <li><strong>原始購買者：</strong> 本質保僅適用於原始最終用戶購買者，且不可轉讓。</li>
  </ul>

  <h2>商業用途</h2>
  <p>如果產品用於商業、政府、非營利、包租、租賃、教學或私人休閒以外的任何目的，所有部件的質保期將從原始購買日期起縮短至一 (1) 年。在比賽、速度或耐力競賽中使用將立即且不可撤銷地完全使質保失效。</p>

  <h2>如何提出質保索賠</h2>
  <p>憑購買憑證和問題的詳細說明聯繫 afarer 或您的授權經銷商。afarer 將審核索賠並提供檢查和維修指導。</p>
  <p>如需質保服務諮詢，請通過我們的<a href="/contact" class="text-sky-600 underline">聯繫頁面</a>聯繫我們，並提供您的訂單號和產品詳細信息。</p>

  <h2>第三方產品</h2>
  <p>由第三方製造的設備、部件或系統（即使由 afarer 安裝）僅由其各自制造商提供的保修覆蓋。afarer 明確拒絕對此類第三方產品承擔任何質保責任。</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    本質保聲明是完整的 afarer 製造商有限質保的摘要。完整的法律質保文件管轄所有質保條款和條件。規格如有變更，恕不另行通知。afarer 是 Qingdao Vatrad Group 旗下的品牌。
  </p>

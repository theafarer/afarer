features3_reasons:
  tagline: 'เหตุใดจึงเลือกห่างไกล'
  title: 'เจ็ดเหตุผลในการเป็นพันธมิตรกับเรา'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'เราเป็นเจ้าของและดำเนินการโรงงานขนาด 12,000 ตร.ม. เมื่อคุณเป็นพันธมิตรกับคนที่อยู่ห่างไกล คุณจะทำงานโดยตรงกับผู้ที่ออกแบบ ออกแบบ และสร้างผลิตภัณฑ์ของคุณ—ไม่ผ่านพ่อค้าคนกลาง'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'กระบวนการออกแบบของเราเริ่มต้นด้วยกรณีการใช้งาน ไม่ใช่หมวดหมู่ผลิตภัณฑ์ เราปรับรูปร่างของตัวเรือ การเลือกใช้วัสดุ และการกำหนดค่าให้เหมาะสมกับการใช้งานเรือจริง'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'ได้รับการรับรอง CE, ระบบคุณภาพ ISO, เป็นไปตามมาตรฐาน BSCI, เป็นไปตามข้อกำหนด REACH, ได้รับการอนุมัติจาก USCG ผลิตภัณฑ์ทุกชิ้นเป็นไปตามมาตรฐานสากล ไม่ใช่แค่คำกล่าวอ้างเท่านั้น'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'สีของท่อ โครงร่างคอนโซล การสร้างแบรนด์ บรรจุภัณฑ์ — เราปรับแต่งตามความต้องการของคุณ ไม่มีแรงกดดันในการสั่งซื้อขั้นต่ำ เริ่มต้นด้วยต้นแบบ ขยายขนาดด้วยความมั่นใจ'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'คลังสินค้าของสหรัฐฯ ในแคลิฟอร์เนีย จัดส่งโดยตรงจากชิงเต่า การขนส่งทางอากาศสำหรับคำสั่งซื้อเร่งด่วน เราจัดการเอกสารและเอกสารด้านศุลกากร'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'เราสนับสนุนเรือที่เราสร้างเมื่อ 20 ปีที่แล้ว อะไหล่แท้ คำแนะนำด้านเทคนิค คำแนะนำในการซ่อม — ทีมงานของเราพร้อมเสมอเมื่อคุณต้องการเรา'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'อัตราการโหลดจริง ขนาดจริง น้ำหนักจริง ไม่มีอัตราเงินเฟ้อทางการตลาด สิ่งที่เราเผยแพร่คือสิ่งที่คุณได้รับ - ยืนยันโดยการทดสอบอิสระ'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'ได้รับความไว้วางใจจากแบรนด์ทั่วโลก'
  title: 'สิ่งที่พันธมิตรของเราพูด'
  items:
    - content: 'We have worked with several manufacturers in China, but afarer stands out for their engineering support and consistent quality. They treat our brand as their own.'
      name: '—OEM Partner, European Water Sports Brand'
    - content: 'Their Hypalon RIBs have been in service with our fleet for over 5 years. Minimal maintenance, excellent UV resistance. The 5-year warranty on tubes gives us confidence.'
      name: '—Fleet Operator, Middle East Resort Group'
    - content: 'The afarer team helped us develop a custom SUP board design from concept to production in 90 days. The quality exceeded our expectations.'
      name: '—Distributor, Australian Watersports'

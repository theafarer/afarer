hero:
  tagline: 'กราฟความรู้'
  title: 'ความรู้การสำรวจทางน้ำ'
  subtitle: |
    ฐานความรู้ที่มีโครงสร้างครอบคลุมเทคโนโลยี SUP แบบเป่าลม<br />
    ความปลอดภัยทางน้ำ วิศวกรรมเรือ และการวางแผนการผจญภัย
  taglineSection: 'สำรวจ เรียนรู้ ไปด้วยความมั่นใจ'

clusters:
  tagline: 'กลุ่มความรู้'
  title: 'สำรวจตามหัวข้อ'
  subtitle: 'ดำดิ่งลึกสู่เทคโนโลยี ความปลอดภัย และทักษะเบื้องหลังทุกผลิตภัณฑ์ afarer'
  items:
    - title: 'ความรู้ SUP'
      description: 'ตั้งแต่การเลือกกระดานแรกจนถึงเทคนิคทัวร์ริ่งขั้นสูง —ทุกอย่างเกี่ยวกับการพายยืน'
      icon: 'tabler:lifebuoy'
      topics:
        - 'วิธีเลือก SUP เป่าลมแรกของคุณ'
        - 'ขนาด SUP ที่ดีที่สุดสำหรับผู้เริ่มต้น'
        - 'การพายยืนยากแค่ไหน?'
        - 'เปรียบเทียบกระดานเป่าลมกับกระดานแข็ง'
        - 'รายการตรวจสอบความปลอดภัย SUP'
    - title: 'ความรู้เรือ'
      description: 'คำแนะนำทางเทคนิคเกี่ยวกับเรือเป่าลม SUP ดิงกี้ และคายัค —วิศวกรรม วัสดุ และการปฏิบัติการ'
      icon: 'tabler:sailboat'
      topics:
        - 'ประเภทเรือเป่าลมอธิบาย'
        - 'เปรียบเทียบ PVC vs Hypalon'
        - 'เปรียบเทียบ SUP vs ดิงกี้'
        - 'เทคโนโลยี drop-stitch เจาะลึก'
        - 'คู่มือวัสดุศาสตร์ทางทะเล'
    - title: 'ความรู้ความปลอดภัย'
      description: 'ความรู้ด้านความปลอดภัยที่จำเป็นสำหรับนักพายทุกคน —ตั้งแต่การเลือก PFD การอ่านสภาพอากาศ ถึงเทคนิคการช่วยเหลือตนเอง'
      icon: 'tabler:shield'
      topics:
        - 'รายการตรวจสอบความปลอดภัย SUP'
        - 'คุณต้องการเสื้อชูชีพหรือไม่?'
        - 'คู่มือความปลอดภัยการพายในมหาสมุทร'
        - 'ความปลอดภัยในแม่น้ำสำหรับคายัคเป่าลม'
        - 'การตระหนักถึงสภาพอากาศและสภาพน้ำ'
    - title: 'เทคโนโลยี'
      description: 'วิศวกรรมเบื้องหลังผลิตภัณฑ์ afarer —วัสดุ วิธีการก่อสร้าง และการทดสอบคุณภาพ'
      icon: 'tabler:microscope'
      topics:
        - 'เทคโนโลยี PVC ระดับทะเล'
        - 'แกน drop-stitch อธิบาย'
        - 'ทำไม PSI ถึงสำคัญสำหรับ SUP เป่าลม'
        - 'การเชื่อม RF vs การติดด้วยกาว'
        - 'การทดสอบคุณภาพและการรับรอง'


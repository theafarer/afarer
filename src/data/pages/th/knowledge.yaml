meta:
  title: 'ความรู้ — คู่มือ SUP | {SITE}'
  description: 'ฐานความรู้ของ afarer: คู่มือบอร์ด SUP แบบเป่าลม วัสดุพายบอร์ด การเลือกบอร์ด และข้อมูลเชิงลึกของอุตสาหกรรมสำหรับแบรนด์และมืออาชีพ'
  keywords:
    - 'ความรู้ SUP'
    - 'คู่มือ SUP แบบเป่าลม'
    - 'วัสดุพายบอร์ด'
    - 'ข้อมูลเชิงลึกอุตสาหกรรม SUP'
hero:
  tagline: กราฟความรู้
  title: ความรู้การสำรวจทางน้ำ
  subtitle: |
    ฐานความรู้ที่มีโครงสร้างครอบคลุมเทคโนโลยี SUP แบบเป่าลม<br />
    ความปลอดภัยทางน้ำ วิศวกรรมบอร์ด และการวางแผนการผจญภัย
  taglineSection: สำรวจ เรียนรู้ ไปด้วยความมั่นใจ
clusters:
  tagline: กลุ่มความรู้
  title: สำรวจตามหัวข้อ
  subtitle: ดำดิ่งลึกสู่เทคโนโลยี ความปลอดภัย และทักษะเบื้องหลังทุกผลิตภัณฑ์ afarer
  items:
    - title: คู่มือการซื้อ SUP
      description: ตั้งแต่การเลือกบอร์ดแรกจนถึงเทคนิคทัวร์ริ่งขั้นสูง — ทุกอย่างเกี่ยวกับการพายยืนบนบอร์ด
      icon: tabler:lifebuoy
      topics:
        - วิธีเลือกซัพเป่าลมแรกของคุณ
        - คู่มือขนาด SUP และความสามารถในการรับน้ำหนัก
        - SUP ที่ดีที่สุดสำหรับผู้เริ่มต้น ทัวร์ริ่ง โยคะ และการแข่ง
        - ข้อผิดพลาดทั่วไปในการซื้อ SUP ที่ควรหลีกเลี่ยง
        - การเปรียบเทียบบอร์ดเป่าลมกับบอร์ดแข็ง
    - title: วิศวกรรมและเทคโนโลยี SUP
      description: คู่มือทางเทคนิคเกี่ยวกับบอร์ด SUP แบบเป่าลม — วัสดุ วิธีการก่อสร้าง และกระบวนการผลิต
      icon: tabler:microscope
      topics:
        - เจาะลึกเทคโนโลยี drop-stitch
        - ข้อกำหนด PVC เกรดทหาร
        - การลามิเนตแบบ fusion เทียบกับการติดด้วยกาว
        - เทคโนโลยีโฟม EVA และวิธีการทำงานศิลป์
        - ชนิดวาล์ว SUP และระบบครีบ
    - title: ความปลอดภัยและการดูแลรักษา SUP
      description: ความรู้ด้านความปลอดภัยที่จำเป็นสำหรับนักพายทุกคน — ตั้งแต่การเลือก PFD การอ่านสภาพอากาศ ถึงการดูแลและซ่อมบำรุงบอร์ด
      icon: tabler:shield
      topics:
        - รายการตรวจสอบความปลอดภัย SUP และข้อกำหนด PFD
        - ความปลอดภัยแบบหลายห้องลมสำหรับลำน้ำห่างไกล
        - คู่มือ PSI การเป่าลม SUP
        - การจัดเก็บบอร์ดและการดูแลในฤดูหนาว
        - เทคนิคการซ่อมบอร์ดเป่าลม
    - title: ทักษะและเทคนิค SUP
      description: เทคนิคการพาย ทักษะทัวร์ริ่ง และการฝึกฟิตเนสสำหรับทุกระดับทักษะ
      icon: tabler:sailboat
      topics:
        - เทคนิคการพายสำหรับผู้เริ่มต้น
        - การฝึกฝนจังหวะพายระดับกลาง
        - การวางแผนทัวร์ริ่งและการสำรวจ
        - การฝึกฟิตเนสและการแข่ง SUP
        - ทักษะล่องน้ำวนและลำธาร
    - title: ไลฟ์สไตล์ SUP และการใช้งานพิเศษ
      description: กิจกรรม SUP เฉพาะทาง — โยคะ ตกปลา กับน้องหมา ครอบครัว และเคล็ดลับการท่องเที่ยว
      icon: tabler:heart
      topics:
        - โยคะและการทำสมาธิบนน้ำด้วยบอร์ด SUP
        - ตกปลาจากซัพเป่าลม
        - การพายกระดาน SUP กับสุนัขและเด็ก ๆ
        - การเดินทางพร้อมบอร์ด SUP ของคุณทางอากาศและรถยนต์
        - อุปกรณ์เสริมและอุปกรณ์จำเป็นสำหรับซัพ
    - title: การเปรียบเทียบและข้อมูลอ้างอิงของ SUP
      description: การเปรียบเทียบแบบเคียงข้างเพื่อช่วยให้คุณตัดสินใจได้อย่างรอบรู้
      icon: tabler:chart-bar
      topics:
        - SUP หรือ kayak — แบบไหนที่เหมาะกับคุณ?
        - อธิบายระดับชั้นวัสดุ PVC
        - ความปลอดภัยของห้องลมเดี่ยวเทียบกับหลายห้องลม
        - อธิบายวัสดุของบอร์ด SUP
        - การพิมพ์ UV เทียบกับงานศิลป์แบบบล็อก EVA

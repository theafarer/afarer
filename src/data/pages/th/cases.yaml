hero:
  tagline: กรณีศึกษา
  title: โปรเจกต์จริง ผลลัพธ์จริง<br />— afarer ในการปฏิบัติจริง
  subtitle: ดูว่า afarer ร่วมมือกับตัวแทนจำหน่าย แบรนด์ และผู้ดำเนินการทั่วโลกเพื่อส่งมอบโซลูชันทางทะเลที่ปรับแต่งตามความต้องการสำหรับทุกการใช้งาน
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: กรณีศึกษา afarer — โครงการผลิตทางทะเลที่ปรับแต่งตามความต้องการ
features3_cases:
  tagline: กรณีเด่น
  title: โซลูชันที่ปรับแต่ง<br />สำหรับความท้าทายจริง
  isBeforeContent: false
  columns: 3
  items:
    - title: กองเรือศูนย์ดำน้ำยุโรป
      customer: BlueMed Diving Centers
      country: กรีซ
      industry: ธุรกิจดำน้ำและการท่องเที่ยวทางทะเล
      challenge: ต้องใช้ SUP แบบติดตั้งอุปกรณ์ดำน้ำ 12 ลำสำหรับเครือศูนย์ดำน้ำบนหมู่เกาะกรีกหลายแห่ง บอร์ดแต่ละลำต้องมีจุดติดตั้งอุปกรณ์เฉพาะ พื้นที่เก็บถังอากาศ 8 ถัง และแท่นที่มั่นคงสำหรับนักดำน้ำขึ้นจากน้ำกลางทะเล ฝูงเรือต้องเดินทางมาถึงภายใน 60 วันก่อนเปิดฤดูกาลท่องเที่ยว
      solution: ผลิตบอร์ด SUP Voyager Dive จำนวน 12 ลำ พร้อมชั้นวางอุปกรณ์ในตัว แพลตฟอร์มที่มั่นคง และโครงสร้างดรอปสติตช์แบบกว้างพิเศษเพื่อความมั่นคงในการขึ้นยืน แต่ละบอร์ดพิมพ์ลวดลายตามสีของกองเรือลูกค้า บอร์ดทั้ง 12 ลำผ่านการทดสอบแรงดันและจัดส่งจากเมืองชิงเต่า (Qingdao) ภายใน 55 วัน
      product: SUP Voyager Dive
      results: บอร์ดทั้ง 12 ลำจัดส่งตรงเวลาสำหรับฤดูกาลท่องเที่ยว ฝูงเรือใช้งานทุกวันมานานกว่า 18 เดือนโดยไม่พบความบกพร่องของวัสดุแม้แต่ครั้งเดียว ลูกค้าสั่งซื้อเพิ่มอีก 6 ลำในปีที่สอง
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Voyager Dive เป็นกระดูกสันหลังของการปฏิบัติงานดำน้ำประจำวันของเรา ความมั่นคงดีเยี่ยม และการจัดวางพื้นที่จัดเก็บอุปกรณ์ช่วยให้ดาดฟ้าสะอาดและปลอดภัยสำหรับแขกของเรา
      icon: tabler:lifebuoy
    - title: โครงการ OEM ตัวแทนจำหน่ายออสเตรเลีย
      customer: Pacific Watersports Pty Ltd
      country: ออสเตรเลีย
      industry: การผลิตแบบ OEM/ODM
      challenge: ตัวแทนจำหน่ายในออสเตรเลียต้องการกลุ่มผลิตภัณฑ์บอร์ด SUP แบบไพรเวตเลเบลในราคาที่แข่งขันได้ เพื่อแข่งกับแบรนด์จากจีนที่ขายตรงถึงผู้บริโภค (DTC) โดยต้องมีบอร์ดรุ่นใหม่ 8 รุ่นครอบคลุมตั้งแต่ระดับเริ่มต้นจนถึงระดับสูง พร้อมกราฟิกตามสั่ง บรรจุภัณฑ์ตามสเปก และการจัดส่งแบบ drop-ship ไปยังร้านค้าปลีก
      solution: >-
        พัฒนารุ่น SUP จำนวน 8 รุ่น (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) พร้อมแพ็กเกจกราฟิกพิเศษเฉพาะตลาดออสเตรเลีย บรรจุภัณฑ์ขายปลีกแบบสั่งทำพิเศษพร้อม QR Code เชื่อมต่อไปยังวิดีโอแนะนำการใช้งาน ระบบโลจิสติกส์แบบ Drop-ship
        จากชิงเต่าโดยตรงถึงร้านค้าปลีกในออสเตรเลีย
      product: กลุ่มผลิตภัณฑ์ SUP สั่งทำพิเศษ (8 รุ่น)
      results: จากแนวคิดสู่การจัดส่งครั้งแรกภายใน 90 วัน อัตราการขายปลีกผ่านร้านค้า 85% ในฤดูกาลแรก ผู้จัดจำหน่ายขยายความร่วมมือครอบคลุมรุ่น SUP เพิ่มเติมในปีที่สอง
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: afarer ส่งมอบไลน์ผลิตภัณฑ์ซัพครบชุดภายใน 90 วัน —ตั้งแต่การออกแบบเบื้องต้นจนถึงชั้นวางสินค้าในร้านค้าปลีก คุณภาพเทียบเท่าแบรนด์ที่ขายในราคาสูงกว่าถึงสองเท่า
      icon: tabler:currency-dollar
    - title: การจัดหาเรือกู้ภัยตะวันออกกลาง
      customer: หน่วยงานป้องกันภัยฝ่ายพลเรือนแห่งชาติ
      country: สหรัฐอาหรับเอมิเรตส์
      industry: ค้นหาและกู้ภัย (Search & Rescue)
      challenge: องค์กรป้องกันภัยฝ่ายพลเรือนต้องการ SUP ที่พร้อมใช้งานภารกิจลาดตระเวน 20 ลำ สำหรับการค้นหาและกู้ภัยตามแนวชายฝั่ง การรักษาความปลอดภัยท่าเรือ และการตอบสนองต่อเหตุอุทกภัย โดยกำหนดให้บอร์ดมีสีสันสะดุดตา อุปกรณ์ความปลอดภัยครบชุด และสอดคล้องกับกฎหมายทางทะเลท้องถิ่น
      solution: >-
        จัดส่ง SUP รุ่น Patrol จำนวน 20 ลำ พร้อมโครงสร้างแบบ drop-stitch สีส้มมองเห็นได้ชัดเจน ชุดอุปกรณ์ความปลอดภัยครบชุด แถบสะท้อนแสงตามมาตรฐาน SOLAS และโครงสร้างเสริมความแข็งแรง บอร์ดแต่ละลำได้รับการรับรอง CE และผ่านการทดสอบตามมาตรฐานที่เกี่ยวข้อง
        ชุดเอกสารประกอบด้วยใบรับรองการปฏิบัติตามข้อกำหนดสำหรับการจดทะเบียนในท้องถิ่น
      product: SUP Patrol
      results: กองเรือประจำการอยู่ตามสถานีชายฝั่ง 5 แห่ง บอร์ดปฏิบัติงานในสภาพอากาศร้อนจัด (45°C+) โดยไม่มีการเสื่อมสภาพ ประสิทธิภาพและความทนทานเหนือกว่าข้อกำหนดที่ตั้งไว้
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: บอร์ด SUP Patrol ทำได้เกินข้อกำหนดการปฏิบัติงานของเรา ในสภาพอากาศร้อนจัด บอร์ดไม่แสดงสัญญาณการเสื่อมสภาพจากรังสี UV หลังจากใช้งานทุกวันเป็นเวลา 24 เดือน
      icon: tabler:alert-triangle
    - title: ความร่วมมือแบรนด์ OEM ยุโรป
      customer: North Sea Marine Equipment BV
      country: เนเธอร์แลนด์
      industry: การผลิตแบบ OEM/ODM
      challenge: >-
        แบรนด์ผลิตภัณฑ์ทางทะเลจากยุโรปที่ก่อตั้งมานานต้องการขยายตลาดเข้าสู่ธุรกิจ SUP โดยไม่ต้องลงทุนในโรงงานผลิต พวกเขาต้องการพันธมิตรแบบ white-label ที่สามารถผลิตบอร์ด SUP ได้ 5 รุ่น (ความยาว 9 ฟุต ถึง 12 ฟุต) พร้อมแบรนด์ส่วนตัว การรับรองมาตรฐาน CE
        และสิทธิ์การจัดจำหน่ายแบบเอกสิทธิ์เฉพาะภูมิภาคสหภาพยุโรป
      solution: >-
        จัดทำสัญญาการผลิตแบบไวท์เลเบล (white-label) สำหรับบอร์ด SUP จำนวน 5 รุ่น โดยทุกรุ่นติดโลโก้และใช้ชุดสีตามแบรนด์ของลูกค้า เตรียมเอกสารการรับรอง CE สำหรับทุกรุ่น มอบสิทธิ์การจัดจำหน่ายแต่เพียงผู้เดียวในสหภาพยุโรปพร้อมข้อตกลงปริมาณสั่งซื้อขั้นต่ำ
        และจัดเตรียมเอกสารทางเทคนิคสำหรับเครือข่ายบริการในพื้นที่
      product: สายผลิตภัณฑ์ SUP ตามสั่ง (5 รุ่น)
      results: ลงนามข้อตกลงระยะเวลาหลายปี รอบการผลิตชุดแรกจำนวน 50 ลำจัดส่งภายใน 75 วัน เปิดตัวแบรนด์ในงานแสดงสินค้าสำคัญพร้อมเสียงตอบรับที่ดีจากดีลเลอร์
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: การทำงานร่วมกับ afarer ทำให้เราเข้าสู่ตลาด SUP ได้โดยไม่ต้องสร้างโรงงาน — พวกเขาส่งมอบโซลูชันแบบเทิร์นคีย์ครบวงจร พร้อมการรับรอง CE และเอกสารสนับสนุนตัวแทนจำหน่าย
      icon: tabler:building
    - title: กองเรือรีสอร์ทแคริบเบียน
      customer: Paradise Island Resorts Ltd
      country: บาฮามาส
      industry: การท่องเที่ยวทางทะเลและการบริการ
      challenge: >-
        รีสอร์ทระดับหรูต้องการชุดอุปกรณ์กีฬาทางน้ำครบชุดสำหรับกิจกรรมของแขก ได้แก่ บอร์ด SUP 40 ลำสำหรับทัวร์พร้อมไกด์ SUP เพิ่มเติมอีก 20 ลำสำหรับการสำรวจทะเลสาบ บอร์ด SUP 10 ลำสำหรับทริปของแขก พร้อมอุปกรณ์เสริม อุปกรณ์ทั้งหมดต้องมีแบรนด์รีสอร์ทแบบกำหนดเอง
        และต้องจัดส่งก่อนถึงช่วงพีคของฤดูท่องเที่ยว
      solution: 'ผลิตชุดซัพครบชุด: บอร์ด SUP Voyager จำนวน 40 ลำ (รุ่น All-Around), บอร์ด SUP Explorer จำนวน 20 ลำ, บอร์ด SUP Touring จำนวน 10 ลำ พร้อมเสื้อชูชีพ (PFD) ไม้พาย ปั๊มลม และชุดซ่อม อุปกรณ์ทั้งหมดพิมพ์โลโก้รีสอร์ตและลวดลายสีสไตล์เขตร้อน จัดส่งแบบคอนเทนเนอร์พร้อมรายการสินค้าคงคลังครบถ้วน'
      product: แพ็กเกจ SUP ครบชุด (มากกว่า 70 ลำ)
      results: ฝูงเรือมาถึงก่อนฤดูกาลท่องเที่ยวสูงสุด 6 สัปดาห์ คะแนนความพึงพอใจของแขกต่อกิจกรรมกีฬาทางน้ำเพิ่มขึ้น 40% เมื่อเทียบปีต่อปี อุปกรณ์ใช้งานได้นาน 3 ฤดูกาลด้วยการดูแลรักษาตามปกติเท่านั้น
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: แนวทางแพ็กเกจครบวงจรทำให้เราได้รับทุกสิ่งที่ต้องการในการขนส่งเพียงครั้งเดียว — ทั้งบอร์ดและอุปกรณ์เสริมที่พิมพ์แบรนด์ของเราพร้อมใช้งานสำหรับแขก แขกของเราชื่นชอบคุณภาพของอุปกรณ์เป็นอย่างมาก
      icon: tabler:beach
    - title: สัญญาลาดตระเวนชายฝั่งสหรัฐฯ
      customer: Atlantic Coastal Security Agency
      country: สหรัฐอเมริกา
      industry: ความมั่นคงทางทะเลและการบังคับใช้กฎหมาย
      challenge: หน่วยงานรักษาความมั่นคงทางทะเลชายฝั่งของสหรัฐฯ ต้องการบอร์ด SUP ลาดตระเวนรุ่นหนักสำหรับปฏิบัติการในทะเลเปิด โดยต้องใช้บอร์ดประสิทธิภาพสูงพร้อมอุปกรณ์ระดับมาตรฐานทางการทหารและปฏิบัติตามข้อกำหนดของหน่วยยามฝั่งสหรัฐฯ (US Coast Guard)
      solution: บอร์ด SUP Patrol ถูกออกแบบทางวิศวกรรมด้วยโครงสร้าง drop-stitch ที่เสริมความแข็งแรง โทนสีที่มองเห็นได้ชัดในระยะไกล จุดติดตั้งอุปกรณ์สื่อสารแบบเข้ารหัส และจุดยึดอุปกรณ์ในตัว บอร์ดได้รับการเสริมความแข็งแรงสำหรับการปฏิบัติงานหนัก พร้อมเอกสารการปฏิบัติตามมาตรฐาน USCG
      product: SUP Patrol
      results: หน่วยงานรายงานอัตราความพร้อมปฏิบัติภารกิจ 95% ในช่วง 12 เดือนแรก และมีการสั่งซื้อเพิ่มอีก 8 ลำ
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Patrol มอบสมรรถประสิทธิภาพที่ทีมงานของเราต้องการสำหรับการปฏิบัติการในท้องทะเลอ๊าปเปิด โครงสร้างเสริมแข็งแรงให้ความทนทานอย่างยิ่งยิ่นโดยไม่ลดทอนการควบคุมบอร์ด
      icon: tabler:shield
cta:
  title: มีโปรเจกต์ที่อยากปรึกษาหรือไม่?
  subtitle: ทุกความร่วมมือกับ afarer เริ่มต้นด้วยการสนทนา บอกความต้องการของคุณให้เราทราบ แล้วเราจะพัฒนาโซลูชัน
  actions:
    - variant: primary
      text: เริ่มโปรเจกต์ของคุณ
      href: /contact
    - text: ดูความสามารถของเรา
      href: /brand/marine-expertise

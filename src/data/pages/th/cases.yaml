hero:
  tagline: 'กรณีศึกษา'
  title: 'โปรเจกต์จริง ผลลัพธ์จริง<br />— afarer ในการปฏิบัติจริง'
  subtitle: 'ดูว่า afarer ร่วมมือกับตัวแทนจำหน่าย แบรนด์ และผู้ดำเนินการทั่วโลกเพื่อส่งมอบโซลูชันทางทะเลที่ปรับแต่งตามความต้องการสำหรับทุกการใช้งาน'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'กรณีศึกษา afarer — โครงการผลิตทางทะเลที่ปรับแต่งตามความต้องการ'
features3_cases:
  tagline: 'กรณีเด่น'
  title: 'โซลูชันที่ปรับแต่ง<br />สำหรับความท้าทายจริง'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'กองเรือศูนย์ดำน้ำยุโรป'
      description: 'จัดหาเรือ SUP 520 ที่ติดตั้งเพื่อการดำน้ำจำนวน 12 ลำให้กับเครือข่ายศูนย์ดำน้ำในเมดิเตอร์เรเนียน ชั้นวางถังดำน้ำแบบกำหนดเอง บันไดดำน้ำ และตราสัญลักษณ์กองเรือ จัดส่งภายใน 60 วัน'
      icon: tabler:lifebuoy
    - title: 'โครงการ OEM ตัวแทนจำหน่ายออสเตรเลีย'
      description: 'พัฒนากระดาน SUP แบรนด์ส่วนตัวสำหรับตัวแทนจำหน่ายกีฬาทางน้ำในออสเตรเลีย 8 รุ่น บรรจุภัณฑ์ที่กำหนดเอง และโลจิสติกส์แบบ Drop-ship จากแนวคิดสู่การจัดส่งครั้งแรกใน 90 วัน'
      icon: tabler:currency-dollar
    - title: 'การจัดหาเรือกู้ภัยตะวันออกกลาง'
      description: 'จัดหาเรือลาดตระเวน SUP 450 Patrol จำนวน 20 ลำให้กับองค์กรป้องกันภัยพลเรือนในตะวันออกกลาง ดาดฟ้าระบายน้ำเอง ชุดนำทางครบครัน และท่อสีส้มมองเห็นได้ชัดเจน ปฏิบัติตามมาตรฐานข้อบังคับท้องถิ่น'
      icon: tabler:alert-triangle
    - title: 'ความร่วมมือแบรนด์ OEM ยุโรป'
      description: 'ความร่วมมือด้านการผลิตแบบ White-label กับแบรนด์ทางทะเลของยุโรป 5 รุ่น SUP การสร้างแบรนด์ส่วนตัว สิทธิ์จัดจำหน่ายแต่เพียงผู้เดียวสำหรับตลาด EU ข้อตกลงหลายปี'
      icon: tabler:building
    - title: 'กองเรือรีสอร์ทแคริบเบียน'
      description: 'ชุดอุปกรณ์กีฬาทางน้ำครบชุดสำหรับรีสอร์ทในแคริบเบียน: กระดาน SUP 40 ชิ้น เรือคายัค 20 ลำ เรือเป่าลม 10 ลำ และอุปกรณ์เสริม การสร้างแบรนด์รีสอร์ทแบบกำหนดเองบนอุปกรณ์ทั้งหมด'
      icon: tabler:beach
    - title: 'สัญญาลาดตระเวนชายฝั่งสหรัฐฯ'
      description: 'จัดหาเรือลาดตระเวน SUP 600 ให้กับหน่วยงานรักษาความปลอดภัยชายฝั่งสหรัฐฯ ระบบเครื่องยนต์คู่ ตัวเลือกคอนโซลหุ้มเกราะ และการรวมระบบอิเล็กทรอนิกส์ระดับทหาร'
      icon: tabler:shield
cta:
  title: 'มีโปรเจกต์ที่อยากปรึกษาหรือไม่?'
  subtitle: 'ทุกความร่วมมือกับ afarer เริ่มต้นด้วยการสนทนา บอกความต้องการของคุณให้เราทราบ แล้วเราจะพัฒนาโซลูชัน'
  actions:
    - variant: primary
      text: 'เริ่มโปรเจกต์ของคุณ'
      href: /contact
    - text: 'ดูความสามารถของเรา'
      href: /brand/marine-expertise

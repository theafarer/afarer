features3_markets:
  tagline: Key Markets
  title: 'ความเชี่ยวชาญระดับภูมิภาค<br />สำหรับข้อกำหนดในท้องถิ่น'
  subtitle: 'เราเข้าใจดีว่าตลาดที่แตกต่างกันมีข้อกำหนดด้านกฎระเบียบ ความชอบ และกรณีการใช้งานที่แตกต่างกัน'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europe & UK
      description: 'ผลิตภัณฑ์ที่ได้รับการรับรอง CE ตรงตามมาตรฐาน EN ISO 6185 ความต้องการ SUP เรือเป่าลม และกระดาน SUP ที่แข็งแกร่งในตลาดสหภาพยุโรป ผู้จัดจำหน่ายในสหราชอาณาจักรชื่นชมการตอบสนองที่รวดเร็วของเรา'
      icon: tabler:map-pin
    - title: North America
      description: 'หน่วยยามฝั่งสหรัฐฯ อนุมัติการผลิต คลังสินค้าของสหรัฐฯ ในเมืองมอนต์แคลร์ รัฐแคลิฟอร์เนีย เพื่อการจัดส่งทางฝั่งตะวันตกที่รวดเร็ว ความต้องการเรือประมง เรือกู้ภัย และ SUP เพื่อการพักผ่อนหย่อนใจที่เพิ่มขึ้น'
      icon: tabler:map-pin
    - title: Australia & Oceania
      description: 'ตลาดที่แข็งแกร่งสำหรับเรือ SUP และเรือประมูลพอง ผู้จัดจำหน่ายในออสเตรเลียให้ความสำคัญกับเรือ Hypalon ของเราในด้านความต้านทานรังสียูวีในสภาพแสงแดดที่รุนแรง จัดส่งด่วนจากโรงงานในเอเชียของเรา'
      icon: tabler:map-pin
    - title: Middle East
      description: 'ความต้องการเรือลาดตระเวนและกู้ภัยเพิ่มมากขึ้น SUP ตัวถังอะลูมิเนียมของเราได้รับความนิยมจากหน่วยยามฝั่งและผู้ปฏิบัติงานรักษาความปลอดภัย การกำหนดค่าแบบกำหนดเองสำหรับสภาพแวดล้อมที่มีอุณหภูมิสูง'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'เครือข่ายการจัดจำหน่าย'
  title: 'ร่วมมือกับผู้จัดจำหน่าย<br />ทั่วโลก'
  subtitle: 'เราทำงานร่วมกับผู้จัดจำหน่ายอุปกรณ์ทางทะเลที่จัดตั้งขึ้น แบรนด์ OEM และหน่วยงานจัดซื้อจัดจ้างของรัฐบาล'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerships
      description: 'การผลิตฉลากส่วนตัวสำหรับแบรนด์กีฬาทางน้ำระดับโลก เราจัดการทุกอย่างตั้งแต่การออกแบบไปจนถึงการผลิตจนถึงการส่งสินค้า'
      icon: tabler:building
    - title: Distributor Network
      description: 'ผู้จัดจำหน่ายที่ได้รับอนุญาตในกว่า 20 ประเทศมีสต็อกและให้การสนับสนุนในท้องถิ่น ยินดีต้อนรับผู้จัดจำหน่ายรายใหม่'
      icon: tabler:users
    - title: Government & Institutional
      description: 'การจัดหาโดยตรงให้กับหน่วยยามชายฝั่ง องค์กรค้นหาและกู้ภัย และโครงการจัดซื้อจัดจ้างทางทหาร การปฏิบัติตามข้อกำหนดการจัดซื้อจัดจ้างของสถาบัน'
      icon: tabler:building-community
steps2_logistics:
  title: 'โลจิสติกส์และการสนับสนุนระดับโลก'
  subtitle: 'จากโรงงานสู่จุดหมายปลายทาง — เราจัดการห่วงโซ่อุปทานทั้งหมด'
  items:
    - title: Shipping Options
      description: 'การขนส่งทางทะเล (FOB ชิงเต่า) การขนส่งทางอากาศสำหรับคำสั่งซื้อเร่งด่วน และบริการจัดส่งด่วนสำหรับตัวอย่างและชิ้นส่วนอะไหล่'
      icon: tabler:truck-delivery
    - title: US Warehouse
      description: 'สต็อกสินค้าจัดขึ้นที่เมืองมอนต์แคลร์ รัฐแคลิฟอร์เนีย เพื่อการจัดส่งที่รวดเร็วทั่วอเมริกาเหนือ ชายฝั่งตะวันตก: 2-3 วัน ภาคกลาง: 3-4 วัน ชายฝั่งตะวันออก: 4-5 วัน'
      icon: tabler:building-warehouse
    - title: Spare Parts
      description: 'อะไหล่และวัสดุสิ้นเปลืองของแท้ของ afarer มีในสต็อกตลอดทั้งปี ชิ้นส่วนทั่วไปจัดส่งภายใน 24 ชั่วโมง'
      icon: tabler:package
    - title: Technical Support
      description: 'สายตรงไปยังทีมวิศวกรของเราเพื่อสอบถามปัญหาด้านเทคนิค คำแนะนำในการซ่อม และการสนับสนุนในการซ่อมแซม เราสนับสนุนเรือที่เราสร้างเมื่อ 20 ปีที่แล้ว'
      icon: tabler:headset
cta:
  title: 'ต้องการเป็นตัวแทนจำหน่ายหรือไม่?'
  subtitle: 'เรากำลังขยายเครือข่ายการจัดจำหน่ายของเราอย่างแข็งขัน ติดต่อทีมส่งออกของเราเพื่อหารือเกี่ยวกับโอกาสในการเป็นหุ้นส่วน'
  actions:
    - variant: primary
      text: 'สอบถามความร่วมมือ'
      href: /contact
    - text: View our product range
      href: /products

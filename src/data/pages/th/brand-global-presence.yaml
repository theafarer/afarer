meta:
  title: 'การปรากฏทั่วโลก — ผู้ผลิต SUP ในกว่า 50 ประเทศ | {SITE}'
  description: 'afar ส่งออกบอร์ด SUP แบบสูบลมและเรือพองไปยังกว่า 50 ประเทศทั่วทุกทวีป ผู้ผลิตและผู้จัดจำหน่ายมืออาชีพสำหรับแบรนด์ ตัวแทนจำหน่าย และกองเรือ'
  keywords:
    - 'ผู้ผลิต SUP ระดับโลก'
    - 'ผู้ส่งออกพายบอร์ด'
    - 'โรงงาน SUP จีน'
    - 'ผู้จัดจำหน่าย SUP มืออาชีพ'
hero:
  tagline: การแสดงตนทั่วโลก
  title: ให้บริการมากกว่า 50 ประเทศ<br />ทั่วทุกทวีป
  subtitle: ตั้งแต่เจ้าหน้าที่ลาดตระเวนชายฝั่งของยุโรป ไปจนถึงผู้จัดจำหน่ายกีฬาทางน้ำของออสเตรเลีย ไปจนถึงทีมกู้ภัยในตะวันออกกลาง — เรือที่อยู่ไกลออกไปอยู่ในน้ำทั่วโลก
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer ผู้ผลิตและจัดจำหน่ายผลิตภัณฑ์ทางทะเลระดับโลก

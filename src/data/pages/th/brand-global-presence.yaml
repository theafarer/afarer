hero:
  tagline: 'การแสดงตนทั่วโลก'
  title: 'ให้บริการมากกว่า 50 ประเทศ<br />ทั่วทุกทวีป'
  subtitle: 'ตั้งแต่เจ้าหน้าที่ลาดตระเวนชายฝั่งของยุโรป ไปจนถึงผู้จัดจำหน่ายกีฬาทางน้ำของออสเตรเลีย ไปจนถึงทีมกู้ภัยในตะวันออกกลาง — เรือที่อยู่ไกลออกไปอยู่ในน้ำทั่วโลก'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer global marine manufacturing and distribution

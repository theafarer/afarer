hero:
  tagline: คู่มือแนะนำ
  title: เพิ่งเริ่มเล่น SUP ใช่ไหม?
  subtitle: คู่มือปฏิบัติที่จะช่วยให้คุณเลือกใช้ และเพลิดเพลินกับบอร์ด SUP เป่าลม
size_guide:
  tagline: ขนาดและสเปก
  title: ค้นหาขนาดที่ใช่สำหรับความต้องการของคุณ
  desc: เปรียบเทียบขนาดบอร์ด SUP ความจุน้ำหนัก และการใช้งานที่แนะนำ ไม่ว่าคุณจะต้องการ SUP แบบทัวร์ริ่ง บอร์ดโยคะ หรือ SUP แบบอเนกประสงค์ — คู่มือเลือกขนาดของเราช่วยให้คุณเลือกขนาดที่เหมาะสมที่สุด
  link_label: ดูคู่มือขนาดเต็มพร้อมสเปกผลิตภัณฑ์ →
  link: /size-guide
  cards:
    - title: บอร์ด SUP
      desc: เลือกความยาวตามน้ำหนักตัวและการใช้งานที่ตั้งใจไว้ บอร์ดที่กว้างขึ้น (32"+) ให้ความมั่นคงมากกว่า บอร์ดที่ยาวขึ้น (11–12 ฟุต) แล่นตรงได้ดีกว่าสำหรับการพายทัวร์ริ่ง
    - title: SUP สำหรับการทัวร์ริ่ง
      desc: บอร์ดที่ยาวกว่า (11–12 ft) เหมาะสำหรับการพายเป็นระยะทางไกลและวิ่งเป็นเส้นตรง มั่นคงเพียงพอสำหรับการทัวร์ริ่งพร้อมสัมภาระ ควรตรวจสอบความจุน้ำหนักบรรทุกเสมอ
    - title: SUP อเนกประสงค์
      desc: เลือกความยาวตามน้ำหนักและลักษณะการใช้งานของผู้ใช้ บอร์ดที่กว้างขึ้น (32"+) ให้ความมั่นคง เหมาะทั้งการพักผ่อนหย่อนใจและการออกกำลังกาย

meta:
  title: 'ความปลอดภัย — มาตรฐานและใบรับรอง | {SITE}'
  description: 'ความปลอดภัยของผลิตภัณฑ์ afarer: บอร์ด SUP แบบสูบลมและเรือพองที่รับรอง CE การทดสอบอย่างละเอียด และการปฏิบัติตามมาตรฐานความปลอดภัยทางทะเลสากล'
  keywords:
    - 'มาตรฐานความปลอดภัย SUP'
    - 'พายบอร์ดที่รับรอง CE'
    - 'ความปลอดภัย SUP แบบสูบลม'
    - 'การปฏิบัติตามความปลอดภัยทางทะเล'
hero:
  tagline: ความปลอดภัย
  title: มาตรฐานความปลอดภัยและการรับรอง
  subtitle: สินค้า afarer ทั้งหมดผ่านการทดสอบอย่างเข้มงวดและปฏิบัติตามมาตรฐานความปลอดภัยสากล เพื่อการใช้งานเพื่อนันทนาการและวิชาชีพ
certifications:
  - title: การรับรอง CE
    description: อุปกรณ์ความปลอดภัย afarer ทั้งหมดปฏิบัติตามข้อกำหนดการติดฉลาก CE ภายใต้ระเบียบว่าด้วยอุปกรณ์ป้องกันส่วนบุคคลของสหภาพยุโรป (EU) 2016/425
  - title: การรับรอง ISO 12402
    description: เสื้อชูชีพปฏิบัติตามมาตรฐานการลอยตัว ISO 12402 Life Vest Classic ให้แรงลอยตัว 50N+ ส่วน Life Vest Pro ตรงตามข้อกำหนด SOLAS ด้วยระบบพอมอัตโนมัติ
  - title: การปฏิบัติตาม SOLAS
    description: เสื้อชูชีพ Pro ปฏิบัติตามกฎระเบียบ SOLAS สำหรับการปฏิบัติการทางทะเลนอกชายฝั่งและเชิงพาณิชย์

meta:
  title: โปรแกรมพันธมิตรค้าปลีก SUP | {SITE}
  description: Become an Afarer retail partner. Full product line, professional marketing materials, dropshipping options, and competitive margins for SUP retailers.
hero:
  tagline: พันธมิตรค้าปลีก
  title: Become An Afarer<br />Retail Partner
  subtitle: Sell the fastest-growing SUP brand in your market. Full product line, professional marketing materials, dropshipping options, and margins that make sense.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: บอร์ด SUP ของ Afarer จัดแสดงในร้านค้าปลีก
margin_section:
  title: อัตรากำไรค้าปลีกและปริมาณสั่งซื้อขั้นต่ำ (MOQ)
  subtitle: ระดับราคาค้าส่งที่ออกแบบมาเพื่อความสามารถในการทำกำไรของผู้ค้าปลีก
  items:
    - tier: พาร์ทเนอร์ขั้นพื้นฐาน
      discount: 20%
      moq: 500 ชิ้น/ปี
      margin_note: กำไรประมาณ 150–250 ดอลลาร์ต่อบอร์ด
      features:
        - การเข้าถึงสายผลิตภัณฑ์ทั้งหมด
        - แพ็คเกจสื่อการตลาด
        - การสนับสนุนทางอีเมล
        - สิทธิ์เข้าถึงแคตตาล็อกผลิตภัณฑ์
    - tier: พันธมิตรระดับพรีเมียม
      discount: 30%
      moq: มากกว่า 2,000 ลำ/ปี
      margin_note: กำไรประมาณ $250–400 ต่อบอร์ด
      features:
        - ผู้จัดการบัญชีที่ดูแลคุณโดยเฉพาะ
        - การคุ้มครองพื้นที่ทำการตลาดแบบเอกสิทธิ์
        - การสนับสนุนการตลาดเฉพาะกลุ่ม
        - สิทธิ์เข้าถึงผลิตภัณฑ์ใหม่ก่อนใคร
        - การอบรมพนักงาน
    - tier: พันธมิตรระดับเรือธง
      discount: 35%+
      moq: มากกว่า 5,000 ชิ้นต่อปี
      margin_note: กำไรต่อบอร์ดประมาณ $350–500+
      features:
        - แคมเปญการตลาดร่วมแบรนด์
        - การสนับสนุนการจัดแสดงในร้าน
        - การฝึกอบรมพนักงาน ณ สถานที่
        - โปรโมชันร่วมกันบนโซเชียลมีเดีย
        - การจัดสรรการผลิตตามลำดับความสำคัญสูง
product_line:
  title: สายผลิตภัณฑ์ครบวงจร
  subtitle: บอร์ด SUP ที่ตอบโจทย์ลูกค้าทุกคนที่ก้าวเข้ามาในร้านของคุณ
  items:
    - name: All-Round Series
      description: ขายดีที่สุด — เหมาะกับลูกค้า 80%
    - name: Touring Series
      description: นักพายสายประสิทธิภาพ — อัตรากำไรสูงขึ้น
    - name: Yoga Series
      description: ตลาดเฉพาะกลุ่ม — ราคาระดับพรีเมียม
    - name: Kids Series
      description: ลูกค้าครอบครัว — ผู้ซื้อซ้ำ
    - name: Racing Series
      description: ตลาดกลุ่มผู้ที่ชื่นชอบ — สร้างภาพลักษณ์ที่ดีต่อแบรนด์
    - name: Accessories
      description: สินค้าเสริมอัตรากำไรสูง (ไม้พาย เสื้อชูชีพ ปั๊มลม กระเป๋า)
catalog:
  title: ทรัพยากรสำหรับพันธมิตรค้าปลีก
  subtitle: ดาวน์โหลดชุดเอกสารพันธมิตรค้าปลีกฉบับสมบูรณ์ของเรา
  items:
    - name: 2026 Product Catalog
      desc: ผลิตภัณฑ์ครบทุกรุ่น พร้อมสเปก ราคา และข้อมูลการสั่งซื้อ
      icon: tabler:file-text
      link: /resources/download-catalog
    - name: Retail Partner Guide
      desc: เครื่องคำนวณมาร์จิ้น เคล็ดลับการจัดวางสินค้า และแนวปฏิบัติที่ดีที่สุด
      icon: tabler:book
      link: /resources/download-catalog
    - name: Marketing Asset Pack
      desc: รูปผลิตภัณฑ์ความละเอียดสูง รูปภาพไลฟ์สไตล์ และสื่อการตลาด ณ จุดขาย (POS)
      icon: tabler:photo
      link: /media
support:
  title: การสนับสนุนพันธมิตรค้าปลีก
  subtitle: ทุกสิ่งที่คุณต้องใช้เพื่อขายอย่างมั่นใจ
  items:
    - ภาพสินค้าความละเอียดสูง (ถ่ายโดยช่างภาพมืออาชีพ)
    - ภาพถ่ายไลฟ์สไตล์สำหรับโซเชียลมีเดีย เว็บไซต์ และแคตตาล็อก
    - สื่อการตลาด — โปสเตอร์ ป้ายหน้าชั้นวางสินค้า แบนเนอร์
    - วิดีโอฝึกอบรมผลิตภัณฑ์เพื่อให้ความรู้แก่พนักงาน
    - แพ็กเกจคอนเทนต์โซเชียลมีเดีย (โพสต์รายสัปดาห์)
    - คำอธิบายผลิตภัณฑ์ที่ผ่านการปรับแต่งเพื่อ SEO
    - มีตัวเลือกแบบ Dropshipping — ไม่มีความเสี่ยงด้านสต็อกสินค้า
    - เงื่อนไขการชำระเงิน Net 30
cta:
  title: Ready to become a partner?
  subtitle: Apply for partnership or download our retail catalog.
  actions:
    - text: สมัครเป็นพันธมิตร
      href: /contact?partner=retail
      variant: primary
    - text: ดาวน์โหลดแคตตาล็อกค้าปลีก
      href: /resources/download-catalog

meta:
  title: โซลูชั่นกองเรือ SUP สำหรับรีสอร์ท | {SITE}
  description: โซลูชันฟลีต SUP ครบวงจรสำหรับรีสอร์ตและโรงแรม บอร์ดระดับเชิงพาณิชย์ การสร้างแบรนด์เฉพาะ การฝึกอบรมพนักงาน และแพ็กเกจที่เพิ่มผลตอบแทนการลงทุน (ROI) ตั้งแต่ 20 ถึง 100+ บอร์ด
hero:
  tagline: รีสอร์ทและโรงแรม
  title: เปลี่ยนพื้นที่ริมน้ำของคุณให้เป็นศูนย์รายได้<br />ด้วยกองเรือ SUP ระดับพรีเมียม
  subtitle: afarer ส่งมอบกองเรือ SUP แบบสูบลมระดับเชิงพาณิชย์ให้รีสอร์ททั่วโลก — ตั้งแต่แพ็กเกจเริ่มต้น 20 บอร์ด ไปจนถึงโปรแกรมแฟลกชิป 100+ บอร์ด รวมการปั๊มแบรนด์ของคุณเอง การฝึกอบรมพนักงาน และอะไหล่ทดแทน
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: แขกของรีสอร์ทกำลังเพลิดเพลินกับการพาย SUP บนชายหาดที่บริสุทธิ์
roi_section:
  title: โมเดลรายได้จาก SUP สำหรับรีสอร์ท
  subtitle: วิธีที่รีสอร์ทสร้างรายได้จากการให้เช่าซัพ 50,000 - 200,000+ ดอลลาร์ต่อปีด้วยการลงทุนเพียงครั้งเดียว
  metrics:
    - metric: $50K–$200K+
      label: รายได้จาก SUP ต่อปี
      detail: ต่อรีสอร์ต ขึ้นอยู่กับจำนวนฝูงเรือและอัตราการเข้าพัก
    - metric: 4–6 เดือน
      label: ระยะเวลาคืนทุนเฉลี่ย
      detail: คืนทุนจากการลงทุนกองเรือทั้งหมดภายในหนึ่งฤดูกาล
    - metric: 40%
      label: รายได้เพิ่มขึ้น
      detail: การเพิ่มขึ้นโดยเฉลี่ยหลังเปลี่ยนมาใช้ฝูงเรือของ Afarer
    - metric: 500+
      label: รอบการเช่าต่อบอร์ด
      detail: ความทนทานระดับเชิงพาณิชย์สำหรับการใช้งานประจำวัน
packages:
  title: ระบบแพ็กเกจสำหรับรีสอร์ท
  subtitle: เลือกแพ็กเกจที่เหมาะกับจำนวนแขกที่รองรับและเป้าหมายรายได้ของคุณ ทุกแพ็กเกจรวมการรับประกัน 12 เดือนและการรับรอง CE
  items:
    - name: แพ็กเกจเริ่มต้น
      tagline: สำหรับรีสอร์ทบูติค สูงสุด 20 คน/วัน
      features:
        - บอร์ด SUP 20 บอร์ด (3 ขนาดสำหรับผู้ใหญ่/เด็ก)
        - ไม้พาย 20 คัน (ปรับระดับได้) + เสื้อชูชีพ 20 ตัว
        - ปั๊มลมดับเบิลแอ็กชัน 4 เครื่อง (แบบไฟฟ้าเป็นตัวเลือก)
        - ชั้นวางเก็บบอร์ด 2 ชั้น + ชุดซ่อมแซม
        - พิมพ์โลโก้ของคุณบนบอร์ด
        - รับประกัน 12 เดือน + การรับรอง CE
      revenue: ศักยภาพรายได้ต่อปี 50K–80K หริยอ์สหรัฐ (USD)
      cta_text: รับแพ็กเกจเริ่มต้น
    - name: แพ็กเกจพรีเมียม
      tagline: สำหรับรีสอร์ทขนาดใหญ่ 50-100 คน/วัน
      features:
        - บอร์ด SUP 50 บอร์ด (5 ขนาด กองเรือแบบผสม)
        - ไม้พาย 50 อัน + เสื้อชูชีพ 50 ตัว
        - ปั๊มลมดับเบิลแอ็กชัน 10 เครื่อง + ปั๊มไฟฟ้า 2 เครื่อง
        - ชั้นวางเก็บบอร์ด 5 ชั้น + รถเข็นล้อ 2 คัน
        - แบรนด์เจาะจงเต็มรูปแบบ (บอร์ด ไม้พาย ถุง)
        - การฝึกอบรมพนักงาน (ออนไลน์)
        - จัดส่งอะไหล่ทดแทนภายใน 48 ชั่วโมง
        - รับประกัน 12 เดือน + การรับรอง CE
      revenue: ศักยภาพรายได้ต่อปี $120K–$200K+
      popular: true
      cta_text: รับแพ็กเกจพรีเมียม
    - name: แพ็กเกจ Flagship
      tagline: สำหรับรีสอร์ทอัลตร้าพรีเมียม 100+ คน/วัน
      features:
        - บอร์ด SUP 100+ บอร์ด (ครบทุกขนาด)
        - ชุดอุปกรณ์เสริมครบชุด (ไม้พาย เสื้อชูชีพ ปั๊ม รถเข็น)
        - ฝึกอบรมพนักงานถึงสถานที่ (2 วัน)
        - ผู้จัดการบัญชีที่ดูแลคุณโดยเฉพาะ
        - อะไหล่ทดแทนแบบเร่งด่วน (จัดส่งภายใน 24 ชั่วโมง)
        - แบรนด์เจาะจงเต็มรูปแบบ (บอร์ด + อุปกรณ์เสริม)
        - แพ็คเกจภาพถ่าย/วิดีโอเพื่อการตลาด
        - การรับประกัน 24 เดือน + รับรอง CE
      revenue: ศักยภาพรายได้ต่อปีมากกว่า 200,000 ดอลลาร์สหรัฐ ($200K+)
      cta_text: รับแพ็กเกจ Flagship
case_study:
  quote: ตั้งแต่เปลี่ยนมาใช้ Afarer รายได้จากการให้เช่า SUP ของเราเพิ่มขึ้น 40% ต้นทุนการเปลี่ยนบอร์ดลดลง 60% และเราคืนทุนจากการลงทุนกองเรือทั้งหมดได้ภายใน 4 เดือน
  author: ผู้จัดการกิจกรรมทางน้ำ
  location: รีสอร์ท 5 ดาว, มัลดีฟส์
  results:
    - label: การเติบโตของรายได้
      value: +40%
    - label: การลดต้นทุน
      value: '-60%'
    - label: ระยะเวลาคืนทุน
      value: 4 เดือน
features:
  title: ทำไมรีสอร์ทจึงเลือก Afarer
  subtitle: ความทนทานระดับพาณิชย์ โลจิสติกส์ทั่วโลก และพันธมิตรที่เข้าใจธุรกิจการโรงแรม
  items:
    - title: รอบการเช่า 500+ ครั้ง
      description: บอร์ดทุกชิ้นผ่านการทดสอบให้ทนต่อการใช้งานให้เช่ามากกว่า 500 รอบ ในสภาพน้ำเค็ม แสงแดดจัด และทราย
      icon: tabler:shield-check
    - title: การจัดส่งอะไหล่ภายใน 48 ชั่วโมง
      description: อะไหล่ทดแทนจัดส่งภายใน 48 ชั่วโมง — รายได้จากธุรกิจเช่าของคุณไม่ต้องหยุดชะงัก
      icon: tabler:truck-delivery
    - title: การสร้างแบรนด์ตามสั่ง
      description: สะท้อนเอกลักษณ์ของรีสอร์ตคุณด้วยสีและโลโก้เฉพาะบนบอร์ดทุกลำ
      icon: tabler:palette
    - title: การฝึกอบรมพนักงาน
      description: โปรแกรมฝึกอบรมออนไลน์และ ณ สถานที่สำหรับทีมกิจกรรมของคุณ
      icon: tabler:school
    - title: ระบบโลจิสติกส์ทั่วโลก
      description: จัดส่งไปยัง 50+ ประเทศ พร้อมตัวเลือกการรวมสินค้าเพื่อการขนส่ง (consolidated freight)
      icon: tabler:world
    - title: ผ่านการรับรอง CE
      description: อุปกรณ์ทั้งหมดผ่านการรับรอง CE และ ISO 9001:2015 — ปลอดภัยและคุณภาพที่รับประกัน
      icon: tabler:certificate

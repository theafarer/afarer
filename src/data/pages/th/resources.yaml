hero_text:
  tagline: Resources
  title: 'ศูนย์ดาวน์โหลดและคู่มือผู้ซื้อ'
  subtitle: 'เข้าถึงแค็ตตาล็อกผลิตภัณฑ์ คู่มือ OEM รายการตรวจสอบผู้ซื้อ และเอกสารทางเทคนิคเพื่อช่วยคุณในการตัดสินใจจัดซื้อจัดจ้างโดยมีข้อมูลครบถ้วน'
features3_downloads:
  tagline: Downloads
  title: 'เอกสารประกอบผลิตภัณฑ์<br />และแหล่งข้อมูลสำหรับผู้ซื้อ'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'กลุ่มผลิตภัณฑ์ครบวงจร ได้แก่ เรือ SUP เรือเป่าลม กระดาน SUP เรือคายัค และอุปกรณ์เสริม ข้อมูลจำเพาะ การกำหนดค่า และตัวเลือก รูปแบบ PDF'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'ทุกสิ่งที่คุณจำเป็นต้องรู้เกี่ยวกับความร่วมมือ OEM/ODM: ภาพรวมกระบวนการ ปริมาณการสั่งซื้อขั้นต่ำ ตัวเลือกการปรับแต่ง การควบคุมคุณภาพ และการจัดส่ง'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'วิธีเลือก SUP ที่เหมาะสม: วัสดุตัวถัง วัสดุท่อ การเลือกเครื่องยนต์ ข้อควรพิจารณาเกี่ยวกับขนาด และตัวเลือกการกำหนดค่าสำหรับการใช้งานที่แตกต่างกัน'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'ข้อควรพิจารณาที่สำคัญในการเลือกผู้ผลิตบอร์ด SUP: ตัวชี้วัดคุณภาพ ข้อกำหนดการรับรอง ข้อควรพิจารณาขั้นต่ำ และสิ่งที่ต้องพิจารณาในการตรวจสอบโรงงาน'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC กับ Hypalon: การเปรียบเทียบความทนทาน ความต้านทานรังสียูวี อายุการใช้งาน ตัวเลือกการซ่อม และการพิจารณาต้นทุนสำหรับการใช้งานทางทะเลต่างๆ'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'ดาวน์โหลดเทมเพลตสรุปผลิตภัณฑ์ของเรา กรอกข้อกำหนดของคุณและส่งคืนให้เราเพื่อรับใบเสนอราคาและการประเมินความเป็นไปได้ในสัปดาห์เดียวกัน'
      icon: tabler:template
faqs:
  title: 'คำถามที่พบบ่อย'
  subtitle: 'คำถามทั่วไปเกี่ยวกับผลิตภัณฑ์ กระบวนการผลิต และรูปแบบความร่วมมือของเรา'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'ขั้นต่ำแตกต่างกันไปตามประเภทผลิตภัณฑ์ โดยทั่วไปเรือ SUP จะเริ่มต้นที่ 10 ยูนิตต่อรุ่น บอร์ด SUP ตั้งแต่ 50 ยูนิต ติดต่อทีมขายของเราสำหรับข้อมูลขั้นต่ำเฉพาะผลิตภัณฑ์'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'ใช่. afarer จัดเตรียมการผลิตตัวอย่างเพื่อการประเมินก่อนการผลิตจำนวนมาก ต้นทุนตัวอย่างสามารถต่อรองได้และมักจะเครดิตในใบสั่งผลิตครั้งแรก'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'เงื่อนไขมาตรฐานคือเงินฝาก 30% พร้อมคำสั่งซื้อ 70% ก่อนจัดส่ง ข้อกำหนด LC มีให้สำหรับลูกค้าที่มีคุณสมบัติตามที่กำหนด ติดต่อทีมการเงินของเราเพื่อหารือเกี่ยวกับการเตรียมการ'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'ระยะเวลารอคอยโดยทั่วไป: เรือ SUP 30-45 วัน, กระดาน SUP 20-30 วัน, เรือยาง 25-35 วัน การพัฒนาแบบกำหนดเองจะใช้เวลา 15-30 วันสำหรับการสร้างต้นแบบ'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'การรับรอง CE สำหรับตลาดสหภาพยุโรป, การผลิตที่ได้รับการรับรองจากหน่วยยามฝั่งสหรัฐ, ระบบคุณภาพ ISO, การปฏิบัติตาม BSCI และการปฏิบัติตามข้อกำหนดวัสดุ REACH'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'ใช่. เราให้บริการบรรจุภัณฑ์แบบกำหนดเองพร้อมโลโก้ สี และเอกลักษณ์ของแบรนด์ของคุณ ขั้นต่ำสำหรับบรรจุภัณฑ์แบบกำหนดเองขึ้นอยู่กับประเภทผลิตภัณฑ์'
      icon: tabler:color-swatch
cta:
  title: 'ต้องการความช่วยเหลือในการค้นหาทรัพยากรที่เหมาะสมหรือไม่?'
  subtitle: 'ติดต่อทีมงานของเราเพื่อขอคำแนะนำเฉพาะบุคคลเกี่ยวกับการเลือกผลิตภัณฑ์ ความร่วมมือกับ OEM หรือข้อกำหนดทางเทคนิค'
  actions:
    - variant: primary
      text: 'ติดต่อทีมงานของเรา'
      href: /contact

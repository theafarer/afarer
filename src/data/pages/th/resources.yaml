meta:
  title: ทรัพยากรและไฟล์ดาวน์โหลดสำหรับ B2B | {SITE}
  description: ดาวน์โหลดคู่มือการผลิตแบบ OEM แคตตาล็อกสินค้า รายงานคุณภาพ และเครื่องคำนวณ ROI สำหรับธุรกิจซัพเป่าลม
hero:
  tagline: ศูนย์ทรัพยากรความรู้
  title: เครื่องมือและทรัพยากร<br />สำหรับพันธมิตรธุรกิจ SUP
  subtitle: ดาวน์โหลดคู่มือ OEM แคตตาล็อกผลิตภัณฑ์ รายงานคุณภาพ และใช้เครื่องคำนวณ ROI เพื่อวางแผนการลงทุนในกองเรือ SUP ของคุณ
resources:
  - title: แคตตาล็อกผลิตภัณฑ์ OEM/ODM 2026
    description: ไลน์ผลิตภัณฑ์ครบวงจรพร้อมข้อมูลจำเพาะ ระดับราคา MOQ และตัวเลือกการปรับแต่งสำหรับพันธมิตร B2B
    icon: tabler:file-text
    type: catalog
    link: /media
    cta: ดาวน์โหลดแคตตาล็อก
  - title: คู่มือแบรนด์ SUP แบบ Private Label
    description: คู่มือทีละขั้นตอนสำหรับการเริ่มแบรนด์ SUP ของคุณเอง — ตั้งแต่การวิจัยตลาดและการออกแบบ ไปจนถึงการผลิตและการจัดส่งทั่วโลก
    icon: tabler:book
    type: guide
    link: /news/private-label-sup-oem-guide
    cta: อ่านคู่มือ
  - title: เครื่องคำนวณ ROI สำหรับฝูงเรือ SUP
    description: ประมาณการเงินลงทุนกองเรือ SUP สำหรับรีสอร์ทหรือคลับของคุณ รายได้ที่คาดการณ์ และระยะเวลาคืนทุนด้วยเครื่องคำนวณแบบโต้ตอบของเรา
    icon: tabler:calculator
    type: tool
    link: '#roi-calculator'
    cta: คำนวณ ROI
  - title: รายงานคุณภาพและการรับรอง
    description: เอกสารการรับรอง CE ระบบการจัดการคุณภาพ ISO 9001 ผลการทดสอบการเสื่อมสภาพจากรังสี UV และข้อมูลการทดสอบการคงแรงดัน
    icon: tabler:certificate
    type: report
    link: /evidence
    cta: ดูรายงาน
  - title: โบรชัวร์ศักยภาพโรงงาน
    description: ทัวร์เสมือนจริงภายในโรงงานผลิตขนาด 12,000 m² ของเรา พร้อมรายละเอียดสายการผลิตและกระบวนการควบคุมคุณภาพ
    icon: tabler:building-factory
    type: brochure
    link: /factory
    cta: เยี่ยมชมโรงงาน
  - title: คู่มือรายได้จากกองเรือรีสอร์ท
    description: การวิเคราะห์ผลตอบแทนการลงทุน (ROI) ของฝูงบอร์ด SUP เชิงพาณิชย์ พร้อมโมเดลการตั้งราคา อัตราการใช้งาน และผลลัพธ์กรณีศึกษาจริงจากรีสอร์ทระดับ 5 ดาว
    icon: tabler:chart-bar
    type: guide
    link: /news/commercial-sup-fleet-roi-resorts
    cta: อ่านคู่มือ
cta:
  title: ต้องการการสนับสนุนแบบกำหนดเองหรือไม่?
  subtitle: ติดต่อทีม B2B ของเราเพื่อรับคำแนะนำเฉพาะสำหรับโปรเจกต์ของคุณ
  button: ติดต่อทีมขาย
  link: /contact?source=resources

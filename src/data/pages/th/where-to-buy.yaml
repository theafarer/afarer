  description: ดูวิธีซื้อกระดานพายเรือลมพอน Afarer — ผ่านตัวแทนจำหน่ายอย่างเป็นทางการในประเทศของคุณ หรือโดยตรงจากทีม Afarer
hero:
  tagline: ซื้อได้ที่ไหน
  title: ออกไปทางน้ำกับ SUP Afarer ของคุณ
  subtitle: กระดาน Afarer ไปถึงมือนักพายในกว่า 50 ประเทศ ค้นหาวิธีที่ง่ายที่สุดในการได้กระดานของคุณ — ผ่านตัวแทนจำหน่ายทางการใกล้คุณ หรือสั่งซื้อโดยตรงจากทีม Afarer
channels:
  items:
    - title: ตัวแทนจำหน่ายอย่างเป็นทางการประจำประเทศ
      description: Afarer ทำงานร่วมกับตัวแทนจำหน่ายแบบเอกสิทธิ์ในหลายประเทศ บอกเราว่าคุณพายที่ไหน แล้วเราจะแนะนำผู้แทนจำหน่ายในพื้นที่ของคุณ พร้อมราคาและความพร้อมของสินค้า

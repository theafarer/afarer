    - title: สั่งซื้อโดยตรงจาก Afarer
      description: ยังไม่มีตัวแทนจำหน่ายในประเทศของคุณใช่หรือไม่ ทีม Afarer สามารถจัดการการสั่งซื้อและการจัดส่งโดยตรง เพื่อให้คุณออกไปทางน้ำได้ไม่ว่าคุณจะอยู่ที่ไหน
      cta: สอบถามความพร้อมของสินค้า
      href: /contact/?subject=Where to Buy
form_intro:
  title: สอบถามความพร้อมของสินค้า
  subtitle: ส่งข้อความถึงเราพร้อมระบุประเทศของคุณและกระดานที่คุณสนใจ ทีมของเราจะตอบกลับภายในหนึ่งวันทำการพร้อมข้อมูลผู้แทนจำหน่ายที่ใกล้ที่สุดหรือตัวเลือกการสั่งซื้อโดยตรง
business_note:

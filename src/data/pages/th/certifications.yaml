content_certifications:
  tagline: การรับรองของเรา
  title: ได้รับการรับรองคุณภาพ<br />เป็นที่ยอมรับทั่วโลก
  subtitle: ผลิตภัณฑ์ของ afarer ทุกรายการได้รับการสนับสนุนจากใบรับรองที่แสดงให้เห็นถึงความมุ่งมั่นของเราในด้านคุณภาพ ความปลอดภัย และความรับผิดชอบต่อสิ่งแวดล้อม
  items:
    - title: ผ่านการรับรอง CE
      description: ผลิตภัณฑ์ afarer ทั้งหมดเป็นไปตามข้อกำหนดเครื่องหมาย CE ของยุโรปสำหรับเรือเพื่อการพักผ่อนหย่อนใจ เพื่อให้มั่นใจว่าเป็นไปตามมาตรฐานด้านความปลอดภัย สุขภาพ และการปกป้องสิ่งแวดล้อม
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: ระบบการจัดการคุณภาพของเราได้รับการรับรองมาตรฐาน ISO 9001:2015 ครอบคลุมถึงการออกแบบ การผลิต และการจัดจำหน่ายยานน้ำเป่าลมและอุปกรณ์ทางทะเล
      icon: tabler:clipboard-check
    - title: มีเครื่องหมาย UKCA
      description: ผลิตภัณฑ์ที่จำหน่ายในตลาดสหราชอาณาจักรมีเครื่องหมาย UKCA ซึ่งยืนยันการปฏิบัติตามกฎระเบียบของสหราชอาณาจักรสำหรับอุปกรณ์ทางทะเลและยานน้ำส่วนตัว
      icon: tabler:shield
    - title: ผ่านมาตรฐาน BSCI
      description: afarer ได้รับการตรวจสอบจาก BSCI (Business Social Compliance Initiative) ซึ่งแสดงให้เห็นถึงหลักปฏิบัติด้านการผลิตที่มีจริยธรรม สภาพแรงงานที่เป็นธรรม และความรับผิดชอบในห่วงโซ่อุปทาน
      icon: tabler:heart-handshake
    - title: ผ่านมาตรฐาน REACH
      description: วัสดุทั้งหมดที่ใช้ในผลิตภัณฑ์ afarer เป็นไปตามกฎระเบียบ EU REACH เพื่อความปลอดภัยทางเคมี ทำให้มั่นใจได้ว่าไม่มีสารจำกัดใน PVC, EVA หรือส่วนประกอบของเรา
      icon: tabler:flask
    - title: การทดสอบวัสดุ
      description: ผ้าได้รับการทดสอบความต้านทานแรงดึง ความต้านทานการฉีกขาด การเสื่อมสภาพของรังสียูวี และประสิทธิภาพการแตกร้าวเมื่อเย็น ทุกชุดการผลิตจะถูกสุ่มตัวอย่างและตรวจสอบ
      icon: tabler:test-pipe
content_factory:
  tagline: มาตรฐานโรงงาน
  title: ความเป็นเลิศด้านการผลิต<br />— สร้างขึ้นตามข้อกำหนดเฉพาะ
  subtitle: โรงงานขนาด 12,000 ตร.ม. ของเราดำเนินการภายใต้ระเบียบการควบคุมคุณภาพที่เข้มงวดในทุกขั้นตอนของการผลิต
  list:
    - 'การตรวจสอบวัสดุขาเข้า: วัตถุดิบทั้งหมด ได้แก่ ผ้า PVC, โฟม EVA, กาว และฮาร์ดแวร์ จะถูกทดสอบเทียบกับข้อกำหนดก่อนเข้าสู่กระบวนการผลิต'
    - 'การควบคุมคุณภาพระหว่างกระบวนการผลิต: ทุกขั้นตอนการผลิตมีจุดตรวจสอบ QC ที่มีการจัดทำเอกสาร ความแข็งแรงของรอยเชื่อม การเรียงแนวตะเข็บ การติดตั้งวาล์ว และแรงบิดของอุปกรณ์ประกอบ ได้รับการตรวจสอบในสายการผลิต'
    - 'การทดสอบแรงดัน: ห้องลมยางทุกห้องต้องผ่านการทดสอบแรงดันที่ 1.25 เท่าของแรงดันมาตรฐานเป็นเวลา 24–48 ชั่วโมง โดยแรงดันต้องลดลงไม่เกิน 5% จึงจะผ่านเกณฑ์'
    - 'การตรวจสอบขั้นสุดท้าย: สินค้าที่ผลิตเสร็จแล้วจะได้รับการตรวจสอบความแม่นยำของขนาด ความสวยงามของพื้นผิว ความครบถ้วนของอุปกรณ์เสริม และความสมบูรณ์ของบรรจุภัณฑ์ก่อนการจัดส่ง'
    - 'การตรวจสอบย้อนกลับรายรุ่นการผลิต: ผลิตภัณฑ์ทุกชิ้นมีหมายเลขซีเรียลเชื่อมโยงกับบันทึกของรุ่นการผลิต ทำให้สามารถตรวจสอบย้อนกลับได้อย่างครบถ้วนตั้งแต่วัตถุดิบจนถึงสินค้าสำเร็จรูป'
content_safety:
  tagline: มาตรฐานความปลอดภัยทางทะเล
  title: ปลอดภัยไว้ก่อน<br />— ออกแบบมาเพื่อการทำงานที่เชื่อถือได้
  subtitle: ผลิตภัณฑ์ของ afarer ได้รับการออกแบบและทดสอบเพื่อให้ตรงตามมาตรฐานความปลอดภัยทางทะเลระหว่างประเทศสำหรับการใช้งานเชิงพาณิชย์และสันทนาการ
  items:
    - title: EN ISO 25649
      description: ซัพเป่าลมเป็นไปตามมาตรฐาน EN ISO 25649 ในด้านการก่อสร้าง ความมั่นคง การลอยตัว และความสามารถในการรับน้ำหนัก
      icon: tabler:sailboat
    - title: การปฏิบัติตามข้อกำหนด SOLAS
      description: อุปกรณ์นิรภัยและอุปกรณ์ช่วยชีวิตเป็นไปตามข้อกำหนด SOLAS (Safety of Life at Sea) หากมี
      icon: tabler:lifebuoy

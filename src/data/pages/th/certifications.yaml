hero:
  tagline: การรับรองและมาตรฐาน
  title: การรับรองคุณภาพ<br />และมาตรฐานการปฏิบัติตามข้อกำหนด
  subtitle: การผลิต SUP ของ afarer ได้รับการรับรองตามมาตรฐานความปลอดภัยทางทะเลระหว่างประเทศ ระบบการจัดการคุณภาพ และกฎระเบียบด้านสิ่งแวดล้อม — CE, ISO 9001, UKCA, BSCI และ REACH
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp

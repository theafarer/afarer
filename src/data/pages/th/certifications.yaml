hero:
  tagline: 'การรับรองและมาตรฐาน'
  title: 'การรับรองคุณภาพ<br />และมาตรฐานการปฏิบัติตามข้อกำหนด'
  subtitle: 'ผลิตภัณฑ์ของ afarer ผลิตขึ้นตามมาตรฐานความปลอดภัยทางทะเลระหว่างประเทศ ระบบการจัดการคุณภาพ และกฎระเบียบด้านสิ่งแวดล้อม'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarer quality certifications and compliance documentation
content_certifications:
  tagline: 'การรับรองของเรา'
  title: 'ได้รับการรับรองคุณภาพ<br />เป็นที่ยอมรับทั่วโลก'
  subtitle: 'ผลิตภัณฑ์ของ afarer ทุกรายการได้รับการสนับสนุนจากใบรับรองที่แสดงให้เห็นถึงความมุ่งมั่นของเราในด้านคุณภาพ ความปลอดภัย และความรับผิดชอบต่อสิ่งแวดล้อม'
  items:
    - title: 'CE Certified'
      description: 'ผลิตภัณฑ์ afarer ทั้งหมดเป็นไปตามข้อกำหนดเครื่องหมาย CE ของยุโรปสำหรับเรือเพื่อการพักผ่อนหย่อนใจ เพื่อให้มั่นใจว่าเป็นไปตามมาตรฐานด้านความปลอดภัย สุขภาพ และการปกป้องสิ่งแวดล้อม'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'ระบบการจัดการคุณภาพของเราได้รับการรับรองมาตรฐาน ISO 9001:2015 ครอบคลุมถึงการออกแบบ การผลิต และการจัดจำหน่ายเรือเป่าลมและอุปกรณ์ทางทะเล'
      icon: tabler:clipboard-check
    - title: 'UKCA Marked'
      description: 'ผลิตภัณฑ์ที่จำหน่ายในตลาดสหราชอาณาจักรมีเครื่องหมาย UKCA ซึ่งยืนยันการปฏิบัติตามกฎระเบียบของสหราชอาณาจักรสำหรับอุปกรณ์ทางทะเลและเรือส่วนตัว'
      icon: tabler:shield
    - title: 'BSCI Compliant'
      description: 'afarer ได้รับการตรวจสอบจาก BSCI (Business Social Compliance Initiative) ซึ่งแสดงให้เห็นถึงหลักปฏิบัติด้านการผลิตที่มีจริยธรรม สภาพแรงงานที่เป็นธรรม และความรับผิดชอบในห่วงโซ่อุปทาน'
      icon: tabler:heart-handshake
    - title: 'REACH Compliant'
      description: 'วัสดุทั้งหมดที่ใช้ในผลิตภัณฑ์ afarer เป็นไปตามกฎระเบียบ EU REACH เพื่อความปลอดภัยทางเคมี ทำให้มั่นใจได้ว่าไม่มีสารจำกัดใน PVC, Hypalon หรือส่วนประกอบของเรา'
      icon: tabler:flask
    - title: 'Material Testing'
      description: 'ผ้าได้รับการทดสอบความต้านทานแรงดึง ความต้านทานการฉีกขาด การเสื่อมสภาพของรังสียูวี และประสิทธิภาพการแตกร้าวเมื่อเย็น ทุกชุดการผลิตจะถูกสุ่มตัวอย่างและตรวจสอบ'
      icon: tabler:test-pipe
content_factory:
  tagline: 'มาตรฐานโรงงาน'
  title: 'ความเป็นเลิศด้านการผลิต<br />—สร้างขึ้นตามข้อกำหนดเฉพาะ'
  subtitle: 'โรงงานขนาด 12,000 ตร.ม. ของเราดำเนินการภายใต้ระเบียบการควบคุมคุณภาพที่เข้มงวดในทุกขั้นตอนของการผลิต'
  list:
    - 'Incoming Material Inspection: All raw materials —PVC fabric, Hypalon, aluminum, plywood, adhesives —are tested against specifications before entering production.'
    - 'In-Process Quality Control: Every production stage has documented QC checkpoints. Weld strength, seam alignment, valve installation, and fitting torque are verified inline.'
    - 'Pressure Testing: Every inflatable chamber is pressure-tested at 1.5× rated pressure for 24 hours. Leak rate must be zero for passing grade.'
    - 'Final Inspection: Completed products are inspected for dimensional accuracy, cosmetic finish, accessory completeness, and packaging integrity before shipping.'
    - 'Batch Traceability: Every product carries a serial number linked to production batch records, enabling full traceability from raw material to finished goods.'
content_safety:
  tagline: 'มาตรฐานความปลอดภัยทางทะเล'
  title: 'ปลอดภัยไว้ก่อน<br />—ออกแบบมาเพื่อการทำงานที่เชื่อถือได้'
  subtitle: 'ผลิตภัณฑ์ของ afarer ได้รับการออกแบบและทดสอบเพื่อให้ตรงตามมาตรฐานความปลอดภัยทางทะเลระหว่างประเทศสำหรับการใช้งานเชิงพาณิชย์และสันทนาการ'
  items:
    - title: 'ISO 6185'
      description: 'เรือเป่าลมเป็นไปตามมาตรฐาน ISO 6185 ในด้านการก่อสร้าง ความมั่นคง การลอยตัว และความสามารถในการรับน้ำหนัก'
      icon: tabler:sailboat
    - title: 'ABYC Standards'
      description: 'ระบบไฟฟ้าและระบบเชื้อเพลิงเป็นไปตามมาตรฐาน ABYC (American Boat & Yacht Council) เพื่อการติดตั้งและการทำงานที่ปลอดภัย'
      icon: tabler:bolt
    - title: 'SOLAS Compliance'
      description: 'อุปกรณ์นิรภัยและอุปกรณ์ช่วยชีวิตเป็นไปตามข้อกำหนด SOLAS (Safety of Life at Sea) หากมี'
      icon: tabler:lifebuoy

timeline:
  - year: '2012'
    title: รากฐานการผลิตทางทะเล
    body: afarer เริ่มต้นจากเวิร์กช็อปเรือเป่าลมเฉพาะทางในชิงเต่า ประเทศจีน มุ่งมั่นในงานฝีมือทางทะเลและการผลิตเรือยาง การเริ่มต้นเน้นการสร้างผลิตภัณฑ์เรือเป่าลมที่เชื่อถือได้ผ่านประสบการณ์ทางวิศวกรรมเชิงปฏิบัติและระเบียบวินัยในการผลิต
  - year: '2015'
    title: การส่งออกครั้งแรกและใบรับรอง CE
    body: คำสั่งซื้อส่งออกครั้งแรกไปถึงญี่ปุ่นและเกาหลี ได้รับใบรับรอง CE สำหรับสายผลิตภัณฑ์หลัก ถือเป็นก้าวสำคัญของ afarer สู่ตลาดต่างประเทศ เริ่มให้บริการผู้ใช้เชิงพาณิชย์และสันทนาการนอกประเทศจีน
  - year: '2018'
    title: ขยายโรงงาน
    body: ย้ายไปยังโรงงานผลิตขนาด 12,000 ตร.ม. เพิ่มสายการผลิตเชื่อม RF และกำลังการผลิตดรอปสติทช์ ทำให้สามารถผลิตในขนาดใหญ่ขึ้นและพัฒนาระบบควบคุมคุณภาพที่ดีขึ้น
  - year: '2020'
    title: ก่อตั้งศูนย์วิจัยและพัฒนา
    body: เปิดศูนย์วิจัยและพัฒนาเฉพาะทางพร้อมห้องปฏิบัติการผ้า PVC ถังทดสอบอุทกพลศาสตร์ และสตูดิโอจำลอง CAD/FEA ขยายการพัฒนาผลิตภัณฑ์เพื่อเน้นโครงสร้างน้ำหนักเบา ความทนทานที่เพิ่มขึ้น และการออกแบบที่ยึดผู้ใช้เป็นศูนย์กลาง
  - year: '2022'
    title: การรับรองและการเติบโตระดับโลก
    body: ได้รับการรับรอง ISO 9001 ขยายเป็นวิศวกรวิจัยและพัฒนา 14 คนและพนักงานกว่า 200 คน ผลิตภัณฑ์ถึงมือลูกค้าทั่วยุโรป อเมริกา และเอเชียแปซิฟิกผ่านความร่วมมือกับตัวแทนจำหน่ายและพันธมิตร OEM
  - year: '2024'
    title: สตูดิโอออกแบบและนวัตกรรม
    body: เปิดตัวสตูดิโอออกแบบและนวัตกรรมแบบครบวงจรสำหรับโปรเจกต์ ODM ที่กำหนดเอง ตั้งแต่แนวคิดจนถึงการผลิต เสริมความแข็งแกร่งด้านการใช้งานทางทะเลระดับมืออาชีพ รวมถึงการประกวดราคากู้ภัย เชิงพาณิชย์ และภาครัฐ
  - year: '2026'
    title: สร้างอนาคตแห่งการสำรวจทางน้ำ
    body: วันนี้ afarer ยังคงพัฒนาเรือเป่าลม ระบบ SUP และโซลูชันทางทะเลที่ปรับแต่งได้ — เชื่อมโยงผู้คนและองค์กรกับผืนน้ำทั่วโลก ให้บริการกว่า 50 ประเทศ กำลังการผลิตกว่า 15,000 หน่วยต่อปี
content_founding:
  tagline: จุดเริ่มต้น
  title: เกิดบนริมน้ำ
  subtitle: 'afarer เริ่มต้นในเวิร์กช็อปชายฝั่งในชิงเต่าด้วยเรือลำเดียวและวิสัยทัศน์: เพื่อสร้างเรือเป่าลมที่สามารถทนต่อสภาพแวดล้อมทางทะเลจริงได้'
  paragraphs:
    - ในปี 2012 ผู้ก่อตั้งของเราเห็นช่องว่างในตลาด — เรือเป่าลมส่วนใหญ่มีราคาย่อมเยาแต่ไม่น่าเชื่อถือ หรือมีคุณภาพสูงแต่แพงเกินไป พวกเขาเชื่อว่ามีพื้นที่สำหรับผู้ผลิตที่สามารถส่งมอบทั้งคุณภาพและความคุ้มค่า
    - ตัวเรือลำแรกถูกสร้างด้วยมือ ทดสอบในน่านน้ำท้องถิ่น และปรับปรุงตามข้อเสนอแนะจริงจากชาวประมงและผู้ประกอบการเชิงพาณิชย์รายย่อย วงจรข้อเสนอแนะนี้ — สร้าง ทดสอบ รับฟัง ปรับปรุง — ยังคงเป็นแกนกลางของปรัชญาทางวิศวกรรมของเราจนถึงทุกวันนี้
    - ภายในปี 2015 ชื่อเสียงแพร่กระจายออกไปนอกชิงเต่า ตัวแทนจำหน่ายระหว่างประเทศเริ่มขอตัวอย่าง สิ่งที่เริ่มต้นจากเวิร์กช็อปท้องถิ่นกำลังกลายเป็นซัพพลายเออร์ระดับโลก
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: เวิร์กช็อปการผลิตยุคแรกของ afarer และการผลิต
content_growth:
  tagline: การเติบโตและนวัตกรรม
  title: จากเวิร์กช็อปสู่สิ่งอำนวยความสะดวก 12,000 ตร.ม.
  subtitle: การลงทุนอย่างต่อเนื่องในบุคลากร อุปกรณ์ และกระบวนการ ได้เปลี่ยน afarer ให้เป็นโรงงานผลิตทางทะเลที่ทันสมัย
  paragraphs:
    - เมื่อความต้องการเพิ่มขึ้น สิ่งอำนวยความสะดวกของเราก็ขยายตามไปด้วย เราขยายจากเวิร์กช็อปเล็กๆ สู่โรงงานขนาด 12,000 ตร.ม. พร้อมสายการผลิตเฉพาะสำหรับเรือ SUP เรือเป่าลม บอร์ด SUP และอุปกรณ์เสริม
    - เราลงทุนในเครื่องตัด CNC อุปกรณ์เชื่อมความถี่สูง สายผลิตดรอปสติทช์ และแท่นทดสอบที่ครอบคลุม — ทำให้เราควบคุมทุกด้านของคุณภาพการผลิตได้
    - ปัจจุบันทีมงานกว่า 200 คนของเราประกอบด้วยวิศวกรทางทะเล นักวิทยาศาสตร์วัสดุ ผู้เชี่ยวชาญด้านควบคุมคุณภาพ และช่างฝีมือผู้ชำนาญ — หลายคนอยู่กับ afarer มาตั้งแต่วันแรกเริ่ม
philosophy:
  tagline: ปรัชญาของแบรนด์
  title: สร้างสรรค์อิสระบนผืนน้ำด้วยวิศวกรรม
  body: อิสระบนผืนน้ำไม่ใช่แค่เรื่องการเคลื่อนที่ มันหมายถึงการค้นพบสถานที่ใหม่ๆ สร้างประสบการณ์กลางแจ้ง เชื่อมโยงผู้คนกับธรรมชาติ และทำให้ภารกิจทางอาชีพเป็นจริง วิศวกรรมทำให้อิสระนั้นเป็นไปได้
  pillars:
    - title: ความน่าเชื่อถือต้องมาก่อน
      body: สภาพแวดล้อมทางน้ำต้องการความไว้วางใจ ผลิตภัณฑ์ afarer ถูกออกแบบมาโดยยึดหลักความเสถียร ความทนทาน ความปลอดภัย และประสิทธิภาพที่สม่ำเสมอ
    - title: การออกแบบที่ยึดมนุษย์เป็นศูนย์กลาง
      body: ผลิตภัณฑ์ควรรับใช้ผู้คน ไม่ใช่เทคโนโลยี ทุกการตัดสินใจออกแบบเริ่มต้นจากการทำความเข้าใจว่าผู้คนใช้เรืออย่างไร สำรวจที่ไหน และเผชิญกับความท้าทายอะไรบ้าง
    - title: การสำรวจที่เข้าถึงได้
      body: ผืนน้ำไม่ควรเป็นของผู้เชี่ยวชาญเท่านั้น afarer สร้างอุปกรณ์ที่ช่วยให้ผู้คนมากขึ้นสามารถสัมผัสประสบการณ์แม่น้ำ ทะเลสาบ มหาสมุทร และสภาพแวดล้อมชายฝั่งได้อย่างปลอดภัย
    - title: นวัตกรรมอย่างต่อเนื่อง
      body: นวัตกรรมไม่ใช่แค่การสร้างผลิตภัณฑ์ใหม่ มันคือการปรับปรุงทุกรายละเอียด — วัสดุ โครงสร้าง การผลิต และประสบการณ์ผู้ใช้
engineeringDna:
  tagline: ดีเอ็นเอทางวิศวกรรม
  title: afarer สร้างผลิตภัณฑ์อย่างไร
  areas:
    - title: วัสดุศาสตร์
      body: afarer มุ่งเน้นการเลือกวัสดุที่เหมาะสมสำหรับสภาพแวดล้อมทางทะเลที่แตกต่างกัน ข้อพิจารณาหลักรวมถึงความทนทานต่อการเสียดสี ความทนทานต่อรังสี UV ความเสถียรของแรงดัน และความทนทานระยะยาว
      items:
        - ความทนทานต่อการเสียดสี
        - ความทนทานต่อรังสี UV
        - ความเสถียรของแรงดัน
        - ความทนทานระยะยาว
    - title: วิศวกรรมโครงสร้าง
      body: เรือเป่าลมต้องการสมดุลที่แม่นยำระหว่างความแข็งแกร่ง น้ำหนัก การพกพา และความเสถียร วิศวกรรมของ afarer มุ่งเน้นการปรับปัจจัยเหล่านี้ให้เหมาะสมผ่านเทคโนโลยีแกนดรอปสติทช์และการสร้างตะเข็บขั้นสูง
      items:
        - ความแข็งแกร่ง
        - การปรับน้ำหนักให้เหมาะสม
        - การพกพา
        - ความเสถียร
    - title: ความแม่นยำในการผลิต
      body: 'ทุกผลิตภัณฑ์ผ่านกระบวนการควบคุม: การเตรียมวัสดุ การตัดแม่นยำ การเชื่อมและการยึดติด การประกอบ การตรวจสอบคุณภาพ และการตรวจสอบประสิทธิภาพ'
      items:
        - การเตรียมวัสดุ
        - การตัดแม่นยำ
        - การเชื่อมและการยึดติด
        - การประกอบและควบคุมคุณภาพ
    - title: วิศวกรรมตามสถานการณ์ผู้ใช้
      body: ผลิตภัณฑ์ถูกพัฒนาตามการใช้งานจริง — สันทนาการ ผจญภัย และใช้งานมืออาชีพ — เพื่อให้แน่ใจว่าแต่ละการออกแบบตอบสนองความต้องการเฉพาะของสภาพแวดล้อมที่ตั้งใจไว้
      items:
        - สันทนาการ
        - ผจญภัย
        - มืออาชีพ
        - เชิงพาณิชย์
trustSignals:
  tagline: สัญญาณแห่งความไว้วางใจ
  title: ทำไม afarer จึงเป็นพันธมิตรที่เชื่อถือได้
  manufacturing:
    title: ขีดความสามารถในการผลิต
    body: โรงงานผลิตขนาด 12,000 ตร.ม. พร้อมพนักงานฝีมือดีกว่า 200 คนและวิศวกรวิจัยและพัฒนา 14+ คน ระบบบริหารคุณภาพที่ได้รับการรับรอง ISO 9001 กำลังการผลิตเรือเป่าลมกว่า 15,000 หน่วยต่อปี ให้บริการกว่า 50 ประเทศ
    stats:
      - label: ขนาดสิ่งอำนวยความสะดวก
        value: 12,000 m²
      - label: กำลังคน
        value: 200+
      - label: วิศวกรวิจัยและพัฒนา
        value: 14+
      - label: กำลังการผลิตต่อปี
        value: 15,000+
  quality:
    title: ความมุ่งมั่นด้านคุณภาพ
    body: ตั้งแต่การตรวจสอบวัสดุจนถึงการทดสอบขั้นสุดท้าย afarer ดำเนินกระบวนการคุณภาพอย่างเป็นระบบเพื่อส่งมอบผลิตภัณฑ์ทางทะเลที่เชื่อถือได้ ทุกหน่วยต้องผ่านการทดสอบแรงดัน การตรวจสอบตะเข็บ และการตรวจสอบประสิทธิภาพก่อนจัดส่ง
    items:
      - CE Certified — ผลิตภัณฑ์ทั้งหมดเป็นไปตามมาตรฐานความปลอดภัยของยุโรป
      - ISO 9001:2015 — ระบบบริหารคุณภาพได้รับการรับรอง
      - UKCA Marked — สอดคล้องกับตลาดสหราชอาณาจักร
      - FCC Compliant — สอดคล้องกับส่วนประกอบอิเล็กทรอนิกส์ของสหรัฐอเมริกา
  global:
    title: การปรากฏตัวระดับโลก
    body: afarer ให้บริการลูกค้าทั่วตลาดโลกหลายแห่ง สนับสนุนตัวแทนจำหน่าย แบรนด์กลางแจ้ง และผู้ใช้ทางทะเลมืออาชีพในกว่า 50 ประเทศทั่วทั้งยุโรป เอเชียแปซิฟิก อเมริกา ตะวันออกกลาง และแอฟริกา
comparison:
  tagline: การวางตำแหน่งแบรนด์
  title: afarer ในตลาด
  position: แบรนด์สันทนาการทางทะเลที่เน้นวิศวกรรม ผสานความเชี่ยวชาญด้านการผลิตเรือเป่าลมเข้ากับความสามารถ OEM/ODM โซลูชันที่กำหนดเอง และประสบการณ์การผลิตที่ลึกซึ้ง
  strengths:
    - ความเชี่ยวชาญด้านวิศวกรรมเรือเป่าลม
    - ความสามารถในการผลิต OEM/ODM ครบวงจร
    - การพัฒนาผลิตภัณฑ์และการออกแบบที่กำหนดเอง
    - โรงงานผลิตขนาด 12,000 ตร.ม. ที่ได้รับการรับรอง ISO 9001
  bestFor:
    - ผู้ใช้สันทนาการกลางแจ้งที่ต้องการเรือเป่าลมที่เชื่อถือได้
    - ผู้ประกอบการทางทะเลที่ต้องการอุปกรณ์ระดับพาณิชย์
    - พันธมิตรแบรนด์ที่ต้องการการผลิต OEM/ODM
    - องค์กรกู้ภัยและลาดตระเวนมืออาชีพ
cta:
  title: พร้อมเป็นพันธมิตรกับผู้ผลิต<br />ที่ใส่ใจเรื่องคุณภาพแล้วหรือยัง?

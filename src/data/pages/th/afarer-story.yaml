meta:
  title: 'เรื่องราวของเรา — ผู้ผลิตบอร์ด SUP แบบสูบลมและเรือพอง | {SITE}'
  description: 'จากเวิร์กช็อปริมชายฝั่งสู่ผู้ผลิตเรือระดับโลก: เรื่องราวของ afar เกี่ยวกับวิศวกรรมและอิสรภาพบนผืนน้ำ พร้อมโรงงานที่ได้รับใบรับรองขนาด 12,000 ตร.ม.'

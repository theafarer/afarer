hero:
  tagline: เรื่องราวของเรา
  title: afarer — สร้างสรรค์อิสระบนผืนน้ำด้วยวิศวกรรม
  subtitle: จากเวิร์กช็อปชายฝั่งสู่ผู้ผลิตทางทะเลระดับโลก — การเดินทางของเราสร้างขึ้นจากความเชื่อที่มั่นคงว่า เรือควรถูกออกแบบทางวิศวกรรมอย่างจริงจัง เพราะมันสำคัญจริงๆ
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: โรงงาน afarer และสิ่งอำนวยความสะดวกการผลิตทางทะเลในชิงเต่า

hero:
  tagline: 'พันธมิตรและการจัดจำหน่าย'
  title: 'ร่วมเป็นพันธมิตรที่ห่างไกล<br />—เครือข่ายการจัดจำหน่ายทั่วโลก'
  subtitle: "Join afarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries."
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: 'โปรแกรมพันธมิตร'
  title: 'โปรแกรมพันธมิตร<br />สร้างขึ้นเพื่อการเติบโต'
  subtitle: 'ไม่ว่าคุณจะเป็นผู้จัดจำหน่าย ตัวแทนจำหน่าย หรือหุ้นส่วนแบรนด์ afarer เสนอโปรแกรมที่ออกแบบมาเพื่อสนับสนุนธุรกิจของคุณ'
  columns: 3
  items:
    - title: 'Distributor Program'
      description: 'การกระจายอาณาเขตพิเศษด้วยการกำหนดราคาตามปริมาณ การสนับสนุนด้านการตลาด และการเข้าถึงโรงงานโดยตรง ข้อผูกพันขั้นต่ำที่กำหนดตามขนาดอาณาเขต'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'การกำหนดราคาของตัวแทนจำหน่ายโดยตรง การฝึกอบรมผลิตภัณฑ์ เอกสารทางการตลาด และการสนับสนุนการรับประกันสำหรับร้านค้าปลีกและร้านค้าออนไลน์'
      icon: tabler:building-store
    - title: 'OEM/ODM Partnership'
      description: 'การผลิต OEM และ ODM แบบครบวงจรพร้อมการสร้างแบรนด์ บรรจุภัณฑ์ และข้อกำหนดเฉพาะของผลิตภัณฑ์ที่กำหนดเอง จากแนวคิดสู่คอนเทนเนอร์'
      icon: tabler:certificate
    - title: 'Brand Partnership'
      description: 'การสร้างแบรนด์ร่วม ฉลากส่วนตัว และโปรแกรมโมเดลพิเศษสำหรับแบรนด์ที่มีชื่อเสียงในพื้นที่สันทนาการทางทะเลและกลางแจ้ง'
      icon: tabler:stars
    - title: 'Government & Institutional'
      description: 'โปรแกรมซัพพลายเออร์ที่ต้องการสำหรับหน่วยงานภาครัฐ หน่วยยามชายฝั่ง ทหาร และองค์กรด้านมนุษยธรรม เอกสารพร้อมประกวดราคา.'
      icon: tabler:building-community
    - title: 'Resort & Rental Partner'
      description: 'การกำหนดราคากลุ่มยานพาหนะ คุณภาพที่สม่ำเสมอ และการสร้างแบรนด์ที่กำหนดเองสำหรับรีสอร์ท ศูนย์ดำน้ำ และการดำเนินการให้เช่าทั่วโลก'
      icon: tabler:sun
content_benefits:
  tagline: 'ทำไมต้องเป็นพันธมิตรกับเรา'
  title: 'เหตุใดพันธมิตรจึงเลือกห่างไกลกว่า'
  subtitle: 'พันธมิตรของเราได้รับประโยชน์จากความสามารถในการผลิตที่แท้จริง คุณภาพที่สม่ำเสมอ และการสนับสนุนที่ตอบสนอง'
  list:
    - 'Direct Factory Access: Work directly with our manufacturing team —no middlemen. Get faster responses, better pricing, and full visibility into production.'
    - 'Customization Ready: Brand your products with custom colors, logos, packaging, and specifications. Minimum order quantities tailored to your market.'
    - 'Quality Guaranteed: ISO 9001 certified production with CE, UKCA, and BSCI compliance. Every product tested before shipping.'
    - 'Global Logistics: Shipping from Qingdao, China with FOB, CIF, and DDP options. US warehouse in Montclair, CA for North American distribution.'
    - 'Marketing Support: Product catalogs, photography, technical documentation, and digital assets to support your sales efforts.'
    - 'Training & Support: Product training for your sales team, technical support for your customers, and warranty service coordination.'
content_process:
  tagline: 'วิธีการเป็นพันธมิตร'
  title: 'กระบวนการหุ้นส่วนที่เรียบง่าย'
  subtitle: 'กระบวนการเป็นพันธมิตรของเรานั้นตรงไปตรงมา — ออกแบบมาเพื่อช่วยให้คุณขายผลิตภัณฑ์ที่ห่างไกลได้รวดเร็วยิ่งขึ้น'
  items:
    - title: 'Step 1: Submit Application'
      description: 'กรอกแบบฟอร์มใบสมัครพันธมิตรของเราโดยระบุโปรไฟล์บริษัท ตลาดเป้าหมาย และความสนใจในผลิตภัณฑ์ของคุณ'
    - title: 'Step 2: Qualification Review'
      description: 'ทีมพันธมิตรของเราจะตรวจสอบใบสมัครของคุณและติดต่อคุณภายใน 3 วันทำการเพื่อหารือเกี่ยวกับโอกาสต่างๆ'
    - title: 'Step 3: Agreement & Setup'
      description: 'ลงนามข้อตกลงความร่วมมือ ตั้งค่าบัญชีของคุณ และรับราคาพันธมิตร เอกสารทางการตลาด และตัวอย่างผลิตภัณฑ์'
    - title: 'Step 4: Training & Launch'
      description: 'มีการฝึกอบรมผลิตภัณฑ์ การสนับสนุนการขาย และเอกสารทางการตลาด คุณพร้อมที่จะเริ่มขายแล้ว'
cta:
  title: 'พร้อมที่จะเป็นพันธมิตรที่ห่างไกลแล้วหรือยัง?'
  subtitle: 'สมัครเป็นพันธมิตรและทีมงานของเราจะตอบกลับภายใน 3 วันทำการ'
  actions:
    - variant: primary
      text: 'สมัครเป็นหุ้นส่วน'
      href: /contact
    - text: View our products
      href: /products

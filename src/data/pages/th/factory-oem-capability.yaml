meta:
  title: 'การผลิต OEM และแบรนด์ส่วนตัว | {SITE}'
  description: 'จากแนวคิดสู่ตู้คอนเทนเนอร์: ปรับแต่งทุกรายละเอียดของซีรีส์ SUP แบบสูบลมของคุณ บริการ OEM/ODM ครบวงจรสำหรับแบรนด์พายบอร์ดส่วนตัว'
  keywords:
    - 'การผลิต SUP OEM'
    - 'พายบอร์ดแบรนด์ส่วนตัว'
    - 'SUP แบบสูบลม OEM'
    - 'โรงงาน SUP ตามสั่ง'
hero:
  tagline: การผลิตแบบ OEM/ODM
  title: การผลิตแบบ OEM และแบรนด์ส่วนตัว (Private Label)
  subtitle: From concept to container — customize every detail of your inflatable watercraft line
intro: afarer ให้บริการ OEM และ ODM ครบวงจรสำหรับแบรนด์ ผู้จัดจำหน่าย และหน่วยงานภาครัฐทั่วโลก ด้วยประสบการณ์ส่งออกกว่า 10 ปี และโรงงานที่ได้รับการรับรอง ISO 9001 และ BSCI ขนาด 12,000 ตร.ม. เราดูแลทุกอย่างตั้งแต่ออกแบบผลิตภัณฑ์และพัฒนาแม่พิมพ์ไปจนถึงการผลิตเต็มรูปแบบ บรรจุภัณฑ์ และโลจิสติกส์
highlight:
  - value: 10+
    label: ประสบการณ์ด้าน OEM หลายปี
    detail: ตั้งแต่ปี 2012
  - value: 50+
    label: ประเทศที่ส่งออก
    detail: ครอบคลุมทั่วโลก
  - value: 200+
    label: โครงการสั่งผลิตตามข้อกำหนดที่ส่งมอบแล้ว
    detail: ในทุกสายผลิตภัณฑ์
  - value: 30–45
    label: ระยะเวลาการผลิตมาตรฐาน (วัน)
    detail: ตั้งแต่ใบสั่งซื้อ (PO) ถึงจุดส่งมอบ (FOB)
services:
  - title: การออกแบบและวิศวกรรมผลิตภัณฑ์
    description: ทีม R&D ภายในของเราทำงานร่วมกับแนวคิดหรือสเปกของคุณเพื่อพัฒนาแบบ CAD โมเดล 3D และต้นแบบ เรามีบริการออกแบบแม่พิมพ์ ปรับแต่งรูปทรงตัวเรือ และให้คำแนะนำการเลือกวัสดุ
  - title: การสร้างแบรนด์และการออกแบบกราฟิกตามความต้องการ
    description: การพิมพ์ดิจิทัลสีเต็มรูปแบบ การพิมพ์สกรีน การปั๊มนูน และตัวเลือกฉลาก เราพัฒนากราฟิกบนดาดฟ้าบอร์ดตามแบรนด์ การพิมพ์แบรนด์บนท่อ และบรรจุภัณฑ์พร้อมจำหน่ายปลีก
  - title: การปรับแต่งวัสดุและข้อกำหนดจำเพาะ
    description: เลือกได้จาก PVC (แบบมาตรฐาน เป็นมิตรต่อสิ่งแวดล้อม หน่วงไฟ), Hypalon/CSM, โครงสร้าง drop-stitch และแบบผสม พร้อมตัวเลือกสีท่อยาง น้ำหนักผ้า และการเสริมความแข็งแรงตามความต้องการ
  - title: บรรจุภัณฑ์และโลจิสติกส์
    description: บรรจุภัณฑ์ค้าปลีกแบบกำหนดเอง กล่องแบรนด์ส่วนตัว (private-label) การแพ็กแบบสุญญากาศ การจัดวางบนพาเลท และการบรรจุตู้คอนเทนเนอร์ รองรับเงื่อนไขการจัดส่งแบบ FOB ชิงเต่า, CIF หรือ DDP
moq_table:
  - product: บอร์ด SUP แบบเป่าลม
    standard_moq: 5–10 units
    custom_moq: มากกว่า 200 ยูนิต
    lead_time: 30–45 วัน
  - product: เสื้อชูชีพและอุปกรณ์ความปลอดภัย
    standard_moq: 100–200 ชิ้น
    custom_moq: มากกว่า 1,000 ลำ
    lead_time: 20–30 วัน
why_us:
  - title: การบูรณาการแนวตั้ง (Vertical Integration)
    description: เราเป็นเจ้าของโรงงาน แม่พิมพ์ และห่วงโซ่อุปทานของเราเอง — ไม่มีคนกลาง ไม่มีผู้รับเหมาช่วง ทำให้เราควบคุมคุณภาพ ต้นทุน และกำหนดเวลาส่งมอบได้ด้วยตนเอง
  - title: การรับรองแบบคู่
    description: การรับรองระบบบริหารจัดการคุณภาพ ISO 9001 และการรับรองการปฏิบัติตามมาตรฐานสังคม BSCI รายงานการตรวจสอบโรงงานพร้อมให้บริการตามคำขอ
  - title: การปฏิบัติตามข้อกำหนด CE
    description: รุ่นมาตรฐานทุกรุ่นได้รับการรับรอง CE 2013/53/EU ส่วนรุ่นที่ปรับแต่งตามความต้องการสามารถขอการรับรอง CE ได้ผ่านกระบวนการที่วางไว้ของเรา
  - title: MOQ ต่ำ
    description: เริ่มต้นเพียง 5 ลำสำหรับรุ่นมาตรฐาน เราช่วยให้แบรนด์น้องใหม่เปิดตัวได้โดยไม่ต้องแบกรับสต็อกสินค้ามากเกินไป

meta:
  title: วิธีเลือกความหนาของบอร์ด SUP — บทวิเคราะห์ทางวิศวกรรม | {SITE}
  description: 'คู่มือทางเทคนิคว่าด้วยความหนาของบอร์ด SUP แบบเป่าลม: บอร์ดขนาด 4", 5" และ 6" แตกต่างกันอย่างไรในด้านความแข็ง น้ำหนัก ความมั่นคง การคงทิศทาง และสมรรถนะ พร้อมคำแนะนำความหนาที่เหมาะสมสำหรับการทัวร์ริ่ง โยคะ เซิร์ฟ แข่ง และการพายทั่วไป'
back_text: กลับไปยังงานวิจัย
hero:
  tagline: วิศวกรรม
  title: วิธีเลือกความหนาของบอร์ด SUP — การวิเคราะห์ทางวิศวกรรม
  subtitle: ใช้เวลาอ่าน 6 นาที
content_html: >
  <h2>ความหนามาตรฐานสามระดับ</h2>


  <h3>4" (10 ซม.) – ทัวร์ริ่ง &amp; ประสิทธิภาพ</h3>

  <ul>
    <li>ความแข็งแกร่งสูงสุด – โค้งงอน้อยลงเมื่อรับน้ำหนัก</li>
    <li>น้ำหนักเบาที่สุด – ใช้วัสดุและปริมาณอากาศน้อยลง</li>
    <li>ควบคุมทิศทางดีเยี่ยม – ลดการโยกซ้ายขวา</li>
    <li>เร็วที่สุด – แรงต้านลดลง ร่อนไถลง่ายขึ้น</li>
    <li>เหมาะสำหรับ: ทัวร์ริ่ง แข่งขัน พายออกกำลังกาย และนักพายที่มีประสบการณ์</li>
  </ul>


  <h3>5" (12.7 ซม.) – อเนกประสงค์</h3>

  <ul>
    <li>ความแข็งแกร่งดี – สัดส่วนความยืดหยุ่นต่อความแข็งที่สมดุล</li>
    <li>น้ำหนักปานกลาง – ใช้วัสดุมาตรฐาน</li>
    <li>ความมั่นคงปฐมภูมิและทุติยภูมิดีเยี่ยม</li>
    <li>เหมาะสำหรับ: การพายเพื่อพักผ่อนหย่อนใจ ผู้เริ่มต้น และการใช้งานทั่วไปในทะเลสาบและแม่น้ำ</li>
  </ul>


  <h3>6" (15.2 ซม.) – ความมั่นคง &amp; โยคะ</h3>

  <ul>
    <li>ความมั่นคงปฐมภูมิสูงสุด – แรงลอยตัวมหาศาล</li>
    <li>หนักที่สุด – ใช้วัสดุ PVC มากขึ้น ปริมาณอากาศมากขึ้น</li>
    <li>ช้าที่สุด – แรงต้านมากขึ้น รักษาการร่อนไถลได้ยากขึ้น</li>
    <li>เหมาะสำหรับ: โยคะ/ฟิตเนส นักพายน้ำหนักมาก (100+ กก.) และสภาพน้ำคลื่นลมแรงมาก</li>
  </ul>


  <h2>การวิเคราะห์ทางวิศวกรรม</h2>

  <p>ความแข็งของเรือยาง SUP ขึ้นอยู่กับแรงดันอากาศภายในและโมเมนต์ความเฉื่อยของหน้าตัดของบอร์ด ที่แรงดัน 20 PSI บอร์ด 4" จะโค้งงอเมื่อรับน้ำหนักน้อยกว่าบอร์ด 6" ที่มีความกว้างและความยาวเท่ากันประมาณ 30% ความมั่นคงปฐมภูมิมาจากความกว้างแนวน้ำและแรงลอยตัว
  ส่วนความมั่นคงทุติยภูมิขึ้นอยู่กับรูปทรงขอบข้างและความกว้างของบอร์ด</p>


  <h2>ความหนาตามน้ำหนักนักพาย</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">น้ำหนักนักพาย</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">ความหนาที่แนะนำ</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">ต่ำกว่า 65 กก. (143 ปอนด์)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 กก. (143 – 198 ปอนด์)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 กก. (198 – 253 ปอนด์)</td><td class="p-3 border">5" หรือ 6"</td></tr>
      <tr><td class="p-3 border">มากกว่า 115 กก. (253 ปอนด์)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>ข้อแลกเปลี่ยนระหว่างความหนากับ PSI</h2>

  <p>ความเข้าใจผิดที่พบบ่อยคือการเพิ่ม PSI จะชดเชยความหนาที่มากเกินไปได้ แต่ที่ 25 PSI บอร์ด 6" กลับโค้งงอมากกว่าบอร์ด 4" ที่ 15 PSI เนื่องจากโมเมนต์ความเฉื่อยเชิงเรขาคณิตเป็นตัวกำหนดหลักของสมการความแข็ง สำหรับนักพายที่เน้นประสิทธิภาพ
  บอร์ดที่บางกว่าที่แรงดันต่ำกว่ายังให้ผลงานดีกว่าบอร์ดที่หนากว่าที่แรงดันสูงกว่า</p>


  <h2>กลุ่มผลิตภัณฑ์ Afarer</h2>

  <ul>
    <li><strong>บอร์ด 4":</strong> ซีรีส์ Cheetah Touring – เรือ SUP ทัวร์ริ่งขนาด 12' x 30" x 4" สำหรับการพายออกกำลังกายและพายระยะไกล</li>
    <li><strong>บอร์ด 5":</strong> ซีรีส์ Cheetah All-Round – ขนาด 10'6" x 32" x 5" สำหรับการใช้งานเพื่อการพักผ่อน</li>
    <li><strong>บอร์ด 6":</strong> ซีรีส์ Cheetah Ultra-Stable – ขนาด 10' x 34" x 6" สำหรับโยคะ นักพายรูปร่างใหญ่ และใช้เป็นแท่นถ่ายภาพ</li>
  </ul>

  <p>บอร์ดทุกรุ่นใช้แกน drop-stitch 1,680 DTEX ที่แรงดันพิกัด 20 PSI และลามิเนต PVC 1.2 มม.</p>

features3_solutions:
  tagline: โซลูชันตามประเภทธุรกิจ
  title: SUP ที่ออกแบบมาเพื่อวัตถุประสงค์เฉพาะ<br />สำหรับธุรกิจของคุณ
  isBeforeContent: false
  columns: 2
  items:
    - title: รีสอร์ทและโรงแรม
      description: โปรแกรมฝูงซัพครบวงจรสำหรับธุรกิจโรงแรม — บอร์ดที่ทนทาน การสร้างแบรนด์เฉพาะ และการสนับสนุนการฝึกอบรมพนักงาน
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: ชมรมพายเรือ
      description: ฝูงเรือ SUP ที่เชื่อถือได้สำหรับชมรมพายเรือ โปรแกรมสอนพาย และธุรกิจสมาชิก — บอร์ดเกรดเชิงพาณิชย์ในราคาพิเศษสำหรับชมรม
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: ผู้ประกอบการธุรกิจให้เช่า
      description: บอร์ด SUP ที่ใช้งานหมุนเวียนหนัก ออกแบบทางวิศวกรรมสำหรับการให้เช่ารายวัน ทนรังสี UV แห้งเร็ว ซ้อนกันได้ — ออกแบบมาเพื่อรองรับการใช้งานเช่าที่หนักหน่วง
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: พันธมิตรค้าปลีก
      description: ขายแบรนด์ SUP ที่เติบโตเร็วที่สุดในตลาดของคุณ พร้อมกลุ่มผลิตภัณฑ์ครบทั้งไลน์ สื่อการตลาด บริการดรอปชิปปิ้ง และอัตรากำไรที่แข่งขันได้
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: ตัวแทนจำหน่าย
      description: พื้นที่ทำการตลาดแบบเอกสิทธิ์ กลุ่มผลิตภัณฑ์ครบวงจร และการดูแลบัญชีโดยเฉพาะ เข้าร่วมเครือข่ายจัดจำหน่ายทั่วโลกของเราในกว่า 50 ประเทศ
      icon: tabler:world
      link: /solutions/distributors
    - title: สร้างแบรนด์ของคุณเอง
      description: การผลิต SUP แบบ OEM/ODM ครบวงจร — การออกแบบ การทำต้นแบบ การผลิตจำนวนมาก และโลจิสติกส์ เปิดตัวแบรนด์ของคุณกับ Afarer
      icon: tabler:package
      link: /solutions/build-your-own-brand
cta:
  title: ไม่แน่ใจว่าโซลูชันใดเหมาะกับความต้องการของคุณ?
  subtitle: อธิบายลักษณะการใช้งานของคุณให้ทีมงานของเราทราบ แล้วเราจะแนะนำการกำหนดค่าที่เหมาะสม
  actions:

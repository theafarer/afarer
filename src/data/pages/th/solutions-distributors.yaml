meta:
  title: โปรแกรมพันธมิตรตัวแทนจำหน่าย SUP | {SITE}
  description: เข้าร่วมเครือข่ายการจัดจำหน่ายระดับโลกของ afarer พื้นที่จำหน่ายแบบเอกสิทธิ์ พอร์ตโฟลิโอผลิตภัณฑ์ที่ครบครัน ราคาขายส่งที่แข่งขันได้ และการบริหารจัดการบัญชีลูกค้าโดยเฉพาะ
hero:
  tagline: ตัวแทนจำหน่าย
  title: เข้าร่วมเครือข่ายตัวแทนจำหน่าย<br />ทั่วโลกของเรา
  subtitle: พื้นที่จัดจำหน่ายแบบเอกสิทธิ์ พอร์ตโฟลิโอผลิตภัณฑ์ที่ครบครัน การสนับสนุนระดับโลก afarer จัดส่งสินค้าไปยัง 50+ ประเทศ และเรากำลังมองหาตัวแทนจำหน่ายผลิตภัณฑ์ทางทะเลและกีฬาทางน้ำที่มีความมั่นคง
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: การดำเนินงานกระจายสินค้าและจัดส่งทั่วโลกของ Afarer
benefits:
  title: สิ่งที่ตัวแทนจำหน่ายจะได้รับ
  subtitle: ทุกสิ่งที่คุณต้องการเพื่อประสบความสำเร็จในตลาดของคุณ
  items:
    - สิทธิ์แต่เพียงผู้เดียวในพื้นที่จำหน่าย
    - แคตตาล็อกผลิตภัณฑ์ฉบับสมบูรณ์ (SUP อุปกรณ์เสริม ชิ้นส่วน)
    - ราคาส่งที่แข่งขันได้
    - สื่อการตลาดและการขาย (แปลแล้ว)
    - โปรแกรมการฝึกอบรม (ผลิตภัณฑ์ การขาย การบำรุงรักษา)
    - การสนับสนุนงานแสดงสินค้า
    - โปรแกรมตัวอย่างสินค้า
    - ความสามารถในการจัดส่งตรงถึงลูกค้า (Drop-ship)
    - ผู้จัดการบัญชีเฉพาะสำหรับตัวแทนจำหน่าย
    - เงื่อนไขการชำระเงิน 45-60 วัน
coverage:
  title: การจัดจำหน่ายในปัจจุบัน
  subtitle: afarer ให้บริการตลาดเหล่านี้โดยตรงในปัจจุบัน
  regions:
    - name: ยุโรป
      countries: ฝรั่งเศส เยอรมนี สหราชอาณาจักร สเปน อิตาลี เนเธอร์แลนด์ สวีเดน นอร์เวย์ โปแลนด์ กรีซ
    - name: เอเชีย
      countries: ญี่ปุ่น เกาหลีใต้ จีน ไทย สิงคโปร์
    - name: ตะวันออกกลาง
      countries: สหรัฐอาหรับเอมิเรตส์, ซาอุดีอาระเบีย
    - name: อเมริกา
      countries: สหรัฐอเมริกา, แคนาดา, บราซิล, เม็กซิโก
    - name: โอเชียเนีย
      countries: ออสเตรเลีย, นิวซีแลนด์
    - name: แอฟริกา

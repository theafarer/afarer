hero:
  tagline: ความรู้การสำรวจทางน้ำ
  title: เรียนรู้
  subtitle: |
    คำแนะนำ บทเรียน และดำดิ่งลึก — ทุกสิ่งที่คุณต้องการเพื่อสำรวจ<br />
    ผืนน้ำด้วยความมั่นใจ ตั้งแต่การเลือก SUP แรกจนถึงการเชี่ยวชาญเทคนิคขั้นสูง
  taglineSection: ความรู้สำหรับนักพายทุกคน ตั้งแต่ผู้เริ่มต้นถึงมืออาชีพ
featured:
  tagline: หัวข้อแนะนำ
  title: เริ่มต้นการเดินทางเรียนรู้ของคุณ
  subtitle: ไม่ว่าคุณจะใหม่กับกีฬาทางน้ำหรือต้องการยกระดับ คำแนะนำของเราครอบคลุมคุณ
  items:
    - title: พื้นฐาน SUP
      description: ทุกสิ่งที่ผู้เริ่มต้นจำเป็นต้องรู้ — ประเภทกระดาน ขนาดพาย ท่ายืน และเคล็ดลับวันแรก
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: กระดานเป่าลม vs กระดานแข็ง
      description: อันไหนเหมาะกับคุณ? เราเปรียบเทียบความพกพา ประสิทธิภาพ ความทนทาน และราคาเคียงข้างกัน
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: ความปลอดภัยทางน้ำ
      description: ความรู้ด้านความปลอดภัยที่จำเป็นที่นักพายทุกคนควรมี — สภาพอากาศ เสื้อชูชีพ การช่วยเหลือตนเอง และอื่นๆ
      icon: tabler:shield
      href: /learn/water-safety
    - title: คู่มือวัสดุ
      description: PVC vs Hypalon เทคโนโลยี drop-stitch ระดับเดเนียร์ — เข้าใจว่าอุปกรณ์ของคุณทำจากอะไร
      icon: tabler:flask
      href: /learn/materials
    - title: คู่มือขนาด SUP
      description: ค้นหาความยาว ความกว้าง และปริมาตรกระดานที่เหมาะสมสำหรับน้ำหนัก ทักษะ และสไตล์การพายของคุณ
      icon: tabler:ruler
      href: /size-guide
    - title: เทคนิคระดับกลาง
      description: ยกระดับการพายของคุณด้วยการพายขั้นสูง เทคนิคการเลี้ยว และการจัดการในน้ำขุ่น
      icon: tabler:droplet
      href: /learn/intermediate-techniques

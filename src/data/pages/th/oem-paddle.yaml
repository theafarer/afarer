features:
  title: 'บริการ OEM ครบวงจร'
  subtitle: 'ทุกอย่างในที่เดียว: การออกแบบ ต้นแบบ การผลิต การควบคุมคุณภาพ และโลจิสติกส์'
  columns: 3
  items:
    - title: 'ออกแบบ & วิศวกรรม'
      description: 'การสร้างแบบจำลอง 3D การเลือกวัสดุ PVC/VS2 และการออกแบบกราฟิกตามสั่ง'
      icon: 'tabler:palette'
    - title: 'ต้นแบบ & การตรวจสอบ'
      description: 'ตัวอย่างที่ได้รับการรับรอง CE พร้อมการทดสอบคุณภาพก่อนการผลิตจำนวนมาก'
      icon: 'tabler:flask'
    - title: 'การผลิตจำนวนมาก'
      description: 'การผลิตเต็มรูปแบบพร้อม QC ในสายการผลิตและการสนับสนุนการตรวจประเมินโรงงาน'
      icon: 'tabler:building-factory'
    - title: 'แบรนด์เจ้าของ'
      description: 'โลโก้ ป้าย บรรจุภัณฑ์ และกล่องจัดแสดงในภาพลักษณ์แบรนด์ของคุณ'
      icon: 'tabler:shield-check'
    - title: 'คุณภาพที่ได้รับการรับรอง'
      description: 'CE / ISO / UKCA / BSCI / REACH — บอร์ดพาเดิลสูบลมระดับมืออาชีพสำหรับตลาดทั่วโลก'
      icon: 'tabler:certificate'
    - title: 'การจัดส่งทั่วโลก'
      description: 'FOB Qingdao, CIF ท่าเรือหลัก และจัดส่งถึงบ้านในกว่า 50 ประเทศ'
      icon: 'tabler:world'
faqs:
  title: 'คำถามที่พบบ่อยเรื่องการผลิต OEM'
  subtitle: 'คำตอบสำหรับคำถามที่แบรนด์ถามบ่อยที่สุดขณะเปิดตัวบอร์ดพาเดิลของตัวเอง'
  items:
    - title: 'ฉันสร้างแบรนด์บอร์ดพาเดิลของตัวเองได้อย่างไร?'
      description: 'เปิดตัวแบรนด์ของคุณใน 16 สัปดาห์: บรีฟ ออกแบบ ต้นแบบที่รับรอง CE ผลิตจำนวนมาก และส่งมอบ สำรวจแพ็กเกจ OEM ของเรา'
    - title: 'ระยะเวลาผลิตนานเท่าไหร่?'
      description: 'ตัวอย่างพร้อมใน 2-3 สัปดาห์ การผลิตจำนวนมากใน 30-45 วัน ขึ้นอยู่กับปริมาณ'
    - title: 'บอร์ดมีโลโก้ของเราไหม?'
      description: 'มี — แบรนด์เจ้าของเต็มรูปแบบ: พิมพ์โลโก้ สีตามสั่ง บรรจุภัณฑ์ และป้ายในแบรนด์ของคุณ'
    - title: 'ซื้อขายส่งได้ตั้งแต่วันแรกไหม?'
      description: 'MOQ คือ 50 ชิ้นสำหรับรุ่นมาตรฐาน โดยมีขั้นราคาขายส่งตามปริมาณที่เพิ่มขึ้น'
geo:

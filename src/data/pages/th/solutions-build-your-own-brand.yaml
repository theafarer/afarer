meta:
  title: การผลิต SUP แบบ Private Label | {SITE}
  description: เริ่มแบรนด์ SUP ของคุณเองกับ Afarer ตั้งแต่แนวคิดสู่ตลาด — บริการ OEM/ODM ครบวงจร รวมถึงการออกแบบ การทำต้นแบบ การผลิต และโลจิสติกส์ทั่วโลก
hero:
  tagline: สร้างแบรนด์ของคุณเอง
  title: เปิดตัวแบรนด์ซัพ<br />ของคุณเอง
  subtitle: คุณมีวิสัยทัศน์ เรามีโรงงาน ความเชี่ยวชาญ และห่วงโซ่อุปทาน เราจะร่วมกันสร้างแบรนด์ที่โดดเด่นด้วยกัน
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: บอร์ด SUP ใส่แบรนด์ตามสั่งกลางน้ำ
process:
  title: เส้นทางแบรนด์ของคุณ
  subtitle: จากแนวคิดสู่ตลาดใน 5 ระยะ
  steps:
    - phase: ระยะที่ 1
      title: แนวคิด
      period: สัปดาห์ที่ 1-2
      items:
        - การวิจัยตลาดและการวิเคราะห์คู่แข่ง
        - การกำหนดกลุ่มลูกค้าเป้าหมาย
        - เวิร์กช็อปการวางตำแหน่งแบรนด์
        - กลยุทธ์สายผลิตภัณฑ์
    - phase: ระยะที่ 2
      title: การออกแบบ
      period: สัปดาห์ที่ 3-6
      items:
        - รูปทรงบอร์ดและการออกแบบกราฟิก
        - การจับคู่สีและการเลือกวัสดุ
        - ข้อกำหนดของอุปกรณ์เสริม
        - การออกแบบบรรจุภัณฑ์และฉลาก
    - phase: ระยะที่ 3
      title: ต้นแบบ
      period: Week 7-10
      items:
        - การผลิตตัวอย่างสินค้า
        - การทดสอบคุณภาพ (แรงดัน ความลอยตัว รังสี UV)
        - การปรับปรุงแบบ
        - การอนุมัติขั้นสุดท้าย
    - phase: ระยะที่ 4
      title: กระบวนการผลิต
      period: สัปดาห์ที่ 11-14
      items:
        - การผลิตในปริมาณมาก
        - การตรวจสอบ QC (ต่อลำ)
        - ขนส่งทางเรือ / ขนส่งทางอากาศ
        - เอกสารพิธีการศุลกากร
    - phase: ระยะที่ 5
      title: เริ่มแบรนด์ของคุณ
      period: สัปดาห์ที่ 15-16
      items:
        - การถ่ายภาพผลิตภัณฑ์
        - ฟีดสินค้าบนเว็บไซต์
        - สื่อการตลาด
        - การสนับสนุนการเปิดตัว
packages:
  title: แพ็กเกจสำหรับธุรกิจสตาร์ตอัป
  subtitle: แพ็กเกจที่ออกแบบมาสำหรับทุกช่วงของการเติบโตของแบรนด์
  items:
    - name: Starter Brand
      tagline: 50-100 ลำ · บอร์ด 2 รุ่น
      features:
        - การพิมพ์โลโก้ขั้นพื้นฐาน
        - บรรจุภัณฑ์มาตรฐาน
        - การสนับสนุนทางอีเมล
    - name: Growing Brand
      tagline: 300-1,000 ชิ้น · บอร์ด 3-5 รุ่น
      features:
        - สีและโลโก้แบบกำหนดเอง
        - แพ็กเกจตามความต้องการ
        - ภาพถ่ายผลิตภัณฑ์
        - ผู้จัดการที่ดูแลคุณโดยเฉพาะ
    - name: Established Brand
      tagline: 1,000+ ลำ · กลุ่มผลิตภัณฑ์ครบทั้งไลน์
      features:
        - ปรับแต่งได้เต็มรูปแบบ
        - บรรจุภัณฑ์ระดับพรีเมียม
        - สื่อส่งเสริมการตลาด
        - การผลิตแบบลำดับความสำคัญสูง
features:
  title: ทำไมแบรนด์ต่าง ๆ จึงเลือก afarer
  subtitle: ประสบการณ์ OEM มากกว่า 10 ปี ใบรับรองครบถ้วน และ MOQ ต่ำที่สุดในอุตสาหกรรม
  items:
    - title: ประสบการณ์ OEM มากกว่า 10 ปี
      description: ส่งมอบตัวเรือกว่า 2,400 ลำให้แบรนด์ทั่วโลก
      icon: tabler:clock
    - title: การรับรองเต็มรูปแบบ
      description: CE / ISO / UKCA / BSCI / REACH — ผ่านการรับรองทั้งหมด
      icon: tabler:certificate
    - title: ระยะเวลาการผลิต 30 วัน
      description: เร็วกว่าค่าเฉลี่ยของอุตสาหกรรมตั้งแต่สั่งซื้อจนถึงการจัดส่ง
      icon: tabler:truck-delivery
    - title: MOQ ต่ำ
      description: เริ่มต้นจาก 50 ลำ — ต่ำที่สุดในอุตสาหกรรม
      icon: tabler:package
    - title: การออกแบบภายในองค์กร
      description: การสนับสนุนด้านการออกแบบอย่างครบวงจร ตั้งแต่แนวคิดจนถึงงานอาร์ตเวิร์กขั้นสุดท้าย
      icon: tabler:palette
    - title: ระบบโลจิสติกส์ทั่วโลก
      description: การขนส่งทางทะเล ทางอากาศ และการสนับสนุนพิธีการศุลกากร
      icon: tabler:world

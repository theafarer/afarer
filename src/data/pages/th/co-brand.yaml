features:
  title: 'การร่วมแบรนด์ที่ Afarer หมายถึงอะไร'
  subtitle: 'การร่วมแบรนด์คือโปรแกรมความร่วมมือด้านการออกแบบของเรา — สร้างบนแบรนด์ Afarer การคุ้มครองพื้นที่ และคอลเลกชันรุ่นจำกัด ไม่ใช่การผลิตแบบไร้แบรนด์'
  columns: 3
  items:
    - title: 'ผลิตภัณฑ์ Afarer ยังคงเป็นผลิตภัณฑ์ Afarer'
      description: 'คอลเลกชันแบรนด์ร่วมคือรุ่นจำกัดของบอร์ด Afarer ที่ถักทอเอกลักษณ์ของคุณเข้าไป ไม่ใช่สินค้าไร้แบรนด์ ไม่ใช่แบรนด์บุคคลที่สาม และไม่ใช่โปรแกรมแบรนด์เจ้าของแบบเปิด'
      icon: 'tabler:trademark'
    - title: 'ออกแบบร่วมกับคุณ'
      description: 'สี การตั้งชื่อ และเรื่องราวของคุณกำหนดรูปลักษณ์คอลเลกชัน ทีมออกแบบและวิศวกรรมของเราดูแลหน้าบอร์ด กราฟิก บรรจุภัณฑ์ และเอกสาร ตั้งแต่บรีฟจนถึงส่งมอบ'
      icon: 'tabler:pencil'
    - title: 'สำหรับสโมสร รีสอร์ท งานอีเวนต์ & ชุมชน'
      description: 'คอลเลกชันกองเรือสำหรับสโมสรพาเดิลและรีสอร์ท รุ่นพิเศษสำหรับงานแข่งขันและซีรีส์ชุมชน — ทั้งหมดพร้อมคุณภาพและการรับประกัน Afarer'
      icon: 'tabler:users'
    - title: 'คุ้มครองพาร์ตเนอร์ประเทศ'
      description: 'การร่วมแบรนด์ทำงานควบคู่กับโมเดลหนึ่งประเทศ–หนึ่งตัวแทนจำหน่ายของเรา พาร์ตเนอร์ระดับชาติรักษาพื้นที่ของตน คอลเลกชันแบรนด์ร่วมไม่เปิดทางให้แบรนด์คู่ขนานในตลาดของพวกเขา'
      icon: 'tabler:shield-check'
    - title: 'วิศวกรรม & มาตรฐานคุณภาพ'
      description: 'ทุกคอลเลกชันจัดส่งจากห่วงโซ่อุปทานที่ได้รับการรับรองของเรา พร้อมเอกสาร CE และ ISO 9001 การทดสอบแรงดัน และจุดตรวจ QC เดียวกับสินค้าหลักของเรา'
      icon: 'tabler:certificate'
    - title: 'กลายเป็นสินทรัพย์แบรนด์'
      description: 'คอลเลกชันแบรนด์ร่วมรุ่นจำกัดสร้างเรื่องราวของคุณเองบนน้ำ — กำไรขาย เนื้อหาสื่อ และเหตุผลให้นักพาเดิลกลับมาทุกฤดูกาล'
      icon: 'tabler:star'
table:
  title: 'ระดับคอลเลกชันแบรนด์ร่วม'
  subtitle: 'เงื่อนไขคอลเลกชันแบรนด์ร่วมทั่วไป ราคาใน USD, FOB Qingdao การออกแบบหน้าบอร์ดตามสั่งเพิ่มเวลาพัฒนา 15–20 วันทำการ แม่พิมพ์ใหม่เสนอราคาตามโครงการ'
  caption: 'ผลิตภัณฑ์แบรนด์ร่วมทั้งหมดยังคงเป็นผลิตภัณฑ์ Afarer และมีเอกลักษณ์แบรนด์ Afarer ขอบเขตโครงการ ระยะเวลาความเป็นเอกสิทธิ์ และเงื่อนไขสุดท้ายตกลงกันใน Co-Brand Project Agreement'
  head:
    - ระดับแบรนด์ร่วม
    - คำสั่งซื้อขั้นต่ำ (ชิ้น)
    - ระยะเวลาผลิต
    - การชำระเงิน
  rows:
    - [คอลเลกชันนำร่อง, 30–50, 30–45 วันทำการ, มัดจำ 30% / 70% ก่อนจัดส่ง]
    - [คอลเลกชันแบรนด์ร่วมมาตรฐาน, 50–100, 30–45 วันทำการ, มัดจำ 30% / 70% ก่อนจัดส่ง]
    - [คอลเลกชันใหญ่ / หลายภูมิภาค, 100+, 45–60 วันทำการ, มัดจำ 30% / 70% ก่อนจัดส่ง]
    - [แม่พิมพ์ใหม่หรือปรับให้เข้ากับท้องถิ่นอย่างลึกซึ้ง, 200+, 60–90 วันทำการ, มัดจำ 30% / 70% ก่อนจัดส่ง]
faqs:
  title: 'แบรนด์ร่วม — คำถามที่พบบ่อย'
  subtitle: 'การร่วมแบรนด์ของ Afarer ทำงานอย่างไร และต่างจาก OEM และแบรนด์เจ้าของอย่างไร'
  items:
    - title: 'การร่วมแบรนด์เหมือนกับ OEM หรือแบรนด์เจ้าของไหม?'
      description: 'ไม่ Afarer ไม่เปิดโปรแกรม OEM/แบรนด์เจ้าของแบบเปิดอีกต่อไป ผลิตภัณฑ์แบรนด์ร่วมยังคงเป็นผลิตภัณฑ์ Afarer — ออกแบบ วิศวกรรม ตรวจสอบคุณภาพ และรับประกันโดยแบรนด์ Afarer เอกลักษณ์ของคุณปรากฏเป็นแบรนด์ร่วม ไม่ใช่ผลิตภัณฑ์ไร้แบรนด์ของบุคคลที่สาม'
    - title: 'ใครเริ่มโครงการแบรนด์ร่วมได้บ้าง?'
      description: 'ธุรกิจกีฬาทางน้ำที่ผ่านการคัดเลือก: พาร์ตเนอร์ประเทศปัจจุบัน สโมสรพาเดิล รีสอร์ทและโรงแรม ผู้จัดงานอีเวนต์ และชุมชน ส่งบรีฟโครงการมาแล้วเราจะยืนยันความเหมาะสมก่อนเริ่มงานออกแบบ'
    - title: 'การร่วมแบรนด์จะขัดแย้งกับตัวแทนจำหน่ายในประเทศของฉันไหม?'
      description: 'ไม่ โมเดลหนึ่งประเทศ–หนึ่งตัวแทนจำหน่ายมีความสำคัญเป็นอันดับแรก คอลเลกชันแบรนด์ร่วมประสานงานกับพาร์ตเนอร์ประเทศในท้องถิ่นหากมี เพื่อไม่ให้แบรนด์คู่ขนานหรือคู่แข่งปรากฏในพื้นที่ที่ได้รับการคุ้มครอง'
    - title: 'คำสั่งซื้อขั้นต่ำสำหรับคอลเลกชันแบรนด์ร่วมคือเท่าไหร่?'
      description: 'คอลเลกชันนำร่องเริ่มต้นที่ 30–50 ชิ้น คอลเลกชันมาตรฐานอยู่ที่ 50–100 ชิ้น รุ่นใหญ่หรือหลายภูมิภาคที่ 100+ ชิ้น กำหนดการพัฒนาตามสั่งตกลงเป็นรายโครงการ'
    - title: 'อะไรคือคุณภาพของ Afarer เทียบกับส่วนของพาร์ตเนอร์?'
      description: 'Afarer เป็นเจ้าของการออกแบบผลิตภัณฑ์ วิศวกรรม วัสดุ การก่อสร้าง QC และการรับประกัน พาร์ตเนอร์มีส่วนร่วมด้านแนวคิดคอลเลกชัน การตั้งชื่อ สี กราฟิก และการตลาด เพื่อรักษามาตรฐานคุณภาพเดียวบนน้ำ'
    - title: 'สมัครอย่างไร?'
      description: 'กรอกแบบฟอร์มสอบถามแบรนด์ร่วมพร้อมข้อมูลธุรกิจ ตลาด และไอเดียคอลเลกชันของคุณ เราตรวจสอบความเหมาะสมแล้วตอบกลับภายใน 3 วันทำการพร้อมข้อเสนอและ Co-Brand Project Agreement'

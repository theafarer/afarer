hero:
  tagline: 'แบรนด์ร่วมกับ Afarer'
  title: 'สร้าง<br />คอลเลกชันแบรนด์ร่วม'
  subtitle: 'Afarer เป็นแบรนด์อุปกรณ์กีฬาทางน้ำสูบลมระดับโลกที่สร้างความร่วมมือเฉพาะประเทศและคอลเลกชันแบรนด์ร่วมรุ่นจำกัดกับธุรกิจกีฬาทางน้ำที่ผ่านการคัดเลือก ผลิตภัณฑ์แบรนด์ร่วมยังคงเป็นผลิตภัณฑ์ Afarer — ออกแบบ วิศวกรรม ตรวจสอบคุณภาพ และรับประกันโดยแบรนด์ Afarer'
  actions:

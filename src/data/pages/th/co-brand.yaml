  sentence: 'Afarer ร่วมแบรนด์กับธุรกิจกีฬาทางน้ำที่มั่นคง — พาร์ตเนอร์ประเทศ สโมสรพาเดิล รีสอร์ทและโรงแรม ผู้จัดงานอีเวนต์ และชุมชนนักพาเดิล — ที่ต้องการคอลเลกชันเฉพาะตัวรุ่นจำกัดบนแบรนด์ระดับโลกที่เชื่อถือได้'

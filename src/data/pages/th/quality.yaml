meta:
  title: 'คุณภาพและการทดสอบ — การควบคุมการผลิต | {SITE}'
  description: 'ระบบคุณภาพของ afarer: ห้องปฏิบัติการทดสอบอิสระ กระบวนการ ISO 9001 และทุกยูนิตได้รับการทดสอบก่อนจัดส่ง การควบคุมคุณภาพในการผลิตซัพเป่าลม'
  keywords:
    - 'การควบคุมคุณภาพ SUP'
    - 'การทดสอบ SUP แบบสูบลม'
    - 'การรับประกันคุณภาพพายบอร์ด'
    - 'คุณภาพโรงงาน SUP'
hero:
  tagline: การประกันคุณภาพ
  title: การทดสอบประสิทธิภาพและคุณภาพ
  subtitle: ซัพเป่าลม afarer ทุกลำผ่านการทดสอบประสิทธิภาพและการควบคุมคุณภาพอย่างเข้มงวดที่ศูนย์วิจัยและพัฒนาของเราก่อนจัดส่ง การทดสอบคุณภาพ SUP อย่างครอบคลุมของเรามอบหลักฐานที่จับต้องได้ถึงความเป็นเลิศของผลิตภัณฑ์สำหรับผู้ซื้อ OEM และขายส่ง
stats:
  - value: 100%
    label: หน่วยที่ทดสอบแรงดัน
  - value: '8'
    label: โปรโตคอลการทดสอบ
  - value: ISO 9001
    label: รับรองคุณภาพ
  - value: 3 ปี
    label: รับประกันแบบจำกัด
tests:
  - title: การทดสอบแรงดัน
    description: ห้องเป่าลมถูกทดสอบด้วยแรงดันที่เกินขีดจำกัดการใช้งานที่แนะนำเป็นระยะเวลานาน วิธีนี้ตรวจสอบความสามารถในการกักอากาศและความแข็งแรงโครงสร้างของวัสดุและรอยต่อ เพื่อให้แน่ใจว่าผลิตภัณฑ์ทนต่อการใช้งานตามวัตถุประสงค์และการเป่าลมเกินพิกัดโดยไม่เกิดความเสียหายหรือการรั่ว
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: การทดสอบแรงกระแทก
    description: สินค้าถูกทดสอบด้วยการกระแทกควบคุมจากน้ำหนักและมุมต่าง ๆ วิธีนี้ประเมินความต้านทานของวัสดุต่อการถูกเจาะทะลุ ฉีกขาด และความเสียหายจากการชนสิ่งกีดขวางในน้ำ แสดงให้เห็นถึงความทนทานและอายุการใช้งานยาวนาน
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: การทดสอบความต้านทานรังสี UV
    description: ตัวอย่างวัสดุผ่านการทดสอบ UV เร่งที่จำลองแสงแดดจัดตลอดหลายปี จากนั้นทดสอบซ้ำเพื่อตรวจสอบการคงความแข็งแรงดึงและความคงทนของสี วิธีนี้ยืนยันว่าสารผสม PVC ทนต่อการซีดจาง การเสื่อมสภาพผิว และการแตกร้าว เพื่อความทนทานระยะยาวในสภาพแวดล้อมทางทะเลที่แดดจัด
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: การทดสอบความต้านทานการเสียดสี
    description: ตัวอย่างวัสดุถูกนำมาเสียดสีกับพื้นผิวขรุขระตามจำนวนรอบที่กำหนดภายใต้แรงกดที่ควบคุม วิธีนี้วัดความสามารถของวัสดุในการทนต่อการสึกหรอจากการใช้งานซ้ำ ๆ การสัมผัสกับทราย หิน หรือพื้นผิวอื่น ๆ เพื่อความทนทานระยะยาว
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: การทดสอบอุณหภูมิต่ำ
    description: สินค้าถูกทดสอบในสภาพแวดล้อมเย็นเพื่อประเมินการทำงานและความทนทานในสภาพอุณหภูมิที่หลากหลาย ป้องกันความแข็งเกร็งหรือการแตกร้าวในน้ำที่เย็นกว่า จำเป็นสำหรับบอร์ดที่กำหนดให้ใช้ในฤดูหนาวหรือละติจูดสูง
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: การทดสอบการลอยตัวและความสามารถในการรับน้ำหนัก
    description: สินค้าถูกทดสอบด้วยน้ำหนักต่าง ๆ เพื่อกำหนดความสามารถในการรับน้ำหนักสูงสุดและรับประกันว่ารองรับผู้ใช้และอุปกรณ์ได้อย่างปลอดภัย ความจุพิกัดของทุกรุ่นได้รับการตรวจสอบก่อนเปิดตัว
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: การทดสอบความคล่องแคล่ว
    description: สินค้าถูกทดสอบการตอบสนองต่อการพายหรือการป้อนของเครื่องยนต์ ประเมินรัศมีการเลี้ยวและความสะดวกในการควบคุม การทดลองบนน้ำยืนยันว่าการควบคุมในการใช้งานจริงตรงกับข้อกำหนดการออกแบบ
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: การทดสอบกันน้ำ
    description: สินค้าที่ประกอบเสร็จสมบูรณ์ถูกจุ่มในน้ำหรือทดสอบด้วยการฉีดน้ำเพื่อตรวจสอบการรั่วซึมผ่านรอยต่อ วาล์ว หรือวัสดุ บอร์ดทุกลำต้องผ่านการตรวจสอบการกันน้ำอย่างเข้มงวดก่อนจัดส่ง
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
testing_section:
  tagline: ขั้นตอนการทดสอบ
  title: การทดสอบอย่างละเอียดในทุกขั้นตอน
commitment:
  title: ความมุ่งมั่นของเรา
  body: ด้วยขั้นตอนการทดสอบที่เข้มงวดเหล่านี้ {SITE} ให้ความมั่นใจแก่ลูกค้าว่าซัพเป่าลมของเราไม่เพียงมีประสิทธิภาพสูง แต่ยังสร้างมาให้ทนทาน — เพื่อการผจญภัยบนน้ำที่สนุกสนานและปลอดภัยไม่รู้จบ ห้องปฏิบัติการคุณภาพของเราดำเนินงานอย่างเป็นอิสระจากฝ่ายผลิตและรายงานตรงต่อฝ่ายบริหาร
  cta: ขอเอกสารการทดสอบ
  cta_link: /contact/

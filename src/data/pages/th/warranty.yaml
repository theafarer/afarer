label: การรับประกัน
headline: การรับประกันแบบจำกัดของผู้ผลิต afarer
subtitle: afarer ยืนหยัดอยู่เบื้องหลังคุณภาพของผลิตภัณฑ์ทางทะเลทุกชิ้นที่เราผลิต
seo:
  headline: การรับประกันเรือเป่าลม afarer — รับประกันแบบจำกัด 5 ปี | afarer
  description: afarer ให้การรับประกันแบบจำกัด 5 ปีสำหรับผ้าหลักของท่อ ตะเข็บ และตัวเรือไฟเบอร์กลาส
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    การรับประกันแบบจำกัดนี้ใช้กับผลิตภัณฑ์ทางทะเลเป่าลมใหม่ภายใต้แบรนด์ afarer ที่ซื้อโดยตรงจาก afarer หรือจากตัวแทนจำหน่ายหรือผู้ค้าปลีกที่ได้รับอนุญาตของ afarer วันที่เริ่มมีผลคือวันที่ตรวจสอบได้ของการซื้อปลีกครั้งแรก
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">ความคุ้มครองการรับประกันและระยะเวลา</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 ปี</h3>
        <p class="text-sm text-gray-600 mt-1">ความสมบูรณ์ของผ้าหลักของท่อ (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 ปี</h3>
        <p class="text-sm text-gray-600 mt-1">ความสมบูรณ์ของโครงสร้างตัวเรือไฟเบอร์กลาส</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 ปี</h3>
        <p class="text-sm text-gray-600 mt-1">ความสามารถในการกักเก็บอากาศของตะเข็บท่อเป่าลม</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 ปี</h3>
        <p class="text-sm text-gray-600 mt-1">การทำงานของวาล์วเติมลม</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 ปี</h3>
        <p class="text-sm text-gray-600 mt-1">อุปกรณ์เสริมและข้อต่อเสริมที่ติดตั้งจากโรงงาน</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 ปี*</h3>
        <p class="text-sm text-gray-600 mt-1">การใช้งานเชิงพาณิชย์ การเช่า หรือการใช้เป็นกองเรือ — ทุกส่วนประกอบ</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*การใช้งานเชิงพาณิชย์ ราชการ เช่าเหมาลำ เช่า หรือเพื่อการศึกษา จะลดการรับประกันเหลือ 1 ปี การใช้ในการแข่งหรือการแข่งขันจะทำให้การรับประกันเป็นโมฆะทั้งหมด</p>
  </div>

  <h2>สิ่งที่ครอบคลุม</h2>
  <h3>ผ้าหลักของท่อ (5 ปี)</h3>
  <p>afarer รับประกันผ้าหลักของท่อต่อการเสื่อมสภาพของความพรุนซึ่งทำให้ความสามารถของผลิตภัณฑ์ในการรักษาแรงดันลมในการทำงานลดลงอย่างมีนัยสำคัญ ซึ่งใช้กับผ้าเคลือบ CSM (Hypalon) และวัสดุท่ออื่น ๆ ทั้งหมดที่ใช้ในการผลิต</p>

  <h3>ความสมบูรณ์ของโครงสร้างตัวเรือไฟเบอร์กลาส (5 ปี)</h3>
  <p>สำหรับผลิตภัณฑ์ที่มีตัวเรือพลาสติกเสริมไฟเบอร์กลาส (FRP) โครงสร้างคอมโพสิตพื้นฐานได้รับการรับประกันต่อความล้มเหลวของโครงสร้างอันเกิดจากข้อบกพร่องของวัสดุหรือฝีมือการผลิต</p>

  <h3>ความสามารถในการกักเก็บอากาศของตะเข็บท่อเป่าลม (5 ปี)</h3>
  <p>ตะเข็บของท่อเป่าลมในจุดที่ต่อกันระหว่างการผลิต ได้รับการรับประกันต่อข้อบกพร่องจากการผลิตซึ่งทำให้เกิดการรั่วของอากาศอย่างมีนัยสำคัญผ่านตะเข็บ การตรวจสอบเป็นระยะและการบำรุงรักษาแรงดันลมที่เหมาะสมเป็นเงื่อนไขของความคุ้มครอง</p>

  <h3>การทำงานของวาล์วเติมลม (5 ปี)</h3>
  <p>วาล์วเติมลมที่ติดตั้งโดย afarer เดิม ได้รับการรับประกันต่อข้อบกพร่องของวัสดุหรือฝีมือการผลิตซึ่งทำให้วาล์วไม่สามารถกักเก็บอากาศได้ตามการออกแบบ</p>

  <h3>อุปกรณ์เสริมที่ติดตั้งจากโรงงาน (1 ปี)</h3>
  <p>ส่วนประกอบและข้อต่อที่ผลิตโดย afarer และติดตั้งจากโรงงานเป็นครั้งแรก ได้รับการรับประกันต่อข้อบกพร่องของวัสดุและฝีมือการผลิตเป็นเวลาหนึ่งปี ซึ่งไม่รวมสินค้าของบุคคลที่สามซึ่งครอบคลุมโดยการรับประกันของผู้ผลิตแต่ละรายเท่านั้น</p>

  <h2>สิ่งที่ไม่อยู่ในความคุ้มครอง</h2>
  <ul>
    <li>ข้อบกพร่องด้านความสวยงาม รวมถึงการเปลี่ยนสี คราบ การซีดจาง การเป็นปูนขาว หรือการเปลี่ยนแปลงใด ๆ ในลักษณะที่ปรากฏ</li>
    <li>รอยเจาะ รอยตัด รอยฉีกขาด รอยแยก หรือความเสียหายทางกายภาพอื่น ๆ</li>
    <li>รอยแตก การแตกร้าว การเสียดสี การขูดขีด หรือการเสื่อมสภาพจากการเสียดสีหรือการสัมผัส</li>
    <li>การเสื่อมสภาพจากการสัมผัสแสง UV สภาพอากาศ หรือสภาวะบรรยากาศ</li>
    <li>ความเสียหายจากการสัมผัสกับเชื้อเพลิง ตัวทำละลาย กรด ด่าง หรือสารเคมี</li>
    <li>ความเสียหายจากความประมาท การใช้ผิดวิธี การใช้ในทางที่ผิด อุบัติเหตุ หรือการสึกหรอตามปกติ</li>
    <li>ปัญหาพื้นผิวเจลโค้ตหรือสี (การเกิดพุพอง การแตกร้าว การเปลี่ยนสี การซีดจาง)</li>
    <li>ความเสียหายจากการกระแทก ความเค้น การรองรับที่ไม่เหมาะสม หรือการลากด้วยรถพ่วง</li>
    <li>ความเสียหายจากการเติมลม/ปล่อยลมที่ไม่เหมาะสม หรือการใช้อุปกรณ์เติมลมที่ไม่ได้รับอนุมัติ</li>
    <li>อุปกรณ์ ส่วนประกอบ หรือระบบของบุคคลที่สาม (ครอบคลุมโดยผู้ผลิตของแต่ละราย)</li>
  </ul>

  <h2>ภาระผูกพันและแนวทางแก้ไขของผู้ผลิต</h2>
  <p>ภาระผูกพันแต่เพียงผู้เดียวและเฉพาะของ afarer คือการซ่อมแซมหรือเปลี่ยนทดแทน ตามดุลยพินิจของ afarer ส่วนประกอบใด ๆ ที่พิจารณาว่ามีข้อบกพร่องของวัสดุหรือฝีมือการผลิตและอยู่ภายใต้การรับประกันนี้ การซ่อมแซมหรือเปลี่ยนทดแทนดำเนินการโดย afarer หรือศูนย์บริการที่ได้รับอนุญาตซึ่ง afarer กำหนด ส่วนประกอบที่ซ่อมแซมหรือเปลี่ยนทดแทนจะได้รับการรับประกันเฉพาะในส่วนที่ยังไม่หมดอายุของระยะเวลาการรับประกันเดิมเท่านั้น</p>

  <h2>เงื่อนไขการรับประกัน</h2>
  <ul>
    <li><strong>การลงทะเบียน:</strong> ผลิตภัณฑ์ต้องลงทะเบียนอย่างถูกต้องตามที่กำหนดในเงื่อนไขการรับประกัน</li>
    <li><strong>การบำรุงรักษา:</strong> ผลิตภัณฑ์ต้องได้รับการบำรุงรักษาตามแนวทางที่เผยแพร่ของ afarer รวมถึงการตรวจสอบเป็นระยะและการบำรุงรักษาแรงดันลมที่เหมาะสม</li>
    <li><strong>ความร่วมมือ:</strong> ผู้ซื้อต้องให้ความร่วมมืออย่างเต็มที่และทันท่วงทีกับ afarer ในทุกเรื่องที่เกี่ยวกับการเรียกร้องค่าสินไหมตามการรับประกัน</li>
    <li><strong>ผู้ซื้อรายแรก:</strong> การรับประกันนี้ขยายให้แก่ผู้ซื้อผู้ใช้ปลายทางรายแรกเท่านั้นและไม่สามารถโอนได้</li>
  </ul>

  <h2>การใช้เชิงพาณิชย์</h2>
  <p>หากผลิตภัณฑ์ถูกใช้เพื่อการค้า ราชการ องค์กรไม่แสวงหาผลกำไร การเช่าเหมาลำ การเช่า การศึกษา หรือวัตถุประสงค์ใด ๆ นอกเหนือจากการใช้เพื่อสันทนาการส่วนตัว ระยะเวลาการรับประกันสำหรับทุกส่วนประกอบจะลดลงเหลือหนึ่ง (1) ปีนับจากวันที่ซื้อปลีกครั้งแรก การใช้ในการแข่ง ความเร็ว หรือการแข่งขันความอดทนจะทำให้การรับประกันเป็นโมฆะทั้งหมดทันทีและไม่อาจเพิกถอนได้</p>

  <h2>วิธีการยื่นคำเรียกร้องการรับประกัน</h2>
  <p>ติดต่อ afarer หรือตัวแทนจำหน่ายที่ได้รับอนุญาตของคุณพร้อมหลักฐานการซื้อและคำอธิบายโดยละเอียดของปัญหา afarer จะตรวจสอบคำเรียกร้องและให้คำแนะนำสำหรับการตรวจสอบและการบริการ</p>
  <p>สำหรับการสอบถามเรื่องบริการการรับประกัน โปรดติดต่อเราผ่าน<a href="/contact" class="text-sky-600 underline">หน้าติดต่อ</a>ของเราพร้อมหมายเลขคำสั่งซื้อและรายละเอียดผลิตภัณฑ์</p>

  <h2>สินค้าของบุคคลที่สาม</h2>
  <p>อุปกรณ์ ส่วนประกอบ หรือระบบที่ผลิตโดยบุคคลที่สาม (แม้ว่าติดตั้งโดย afarer) จะได้รับการครอบคลุมโดยการรับประกันที่ผู้ผลิตแต่ละรายเสนอเท่านั้น afarer ปฏิเสธความรับผิดชอบใด ๆ ต่อการรับประกันสำหรับสินค้าของบุคคลที่สามดังกล่าวอย่างชัดแจ้ง</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    ข้อความการรับประกันนี้เป็นบทสรุปของการรับประกันแบบจำกัดของผู้ผลิต afarer ฉบับสมบูรณ์ เอกสารการรับประกันทางกฎหมายฉบับเต็มเป็นตัวกำหนดข้อกำหนดและเงื่อนไขการรับประกันทั้งหมด ข้อมูลจำเพาะอาจมีการเปลี่ยนแปลงโดยไม่ต้องแจ้งให้ทราบล่วงหน้า afarer เป็นแบรนด์ของ Qingdao Vatrad Group
  </p>

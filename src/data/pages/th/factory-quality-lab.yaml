hero:
  tagline: ห้องปฏิบัติการควบคุมคุณภาพ
  title: ห้องปฏิบัติการทดสอบและการประกันคุณภาพ
  subtitle: ห้องปฏิบัติการตรวจสอบคุณภาพอิสระตามกระบวนการ ISO 9001 —ผลิตภัณฑ์ทุกชิ้นผ่านการทดสอบก่อนจัดส่ง
intro: afarer มีห้องปฏิบัติการควบคุมคุณภาพโดยเฉพาะที่ทำงานแยกอิสระจากสายการผลิต วัตถุดิบทุกชุดและเรือสำเร็จทุกลำต้องผ่านขั้นตอนการตรวจสอบที่มีการบันทึกเป็นเอกสารก่อนปล่อยออกจำหน่าย ทีม QC ของเรารายงานตรงต่อผู้บริหาร เพื่อให้การตัดสินใจด้านคุณภาพเป็นไปอย่างเป็นกลาง
highlights:
  - value: 100%
    label: ทุกยูนิตผ่านการทดสอบแรงดัน
    detail: ทุกห้องลม ทุกลำ
  - value: 48 h
    label: ระยะเวลาการทดสอบการเก็บอากาศ
    detail: ที่แรงดัน 1.25 เท่าของค่ากำหนด
  - value: น้อยกว่า 5%
    label: ค่าความดันลดลงสูงสุดที่ยอมรับได้
    detail: ระยะเวลากักเก็บอากาศมากกว่า 24 ชั่วโมง
  - value: AQL 2.5
    label: เกณฑ์ข้อบกพร่องร้ายแรง
    detail: ตามหลักการสุ่มตัวอย่าง ISO 2859
test_procedures:
  - title: การตรวจสอบวัตถุดิบ
    description: วัสดุทุกชุดที่รับเข้า ทั้ง PVC, Hypalon, ผ้าดรอปสติทช์ และอุปกรณ์ประกอบ จะถูกทดสอบก่อนรับเข้างาน ความต้านทานแรงดึง (ASTM D751) ความต้านทานการฉีกขาด (ISO 4674) และความต้านทานรังสี UV จะถูกตรวจสอบยืนยัน วัสดุที่ไม่ตรงตามข้อกำหนดจะถูกกักแยกและส่งคืน
    standards:
      - ASTM D751 (แรงดึง)
      - ISO 4674 (การฉีกขาด)
      - ISO 4892 (UV)
  - title: จุดตรวจสอบคุณภาพระหว่างการผลิต (In-Process QC)
    description: พนักงานผลิตตรวจสอบด้วยตนเองในทุกขั้นตอน ผู้ตรวจสอบ QC สุ่มตัวอย่างตลอดกะการทำงาน ทดสอบแรงลอกของรอยเชื่อมทุก ๆ 50 ลำ ตรวจสอบขนาดทุก ๆ แผงที่ 20
    standards:
      - ASTM D751 (การทดสอบการลอก)
      - รายการตรวจสอบภายใน 100 จุด
      - การสุ่มตัวอย่างตามมาตรฐาน ISO 2859
  - title: การทดสอบกักเก็บอากาศ 48 ชั่วโมง
    description: ห้องลมแต่ละห้องถูกเติมลมจนถึง 125% ของแรงดันที่กำหนดและคงไว้เป็นเวลา 48 ชั่วโมง เซนเซอร์วัดแรงดันบันทึกข้อมูลอย่างต่อเนื่องพร้อมการชดเชยอุณหภูมิ ห้องลมใดที่แรงดันลดลงเกิน 5% จะถูกส่งกลับเพื่อตรวจสอบใหม่ทั้งชุดโดยอัตโนมัติ
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: การทดสอบน้ำหนักบรรทุกและการทรงตัว
    description: เรือที่ผลิตเสร็จแล้วจะถูกทดสอบที่ความจุพิกัดสูงสุดเพื่อตรวจสอบความมั่นคง ระยะขอบท้องเรือ (freeboard) และการควบคุม เรือแต่ละลำผ่านการทดสอบในน้ำก่อนได้รับการอนุมัติจากการตรวจสอบขั้นสุดท้าย
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: เครื่องทดสอบอเนกประสงค์ (แรงดึง)
    spec: 5 kN ผ่านมาตรฐาน ASTM D751
  - name: Pressure Decay Tester
    spec: หลายช่องสัญญาณ, 0–50 psi, พร้อมการบันทึกข้อมูล
  - name: UV Weathering Chamber
    spec: ISO 4892, 1,000 รอบชั่วโมง
  - name: เครื่องวัดความหนา (ดิจิทัล)
    spec: ความละเอียด 0.01 mm
  - name: Peel Tester (weld)
    spec: แบบมอเตอร์ ความจุ 50 N
  - name: Temperature Chamber
    spec: '-40 °C ถึง +100 °C'
  - name: Leak Detection Tank
    spec: 6 ม. × 2 ม. มีไฟส่องสว่าง

hero_text:
  tagline: ขอใบเสนอราคา
  title: ขอใบเสนอราคา<br />สำหรับโครงการของคุณ
  subtitle: บอกเราเกี่ยวกับความต้องการของคุณ แล้วทีมงานของเราจะตอบกลับพร้อมใบเสนอราคาโดยละเอียดภายใน 2 วันทำการ
steps2_process:
  title: วิธีการทำงาน
  subtitle: สี่ขั้นตอนง่ายๆ จากการสอบถามไปจนถึงใบเสนอราคา
  items:
    - title: 'ขั้นตอนที่ 1: ส่งข้อมูลความต้องการของคุณ'
      description: กรอกแบบฟอร์มด้านล่างพร้อมประเภทผลิตภัณฑ์ ปริมาณ และข้อกำหนดของคุณ ยิ่งคุณระบุรายละเอียดมากเท่าใด ใบเสนอราคาของคุณก็จะยิ่งแม่นยำมากขึ้นเท่านั้น
      icon: tabler:file-text
    - title: 'ขั้นตอนที่ 2: เราตรวจสอบและให้คำแนะนำ'
      description: ทีมวิศวกรของเราจะตรวจสอบความต้องการของคุณ และอาจติดต่อคุณเพื่อขอคำชี้แจง เราให้คำแนะนำเกี่ยวกับการกำหนดค่าผลิตภัณฑ์และตัวเลือกต่างๆ
      icon: tabler:users
    - title: 'ขั้นตอนที่ 3: รับใบเสนอราคาของคุณ'
      description: คุณจะได้รับใบเสนอราคาโดยละเอียด รวมถึงราคาต่อหน่วย, MOQ, ระยะเวลาดำเนินการ, เงื่อนไขการชำระเงิน และตัวเลือกในการจัดส่ง โดยปกติภายใน 48 ชั่วโมง
      icon: tabler:currency-dollar
    - title: 'ขั้นตอนที่ 4: ตัวอย่างและการผลิต'
      description: หลังจากการยอมรับใบเสนอราคา เราจะดำเนินการผลิตตัวอย่าง (ถ้ามี) หรือดำเนินการผลิตโดยตรงในจำนวนมาก อัปเดตเป็นประจำตลอดกระบวนการ
      icon: tabler:building-factory
content_form:
  tagline: แบบฟอร์มขอใบเสนอราคา
  title: บอกเราเกี่ยวกับโครงการของคุณ
  subtitle: ต้องกรอกข้อมูลทุกช่องที่มี *
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - ศูนย์ดำน้ำ
        - ตกปลา
        - การท่องเที่ยวทางทะเล / รีสอร์ท
        - ค้นหาและกู้ภัย (Search & Rescue)
        - เรือบริการสำหรับเรือยอทช์
        - เรือทำงานเชิงพาณิชย์
        - ภาครัฐ / การทหาร
        - OEM / ตราสินค้าส่วนตัว (Private Label)
        - ส่วนบุคคล / เพื่อการพักผ่อน
        - อื่น ๆ
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      options:
        - ไม่ระบุความต้องการพิเศษ
        - PVC เกรดสำหรับใช้ในทะเล (1100 dtex)
        - ไฮพาลอน / CSM ระดับพรีเมียม
        - ตัวเรือไฟเบอร์กลาส
        - ตัวเรืออะลูมิเนียม
    - name: Engine Requirement
      type: text
      placeholder: เช่น เอาต์บอร์ด 60 แรงม้า ไม่รวมเครื่องยนต์ เครื่องคู่ 115 แรงม้า
    - name: Customization Required
      type: text
      placeholder: เช่น สีที่กำหนดเอง แบรนด์/โลโก้ บรรจุภัณฑ์ อุปกรณ์พิเศษ
    - name: Timeline
      type: text
      placeholder: เช่น จัดส่งภายใน 90 วัน
    - name: Additional Requirements
      type: textarea
      placeholder: อธิบายการใช้งาน ข้อกำหนดทางเทคนิค หรือความต้องการพิเศษใด ๆ —รวมถึงแบบอ้างอิง ข้อมูลจำเพาะ หรือลิงก์ หากมี
    - name: Upload Specification
      type: file
      placeholder: อัปโหลดเอกสารสเปก ภาพวาด หรือเอกสารอ้างอิงของคุณ (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: อัปโหลดโลโก้หรือไฟล์อาร์ตเวิร์กของคุณเพื่อการพิมพ์แบรนด์ตามสั่ง (AI, EPS, PNG)
cta:
  title: ต้องการปรึกษาผ่านอีเมลหรือไม่?
  subtitle: ส่งคำถามของคุณตรงถึงทีมขายของเรา แล้วเราจะตอบกลับภายใน 24 ชั่วโมง
  actions:
    - variant: primary
      text: ส่งอีเมลถึงเราโดยตรง
      href: /contact

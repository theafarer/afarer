hero_text:
  tagline: Get a Quote
  title: ขอใบเสนอราคา<br />สำหรับโครงการของคุณ
  subtitle: บอกเราเกี่ยวกับความต้องการของคุณ แล้วทีมงานของเราจะตอบกลับพร้อมใบเสนอราคาโดยละเอียดภายใน 2 วันทำการ
steps2_process:
  title: How It Works
  subtitle: สี่ขั้นตอนง่ายๆ จากการสอบถามไปจนถึงใบเสนอราคา
  items:
    - title: 'Step 1: Submit Your Requirements'
      description: กรอกแบบฟอร์มด้านล่างพร้อมประเภทผลิตภัณฑ์ ปริมาณ และข้อกำหนดของคุณ ยิ่งคุณระบุรายละเอียดมากเท่าใด ใบเสนอราคาของคุณก็จะยิ่งแม่นยำมากขึ้นเท่านั้น
      icon: tabler:file-text
    - title: 'Step 2: We Review & Advise'
      description: ทีมวิศวกรของเราจะตรวจสอบความต้องการของคุณ และอาจติดต่อคุณเพื่อขอคำชี้แจง เราให้คำแนะนำเกี่ยวกับการกำหนดค่าผลิตภัณฑ์และตัวเลือกต่างๆ
      icon: tabler:users
    - title: 'Step 3: Receive Your Quote'
      description: คุณจะได้รับใบเสนอราคาโดยละเอียด รวมถึงราคาต่อหน่วย, MOQ, ระยะเวลาดำเนินการ, เงื่อนไขการชำระเงิน และตัวเลือกในการจัดส่ง โดยปกติภายใน 48 ชั่วโมง
      icon: tabler:currency-dollar
    - title: 'Step 4: Sample & Production'
      description: หลังจากการยอมรับใบเสนอราคา เราจะดำเนินการผลิตตัวอย่าง (ถ้ามี) หรือดำเนินการผลิตโดยตรงในจำนวนมาก อัปเดตเป็นประจำตลอดกระบวนการ
      icon: tabler:building-factory
content_form:
  tagline: Quotation Form
  title: บอกเราเกี่ยวกับโครงการของคุณ
  subtitle: ต้องกรอกข้อมูลทุกช่องที่มี *
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Diving Center
        - Fishing
        - Marine Tourism / Resort
        - Search & Rescue
        - Yacht Tender
        - Commercial Workboat
        - Government / Military
        - OEM / Private Label
        - Personal / Recreational
        - Other
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      options:
        - No Preference
        - Marine-Grade PVC (1100 dtex)
        - Premium Hypalon / CSM
        - Fiberglass Hull
        - Aluminum Hull
    - name: Engine Requirement
      type: text
      placeholder: e.g. 60 HP outboard, no engine, twin 115 HP
    - name: Customization Required
      type: text
      placeholder: e.g. custom colors, branding/logo, packaging, special fittings
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      placeholder: Describe your application, technical specifications, or any special requirements —include reference drawings, specifications, or links if available
    - name: Upload Specification
      type: file
      placeholder: Upload your spec sheet, drawing, or reference document (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Upload your logo or artwork for custom branding (AI, EPS, PNG)
cta:
  title: Prefer to discuss by email?
  subtitle: Send your inquiry directly to our sales team and we will respond within 24 hours.
  actions:
    - variant: primary
      text: Email us directly
      href: /contact

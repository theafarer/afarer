meta:
  title: ห้องปฏิบัติการคุณภาพและการตรวจสอบ — การทดสอบและการรับรอง RIB ตามมาตรฐาน ISO | {SITE}
  description: การตรวจสอบคุณภาพโดยอิสระสำหรับเรือเป่าลม ครอบคลุมการทดสอบแรงดึง การทดสอบรอบการกักเก็บอากาศ การทดสอบการลอกตะเข็บ และการรับรองวัสดุ ติดต่อห้องปฏิบัติการคุณภาพของเราเพื่อรับบริการทดสอบจากบุคคลที่สาม
back_text: ย้อนกลับไปยังศูนย์วิจัยและพัฒนา (R&D Center)
home_label: หน้าแรก
hero:
  tagline: Lab 06
  title: ห้องปฏิบัติการคุณภาพและการตรวจสอบ
  subtitle: การตรวจสอบโดยอิสระ — ผ่านการทดสอบทุกขั้นตอนก่อนส่งมอบ
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: การทดสอบ UV ในห้องปฏิบัติการตรวจสอบคุณภาพของ Afarer
intro: >-
  เรือทุกลำที่ออกจากโรงงานของเราได้รับการรับรองว่าผ่านชุดการตรวจสอบคุณภาพและการทดสอบวัสดุที่กำหนดไว้ ห้องปฏิบัติการคุณภาพและการตรวจสอบของเราเป็นหน่วยงานอิสระภายในองค์กร — รายงานตรงต่อกรรมการผู้จัดการ ไม่ใช่ต่อฝ่ายผลิต — เพื่อให้แน่ใจว่าไม่มีแรงกดดันทางการค้าใดมาบั่นทอนขั้นตอนการตรวจสอบ
  หากวัสดุชุดใดหรือเรือที่ผลิตเสร็จแล้วไม่ตรงตามสเปกที่ประกาศไว้ ห้องปฏิบัติการมีอำนาจระงับการจัดส่งจนกว่าข้อบกพร่องจะได้รับการแก้ไข
content_html: >
  <h2>เชื่อมั่น แต่ต้องตรวจสอบ</h2>

  <p>ห้องปฏิบัติการดำเนินงานภายใต้ระบบการจัดการคุณภาพที่สอดคล้องกับหลักการ และวิธีการทดสอบของเราอ้างอิงตามมาตรฐาน ISO, ASTM และ EN ในทุกจุดที่เกี่ยวข้อง เราจัดเก็บบันทึกรายละเอียดของการทดสอบทุกครั้ง สร้างสายการตรวจสอบย้อนกลับ (traceability) ที่สมบูรณ์
  ตั้งแต่การรับวัตถุดิบจนถึงการส่งมอบเรือขั้นสุดท้าย</p>


  <h2>เครื่องมือทดสอบและขีดความสามารถ</h2>

  <table>
    <thead><tr><th>เครื่องมือ</th><th>การทดสอบที่ดำเนินการ</th><th>มาตรฐาน / วิธีการ</th></tr></thead>
    <tbody>
      <tr><td>เครื่องทดสอบอเนกประสงค์ (50 kN)</td><td>ความแข็งแรงดึง (ผ้า) ความต้านทานการลอก (ตะเข็บ) การฉีกขาดแบบลาม</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>ชุดทดสอบการคงอากาศ (ตั้งโปรแกรมได้)</td><td>ความทนทานต่อการเติมลม/ปล่อยลม 1,000 รอบ การทดสอบคงแรงดัน 30 นาที</td><td>ISO 6185 (internal)</td></tr>
      <tr><td>จิกทดสอบการลอกตะเข็บ (การลอก 180° แบบมอเตอร์)</td><td>ความแข็งแรงการลอกของรอยเชื่อมและตะเข็บติดกาวที่ 100 มม./นาที</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>เครื่องทดสอบแรงดันน้ำสถิต</td><td>ความต้านทานการซึมผ่านของน้ำของผ้า (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>เครื่องวัดความหนาดิจิทัลและไมโครมิเตอร์</td><td>ความหนาของผ้า ความหนาผนังห้องลม ความหนาฟิล์มกาว</td><td>ISO 2286-3</td></tr>
      <tr><td>ตู้ทดสอบสภาพแวดล้อม</td><td>การปรับสภาพอุณหภูมิ (-40 °C ถึง +80 °C) สำหรับการทดสอบการแตกที่อุณหภูมิต่ำและการเสื่อมสภาพจากความร้อน</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>เครื่องสเปกโตรโฟโตมิเตอร์วัดสี</td><td>การวัดค่าสี Delta-E หลังการสัมผัสรังสี UV</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>ด่านตรวจสอบ — ตั้งแต่วัตถุดิบจนถึงการส่งมอบ</h2>

  <p>เรือทุกลำดำเนินตามแผนคุณภาพที่กำหนดไว้ พร้อมจุดตรวจสอบบังคับ ไม่มีเรือลำใดข้ามด่านได้ แต่ละด่านต้องผ่านการลงนามอนุมัติจากเจ้าหน้าที่ตรวจสอบคุณภาพก่อนเริ่มขั้นตอนการผลิตถัดไป</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">การตรวจสอบวัตถุดิบขาเข้า</p>
            <p class="text-xs text-gray-500 mt-1">ชุดผ้า ชุดกาว อุปกรณ์ฮาร์ดแวร์ — ตรวจสอบทั้งหมดตามสเปกขาเข้าก่อนปล่อยเข้าสู่การผลิต</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">การตรวจสอบรอยเชื่อมระหว่างกระบวนการผลิต</p>
            <p class="text-xs text-gray-500 mt-1">ชิ้นทดสอบรอยเชื่อมชิ้นแรก (การลอก + การตรวจด้วยตา) ถูกทดสอบเมื่อเริ่มกะการผลิตแต่ละครั้ง</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">การทดสอบลมของห้องลม</p>
            <p class="text-xs text-gray-500 mt-1">แต่ละห้องลมถูกเติมแรงดัน 1.5 เท่าของแรงดันใช้งาน คงไว้ 30 นาที ข้อมูลถูกบันทึกตามหมายเลขซีเรียล</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">การตรวจสอบก่อนส่งมอบ</p>
            <p class="text-xs text-gray-500 mt-1">ตรวจสอบเรือทั้งลำ: สกรูและข้อต่อทั้งหมดถูกขันตามแรงบิดที่กำหนด ระบบทำงานได้ปกติ ไม่มีตำหนิด้านรูปลักษณ์ ตามเช็กลิสต์ 100 จุด</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Gate 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">การรับรองขั้นสุดท้าย</p>
            <p class="text-xs text-gray-500 mt-1">รวบรวมรายงานการทดสอบ ตรวจสอบบันทึกการตรวจสอบ แล้วออกหนังสือรับรองความสอดคล้อง (Certificate of Conformance)</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>ตัวชี้วัดคุณภาพหลัก (ค่าเฉลี่ย 2025)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">อัตราผ่านครั้งแรก (ชุดผ้า)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">อัตราปฏิเสธรอยเชื่อม (ต่อเมตร)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">ห้องลมทั้งหมดผ่านการทดสอบลมก่อนการประกอบ</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">ความสอดคล้องตามประเภทการออกแบบ</span>
    </div>
  </div>


  <h2>ทีมงานด้านคุณภาพของเรา</h2>

  <p>ห้องปฏิบัติการมีทีมงานประกอบด้วยผู้จัดการฝ่ายคุณภาพ (ประสบการณ์ 10 ปีในงานประกันคุณภาพทางทะเล ผ่านการรับรอง ASQ Certified Quality Engineer) เจ้าหน้าที่ตรวจสอบคุณภาพ 2 คน (แต่ละคนมีใบรับรอง NDT ระดับ 2 ในด้านการตรวจสอบด้วยตา) และช่างเทคนิควัสดุที่รับผิดชอบการทดสอบทางกายภาพทั้งหมด
  ทีมงานเข้ารับการทดสอบความเชี่ยวชาญประจำปีผ่านผู้ให้บริการบุคคลที่สามที่เป็นอิสระ เพื่อให้แน่ใจว่าผลการทดสอบของเรามีความแม่นยำและสามารถทำซ้ำได้</p>


  <h2>การทดสอบอิสระสำหรับลูกค้า</h2>

  <p>ห้องปฏิบัติการคุณภาพและการตรวจสอบของเราพร้อมให้บริการทดสอบแบบอิสระ หากคุณต้องการตรวจสอบสเปกของผ้า ทดสอบระบบกาวใหม่ หรือขอรายงานการทดสอบจากบุคคลที่สามเพื่อการประเมินคุณสมบัติผู้จัดหา เราสามารถดำเนินการทดสอบตามมาตรฐานที่เกี่ยวข้องและออกรายงานการทดสอบที่ผ่านการรับรองได้</p>

  <p>ตัวอย่างงานทดสอบบุคคลที่สามล่าสุด:</p>

  <ul>
    <li>การเปรียบเทียบความแข็งแรงการลอกของผลิตภัณฑ์ฟิล์มกาวคู่แข่ง 5 รายการ สำหรับโครงการจัดซื้อของกองทัพยุโรป</li>
    <li>การศึกษาการเสื่อมสภาพแบบเร่ง (UV + การหมุนเวียนความร้อน) สำหรับสูตร PVC เม็ดสีส้มรุ่นใหม่ พร้อมการวัดผลระหว่างทางเป็นระยะทุก 500 ชั่วโมง</li>
    <li>การตรวจสอบการคงอากาศของวาล์วกันไหลย้อนต้นแบบ 50 ชิ้น สำหรับการออกแบบห้องลมแรงดันสูงรุ่นใหม่</li>
  </ul>


  <h2>ความมุ่งมั่นของเราที่มีต่อคุณ</h2>

  <p>เมื่อคุณได้รับเรือ Afarer คุณจะได้รับเอกสารคุณภาพ (quality dossier) ของเรือลำนั้นด้วย — บันทึกรวมผลการทดสอบที่เกี่ยวข้องกับเรือเฉพาะของคุณ ประกอบด้วย ใบรับรองชุดผ้า ผลการทดสอบการลอกรอยเชื่อม บันทึกการทดสอบลมห้องลม และเช็กลิสต์การตรวจสอบก่อนส่งมอบ ทุกตัวเลขสามารถตรวจสอบย้อนกลับได้
  เจ้าหน้าที่ตรวจสอบทุกคนระบุตัวตนได้ชัดเจน นี่ไม่ใช่เพียงเอกสาร — แต่เป็นคำมั่นสัญญาของเราว่า สิ่งที่เราส่งมอบคือสิ่งที่เราระบุไว้</p>

  <p>หากคุณมีข้อกังวลด้านคุณภาพใด ๆ คุณสามารถติดต่อห้องปฏิบัติการได้โดยตรง — รายละเอียดการติดต่อจะถูกพิมพ์บนหนังสือรับรองความสอดคล้องของคุณ เราพิจารณาทุกคำถามอย่างจริงจัง และมุ่งมั่นจะดำเนินการสอบสวนอย่างเป็นทางการภายใน 48 ชั่วโมง</p>

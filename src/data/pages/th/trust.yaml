meta:
  title: 'ความไว้วางใจ — คุณภาพ มาตรฐาน และชื่อเสียง | {SITE}'
  description: 'ทำไมต้องไว้วางใจ afar: ใบรับรอง CE และ ISO โรงงานครบวงจร การอ้างอิงระดับโลก และการรับประกัน ผู้ผลิตบอร์ด SUP แบบสูบลมและเรือพองมืออาชีพ'
  keywords:
    - 'ผู้ผลิต SUP ที่น่าเชื่อถือ'
    - 'โรงงานพายบอร์ดที่ได้รับการรับรอง'
    - 'ผู้จัดจำหน่าย SUP ที่น่าเชื่อถือ'
    - 'โรงงาน SUP ที่ได้รับการรับรอง'
hero:
  tagline: สร้างตามมาตรฐานที่สำคัญ
  title: เชื่อมั่นใน afarer
  subtitle: |
    ทุกผลิตภัณฑ์ที่เราสร้างได้รับการรับรอง CE —ทดสอบเพื่อความปลอดภัย<br />
    ความทนทาน และประสิทธิภาพ ไม่มีทางลัด ไม่มีข้อยกเว้น
  taglineSection: รับรอง ทดสอบ พิสูจน์แล้ว
  image: https://assets.afarer.com/images/afarer/hero/tech-meeting-small.webp
  imageAlt: ผลิตภัณฑ์ afarer กำลังผ่านการทดสอบคุณภาพ
stats:
  title: afarer ด้วยตัวเลข
  stats:
    - title: รับรอง CE
      description: ผลิตภัณฑ์เพื่อการพักผ่อนทั้งหมดเป็นไปตามมาตรฐานความปลอดภัยของสหภาพยุโรป
    - title: ISO 9001
      description: ระบบการจัดการคุณภาพตั้งแต่ปี 2012
    - title: BSCI และ REACH
      description: การผลิตอย่างมีจริยธรรมและการปฏิบัติตามข้อกำหนดด้านวัสดุ
    - title: รับประกัน 2 ปี
      description: สำหรับทุกผลิตภัณฑ์ afarer —ไม่มีคำถาม
features3_certifications:
  title: การรับรองและการปฏิบัติตามข้อกำหนด
  subtitle: ทุกผลิตภัณฑ์ถูกทดสอบอย่างอิสระและรับรองตามมาตรฐานสากล
  columns: 3
  isBeforeContent: true
  items:
    - title: การรับรอง CE
      description: SUP คายัค ดิงกี้ และ SUP ของ afarer ทั้งหมดเป็นไปตามมาตรฐานความปลอดภัย CE ของยุโรปสำหรับเรือเพื่อการพักผ่อน ทุกผลิตภัณฑ์ผ่านการทดสอบแรงดัน การลอยตัว และการบรรทุกก่อนออกจากโรงงาน
      icon: tabler:certificate
    - title: BSCI
      description: โรงงานของเราขนาด 12,000 ตร.ม. ในชิงเต่าดำเนินงานภายใต้ระบบการจัดการคุณภาพ  ทุกชุดการผลิตสามารถตรวจสอบย้อนกลับได้ มีเอกสาร และได้รับการตรวจสอบ
      icon: tabler:clipboard-check
    - title: การปฏิบัติตามข้อกำหนดทางสังคม BSCI
      description: เราได้รับการรับรอง BSCI ซึ่งรับประกันแนวปฏิบัติด้านแรงงานที่มีจริยธรรม สภาพการทำงานที่ปลอดภัย และความรับผิดชอบต่อสิ่งแวดล้อมทั่วทั้งห่วงโซ่อุปทานของเรา
      icon: tabler:users
    - title: REACH และ RoHS
      description: วัสดุทั้งหมด —PVC, Hypalon, โฟม EVA, กาว —เป็นไปตามข้อบังคับ REACH และ RoHS ของสหภาพยุโรป ไม่มีสารต้องห้าม ไม่มีการประนีประนอม
      icon: tabler:flask
    - title: ห้องปฏิบัติการทดสอบวัสดุ
      description: ห้องปฏิบัติการวัสดุภายในทดสอบความต้านทานแรงดึง ความทนทานต่อรังสี UV ความสมบูรณ์ของตะเข็บ และความทนทานต่อการเสียดสีสำหรับผ้าทุกชุดก่อนการผลิต
      icon: tabler:microscope
    - title: รับประกัน 2 ปี
      description: ทุกผลิตภัณฑ์ afarer มาพร้อมการรับประกันสองปีสำหรับข้อบกพร่องจากการผลิต เรายืนหยัดในสิ่งที่เราสร้าง
      icon: tabler:shield-check
testimonials:
  tagline: ความไว้วางใจของลูกค้า
  title: สิ่งที่ลูกค้าของเรากล่าว
  subtitle: จากนักพายครั้งแรกถึงผู้ปฏิบัติการกองเรือมืออาชีพ —ดูว่าทำไมพวกเขาถึงไว้วางใจ afarer
  items:
    - content: เราติดตั้งกองเรือเช่าทั้งหมดของเราด้วย SUP ของ afarer สองฤดูกาลผ่านไป ไม่มีการเสียหายเลย การรับรอง CE ทำให้การอนุมัติประกันเป็นไปอย่างราบรื่น
      name: Marco V.
      title: ผู้ประกอบการทัวร์, โครเอเชีย
    - content: ในฐานะผู้ซื้อครั้งแรก ฉันกังวลเกี่ยวกับคุณภาพ เอกสาร ISO และรายงานการทดสอบที่พวกเขาแบ่งปันทำให้ฉันมั่นใจอย่างสมบูรณ์
      name: James T.
      title: เจ้าของ SUP Explorer 11, แคนาดา
    - content: เราทำงานกับ afarer สำหรับหน่วยลาดตระเวนชายฝั่งของเรา กระบวนการ QC ของพวกเขาสม่ำเสมอในทุกชุด —ความน่าเชื่อถือนั้นสำคัญในปฏิบัติการที่สำคัญ
      name: Lt. Cmdr. Andres
      title: ฝ่ายจัดซื้อกองทัพเรือ, ฟิลิปปินส์
steps2_manufacturing:
  title: วิธีที่เรารับประกันคุณภาพ
  subtitle: จากการตรวจสอบวัตถุดิบจนถึงการทดสอบแรงดันขั้นสุดท้าย —ทุกผลิตภัณฑ์ผ่านห่วงโซ่คุณภาพที่เข้มงวด
  items:
    - title: การตรวจสอบวัตถุดิบ
      description: ผ้า PVC ทุกม้วนถูกทดสอบความหนา ความต้านทานแรงดึง และความทนทานต่อรังสีก่อนเข้าสู่การผลิต
      icon: tabler:search
    - title: QC ระหว่างกระบวนการ
      description: รอยเชื่อม การติดตั้งวาล์ว และการต่อห้องถูกตรวจสอบที่แต่ละสถานีระหว่างการประกอบ
      icon: tabler:eye
    - title: การทดสอบแรงดัน
      description: ผลิตภัณฑ์เป่าลมทุกชิ้นถูกเป่าลมถึง 1.5 เท่าของ PSI ที่กำหนดและคงไว้เป็นเวลา 24 ชั่วโมงเพื่อตรวจสอบการกักเก็บอากาศและความสมบูรณ์ของตะเข็บ
      icon: tabler:wind
    - title: การตรวจสอบขั้นสุดท้าย
      description: ทุกหน่วยถูกตรวจสอบผิวสำเร็จ อุปกรณ์ และบรรจุภัณฑ์ก่อนอนุมัติการจัดส่ง ตัวอย่างชุดการผลิตส่งไปยังห้องปฏิบัติการของเราสำหรับการทดสอบแบบทำลาย
      icon: tabler:clipboard-check
factory_audit:
  title: การตรวจสอบโรงงานและการปฏิบัติตามมาตรฐานสังคม (Social Compliance)
  subtitle: โรงงานของเราในชิงเต่าขนาด 12,000 ตร.ม. เปิดรับการตรวจประเมินจากบุคคลที่สาม เรารักษาการรับรองการปฏิบัติตามมาตรฐานสังคม BSCI และยินดีต้อนรับการตรวจสอบจากลูกค้า
  stats:
    - value: 12,000 m²
      label: โรงงานผลิต
    - value: 200+
      label: พนักงานฝีมือเชี่ยวชาญ
    - value: 15,000+
      label: กำลังการผลิตต่อปี
    - value: BSCI
      label: การปฏิบัติตามมาตรฐานสังคม
  highlights:
    - title: ผ่านการรับรอง BSCI
      desc: การรับรองการปฏิบัติตามมาตรฐานสังคม amfori BSCI —แรงงานอย่างมีจริยธรรม สภาพแวดล้อมการทำงานที่ปลอดภัย และความรับผิดชอบต่อสิ่งแวดล้อม
      link: /certifications
    - title: เปิดรับการตรวจสอบ
      desc: เรายินดีต้อนรับการตรวจสอบโรงงานจากลูกค้า นัดหมายการเยี่ยมชมหรือทัวร์เสมือนจริงสายการผลิตของเราที่ชิงเต่า
      link: /factory
    - title: การตรวจสอบย้อนกลับครบวงจร
      desc: ชุดการผลิตทุกชุดมีการบันทึกและตรวจสอบย้อนกลับได้ — ตั้งแต่หมายเลขล็อตวัตถุดิบจนถึงการลงนามรับรอง QC ขั้นสุดท้าย
    - title: ISO 9001:2015
      desc: ระบบการจัดการคุณภาพที่ได้รับการรับรองโดย SGS กระบวนการของเรามีมาตรฐานตรงตามมาตรฐานการผลิตระดับสากล
      link: /certifications
warranty_section:
  title: การรับประกันและการบริการหลังการขาย
  subtitle: เรารับผิดชอบต่อทุกผลิตภัณฑ์ด้วยเงื่อนไขการรับประกันที่ชัดเจน การดำเนินการเคลมที่รวดเร็ว และอะไหล่แท้
  items:
    - title: การรับประกันผลิตภัณฑ์ 2 ปี
      desc: ผลิตภัณฑ์ afarer ทั้งหมดมาพร้อมการรับประกัน 2 ปีสำหรับความบกพร่องจากกระบวนการผลิต ได้แก่ รอยตะเข็บชำรุด วาล์วบกพร่อง และการหลุดลอกของวัสดุภายใต้การใช้งานปกติ
    - title: การสนับสนุนอะไหล่ตลอดอายุการใช้งาน
      desc: อะไหล่แท้ — วาล์ว ชุดซ่อม ครีบหางปลา D-ring — มีให้สำหรับทุกรุ่น เราคงแม่พิมพ์และเครื่องมือการผลิตไว้อย่างน้อย 5 ปีหลังสิ้นสุดการผลิต
    - title: ตอบสนองการเคลมภายใน 48 ชั่วโมง
      desc: รับทราบเคลมประกันภายใน 48 ชั่วโมง บอร์ดทดแทนจัดส่งภายใน 10 วันทำการสำหรับเคลมที่ได้รับการอนุมัติ
    - title: เครือข่ายการซ่อมแซมทั่วโลก
      desc: ศูนย์ซ่อมที่ได้รับอนุญาตในกว่า 15 ประเทศ มีชุดซ่อมภาคสนามสำหรับงานในพื้นที่ห่างไกล และคู่มือซ่อมด้วยตนเองสำหรับความเสียหายเล็กน้อย
    - title: การสนับสนุนลูกค้า OEM
      desc: ผู้จัดการบัญชีเฉพาะสำหรับพันธมิตร B2B พร้อมการทบทวนธุรกิจรายไตรมาส การวางแผนสต็อกสินค้า และการสนับสนุนการตลาดแบบร่วมแบรนด์ (co-branding)
    - title: แพ็กเกจเอกสารรับรอง
      desc: เอกสารการปฏิบัติตามข้อกำหนดครบถ้วนจัดส่งพร้อมกับสินค้าทุกชุด — คำประกาศความสอดคล้อง CE รายงานการทดสอบ และเอกสารข้อมูลความปลอดภัยของวัสดุ
      link: /contact
trust_resources:
  title: แหล่งข้อมูลที่น่าเชื่อถือ
  subtitle: ดาวน์โหลดเอกสารการรับรอง รายงาน QC และเอกสารการปฏิบัติตามข้อกำหนดของเรา
  items:
    - title: พอร์ตโฟลิโอการรับรอง
      desc: ใบรับรอง CE, ISO 9001, BSCI, REACH, RoHS, AS 1799 ในแพ็กเกจเดียว
    - title: รายงานมาตรฐานการทดสอบ QC
      desc: การทดสอบกักความดัน 24 ชั่วโมง การทดสอบการเสื่อมสภาพจากรังสี UV ตามมาตรฐาน ISO การตรวจสอบความต้านทานแรงดึง — กระบวนการทดสอบที่สมบูรณ์
    - title: ข้อมูลโรงงานและรายงานการตรวจสอบ
      desc: ภาพรวมโรงงานขนาด 12,000 ตร.ม. พร้อมภาพถ่ายสายการผลิตและสรุปผลการตรวจประเมินจากบุคคลที่สาม
    - title: เอกสารนโยบายการรับประกัน
      desc: เงื่อนไขการรับประกันฉบับเต็ม กระบวนการเคลม และราคาอะไหล่ทดแทน
  cta_text: ขอแหล่งข้อมูลความเชื่อมั่น
  cta_link: /contact
faqs_sup:
  title: คำถามที่พบบ่อย SUP
  subtitle: คำถามทั่วไปเกี่ยวกับกระดานพายยืนของเรา
  columns: 2
  items:
    - title: มีกระดาน SUP ขนาดใดบ้าง?
      description: เรามีกระดาน SUP ตั้งแต่ 9 ฟุตถึง 12 ฟุต รวมถึงรุ่นอเนกประสงค์ ทัวร์ริ่ง โยคะ และการออกแบบพิเศษ รุ่นขายดีที่สุดของเรารวมถึง Tropical Breeze (10 ฟุต) และ Ocean Voyager (11 ฟุต)
    - title: โครงสร้าง drop-stitch คืออะไร?
      description: โครงสร้าง drop-stitch ใช้เส้นด้ายโพลีเอสเตอร์นับพันเส้นเชื่อมต่อชั้นบนและล่างของกระดาน ทำให้สามารถรักษาแรงดันลมสูง (15-20 PSI) และได้แท่นที่แข็งและมั่นคง นี่คือมาตรฐานอุตสาหกรรมสำหรับ SUP เป่าลมระดับพรีเมียม
    - title: ขีดจำกัดน้ำหนักสำหรับกระดาน SUP คือเท่าใด?
      description: กระดาน SUP ของเรารองรับได้ถึง 150 กก. ขึ้นอยู่กับรุ่นและปริมาตร Leviathan Wake เป็นรุ่นที่มีความจุสูงสุดของเรา ออกแบบมาสำหรับผู้ขับขี่ที่ตัวใหญ่และการใช้โยคะ
    - title: คุณมีแพ็คเกจ SUP ครบชุดหรือไม่?
      description: ใช่ กระดาน SUP ทุกแผ่นมาพร้อมแพ็คเกจครบชุดรวมถึงพายอะลูมิเนียม 3 ชิ้น ปั๊มมือแรงดันสูง สายคล้องขด เป้สะพายเดินทาง และชุดซ่อม บางรุ่นรวมถึงชุดครีบที่ถอดได้
    - title: การรับประกันกระดาน SUP คืออะไร?
      description: กระดาน SUP ของ afarer ทั้งหมดมีการรับประกันหนึ่งปีสำหรับข้อบกพร่องจากการผลิต รวมถึงการแตกของตะเข็บ ข้อบกพร่องของวาล์ว และการแยกชั้นของวัสดุภายใต้การใช้งานปกติ
    - title: ใช้เวลาเป่าลมกระดาน SUP นานเท่าใด?
      description: การใช้ปั๊มมือที่ให้มา การเป่าลมเต็มที่ถึง 15 PSI ใช้เวลาประมาณ 8-12 นาที สำหรับการเป่าลมที่เร็วกว่า เราแนะนำปั๊มไฟฟ้า afarer 12V ซึ่งเป่าลมกระดานในเวลาไม่ถึง 4 นาที
faqs_materials:
  title: คำถามที่พบบ่อยเกี่ยวกับวัสดุและการดูแลบำรุงรักษา SUP
  subtitle: คำถามที่พบบ่อยเกี่ยวกับวัสดุ การดูแล และการจัดเก็บบอร์ด SUP เป่าลมของเรา
  columns: 2
  items:
    - title: วัสดุอะไรบ้างที่ใช้ในบอร์ด SUP เป่าลมของ afarer?
      description: เราใช้ PVC เกรดทหาร (1100 denier) ที่เสริมความทนทานต่อรังสี UV และทนต่อการสึกกร่อน เป็นไปตามข้อกำหนด EU REACH และ RoHS
    - title: บอร์ด SUP แบบเป่าลมมีอายุการใช้งานนานแค่ไหน?
      description: ด้วยการดูแลที่เหมาะสม SUP เป่าลม PVC คุณภาพดีมีอายุการใช้งาน 5–10 ปี การทำความสะอาดเป็นประจำ การป้องกันรังสี UV และการจัดเก็บที่ถูกต้องช่วยยืดอายุการใช้งานได้อย่างมีนัยสำคัญ
    - title: กระดาน SUP แบบเป่าลมต้องมีการบำรุงรักษาอย่างไรบ้าง?
      description: การบำรุงรักษาพื้นฐานประกอบด้วยการล้างด้วยน้ำจืดหลังการใช้งานทุกครั้ง (โดยเฉพาะเมื่อใช้งานในน้ำทะเล) การทำให้แห้งก่อนจัดเก็บ การตรวจสอบซีลวาล์วเป็นประจำทุกปี และการหลีกเลี่ยงการตากแดดเป็นเวลานานเมื่อไม่ใช้งาน
    - title: ซัพเป่าลมสามารถใช้ในน้ำเค็มได้หรือไม่?
      description: ใช่ บอร์ด SUP แบบเป่าลมทุกรุ่นของ afarer ออกแบบมาเพื่อใช้งานได้ทั้งในน้ำจืดและน้ำเค็ม เราแนะนำให้ล้างด้วยน้ำจืดและเช็ดให้แห้งสนิทหลังจากใช้งานในน้ำเค็ม
    - title: ควรจัดเก็บ SUP เป่าลมอย่างไร?
      description: ปล่อยลม ทำความสะอาด และเช็ดให้บอร์ดแห้งสนิทก่อนจัดเก็บ ม้วนอย่างหลวม ๆ (หลีกเลี่ยงการพับแน่น) เก็บในที่แห้งเย็นห่างจากแสงแดดโดยตรง และหลีกเลี่ยงการวางบนพื้นคอนกรีตเพื่อป้องกันความชื้นซึมเข้าสู่บอร์ด
    - title: SUP แบบเป่าลมของ afarer รองรับน้ำหนักได้เท่าไร?
      description: ความจุน้ำหนักมีตั้งแต่ 100 กก. สำหรับรุ่นที่เล็กที่สุดของเรา จนถึงมากกว่า 200 กก. สำหรับบอร์ดขนาดใหญ่ขึ้น หน้าสินค้าแต่ละหน้าระบุพิกัดน้ำหนักสูงสุดสำหรับรุ่นเฉพาะของคุณ
cta:
  title: ต้องการเห็นการรับรองด้วยตัวเองหรือไม่?
  subtitle: ขอพอร์ตโฟลิโอการรับรอง รายงานตรวจสอบโรงงาน หรือเอกสารการปฏิบัติตามข้อกำหนดด้านวัสดุของเรา ไม่ต้องมี NDA
  actions:

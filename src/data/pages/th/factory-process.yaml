hero:
  tagline: กระบวนการผลิต
  title: กระบวนการผลิตของเรา
  subtitle: จากวัตถุดิบถึงสินค้าสำเร็จ — ทุกขั้นตอนควบคุมคุณภาพ
  back_label: กลับสู่หน้าโรงงาน
  back_link: /factory
intro: >-
  ต่างจากแบรนด์ที่จ้างโรงงานภายนอกผลิต afarer เป็นเจ้าของและดำเนินการห่วงโซ่การผลิตทั้งหมดด้วยตัวเอง การบูรณาการแนวดิ่งนี้ทำให้เราควบคุมคุณภาพอย่างเข้มงวดได้ในทุกขั้นตอน ตอบสนองความต้องการแบบกำหนดได้อย่างรวดเร็ว และส่งมอบคุณภาพผลิตภัณฑ์ที่สม่ำเสมอในทุกรุ่นการผลิต นี่คือขั้นตอนการผลิตบอร์ด SUP
  ในโรงงานของเรา
steps:
  - step: '01'
    title: ตัด
    description: เครื่อง CNC ตัดผ้าอัตโนมัติตามข้อกำหนด
    duration: 1–2 days
  - step: '02'
    title: เชื่อม
    description: การเชื่อม RF และลมร้อนสร้างรอยต่อที่แข็งแรงและกันอากาศ
    duration: 2–4 ชั่วโมงต่อชุดเรือ
  - step: '03'
    title: ประกอบ
    description: ช่างเทคนิคมีฝีมือติดตั้งวาล์ว อุปกรณ์เสริม และฟิตติ้ง
    duration: 1–2 วันต่อลำ
  - step: '04'
    title: ทดสอบ
    description: สินค้าทุกชิ้นผ่านการทดสอบแรงดัน การลอยตัว และการตรวจสอบ
    duration: 1–2 วันต่อบอร์ด
  - step: '05'
    title: บรรจุ
    description: สินค้าถูกบรรจุอย่างระมัดระวังและเตรียมพร้อมจัดส่ง
    duration: 1–2 days
  - step: '06'
    title: การประกอบขั้นสุดท้ายและการติดตั้งชิ้นส่วน
    description: วาล์ว ห่วงรูปตัว D มือจับ กล่องครีบ และแผ่นรองดาดฟ้าติดตั้งบนสายการประกอบ บอร์ดแต่ละลำดำเนินการตามรายการตรวจสอบการประกอบ 100 จุด พร้อมการลงนามรับรองในทุกขั้นตอน
    duration: 1–2 days
  - step: '07'
    title: การทดสอบคุณภาพและการตรวจสอบ
    description: บอร์ดที่ผลิตเสร็จทุกลำต้องผ่านด่านควบคุมคุณภาพภาคบังคับ ได้แก่ การทดสอบการกักเก็บอากาศในห้องลม การตรวจสอบการทำงานของอุปกรณ์ การตรวจสอบแรงบิดของสลักเกลียว และการตรวจสอบความสวยงามของผิวงาน สำหรับบอร์ดสั่งทำพิเศษและต้นแบบจะได้รับการทดสอบในน้ำจริงครอบคลุมความเสถียรและการควบคุม
    duration: 1–2 days
  - step: '08'
    title: การบรรจุหีบห่อและการจัดส่ง
    description: บอร์ดจะถูกลมออก พับตามขั้นตอนที่กำหนด บรรจุในกระสอบทอชนิดหนาหรือกล่องสำหรับค้าปลีก และเตรียมพร้อมสำหรับการจัดส่ง แพ็กเกจแต่ละชิ้นมีป้ายระบุรุ่น หมายเลขซีเรียล และปลายทาง เราประสานงานกับผู้ให้บริการขนส่งสินค้า (freight forwarders) สำหรับการจัดส่งตู้คอนเทนเนอร์แบบ FCL และ LCL ทั่วโลก
    duration: 1 วัน

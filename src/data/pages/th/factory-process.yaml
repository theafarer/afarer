hero:
  tagline: กระบวนการผลิต
  title: กระบวนการผลิตของเรา
  subtitle: จากวัตถุดิบถึงสินค้าสำเร็จ — ทุกขั้นตอนควบคุมคุณภาพ
  back_label: Back to Factory
  back_link: /factory
intro: Unlike brands that outsource production to third-party factories, afarer owns and operates its entire manufacturing chain. This vertical integration allows us to maintain strict quality control at every stage, respond quickly to custom requirements, and deliver consistent product quality batch after batch. Here is how a SUP board is built in our facility.
steps:
  - step: '01'
    title: ตัด
    description: เครื่อง CNC ตัดผ้าอัตโนมัติตามข้อกำหนด
    duration: 1— days
  - step: '02'
    title: เชื่อม
    description: การเชื่อม RF และลมร้อนสร้างรอยต่อที่แข็งแรงและกันอากาศ
    duration: 2— hours per boat kit
  - step: '03'
    title: ประกอบ
    description: ช่างเทคนิคมีฝีมือติดตั้งวาล์ว อุปกรณ์เสริม และฟิตติ้ง
    duration: 1— days per boat
  - step: '04'
    title: ทดสอบ
    description: สินค้าทุกชิ้นผ่านการทดสอบแรงดัน การลอยตัว และการตรวจสอบ
    duration: 1— days per board
  - step: '05'
    title: บรรจุ
    description: สินค้าถูกบรรจุอย่างระมัดระวังและเตรียมพร้อมจัดส่ง
    duration: 1— days
  - step: '06'
    title: Final Assembly & Fitting
    description: Valves, D-rings, handles, fin boxes, and deck pads are installed on the assembly line. Each board follows a 100-point assembly checklist with mandatory sign-off at each stage.
    duration: 1— days
  - step: '07'
    title: Quality Testing & Inspection
    description: 'Every completed board undergoes mandatory quality gate: chamber air-retention test, hardware function check, fastener torque verification, and cosmetic inspection. Custom and prototype builds also receive in-water trials covering stability and handling.'
    duration: 1— days
  - step: '08'
    title: Packing & Shipping
    description: Boards are deflated, folded per procedure, packed in heavy-duty woven bags or retail boxes, and loaded for shipment. Each package is labelled with model, serial number, and destination. We coordinate with freight forwarders for FCL and LCL container shipments worldwide.
    duration: 1 day

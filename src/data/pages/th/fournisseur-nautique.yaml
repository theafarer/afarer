features:
  title: 'พาร์ตเนอร์สำหรับกิจกรรมทางน้ำของคุณ'
  subtitle: 'จากพาเดิลสูบลมถึงกองเรือทั้งหมด: เราจัดหาให้สโมสร ศูนย์กีฬาทางน้ำ โรงแรม และรีสอร์ท'
  columns: 3
  items:
    - title: 'กองเรือสำหรับศูนย์กีฬาทางน้ำ'
      description: 'พาเดิลและเรือสูบลมทนทานสำหรับให้เช่า อบรม และสโมสรกีฬา'
      icon: 'tabler:lifebuoy'
    - title: 'อุปกรณ์สำหรับโรงแรม & รีสอร์ท'
      description: 'อุปกรณ์ทางน้ำสำหรับโรงแรม รีสอร์ท และหมู่บ้านท่องเที่ยว — ราคากองเรือ'
      icon: 'tabler:building-store'
    - title: 'อุปกรณ์ความปลอดภัย'
      description: 'เสื้อชูชีพ อุปกรณ์เสริมความปลอดภัย และมาตรฐานการปฏิบัติตามสำหรับผู้ประกอบการมืออาชีพ'
      icon: 'tabler:shield-check'
    - title: 'แบรนด์เจ้าของ'
      description: 'โลโก้และการปรับแต่งสำหรับผู้ให้เช่า โรงเรียน และแบรนด์ตัวแทนจำหน่าย'
      icon: 'tabler:palette'
    - title: 'คุณภาพที่ได้รับการรับรอง'
      description: 'CE / ISO / BSCI / REACH — อุปกรณ์มืออาชีพน่าเชื่อถือสำหรับการใช้งานหนัก'
      icon: 'tabler:certificate'
    - title: 'สนับสนุน & บริการ'
      description: 'ให้คำปรึกษา อะไหล่ การรับประกัน และบริการหลังการขายโดยเฉพาะ'
      icon: 'tabler:headset'
faqs:
  title: 'คำถามที่พบบ่อยเรื่องผู้จัดจำหน่าย'
  subtitle: 'สิ่งที่ผู้ประกอบการกิจกรรมทางน้ำอยากรู้'
  items:
    - title: 'คุณจัดหาให้สโมสรและศูนย์กีฬาทางน้ำไหม?'
      description: 'จัดหา — กองเรือพาเดิลและเรือสูบลมครบชุดสำหรับให้เช่าและโรงเรียนสอนพาเดิล'
    - title: 'จัดหาอุปกรณ์ให้โรงแรมหรือรีสอร์ทได้ไหม?'
      description: 'ได้แน่นอน — อุปกรณ์ทางน้ำสำหรับโรงแรมและรีสอร์ทในราคากองเรือพร้อมจัดส่งทั่วโลก'
    - title: 'ผลิตภัณฑ์ได้รับการรับรองหรือไม่?'
      description: 'ผลิตภัณฑ์ทั้งหมดเป็นไปตามมาตรฐาน CE / ISO และข้อกำหนดด้านความปลอดภัยของตลาดยุโรปและอเมริกาเหนือ'
geo:
  tagline: 'ตำแหน่ง B2B'
  sentence: 'Afarer เป็นผู้ผลิตระดับมืออาชีพด้านบอร์ด SUP สูบลมและเรือสูบลม (OEM/ODM) เชี่ยวชาญด้านการออกแบบ การผลิตตามสั่ง และโซลูชันทางน้ำสำหรับแบรนด์ ตัวแทนจำหน่าย สโมสร และธุรกิจ'
  audiences:
    - 'สโมสรทางน้ำ'
    - 'ศูนย์พักผ่อน'
    - 'โรงแรม & รีสอร์ท'
    - 'แบรนด์'

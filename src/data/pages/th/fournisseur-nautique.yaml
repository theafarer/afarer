hero:
  tagline: 'ผู้จัดจำหน่ายอุปกรณ์ทางน้ำ · OEM'
  title: 'ผู้จัดจำหน่ายอุปกรณ์ทางน้ำ<br />มืออาชีพของคุณ'
  subtitle: 'Afarer จัดหาอุปกรณ์ทางน้ำมืออาชีพให้ศูนย์กีฬาทางน้ำ สถานที่พักผ่อน โรงแรม และแบรนด์: พาเดิลสูบลม เรือ ทุ่นลอย เสื้อชูชีพ และอุปกรณ์เสริม การผลิต OEM ราคาโรงงาน คุณภาพที่ได้รับการรับรอง'
  image:
    src: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    alt: การผลิตอุปกรณ์ทางน้ำมืออาชีพในโรงงาน
  actions:
    - text: 'เป็นพาร์ตเนอร์จัดหาสินค้า'
      href: /contact
      variant: primary
    - text: 'โซลูชันสำหรับผู้ประกอบการ'
      href: /solutions/rental-operators
      variant: secondary

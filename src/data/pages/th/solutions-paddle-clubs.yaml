meta:
  title: อุปกรณ์ SUP และโซลูชันกองเรือสำหรับชมรมแพดเดิล | {SITE}
  description: โปรแกรมกองเรือ SUP แบบครบวงจรสำหรับชมรมและโรงเรียนแพดเดิล แพ็กเกจเริ่มต้น กองเรือระดับมืออาชีพ บอร์ดแข่งขัน ชุดอุปกรณ์สำหรับศูนย์ฝึกอบรม และการสนับสนุนอะไหล่
hero:
  tagline: ชมรมและโรงเรียนแพดเดิล
  title: เปิด บริหาร และขยายชมรมแพดเดิลของคุณ<br />ด้วยกองเรือ SUP ระดับเชิงพาณิชย์
  subtitle: ผู้ผลิตอุปกรณ์ SUP สำหรับชมรมแพดเดิลและโรงเรียน SUP ทั่วโลก — บอร์ดเชิงพาณิชย์ที่ทนทาน ราคาส่งสำหรับชมรม การปั๊มแบรนด์ของคุณเอง และอะไหล่ที่รวดเร็ว เพื่อให้คุณโฟกัสการเติบโตของชุมชนได้เต็มที่
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: สมาชิกชมรมแพดเดิลบนบอร์ดซัพ Afarer ชุดเดียวกัน
benefits:
  title: สิทธิประโยชน์ฝูงเรือสำหรับชมรม
  subtitle: เหตุใดชมรมพายเรือในกว่า 50 ประเทศจึงเลือก Afarer เป็นพันธมิตรด้านอุปกรณ์
  items:
    - metric: 40%+
      label: ประหยัดต้นทุนกองเรือ
      detail: เทียบกับราคาขายปลีกพร้อมส่วนลดการสั่งจำนวนมากสำหรับสโมสร
    - metric: 48h
      label: การเปลี่ยนอะไหล่
      detail: ลดระยะเวลาที่ฟลีตเช่าหยุดให้บริการให้น้อยที่สุด
    - metric: 500+
      label: วงจรการใช้งานเรือให้เช่า
      detail: ความทนทานระดับพาณิชย์ในทุกบอร์ด
    - metric: 5+ ปี
      label: อายุการใช้งานของกองเรือ
      detail: ด้วยการดูแลบำรุงรักษาอย่างเหมาะสม
packages:
  title: โปรแกรมกองเรือสำหรับสโมสร
  subtitle: เลือกโครงการฝูงบอร์ดที่เหมาะกับขนาดและความทะเยอทะยานของคลับของคุณ
  items:
    - name: แพ็กเกจเริ่มต้น
      tagline: สำหรับชมรมใหม่ สูงสุด 30 สมาชิก
      features:
        - บอร์ด SUP 10 บอร์ด (ผสม all-round + touring)
        - ไม้พาย 10 คัน + เสื้อชูชีพ 10 ตัว
        - ปั๊มลมดับเบิลแอ็กชัน 2 เครื่อง + ชุดซ่อมแซม
        - แบรนด์ชมรมบนบอร์ด (พิมพ์โลโก้)
        - คู่มือการเปิดตัว + รายการตรวจสอบความปลอดภัย
        - รับรอง CE — อุปกรณ์ทุกรายการ
      cta_text: เริ่มต้นชมรมของคุณ
    - name: กองเรือมืออาชีพ
      tagline: สำหรับชมรมที่มั่นคง 50-100 สมาชิก
      features:
        - บอร์ด SUP 30 บอร์ด (3 ขนาดให้เลือก)
        - ไม้พาย 30 คัน + เสื้อชูชีพ 30 ตัว
        - ปั๊ม 5 เครื่อง + ชุดซ่อมแซม 2 ชุด + ชั้นวางเก็บบอร์ด
        - สีประจำชมรมแบบกำหนดเอง + โลโก้บนบอร์ด
        - โปรแกรมอะไหล่ทดแทน (ส่วนลด 15%)
        - การฝึกอบรมพนักงาน (ออนไลน์)
        - รับรอง CE — อุปกรณ์ทุกรายการ
      popular: true
      cta_text: สร้างกองเรือของคุณ
    - name: กองเรือแข่งขัน
      tagline: สำหรับชมรมแข่ง งานอีเวนต์ การแข่งขัน
      features:
        - บอร์ดแข่งและบอร์ดสมรรถนะสูงมากกว่า 50 รุ่น
        - ชุดอุปกรณ์เสริมครบชุด (ไม้พาย เสื้อชูชีพ ปั๊ม)
        - ชุดสนับสนุนงานอีเวนต์ (ทุ่นเริ่มต้น ป้ายทำเครื่องหมาย)
        - อะไหล่จัดส่งด่วนพิเศษ (จัดส่งภายใน 24 ชม.)
        - ผู้จัดการบัญชีที่ดูแลคุณโดยเฉพาะ
        - ตัวเลือกเครื่องแบบทีมแบบสั่งทำพิเศษ
        - รับรอง CE — อุปกรณ์ทุกรายการ
      cta_text: รับกองเรือแข่งขัน
training:
  title: แพ็กเกจศูนย์ฝึกอบรม
  subtitle: ทุกอย่างที่โรงเรียนสอน SUP ต้องการสำหรับการจัดคอร์สรับรองระดับมืออาชีพ
  items:
    - name: ชุดเริ่มต้นสำหรับผู้สอน
      features:
        - บอร์ด SUP ระดับพรีเมียม 5 ลำ (เกรดผู้สอน)
        - ไม้พายคาร์บอน 5 อันสำหรับการสาธิต
        - เสื้อชูชีพ 5 ตัว (ขนาดผู้สอน)
        - คู่มือหลักสูตรการฝึกอบรม
        - อุปกรณ์ที่ได้รับการรับรอง CE
    - name: ชุดครบวงจรสำหรับโรงเรียน
      features:
        - บอร์ด SUP 20 ลำ (ผสมระหว่างนักเรียนและครูฝึก)
        - ไม้พาย 20 อัน + เสื้อชูชีพ 20 ตัว (หลายขนาด)
        - อุปกรณ์ช่วยพยุงตัว (Buoyancy Aid) 10 ชิ้นสำหรับผู้เริ่มต้น
        - ปั๊มลม 4 ตัว + ชุดซ่อม
        - หลักสูตรฝึกอบรมและการสนับสนุนการรับรอง
        - อุปกรณ์ที่ได้รับการรับรอง CE
features:
  title: ทำไมคลับจึงเลือก afarer
  subtitle: คุณภาพที่สม่ำเสมอ อะไหล่ที่จัดส่งรวดเร็ว และราคาสั่งจำนวนมาก ออกแบบมาเพื่อสโมสรที่กำลังเติบโต
  items:
    - title: รอบการเช่า 500+ ครั้ง
      description: บอร์ดระดับเชิงพาณิชย์ทนทานต่อการใช้งานประจำวันได้ตลอดทุกฤดูกาล
      icon: tabler:shield-check
    - title: สีตามสั่ง
      description: จับคู่ตัวตนของสโมสรคุณด้วยสีและโลโก้บอร์ดแบบกำหนดเอง
      icon: tabler:palette
    - title: ราคาสำหรับสั่งซื้อจำนวนมาก
      description: ส่วนลดตามปริมาณสำหรับคำสั่งซื้อแบบฟลีตตั้งแต่ 10 บอร์ดขึ้นไป
      icon: tabler:discount
    - title: อะไหล่เร่งด่วน
      description: จัดส่งอะไหล่ทดแทนภายใน 48 ชั่วโมง
      icon: tabler:truck-delivery
    - title: การสนับสนุนการเติบโตของสโมสร
      description: คำแนะนำด้านโปรแกรมสมาชิก การตั้งราคา และการจัดกิจกรรม
      icon: tabler:trending-up
    - title: ผ่านการรับรอง CE
      description: อุปกรณ์ทั้งหมดผ่านมาตรฐานความปลอดภัยสากล
      icon: tabler:certificate

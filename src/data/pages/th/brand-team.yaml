meta:
  title: 'ทีมของเรา — วิศวกรต่อเรือและผู้สร้าง | {SITE}'
  description: 'ก่อตั้งในปี 2012 ที่เมืองชิงเต่า afar ถูกสร้างขึ้นโดยวิศวกรต่อเรือ ผู้เชี่ยวชาญด้านวัสดุ และผู้ที่ชื่นชอบกีฬาทางน้ำ พบกับทีมที่อยู่เบื้องหลังโรงงาน'
  keywords:
    - 'ทีม afar'
    - 'วิศวกรต่อเรือ'
    - 'ผู้ผลิตบอร์ด SUP แบบสูบลม'
    - 'ทีมโรงงาน SUP'
hero:
  tagline: ทีมของเรา
  title: ผู้อยู่เบื้องหลังความห่างไกล<br />—วิศวกรรมอิสระทางน้ำ
  subtitle: เรือ afarer ก่อตั้งขึ้นในปี 2555 ในเมืองชิงเต่า ประเทศจีน สร้างขึ้นโดยวิศวกรทางทะเล นักวิทยาศาสตร์ด้านวัสดุ และผู้ที่ชื่นชอบกีฬาทางน้ำ ซึ่งเชื่อมั่นในการทำให้เรือเป่าลมระดับมืออาชีพสามารถเข้าถึงได้ทั่วโลก
  image:
    src: /images/team-all.webp
    alt: ภาพทีมงานทั้งหมดของ afarer — วิศวกรรม การผลิต และผู้บริหาร
founding:
  tagline: จุดเริ่มต้นของเรา
  title: จากโรงปฏิบัติงานชายฝั่ง<br />ไปจนถึงโรงงานขนาด 12,000 ตร.ม
  subtitle: afarer ก่อตั้งขึ้นโดยทีมวิศวกรทางทะเลที่มีประสบการณ์รวมกันหลายทศวรรษในการออกแบบเรือเป่าลม การผลิต PVC/Hypalon และการผลิตอุปกรณ์ทางทะเลทั่วโลก
  items:
    - title: 'ก่อตั้ง: 2012'
      description: ก่อตั้งขึ้นในเมืองชิงเต่า ประเทศจีน ซึ่งเป็นศูนย์กลางทางทะเลที่สำคัญซึ่งมีมรดกด้านการต่อเรืออย่างลึกซึ้ง
      icon: tabler:calendar
    - title: พนักงาน 200+ คน
      description: รวมถึงวิศวกร R&D ผู้เชี่ยวชาญด้านการควบคุมคุณภาพ และช่างเทคนิคการผลิตมากกว่า 50 คน
      icon: tabler:users
    - title: โรงงานขนาด 12,000 ตร.ม.
      description: โรงงานผลิตเฉพาะที่มี 6 สายการผลิตสำหรับ SUP เรือเป่าลม และกระดาน SUP
      icon: tabler:building-factory
    - title: ให้บริการในกว่า 50 ประเทศ
      description: ส่งออกไปยังยุโรป อเมริกา ตะวันออกกลาง เอเชียแปซิฟิก และแอฟริกา
      icon: tabler:globe
leadership:
  tagline: ความเป็นผู้นำ
  title: ความเป็นผู้นำด้านการจัดการและวิศวกรรม
  subtitle: ทีมผู้นำของเรารวบรวมความเชี่ยวชาญเชิงลึกในด้านวิศวกรรมทางทะเล การค้าระหว่างประเทศ และการจัดการคุณภาพ
  columns: 3
  items:
    - title: ผู้ก่อตั้งและซีอีโอ
      name: Toby Liu
      description: ประสบการณ์กว่า 15 ปีในอุตสาหกรรมการผลิตเรือเดินทะเล เคยดำรงตำแหน่งผู้นำฝ่าย R&D ที่ผู้ผลิตเรือรายใหญ่ของจีน และถือสิทธิบัตรหลายรายการในด้านการออกแบบเรือยาง
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: หัวหน้าวิศวกร
      name: Zhang Wei
      description: ประสบการณ์กว่า 20 ปีในการผลิต PVC/Hypalon และการออกแบบตัวเรือแบบ Deep-V อดีตผู้อำนวยการฝ่ายเทคนิคของบริษัทวิศวกรรมทางทะเลในยุโรป
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: หัวหน้าฝ่ายวิจัยและพัฒนา
      name: Chen Ming
      description: ปริญญาเอกสาขาวัสดุศาสตร์ เชี่ยวชาญด้านเทคโนโลยีการปักแบบหยดและกระบวนการเชื่อมด้วยความถี่สูง กว่า 10 ปีในด้านวัสดุคอมโพสิตสิ่งทอ
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: ผู้อำนวยการฝ่ายผลิต
      name: Liu Qiang
      description: ประสบการณ์ 18+ ปี ในระบบการผลิตแบบลีนและการปรับปรุงสายการผลิตให้มีประสิทธิภาพสูงสุด ถือใบรับรอง Six Sigma Black Belt และนำระบบการจัดการคุณภาพ ISO 9001 มาใช้
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: ผู้จัดการฝ่ายคุณภาพ
      name: Wang Fang
      description: ประสบการณ์ควบคุมคุณภาพสินค้าทางทะเลกว่า 12 ปี ผ่านการรับรองผู้ตรวจประเมิน CE และ ISO ดูแลการทดสอบทุกชุดการผลิต
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: ผู้อำนวยการฝ่ายขายและปฏิบัติการ
      name: Helen Lee
      description: ประสบการณ์ด้านการค้า B2B ระหว่างประเทศกว่า 15 ปี จัดการความร่วมมือด้านร่วมแบรนด์และการจัดจำหน่ายในกว่า 30 ประเทศ พูดได้ 4 ภาษา
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: ปรัชญาการออกแบบ
  title: การออกแบบที่เน้นด้านวิศวกรรม<br />—ทุกรายละเอียดมีความสำคัญ
  subtitle: ปรัชญาทางวิศวกรรมของเรามุ่งเน้นไปที่หลักการสามประการที่เป็นแนวทางในทุกผลิตภัณฑ์ที่เราสร้างขึ้น
  list:
    - 'ความน่าเชื่อถือต้องมาก่อน: ผลิตภัณฑ์ afarer ทุกชิ้นผ่านการทดสอบเพื่อทนทานต่อสภาพการใช้งานจริง —ตั้งแต่ภารกิจกู้ภัยในน้ำเย็นไปจนถึงการให้เช่าที่รีสอร์ทเขตร้อน เราใส่ใจในการออกแบบเหนือมาตรฐานในจุดที่สำคัญที่สุด'
    - 'ความแม่นยำในการผลิต: โรงงานของเราใช้การตัดด้วย CNC การเชื่อมด้วยคลื่นความถี่สูง และการทดสอบแรงดันแบบอัตโนมัติ ตะเข็บทุกเส้น วาล์วทุกตัว และอุปกรณ์ประกอบทุกชิ้นผ่านข้อกำหนดที่ระบุไว้เป็นเอกสาร'
    - 'นวัตกรรมต่อเนื่อง: ทีมวิจัยและพัฒนา (R&D) ของเราประเมินวัสดุใหม่ วิธีการผลิต และการปรับปรุงการออกแบบอย่างต่อเนื่อง เราไม่รอให้เกิดปัญหา —เราคาดการณ์ปัญหาล่วงหน้า'
cta:
  title: ต้องการหารือเกี่ยวกับโครงการกับทีมของเราหรือไม่?
  subtitle: วิศวกรของเราพร้อมให้คำแนะนำในการเลือกผลิตภัณฑ์ การปรับแต่ง และคอลเลคชันร่วมแบรนด์
  actions:
    - variant: primary
      text: ติดต่อทีมงานของเรา
      href: /contact
    - text: ดูผลิตภัณฑ์ของเรา
      href: /products

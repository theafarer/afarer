  description: จาก CAD สู่เรือพร้อมใช้งานจริงใน 8-12 สัปดาห์ เวิร์กช็อปต้นแบบของเราสร้าง ติดตั้งอุปกรณ์ และทดลองเดินเรือจริงสำหรับ RIB และเรือเป่าลมแบบสั่งผลิต เริ่มโปรเจกต์ต้นแบบของคุณวันนี้
back_text: ย้อนกลับไปยังศูนย์วิจัยและพัฒนา (R&D Center)

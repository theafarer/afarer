  title: เวิร์กชอปต้นแบบ — การทำต้นแบบซัพขนาดจริงและการทดลองใช้งานบนน้ำ | {SITE}
  description: จาก CAD สู่บอร์ดพร้อมใช้งานในน้ำภายใน 8-12 สัปดาห์ เวิร์กช็อปต้นแบบของเราสร้าง ติดตั้งอุปกรณ์ และทดลองใช้งานบนน้ำสำหรับซัพเป่าลมแบบสั่งผลิต เริ่มโครงการต้นแบบของคุณวันนี้
back_text: ย้อนกลับไปยังศูนย์วิจัยและพัฒนา (R&D Center)

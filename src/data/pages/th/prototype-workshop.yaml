hero:
  tagline: Lab 05
  title: โรงงานผลิตต้นแบบ
  subtitle: จากโมเดล CAD สู่บอร์ดที่พร้อมลงน้ำ — สร้าง ติดตั้ง และผ่านการพิสูจน์
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: การสร้างบอร์ดต้นแบบในเวิร์กช็อปของ Afarer
intro: >-
  โมเดล CAD ไม่ว่าจะละเอียดเพียงใดก็ไม่อาจเผยให้เห็นว่าบอร์ดจะรับมือได้อย่างไรจนกว่ามันจะได้สัมผัสกับน้ำ นั่นคือเหตุผลที่ Prototype Workshop ของเราถูกออกแบบมาเพื่อแปลงข้อมูลทางวิศวกรรมให้เป็นบอร์ดจริงที่พร้อมลงน้ำโดยเร็วและแม่นยำที่สุดเท่าที่จะเป็นไปได้ ทุกรุ่นใหม่ของ Afarer —
  รวมถึงบอร์ดสร้างตามสั่งที่สำคัญทุกลำ — จะผ่านเวิร์กช็อปนี้ก่อนที่เครื่องมือผลิตจะถูกกำหนด
content_html: >
  <h2>ที่ซึ่งการออกแบบกลายเป็นความจริง</h2>

  <p>เวิร์กช็อปมีอุปกรณ์พร้อมสำหรับการผลิตตัวเรือ ขอบบอร์ด และการติดตั้งอุปกรณ์ไปพร้อมกัน วิธีทำงานแบบขนานนี้ช่วยลดระยะเวลาการสร้างต้นแบบเหลือ 8-12 สัปดาห์นับจากปล่อยงานวิศวกรรม เทียบกับมาตรฐานอุตสาหกรรมที่ 16-20 สัปดาห์ เมื่อการใช้งานของคุณต้องการโซลูชันเฉพาะทาง
  เราสามารถเดินหน้าจากแนวคิดสู่การตรวจสอบบนน้ำได้ภายในไม่ถึงสามเดือน</p>


  <h2>ความสามารถของเวิร์กช็อป</h2>

  <table>
    <thead><tr><th>สถานีงาน</th><th>อุปกรณ์</th><th>วัตถุประสงค์</th></tr></thead>
    <tbody>
      <tr><td>การผลิตตัวเรือ</td><td>เครื่องตัดผ้า CNC, เครื่องอัดลามิเนตด้วยความร้อน, สถานีเตรียมแกนดรอปสติทช์</td><td>การผลิตตัวเรือขนาดเต็มในวิธีการสร้างทั้งสามแบบ</td></tr>
      <tr><td>การประกอบขอบบอร์ดและห้องลม</td><td>เครื่องเชื่อมอัด RF, สถานีเชื่อมยึดด้วยลมร้อน, อุปกรณ์จับยึดทดสอบการเติมลม</td><td>การผลิตชุดขอบบอร์ดและห้องลมขนาดเต็มพร้อมผนังกั้นและวาล์วทั้งหมด</td></tr>
      <tr><td>การติดตั้งอุปกรณ์และเครื่องมือ</td><td>แม่พิมพ์เจาะร่องกล่องครีบ, อุปกรณ์จับยึดเชื่อมจุดติดตั้งสัมภาระและจุดจับ, สถานีตัดแผ่นรองดาดฟ้า</td><td>การติดตั้งครบชุด: ครีบ จุดติดตั้งสัมภาระ จุดเสียบสายกันหลุด จุดจับ แผ่นรองดาดฟ้า วาล์ว</td></tr>
      <tr><td>ห้องติดตั้งเครื่องมือวัด</td><td>เซนเซอร์วัดความเร็ว GPS, ทรานสดิวเซอร์วัดความดัน, มาตรวัดความเร่ง, ชุดเทอร์โมคัปเปิล, เครื่องบันทึกข้อมูล</td><td>การติดตั้งและปรับเทียบเครื่องมือวัดสำหรับการทดลองใช้งานบนน้ำ</td></tr>
    </tbody>
  </table>


  <h2>เส้นทางการสร้างต้นแบบ — ทีละขั้นตอน</h2>

  <ol>
    <li><strong>การส่งมอบงานวิศวกรรม</strong> — ชุดเอกสารการออกแบบ (โมเดล 3 มิติ, รายงาน FEA, รายการวัสดุ, ตารางการขึ้นรูป) ได้รับการตรวจสอบอย่างเป็นทางการโดยหัวหน้าเวิร์กช็อปและวิศวกรโครงการ ข้อกังวลด้านการผลิตทั้งหมดจะถูกระบุและแก้ไขก่อนเริ่มการตัด</li>
    <li><strong>การผลิตตัวเรือ</strong> — ตัวเรือถูกสร้างตามข้อกำหนดทางวิศวกรรม สำหรับการสร้างแบบชั้นเดียว: แกนดรอปสติทช์ถูกลามิเนตด้วยผิว PVC ตามข้อกำหนด สำหรับการสร้างแบบสองชั้น: ผิวเพิ่มเติมถูกประยุกต์ทับลามิเนตฐานก่อนตัดแบบ สำหรับการสร้างแบบ fusion: พารามิเตอร์การลามิเนตถูกโหลดจากใบกระบวนการที่ได้รับอนุมัติและตรวจสอบบนชิ้นงานตัวอย่างชิ้นแรก</li>
    <li><strong>การผลิตขอบบอร์ด</strong> — ผ้าถูกตัดด้วยแม่แบบลาย CNC จากนั้นเชื่อม RF ให้เป็นขอบบอร์ดและห้องลมขนาดเต็ม แต่ละห้องถูกเติมลมจนถึงแรงดันทดสอบและปล่อยทิ้งไว้ 24 ชั่วโมงเพื่อการคงทรงตัวในช่วงแรก</li>
    <li><strong>การประกอบและการติดตั้งอุปกรณ์</strong> — ตัวเรือและขอบบอร์ดถูกประกอบเข้าด้วยกัน กล่องครีบและจุดติดตั้งสัมภาระถูกติดตั้ง จุดเสียบสายกันหลุดและจุดจับถูกติดตั้ง วาล์วเติมลมถูกขันให้แน่น และแผ่นรองดาดฟ้าถูกวางและจัดตำแหน่ง</li>
    <li><strong>การทดสอบแบบนิ่ง</strong> — ก่อนที่บอร์ดจะแตะน้ำ จะมีการทดสอบ: การตรวจสอบการลอยตัว (น้ำหนักเต็ม + ส่วนสำรอง 30%), การทดสอบคงแรงดันห้องลม, การทดสอบการรั่วของวาล์ว, การทดสอบแรงดึงจุดจับและจุดติดตั้ง</li>
    <li><strong>โปรแกรมการทดลองบนน้ำ</strong> — การทดสอบในน้ำ 20 ชั่วโมง รายละเอียดด้านล่าง</li>
    <li><strong>การทบทวนต้นแบบ</strong> — การประชุมลงนามรับรองอย่างเป็นทางการจัดขึ้นร่วมกับทีมวิศวกรรม ทีมผลิต และทีมคุณภาพ การเปลี่ยนแปลงการออกแบบที่จำเป็นทั้งหมดจะถูกบันทึกและนำไปใช้ในการปล่อยผลิตจริง</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">โปรแกรมการทดลองบนน้ำ 20 ชั่วโมง — ตารางการทดสอบ</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">การฝึกคุ้นเคยบนน้ำนิ่ง — การรักษาทิศทางที่ความเร็วต่ำ การเลี้ยว การตรวจสอบท่ายืนและมุมทริม</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">การทดสอบความเร็ว — ความเร็วสูงสุดที่ยืนยันด้วย GPS ความเร็วพายปกติ จังหวะพายต่อเนื่องที่อัตราการพาย 3 ระดับ</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">การทดสอบการเลี้ยว — รัศมีการเลี้ยวแบบหมุนคว้างและแบบกวาด การตอบสนองของบอร์ด ทางกราบซ้ายและกราบขวา</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">การทดสอบคลื่นลม — วิ่งซ้ำผ่านคลื่นลม 0.5–1.0 ม. ติดตั้งมาตรวัดความเร่งที่ตำแหน่งท่ายืนของผู้ขี่</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">การทดสอบเสถียรภาพ — มุมเอียงสถิตกับผู้ขี่ 4 คนที่น้ำหนักแตกต่างกัน น้ำหนักแบบไม่สมมาตรทางกราบขวา</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">การวิ่งทดสอบความทนทาน — วิ่งต่อเนื่อง 3 ชั่วโมงที่ความเร็วพายปกติ พร้อมตรวจสอบแรงดันห้องลม อุณหภูมิขอบบอร์ด และความเหนื่อยล้าของผู้ขี่</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">การตรวจสอบขั้นสุดท้าย — ตรวจสอบชิ้นส่วนทั้งหมดหลังการทดลอง ขันและตรวจสอบสลักเกลียวทั้งหมด บันทึกผลการตรวจสอบ</span>
      </div>
    </div>
  </div>


  <h2>การสร้างต้นแบบตามสั่งสำหรับการใช้งานพิเศษ</h2>

  <p>เวิร์กช็อปต้นแบบคือสถานที่ที่เราแก้ปัญหาที่บอร์ดผลิตรุ่นมาตรฐานไม่สามารถรองรับได้ ตัวอย่างล่าสุด ได้แก่:</p>

  <ul>
    <li>ซัพกู้ภัยสีสะท้อนการมองเห็นสูงสำหรับองค์กรค้นหาและกู้ภัย ซึ่งต้องการจุดจับแบบบูรณาการ จุดติดตั้งอุปกรณ์กู้ภัย และตัวเรือแรงลอยตัวสูงสำหรับการกู้ผู้ประสบภัย — ทั้งหมดถูกสร้างต้นแบบ ติดตั้ง และทดสอบที่โรงงานของเรา</li>
    <li>ซัพทัวริ่งสำรวจระยะไกลสำหรับผู้รับเหมาสำรวจอุทกศาสตร์ พร้อมเสาเครื่องมือถอดได้ ช่องติดตั้งอุปกรณ์แบบปิดผนึก และแท่นติดตั้งทรานสดิวเซอร์แบบต่ำที่ออกแบบเพื่อลดแรงต้าน</li>
    <li>ซัพตกปลาขนาดกะทัดรัดสำหรับฝูงเรือรีสอร์ต ซึ่งใช้ต้นแบบในการตรวจสอบเสถียรภาพ การติดตั้งอุปกรณ์ และความทนทานภายใต้การให้เช่ารายวัน ก่อนที่ลูกค้าจะตัดสินใจสั่งทั้งฝูงเรือสี่ลำ</li>
  </ul>


  <h2>ทีมงานสร้างต้นแบบของเรา</h2>

  <p>เวิร์กช็อปมีช่างเทคนิคทางทะเลที่เชี่ยวชาญหลากหลาย 8 คน โดยแต่ละคนผ่านการฝึกอบรมข้ามสาขาอย่างน้อยสองในสามสาขาหลัก (ตัวเรือ ขอบบอร์ด การติดตั้งอุปกรณ์) หัวหน้าทีมเป็นช่างฝีมือชั้นสูงที่มีประสบการณ์ 16 ปี ครอบคลุมตั้งแต่งานสร้างตามสั่งแบบเดี่ยวจนถึงสายการผลิตแบบต่อเนื่อง
  ต้นแบบทุกลำได้รับวิศวกรโครงการประจำซึ่งเป็นผู้ติดต่อเพียงจุดเดียวของลูกค้าตลอดกระบวนการสร้างและการทดลอง</p>


  <h2>การมีส่วนร่วมของลูกค้า</h2>

  <p>เราสนับสนุนให้ลูกค้าเข้าร่วมในช่วงสำคัญระหว่างการสร้างต้นแบบ — โดยเฉพาะการตรวจสอบการติดตั้งอุปกรณ์เบื้องต้นและการทดลองบนน้ำ ข้อเสนอแนะด้านการปฏิบัติงานของคุณในช่วงเหล่านี้มีค่าอย่างยิ่งในการปรับแต่งบอร์ดก่อนเข้าสู่การผลิต เราไม่ได้สร้างบอร์ดอย่างโดดเดี่ยว
  เราสร้างบอร์ดร่วมกับคุณในฐานะพันธมิตร</p>

  <p>การทดลองบนน้ำ 20 ชั่วโมงยังเป็นโอกาสให้ทีมงานของคุณทำความคุ้นเคยกับการควบคุมบอร์ด เค้าโครงดาดฟ้า และข้อกำหนดการบำรุงรักษา เพื่อให้การเปลี่ยนผ่านสู่การใช้งานจริงเป็นไปอย่างราบรื่นเมื่อบอร์ดรุ่นผลิตจริงถูกส่งมอบ</p>

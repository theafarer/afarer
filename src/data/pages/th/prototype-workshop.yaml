  tagline: Lab 05
  title: โรงงานผลิตต้นแบบ
  subtitle: จากโมเดล CAD สู่เรือที่พร้อมออกทะเล — สร้าง ติดตั้ง และผ่านการพิสูจน์
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: การต่อเรือต้นแบบในเวิร์กช็อปของ Afarer
intro: >-
  โมเดล CAD ไม่ว่าจะละเอียดเพียงใดก็ไม่อาจเผยให้เห็นว่าเรือจะรับมือจริงได้อย่างไร จนกว่าเรือจะได้สัมผัสกับน้ำ นั่นคือเหตุผลที่ Prototype Workshop ของเราถูกออกแบบมาเพื่อแปลงข้อมูลทางวิศวกรรมให้เป็นเรือจริงที่ออกทะเลได้โดยเร็วและแม่นยำที่สุดเท่าที่จะเป็นไปได้ ทุกรุ่นใหม่ของ Afarer —
  รวมถึงเรือที่สร้างตามสั่งที่สำคัญทุกลำ — จะผ่านเวิร์กช็อปนี้ก่อนที่เครื่องมือผลิตจะถูกกำหนด
content_html: >
  <h2>ที่ซึ่งการออกแบบกลายเป็นความจริง</h2>

  <p>เวิร์กช็อปมีอุปกรณ์พร้อมสำหรับการผลิตตัวเรือ ห้องลม และการติดตั้งอุปกรณ์ไปพร้อมกัน วิธีทำงานแบบขนานนี้ช่วยลดระยะเวลาการสร้างต้นแบบเหลือ 8-12 สัปดาห์นับจากปล่อยงานวิศวกรรม เทียบกับมาตรฐานอุตสาหกรรมที่ 16-20 สัปดาห์ เมื่อแอปพลิเคชันของคุณต้องการโซลูชันเฉพาะทาง
  เราสามารถเดินหน้าจากแนวคิดสู่การทดสอบบนน้ำได้ภายในไม่ถึงสามเดือน</p>


  <h2>ความสามารถของเวิร์กช็อป</h2>

  <table>
    <thead><tr><th>สถานีงาน</th><th>อุปกรณ์</th><th>วัตถุประสงค์</th></tr></thead>
    <tbody>
      <tr><td>การผลิตตัวเรือ</td><td>เตาขึ้นรูปแบบหมุน (HDPE), ห้องเชื่อม TIG (อะลูมิเนียม), แม่พิมพ์ขึ้นรูปด้วยมือ (ไฟเบอร์กลาส)</td><td>การผลิตตัวเรือขนาดเต็มในวัสดุทั้งสามประเภท</td></tr>
      <tr><td>การประกอบห้องลม</td><td>เครื่องเชื่อม RF, สถานีเชื่อมยึดด้วยลมร้อน, อุปกรณ์จับยึดทดสอบการเติมลม</td><td>การผลิตชุดห้องลมขนาดเต็มพร้อมผนังกั้น กรวย และวาล์วทั้งหมด</td></tr>
      <tr><td>การติดตั้งอุปกรณ์และเครื่องมือ</td><td>เครนยกเครื่องยนต์ (500 กก.), โครงจำลองแผงคอนโซล, เครื่องครอบสายไฮดรอลิก, แผงชุดสายไฟ</td><td>การติดตั้งครบชุด: เครื่องยนต์ ระบบพวงมาลัย ระบบควบคุม ระบบเชื้อเพลิง อุปกรณ์อิเล็กทรอนิกส์ และที่นั่ง</td></tr>
      <tr><td>ห้องติดตั้งเครื่องมือวัด</td><td>เซนเซอร์วัดความเร็ว GPS, เครื่องวัดอัตราการไหลของเชื้อเพลิง, มาตรวัดความเร่ง, ชุดเทอร์โมคัปเปิล, เครื่องบันทึกข้อมูล</td><td>การติดตั้งและปรับเทียบเครื่องมือวัดสำหรับการทดลองเดินเรือ</td></tr>
    </tbody>
  </table>


  <h2>เส้นทางการสร้างต้นแบบ — ทีละขั้นตอน</h2>

  <ol>
    <li><strong>การส่งมอบงานวิศวกรรม</strong> — ชุดเอกสารการออกแบบ (โมเดล 3 มิติ, รายงาน FEA, รายการวัสดุ, ตารางการขึ้นรูป) ได้รับการตรวจสอบอย่างเป็นทางการโดยหัวหน้าเวิร์กช็อปและวิศวกรโครงการ ข้อกังวลด้านการผลิตทั้งหมดจะถูกระบุและแก้ไขก่อนเริ่มการตัด</li>
    <li><strong>การผลิตตัวเรือ</strong> — ตัวเรือถูกสร้างตามข้อกำหนดทางวิศวกรรม สำหรับ HDPE: โปรแกรมการขึ้นรูปแบบหมุนถูกโหลดจากการจำลอง Moldex3D สำหรับอะลูมิเนียม: แผ่นที่ตัดด้วย CNC จะถูกเชื่อมในห้อง TIG ตามแผนผังการเชื่อมที่ได้รับอนุมัติ สำหรับไฟเบอร์กลาส: ปฏิบัติตามคู่มือการวางชั้นทีละชั้น</li>
    <li><strong>การผลิตห้องลม</strong> — ผ้าถูกตัดด้วยแม่แบบลาย CNC จากนั้นเชื่อม RF ให้เป็นห้องลมขนาดเต็ม แต่ละห้องถูกเติมลมจนถึงแรงดันทดสอบและปล่อยทิ้งไว้ 24 ชั่วโมงเพื่อการคงทรงตัวในช่วงแรก</li>
    <li><strong>การประกอบและการติดตั้งอุปกรณ์</strong> — ตัวเรือและห้องลมถูกประกอบเข้าด้วยกัน เครื่องยนต์ถูกติดตั้ง ระบบพวงมาลัยและระบบควบคุมเชื่อมต่อ ระบบเชื้อเพลิงถูกติดตั้ง และวงจรไฟฟ้าทั้งหมดถูกเดินสายและตรวจสอบ</li>
    <li><strong>การทดสอบแบบนิ่ง</strong> — ก่อนที่เรือจะแตะน้ำ จะมีการทดสอบ: การตรวจสอบการลอยตัว (น้ำหนักเต็ม + ส่วนสำรอง 30%), การทดสอบแรงดันระบบเชื้อเพลิง, การทดสอบระบบพวงมาลัยครบรอบ, การทดสอบความต่อเนื่องของระบบกราวด์ไฟฟ้า</li>
    <li><strong>โปรแกรมการทดลองเดินเรือ</strong> — การทดสอบในน้ำ 20 ชั่วโมง รายละเอียดด้านล่าง</li>
    <li><strong>การทบทวนต้นแบบ</strong> — การประชุมลงนามรับรองอย่างเป็นทางการจัดขึ้นร่วมกับทีมวิศวกรรม ทีมผลิต และทีมคุณภาพ การเปลี่ยนแปลงการออกแบบที่จำเป็นทั้งหมดจะถูกบันทึกและนำไปใช้ในการปล่อยผลิตจริง</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">โปรแกรมการทดลองเดินเรือ 20 ชั่วโมง — ตารางการทดสอบ</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">การเคลื่อนเรือในท่าเรือ — การควบคุมความเร็วต่ำ การถอยหลัง การตรวจสอบทุ่นกันกระแทก</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">การทดสอบความเร็ว — ความเร็วสูงสุดที่ยืนยันด้วย GPS ความเร็วเดินทางปกติ อัตราการใช้เชื้อเพลิงที่จุด RPM 3 จุด</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">การทดสอบการเลี้ยว — เส้นผ่านศูนย์กลางการเลี้ยวเชิงยุทธวิธี ระยะแซยิด และการเคลื่อนขวางที่ 20 นอต ทางกราบซ้ายและกราบขวา</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">การทดสอบการกระแทกคลื่น — วิ่งซ้ำผ่านคลื่นลมปานกลาง 0.5–1.0 ม. ติดตั้งมาตรวัดความเร่งที่ฐานที่นั่งบังคับเรือ</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">การทดสอบเสถียรภาพ — มุมเอียงสถิตกับลูกเรือ 4 คนพร้อมอุปกรณ์ทางกราบขวา น้ำหนักแบบไม่สมมาตร</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">การวิ่งทดสอบความทนทาน — วิ่งต่อเนื่อง 3 ชั่วโมงที่ความเร็วเดินทางปกติ พร้อมตรวจสอบอุณหภูมิ (เครื่องยนต์ เชื้อเพลิง ระบบไฟฟ้า)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">การตรวจสอบขั้นสุดท้าย — ตรวจสอบระบบทั้งหมดหลังการทดลอง ขันและตรวจสลักเกลียวทั้งหมด บันทึกผลการตรวจสอบ</span>
      </div>
    </div>
  </div>


  <h2>การสร้างต้นแบบตามสั่งสำหรับการใช้งานพิเศษ</h2>

  <p>เวิร์กช็อปต้นแบบคือสถานที่ที่เราแก้ปัญหาที่เรือผลิตรุ่นมาตรฐานไม่สามารถรองรับได้ ตัวอย่างล่าสุด ได้แก่:</p>

  <ul>
    <li>เรือ RIB ยาว 7.8 ม. สำหรับองค์กรค้นหาและกู้ภัย ซึ่งต้องการโครงสร้างห้องโดยสารแบบกำหนดเองพร้อมระบบป้องกันการพลิกคว่ำ ขายึดเปลแบบบิวท์อิน และแท่นโซนาร์บริเวณหัวเรือ — ทั้งหมดถูกสร้างต้นแบบ ติดตั้ง และทดสอบที่โรงงานของเรา</li>
    <li>เรือเป่าลมยาว 5.2 ม. สำหรับผู้รับเหมาสำรวจอุทกศาสตร์ พร้อมท้ายเรือแบบลดความสูง เสาเครื่องมือถอดได้ และช่องรับทรานสดิวเซอร์ทะลุตัวเรือที่ออกแบบเพื่อลดการรบกวนการไหลของน้ำ</li>
    <li>เรือเล็กขับเคลื่อนด้วยไฟฟ้ายาว 4.5 ม. สำหรับซูเปอร์ยอชต์ ซึ่งใช้ต้นแบบในการตรวจสอบระยะทางการวิ่ง โครงสร้างพื้นฐานการชาร์จ และระดับเสียง ก่อนที่ลูกค้าจะตัดสินใจสั่งกองเรือสี่ลำ</li>
  </ul>


  <h2>ทีมงานสร้างต้นแบบของเรา</h2>

  <p>เวิร์กช็อปมีช่างเทคนิคทางทะเลที่เชี่ยวชาญหลากหลาย 8 คน โดยแต่ละคนผ่านการฝึกอบรมข้ามสาขาอย่างน้อยสองในสามสาขาหลัก (ตัวเรือ ห้องลม การติดตั้งอุปกรณ์) หัวหน้าทีมเป็นผู้เชี่ยวชาญการต่อเรือชั้นสูงที่มีประสบการณ์ 16 ปี ครอบคลุมตั้งแต่เรือสั่งสร้างพิเศษแบบเดียวจนถึงสายการผลิตแบบต่อเนื่อง
  ต้นแบบทุกลำได้รับวิศวกรโครงการประจำซึ่งเป็นผู้ติดต่อเพียงจุดเดียวของลูกค้าตลอดกระบวนการสร้างและการทดลอง</p>


  <h2>การมีส่วนร่วมของลูกค้า</h2>

  <p>เราสนับสนุนให้ลูกค้าเข้าร่วมในช่วงสำคัญระหว่างการสร้างต้นแบบ — โดยเฉพาะการตรวจสอบการติดตั้งอุปกรณ์เบื้องต้นและการทดลองเดินเรือ ข้อเสนอแนะด้านการปฏิบัติงานของคุณในช่วงเหล่านี้มีค่าอย่างยิ่งในการปรับแต่งเรือก่อนเข้าสู่การผลิต เราไม่ได้สร้างเรืออย่างโดดเดี่ยว
  เราสร้างเรือร่วมกับคุณในฐานะพันธมิตร</p>

  <p>การทดลองเดินเรือ 20 ชั่วโมงยังเป็นโอกาสให้ทีมงานของคุณทำความคุ้นเคยกับการควบคุมเรือ เค้าโครงระบบ และข้อกำหนดการบำรุงรักษา เพื่อให้การเปลี่ยนผ่านสู่การใช้งานจริงเป็นไปอย่างราบรื่นเมื่อเรือรุ่นผลิตจริงถูกส่งมอบ</p>

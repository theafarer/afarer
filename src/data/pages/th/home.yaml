meta:
  title: Afarer บอร์ดพาเดิลอัดลม | ไปไกลกว่า พายแรงกว่า
  description: ค้นพบบอร์ดพาเดิลอัดลม Afarer สำหรับพาเดิลบอร์ดแบบออลอาราวน์ ทัวริ่ง โยคะ ตกปลา และผจญภัยกลางแจ้ง หา SUP ที่ใช่สำหรับคุณและสำรวจให้มากขึ้นบนน้ำ
  keywords:
    - บอร์ดพาเดิลอัดลม
    - sup อัดลม
    - sup ออลอาราวน์
    - sup ทัวริ่ง
    - sup โยคะ
    - sup ตกปลา
    - บอร์ดพาเดิลครอบครัว
    - บอร์ดพาเดิลพกพา
hero:
  tagline: บอร์ดพาเดิลอัดลม
  title: บอร์ดพาเดิลอัดลมสำหรับทุกการผจญภัย
  slogan: ไปไกลกว่า พายแรงกว่า
  subtitle: ค้นพบอิสรภาพของการพายเรือกับ Afarer สำรวจ SUP อัดลมที่ออกแบบอย่างพิถีพิถันสำหรับวันพักผ่อนริมทะเลสาบ การผจญภัยชายฝั่ง การออกกำลังกาย และทุกสิ่งที่อยู่ระหว่างนั้น
  taglineSection: สร้างเพื่อความมั่นใจ ออกแบบให้โดดเด่น
  actions:
    - variant: primary
      text: หาบอร์ดที่ใช่
      href: /size-guide/
      icon: tabler:compass
    - text: สำรวจบอร์ด SUP
      href: /inflatable-sup/
      icon: tabler:waves
    - text: ทำไมต้อง Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: บอร์ดพาเดิลอัดลม Afarer เลื่อนไปบนผืนน้ำนิ่งยามอรุณ — สร้างเพื่อทุกการผจญภัย
who_we_serve:
  tagline: พายไปกับเรา
  title: หาเส้นทางของคุณบนผืนน้ำ
  subtitle: นักพายทุกคนมีความคิดเรื่องการผจญภัยที่แตกต่างกัน ค้นพบ SUP Afarer ที่ออกแบบมาเพื่อสไตล์การพายของคุณ
  items:
    - title: มือใหม่และนักพายสันทนาการ
      keywords: sup อัดลมสำหรับมือใหม่, บอร์ดพาเดิลออลอาราวน์, sup นิ่ง
      description: บอร์ดออลอาราวน์แบบกว้างและนิ่ง ที่ทำให้จังหวะพายครั้งแรกเป็นธรรมชาติ และอยู่คู่กับคุณเมื่อฝีมือพัฒนาขึ้น
      icon: tabler:users
      cta: หาบอร์ดแรกของคุณ
      link: /all-around-sup/
    - title: ทัวริ่งและผจญภัย
      keywords: sup ทัวริ่ง, บอร์ดพาเดิลไกล, sup สำรวจ
      description: บอร์ดที่ยาวและแคบกว่า ออกแบบให้รักษาทิศทาง แล่นไกลกว่า และบรรทุกสัมภาระสำหรับเส้นทางหลายวัน
      icon: tabler:building
      cta: สำรวจบอร์ดทัวริ่ง
      link: /touring-sup/
    - title: โยคะและฟิตเนส
      keywords: sup โยคะ, บอร์ดพาเดิลฟิตเนส, sup กว้างนิ่ง
      description: แพลตฟอร์มกว้างนิ่งที่มีพื้นที่ให้เคลื่อนไหว — สำหรับโฟลว์ยามเช้า การออกกำลังกาย และการทรงตัวบนน้ำนิ่ง
      icon: tabler:heart
      cta: สำรวจ SUP โยคะ
      link: /yoga-sup/
    - title: ตกปลาและครอบครัว
      keywords: sup ตกปลา, บอร์ดพาเดิลครอบครัว, แพลตฟอร์มตกปลานิ่ง
      description: แพลตฟอร์มนิ่งและใช้งานจริง สำหรับตกปลา พายเล่นกับลูก ๆ และวันพักผ่อนยาว ๆ บนน้ำ
      icon: tabler:users
      cta: สำรวจ SUP ตกปลา
      link: /fishing-sup/
proof_points:
  title: ทดสอบเกินระดับโชว์รูม
  subtitle: ดีไซน์ สมรรถนะ และคุณภาพที่พิสูจน์ได้ — บนน้ำและในตัวเลข
  items:
    - metric: 10+
      label: ประสบการณ์การออกแบบเพื่อสายน้ำ
      detail: ตั้งแต่ปี 2012 พัฒนาทีละแผ่น
    - metric: 50+
      label: ประเทศบนสายน้ำ
      detail: นักพาเดิลและพันธมิตรทั่วโลก
    - metric: 12–15
      label: แกน drop-stitch ระดับ PSI
      detail: แข็งแรงในจุดที่สำคัญ พับเก็บง่าย
    - metric: 100%
      label: ทดสอบแรงดันทีละแผ่น
      detail: ตรวจสอบก่อนส่งมอบ
business_solutions:
  tagline: ทำไมถึงพายแล้วต่างออกไป
  title: ประสิทธิภาพที่สัมผัสได้ตั้งแต่จังหวะแรก
  subtitle: สี่เสาหลักที่ขึ้นรูปจากน้ำจริง — ประสิทธิภาพ การออกแบบ โครงสร้าง และคุณภาพ
  items:
    - title: ประสิทธิภาพบนน้ำ
      description: รูปทรงที่ปรับเพื่อความนิ่ง การไถล และความมั่นใจในน้ำกระเพื่อม — ทุกจังหวะพายยังเชื่อมโยงกับน้ำ
      icon: tabler:shield-check
    - title: ดีไซน์ที่สื่อถึงตัวตน
      description: คอลเลกชันที่ได้แรงบันดาลใจจากกระแสน้ำ สัตว์ป่า และพลังงานของชายฝั่ง — บอร์ดที่คุณอยากให้คนอื่นเห็น
      icon: tabler:package
    - title: โครงสร้างที่พิสูจน์แล้ว
      description: แกน drop-stitch ความหนาแน่นสูง ขอบบอร์ดเสริมแรง และรอยต่อที่หลอมเชื่อมสำหรับการใช้งานซ้ำ ๆ
      icon: tabler:headset
    - title: คุณภาพที่ตรวจสอบแล้ว
      description: ทดสอบแรงดัน ตรวจสอบด้วยสายตา พร้อมการรับประกันที่ชัดเจนและบริการหลังการขายที่ตอบสนองรวดเร็ว
      icon: tabler:truck-delivery
cta:
  title: หาบอร์ดถัดไปของคุณ
  subtitle: ไม่ว่าจะเป็นจังหวะพายครั้งแรกหรือเส้นทางที่ยาวที่สุด — เราจะพาคุณลงสู่ผืนน้ำ
  actions:
    - variant: primary
      text: สำรวจคอลเลกชัน
      href: /inflatable-sup/
      icon: tabler:send
    - text: ขอแคตตาล็อก
      href: /resources/download-catalog/

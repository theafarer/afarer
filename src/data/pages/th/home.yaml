meta:
  title: 'ผู้ผลิตบอร์ด SUP แบบเป่าลมและพันธมิตร OEM/ODM — Afarer Water Sports | {SITE}'
  description: 'Afarer คือผู้ผลิตบอร์ด SUP แบบเป่าลมและพันธมิตร OEM/ODM ในชิงเต่า ประเทศจีน — โรงงานรับรอง ISO 9001 ที่ออกแบบบอร์ดพาเดิลแบบเป่าลมสมรรถนะสูงสำหรับทะเลเปิด การทัวร์ริ่ง โยคะ และการผจญภัย ทดสอบแรงดันแบบทีละแผ่น พร้อมโปรแกรม OEM/ODM แบรนด์เอกชน และการจัดจำหน่าย'
  keywords:
    - 'SUP แบบเป่าลมสมรรถนะสูง'
    - 'บอร์ดพายแบบเป่าลมระดับพรีเมียม'
    - 'แบรนด์บอร์ด SUP แบบเป่าลม'
    - 'SUP แบบเป่าลมสำหรับทัวร์ริ่ง'
    - 'บอร์ดพายโคแบรนด์'
    - 'ตัวแทนจำหน่าย SUP รายประเทศ'
hero:
  tagline: 'ผู้ผลิตบอร์ด SUP แบบเป่าลมและพันธมิตร OEM/ODM'
  title: พายได้ไกลขึ้น<br />ขี่ได้แข็งแกร่งขึ้น
  subtitle: |
    SUP แบบเป่าลมสมรรถนะสูง ออกแบบสำหรับทะเลเปิด วันอันยาวนาน<br />
    และอิสรภาพในการออกสำรวจ — มั่นคงเมื่อถึงจังหวะสำคัญ<br />
    แข็งเกร็งภายใต้แรงกด และพร้อมรับทุกสภาพน้ำที่เปลี่ยนแปลง
  taglineSection: โซลูชัน SUP แบบเป่าลมระดับเชิงพาณิชย์สำหรับรีสอร์ต สโมสร ร้านค้าปลีก และแบรนด์กีฬาทางน้ำ
  actions:
    - variant: primary
      text: สำรวจบอร์ด
      href: /inflatable-sup
      icon: tabler:waves
    - text: ดาวน์โหลดแคตตาล็อก
      href: /resources/download-catalog
      icon: tabler:file-text
    - text: สำรวจโซลูชัน SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: บอร์ดซัพเป่าลม afarer ริมน้ำรีสอร์ทเขตร้อน — กองเรือเชิงพาณิชย์สำหรับธุรกิจทางน้ำ
who_we_serve:
  tagline: กลุ่มลูกค้าที่เราให้บริการ
  title: โซลูชัน SUP ครบวงจรสำหรับทุกธุรกิจทางน้ำ
  subtitle: อุปกรณ์ที่ออกแบบเฉพาะงาน การผลิต และการสนับสนุนธุรกิจสำหรับตลาดหลัก 4 ตลาด
  items:
    - title: ชมรมพายเรือ
      keywords: อุปกรณ์ชมรม SUP อุปกรณ์โรงเรียนพายเรือ ฝูงเรือให้เช่า
      description: กองเรือ SUP ที่ทนทาน ราคาสำหรับสโมสร และโปรแกรมอะไหล่ทดแทนสำหรับชมรมพายและโรงเรียน
      icon: tabler:users
      cta: สำรวจโซลูชัน Paddle Club
      link: /solutions/paddle-clubs
    - title: รีสอร์ทและโรงแรม
      keywords: กิจกรรมทางน้ำของรีสอร์ท อุปกรณ์ชายหาดของโรงแรม ประสบการณ์ของแขก
      description: โปรแกรมฟลีต SUP ครบวงจร พร้อมการสร้างแบรนด์เฉพาะ การฝึกอบรมพนักงาน และแพ็กเกจที่เพิ่ม ROI ให้สูงสุด
      icon: tabler:building
      cta: สร้างสรรค์ประสบการณ์ทางน้ำให้รีสอร์ทของคุณ
      link: /solutions/resorts-hotels
    - title: พันธมิตรค้าปลีก
      keywords: ผู้ค้าส่ง SUP ร้านค้าปลีกสินค้ากลางแจ้ง ร้านอุปกรณ์กีฬา
      description: ผลิตภัณฑ์ครบทุกรายการ เอกสารการตลาด ตัวเลือกการจัดส่งแบบ Drop-shipping และมาร์จิ้นค้าส่งที่แข่งขันได้
      icon: tabler:shopping-cart
      cta: เป็นพาร์ทเนอร์ค้าปลีก
      link: /solutions/retail-partners
    - title: ตัวแทนจำหน่ายรายประเทศและพันธมิตรโคแบรนด์
      keywords: ตัวแทนจำหน่าย SUP รายประเทศ, SUP โคแบรนด์, SUP แบรนด์ส่วนตัว
      description: การจัดจำหน่ายแบบเอกสิทธิ์รายประเทศและคอลเลกชันโคแบรนด์แบบจำนวนจำกัดสำหรับธุรกิจกีฬาทางน้ำที่มีคุณสมบัติตามเกณฑ์
      icon: tabler:package
      cta: เป็นพันธมิตร
      link: /distributor-program
proof_points:
  title: ทดสอบเกินระดับโชว์รูม
  subtitle: ดีไซน์ สมรรถนะ และคุณภาพที่พิสูจน์ได้ — บนน้ำและในตัวเลข
  items:
    - metric: 10+
      label: ประสบการณ์การออกแบบเพื่อสายน้ำ
      detail: ตั้งแต่ปี 2012 พัฒนาทีละแผ่น
    - metric: 50+
      label: ประเทศบนสายน้ำ
      detail: นักพาเดิลและพันธมิตรทั่วโลก
    - metric: 12–15
      label: แกน drop-stitch ระดับ PSI
      detail: แข็งแรงในจุดที่สำคัญ พับเก็บง่าย
    - metric: 100%
      label: ทดสอบแรงดันทีละแผ่น
      detail: ตรวจสอบก่อนส่งมอบ
business_solutions:
  tagline: เราช่วยคุณอย่างไร
  title: พันธมิตรของคุณตั้งแต่วิธีคิดจนถึงการสร้างรายได้
  subtitle: ความสามารถหลักสี่ประการที่ช่วยให้ธุรกิจทางน้ำเริ่มต้น ดำเนินงาน และเติบโตได้
  items:
    - title: อุปกรณ์ระดับมืออาชีพ
      description: บอร์ด SUP ระดับเชิงพาณิชย์ที่ออกแบบมาเพื่อการให้เช่าใช้งานรายวัน มากกว่า 500 รอบ โดยแทบไม่ต้องบำรุงรักษา
      icon: tabler:shield-check
    - title: คอลเลกชันโคแบรนด์
      description: คอลเลกชันโคแบรนด์แบบจำนวนจำกัดที่ออกแบบ วิศวกรรม และสร้างสรรค์ร่วมกับ Afarer — ทุกแผ่นยังคงเป็นผลิตภัณฑ์ของ Afarer
      icon: tabler:package
    - title: การสนับสนุนธุรกิจ
      description: การฝึกอบรมพนักงาน เอกสารการตลาด โปรแกรมอะไหล่ทดแทน และการดูแลบัญชีลูกค้าแบบเฉพาะ
      icon: tabler:headset
    - title: ระบบโลจิสติกส์ทั่วโลก
      description: FOB ชิงเต่า, CIF ท่าเรือหลัก, จัดส่งถึงประตูในกว่า 50 ประเทศ พร้อมบริการช่วยเหลือด้านศุลกากร
      icon: tabler:truck-delivery
oem_section:
  tagline: 'การผลิต OEM / ODM และโคแบรนด์'
  title: จากไอเดียสู่สายน้ำ — รุ่นโคแบรนด์
  subtitle: 'สำหรับพันธมิตรที่ต้องการมากกว่าผลิตภัณฑ์ในแคตตาล็อก: การผลิต OEM/ODM และคอลเลกชันโคแบรนด์แบบจำนวนจำกัดที่ออกแบบ วิศวกรรม และสร้างร่วมกับ Afarer — ทุกแผ่นยังคงเป็นผลิตภัณฑ์ของ Afarer'
  steps:
    - number: '01'
      title: แนวคิดและบรีฟงาน
      desc: แบ่งปันวิสัยทัศน์ กลุ่มเป้าหมาย และข้อกำหนดของคุณ
    - number: '02'
      title: การออกแบบและวิศวกรรม
      desc: การสร้างโมเดล 3D การเลือกวัสดุ และการออกแบบกราฟิกตามความต้องการ
    - number: '03'
      title: ทำต้นแบบและทดสอบยืนยัน
      desc: การผลิตตัวอย่างพร้อมการรับรอง CE และการทดสอบคุณภาพ
    - number: '04'
      title: การผลิตจำนวนมาก
      desc: การผลิตเต็มรูปแบบพร้อมการตรวจสอบคุณภาพในสายการผลิต (inline QC) และการสนับสนุนการตรวจโรงงาน (factory audit)
    - number: '05'
      title: การจัดส่งทั่วโลก
      desc: โลจิสติกส์แบบ FOB ชิงเต่า CIF ท่าเรือหลัก และการจัดส่งถึงประตู (door-to-door)
  cta: สำรวจ Co-Branding
  cta_link: /co-brand
cta:
  title: พร้อมสร้างธุรกิจกิจกรรมทางน้ำของคุณแล้วหรือยัง?
  subtitle: ไม่ว่าคุณจะกำลังเปิดคลับ ติดตั้งอุปกรณ์ให้รีสอร์ท หรือสร้างแบรนด์ — เราพร้อมช่วยเหลือคุณ
  actions:
    - variant: primary
      text: เริ่มต้นโปรเจกต์ของคุณ
      href: /contact
      icon: tabler:send
    - text: ดาวน์โหลดคู่มือ OEM
      href: /resources/download-catalog
distributor:
  tagline: 'ตัวแทนจำหน่ายเอกสิทธิ์รายประเทศ'
  title: 'หนึ่งประเทศ ตัวแทนจำหน่าย Afarer อย่างเป็นทางการหนึ่งราย'
  subtitle: 'โปรแกรมหนึ่งประเทศหนึ่งตัวแทนจำหน่าย พร้อมความเป็นเอกสิทธิ์ในเขตพื้นที่ ราคาตัวแทนจำหน่าย การสนับสนุนการตลาด และ Distributor Success Program เฉพาะทีม'
  benefits:
    - title: 'ความเป็นเอกสิทธิ์ในเขตพื้นที่'
      description: 'ตัวแทนจำหน่ายที่ได้รับอนุญาตหนึ่งรายต่อประเทศหรือภูมิภาค — ไม่มีการแข่งขันภายใน ไม่มีความขัดแย้งของช่องทาง'
    - title: 'มาร์จิ้นจากโรงงานโดยตรง'
      description: 'ลิสต์ราคาตัวแทนจำหน่าย และส่วนลดประจำปีตามปริมาณที่ตกลงกัน จัดส่ง FOB ชิงเต่า'
    - title: 'การสนับสนุนการตลาดและการฝึกอบรม'
      description: 'วัสดุแบรนด์ร่วม สื่อ ณ จุดขายสำหรับตัวแทน การฝึกอบรมสินค้า และแคมเปญเปิดตัว'
    - title: 'ทีมบัญชีเฉพาะ'
      description: 'ผู้จัดการตัวแทนจำหน่ายส่วนตัว พร้อมช่วยเหลือการเริ่มต้น การคาดการณ์ และการสั่งซื้อซ้ำ'
  actions:
    - variant: primary
      text: 'เป็นตัวแทนจำหน่าย'
      href: /distributor-program
    - text: 'ขอลิสต์ราคาตัวแทนจำหน่าย'
      href: /contact?subject=Dealer Price List
    - text: 'สมัครพันธมิตรประเทศ'
      href: /contact?subject=Country Partnership Application
    - text: 'ดาวน์โหลดโปรแกรมตัวแทนจำหน่าย'
      href: /distributor-program
  note: 'คำสั่งซื้อตัวอย่าง 5–10 ชิ้น คำสั่งซื้อทดลอง 10–30 ชิ้น ตัวแทนจำหน่ายที่ได้รับอนุญาต 30–50 ชิ้น ตัวแทนจำหน่ายระดับประเทศ/ภูมิภาค 100–300+ ชิ้น'

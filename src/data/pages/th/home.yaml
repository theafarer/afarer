hero:
  tagline: ผู้ผลิตบอร์ด SUP แบบเป่าลมระดับพรีเมียมและพันธมิตร OEM
  title: ผู้ผลิตเรือยางเป่าลม SUP ระดับพรีเมียม<br />&amp; พันธมิตร OEM
  subtitle: |
    เราออกแบบและผลิตบอร์ดพายแบบเป่าลมให้แบรนด์ระดับโลก<br />
    รีสอร์ท สโมสรพายบอร์ด และธุรกิจกิจกรรมผจญภัยทางน้ำ<br />
    พันธมิตร OEM/ODM พร้อมโรงงานขนาด 12,000 ตร.ม. และการผลิตที่ได้รับการรับรอง CE
  taglineSection: โซลูชัน SUP แบบเป่าลมระดับเชิงพาณิชย์สำหรับรีสอร์ต สโมสร ร้านค้าปลีก และแบรนด์กีฬาทางน้ำ
  actions:
    - variant: primary
      text: ขอใบเสนอราคา OEM
      href: /oem-odm-manufacturer
      icon: tabler:package
    - text: ดาวน์โหลดแคตตาล็อก
      href: /resources/download-catalog
      icon: tabler:file-text
    - text: สำรวจโซลูชัน SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: บอร์ดซัพเป่าลม afarer ริมน้ำรีสอร์ทเขตร้อน —กองเรือเชิงพาณิชย์สำหรับธุรกิจทางน้ำ
who_we_serve:
  tagline: กลุ่มลูกค้าที่เราให้บริการ
  title: โซลูชัน SUP ครบวงจรสำหรับทุกธุรกิจทางน้ำ
  subtitle: อุปกรณ์ที่ออกแบบเฉพาะงาน การผลิต และการสนับสนุนธุรกิจสำหรับตลาดหลัก 4 ตลาด
  items:
    - title: ชมรมพายเรือ
      keywords: อุปกรณ์ชมรม SUP อุปกรณ์โรงเรียนพายเรือ ฝูงเรือให้เช่า
      description: กองเรือ SUP ที่ทนทาน ราคาสำหรับสโมสร และโปรแกรมอะไหล่ทดแทนสำหรับชมรมพายและโรงเรียน
      icon: tabler:users
      cta: สำรวจโซลูชัน Paddle Club
      link: /solutions/paddle-clubs
    - title: รีสอร์ทและโรงแรม
      keywords: กิจกรรมทางน้ำของรีสอร์ท อุปกรณ์ชายหาดของโรงแรม ประสบการณ์ของแขก
      description: โปรแกรมฟลีต SUP ครบวงจร พร้อมการสร้างแบรนด์เฉพาะ การฝึกอบรมพนักงาน และแพ็กเกจที่เพิ่ม ROI ให้สูงสุด
      icon: tabler:building
      cta: สร้างสรรค์ประสบการณ์ทางน้ำให้รีสอร์ทของคุณ
      link: /solutions/resorts-hotels
    - title: พันธมิตรค้าปลีก
      keywords: ผู้ค้าส่ง SUP ร้านค้าปลีกสินค้ากลางแจ้ง ร้านอุปกรณ์กีฬา
      description: ผลิตภัณฑ์ครบทุกรายการ เอกสารการตลาด ตัวเลือกการจัดส่งแบบ Drop-shipping และมาร์จิ้นค้าส่งที่แข่งขันได้
      icon: tabler:shopping-cart
      cta: เป็นพาร์ทเนอร์ค้าปลีก
      link: /solutions/retail-partners
    - title: แบรนด์ SUP ใหม่
      keywords: ซัพแบรนด์เฉพาะ, แบรนด์ซัพตามสั่ง, บอร์ดพายแบบ OEM
      description: การผลิตแบบ OEM/ODM ครบวงจร —การออกแบบ การทำต้นแบบ การผลิตจำนวนมาก และระบบโลจิสติกส์ทั่วโลก
      icon: tabler:package
      cta: สร้างแบรนด์ SUP ของคุณ
      link: /oem-odm-manufacturer
proof_points:
  title: ธุรกิจทางน้ำทั่วโลกให้ความไว้วางใจ
  subtitle: ประสบการณ์วิศวกรรมทางทะเลหลายทศวรรษ ที่ขับเคลื่อนธุรกิจซัพให้มีกำไร
  items:
    - metric: 10+
      label: ปีแห่งประสบการณ์
      detail: ตั้งแต่ปี 2012
    - metric: 50+
      label: ประเทศที่เราให้บริการ
      detail: เครือข่ายการจัดจำหน่ายทั่วโลก
    - metric: 15,000+
      label: จำนวนยูนิตที่ผลิตต่อปี
      detail: กำลังการผลิตที่ได้รับการรับรอง CE
    - metric: 100%
      label: ผ่านการรับรอง CE
      detail: เป็นไปตามมาตรฐาน ISO 9001, BSCI, REACH
business_solutions:
  tagline: เราช่วยคุณอย่างไร
  title: พันธมิตรของคุณตั้งแต่วิธีคิดจนถึงการสร้างรายได้
  subtitle: ความสามารถหลักสี่ประการที่ช่วยให้ธุรกิจทางน้ำเริ่มต้น ดำเนินงาน และเติบโตได้
  items:
    - title: อุปกรณ์ระดับมืออาชีพ
      description: บอร์ด SUP ระดับเชิงพาณิชย์ที่ออกแบบมาเพื่อการให้เช่าใช้งานรายวัน มากกว่า 500 รอบ โดยแทบไม่ต้องบำรุงรักษา
      icon: tabler:shield-check
    - title: การผลิตแบบ OEM
      description: การผลิตแบรนด์ส่วนตัวแบบครบวงจร ตั้งแต่การออกแบบและการทำต้นแบบ จนถึงการผลิตจำนวนมากและการจัดส่งทั่วโลก
      icon: tabler:package
    - title: การสนับสนุนธุรกิจ
      description: การฝึกอบรมพนักงาน เอกสารการตลาด โปรแกรมอะไหล่ทดแทน และการดูแลบัญชีลูกค้าแบบเฉพาะ
      icon: tabler:headset
    - title: ระบบโลจิสติกส์ทั่วโลก
      description: FOB ชิงเต่า, CIF ท่าเรือหลัก, จัดส่งถึงประตูในกว่า 50 ประเทศ พร้อมบริการช่วยเหลือด้านศุลกากร
      icon: tabler:truck-delivery
oem_section:
  tagline: เปิดตัวแบรนด์ของคุณ
  title: จากไอเดียสู่ตลาดภายใน 16 สัปดาห์
  subtitle: พันธมิตรเปิดตัวแบรนด์ SUP ครบวงจรของคุณ — ออกแบบ ทำต้นแบบ ผลิต และจัดส่ง
  steps:
    - number: '01'
      title: แนวคิดและบรีฟงาน
      desc: แบ่งปันวิสัยทัศน์ กลุ่มเป้าหมาย และข้อกำหนดของคุณ
    - number: '02'
      title: การออกแบบและวิศวกรรม
      desc: การสร้างโมเดล 3D การเลือกวัสดุ และการออกแบบกราฟิกตามความต้องการ
    - number: '03'
      title: ทำต้นแบบและทดสอบยืนยัน
      desc: การผลิตตัวอย่างพร้อมการรับรอง CE และการทดสอบคุณภาพ
    - number: '04'
      title: การผลิตจำนวนมาก
      desc: การผลิตเต็มรูปแบบพร้อมการตรวจสอบคุณภาพในสายการผลิต (inline QC) และการสนับสนุนการตรวจโรงงาน (factory audit)
    - number: '05'
      title: การจัดส่งทั่วโลก
      desc: โลจิสติกส์แบบ FOB ชิงเต่า CIF ท่าเรือหลัก และการจัดส่งถึงประตู (door-to-door)
  cta: เริ่มต้นเส้นทางแบรนด์ของคุณ
  cta_link: /oem-odm-manufacturer
cta:
  title: พร้อมสร้างธุรกิจกิจกรรมทางน้ำของคุณแล้วหรือยัง?
  subtitle: ไม่ว่าคุณจะกำลังเปิดคลับ ติดตั้งอุปกรณ์ให้รีสอร์ท หรือสร้างแบรนด์ — เราพร้อมช่วยเหลือคุณ
  actions:
    - variant: primary
      text: เริ่มต้นโปรเจกต์ของคุณ
      href: /contact
      icon: tabler:send
    - text: ดาวน์โหลดคู่มือ OEM
      href: /resources/download-catalog

    - title: 'การควบคุมคุณภาพ'
      description: 'ทดสอบแรงดัน ความแข็งแรงตะเข็บ การลอยตัว และความทน UV ทุกลำ'
      icon: 'tabler:shield-check'
    - title: 'ปรับแต่งตามสั่ง'
      description: 'โลโก้ สี ผนังกั้น ช่องเก็บของ — เรือสูบลมตามสั่งในแบรนด์ของคุณ'
      icon: 'tabler:palette'
    - title: 'OEM / ODM'
      description: 'พัฒนาโมเดลตามสั่งสำหรับแบรนด์ ตัวแทนจำหน่าย และกองเรือมืออาชีพ'
      icon: 'tabler:building-factory'
    - title: 'การจัดส่งทั่วโลก'
      description: 'FOB Qingdao ตู้คอนเทนเนอร์เต็มหรือสินค้ารวม พร้อมสนับสนุนพิธีการศุลกากร'
      icon: 'tabler:world'

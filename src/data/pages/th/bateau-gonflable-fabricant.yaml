  items:
    - title: 'คุณผลิตเรือสูบลมประเภทใดบ้าง?'
      description: 'เรือประจำเรือสูบลม เรือยาง เรือประมง เรือทำงาน และโมเดล PVC ตามสั่ง'
    - title: 'ปรับแต่งเรือสูบลมได้ไหม?'

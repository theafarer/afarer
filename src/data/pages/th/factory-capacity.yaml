hero:
  tagline: 'กำลังการผลิต'
  title: 'กำลังการผลิตและผลผลิตประจำปี'
  subtitle: 12,000 m² facility producing 15,000+ boats per year with room to scale

intro: 'afarer ดำเนินธุรกิจโรงงานผลิตเรือเป่าลมที่ใหญ่ที่สุดแห่งหนึ่งในเมืองชิงเต่า ประเทศจีน โรงงานขนาด 12,000 ตร.ม. ของเราจัดเป็นเวิร์กช็อปเฉพาะทาง 6 แห่งที่ดำเนินงานควบคู่กันไป ทำให้เรามีกำลังการผลิตเรือได้มากกว่า 15,000 ลำต่อปีสำหรับกลุ่มผลิตภัณฑ์ SUP เรือคายัค เรือบด SUP และอุปกรณ์ความปลอดภัย'


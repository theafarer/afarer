workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50—0 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: SUP Boat Production
    description: 'โรงปฏิบัติงานตัวเรือไฟเบอร์กลาสโดยเฉพาะพร้อมสถานีแม่พิมพ์ 6 จุดสำหรับตัวเรือ SUP สูงถึง 7.6 ม. พื้นที่เชื่อมและประกอบท่อรองรับ 3— RIBs พร้อมกัน ความจุ SUP ต่อปี: 2,000+ ลำ'
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & SUP
    description: 'สายการผลิตอเนกประสงค์สำหรับเรือเป่าลม เรือคายัค และเรือบด สถานีเชื่อมแบบใช้ลมร้อน เครื่องอัดอิเล็กทริก RF และสถานีงานประกอบได้รับการกำหนดค่าใหม่ตามส่วนผสมของคำสั่ง กำลังการผลิตต่อปี: 5,000+ หน่วย'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'แยกพื้นที่ผลิตห้องคลีนรูมสำหรับเสื้อชูชีพและอุปกรณ์นิรภัย การเย็บ การใส่โฟม และสถานีทดสอบโดยเฉพาะ ความจุเสื้อชูชีพต่อปี: 50,000+ หน่วย'
    output: '50,000+ life vests/year'


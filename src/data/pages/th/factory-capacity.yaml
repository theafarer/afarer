hero:
  tagline: กำลังการผลิต
  title: กำลังการผลิตและผลผลิตประจำปี
  subtitle: โรงงานขนาด 12,000 ตร.ม. ผลิตเรือมากกว่า 15,000 ลำต่อปี พร้อมพื้นที่รองรับการขยายกำลังการผลิต
intro: afarer ดำเนินธุรกิจโรงงานผลิตเรือเป่าลมที่ใหญ่ที่สุดแห่งหนึ่งในเมืองชิงเต่า ประเทศจีน โรงงานขนาด 12,000 ตร.ม. ของเราจัดเป็นเวิร์กช็อปเฉพาะทาง 6 แห่งที่ดำเนินงานควบคู่กันไป ทำให้เรามีกำลังการผลิตเรือได้มากกว่า 15,000 ลำต่อปีสำหรับกลุ่มผลิตภัณฑ์ SUP เรือคายัค เรือบด SUP และอุปกรณ์ความปลอดภัย
highlights:
  - value: 12,000 m²
    label: พื้นที่โรงงานผลิตทั้งหมด
    detail: พบกับเวิร์คช็อปเฉพาะทางทั้ง 6 แห่ง
  - value: 15,000+
    label: Boats produced annually
    detail: SUP, เรือคายัค, SUP, เรือบด, อุปกรณ์นิรภัย
  - value: 200+
    label: บุคลากรที่มีทักษะฝีมือ
    detail: วิศวกร 25+ คน, 2 กะ/วัน
  - value: 50+
    label: ประเทศที่ส่งออก
    detail: EU, US, AU, ตะวันออกกลาง, เอเชีย
  - value: 30—5
    label: ระยะเวลาการผลิตมาตรฐาน (วัน)
    detail: จากการยืนยัน PO ถึง FOB
  - value: 10+
    label: ปีแห่งประสบการณ์การส่งออก
    detail: ตั้งแต่ปี 2012
workshops:
  - title: การผลิตบอร์ด SUP
    description: 'สายการประกอบแบบขนาน 4 สายสำหรับกระดาน SUP แบบเป่าลม แต่ละสายสามารถผลิตได้ 50—0 ใบต่อกะ จุดพิมพ์ดิจิทัลและพิมพ์สกรีนทำงานพร้อมกัน กำลังการผลิต SUP ต่อปี: มากกว่า 8,000 ใบ'
    output: มากกว่า 8,000 SUP ต่อปี
  - title: SUP Boat Production
    description: 'โรงปฏิบัติงานตัวเรือไฟเบอร์กลาสโดยเฉพาะพร้อมสถานีแม่พิมพ์ 6 จุดสำหรับตัวเรือ SUP สูงถึง 7.6 ม. พื้นที่เชื่อมและประกอบท่อรองรับ 3— RIBs พร้อมกัน ความจุ SUP ต่อปี: 2,000+ ลำ'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'สายการผลิตอเนกประสงค์สำหรับเรือเป่าลม เรือคายัค และเรือบด สถานีเชื่อมแบบใช้ลมร้อน เครื่องอัดอิเล็กทริก RF และสถานีงานประกอบได้รับการกำหนดค่าใหม่ตามส่วนผสมของคำสั่ง กำลังการผลิตต่อปี: 5,000+ หน่วย'
    output: 5,000+ units/year
  - title: อุปกรณ์ความปลอดภัย
    description: 'แยกพื้นที่ผลิตห้องคลีนรูมสำหรับเสื้อชูชีพและอุปกรณ์นิรภัย การเย็บ การใส่โฟม และสถานีทดสอบโดยเฉพาะ ความจุเสื้อชูชีพต่อปี: 50,000+ หน่วย'
    output: เสื้อชูชีพมากกว่า 50,000 ชิ้น/ปี
oem_capacity:
  moq: 'SUP: 5—0 units | SUP: 2— units | SUP/SUP: 10—0 units | Custom mould: 200+ units'
  lead_time: การสั่งผลิตมาตรฐาน 30—5 วัน ตัวอย่างสินค้า 15—0 วัน มีบริการสั่งผลิตเร่งด่วน
  payment: ชำระเงินผ่าน T/T ล่วงหน้า 30% + อีก 70% ก่อนจัดส่ง รับการชำระเงินผ่าน L/C และ Western Union

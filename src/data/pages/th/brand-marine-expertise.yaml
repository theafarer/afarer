meta:
  title: 'ความเชี่ยวชาญทางเรือ — วิศวกรรมในทุกตัวเรือ | {SITE}'
  description: 'วิศวกรรมต่อเรือหลายทศวรรษในทุกตัวเรือ afarer เชี่ยวชาญโครงสร้างดรอปสติทช์ พีวีซีสำหรับทะเล และการออกแบบมืออาชีพของเรือพองและบอร์ด SUP'
  keywords:
    - 'วิศวกรรมทางเรือ'
    - 'ผู้ผลิตเรือพอง'
    - 'ผู้ผลิตบอร์ด SUP แบบสูบลม'
    - 'การผลิตพายบอร์ด'
hero:
  tagline: ความเชี่ยวชาญทางทะเล
  title: ทศวรรษแห่งวิศวกรรมทางทะเล<br />ในทุกลำเรือ
  subtitle: afarer ผสมผสานวัสดุศาสตร์เชิงลึก การผลิตที่แม่นยำ และการทดสอบในโลกแห่งความเป็นจริง เพื่อผลิตเรือที่ดำเนินการในเวลาที่สำคัญ
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: ทีมวิศวกรรมทางทะเลและวิจัยพัฒนา (R&D) ของ afarer ระหว่างการปฏิบัติงาน
expertise_materials:
  tagline: วัสดุศาสตร์
  title: การเลือกวัสดุที่เหมาะสม<br />สำหรับทุกการใช้งาน
  subtitle: เราทำงานร่วมกับวัสดุหลัก 3 ประเภท โดยแต่ละวัสดุได้รับการคัดเลือกสำหรับกรณีการใช้งานเฉพาะและข้อกำหนดด้านประสิทธิภาพ
  columns: 3
  items:
    - title: PVC ระดับเรือเดินทะเล
      description: ผ้า PVC 1100 เดเนียร์ — วัสดุที่หลากหลายที่สุดของเรา ทนต่อรังสี UV ทนการสึกหรอ และเป็นไปตามมาตรฐาน REACH เหมาะสำหรับบอร์ด SUP ที่น้ำหนักและประสิทธิภาพด้านต้นทุนมีความสำคัญ
      icon: tabler:droplet
    - title: วัสดุ Hypalon/CSM ระดับพรีเมียม
      description: ทนทานต่อสารเคมีและความคงตัวของรังสี UV ที่เหนือกว่า เรือ Hypalon สามารถใช้งานได้นาน 15-20 ปีด้วยการดูแลที่เหมาะสม แนะนำสำหรับการใช้งานเชิงพาณิชย์ กู้ภัย และการทหารที่ความทนทานในระยะยาวเป็นสิ่งสำคัญ
      icon: tabler:shield
    - title: ไฟเบอร์กลาสและอลูมิเนียม
      description: ตัวเรือไฟเบอร์กลาส Deep-V สำหรับ SUP และเรือลาดตระเวน — ประสิทธิภาพการตัดคลื่นในสภาวะที่ไม่เอื้ออำนวย ตัวเรืออะลูมิเนียมสำหรับเรืองานเชิงพาณิชย์ที่ใช้งานหนักซึ่งต้องการความแข็งแกร่งและความสามารถในการรับน้ำหนักสูงสุด
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: ความสามารถในการผลิต
  title: การผลิตที่แม่นยำ<br />ในทุกขั้นตอน
  subtitle: โรงงานขนาด 12,000 ตร.ม. ของเรามีเครื่องจักรเฉพาะทางสำหรับทุกขั้นตอนการผลิต
  columns: 2
  items:
    - title: การตัดด้วยเครื่อง CNC
      description: การตัดที่ควบคุมด้วยคอมพิวเตอร์ช่วยให้มั่นใจได้ว่าแผงผ้าสามารถทำซ้ำได้แม่นยำและมีของเสียน้อยที่สุด ทุกชิ้นพอดีตรงตามที่ออกแบบไว้
      icon: tabler:cpu
    - title: การเชื่อมด้วยความถี่สูง (High-Frequency Welding)
      description: การเชื่อม HF ระดับอุตสาหกรรมจะสร้างตะเข็บที่แข็งแรงกว่าวัสดุฐาน การควบคุมอุณหภูมิและแรงดันที่สม่ำเสมอช่วยให้มั่นใจได้ว่าซีลกันอากาศตลอดทุกขั้นตอนการผลิต
      icon: tabler:bolt
    - title: การประกอบแกน Drop Stitch
      description: ด้ายโพลีเอสเตอร์หลายพันเส้นเชื่อมต่อกับชั้นผ้าด้านบนและด้านล่าง ทำให้เกิดแรงดันสูง (15-20 PSI) สำหรับบอร์ดและพื้น SUP ที่แข็งแรงและมั่นคง
      icon: tabler:building-arch
    - title: การทดสอบแรงดัน
      description: ผลิตภัณฑ์เป่าลมทุกชิ้นผ่านการทดสอบแรงดันก่อนจัดส่ง ท่อ SUP ได้รับการทดสอบที่แรงดันพิกัด 1.5 เท่า หากยึดไว้ ท่อจะดำเนินการบนน้ำได้
      icon: tabler:wind
    - title: การทดสอบความแข็งแรงของรอยเชื่อมตะเข็บ
      description: ตัวอย่างสุ่มจากแต่ละชุดการผลิตจะผ่านการทดสอบความแข็งแรงของตะเข็บแบบทำลายล้าง ผลลัพธ์จะถูกบันทึกและติดตามได้จนถึงการดำเนินการผลิตเฉพาะ
      icon: tabler:files
    - title: การทดสอบในน้ำ
      description: SUP ทุกรุ่นผ่านการทดสอบทางทะเลก่อนการรับรอง การทดสอบในโลกแห่งความเป็นจริงในสภาพชายฝั่งจะตรวจสอบประสิทธิภาพ การควบคุมรถ และความเสถียร
      icon: tabler:droplet
expertise_design:
  tagline: การออกแบบและวิศวกรรม
  title: ออกแบบมาเพื่อสภาวะจริง
  subtitle: ปรัชญาการออกแบบของเราเริ่มต้นด้วยวิธีการใช้งานเรือ จากนั้นจึงสร้างวิศวกรรมตามกรณีการใช้งานนั้น
  items:
    - title: การออกแบบตัวเรือแบบ Deep-V
      description: ตัวเรือไฟเบอร์กลาสของเรามีมุม deadrise ที่คำนวณอย่างแม่นยำ ปรับให้เหมาะสมกับความยาวและวัตถุประสงค์การใช้งานของแต่ละรุ่น มุม V ชันกว่าเพื่อสมรรถนะในทะเลคลื่นลมแรง มุมตื้นกว่าเพื่อความมั่นคง
    - title: ระบบความปลอดภัยหลายห้องลม
      description: เรือทุกลำมีช่องอากาศอิสระ 3-7 ช่อง หากช่องใดช่องหนึ่งเสียหาย ช่องที่เหลือจะช่วยให้เรือลอยน้ำและใช้งานได้
    - title: การจัดวางตามหลักสรีรศาสตร์
      description: ตำแหน่งคอนโซล ความสูงของท่อ และตำแหน่งที่นั่งได้รับการออกแบบโดยคำนึงถึงความสะดวกสบายของผู้ปฏิบัติงานในระหว่างการใช้งานที่ยาวนาน ไม่ว่าจะเป็นการลาดตระเวน ตกปลา หรือการขนส่ง
    - title: การกำหนดค่าตามความต้องการเฉพาะ
      description: สีของท่อ การกำหนดค่าคอนโซล ความจุเชื้อเพลิง แท่นยึดอุปกรณ์เสริม — แต่ละรุ่นสามารถปรับแต่งให้ตรงกับความต้องการในการใช้งานเฉพาะได้
cta:
  title: มีแอปพลิเคชันเฉพาะอยู่ในใจหรือไม่?
  subtitle: ทีมวิศวกรของเราสามารถให้คำแนะนำในการเลือกใช้วัสดุ การออกแบบ และการผลิตสำหรับโครงการของคุณได้
  actions:
    - variant: primary
      text: สอบถามวิศวกรของเรา
      href: /contact
    - text: ดูกลุ่มผลิตภัณฑ์
      href: /products

meta:
  title: 'ความเชี่ยวชาญด้านทะเล — วิศวกรรมในทุกตัวเรือ | {SITE}'
  description: 'วิศวกรรมทางทะเลหลายทศวรรษในทุกตัวเรือ afarer เชี่ยวชาญดรอปสติทช์ พีวีซีสำหรับทะเล และการออกแบบซัพเป่าลมระดับมืออาชีพ'
  keywords:
    - 'วิศวกรรมทางทะเล'
    - 'ผู้ผลิตบอร์ด SUP แบบเป่าลม'
    - 'การผลิตพายบอร์ด'
hero:
  tagline: ความเชี่ยวชาญทางทะเล
  title: ทศวรรษแห่งวิศวกรรมทางทะเล<br />ในทุกตัวเรือ
  subtitle: afarer ผสมผสานวัสดุศาสตร์เชิงลึก การผลิตที่แม่นยำ และการทดสอบในโลกแห่งความเป็นจริง เพื่อผลิตยานน้ำที่มีประสิทธิภาพเมื่อจำเป็นจริง ๆ
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: ทีมวิศวกรรมทางทะเลและวิจัยพัฒนา (R&D) ของ afarer ระหว่างการปฏิบัติงาน
expertise_materials:
  tagline: วัสดุศาสตร์
  title: การเลือกวัสดุที่เหมาะสม<br />สำหรับทุกการใช้งาน
  subtitle: เราทำงานร่วมกับวัสดุหลัก 2 ประเภท โดยแต่ละวัสดุได้รับการคัดเลือกสำหรับกรณีการใช้งานเฉพาะและข้อกำหนดด้านประสิทธิภาพ
  columns: 3
  items:
    - title: PVC เกรดทะเล
      description: ผ้า PVC 1100 เดเนียร์ — วัสดุที่หลากหลายที่สุดของเรา ทนต่อรังสี UV ทนการสึกหรอ และเป็นไปตามมาตรฐาน REACH เหมาะสำหรับบอร์ด SUP ที่น้ำหนักและประสิทธิภาพด้านต้นทุนมีความสำคัญ
      icon: tabler:droplet
    - title: ไฟเบอร์กลาสและโพลีเอทิลีน
      description: ซัพแบบลามิเนตไฟเบอร์กลาสสำหรับความแข็งแกร่งและการร่อนน้ำระดับพรีเมียม โพลีเอทิลีนขึ้นรูปแบบหมุน (rotomoulded) สำหรับการให้เช่าและงานกู้ภัยหนักที่ต้องการความทนทานต่อแรงกระแทกสูงสุด
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: ความสามารถในการผลิต
  title: การผลิตที่แม่นยำ<br />ในทุกขั้นตอน
  subtitle: โรงงานขนาด 12,000 ตร.ม. ของเรามีเครื่องจักรเฉพาะทางสำหรับทุกขั้นตอนการผลิต
  columns: 2
  items:
    - title: การตัดด้วยเครื่อง CNC
      description: การตัดที่ควบคุมด้วยคอมพิวเตอร์ช่วยให้มั่นใจได้ว่าแผงผ้าสามารถทำซ้ำได้แม่นยำและมีของเสียน้อยที่สุด ทุกชิ้นพอดีตรงตามที่ออกแบบไว้
      icon: tabler:cpu
    - title: การเชื่อมด้วยความถี่สูง (High-Frequency Welding)
      description: การเชื่อม HF ระดับอุตสาหกรรมจะสร้างตะเข็บที่แข็งแรงกว่าวัสดุฐาน การควบคุมอุณหภูมิและแรงดันที่สม่ำเสมอช่วยให้มั่นใจได้ว่าซีลกันอากาศตลอดทุกขั้นตอนการผลิต
      icon: tabler:bolt
    - title: การประกอบแกน Drop Stitch
      description: ด้ายโพลีเอสเตอร์หลายพันเส้นเชื่อมต่อกับชั้นผ้าด้านบนและด้านล่าง ทำให้เติมลมแรงดันสูง (15-20 PSI) ได้สำหรับบอร์ด SUP ที่แข็งแรงและมั่นคง
      icon: tabler:building-arch
    - title: การทดสอบแรงดัน
      description: ผลิตภัณฑ์เป่าลมทุกชิ้นผ่านการทดสอบแรงดันก่อนจัดส่ง บอร์ดได้รับการทดสอบที่แรงดันพิกัด 1.25 เท่า — หากทนได้ที่ระดับนั้น ก็จะทำงานได้ดีบนน้ำ
      icon: tabler:wind
    - title: การทดสอบความแข็งแรงของรอยเชื่อมตะเข็บ
      description: ตัวอย่างสุ่มจากแต่ละชุดการผลิตจะผ่านการทดสอบความแข็งแรงของตะเข็บแบบทำลายล้าง ผลลัพธ์จะถูกบันทึกและติดตามได้จนถึงการดำเนินการผลิตเฉพาะ
      icon: tabler:files
    - title: การทดสอบในน้ำ
      description: ทุกรุ่นผ่านการทดลองในทะเลก่อนการรับรอง การทดสอบในโลกแห่งความเป็นจริงในสภาพชายฝั่งจะตรวจสอบประสิทธิภาพ การควบคุมทิศทาง และความเสถียร
      icon: tabler:droplet
expertise_design:
  tagline: การออกแบบและวิศวกรรม
  title: ออกแบบมาเพื่อสภาวะจริง
  subtitle: ปรัชญาการออกแบบของเราเริ่มต้นด้วยวิธีการใช้งานบอร์ด จากนั้นจึงสร้างวิศวกรรมตามกรณีการใช้งานนั้น
  items:
    - title: การออกแบบตัวเรือเพื่อประสิทธิภาพ
      description: รูปทรงตัวเรือแต่ละแบบปรับจูนตามการใช้งาน — หัวแบบ displacement เพื่อการร่อนน้ำแบบทัวริ่ง โค้ง rocker เพิ่มเพื่อความคล่องตัวในเซิร์ฟ และโปรไฟล์แบนเสถียรสำหรับตกปลาและโยคะ
    - title: ความปลอดภัยด้วยโครงสร้างดรอปสติทช์
      description: บอร์ดทุกลำมีแกนดรอปสติทช์แบบแข็งพร้อมขอบบอร์ดที่เสริมความแข็งแรง หากส่วนใดได้รับความเสียหาย โครงสร้างดรอปสติทช์ที่ทนแรงดึงสูงจะช่วยให้บอร์ดยังใช้งานได้
    - title: การจัดวางดาดฟ้าตามหลักสรีรศาสตร์
      description: การแบ่งโซนแผ่นรองดาดฟ้า ตำแหน่งที่จับหิ้ว และจุดติดตั้งอุปกรณ์ ออกแบบโดยคำนึงถึงความสะดวกสบายของผู้ขี่ในระหว่างการใช้งานที่ยาวนาน — ไม่ว่าจะเป็นการทัวริ่ง ตกปลา หรือลาดตระเวน
    - title: การกำหนดค่าตามความต้องการเฉพาะ
      description: สีขอบบอร์ด การจัดวางแผ่นรองดาดฟ้า จุดติดตั้งอุปกรณ์เสริม ความจุอุปกรณ์ — แต่ละรุ่นสามารถปรับแต่งให้ตรงกับความต้องการในการใช้งานเฉพาะได้
cta:
  title: มีแอปพลิเคชันเฉพาะอยู่ในใจหรือไม่?
  subtitle: ทีมวิศวกรของเราสามารถให้คำแนะนำในการเลือกใช้วัสดุ การออกแบบ และการผลิตสำหรับโครงการของคุณได้
  actions:
    - variant: primary
      text: สอบถามวิศวกรของเรา

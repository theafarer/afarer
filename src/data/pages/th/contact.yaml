meta:
  title: 'ติดต่อเรา — สอบถามความร่วมมือและสินค้า | {SITE}'
  description: 'ติดต่อ afarer สำหรับสอบถามความร่วมมือ โครงการร่วมแบรนด์และแบรนด์ส่วนตัว หรือกองเรือมืออาชีพ ผู้ผลิตบอร์ด SUP แบบสูบลมและเรือพอง เราตอบกลับภายใน 2 วันทำการ'
  keywords:
    - 'ติดต่อ afarer'
    - 'ข้อเสนอ SUP สำหรับตัวแทนจำหน่าย'
    - 'ผู้จัดจำหน่าย SUP มืออาชีพ'
    - 'ติดต่อผู้ผลิต SUP'
hero_text:
  tagline: ติดต่อเรา
  title: พูดคุยกับทีมงานของเรา
contact_form:
  id: form
  title: ส่งข้อความถึงเรา
  subtitle: สำหรับใบเสนอราคา คำถามทางเทคนิค หรือสอบถามความร่วมมือ กรุณาส่งข้อความถึงเรา เราจะตอบกลับภายในหนึ่งวันทำการ
  email_to: info@afarer.com
  submit_button: ส่งคำถาม → ขอใบเสนอราคา
  success_message: ขอบคุณ! ข้อความของคุณถึงกล่องจดหมายของเราแล้ว เราจะตอบกลับภายในหนึ่งวันทำการ
  error_message: เกิดข้อผิดพลาดในการส่งข้อความของคุณ กรุณาลองอีกครั้งหรือส่งอีเมลถึงเราโดยตรง
  default_country_code: '+1'
  captcha:
    label: 'ป้องกันสแปม: กรุณาแก้ปัญหาต่อไปนี้'
  fields:
    - name: country
      label: ประเทศ
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: ปริมาณการสั่งซื้อโดยประมาณ
      row: 2
      type: select
      options:
        - value: ''
          label: เลือกปริมาณโดยประมาณของคุณ...
        - value: sample
          label: เฉพาะตัวอย่าง / ต้นแบบเท่านั้น
        - value: '5-10'
          label: 5–10 ลำ (MOQ มาตรฐาน)
        - value: '100-500'
          label: 100–500 หน่วย
        - value: '500-plus'
          label: 500+ ลำ (ราคาสำหรับสั่งซื้อจำนวนมาก)
      step: 1
    - name: customization
      label: ต้องการปรับแต่งหรือไม่?
      row: 3
      type: select
      options:
        - value: ''
          label: เลือกประเภทการปรับแต่ง...
        - value: none
          label: ผลิตภัณฑ์มาตรฐาน (ไม่มีการปรับแต่ง)
        - value: logo
          label: เฉพาะโลโก้ / แบรนด์สั่งทำ
        - value: full
          label: ร่วมแบรนด์ครบวงจร (ขนาด สี กราฟิก บรรจุภัณฑ์)
        - value: consultation
          label: ไม่แน่ใจ — ต้องการคำปรึกษา
      step: 1
    - name: productInterest
      label: หมวดหมู่สินค้าที่สนใจ
      row: 4
      type: select
      options:
        - value: ''
          label: เลือกหมวดหมู่สินค้า...
        - value: all
          label: สินค้าทั้งหมด / แคตตาล็อกฉบับสมบูรณ์
        - value: sup
          label: บอร์ดซัพ / แพดเดิลบอร์ด
        - value: safety
          label: อุปกรณ์ความปลอดภัย / เสื้อชูชีพ
        - value: accessory
          label: อุปกรณ์เสริม (ปั๊มลม พาย กระเป๋า)
      step: 1
    - name: firstName
      label: ชื่อ
      row: 1
      step: 2
    - name: lastName
      label: นามสกุล
      row: 1
      step: 2
    - name: companyName
      label: ชื่อบริษัท
      row: 2
      step: 2
    - name: email
      label: อีเมล
      row: 3
      type: email
      step: 2
    - name: tel
      label: โทรศัพท์
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: ที่อยู่
      row: 4
      step: 2
    - name: zip
      label: รหัสไปรษณีย์
      row: 5
      step: 2
    - name: subject
      label: หัวข้อ
      row: 1
      step: 3
    - name: message
      label: ข้อความ
      row: 2
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: ช่องทางอื่นในการติดต่อเรา
  columns: 3
  items:
    - title: สอบถามการขาย
      description: ใบเสนอราคา การกำหนดค่า การสมัครเป็นตัวแทนจำหน่าย และคำสั่งซื้อจำนวนมาก
      icon: tabler:shopping-bag
    - title: ฝ่ายสนับสนุนทางเทคนิค
      description: การรับประกัน การซ่อมแซม อะไหล่ และคำถามเกี่ยวกับการใช้งาน
      icon: tabler:tool
    - title: สื่อและพันธมิตร
      description: สื่อ kits การสนับสนุน และความร่วมมือทางอุตสาหกรรม
      icon: tabler:news
    - title: โทรศัพท์
      description: +86 13305324192
      icon: tabler:headset
    - title: อีเมล
      description: info@afarer.com
      icon: tabler:mail
    - title: สำนักงานใหญ่
      description: เขตพัฒนาเศรษฐกิจ ไล่ซี ชิงเต่า ประเทศจีน 266600
      icon: tabler:map-pin
map:
  title: ที่ตั้งของเรา
  subtitle: เยี่ยมชมเราที่สำนักงานใหญ่
  address: เขตพัฒนาเศรษฐกิจ ไล่ซี ชิงเต่า ประเทศจีน 266600
  zoom: 15

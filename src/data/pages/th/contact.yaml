hero_text:
  tagline: Contact
  title: GET IN TOUCH
contact_form:
  id: form
  title: ส่งข้อความถึงเรา
  subtitle: สำหรับใบเสนอราคา คำถามทางเทคนิค หรือสอบถามความร่วมมือ กรุณาส่งข้อความถึงเรา เราจะตอบกลับภายในหนึ่งวันทำการ
  email_to: info@afarer.com
  submit_button: ส่งคำถาม → ขอใบเสนอราคา
  success_message: ขอบคุณ! ข้อความของคุณถึงกล่องจดหมายของเราแล้ว เราจะตอบกลับภายในหนึ่งวันทำการ
  error_message: เกิดข้อผิดพลาดในการส่งข้อความของคุณ กรุณาลองอีกครั้งหรือส่งอีเมลถึงเราโดยตรง
  default_country_code: '+1'
  captcha:
    label: 'ป้องกันสแปม: กรุณาแก้ปัญหาต่อไปนี้'
  fields:
    - name: firstName
      label: ชื่อ
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: นามสกุล
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: ชื่อบริษัท
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: ที่อยู่
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: รหัสไปรษณีย์
      row: 4
      step: 2
    - name: country
      label: ประเทศ
      row: 4
      step: 2
    - name: email
      label: อีเมล
      row: 5
      step: 2
    - name: tel
      label: โทรศัพท์
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: ปริมาณการสั่งซื้อโดยประมาณ
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: ต้องการปรับแต่งหรือไม่?
      row: 7
      step: 2
    - name: productInterest
      label: หมวดหมู่สินค้าที่สนใจ
      row: 8
      step: 2
    - name: subject
      label: หัวข้อ
      row: 9
      step: 3
    - name: message
      label: ข้อความ
      row: 10
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: ช่องทางอื่นในการติดต่อเรา
  columns: 3
  items:
    - title: สอบถามการขาย
      description: ใบเสนอราคา การกำหนดค่า การสมัครเป็นตัวแทนจำหน่าย และคำสั่งซื้อจำนวนมาก
      icon: tabler:shopping-bag
    - title: ฝ่ายสนับสนุนทางเทคนิค
      description: การรับประกัน การซ่อมแซม อะไหล่ และคำถามเกี่ยวกับการใช้งาน
      icon: tabler:tool
    - title: สื่อและพันธมิตร
      description: สื่อ kits การสนับสนุน และความร่วมมือทางอุตสาหกรรม
      icon: tabler:news
    - title: โทรศัพท์
      description: +86 13305324192
      icon: tabler:headset
    - title: อีเมล
      description: info@afarer.com
      icon: tabler:mail
    - title: สำนักงานใหญ่
      description: Economic Development Zone, Laixi, Qingdao, China, 266600
      icon: tabler:map-pin
map:
  title: ที่ตั้งของเรา
  subtitle: เยี่ยมชมเราที่สำนักงานใหญ่
  address: Economic Development Zone, Laixi, Qingdao, China, 266600
  zoom: 15

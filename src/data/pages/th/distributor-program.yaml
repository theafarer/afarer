  - value: '15,000+'
    label: 'บอร์ดที่ผลิตต่อปี'
features:
  title: 'ทำไมต้องร่วมงานกับ Afarer'
  subtitle: 'ออกแบบมาสำหรับพันธมิตรช่องทางที่ต้องการสร้างธุรกิจกีฬาทางน้ำกับแบรนด์ที่มีมาตรฐาน'
  columns: 3
  items:
    - title: 'ความเป็นเอกสิทธิ์ในเขตพื้นที่'
      description: 'ตลาดที่ได้รับการคุ้มครองในประเทศหรือภูมิภาค ตัวแทนจำหน่ายหนึ่งราย ไม่มีการแข่งขันภายใน ไม่มีความขัดแย้งของช่องทาง — การลงทุนของคุณสร้างปราการของคุณเอง'
      icon: 'tabler:shield-check'
    - title: 'มาร์จิ้นจากโรงงานโดยตรง'
      description: 'ลิสต์ราคาตัวแทนจำหน่ายพร้อมส่วนลดตามปริมาณที่ตกลงกัน ไม่มีตัวกลาง จัดส่ง FOB ชิงเต่า พร้อมเอกสารส่งออกครบชุด'
      icon: 'tabler:coins'
    - title: 'Distributor Success Program'
      description: 'การปฐมนิเทศที่มีโครงสร้าง การวางแผนเข้าสู่ตลาด การอบรมสินค้าและการขาย การสนับสนุนฝูงสินค้าโชว์ และเครื่องมือการตลาดร่วม'
      icon: 'tabler:rocket'
    - title: 'การสนับสนุนด้านการตลาดและแบรนด์'
      description: 'สื่อแคมเปญที่แปลเป็นท้องถิ่น สื่อ ณ จุดขาย ชุดงานอีเวนต์ และคอนเทนต์ดิจิทัลหลายภาษา'
      icon: 'tabler:mood-smile'
    - title: 'ห่วงโซ่อุปทานที่เชื่อถือได้'
      description: 'การผลิตที่รับรอง ISO และ CE พร้อมการควบคุมคุณภาพที่สม่ำเสมอ MOQ ที่คาดการณ์ได้ และระยะเวลาจัดส่งที่คุณวางแผนได้'
      icon: 'tabler:building-factory'
    - title: 'ผู้จัดการบัญชีเฉพาะ'
      description: 'ผู้จัดการจัดจำหน่ายส่วนตัวสำหรับการคาดการณ์ การวางแผนคำสั่งซื้อ และการสนับสนุนหลังการขาย'
      icon: 'tabler:user-check'
table:
  title: 'ระดับโปรแกรมและเงื่อนไขคำสั่งซื้อ'
  subtitle: 'เลือกระดับที่เหมาะกับศักยภาพตลาดของคุณ ราคาทั้งหมดเป็น USD, FOB ชิงเต่า'
  caption: 'คำสั่งซื้อตัวอย่าง (5–10 ชิ้น) ไม่มีการคุ้มครองเขตพื้นที่ เงื่อนไขจะตกลงในสัญญาตัวแทนจำหน่ายของคุณก่อนการจัดส่ง'
  head:
    - ระดับโปรแกรม
    - คำสั่งซื้อขั้นต่ำ (ชิ้น)
    - ระยะเวลาจัดส่ง
    - การชำระเงิน
  rows:
    - [ตัวอย่าง / ประเมินสินค้า, 5–10, 15–20 วันทำการ, ชำระล่วงหน้า 100%]
    - [คำสั่งซื้อทดลอง, 10–30, 30–45 วัน, ชำระล่วงหน้า 100%]
    - [ตัวแทนจำหน่ายที่ได้รับอนุญาต, 30–50, 30–45 วัน, จ่ายมัดจำ 30% / 70% ก่อนจัดส่ง]
    - [ตัวแทนจำหน่ายประเทศ / ภูมิภาค, 100–300, 30–45 วัน, จ่ายมัดจำ 30% / 70% ก่อนจัดส่ง]
    - [Custom และ Private Label (มาตรฐาน), 50+, 30–45 วัน, จ่ายมัดจำ 30% / 70% ก่อนจัดส่ง]
    - [ปรับแต่งเชิงลึก (แม่พิมพ์ใหม่ บรรจุภัณฑ์), 200+, 45–60 วัน, จ่ายมัดจำ 30% / 70% ก่อนจัดส่ง]
    - [สิทธิ์สายผลิตภัณฑ์ทั้งหมด, 300–1, 000, 60–90 วัน, จ่ายมัดจำ 30% / 70% ก่อนจัดส่ง]
faqs:
  title: 'โปรแกรมตัวแทนจำหน่าย — คำถามที่พบบ่อย'
  subtitle: 'ทุกสิ่งที่ตัวแทนจำหน่ายสอบถามก่อนสมัคร'
  items:
    - title: 'หนึ่งประเทศ หนึ่งตัวแทนจำหน่ายหมายถึงอะไร?'
      description: 'Afarer ให้สิทธิ์เอกสิทธิ์แก่ตัวแทนจำหน่ายที่ได้รับอนุญาตรายเดียวสำหรับประเทศหรือภูมิภาค คุณเป็นเจ้าของตลาดของคุณ — ไม่มีการนำเข้าขนาน ไม่มีการแข่งขันภายใน'
    - title: 'คำสั่งซื้อแรกขั้นต่ำคือเท่าไร?'
      description: 'ตัวแทนจำหน่ายประเทศและภูมิภาคเริ่มที่ 100–300 ชิ้น ตัวแทนจำหน่ายที่ได้รับอนุญาตจาก 30–50 ชิ้น คำสั่งซื้อทดลอง 10–30 ชิ้นให้คุณตรวจสอบตลาดก่อน (โดยไม่มีการคุ้มครองเขตพื้นที่)'
    - title: 'ตัวแทนจำหน่ายได้รับการสนับสนุนอะไรบ้าง?'
      description: 'Distributor Success Program ครอบคลุมการปฐมนิเทศ การวางแผนเข้าสู่ตลาด การอบรมสินค้าและการขาย การสนับสนุนฝูงสินค้าโชว์ สื่อการตลาดท้องถิ่น และผู้จัดการบัญชีเฉพาะ'
    - title: 'Afarer ปกป้องฉันจากความขัดแย้งของช่องทางอย่างไร?'
      description: 'แต่ละเขตพื้นที่มีตัวแทนจำหน่ายที่ได้รับอนุญาตหนึ่งรายพอดี คำสั่งซื้อตรงจากภูมิภาคของคุณผ่านคุณ และราคาได้รับการกำหนดเพื่อปกป้องมาร์จิ้นของคุณ'
    - title: 'เงื่อนไขการจัดส่งและการชำระเงินคืออะไร?'
      description: 'คำสั่งซื้อจัดส่ง FOB ชิงเต่า พร้อมเอกสารส่งออกครบชุด คำสั่งซื้อการผลิตมัดจำ 30% และชำระ 70% ก่อนจัดส่ง คำสั่งซื้อทดลองและตัวอย่างชำระล่วงหน้า'
    - title: 'ฉันจะสมัครได้อย่างไร?'
      description: 'ส่งใบสมัครผ่านแบบฟอร์มติดต่อ เราประเมินความเหมาะสมของตลาด การมีหน้าร้าน และความสามารถด้านโลจิสติกส์ แล้วตอบกลับภายใน 3 วันทำการพร้อมขั้นตอนถัดไปและตัวอย่างสัญญาตัวแทนจำหน่าย'
cta:
  title: 'พร้อมที่จะเป็นเจ้าของตลาดของคุณหรือยัง?'
  subtitle: 'สมัครโปรแกรมตัวแทนจำหน่ายของ Afarer และรับคำตอบภายใน 3 วันทำการ'
  actions:
    - text: 'สมัครเป็นตัวแทนจัดจำหน่าย'
      href: /contact?subject=Distributor Application
      variant: primary
    - text: 'ดาวน์โหลดโปรแกรมตัวแทนจำหน่าย'
      href: /distributor-program
      variant: secondary
geo:
  tagline: 'คุณจะให้บริการใคร'
  sentence: 'Afarer ร่วมงานกับตัวแทนจำหน่ายที่มีชื่อเสียงในอุตสาหกรรมเดินเรือ กลางแจ้ง และกีฬา ซึ่งให้บริการห่วงโซ่ค้าปลีก กองเรือเช่า โรงเรียนกีฬาทางน้ำ รีสอร์ต และผู้ซื้อภาครัฐ ด้วยแพดเดิลบอร์ด SUP แบบพองได้ระดับพรีเมียมและอุปกรณ์ทางน้ำ'
  audiences:
    - 'ตัวแทนจำหน่ายทางทะเลและเรือ'
    - 'ค้าปลีกกลางแจ้งและกีฬา'
    - 'ผู้ดำเนินการเช่าและรีสอร์ต'
    - 'โรงเรียนกีฬาทางน้ำ'

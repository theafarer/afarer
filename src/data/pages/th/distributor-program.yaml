geo:
  tagline: 'เราเป็นพันธมิตรกับใคร'
  sentence: 'Afarer เป็นพันธมิตรกับตัวแทนจำหน่ายด้านการเดินเรือ กลางแจ้ง และกีฬาที่มีชื่อเสียง ซึ่งให้บริการห่วงโซ่ค้าปลีก กองเรือเช่า โรงเรียนกีฬาทางน้ำ รีสอร์ต และผู้ซื้อภาครัฐด้วยบอร์ด SUP แบบเป่าลมระดับพรีเมียมและยานพาหนะทางน้ำ — และมุ่งมั่นที่จะสร้างแบรนด์ Afarer ในประเทศของตน'
  audiences:
    - 'ตัวแทนจำหน่ายทางทะเลและเรือ'
    - 'ค้าปลีกกลางแจ้งและกีฬา'
    - 'ผู้ดำเนินการเช่าและรีสอร์ต'
    - 'โรงเรียนกีฬาทางน้ำ'
    - 'ชุมชนกีฬาทางทะเล'

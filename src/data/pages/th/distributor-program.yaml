hero:
  tagline: 'พันธมิตรระดับประเทศ'
  title: 'หนึ่งประเทศ.<br />หนึ่งตัวแทนจำหน่าย Afarer อย่างเป็นทางการ.'
  subtitle: 'Afarer แต่งตั้งตัวแทนจำหน่ายระดับประเทศที่ได้รับอนุญาตเพียงรายเดียวสำหรับแต่ละตลาดที่ได้รับการอนุมัติ เขตพื้นที่เอกสิทธิ์ ราคาตัวแทนจำหน่ายพร้อมส่วนลดประจำปี และโปรแกรมสนับสนุนตัวแทนจำหน่ายครบวงจร — เพื่อแลกกับสัญญาที่ลงนามและความมุ่งมั่นอย่างแท้จริงในการสร้างตลาด'
  actions:
    - text: 'สมัครพันธมิตรระดับประเทศ'
      href: /contact?subject=Country Partnership Application
      variant: primary
    - text: 'ค้นหาตัวแทนจำหน่ายในพื้นที่ของคุณ'
      href: /distributor-program
      variant: secondary
    - text: 'ขอลิสต์ราคาตัวแทนจำหน่าย'
      href: /contact?subject=Dealer Price List
      variant: secondary

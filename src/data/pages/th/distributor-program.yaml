meta:
  title: 'พันธมิตรระดับประเทศ — หนึ่งประเทศ หนึ่งตัวแทนจำหน่าย Afarer อย่างเป็นทางการ | {SITE}'
  description: 'สมัครเพื่อเป็นตัวแทนจำหน่าย Afarer อย่างเป็นทางการประจำประเทศของคุณ หนึ่งพันธมิตรที่ได้รับอนุญาตต่อหนึ่งตลาด การคุ้มครองเขตพื้นที่ มาร์จิ้นจากโรงงานโดยตรง ส่วนลดประจำปี และโปรแกรมสนับสนุนพันธมิตรประเทศ 10 โมดูล สำหรับตัวแทนจำหน่าย SUP และกีฬาทางน้ำทั่วโลก'
  keywords:
    - 'โปรแกรมพันธมิตรระดับประเทศ'

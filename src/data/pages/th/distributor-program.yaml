features:
  title: 'ทำไมต้องร่วมงานกับ Afarer'
  subtitle: 'โมเดลหนึ่งประเทศหนึ่งตัวแทนจำหน่าย พร้อมโครงสร้างสนับสนุนที่ทำให้เขตพื้นที่คุ้มค่าการลงทุน ความเป็นเอกสิทธิ์ต้องสร้างและรักษาไว้ — ไม่ใช่สิทธิถาวร'
  columns: 3
  items:
    - title: 'ความเป็นเอกสิทธิ์ในเขตพื้นที่'
      description: 'ตัวแทนจำหน่ายที่ได้รับอนุญาตหนึ่งรายต่อประเทศหรือภูมิภาค ไม่มีการนำเข้าขนาน ไม่มีการแข่งขันภายใน การลงทุนของคุณสร้างปราการของคุณเอง'
      icon: 'tabler:shield-check'
    - title: 'การป้องกันความขัดแย้งของช่องทาง'
      description: 'คำสั่งซื้อตรงจากภูมิภาคของคุณจะถูกส่งผ่านคุณ และการกำหนดราคาช่วยปกป้องมาร์จิ้นของคุณ Afarer จะไม่ขายอ้อมพันธมิตรระดับประเทศของตน'
      icon: 'tabler:users'
    - title: 'มาร์จิ้นจากโรงงานโดยตรงและส่วนลด'
      description: 'ลิสต์ราคาตัวแทนจำหน่ายพร้อมส่วนลดตามปริมาณที่ตกลงกัน ไม่มีตัวกลาง จัดส่ง FOB Qingdao พร้อมเอกสารส่งออกครบชุด'
      icon: 'tabler:coins'
    - title: 'โปรแกรมสนับสนุนพันธมิตร 10 โมดูล'
      description: 'การปฐมนิเทศ การเข้าสู่ตลาด การอบรม การตลาดและเงินทุนตลาดร่วม อะไหล่และการบริการหลังการขาย การรับประกัน เครื่องมือสั่งซื้อ และพอร์ทัลพันธมิตร — ครอบคลุมอยู่ใน Distribution Agreement ของคุณ'
      icon: 'tabler:rocket'
    - title: 'การตลาดและเงินทุนตลาดร่วม'
      description: 'สื่อแคมเปญที่ปรับเป็นท้องถิ่น สื่อ ณ จุดขายสำหรับตัวแทนจำหน่าย ชุดงานอีเวนต์ คอนเทนต์ดิจิทัลหลายภาษา และการสนับสนุนการตลาดร่วมสำหรับฤดูกาลเปิดตัว'
      icon: 'tabler:mood-smile'
    - title: 'การอบรมด้านผลิตภัณฑ์ การขาย และเทคนิค'
      description: 'ช่วงปฐมนิเทศที่มีโครงสร้างครอบคลุมความรู้ด้านผลิตภัณฑ์ การขาย และเทคนิค พร้อมกับสื่อที่อัปเดตตามวิวัฒนาการของกลุ่มผลิตภัณฑ์'
      icon: 'tabler:presentation'
    - title: 'อะไหล่และการสนับสนุนหลังการขาย'
      description: 'การจัดหาอะไหล่ การลงทะเบียนรับประกันและการจัดการเคลม ตลอดจนเอกสารข้อมูลผลิตภัณฑ์และคู่มือสำหรับทีมบริการในพื้นที่ของคุณ'
      icon: 'tabler:settings'
    - title: 'ผู้จัดการบัญชีเฉพาะและพอร์ทัลพันธมิตร'
      description: 'ผู้จัดการตัวแทนจำหน่ายส่วนตัว พร้อมการเข้าถึงลิสต์ราคา สถานะคำสั่งซื้อ และทรัพยากรทางการตลาดผ่านพอร์ทัลพันธมิตรของ Afarer'
      icon: 'tabler:user-check'
table:
  title: 'ระดับพันธมิตร MOQ และเงื่อนไขคำสั่งซื้อ'
  subtitle: 'เลือกระดับที่สอดคล้องกับศักยภาพตลาดของคุณ ราคาทั้งหมดเป็น USD, FOB Qingdao'
  caption: 'คำสั่งซื้อตัวอย่างและทดลอง (5–30 ยูนิต) ไม่มีการคุ้มครองเขตพื้นที่ ความเป็นเอกสิทธิ์ระดับประเทศใช้กับสัญญา Country / Regional Distributor ที่ลงนามเท่านั้น — โดยต้องรักษาไว้ด้วยความสำเร็จของคำสั่งซื้อแรก เป้าหมายการซื้อประจำปี การสต็อกในประเทศ ความสามารถด้านหลังการขาย และการลงทุนในตลาดอย่างต่อเนื่อง และไม่ได้เป็นสิทธิถาวรหรือตลอดกาล'
  head:
    - 'ระดับพันธมิตร'
    - 'คำสั่งซื้อขั้นต่ำ (หน่วย)'
    - 'ระยะเวลาจัดส่ง'
    - 'การชำระเงิน'
  rows:
    - [ตัวอย่าง / การประเมินสินค้า, 5–10, 15–20 วันทำการ, 100% prepaid]
    - [คำสั่งซื้อทดลอง, 10–30, 30–45 วันทำการ, 100% prepaid]
    - [Authorized Dealer, 30–50, 30–45 วันทำการ, มัดจำ 30% / 70% ก่อนจัดส่ง]
    - [Country / Regional Distributor, 100–300, 30–45 วันทำการ, มัดจำ 30% / 70% ก่อนจัดส่ง]
    - [Custom & Private Label (standard), 50+, 30–45 วันทำการ, มัดจำ 30% / 70% ก่อนจัดส่ง]
    - [Deep Custom (new molds, packaging), 200+, 45–60 วันทำการ, มัดจำ 30% / 70% ก่อนจัดส่ง]
    - [Full Product Line Rights, '300–1,000', 60–90 วันทำการ, มัดจำ 30% / 70% ก่อนจัดส่ง]
faqs:
  title: 'พันธมิตรระดับประเทศ — คำถามที่พบบ่อย'
  subtitle: 'คำถามที่พันธมิตรระดับประเทศจริงจังมักถามก่อนสมัคร'
  items:
    - title: 'หนึ่งประเทศหนึ่งตัวแทนจำหน่ายหมายถึงอะไรกันแน่?'
      description: 'Afarer แต่งตั้งตัวแทนจำหน่ายที่ได้รับอนุญาตเพียงรายเดียวที่มีสิทธิ์เอกสิทธิ์สำหรับเขตพื้นที่ที่กำหนด เราจะไม่ขายจากช่องทางทั่วโลกหรือภูมิภาคเข้าสู่ประเทศที่ได้รับการคุ้มครอง ความเป็นเจ้าของเขตพื้นที่ของคุณจะยังคงอยู่ตราบเท่าที่ปฏิบัติตาม Distribution Agreement'
    - title: 'เขตพื้นที่เป็นเอกสิทธิ์ตลอดไปหรือไม่?'
      description: 'ไม่ ความเป็นเอกสิทธิ์มีเงื่อนไข ไม่ใช่ตลอดกาล โดยรักษาไว้ผ่าน Distribution Agreement ที่ลงนาม ความสำเร็จของคำสั่งซื้อแรก เป้าหมายการซื้อประจำปี การสต็อกในประเทศ ความสามารถด้านหลังการขาย และการลงทุนในตลาดอย่างต่อเนื่อง หากไม่เป็นไปตามเงื่อนไขเหล่านี้ เขตพื้นที่อาจถูกเจรจาใหม่หรือมอบหมายใหม่'
    - title: 'คำสั่งซื้อแรกขั้นต่ำคือเท่าไร?'
      description: 'ตัวแทนจำหน่ายระดับประเทศและภูมิภาคเริ่มต้นที่ 100–300 ยูนิต ตัวแทนจำหน่ายที่ได้รับอนุญาตที่ 30–50 ยูนิต คำสั่งซื้อทดลอง 10–30 ยูนิตให้คุณตรวจสอบตลาดก่อนได้ (คำสั่งซื้อทดลองและตัวอย่างไม่มีการคุ้มครองเขตพื้นที่) โปรแกรม Custom และ Private Label มี MOQ แยกตามที่ระบุในระดับด้านบน'
    - title: 'โปรแกรมสนับสนุน 10 โมดูลครอบคลุมการสนับสนุนอะไรบ้าง?'
      description: 'ระดับและคุณสมบัติ การคุ้มครองเขตพื้นที่ MOQ / ราคา / ส่วนลดประจำปี สินค้าคงคลังและการดำเนินการตามคำสั่งซื้อ สื่อทางการตลาดและเงินทุนตลาดร่วม การอบรมด้านผลิตภัณฑ์ / การขาย / เทคนิค อะไหล่และหลังการขาย การลงทะเบียนรับประกัน พอร์ทัลพันธมิตร ตลอดจนเอกสารข้อมูลผลิตภัณฑ์ คลังสื่อการตลาด ตารางส่วนลดประจำปี และรายการจัดส่งและบรรจุภัณฑ์'
    - title: 'Afarer ปกป้องฉันจากความขัดแย้งของช่องทางอย่างไร?'
      description: 'แต่ละเขตพื้นที่มีตัวแทนจำหน่ายที่ได้รับอนุญาตหนึ่งรายพอดี การสอบถามและคำสั่งซื้อตรงจากภูมิภาคของคุณจะถูกส่งผ่านคุณ แบบฟอร์มเว็บไซต์จะถูกส่งต่อไปยังพันธมิตรในพื้นที่ถ้ามี และทีมระดับโลกจะยกระดับเฉพาะเมื่อพันธมิตรไม่ตอบสนองเท่านั้น'
    - title: 'เงื่อนไขการจัดส่งและการชำระเงินเป็นอย่างไร?'
      description: 'คำสั่งซื้อจัดส่งแบบ FOB Qingdao พร้อมเอกสารส่งออกครบชุด คำสั่งซื้อการผลิตจ่ายมัดจำ 30% และชำระ 70% ก่อนจัดส่ง คำสั่งซื้อทดลองและตัวอย่างชำระล่วงหน้า ระยะเวลาจัดส่งมาตรฐานคือ 30–45 วันทำการ และ 15–20 วันทำการสำหรับรอบการผลิตตัวอย่าง'
    - title: 'ฉันจะสมัครได้อย่างไร?'
      description: 'ส่งใบสมัครของคุณผ่านแบบฟอร์มติดต่อพร้อมรายละเอียดตลาด เราจะประเมินความเหมาะสมของตลาด การมีตัวตนในค้าปลีก และความสามารถด้านโลจิสติกส์ จากนั้นตอบกลับภายใน 3 วันทำการพร้อมขั้นตอนถัดไปและตัวอย่าง Distribution Agreement'

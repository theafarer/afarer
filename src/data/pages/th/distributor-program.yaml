meta:
  title: 'โครงการตัวแทนจำหน่าย — เป็นตัวแทนจำหน่าย Afarer ที่ได้รับอนุญาต | {SITE}'
  description: 'สมัครเพื่อเป็นตัวแทนจำหน่าย Afarer ที่ได้รับอนุญาต หนึ่งตัวแทนจำหน่ายต่อประเทศ ราคาโรงงานโดยตรง การสนับสนุนด้านการตลาด และ Distributor Success Program สำหรับพันธมิตร SUP และกีฬาทางน้ำทั่วโลก'
  keywords:
    - 'โปรแกรมตัวแทนจำหน่าย'
    - 'เป็นตัวแทนจำหน่าย'
    - 'การจัดจำหน่าย SUP'
    - 'ตัวแทนจำหน่ายแพดเดิลบอร์ด'
    - 'การจัดจำหน่ายกีฬาทางน้ำ'
    - 'สมัครพันธมิตรประเทศ'
hero:
  tagline: 'โครงการตัวแทนจำหน่าย'
  title: 'เป็นตัวแทนจำหน่าย Afarer<br />ที่ได้รับอนุญาต'
  subtitle: 'ตัวแทนจำหน่ายที่ได้รับอนุญาตหนึ่งรายต่อประเทศหรือภูมิภาค ความเป็นเอกสิทธิ์ในเขตพื้นที่ ราคาตัวแทนจำหน่าย การสนับสนุนการตลาด และโปรแกรมที่ทำให้ช่องทางของคุณขายได้ตั้งแต่วันแรก'
  actions:
    - text: 'สมัครเป็นตัวแทนจัดจำหน่าย'
      href: /contact?subject=Distributor Application
      variant: primary
    - text: 'ขอลิสต์ราคาตัวแทนจำหน่าย'
      href: /contact?subject=Dealer Price List
      variant: secondary
    - text: 'ดาวน์โหลดโปรแกรมตัวแทนจำหน่าย'
      href: /distributor-program
      variant: secondary
stats:
  - value: '1'

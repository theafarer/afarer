meta:
  title: 'Custom Lab — พายบอร์ดแบบสูบลมที่ปรับแต่งได้ | {SITE}'
  description: 'พายบอร์ดแบบสูบลมที่ปรับแต่งได้: การออกแบบเฉพาะ โลโก้ แม่พิมพ์ของตัวเอง และการผลิต พันธมิตร SUP แบรนด์ส่วนตัว ขั้นต่ำ 50 ชิ้น รับรอง CE'
  keywords:
    - 'ผู้ผลิตพายบอร์ดที่ปรับแต่งได้'
    - 'SUP แบบสูบลมที่ปรับแต่งได้'
    - 'พายบอร์ดพร้อมโลโก้'
    - 'SUP แบบสูบลมแบรนด์ส่วนตัว'
    - 'การผลิตพายบอร์ด'
hero:
  tagline: afarer Custom Lab
  title: ออกแบบบอร์ด SUP<br />ด้วยตัวคุณเอง
  subtitle: นำเสนอการผลิตแบบร่วมแบรนด์ แบรนด์ส่วนตัว และแบรนด์ตามสั่งสำหรับธุรกิจทั่วโลก ตั้งแต่ต้นแบบเพียงชิ้นเดียวไปจนถึงการผลิตเต็มรูปแบบ
  cta: เริ่มต้นโปรเจกต์ของคุณ
  footer_link: /contact
steps_section:
  tagline: วิธีการทำงาน
  title: จากแนวคิดสู่การผลิต
  subtitle: สี่ขั้นตอนจากไอเดียของคุณสู่ผลิตภัณฑ์สำเร็จรูปที่พร้อมออกทะเล
  steps:
    - num: '01'
      title: เลือกบอร์ดของคุณ
      desc: เลือกรุ่น SUP หลักของเรา —ออลราวด์ ทัวริ่ง โยคะ สปอร์ต หรือรุ่นเด็ก เลือกขนาด วัสดุ และสีได้ตามต้องการ
    - num: '02'
      title: อัปโหลดแบบของคุณ
      desc: ส่งโลโก้ อาร์ตเวิร์ก หรือแนวทางแบรนด์ของคุณมาให้เรา ทีมออกแบบของเราจะเตรียมตัวอย่างงานดิจิทัลให้คุณตรวจสอบ
    - num: '03'
      title: การตรวจสอบภาพจำลอง (Mockup) ด้วย AI
      desc: ดูภาพตัวอย่างที่สมจริงซึ่งสร้างด้วย AI ของบอร์ดสั่งทำพิเศษของคุณก่อนเริ่มการผลิต
    - num: '04'
      title: การผลิตและการจัดส่ง
      desc: เมื่อได้รับการอนุมัติ คำสั่งซื้อของคุณจะเข้าสู่สายการผลิตของเรา ระยะเวลาจัดส่งเริ่มต้นที่ 30 วัน
services_section:
  tagline: บริการ
  title: บริการการผลิตสำหรับแบรนด์ระดับโลก
  subtitle: โมเดลความร่วมมือที่ยืดหยุ่น —ตั้งแต่การผลิตตามสัญญาไปจนถึงการสร้างแบรนด์แบบครบวงจร
  items:
    - title: การผลิตร่วมแบรนด์
      desc: เราผลิตตามแบบของคุณตรงตามสเปก —ทรัพย์สินทางปัญญา แบบร่าง และมาตรฐานคุณภาพของคุณล้วนเป็นของคุณ พร้อมการคุ้มครองตามสัญญาไม่เปิดเผยข้อมูล (NDA) ฉบับเต็ม
      icon: ⚙️
    - title: โซลูชั่นการออกแบบ
      desc: เลือกจากแพลตฟอร์มที่ผ่านการพิสูจน์แล้วกว่า 50 แบบ และปรับแต่งขนาด สี กราฟิก และบรรจุภัณฑ์ได้ตามต้องการ
      icon: 🎨
    - title: แบรนด์ส่วนตัว (Private Label)
      desc: แบรนด์ของคุณบนผลิตภัณฑ์ของเรา — โลโก้ บรรจุภัณฑ์ ป้ายแขวน คู่มือ พร้อมวางจำหน่ายปลีกได้ทันทีจากกล่อง
      icon: 🎨
    - title: การสร้างแบรนด์ตามสั่ง
      desc: การพิมพ์แผ่นรองดาดฟ้า ลายกราฟิกตัวเรือ สติกเกอร์ท่อยาง และฉลากแบรนด์ที่กำหนดเอง —การสื่อสารแบรนด์แบบครบวงจร
      icon: ⚙️
capabilities_section:
  tagline: ความสามารถของเรา
  title: ขีดความสามารถด้านการผลิตและการปรับแต่งตามความต้องการ
  subtitle: ทุกสิ่งที่คุณต้องรู้ก่อนสั่งซื้อ
  capabilities:
    - label: ปริมาณการสั่งซื้อ
      value: MOQ 5–10 units (SUP)
    - label: ระยะเวลาจัดส่ง
      value: 30–45 วันสำหรับการผลิตมาตรฐาน; 15–20 วันสำหรับต้นแบบ
    - label: การปรับแต่งตามความต้องการของลูกค้า
      value: ขนาด รูปทรง สี กราฟิก บรรจุภัณฑ์ ฮาร์ดแวร์
    - label: วัสดุ
      value: PVC, Hypalon, drop-stitch, ไฟเบอร์กลาส, อะลูมิเนียม
    - label: การพิมพ์
      value: ดิจิทัล (CMYK), การพิมพ์สกรีน, การถ่ายโอนความร้อน, ซับลิเมชัน
    - label: การรับรอง
      value: CE, UKCA, FCC (สนับสนุนการปฏิบัติตามข้อกำหนดระดับโลก)
why_section:
  tagline: ทำไมต้องเลือก afarer
  title: โรงงานเดียว มาตรฐานเดียว ไม่มีการลดทอนคุณภาพ
  points:
    - text: โรงงานผลิตแบบครบวงจรขนาด 12,000 ตารางเมตร
      highlight: 12,000 ตร.ม.
    - text: ช่างและวิศวกรฝีมือดีกว่า 200 คน
      highlight: 200+
    - text: ผลิตเรือมากกว่า 15,000 ลำต่อปี
      highlight: 15,000+
    - text: การบริหารจัดการคุณภาพที่ได้รับการรับรอง ISO 9001
      highlight: ISO 9001
    - text: ผลิตภัณฑ์ที่ได้รับการรับรอง CE สำหรับตลาดสหภาพยุโรป
      highlight: CE
  cta: ดูรายละเอียดโรงงาน
  cta_link: /factory
  contact:
    title: พร้อมพูดคุยโปรเจกต์ของคุณแล้วหรือยัง?
    desc: ทีมงานของเราจะตอบกลับภายใน 24 ชั่วโมงพร้อมใบเสนอราคาเบื้องต้น

meta:
  title: การรับรอง CE สำหรับเรือเป่าลมทำงานอย่างไร | {SITE}
  description: คู่มือฉบับสมบูรณ์เกี่ยวกับการรับรอง CE สำหรับเรือเป่าลม บอร์ด SUP และเรือคายัค ครอบคลุมคำสั่งที่เกี่ยวข้อง (2013/53/EU RCD, PPE 2016/425) ขั้นตอนการทดสอบ หน่วยตรวจสอบที่ได้รับแจ้ง ข้อกำหนดเอกสารทางเทคนิค และภาระหน้าที่ของผู้ผลิต
back_text: กลับไปยังงานวิจัย
hero:
  tagline: การปฏิบัติตามกฎระเบียบ
  title: การรับรอง CE สำหรับเรือเป่าลมทำงานอย่างไร
  subtitle: อ่าน 7 นาที
content_html: >
  <h2>CE Certification คืออะไร?</h2>

  <p>เครื่องหมาย CE (Conformit&eacute; Europ&eacute;enne) แสดงว่าผลิตภัณฑ์เป็นไปตามข้อกำหนดด้านสุขภาพ ความปลอดภัย และสิ่งแวดล้อมของสหภาพยุโรป สำหรับเรือยางเป่าลม กรอบข้อกำหนดที่เกี่ยวข้องจะขึ้นอยู่กับประเภทของผลิตภัณฑ์</p>


  <h2>คำสั่งที่เกี่ยวข้อง</h2>


  <h3>คำสั่งเรือสันทนาการ (2013/53/EU)</h3>

  <p>เป็นคำสั่งหลักสำหรับเรือยางเป่าลม บอร์ด SUP และเรือคายัคส่วนใหญ่ ครอบคลุมเรือสันทนาการที่มีความยาวตัวเรือ 2.5 ม. ถึง 24 ม. เรือที่ผลิตบางส่วน (สำหรับการส่งมอบแบบ OEM) และยานพาหนะทางน้ำส่วนบุคคล (personal watercraft)</p>


  <h3>กฎระเบียบอุปกรณ์ป้องกันส่วนบุคคล (2016/425)</h3>

  <p>เสื้อชูชีพ อุปกรณ์ช่วยพยุงตัว และอุปกรณ์ความปลอดภัยที่มาพร้อมกับเรือต้องเป็นไปตามข้อกำหนดของกฎระเบียบ PPE รวมถึงการตรวจสอบแบบจำลอง (Module B) โดยหน่วยงานรับรอง (notified body) และการประกันคุณภาพการผลิต (Module D หรือ E)</p>


  <h2>กระบวนการรับรอง</h2>

  <ol>
    <li>การจำแนกประเภทผลิตภัณฑ์: กำหนดหมวดการออกแบบของเรือ (A – D ตามมาตรฐาน ISO 8666)</li>
    <li>มาตรฐานที่เกี่ยวข้อง: EN ISO 6185 (ตอนที่ 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (แผ่นป้ายข้อมูลผู้ผลิต)</li>
    <li>การจัดเตรียมเอกสารทางเทคนิค: แบบการออกแบบ รายการวัสดุ (Bill of Materials) ใบรับรองวัสดุ การประเมินความเสี่ยง</li>
    <li>การทดสอบแบบจำลอง: การลอยตัว ความมั่นคง ความสามารถในการรับน้ำหนัก การทดสอบวัสดุ ความแข็งแรงของตะเข็บ การกักเก็บอากาศ</li>
    <li>การควบคุมการผลิตในโรงงาน: การตรวจสอบกระบวนการผลิตโดยหน่วยงานรับรอง</li>
    <li>คำประกาศความสอดคล้อง: ผู้ผลิตลงนามใน DoC และติดเครื่องหมาย CE</li>
  </ol>


  <h2>หน่วยงานรับรองสำหรับเรือยางเป่าลม</h2>

  <p>หน่วยงานรับรองที่พบได้ทั่วไป ได้แก่ Bureau Veritas (ฝรั่งเศส), DNV GL (เยอรมนี), RINA (อิตาลี), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (เยอรมนี)</p>


  <h2>ระยะเวลาและค่าใช้จ่าย</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">ขั้นตอน</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">ระยะเวลา</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">ค่าใช้จ่ายโดยประมาณ (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">การจัดเตรียมเอกสารทางเทคนิค</td><td class="p-3 border">2 – 4 สัปดาห์</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">การทดสอบแบบจำลอง</td><td class="p-3 border">4 – 8 สัปดาห์</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">การตรวจสอบโรงงาน</td><td class="p-3 border">1 – 2 วัน (ณ สถานที่)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">รวม (ผลิตภัณฑ์แรก)</td><td class="p-3 border">8 – 14 สัปดาห์</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>


  <h2>ความหมายสำหรับผู้ซื้อ</h2>

  <p>เมื่อซื้อเรือยางเป่าลมที่ได้รับการรับรอง CE ควรตรวจสอบเสมอว่าเครื่องหมาย CE อยู่บนแผ่นป้ายข้อมูลผู้ผลิต มี DoC ที่ถูกต้อง ระบุหมายเลขของหน่วยงานรับรอง และคู่มือการใช้งานมีคำแนะนำด้านความปลอดภัยในภาษาท้องถิ่นของคุณ ผลิตภัณฑ์ Afarer ทั้งหมดได้รับการรับรอง CE
  พร้อมการตรวจสอบย้อนกลับอย่างครบถ้วนถึงรายงานการตรวจสอบของหน่วยงานรับรอง</p>

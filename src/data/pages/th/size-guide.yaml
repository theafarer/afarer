hero:
  title: คู่มือขนาดและข้อมูลจำเพาะ
  subtitle: ขนาด ความจุ และการใช้งานแนะนำสำหรับสินค้า afarer แต่ละชิ้น
categories:
  inflatable: ซัพเป่าลมที่ออกแบบเพื่อความสะดวกในการพกพาโดยไม่ลดทอนประสิทธิภาพ เลือกขนาดที่เหมาะกับน้ำหนักและสไตล์การพายของคุณ
  sup: บอร์ดยืนพายสำหรับการทัวร์ โยคะ ออกกำลังกาย และการพายเล่นทั่วไป เลือกตามความยาวและน้ำหนักของผู้ใช้
  accessory: อุปกรณ์เสริมและอุปกรณ์ความปลอดภัยเพื่อเติมเต็มบอร์ด SUP ของคุณ ขนาดใช้ได้ทั่วไปพร้อมหลายตัวเลือก
table:
  headers:
    product: สินค้า
    length: ความยาว
    width: ความกว้าง

how_to_choose:
  title: วิธีเลือกขนาดที่เหมาะสม
  cards:
    - title: บอร์ด SUP
      description: เลือกความยาวตามน้ำหนักของคุณและการใช้งานที่ตั้งใจ บอร์ดที่กว้างขึ้น (32"+) ให้ความมั่นคงมากขึ้น บอร์ดที่ยาวขึ้น (11-12 ฟุต) รักษาทิศทางได้ดีกว่าสำหรับการทัวร์ นักพายที่หนักกว่าต้องการบอร์ดที่มีปริมาตรสูงกว่า
    - title: ซัพทัวริ่ง
      description: บอร์ดที่ยาวกว่า (11–12 ฟุต) เหมาะที่สุดสำหรับการพายระยะไกลและการทัวร์ บอร์ดที่กว้างกว่า (32"+) ให้ความมั่นคงมากขึ้น ตรวจสอบความจุน้ำหนักรวมสัมภาระทั้งหมด
    - title: ซัพอเนกประสงค์
      description: เลือกความยาวตามน้ำหนักของผู้ใช้และการใช้งานที่ตั้งใจ บอร์ดอเนกประสงค์ใช้ได้ทั้งพักผ่อน ออกกำลังกาย และโยคะ บอร์ดขนาดเล็กควบคุมทิศทางได้คล่องตัวกว่า

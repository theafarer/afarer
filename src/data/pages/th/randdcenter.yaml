meta:
  title: ศูนย์ R&D | {SITE}
  description: การวิจัยและพัฒนา (R&D) — การทดสอบผ้า PVC วิศวกรรมตัวเรือ การเชื่อมด้วยคลื่นความถี่สูง (RF) การทดสอบอุทกพลศาสตร์ และการควบคุมคุณภาพ พร้อมบริการ R&D ตามความต้องการของลูกค้า
hero:
  tagline: ศูนย์วิจัยและพัฒนา
  title: ศูนย์วิจัยและพัฒนา (R & D Center)
  subtitle: มุ่งมั่นสู่ความก้าวหน้า
intro:
  - >-
    ศูนย์วิจัยและพัฒนา (R&D Center) ของ afarer คือพลังขับเคลื่อนเบื้องหลังพันธกิจของเราในการปฏิวัติวงการอุปกรณ์กีฬาทางน้ำ เราเสริมพลังให้นักกีฬาทางน้ำทั่วโลกได้ใช้ผลิตภัณฑ์ที่ปลอดภัย สบาย และสนุกยิ่งขึ้น ผ่านนวัตกรรมที่ไม่หยุดนิ่งในบอร์ดยืนพายแบบเป่าลม (SUP) และเรือเป่าลม ทีมวิศวกร นักออกแบบ
    และผู้เชี่ยวชาญด้านกีฬาทางน้ำผู้หลงใหลในงานของเรา กำลังสร้างอนาคตของอุตสาหกรรมนี้ พร้อมยกระดับมาตรฐานด้านคุณภาพ สมรรถนะ และความยั่งยืนอย่างต่อเนื่อง
  - ศูนย์วิจัยและพัฒนา (R&D) ของเรารวมนักวิทยาศาสตร์วัสดุ สถาปนิกต่อเรือ และวิศวกรฝ่ายผลิตไว้ในที่เดียว ตั้งแต่การคิดสูตรผ้าใบและการจำลองตัวเรือ ไปจนถึงการพัฒนากระบวนการเชื่อมและการทดสอบทางทะเลขนาดจริง ทุกขั้นตอนของการพัฒนาผลิตภัณฑ์ขับเคลื่อนด้วยข้อมูลและผ่านการตรวจสอบด้วยการทดสอบ
mission:
  tagline: พันธกิจของเรา
  title: สร้างนวัตกรรมเพื่ออนาคตของกีฬาทางน้ำ
  pillars:
    - icon: lightning
      title: ความก้าวหน้าทางเทคโนโลยี
      desc: บุกเบิกวัสดุ การออกแบบ และกระบวนการผลิตใหม่ ๆ เพื่อให้ผลิตภัณฑ์มีสมรรถนะและอายุการใช้งานที่เหนือกว่า
    - icon: design
      title: การออกแบบที่ยึดผู้ใช้เป็นศูนย์กลาง
      desc: เข้าใจความต้องการของผู้ใช้อย่างลึกซึ้งและตอบสนองได้เกินความคาดหมาย ผ่านการออกแบบผลิตภัณฑ์ที่คำนึงถึงหลักสรีรศาสตร์และใช้งานง่าย
    - icon: globe
      title: แนวทางปฏิบัติเพื่อความยั่งยืน
      desc: ลดผลกระทบต่อสิ่งแวดล้อมของเราด้วยการใช้วัสดุและกระบวนการที่เป็นมิตรกับสิ่งแวดล้อม
    - icon: shield
      title: ความปลอดภัยที่เหนือกว่าแบบไม่ประนีประนอม
      desc: รับรองมาตรฐานความปลอดภัยสูงสุดผ่านการทดสอบอย่างเข้มงวดและการรับรองที่ครบถ้วน
pillars:
  - title: ความก้าวหน้าทางเทคโนโลยี
    desc: บุกเบิกวัสดุ การออกแบบ และกระบวนการผลิตใหม่ ๆ เพื่อส่งมอบประสิทธิภาพและอายุการใช้งานของผลิตภัณฑ์ที่เหนือกว่า
    icon: tech
  - title: วัสดุขั้นสูง
    desc: วิจัยวัสดุ PVC ไฮพาลอน คอมโพสิต และวัสดุทางเลือกที่ยั่งยืนแบบล้ำหน้า เพื่อพัฒนาคุณสมบัติของผลิตภัณฑ์ให้ดียิ่งขึ้น
    icon: materials
  - title: ความยั่งยืน
    desc: 'พันธสัญญาหลัก: เรามุ่งมั่นดูแลสิ่งแวดล้อมผ่านการผลิตที่ยั่งยืนและการใช้วัสดุที่รีไซเคิลได้'
    icon: sustainability
capabilities:
  tagline: ความสามารถของเรา
  title: ขีดความสามารถด้านการวิจัยและพัฒนา
  subtitle: ความเชี่ยวชาญหลักสี่ด้านที่ทำให้เราควบคุมการพัฒนาผลิตภัณฑ์ได้ครบวงจร — ตั้งแต่การวิจัยวัตถุดิบไปจนถึงการรับรองขั้นสุดท้าย
  groups:
    - title: วัสดุศาสตร์และเทคโนโลยีผ้าใบ
      items:
        - การวิเคราะห์และปรับปรุงสูตรวัสดุ PVC และ Hypalon
        - การพัฒนาสารเติมแต่งสำหรับกันรังสี UV ทนไฟ และต้านจุลินทรีย์
        - วิศวกรรมการเคลือบผ้าหลายชั้นและการยึดติด
        - การทดสอบเร่งการเสื่อมสภาพ (UV ความร้อน ความชื้น ละอองน้ำเค็ม)
    - title: วิศวกรรมตัวเรือและอุทกพลศาสตร์
      items:
        - การออกแบบตัวเรือ 3D แบบ Parametric และการเพิ่มประสิทธิภาพด้วย CFD
        - การวิเคราะห์ไฟไนต์เอลิเมนต์สำหรับแรงทางโครงสร้างและแรงกระแทก
        - การทดสอบในอ่างทดลองลากจูงด้วยโมเดลย่อส่วนและการตรวจสอบสมรรถนะ
        - การพัฒนาตัวเรือแบบเฉพาะสำหรับภารกิจพิเศษ
    - title: เทคโนโลยีการเชื่อมและการต่อผืนผ้า
      items:
        - การพัฒนาและปรับปรุงกระบวนการเชื่อมไดอิเล็กทริกด้วยคลื่นความถี่วิทยุ (RF)
        - วิธีการเชื่อมด้วยลมร้อน ลิ่มร้อน และคลื่นเสียงความถี่สูง (Ultrasonic)
        - การทดสอบการยึดติดด้วยกาวและการรับรองคุณสมบัติเทปปิดรอยต่อ
        - การจำลองความแข็งแรงของรอยเชื่อมและการคาดการณ์อายุการใช้งาน
    - title: การทดสอบ การรับรอง และการปฏิบัติตามข้อกำหนด
      items:
        - การจัดการคุณภาพและการทดสอบตามข้อกำหนด CE
        - การสนับสนุนการทดสอบและรับรองโดยหน่วยงานอิสระภายนอก
        - การพัฒนาโปรโตคอลการทดสอบเฉพาะสำหรับการประเมินคุณสมบัติวัสดุในการจัดซื้อ
        - การวิเคราะห์ความเสียหายระหว่างการใช้งานและการสืบสวนหาสาเหตุต้นตอ

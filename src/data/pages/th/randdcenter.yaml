rd_services:
  tagline: การวิจัยและพัฒนาเฉพาะตามความต้องการ
  title: บริการ R&D สำหรับพันธมิตร
  services:
    - title: การพัฒนาวัสดุตามความต้องการเฉพาะ
      desc: เราพัฒนาสูตรผ้า โครงสร้างชั้นลามิเนต และระบบกาวเฉพาะ ตามสภาพแวดล้อมการใช้งานและเป้าหมายด้านประสิทธิภาพของคุณ
    - title: วิศวกรรมผลิตภัณฑ์ OEM / ODM
      desc: เราพัฒนาสูตรผ้า โครงสร้างชั้นลามิเนต และระบบกาวเฉพาะ ตามสภาพแวดล้อมการใช้งานและเป้าหมายด้านประสิทธิภาพของคุณ
    - title: การทดสอบและการรับรองโดยหน่วยงานภายนอก
      desc: ใช้สิ่งอำนวยความสะดวกในการทดสอบที่ได้มาตรฐาน ISO ของเรา สำหรับการทดสอบวัสดุอย่างเป็นอิสระ การตรวจสอบความถูกต้องของผลิตภัณฑ์ และการสนับสนุนด้านการรับรอง
  cta: ปรึกษาความต้องการด้าน R&D ของคุณ →
  cta_link: /contact
vision:
  tagline: วิสัยทัศน์ของเรา
  title: ร่วมกำหนดอนาคตของกีฬาทางน้ำ
  body: >-
    afarer มุ่งมั่นที่จะเป็นผู้นำอุตสาหกรรมเรือเป่าลมและ SUP ด้วยนวัตกรรมอย่างต่อเนื่อง คุณภาพที่ไม่เคยลดทอน และความมุ่งมั่นอย่างแน่วแน่ต่อความปลอดภัยและความยั่งยืน ซึ่งท้ายที่สุดจะยกระดับประสบการณ์ของนักกีฬาทางน้ำทั่วโลก ศูนย์วิจัยและพัฒนา (R&D Center) ของ afarer
    คือสถานที่ที่ความหลงใหลมาบรรจบกับนวัตกรรม เพื่อสร้างมาตรฐานใหม่ให้กับอุตสาหกรรมกีฬาทางน้ำ
labs_section:
  tagline: ห้องปฏิบัติการ
  title: ห้องปฏิบัติการของเรา
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: ห้องปฏิบัติการผ้า PVC
      description: การวิจัยและทดสอบผ้าท่อลม PVC และ Hypalon อย่างต่อเนื่อง ทั้งในด้านความแข็งแรงต่อแรงดึง ความทนทานต่อรังสี UV การเสียดสี และความยืดหยุ่นที่อุณหภูมิต่ำ เพื่อรับประกันความน่าเชื่อถือในระยะยาวในสภาพแวดล้อมทางทะเล
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: สตูดิโอวิศวกรรมตัวเรือ
      description: การออกแบบด้วย CAD และการวิเคราะห์ไฟไนต์เอลิเมนต์ของตัวเรือ HDPE อะลูมิเนียม และไฟเบอร์กลาส ตัวเรือทุกลำถูกจำลองแบบดิจิทัลเพื่อวิเคราะห์การกระจายความเค้นและความทนทานต่อแรงกระแทกก่อนสร้างต้นแบบชิ้นแรก
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: ศูนย์เชื่อม RF
      description: โรงงานเชื่อมคลื่นความถี่วิทยุ (RF) เฉพาะทางพร้อมการควบคุมอุณหภูมิและแรงดันอย่างแม่นยำ ผลิตตะเข็บที่แข็งแรงและกันอากาศได้ตามมาตรฐานอุตสาหกรรมทางทะเลสำหรับเรือเป่าลม
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: ถังทดสอบอุทกพลศาสตร์
      description: การทดสอบโมเดลย่อส่วนในถังทดสอบของเรา เพื่อปรับปรุงรูปทรงตัวเรือ สมรรถนะการไถลน้ำ ความมั่นคง และประสิทธิภาพการใช้เชื้อเพลิงภายใต้สภาพน้ำหนักบรรทุกและสภาพทะเลที่หลากหลาย
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: โรงงานผลิตต้นแบบ
      description: สถานที่ผลิตต้นแบบขนาดจริงและประกอบอุปกรณ์ครบชุด สำหรับการสร้าง ติดตั้ง และทดสอบทางทะเลของรุ่นใหม่ ๆ ต้นแบบทุกลำต้องผ่านโปรแกรมทดสอบในน้ำอย่างน้อย 20 ชั่วโมงก่อนได้รับอนุมัติให้ผลิต
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: ห้องปฏิบัติการคุณภาพและการตรวจสอบ
      description: ห้องปฏิบัติการประกันคุณภาพโดยเฉพาะที่ทำการทดสอบความต้านแรงดึง การทดสอบการคงลมแบบวนรอบ การทดสอบการลอกตะเช็ม และการรับรองวัสดุ เพื่อให้แน่ใจว่าเรือทุกลำที่ออกจากโรงงานเป็นไปตามข้อกำหนดที่เราประกาศไว้
      href: /randdcenter/quality-inspection-lab

features3_what_we_build:
  title: สิ่งที่เราผลิต
  subtitle: เราเริ่มต้นจากเวิร์กช็อปชายฝั่งที่มีเรือเพียงลำเดียวและความเชื่ออันแน่วแน่ที่ว่า สินค้าทางทะเลควรได้รับการออกแบบอย่างใส่ใจจริงจัง เพราะมันสำคัญจริง ๆ ทุกวันนี้เราจัดส่งไปยังกว่า 40 ประเทศ แต่ตัวเรือทุกลำยังคงผ่านมือของคนกลุ่มเดียวกับที่เริ่มก่อตั้งบริษัท
  columns: 3
  isBeforeContent: true
  items:
    - title: กระดาน SUP
      description: บอร์ดพาย SUP แบบเป่าลมขนาด 9 ฟุต ถึง 12 ฟุต ออกแบบสำหรับทัวร์ริ่ง โยคะ ตกปลา และการใช้ในครอบครัว
      icon: tabler:ship
    - title: ซัพเป่าลม
      description: บอร์ด SUP แบบเป่าลมจาก PVC ขนาด 9 ฟุต ถึง 12 ฟุต น้ำหนักเบา แข็งแรงทนทาน และจัดเก็บง่าย
      icon: tabler:speedboat
    - title: แพ็คเกจ SUP ระดับพรีเมียม
      description: ซัพขนาดกะทัดรัด สเปกสูง สร้างขึ้นเฉพาะตามความต้องการของแบรนด์หรือฝูงเรือของคุณ
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: อุปกรณ์เสริม
      description: ไม้พาย ปั๊มลม ฝาครอบ กระเป๋ากันน้ำ และอุปกรณ์อิเล็กทรอนิกส์ ทั้งหมดออกแบบให้เข้ากันกับบอร์ดของเรา
      icon: tabler:package
    - title: การปรับปรุงและซ่อมแซม
      description: บริการซ่อมบอร์ด การเปลี่ยนแผ่นรองเท้า (deck pad) และการอัปเกรดอุปกรณ์เสริมภายในโรงงานของเรา
      icon: tabler:tool
    - title: การผลิตตามสั่งพิเศษ
      description: ออกแบบเฉพาะรายโครงการสำหรับลูกค้าภาคธุรกิจ วิทยาศาสตร์ และการทหาร
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: หารือด้านการออกแบบและวิศวกรรมเรือ
steps2_values:
  title: ค่านิยมของเรา
  subtitle: หลักการสามประการที่หล่อหลอมทุกผลิตภัณฑ์ตั้งแต่วันแรก
  items:
    - title: สร้างมาอย่างแข็งแรงราว๊าต้องแบกรับครอบครัวของคุณ
      description: ตัวเรือ รอยเชื่อม และชิ้นส่วนยึดทุกชิ้นได้รับการดูแลราวกับว่าครอบครัวของเราเองจะได้ใช้งาน
      icon: tabler:heart
    - title: ออกแบบโดยวิศวกรก่อนวางจำหน่าย
      description: บอร์ดพาย SUP แบบเป่าลมขนาด 9 ฟุต ถึง 12 ฟุต ออกแบบสำหรับทัวร์ริ่ง โยคะ ตกปลา และการใช้ในครอบครัว
      icon: tabler:settings
    - title: บริการดูแลที่ยาวนานเกินอายุการรับประกัน
      description: เรือที่มีอายุใช้งานยี่สิบปียังคงติดต่อเรามาเพื่อขออะไหล่ และเรายังคงรับสายเสมอ
      icon: tabler:headset
steps2_milestones:
  title: เหตุการณ์สำคัญ
  subtitle: เรื่องราวของ afarer ฉบับย่อ
  isReversed: true
  items:
    - title: ก่อตั้งจากเวิร์กช็อปริมชายฝั่ง
      description: เริ่มต้นโดยสถาปนิกกองทัพเรือสองคน พร้อมเครื่องกัด CNC และไอเดียที่มุ่งมั่นไม่ยอมแพ้
      icon: tabler:building-factory
    - title: ตัวเรือ 1,000 ลำแรกที่ส่งมอบ
      description: เราก้าวเข้าสู่ปีที่ 7 ของการดำเนินงาน โดยอาศัยการบอกต่อและลูกค้าประจำเป็นหลัก
      icon: tabler:circle-check
    - title: โครงการส่งออกระหว่างประเทศ
      description: จัดส่งไปยังกว่า 40 ประเทศ พร้อมพันธมิตรสนับสนุนในพื้นที่ครอบคลุมห้าทวีป
      icon: tabler:world
features2_locations:
  title: ที่ตั้งของเรา
  tagline: ค้นหาเรา
  columns: 3
  items:
    - title: สำนักงานใหญ่และโรงงาน
      description: บอร์ดพาย SUP แบบเป่าลมขนาด 9 ฟุต ถึง 12 ฟุต ออกแบบสำหรับทัวร์ริ่ง โยคะ ตกปลา และการใช้ในครอบครัว
    - title: ศูนย์บริการในสหภาพยุโรป (EU)
      description: บอร์ดพาย SUP แบบเป่าลมขนาด 9 ฟุต ถึง 12 ฟุต ออกแบบสำหรับทัวร์ริ่ง โยคะ ตกปลา และการใช้ในครอบครัว
    - title: เครือข่ายพันธมิตรในภูมิภาคเอเชียแปซิฟิก (APAC)
      description: พันธมิตรศูนย์บริการที่ได้รับอนุญาตในออสเตรเลีย ญี่ปุ่น สิงคโปร์ และฮ่องกง
brand_hub_tagline: แบรนด์
brand_hub_title: ทำความรู้จักแบรนด์ของเรา
brand_hub_subtitle: สำรวจความเชี่ยวชาญด้านวิศวกรรม SUP การมีตัวตนระดับโลก และหลักการที่ขับเคลื่อนเราให้ลึกยิ่งขึ้น
brand_hub_cards:
  - title: ความเชี่ยวชาญด้านเรือเดินทะเล
    desc: หลายสิบปีของวิทยาศาสตร์วัสดุ การผลิตที่แม่นยำ และการทดสอบใช้งานจริง — ตั้งแต่การขึ้นรูป PVC/Hypalon ไปจนถึงการออกแบบตัวเรือ deep-V และเทคโนโลยี drop-stitch
    link: /brand-marine-expertise
    link_label: เรียนรู้เพิ่มเติม →
  - title: การดำเนินงานทั่วโลก
    desc: จัดส่งไปยังกว่า 50 ประเทศจากโรงงานของเราที่ชิงเต่า (Qingdao) พร้อมพันธมิตรด้านบริการที่ได้รับอนุญาตในยุโรป เอเชีย-แปซิฟิก และอเมริกา
    link: /brand-global-presence
    link_label: เรียนรู้เพิ่มเติม →
  - title: ทำไมต้องเลือก afarer
    desc: แบรนด์ที่สร้างบนคุณภาพที่ได้รับการยืนยัน — การรับรองคู่ (ISO 9001 + BSCI), การปฏิบัติตาม CE และความร่วมมือเฉพาะรายประเทศพร้อมคอลเลกชันโคแบรนด์แบบจำนวนจำกัดสำหรับธุรกิจกีฬาทางน้ำ
    link: /brand-why-afarer
    link_label: เรียนรู้เพิ่มเติม →

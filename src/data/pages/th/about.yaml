meta:
  title: 'เกี่ยวกับ Afarer — แบรนด์บอร์ด SUP แบบเป่าลมและกีฬาทางน้ำ | {SITE}'
  description: 'Afarer คือแบรนด์บอร์ด SUP แบบเป่าลมและกีฬาทางน้ำระดับโลก ดำเนินงานโดย Aquafarer LLC (สหรัฐอเมริกา) และสร้างสรรค์โดยทีมปฏิบัติการชิงเต่าของเรา ค้นพบเรื่องราวของเรา วิศวกรรม คุณภาพที่ได้รับการรับรอง และโปรแกรมพันธมิตรรายประเทศ'
  keywords:
    - 'แบรนด์บอร์ด SUP แบบเป่าลม'
    - 'แบรนด์เรือเป่าลม'
    - 'แบรนด์กีฬาทางน้ำ'
    - 'ตัวแทนจำหน่าย SUP รายประเทศ'
    - 'คอลเลกชัน SUP โคแบรนด์'

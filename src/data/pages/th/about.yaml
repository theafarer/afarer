features3_what_we_build:
  title: What we build
  subtitle: "We started in a coastal workshop with one boat and a stubborn belief: marine products should be engineered like they matter, because they do. Today we ship to over 40 countries, but every hull still passes through the same hands that started the company."
  columns: 3
  isBeforeContent: true
  items:
    - title: SUP boards
      description: Inflatable SUP boards from 9 ft to 12 ft. Designed for touring, yoga, fishing and family use.
      icon: tabler:ship
    - title: Inflatable SUPs
      description: PVC inflatable SUP boards from 9 ft to 12 ft. Light, tough and easy to stow.
      icon: tabler:speedboat
    - title: Premium SUP packages
      description: Compact, high-spec SUPs custom-built to match your brand or fleet requirements.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:

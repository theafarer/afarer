hero:
  tagline: afarer Academy
  title: ศูนย์การเรียนรู้
  subtitle: คู่มือและบทเรียนสำหรับทุกทักษะการเล่น ตั้งแต่พื้นฐานการเล่น SUP ไปจนถึงเทคนิคการกู้ภัยขั้นสูง
categories:
  - level: มือใหม่
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: พื้นฐาน SUP
        desc: เรียนรู้พื้นฐานของการยืนพาย (Stand-Up Paddleboarding) —ท่าทาง เทคนิคการพาย และการทรงตัว
        slug: sup-basics
      - title: เทคนิคการพาย
        desc: จังหวะพายเดินหน้า จังหวะกวาดน้ำ จังหวะดึง และจังหวะยันตัว —ฝึกฝนเทคนิคการพายขั้นพื้นฐานที่จำเป็นให้เชี่ยวชาญ
        slug: paddle-techniques
      - title: ความปลอดภัยต้องมาก่อน
        desc: แนวปฏิบัติด้านความปลอดภัยที่จำเป็น รวมถึงการตรวจสภาพอากาศ การสวมอุปกรณ์ลอยตัว PFD กฎการใช้สายล็อกข้อเท้า และการช่วยเหลือตนเอง
        slug: safety-first
  - level: ระดับกลาง
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: อุปกรณ์จำเป็นสำหรับทัวร์ริ่ง
        desc: การวางแผนการพายระยะเวลาหลายชั่วโมง —การนำทาง การดื่มน้ำ การจัดจังหวะการพาย และการอ่านพยากรณ์ลม
        slug: touring-essentials
      - title: การอ่านสภาพอากาศ
        desc: อ่านพยากรณ์อากาศทางทะเล จำแนกรูปแบบเมฆ และเข้าใจผลกระทบของลมต่อผิวน้ำ
        slug: weather-reading
      - title: พื้นฐานการนำเรือ
        desc: การอ่านแผนที่เดินเรือ การใช้เข็มทิศ การตั้งจุดผ่าน GPS และการวางแผนเส้นทางสำหรับการพายเลียบชายฝั่ง
        slug: navigation-basics
      - title: การตระหนักรู้เรื่องกระแสน้ำขึ้น-น้ำลง
        desc: การทำความเข้าใจวงจรน้ำขึ้นน้ำลง กระแสน้ำ และผลกระทบต่อช่วงเวลาและเส้นทางการลงเรือ
        slug: tidal-awareness
  - level: ขั้นสูง
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: การวางแผนทริปหลายวัน
        desc: โลจิสติกส์การสำรวจ —การเลือกอุปกรณ์ การวางแผนอาหาร ระเบียบปฏิบัติด้านความปลอดภัย และรายชื่อติดต่อฉุกเฉิน
        slug: multi-day-trip-planning
      - title: เทคนิคการช่วยเหลือ
        desc: แนวปฏิบัติสำหรับการช่วยเหลือตัวเอง การช่วยเหลือแบบ T-rescue และการลากจูงในทะเลเปิด
        slug: rescue-techniques
      - title: การพายในเวลากลางคืน
        desc: การนำทางในยามคำคืน —ข้อกำหนดด้านแสงสว่าง การจดจำเส้นทาง การสื่อสารภายในกลุ่ม และความตระหนักรู้ถึงอันตราย
        slug: night-paddling
  - level: การบำรุงรักษา
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: การทำความสะอาดและการดูแลรักษา
        desc: การล้างด้วยน้ำจืด การป้องกันรังสี UV การป้องกันเชื้อรา และเทคนิคการทำให้แห้งที่เหมาะสมหลังการใช้งานทุกครั้ง
        slug: cleaning-and-care
      - title: คู่มือการจัดเก็บ
        desc: แนวทางที่ดีที่สุดในการจัดเก็บบอร์ด SUP แบบเป่าลม —การไล่อากาศ การพับเก็บ การควบคุมอุณหภูมิ และอายุการใช้งานของวัสดุ
        slug: storage-guide
      - title: พื้นฐานการซ่อมแซม
        desc: ซ่อมแซมรอยรั่วเล็ก ๆ รอยรั่วตามรอยต่อ และปัญหาวาล์ว ด้วยชุดซ่อม PVC และเทคนิคการปะแผ่น
        slug: repair-basics
      - title: การดูแลรักษาวาล์ว
        desc: ระบุชนิดวาล์ว (Halkey-Roberts, Boston, Leafield) ทำความสะอาดเศษสิ่งสกปรก และเปลี่ยนก้านวาล์วที่ชำรุด
        slug: valve-maintenance
knowledge_center_tagline: ศูนย์ความรู้
knowledge_center_title: คู่มืออุปกรณ์ทางทะเลและอุตสาหกรรม
knowledge_center_subtitle: ความรู้จากผู้เชี่ยวชาญและคู่มือการเลือกซื้อสำหรับมืออาชีพทางทะเล ผู้ดำเนินการฝูงเรือ และผู้ที่ชื่นชอบกีฬาทางน้ำ
knowledge_sections:
  - title: ความรู้เกี่ยวกับบอร์ด SUP
    tagline: คู่มือบอร์ดยืนพาย (SUP)
    desc: ทุกเรื่องราวเกี่ยวกับบอร์ด SUP ตั้งแต่การออกแบบบอร์ด วัสดุ การเลือกขนาด การดูแลรักษา ไปจนถึงคำแนะนำในการเลือกซื้อสำหรับการใช้งานส่วนบุคคลและเชิงพาณิชย์
    guides:
      - title: วิธีเลือกบอร์ด SUP ที่เหมาะสม
        desc: คู่มือครบวงจรในการเลือกซื้อ SUP —ขนาด ปริมาตร วัสดุ รูปทรง และวัตถุประสงค์การใช้งาน
        href: /learn/sup
      - title: SUP แบบเป่าลมกับแบบแข็ง
        desc: เปรียบเทียบกระดาน SUP แบบเป่าลมกับกระดานอีพ็อกซีแบบแข็ง — ในแง่ความสะดวกพกพา ความทนทาน สมรรถนะ และความคุ้มค่า
        href: /compare/inflatable-vs-hardboard
      - title: SUP อเนกประสงค์ เทียบกับ SUP ทัวร์ริ่ง เทียบกับ SUP โยคะ
        desc: บอร์ดซัพประเภทต่าง ๆ —มาตรฐานการผลิต รูปทรง ขนาด และการใช้งานที่แนะนำ
        href: /learn/sup
      - title: โครงสร้าง Drop-Stitch กับโครงสร้างแบบดั้งเดิม
        desc: เปรียบเทียบโครงสร้างแบบ drop-stitch และแบบดั้งเดิมของบอร์ด SUP ในด้านน้ำหนัก ต้นทุน ความทนทาน และความแข็งแกร่ง
        href: /learn/drop-stitch-core
  - title: คู่มือซัพเป่าลม (Inflatable SUP)
    tagline: ความรู้เกี่ยวกับ SUP แบบเป่าลม
    desc: คู่มือฉบับสมบูรณ์เกี่ยวกับ SUP แบบเป่าลม — วัสดุ PVC โครงสร้างแบบ drop-stitch มาตรฐานความปลอดภัย และแนวปฏิบัติที่ดีที่สุดในการดูแลรักษา
    guides:
      - title: คู่มือวัสดุ PVC
        desc: คู่มือฉบับสมบูรณ์เกี่ยวกับวัสดุ PVC ที่ใช้ในการผลิตบอร์ด SUP แบบเป่าลม
        href: /learn/materials
      - title: วิธีการผลิตบอร์ด SUP แบบเป่าลม
        desc: กระบวนการผลิต —การตัดวัสดุ การยึดแกนดรอปสติทช์ การประกอบตะเข็บ การทดสอบแรงดัน และการควบคุมคุณภาพ
        href: /learn/inflatable-technology
      - title: คู่มือความปลอดภัยของบอร์ด SUP
        desc: มาตรฐานความปลอดภัย ความสามารถในการรับน้ำหนัก การเป่าลมอย่างถูกต้อง การตรวจสอบก่อนออกเดินทาง และขั้นตอนการรับมือเหตุฉุกเฉิน
        href: /learn/water-safety
      - title: การดูแลรักษา SUP
        desc: การทำความสะอาด การจัดเก็บ การป้องกันรังสี UV และการซ่อมแซมบอร์ด SUP แบบเป่าลม
        href: /inflatable-sup-maintenance
  - title: ความรู้เกี่ยวกับบอร์ด SUP
    tagline: ศูนย์รวมข้อมูลบอร์ด SUP
    desc: คู่มือทางเทคนิคครอบคลุมประเภทของกระดาน SUP วัสดุ วิธีการผลิต การบำรุงรักษา และความปลอดภัย
    guides:
      - title: ประเภทของบอร์ด SUP
        desc: ซัพอเนกประสงค์ ซัพทัวริ่ง ซัพโยคะ ซัพกีฬา และซัพสำหรับเด็ก —เรียนรู้ความแตกต่างและเลือกให้เหมาะกับคุณ
        href: /learn/sup
      - title: เทคโนโลยี Drop-Stitch
        desc: เส้นใยภายในหลายพันเส้นสร้างโครงสร้างเป่าลมแรงดันสูงที่แข็งแกร่งได้อย่างไร
        href: /learn/drop-stitch-core
      - title: ข้อมูลอ้างอิงวัสดุ
        desc: อธิบายค่า denier ของ PVC น้ำหนักผ้า ความทนทานต่อ UV และวัสดุเกรดสำหรับงานทางทะเล
        href: /learn/materials
      - title: คู่มือเลือกซื้อ SUP
        desc: เปรียบเทียบบอร์ด SUP ประเภทต่าง ๆ ตามการใช้งานและระดับทักษะที่แตกต่างกัน
        href: /learn/sup
  - title: ความรู้เรื่อง SUP
    tagline: คู่มือบอร์ดยืนพาย (SUP)
    desc: ทุกเรื่องราวเกี่ยวกับบอร์ด SUP — แบบเป่าลมกับแบบแข็ง ขนาดบอร์ด เทคโนโลยีวัสดุ และคำแนะนำจากผู้เชี่ยวชาญสำหรับทุกระดับทักษะ
    guides:
      - title: SUP แบบเป่าลมกับแบบแข็ง
        desc: เปรียบเทียบบอร์ด iSUP กับบอร์ดอีพ็อกซีแบบแข็งในด้านความสะดวกในการพกพา ความทนทาน สมรรถนะ และความคุ้มค่า
        href: /learn/sup
      - title: คู่มือขนาดบอร์ด SUP
        desc: ความยาว ความกว้าง และความหนาส่งผลต่อความมั่นคง ความเร็ว และความคล่องตัวอย่างไร
        href: /learn/sup
      - title: การดูแลและบำรุงรักษา SUP
        desc: เคล็ดลับการทำความสะอาด การจัดเก็บ การป้องกันรังสี UV และการซ่อมแซมบอร์ด SUP แบบเป่าลม
        href: /inflatable-sup-maintenance
      - title: การเลือก SUP ลำแรกของคุณ
        desc: คู่มือสำหรับมือใหม่ในการเลือกกระดานพายยืน (SUP) ที่เหมาะสมกับน้ำหนัก ระดับทักษะ และการใช้งานของคุณ
        href: /learn/sup
  - title: คู่มือการดำเนินธุรกิจให้เช่า
    tagline: การจัดการกองเรือสำหรับธุรกิจให้เช่า
    desc: คู่มือการจัดตั้งและบริหารจัดการฝูงบอร์ด SUP ให้เช่า สำหรับร้านค้าริมชายหาด ศูนย์กีฬาทางน้ำ และธุรกิจโรงแรมและการท่องเที่ยว
    guides:
      - title: การสร้างกองเรือเช่าของคุณ
        desc: วิธีเลือกบอร์ดซัพที่เหมาะสมกับการให้เช่าของคุณ — พิจารณาความทนทาน ขนาด และผลตอบแทนจากการลงทุน (ROI)
        href: /solutions/rental-operators
      - title: คู่มือการบำรุงรักษาฝูงเรือ
        desc: แนวปฏิบัติในการดูแลรักษาที่จำเป็นเพื่อยืดอายุการใช้งานของบอร์ดให้สูงสุด และลดเวลาหยุดให้บริการของฝูงเรือให้เช่า
        href: /solutions/rental-operators
  - title: คู่มือรีสอร์ทและธุรกิจบริการ
    tagline: กิจกรรมทางน้ำสำหรับธุรกิจโรงแรมและการบริการ
    desc: คู่มือการเปิดตัวและบริหารจัดการโปรแกรม SUP สำหรับรีสอร์ท โรงแรม และสถานที่ท่องเที่ยวริมน้ำ
    guides:
      - title: เริ่มต้นโปรแกรม SUP สำหรับรีสอร์ท
        desc: ปัจจัยที่ควรพิจารณาเมื่อเริ่มจัดกิจกรรม SUP สำหรับแขก —ขนาดฟลีต กำลังคน และการวางแบบจำลองรายได้
        href: /solutions/resorts-hotels
      - title: SUP เทียบกับกิจกรรมทางน้ำอื่น ๆ
        desc: เปรียบเทียบโปรแกรม SUP กับกีฬาทางน้ำอื่น ๆ ในด้านประสบการณ์ของแขกและประสิทธิภาพการดำเนินงาน
        href: /learn/sup
  - title: คู่มือสำหรับผู้ค้าปลีกและการจัดจำหน่าย
    tagline: ความร่วมมือทางธุรกิจด้าน SUP
    desc: คู่มือการเป็นพาร์ทเนอร์ค้าปลีกหรือตัวแทนจำหน่าย SUP — การวางแผนสต็อกสินค้า การวางตำแหน่งตลาด และกลยุทธ์การเติบโต
    guides:
      - title: การเป็นผู้ค้าปลีก SUP
        desc: วิธีเลือกกลุ่มผลิตภัณฑ์ จัดการสต็อกสินค้า และทำการตลาดบอร์ดซัพในร้านค้าปลีกของคุณ
        href: /solutions/retail-partners
      - title: SUP สำหรับธุรกิจเชิงพาณิชย์
        desc: เหตุใด SUP เป่าลมจึงเป็นผลิตภัณฑ์อเนกประสงค์สำหรับกองเรือเชิงพาณิชย์ ธุรกิจให้เช่า และผู้ประกอบการมืออาชีพ
        href: /use-cases/search-and-rescue

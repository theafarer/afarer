meta:
  title: 'เทคโนโลยี — ดรอปสติทช์และพีวีซีสำหรับทะเล | {SITE}'
  description: 'เทคโนโลยีของ afarer: โครงสร้างดรอปสติทช์ พีวีซีสำหรับทะเล โครงสร้างสองชั้น และแรงดันสูง นวัตกรรมจากผู้ผลิตซัพเป่าลมมืออาชีพ'
  keywords:
    - 'เทคโนโลยี SUP'
    - 'โครงสร้างดรอปสติทช์'
    - 'SUP แรงดันสูง'
    - 'วัสดุซัพเป่าลม'
hero:
  tagline: เทคโนโลยี
  title: สร้างเพื่อประสิทธิภาพ
  subtitle: ซัพเป่าลม afarer ทุกแผ่นสร้างด้วยโครงสร้างดรอปสติทช์และ PVC ระดับทางทะเล — วัสดุแม่นยำและวิธีการผลิตที่ทดสอบสำหรับสภาพแวดล้อมทางทะเลที่ท้าทาย
sections:
  - title: แกนดรอปสติทช์
    description: เส้นด้ายโพลีเอสเตอร์ภายในนับพันเชื่อมชั้นบนและล่าง สร้างโครงสร้างแข็งแรงที่ 12-15 PSI เทคโนโลยีเดียวกับที่ใช้ในบอร์ดพายมืออาชีพและซัพแข่งขันแบบเป่าลม
    imageAlt: แผนภาพแกน DS
  - title: PVC ระดับทางทะเล
    description: ผ้า PVC ลามิเนตหลายชั้นสำหรับสภาพแวดล้อมทางทะเล แต่ละชั้นเชื่อมหลอมละลายแทนการใช้กาว ขจัดความเสี่ยงการหลุดลอก ผ่านการทดสอบความต้านทานรังสี UV การกัดกร่อนจากน้ำทะเล และการสึกหรอ
    imageAlt: ชั้น PVC
  - title: PVC ระดับทหาร
    description: ใช้ในรุ่น SUP ทุกรุ่น PVC พรีเมียมให้ความต้านทานรังสี UV และสารเคมีที่เหนือกว่า คงความยืดหยุ่นในอุณหภูมิสุดขั้วและต้านทานการเสื่อมสภาพ
    imageAlt: PVC
  - title: พื้น Air Deck
    description: โครงสร้างดรอปสติทช์เป่าลมแรงดันสูงที่ให้ความแข็งแรงเหนือระดับสำหรับการยืน ตกปลา และโยคะ ลดเวลาติดตั้ง น้ำหนักรวม และปริมาตรการจัดเก็บ
    imageAlt: ดาดฟ้าเป่าลม (Air Deck)

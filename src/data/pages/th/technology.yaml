hero:
  tagline: เทคโนโลยี
  title: สร้างเพื่อประสิทธิภาพ
  subtitle: บอร์ด afarer ทุกแผ่นสร้างด้วยวัสดุแม่นยำและวิธีการผลิตที่ทดสอบสำหรับสภาพแวดล้อมทางทะเล
sections:
  - title: แกนดรอปสติทช์
    description: เส้นด้ายโพลีเอสเตอร์ภายในนับพันเชื่อมชั้นบนและล่าง สร้างโครงสร้างแข็งแรงที่ 12-15 PSI
    imageAlt: แผนภาพแกน DS
  - title: PVC ระดับทหาร
    description: ผ้า PVC เคลือบหลายชั้นสำหรับสภาพแวดล้อมทางทะเล แต่ละชั้นเชื่อมหลอมละลาย
    imageAlt: ชั้น PVC
  - title: ท่อ Hypalon
    description: ยาง Hypalon (CSM) ให้ความต้านทานรังสี UV และสารเคมีที่ดีกว่าเมื่อเทียบกับ PVC มาตรฐาน
    imageAlt: Hypalon
  - title: พื้น Air Deck
    description: ระบบพื้นเป่าลมแรงดันสูงที่แทนที่พื้นไม้อัดหรืออะลูมิเนียมแบบดั้งเดิม
    imageAlt: ดาดฟ้าเป่าลม (Air Deck)

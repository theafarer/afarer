qc_section:
  tagline: การควบคุมคุณภาพ
  title: กระบวนการทดสอบและการประกันคุณภาพ
  subtitle: เรือทุกลำต้องผ่านการทดสอบภาคบังคับก่อนจัดส่ง ห้องปฏิบัติการคุณภาพของเราทำงานแยกอิสระจากสายการผลิตและรายงานตรงต่อฝ่ายบริหาร
  steps:
    - step: '1'
      title: การตรวจสอบวัตถุดิบ
      desc: ผ้า PVC, Hypalon และ drop-stitch ทุกชิ้นต้องผ่านการทดสอบแรงดึง () การลามของการฉีกขาด และการตรวจสอบความทนทานต่อรังสี UV ก่อนเข้าสู่กระบวนการผลิต
    - step: '2'
      title: การทดสอบกักเก็บอากาศ 48 ชั่วโมง
      desc: ห้องเป่าลมทุกห้องจะถูกเติมลมที่ 125% ของแรงดันที่กำหนดและคงไว้เป็นเวลา 48 ชั่วโมง หากแรงดันลดลงมากกว่า 5% จะถูกปฏิเสธโดยอัตโนมัติและนำไปตรวจสอบรอยต่อตะเข็บใหม่
    - step: '3'
      title: การทดสอบน้ำหนักบรรทุกและการทรงตัว
      desc: เรือที่ประกอบเสร็จแล้วจะถูกโหลดของหนักตามพิกัดสูงสุดและทดสอบความมั่นคง ความสูงของขอบกราบ (ฟรีบอร์ด) และการควบคุม เรือทุกลำผ่านการทดสอบในน้ำก่อนการตรวจสอบขั้นสุดท้าย
oem_section:
  tagline: โครงการ OEM
  title: กรณีศึกษาความร่วมมือด้านแบรนด์และ OEM
  subtitle: จากแนวคิดสู่ตู้คอนเทนเนอร์ — วิธีที่เราช่วยแบรนด์ระดับโลกเปิดตัวและขยายกลุ่มผลิตภัณฑ์ SUP แบบเป่าลม
  cases:
    - challenge: ผู้ค้าปลีกสินค้ากลางแจ้งในยุโรปต้องการไลน์ซัพแบรนด์เฉพาะ (private label) พร้อมลวดลายบนเด็คที่ไม่ซ้ำใคร วัสดุ PVC ที่เป็นมิตรต่อสิ่งแวดล้อม และบรรจุภัณฑ์พร้อมวางจำหน่าย —ทั้งหมดส่งมอบภายใน 60 วัน
      solution: พัฒนารูปแบบไฟล์พิมพ์ดิจิทัลที่กำหนดเอง จัดหา PVC ที่ผ่านมาตรฐาน REACH และลดรอบการยืนยันตัวอย่างจาก 3 รอบเหลือ 1 รอบ โดยให้ทีมออกแบบมาประจำการร่วมที่โรงงานชิงเต่าของเรา
      result: 55 วันนับจากลงนาม PO ถึง FOB จำนวน 2,400 ลำใน 4 SKU คำสั่งซื้อซ้ำถูกวางก่อนที่คอนเทนเนอร์ชุดแรกจะมาถึงด้วยซ้ำ
    - challenge: สตาร์ตอัปกีฬาทางน้ำของสหรัฐฯ ต้องการซัพ drop-stitch สมรรถนะสูงที่มีรูปทรงเฉพาะ แพ็กเกจแบบร่วมแบรนด์ และใบรับรอง BSCI เพื่อวางจำหน่ายในช่องทางรีเทล
      solution: ปรับแม่พิมพ์ SUP ที่มีอยู่เดิมให้มีโครงร่างใหม่ พัฒนางานออกแบบบรรจุภัณฑ์ร่วมแบรนด์ (Co-branded) และจัดเตรียมเอกสารการตรวจสอบ BSI ครบชุด
      result: ประสบความสำเร็จในการวางจำหน่ายในเครือร้านค้าปลีกอุปกรณ์กลางแจ้งรายใหญ่ของสหรัฐฯ 3 ราย ยอดจำหน่ายมากกว่า 5,000 ลำในปีแรก ด้วยอัตรา sell-through 98%
    - challenge: ตัวแทนจำหน่ายในออสเตรเลียต้องการกลุ่มผลิตภัณฑ์ SUP ที่ได้รับการรับรอง CE พร้อมสีตามความต้องการเฉพาะ และเป็นไปตามมาตรฐานของออสเตรเลีย
      solution: ผลิตตัวอย่างก่อนการผลิตจริง (pre-production) จำนวน 4 รูปแบบสี พร้อมการทดสอบมาตรฐานร่วมกับหน่วยตรวจสอบอิสระ
      result: เปิดตัวกลุ่มผลิตภัณฑ์ SUP 3 รุ่นในตลาด AU/NZ ตามมาด้วยการชนะประมูลภาครัฐสำหรับ SUP ลาดตระเวนจำนวน 12 ลำ
faq_section:
  tagline: คำถามที่พบบ่อย
  title: คำถามที่พบบ่อยสำหรับ B2B และ OEM
  questions:
    - q: จำนวนการสั่งซื้อขั้นต่ำ (MOQ) สำหรับบอร์ด SUP เป่าลมแบบ OEM คือเท่าใด?
      a: MOQ เริ่มต้นที่ 5–10 ลำสำหรับรุ่น OEM มาตรฐาน โครงการแม่พิมพ์เฉพาะและการทำแบรนด์ส่วนตัว (private-label) ต้องมีปริมาณขั้นต่ำ 200 ลำ ขึ้นอยู่กับความซับซ้อน พร้อมรองรับคำสั่งซื้อทดลองและชุดตัวอย่างสำหรับแบรนด์ที่เพิ่งเปิดตัว
    - q: afarer ได้รับการรับรอง BSCI หรือไม่?
      a: ใช่ โรงงานของเรามีใบรับรองการปฏิบัติตามมาตรฐานสังคม BSCI ที่ยังมีผลบังคับใช้ (รายงานการตรวจประเมินพร้อมให้ตามคำขอ) เรายังถือ  สำหรับการจัดการคุณภาพ และสินค้าทั้งหมดมีการรับรอง CE  เอกสารการปฏิบัติตามข้อกำหนด REACH และ RoHS จัดส่งให้พร้อมกับสินค้า OEM ทุกชุด
    - q: โดยทั่วไปคำสั่งซื้อแบบ OEM ใช้เวลาผลิตรอรับสินค้านานเท่าใด?
      a: ใช่ โรงงานของเรามีใบรับรองการปฏิบัติตามมาตรฐานสังคม BSCI ที่ยังมีผลบังคับใช้ (รายงานการตรวจประเมินพร้อมให้ตามคำขอ) เรายังถือ  สำหรับการจัดการคุณภาพ และสินค้าทั้งหมดมีการรับรอง CE  เอกสารการปฏิบัติตามข้อกำหนด REACH และ RoHS จัดส่งให้พร้อมกับสินค้า OEM ทุกชุด
    - q: คุณสามารถจัดส่งแบบ FOB ชิงเต่า หรือ CIF ถึงท่าเรือของเราได้หรือไม่?
      a: ใช่ เราจัดส่งแบบ FOB ชิงเต่า (Qingdao), CIF ท่าเรือหลักทั่วโลก และ DDP สำหรับพันธมิตรที่ผ่านการคัดกรอง ทีมโลจิสติกส์ของเราดูแลการจองตู้คอนเทนเนอร์ เอกสารการส่งออก และพิธีการศุลกากร เราส่งออกไปยังกว่า 50 ประเทศทั่วตลาด EU, US, AU และเอเชีย
b2b_moq: 'MOQ มาตรฐาน: 5–10 หน่วยต่อรุ่น (SUP/คายัค/drop-stitch). MOQ สำหรับ SUP: 2–5 หน่วย ยินดีต้อนรับคำสั่งซื้อทดลองสำหรับพันธมิตรใหม่'
production_flow:
  tagline: ขั้นตอนการผลิต
  title: จากวัสดุสู่เรือสำเร็จรูป
  subtitle: เรือทุกลำผ่านกระบวนการผลิต 6 ขั้นตอน โดยมีจุดตรวจสอบ QC ในทุกขั้นตอน ไม่มีการลัดขั้นตอน ไม่มีการข้ามการตรวจสอบ
  stages:
    - stage: '01'
      title: การรับวัสดุและการตรวจสอบคุณภาพขาเข้า
      description: วัสดุที่เข้ามาทั้งหมดจะถูกบันทึกด้วยหมายเลขล็อต/ชุดการผลิตในระบบ ERP ของเรา ม้วนผ้า PVC แกน drop-stitch วาล์ว กาว และอุปกรณ์ฮาร์ดแวร์ จะถูกแยกกักไว้จนกว่าจะผ่านการอนุมัติจากแผนก QC
      qc_check: ความแข็งแรงดึง (ASTM D751) ความต้านทานการฉีกขาด (ISO 4674) การวัดความหนา ความหนืดของกาว และการสแกนตรวจหาข้อบกพร่องด้วยตา
      qc_threshold: ทดสอบ 100% ของทุกล็อตการผลิต ไม่อนุมัติหากแรงดึงต่ำกว่า 90% ของข้อกำหนด แรงฉีกขาดต่ำกว่าค่าขั้นต่ำ หรือพบตำหนิทางสายตาใด ๆ
      responsibility: ทีม QC ตรวจสอบสินค้าขาเข้า (พนักงานตรวจสอบ 3 คน)
    - stage: '02'
      title: การตัดด้วย CNC และการเตรียมวัสดุ
      description: การจัดวางชิ้นส่วนด้วยคอมพิวเตอร์แบบ optimized nesting วางแพทเทิร์นแผ่นบนผ้า PVC เพื่อลดของเสียให้เหลือน้อยที่สุด เครื่องตัด CNC อัตโนมัติคงความแม่นยำของตำแหน่งที่ 0.1 mm
      qc_check: ตรวจสอบมิติเทียบกับไฟล์ CAD DXF ตรวจสอบคุณภาพขอบ และตรวจสอบจำนวนแผ่นผ้า
      qc_threshold: วัดทุกแผงลำดับที่ 20 ค่าเผื่อคลาดเคลื่อน ±0.5 มม. ปฏิเสธทั้งล็อตหากเกินค่าเผื่อมากกว่า 2%
      responsibility: หัวหน้าแผนกตัดวัสดุ
    - stage: '03'
      title: การเชื่อมและการยึดติด Drop-Stitch
      description: แกนดรอปสติตช์ (Drop-stitch) ถูกยึดติดกับชั้นลามิเนต PVC ชั้นนอกด้วยการอัดรีดด้วยความร้อน ห้องลมของท่อเชื่อมด้วยวิธี RF หรือการเชื่อมด้วยลมร้อน แถบขอบเรือเชื่อมติดด้วยการหลอมรวมสามชั้น
      qc_check: การทดสอบการลอกตะเข็บทุก 50 ชิ้น (ASTM D751) การวัดความกว้างรอยเชื่อม การตรวจสอบบันทึกอุณหภูมิของเครื่องเชื่อมลมร้อน การตรวจสอบรอยต่อด้วยสายตาภายใต้แสงไฟหลัง
      qc_threshold: แรงลอกขั้นต่ำ 8 N/cm ความคลาดเคลื่อนของความกว้างรอยเชื่อม ±1 มม. พบร่องที่มองเห็นได้ = ปฏิเสธสินค้า
      responsibility: การควบคุมคุณภาพการเชื่อม (ผู้ตรวจสอบ 2 คนต่อกะ)
    - stage: '04'
      title: การประกอบและติดตั้งอุปกรณ์
      description: 'เรือเข้าสู่ขั้นตอนการประกอบขั้นสุดท้าย ซึ่งชิ้นส่วนทั้งหมดจะถูกประกอบเข้าด้วยกัน: ตัวเรือ + ท่อลม การติดตั้งวาล์ว ห่วงรูปตัว D ที่จับ กล่องครีบ และการติดตั้งถุงสำหรับยกย้าย เรือแต่ละลำดำเนินการตามรายการตรวจสอบการประกอบ 100 จุด'
      qc_check: การลงนามรับรองรายการตรวจสอบ 100 จุดต่อลำ การทดสอบการทำงานของวาล์ว (เปิด/ปิด 10 รอบ) การตรวจสอบแรงบิดของอุปกรณ์ และการตรวจสอบด้วยสายตา
      qc_threshold: 'นโยบายปลอดข้อบกพร่องโดยสิ้นเชิงสำหรับชิ้นส่วนที่สำคัญต่อความปลอดภัย (วาล์ว ห่วงรูปตัว D ที่จับ) ข้อบกพร่องด้านรูปลักษณ์เล็กน้อย: AQL 2.5 (ISO 2859)'
      responsibility: หัวหน้าทีมประกอบ + ฝ่ายควบคุมคุณภาพสายการผลิต
    - stage: '05'
      title: การทดสอบแรงดันและการพักสินค้าเพื่อควบคุมคุณภาพ
      description: ทุกช่องถูกเป่าลมถึง 1.25 เท่าของแรงดันที่กำหนด (โดยทั่วไป 20–25 PSI) และคงไว้เป็นเวลา 24–48 ชั่วโมง เซ็นเซอร์วัดแรงดันบันทึกข้อมูลอย่างต่อเนื่อง ช่องที่แรงดันลดเกิน 5% จะถูกคัดออกและส่งไปตรวจสอบตะเข็บซ้ำ
      qc_check: บันทึกการคงแรงดัน 24 ชั่วโมง ตรวจสอบการสอบเทียบเซนเซอร์ทุกวัน การอ่านค่าแรงดันที่ชดเชยอุณหภูมิ และการทดสอบตะเข็บซ้ำหลังการซ่อม
      qc_threshold: แรงดันลดลงสูงสุด 5% ภายใน 24 ชม. ที่อุณหภูมิคงที่ ห้องลมใดเกินเกณฑ์นี้ = ทดสอบซ้ำ 100% ทั้งล็อตการผลิต
      responsibility: ห้องปฏิบัติการคุณภาพ (เป็นอิสระจากฝ่ายผลิต รายงานตรงต่อฝ่ายบริหาร)
    - stage: '06'
      title: การตรวจสอบขั้นสุดท้ายและการบรรจุ
      description: การตรวจสอบขั้นสุดท้ายด้านรูปลักษณ์และการทำงาน ทั้งตำหนิบบนพื้นผิว ความสม่ำเสมอของสี การตรวจสอบป้ายกำกับ / BIN ความสมบูรณ์ของบรรจุภัณฑ์ และความครบถ้วนของอุปกรณ์เสริม ผลิตภัณฑ์จะถูกบรรจุแบบสูญญากาศ ใส่กล่อง และจัดวางบนพาเลทเพื่อเตรียมโหลดตู้คอนเทนเนอร์
      qc_check: ตรวจสอบด้วยสายตาอย่างละเอียด รายการตรวจเช็คอุปกรณ์ตาม SKU ทดสอบการตกของบรรจุภัณฑ์ (1 ม. สุ่มตัวอย่าง) ตรวจสอบการสแกนฉลาก/บาร์โค้ด
      qc_threshold: AQL 2.5 สำหรับข้อบกพร่องร้ายแรง AQL 4.0 สำหรับข้อบกพร่องเล็กน้อย ไม่ยอมรับข้อบกพร่องด้านความปลอดภัยแม้แต่รายเดียว ตรวจสอบด้วยสายตา 100% ทุกยูนิต
      responsibility: ทีม QC ขั้นสุดท้าย (พนักงานตรวจสอบ 4 คน) + หัวหน้าทีมบรรจุภัณฑ์
workforce:
  tagline: ทีมงานของเรา
  title: บุคลากรและความเชี่ยวชาญ
  engineers: 25+
  engineers_detail: วิศวกรครอบคลุมฝ่ายวิจัยและพัฒนา (R&D) การออกแบบแม่พิมพ์ ห้องปฏิบัติการวัสดุ และวิศวกรรมการผลิต โดยมีประสบการณ์เฉลี่ยมากกว่า 7 ปีในอุตสาหกรรมการผลิตผลิตภัณฑ์เป่าลม
  shift_pattern: ทำงาน 2 กะต่อวัน (07:00–15:30, 15:30–00:00) มีกะกลางคืนเสริมสำหรับคำสั่งซื้อเร่งด่วน
  training: อบรม QC รายเดือน ซ้อมความปลอดภัยรายไตรมาส ประเมินทักษะรายปี พนักงานใหม่ต้องผ่านการปฐมนิเทศ 40 ชั่วโมงก่อนเริ่มทำงานในสายการผลิต
  departments:
    - name: R&D & Engineering
      count: 25+
      role: การออกแบบผลิตภัณฑ์ วิศวกรรมแม่พิมพ์ ห้องปฏิบัติการวัสดุ
    - name: Cutting & Material Prep
      count: 15
      role: การตัดด้วย CNC การเตรียมชิ้นส่วนแผ่น และการจัดการวัสดุ
    - name: Welding & Lamination
      count: 40
      role: การเชื่อม RF การเชื่อมลมร้อน การยึดติดแบบ Drop-Stitch
    - name: SUP Core Bonding
      count: 30
      role: การเคลือบดรอปสติทช์ การยึดด้วยความร้อน การหลอมแถบขอบ
    - name: Assembly & Rigging
      count: 35
      role: การประกอบขั้นสุดท้าย การติดตั้งฮาร์ดแวร์ การตรวจสอบระบบ
    - name: Quality Control
      count: 12
      role: การควบคุมคุณภาพขาเข้า การควบคุมคุณภาพระหว่างกระบวนการ การตรวจสอบขั้นสุดท้าย และการทดสอบในห้องปฏิบัติการ
    - name: Logistics & Packing
      count: 20
      role: บรรจุภัณฑ์ การบรรจุตู้คอนเทนเนอร์ เอกสารการส่งออก
    - name: Management & Admin
      count: 15
      role: ฝ่ายขาย จัดซื้อ ทรัพยากรมนุษย์ การเงิน การปฏิบัติตามกฎระเบียบ
material_traceability:
  tagline: การตรวจสอบย้อนกลับ
  title: การติดตามวัสดุและการควบคุมล็อตการผลิต
  description: >-
    วัตถุดิบทุกชุดการผลิตจะได้รับหมายเลขล็อตเฉพาะในระบบ ERP ของเรา ตั้งแต่วัตถุดิบเข้าสู่โรงงาน ผ่านกระบวนการผลิต จนถึงผลิตภัณฑ์สำเร็จรูป รายการวัสดุของเรือแต่ละลำเชื่อมโยงกลับไปยังชุดการผลิตเดิมของซัพพลายเออร์ได้ทั้งหมด
    ทำให้สามารถตรวจสอบย้อนกลับต้นทางได้อย่างครบถ้วนสำหรับการสอบถามด้านคุณภาพหรือการปฏิบัติตามข้อกำหนดใดๆ
  system: ระบบ ERP ที่พัฒนาขึ้นเอง (ระบบภายในของ Qingdao Vatrad Group) + ป้ายระบุล็อตการผลิตติดกับใบสั่งผลิตแต่ละใบ
  coverage: 100% ของวัสดุการผลิต —PVC, Hypalon, ผ้า Drop-Stitch, กาว, วาล์ว, อุปกรณ์ฮาร์ดแวร์, บรรจุภัณฑ์
  records_retained: 10 ปี (ตามข้อกำหนด CE 2013/53/EU)
  suppliers:
    - material: PVC เกรดสำหรับงานทางทะเล
      source: ซัพพลายเออร์จากจีนและเกาหลี
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: ซัพพลายเออร์จากญี่ปุ่น
      certified: ISO 9001, REACH
    - material: ผ้าดรอปสติทช์
      source: การทอภายในโรงงาน + พาร์ทเนอร์ภายนอก
      certified: การควบคุมคุณภาพภายใน + ซัพพลายเออร์ที่ผ่าน ISO 9001
    - material: วาล์วและอุปกรณ์ประกอบ
      source: ซัพพลายเออร์ OEM ในจีน
      certified: ISO 9001, ใบรับรองวัสดุประจำชุดการผลิต
qc_dashboard:
  tagline: การควบคุมคุณภาพ (QC) ผ่านตัวเลข
  title: ตัวชี้วัดการควบคุมคุณภาพ
  subtitle: ข้อมูลผ่าน/ไม่ผ่านจริงจากสายการผลิตของเรา ห้องปฏิบัติการตรวจสอบคุณภาพทำงานแยกอิสระจากฝ่ายผลิตและรายงานตรงต่อผู้บริหาร
  stats:
    - value: 100%
      label: ทุกยูนิตผ่านการทดสอบแรงดัน
      detail: เรือทุกลำ ทุกห้องอากาศ ทุกชุดการผลิต
    - value: <5%
      label: แรงดันลดสูงสุดที่ยอมรับได้
      detail: มากกว่า 24 ชั่วโมงที่ความดัน 1.25 เท่าของความดันที่กำหนด
    - value: AQL 2.5
      label: เกณฑ์ข้อบกพร่องร้ายแรง
      detail: ตามมาตรฐานการสุ่มตัวอย่าง ISO 2859
    - value: 24–48h
      label: ระยะเวลาการคงแรงดัน
      detail: ขึ้นอยู่กับประเภทสินค้า
    - value: 1.25×
      label: แรงดันทดสอบเทียบกับแรงดันที่กำหนด
      detail: เผื่อความปลอดภัยในทุกห้องลม
    - value: 0%
      label: ความคลาดเคลื่อนที่ยอมรับได้ของข้อบกพร่องด้านความปลอดภัย
      detail: วาล์ว ห่วง D-ring ตะเข็บ และแรงลอยตัว
process_cta:
  title: ชมกระบวนการผลิตของเรา
  desc: ติดตาม SUP หนึ่งลำผ่านทุกขั้นตอนการผลิต ตั้งแต่วัตถุดิบจนถึงบอร์ดที่พร้อมออกสู่ทะเล
  label: ดูกระบวนการผลิต →
  link: /factory/process

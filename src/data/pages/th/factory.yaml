workshops_section:
  tagline: เวิร์กช็อป
  title: โรงงานผลิตเฉพาะทาง
  workshops:
    - title: การตัด PVC และการเตรียมวัสดุ
      description: เครื่องตัด CNC อัตโนมัติตัดผ้า PVC Hypalon และผ้าดรอปสติตช์ด้วยความแม่นยำระดับต่ำกว่ามิลลิเมตร การจัดวางชิ้นงานโดยการคำนวณด้วยคอมพิวเตอร์ช่วยลดเศษวัสดุ และรับประกันว่าชิ้นส่วนทุกชิ้นตรงตามสเปกมิติก่อนการเชื่อม
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: การเชื่อมท่อยางและการปิดผนึกด้วยความร้อน
      description: เวิร์กช็อปเชื่อมเฉพาะทางพร้อมเครื่องซีลความร้อนและเครื่องอัดไดอิเล็กตริก RF เครื่องซีลลมร้อนยึดและเชื่อมช่องท่อ PVC ในขณะที่การเชื่อมด้วย RF ให้รอยตะเข็บสุญญากาศความแข็งแรงสูงซึ่งเกินข้อกำหนดที่กำหนดไว้
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: การยึดแกนดรอปสติทช์
      description: แกน drop-stitch ของบอร์ด SUP ถูกยึดติดกับลามิเนต PVC ชั้นนอกด้วยกระบวนการหล่อลามิเนตด้วยความร้อน ด้ายโพลีเอสเตอร์ภายในหลายพันเส้นเชื่อมต่อชั้นบนและชั้นล่างเข้าด้วยกัน สร้างโครงสร้างที่แข็งแรงที่แรงดัน 12-15 PSI แถบขอบบอร์ดถูกเชื่อมประสานแบบสามชั้นเพื่อความแข็งแรงของขอบ
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
    - title: การพิมพ์และการตกแต่งลวดลาย SUP
      description: บอร์ด SUP ตกแต่งด้วยการพิมพ์ดิจิทัล  สำหรับกราฟิกสีเต็มรูปแบบ และการพิมพ์สกรีน  สำหรับโลโก้และลวดลายที่ทำซ้ำ การพิมพ์ดิจิทัลให้ลวดลายบนดาดฟ้าคุณภาพระดับภาพถ่าย ขณะที่การพิมพ์สกรีนให้เครื่องหมายแบรนด์ที่คงทนและสดใส
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
    - title: การประกอบขั้นสุดท้ายและการติดตั้งชิ้นส่วน
      description: สายการประกอบที่ติดตั้งวาล์ว ห่วงรูปตัว D ด้ามจับ กล่องครีบหาง และแผ่นรองดาดฟ้าให้กับบอร์ด SUP ทุกใบ บอร์ดแต่ละใบต้องผ่านเช็คลิสต์การประกอบ 100 จุด โดยมีหัวหน้าทีมเซ็นรับรอง
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: การทดสอบคุณภาพและการตรวจสอบ
      description: เรือทุกลำที่ผลิตเสร็จต้องผ่านการทดสอบการคงความดันลม การตรวจสอบการลอกของรอยต่อ และการตรวจระบบทั้งหมดก่อนจัดส่ง ห้องปฏิบัติการคุณภาพของเราทำงานแยกจากสายการผลิตและรายงานตรงต่อผู้บริหาร
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

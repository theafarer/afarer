hero:
  tagline: โรงงาน
  title: โรงงานของเรา
  subtitle: 12,000 ตร.ม. โรงงานผลิตที่ทันสมัยในชิงเต่า ประเทศจีน
intro:
  - >-
    ในฐานะแบรนด์โรงงานของ **Qingdao Vatrad Group Co., Ltd.** afarer ควบคุมทุกขั้นตอนการผลิต —ตั้งแต่การรับวัตถุดิบผ้า PVC เข้าโรงงานจนถึงการตรวจสอบครั้งสุดท้ายก่อนส่งมอบบอร์ด SUP ที่ผลิตเสร็จ โรงงานผลิตของเราในเขตพัฒนาเศรษฐกิจชิงเต่า (Qingdao Economic Development Zone) มีพื้นที่ 12,000 ตารางเมตร
    พร้อมเวิร์กช็อปเฉพาะสำหรับการตัด PVC การยึดติดแกน drop-stitch การพิมพ์ดิจิทัลบนบอร์ด SUP การประกอบขั้นสุดท้าย และการทดสอบคุณภาพ
  - ด้วยการผสานงานออกแบบ วิศวกรรม การทำต้นแบบ การผลิต และการทดสอบไว้ในที่เดียวกัน เราจึงขจัดความไร้ประสิทธิภาพของการผลิตแบบรับจ้างและควบคุมคุณภาพการประกอบ การเลือกวัสดุ และกำหนดเวลาจัดส่งได้โดยตรง SUP ทุกลำที่ออกจากโรงงานของเราสร้างโดยคนของเรา ด้วยอุปกรณ์ของเรา และตามมาตรฐานของเรา

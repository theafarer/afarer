intro: 'afarer nudi sveobuhvatne OEM i ODM usluge za marke, distributere i vladine agencije diljem svijeta. S 10+ godina iskustva u izvozu i tvornicom od 12,000 m² certificiranom prema ISO 9001 i BSCI, obavljamo sve od dizajna proizvoda i razvoja kalupa do proizvodnje u punom opsegu, pakiranja i logistike.'


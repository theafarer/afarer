why_us:
  - title: 'Vertikalna integracija'
    description: 'Posjedujemo svoju tvornicu, kalupe i lanac opskrbe — bez posrednika, bez podizvođača. To nam daje kontrolu nad kvalitetom, troškovima i isporukom.'
  - title: 'Dvostruka certificiranost'
    description: 'Upravljanje kvalitetom prema ISO 9001 i certifikat socijalne usklađenosti BSCI. Izvješća o reviziji tvornice dostupna na zahtjev.'
  - title: 'CE usklađenost'
    description: 'Svi standardni modeli nose CE 2013/53/EU certifikat. Prilagođeni modeli mogu dobiti CE certifikat kroz naš utvrđeni postupak.'
  - title: 'Nizak MOQ'
    description: 'Počnite s već 5 jedinica za standardne modele. Pomažemo novim markama da se lansiraju bez prevelikih zaliha.'

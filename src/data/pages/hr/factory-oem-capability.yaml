services:
  - title: 'Dizajn i inženjerstvo proizvoda'
    description: 'Naš interni tim za istraživanje i razvoj radi s vašim konceptom ili specifikacijom kako bi razvio CAD crteže, 3D modele i prototipove. Nudimo dizajn kalupa, optimizaciju oblika trupa i smjernice za odabir materijala.'
  - title: 'Prilagođeno brendiranje i grafika'
    description: 'Digitalni tisak u punim bojama, sitotisak, reljefni tisak i mogućnosti naljepnica. Razvijamo grafiku palube specifičnu za marku, brendiranje cijevi i pakiranje spremno za maloprodaju.'
  - title: 'Prilagodba materijala i specifikacija'
    description: 'Odaberite između PVC-a (standardni, ekološki, teško zapaljiv), drop-stitch i hibridnih konstrukcija. Prilagođene boje cijevi, težine tkanine i mogućnosti ojačanja.'
  - title: 'Pakiranje i logistika'
    description: 'Prilagođeno maloprodajno pakiranje, kutije s privatnom markom, vakuumsko pakiranje, paletizacija i ukrcaj u kontejnere. Dostupni uvjeti otpreme FOB Qingdao, CIF ili DDP.'

moq_table:
  - product: 'Napuhive SUP daske'
    standard_moq: '5–10 jedinica'
    custom_moq: '200+ jedinica'
    lead_time: '30–45 dana'
  - product: 'Spasilački prsluci i sigurnost'
    standard_moq: '100–200 jedinica'

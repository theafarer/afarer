hero:
  tagline: 'Lifestyle'
  title: 'afarer<br />lifestyle'
  subtitle: 'Izgrađeno za one koji žive na vodi — od vikend istraživača do komercijalnih operatera koji se svakog dana oslanjaju na svoju opremu.'

values:
  - icon: 🌊
    title: 'Rođeno na vodi'
    desc: 'Svaki dizajn počinje razumijevanjem ponašanja vode. Inženjerstvo gradimo od ruba uvjeta prema unutra — jer je ocean naš učitelj, a ne radno mjesto.'
  - icon: 🔧
    title: 'Izgrađeno da traje'
    desc: 'Najodrživiji proizvod je onaj kojem nije potrebna zamjena. Pomorski materijali, drop-stitch jezgre ocijenjene na 15 PSI i šavovi koji nadžive sezonu.'
  - icon: '🏆'
    title: 'Pristupačno po dizajnu'
    desc: 'Vodeni sportovi ne bi trebali biti luksuz. Profesionalne performanse po cijeni koja ima smisla za obitelji, vodiče i male operatere — ne samo za komercijalne flote.'
  - icon: 🌍
    title: 'Globalna zajednica'
    desc: 'Od obale Qingdaoa do jezera u Europi, rijeka u jugoistočnoj Aziji i zaljeva u Americi — naši kupci dijele jedno: ljubav prema boravku na vodi.'
  - icon: ♻️
    title: 'Odgovorna proizvodnja'
    desc: 'CNC optimizirano slaganje smanjuje otpad materijala ispod 5%. Izdržljiva konstrukcija smanjuje cikluse zamjene. Gradimo za dugovječnost jer je to najodrživiji izbor.'
  - icon: 🤝
    title: 'Podrška koja traje'
    desc: 'Vlasnici trupova starih dvadeset godina i dalje nas zovu za rezervne dijelove. Naš prosječan odgovor na jamstvene zahtjevje 24 sata. Ne nestajemo nakon prodaje — ovdje smo tijekom cijelog vijeka proizvoda.'


qc_section:
  tagline: 'Kontrola kvalitete'
  title: 'Postupak ispitivanja i osiguravanja kvalitete'
  subtitle: 'Svaka daska prolazi obavezno ispitivanje prije otpreme. Naš laboratorij kvalitete djeluje neovisno o proizvodnji i izvještava izravno upravi.'
  steps:
    - step: '1'
      title: 'Pregled sirovina'
      desc: 'PVC i drop-stitch tkanine prolaze ispitivanje vlačne čvrstoće (ASTM D751), širenja kidanja i provjeru otpornosti na UV zračenje prije nego što ijedna serija uđe u proizvodnju.'
    - step: '2'
      title: 'Ispitivanje zadržavanja zraka od 24–48 sati'
      desc: 'Svaka komora cijevi napuhuje se na 125% nazivnog tlaka i drži 24–48 sati. Pad tlaka veći od 5% automatski uzrokuje odbacivanje i ponovni pregled šava.'
    - step: '3'
      title: 'Ispitivanje opterećenja i ravnoteže'
      desc: 'Dovršene daske opterećuju se do maksimalnog nazivnog kapaciteta i ispituju na stabilnost i krutost. Svaka daska ispituje se u vodi prije završnog pregleda.'

oem_section:
  tagline: 'OEM projekti'
  title: 'Studije slučaja partnerstava s markama i OEM projektima'
  subtitle: 'Od koncepta do kontejnera — kako pomažemo globalnim markama lansirati i povećati linije napuhivih SUP dasaka.'
  cases:
    - challenge: 'Europski maloprodajni lanac opreme za boravak u prirodi trebao je liniju SUP dasaka s privatnom markom, jedinstvenom grafikom palube, ekološki prihvatljivim PVC-om i maloprodajno spremnim pakiranjem — sve isporučeno u 60 dana.'
      solution: 'Razvili smo prilagođene datoteke digitalnog tiska, nabavili PVC u skladu s REACH-om i skratili uzorkovanje s 3 kruga na 1 smještanjem dizajnerskog tima u našu tvornicu u Qingdou.'
      result: '55 dana od potpisanog PO-a do FOB-a. 2,400 jedinica u 4 SKU-a. Ponovljena narudžba postavljena je prije dolaska prvog kontejnera.'
    - challenge: 'Američki startup za vodene sportove trebao je visokoperformantnu drop-stitch SUP dasku s prilagođenim oblikom, pakiranjem s dvije marke i BSCI certifikatom za plasman u maloprodaji.'
      solution: 'Prilagodili smo postojeći SUP kalup izmijenjenim obrisom, razvili grafiku pakiranja s dvije marke i dostavili kompletnu BSCI revizijsku dokumentaciju.'
      result: 'Uspješno uvršteno u 3 velika američka lanca opreme za prirodu. 5,000+ jedinica u prvoj godini s 98% stopom prodaje.'
    - challenge: 'Australski distributer tražio je liniju SUP dasaka s CE certifikatom, prilagođenim bojama i usklađenost s australskim standardima.'
      solution: 'Izradili smo predproizvodne uzorke s 4 varijante boja i koordinirali ispitivanje usklađenosti od strane neovisne treće strane.'
      result: 'Linija od 3 modela SUP dasaka lansirana je na tržištu AU/NZ. Uslijedila je pobjeda na vladinom natječaju za 12 patrolnih SUP dasaka.'

faq_section:
  tagline: 'FAQ'
  title: 'Najčešća pitanja o B2B i OEM suradnji'
  questions:
    - q: 'Koja je minimalna količina narudžbe (MOQ) za OEM napuhive SUP daske?'
      a: 'MOQ počinje od 5–10 jedinica za standardne OEM modele. Prilagođeni kalupi i projekti s privatnom markom zahtijevaju najmanje 200 jedinica, ovisno o složenosti. Probne narudžbe i ograničene serije uzoraka dostupne su za lansiranja novih marki.'
    - q: 'Posjeduje li afarer BSCI certifikat?'
      a: 'Da. Naša tvornica održava važeći BSCI certifikat socijalne usklađenosti (revizijsko izvješće dostupno na zahtjev). Također posjedujemo ISO 9001 za upravljanje kvalitetom, a svi proizvodi nose CE certifikat. Dokumentacija o usklađenosti s REACH-om i RoHS-om dostavlja se uz svaku OEM pošiljku.'
    - q: 'Koliki je uobičajeni rok isporuke za OEM narudžbu?'
      a: 'Standardni rok isporuke je 30–45 dana od potvrđenog PO-a i uplate akontacije za serijsku OEM proizvodnju. Razvoj prilagođenih kalupa dodaje 15–20 dana za izradu alata. Ubrzana proizvodnja dostupna je za hitne narudžbe i sezonske vršnjake. Prototipovi se obično šalju unutar 15–20 dana.'
    - q: 'Možete li poslati robu FOB Qingdao ili CIF u našu luku?'
      a: 'Da. Šaljemo FOB Qingdao, CIF u veće globalne luke i DDP za kvalificirane partnere. Naš logistički tim upravlja rezervacijom kontejnera, izvoznom dokumentacijom i carinjenjem. Šaljemo u 50+ zemalja na tržištima EU-a, SAD-a, Australije i Azije.'

b2b_moq: 'Standardni MOQ: 5–10 jedinica po modelu. Probne narudžbe su dobrodošle za nova partnerstva.'

production_flow:
  tagline: 'Proizvodni tijek'
  title: 'Od materijala do gotove daske'
  subtitle: 'Svaka daska prolazi kroz 6 proizvodnih faza s QC kontrolnim točkama na svakom koraku. Bez prečaca, bez preskakanja pregleda.'
  stages:
    - stage: '01'
      title: 'Prijem materijala i ulazna kontrola'
      description: 'Svi ulazni materijali evidentiraju se po broju serije/lot-a u našem ERP sustavu. Role PVC tkanine, drop-stitch jezgre, ventili, ljepila i okov stavljaju se u karantenu do odobrenja kontrole kvalitete.'
      qc_check: 'Vlačna čvrstoća (ASTM D751), otpornost na kidanje (ISO 4674), mjerenje debljine, viskoznost ljepila, vizualno pretraživanje grešaka'
      qc_threshold: '100% serija se ispituje. Odbacuje se ako je vlačna čvrstoća < 90% specifikacije, kidanje < minimalne specifikacije ili postoji bilo koja vizualna greška'
      responsibility: 'Tim ulazne kontrole kvalitete (3 inspektora)'
    - stage: '02'
      title: 'CNC rezanje i priprema materijala'
      description: 'Računalno optimizirano raspoređivanje postavlja panele na PVC materijal radi smanjenja otpada. Automatski CNC strojevi za rezanje održavaju pozicijsku točnost od 0.1 mm.'
      qc_check: 'Dimenzionalna provjera prema CAD DXF datotekama, pregled kvalitete rubova, provjera broja panela'
      qc_threshold: 'Mjeri se svaki 20. panel. Tolerancija ±0.5 mm. Serija se odbacuje ako je >2% izvan tolerancije'
      responsibility: 'Voditelj radionice za rezanje'
    - stage: '03'
      title: 'Zavarivanje i spajanje drop-stitch jezgre'
      description: 'Drop-stitch jezgre lijepe se na vanjske PVC laminate toplinskom laminacijom. Komore cijevi zavaruju se RF zavarivanjem ili vrućim zrakom. Rubne trake spajaju se fuzijom u tri sloja.'
      qc_check: 'Ispitivanje odvajanja svakih 50 jedinica (ASTM D751), mjerenje širine zavara, pregled dnevnika temperature vrućeg zraka, vizualni pregled šavova pod pozadinskim osvjetljenjem'
      qc_threshold: 'Minimalna čvrstoća odvajanja 8 N/cm. Tolerancija širine zavara ±1 mm. Bilo koji vidljiv kanal = odbacivanje'
      responsibility: 'QC zavarivanja (2 inspektora po smjeni)'
    - stage: '04'
      title: 'Montaža i opremanje'
      description: 'Daske prelaze u završnu montažu gdje se spajaju sve komponente: rubovi lijepe i zavaruju, ventili ugrađuju, D-prstenovi, ručke, kutije za peraje i futrole za nošenje. Svaka jedinica slijedi kontrolni popis montaže od 100 točaka.'
      qc_check: 'Ovjera kontrolnog popisa od 100 točaka po jedinici, ispitivanje funkcije ventila (10 ciklusa otvaranja/zatvaranja), provjera momenta okova, vizualni pregled'
      qc_threshold: 'Politika nula grešaka za stavke kritične za sigurnost (ventili, D-prstenovi, ručke). Manje kozmetičke greške: AQL 2.5 (ISO 2859)'
      responsibility: 'Voditelj montaže + linijska kontrola kvalitete'
    - stage: '05'
      title: 'Ispitivanje tlaka i čekanje na kontrolu'
      description: 'Svaka komora napuhuje se na 1.25× nazivni tlak (obično 20–25 PSI) i drži 24–48 sati. Senzori tlaka neprestano zapisuju. Komore s padom tlaka većim od 5% odbacuju se i šalju na ponovni pregled šava.'
      qc_check: 'Dnevnik zadržavanja tlaka 24–48 h, kalibracija senzora provjerava se svakodnevno, očitanje tlaka kompenzirano temperaturom, ponovno ispitivanje šava nakon popravka'
      qc_threshold: 'Najviše 5% pada tlaka tijekom 24–48 h pri stabilnoj temperaturi. Bilo koja komora koja to premašuje = 100% ponovno ispitivanje cijele proizvodne serije'
      responsibility: 'Laboratorij kvalitete (neovisan o proizvodnji, izvještava upravi)'
    - stage: '06'
      title: 'Završni pregled i pakiranje'
      description: 'Završni vizualni i funkcionalni pregled. Površinske greške, dosljednost boja, provjera naljepnica/BIN-a, integritet pakiranja i potpunost dodataka. Jedinice se pakiraju u vakuum, slažu u kutije i paletiziraju za utovar u kontejnere.'
      qc_check: 'Kompletan vizualni pregled, kontrolni popis dodataka po SKU-u, test pada pakiranja (1 m, slučajni uzorak), provjera skeniranja naljepnica i barkodova'
      qc_threshold: 'AQL 2.5 za velike greške, AQL 4.0 za male. Nulta tolerancija za sigurnosne greške. 100% jedinica vizualno je pregledano'
      responsibility: 'Tim završne kontrole (4 inspektora) + voditelj pakiranja'


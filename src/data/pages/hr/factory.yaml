hero:
  tagline: 'Tvornica'
  title: 'Tvornica i proizvodnja'
  subtitle: '12,000 m² integrirane proizvodnje — od sirovine do gotove daske'

intro:
  - 'Kao proizvodni ogran tvrtke **Aquafarer LLC (USA)**, afarerov operativni tim u Qingdou nadzire svaku fazu proizvodnje — od dolaska sirovina od PVC-a i stakloplastike do završnog pregleda gotove daske prije isporuke. Naš proizvodni pogon u Qingdaoskoj gospodarskoj razvojnoj zoni prostire se na 12,000 četvornih metara i obuhvaća namjenske radionice za rezanje PVC-a, toplinsko spajanje cijevi, izradu FRP kalupa, digitalni tisak SUP dasaka, završnu montažu i ispitivanje kvalitete.'
  - 'Integracijom dizajna, inženjerstva, izrade prototipova, proizvodnje i ispitivanja pod jednim krovom otklanjamo neučinkovitost ugovorne proizvodnje i zadržavamo izravan nadzor nad kvalitetom izrade, odabirom materijala i rokovima isporuke. Svaku dasku koja napusti našu radionicu izrađuju naši ljudi, na našoj opremi, prema našim standardima.'


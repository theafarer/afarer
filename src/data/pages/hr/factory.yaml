workshops_section:
  tagline: 'Radionice'
  title: 'Proizvodne radionice'
  workshops:
    - title: 'Rezanje PVC-a i priprema materijala'
      description: 'Automatski CNC strojevi za rezanje obrađuju PVC i drop-stitch tkanine s preciznošću ispod milimetra. Računalno optimizirano raspoređivanje smanjuje otpad materijala i osigurava da svaki panel zadovoljava dimenzionalnu specifikaciju prije zavarivanja.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Zavarivanje cijevi i toplinsko spajanje'
      description: 'Namjenska radionica za zavarivanje sa strojevima za toplinsko spajanje i RF prešama. Toplinski spajači s vrućim zrakom spajaju i stapaju komore PVC cijevi, dok RF zavari daju visokočvrste nepropusne šavove koji premašuju zahtjeve standarda EN ISO 25649.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'FRP kalupi i izrada kompozita'
      description: 'Prilagođeni FRP kalupi za SUP komponente, izrađeni ručnim polaganjem stakloplastike s poliesterskim i vinilesterskim sustavima smola. Svaki se sloj ručno valja i pakira u vakuum radi dosljedne kvalitete. Kabina za prskanje gelcoata pruža visokosjajni, UV-otporni pomorski završni sloj.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Tisak i dekoriranje SUP dasaka'
      description: 'SUP daske ukrašavaju se digitalnim tiskom za grafiku u punim bojama i sitotiskom za logotipove i ponavljajuće uzorke. Digitalni pisači proizvode dizajne palube fotografske kvalitete, dok sitotisak daje trajne, živopisne oznake marke.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Završna montaža i opremanje'
      description: 'Montažna linija na kojoj se drop-stitch jezgre dovršavaju rubnim trakama, postavljaju EVA palube te ugrađuju peraje, ventili i dodaci. Svaka daska slijedi kontrolni popis montaže od 100 točaka koje ovjerava voditelj tima.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Ispitivanje kvalitete i pregled'
      description: 'Svaka dovršena daska prolazi obavezno ispitivanje zadržavanja zraka, provjeru odvajanja šava i kompletnu provjeru sustava prije otpreme. Naš laboratorij kvalitete djeluje neovisno o proizvodnji i izvještava izravno upravi.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


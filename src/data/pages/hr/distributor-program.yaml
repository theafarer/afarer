faqs:
  title: 'Državno partnerstvo — FAQ'
  subtitle: 'Pitanja koja ozbiljni državni partneri postavljaju prije prijave.'
  items:
    - title: 'Što zaista znači jedna-zemlja-jedan-distributer?'
      description: 'Afarer imenuje jednog ovlaštenog distributera s ekskluzivnim pravima za određeni teritorij. Ne prodajemo iz naših globalnih ili regionalnih kanala u zaštićenu zemlju. Vaše vlasništvo nad teritorijem vrijedi dok god se ispunjava Distribucijski ugovor.'
    - title: 'Je li teritorij ekskluzivan zauvijek?'
      description: 'Ne. Ekskluzivnost je uvjetna, ne trajna. Održava se potpisanim Distribucijskim ugovorom, izvršenjem prve narudžbe, godišnjim ciljevima nabave, lokalnom zalihom, sposobnošću servisa nakon prodaje i nastavkom ulaganja u tržište. Ako se ti uvjeti ne ispune, teritorij se može ponovno pregovoriti ili dodijeliti drugome.'
    - title: 'Kolika je minimalna prva narudžba?'
      description: 'Državni i regionalni distributeri počinju od 100–300 jedinica; ovlašteni trgovci od 30–50 jedinica; probne narudžbe od 10–30 jedinica omogućuju vam da najprije provjerite tržište (probne narudžbe i narudžbe uzoraka ne nose zaštitu teritorija). Prilagođeni programi i programi privatnih marki slijede posebne MOQ-ove navedene u razinama gore.'
    - title: 'Koja je podrška uključena u program podrške od 10 modula?'
      description: 'Razine i kvalifikacija, zaštita teritorija, MOQ / cijene / godišnji rabati, zalihe i izvršavanje narudžbi, marketinški materijali i zajednički tržišni fondovi, obuka o proizvodima / prodaji / tehnici, rezervni dijelovi i podrška nakon prodaje, registracija jamstva, portal za partnere te tehnički listovi proizvoda, knjižnica marketinških materijala, raspored godišnjih rabata te otpremni i paketni popisi.'
    - title: 'Kako me Afarer štiti od sukoba kanala?'
      description: 'Svaki teritorij ima točno jednog ovlaštenog distributera. Upiti i izravne narudžbe iz vaše regije usmjeravaju se preko vas, obrasci s web-stranice prosljeđuju se lokalnom partneru tamo gdje on postoji, a globalni tim eskalira samo kada partner ne odgovori.'
    - title: 'Koji su uvjeti otpreme i plaćanja?'
      description: 'Narudžbe se šalju FOB Qingdao s kompletnom izvoznom dokumentacijom. Proizvodne narudžbe: 30% akontacija i 70% prije otpreme; probne narudžbe i uzorci plaćaju se unaprijed. Standardni rok isporuke je 30–45 radnih dana, a za ograničene serije uzoraka 15–20 radnih dana.'
    - title: 'Kako se prijavim?'
      description: 'Pošaljite prijavu putem kontaktnog obrasca s detaljima o tržištu. Pregledavamo usklađenost s tržištem, maloprodajnu prisutnost i logističke mogućnosti, a zatim odgovaramo u roku od 3 radna dana sa sljedećim koracima i uzorkom Distribucijskog ugovora.'

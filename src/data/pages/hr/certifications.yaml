meta:
  title: 'Certifikati — CE, ISO 9001 i usklađenost | {SITE}'
  description: 'afarer certifikati kvalitete: CE (EN ISO 25649), ISO 9001:2015, BSCI. Usklađenost i sigurnost proizvođača napuhivih SUP dasaka.'
  keywords:
    - 'ce certifikat sup'
    - 'iso 9001 sup'
    - 'nautička usklađenost'
    - 'certifikacija paddleboard dasaka'
hero:
  tagline: 'Certifikati i standardi'
  title: 'Certifikati kvalitete<br />i standardi usklađenosti'
  subtitle: 'afarer proizvodnja SUP dasaka certificirana je prema međunarodnim standardima pomorske sigurnosti, sustavima upravljanja kvalitetom i ekološkim propisima — CE, ISO 9001, UKCA, BSCI i REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'afarer certifikati kvalitete i dokumentacija o usklađenosti'
content_certifications:
  tagline: 'Naši certifikati'
  title: 'Certificirana kvaliteta,<br />globalno priznata'
  subtitle: 'Svaki afarer proizvod podupiru certifikati koji dokazuju našu predanost kvaliteti, sigurnosti i odgovornosti prema okolišu.'
  items:
    - title: 'CE certifikat'
      description: 'Svi afarer proizvodi u skladu su s europskim zahtjevima CE označavanja za rekreativna plovila, čime se osigurava ispunjavanje standarda sigurnosti, zdravlja i zaštite okoliša.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Naš sustav upravljanja kvalitetom certificiran je prema ISO 9001:2015 i obuhvaća dizajn, proizvodnju i distribuciju napuhivih plovila i pomorske opreme.'
      icon: tabler:clipboard-check
    - title: 'UKCA oznaka'
      description: 'Proizvodi koji se prodaju na tržištu Ujedinjenog Kraljevstva nose UKCA oznaku koja potvrđuje usklađenost s britanskim propisima za pomorsku opremu i osobna plovila.'
      icon: tabler:shield
    - title: 'Usklađenost s BSCI'
      description: 'afarer je auditan prema BSCI (Business Social Compliance Initiative), što dokazuje etičke proizvodne prakse, poštene radne uvjete i odgovornost u lancu opskrbe.'
      icon: tabler:heart-handshake
    - title: 'Usklađenost s REACH'
      description: 'Svi materijali korišteni u afarer proizvodima u skladu su s EU REACH propisima o kemijskoj sigurnosti, čime se osigurava da u našem PVC-u, EVA-i ili komponentama nema ograničenih tvari.'
      icon: tabler:flask
    - title: 'Ispitivanje materijala'
      description: 'Tkanine se ispitju na vlačnu čvrstoću, otpornost na kidanje, UV degradaciju i performanse pri hladnim pukotinama. Svaka se proizvodna serija uzorkuje i provjerava.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Standardi tvornice'
  title: 'Proizvodna izvrsnost<br />— izrađeno prema specifikaciji'
  subtitle: 'Naš objekt od 12,000 m² radi pod strogim protokolima kontrole kvalitete u svakoj fazi proizvodnje.'
  list:
    - 'Ulazna kontrola materijala: Svi sirovi materijali — PVC tkanina, EVA pjena, ljepila, okov — ispituju se prema specifikacijama prije ulaska u proizvodnju.'
    - 'Kontrola kvalitete u procesu: Svaka faza proizvodnje ima dokumentirane QC kontrolne točke. Čvrstoća zavara, poravnanje šavova, ugradnja ventila i momenti spojeva provjeravaju se u liniji.'
    - 'Ispitivanje tlakom: Svaka napuhiva komora ispituje se na 1.25× nazivnog tlaka tijekom 24–48 sati. Pad tlaka mora ostati ispod 5% za prolaznu ocjenu.'
    - 'Završni pregled: Dovršeni proizvodi pregledavaju se na dimenzijsku točnost, kozmetički završni sloj, potpunost dodataka i integritet pakiranja prije otpreme.'
    - 'Sljedivost serija: Svaki proizvod nosi serijski broj povezan s evidencijom proizvodne serije, što omogućuje potpunu sljedivost od sirovine do gotovog proizvoda.'
content_safety:
  tagline: 'Standardi pomorske sigurnosti'
  title: 'Sigurnost prije svega<br />— dizajnirano za pouzdan rad'
  subtitle: 'afarer proizvodi dizajnirani su i ispitani tako da ispunjavaju međunarodne standarde pomorske sigurnosti za komercijalnu i rekreativnu upotrebu.'
  items:
    - title: 'EN ISO 25649'
      description: 'Napuhive SUP daske u skladu su sa standardima EN ISO 25649 za izgradnju, stabilnost, plovnost i nosivost.'
      icon: tabler:sailboat
    - title: 'Usklađenost sa SOLAS'
      description: 'Sigurnosna oprema i sredstva za spašavanje ispunjavaju SOLAS (Safety of Life at Sea) zahtjeve tamo gdje se primjenjuju.'
      icon: tabler:lifebuoy

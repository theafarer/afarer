hero:
  tagline: 'Tehnologija'
  title: 'Izgrađeno za performanse'
  subtitle: 'Svaka afarer napuhiva SUP daska konstruirana je s drop-stitch konstrukcijom i pomorskim PVC-om — precizni materijali i proizvodne metode testirane za zahtjevna morska okruženja.'

sections:
  - title: 'Drop-stitch jezgra'
    description: 'Tisuće unutarnjih poliesterskih niti povezuje gornje i donje slojeve, stvarajući krutu konstrukciju pri 12-15 PSI. To je ista tehnologija koja se koristi u profesionalnim daskama za veslanje i napuhivim utrka SUP daskama.'
    imageAlt: 'Dijagram DS jezgre'
  - title: 'Pomorski PVC'
    description: 'Višeslojna laminirana PVC tkanina ocijenjena za morska okruženja. Svaki je sloj fuzijski zavaren umjesto lijepljen, čime se uklanjaju rizici odvajanja slojeva. Testirana na UV otpornost, koroziju od slane vode i habanje.'
    imageAlt: 'PVC sloj'
  - title: 'Vojnički PVC'
    description: 'Korišten na svim SUP modelima, premium PVC pruža vrhunsku UV i kemijsku otpornost. Zadržava fleksibilnost pri ekstremnim temperaturama i odolijeva degradaciji.'
    imageAlt: 'PVC'
  - title: 'Napuhiva podna paluba'
    description: 'Napuhiva drop-stitch konstrukcija pod visokim tlakom koja pruža iznimnu krutost za stajanje, ribolov i yogu. Smanjuje vrijeme pripreme, ukupnu težinu i volumen skladištenja.'
    imageAlt: 'Zračna paluba'


body: |
  <h2>Što je napuhiva SUP daska?</h2>
  <p>Napuhiva SUP daska (Stand-Up Paddle Board) prijenosno je plovilo izrađeno od drop-stitch PVC materijala koje postaje kruto kada se napuše pod visokim tlakom (12-15 PSI). Za razliku od tradicionalnih tvrdih dasaka od pjene i stakloplastike, napuhiva SUP daska može se ispuhati, smotati i pohraniti u futrolu veličine ruksaka.</p>
  <p>Unatoč tome što je napuhiva, moderne SUP daske dostižu krutost i performanse tvrdih dasaka za većinu rekreativnih i touring namjena. Ključna inovacija je <strong>drop-stitch izrada</strong>: tisuće poliesterskih niti povezuje gornji i donji sloj tkanine, sprječavajući širenje daske pri tlačenju.</p>

  <h2>Kako radi: drop-stitch tehnologija</h2>
  <p>Jezgra svake napuhive SUP daske je drop-stitch tkanina. Tijekom proizvodnje tisuće niti tka se između dva sloja tkanine premazane PVC-om. Kada se daska napuše:</p>
  <ul>
    <li>Niti privlače gornje i donje panele na fiksnu udaljenost</li>
    <li>To stvara krutu, ravnu platformu koja se odupire savijanju i fleksiji</li>
    <li>Pri 12-15 PSI daska postiže krutost usporedivu s daskama s jezgrom od EPS pjene</li>
  </ul>

  <h2>Ključne komponente</h2>
  <ul>
    <li><strong>Drop-stitch PVC jezgra</strong> — Primarni strukturni sloj koji daje krutost</li>
    <li><strong>Rubne trake</strong> — Ojačani rubovi koji štite od abrazije i udaraca</li>
    <li><strong>EVA podloga palube</strong> — Protuklizna površina za udobnost stajanja i prianjanje</li>
    <li><strong>Sustav peraja</strong> - Skidajuće peraje za stabilnost smjera (obično konfiguracija 2+1)</li>
    <li><strong>Ventil</strong> — Ventil visokog tlaka s povratnim ventilom za napuhivanje i ispuhivanje</li>
  </ul>

  <h2>Česte namjene</h2>
  <ul>
    <li><strong>Veslanje na mirnoj vodi</strong> — Jezera, mirni zaljevi i spore rijeke</li>
    <li><strong>Touring</strong> — Veslanje na velike udaljenosti na otvorenoj vodi koje zahtijeva učinkovito klizanje</li>
    <li><strong>Surfanje</strong> — Mali do srednji valovi (početnici do srednje razine)</li>
    <li><strong>Ribolov</strong> — Tih i plitki pristup vodi za ribolovce</li>
    <li><strong>Fitness</strong> — SUP yoga, pilates i trening jezgre na vodi</li>
    <li><strong>Putovanja</strong> — Prijenosan dizajn čini je idealnom za zrakoplovne kompanije i putovanja automobilom</li>
  </ul>

  <h2>Napuhiva naspram tvrde SUP daske: ključne razlike</h2>
  <table>
    <tr><th>Aspekt</th><th>Napuhiva SUP daska</th><th>Tvrda SUP daska (EPS/stakloplastika)</th></tr>
    <tr><td>Prenosivost</td><td>Stane u ruksak</td><td>Zahtijeva nosač na krovu ili veliko vozilo</td></tr>
    <tr><td>Trajnost</td><td>Otporna na udarce, bez udubljenja</td><td>Može puknuti, udubiti se ili delaminirati</td></tr>
    <tr><td>Skladištenje</td><td>Stane u ormar ili prtljažnik auta</td><td>Zahtijeva namjenski prostor za skladištenje</td></tr>
    <tr><td>Performanse</td><td>Izvrsna za rekreaciju i touring</td><td>Nadmoćna za utrke i napredno surfanje</td></tr>
    <tr><td>Prijateljskost za početnike</td><td>Mekša paluba, manji rizik od ozljeda</td><td>Tvrda površina, manje oprosta pogrešaka</td></tr>
    <tr><td>Vrijeme pripreme</td><td>3-5 minuta napuhivanja</td><td>Odmah spremna</td></tr>
  </table>

  <h2>Kako odabrati pravu SUP dasku</h2>
  <p>Pri odabiru napuhive SUP daske razmotrite ove čimbenike:</p>
  <ul>
    <li><strong>Volumen (litre)</strong> — Određuje plovnost. Veći volumen nosi veću težinu i pruža stabilnost.</li>
    <li><strong>Duljina</strong> — Duže daske (11-14 ft) bolje drže smjer za touring; kraće daske (9-10 ft) su upravljivije za surfanje.</li>
    <li><strong>Širina</strong> — Šire daske (32-36 in) stabilnije su; uže daske (28-31 in) brže su.</li>
    <li><strong>Debljina</strong> — Daske debljine 6 inča nude optimalnu krutost; daske debljine 4.7 inča lakše su i prenosivije.</li>
    <li><strong>Kvaliteta izrade</strong> — Tražite fuzijski laminirane ili tkane drop-stitch konstrukcije radi trajnosti.</li>
  </ul>

  <h2>Najčešća pitanja</h2>
  <h3>Je li napuhiva SUP daska jednako kruta kao tvrda daska?</h3>
  <p>Uz pravilno napuhivanje (12-15 PSI), moderne drop-stitch SUP daske postižu usporedivu krutost za rekreativno veslanje. Tvrde daske ipak imaju prednost za utrke i napredno surfanje zbog lakše težine i profinjenijih karakteristika savijanja.</p>

  <h3>Koliko traje napuhivanje?</h3>
  <p>Uz dvostuku pumpu većina dasaka dostiže 12-15 PSI u 3-5 minuta. Dostupne su električne pumpe koje skraćuju vrijeme napuhivanja na otprilike 2 minute.</p>

  <h3>Mogu li ponijeti napuhivu SUP dasku u zrakoplov?</h3>
  <p>Da. Kada se ispuha i smota, većina SUP dasaka stane u ruksak koji ispunjava zahtjeve zrakoplovnih kompanija za predatu prtljagu. Uvijek provjerite ograničenja veličine i težine kod svoje kompanije.</p>

  <h3>Koliko su trajne napuhive SUP daske?</h3>
  <p>Napuhive SUP daske vrlo su trajne. Izrada od PVC-a vojne klase odupire se udarcima, probijanjima i UV oštećenjima. Manja probušenja mogu se popraviti na terenu priloženim kompletom za popravak.</p>

  <h3>Kakvo održavanje je potrebno?</h3>
  <p>Isperite slatkom vodom nakon upotrebe u slanoj vodi. Čuvajte na hladnom i suhom mjestu dalje od izravnog sunca. Tijekom dugotrajnog skladištenja djelomično napuhajte kako biste zadržali oblik bez opterećenja šavova.</p>

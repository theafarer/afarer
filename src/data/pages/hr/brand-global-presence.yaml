features3_markets:
  tagline: 'Ključna tržišta'
  title: 'Regionalna stručnost<br />za lokalne zahtjeve'
  subtitle: 'Razumijemo da različita tržišta imaju različite regulatorne zahtjeve, preferencije i namjene upotrebe.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Europa i UK'
      description: 'Proizvodi s CE certifikatom. Jaka potražnja za SUP daskama na tržištima EU. Britanski distributeri cijene naš brz odziv.'
      icon: tabler:map-pin
    - title: 'Sjeverna Amerika'
      description: 'Proizvodnja odobrena od strane američke obalne straže. Američko skladište u Montclairu, CA za brzu isporuku na Zapadnu obalu. Rastuća potražnja za ribolovnim, spasilačkim i rekreativnim SUP daskama.'

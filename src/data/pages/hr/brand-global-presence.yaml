    - title: 'Australija i Oceanija'
      description: 'Jake potrebe za SUP daskama i priborom za vodene sportove. Australski distributeri cijene našu PVC konstrukciju otpornu na UV zrake u oštrim sunčanim uvjetima. Brza otprema iz našeg pogona u Aziji.'
      icon: tabler:map-pin
    - title: 'Bliski istok'
      description: 'Rastuća potražnja za opremom za vodene avanture. Naše komercijalne SUP daske i sigurnosna oprema popularne su kod turističkih operatera i najamnih centara. Prilagođene konfiguracije za okruženja s visokim temperaturama.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Distribucijska mreža'
  title: 'Partnerstvo s distributerima<br />širom svijeta'
  subtitle: 'Suradujemo s etabliranim distributerima pomorske opreme, brendovima vodenih sportova i vladinim nabavnim agencijama.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Programi zajedničkog brendiranja'
      description: 'Proizvodnja s privatnom oznakom za globalne brendove vodenih sportova. Vodimo sve, od dizajna do proizvodnje i izravne otpreme.'
      icon: tabler:building
    - title: 'Mreža distributera'
      description: 'Ovlašteni distributeri u više od 20 zemalja drže zalihe i pružaju lokalnu podršku. Nove upite distributera rado primamo.'
      icon: tabler:users
    - title: 'Vladin i institucionalni sektor'
      description: 'Izravna isporuka obalnim stražama, organizacijama za potragu i spašavanje te vojnim nabavnim programima. Sukladnost s institucionalnim nabavnim zahtjevima.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Globalna logistika i podrška'
  subtitle: 'Od tvornice do odredišta — upravljamo cijelim lancem dobave.'
  items:
    - title: 'Opcije otpreme'
      description: 'Pomorski teret (FOB Qingdao), zračni teret za hitne narudžbe i ekspresni kuri za uzorke i rezervne dijelove.'
      icon: tabler:truck-delivery
    - title: 'Američko skladište'
      description: 'Zalihe u Montclairu, CA za brzu isporuku diljem Sjeverne Amerike. Zapadna obala: 2-3 dana, središnji dio: 3-4 dana, Istočna obala: 4-5 dana.'
      icon: tabler:building-warehouse
    - title: 'Rezervni dijelovi'
      description: 'Originalni afarer rezervni dijelovi i potrošni materijal na zalihi tijekom cijele godine. Česti dijelovi šalju se u roku od 24 sata.'
      icon: tabler:package
    - title: 'Tehnička podrška'
      description: 'Izravna linija do našeg inženjerskog tima za tehnička pitanja, savjete za popravak i podršku za zamjenske dijelove. Podržavamo daske koje smo izradili prije 20 godina.'
      icon: tabler:headset

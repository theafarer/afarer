meta:
  title: 'Pomorska stručnost — Inženjerstvo u svakom trupu | {SITE}'
  description: 'Desetljeća pomorskog inženjerstva u svakom trupu. afarer vlada drop stitch tehnologijom, pomorskim PVC-om i profesionalnim dizajnom napuhivih SUP daska.'
  keywords:
    - 'pomorsko inženjerstvo'
    - 'proizvođač napuhivih SUP daska'
    - 'proizvodnja daska za veslanje'
hero:
  tagline: 'Pomorska stručnost'
  title: 'Desetljeća pomorskog inženjerstva<br />u svakom trupu'
  subtitle: 'afarer spaja duboku znanost o materijalima, preciznu proizvodnju i testiranje u stvarnim uvjetima kako bi stvorio plovila koja funkcioniraju kada je najvažnije.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'afarer tim za pomorsko inženjerstvo i R&D na radu'
expertise_materials:
  tagline: 'Znanost o materijalima'
  title: 'Odabir pravog materijala<br />za svaku namjenu'
  subtitle: 'Radimo s dva ključna materijala — svaki odabran za specifične namjene i zahtjeve performansi.'
  columns: 3
  items:
    - title: 'Pomorski PVC'
      description: 'PVC tkanina od 1100 denier — naš najsvestraniji materijal. UV-stabilizirana, otporna na habanje i u skladu s REACH-om. Idealna za SUP daske gdje su težina i troškovna učinkovitost važni.'
      icon: tabler:droplet
    - title: 'Stakloplastika i polietilen'
      description: 'SUP daske laminirane stakloplastikom za premium krutost i klizanje. Rotacijski lijevani polietilen za najam i spašavanje u teškim uvjetima koji zahtijevaju maksimalnu otpornost na udarce.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Proizvodne mogućnosti'
  title: 'Precizna proizvodnja<br />u svakom koraku'
  subtitle: 'Naš pogon od 12,000 m² opremljen je specijaliziranim strojevima za svaku fazu proizvodnje.'
  columns: 2
  items:
    - title: 'CNC rezanje'
      description: 'Računalno kontrolirano rezanje omogućuje precizne, ponovljive ploče tkanine uz minimalan otpad. Svaki komad odgovara točno dizajnu.'
      icon: tabler:cpu
    - title: 'Zavarivanje visoke frekvencije'
      description: 'Industrijsko HF zavarivanje stvara šavove jače od osnovnog materijala. Dosljedna kontrola temperature i tlaka osigurava nepropusne brtve u svakoj proizvodnoj seriji.'
      icon: tabler:bolt
    - title: 'Montaža drop stitch jezgre'
      description: 'Tisuće poliesterskih niti povezuje gornje i donje slojeve tkanine, omogućujući napuhivanje pod visokim tlakom (15-20 PSI) za krute, stabilne SUP daske.'
      icon: tabler:building-arch
    - title: 'Ispitivanje tlaka'
      description: 'Svaki napuhivi proizvod testira se na tlak prije otpreme. Daske se testiraju pri 1,25x nazivnog tlaka — ako izdrži tamo, funkcionirat će na vodi.'
      icon: tabler:wind
    - title: 'Ispitivanje čvrstoće šavova'
      description: 'Slučajni uzorci iz svake proizvodne serije prolaze destruktivno ispitivanje čvrstoće šavova. Rezultati se bilježe i mogu se pratiti do konkretnih proizvodnih serija.'
      icon: tabler:files
    - title: 'Ispitivanje na vodi'
      description: 'Svaki model prolazi ispitivanja na moru prije certifikacije. Testiranje u stvarnim obalnim uvjetima potvrđuje performanse, ponašanje i stabilnost.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Dizajn i inženjerstvo'
  title: 'Konstruirano za stvarne uvjete'
  subtitle: 'Naša dizajnerska filozofija počinje s time kako će se daska koristiti — a zatim gradi inženjerstvo oko te namjene.'
  items:
    - title: 'Dizajn performantnog trupa'
      description: 'Svaki je oblik trupa podešen za svoju namjenu — nos za istiskivanje za touring klizanje, dodani rocker za surf okretnost, ravni stabilni profili za ribolov i yogu.'
    - title: 'Sigurnost drop stitch jezgre'
      description: 'Svaka daska ima krutu drop-stitch jezgru s ojačanim rubovima. Ako je jedan dio oštećen, visokovlačna drop-stitch konstrukcija održava dasku upotrebljivom.'
    - title: 'Ergonomski raspored površine'
      description: 'Zoniranje podloge, položaj ručke za nošenje i točke montiranja dizajnirani su oko udobnosti vozača tijekom duge upotrebe — bilo za touring, ribolov ili patroliranje.'
    - title: 'Prilagođena konfiguracija'
      description: 'Boje rubova, konfiguracija podloge, nosači pribora, kapacitet opreme — svaki se model može prilagoditi specifičnim operativnim zahtjevima.'

headline: 'Ograničeno proizvođačevo jamstvo afarer'
subtitle: 'afarer stoji iza kvalitete svakog napuhivog proizvoda za more koji proizvodimo. Ovo ograničeno jamstvo utvrđuje uvjete i pokriće za vaš afarer proizvod.'
seo:
  headline: 'Jamstvo za afarer napuhive SUP daske — 5-godišnje ograničeno jamstvo | afarer'
  description: 'afarer nudi 5-godišnje ograničeno jamstvo na glavnu tkaninu površine, šavove i strukturnu integritet drop-stitch jezgre. Pokriva i ventile za napuhivanje i tvornički ugrađeni pribor. Kompletni uvjeti jamstva za afarer napuhive SUP daske.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Ovo se ograničeno jamstvo primjenjuje na nove napuhive proizvode za more pod afarer brendom, kupljene izravno od afarera ili od ovlaštenog afarer dilera ili prodavača. Datum stupanja na snagu jest provjerljivi datum izvorne maloprodajne kupnje.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Pokriće i trajanje jamstva</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Integritet glavne tkanine cijevi (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Strukturni integritet trupa od stakloplastike</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Sposobnost zadržavanja zraka šavova napuhivih cijevi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Funkcionalnost ventila za napuhivanje</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Tvornički ugrađeni pribor i pomoćni okovi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 godina*</h3>
        <p class="text-sm text-gray-600 mt-1">Komercijalna, najamna ili flotna upotreba — sve komponente</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komercijalna, vladina, plovna, najamna ili instrukcijska upotreba smanjuje jamstvo na 1 godinu. Upotreba u utrkama ili natjecanjima potpuno ukida jamstvo.</p>
  </div>

  <h2>Što je pokriveno</h2>
  <h3>Glavna tkanina cijevi (5 godina)</h3>
  <p>afarer jamči za glavnu tkaninu površine protiv poroznosti koja bitno ugrožava sposobnost proizvoda da održava radni tlak napuhivanja. To se primjenjuje na tkaninu presvučenu PVC-om i sve ostale materijale tkanine površine korištene u proizvodnji.</p>

  <h3>Strukturni integritet trupa od stakloplastike (5 godina)</h3>
  <p>Za proizvode s trupom od stakloplastike ojačane plastikom (FRP), temeljna kompozitna konstrukcija pokrivena je jamstvom protiv strukturnog otkaza zbog grešaka u materijalima ili izradi.</p>

  <h3>Sposobnost zadržavanja zraka šavova napuhivih cijevi (5 godina)</h3>
  <p>Šavovi napuhivih cijevi, spojeni tijekom proizvodnje, pokriveni su jamstvom protiv proizvodnih grešaka koje rezultiraju znatnim curenjem zraka kroz šav. Periodični pregled i održavanje odgovarajućih tlakova napuhivanja uvjeti su pokrića.</p>

  <h3>Funkcionalnost ventila za napuhivanje (5 godina)</h3>
  <p>Ventili za napuhivanje zraka izvorno ugrađeni od strane afarera pokriveni su jamstvom protiv proizvodnih grešaka u materijalima ili izradi koje sprječavaju ventil da zadržava zrak kako je dizajniran.</p>

  <h3>Tvornički ugrađeni pribor (1 godina)</h3>
  <p>Komponente i okovi koje je proizveo afarer i izvorno ugradio u tvornici pokriveni su jednogodišnjim jamstvom protiv grešaka u materijalu i izradi. To isključuje proizvode trećih strana, koje pokrivaju samo jamstva njihovih proizvođača.</p>

  <h2>Što nije pokriveno</h2>
  <ul>
    <li>Estetski nedostaci uključujući diskoloraciju, mrlje, izblijeđivanje, kredastost ili bilo koju promjenu izgleda</li>
    <li>Proboji, rezovi, suze, rasprskavanja ili druga fizička oštećenja</li>
    <li>Pukotine u vidricama, pucanje, habanje, ogrebotine ili propadanje zbog trenja ili dodira</li>
    <li>Degradacija zbog izloženosti UV svjetlu, vremenskim uvjetima ili atmosferskim prilikama</li>
    <li>Oštećenja od dodira s gorivima, otapalima, kiselinama, lužinama ili kemikalijama</li>
    <li>Oštećenja zbog nemara, nepravilne upotrebe, zlostavljanja, nesreće ili normalnog trošenja</li>
    <li>Problemi površine gelcoata ili boje (mjehurići, pukotine, diskoloracija, izblijeđivanje)</li>
    <li>Oštećenja od udaraca, naprezanja, neodgovarajuće potpore ili prijevoza</li>
    <li>Oštećenja zbog nepravilnog napuhivanja/ispuhivanja ili upotrebe neodobrenih uređaja za napuhivanje</li>
    <li>Oprema, komponente ili sustavi trećih strana (pokriveni jamstvima njihovih proizvođača)</li>
  </ul>

  <h2>Obveza i pravni lijek proizvođača</h2>
  <p>Jedina i isključiva obveza afarera jest popravak ili zamjena, po izboru afarera, svake komponente za koju se utvrdi da ima grešku u materijalima ili izradi te da je pokrivena ovim jamstvom. Popravke ili zamjene obavljaju afarer ili njegova određena ovlaštena servisna ustanova. Popravljene ili zamijenjene komponente pokrivene su jamstvom samo za neistekli dio izvornog jamstvenog razdoblja.</p>

  <h2>Uvjeti jamstva</h2>
  <ul>
    <li><strong>Registracija:</strong> Proizvod mora biti pravilno registriran kako je propisano jamstvenim uvjetima.</li>
    <li><strong>Održavanje:</strong> Proizvod se mora održavati u skladu s objavljenim smjernicama afarera, uključujući periodične preglede i održavanje odgovarajućih tlakova napuhivanja.</li>
    <li><strong>Suradnja:</strong> Kupac mora u potpunosti i pravodobno surađivati s afarerom u svim pitanjima koja se odnose na jamstvene zahtjeve.</li>
    <li><strong>Izvorni kupac:</strong> Ovo se jamstvo isključivo pruža izvornom krajnjem kupcu i nije prenosivo.</li>
  </ul>

  <h2>Komercijalna upotreba</h2>
  <p>Ako se proizvod koristi u komercijalne, vladine, neprofitne, plovne, najamne, instrukcijske svrhe ili bilo koju drugu svrhu osim privatne rekreacije, jamstveno razdoblje za sve komponente smanjuje se na jednu (1) godinu od izvornog datuma maloprodajne kupnje. Upotreba u utrkama, brzinskim ili izdržljivosnim natjecanjima odmah i nepovratno ukida jamstvo u cijelosti.</p>

  <h2>Kako podnijeti jamstveni zahtjev</h2>
  <p>Kontaktirajte afarer ili svog ovlaštenog diler s dokazom o kupnji i detaljnim opisom problema. afarer će pregledati zahtjev i dati upute za pregled i servisiranje.</p>
  <p>Za upite o jamstvenom servisu kontaktirajte nas putem naše <a href="/contact" class="text-sky-600 underline">kontakt stranice</a> s vašim brojem narudžbe i podacima o proizvodu.</p>

  <h2>Proizvodi trećih strana</h2>
  <p>Oprema, komponente ili sustavi koje su proizvele treće strane (čak i ako ih je ugradio afarer) isključivo su pokriveni jamstvom koje nudi njihov proizvođač. afarer izričito odbacuje svaku jamstvenu odgovornost za takve proizvode trećih strana.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Ova izjava o jamstvu sažetak je potpunog Ograničenog jamstva proizvođača afarer. Potpuni pravni dokument o jamstvu uređuje sve uvjete i odredbe jamstva. Specifikacije podliježu promjenama bez prethodne najave. afarer je brend kojim upravlja Aquafarer LLC (SAD).
  </p>

faqs_sup:
  title: 'Najčešća pitanja o SUP daskama'
  subtitle: 'Česta pitanja o našim daskama za stojeće veslanje.'
  columns: 2
  items:
    - title: 'Koje veličine SUP daska afarer nudi?'
      description: 'Nudimo SUP daske od 9 ft do 12 ft, koje pokrivaju sve — od kompaktnih all-around daska do touring i specijalnih dizajna. Svaki je model dostupan s više opcija konfiguracije.'
    - title: 'Koja je razlika između napuhive SUP daske i tvrde SUP daske?'
      description: 'Napuhiva SUP daska koristi drop-stitch konstrukciju s tisućama unutarnjih niti koje omogućuju visok tlak zraka, dok tvrda SUP daska koristi epoksidnu smolu ili stakloplastiku. Napuhive SUP daske nude prenosivost i praktičnost skladištenja bez odustajanja od krutosti.'
    - title: 'Koliko je ograničenje težine za SUP daske?'
      description: 'Naše SUP daske nose do 150 kg ovisno o modelu i volumenu. Svaka stranica proizvoda navodi najveću dopuštenu nosivost za vaš konkretni model.'
    - title: 'Imaju li afarer SUP daske CE certifikat?'
      description: 'Da. Svi rekreativni SUP modeli imaju CE certifikat u skladu s primjenjivim europskim standardima za rekreativnu upotrebu.'
    - title: 'Koliko traje jamstvo na SUP daske?'
      description: 'Sve afarer SUP daske dolaze sa standardnim jednogodišnjim jamstvom protiv proizvodnih grešaka, koje pokriva otkaz šava, greške ventila i odvajanje materijala pri normalnoj upotrebi.'
    - title: 'Koliko vremena treba za napuhivanje SUP daske?'
      description: 'Priloženom ručnom pumpom potpuno napuhivanje na 15 PSI traje otprilike 8–12 minuta. Za brže napuhivanje preporučujemo našu afarer 12V električnu pumpu koja napuše dasku za manje od 4 minute.'

faqs_materials:
  title: 'Najčešća pitanja o materijalima za SUP'
  subtitle: 'Česta pitanja o materijalima, njezi i skladištenju naših napuhivih SUP daska.'
  columns: 2
  items:
    - title: 'Od kojih su materijala izrađene afarer napuhive SUP daske?'
      description: 'Koristimo vojnički razred PVC-a (1100 denier) s UV-stabiliziranom konstrukcijom otpornom na habanje, u skladu s propisima EU REACH i RoHS.'
    - title: 'Koliko dugo traju napuhive SUP daske?'
      description: 'Uz pravilnu njegu kvalitetna PVC napuhiva SUP daska traje 5–10 godina. Redovito čišćenje, zaštita od UV zračenja i pravilno skladištenje znatno produljuju vijek trajanja.'
    - title: 'Koje održavanje zahtijeva napuhiva SUP daska?'
      description: 'Osnovno održavanje uključuje ispiranje slatkom vodom nakon svake upotrebe (posebno u slanoj vodi), sušenje prije skladištenja, godišnju provjeru brtvi ventila te izbjegavanje dulje izloženosti suncu kad se daska ne koristi.'
    - title: 'Mogu li se napuhive SUP daske koristiti u slanoj vodi?'
      description: 'Da. Sve su afarer napuhive SUP daske dizajnirane i za slatku i za slanu vodu. Preporučujemo ispiranje slatkom vodom i temeljito sušenje nakon izloženosti slanoj vodi.'
    - title: 'Kako skladištiti napuhivu SUP dasku?'
      description: 'Ispuhajte, očistite i potpuno osušite dasku prije skladištenja. Namotajte je labavo (izbjegavajte čvrste nabore), čuvajte na hladnom i suhom mjestu dalje od izravnog sunca i držite je podalje od betonskih podova kako biste spriječili navlačenje vlage.'
    - title: 'Kolika je nosivost afarer napuhivih SUP daska?'
      description: 'Nosivost se kreće od 100 kg za naše najmanje modele do više od 200 kg za veće daske. Svaka stranica proizvoda navodi najveću dopuštenu nosivost za vaš konkretni model.'


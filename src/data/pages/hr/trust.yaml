warranty_section:
  title: 'Jamstvo i podrška nakon prodaje'
  subtitle: 'Stojimo iza svakog proizvoda s jasnim jamstvenim uvjetima, brzom obradom reklamacija i originalnim rezervnim dijelovima.'
  items:
    - title: 'Dvogodišnje jamstvo na proizvod'
      desc: 'Svi afarer proizvodi imaju 2-godišnje jamstvo protiv proizvodnih grešaka — otkaz šava, greške ventila i odvajanje materijala pri normalnoj upotrebi.'
    - title: 'Doživotna podrška za dijelove'
      desc: 'Originalni rezervni dijelovi — ventili, setovi za popravak, peraje, D-prstenovi — dostupni su za sve modele. Kalupe i alate održavamo najmanje 5 godina nakon završetka proizvodnje.'
    - title: 'Odgovor na reklamaciju u 48 sati'
      desc: 'Potvrda primitka jamstvenih reklamacija u roku od 48 sati. Zamjenske daske za odobrene reklamacije šalju se u roku od 10 radnih dana.'
    - title: 'Globalna mreža servisa'
      desc: 'Ovlašteni servisni centri u više od 15 zemalja. Setovi za popravak na terenu dostupni su za udaljene operacije. Vodiči za samostalan popravak za manja oštećenja.'
    - title: 'OEM podrška kupcima'
      desc: 'Posvećeni voditelji računa za B2B partnere. Kvartalni poslovni pregledi, planiranje zaliha i podrška zajedničkom brendiranju u marketingu.'
    - title: 'Paket certifikata'
      desc: 'Kompletna dokumentacija o sukladnosti dostavlja se uz svaku pošiljku — CE deklaracija, izvještaji o ispitivanjima, sigurnosno-tehnički listovi materijala.'
      link: '/contact/'


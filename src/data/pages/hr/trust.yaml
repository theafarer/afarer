features3_certifications:
  title: 'Certifikati i sukladnost'
  subtitle: 'Svaki je proizvod neovisno testiran i certificiran prema međunarodnim standardima.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'CE certifikacija'
      description: 'Sve afarer SUP daske ispunjavaju europski standard sigurnosti CE za rekreativnu upotrebu. Svaki proizvod prije izlaska iz tvornice prolazi ispitivanje tlaka, plovnosti i nosivosti.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'Naš pogon u Qingdaou površine 12,000 m² posluje u okviru sustava upravljanja kvalitetom ISO 9001. Svaka je proizvodna serija sljediva, dokumentirana i kontrolirana.'
      icon: 'tabler:clipboard-check'
    - title: 'BSCI društvena odgovornost'
      description: 'Posjedujemo BSCI certifikat koji osigurava etične radne prakse, sigurne radne uvjete i odgovornost prema okolišu u cijelom našem lancu dobave.'
      icon: 'tabler:users'
    - title: 'REACH i RoHS'
      description: 'Svi materijali — PVC, EVA pjena, ljepila — u skladu su s propisima EU REACH i RoHS. Bez ograničenih tvari, bez kompromisa.'
      icon: 'tabler:flask'
    - title: 'Laboratorij za ispitivanje materijala'
      description: 'Interni laboratorij za materijale testira vlačnu čvrstoću, otpornost na UV zračenje, integritet šavova i otpornost na habanje za svaku seriju tkanine prije proizvodnje.'
      icon: 'tabler:microscope'
    - title: 'Dvogodišnje jamstvo'
      description: 'Svaki afarer proizvod dolazi s dvogodišnjim jamstvom protiv proizvodnih grešaka. Stojimo iza svega što izradimo.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'Povjerenje kupaca'
  title: 'Što kažu naši kupci'
  subtitle: 'Od početnika u veslanju do profesionalnih operatera flota — saznajte zašto vjeruju afareru.'
  items:
    - content: 'Cijelu smo najamnu flotu opremili afarer SUP daskama. Nakon dvije sezone, nula kvarova. CE certifikacija učinila je odobrenje osiguranja jednostavnim.'
      name: 'Marco V.'
      title: 'Turistički operater, Hrvatska'
    - content: 'Kao kupac početnik, brinula sam se zbog kvalitete. ISO dokumentacija i izvještaji o ispitivanjima koje su podijelili potpuno su mi dali povjerenje.'
      name: 'James T.'
      title: 'Vlasnik SUP Explorer 11, Kanada'
    - content: 'Sa afarerom surađujemo za naše obalne patrolne jedinice. Njihov je proces kontrole kvalitete dosljedan u svakoj seriji — ta se pouzdanost cijeni u operacijama kritičnima po sigurnost.'
      name: 'Lt. Cmdr. Andres'
      title: 'Vladina nabava, Filipini'

steps2_manufacturing:
  title: 'Kako osiguravamo kvalitetu'
  subtitle: 'Od kontrole sirovina do završnog ispitivanja tlaka — svaki proizvod prolazi kroz strog lanac kvalitete.'
  items:
    - title: 'Kontrola sirovina'
      description: 'Svaka se rola PVC tkanine prije ulaska u proizvodnju testira na debljinu, vlačnu čvrstoću i otpornost na UV zračenje.'
      icon: 'tabler:search'
    - title: 'Kontrola tijekom proizvodnje'
      description: 'Zavareni šavovi, ugradnja ventila i spajanje komora kontroliraju se na svakoj stanici tijekom montaže.'
      icon: 'tabler:eye'
    - title: 'Ispitivanje tlaka'
      description: 'Svaki se napuhivi proizvod napuhuje na 1,25x nazivnog PSI i drži 24–48 sati radi provjere zadržavanja zraka i integriteta šavova.'
      icon: 'tabler:wind'
    - title: 'Završna kontrola'
      description: 'Svaka se jedinica prije odobrenja za otpremu kontrolira po završnoj obradi, hardveru i pakiranju. Uzorci serija odlaze u naš laboratorij na destruktivna ispitivanja.'
      icon: 'tabler:clipboard-check'


meta:
  title: 'Tvornička oprema — Rezanje, RF zavarivanje i tisak | {SITE}'
  description: 'Industrijska afarer proizvodna oprema: rezanje PVC-a, RF zavarivanje, digitalni tisak, montaža i ispitivanje napuhivih SUP daska.'
  keywords:
    - 'oprema za proizvodnju sup daska'
    - 'tvornica napuhivih sup daska'
    - 'rf zavarivanje pvc-a'
    - 'proizvodnja daska za veslanje'
hero:
  tagline: 'Oprema'
  title: 'Proizvodna oprema i strojevi'
  subtitle: 'Industrijska oprema za rezanje, zavarivanje, tisak i montažu'
  back_label: 'Natrag na tvornicu'
  back_link: /factory/

categories:
  - title: 'Rezanje i priprema materijala'
    items:
      - name: 'Automatski stroj za rezanje PVC-a'
        spec: 'CNC kontrolirano, 6,5 m × 2,5 m, točnost 0,1 mm'
        desc: 'Računalno kontrolirani automatski stroj za rezanje PVC-a i drop-stitch tkanina. Softver za slaganje optimizira iskorištenje materijala na manje od 5% otpada.'
      - name: 'Raspoređivač tkanine'
        spec: 'Maksimalna širina 3 m, napoj s kontrolom napetosti'
        desc: 'Postavlja tkaninu u jednom ili više slojeva s kontroliranom napetošću kako bi se spriječilo deformiranje prije rezanja.'

  - title: 'Zavarivanje i spajanje cijevi'
    items:
      - name: 'Stroj za toplinsko brtvljenje'
        spec: 'Zavarivanje vrućim zrakom, podesivo 200–600 °C, 0,5–5 m/min'
        desc: 'Stroj za toplinsko brtvljenje vrućim zrakom za spajanje i zavarivanje PVC-a i šavova rubova. Koristi se za privremeno spajanje, brtvljenje i spajanje komora cijevi i spojeva plovnih tijela.'
      - name: 'Dielektrična RF preša'
        spec: '15 kW, ploča 2000 × 600 mm'
        desc: 'Preša za zavarivanje radio-frekvencijom za glavne uzdužne šavove, trake rubova i izradu velikih komora.'
      - name: 'CNC kontrolirani RF zavarivač'
        spec: '8 kW, XY stol 2500 × 1200 mm'
        desc: 'Programabilno zavarivanje zakrivljenih šavova za složene geometrije, reljefiranje logotipa i precizne zakrpe.'

  - title: 'Proizvodnja SUP daska'
    items:
      - name: 'Preša za laminaciju drop-stitch jezgri'
        spec: 'Preša velikog formata za jezgre daska do 14 ft LOA'
        desc: 'Precizna laminacija drop-stitch jezgri na vanjske PVC laminatne slojeve. Svaki se sloj spaja pod tlakom radi dosljedne kvalitete i čvrstoće.'
      - name: 'CNC glodalica (5-osna)'
        spec: 'Radni prostor 3 m × 2 m × 1 m, vodom hlađeno vreteno'
        desc: 'Obrada ležišta peraja, izreza za ručke i prilagođenih komponenata daska.'

  - title: 'Tisak i dekoracija SUP daska'
    items:
      - name: 'Digitalni pisač'
        spec: 'Inkjet visoke rezolucije, širina tiska do 2 m'
        desc: 'Digitalni tisak izravno na tkaninu za punodužne grafike u punoj boji na SUP daskama. Ispisuje prilagođene uzorke, prijelaze i fotografije fotografske kvalitete UV-otpornim tintama na bazi vode.'
      - name: 'Stroj za sitotisak'
        spec: 'Ručni i poluautomatski, višebojno poravnanje'
        desc: 'Sitotisak za logotipe na SUP daskama, znakove brenda i ponavljajuće uzorke. Pruža trajne, neprozirne otiske s živom zasićenošću boja.'

  - title: 'Montaža i opremanje'
    items:
      - name: 'Stanica za montažu daska'
        spec: 'Modularno podesiva, višestanični raspored'
        desc: 'Montaža ležišta peraja, ručki, D-prstenova, ventila i podloga na SUP daske.'
      - name: 'Preša za ugradnju ventila'
        spec: 'Pneumatska, podesiv tlak'
        desc: 'Precizna ugradnja i brtvljenje Halkey-Roberts i Leafield ventila.'
      - name: 'Laminator podloga'
        spec: '3 m × 1,5 m, kontrola temperature'
        desc: 'Toplinska laminacija EVA pjenastih podloga na gornje strane SUP daska s dosljednom čvrstoćom spajanja.'

  - title: 'Ispitivanje i kontrola kvalitete'
    items:
      - name: 'Univerzalni ispitivač vlačne čvrstoće'
        spec: '50 kN, ASTM D751'
        desc: 'Ispitivanje sile kidanja, izduženja pri kidanju i širenja suza za serije tkanina.'
      - name: 'Ispitni uređaj za zadržavanje zraka'
        spec: 'Programabilan, zadržavanje tlaka 30 min'
        desc: 'Automatizirani test zadržavanja tlaka za svaku komoru cijevi prije montaže.'
      - name: 'Ispitivač ljuštenja šavova'
        spec: 'Motorizirano ljuštenje 180° pri 100 mm/min'
        desc: 'Ispitivanje čvrstoće ljuštenja zavarenih i lijepljenih šavova prema EN ISO 25649.'
      - name: 'Komora za starenje s ksenonskim lukom'
        spec: 'Izloženost 2000 h'
        desc: 'Ispitivanje UV otpornosti na promjenu boje i zadržavanje čvrstoće.'

cta:
  title: 'Zanima li vas obilazak tvornice?'
  desc: 'Rado primamo posjetitelje u našem pogonu u Qingdaou. Pogledajte našu opremu i procese uživo.'

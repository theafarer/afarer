content_html: |
  <h2>Što je drop stitch?</h2>
  <p>Drop stitch (nazivan i "drop-stitch tkanina" ili "drop-stitch jezgra") metoda je konstrukcije u kojoj tisuće pojedinačnih poliesterskih niti povezuju gornji i donji sloj tkaninske ljuske. Kada se ljuska napuhuje, te niti djeluju kao unutarnji elementi za vlačno naprezanje — sprječavaju da se gornji i donji panel ispupče prema van u okrugli oblik, tjerajući ploču da ostane ravna i kruta.</p>
  <p>Rezultat je lagana, prenosiva konstrukcija koja može izdržati 15 – 20 PSI unutarnjeg tlaka — usporedivo s krutošću daske s tvrdim trupom, ali potpuno ispuhljiva za skladištenje i transport.</p>

  <h2>Kako radi: fizika</h2>
  <p>U konvencionalnoj napuhivoj konstrukciji (poput balona ili zračnog madraca) unutarnji tlak zraka gurpa jednako u svim smjerovima. Bez unutarnjeg zadržavanja konstrukcija postaje cilindrična ili kuglasta. Drop stitch to rješava uvođenjem vlačnog ojačanja:</p>
  <ul>
    <li>Tisuće niti povezuje gornji i donji sloj tkanine</li>
    <li>Pri napuhivanju tlak zraka pokušava razdvojiti gornji i donji sloj</li>
    <li>Niti se odupiru tom razdvajanju, prenoseći opterećenje u vlakno duž osi niti</li>
    <li>Rezultat je ravna, kruta ploča koja se opire savijanju</li>
  </ul>

  <h2>Proces konstrukcije</h2>
  <ol>
    <li><strong>Tkanje:</strong> Poliesterske niti istovremeno se tkaju u dva odvojena sloja osnovne tkanine (tipično 1,100 DTEX ili 1,680 DTEX PVC presvučeni poliestar). Niti se tkaju u petlje između slojeva pod kutom od 90&deg;.</li>
    <li><strong>Presvlačenje:</strong> Tkana osnovna tkanina presvlači se PVC-om (ili povremeno TPU-om) pomoću postupka presvlačenja nožem ili kalendarskog presvlačenja. To brtvi niti i stvara nepropusnu membranu.</li>
    <li><strong>Spajanje slojeva:</strong> Drop-stitch jezgra spaja se s vanjskim laminiranim slojevima (tipično 0,9 mm ili 1,2 mm PVC) pomoću toplinskog laminiranja ili ljepila.</li>
    <li><strong>Zavarivanje:</strong> Trake rubova zavaruju se duž rubova pomoću zavarivanja vrućim zrakom, RF zavarivanja ili zavarivanja visoke frekvencije kako bi se stvorile bočne stijenke daske.</li>
    <li><strong>Ugradnja ventila:</strong> Ugrađuju se Boston ventili ili Halkey-Roberts ventili, tipično s mehanizmom za otpuštanje tlaka kako bi se spriječilo prekomjerno napuhivanje.</li>
  </ol>

  <h2>Ključni pokazatelji kvalitete</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parametar</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Ulazna razina</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Gustoća niti</td><td class="p-3 border">1 nit / kv in</td><td class="p-3 border">2 niti / kv in</td></tr>
      <tr><td class="p-3 border">Osnovna tkanina</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Maksimalni tlak</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Debljina PVC-a</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 border">Konstrukcija ruba</td><td class="p-3 border">Presavijeno i lijepljeno</td><td class="p-3 border">Zavareno i fuzijski spojeno</td></tr>
    </tbody>
  </table>

  <h2>Primjene</h2>
  <ul>
    <li><strong>SUP daske:</strong> debljina 4" – 6", 15 – 20 PSI, 1 – 2 niti/kv in</li>
    <li><strong>Kajaci:</strong> Drop-stitch pod + napuhive bočne komore, 10 – 15 PSI poda</li>
  </ul>

  <h2>Drop stitch vs. zračna paluba (jezgra od stakloplastike ili drveta)</h2>
  <p>Daske s tvrdim trupom koriste EPS pjena jezgre s ojačanjem od stakloplastike ili drvenih uzdužnica. Lakše su, kruće i odzivnije — ali se ne mogu ispuhati. Drop stitch zamjenjuje dio krutosti za potpunu prenosivost. Za većinu rekreativnih korisnika moderne drop-stitch SUP daske pri 20 PSI ne razlikuju se u krutosti od ulaznih tvrdih daska.</p>

  <h2>Kako Afarer koristi drop stitch</h2>
  <p>Afarer koristi 1,680 DTEX drop-stitch jezgru u cijeloj svojoj SUP ponudi, s 2 niti po kvadratnom inču i 1,2 mm vanjskim PVC laminatom. Daske su ocijenjene na 20 PSI i prije otpreme prolaze ispitivanje zadržavanja tlaka 24–48 sati pri 1,25x nazivnog tlaka. Trake rubova zavarene su vrućim zrakom s trostrukim fuzijskim slojem, a ventili za otpuštanje tlaka standardni su na svim modelima.</p>


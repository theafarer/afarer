meta:
  title: 'Partneri — Distribucija i veleprodaja | {SITE}'
  description: 'Postanite afarer partner: distribucijske mreže, veleprodajne cijene, OEM/private-label programi i podrška za tvrtke u daskama za veslanje širom svijeta.'
  keywords:
    - 'partner za distribuciju sup daska'
    - 'veleprodaja daska za veslanje'
    - 'distributer napuhivih sup daska'
    - 'sup partnerstvo'
hero:
  tagline: 'Partneri i distribucija'
  title: 'Postanite afarer partner<br />— Globalna distribucijska mreža'
  subtitle: 'Pridružite se afarerovoj globalnoj mreži partnera. Suradujemo s pomorskim distributerima, dilerima veslačke opreme, maloprodavačima opreme i partnerima brendova u više od 50 zemalja.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: 'afarer globalna mreža partnera i distributera'
content_programs:
  tagline: 'Partnerski programi'
  title: 'Partnerski programi<br />izgrađeni za rast'
  subtitle: 'Bilo da ste distributer, diler ili partner brenda, afarer nudi programe dizajnirane za podršku vašem poslovanju.'
  columns: 3
  items:
    - title: 'Program za distributere'
      description: 'Ekskluzivna teritorijalna distribucija s cijenama po količini, marketinškom podrškom i izravnim pristupom tvornici. Potrebna je minimalna obveza ovisno o veličini teritorija.'
      icon: tabler:world
    - title: 'Program za dilere'
      description: 'Izravne diler cijene, obuka o proizvodima, marketinški materijali i jamstvena podrška za maloprodajne lokacije i mrežne trgovine.'
      icon: tabler:building-store
    - title: 'OEM/ODM partnerstvo'
      description: 'Sveobuhvatna OEM i ODM proizvodnja s brendiranjem po mjeri, pakiranjem i specifikacijama proizvoda. Od koncepta do kontejnera.'
      icon: tabler:certificate
    - title: 'Partnerstvo brendova'
      description: 'Zajedničko brendiranje, privatne oznake i programi ekskluzivnih modela za etablirane brendove u pomorskoj i outdoor rekreaciji.'
      icon: tabler:stars
    - title: 'Vladin i institucionalni program'
      description: 'Programi preferiranog dobavljača za vladine agencije, obalne straže, vojsku i humanitarne organizacije. Dokumentacija spremna za natječaje.'
      icon: tabler:building-community
    - title: 'Partner odmarališta i najma'
      description: 'Cijene za flote, dosljedna kvaliteta i brendiranje po mjeri za odmarališta, ronilačke centre i najamne operacije širom svijeta.'
      icon: tabler:sun
content_benefits:
  tagline: 'Zašto partnerstvo s nama'
  title: 'Zašto partneri odabiru afarer'
  subtitle: 'Naši partneri imaju koristi od stvarnih proizvodnih mogućnosti, dosljedne kvalitete i odzivne podrške.'
  list:
    - 'Izravan pristup tvornici: Radite izravno s našim proizvodnim timom — bez posrednika. Dobijte brže odgovore, bolje cijene i potpunu vidljivost proizvodnje.'
    - 'Spremnost za prilagodbu: Brendirajte svoje proizvode prilagođenim bojama, logotipima, pakiranjem i specifikacijama. Minimalne količine narudžbe prilagođene vašem tržištu.'
    - 'Garantirana kvaliteta: ISO 9001 certificirana proizvodnja s CE, UKCA i BSCI sukladnošću. Svaki proizvod testiran prije otpreme.'
    - 'Globalna logistika: Otprema iz Qingdaoa u Kini s FOB, CIF i DDP opcijama. Američko skladište u Montclairu, CA za distribuciju u Sjevernoj Americi.'
    - 'Marketinška podrška: Katalozi proizvoda, fotografije, tehnička dokumentacija i digitalni materijali za podršku vašim prodajnim naporima.'
    - 'Obuka i podrška: Obuka o proizvodima za vaš prodajni tim, tehnička podrška za vaše kupce i koordinacija jamstvenog servisa.'
content_process:
  tagline: 'Kako postati partner'
  title: 'Jednostavan proces partnerstva'
  subtitle: 'Naš proces partnerstva jednostavan je i dizajniran da brzo počnete prodavati afarer proizvode.'
  items:
    - title: 'Korak 1: Podnesite prijavu'
      description: 'Ispunite naš obrazac za prijavu partnera s profilom vaše tvrtke, ciljnim tržištem i interesima za proizvode.'
    - title: 'Korak 2: Pregled kvalifikacija'
      description: 'Naš tim za partnerstva pregledava vašu prijavu i kontaktira vas u roku od 3 radna dana kako bi razgovarao o prilikama.'
    - title: 'Korak 3: Ugovor i postavljanje'
      description: 'Potpišite ugovor o partnerstvu, otvorite svoj račun i primite partnerske cijene, marketinške materijale i uzorke proizvoda.'
    - title: 'Korak 4: Obuka i lansiranje'
      description: 'Omogućuju se obuka o proizvodima, prodajna podrška i marketinški materijali. Spremni ste za početak prodaje.'
cta:
  title: 'Spremni postati afarer partner?'
  subtitle: 'Prijavite se za partnerstvo, a naš tim će odgovoriti u roku od 3 radna dana.'
  actions:

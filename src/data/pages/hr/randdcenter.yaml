rd_services:
  tagline: 'Prilagođeni R&D'
  title: 'Usluge istraživanja i razvoja za partnere'
  services:
    - title: 'Razvoj prilagođenih materijala'
      desc: 'Razvijamo prilagođene formulacije tkanina, slojeve laminata i sustave ljepila prilagođene vašem radnom okruženju i ciljevima performansi.'
    - title: 'OEM / ODM proizvodno inženjerstvo'
      desc: 'Razvijamo prilagođene formulacije tkanina, slojeve laminata i sustave ljepila prilagođene vašem radnom okruženju i ciljevima performansi.'
    - title: 'Ispitivanje i certificiranje treće strane'
      desc: 'Koristite naše ispitne objekte u skladu s ISO standardima za neovisna ispitivanja materijala, potvrdu proizvoda i podršku pri certificiranju.'
  cta: 'Raspravite o svojim R&D zahtjevima →'
  cta_link: /contact/

vision:
  tagline: 'Naša vizija'
  title: 'Oblikovanje budućnosti vodenih sportova'
  body: 'afarer teži vodstvu u industriji napuhivih SUP dasaka kroz neprestane inovacije, nepokolebljivu kvalitetu i postojanu predanost sigurnosti i održivosti — čime u konačnici obogaćuje doživljaje ljubitelja vodenih sportova diljem svijeta. afarerov Centar za istraživanje i razvoj mjesto je gdje se strast susreće s inovacijom, postavljajući nove standarde za industriju vodenih sportova.'

labs_section:
  tagline: 'Laboratoriji'
  title: 'Naši laboratoriji'
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: 'Laboratorij za PVC tkanine'
      description: 'Neprekidno istraživanje i ispitivanje PVC tkanina za palube na vlačnu čvrstoću, otpornost na UV zračenje, abraziju i savitljivost pri niskim temperaturama radi dugotrajne pouzdanosti u pomorskim okruženjima.'
      href: /randdcenter/pvc-fabric-lab/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 'Studio za inženjerstvo trupova'
      description: 'CAD dizajn i analiza konačnih elemenata trupova od HDPE-a, aluminija i stakloplastike. Svaki se trup digitalno simulira na raspodjelu naprezanja i otpornost na udarce prije izrade prvog prototipa.'
      href: /randdcenter/hull-engineering/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: 'Centar za RF zavarivanje'
      description: 'Namjenski objekt za zavarivanje radiofrekvencijom s preciznom kontrolom temperature i tlaka, koji proizvodi visokočvrste nepropusne šavove u skladu sa standardima pomorske industrije za napuhiva plovila.'
      href: /randdcenter/rf-welding/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 'Hidrodinamički ispitni bazen'
      description: 'Ispitivanje modela u smanjenom mjerilu u našem vlastitom ispitnom bazenu radi optimizacije oblika trupa, performansi glisanja, stabilnosti i učinkovitosti goriva u rasponu uvjeta opterećenja i mora.'
      href: /randdcenter/hydrodynamic-test-tank/
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: 'Radionica prototipova'
      description: 'Objekt za izradu prototipova i opremanje u punoj veličini u kojem se novi modeli izrađuju, opremaju i iskušavaju na moru. Svaki prototip prolazi minimalno 20-satni ispitni program u vodi prije odobrenja proizvodnje.'
      href: /randdcenter/prototype-workshop/
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 'Laboratorij kvalitete i kontrole'
      description: 'Namjenski laboratorij osiguravanja kvalitete koji provodi ispitivanja vlačne čvrstoće, cikluse zadržavanja zraka, ispitivanja odvajanja šavova i certificiranje materijala kako bi se osiguralo da svaka daska koja napusti radionicu ispunjava naše objavljene specifikacije.'
      href: /randdcenter/quality-inspection-lab/

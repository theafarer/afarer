meta:
  title: 'Centar za razvoj i istraživanje | {SITE}'
  description: 'Istraživanje i razvoj — ispitivanje PVC tkanina, inženjerstvo trupova, RF zavarivanje, hidrodinamička ispitivanja i kontrola kvalitete. Dostupne su prilagođene usluge istraživanja i razvoja.'

hero:
  tagline: 'Centar za razvoj i istraživanje'
  title: 'Centar za razvoj i istraživanje'
  subtitle: 'Usredotočeni na napredak'

intro:
  - 'afarerov Centar za istraživanje i razvoj (R&D) pokretačka je snaga naše misije revolucioniranja opreme za vodene sportove. Neprestanim inoviranjem u području napuhivih daska za stand up paddleboarding (SUP) omogućujemo ljubiteljima vodenih sportova diljem svijeta sigurnije, udobnije i zabavnije proizvode. Naš predani tim inženjera, dizajnera i strastvenih stručnjaka za vodene sportove oblikuje budućnost industrije, neprestano podižući ljestvicu kvalitete, performansi i održivosti.'
  - 'Naš objekt za istraživanje i razvoj okuplja znanstvenike u području materijala, pomorske inženjere i proizvodne inženjere pod jednim krovom. Od formulacije tkanina i simulacije trupa do razvoja postupka zavarivanja i ispitivanja na punom mjerilu u stvarnim uvjetima mora, svaku fazu razvoja proizvoda pokreću podaci, a potvrđuju je ispitivanja.'

mission:
  tagline: 'Naša misija'
  title: 'Inoviranje budućnosti vodenih sportova'
  pillars:
    - icon: lightning
      title: 'Tehnološki napredak'
      desc: 'Pionirski rad na novim materijalima, dizajnu i proizvodnji radi vrhunskih performansi i dugotrajnosti proizvoda.'
    - icon: design
      title: 'Dizajn usmjeren na korisnika'
      desc: 'Duboko razumijevanje i premašivanje korisničkih potreba ergonomskim i intuitivnim dizajnom proizvoda.'
    - icon: globe
      title: 'Održive prakse'
      desc: 'Smanjenje našeg utjecaja na okoliš korištenjem ekološki prihvatljivih materijala i postupaka.'
    - icon: shield
      title: 'Nekompromisna sigurnost'
      desc: 'Osiguravanje najviših sigurnosnih standarda strogim ispitivanjem i certificiranjem.'

pillars:
  - title: 'Tehnološki napredak'
    desc: 'Pionirski rad na novim materijalima, dizajnu i proizvodnim postupcima radi vrhunskih performansi i dugotrajnosti proizvoda.'
    icon: tech
  - title: 'Napredni materijali'
    desc: 'Istraživanje najsuvremenijih PVC materijala, kompozita i održivih alternativa za poboljšane značajke proizvoda.'
    icon: materials
  - title: 'Održivost'
    desc: 'Temeljna predanost: Posvećeni smo skrbi za okoliš kroz održivu proizvodnju i reciklabilne materijale.'
    icon: sustainability

capabilities:
  tagline: 'Mogućnosti'
  title: 'Mogućnosti istraživanja i razvoja'
  subtitle: 'Četiri temeljne discipline koje nam daju potpunu kontrolu nad razvojem proizvoda — od istraživanja sirovina do završne certifikacije.'
  groups:
    - title: 'Znanost o materijalima i tehnologija tkanina'
      items:
        - 'Analiza i optimizacija formulacije PVC-a'
        - 'Razvoj UV stabilizacije, usporivača gorenja i antimikrobnih aditiva'
        - 'Višeslojna laminacija tkanina i inženjerstvo prianjanja'
        - 'Ubrzana ispitivanja starenja (UV, toplinska, vlažnost, slana magla)'
    - title: 'Inženjerstvo trupova i hidrodinamika'
      items:
        - 'Parametarski 3D dizajn trupa i CFD optimizacija'
        - 'Analiza konačnih elemenata za strukturna i udarna opterećenja'
        - 'Ispitivanje vuče modela u smanjenom mjerilu i potvrda performansi'
        - 'Razvoj prilagođenih trupova za posebne profile misija'
    - title: 'Tehnologija zavarivanja i spajanja'
      items:
        - 'Razvoj i optimizacija postupka RF dielektričkog zavarivanja'
        - 'Metode zavarivanja vrućim zrakom, vrućim klinom i ultrazvukom'
        - 'Lijepljenje adhezivima i kvalifikacija traka za šavove'
        - 'Modeliranje čvrstoće zavara i predviđanje vijeka trajanja'
    - title: 'Ispitivanje, certificiranje i usklađenost'
      items:
        - 'Upravljanje kvalitetom i ispitivanje usklađenosti s CE-om'
        - 'Neovisna ispitivanja treće strane i podrška pri certificiranju'
        - 'Razvoj prilagođenih ispitnih protokola za kvalifikaciju u nabavi'
        - 'Analiza kvarova u upotrebi i istraživanje korijenskih uzroka'


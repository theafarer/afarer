content_html: |
  <h2>1. Predkvalifikacija: što tražiti u tvornici</h2>

  <h3>Certifikati usklađenosti</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Sustav upravljanja kvalitetom</li>
    <li><strong>CE certifikat</strong> – Provjerite broj notificirane instance</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Revizije socijalne usklađenosti</li>
    <li><strong>REACH / RoHS</strong> – Izjave o usklađenosti materijala</li>
  </ul>

  <h3>Proizvodne mogućnosti</h3>
  <ul>
    <li>Vlastito tkanje drop-stitch jezgre naspram outsourcinga</li>
    <li>Linija za PVC premazivanje / laminaciju</li>
    <li>Oprema za RF zavarivanje i zavarivanje vrućim zrakom</li>
    <li>Vlastita izrada kalupa (CNC obrada)</li>
    <li>Ispitni laboratorij (ispitivanje tlaka, UV starenja, vlačne čvrstoće)</li>
  </ul>

  <h3>Provjera iskustva</h3>
  <ul>
    <li>Godina u proizvodnji napuhivih plovila (najmanje 5+ godina)</li>
    <li>Broj inženjera u timu</li>
    <li>Postojeći OEM/ODM klijenti (zatražite reference)</li>
    <li>Izvozna odredišta – jesu li već u otpremi na vaše ciljno tržište?</li>
  </ul>

  <h2>2. Protokoli kontrole kvalitete</h2>
  <p>Ulazna kontrola materijala: vlačna čvrstoća (ASTM D751 ili ISO 1421), otpornost na kidanje (ASTM D2261 ili ISO 4674), čvrstoća prianjanja, sporadične provjere UV starenja.</p>
  <p>Kontrola u procesu: nadzor čvrstoće šavova svakih 50 jedinica, provjera momenta ventila, provjere gustoće drop-stitch niti, dimenzionalne provjere prema CAD crtežima.</p>
  <p>Završni pregled: ispitivanje zadržavanja tlaka na 100% jedinica (24 sata, najviše 5% pada), vizualni pregled, ispitivanje funkcije ventila, ispitivanje slučajnih uzoraka (AQL 2.5 ili 4.0 prema ISO 2859).</p>

  <h2>3. Kontrolni popis dokumentacije o usklađenosti</h2>
  <ul>
    <li>Izjava o sukladnosti (DoC) s pozivom na ispravnu EU direktivu</li>
    <li>CE certifikat notificirane instance</li>
    <li>Ispitno izvješće akreditiranog laboratorija</li>
    <li>Sigurnosno-tehnički listovi materijala (MSDS)</li>
    <li>Izjava o usklađenosti s REACH-om</li>
    <li>Sastavnica materijala sa sljedivošću dobavljača</li>
    <li>Izvješće o pregledu tvornice</li>
  </ul>

  <h2>4. Pregovaranje o MOQ-u</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Vrsta proizvoda</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standardni MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Raspon za pregovor</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP daske</td><td class="p-3 border">50 – 100 jedinica</td><td class="p-3 border">5 – 10 jedinica (probno)</td></tr>
      <tr><td class="p-3 border">Kajaci</td><td class="p-3 border">50 – 100 jedinica</td><td class="p-3 border">5 – 10 jedinica (probno)</td></tr>
      <tr><td class="p-3 border">Napuhive SUP daske</td><td class="p-3 border">50 – 100 jedinica</td><td class="p-3 border">2 – 5 jedinica (probno)</td></tr>
      <tr><td class="p-3 border">Sigurnosna oprema / dodaci</td><td class="p-3 border">200 – 500 jedinica</td><td class="p-3 border">50 – 100 jedinica (probno)</td></tr>
    </tbody>
  </table>

  <h2>5. Logistika i otprema</h2>
  <p>Uobičajeni Incotermsi: <strong>FOB</strong> (Tvornica isporučuje do luke ukrcaja – najčešće), <strong>EXW</strong> (Kupac organizira svu otpremu od vrata tvornice), <strong>CIF</strong> (Tvornica plaća teret i osiguranje do luke odredišta).</p>
  <p>Napuhivi proizvodi su male težine i velikog volumena – volumetrijska težina (DIM) često određuje trošak otpreme. Zatražite pakiranje u vakuumu koje smanjuje volumen za 50–60%. Pomorski teret iz Kine u EU: 25–35 dana; na zapadnu obalu SAD-a: 15–20 dana.</p>

  <h2>6. Česte zamke</h2>
  <ul>
    <li><strong>Bez revizije tvornice:</strong> Uvijek provedite ili naručite reviziju treće strane (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Samo usmene specifikacije:</strong> Detaljni tehnički list specifikacija potpisan od obje strane</li>
    <li><strong>Preskakanje odobrenja uzoraka:</strong> Pisana potvrda uzoraka prije serijske proizvodnje</li>
    <li><strong>Bez kontrole kvalitete tijekom proizvodnje:</strong> Inspekcija treće strane tijekom proizvodnje (DUPRO) i prije otpreme (PSI)</li>
    <li><strong>Zanemarivanje usklađenosti:</strong> Provjerite CE/UKCA certifikaciju prije proizvodnje</li>
  </ul>

  <h2>7. Zašto Afarer</h2>
  <p>Afarer proizvodi OEM/ODM napuhiva plovila od 2012. godine. S objektom od 12,000 m&sup2; certificiranim prema ISO 9001, 25+ inženjera i CE certifikacijom svih linija proizvoda ispunjavamo svaki kriterij iz ovog vodiča. Novim partnerima nudimo probne MOQ-ove i kompletne pakete dokumentacije o usklađenosti.</p>


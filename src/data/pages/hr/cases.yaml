features3_cases:
  tagline: 'Istaknuti slučajevi'
  title: 'Prilagođena rješenja<br />za stvarne izazove'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Flota europskog ronilačkog centra'
      customer: 'BlueMed Diving Centers'
      country: 'Grčka'
      industry: 'Ronjenje i pomorski turizam'
      challenge: 'Bilo je potrebno 12 ronilački konfiguriranih SUP dasaka za lanac ronilačkih centara na više grčkih otoka. Svaka je daska trebala prilagođene nosače opreme, prostor za 8 boca i stabilnu platformu za ulazak ronioca u otvorenu vodu. Flota je morala stići u roku od 60 dana za početak turističke sezone.'
      solution: 'Proizvedeno je 12 modela SUP Voyager Dive s integriranim nosačima opreme, stabilnim platformama i izuzetno širokom drop-stitch izradom za stabilnost pri ukrcajavanju. Svaka je daska nosila grafiku flote naručitelja. Svih 12 dasaka ispitano je na tlak i poslano iz Qingdaoa u roku od 55 dana.'
      product: 'SUP Voyager Dive'
      results: 'Svih je 12 dasaka isporučeno na vrijeme za turističku sezonu. Flota je u svakodnevnoj upotrebi 18+ mjeseci bez ijednog kvara materijala. Naručitelj je u drugoj godini naručio 6 dodatnih jedinica.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive okosnica je naših svakodnevnih ronilačkih operacija. Stabilnost je izvrsna, a raspored prostora za opremu održava palubu čistom i sigurnom za naše goste.'
      icon: tabler:lifebuoy
    - title: 'Program s dvije marke s australskim distributerom'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Australija'
      industry: 'Program partnerstva i zajedničkih marki'
      challenge: 'Australski je distributer trebao liniju SUP dasaka s privatnom markom po konkurentnoj cijeni kako bi se natjecao s kineskim markama izravne prodaje potrošačima. Bilo je potrebno 8 jedinstvenih modela od početničke do napredne razine, s prilagođenom grafikom, prilagođenim pakiranjem i izravnom otpremom u maloprodajne objekte.'
      solution: 'Razvijeno je 8 modela SUP dasaka (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) s ekskluzivnim australskim grafičkim paketom. Prilagođeno maloprodajno pakiranje s QR kodovima koji vode do video vodiča za postavljanje. Logistika izravne otpreme konfigurirana je iz Qingdaoa izravno u australske maloprodaje.'
      product: 'Prilagođena linija SUP dasaka (8 modela)'
      results: 'Od koncepta do prve pošiljke u 90 dana. Maloprodajna stopa prodaje od 85% u prvoj sezoni. Distributer je u drugoj godini proširio partnerstvo na dodatne modele SUP dasaka.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer je isporučio kompletnu liniju SUP dasaka u 90 dana — od početnog dizajna do maloprodajnog prostora. Kvaliteta je ravnopravna markama koje se prodaju po dvostruko višoj cijeni.'
      icon: tabler:currency-dollar
    - title: 'Isporuka spašilačke opreme za Bliski istok'
      customer: 'Nacionalna uprava za civilnu zaštitu'
      country: 'Ujedinjeni Arapski Emirati'
      industry: 'Potraga i spašavanje'
      challenge: 'Organizacija civilne zaštite trebala je 20 patrolnih SUP dasaka spremnih za obalnu potragu i spašavanje, osiguranje luka i odziv na poplave. Bile je potrebne vrlo uočljive daske, kompletna sigurnosna oprema i usklađenost s lokalnim pomorskim propisima.'
      solution: 'Isporučeno je 20 modela SUP Patrol s vrlo uočljivom narančastom drop-stitch izradom, kompletnim sigurnosnim paketima, SOLAS reflektivnom trakom i ojačanom konstrukcijom. Svaka je daska certificirana prema CE-u i ispitana prema primjenjivim standardima. Paket dokumentacije uključivao je certifikate usklađenosti za lokalnu registraciju.'
      product: 'SUP Patrol'
      results: 'Flota je raspoređena na 5 obalnih postaja. Daske rade u ekstremnoj vrućini (45°C+) bez degradacije. Performanse i trajnost premašile su specifikacije.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol premašio je naša operativna zahtjeve. U uvjetima ekstremne vrućine daske nakon 24 mjeseca svakodnevne upotrebe ne pokazuju znakove UV degradacije.'
      icon: tabler:alert-triangle
    - title: 'Europsko partnerstvo s dvije marke'
      customer: 'North Sea Marine Equipment BV'
      country: 'Nizozemska'
      industry: 'Program partnerstva i zajedničkih marki'
      challenge: 'Etabilirana europska pomorska marka željela se proširiti na tržište SUP dasaka bez ulaganja u proizvodne kapacitete. Trebao im je partner za white-label proizvodnju sposoban proizvesti 5 modela SUP dasaka (od 9 do 12 ft) s privatnim brendiranjem, CE certifikatom i ekskluzivnim pravima distribucije u EU-u.'
      solution: 'Sklopljen je white-label proizvodni ugovor za 5 modela SUP dasaka. Svaki je model nosio logotipe i shemu boja naručitelja. Dokumentacija CE certifikata pripremljena je za svaki model. Ekskluzivna prava distribucije u EU-u dodijeljena su uz minimalne obveze narudžbi. Tehnička dokumentacija dostavljena je za lokalnu servisnu mrežu.'
      product: 'Prilagođena linija SUP dasaka (5 modela)'
      results: 'Potpisan je višegodišnji ugovor. Prva proizvodna serija od 50 jedinica poslana je u roku od 75 dana. Marka je lansirana na velikom sajmu uz pozitivan prijam kod trgovaca.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Suradnja s afarer omogućila nam je ulazak na tržište SUP dasaka bez gradnje tvornice — isporučili su kompletno rješenje ključ u ruke s CE certifikatom i dokumentacijom za podršku trgovcima.'
      icon: tabler:building
    - title: 'Flota karipskog odmarališta'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahami'
      industry: 'Pomorski turizam i ugostiteljstvo'
      challenge: 'Luksuzno je odmaralište trebalo kompletnu flotu opreme za vodene sportove za aktivnosti gostiju: 40 SUP dasaka za vođene ture, 20 dodatnih SUP dasaka za istraživanje lagune, 10 SUP dasaka za izlete gostiju, uz dodatnu opremu. Sva je oprema trebala prilagođeno brendiranje odmarališta i morala je biti isporučena prije vrhunca turističke sezone.'
      solution: 'Proizveden je kompletan SUP paket: 40 dasaka SUP Voyager (model All-Around), 20 dasaka SUP Explorer, 10 dasaka SUP Touring, plus spasilački prsluci, vesla, pumpe i kompleti za popravak. Sva je oprema otisnuta s logotipom odmarališta i tropskom shemom boja. Pošiljka u kontejnerima s kompletnim popisom zaliha.'
      product: 'Kompletan SUP paket (70+ jedinica)'
      results: 'Flota je stigla 6 tjedana prije vrhunca sezone. Ocjene zadovoljstva gostiju aktivnostima na vodi porasle su 40% u odnosu na prethodnu godinu. Oprema traje 3 sezone uz samo rutinsko održavanje.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Pristup kompletnog paketa značio je da smo sve što nam je trebalo primili u jednoj pošiljci — daske i oprema brendirani i spremni za upotrebu gostiju. Naši gosti obožavaju kvalitetu opreme.'
      icon: tabler:beach
    - title: 'Ugovor o obalnoj patroli u SAD-u'
      customer: 'Atlantic Coastal Security Agency'
      country: 'Sjedinjene Američke Države'
      industry: 'Pomorska sigurnost i provođenje zakona'
      challenge: 'Američka agencija za obalnu sigurnost trebala je robusne patrolne SUP daske za operacije na otvorenom moru. Bile je potrebne visokoperformantne daske s opremom vojne specifikacije i usklađenost s propisima Obalne straže SAD-a.'
      solution: 'SUP Patrol konstruiran je s ojačanom drop-stitch izradom, vrlo uočljivim shemama boja, nosačima za kriptiranu komunikacijsku opremu i integriranim točkama pričvršćivanja opreme. Daske su ojačane za teške operacije. Dostavljena je dokumentacija o usklađenosti s USCG-om.'
      product: 'SUP Patrol'
      results: 'Agencija je izvijestila o 95% spremnosti misija tijekom prvih 12 mjeseci. Uslijedila je dodatna narudžba za 8 jedinica.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol našim posadama daje performanse potrebne za operacije na otvorenom moru. Ojačana konstrukcija pruža ključnu trajnost bez ugrožavanja upravljivosti.'
      icon: tabler:shield

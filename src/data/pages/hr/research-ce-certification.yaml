content_html: |
  <h2>Što je CE certifikacija?</h2>
  <p>CE oznaka (Conformit&eacute; Europ&eacute;enne) označava da proizvod ispunjava zahtjeve EU u pogledu zdravlja, sigurnosti i okoliša. Za napuhiva plovila relevantni regulatorni okvir ovisi o kategoriji proizvoda.</p>

  <h2>Primjenjive direktive</h2>

  <h3>Direktiva o plovilima za rekreaciju (2013/53/EU)</h3>
  <p>Primarna direktiva za plovila za rekreaciju u EU. Napuhive SUP daske ispod 2,4 m ne ulaze u njezin opseg i umjesto toga certificiraju se prema EN ISO 25649.</p>

  <h3>Uredba o osobnoj zaštitnoj opremi (2016/425)</h3>
  <p>Prsluci za spašavanje, pomagala za plovnost i sigurnosna oprema isporučena s plovilima moraju ispunjavati zahtjeve Uredbe o OZO, uključujući pregled tipa (Modul B) od strane notificiranog tijela i osiguranje kvalitete proizvodnje (Modul D ili E).</p>

  <h2>Proces certifikacije</h2>
  <ol>
    <li>Klasifikacija proizvoda: određivanje kategorije dizajna plovila (A – D prema ISO 8666)</li>
    <li>Primjenjivi standardi: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (pločica proizvođača)</li>
    <li>Priprema tehničke dokumentacije: crteži dizajna, popis materijala, certifikati materijala, procjena rizika</li>
    <li>Ispitivanje tipa: plovnost, stabilnost, nosivost, ispitivanje materijala, čvrstoća šavova, zadržavanje zraka</li>
    <li>Kontrola proizvodnje u tvornici: revizija proizvodnih procesa od strane notificiranog tijela</li>
    <li>Izjava o sukladnosti: proizvođač potpisuje DoC i postavlja CE oznaku</li>
  </ol>

  <h2>Notificirana tijela za napuhiva plovila</h2>
  <p>Uobičajena notificirana tijela uključuju Bureau Veritas (Francuska), DNV GL (Njemačka), RINA (Italija), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Njemačka).</p>

  <h2>Vremenski okvir i troškovi</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Faza</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Trajanje</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tipični trošak (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Priprema tehničke dokumentacije</td><td class="p-3 border">2 – 4 tjedna</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Ispitivanje tipa</td><td class="p-3 border">4 – 8 tjedana</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Revizija tvornice</td><td class="p-3 border">1 – 2 dana (na licu mjesta)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Ukupno (prvi proizvod)</td><td class="p-3 border">8 – 14 tjedana</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Što to znači za kupce</h2>
  <p>Pri kupnji CE certificiranih napuhivih SUP daska uvijek provjerite je li CE oznaka na pločici proizvođača, postoji li važeća DoC, je li naveden broj notificiranog tijela i sadrži li priručnik za vlasnika sigurnosne upute na vašem lokalnom jeziku. Svi Afarer proizvodi imaju CE certifikaciju s punom sljedivosti do izvještaja o revizijama notificiranog tijela.</p>


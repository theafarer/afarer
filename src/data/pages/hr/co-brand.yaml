faqs:
  title: 'Zajedničko brendiranje — najčešća pitanja'
  subtitle: 'Kako funkcionira Afarer zajedničko brendiranje i kako se razlikuje od OEM-a i privatnih oznaka.'
  items:
    - title: 'Je li zajedničko brendiranje isto što i OEM ili privatna oznaka?'
      description: 'Ne. Afarer više ne vodi otvoreni OEM/private-label program. Proizvodi u zajedničkom brendiranju ostaju Afarer proizvodi — dizajnirani, konstruirani, kontrolirani u kvaliteti i podržani Afarer brendom. Vaš identitet pojavljuje se kao zajednički brend, a ne kao neoznačeni proizvod treće strane.'
    - title: 'Tko može započeti projekt zajedničkog brendiranja?'
      description: 'Kvalificirane tvrtke u vodenim sportovima: postojeći partneri po zemljama, veslački klubovi, odmarališta i hoteli, organizatori događaja i zajednice. Pošaljite nam sažetak projekta i potvrđujemo primjenjivost prije početka dizajnerskih radova.'
    - title: 'Hoće li zajedničko brendiranje doći u sukob s mojim distributerom za zemlju?'
      description: 'Ne. Model jedna-zemlja-jedan-distributer ima prednost. Kolekcije u zajedničkom brendiranju koordiniraju se s lokalnim partnerom po zemlji gdje on postoji, tako da se na zaštićenom teritoriju ne pojavljuje nijedan paralelni ili konkurentski brend.'
    - title: 'Kolika je minimalna narudžba za kolekciju u zajedničkom brendiranju?'
      description: 'Pilot kolekcije počinju od 30–50 jedinica. Standardne kolekcije su 50–100 jedinica; velika ili multiregionalna izdanja su 100+ jedinica. Vremenski okviri razvoja po mjeri dogovaraju se po projektu.'
    - title: 'Što pripada Afarer kvaliteti, a što doprinosu partnera?'
      description: 'Afarer je vlasnik dizajna proizvoda, inženjerstva, materijala, konstrukcije, kontrole kvalitete i jamstva. Partneri doprinose konceptom kolekcije, imenovanjem, bojama, grafičkim unosom i izlaskom na tržište. Time se na vodi održava jedan standard kvalitete.'
    - title: 'Kako se prijaviti?'
      description: 'Ispunite upitnik za zajedničko brendiranje sa svojim podacima o tvrtki, tržištu i ideji kolekcije. Pregledavamo podudarnost, a zatim odgovaramo u roku od 3 radna dana s prijedlogom i Ugovorom o projektu zajedničkog brendiranja.'

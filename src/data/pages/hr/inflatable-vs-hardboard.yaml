faqs:
  - question: 'Koja je izdržljivija: napuhiva ili tvrda SUP daska?'
    answer: 'Napuhive SUP daske općenito su izdržljivije jer odolijevaju udubinama, pukotinama i oštećenjima od udaraca koji bi trajno oštetili tvrdu dasku.'
  - question: 'Je li napuhiva SUP daska bolja za početnike?'
    answer: 'Da. Napuhive SUP daske preporučuju se početnicima jer su podložnije oprostu pogrešaka, lakše za transport i manje je vjerojatno da će prouzročiti ozljedu pri padovima.'
  - question: 'Mogu li napuhive SUP daske biti podjednako performantne kao tvrde daske?'
    answer: 'Za rekreativno veslanje i touring napuhive SUP daske dostižu performanse tvrdih daska. Tvrde daske i dalje prednjače u utrkama i naprednom surfanju zbog lakše težine i profinjene fleksibilnosti.'
body: |
  <h2>Ključne razlike</h2>
  <p>Napuhive SUP daske (iSUP) i tvrde daske služe istoj osnovnoj svrsi — stajanju i veslanju na vodi — ali je postižu potpuno različitim metodama konstrukcije. Pravi izbor ovisi o tome kako planirate koristiti dasku.</p>

  <table>
    <tr><th>Čimbenik</th><th>Napuhiva SUP daska</th><th>Tvrda SUP daska</th></tr>
    <tr><td>Konstrukcija</td><td>Drop-stitch PVC, napuhano na 12-15 PSI</td><td>EPS pjena jezgra omotana stakloplastikom ili epoksidom</td></tr>
    <tr><td>Težina</td><td>18-28 lbs (samo daska)</td><td>20-30 lbs (samo daska)</td></tr>
    <tr><td>Veličina pakiranja</td><td>Ruksak (30 x 15 x 10 in)</td><td>Puna duljina (10-14 ft)</td></tr>
    <tr><td>Priprema</td><td>3-5 minuta napuhivanja</td><td>Spremno za upotrebu</td></tr>
    <tr><td>Vijek trajanja</td><td>5-10 godina uz njegu</td><td>3-8 godina (sklone udubinama)</td></tr>
  </table>

  <h2>Prenosivost</h2>
  <p><strong>Napuhiva pobjeđuje.</strong> Ovo je najjasnija prednost. Napuhiva SUP daska pakira se u ruksak koji stane u prtljažnik auta, ormar u stanu ili putnički pretinac zrakoplova. Putnici, stanari stanova i svi bez krovnih nosača ustat će da su napuhive SUP daske daleko praktičnije.</p>
  <p>Tvrde daske zahtijevaju krovni nosač, veliko vozilo ili namjenski prostor za skladištenje. Teško ih je prevoziti i ne mogu se nositi u zrakoplove bez posebnih transportnih kutija.</p>

  <h2>Izdržljivost</h2>
  <p><strong>Napuhiva pobjeđuje.</strong> Napuhive SUP daske izrađene su od vojničkog PVC-a koji odolijeva udarcima, probijanjima i UV oštećenjima. Kada ispustite napuhivu dasku ili udarite o stijenu, ona se odbije. Tvrda bi se daska od istog udarca izbila, napukla ili delaminala.</p>
  <p>Tvrde su daske osjetljivije na svakodnevno trošenje. Jedan pad na beton može uzrokovati trajnu udubinu koja utječe na performanse i prodor vode.</p>

  <h2>Performanse</h2>
  <p><strong>Tvrda daska pobjeđuje na vrhu ponude.</strong> Za rekreativno veslanje i touring pri umjerenim brzinama obje vrste daska imaju slične performanse. Tvrde daske imaju prednost u:</p>
  <ul>
    <li><strong>Brzini</strong> — Tvrde daske su lakše i kruće, što se prevodi u bolje klizanje i veću maksimalnu brzinu</li>
    <li><strong>Surfanju</strong> — Tvrde daske nude odzivnije prijelaze s ruba na rub i bolje performanse na valovima</li>
    <li><strong>Utrkama</strong> — Natjecateljske utrke gotovo isključivo koriste tvrde daske zbog prednosti u težini i krutosti</li>
  </ul>
  <p>Za prosječnog rekreativnog veslača te su razlike u performansama marginalne. Većina veslača neće nadmašiti kvalitetnu napuhivu dasku.</p>

  <h2>Prijateljstvo prema početnicima</h2>
  <p><strong>Napuhiva pobjeđuje.</strong> Napuhive SUP daske lakše su za početnike jer:</p>
  <ul>
    <li>Mekša površina je udobnija i manje je vjerojatno da će prouzročiti ozljedu pri padovima</li>
    <li>Šire i deblje napuhive daske nude više primarne stabilnosti</li>
    <li>Niža početna investicija čini ulaz pristupačnijim</li>
    <li>Lakši transport znači više prilika za veslanje</li>
  </ul>

  <h2>Skladištenje i održavanje</h2>
  <p>Napuhive SUP daske zahtijevaju sušenje i pravilno presavijanje prije skladištenja. Tvrde se daske mogu skladištiti sastavljene, ali im treba zaštita od sunca, topline i udaraca. Obje imaju koristi od ispiranja slatkom vodom nakon upotrebe u slanoj vodi.</p>

  <h2>Preporuka</h2>
  <p><strong>Odaberite napuhivu SUP dasku ako:</strong> Putujete, imate ograničen prostor za skladištenje, veslate rekreativno ili ste početnik. 90% veslača bit će dobro opsluženo kvalitetnom napuhivom daskom.</p>
  <p><strong>Odaberite tvrdu dasku ako:</strong> Utrkujete se natjecateljski, surfate napredne valove ili dajete prednost maksimalnim performansama nad prenosivošću i izdržljivošću.</p>

  <h2>Najčešća pitanja</h2>
  <h3>Koja je izdržljivija: napuhiva ili tvrda SUP daska?</h3>
  <p>Napuhive SUP daske općenito su izdržljivije jer odolijevaju udubinama, pukotinama i oštećenjima od udaraca koji bi trajno oštetili tvrdu dasku.</p>

  <h3>Je li napuhiva SUP daska bolja za početnike?</h3>
  <p>Da. Napuhive SUP daske preporučuju se početnicima jer su podložnije oprostu pogrešaka, lakše za transport i manje je vjerojatno da će prouzročiti ozljedu pri padovima.</p>

  <h3>Mogu li napuhive SUP daske biti podjednako performantne kao tvrde daske?</h3>
  <p>Za rekreativno veslanje i touring napuhive SUP daske dostižu performanse tvrdih daska. Tvrde daske i dalje prednjače u utrkama i naprednom surfanju zbog lakše težine i profinjene fleksibilnosti.</p>

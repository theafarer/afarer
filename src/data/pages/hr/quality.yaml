  title: 'Naša obveza'
  body: 'Tim rigoroznim ispitnim postupcima {SITE} pruža kupcima uvjerenje da naše napuhive SUP daske nisu samo visokoperformantne, već i izrađene da traju — osiguravajući bezbroj ugodnih i sigurnih pustolovina na vodi. Naš laboratorij kvalitete djeluje neovisno o proizvodnji i izvještava izravno upravi.'
  cta: 'Zatražite ispitnu dokumentaciju'
  cta_link: /contact/

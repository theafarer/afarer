tests:
  - title: 'Ispitivanje tlakom'
    description: 'Napuhive komore izlažu se tlakovima koji premašuju preporučene radne granice tijekom duljeg razdoblja. Time se provjerava nepropusnost i strukturni integritet materijala i šavova, osiguravajući da proizvod podnosi namjeravanu upotrebu i moguće prekomjerno napuhivanje bez kvara ili curenja.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Ispitivanje udaraca'
    description: 'Proizvodi se izlažu kontroliranim udarcima različitih težina i kutova. Time se procjenjuje otpornost materijala na probijanje, kidanje i oštećenja od sudara s preprekama u vodi, dokazujući trajnost i dugotrajnost.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'Ispitivanje UV otpornosti'
    description: 'Uzorci materijala prolaze ubrzano UV izlaganje koje simulira godine snažnog sunca, a zatim se ponovno ispituju na zadržavanje vlačne čvrstoće i postojanost boje. Time se potvrđuje da se PVC spojevi odupiru izbljeđivanju, kredi i pucanju, osiguravajući dugotrajnu trajnost u sunčanim pomorskim okruženjima.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Ispitivanje otpornosti na abraziju'
    description: 'Uzorci materijala trljaju se o abrazivne površine određeni broj ciklusa pod kontroliranim pritiskom. Time se mjeri sposobnost materijala da izdrži habanje od ponovljene upotrebe i kontakta s pijeskom, stijenama ili drugim površinama, osiguravajući dugotrajnost.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Ispitivanje performansi pri niskim temperaturama'
    description: 'Proizvodi se ispituju u hladnim okruženjima radi procjene funkcionalnosti i trajnosti u raznim temperaturnim uvjetima, sprječavajući ukočenost ili pucanje u hladnijim vodama. Ključno za daske namijenjene zimskoj upotrebi ili upotrebi na visokim geografskim širinama.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Ispitivanje plovnosti i nosivosti'
    description: 'Proizvodi se ispituju s različitim teretima kako bi se odredila njihova maksimalna nosivost i osiguralo da sigurno nose korisnike i opremu. Nosivost svakog modela provjerava se prije izlaska na tržište.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Ispitivanje upravljivosti'
    description: 'Proizvodi se ispituju na odzivnost na veslanje ili motorni pogon, uz vrednovanje polumjera okretanja i lakoće rukovanja. Ispitivanja na vodi potvrđuju da stvarno rukovanje odgovara dizajnerskim specifikacijama.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Ispitivanje nepropusnosti'
    description: 'Potpuno sastavljeni proizvodi uranjaju se ili izlažu vodenom spreju radi provjere curenja kroz šavove, ventile ili materijale. Svaka daska prolazi obaveznu provjeru nepropusnosti prije otpreme.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp


faqs:
  title: 'FAQ o OEM proizvodnji vesala'
  subtitle: 'Odgovori na najčešća pitanja marki koje lansiraju vlastito veslo.'
  items:
    - title: 'Kako stvorim vlastitu marku vesala?'
      description: 'Lansirajte svoju marku u 16 tjedana: brief, dizajn, prototip s CE certifikatom, serijska proizvodnja i isporuka. Istražite naše OEM pakete.'
    - title: 'Koliki je rok proizvodnje?'
      description: 'Uzorak je spreman za 2-3 tjedna, serijska proizvodnja za 30-45 dana, ovisno o količini.'
    - title: 'Nosi li veslo naš logotip?'
      description: 'Da — potpuna privatna marka: tisak logotipa, prilagođene boje, pakiranje i naljepnice u vašoj marki.'
    - title: 'Mogu li kupovati u velikim količinama od prvog dana?'
      description: 'MOQ je 50 jedinica za standardne modele, s veleprodajnim razinama cijena kako količina raste.'

philosophy:
  tagline: 'Filozofija dizajna'
  title: 'Dizajn vođen inženjerstvom<br />— svaki detalj je važan'
  subtitle: 'Naša inženjerska filozofija temelji se na tri načela koja vode svaki proizvod koji gradimo.'
  list:
    - 'Pouzdanost prije svega: Svaki se afarer proizvod ispituje kako bi izdržao stvarne uvjete — od operacija spašavanja u hladnoj vodi do iznajmljivanja u tropskim odmaralištima. Pretjerano konstruiramo tamo gdje je najvažnije.'
    - 'Proizvodna preciznost: Naši objekti koriste CNC rezanje, zavarivanje visokom frekvencijom i automatizirano ispitivanje tlaka. Svaki šav, svaki ventil, svaki spoj ispunjava dokumentirane specifikacije.'
    - 'Neprestane inovacije: Naš tim za istraživanje i razvoj neprestano vrednuje nove materijale, proizvodne metode i poboljšanja dizajna. Ne čekamo probleme — anticipiramo ih.'
cta:
  title: 'Želite razgovarati o projektu s našim timom?'
  subtitle: 'Naši inženjeri su spremni savjetovati o odabiru proizvoda, prilagodbi i kolekcijama s dvije marke.'
  actions:

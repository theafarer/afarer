intro: 'Svaka daska koja napusti našu radionicu nosi potvrdu da je prošla definiran skup kontrola kvalitete i ispitivanja materijala. Naš laboratorij za kvalitetu i kontrolu neovisna je funkcija u organizaciji — izvještava izravno direktoru, a ne proizvodnji — čime se osigurava da nikakav komercijalni pritisak ne može ugroziti kontrolnu točku. Ako serija materijala ili gotova daska ne ispunjava objavljenu specifikaciju, laboratorij ima ovlasti zaustaviti otpremu sve dok se nesukladnost ne otkloni.'

content_html: |
  <h2>Vjeruj, ali provjeri</h2>
  <p>Laboratorij posluje u okviru sustava upravljanja kvalitetom usklađenog s načelima, a naše su metode ispitivanja, gdje god je to primjenjivo, utemeljene na ISO, ASTM i EN standardima. Vodimo detaljne zapise o svakom provedenom ispitivanju, stvarajući potpuni lanac sljedivosti od primitka sirovina do isporuke gotove daske.</p>

  <h2>Ispitna oprema i mogućnosti</h2>
  <table>
    <thead><tr><th>Oprema</th><th>Provedena ispitivanja</th><th>Standard / Metoda</th></tr></thead>
    <tbody>
      <tr><td>Univerzalni ispitni stroj (50 kN)</td><td>Vlačna čvrstoća (tkanina), otpornost na ljuštenje (šavovi), širenje suza</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Ispitni uređaj za zadržavanje zraka (programabilan)</td><td>Izdržljivost 1000 ciklusa napuhivanja/ispuhivanja, ispitivanje zadržavanja tlaka 30 min</td><td>EN ISO 25649 (interni)</td></tr>
      <tr><td>Naprava za ljuštenje šava (motorizirano ljuštenje 180°)</td><td>Čvrstoća ljuštenja zavarenog i lijepljenog šava pri 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Ispitivač hidrostatskog tlaka</td><td>Otpornost tkanine na prodiranje vode (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Digitalni mjerač debljine i mikrometar</td><td>Debljina tkanine, debljina stijenke ruba, debljina ljepila u filmu</td><td>ISO 2286-3</td></tr>
      <tr><td>Klimatska komora</td><td>Kondicioniranje temperature (-40 °C do +80 °C) za ispitivanja hladne pukotine i toplinskog starenja</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Spektrofotometar boja</td><td>Mjerenje boje Delta-E nakon UV izloženosti</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Kontrolne točke — od materijala do isporuke</h2>
  <p>Svaka daska slijedi definirani plan kvalitete s obveznim kontrolnim točkama. Nijedna daska ne može preskočiti točku; svaku točku mora odobriti inspektor kvalitete prije početka sljedeće faze proizvodnje.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Točka 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kontrola ulaznog materijala</p>
            <p class="text-xs text-gray-500 mt-1">Serija tkanine, serija ljepila, hardver — sve se provjerava prema ulaznoj specifikaciji prije puštanja u proizvodnju.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Točka 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kontrola zavarivanja tijekom proizvodnje</p>
            <p class="text-xs text-gray-500 mt-1">Prvi uzorak zavara testira se (ljuštenje + vizualno) na početku svake proizvodne smjene.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Točka 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Zračni test komore</p>
            <p class="text-xs text-gray-500 mt-1">Svaka se komora napuhuje na 1,5 x radnog tlaka i drži 30 min. Podaci se bilježe po serijskom broju.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Točka 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kontrola prije isporuke</p>
            <p class="text-xs text-gray-500 mt-1">Pregled cijele daske: svi spojevi pritegnuti, oprema funkcionalna, bez estetskih nedostataka. Kontrolna lista od 100 točaka.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Točka 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Završna certifikacija</p>
            <p class="text-xs text-gray-500 mt-1">Izvještaji o ispitivanjima sastavljeni, zapisi kontrola pregledani, izdana Potvrda o sukladnosti.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Ključni pokazatelji kvalitete (prosjek 2025.)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99,7 %</span>
      <span class="text-xs text-gray-500">Prvi prolaz bez ispravka (serija tkanine)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0,2 %</span>
      <span class="text-xs text-gray-500">Stopa odbijenih zavara (metar dužine)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Komore testirane na zrak prije montaže</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">Sukladnost s kategorijom dizajna</span>
    </div>
  </div>

  <h2>Naš tim za kvalitetu</h2>
  <p>U laboratoriju rade voditelj kvalitete (10 godina u morskoj osiguri kvalitete, ASQ certificirani inženjer kvalitete), dva inspektora kvalitete (svaki s NDT certifikatom razine 2 u vizualnom ispitivanju) i tehničar za materijale zadužen za sva fizička ispitivanja. Tim svake godine prolazi ispitivanja stručnosti putem neovisnog vanjskog pružatelja usluga kako bismo osigurali da naši rezultati ispitivanja ostanu točni i ponovljivi.</p>

  <h2>Neovisna ispitivanja za klijente</h2>
  <p>Naš laboratorij za kvalitetu i kontrolu dostupan je za usluge neovisnog ispitivanja. Ako trebate provjeriti specifikaciju tkanine, validirati novi sustav ljepila ili pribaviti izvještaj neovisne treće strane za kvalifikaciju u nabavi, možemo provesti ispitivanja prema primjenjivom standardu i izdati certificirani izvještaj o ispitivanju.</p>
  <p>Primjeri nedavnih ispitivanja za treće strane:</p>
  <ul>
    <li>Usporedba čvrstoće ljuštenja pet konkurentskih proizvoda ljepila u filmu za europski vojni nabavni program.</li>
    <li>Studija ubrzanog starenja (UV + toplinski ciklusi) za novu PVC formulaciju s narančastim pigmentom, s redovitim privremenim mjerenjima u intervalima od 500 h.</li>
    <li>Validacija zadržavanja zraka 50 prototipnih pregradnih ventila za novi dizajn komore pod visokim tlakom.</li>
  </ul>

  <h2>Naša obveza prema vama</h2>
  <p>Kada primite Afarer dasku, primate i njezin dosje kvalitete — sastavljeni zapis rezultata ispitivanja koji se odnose na vašu konkretnu dasku. Certifikat serije tkanine, ispitivanja ljuštenja šavova, zapisi zračnih testova komora i kontrolna lista pregleda prije isporuke. Svaki je broj sljediv. Svaki je inspektor identificiran. To nije samo papirologija — to je naše obećanje da je ono što smo isporučili ono što smo specificirali.</p>
  <p>Ako ikada imate nedoumicu oko kvalitete, možete izravno kontaktirati laboratorij — kontakt podaci otisnuti su na vašoj potvrdi o sukladnosti. Svaki upit shvaćamo ozbiljno i obvezujemo se na formalnu istragu u roku od 48 sati.</p>


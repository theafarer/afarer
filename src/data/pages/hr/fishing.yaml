faqs:
  - question: 'Možete li stajati i riboloviti s napuhive SUP daske?'
    answer: 'Da. Šire napuhive SUP daske (33 inča ili više) pružaju dovoljno stabilnosti za stajanje i bacanje. EVA podloge u punoj duljini omogućuju sigurno stajanje i kada su mokre.'
  - question: 'Je li napuhiva SUP daska dobra za ribolov?'
    answer: 'Napuhive SUP daske izvrsne su platforme za ribolov, posebno za ribolov na plićacima i pokrivanje plitkih voda. Široki dizajni omogućuju lagan pristup ribolovnoj opremi.'
  - question: 'Koliko opreme mogu ponijeti na napuhivoj SUP dasci?'
    answer: 'Većina napuhivih SUP daska nosi ukupno 220-300 lbs (vozač plus oprema). Tipična ribolovna oprema s priborom, hladnjakom i sigurnosnom opremom dodaje 20-40 lbs. Provjerite ocjenu volumena daske kako biste osigurali dovoljan kapacitet.'
body: |
  <h2>Zašto riboloviti s napuhivog plovila?</h2>
  <p>Napuhive SUP daske nude ribolovcima jedinstvene prednosti koje tradicionalni čamci ne mogu dostići. Njihov plitki gaz omogućuje pristup vodama do kojih motorni čamci ne mogu doprijeti, a tih prilaz minimizira uznemiravanje ribe. Prenosivost znači da možete riboloviti na udaljenim jezerima, rijekama i obalnim područjima bez prikolice ili rampe za spuštanje.</p>
  <p>Ključne prednosti uključuju:</p>
  <ul>
    <li><strong>Prikradanost</strong> — Bez buke motora možete prići ribi bez da je uplašite</li>
    <li><strong>Pristup plitkim vodama</strong> — Gaz od samo nekoliko inča omogućuje ribolov u močvarama, potocima i plićacima</li>
    <li><strong>Prenosivost</strong> — Pakirajte svoje plovilo do udaljenih lokacija nedostupnih čamcem</li>
    <li><strong>Mogućnost stajanja</strong> — SUP daske omogućuju stajanje za bolju vidljivost vode</li>
  </ul>

  <h2>Zahtjevi za stabilnošću</h2>
  <p>Ribolov zahtijeva stabilnu platformu. Pri odabiru napuhivog plovila za ribolov, prioritet dajte:</p>
  <ul>
    <li><strong>Širini</strong> — Šire daske (33-36 inča) pružaju bolju stabilnost za stajanje i bacanje</li>
    <li><strong>Debljini</strong> — Daske debljine 6 inča nude veću krutost i nosivost za opremu</li>
    <li><strong>Volumenu</strong> — Veći volumen (300+ litara) nosi ukupnu težinu ribolovca i opreme</li>
    <li><strong>Površini</strong> — EVA pjena podloga u punoj duljini pruža protuklizni oslonac kada je mokra</li>
  </ul>

  <h2>Kompatibilnost s opremom</h2>
  <p>Tipična oprema za ribolov s napuhivog plovila uključuje:</p>
  <ul>
    <li><strong>Nosači štapova</strong> — Nosači štapova koji se priklepaju ili montiraju na površinu za veslanje bez ruku</li>
    <li><strong>Sanduk ili hladnjak</strong> — Osiguran na površini elastičnim vezicama za pribor i ulov</li>
    <li><strong>Sidreni sustav</strong> — Lagano preklopno sidro ili stup za zadržavanje u struji</li>
    <li><strong>Uže za veslo</strong> — Drži veslo pričvršćenim kada su obje ruke potrebne za ribolov</li>
    <li><strong>Personal flotation device (PFD)</strong> — Ključna sigurnosna oprema za sve ribolovce</li>
  </ul>

  <h2>Preporučene vrste plovila za ribolov</h2>
  <p>Različiti ribolovni scenariji odgovaraju različitim vrstama plovila:</p>

  <h3>SUP daske za ribolov</h3>
  <p>Najbolje za: ribolov na plićacima, ribolov basa na jezerima, ribolov na vidjelo u plitkoj vodi. Podignuti položaj stajanja pruža izvrsnu vidljivost. Odaberite širu touring ili all-around SUP dasku za stabilnost.</p>

  <h3>SUP daske za ribolov</h3>
  <p>Najbolje za: višekorisničke ribolovne izlete, nošenje teške opreme i zaštićene obalne vode. SUP daske nude prostor na površini i nosivost uz zadržavanje prenosivosti.</p>

  <h2>Sigurnosne napomene</h2>
  <ul>
    <li>Uvijek nosite PFD — ribolov uključuje stajanje, bacanje i rukovanje opremom što povećava rizik od pada</li>
    <li>Provjerite vremenske i vodene uvjete prije polaska</li>
    <li>Nesite zviždaljku, telefon u vodonepropusnoj torbici i osnovni set za popravak</li>
    <li>Recite nekome svoju ribolovnu lokaciju i očekivano vrijeme povratka</li>
  </ul>

  <h2>Najčešća pitanja</h2>
  <h3>Možete li stajati i riboloviti s napuhive SUP daske?</h3>
  <p>Da. Šire napuhive SUP daske (33 inča ili više) pružaju dovoljno stabilnosti za stajanje i bacanje. EVA podloge u punoj duljini omogućuju sigurno stajanje i kada su mokre.</p>

  <h3>Koliko opreme mogu ponijeti na napuhivoj SUP dasci?</h3>
  <p>Većina napuhivih SUP daska nosi ukupno 220-300 lbs (vozač plus oprema). Tipična ribolovna oprema s priborom, hladnjakom i sigurnosnom opremom dodaje 20-40 lbs. Provjerite ocjenu volumena daske kako biste osigurali dovoljan kapacitet.</p>

meta:
  title: 'Proizvodnja SUP dasaka s privatnom markom i lansiranje prilagođene marke | {SITE}'
  description: 'Proizvođač SUP dasaka s privatnom markom za nove marke daska za veslanje. Lansirajte svoju marku SUP dasaka s Afarer — kompletta OEM/ODM usluga uključujući dizajn, prototipove, prilagođeno brendiranje, proizvodnju i globalnu logistiku.'

hero:
  tagline: 'Izgradite svoju marku'
  title: 'Lansirajte vlastitu<br />marku SUP dasaka'
  subtitle: 'Vi imate viziju. Mi imamo tvornicu, stručnost i lanac opskrbe. Proizvodnja SUP dasaka s privatnom markom i razvoj prilagođene marke SUP dasaka — zajedno ćemo izgraditi marku koja se ističe.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Prilagođeno brendirana SUP daska na vodi'

process:
  title: 'Put vaše marke'
  subtitle: 'Od ideje do tržišta u 5 faza.'
  steps:
    - phase: 'Faza 1'
      title: 'Ideja'
      period: 'Tjedan 1-2'
      items:
        - 'Istraživanje tržišta i analiza konkurencije'
        - 'Definiranje ciljnog kupca'
        - 'Radionica pozicioniranja marke'
        - 'Strategija linije proizvoda'
    - phase: 'Faza 2'
      title: 'Dizajn'
      period: 'Tjedan 3-6'
      items:
        - 'Oblik daske i grafički dizajn'
        - 'Usklađivanje boja i odabir materijala'
        - 'Specifikacija dodataka'
        - 'Dizajn pakiranja i naljepnica'
    - phase: 'Faza 3'
      title: 'Prototip'
      period: 'Tjedan 7-10'
      items:
        - 'Proizvodnja uzoraka'
        - 'Ispitivanje kvalitete (tlak, plovnost, UV)'
        - 'Prilagodbe dizajna'
        - 'Završno odobrenje'
    - phase: 'Faza 4'
      title: 'Proizvodnja'
      period: 'Tjedan 11-14'
      items:
        - 'Serijska proizvodnja'
        - 'QC pregled (po jedinici)'
        - 'Pomorski / zračni teret'
        - 'Dokumenti za carinjenje'
    - phase: 'Faza 5'
      title: 'Lansiranje'
      period: 'Tjedan 15-16'
      items:
        - 'Fotografiranje proizvoda'
        - 'Product feed za web-stranicu'
        - 'Marketinški materijali'
        - 'Podrška pri lansiranju'

packages:
  title: 'Paketi za pokretanje'
  subtitle: 'Paketi dizajnirani za svaku fazu rasta marke.'
  items:
    - name: 'Početna marka'
      tagline: '50-100 jedinica · 2 modela dasaka'
      features:
        - 'Osnovni tisak logotipa'
        - 'Standardno pakiranje'
        - 'Podrška e-poštom'
    - name: 'Marka u rastu'
      tagline: '300-1,000 jedinica · 3-5 modela dasaka'
      features:
        - 'Prilagođena boja + logotip'
        - 'Prilagođeno pakiranje'
        - 'Fotografije proizvoda'
        - 'Namjenski voditelj'
    - name: 'Etabilirana marka'
      tagline: '1,000+ jedinica · kompletna linija proizvoda'
      features:
        - 'Potpuna prilagodba'
        - 'Premium pakiranje'
        - 'Marketinški materijali'
        - 'Prioritetna proizvodnja'


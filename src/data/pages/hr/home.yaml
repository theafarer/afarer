oem_section:
  tagline: 'OEM / ODM proizvodnja i zajedničko brendiranje'
  title: 'Od ideje do vode — izdanja u zajedničkom brendiranju'
  subtitle: 'Za partnere koji žele više od kataloškog proizvoda: OEM/ODM proizvodnja i ograničene kolekcije u zajedničkom brendiranju dizajnirane, konstruirane i izgrađene s Afarerom — a svaka daska ostaje Afarer proizvod.'
  steps:
    - number: '01'
      title: 'Ideja i smjernice'
      desc: 'Podijelite svoju viziju, ciljnog vozača i vodu za koju dizajnirate.'
    - number: '02'
      title: 'Dizajn i inženjerstvo'
      desc: '3D modeliranje, odabir materijala i prepoznatljiv grafički dizajn.'
    - number: '03'
      title: 'Prototip i validacija'
      desc: 'Uzorci daska testirani na tlak i provjereni u vožnji prije vaše obveze.'
    - number: '04'
      title: 'Proizvodnja u velikim serijama'
      desc: 'Dosljedna, kontrolirana proizvodnja s kontrolnim točkama kvalitete u svakoj fazi.'
    - number: '05'
      title: 'Globalna isporuka'
      desc: 'Logistika od Qingdaoa do glavnih luka uz carinsku podršku.'
  cta: 'Istražite zajedničko brendiranje'

stories:
  tagline: 'Priče istraživača'
  title: 'Stvarne avanture stvarnih ljudi'
  subtitle: 'Poslušajte veslače, obitelji i profesionalce koji koriste afarer opremu na vodi.'
  items:
    - name: 'Sarah i Mike'
      title: 'Vlasnici SUP Explorer 11, Kanada'
      content: 'Ponijeli smo svoje Explorer 11 na tjedan dana dugo putovanje kroz park Algonquin. Prešli su prijelaze i jezerske prelaze prekrasno. Drop-stitch konstrukcija omogućila nam je napuhivanje na 15 PSI i performanse tvrde daske iz daske koja se može pakirati.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Park Algonquin, Kanada'
    - name: 'Carlos R.'
      title: 'Vozač Cheetah Surge, Španjolska'
      content: 'Cheetah Surge moja je daska za obalno krstarenje. Živahan dizajn privlači poglede na plaži, a stabilnost mi daje samopouzdanje pri laganim valovima. Ponaša se prekrasno bilo da sam na touringu ili samo uživam u zalasku sunca.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Španjolska'
    - name: 'Lina i obitelj'
      title: 'Veslači Flowing Lotus, Švedska'
      content: 'Vikend obiteljske avanture po otočju. Flowing Lotus dovoljno je stabilan da moja kći stoji na njemu dok ja veslam. Napuhuje se za oko 10 minuta — bez prikolice, samo čista obiteljska zabava na vodi.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Stockholmsko otočje, Švedska'
    - name: 'Lt. Cmdr. Andres'
      title: 'Istraživač Ocean Voyager, Filipini'
      content: 'Koristim svoj Ocean Voyager za duga obalna putovanja oko Palawana. Nakon mjeseci svakodnevne upotrebe u tropskim uvjetima daska se i dalje ponaša kao nova. Touring oblik presijeca valove koji bi zaustavili slabije daske.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palawan, Filipini'
    - name: 'Emma T.'
      title: 'Početnica na Tropical Breeze, Australija'
      content: 'Nikada prije nisam bila na SUP dasci. Tropical Breeze toliko je stabilan da sam se osjećala sigurno pri prvom pokušaju. Sada veslam svaki vikend. Krivulja učenja praktički je nula — a daska izgleda nevjerojatno na vodi.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Australija'


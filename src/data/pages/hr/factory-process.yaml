intro: 'Za razliku od brendova koji outsourcing proizvodnju trećim tvornicama, afarer posjeduje i vodi cijeli svoj proizvodni lanac. Ta vertikalna integracija omogućuje nam strogu kontrolu kvalitete u svakoj fazi, brz odziv na zahtjeve po mjeri i dosljednu kvalitetu proizvoda seriju za serijom. Evo kako se daska gradi u našem pogonu.'

steps:
  - step: '01'
    title: 'Primitak i kontrola materijala'
    description: 'Svaka pristigla serija PVC tkanine, staklène voštanke, smole i hardvera kontrolira se prema specifikaciji. Uzorci tkanine testiraju se na vlačnu čvrstoću, ujednačenost debljine i UV otpornost prije puštanja u proizvodnju. Nesukladni materijali stavljanju se u karantenu i vraćaju.'
    duration: '1–2 dana'
  - step: '02'
    title: 'Automatsko rezanje PVC-a'
    description: 'Odobrene tkanine postavljaju se na automatski CNC stroj za rezanje i režu s točnošću ispod milimetra. Računalno optimizirano slaganje raspoređuje ploče kako bi se smanjio otpad — tipično ispod 5%. Izrezane ploče označavaju se prema modelu daske i komori, a zatim povezuju za prijenos u radionicu za zavarivanje.'
    duration: '2–4 sata po kompletu daske'
  - step: '03'
    title: 'Toplinsko brtvljenje i zavarivanje cijevi'
    description: 'Ploče se privremeno spajaju i spajaju strojevima za toplinsko brtvljenje s zavarivanjem vrućim zrakom pri kontroliranim temperaturama od 200–300 °C. Glavni šavovi ojačavaju se dielektričnim RF zavarivanjem za nepropusne, visokočvrste spojeve. Dovršene komore napuhuju se na 1,5× radnog tlaka za 30-minutnu validaciju zadržavanja zraka.'
    duration: '1–2 dana po dasci'
  - step: '04'
    title: 'Tisak i dekoracija SUP daska'
    description: 'Grafike na površinama SUP daska nanose se digitalnim tiskom za dizajne u punoj boji fotografske kvalitete te sitotiskom za trajne logotipe i ponavljajuće uzorke. Otisci se stvrdnjavaju i brtve za UV otpornost i otpornost na habanje.'
    duration: '1–2 dana'
  - step: '05'
    title: 'Završna montaža i opremanje'
    description: 'Daske se opremaju na montažnoj liniji perajama, ventilima, EVA podlogama i priborom. Svaka jedinica slijedi kontrolnu listu montaže od 100 točaka s obveznim odobrenjem u svakoj fazi.'
    duration: '2–4 dana'
  - step: '06'
    title: 'Ispitivanje i kontrola kvalitete'
    description: 'Svaka dovršena daska prolazi obveznu kontrolnu točku kvalitete: test zadržavanja zraka u komorama, provjera funkcije hardvera, provjera momenta pritezanja spojeva i estetski pregled. Izrade po mjeri i prototipovi također prolaze ispitivanja u vodi koja obuhvaćaju stabilnost i ponašanje.'
    duration: '1–2 dana'
  - step: '07'
    title: 'Pakiranje i otprema'
    description: 'Daske se ispuhuju, presavijaju prema postupku, pakiraju u vreće od jakog tkanog materijala ili sanduke od šperploče i utovaruju za otpremu. Svaki paket označen je modelom, serijskim brojem i odredištem. Koordiniramo s špediterima za FCL i LCL kontejnerske pošiljke širom svijeta.'
    duration: '1 dan'


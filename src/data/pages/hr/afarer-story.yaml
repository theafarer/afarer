timeline:
  - year: '2012'
    title: 'Temelji proizvodnje za more'
    body: 'afarer je počeo kao specijalizirana radionica za plovila u Qingdaou u Kini, posvećena obrtničkom umijeću i proizvodnji plovila. Rani je fokus bio izgradnja pouzdanih napuhivih proizvoda kroz praktično inženjersko iskustvo i proizvodnu disciplinu.'
  - year: '2015'
    title: 'Prvi izvoz i CE certifikacija'
    body: 'Prvi su izvozni nalozi stigli u Japan i Koreju. CE certifikacija postignuta je za ključne linije proizvoda, čime je afarer ušao na međunarodna tržišta. Tvrtka je počela opsluživati komercijalne i rekreativne korisnike izvan Kine.'
  - year: '2018'
    title: 'Širenje tvornice'
    body: 'Preselili smo se u proizvodni pogon od 12,000 m². Dodali smo linije za RF zavarivanje i kapacitet proizvodnje drop-stitch tkanine, čime smo omogućili proizvodnju u većim razmjerima i poboljšali sustave kontrole kvalitete.'
  - year: '2020'
    title: 'Osnovan R&D centar'
    body: 'Otvorili smo namjenski R&D centar s laboratorijem za PVC tkanine, hidrodinamičkim ispitnim bazenom i CAD/FEA simulacijskim studijem. Razvoj proizvoda proširen je na lagane konstrukcije, poboljšanu izdržljivost i dizajn usmjeren na korisnika.'
  - year: '2022'
    title: 'Certifikacija i globalni rast'
    body: 'Postigli smo ISO 9001 certifikaciju. Proširili smo se na 14 R&D inženjera i više od 200 radnika. Proizvodi su kroz partnerstva s distributerima i zajedničko brendiranje stigli do kupaca širom Europe, Amerike i regije Azije-Pacifika.'
  - year: '2024'
    title: 'Studio za inovacije i dizajn'
    body: 'Pokrenuli smo sveobuhvatni studio za dizajn i inovacije za projekte zajedničkog brendiranja po mjeri — od koncepta do proizvodnje. Ojačali smo profesionalne primjene na moru, uključujući spasilačke, komercijalne i vladne ugovore.'
  - year: '2026'
    title: 'Izgradnja budućnosti istraživanja voda'
    body: 'Danas afarer nastavlja razvijati SUP sustave i pribor za more — povezujući ljude i organizacije s vodama svijeta. Više od 50 obuhvaćenih zemalja, godišnji kapacitet od 15,000+ jedinica.'

content_founding:
  tagline: 'Početak'
  title: 'Rođeno na obali'
  subtitle: 'afarer je počeo u obalnoj radionici u Qingdaou s jednom daskom i vizijom: graditi napuhiva plovila sposobna izdržati prave uvjete na moru.'
  paragraphs:
    - 'Godine 2012. naši su osnivači uočili prazninu na tržištu — većina je napuhivih plovila bila ili pristupačna ali nepouzdana, ili visoke kvalitete ali nedopustivo skupa. Vjerovali su da postoji mjesto za proizvođača koji nudi i kvalitetu i vrijednost.'
    - 'Prvi je trup izgrađen ručno, testiran u lokalnim vodama i usavršen na temelju stvarnih povratnih informacija ribara i malih komercijalnih operatera. Taj krug povratnih informacija — gradi, testiraj, slušaj, poboljšaj — i danas je u srcu naše inženjerske filozofije.'
    - 'Do 2015. vijest se proširila izvan Qingdaoa. Međunarodni su distributeri počeli tražiti uzorke. Ono što je počelo kao lokalna radionica postajalo je globalni dobavljač.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'rana afarer proizvodna radionica i proizvodnja'

content_growth:
  tagline: 'Rast i inovacije'
  title: 'Od radionice do pogona od 12,000 m²'
  subtitle: 'Kontinuirana ulaganja u ljude, opremu i procese pretvorila su afarer u modernu proizvodnu tvrtku opreme za more.'
  paragraphs:
    - 'Kako je rasla potražnja, rastao je i naš pogon. Proširili smo se iz male radionice u tvornicu od 12,000 m² s namjenskim proizvodnim linijama za SUP daske i pribor.'
    - 'Ulagali smo u CNC strojeve za rezanje, opremu za zavarivanje visoke frekvencije, proizvodne linije drop-stitch tkanine i sveobuhvatne ispitne uređaje — što nam omogućuje kontrolu svakog aspekta kvalitete proizvodnje.'
    - 'Danas naš tim od više od 200 ljudi uključuje inženjere za more, stručnjake za materijale, specijaliste kontrole kvalitete i vješte obrtnike — od kojih su mnogi s afarerom od samih početaka.'

philosophy:
  tagline: 'Filozofija brenda'
  title: 'Inženjering slobode na vodi'
  body: 'Sloboda na vodi nije samo kretanje. Ona predstavlja otkrivanje novih mjesta, stvaranje iskustava na otvorenom, povezivanje ljudi s prirodom i omogućavanje profesionalnih misija. Inženjering tu slobodu čini mogućom.'
  pillars:
    - title: 'Pouzdanost na prvom mjestu'
      body: 'Vodena okruženja zahtijevaju povjerenje. afarer proizvodi dizajnirani su oko stabilnosti, izdržljivosti, sigurnosti i dosljednih performansi.'
    - title: 'Dizajn usmjeren na čovjeka'
      body: 'Proizvodi trebaju služiti ljudima, a ne tehnologiji. Svaka dizajnerska odluka počinje razumijevanjem toga kako ljudi koriste plovila, gdje istražuju i s kojim se izazovima susreću.'
    - title: 'Pristupačno istraživanje'
      body: 'Voda ne bi trebala pripadati samo stručnjacima. afarer stvara opremu koja većem broju ljudi omogućuje sigurno iskustvo rijeka, jezera, oceana i obalnih okruženja.'
    - title: 'Kontinuirane inovacije'
      body: 'Inovacija nije samo stvaranje novih proizvoda. To je poboljšavanje svakog detalja — materijala, konstrukcija, proizvodnje i korisničkog iskustva.'

engineeringDna:
  tagline: 'Inženjerski DNA'
  title: 'Kako afarer stvara proizvode'
  areas:
    - title: 'Znanost o materijalima'
      body: 'afarer se fokusira na odabir odgovarajućih materijala za različita morska okruženja. Ključni kriteriji uključuju otpornost na habanje, otpornost na UV zračenje, stabilnost pod tlakom i dugotrajnu izdržljivost.'
      items: ['Otpornost na habanje', 'Otpornost na UV', 'Stabilnost pod tlakom', 'Dugotrajna izdržljivost']
    - title: 'Konstrukcijsko inženjerstvo'
      body: 'Napuhiva plovila zahtijevaju preciznu ravnotežu između krutosti, težine, prenosivosti i stabilnosti. afarer inženjering fokusira se na optimizaciju tih čimbenika pomoću drop-stitch tehnologije i napredne izrade šavova.'
      items: ['Krutost', 'Optimizacija težine', 'Prenosivost', 'Stabilnost']
    - title: 'Preciznost proizvodnje'
      body: 'Svaki proizvod prolazi kroz kontrolirane procese: priprema materijala, precizno rezanje, zavarivanje i lijepljenje, montaža, kontrola kvalitete i provjera performansi.'
      items: ['Priprema materijala', 'Precizno rezanje', 'Zavarivanje i lijepljenje', 'Montaža i kontrola kvalitete']
    - title: 'Inženjerstvo scenarija korištenja'
      body: 'Proizvodi se razvijaju oko stvarnih primjena — rekreacije, avanture i profesionalne upotrebe — čime se osigurava da svaki dizajn udovoljava specifičnim zahtjevima namijenjenog okruženja.'
      items: ['Rekreacija', 'Avantura', 'Profesionalno', 'Komercijalno']


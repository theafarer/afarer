content_html: |
  <h2>Tri standardne debljine</h2>

  <h3>4" (10 cm) – Touring i performanse</h3>
  <ul>
    <li>Najveća krutost – manje savijanja pod opterećenjem</li>
    <li>Najlakše – manje materijala, manji volumen zraka</li>
    <li>Izvrsno držanje smjera – smanjeno bočno njihanje</li>
    <li>Najbrže – smanjeni otpor, lakše klizanje</li>
    <li>Najbolje za: touring, utrke, fitness veslanje, iskusne veslače</li>
  </ul>

  <h3>5" (12,7 cm) – All-around</h3>
  <ul>
    <li>Dobra krutost – uravnotežen omjer savitljivosti i krutosti</li>
    <li>Umjerena težina – standardna upotreba materijala</li>
    <li>Dobra primarna + sekundarna stabilnost</li>
    <li>Najbolje za: rekreativno veslanje, početnike, ležerno jezersko i riječno korištenje</li>
  </ul>

  <h3>6" (15,2 cm) – Stabilnost i yoga</h3>
  <ul>
    <li>Najveća primarna stabilnost – masivna plovnost</li>
    <li>Najteže – više PVC materijala, veći volumen zraka</li>
    <li>Najsporije – više otpora, teže održavati klizanje</li>
    <li>Najbolje za: yogu/fitness, teške veslače (100+ kg), vrlo valovite uvjete</li>
  </ul>

  <h2>Inženjerska analiza</h2>
  <p>Krutost napuhive SUP daske određuje se unutarnjim tlakom zraka i momentom inercije poprečnog presjeka daske. Pri 20 PSI daska debljine 4" pokazuje približno 30% manji progib pod opterećenjem od daske debljine 6" iste širine i duljine. Primarna stabilnost dolazi od širine vodene linije i plovnosti; sekundarnu stabilnost utječu oblik rubova i širina daske.</p>

  <h2>Debljina prema težini veslača</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Težina veslača</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Preporučena debljina</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Manje od 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" ili 6"</td></tr>
      <tr><td class="p-3 border">Više od 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Odabir između debljine i PSI</h2>
  <p>Česta zabluda jest da veći PSI može kompenzirati preveliku debljinu. Pri 25 PSI daska debljine 6" pokazuje više savijanja od daske debljine 4" pri 15 PSI, jer geometrijski moment inercije dominira jednadžbom krutosti. Za veslače orijentirane na performanse, tanja daska pri nižem tlaku nadmašuje deblju dasku pri višem tlaku.</p>

  <h2>Afarer ponuda</h2>
  <ul>
    <li><strong>Daske debljine 4":</strong> Cheetah Touring serija – 12' x 30" x 4" touring SUP daske za fitness i veslanje na daljinu</li>
    <li><strong>Daske debljine 5":</strong> Cheetah All-Round serija – 10'6" x 32" x 5" za rekreativnu upotrebu</li>
    <li><strong>Daske debljine 6":</strong> Cheetah Ultra-Stable serija – 10' x 34" x 6" za yogu, krupne veslače i fotografske platforme</li>
  </ul>
  <p>Sve daske koriste 1,680 DTEX drop-stitch jezgre s nazivnim tlakom od 20 PSI i 1,2 mm PVC laminatima.</p>


steps_section:
  tagline: 'Kako to funkcionira'
  title: 'Od koncepta do proizvodnje'
  subtitle: 'Četiri koraka od vaše ideje do gotovog proizvoda spremnog za more.'
  steps:
    - num: '01'
      title: 'Odaberite svoju dasku'
      desc: 'Odaberite između naših temeljnih SUP modela — all-around, touring, yoga, sport ili dječjih. Izaberite veličinu, materijal i boju.'
    - num: '02'
      title: 'Prenesite svoj dizajn'
      desc: 'Pošaljite nam svoj logotip, grafiku ili smjernice marke. Naš dizajnerski tim priprema digitalni probni otisak.'
    - num: '03'
      title: 'Pregled AI makete'
      desc: 'Pogledajte fotorealističnu AI generiranu maketu vaše prilagođene daske prije početka proizvodnje.'
    - num: '04'
      title: 'Proizvodnja i isporuka'
      desc: 'Nakon odobrenja vaša narudžba ulazi u našu proizvodnu liniju. Rokovi isporuke od 30 dana.'

services_section:
  tagline: 'Usluge'
  title: 'Proizvodne usluge za globalne marke'
  subtitle: 'Fleksibilni modeli suradnje — od ugovorne proizvodnje do izgradnje marke s potpunom uslugom.'
  items:
    - title: 'Proizvodnja s dvije marke'
      desc: 'Proizvodimo vaše dizajne prema specifikaciji — vaše intelektualno vlasništvo, vaši crteži, vaši standardi kvalitete. Puna NDA zaštita.'
      icon: ⚙️
    - title: 'Dizajnerska rješenja'
      desc: 'Odaberite između 50+ provjerenih platformi i prilagodite veličinu, boju, grafiku i pakiranje.'
      icon: '🎨'
    - title: 'Privatna marka'
      desc: 'Vaša marka na našim proizvodima — logotip, pakiranje, vješalice s cijenom, priručnici. Spremno za maloprodaju izravno iz kutije.'
      icon: '🎨'
    - title: 'Prilagođeno brendiranje'
      desc: 'Tisak podloge palube, grafika trupa, naljepnice cijevi i prilagođene naljepnice — potpuna integracija marke.'
      icon: ⚙️


intro: 'Tkanina površine i rubova najkritičniji je materijal na napuhivoj SUP dasci. Mora izdržati stalnu UV izloženost, ponovljene cikluse napuhivanja, habanje o vezove i otpad te ekstremne temperaturne promjene — sve uz očuvanje strukturnog integriteta godinama. U Afareru je naš laboratorij za PVC tkanine posvećen isključivo karakterizaciji, validaciji i kontinuiranom poboljšanju tkanina koje koristimo u svakoj dasci koju izrađujemo.'

content_html: |
  <h2>Temelj svake napuhive SUP daske</h2>
  <p>Ne oslanjamo se isključivo na tehničke listove dobavljača. Svaka serija PVC tkanine koja ulazi u našu radionicu neovisno se testira interno. Time se jamči da je specifikacija materijala koju objavljujemo jednaka performansi materijala koju primate — seriju po seriju, godinu za godinom.</p>

  <h2>Standardizirana ispitna oprema</h2>
  <p>Naš laboratorij za tkanine opremljen je industrijskim instrumentima koji su u skladu s ISO, ASTM i EN ispitnim metodama:</p>
  <table>
    <thead><tr><th>Oprema</th><th>Mjereni parametri</th><th>Standard</th></tr></thead>
    <tbody>
      <tr><td>Univerzalni ispitivač vlačne čvrstoće (50 kN)</td><td>Sila loma, izduženje pri kidanju, širenje suza</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>Komora za starenje s ksenonskim lukom</td><td>UV otpornost (promjena boje, zadržavanje čvrstoće nakon 2000 h)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>Ispitivač savitljivosti na niskim temperaturama</td><td>Točka pucanja pri -30 °C do -50 °C</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Taber ispitivač habanja</td><td>Gubitak mase nakon 1000 ciklusa (CS-10 kotač)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>Mjerač debljine (digitalni, rezolucija 0,001 mm)</td><td>Ujednačenost po širini role</td><td>ISO 2286-3</td></tr>
      <tr><td>Ispitivač hidrostatskog tlaka</td><td>Otpornost na prodiranje vode</td><td>ISO 811</td></tr>
    </tbody>
  </table>
  <p class="text-sm text-gray-500">* Sva se oprema godišnje kalibrira u akreditiranim laboratorijima trećih strana.</p>

  <h2>Od podataka do odluke: tipičan tijek ispitivanja</h2>
  <p>Kada stigne novi kandidat tkanine, slijedi standardizirani sedmostepeni proces kvalifikacije:</p>
  <ol>
    <li><strong>Pregled primitka</strong> — vizualna provjera površinskih nedostataka, sitnih rupa i dimenzionalne sukladnosti.</li>
    <li><strong>Mapiranje debljine</strong> — 20-točkovno mjerenje po širini role; za prihvat je potreban CV &lt; 3%.</li>
    <li><strong>Ispitivanje vlačne čvrstoće</strong> — 5 uzoraka u smjeru osnove i potke. Minimalno 3500 N/50 mm za 1100 dtex PVC.</li>
    <li><strong>UV kondicioniranje</strong> — 1000 h izloženosti u komori s ksenonskim lukom; potrebno je minimalno 80 % zadržavanja čvrstoće.</li>
    <li><strong>Hladna pukotina</strong> — 4 h na -35 °C, zatim savijanje od 180° preko prstena promjera 25 mm. Bez vidljivih pukotina.</li>
    <li><strong>Otpornost na habanje</strong> — 1000 ciklusa, gubitak mase ≤ 0,05 g.</li>
    <li><strong>Odobrenje</strong> — tek nakon prolaska svih sedam točaka tkanina se pušta u proizvodnju.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Tipični PVC 1100 dtex — zadržavanje vlačne čvrstoće nakon UV izloženosti</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 h<br />100%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 h<br />95%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 h<br />88%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 h<br />82%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">Konkurencija<br />~65%</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Naša PVC 1100 dtex tkanina zadržava &gt; 80 % vlačne čvrstoće nakon 2000 h izloženosti ksenonskom luku, u usporedbi s tipičnim industrijskim razredima koji padaju ispod 70 %.</p>
  </div>

  <h2>Naš profesionalni tim</h2>
  <p>U laboratoriju rade dva inženjera materijala s punim radnim vremenom, svaki s diplomom iz polimerne znanosti ili tekstilnog inženjerstva i najmanje šest godina industrijskog iskustva. Podržavaju ih tri tehničara koji obavljaju svakodnevna ispitivanja i bilježenje podataka. Tim redovito sudjeluje u međulaboratorijskim ispitivanjima u krug koje organizira Međunarodna organizacija za standardizaciju (ISO) radi validacije točnosti naših ispitnih metoda.</p>

  <h2>Rješavanje vaših najzahtjevnijih izazova s materijalima</h2>
  <p>Svako je morsko okruženje drugačije. Najamna SUP daska pod tropskim suncem nosi bitno drugačija UV i temperaturna opterećenja od daska za jezera na sjevernim geografskim širinama. Naš laboratorij za tkanine pomaže vam odabrati — ili razviti — specifikaciju tkanine optimiziranu za vaš profil upotrebe.</p>
  <p>Nedavna rješenja po mjeri uključuju:</p>
  <ul>
    <li>PVC mješavina s visokom otpornošću na habanje za vojnog klijenta čije se daske redovito spuštaju s koraljnih i stjenovitih plaža (+40 % vijeka trajanja protiv habanja).</li>
    <li>PVC formulacija za niske temperature za arktičku ekspediciju, testirana na -50 °C bez krhkosti.</li>
    <li>Tkanina narančaste boje stabilizirana u boji za flotu spasilaca i spasilačkih daska, koja održava vidljivost nakon 3 godine izloženosti tropskom suncu.</li>
  </ul>
  <p>Ne prodajemo gotove tkanine "s police" u nadi da će funkcionirati. Testiramo, validiramo i preporučujemo — ili stvaramo — rješenje prilagođeno vašem specifičnom profilu misije. To je Afarer razlika.</p>

  <h2>Kako vas servisiramo</h2>
  <p>Kada nam donesete izazov s materijalom, evo što možete očekivati:</p>
  <ol>
    <li><strong>Konzultacija</strong> — razgovaramo o vašem okruženju upotrebe, ciljevima performansi i proračunu.</li>
    <li><strong>Prijedlog</strong> — sastavlja se plan ispitivanja s jasnim kriterijima prolaska/neuspjeha i vremenskim okvirom.</li>
    <li><strong>Izvršenje</strong> — naš laboratorij provodi ispitivanja i izrađuje detaljan izvještaj sa sirovim podacima i usporednom analizom.</li>
    <li><strong>Preporuka</strong> — predstavljamo specifikaciju tkanine, uključujući alternativne opcije ako više materijala ispunjava vaše zahtjeve.</li>
    <li><strong>Nastavak podrške</strong> — nakon isporuke ostajemo dostupni za podršku pri svim pitanjima o materijalima tijekom upotrebe.</li>
  </ol>
  <p>Naš cilj nije samo prodati vam dasku. Cilj nam je osigurati da daska koju primnete pouzdano radi u uvjetima u kojima veslate — a to počinje tkaninom.</p>


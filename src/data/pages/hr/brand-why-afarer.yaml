features3_reasons:
  tagline: 'Zašto odabrati afarer'
  title: 'Sedam razloga za partnerstvo s nama'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Stvarna proizvodnja, ne trgovina'
      description: 'Posjedujemo i vodimo tvornicu od 12,000 m². Kada sklapate partnerstvo s afarerom, radite izravno s ljudima koji dizajniraju, konstruiraju i izrađuju vaše proizvode — bez posrednika.'
      icon: tabler:building-factory
    - title: '2. Pristup vođen inženjerstvom'
      description: 'Naš dizajnerski proces počinje s namjenom upotrebe, a ne s kategorijom proizvoda. Optimiziramo oblik trupa, odabir materijala i konfiguraciju prema stvarnoj namjeni daske.'
      icon: tabler:engine
    - title: '3. Certificirana kvaliteta'
      description: 'CE certifikat, ISO sustav kvalitete, BSCI sukladnost, REACH sukladnost, USCG odobrenje. Svaki proizvod ispunjava međunarodne standarde — ne samo tvrdnje.'
      icon: tabler:certificate
    - title: '4. Fleksibilno zajedničko brendiranje'
      description: 'Boje rubova, raspored površine, brendiranje, pakiranje — prilagođavamo vašim specifikacijama. Bez pritiska minimalne narudžbe. Počnite s prototipom, skalirajte s povjerenjem.'
      icon: tabler:adjustments
    - title: '5. Globalna logistika'
      description: 'Američko skladište u Kaliforniji, izravna otprema iz Qingdaoa, zračni teret za hitne narudžbe. Vodimo carinsku dokumentaciju i papirologiju.'
      icon: tabler:truck-delivery
    - title: '6. Doživotna podrška'
      description: 'Podržavamo daske koje smo izradili prije 20 godina. Originalni rezervni dijelovi, tehnički savjeti, smjernice za popravak — naš tim je dostupan kada nam treba.'
      icon: tabler:lifebuoy
    - title: '7. Iskrene specifikacije'
      description: 'Stvarne ocjene nosivosti, stvarne dimenzije, stvarna težina. Bez marketinškog napuhivanja. Ono što objavljujemo jest ono što dobivate — potvrđeno neovisnim ispitivanjima.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Povjerenje brendova širom svijeta'
  title: 'Što kažu naši partneri'
  items:
    - content: 'Suradivali smo s nekoliko proizvođača u Kini, ali se afarer ističe svojom inženjerskom podrškom i dosljednom kvalitetom. Tretiraju naš brend kao svoj.'
      name: '— Partner u zajedničkom brendiranju, europski brend vodenih sportova'
    - content: 'Njihove SUP daske u našoj su floti više od 5 godina. Minimalno održavanje, izvrsna UV otpornost. Peterogodišnje jamstvo daje nam povjerenje.'
      name: '— Operater flote, grupa bliskoistočnih odmarališta'
    - content: 'Tim afarer pomogao nam je razviti prilagođen dizajn SUP daske od koncepta do proizvodnje u 90 dana. Kvaliteta je premašila naša očekivanja.'
      name: '— Distributer, australski vodeni sportovi'

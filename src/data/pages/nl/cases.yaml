features3_cases:
  tagline: Uitgelichte cases
  title: Maatwerk oplossingen<br />voor echte uitdagingen
  isBeforeContent: false
  columns: 3
  items:
    - title: Europese duikcentrumvloot
      customer: BlueMed Duikcentra
      country: Griekenland
      industry: Duiken & Maritiem Toerisme
      challenge: >-
        Vereist: 12 duik-geconfigureerde SUP's voor een keten van duikcentra op meerdere Griekse eilanden. Elk board moest voorzien zijn van aangepaste uitrustingsbevestiging, opslag voor 8 tanks en een stabiel platform voor het betreden van open water door duikers. De vloot moest binnen 60 dagen
        arriveren voor het begin van het toeristenseizoen.
      solution: >-
        12 SUP Voyager Dive-modellen geproduceerd met geïntegreerde uitrustingsrekken, stabiele platforms en extra brede drop-stitch constructie voor instapstabiliteit. Elk board was voorzien van de klantenvloot-livery. Alle 12 boards zijn drukgecontroleerd en binnen 55 dagen vanuit Qingdao
        verzonden.
      product: SUP Voyager Duik
      results: Alle 12 borden op tijd geleverd voor het toeristenseizoen. De vloot is al 18 maanden dagelijks in gebruik zonder materiële storingen. De klant heeft in het tweede jaar 6 extra eenheden besteld.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: De SUP Voyager Dive is de ruggengraat van onze dagelijkse duikactiviteiten geweest. De stabiliteit is uitstekend en de indeling van de uitrustingsopslag houdt het dek schoon en veilig voor onze gasten.
      icon: tabler:lifebuoy
    - title: Australisch distributeur co-brand-programma
      customer: Pacific Watersports Pty Ltd
      country: Australië
      industry: Co-brand- & Partnerschapsprogramma
      challenge: >-
        Een Australische distributeur had een private-label SUP-boardlijn nodig tegen concurrerende prijzen om te kunnen concurreren met Chinese direct-to-consumer merken. Er waren 8 unieke modellen nodig, van beginner tot gevorderd, met aangepaste graphics, aangepaste verpakking en drop-ship
        levering aan winkels.
      solution: >-
        Ontwikkeld 8 SUP-modellen (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) met exclusief Australisch grafisch pakket. Aangepaste detailhandelverpakking met QR-codes die linken naar installatievideo's. Drop-ship logistiek geconfigureerd van Qingdao
        rechtstreeks naar Australische winkels.
      product: Aangepaste SUP-lijn (8 modellen)
      results: Van concept tot eerste verzending in 90 dagen. Detailhandelsverkoopgraad van 85% in het eerste seizoen. Distributeur breidde de samenwerking uit om extra SUP-modellen op te nemen in het tweede jaar.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Afarer leverde een complete SUP-lijn in 90 dagen — van het eerste ontwerp tot op de winkelvloer. De kwaliteit komt overeen met merken die voor het dubbele van de prijs verkopen.
      icon: tabler:currency-dollar
    - title: Reddingsbootleveringen Midden-Oosten
      customer: Nationale Civiele Verdedigingsautoriteit
      country: Verenigde Arabische Emiraten
      industry: Zoek- en reddingsoperaties
      challenge: De civiele defensieorganisatie had 20 patrouilleklare SUP's nodig voor kustzoek- en reddingsoperaties, havenbeveiliging en overstromingsrespons. Vereist waren boards met hoge zichtbaarheid, volledige veiligheidsuitrusting en naleving van de lokale maritieme regelgeving.
      solution: >-
        20 SUP Patrol-modellen geleverd met hoogzichtbare oranje drop-stitch constructie, volledige veiligheidsuitrusting, SOLAS-reflecterende tape en versterkte constructie. Elk board was CE-gecertificeerd en getest volgens de toepasselijke normen. Het documentatiepakket bevatte
        conformiteitscertificaten voor lokale registratie.
      product: SUP-patrouille
      results: Vloot ingezet over 5 kuststations. Borden hebben gewerkt bij extreme hitte (45°C) zonder achteruitgang. Prestaties en duurzaamheid hebben de specificaties overtroffen.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: De SUP-patrouille overtrof onze operationele vereisten. Bij extreme hitte vertonen de boards na 24 maanden dagelijks gebruik geen tekenen van UV-achteruitgang.
      icon: tabler:alert-triangle
    - title: Europees co-brand-partnerschap
      customer: Noordzee Marine Equipment BV
      country: Nederland
      industry: Co-brand- & Partnerschapsprogramma
      challenge: >-
        Een gevestigd Europees maritiem merk wilde uitbreiden naar de SUP-markt zonder te investeren in productiefaciliteiten. Ze hadden een white-label partner nodig die in staat was om 5 SUP-modellen (van 9 ft tot 12 ft) te produceren met privélabel, CE-certificering en exclusieve
        distributierechten in de EU.
      solution: >-
        Opgesteld white-label productiecontract voor 5 SUP-modellen. Elk model gebrandmerkt met klantlogo's en kleurenschema. CE-certificeringsdocumentatie voorbereid voor elk model. Exclusieve distributierechten in de EU verleend met minimale bestelplichten. Technische documentatie geleverd voor
        lokaal servicenetwerk.
      product: Aangepaste SUP-lijn (5 modellen)
      results: Meerjarig akkoord ondertekend. Eerste productierun van 50 eenheden binnen 75 dagen verzonden. Merk gelanceerd op grote handelsbeurs met positieve ontvangst door dealers.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Het samenwerken met Afarer stelde ons in staat de SUP-markt te betreden zonder een fabriek te bouwen — ze leverden een complete turnkey-oplossing met CE-certificering en documentatie voor dealerondersteuning.
      icon: tabler:building
    - title: Caribische resortvloot
      customer: Paradise Island Resorts Ltd
      country: Bahama's
      industry: Marine Toerisme & Gastvrijheid
      challenge: >-
        Luxueus resort had een complete vloot van watersportuitrusting nodig voor gastenactiviteiten: 40 SUP-boards voor begeleide tochten, 20 extra SUP's voor laguneverkenning, 10 SUP-boards voor gastenexcursies, plus accessoires. Alle uitrusting moest voorzien zijn van aangepaste resortbranding en
        moest worden geleverd vóór het hoogseizoen.
      solution: >-
        Volledige SUP-pakket geproduceerd: 40 SUP Voyager boards (All-Around model), 20 SUP Explorer boards, 10 SUP Touring boards, plus reddingsvesten, peddels, pompen en reparatiesets. Alle uitrusting bedrukt met resortlogo en tropisch kleurenschema. Containerverzending met volledige
        inventarislijst.
      product: Volledig SUP-pakket (70 eenheden)
      results: Vloot arriveerde 6 weken voor het hoogseizoen. Tevredenheidsscores van gasten voor watersportactiviteiten zijn met 40% gestegen ten opzichte van het voorgaande jaar. Apparatuur heeft 3 seizoenen meegemaakt met alleen routinematig onderhoud.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: De benadering van het complete pakket betekende dat we alles wat we nodig hadden in één levering ontvingen — borden en accessoires allemaal met merknaam en klaar voor gebruik door gasten. Onze gasten zijn dol op de kwaliteit van de apparatuur.
      icon: tabler:beach
    - title: US-kustpatrouillecontract
      customer: Atlantische Kustbeveiligingsagentschap
      country: Verenigde Staten
      industry: Maritieme Veiligheid & Handhaving van de Wet
      challenge: De Amerikaanse kustwacht had zware patrouille-SUP's nodig voor operaties op open water. Er waren high-performance boards nodig met militair-specifieke uitrusting en conformiteit met de voorschriften van de Amerikaanse kustwacht.
      solution: Geconstrueerde SUP-patrouille met versterkte drop-stitch constructie, opvallende kleurenschema's, gemonteerde communicatieapparatuur met encryptie en geïntegreerde bevestigingspunten voor uitrusting. Boards versterkt voor zwaar gebruik. Documentatie voor naleving van USCG verstrekt.
      product: SUP-patrouille
      results: Het agentschap meldde een missieparaathheidspercentage van 95% gedurende de eerste 12 maanden. Extra bestelling geplaatst voor 8 eenheden.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: De SUP-patrouille biedt onze crews de prestaties die nodig zijn voor operaties op open water. De versterkte constructie zorgt voor cruciale duurzaamheid zonder het manoeuvreren te belemmeren.
      icon: tabler:shield

hero:
  tagline: "Casestudy's"
  title: 'Echte projecten, echte resultaten<br />—afarer in actie'
  subtitle: 'Ontdek hoe afarer samenwerkt met distributeurs, merken en operators wereldwijd om op maat gemaakte maritieme oplossingen te leveren voor elke toepassing.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: "afarer casestudy's —op maat gemaakte maritieme productieprojecten"
features3_cases:
  tagline: 'Uitgelichte cases'
  title: 'Maatwerk oplossingen<br />voor echte uitdagingen'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Europese duikcentrumvloot'
      description: 'Levering van 12 SUP 520 duikgeconfigureerde boten aan een Mediterrane duikcentrumketen. Aangepaste tankrekken, duikladders en vlootbranding. Geleverd in 60 dagen.'
      icon: tabler:lifebuoy
    - title: 'Australisch distributeur OEM-programma'
      description: 'Ontwikkeling van een private-label SUP-boardreeks voor een Australische watersportdistributeur. 8 modellen, maatwerk verpakking en drop-ship logistiek. Van concept tot eerste zending in 90 dagen.'
      icon: tabler:currency-dollar
    - title: 'Reddingsbootleveringen Midden-Oosten'
      description: 'Levering van 20 SUP 450 Patrol-boten aan een civiele defensieorganisatie in het Midden-Oosten. Zelflozende dekken, volledige navigatie-uitrusting en feloranje slangen. Naleving van lokale regelgeving.'
      icon: tabler:alert-triangle
    - title: 'Europees OEM-merkenpartnerschap'
      description: 'White-label productiepartnerschap met een Europees maritiem merk. 5 SUP-modellen, private branding, exclusieve distributierechten voor de EU-markt. Meerjarige overeenkomst.'
      icon: tabler:building
    - title: 'Caribische resortvloot'
      description: 'Compleet watersportuitrustingspakket voor een Caribisch resort: 40 SUP-boards, 20 kajaks, 10 opblaasbare boten en accessoires. Aangepaste resortbranding op alle uitrusting.'
      icon: tabler:beach
    - title: 'US-kustpatrouillecontract'
      description: 'Levering van SUP 600 patrouilleboten aan een Amerikaans kustveiligheidsagentschap. Tweetrapsmotorconfiguratie, gepantserde console-opties en militaire elektronica-integratie.'
      icon: tabler:shield
cta:
  title: 'Heeft u een project dat u wilt bespreken?'
  subtitle: 'Elk afarer-partnerschap begint met een gesprek. Vertel ons uw vereisten en wij ontwikkelen een oplossing.'
  actions:
    - variant: primary
      text: 'Start uw project'
      href: /contact
    - text: 'Bekijk onze mogelijkheden'
      href: /brand/marine-expertise

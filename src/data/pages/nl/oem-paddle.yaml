faqs:
  title: 'FAQ over OEM-productie van paddleboards'
  subtitle: 'Antwoorden op de meest gestelde vragen van merken die hun eigen paddleboard lanceren.'
  items:
    - title: 'Hoe maak ik mijn eigen paddleboardmerk?'
      description: 'Lanceer uw merk in 16 weken: briefing, ontwerp, CE-gecertificeerd prototype, massaproductie en levering. Ontdek onze OEM-pakketten.'
    - title: 'Wat is de levertijd van de productie?'
      description: 'Het monster is klaar in 2-3 weken, massaproductie in 30-45 dagen, afhankelijk van het volume.'
    - title: 'Draagt het paddleboard ons logo?'
      description: 'Ja — volledig private label: logodruk, eigen kleuren, verpakking en labels in uw merk.'
    - title: 'Kan ik vanaf dag één groothandel aanschaffen?'
      description: 'De MOQ is 50 stuks voor standaardmodellen, met groothandelsprijsschalen naarmate het volume toeneemt.'

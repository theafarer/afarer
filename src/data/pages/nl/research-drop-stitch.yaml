  title: Hoe Drop Stitch Werkt — De Techniek Achter Oplaadbare Starre Kern
  subtitle: 8 minuten lezen
content_html: |-
  <h2>Wat is drop stitch?</h2>
  <p>Drop stitch (ook wel "drop-stitch stof" of "drop-stitch kern" genoemd) is een constructiemethode waarbij duizenden afzonderlijke polyesterdraden de boven- en onderlaag van een stofomhulsel met elkaar verbinden. Wanneer het omhulsel wordt opgeblazen, fungeren deze draden als interne trekverbindingen — ze voorkomen dat de boven- en onderpanelen naar buiten uitbollen tot een ronde vorm, waardoor het paneel vlak en stijf blijft.</p>
  <p>Het resultaat is een lichtgewicht, draagbare constructie die een interne druk van 15 – 20 PSI kan weerstaan — vergelijkbaar met de stijfheid van een hardboard, maar volledig leeg te laten lopen voor opslag en transport.</p>

  <h2>Hoe het werkt: de fysica</h2>
  <p>Bij een conventionele opblaasbare constructie (zoals een ballon of een luchtbed) duwt de interne luchtdruk gelijkmatig in alle richtingen. Zonder interne beperking wordt de constructie cilindrisch of bolvormig. Drop stitch lost dit op door trekversterking toe te voegen:</p>
  <ul>
    <li>Duizenden draden verbinden de boven- en onderstoflaag</li>
    <li>Bij het opblazen probeert de luchtdruk de boven- en onderkant uit elkaar te duwen</li>
    <li>De draden weerstaan deze scheiding en brengen de belasting over in spanning langs de draadas</li>
    <li>Het resultaat is een vlak, stijf paneel dat buigen weerstaat</li>
  </ul>

  <h2>Bouwproces</h2>
  <ol>
    <li><strong>Weven:</strong> Polyesterdraden worden gelijktijdig geweven in twee afzonderlijke lagen basisstof (doorgaans 1,100 DTEX of 1,680 DTEX PVC-gecoat polyester). De draden worden tussen de lagen doorgewoven in een hoek van 90&deg;.</li>
    <li><strong>Coating:</strong> De geweven basisstof wordt gecoat met PVC (of af en toe TPU) via een mescoating- of kalandercoatingproces. Dit sluit de draden af en vormt het luchtdichte membraan.</li>
    <li><strong>Laagverlijming:</strong> De drop-stitch kern wordt met de buitenste gelaagde lagen (doorgaans 0,9 mm of 1,2 mm PVC) verbonden via hittrelaminatie of lijm.</li>
    <li><strong>Lassen:</strong> Zijbanden worden langs de randen gelast met hete-lucht lassen, RF-lassen of hoogfrequent lassen om de zijwanden van de plank te creëren.</li>
    <li><strong>Klepinstallatie:</strong> Boston-kleppen of Halkey-Roberts-kleppen worden geïnstalleerd, doorgaans met een overdrukmechanisme om overmatig oppompen te voorkomen.</li>
  </ol>

  <h2>Belangrijke kwaliteitsindicatoren</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Instapniveau</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Draaddichtheid</td><td class="p-3 border">1 draad / vierkante inch</td><td class="p-3 border">2 draden / vierkante inch</td></tr>
      <tr><td class="p-3 border">Basisstof</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Maximale druk</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC-dikte</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 border">Constructie zijband</td><td class="p-3 border">Gevouwen &amp; gelijmd</td><td class="p-3 border">Gelast &amp; fusieverbonden</td></tr>
    </tbody>
  </table>

  <h2>Toepassingen</h2>
  <ul>
    <li><strong>SUP-planken:</strong> 4" – 6" dikte, 15 – 20 PSI, 1 – 2 draden/vierkante inch</li>
    <li><strong>Kajaks:</strong> Drop-stitch vloer + opblaasbare zijcompartimenten, 10 – 15 PSI vloer</li>
    <li><strong>RIB-vloeren:</strong> Drop-stitch vloeren voor lichtgewicht, opvouwbare RIB-tenders, 12 – 18 PSI</li>
    <li><strong>Bootfenders:</strong> Lage-druk drop stitch voor gevormde fenders met platte zijvlakken</li>
  </ul>

  <h2>Drop stitch vs. air deck (kern van glasvezel of hout)</h2>
  <p>Hardboards gebruiken EPS-schuimkernen met versteviging van glasvezel of houten stringers. Ze zijn lichter, stijver en responsiever — maar ze kunnen niet worden leeggelaten. Drop stitch ruilt wat stijfheid in voor volledige draagbaarheid. Voor de meeste recreatieve gebruikers zijn moderne drop-stitch SUPs op 20 PSI qua stijfheid niet te onderscheiden van instapniveau hardboards.</p>

  <h2>Hoe afarer drop stitch gebruikt</h2>
  <p>afarer gebruikt een 1,680 DTEX drop-stitch kern in het hele SUP-gamma, met 2 draden per vierkante inch en een buitenste PVC-laminaat van 1,2 mm. De planken zijn gecertificeerd voor 20 PSI en ondergaan voor verzending een 24–48-uurs druktest bij 1,25x de nominale druk. De zijbanden worden met hete lucht gelast met een drievoudige fusie en overdrukventielen zijn standaard op alle modellen.</p>

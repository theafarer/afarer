  <h2>Toepassingen</h2>

  <ul>
    <li><strong>SUP-platen:</strong> 4" – 6" dikte, 15 – 20 PSI, 1 – 2 schroefdraad per vierkante inch</li>
    <li><strong>Kajaks:</strong> Drop-stitch vloer opblaasbare zijkamers, 10 – 15 PSI vloer</li>
    <li><strong>RIB-vloeren:</strong> Drop-stitch vloeren voor lichtgewicht, opvouwbare RIB-tenders, 12 – 18 PSI</li>
    <li><strong>Bootspatborden:</strong> Laagdruk-drop stik voor gevormde spatborden met vlakke vlakken</li>
  </ul>


  <h2>Drop stitch vs. Air Deck (glasvezel of houten kern)</h2>

  <p>Hardshell-platen gebruiken EPS-schuimkernen met glasvezel- of houtstringerversterking. Ze zijn lichter, stijver en reageren beter — maar ze kunnen niet worden leeggelaten. Drop stitch ruilt wat stijfheid in voor volledige draagbaarheid. Voor de meeste recreatieve gebruikers zijn moderne
  drop-stitch SUP's van 20 PSI qua stijfheid niet te onderscheiden van instapmodellen met harde planken.</p>


  <h2>Hoe Afarer Drop Stitch gebruikt</h2>

  <p>Afarer gebruikt een 1.680 DTEX drop-stitch kern over zijn SUP-lijn, met 2 draden per vierkante inch en een 1,2 mm PVC buitenlaminaat. De boards zijn beoordeeld op 20 PSI en ondergaan een 24-uurs druktest bij 1,5x de nominale druk vóór verzending. Railbanden zijn warme-lucht gelast met
  drievoudige fusie, en drukaflastkleppen zijn standaard bij alle modellen.</p>

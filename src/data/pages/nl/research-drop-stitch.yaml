  title: Hoe Drop Stitch Werkt — De Techniek Achter Oplaadbare Starre Kern
  subtitle: 8 minuten lezen
content_html: >
  <h2>Wat is Drop Stitch?</h2>

  <p>Drop stitch (ook wel "drop-stitch stof" of "drop-stitch core" genoemd) is een constructiemethode waarbij duizenden individuele polyesterdraden de bovenste en onderste lagen van een stoffen schil met elkaar verbinden. Wanneer de behuizing wordt opgeblazen, fungeren deze schroefdraadjes als
  interne spanningselementen — ze voorkomen dat de boven- en onderpanelen naar buiten uitpuilen tot een ronde vorm, waardoor het paneel vlak en stijf blijft.</p>

  <p>Het resultaat is een lichtgewicht, draagbare constructie die 15 – 20 PSI interne druk kan weerstaan — vergelijkbaar met de stijfheid van een hardshell-board, maar volledig ontlapbaar voor opslag en transport.</p>


  <h2>Hoe het werkt: De natuurkunde</h2>

  <p>In een conventioneel opblaasbaar bouwwerk (zoals een ballon of een luchtmatras) duwt de interne luchtdruk gelijkmatig in alle richtingen. Zonder interne beperking wordt de structuur cilindrisch of bolvormig. Drop stitch lost dit op door trekversterking toe te voegen:</p>

  <ul>
    <li>Duizenden draden verbinden de bovenste en onderste stoffen lagen</li>
    <li>Wanneer opgeblazen, probeert de luchtdruk de boven- en onderkant uit elkaar te duwen</li>
    <li>De schroefdraad weerstaat deze scheiding en brengt de belasting over in spanning langs de schroefdraadas</li>
    <li>Het resultaat is een vlak, stijf paneel dat buiging weerstaat</li>
  </ul>


  <h2>Bouwproces</h2>

  <ol>
    <li><strong>Weven:</strong> Polyesterdraden worden gelijktijdig geweven in twee aparte lagen basisstof (meestal 1.100 DTEX of 1.680 DTEX PVC-gecoat polyester). De draden zijn met lus geweven tussen de lagen onder een hoek van 90°.</li>
    <li><strong>Coating:</strong> De geweven basisstof wordt gecoat met PVC (of soms TPU) met behulp van een mescoating of kalendercoating. Dit sluit de schroefdraad af en creëert het luchtdichte membraan.</li>
    <li><strong>Laagbinding:</strong> De drop-stitch kern wordt met behulp van warmtelaminering of lijm vastgemaakt aan de buitenste gelamineerde lagen (meestal 0,9 mm of 1,2 mm PVC).</li>
    <li><strong>Lassen:</strong> Railbanden worden langs de randen gelast met behulp van heteluchtlassen, RF-lassen of hoogfrequente lassen om de zijwanden van het bord te creëren.</li>
    <li><strong>Klepinstallatie:</strong> Boston-kleppen of Halkey-Roberts-kleppen worden geïnstalleerd, meestal met een drukaflastingsmechanisme om overmatige inflatie te voorkomen.</li>
  </ol>



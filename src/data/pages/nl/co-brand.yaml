features:
  title: 'Wat co-branding bij Afarer betekent'
  subtitle: 'Co-branding is ons ontwerppartnerschapsprogramma — opgebouwd rond het merk Afarer, bescherming van territorium en gelimiteerde collecties, niet ongemerkte productie.'
  columns: 3
  items:
    - title: 'Afarer-producten blijven Afarer-producten'
      description: 'Een co-brand collectie is een gelimiteerde editie van Afarer-boards met uw identiteit erin geweven. Nooit ongemerkt, nooit een derdemerksmerk en nooit een open private label-programma.'
      icon: 'tabler:trademark'
    - title: 'Ontworpen met u'
      description: 'Uw kleuren, naming en verhaal vormen de collectie. Ons ontwerp- en engineeringteam verzorgt decks, grafiek, verpakking en documentatie van briefing tot levering.'
      icon: 'tabler:pencil'
    - title: 'Voor clubs, resorts, evenementen & gemeenschappen'
      description: 'Vlootcollecties voor paddleclubs en resorts, evenementedities voor races en communityseries — allemaal met de kwaliteit en garantie van Afarer.'
      icon: 'tabler:users'
    - title: 'Beschermt landpartners'
      description: 'Co-branding draait naast ons model van één land, één distributeur. Nationale partners behouden hun territorium; co-brand collecties openen de deur niet voor parallelle merken in hun markt.'
      icon: 'tabler:shield-check'
    - title: 'Engineering & kwaliteitsnormen'
      description: 'Elke collectie verlaat onze gecertificeerde toeleveringsketen met CE- en ISO 9001-documentatie, druktests en dezelfde QC-controlepunten als onze kerncollectie.'
      icon: 'tabler:certificate'
    - title: 'Wordt een merkactivum'
      description: 'Een gelimiteerde co-brand collectie bouwt uw eigen verhaal op het water — verkoopmarge, media-inhoud en een reden voor paddelaars om seizoen na seizoen terug te komen.'
      icon: 'tabler:star'
table:
  title: 'Niveaus van co-brand collecties'
  subtitle: 'Typische voorwaarden van een co-brand collectie. Prijzen in USD, FOB Qingdao. Eigen deckontwerpen voegen 15–20 werkdagen ontwikkeling toe; nieuwe mallen worden per project geprijsd.'
  caption: 'Alle co-brand producten blijven Afarer-producten en dragen de merkidentiteit van Afarer. Projectomvang, exclusiviteitsperiode en definitieve voorwaarden worden vastgelegd in de Co-Brand Project Agreement.'
  head:
    - Co-brand niveau
    - Minimumorder (stuks)
    - Levertijd
    - Betaling
  rows:
    - [Pilotcollectie, 30–50, 30–45 werkdagen, 30% aanbetaling / 70% vóór verzending]
    - [Standaard co-brand collectie, 50–100, 30–45 werkdagen, 30% aanbetaling / 70% vóór verzending]
    - [Grote / multiregionale collectie, 100+, 45–60 werkdagen, 30% aanbetaling / 70% vóór verzending]
    - [Nieuwe mal of diepe lokalisering, 200+, 60–90 werkdagen, 30% aanbetaling / 70% vóór verzending]
faqs:
  title: 'Co-Brand — FAQ'
  subtitle: 'Hoe co-branding bij Afarer werkt en hoe het zich verhoudt tot OEM en private label.'
  items:
    - title: 'Is co-branding hetzelfde als OEM of private label?'
      description: 'Nee. Afarer heeft geen open OEM/private label-programma meer. Co-brand producten blijven Afarer-producten — ontworpen, ontwikkeld, kwaliteitsgecontroleerd en gedragen door het merk Afarer. Uw identiteit verschijnt als co-brand, niet als een ongemerkt derdemerksproduct.'
    - title: 'Wie kan een co-brand project starten?'
      description: 'Gekwalificeerde watersportbedrijven: bestaande landpartners, paddleclubs, resorts en hotels, evenementenorganisatoren en gemeenschappen. Stuur ons een projectbrief en wij bevestigen de geschiktheid vóór het ontwerpwerk begint.'
    - title: 'Botst co-branding met mijn landdistributeur?'
      description: 'Nee. Het model van één land, één distributeur heeft voorrang. Co-brand collecties worden afgestemd met de lokale landpartner waar die bestaat, zodat er geen parallel of concurrerend merk verschijnt binnen een beschermd territorium.'
    - title: 'Wat is de minimumorder voor een co-brand collectie?'
      description: 'Pilotcollecties beginnen bij 30–50 stuks. Standaardcollecties zijn 50–100 stuks; grote of multiregionale edities zijn 100+ stuks. Tijdlijnen voor ontwikkeling op maat worden per project afgesproken.'
    - title: 'Wat is Afarer-kwaliteit en wat is partnerinzet?'
      description: 'Afarer bezit productontwerp, engineering, materialen, constructie, QC en garantie. Partners dragen bij met het collectieconcept, naming, kleuren, grafische inbreng en go-to-market. Zo blijft er één kwaliteitsnorm op het water.'
    - title: 'Hoe dien ik een aanvraag in?'
      description: 'Vul het co-brand aanvraagformulier in met uw bedrijf, markt en collectie-idee. Wij beoordelen de fit en reageren binnen 3 werkdagen met een voorstel en de Co-Brand Project Agreement.'

meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Peddelclubleden op bijpassende Afarer SUP-boards
benefits:
  title: Clubvlootvoordelen
  subtitle: Waarom peddelclubs in meer dan 50 landen Afarer kiezen als hun uitrustingspartner.
  items:
    - metric: 40%
      label: Vlootkostenbesparingen
      detail: Vs. detailhandelprijzen met kortingen bij bulkclubs
    - metric: 48u
      label: Onderdelenvervanging
      detail: Minimale stilstand voor uw huurvloot
    - metric: Vijfhonderd
      label: Verhuurcycli
      detail: Commerciële duurzaamheid per bord
    - metric: 5 jaar
      label: Vlootlevensduur
      detail: Met goed onderhoud en zorg
packages:
  title: Clubvlootprogramma's
  subtitle: Kies het vlootprogramma dat past bij de grootte en ambitie van uw club.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Launch guide + safety checklist
        - Lanceringgids veiligheidschecklist
        - CE-gecertificeerd — alle apparatuur
      cta_text: Start je club
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Replacement parts program (15% discount)
        - Staff training session
        - Personeelstraining sessie (online)
        - CE-gecertificeerd — alle apparatuur
      popular: true
      cta_text: Bouw je vloot
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50 race- / prestatieborden
        - Full accessory set
        - Event support kit
        - Prioritaire onderdelen (24u verzending)
        - Toegewijde accountmanager
        - Optie voor aangepaste teamuniformen
        - CE-gecertificeerd — alle apparatuur
      cta_text: Krijg Concurrentievloot
training:
  title: Trainingscentrum Pakketten
  subtitle: Alles wat een SUP-school nodig heeft om professionele certificeringscursussen te geven.
  items:
    - name: Instructor Starter
      features:
        - 5 premium SUP-borden (instructeurklasse)
        - 5 koolstofpeddels voor demonstraties
        - 5 reddingsvesten (instructeur pasvorm)
        - Trainingscurriculumgids
        - CE-gecertificeerde apparatuur
    - name: School Full Set
      features:
        - 20 SUP-boards (mix van studenten en instructeurs)
        - 20 peddels   20 zwemvesten (verschillende maten)
        - 10 drijfhulpmiddelen voor beginners
        - 4 pompen   reparatiesets
        - Opleidingscurriculum & certificeringsondersteuning
        - CE-gecertificeerde apparatuur
features:
  title: Waarom clubs Afarer kiezen
  subtitle: Consistente kwaliteit, snelle onderdelen en bulkprijzen ontworpen voor groeiende clubs.
  items:
    - title: 500 Verhuur Fietsen
      description: Commerciële kwaliteit borden overleven seizoenen van dagelijks gebruik.
      icon: tabler:shield-check
    - title: Aangepaste kleuren
      description: Stem de identiteit van je club af op aangepaste bordkleuren en logo.
      icon: tabler:palette
    - title: Korting bij afname in bulk
      description: Hoeveelheidskortingen voor vlootbestellingen van 10 borden.
      icon: tabler:discount
    - title: Snelle Onderdelen
      description: Vervangende onderdelen worden binnen 48 uur verzonden.
      icon: tabler:truck-delivery
    - title: Ondersteuning voor clubgroei
      description: Advies over lidmaatschapsprogramma's, prijzen en het organiseren van evenementen.
      icon: tabler:trending-up
    - title: CE-gecertificeerd
      description: Alle apparatuur voldoet aan internationale veiligheidsnormen.
      icon: tabler:certificate
cta:
  title: Klaar om je paddleclub te bouwen?
  subtitle: Krijg uw offerte voor clubvloot of download onze clubstartergids.
  actions:
    - text: Aanmelden voor Club Fleet
      href: /contact?package=club
      variant: primary
    - text: Clubgids downloaden
      href: /resources/download-catalog
      variant: secondary

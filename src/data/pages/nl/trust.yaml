warranty_section:
  title: Garantie & Klantenservice na aankoop
  subtitle: We staan achter elk product met duidelijke garantievoorwaarden, snelle afhandeling van claims en echte vervangingsonderdelen.
  items:
    - title: 2 jaar productgarantie
      desc: Alle Afarer-producten hebben een garantie van 2 jaar tegen fabricagefouten — het falen van naden, klepdefecten en het loslaten van materiaal bij normaal gebruik.
    - title: Levenslange onderdelenondersteuning
      desc: Echte vervangingsonderdelen — kleppen, reparatiesets, vinnen, D-ringen — beschikbaar voor alle modellen. We behouden mallen en gereedschappen gedurende minimaal 5 jaar na het einde van de productie.
    - title: 48-Uurs claimreactie
      desc: Garantiekwesties worden binnen 48 uur erkend. Vervangende borden worden binnen 10 werkdagen verzonden voor goedgekeurde claims.
    - title: Globaal Reparatienetwerk
      desc: Geautoriseerde reparatiecentra in 15 landen. Reparatiesets voor veldwerk beschikbaar voor operaties op afstand. Doe-het-zelf reparatiehandleidingen voor kleine schade.
    - title: OEM Klantenservice
      desc: Toegewijde accountmanagers voor B2B-partners. Kwartaalreviews van de bedrijfsvoering, voorraadsplanning en co-branded marketingondersteuning.
    - title: Certificeringspakket
      desc: Volledige nalevingsdocumentatie wordt bij elke verzending geleverd — CE-verklaring, testrapporten, veiligheidsinformatiebladen van materialen.
      link: /contact

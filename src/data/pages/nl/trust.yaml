faqs_sup:
  title: SUP Board FAQ
  subtitle: Veelgestelde vragen over onze stand-up paddle boards.
  columns: 2
  items:
    - title: Welke SUP board maten zijn beschikbaar?
      description: We bieden SUP boards van 9 ft tot 12 ft, inclusief all-round, touring, yoga en speciale ontwerpen. Onze bestverkochte modellen zijn de Tropical Breeze (10 ft) en Ocean Voyager (11 ft).
    - title: Wat is drop-stitch constructie?
      description: Drop-stitch constructie gebruikt duizenden polyesterdraden die de bovenste en onderste lagen van het board verbinden, waardoor het hoge luchtdruk (15–20 PSI) kan vasthouden en een stijf, stabiel platform biedt. Dit is de industrienorm voor premium opblaasbare SUPs.
    - title: Wat is de gewichtslimiet voor SUP boards?
      description: Onze SUP boards ondersteunen tot 150 kg, afhankelijk van het model en volume. De Leviathan Wake is ons model met de hoogste capaciteit, ontworpen voor grotere rijders en yogagebruik.
    - title: Bieden u complete SUP-pakketten?
      description: Ja. Elk SUP board wordt geleverd met een compleet pakket inclusief een 3-delige aluminium peddel, hogedruk handpomp, spiraallijn, reisrugzak en reparatieset. Sommige modellen bevatten ook een verwijderbare vinenset.
    - title: Wat is de garantie op SUP boards?
      description: Alle afarer SUP boards hebben een eenjarige garantie tegen productiefouten, inclusief naadfalen, klepdefecten en materiaaldelaminatie onder normaal gebruik.
    - title: Hoe lang duurt het om een SUP board op te blazen?
      description: Met de meegeleverde handpomp duurt een volledige inflatie tot 15 PSI ongeveer 8–12 minuten. Voor snellere inflatie raden we onze afarer 12V elektrische pomp aan, die een board in minder dan 4 minuten ophlaast.
faqs_materials:
  title: SUP Materiaal & Verzorging Veelgestelde Vragen
  subtitle: Veelgestelde vragen over onze opblaasbare SUP-materialen, verzorging en opslag.
  columns: 2
  items:
    - title: Welke materialen worden gebruikt in Afarer opblaasbare SUP's?
      description: We gebruiken PVC van militaire kwaliteit (1100 denier) met UV-gestabiliseerde, slijtvaste constructie, in overeenstemming met EU REACH- en RoHS-regelgeving.
    - title: Hoe lang gaan opblaasbare SUP's mee?
      description: Bij goed onderhoud gaat een kwalitatieve PVC-opblaasbare SUP 5–10 jaar mee. Regelmatig schoonmaken, UV-bescherming en correcte opslag verlengen de levensduur aanzienlijk.
    - title: Welk onderhoud is vereist voor een opblaasbare SUP?
      description: Basisonderhoud omvat het spoelen met schoon water na elk gebruik (vooral in zout water), drogen voor opslag, jaarlijks controleren van de klepafdichtingen en het vermijden van langdurige blootstelling aan de zon wanneer het niet in gebruik is.
    - title: Kunnen opblaasbare SUP's in zout water worden gebruikt?
      description: Ja. Alle Afarer opblaasbare SUP's zijn ontworpen voor gebruik in zowel zoet- als zoutwater. We raden aan om na blootstelling aan zout water af te spoelen met zoet water en grondig te laten drogen.
    - title: Hoe bewaar ik een opblaasbare SUP?
      description: Laat de plank volledig leeglopen, schoonmaken en drogen voordat u deze opbergt. Rol losjes op (vermijd strakke vouwen), bewaar op een koele, droge plaats uit direct zonlicht en houd van betonnen vloeren om vochtopname te voorkomen.
    - title: Wat is de draagkracht van Afarer opblaasbare SUP's?
      description: Het gewichtscapaciteit varieert van 100 kg voor onze kleinste modellen tot meer dan 200 kg voor grotere boards. Op elke productpagina staat de maximale draagkracht voor uw specifieke model vermeld.

  items:
    - title: 'CE-certificering'
      description: 'Alle afarer SUPs, kajaks, bijboten en RIBs voldoen aan de Europese CE-veiligheidsnorm voor recreatieve vaartuigen. Elk product ondergaat druk-, drijfvermogen- en belastingtests voordat het de fabriek verlaat.'

faqs_sup:
  title: SUP Board FAQ
  subtitle: Veelgestelde vragen over onze stand-up paddle boards.
  columns: 2
  items:
    - title: Welke SUP board maten zijn beschikbaar?
      description: We bieden SUP boards van 9 ft tot 12 ft, inclusief all-round, touring, yoga en speciale ontwerpen. Onze bestverkochte modellen zijn de Tropical Breeze (10 ft) en Ocean Voyager (11 ft).
    - title: Wat is drop-stitch constructie?
      description: Drop-stitch constructie gebruikt duizenden polyesterdraden die de bovenste en onderste lagen van het board verbinden, waardoor het hoge luchtdruk (15—0 PSI) kan vasthouden en een stijf, stabiel platform biedt. Dit is de industrienorm voor premium opblaasbare SUPs.
    - title: Wat is de gewichtslimiet voor SUP boards?
      description: Onze SUP boards ondersteunen tot 150 kg, afhankelijk van het model en volume. De Leviathan Wake is ons model met de hoogste capaciteit, ontworpen voor grotere rijders en yogagebruik.
    - title: Bieden u complete SUP-pakketten?
      description: Ja. Elk SUP board wordt geleverd met een compleet pakket inclusief een 3-delige aluminium peddel, hogedruk handpomp, spiraallijn, reisrugzak en reparatieset. Sommige modellen bevatten ook een verwijderbare vinenset.
    - title: Wat is de garantie op SUP boards?
      description: Alle afarer SUP boards hebben een eenjarige garantie tegen productiefouten, inclusief naadfalen, klepdefecten en materiaaldelaminatie onder normaal gebruik.
    - title: Hoe lang duurt het om een SUP board op te blazen?
      description: Met de meegeleverde handpomp duurt een volledige inflatie tot 15 PSI ongeveer 8—2 minuten. Voor snellere inflatie raden we onze afarer 12V elektrische pomp aan, die een board in minder dan 4 minuten ophlaast.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

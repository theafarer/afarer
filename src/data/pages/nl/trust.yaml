steps2_manufacturing:
  title: Hoe we kwaliteit waarborgen
  subtitle: Van grondstoffinspectie tot de uiteindelijke druktest —elk product doorloopt een rigoureuze kwaliteitsketen.
  items:
    - title: Grondstoffinspectie
      description: Elke rol PVC-stof wordt getest op dikte, treksterkte en UV-bestendigheid voordat het in productie gaat.
      icon: tabler:search
    - title: Proces-QC
      description: Lasnaden, klepinstallaties en kamerverbindingen worden bij elk station geïnspecteerd tijdens montage.
      icon: tabler:eye
    - title: Druktest
      description: Elk opblaasbaar product wordt opgeblazen tot 1,5x de nominale PSI en 24 uur vastgehouden om luchtdichtheid en naadintegriteit te verifiëren.
      icon: tabler:wind

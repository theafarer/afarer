features3_certifications:
  title: Certificeringen & Conformiteit
  subtitle: Elk product wordt onafhankelijk getest en gecertificeerd volgens internationale normen.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE-certificering
      description: Alle afarer SUPs, kajaks, bijboten en RIBs voldoen aan de Europese CE-veiligheidsnorm voor recreatieve vaartuigen. Elk product ondergaat druk-, drijfvermogen- en belastingtests voordat het de fabriek verlaat.
      icon: tabler:certificate
    - title: ''
      description: Onze 12.000 m² faciliteit in Qingdao werkt onder een  kwaliteitsmanagementsysteem. Elke productiebatch is traceerbaar, gedocumenteerd en geïnspecteerd.
      icon: tabler:clipboard-check
    - title: BSCI Sociale Conformiteit
      description: We zijn BSCI-gecertificeerd en waarborgen ethische arbeidspraktijken, veilige werkomstandigheden en milieuverantwoordelijkheid in onze hele toeleveringsketen.
      icon: tabler:users
    - title: REACH & RoHS
      description: Alle materialen —PVC, Hypalon, EVA-schuim, lijmen —voldoen aan EU REACH- en RoHS-regelgeving. Geen verboden stoffen, geen compromissen.
      icon: tabler:flask
    - title: Materiaal Testlab
      description: Ons interne laboratorium test treksterkte, UV-bestendigheid, naadintegriteit en slijtvastheid voor elke stofbatch vóór productie.
      icon: tabler:microscope
    - title: 2 Jaar Garantie
      description: Elk afarer product wordt geleverd met een tweejarige garantie tegen productiefouten. We staan achter wat we bouwen.
      icon: tabler:shield-check

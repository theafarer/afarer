hero_text:
  tagline: Contact
  title: NEEM CONTACT MET ONS OP
contact_form:
  id: form
  title: Stuur een bericht
  subtitle: Voor offertes, technische vragen of samenwerking —stuur ons een bericht. We reageren binnen één werkdag.
  email_to: info@afarer.com
  submit_button: Verzenden
  success_message: Bedankt! Je bericht is ontvangen. We reageren binnen één werkdag.
  error_message: Er is een fout opgetreden bij het verzenden. Probeer het opnieuw of stuur een e-mail rechtstreeks.
  default_country_code: '+1'
  captcha:
    label: 'Antispam: los de volgende som op'
  fields:
    - name: firstName
      label: Voornaam
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Achternaam
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Bedrijf
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Adres
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Postcode
      row: 4
      step: 2
    - name: country
      label: Land
      row: 4
      step: 2
    - name: email
      label: E-mail
      row: 5
      step: 2
    - name: tel
      label: Telefoon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Geschat bestelvolume
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Maatwerk nodig?
      row: 7
      step: 2
    - name: productInterest
      label: Interessante productcategorieën
      row: 8
      step: 2
    - name: subject
      label: Onderwerp
      row: 9
      step: 3
    - name: message
      label: Bericht
      row: 10
      type: textarea
      rows: 6
      step: 3

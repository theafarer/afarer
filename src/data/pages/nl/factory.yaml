qc_section:
  tagline: Kwaliteitscontrole
  title: Test- & Kwaliteitsborgingsproces
  subtitle: Elke boot ondergaat verplichte testen vóór verzending. Ons kwaliteitslaboratorium werkt onafhankelijk van de productie en rapporteert rechtstreeks aan het management.
  steps:
    - step: "1"
      title: Grondstoffenkeuring
      desc: PVC, Hypalon en drop-stitch stoffen ondergaan trekproeven (), scheurpropagatie en UV-bestendigheidsverificatie voordat een partij in productie gaat.
    - step: "2"
      title: 48-uurs Luchtretentietest
      desc: Elke buiskamer wordt opgeblazen tot 125% van de nominale druk en 48 uur vastgehouden. Drukdaling onder 5% leidt automatisch tot afkeuring en naadherkeuring.
    - step: "3"
      title: Laad- & Balanstest
      desc: Voltooide boten worden beladen tot maximale nominale capaciteit en getest op stabiliteit, vrijboord en handling. Elk vaartuig wordt watergetest vóór de eindkeuring.
oem_section:
  tagline: OEM-projecten
  title: Merk- & OEM-partnerschap Casestudies
  subtitle: Van concept tot container —hoe we wereldwijde merken helpen hun lijnen van opblaasbare vaartuigen te lanceren en schalen.
  cases:
    - challenge: Een Europese outdoor retailer had een private-label SUP-lijn nodig met unieke dek graphics, milieuvriendelijk PVC en retail-ready verpakking —alles geleverd in 60 dagen.
      solution: Ontwikkelde aangepaste digitale printbestanden, betrok REACH-conform PVC en verkortte sampling van 3 rondes naar 1 door het designteam op onze Qingdao-fabriek te plaatsen.
      result: 55 dagen van getekende PO tot FOB. 2.400 eenheden verspreid over 4 SKU's. Herhalingsorder geplaatst vóór aankomst van de eerste container.
    - challenge: Een Amerikaanse watersportstartup had een hoogwaardige drop-stitch kajak nodig met een aangepaste rompvorm, co-branded verpakking en BSCI-certificering voor retailplaatsing.
      solution: Paste de bestaande drop-stitch kajakmal aan met een gewijzigd rockerprofiel, ontwikkelde co-branded verpakkings artwork en leverde volledige BSCI-auditdocumentatie.
      result: Succesvol vermeld in 3 grote Amerikaanse outdoor-ketens. 5.000+ eenheden in het eerste jaar met 98% sell-through.
    - challenge: Een Australische distributeur had een CE-gecertificeerd SUP-assortiment nodig met aangepaste buiskleuren, Hypalon-upgradeoptie en naleving van de Australische norm AS 1799.
      solution: Produceerde preproductiemonsters met 4 buiskleurvarianten, betrok CSM Hypalon van een Japanse leverancier en coördineerde externe AS 1799-nalevingstesten.
      result: 3-model SUP-assortiment gelanceerd in de AU/NZ-markt. Gevolgd door een overheidsaanbesteding voor 12 patrouille-SUP's.
faq_section:
  tagline: FAQ
  title: B2B & OEM Veelgestelde Vragen
  questions:
    - q: Wat is de minimale bestelhoeveelheid (MOQ) voor OEM opblaasbare SUP-planken?
      a: MOQ begint bij 5—0 eenheden voor standaard OEM-modellen. Aangepaste mallen en private-label projecten vereisen minimaal 200 eenheden, afhankelijk van de complexiteit. Proefbestellingen en voorbeeldruns zijn beschikbaar voor nieuwe merkintroducties.
    - q: Heeft afarer een BSCI-certificering?
      a: Ja. Onze fabriek beschikt over een geldige BSCI sociale nalevingscertificering (auditrapport op verzoek beschikbaar). We hebben ook  voor kwaliteitsmanagement en alle producten hebben CE -certificering. REACH- en RoHS-nalevingsdocumentatie wordt bij elke OEM-zending geleverd.
    - q: Wat is de typische levertijd voor een OEM-bestelling?
      a: Ja. Onze fabriek beschikt over een geldige BSCI sociale nalevingscertificering (auditrapport op verzoek beschikbaar). We hebben ook  voor kwaliteitsmanagement en alle producten hebben CE -certificering. REACH- en RoHS-nalevingsdocumentatie wordt bij elke OEM-zending geleverd.
    - q: Kunt u FOB Qingdao of CIF naar onze haven verzenden?
      a: Ja. We verzenden FOB Qingdao, CIF naar grote wereldhavens en DDP voor gekwalificeerde partners. Ons logistieke team beheert containerboekingen, exportdocumentatie en douaneafhandeling. We verzenden naar 50+ landen in de EU, VS, AU en Azië.
b2b_moq: "Standaard MOQ: 5—0 eenheden per model (SUP/kajak/drop-stitch). SUP MOQ: 2— eenheden. Proefbestellingen welkom voor nieuwe samenwerkingen."
production_flow:
  tagline: Production Flow
  title: From Material to Finished Boat
  subtitle: Every boat passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: "01"
      title: Material Receiving & Incoming QC
      description: All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.
      qc_check: Tensile strength (ASTM D751), tear resistance (ISO 4674), thickness gauge, adhesive viscosity, visual defect scan
      qc_threshold: 100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect
      responsibility: Incoming QC team (3 inspectors)
    - stage: "02"
      title: CNC Cutting & Material Prep
      description: Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.
      qc_check: Dimensional check against CAD DXF files, edge quality inspection, panel count verification
      qc_threshold: Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance
      responsibility: Cutting workshop lead
    - stage: "03"
      title: Welding & Drop-Stitch Bonding
      description: Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.
      qc_check: Peel test every 50 units (ASTM D751), weld width measurement, hot-air temperature log review, visual seam inspection under backlight
      qc_threshold: Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject
      responsibility: Welding QC (2 inspectors per shift)
    - stage: "04"
      title: Assembly & Rigging
      description: "Boats move to final assembly where all components are mated: hull + tubes, valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist."
      qc_check: 100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection
      qc_threshold: "Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)"
      responsibility: Assembly team lead + line QC
    - stage: "05"
      title: Pressure Testing & Quality Hold
      description: Every chamber is inflated to 1.25× rated pressure (typically 20—5 PSI) and held for 24—8 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.
      qc_check: 24h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair
      qc_threshold: Max 5% pressure drop over 24h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch
      responsibility: Quality lab (independent of production, reports to management)
    - stage: "06"
      title: Final Inspection & Packing
      description: Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.
      qc_check: Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification
      qc_threshold: AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected
      responsibility: Final QC team (4 inspectors) + Packing team lead

workshops_section:
  tagline: Werkplaatsen
  title: Productiewerkplaatsen
  workshops:
    - title: PVC Snijden & Materiaalvoorbereiding
      description: Automatische CNC-snijmachines verwerken PVC, Hypalon en drop-stitch stoffen met submillimeterprecisie. Computergeoptimaliseerd nesten minimaliseert materiaalverspilling en zorgt dat elk paneel voldoet aan zijn maatspecificatie vóór het lassen.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Buislassen & Heatsealen
      description: Speciale laswerkplaats met heatseal-machines  en RF-dielektrische persen. Hetelucht heatsealers verbinden en versmelten PVC-buiskamers, terwijl RF-lassen hogesterkte-luchtdichte naden produceren die de  vereisten overtreffen.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: SUP-rompproductie —Glasvezel
      description: SUP-bootrompen worden geproduceerd met handlamineren van glasvezel met polyester en vinylester harssystemen. Elke laag wordt met de hand gerold en vacuümgezakt voor consistente kwaliteit. Een gelcoat-spuitcabine zorgt voor een hoogglanzende, UV-bestendige maritieme afwerking.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: SUP-printen & Decoratie
      description: SUP-planken worden gedecoreerd met digitaal printen  voor fullcolour graphics en zeefdruk  voor logo's en herhalende patronen. Digitale printers produceren fotokwaliteit dekontwerpen, terwijl zeefdruk duurzame, levendige merktekens levert.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Eindmontage & Tuigage
      description: Montagelijn waar glasvezelrompen en PVC-buizen worden samengevoegd, motoren worden gemonteerd, stuurinrichting en bediening worden aangesloten en elektrische systemen worden bedraad. Elke boot volgt een 100-punts montagechecklist die wordt afgetekend door de teamleider.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Kwaliteitstesten & Keuring
      description: Elke voltooide boot ondergaat verplichte luchtretentietesten, naadpeelverificatie en een volledige systeemcontrole vóór verzending. Ons kwaliteitslaboratorium werkt onafhankelijk van de productie en rapporteert rechtstreeks aan het management.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

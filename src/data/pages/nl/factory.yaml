material_traceability:
  tagline: Traceerbaarheid
  title: Materiaaltracking & Batchcontrole
  description: >-
    Elke partij grondstof krijgt een uniek lotnummer toegewezen in ons ERP-systeem. Van aankomst tot productie en het eindproduct, koppelt de stuklijst van elke batch terug naar de oorspronkelijke leverancierspartij. Dit maakt volledige traceerbaarheid stroomopwaarts mogelijk voor elke kwaliteits-
    of nalevingsvraag.
  system: Op maat gemaakte ERP (intern systeem van Qingdao Vatrad Group) + fysieke batchlabels op elke werkorder
  coverage: 100% van de productiematerialen — PVC, Hypalon, drop-stitch stof, lijmen, ventielen, hardware, verpakking
  records_retained: 10 jaar (volgens CE 2013/53/EU vereiste)
  suppliers:
    - material: Marineklasse PVC
      source: Chinese en Koreaanse leveranciers
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanse leverancier
      certified: ISO 9001, REACH
    - material: Drop-stitch stof
      source: Interne weving + externe partner
      certified: Interne QC leverancier ISO 9001
    - material: Kleppen & Hardware
      source: Chinese OEM-leveranciers
      certified: ISO 9001, materiaalc ertificaten per batch

qc_section:
  tagline: Kwaliteitscontrole
  title: Test- & Kwaliteitsborgingsproces
  subtitle: Elke boot ondergaat verplichte testen vóór verzending. Ons kwaliteitslaboratorium werkt onafhankelijk van de productie en rapporteert rechtstreeks aan het management.
  steps:
    - step: '1'
      title: Grondstoffenkeuring
      desc: PVC, Hypalon en drop-stitch stoffen ondergaan trekproeven (ASTM D751), scheurpropagatie en UV-bestendigheidsverificatie voordat een partij in productie gaat.
    - step: '2'
      title: 48-uurs Luchtretentietest
      desc: Elke buiskamer wordt opgeblazen tot 125% van de nominale druk en 48 uur vastgehouden. Drukdaling onder 5% leidt automatisch tot afkeuring en naadherkeuring.
    - step: '3'
      title: Laad- & Balanstest
      desc: Voltooide boten worden beladen tot maximale nominale capaciteit en getest op stabiliteit, vrijboord en handling. Elk vaartuig wordt watergetest vóór de eindkeuring.
oem_section:
  tagline: OEM-projecten
  title: Merk- & OEM-partnerschap Casestudies
  subtitle: Van concept tot container — hoe we wereldwijde merken helpen hun lijnen van opblaasbare vaartuigen te lanceren en schalen.
  cases:
    - challenge: Een Europese outdoor retailer had een private-label SUP-lijn nodig met unieke dek graphics, milieuvriendelijk PVC en retail-ready verpakking — alles geleverd in 60 dagen.
      solution: Ontwikkelde aangepaste digitale printbestanden, betrok REACH-conform PVC en verkortte sampling van 3 rondes naar 1 door het designteam op onze Qingdao-fabriek te plaatsen.
      result: 55 dagen van getekende PO tot FOB. 2.400 eenheden verspreid over 4 SKU's. Herhalingsorder geplaatst vóór aankomst van de eerste container.
    - challenge: Een Amerikaanse watersportstartup had een hoogwaardige drop-stitch kajak nodig met een aangepaste rompvorm, co-branded verpakking en BSCI-certificering voor retailplaatsing.
      solution: Paste de bestaande drop-stitch kajakmal aan met een gewijzigd rockerprofiel, ontwikkelde co-branded verpakkings artwork en leverde volledige BSCI-auditdocumentatie.
      result: Succesvol vermeld in 3 grote Amerikaanse outdoor-ketens. 5.000+ eenheden in het eerste jaar met 98% sell-through.
    - challenge: Een Australische distributeur had een CE-gecertificeerd SUP-assortiment nodig met aangepaste buiskleuren, Hypalon-upgradeoptie en naleving van de Australische norm AS 1799.
      solution: Produceerde preproductiemonsters met 4 buiskleurvarianten, betrok CSM Hypalon van een Japanse leverancier en coördineerde externe AS 1799-nalevingstesten.
      result: 3-model SUP-assortiment gelanceerd in de AU/NZ-markt. Gevolgd door een overheidsaanbesteding voor 12 patrouille-SUP's.
faq_section:
  tagline: Veelgestelde vragen
  title: B2B & OEM Veelgestelde Vragen
  questions:
    - q: Wat is de minimale bestelhoeveelheid (MOQ) voor OEM opblaasbare SUP-planken?
      a: MOQ begint bij 5–10 eenheden voor standaard OEM-modellen. Aangepaste mallen en private-label projecten vereisen minimaal 200 eenheden, afhankelijk van de complexiteit. Proefbestellingen en voorbeeldruns zijn beschikbaar voor nieuwe merkintroducties.
    - q: Heeft afarer een BSCI-certificering?
      a: Ja. Onze fabriek beschikt over een geldige BSCI sociale nalevingscertificering (auditrapport op verzoek beschikbaar). We hebben ook ISO 9001 voor kwaliteitsmanagement en alle producten hebben CE-certificering. REACH- en RoHS-nalevingsdocumentatie wordt bij elke OEM-zending geleverd.
    - q: Wat is de typische levertijd voor een OEM-bestelling?
      a: De standaardlevertijd is 30–45 dagen na bevestigde order en aanbetaling voor serie-OEM-productie. De ontwikkeling van aangepaste mallen voegt 15–20 dagen voor gereedschapsbouw toe. Versnelde productie is beschikbaar voor dringende orders en seizoenspieken. Prototype-monsters worden doorgaans binnen 15–20 dagen verzonden.
    - q: Kunt u FOB Qingdao of CIF naar onze haven verzenden?
      a: Ja. We verzenden FOB Qingdao, CIF naar grote wereldhavens en DDP voor gekwalificeerde partners. Ons logistieke team beheert containerboekingen, exportdocumentatie en douaneafhandeling. We verzenden naar 50+ landen in de EU, VS, AU en Azië.
b2b_moq: 'Standaard MOQ: 5–10 eenheden per model (SUP/kajak/drop-stitch). SUP MOQ: 2–5 eenheden. Proefbestellingen welkom voor nieuwe samenwerkingen.'
production_flow:
  tagline: Productiestroom
  title: Van materiaal tot afgewerkte boot
  subtitle: Elke boot doorloopt 6 productiefasen met kwaliteitscontrolepunten bij elke stap. Geen kortere routes, geen overgeslagen inspecties.
  stages:
    - stage: '01'
      title: Materiaalontvangst & inkomende kwaliteitscontrole
      description: Alle binnenkomende materialen worden per batch/lotsnummer geregistreerd in ons ERP-systeem. PVC-stofrollen, drop-stitch-cores, kleppen, lijmen en hardware worden in quarantaine geplaatst totdat de QC goedkeuring geeft.
      qc_check: Treksterkte (ASTM D751), scheurweerstand (ISO 4674), diktemaat, lijmviscositeit, visuele defectinspectie
      qc_threshold: 100% van de batches getest. Afkeuren als de treksterkte < 90% van de specificatie, scheur < specificatie minimum, of enig visueel defect
      responsibility: Binnenkomend QC-team (3 inspecteurs)
    - stage: '02'
      title: CNC-snijden & materiaalvoorbereiding
      description: Computer-geoptimaliseerde nesting legt panelen op PVC-voorraad om afval te minimaliseren. Automatische CNC-snijdmachines behouden een positionele nauwkeurigheid van 0,1 mm.
      qc_check: Dimensionale controle tegen CAD DXF-bestanden, controle van randkwaliteit, verificatie van het aantal panelen
      qc_threshold: Elke 20e paneel gemeten. Tolerantie ±0,5 mm. Afkeur batch als >2% buiten toleranties
      responsibility: Leidinggevende snijwerkplaats
    - stage: '03'
      title: Lassen & Drop-stitch bevestiging
      description: Drop-stitch-kernen worden met hittegelaminering aan buitenste PVC-laminaten verbonden. Buiskamers worden RF-gelast of hete-lucht gelast. Railbanden zijn drievoudig gelamineerd door fusie.
      qc_check: Peeltest elke 50 eenheden (ASTM D751), lasbreedtemeting, beoordeling van het logboek van de hete-lucht temperatuur, visuele naadinspectie onder tegenlicht
      qc_threshold: Hechtsterkte minimaal 8 N/cm. Lastebreedte tolerantie ±1 mm. Elke zichtbare kanaalvorming = afkeuren
      responsibility: Lassen QC (2 inspecteurs per ploeg)
    - stage: '04'
      title: Montage & Touwen
      description: 'Boten gaan naar de eindassemblage waar alle componenten worden samengevoegd: romp, buizen, geïnstalleerde kleppen, D-ringen, handvatten, vinhouders en draagtasbevestiging. Elke eenheid volgt een assemblagechecklist van 100 punten.'
      qc_check: 100-punten checklist goedkeuring per eenheid, klepfunctietest (10 open/sluit cycli), hardware koppelcontrole, visuele inspectie
      qc_threshold: 'Zero-defect beleid voor veiligheidkritieke onderdelen (kleppen, D-ringen, handvatten). Kleine cosmetische gebreken: AQL 2,5 (ISO 2859)'
      responsibility: Leidinggevende assemblageteam + lijn QC
    - stage: '05'
      title: Druktesten & Kwaliteitsbehoud
      description: Elke kamer wordt opgeblazen tot 1,25× de nominale druk (meestal 20–25 PSI) en gedurende 24–48 uur vastgehouden. Druksensoren registreren continu. Kamers die een drukval van meer dan 5% vertonen, worden afgekeurd en ter herinspectie van de naden gestuurd.
      qc_check: 24uurs drukvasthoudingslog, sensorcalibratie dagelijks geverifieerd, temperatuurgecompenseerde drukmeting, na reparatie opnieuw naden testen
      qc_threshold: Maximaal 5% drukverlies over 24 uur bij een stabiele temperatuur. Elke kamer die dit overschrijdt = 100% her-test van de gehele productiebatch
      responsibility: Kwaliteitslaboratorium (onafhankelijk van productie, rapporteert aan het management)
    - stage: '06'
      title: Eindinspectie & Verpakking
      description: Eindvisuele en functionele inspectie. Oppervlaktefouten, kleurconsistentie, label/BIN-verificatie, verpakkingintegriteit en volledigheid van accessoires. Eenheden zijn vacuüm verpakt, in dozen geplaatst en op pallets gezet voor containerlading.
      qc_check: Volledige visuele inspectie, accessoirecontrolelijst per SKU, verpakkingsvaltest (1 m, willekeurige steekproef), label-/streepjescodescanverificatie
      qc_threshold: AQL 2,5 voor grote gebreken, AQL 4,0 voor kleine gebreken. Nultolerantie voor veiligheidsgebreken. 100% van de eenheden visueel geïnspecteerd
      responsibility: Eind-QC team (4 inspecteurs) + Verpakkingsploeg leider

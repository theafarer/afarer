hero:
  tagline: Fabriek
  title: Fabriek & Productie
  subtitle: 12.000 m2 geïntegreerde productie —van grondstof tot afgewerkte boot
intro:
  - Als fabrieksmerk van **Qingdao Vatrad Group Co., Ltd.** controleert afarer elke fase van de productie —van de aankomst van ruw PVC en glasvezel tot de laatste keuring voor vertrek van de afgewerkte boot. Onze productiefaciliteit in de Qingdao Economic Development Zone beslaat 12.000 vierkante meter en huisvest speciale werkplaatsen voor PVC-snijden, buis heatsealing, glasvezel SUP-rompproductie, SUP-digitaal printen, eindmontage en kwaliteitstesten.
  - Door ontwerp, engineering, prototyping, productie en testen onder één dak te integreren, elimineren we de inefficiënties van contractproductie en behouden we directe controle over bouwkwaliteit, materiaalkeuze en levertijden. Elke boot die onze werkplaats verlaat, wordt gebouwd door onze mensen, op onze apparatuur, volgens onze normen.

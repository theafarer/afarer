  headline: 'Opblaasbare SUP’s voor toerisme en recreatie: de complete gids'
  description: 'Vind de juiste opblaasbare SUP voor vakantie en dagjes weg — allround boards, touringboards en visboards voor meren, rivieren en kusten. In de kofferbak, in het vliegtuig en paddle waar je wilt.'

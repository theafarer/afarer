      description: 'Gelokaliseerde campagne-assets, verkooppuntmateriaal, evenementkits en meertalige digitale content.'
      icon: 'tabler:mood-smile'
    - title: 'Betrouwbare Supply Chain'
      description: 'ISO- en CE-gecertificeerde productie met consistente kwaliteitscontrole, voorspelbare MOQ’s en levertijden waarop u kunt plannen.'
      icon: 'tabler:building-factory'
    - title: 'Toegewijde Account Manager'
      description: 'Een persoonlijke distributiemanager voor prognoses, orderplanning en aftersales-ondersteuning.'
      icon: 'tabler:user-check'
table:
  title: 'Programmaniveaus & Ordervoorwaarden'
  subtitle: 'Kies het niveau dat past bij uw marktpotentieel. Alle prijzen in USD, FOB Qingdao.'
  caption: 'Monsterbestellingen (5–10 stuks) geven geen territoriale bescherming. De voorwaarden worden vóór elke zending in uw Distributor-overeenkomst vastgelegd.'
  head:
    - Programmaniveau
    - Minimum Bestelling (stuks)
    - Levertijd
    - Betaling
  rows:
    - [Monster / Productevaluatie, 5–10, 15–20 werkdagen, 100% vooraf betaald]
    - [Proefbestelling, 10–30, 30–45 dagen, 100% vooraf betaald]
    - [Geautoriseerde Dealer, 30–50, 30–45 dagen, 30% aanbetaling / 70% vóór verzending]
    - [Landelijke / Regionale Distributeur, 100–300, 30–45 dagen, 30% aanbetaling / 70% vóór verzending]
    - [Custom & Private Label (standaard), 50+, 30–45 dagen, 30% aanbetaling / 70% vóór verzending]
    - [Diepe Customisatie (nieuwe mallen, verpakking), 200+, 45–60 dagen, 30% aanbetaling / 70% vóór verzending]
    - [Rechten op volledige productlijn, 300–1, 000, 60–90 dagen, 30% aanbetaling / 70% vóór verzending]
faqs:
  title: 'Distributieprogramma — FAQ'
  subtitle: 'Alles wat distributeurs vragen vóór aanvraag.'
  items:
    - title: 'Wat betekent één land, één distributeur?'
      description: 'Afarer verleent één geautoriseerde distributeur exclusieve rechten voor een land of regio. U bezit uw markt — geen parallelimport, geen interne concurrentie.'
    - title: 'Wat is de minimum eerste bestelling?'
      description: 'Landelijke en regionale distributeurs starten vanaf 100–300 stuks. Geautoriseerde dealers vanaf 30–50 stuks. Proefbestellingen van 10–30 stuks laten u eerst de markt valideren (zonder territoriale bescherming).'
    - title: 'Welke support krijgen distributeurs?'
      description: 'Het Distributor Success Program omvat onboarding, go-to-market planning, product- en verkooptrainingen, demo-vlootondersteuning, gelokaliseerde marketingmiddelen en een toegewijde accountmanager.'
    - title: 'Hoe beschermt Afarer mij tegen kanaalconflicten?'
      description: 'Elk gebied heeft exact één geautoriseerde distributeur. Directe bestellingen uit uw regio lopen via u, en de prijzen beschermen uw marge.'
    - title: 'Wat zijn de verzend- en betalingsvoorwaarden?'
      description: 'Orders worden verzonden FOB Qingdao met volledige exportdocumentatie. Productieorders met 30% aanbetaling en 70% vóór verzending; proef- en monsterorders worden vooraf betaald.'
    - title: 'Hoe solliciteer ik?'
      description: 'Stuur een aanvraag via het contactformulier. We beoordelen marktfit, retailaanwezigheid en logistieke capaciteit en reageren binnen 3 werkdagen met de volgende stappen en een voorbeeld-Distributorovereenkomst.'
cta:
  title: 'Klaar om uw markt te bezitten?'
  subtitle: 'Solliciteer voor het Afarer-distributieprogramma en krijg binnen 3 werkdagen een reactie.'
  actions:
    - text: 'Solliciteer voor distributieschap'
      href: /contact?subject=Distributor Application
      variant: primary
    - text: 'Distributieprogramma downloaden'
      href: /distributor-program
      variant: secondary
geo:
  tagline: 'Wie U Zult Bedienen'
  sentence: 'Afarer werkt samen met gevestigde distributeurs uit de maritieme, outdoor- en sportwereld die retailketens, verhuurvloten, watersportscholen, resorts en overheidskopers bedienen met premium opblaasbare SUP-boards en vaartuigen.'
  audiences:
    - 'Maritieme & Botendistributeurs'
    - 'Outdoor- & Sportretail'
    - 'Verhuur- & Resortoperators'
    - 'Watersportscholen'

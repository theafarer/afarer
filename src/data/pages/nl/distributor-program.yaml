faqs:
  title: 'Landenpartnerschap — FAQ'
  subtitle: 'De vragen die serieuze landenpartners stellen vóór hun aanvraag.'
  items:
    - title: 'Wat betekent één-land-één-distributeur echt?'
      description: 'Afarer wijst één enkele geautoriseerde distributeur aan met exclusieve rechten voor een afgebakend territorium. We verkopen niet vanuit onze globale of regionale kanalen in een beschermd land. Uw territorium blijft van u zolang de Distribution Agreement wordt nageleefd.'
    - title: 'Is het territorium voor altijd exclusief?'
      description: 'Nee. Exclusiviteit is voorwaardelijk, niet permanent. Die wordt onderhouden via een ondertekende Distribution Agreement, het voltooien van uw eerste bestelling, jaarlijkse inkoopdoelen, lokale voorraad, after-salescapaciteit en voortdurende marktinvestering. Worden deze niet gehaald, dan kan het territorium worden heronderhandeld of opnieuw toegewezen.'
    - title: 'Wat is de minimale eerste bestelling?'
      description: "Landelijke en regionale distributeurs starten vanaf 100–300 stuks; Authorized Dealers vanaf 30–50 stuks; proefbestellingen vanaf 10–30 stuks laten u eerst de markt valideren (proef- en monsterbestellingen bieden geen territoriale bescherming). Custom- en private-labelprogramma's volgen aparte MOQs zoals vermeld in de niveaus hierboven."
    - title: 'Welke ondersteuning omvat het ondersteuningsprogramma met 10 modules?'
      description: 'Niveaus en kwalificaties, territoriumbescherming, MOQ / prijzen / jaarlijkse kortingen, voorraad en orderuitvoering, marketingassets en gezamenlijke marktfondsen, product- / verkoop- / technische training, reserveonderdelen en after-sales, garantieregistratie, het partnerportaal en productdatasheets, marketing-assetbibliotheek, jaarlijkse kortingsregeling en verzend- en paklijsten.'
    - title: 'Hoe beschermt Afarer mij tegen kanaalconflicten?'
      description: 'Elk territorium heeft precies één geautoriseerde distributeur. Inquiries en directe bestellingen uit uw regio lopen via u, websiteformulieren worden doorgestuurd naar de lokale partner als die er is, en het wereldwijde team escaleert alleen wanneer een partner niet reageert.'
    - title: 'Wat zijn de verzend- en betalingsvoorwaarden?'
      description: 'Bestellingen worden verzonden FOB Qingdao met volledige exportdocumentatie. Productieorders zijn 30% aanbetaling met 70% vóór verzending; proef- en monsterbestellingen worden vooraf betaald. De standaard levertijd is 30–45 werkdagen, met 15–20 werkdagen voor monsterruns.'
    - title: 'Hoe solliciteer ik?'
      description: 'Stuur uw sollicitatie via het contactformulier met marktdetails. We beoordelen marktfit, retailaanwezigheid en logistieke capaciteit en reageren binnen 3 werkdagen met de volgende stappen en een voorbeeld van een Distribution Agreement.'

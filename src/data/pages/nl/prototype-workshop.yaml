hero:
  tagline: Lab 05
  title: Prototype Werkplaats
  subtitle: Van CAD-model tot zeevaardige boot — gebouwd, uitgerust en bewezen
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Afarer prototype werkplaats bootfabricage
intro: >-
  Een CAD-model, hoe gedetailleerd ook, kan niet laten zien hoe een boot daadwerkelijk zal varen totdat deze het water ontmoet. Daarom is onze Prototype Werkplaats ontworpen om engineeringgegevens zo snel en nauwkeurig mogelijk om te zetten in een fysiek, zeegaand vaartuig. Elk nieuw
  {SITE.name}-model — en elke belangrijke custom build — gaat door deze werkplaats voordat het productiegereedschap wordt ingezet.
content_html: >
  <h2>Waar ontwerp werkelijkheid wordt</h2>

  <p>De werkplaats is volledig uitgerust voor de gelijktijdige fabricage van romp, buizen en tuigage. Deze parallelle werkwijze verkort de doorlooptijd van het prototype van engineeringrelease tot 8-12 weken, vergeleken met de industriestandaard van 16-20 weken. Wanneer uw toepassing een
  gespecialiseerde oplossing vereist, kunnen we in minder dan drie maanden van concept naar validatie op het water gaan.</p>


  <h2>Mogelijkheden van de werkplaats</h2>

  <table>
    <thead><tr><th>Werkstation</th><th>Apparatuur</th><th>Doel</th></tr></thead>
    <tbody>
      <tr><td>Rompfabricage</td><td>Rotatiemaloven (HDPE), TIG-lasruimte (aluminium), handlamineermallen (glasvezel)</td><td>Productie van rompen op ware grootte in alle drie de materiaalsoorten</td></tr>
      <tr><td>Buizenmontage</td><td>RF-laspers, hete-luchthechtstation, opblaastestmal</td><td>Fabricage van buizenconstructies op ware grootte met alle schotten, kegels en ventielen</td></tr>
      <tr><td>Tuigage &amp; afbouw</td><td>Motorkraan (500 kg), mock-upframe voor de console, hydraulische slangkrimper, kabelboombord</td><td>Volledige uitrusting: motor, besturing, bediening, brandstofsysteem, elektronica, zitplaatsen</td></tr>
      <tr><td>Instrumentenruimte</td><td>GPS-snelheidssensor, brandstofstroommeter, accelerometers, thermokoppelarray, datalogger</td><td>Installatie en kalibratie van meetinstrumenten voor de proefvaart</td></tr>
    </tbody>
  </table>


  <h2>Het prototype-traject — stap voor stap</h2>

  <ol>
    <li><strong>Engineeringoverdracht</strong> — Het ontwerppakket (3D-model, FEA-rapport, stuklijst, lamineerschema) wordt formeel beoordeeld door de werkplaatsleider en de projectingenieur. Eventuele productiepunten worden gesignaleerd en opgelost voordat met snijden wordt begonnen.</li>
    <li><strong>Rompfabricage</strong> — De romp wordt gebouwd volgens de engineeringspecificatie. Voor HDPE: het rotatiemalprogramma wordt geladen uit de Moldex3D-simulatie. Voor aluminium: de CNC-gesneden platen worden in de TIG-ruimte gelast volgens de goedgekeurde laskaart. Voor glasvezel: het laminaatschema wordt laag voor laag gevolgd.</li>
    <li><strong>Buizenfabricage</strong> — Het weefsel wordt gesneden met CNC-patroonmallen en vervolgens met RF-lassen tot kamers op ware grootte gevormd. Elke kamer wordt opgeblazen tot testdruk en gedurende 24 uur voor initiële stabilisatie achtergelaten.</li>
    <li><strong>Montage &amp; tuigage</strong> — Romp en buizen worden gekoppeld. De motor wordt geplaatst, besturing en bediening worden aangesloten, het brandstofsysteem wordt geïnstalleerd en alle elektrische circuits worden bedraad en gecontroleerd.</li>
    <li><strong>Statische tests</strong> — Voordat de boot het water raakt, ondergaat hij: een drijfvermogencheck (volledige belasting + 30 % reserve), een drukproef van het brandstofsysteem, een cyclustest van het stuurmechanisme over de volledige uitslag en een continuïteitstest van de aardverbinding.</li>
    <li><strong>Proefvaartprogramma</strong> — 20 uur testen op het water, hieronder in detail beschreven.</li>
    <li><strong>Prototype-review</strong> — Er wordt een formele afstemmingsvergadering gehouden met de teams voor engineering, productie en kwaliteit. Eventuele noodzakelijke ontwerpwijzigingen worden gedocumenteerd en verwerkt in de productierelease.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Proefvaartprogramma van 20 uur — testschema</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Havenmanoeuvres — besturing bij lage snelheid, achteruitvaren, controle van de fenders</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Snelheidsproef — met GPS geverifieerde topsnelheid, kruissnelheid en brandstofverbruik bij 3 toerentallen</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Draaiproef — tactische diameter, advance en transfer bij 20 kn, bakboord en stuurboord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Slammingtest — herhaalde passages door 0.5–1.0 m kortgolvig water; accelerometer op de voet van de stuurstoel</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Stabiliteitstest — statische hellingshoek met 4 bemanningsleden + uitrusting aan stuurboord, excentrische belasting</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Duurrit — 3 uur aaneengesloten op kruissnelheid; temperatuurbewaking (motor, brandstof, elektrisch)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Eindinspectie — inspectie van alle systemen na de proefvaart, alle bevestigingen aandraaien/controleren, bevindingen documenteren</span>
      </div>
    </div>
  </div>


  <h2>Maatwerkprototyping voor bijzondere toepassingen</h2>

  <p>De prototypewerkplaats is de plek waar we de problemen oplossen die standaard productieboten niet kunnen aanpakken. Recente voorbeelden zijn onder meer:</p>

  <ul>
    <li>Een 7.8 m RIB voor een zoek- en reddingsorganisatie, met een op maat gemaakte cabineconstructie met kantelbeveiliging, geïntegreerde bevestigingen voor brancards en een op de boeg gemonteerde sonarpod — allemaal geprototypeerd, gemonteerd en getest in onze faciliteit.</li>
    <li>Een 5.2 m opblaasbare boot voor een hydrografische meetcontractant, met een verlaagd spiegel, een afneembare instrumentenmast en door de romp gevoerde transducerholtes die zijn ontworpen om stromingsverstoring te minimaliseren.</li>
    <li>Een 4.5 m tender met elektrische aandrijving voor een superjacht, waarbij het prototype is gebruikt om bereik, laadinfrastructuur en geluidsniveaus te valideren voordat de klant overging tot een vloot van vier stuks.</li>
  </ul>


  <h2>Ons prototypingteam</h2>

  <p>De werkplaats wordt bemand door acht veelzijdige maritieme technici, die elk zijn opgeleid in ten minste twee van de drie kerndisciplines (romp, buizen, tuigage). De teamleider is een meesterbotenbouwer met 16 jaar ervaring, van unieke op maat gebouwde boten tot productieseries. Aan elk
  prototype wordt een toegewijde projectingenieur toegewezen die gedurende het hele bouw- en testtraject het vaste aanspreekpunt voor de klant is.</p>


  <h2>Betrokkenheid van de klant</h2>

  <p>We moedigen onze klanten actief aan om aanwezig te zijn bij de belangrijkste mijlpalen tijdens de bouw van het prototype — in het bijzonder de eerste inrichtingsreview en de proefvaart. Uw operationele feedback tijdens deze fasen is van onschatbare waarde bij het finetunen van de boot voordat
  hij in productie gaat. We bouwen niet in een vacuüm; we bouwen in partnerschap met u.</p>

  <p>De proefvaart van 20 uur is ook een gelegenheid voor uw team om vertrouwd te raken met het vaargedrag van de boot, de indeling van de systemen en de onderhoudsvereisten, zodat de overgang naar gebruik vlekkeloos verloopt wanneer de productieboten worden geleverd.</p>

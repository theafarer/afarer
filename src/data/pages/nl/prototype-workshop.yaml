intro: >-
  Een CAD-model, hoe gedetailleerd ook, kan niet laten zien hoe een board daadwerkelijk zal varen totdat deze het water ontmoet. Daarom is onze Prototype Werkplaats ontworpen om engineeringgegevens zo snel en nauwkeurig mogelijk om te zetten in een fysiek, waterklaar board. Elk nieuw
  Afarer-model — en elke belangrijke custom build — gaat door deze werkplaats voordat het productiegereedschap wordt ingezet.
content_html: |
  <h2>Waar ontwerp werkelijkheid wordt</h2>

  <p>De werkplaats is volledig uitgerust voor de gelijktijdige fabricage van romp, rails en tuigage. Deze parallelle werkwijze verkort de doorlooptijd van het prototype van engineeringrelease tot 8-12 weken, vergeleken met de industriestandaard van 16-20 weken. Wanneer uw toepassing een
  gespecialiseerde oplossing vereist, kunnen we in minder dan drie maanden van concept naar validatie op het water gaan.</p>


  <h2>Mogelijkheden van de werkplaats</h2>

  <table>
    <thead><tr><th>Werkstation</th><th>Apparatuur</th><th>Doel</th></tr></thead>
    <tbody>
      <tr><td>Rompfabricage</td><td>CNC-stoffensnijder, hitelaminatiepers, voorbereidingsstation voor drop-stitch-kernen</td><td>Productie van rompen op ware grootte in alle drie de constructietypen</td></tr>
      <tr><td>Rail- &amp; kamermontage</td><td>RF-laspers, hete-luchthechtstation, opblaastestmal</td><td>Fabricage van rails- en kamersconstructies op ware grootte met alle schotten en ventielen</td></tr>
      <tr><td>Tuigage &amp; afbouw</td><td>Frijnmal voor vindozen, lasarmaturen voor bagagemontages en handvatten, snijstation voor dekpadding</td><td>Volledige uitrusting: vinnen, bagagemontages, leash-pluggen, handvatten, dekpads, ventielen</td></tr>
      <tr><td>Instrumentenruimte</td><td>GPS-snelheidssensor, druksensoren, accelerometers, thermokoppelarray, datalogger</td><td>Installatie en kalibratie van zeeproef-instrumentatie</td></tr>
    </tbody>
  </table>


  <h2>Het prototype-traject — stap voor stap</h2>

  <ol>
    <li><strong>Engineeringoverdracht</strong> — Het ontwerppakket (3D-model, FEA-rapport, stuklijst, lamineerschema) wordt formeel beoordeeld door de werkplaatsleider en de projectingenieur. Eventuele productiepunten worden gesignaleerd en opgelost voordat met snijden wordt begonnen.</li>
    <li><strong>Rompfabricage</strong> — De romp wordt gebouwd volgens de engineeringspecificatie. Voor enkelvoudige constructie: de drop-stitch-kern wordt gelamineerd met de gespecificeerde PVC-buitenlaag. Voor dubbellagige constructie: de extra buitenlaag wordt aangebracht over het basislaminaat voordat het patroon wordt gesneden. Voor gefuseerde constructie: de laminatieparameters worden geladen uit het goedgekeurde procesblad en geverifieerd op een eerste testcoupe.</li>
    <li><strong>Railfabricage</strong> — Het weefsel wordt gesneden met CNC-patroonmallen en vervolgens met RF-lassen tot rails en kamers op ware grootte gevormd. Elke kamer wordt opgeblazen tot testdruk en gedurende 24 uur voor initiële stabilisatie achtergelaten.</li>
    <li><strong>Montage &amp; tuigage</strong> — Romp en rails worden gekoppeld. Vindozen en bagagemontages worden geplaatst, leash-pluggen en draaghandvatten worden geïnstalleerd, de opblaasventiel wordt met het juiste koppel aangedraaid en de dekpad wordt aangebracht en uitgelijnd.</li>
    <li><strong>Statische tests</strong> — Voordat het board het water raakt, ondergaat het: een drijfvermogencheck (volledige belasting + 30 % reserve), een drukhoudtest van de kamers, een lekkagetest van de ventielen en een trekktest op handvatten en montages.</li>
    <li><strong>Zeeproefprogramma</strong> — 20 uur testen op het water, hieronder in detail beschreven.</li>
    <li><strong>Prototype-review</strong> — Er wordt een formele afstemmingsvergadering gehouden met de teams voor engineering, productie en kwaliteit. Eventuele noodzakelijke ontwerpwijzigingen worden gedocumenteerd en verwerkt in de productierelease.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Zeeproefprogramma van 20 uur — testschema</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Vaargewenning op vlak water — tracking bij lage snelheid, draaien, controle van houding en trim</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Snelheidsproef — met GPS geverifieerde topsnelheid, kruissnelheid en volgehouden tempo bij 3 slagfrequenties</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Draaiproef — draaicirkel bij pivot- en sweepturns, boardrespons, bakboord en stuurboord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Golftest — herhaalde passages door 0.5–1.0 m kortgolvig water; accelerometer op de rijderspositie</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Stabiliteitstest — statische hellingshoek met 4 rijkunstenaars van verschillend gewicht, excentrische belasting aan stuurboord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Duurrit — 3 uur aaneengesloten op kruistempo; bewaking van kamerdruk, railtemperatuur en vermoeidheid van de rijder</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Eindinspectie — inspectie van alle componenten na de proefvaart, alle bevestigingen aandraaien/controleren, bevindingen documenteren</span>
      </div>
    </div>
  </div>


  <h2>Maatwerkprototyping voor bijzondere toepassingen</h2>

  <p>De prototypewerkplaats is de plek waar we de problemen oplossen die standaard productieboards niet kunnen aanpakken. Recente voorbeelden zijn onder meer:</p>

  <ul>
    <li>Een goed zichtbaar reddings-SUP voor een zoek- en reddingsorganisatie, met geïntegreerde grijphandvatten, montagepunten voor reddingsuitrusting en een romp met hoog drijfvermogen voor het bergen van slachtoffers — allemaal geprototypeerd, gemonteerd en getest in onze faciliteit.</li>
    <li>Een expeditie-touring-SUP voor een hydrografische meetcontractant, met een afneembare instrumentenmast, afgedichte uitrustingpoorten en een laaggeprofileerde transducerbevestiging die ontworpen is om weerstand te minimaliseren.</li>
    <li>Een compact vis-SUP voor een resortvloot, waarbij het prototype is gebruikt om stabiliteit, uitrustingsopties en duurzaamheid onder dagelijkse verhuur te valideren voordat de klant overging tot een vloot van vier stuks.</li>
  </ul>


  <h2>Ons prototypingteam</h2>

  <p>De werkplaats wordt bemand door acht veelzijdige maritieme technici, die elk zijn opgeleid in ten minste twee van de drie kerndisciplines (romp, rails, tuigage). De teamleider is een meesterfabrikant met 16 jaar ervaring, van unieke op maat gebouwde exemplaren tot productieseries. Aan elk
  prototype wordt een toegewijde projectingenieur toegewezen die gedurende het hele bouw- en testtraject het vaste aanspreekpunt voor de klant is.</p>


  <h2>Betrokkenheid van de klant</h2>

  <p>We moedigen onze klanten actief aan om aanwezig te zijn bij de belangrijkste mijlpalen tijdens de bouw van het prototype — in het bijzonder de eerste inrichtingsreview en de zeeproef. Uw operationele feedback tijdens deze fasen is van onschatbare waarde bij het finetunen van het board voordat
  het in productie gaat. We bouwen niet in een vacuüm; we bouwen in partnerschap met u.</p>

  <p>De zeeproef van 20 uur is ook een gelegenheid voor uw team om vertrouwd te raken met het vaargedrag van het board, de indeling van het dek en de onderhoudsvereisten, zodat de overgang naar gebruik vlekkeloos verloopt wanneer de productieboards worden geleverd.</p>

features3_reasons:
  tagline: Why Choose afarer
  title: 'Zeven Redenen om Met Ons Samen te Werken'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'We bezitten en beheren een fabriek van 12.000 m². Wanneer u met afarer samenwerkt, werkt u direct met de mensen die uw producten ontwerpen, engineeren en bouwen —geen tussenpersonen.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Ons ontwerpproces begint met de use case, niet met de productcategorie. We optimaliseren rompvorm, materiaalkeuze en configuratie voor hoe de boot daadwerkelijk wordt gebruikt.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'CE-gecertificeerd, ISO-kwaliteitssysteem, BSCI-conform, REACH-conform, USCG-goedgekeurd. Elk product voldoet aan internationale normen —niet alleen claims.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Buiskleuren, console-indeling, branding, verpakking —we passen aan volgens uw specificaties. Geen minimale besteldruk. Begin met een prototype, schaal met vertrouwen.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'Magazijn in Californië, directe verzending vanuit Qingdao, luchtvracht voor spoedorders. Wij regelen douanepapieren en documentatie.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'We ondersteunen boten die we 20 jaar geleden hebben gebouwd. Echte reserveonderdelen, technisch advies, reparatiebegeleiding —ons team is beschikbaar wanneer u ons nodig heeft.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Echte belastingswaarden, echte afmetingen, echt gewicht. Geen marketinginflatie. Wat we publiceren is wat u krijgt —geverifieerd door onafhankelijke tests.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Trusted by Brands Worldwide
  title: What Our Partners Say
  items:
    - content: 'We hebben met verschillende fabrikanten in China gewerkt, maar afarer springt eruit door hun technische ondersteuning en consistente kwaliteit. Ze behandelen ons merk als hun eigen merk.'
      name: '—OEM Partner, European Water Sports Brand'
    - content: "Hun Hypalon SUP's zijn al meer dan 5 jaar in gebruik bij onze vloot. Minimaal onderhoud, uitstekende UV-bestendigheid. De 5-jaar garantie op buizen geeft ons vertrouwen."
      name: '—Fleet Operator, Middle East Resort Group'
    - content: 'Het afarer-team hielp ons een aangepast SUP-ontwerp te ontwikkelen van concept tot productie in 90 dagen. De kwaliteit overtrof onze verwachtingen.'
      name: '—Distributor, Australian Watersports'

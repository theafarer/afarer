philosophy:
  tagline: Ontwerpfilosofie
  title: Engineering-Gestuurd Ontwerp<br />—Elk Detail Telt
  subtitle: Onze engineeringfilosofie draait om drie principes die elk product dat we bouwen begeleiden.
  list:
    - 'Betrouwbaarheid Voorop: Elk afarer-product wordt getest om echte omstandigheden te weerstaan —van reddingsoperaties in koud water tot tropische resortverhuur. We over-engineering waar het het meest telt.'
    - 'Productieprecisie: Onze faciliteiten gebruiken CNC-snijden, hoogfrequent lassen en geautomatiseerde druktesten. Elke naad, elke klep, elk fitting voldoet aan gedocumenteerde specificaties.'
    - 'Continue Innovatie: Ons R&D-team evalueert voortdurend nieuwe materialen, productiemethoden en ontwerpverbeteringen. We wachten niet op problemen —we anticiperen erop.'

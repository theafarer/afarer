hero:
  tagline: Our Team
  title: 'De Mensen Achter afarer<br />—Vrijheid op het Water Ontwerpen'
  subtitle: 'Opgericht in 2012 in Qingdao, China, is afarer gebouwd door maritieme ingenieurs, materiaalwetenschappers en watersportliefhebbers die geloofden in het wereldwijd toegankelijk maken van professionele opblaasbare vaartuigen.'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'Van een Kustwerkplaats<br />naar een 12.000 m² Faciliteit'
  subtitle: 'afarer is opgericht door een team van maritieme ingenieurs met tientallen jaren gecombineerde ervaring in het ontwerpen van opblaasbare boten, PVC/Hypalon-productie en wereldwijde productie van maritieme apparatuur.'
  items:
    - title: 'Founded: 2012'
      description: 'Gevestigd in Qingdao, China —een belangrijk maritiem knooppunt met een rijke scheepsbouwtraditie.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'Inclusief 50+ R&D-ingenieurs, kwaliteitscontrolespecialisten en productietechnici.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: "Speciale productiefaciliteit met 6 productielijnen voor SUP's, opblaasbare boten en SUP-planken."
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Exporterend naar Europa, Amerika, Midden-Oosten, Azië-Pacific en Afrika.'
      icon: tabler:globe

timeline:
  - year: Twee duizend twaalf
    title: Maritieme productiebasis
    body: >-
      afarer begon als een gespecialiseerde werkplaats voor opblaasbare vaartuigen in Qingdao, China, toegewijd aan maritiem vakmanschap en de productie van opblaasbare boten. De vroege focus lag op het bouwen van betrouwbare opblaasbare producten door praktische technische ervaring en
      productiediscipline.
  - year: Tweeduizend vijftien
    title: Eerste export & CE-certificering
    body: De eerste exportorders bereikten Japan en Korea. CE-certificering werd behaald voor de kernproductlijnen, wat de toetreding van afarer tot internationale markten markeerde. Het bedrijf begon commerciële en recreatieve gebruikers buiten China te bedienen.
  - year: Twee duizend achttien
    title: Fabrieksuitbreiding
    body: Verhuizing naar een productiefaciliteit van 12.000 m². Toevoeging van HF-laslijnen en drop-stitch productiecapaciteit, waardoor productie op grotere schaal en verbeterde kwaliteitscontrolesystemen mogelijk werden.
  - year: Twee duizend twintig
    title: R&D-centrum opgericht
    body: Opening van een toegewijd R&D-centrum met PVC-stoffenlaboratorium, hydrodynamische testtank en CAD/FEA-simulatiestudio. Productontwikkeling richtte zich op lichtgewicht constructie, verbeterde duurzaamheid en gebruikersgericht ontwerp.
  - year: Tweeduizendtweeëntwintig
    title: Certificering & wereldwijde groei
    body: ISO 9001-certificering behaald. Uitbreiding naar 14 R&D-ingenieurs en 200+ werknemers. Producten bereikten klanten in Europa, Amerika en Azië-Pacific via distributeurs- en co-brand partnerschappen.
  - year: Tweeduizend vierentwintig
    title: Innovatie- & designstudio
    body: Lancering van een volwaardige design- en innovatiestudio voor maatwerk co-brand projecten, van concept tot productie. Versterking van professionele maritieme toepassingen, waaronder reddings-, commerciële en overheidsaanbestedingen.
  - year: Tweeduizend zesentwintig
    title: De toekomst van waterverkenning bouwen
    body: Vandaag blijft afarer opblaasbare boten, SUP-systemen en op maat gemaakte maritieme oplossingen ontwikkelen — mensen en organisaties verbinden met de wateren van de wereld. 50+ landen bediend, 15.000+ eenheden jaarlijkse capaciteit.
content_founding:
  tagline: Het begin
  title: Geboren aan het water
  subtitle: 'afarer startte in een kustwerkplaats in Qingdao met één boot en een visie: opblaasbare vaartuigen bouwen die echte maritieme omstandigheden aankunnen.'
  paragraphs:
    - In 2012 zagen onze oprichters een gat in de markt — de meeste opblaasbare boten waren betaalbaar maar onbetrouwbaar, of van hoge kwaliteit maar ontoegankelijk duur. Zij geloofden dat er ruimte was voor een fabrikant die zowel kwaliteit als waarde bood.
    - De eerste romp werd met de hand gebouwd, getest in lokale wateren en verfijnd op basis van echte feedback van vissers en kleine commerciële gebruikers. Die feedbackloop — bouwen, testen, luisteren, verbeteren — blijft vandaag de kern van onze technische filosofie.
    - In 2015 had het nieuws zich verspreid voorbij Qingdao. Internationale distributeurs begonnen monsters aan te vragen. Wat begon als een lokale werkplaats, werd een wereldwijde leverancier.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Vroege productiewerkplaats en fabricage van afarer
content_growth:
  tagline: Groei & innovatie
  title: Van werkplaats naar 12.000 m² faciliteit
  subtitle: Continue investering in mensen, apparatuur en processen heeft afarer getransformeerd tot een moderne maritieme productiefaciliteit.
  paragraphs:
    - Naarmate de vraag groeide, groeide ook onze faciliteit. We breidden uit van een kleine werkplaats naar een fabriek van 12.000 m² met speciale productielijnen voor SUP-boten, opblaasbare boten, SUP-planken en accessoires.
    - We investeerden in CNC-snijmachines, hoogfrequente lasapparatuur, drop-stitch productielijnen en uitgebreide testopstellingen — zodat we elk aspect van de productiekwaliteit kunnen beheersen.
    - Vandaag omvat ons team van 200+ medewerkers maritieme ingenieurs, materiaalwetenschappers, kwaliteitscontrolespecialisten en bekwame vakmensen — van wie velen sinds de begindagen bij afarer werken.
philosophy:
  tagline: Merkfilosofie
  title: Vrijheid op het Water Ontwerpen
  body: Vrijheid op het water gaat niet alleen over beweging. Het vertegenwoordigt het ontdekken van nieuwe plekken, het creëren van buitenervaringen, het verbinden van mensen met de natuur en het mogelijk maken van professionele missies. Techniek maakt die vrijheid mogelijk.
  pillars:
    - title: Betrouwbaarheid voorop
      body: Wateromgevingen vragen om vertrouwen. afarer-producten zijn ontworpen voor stabiliteit, duurzaamheid, veiligheid en consistente prestaties.
    - title: Mensgericht ontwerp
      body: Producten moeten mensen dienen, niet technologie. Elke ontwerpbeslissing begint met het begrijpen van hoe mensen vaartuigen gebruiken, waar ze verkennen en welke uitdagingen ze tegenkomen.
    - title: Toegankelijke verkenning
      body: Water zou niet alleen voor experts moeten zijn. afarer creëert uitrusting waarmee meer mensen veilig rivieren, meren, oceanen en kustomgevingen kunnen ervaren.
    - title: Continue innovatie
      body: Innovatie is niet alleen het creëren van nieuwe producten. Het is het verbeteren van elk detail — materialen, constructies, productie en gebruikerservaring.
engineeringDna:
  tagline: Technische DNA
  title: Hoe afarer producten maakt
  areas:
    - title: Materiaalkunde
      body: afarer richt zich op het selecteren van geschikte materialen voor verschillende maritieme omgevingen. Belangrijke overwegingen zijn slijtvastheid, UV-bestendigheid, drukstabiliteit en duurzaamheid op lange termijn.
      items:
        - Slijtvastheid
        - UV-bestendigheid
        - Drukstabiliteit
        - Duurzaamheid op lange termijn
    - title: Constructietechniek
      body: Opblaasbare vaartuigen vereisen een precieze balans tussen stijfheid, gewicht, draagbaarheid en stabiliteit. afarer-engineering richt zich op het optimaliseren van deze factoren door middel van drop-stitch kerntechnologie en geavanceerde naadconstructie.
      items:
        - Stijfheid
        - Gewichtsoptimalisatie
        - Draagbaarheid
        - Stabiliteit
    - title: Productieprecisie
      body: 'Elk product doorloopt gecontroleerde processen: materiaalvoorbereiding, precisiesnijden, lassen en verbinden, montage, kwaliteitsinspectie en prestatieverificatie.'
      items:
        - Materiaalvoorbereiding
        - Precisiesnijden
        - Lassen & Verbinden
        - Montage & QC
    - title: Gebruikersscenario-engineering
      body: Producten worden ontwikkeld rondom echte toepassingen — recreatie, avontuur en professioneel gebruik — zodat elk ontwerp voldoet aan de specifieke eisen van de beoogde omgeving.
      items:
        - Recreatie
        - Avontuur
        - Professioneel
        - Commercieel

meta:
  title: 'Wereldwijde Aanwezigheid — SUP-fabrikant actief in 50+ Landen | {SITE}'
  description: 'afarer exporteert opblaasbare SUPs en boten naar meer dan 50 landen op elk continent. Professionele fabrikant en leverancier voor merken, distributeurs en vloten.'
  keywords:
    - 'wereldwijde SUP-fabrikant'
    - 'paddle board exporteur'
    - 'SUP-fabriek China'
    - 'professionele SUP-leverancier'
hero:
  tagline: Wereldwijde aanwezigheid
  title: Actief in 50+ Landen<br />op Elk Continent
  subtitle: Van Europese kustpatrouilleoperators tot Australische watersportdistributeurs tot reddingsteams in het Midden-Oosten — afarer-boten zijn wereldwijd op het water te vinden.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp

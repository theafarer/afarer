features3_markets:
  tagline: Belangrijke Markten
  title: Regionale Expertise<br />voor Lokale Vereisten
  subtitle: We begrijpen dat verschillende markten verschillende wettelijke vereisten, voorkeuren en gebruikssituaties hebben.
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa & VK
      description: CE-gecertificeerde producten die voldoen aan EN ISO 6185-normen. Sterke vraag naar SUP's, opblaasbare boten en SUP-planken in EU-markten. Britse distributeurs waarderen onze snelle doorlooptijd.
      icon: tabler:map-pin
    - title: Noord-Amerika
      description: Door de US Coast Guard goedgekeurde productie. Magazijn in Montclair, CA voor snelle levering aan de westkust. Groeiende vraag naar vissersboten, reddingsvaartuigen en recreatieve SUP's.
      icon: tabler:map-pin
    - title: Australië & Oceanië
      description: Sterke markt voor SUP-boten en opblaasbare bijboten. Australische distributeurs waarderen onze Hypalon-boten vanwege UV-bestendigheid in zware zonomslandigheden. Snelle verzending vanuit onze faciliteit in Azië.
      icon: tabler:map-pin
    - title: Midden-Oosten
      description: Groeiende vraag naar patrouille- en reddingsboten. Onze SUP's met aluminium romp zijn populair bij kustwacht- en veiligheidsoperators. Aangepaste configuraties voor omgevingen met hoge temperaturen.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distributienetwerk
  title: Samenwerken met Distributeurs<br />Wereldwijd
  subtitle: We werken samen met gevestigde distributeurs van maritieme apparatuur, watersportmerken en overheidsinkoopdiensten.
  isBeforeContent: false
  columns: 3
  items:
    - title: Co-brandprogramma's
      description: Private label productie voor wereldwijde watersportmerken. Wij regelen alles van ontwerp tot productie tot drop-shipping.
      icon: tabler:building
    - title: Distributeursnetwerk
      description: Geautoriseerde distributeurs in 20+ landen voeren voorraad en bieden lokale ondersteuning. Nieuwe distributeursaanvragen zijn welkom.
      icon: tabler:users
    - title: Overheid & Instellingen
      description: Directe levering aan kustwachten, zoek- en reddingsorganisaties en militaire inkoopprogramma's. Naleving van institutionele inkoopvereisten.
      icon: tabler:building-community
steps2_logistics:
  title: Wereldwijde Logistiek & Ondersteuning
  subtitle: Van fabriek tot bestemming — we beheren de hele toeleveringsketen.
  items:
    - title: Verzendopties
      description: Zeevracht (FOB Qingdao), luchtvracht voor spoedorders en expreskoerier voor monsters en reserveonderdelen.
      icon: tabler:truck-delivery
    - title: VS-magazijn
      description: 'Voorraad in Montclair, CA voor snelle levering in Noord-Amerika. Westkust: 2-3 dagen, Centraal: 3-4 dagen, Oostkust: 4-5 dagen.'
      icon: tabler:building-warehouse
    - title: Reserveonderdelen
      description: Echte afarer-onderdelen en verbruiksartikelen het hele jaar door op voorraad. Veelvoorkomende onderdelen worden binnen 24 uur verzonden.
      icon: tabler:package
    - title: Technische ondersteuning
      description: Directe lijn naar ons technische team voor technische vragen, reparatieadvies en refit-ondersteuning. We ondersteunen boten die we 20 jaar geleden hebben gebouwd.
      icon: tabler:headset
cta:
  title: Wilt u distributeur worden?
  subtitle: We zijn actief ons distributienetwerk aan het uitbreiden. Neem contact op met ons exportteam om samenwerkingsmogelijkheden te bespreken.
  actions:
    - variant: primary
      text: Partnerschapsaanvraag
      href: /contact
    - text: Bekijk ons productassortiment

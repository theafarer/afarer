meta:
  title: 'Offerte Aanvragen — OEM-SUP-productie | {SITE}'
  description: 'Vraag een gedetailleerde offerte aan voor jouw opblaasbare SUP- of botenproject. OEM/ODM-productie, private label of aangepaste vloten: we reageren binnen 2 werkdagen.'
  keywords:
    - 'SUP offerte aanvragen'
    - 'OEM paddle board offerte'
    - 'SUP-fabriek offerte'
    - 'prijs opblaasbare SUP'
hero_text:
  tagline: Vraag een offerte aan
  title: Vraag een Offerte Aan<br />voor Uw Project
  subtitle: Vertel ons uw wensen en ons team reageert binnen 2 werkdagen met een gedetailleerde offerte.
steps2_process:
  title: Hoe Het Werkt
  subtitle: Vier eenvoudige stappen van aanvraag tot offerte.
  items:
    - title: 'Stap 1: Diens Uw Wensen In'
      description: Vul het onderstaande formulier in met uw producttype, hoeveelheid en specificaties. Hoe meer detail u verstrekt, hoe nauwkeuriger uw offerte.
      icon: tabler:file-text
    - title: 'Stap 2: Wij Beoordelen & Adviseren'
      description: Ons technische team beoordeelt uw wensen en neemt mogelijk contact met u op voor verduidelijking. Wij geven aanbevelingen over productconfiguratie en opties.
      icon: tabler:users
    - title: 'Stap 3: Ontvang Uw Offerte'
      description: U ontvangt een gedetailleerde offerte inclusief eenheidsprijs, MOQ, levertijd, betalingsvoorwaarden en verzendopties. Doorgaans binnen 48 uur.
      icon: tabler:currency-dollar
    - title: 'Stap 4: Monster & Productie'
      description: Na acceptatie van de offerte gaan we over tot monsterproductie (indien van toepassing) of direct tot massaproductie. Regelmatige updates gedurende het hele proces.
      icon: tabler:building-factory
content_form:
  tagline: Offerteformulier
  title: Vertel Ons Over Uw Project
  subtitle: Alle velden met * zijn verplicht.
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Duikcentrum
        - Vissen
        - Marine Toerisme / Resort
        - Zoek- en reddingsoperaties
        - Jachtsteiger
        - Commercieel werkboot
        - Overheid / Militair
        - OEM / Eigen merk
        - Persoonlijk / Recreatief
        - Overige
    - name: Target Market
      type: text
      placeholder: bijv. Europa, Noord-Amerika, Midden-Oosten
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: bijv. levering binnen 90 dagen
    - name: Additional Requirements
      type: textarea
      options:
        - Geen voorkeur
        - Marine-kwaliteit PVC (1100 dtex)
        - Premium Hypalon / CSM
        - GFK-romp
        - Aluminium romp
    - name: Engine Requirement
      type: text
      placeholder: bijv. 60 pk buitenboordmotor, geen motor, twee keer 115 pk
    - name: Customization Required
      type: text
      placeholder: bijv. aangepaste kleuren, branding/logo, verpakking, speciale bevestigingen
    - name: Timeline
      type: text
      placeholder: bijv. levering binnen 90 dagen
    - name: Additional Requirements
      type: textarea
      placeholder: Beschrijf uw toepassing, technische specificaties of eventuele speciale vereisten — voeg indien beschikbaar referentietekeningen, specificaties of links toe
    - name: Upload Specification
      type: file
      placeholder: Upload uw specificatieblad, tekening of referentiedocument (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Upload uw logo of kunstwerk voor aangepaste branding (AI, EPS, PNG)
cta:
  title: Liever per e-mail bespreken?
  subtitle: Stuur uw aanvraag rechtstreeks naar ons verkoopteam en wij reageren binnen 24 uur.
  actions:
    - variant: primary
      text: Stuur ons direct een e-mail
      href: /contact

meta:
  title: Hoe de dikte van een SUP te kiezen — Technische analyse | {SITE}
  description: 'Technische gids voor de dikte van opblaasbare SUP-boards: hoe 4", 5" en 6" boards verschillen in stijfheid, gewicht, stabiliteit, koersvastheid en prestaties. Aanbevelingen voor dikte voor toeren, yoga, surfen, racen en allround peddelen.'
back_text: Terug naar Onderzoek
hero:
  tagline: Techniek
  title: Hoe SUP-dikte te kiezen — technische analyse
  subtitle: 6 minuten lezen
content_html: |-
  <h2>De drie standaarddiktes</h2>

  <h3>4" (10 cm) – Touring &amp; Prestaties</h3>
  <ul>
    <li>Hoogste stijfheid – minder flex onder belasting</li>
    <li>Lichtste – minder materiaal, minder luchtvolume</li>
    <li>Uitstekende koersvastheid – minder slingeren van links naar rechts</li>
    <li>Snelste – minder weerstand, gemakkelijker glijden</li>
    <li>Geschikt voor: touring, racen, fitness peddelen, ervaren peddelaars</li>
  </ul>

  <h3>5" (12,7 cm) – Allround</h3>
  <ul>
    <li>Goede stijfheid – evenwichtige flex-stijfheidsverhouding</li>
    <li>Gemiddeld gewicht – standaard materiaalverbruik</li>
    <li>Goede primaire + secundaire stabiliteit</li>
    <li>Geschikt voor: recreatief peddelen, beginners, incidenteel gebruik op meren en rivieren</li>
  </ul>

  <h3>6" (15,2 cm) – Stabiliteit &amp; Yoga</h3>
  <ul>
    <li>Hoogste primaire stabiliteit – groot drijfvermogen</li>
    <li>Zwaarste – meer PVC-materiaal, groter luchtvolume</li>
    <li>Langzaamste – meer weerstand, glijden moeilijker vol te houden</li>
    <li>Geschikt voor: yoga/fitness, zware peddelaars (100+ kg), zeer ruwe omstandigheden</li>
  </ul>

  <h2>Technische analyse</h2>
  <p>De stijfheid van een opblaasbare SUP wordt bepaald door de interne luchtdruk en het traagheidsmoment van de doorsnede van de plank. Bij 20 PSI vertoont een 4" plank onder belasting ongeveer 30% minder doorbuiging dan een 6" plank met dezelfde breedte en lengte. Primaire stabiliteit komt voort uit de breedte van de waterlijn en het drijfvermogen; secundaire stabiliteit wordt beïnvloed door de vorm van de rail en de breedte van de plank.</p>

  <h2>Dikte naar gewicht van de peddelaar</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Gewicht peddelaar</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Aanbevolen dikte</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Onder 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" of 6"</td></tr>
      <tr><td class="p-3 border">Boven 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>De afweging dikte vs. PSI</h2>
  <p>Een veelvoorkomend misverstand is dat een hogere PSI een te grote dikte kan compenseren. Bij 25 PSI vertoont een 6" plank meer flex dan een 4" plank bij 15 PSI, omdat het geometrische traagheidsmoment de stijfheidsvergelijking domineert. Voor prestatiegerichte peddelaars presteert een dunnere plank bij lagere druk beter dan een dikkere plank bij hogere druk.</p>

  <h2>Het gamma van afarer</h2>
  <ul>
    <li><strong>4" planken:</strong> Cheetah Touring-serie – 12' x 30" x 4" touring SUPs voor fitness en afstandspeddelen</li>
    <li><strong>5" planken:</strong> Cheetah All-Round-serie – 10'6" x 32" x 5" voor recreatief gebruik</li>
    <li><strong>6" planken:</strong> Cheetah Ultra-Stable-serie – 10' x 34" x 6" voor yoga, grote peddelaars en platforms voor fotografie</li>
  </ul>
  <p>Alle planken gebruiken 1,680 DTEX drop-stitch kernen met een nominale druk van 20 PSI en 1,2 mm PVC-laminaten.</p>

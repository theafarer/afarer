meta:
  title: Hoe de dikte van een SUP te kiezen — Technische analyse | {SITE}
  description: 'Technische gids voor de dikte van opblaasbare SUP-boards: hoe 4", 5" en 6" boards verschillen in stijfheid, gewicht, stabiliteit, koersvastheid en prestaties. Aanbevelingen voor dikte voor toeren, yoga, surfen, racen en allround peddelen.'
back_text: Terug naar Onderzoek
hero:
  tagline: Techniek
  title: Hoe SUP-dikte te kiezen — technische analyse
  subtitle: 6 minuten lezen
content_html: >
  <h2>De drie standaarddiktes</h2>


  <h3>4" (10 cm) – Tournees &amp; optredens</h3>

  <ul>
    <li>Hoogste stijfheid – minder buiging onder belasting</li>
    <li>Licht – minder materiaal, minder luchtvolume</li>
    <li>Uitstekende tracking – minder zijwaartse schommelingen</li>
    <li>Snelst – minder weerstand, makkelijker glijden</li>
    <li>Het beste voor: touren, racen, fitness peddelen, ervaren peddelaars</li>
  </ul>


  <h3>12,7 cm (5") – Allround</h3>

  <ul>
    <li>Goede stijfheid – evenwichtige buig-stijfheidsverhouding</li>
    <li>Gemiddeld gewicht – standaard materiaalgebruik</li>
    <li>Goede primaire secundaire stabiliteit</li>
    <li>Ideaal voor: Recreatief peddelen, beginners, casual gebruik van meer en rivier</li>
  </ul>


  <h3>15,2 cm (6") – Stabiliteit &amp; Yoga</h3>

  <ul>
    <li>Hoogste primaire stabiliteit – massieve drijfkracht</li>
    <li>Zwaarst – meer PVC-materiaal, groter luchtvolume</li>
    <li>Langzaamste – meer weerstand, moeilijker om de glijbeweging vast te houden</li>
    <li>Het beste voor: yoga/fitness, zware peddelaars (100 kg), zeer hobbelige omstandigheden</li>
  </ul>


  <h2>Technische Analyse</h2>

  <p>De stijfheid van een opblaasbare SUP wordt bepaald door de interne luchtdruk en het traagheidsmoment van de dwarsdoorsnede van de printplaat. Bij 20 PSI vertoont een 4" board ongeveer 30% minder doorbuiging onder belasting dan een 6" board van dezelfde breedte en lengte. De primaire stabiliteit
  komt voort uit de breedte en drijfvermogen van de waterlijn; secundaire stabiliteit wordt beïnvloed door de vorm van de rails en de breedte van het bord.</p>


  <h2>Dikte naar gewicht van de peddelaar</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      < klasse="bg-gray-100">
        < klasse="p-3 tekst-links lettertype-semibold text-grijs-900 rand">Peddelgewicht</th>
        < klasse="p-3 tekst-links lettertype-semibold text-grijs-900 rand">Aanbevolen dikte</th>
      </tr>
    </thead>
    <tbody>
      <tr><td klasse="p-3 grens">Onder de 65 kg (143 lbs)</td>< klasse td = "p-3 grens">4"</td></tr>
      <tr><td-klasse="P-3 rand">65 – 90 kg (143 – 198 lbs)</td><td-klasse="p-3 grens">5"</td></tr>
      <tr><td-klasse="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td-klasse="p-3 border">5" of 6"</td></tr>
      <tr><td klasse="p-3 rand">Meer dan 115 kg (253 lbs)</td>< td klasse="p-3 rand">6"</td></tr>
    </tbody>
  </table>


  <h2>Dikte versus PSI Afweging</h2>

  <p>Een veelvoorkomende misvatting is dat een hogere PSI een overmatige dikte kan compenseren. Bij 25 PSI vertoont een 6" board meer flexibiliteit dan een 4" board bij 15 PSI, omdat het geometrische traagheidsmoment de stijfheidsvergelijking domineert. Voor prestatiegerichte peddelaars presteert
  een dunner board bij lagere druk beter dan een dikkere board bij hogere druk.</p>


  <h2>Afarer Bezetting</h2>

  <ul>
    <li><strong>4" boards:</strong> Cheetah Touring-serie – 12' x 30" x 4" touring SUP's voor fitheid en afstandspeddelen</li>
    <li><strong>5" planken:</strong> Cheetah All-Round serie – 10'6" x 32" x 5" voor recreatief gebruik</li>
    <li><strong>6" planken:</strong> Cheetah Ultra-Stable serie – 30' x 34" x 6" voor yoga, grote peddels en fotografieplatforms</li>
  </ul>

  <p>Alle boards gebruiken 1.680 DTEX drop-stitch cores met een druk van 20 PSI en 1,2 mm PVC-laminaten.</p>

how_to_choose:
  title: Hoe kies je de juiste maat
  cards:
    - title: SUP-boards
      description: Kies de lengte op basis van je gewicht en beoogd gebruik. Bredere boards (32"+) bieden meer stabiliteit. Langere boards (11-12 voet) houden beter koers tijdens toeren. Zwaardere peddelaars hebben boards met meer volume nodig.
    - title: Touring SUP's
      description: Langere boards (11–12 ft) zijn het beste voor afstand en touring. Breedere boards (32"+) bieden meer stabiliteit. Controleer het gewichtsvermogen voor de totale lading inclusief uitrusting.

    - title: All-round SUP's
      description: Kies de lengte op basis van het gewicht van de rijder en het beoogde gebruik. All-round boards zijn geschikt voor recreatie, fitness en yoga. Kleinere boards zijn wendbaarder.

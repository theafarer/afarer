categories:
  inflatable: Opblaasbare SUP's ontworpen voor draagbaarheid zonder prestatieverlies. Vind de juiste maat voor jouw gewicht en paddlestijl.
  sup: Stand-up paddleboards voor toertochten, yoga, fitness en recreatief peddelen. Kies op lengte en gewicht van de rijder.
  accessory: Accessoires en veiligheidsuitrusting om je watersportuitrusting compleet te maken. Universele maten met meerdere opties.
table:
  headers:

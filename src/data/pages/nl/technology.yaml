  title: 'Technologie — Drop Stitch & Maritiem PVC | {SITE}'
  description: 'afarer-technologieën: drop stitch-constructie, maritiem PVC, dubbellaagse constructies en hoge druk. Innovatie van een professionele fabrikant van opblaasbare SUPs.'
  keywords:

hero:
  tagline: Naleving
  title: Hoe CE-certificering werkt voor opblaasbare watervaartuigen
  subtitle: 7 minuten lezen
content_html: >
  <h2>Wat is CE-certificering?</h2>

  <p>CE-markering (Conformité Européenne) geeft aan dat een product voldoet aan de EU-eisen voor gezondheid, veiligheid en milieu. Voor opblaasbare vaartuigen hangt het relevante regelgevingskader af van de productcategorie.</p>


  <h2>Toepasselijke richtlijnen</h2>


  <h3>Richtlijn Vrije Vaartuigen (2013/53/EU)</h3>

  <p>De primaire richtlijn voor de meeste opblaasboten, SUP's en kajaks. Het geldt voor recreatieve vaartuigen van 2,5 m tot 24 m romplengte, gedeeltelijk voltooide boten (voor OEM-levering) en persoonlijke watervaartuigen.</p>


  <h3>Verordening Persoonlijke Beschermingsmiddelen (2016/425)</h3>

  <p>Reddingsvesten, drijfhulpmiddelen en veiligheidsuitrusting die bij vaartuigen worden geleverd, moeten voldoen aan de vereisten van de PBM-regelgeving, waaronder type-keuring (Module B) door een aangewezen instantie en kwaliteitscontrole voor productie (Module D of E).</p>


  <h2>Het certificeringsproces</h2>

  <ol>
    <li>Productclassificatie: Bepaal de ontwerpcategorie van het ambacht (A – D volgens ISO 8666)</li>
    <li>Toepasselijke normen: EN ISO 6185 (Delen 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (bouwplaat)</li>
    <li>Technische dossieropstelling: ontwerptekeningen, materiaallijst, materiaalcertificaten, risicobeoordeling</li>
    <li>Typetesten: Drijfvermogen, stabiliteit, draagvermogen, materiaaltesten, naadsterkte, luchtretentie</li>
    <li>Fabrieksproductiecontrole: Audits van productieprocessen door een aangemeld orgaan</li>
    <li>Conformiteitsverklaring: Fabrikant ondertekent DoC, bevestigt CE-markering</li>
  </ol>


  <h2>Aangewezen instanties voor opblaasbare watervaartuigen</h2>

  <p>Veelvoorkomende NB's zijn onder andere Bureau Veritas (Frankrijk), DNV GL (Duitsland), RINA (Italië), TÜV Rheinland / TÜV SÜD (Duitsland).</p>



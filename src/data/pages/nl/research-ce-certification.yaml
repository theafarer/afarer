  <h2>Wat dit betekent voor kopers</h2>

  <p>Controleer bij aankoop van CE-gecertificeerde opblaasboten altijd of de CE-markering op het bouwkenteken staat, dat er een geldig DoC is, dat het Notified Body-nummer vermeld staat en dat de handleiding veiligheidsinstructies in je lokale taal bevat. Alle Afarer-producten hebben
  CE-certificering met volledige traceerbaarheid naar auditrapporten van de betreffende instanties.</p>

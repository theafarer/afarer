hero:
  tagline: Naleving
  title: Hoe CE-certificering werkt voor opblaasbare watervaartuigen
  subtitle: 7 minuten lezen
content_html: |-
  <h2>Wat is CE-certificering?</h2>
  <p>CE-markering (Conformit&eacute; Europ&eacute;enne) geeft aan dat een product voldoet aan de EU-eisen voor gezondheid, veiligheid en milieu. Voor opblaasbare vaartuigen hangt het relevante regelgevingskader af van de productcategorie.</p>

  <h2>Toepasselijke richtlijnen</h2>

  <h3>Recreatievaartuigenrichtlijn (2013/53/EU)</h3>
  <p>De voornaamste richtlijn voor de meeste opblaasbare boten, SUPs en kajaks. Deze geldt voor recreatievaartuigen met een romplengte van 2,5 m tot 24 m, deels afgewerkte boten (voor OEM-levering) en waterscooters.</p>

  <h3>Verordening persoonlijke beschermingsmiddelen (2016/425)</h3>
  <p>Reddingsvesten, drijfhulpmiddelen en veiligheidsuitrusting die bij vaartuigen worden geleverd, moeten voldoen aan de eisen van de PBM-verordening, waaronder typeonderzoek (module B) door een aangemelde instantie en productiekwaliteitsborging (module D of E).</p>

  <h2>Het certificeringsproces</h2>
  <ol>
    <li>Productclassificatie: bepaal de ontwerpcategorie van het vaartuig (A – D volgens ISO 8666)</li>
    <li>Toepasselijke normen: EN ISO 6185 (delen 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (bouwersplaat)</li>
    <li>Voorbereiding van het technisch dossier: ontwerptekeningen, stuklijst, materiaalcertificaten, risicobeoordeling</li>
    <li>Typeonderzoek: drijfvermogen, stabiliteit, laadvermogen, materiaaltests, naadsterkte, luchtretentie</li>
    <li>Productiecontrole in de fabriek: audit van de productieprocessen door een aangemelde instantie</li>
    <li>Conformiteitsverklaring: de fabrikant ondertekent de DoC en bevestigt de CE-markering</li>
  </ol>

  <h2>Aangemelde instanties voor opblaasbare vaartuigen</h2>
  <p>Veelvoorkomende NB's zijn Bureau Veritas (Frankrijk), DNV GL (Duitsland), RINA (Itali&euml;), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Duitsland).</p>

  <h2>Tijdlijn en kosten</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fase</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Doorlooptijd</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Typische kosten (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Voorbereiding technisch dossier</td><td class="p-3 border">2 – 4 weken</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Typeonderzoek</td><td class="p-3 border">4 – 8 weken</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Fabrieksaudit</td><td class="p-3 border">1 – 2 dagen (ter plaatse)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Totaal (eerste product)</td><td class="p-3 border">8 – 14 weken</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Wat dit betekent voor kopers</h2>
  <p>Controleer bij de aankoop van CE-gecertificeerde opblaasbare boten altijd dat de CE-markering op de bouwersplaat staat, dat er een geldige DoC bestaat, dat het nummer van de aangemelde instantie is vermeld en dat de gebruikershandleiding veiligheidsinstructies in uw eigen taal bevat. Alle afarer-producten dragen CE-certificering met volledige traceerbaarheid naar de auditrapporten van de aangemelde instantie.</p>

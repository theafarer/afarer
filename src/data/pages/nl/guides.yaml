hero:
  tagline: Gidsen
  title: Nieuw met SUP?
  subtitle: Praktische gidsen om je te helpen bij het kiezen, gebruiken en genieten van opblaasbare SUP-boards.
size_guide:
  tagline: Formaat & Specificaties
  title: Vind de juiste maat voor uw behoeften
  desc: Vergelijk SUP-boardafmetingen, draagvermogens en aanbevolen gebruik. Of je nu een touring SUP, een yoga board of een allround SUP nodig hebt — onze maattabel helpt je de juiste keuze te maken.
  link_label: Volledige maatgids met productspecificaties →
  link: /size-guide
  cards:
    - title: SUP-borden
      desc: Kies de lengte op basis van je gewicht en beoogd gebruik. Bredere boards (32") bieden meer stabiliteit. Langere boards (3,5 tot 60 cm) baan is beter voor toeren.
    - title: Touring SUP's
      desc: Langere boards (11—2 ft) om afstand af te leggen en recht te volgen. Stabiel genoeg voor toeren met uitrusting. Controleer altijd de draagkracht.
    - title: Allround SUP's
      desc: Kies lengte op basis van het gewicht van de rijder en gebruik deze aan. Bredere planken (32") voor stabiliteit. Veelzijdig voor recreatie en fitness.

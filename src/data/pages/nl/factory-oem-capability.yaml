services:
  - title: Productontwerp & techniek
    description: Ons interne R&D-team werkt met uw concept of specificatie om CAD-tekeningen, 3D-modellen en prototypes te ontwikkelen. We bieden matrijsontwerp, optimalisatie van de rompvorm en begeleiding bij materiaalselectie.
  - title: Aangepaste Branding & Grafische Afbeeldingen
    description: Full-colour digitaal printen, zeefdruk, embossen en labelopties. We ontwikkelen merk-specifieke deckgraphics, buisbranding en winkelklare verpakkingen.
  - title: Materiaal- en specificatieaanpassing
    description: Kies uit PVC (standaard, milieuvriendelijk, brandvertragend), Hypalon/CSM, drop-stitch en hybride constructies. Op maat gemaakte buiskleuren, stofgewichten en versterkingsopties.
  - title: Verpakking en Logistiek
    description: Aangepaste detailhandelsverpakking, huismerkdozen, vacuümverpakking, palletiseren en laden van containers. FOB Qingdao, CIF of DDP verzendvoorwaarden beschikbaar.
moq_table:
  - product: Opblaasbare SUP-borden
    standard_moq: 5—0 eenheden
    custom_moq: 200 eenheden
    lead_time: 30—5 dagen
  - product: Reddingsvesten & Veiligheid
    standard_moq: 100—00 eenheden
    custom_moq: 1.000 eenheden
    lead_time: 20—0 dagen
why_us:
  - title: Verticale integratie
    description: We bezitten onze fabriek, mallen en toeleveringsketen — geen tussenpersonen, geen onderaannemers. Dit geeft ons controle over kwaliteit, kosten en levering.
  - title: Dubbele certificering
    description: ISO 9001 kwaliteitsbeheer en BSCI sociale nalevingscertificering. Fabrieksauditrapporten beschikbaar op aanvraag.
  - title: CE-conformiteit
    description: Alle standaardmodellen dragen CE 2013/53/EU-certificering. Aangepaste modellen kunnen CE-gecertificeerd worden via ons gevestigde proces.
  - title: Lage MOQ
    description: Begin met zo weinig als 5 eenheden voor standaardmodellen. Wij helpen opkomende merken lanceren zonder te veel voorraad vast te zetten.

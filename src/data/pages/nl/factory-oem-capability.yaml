hero:
  tagline: OEM/ODM Productie
  title: OEM- en private label-productie
  subtitle: From concept to container —customize every detail of your inflatable watercraft line
intro: >-
  Afarer biedt uitgebreide OEM- en ODM-diensten voor merken, distributeurs en overheidsinstanties wereldwijd. Met 10 jaar exportervaring en een ISO 9001- en BSCI-gecertificeerde fabriek van 12.000 m², behandelen wij alles van productontwerp en matrijsontwikkeling tot grootschalige productie,
  verpakking en logistiek.

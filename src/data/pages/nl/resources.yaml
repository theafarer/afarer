meta:
  title: B2B bronnen en downloads | {SITE}
  description: Download OEM-productiegidsen, productcatalogi, kwaliteitsrapporten en ROI-calculators voor opblaasbare SUP-bedrijven.
hero:
  tagline: Middelencentrum
  title: Hulpmiddelen & Bronnen<br />Voor SUP Zakenpartners
  subtitle: Download OEM-gidsen, productcatalogi, kwaliteitsrapporten en gebruik onze ROI-calculator om uw investering in een SUP-vloot te plannen.
resources:
  - title: 2026 OEM/ODM Productcatalogus
    description: Volledige productlijn met specificaties, prijsklassen, minimale bestelhoeveelheid en maatwerkopties voor B2B-partners.
    icon: tabler:file-text
    type: catalog
    link: /media
    cta: Download catalogus
  - title: Private Label SUP Merkgids
    description: Stapsgewijze handleiding voor het lanceren van je eigen SUP-merk — van marktonderzoek en ontwerp tot productie en wereldwijde levering.
    icon: tabler:book
    type: guide
    link: /news/private-label-sup-oem-guide
    cta: Lees handleiding
  - title: SUP-vloot ROI-calculator
    description: Schat uw investering in het SUP-vloot van uw resort of club, de geraamde omzet en de terugverdientijd met onze interactieve calculator.
    icon: tabler:calculator
    type: tool
    link: '#roi-calculator'
    cta: Bereken ROI
  - title: Kwaliteits- en Certificeringsrapport
    description: CE-certificatiedocumenten, ISO 9001 kwaliteitsmanagement, UV-verouderingstestresultaten en drukvasthoudtestgegevens.
    icon: tabler:certificate
    type: report
    link: /evidence
    cta: Rapporten bekijken
  - title: Folder over de fabriekscapaciteit
    description: Virtuele rondleiding door onze 12.000 m² grote productiefaciliteit met details van de productielijn en kwaliteitscontroleprocessen.
    icon: tabler:building-factory
    type: brochure
    link: /factory
    cta: Tourfabriek
  - title: Gids voor inkomsten van resortvloot
    description: Analyse van het rendement op investering (ROI) van een commerciële SUP-vloot met prijsmodellen, gebruikspercentages en resultaten van een echte casestudy van 5-sterrenresorts.
    icon: tabler:chart-bar
    type: guide
    link: /news/commercial-sup-fleet-roi-resorts
    cta: Lees handleiding
cta:
  title: Hulp nodig bij het vinden van de juiste bron?
  subtitle: Neem contact op met ons team voor persoonlijk advies over productselectie, OEM-partnerschappen of technische specificaties.
  button: Neem contact op met het verkoopteam
  link: /contact?source=resources

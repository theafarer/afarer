hero_text:
  tagline: Resources
  title: 'Downloadcentrum & Kopersgidsen'
  subtitle: 'Toegang tot productcatalogi, OEM-gidsen, koperschecklisten en technische documentatie om u te helpen weloverwogen inkoopbeslissingen te nemen.'
features3_downloads:
  tagline: Downloads
  title: 'Productdocumentatie<br />& Kopersinformatie'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Volledig productassortiment inclusief SUP-boten, opblaasbare boten, SUP-planken, kajaks en accessoires. Specificaties, configuraties en opties. PDF-formaat.'
      icon: tabler:file-text
    - title: 'OEM Productiegids'
      description: 'Alles wat u moet weten over OEM/ODM-partnerschappen: procesoverzicht, minimale bestelhoeveelheden, aanpassingsopties, kwaliteitscontrole en verzending.'
      icon: tabler:building-factory
    - title: 'SUP Boot Kopersgids'
      description: 'Hoe kiest u de juiste SUP: rompmaterialen, slangmaterialen, motorselectie, maatoverwegingen en configuratieopties voor verschillende toepassingen.'
      icon: tabler:file-description
    - title: 'SUP Leverancierschecklist'
      description: 'Belangrijke overwegingen bij het selecteren van een SUP-fabrikant: kwaliteitsindicatoren, certificeringseisen, MOQ-overwegingen en waar u op moet letten bij een fabrieksaudit.'
      icon: tabler:clipboard-check
    - title: 'Opblaasbare Boot Materialengids'
      description: 'PVC vs Hypalon: vergelijking van duurzaamheid, UV-bestendigheid, levensduur, reparatiemogelijkheden en kostenoverwegingen voor verschillende maritieme toepassingen.'
      icon: tabler:files
    - title: 'Template voor Maatwerk Productiebrief'
      description: 'Download ons template voor een productbrief. Vul uw wensen in en stuur het naar ons terug voor een offerte en haalbaarheidsbeoordeling binnen dezelfde week.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Veelgestelde vragen over onze producten, productieproces en samenwerkingsmodel.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ varieert per productcategorie. SUP-boten beginnen meestal vanaf 10 stuks per model. SUP-planken vanaf 50 stuks. Neem contact op met ons verkoopteam voor productspecifieke MOQ-informatie.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Ja. afarer biedt monsterproductie voor evaluatie vóór massaproductie. Monstermosten zijn bespreekbaar en worden vaak verrekend met de eerste productieorder.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Standaardvoorwaarden zijn 30% aanbetaling bij bestelling, 70% vóór verzending. LC-voorwaarden beschikbaar voor gekwalificeerde klanten. Neem contact op met ons financiële team om regelingen te bespreken.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Typische levertijden: SUP-boten 30-45 dagen, SUP-planken 20-30 dagen, opblaasbare boten 25-35 dagen. Maatwerkontwikkeling voegt 15-30 dagen toe voor prototyping.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'CE-certificering voor EU-markten, door de US Coast Guard goedgekeurde productie, ISO-kwaliteitssysteem, BSCI-naleving en REACH-materiaalconformiteit.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Ja. Wij leveren maatwerk verpakking met uw logo, kleuren en merkidentiteit. MOQ voor maatwerk verpakking is afhankelijk van de productcategorie.'
      icon: tabler:color-swatch
cta:
  title: 'Hulp nodig bij het vinden van de juiste bron?'
  subtitle: 'Neem contact op met ons team voor persoonlijk advies over productselectie, OEM-partnerschappen of technische specificaties.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

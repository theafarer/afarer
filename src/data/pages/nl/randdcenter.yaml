meta:
  title: R&D Centrum | {SITE}
  description: Onderzoek & Ontwikkeling — PVC-stoftesten, romponderzoek, RF-lassen, hydrodynamische tests en kwaliteitscontrole. Maatwerk R&D-diensten beschikbaar.
hero:
  tagline: R&D Centrum
  title: R & D Centrum
  subtitle: Gefocust op Vooruitgang
intro:
  - >-
    Het Onderzoeks- en Ontwikkelingscentrum (R&D) van Afar is de drijvende kracht achter onze missie om watersportuitrusting te revolutioneren. We geven watersportliefhebbers wereldwijd de mogelijkheid om veiliger, comfortabeler en plezieriger te genieten van onze producten door voortdurende
    innovatie in opblaasbare stand-up paddleboards (SUP's) en boten. Ons toegewijde team van ingenieurs, ontwerpers en gepassioneerde watersportexperts vormt de toekomst van de industrie en blijft consequent de lat hoger leggen voor kwaliteit, prestaties en duurzaamheid.
  - Onze R&D-faciliteit brengt materiaalkundigen, scheepsarchitecten en productietechnici onder één dak samen. Van stofformulering en romp simulatie tot ontwikkeling van lasprocessen en volledige zeetrials, elke fase van productontwikkeling wordt gestuurd door gegevens en gevalideerd door testen.
mission:
  tagline: Onze Missie
  title: De toekomst van watersport vernieuwen
  pillars:
    - icon: lightning
      title: Technologische vooruitgang
      desc: Het pionieren van nieuwe materialen, ontwerpen en fabricage voor superieure productprestaties en duurzaamheid.
    - icon: design
      title: Gebruikersgericht ontwerp
      desc: Diepgaand begrip van en het overtreffen van de behoeften van gebruikers door ergonomisch en intuïtief productontwerp.
    - icon: globe
      title: Duurzame praktijken
      desc: Ons ecologische voetafdruk minimaliseren door gebruik te maken van milieuvriendelijke materialen en processen.
    - icon: shield
      title: Onverbiddelijke veiligheid
      desc: Het waarborgen van de hoogste veiligheidsnormen door middel van rigoureuze tests en certificering.
pillars:
  - title: Technologische vooruitgang
    desc: Pionieren van nieuwe materialen, ontwerpen en productieprocessen om superieure productprestaties en duurzaamheid te leveren.
    icon: tech
  - title: Geavanceerde Materialen
    desc: Onderzoek naar geavanceerd PVC, Hypalon, composieten en duurzame alternatieven voor verbeterde producteigenschappen.
    icon: materials
  - title: Duurzaamheid
    desc: 'Een kernverbintenis: Wij zijn toegewijd aan milieubeheer door middel van duurzaam produceren en recycleerbare materialen.'
    icon: sustainability
capabilities:
  tagline: Vermogens
  title: R&D-mogelijkheden
  subtitle: Vier kerngebieden die ons end-to-end controle geven over productontwikkeling — van onderzoek naar grondstoffen tot eindcertificering.
  groups:
    - title: Materiaalkunde & Textieltechnologie
      items:
        - Analyse en optimalisatie van PVC- en Hypalonformuleringen
        - UV-stabilisatie, vlamvertragende eigenschappen en de ontwikkeling van antimicrobiële additieven
        - Meerlaagse stoffen laminering en hechttechniek
        - Versnelde verouderingstests (UV, thermisch, vochtigheid, zoutnevel)
    - title: Rompkunde & Hydrodynamica
      items:
        - Parametrisch 3D-rompontwerp en CFD-optimalisatie
        - Eindige-elementenanalyse voor structurele en impactbelastingen
        - Schaalmodel sleeptanktesten en prestatievalidatie
        - Aangepaste rompontwikkeling voor speciale missieprofielen
    - title: Lastechniek & Verbindings Technologie
      items:
        - Ontwikkeling en optimalisatie van RF-dielectric lasproces
        - Hete-lucht-, hete-klep- en ultrasone lasmethoden
        - Lijmverbinding en naadtoevoer kwalificatie
        - Lasssterkte modellering en levensduursvoorspelling
    - title: Testen, Certificering & Naleving
      items:
        - Kwaliteitsbeheer en CE-conformiteitstests
        - Onafhankelijke tests en certificeringsondersteuning door derden
        - Ontwikkeling van aangepast testprotocol voor inkoopkwalificatie
        - Storingsanalyse tijdens gebruik en onderzoek naar de grondoorzaak

meta:
  title: 'Partners — Distributie & Groothandel | {SITE}'
  description: "Word een afarer-partner: distributienetwerken, groothandelsprijzen, OEM/private label-programma's en ondersteuning voor paddle board-bedrijven wereldwijd."
  keywords:
    - 'SUP distributiepartner'
    - 'paddle board groothandel'
    - 'opblaasbare SUP distributeur'
    - 'SUP partnership'
hero:
  tagline: Partners & Distributie
  title: Word een afarer Partner<br />— Wereldwijd Distributienetwerk
  subtitle: Sluit je aan bij het wereldwijde partnernetwerk van Afarer. We werken samen met maritieme distributeurs, botenverkopers, uitrustingswinkels en merkpartners in meer dan 50 landen.
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: wereldwijd partner- en distributeursnetwerk
content_programs:
  tagline: Partnerprogramma's
  title: Partnerprogramma's<br />Gebouwd voor Groei
  subtitle: Of u nu distributeur, dealer of merkpartner bent, afarer biedt programma's ontworpen om uw bedrijf te ondersteunen.
  columns: 3
  items:
    - title: Distributeursprogramma
      description: Exclusieve gebiedsdistributie met volumeprijzen, marketingondersteuning en directe fabriekstoegang. Minimale inzet vereist op basis van gebiedsgrootte.
      icon: tabler:world
    - title: Dealersprogramma
      description: Directe dealerprijzen, producttraining, marketingmateriaal en garantieondersteuning voor winkels en online winkels.
      icon: tabler:building-store
    - title: OEM/ODM Partnerschap
      description: Volledige OEM- en ODM-productie met maatwerk branding, verpakking en productspecificaties. Van concept tot container.
      icon: tabler:certificate
    - title: Merkpartnerschap
      description: Co-branding, private label en exclusieve modelprogramma's voor gevestigde merken in de maritieme en outdoor recreatiebranche.
      icon: tabler:stars
    - title: Overheid & Institutioneel
      description: Voorkeursleveranciersprogramma's voor overheidsinstanties, kustwachten, leger en humanitaire organisaties. Aanbestedingsklare documentatie.
      icon: tabler:building-community
    - title: Resort & Verhuurpartner
      description: Vlootprijzen, consistente kwaliteit en maatwerk branding voor resorts, duikcentra en verhuurbedrijven wereldwijd.
      icon: tabler:sun
content_benefits:
  tagline: Waarom met ons samenwerken
  title: Waarom Partners Kiezen voor afarer
  subtitle: Onze partners profiteren van echte productiecapaciteit, consistente kwaliteit en responsieve ondersteuning.
  list:
    - 'Directe Fabriekstoegang: Werk direct met ons productieteam — geen tussenpersonen. Snellere reacties, betere prijzen en volledig inzicht in productie.'
    - "Maatwerk Gereed: Brand uw producten met aangepaste kleuren, logo's, verpakking en specificaties. Minimale bestelhoeveelheden afgestemd op uw markt."
    - 'Kwaliteit Gegarandeerd: ISO 9001 gecertificeerde productie met CE, UKCA en BSCI-naleving. Elk product getest vóór verzending.'
    - 'Wereldwijde Logistiek: Verzending vanuit Qingdao, China met FOB, CIF en DDP-opties. Magazijn in Montclair, CA voor Noord-Amerikaanse distributie.'
    - 'Marketingondersteuning: Productcatalogi, fotografie, technische documentatie en digitale middelen ter ondersteuning van uw verkoopinspanningen.'
    - 'Training & Ondersteuning: Producttraining voor uw verkoopteam, technische ondersteuning voor uw klanten en coördinatie van garantiesservice.'
content_process:
  tagline: Hoe een partner te worden
  title: Eenvoudig Partnerschapsproces
  subtitle: Ons partnerschapsproces is eenvoudig — ontworpen om u snel afarer-producten te laten verkopen.
  items:
    - title: 'Stap 1: Dien Uw Aanvraag In'
      description: Vul ons partneraanvraagformulier in met uw bedrijfsprofiel, doelmarkt en productinteresses.
    - title: 'Stap 2: Kwalificatiebeoordeling'
      description: Ons partnerteam beoordeelt uw aanvraag en neemt binnen 3 werkdagen contact met u op om mogelijkheden te bespreken.
    - title: 'Stap 3: Overeenkomst & Setup'
      description: Onderteken een partnerschapsovereenkomst, stel uw account in en ontvang partnerprijzen, marketingmateriaal en productmonsters.
    - title: 'Stap 4: Training & Lancering'
      description: Producttraining, verkoopondersteuning en marketingmateriaal worden verstrekt. U bent klaar om te beginnen met verkopen.
cta:
  title: Klaar om een afarer-partner te worden?
  subtitle: Dien een aanvraag in voor partnerschap en ons team reageert binnen 3 werkdagen.
  actions:
    - variant: primary
      text: Aanmelden voor partnerschap
      href: /contact
    - text: Bekijk onze producten
      href: /products

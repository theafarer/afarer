  subtitle: |
    <span class="hidden sm:inline"><span class="font-semibold">afarer</span> ontwerpt en produceert hoogwaardige opblaasbare boten, SUP's en technische producten.</span>
    <span class="block mb-1 sm:hidden font-bold text-blue-600">afarer: gemaakt voor prestaties.</span>

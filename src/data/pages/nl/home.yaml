meta:
  title: 'Performance-opblaasbare SUP-boards — Afarer Water Sports | {SITE}'
  description: 'afarer ontwerpt performance-opblaasbare SUPs voor open water, toertochten, yoga en avontuur. Drop-stitch-stijfheid, board voor board pressure-getest, met exclusieve landenpartnerschappen en beperkte co-branded collecties. Ontdek de collectie.'
  keywords:
    - 'performance opblaasbare sup'
    - 'premium opblaasbaar paddleboard'
    - 'opblaasbaar sup board merk'
    - 'touring opblaasbare sup'
    - 'co-branded paddleboard'
    - 'sup distributeur per land'
hero:
  tagline: 'Performance-opblaasbare SUP-boards'
  title: 'Ga verder.<br />Vaar sterker.'
  subtitle: |
    Performance-opblaasbare SUPs ontworpen voor open water, lange dagen,<br />
    en de vrijheid om te verkennen — stabiel wanneer het telt,<br />
    stijf onder druk en klaar voor veranderend water.
  taglineSection: Opblaasbare SUP-oplossingen van commerciële kwaliteit voor resorts, clubs, retailers en watermerken.
  actions:
    - variant: primary
      text: Bekijk producten
      href: /products
      icon: tabler:shopping-bag
    - text: Meer informatie
      href: '#features'
      icon: tabler:file-text
    - text: Ontdek SUP-oplossingen
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: afarer omslag
who_we_serve:
  tagline: Wie wij bedienen
  title: Complete SUP-oplossingen voor elk waterbedrijf
  subtitle: Speciaal ontworpen apparatuur, productie en bedrijfs ondersteuning voor vier belangrijke markten.
  items:
    - title: Peddelclubs
      keywords: SUP-clubuitrusting, peddelschooluitrusting, verhuurvloot
      description: Duurzame SUP-vloten, clubprijzen en programma's voor vervangingsonderdelen voor peddelclubs en scholen.
      icon: tabler:users
      cta: Ontdek Paddle Club Oplossingen
      link: /solutions/paddle-clubs
    - title: Resorts & hotels
      keywords: resort wateractiviteiten, hotel stranduitrusting, gastenervaring
      description: Volledige SUP-vlootprogramma's met aangepaste branding, personeelstraining en ROI-geoptimaliseerde pakketten.
      icon: tabler:building
      cta: Creëer uw resort waterervaring
      link: /solutions/resorts-hotels
    - title: Detailhandelpartners
      keywords: SUP-groothandel, buitensportwinkels, sportartikelenwinkels
      description: Volledige productlijn, marketingmaterialen, dropshippingopties en concurrerende groothandelsmarges.
      icon: tabler:shopping-cart
      cta: Word een detailhandelspartner
      link: /solutions/retail-partners
    - title: Landendistributeurs & Co-Brandpartners
      keywords: SUP-distributeur per land, co-branded SUP, private label SUP
      description: Exclusieve distributie per land en beperkte co-branded collecties voor gekwalificeerde watersportbedrijven.
      icon: tabler:package
      cta: Word een partner
      link: /distributor-program
proof_points:
  title: Vertrouwd door waterbedrijven wereldwijd
  subtitle: Decennia aan ervaring in maritieme techniek die winstgevende SUP-programma's aandrijft.
  items:
    - metric: '10+'
      label: Jaren Ervaring
      detail: Sinds 2012
    - metric: '50+'
      label: Bedrijven Geserveerd
      detail: Mondiaal distributienetwerk
    - metric: '15.000'
      label: Jaarlijks Geproduceerde Eenheden
      detail: CE-gecertificeerde productiecapaciteit
    - metric: 100%
      label: CE-gecertificeerd
      detail: ISO 9001, BSCI, REACH-conform
business_solutions:
  tagline: Hoe Wij Helpen
  title: Uw partner van concept tot omzet
  subtitle: Vier kerncapaciteiten die waterbedrijven helpen op te starten, te opereren en te groeien.
  items:
    - title: Professionele uitrusting
      description: SUP-boards van commerciële kwaliteit, ontworpen voor dagelijks verhuurgebruik, 500 cycli met minimaal onderhoud.
      icon: tabler:shield-check
    - title: Co-branded collecties
      description: Beperkte co-branded collecties, samen met afarer ontworpen, ontwikkeld en gebouwd — elk board blijft een afarer-product.
      icon: tabler:package
    - title: Bedrijfsondersteuning
      description: Personeelstraining, marketingmateriaal, vervangingsonderdelenprogramma's en toegewijd accountbeheer.
      icon: tabler:headset
    - title: Wereldwijde Logistiek
      description: FOB Qingdao, CIF belangrijke havens, deur-tot-deur levering naar meer dan 50 landen met douaneondersteuning.
      icon: tabler:truck-delivery
oem_section:
  tagline: Co-brand collecties
  title: Van idee tot op het water — co-branded edities
  subtitle: 'Voor partners die meer willen dan een catalogusproduct: beperkte co-branded collecties, ontworpen, ontwikkeld en gebouwd met afarer — terwijl elk board een afarer-product blijft.'
  steps:
    - number: '01'
      title: Idee & Opdracht
      desc: Deel uw visie, doelgroep en specificaties.
    - number: '02'
      title: Ontwerp & Techniek
      desc: 3D-modellering, materiaalkeuze en op maat gemaakte grafische vormgeving.
    - number: '03'
      title: Prototype & Valideren
      desc: Voorbeeldproductie met CE-certificering en kwaliteitscontrole.
    - number: '04'
      title: Massaproductie
      desc: Volledige productie met inline kwaliteitscontrole en ondersteuning bij fabrieksaudits.
    - number: '05'
      title: Wereldwijde levering
      desc: FOB Qingdao logistiek, CIF grote havens, deur-tot-deur.
  cta: Ontdek co-branding
  cta_link: /co-brand
cta:
  title: |
    Klaar om je volgende <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">boot te configureren</span>?
  subtitle: Vertel ons hoe je de boot gaat gebruiken en we doen binnen één werkdag een voorstel voor model, opties en prijs.
  actions:
    - variant: primary
      text: Vraag een prijsopgave
      href: /contact
      icon: tabler:message-circle
    - text: Bekijk catalogus
      href: /products
distributor:
  tagline: 'Lands-exclusieve distributeurs'
  title: 'Eén land. Eén officiële afarer-distributeur.'
  subtitle: 'Een programma met één distributeur per land, met gebiedsexclusiviteit, dealerprijzen, marketingsupport en een toegewijd Distributor Success Program.'
  benefits:
    - title: 'Gebiedsexclusiviteit'
      description: 'Eén geautoriseerde distributeur per land of regio — geen interne concurrentie, geen kanaalconflicten.'
    - title: 'Directe Fabrieksmarges'
      description: 'Distributeursprijslijsten en jaarlijkse kortingen op gecommitteerde volumes, verzonden FOB Qingdao.'
    - title: 'Marketing- & Training Support'
      description: 'Co-branded materialen, POS-materialen voor dealers, producttraining en lanceercampagnes.'
    - title: 'Toegewijd Accountteam'
      description: 'Een persoonlijke distributiemanager plus onboarding-, prognose- en nabestellingsondersteuning.'
  actions:
    - variant: primary
      text: 'Word distributeur'
      href: /distributor-program
    - text: 'Dealerprijslijst aanvragen'
      href: /contact?subject=Dealer Price List
    - text: 'Landenpartnerschap aanvragen'
      href: /contact?subject=Country Partnership Application
    - text: 'Distributieprogramma downloaden'
      href: /distributor-program
  note: 'Voorbeeldbestellingen vanaf 5–10 stuks. Proefbestellingen 10–30. Geautoriseerde dealer 30–50. Landen-/regionale distributeur 100–300+.'

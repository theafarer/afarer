workshops:
  - title: SUP Board Productie
    description: '4 parallelle assemblagelijnen voor opblaasbare SUP-boards. Elke lijn kan 50–80 boards per shift produceren. Digitale print- en zeefdrukstations draaien gelijktijdig. Jaarlijkse SUP-capaciteit: 8.000 boards.'
    output: 8.000 SUP's/jaar
  - title: SUP Boat Production
    description: "Speciale glasvezelrompwerkplaats met 6 malstations voor SUP-rompen tot 7,6 m. Las- en montagegebied voor buizen verwerkt 3–6 SUP's gelijktijdig. Jaarlijkse SUP-capaciteit: 2.000+ boten."
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'Multifunctionele productielijnen voor opblaasbare boten, kajaks en bijboten. Heteluchtlasstations, RF-dielektrische persen en assemblagewerkstations worden geherconfigureerd op basis van de ordermix. Jaarlijkse capaciteit: 5.000+ eenheden.'
    output: 5.000 eenheden/jaar
  - title: Veiligheidsuitrusting
    description: 'Aparte cleanroom-productiezone voor reddingsvesten en veiligheidsuitrusting. Speciale naai-, schuiminsertie- en teststations. Jaarlijkse capaciteit reddingsvesten: 50.000+ stuks.'
    output: 50.000 reddingsvesten per jaar
oem_capacity:
  moq: 'SUP: 5–10 units | SUP: 2–5 units | SUP/SUP: 10–50 units | Custom mould: 200+ units'
  lead_time: Standaard 30–45 dagen. Monster 15–10 dagen. Versneld beschikbaar.
  payment: T/T 30% aanbetaling, 70% voor verzending. L/C, Western Union geaccepteerd.

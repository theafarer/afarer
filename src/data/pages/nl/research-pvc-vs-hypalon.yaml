  description: 'Kop-staart vergelijking van PVC (polyvinylchloride) en Hypalon (chlorosulfon-gedegenereerd polyethyleen) voor de constructie van opblaasbare boten: UV-bestendigheid, duurzaamheid, repareerbaarheid, gewicht, kosten en toepassingsspecifieke aanbevelingen.'

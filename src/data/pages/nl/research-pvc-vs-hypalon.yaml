hero:
  tagline: Materialen
  title: PVC vs Hypalon — Technische Vergelijking voor Opblaasbare Boten
  subtitle: 10 minuten lezen
content_html: |-
  <h2>Materiaaloverzicht</h2>

  <h3>PVC (polyvinylchloride)</h3>
  <p>PVC is een thermoplastisch polymeer dat veel wordt gebruikt bij de fabricage van opblaasbare boten. Voor maritieme toepassingen wordt het doorgaans versterkt met een polyester scrim (1,100 – 1,680 DTEX) en aan beide zijden gecoat. Moderne maritieme PVC-formuleringen bevatten UV-stabilisatoren en weekmakers om de flexibiliteit en weersbestendigheid te verbeteren.</p>

  <h3>Hypalon (CSM – chloorsulfonisch polyethyleen)</h3>
  <p>Hypalon is een synthetische rubberverbinding (nu generiek geproduceerd als CSM nadat DuPont het Hypalon-handelsmerk stopzette). Het staat bekend om de uitzonderlijke weerstand tegen UV en ozon, waardoor het het voorkeursmateriaal is voor professionele en militaire opblaasbare boten die langdurig in direct zonlicht liggen.</p>

  <h2>Vergelijking naast elkaar</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Eigenschap</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">PVC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Hypalon (CSM)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">UV-bestendigheid</td><td class="p-3 border">Goed (met stabilisatoren)</td><td class="p-3 border">Uitstekend (inherent)</td></tr>
      <tr><td class="p-3 border font-medium">Slijtvastheid</td><td class="p-3 border">Goed</td><td class="p-3 border">Zeer goed</td></tr>
      <tr><td class="p-3 border font-medium">Treksterkte</td><td class="p-3 border">3,000 – 5,000 N/5cm</td><td class="p-3 border">2,500 – 4,000 N/5cm</td></tr>
      <tr><td class="p-3 border font-medium">Gewicht (per m&sup2;)</td><td class="p-3 border">850 – 1,200 g</td><td class="p-3 border">1,100 – 1,500 g</td></tr>
      <tr><td class="p-3 border font-medium">Koudeflex (lage temperatuur)</td><td class="p-3 border">-30&deg;C</td><td class="p-3 border">-20&deg;C</td></tr>
      <tr><td class="p-3 border font-medium">Repareerbaarheid</td><td class="p-3 border">Makkelijk (hittelast of lijm)</td><td class="p-3 border">Vereist speciale CSM-lijm</td></tr>
      <tr><td class="p-3 border font-medium">Verbindingsmethode</td><td class="p-3 border">RF-lassen, hete-lucht lassen</td><td class="p-3 border">Handverlijming (contactlijm)</td></tr>
      <tr><td class="p-3 border font-medium">Kosten (materiaal)</td><td class="p-3 border">$8 – $15 / m&sup2;</td><td class="p-3 border">$20 – $40 / m&sup2;</td></tr>
      <tr><td class="p-3 border font-medium">Levensduur (tropische zon)</td><td class="p-3 border">5 – 8 jaar</td><td class="p-3 border">10 – 15 jaar</td></tr>
    </tbody>
  </table>

  <h2>Welke moet u kiezen?</h2>

  <h3>Kies PVC wanneer:</h3>
  <ul>
    <li>Budget een primaire zorg is</li>
    <li>De boot buiten direct zonlicht wordt opgeslagen</li>
    <li>Gewicht ertoe doet (PVC is 15 – 25% lichter)</li>
    <li>U flexibiliteit bij koud weer onder -20&deg;C nodig hebt</li>
    <li>U een breder kleurengamma wilt</li>
  </ul>

  <h3>Kies Hypalon wanneer:</h3>
  <ul>
    <li>De boot in direct zonlicht ligt of wordt opgeslagen</li>
    <li>U zich in een tropische omgeving met hoge UV-blootstelling bevindt</li>
    <li>Maximale duurzaamheid en levensduur prioriteit hebben</li>
    <li>U professionele of commerciële vloten uitrust</li>
    <li>Slijtage door zand, beton of steigers een zorg is</li>
  </ul>

  <h2>Verschillen in productie</h2>
  <p>PVC-boten worden vervaardigd met RF (radiofrequentie) lassen of hete-lucht lassen, wat een moleculaire verbinding creëert tussen de gecoate stoflagen. Dit maakt geautomatiseerde, consistente productie met hoge doorvoer mogelijk. Hypalon-boten worden geassembleerd door handverlijming met contactlijm. Elke naad wordt handmatig gerold en aangedrukt, waardoor de productie van Hypalon arbeidsintensiever is.</p>

  <h2>Aanbeveling van afarer</h2>
  <p>Voor de meeste recreatieve gebruikers biedt modern hoogwaardig PVC met UV-stabilisatoren de beste balans tussen kosten, gewicht, prestaties en duurzaamheid. afarer gebruikt 1,680 DTEX maritiem PVC met een drielaagse coating voor zijn consumenten- en OEM-productlijnen. Voor commerciële en overheidsklanten die langdurige UV-blootstelling vereisen, bieden wij op aanvraag Hypalon-productie aan.</p>

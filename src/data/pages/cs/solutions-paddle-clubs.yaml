meta:
  title: SUP vybavení a řešení pro flotily paddle klubů | {SITE}
  description: Kompletní programy SUP flotil pro paddle kluby a školy. Startovací balíčky, profesionální flotily, závodní desky, sady pro tréninková centra a podpora náhradních dílů.
hero:
  tagline: Paddle kluby a školy
  title: Rozjeďte, provozujte a rozvíjejte svůj paddle klub<br />se SUP flotilami komerční kvality
  subtitle: Dodavatel SUP vybavení pro paddle kluby a SUP školy po celém světě – odolné komerční desky, klubové velkoobchodní ceny, přizpůsobená brandová identita a rychlé náhradní díly, abyste se mohli soustředit na růst své komunity.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Členové paddle klubu na SUP prknech afarer
benefits:
  title: Výhody klubové flotily
  subtitle: Proč si paddle kluby ve více než 50 zemích vybírají Afarer jako svého partnera pro vybavení.
  items:
    - metric: 40%+
      label: Úspory nákladů na flotilu
      detail: Oproti maloobchodním cenám se slevami pro klubové hromadné nákupy
    - metric: 48h
      label: Náhradní díly
      detail: Minimální prostoje pro vaši flotilu v pronájmu
    - metric: 500+
      label: Provozní cykly pronájmu
      detail: Odolnost komerční třídy u každého prkna
    - metric: 5+ let
      label: Životnost flotily
      detail: Při správné údržbě a péči
packages:
  title: Programy pro klubové flotily
  subtitle: Vyberte si flotilový program podle velikosti a ambicí vašeho klubu.
  items:
    - name: Startovací balíček
      tagline: Pro nové kluby, až 30 členů
      features:
        - 10 SUP desek (mix all-round + touring)
        - 10 pádel + 10 záchranných vest
        - 2 pumpy s dvojím účinkem + opravná sada
        - Branding klubu na deskách (tisk loga)
        - Průvodce spuštěním + bezpečnostní kontrolní seznam
        - Certifikováno CE – veškeré vybavení
      cta_text: Založte svůj klub
    - name: Profesionální flotila
      tagline: Pro zavedené kluby, 50-100 členů
      features:
        - 30 SUP desek (3 volby velikosti)
        - 30 pádel + 30 záchranných vest
        - 5 pump + 2 opravné sady + stojan na desky
        - Vlastní barvy klubu + logo na deskách
        - Program náhradních dílů (15% sleva)
        - Školení personálu (online)
        - Certifikováno CE – veškeré vybavení
      popular: true
      cta_text: Vybudujte si svou flotilu
    - name: Závodní flotila
      tagline: Pro závodní kluby, akce, závody
      features:
        - 50+ závodních / výkonnostních prken
        - Kompletní sada příslušenství (pádla, vesty, pumpy)
        - Sada podpory pro akce (startovní bóje, značení)
        - Přednostní náhradní díly (expedice do 24 hodin)
        - Dedikovaný account manager
        - Možnost vlastních týmových uniforem
        - Certifikováno CE – veškeré vybavení
      cta_text: Získejte závodní flotilu
training:
  title: Balíčky pro školicí střediska
  subtitle: Vše, co škola SUP potřebuje pro vedení profesionálních certifikačních kurzů.
  items:
    - name: Startovací sada pro instruktory
      features:
        - 5 prémiových SUP prken (instruktorská třída)
        - 5 karbonových pádel pro ukázky
        - 5 záchranných vest (střih pro instruktory)
        - Průvodce školicím programem
        - Vybavení s certifikací CE
    - name: Kompletní sada pro školy
      features:
        - 20 SUP prken (mix studentů a instruktorů)
        - 20 padel + 20 záchranných vest (různé velikosti)
        - 10 plovacích pomůcek pro začátečníky
        - 4 pumpy + opravné sady
        - Výukové osnovy a podpora certifikace
        - Vybavení s certifikací CE
features:
  title: Proč si kluby vybírají Afarer
  subtitle: Stálá kvalita, rychlé dodávání dílů a velkoobchodní ceny šité na míru rostoucím klubům.
  items:
    - title: 500+ cyklů pronájmu
      description: Prkna komerční kvality vydrží celé sezóny každodenního používání.
      icon: tabler:shield-check
    - title: Vlastní barvy
      description: Přizpůsobte prkna identitě vašeho klubu vlastními barvami a logem.
      icon: tabler:palette
    - title: Množstevní ceny
      description: Množstevní slevy pro flotilové objednávky 10 a více prken.
      icon: tabler:discount
    - title: Rychlé náhradní díly
      description: Náhradní díly odesíláme do 48 hodin.
      icon: tabler:truck-delivery
    - title: Podpora růstu klubu
      description: Poradenství v oblasti členských programů, cenotvorby a pořádání akcí.
      icon: tabler:trending-up
    - title: Certifikace CE
      description: Veškeré vybavení splňuje mezinárodní bezpečnostní normy.
      icon: tabler:certificate
cta:
  title: Připraveni vybudovat svůj paddle klub?
  subtitle: Získejte cenovou nabídku na flotilu pro váš klub nebo si stáhněte našeho úvodního průvodce pro kluby.
  actions:
    - text: Přihlaste se do programu Club Fleet
      href: /contact?package=club
      variant: primary
    - text: Stáhnout průvodce pro kluby
      href: /resources/download-catalog
      variant: secondary

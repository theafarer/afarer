meta:
  title: Průvodce pro OEM kupující – nákup nafukovacích plavidel z Asie | {SITE}
  description: 'Komplexní průvodce nákupem nafukovacích člunů, SUP, kajaků a RIB od asijských výrobců: kontrolní seznam pro hodnocení továrny, protokoly kontroly kvality, ověření shody s předpisy, vyjednávání MOQ, dodací podmínky a běžné nástrahy.'
back_text: Zpět na výzkum
hero:
  tagline: Zajištění dodávek
  title: Průvodce OEM kupujícího — nákup nafukovacích plavidel z Asie
  subtitle: 12 min čtení
content_html: >
  <h2>1. Předběžná kvalifikace: Na co se při výběru továrny zaměřit</h2>


  <h3>Certifikáty shody</h3>

  <ul>
    <li><strong>ISO 9001:2015</strong> – Systém řízení kvality</li>
    <li><strong>Certifikace CE</strong> – Ověřte číslo notifikované osoby</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Audity sociální shody</li>
    <li><strong>REACH / RoHS</strong> – Prohlášení o shodě materiálů</li>
  </ul>


  <h3>Výrobní možnosti</h3>

  <ul>
    <li>Tkaní drop-stitch jádra ve vlastní režii vs. outsourcing</li>
    <li>Linka na potahování / laminaci PVC</li>
    <li>Zařízení pro RF svařování a svařování horkým vzduchem</li>
    <li>Vlastní výroba forem (CNC obrábění)</li>
    <li>Testovací laboratoř (tlakové zkoušky, stárnutí UV zářením, zkoušky v tahu)</li>
  </ul>


  <h3>Ověření zkušeností</h3>

  <ul>
    <li>Počet let ve výrobě nafukovacích plavidel (minimálně 5 let)</li>
    <li>Počet inženýrů v týmu</li>
    <li>Stávající zákazníci OEM/ODM (vyžádejte si reference)</li>
    <li>Exportní destinace – dodávají už do vašeho cílového trhu?</li>
  </ul>


  <h2>2. Protokoly kontroly kvality</h2>

  <p>Kontrola kvality vstupních materiálů: pevnost v tahu (ASTM D751 nebo ISO 1421), odolnost proti protržení (ASTM D2261 nebo ISO 4674), pevnost spoje, namátkové kontroly stárnutí UV zářením.</p>

  <p>Kontrola kvality v průběhu výroby: sledování pevnosti švů každých 50 kusů, ověření utahovacího momentu ventilů, kontroly hustoty drop-stitch vláken, rozměrové kontroly proti CAD výkresům.</p>

  <p>Finální kontrola: 100% tlaková zkouška držení nafouknutí (24 hodin, max. pokles 5 %), vizuální kontrola, funkční zkouška ventilů, testování náhodně vybraných vzorků (AQL 2.5 nebo 4.0 dle ISO 2859).</p>


  <h2>3. Kontrolní seznam dokumentace ke shodě</h2>

  <ul>
    <li>Prohlášení o shodě (DoC) s odkazem na správnou směrnici EU</li>
    <li>Certifikát CE od notifikované osoby</li>
    <li>Protokol o zkoušce z akreditované laboratoře</li>
    <li>Bezpečnostní listy materiálů (MSDS)</li>
    <li>Prohlášení o shodě s REACH</li>
    <li>Kusovník (BOM) s vysledovatelností dodavatelů</li>
    <li>Protokol z inspekce továrny</li>
  </ul>


  <h2>4. Vyjednávání o MOQ</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Typ produktu</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standardní MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Vyjednatelný rozsah</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP prkna</td><td class="p-3 border">50 – 100 kusů</td><td class="p-3 border">5 – 10 kusů (zkušební)</td></tr>
      <tr><td class="p-3 border">Kajaky</td><td class="p-3 border">50 – 100 kusů</td><td class="p-3 border">5 – 10 kusů (zkušební)</td></tr>
      <tr><td class="p-3 border">Nafukovací čluny</td><td class="p-3 border">50 – 100 kusů</td><td class="p-3 border">2 – 5 kusů (zkušební)</td></tr>
      <tr><td class="p-3 border">Čluny RIB</td><td class="p-3 border">20 – 50 kusů</td><td class="p-3 border">2 – 5 kusů (zkušební)</td></tr>
      <tr><td class="p-3 border">Bezpečnostní vybavení / příslušenství</td><td class="p-3 border">200 – 500 kusů</td><td class="p-3 border">50 – 100 kusů (zkušební)</td></tr>
    </tbody>
  </table>


  <h2>5. Logistika a doprava</h2>

  <p>Běžné Incoterms: <strong>FOB</strong> (továrna dodá do přístavu odeslání – nejběžnější), <strong>EXW</strong> (kupující si zajišťuje veškerou dopravu od továrny), <strong>CIF</strong> (továrna hradí přepravu a pojištění do cílového přístavu).</p>

  <p>Nafukovací produkty mají nízkou hmotnost a velký objem – náklady na dopravu často určuje objemová hmotnost (DIM). Vyžádejte si vakuové balení, které objem zmenší o 50–60 %. Námořní přeprava z Číny do EU: 25–35 dní; na západní pobřeží USA: 15–20 dní.</p>


  <h2>6. Časté chyby</h2>

  <ul>
    <li><strong>Bez auditu továrny:</strong> Vždy provádějte nebo zadávejte audit třetí stranou (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Jen ústní specifikace:</strong> Podrobný technický specifikační list podepsaný oběma stranami</li>
    <li><strong>Přeskočené schvalování vzorků:</strong> Písemné schválení vzorků před sériovou výrobou</li>
    <li><strong>Bez kontroly kvality během výroby:</strong> Kontrola třetí stranou během výroby (DUPRO) a před expedicí (PSI)</li>
    <li><strong>Ignorování požadavků na shodu:</strong> Ověřte certifikaci CE/UKCA před zahájením výroby</li>
  </ul>


  <h2>7. Proč Afarer</h2>

  <p>Společnost Afarer vyrábí OEM/ODM nafukovací plavidla od roku 2012. S certifikovaným závodem ISO 9001 o rozloze 12 000 m&sup2;, více než 25 inženýry a certifikací CE ve všech produktových řadách splňujeme každé kritérium z tohoto průvodce. Novým partnerům nabízíme zkušební MOQ a kompletní
  balíčky dokumentace ke shodě.</p>

meta:
  title: Centrum výzkumu a vývoje | {SITE}
  description: Výzkum a vývoj – testování PVC tkanin, konstrukce trupů, RF svařování, hydrodynamické testy a kontrola kvality. K dispozici jsou služby R&D na míru.
hero:
  tagline: Centrum výzkumu a vývoje
  title: Centrum výzkumu a vývoje
  subtitle: Zaměřeni na pokrok
intro:
  - >-
    Centrum výzkumu a vývoje (R&D) společnosti afarer je hybnou silou našeho poslání měnit svět vodních sportů. Nabízíme nadšencům vodních sportů po celém světě bezpečnější, pohodlnější a radostnější produkty díky neustálým inovacím v oblasti nafukovacích paddleboardů (SUP) a člunů. Náš oddaný tým
    inženýrů, designérů a vášnivých odborníků na vodní sporty utváří budoucnost odvětví a neustále zvyšuje laťku kvality, výkonu a udržitelnosti.
  - Naše centrum R&D sdružuje pod jednou střechou materiálové vědce, lodní konstruktéry a výrobní inženýry. Od formulace tkanin a simulace trupu až po vývoj svařovacích procesů a zkoušky na moři v plném měřítku – každá fáze vývoje produktu je řízena daty a ověřována testováním.
mission:
  tagline: Naše poslání
  title: Inovujeme budoucnost vodních sportů
  pillars:
    - icon: lightning
      title: Technologický pokrok
      desc: Přinášíme průkopnické materiály, návrhy a výrobní postupy pro špičkový výkon a dlouhou životnost produktů.
    - icon: design
      title: Design zaměřený na uživatele
      desc: Hluboké porozumění potřebám uživatelů a jejich překonávání díky ergonomickému a intuitivnímu designu produktů.
    - icon: globe
      title: Udržitelné postupy
      desc: Minimalizujeme svou ekologickou stopu využíváním ekologických materiálů a postupů.
    - icon: shield
      title: Bezkompromisní bezpečnost
      desc: Zajištění nejvyšších bezpečnostních standardů prostřednictvím důkladných testů a certifikace.
pillars:
  - title: Technologický pokrok
    desc: Průkopnictví v oblasti nových materiálů, designů a výrobních procesů s cílem dosáhnout vynikajícího výkonu a dlouhé životnosti výrobků.
    icon: tech
  - title: Pokročilé materiály
    desc: Zkoumáme špičková PVC, hypalon, kompozity a udržitelné alternativy pro lepší vlastnosti produktů.
    icon: materials
  - title: Udržitelnost
    desc: 'Zásadní závazek: Jsme odhodláni pečovat o životní prostředí prostřednictvím udržitelné výroby a recyklovatelných materiálů.'
    icon: sustainability
capabilities:
  tagline: Naše kompetence
  title: Možnosti výzkumu a vývoje
  subtitle: Čtyři klíčové disciplíny, které nám dávají kontrolu nad celým procesem vývoje produktu — od výzkumu surovin až po finální certifikaci.
  groups:
    - title: Materiálové vědy a technologie tkanin
      items:
        - Analýza a optimalizace receptur PVC a Hypalonu
        - Vývoj UV stabilizace, zpomalovačů hoření a antimikrobiálních přísad
        - Vícevrstvá laminace tkanin a lepicí technologie
        - Zkoušky urychleného stárnutí (UV, teplo, vlhkost, solná mlha)
    - title: Konstrukce trupu a hydrodynamika
      items:
        - Parametrický návrh trupu ve 3D a CFD optimalizace
        - Analýza metodou konečných prvků pro konstrukční a rázové zatížení
        - Zkoušky zmenšených modelů ve vlečném tanku a ověřování výkonu
        - Vývoj trupu na míru pro speciální typy misí
    - title: Technologie svařování a spojování
      items:
        - Vývoj a optimalizace procesu RF dielektrického svařování
        - Metody svařování horkým vzduchem, horkým klínem a ultrazvukem
        - Kvalifikace lepení a těsnicích pásek švů
        - Modelování pevnosti svarů a predikce životnosti
    - title: Testování, certifikace a soulad s předpisy
      items:
        - Řízení kvality a testování shody s CE
        - Nezávislé testování třetí stranou a podpora certifikace
        - Vývoj individuálních testovacích protokolů pro kvalifikaci nákupu
        - Analýza poruch v provozu a vyšetřování hlavních příčin

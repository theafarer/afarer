intro: >-
  Trup je páteří každého RIB nebo nafukovacího člunu. Musí být dostatečně lehký, aby se efektivně klouzal po hladině, dostatečně pevný, aby absorboval rázové zatížení, a rozměrově stabilní v širokém teplotním rozsahu. V Afarer naše studio pro konstrukci trupů kombinuje pokročilé CAD modelování,
  analýzu konečných prvků (FEA) a desítky let praktických zkušeností z námořní architektury, abychom dodávali trupy optimalizované pro zamýšlený účel — nikoli generické tvary převzaté z katalogu.
content_html: >-
  <h2>Kde se síla setkává s hydrodynamikou</h2>

  <p>Pracujeme se třemi hlavními materiály trupů — rotačně lisovaným HDPE, svařovaným hliníkem námořní kvality a ručně kladeným sklolaminátem — a máme technické kapacity každý z nich interně navrhnout, simulovat a ověřit.</p>


  <h2>Návrhové nástroje a standardy</h2>

  <p>Naše digitální inženýrské prostředí zahrnuje:</p>

  <table>
    <thead><tr><th>Schopnost</th><th>Software / nástroj</th><th>Využití</th></tr></thead>
    <tbody>
      <tr><td>3D parametrické modelování</td><td>SolidWorks Professional</td><td>Povrch trupu, systém podélníků, konzola motoru, uspořádání paluby</td></tr>
      <tr><td>Metoda konečných prvků</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Mapování napětí, modální analýza, simulace nárazů a dopadů</td></tr>
      <tr><td>Výpočetní dynamika tekutin</td><td>Ansys Fluent / Star-CCM+</td><td>Předpověď hydrodynamického odporu, optimalizace trimu</td></tr>
      <tr><td>Konstrukce laminátů</td><td>ESAComp / CADEC</td><td>Vrstvení sklolaminátu, výběr jádra, odhad hmotnosti</td></tr>
      <tr><td>Simulace toku materiálu ve formě</td><td>Moldex3D</td><td>Predikce tloušťky stěny při rotačním lisování</td></tr>
    </tbody>
  </table>


  <h2>Náš inženýrský postup</h2>

  <p>Každý návrh trupu, ať jde o standardní model nebo zcela zakázkový projekt, prochází přísným pětistupňovým procesem:</p>

  <ol>
    <li><strong>Koncept a sběr požadavků</strong> — Setkáme se s vámi, abychom definovali nosnost, rychlostní rozsah, schopnost plavby za různých stavů moře, požadavky na vlečení a případné speciální vybavení pro dané nasazení (palubní poklopy, umístění konzol, integrace palivové nádrže).</li>
    <li><strong>3D modelování povrchu a hydrostatický výpočet</strong> — Tvar trupu je vymodelován v SolidWorks a zkontrolován z hlediska hydrostatické stability (GM, rameno stability) pomocí vestavěných analytických nástrojů.</li>
    <li><strong>Konstrukční FEA</strong> — Definují se zatěžovací stavy: statický (posádka + výbava), dynamický (dopady při klouzání při 5g) a slamming (pád z vrcholu vlny rychlostí 3 m/s). Kontrolují se průběhy napětí; bezpečnostní faktor ≥ 2.5 je povinný.</li>
    <li><strong>Optimalizace odporu pomocí CFD</strong> — Trup je simulován při třech zatěžovacích stavech a pěti rychlostech. Smáčený povrch, úhel trimu a zbytkový odpor se iterativně snižují.</li>
    <li><strong>Kontrola návrhu a uvolnění</strong> — Kompletní inženýrskou dokumentaci (3D model, zprávu FEA, zprávu CFD, odhad hmotnosti, skladebný plán vrstev) před předáním do prototypové dílny posoudí náš vrchní námořní architekt.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Rozložení napětí FEA — trup RIB 450 Patrol (hliník 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Bezpečnostní faktor při maximální nosnosti</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Snížení odporu oproti předchozí generaci</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Špičkový tlak při nárazu do vlny (konstrukční limit)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Celková doba výpočtů FEA v roce 2025</span>
      </div>
    </div>
  </div>


  <h2>Přizpůsobení: váš trup, vaše pravidla</h2>

  <p>Žádní dva provozovatelé nemají stejné požadavky. Hlídkový RIB do přístavu potřebuje trup s mělkým V pro stabilitu při nízké rychlosti; rychlý záchytný člun potřebuje hluboké V s lištami proti rozstřiku; potápěčský podpůrný člun potřebuje široký trup a nízké zrcadlo. Nenutíme vaše použití do
  předem daného tvaru trupu — navrhujeme ho na základě vašich specifikací.</p>

  <p>Příklady nedávných zakázkových inženýrských projektů trupů:</p>

  <ul>
    <li>Prodloužený trup 6.8 m z HDPE pro karibského tour operátora, s vyztuženou přídí pro přistávání na pláži (+15 % tloušťky dna).</li>
    <li>Lehký hliníkový RIB 7.2 m pro pobřežní stráž, s integrovanými přepážkami palivové nádrže a výztuhami skříní na výbavu.</li>
    <li>Sklolaminátový potápěčský člun 5.5 m se sníženým zrcadlem a dvojitými boxy na baterie, navržený pro snadný návrat šnorchlistů na palubu.</li>
  </ul>


  <h2>Naši inženýři</h2>

  <p>Studio vede vrchní námořní architekt se 14 lety zkušeností s návrhem vysokorychlostních plavidel, podporovaný dvěma strojními inženýry specializovanými na FEA a CFD. Všichni tři mají magisterské či doktorské tituly z oboru lodního inženýrství nebo námořní architektury z mezinárodně uznávaných
  univerzit. Tým pravidelně publikuje v oborových časopisech a vystupuje na konferencích, jako je International Conference on High-Performance Marine Vehicles.</p>


  <h2>Spolupracujte s námi na vašem dalším trupu</h2>

  <p>Od prvního koncepčního náčrtu až po závěrečnou zprávu o napětí je naše studio pro konstrukci trupů vaším partnerem při vzniku člunu, který není jen postavený, ale inženýrsky navržený. Čas na simulace investujeme dopředu, aby každý svar, každá laminátová vrstva a každá křivka trupu měla svůj
  důvod.</p>

  <p>Ať potřebujete drobnou úpravu stávajícího modelu nebo zcela nový návrh od čistého listu, jsme připraveni probrat vaše požadavky.</p>

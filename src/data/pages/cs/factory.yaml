material_traceability:
  tagline: Vysledovatelnost
  title: Sledování materiálů a kontrola šarží
  description: Každé šarži suroviny je v našem systému ERP přiděleno jedinečné číslo šarže. Od příjmu přes výrobu až po hotový výrobek odkazuje kusovník každého člunu zpět na původní šarži dodavatele. To umožňuje plnou zpětnou vysledovatelnost pro jakékoli šetření ohledně kvality nebo souladu s předpisy.
  system: Vlastní ERP (interní systém Qingdao Vatrad Group) + fyzické štítky šarží na každé pracovní zakázce
  coverage: 100 % výrobních materiálů — PVC, Hypalon, tkanina drop-stitch, lepidla, ventily, kování, balení
  records_retained: 10 let (podle požadavku CE 2013/53/EU)
  suppliers:
    - material: PVC námořní kvality
      source: Čínští a korejští dodavatelé
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japonský dodavatel
      certified: ISO 9001, REACH
    - material: Drop-stitch tkanina
      source: Vlastní tkalcovna + externí partner
      certified: Interní QC + ISO 9001 dodavatelů
    - material: Ventily a kování
      source: Čínští OEM dodavatelé
      certified: ISO 9001, certifikáty materiálů ke každé šarži

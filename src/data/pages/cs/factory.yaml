workshops_section:
  tagline: Workshopy
  title: Výrobní dílny
  workshops:
    - title: Řezání PVC a příprava materiálu
      description: Automatické CNC řezací stroje zpracovávají tkaniny PVC, Hypalon a drop-stitch s přesností pod jeden milimetr. Počítačově optimalizované rozmístění dílů minimalizuje odpad materiálu a zajišťuje, že každý panel splňuje rozměrovou specifikaci ještě před svařováním.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Svařování nafukovacích komor a tepelné svařování
      description: Samostatná svařovací dílna se stroji pro tepelné svařování a RF dielektrickými lisy. Horkovzdušné svářečky spojují a natavují PVC komory, zatímco RF svary vytvářejí vysoce pevné vzduchotěsné švy, které překračují požadavky ISO 6185.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: Spojení drop-stitch jádra
      description: Drop-stitch jádra SUP prken jsou k vnějším PVC laminátům spojena tepelnou laminací. Tisíce vnitřních polyesterových vláken spojují horní a spodní vrstvu a vytvářejí tuhou strukturu při tlaku 12–15 PSI. Okrajové pásy jsou pro pevnost hran spojeny třívrstvým svařováním (fusion).
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Potisk a dekorace SUP
      description: SUP prkna jsou zdobena digitálním tiskem pro vícebarevnou grafiku a sítotiskem pro loga a opakující se vzory. Digitální tiskárny vytvářejí designy paluby v kvalitě fotografií, zatímco sítotisk zajišťuje odolné a výrazné prvky značky.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Finální montáž a osazení
      description: Montážní linka, kde se na každé SUP prkno instalují ventily, kroužky D, madla, krabice pro ploutve a podlážky. Každé prkno prochází 100bodovým montážním kontrolním seznamem, který potvrzuje vedoucí týmu.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Testování a kontrola kvality
      description: Každý hotový člun před expedicí prochází povinnou zkouškou zadržení vzduchu, ověřením pevnosti švů a kompletní kontrolou systémů. Naše laboratoř kvality pracuje nezávisle na výrobě a odpovídá přímo vedení.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

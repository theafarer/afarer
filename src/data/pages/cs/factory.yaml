qc_section:
  tagline: Kontrola kvality
  title: Proces testování a řízení kvality
  subtitle: Každý člun před odesláním prochází povinným testováním. Naše zkušební laboratoř funguje nezávisle na výrobě a hlásí přímo vedení.
  steps:
    - step: '1'
      title: Kontrola vstupních materiálů
      desc: Tkaniny PVC, Hypalon a drop-stitch procházejí zkouškou pevnosti v tahu (ASTM D751), šířením trhliny a ověřením odolnosti proti UV záření, než jakákoliv šarže vstoupí do výroby.
    - step: '2'
      title: 48hodinový test udržení vzduchu
      desc: Každá nafukovací komora je nafouknuta na 125 % jmenovitého tlaku a udržována po dobu 48 hodin. Pokles tlaku pod 5 % automaticky vede k vyřazení kusu a opětovné kontrole švů.
    - step: '3'
      title: Testování zátěže a vyvážení
      desc: Hotové čluny se zatíží na maximální jmenovitou kapacitu a testují se na stabilitu, volný bok a ovladatelnost. Každé plavidlo se před finální kontrolou testuje na vodě.
oem_section:
  tagline: OEM projekty
  title: Případové studie značkových a OEM partnerství
  subtitle: Od konceptu po kontejner — jak pomáháme globálním značkám uvádět a rozvíjet jejich řady nafukovacích SUP.
  cases:
    - challenge: Evropský outdoorový prodejce potřeboval řadu SUP pod vlastní značkou s unikátním designem paluby, ekologickým PVC a balením připraveným pro maloobchod — vše dodané do 60 dnů.
      solution: Vyvinuli jsme vlastní digitální tiskové soubory, zajistili PVC v souladu s REACH a zkrátili vzorkování ze 3 kol na 1 díky umístění designérského týmu přímo v naší továrně v Qingdao.
      result: 55 dní od podepsané objednávky k dodání FOB. 2 400 kusů ve 4 SKU. Opakovaná objednávka podána dříve, než dorazil první kontejner.
    - challenge: Americký startup v oblasti vodních sportů potřeboval vysoce výkonnou drop-stitch SUP desku s vlastním tvarem, společným značením balení a certifikací BSCI pro umístění v maloobchodě.
      solution: Upravili jsme stávající SUP formu s pozměněným obrysem, vyvinuli grafiku co-brandingového balení a poskytli kompletní dokumentaci z auditu BSCI.
      result: Úspěšně jsme se dostali do sortimentu 3 velkých amerických outdoorových řetězců. Více než 5 000 kusů v prvním roce při 98% míře prodejnosti.
    - challenge: Australský distributor požadoval řadu SUP prken s certifikací CE, vlastními barvami a souladem s australskými normami.
      solution: Vyrobili jsme předvýrobní vzorky ve 4 barevných variantách a koordinovali testování shody s předpisy u třetí strany.
      result: Řada SUP prken o 3 modelech byla uvedena na trh AU/NZ. Následně jsme zvítězili ve vládním tendru na 12 hlídkových SUP prken.
faq_section:
  tagline: FAQ
  title: Časté dotazy B2B a OEM
  questions:
    - q: Jaké je minimální objednací množství (MOQ) pro OEM nafukovací SUP prkna?
      a: MOQ začíná na 5–10 kusech u standardních modelů OEM. Vlastní formy a projekty privátních značek vyžadují minimálně 200 kusů podle náročnosti. Pro uvedení nových značek nabízíme zkušební a vzorové zakázky.
    - q: Má afarer certifikaci BSCI?
      a: Ano. Naše továrna udržuje platnou certifikaci sociální shody BSCI (protokol z auditu je k dispozici na vyžádání). Držíme také ISO 9001 pro řízení kvality a všechny produkty nesou certifikaci CE. Dokumentace o souladu s REACH a RoHS je přiložena ke každé zásilce OEM.
    - q: Jaká je typická dodací lhůta objednávky OEM?
      a: Standardní dodací lhůta je 30–45 dnů od potvrzené objednávky a zálohy u hromadné výroby OEM. Vývoj vlastních forem přidává 15–20 dnů na výrobu nástrojů. Urychlená výroba je k dispozici pro naléhavé zakázky a sezónní špičky. Prototypové vzorky se obvykle odesílají do 15–20 dnů.
    - q: Můžete dodat za podmínek FOB Qingdao nebo CIF do našeho přístavu?
      a: Ano. Dodáváme za podmínek FOB Qingdao, CIF do hlavních světových přístavů a DDP pro kvalifikované partnery. Náš logistický tým zajišťuje rezervaci kontejnerů, exportní dokumentaci a celní odbavení. Dodáváme do více než 50 zemí na trzích EU, USA, Austrálie a Asie.
b2b_moq: 'Standardní MOQ: 5–10 jednotek na model (SUP/kajak/drop-stitch). MOQ pro SUP: 2–5 jednotek. Zkušební objednávky vítány pro nová partnerství.'
production_flow:
  tagline: Průběh výroby
  title: Od materiálu k hotovému člunu
  subtitle: Každý člun prochází 6 výrobními fázemi s kontrolními body QC na každém kroku. Žádné zkratky, žádné vynechané kontroly.
  stages:
    - stage: '01'
      title: Příjem materiálu a vstupní kontrola kvality
      description: Všechny příchozí materiály se v našem ERP systému evidují podle čísla šarže. Role PVC tkanin, jádra drop-stitch, ventily, lepidla a kování zůstávají v karanténě, dokud kontrola kvality neschválí jejich uvolnění.
      qc_check: Pevnost v tahu (ASTM D751), odolnost proti protržení (ISO 4674), měřič tloušťky, viskozita lepidla, vizuální kontrola vad
      qc_threshold: Testuje se 100 % šarží. Vyřadit, pokud je pevnost v tahu < 90 % specifikace, pevnost v trhu < specifikační minimum, nebo při jakékoli vizuální vadě
      responsibility: Tým vstupní kontroly kvality (3 inspektoři)
    - stage: '02'
      title: CNC řezání a příprava materiálu
      description: Počítačově optimalizované sesazování panelů na PVC pás minimalizuje odpad. Automatické CNC řezací stroje udržují přesnost polohy 0.1 mm.
      qc_check: Rozměrová kontrola podle souborů CAD DXF, kontrola kvality hran, ověření počtu panelů
      qc_threshold: Měří se každý 20. panel. Tolerance ±0.5 mm. Šarže se zamítne, pokud >2 % překročí toleranci
      responsibility: Vedoucí řezárny
    - stage: '03'
      title: Svařování a spojování drop-stitch
      description: Drop-stitch jádra jsou k vnějším PVC laminátům spojena tepelnou laminací. Komory trubek jsou svařovány metodou RF nebo horkým vzduchem. Okrajové pásy jsou spojeny třívrstvým svařováním (fusion).
      qc_check: Peel test každých 50 kusů (ASTM D751), měření šířky svaru, kontrola záznamů teploty horkovzdušného svařování, vizuální kontrola švů při prosvícení
      qc_threshold: Pevnost ve slupech min. 8 N/cm. Tolerance šířky svaru ±1 mm. Jakékoli viditelné kanálkování = odmítnout
      responsibility: Kontrola kvality svařování (2 inspektoři na směnu)
    - stage: '04'
      title: Montáž a výstroj člunů
      description: 'Čluny postupují do finální montáže, kde se spojí všechny komponenty: trup + nafukovací komory, instalace ventilů, D-kroužky, madla, lůžka ploutví a uložení přepravní tašky. Každý kus prochází montážním kontrolním seznamem o 100 bodech.'
      qc_check: 100bodový kontrolní seznam u každého kusu, test funkce ventilu (10 cyklů otevření/zavření), kontrola utahovacího momentu kování, vizuální kontrola
      qc_threshold: 'Politika nulových vad u prvků kritických pro bezpečnost (ventily, D-kroužky, madla). Drobné kosmetické vady: AQL 2.5 (ISO 2859)'
      responsibility: Vedoucí montážního týmu + kontrola kvality na lince
    - stage: '05'
      title: Tlakové testy a kontrola kvality
      description: Každá komora je nafouknuta na 1.25× jmenovitý tlak (obvykle 20–25 PSI) a udržována po dobu 24–48 hodin. Tlakové senzory nepřetržitě zaznamenávají hodnoty. Komory s poklesem tlaku nad 5 % jsou vyřazeny a odeslány k nové kontrole svarů.
      qc_check: 24hodinový záznam držení tlaku, denně ověřovaná kalibrace senzorů, údaj o tlaku kompenzovaný podle teploty, opakovaný test švů po opravě
      qc_threshold: Maximální pokles tlaku 5 % za 24 h při stabilní teplotě. Komora, která tento limit překročí = 100% opakovaný test celé výrobní šarže
      responsibility: Laboratoř kvality (nezávislá na výrobě, podléhá vedení)
    - stage: '06'
      title: Finální kontrola a balení
      description: Finální vizuální a funkční kontrola. Vady povrchu, konzistence barev, ověření štítků/BIN, neporušenost balení a kompletnost příslušenství. Kusy jsou vakuově baleny, ukládány do krabic a na palety pro nakládku do kontejneru.
      qc_check: Kompletní vizuální kontrola, kontrolní seznam příslušenství podle SKU, pádový test balení (1 m, náhodný vzorek), ověření skenem štítku/čárového kódu
      qc_threshold: AQL 2.5 pro závažné vady, AQL 4.0 pro drobné vady. Nulová tolerance u bezpečnostních vad. 100 % kusů vizuálně zkontrolováno
      responsibility: Tým finální kontroly kvality (4 inspektoři) + vedoucí balicího týmu

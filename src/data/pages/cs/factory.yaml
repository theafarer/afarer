intro:
  - Naše továrna v Qingdao je srdcem výroby afarer. S rozlohou 12 000 m² a více než 200 kvalifikovanými zaměstnanci máme kapacitu a odbornost vyrábět vysoce kvalitní nafukovací čluny a vybavení pro vodní sporty v měřítku.
  - Naše zařízení je vybaveno nejmodernějšími stroji, včetně automatických CNC řezacích strojů, RF dielektrických svářeček, horkovzdušných těsnicích zařízení a digitálních tiskáren.
  - Udržujeme přísnou kontrolu kvality v každé fázi výroby, od vstupní kontroly surovin až po závěrečné testování hotových výrobků.


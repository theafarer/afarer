meta:
  title: Výroba SUP prken privátních značek | {SITE}
  description: Uveďte na trh vlastní značku SUP se společností Afarer. Od nápadu k trhu — kompletní služba OEM/ODM včetně designu, prototypování, výroby a globální logistiky.
hero:
  tagline: Vybudujte si vlastní značku
  title: Spusťte vlastní<br />značku SUP
  subtitle: Vy máte vizi. My máme továrnu, odborné znalosti a dodavatelský řetězec. Společně vybudujeme značku, která vynikne.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: Zakázkové SUP prkno s vlastním potiskem na vodě
process:
  title: Cesta vaší značky
  subtitle: Od nápadu na trh v 5 fázích.
  steps:
    - phase: Fáze 1
      title: Nápad
      period: Týden 1-2
      items:
        - Průzkum trhu a analýza konkurence
        - Definice cílového zákazníka
        - Workshop pozicování značky
        - Strategie produktové řady
    - phase: Fáze 2
      title: Design
      period: Týden 3–6
      items:
        - Tvar prkna a grafický design
        - Barevné sladění a výběr materiálu
        - Specifikace příslušenství
        - Design balení a etiket
    - phase: Fáze 3
      title: Prototyp
      period: Týden 7-10
      items:
        - Výroba vzorků
        - Testování kvality (tlak, vztlak, UV)
        - Úpravy designu
        - Konečné schválení
    - phase: Fáze 4
      title: Výroba
      period: Týden 11-14
      items:
        - Hromadná výroba
        - Kontrola QC (u každého kusu)
        - Námořní přeprava / letecká přeprava
        - Celní doklady
    - phase: Fáze 5
      title: Uvedení na trh
      period: Týden 15-16
      items:
        - Produktové fotografie
        - Produktový feed pro web
        - Marketingové materiály
        - Podpora uvedení na trh
packages:
  title: Balíčky pro startupy
  subtitle: Balíčky navržené pro každou fázi růstu značky.
  items:
    - name: Starter Brand
      tagline: 50-100 kusů · 2 modely prken
      features:
        - Základní potisk loga
        - Standardní balení
        - Podpora e-mailem
    - name: Growing Brand
      tagline: 300–1 000 kusů – 3–5 modelů prken
      features:
        - Vlastní barva + logo
        - Balení na míru
        - Produktové fotografie
        - Dedikovaný manažer
    - name: Established Brand
      tagline: 1,000+ kusů · Kompletní produktová řada
      features:
        - Plná individualizace
        - Prémiové balení
        - Marketingové materiály
        - Prioritní výroba

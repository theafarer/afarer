hero:
  tagline: Laboratoř kontroly kvality
  title: Testovací laboratoř a zajištění kvality
  subtitle: Nezávislá laboratoř kvality s procesy dle ISO 9001 – každý kus testován před odesláním
intro: >-
  Společnost afarer provozuje specializovanou laboratoř kontroly kvality, která funguje nezávisle na výrobě. Každá šarže suroviny i každé hotové prkno prochází před uvolněním dokumentovanými inspekčními protokoly. Náš tým kontroly kvality je přímo podřízen vedení, což zaručuje nestranná rozhodnutí o
  kvalitě.
highlights:
  - value: 100%
    label: Tlakově otestované kusy
    detail: Každá komora, každé prkno
  - value: 24–48 h
    label: Doba trvání testu zadržení vzduchu
    detail: Při 1.25× jmenovitém tlaku
  - value: '&lt;5%'
    label: Maximální povolený pokles tlaku
    detail: Udržení tlaku po dobu 24–48 hodin
  - value: AQL 2.5
    label: Hranice závažné vady
    detail: Vzorkování dle ISO 2859
test_procedures:
  - title: Kontrola vstupních materiálů
    description: Každá příchozí šarže PVC, drop-stitch tkaniny a kování je před převzetím testována. Ověřuje se pevnost v tahu (ASTM D751), odolnost proti protržení (ISO 4674) a odolnost vůči UV záření. Nevyhovující materiály jsou umístěny do karantény a vráceny dodavateli.
    standards:
      - ASTM D751 (tensile)
      - ISO 4674 (pevnost v trhu)
      - ISO 4892 (UV)
  - title: Průběžné kontrolní body QC
    description: Operátoři výroby provádějí samokontrolu v každé fázi. Auditoři QC provádějí náhodný výběr vzorků v průběhu celé směny. Odtrhové zkoušky svarů se provádějí po každých 50 kusech. Rozměrové kontroly probíhají u každého 20. panelu.
    standards:
      - ASTM D751 (peel)
      - Interní kontrolní seznam se 100 body
      - Vzorkování dle ISO 2859
  - title: 24–48hodinový test udržení vzduchu
    description: Každá komora je nafouknuta na 125 % jmenovitého tlaku a ponechána po dobu 24–48 hodin. Tlakové senzory průběžně zaznamenávají údaje s teplotní kompenzací. Jakákoli komora s poklesem tlaku nad 5 % automaticky spustí opětovnou kontrolu celé šarže.
    standards:
      - EN ISO 25649
      - CE 2013/53/EU
  - title: Testování zátěže a vyvážení
    description: Hotová prkna se testují při maximální jmenovité kapacitě z hlediska stability a tuhosti. Každé prkno prochází zkouškou na vodě před schválením finální kontroly.
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: Univerzální zkušební stroj (tah)
    spec: 5 kN, v souladu s ASTM D751
  - name: Pressure Decay Tester
    spec: Vícekanálové, 0–50 psi, záznam dat
  - name: UV Weathering Chamber
    spec: ISO 4892, cykly 1,000 h
  - name: Tloušťkoměr (digitální)
    spec: Rozlišení 0.01 mm
  - name: Peel Tester (weld)
    spec: Motorizovaný, kapacita 50 N
  - name: Temperature Chamber
    spec: '-40 °C to +100 °C'
  - name: Leak Detection Tank
    spec: 6 m × 2 m, osvětlená

  title: Centrum RF svařování
  subtitle: Technologie dielektrického spojování pro svary, které drží i pod tlakem
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-1-1200w.webp
  image_alt: Proces dielektrického spojování RF svařováním afarer
intro: >-
  Nafukovací člun je spolehlivý jen do té míry, do jaké jsou spolehlivé jeho švy. Jediný slabý svar může ohrozit celou komoru — a na moři není selhání komory jen nepříjemnost, ale bezpečnostní riziko. Ve společnosti {SITE.name} jsme investovali do specializovaného centra vysokofrekvenčního (RF)
  svařování, které spojuje průmyslové dielektrické svařovací lisy s přísnou kontrolou procesu a testováním po svaření. Každý náš svar je zdokumentovaný, dohledatelný a certifikovaný tak, aby splňoval nebo překračoval požadavky ISO 6185 — mezinárodního standardu pro nafukovací plavidla.
content_html: >
  <h2>Věda stojící za svarem</h2>

  <p>RF svařování využívá vysokofrekvenční elektromagnetickou energii (obvykle 27.12 MHz) k rozkmitání polárních molekul v tkanině potažené PVC nebo Hypalonem, čímž vzniká teplo přesně na rozhraní materiálu. Na rozdíl od svařování horkým vzduchem nebo horkým klínem vytváří RF svařování skutečnou
  molekulární vazbu — obě vrstvy tkaniny se v zóně svaru spojí v jediný homogenní materiál, takže spoj je stejně pevný jako samotný základní materiál.</p>


  <h2>Svařovací zařízení a řízení procesu</h2>

  <p>Naše svařovací centrum je vybaveno:</p>

  <table>
    <thead><tr><th>Stroj</th><th>Výkon / kapacita</th><th>Použití</th></tr></thead>
    <tbody>
      <tr><td>Dielektrický RF lis 1</td><td>15 kW, deska 2000 × 600 mm</td><td>Hlavní podélné svary, spoje zrcadlo–komora</td></tr>
      <tr><td>Dielektrický RF lis 2</td><td>10 kW, deska 1500 × 500 mm</td><td>Svary přepážek, uchycení kuželů, záplaty ventilů</td></tr>
      <tr><td>RF svářečka s CNC řízením</td><td>8 kW, XY stůl 2500 × 1200 mm</td><td>Křivočaré svary, ražba log/panelů, přesné záplatování</td></tr>
      <tr><td>Automatická svářečka horkým klínem</td><td>Proměnná teplota, max. 1.2 m/min</td><td>Záložní metoda pro materiály Hypalon/CSM</td></tr>
    </tbody>
  </table>

  <p>Každý RF lis je vybaven monitorováním teploty a tlaku v uzavřené smyčce. Svařovací parametry — výkon, doba lisování, doba chlazení, tlak elektrod — se programují podle typu materiálu a zaznamenávají do našeho systému řízení výroby (MES) pro úplnou sledovatelnost.</p>


  <h2>Zkoušky kvality svarů — každý svar, každý člun</h2>

  <p>Integrita svarů se ověřuje povinným protokolem čtyř zkoušek:</p>

  <ol>
    <li><strong>Vizuální kontrola</strong> — 100 % svarů se vizuálně kontroluje na propálení, posunutí, znečištění nebo neúplné spojení. Hraniční míra zmetkovitosti: 0.5 % běžných metrů.</li>
    <li><strong>Odtrhová zkouška</strong> — Z kontrolního vzorku svařeného s každou výrobní dávkou se vyřízne pruh o šířce 25 mm. Minimální odtrhová síla: 120 N/25 mm pro PVC 1100 dtex.</li>
    <li><strong>Zkouška zadržení vzduchu</strong> — Každá hotová komora se natlakuje na 1.5 × provozní tlak a 30 minut se drží. Pokles tlaku nesmí překročit 2 %.</li>
    <li><strong>Zkouška teplotními cykly</strong> — Vzorky procházejí 50 cykly od -20 °C do +60 °C a poté se znovu podrobí odtrhové zkoušce. Přípustná ztráta pevnosti: &lt; 10 %.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Srovnání odtrhové pevnosti — RF vs. horkovzdušné svařování (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">RF svar</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Horký vzduch</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Min.</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">RF svařování trvale dosahuje 90-95 % pevnosti základního materiálu, což je výrazně nad minimum.</p>
  </div>


  <h2>Profesionální odbornost</h2>

  <p>Náš svařovací tým vede zkušený procesní inženýr s 11 lety zkušeností s dielektrickým svařováním potažených textilií. Každý operátor absolvuje 6měsíční interní certifikační program, než smí pracovat na výrobních svarech. Recertifikace je povinná každoročně a zahrnuje praktickou zkoušku svaru
  hodnocenou podle našeho interního standardu Grade-A (odtrhová pevnost ≥ 160 N/25 mm).</p>


  <h2>Individuální svařovací řešení pro speciální požadavky</h2>

  <p>Chápeme, že jedna svařovací specifikace nevyhoví každému použití. Naše RF svařovací centrum běžně vyvíjí vlastní konfigurace svarů pro klienty se speciálními požadavky:</p>

  <ul>
    <li><strong>Vícevrstvé výztužné záplaty</strong> — pro místa s vysokým opotřebením, jako jsou obrušované vlnolamy a příďové kužely, vyvíjíme víceprůchodové RF svary integrující otěruvzdornou vnější vrstvu, aniž by utrpěla pružnost.</li>
    <li><strong>Vodivé nebo RF nepropustné svary</strong> — pro vojenská či monitorovací plavidla vyžadující elektromagnetické stínění svařujeme do svarové skladby vrstvy vodivé síťoviny.</li>
    <li><strong>Svařování barevně odlišených panelů</strong> — dvoubarevné textilní panely (např. oranžový trup + šedá paluba) se svařují se skrytým přesahem, aby byla zachována estetika značky bez viditelné spojovací linie.</li>
  </ul>


  <h2>Náš závazek vůči vám</h2>

  <p>Každý člun, který dodáme, nese naši záruku kvality svarů: pokud jakýkoli svar v běžném provozu selže v rámci záruční doby, dotčenou komoru zdarma opravíme nebo vyměníme a provede se analýza příčin, aby se problém neopakoval. Nejedná se jen o záruku — je to závazek neustálého zlepšování na
  základě reálných provozních dat.</p>

  <p>Když zvolíte {SITE.name}, volíte svary, které jsou navrženy, testovány a zdokumentovány — nejen svařeny. To je rozdíl mezi člunem, který plave, a člunem, který podává výkon.</p>

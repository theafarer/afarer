hero:
  tagline: 'Případové studie'
  title: 'Skutečné projekty, skutečné výsledky<br />—afarer v akci'
  subtitle: 'Podívejte se, jak afarer spolupracuje s distributory, značkami a provozovateli po celém světě při poskytování zakázkových námořních řešení pro každou aplikaci.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Případové studie afarer —zakázkové námořní výrobní projekty'
features3_cases:
  tagline: 'Vybrané případy'
  title: 'Zakázková řešení<br />pro skutečné výzvy'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Flotila evropského potápěčského centra'
      description: 'Dodávka 12 člunů SUP 520 s potápěčskou konfigurací pro řetězec potápěčských center ve Středomoří. Vlastní stojany na nádrže, potápěčské žebříky a branding flotily. Dodáno do 60 dnů.'
      icon: tabler:lifebuoy
    - title: 'OEM program australského distributora'
      description: 'Vývoj řady SUP prken s vlastní značkou pro australského distributora vodních sportů. 8 modelů, vlastní balení a logistika přímého zasílání. Od konceptu po první zásilku do 90 dnů.'
      icon: tabler:currency-dollar
    - title: 'Dodávka záchranných člunů na Blízký východ'
      description: 'Dodávka 20 člunů SUP 450 Patrol organizaci civilní obrany na Blízkém východě. Samovypouštěcí paluby, kompletní navigační vybavení a vysoce viditelné oranžové tubusy. Splnění místních regulačních norem.'
      icon: tabler:alert-triangle
    - title: 'Partnerství s evropskou OEM značkou'
      description: 'Výrobní partnerství typu white-label s evropskou námořní značkou. 5 modelů SUP, vlastní značení, výhradní distribuční práva pro trh EU. Víceletá dohoda.'
      icon: tabler:building
    - title: 'Flotila karibského resortu'
      description: 'Kompletní balíček vybavení pro vodní sporty pro karibský resort: 40 SUP prken, 20 kajaků, 10 nafukovacích člunů a příslušenství. Vlastní branding resortu na veškerém vybavení.'
      icon: tabler:beach
    - title: 'Kontrakt na pobřežní hlídku v USA'
      description: 'Dodávka hlídkových člunů SUP 600 americké agentuře pro pobřežní bezpečnost. Dvoumotorová konfigurace, možnosti pancéřovaného konzole a integrace vojenské elektroniky.'
      icon: tabler:shield

features3_cases:
  tagline: Vybrané případy
  title: Zakázková řešení<br />pro skutečné výzvy
  isBeforeContent: false
  columns: 3
  items:
    - title: Flotila evropského potápěčského centra
      customer: Potápěčská centra BlueMed
      country: Řecko
      industry: Potápění a námořní turistika
      challenge: >-
        Požadováno 12 potápěčsky upravených SUP prken pro řetězec potápěčských center na více řeckých ostrovech. Každé prkno potřebovalo vlastní uchycení výstroje, úložiště pro 8 lahví a stabilní platformu pro vstup potápěčů na otevřené vodě. Flotila musela dorazit do 60 dnů, aby stihla začátek
        turistické sezóny.
      solution: Vyrobili jsme 12 modelů SUP Voyager Dive s integrovanými nosiči výbavy, stabilními plošinami a mimořádně širokou drop-stitch konstrukcí pro stabilitu při nastupování. Každé prkno neslo livery zákaznické flotily. Všech 12 prken prošlo tlakovou zkouškou a bylo odesláno z Qingdao do 55 dní.
      product: SUP Voyager Dive
      results: Všech 12 prken bylo dodáno včas na turistickou sezónu. Flotila je v každodenním provozu více než 18 měsíců bez jediného materiálového selhání. Zákazník si ve druhém roce objednal 6 dalších kusů.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP Voyager Dive je páteří našich každodenních potápěčských operací. Stabilita je vynikající a rozmístění úložných prostor udržuje palubu čistou a bezpečnou pro naše hosty.
      icon: tabler:lifebuoy
    - title: Co-Brand program australského distributora
      customer: Pacific Watersports Pty Ltd
      country: Austrálie
      industry: Program Co-Brand a partnerství
      challenge: >-
        Australský distributor potřeboval řadu SUP prken pod vlastní značkou za konkurenceschopné ceny, aby mohl čelit čínským značkám prodávajícím přímo spotřebitelům. Požadoval 8 unikátních modelů od začátečnické až po pokročilou úroveň, s vlastním designem, vlastním balením a přímým odesíláním
        (drop-shipping) do maloobchodních prodejen.
      solution: >-
        Vyvinuli jsme 8 modelů SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) s exkluzivním australským grafickým balíčkem. Vlastní maloobchodní balení s QR kódy odkazujícími na videa se sestavením. Logistika drop-shippingu nastavená přímo z Qingdao do
        australských maloobchodních prodejen.
      product: Vlastní SUP řada (8 modelů)
      results: Od konceptu k první zásilce za 90 dní. Prodejnost v maloobchodě 85 % v první sezóně. Distributor ve druhém roce rozšířil spolupráci o další modely SUP.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Společnost afarer dodala kompletní řadu SUP prken za 90 dní — od prvotního návrhu až po prodejní regály. Kvalita odpovídá značkám, které prodávají za dvojnásobnou cenu.
      icon: tabler:currency-dollar
    - title: Dodávka záchranných člunů na Blízký východ
      customer: Národní úřad civilní ochrany
      country: Spojené arabské emiráty
      industry: Pátrání a záchrana
      challenge: Organizace civilní obrany potřebovala 20 SUP prken připravených pro hlídkovou službu pro pobřežní pátrání a záchranu, ochranu přístavů a reakci na povodně. Vyžadovala vysoce viditelná prkna, kompletní bezpečnostní vybavení a soulad s místními námořními předpisy.
      solution: >-
        Dodáno 20 modelů SUP Patrol s vysoce viditelnou oranžovou drop-stitch konstrukcí, kompletními bezpečnostními balíčky, reflexními páskami SOLAS a zesílenou konstrukcí. Každé prkno bylo certifikováno CE a testováno podle platných norem. Dokumentace obsahovala certifikáty shody pro místní
        registraci.
      product: SUP Patrol
      results: Flotila nasazená na 5 pobřežních stanicích. Prkna jsou provozována v extrémních vedrech (45°C+) bez jakékoli degradace. Výkon a odolnost překonaly specifikace.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Prkna SUP Patrol předčila naše provozní požadavky. Při extrémních teplotách nevykazují po 24 měsících každodenního používání žádné známky degradace UV zářením.
      icon: tabler:alert-triangle
    - title: Evropské Co-Brand partnerství
      customer: North Sea Marine Equipment BV
      country: Nizozemsko
      industry: Program Co-Brand a partnerství
      challenge: Zavedená evropská námořní značka chtěla expandovat na trh SUP bez investic do výrobních kapacit. Potřebovala partnera pro white-label výrobu schopného vyrobit 5 modelů SUP (9 ft až 12 ft) s privátní značkou, certifikací CE a výhradními distribučními právy pro EU.
      solution: >-
        Uzavřena dohoda o výrobě 5 modelů SUP prken pod privátní značkou. Každý model opatřen logy a barevnou variantou zákazníka. Pro každý model připravena dokumentace certifikace CE. Udělena výhradní práva distribuce v EU s minimálními objednávkovými závazky. Poskytnuta technická dokumentace pro
        místní servisní síť.
      product: Vlastní řada SUP (5 modelů)
      results: Podepsána víceletá smlouva. První výrobní série 50 kusů odeslána do 75 dní. Značka uvedena na významném veletrhu s pozitivním ohlasem dealerů.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Díky spolupráci s afarer jsme vstoupili na trh se SUP, aniž bychom museli budovat vlastní továrnu — dodali nám kompletní řešení na klíč s certifikací CE a dokumentací pro podporu prodejců.
      icon: tabler:building
    - title: Flotila karibského resortu
      customer: Paradise Island Resorts Ltd
      country: Bahamy
      industry: Námořní turistika a pohostinství
      challenge: >-
        Luxusní resort potřeboval kompletní flotilu vybavení pro vodní sporty: 40 SUP prken pro výlety s průvodcem, 20 dalších SUP prken pro objevování laguny, 10 SUP prken pro výlety hostů a příslušenství. Veškeré vybavení muselo nést vlastní branding resortu a být dodáno před hlavní turistickou
        sezónou.
      solution: >-
        Vyrobili jsme kompletní SUP balíček: 40 prken SUP Voyager (model All-Around), 20 prken SUP Explorer, 10 prken SUP Touring, dále vesty PFD, pádl, pumpy a opravné sady. Veškeré vybavení s potiskem loga resortu a v tropickém barevném provedení. Zásilka v kontejneru s kompletním inventurním
        seznamem.
      product: Kompletní SUP balíček (70+ kusů)
      results: Flotila dorazila 6 týdnů před hlavní sezónou. Spokojenost hostů s vodními sporty vzrostla meziročně o 40 %. Vybavení vydrželo 3 sezóny jen s běžnou údržbou.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Díky přístupu kompletního balíčku jsme dostali vše potřebné v jedné zásilce — prkna i příslušenství s vlastní značkou, připravená pro hosty. Naši hosté si kvalitu vybavení pochvalují.
      icon: tabler:beach
    - title: Kontrakt na pobřežní hlídku v USA
      customer: Atlantic Coastal Security Agency
      country: Spojené státy
      industry: Námořní bezpečnost a vymáhání práva
      challenge: Americká agentura pro pobřežní bezpečnost požadovala vysoce odolné hlídkové SUP desky pro operace na otevřené vodě. Potřebovala výkonné desky s vybavením ve vojenské specifikaci a v souladu s předpisy americké pobřežní stráže.
      solution: Inženýrsky navržené SUP Patrol prkno s vyztuženou drop-stitch konstrukcí, vysoce viditelným barevným provedením, úchyty pro šifrované komunikační vybavení a integrovanými úchytnými body pro výbavu. Prkna vyztužená pro náročný provoz. K dispozici je dokumentace o souladu s požadavky USCG.
      product: SUP Patrol
      results: Agentura vykázala v prvních 12 měsících 95% míru připravenosti k nasazení. Byla zadána další objednávka na 8 kusů.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP Patrol poskytuje našim posádkám výkon potřebný pro operace na otevřené vodě. Vyztužená konstrukce zajišťuje klíčovou odolnost bez kompromisů v ovladatelnosti.
      icon: tabler:shield

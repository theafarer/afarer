hero:
  tagline: Laboratoř 06
  title: Laboratoř kvality a kontroly
  subtitle: Nezávislé ověření — každý test prošel před dodáním
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: UV testování v laboratoři kontroly kvality afarer
intro: >-
  Každý člun, který opustí naši dílnu, nese certifikaci potvrzující, že prošel definovanou sadou kontrol kvality a zkoušek materiálů. Naše laboratoř kvality a inspekcí je nezávislou součástí organizace — podléhá přímo řediteli společnosti, nikoli výrobě — čímž zajišťuje, že žádný komerční tlak
  nemůže ohrozit inspekční bránu. Pokud materiálová šarže nebo hotový člun nesplňuje zveřejněné specifikace, má laboratoř pravomoc pozastavit odeslání zásilky, dokud nebude nesoulad vyřešen.
content_html: >-
  <h2>Důvěřuj, ale prověřuj</h2>

  <p>Laboratoř funguje v rámci systému řízení kvality založeného na principech a naše zkušební metody vycházejí z norem ISO, ASTM a EN, kdekoli to připadá v úvahu. O každém provedeném testu vedeme podrobné záznamy, čímž vytváříme kompletní řetězec dohledatelnosti od příjmu surovin až po konečné
  dodání člunu.</p>


  <h2>Zkušební zařízení a možnosti</h2>

  <table>
    <thead><tr><th>Zařízení</th><th>Prováděné zkoušky</th><th>Norma / metoda</th></tr></thead>
    <tbody>
      <tr><td>Univerzální trhací stroj (50 kN)</td><td>Pevnost v tahu (látka), odolnost švů proti odlupování, šíření trhliny</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Programovatelné zařízení pro zkoušku vzduchotěsnosti</td><td>Vytrvalostní test 1000 cyklů nafouknutí/vypuštění, test udržení tlaku po dobu 30 min</td><td>ISO 6185 (interní)</td></tr>
      <tr><td>Přípravek pro odlupovací zkoušku švů (motorizovaný, peel 180°)</td><td>Pevnost svarů a lepených švů proti odlupování při 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Přístroj na měření hydrostatického tlaku</td><td>Odolnost látky proti pronikání vody (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Digitální tloušťkoměr &amp; mikrometr</td><td>Tloušťka látky, tloušťka stěny komory, tloušťka lepicí fólie</td><td>ISO 2286-3</td></tr>
      <tr><td>Klimatická komora</td><td>Teplotní kondicionování (-40 °C až +80 °C) pro zkoušky odolnosti proti praskání za chladu a stárnutí teplem</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Spektrofotometr pro měření barvy</td><td>Měření barevné odchylky Delta-E po vystavení UV záření</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>Kontrolní brány — od materiálu po dodání</h2>

  <p>Každý člun prochází podle definovaného plánu kvality povinnými kontrolními body. Žádný člun nemůže některou z bran přeskočit; každou bránu musí před zahájením další výrobní fáze schválit inspektor kvality.</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Brána 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kontrola vstupních materiálů</p>
            <p class="text-xs text-gray-500 mt-1">Šarže látky, šarže lepidla, kování — vše je před uvolněním do výroby zkontrolováno proti vstupní specifikaci.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Brána 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Průběžná kontrola svarů</p>
            <p class="text-xs text-gray-500 mt-1">Na začátku každé pracovní směny je testován první vzorek svaru (peel test + vizuální kontrola).</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Brána 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Tlaková zkouška komor</p>
            <p class="text-xs text-gray-500 mt-1">Každá komora je natlakována na 1.5 x provozní tlak a ponechána 30 min. Údaje se zaznamenávají podle sériového čísla.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Brána 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kontrola před dodáním</p>
            <p class="text-xs text-gray-500 mt-1">Kontroluje se celý člun: všechny spoje dotaženy správným momentem, systémy funkční, bez kosmetických vad. Kontrolní seznam se 100 body.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Brána 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Finální certifikace</p>
            <p class="text-xs text-gray-500 mt-1">Sestavení protokolů o zkouškách, přezkoumání záznamů kontrol a vydání prohlášení o shodě.</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>Klíčové ukazatele kvality (klouzavý průměr 2025)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Výtěžnost při první kontrole (šarže látky)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Míra zmetkovitosti svarů (na běžný metr)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Komory tlakově zkoušené před montáží</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">Soulad s kategorií konstrukce</span>
    </div>
  </div>


  <h2>Náš tým kvality</h2>

  <p>Laboratoř zajišťuje manažer kvality (10 let zkušeností s řízením kvality v námořním průmyslu, certifikovaný inženýr kvality ASQ), dva inspektoři kvality (každý s certifikací NDT úrovně 2 pro vizuální kontrolu) a materiálový technik odpovědný za veškeré fyzikální zkoušky. Tým každoročně prochází
  ověřováním způsobilosti u nezávislého externího poskytovatele, aby naše výsledky zkoušek zůstaly přesné a reprodukovatelné.</p>


  <h2>Nezávislé zkoušky pro klienty</h2>

  <p>Naše laboratoř Quality &amp; Inspection Lab je k dispozici pro služby nezávislého testování. Pokud potřebujete ověřit specifikaci látky, validovat nový lepicí systém nebo získat nezávislý protokol o zkoušce pro kvalifikaci dodavatele při nákupu, provedeme zkoušky podle příslušné normy a
  vystavíme certifikovaný protokol.</p>

  <p>Příklady nedávných nezávislých zkoušek:</p>

  <ul>
    <li>Porovnání pevnosti spoje pěti konkurenčních lepicích fólií pro evropský vojenský nákupní program.</li>
    <li>Studie urychleného stárnutí (UV + teplotní cykly) nové formulace PVC s oranžovým pigmentem, s pravidelnými průběžnými měřeními v intervalech 500 h.</li>
    <li>Ověření vzduchotěsnosti 50 prototypových přepážkových ventilů pro novou konstrukci komory s vysokým tlakem.</li>
  </ul>


  <h2>Náš závazek vůči vám</h2>

  <p>Když obdržíte člun Afarer, obdržíte zároveň i jeho kvalitní dokumentaci — souhrnný záznam výsledků zkoušek vztahujících se k vašemu konkrétnímu člunu. Certifikát šarže látky, odlupovací zkoušky svarů, protokoly tlakových zkoušek komor a kontrolní seznam před dodáním. Každé číslo je
  dohledatelné. Každý inspektor je identifikovaný. Toto není jen papírování — je to náš slib, že to, co jsme dodali, odpovídá tomu, co jsme specifikovali.</p>

  <p>Pokud budete mít kdykoli připomínku ke kvalitě, můžete laboratoř kontaktovat přímo — kontaktní údaje jsou vytištěny na vašem prohlášení o shodě. Každý dotaz bereme vážně a zavazujeme se k formálnímu prošetření do 48 hodin.</p>

faqs:
  title: 'Partnerství pro Zemi — FAQ'
  subtitle: 'Otázky, které si seriózní zemní partneři kladou, než požádají.'
  items:
    - title: 'Co vlastně znamená jedna země, jeden distributor?'
      description: 'Afarer jmenuje jediného autorizovaného distributora s výhradními právy pro vymezené území. Neprodáváme z našich globálních ani regionálních kanálů do chráněné země. Vaše právo na území platí, dokud je plněn Distribution Agreement.'
    - title: 'Je území exkluzivní navždy?'
      description: 'Ne. Exkluzivita je podmíněná, ne věčná. Je udržována podepsaným Distribution Agreement, dokončením první objednávky, ročními nákupními cíli, místními zásobami, poprodejní schopností a dalšími investicemi do trhu. Pokud tyto podmínky nejsou splněny, území může být znovu projednáno nebo přiděleno jinému partnerovi.'
    - title: 'Jaká je minimální první objednávka?'
      description: 'Zemští a regionální distributoři začínají na 100–300 kusech; autorizovaní dealeri na 30–50 kusech; zkušební objednávky od 10–30 kusů vám umožní nejprve ověřit trh (zkušební a vzorkové objednávky nemají územní ochranu). Programy Custom a private-label se řídí samostatnými MOQ uvedenými v úrovních výše.'
    - title: 'Jakou podporu zahrnuje 10modulový program podpory?'
      description: 'Úrovně a kvalifikace, územní ochrana, MOQ / ceny / roční rabaty, správa zásob a realizace objednávek, marketingové materiály a společné tržní fondy, produktová / prodejní / technická školení, náhradní díly a poprodejní servis, registrace záruky, partnerský portál a produktové datasheety, knihovna marketingových materiálů, harmonogram ročních rabatů a přepravní a balicí listy.'
    - title: 'Jak mě Afarer chrání před kanálovými konflikty?'
      description: 'Každé území má přesně jednoho autorizovaného distributora. Dotazy a přímé objednávky z vašeho regionu jdou přes vás, formuláře na webu jsou přeposílány místnímu partnerovi, pokud existuje, a globální tým eskaluje jen tehdy, když partner neodpovídá.'
    - title: 'Jaké jsou přepravní a platební podmínky?'
      description: 'Objednávky se odesílají FOB Qingdao s úplnou exportní dokumentací. Výrobní objednávky jsou za 30% zálohu a 70% před odesláním; zkušební a vzorkové objednávky jsou hrazeny předem. Standardní dodací lhůta je 30–45 pracovních dnů, u zkušebních sérií 15–20 pracovních dnů.'
    - title: 'Jak požádám?'
      description: 'Pošlete žádost přes kontaktní formulář s údaji o trhu. Posuzujeme tržní vhodnost, maloobchodní zastoupení a logistické schopnosti, pak odpovíme do 3 pracovních dnů s dalšími kroky a vzorovým Distribution Agreement.'

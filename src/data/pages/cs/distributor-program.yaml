faqs:
  title: 'Distribuční program — FAQ'
  subtitle: 'Vše, na co se distributoři ptají, než požádají.'
  items:
    - title: 'Co znamená jedna země, jeden distributor?'
      description: 'Afarer uděluje jedinému autorizovanému distributorovi výhradní práva pro zemi nebo region. Vlastníte svůj trh — žádný paralelní dovoz, žádná vnitřní konkurence.'
    - title: 'Jaká je minimální první objednávka?'
      description: 'Zemští a regionální distributoři začínají na 100–300 kusů. Autorizovaní dealeri od 30–50 kusů. Zkušební objednávky od 10–30 kusů vám umožní nejprve ověřit trh (bez územní ochrany).'
    - title: 'Jakou podporu distributoři získávají?'
      description: 'Distributor Success Program zahrnuje zaškolení, plánování vstupu na trh, produktová a prodejní školení, podporu demo flotily, lokalizované marketingové materiály a dedikovaného account managera.'
    - title: 'Jak mě Afarer chrání před kanálovými konflikty?'
      description: 'Každé území má přesně jednoho autorizovaného distributora. Přímé objednávky z vašeho regionu jdou přes vás a ceny jsou nastaveny tak, aby chránily vaši marži.'
    - title: 'Jaké jsou přepravní a platební podmínky?'
      description: 'Objednávky se odesílají FOB Qingdao s úplnou exportní dokumentací. Výrobní objednávky s 30% zálohou a 70% před dodáním; zkušební a vzorkové objednávky předem.'
    - title: 'Jak požádám?'
      description: 'Pošlete žádost přes kontaktní formulář. Hodnotíme tržní vhodnost, maloobchodní zastoupení a logistické kapacity a odpovíme do 3 pracovních dnů s dalšími kroky a vzorem distribuční smlouvy.'
cta:
  title: 'Připraveni vlastnit svůj trh?'
  subtitle: 'Požádejte o Distribuční program Afarer a odpověď obdržíte do 3 pracovních dnů.'
  actions:

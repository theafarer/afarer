      icon: tabler:news
    - title: Telefon
      description: +86 13305324192
      icon: tabler:headset
    - title: E-mail
      description: info@afarer.com
      icon: tabler:mail
    - title: Sídlo společnosti
      description: Economic Development Zone, Laixi, Qingdao, Čína, 266600
      icon: tabler:map-pin

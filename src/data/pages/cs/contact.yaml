hero_text:
  tagline: Contact
  title: GET IN TOUCH
contact_form:
  id: form
  title: Pošlete nám zprávu
  subtitle: Pro poptávky, technické dotazy nebo partnerské dotazy nám napište. Odpovíme do jednoho pracovního dne.
  email_to: info@afarer.com
  submit_button: Odeslat poptávku →Získat nabídku
  success_message: Děkujeme! Vaše zpráva dorazila do naší schránky. Odpovíme do jednoho pracovního dne.
  error_message: Při odesílání zprávy došlo k chybě. Zkuste to znovu nebo nám napište přímo e-mail.
  default_country_code: '+1'
  captcha:
    label: 'Ochrana proti spamu: vyřešte následující'
  fields:
    - name: firstName
      label: Jméno
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Příjmení
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Název společnosti
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Adresa
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: PSČ
      row: 4
      step: 2
    - name: country
      label: Země
      row: 4
      step: 2
    - name: email
      label: E-mail
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Odhadovaný objem objednávky
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Potřebujete úpravy?
      row: 7
      step: 2
    - name: productInterest
      label: Kategorie produktů
      row: 8
      step: 2
    - name: subject
      label: Předmět
      row: 9
      step: 3
    - name: message
      label: Zpráva
      row: 10
      type: textarea
      rows: 6
      step: 3

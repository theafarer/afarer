label: Záruka
headline: Omezená záruka výrobce afarer
subtitle: afarer stojí za kvalitou každého nafukovacího námořního produktu, který vyrábíme. Tato omezená záruka stanovuje podmínky a rozsah krytí vašeho produktu afarer.
seo:
  headline: Záruka na nafukovací člun afarer —5letá omezená záruka | afarer
  description: afarer nabízí 5letou omezenou záruku na primární tkaninu hadic, švy a strukturální integritu sklolaminátového trupu. Rovněž kryje nafukovací ventily a továrně instalované příslušenství.
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |-
    <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
      Tato omezená záruka se vztahuje na nové nafukovací námořní produkty značky afarer zakoupené přímo od afarer nebo od autorizovaného prodejce afarer či maloobchodního prodejce. Účinným datem je ověřitelné datum původního maloobchodního nákupu.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Rozsah záruky a doba trvání</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
          <p class="text-sm text-gray-600 mt-1">Integrita tkaniny hlavních hadic (CSM/PVC)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
          <p class="text-sm text-gray-600 mt-1">Strukturální integrita sklolaminátového trupu</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
          <p class="text-sm text-gray-600 mt-1">Těsnost švů nafukovacích hadic</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
          <p class="text-sm text-gray-600 mt-1">Funkčnost nafukovacího ventilu</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">1 rok</h3>
          <p class="text-sm text-gray-600 mt-1">Továrně instalované příslušenství a pomocné armatury</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 rok*</h3>
          <p class="text-sm text-gray-600 mt-1">Komerční, pronájem nebo flotilové použití — všechny součásti</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Komerční, vládní, charterové, pronájmu či výukové použití zkracuje záruku na 1 rok. Použití při závodech nebo soutěžích ruší záruku zcela.</p>
    </div>

    <h2>Co je kryto</h2>
    <h3>Primární tkanina hadic (5 let)</h3>
    <p>afarer zaručuje hlavní tkaninu hadic proti zhoršení pórovitosti, které by podstatně ohrozilo schopnost produktu udržet provozní nafouknutí. To se vztahuje na tkaninu potaženou materiálem CSM (Hypalon) a na všechny ostatní materiály hadic použité při výrobě.</p>

    <h3>Strukturální integrita sklolaminátového trupu (5 let)</h3>
    <p>U produktů s trupem z plastu vyztuženého skelnými vlákny (FRP) je základní kompozitní struktura zaručena proti strukturálnímu selhání v důsledku vad materiálu nebo zpracování.</p>

    <h3>Těsnost švů nafukovacích hadic (5 let)</h3>
    <p>Švy nafukovacích hadic, spojené při výrobě, jsou zaručeny proti výrobním vadám, které vedou k podstatnému úniku vzduchu švem. Pravidelná kontrola a udržování odpovídajících nafukovacích tlaků jsou podmínkou krytí.</p>

    <h3>Funkčnost nafukovacího ventilu (5 let)</h3>
    <p>Nafukovací ventily původně instalované společností afarer jsou zaručeny proti výrobním vadám materiálu nebo zpracování, které brání ventilu v zadržování vzduchu podle návrhu.</p>

    <h3>Továrně instalované příslušenství (1 rok)</h3>
    <p>Součásti a armatury vyrobené společností afarer a původně instalované ve výrobním závodě jsou zaručeny proti vadám materiálu a zpracování po dobu jednoho roku. To se nevztahuje na výrobky třetích stran, které kryje pouze příslušná záruka jejich výrobce.</p>

    <h2>Co není kryto</h2>
    <ul>
      <li>Kosmetické vady včetně změny barvy, skvrn, vyblednutí, křídování nebo jakékoli změny vzhledu</li>
      <li>Proražení, řezné rány, roztržení, natržení nebo jiné fyzické poškození</li>
      <li>Praskání, praskliny, oděrky, odřeniny nebo zhoršení způsobené třením či kontaktem</li>
      <li>Degradace v důsledku vystavení UV záření, povětrnostním vlivům nebo atmosférickým podmínkám</li>
      <li>Poškození kontaktem s palivy, rozpouštědly, kyselinami, zásadami nebo chemikáliemi</li>
      <li>Poškození z nedbalosti, nesprávného použití, zneužití, nehody nebo běžného opotřebení</li>
      <li>Problémy s gelcoatem nebo nátěrem (puchýře, praskání, změna barvy, vyblednutí)</li>
      <li>Poškození nárazem, namáháním, nesprávnou podpěrou nebo přepravou na přívěsu</li>
      <li>Poškození nesprávným nafouknutím/vypuštěním nebo použitím neschválených nafukovacích zařízení</li>
      <li>Zařízení, součásti nebo systémy třetích stran (kryty jejich příslušnými výrobci)</li>
    </ul>

    <h2>Povinnost výrobce a náprava</h2>
    <p>Výhradní a výlučnou povinností společnosti afarer je oprava nebo výměna, podle volby afarer, jakékoli součásti určené jako vadná v materiálu nebo zpracování a kryté touto zárukou. Opravy nebo výměny provádí afarer nebo jí určené autorizované servisní středisko. Opravené nebo vyměněné součásti jsou kryty pouze po zbývající dobu původní záruční lhůty.</p>

    <h2>Podmínky záruky</h2>
    <ul>
      <li><strong>Registrace:</strong> Produkt musí být řádně registrován, jak vyžadují záruční podmínky.</li>
      <li><strong>Údržba:</strong> Produkt musí být udržován v souladu se zveřejněnými pokyny společnosti afarer, včetně pravidelné kontroly a udržování odpovídajících nafukovacích tlaků.</li>
      <li><strong>Spolupráce:</strong> Kupující musí plně a neprodleně spolupracovat se společností afarer ve všech záležitostech týkajících se záručních nároků.</li>
      <li><strong>Původní kupující:</strong> Tato záruka se vztahuje výhradně na původního konečného kupujícího a není přenosná.</li>
    </ul>

    <h2>Komerční použití</h2>
    <p>Pokud je produkt používán pro komerční, vládní, neziskové, charterové, pronájemní, výukové účely nebo pro jakýkoli jiný účel než soukromé rekreační použití, záruční doba pro všechny součásti se zkracuje na jeden (1) rok od původního data maloobchodního nákupu. Použití při závodech, rychlostních nebo vytrvalostních soutěžích okamžitě a neodvolatelně zcela ruší záruku.</p>

    <h2>Jak uplatnit záruční nárok</h2>
    <p>Kontaktujte afarer nebo vašeho autorizovaného prodejce s dokladem o koupi a podrobným popisem problému. afarer posoudí nárok a poskytne pokyny k prohlídce a servisu.</p>
    <p>U dotazů týkajících se záručního servisu nás prosím kontaktujte prostřednictvím naší <a href="/contact" class="text-sky-600 underline">kontaktní stránky</a> s číslem objednávky a údaji o produktu.</p>

    <h2>Výrobky třetích stran</h2>
    <p>Zařízení, součásti nebo systémy vyrobené třetími stranami (i když je nainstalovala afarer) kryje výhradně jakákoli záruka nabízená jejich příslušným výrobcem. afarer výslovně odmítá jakoukoli záruční odpovědnost za tyto výrobky třetích stran.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
      Toto prohlášení o záruce je souhrnem úplné Omezené záruky výrobce afarer. Úplný právní záruční dokument upravuje všechny záruční podmínky a podmínky. Specifikace se mohou změnit bez předchozího upozornění. afarer je značkou společnosti Qingdao Vatrad Group.
    </p>
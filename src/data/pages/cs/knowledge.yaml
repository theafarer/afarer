meta:
  title: 'Znalosti — SUP a lodní průvodci | {SITE}'
  description: 'Znalostní báze afarera: průvodci nafukovacími SUP prkny, materiály paddleboardů, výběrem člunů a oborovými poznatky pro značky a profesionály.'
  keywords:
    - 'znalosti o SUP'
    - 'průvodce nafukovacím SUP'
    - 'materiály paddleboardů'
    - 'oborové poznatky SUP'
hero:
  tagline: Znalostní graf
  title: Znalosti o objevování vod
  subtitle: |
    Strukturovaná znalostní báze pokrývající technologii nafukovacích SUP,<br />
    bezpečnost na vodě, inženýrství člunů a plánování dobrodružství.
  taglineSection: Objevujte. Učte se. Jděte s jistotou.
clusters:
  tagline: Znalostní klastry
  title: Objevujte podle tématu
  subtitle: Hluboké ponory do technologie, bezpečnosti a dovedností za každým produktem afarer.
  items:
    - title: Znalosti o SUP
      description: Od výběru prvního prkna po pokročilé techniky touringu — vše o paddleboardingu.
      icon: tabler:lifebuoy
      topics:
        - Jak vybrat své první nafukovací SUP
        - Nejlepší velikost SUP pro začátečníky
        - Jak náročné je paddleboarding?
        - Srovnání nafukovacího a pevného prkna
        - Bezpečnostní checklist pro SUP
    - title: Inženýrství a technologie SUP
      description: Technické průvodce o nafukovacích SUP deskách — materiály, konstrukční metody a výrobní procesy.
      icon: tabler:microscope
      topics:
        - Detailní pohled na drop-stitch technologii
        - Vojenské specifikace PVC
        - Fúzní laminace vs. lepení
        - Technologie EVA pěny a metody grafiky
        - Typy ventilů SUP a systémy ploutví

    - title: Bezpečnostní znalosti
      description: Základní bezpečnostní znalosti pro každého pádlujícího — od výběru PFD po čtení počasí a techniky sebezáchrany.
      icon: tabler:shield
      topics:
        - Bezpečnostní checklist pro SUP
        - Potřebujete záchrannou vestu?
        - Bezpečnostní průvodce pádlováním v oceánu
        - Techniky oprav nafukovacích výrobků
        - Povědomí o počasí a vodních podmínkách
    - title: Technologie
      description: Inženýrství za produkty afarer — materiály, konstrukční metody a testování kvality.
      icon: tabler:microscope
      topics:
        - Námořní PVC technologie
        - Drop-stitch jádro vysvětleno
        - Proč záleží na PSI u nafukovacích SUP
        - RF svařování vs lepení
        - Testování kvality a certifikace
    - title: SUP životní styl a speciální využití
      description: Specializované SUP aktivity — jóga, rybaření, psi, rodiny a tipy na cestování.
      icon: tabler:heart
      topics:
        - SUP jóga a meditace na vodě
        - Rybaření z nafukovacího SUP
        - Paddleboarding se psy a dětmi
        - Cestování se SUP letadlem a autem
        - SUP příslušenství a nezbytné vybavení
    - title: Porovnání SUP prken a reference
      description: Srovnání vedle sebe, která vám pomohou učinit informované rozhodnutí.
      icon: tabler:chart-bar
      topics:
        - SUP nebo kajak — co je pro vás to pravé?
        - Srovnání materiálů PVC a Hypalon
        - Jedna komora vs. více komor — bezpečnost
        - Vysvětlení materiálů SUP prken
        - UV tisk vs. EVA bloky s potiskem

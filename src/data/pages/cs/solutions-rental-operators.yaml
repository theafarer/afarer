meta:
  title: Řešení pro půjčovny SUP | {SITE}
  description: SUP prkna pro intenzivní provoz, konstruovaná pro každodenní půjčování. PVC odolné vůči UV záření, zesílené švy, rychleschnoucí materiály. Rozšiřte svůj pronájem s afarer.
hero:
  tagline: Provozovatelé půjčoven
  title: Rozšiřte své podnikání v oblasti půjčoven<br />s jistotou
  subtitle: SUP prkna s vysokou obrátkovostí určená pro každodenní provoz v půjčovnách, 365 dní v roce. Vaše tržby si nikdy nevezmou volno.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Rušný kiosk půjčovny se SUP prkny připravenými pro hosty
features:
  title: Stavěno pro náročný provoz půjčoven
  subtitle: Každé prkno je navrženo pro více než 500 půjčovacích cyklů s minimální údržbou.
  items:
    - title: 500+ cyklů pronájmu
      description: Testováno tak, aby odolalo každodennímu použití ve slané vodě, na slunci a v písku.
      icon: tabler:shield-check
    - title: Tkanina odolná proti UV záření
      description: Bez vyblednutí nebo degradace po 1 roce skladování venku.
      icon: tabler:sun
    - title: Zesílené švy
      description: 3x pevnější než standardní konstrukce nafukovacího prkna.
      icon: tabler:layers-intersect
    - title: Materiály s rychlým schnutím
      description: Prkna připravená k dalšímu pronájmu za méně než 30 minut.
      icon: tabler:droplet
    - title: Stohovatelné skladování
      description: Prostorově úsporný design — uskladněte o 40 % více prken ve stejné ploše.
      icon: tabler:stack
    - title: Velikosti rozlišené barvami
      description: Personál okamžitě vybere správné prkno díky barevnému velikostnímu kódování.
      icon: tabler:color-swatch
stats:
  title: Provozní ukazatele
  stats:
    - title: Obrat desek
      amount: < 5 min
    - title: Roční údržba
      amount: ~15 min/prkno
    - title: Expedice náhradních dílů
      amount: 48h
    - title: Míra závad
      amount: < 0.5%
fleet_guide:
  title: Průvodce velikostí flotily
  subtitle: Odhadněte velikost flotily a výnosový potenciál pro vaši půjčovnu.
  tiers:
    - label: Malý kiosk
      boards: 15-20
      revenue: $XX,XXX/yr
    - label: Středně velký provoz
      boards: 30-50
      revenue: $XX,XXX/yr
    - label: Velká plážová půjčovna
      boards: 50–100
      revenue: $XXX,XXX/yr
cta:
  title: Připraveni rozšířit svou půjčovnu?
  subtitle: Získejte ceny pro půjčovny nebo porovnejte modely prken pro váš provoz.
  actions:
    - text: Získejte ceník pronájmu
      href: /contact?package=rental
      variant: primary
    - text: Porovnat modely prken
      href: /compare
      variant: secondary

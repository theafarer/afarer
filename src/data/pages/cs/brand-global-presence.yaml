features3_markets:
  tagline: Klíčové trhy
  title: Regionální odbornost<br />pro místní požadavky
  subtitle: Chápeme, že různé trhy mají různé regulační požadavky, preference a případy použití.
  isBeforeContent: false
  columns: 4
  items:
    - title: Evropa a Velká Británie
      description: Produkty s certifikací CE splňující normy EN ISO 6185. Silná poptávka po SUP člunech, nafukovacích člunech a SUP prknech na trzích EU. Britští distributoři oceňují naše rychlé vyřízení.
      icon: tabler:map-pin
    - title: Severní Amerika
      description: Výroba schválená americkou pobřežní stráží. Sklad v USA v Montclair, CA pro rychlé doručení na západní pobřeží. Rostoucí poptávka po rybářských lodích, záchranných člunech a rekreačních SUP.
      icon: tabler:map-pin
    - title: Austrálie a Oceánie
      description: Silný trh pro SUP čluny a nafukovací tendry. Australští distributoři oceňují naše Hypalonové čluny pro UV odolnost v náročných slunečních podmínkách. Rychlé odeslání z našeho asijského zařízení.
      icon: tabler:map-pin
    - title: Střední východ
      description: Rostoucí poptávka po hlídkových a záchranných člunech. Naše SUP čluny s hliníkovým trupem jsou oblíbené u pobřežní stráže a bezpečnostních operátorů. Vlastní konfigurace pro prostředí s vysokými teplotami.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribuční síť
  title: Partnerství s distributory<br />po celém světě
  subtitle: Spolupracujeme s etablovanými distributory námořního vybavení, OEM značkami a vládními nákupními agenturami.
  isBeforeContent: false
  columns: 3
  items:
    - title: Partnerství OEM/ODM
      description: Výroba privátních značek pro globální značky vodních sportů. Zajišťujeme vše od návrhu přes výrobu až po přímou dopravu.
      icon: tabler:building
    - title: Síť distributorů
      description: Autorizovaní distributoři ve 20+ zemích mají skladové zásoby a poskytují místní podporu. Dotazy nových distributorů vítány.
      icon: tabler:users
    - title: Vládní a institucionální
      description: Přímé dodávky pobřežním strážím, pátracím a záchranným organizacím a vojenským nákupním programům. Soulad s požadavky institucionálních nákupů.
      icon: tabler:building-community
steps2_logistics:
  title: Globální logistika a podpora
  subtitle: Z továrny do cíle —řídíme celý dodavatelský řetězec.
  items:
    - title: Možnosti dopravy
      description: Námořní přeprava (FOB Qingdao), letecká přeprava pro naléhavé objednávky a expresní kurýr pro vzorky a náhradní díly.
      icon: tabler:truck-delivery
    - title: Sklad v USA
      description: 'Skladové zásoby v Montclair, CA pro rychlé doručení po celé Severní Americe. Západní pobřeží: 2-3 dny, Střed: 3-4 dny, Východní pobřeží: 4-5 dní.'
      icon: tabler:building-warehouse
    - title: Náhradní díly
      description: Originální náhradní díly afarer a spotřební materiál skladem po celý rok. Běžné díly odesílány do 24 hodin.
      icon: tabler:package
    - title: Technická podpora
      description: Přímá linka k našemu inženýrskému týmu pro technické dotazy, rady ohledně oprav a podporu při renovaci. Podporujeme lodě, které jsme postavili před 20 lety.
      icon: tabler:headset
cta:
  title: Chcete se stát distributorem?
  subtitle: Aktivně rozšiřujeme naši distribuční síť. Kontaktujte náš exportní tým a prodiskutujte možnosti partnerství.
  actions:
    - variant: primary
      text: Poptávka ohledně partnerství
      href: /contact
    - text: Zobrazit naši nabídku produktů
      href: /products

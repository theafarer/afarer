  tagline: Globální přítomnost
  title: Obsluhujeme 50+ zemí<br />na každém kontinentu
  subtitle: Od evropských operátorů pobřežních hlídek po australské distributory vodních sportů a záchranné týmy na Blízkém východě —lodě afarer jsou na vodě po celém světě.

meta:
  title: 'Partneři — distribuce a velkoobchod | {SITE}'
  description: 'Staňte se partnerem afarera: distribuční sítě, velkoobchodní ceny, programy OEM/privátních značek a podpora pro paddleboardové firmy po celém světě.'
  keywords:
    - 'distribuční partner SUP'
    - 'paddleboard velkoobchod'
    - 'distributor nafukovacích SUP'
    - 'partnerství SUP'
hero:
  tagline: Partneři a distribuce
  title: Staňte se partnerem afarer<br />—globální distribuční síť
  subtitle: Připojte se ke globální partnerské síti afarer. Spolupracujeme s námořními distributory, prodejci člunů, prodejnami vybavení a značkovými partnery ve více než 50 zemích.
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: Globální síť partnerů a distributorů afarer
content_programs:
  tagline: Partnerské programy
  title: Partnerské programy<br />postavené pro růst
  subtitle: Ať už jste distributor, prodejce nebo partner značky, afarer nabízí programy navržené na podporu vašeho podnikání.
  columns: 3
  items:
    - title: Distributorský program
      description: Exkluzivní územní distribuce s objemovými cenami, marketingovou podporou a přímým přístupem do továrny. Minimální závazek vyžadovaný na základě velikosti území.
      icon: tabler:world
    - title: Dealerský program
      description: Přímé dealerské ceny, školení o produktu, marketingové materiály a záruční podpora pro maloobchodní prodejny a online obchody.
      icon: tabler:building-store
    - title: Partnerství OEM/ODM
      description: OEM a ODM výroba na klíč s vlastním brandingem, balením a specifikacemi produktu. Od konceptu po kontejner.
      icon: tabler:certificate
    - title: Partnerství se značkou
      description: Co-branding, privátní značka a exkluzivní modelové programy pro zavedené značky v oblasti námořní a venkovní rekreace.
      icon: tabler:stars
    - title: Vládní a institucionální
      description: Programy preferovaných dodavatelů pro vládní agentury, pobřežní stráž, armádu a humanitární organizace. Dokumentace připravená k výběrovým řízením.
      icon: tabler:building-community
    - title: Partner pro resorty a půjčovny
      description: Ceny pro flotily, stálá kvalita a vlastní branding pro rezorty, potápěčská centra a půjčovny po celém světě.
      icon: tabler:sun
content_benefits:
  tagline: Proč spolupracovat s námi
  title: Proč partneři volí afarer
  subtitle: Naši partneři těží ze skutečných výrobních kapacit, stálé kvality a rychlé podpory.
  list:
    - 'Přímý přístup do továrny: Pracujte přímo s naším výrobním týmem – bez prostředníků. Získejte rychlejší odezvu, lepší ceny a plný přehled o výrobě.'
    - 'Připraveno na přizpůsobení: Označte své výrobky vlastními barvami, logy, balením a specifikacemi. Minimální objednací množství přizpůsobená vašemu trhu.'
    - 'Zaručená kvalita: Výroba s certifikací ISO 9001 a soulad s požadavky CE, UKCA a BSCI. Každý produkt je před odesláním testován.'
    - 'Globální logistika: Doprava z čínského Qingdao s možnostmi FOB, CIF a DDP. Sklad v USA v Montclairu (CA) pro distribuci v Severní Americe.'
    - 'Marketingová podpora: produktové katalogy, fotografie, technická dokumentace a digitální materiály na podporu vašich prodejních aktivit.'
    - 'Školení a podpora: produktová školení pro váš prodejní tým, technická podpora pro vaše zákazníky a koordinace záručního servisu.'
content_process:
  tagline: Jak se stát partnerem
  title: Jednoduchý proces partnerství
  subtitle: Náš proces partnerství je přímočarý —navržen tak, abyste mohli rychle začít prodávat produkty afarer.
  items:
    - title: 'Krok 1: Odešlete přihlášku'
      description: Vyplňte náš partnerský přihlašovací formulář s profilem společnosti, cílovým trhem a zájmy o produkty.
    - title: 'Krok 2: Posouzení kvalifikace'
      description: Náš partnerský tým zkontroluje vaši přihlášku a kontaktuje vás do 3 pracovních dnů, aby prodiskutoval příležitosti.
    - title: 'Krok 3: Smlouva a nastavení'
      description: Podepište partnerskou smlouvu, nastavte si účet a získejte partnerské ceny, marketingové materiály a vzorky produktů.
    - title: 'Krok 4: Školení a uvedení na trh'
      description: Poskytnuto školení o produktu, podpora prodeje a marketingové materiály. Jste připraveni začít prodávat.
cta:
  title: Jste připraveni stát se partnerem afarer?
  subtitle: Požádejte o partnerství a náš tým odpoví do 3 pracovních dnů.
  actions:
    - variant: primary
      text: Požádat o partnerství
      href: /contact
    - text: Zobrazit naše produkty
      href: /products

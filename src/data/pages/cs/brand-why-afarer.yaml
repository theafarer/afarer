features3_reasons:
  tagline: Why Choose afarer
  title: 'Sedm důvodů pro partnerství s námi'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'Vlastníme a provozujeme továrnu o rozloze 12 000 m². Když spolupracujete s afarer, pracujete přímo s lidmi, kteří navrhují, inženýrují a staví vaše produkty —bez zprostředkovatelů.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Náš proces návrhu začíná případem použití, nikoli kategorií produktu. Optimalizujeme tvar trupu, výběr materiálů a konfiguraci podle toho, jak bude loď skutečně používána.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'Certifikováno CE, systém kvality ISO, soulad s BSCI a REACH, schváleno USCG. Každý produkt splňuje mezinárodní normy —nejde jen o prohlášení.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Barvy trubek, uspořádání konzole, branding, balení —přizpůsobíme vašim specifikacím. Bez tlaku na minimální objednávku. Začněte s prototypem, škálujte s důvěrou.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'Sklad v USA v Kalifornii, přímá doprava z Qingdao, letecká přeprava pro naléhavé objednávky. Zajišťujeme celní papírování a dokumentaci.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'Podporujeme lodě, které jsme postavili před 20 lety. Originální náhradní díly, technické rady, pokyny k opravě —náš tým je k dispozici, když nás potřebujete.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Skutečné nosnosti, skutečné rozměry, skutečná hmotnost. Žádné marketingové nafouknutí. Co zveřejníme, to dostanete —ověřeno nezávislým testováním.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Trusted by Brands Worldwide
  title: What Our Partners Say
  items:
    - content: 'Pracovali jsme s několika výrobci v Číně, ale afarer vyniká svou inženýrskou podporou a stálou kvalitou. Zacházejí s naší značkou jako s vlastní.'
      name: '—OEM Partner, European Water Sports Brand'
    - content: 'Jejich Hypalon SUP čluny jsou v provozu v naší flotile již přes 5 let. Minimální údržba, vynikající UV odolnost. 5letá záruka na trubky nám dává jistotu.'
      name: '—Fleet Operator, Middle East Resort Group'
    - content: 'Tým afarer nám pomohl vyvinout vlastní design SUP prkna od konceptu do výroby za 90 dní. Kvalita předčila naše očekávání.'
      name: '—Distributor, Australian Watersports'

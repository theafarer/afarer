hero:
  tagline: Certifikace a normy
  title: Certifikáty kvality<br />a normy shody
  subtitle: Produkty afarer jsou vyráběny v souladu s mezinárodními námořními bezpečnostními standardy, systémy řízení kvality a ekologickými předpisy.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp

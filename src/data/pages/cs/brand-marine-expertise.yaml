hero:
  tagline: Marine Expertise
  title: 'Desetiletí námořního inženýrství<br />v každém trupu'
  subtitle: 'afarer kombinuje hlubokou materiálovou vědu, precizní výrobu a testování v reálných podmínkách k výrobě plavidel, která fungují, když na tom záleží.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer marine engineering and R&D team at work
expertise_materials:
  tagline: Material Science
  title: 'Výběr správného materiálu<br />pro každou aplikaci'
  subtitle: 'Pracujeme se třemi základními materiály —každý je vybrán pro konkrétní případy použití a požadavky na výkon.'
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: '1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.'
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: 'Vynikající chemická odolnost a UV stabilita. Hypalonové čluny mohou vydržet 15-20 let při správné péči. Doporučeno pro komerční, záchranné a vojenské aplikace, kde je kritická dlouhodobá odolnost.'
      icon: tabler:shield
    - title: Fiberglass & Aluminum
      description: 'Sklolaminátové trupy s hlubokým V pro SUP čluny a hlídkové lodě —výkon rozřezávající vlny v drsných podmínkách. Hliníkové trupy pro těžké komerční pracovní lodě vyžadující maximální pevnost a nosnost.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Manufacturing Capabilities
  title: 'Precizní výroba<br />v každém kroku'
  subtitle: 'Naše zařízení o rozloze 12 000 m² je vybaveno specializovanými stroji pro každou fázi výroby.'
  columns: 2
  items:
    - title: CNC Cutting
      description: 'Počítačem řízené řezání zajišťuje přesné, opakovatelné panely tkaniny s minimálním odpadem. Každý díl přesně odpovídá návrhu.'
      icon: tabler:cpu
    - title: High-Frequency Welding
      description: 'Průmyslové HF svařování vytváří švy pevnější než základní materiál. Stálá regulace teploty a tlaku zajišťuje vzduchotěsné spoje v každé výrobní sérii.'
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: 'Tisíce polyesterových vláken spojuje horní a spodní vrstvy tkaniny, což umožňuje nafouknutí pod vysokým tlakem (15-20 PSI) pro tuhá, stabilní SUP prkna a podlahy.'
      icon: tabler:building-arch
    - title: Pressure Testing
      description: 'Každý nafukovací produkt je před odesláním testován tlakem. SUP trubky jsou testovány při 1,5násobném jmenovitém tlaku —pokud to vydrží, bude to fungovat na vodě.'
      icon: tabler:wind
    - title: Seam Strength Testing
      description: 'Náhodné vzorky z každé výrobní šarže procházejí destruktivním testováním pevnosti švů. Výsledky jsou zaznamenány a dohledatelné ke konkrétním výrobním sériím.'
      icon: tabler:files
    - title: Water Testing
      description: 'Každý model SUP prochází námořními zkouškami před certifikací. Testování v reálných pobřežních podmínkách ověřuje výkon, ovladatelnost a stabilitu.'
      icon: tabler:droplet
expertise_design:
  tagline: Design & Engineering
  title: 'Navrženo pro reálné podmínky'
  subtitle: 'Naše designová filozofie začíná tím, jak bude loď používána —pak staví inženýrství kolem tohoto případu použití.'
  items:
    - title: Deep-V Hull Design
      description: "Our fiberglass hulls feature calculated deadrise angles optimized for each model's length and intended use. Steeper V for rough-water performance, shallower for stability."
    - title: Multi-Chamber Safety
      description: 'Every boat features 3-7 independent air chambers. If one compartment is compromised, the remaining chambers keep the boat afloat and operational.'
    - title: Ergonomic Layout
      description: 'Console position, tube height, and seat placement are designed around operator comfort during extended use —whether patrolling, fishing, or transporting.'
    - title: Custom Configuration
      description: 'Tube colors, console configuration, fuel capacity, accessory mounts —each model can be customized to match specific operational requirements.'
cta:
  title: 'Máte na mysli konkrétní aplikaci?'
  subtitle: 'Náš inženýrský tým může poradit s výběrem materiálu, designem a výrobou pro váš projekt.'

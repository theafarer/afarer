intro: Unlike brands that outsource production to third-party factories, afarer owns and operates its entire manufacturing chain. This vertical integration allows us to maintain strict quality control at every stage, respond quickly to custom requirements, and deliver consistent product quality batch after batch. Here is how a SUP board is built in our facility.
steps:
  - title: Řezání
    description: Automatické CNC stroje přesně řežou tkaniny podle specifikací.
    icon: tabler:scissors
  - title: Svařování
    description: RF a horkovzdušné svařování vytváří pevné, vzduchotěsné spoje.
    icon: tabler:flame
  - title: Montáž
    description: Kvalifikovaní technici montují ventily, příslušenství a armatury.
    icon: tabler:tool
  - title: Testování
    description: Každý produkt prochází tlakovými, vztlakovými a kontrolními testy.
    icon: tabler:clipboard-check
  - title: Balení
    description: Produkty jsou pečlivě zabaleny a připraveny k odeslání.
    icon: tabler:package

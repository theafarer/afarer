hero:
  tagline: Výrobní proces
  title: Náš výrobní proces
  subtitle: Od suroviny po hotový výrobek —každý krok je řízen kvalitou.
  back_label: Zpět do továrny
  back_link: /factory
intro: >-
  Na rozdíl od značek, které outsourcují výrobu do třetích továren, afarer vlastní a provozuje celý svůj výrobní řetězec. Tato vertikální integrace nám umožňuje udržovat přísnou kontrolu kvality v každé fázi, rychle reagovat na individuální požadavky a dodávat konzistentní kvalitu šarži za šarží.
  Takto se SUP prkno vyrábí v našem závodě.
steps:
  - step: '01'
    title: Řezání
    description: Automatické CNC stroje přesně řežou tkaniny podle specifikací.
    duration: 1–2 dní
  - step: '02'
    title: Svařování
    description: RF a horkovzdušné svařování vytváří pevné, vzduchotěsné spoje.
    duration: 2–4 hodiny na lodní sadu
  - step: '03'
    title: Montáž
    description: Kvalifikovaní technici montují ventily, příslušenství a armatury.
    duration: 1–2 dní na člun
  - step: '04'
    title: Testování
    description: Každý produkt prochází tlakovými, vztlakovými a kontrolními testy.
    duration: 1–2 dní na prkno
  - step: '05'
    title: Balení
    description: Produkty jsou pečlivě zabaleny a připraveny k odeslání.
    duration: 1–2 dní
  - step: '06'
    title: Finální montáž a osazení
    description: Ventily, D-kroužky, držadla, fin boxy a palubové podložky se montují na montážní lince. Každé prkno prochází 100bodovým montážním kontrolním seznamem s povinným podpisem v každé fázi.
    duration: 1–2 dní
  - step: '07'
    title: Testování a kontrola kvality
    description: 'Každé dokončené prkno prochází povinnou kontrolou kvality: test zadržení vzduchu v komorách, kontrola funkčnosti kování, ověření utahovacího momentu spojovacích prvků a vizuální kontrola. Zakázkové a prototypové výrobky navíc absolvují zkoušky na vodě zaměřené na stabilitu a ovladatelnost.'
    duration: 1–2 dní
  - step: '08'
    title: Balení a expedice
    description: Desky se vypustí, složí podle postupu, zabalí do pevných tkaných vaků nebo maloobchodních krabic a naloží k expedici. Každý balík je označen modelem, výrobním číslem a destinací. S přepravními společnostmi koordinujeme kontejnerové zásilky FCL a LCL po celém světě.
    duration: 1 den

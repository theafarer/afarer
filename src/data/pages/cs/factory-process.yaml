intro: Na rozdíl od značek, které outsourcují výrobu do třetích továren, afarer vlastní a provozuje celý svůj výrobní řetězec. Tato vertikální integrace nám umožňuje udržovat přísnou kontrolu kvality v každé fázi, rychle reagovat na individuální požadavky a dodávat konzistentní kvalitu produktů šarži za šarží. Takto se prkno vyrábí v našem závodě.

steps:
  - step: '01'
    title: Příjem a kontrola materiálu
    description: Každá příchozí šarže PVC tkaniny, skelných rohoží, pryskyřice a kování se kontroluje podle specifikace. Vzorky tkaniny se před uvolněním do výroby testují na pevnost v tahu, rovnoměrnost tloušťky a odolnost vůči UV záření. Nevyhovující materiály jsou uloženy do karantény a vráceny.
    duration: 1–2 dny
  - step: '02'
    title: Automatické řezání PVC
    description: Schválené tkaniny se pokládají na automatický CNC řezací stroj a stříhají s přesností pod milimetr. Počítačem optimalizované rozmístění dílců minimalizuje odpad — obvykle pod 5 %. Vyříznuté dílce jsou označeny podle modelu prkna a komory, svázány do svazků a předány do svařovací dílny.
    duration: 2–4 hodiny na sadu dílů prkna
  - step: '03'
    title: Tepelné těsnění a svařování trubic
    description: Dílce se přitavují a spojují na strojích pro tepelné těsnění pomocí horkovzdušného svařování při řízených teplotách 200–300 °C. Hlavní švy jsou zesíleny dielektrickým RF svařováním pro vzduchotěsné, vysoce pevné spoje. Dokončené komory se nafouknou na 1.5× pracovního tlaku na 30minutovou validaci udržení vzduchu.
    duration: 1–2 dny na prkno
  - step: '04'
    title: Tisk a dekorace SUP
    description: Grafika na palubách SUP prken se nanáší digitálním tiskem pro plnobarevné designy ve fotografické kvalitě a sítotiskem pro odolná loga a opakující se vzory. Tisky se vytvrzují a utěsňují pro odolnost vůči UV záření a oděru.
    duration: 1–2 dny
  - step: '05'
    title: Finální montáž a osazení
    description: Prkna se na montážní lince osazují ploutvemi, ventily, EVA palubami a příslušenstvím. Každé prkno prochází 100bodovým montážním kontrolním seznamem s povinným podpisem v každé fázi.
    duration: 2–4 dny
  - step: '06'
    title: Testování a kontrola kvality
    description: 'Každé dokončené prkno prochází povinnou kontrolní branou kvality: test udržení vzduchu v komorách, kontrola funkčnosti kování, ověření utahovacího momentu spojovacích prvků a vizuální kontrola. Zakázkové a prototypové výrobky navíc absolvují zkoušky na vodě zaměřené na stabilitu a ovladatelnost.'
    duration: 1–2 dny
  - step: '07'
    title: Balení a expedice
    description: Prkna se vypustí, složí podle postupu, zabalí do pevných tkaných vaků nebo překližkových beden a naloží k expedici. Každý balík je označen modelem, výrobním číslem a destinací. S přepravními společnostmi koordinujeme kontejnerové zásilky FCL a LCL po celém světě.
    duration: 1 den


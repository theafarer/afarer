hero:
  tagline: O nás
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Továrna a dílny afarer
  title: O afarer
  subtitle: Výroba nafukovacích člunů, SUP a vybavení pro vodní sporty od roku 2012. CE a ISO certifikováno.

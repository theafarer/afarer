    - title: Dodané trupy
      amount: 2,400+
    - title: Země, do kterých dodáváme
      amount: '40'
    - title: Roky kombinovaných zkušeností
      amount: '60'
    - title: Průměrná doba reakce na reklamaci (hodiny)

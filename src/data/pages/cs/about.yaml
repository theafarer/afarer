features3_what_we_build:
  title: Co stavíme
  subtitle: 'Začínali jsme v přímořské dílně s jedním člunem a neochvějným přesvědčením: námořní výrobky by měly být konstruovány tak, jako by na nich skutečně záleželo — protože záleží. Dnes dodáváme do více než 40 zemí, ale každý trup stále prochází rukama týchž lidí, kteří firmu založili.'
  columns: 3
  isBeforeContent: true
  items:
    - title: SUP prkna
      description: Nafukovací SUP prkna od 9 do 12 stop. Navržena pro túry, jógu, rybaření a rodinné použití.
      icon: tabler:ship
    - title: Nafukovací SUP
      description: Nafukovací SUP prkna z PVC o délce od 9 do 12 stop. Lehká, odolná a snadno skladovatelná.
      icon: tabler:speedboat
    - title: Prémiové SUP balíčky
      description: Kompaktní SUP prkna s vysokou specifikací, vyrobená na míru vaší značce nebo flotile.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Příslušenství
      description: Pádla, pumpy, obaly, nepromokavé vaky a elektronika. Vše sladěné s našimi prkny.
      icon: tabler:package
    - title: Rekonstrukce a opravy
      description: Opravy prken, výměna podložek a upgrade příslušenství v našich vlastních dílnách.
      icon: tabler:tool
    - title: Zakázkové stavby
      description: Návrh řešení projekt od projektu pro komerční, vědecké a vojenské zákazníky.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Návrh člunů a technické řešení
steps2_values:
  title: Naše hodnoty
  subtitle: Tři principy, které od prvního dne formují každý náš produkt.
  items:
    - title: Postaveno tak, aby uneslo vaši rodinu
      description: Každý trup, svár a spojovací prvek zpracováváme tak, jako by jej měla používat naše vlastní rodina.
      icon: tabler:heart
    - title: Konstruujeme dřív, než prodáváme
      description: Nafukovací SUP prkna od 9 do 12 stop. Navržena pro túry, jógu, rybaření a rodinné použití.
      icon: tabler:settings
    - title: Podpora, která vydrží déle než záruka
      description: Dvacet let staré trupy nám stále volají pro náhradní díly – a my stále zvedáme telefon.
      icon: tabler:headset
steps2_milestones:
  title: Milníky
  subtitle: Krátká verze příběhu značky afarer.
  isReversed: true
  items:
    - title: Založeno v přímořské dílně
      description: Založili ji dva lodní architekti s CNC frézkou a tvrdohlavou myšlenkou.
      icon: tabler:building-factory
    - title: Prvních 1,000 dodaných trupů
      description: Dosaženo v našem sedmém roce působení, a to především díky doporučením a stálým zákazníkům.
      icon: tabler:circle-check
    - title: Mezinárodní exportní program
      description: Nyní dodáváme do více než 40 zemí s místními podpůrnými partnery na pěti kontinentech.
      icon: tabler:world

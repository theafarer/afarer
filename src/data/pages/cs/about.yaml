  subtitle: 'Výroba nafukovacích člunů, SUP a vybavení pro vodní sporty od roku 2012. CE a ISO certifikováno.'
  cta: Přečtěte si náš příběh
  image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
  imageAlt: afarer továrna

stats:
  - value: '2012'
    label: Založeno
  - value: '12 000'
    label: m² výrobní plocha
  - value: '50+'
  - value: 'ISO 9001'
    label: Certifikace

brand:
  tagline: Naše značka
  title: Více než výrobce
  body: |
    afarer je více než jen továrna —jsme partneři pro značky, operátory a profesionály, kteří požadují to nejlepší ve vybavení pro vodní sporty. Od návrhu konceptu až po dodání, každý produkt je postaven podle stejných standardů, které bychom požadovali pro vlastní použití.

story:
  tagline: Náš příběh
  title: Od skromných začátků ke globálnímu dosahu
  milestones:
    - year: '2012'
      title: Založení
      description: afarer byl založen v Qingdao s vizí vyrábět vysoce kvalitní nafukovací produkty pro vodní sporty.
      image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
    - year: '2015'
      title: Rozšíření
      description: Rozšířili jsme naše zařízení na 12 000 m² a přidali pokročilé výrobní linky pro SUP prkna a SUP čluny.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - year: '2018'
      title: Certifikace
      description: Získali jsme  certifikaci a CE značení pro všechny produktové řady, čímž jsme otevřeli evropské trhy.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
    - year: '2020'
      title: Globální expanze
      description: Rozšířili jsme export do více než 50 zemí a otevřeli sklad v USA v Montclair, CA.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
    - year: '2024'
      title: Inovační centrum
      description: Založili jsme specializované výzkumné a vývojové centrum s pokročilými testovacími zařízeními a prototypovou dílnou.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp

team:
  tagline: Náš tým
  title: Lidé za afarerem
  subtitle: Více než 200 kvalifikovaných techniků, inženýrů a specialistů pracuje na tom, aby každý produkt splňoval nejvyšší standardy.
brand_hub_tagline: Brand
brand_hub_title: Explore Our Brand
brand_hub_subtitle: Dive deeper into our marine engineering expertise, global presence, and the principles that drive us.

brand_hub_cards:
  - title: Marine Expertise
    desc: 'Decades of material science, precision manufacturing, and real-world testing — from PVC/Hypalon fabrication to deep-V hull design and drop-stitch technology.'
    link: /brand-marine-expertise
    link_label: 'Learn more →'
  - title: Global Presence
    desc: 'Shipping to 50+ countries from our Qingdao facility with authorized service partners across Europe, Asia-Pacific, and the Americas.'
    link: /brand-global-presence
    link_label: 'Learn more →'
  - title: Why afarer
    desc: 'Vertical integration, dual certification (ISO 9001 + BSCI), CE compliance, and low MOQs — built for brands, distributors, and government agencies.'
    link: /brand-why-afarer
    link_label: 'Learn more →'

    - title: '12,000 m² Facility'
      description: 'Dedikovaný výrobní závod se 6 výrobními linkami pro SUP čluny, nafukovací čluny a SUP prkna.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Export do Evropy, Ameriky, Blízkého východu, Asie a Tichomoří a Afriky.'

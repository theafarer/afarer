categories:
  inflatable: Nafukovací SUP desky navržené pro přenosnost bez obětování výkonu. Vyberte správnou velikost podle své váhy a stylu pádlování.
  sup: Paddleboardy pro túry, jógu, fitness i rekreační pádlování. Vybírejte podle délky a hmotnosti jezdce.
  accessory: Příslušenství a bezpečnostní vybavení doplňující vaše plavidlo. Univerzální velikosti s více možnostmi.

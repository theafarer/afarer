how_to_choose:
  title: Jak vybrat správnou velikost
  cards:
    - title: SUP prkna
      description: Zvolte délku podle své hmotnosti a zamýšleného použití. Širší prkna (32"+) nabízejí větší stabilitu. Delší prkna (11-12 stop) lépe kloužou pro výlety. Těžší pádlaři potřebují prkna s vyšším objemem.
    - title: Touring SUP desky
      description: Delší desky (11–12 stop) jsou nejlepší pro zdolávání vzdáleností a touring. Širší desky (32"+) nabízejí větší stabilitu. Zkontrolujte nosnost pro celkovou zátěž včetně vybavení.

    - title: SUP a SUP
      description: Zvolte délku SUP podle počtu cestujících a zamýšleného použití. Větší SUP (4,5 m+) jsou vhodné pro moře a záchranu. Menší SUP (2,7 m) slouží jako tendry a rybářské platformy.

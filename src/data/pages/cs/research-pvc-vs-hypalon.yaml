meta:
  title: PVC vs. Hypalon — technické srovnání pro nafukovací čluny | {SITE}
  description: 'Přímé srovnání PVC (polyvinylchlorid) a Hypalonu (chlorosulfonovaný polyethylen) při výrobě nafukovacích člunů: odolnost proti UV záření, životnost, opravitelnost, hmotnost, cena a doporučení pro konkrétní použití.'
back_text: Zpět na výzkum
hero:
  tagline: Materiály
  title: PVC vs. Hypalon – technické srovnání pro nafukovací čluny
  subtitle: 10 min čtení
content_html: >

  <h2>Přehled materiálů</h2>


  <h3>PVC (polyvinylchlorid)</h3>

  <p>PVC je termoplastický polymer hojně používaný při výrobě nafukovacích člunů. Pro námořní aplikace je obvykle vyztužen polyesterovou tkaninou (1,100 – 1,680 DTEX) a potažen z obou stran. Moderní námořní formulace PVC obsahují UV stabilizátory a změkčovadla, která zlepšují pružnost a odolnost
  vůči povětrnostním vlivům.</p>


  <h3>Hypalon (CSM – chlorosulfonovaný polyethylen)</h3>

  <p>Hypalon je syntetická pryžová směs (po zrušení ochranné známky Hypalon společností DuPont se dnes vyrábí genericky jako CSM). Je proslulý výjimečnou odolností vůči UV záření a ozonu, díky čemuž je preferovaným materiálem pro profesionální a vojenské nafukovací čluny, které tráví dlouhou dobu na
  přímém slunci.</p>


  <h2>Srovnání vedle sebe</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Vlastnost</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">PVC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Hypalon (CSM)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">Odolnost vůči UV záření</td><td class="p-3 border">Dobrá (se stabilizátory)</td><td class="p-3 border">Výborná (inherentní)</td></tr>
      <tr><td class="p-3 border font-medium">Odolnost proti oděru</td><td class="p-3 border">Dobrá</td><td class="p-3 border">Velmi dobrá</td></tr>
      <tr><td class="p-3 border font-medium">Pevnost v tahu</td><td class="p-3 border">3,000 – 5,000 N/5cm</td><td class="p-3 border">2,500 – 4,000 N/5cm</td></tr>
      <tr><td class="p-3 border font-medium">Hmotnost (na m&sup2;)</td><td class="p-3 border">850 – 1,200 g</td><td class="p-3 border">1,100 – 1,500 g</td></tr>
      <tr><td class="p-3 border font-medium">Odolnost za studena (nízké teploty)</td><td class="p-3 border">-30&deg;C</td><td class="p-3 border">-20&deg;C</td></tr>
      <tr><td class="p-3 border font-medium">Opravitelnost</td><td class="p-3 border">Snadná (svařování za tepla nebo lepidlo)</td><td class="p-3 border">Vyžaduje speciální CSM lepidlo</td></tr>
      <tr><td class="p-3 border font-medium">Způsob spojování</td><td class="p-3 border">RF svařování, svařování horkým vzduchem</td><td class="p-3 border">Ruční lepení (kontaktní lepidlo)</td></tr>
      <tr><td class="p-3 border font-medium">Cena (materiál)</td><td class="p-3 border">$8 – $15 / m&sup2;</td><td class="p-3 border">$20 – $40 / m&sup2;</td></tr>
      <tr><td class="p-3 border font-medium">Životnost (tropické slunce)</td><td class="p-3 border">5 – 8 let</td><td class="p-3 border">10 – 15 let</td></tr>
    </tbody>
  </table>


  <h2>Který si vybrat?</h2>


  <h3>Vyberte PVC, když:</h3>

  <ul>
    <li>Rozpočet je hlavní hledisko</li>
    <li>Člun bude skladován mimo přímé sluneční světlo</li>
    <li>Záleží na hmotnosti (PVC je o 15 – 25 % lehčí)</li>
    <li>Potřebujete pružnost za nízkých teplot pod -20&deg;C</li>
    <li>Chcete širší nabídku barev</li>
  </ul>


  <h3>Vyberte Hypalon, když:</h3>

  <ul>
    <li>Člun bude kotvit nebo skladovat na přímém slunci</li>
    <li>Nacházíte se v tropickém prostředí nebo s vysokou úrovní UV záření</li>
    <li>Prioritou je maximální odolnost a životnost</li>
    <li>Vybavujete profesionální nebo komerční flotily</li>
    <li>Hrozí oděr od písku, betonu nebo mol</li>
  </ul>


  <h2>Rozdíly ve výrobě</h2>

  <p>Čluny z PVC se vyrábějí pomocí RF (radiofrekvenčního) svařování nebo svařování horkým vzduchem, které vytváří molekulární spojení mezi vrstvami potažené tkaniny. To umožňuje automatizovanou a konzistentní výrobu s vysokou produktivitou. Čluny z Hypalonu se montují ručním lepením kontaktním
  lepidlem. Každý šev se ručně převalcuje a lisuje, takže výroba z Hypalonu je pracnější.</p>


  <h2>Doporučení afarer</h2>

  <p>Pro většinu rekreačních uživatelů nabízí moderní kvalitní PVC se stabilizátory UV nejlepší rovnováhu mezi cenou, hmotností, výkonem a odolností. Společnost afarer používá pro své spotřebitelské i OEM produktové řady námořní PVC o hustotě 1,680 DTEX s třívrstvým povlakem. Komerčním a vládním
  klientům, kteří potřebují dlouhodobé působení UV záření, nabízíme na vyžádání výrobu z Hypalonu.</p>

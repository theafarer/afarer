faqs:
  - question: Why are inflatable boats essential for disaster relief operations?
    answer: "In the aftermath of floods, hurricanes, tsunamis, and other disasters, roads become impassable and conventional vehicles cannot operate. Inflatable boats offer unique advantages: shallow-water capability to navigate flooded areas, rapid deployment from compact storage, maneuverability in debris-strewn waters, and the ability to operate where larger vessels cannot reach."
  - question: What specific features do afarer disaster relief boats offer?
    answer: Our disaster relief boats feature multiple independent air chambers for redundancy, high-visibility colors for aerial identification, reinforced construction for debris impact resistance, shallow-draft designs for flooded urban environments, and dedicated mounting systems for stretchers, medical equipment, and aid supplies.
  - question: Can afarer customize boats for specific humanitarian missions?
    answer: Yes. We work directly with government emergency services, NGOs, and humanitarian aid organizations to develop mission-specific configurations including MEDEVAC layouts, supply transport configurations, personnel carrier setups, and reconnaissance platforms.
  - question: What materials are used for disaster relief inflatable boats?
    answer: We use Hypalon (CSM/Neoprene) and high-tensile marine-grade PVC. Hypalon offers exceptional chemical resistance, UV stability, and abrasion resistance critical for operating in heavily contaminated disaster environments. All materials are sourced from globally reputable suppliers with full traceability.
  - question: Does afarer offer rapid delivery for emergency service orders?
    answer: Yes. We maintain priority production slots for government and humanitarian aid orders. Standard lead time is 30—5 days, with rush production available for approved emergency procurement. Contact our government sales team for expedited processing.
body: |
  <h2>Spolehlivá vybavení pro krizové situace</h2>
  <p>Při katastrofách je spolehlivé vybavení otázkou života a smrti. Nafukovací čluny afarer jsou navrženy pro nasazení v nejnáročnějších podmínkách —záplavy, pobřežní bouře, odlehlé oblasti a humanitární krize.</p>
  <p>Naše čluny jsou lehké, přenosné a rychle nafukovatelné, což je činí ideálními pro letecké shazování a rychlé nasazení. Více nezávislých vzduchových komor zajišťuje, že člun zůstane funkční i v případě poškození jedné komory.</p>

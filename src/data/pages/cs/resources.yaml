hero_text:
  tagline: Resources
  title: 'Centrum stažení a průvodce pro kupující'
  subtitle: 'Získejte přístup k produktovým katalogům, OEM příručkám, kontrolním seznamům kupujícího a technické dokumentaci, které vám pomohou činit informovaná rozhodnutí o nákupu.'
features3_downloads:
  tagline: Downloads
  title: 'Produktová dokumentace<br />a zdroje pro kupujícího'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Kompletní řada produktů včetně SUP člunů, nafukovacích člunů, SUP prken, kajaků a příslušenství. Specifikace, konfigurace a možnosti. Formát PDF.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'Vše, co potřebujete vědět o OEM/ODM partnerství: přehled procesu, minimální množství objednávky, možnosti přizpůsobení, kontrola kvality a doprava.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'Jak vybrat správný SUP: materiály trupu, materiály trubek, výběr motoru, aspekty velikosti a možnosti konfigurace pro různé aplikace.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'Klíčové úvahy při výběru výrobce SUP prken: ukazatele kvality, požadavky na certifikaci, úvahy o MOQ a na co se zaměřit při auditu továrny.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC vs Hypalon: srovnání odolnosti, UV odolnosti, životnosti, možností opravy a nákladů pro různé námořní aplikace.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'Stáhněte si naši šablonu produktového briefu. Vyplňte své požadavky a pošlete nám ji pro získání cenové nabídky a posouzení proveditelnosti v témže týdnu.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Časté otázky o našich produktech, výrobním procesu a partnerském modelu.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ se liší podle kategorie produktu. SUP čluny obvykle začínají od 10 kusů na model. SUP prkna od 50 kusů. Kontaktujte náš prodejní tým pro informace o MOQ specifické pro produkt.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Ano. afarer zajišťuje výrobu vzorků pro vyhodnocení před sériovou výrobou. Náklady na vzorky jsou dohodnutelné a často se započítávají do první výrobní objednávky.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Standardní podmínky: 30% záloha při objednávce, 70% před odesláním. Podmínky LC jsou k dispozici pro kvalifikované zákazníky. Kontaktujte náš finanční tým pro projednání podmínek.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Typické dodací lhůty: SUP čluny 30-45 dní, SUP prkna 20-30 dní, nafukovací čluny 25-35 dní. Vlastní vývoj přidává 15-30 dní na prototypování.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'Certifikace CE pro trhy EU, výroba schválená americkou pobřežní stráží, systém kvality ISO, soulad s BSCI a REACH.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Ano. Poskytujeme vlastní balení s vaším logem, barvami a identitou značky. MOQ pro vlastní balení závisí na kategorii produktu.'
      icon: tabler:color-swatch
cta:
  title: 'Potřebujete pomoc s nalezením správného zdroje?'
  subtitle: 'Kontaktujte náš tým pro osobní poradenství ohledně výběru produktu, OEM partnerství nebo technických specifikací.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

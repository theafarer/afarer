hero:
  tagline: Bezpečnost
  title: Bezpečnostní normy a certifikace
  subtitle: Každý produkt afarer prochází přísným testováním a splňuje mezinárodní bezpečnostní normy pro rekreační i profesionální použití.
certifications:
  - title: CE certifikace
    description: Veškeré bezpečnostní vybavení afarer splňuje požadavky na označení CE podle evropského nařízení o osobních ochranných prostředcích (EU) 2016/425.
  - title: ISO 6185
    description: Záchranné vesty splňují  normy vztlaku. Vesta Life Vest Classic poskytuje vztlak 50N+; vesta Life Vest Pro díky automatickému nafukování splňuje požadavky SOLAS.
  - title: null
    description: Záchranné vesty splňují normy vztlaku . Life Vest Classic poskytuje vztlak 50N+; Life Vest Pro splňuje požadavky SOLAS s automatickým nafukováním.

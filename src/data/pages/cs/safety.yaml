hero:
  tagline: Safety
  title: Safety Standards & Certification
  subtitle: Every afarer product undergoes rigorous testing and meets international safety standards for recreational and professional use.
certifications:
  - title: CE Certification
    description: All afarer safety equipment complies with CE marking requirements under the European Personal Protective Equipment Regulation (EU) 2016/425.
  - title: ISO 6185
    description: Life vests meet  flotation standards. The Life Vest Classic provides 50N+ buoyancy; the Life Vest Pro meets SOLAS requirements with automatic inflation.
  - title: null
    description: The Life Vest Pro complies with SOLAS (Safety of Life at Sea) regulations for offshore and commercial marine operations.

meta:
  title: 'Technologie — drop stitch a námořní PVC | {SITE}'
  description: 'Technologie afarera: konstrukce drop stitch, námořní PVC, dvouvrstvé konstrukce a vysoký tlak. Inovace od profesionálního výrobce nafukovacích SUP prken.'
  keywords:
    - 'technologie SUP'
    - 'konstrukce drop stitch'
    - 'vysokotlaké SUP'
    - 'materiály nafukovacích SUP'
hero:
  tagline: Technologie
  title: Postaveno pro výkon
  subtitle: Každé prkno afarer je navrženo s precizními materiály a výrobními metodami testovanými pro námořní prostředí.
sections:
  - title: Drop-stitch jádro
    description: Tisíce vnitřních polyesterových vláken spojují horní a spodní vrstvy a vytvářejí tuhou strukturu při 12-15 PSI. Jedná se o stejnou technologii používanou v profesionálních pádlovacích prknech a nafukovacích závodních člunech.
    imageAlt: Schéma DS jádra
  - title: Vojenské PVC
    description: Vícevrstvá laminovaná PVC tkanina dimenzovaná pro námořní prostředí. Každá vrstva je svařena tavením, nikoli lepena, čímž se eliminuje riziko delaminace. Testováno na odolnost proti UV, korozi slanou vodou a oděru.
    imageAlt: PVC vrstva
  - title: Hypalonové hadice
    description: Hypalon (CSM) pryž použitá u modelů SUP poskytuje vynikající odolnost proti UV a chemikáliím ve srovnání se standardním PVC. Hypalonové hadice si udržují flexibilitu v extrémních teplotách a odolávají degradaci z paliva a oleje.
    imageAlt: Hypalon
  - title: Nafukovací podlaha Air Deck
    description: Vysokotlaký nafukovací podlahový systém nahrazující tradiční překližkové nebo hliníkové lamely. Snižuje dobu sestavení, celkovou hmotnost a objem skladování při zachování dostatečné tuhosti pro stání, rybaření a chůzi.
    imageAlt: Air Deck

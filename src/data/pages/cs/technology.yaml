hero:
  tagline: Technologie
  title: Postaveno pro výkon
  subtitle: Každé prkno afarer je navrženo s precizními materiály a výrobními metodami testovanými pro námořní prostředí.
sections:
  - title: Drop-stitch jádro
    description: Tisíce vnitřních polyesterových vláken spojují horní a spodní vrstvy a vytvářejí tuhou strukturu při 12-15 PSI. Jedná se o stejnou technologii používanou v profesionálních paddleboardech a nafukovacích závodních SUP.
    imageAlt: Schéma DS jádra
  - title: Námořní PVC
    description: Vícevrstvá laminovaná PVC tkanina dimenzovaná pro námořní prostředí. Každá vrstva je svařena tavením, nikoli lepena, čímž se eliminuje riziko delaminace. Testováno na odolnost proti UV, korozi slanou vodou a oděru.
    imageAlt: PVC vrstva
  - title: Vojensky odolné PVC
    description: Používá se u všech modelů SUP — prémiové PVC poskytuje vynikající odolnost proti UV a chemikáliím. Udržuje flexibilitu v extrémních teplotách a odolává degradaci.
    imageAlt: PVC
  - title: Nafukovací podlaha Air Deck
    description: Vysokotlaká nafukovací konstrukce z drop-stitch poskytující výjimečnou tuhost pro stání, rybaření a jógu. Snižuje dobu přípravy, celkovou hmotnost a objem při skladování.
    imageAlt: Air Deck

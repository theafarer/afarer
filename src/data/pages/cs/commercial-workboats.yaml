faqs:
  - question: What types of commercial workboats does afarer manufacture?
    answer: afarer manufactures inflatable workboats for patrol and security, dive support, hydrographic survey, utility transport, environmental monitoring, and offshore logistics. Our boats up to 16 feet are engineered for the specific demands of commercial marine operations.
  - question: What materials are used in afarer commercial workboats?
    answer: We use marine-grade hypalon (CSM/Neoprene) and high-tensile PVC with multi-layer coatings selected for superior chemical resistance, UV stability, and abrasion resistance. All materials are sourced from globally reputable suppliers and undergo rigorous quality testing.
  - question: Can afarer customize workboats for specific commercial applications?
    answer: Yes —we offer full OEM/ODM services including custom tube layouts, reinforced rubbing strakes, console integration, equipment mounting systems, specialized accessory packages, and fleet branding. Our engineering team works with you from concept to production.
  - question: What certifications do afarer workboats carry?
    answer: All standard models carry CE certification per EU Recreational Craft Directive. Our factory is  certified. Commercial certifications including  available upon request.
  - question: Does afarer offer fleet pricing for commercial operators?
    answer: Yes. We offer tiered pricing for fleet and multi-unit orders. Contact our sales team for a customized commercial quotation with volume discounts, preferred lead times, and dedicated account management.
body: |
  <h2>Komerční čluny postavené na spolehlivosti</h2>
  <p>Komerční námořní operace vyžadují vybavení, na které se lze spolehnout den za dnem, rok za rokem. afarerovy komerční nafukovací čluny jsou navrženy a vyrobeny tak, aby splňovaly tyto požadavky —odolné materiály, osvědčené konstrukční metody a podpora, která drží krok s vaším podnikáním.</p>
  <p>Nabízíme komplexní řadu komerčních člunů od kompaktních pracovních plošin až po prostorné transportní jednotky, všechny postavené podle stejných standardů kvality, díky kterým je afarer důvěryhodným jménem v námořním průmyslu.</p>

  <h2>Klíčové vlastnosti</h2>
  <ul>
    <li>Odolná konstrukce z PVC nebo Hypalonu</li>
    <li>Více nezávislých vzduchových komor pro bezpečnost</li>
    <li>Vyztužené dno pro stojící zatížení</li>
    <li>Možnosti vlastního uspořádání a vybavení</li>
    <li>CE a ISO certifikace na všech standardních modelech</li>
  </ul>

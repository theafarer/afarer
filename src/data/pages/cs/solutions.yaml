features3_solutions:
  tagline: Řešení podle typu podnikání
  title: SUP na míru<br />pro vaše podnikání
  isBeforeContent: false
  columns: 2
  items:
    - title: Resorty a hotely
      description: Kompletní programy SUP flotil pro hotelová zařízení — odolná prkna, vlastní branding a podpora školení personálu.
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: Pádlovací kluby
      description: Spolehlivé SUP flotily pro paddle kluby, výukové programy a provoz s členskou základnou — prkna komerční kvality za klubové ceny.
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: Provozovatelé půjčoven
      description: Vysoce obrátková SUP prkna konstruovaná pro každodenní pronájem. Odolná vůči UV záření, rychleschnoucí, stohovatelná — navržená pro náročný provoz půjčoven.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: Maloobchodní partneři
      description: Prodávejte nejrychleji rostoucí značku SUP na vašem trhu. Kompletní produktová řada, marketingové materiály, dropshipping a konkurenceschopné marže.
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: Distributoři
      description: Exkluzivní území, kompletní produktové portfolio a dedikovaná správa účtu. Připojte se k naší globální distribuční síti ve více než 50 zemích.
      icon: tabler:world
      link: /solutions/distributors
    - title: Vybudujte si vlastní značku
      description: Kompletní výroba SUP v režimu OEM/ODM — design, prototypování, sériová výroba a logistika. Uveďte svou značku na trh se společností Afarer.
      icon: tabler:package
      link: /solutions/build-your-own-brand

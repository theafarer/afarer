intro: >-
  Model CAD, ať je sebedetailnější, neodhalí, jak se člun skutečně chová, dokud se nesetká s vodou. Proto je naše Prototypová dílna navržena tak, aby převáděla inženýrská data na fyzické plavidlo pro otevřené moře co nejrychleji a nejpřesněji. Každý nový model {SITE.name} – a každá významná
  zakázková stavba – prochází touto dílnou, než se zadá výroba nástrojů.
content_html: >-
  <h2>Kde se design stává skutečností</h2>

  <p>Dílna je plně vybavena pro souběžnou výrobu trupu, nafukovacích komor a výstroje. Tento přístup s paralelním tokem práce zkracuje dobu výroby prototypu na 8–12 týdnů od uvolnění konstrukce oproti oborovému standardu 16–20 týdnů. Pokud vaše aplikace vyžaduje specializované řešení, dokážeme se
  dostat od konceptu k ověření na vodě za méně než tři měsíce.</p>


  <h2>Možnosti dílny</h2>

  <table>
    <thead><tr><th>Pracoviště</th><th>Vybavení</th><th>Účel</th></tr></thead>
    <tbody>
      <tr><td>Výroba trupu</td><td>Rotační pec (HDPE), svařovací pracoviště TIG (hliník), formy pro ruční laminaci (sklolaminát)</td><td>Výroba trupu v plné velikosti ze všech tří typů materiálů</td></tr>
      <tr><td>Montáž nafukovacích komor</td><td>RF svařovací lis, stanoviště pro bodové svařování horkým vzduchem, přípravek pro zkoušku nahuštění</td><td>Výroba nafukovacích komor v plné velikosti se všemi přepážkami, kužely a ventily</td></tr>
      <tr><td>Montáž a výstroj</td><td>Zvedák motoru (500 kg), zkušební rám konzoly, krimpovací kleště hydraulických hadic, deska elektrických kabeláží</td><td>Kompletní výstroj: motor, řízení, ovládací prvky, palivový systém, elektronika, sedadla</td></tr>
      <tr><td>Pracoviště přístrojů</td><td>GPS senzor rychlosti, průtokoměr paliva, akcelerometry, termočlánkové pole, datalogger</td><td>Instalace a kalibrace přístrojového vybavení pro zkoušky na vodě</td></tr>
    </tbody>
  </table>


  <h2>Cesta prototypu — krok za krokem</h2>

  <ol>
    <li><strong>Předání konstrukce</strong> — Kompletní konstrukční balíček (3D model, zpráva FEA, kusovník, harmonogram vrstvení) je formálně přezkoumán vedoucím dílny a projektovým inženýrem. Veškeré výrobní připomínky se vyznačí a vyřeší dříve, než začne řezání.</li>
    <li><strong>Výroba trupu</strong> — Trup se staví podle konstrukční specifikace. Pro HDPE: rotační program se načítá ze simulace Moldex3D. Pro hliník: CNC vyřezané plechy se svařují v TIG pracovišti podle schválené mapy svarů. Pro sklolaminát: jednotlivé vrstvy se kladou jedna po druhé podle plánu vrstvení.</li>
    <li><strong>Výroba nafukovacích komor</strong> — Tkanina se řeže pomocí CNC šablon a poté se RF svařuje do komor plné velikosti. Každá komora se nahustí na zkušební tlak a nechá se 24 h pro počáteční stabilizaci.</li>
    <li><strong>Montáž a výstroj</strong> — Trup a nafukovací komory se spojí. Zavěsí se motor, připojí se řízení a ovládací prvky, nainstaluje se palivový systém a všechny elektrické obvody se zapojí a ověří.</li>
    <li><strong>Statické zkoušky</strong> — Než se člun dotkne vody, projde: kontrolou vztlaku (plné zatížení + 30 % rezerva), tlakovou zkouškou palivového systému, zkouškou plného rozsahu řízení a zkouškou spojitosti elektrického uzemnění.</li>
    <li><strong>Program zkoušek na vodě</strong> — 20 hodin testování na vodě, podrobnosti níže.</li>
    <li><strong>Přezkoumání prototypu</strong> — Koná se formální schvalovací jednání za účasti konstrukčního, výrobního a týmu kvality. Veškeré nutné konstrukční změny se zdokumentují a zapracují do výrobního uvolnění.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Program dvacetihodinové zkoušky na vodě — Harmonogram testů</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Manévrování v přístavu — ovládání při nízké rychlosti, couvání, kontrola odrazníků</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Rychlostní zkouška — maximální rychlost ověřená GPS, cestovní rychlost, spotřeba paliva ve 3 bodech otáček</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Zkouška zatáčení — taktický průměr, postup a posun při 20 kn, levobok a pravobok</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test dopadů — opakované průjezdy přes vlny 0.5–1.0 m; akcelerometr na podstavci sedadla kormidelníka</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Zkouška stability — statický úhel náklonu se 4 členy posádky a vybavením na pravoboku, nesymetrické zatížení</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Vytrvalostní jízda — 3 h nepřetržitě při cestovní rychlosti; sledování teplot (motor, palivo, elektroinstalace)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Závěrečná prohlídka — kontrola všech systémů po zkoušce, dotažení a kontrola všech spojovacích prvků, dokumentace zjištění</span>
      </div>
    </div>
  </div>


  <h2>Zakázkové prototypy pro speciální aplikace</h2>

  <p>Prototypový workshop je místo, kde řešíme problémy, které standardní sériové čluny pokrýt neumějí. Mezi nedávné příklady patří:</p>

  <ul>
    <li>RIB o délce 7.8 m pro záchrannou organizaci, vyžadující zakázkovou nástavbu kabiny s ochranou proti převrácení, integrovanými úchytkami pro nosítka a sonarovou gondolou na přídi — vše prototypováno, osazeno a testováno v našem zařízení.</li>
    <li>Nafukovací člun o délce 5.2 m pro dodavatele hydrografického průzkumu se sníženým zrcadlem, demontovatelným stožárem pro přístroje a kapsami pro převodníky skrz trup navrženými tak, aby minimalizovaly rušení proudění.</li>
    <li>Elektrický tender o délce 4.5 m pro superjachtu, kde prototyp posloužil k ověření dojezdu, nabíjecí infrastruktury a hladiny hluku, než se klient zavázal k pořízení flotily čtyř člunů.</li>
  </ul>


  <h2>Náš prototypový tým</h2>

  <p>Dílna zaměstnává osm všestranných námořních techniků, z nichž každý je proškolen nejméně ve dvou ze tří klíčových disciplín (trup, nafukovací komory, vybavení). Vedoucí týmu je mistr stavitel člunů se 16 lety zkušeností, které sahají od zakázkových kusových staveb až po sériovou výrobu. Každému
  prototypu je přidělen projektový inženýr, který je pro klienta jediným kontaktním místem po celou dobu stavby a zkoušek.</p>


  <h2>Zapojení klienta</h2>

  <p>Naše klienty aktivně vybízíme k účasti na klíčových milnících stavby prototypu — zejména při přejímce prvotní kompletace a při zkouškách na vodě. Vaše provozní zpětná vazba je v této fázi neocenitelná pro doladění člunu před zahájením výroby. Nestavíme ve vzduchoprázdnu; stavíme v partnerství s
  vámi.</p>

  <p>Dvacetihodinová zkouška na vodě je také příležitostí, aby se váš tým seznámil s ovládáním člunu, uspořádáním systémů a požadavky na údržbu, což zajistí plynulý přechod do provozu po dodání sériových člunů.</p>

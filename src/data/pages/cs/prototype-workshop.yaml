  subtitle: Od CAD modelu k prknu připravenému na vodu — postavené, vybavené a prověřené
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Výroba prken v prototypové dílně afarer
intro: >-
  Model CAD, ať je sebedetailnější, neodhalí, jak se prkno skutečně ovládá, dokud se nesetká s vodou. Proto je naše prototypová dílna navržena tak, aby převáděla inženýrská data na fyzické, na vodu připravené prkno co nejrychleji a nejpřesněji. Každý nový model Afarer — a každá významná zakázková
  stavba — prochází touto dílnou, než se přistoupí k výrobním nástrojům.
content_html: >-
  <h2>Kde se design stává skutečností</h2>

  <p>Dílna je plně vybavena pro souběžnou výrobu trupu, bočnic a výstroje. Tento přístup s paralelním tokem práce zkracuje dodací lhůtu prototypu na 8–12 týdnů od uvolnění konstrukce oproti oborovému standardu 16–20 týdnů. Pokud vaše aplikace vyžaduje specializované řešení, dokážeme se dostat od
  konceptu k ověření na vodě za méně než tři měsíce.</p>


  <h2>Možnosti dílny</h2>

  <table>
    <thead><tr><th>Pracoviště</th><th>Vybavení</th><th>Účel</th></tr></thead>
    <tbody>
      <tr><td>Výroba trupu</td><td>CNC stříhačka tkanin, lis pro tepelnou laminaci, stanoviště přípravy drop-stitch jádra</td><td>Výroba trupů v plné velikosti ve všech třech typech konstrukce</td></tr>
      <tr><td>Montáž bočnic a komor</td><td>RF svařovací lis, stanoviště pro bodové svařování horkým vzduchem, přípravek pro zkoušku nahuštění</td><td>Výroba bočnic a komor v plné velikosti se všemi přepážkami a ventily</td></tr>
      <tr><td>Vybavení a kompletace</td><td>Přípravek pro frézování držáků ploutví, svařovací přípravky pro úchyty nákladu a madla, stanoviště stříhání palubních podložek</td><td>Kompletní výstroj: ploutve, úchyty nákladu, úchytová madla, palubní podložky, ventily</td></tr>
      <tr><td>Pracoviště přístrojů</td><td>GPS senzor rychlosti, tlakové snímače, akcelerometry, termočlánkové pole, datalogger</td><td>Instalace a kalibrace přístrojů pro zkoušky na moři</td></tr>
    </tbody>
  </table>


  <h2>Cesta prototypu — krok za krokem</h2>

  <ol>
    <li><strong>Předání konstrukce</strong> — Konstrukční balíček (3D model, zpráva FEA, kusovník, plán vrstvení) je formálně přezkoumán vedoucím dílny a projektovým inženýrem. Veškeré výrobní připomínky se vyznačí a vyřeší dříve, než začne řezání.</li>
    <li><strong>Výroba trupu</strong> — Trup se staví podle konstrukční specifikace. U jednovrstvé konstrukce: drop-stitch jádro se laminuje stanovenou PVC kůží. U dvouvrstvé konstrukce: dodatečná kůže se nanáší na základní laminát před vyříznutím tvaru. U fúzované konstrukce: parametry laminace se načítají ze schváleného technologického listu a ověřují se na prvním zkušebním vzorku.</li>
    <li><strong>Výroba bočnic</strong> — Tkanina se řeže pomocí CNC šablon a poté se RF svařuje do bočnic a komor v plné velikosti. Každá komora se nahustí na zkušební tlak a nechá se 24 h pro počáteční stabilizaci.</li>
    <li><strong>Montáž a vybavení</strong> — Trup a bočnice se spojí. Namontují se držáky ploutví a úchyty nákladu, nainstalují se úchytová madla a úchyt pro leash, přišroubuje se plnicí ventil a palubní podložka se nalezne a vyrovná.</li>
    <li><strong>Statické zkoušky</strong> — Než se prkno dotkne vody, projde: kontrolou vztlaku (plné zatížení + 30 % rezerva), tlakovou zkouškou komor, zkouškou úniku ventilu a tažnou zkouškou madel a úchytů.</li>
    <li><strong>Program zkoušek na moři</strong> — 20 hodin testování ve vodě, podrobnosti níže.</li>
    <li><strong>Přezkoumání prototypu</strong> — Koná se formální schvalovací jednání za účasti konstrukčního, výrobního a týmu kvality. Veškeré nutné konstrukční změny se zdokumentují a zapracují do výrobního uvolnění.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Program dvacetihodinové zkoušky na moři — Harmonogram testů</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Základy na klidné vodě — stopování při nízké rychlosti, zatáčení, kontrola postoje a vyvážení</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Rychlostní zkouška — maximální rychlost ověřená GPS, cestovní rychlost, udržitelné tempo při 3 tempách pádlování</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Zkouška zatáčení — poloměr otočky kolem bodu a obloukové zatáčení, odezva prkna, levá a pravá strana</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Zkouška na vlnách — opakované průjezdy vlnami 0.5–1.0 m; akcelerometr v pozici jezdce</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Zkouška stability — statický úhel náklonu se 4 jezdci různé hmotnosti, nesouměrné zatížení na pravou stranu</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Vytrvalostní jízda — 3 h nepřetržitě při cestovní rychlosti; sledování tlaku v komorách, teploty bočnic a únavy jezdce</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Závěrečná prohlídka — povýzkoušková kontrola všech komponentů, dotažení/kontrola všech spojovacích prvků, dokumentace zjištění</span>
      </div>
    </div>
  </div>


  <h2>Zakázkové prototypy pro speciální aplikace</h2>

  <p>Prototypová dílna je místo, kde řešíme problémy, které standardní sériová prkna pokrýt neumějí. Mezi nedávné příklady patří:</p>

  <ul>
    <li>Vysoce viditelné záchranné SUP prkno pro pátrací a záchrannou organizaci, vyžadující integrovaná úchytová madla, držáky pro záchranné vybavení a trup s vysokým vztlakem pro vyzvedávání osob — vše prototypováno, osazeno a testováno v našem zařízení.</li>
    <li>Expediční touringové SUP prkno pro dodavatele hydrografického průzkumu, s demontovatelným stožárem pro přístroje, utěsněnými porty pro vybavení a nízkoprofilovým držákem snímače navrženým tak, aby minimalizoval odpor.</li>
    <li>Kompaktní rybářské SUP prkno pro resortovou flotilu, kde prototyp posloužil k ověření stability, upevnění vybavení a odolnosti při každodenním pronájmu, než se klient zavázal k pořízení flotily čtyř kusů.</li>
  </ul>


  <h2>Náš prototypový tým</h2>

  <p>Dílna zaměstnává osm všestranných námořních techniků, z nichž každý je proškolen nejméně ve dvou ze tří klíčových disciplín (trup, bočnice, výstroj). Vedoucí týmu je mistr výrobců se 16 lety zkušeností od zakázkových kusových staveb až po sériovou výrobu. Každému prototypu je přidělen
  vyhrazený projektový inženýr, který je pro klienta jediným kontaktním místem po celou dobu stavby a zkoušek.</p>


  <h2>Zapojení klienta</h2>

  <p>Naše klienty aktivně vybízíme k účasti na klíčových milnících stavby prototypu — zejména při přejímce prvotní kompletace a při zkouškách na moři. Vaše provozní zpětná vazba je v těchto fázích neocenitelná pro doladění prkna před zahájením výroby. Nestavíme ve vakuu; stavíme v partnerství
  s vámi.</p>

  <p>Dvacetihodinová zkouška na moři je také příležitostí, aby se váš tým seznámil s ovládáním prkna, uspořádáním paluby a požadavky na údržbu, což zajistí plynulý přechod do provozu po dodání sériových prken.</p>

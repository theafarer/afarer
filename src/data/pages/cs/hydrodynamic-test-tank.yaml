hero:
  tagline: Lab 04
  title: Hydrodynamická zkušební nádrž
  subtitle: Ověřování výkonu ještě před prvním prototypem v plné velikosti
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: Testování výkonu v hydrodynamické testovací nádrži Afarer
intro: >-
  Častým mýtem je, že hydrodynamické testování patří jen oceánským lodím. Ve skutečnosti je výkon malého kluzného trupu — třeba RIB o délce 4–6 m — stejně závislý na tvaru podvodní části trupu jako u tankeru na jeho baňaté přídi. Úhel trimu, smáčená plocha, stříkání a provzdušnění mají zásadní vliv
  na rychlost, spotřebu paliva i jízdní komfort. Ve společnosti Afarer provozujeme specializovanou hydrodynamickou testovací nádrž, díky níž tyto vlivy vyčíslíme v měřítku modelu — dříve, než se pustíme do prototypu v plné velikosti z kovu a tkaniny.
content_html: >
  <h2>Proč zkoušet malý člun v nádrži?</h2>

  <p>Zkoušky v měřítku modelu (obvykle 1:3 až 1:5) nám umožňují rychle a nákladově efektivně iterovat tvary trupů. Týden v nádrži přinese stejná výkonnostní data, na která by plnohodnotné zkoušky metodou pokus-omyl potřebovaly měsíce — a to za zlomek nákladů.</p>


  <h2>Specifikace zařízení</h2>

  <table>
    <thead><tr><th>Parametr</th><th>Specifikace</th></tr></thead>
    <tbody>
      <tr><td>Rozměry nádrže</td><td>35 m (D) × 3.5 m (Š) × 1.8 m (H)</td></tr>
      <tr><td>Vlečný vozík</td><td>Elektrický, se servopohonem, max. rychlost 12 m/s (23 kn), přesnost rychlosti ± 0.5 %</td></tr>
      <tr><td>Generátor vln</td><td>Klapkový typ, programovatelné pravidelné &amp; nepravidelné stavy moře, Hs až 0.3 m v měřítku modelu</td></tr>
      <tr><td>Přístrojové vybavení</td><td>6složkový dynamometr (odpor, boční síla, moment zatáčení), akcelerometry, sklonoměry, vlnové sondy</td></tr>
      <tr><td>Systém sběru dat</td><td>Vzorkování 1000 Hz na kanál, zobrazení v reálném čase + sada pro následné zpracování</td></tr>
      <tr><td>Výroba modelů</td><td>Vlastní CNC frézování a 3D tisk modelů trupů do délky 1.8 m LOA</td></tr>
    </tbody>
  </table>


  <h2>Náš zkušební program</h2>

  <p>Standardní program vývoje trupu v naší nádrži probíhá v tomto pořadí:</p>

  <ol>
    <li><strong>Stavba modelu</strong> — Model v měřítku 1:3.5 je CNC obroben z vysoce husté pěny a pro tuhost zalaminován. Hmotnost a těžiště (CG) jsou upraveny tak, aby odpovídaly Froudeho měřítku při plném zatížení.</li>
    <li><strong>Zkoušky odporu</strong> — Model je vlečen při 8-10 rychlostech pokrývajících provozní rozsah. Celkový odpor se měří a rozkládá na třecí a zbytkovou složku metodou ITTC-1957.</li>
    <li><strong>Měření trimu &amp; ponoru</strong> — Při každé rychlosti se zaznamenává provozní trim a ponor. Cílem je optimální úhel trimu 4-6° pro klouzající trupy.</li>
    <li><strong>Průzkum brázdy</strong> — Při dvou rychlostech se měří příčné řezy vln, aby se posoudil odpor z tvorby vln a identifikovaly příčné vlnové interakce, které by mohly způsobovat interferenci v zádi.</li>
    <li><strong>Chování na vlnách (volitelné)</strong> — Jízdy proti vlně a po vlně v pravidelných vlnách za účelem měření přídavného odporu, vertikálního zrychlení a pravděpodobnosti dopadu (slamming).</li>
    <li><strong>Analýza dat &amp; doporučení</strong> — Dodává se kompletní protokol se srovnávacími grafy, křivkami rychlost/výkon a konkrétními konstrukčními doporučeními pro trup v plném měřítku.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Typické výsledky zkoušek v nádrži — Odpor vs. rychlost (trup RIB 450, měřítko 1:3.5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Odpor modelu (N) při rychlostech přepočtených podle Froudeho měřítka. Předpověď výkonu v plném měřítku se řídí metodou predikce výkonu ITTC-1978.</p>
  </div>


  <h2>Odborný tým</h2>

  <p>Naši nádrž obsluhuje hydrodynamik s doktorátem z lodní architektury a 8 lety zkušeností s vlečnými nádržemi ve významném evropském námořním výzkumném ústavu. Podporuje ho technik, který připravuje všechny modely a měřicí vybavení. Tým se řídí Doporučenými postupy ITTC (International Towing Tank
  Conference), aby byl každý test opakovatelný, sledovatelný a mezinárodně obhajitelný.</p>


  <h2>Zkoušky v nádrži pro vývoj vlastního trupu</h2>

  <p>Naše nádrž neslouží jen pro trupy vlastní konstrukce — pravidelně provádíme zkušební programy pro klienty, kteří chtějí ověřit vlastní tvar trupu nebo prošetřit výkonnostní problém:</p>

  <ul>
    <li><strong>Porovnání tvarů trupu</strong> — Dva či více kandidátních tvarů trupu testovaných za identických podmínek poskytuje objektivní srovnání odporu/rychlosti/stability pro vaše konstrukční rozhodnutí.</li>
    <li><strong>Optimalizace přívěsků</strong> — Interceptorové desky, protistříkové lišty, trimovací klapky a vlnolamy lze testovat v různých konfiguracích, abychom kvantifikovali jejich individuální přínos ke snížení odporu.</li>
    <li><strong>Studie sladění motoru</strong> — Údaje o odporu se převedou na křivku předpovědi výkonu, což vám umožní zvolit optimální výkon motoru pro cílovou rychlost a nosnost.</li>
  </ul>


  <h2>Proč testovat u nás?</h2>

  <p>Nedáváme vám jen soubor syrových čísel. Naše protokoly převádějí data z nádrže na konkrétní inženýrská doporučení: „Zvyšte protistříkovou lištu o 8 mm, abyste snížili smáčený povrch při cestovní rychlosti“, „Zvyšte úhel kýlu v zrcadle o 3°, abyste snížili zrychlení při dopadu“, nebo „Posuňte
  podélné těžiště o 150 mm dozadu pro lepší klouzavý postoj“. Odcházíte s jasným pochopením toho, co změnit a proč.</p>

  <p>Naše nádrž je rovněž k dispozici pro nezávislé testování třetí stranou za úplatu. Pokud vyvíjíte trup a chcete nestranné, profesionálně provedené hydrodynamické posouzení, váš dotaz vítáme.</p>

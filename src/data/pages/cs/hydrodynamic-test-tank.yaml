meta:
  title: Hydrodynamický zkušební tank – vlečné zkoušky modelů a optimalizace trupu | {SITE}
  description: Ověřte výkon trupu vašeho RIB v naší hydrodynamické zkušební nádrži. Vlečné zkoušky modelů, analýza klouzání a testování palivové účinnosti. Rezervujte si termín testu v nádrži ještě dnes.

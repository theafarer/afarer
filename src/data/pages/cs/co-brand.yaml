features:
  title: 'Co co-branding u Afarer znamená'
  subtitle: 'Co-branding je náš program designového partnerství — postavený na značce Afarer, ochraně teritoria a limitovaných kolekcích, nikoli na výrobě bez značky.'
  columns: 3
  items:
    - title: 'Produkty Afarer zůstávají produkty Afarer'
      description: 'Kolekce co-brand je limitovaná edice prken Afarer s vaší identitou. Nikdy bez značky, nikdy značka třetí strany a nikdy otevřený program private label.'
      icon: 'tabler:trademark'
    - title: 'Designováno s vámi'
      description: 'Vaše barvy, naming a příběh formují kolekci. Náš tým designu a konstrukce se stará o paluby, grafiku, obaly a dokumentaci od briefu po dodání.'
      icon: 'tabler:pencil'
    - title: 'Pro kluby, resorty, akce a komunity'
      description: 'Flotilové kolekce pro paddle kluby a resorty, edice pro závody a komunitní série — všechny s kvalitou a zárukou Afarer.'
      icon: 'tabler:users'
    - title: 'Chrání partnery v zemích'
      description: 'Co-branding běží vedle našeho modelu jedna země, jeden distributor. Národní partneři si udržují své teritorium; kolekce co-brand neotevírají dveře paralelním značkám na jejich trhu.'
      icon: 'tabler:shield-check'
    - title: 'Inženýrství a standardy kvality'
      description: 'Každá kolekce odjíždí z naší certifikované dodavatelské řetězce s dokumentací CE a ISO 9001, testy na tlak a stejnými kontrolami QC jako naše hlavní řada.'
      icon: 'tabler:certificate'
    - title: 'Stává se aktivem značky'
      description: 'Limitovaná kolekce co-brand buduje váš vlastní příběh na vodě — marže z prodeje, mediální obsah a důvod, proč se pádlující vracejí sezónu za sezónou.'
      icon: 'tabler:star'

faqs:
  title: 'Co-Brand — FAQ'
  subtitle: 'Jak funguje co-branding Afarer a čím se liší od OEM a private label.'
  items:
    - title: 'Je co-branding totéž co OEM nebo private label?'
      description: 'Ne. Afarer už neprovozuje otevřený program OEM/private label. Produkty co-brand zůstávají produkty Afarer — designované, konstruované, kontrolované a kryté značkou Afarer. Vaše identita se objevuje jako co-brand, ne jako neznačkový produkt třetí strany.'
    - title: 'Kdo může zahájit projekt co-brand?'
      description: 'Kvalifikované podniky vodních sportů: stávající partneři v zemích, paddle kluby, resorty a hotely, pořadatelé akcí a komunity. Pošlete nám brief projektu a potvrdíme vhodnost před zahájením designu.'
    - title: 'Nebude co-branding kolidovat s mým distributorem v zemi?'
      description: 'Ne. Model jedna země, jeden distributor má přednost. Kolekce co-brand se koordinují s místním partnerem v zemi, pokud existuje, takže se v chráněném teritoriu neobjevuje žádná paralelní ani konkurenční značka.'
    - title: 'Jaká je minimální objednávka kolekce co-brand?'
      description: 'Pilotní kolekce začínají na 30–50 ks. Standardní kolekce jsou 50–100 ks; velké nebo multiregionální edice 100+ ks. Časové harmonogramy vlastního vývoje se dohodnou podle projektu.'
    - title: 'Co představuje kvalita Afarer a co přínos partnera?'
      description: 'Afarer vlastní design produktu, konstrukci, materiály, zpracování, QC a záruku. Partneři přispívají konceptem kolekce, namingem, barvami, grafikou a uvedením na trh. Tím zůstává na vodě jediný standard kvality.'
    - title: 'Jak se přihlásím?'
      description: 'Vyplňte co-brand formulář se svým podnikem, trhem a nápadem na kolekci. Zhodnotíme soulad a do 3 pracovních dnů odpovíme návrhem a Co-Brand Project Agreement.'

meta:
  title: Jak vybrat tloušťku SUP — inženýrská analýza | {SITE}
  description: 'Technický průvodce tloušťkou nafukovacích SUP prken: jak se prkna o tloušťce 4", 5" a 6" liší v tuhosti, hmotnosti, stabilitě, směrové stabilitě a výkonu. Doporučení tloušťky pro touring, jógu, surfování, závody a univerzální pádlování.'
back_text: Zpět na výzkum
hero:
  tagline: Inženýring
  title: Jak zvolit tloušťku SUP prkna – technická analýza
  subtitle: 6 min čtení
content_html: >
  <h2>Tři standardní tloušťky</h2>


  <h3>4" (10 cm) – Touring &amp; výkon</h3>

  <ul>
    <li>Nejvyšší tuhost – menší průhyb při zatížení</li>
    <li>Nejlehčí – méně materiálu, menší objem vzduchu</li>
    <li>Výborné držení směru – menší kývání ze strany na stranu</li>
    <li>Nejrychlejší – menší odpor, snadnější klouzání</li>
    <li>Nejlepší pro: touring, závodění, fitness pádlování, zkušené pádlery</li>
  </ul>


  <h3>5" (12.7 cm) – Univerzální</h3>

  <ul>
    <li>Dobrá tuhost – vyvážený poměr ohebnosti a tuhosti</li>
    <li>Střední hmotnost – standardní spotřeba materiálu</li>
    <li>Dobrá primární i sekundární stabilita</li>
    <li>Nejlepší pro: rekreační pádlování, začátečníky, běžné použití na jezerech a řekách</li>
  </ul>


  <h3>6" (15.2 cm) – Stabilita &amp; jóga</h3>

  <ul>
    <li>Nejvyšší primární stabilita – obrovský vztlak</li>
    <li>Nejtěžší – více PVC materiálu, větší objem vzduchu</li>
    <li>Nejpomalejší – větší odpor, obtížnější udržení klouzání</li>
    <li>Nejlepší pro: jógu a fitness, těžší jezdce (100+ kg), velmi rozbouřené podmínky</li>
  </ul>


  <h2>Technická analýza</h2>

  <p>Tuhost nafukovacího SUP je dána vnitřním tlakem vzduchu a momentem setrvačnosti příčného řezu prkna. Při 20 PSI vykazuje prkno o tloušťce 4" přibližně o 30 % menší průhyb při zatížení než prkno o tloušťce 6" stejné šířky a délky. Primární stabilita pramení ze šířky vodorysky a vztlaku;
  sekundární stabilitu ovlivňují tvar bočnic a šířka prkna.</p>


  <h2>Tloušťka podle hmotnosti jezdce</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Hmotnost jezdce</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Doporučená tloušťka</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Do 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" nebo 6"</td></tr>
      <tr><td class="p-3 border">Nad 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>Kompromis mezi tloušťkou a tlakem PSI</h2>

  <p>Častou mylnou představou je, že vyšší PSI může kompenzovat nadměrnou tloušťku. Při 25 PSI se prkno o tloušťce 6" prohýbá více než prkno o tloušťce 4" při 15 PSI, protože v rovnici tuhosti dominuje geometrický moment setrvačnosti. Pro výkonnostně orientované jezdce je tenčí prkno při nižším
  tlaku lepší než tlustší prkno při vyšším tlaku.</p>


  <h2>Modelová řada Afarer</h2>

  <ul>
    <li><strong>Prkna 4":</strong> řada Cheetah Touring – touringová SUP 12' x 30" x 4" pro fitness a dálkové pádlování</li>
    <li><strong>Prkna 5":</strong> řada Cheetah All-Round – 10'6" x 32" x 5" pro rekreační použití</li>
    <li><strong>Prkna 6":</strong> řada Cheetah Ultra-Stable – 10' x 34" x 6" pro jógu, větší jezdce a jako fotografické platformy</li>
  </ul>

  <p>Všechna prkna využívají drop-stitch jádra 1,680 DTEX s jmenovitým tlakem 20 PSI a PVC lamináty o tloušťce 1.2 mm.</p>

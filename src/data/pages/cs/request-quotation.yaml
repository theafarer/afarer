hero_text:
  tagline: Vyžádat cenovou nabídku
  title: Požádat o cenovou nabídku<br />pro váš projekt
  subtitle: Sdělte nám své požadavky a náš tým vám odpoví podrobnou cenovou nabídkou do 2 pracovních dnů.
steps2_process:
  title: Jak to funguje
  subtitle: Čtyři jednoduché kroky od poptávky k cenové nabídce.
  items:
    - title: 'Krok 1: Zašlete své požadavky'
      description: Vyplňte formulář níže s typem produktu, množstvím a specifikacemi. Čím více podrobností poskytnete, tím přesnější bude vaše cenová nabídka.
      icon: tabler:file-text
    - title: 'Krok 2: Posoudíme a poradíme'
      description: Náš inženýrský tým zkontroluje vaše požadavky a může vás kontaktovat pro upřesnění. Poskytujeme doporučení ohledně konfigurace produktu a možností.
      icon: tabler:users
    - title: 'Krok 3: Obdržíte svou nabídku'
      description: Obdržíte podrobnou cenovou nabídku včetně jednotkových cen, MOQ, dodacích lhůt, platebních podmínek a možností dopravy. Obvykle do 48 hodin.
      icon: tabler:currency-dollar
    - title: 'Krok 4: Vzorek a výroba'
      description: Po přijetí cenové nabídky přejdeme k výrobě vzorků (je-li to relevantní) nebo přímo k sériové výrobě. Pravidelné aktualizace v průběhu celého procesu.
      icon: tabler:building-factory
content_form:
  tagline: Formulář pro poptávku
  title: Řekněte nám o svém projektu
  subtitle: Všechna pole označená * jsou povinná.
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Potápěčské centrum
        - Rybaření
        - Námořní turistika / Resort
        - Pátrání a záchrana
        - Tender pro jachty
        - Komerční pracovní člun
        - Státní sektor / armáda
        - OEM / privátní značka
        - Osobní / rekreační
        - Jiné
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      options:
        - Bez preference
        - PVC námořní kvality (1100 dtex)
        - Prémiový hypalon / CSM
        - Trup ze sklolaminátu
        - Hliníkový trup
    - name: Engine Requirement
      type: text
      placeholder: např. přívěsný motor 60 HP, bez motoru, dva motory 115 HP
    - name: Customization Required
      type: text
      placeholder: např. vlastní barvy, branding/logo, balení, speciální kování
    - name: Timeline
      type: text
      placeholder: např. dodání do 90 dnů
    - name: Additional Requirements
      type: textarea
      placeholder: Popište své použití, technické specifikace nebo případné zvláštní požadavky — pokud máte k dispozici referenční výkresy, specifikace nebo odkazy, přiložte je
    - name: Upload Specification
      type: file
      placeholder: Nahrajte svůj technický list, výkres nebo referenční dokument (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Nahrajte své logo nebo grafiku pro vlastní branding (AI, EPS, PNG)
cta:
  title: Dáváte přednost e-mailové komunikaci?
  subtitle: Pošlete svůj dotaz přímo našemu obchodnímu týmu a odpovíme do 24 hodin.
  actions:
    - variant: primary
      text: Napište nám e-mail přímo
      href: /contact

  title: afarer —Inženýrství svobody na vodě
  subtitle: 'Od pobřežní dílny ke globálnímu výrobci lodí —naše cesta stojí na neochvějném přesvědčení: plavidla by měla být navrhována s péčí, protože na tom záleží.'

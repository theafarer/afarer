timeline:
  - year: '2012'
    title: Založení námořní výroby
    body: afarer začal jako specializovaná dílna na výrobu nafukovacích člunů v Qingdao v Číně, zaměřená na lodní řemeslo a výrobu nafukovacích plavidel. Počáteční důraz byl kladen na stavbu spolehlivých nafukovacích produktů díky praktickým inženýrským zkušenostem a výrobní disciplíně.
  - year: '2015'
    title: První export a certifikace CE
    body: První exportní objednávky směřovaly do Japonska a Koreje. Byla získána certifikace CE pro hlavní produktové řady, což znamenalo vstup afarer na mezinárodní trhy. Společnost začala obsluhovat komerční i rekreační zákazníky mimo Čínu.
  - year: '2018'
    title: Rozšíření továrny
    body: Přesun do výrobního závodu o rozloze 12 000 m². Byly přidány linky RF svařování a výrobní kapacity drop-stitch, což umožnilo výrobu ve větším měřítku a zlepšené systémy kontroly kvality.
  - year: '2020'
    title: Založení vývojového centra
    body: Otevřeno specializované výzkumné a vývojové centrum s laboratoří PVC tkanin, hydrodynamickým testovacím bazénem a simulačním studiem CAD/FEA. Vývoj produktů se rozšířil směrem k lehkým konstrukcím, lepší odolnosti a designu zaměřenému na uživatele.
  - year: '2022'
    title: Certifikace a globální růst
    body: Získána certifikace ISO 9001. Tým rozšířen na 14 vývojových inženýrů a více než 200 pracovníků. Produkty začaly oslovovat zákazníky v Evropě, Americe a asijsko-pacifickém regionu prostřednictvím distributorských a OEM partnerství.
  - year: '2024'
    title: Inovační a designové studio
    body: Spuštěno studio designu a inovací v plném rozsahu pro vlastní ODM projekty —od konceptu po výrobu. Posíleny profesionální námořní aplikace včetně záchranářských, komerčních a vládních zakázek.
  - year: '2026'
    title: Budování budoucnosti průzkumu vod
    body: Dnes afarer pokračuje ve vývoji nafukovacích člunů, SUP systémů a vlastních námořních řešení —propojuje lidi a organizace s vodami světa. Obslouženo 50+ zemí, roční kapacita přes 15 000 jednotek.
content_founding:
  tagline: Začátek
  title: Zrozeni na vodě
  subtitle: 'afarer začal v pobřežní dílně v Qingdao s jedním člunem a vizí: stavět nafukovací plavidla schopná zvládnout reálné námořní podmínky.'
  paragraphs:
    - V roce 2012 naši zakladatelé zaznamenali mezeru na trhu —většina nafukovacích člunů byla buď cenově dostupná, ale nespolehlivá, nebo kvalitní, ale prohibitivně drahá. Věřili, že je prostor pro výrobce, který nabídne jak kvalitu, tak hodnotu.
    - První trup byl postaven ručně, testován v místních vodách a vylepšen na základě zpětné vazby od rybářů a malých komerčních provozovatelů. Tato zpětná vazba —postavit, otestovat, naslouchat, zlepšit —zůstává jádrem naší inženýrské filozofie dodnes.
    - Do roku 2015 se zpráva rozšířila za hranice Qingdao. Mezinárodní distributoři začali žádat o vzorky. To, co začalo jako místní dílna, se stávalo globálním dodavatelem.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Raná výrobní dílna afarer a výrobní proces
content_growth:
  tagline: Růst a inovace
  title: Od dílny k závodu o rozloze 12 000 m²
  subtitle: Neustálé investice do lidí, vybavení a procesů proměnily afarer v moderní námořní výrobní závod.
  paragraphs:
    - S rostoucí poptávkou rostl i náš závod. Rozšířili jsme se z malé dílny na továrnu o rozloze 12 000 m² s dedikovanými výrobními linkami pro SUP čluny, nafukovací čluny, SUP prkna a příslušenství.
    - Investovali jsme do CNC řezacích strojů, vysokofrekvenčního svařovacího zařízení, drop-stitch výrobních linek a komplexních testovacích rámů —což nám umožňuje kontrolovat každý aspekt kvality výroby.
    - Dnes náš tým více než 200 lidí zahrnuje námořní inženýry, materiálové vědce, specialisty na kontrolu kvality a kvalifikované řemeslníky —mnozí z nich jsou s afarer od samého počátku.
philosophy:
  tagline: Firemní filozofie
  title: Inženýrství svobody na vodě
  body: Svoboda na vodě není jen o pohybu. Představuje objevování nových míst, vytváření zážitků v přírodě, propojování lidí s přírodou a umožnění profesionálních misí. Inženýrství činí tuto svobodu možnou.
  pillars:
    - title: Spolehlivost na prvním místě
      body: Vodní prostředí vyžaduje důvěru. Produkty afarer jsou navrženy s důrazem na stabilitu, odolnost, bezpečnost a konzistentní výkon.
    - title: Design zaměřený na člověka
      body: Produkty by měly sloužit lidem, ne technologiím. Každé konstrukční rozhodnutí začíná pochopením toho, jak lidé používají plavidla, kde objevují a s jakými výzvami se potýkají.
    - title: Dostupné objevování
      body: Voda by neměla patřit jen odborníkům. afarer vytváří vybavení, které umožňuje více lidem bezpečně zažít řeky, jezera, oceány a pobřežní prostředí.
    - title: Neustálé inovace
      body: Inovace není jen vytváření nových produktů. Je to zlepšování každého detailu —materiálů, konstrukcí, výroby a uživatelského zážitku.
engineeringDna:
  tagline: Inženýrské DNA
  title: Jak afarer vytváří produkty
  areas:
    - title: Materiálová věda
      body: afarer se zaměřuje na výběr vhodných materiálů pro různá námořní prostředí. Klíčové parametry zahrnují odolnost proti oděru, odolnost vůči UV záření, tlakovou stabilitu a dlouhodobou životnost.
      items:
        - Odolnost proti oděru
        - Odolnost vůči UV
        - Tlaková stabilita
        - Dlouhodobá životnost
    - title: Konstrukční inženýrství
      body: Nafukovací plavidla vyžadují přesnou rovnováhu mezi tuhostí, hmotností, přenosností a stabilitou. Inženýrství afarer se zaměřuje na optimalizaci těchto faktorů pomocí technologie drop-stitch a pokročilých metod spojování švů.
      items:
        - Tuhost
        - Optimalizace hmotnosti
        - Přenosnost
        - Stabilita
    - title: Výrobní přesnost
      body: 'Každý produkt prochází kontrolovanými procesy: příprava materiálu, přesné řezání, svařování a lepení, montáž, kontrola kvality a ověření výkonu.'
      items:
        - Příprava materiálu
        - Přesné řezání
        - Svařování a lepení
        - Montáž a kontrola
    - title: Inženýrství uživatelských scénářů
      body: Produkty jsou vyvíjeny pro reálná použití —rekreaci, dobrodružství a profesionální využití —což zajišťuje, že každý design splňuje specifické požadavky svého cílového prostředí.
      items:
        - Rekreace
        - Dobrodružství
        - Profesionální
        - Komerční
trustSignals:
  tagline: Signály důvěry
  title: Proč je afarer spolehlivým partnerem
  manufacturing:
    title: Výrobní kapacita
    body: Výrobní závod o rozloze 12 000 m² s více než 200 kvalifikovanými pracovníky a 14+ vývojovými inženýry. Certifikovaný systém řízení kvality ISO 9001. Roční produkce přes 15 000 nafukovacích plavidel obsluhujících 50+ zemí.
    stats:
      - label: Velikost závodu
        value: 12 000 m²
      - label: Pracovní síla
        value: 200+
      - label: Vývojoví inženýři
        value: 14+
      - label: Roční kapacita
        value: 15 000+
  quality:
    title: Závazek kvality
    body: Od kontroly materiálů až po finální testování afarer udržuje systematické procesy kvality pro dodávání spolehlivých námořních produktů. Každá jednotka prochází tlakovou zkouškou, kontrolou švů a ověřením výkonu před odesláním.
    items:
      - CE Certified —Všechny produkty splňují evropské bezpečnostní normy
      - ISO 9001:2015 —Certifikovaný systém řízení kvality
      - UKCA Marked —Shoda s trhem Spojeného království
      - FCC Compliant —Soulad s americkými předpisy pro elektronické součástky
  global:
    title: Globální přítomnost
    body: afarer obsluhuje zákazníky na mnoha globálních trzích a podporuje distributory, outdoorové značky a profesionální námořní uživatele v 50+ zemích Evropy, asijsko-pacifického regionu, Ameriky, Blízkého východu a Afriky.

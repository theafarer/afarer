hero:
  tagline: Průvodci
  title: Jste v SUP nováčkem?
  subtitle: Praktické průvodce, které vám pomohou vybrat, používat a vychutnat si nafukovací SUP prkna.
size_guide:
  tagline: Rozměry a specifikace
  title: Najděte správnou velikost pro vaše potřeby
  desc: Porovnejte rozměry prken SUP, nosnost a doporučené využití. Ať potřebujete touringové SUP, prkno na jógu nebo univerzální SUP — náš průvodce velikostmi vám pomůže vybrat ten správný model.
  link_label: Kompletní velikostní průvodce se specifikacemi produktů →
  link: /size-guide
  cards:
    - title: SUP prkna
      desc: Délku zvolte podle své hmotnosti a zamýšleného použití. Širší prkna (32"+) nabízejí vyšší stabilitu. Delší prkna (11—2 ft) lépe drží směr při výletech.
    - title: Touring SUP prkna
      desc: Delší desky (11—2 ft) pro zdolávání vzdáleností a přímou jízdu. Dostatečně stabilní pro touring s vybavením. Vždy zkontrolujte nosnost.
    - title: Univerzální SUP prkna
      desc: Délku volte podle hmotnosti jezdce a účelu použití. Širší prkna (32"+) zaručí stabilitu. Všestranné pro rekreaci i fitness.

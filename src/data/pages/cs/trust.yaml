features3_certifications:
  title: Certifikace a soulad s předpisy
  subtitle: Každý produkt je nezávisle testován a certifikován podle mezinárodních standardů.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE certifikace
      description: Všechny SUP, kajaky, SUP a RIBy afarer splňují evropský bezpečnostní standard CE pro rekreační plavidla. Každý produkt prochází tlakovou, vztlakovou a zátěžovou zkouškou před opuštěním továrny.
      icon: tabler:certificate
    - title: BSCI
      description: Náš závod 12 000 m² v Qingdao funguje pod  systémem řízení kvality. Každá výrobní dávka je dohledatelná, zdokumentovaná a zkontrolovaná.
      icon: tabler:clipboard-check
    - title: BSCI sociální soulad
      description: Jsme BSCI certifikováni, což zajišťuje etické pracovní postupy, bezpečné pracovní podmínky a environmentální odpovědnost v celém našem dodavatelském řetězci.
      icon: tabler:users
    - title: REACH & RoHS
      description: Všechny materiály —PVC, Hypalon, EVA pěna, lepidla —splňují předpisy EU REACH a RoHS. Žádné omezené látky, žádné kompromisy.
      icon: tabler:flask
    - title: Materiálová testovací laboratoř
      description: Interní materiálová laboratoř testuje pevnost v tahu, UV odolnost, integritu švů a odolnost proti oděru pro každou dávku tkaniny před výrobou.
      icon: tabler:microscope
    - title: 2letá záruka
      description: Každý produkt afarer je dodáván s dvouletou zárukou na výrobní vady. Stojíme si za tím, co stavíme.
      icon: tabler:shield-check
testimonials:
  tagline: Důvěra zákazníků
  title: Co říkají naši zákazníci
  subtitle: Od začínajících pádlujících po profesionální operátory flotil —podívejte se, proč důvěřují afarer.
  items:
    - content: Vybavili jsme celou naši půjčovnu RIBy afarer. Po dvou sezónách nula selhání. CE certifikace udělala schválení pojištěním bezproblémové.
      name: Marco V.
      title: Provozovatel zájezdů, Chorvatsko
    - content: Jako prvoodběratel jsem byl nervózní ohledně kvality. ISO dokumentace a zkušební zprávy, které sdíleli, mi daly naprostou důvěru.
      name: James T.
      title: Majitel SUP Explorer 11, Kanada
    - content: Spolupracujeme s afarer pro naše pobřežní hlídkové jednotky. Jejich QC proces je konzistentní napříč každou dávkou —tato spolehlivost záleží při misích kritických pro provoz.
      name: Lt. Cmdr. Andres
      title: Námořní nákupčí, Filipíny
steps2_manufacturing:
  title: Jak zajišťujeme kvalitu
  subtitle: Od kontroly surovin po finální tlakové testování —každý produkt prochází přísným kvalitativním řetězcem.
  items:
    - title: Kontrola surovin
      description: Každá role PVC tkaniny je testována na tloušťku, pevnost v tahu a UV odolnost před vstupem do výroby.
      icon: tabler:search
    - title: Průběžná kontrola kvality
      description: Svarové švy, instalace ventilů a spoje komor jsou kontrolovány na každém stanovišti během montáže.
      icon: tabler:eye
    - title: Tlakové testování
      description: Každý nafukovací produkt je nafouknut na 1,5násobek jmenovitého PSI a držen po dobu 24 hodin pro ověření retence vzduchu a integrity švů.
      icon: tabler:wind
    - title: Finální inspekce
      description: Každá jednotka je zkontrolována na povrchovou úpravu, hardware a balení před schválením k odeslání. Vzorky z dávek jdou do laboratoře na destruktivní testování.
      icon: tabler:clipboard-check

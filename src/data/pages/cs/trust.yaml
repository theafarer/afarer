warranty_section:
  title: Záruka a poprodejní podpora
  subtitle: Za každým výrobkem stojíme — s jasnými záručními podmínkami, rychlým vyřízením reklamací a originálními náhradními díly.
  items:
    - title: 2letá záruka na výrobek
      desc: Všechny produkty afarer mají dvouletou záruku na výrobní vady – rozpad švů, vady ventilů a delaminaci materiálu při běžném používání.
    - title: Doživotní podpora náhradních dílů
      desc: Originální náhradní díly — ventily, opravné sady, ploutve, D-kroužky — dostupné pro všechny modely. Formy a nástroje udržujeme nejméně 5 let po ukončení výroby.
    - title: Vyřízení reklamací do 48 hodin
      desc: Reklamace v záruční době potvrzujeme do 48 hodin. Náhradní prkna odesíláme do 10 pracovních dnů u schválených reklamací.
    - title: Celosvětová síť oprav
      desc: Autorizovaná servisní střediska ve více než 15 zemích. Opravné sady do terénu pro vzdálené provozy. DIY návody na opravu drobných poškození.
    - title: Podpora zákazníků OEM
      desc: Dedikovaní account manažeři pro partnery B2B. Čtvrtletní obchodní přehledy, plánování zásob a podpora co-brandingového marketingu.
    - title: Balíček certifikací
      desc: Kompletní dokumentace shody dodávaná s každou zásilkou – prohlášení CE, zkušební protokoly, bezpečnostní listy materiálů.
      link: /contact

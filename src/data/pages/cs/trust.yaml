warranty_section:
  title: Warranty & After-Sales Support
  subtitle: We stand behind every product with clear warranty terms, fast claims processing, and genuine replacement parts.
  items:
    - title: 2-Year Product Warranty
      desc: All afarer products carry a 2-year warranty against manufacturing defects — seam failure, valve defects, and material delamination under normal use.
    - title: Lifetime Parts Support
      desc: Genuine replacement parts — valves, repair kits, fins, D-rings — available for all models. We maintain moulds and tooling for a minimum of 5 years after production end.
    - title: 48-Hour Claim Response
      desc: Warranty claims acknowledged within 48 hours. Replacement boards shipped within 10 business days for approved claims.
    - title: Global Repair Network
      desc: Authorised repair centres in 15+ countries. Field repair kits available for remote operations. DIY repair guides for minor damage.
    - title: OEM Customer Support
      desc: Dedicated account managers for B2B partners. Quarterly business reviews, inventory planning, and co-branded marketing support.
    - title: Certification Package
      desc: Full compliance documentation provided with every shipment — CE Declaration, test reports, material safety data sheets.
      link: /contact

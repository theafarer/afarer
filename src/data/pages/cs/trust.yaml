      icon: 'tabler:clipboard-check'

faqs_rib:
  title: 'FAQ o SUP člunech'
  subtitle: 'Časté otázky o našich nafukovacích člunech s pevným trupem.'
  columns: 2
  items:
    - title: 'Jaké velikosti SUP člunů afarer nabízí?'
      description: 'Nabízíme 35 modelů SUP v rozmezí od 2,5 m do 7,6 m, pokrývající vše od kompaktních tenderů po těžké komerční a hlídkové čluny. Každý model je k dispozici s více možnostmi konfigurace.'
    - title: 'Jaký je rozdíl mezi SUP a tradičním nafukovacím člunem?'
      description: 'SUP (Rigid-Hull Inflatable Boat) kombinuje pevný sklolaminátový nebo hliníkový trup ve tvaru hlubokého V s nafukovacími Hypalon nebo PVC trubicemi. To poskytuje stabilitu a nosnost pevného člunu s absorpcí nárazů a vztlakem nafukovacího člunu.'
    - title: 'Jaké motory jsou kompatibilní s RIBy afarer?'
      description: 'Naše RIBy podporují přívěsné motory od 3 HP do 250 HP v závislosti na modelu. Každá stránka produktu uvádí maximální jmenovitý výkon motoru. Doporučujeme konzultovat s vaším prodejcem ideální kombinaci.'
    - title: 'Jsou RIBy afarer CE certifikovány?'
      description: 'Ano. Všechny rekreační modely SUP jsou CE certifikovány podle platných evropských standardů pro rekreační plavidla. Komerční a hlídkové modely splňují dodatečné požadavky na stabilitu a zatížení.'
    - title: 'Jaká je záruka na SUP čluny?'
      description: 'Všechny RIBy afarer jsou dodávány se standardní jednoletou zárukou na výrobní vady, pokrývající delaminaci trupu, selhání švů trubic, vady ventilů a problémy s hardwarem.'
    - title: 'Kolik vzduchových komor mají RIBy afarer?'
      description: 'Naše RIBy mají 3 až 7 nezávislých vzduchových komor v závislosti na délce modelu. Tento vícekomorový design zajišťuje, že člun zůstane na hladině i v případě narušení jednoho oddílu.'

faqs_inflatable:
  title: 'FAQ o nafukovacích člunech'
  subtitle: 'Časté otázky o našich nafukovacích SUP, kajacích a člunech.'
  columns: 2
  items:
    - title: 'Jaké materiály se používají v nafukovacích člunech afarer?'
      description: 'Používáme vojenské PVC (1100 denier) a prémiový Hypalon/CSM kaučuk, v závislosti na modelu. Oba materiály jsou UV-stabilizované, odolné proti oděru a vyhovují předpisům EU REACH a RoHS.'
    - title: 'Jak dlouho vydrží nafukovací čluny?'
      description: 'Při správné péči vydrží kvalitní PVC nafukovací člun 7—0 let, zatímco modely z Hypalonu mohou vydržet 15—0 let. Pravidelné čištění, UV ochrana a správné skladování výrazně prodlužují životnost.'
    - title: 'Jaká údržba je vyžadována pro nafukovací člun?'
      description: 'Základní údržba zahrnuje opláchnutí sladkou vodou po každém použití (zejména ve slané vodě), sušení před skladováním, každoroční kontrolu těsnění ventilů a aplikaci UV ochrany na trubice. Vyvarujte se dlouhodobému vystavení slunci, když se nepoužívá.'
    - title: 'Lze nafukovací čluny používat ve slané vodě?'
      description: 'Ano. Všechny nafukovací čluny afarer jsou navrženy pro použití ve sladké i slané vodě. Doporučujeme opláchnutí sladkou vodou a důkladné vysušení po expozici slané vodě, aby se zabránilo korozi armatur a krystalizaci soli v tkanině.'
    - title: 'Jak skladovat nafukovací člun?'
      description: 'Vypusťte vzduch, očistěte a zcela osušte člun před skladováním. Srolujte volně (vyvarujte se ostrých ohybů), skladujte na chladném suchém místě mimo přímé sluneční světlo a chraňte před betonovou podlahou, aby se zabránilo vlhkosti.'
    - title: 'Jaká je nosnost nafukovacích člunů afarer?'
      description: 'Nosnost se pohybuje od 290 kg pro naše nejmenší modely až po přes 2000 kg pro větší komerční plavidla. Každá stránka produktu uvádí maximální nosnost pro váš konkrétní model.'

faqs_sup:
  title: 'FAQ o SUP prknech'
  subtitle: 'Časté otázky o našich paddleboardech.'
  columns: 2
  items:
    - title: 'Jaké velikosti SUP prken jsou k dispozici?'
      description: 'Nabízíme SUP prkna od 9 stop do 12 stop, včetně univerzálních, touringových, jógových a speciálních designů. Naše nejprodávanější modely zahrnují Tropical Breeze (10 stop) a Ocean Voyager (11 stop).'
    - title: 'Co je drop-stitch konstrukce?'
      description: 'Drop-stitch konstrukce používá tisíce polyesterových nití spojujících horní a spodní vrstvu prkna, což umožňuje udržet vysoký tlak vzduchu (15—0 PSI) a dosáhnout tuhé, stabilní platformy. Toto je průmyslový standard pro prémiová nafukovací SUP.'
    - title: 'Jaký je hmotnostní limit pro SUP prkna?'
      description: 'Naše SUP prkna unesou až 150 kg v závislosti na modelu a objemu. Leviathan Wake je náš model s nejvyšší kapacitou, navržený pro větší jezdce a použití při józe.'
    - title: 'Nabízíte kompletní SUP balíčky?'
      description: 'Ano. Každé SUP prkno je dodáváno s kompletním balíčkem včetně třídílného hliníkového pádla, vysokotlaké ruční pumpy, spirálového vodítka, cestovního batohu a opravné sady. Některé modely také obsahují odnímatelnou sadu ploutví.'
    - title: 'Jaká je záruka na SUP prkna?'
      description: 'Všechna SUP prkna afarer nesou jednoletou záruku na výrobní vady, včetně selhání švů, defektů ventilů a delaminace materiálu při běžném používání.'
    - title: 'Jak dlouho trvá nafouknutí SUP prkna?'
      description: 'Při použití přiložené ruční pumpy trvá plné nafouknutí na 15 PSI přibližně 8—2 minut. Pro rychlejší nafouknutí doporučujeme naši elektrickou pumpu afarer 12V, která nafoukne prkno za méně než 4 minuty.'


faqs_sup:
  title: FAQ o SUP prknech
  subtitle: Časté otázky o našich paddleboardech.
  columns: 2
  items:
    - title: Jaké velikosti SUP prken jsou k dispozici?
      description: Nabízíme SUP prkna od 9 stop do 12 stop, včetně univerzálních, touringových, jógových a speciálních designů. Naše nejprodávanější modely zahrnují Tropical Breeze (10 stop) a Ocean Voyager (11 stop).
    - title: Co je drop-stitch konstrukce?
      description: Drop-stitch konstrukce používá tisíce polyesterových nití spojujících horní a spodní vrstvu prkna, což umožňuje udržet vysoký tlak vzduchu (15–20 PSI) a dosáhnout tuhé, stabilní platformy. Toto je průmyslový standard pro prémiová nafukovací SUP.
    - title: Jaký je hmotnostní limit pro SUP prkna?
      description: Naše SUP prkna unesou až 150 kg v závislosti na modelu a objemu. Leviathan Wake je náš model s nejvyšší kapacitou, navržený pro větší jezdce a použití při józe.
    - title: Nabízíte kompletní SUP balíčky?
      description: Ano. Každé SUP prkno je dodáváno s kompletním balíčkem včetně třídílného hliníkového pádla, vysokotlaké ruční pumpy, spirálového vodítka, cestovního batohu a opravné sady. Některé modely také obsahují odnímatelnou sadu ploutví.
    - title: Jaká je záruka na SUP prkna?
      description: Všechna SUP prkna afarer nesou jednoletou záruku na výrobní vady, včetně selhání švů, defektů ventilů a delaminace materiálu při běžném používání.
    - title: Jak dlouho trvá nafouknutí SUP prkna?
      description: Při použití přiložené ruční pumpy trvá plné nafouknutí na 15 PSI přibližně 8–12 minut. Pro rychlejší nafouknutí doporučujeme naši elektrickou pumpu afarer 12V, která nafoukne prkno za méně než 4 minuty.
faqs_materials:
  title: Časté dotazy k materiálům SUP a péči o ně
  subtitle: Časté dotazy o materiálech našich nafukovacích SUP, péči o ně a jejich skladování.
  columns: 2
  items:
    - title: Jaké materiály se používají u nafukovacích SUP prken afarer?
      description: Používáme PVC vojenské třídy (1100 denier) s konstrukcí stabilizovanou proti UV záření a odolnou proti oděru, v souladu s nařízeními EU REACH a RoHS.
    - title: Jak dlouho vydrží nafukovací SUP prkna?
      description: Při správné péči vydrží kvalitní nafukovací SUP z PVC 5–10 let. Pravidelné čištění, ochrana před UV zářením a správné skladování výrazně prodlouží životnost.
    - title: Jakou údržbu vyžaduje nafukovací SUP?
      description: Základní údržba zahrnuje opláchnutí sladkou vodou po každém použití (zejména ve slané vodě), osušení před uskladněním, každoroční kontrolu těsnění ventilů a vyhýbání se dlouhodobému vystavení slunci, když prkno nepoužíváte.
    - title: Lze nafukovací prkna SUP používat ve slané vodě?
      description: Ano. Všechna nafukovací SUP prkna afarer jsou navržena pro použití ve sladké i slané vodě. Po pobytu ve slané vodě doporučujeme opláchnout je sladkou vodou a důkladně vysušit.
    - title: Jak skladovat nafukovací SUP?
      description: Před uskladněním prkno zcela vyfoukněte, očistěte a osušte. Srolujte ho volně (vyhněte se ostrým přehybům), skladujte na chladném a suchém místě mimo přímé sluneční světlo a nepokládejte na betonovou podlahu, aby nedocházelo ke vzlínání vlhkosti.
    - title: Jaká je nosnost nafukovacích SUP prken afarer?
      description: Nosnost se pohybuje od 100 kg u našich nejmenších modelů až po více než 200 kg u větších desek. Každá produktová stránka uvádí maximální povolené zatížení pro váš konkrétní model.

oem_section:
  tagline: Uveďte svou značku na trh
  title: Od nápadu na trh za 16 týdnů
  subtitle: Váš kompletní partner pro uvedení SUP značky na trh — návrh, prototyp, výroba a expedice.
  steps:
    - number: '01'
      title: Nápad a zadání
      desc: Sdílejte svou vizi, cílový trh a specifikace.
    - number: '02'
      title: Design a inženýrství
      desc: 3D modelování, výběr materiálů a návrh vlastní grafiky.
    - number: '03'
      title: Prototypování a validace
      desc: Výroba vzorků s certifikací CE a testováním kvality.
    - number: '04'
      title: Sériová výroba
      desc: Sériová výroba se zabudovanou kontrolou kvality (QC) a podporou továrních auditů.
    - number: '05'
      title: Celosvětová doprava
      desc: Logistika FOB Qingdao, CIF hlavní přístavy, dodání až ke dveřím.
  cta: Zahajte cestu své značky
  cta_link: /oem-odm-manufacturer

distributor:
  tagline: Exkluzivní zemští distributoři
  title: Jedna země. Jeden oficiální distributor Afarer.
  subtitle: Program jeden stát – jeden distributor s územní exkluzivitou, dealerskými cenami, marketingovou podporou a vyhrazeným Distributor Success Program.
  benefits:
    - title: Územní exkluzivita
      description: Jeden autorizovaný distributor pro každou zemi nebo region — žádná vnitřní konkurence, žádný kanálový konflikt.
    - title: Marže přímo z továrny
      description: Distributorské ceníky a roční rabaty za závazné objemy, doprava FOB Čching-tao.
    - title: Marketingová a školicí podpora
      description: Co-branded materiály, POS materiály pro dealery, produktové školení a launch kampaně.
    - title: Vyhrazený tým pro účty
      description: Osobní distributor manager plus podpora onboardingu, prognóz a opakovaných objednávek.
  actions:
    - variant: primary
      text: Staňte se distributorem
      href: /distributor-program
    - text: Vyžádat dealerský ceník
      href: /contact?subject=Dealer Price List
    - text: Požádat o partnerskou zemi
      href: /contact?subject=Country Partnership Application
    - text: Stáhnout distribuční program
      href: /distributor-program
  note: Vzorkové objednávky 5–10 kusů. Zkušební objednávky 10–30. Autorizovaný dealer 30–50. Zemský/regionální distributor 100–300+.

  description: 'Afarer navrhuje výkonná nafukovací SUP prkna pro otevřenou vodu, túry, jógu a dobrodružství. Tuhost drop-stitch, tlakově testováno prkno po prkně, s exkluzivními partnerskými zeměmi a limitovanými co-branded kolekcemi. Prozkoumejte kolekci.'

workshops:
  - title: Výroba SUP prken
    description: '4 paralelní montážní linky na nafukovací SUP prkna. Každá linka vyrobí 50–80 prken za směnu. Stanice digitálního a sítotiskového tisku pracují souběžně. Roční kapacita SUP: 8,000+ prken.'
    output: 8,000+ SUP/rok
  - title: SUP Boat Production
    description: 'Dedikovaná dílna na sklolaminátové trupy se 6 formovacími stanicemi pro SUP trupy do 7,6 m. Oblast svařování a montáže trubek zpracovává 3–6 SUP současně. Roční kapacita SUP: 2 000+ člunů.'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'Víceúčelové výrobní linky pro nafukovací čluny, kajaky a SUP. Stanice horkovzdušného svařování, RF dielektrické lisy a montážní pracoviště jsou překonfigurovány podle mixu objednávek. Roční kapacita: 5 000+ jednotek.'
    output: 5 000+ kusů ročně
  - title: Bezpečnostní vybavení
    description: 'Samostatná čistá výrobní oblast pro záchranné vesty a bezpečnostní vybavení. Dělená stanoviště šití, vkládání pěny a testování. Roční kapacita záchranných vest: 50 000+ jednotek.'
    output: 50 000+ záchranných vest ročně

workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50—0 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: SUP Boat Production
    description: 'Dedikovaná dílna na sklolaminátové trupy se 6 formovacími stanicemi pro SUP trupy do 7,6 m. Oblast svařování a montáže trubek zpracovává 3— SUP současně. Roční kapacita SUP: 2 000+ člunů.'
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & SUP
    description: 'Víceúčelové výrobní linky pro nafukovací čluny, kajaky a SUP. Stanice horkovzdušného svařování, RF dielektrické lisy a montážní pracoviště jsou překonfigurovány podle mixu objednávek. Roční kapacita: 5 000+ jednotek.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'Samostatná čistá výrobní oblast pro záchranné vesty a bezpečnostní vybavení. Dělená stanoviště šití, vkládání pěny a testování. Roční kapacita záchranných vest: 50 000+ jednotek.'
    output: '50,000+ life vests/year'


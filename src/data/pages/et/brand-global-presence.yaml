meta:
  title: 'Globaalne kohalolek — supilaudade tootja, kes teenindab üle 50 riigi | {SITE}'
  description: 'afarer ekspordib täispuhutavaid SUP-e üle 50 riiki igal kontinendil. Professionaalne tootja ja tarnija kaubamärkidele, jaotajatele ja laevastikele.'

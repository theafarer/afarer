features3_markets:
  tagline: 'Peamised turud'
  title: 'Piirkonnaekspertiis<br />kohalikele nõuetele'
  subtitle: 'Me mõistame, et erinevatel turgudel on erinevad regulatoorsed nõuded, eelistused ja kasutusjuhtumid.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Euroopa ja Ühendkuningriik'
      description: 'CE-sertifitseeritud tooted. Tugev nõudlus supilaudade järele ELi turgudel. Ühendkuningriigi jaotajad hindavad meie kiiret läbimõtet.'
      icon: tabler:map-pin
    - title: 'Põhja-Ameerika'
      description: 'USA rannavalve heakskiidetud tootmine. USA ladu Montclairis, CA-s kiireks Lääneranniku tarneks. Kasvav nõudlus kalastus-, pääste- ja vabaaja-SUP-ide järele.'
      icon: tabler:map-pin
    - title: 'Austraalia ja Okeaania'
      description: 'Tugev turg supilaudadele ja vesisporditarvikutele. Austraalia jaotajad hindavad meie UV-kindlat PVC-konstruktsiooni karmis päikeses. Kiire saatmine meie Aasia rajatisest.'
      icon: tabler:map-pin
    - title: 'Lähis-Ida'
      description: 'Kasvav nõudlus vee-seiklusvarustuse järele. Meie äriklassi SUP-id ja ohutusvarustus on populaarsed tuurioperaatorite ja rendikeskuste seas. Kohandatud konfiguratsioonid kõrgete temperatuuridega keskkondadele.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Jaotusvõrgustik'
  title: 'Koostöö jaotajatega<br />üle kogu maailma'
  subtitle: 'Me töötame väljakujunenud merendusseadmete jaotajate, vesispordi kaubamärkide ja valitsushankeasutustega.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Kaasmärgiprogrammid'
      description: 'Eramärgitootmine globaalsetele vesispordi kaubamärkidele. Me haldame kõike alates disainist kuni tootmise ja otsetarneni.'
      icon: tabler:building
    - title: 'Jaotajate võrgustik'
      description: 'Volitatud jaotajad üle 20 riigi hoiavad lattu ja pakuvad kohalikku tuge. Uued jaotuspäringud on oodatud.'
      icon: tabler:users
    - title: 'Valitsus ja asutused'
      description: 'Otsetarne rannivalvele, otsingu- ja päästeorganisatsioonidele ning sõjalistele hankeprogrammidele. Vastavus asutuste hanke nõuetele.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Globaalne logistika ja tugi'
  subtitle: 'Tehasest sihtkohta — me haldame kogu tarneahelat.'
  items:
    - title: 'Veovalikud'
      description: 'Meretransport (FOB Qingdao), õhutransport kiireloomuliste tellimuste jaoks ja kiirkuller näidiste ja varuosade jaoks.'
      icon: tabler:truck-delivery
    - title: 'USA ladu'
      description: 'Lattu hoitud kaubad Montclairis, CA-s kiireks tarnimiseks üle Põhja-Ameerika. Läänerannik: 2-3 päeva, keskosa: 3-4 päeva, idarannik: 4-5 päeva.'
      icon: tabler:building-warehouse
    - title: 'Varuosad'
      description: 'Originaal afarer varuosad ja tarbekaubad laos aastaringselt. Levinud osad saadetakse 24 tunni jooksul.'
      icon: tabler:package
    - title: 'Tehniline tugi'
      description: 'Otseliin meie insenerimeeskonnani tehniliste küsimuste, remondinõu ja asendusosade toe jaoks. Me toetame laudu, mille ehitasime 20 aastat tagasi.'
      icon: tabler:headset
cta:
  title: 'Soovid jaotajaks saada?'
  subtitle: 'Me laiendame aktiivselt oma jaotusvõrgustikku. Võta ühendust meie eksportmeeskonnaga partnerlusvõimaluste arutamiseks.'
  actions:
    - variant: primary
      text: 'Partnerluse päring'
      href: /contact
    - text: 'Vaata meie tootevalikut'
      href: /products

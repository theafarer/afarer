hero:
  tagline: 'Globaalne kohalolek'
  title: 'Teenindame üle 50 riigi<br />igal kontinendil'
  subtitle: 'Alates Euroopa rannikupatrulli operaatoritest kuni Austraalia vesispordi jaotajate ja Lähis-Ida päästemeeskondadeni — afarer laudad on vees üle kogu maailma.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp

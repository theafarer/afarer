faqs:
  - question: 'Kas täispuhutaval SUP-il saab seista ja kalastada?'
    answer: 'Jah. Laiemad täispuhutavad SUP-id (33 tolli või rohkem) pakuvad piisavat stabiilsust seismiseks ja heitmiseks. Täispikkused EVA-tekikatted tagavad kindla seisu ka märjana.'
  - question: 'Kas täispuhutav SUP sobib kalastamiseks?'
    answer: 'Täispuhutavad SUP-id on suurepärased kalastusplatvormid, eriti madalavee- ja laguunikalastuseks. Laiad disainid võimaldavad kergelt ligi pääseda varustusele ja söötadele.'
  - question: 'Kui palju varustust saan täispuhutavale SUP-ile kaasa võtta?'
    answer: 'Enamik täispuhutavaid SUP-e kannab kokku 220-300 naela (sõitja pluss varustus). Tüüpiline kalastusvarustus söötade, jahutiga ja ohutusvahenditega lisab 20-40 naela. Kontrolli laua mahuhinnet, et tagada piisav kandevõime.'
body: |
  <h2>Miks kalastada täispuhutaval veesõidukil?</h2>
  <p>Täispuhutavad SUP-id pakuvad kaluritele ainulaadseid eeliseid, mida traditsioonilised paadid ei suuda pakkuda. Nende madal süvis võimaldab pääseda vetesse, kuhu mootorpaadid ei jõua, samas minimiseerib vaigne lähenemine kalade häirimist. Kaasaskantavus tähendab, et saad kalastada kaugel asuvates järvedes, jõgedes ja rannikualades ilma haagise või paadisildadeta.</p>
  <p>Peamised eelised:</p>
  <ul>
    <li><strong>Vaikus</strong> — Mootorimüra puudumine tähendab, et saad kaladele läheneda neid eemale ajamata</li>
    <li><strong>Madala vee ligipääs</strong> — Vaid mõne tolli süvis lubab kalastada soodes, ojades ja madalatel aladel</li>
    <li><strong>Kaasaskantavus</strong> — Paki oma veesõiduk kohtadesse, kuhu paadiga ei jõua</li>
    <li><strong>Seismisvõime</strong> — SUP-lauad võimaldavad seista, et vett paremini näha</li>
  </ul>

  <h2>Stabiilsusnõuded</h2>
  <p>Kalastamine nõuab stabiilset platvormi. Kalastamiseks täispuhutava veesõiduki valides eelista:</p>
  <ul>
    <li><strong>Laius</strong> — Laiemad laudad (33-36 tolli) pakuvad paremat stabiilsust seismiseks ja heitmiseks</li>
    <li><strong>Paksus</strong> — 6-tollised laudad pakuvad suuremat jäikust ja varustuse kandevõimet</li>
    <li><strong>Mahu</strong> — Suurem maht (300+ liitrit) kannab kaluri ja varustuse kogukaalu</li>
    <li><strong>Tekipind</strong> — Täispikkune EVA-vahttekikate tagab libisemiskindla pidamise ka märjana</li>
  </ul>

  <h2>Varustuse ühilduvus</h2>
  <p>Tüüpiline täispuhutav kalastusvarustus hõlmab:</p>
  <ul>
    <li><strong>Õngevardade hoidjad</strong> — Kinnitavad või tekile paigaldatud vardahoidjad kätevabaks sõudmiseks</li>
    <li><strong>Kast või jahuti</strong> — Kinnitatud tekile elastsete kinnitustega söötadele ja saagile</li>
    <li><strong>Ankrusüsteem</strong> — Kerge kokkupandav ankur või ventiili vars hoovusega kohal püsimiseks</li>
    <li><strong>Õnge rihm</strong> — Hoiab õnge küljes, kui mõlemad käed on kalastamiseks vajalikud</li>
    <li><strong>Isiklik päästevahend (PFD)</strong> — Hädavajalik ohutusvarustus kõigile kaluritele</li>
  </ul>

  <h2>Soovitatavad veesõidikutüübid kalastamiseks</h2>
  <p>Erinevad kalastusstsenaariumid sobivad erinevate tüübiga veesõidukitega:</p>

  <h3>Kalastamiseks mõeldud SUP-lauad</h3>
  <p>Parimad: madalaveekalastus, ahvenapüük järvedel, nägemispüük madalas vees. Kõrgem seisev asend tagab suurepärase nähtavuse. Stabiilsuse jaoks vali laiem turismi- või universaalne SUP.</p>

  <h3>Kalastamiseks mõeldud SUP-lauad</h3>
  <p>Parimad: mitmepersonaalilised kalastusreisid, raske varustuse vedamine ja kaitstud rannikuveed. SUP-id pakuvad tekiruumi ja kandevõimet, jäädes samas kaasaskantavaks.</p>

  <h2>Ohutuskaalutlused</h2>
  <ul>
    <li>Kanna alati päästevahendit — kalastamine hõlmab seismist, heitmist ja varustuse liigutamist, mis suurendavad kukkumisohtu</li>
    <li>Kontrolli ilmastiku- ja veetingimusi enne väljumist</li>
    <li>Võta kaasa vilet, telefon veekindlas ümbrises ja põhiline remondikomplekt</li>
    <li>Teavita kedagi oma kalastuskohast ja eeldatavast tagasituleku ajast</li>
  </ul>

  <h2>KKK</h2>
  <h3>Kas täispuhutaval SUP-il saab seista ja kalastada?</h3>
  <p>Jah. Laiemad täispuhutavad SUP-id (33 tolli või rohkem) pakuvad piisavat stabiilsust seismiseks ja heitmiseks. Täispikkused EVA-tekikatted tagavad kindla seisu ka märjana.</p>

  <h3>Kui palju varustust saan täispuhutavale SUP-ile kaasa võtta?</h3>
  <p>Enamik täispuhutavaid SUP-e kannab kokku 220-300 naela (sõitja pluss varustus). Tüüpiline kalastusvarustus söötade, jahutiga ja ohutusvahenditega lisab 20-40 naela. Kontrolli laua mahuhinnet, et tagada piisav kandevõime.</p>

faqs:
  title: 'Kaasmärk — KKK'
  subtitle: 'Kuidas afarer kaasmärgitootmine toimib ja kuidas see erineb OEM-ist ja eramärgist.'
  items:
    - title: 'Kas kaasmärgitootmine on sama mis OEM või eramärk?'
      description: 'Ei. afarer ei halda enam avatud OEM/eramärgi programmi. Kaasmärgi tooted jäävad afarer toodeteks — disainitud, inseneeritud, kvaliteedikontrollitud ja toetatud afarer kaubamärgi poolt. Sinu identiteet ilmub kaasmärgina, mitte kaubamärgita kolmanda osapoole tootena.'
    - title: 'Kes saab kaasmärgiprojekti alustada?'
      description: 'Kvalifitseerunud vesispordi ettevõtted: olemasolevad riigipartnerid, sõudeklubid, kuurordid ja hotellid, ürituste korraldajad ja kogukonnad. Saada meile projekti lühiülevaade ja me kinnitame vastavuse enne disainitöö algust.'
    - title: 'Kas kaasmärgitootmine läheb konflikti mu riigi jaotajaga?'
      description: 'Ei. Ühe riigi — ühe jaotaja mudelil on prioriteet. Kaasmärgikollektsioone koordineeritakse kohaliku riigipartneriga, kui selline on olemas, nii et kaitstud territooriumil ei ilmu paralleel- ega konkureeriv kaubamärk.'
    - title: 'Milline on kaasmärgikollektsiooni minimaalne tellimus?'
      description: 'Pilootkollektsioonid algavad 30–50 ühikust. Standardkollektsioonid on 50–100 ühikut; suured või multi-region väljaanded 100+ ühikut. Kohandatud arenduse ajakavad lepitakse kokku projektipõhiselt.'
    - title: 'Mis kuulub afarer kvaliteedi ja mis partneri sisendi alla?'
      description: 'afarer omab tootedisaini, inseneerimist, materjale, konstruktsiooni, kvaliteedikontrolli ja garantiit. Partnerid annavad kollektsiooni kontseptsiooni, nimetused, värvid, graafika sisendi ja turuletuleku. See hoiab vees ühe kvaliteedistandardi.'
    - title: 'Kuidas ma kandideerin?'
      description: 'Täida kaasmärgipäringu vorm koos oma ettevõtte, turu ja kollektsiooni ideega. Me vaatame sobivuse läbi ja vastame 3 tööpäeva jooksul ettepaneku ja kaasmärgiprojektide lepinguga.'

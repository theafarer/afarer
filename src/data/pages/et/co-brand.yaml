features:
  title: 'Mida tähendab kaasmärgitootmine afareri juures'
  subtitle: 'Kaasmärgitootmine on meie disainipartnerluse programm — üles ehitatud afarer kaubamärgi, territooriumikaitse ja piiratud kollektsioonide ümber, mitte kaubamärgita tootmisele.'
  columns: 3
  items:
    - title: 'afarer tooted jäävad afarer toodeteks'
      description: 'Kaasmärgikollektsioon on afarer lautade piiratud väljaanne sinu identiteediga. See ei ole kunagi kaubamärgita, kunagi kolmanda osapoole kaubamärk ja kunagi avatud eramärgiprogramm.'
      icon: 'tabler:trademark'
    - title: 'Disainitud koos sinuga'
      description: 'Sinu värvid, nimetused ja lugu kujundavad kollektsiooni. Meie disaini- ja insenerimeeskond haldab tekke, graafika, pakendi ja dokumentatsiooni lühiülevaatest tarneri.'
      icon: 'tabler:pencil'
    - title: 'Klubidele, kuurortidele, üritustele ja kogukondadele'
      description: 'Laevastikkollektsioonid sõudeklubidele ja kuurortidele, ürituseväljaanded võistlustele ja kogukonnasarjadele — kõik kandes afarer kvaliteeti ja garantiit.'
      icon: 'tabler:users'
    - title: 'Kaitseb riigipartnereid'
      description: 'Kaasmärgitootmine toimib kõrvuti meie ühe riigi — ühe jaotaja mudeliga. Riiklikud partnerid säilitavad oma territooriumi; kaasmärgikollektsioonid ei ava uksi paralleelsetele kaubamärkidele nende turul.'
      icon: 'tabler:shield-check'
    - title: 'Inseneerimis- ja kvaliteedistandardid'
      description: 'Iga kollektsioon saadetakse meie sertifitseeritud tarneahelast koos CE- ja ISO 9001 dokumentatsiooni, rõhutestimise ja samade kvaliteedikontrollpunktidega nagu meie põhivalikus.'
      icon: 'tabler:certificate'
    - title: 'Muutub kaubamärgi varaks'
      description: 'Piiratud kaasmärgikollektsioon rajab sinu enda loo vees — läbimüügimarginaal, meediasisu ja põhjus, miks sõudjad tulevad tagasi hooajast hooajani.'
      icon: 'tabler:star'

timeline:
  - year: '2012'
    title: 'Merendustootmise alus'
    body: 'afarer sai alguse spetsialiseeritud veesõidukite töökojana Qingdaos Hiinas, pühendunult merenduse käsitööle ja veesõidukite tootmisele. Varajane fookus oli usaldusväärsete täispuhutavate toodete ehitamine praktilise insenerikogemuse ja tootmisdistsipliini kaudu.'
  - year: '2015'
    title: 'Esimene eksport ja CE-sertifikaat'
    body: 'Esimesed eksporditellimused jõudsid Jaapanisse ja Koreasse. Tuumtootesarjad said CE-sertifikaadi, tähistades afarer sisenemist rahvusvahelistele turgudele. Ettevõte hakkas teenindama äri- ja vabaajakasutajaid väljaspool Hiinat.'
  - year: '2018'
    title: 'Tehase laienemine'
    body: 'Koliti 12,000 m² tootmishoonesse. Lisandusid RF-keevitusliinid ja Drop-Stitch tootmismaht, võimaldades suuremamahulist tootmist ja täiustatud kvaliteedikontrolli süsteeme.'
  - year: '2020'
    title: 'U&A-keskuse asutamine'
    body: 'Avati pühendatud U&A-keskus koos PVC-kangaslabori, hüdrodünaamilise katsetanki ja CAD/FEA simulatsioonistuudioga. Tootearendus laienes, keskendudes kergele konstruktsioonile, täiustatud vastupidavusele ja kasutajakesksele disainile.'
  - year: '2022'
    title: 'Sertifitseerimine ja globaalne kasv'
    body: 'Saavutati ISO 9001 sertifikaat. Laiendati 14 U&A-insenerini ja 200+ töötajani. Tooted jõudsid klientideni kogu Euroopas, Ameerikas ja Aasia ja Vaikse ookeani piirkonnas jaotus- ja kaasmärgi partnerluste kaudu.'
  - year: '2024'
    title: 'Innovatsiooni ja disaini stuudio'
    body: 'Käivitati täisteenust pakkuv disaini- ja innovatsioonistuudio kohandatud kaasmärgi projektidele, kontseptsioonist tootmiseni. Tugevdati professionaalseid merendusrakendusi, sealhulgas pääste-, äri- ja valitsuslepinguid.'
  - year: '2026'
    title: 'Ehitame vee avastamise tulevikku'
    body: 'Tänapäeval jätkab afarer SUP-süsteemide ja meretarvikute arendamist — ühendades inimesi ja organisatsioone maailma vetega. Teenindatud riike: 50+, aastane tootmismaht: 15,000+ ühikut.'

content_founding:
  tagline: 'Algus'
  title: 'Sündinud ranna ääres'
  subtitle: 'afarer sai alguse Qingdao rannikutöökojas ühe laua ja nägemusega: ehitada täispuhutavaid veesõidukeid, mis taluksid päris meretingimusi.'
  paragraphs:
    - '2012. aastal nägid meie asutajad turul lünka — enamik täispuhutavaid veesõidukeid oli kas taskukohased, kuid ebausaldusväärsed, või kvaliteetsed, kuid keelavalt kallid. Nad uskusid, et on ruumi tootjale, kes pakub nii kvaliteeti kui ka väärtust.'
    - 'Esimene kere ehitati käsitsi, testiti kohalikes vetes ja täiustati kalurite ja väikeste ärioperaatorite tegeliku tagasiside põhjal. See tagasisidetsükkel — ehita, testi, kuula, täiusta — on tänapäevalgi meie insenerifilosoofia tuum.'
    - '2015. aastaks oli sõna levinud väljapoole Qingdaod. Rahvusvahelised jaotajad hakkasid proove paluma. See, mis algas kohaliku töökojana, sai ülemaailmseks tarnijaks.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'afarer varajane tootmistöökoda ja tootmine'

content_growth:
  tagline: 'Kasv ja innovatsioon'
  title: 'Töökojast 12,000 m² tehaseks'
  subtitle: 'Pidev investeering inimestesse, seadmetesse ja protsessidesse on muutnud afarer kaasaegseks merendustootmise rajatiseks.'
  paragraphs:
    - 'Kuna nõudlus kasvas, kasvas ka meie rajatis. Laienesime väikesest töökojast 12,000 m² tehaseks, kus on pühendatud tootmisliinid supilaudadele ja tarvikutele.'
    - 'Investeerisime CNC-lõikuritesse, kõrgsageduskeevitusseadmetesse, Drop-Stitch tootmisliinidesse ja põhjalikesse katsestendidesse — see võimaldab meil kontrollida tootmiskvaliteedi iga aspekti.'
    - 'Tänapäeval kuulub meie 200+ liikmest meeskonda merainsenere, materjaliteadlasi, kvaliteedikontrolli spetsialiste ja oskuslikke käsitöölisi — paljud neist on olnud afareriga kaasas algaegadest saadik.'

philosophy:
  tagline: 'Kaubamärgi filosoofia'
  title: 'Vabaduse inseneerimine vees'
  body: 'Vabadus vees ei seisne ainult liikumises. See tähendab uute kohtade avastamist, väliskogemuste loomist, inimeste ühendamist loodusega ja professionaalsete missioonide võimaldamist. Inseneerimine teeb selle vabaduse võimalikuks.'
  pillars:
    - title: 'Usaldusväärsus esikohal'
      body: 'Vee keskkonnad nõuavad usaldust. afarer tooted on üles ehitatud stabiilsuse, vastupidavuse, ohutuse ja ühtlase jõudluse ümber.'
    - title: 'Inimesekeskne disain'
      body: 'Tooted peaksid teenima inimesi, mitte tehnoloogiat. Iga disainiotsus algab mõistmisest, kuidas inimesed veesõidukeid kasutavad, kus nad liiguvad ja milliste väljakutsetega nad silmitsi seisavad.'
    - title: 'Kättesaadav avastamine'
      body: 'Vesi ei tohiks kuuluda ainult ekspertidele. afarer loob varustust, mis võimaldab rohkematel inimestel ohutult kogeda jõgesid, järvi, ookeane ja rannikukeskkondi.'
    - title: 'Pidev innovatsioon'
      body: 'Innovatsioon ei ole ainult uute toodete loomine. See on iga detaili täiustamine — materjalid, konstruktsioonid, tootmine ja kasutajakogemus.'

engineeringDna:
  tagline: 'Inseneerimise DNA'
  title: 'Kuidas afarer tooteid loob'
  areas:
    - title: 'Materjaliteadus'
      body: 'afarer keskendub erinevatele merikeskkondadele sobivate materjalide valikule. Peamised kaalutlused hõlmavad kulumiskindlust, UV-kindlust, rõhustabiilsust ja pikaajalist vastupidavust.'
      items: ['Kulumiskindlus', 'UV-kindlus', 'Rõhustabiilsus', 'Pikaajaline vastupidavus']
    - title: 'Konstruktsiooniinseneerimine'
      body: 'Täispuhutavad veesõidukid nõuavad täpset tasakaalu jäikuse, kaalu, kaasaskantavuse ja stabiilsuse vahel. afarer inseneerimine keskendub nende tegurite optimeerimisele Drop-Stitch tuumtehnoloogia ja täiustatud õmbluskonstruktsiooni kaudu.'
      items: ['Jäikus', 'Kaaloptimeerimine', 'Kaasaskantavus', 'Stabiilsus']
    - title: 'Tootmise täpsus'
      body: 'Iga toode läbib kontrollitud protsessid: materjalide ettevalmistus, täpne lõikamine, keevitamine ja liimimine, koostamine, kvaliteediinspektsioon ning jõudluse verifitseerimine.'
      items:
        ['Materjalide ettevalmistus', 'Täpne lõikamine', 'Keevitamine ja liimimine', 'Koostamine ja kvaliteedikontroll']
    - title: 'Kasutusstsenaariumide inseneerimine'
      body: 'Tooteid arendatakse reaalsete rakenduste ümber — vabaaja, seiklus ja professionaalne kasutus — tagades, et iga disain vastab oma kavandatud keskkonna konkreetsetele nõudmistele.'
      items: ['Vabaaja', 'Seiklus', 'Professionaalne', 'Äri']


stories:
  tagline: 'Avastajate lood'
  title: 'Päris seiklused päris inimestelt'
  subtitle: 'Kuule sõudjatelt, peredelt ja professionaalidelt, kes kasutavad afarer varustust vees.'
  items:
    - name: 'Sarah ja Mike'
      title: 'SUP Explorer 11 omanikud, Kanada'
      content: 'Võtsime oma Explorer 11-ga nädala pikkusele reisile läbi Algonquini pargi. Nad talusid ülekandeid ja järvede ületusi suurepäraselt. Drop-Stitch konstruktsioon tähendas, et saime pumbata 15 PSI-ni ja saada kõva laua jõudluse pakkitavalt laualt.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Algonquini park, Kanada'
    - name: 'Carlos R.'
      title: 'Cheetah Surge sõitja, Hispaania'
      content: 'Cheetah Surge on mu ranniku-sõitude esimene valik. Elav disain pöörab rannas päid ja stabiilsus annab mulle kindlustunde kerges laines. See käitub suurepäraselt, olgu tegemist turismisõidu või lihtsalt päikeseloojangu nautimisega.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Hispaania'
    - name: 'Lina ja perekond'
      title: 'Flowing Lotus sõudjad, Rootsi'
      content: 'Nädalavahetuse pere-seiklused saarestikus. Flowing Lotus on piisavalt stabiilne, et mu tütar saaks seista, samal ajal kui mina sõuan. Pumbatakse üles umbes 10 minutiga — haagist pole vaja, ainult puhas pere-rõõm vees.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Stockholmi saarestik, Rootsi'
    - name: 'Lt. Cmdr. Andres'
      title: 'Ocean Voyager avastaja, Filipiinid'
      content: 'Kasutan oma Ocean Voyagerit pikkadeks ranniku-sõitudeks Palawani ümbruses. Pärast kuid kestnud igapäevast kasutamist troopilistes tingimustes töötab laud endiselt nagu uus. Turismikuju lõikab läbi laineist, mis peataks nõrgemad laudad.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palawan, Filipiinid'
    - name: 'Emma T.'
      title: 'Tropical Breeze esmakasutaja, Austraalia'
      content: 'Ma ei olnud varem SUP-il käinud. Tropical Breeze on nii stabiilne, et tundsin end esimesel katsel kindlana. Nüüd sõuan igal nädalavahetusel. Õppimiskõver on sisuliselt null — ja laud näeb vees hämmastav välja.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Austraalia'


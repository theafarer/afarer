features3_cases:
  tagline: 'Esile tõstetud juhtumid'
  title: 'Kohandatud lahendused<br />reaalsetele väljakutsetele'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Euroopa sukeldumiskeskuse laevastik'
      customer: 'BlueMed Diving Centers'
      country: 'Kreeka'
      industry: 'Sukeldumine ja mereturism'
      challenge: 'Vajati 12 sukeldumiskonfiguratsioonis SUP-i sukeldumiskeskuste ketile üle mitme Kreeka saare. Iga laud pidi omama kohandatud varustuse kinnitust, ladustamist 8 balloonile ja stabiilset platvormi avaveel sukeldujate sisseminekule. Laevastik pidi saabuma 60 päeva jooksul enne turismihooaja algust.'
      solution: 'Toodeti 12 SUP Voyager Dive mudelit integreeritud varustusrestide, stabiilsete platvormide ja eriti laia Drop-Stitch ehitusega pardale mineku stabiilsuse tagamiseks. Iga laud bränditi kliendi laevastiku välimusega. Kõik 12 lauda rõhutestiti ja saadeti Qingdaost 55 päeva jooksul.'
      product: 'SUP Voyager Dive'
      results: 'Kõik 12 lauda tarniti õigeaegselt turismihooajaks. Laevastik on olnud igapäevasel kasutusel 18+ kuud ilma materjaliriketeta. Klient tellis teisel aastal 6 täiendavat ühikut.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive on olnud meie igapäevaste sukeldumisoperatsioonide selgroog. Stabiilsus on suurepärane ja varustuse ladustus hoiab teki puhta ja ohutuna meie külalistele.'
      icon: tabler:lifebuoy
    - title: 'Austraalia levitaja kaasbrändi programm'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Austraalia'
      industry: 'Kaasbrändi ja partnerlusprogramm'
      challenge: 'Austraalia levitaja vajas eramärgisega SUP-laudade valikut konkurentsivõimelise hinnaga, et konkureerida Hiina otsetarnebrändidega. Vajati 8 unikaalset mudelit alates algajast kuni edasijõudnuni, koos kohandatud graafika, kohandatud pakendiga ja otsetarne täitmiseni jaemüügipunktidesse.'
      solution: 'Arendati 8 SUP-mudelit (universaalne, matka-, jooga-, laste-, spordi-, ultrakompaktne, ultrastabiilne, kärestik) eksklusiivse Austraalia graafikapaketiga. Kohandatud jaemüügipakend QR-koodidega, mis viivad seadistusvideotele. Otsetarne logistika seadistatud Qingdaost otse Austraalia jaemüügipoodidesse.'
      product: 'Kohandatud SUP-valik (8 mudelit)'
      results: 'Kontseptsioonist esimese saadetiseni 90 päevaga. Jaemüügi müügimäär 85% esimesel hooajal. Levitaja laiendas partnerlust täiendavate SUP-mudelitega teisel aastal.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer tarnis täieliku SUP-valiku 90 päevaga — esialgsest disainist jaemüügipõrandani. Kvaliteet vastab brändidele, kes müüvad kahekordse hinnaga.'
      icon: tabler:currency-dollar
    - title: 'Lähis-Ida päästevahendite tarnimine'
      customer: 'Riiklik Tsiviilkaitse Amet'
      country: 'Araabia Ühendemiraadid'
      industry: 'Otsing ja pääste'
      challenge: 'Kodanikukaitse organisatsioon vajis 20 patrull-valmis SUP-i ranniku otsingu- ja päästetöödeks, sadama turvalisuseks ja üleujutuste vastuseks. Nõuti kõrgelt nähtavaid laudu, täielikku ohutusvarustust ja vastavust kohalikele merereeglitele.'
      solution: 'Tarniti 20 SUP Patrol mudelit kõrgelt nähtava oranži Drop-Stitch ehitusega, täielike ohutuspakettide, SOLASI peegelteibi ja tugevdatud ehitusega. Iga laud oli CE-sertifitseeritud ja testitud vastavalt kehtivatele standarditele. Dokumentatsioonipakett sisaldas vastavussertifikaate kohalikuks registreerimiseks.'
      product: 'SUP Patrol'
      results: 'Laevastik paigaldati 5 rannikujaama. Laudu on kasutatud äärmuselises kuumuses (45°C+) ilma halvenemiseta. Jõudlus ja vastupidavus ületasid spetsifikatsioone.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol ületas meie operatsiooninõuded. Äärmuselises kuumuses ei näita laud UV-degradatsiooni märke 24 kuu igapäevasel kasutusel.'
      icon: tabler:alert-triangle
    - title: 'Euroopa kaasbrändi partnerlus'
      customer: 'North Sea Marine Equipment BV'
      country: 'Holland'
      industry: 'Kaasbrändi ja partnerlusprogramm'
      challenge: 'Asutatud Euroopa merebränd soovis laieneda SUP-i turule ilma tootmisüksustesse investeerimata. Vajati valge märgisega partnerit, kes suudab toota 5 SUP-mudelit (9–12 jalga) eramärgistuse, CE-sertifikaadi ja eksklusiivsete EL-i levitusõigustega.'
      solution: 'Sõlmiti valge märgisega tootmislepe 5 SUP-mudeli jaoks. Iga mudel bränditi kliendi logode ja värviskeemiga. CE-sertifitseerimise dokumentatsioon valmistati ette igale mudelile. Eksklusiivsed EL-i levitusõigused anti minimaalsete tellimuskohustustega. Tehniline dokumentatsioon anti kohaliku teenindusvõrgu jaoks.'
      product: 'Kohandatud SUP-valik (5 mudelit)'
      results: 'Allkirjastati mitmeaastane lepe. Esimene tootmispartii 50 ühikut saadeti 75 päevaga. Bränd esitleti suurel messil positiivse edasimüüjate vastuvõtuga.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Koostöö afarerga võimaldas meil siseneda SUP-i turule ilma tehas ehitamata — nad tarnisid täieliku valmislahenduse koos CE-sertifikaadi ja edasimüüjate toe dokumentatsiooniga.'
      icon: tabler:building
    - title: 'Kariibi mere kuurordi laevastik'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahama'
      industry: 'Mereturism ja külalislahkus'
      challenge: 'Luksuskuurort vajis täielikku veespordivarustuse laevastikku külaliste tegevusteks: 40 SUP-lauda giidituuride jaoks, 20 täiendavat SUP-i laguuni avastamiseks, 10 SUP-lauda külalistele ekskursioonideks, pluss tarvikud. Kogu varustus pidi omama kohandatud kuurordi bränditust ja saabuma enne turismihooaja tippu.'
      solution: 'Toodeti täielik SUP-pakett: 40 SUP Voyager lauda (universaalmudel), 20 SUP Explorer lauda, 10 SUP Touring lauda, pluss päästevestid, sõudmed, pumbad ja paranduskomplektid. Kogu varustus trükiti kuurordi logo ja troopilise värviskeemiga. Konteinervedu täieliku inventari manifestiga.'
      product: 'Täielik SUP-pakett (70+ ühikut)'
      results: 'Laevastik saabus 6 nädalat enne hooaja tippu. Külaliste rahulolu veespordi tegevustes tõusis 40% aasta-aastalt. Varustus on kestnud 3 hooaega ainult rutiinse hooldusega.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Täieliku paketi lähenemine tähendas, et saime kõik vajaliku ühes saadetises — lauad ja tarvikud kõik bränditud ja külaliste kasutuseks valmis. Meie külalistele meeldib varustuse kvaliteet.'
      icon: tabler:beach
    - title: 'USA rannikupatrulli leping'
      customer: 'Atlantic Coastal Security Agency'
      country: 'Ameerika Ühendriigid'
      industry: 'Merejulgeolek ja õiguskaitse'
      challenge: 'USA ranniku turvaagentuur nõudis vastupidavaid patrull-SUP-e avavee operatsioonideks. Vajati kõrge jõudlusega laudu sõjaväelise spetsifikatsiooniga varustuse ja USA rannavalve reeglitele vastavusega.'
      solution: 'Konstrueeriti SUP Patrol tugevdatud Drop-Stitch ehitusega, kõrgelt nähtavate värviskeemidega, krüpteeritud sidevahendite kinnituste ja integreeritud varustuse kinnituspunktidega. Laud tugevdati raskeveokite operatsioonideks. USCG vastavuse dokumentatsioon esitati.'
      product: 'SUP Patrol'
      results: 'Agentuur teatas 95% missiooni valmisolekust esimese 12 kuu jooksul. Täiendav tellimus 8 ühikule.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol annab meie meeskondadele avavee operatsioonideks vajaliku jõudluse. Tugevdatud ehitus tagab olulise vastupidavuse ohverdamata käideldavust.'
      icon: tabler:shield

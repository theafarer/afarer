hero:
  tagline: 'afarer kohandatud labor'
  title: 'Disaini oma<br />SUP-laud'
  subtitle: 'Kohandatud SUP-partner, kes pakub kaasbrändi, eramärgise ja tellistöö sõudelaudade tootmist ettevõtetele kogu maailmas. Üksikust prototüübist täistootmiseni.'
  cta: 'Alusta oma projekti'
  footer_link: /contact

steps_section:
  tagline: 'Kuidas see töötab'
  title: 'Kontseptsioonist tootmiseni'
  subtitle: 'Neli sammu teie ideest valmis, veepidava tooteni.'
  steps:
    - num: '01'
      title: 'Vali oma laud'
      desc: 'Vali meie põhi-SUP-mudelite hulgast — universaalne, matka-, jooga-, spordi- või laste. Vali suurus, materjal ja värv.'
    - num: '02'
      title: 'Lae üles oma disain'
      desc: 'Saada meile oma logo, kujundus või brändijuhised. Meie disainimeeskond valmistab digitaalse eelvaate.'
    - num: '03'
      title: 'AI-maketi ülevaade'
      desc: 'Vaata fotorealistlikku AI-ga loodud maketti oma kohandatud lauast enne tootmise algust.'
    - num: '04'
      title: 'Tootmine ja kohaletoimetamine'
      desc: 'Pärast heakskiitu läheb teie tellimus meie tootmisliinile. Täitmisajad alates 30 päevast.'

services_section:
  tagline: 'Teenused'
  title: 'Tootmisteenused globaalsetele brändidele'
  subtitle: 'Paindlikud koostömudelid — lepingulise tootmise kaudu täisteenuse brändiehituseni.'
  items:
    - title: 'Kaasbrändi tootmine'
      desc: 'Me toodame teie disainid vastavalt spetsifikatsioonile — teie IP, teie joonised, teie kvaliteedistandardid. Täielik NDA-kaitse.'
      icon: ⚙️
    - title: 'Disainilahendused'
      desc: 'Vali 50+ tõestatud platvormi hulgast ja kohanda suurust, värvi, graafikat ja pakendit.'
      icon: '🎨'
    - title: 'Eramärgis'
      desc: 'Teie bränd meie toodetel — logo, pakend, hinged, juhendid. Jaemüügivalmis karbist väljas.'
      icon: '🎨'
    - title: 'Kohandatud bränding'
      desc: 'Tekipadi trükk, keregraafika, toru kleepsud ja kohandatud sildid — täielik brändi integratsioon.'
      icon: ⚙️


intro: 'CAD-mudel, olgu see ükskõik kui detailsed, ei saa näidata, kuidas laud tegelikult käitub, enne kui see kohtub veega. Sellepärast on meie prototüübitöökoda loodud tõlkima inseneerimisandmed füüsiliseks, veepidavaks lauaks nii kiiresti ja täpselt kui võimalik. Iga uus afarer mudel — ja iga oluline kohandatud ehitus — läbib selle töökoja enne tootmistööriistade tellimist.'

content_html: |
  <h2>Kus disain saab reaalsuseks</h2>
  <p>Töökoda on täielikult varustatud keret, äärte ja varustuse samaaegseks valmistamiseks. See paralleelse töövoo lähenemine lühendab prototüübi valmimisaja 8-12 nädalani inseneerimisvabastusest, võrreldes valdkonna normiga 16-20 nädalat. Kui teie rakendus nõuab spetsialiseeritud lahendust, saame liikuda kontseptsioonist vees valideerimiseni alla kolme kuuga.</p>

  <h2>Töökoja võimekused</h2>
  <table>
    <thead><tr><th>Tööjaam</th><th>Seadmed</th><th>Eesmärk</th></tr></thead>
    <tbody>
      <tr><td>Kere valmistamine</td><td>CNC-kangaste lõikur, kuumlaminateerimise press, Drop-Stitch tuuma ettevalmistusjaam</td><td>Täismõõdus keretootmine kõigis kolmes konstruktsioonitüübis</td></tr>
      <tr><td>Äärte ja kambrite koostamine</td><td>RF-keevituspress, kuumõhu kinnitamise jaam, ülespuhumise testiseadis</td><td>Täismõõdus äärte ja kambrite kooste valmistamine koos kõigi vaheseinte ja klappidega</td></tr>
      <tr><td>Varustamine ja paigaldamine</td><td>Uimekasti freesija, lastikinnituste ja käepidemete keevituse asetusmustrid, tekikatte lõikamise jaam</td><td>Täielik varustamine: uimed, lastikinnitused, rihmaklapid, käepidemed, tekikatted, klapid</td></tr>
      <tr><td>Instrumenteerimise osakond</td><td>GPS-kiiruseandur, rõhuandurid, kiirendusandurid, termopaarimassiiv, andmelogija</td><td>Meretestide instrumenteerimise paigaldus ja kalibreerimine</td></tr>
    </tbody>
  </table>

  <h2>Prototüübi teekond — samm haaval</h2>
  <ol>
    <li><strong>Inseneerimise üleandmine</strong> — Disainipaketi (3D-mudel, FEA-aruanne, materjalide loend, laminaatide plaan) vaatavad ametlikult läbi töökoja juht ja projektinsener. Kõik tootmisega seotud mured märgitakse ja lahendatakse enne lõikamise algust.</li>
    <li><strong>Keretootmine</strong> — Kere ehitatakse vastavalt inseneerimisspetsifikatsioonile. Ühekihilise konstruktsiooni puhul: Drop-Stitch tuum laminaaditakse määratud PVC-kattega. Kahekihilise konstruktsiooni puhul: täiendav kiht kantakse baaslaminaadile enne mustri lõikamist. Sulandatud konstruktsiooni puhul: laminaatimise parameetrid laaditakse kinnitatud protsessilehelt ja verifitseeritakse esimesel proovitükil.</li>
    <li><strong>Äärte valmistamine</strong> — Kangas lõigatakse CNC-mustrite abil, seejärel RF-keevitatakse täismõõdus äärteks ja kambriteks. Iga kamber pumbatakse testrõhuni ja jäetakse 24 tunniks algseks stabiliseerimiseks.</li>
    <li><strong>Koostamine ja varustamine</strong> — Kere ja ääred ühendatakse. Uimekastid ja lastikinnitused paigaldatakse, rihmaklapid ja kandekäepidemed pannakse paika, täispuhumisklapp keeratakse pingule ning tekikate kantakse peale ja joondatakse.</li>
    <li><strong>Staatilised testid</strong> — Enne veega kontakti läbib laud: ujuvuskontrolli (täiskoormus + 30 % varu), kambri rõhupidamise testi, klapi lekketesti, käepidemete ja kinnituste tõmbetesti.</li>
    <li><strong>Meretestide programm</strong> — 20 tundi veetestimist, üksikasjad allpool.</li>
    <li><strong>Prototüübi ülevaatus</strong> — Peetakse ametlik kinnitamise koosolek koos inseneerimise, tootmise ja kvaliteedimeeskondadega. Kõik vajalikud disainimuudatused dokumenteeritakse ja lisatakse tootmisvabastusse.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-tunnine meretestide programm — testimiskava</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Sileda veega harjumine — aeglane suunahoid, pööramine, asendi ja tasakaalu kontroll</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Kiirustest — GPS-iga kinnitatud tippkiirus, reisikiirus, püsiv tempo kolmel tõmbesagedusel</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Pööramistest — pöörde- ja laiapöörderaadius, laua reageerimine, vasakule ja paremale</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Lainetest — korduvad sõidud läbi 0.5–1.0 m lühilainete; kiirendusandur sõitja asendis</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Stabiilsustest — staatiline kallakunurk nelja erineva kaaluga sõitjaga, nihkekoormus paremale</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Vastupidavussõit — 3 tundi pidevalt reisikiiusel; kambri rõhu, ääre temperatuuri ja sõitja väsimuse jälgimine</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Lõppkontroll — kõigi komponentide kontroll pärast testi, kõigi kinnituste pingutamine/kontrollimine, leidude dokumenteerimine</span>
      </div>
    </div>
  </div>

  <h2>Kohandatud prototüüpimine ainulaadseteks rakendusteks</h2>
  <p>Prototüübitöökoda on koht, kus lahendame probleeme, mida standardtoodangu lauad ei suuda käsitleda. Hiljutised näited:</p>
  <ul>
    <li>Kõrgelt nähtav pääste-SUP otsingu- ja päästeorganisatsioonile, nõudes integreeritud haardekäepidemeid, päästavarustuse kinnitusi ja suure ujuvusega keret kannatanu veeskamiseks — kõik prototüübitud, varustatud ja testitud meie rajatises.</li>
    <li>Ekspeditsiooni-turismi SUP hüdrograafilise uuringu töövõtjale koos eemaldatava instrumendimasti, tihendatud varustuseportide ja madala profiiliga muundurikinnitusega, mis on disainitud veetakistust minimeerima.</li>
    <li>Kompaktne kalastus-SUP kuurordi laevastikule, kus prototüüpi kasutati stabiilsuse, varustuse paigalduse ja vastupidavuse valideerimiseks igapäevasel rendikasutusel, enne kui klient kohustus nelja laevastiku suhtes.</li>
  </ul>

  <h2>Meie prototüüpimise meeskond</h2>
  <p>Töökojas töötab kaheksa mitut oskust valdavat meretehnikut, kellest igaüks on ristkoolitatud vähemalt kahes kolmest põhidistsipliinis (kere, äär, varustus). Meeskonna juht on meister-valmistaja 16 aasta kogemusega, ulatudes kohandatud üheeksemplaridest tootmisseriateni. Iga prototüüp saab endale pühendatud projektinseneri, kes on kliendi ainus kontaktisik kogu ehitus- ja testiprotsessi vältel.</p>

  <h2>Kliendi kaasatus</h2>
  <p>Julgustame aktiivselt kliente osalema prototüübi ehitamise olulistes verstapostides — eriti esialgses varustuse ülevaatuses ja meretestis. Teie operatiivne tagasiside nendes etappides on hindamatu väärtusega laua täiustamisel enne tootmisse jõudmist. Me ei ehita vaakumis; me ehitame koostöös teiega.</p>
  <p>20-tunnine meretest on teie meeskonnale ka võimalus tutvuda laua käitumise, tekipaigutuse ja hooldusnõuetega, tagades sujuva ülemineku kasutusele, kui tootmislauad on tarnitud.</p>


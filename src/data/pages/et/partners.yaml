meta:
  title: 'Partnerid — jaotus ja hulgimüük | {SITE}'
  description: 'Hakka afarer partneriks: jaotusvõrgustikud, hulgihinnad, OEM/eramärgi programmid ja tugi supilauaettevõtetele üle kogu maailma.'
  keywords:
    - 'supi jaotuspartner'
    - 'supilaudade hulgimüük'
    - 'täispuhutava supi jaotaja'
    - 'supi partnerlus'
hero:
  tagline: 'Partnerid ja jaotus'
  title: 'Hakka afarer partneriks<br />— ülemaailmne jaotusvõrgustik'
  subtitle: 'Liitu afarer ülemaailmse partnerite võrgustikuga. Me töötame merenduse jaotajate, sõudespordi edasimüüjate, varustuse jaemüüjate ja kaubamärgipartneritega üle 50 riigis.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: 'afarer ülemaailmne partnerite ja jaotajate võrgustik'
content_programs:
  tagline: 'Partnerprogrammid'
  title: 'Kasvuks ehitatud<br />partnerprogrammid'
  subtitle: 'Olenemata sellest, kas oled jaotaja, edasimüüja või kaubamärgipartner, pakub afarer programme, mis on loodud toetama sinu ettevõtet.'
  columns: 3
  items:
    - title: 'Jaotusprogramm'
      description: 'Eksklusiivne territooriumi jaotus koos mahuhindade, turundustoega ja otsese tehase ligipääsuga. Nõutav minimaalne kohustus sõltuvalt territooriumi suurusest.'
      icon: tabler:world
    - title: 'Edasimüüja programm'
      description: 'Otseedasimüüja hinnad, toodete koolitus, turundusmaterjalid ja garantii tugi jaemüügikohtadele ja e-poodidele.'
      icon: tabler:building-store
    - title: 'OEM/ODM partnerlus'
      description: 'Täisteenuse OEM ja ODM tootmine koos kohandatud kaubamärgi, pakendi ja toote spetsifikatsioonidega. Kontseptsioonist konteinerini.'
      icon: tabler:certificate
    - title: 'Kaubamärgi partnerlus'
      description: 'Kaasmärgitootmine, eramärk ja eksklusiivsete mudelite programmid väljakujunenud kaubamärkidele merenduse ja välispordi valdkonnas.'
      icon: tabler:stars
    - title: 'Valitsus ja asutused'
      description: 'Eelistatud tarnija programmid valitsusasutustele, rannavalvele, sõjaväele ja humanitaarorganisatsioonidele. Hankevalmidusega dokumentatsioon.'
      icon: tabler:building-community
    - title: 'Kuurordi ja rendi partner'
      description: 'Laevastiku hinnad, ühtlane kvaliteet ja kohandatud kaubamärk kuurortidele, sukeldumiskeskustele ja rendioperaatoritele üle kogu maailma.'
      icon: tabler:sun
content_benefits:
  tagline: 'Miks meiega partneriks hakata'
  title: 'Miks partnerid valivad afarer'
  subtitle: 'Meie partnerid saavad kasu tegelikust tootmisvõimekusest, ühtlasest kvaliteedist ja vastuvõtlikust toest.'
  list:
    - 'Otsene tehase ligipääs: Tööta otse meie tootmisemeeskonnaga — vahendajaid pole. Saad kiiremaid vastuseid, paremaid hindu ja täieliku nähtavuse tootmisesse.'
    - 'Kohandamisvalmidus: Brändi oma tooted kohandatud värvide, logode, pakendi ja spetsifikatsioonidega. Minimaalsed tellimiskogused kohandatud sinu turule.'
    - 'Garanteeritud kvaliteet: ISO 9001 sertifitseeritud tootmine koos CE, UKCA ja BSCI vastavusega. Iga toode testitud enne saatmist.'
    - 'Globaalne logistika: Saatmine Qingdaost Hiinast koos FOB, CIF ja DDP valikutega. USA ladu Montclairis, CA-s Põhja-Ameerika jaotuseks.'
    - 'Turundustugi: Toote kataloogid, fotograafia, tehniline dokumentatsioon ja digitaalsed materjalid sinu müügi toetamiseks.'
    - 'Koolitus ja tugi: Toodete koolitus sinu müügimeeskonnale, tehniline tugi sinu klientidele ja garantiiteeninduse koordineerimine.'
content_process:
  tagline: 'Kuidas partneriks saada'
  title: 'Lihtne partnerlusprotsess'
  subtitle: 'Meie partnerlusprotsess on otsekohene — loodud, et sa hakkaksid afarer tooteid kiiresti müüma.'
  items:
    - title: 'Samm 1: Esita taotlus'
      description: 'Täida meie partnerluse taotlusvorm koos oma ettevõtte profiili, sihtturu ja tootehuvidesid.'
    - title: 'Samm 2: Kvalifitseerimise läbivaatus'
      description: 'Meie partnerlusmeeskond vaatab sinu taotluse läbi ja võtab sinuga ühendust 3 tööpäeva jooksul võimaluste arutamiseks.'
    - title: 'Samm 3: Leping ja seadistamine'
      description: 'Allkirjasta partnerlusleping, seadista oma konto ja saa partnerhinnad, turundusmaterjalid ja tootenäidised.'
    - title: 'Samm 4: Koolitus ja käivitamine'
      description: 'Toodete koolitus, müügitugi ja turundusmaterjalid. Oled valmis müüma hakkama.'
cta:
  title: 'Valmis afarer partneriks saama?'
  subtitle: 'Taotle partnerlust ja meie meeskond vastab 3 tööpäeva jooksul.'

meta:
  title: 'Tehase seadmed — lõikamine, RF-keevitus ja trükk | {SITE}'
  description: 'Tööstusklassi afarer tootmisseadmed: PVC lõikamine, RF-keevitus, digitaalne trükk, koostamine ja testimine täispuhutavatele supilaudadele.'
  keywords:
    - 'supi tootmisseadmed'
    - 'täispuhutavate supilaudade tehas'
    - 'rf keevitus pvc'
    - 'supilaudade tootmine'
hero:
  tagline: 'Seadmed'
  title: 'Tootmisseadmed ja masinad'
  subtitle: 'Tööstusklassi seadmed lõikamise, keevitamise, trükkimise ja koostamise alal'
  back_label: 'Tagasi tehasesse'
  back_link: /factory/

categories:
  - title: 'Lõikamine ja materjalide ettevalmistus'
    items:
      - name: 'Automaatne PVC-lõikemasin'
        spec: 'CNC-juhitav, 6.5 m × 2.5 m, 0.1 mm täpsus'
        desc: 'Arvutijuhitav automaatne lõikemasin PVC- ja Drop-Stitch-kangastele. Paigutustarkvara optimeerib materjali kasutamise allapoole 5% jäätmeid.'
      - name: 'Kangaslaotur'
        spec: 'Maksimaalne laius 3 m, pingega juhitav sööt'
        desc: 'Laotab kanga ühe- või mitmekihiliselt kontrollitud pingega, et vältida moonutust enne lõikamist.'

  - title: 'Torude keevitamine ja liitmine'
    items:
      - name: 'Soostrükkemasin'
        spec: 'Kuumõhu keevitus, reguleeritav 200–600 °C, 0.5–5 m/min'
        desc: 'Kuumõhu soostrükimasin PVC ja ääreõmbluste liitmiseks ja keevitamiseks. Kasutatakse kinnitamiseks, tihendamiseks ja torukambrite ning ujukite ühendamiseks.'
      - name: 'Dielektriline RF-press'
        spec: '15 kW, plaadi suurus 2000 × 600 mm'
        desc: 'Raadiosageduskeevituse press peamiste pik õmbluste, ääreribade ja suurte kambrite valmistamiseks.'
      - name: 'CNC-juhitav RF-keevitaja'
        spec: '8 kW, XY-laud 2500 × 1200 mm'
        desc: 'Programmeeritav kõverõmbluse keevitamine keerulistele geomeetriatele, logode reljeefiks ja täppis-lappimiseks.'

  - title: 'Supilaudade tootmine'
    items:
      - name: 'Drop-Stitch tuuma laminaadipress'
        spec: 'Suurformaatne press lauatuumadele kuni 14 ft LOA'
        desc: 'Drop-Stitch tuumade täpne laminaatimine välimistesse PVC-laminaatidesse. Iga kiht rõhuliidetakse ühtlase kvaliteedi ja tugevuse tagamiseks.'
      - name: 'CNC-frees (5-teljeline)'
        spec: 'Tööruum 3 m × 2 m × 1 m, veega jahutatud spindel'
        desc: 'Uimekastide, käepideme avuste ja kohandatud laudkomponentide töötlemine.'

  - title: 'SUP-ide trükk ja dekoreerimine'
    items:
      - name: 'Digitaaltrükimasin'
        spec: 'Kõrge lahutusega tindiprinter, kuni 2 m trükkimise laius'
        desc: 'Otse kangale digitaalne trükk täisvärvis SUP-ide tekigraafikaks. Trükib kohandatud mustrid, üleminekud ja fotokvaliteediga kujutised UV-kindlate veepõhiste tintidega.'
      - name: 'Siiditrükimasin'
        spec: 'Manuaalne ja poolautomaatne, mitmevärviline paigutus'
        desc: 'Siiditrükk SUP-laudade logodele, kaubamärgi märkidele ja korduvatele mustritele. Tagab vastupidavad, katvad trükid ereda värviküllastusega.'

  - title: 'Koostamine ja varustamine'
    items:
      - name: 'Laua koostamise jaam'
        spec: 'Moodul- reguleeritav, mitmejaamiline paigutus'
        desc: 'Uimekastide, käepidemete, D-rõngaste, klappide ja tekikatete koostamine supilaudadele.'
      - name: 'Klappide paigalduspress'
        spec: 'Pneumaatiline, reguleeritav rõhk'
        desc: 'Halkey-Robertsi ja Leafieldi klappide täpne paigaldus ja tihendamine.'
      - name: 'Tekikatete laminaator'
        spec: '3 m × 1.5 m, temperatuuriga juhitav'
        desc: 'EVA-vahttekikatete kuumlaminaatimine supilaudade pealmisele poolele ühtlase liite tugevusega.'

  - title: 'Testimine ja kvaliteedikontroll'
    items:
      - name: 'Universaalne tõmbetestija'
        spec: '50 kN, ASTM D751'
        desc: 'Katkeva jõu, pikivenemise katkel ja rebendi leviku testimine kangapartiidele.'
      - name: 'Õhupidavuse testistend'
        spec: 'Programmmeeritav, 30-minutine rõhupidamine'
        desc: 'Automatiseeritud rõhupidamise test igale torukambrile enne koostamist.'
      - name: 'Õmbluse eemaldustester'
        spec: 'Mootoriga 180° eemaldus kiirusel 100 mm/min'
        desc: 'Keevitatud ja liimitud õmbluste eemaldustugevuse testimine vastavalt EN ISO 25649-le.'
      - name: 'Ksenoonkaare ilmastikukamber'
        spec: '2000 h kokkupuude'
        desc: 'UV-kindluse testimine värvi muutumise ja tugevuse säilimise osas.'

cta:
  title: 'Huvi tehase vastu?'
  desc: 'Ootame külastajaid meie Qingdao rajatisse. Vaata meie seadmeid ja protsesse oma silmaga.'
  label: 'Broneeri külastus →'
  link: /contact/

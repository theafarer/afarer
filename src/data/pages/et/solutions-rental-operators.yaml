meta:
  title: 'SUP-i rendivarustuse tarnija ja laevastikulahendused | {SITE}'
  description: 'SUP-i rendivarustuse tarnija rendioperaatoritele. Kõrgpöörlemisega kommerts-SUP-lauad, mis on disainitud igapäevaseks kasutuseks — UV-kindel PVC, tugevdatud õmblused, kiiresti kuivavad materjalid. Kasutage oma rendiäri Afareriga.'

hero:
  tagline: 'Rendioperaatorid'
  title: 'Kasutage oma rendiäri<br />enesekindlalt'
  subtitle: 'SUP-i rendivarustuse tarnija rendioperaatoritele. Kõrgpöörlemisega SUP-lauad, mis on disainitud igapäevaseks rendikasutuseks 365 päeva aastas. Teie tulu ei puhka päevagi.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 'Hõivatud rendikiosk koos külalistele valmis SUP-laudadega'

features:
  title: 'Ehitatud rendikoormusele'
  subtitle: 'Iga laud on disainitud 500+ renditsükliks minimaalse hooldusega.'
  items:
    - title: '500+ renditsüklit'
      description: 'Testitud, et vastu pidada igapäevasel kasutusel soolases vees, päikese ja liiva käes.'
      icon: 'tabler:shield-check'
    - title: 'UV-kindel kangas'
      description: 'Ei tuhmu ega halvene pärast 1 aastat välitingimustes hoiustamist.'
      icon: 'tabler:sun'
    - title: 'Tugevdatud õmblused'
      description: '3x tugevamad kui standardne täispuhutava lauaga ehitus.'
      icon: 'tabler:layers-intersect'
    - title: 'Kiiresti kuivavad materjalid'
      description: 'Lauad valmis järgmiseks rendiks vähem kui 30 minutiga.'
      icon: 'tabler:droplet'
    - title: 'Kuhjatav hoiustamine'
      description: 'Ruumisäästev disain — mahutage 40% rohkem laudu samale alale.'
      icon: 'tabler:stack'
    - title: 'Värvikodeeritud suurused'
      description: 'Personal saab õige laua kohe kätte värvikodeeritud suurustega.'
      icon: 'tabler:color-swatch'

stats:
  title: 'Operatsiooni mõõdikud'

features3_reasons:
  tagline: 'Miks valida afarer'
  title: 'Seitse põhjust meiega partneriks saada'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Tegelik tootmine, mitte vahendus'
      description: 'Me omame ja haldame 12,000 m² tehas. afareriga partnerdades töötad otse inimestega, kes disainivad, inseneerivad ja ehitavad sinu tooteid — vahendajaid pole.'
      icon: tabler:building-factory
    - title: '2. Inseneerimisjuhitud lähenemine'
      description: 'Meie disainiprotsess algab kasutusjuhust, mitte tootekategooriast. Optimeerime kere kuju, materjalide valiku ja konfiguratsiooni selle järgi, kuidas lauda tegelikult kasutatakse.'
      icon: tabler:engine
    - title: '3. Sertifitseeritud kvaliteet'
      description: 'CE-sertifikaat, ISO kvaliteedisüsteem, BSCI-vastavus, REACH-vastavus, USCG heakskiit. Iga toode vastab rahvusvahelistele standarditele — mitte ainult väidetele.'
      icon: tabler:certificate
    - title: '4. Paindlik kaasmärgitootmine'
      description: 'Äärte värvid, tekipaigutus, bränding, pakend — me kohandame sinu spetsifikatsioonide järgi. Minimaaltellimuse survet ei ole. Alusta prototüübiga, skaala kindlustundega.'
      icon: tabler:adjustments
    - title: '5. Globaalne logistika'
      description: 'USA ladu Californias, otsesaatmine Qingdaost, õhutransport kiireloomulikele tellimustele. Me haldame tollipaberit ja dokumentatsiooni.'
      icon: tabler:truck-delivery
    - title: '6. Eluaegne tugi'
      description: 'Me toetame laudu, mille ehitasime 20 aastat tagasi. Originaalvaruosad, tehniline nõu, remondijuhised — meie meeskond on saadaval, kui meid vajad.'
      icon: tabler:lifebuoy
    - title: '7. Ausad spetsifikatsioonid'
      description: 'Tegelikud koormushinded, tegelikud mõõtmed, tegelik kaal. Turunduse ülepaisutust ei ole. See, mida me avaldame, on see, mida sa saad — verifitseeritud sõltumatu testimisega.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Usaldatud kaubamärkide poolt üle kogu maailma'
  title: 'Mida meie partnerid ütlevad'
  items:
    - content: 'Oleme töötanud mitme Hiina tootjaga, kuid afarer eristub oma inseneritoe ja ühtlase kvaliteedi poolest. Nad kohtlevad meie kaubamärki nagu omaenest.'
      name: '— Kaasmärgipartner, Euroopa vesispordi kaubamärk'
    - content: 'Nende supilauad on olnud meie laevastikus teenistuses üle 5 aasta. Minimaalne hooldus, suurepärane UV-kindlus. 5-aastane garantii annab meile kindlustunde.'
      name: '— Laevastikuoperaator, Lähis-Ida kuurordigrupp'
    - content: 'afarer meeskond aitas meil arendada kohandatud supilaua disaini kontseptsioonist tootmiseni 90 päevaga. Kvaliteet ületas meie ootusi.'
      name: '— Jaotaja, Austraalia vesispordiettevõte'

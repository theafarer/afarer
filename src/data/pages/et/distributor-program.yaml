faqs:
  title: 'Riigipartnerlus — KKK'
  subtitle: 'Küsimused, mis tõsised riigipartnerid esitavad enne kandideerimist.'
  items:
    - title: 'Mida üks-riik-üks-levitaja tegelikult tähendab?'
      description: 'Afarer nimetab ühe volitatud levitaja koos eksklusiivsete õigustega kindlaks määratud territooriumile. Me ei müü meie globaalsetest või piirkondlikest kanalitest kaitstud riiki. Teie territooriumi omamine kehtib nii kaua, kui levituslepe on täidetud.'
    - title: 'Kas territoorium on eksklusiivne igaveseks?'
      description: 'Ei. Eksklusiivsus on tingimuslik, mitte igavene. Seda säilitatakse allkirjastatud levitusleppe, teie esimese tellimuse täitmise, aastaste ostueesmärkide, kohaliku lao, järelmüügi võimekuse ja pideva turuinvesteeringuga. Kui need pole täidetud, saab territooriumi üle läbi rääkida või ümber määrata.'
    - title: 'Mis on minimaalne esimene tellimus?'
      description: 'Riigi- ja piirkondlikud levitajad alustavad 100–300 ühikust; volitatud edasimüüjad 30–50 ühikust; katsetellimused alates 10–30 ühikust lasevad teil turg esmalt valideerida (proovi- ja katsetellimused ei anna territooriumikaitset). Kohandatud ja eramärgise programmid järgivad ülaltoodud tasandites loetletud eraldi MOQ-sid.'
    - title: 'Mida sisaldab 10-mooduline tugiprogramm?'
      description: 'Tasandid ja kvalifikatsioon, territooriumi kaitse, MOQ / hinnad / aastased tagasimaksed, ladu ja tellimuste täitmine, turunduse varad ja ühised turufondid, toote-/müügi-/tehniline koolitus, varuosad ja järelmüük, garantii registreerimine, partneriportaal ning toote andmleheded, turunduse varade kogu, aastane tagasimaksete graafik ning saatmis- ja pakkimisloendid.'
    - title: 'Kuidas Afarer kaitseb mind kanalikonflikti eest?'
      description: 'Igal territooriumil on täpselt üks volitatud levitaja. Teie piirkonna päringud ja otsetellimused suunatakse teie kaudu, veebivormid edastatakse kohalikule partnerile, kus see on olemas, ja globaalne meeskond eskaleerub ainult siis, kui partner ei vasta.'
    - title: 'Millised on saatmis- ja maksetingimused?'
      description: 'Tellimused saadetakse FOB Qingdao koos täieliku ekspordidokumentatsiooniga. Tootmistellimused on 30% sissemakse ja 70% enne saatmist; proovi- ja katsetellimused on ettemaksuga. Standardne täitmisaeg on 30–45 tööpäeva, proovipartiide puhul 15–20 tööpäeva.'
    - title: 'Kuidas ma kandideerin?'
      description: 'Saada oma kandideerimine kontaktvormi kaudu koos turu andmetega. Me vaatame üle turu sobivuse, jaemüügi kohalolu ja logistika võimekuse, seejärel vastame 3 tööpäeva jooksul järgmiste sammude ja näidislevitusleppega.'

meta:
  title: 'Eramärgisega SUP-tootmine ja kohandatud brändi käivitamine | {SITE}'
  description: 'Eramärgisega SUP-tootja uutele sõudelaua brändidele. Käivitage oma SUP-bränd Afareriga — täielik OEM/ODM teenus, sealhulgas disain, prototüübid, kohandatud bränding, tootmine ja globaalne logistika.'

hero:
  tagline: 'Ehita oma bränd'
  title: 'Käivitage oma<br />SUP-bränd'
  subtitle: 'Sul on visioon. Meil on tehas, ekspertiis ja tarneahel. Eramärgisega SUP-tootmine ja kohandatud SUP-brändi arendus — koos ehitame brändi, mis eristub.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Kohandatud brändinguga SUP-laud vees'

process:
  title: 'Teie brändi teekond'
  subtitle: 'Ideest turuni 5 etapis.'
  steps:
    - phase: 'Etapp 1'
      title: 'Idee'
      period: 'Nädal 1-2'
      items:
        - 'Turu-uuringud ja konkurentide analüüs'
        - 'Sihtkliendi määratlemine'
        - 'Brändi positsioneerimise töötuba'
        - 'Tootesarja strateegia'
    - phase: 'Etapp 2'
      title: 'Disain'
      period: 'Nädal 3-6'
      items:
        - 'Lauakuju ja graafiline disain'
        - 'Värvide sobitamine ja materjalide valik'
        - 'Tarvikute spetsifikatsioon'
        - 'Pakendi ja sildi disain'
    - phase: 'Etapp 3'
      title: 'Prototüüp'
      period: 'Nädal 7-10'
      items:
        - 'Proovitootmine'
        - 'Kvaliteeditestimine (rõhk, ujuvus, UV)'
        - 'Disaini kohandused'
        - 'Lõplik heakskiit'
    - phase: 'Etapp 4'
      title: 'Tootmine'
      period: 'Nädal 11-14'
      items:
        - 'Mass-tootmine'
        - 'QC-kontroll (ühiku kohta)'
        - 'Mere- / õhutransport'
        - 'Tollivormistuse dokumendid'
    - phase: 'Etapp 5'
      title: 'Käivitamine'
      period: 'Nädal 15-16'
      items:
        - 'Tootefotograafia'
        - 'Veebilehe tootevoog'
        - 'Turundusmaterjalid'
        - 'Käivitamise tugi'

packages:
  title: 'Stardipaketid'
  subtitle: 'Paketid, mis on disainitud igale brändi kasvu etapile.'
  items:
    - name: 'Algne bränd'
      tagline: '50-100 ühikut · 2 mudelit'
      features:
        - 'Põhiline logode trükkimine'
        - 'Standardne pakend'
        - 'E-posti tugi'
    - name: 'Kasvav bränd'
      tagline: '300-1 000 ühikut · 3-5 mudelit'
      features:
        - 'Kohandatud värv + logo'
        - 'Kohandatud pakend'
        - 'Tootefotod'
        - 'Pühendatud haldur'
    - name: 'Asutatud bränd'
      tagline: '1 000+ ühikut · Täielik tootesari'
      features:
        - 'Täielik kohandamine'
        - 'Premium-pakend'
        - 'Turundusmaterjalid'
        - 'Prioriteetne tootmine'


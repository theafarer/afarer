meta:
  title: 'Sõudeklubide SUP-varustus ja laevastiku lahendused | {SITE}'
  description: 'Täielikud SUP-laevastiku programmid sõudeklubidele ja koolidele. Stardipaketid, professionaalsed laevastikud, võistluslauad, koolituskeskuste komplektid ja varuosade tugi.'

hero:
  tagline: 'Sõudeklubid ja koolid'
  title: 'Käivita, halda ja kasvata oma sõudeklubi<br />kommertsklassi SUP-laevastikega'
  subtitle: 'SUP-klubide varustuse tarnija sõudeklubidele ja SUP-koolidele kogu maailmas — vastupidavad kommertslauad, hulgihinnad klubidele, kohandatud bränding ja kiired varuosad, et saaksite keskenduda oma kogukonna kasvatamisele.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 'Sõudeklubi liikmed ühtlastel Afarer SUP-laudadel'

benefits:
  title: 'Klubilaevastiku eelised'
  subtitle: 'Miks sõudeklubid üle 50 riigi valivad Afareri oma varustuspartneriks.'
  items:
    - metric: '40%+'
      label: 'Laevastiku kulude kokkuhoid'
      detail: 'Võrreldes jaemüügihindadega koos klubide hulgiallustustega'
    - metric: '48h'
      label: 'Varuosade asendamine'
      detail: 'Minimaalne seisuaeg teie rendilaevastikule'
    - metric: '500+'
      label: 'Renditsüklid'
      detail: 'Kommertsklassi vastupidavus laua kohta'
    - metric: '5+ aastat'
      label: 'Laevastiku eluiga'
      detail: 'Õige hoolduse ja hoolitsusega'

packages:
  title: 'Klubilaevastiku programmid'
  subtitle: 'Valige laevastiku programm, mis sobib teie klubi suuruse ja ambitsioonidega.'
  items:
    - name: 'Stardipakett'
      tagline: 'Uutele klubidele, kuni 30 liiget'
      features:
        - '10 SUP-lauda (universaalne + matka segu)'
        - '10 sõudjat + 10 päästevesti'
        - '2 kahetoimelist pumpa + paranduskomplekt'
        - 'Klubibränding laudadel (logo trükk)'
        - 'Käivitusjuhend + ohutuse kontroll-loend'
        - 'CE sertifitseeritud — kogu varustus'
      cta_text: 'Alusta oma klubi'
    - name: 'Professionaalne laevastik'
      tagline: 'Asutatud klubidele, 50-100 liiget'
      features:
        - '30 SUP-lauda (3 suuruse valikut)'
        - '30 sõudjat + 30 päästevesti'
        - '5 pumpa + 2 paranduskomplekti + hoiuraam'
        - 'Kohandatud klubi värvid + logo laudadel'
        - 'Varuosade programm (15% allahindlus)'
        - 'Personali koolituse sessioon (veebis)'
        - 'CE sertifitseeritud — kogu varustus'
      popular: true
      cta_text: 'Ehita oma laevastik'
    - name: 'Võistluslaevastik'
      tagline: 'Võistlusklubidele, üritustele, võistlustele'
      features:
        - '50+ võistlus- / jõudluslaua'
        - 'Täielik tarvikute komplekt (sõudjad, vestid, pumbad)'
        - 'Ürituste tugikomplekt (stardipoijad, markerid)'
        - 'Prioriteetsed varuosad (24h saatmine)'
        - 'Pühendatud kontohaldur'
        - 'Kohandatud meeskondlike vormide valik'
        - 'CE sertifitseeritud — kogu varustus'
      cta_text: 'Hangi võistluslaevastik'

training:
  title: 'Koolituskeskuse paketid'
  subtitle: 'Kõik, mida SUP-kool vajab professionaalsete sertifitseerimiskursuste läbiviimiseks.'
  items:
    - name: 'Instruktori stardikomplekt'
      features:
        - '5 premium SUP-lauda (instruktori klass)'
        - '5 süsiniksõudjat demo jaoks'
        - '5 päästevesti (instruktori mõõduga)'
        - 'Koolitusprogrammi juhend'
        - 'CE sertifitseeritud varustus'
    - name: 'Kooli täiskomplekt'
      features:
        - '20 SUP-lauda (õpilaste + instruktorite segu)'
        - '20 sõudjat + 20 päästevesti (eri suurused)'
        - '10 ujuvusabivahendeid algajatele'
        - '4 pumpa + paranduskomplektid'
        - 'Koolitusprogramm ja sertifitseerimise tugi'
        - 'CE sertifitseeritud varustus'

features:
  title: 'Miks klubid valivad Afareri'
  subtitle: 'Ühtlane kvaliteet, kiired varuosad ja hulgihinnad kasvavatele klubidele.'
  items:
    - title: '500+ renditsüklit'
      description: 'Kommertsklassi lauad peavad vastu hooaegadel igapäevasel kasutusel.'
      icon: 'tabler:shield-check'
    - title: 'Kohandatud värvid'
      description: 'Sobitage oma klubi identiteediga kohandatud lauavärvide ja logoga.'
      icon: 'tabler:palette'
    - title: 'Hulgihinnad'
      description: 'Mahu allahindlused laevastiku tellimustele 10+ lauda.'
      icon: 'tabler:discount'
    - title: 'Kiired varuosad'
      description: 'Varuosad saadetud 48 tunni jooksul.'
      icon: 'tabler:truck-delivery'
    - title: 'Klubi kasvu tugi'
      description: 'Nõuanded liikmelisusprogrammide, hindade ja ürituste korraldamise kohta.'
      icon: 'tabler:trending-up'
    - title: 'CE sertifitseeritud'
      description: 'Kogu varustus vastab rahvusvahelistele ohutusstandarditele.'
      icon: 'tabler:certificate'


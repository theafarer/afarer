content_html: |
  <h2>Kolm standardpaksust</h2>

  <h3>4" (10 cm) – turism ja jõudlus</h3>
  <ul>
    <li>Kõrgeim jäikus – vähem paindumist koormuse all</li>
    <li>Kõige kergem – vähem materjali, vähem õhumahtu</li>
    <li>Suurepärane suunahoid – vähenenud küljelt küljele kõikumine</li>
    <li>Kõige kiirem – vähenenud takistus, lihtsam libisemine</li>
    <li>Parim: turism, võistlemine, fitness-sõudmine, kogenud sõudjad</li>
  </ul>

  <h3>5" (12.7 cm) – universaalne</h3>
  <ul>
    <li>Hea jäikus – tasakaalustatud paine ja jäikuse suhe</li>
    <li>Keskmine kaal – standardne materjalikasutus</li>
    <li>Hea esmane + teisene stabiilsus</li>
    <li>Parim: vabaajasõudmine, algajad, lõdvestunud järve- ja jõekasutus</li>
  </ul>

  <h3>6" (15.2 cm) – stabiilsus ja jooga</h3>
  <ul>
    <li>Kõrgeim esmane stabiilsus – massiivne ujuvus</li>
    <li>Kõige raskem – rohkem PVC-materjali, suurem õhumaht</li>
    <li>Kõige aeglasem – rohkem takistust, raskem libisemist hoida</li>
    <li>Parim: jooga/fitness, rasked sõudjad (100+ kg), väga laineline olukord</li>
  </ul>

  <h2>Inseneerimisanalüüs</h2>
  <p>Täispuhutava SUP-i jäikust määravad sisene õhurõhk ja laua ristlõike inertsimoment. 20 PSI juures näitab 4" laud umbes 30% vähem paindumist koormuse all kui sama laiuse ja pikkusega 6" laud. Esmane stabiilsus tuleb veeliini laiusest ja ujuvusest; teisest stabiilsust mõjutavad ääre kuju ja laua laius.</p>

  <h2>Paksus sõitja kaalu järgi</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Sõitja kaal</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Soovitatav paksus</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Alla 65 kg (143 naela)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 naela)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 naela)</td><td class="p-3 border">5" või 6"</td></tr>
      <tr><td class="p-3 border">Üle 115 kg (253 naela)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Paksuse ja PSI-i kompromiss</h2>
  <p>Levinud eksiarvamus on, et kõrgem PSI saab kompenseerida liigset paksust. 25 PSI juures näitab 6" laud rohkem paindumist kui 4" laud 15 PSI juures, sest geomeetriline inertsimoment domineerib jäikuse võrrandis. Jõudlusorienteeritud sõudjate jaoks ületab õhem laud madalamal rõhul paksema laua jõudluse kõrgemal rõhul.</p>

  <h2>afarer valik</h2>
  <ul>
    <li><strong>4" laudad:</strong> Cheetah Touring seeria – 12' x 30" x 4" turismi-SUP-id fitness- ja kaugmaasõudmiseks</li>
    <li><strong>5" laudad:</strong> Cheetah All-Round seeria – 10'6" x 32" x 5" vabaajakasutuseks</li>
    <li><strong>6" laudad:</strong> Cheetah Ultra-Stable seeria – 10' x 34" x 6" joogaks, suurtele sõudjatele ja fotograafia platvormideks</li>
  </ul>
  <p>Kõik laudad kasutavad 1,680 DTEX Drop-Stitch tuumasid koos 20 PSI nimirõhu ja 1.2 mm PVC-laminaatidega.</p>


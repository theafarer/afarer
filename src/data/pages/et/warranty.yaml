body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Käesolev piiratud garantii kehtib uute afareri kaubamärgiga täispuhutavate meretoodete kohta, mis on ostetud otse afarerilt või volitatud afareri edasimüüjalt või jaemüüjalt. Jõustumiskuupäev on algse jaemüügi kontrollitav ostukuupäev.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garantiikate ja kestus</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 aastat</h3>
        <p class="text-sm text-gray-600 mt-1">Peamise torukanga terviklikkus (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 aastat</h3>
        <p class="text-sm text-gray-600 mt-1">Klaaskiust kere konstruktsiooniterviklikkus</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 aastat</h3>
        <p class="text-sm text-gray-600 mt-1">Täispuhutava toru õmbluse õhupidamisvõime</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 aastat</h3>
        <p class="text-sm text-gray-600 mt-1">Täispuhumisklapi toimimine</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 aasta</h3>
        <p class="text-sm text-gray-600 mt-1">Tehases paigaldatud tarvikud ja abiliitmikud</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 aasta*</h3>
        <p class="text-sm text-gray-600 mt-1">Äri-, rendi- või laevastikukasutus — kõik komponendid</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Äri-, valitsus-, tšarter-, rendi- või õppekasutus vähendab garantii ühele aastale. Võistlus- või spordivõistluskasutus tühistab garantii täielikult.</p>
  </div>

  <h2>Mida garantii katab</h2>
  <h3>Peamine torukangas (5 aastat)</h3>
  <p>afarer garanteerib peamise tekikanga vastu poorsuse halvenemist, mis oluliselt kahjustab toote võimet hoida töökorras õhurõhku. See kehtib PVC-kattega kanga ja kõigi teiste tootmises kasutatud tekikangamaterjalide kohta.</p>

  <h3>Klaaskiust kere konstruktsiooniterviklikkus (5 aastat)</h3>
  <p>Toodete puhul, millel on klaaskiuga tugevdatud plastist (FRP) kere, garanteeritakse põhiline komposiitkonstruktsioon struktuurilise rikke vastu, mis on põhjustatud materjalide või töö kvaliteedi puudustest.</p>

  <h3>Täispuhutava toru õmbluse õhupidamisvõime (5 aastat)</h3>
  <p>Täispuhutavate torude õmblused, mis ühendatakse tootmise käigus, on garantii all tootmisvigade vastu, mis põhjustavad märkimisväärset õhulekket õmbluse kaudu. Perioodiline inspektsioon ja sobivate rõhkude hoidmine on katvuse tingimuseks.</p>

  <h3>Täispuhumisklapi toimimine (5 aastat)</h3>
  <p>Õhupuhumisklapid, mille afarer algselt paigaldas, on garantii all materjali või töö kvaliteedi puuduste vastu, mis takistavad klapil õhku disainile vastavalt hoidmast.</p>

  <h3>Tehases paigaldatud tarvikud (1 aasta)</h3>
  <p>afarer toodetud ja tehases algselt paigaldatud komponendid ja liitmikud on ühe aasta jooksul garantii all materjali ja töö puuduste vastu. See ei hõlma kolmanda osapoole tooteid, mida katab ainult nende vastavate tootjate garantii.</p>

  <h2>Mida garantii ei kata</h2>
  <ul>
    <li>Välimusvead, sealhulgas värvuse muutumine, määrdumine, tuhmumine, kriidistumine või muu välimuse muutus</li>
    <li>Läbistused, lõiked, rebendid, katked või muu füüsiline kahjustus</li>
    <li>Kraatumine, pragunemine, kulumine, hõõrdumine või halvenemine hõõrdumise või kokkupuute tõttu</li>
    <li>UV-valguse, ilmastiku või atmosfääritingimuste põhjustatud degradatsioon</li>
    <li>Kahjustused kokkupuutest kütuste, lahustite, hapete, leelistega või kemikaalidega</li>
    <li>Kahjustused hooletuse, ebakohase kasutamise, väärkohtlemise, õnnetuse või normaalse kulumise tõttu</li>
    <li>Geelkatendi või värvipinna probleemid (mullitamine, kraatumine, värvuse muutumine, tuhmumine)</li>
    <li>Kahjustused põrkumisest, pingest, ebakohasest toestamisest või haagissõidukiga veost</li>
    <li>Kahjustused ebakohasest täis-/tühjendamisest või heakskiitmata puhumisseadmete kasutamisest</li>
    <li>Kolmanda osapoole varustus, komponendid või süsteemid (katab nende vastav tootja)</li>
  </ul>

  <h2>Tootja kohustus ja lahendus</h2>
  <p>afarer ainukohane ja eksklusiivne kohustus on parandada või asendada afarer valikul mis tahes komponent, mille on määratud materjali või töö kvaliteedi puudusega defektseks ja mis kuulub käesoleva garantii alla. Parandusi või asendusi teostab afarer või selle nimetatud volitatud teenindusasutus. Parandatud või asendatud komponendid on garantii all ainult algses garantiiperioodis järelejäänud osas.</p>

  <h2>Garantii tingimused</h2>
  <ul>
    <li><strong>Registreerimine:</strong> Toode peab olema nõuetekohaselt registreeritud, nagu on ette nähtud garantiitingimustes.</li>
    <li><strong>Hooldus:</strong> Toodet tuleb hooldada vastavalt afarer avaldatud juhistele, sealhulgas perioodilise inspektsiooni ja sobivate rõhkude hoidmisega.</li>
    <li><strong>Koostöö:</strong> Ostja peab garantiinõuetega seotud küsimustes afareriga täielikult ja viivitamatu koostööd tegema.</li>
    <li><strong>Algne ostja:</strong> Käesolev garantii kehtib ainult algsele lõppkasutajast ostjale ja see ei ole üleandmine.</li>
  </ul>

  <h2>Ärikasutus</h2>
  <p>Kui toodet kasutatakse äri-, valitsus-, mittetulundus-, tšarter-, rendi-, õppe- või muul eesmärgil kui eravabaaja kasutus, väheneb kõigi komponentide garantiiperiood ühele (1) aastale alates algsest jaemüügi ostukuupäevast. Kasutus võistlustel, kiirus- või vastupidavusvõistlusel tühistab garantii viivitamata ja tagasiulatuvatult täielikult.</p>

  <h2>Kuidas esitada garantiinõue</h2>
  <p>Võtke ühendust afareriga või oma volitatud edasimüüjaga koos ostutõendi ja probleemi üksikasjaliku kirjeldusega. afarer vaatab nõude läbi ja annab juhised inspektsiooniks ja teeninduseks.</p>
  <p>Garantiiteeninduse päringuteks võtke palun meiega ühendust meie <a href="/contact/" class="text-sky-600 underline">kontaktlehe</a> kaudu, kasutades oma tellimuse numbrit ja toote andmeid.</p>

  <h2>Kolmanda osapoole tooted</h2>
  <p>Kolmandate osapoolte toodetud varustus, komponendid või süsteemid (isegi kui afarer need paigaldas) on kaetud ainult nende vastavate tootjate pakutava garantiiga. afarer võtab selgesõnaliselt kõik garantiikohustused selliste kolmanda osapoole toodete osas tagasi.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Käesolev garantiiteatis on täieliku afarer tootja piiratud garantii kokkuvõte. Kõiki garantiitingimusi reguleerib täielik juriidiline garantiidokument. Spetsifikatsioonid võivad muutuda ette teatamata. afarer on kaubamärk, mida haldab Aquafarer LLC (USA).
  </p>

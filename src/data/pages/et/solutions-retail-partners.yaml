meta:
  title: 'SUP-ide hulgimüük ja jaemüügipartnerluse programm | {SITE}'
  description: 'SUP-ide hulgimüügi partnerprogramm jaemüüjatele ja spordikauplustele. Täielik tootevalik, otsetarne võimalused, konkurentsivõimelised hulgimarginaalid alates 20–35% ja madal MOQ alustamiseks.'

hero:
  tagline: 'Jaemüügipartnerid'
  title: 'Müü premium täispuhutavaid SUP-e<br />marginaalidega, mis töötavad'
  subtitle: 'Hakka afarer jaemüügipartneriks — paku turu kiireima kasvuga supi kaubamärki koos täielike hulgihindade, otsetarnega, professionaalsete turundusmaterjalide ja pühendatud toega.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'afarer supilauad jaemüügipoes välja panduna'

margin_section:
  title: 'Jaemüügimarginaalid ja MOQ'
  subtitle: 'Hulgihinna astmed, mis on loodud jaemüügi kasumlikkuseks.'
  items:
    - tier: 'Baaspartner'
      discount: '20%'
      moq: '500 ühikut/aastas'
      margin_note: '~150–250 USD kasum laua kohta'
      features:
        - 'Juurdepääs täielikule tootevalikule'
        - 'Turundusmaterjalide pakett'
        - 'E-posti tugi'
        - 'Juurdepääs tootekataloogile'
    - tier: 'Premiumpartner'
      discount: '30%'
      moq: '2,000+ ühikut/aastas'
      margin_note: '~250–400 USD kasum laua kohta'
      features:
        - 'Pühendatud kontohaldur'
        - 'Eksklusiivne territooriumikaitse'
        - 'Kohandatud turundustugi'
        - 'Esmane juurdepääs uutele toodetele'
        - 'Personali koolitussessioonid'
    - tier: 'Lippulaevapartner'
      discount: '35%+'
      moq: '5,000+ ühikut/aastas'
      margin_note: '~350–500+ USD kasum laua kohta'
      features:
        - 'Kaasmärgi turunduskampaaniad'
        - 'Poosisinetoe'
        - 'Kohapealne personelikoolitus'
        - 'Ühised sotsiaalmeedia kampaaniad'
        - 'Prioriteetne tootmise eraldatus'


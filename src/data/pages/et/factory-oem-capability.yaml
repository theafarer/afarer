intro: 'afarer pakub põhjalikke OEM- ja ODM-teenuseid brändidele, levitajatele ja valitsusasutustele kogu maailmas. 10+ aasta ekspordikogemusega ja 12 000 m² ISO 9001 ja BSCI sertifitseeritud tehasega haldame me kõike alates toote disainist ja vormide arendusest kuni täismahus tootmise, pakendamise ja logistikani.'


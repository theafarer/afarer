services:
  - title: 'Toote disain ja inseneritöö'
    description: 'Meie R&D meeskond töötab teie kontseptsiooni või spetsifikatsiooniga, et arendada CAD-joonised, 3D-mudelid ja prototüübid. Pakume vormide disaini, kerekuju optimeerimist ja materjalivaliku juhendamist.'
  - title: 'Kohandatud bränding ja graafika'
    description: 'Täisvärvi digitaaltrükk, sõeltrükk, reljeef ja sildi valikud. Arendame brändipõhiseid tekigraafikaid, toru brändingut ja jaemüügivalmis pakendeid.'
  - title: 'Materjalide ja spetsifikatsioonide kohandamine'
    description: 'Valige PVC (standard, keskkonnasõbralik, leegiaeglustav), Drop-Stitch ja hübriidkonstruktsioonide hulgast. Kohandatud toru värvid, kangakaalud ja tugevdamise valikud.'
  - title: 'Pakendamine ja logistika'
    description: 'Kohandatud jaemüügipakend, eramärgise karbid, vaakumpakkimine, kaubaalustele paigutamine ja konteineri laadimine. Saadaval FOB Qingdao, CIF või DDP saatmistingimused.'

moq_table:
  - product: 'Täispuhutavad SUP-lauad'
    standard_moq: '5–10 ühikut'
    custom_moq: '200+ ühikut'
    lead_time: '30–45 päeva'
  - product: 'Päästevestid ja ohutus'
    standard_moq: '100–200 ühikut'
    custom_moq: '1 000+ ühikut'
    lead_time: '20–30 päeva'

why_us:
  - title: 'Vertikaalne integratsioon'
    description: 'Me omame oma tehas, vormid ja tarneahela — ei vahendajaid, ei alltöövõtjaid. See annab meile kontrolli kvaliteedi, kulu ja tarne üle.'
  - title: 'Kaksiksertifitseerimine'
    description: 'ISO 9001 kvaliteedijuhtimine ja BSCI sotsiaalse vastavuse sertifikaat. Tehase auditiaruanded saadaval nõudmisel.'
  - title: 'CE vastavus'
    description: 'Kõik standardmudelid kannavad CE 2013/53/EU sertifikaati. Kohandatud mudeleid saab CE sertifitseerida meie väljakujunenud protsessi kaudu.'
  - title: 'Madal MOQ'
    description: 'Alustage vaid 5 ühikust standardmudelitega. Aitame arenevatel brändidel käivitada ilma laovarude ülepühendumiseta.'

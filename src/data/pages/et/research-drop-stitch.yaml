content_html: |
  <h2>Mis on Drop Stitch?</h2>
  <p>Drop Stitch (nimetatakse ka "Drop-Stitch kanga" või "Drop-Stitch tuumaks") on konstruktsioonimeetod, mille puhul tuhanded üksikud polüesterniidid ühendavad kanga kesta ülemise ja alumise kihi. Kui kest pumbatakse üles, toimivad need niidid siseste tõmbeliikmetena — need takistavad ülemisel ja alumisel paneelil väljapoole ümara kujuga punduda, sundides paneeli jääma lamedaks ja jäigaks.</p>
  <p>Tulemuseks on kerge, kaasaskantav konstruktsioon, mis talub sisemist rõhku 15 – 20 PSI — võrreldav kõva laua jäikusega, kuid täielikult tühjendatav ladustamiseks ja transpordiks.</p>

  <h2>Kuidas see toimib: füüsika</h2>
  <p>Tavalises täispuhutavas konstruktsioonis (nagu balloon või õhkmadrats) surub sisene õhurõhk kõigis suundades võrdselt. Ilma sisese pidamiseta muutub konstruktsioon silindriliseks või sfääriliseks. Drop Stitch lahendab selle tõmbe tugevdamisega:</p>
  <ul>
    <li>Tuhanded niidid ühendavad ülemise ja alumise kangakihi</li>
    <li>Ülespumbatuna üritab õhurõhk ülemist ja alumist osa lahku lükata</li>
    <li>Niidid takistavad seda lahutamist, kandes koormuse üle tõmbesse niidi telje suunas</li>
    <li>Tulemuseks on lame, jäik paneel, mis talub painutamist</li>
  </ul>

  <h2>Konstruktsiooniprotsess</h2>
  <ol>
    <li><strong>Kudumine:</strong> Polüesterniidid kootakse samaaegselt kahte eraldi põhikangakihti (tavaliselt 1,100 DTEX või 1,680 DTEX PVC-kattega polüester). Niidid kootakse kihtide vahele silmustena 90&deg; nurga all.</li>
    <li><strong>Katmine:</strong> Kootud põhikangas kaetakse PVC-ga (vahel TPU-ga) nuga-katmisega või kalendrikaatmisega. See suleb niidid ja loob õhukindla membraani.</li>
    <li><strong>Kihtide liitmine:</strong> Drop-Stitch tuum liidetakse välimiste laminaadikihtidega (tavaliselt 0.9 mm või 1.2 mm PVC) kuumlaminaatimise või liimiga.</li>
    <li><strong>Keevitamine:</strong> Ääreribad keevitatakse servade ümber kas kuumõhu-, RF- või kõrgsageduskeevitusega, et moodustada laua seinad.</li>
    <li><strong>Klappide paigaldamine:</strong> Paigaldatakse Bostoni või Halkey-Robertsi klapid, tavaliselt koos rõhuvabastusmehhanismiga, et vältida ülepuhumist.</li>
  </ol>

  <h2>Peamised kvaliteedinäitajad</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameeter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Algtase</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Niitide tihedus</td><td class="p-3 border">1 niit / ruut toll</td><td class="p-3 border">2 niiti / ruut toll</td></tr>
      <tr><td class="p-3 border">Põhikangas</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Maksimaalne rõhk</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC paksus</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Äärekonstruktsioon</td><td class="p-3 border">Volditud ja liimitud</td><td class="p-3 border">Keevitatud ja fusioonliidetud</td></tr>
    </tbody>
  </table>

  <h2>Rakendused</h2>
  <ul>
    <li><strong>SUP-lauad:</strong> 4" – 6" paksus, 15 – 20 PSI, 1 – 2 niiti/ruut toll</li>
    <li><strong>Kajakid:</strong> Drop-Stitch põrand + täispuhutavad külgkambrid, 10 – 15 PSI põrand</li>
  </ul>

  <h2>Drop Stitch vs õhkkate (klaaskiust või puitu tuum)</h2>
  <p>Kõvad laudad kasutavad EPS-vahtu tuumasid koos klaaskiu- või puidust pikielemendi tugevdusega. Need on kergemad, jäigemad ja reageerivamad — kuid neid ei saa tühjendada. Drop Stitch ohverdab osa jäikusest täieliku kaasaskantavuse kasuks. Enamiku vabaajakasutajate jaoks on tänapäevased 20 PSI Drop-Stitch SUP-id jäikuse poolest algataseme kõvalaudadest eristamatud.</p>

  <h2>Kuidas afarer kasutab Drop Stichi</h2>
  <p>afarer kasutab kogu oma SUP-valikus 1,680 DTEX Drop-Stitch tuuma koos 2 niidiga ruut tolli kohta ja 1.2 mm PVC välislaminaadiga. Laudade nimirõhk on 20 PSI ja enne saatmist läbivad need 24–48 tunni rõhupidamise testi 1.25-kordse nimirõhu juures. Ääreribad on kuumõhukeevitatud kolmekihilise fusiooniga ja rõhuvabastusklapid on kõigil mudelitel standardsed.</p>


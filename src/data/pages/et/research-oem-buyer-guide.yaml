content_html: |
  <h2>1. Eelkvalifikatsioon: mida tehases otsida</h2>

  <h3>Vastavussertifikaadid</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Kvaliteedijuhtimise süsteem</li>
    <li><strong>CE sertifikaat</strong> – Kontrollige teavitatud asutuse numbrit</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Sotsiaalse vastavuse auditid</li>
    <li><strong>REACH / RoHS</strong> – Materjalide vastavuse deklaratsioonid</li>
  </ul>

  <h3>Tootmisvõimekused</h3>
  <ul>
    <li>Drop-Stitch tuuma kudumine omas või alltööna</li>
    <li>PVC katmise / lamineerimise liin</li>
    <li>RF-keevitus- ja kuuma õhu keevitusseadmed</li>
    <li>Oma vormide valmistamine (CNC töötlemine)</li>
    <li>Testimislabor (rõhutestimine, UV vananemine, tõmbetestimine)</li>
  </ul>

  <h3>Kogemuste kontrollimine</h3>
  <ul>
    <li>Aastaid täispuhutavate veesõidukite tootmises (miinimum 5+ aastat)</li>
    <li>Inseneride arv koosseisus</li>
    <li>Olemasolevad OEM/ODM kliendid (küsige soovitusi)</li>
    <li>Eksport sihtkohad – kas nad saadavad juba teie sihtturule?</li>
  </ul>

  <h2>2. Kvaliteedikontrolli protokollid</h2>
  <p>Materjalide sissetuleku QC: tõmbetugevus (ASTM D751 või ISO 1421), rebenevuskindlus (ASTM D2261 või ISO 4674), adhesioonitugevus, UV vananemise valimikontrollid.</p>
  <p>Protsessis QC: õmblustugevuse jälgimine iga 50 ühiku järel, ventiilide momentide kontroll, Drop-Stitch lõime tiheduse kontrollid, mõõtmete kontroll CAD jooniste suhtes.</p>
  <p>Lõplik kontroll: 100% täispuhumise hoietest (24 tundi, maks. 5% langus), visuaalne kontroll, ventiilide funktsioonitest, juhuslik valimi testimine (AQL 2,5 või 4,0 vastavalt ISO 2859).</p>

  <h2>3. Vastavuse dokumentatsiooni kontroll-loend</h2>
  <ul>
    <li>Vastavuse deklaratsioon (DoC), mis viitab õigele EL direktiivile</li>
    <li>CE sertifikaat teavitatud asutuselt</li>
    <li>Akrediteeritud labori testiaruanne</li>
    <li>Materjalide ohutusandmleheded (MSDS)</li>
    <li>REACH vastavuse deklaratsioon</li>
    <li>Materjalide loend koos tarnijate jälgitavusega</li>
    <li>Tehase ülevaatuse aruanne</li>
  </ul>

  <h2>4. MOQ läbirääkimised</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Toote tüüp</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standardne MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Läbiräägitav vahemik</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP-lauad</td><td class="p-3 border">50 – 100 ühikut</td><td class="p-3 border">5 – 10 ühikut (proov)</td></tr>
      <tr><td class="p-3 border">Süstas</td><td class="p-3 border">50 – 100 ühikut</td><td class="p-3 border">5 – 10 ühikut (proov)</td></tr>
      <tr><td class="p-3 border">Täispuhutavad SUP-id</td><td class="p-3 border">50 – 100 ühikut</td><td class="p-3 border">2 – 5 ühikut (proov)</td></tr>
      <tr><td class="p-3 border">Ohutus / tarvikud</td><td class="p-3 border">200 – 500 ühikut</td><td class="p-3 border">50 – 100 ühikut (proov)</td></tr>
    </tbody>
  </table>

  <h2>5. Logistika ja saatmine</h2>
  <p>Levinud Incotermsid: <strong>FOB</strong> (Tehas tarnib väljumissadamasse – kõige levinum), <strong>EXW</strong> (Ostja korraldab kogu transpordi tehasest), <strong>CIF</strong> (Tehas maksab veose ja kindlustuse sihtsadamasse).</p>
  <p>Täispuhutavad tooted on kerge kaalu ja suure mahuga – mahukaal (DIM) määrab sageli saatmiskulud. Küsige vaakumpakendatud pakendeid, et vähendada mahtu 50–60% võrra. Meretransport Hiinast EL-i: 25–35 päeva; USA läänerannikule: 15–20 päeva.</p>

  <h2>6. Levinud vead</h2>
  <ul>
    <li><strong>Tehase audit puudub:</strong> Tehke alati ise või tellige kolmanda osapoole audit (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Ainult suulised spetsifikatsioonid:</strong> Üksikasjalik tehnilise spetsifikatsiooni leht mõlema poole poolt allkirjastatud</li>
    <li><strong>Proovide heakskiidu vahelejätmine:</strong> Kirjalik kinnitus proovidele enne masstootmist</li>
    <li><strong>QC puudumine tootmise ajal:</strong> Kolmanda osapoole kontroll tootmise ajal (DUPRO) ja enne saatmist (PSI)</li>
    <li><strong>Vastavuse eiramine:</strong> Kontrollige CE/UKCA sertifitseerimist enne tootmist</li>
  </ul>

  <h2>7. Miks Afarer</h2>
  <p>Afarer on tootnud OEM/ODM täispuhutavaid veesõidukeid alates 2012. aastast. 12 000 m&sup2; ISO 9001 sertifitseeritud objektiga, 25+ inseneriga ja CE sertifitseerimisega kõigis tootesarjades vastame me selle juhendi igale kriteeriumile. Pakume proovi-MOQ-sid uutele partneritele ja täielikke vastavuse dokumentatsiooni pakette.</p>


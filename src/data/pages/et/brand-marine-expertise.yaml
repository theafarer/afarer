meta:
  title: 'Merendusekspertiis — inseneerimine igas keres | {SITE}'
  description: 'Aastakümnete merenduse inseneerimine igas keres. afarer valdab Drop Stichi, mere-PVC-d ja professionaalset täispuhutavate SUP-ide disaini.'
  keywords:
    - 'merainseneerimine'
    - 'täispuhutavate supilaudade tootja'
    - 'supilaudade tootmine'
hero:
  tagline: 'Merendusekspertiis'
  title: 'Aastakümnete merainseneerimine<br />igas keres'
  subtitle: 'afarer ühendab sügava materjaliteaduse, täppistootmise ja reaalse maailma testimise, et toota veesõidukeid, mis toimivad siis, kui see oluline on.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'afarer merainseneerimise ja U&A meeskond tööl'
expertise_materials:
  tagline: 'Materjaliteadus'
  title: 'Õige materjali valik<br />iga rakenduse jaoks'
  subtitle: 'Me töötame kahe tuummaterjaliga — kumbki on valitud konkreetseteks kasutusjuhtumiteks ja jõudlusnõueteks.'
  columns: 3
  items:
    - title: 'Mereklassi PVC'
      description: '1100 denier PVC-kangas — meie mitmekülgseim materjal. UV-stabiliseeritud, kulumiskindel ja REACH-vastav. Ideaalne supilaudadele, kus kaal ja kulutõhusus on olulised.'
      icon: tabler:droplet
    - title: 'Klaaskiu ja polüetüleen'
      description: 'Klaaskiulaminaadiga SUP-id tipptasemel jäikuseks ja libisemiseks. Rotatsioonvalatud polüetüleen raskesse rendi- ja päästekasutusse, mis nõuab maksimaalset põrkekindlust.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Tootmisvõimekused'
  title: 'Täppistootmine<br />igal sammul'
  subtitle: 'Meie 12,000 m² rajatis on varustatud spetsialiseeritud masinatega iga tootmise etapi jaoks.'
  columns: 2
  items:
    - title: 'CNC-lõikamine'
      description: 'Arvutijuhitav lõikamine tagab täpsed, korratavad kangapaneelid minimaalse jäätmetega. Iga tükk istub täpselt nii, nagu disainitud.'
      icon: tabler:cpu
    - title: 'Kõrgsageduskeevitus'
      description: 'Tööstuslik HF-keevitus loob õmblused, mis on tugevamad põhimaterjalist. Ühtlane temperatuuri- ja rõhukontroll tagab õhukindlad tihendid igas tootmispartiis.'
      icon: tabler:bolt
    - title: 'Drop-Stitch tuuma koostamine'
      description: 'Tuhanded polüesterniidid ühendavad ülemise ja alumise kangakihi, võimaldades kõrgsurve puhumist (15-20 PSI) jäikadeks ja stabiilseteks supilaudadeks.'
      icon: tabler:building-arch
    - title: 'Rõhutestimine'
      description: 'Iga täispuhutav toode rõhutestitakse enne saatmist. Laudu testitakse 1.25-kordse nimirõhu juures — kui see peab seal vastu, toimib see vees.'
      icon: tabler:wind
    - title: 'Õmblusetugevuse testimine'
      description: 'Igast tootepartiist võetakse juhuslikke proove destruktiivseks õmblusetugevuse testimiseks. Tulemused logitakse ja on jälgitavad konkreetsete tootmispartiideni.'
      icon: tabler:files
    - title: 'Veetestimine'
      description: 'Iga mudel läbib enne sertifitseerimist meretestid. Reaalne testimine rannikutingimustes valideerib jõudluse, käitumise ja stabiilsuse.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Disain ja inseneerimine'
  title: 'Inseneeritud päris tingimustele'
  subtitle: 'Meie disainifilosoofia algab sellest, kuidas lauda kasutatakse — seejärel ehitatakse inseneerimine selle kasutusjuhu ümber.'
  items:
    - title: 'Jõudluskere disain'
      description: 'Iga kere kuju on häälestatud oma kasutusjuhu jaoks — veeväljatõrke vöörid turismilibisemiseks, lisatud rokker surfi kerguseks, lamedad stabiilsed profiilid kalastamiseks ja joogaks.'
    - title: 'Drop-Stitch ohutus'
      description: 'Igal laual on jäigast Drop-Stitch tuumast tugevdatud äärtega. Kui osa kahjustada, hoiab kõrge tõmbetugevusega Drop-Stitch struktuur laua töökorras.'
    - title: 'Ergonoomiline tekipaigutus'
      description: 'Tekikatte tsoonimine, kandekäepideme asukoht ja kinnituspunktid on disainitud sõitja mugavuse ümber pikaks kasutamiseks — olgu selleks turism, kalastamine või patrull.'
    - title: 'Kohandatud konfiguratsioon'
      description: 'Äärte värvid, tekikatte konfiguratsioon, tarvikute kinnitused, varustuse maht — iga mudelit saab kohandada vastama konkreetsetele operatsiooninõuetele.'
cta:
  title: 'On sul silmas konkreetne rakendus?'
  subtitle: 'Meie insenerimeeskond saab nõustada materjalide valiku, disaini ja tootmise osas sinu projektis.'
  actions:
    - variant: primary
      text: 'Küsi meie inseneridelt'
      href: /contact/
    - text: 'Vaata tootevalikut'
      href: /products/

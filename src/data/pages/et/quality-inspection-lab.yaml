intro: 'Iga laud, mis meie töökojast lahkub, kannab kinnitust, et see on läbinud kindlaksmääratud kvaliteediinspektsioonide ja materjalitestide komplekti. Meie kvaliteedi- ja inspektsioonilabor on sõltumatu funktsioon organisatsioonis — see allub otse tegevjuhile, mitte tootmisele — tagades, et ükski äriline surve ei saa kontrollpunkti ohustada. Kui materjalipartii või valmis laud ei vasta avaldatud spetsifikatsioonile, on laboril õigus saadetis peatada, kuni mittevastavus on kõrvaldatud.'

content_html: |
  <h2>Usalda, aga kontrolli</h2>
  <p>Labor töötab kvaliteedijuhtimissüsteemi alusel, mis on kooskõlas põhimõtetega, ja meie testimismeetodid põhinevad võimalusel ISO, ASTM ning EN standarditel. Peame iga tehtud testi kohta üksikasjalikku arvestust, luues täieliku jälgitavusahela toormaterjali vastuvõtust kuni laua lõpliku tarneni.</p>

  <h2>Testseadmed ja võimekused</h2>
  <table>
    <thead><tr><th>Seade</th><th>Tehtavad testid</th><th>Standard / meetod</th></tr></thead>
    <tbody>
      <tr><td>Universaalne katsemasin (50 kN)</td><td>Tõmbetugevus (kangas), eemalduskindlus (õmblused), rebendi levik</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Õhupidavuse testistend (programmmeeritav)</td><td>1000 tsükli täispuhumise/tühjendamise vastupidavus, 30-minutine rõhupidamise test</td><td>EN ISO 25649 (sisemine)</td></tr>
      <tr><td>Õmbluse eemaldamise seadis (mootoriga 180° eemaldus)</td><td>Keedetud ja liimitud õmbluste eemaldustugevus kiirusel 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Hüdrostaatilise rõhu testija</td><td>Kanga vee läbitavuskindlus (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Digitaalne paksuse mõõtja &amp; mikromeeter</td><td>Kanga paksus, ääre seina paksus, liimikile paksus</td><td>ISO 2286-3</td></tr>
      <tr><td>Kliimakamber</td><td>Temperatuuri konditsioneerimine (-40 °C kuni +80 °C) külmrebenemise ja kuumvananemise testideks</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Värvusspektofotomeeter</td><td>Delta-E värvimõõtmine pärast UV-kiiritust</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Kontrollpunktid — toormaterjalist tarneni</h2>
  <p>Iga laud järgib kindlaksmääratud kvaliteediplaani kohustuslike kontrollpunktidega. Ükski laud ei saa kontrollpunktist mööda minna; iga kontrollpunkti peab kvaliteediinspektor enne järgmise tootmisetapi algust kinnitama.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Kontrollpunkt 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Sissetuleva materjali kontroll</p>
            <p class="text-xs text-gray-500 mt-1">Kangapartii, liimipartii, riistvara — kõik kontrollitakse enne tootmisse vabastamist sissetuleku spetsifikatsiooniga.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Kontrollpunkt 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Protsessisisene keevituskontroll</p>
            <p class="text-xs text-gray-500 mt-1">Esimene keevitusproov testitakse (eemaldus + visuaalne) iga tootmisvahetuse alguses.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Kontrollpunkt 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kambri õhutest</p>
            <p class="text-xs text-gray-500 mt-1">Iga kamber rõhustatakse 1,5-kordse töörõhuni, hoitakse 30 min. Andmed logitakse seerianumbri kaupa.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Kontrollpunkt 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kontroll enne tarnet</p>
            <p class="text-xs text-gray-500 mt-1">Täielik laua kontroll: kõik kinnitused pingutatud, liitmikud töökorras, välimusdefekte ei ole. 100-punktiline kontroll-loend.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Kontrollpunkt 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Lõplik sertifitseerimine</p>
            <p class="text-xs text-gray-500 mt-1">Testiaruanded koostatud, inspektsiooniandmed üle vaadatud, vastavussertifikaat väljastatud.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Peamised kvaliteedinäitajad (2025 libisev keskmine)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Esmase läbimise saagis (kangapartii)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Keevituspraag (jooksva meetri kohta)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Kambrid õhutestitud enne koostamist</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">Disainikategooria vastavus</span>
    </div>
  </div>

  <h2>Meie kvaliteedimeeskond</h2>
  <p>Laboris töötab kvaliteedijuht (10 aastat merenduse kvaliteedikindluse alal, ASQ sertifitseeritud kvaliteediinsener), kaks kvaliteediinspektorit (mõlemal 2. taseme NDT sertifikaat visuaalses testimises) ja materjalide tehnik, kes vastutab kogu füüsilise testimise eest. Meeskond läbib iga-aastase oskustesti sõltumatu kolmanda osapoole teenusepakkuja juures, et tagada meie testitulemuste täpsus ja korratavus.</p>

  <h2>Sõltumatu testimine klientidele</h2>
  <p>Meie kvaliteedi- ja inspektsioonilabor pakub sõltumatuid testimisteenuseid. Kui teil on vaja kontrollida kanga spetsifikatsiooni, valideerida uut liimisüsteemi või hankida hanke kvalifitseerimiseks kolmanda osapoole testiaruanne, saame teha testid vastavalt kehtivale standardile ja väljastada sertifitseeritud testiaruande.</p>
  <p>Näiteid hiljutisest kolmanda osapoole testimistööst:</p>
  <ul>
    <li>Viie konkureeriva liimifilmtoote eemaldustugevuse võrdlus Euroopa sõjalise hankeprogrammi jaoks.</li>
    <li>Kiirendatud vananemise uuring (UV + termotsüklid) uue oranži pigmendiga PVC-koostise jaoks koos regulaarsete vahemõõtmistega 500-tunniste intervallidega.</li>
    <li>50 prototüüpi vaheseinaklapi õhupidavuse valideerimine uue kõrgsurvekambri disaini jaoks.</li>
  </ul>

  <h2>Meie kohustus teie ees</h2>
  <p>Kui saate afarer laua, saate ka selle kvaliteedimapi — koondatud ülevaate testitulemustest, mis kehtivad teie konkreetse laua kohta. Kangapartii sertifikaat, keevituste eemaldustestid, kambrite õhutesti logid ja kontroll-loend enne tarnet. Iga number on jälgitav. Iga inspektor on identifitseeritav. See ei ole lihtsalt paberimajandus — see on meie lubadus, et see, mida me tarnisime, on täpselt see, mida me määratlesime.</p>
  <p>Kui teil tekib kvaliteedikahtlus, võite laboriga otse ühendust võtta — kontaktandmed on trükitud teie vastavussertifikaadile. Me võtame iga päringu tõsiselt ja kohustume 48 tunni jooksul läbi viima ametliku uurimise.</p>


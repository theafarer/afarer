meta:
  title: 'R&D keskus | {SITE}'
  description: 'Uuringud ja arendus — PVC-kanga testimine, kere inseneritöö, RF-keevitus, hüdrodünaamiline testimine ja kvaliteedikontroll. Saadaval kohandatud R&D teenused.'

hero:
  tagline: 'R&D keskus'
  title: 'R & D keskus'
  subtitle: 'Fookuses areng'

intro:
  - 'afareri uuringute ja arenduse (R&D) keskus on jõud meie missiooni taga — revolutsioneerida veespordivarustust. Me võimaldame veespordi huvilistel kogu maailmas turvalisemaid, mugavamaid ja nauditavamaid tooteid tänu pidevale innovatsioonile täispuhutavates stand-up sõudelaudades (SUP). Meie pühendunud inseneride, disainerite ja veespordiekspertide meeskond kujundab tööstuse tulevikku, tõstes pidevalt kvaliteedi, jõudluse ja jätkusuutlikkuse latti.'
  - 'Meie R&D objekt ühendab materjaliteadlased, mereinsenerid ja tootmisinsenerid ühe katuse all. Kangakoostise ja kere simuleerimisest keevitusprotsesside arenduseni ja täismõõdus meretestideni juhib iga tootearenduse etappi andmed ja valideeritakse testimisega.'

mission:
  tagline: 'Meie missioon'
  title: 'Veespordi tuleviku innovatsioon'
  pillars:
    - icon: lightning
      title: 'Tehnoloogiline areng'
      desc: 'Uute materjalide, disainide ja tootmise rajamine parema tootejõudluse ja pikaealisuse jaoks.'
    - icon: design
      title: 'Kasutajakeskne disain'
      desc: 'Kasutajate vajaduste sügav mõistmine ja ületamine ergonoomilise ja intuitiivse tootedisaini kaudu.'
    - icon: globe
      title: 'Jätkusuutlikud praktikad'
      desc: 'Meie keskkonnajälje minimeerimine keskkonnasõbralike materjalide ja protsesside kasutamisega.'
    - icon: shield
      title: 'Järeleandmatu ohutus'
      desc: 'Kõrgeimate ohutusstandardite tagamine range testimise ja sertifitseerimisega.'

pillars:
  - title: 'Tehnoloogiline areng'
    desc: 'Uute materjalide, disainide ja tootmisprotsesside rajamine parema tootejõudluse ja pikaealisuse tagamiseks.'
    icon: tech
  - title: 'Täiustatud materjalid'
    desc: 'Uuendusliku PVC, komposiitide ja jätkusuutlike alternatiivide uurimine täiustatud tooteomaduste jaoks.'
    icon: materials
  - title: 'Jätkusuutlikkus'
    desc: 'Põhiline pühendumus: Oleme pühendunud keskkonna hoidmisele jätkusuutliku tootmise ja taaskasutatavate materjalide kaudu.'
    icon: sustainability

capabilities:
  tagline: 'Võimekused'
  title: 'R&D võimekused'
  subtitle: 'Neli põhidistsipliini, mis annavad meile lõpuni kontrolli tootearenduse üle — toormaterjali uuringutest lõpliku sertifitseerimiseni.'
  groups:
    - title: 'Materjaliteadus ja kangatehnoloogia'
      items:
        - 'PVC koostise analüüs ja optimeerimine'
        - 'UV-stabiliseerimine, leegiaeglustus ja antimikroobsete lisaainete arendus'
        - 'Mitmekihilise kanga lamineerimine ja adhesiooni inseneritöö'
        - 'Kiirendatud vananemise testimine (UV, termiline, niiskus, soolasprei)'
    - title: 'Kere inseneritöö ja hüdrodünaamika'
      items:
        - 'Parametriline 3D kere disain ja CFD optimeerimine'
        - 'Lõplike elementide analüüs struktuursetele ja löögikoormustele'
        - 'Mudelpukkide veokbasseini testimine ja jõudluse valideerimine'
        - 'Kohandatud kere arendus spetsiaalsete missiooniprofiilide jaoks'
    - title: 'Keevitus- ja ühendustehnoloogia'
      items:
        - 'RF-dielektrilise keevituse protsessi arendus ja optimeerimine'
        - 'Kuuma õhu, kuumkiilu ja ultraheli keevitusmeetodid'
        - 'Liimimine ja õmblusteibi kvalifikatsioon'
        - 'Keevitus tugevuse modelleerimine ja eluea prognoosimine'
    - title: 'Testimine, sertifitseerimine ja vastavus'
      items:
        - 'Kvaliteedijuhtimine ja CE vastavuse testimine'
        - 'Sõltumatu kolmanda osapoole testimine ja sertifitseerimise tugi'
        - 'Kohandatud testprotokollide arendus hank kvalifikatsiooniks'
        - 'Kasutusaegne rikeanalüüs ja põhjuste uurimine'


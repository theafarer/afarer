  inflatable: Täispuhutavad SUP-id on disainitud portatiivsuseks ilma jõudlust ohverdamata. Vali oma kaalule ja sõudestiilile sobiv suurus.
  sup: Staabilsõudelauad tuurimiseks, joogaks, fitnessiks ja vabaajasõitmiseks. Vali pikkuse ja sõitja kaalu järgi.

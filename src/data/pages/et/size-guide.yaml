how_to_choose:
  title: Kuidas valida õige suurus
  cards:
    - title: SUP-lauad
      description: Vali pikkus oma kaalu ja kasutuseesmärgi järgi. Laiemad laudad (32"+) pakuvad rohkem stabiilsust. Pikemad laudad (11-12 ft) hoiavad tuurimisel paremini kurssi. Raskemad sõudjad vajavad suurema mahutavusega laudu.
    - title: Tuurimise SUP-id
      description: Pikemad laudad (11–12 ft) on parimad vahemaa läbimiseks ja tuurimiseks. Laiemad laudad (32"+) pakuvad rohkem stabiilsust. Kontrolli kaalumahtuvust kogu koormuse jaoks, sealhulgas varustuse jaoks.
    - title: Universaalsed SUP-id
      description: Vali pikkus sõitja kaalu ja kasutuseesmärgi järgi. Universaalsed laudad sobivad vabaajaks, fitnessiks ja joogaks. Väiksemad laudad on manööverdatavamad.

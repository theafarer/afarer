hero:
  tagline: 'Eluviis'
  title: 'afarer<br />eluviis'
  subtitle: 'Loodud neile, kes elavad vee peal — alates nädalalõpu avastajatest kuni kommertsoperaatoriteni, kes loevad oma varustusele igapäevaselt.'

values:
  - icon: 🌊
    title: 'Veel sündinud'
    desc: 'Iga disain algab sellest, et mõistame, kuidas vesi käitub. Me inseneerime tingimuste servast sissepoole — sest ookean on meie õpetaja, mitte meie töökoht.'
  - icon: 🔧
    title: 'Ehitatud kestma'
    desc: 'Kõige jätkusuutlikum toode on see, mida ei pea asendama. Mereklassi materjalid, Drop-Stitch-tuumad hinnanguga 15 PSI ja õmblused, mis ületavad hooaja eluea.'
  - icon: '🏆'
    title: 'Disainilt kättesaadav'
    desc: 'Veesport ei tohiks olla luksus. Professionaalse klassi jõudlus hinnaga, mis on mõistlik peredele, giididele ja väikeoperaatoritele — mitte ainult kommertslaevastikele.'
  - icon: 🌍
    title: 'Globaalne kogukond'
    desc: 'Alates Qingdao rannikust kuni Euroopa järvedeni, Kagu-Aasia jõgedeni ja Ameerika lahtedeni — meie klientidel on ühine joon: armastus vee peal olemise vastu.'
  - icon: ♻️
    title: 'Vastutustundlik tootmine'
    desc: 'CNC-optimeeritud paigutus vähendab materjalijäätmeid alla 5%. Vastupidav ehitus vähendab asendamistsükleid. Me ehitame pikaealisuseks, sest see on kõige jätkusuutlikum valik.'
  - icon: 🤝
    title: 'Tugi, mis kestab'
    desc: 'Kahekümneaastaste kerede omanikud helistavad meile ikka veel varuosade järele. Meie garantii taotlustele reageeritakse keskmiselt 24 tunni jooksul. Me ei kao pärast müüki — oleme olemas toote kogu elueaks.'


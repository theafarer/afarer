faqs:
  title: 'OEM sõudjate tootmise KKK'
  subtitle: 'Vastused levinumatele küsimustele brändidelt, kes käivitavad oma sõudjat.'
  items:
    - title: 'Kuidas luua oma sõudja bränd?'
      description: 'Käivitage oma bränd 16 nädalaga: lühikirjeldus, disain, CE-sertifitseeritud prototüüp, masstootmine ja kohaletoimetamine. Uurige meie OEM-pakette.'
    - title: 'Mis on tootmise täitmisaeg?'
      description: 'Proov on valmis 2-3 nädalaga, masstootmine 30-45 päevaga sõltuvalt mahust.'
    - title: 'Kas sõudja kannab meie logo?'
      description: 'Jah — täielik eramärgis: logo trükkimine, kohandatud värvid, pakend ja sildid teie brändis.'
    - title: 'Kas saan osta hulgi esimesest päevast?'
      description: 'MOQ on 50 ühikut standardmudelitele, koos hulgi hinnatasemetega mahu kasvades.'

features3_certifications:
  title: 'Sertifikaadid ja vastavus'
  subtitle: 'Iga toode on sõltumatult testitud ja sertifitseeritud rahvusvaheliste standardite alusel.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'CE-sertifitseerimine'
      description: 'Kõik afareri supilauad vastavad Euroopa CE-ohutusstandardile vabaajakasutuseks. Iga toode läbib rõhu-, ujuvus- ja koormustesti enne tehasest väljumist.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'Meie 12,000 m² Qingdao tehas töötab ISO 9001 kvaliteedijuhtimissüsteemi alusel. Iga tootepartii on jälgitav, dokumenteeritud ja kontrollitud.'
      icon: 'tabler:clipboard-check'
    - title: 'BSCI sotsiaalne vastavus'
      description: 'Meil on BSCI sertifikaat, mis tagab eetilised tööpraktikad, ohutud töötingimused ja keskkonnavastutuse kogu tarneahelas.'
      icon: 'tabler:users'
    - title: 'REACH & RoHS'
      description: 'Kõik materjalid — PVC, EVA-vaht, liimid — vastavad ELi REACH ja RoHS määrustele. Piiratud aineid ei ole, järeleandmisi ei toimu.'
      icon: 'tabler:flask'
    - title: 'Materjalide katlaboratoorium'
      description: 'Sisemine materjalilabor testib enne tootmist iga kangapartii tõmbetugevust, UV-kindlust, õmbluste terviklikkust ja kulumiskindlust.'
      icon: 'tabler:microscope'
    - title: '2-aastane garantii'
      description: 'Iga afareri toode tuleb kaheaastase garantiiga tootmisvigade vastu. Me vastutame selle eest, mida toodame.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'Klientide usaldus'
  title: 'Mida meie kliendid ütlevad'
  subtitle: 'Esmakordsetest sõudjatest professionaalsete laevastikuoperaatoriteni — vaadake, miks nad afarerit usaldavad.'
  items:
    - content: 'Varustasime kogu meie rendilaevastiku afareri supilaudadega. Kahe hooaja jooksul pole ühtegi riket. CE-sertifikaat tegi kindlustuse kinnitamise sujuvaks.'
      name: 'Marco V.'
      title: 'Tuuri korraldaja, Horvaatia'
    - content: 'Esmase ostjana olin kvaliteedi suhtes murelik. Nende jagatud ISO-dokumentatsioon ja testiaruanded andsid mulle täieliku kindluse.'
      name: 'James T.'
      title: 'SUP Explorer 11 omanik, Kanada'
    - content: 'Me töötame afareriga meie rannikupatrulli üksuste jaoks. Nende kvaliteedikontrolli protsess on igas partiis ühtlane — selline usaldusväärsus on missioonikriitilistes operatsioonides oluline.'
      name: 'Lt. Cmdr. Andres'
      title: 'Riigihanked, Filipiinid'

steps2_manufacturing:
  title: 'Kuidas me kvaliteeti tagame'
  subtitle: 'Toormaterjali kontrollist kuni lõpliku rõhutestini — iga toode läbib range kvaliteediahela.'
  items:
    - title: 'Toormaterjali kontroll'
      description: 'Iga PVC-kangarull testitakse enne tootmisse laskmist paksuse, tõmbetugevuse ja UV-kindluse osas.'
      icon: 'tabler:search'
    - title: 'Protsessisisene kvaliteedikontroll'
      description: 'Keedusõlmi, klappide paigaldusi ja kambrite ühendusi kontrollitakse koostamise ajal igal tööjaamas.'
      icon: 'tabler:eye'
    - title: 'Rõhutestimine'
      description: 'Iga täispuhutav toode pumbatakse üles 1.25-kordse nimirõhuni (PSI) ja hoitakse 24–48 tundi, et kontrollida õhupidavust ja õmbluste terviklikkust.'
      icon: 'tabler:wind'
    - title: 'Lõppkontroll'
      description: 'Iga üksus kontrollitakse viimistluse, riistvara ja pakendi osas enne saatmiseks heakskiitmist. Partii proovid suunatakse meie laborisse destruktiivseks testimiseks.'
      icon: 'tabler:clipboard-check'

factory_audit:
  title: 'Tehase audit ja sotsiaalne vastavus'
  subtitle: 'Meie 12,000 m² Qingdao tehas on avatud kolmandate osapoolte audititele. Me hoiame ülal BSCI sotsiaalse vastavuse sertifikaati ja ootame hea meelelt klientide inspektsioone.'
  stats:
    - value: '12,000 m²'
      label: 'Tootmishoone'
    - value: '200+'
      label: 'Oskustöölised'
    - value: '15,000+'
      label: 'Aastane tootmismaht ühikutes'
    - value: 'BSCI'
      label: 'Sotsiaalne vastavus'
  highlights:
    - title: 'BSCI sertifikaat'
      desc: 'amfori BSCI sotsiaalse vastavuse sertifikaat — eetiline töö, ohutud tingimused, keskkonnavastutus.'
      link: '/certifications'
    - title: 'Avatud inspektsiooniks'
      desc: 'Ootame hea meelelt klientide tehaseauditite korraldamist. Broneerige külastus või virtuaalne tuur meie Qingdao tootmisliinidel.'
      link: '/factory'
    - title: 'Täielik jälgitavus'
      desc: 'Iga tootepartii on dokumenteeritud ja jälgitav — alates toormaterjali parteinumbritest kuni lõpliku kvaliteedikontrolli kinnitamiseni.'
    - title: 'ISO 9001:2015'
      desc: 'SGS-i poolt sertifitseeritud kvaliteedijuhtimissüsteem. Meie protsessid vastavad rahvusvahelistele tootmisstandarditele.'
      link: '/certifications'

warranty_section:
  title: 'Garantii ja järeltugi'
  subtitle: 'Me vastutame iga toote eest selgete garantiitingimuste, kiire nõuete menetluse ja originaalvaruosadega.'
  items:
    - title: '2-aastane tootegarantii'
      desc: 'Kõikidel afareri toodetel on 2-aastane garantii tootmisvigade vastu — õmbluse purunemine, klappide defektid ja materjali delamineerumine normaalse kasutamise korral.'
    - title: 'Eluaegne varuosade tugi'
      desc: 'Originaalvaruosad — klapid, remondikomplektid, uimed, D-rõngad — saadaval kõigile mudelitele. Me säilitame vorme ja tööriistu vähemalt 5 aastat pärast tootmise lõppu.'
    - title: '48-tunnine vastus nõuetele'
      desc: 'Garantiinõuded kinnitatakse 48 tunni jooksul. Heakskiidetud nõuete puhul saadetakse asenduslaudad 10 tööpäeva jooksul.'
    - title: 'Globaalne remondivõrgustik'
      desc: 'Volitatud remondikeskused enam kui 15 riigis. Väliremondi komplektid saadaval kaugoperatsioonideks. Ise-remonti juhendid väikeste kahjustuste jaoks.'
    - title: 'OEM klienditugi'
      desc: 'Pühendunud kontohaldurid B2B-partneritele. Kvartaalsed äriülevaated, laoplaanimine ja ühisturunduse tugi.'
    - title: 'Sertifitseerimispakett'
      desc: 'Täielik vastavusdokumentatsioon iga saadetisega — CE-deklaratsioon, testiaruanded, materjalide ohutusandmelehed.'
      link: '/contact'

trust_resources:
  title: 'Usaldusressursid'
  subtitle: 'Laadige alla meie sertifitseerimisportfell, kvaliteedikontrolli aruanded ja vastavusdokumentatsioon.'
  items:
    - title: 'Sertifitseerimisportfell'
      desc: 'CE, ISO 9001, BSCI, REACH, RoHS, AS 1799 sertifikaadid ühes paketis.'
    - title: 'Kvaliteedikontrolli testimisstandardite aruanne'
      desc: '24–48-tunnised rõhupidamise testid, UV-vananemine ISO järgi, tõmbetugevuse valideerimine — täielik metodoloogia.'
    - title: 'Tehase profiil ja auditiaruanne'
      desc: '12,000 m² tehase ülevaade koos tootmisliinide fotode ja kolmanda osapoole audi kokkuvõttega.'
    - title: 'Garantiipoliitika dokument'
      desc: 'Täielikud garantiitingimused, nõuete menetlus ja varuosade hinnad.'
  cta_text: 'Küsi usaldusressursse'
  cta_link: '/contact'

faqs_sup:
  title: 'Supilaudade KKK'
  subtitle: 'Korduma kippuvad küsimused meie supilaudade kohta.'
  columns: 2
  items:
    - title: 'Millistes suurustes supilaudu afarer pakub?'
      description: 'Pakume supilaudu suurusega 9 ft kuni 12 ft, hõlmates kõike alates kompaktsetest universaalsetest laudadest kuni turismi- ja eridisainideni. Iga mudel on saadaval mitmete konfiguratsioonivalikutega.'
    - title: 'Mis vahe on täispuhutaval SUP-il ja kõval SUP-il?'
      description: 'Täispuhutav SUP kasutab Drop-Stitch konstruktsiooni tuhandete siseste niitidega, mis võimaldavad kõrget õhurõhku, samas kui kõva SUP kasutab epoksü- või klaaskiudu. Täispuhutavad SUP-id pakuvad kaasaskantavust ja mugavat säilitamist ilma jäikust ohverdamata.'
    - title: 'Mis on supilaudade kaalupiir?'
      description: 'Meie supilauad kannavad sõltuvalt mudelist ja mahust kuni 150 kg. Igal tootelehel on esitatud teie konkreetse mudeli maksimaalne koormushinne.'
    - title: 'Kas afareri supilauad on CE-sertifitseeritud?'
      description: 'Jah. Kõik vabaaja SUP-mudelid on CE-sertifitseeritud vastavalt kehtivatele Euroopa standarditele vabaajakasutuseks.'
    - title: 'Milline on supilaudade garantii?'
      description: 'Kõik afareri supilauad tulevad standardselt üheaastase garantiiga tootmisvigade vastu, hõlmates õmbluse purunemist, klappide defekte ja materjali delamineerumist normaalse kasutamise korral.'
    - title: 'Kui kaua võtab supilaua ülespuhumine aega?'
      description: 'Kaasasoleva käsipumbaga võtab täielik ülespuhumine 15 PSI-ni umbes 8–12 minutit. Kiirema puhumise jaoks soovitame afareri 12V elektripumpa, mis pumbab laua üles vähem kui 4 minutiga.'

faqs_materials:
  title: 'SUP-i materjalide ja hoolduse KKK'
  subtitle: 'Korduma kippuvad küsimused meie täispuhutavate supilaudade materjalide, hoolduse ja säilitamise kohta.'
  columns: 2
  items:
    - title: 'Milliseid materjale kasutatakse afareri täispuhutavates supilaudades?'
      description: 'Kasutame sõjaväeklassi PVC-d (1100 denier) UV-stabiliseeritud, kulumiskindla konstruktsiooniga, mis vastab ELi REACH ja RoHS määrustele.'
    - title: 'Kui kaua täispuhutavad supilauad vastu peavad?'
      description: 'Nõuetekohase hoolduse korral kestab kvaliteetne täispuhutav PVC-supp 5–10 aastat. Regulaarne puhastamine, UV-kaitse ja õige säilitamine pikendavad teenindusiga oluliselt.'
    - title: 'Millist hooldust vajab täispuhutav SUP?'
      description: 'Põhihooldus hõlmab mageveega loputamist pärast iga kasutamist (eriti soolvees), kuivatamist enne säilitamist, klapitihendite aastast kontrollimist ning pikaajalise otsese päikese käes hoidmise vältimist, kui laud pole kasutusel.'
    - title: 'Kas täispuhutavaid supilaudu saab kasutada soolvees?'
      description: 'Jah. Kõik afareri täispuhutavad supilauad on mõeldud nii mage- kui ka soolveeks. Soovitame pärast soolvees kasutamist laud mageveega loputada ja põhjalikult kuivatada.'
    - title: 'Kuidas täispuhutavat supilauda säilitada?'
      description: 'Tühjendage, puhastage ja kuivatage laud enne säilitamist täielikult. Rullige laialt (vältige tihedaid volte), säilitage jahedas kuivas kohas eemal otsesest päikesevalgusest ja hoidke eemal betoonpõrandatest, et vältida niiskuse tõmbumist.'
    - title: 'Milline on afareri täispuhutavate supilaudade kandevõime?'
      description: 'Kandevõimed ulatuvad 100 kg meie väikseimate mudelite puhul kuni üle 200 kg suurematel laudadel. Igal tootelehel on esitatud teie konkreetse mudeli maksimaalne koormushinne.'


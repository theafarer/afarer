meta:
  title: 'Usaldus — kvaliteet, standardid ja maine | {SITE}'
  description: 'Miks usaldada afarer: CE- ja ISO-sertifikaadid, integreeritud tehas, ülemaailmsed viited ja garantii. Professionaalne täispuhutavate supilaudade tootja.'
  keywords:
    - 'usaldusväärne supi tootja'
    - 'sertifitseeritud supilauatehas'
    - 'usaldusväärne supi tarnija'
    - 'sertifitseeritud supi tehas'

content_html: |
  <h2>Mis on CE-sertifitseerimine?</h2>
  <p>CE-märgis (Conformit&eacute; Europ&eacute;enne) näitab, et toode vastab ELi tervise-, ohutus- ja keskkonnanõuetele. Täispuhutavate veesõidukite puhul sõltub kohaldatav regulatoorne raamistik toote kategooriast.</p>

  <h2>Kohaldatavad direktiivid</h2>

  <h3>Vabaajaveesõidukite direktiiv (2013/53/EU)</h3>
  <p>ELi peamine direktiiv vabaajaveesõidukitele. Alla 2.4 m täispuhutavad SUP-id jäävad selle ulatusest välja ja sertifitseeritakse vastavalt EN ISO 25649-le.</p>

  <h3>Isikukaitsevahendite määr (2016/425)</h3>
  <p>Veestusvestid, ujuvusabivahendid ja ohutusvarustus, mida veesõidukitega tarnitakse, peavad vastama isikukaitsevahendite määruse nõuetele, sealhulgas tüübieksamile (moodul B) teavitatud asutuse poolt ja tootmise kvaliteedikindlusele (moodul D või E).</p>

  <h2>Sertifitseerimisprotsess</h2>
  <ol>
    <li>Toote klassifitseerimine: määratle veesõiduki disainikategooria (A – D vastavalt ISO 8666-le)</li>
    <li>Kohaldatavad standardid: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (ehitaja plaat)</li>
    <li>Tehnilise faili ettevalmistus: disainijoonised, materjalide loend, materjalide sertifikaadid, riskihinnang</li>
    <li>Tüübitestimine: ujuvus, stabiilsus, koormusvõime, materjalide testimine, õmbluse tugevus, õhupidavus</li>
    <li>Tehase tootmiskontroll: teavitatud asutuse audit tootmisprotsessidele</li>
    <li>Vastavusdeklaratsioon: tootja allkirjastab DoC-i ja kinnitab CE-märgise</li>
  </ol>

  <h2>Teavitatud asutused täispuhutavate veesõidukite jaoks</h2>
  <p>Tavalised teavitatud asutused on Bureau Veritas (Prantsusmaa), DNV GL (Saksamaa), RINA (Itaalia), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Saksamaa).</p>

  <h2>Ajakava ja kulud</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Etapp</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Kestus</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tüüpiline kulu (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Tehnilise faili ettevalmistus</td><td class="p-3 border">2 – 4 nädalat</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Tüübitestimine</td><td class="p-3 border">4 – 8 nädalat</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Tehase audit</td><td class="p-3 border">1 – 2 päeva (kohapeal)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Kokku (esimene toode)</td><td class="p-3 border">8 – 14 nädalat</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Mida see ostjate jaoks tähendab</h2>
  <p>CE-sertifitseeritud täispuhutavaid SUP-e ostes kontrolli alati, et CE-märgis on ehitaja plaadil, kehtiv DoC on olemas, teavitatud asutuse number on loetletud ja kasutusjuhend sisaldab ohutusjuhiseid sinu kohalikus keeles. Kõik afarer tooted kannavad CE-sertifikaati koos täieliku jälgitavusega teavitatud asutuse auditi aruanneteni.</p>


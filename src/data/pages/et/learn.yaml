hero:
  tagline: 'Vee avastamise teadmised'
  title: 'Õpi'
  subtitle: |
    Juhendid, õpetused ja süvauuringud — kõik, mida vajate enesekindlaks<br />
    vee avastamiseks. Esimese SUP-i valimisest edasijõudnute tehnikate omandamiseni.
  taglineSection: 'Teadmised igale sõudjale. Algajast professionaalini.'

featured:
  tagline: 'Esiletõstetud teemad'
  title: 'Alusta oma õppimiseekonda'
  subtitle: 'Olenemata sellest, kas olete veespordis uus või soovite taset tõsta, meie juhendid katavad kõik.'
  items:
    - title: 'SUP-i põhitõed'
      description: 'Kõik, mida algaja peab teadma — lauatüübid, sõuja suurused, asend ja esimese päeva nõuanded.'
      icon: 'tabler:lifebuoy'
      href: '/learn/sup/'
    - title: 'Täispuhutav vs kõva laud'
      description: 'Kumb sobib teile? Võrdleme portatiivsust, jõudlust, vastupidavust ja kulu kõrvuti.'
      icon: 'tabler:arrows-left-right'
      href: '/compare/inflatable-vs-hardboard/'
    - title: 'Veeohutus'
      description: 'Olulised ohutusteadmised, mida igal sõudjal peaks olema — ilm, päästevestid, isepääste ja palju muud.'
      icon: 'tabler:shield'
      href: '/learn/water-safety/'
    - title: 'Materjalide juhend'
      description: 'PVC-klassid, Drop-Stitch tehnoloogia, denier-hinnangud — mõista, millest teie varustus on tehtud.'
      icon: 'tabler:flask'
      href: '/learn/materials/'
    - title: 'SUP-i suuruse juhend'
      description: 'Leia õige lauapikkus, laius ja maht oma kaalu, oskuse ja sõudmisstiili jaoks.'
      icon: 'tabler:ruler'
      href: '/size-guide/'
    - title: 'Kesktaseme tehnikad'
      description: 'Tõsta oma sõudmist edasijõudnute tõmmete, pööramistehnikate ja tormise veega käitlemisega.'
      icon: 'tabler:droplet'
      href: '/learn/intermediate-techniques/'


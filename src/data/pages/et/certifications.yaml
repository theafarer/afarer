meta:
  title: 'Sertifikaadid — CE, ISO 9001 ja vastavus | {SITE}'
  description: 'afarer kvaliteedisertifikaadid: CE (EN ISO 25649), ISO 9001:2015, BSCI. Vastavus ja ohutus täispuhutavate SUP-ide tootjale.'
  keywords:
    - 'ce certification sup'
    - 'iso 9001 sup'
    - 'nautical compliance'
    - 'sõudelaua sertifitseerimine'
hero:
  tagline: 'Sertifikaadid ja standardid'
  title: 'Kvaliteedisertifikaadid<br />ja vastavusstandardid'
  subtitle: 'afarer SUP-i tootmine on sertifitseeritud vastavalt rahvusvahelistele mereohutuse standarditele, kvaliteedijuhtimise süsteemidele ja keskkonnareeglitele — CE, ISO 9001, UKCA, BSCI ja REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'afarer kvaliteedisertifikaadid ja vastavuse dokumentatsioon'
content_certifications:
  tagline: 'Meie sertifikaadid'
  title: 'Sertifitseeritud kvaliteet,<br />globaalselt tunnustatud'
  subtitle: 'Iga afarer toode on toetatud sertifikaatidega, mis tõestavad meie pühendumust kvaliteedile, ohutusele ja keskkonnavastutusele.'
  items:
    - title: 'CE sertifitseeritud'
      description: 'Kõik afarer tooted vastavad Euroopa CE-märgistuse nõuetele vabaaja veesõidukitele, tagades ohutus-, tervise- ja keskkonnakaitse standardite täitmise.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Meie kvaliteedijuhtimise süsteem on ISO 9001:2015 sertifitseeritud, hõlmates täispuhutavate veesõidukite ja mereseadmete disaini, tootmist ja levitamist.'
      icon: tabler:clipboard-check
    - title: 'UKCA märgistatud'
      description: 'Suurbritannia turul müüdavad tooted kannavad UKCA märgistust, kinnitades vastavust Suurbritannia mere- ja isiklike veesõidukite määrustele.'
      icon: tabler:shield
    - title: 'BSCI vastavus'
      description: 'afarer on BSCI (Business Social Compliance Initiative) auditeeritud, tõestades eetilisi tootmispraktikaid, õiglasi töötingimusi ja tarneahela vastutust.'
      icon: tabler:heart-handshake
    - title: 'REACH vastavus'
      description: 'Kõik afarer toodetes kasutatavad materjalid vastavad EL REACH keemilise ohutuse määrustele, tagades piiratud ainete puudumise meie PVC-s, EVA-s või komponentides.'
      icon: tabler:flask
    - title: 'Materjalide testimine'
      description: 'Kangaid testitakse tõmbetugevuse, rebenevuskindluse, UV-degradatsiooni ja külmpraagile jõudluse osas. Iga tootmispartii valimitakse ja kontrollitakse.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Tehase standardid'
  title: 'Tootmise suurepärasus<br />— ehitatud spetsifikatsioonile'
  subtitle: 'Meie 12 000 m² objekt töötab range kvaliteedikontrolli protokollide all igal tootmise etapil.'
  list:
    - 'Sissetuleva materjali kontroll: Kõik toormaterjalid — PVC-kangas, EVA-vaht, liimid, riistvara — testitakse spetsifikatsioonide suhtes enne tootmisse sissemist.'
    - 'Protsessis kvaliteedikontroll: Igal tootmisetapil on dokumenteeritud QC kontrollpunktid. Keevitus tugevus, õmbluse joondus, ventiilide paigaldus ja liidete moment kontrollitakse liinis.'
    - 'Rõhutestimine: Iga täispuhutav kamber rõhutestitakse 1,25× nimirõhul 24–48 tundi. Rõhu langus peab jääma alla 5% läbimise hindeks.'
    - 'Lõplik kontroll: Valmis tooteid kontrollitakse mõõtetäpsuse, välimuse viimistluse, tarvikute täielikkuse ja pakendi terviklikkuse osas enne saatmist.'
    - 'Partiide jälgitavus: Igal tootel on seerianumber, mis on seotud tootmispartii kirjetega, võimaldades täielikku jälgitavust toormaterjalist valmis kaubani.'
content_safety:
  tagline: 'Mereohutuse standardid'
  title: 'Ohutus esikohal<br />— disainitud usaldusväärseks toimimiseks'
  subtitle: 'afarer tooted on disainitud ja testitud vastama rahvusvahelistele mereohutuse standarditele äriliseks ja vabaaja kasutuseks.'
  items:
    - title: 'EN ISO 25649'
      description: 'Täispuhutavad SUP-id vastavad EN ISO 25649 standarditele ehituse, stabiilsuse, ujuvuse ja koormusmahtuvuse osas.'
      icon: tabler:sailboat
    - title: 'SOLAS vastavus'
      description: 'Ohutusvarustus ja elupäästvahendid vastavad SOLAS (Safety of Life at Sea) nõuetele, kus kohaldatav.'
      icon: tabler:lifebuoy
cta:
  title: 'Vajate sertifitseeritud tooteid oma projektile?'
  subtitle: 'Võtke ühendust meie meeskonnaga, et arutada sertifitseerimise nõudeid, dokumentatsiooni ja vastavust teie turule.'
  actions:
    - variant: primary
      text: 'Küsi sertifitseerimise dokumente'
      href: /contact/
    - text: 'Vaata meie kvaliteedi lehte'
      href: /quality/

meta:
  title: 'Tehnoloogia — Drop Stitch ja mere-PVC | {SITE}'
  description: 'afarer tehnoloogiad: Drop-Stitch ehitus, mereklassi PVC, kahekihilised konstruktsioonid ja kõrgrõhk. Innovatsioon professionaalselt täispuhutavate SUP-ide tootjalt.'
  keywords:
    - 'supi tehnoloogia'
    - 'drop stitch ehitus'
    - 'kõrgrõhu sup'
    - 'täispuhutavate supilaudade materjalid'
hero:
  tagline: 'Tehnoloogia'
  title: 'Ehitatud jõudluseks'
  subtitle: 'Iga afarer täispuhutav SUP on inseneeritud Drop-Stitch-konstruktsioonist ja mereklassi PVC-st — täpsed materjalid ja tootmismeetodid, mis on testitud nõudlikes merekeskkondades.'

sections:
  - title: 'Drop-Stitch-tuum'
    description: 'Tuhanded sisemised polüesterlõimed ühendavad ülemise ja alumise kihi, luues jäiga struktuuri 12-15 PSI juures. See on sama tehnoloogia, mida kasutatakse professionaalsetes sõudelaudades ja täispuhutavates võidlus-SUP-ides.'
    imageAlt: 'DS-tuumi diagramm'
  - title: 'Mereklassi PVC'
    description: 'Mitmekihiline laminaat-PVC-kangas, mis on hinnatud merekeskkondadeks. Iga kiht on survekeevitatud, mitte liimitud, mis välistab delaminatsiooniriski. Testitud UV-kindluse, soolvee korrosiooni ja kulumise suhtes.'
    imageAlt: 'PVC kiht'
  - title: 'Sõjaväeklassi PVC'
    description: 'Kasutusel kõigis SUP-mudelites, premium-PVC pakub ületamatut UV- ja keemilist vastupidavust. Säilitab paindlikkuse ekstreemsetes temperatuurides ja vastupidab degradeerumisele.'
    imageAlt: 'PVC'
  - title: 'Õhutekk'
    description: 'Kõrgrõhuline täispuhutav Drop-Stitch-konstruktsioon, mis pakub erakordset jäikust seismiseks, kalastamiseks ja joogaks. Vähendab paigaldusaega, kogukaalu ja hoiuruumi.'
    imageAlt: 'Õhutekk'


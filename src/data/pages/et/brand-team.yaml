meta:
  title: 'Meie meeskond — mereinsenerid ja ehitajad | {SITE}'
  description: 'Asutatud 2012. aastal Qingdaos, afarer on ehitatud mereinseneride, materjaliteadlaste ja veespordi huviliste poolt. Kohtuge tehas taga oleva meeskonnaga.'
  keywords:
    - 'afarer team'
    - 'marine engineers'
    - 'täispuhutavate SUP-ide tootja'
    - 'sup factory team'
hero:
  tagline: 'Meie meeskond'
  title: 'Inimesed afareri taga<br />— inseneritöö vabadus vees'
  subtitle: 'Asutatud 2012. aastal Qingdaos Hiinas, afarer on ehitatud mereinseneride, materjaliteadlaste ja veespordi huviliste poolt, kes uskusid elukutselise klassi täispuhutavate veesõidukite kättesaadavusse kogu maailmas.'
  image:
    src: /images/team-all.webp
    alt: 'afarer kogu meeskonna foto — inseneritöö, tootmine ja juhtkond'
founding:
  tagline: 'Meie asutamine'
  title: 'Rannikutöökojast<br />12 000 m² objektini'
  subtitle: 'afarer asutas mereinsenerite meeskond, kellel on kokku aastakümneid kogemust täispuhutavate SUP-ide disainis, PVC-töötlemises ja globaalses mereseadmete tootmises.'
  items:
    - title: 'Asutatud: 2012'
      description: 'Asutatud Qingdaos Hiinas — suur merenduskeskus sügava laevaehituse pärandiga.'
      icon: tabler:calendar
    - title: '200+ töötajat'
      description: 'Sealhulgas 50+ R&D insenerid, kvaliteedikontrolli spetsialistid ja tootmistehnikud.'
      icon: tabler:users
    - title: '12 000 m² objekt'
      description: 'Eraldatud tootmisettevõte koos 6 tootmisliiniga täispuhutavate SUP-laudade jaoks.'
      icon: tabler:building-factory
    - title: '50+ riiki teenindatud'
      description: 'Eksport Euroopasse, Ameerikasse, Lähis-Itta, Aasia-Vahemere piirkonda ja Aafrikasse.'
      icon: tabler:globe
leadership:
  tagline: 'Juhtkond'
  title: 'Juhtimine ja insenerijuhtkond'
  subtitle: 'Meie juhtimismeeskond ühendab sügava ekspertiisi mereinseneritöös, rahvusvahelises kaubanduses ja kvaliteedijuhitsemises.'
  columns: 3
  items:
    - title: 'Asutaja ja tegevjuht'
      name: 'Toby Liu'
      description: '15+ aastat meretootmises. Varem juhtis R&D-d suures Hiina sõudesporditootjas. Omab mitmeid patente täispuhutavate SUP-ide disainis.'
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: 'Peainsener'
      name: 'Zhang Wei'
      description: '20+ aastat PVC-töötlemises ja Drop-Stitch disainis. Endine tehniline direktor Euroopa sõudespordi brändis.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'R&D juht'
      name: 'Chen Ming'
      description: 'Materjaliteaduse doktorikraad. Spetsialiseerunud Drop-Stitch tehnoloogiale ja kõrgsageduskeevituse protsessidele. 10+ aastat tekstiilkomposiitides.'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Tootmisdirektor'
      name: 'Liu Qiang'
      description: '18+ aastat lean-tootmises ja tootmisliinide optimeerimises. Six Sigma must vöö. Rakendanud ISO 9001 kvaliteedisüsteeme.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Kvaliteedijuht'
      name: 'Wang Fang'
      description: '12+ aastat mere kvaliteedikontrollis. Sertifitseeritud CE ja ISO auditi. Järelvalvab iga tootmispartii testimist.'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Müügi ja tegevuse direktor'
      name: 'Helen Lee'
      description: '15+ aastat rahvusvahelises B2B kaubanduses. Haldanud kaasbrändi ja levitamise partnerlusi üle 30 riigis. Valdab 4 keelt.'
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: 'Disainifilosoofia'
  title: 'Inseneripõhine disain<br />— iga detail loeb'
  subtitle: 'Meie insenerifilosoofia põhineb kolmel põhimõttel, mis juhivad iga meie toodetud toodet.'
  list:
    - 'Usaldusväärsus esikohal: iga afarer toode on testitud, et vastu pidada reaalsetes tingimustes — külma veest päästeoperatsioonidest troopiliste kuurortide rendini. Me üle-insenereerime seal, kus see on kõige olulisem.'
    - 'Tootmise täpsus: Meie objektid kasutavad CNC-lõikamist, kõrgsageduskeevitust ja automaatset rõhutestimist. Iga õmblus, iga ventiil, iga liide vastab dokumenteeritud spetsifikatsioonidele.'
    - 'Pidev innovatsioon: Meie R&D meeskond hindab pidevalt uusi materjale, tootmismeetodeid ja disaini parandusi. Me ei oota probleeme — me prognoosime neid.'
cta:
  title: 'Soovite arutada projekti meie meeskonnaga?'
  subtitle: 'Meie insenerid on valmis nõustama toote valiku, kohandamise ja kaasbränditud kollektsioonide osas.'
  actions:

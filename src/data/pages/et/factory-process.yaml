meta:
  title: 'Tootmisprotsess — toormaterjalist SUP-ini | {SITE}'
  description: 'Toormaterjalist merivalmis SUP-ini: iga afarer tootmisprotsessi samm meie kontrolli all, alates lõikamisest ja keevitamisest kuni testimiseni.'
  keywords:
    - 'supi tootmisprotsess'
    - 'täispuhutavate supilaudade tehas'
    - 'supilaudade tootmise sammud'
    - 'pvc keevitus sup'
hero:
  tagline: 'Protsess'
  title: 'Tootmisprotsess'
  subtitle: 'Toormaterjalist veepidavaks lauaks — iga samm meie kontrolli all'
  back_label: 'Tagasi tehasesse'
  back_link: /factory/

intro: 'Erinevalt kaubamärkidest, kes tellivad tootmist kolmanda osapoole tehastest, omab ja haldab afarer kogu oma tootmisahelat. See vertikaalne integratsioon võimaldab meil hoida ranget kvaliteedikontrolli igas etapis, reageerida kiiresti kohandatud nõuetele ja tarnida ühtlast tootekvaliteeti partii partii järel. Nii ehitatakse laud meie rajatises.'

steps:
  - step: '01'
    title: 'Materjalide vastuvõtt ja kontroll'
    description: 'Iga sissetulev PVC-kanga, klaaskiumatti, vaikude ja riistvara partii kontrollitakse spetsifikatsiooniga. Kangaproove testitakse enne tootmisse vabastamist tõmbetugevuse, paksuse ühtluse ja UV-kindluse osas. Mittevastavad materjalid pannakse karantiini ja tagastatakse.'
    duration: '1–2 päeva'
  - step: '02'
    title: 'Automaatne PVC-lõikamine'
    description: 'Heakskiidetud kangad laotakse automaatsele CNC-lõikemasinale ja lõigatakse millimeetrist täpsemalt. Arvutioptimeeritud paigutus korraldab paneelid jäätmete minimeerimiseks — tavaliselt alla 5%. Lõigatud paneelid märgistatakse mudeli ja kambri järgi ning komplekteeritakse ülekandmiseks keevitustöökotta.'
    duration: '2–4 tundi laua komplekti kohta'
  - step: '03'
    title: 'Torude soojusliitmine ja keevitus'
    description: 'Paneelid kinnitatakse ja liidetakse soojusliitmismasinate abil kuumõhukeevitusega kontrollitud temperatuuridel 200–300 °C. Põhiõmblused tugevdatakse RF-dielektrilise keevitusega õhukindlateks, suure tugevusega ühendusteks. Valmis kambrite rõhustatakse 1.5-kordse töörõhuni 30-minutiliseks õhupidavuse valideerimiseks.'
    duration: '1–2 päeva laua kohta'
  - step: '04'
    title: 'SUP-ide trükk ja dekoreerimine'
    description: 'Supilaudade tekigraafika kantakse digitaaltrükiga täisvärvi fotokvaliteediga disainide jaoks ning siiditrükiga vastupidavate logode ja korduvate mustrite jaoks. Trükid kuivatatakse ja tihendatakse UV- ja kulumiskindluse tagamiseks.'
    duration: '1–2 päeva'
  - step: '05'
    title: 'Lõplik koostamine ja varustamine'
    description: 'Lauad varustatakse koostusliinil uimede, klappide, EVA-tekke ja tarikutega. Iga üksus järgib 100-punktilist kooste kontroll-loendit koos kohustusliku kinnitusega igas etapis.'
    duration: '2–4 päeva'
  - step: '06'
    title: 'Kvaliteeditestimine ja kontroll'
    description: 'Iga valmis laud läbib kohustusliku kvaliteedikontrollpunkti: kambri õhupidavuse test, riistvara toimimise kontroll, kinnituste momentide verifitseerimine ja välimusinspektsioon. Kohandatud ja prototüüpiehitised saavad lisaks veetestid, mis hõlmavad stabiilsust ja käitumist.'
    duration: '1–2 päeva'
  - step: '07'
    title: 'Pakendamine ja saatmine'
    description: 'Lauad tühjendatakse, volditakse juhendi järgi, pakitakse vastupidavatesse kootud kottidesse või vineerkastidesse ja laaditakse saadetiseks. Iga pakend on märgistatud mudeli, seerianumbri ja sihtkohaga. Me koordineerime veomaailmijatega FCL ja LCL konteinerisaadetiste jaoks üle kogu maailma.'
    duration: '1 päev'


hero:
  tagline: 'Tehas'
  title: 'Tehas ja tootmine'
  subtitle: '12 000 m² integreeritud tootmist — toormaterjalist valmis lauani'

intro:
  - 'Aquafarer LLC (USA) tootmisüksusena juhib afarer Qingdao meeskond kõiki tootmisetappe — PVC- ja klaaskiudmaterjalide saabumisest kuni valmis lauani enne väljastust tehtava lõpliku ülevaatusega. Meie tootmisüksus Qingdao majandusarengu tsoonis hõlmab 12 000 ruutmeetrit ja mahutab eraldatud töökojad PVC lõikamiseks, torude kuumkeevitamiseks, FRP-vormide valmistamiseks, SUP digitaalseks trükkimiseks, lõplikuks kokkupanekuks ja kvaliteeditestimiseks.'
  - 'Ühendades disaini, inseneritöö, prototüübid, tootmise ja testimise ühe katuse all, väldime allhanketootmise ebatõhusust ja säilitame otsese kontrolli ehituskvaliteedi, materjalivaliku ja tarneajad üle. Iga meie töökojast väljuv laud on ehitatud meie inimeste poolt, meie seadmetel, meie standardite järgi.'


qc_section:
  tagline: 'Kvaliteedikontroll'
  title: 'Testimise ja kvaliteedikindluse protsess'
  subtitle: 'Iga laual läbib kohustusliku testimise enne saatmist. Meie kvaliteedilabor tegutseb tootmisest sõltumatult ja annab aru otse juhtkonnale.'
  steps:
    - step: '1'
      title: 'Toormaterjali kontroll'
      desc: 'PVC- ja Drop-Stitch-kangad läbivad tõmbetestimise (ASTM D751), rebenevuse leviku ja UV-kindluse kontrolli, enne kui mistahes partii läheb tootmisse.'
    - step: '2'
      title: '24–48 tunni õhukindluse test'
      desc: 'Iga torukamber pumbatakse üles 125%-ni nimirõhust ja hoitakse 24–48 tundi. Rõhu langus üle 5% käivitab automaatse tagasilükkamise ja õmbluste korduskontrolli.'
    - step: '3'
      title: 'Koormus- ja tasakaalutest'
      desc: 'Valmis laadid koormatakse maksimaalse nimikoormuseni ja testitakse stabiilsuse ja jäikuse osas. Iga laual veetestitakse enne lõplikku ülevaatust.'

oem_section:
  tagline: 'OEM-projektid'
  title: 'Brindi- ja OEM-koostöö juhtumiuuringud'
  subtitle: 'Kontseptsioonist konteinerini — kuidas aitame globaalsetel brändidel käivitada ja laiendada nende täispuhutavate SUP-laudade tooteühelasi.'
  cases:
    - challenge: 'Euroopa välistingimuste jaemüüja vajas eramärgisega SUP-tooteühelat unikaalse tekigraafika, keskkonnasõbraliku PVC ja jaemüügivalmis pakendiga — kõik tuli tarnida 60 päevaga.'
      solution: 'Lõime kohandatud digitaaltrüki failid, hankisime REACHi nõuetele vastava PVC ja tihendasime proovide tegemise 3 ringist 1-ni, paigutades disainimeeskonna meie Qingdao tehasse.'
      result: '55 päeva allkirjastatud PO-st FOB-ni. 2400 ühikut 4 SKU-s. Kordustellimus esitati enne esimese konteineri saabumist.'
    - challenge: 'USA veespordi idufirma vajas kõrge jõudlusega Drop-Stitch SUP-i kohandatud kujuga, kaasbränditud pakendiga ja BSCI sertifikaadiga jaemüügipaigutuse jaoks.'
      solution: 'Kohandasime olemasolevat SUP-i vormi muudetud kontuuriga, lõime kaasbränditud pakendi disaini ja esitasime täieliku BSCI auditidokumentatsiooni.'
      result: 'Edukalt listitud 3 suures USA välistingimuste ketis. 5000+ ühikut esimesel aastal 98% müügimääraga.'
    - challenge: 'Austraalia levitaja nõudis CE-sertifitseeritud SUP-valikut kohandatud värvidega ja vastavust Austraalia standarditele.'
      solution: 'Töötasime välja eeltootmise proovid 4 värvivariandiga ja korraldasime kolmanda osapoole vastavustestimise.'
      result: '3-mudeline SUP-valik käivitati AU/NZ turul. Järgnes võit valitsuse hankedes 12 patrull-SUP-i jaoks.'

faq_section:
  tagline: 'KKK'
  title: 'B2B ja OEM korduma kippuvad küsimused'
  questions:
    - q: 'Mis on täispuhutavate OEM SUP-laudade minimaalne tellimuskogus (MOQ)?'
      a: 'MOQ algab 5–10 ühikust standardsete OEM-mudelite puhul. Kohandatud vormid ja eramärgise projektid nõuavad sõltuvalt keerukusest vähemalt 200 ühikut. Proovitellimused ja väiksed partiisuurused on saadaval uute brändide käivitamiseks.'
    - q: 'Kas afarer omab BSCI sertifikaati?'
      a: 'Jah. Meie tehas säilitab kehtiva BSCI sotsiaalse vastavuse sertifikaadi (auditiaruanne saadaval nõudmisel). Samuti omame ISO 9001 kvaliteedijuhtimise sertifikaati ja kõik tooted kannavad CE sertifikaati. REACHi ja RoHSi vastavuse dokumentatsioon edastatakse iga OEM-saadetisega.'
    - q: 'Mis on tüüpiline OEM-tellimuse täitmisaeg?'
      a: 'Standardne täitmisaeg on 30–45 päeva kinnitatud PO-st ja sissemaksest massilise OEM-tootmise puhul. Kohandatud vormide arendus lisab 15–20 päeva tööriistade jaoks. Kiirendatud tootmine on saadaval kiireloomuliste tellimuste ja hooajaliselt aktiivsete perioodide jaoks. Prototüübid saadetakse tavaliselt 15–20 päevaga.'
    - q: 'Kas saate saata FOB Qingdao või CIF meie sadamasse?'
      a: 'Jah. Saadame FOB Qingdao, CIF suurtesse globaalsetesse sadamatesse ja DDP kvalifitseeritud partneritele. Meie logistikameeskond haldab konteinerite broneerimist, eksportdokumentatsiooni ja tollivormistust. Saadame 50+ riiki üle EL-i, USA, AU ja Aasia turgude.'

b2b_moq: 'Standardne MOQ: 5–10 ühikut mudeli kohta. Proovitellimused on teretulnud uuteks koostöödeks.'

production_flow:
  tagline: 'Tootmisvoog'
  title: 'Materjalist valmis lauani'
  subtitle: 'Iga laual läbib 6 tootmisetappi koos QC-kontrollpunktidega igal sammul. Ei otseteid, ei vahele jäetud ülevaatusi.'
  stages:
    - stage: '01'
      title: 'Materjali vastuvõtmine ja sissetuleku QC'
      description: 'Kõik sissetulevad materjalid registreeritakse partii-/partiinumbriga meie ERP-süsteemis. PVC-kangarullid, Drop-Stitch-tuumad, ventiilid, liimid ja riistvar pannakse karantiini kuni QC kinnituseni.'
      qc_check: 'Tõmbetugevus (ASTM D751), rebenevuskindlus (ISO 4674), paksuse mõõtmine, liimi viskoossus, visuaalne defektiskaneerimine'
      qc_threshold: '100% partiidest testitud. Lükka tagasi, kui tõmbetugevus < 90% spetsifikatsioonist, rebenevus < min. spetsifikatsioon või mistahes visuaalne defekt'
      responsibility: 'Sissetuleku QC meeskond (3 inspektoriga)'
    - stage: '02'
      title: 'CNC lõikamine ja materjali ettevalmistus'
      description: 'Arvutioptimeeritud paigutus asetab paneelid PVC-varudele, et minimeerida kadu. Automaatsed CNC-lõikamismasinad säilitavad 0,1 mm asukohatäpsuse.'
      qc_check: 'Mõõtmete kontroll CAD DXF failidega, servade kvaliteedi kontroll, paneelide arvu kinnitus'
      qc_threshold: 'Iga 20. paneel mõõdetakse. Tolerants ±0,5 mm. Lükka partii tagasi, kui >2% väljaspool tolerantsit'
      responsibility: 'Lõikustöökoja juht'
    - stage: '03'
      title: 'Keevitamine ja Drop-Stitch liitmine'
      description: 'Drop-Stitch-tuumad liidetakse välimiste PVC-laminaatidega kuumlamineerimisega. Toru kambreid keevitatakse RF- või kuuma õhuga. Reelinguribad liidetakse kolmekihiliselt.'
      qc_check: 'Koortest iga 50 ühiku järel (ASTM D751), keevituslaiuse mõõtmine, kuuma õhu temperatuuri logi ülevaatus, visuaalne õmbluste kontroll tagantvalgustuses'
      qc_threshold: 'Kooretugevus min. 8 N/cm. Keevituslaiuse tolerants ±1 mm. Mistahes nähtav kanal = tagasilükkamine'
      responsibility: 'Keevitus-QC (2 inspektoriga vahetuse kohta)'
    - stage: '04'
      title: 'Kokkupanek ja varustus'
      description: 'Lauad liiguvad lõplikule kokkupanekule, kus kõik komponendid ühendatakse: reelingud liimitakse ja keevitatakse, ventiilid paigaldatakse, D-rõngad, käepidemed, uime-KOK-d ja kandekott paigaldatakse. Iga üksus järgib 100-punktilist kokkupaneku kontroll-loendit.'
      qc_check: '100-punktilise loendi kinnitus ühe üksuse kohta, ventiilide funktsioonitest (10 avamis-/sulgemistsüklit), riistvaramomendi kontroll, visuaalne ülevaatus'
      qc_threshold: 'Nulldefekti põhimõte ohutuskriitilistes osades (ventiilid, D-rõngad, käepidemed). Väikesed kosmeetilised: AQL 2,5 (ISO 2859)'
      responsibility: 'Kokkupaneku meeskonna juht + liini QC'
    - stage: '05'
      title: 'Rõhutestimine ja kvaliteedihoid'
      description: 'Iga kamber pumbatakse üles 1,25-kordse nimirõhuni (tavaliselt 20–25 PSI) ja hoitakse 24–48 tundi. Rõhusensorid logivad pidevalt. Kambrit, mille rõhu langus ületab 5%, lükatakse tagasi ja saadetakse õmbluste korduskontrolli.'
      qc_check: '24–48h rõhuhoiu logi, sensorite kalibratsioon kontrollitakse iga päev, temperatuurikompenseeritud rõhu lugem, õmbluste kordustest pärast parandust'
      qc_threshold: 'Maks. 5% rõhu langus 24–48h jooksul stabiilsel temperatuuril. Kamber, mis ületab selle = 100% kogu tootmispartii kordustest'
      responsibility: 'Kvaliteedilabor (tootmisest sõltumatu, annab aru juhtkonnale)'
    - stage: '06'
      title: 'Lõplik ülevaatus ja pakkimine'
      description: 'Lõplik visuaalne ja funktsionaalne ülevaatus. Pinnadefektid, värvi ühtlus, siltide/BIN kontroll, pakendi terviklikkus ja tarvikute täielikkus. Üksused vakumeeritakse, pannakse kasti ja kaubaalustele konteineri laadimiseks.'
      qc_check: 'Täielik visuaalne ülevaatus, tarvikute kontroll-loend SKU kohta, pakendi langestest (1 m, juhuslik proov), siltide/vöötkoodi skannimise kontroll'
      qc_threshold: 'AQL 2,5 suurte defektide jaoks, AQL 4,0 väikeste jaoks. Nulltolerants ohutusdefektide suhtes. 100% üksustest visuaalselt kontrollitud'
      responsibility: 'Lõpliku QC meeskond (4 inspektoriga) + pakkimismeeskonna juht'


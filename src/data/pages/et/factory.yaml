workshops_section:
  tagline: 'Töökojad'
  title: 'Tootmistöökojad'
  workshops:
    - title: 'PVC lõikamine ja materjali ettevalmistus'
      description: 'Automaatsed CNC-lõikusmasseerivad töötlevad PVC- ja Drop-Stitch-kangaid allmillimeetristäpsusega. Arvutioptimeeritud paigutus vähendab materjalikadu miinimumini ja tagab, et iga paneel vastab mõõtmetingimustele enne keevitamist.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Torude keevitamine ja kuumtihendamine'
      description: 'Eraldatud keevitustöökoda kuumtihendusmasinate ja RF-dielektriliste pressidega. Kuuma õhu tihistid ühendavad ja sulatavad PVC-toru kambreid, samas kui RF-keevitused tagavad kõrge tugevusega õhukindlad õmblused, mis ületavad EN ISO 25649 nõudeid.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'FRP-vormid ja komposiittootmine'
      description: 'Kohandatud FRP-vormid SUP-komponentidele, valmistatud käsitsi klaaskiudvormimisega polüestri ja vinüülestri vaigusüsteemidega. Iga kiht rullitakse käsitsi ja vakumeeritakse ühtlase kvaliteedi tagamiseks. Geelkatte pihustiabi tagab kõrge läikega UV-kindla merelakkimise.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'SUP-i trükkimine ja dekoreerimine'
      description: 'SUP-lauad dekoreeritakse digitaaltrükiga täisvärvi graafika jaoks ning sõeltrükiga logode ja korduvate mustrite jaoks. Digitaalprinterid loovad fotokvaliteediga tekkide disaine, samas kui sõeltrükk annab vastupidavad ja eredad brändimärgid.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Lõplik kokkupanek ja varustus'
      description: 'Kokkupanekuliin, kus Drop-Stitch-tuumad varustatakse reelingutega, paigaldatakse EVA tekid ning paigaldatakse uimed, ventiilid ja tarvikud. Iga laual järgitakse 100-punktilist kokkupaneku kontroll-loendit, mille kinnitab meeskonna juht.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Kvaliteeditestimine ja kontroll'
      description: 'Iga valmis laual läbib kohustusliku õhukindluse testi, õmbluste koorekontrolli ja täieliku süsteemikontrolli enne saatmist. Meie kvaliteedilabor tegutseb tootmisest sõltumatult ja annab aru otse juhtkonnale.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


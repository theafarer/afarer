meta:
  title: 'Kvaliteet ja testimine — tootmise kontroll | {SITE}'
  description: 'afarer kvaliteedisüsteem: sõltumatu testimislabor, ISO 9001 protsessid ja iga üksus testitud enne saatmist. Kvaliteedikontroll täispuhutavate SUP-ide tootmisele.'
  keywords:
    - 'sup quality control'
    - 'inflatable sup testing'
    - 'sõudelaua kvaliteedikindlus'
    - 'sup factory quality'
hero:
  tagline: 'Kvaliteedikindlus'
  title: 'Jõudluse ja kvaliteedi testimine'
  subtitle: 'Iga afarer täispuhutav SUP läbib range jõudluse ja kvaliteedikontrolli testimise meie R&D keskuses enne saatmist. Meie põhjalik SUP-i kvaliteeditestimine annab OEM- ja hulgimüügi ostjatele käegakatsutava tõendi toote suurepärasusest.'


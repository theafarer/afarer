tests:
  - title: 'Rõhutestimine'
    description: 'Täispuhutavaid kambreid survestatakse üle nende soovitatud tööpiiride pikaks ajaks. See kontrollib materjali ja õmbluste õhukindlust ja struktuurset terviklikkust, tagades, et toode talub kavandatud kasutust ja võimalikku ületäispuhumist ilma rikete või lekkedeta.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Löögitestimine'
    description: 'Tooteid testitakse kontrollitud löökidega erinevate kaalude ja nurkade alt. See hindab materjali vastupidavust läbistustele, rebenditele ja kahjustustele kokkupõrgetel vees olevate takistustega, tõestades vastupidavust ja pikaealisust.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'UV-kindluse testimine'
    description: 'Materjaliproovid läbivad kiirendatud UV-kiirguse, simuleerides aastaid karmi päikesevalgust, seejärel testitakse uuesti tõmbetugevuse säilitamist ja värvikindlust. See kontrollib, et PVC-ühendid vastupidavad tuhmumisele, kriidistumisele ja pragunemisele, tagades pikaajalise vastupidavuse päikeselistes merekeskkondades.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Kulumiskindluse testimine'
    description: 'Materjaliproove hõõrutakse abrasiivsete pindade vastu määratud arv tsükleid kontrollitud rõhu all. See mõõdab materjali võimet taluda kulumist korduval kasutamisel, kokkupuutel liiva, kivide või muude pindadega, tagades pikaajalise vastupidavuse.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Madalatemperatuurilise jõudluse testimine'
    description: 'Tooteid testitakse külmas keskkonnas, et hinnata funktsionaalsust ja vastupidavust erinevates temperatuuritingimustes, vältides jäikust või pragunemist külmemates vetes. Oluline laudadele, mis on mõeldud talviseks või kõrgelaiuskraadide kasutuseks.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Ujuvuse ja koormusmahtuvuse testimine'
    description: 'Tooteid testitakse erinevate kaaludega, et määrata nende maksimaalne koormusmahtuvus ja tagada, et nad toetavad ohutult kasutajaid ja varustust. Iga mudeli nimikoormus kontrollitakse enne väljastamist.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Manööverdatavuse testimine'
    description: 'Tooteid testitakse nende reageerimise osas sõude- või mootorisisenditele, hinnates pöörderaadiust ja käideldavust. Veetestid kinnitavad, et reaalne käitumine vastab disaini spetsifikatsioonidele.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Veekindluse testimine'
    description: 'Täielikult kokku pandud tooteid kastetakse vette või pihustatakse veega, et kontrollida lekkeid õmbluste, ventiilide või materjalide kaudu. Iga laual läbib kohustusliku veekindluse kontrolli enne saatmist.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp

testing_section:
  tagline: 'Testimisprotseduurid'
  title: 'Range testimine igal etapil'

commitment:
  title: 'Meie pühendumus'
  body: 'Nende rangete testimisprotseduuride kaudu annab {SITE} klientidele kindluse, et meie täispuhutavad SUP-id ei ole mitte ainult kõrge jõudlusega, vaid ka ehitatud kestma — tagades lugematuid nauditavaid ja ohutuid seiklusi vees. Meie kvaliteedilabor tegutseb tootmisest sõltumatult ja annab aru otse juhtkonnale.'
  cta: 'Küsi testimise dokumentatsiooni'
  cta_link: /contact

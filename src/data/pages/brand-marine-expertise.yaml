meta:
  title: 'Marine Expertise — Engineering in Every Hull | {SITE}'
  description: 'Decades of marine engineering in every hull. afarer masters drop stitch, marine PVC, and professional inflatable SUP design.'
  keywords:
    - 'marine engineering'
    - 'inflatable SUP manufacturer'
    - 'paddle board manufacturing'
hero:
  tagline: Marine Expertise
  title: 'Decades of Marine Engineering<br />in Every Hull'
  subtitle: 'afarer combines deep material science, precision manufacturing, and real-world testing to produce watercraft that perform when it matters.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer marine engineering and R&D team at work
expertise_materials:
  tagline: Material Science
  title: 'Choosing the Right Material<br />for Every Application'
  subtitle: 'We work with two core materials — each selected for specific use cases and performance requirements.'
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: '1100 denier PVC fabric — our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for SUP boards where weight and cost efficiency matter.'
      icon: tabler:droplet
    - title: Fibreglass & Polyethylene
      description: 'Fibreglass-laminated SUPs for premium stiffness and glide. Rotomoulded polyethylene for heavy-duty rental and rescue use requiring maximum impact resistance.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Manufacturing Capabilities
  title: 'Precision Manufacturing<br />at Every Step'
  subtitle: 'Our 12,000 m² facility is equipped with specialized machinery for every stage of production.'
  columns: 2
  items:
    - title: CNC Cutting
      description: 'Computer-controlled cutting ensures precise, repeatable fabric panels with minimal waste. Every piece fits exactly as designed.'
      icon: tabler:cpu
    - title: High-Frequency Welding
      description: 'Industrial HF welding creates seams stronger than the base material. Consistent temperature and pressure control ensures air-tight seals across every production run.'
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: 'Thousands of polyester threads connect top and bottom fabric layers, allowing high-pressure inflation (15-20 PSI) for rigid, stable SUP boards.'
      icon: tabler:building-arch
    - title: Pressure Testing
      description: 'Every inflatable product is pressure-tested before shipping. Boards are tested at 1.25x rated pressure — if it holds there, it will perform on the water.'
      icon: tabler:wind
    - title: Seam Strength Testing
      description: 'Random samples from each production batch undergo destructive seam strength testing. Results are logged and traceable to specific production runs.'
      icon: tabler:files
    - title: Water Testing
      description: 'Every model undergoes sea trials before certification. Real-world testing in coastal conditions validates performance, handling, and stability.'
      icon: tabler:droplet
expertise_design:
  tagline: Design & Engineering
  title: 'Engineered for Real Conditions'
  subtitle: 'Our design philosophy starts with how the board will be used — then builds the engineering around that use case.'
  items:
    - title: Performance Hull Design
      description: 'Each hull shape is tuned for its use case — displacement noses for touring glide, added rocker for surf agility, flat stable profiles for fishing and yoga.'
    - title: Drop-Stitch Safety
      description: 'Every board features a rigid drop-stitch core with reinforced rails. If a section is damaged, the high-tensile drop-stitch structure keeps the board operational.'
    - title: Ergonomic Deck Layout
      description: 'Deck-pad zoning, carry-handle position, and mounting points are designed around rider comfort during extended use — whether touring, fishing, or patrolling.'
    - title: Custom Configuration
      description: 'Rail colors, deck pad configuration, accessory mounts, gear capacity — each model can be customized to match specific operational requirements.'
cta:
  title: 'Have a specific application in mind?'
  subtitle: 'Our engineering team can advise on material selection, design, and manufacturing for your project.'
  actions:
    - variant: primary
      text: Ask our engineers
      href: /contact/
    - text: View product range
      href: /products/

features3_reasons:
  tagline: 'Prečo si vybrať afarer'
  title: 'Sedem dôvodov spolupracovať s nami'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Skutočná výroba, nie obchod'
      description: 'Vlastníme a prevádzkujeme továreň s rozlohou 12 000 m². Keď spolupracujete s afarer, pracujete priamo s ľuďmi, ktorí navrhujú, konštruujú a vyrábajú vaše produkty — bez sprostredkovateľov.'
      icon: tabler:building-factory
    - title: '2. Prístup vedený inžinierstvom'
      description: 'Náš dizajnový proces začína spôsobom použitia, nie produktovou kategóriou. Optimalizujeme tvar trupu, výber materiálov a konfiguráciu podľa toho, ako sa bude doska skutočne používať.'
      icon: tabler:engine
    - title: '3. Certifikovaná kvalita'
      description: 'Certifikácia CE, systém kvality ISO, súlad s BSCI, súlad s REACH, schválenie USCG. Každý výrobok spĺňa medzinárodné normy — nie len tvrdenia.'
      icon: tabler:certificate
    - title: '4. Flexibilný co-branding'
      description: 'Farby bočníc, rozloženie paluby, značka, balenie — prispôsobujeme vašim špecifikáciám. Žiadny tlak na minimálne objednávky. Začnite s prototypom, škálujte s istotou.'
      icon: tabler:adjustments
    - title: '5. Globálna logistika'
      description: 'Americký sklad v Kalifornii, priama expedicia z Qingdau, letecká preprava pre naliehavé objednávky. Poriadame colné dokumenty a papierovanie.'
      icon: tabler:truck-delivery
    - title: '6. Doživotná podpora'
      description: 'Podporujeme dosky, ktoré sme postavili pred 20 rokmi. Originálne náhradné diely, technické rady, usmernenia pri opravách — náš tím je k dispozícii, keď nás potrebujete.'
      icon: tabler:lifebuoy
    - title: '7. Úprimné špecifikácie'
      description: 'Skutočné nosnosti, skutočné rozmery, skutočná hmotnosť. Žiadne marketingové nafukovanie. To, čo publikujeme, je to, čo dostanete — overené nezávislým testovaním.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Dôvera značiek po celom svete'
  title: 'Čo hovoria naši partneri'
  items:
    - content: 'Spolupracovali sme s niekoľkými výrobcami v Číne, ale afarer vyniká svojou inžinierskou podporou a konzistentnou kvalitou. So značkou zaobchádzajú ako s vlastnou.'
      name: '— Co-brand partner, európska značka vodných športov'
    - content: 'Ich dosky SUP sú v prevádzke v našej flotile viac než 5 rokov. Minimálna údržba, výborná odolnosť voči UV. 5-ročná záruka nám dáva istotu.'
      name: '— Prevádzkovateľ flotily, skupina rezortov na Blízkom východe'
    - content: 'Tím afarer nám pomohol vyvinúť zákazkový dizajn dosky SUP od konceptu po výrobu za 90 dní. Kvalita prekonala naše očakávania.'
      name: '— Distribútor, Australian Watersports'

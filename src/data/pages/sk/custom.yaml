    - text: '200+ skúsených pracovníkov a inžinierov'
      highlight: '200+'
    - text: '15 000+ dosiek SUP vyrobených ročne'
      highlight: '15 000+'
    - text: 'Manažérstvo kvality certifikované ISO 9001'

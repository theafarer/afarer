meta:
  title: 'Custom Lab — custom nafukovacie paddle boardy | {SITE}'
  description: 'Custom nafukovacie paddle boardy: dizajn na mieru, logo, vlastná forma a výroba. Partner private-label SUP, MOQ 50 kusov, certifikácia CE.'
  keywords:
    - 'výrobca custom paddle boardov'
    - 'custom nafukovacie sup'
    - 'paddle board s logom'
    - 'private label nafukovacie sup'
    - 'výroba paddle boardov'
hero:
  tagline: 'afarer Custom Lab'
  title: 'Navrhnite si vlastnú<br />dosku SUP'
  subtitle: 'Partner custom SUP ponúkajúci co-brand, private label a výrobu paddle boardov na mieru pre podniky po celom svete. Od jediného prototypu po plnú sériovú výrobu.'
  cta: 'Začnite svoj projekt'
  footer_link: /contact

steps_section:
  tagline: 'Ako to funguje'
  title: 'Od konceptu po výrobu'
  subtitle: 'Štyri kroky od vášho nápadu po hotový produkt pripravený na more.'
  steps:
    - num: '01'
      title: 'Vyberte si dosku'
      desc: 'Vyberte si z našich základných modelov SUP — all-around, touring, yoga, športové alebo detské. Zvoľte veľkosť, materiál a farbu.'
    - num: '02'
      title: 'Nahrajte svoj dizajn'
      desc: 'Pošlite nám svoje logo, grafiku alebo manuál značky. Náš dizajnérsky tím pripraví digitálny návrh.'
    - num: '03'
      title: 'Kontrola AI mockupu'
      desc: 'Pozrite si fotorealistický AI mockup vašej custom dosky pred začatím výroby.'
    - num: '04'
      title: 'Výroba a dodanie'
      desc: 'Po schválení vstúpi vaša objednávka do našej výroby. Dodacie lehoty od 30 dní.'

services_section:
  tagline: 'Služby'
  title: 'Výrobné služby pre globálne značky'
  subtitle: 'Flexibilné modely spolupráce — od kontraktnej výroby po budovanie značky s kompletnou službou.'
  items:
    - title: 'Co-brand výroba'
      desc: 'Vyrobíme vaše dizajny podľa špecifikácie — vaše IP, vaše výkresy, vaše štandardy kvality. Kompletná ochrana NDA.'
      icon: ⚙️
    - title: 'Dizajnové riešenia'
      desc: 'Vyberte si z 50+ overených platforiem a prispôsobte veľkosť, farbu, grafiku a balenie.'
      icon: '🎨'
    - title: 'Private Label'
      desc: 'Vaša značka na našich produktoch — logo, balenie, visačky, manuály. Pripravené na predaj priamo z krabice.'
      icon: '🎨'
    - title: 'Vlastný branding'
      desc: 'Tlač na deck pad, grafika na trupe, polepy tubusov a custom štítky — kompletná integrácia značky.'
      icon: ⚙️

capabilities_section:
  tagline: 'Možnosti'
  title: 'Výrobné a customizačné schopnosti'
  subtitle: 'Všetko, čo potrebujete vedieť pred objednávkou.'
  capabilities:
    - label: 'Objem objednávky'
      value: 'MOQ 50 kusov (SUP)'
    - label: 'Dodacia lehota'
      value: '30–45 dní štandardne; 15–20 dní pre prototypy'
    - label: 'Customizácia'
      value: 'Veľkosť, tvar, farba, grafika, balenie, kovania'
    - label: 'Materiály'
      value: 'PVC, drop-stitch, EVA, hliník'
    - label: 'Tlač'
      value: 'Digitálna (CMYK), sieťotlač, tepelný transfer, sublimácia'
    - label: 'Certifikácia'
      value: 'CE, UKCA, FCC (podpora globálnej súladnosti)'

why_section:
  tagline: 'Prečo afarer'
  title: 'Jedna továreň. Jeden štandard. Žiadne kompromisy.'
  points:

hero:
  tagline: 'Sprievodcovia'
  title: 'Nováčik v SUP?'
  subtitle: 'Praktickí sprievodcovia, ktorí vám pomôžu vybrať, používať a užívať si nafukovacie dosky SUP.'

size_guide:
  tagline: 'Veľkosť a špecifikácie'
  title: 'Nájdite správnu veľkosť pre vaše potreby'
  desc: 'Porovnajte rozmery dosiek SUP, nosnosti a odporúčané použitie. Či potrebujete touring SUP, jogovú dosku alebo univerzálny SUP — náš sprievodca veľkosťami vám pomôže vybrať správnu voľbu.'
  link_label: 'Kompletný sprievodca veľkosťami so špecifikáciami produktov →'
  link: /size-guide
  cards:
    - title: 'Dosky SUP'
      desc: 'Zvoľte dĺžku podľa svojej hmotnosti a zamýšľaného použitia. Širšie dosky (32"+) ponúkajú väčšiu stabilitu. Dušie dosky (11–12 ft) lepšie držia stopu pri touring.'
    - title: 'Touring SUP'
      desc: 'Dušie dosky (11–12 ft) na prekonávanie vzdialeností a priamu stopu. Dostatočne stabilné na touring s výstrojou. Vždy skontrolujte nosnosť.'
    - title: 'Univerzálne SUP'
      desc: 'Zvoľte dĺžku podľa hmotnosti jazdca a použitia. Širšie dosky (32"+) pre stabilitu. Univerzálne pre rekreáciu a kondíciu.'

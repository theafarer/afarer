features3_what_we_build:
  title: 'Čo vyrábame'
  subtitle: 'Začali sme v pobrežnej dielni s jednou doskou a tvrdohlavým presvedčením: morské produkty by mali byť skonštruované tak, akoby na nich záležalo, pretože záleží. Dnes expedujeme do viac než 40 krajín, ale každý trup stále prechádza cez rovnaké ruky, ktoré spoločnosť založili.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'Dosky SUP'
      description: 'Nafukovacie dosky SUP od 9 do 12 stôp. Navrhnuté pre touring, jogu, rybolov a rodinné použitie.'
      icon: tabler:ship
    - title: 'Nafukovacie dosky SUP'
      description: 'Nafukovacie dosky SUP z PVC od 9 do 12 stôp. Ľahké, odolné a ľahko skladovateľné.'
      icon: tabler:rowing
    - title: 'Prémiové balíky SUP'
      description: 'Kompaktné dosky SUP vysokej špecifikácie vyrábané na mieru podľa vašej značky alebo požiadaviek flotily.'
      icon: tabler:crown


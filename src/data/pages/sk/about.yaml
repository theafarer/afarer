meta:
  title: 'O značke Afarer — nafukovacie SUP a vodné športy | {SITE}'
  description: 'Afarer je globálna značka nafukovacích dosiek SUP a vodných športov, ktorú prevádzkuje spoločnosť Aquafarer LLC (USA) a buduje náš operačný tím v Qingdao. Objavte náš príbeh, inžinierstvo, certifikovanú kvalitu a programy krajinských partnerstiev.'
  keywords:
    - 'značka nafukovacích SUP'
    - 'značka vodných športov'
    - 'krajinský distribútor sup'
    - 'co-branded kolekcie sup'
hero:
  tagline: 'O nás'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'továreň a dielňa afarer'
  title: |
    Morské inžinierstvo, <br />
    postavené po <span class="text-accent dark:text-white">afarer</span> spôsobe
  subtitle: 'Začali sme v pobrežnej dielni s jednou doskou a tvrdohlavým presvedčením: morské produkty by mali byť skonštruované tak, akoby na nich záležalo, pretože záleží. Dnes expedujeme do viac než 40 krajín, ale každý trup stále prechádza cez rovnaké ruky, ktoré spoločnosť založili.'


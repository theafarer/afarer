  columns: 3
  isAfterContent: true
  items:
    - title: 'Príslušenstvo'
      description: 'Pádla, pumpy, obaly, suché vrecká a elektronika. Všetko zladené s našimi doskami.'
      icon: tabler:package
    - title: 'Opravy a servis'
      description: 'Interná oprava dosiek, výmena podložiek a inovácie príslušenstva.'
      icon: tabler:tool
    - title: 'Zákazková výroba'
      description: 'Dizajn projekt za projektom pre komerčných, vedeckých a vojenských zákazníkov.'
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: 'Diskusia o dizajne a konštrukcii dosiek'


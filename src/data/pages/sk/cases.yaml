features3_cases:
  tagline: 'Vybrané prípady'
  title: 'Custom riešenia<br />pre skutočné výzvy'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Flotila európskeho potápačského centra'
      customer: 'BlueMed Diving Centers'
      country: 'Grécko'
      industry: 'Potápanie a námorná turistika'
      challenge: 'Reťazec potápačských centier na viacerých gréckych ostrovoch potreboval 12 SUP v potápačskej konfigurácii. Každá doska musela mať custom upevnenie vybavenia, úložný priestor na 8 fliaš a stabilnú plošinu pre vstup potápačov do otvorenej vody. Flotila musela doraziť do 60 dní pred začiatkom turistickej sezóny.'
      solution: 'Vyrobili sme 12 modelov SUP Voyager Dive s integrovanými nosičmi vybavenia, stabilnými plošinami a extra širokou drop-stitch konštrukciou pre stabilitu pri nastupovaní. Každá doska niesla branding flotily zákazníka. Všetkých 12 dosiek bolo tlakovo otestovaných a expedovaných z Qingdaa do 55 dní.'
      product: 'SUP Voyager Dive'
      results: 'Všetkých 12 dosiek bolo dodaných načas pre turistickú sezónu. Flotila je v dennej prevádzke 18+ mesiacov bez jediného materiálového zlyhania. Zákazník si v druhom roku objednal 6 ďalších kusov.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive sa stal oporou našich denných potápačských operácií. Stabilita je vynikajúca a rozloženie úložného priestoru vybavenia udržuje palubu čistú a bezpečnú pre našich hostí.'
      icon: tabler:lifebuoy
    - title: 'Co-brand program austrálskeho distribútora'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Austrália'
      industry: 'Co-brand a partnerský program'
      challenge: 'Austrálsky distribútor potreboval private-label sortiment dosiek SUP za konkurencieschopné ceny na súťaž s čínskymi značkami predávajúcimi priamo spotrebiteľom. Vyžadoval 8 unikátnych modelov od začiatočníckych po pokročilé, s custom grafikou, custom balením a drop-ship plnením pre maloobchodné predajne.'
      solution: 'Vyvinuli sme 8 modelov SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) s exkluzívnym austrálskym grafickým balíkom. Custom maloobchodné balenie s QR kódmi odkazujúcimi na inštalačné videá. Drop-ship logistika nastavená z Qingdaa priamo do austrálskych maloobchodných predajní.'
      product: 'Vlastná línia SUP (8 modelov)'
      results: 'Od konceptu po prvú zásielku za 90 dní. Miera predaja v maloobchode 85 % v prvej sezóne. Distribútor v druhom roku rozšíril partnerstvo o ďalšie modely SUP.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer dodal kompletnú líniu SUP za 90 dní — od prvého návrhu po predajnú plochu. Kvalita sa vyrovná značkám predávaným za dvojnásobnú cenu.'
      icon: tabler:currency-dollar
    - title: 'Dodávka záchranného vybavenia na Blízkom východe'
      customer: 'Národný úrad civilnej ochrany'
      country: 'Spojené arabské emiráty'
      industry: 'Pátranie a záchrana'
      challenge: 'Organizácia civilnej ochrany potrebovala 20 hliadkových SUP pripravených na pobrežné pátranie a záchranu, zabezpečenie prístavov a pohotovostné nasadenie pri záplavách. Vyžadovali vysoko viditeľné dosky, kompletné bezpečnostné vybavenie a súlad s miestnymi námornými predpismi.'
      solution: 'Dodali sme 20 modelov SUP Patrol s vysoko viditeľnou oranžovou drop-stitch konštrukciou, kompletnými bezpečnostnými balíkmi, reflexnou páskou SOLAS a zosilnenou konštrukciou. Každá doska bola certifikovaná CE a otestovaná podľa príslušných noriem. Dokumentačný balík obsahoval certifikáty súladu pre miestnu registráciu.'
      product: 'SUP Patrol'
      results: 'Flotila bola nasadená v 5 pobrežných staniciach. Dosky prevádzkujú v extrémnom teple (45 °C+) bez degradácie. Výkon a odolnosť prekročili špecifikácie.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol prekročil naše prevádzkové požiadavky. V podmienkach extrémneho tepla dosky po 24 mesiacoch denného používania nevykazujú žiadne známky UV degradácie.'
      icon: tabler:alert-triangle
    - title: 'Európske co-brand partnerstvo'
      customer: 'North Sea Marine Equipment BV'
      country: 'Holandsko'
      industry: 'Co-brand a partnerský program'
      challenge: 'Etablovaná európska námorná značka sa chcela expandovať na trh SUP bez investovania do výrobných zariadení. Potrebovala white-label partnera schopného vyrobiť 5 modelov SUP (9 až 12 stôp) s private brandingom, certifikáciou CE a exkluzívnymi distribučnými právami pre EÚ.'
      solution: 'Uzavreli sme white-label výrobnú dohodu pre 5 modelov SUP. Každý model niesol logá a farebnú schému zákazníka. Dokumentácia certifikácie CE bola pripravená pre každý model. Exkluzívne distribučné práva pre EÚ boli udelené s minimálnymi objednávkovými záväzkami. Technická dokumentácia bola poskytnutá pre miestnu servisnú sieť.'
      product: 'Vlastná línia SUP (5 modelov)'
      results: 'Podpísaná viacročná dohoda. Prvá výrobná séria 50 kusov bola expedovaná do 75 dní. Značka bola uvedená na významnom obchodnom veľtrhu s pozitívnym prijatím u dealerov.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Spolupráca s afarer nám umožnila vstúpiť na trh SUP bez stavby továrne — dodali kompletné riešenie na kľúč s certifikáciou CE a dokumentáciou na podporu dealerov.'
      icon: tabler:building
    - title: 'Flotila karibského rezortu'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahamy'
      industry: 'Námorná turistika a hotelierstvo'
      challenge: 'Luxusný rezort potreboval kompletnú flotilu vybavenia pre vodné športy pre aktivity hostí: 40 dosiek SUP na sprevádzané túry, 20 ďalších SUP na preskúmavanie lagún, 10 dosiek SUP na výlety hostí a príslušenstvo. Všetko vybavenie muselo niesť custom branding rezortu a muselo byť dodané pred vrcholom turistickej sezóny.'
      solution: 'Vyrobili sme kompletný balík SUP: 40 dosiek SUP Voyager (model All-Around), 20 dosiek SUP Explorer, 10 dosiek SUP Touring plus záchranné vesty, pádla, kompresory a opravné sady. Všetko vybavenie bolo potlačené logom rezortu a tropickou farebnou schémou. Kontajnerová preprava s kompletným inventárnym zoznamom.'
      product: 'Kompletný balík SUP (70+ kusov)'
      results: 'Flotila dorazila 6 týždňov pred vrcholom sezóny. Skóre spokojnosti hostí s vodnými aktivitami vzrástlo medziročne o 40 %. Vybavenie vydržalo 3 sezóny len s bežnou údržbou.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Prístup kompletného balíka znamenal, že sme dostali všetko potrebné v jednej zásielke — dosky aj príslušenstvo, všetko s brandingom a pripravené pre hostí. Naši hostia milujú kvalitu vybavenia.'
      icon: tabler:beach
    - title: 'Zmluva amerického pobrežného hliadkovania'
      customer: 'Atlantic Coastal Security Agency'
      country: 'Spojené štáty americké'
      industry: 'Námorná bezpečnosť a presadzovanie práva'
      challenge: 'Americká agentúra pobrežnej bezpečnosti vyžadovala ťažko konštruované hliadkové SUP pre operácie na otvorenej vode. Potrebovala výkonné dosky s vybavením vo vojenskej špecifikácii a súlad s predpismi americkej pobrežnej stráže.'
      solution: 'Skonštruovali sme SUP Patrol so zosilnenou drop-stitch konštrukciou, vysoko viditeľnými farebnými schémami, držiakmi na šifrovanú komunikáciu a integrovanými upevňovacími bodmi vybavenia. Dosky boli zosilnené pre náročné operácie. Poskytli sme dokumentáciu súladu s USCG.'
      product: 'SUP Patrol'
      results: 'Agentúra hlásila 95-percentnú pripravenosť na misie počas prvých 12 mesiacov. Bola zadaná ďalšia objednávka na 8 kusov.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol poskytuje našim posádkam výkon potrebný pre operácie na otvorenej vode. Zosilnená konštrukcia prináša kľúčovú odolnosť bez ohrozenia ovládateľnosti.'
      icon: tabler:shield

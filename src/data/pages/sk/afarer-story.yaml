timeline:
  - year: '2012'
    title: 'Základy výroby plavidiel'
    body: 'afarer začínal ako špecializovaná dielňa na plavidlá v čínskom Qingdao, oddaná morskému remeslu a výrobe plavidiel. Rané zameranie spočívalo vo výrobe spoľahlivých nafukovacích výrobkov prostredníctvom praktických inžinierskych skúseností a výrobnej disciplíny.'
  - year: '2015'
    title: 'Prvý export a certifikácia CE'
    body: 'Prvé exportné objednávky smerovali do Japonska a Kórey. Pre hlavné produktové rady bola získaná certifikácia CE, čo znamenalo vstup značky afarer na medzinárodné trhy. Spoločnosť začala obsluhovať komerčných aj rekreačných používateľov mimo Číny.'
  - year: '2018'
    title: 'Rozšírenie továrne'
    body: 'Presťahovali sme sa do výrobného zariadenia s rozlohou 12 000 m². Pribudli linky RF zvárania a kapacita výroby drop-stitch, čo umožnilo výrobu vo väčšom meradle a zlepšenie systémov kontroly kvality.'
  - year: '2020'
    title: 'Zriadenie centra R&D'
    body: 'Otvorili sme vyhradené centrum R&D s laboratóriom PVC látok, hydrodynamickým testovacím bazénom a štúdiom CAD/FEA simulácií. Vývoj produktov sa rozšíril so zameraním na ľahkú konštrukciu, lepšiu odolnosť a dizajn orientovaný na používateľa.'
  - year: '2022'
    title: 'Certifikácia a globálny rast'
    body: 'Získali sme certifikáciu ISO 9001. Tím sme rozšírili na 14 inžinierov R&D a viac než 200 pracovníkov. Produkty sa prostredníctvom distribútorov a partnerstiev co-brand dostali k zákazníkom v Európe, Amerike a Ázijsko-tichomorskom regióne.'
  - year: '2024'
    title: 'Štúdio inovácií a dizajnu'
    body: 'Spustili sme plnohodnotné štúdio dizajnu a inovácií pre zákazkové co-brand projekty, od konceptu po výrobu. Posilnili sme profesionálne morské aplikácie vrátane záchranných, komerčných a vládnych zakázok.'
  - year: '2026'
    title: 'Budovanie budúcnosti objavovania vôd'
    body: 'Dnes afarer naďalej vyvíja systémy SUP a morské doplnky — spája ľudí a organizácie s vodami sveta. Viac než 50 obslúžených krajín, ročná kapacita 15 000+ ks.'

content_founding:
  tagline: 'Začiatok'
  title: 'Zrodené na pobreží'
  subtitle: 'afarer vznikol v pobrežnej dielni v Qingdao s jednou doskou a víziou: vyrábať nafukovacie plavidlá, ktoré zvládnu skutočné morské podmienky.'
  paragraphs:
    - 'V roku 2012 naši zakladatelia videli na trhu medzeru — väčšina nafukovacích plavidiel bola buď cenovo dostupná, ale nespoľahlivá, alebo kvalitná, ale neprijateľne drahá. Verili, že existuje miesto pre výrobcu, ktorý ponúka kvalitu aj hodnotu súčasne.'
    - 'Prvý trup bol postavený ručne, otestovaný v miestnych vodách a zdokonalený na základe skutočnej spätnej väzby od rybárov a malých komerčných prevádzkovateľov. Tento cyklus — stavať, testovať, počúvať, zlepšovať — zostáva jadrom našej inžinierskej filozofie dodnes.'
    - 'Do roku 2015 sa povesť rozšírila za Qingdao. Medzinárodní distribútori začali žiadať vzorky. Z miestnej dielne sa stal globálny dodávateľ.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'raná výrobná dielňa afarer a výroba'

content_growth:
  tagline: 'Rast a inovácie'
  title: 'Od dielne k zariadeniu s rozlohou 12 000 m²'
  subtitle: 'Neustále investície do ľudí, vybavenia a procesov premenili afarer na moderné výrobné zariadenie vodných plavidiel.'
  paragraphs:
    - 'S rastúcim dopytom rástlo aj naše zariadenie. Rozšírili sme sa z malej dielne na továreň s rozlohou 12 000 m² s vyhradenými výrobnými linkami pre dosky SUP a doplnky.'
    - 'Investovali sme do CNC strihacích strojov, vysokofrekvenčného zváracieho vybavenia, výrobných liniek drop-stitch a komplexných testovacích zostáv — to nám umožňuje kontrolovať každý aspekt kvality výroby.'
    - 'Dnes náš tím s viac než 200 ľuďmi zahŕňa morských inžinierov, materiálových vedcov, odborníkov na kontrolu kvality a zručných remeselníkov — mnohí z nich sú s afarer od začiatkov.'

philosophy:
  tagline: 'Filozofia značky'
  title: 'Inžinierstvo slobody na vode'
  body: 'Sloboda na vode neznamená len pohyb. Predstavuje objavovanie nových miest, tvorbu zážitkov vonku, prepájanie ľudí s prírodou a umožňovanie profesionálnych misií. Inžinierstvo túto slobodu umožňuje.'
  pillars:
    - title: 'Spoľahlivosť na prvom mieste'
      body: 'Prostredie na vode vyžaduje dôveru. Výrobky afarer sú navrhnuté okolo stability, odolnosti, bezpečnosti a konzistentného výkonu.'
    - title: 'Dizajn orientovaný na človeka'
      body: 'Výrobky majú slúžiť ľuďom, nie technológiám. Každé rozhodnutie v dizajne začína pochopením toho, ako ľudia plavidlá používajú, kam sa vydávajú a akým výzvam čelia.'
    - title: 'Dostupné objavovanie'
      body: 'Voda by nemala patriť len expertom. afarer vytvára vybavenie, ktoré umožňuje viac ľuďom bezpečne zažiť rieky, jazerá, oceány a pobrežné prostredie.'
    - title: 'Neustále inovácie'
      body: 'Inovácia nie je len tvorba nových produktov. Je to zlepšovanie každého detailu — materiálov, konštrukcií, výroby a používateľského zážitku.'

engineeringDna:
  tagline: 'Inžinierska DNA'
  title: 'Ako afarer vytvára produkty'
  areas:
    - title: 'Veda o materiáloch'
      body: 'afarer sa zameriava na výber vhodných materiálov pre rôzne morské prostredia. Kľúčové hľadiská zahŕňajú odolnosť proti oderu, odolnosť voči UV, stabilitu tlaku a dlhodobú životnosť.'
      items: ['Odolnosť proti oderu', 'Odolnosť voči UV', 'Stabilita tlaku', 'Dlhodobá životnosť']
    - title: 'Konštrukčné inžinierstvo'
      body: 'Nafukovacie plavidlá vyžadujú presnú rovnováhu medzi tuhosťou, hmotnosťou, prenositeľnosťou a stabilitou. Inžinierstvo afarer sa zameriava na optimalizáciu týchto faktorov prostredníctvom technológie drop-stitch jadra a pokročilej konštrukcie švov.'
      items: ['Tuhosť', 'Optimalizácia hmotnosti', 'Prenositeľnosť', 'Stabilita']
    - title: 'Presnosť výroby'
      body: 'Každý výrobok prechádza kontrolovanými procesmi: príprava materiálov, presné strihanie, zváranie a lepenie, montáž, kontrola kvality a overenie výkonu.'
      items: ['Príprava materiálov', 'Presné strihanie', 'Zváranie a lepenie', 'Montáž a kontrola kvality']
    - title: 'Inžinierstvo používateľských scenárov'
      body: 'Produkty sú vyvíjané okolo reálnych aplikácií — rekreácie, dobrodružstva a profesionálneho použitia — čo zaručuje, že každý dizajn spĺňa špecifické nároky zamýšľaného prostredia.'
      items: ['Rekreácia', 'Dobrodružstvo', 'Profesionálne použitie', 'Komerčné použitie']


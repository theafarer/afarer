meta:
  title: 'Výrobný proces — od suroviny po SUP | {SITE}'
  description: 'Od suroviny po SUP pripravenú na more: každý krok výrobného procesu afarer pod našou kontrolou, od strihania a zvárania po testovanie.'
  keywords:
    - 'výrobný proces sup'

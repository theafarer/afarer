meta:
  title: 'Technológie — Drop Stitch a morské PVC | {SITE}'
  description: 'Technológie afarer: drop stitch konštrukcia, morské PVC, dvojvrstvové stavby a vysoký tlak. Inovácie od profesionálneho výrobcu nafukovacích dosiek SUP.'
  keywords:
    - 'technológie sup'
    - 'drop stitch konštrukcia'
    - 'vysokotlaké sup'
    - 'materiály nafukovacích sup'
hero:
  tagline: 'Technológie'
  title: 'Postavené pre výkon'
  subtitle: 'Každá nafukovacia doska SUP afarer je skonštruovaná s drop-stitch konštrukciou a morským PVC — presné materiály a výrobné metódy testované pre náročné morské prostredie.'

sections:
  - title: 'Drop-stitch jadro'
    description: 'Tisíce interných polyesterových vlákien spájajú vrchnú a spodnú vrstvu a vytvárajú tuhú štruktúru pri 12-15 PSI. Je to rovnaká technológia, aká sa používa v profesionálnych paddle boardoch a pretekárskych nafukovacích SUP.'
    imageAlt: 'Diagram jadra DS'
  - title: 'Morské PVC'
    description: 'Viacvrstvová laminovaná PVC látka ratingovaná pre morské prostredie. Každá vrstva je zváraná fúziou, nie lepená, čo vylučuje riziko delaminácie. Testovaná na odolnosť voči UV, korózii slanou vodou a oderu.'
    imageAlt: 'Vrstva PVC'
  - title: 'Vojenské PVC'
    description: 'Používané na všetkých modeloch SUP, prémiové PVC poskytuje vynikajúcu odolnosť voči UV a chemikáliám. Zachováva ohybnosť pri extrémnych teplotách a odoláva degradácii.'
    imageAlt: 'PVC'
  - title: 'Vzduchová paluba'
    description: 'Vysokotlaká nafukovacia drop-stitch konštrukcia poskytujúca výnimočnú tuhosť pre státie, rybolov a jogu. Znižuje čas prípravy, celkovú hmotnosť a objem pri skladovaní.'
    imageAlt: 'Vzduchová paluba'


packages:
  title: 'Programy klubových flotíl'
  subtitle: 'Vyberte program flotily zodpovedajúci veľkosti a ambíciám vášho klubu.'
  items:
    - name: 'Startovací balík'
      tagline: 'Pre nové kluby, do 30 členov'
      features:
        - '10 dosiek SUP (mix all-round + touring)'
        - '10 pádiel + 10 záchranných viest'
        - '2 dvojčinné kompresory + opravná sada'
        - 'Klubový branding na doskách (tlač loga)'
        - 'Sprievodca spustením + bezpečnostný zoznam'
        - 'Certifikácia CE — všetko vybavenie'
      cta_text: 'Spustite svoj klub'
    - name: 'Profesionálna flotila'
      tagline: 'Pre etablované kluby, 50–100 členov'
      features:
        - '30 dosiek SUP (3 veľkostné možnosti)'
        - '30 pádiel + 30 záchranných viest'
        - '5 kompresorov + 2 opravné sady + stojan'
        - 'Vlastné klubové farby + logo na doskách'
        - 'Program náhradných dielov (15 % zľava)'
        - 'Školenie personálu (online)'
        - 'Certifikácia CE — všetko vybavenie'
      popular: true
      cta_text: 'Vybudujte si flotilu'
    - name: 'Pretekárska flotila'
      tagline: 'Pre pretekárske kluby, podujatia, súťaže'
      features:
        - '50+ pretekárskych / výkonných dosiek'
        - 'Kompletná sada príslušenstva (pádla, vesty, kompresory)'
        - 'Sada podpory podujatí (štartové bóje, značky)'
        - 'Prioritné diely (expedícia do 24 h)'
        - 'Vyhradený account manažér'
        - 'Voliteľné vlastné tímové dreasy'
        - 'Certifikácia CE — všetko vybavenie'
      cta_text: 'Získať pretekársku flotilu'


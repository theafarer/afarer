meta:
  title: 'Morská odbornosť — inžinierstvo v každom trupe | {SITE}'
  description: 'Desaťročia morského inžinierstva v každom trupe. afarer ovláda drop stitch, morské PVC a profesionálny dizajn nafukovacích dosiek SUP.'
  keywords:
    - 'morské inžinierstvo'
    - 'výrobca nafukovacích SUP'
    - 'výroba paddle boardov'
hero:
  tagline: 'Morská odbornosť'
  title: 'Desaťročia morského inžinierstva<br />v každom trupe'
  subtitle: 'afarer kombinuje hlbokú vedu o materiáloch, presnú výrobu a testovanie v reálnych podmienkach, aby vyrábal plavidlá, ktoré fungujú, keď na tom záleží.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'morské inžinierstvo afarer a tím R&D pri práci'
expertise_materials:
  tagline: 'Veda o materiáloch'
  title: 'Výber správneho materiálu<br />pre každú aplikáciu'
  subtitle: 'Pracujeme s dvomi základnými materiálmi — každý vybraný pre špecifické spôsoby použitia a výkonnostné požiadavky.'
  columns: 3
  items:
    - title: 'Morské PVC'
      description: 'Látka PVC 1100 denier — náš najuniverzálnejší materiál. UV-stabilizovaná, odolná protioderu a v súlade s REACH. Ideálna pre dosky SUP, kde záleží na hmotnosti a cenovej efektívnosti.'
      icon: tabler:droplet
    - title: 'Sklolaminát a polyetylén'
      description: 'Sklolaminátom laminované dosky SUP pre prémiovú tuhosť a kĺzanie. Rotačne vstrekovaný polyetylén pre náročné požičovné a záchranné použitie vyžadujúce maximálnu odolnosť voči nárazu.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Výrobné schopnosti'
  title: 'Presná výroba<br />v každom kroku'
  subtitle: 'Naše zariadenie s rozlohou 12 000 m² je vybavené špecializovanými strojmi pre každú fázu výroby.'
  columns: 2
  items:
    - title: 'CNC strihanie'
      description: 'Počítačom riadené strihanie zaručuje presné, opakovateľné panely z látky s minimálnym odpadom. Každý diel sedí presne podľa dizajnu.'
      icon: tabler:cpu
    - title: 'Vysokofrekvenčné zváranie'
      description: 'Priemyselné HF zváranie vytvára švy pevnejšie než základný materiál. Konzistentná regulácia teploty a tlaku zaručuje vzduchotesné tesnenia v každej výrobnej šarži.'
      icon: tabler:bolt
    - title: 'Montáž drop stitch jadra'
      description: 'Tisíce polyesterových nití spája vrchnú a spodnú vrstvu látky, čo umožňuje vysokotlaké nafúknutie (15-20 PSI) pre tuhé, stabilné dosky SUP.'
      icon: tabler:building-arch
    - title: 'Tlakové testovanie'
      description: 'Každý nafukovací výrobok je pred odoslaním testovaný na tlak. Dosky sa testujú pri 1,25-násobku ratingového tlaku — ak to vydrží, bude fungovať na vode.'
      icon: tabler:wind
    - title: 'Testovanie pevnosti švov'
      description: 'Náhodné vzorky z každej výrobnej šarže podstupujú deštruktívne testy pevnosti švov. Výsledky sa zaznamenávajú a sú sledovateľné k konkrétnym výrobným šaržiam.'
      icon: tabler:files
    - title: 'Testovanie na vode'
      description: 'Každý model pred certifikáciou absolvuje skúšky na mori. Testovanie v reálnych pobrežných podmienkach overuje výkon, ovládanie a stabilitu.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Dizajn a konštrukcia'
  title: 'Skonštruované pre reálne podmienky'
  subtitle: 'Naša dizajnová filozofia začína tým, ako sa bude doska používať — a potom okolo tohto spôsobu použitia buduje inžinierstvo.'
  items:
    - title: 'Výkonnostný dizajn trupu'
      description: 'Každý tvar trupu je ladený pre svoje použitie — vytláčacie provy pre touringové kĺzanie, pridaný rocker pre surfovú obratnosť, ploché stabilné profily pre rybolov a jogu.'
    - title: 'Bezpečnosť drop-stitch'
      description: 'Každá doska má tuhé drop-stitch jadro so zosilnenými bočnicami. Ak sa niektorá časť poškodí, vysokopevnostná drop-stitch konštrukcia udrží dosku v prevádzke.'
    - title: 'Ergonomické rozloženie paluby'
      description: 'Členenie palubnej podložky, pozícia nosnej rukoväte a montážne body sú navrhnuté s ohľadom na komfort jazdca pri dlhodobom používaní — či už pri touringu, rybolove alebo hliadkovaní.'
    - title: 'Vlastná konfigurácia'
      description: 'Farby bočníc, konfigurácia palubnej podložky, držiaky príslušenstva, kapacita vybavenia — každý model možno prispôsobiť špecifickým prevádzkovým požiadavkám.'
cta:
  title: 'Máte na mysli konkrétnu aplikáciu?'
  subtitle: 'Náš inžiniersky tím vám poradí s výberom materiálov, dizajnom a výrobou pre váš projekt.'
  actions:
    - variant: primary
      text: 'Spýtajte sa našich inžinierov'
      href: /contact
    - text: 'Pozrieť produktovú ponuku'
      href: /products

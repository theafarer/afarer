business_solutions:
  tagline: 'Prečo sa jazdí inak'
  title: 'Výkon, ktorý pocítite pri prvom zábere'
  subtitle: 'Štyri piliere formované skutočnou vodou — výkon, dizajn, konštrukcia a kvalita.'
  items:
    - title: 'Výkon na vode'
      description: 'Tvary ladené pre stabilitu, kĺzanie a istotu vo vlnobití — aby sa každý záber cítil spojený s vodou.'
      icon: tabler:shield-check
    - title: 'Výrazný dizajn'
      description: 'Kolekcie inšpirované prílivmi, divokou prírodou a energiou pobrežia — dosky, s ktorými sa chcete nechať vidieť.'
      icon: tabler:package
    - title: 'Overená konštrukcia'
      description: 'Vysokohustotné drop-stitch jadrá, zosilnené bočnice a fúzne laminované švy postavené na opakované použitie.'
      icon: tabler:headset
    - title: 'Overená kvalita'
      description: 'Tlakové testy, vizuálne kontroly a záštita jasnej záruky a ohľaduplnej popredajnej podpory.'
      icon: tabler:truck-delivery

oem_section:
  tagline: 'Výroba OEM / ODM a co-brand'
  title: 'Od nápadu na vodu — co-branded edície'
  subtitle: 'Pre partnerov, ktorí chcú viac než katalógový produkt: výroba OEM/ODM a obmedzené co-branded kolekcie navrhnuté, skonštruované a vyrobené so značkou Afarer — pričom každá doska zostáva produktom Afarer.'
  steps:
    - number: '01'
      title: 'Nápad a zadanie'
      desc: 'Zdieľajte svoju víziu, cieľového jazdca a vodu, pre ktorú navrhujete.'
    - number: '02'
      title: 'Dizajn a konštrukcia'
      desc: '3D modelovanie, výber materiálov a výrazný grafický dizajn.'
    - number: '03'
      title: 'Prototyp a validácia'
      desc: 'Vzorové dosky podrobené tlakovým testom a overené na vode skôr, než sa zavážate.'
    - number: '04'
      title: 'Výroba vo veľkom'
      desc: 'Konzistentná, kontrolovaná výroba s kontrolnými bodmi kvality v každej fáze.'
    - number: '05'
      title: 'Globálne dodanie'
      desc: 'Logistika z Qingdao do významných prístavov s colnou podporou.'
  cta: 'Preskúmať co-branding'
  cta_link: /co-brand/


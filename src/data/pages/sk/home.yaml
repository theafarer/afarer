  description: 'Afarer je výrobca nafukovacích dosiek SUP a partner OEM/ODM v čínskom Qingdao — továreň s certifikáciou ISO 9001, ktorá navrhuje výkonné nafukovacie paddle boardy pre otvorenú vodu, touring, jogu a dobrodružstvo. Tlakové testy každej dosky osobitne, s programami OEM/ODM, private-label a distribúcie.'

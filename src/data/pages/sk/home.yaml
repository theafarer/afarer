    - variant: primary
      text: 'Stať sa distribútorom'
      href: /distributor-program/
    - text: 'Vyžiadať cenník pre predajcov'
      href: /contact/?subject=Dealer Price List
    - text: 'Žiadať o krajinské partnerstvo'
      href: /contact/?subject=Country Partnership Application
    - text: 'Stiahnuť distribučný program'
      href: /distributor-program/

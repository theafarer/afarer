who_we_serve:
  tagline: 'Jazdite s nami'
  title: 'Vytvorené pre spôsob, akým jazdíte'
  subtitle: 'Od vášho prvého záberu po najdlhšiu trasu — a pre kluby, rezorty a predajcov, ktorí držia ľudí pri pádlovaní.'
  items:
    - title: 'Beginneri a rekreační jazdci'
      keywords: 'nafukovacia SUP pre začiatočníkov, all-around paddle board, stabilná SUP'
      description: 'Široké, stabilné all-around dosky, vďaka ktorým sa váš prvý záber bude cítiť prirodzene a ktoré vás budú držať krok s vaším pokrokom.'
      icon: tabler:users
      cta: 'Nájsť svoju prvú dosku'
      link: /all-around-sup/
    - title: 'Touringoví a dobrodružní pádlári'
      keywords: 'touringová SUP, paddle board na dlhé vzdialenosti, expedičná SUP'
      description: 'Dlhšie, užšie dosky postavené tak, aby držali kurz, klzali ďalej a niesli vybavenie na viacdňové trasy.'
      icon: tabler:building
      cta: 'Preskúmať touringové dosky'
      link: /touring-sup/
    - title: 'Kluby, rezorty a požičovne'
      keywords: 'požičovacia flotila SUP, vybavenie paddle klubov, vodné aktivity v rezortoch'
      description: 'Nafukovacie dosky SUP pripravené pre flotily so spoľahlivou odolnosťou, jednoduchou údržbou a podporou náhradných dielov.'
      icon: tabler:shopping-cart
      cta: 'Vybudovať si flotilu'
      link: /solutions/
    - title: 'Krajinski distribútori a co-brand partneri'
      keywords: 'krajinský distribútor SUP, co-branded SUP, private label SUP'
      description: 'Exkluzívna distribúcia po jednotlivých krajinách a obmedzené co-branded kolekcie pre kvalifikované vodno-športové podniky.'
      icon: tabler:package
      cta: 'Stať sa partnerom'
      link: /distributor-program/


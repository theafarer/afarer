distributor:
  tagline: 'Exkluzívni krajinski distribútori'
  title: 'Jedna krajina. Jeden oficiálny distribútor Afarer.'
  subtitle: 'Program jedna krajina — jeden distribútor s územnou exkluzivitou, cenami pre predajcov, marketingovou podporou a vyhradeným Distributor Success Programom.'
  benefits:
    - title: 'Územná exkluzivita'
      description: 'Jeden autorizovaný distribútor na krajinu alebo región — žiadna interná konkurencia, žiadne konflikty kanálov.'
    - title: 'Marže priamo z výroby'
      description: 'Cenníky pre distribútorov a ročné bonusy za plnenie objemov, dodávané FOB Qingdao.'
    - title: 'Marketingová a tréningová podpora'
      description: 'Co-branded materiály, POS materiály pre predajcov, produktové školenia a kampane pri spustení.'
    - title: 'Vyhradený zákaznícky tím'
      description: 'Osobný distribučný manažér plus onboarding, prognózovanie a podpora pri opakovanych objednávkach.'

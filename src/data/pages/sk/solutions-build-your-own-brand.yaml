meta:
  title: 'Výroba private label SUP a spustenie vlastnej značky | {SITE}'
  description: 'Výrobca private label SUP pre nové značky paddle boardov. Spustite vlastnú značku SUP s Afarer — kompletná služba OEM/ODM vrátane dizajnu, prototypovania, vlastného brandingu, výroby a globálnej logistiky.'

hero:
  tagline: 'Vybudujte si vlastnú značku'
  title: 'Spustite vlastnú<br />značku SUP'
  subtitle: 'Vy máte víziu. My máme továreň, odbornosť a dodávateľský reťazec. Výroba private label SUP a vývoj vlastnej značky SUP — spoločne vybudujeme značku, ktorá vynikne.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Doska SUP s vlastným brandingom na vode'

process:
  title: 'Cesta vašej značky'
  subtitle: 'Od nápadu na trh v 5 fázach.'
  steps:
    - phase: 'Fáza 1'
      title: 'Nápad'
      period: 'Týždeň 1–2'
      items:
        - 'Prieskum trhu a analýza konkurencie'
        - 'Definícia cieľového zákazníka'
        - 'Workshop pozicionovania značky'
        - 'Stratégia produktovej línie'
    - phase: 'Fáza 2'
      title: 'Dizajn'
      period: 'Týždeň 3–6'
      items:
        - 'Tvar dosky a grafický dizajn'
        - 'Ladenie farieb a výber materiálov'
        - 'Špecifikácia príslušenstva'
        - 'Dizajn balenia a štítkov'
    - phase: 'Fáza 3'
      title: 'Prototyp'
      period: 'Týždeň 7–10'
      items:
        - 'Výroba vzoriek'
        - 'Testovanie kvality (tlak, vztlak, UV)'
        - 'Úpravy dizajnu'
        - 'Finálne schválenie'
    - phase: 'Fáza 4'
      title: 'Výroba'
      period: 'Týždeň 11–14'
      items:
        - 'Hromadná výroba'
        - 'QC kontrola (na každý kus)'
        - 'Námorná / letecká preprava'
        - 'Dokumenty colného vybavenia'
    - phase: 'Fáza 5'
      title: 'Uvedenie na trh'
      period: 'Týždeň 15–16'
      items:
        - 'Produktová fotografia'
        - 'Produktový feed pre web'
        - 'Marketingové materiály'
        - 'Podpora pri spustení'

packages:
  title: 'Startovacie balíky'
  subtitle: 'Balíky navrhnuté pre každú fázu rastu značky.'
  items:
    - name: 'Začiatočnícka značka'
      tagline: '50–100 kusov · 2 modely dosiek'
      features:
        - 'Základná tlač loga'
        - 'Štandardné balenie'
        - 'E-mailová podpora'
    - name: 'Rastúca značka'
      tagline: '300–1 000 kusov · 3–5 modelov dosiek'
      features:
        - 'Vlastná farba + logo'
        - 'Vlastné balenie'
        - 'Produktové fotografie'
        - 'Vyhradený manažér'
    - name: 'Etablovaná značka'
      tagline: '1 000+ kusov · kompletná produktová línia'
      features:
        - 'Kompletná customizácia'
        - 'Prémiové balenie'
        - 'Marketingové materiály'
        - 'Prioritná výroba'


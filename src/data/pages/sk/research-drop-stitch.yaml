content_html: |
  <h2>Čo je Drop Stitch?</h2>
  <p>Drop stitch (nazývaný aj „drop-stitch látka" alebo „drop-stitch jadro") je konštrukčná metóda, pri ktorej tisíce jednotlivých polyesterových nití spájajú vrchnú a spodnú vrstvu látkového puzdra. Keď sa puzdro nafúkne, tieto nite pôsobia ako vnútorné ťahové prvky — bránia vrchnému a spodnému panelu vypuknúť do okrúhleho tvaru a nútia panel zostať plochý a tuhý.</p>
  <p>Výsledkom je ľahká, prenositeľná konštrukcia, ktorá znesie vnútorný tlak 15 – 20 PSI — porovnateľná s tuhosťou dosky s tvrdým trupom, ale úplne vypustiteľná na skladovanie a prepravu.</p>

  <h2>Ako to funguje: fyzika</h2>
  <p>V bežnej nafukovacej konštrukcii (ako balón alebo vzduchový matrac) tlačí vnútorný tlak vzduchu rovnako do všetkých strán. Bez vnútorného vedomia sa konštrukcia stane valcovou alebo guľovou. Drop stitch to rieši zavedením ťahovej výstuže:</p>
  <ul>
    <li>Tisíce nití spája vrchnú a spodnú vrstvu látky</li>
    <li>Pri nafúknutí sa tlak vzduchu snaží oddeliť vrch a spodok</li>
    <li>Nite tomuto oddeleniu odolávajú a prenášajú zaťaženie do ťahu pozdĺž osi nite</li>
    <li>Výsledkom je plochý, tuhý panel, ktorý odoláva ohybu</li>
  </ul>

  <h2>Proces výroby</h2>
  <ol>
    <li><strong>Tkanie:</strong> Polyesterové nite sa tkanú súčasne do dvoch samostatných vrstiev základnej látky (zvyčajne 1 100 DTEX alebo 1 680 DTEX polyester potiahnutý PVC). Nite sa medzi vrstvami tkanú v slučkách v uhle 90&deg;.</li>
    <li><strong>Povlakovanie:</strong> Vzadkaná základná látka sa potiahne PVC (alebo občas TPU) pomocou procesu nožového povlakovania alebo kalendrovania. Toto utesní nite a vytvorí vzduchotesnú membránu.</li>
    <li><strong>Spájanie vrstiev:</strong> Drop-stitch jadro sa spojí s vonkajšími laminovanými vrstvami (zvyčajne 0,9 mm alebo 1,2 mm PVC) pomocou tepelnej laminácie alebo lepidla.</li>
    <li><strong>Zváranie:</strong> Bočné pásy sa pozdĺž okrajov zvária horúcim vzduchom, RF zváraním alebo vysokofrekvenčným zváraním, čím vzniknú bočné steny dosky.</li>
    <li><strong>Inštalácia ventilov:</strong> Boston ventily alebo Halkey-Roberts ventily sa inštalujú, zvyčajne s mechanizmom odľahčenia tlaku na zabránenie prefúknutiu.</li>
  </ol>

  <h2>Kľúčové ukazovatele kvality</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Vstupná úroveň</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Prémiová</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Hustota nití</td><td class="p-3 border">1 nit / sq in</td><td class="p-3 border">2 nite / sq in</td></tr>
      <tr><td class="p-3 border">Základná látka</td><td class="p-3 border">1 100 DTEX</td><td class="p-3 border">1 680 DTEX</td></tr>
      <tr><td class="p-3 border">Maximálny tlak</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Hrúbka PVC</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Konštrukcia bočníc</td><td class="p-3 border">Preložené &amp; zlepené</td><td class="p-3 border">Zvarené &amp; fúzne spojené</td></tr>
    </tbody>
  </table>

  <h2>Aplikácie</h2>
  <ul>
    <li><strong>Dosky SUP:</strong> hrúbka 4" – 6", 15 – 20 PSI, 1 – 2 nite/sq in</li>
    <li><strong>Kajaky:</strong> Drop-stitch podlaha + nafukovacie bočné komory, podlaha na 10 – 15 PSI</li>
  </ul>

  <h2>Drop Stitch vs. Air Deck (sklolaminátové alebo drevené jadro)</h2>
  <p>Dosky s tvrdým trupom používajú jadrá z EPS peny s výstužou zo sklolaminátu alebo drevených pozdĺžnikov. Sú ľahšie, tuhšie a odozvovejšie — ale nemožno ich vypustiť. Drop stitch vymieňa časť tuhosti za plnú prenositeľnosť. Pre väčšinu rekreačných používateľov sú moderné drop-stitch dosky SUP pri 20 PSI od tuhosti nezameniteľné so vstupnými doskami s tvrdým trupom.</p>

  <h2>Ako Afarer používa Drop Stitch</h2>
  <p>Afarer vo svojej ponuke SUP používa 1 680 DTEX drop-stitch jadro s 2 nitami na štvorcový palec a 1,2 mm vonkajším PVC laminátom. Dosky sú ratingované na 20 PSI a pred odoslaním podstupujú 24–48 hodínový test udržania tlaku pri 1,25-násobku ratingového tlaku. Bočné pásy sú zvarené horúcim vzduchom s trojvrstvovou fúziou a ventily odľahčenia tlaku sú štandardom vo všetkých modeloch.</p>


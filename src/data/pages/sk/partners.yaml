meta:
  title: 'Partneri — distribúcia a veľkoobchod | {SITE}'
  description: 'Staňte sa partnerom afarer: distribučné siete, veľkoobchodné ceny, programy OEM/private label a podpora pre podniky s paddle boardmi po celom svete.'
  keywords:
    - 'distribučný partner sup'
    - 'veľkoobchod s paddle boardmi'
    - 'distribútor nafukovacích sup'
    - 'partnerstvo sup'
hero:
  tagline: 'Partneri a distribúcia'
  title: 'Staňte sa partnerom afarer<br />— globálna distribučná sieť'
  subtitle: 'Pripojte sa ku globálnej partnerskej sieti afarer. Spolupracujeme s morskými distribútormi, predajcami pádlarských športov, predajcami vybavenia a značkovými partnermi vo viac než 50 krajinách.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: 'globálna partnerská a distribučná sieť afarer'
content_programs:
  tagline: 'Partnerské programy'
  title: 'Partnerské programy<br />postavené na raste'
  subtitle: 'Či už ste distribútor, predajca alebo značkový partner, afarer ponúka programy navrhnuté na podporu vášho podniku.'
  columns: 3
  items:
    - title: 'Distribučný program'
      description: 'Exkluzívna územná distribúcia s objemovými cenami, marketingovou podporou a priamym prístupom k výrobe. Vyžaduje sa minimálny záväzok podľa veľkosti územia.'
      icon: tabler:world
    - title: 'Program pre predajcov'
      description: 'Priame ceny pre predajcov, produktové školenia, marketingové materiály a záručná podpora pre kamenné predajne a e-shopy.'
      icon: tabler:building-store
    - title: 'Partnerstvo OEM/ODM'
      description: 'Komplexná výroba OEM a ODM s vlastnou značkou, balením a produktovými špecifikáciami. Od konceptu po kontajner.'
      icon: tabler:certificate
    - title: 'Značkové partnerstvo'
      description: 'Co-branding, private label a programy exkluzívnych modelov pre zavedené značky v oblasti morských a outdoorových aktivít.'
      icon: tabler:stars
    - title: 'Vládne a inštitucionálne'
      description: 'Programy uprednostneného dodávateľa pre vládne agentúry, pobrežné stráže, armádu a humanitárne organizácie. Dokumentácia pripravená na tendre.'
      icon: tabler:building-community
    - title: 'Partner pre rezorty a požičovne'
      description: 'Ceny pre flotily, konzistentná kvalita a vlastná značka pre rezorty, potápačské centrá a požičovne po celom svete.'
      icon: tabler:sun
content_benefits:
  tagline: 'Prečo spolupracovať s nami'
  title: 'Prečo si partneri vyberajú afarer'
  subtitle: 'Naši partneri profitujú zo skutočných výrobných schopností, konzistentnej kvality a odozbovej podpory.'
  list:
    - 'Priamy prístup k výrobe: Spolupracujte priamo s naším výrobným tímom — bez sprostredkovateľov. Získajte rýchlejšie odpovede, lepšie ceny a plný prehľad o výrobe.'
    - 'Pripravené na prispôsobenie: Opatrite svoje produkty vlastnými farbami, logami, balením a špecifikáciami. Minimálne objednávky prispôsobené vášmu trhu.'
    - 'Zaručená kvalita: Certifikovaná výroba ISO 9001 so súladom CE, UKCA a BSCI. Každý výrobok testovaný pred odoslaním.'
    - 'Globálna logistika: Expedicia z Qingdau v Číne s možnosťami FOB, CIF a DDP. Americký sklad v Montclair v Kalifornii pre distribúciu v Severnej Amerike.'
    - 'Marketingová podpora: Produktové katalógy, fotografia, technická dokumentácia a digitálne materiály na podporu vášho predaja.'
    - 'Školenia a podpora: Produktové školenia pre váš predajný tím, technická podpora pre vašich zákazníkov a koordinácia záručného servisu.'
content_process:
  tagline: 'Ako sa stať partnerom'
  title: 'Jednoduchý proces partnerstva'
  subtitle: 'Náš proces partnerstva je priamočiary — navrhnutý tak, aby ste mohli rýchlo predávať produkty afarer.'
  items:
    - title: 'Krok 1: Podanie žiadosti'
      description: 'Vyplňte náš formulár partnerskej žiadosti s profilom vašej spoločnosti, cieľovým trhom a záujmom o produkty.'
    - title: 'Krok 2: Preverenie kvalifikácie'
      description: 'Náš tím partnerstiev preverí vašu žiadosť a do 3 pracovných dní vás kontaktuje s možnosťami spolupráce.'
    - title: 'Krok 3: Zmluva a zriadenie'
      description: 'Podpíšte partnerskú zmluvu, zriaďte si účet a získajte partnerské ceny, marketingové materiály a vzorky produktov.'
    - title: 'Krok 4: Školenie a spustenie'
      description: 'Poskytneme produktové školenia, predajnú podporu a marketingové materiály. Ste pripravení začať predávať.'
cta:
  title: 'Pripravení stať sa partnerom afarer?'
  subtitle: 'Požiadajte o partnerstvo a náš tím odpovie do 3 pracovných dní.'
  actions:
    - variant: primary
      text: 'Požiadať o partnerstvo'
      href: /contact/
    - text: 'Pozrieť naše produkty'
      href: /products/

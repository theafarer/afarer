features3_markets:
  tagline: 'Kľúčové trhy'
  title: 'Regionálna odbornosť<br />pre miestne požiadavky'
  subtitle: 'Chápeme, že rôzne trhy majú odlišné regulačné požiadavky, preferencie a spôsoby použitia.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Európa a Spojené kráľovstvo'
      description: 'Produkty s certifikáciou CE. Silný dopyt po doskách SUP na trhoch EÚ. Britskí distribútori oceňujú našu rýchlu odozvu.'
      icon: tabler:map-pin
    - title: 'Severná Amerika'
      description: 'Výroba schválená americkou pobrežnou strážou. Americký sklad v Montclair v Kalifornii pre rýchle dodanie na západné pobrežie. Rastúci dopyt po rybárskych, záchranných a rekreačných doskách SUP.'
      icon: tabler:map-pin
    - title: 'Austrália a Oceánia'
      description: 'Silný trh pre dosky SUP a doplnky vodných športov. Austrálski distribútori si cenia našu odolnú PVC konštrukciu voči UV v tvrdých slnečných podmienkach. Rýchla expedícia z nášho ázijského zariadenia.'
      icon: tabler:map-pin
    - title: 'Blízky východ'
      description: 'Rastúci dopyt po vybavení pre vodné dobrodružstvá. Naše komerčné dosky SUP a bezpečnostné vybavenie sú obľúbené medzi cestovnými operátormi a požičovňami. Vlastné konfigurácie pre vysokoteplotné prostredie.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Distribučná sieť'
  title: 'Spolupracujeme s distribútormi<br />po celom svete'
  subtitle: 'Spolupracujeme so zavedenými distribútormi morského vybavenia, značkami vodných športov a vládnymi obstarávacími agentúrami.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Co-brand programy'
      description: 'Výroba private label pre globálne značky vodných športov. Postaráme sa o všetko od dizajnu cez výrobu až po drop-shipping.'
      icon: tabler:building
    - title: 'Distribučná sieť'
      description: 'Autorizovaní distribútori vo viac než 20 krajinách držia zásoby a poskytujú miestnu podporu. Nové distribučné dopyty vítame.'
      icon: tabler:users
    - title: 'Vláda a inštitúcie'
      description: 'Priame dodávky pre pobrežné stráže, pátracie a záchranné organizácie a vojenské obstarávacie programy. Súlad s inštitucionálnymi obstarávacími požiadavkami.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Globálna logistika a podpora'
  subtitle: 'Od továrne po cieľovú destináciu — riadime celý dodávateľský reťazec.'
  items:
    - title: 'Možnosti prepravy'
      description: 'Námorná preprava (FOB Qingdao), letecká preprava pre naliehavé objednávky a expresný kuriér pre vzorky a náhradné diely.'
      icon: tabler:truck-delivery
    - title: 'Americký sklad'
      description: 'Zásoby v Montclair v Kalifornii pre rýchle dodanie po Severnej Amerike. Západné pobrežie: 2-3 dni, stred: 3-4 dni, východné pobrežie: 4-5 dni.'
      icon: tabler:building-warehouse
    - title: 'Náhradné diely'
      description: 'Originálne náhradné diely a spotrebný materiál afarer skladované po celý rok. Bežné diely expedujeme do 24 hodín.'
      icon: tabler:package
    - title: 'Technická podpora'
      description: 'Priama linka na náš inžiniersky tím pre technické otázky, rady pri opravách a podporu náhradných dielov. Podporujeme dosky, ktoré sme postavili pred 20 rokmi.'
      icon: tabler:headset
cta:
  title: 'Chcete sa stať distribútorom?'
  subtitle: 'Aktívne rozširujeme našu distribučnú sieť. Kontaktujte náš exportný tím a prediskutujte príležitosti partnerstva.'
  actions:
    - variant: primary
      text: 'Dopyt na partnerstvo'
      href: /contact/
    - text: 'Pozrieť našu produktovú ponuku'
      href: /products/

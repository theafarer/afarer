meta:
  title: 'Globálna prítomnosť — výrobca SUP pre viac než 50 krajín | {SITE}'
  description: 'afarer exportuje nafukovacie dosky SUP do viac než 50 krajín na každom kontinente. Profesionálny výrobca a dodávateľ pre značky, distribútorov a flotily.'
  keywords:
    - 'globálny výrobca sup'
    - 'exportér paddle boardov'
    - 'továreň sup čína'
    - 'profesionálny dodávateľ sup'
hero:
  tagline: 'Globálna prítomnosť'
  title: 'Obsluhujeme viac než 50 krajín<br />na každom kontinente'
  subtitle: 'Od európskych prevádzkovateľov pobrežných hliadok po austrálskych distribútorov vodných športov až po záchranné tímy na Blízkom východe — dosky afarer sú na vode po celom svete.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp

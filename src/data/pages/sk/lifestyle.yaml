hero:
  tagline: 'Životný štýl'
  title: 'Životný štýl<br />afarer'
  subtitle: 'Vytvorené pre tých, ktorí žijú na vode — od víkendových objaviteľov po komerčných prevádzkovateľov, ktorí sa každý deň spoliehajú na svoje vybavenie.'

values:
  - icon: 🌊
    title: 'Narodené na vode'
    desc: 'Každý dizajn začína pochopením toho, ako sa voda správa. Konštruujeme od okraja podmienok dovnútra — pretože oceán je náš učiteľ, nie naše pracovisko.'
  - icon: 🔧
    title: 'Postavené, aby vydržalo'
    desc: 'Najtrvale udržateľný produkt je ten, ktorý netreba nahrádzať. Morské materiály, drop-stitch jadrá ratingované na 15 PSI a švy, ktoré prežijú sezónu.'
  - icon: '🏆'
    title: 'Prístupné dizajnom'
    desc: 'Vodné športy by nemali byť luxusom. Profesionálny výkon za cenu, ktorá dáva zmysel pre rodiny, sprievodcov a malých prevádzkovateľov — nielen pre komerčné flotily.'
  - icon: 🌍
    title: 'Globálna komunita'
    desc: 'Od pobrežia Qingdao po jazerá v Európe, rieky v juhovýchodnej Ázii a zálivy v Amerike — naši zákazníci majú jedno spoločné: lásku k životu na vode.'
  - icon: ♻️
    title: 'Zodpovedná výroba'
    desc: 'CNC-optimálne rozvrhovanie znižuje odpad materiálu pod 5 %. Odolná konštrukcia znižuje frekvenciu náhrad. Staviame na dlhú životnosť, pretože to je najtrvalejšia voľba.'
  - icon: 🤝
    title: 'Podpora, ktorá vydrží'
    desc: 'Majitelia dvadsať rokov starých trupov nám stále volajú po náhradných dieloch. Na reklamácie odpovedáme v priemere do 24 hodín. Po predaji nezmizneme — sme tu po celý život produktu.'


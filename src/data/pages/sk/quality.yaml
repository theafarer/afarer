tests:
  - title: 'Tlakové testovanie'
    description: 'Nafukovacie komory sa vystavujú dlhodobo tlakom prekračujúcim ich odporúčané prevádzkové limity. Týmto sa overuje vzduchotesnosť a štruktúrna integrita materiálu a švov, čo zaisťuje, že produkt zvládne zamýšľané použitie a prípadné predfúknutie bez zlyhania alebo netesností.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Nárazové testovanie'
    description: 'Produkty sa vystavujú riadeným nárazom rôznych závaží a pod rôznymi uhlami. Toto hodnotí odolnosť materiálu voči prepichnutiam, trhinám a poškodeniu pri kolíziách s prekážkami vo vode a demonštruje odolnosť a životnosť.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'Testovanie odolnosti voči UV'
    description: 'Vzorky materiálov prechádzajú zrýchleným UV ožarovaním simulujúcim roky drsného slnečného žiarenia a potom sa znovu testujú na zachovanie pevnosti v ťahu a stálosť farieb. Týmto sa overuje, že PVC zmesi odolávajú vyblednutiu, krytie a praskaniu, čo zaisťuje dlhodobú odolnosť v slnečných morských prostrediach.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Testovanie odolnosti proti oteru'
    description: 'Vzorky materiálov sa trie o abrazívne povrchy stanovený počet cyklov pod kontrolovaným tlakom. Toto meria schopnosť materiálu odolávať opotrebeniu opakovaným používaním, kontaktu s pieskom, kameňmi alebo inými povrchmi a zaisťuje dlhodobú odolnosť.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Testovanie výkonu pri nízkych teplotách'
    description: 'Produkty sa testujú v studených prostrediach na hodnotenie funkčnosti a odolnosti v rôznych teplotných podmienkach, čím sa predchádza stvrdnutiu alebo praskaniu v chladnejších vodách. Nevyhnutné pre dosky určené na zimné použitie alebo do vysokých zemepisných šírok.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Testovanie vztlaku a nosnosti'
    description: 'Produkty sa testujú s rôznymi závažiami na určenie ich maximálnej nosnosti a na zabezpečenie bezpečného nesenia používateľov a vybavenia. Nosnosť každého modelu sa overuje pred uvedením na trh.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Testovanie ovládateľnosti'
    description: 'Produkty sa testujú na odozvu na pádlovanie alebo motorový pohon, pričom sa hodnotí polomer otáčania a ľahkosť ovládania. Skúšky na vode overujú, že reálne správanie zodpovedá dizajnovým špecifikáciám.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Testovanie vodotesnosti'
    description: 'Kompletne zostavené produkty sa ponárajú alebo vystavujú vodnej striekke na kontrolu akýchkoľvek netesností cez švy, ventily alebo materiály. Každá doska pred odoslaním prechádza povinnou kontrolou vodotesnosti.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp


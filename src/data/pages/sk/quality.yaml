commitment:
  title: 'Náš záväzok'
  body: 'Prostredníctvom týchto prísnych testovacích postupov poskytuje {SITE} zákazníkom istotu, že naše nafukovacie SUP nie sú len výkonné, ale aj stavané tak, aby vydržali — a zaisťujú nespočetné príjemné a bezpečné dobrodružstvá na vode. Naše laboratórium kvality pracuje nezávisle od výroby a podáva správy priamo manažmentu.'
  cta: 'Vyžiadať testovaciu dokumentáciu'
  cta_link: /contact

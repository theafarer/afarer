  title: 'OEM výroba a private label'
  subtitle: 'Od konceptu po kontajner — prispôsobte každý detail svojej línie nafukovacích SUP'

intro: 'afarer ponúka komplexné OEM a ODM služby pre značky, distribútorov a vládne inštitúcie po celom svete. S viac než 10 rokmi skúseností s exportom a továrnou s certifikáciou ISO 9001 a BSCI na ploche 12 000 m² zabezpečujeme všetko od dizajnu produktu a vývoja foriem po sériovú výrobu, balenie a logistiku.'


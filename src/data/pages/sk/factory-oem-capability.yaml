services:
  - title: 'Dizajn a konštrukcia produktu'
    description: 'Náš vlastný tím výskumu a vývoja pracuje s vašim konceptom alebo špecifikáciou na vývoji CAD výkresov, 3D modelov a prototypov. Ponúkame dizajn foriem, optimalizáciu tvaru trupu a poradenstvo pri výbere materiálov.'
  - title: 'Vlastný branding a grafika'
    description: 'Plnofarebná digitálna tlač, sieťotlač, reliéfna tlač a možnosti štítkov. Vyvíjame grafiku paluby špecifickú pre značku, branding tubusov a balenie pripravené na predaj.'
  - title: 'Customizácia materiálov a špecifikácií'
    description: 'Vyberte si z PVC (štandardné, ekologické, retardérové), drop-stitch a hybridných konštrukcií. Vlastné farby tubusov, gramáže tkanín a možnosti zosilnenia.'
  - title: 'Balenie a logistika'
    description: 'Vlastné obchodné balenie, krabice private label, vákuové balenie, paletizácia a nakládka kontajnerov. Dodacie podmienky FOB Qingdao, CIF alebo DDP.'

moq_table:
  - product: 'Nafukovacie dosky SUP'
    standard_moq: '5–10 kusov'
    custom_moq: '200+ kusov'
    lead_time: '30–45 dní'
  - product: 'Záchranné vesty a bezpečnosť'
    standard_moq: '100–200 kusov'
    custom_moq: '1 000+ kusov'
    lead_time: '20–30 dní'

why_us:
  - title: 'Vertikálna integrácia'
    description: 'Vlastníme našu továreň, formy a dodávateľský reťazec — žiadni sprostredkovatelia, žiadni subdodávatelia. To nám dáva kontrolu nad kvalitou, nákladmi a dodaním.'
  - title: 'Duálna certifikácia'
    description: 'Manažérstvo kvality ISO 9001 a certifikácia sociálnej súladnosti BSCI. Správy z auditu továrne k dispozícii na vyžiadanie.'
  - title: 'Súlad s CE'
    description: 'Všetky štandardné modely nesú certifikáciu CE 2013/53/EU. Custom modely možno certifikovať CE prostredníctvom nášho overeného procesu.'
  - title: 'Nízke MOQ'
    description: 'Začnite už od 5 kusov pri štandardných modeloch. Pomáhame vznikajúcim značkám štartovať bez prepäťovania zásob.'

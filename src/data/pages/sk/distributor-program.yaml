faqs:
  title: 'Krajinské partnerstvo — FAQ'
  subtitle: 'Otázky, ktoré si seriózni krajinskí partneri kladú pred podaním žiadosti.'
  items:
    - title: 'Čo skutočne znamená jedna krajina — jeden distribútor?'
      description: 'Afarer vymenúva jediného autorizovaného distribútora s exkluzívnymi právami pre vymedzené územie. Z našich globálnych ani regionálnych kanálov nepredávame do chránenej krajiny. Vaše vlastníctvo územia trvá, kým sú splnené podmienky distribučnej dohody.'
    - title: 'Je územie exkluzívne navždy?'
      description: 'Nie. Exkluzivita je podmienená, nie večná. Udržiava sa prostredníctvom podpisanej distribučnej dohody, splnením prvej objednávky, ročných nákupných cieľov, miestnych zásob, popredajných schopností a ďalšími investíciami do trhu. Ak tieto podmienky nie sú splnené, územie môže byť prehodnotené alebo pridelené inému partnerovi.'
    - title: 'Aká je minimálna prvá objednávka?'
      description: 'Krajinskí a regionálni distribútori začínajú na 100–300 kusoch; autorizovaní dealeri na 30–50 kusoch; skúšobné objednávky od 10–30 kusov vám umožnia najprv overiť trh (skúšobné a vzorkové objednávky nenesú územnú ochranu). Custom a private-label programy sa riadia samostatnými MOQ uvedenými vo vyššie uvedených úrovniach.'
    - title: 'Aká podpora je zahrnutá v 10-modulovom programe podpory?'
      description: 'Úrovne a kvalifikácia, ochrana územia, MOQ / ceny / ročné rabaty, zásoby a vykonávanie objednávok, marketingové zdroje a spoločné trhové fondy, produktové / predajné / technické školenia, náhradné diely a popredajný servis, registrácia záruky, partnerský portál a produktové listy, knižnica marketingových zdrojov, rozvrh ročných rabatov a prepravné a balné zoznamy.'
    - title: 'Ako ma Afarer chráni pred konfliktom kanálov?'
      description: 'Každé územie má práve jedného autorizovaného distribútora. Dopyty a priame objednávky z vášho regiónu smerujú cez vás, webové formuláre sa preposielajú miestnemu partnerovi, ak existuje, a globálny tím prípady eskaluje len vtedy, keď partner neodpovedá.'
    - title: 'Aké sú prepravné a platobné podmienky?'
      description: 'Objednávky sa expedujú FOB Qingdao s kompletnou vývoznou dokumentáciou. Výrobné objednávky: 30 % záloha a 70 % pred odoslaním; skúšobné a vzorkové objednávky sa platia vopred. Štandardná dodacia lehota je 30–45 pracovných dní, vzorkovacie série 15–20 pracovných dní.'
    - title: 'Ako môžem požiadať?'
      description: 'Pošlite žiadosť prostredníctvom kontaktného formulára s podrobnosťami o trhu. Prehodnotíme súlad s trhom, maloobchodnú prítomnosť a logistické schopnosti a do 3 pracovných dní vám odpovieme s ďalšími krokmi a vzorovou distribučnou dohodou.'

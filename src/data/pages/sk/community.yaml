stories:
  tagline: 'Príbehy objaviteľov'
  title: 'Skutočné dobrodružstvá skutočných ľudí'
  subtitle: 'Počujte od pádlárov, rodín a profesionálov, ktorí používajú vybavenie afarer na vode.'
  items:
    - name: 'Sarah a Mike'
      title: 'Majitelia SUP Explorer 11, Kanada'
      content: 'Vzali sme naše Explorer 11 na týždňový výlet cez Algonquin Park. Preportovali sme ich a prešli jazerá bez problémov. Vďaka drop-stitch konštrukcii sme ich mohli nafúkať na 15 PSI a získať výkon pevnej dosky z baliteľnej dosky.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Algonquin Park, Kanada'
    - name: 'Carlos R.'
      title: 'Jazdec Cheetah Surge, Španielsko'
      content: 'Cheetah Surge je mojou voľbou pre pobrežné krúženie. Živý dizajn na pláži priťahuje pozornosť a stabilita mi dáva istotu v ľahkom vlnobití. Správa sa výborne, či už tourujem, alebo si len užívám západ slnka.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Španielsko'
    - name: 'Lina a rodina'
      title: 'Pádlári Flowing Lotus, Švédsko'
      content: 'Víkendové rodinné dobrodružstvá na súostroví. Flowing Lotus je dostatočne stabilná, aby na nej stála moja dcéra, kým ja pádlujem. Nafúka sa približne za 10 minút — žiadny príves netreba, čisté rodinné radovánky na vode.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Stockholmské súostrovie, Švédsko'
    - name: 'Lt. Cmdr. Andres'
      title: 'Objaviteľ Ocean Voyager, Filipíny'
      content: 'Svoj Ocean Voyager používam na dlhé pobrežné cesty okolo Palawanu. Po mesiacoch denného používania v tropických podmienkach sa doska správa ako nová. Touringový tvar prepichuje vlnobitie, ktoré by slabšie dosky zastavilo.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palawan, Filipíny'
    - name: 'Emma T.'
      title: 'Prváčka na Tropical Breeze, Austrália'
      content: 'Predtým som nikdy nestála na SUP. Tropical Breeze je taká stabilná, že som sa pri prvom pokuse cítila sebavedomo. Teraz pádlujem každý víkend. Učebná krivka je v podstate nulová — a doska na vode vyzerá úžasne.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Austrália'


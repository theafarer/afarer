content_html: |
  <h2>1. Predkvalifikácia: čo hľadať v továrni</h2>

  <h3>Certifikáty súladu</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Systém manažérstva kvality</li>
    <li><strong>Certifikácia CE</strong> – Overte číslo notifikovanej osoby</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Audity sociálneho súladu</li>
    <li><strong>REACH / RoHS</strong> – Vyhlásenia o súlade materiálov</li>
  </ul>

  <h3>Výrobné schopnosti</h3>
  <ul>
    <li>Vlastná výroba drop-stitch jadier oproti outsourcingu</li>
    <li>Linka na povrstvovanie / lamináciu PVC</li>
    <li>Zariadenia na RF zváranie a teplovzduchové zváranie</li>
    <li>Vlastná výroba foriem (CNC obrábanie)</li>
    <li>Testovacie laboratórium (tlakové testy, UV starnutie, skúšky ťahu)</li>
  </ul>

  <h3>Overenie skúseností</h3>
  <ul>
    <li>Roky vo výrobe nafukovacích plavidiel (minimálne 5+ rokov)</li>
    <li>Počet inžinierov v tíme</li>
    <li>Existujúci OEM/ODM klienti (vyžiadajte si referencie)</li>
    <li>Exportné destinácie – expedujú už do vášho cieľového trhu?</li>
  </ul>

  <h2>2. Protokoly kontroly kvality</h2>
  <p>Vstupná kontrola materiálu: pevnosť v ťahu (ASTM D751 alebo ISO 1421), odolnosť proti trhaniu (ASTM D2261 alebo ISO 4674), pevnosť priľnavosti, namátkové kontroly UV starnutia.</p>
  <p>Priebežná kontrola: monitorovanie pevnosti švov každých 50 kusov, overenie momentu ventilu, kontroly hustoty drop-stitch vlákien, rozmerové kontroly oproti CAD výkresom.</p>
  <p>Záverečná kontrola: 100% test udržania tlaku (24 hodín, max. pokles 5 %), vizuálna kontrola, test funkcie ventilu, namátkové testy (AQL 2,5 alebo 4,0 podľa ISO 2859).</p>

  <h2>3. Kontrolný zoznam dokumentácie súladu</h2>
  <ul>
    <li>Vyhlásenie o zhode (DoC) odkazujúce na správnu smernicu EÚ</li>
    <li>Certifikát CE od notifikovanej osoby</li>
    <li>Testovacia správa z akreditovaného laboratória</li>
    <li>Bezpečnostné listy materiálov (MSDS)</li>
    <li>Vyhlásenie o súlade s REACH</li>
    <li>Zoznam materiálov so sledovateľnosťou dodávateľov</li>
    <li>Správa z inšpekcie továrne</li>
  </ul>

  <h2>4. Vyjednávanie MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Typ produktu</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Štandardné MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Vyjednávacie rozpätie</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Dosky SUP</td><td class="p-3 border">50 – 100 kusov</td><td class="p-3 border">5 – 10 kusov (skúšobne)</td></tr>
      <tr><td class="p-3 border">Kajaky</td><td class="p-3 border">50 – 100 kusov</td><td class="p-3 border">5 – 10 kusov (skúšobne)</td></tr>
      <tr><td class="p-3 border">Nafukovacie SUP</td><td class="p-3 border">50 – 100 kusov</td><td class="p-3 border">2 – 5 kusov (skúšobne)</td></tr>
      <tr><td class="p-3 border">Bezpečnosť / príslušenstvo</td><td class="p-3 border">200 – 500 kusov</td><td class="p-3 border">50 – 100 kusov (skúšobne)</td></tr>
    </tbody>
  </table>

  <h2>5. Logistika a preprava</h2>
  <p>Bežné Incoterms: <strong>FOB</strong> (továreň dodáva na odchodový prístav – najbežnejšie), <strong>EXW</strong> (kupujúci zabezpečuje všetku prepravu od brány továrne), <strong>CIF</strong> (továreň platí prepravné a poistenie do cieľového prístavu).</p>
  <p>Nafukovacie produkty majú nízku hmotnosť a veľký objem – objemová hmotnosť (DIM) často určuje náklady na prepravu. Vyžiadajte si vákuové balenie na zníženie objemu o 50–60 %. Námorná preprava z Číny do EÚ: 25–35 dní; na západné pobrežie USA: 15–20 dní.</p>

  <h2>6. Časté chyby</h2>
  <ul>
    <li><strong>Žiadny audit továrne:</strong> Vždy vykonajte alebo objednajte audit treťou stranou (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Iba ústne dohody:</strong> Podrobný technický špecifikačný list podpísaný oboma stranami</li>
    <li><strong>Vynechanie schválenia vzoriek:</strong> Písomné potvrdenie vzoriek pred hromadnou výrobou</li>
    <li><strong>Žiadne QC počas výroby:</strong> Inšpekcia treťou stranou počas výroby (DUPRO) a pred odoslaním (PSI)</li>
    <li><strong>Ignorovanie súladu:</strong> Overte certifikáciu CE/UKCA pred výrobou</li>
  </ul>

  <h2>7. Prečo Afarer</h2>
  <p>Afarer vyrába nafukovacie plavidlá OEM/ODM od roku 2012. S areálom s rozlohou 12 000 m&sup2; certifikovaným podľa ISO 9001, 25+ inžiniermi a certifikáciou CE v rámci všetkých produktových liniek spĺňame každé kritérium z tejto príručky. Novým partnerom ponúkame skúšobné MOQ a kompletné balíky dokumentácie súladu.</p>


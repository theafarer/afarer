meta:
  title: 'Certifikácie — CE, ISO 9001 a súlad | {SITE}'
  description: 'Certifikácie kvality afarer: CE (EN ISO 25649), ISO 9001:2015, BSCI. Súlad a bezpečnosť výrobcu nafukovacích SUP.'
  keywords:
    - 'certifikácia ce sup'
    - 'iso 9001 sup'
    - 'námorný súlad'
    - 'certifikácia paddle boardu'
hero:
  tagline: 'Certifikácie a štandardy'
  title: 'Certifikácie kvality<br />a štandardy súladu'
  subtitle: 'Výroba SUP afarer je certifikovaná podľa medzinárodných noriem morskej bezpečnosti, systémov manažérstva kvality a environmentálnych predpisov — CE, ISO 9001, UKCA, BSCI a REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'certifikácie kvality afarer a dokumentácia súladu'
content_certifications:
  tagline: 'Naše certifikácie'
  title: 'Certifikovaná kvalita,<br />celosvetovo uznaná'
  subtitle: 'Za každým produktom afarer stoja certifikácie, ktoré dokazujú náš záväzok ku kvalite, bezpečnosti a environmentálnej zodpovednosti.'
  items:
    - title: 'Certifikácia CE'
      description: 'Všetky produkty afarer spĺňajú európske požiadavky označovania CE pre rekreačné vodné plavidlá, čím sa zaisťuje splnenie štandardov bezpečnosti, ochrany zdravia a životného prostredia.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Náš systém manažérstva kvality je certifikovaný podľa ISO 9001:2015 a pokrýva dizajn, výrobu a distribúciu nafukovacích plavidiel a námorného vybavenia.'
      icon: tabler:clipboard-check
    - title: 'Označenie UKCA'
      description: 'Produkty predávané na trhu Spojeného kráľovstva nesú označenie UKCA, ktoré potvrdzuje súlad s predpismi UK pre námorné vybavenie a osobné vodné skútre.'
      icon: tabler:shield
    - title: 'Súlad s BSCI'
      description: 'afarer je auditovaný podľa BSCI (Business Social Compliance Initiative), čo dokazuje etické výrobné praktiky, férové pracovné podmienky a zodpovednosť v dodávateľskom reťazci.'
      icon: tabler:heart-handshake
    - title: 'Súlad s REACH'
      description: 'Všetky materiály použité v produktoch afarer spĺňajú nariadenia EÚ REACH o chemickej bezpečnosti, čím sa zaisťuje, že naše PVC, EVA ani komponenty neobsahujú obmedzené látky.'
      icon: tabler:flask
    - title: 'Testovanie materiálov'
      description: 'Látky sa testujú na pevnosť v ťahu, odolnosť proti trhaniu, UV degradáciu a odolnosť proti mrazovým trhlinám. Z každej výrobnej šarže sa odberá vzorka a overuje sa.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Štandardy továrne'
  title: 'Výrobná excelentnosť<br />— podľa špecifikácie'
  subtitle: 'Náš areál s rozlohou 12 000 m² pracuje pod prísnymi protokolmi kontroly kvality v každej fáze výroby.'
  list:
    - 'Kontrola vstupného materiálu: Všetky suroviny — PVC látka, EVA pena, lepidlá, kovania — sa pred vstupom do výroby testujú oproti špecifikáciám.'
    - 'Priebežná kontrola kvality: Každá výrobná fáza má zdokumentované QC kontrolné body. Pevnosť zvarov, súosovosť švov, inštalácia ventilov a utiahnutie upevnení sa overujú priamo na linke.'
    - 'Tlakové testovanie: Každá nafukovacia komora sa testuje tlakom pri 1,25-násobku nominálneho tlaku 24–48 hodín. Pre úspešné hodnotenie musí pokles tlaku zostať pod 5 %.'
    - 'Záverečná kontrola: Dokončené produkty sa pred odoslaním kontrolujú na rozmernú presnosť, kozmetický vzhľad, úplnosť príslušenstva a integritu balenia.'
    - 'Sledovateľnosť šarží: Každý produkt nesie sériové číslo prepojené so záznamami výrobnej šarže, čo umožňuje úplnú sledovateľnosť od suroviny po hotový výrobok.'
content_safety:
  tagline: 'Štandardy morskej bezpečnosti'
  title: 'Bezpečnosť na prvom mieste<br />— navrhnuté pre spoľahlivú prevádzku'
  subtitle: 'Produkty afarer sú navrhnuté a testované tak, aby spĺňali medzinárodné štandardy morskej bezpečnosti pre komerčné aj rekreačné použitie.'
  items:
    - title: 'EN ISO 25649'
      description: 'Nafukovacie SUP spĺňajú normy EN ISO 25649 pre konštrukciu, stabilitu, vztlak a nosnosť.'
      icon: tabler:sailboat
    - title: 'Súlad so SOLAS'
      description: 'Bezpečnostné vybavenie a záchranné prostriedky spĺňajú, tam kde sa vzťahuje, požiadavky SOLAS (Safety of Life at Sea).'
      icon: tabler:lifebuoy

certifications:
  - title: 'Certifikácia CE'
    description: 'Všetko bezpečnostné vybavenie afarer spĺňa požiadavky označenia CE podľa nariadenia EÚ o osobných ochranných prostriedkoch (EÚ) 2016/425.'
  - title: 'Certifikácia ISO 12402'
    description: 'Záchranné vesty spĺňajú normy vztlaku ISO 12402. Klasická záchranná vesta poskytuje vztlak 50N+; Profesionálna záchranná vesta spĺňa požiadavky SOLAS s automatickým nafukovaním.'
  - title: 'Súlad so SOLAS'
    description: 'Profesionálna záchranná vesta spĺňa nariadenia SOLAS (Safety of Life at Sea) pre námorné a komerčné operácie na šírom mori.'


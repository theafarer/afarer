content_html: |
  <h2>Tri štandardné hrúbky</h2>

  <h3>4" (10 cm) – Touring &amp; výkon</h3>
  <ul>
    <li>Najvyššia tuhosť – menej ohybu pod záťažou</li>
    <li>Najľahšia – menej materiálu, menší objem vzduchu</li>
    <li>Vynikajúce držanie kurzu – znížené hojdanie zo strany na stranu</li>
    <li>Najrýchlejšia – znížený odpor, ľahšie kĺzanie</li>
    <li>Najlepšia pre: touring, preteky, kondičné pádlovanie, skúsených pádlárov</li>
  </ul>

  <h3>5" (12,7 cm) – All-around</h3>
  <ul>
    <li>Dobrá tuhosť – vyvážený pomer ohybnosti a tuhosti</li>
    <li>Stredná hmotnosť – štandardná spotreba materiálu</li>
    <li>Dobrá primárna + sekundárna stabilita</li>
    <li>Najlepšia pre: rekreačné pádlovanie, začiatočníkov, bežné použitie na jazerách a riekach</li>
  </ul>

  <h3>6" (15,2 cm) – Stabilita &amp; joga</h3>
  <ul>
    <li>Najvyššia primárna stabilita – obrovský vztlak</li>
    <li>Najťažšia – viac materiálu PVC, väčší objem vzduchu</li>
    <li>Najpomalšia – väčší odpor, ťažšie udržanie kĺzania</li>
    <li>Najlepšia pre: jogu/fitness, ťažších pádlárov (100+ kg), veľmi vlnité podmienky</li>
  </ul>

  <h2>Inžinierska analýza</h2>
  <p>Tuhosť nafukovacej SUP je určená vnútorným tlakom vzduchu a momentom zotrvačnosti prierezu dosky. Pri 20 PSI vykazuje 4" doska približne o 30 % menší priehyb pod záťažou než 6" doska rovnakej šírky a dĺžky. Primárna stabilita vyplýva zo šírky čiar ponoru a vztlaku; sekundárnu stabilitu ovplyvňuje tvar bočníc a šírka dosky.</p>

  <h2>Hrúbka podľa hmotnosti pádlára</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Hmotnosť pádlára</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Odporúčaná hrúbka</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Do 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" alebo 6"</td></tr>
      <tr><td class="p-3 border">Nad 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Kompromis medzi hrúbkou a PSI</h2>
  <p>Bežným omylom je, že vyšší tlak PSI môže kompenzovať nadmernú hrúbku. Pri 25 PSI vykazuje 6" doska väčší ohyb než 4" doska pri 15 PSI, pretože geometrický moment zotrvačnosti dominuje v rovnici tuhosti. Pre výkonovo orientovaných pádlárov je tenšia doska pri nižšom tlaku výkonnejšia než hrubšia doska pri vyššom tlaku.</p>

  <h2>Ponuka Afarer</h2>
  <ul>
    <li><strong>4" dosky:</strong> Séria Cheetah Touring – 12' x 30" x 4" touringové SUP pre kondičné a diaľkové pádlovanie</li>
    <li><strong>5" dosky:</strong> Séria Cheetah All-Round – 10'6" x 32" x 5" pre rekreačné použitie</li>
    <li><strong>6" dosky:</strong> Séria Cheetah Ultra-Stable – 10' x 34" x 6" pre jogu, väčších pádlárov a fotografické platformy</li>
  </ul>
  <p>Všetky dosky využívajú drop-stitch jadrá 1 680 DTEX s ratingovým tlakom 20 PSI a 1,2 mm PVC laminátmi.</p>


faqs:
  - question: 'Ktorá je odolnejšia: nafukovacia alebo pevná SUP?'
    answer: 'Nafukovacie dosky SUP sú všeobecne odolnejšie, pretože odolávajú odreninám, prasklinám a poškodeniam nárazom, ktoré by pevnú dosku trvalo poškodili.'
  - question: 'Je nafukovacia SUP lepšia pre začiatočníkov?'
    answer: 'Áno. Nafukovacie dosky SUP sa začiatočníkom odporúčajú, pretože sú tolerantnejšie, ľahšie prenositeľné a menej pravdepodobne spôsobia zranenie pri páde.'
  - question: 'Dokážu nafukovacie dosky SUP dosiahnuť výkon pevných dosák?'
    answer: 'Pri rekreačnom pádlovaní a touringu sa výkon nafukovacích dosiek SUP vyrovná pevným doskám. Pevné dosky stále vynikajú v pretekoch a pokročilom surfovaní vďaka nižšej hmotnosti a jemnej ohybnosti.'
body: |
  <h2>Základné rozdiely</h2>
  <p>Nafukovacie dosky SUP (iSUP) a pevné dosky slúžia rovnakému základnému účelu — stojať a pádlovať na vode — ale dosahujú to úplne odlišnými konštrukčnými metódami. Správna voľba závisí od toho, ako plánujete dosku používať.</p>

  <table>
    <tr><th>Faktor</th><th>Nafukovacia SUP</th><th>Pevná SUP</th></tr>
    <tr><td>Konštrukcia</td><td>Drop-stitch PVC, nafúknutá na 12-15 PSI</td><td>Jadro z EPS peny obalené sklolaminátom alebo epoxidom</td></tr>
    <tr><td>Hmotnosť</td><td>18-28 lbs (iba doska)</td><td>20-30 lbs (iba doska)</td></tr>
    <tr><td>Zabalená veľkosť</td><td>Batoh (30 x 15 x 10 in)</td><td>Plná dĺžka (10-14 ft)</td></tr>
    <tr><td>Príprava</td><td>3-5 minút nafúknutia</td><td>Okamžite pripravená</td></tr>
    <tr><td>Životnosť</td><td>5-10 rokov pri starostlivosti</td><td>3-8 rokov (náchylné na odreniny)</td></tr>
  </table>

  <h2>Prenositeľnosť</h2>
  <p><strong>Vyhráva nafukovacia.</strong> Toto je najjasnejšia výhoda. Nafukovaciu dosku SUP zabalíte do batoha, ktorý sa zmestí do batožinového priestoru auta, skrine v byte alebo palubného batožinového priestoru lietadla. Cestovatelia, obyvatelia bytov a všetci bez strešného boxu zistia, že nafukovacie dosky SUP sú oveľa praktickejšie.</p>
  <p>Pevné dosky vyžadujú strešný nosič, veľké vozidlo alebo vyhradený úložný priestor. Ich preprava je náročná a bez špeciálnych prepravných puzdier si ich nemôžete vziať do lietadla.</p>

  <h2>Odolnosť</h2>
  <p><strong>Vyhráva nafukovacia.</strong> Nafukovacie dosky SUP sú vyrobené z vojenského PVC, ktoré odoláva nárazom, prepichnutiam a poškodeniu UV žiarením. Keď nafukovaciu dosku upustíte alebo narazíte na kameň, odrazí sa. Pevná doska by sa pri rovnakom náraze odštiepila, praskla alebo delaminovala.</p>
  <p>Pevné dosky sú náchylnejšie na bežné opotrebenie. Jediný pád na betón môže spôsobiť trvalú odreninu, ktorá ovplyvní výkon a umožní prenikanie vody.</p>

  <h2>Výkon</h2>
  <p><strong>V hornom segmente vyhráva pevná doska.</strong> Pri rekreačnom pádlovaní a touringu v miernych rýchlostiach sú výkony oboch typov dosák podobné. Pevné dosky majú náskok v:</p>
  <ul>
    <li><strong>Rýchlosti</strong> — Pevné dosky sú ľahšie a tuhšie, čo sa prejavuje lepším kĺzaním a vyššou maximálnou rýchlosťou</li>
    <li><strong>Surfovaní</strong> — Pevné dosky ponúkajú odozvovejšie prechody medzi bočnicami a lepší výkon vo vlnách</li>
    <li><strong>Pretekoch</strong> — V pretekárskych pretekoch sa takmer výlučne používajú pevné dosky kvôli výhodám hmotnosti a tuhosti</li>
  </ul>
  <p>Pre bežného rekreačného pádlára sú tieto výkonnostné rozdiely okrajové. Väčšina pádlárov nepresiahne výkony kvalitnej nafukovacej dosky.</p>

  <h2>Priateľskosť voči začiatočníkom</h2>
  <p><strong>Vyhráva nafukovacia.</strong> Nafukovacie dosky SUP sú pre začiatočníkov jednoduchšie, pretože:</p>
  <ul>
    <li>Mäkší povrch paluby je pohodlnejší a pri pádoch menej pravdepodobne spôsobí zranenie</li>
    <li>Širšie a hrubšie nafukovacie dosky ponúkajú vyššiu primárnu stabilitu</li>
    <li>Nižšia vstupná investícia sprístupňuje začatie</li>
    <li>Ľahká preprava znamená viac príležitostí pádlovať</li>
  </ul>

  <h2>Skladovanie a údržba</h2>
  <p>Nafukovacie dosky SUP vyžadujú pred skladovaním sušenie a správne zloženie. Pevné dosky možno skladovať zložené, ale potrebujú ochranu pred slnkom, teplom a nárazmi. Obe profitovali z opláchnutia sladkou vodou po použití v slanej vode.</p>

  <h2>Odporúčanie</h2>
  <p><strong>Zvoľte nafukovaciu SUP, ak:</strong> Cestujete, máte obmedzený úložný priestor, pádlujete rekreačne alebo ste začiatočník. 90 % pádlárov dobre poslúži kvalitná nafukovacia doska.</p>
  <p><strong>Zvoľte pevnú dosku, ak:</strong> Pretekáte súťažne, surfovanete pokročilé vlny alebo uprednostňujete maximálny výkon pred prenositeľnosťou a odolnosťou.</p>

  <h2>Časté otázky</h2>
  <h3>Ktorá je odolnejšia: nafukovacia alebo pevná SUP?</h3>
  <p>Nafukovacie dosky SUP sú všeobecne odolnejšie, pretože odolávajú odreninám, prasklinám a poškodeniam nárazom, ktoré by pevnú dosku trvalo poškodili.</p>

  <h3>Je nafukovacia SUP lepšia pre začiatočníkov?</h3>
  <p>Áno. Nafukovacie dosky SUP sa začiatočníkom odporúčajú, pretože sú tolerantnejšie, ľahšie prenositeľné a menej pravdepodobne spôsobia zranenie pri páde.</p>

  <h3>Dokážu nafukovacie dosky SUP dosiahnuť výkon pevných dosák?</h3>
  <p>Pri rekreačnom pádlovaní a touringu sa výkon nafukovacích dosiek SUP vyrovná pevným doskám. Pevné dosky stále vynikajú v pretekoch a pokročilom surfovaní vďaka nižšej hmotnosti a jemnej ohybnosti.</p>

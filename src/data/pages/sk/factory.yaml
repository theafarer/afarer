intro:
  - 'Ako výrobná divízia spoločnosti **Aquafarer LLC (USA)** riadi qingdaoský prevádzkový tím značky afarer každú fázu výroby — od príchodu surových materiálov PVC a sklolaminátu až po záverečnú kontrolu hotovej dosky pred expedíciou. Naša výrobná prevádzka v ekonomickej rozvojovej zóne Qingdao zaberá 12 000 štvorcových metrov a zahŕňa specializované dielne na rezanie PVC, tepelné zváranie trubíc, výrobu FRP foriem, digitálnu tlač SUP, finálnu montáž a testovanie kvality.'
  - 'Integráciou dizajnu, konštruovania, prototypovania, výroby a testovania pod jednou strechou odstraňujeme neefektívnosť zmluvnej výroby a udržiavame priamu kontrolu nad kvalitou spracovania, výberom materiálov a termínmi dodania. Každá doska, ktorá opustí našu dielňu, je postavená našimi ľuďmi, na našich zariadeniach, podľa našich štandardov.'


workshops_section:
  tagline: 'Dielne'
  title: 'Výrobné dielne'
  workshops:
    - title: 'Rezanie PVC a príprava materiálu'
      description: 'Automatické CNC rezačky spracovávajú PVC a drop-stitch látky s presnosťou pod jeden milimeter. Počítačom optimalizované rozloženie minimalizuje odpad materiálu a zaisťuje, že každý panel spĺňa rozmernú špecifikáciu pred zváraním.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Zváranie trubíc a tepelné tesnenie'
      description: 'Špecializovaná zváracia dielňa so zariadeniami na tepelné tesnenie a RF dielektrickými lisami. Teplovzduchové zváračky spájajú a tavia komory PVC trubíc, pričom RF zvary vytvárajú vysokopevnostné vzduchotesné švy, ktoré prekračujú požiadavky normy EN ISO 25649.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'FRP formy a kompozitová výroba'
      description: 'Vlastné FRP formy pre komponenty SUP, vyrábané ručným laminovaním sklolaminátu s polyesterovými a vinylesterovými živicovými systémami. Každá vrstva sa ručne valcuje a vákuuje pre konzistentnú kvalitu. Kabína na nastrek gélového náteru poskytuje vysokolesklú, UV-odolnú morskú povrchovú úpravu.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Tlač a dekorácia SUP'
      description: 'Dosky SUP sa dekorujú digitálnou tlačou pre celofarebnú grafiku a sitotlačou pre logá a opakujúce sa vzory. Digitálne tlačiarne vytvárajú dizajny paluby vo foto kvalite, zatiaľ čo sitotlač poskytuje odolné, výrazné značkové prvky.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Finálna montáž a vystrojenie'
      description: 'Montážna linka, kde sa drop-stitch jadrá dokončujú bočnicami, nalepujú sa EVA paluby a inštalujú sa plutvy, ventily a príslušenstvo. Každá doska prechádza 100-bodovým montážnym kontrolným zoznamom potvrdeným vedúcim tímu.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Testovanie kvality a kontrola'
      description: 'Každá dokončená doska podlieha povinnému testu udržania vzduchu, overeniu odlupovania švov a kompletnej kontrole systémov pred odoslaním. Naše laboratórium kvality pracuje nezávisle od výroby a podáva správy priamo manažmentu.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


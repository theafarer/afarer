qc_section:
  tagline: 'Kontrola kvality'
  title: 'Proces testovania a zabezpečenia kvality'
  subtitle: 'Každá doska pred odoslaním podlieha povinnému testovaniu. Naše laboratórium kvality pracuje nezávisle od výroby a podáva správy priamo manažmentu.'
  steps:
    - step: '1'
      title: 'Kontrola surovín'
      desc: 'Látky PVC a drop-stitch podchádzajú skúškam pevnosti v ťahu (ASTM D751), šíreniu trhlin a overeniu odolnosti voči UV žiareniu, kým sa ktorákoľvek šarža dostane do výroby.'
    - step: '2'
      title: '24–48 hodinový test udržania vzduchu'
      desc: 'Každá komora trubice sa nafúka na 125 % nominálneho tlaku a udrží sa 24–48 hodín. Pokles tlaku presahujúci 5 % spúšťa automatické zamietnutie a opätovnú kontrolu švov.'
    - step: '3'
      title: 'Test zaťaženia a vyváženia'
      desc: 'Dokončené dosky sa zaťažujú na maximálnu nominálnu kapacitu a testujú sa na stabilitu a tuhosť. Každá doska sa pred záverečnou kontrolou testuje vo vode.'

oem_section:
  tagline: 'OEM projekty'
  title: 'Prípadové štúdie značiek a OEM partnerstiev'
  subtitle: 'Od konceptu po kontajner — ako pomáhame globálnym značkám uvádzať na trh a škálovať ich línie nafukovacích SUP.'
  cases:
    - challenge: 'Európsky predajca outdoorového vybavenia potreboval private-label líniu SUP s jedinečnou grafikou paluby, ekologickým PVC a balením pripraveným na predaj — všetko dodané do 60 dní.'
      solution: 'Vyvinuli sme vlastné súbory digitálnej tlače, obstarali PVC v súlade s REACH a skrátili sme vzorkovanie z 3 kôl na 1 tým, že dizajnový tím umiestnili priamo v našej továrni v Qingdau.'
      result: '55 dní od podpísanej objednávky po FOB. 2 400 kusov v 4 SKU. Opakovaná objednávka bola zadaná ešte pred príchodom prvého kontajnera.'
    - challenge: 'Americký startup v oblasti vodných športov potreboval výkonnú drop-stitch dosku SUP s vlastným tvarom, co-branded balením a certifikáciou BSCI pre umiestnenie v maloobchode.'
      solution: 'Prispôsobili sme existujúcu SUP formu upraveným obrysom, vyvinuli co-branded grafiku balenia a poskytli kompletnú auditnú dokumentáciu BSCI.'
      result: 'Úspešne zaradené v 3 významných amerických outdoorových reťazcoch. 5 000+ kusov v prvom roku s 98-percentnou mierou predaja.'
    - challenge: 'Austrálsky distribútor vyžadoval sortiment SUP s certifikáciou CE, vlastnými farbami a súladom s austrálskymi normami.'
      solution: 'Vyrobili sme predvýrobné vzorky so 4 farebnými variantmi a zabezpečili sme testovanie súladu nezávislou treťou stranou.'
      result: 'Sortiment 3 modelov SUP uvedený na trhu AU/NZ. Následne výhra vo vládnom tendri na 12 hliadkových SUP.'

faq_section:
  tagline: 'FAQ'
  title: 'Často kladené otázky B2B a OEM'
  questions:
    - q: 'Aké je minimálne objednávkové množstvo (MOQ) pre nafukovacie dosky SUP OEM?'
      a: 'MOQ začína na 5–10 kusoch pre štandardné OEM modely. Vlastné formy a private-label projekty vyžadujú minimum 200 kusov v závislosti od zložitosti. Skúšobné objednávky a vzorkovacie série sú dostupné pri spúšťaní nových značiek.'
    - q: 'Má afarer certifikáciu BSCI?'
      a: 'Áno. Naša továreň udržiava platnú certifikáciu sociálnej zhody BSCI (auditná správa k dispozícii na vyžiadanie). Držíme tiež ISO 9001 pre manažérstvo kvality a všetky produkty nesú certifikáciu CE. Dokumentácia k súladu s REACH a RoHS sa poskytuje s každou OEM zásielkou.'
    - q: 'Aká je typická dodacia lehota pre OEM objednávku?'
      a: 'Štandardná dodacia lehota pre hromadnú OEM výrobu je 30–45 dní od potvrdenej objednávky a zálohy. Vývoj vlastnej formy pridáva 15–20 dní na výrobu nástrojov. Urýchlená výroba je k dispozícii pre naliehavé objednávky a sezónne špičky. Prototypové vzorky sa zvyčajne expedujú do 15–20 dní.'
    - q: 'Môžete expedovať FOB Qingdao alebo CIF do nášho prístavu?'
      a: 'Áno. Expedujeme FOB Qingdao, CIF do významných svetových prístavov a DDP pre kvalifikovaných partnerov. Náš logistický tím zabezpečuje rezerváciu kontajnerov, vývoznú dokumentáciu a colné vybavenie. Expedujeme do 50+ krajín v trhoch EÚ, USA, AU a Ázie.'

b2b_moq: 'Štandardné MOQ: 5–10 kusov na model. Skúšobné objednávky pre nové partnerstvá sú vítané.'

production_flow:
  tagline: 'Priebeh výroby'
  title: 'Od materiálu po hotovú dosku'
  subtitle: 'Každá doska prechádza 6 výrobnými fázami s QC kontrolnými bodmi v každom kroku. Žiadne skratky, žiadne vynechané kontroly.'
  stages:
    - stage: '01'
      title: 'Prijímanie materiálu a vstupná kontrola'
      description: 'Všetok prichádzajúci materiál sa eviduje podľa čísla šarže/lotu v našom ERP systéme. Role látky PVC, drop-stitch jadrá, ventily, lepidlá a kovania sú v karanténe až do schválenia QC.'
      qc_check: 'Pevnosť v ťahu (ASTM D751), odolnosť proti trhaniu (ISO 4674), meranie hrúbky, viskozita lepidla, vizuálne skenovanie defektov'
      qc_threshold: '100 % šarží otestovaných. Zamietnuť, ak pevnosť v ťahu < 90 % špecifikácie, odolnosť proti trhaniu < min. špecifikácie alebo akýkoľvek vizuálny defekt'
      responsibility: 'Tím vstupnej kontroly QC (3 inšpektori)'
    - stage: '02'
      title: 'CNC rezanie a príprava materiálu'
      description: 'Počítačom optimalizované rozloženie umiestňuje panely na PVC materiál s minimálnym odpadom. Automatické CNC rezačky udržiavajú polohovaciu presnosť 0,1 mm.'
      qc_check: 'Rozmerová kontrola oproti súborom CAD DXF, kontrola kvality hrán, overenie počtu panelov'
      qc_threshold: 'Každý 20. panel sa meria. Tolerancia ±0,5 mm. Šarža sa zamietne, ak >2 % mimo tolerancie'
      responsibility: 'Vedúci rezných dielní'
    - stage: '03'
      title: 'Zváranie a spájanie drop-stitch'
      description: 'Drop-stitch jadrá sa s vonkajšími PVC laminátmi spájajú tepelnou lamináciou. Komory trubíc sa zvárajú RF alebo teplovzduchovo. Bočné pásy sa spájajú trojvrstvovou fúziou.'
      qc_check: 'Test odlupovania každých 50 kusov (ASTM D751), meranie šírky zvaru, kontrola teplotného záznamu teplovzduchového zvárania, vizuálna kontrola švov pod podsvietením'
      qc_threshold: 'Minimálna pevnosť odlupovania 8 N/cm. Tolerancia šírky zvaru ±1 mm. Akýkoľvek viditeľný kanálik = zamietnutie'
      responsibility: 'Zváracie QC (2 inšpektori na zmenu)'
    - stage: '04'
      title: 'Montáž a vystrojenie'
      description: 'Dosky prechádzajú na finálnu montáž, kde sa spájajú všetky komponenty: bočnice sa lepia a zvárajú, inštalujú sa ventily, D-krúžky, rukoväte, plutvové boxy a pútka na prepravnú tašku. Každý kus nasleduje 100-bodový montážny kontrolný zoznam.'
      qc_check: 'Potvrdenie 100-bodového zoznamu na každý kus, test funkcie ventilu (10 cyklov otvorenia/zatvorenia), overenie utiahnutia kovaní, vizuálna kontrola'
      qc_threshold: 'Politika nulových defektov pre bezpečnostne kritické prvky (ventily, D-krúžky, rukoväte). Drobné kozmetické: AQL 2,5 (ISO 2859)'
      responsibility: 'Vedúci montážneho tímu + linkové QC'
    - stage: '05'
      title: 'Tlakové testovanie a zadržanie kvality'
      description: 'Každá komora sa nafúka na 1,25-násobok nominálneho tlaku (zvyčajne 20–25 PSI) a udrží sa 24–48 hodín. Tlakové senzory zaznamenávajú priebežne. Komory s poklesom tlaku nad 5 % sa zamietajú a posielajú na opätovnú kontrolu švov.'
      qc_check: 'Záznam 24–48h udržania tlaku, kalibrácia senzorov overovaná denne, teplotne kompenzované čítanie tlaku, opätovný test švu po oprave'
      qc_threshold: 'Max. 5 % pokles tlaku za 24–48h pri stabilnej teplote. Akákoľvek komora nad touto hodnotou = 100 % opätovný test celej výrobnej šarže'
      responsibility: 'Laboratórium kvality (nezávislé od výroby, podáva správy manažmentu)'
    - stage: '06'
      title: 'Záverečná kontrola a balenie'
      description: 'Záverečná vizuálna a funkčná kontrola. Povrchové defekty, konzistencia farieb, overenie štítkov/BIN, integrita balenia a úplnosť príslušenstva. Kusy sa vákuovo balia, skrátkujú a paletizujú na nakládku do kontajnera.'
      qc_check: 'Kompletná vizuálna kontrola, kontrolný zoznam príslušenstva na SKU, pádový test balenia (1 m, náhodná vzorka), overenie skenovania štítku/čiarového kódu'
      qc_threshold: 'AQL 2,5 pre hlavné defekty, AQL 4,0 pre drobné. Nulová tolerancia na bezpečnostné defekty. 100 % kusov vizuálne kontrolovaných'
      responsibility: 'Záverečný QC tím (4 inšpektori) + vedúci balenia'


meta:
  title: 'Dodávateľ požičovného vybavenia SUP a riešenia flotíl | {SITE}'
  description: 'Dodávateľ požičovného vybavenia SUP pre prevádzkovateľov požičovní. Komerčné dosky SUP na vysokú rotáciu navrhnuté pre denné použitie — UV-odolné PVC, zosilnené švy, rýchloschnúce materiály. Škálujte svoju požičovňu s Afarer.'

hero:
  tagline: 'Prevádzkovatelia požičovní'
  title: 'Škálujte svoju požičovňu<br />so sebadôverou'
  subtitle: 'Dodávateľ požičovného vybavenia SUP pre prevádzkovateľov požičovní. Dosky SUP na vysokú rotáciu navrhnuté pre denné požičanie, 365 dní v roku. Vaše príjmy si nikdy neberú voľno.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 'Rušný požičovný kiosk s doskami SUP pripravenými pre hostí'

features:
  title: 'Stvorené pre požičovnú drinu'
  subtitle: 'Každá doska je konštruovaná na 500+ požičovných cyklov s minimálnou údržbou.'
  items:
    - title: '500+ požičovných cyklov'
      description: 'Testované, aby prežili denné používanie v slanej vode, slnku a piesku.'
      icon: 'tabler:shield-check'
    - title: 'UV-odolná tkanina'
      description: 'Žiadne vyblednutie ani degradácia po roku vonkajšieho skladovania.'
      icon: 'tabler:sun'
    - title: 'Zosilnené švy'
      description: '3x pevnejšie než štandardná konštrukcia nafukovacej dosky.'
      icon: 'tabler:layers-intersect'
    - title: 'Rýchloschnúce materiály'
      description: 'Dosky pripravené na ďalšie požičanie do 30 minút.'
      icon: 'tabler:droplet'
    - title: 'Skladovateľnosť do stohu'
      description: 'Úsporný dizajn — v tej istej ploche uložíte o 40 % viac dosiek.'
      icon: 'tabler:stack'
    - title: 'Farebne odlíšené veľkosti'
      description: 'Personál okamžite siahne po správnej doske vďaka farebnému kódovaniu veľkostí.'
      icon: 'tabler:color-swatch'


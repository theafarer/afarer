features3_certifications:
  title: 'Certifikácie a súlad'
  subtitle: 'Každý výrobok je nezávisle testovaný a certifikovaný podľa medzinárodných noriem.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'Certifikácia CE'
      description: 'Všetky dosky SUP od afarer spĺňajú európsku bezpečnostnú normu CE pre rekreačné použitie. Každý výrobok pred opustením továrne podstupuje testy tlaku, vztlaku a zaťaženia.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'Naše zariadenie v Qingdao s rozlohou 12 000 m² prevádzkuje systém manažérstva kvality ISO 9001. Každá výrobná šarža je sledovateľná, zdokumentovaná a skontrolovaná.'
      icon: 'tabler:clipboard-check'
    - title: 'Sociálny súlad BSCI'
      description: 'Držíme certifikáciu BSCI, ktorá zaručuje etické pracovné praktiky, bezpečné pracovné podmienky a environmentálnu zodpovednosť v celom našom dodávateľskom reťazci.'
      icon: 'tabler:users'
    - title: 'REACH & RoHS'
      description: 'Všetky materiály — PVC, EVA pena, lepidlá — spĺňajú nariadenia EÚ REACH a RoHS. Žiadne obmedzené látky, žiadne kompromisy.'
      icon: 'tabler:flask'
    - title: 'Laboratórium testovania materiálov'
      description: 'Interné materiálové laboratórium testuje pevnosť v ťahu, odolnosť voči UV, integritu švov a odolnosť proti oderu každej šarže látky pred výrobou.'
      icon: 'tabler:microscope'
    - title: '2-ročná záruka'
      description: 'Každý výrobok afarer je dodávaný s dvojročnou zárukou na výrobné vady. Stojíme za tým, čo vyrábame.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'Dôvera zákazníkov'
  title: 'Čo hovoria naši zákazníci'
  subtitle: 'Od začiatočníkov s pádlom po profesionálnych prevádzkovateľov flotíl — pozrite sa, prečo dôverujú značke afarer.'
  items:
    - content: 'Vybavili sme celú našu požičovaciu flotilu doskami SUP od afarer. Po dvoch sezónach nula porúch. Certifikácia CE uľahčila schválenie poistenia.'
      name: 'Marco V.'
      title: 'Cestovný operátor, Chorvátsko'
    - content: 'Ako kupujúci prvýkrát som mal obavy z kvality. Dokumentácia ISO a testovacie správy, ktoré nám poskytli, mi dali úplnú dôveru.'
      name: 'James T.'
      title: 'Majiteľ SUP Explorer 11, Kanada'
    - content: 'So značkou afarer spolupracujeme na našich jednotkách pobrežnej hliadky. Ich proces kontroly kvality je konzistentný v každej šarži — takáto spoľahlivosť je pri operáciách kritických pre misiu neoceniteľná.'
      name: 'Lt. Cmdr. Andres'
      title: 'Verejné obstarávanie, Filipíny'

steps2_manufacturing:
  title: 'Ako zabezpečujeme kvalitu'
  subtitle: 'Od kontroly surovín po finálny tlakový test — každý výrobok prechádza prísnym reťazcom kvality.'
  items:
    - title: 'Kontrola surovín'
      description: 'Každá role látky PVC je pred vstupom do výroby testovaná na hrúbku, pevnosť v ťahu a odolnosť voči UV.'
      icon: 'tabler:search'
    - title: 'Kontrola kvality počas výroby'
      description: 'Zvary, inštalácie ventilov a spoje komôr sa kontrolujú na každej stanici počas montáže.'
      icon: 'tabler:eye'
    - title: 'Tlakové testovanie'
      description: 'Každý nafukovací výrobok je nafúknutý na 1,25-násobok nominálneho tlaku PSI a udržaný 24–48 hodín na overenie udržania vzduchu a integrity švov.'
      icon: 'tabler:wind'
    - title: 'Finálna kontrola'
      description: 'Každá jednotka sa pred schválením na odoslanie kontroluje na dokončenie, kovanie a balenie. Vzorky šarží idú do nášho laboratória na deštruktívne testy.'
      icon: 'tabler:clipboard-check'


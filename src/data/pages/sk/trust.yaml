warranty_section:
  title: 'Záruka a popredajná podpora'
  subtitle: 'Stojíme za každým výrobkom s jasnými záručnými podmienkami, rýchlym vybavovaním reklamácií a originálnymi náhradnými dielmi.'
  items:
    - title: '2-ročná záruka na výrobok'
      desc: 'Všetky výrobky afarer majú 2-ročnú záruku na výrobné vady — poruchy švov, vady ventilov a delamináciu materiálu pri normálnom používaní.'
    - title: 'Doživotná podpora dielov'
      desc: 'Originálne náhradné diely — ventily, opravné sady, plutvy, D-krúžky — sú dostupné pre všetky modely. Formy a nástroje udržiavame minimálne 5 rokov po skončení výroby.'
    - title: 'Odpoveď na reklamáciu do 48 hodín'
      desc: 'Záručné reklamácie potvrdíme do 48 hodín. Náhradné dosky odosielame do 10 pracovných dní pri schválených reklamáciách.'
    - title: 'Globálna servisná sieť'
      desc: 'Autorizované servisné centrá vo viac než 15 krajinách. Terénne opravné sady pre vzdialené operácie. Návody na drobné opravy vlastnými silami pri menších poškdeniach.'
    - title: 'Podpora pre zákazníkov OEM'
      desc: 'Vyhradení account manažéri pre partnerov B2B. Štvrťročné obchodné revízie, plánovanie zásob a podpora spoločného marketingu.'
    - title: 'Certifikačný balík'
      desc: 'Kompletná dokumentácia súladu priložená ku každej zásielke — CE deklarácia, testovacie správy, bezpečnostné listy materiálov.'
      link: '/contact'


faqs_sup:
  title: 'Časté otázky o doskách SUP'
  subtitle: 'Bežné otázky o našich doskách na stojanie s pádlom.'
  columns: 2
  items:
    - title: 'Aké veľkosti dosiek SUP ponúka afarer?'
      description: 'Ponúkame dosky SUP od 9 do 12 stôp — od kompaktných all-around dosiek až po touring a špecializované dizajny. Každý model je dostupný vo viacerých konfiguráciách.'
    - title: 'Aký je rozdiel medzi nafukovacou doskou SUP a pevnou doskou SUP?'
      description: 'Nafukovacia doska SUP používa konštrukciu drop-stitch s tisíckami vnútorných nití, ktoré umožňujú vysoký tlak vzduchu, kým pevná doska SUP používa epoxid alebo sklolaminát. Nafukovacie dosky SUP ponúkajú prenositeľnosť a pohodlné skladovanie bez obetovania tuhosti.'
    - title: 'Aká je hmotnostná limitácia dosiek SUP?'
      description: 'Naše dosky SUP unesú až 150 kg v závislosti od modelu a objemu. Každá produktová stránka uvádza maximálne zaťaženie pre váš konkrétny model.'
    - title: 'Sú dosky SUP od afarer certifikované CE?'
      description: 'Áno. Všetky rekreačné modely SUP sú certifikované CE podľa príslušných európskych noriem pre rekreačné použitie.'
    - title: 'Aká je záruka na dosky SUP?'
      description: 'Všetky dosky SUP od afarer majú štandardnú ročnú záruku na výrobné vady, ktorá pokrýva poruchy švov, vady ventilov a delamináciu materiálu pri normálnom používaní.'
    - title: 'Ako dlho trvá nafúknutie dosky SUP?'
      description: 'S priloženou ručnou pumpou trvá plné nafúknutie na 15 PSI približne 8–12 minút. Pre rýchlejšie nafúknutie odporúčame našu elektrickú pumpu afarer 12V, ktorá nafúkne dosku do 4 minút.'

faqs_materials:
  title: 'Časté otázky o materiáloch SUP'
  subtitle: 'Bežné otázky o materiáloch, starostlivosti a skladovaní nafukovacích dosiek SUP.'
  columns: 2
  items:
    - title: 'Z akých materiálov sú vyrobené nafukovacie dosky SUP od afarer?'
      description: 'Používame vojenský PVC (1100 denier) s UV-stabilizovanou, odolnou konštrukciou proti oderu v súlade s nariadeniami EÚ REACH a RoHS.'
    - title: 'Ako dlho vydržia nafukovacie dosky SUP?'
      description: 'Pri správnej starostlivosti kvalitná nafukovacia doska SUP z PVC vydrží 5–10 rokov. Pravidelné čistenie, ochrana pred UV a správne skladovanie výrazne predlžujú životnosť.'
    - title: 'Aká údržba je potrebná pre nafukovaciu dosku SUP?'
      description: 'Základná údržba zahŕňa opláchnutie sladkou vodou po každom použití (najmä v slanej vode), sušenie pred skladovaním, ročnú kontrolu tesnení ventilov a vyhýbanie sa dlhodobému slnečnému žiareniu, keď sa doska nepoužíva.'
    - title: 'Možno nafukovacie dosky SUP používať v slanej vode?'
      description: 'Áno. Všetky nafukovacie dosky SUP od afarer sú navrhnuté na použitie v sladkej aj slanej vode. Odporúčame po použití v slanej vode opláchnutie sladkou vodou a dôkladné osušenie.'
    - title: 'Ako skladovať nafukovaciu dosku SUP?'
      description: 'Pred skladovaním dosku úplne vypustite, vyčistite a osušte. Zrolujte ju voľne (vyhnite sa tesným záhybom), skladujte na chladnom a suchom mieste mimo priameho slnečného žiarenia a nedržte ju na betónovej podlahe, aby ste zabránili vsakovaniu vlhkosti.'
    - title: 'Aká je nosnosť nafukovacích dosiek SUP od afarer?'
      description: 'Nosnosť sa pohybuje od 100 kg pre naše najmenšie modely až po viac než 200 kg pre väčšie dosky. Každá produktová stránka uvádza maximálne zaťaženie pre váš konkrétny model.'


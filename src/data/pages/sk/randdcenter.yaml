vision:
  tagline: 'Naša vízia'
  title: 'Formujeme budúcnosť vodných športov'
  body: 'afarer sa usiluje viesť odvetvie nafukovacích SUP neustálou inováciou, neochvejnou kvalitou a pevným záväzkom k bezpečnosti a udržateľnosti — a obohacovať tak zážitky nadšencov vodných športov po celom svete. Centrum výskumu a vývoja afarer je miestom, kde sa stretnú vášeň s inováciou a kde sa nastavujú nové štandardy pre odvetvie vodných športov.'

labs_section:
  tagline: 'Laboratóriá'
  title: 'Naše laboratóriá'
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: 'Laboratórium PVC látok'
      description: 'Neustály výskum a testovanie palubných PVC látok na pevnosť v ťahu, odolnosť voči UV, odolnosť proti oteru a ohybnosť pri nízkych teplotách pre zabezpečenie dlhodobej spoľahlivosti v morských prostrediach.'
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 'Štúdio inžinierstva trupov'
      description: 'Dizajn riadený CAD a analýza metódou konečných prvkov trupov z HDPE, hliníka a sklolaminátu. Každý trup sa digitálne simuluje na rozdelenie napätia a odolnosť proti nárazom ešte pred výrobu prvého prototypu.'
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: 'Centrum RF zvárania'
      description: 'Vyhradené zváracie zariadenie s rádiofrekvenčným ohrevom s presnou reguláciou teploty a tlaku, ktoré vyrába vysokopevnostné vzduchotesné švy spĺňajúce štandardy námorného priemyslu pre nafukovacie plavidlá.'
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 'Hydrodynamický skúšobný bazén'
      description: 'Testovanie modelov v meradle v našom internom skúšobnom bazéne na optimalizáciu tvaru trupu, glisovacieho výkonu, stability a účinnosti v rozsahu zaťažení a morských podmienok.'
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: 'Prototypová dielňa'
      description: 'Zariadenie na prototypovanie a vystrojenie v plnom meradle, kde sa nové modely stavajú, vybavujú a skúšajú na mori. Každý prototyp absolvuje minimálne 20-hodinový vodný testovací program pred schválením do výroby.'
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 'Laboratórium kvality a kontroly'
      description: 'Vyhradené laboratórium zabezpečenia kvality vykonávajúce skúšky pevnosti v ťahu, cykly udržania vzduchu, testy odlupovania švov a certifikáciu materiálov s cieľom zabezpečiť, aby každá doska opúšťajúca dielňu spĺňala naše publikované špecifikácie.'
      href: /randdcenter/quality-inspection-lab

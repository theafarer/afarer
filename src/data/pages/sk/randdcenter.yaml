meta:
  title: 'Centrum výskumu a vývoja | {SITE}'
  description: 'Výskum a vývoj — testovanie PVC látok, inžinierstvo trupov, RF zváranie, hydrodynamické testovanie a kontrola kvality. K dispozícii sú aj vlastné služby výskumu a vývoja.'

hero:
  tagline: 'Centrum výskumu a vývoja'
  title: 'Centrum výskumu a vývoja'
  subtitle: 'Zamerané na pokrok'

intro:
  - 'Centrum výskumu a vývoja (R&D) spoločnosti afarer je hybnou silou našej misie revolucionizovať vybavenie pre vodné športy. Nadšencov vodných športov po celom svete vybavujeme bezpečnejšími, pohodlnejšími a príjemnejšími produktmi prostredníctvom neustálej inovácie v oblasti nafukovacích paddle boardov (SUP). Náš vyhradený tím inžinierov, dizajnérov a vášnivých expertov na vodné športy formuje budúcnosť odvetvia a neustále zvyšuje latku kvality, výkonu a udržateľnosti.'
  - 'Naše zariadenie výskumu a vývoja spája vedcov v oblasti materiálov, námorných inžinierov a výrobných inžinierov pod jednou strechou. Od formulácie látok a simulácie trupov až po vývoj zváracích procesov a skúšky na plnom mori je každá fáza vývoja produktu riadená údajmi a overovaná testovaním.'

mission:
  tagline: 'Naša misia'
  title: 'Inovujeme budúcnosť vodných športov'
  pillars:
    - icon: lightning
      title: 'Technologický pokrok'
      desc: 'Priekopníctvo v nových materiáloch, dizajnoch a výrobe pre vynikajúci výkon a životnosť produktov.'
    - icon: design
      title: 'Dizajn zameraný na používateľa'
      desc: 'Hlboké pochopenie a prekonanie potrieb používateľov prostredníctvom ergonomického a intuitívneho dizajnu produktov.'
    - icon: globe
      title: 'Udržateľné praktiky'
      desc: 'Minimalizácia nášho environmentálneho odtlačku využívaním ekologických materiálov a procesov.'
    - icon: shield
      title: 'Neústupná bezpečnosť'
      desc: 'Zabezpečenie najvyšších bezpečnostných štandardov prísnym testovaním a certifikáciou.'

pillars:
  - title: 'Technologický pokrok'
    desc: 'Priekopníctvo v nových materiáloch, dizajnoch a výrobných procesoch pre vynikajúci výkon a životnosť produktov.'
    icon: tech
  - title: 'Pokročilé materiály'
    desc: 'Skúmanie špičkových PVC, kompozitov a udržateľných alternatív pre vylepšené vlastnosti produktov.'
    icon: materials
  - title: 'Udržateľnosť'
    desc: 'Základný záväzok: Sme oddaní environmentálnej starostlivosti prostredníctvom udržateľnej výroby a recyklovateľných materiálov.'
    icon: sustainability

capabilities:
  tagline: 'Schopnosti'
  title: 'Schopnosti výskumu a vývoja'
  subtitle: 'Štyri základné disciplíny, ktoré nám dávajú kompletnú kontrolu nad vývojom produktu — od výskumu surovín po záverečnú certifikáciu.'
  groups:
    - title: 'Veda o materiáloch a technológia látok'
      items:
        - 'Analýza a optimalizácia formulácie PVC'
        - 'Vývoj UV stabilizácie, retardérov horenia a antimikrobiálnych prísad'
        - 'Viacvrstvová laminácia látok a inžinierstvo priľnavosti'
        - 'Zrýchlené testovanie starnutia (UV, tepelné, vlhkosť, soľná hmla)'
    - title: 'Inžinierstvo trupov a hydrodynamika'
      items:
        - 'Parametrický 3D dizajn trupov a CFD optimalizácia'
        - 'Analýza metódou konečných prvkov pre štrukturálne a nárazové zaťaženia'
        - 'Testovanie vo vlečnom bazéne v meradle modelu a validácia výkonu'
        - 'Vývoj vlastných trupov pre špeciálne profily misií'
    - title: 'Technológia zvárania a spájania'
      items:
        - 'Vývoj a optimalizácia procesu RF dielektrického zvárania'
        - 'Metódy teplovzduchového, klinového a ultrazvukového zvárania'
        - 'Lepenie adhezívami a kvalifikácia švových pások'
        - 'Modelovanie pevnosti zvarov a predikcia životnosti'
    - title: 'Testovanie, certifikácia a súlad'
      items:
        - 'Riadenie kvality a testovanie súladu s CE'
        - 'Nezávislé testovanie treťou stranou a podpora certifikácie'
        - 'Vývoj vlastných testovacích protokolov pre kvalifikáciu v obstarávaní'
        - 'Analýza porúch v prevádzke a vyšetrovanie príčin'


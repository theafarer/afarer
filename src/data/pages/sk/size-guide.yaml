how_to_choose:
  title: Ako vybrať správnu veľkosť
  cards:
    - title: Dosky SUP
      description: Vyberte dĺžku podľa svojej hmotnosti a zamýšľaného použitia. Širšie dosky (32"+) ponúkajú väčšiu stabilitu. Dlhšie dosky (11-12 stôp) lepšie držia smer pri touringu. Ťažší jazdci potrebujú dosky s väčším objemom.
    - title: Touring SUP
      description: Dlhšie dosky (11–12 stôp) sú najlepšie na prekonávanie vzdialeností a touring. Širšie dosky (32"+) ponúkajú väčšiu stabilitu. Skontrolujte nosnosť pre celkové zaťaženie vrátane výbavy.
    - title: Univerzálne SUP
      description: Vyberte dĺžku podľa hmotnosti jazdca a zamýšľaného použitia. Univerzálne dosky sa hodia na rekreáciu, fitness a jogu. Menšie dosky sú obratnejšie.

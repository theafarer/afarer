categories:
  inflatable: Nafukovacie SUP navrhnuté pre prenosnosť bez obete na výkone. Priraďte správnu veľkosť k vašej hmotnosti a štýlu veslovania.
  sup: Paddleboardy na státie pre touring, jogu, fitness a rekreačné veslovanie. Vyberte podľa dĺžky a hmotnosti jazdca.

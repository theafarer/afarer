faqs:
  - question: 'Dá sa na nafukovacej SUP stáť a rybáriť?'
    answer: 'Áno. Širšie nafukovacie dosky SUP (33 palcov a viac) poskytujú dostatočnú stabilitu na státie a nahadzovanie. Celoplošné EVA palubné podložky zaručujú pevný postoj aj za mokra.'
  - question: 'Je nafukovacia SUP dobrá na rybolov?'
    answer: 'Nafukovacie dosky SUP sú vynikajúcou rybárskou platformou, najmä na rybolov na plytčinách a preskúmavanie plytkých vôd. Široké dizajny umožňujú ľahký prístup k náradiu a vybaveniu.'
  - question: 'Koľko vybavenia si môžem vziať na nafukovaciu SUP?'
    answer: 'Väčšina nafukovacích dosiek SUP unesie celkovú kapacitu 220-300 lbs (jazdec plus vybavenie). Typická rybárska výbava s náradím, chladičom a bezpečnostným vybavením pridáva 20-40 lbs. Skontrolujte objemový rating dosky, aby ste sa uistili o dostatočnej kapacite.'
body: |
  <h2>Prečo rybáriť z nafukovacieho plavidla?</h2>
  <p>Nafukovacie dosky SUP ponúkajú rybárom jedinečné výhody, ktoré tradičné lode nedokážu poskytnúť. Ich malý ponor umožňuje prístup do vôd, kam sa motorové lode nedostanú, a tichý približovanie minimalizuje vyrušovanie rýb. Vďaka prenositeľnosti môžete rybáriť na odľahlých jazerách, riekach a pobrežných oblastiach bez prívesu alebo lodnej rampe.</p>
  <p>Kľúčové výhody zahŕňajú:</p>
  <ul>
    <li><strong>Tichosť</strong> — Žiadny hluk motora znamená, že sa k rybám môžete priblížiť bez ich vyplašenia</li>
    <li><strong>Prístup do plytkých vôd</strong> — Ponor len niekoľko palcov umožňuje rybolov v močiaroch, potokoch a na plytčinách</li>
    <li><strong>Prenositeľnosť</strong> — Zbaľte svoje plavidlo do odľahlých miest, kam sa loďou nedostanete</li>
    <li><strong>Možnosť státia</strong> — Dosky SUP umožňujú stáť pre lepší rozhľad po vode</li>
  </ul>

  <h2>Požiadavky na stabilitu</h2>
  <p>Rybolov vyžaduje stabilnú platformu. Pri výbere nafukovacieho plavidla na rybolov uprednostnite:</p>
  <ul>
    <li><strong>Šírku</strong> — Širšie dosky (33-36 palcov) poskytujú lepšiu stabilitu na státie a nahadzovanie</li>
    <li><strong>Hrúbku</strong> — 6-palcové dosky ponúkajú väčšiu tuhosť a nosnosť pre vybavenie</li>
    <li><strong>Objem</strong> — Vyšší objem (300+ litrov) unesie kombinovanú hmotnosť rybára a vybavenia</li>
    <li><strong>Povrch paluby</strong> — Celoplošná EVA penová palubná podložka poskytuje protisklzovú priľnavosť aj za mokra</li>
  </ul>

  <h2>Kompatibilita s vybavením</h2>
  <p>Typická rybárska výbava na nafukovacej doske zahŕňa:</p>
  <ul>
    <li><strong>Držiaky prútov</strong> — Nasadzovacie alebo palubné držiaky prútov pre pádlovanie s voľnými rukami</li>
    <li><strong>Box alebo chladič</strong> — Upevnený na palube gumenými šnúrami na náradie a úlovok</li>
    <li><strong>Kotvový systém</strong> — Ľahká skladacia kotva alebo kotviaca tyč na udržanie pozície v prúde</li>
    <li><strong>Uväzanie pádla</strong> — Drží pádlo pripojené, keď sú na rybolov potrebné obe ruky</li>
    <li><strong>Osobný plavací prostriedok (PFD)</strong> — Nevyhnutná bezpečnostná výbava pre všetkých rybárov</li>
  </ul>

  <h2>Odporúčané typy plavidiel na rybolov</h2>
  <p>Rôzne rybárske scenáre vyhovujú rôznym typom plavidiel:</p>

  <h3>Dosky SUP na rybolov</h3>
  <p>Najlepšie pre: rybolov na plytčinách, lov bassov na jazerách, vizuálny rybolov v plytkej vode. Zvýšená stojaca pozícia poskytuje výborný rozhľad. Pre stabilitu si zvoľte širšiu touringovú alebo all-around SUP.</p>

  <h3>Dosky SUP na rybolov</h3>
  <p>Najlepšie pre: viacosobné rybárske výpravy, prepravu ťažkého vybavenia a chránené pobrežné vody. Dosky SUP ponúkajú palubný priestor a nosnosť, a pritom zostávajú prenositeľné.</p>

  <h2>Bezpečnostné aspekty</h2>
  <ul>
    <li>Vždy noste PFD — rybolov zahŕňa státie, nahadzovanie a prenášanie vybavenia, čo zvyšuje riziko pádu</li>
    <li>Pred vyplávaním skontrolujte poveternostné podmienky a stav vody</li>
    <li>So sebou vezmite píšťalku, telefón v nepremokavom puzdre a základnú opravnú sadu</li>
    <li>Dajte niekomu vedieť, kde budete rybáriť a kedy sa plánujete vrátiť</li>
  </ul>

  <h2>Časté otázky</h2>
  <h3>Dá sa na nafukovacej SUP stáť a rybáriť?</h3>
  <p>Áno. Širšie nafukovacie dosky SUP (33 palcov a viac) poskytujú dostatočnú stabilitu na státie a nahadzovanie. Celoplošné EVA palubné podložky zaručujú pevný postoj aj za mokra.</p>

  <h3>Koľko vybavenia si môžem vziať na nafukovaciu SUP?</h3>
  <p>Väčšina nafukovacích dosiek SUP unesie celkovú kapacitu 220-300 lbs (jazdec plus vybavenie). Typická rybárska výbava s náradím, chladičom a bezpečnostným vybavením pridáva 20-40 lbs. Skontrolujte objemový rating dosky, aby ste sa uistili o dostatočnej kapacite.</p>

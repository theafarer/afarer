faqs:
  title: 'Co-brand — časté otázky'
  subtitle: 'Ako funguje co-branding Afarer a čím sa líši od OEM a private label.'
  items:
    - title: 'Je co-branding to isté ako OEM alebo private label?'
      description: 'Nie. Afarer už neprevádzkuje otvorený program OEM/private-label. Co-branded produkty zostávajú produktmi Afarer — navrhnuté, skonštruované, skontrolované a kryté značkou Afarer. Vaša identita sa objavuje ako co-brand, nie ako neoznačený produkt tretej strany.'
    - title: 'Kto môže začať co-brand projekt?'
      description: 'Kvalifikované vodno-športové podniky: existujúci krajinski partneri, paddle kluby, rezorty a hotely, organizátori podujatí a komunity. Pošlite nám zadanie projektu a my potvrdíme využiteľnosť pred začatím dizajnových prác.'
    - title: 'Bude co-branding v konflikte s mojím krajinským distribútorom?'
      description: 'Nie. Model jedna krajina — jeden distribútor má prednosť. Co-brand kolekcie sa koordinujú s miestnym krajinským partnerom, ak taký existuje, takže sa na chránenom území neobjaví žiadna paralelná ani konkurenčná značka.'
    - title: 'Aká je minimálna objednávka pre co-brand kolekciu?'
      description: 'Pilot kolekcie začínajú na 30–50 ks. Štandardné kolekcie majú 50–100 ks; veľké alebo multi-region edície 100+ ks. Časové harmonogramy zákazkového vývoja sa dohodnú per projekt.'
    - title: 'Čo predstavuje kvalitu Afarer a čo príspevok partnera?'
      description: 'Afarer vlastní dizajn produktu, konštrukciu, materiály, výrobu, QC a záruku. Partneri prispievajú konceptom kolekcie, pomenovaním, farbami, grafikou a uvedením na trh. Toto udržuje jediný kvalitatívny štandard na vode.'
    - title: 'Ako sa prihlásim?'
      description: 'Vyplňte co-brand dopyt formulár s informáciami o vašom podniku, trhu a nápade na kolekciu. Preveríme vhodnosť a do 3 pracovných dní odpovieme s návrhom a Co-Brand Project Agreement.'

features:
  title: 'Čo co-branding v Afarer znamená'
  subtitle: 'Co-branding je náš program dizajnového partnerstva — postavený na značke Afarer, ochrane územia a obmedzených kolekciách, nie na neoznačenej výrobe.'
  columns: 3
  items:
    - title: 'Produkty Afarer zostávajú produktmi Afarer'
      description: 'Co-branded kolekcia je obmedzená edícia dosiek Afarer s vpletenou vašou identitou. Nikdy nie je neoznačená, nikdy nie je značkou tretej strany a nikdy nie je otvoreným programom private-label.'
      icon: 'tabler:trademark'
    - title: 'Navrhnuté s vami'
      description: 'Vaše farby, pomenovanie a príbeh formujú kolekciu. Náš tím dizajnu a vývoja sa postará o paluby, grafiku, balenie a dokumentáciu od zadania po dodanie.'
      icon: 'tabler:pencil'
    - title: 'Pre kluby, rezorty, podujatia a komunity'
      description: 'Flotilové kolekcie pre paddle kluby a rezorty, eventové edície pre preteky a komunitné série — všetky s kvalitou a zárukou Afarer.'
      icon: 'tabler:users'
    - title: 'Chráni krajinských partnerov'
      description: 'Co-branding beží popri našom modelu jedna krajina — jeden distribútor. Krajinski partneri si udržia svoje územie; co-brand kolekcie neotvárajú dvere paralelným značkám na ich trhu.'
      icon: 'tabler:shield-check'
    - title: 'Inžinierske a kvalitatívne normy'
      description: 'Každá kolekcia sa expeduje z nášho certifikovaného dodávateľského reťazca s dokumentáciou CE a ISO 9001, tlakovými testami a rovnakými kontrolnými bodmi QC ako naša hlavná ponuka.'
      icon: 'tabler:certificate'
    - title: 'Stáva sa značkovým aktívom'
      description: 'Obmedzená co-branded kolekcia buduje váš vlastný príbeh na vode — maržu z predaja, mediálny obsah a dôvod, pre ktorý sa pádlári vracajú sezónu po sezóne.'
      icon: 'tabler:star'

intro: 'CAD model, nech je akokoľvek podrobný, nemôže odhaliť, ako sa bude doska v skutočnosti správať, kým sa nestretne s vodou. Preto je naša prototypová dielňa navrhnutá tak, aby preložila inžinierske údaje do fyzickej dosky pripravenej na vodu čo najrýchlejšie a najpresnejšie. Každý nový model Afarer — a každá významná zákazková stavba — prechádza touto dielňou, skôr než sa investuje do výrobných nástrojov.'

content_html: |
  <h2>Kde sa dizajn stáva realitou</h2>
  <p>Dielňa je plne vybavená na súbežnú výrobu trupu, bočníc a výstroja. Tento prístup paralelných pracovných postupov skracuje dodaciu lehotu prototypu na 8–12 týždňov od uvoľnenia z vývoja, v porovnaní s priemyselným štandardom 16–20 týždňov. Keď vaša aplikácia vyžaduje špecializované riešenie, dokážeme sa dopracovať od konceptu po overenie na vode do troch mesiacov.</p>

  <h2>Schopnosti dielne</h2>
  <table>
    <thead><tr><th>Pracovisko</th><th>Vybavenie</th><th>Účel</th></tr></thead>
    <tbody>
      <tr><td>Výroba trupu</td><td>CNC strihačka látok, lis na tepelnú lamináciu, stanica prípravy drop-stitch jadra</td><td>Výroba trupov v plnom meradle vo všetkých troch typoch konštrukcie</td></tr>
      <tr><td>Montáž bočníc &amp; komôr</td><td>RF zvárací lis, stanica predpínania horúcim vzduchom, skúšobný prípravok na nafúknutie</td><td>Výroba bočníc a komôr v plnej veľkosti so všetkými prepážkami a ventilmi</td></tr>
      <tr><td>Výstroj &amp; montáž</td><td>Prípravok na frézovanie plutvových boxov, zváracie prípravky na upevnenia batožiny a rukoväte, stanica strihania palubných podložiek</td><td>Kompletná výbava: plutvy, upevnenia batožiny, zátky na leash, rukoväte, palubné podložky, ventily</td></tr>
      <tr><td>Instrumentačný priestor</td><td>GPS rýchlostný senzor, tlakové snímače, akcelerometre, pole termočlánkov, dátový záznamník</td><td>Inštalácia a kalibrácia prístrojov pre skúšky na mori</td></tr>
    </tbody>
  </table>

  <h2>Cesta prototypu — krok za krokom</h2>
  <ol>
    <li><strong>Prevedenie z vývoja</strong> — Dizajnový balík (3D model, FEA správa, kusovník, harmonogram laminácie) je formálne preskúmaný vedúcim dielne a projektovým inžinierom. Akékoľvek výrobné obavy sú označené a vyriešené pred začiatkom strihania.</li>
    <li><strong>Výroba trupu</strong> — Trup je postavený podľa inžinierskej špecifikácie. Pre jednovrstvovú konštrukciu: drop-stitch jadro je laminované špecifikovaným PVC povrchom. Pre dvojvrstvovú konštrukciu: dodatočná vrstva je nanesená na základnú lamináciu pred strihom vzoru. Pre zletú konštrukciu: parametre laminácie sú načítané zo schváleného procesného listu a overené na prvej vzorke.</li>
    <li><strong>Výroba bočníc</strong> — Látka je strihaná pomocou CNC šablón, potom RF-zvarená do bočníc a komôr v plnej veľkosti. Každá komora je nafúknutá na skúšobný tlak a ponechaná 24 h na počiatočnú stabilizáciu.</li>
    <li><strong>Montáž &amp; výstroj</strong> — Trup a bočnice sú spojené. Plutvové boxy a upevnenia batožiny sú namontované, zátky na leash a nosné rukoväte sú inštalované, nafukovací ventil je dotiahnutý a palubná podložka je nanesená a zarovnaná.</li>
    <li><strong>Statické testy</strong> — Skôr než sa doska dotkne vody, podstupuje: kontrolu vztlaku (plné zaťaženie + 30 % rezervy), test udržania tlaku komôr, test poklesu tlaku ventilu, ťahový test rukovätí a upevnení.</li>
    <li><strong>Program skúšok na mori</strong> — 20 hodín testovania vo vode, podrobne opísané nižšie.</li>
    <li><strong>Revízia prototypu</strong> — Koná sa formálne schvaľovacie stretnutie s tímami vývoja, výroby a kvality. Vyžadované zmeny dizajnu sú zdokumentované a zapracované do vydania do výroby.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-hodinový program skúšok na mori — harmonogram testov</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Zoznámenie sa na hladkej vode — sledovanie kurzu pri nízkej rýchlosti, otáčanie, kontrola postoja a trimu</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Skúška rýchlosti — GPS overená maximálna rýchlosť, cestovná rýchlosť, udržané tempo pri 3 tempách záberov</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test otáčania — polomer otočenia okolo osi a oblúkového otočenia, odozva dosky na ľavý a pravý bok</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test vlnobitia — opakované prejazdy cez vlnobitie 0,5–1,0 m; akcelerometer v pozícii postoja jazdca</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Test stability — statický uhol náklonu so 4 jazdcami rôznej hmotnosti, posunuté zaťaženie na pravú stranu</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Výdržná jazda — 3 h nepretržite v cestovnom tempe; monitorovanie tlaku v komorách, teploty bočníc a únavy jazdca</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Finálna kontrola — kontrola všetkých komponentov po skúške, dotiahnutie/skontrolovanie všetkých spojov, dokumentácia zistení</span>
      </div>
    </div>
  </div>

  <h2>Zákazkové prototypovanie pre unikátne aplikácie</h2>
  <p>Prototypová dielňa je miestom, kde riešime problémy, ktoré štandardné výrobné dosky nedokážu pokryť. Nedávne príklady zahŕňajú:</p>
  <ul>
    <li>Vysoko viditeľná záchranná doska SUP pre organizáciu pátrania a záchrany, vyžadujúca integrované úchopové rukoväte, držiaky na záchranné vybavenie a trup s vysokým vztlakom pre vyťahovanie postihnutých — všetko zprototypované, vybavené a otestované v našom zariadení.</li>
    <li>Expedičná touring doska SUP pre dodávateľa hydrografického prieskumu, s odnímateľným sťažňom na prístroje, utesnenými portmi na vybavenie a nízkoprofilovým držiakom sondy navrhnutým na minimalizáciu odporu vody.</li>
    <li>Kompaktná rybárska doska SUP pre flotilu rezortu, kde prototyp slúžil na overenie stability, upevnenia vybavenia a odolnosti pri dennom používaní v požičovni, než sa klient zaviazal k flotile štyroch dosiek.</li>
  </ul>

  <h2>Náš prototypový tím</h2>
  <p>Dielňu obsluhuje osem všestranne zručných morských technikov, každý zaškolený v najmenej dvoch z troch hlavných odborov (trup, bočnice, výstroj). Vedúci tímu je majstrovský výrobca s 16-ročnými skúsenosťami od jedinečných zákazkových stavieb po výrobné série. Každý prototyp má prideleného vyhradeného projektového inžiniera, ktorý je jediným kontaktným bodom pre klienta počas celej výroby a skúšok.</p>

  <h2>Zainteresovanosť klienta</h2>
  <p>Aktívne povzbudzujeme našich klientov, aby sa zúčastnili kľúčových míľnikov počas výroby prototypu — najmä prvého prezretia výbavy a skúšok na mori. Vaša prevádzková spätná väzba v týchto fázach je neoceniteľná pri doladení dosky pred vstupom do výroby. Nestaviame vo vákuu; stavíme v partnerstve s vami.</p>
  <p>20-hodinová skúška na mori je tiež príležitosťou pre váš tím zoznámiť sa s ovládaním dosky, rozložením paluby a požiadavkami na údržbu, čo zaručuje hladký prechod do prevádzky pri dodaní výrobných dosiek.</p>


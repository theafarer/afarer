subtitle: 'afarer ručí za kvalitu každého nafukovacieho morského produktu, ktorý vyrábame. Táto obmedzená záruka stanovuje podmienky a rozsah krytia vášho produktu afarer.'
seo:
  headline: 'Záruka na nafukovacie SUP afarer — 5-ročná obmedzená záruka | afarer'
  description: 'afarer ponúka 5-ročnú obmedzenú záruku na hlavnú palubnú látku, švy a štrukturálnu integritu drop-stitch jadra. Krytie zahŕňa aj nafukovacie ventily a príslušenstvo inštalované vo výrobe. Kompletné záručné podmienky pre nafukovacie dosky SUP afarer.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Táto obmedzená záruka sa vzťahuje na nové nafukovacie morské produkty značky afarer zakúpené priamo od spoločnosti afarer alebo od autorizovaného predajcu či obchodníka afarer. Dátumom účinnosti je overiteľný dátum pôvodného maloobchodného nákupu.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Rozsah a trvanie záruky</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 rokov</h3>
        <p class="text-sm text-gray-600 mt-1">Integrita hlavnej látky trubice (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 rokov</h3>
        <p class="text-sm text-gray-600 mt-1">Štrukturálna integrita trupu zo sklolaminátu</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 rokov</h3>
        <p class="text-sm text-gray-600 mt-1">Schopnosť švov nafukovacej trubice udržať vzduch</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 rokov</h3>
        <p class="text-sm text-gray-600 mt-1">Funkčnosť nafukovacieho ventilu</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 rok</h3>
        <p class="text-sm text-gray-600 mt-1">Príslušenstvo a pomocné armatúry inštalované vo výrobe</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 rok*</h3>
        <p class="text-sm text-gray-600 mt-1">Komerčné, požičovné alebo flotilové použitie — všetky komponenty</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komerčné, vládne, charterové, požičovné alebo inštruktážne použitie skracuje záruku na 1 rok. Použitie v pretekoch alebo súťažiach záruku úplne ruší.</p>
  </div>

  <h2>Čo je kryté</h2>
  <h3>Hlavná látka trubice (5 rokov)</h3>
  <p>afarer ručí za hlavnú palubnú látku proti zhoršeniu porozity, ktoré podstatne ohrozuje schopnosť výrobku udržať prevádzkové nafúknutie. Toto sa vzťahuje na látku potiahnutú PVC a všetky ostatné materiály palubnej látky použité pri výrobe.</p>

  <h3>Štrukturálna integrita trupu zo sklolaminátu (5 rokov)</h3>
  <p>Pre produkty s trupom z plastu vystuženého sklenenými vláknami (FRP) sa ručí za základnú kompozitnú konštrukciu proti štrukturálnemu poškodeniu spôsobenému vadami materiálov alebo spracovania.</p>

  <h3>Schopnosť švov nafukovacej trubice udržať vzduch (5 rokov)</h3>
  <p>Švy nafukovacích trubíc, spojené počas výroby, sú kryté proti výrobným vadám, ktoré spôsobujú podstatný únik vzduchu švom. Periodická kontrola a udržiavanie primeraných nafukovacích tlakov sú podmienkou krytia.</p>

  <h3>Funkčnosť nafukovacieho ventilu (5 rokov)</h3>
  <p>Nafukovacie ventily vzduchu pôvodne inštalované spoločnosťou afarer sú kryté proti výrobným vadám materiálov alebo spracovania, ktoré bránia ventilu udržať vzduch tak, ako je navrhnuté.</p>

  <h3>Príslušenstvo inštalované vo výrobe (1 rok)</h3>
  <p>Komponenty a armatúry vyrobené spoločnosťou afarer a pôvodne inštalované vo výrobe sú kryté proti vadám materiálu a spracovania počas jedného roka. Nezahŕňa to položky tretích strán, ktoré sú kryté len príslušnými zárukami ich výrobcov.</p>

  <h2>Čo nie je kryté</h2>
  <ul>
    <li>Kozmetické chyby vrátane zoškvrnenia, škvŕn, vyblednutia, zakriedovania alebo akejkoľvek zmeny vzhľadu</li>
    <li>Prepichnutia, rezy, trhliny, roztrhnutia alebo iné fyzické poškodenia</li>
    <li>Prasklinky, praskanie, oter, odieranie alebo zhoršenie v dôsledku trenia alebo kontaktu</li>
    <li>Degradácia v dôsledku expozície UV žiareniu, poveternostným vplyvom alebo atmosférickým podmienkam</li>
    <li>Poškodenie kontaktom s palivami, rozpúšťadlami, kyselinami, zásadami alebo chemikáliami</li>
    <li>Poškodenie v dôsledku nedbanlivosti, nesprávneho použitia, zneužitia, nehody alebo bežného opotrebenia</li>
    <li>Problémy povrchovej úpravy gelcoat alebo náteru (pľuzgierovanie, prasklinky, zoškvrnenie, vyblednutie)</li>
    <li>Poškodenie nárazom, namáhaním, nesprávnou oporou alebo prepravou na prívese</li>
    <li>Poškodenie v dôsledku nesprávneho nafúknutia/vypustenia alebo použitia neschválených nafukovacích zariadení</li>
    <li>Vybavenie, komponenty alebo systémy tretích strán (kryté ich príslušnými výrobcami)</li>
  </ul>

  <h2>Povinnosť výrobcu a náprava</h2>
  <p>Jedinou a výlučnou povinnosťou spoločnosti afarer je oprava alebo výmena — podľa uváženia afarer — akéhokoľvek komponentu, u ktorého boli zistené vady materiálov alebo spracovania a ktorý je krytý touto zárukou. Opravy alebo výmeny vykonáva afarer alebo ním určené autorizované servisné stredisko. Komponenty opravené alebo vymenené sú kryté len počas zvyšku pôvodnej záručnej lehoty.</p>

  <h2>Podmienky záruky</h2>
  <ul>
    <li><strong>Registrácia:</strong> Produkt musí byť riadne zaregistrovaný podľa ustanovení záručných podmienok.</li>
    <li><strong>Údržba:</strong> Produkt musí byť udržiavaný v súlade s publikovanými pokynmi afarer, vrátane periodických kontrol a udržiavania primeraných nafukovacích tlakov.</li>
    <li><strong>Spolupráca:</strong> Kupujúci musí plne a bezodkladne spolupracovať so spoločnosťou afarer vo všetkých záležitostiach týkajúcich sa záručných reklamácií.</li>
    <li><strong>Pôvodný kupujúci:</strong> Táto záruka sa vzťahuje výlučne na pôvodného koncového používateľa a nie je prenositeľná.</li>
  </ul>

  <h2>Komerčné použitie</h2>
  <p>Ak sa produkt používa na komerčné, vládne, neziskové, charterové, požičovné, inštruktážne alebo akýkoľvek iný účel než súkromná rekreačná činnosť, záručná lehota pre všetky komponenty sa skracuje na jeden (1) rok od pôvodného dátumu maloobchodného nákupu. Použitie v pretekoch, rýchlostných alebo výdržných súťažiach záruku okamžite a neodvolateľne úplne ruší.</p>

  <h2>Ako uplatniť záručnú reklamáciu</h2>
  <p>Kontaktujte spoločnosť afarer alebo vášho autorizovaného predajcu s dokladom o nákupe a podrobným popisom problému. afarer preskúma reklamáciu a poskytne pokyny na kontrolu a servis.</p>
  <p>V prípade otázok týkajúcich sa záručného servisu nás kontaktujte prostredníctvom našej <a href="/contact" class="text-sky-600 underline">kontaktnej stránky</a> s číslom objednávky a údajmi o produkte.</p>

  <h2>Položky tretích strán</h2>
  <p>Vybavenie, komponenty alebo systémy vyrobené tretími stranami (aj keď sú inštalované spoločnosťou afarer) sú kryté výlučne zárukou poskytovanou ich príslušným výrobcom. afarer výslovne odmieta akúkoľvek záručnú zodpovednosť za takéto položky tretích strán.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Toto záručné prehlásenie je súhrnom úplnej obmedzenej záruky výrobcu afarer. Úplný právny záručný dokument upravuje všetky záručné podmienky. Špecifikácie sa môžu zmeniť bez predchádzajúceho upozornenia. afarer je značka prevádzkovaná spoločnosťou Aquafarer LLC (USA).
  </p>

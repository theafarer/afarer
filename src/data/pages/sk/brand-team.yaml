philosophy:
  tagline: 'Dizajnová filozofia'
  title: 'Inžiniersky vedený dizajn<br />— každý detail záleží'
  subtitle: 'Naša inžinierska filozofia sa sústreďuje na tri princípy, ktoré sprevádzajú každý produkt, ktorý vyrábame.'
  list:
    - 'Spoľahlivosť na prvom mieste: Každý produkt afarer je testovaný tak, aby zvládol reálne podmienky — od záchranných operácií v studenej vode po prenájmy v tropických rezortoch. Konštrukciu preceňujeme tam, kde to má najväčší význam.'
    - 'Výrobná presnosť: Naše zariadenia používajú CNC rezanie, vysokofrekvenčné zváranie a automatizované tlakové testovanie. Každý šev, každý ventil, každé upevnenie spĺňa zdokumentované špecifikácie.'
    - 'Neustála inovácia: Náš tím výskumu a vývoja priebežne vyhodnocuje nové materiály, výrobné metódy a dizajnové vylepšenia.Na problémy nečakáme — predvídame ich.'

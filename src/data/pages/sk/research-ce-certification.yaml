content_html: |
  <h2>Čo je certifikácia CE?</h2>
  <p>Označenie CE (Conformit&eacute; Europ&eacute;enne) označuje, že výrobok spĺňa požiadavky EÚ na zdravie, bezpečnosť a životné prostredie. Pre nafukovacie plavidlá závisí príslušný regulačný rámec od kategórie výrobku.</p>

  <h2>Platné smernice</h2>

  <h3>Smernica o rekreačných plavidlách (2013/53/EU)</h3>
  <p>Hlavná smernica pre rekreačné plavidlá v EÚ. Nafukovacie dosky SUP pod 2,4 m spadajú mimo jej rozsah a namiesto toho sú certifikované podľa EN ISO 25649.</p>

  <h3>Nariadenie o osobných ochranných prostriedkoch (2016/425)</h3>
  <p>Záchranné vesty, plavacie pomôcky a bezpečnostné vybavenie dodávané s plavidlami musia spĺňať požiadavky nariadenia PPE, vrátane typového skúšania (Modul B) notifikovaným subjektom a zabezpečenia kvality výroby (Modul D alebo E).</p>

  <h2>Proces certifikácie</h2>
  <ol>
    <li>Klasifikácia výrobku: Určenie kategórie dizajnu plavidla (A – D podľa ISO 8666)</li>
    <li>Platné normy: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (výrobná tabuľka)</li>
    <li>Príprava technického spisu: Výkresy dizajnu, kusovník, certifikáty materiálov, posúdenie rizík</li>
    <li>Typové skúšanie: Vztlak, stabilita, nosnosť, testovanie materiálov, pevnosť švov, udržanie vzduchu</li>
    <li>Kontrola výroby vo výrobe: Audit výrobných procesov notifikovaným subjektom</li>
    <li>Deklarácia zhody: Výrobca podpíše DoC a umiestni označenie CE</li>
  </ol>

  <h2>Notifikované subjekty pre nafukovacie plavidlá</h2>
  <p>Bežné NS zahŕňajú Bureau Veritas (Francúzsko), DNV GL (Nemecko), RINA (Taliansko), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Nemecko).</p>

  <h2>Časový harmonogram a náklady</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fáza</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Trvanie</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Typický náklad (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Príprava technického spisu</td><td class="p-3 border">2 – 4 týždne</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Typové skúšanie</td><td class="p-3 border">4 – 8 týždňov</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Audit výroby</td><td class="p-3 border">1 – 2 dni (na mieste)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Spolu (prvý produkt)</td><td class="p-3 border">8 – 14 týždňov</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Čo to znamená pre kupujúcich</h2>
  <p>Pri nákupe certifikovaných nafukovacích dosiek SUP si vždy overte, že označenie CE je na výrobnej tabuľke, existuje platná DoC, je uvedené číslo notifikovaného subjektu a manuál pre vlastníka obsahuje bezpečnostné pokyny vo vašom miestnom jazyku. Všetky produkty Afarer nesú certifikáciu CE s plnou sledovateľnosťou k audítorským správam notifikovaného subjektu.</p>


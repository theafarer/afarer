features:
  title: 'What Co-Branding Means at Afarer'
  subtitle: 'Co-branding is our design-partnership program — built around the Afarer brand, territory protection, and limited collections, not unbranded production.'
  columns: 3
  items:
    - title: 'Afarer Products Stay Afarer Products'
      description: 'A co-branded collection is a limited edition of Afarer boards with your identity woven in. It is never unbranded, never a third-party brand, and never an open private-label program.'
      icon: 'tabler:trademark'
    - title: 'Designed With You'
      description: 'Your colors, naming, and story shape the collection. Our design and engineering team handles decks, graphics, packaging, and documentation from brief to delivery.'
      icon: 'tabler:pencil'
    - title: 'For Clubs, Resorts, Events & Communities'
      description: 'Fleet collections for paddle clubs and resorts, event editions for races and community series — all carrying the Afarer quality and warranty.'
      icon: 'tabler:users'
    - title: 'Protects Country Partners'
      description: 'Co-branding runs alongside our one-country-one-distributor model. National partners keep their territory; co-brand collections do not open the door to parallel brands in their market.'
      icon: 'tabler:shield-check'
    - title: 'Engineering & Quality Standards'
      description: 'Every collection ships from our certified supply chain with CE and ISO 9001 documentation, pressure-testing, and the same QC checkpoints as our core range.'
      icon: 'tabler:certificate'
    - title: 'Becomes a Brand Asset'
      description: 'A limited co-branded collection builds your own story on the water — sell-through margin, media content, and a reason for paddlers to come back season after season.'
      icon: 'tabler:star'

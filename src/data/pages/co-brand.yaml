faqs:
  title: 'Co-Brand — FAQ'
  subtitle: 'How Afarer co-branding works, and how it differs from OEM and private label.'
  items:
    - title: 'Is co-branding the same as OEM or private label?'
      description: 'No. Afarer no longer runs an open OEM/private-label program. Co-branded products remain Afarer products — designed, engineered, quality-checked, and backed by the Afarer brand. Your identity appears as a co-brand, not as an unbranded third-party product.'
    - title: 'Who can start a co-brand project?'
      description: 'Qualified water-sports businesses: existing country partners, paddle clubs, resorts and hotels, event organizers, and communities. Send us a project brief and we confirm applicability before design work begins.'
    - title: 'Will co-branding conflict with my country distributor?'
      description: 'No. The one-country-one-distributor model takes priority. Co-brand collections are coordinated with the local country partner where one exists, so no parallel or competing brand appears inside a protected territory.'
    - title: 'What is the minimum order for a co-brand collection?'
      description: 'Pilot collections start at 30–50 units. Standard collections are 50–100 units; large or multi-region editions are 100+ units. Custom development timelines are agreed per project.'
    - title: 'What amounts to Afarer quality versus partner input?'
      description: 'Afarer owns product design, engineering, materials, construction, QC, and warranty. Partners contribute collection concept, naming, colors, graphics input, and go-to-market. This keeps one quality standard on the water.'
    - title: 'How do I apply?'
      description: 'Complete the co-brand inquiry form with your business, market, and collection idea. We review fit, then respond within 3 business days with a proposal and the Co-Brand Project Agreement.'

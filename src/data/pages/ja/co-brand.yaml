features:
  title: 'Afarerのコーブランディングとは'
  subtitle: 'コーブランディングは、Afarerブランド、地域保護、限定コレクションを軸にしたデザインパートナーシップ・プログラムであり、ノンブランド生産ではありません。'
  columns: 3
  items:
    - title: 'Afarer製品はAfarer製品のまま'
      description: 'コーブランドコレクションは、あなたのアイデンティティを織り込んだAfarerボードの限定エディションです。ノンブランドにも、第三者ブランドにも、オープンなプライベートレーベルにもなりません。'
      icon: 'tabler:trademark'
    - title: 'あなたと一緒にデザイン'
      description: 'あなたのカラー、ネーミング、ストーリーがコレクションを形作ります。デザイン・設計チームがブリーフから納品までデッキ、グラフィック、パッケージ、ドキュメントを担当します。'
      icon: 'tabler:pencil'
    - title: 'クラブ・リゾート・イベント・コミュニティ向け'
      description: 'パドルクラブやリゾート向けのフリートコレクション、レースやコミュニティシリーズ向けのイベントエディション — すべてにAfarerの品質と保証。'
      icon: 'tabler:users'
    - title: 'カントリーパートナーを保護'
      description: 'コーブランディングは「1国1ディストリビューター」モデルと併走します。各国パートナーは自国の販売圏を維持し、コーブランドコレクションが並行ブランドの参入を許すことはありません。'
      icon: 'tabler:shield-check'
    - title: '設計・品質基準'
      description: 'すべてのコレクションは、CE・ISO 9001ドキュメント、加圧テスト、コア製品と同じQCチェックポイントを備えた認証サプライチェーンから出荷されます。'
      icon: 'tabler:certificate'
    - title: 'ブランド資産になる'
      description: '限定コーブランドコレクションは、水上にあなた自身のストーリーを築きます — 販売マージン、メディアコンテンツ、そしてパドラーがシーズンごとに戻ってくる理由に。'
      icon: 'tabler:star'
table:
  title: 'コーブランドコレクションのティア'
  subtitle: 'コーブランドコレクションの典型的な条件。価格はUSD、FOB青島。カスタムデッキデザインは開発に15〜20営業日を追加。新規金型はプロジェクト単位で見積します。'
  caption: 'すべてのコーブランド製品はAfarer製品であり、Afarerのブランドアイデンティティを持ちます。プロジェクト範囲、独占期間、最終条件はコーブランドプロジェクト契約書で合意します。'
  head:
    - コーブランドティア
    - 最小発注数（台）
    - リードタイム
    - 支払い条件
  rows:
    - [パイロットコレクション, 30–50, 30–45営業日, 30%頭金 / 70%出荷前払い]
    - [スタンダードコーブランドコレクション, 50–100, 30–45営業日, 30%頭金 / 70%出荷前払い]
    - [大型・複数地域コレクション, 100+, 45–60営業日, 30%頭金 / 70%出荷前払い]
    - [新規金型・ディープローカライズ, 200+, 60–90営業日, 30%頭金 / 70%出荷前払い]
faqs:
  title: 'コーブランド — FAQ'
  subtitle: 'Afarerのコーブランディングの仕組みと、OEM・プライベートレーベルとの違い。'
  items:
    - title: 'コーブランディングはOEMやプライベートレーベルと同じですか？'
      description: '違います。AfarerはオープンなOEM/プライベートレーベルプログラムは行っていません。コーブランド製品はAfarer製品のまま — デザイン、設計、品質検査、保証はすべてAfarerブランドが担います。あなたのアイデンティティはコーブランドとして表れ、ノンブランドの第三者製品にはなりません。'
    - title: '誰がコーブランドプロジェクトを始められますか？'
      description: '認定されたマリンスポーツ企業：既存のカントリーパートナー、パドルクラブ、リゾート・ホテル、イベント主催者、コミュニティです。プロジェクトブリーフをお送りいただき、デザイン開始前に適合性を確認します。'
    - title: 'コーブランディングは自国のディストリビューターと競合しませんか？'
      description: 'しません。「1国1ディストリビューター」モデルが優先されます。コーブランドコレクションは、現地カントリーパートナーがいる場合はそのパートナーと調整するため、保護された販売圏内に並行ブランドや競合ブランドが現れることはありません。'
    - title: 'コーブランドコレクションの最小発注数は？'
      description: 'パイロットコレクションは30〜50台から。スタンダードは50〜100台、大型・複数地域エディションは100台以上です。カスタム開発のスケジュールはプロジェクト単位で合意します。'
    - title: 'Afarerの役割とパートナーの役割は？'
      description: 'Afarerは製品デザイン、設計、素材、構造、QC、保証を所有します。パートナーはコレクションのコンセプト、ネーミング、カラー、グラフィック、市場投入を担います。これにより水上の品質基準を一つに保ちます。'
    - title: '申し込み方法は？'
      description: 'コーブランドお問い合わせフォームに、事業内容、市場、コレクションのアイデアをご記入ください。適合性を検討し、3営業日以内にご提案とコーブランドプロジェクト契約書でお返事します。'

intro: 生産を外部の工場に委託するブランドとは異なり、afarerは製造チェーン全体を所有・運営しています。この垂直統合により、すべての段階で厳格な品質管理を維持し、カスタム要件に迅速に対応し、ロットごとに一貫した製品品質を提供することができます。以下は、当社施設でボートが製造されるプロセスです。
steps:
  - step: '01'
    title: 材料受入・検査
    description: 入荷するPVC生地、ガラス繊維マット、樹脂、金具の各バッチは仕様に照らして検査されます。生地サンプルは、生産にリリースされる前に引張強度、厚さの均一性、耐紫外線性がテストされます。不適合材料は隔離され返品されます。
    duration: 1〜2日
  - step: '02'
    title: 自動PVC切断
    description: 承認された生地は自動CNC切断機にセットされ、サブミリ精度で切断されます。コンピューター最適化されたネスティングにより、パネルの廃棄率は通常5%未満に抑えられます。カットされたパネルはボートモデルとチャンバーごとにラベル付けされ、溶接ワークショップに送られます。
    duration: ボートキットあたり2〜4時間
  - step: '03'
    title: チューブ熱封着・溶接
    description: パネルは熱封着機で仮固定され、管理された200〜300 °Cの温度でホットエア溶着により接合されます。主要継ぎ目は、気密性と高強度を確保するためRF誘電溶接で補強されます。完成したチャンバーは、30分間の気密保持検証のため使用圧力の1.5倍に加圧されます。
    duration: ボートあたり1〜2日
  - step: '04'
    title: FRP RIBハル成形
    description: RIBボートハルはハンドレイアップFRP成形で製造されます。ガラス繊維マットとロービングクロスの層が精密金型内でポリエステルまたはビニルエステル樹脂とともにハンドローリングされます。各層は一貫した積層品質のためにバキュームバッグ処理されます。ハルは高光沢、耐紫外線のマリン表面を提供するゲルコートで仕上げられます。
    duration: ハルあたり2〜4日
  - step: '05'
    title: SUPプリント・装飾
    description: SUPボードのデッキグラフィックは、フルカラーのフォトクオリティデザインにはデジタルプリントを、耐久性のあるロゴや繰り返しパターンにはスクリーンプリントを用いて施されます。プリントはUV耐性と耐摩耗性を高めるため、硬化・シール処理されます。
    duration: 1〜2日
  - step: '06'
    title: 最終組立・艤装
    description: FRPハルとPVCチューブアセンブリは組立ライン上で結合されます。エンジンを搭載し、操舵・スロットルコントロールを接続し、燃料システムを取り付け、電気配線ハーネス全体を配線します。各ボートは100項目の組立チェックリストに従い、各段階で必須の署名確認が行われます。
    duration: 2〜4日
  - step: '07'
    title: 品質テスト・検査
    description: 完成したすべてのボートは、必須の品質ゲートを通過します。チャンバー気密テスト、金具動作確認、締結部品のトルク検証、外観検査を実施します。カスタム・試作艇には、安定性と操縦性を確認する水上試験も実施されます。
    duration: 1〜2日
  - step: '08'
    title: 梱包・出荷
    description: ボートは空気を抜き、手順に従って折り畳み、丈夫な織バッグまたは合板クレートに梱包して出荷積み込みします。各梱包にはモデル、シリアル番号、配送先を表示します。FCL・LCLコンテナ輸送による世界中への出荷のため、フォワーダーと調整します。
    duration: 1日

workshops:
  - title: SUPボード生産
    description: インフレータブルSUPボード用の4本の並列組立ライン。各ラインは1シフトで50–80台を生産可能。デジタル印刷およびスクリーン印刷設備が同時稼働。年間SUP生産能力：8,000台以上。
    output: 年間8,000+台のSUP
  - title: SUP Boat Production
    description: '最大 7.6 m の SUP 船体用の 6 つのモールドステーションを備えたグラスファイバー船体専用のワークショップ。 チューブ溶接および組立エリアでは、3 つの SUP を同時に処理します。 年間RIB収容能力: 2,000隻以上。'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'ゴムボート、カヤック、ディンギーの多目的生産ライン。 熱風溶接ステーション、RF 誘電プレス、および組立ワークステーションは、注文構成に基づいて再構成されます。 年間生産能力: 5,000 台以上。'
    output: 5,000+台/年
  - title: 安全装備
    description: '救命胴衣と安全装置用に独立したクリーンルーム生産エリア。 専用の縫製、フォーム挿入、およびテストステーション。 ライフベストの年間生産能力: 50,000 個以上。'
    output: 年間50,000個以上のライフジャケット生産実績
oem_capacity:
  moq: 'SUP: 5–10 units | SUP: 2–5 units | SUP/SUP: 10–50 units | Custom mould: 200+ units'
  lead_time: 標準：30〜5日。サンプル：15〜0日。急ぎ対応可能。

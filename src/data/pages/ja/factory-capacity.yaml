hero:
  tagline: 生産能力
  title: 製造能力と年間生産量
  subtitle: 年間15,000隻以上を生産し、拡張余地のある12,000 m²の施設
intro: afarer は、中国の青島で最大規模の専用インフレータブル ボート製造施設の 1 つを運営しています。 当社の 12,000 平方メートルの工場は、並行して稼働する 6 つの専門ワークショップで構成されており、SUP、カヤック、ディンギー、SUP、および安全装置のライン全体で年間 15,000 隻を超えるボートを生産する能力を備えています。

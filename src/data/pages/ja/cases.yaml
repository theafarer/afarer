features3_cases:
  tagline: 厳選事例
  title: カスタムソリューション<br />実際の課題に応える
  isBeforeContent: false
  columns: 3
  items:
    - title: 欧州ダイビングセンターフリート
      customer: BlueMed Diving Centers
      country: ギリシャ
      industry: ダイビング＆マリントourism
      challenge: 複数のギリシャ諸島に展開するダイビングセンター向けに、ダイブ仕様のSUPを12台必要としました。各ボードにはカスタムギア取り付け、8本のタンク収納、オープンウォーターでのダイバー乗降用の安定したプラットフォームが必要でした。観光シーズン開始までに60日以内にフリートを納入する必要がありました。
      solution: 統合ギアラック、安定プラットフォーム、乗船安定性を高める超広幅ドロップスチッチ構造を備えたSUP Voyager Diveモデル12台を製造。各ボードには顧客フリートのカラーリングを適用。全12台のボードを圧力試験に合格させ、55日以内に青島から出荷。
      product: SUPボイャージュダイブ
      results: 観光シーズンに向けて12枚すべてのボードが納期通りに納入されました。フリートは18ヶ月以上、材料不良ゼロで毎日稼働しています。顧客は2年目に追加6台を発注しました。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Voyager Diveは日々のダイビングオペレーションの要となっています。安定性が優れており、機材収納レイアウトがデッキを清潔かつ安全に保ち、ゲストに快適な空間を提供しています。
      icon: tabler:lifebuoy
    - title: オーストラリア代理店コブランドプログラム
      customer: Pacific Watersports Pty Ltd
      country: オーストラリア
      industry: コブランド＆パートナーシッププログラム
      challenge: オーストラリアのディストリビューターは、中国の直販ブランドと競争するために、競争力のある価格でプライベートブランドのSUPボードラインナップが必要でした。ビギナーから上級者向けまで8つのユニークモデルが必要で、カスタムグラフィックス、カスタムパッケージ、小売店へのドロップシップ履行が求められました。
      solution: 8つのSUPモデル（オールアラウンド、ツーリング、ヨガ、キッズ、スポーツ、ウルトラコンパクト、ウルトラストブルーウォーター）をオーストラリア専用グラフィックパッケージで開発。セットアップ動画リンク付きQRコードをカスタム小売パッケージに印刷。青島からオーストラリア小売店へドロップシッピング物流を設定。
      product: カスタムSUPライン（8モデル）
      results: コンセプトから初回出荷まで90日間。第1シーズンの小売り販売率85%。ディストリビューターは2年目に追加SUPモデルを含むパートナーシップを拡大。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: afarerは90日間で初期設計から店頭陳列まで、完全なSUPラインを納入しました。品質は2倍の価格帯で販売されるブランドと同等です。
      icon: tabler:currency-dollar
    - title: 中東救助艇供給
      customer: 国家民事防衛庁
      country: アラブ首長国連邦
      industry: 捜索・救助
      challenge: 民間防衛機関が、沿岸捜索救難、港湾セキュリティ、洪水対応向けにパトロール対応SUPを20台必要としていました。高視認性ボード、完全な安全装備、現地海事規制への準拠が要求されました。
      solution: 高視認性オレンジ色のドロップスティッチ構造、フル安全パッケージ、SOLAS反射テープ、強化構造を備えたSUPパトロールモデル20台を納入。各ボードはCE認証を取得し、適用規格に準拠して試験済み。書類パッケージには現地登録用の適合証明書が含まれていました。
      product: SUPパトロール
      results: 沿岸5拠点にフリートを展開。ボードは極端な高温（45°C以上）でも劣化なしで運用。性能と耐久性は仕様を超過。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Patrolは私たちの運用要件を超えました。極端な暑さの条件下でも、ボードは24ヶ月の毎日使用後にUV劣化の兆候を示しませんでした。
      icon: tabler:alert-triangle
    - title: 欧州コブランドパートナーシップ
      customer: North Sea Marine Equipment BV
      country: オランダ
      industry: コブランド＆パートナーシッププログラム
      challenge: 確立された欧州のマリンブランドが、製造設備への投資なしにSUP市場に参入しようとしていました。私立ブランド化、CE認証、専属EU販売権を備えた5つのSUPモデル（9ft〜12ft）を製造可能なホワイトレーベルパートナーが必要でした。
      solution: 5つのSUPモデルについてコブランド生産契約を締結しました。各モデルにはお客様のロゴとカラースキームが適用されます。各モデルのCE認証書類を準備し、最低注文数量の条件付きでEU独占販売権を付与しました。現地サービスネットワーク向けの技術文書も提供しています。
      product: カスタムSUPライン（5モデル）
      results: 複数年契約を締結。初回生産分50台を75日以内に出荷。大手展示会でブランドを発表し、ディーラーから好評を博しました。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: afarerとの協力により、工場を建設せずにSUP市場参入が可能となりました —CE認証とディーラーサポート文書を含む完全なターンキーソリューションを提供されました。
      icon: tabler:building
    - title: カリブ海リゾートフリート
      customer: パラダイスアイランドリゾーツ
      country: バハマ
      industry: 海洋ツーリズム＆ホスピタリティ
      challenge: 高級リゾートがゲスト向けの完全なウォータースポーツ機材フリートを必要としていました：ガイドツアー用SUPボード40台、ラグーン探検用追加SUP 20台、ゲスト遠足用SUPボード10台、およびアクセサリー。全機材にリゾートのカスタムブランドロゴを入れる必要があり、観光シーズン前に納品が必要でした。
      solution: 完全なSUPパッケージを生産：40台のSUP Voyagerボード（オールアラウンドモデル）、20台のSUP Explorerボード、10台のSUP Touringボードに加え、PFD、パドル、ポンプ、修理キット。すべての装備にリゾートのロゴとトロピカルカラーがプリントされています。完全なインベントリマニフェスト付きのコンテナ輸送。
      product: SUPフルパッケージ（70+台）
      results: フリートはピークシーズンの6週間前に到着しました。水上スポーツ活動のゲスト満足度スコアは年間40%向上。3シーズン使用済みで、定常メンテナンスのみで良好な状態を維持。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: 完全パッケージ方式により、ボードとアクセサリーがすべてブランド化・ゲスト使用準備完了の状態で一度の出荷で届きました。当ゲストは装備の品質に非常に満足しています。
      icon: tabler:beach
    - title: 米国沿岸警備契約
      customer: 大西洋沿岸保安庁
      country: アメリカ合衆国
      industry: 海上セキュリティ＆法執行機関
      challenge: 米国沿岸警備隊は、沖合活動用に重厚なパトロールSUPを必要としていました。米国沿岸警備隊の規制準拠および軍事仕様の装備を備えた高性能ボードが必要でした。
      solution: 補強ドロップスチッチ構造、高視認性カラースキーム、暗号化通信機材マウント、統合装備取付点を備えたエンジニアリングSUPパトロール。重作業向けに補強されたボード。USCG適合文書を提供。
      product: SUPパトロール
      results: 初年度12ヶ月でミッション稼働率95%を達成。追加発注8台を受注。
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUPパトロールは、沖合での作業に必要な性能をクルーに提供します。強化構造により、取扱性を損なうことなく重要な耐久性を実現します。
      icon: tabler:shield

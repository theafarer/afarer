meta:
  title: SUPの厚さの選び方 ―― エンジニアリング分析 | {SITE}
  description: インフレータブルSUPボードの厚さに関する技術ガイド：4インチ、5インチ、6インチのボードが剛性、重量、安定性、追跡性、パフォーマンスにおいてどのように異なるか。ツーリング、ヨガ、サーフィン、レース、オールアラウンドパドリングのための厚さの推奨。
back_text: 研究トップに戻る
hero:
  tagline: エンジニアリング
  title: SUPの板厚の選び方 — 工学解析
  subtitle: 読了時間 約6分
content_html: |
  <h2>3つの標準厚さ</h2>

  <h3>4" (10 cm) – ツアリング &amp; パフォーマンス</h3>
  <ul>
    <li>最高剛性 – 荷重下でのたわみが少ない</li>
    <li>最軽量 – 素材が少なく、空気容積も小さい</li>
    <li>優れたトラッキング – 横方向の揺れが軽減</li>
    <li>最速 – 抗力が低く、滑りが良好</li>
    <li>最適対象：ツアリング、レース、フィットネスパドリング、上級パドラー</li>
  </ul>

  <h3>5" (12.7 cm) – オールラウンド</h3>
  <ul>
    <li>良好な剛性 – 柔軟性と剛性のバランスが良好</li>
    <li>適度な重量 – 標準的な素材使用量</li>
    <li>優れた一次＋二次安定性</li>
    <li>最適対象：レクリエーションパドリング、初心者、カジュアルな湖・川使用</li>
  </ul>

  <h3>6" (15.2 cm) – 安定性 &amp; ヨガ</h3>
  <ul>
    <li>最高の一次安定性 – 大きな浮力</li>
    <li>最重量 – PVC素材が多く、空気容積が大きい</li>
    <li>最遅 – 抗力が大きく、滑りを維持しにくい</li>
    <li>最適対象：ヨガ/フィットネス、重いパドラー（100kg以上）、荒い海況</li>
  </ul>

  <h2>構造解析</h2>
  <p>インフレータブルSUPの剛性は、内部気圧とボード断面の慣性モーメントによって決まります。20PSIにおいて、4"ボードは同じ幅と長さの6"ボードよりも荷重下でたわみが約30%少ないです。一次安定性は吃水線幅と浮力から得られ、二次安定性はレール形状とボード幅に影響されます。</p>

  <h2>パドラー体重別の推奨厚さ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">パドラー体重</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">推奨厚さ</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">65kg未満 (143ポンド)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65〜90kg (143〜198ポンド)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90〜115kg (198〜253ポンド)</td><td class="p-3 border">5"または6"</td></tr>
      <tr><td class="p-3 border">115kg超 (253ポンド)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>厚さとPSIのトレードオフ</h2>
  <p>一般的な誤解として、高いPSIが過剰な厚さを補償できるというものがあります。25PSIにおいて、6"ボードは15PSIの4"ボードよりもたわみが大きくなります。これは幾何学的慣性モーメントが剛性方程式を支配するためです。パフォーマンス志向のパドラーには、低圧の薄いボードが高圧の厚いボードよりも優れた性能を発揮します。</p>

  <h2>afarerラインナップ</h2>
  <ul>
    <li><strong>4"ボード：</strong> Cheetahツアリングシリーズ – フィットネスと長距離パドリング向け12' x 30" x 4"ツアリングSUP</li>
    <li><strong>5"ボード：</strong> Cheetahオールラウンドシリーズ – レクリエーション使用向け10'6" x 32" x 5"</li>
    <li><strong>6"ボード：</strong> Cheetahウルトラ安定シリーズ – ヨガ、大型パドラー（100kg以上）、撮影プラットフォーム向け10' x 34" x 6"</li>
  </ul>
  <p>全ボードは1,680 DTEXドロップステッチコアを採用し、定格圧力20PSI、1.2mmPVCラミネートを使用しています。</p>

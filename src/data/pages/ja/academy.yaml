meta:
  title: 'アカデミー — SUPガイドとパドルトレーニング | {SITE}'
  description: 'afarerアカデミー：インフレータブルパドルボードのガイド、スタンドアップパドルテクニック、船舶安全、マテリアル知識を初心者からプロまで。'
  keywords:
    - 'スタンドアップパドルの学び方'
    - 'SUP初心者ガイド'
    - 'パドルボード基礎'
    - 'SUPテクニック'
    - 'SUPレッスン'
hero:
  tagline: afarer Academy
  title: Learning Center
  subtitle: あらゆるスキルレベルに対応するガイドとチュートリアル — SUPの基本から高度なレスキューテクニックまで
categories:
  - level: Beginner
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Basics
        desc: スタンドアップパドルボードの基礎を学ぼう — スタンス、パドルテクニック、バランス。
        slug: beginner-sup-guide
      - title: Paddle Techniques
        desc: フォワードストローク、スイープストローク、ドロウストローク、ローブレース — 必須のパドルムーブをマスター。
        slug: sup-paddle-guide
      - title: Safety First
        desc: 天候チェック、PFDの着用、リーシュのルール、セルフレスキューなど、必須の安全習慣。
        slug: sup-safety-guide
  - level: Intermediate
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Touring Essentials
        desc: 数時間に及ぶパドリングの計画 — ナビゲーション、水分補給、ペース配分、風予報の読み方。
        slug: touring-sup-guide
      - title: Weather Reading
        desc: 海上予報を読み解き、雲のパターンを識別し、風が水面に与える影響を理解する。
        slug: weather-planning-water-sports
      - title: Navigation Basics
        desc: 海図の読み方、コンパスの使い方、GPSウェイポイント、沿岸パドリングのルート計画。
        slug: sup-navigation-guide
      - title: Tidal Awareness
        desc: 潮の満ち引きのサイクルと海流を理解し、出艇タイミングやルート選びへの影響をつかむ。
        slug: understanding-tides
  - level: Advanced
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Multi-Day Trip Planning
        desc: エクスペディションのロジスティクス — ギア選定、食料計画、安全プロトコル、緊急連絡先。
        slug: sup-travel-guide
      - title: Rescue Techniques
        desc: 外洋でのセルフレスキュー、Tレスキュー、トーイングのプロトコル。
        slug: sup-self-rescue
      - title: Night Paddling
        desc: 夜間のナビゲーション — 灯火の要件、ルートの把握、グループ内の連絡、危険への意識。
        slug: ocean-safety-basics
  - level: Maintenance
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Cleaning & Care
        desc: 毎回のセッション後の真水すすぎ、UV保護、カビ防止、適切な乾燥テクニック。
        slug: inflatable-sup-maintenance
      - title: Storage Guide
        desc: インフレータブルSUPボードの保管のベストプラクティス — 脱気、折りたたみ、温度管理、寿命維持。
        slug: inflatable-sup-storage
      - title: Repair Basics
        desc: PVCリペアキットとパッチ技術で、小さな穴、シームの漏れ、バルブの不具合を修理。
        slug: inflatable-sup-repair
      - title: Valve Maintenance
        desc: バルブタイプ（Halkey-Roberts、Boston、Leafield）を見分け、ゴミを取り除き、故障したステムを交換。
        slug: sup-pump-guide
knowledge_center_tagline: Knowledge Center
knowledge_center_title: マリン機器＆業界ガイド
knowledge_center_subtitle: マリン業界のプロフェッショナル、フリート運営者、ウォータースポーツ愛好家のための専門知識と購入ガイド。
knowledge_sections:
  - title: SUP Board Knowledge
    tagline: スタンドアップパドルボードガイド
    desc: SUPボードに関するすべて — ボードデザイン、素材、サイズ選び、メンテナンス、レクリエーション・商用利用向けの購入アドバイス。
    guides:
      - title: 最適なSUPボードの選び方
        desc: SUPを選ぶための完全ガイド — サイズ、ボリューム、素材、形状、使用目的。
        href: /learn/sup
      - title: Inflatable vs Hard SUP
        desc: インフレータブルSUPとハードエポキシボードの比較 — 携帯性、耐久性、性能、価値を比較。
        href: /compare/inflatable-vs-hardboard
      - title: オールラウンド vs ツーリング vs ヨガSUP
        desc: さまざまなSUPボードタイプ — 構造基準、形状、サイズ、推奨用途。
        href: /learn/sup
      - title: ドロップステッチ構造と従来構造の比較
        desc: SUPボードのドロップステッチ構造と従来構造を、重量、コスト、耐久性、剛性の観点から比較。
        href: /learn/drop-stitch-core
  - title: Inflatable SUP Guide
    tagline: インフレータブルSUPの知識
    desc: インフレータブルSUPの総合ガイド — PVC素材、ドロップステッチ構造、安全基準、メンテナンスのベストプラクティス。
    guides:
      - title: PVC Material Guide
        desc: インフレータブルSUPボードの製造に使われるPVC素材の決定版ガイド。
        href: /learn/materials
      - title: インフレータブルSUPの製造工程
        desc: 製造工程 — 素材の裁断、ドロップステッチコアの接着、シーム加工、耐圧試験、品質管理。
        href: /learn/inflatable-technology
      - title: SUP Safety Guide
        desc: 安全基準、積載容量、適切な空気圧、出艇前チェック、緊急時の手順。
        href: /learn/water-safety
      - title: SUP Maintenance
        desc: インフレータブルSUPボードの洗浄、保管、UV保護、修理。
        href: /v2/inflatable-sup-maintenance
  - title: SUP Board Knowledge
    tagline: SUP Board Hub
    desc: SUPボードのタイプ、素材、製造方法、メンテナンス、安全を網羅した技術ガイド。
    guides:
      - title: SUP Board Types
        desc: オールラウンド、ツーリング、ヨガ、スポーツ、キッズ用SUP — 違いを学んで最適な一本を選ぼう。
        href: /learn/sup
      - title: Drop-Stitch Technology
        desc: 内部の何千ものスレッドが、剛性の高い高圧インフレータブル構造をどう生み出すのか。
        href: /learn/drop-stitch-core
      - title: Materials Reference
        desc: PVCのデニール数、ファブリック重量、UV耐性、マリングレード素材を解説。
        href: /learn/materials
      - title: SUP Buying Guide
        desc: 用途やスキルレベルに応じたさまざまなSUPボードタイプを比較。
        href: /learn/sup
  - title: SUP Knowledge
    tagline: スタンドアップパドルボードガイド
    desc: SUPボードに関するすべて — インフレータブルとハード、ボード寸法、素材技術、あらゆるスキルレベル向けの専門アドバイス。
    guides:
      - title: Inflatable vs Hard SUP
        desc: iSUPとハードエポキシボードを、携帯性、耐久性、性能、価値の観点から比較。
        href: /learn/sup
      - title: SUPボード寸法ガイド
        desc: 長さ、幅、厚さが安定性、スピード、操縦性に与える影響。
        href: /learn/sup
      - title: SUP Maintenance & Care
        desc: インフレータブルSUPボードの洗浄、保管、UV保護、修理のヒント。
        href: /v2/inflatable-sup-maintenance
      - title: Choosing Your First SUP
        desc: 体重、スキルレベル、使用目的に合ったスタンドアップパドルボードを選ぶための初心者向けガイド。
        href: /learn/sup
  - title: Rental Operations Guide
    tagline: レンタル事業のためのフリート管理
    desc: ビーチのキオスク、ウォータースポーツセンター、宿泊施設向けのSUPレンタルフリート構築・管理ガイド。
    guides:
      - title: レンタルフリートの構築
        desc: レンタル事業に最適なSUPボードの選び方 — 耐久性、サイズ展開、ROIの考慮点。
        href: /solutions/rental-operators
      - title: Fleet Maintenance Guide
        desc: レンタルフリートのボード寿命を最大化し、ダウンタイムを最小化するための必須メンテナンス習慣。
        href: /solutions/rental-operators
  - title: リゾート＆ホスピタリティガイド
    tagline: ホスピタリティ向けウォーターアクティビティ
    desc: リゾート、ホテル、ウォーターフロントの目的地向けにSUPプログラムを立ち上げ・運営するためのガイド。
    guides:
      - title: リゾートSUPプログラムの立ち上げ
        desc: ゲスト向けSUPアクティビティを始める際の考慮点 — フリート規模、スタッフ配置、収益モデリング。
        href: /solutions/resorts-hotels
      - title: SUPと他のウォーターアクティビティの比較
        desc: ゲスト体験と運営効率の観点から、SUPプログラムと他のウォータースポーツを比較。
        href: /learn/sup
  - title: リテール＆ディストリビューションガイド
    tagline: SUPビジネスパートナーシップ
    desc: SUPリテールパートナーまたはディストリビューターになるためのガイド — 在庫計画、市場ポジショニング、成長戦略。
    guides:
      - title: Becoming a SUP Retailer
        desc: 小売店舗で製品ラインを選び、在庫を管理し、SUPボードをマーケティングする方法。
        href: /solutions/retail-partners
      - title: 商業運用のためのSUP
        desc: インフレータブルSUPが商業フリート、レンタル事業、プロのオペレーターにとって汎用性の高い製品である理由。
        href: /use-cases/search-and-rescue

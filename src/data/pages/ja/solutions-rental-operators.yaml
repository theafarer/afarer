meta:
  title: SUPレンタルフリートソリューション | {SITE}
  description: 日々のレンタル使用に設計された高回転SUPボード。UV耐性PVC、補強された縫い目、速乾性素材。Afarerとともにレンタルビジネスを拡大しましょう。
hero:
  tagline: レンタル事業者
  title: 賃貸事業を自信を持って<br />スケールアップ
  subtitle: 年間365日、毎日のレンタル利用に耐えるハイローテーションSUPボード。収益は一日も休みません。
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: ゲスト向けにSUPボードを準備した賑わうレンタルキオスク
features:
  title: レンタル業界向けに構築
  subtitle: 全ボードはメンテナンスを最小限に抑え、500回以上のレンタルサイクルに耐えるよう設計されています。
  items:
    - title: 500回以上のレンタルサイクル
      description: 塩水、日光、砂での日常使用に耐える試験済み。
      icon: tabler:shield-check
    - title: UV耐性生地
      description: 屋外保管1年後でも変色・劣化なし。
      icon: tabler:sun
    - title: 補強されたシーム
      description: 標準的なインフレータブルボード構造の3倍の強度。
      icon: tabler:layers-intersect
    - title: 速乾素材
      description: ボードは30分以内に次のレンタルに備えて準備完了。
      icon: tabler:droplet
    - title: スタッカブル収納
      description: 省スペース設計 — 同じ面積で40%多くのボードを保管可能。
      icon: tabler:stack
    - title: カラーコードサイズ
      description: スタッフはカラーコードされたサイズ表示ですぐに正しいボードを手に取れます。
      icon: tabler:color-swatch

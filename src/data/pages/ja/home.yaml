      link: /solutions/resorts-hotels
    - title: 小売パートナー
      keywords: SUP卸売、アウトドアリテーラー、スポーツ用品店
      description: フル商品ライン、マーケティング資材、ドロップシッピングオプション、競争力のある卸売利益率。
      icon: tabler:shopping-cart
      cta: リテールパートナーになる
      link: /solutions/retail-partners
    - title: 国別ディストリビューター & コブランドパートナー
      keywords: 国別SUPディストリビューター、コブランドSUP、プライベートブランドSUP
      description: 認定されたウォータースポーツ事業者向けの国別独占販売と限定コブランドコレクション。
      icon: tabler:package
      cta: パートナーになる
      link: /distributor-program

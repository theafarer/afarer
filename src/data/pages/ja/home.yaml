    - number: '02'
      title: 設計・エンジニアリング
      desc: 3Dモデリング、素材選定、カスタムグラフィックデザイン。
    - number: '03'
      title: 試作＆検証
      desc: CE認証および品質試験付きサンプル製造。
    - number: '04'
      title: 量産
      desc: インラインQCと工場監査サポートを備えた本格生産。
    - number: '05'
      title: グローバル配送
      desc: FOB青島物流、CIF主要港、ドアツードア配送対応。

hero:
  tagline: 水上の信頼できる冒険をエンジニアリング
  title: afarer
  subtitle: |
    家族、探検家、プロフェッショナルのための<br />
    インフレータブルSUP、ボート、マリン装備を生み出すグローバルウォーターエクスプロレーションブランドです。
  taglineSection: 探検のために設計され、信頼性のためにエンジニアリングされ、グローバルパートナーのために構築されました。
  actions:
    - variant: primary
      text: 製品を見る
      href: /products
      icon: tabler:shopping-bag
    - text: 詳しく見る
      href: '#features'
      icon: tabler:file-text
    - text: SUPソリューションを探す
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: afarer ヒーロー画像
who_we_serve:
  tagline: 対象としているお客様
  title: すべての水上ビジネス向けの完璧なSUPソリューション
  subtitle: 4つの主要市場向けに特化した設備・製造・ビジネスサポート。
  items:
    - title: パドルクラブ
      keywords: SUPクラブ機器、パドルスクール機器、レンタルフリート
      description: 耐久性のあるSUPフリート、クラブ価格、パドルクラブや学校向けのスペアパーツプログラム。
      icon: tabler:users
      cta: Paddle Clubソリューションを探索
      link: /solutions/paddle-clubs
    - title: リゾート＆ホテル
      keywords: リゾート水中アクティビティ、ホテルビーチ設備、ゲスト体験
      description: カスタムブランディング、スタッフ研修、ROI最適化パッケージを含む完全なSUPフリートプログラム。
      icon: tabler:building
      cta: リゾートの水上体験を創造する
      link: /solutions/resorts-hotels
    - title: 小売パートナー
      keywords: SUP卸売、アウトドアリテーラー、スポーツ用品店
      description: フル商品ライン、マーケティング資材、ドロップシッピングオプション、競争力のある卸売利益率。
      icon: tabler:shopping-cart
      cta: リテールパートナーになる
      link: /solutions/retail-partners
    - title: 新規SUPブランド
      keywords: プライベートブランドSUP、カスタムSUPブランド、OEMパドルボード
      description: End-to-end OEM/ODM manufacturing — design, prototyping, mass production, and global logistics.
      icon: tabler:package
      cta: SUPブランドを構築
      link: /oem-odm-manufacturer
proof_points:
  title: 世界中のウォータービジネスから信頼されている
  subtitle: 数十年のマリン工学経験が、収益力のあるSUPプログラムを支えている。
  items:
    - metric: 10以上
      label: 年の実績
      detail: 2012年から
    - metric: 50+
      label: 対応国数
      detail: グローバル流通ネットワーク
    - metric: 15,000+
      label: 年間生産台数
      detail: CE認証取得済み製造能力
    - metric: 100%
      label: CE認証
      detail: ISO 9001、BSCI、REACH準拠
business_solutions:
  tagline: 当社のサポート体制
  title: コンセプトから収益まで、あなたのパートナー
  subtitle: 水辺のビジネスの立ち上げ、運営、成長を支援する4つの中核的な能力。
  items:
    - title: Professional Equipment
      description: 商用グレードのSUPボード、日々のレンタル使用に設計、500サイクル以上で最小限のメンテナンス。
      icon: tabler:shield-check
    - title: OEM製造
      description: 設計・試作から量産・グローバル配送まで、ワンストップのプライベートブランド生産を提供。
      icon: tabler:package
    - title: ビジネスサポート
      description: スタッフトレーニング、マーケティング資材、交換部品プログラム、専任アカウントマネジメント。
      icon: tabler:headset
    - title: グローバル物流
      description: FOB青島、CIF主要港、通関サポート付き50カ国以上へのドアツードア配送。
      icon: tabler:truck-delivery
oem_section:
  tagline: 自社ブランドを立ち上げる
  title: アイデアから市場投入まで16週間
  subtitle: SUPブランド立ち上げの完全パートナー — 設計、プロトタイプ、製造、出荷まで。
  steps:
    - number: '01'
      title: アイデアとブリーフ
      desc: ビジョン、ターゲット市場、仕様をお知らせください。
    - number: '02'
      title: 設計・エンジニアリング
      desc: 3Dモデリング、素材選定、カスタムグラフィックデザイン。
    - number: '03'
      title: 試作＆検証
      desc: CE認証および品質試験付きサンプル製造。
    - number: '04'
      title: 量産
      desc: インラインQCと工場監査サポートを備えた本格生産。
    - number: '05'
      title: グローバル配送
      desc: FOB青島物流、CIF主要港、ドアツードア配送対応。
  cta: ブランドジャーニーを始める
  cta_link: /oem-odm-manufacturer
cta:
  title: |
    OEM/ODMプロジェクトを<br class="block sm:hidden" /><span class="sm:whitespace-nowrap">始めませんか</span>？
  subtitle: ご要件をお知らせください。1営業日以内にカスタム見積もり、最小ロット詳細、リードタイムをご提供します。
  actions:
    - variant: primary
      text: 見積もりを依頼
      href: /contact
      icon: tabler:message-circle
    - text: 工場見学
      href: /factory

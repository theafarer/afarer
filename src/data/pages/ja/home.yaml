distributor:
  tagline: '国別独占ディストリビューター'
  title: '1つの国に、公式afarerディストリビューターを1社だけ。'
  subtitle: '1つの国につき1つの販売代理店を設けるプログラムです。地域独占権、代理店価格、マーケティング支援、専任のDistributor Success Programをご用意しています。'
  benefits:
    - title: '地域独占権'
      description: '国または地域ごとに認定販売代理店は1社のみ — 内部競争なし、チャネル間の競合もありません。'
    - title: '工場直販のマージン'
      description: '代理店価格表と年間リベートを約定数量に対して提供、FOB青島で出荷します。'
    - title: 'マーケティング・研修サポート'
      description: 'コブランド資産、販売店向けPOS資料、製品研修、ローンチキャンペーンを提供します。'
    - title: '専任アカウントチーム'
      description: '専任の代理店マネージャーが、オンボーディング、需要予測、再発注をサポートします。'
  actions:
    - variant: primary
      text: '販売代理店になる'
      href: /distributor-program
    - text: '代理店価格表を問い合わせる'
      href: /contact?subject=Dealer Price List
    - text: '国別パートナーシップを申請する'
      href: /contact?subject=Country Partnership Application
    - text: 'ディストリビュータープログラムをダウンロード'
      href: /distributor-program
  note: 'サンプル注文は5～10台。お試し注文は10～30台。正規ディーラーは30～50台。国/地域ディストリビューターは100～300台以上。'

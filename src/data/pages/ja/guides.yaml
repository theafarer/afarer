size_guide:
  tagline: サイズ＆仕様
  title: お客様のニーズに合ったサイズを見つけてください
  desc: SUPボードの寸法、荷重容量、推奨用途を比較。ツアーボード、ヨガボード、オールラウンド SUP — サイズガイドで最適なボードを見つけよう。
  link_label: 製品仕様付きフルサイズガイド →
  link: /size-guide
  cards:
    - title: SUPボード
      desc: 長さは体重と使用目的に応じて選択してください。幅広いボード（32インチ以上）は安定性が高いです。長いボード（11〜2ft）はトラッキング性能が優れ、ツーリングに最適です。
    - title: ツーリングSUP
      desc: 長尺ボード（11〜2 ft）は長距離走行と直進追従性に優れています。ギアを積んでのツーリングにも十分な安定性を備えています。必ず荷重容量をご確認ください。
    - title: オールラウンドSUP
      desc: ライダーの体重と用途に応じて長さをお選びください。安定性を重視する場合は幅広ボード（32インチ以上）がおすすめです。レジャーからフィットネスまで幅広くご活用いただけます。

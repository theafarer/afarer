meta:
  title: '品質ラボ — テストと品質管理 | {SITE}'
  description: 'afarerのISO 9001プロセスを備えた独立品質ラボ：インフレータブルSUPボード・ボートの品質を保証するため、すべての製品を出荷前にテストします。'
  keywords:
    - 'SUP品質管理'
    - 'パドルボードテストラボ'
    - 'ISO 9001 SUP工場'
    - 'インフレータブルSUP品質'
hero:
  tagline: 品質管理ラボラトリー
  title: 試験ラボ＆品質保証
  subtitle: ISO 9001プロセスを備えた独立品質ラボ —出荷前に全ユニットを検査
intro: アファラーは生産から独立して運営される専用の品質管理ラボを保有しています。全原料ロットと全完成ボートは、文書化された検査プロトコルを経てから出荷されます。品質管理チームは経営層に直接報告し、公正な品質判断を保証しています。
highlights:
  - value: 100%
    label: 加圧試験済みユニット数
    detail: すべてのチャンバー、すべてのボート
  - value: 48 h
    label: 保気試験時間
    detail: 定格圧力の1.25倍で
  - value: '&lt;5%'
    label: 最大許容圧力降下
    detail: 24時間以上の保持期間
  - value: AQL 2.5
    label: 重大欠陥閾値
    detail: ISO 2859に基づくサンプリング
test_procedures:
  - title: 原材料検査
    description: 入荷するPVC、Hypalon、ドロップスチッチ生地、ハードウェアの各ロットは受入前に試験を実施。引張強度（ASTM D751）、耐裂性（ISO 4674）、耐UV性を検証。不適合材料は隔離の上返却します。
    standards:
      - ASTM D751（引張試験）
      - ISO 4674（引裂強度）
      - ISO 4892（UV）
  - title: 工程内QCチェックポイント
    description: 生産オペレーターが各工程で自己検査を実施。品質管理監査員がシフトを通じて無作為にサンプリング。溶接剥离試験は50台ごとに実施。寸法検査は20枚ごとに実施。
    standards:
      - ASTM D751（耐剥離試験）
      - 内部100項目チェックリスト
      - ISO 2859 サンプリング
  - title: 48時間空気保持試験
    description: すべてのチューブチャンバーは定格圧力の125%にまで膨らませ、48時間保持します。圧力センサーは温度補償付きで連続記録を行います。5%以上の圧力低下が見られるチャンバーは、自動的にロット再検査が発動します。
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: 積載・バランス試験
    description: 完成したボートは最大定格容量での安定性、乾舷、取扱性能を試験。各ボートは最終検品承認前に水上試験を実施。
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: 万能試験機（引張）
    spec: 5 kN、ASTM D751準拠
  - name: Pressure Decay Tester
    spec: マルチチャネル、0–50 psi、データロギング
  - name: UV Weathering Chamber
    spec: ISO 4892、1,000時間サイクル
  - name: 厚さ測定器（デジタル）
    spec: 0.01mm分解能
  - name: Peel Tester (weld)
    spec: モーター付き、50N容量
  - name: Temperature Chamber
    spec: '-40 °C ～ +100 °C'
  - name: Leak Detection Tank
    spec: 6 m × 2 m、照明付き

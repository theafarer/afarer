features3_reasons:
  tagline: afarerを選ぶ理由
  title: 当社と提携する 7 つの理由
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. 実製造業であり、交易業ではない
      description: 当社は12,000平方メートルの工場を所有し、運営しています。 afarer と提携すると、中間業者を介さずに、製品の設計、エンジニアリング、構築を行う人々と直接連携することになります。
      icon: tabler:building-factory
    - title: 2. エンジニアリング主導のアプローチ
      description: 私たちの設計プロセスは、製品カテゴリーではなく、ユースケースから始まります。 実際の使用用途に合わせて船体形状、材質選定、形状を最適化します。
      icon: tabler:engine
    - title: 3. 認証品質
      description: CE 認定、ISO 品質システム、BSCI 準拠、REACH 準拠、USCG 承認。 主張だけでなく、すべての製品が国際基準を満たしています。
      icon: tabler:certificate
    - title: 4. 柔軟なコブランディング
      description: チューブの色、コンソールのレイアウト、ブランディング、パッケージングなど、お客様の仕様に合わせてカスタマイズします。 最低注文圧力はありません。 プロトタイプから始めて、自信を持って拡張してください。
      icon: tabler:adjustments
    - title: 5. グローバルロジスティクス
      description: カリフォルニアの米国倉庫、青島からの直送、緊急注文には空輸。 通関手続きや書類作成を承ります。
      icon: tabler:truck-delivery
    - title: 6. 終身サポート
      description: 私たちは20年前に建造したボートをサポートしています。 純正のスペアパーツ、技術的なアドバイス、修理指導 - 当社のチームが必要なときにいつでもご利用いただけます。
      icon: tabler:lifebuoy
    - title: 7. 正確な仕様
      description: 実際の定格荷重、実際の寸法、実際の重量。 マーケティングインフレはありません。 私たちが公開するものは、独立したテストによって検証されたものです。
      icon: tabler:ruler-measure
testimonials:
  tagline: 世界中のブランドから信頼されています
  title: パートナーの声
  items:
    - content: 中国の複数のメーカーと協力してきましたが、afarerはエンジニアリングサポートと一貫した品質で際立っています。彼らは私たちのブランドを自分のもののように大切にしています。
      name: — コブランドパートナー、欧州のウォータースポーツブランド
    - content: 彼らのHypalon RIBは当社フリートで5年以上使用されています。メンテナンスが少なく、優れた耐UV性を備えています。チューブの5年保証が私たちの信頼を支えています。
      name: — フリートオペレーター、中東リゾートグループ
    - content: Afarerのチームは、コンセプトから生産まで90日でカスタムSUPボードの開発をサポートしてくれました。品質は期待を上回りました。
      name: — 販売代理店、オーストラリアのウォータースポーツ

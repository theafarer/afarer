features3_reasons:
  tagline: 'アファーラーを選ぶ理由'
  title: '当社と提携する 7 つの理由'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: '当社は12,000平方メートルの工場を所有し、運営しています。 afarer と提携すると、中間業者を介さずに、製品の設計、エンジニアリング、構築を行う人々と直接連携することになります。'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: '私たちの設計プロセスは、製品カテゴリーではなく、ユースケースから始まります。 実際の使用用途に合わせて船体形状、材質選定、形状を最適化します。'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'CE 認定、ISO 品質システム、BSCI 準拠、REACH 準拠、USCG 承認。 主張だけでなく、すべての製品が国際基準を満たしています。'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'チューブの色、コンソールのレイアウト、ブランディング、パッケージングなど、お客様の仕様に合わせてカスタマイズします。 最低注文圧力はありません。 プロトタイプから始めて、自信を持って拡張してください。'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'カリフォルニアの米国倉庫、青島からの直送、緊急注文には空輸。 通関手続きや書類作成を承ります。'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: '私たちは20年前に建造したボートをサポートしています。 純正のスペアパーツ、技術的なアドバイス、修理指導 - 当社のチームが必要なときにいつでもご利用いただけます。'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: '実際の定格荷重、実際の寸法、実際の重量。 マーケティングインフレはありません。 私たちが公開するものは、独立したテストによって検証されたものです。'
      icon: tabler:ruler-measure

hero:
  tagline: 法令遵守
  title: インフレータブル船舶におけるCE認証の仕組み
  subtitle: 読了時間 7分
content_html: |
  <h2>CE認証とは？</h2>
  <p>CEマーキング（Conformité Européenne）は、製品がEUの健康、安全、環境要件を満たしていることを示しています。インフレータブル船舶については、製品カテゴリーに応じた規制フレームワークが適用されます。</p>

  <h2>適用される指令</h2>

  <h3>レジャー船舶指令（2013/53/EU）</h3>
  <p>ほとんどのインフレータブルボート、SUP、カヤクに適用される主要な指令です。船体長2.5m〜24mのレジャー船舶、半完成船（OEM供給向け）、個人用水上バイクが対象です。</p>

  <h3>個人用保護具規則（2016/425）</h3>
  <p>船舶に付属するライフジャケット、浮力補助具、安全装置は、認定機関による型式試験（モジュールB）および生産品質保証（モジュールDまたはE）を含むPPE規則の要件を満たす必要があります。</p>

  <h2>認証プロセス</h2>
  <ol>
    <li>製品分類：船舶の設計カテゴリーを決定（ISO 8666に基づくカテゴリーA〜D）</li>
    <li>適用規格：EN ISO 6185（パート1〜4）、EN ISO 10087（HIN）、EN ISO 14945（メーカー銘板）</li>
    <li>技術文書の作成：設計図面、部品表、材料証明書、リスクアセスメント</li>
    <li>型式試験：浮力、安定性、積載容量、材料試験、シーム強度、空気保持性</li>
    <li>工場生産管理：認定機関による製造工程の監査</li>
    <li>適合宣言：製造者が適合宣言書に署名し、CEマーキングを付与</li>
  </ol>

  <h2>インフレータブル船舶の認定機関</h2>
  <p>主要な認定機関には、Bureau Veritas（フランス）、DNV GL（ドイツ）、RINA（イタリア）、TÜVラインランド／TÜV南ドイツ（ドイツ）があります。</p>

  <h2>スケジュールと費用</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">フェーズ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">期間</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">一般的な費用（EUR）</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">技術文書の作成</td><td class="p-3 border">2〜4週間</td><td class="p-3 border">2,000〜5,000</td></tr>
      <tr><td class="p-3 border">型式試験</td><td class="p-3 border">4〜8週間</td><td class="p-3 border">8,000〜20,000</td></tr>
      <tr><td class="p-3 border">工場監査</td><td class="p-3 border">1〜2日（現地）</td><td class="p-3 border">3,000〜6,000</td></tr>
      <tr><td class="p-3 border">合計（初回製品）</td><td class="p-3 border">8〜14週間</td><td class="p-3 border">13,000〜31,000</td></tr>
    </tbody>
  </table>

  <h2>買い手にとっての意味</h2>
  <p>CE認証インフレータブルボートを購入する際は、メーカー銘板にCEマーキングがあること、有効な適合宣言書が存在すること、認定機関番号が記載されていること、取扱説明書に現地言語での安全指示が含まれていることを必ず確認してください。Afarerのすべての製品は、認定機関の監査報告書まで完全なトレーサビリティを備えたCE認証を取得しています。</p>

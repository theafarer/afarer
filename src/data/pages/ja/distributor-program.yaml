features:
  title: 'Afarerとパートナーシップを組む理由'
  subtitle: '信頼できるブランドと共にウォータースポーツビジネスを築きたいチャネルパートナー向けに設計されています。'
  columns: 3
  items:
    - title: '地域独占権'
      description: '国または地域で保護された市場。代理店は1社のみ、内部競争なし、チャネル競合なし。投資が自社の堀を築きます。'
      icon: 'tabler:shield-check'
    - title: '工場直販のマージン'
      description: '合意数量に応じた割引のある代理店価格表。中間業者なし。完全な輸出書類付きのFOB青島輸送。'
      icon: 'tabler:coins'
    - title: 'Distributor Success Program'
      description: '体系化されたオンボーディング、市場参入計画、商品・販売トレーニング、デモ艇隊サポート、共同マーケティングツール。'
      icon: 'tabler:rocket'
    - title: 'マーケティング・ブランド支援'
      description: '現地化されたキャンペーン資料、店頭販促物、イベントキット、多言語デジタルコンテンツ。'
      icon: 'tabler:mood-smile'
    - title: '信頼できるサプライチェーン'
      description: 'ISO・CE認証の生産、一貫した品質管理、予測可能なMOQ、計画しやすい納期。'
      icon: 'tabler:building-factory'
    - title: '専任アカウントマネージャー'
      description: '需要予測、発注計画、アフターサービスを担当する専任の流通担当マネージャー。'
      icon: 'tabler:user-check'
table:
  title: 'プログラムレベルと注文条件'
  subtitle: '市場の可能性に応じたレベルをお選びください。価格はすべて米ドル、FOB青島。'
  caption: 'サンプル注文（5〜10枚）は地域保護の対象外です。条件は配送前にディストリビューター契約で合意します。'
  head:
    - プログラムレベル
    - 最低注文数量（枚）
    - 納期
    - 支払い条件
  rows:
    - [サンプル / 商品評価, 5–10, 15〜20営業日, 前払い100%]
    - [テスト注文, 10–30, 30〜45日, 前払い100%]
    - [認定ディーラー, 30–50, 30〜45日, 頭金30% / 出荷前70%]
    - [国 / 地域代理店, 100–300, 30〜45日, 頭金30% / 出荷前70%]
    - [カスタム＆プライベートラベル（標準）, 50+, 30〜45日, 頭金30% / 出荷前70%]
    - [深いカスタマイズ（新金型・パッケージ）, 200+, 45〜60日, 頭金30% / 出荷前70%]
    - [全製品ラインの権利, 300–1, 000, 60〜90日, 頭金30% / 出荷前70%]
faqs:
  title: 'ディストリビュータープログラム — FAQ'
  subtitle: '代理店が申請前に寄せる質問のすべて。'
  items:
    - title: '1つの国、1つの代理店とは？'
      description: 'Afarerは国または地域に対して単一の認定販売代理店に独占権を付与します。市場はあなたのもの。並行輸入も内部競争もありません。'
    - title: '初回注文の最低数量は？'
      description: '国・地域代理店は100〜300枚、認定ディーラーは30〜50枚からスタート。テスト注文は10〜30枚で、まず市場を検証できます（地域保護なし）。'
    - title: '代理店に届く支援は？'
      description: 'Distributor Success Programには、オンボーディング、市場参入計画、商品・販売トレーニング、デモ艇隊サポート、現地化されたマーケティング資料、専任アカウントマネージャーが含まれます。'
    - title: 'チャネル競合からどう保護される？'
      description: '各領域に認定販売代理店は1社のみ。ご地域からの直接注文はすべて経由され、価格はマージンを保護するよう設定されています。'
    - title: '輸送・支払い条件は？'
      description: '注文は完全な輸出書類付きでFOB青島により発送されます。生産注文は頭金30%、出荷前に残り70%。テスト・サンプル注文は前払いです。'
    - title: '申請方法は？'
      description: 'お問い合わせフォームから申請を送信してください。市場適合性、小売展開、物流能力を評価し、3営業日以内に次のステップとディストリビューター契約書サンプルをご返信します。'
cta:
  title: '市場を自社のものにする準備はできていますか？'
  subtitle: 'Afarerのディストリビュータープログラムに申請し、3営業日以内にご返信をお受け取りください。'
  actions:
    - text: '代理店を申請する'
      href: /contact?subject=Distributor Application
      variant: primary
    - text: 'ディストリビュータープログラムをダウンロード'
      href: /distributor-program
      variant: secondary
geo:
  tagline: 'だれにサービスを提供するか'
  sentence: 'Afarerは、マリン・アウトドア・スポーツ業界の確立された販売代理店と提携しています。彼らは小売チェーン、レンタル艇隊、ウォータースポーツスクール、リゾート、公的機関のバイヤーに、プレミアムな空気注入式SUPボードと水上機材を提供しています。'
  audiences:
    - 'マリン・ボート販売代理店'
    - 'アウトドア・スポーツ小売'
    - 'レンタル・リゾート運営事業者'
    - 'ウォータースポーツスクール'

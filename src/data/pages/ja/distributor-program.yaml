faqs:
  title: 'カントリーパートナーシップ — FAQ'
  subtitle: '本気のカントリーパートナーが申請前に尋ねる質問。'
  items:
    - title: '「1国1ディストリビューター」の本当の意味は？'
      description: 'Afarerは定められた地域に対して独占権を持つ単一の公認ディストリビューターを指名します。当社は保護対象国に対してグローバルまたは地域チャネルから販売することはありません。Distribution Agreementの条件を満たしている限り、あなたの地域所有権は維持されます。'
    - title: '地域独占権は永遠に続くのですか？'
      description: 'いいえ。独占権は無期限ではなく条件付きです。署名済みのDistribution Agreement、初回注文の完了、年間購入目標、現地在庫、アフターサービス能力、継続的な市場投資によって維持されます。これらが満たされない場合、地域は再交渉または再割り当てされる可能性があります。'
    - title: '初回注文の最低数量は？'
      description: '国・地域ディストリビューターは100–300 unitsから、公認ディーラーは30–50 unitsから。テスト注文は10–30 unitsで先に市場を検証できます（テスト・サンプル注文には地域保護はありません）。カスタムおよびプライベートラベルプログラムは上記ティアに記載の別途MOQに従います。'
    - title: '10モジュールの支援プログラムにはどのような支援が含まれますか？'
      description: 'ティアと資格、地域保護、MOQ / 価格 / 年間リベート、在庫と注文執行、マーケティング素材と共同市場ファンド、製品 / 販売 / 技術トレーニング、スペアパーツとアフターサービス、保証登録、パートナーポータル、そして製品データシート、マーケティング素材ライブラリ、年間リベートスケジュール、出荷・梱包リストです。'
    - title: 'Afarerはチャネル競合からどのように保護してくれますか？'
      description: '各地域には公認ディストリビューターが正確に1社います。あなたの地域からの問い合わせや直接注文はすべてあなたを経由し、ウェブサイトのフォームは現地パートナーが存在する場合はそのパートナーに転送され、グローバルチームはパートナーが応答しない場合にのみ対応を引き上げます。'
    - title: '輸送・支払い条件は？'
      description: '注文は完全な輸出書類付きでFOB Qingdaoにより発送されます。生産注文は頭金30%＋出荷前70%。テスト・サンプル注文は前払いです。標準リードタイムは30–45営業日、サンプル生産は15–20営業日です。'
    - title: 'どうやって申請しますか？'
      description: 'お問い合わせフォームから市場の詳細とともに申請書を送信してください。市場適合性、小売展開、物流能力を審査し、3営業日以内に次のステップとサンプルのDistribution Agreementをご案内します。'

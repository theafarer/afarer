material_traceability:
  tagline: トレーサビリティ
  title: 材料追跡＆バッチ管理
  description: 全原料は当社ERPシステムでユニークなロット番号が付与されます。入荷から生産を経て完成品に至るまで、各ボートの部品表は元のサプライヤーロットに追溯可能。これにより、品質やコンプライアンスに関する調査に対して完全な上流トレーサビリティを実現しています。
  system: カスタムERP（青島Vatrad Group社内システム）+ 各作業指示書に物理バッチタグ付与
  coverage: 製造材料の100%——PVC、Hypalon、ドロップスティッチ生地、接着剤、バルブ、金具、梱包資材
  records_retained: 10年（CE 2013/53/EU規則に基づく）
  suppliers:
    - material: マリングレードPVC
      source: 中国および韓国のサプライヤー
      certified: ISO 9001、REACH、RoHS
    - material: Hypalon（CSM）
      source: 日本のサプライヤー
      certified: ISO 9001, REACH
    - material: ドロップステッチ生地
      source: 社内織布 + 外部パートナー
      certified: 内部QC ＋ サプライヤーISO 9001
    - material: バルブ＆ハードウェア
      source: 中国のOEMサプライヤー
      certified: ISO 9001、バッチ別材料証明書

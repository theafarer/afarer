qc_section:
  tagline: 品質管理
  title: テスト＆品質保証プロセス
  subtitle: すべてのボートは出荷前に必須テストを受けます。当社の品質ラボは生産から独立して運営され、管理部門に直接報告します。
  steps:
    - step: '1'
      title: 原材料検査
      desc: PVC、ハイパロン、ドロップステッチファブリックは、バッチが生産に入る前に引張テスト（ASTM D751）、ティア伝播、耐UV性検証を受けます。
    - step: '2'
      title: 48時間空気保持テスト
      desc: すべてのチューブチャンバーは定格圧力の125%に膨らませ、48時間保持されます。5%未満の圧力低下は自動拒否とシーム再検査をトリガーします。
    - step: '3'
      title: 負荷＆バランステスト
      desc: 完成したボートは最大定格容量まで積載され、安定性、乾舷、ハンドリングについてテストされます。各船舶は最終検査前に水上テストされます。
oem_section:
  tagline: OEMプロジェクト
  title: ブランド＆OEMパートナーシップケーススタディ
  subtitle: コンセプトからコンテナまで — グローバルブランドがインフレータブルウォータークラフトラインを立ち上げ、拡大する方法。
  cases:
    - challenge: 欧州のアウトドア小売業者は、ユニークなデッキグラフィック、エコフレンドリーなPVC、小売準備完了のパッケージングを備えたプライベートラベルSUPラインを必要としていました — すべて60日以内に納品。
      solution: カスタムデジタル印刷ファイルを開発し、REACH準拠のPVCを調達し、設計チームを青島工場に同地配置することでサンプリングを3ラウンドから1ラウンドに短縮。
      result: 署名済みPOからFOBまで55日。4つのSKUで2,400ユニット。最初のコンテナが到着する前にリピートオーダー。
    - challenge: 米国のウォータースポーツスタートアップは、カスタムハル形状、共同ブランドパッケージング、小売配置のためのBSCI認証を備えた高性能ドロップステッチカヤックを必要としていました。
      solution: 修正されたロッカープロファイルで既存のドロップステッチカヤック金型を適合、共同ブランドパッケージアートワークを開発、完全なBSCI監査文書を提供。
      result: 米国の主要アウトドアチェーン3社での取扱開始に成功。初年度5,000ユニット以上、98%の消化率。
    - challenge: オーストラリアのディストリビューターは、カスタムチューブカラー、ハイパロンアップグレードオプション、オーストラリア規格AS 1799への準拠を備えたCE認証RIBレンジを必要としていました。
      solution: 4つのチューブカラーバリエーションで試作品を生産、日本のサプライヤーからCSMハイパロンを調達、第三者AS 1799コンプライアンステストを調整。
      result: 3モデルのRIBレンジが豪州/ニュージーランド市場で発売。続いて12隻のパトロールRIBの政府入札に勝利。
faq_section:
  tagline: よくあるご質問
  title: B2B＆OEMよくある質問
  questions:
    - q: OEMインフレータブルSUPボードの最小発注数量（MOQ）は？
      a: 標準OEMモデルのMOQは5–10ユニットからです。カスタム金型およびプライベートラベルプロジェクトは、複雑さに応じて最低200ユニットが必要です。新ブランド立ち上げ向けのトライアルオーダーおよびサンプルランも利用可能です。
    - q: afarerはBSCI認証を保持していますか？
      a: はい。当社工場は有効なBSCI社会コンプライアンス認証を維持しています（監査レポートはリクエストに応じて利用可能）。また、品質管理のためのISO 9001およびすべての製品はCE認証を保持しています。REACHおよびRoHSコンプライアンス文書はすべてのOEM出荷に提供されます。
    - q: OEM注文の標準的なリードタイムは？
      a: 標準リードタイムは、確認済みPOおよびデポジットから30〜45日です。カスタム金型開発には工具製作に15〜20日が追加されます。緊急注文および夏前の繁忙期（1月〜3月）の季節的なラッシュには迅速生産を提供しています。
    - q: FOB青島またはCIFで出荷できますか？
      a: はい。FOB青島、主要グローバル港へのCIF、および資格のあるパートナー向けDDPで出荷しています。当社の物流チームがコンテナ予約、輸出書類、通関手続きを管理します。EU、米国、豪州、アジア市場の50ヶ国以上に出荷しています。
b2b_moq: 標準MOQ：モデルあたり5–10ユニット（SUP/カヤック/ドロップステッチ）。SUP MOQ：2–5ユニット。新しいパートナーシップ向けのトライアルオーダーを歓迎します。
production_flow:
  tagline: 生産フロー
  title: 素材から完成ボートまで
  subtitle: すべてのボートは6つの生産ステージを経由し、各段階でQCチェックポイントを設けています。手抜きや省略検査は一切ありません。
  stages:
    - stage: '01'
      title: 材料受入＆入荷検査
      description: 全受入材料はERPシステムでバッチ/ロット番号を記録。PVC生地ロール、ドロップスティッチコア、バルブ、接着剤、ハードウェアはQC承認まで隔離保管。
      qc_check: 引張強度（ASTM D751）、耐裂性（ISO 4674）、厚さゲージ、接着剤粘度、視覚欠陥スキャン
      qc_threshold: 全ロットを100%検査。引張強度が規格の90%未満、破断が規格最小値以下、または外観上の欠陥がある場合は拒否。
      responsibility: 入荷QCチーム（3名の検査員）
    - stage: '02'
      title: CNC切断と材料準備
      description: コンピューター最適化ネスティングにより、PVC素材上的面板を配置し、ロスを最小化。自動CNC切断機が0.1mmの位置精度を維持します。
      qc_check: CAD DXFファイルに基づく寸法検査、エッジ品質検査、パネル数確認
      qc_threshold: 20番ごとのパネルを計測。公差±0.5 mm。公差超過が2%を超える場合はロットを不合格とする。
      responsibility: 切断作業場リーダー
    - stage: '03'
      title: 溶接＆ドロップスチッチボンディング
      description: ドロップスティッチコアはヒートラミネーションで外層PVCラミネートに接着。チューブチャンバーはRF溶接またはホットエア溶接。レールバンドは3層融着接着。
      qc_check: 50個ごとにピールテスト（ASTM D751）、溶接幅測定、ホットエア温度記録の確認、バックライト下でのシーム外観検査を実施
      qc_threshold: 剥離強度 最低8 N/cm。溶接幅許容差 ±1 mm。可視チャネリング = 不良
      responsibility: 溶接QC（1シフトあたり2人の検査員）
    - stage: '04'
      title: 組立とリギング
      description: ボートは最終組立工程に移動し、すべての部品が組み立てられます：艇体＋チューブ、バルブ、Dリング、ハンドル、フィンボックス、キャリーバッグ取り付け。各ユニットは100項目の組立チェックリストに従います。
      qc_check: 1ユニットあたり100項目チェックリスト承認、バルブ機能試験（10回開閉サイクル）、ハードウェアトルク確認、視覚検査
      qc_threshold: 安全上重要な部品（バルブ、Dリング、ハンドル）はゼロディフェクトポリシー。外観上の軽微な欠陥：AQL 2.5（ISO 2859）
      responsibility: 組立チームリーダー ＋ ラインQC
    - stage: '05'
      title: 圧力試験＆品質ホールド
      description: 各チャンバーは定格圧力の1.25倍（通常20～25 PSI）に膨らませ、24～48時間保持されます。圧力センサーは連続記録されます。5%以上の圧力低下を示すチャンバーは不合格となり、シーム再検査に送られます。
      qc_check: 24時間加圧保持ログ、センサー日次校正検証、温度補正圧力測定、修理後シーム再試験
      qc_threshold: 安定温度下で24時間あたり最大5%の圧力降下。この基準を超過するチャンバーがある場合 = 生産バッチ全体を100%再試験
      responsibility: 品質ラボ（生産部門から独立、経営層に直結）
    - stage: '06'
      title: 最終検査＆梱包
      description: 最終的な外観および機能検査。表面欠陥、色の一致性、ラベル／BINの確認、包装の完全性、付属品の完全性。ユニットは真空包装され、箱詰めされ、パレタイズされてコンテナ積み込み用に準備されます。
      qc_check: 完全外観検査、SKUごとのアクセサリー一覧、パッケージ落下試験（1m、無作為サンプル）、ラベル/バーコードスキャン検証
      qc_threshold: AQL 2.5（major欠陥）、AQL 4.0（minor欠陥）。安全関連欠陥はゼロ許容。全ユニット100%外観検査。
      responsibility: 最終QCチーム（4名の検査員）＋梱包チームリーダー

intro: インフレータブルボートの信頼性はシームにかかっています。1つの弱い溶接がチャンバー全体を損なう可能性があり、海上でチャンバー故障が発生した場合、それは不便ではなく安全上の重大なリスクとなります。Afarerでは、産業級の誘電体溶接プレスと厳格な工程管理、溶接後試験を組み合わせた専用RF（Radio-Frequency）溶接センターに投資しています。当社が製造するすべてのシームは、文書化、トレーサビリティが確保され、インフレータブルボートの国際規格 ISO 6185 の要件を満たすか、それ以上であることが認証されています。
content_html: |
  <h2>シームの科学</h2>
  <p>RF溶接は高周波電磁エネルギー（通常27.12 MHz）を用いて、PVCまたはHypalonコーティング生地内の極性分子を励起し、材料界面に正確に熱を発生させます。ホットエア溶接やホットウェッジ溶接とは異なり、RF溶接は真の分子結合を形成します — 溶接ゾーンで2層の生地が単一の均質材料に融合し、母材と同程度の強度を持つ継手を実現します。</p>

  <h2>溶接設備とプロセス管理</h2>
  <p>当社の溶接センターには以下の設備を備えています：</p>
  <table>
    <thead><tr><th>設備</th><th>容量 / 性能</th><th>用途</th></tr></thead>
    <tbody>
      <tr><td>誘電体RFプレス1</td><td>15 kW、プラテン 2000 × 600 mm</td><td>主縦シーム、トランサム・チューブ接合</td></tr>
      <tr><td>誘電体RFプレス2</td><td>10 kW、プラテン 1500 × 500 mm</td><td>バッフル溶接、コーン取付、バルブパッチ</td></tr>
      <tr><td>CNC制御RF溶接機</td><td>8 kW、XYテーブル 2500 × 1200 mm</td><td>曲線シーム、ロゴ/パネルエンボス、精密パッチワーク</td></tr>
      <tr><td>ホットウェッジ自動溶接機</td><td>可変温度、最大1.2 m/min</td><td>Hypalon/CSM材料のバックアップ手法</td></tr>
    </tbody>
  </table>
  <p>すべてのRFプレスにはループ温度・圧力監視装置を装備しています。溶接パラメーター — 出力、加圧時間、冷却時間、電極圧力 — は材料タイプ別にプログラムされ、完全なトレーサビリティのために製造実行システム（MES）に記録されます。</p>

  <h2>溶接品質試験 — 全シーム、全ボート</h2>
  <p>溶接の完全性は、必須の4項目の試験プロトコルによって検証されます：</p>
  <ol>
    <li><strong>外観検査</strong> — 全シームの100%を目視で検査し、焼け穿ち、位置ズレ、汚染、不完全融合を確認。不合格率閾値：線形メートルの0.5%。</li>
    <li><strong>引張試験（剥离試験）</strong> — 各生産ロットで溶接されたテスト試験片から25 mm幅のストリップを切り出す。PVC 1100 dtexの最小剥離力：120 N/25 mm。</li>
    <li><strong>空気保持試験</strong> — 完成した各チャンバーを作動圧力の1.5倍に加圧し、30分間保持。圧力降下は2%を超えてはなりません。</li>
    <li><strong>熱サイクル試験</strong> — サンプル試験片を-20°Cから+60°Cまで50サイクル繰り返し、再度引張試験を実施。許容される強度低下：10%未満。</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">剥離強度比較 — RF vs ホットエア溶接（PVC 1100 dtex）</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">RF溶接</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">ホットエア</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">最小値</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">RF溶接は母材強度の90～95%を安定して達成し、最小値を大幅に上回ります。</p>
  </div>

  <h2>専門知識</h2>
  <p>当社の溶接チームは、コーティング織物の誘電体溶接で11年の経験を持つシニアプロセスエンジニアが統括しています。各オペレーターは、生産シームの作業に就く前に6ヶ月間の社内認定プログラムを完了します。毎年の再認定が必要であり、社内Grade-A基準（剥離強度 ≥ 160 N/25 mm）に基づく実技溶接試験が含まれます。</p>

  <h2>独自の要件に対するカスタム溶接ソリューション</h2>
  <p>1つの溶接仕様がすべての用途に適するとは限らないことを理解しています。当社のRF溶接センターは、特殊な要件を持つクライアントに対して、经常にカスタムシーム構成を開発しています：</p>
  <ul>
    <li><strong>多層補強パッチ</strong> — ラビングストライクやボーコーンなどの高摩耗域向けに、柔軟性を損なわずに耐摩耗性外層を統合したマルチパスRF溶接を開発しています。</li>
    <li><strong>導電性またはRF遮蔽シーム</strong> — 電磁シールドを必要とする軍事・監視船向けに、シーム層内に導電性メッシュ層を溶接しています。</li>
    <li><strong>色変化パネル溶接</strong> — デュアルカラー生地パネル（例：オレンジ船体＋グレー上部構造）を、外観ラインを残さずにブランド美学を維持するための隠蔽オーバーラップで溶接しています。</li>
  </ul>

  <h2>お客様への約束</h2>
  <p>納入するすべてのボートには溶接品質保証が付帯します：保証期間中に通常使用においてシームに不具合が発生した場合、影響を受けるチャンバーを無償で修理または交換し、再発防止のために根本原因調査を実施します。これは単なる保証ではなく、実際の運用データに基づく継続的改善への約束です。</p>
  <p>Afarerをお選びいただくことは、溶接されているだけでなく、設計、試験、文書化されたシームをお選びいただくことを意味します。浮かぶボートと、機能するボートの違いはここにあります。</p>

hero:
  tagline: Our Team
  title: '農業を営む人々<br />—水上の自由を工学的に追求する'
  subtitle: '2012 年に中国の青島で設立された afarer は、プロ仕様のインフレータブル水上バイクを世界中で利用できるようにすることを信じた海洋エンジニア、材料科学者、ウォーター スポーツ愛好家によって作られました。'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: '沿岸のワークショップから<br /> 12,000 平方メートルの施設へ'
  subtitle: 'afarer は、インフレータブル ボートの設計、PVC/ハイパロン製造、および世界的な海洋機器製造において数十年にわたる経験を積んだ海洋エンジニアのチームによって設立されました。'
  items:
    - title: 'Founded: 2012'
      description: '深い造船の歴史を持つ主要な海洋ハブである中国の青島に設立されました。'
      icon: tabler:calendar

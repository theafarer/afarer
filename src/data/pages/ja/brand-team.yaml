philosophy:
  tagline: 設計理念
  title: エンジニアリング主導の設計<br />—あらゆる細部が重要
  subtitle: 当社のエンジニアリング哲学は、当社が構築するすべての製品の指針となる 3 つの原則を中心としています。
  list:
    - 信頼性第一：afarerの全製品は、寒冷水域の救助活動から熱帯リゾートのレンタルまで、実世界の過酷な条件に耐えられるようテストされています。私たちは最重要部分こそ過剰にエンジニアリングします。
    - '製造精度: 当社の設備はCNC切断、高周波溶接、自動圧力試験を採用しています。すべての縫い目、バルブ、金具が文書化された仕様を満たしています。'
    - 継続的イノベーション：当社のR&Dチームは、新素材、製造方法、デザインの改善を常に評価しています。問題が発生するのを待つことなく、事前に予測し対応します。

philosophy:
  tagline: '設計理念'
  title: 'エンジニアリング主導の設計<br />—あらゆる細部が重要'
  subtitle: '当社のエンジニアリング哲学は、当社が構築するすべての製品の指針となる 3 つの原則を中心としています。'
  list:
    - 'Reliability First: Every afarer product is tested to withstand real-world conditions —from cold-water rescue operations to tropical resort rentals. We over-engineer where it matters most.'
    - 'Manufacturing Precision: Our facilities use CNC cutting, high-frequency welding, and automated pressure testing. Every seam, every valve, every fitting meets documented specifications.'
    - 'Continuous Innovation: Our R&D team evaluates new materials, production methods, and design improvements continuously. We do not wait for problems —we anticipate them.'

      description: '50 人以上の研究開発エンジニア、品質管理スペシャリスト、生産技術者が含まれます。'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'SUP、インフレータブルボート、SUPボードの6つの生産ラインを備えた専用製造工場。'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'ヨーロッパ、アメリカ、中東、アジア太平洋、アフリカに輸出しています。'
      icon: tabler:globe

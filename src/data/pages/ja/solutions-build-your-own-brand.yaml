meta:
  title: Private Label SUP製造 | {SITE}
  description: Afarerとともに独自のSUPブランドを立ち上げましょう。アイデアから市場まで — 設計、試作品製造、生産、グローバル物流を含む完全なOEM/ODMサービス。
hero:
  tagline: 自社ブランドを構築
  title: 独自の<br />SUPブランドを立ち上げる
  subtitle: あなたのビジョンと、私たちの工場、専門知識、サプライチェーンを組み合わせれば、差別化されたブランドを構築できます。
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 水上のカスタムブランドSUPボード
process:
  title: あなたのブランドジャーニー
  subtitle: アイデアから市場まで、5段階で実現。
  steps:
    - phase: フェーズ1
      title: アイデア
      period: 第1〜2週
      items:
        - 市場調査と競合分析
        - ターゲット顧客の定義
        - ブランドポジショニングワークショップ
        - 製品ライン戦略
    - phase: フェーズ2
      title: デザイン
      period: 第3〜6週
      items:
        - ボード形状＆グラフィックデザイン
        - カラーマッチング＆素材選択
        - アクセサリー仕様
        - 梱包＆ラベルデザイン
    - phase: フェーズ3
      title: プロトタイプ
      period: 7〜10週目
      items:
        - サンプル製造
        - 品質試験（圧力、浮力、UV）
        - デザイン調整
        - 最終承認
    - phase: フェーズ4
      title: 生産
      period: 第11～14週
      items:
        - 量産製造
        - QC検査（単位あたり）
        - 海上輸送／航空輸送
        - 通関書類
    - phase: フェーズ5
      title: ローンチ
      period: 15〜16週目
      items:
        - 製品写真
        - ウェブサイト製品フィード
        - マーケティング資材
        - ローンチサポート
packages:
  title: スタートアップパッケージ
  subtitle: ブランド成長の各段階に合わせたパッケージ。
  items:
    - name: Starter Brand
      tagline: 50〜100台 × 2ボードモデル
      features:
        - 基本ロゴ印刷
        - 標準パッケージング
        - メールサポート
    - name: Growing Brand
      tagline: 300〜1,000台 × 3〜5モデル
      features:
        - カスタムカラー＋ロゴ
        - カスタムパッケージ
        - 製品写真
        - 専任マネージャー
    - name: Established Brand
      tagline: 1,000+台 · フル製品ライン
      features:
        - フルカスタマイズ
        - プレミアムパッケージ
        - マーケティング資材
        - 優先生産

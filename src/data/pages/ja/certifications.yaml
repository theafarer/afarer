hero:
  tagline: 認証と規格
  title: 品質認証<br /> と準拠基準
  subtitle: afarer 製品は、国際的な海洋安全基準、品質管理システム、環境規制に準拠して製造されています。
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarer 品質認証およびコンプライアンス文書
content_certifications:
  tagline: 私たちの認証
  title: 認定された品質、<br />世界的に認められています
  subtitle: すべての afarer 製品は、品質、安全性、環境責任に対する当社の取り組みを示す認証によって裏付けられています。
  items:
    - title: CE認証
      description: すべての afarer 製品は、レクリエーション水上バイクに関する欧州の CE マーキング要件に準拠しており、安全、健康、および環境保護基準が満たされていることを保証します。
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: 当社の品質管理システムは ISO 9001:2015 認証を取得しており、インフレータブル水上バイクや海洋機器の設計、製造、販売をカバーしています。
      icon: tabler:clipboard-check
    - title: UKCA表示
      description: 英国市場で販売される製品には UKCA マークが付いており、船舶用機器および水上バイクに関する英国の規制に準拠していることを確認します。
      icon: tabler:shield
    - title: BSCI準拠
      description: afarer は BSCI (Business Social Compliance Initiative) の監査を受けており、倫理的な製造慣行、公正な労働条件、サプライチェーンの責任を実証しています。
      icon: tabler:heart-handshake
    - title: REACH規制適合
      description: afarer製品に使用されているすべての材料は化学的安全性に関する EU REACH 規制に準拠しており、当社の PVC、Hypalon、またはコンポーネントに制限物質が含まれていないことを保証しています。
      icon: tabler:flask
    - title: 材料試験
      description: 生地は、引張強度、引裂抵抗、紫外線劣化、および低温亀裂性能についてテストされます。 すべての生産バッチはサンプリングされ、検証されます。
      icon: tabler:test-pipe
content_factory:
  tagline: 工場基準
  title: 卓越した製造<br />—仕様に合わせて構築
  subtitle: 当社の 12,000 平方メートルの施設は、生産のあらゆる段階で厳格な品質管理プロトコルの下で稼働しています。
  list:
    - 入荷材料検査：すべての原料（PVC生地、Hypalon、アルミニウム、合板、接着剤）は、生産に入る前に仕様に基づき検査されます。
    - '工程内品質管理: 各生産段階に文書化されたQCポイントがあります。溶接強度、シーム精度、バルブ取り付け、およびフィッティングトルクはインラインで検証されます。'
    - 加圧試験：各エアチャンバーは定格圧力の1.5倍で24時間加圧試験を実施。合格基準は漏洩率ゼロ。
    - 最終検品：完成品は出荷前に寸法精度、外観仕上げ、アクセサリーの完全性、梱包の完全性を検査します。
    - バッチトレーサビリティ：すべての製品には生産バッチ記録と連携されたシリアルナンバーが付与されており、原材料から完成品までの完全なトレーサビリティを実現しています。
content_safety:
  tagline: 海洋安全基準
  title: 安全第一<br />—信頼性の高い動作を実現する設計
  subtitle: afarer 製品は、商業用および娯楽用の国際海洋安全基準を満たすように設計およびテストされています。
  items:
    - title: ISO 6185
      description: インフレータブルボートは、構造、安定性、浮力、耐荷重に関して ISO 6185 規格に準拠しています。
      icon: tabler:sailboat
    - title: ABYC基準
      description: 電気システムと燃料システムは、安全な設置と操作のための ABYC (American Boat & Yacht Council) 規格に従っています。
      icon: tabler:bolt
    - title: SOLAS適合
      description: 安全装置および救命器具は、該当する場合、SOLAS (海上人命の安全) 要件を満たしています。
      icon: tabler:lifebuoy
cta:
  title: プロジェクトに認定製品が必要ですか?
  subtitle: お客様の市場の認証要件、文書、コンプライアンスについては、当社のチームにお問い合わせください。
  actions:
    - variant: primary
      text: 認定ドキュメントをリクエストする
      href: /contact
    - text: 品質ページを見る
      href: /quality

packages:
  title: クラブ船隊プログラム
  subtitle: クラブの規模と目標に合ったフリートプログラムをお選びください。
  items:
    - name: スタートアップパッケージ
      tagline: 新規クラブ向け、30名まで
      features:
        - SUPボード10台(オールラウンド+ツーリングのミックス)
        - パドル10本+ライフジャケット10枚
        - 2WAYポンプ2台+リペアキット1式
        - ボードへのクラブブランド刻印(ロゴプリント)
        - 立ち上げガイド＋安全チェックリスト
        - CE認証 ― すべての設備
      cta_text: クラブを始める
    - name: プロフェッショナルフリート
      tagline: 定着したクラブ向け、50〜100名
      features:
        - SUPボード30台(3サイズ展開)
        - パドル30本+ライフジャケット30枚
        - ポンプ5台+リペアキット2式+収納ラック
        - クラブのオリジナルカラー+ボードへのロゴ
        - 交換部品プログラム（15%割引）
        - スタッフトレーニングセッション（オンライン）
        - CE認証 ― すべての設備
      popular: true
      cta_text: フリートを構築
    - name: コンペティションフリート
      tagline: レースクラブ、イベント、競技会向け
      features:
        - 50台以上のレース／パフォーマンスボード
        - フルアクセサリーセット(パドル、ライフジャケット、ポンプ)
        - イベントサポートキット(スタートブイ、マーキング)
        - 優先部品供給（24時間以内発送）
        - 専任アカウントマネージャー
        - カスタムチームユニフォームオプション
        - CE認証 ― すべての設備
      cta_text: 競技用フリートを取得

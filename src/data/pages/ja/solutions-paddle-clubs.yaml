  subtitle: SUPスクールがプロフェッショナルな認定コースを運営するために必要なすべて。
  items:
    - name: Instructor Starter
      features:
        - 5台のプレミアムSUPボード（インストラクターグレード）
        - デモ用のカーボンパドル5本
        - 5件のライフベスト（インストラクター用フィット）
        - トレーニングカリキュラムガイド
        - CE認証済み機器
    - name: School Full Set
      features:
        - 20台のSUPボード（学员＋インストラクター混合）
        - パドル20本 ＋ ライフベスト20着（各種サイズ）
        - 初心者向け浮力具10点
        - ポンプ4台 + 修理キット
        - トレーニングカリキュラム＆認証サポート
        - CE認証済み機器

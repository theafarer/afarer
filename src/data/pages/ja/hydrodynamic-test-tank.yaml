hero:
  tagline: Lab 04
  title: 流体力学的試験槽
  subtitle: 最初のフルスケール試作前の性能検証
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: afarer 水中动力試験タンク性能試験
intro: 流体力学的試験が大型海洋船舶にのみ必要とされるという誤解はよく見られます。実際には、4〜6mのRIBのような小型プラーニング艇の性能も、その水中形状に依存度はタンカーのバルブブリッジと同程度です。トリム角度、浸水面積、スプレー発生、通風すべてが速度、燃料消費、乗り心地に大きな影響を与えます。{SITE.name}では、専用の流体力学的試験槽を備えており、フルサイズプロトタイプに金属と生地を投入する前にモデルスケールでこれらの効果を定量化できます。
content_html: |-
  <h2>小型ボートのタンクテストはなぜ重要ですか?</h2>
  <p>モデルスケール（通常1:3〜1:5）でのテストにより、船殻形状を迅速かつ費用対効果よく反復できます。タンクでの1週間の作業で、フルスケール試験錯誤を数か月かけて行った場合と同等の性能データを、わずか一部のコストで得ることができます。</p>

  <h2>施設仕様</h2>
  <table>
    <thead><tr><th>パラメータ</th><th>仕様</th></tr></thead>
    <tbody>
      <tr><td>タンク寸法</td><td>35 m (L) × 3.5 m (W) × 1.8 m (D)</td></tr>
      <tr><td>牽引キャリッジ</td><td>電気サーボ駆動、最高速度12 m/s（23ノット）、速度精度± 0.5 %</td></tr>
      <tr><td>波発生装置</td><td>フラップ式、プログラマブルな定常・不规则な海浪状態、モデルスケールで波高0.3 mまで</td></tr>
      <tr><td>計測器</td><td>6成分ダイヤモメーター（抵抗、横方向力、ヨーモーメント）、加速度計、傾斜計、波センサー</td></tr>
      <tr><td>データ取得</td><td>チャネルごとに1000 Hzでサンプリング、リアルタイム表示＋後処理スイート</td></tr>
      <tr><td>モデル製作</td><td>モデル船殻（最大1.8 m LOA）のインハウスCNCフライス加工および3Dプリンティング</td></tr>
    </tbody>
  </table>

  <h2>テストプログラム</h2>
  <p>タンクでの標準的な船殻開発プログラムは、以下のシーケンスに従います：</p>
  <ol>
    <li><strong>モデル製作</strong> — 1:3.5スケールモデルは高密度フォームからCNC加工され、剛性のためにガラス仕上げされています。重量と重心はフルロード条件のフルードスケールに合わせて調整されます。</li>
    <li><strong>抵抗走行</strong> — モデルは運航範囲全体にわたる8〜10の速度で牽引されます。総抵抗が測定され、ITTC-1957法を用いて摩擦抵抗と残存抵抗成分に分解されます。</li>
    <li><strong>トリムと喫水測定</strong> — 各速度で走行トリムと喫水が記録されます。プランニング船殻の最適トリム角度4〜6°が目標です。</li>
    <li><strong>ウェイク調査</strong> — 2つの速度で横方向波の切り欠きを測定し、波発生抵抗を評価し、船尾干渉を引き起こす可能性のある横方向波の相互作用を特定します。</li>
    <li><strong>耐航性（オプション）</strong> — 増加抵抗、垂直加速度、およびスラミング確率を測定するために、正規波での頭波および追い波走行を実施します。</li>
    <li><strong>データ分析と推奨事項</strong> — 完全な報告書が比較チャート、速度/出力曲線、およびフルスケール船殻のための具体的な設計推奨事項とともに提供されます。</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">典型的なタンクテスト結果 — 抵抗 vs 速度（RIB 450船殻、1:3.5スケール）</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">モデルスケールの抵抗（N）、フルード等価速度。フルスケール出力予測はITTC-1978性能予測法に従います。</p>
  </div>

  <h2>専門チーム</h2>
  <p>当タンクは、博士（海事建築）号を持ち、主要な欧州海事研究機関で8年間の牽引タンク経験を持つ流体力学者が運営しています。彼はすべてのモデルと計測器を準備する技術者によってサポートされています。チームは、すべての試験が再現可能で、トレーサブルであり、国際的に正当化されることを保証するために、ITTC（International Towing Tank Conference）推奨手順に従っています。</p>

  <h2>カスタム船殻開発のためのタンクテスト</h2>
  <p>当タンクは自社設計の船殻にのみ使用されるわけではありません — カスタム船殻形状を検証したり、性能問題を調査したいお客様のために、定期的にテストプログラムを実施しています：</p>
  <ul>
    <li><strong>船殻形状比較</strong> — 同一条件で2つ以上の候補船殻形状をテストし、設計選択に役立つ客観的な抵抗/速度/安定性の比較を提供します。</li>
    <li><strong>付随部分最適化</strong> — インターセプターブレート、スプレーエッジ、トリムタブ、およびストレークを、さまざまな構成でテストし、それぞれの抵抗低減への個別寄与を定量化できます。</li>
    <li><strong>エンジンマッチング研究</strong> — 抵抗データは出力予測曲線に変換され、目標速度と積載量に最適なエンジン馬力を選択できるようにします。</li>
  </ul>

  <h2>なぜ当社でテストするのですか?</h2>
  <p>私たちは単に生の数字を提示するだけでありません。我们的レポートはタンクデータを実行可能なエンジニアリング推奨事項に翻訳します：「巡航速度での濡れた表面積を減らすためにスプレーエッジを8 mm上げる」、「スラミング加速を減らすためにトランスムに deadrise を3°増やす」、「プラニング姿勢を改善するために縦重心を150 mm後方に移動する」。変更点とその理由を明確に理解した状態で去ります。</p>
  <p>当タンクは、フィーフォーサービスベースで独立した第三者によるテストにも利用可能です。船殻を開発しており、偏りのない専門的な流体力学評価をご希望の場合は、お気軽にお問い合わせください。</p>

  description: 'afarerはインフレータブルSUPボードとボートを全大陸50カ国以上へ輸出しています。ブランド、ディストリビューター、フリート向けのプロフェッショナルメーカー・サプライヤーです。'
  keywords:
    - 'グローバルSUPメーカー'
    - 'パドルボード輸出業者'
    - 'SUP工場 中国'
    - 'プロフェッショナルSUPサプライヤー'
hero:
  tagline: 世界的な存在感
  title: 50 か国以上にサービスを提供<br />あらゆる大陸にわたって
  subtitle: ヨーロッパの沿岸パトロールのオペレーターからオーストラリアのウォーター スポーツ販売業者、中東の救助チームに至るまで、世界中の海上にボートが航行しています。
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp

features3_markets:
  tagline: 主要市場
  title: 地域の要件に対応する地域の専門知識<br />
  subtitle: 私たちは、市場が異なれば、規制要件、好み、使用例も異なることを理解しています。
  isBeforeContent: false
  columns: 4
  items:
    - title: 欧州＆英国
      description: EN ISO 6185規格を満たすCE認定製品。 EU市場全体でRIB、インフレータブルボート、SUPボードに対する強い需要。 英国の代理店は当社の迅速な対応を高く評価しています。
      icon: tabler:map-pin
    - title: 北米
      description: 米国沿岸警備隊が製造を承認しました。 カリフォルニア州モントクレアにある米国の倉庫で、西海岸への迅速な配送を実現します。 漁船、救助船、レクリエーション用SUPの需要が高まっています。
      icon: tabler:map-pin
    - title: オーストラリア・オセアニア
      description: SUP ボートとインフレータブル テンダーの市場は好調です。 オーストラリアの販売代理店は、厳しい太陽条件下でも耐紫外線性を備えたハイパロン ボートを高く評価しています。 アジアの施設から迅速に発送します。
      icon: tabler:map-pin
    - title: 中東
      description: 巡視船や救助船の需要が高まっています。 当社のアルミニウム船体 SUP は、沿岸警備隊や警備員に人気があります。 高温環境向けのカスタム構成。
      icon: tabler:map-pin
features3_distribution:
  tagline: 流通ネットワーク
  title: 世界中の販売代理店と提携<br />
  subtitle: 当社は、確立された海洋機器販売業者、OEM ブランド、政府調達機関と協力しています。
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODMパートナーシップ
      description: 世界的なウォーター スポーツ ブランドのプライベート ラベルの製造。 デザインから製作、発送まで全て対応させていただきます。
      icon: tabler:building
    - title: ディストリビューターネットワーク
      description: 20 か国以上の正規代理店が在庫を持ち、現地サポートを提供しています。 新規代理店様のお問い合わせも大歓迎です。
      icon: tabler:users
    - title: 官公庁・公共機関
      description: 沿岸警備隊、捜索救助組織、軍事調達プログラムに直接供給します。 機関調達要件への準拠。
      icon: tabler:building-community
steps2_logistics:
  title: グローバルロジスティクスとサポート
  subtitle: 工場から目的地まで、当社はサプライチェーン全体を管理します。
  items:
    - title: 配送オプション
      description: 船便 (FOB 青島)、緊急注文の場合は航空便、サンプルやスペアパーツの場合は速達便をご利用いただけます。
      icon: tabler:truck-delivery
    - title: 米国倉庫
      description: '北米全土に迅速に配送できるよう、在庫はカリフォルニア州モントクレアに保管されています。 西海岸: 2 ～ 3 日、中部: 3 ～ 4 日、東海岸: 4 ～ 5 日。'
      icon: tabler:building-warehouse
    - title: スペアパーツ
      description: 本物のアファーラーのスペアパーツと消耗品は年間を通じて在庫されています。 共通部品は 24 時間以内に発送されます。
      icon: tabler:package
    - title: 技術サポート
      description: 技術的な質問、修理に関するアドバイス、修理サポートについては、当社のエンジニアリング チームに直接お問い合わせください。 私たちは20年前に建造したボートをサポートしています。
      icon: tabler:headset
cta:
  title: ディストリビューターになりたいですか?
  subtitle: 当社は積極的に販売ネットワークを拡大しています。 パートナーシップの機会については、当社の輸出チームにお問い合わせください。
  actions:
    - variant: primary
      text: パートナーシップに関するお問い合わせ
      href: /contact
    - text: 製品ラインナップを見る
      href: /products

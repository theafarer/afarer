  title: OEMバイヤーガイド — アジアからのインフレータブル船舶調達 | {SITE}
  description: アジアのメーカーからインフレータブルボート、SUP、カヤック、RIBを調達するための包括的ガイド：工場評価チェックリスト、QCプロトコル、適合確認、MOQ交涉、配送条件、よくある落とし穴。
back_text: 研究トップに戻る
hero:
  tagline: 調達
  title: OEMバイヤーガイド — アジアからエア船を調達する
  subtitle: 12分で読める
content_html: |
  <h2>1. 一次資格審査：工場で確認すべきこと</h2>

  <h3>適合証明書</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – 品質管理体制</li>
    <li><strong>CE認証</strong> – 認証機関の番号を確認</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – 社会のコンプライアンス監査</li>
    <li><strong>REACH / RoHS</strong> – 素材適合宣言</li>
  </ul>

  <h3>製造能力</h3>
  <ul>
    <li>ドロップステッチコアの社内織り vs. 社外委託</li>
    <li>PVCコーティング／ラミネーションライン</li>
    <li>RF溶接およびホットエア溶接設備</li>
    <li>社内金型製作（CNC加工）</li>
    <li>試験室（圧力試験、UV経年試験、引張試験）</li>
  </ul>

  <h3>経験の検証</h3>
  <ul>
    <li>インフレータブル水上機の製造年数（5年以上）</li>
    <li>スタッフの技術者数</li>
    <li>既存のOEM/ODMクライアント（参考情報の要請）</li>
    <li>輸出先 – すでにターゲット市場に輸出しているか？</li>
  </ul>

  <h2>2. 品質管理プロトコル</h2>
  <p>材料入荷QC：引張強度（ASTM D751またはISO 1421）、耐裂性（ASTM D2261またはISO 4674）、接着強度、UV経年スポットチェック。</p>
  <p>工程内QC：シーム強度の50ユニットごとの監視、バルブトルク検証、ドロップステッチ糸密度チェック、CAD図面との寸法チェック。</p>
  <p>最終検査：100%空気保持試験（24時間、最大5%減）、外観検査、バルブ機能テスト、ランダムサンプルテスト（AQL 2.5または4.0 / ISO 2859）。</p>

  <h2>3. 適合証明書チェックリスト</h2>
  <ul>
    <li>EU directiveを参照する適合宣言書（DoC）</li>
    <li>認証機関からのCE証明書</li>
    <li>認定試験所からの試験報告書</li>
    <li>材料安全データシート（MSDS）</li>
    <li>REACH適合宣言</li>
    <li>サプライヤー追跡性付き部品表（BOM）</li>
    <li>工場検査報告書</li>
  </ul>

  <h2>4. MOQ交渉</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Product Type</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standard MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Negotiable Range</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP Boards</td><td class="p-3 border">50 – 100 units</td><td class="p-3 border">5 – 10 units (trial)</td></tr>
      <tr><td class="p-3 border">Kayaks</td><td class="p-3 border">50 – 100 units</td><td class="p-3 border">5 – 10 units (trial)</td></tr>
      <tr><td class="p-3 border">Inflatable Boats</td><td class="p-3 border">50 – 100 units</td><td class="p-3 border">2 – 5 units (trial)</td></tr>
      <tr><td class="p-3 border">RIB Boats</td><td class="p-3 border">20 – 50 units</td><td class="p-3 border">2 – 5 units (trial)</td></tr>
      <tr><td class="p-3 border">Safety / Accessories</td><td class="p-3 border">200 – 500 units</td><td class="p-3 border">50 – 100 units (trial)</td></tr>
    </tbody>
  </table>

  <h2>5. 物流と出荷</h2>
  <p>一般的なIncoterms：<strong>FOB</strong>（工場から出港までの納入 – 最も一般的）、<strong>EXW</strong>（購入者が工場ドアからすべての輸送を手配）、<strong>CIF</strong>（工場が運賃と保険を目的地港まで支払う）。</p>
  <p>インフレータブル製品は軽量・大容量 – 体積重量（DIM）が送料を決定することが多いです。体積を50–60%削減するために真空包装を依頼してください。中国からEUへの海上輸送：25–35日。US西海岸：15–20日。</p>

  <h2>6. よくある落とし穴</h2>
  <ul>
    <li><strong>工場監査なし：</strong>必ず第三者監査（QIMA、SGS、Bureau Veritas）を実施または依頼する</li>
    <li><strong>口頭仕様のみ：</strong>両者が署名した詳細な技術 仕様書</li>
    <li><strong>サンプル承認をスキップ：</strong>一括生産前のサンプルに対する署名済み承認</li>
    <li><strong>生産中のQCなし：</strong>第三者検査（生産中のDUPRO、および出荷前のPSI）</li>
    <li><strong>コンプライアンスを無視：</strong>生産前にCE/UKCA認証を確認する</li>
  </ul>

  <h2>7. Afarerの理由</h2>
  <p>Afarerは2012年からOEM/ODMインフレータブル水上機を製造しています。12,000 m&sup2;のISO 9001認証施設、25人以上の技術者、すべての製品ラインにわたるCE認証を持ち、このガイドのすべての基準を満たしています。新規パートナー向けの試験MOQと完全なコンプライアンス文書パッケージを提供しています。</p>

content_programs:
  tagline: パートナープログラム
  title: パートナー プログラム<br />成長を目指して構築
  subtitle: あなたがディストリビュータ、ディーラー、ブランドパートナーであっても、afarer はあなたのビジネスをサポートするように設計されたプログラムを提供します。
  columns: 3
  items:
    - title: ディストリビュータープログラム
      description: 大量価格設定、マーケティング サポート、工場への直接アクセスを伴う独占的な地域での販売。 テリトリーの規模に基づいて必要な最小限のコミットメント。
      icon: tabler:world
    - title: ディーラープログラム
      description: ディーラーの直接価格設定、製品トレーニング、マーケティング資料、および小売店とオンライン ストアの保証サポート。
      icon: tabler:building-store
    - title: OEM/ODMパートナーシップ
      description: カスタムブランディング、パッケージング、製品仕様を使用したフルサービスの OEM および ODM 製造。 コンセプトからコンテナへ。
      icon: tabler:certificate
    - title: ブランドパートナーシップ
      description: マリンおよびアウトドアレクリエーションスペースにおける確立されたブランドの共同ブランド、プライベートブランド、および独占モデルプログラム。
      icon: tabler:stars
    - title: 官公庁・公共機関
      description: 政府機関、沿岸警備隊、軍、人道団体向けの優先サプライヤー プログラム。 入札準備完了の文書。
      icon: tabler:building-community
    - title: リゾート＆レンタルパートナー
      description: 世界中のリゾート、ダイビング センター、レンタル業務向けのフリート価格、一貫した品質、カスタム ブランド。
      icon: tabler:sun
content_benefits:
  tagline: 私たちと提携する理由
  title: パートナーがafarerを選ぶ理由
  subtitle: 当社のパートナーは、実際の製造能力、一貫した品質、迅速なサポートの恩恵を受けています。
  list:
    - 直接工場アクセス：当社の製造チームと直接連携。中間業者を介さず、より迅速な対応、適正価格、生産の完全な可視性を実現します。
    - カスタマイズ対応：カスタムカラー、ロゴ、パッケージ、仕様で商品にブランド付けが可能。市場に合わせた最小発注数量を設定。
    - 品質保証：ISO 9001認定の生産体制により、CE、UKCA、BSCIに準拠。すべての製品は出荷前に試験を実施しています。
    - グローバル物流：中国・青島からFOB、CIF、DDP便で出荷。北米配送はカリフォルニア州モンクレアに倉庫あり。
    - マーケティングサポート：制品カタログ、写真、技術文書、および営業活動を支援するデジタルアセット。
    - トレーニング＆サポート：営業チーム向けの製品トレーニング、お客様向けの技術サポート、保証サービスのコーディネーション。
content_process:
  tagline: パートナーになる方法
  title: シンプルなパートナーシッププロセス
  subtitle: 当社のパートナーシップ プロセスは簡単で、より多くの製品を迅速に販売できるように設計されています。
  items:
    - title: ステップ1：申請書提出
      description: パートナー申請フォームに会社概要、ターゲット市場、興味のある製品を記入してください。
    - title: 'ステップ2: 資格審査'
      description: 弊社のパートナーシップ チームがお客様のお申し込みを確認し、機会について話し合うために 3 営業日以内にご連絡させていただきます。
    - title: ステップ3：契約＆セットアップ
      description: パートナーシップ契約に署名し、アカウントを設定し、パートナーの価格設定、マーケティング資料、製品サンプルを受け取ります。
    - title: ステップ4：研修＆ローンチ
      description: 製品トレーニング、販売サポート、マーケティング関連資料が提供されます。 販売を開始する準備ができました。
cta:
  title: 遠方パートナーになる準備はできていますか?
  subtitle: パートナーシップをお申し込みいただければ、弊社チームが 3 営業日以内に返答いたします。
  actions:
    - variant: primary
      text: パートナーシップを申請する
      href: /contact
    - text: 製品を見る
      href: /products

  title: プロトタイプ工房 — フルスケールRIB試作＆海上試験 | {SITE}
  description: CADから海に出せるボートまで8～12週間。当社のプロトタイプワークショップはカスタムRIBおよびインフレータブルボートを建造、装備、海上試験します。今日からプロトタイププロジェクトを開始しましょう。
back_text: R&Dセンターへ戻る
home_label: ホーム
hero:
  tagline: ラボ05
  title: プロトタイプ工房
  subtitle: CADモデルから海上使用可能ボートまで——製造・装着・実証まで一貫対応
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
  image_alt: afarer プロトタイプ工場のボート製造
intro: CADモデルはいかに詳細であっても、実際に水に触れるまでボートの動きを明らかにすることはできません。そのため、当社のプロトタイプワークショップは、エンジニアリングデータを物理的で航海可能な船舶に、できる限り迅速かつ正確に変換するように設計されています。すべての新規{SITE.name}モデル ―― および重要なカスタムビル ―― は、製造 toolingが確定する前にこのワークショップを通過します。
content_html: |
  <h2>設計が現実になる場所</h2>
  <p>本ワークショップは、船体、チューブ、装備の同時製作に完全に設備が整っています。この並行ワークフローにより、試作のリードタイムはエンジニアリング完了から8〜12週間に短縮され、業界標準の16〜20週間を大幅に下回ります。特殊なソリューションが必要なアプリケーションでも、コンセプトから水上検証まで3ヶ月以内に実現できます。</p>

  <h2>ワークショップの能力</h2>
  <table>
    <thead><tr><th>作業エリア</th><th>設備</th><th>用途</th></tr></thead>
    <tbody>
      <tr><td>船体製作</td><td>回転成形炉（HDPE）、TIG溶接ベイ（アルミ）、ハンドレイアップ型（ガラス繊維）</td><td>3種類の素材すべてで本格的な船体生産</td></tr>
      <tr><td>チューブ組立</td><td>RF溶接プレス、ホットエアタッキングステーション、加圧試験ジグ</td><td>全サイズチューブアセンブリの製作（バッフル、コーン、バルブを含む）</td></tr>
      <tr><td>装備＆フィッティング</td><td>エンジンヒフト（500 kg）、コンソールモックアップフレーム、油圧ホースクランパー、電気ハーネスボード</td><td>完全な装備：エンジン、ハンドル、操作系統、燃料システム、電子機器、座席</td></tr>
      <tr><td>計装ベイ</td><td>GPS速度センサー、燃料流量計、加速度計、サーモコープルアレイ、データロガー</td><td>海上試験用計装の設置と校正</td></tr>
    </tbody>
  </table>

  <h2>試作の流れ — ステップバイステップ</h2>
  <ol>
    <li><strong>エンジニアリング引渡し</strong> — 設計パッケージ（3Dモデル、FEEAレポート、部品表、積層スケジュール）をワークショップリーダーとプロジェクトエンジニアが正式にレビューします。製造上の懸念はすべて、カット開始前に特定・解決されます。</li>
    <li><strong>船体製作</strong> — 工仕様に従って船体を構築します。HDPE：Moldex3Dシミュレーションから回転成形プログラムをロード。アルミ：承認された溶接マップに従い、CNCカット板をTIGベイで溶接。ガラス繊維：積層ブックに従いレイヤーごとに施工。</li>
    <li><strong>チューブ製作</strong> — CNCパターンテンプレートで生地をカットし、RF溶接でフルサイズチャンバーに仕立てます。各チャンバーは試験圧力で加圧し、24時間放置して初期安定化を行います。</li>
    <li><strong>組立＆装備</strong> — 船体とチューブを結合。エンジンを吊り下げ、ハンドルと操作系を接続、燃料システムを設置し、全電気回線を配線・検証します。</li>
    <li><strong>静的試験</strong> — ボートが水に触れる前に以下を実施：浮力検査（フル荷重＋30%予備浮力）、燃料システム圧力試験、ハンドルシステムフルロックサイクル試験、電気接地連続性試験。</li>
    <li><strong>海上試験プログラム</strong> — 下記の詳細で20時間の水上試験を実施。</li>
    <li><strong>試作レビュー</strong> — エンジニアリング、生産、品質チームによる正式な承認会議を開催。必要なデザイン変更を文書化し、量産リリースに組み込みます。</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20時間海上試験プログラム — 試験スケジュール</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">港内操船 — 低速操船、後進、フェンダーチェック</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">速度試験 — GPS検証による最高速度、クルーズ速度、3つのRPMポイントでの燃料消費量</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">旋回試験 — 20knで戦術的直径、進距、横走距離を左舷・右舷で測定</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">スラミング試験 — 0.5〜1.0 mの波を連続通過；ハンドルシートベースに加速度計設置</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">安定性試験 — 右舷に4名の乗組員＋装備を搭載した静的傾斜角測定、偏荷重試験</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">持続運転試験 — クルーズ速度で3時間連続運転；温度監視（エンジン、燃料、電気）</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">最終検査 — 試験後の全システム検査、全ボルトの締め付け・点検、結果を文書化</span>
      </div>
    </div>
  </div>

  <h2>ユニークなアプリケーション向けカスタム試作</h2>
  <p>試作ワークショップは、標準的な量産ボートでは対応できない問題を解決する場所です。最近の事例：</p>
  <ul>
    <li>捜索救難機関向け7.8 m RIB：ロールオーバープロテクション付きカスタムキャビン構造、統合ストレッチャーマウント、船首装着ソナーポッドを要件とし、すべて当社施設で試作・設置・試験を実施。</li>
    <li測量業者向け5.2 mインフレータブル：カットダウントランサム、取り外し可能な計装マスト、流体攪乱を最小化するための貫通型トランデューサーポケットを装備。</li>
    <li>スーパーヨット向け電動駆動4.5 mティンダー：試作機を用いて航走距離、充電インフラ、騒音レベルを検証し、クライアントが4隻のフリート調達を決定。</li>
  </ul>

  <h2>試作チーム</h2>
  <p>本ワークショップは、8名の多技能海洋技術者が常駐し、各技術者は3つのコアディスципリーン（船体、チューブ、装備）のうち少なくとも2つでクロストレーニングを受けています。チームリーダーは、カスタム個別製作から量産シリーズまで16年の経験を持つ熟練ボートビルダーです。各試作機には、ビルドおよび試験プロセス全体を通じてお客様の唯一の連絡の連絡窓口となる専任プロジェクトエンジニアがアサインされます。</p>

  <h2>お客様の関与</h2>
  <p>試作ビルド中の主要マイルストーン — 特に初期フィッティングレビューと海上試験 — にお客様ご出席を積極的に推奨しています。これらの段階での運用フィードバックは、量産前のボートの微調整に不可欠です。我们は独りよがりには作りません；お客様とパートナーシップの中で作り上げます。</p>
  <p>20時間の海上試験は、ボートの操船性、システム構成、メンテナンス要件にチームが熟悉する機会でもあり、量産ボート納入後のスムーズな運用移行を確保します。</p>

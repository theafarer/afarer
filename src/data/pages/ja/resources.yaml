hero_text:
  tagline: Resources
  title: 'ダウンロード センターと購入者ガイド'
  subtitle: '製品カタログ、OEM ガイド、バイヤー チェックリスト、技術文書にアクセスして、情報に基づいた調達の意思決定を支援します。'
features3_downloads:
  tagline: Downloads
  title: '製品ドキュメント<br />およびバイヤー向けリソース'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'SUP ボート、インフレータブル ボート、SUP ボード、カヤック、アクセサリーを含む完全な製品範囲。 仕様、構成、オプション。 PDF形式。'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'OEM/ODM パートナーシップについて知っておくべきことすべて: プロセスの概要、最小注文数量、カスタマイズ オプション、品質管理、出荷。'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: '適切な SUP を選択する方法: 船体の材質、チューブの材質、エンジンの選択、サイズの考慮事項、さまざまな用途に応じた構成オプション。'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'SUP ボードのメーカーを選択する際の主な考慮事項: 品質指標、認証要件、MOQ に関する考慮事項、工場監査で何を探すか。'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC とハイパロン: さまざまな海洋用途における耐久性、耐紫外線性、寿命、修理オプション、およびコストの考慮事項の比較。'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: '製品概要テンプレートをダウンロードしてください。 要件を記入して返送していただくと、同じ週内に見積もりと実現可能性の評価が行われます。'
      icon: tabler:template
faqs:
  title: 'よくある質問'
  subtitle: '当社の製品、製造プロセス、パートナーシップ モデルに関するよくある質問。'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQは製品カテゴリによって異なります。 SUP ボートは通常、モデルあたり 10 ユニットから始まります。 SUPボードは50台から。 製品固有のMOQ情報については、当社の営業チームにお問い合わせください。'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'はい。 afarerでは量産前に評価用のサンプル生産を行っております。 サンプル費用は交渉可能であり、多くの場合、最初の製造注文に充当されます。'
      icon: tabler:package
    - title: What payment terms are available?
      description: '標準条件は、注文時に 30% のデポジット、出荷前に 70% です。 資格のある顧客が利用できる LC 条件。 取り決めについては、当社の財務チームにお問い合わせください。'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: '通常のリードタイム: SUP ボート 30 ～ 45 日、SUP ボード 20 ～ 30 日、インフレータブル ボート 25 ～ 35 日。 カスタム開発では、プロトタイピングに 15 ～ 30 日かかります。'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'EU市場向けCE認証、米国沿岸警備隊承認製造、ISO品質システム、BSCI準拠、REACH材質準拠。'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'はい。 お客様のロゴ、色、ブランドアイデンティティを取り入れたカスタムパッケージを提供します。 カスタムパッケージのMOQは製品カテゴリによって異なります。'
      icon: tabler:color-swatch
cta:
  title: '適切なリソースを見つけるのにサポートが必要ですか?'
  subtitle: '製品の選択、OEM パートナーシップ、または技術仕様に関する個別のガイダンスについては、当社のチームにお問い合わせください。'
  actions:
    - variant: primary
      text: '私たちのチームに連絡してください'
      href: /contact

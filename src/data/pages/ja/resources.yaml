meta:
  title: B2Bリソース＆ダウンロード | {SITE}
  description: インフレータブルSUPビジネス向けのOEM製造ガイド、製品カタログ、品質レポート、ROI計算ツールをダウンロード。
hero:
  tagline: リソースセンター
  title: ツール＆リソース<br />SUPビジネスパートナー向け
  subtitle: OEMガイド、製品カタログ、品質レポートをダウンロードし、ROI計算機でSUPフリート投資を計画。
resources:
  - title: 2026年 OEM/ODM 制品カタログ
    description: 仕様、価格帯、MOQ、カスタマイズオプションを含むB2Bパートナー向けの完全製品ラインナップ。
    icon: tabler:file-text
    type: catalog
    link: /media
    cta: カタログをダウンロード
  - title: Private Label SUPブランドガイド
    description: 自社のSUPブランドを立ち上げるためのステップバイステップガイド — 市場調査とデザインから生産とグローバル配送まで。
    icon: tabler:book
    type: guide
    link: /news/private-label-sup-oem-guide
    cta: ガイドを読む
  - title: SUPフリートROI計算ツール
    description: 当社のインタラクティブ計算機で、リゾートまたはクラブのSUPフリート投資、予想収益、回収期間を概算できます。
    icon: tabler:calculator
    type: tool
    link: '#roi-calculator'
    cta: ROIを計算
  - title: 品質＆認証レポート
    description: CE認証書類、ISO 9001品質管理、UV耐候性試験結果、加圧保持試験データ。

    description: 12,000 m²の製造設備を仮想的に見学し、生産ラインの詳細と品質管理プロセスを確認できます。
    icon: tabler:building-factory
    type: brochure
    link: /factory
    cta: 工場見学
  - title: リゾートフリート収益ガイド
    description: 商用SUPフリートROI分析。価格モデル、利用率、5つ星リゾートからの実際の事例研究結果を含みます。
    icon: tabler:chart-bar
    type: guide
    link: /news/commercial-sup-fleet-roi-resorts
    cta: ガイドを読む

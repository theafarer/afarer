hero:
  tagline: 素材
  title: PVC vs Hypalon — インフレータブルボートの技術比較
  subtitle: 読了時間 10分
content_html: |-
  <h2>素材概要</h2>

  <h3>PVC（ポリ塩化ビニル）</h3>
  <p>PVCは、インフレータブルボート製造で広く使用される熱可塑性ポリマーです。海洋用途では、通常ポリエステルスクリム（1,100 ? 1,680 DTEX）で補強され、両面にコーティングされます。最新の海洋用PVC配合には、柔軟性と耐候性を向上させるためのUV安定剤と可塑剤が含まれています。</p>

  <h3>Hypalon（CSM ― 塩化スルホン化ポリエチレン）</h3>
  <p>Hypalonは合成ゴム化合物です（DuPontがHypalon商標を中止した後、現在はCSMとして一般生産されています）。優れたUVおよびオゾン耐性で知られ、長時間直接日光にさらされるプロ用および軍用グレードのインフレータブルボートの好ましい素材です。</p>

  <h2>比較表</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">特性</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">PVC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Hypalon（CSM）</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">UV耐性</td><td class="p-3 border">良好（安定剤付き）</td><td class="p-3 border">優秀（固有）</td></tr>
      <tr><td class="p-3 border font-medium">耐摩耗性</td><td class="p-3 border">良好</td><td class="p-3 border">very good</td></tr>
      <tr><td class="p-3 border font-medium">引張強度</td><td class="p-3 border">3,000 ? 5,000 N/5cm</td><td class="p-3 border">2,500 ? 4,000 N/5cm</td></tr>
      <tr><td class="p-3 border font-medium">重量（1m?あたり）</td><td class="p-3 border">850 ? 1,200 g</td><td class="p-3 border">1,100 ? 1,500 g</td></tr>
      <tr><td class="p-3 border font-medium">低温柔軟性</td><td class="p-3 border">-30&deg;C</td><td class="p-3 border">-20&deg;C</td></tr>
      <tr><td class="p-3 border font-medium">修理性</td><td class="p-3 border">簡単（熱溶接または接着剤）</td><td class="p-3 border">専用CSM接着剤が必要</td></tr>
      <tr><td class="p-3 border font-medium">接合方法</td><td class="p-3 border">RF溶接、熱風溶接</td><td class="p-3 border">手づめ（コンタクトセメント）</td></tr>
      <tr><td class="p-3 border font-medium">コスト（素材）</td><td class="p-3 border">$8 ?$15 / m&sup2;</td><td class="p-3 border">$20 ?$40 / m&sup2;</td></tr>
      <tr><td class="p-3 border font-medium">使用寿命（熱帯日光）</td><td class="p-3 border">5 ? 8年</td><td class="p-3 border">10 ? 15年</td></tr>
    </tbody>
  </table>

  <h2>どちらを選びますか？</h2>

  <h3>PVCを選ぶ場合：</h3>
  <ul>
    <li>予算が主な考慮事項である場合</li>
    <li>ボートを直射日光の当たらない場所に保管する場合</li>
    <li>重量が重要（PVCは15 ? 25%軽量）</li>
    <li>-20&deg;C以下の低温での柔軟性が必要な場合</li>
    <li>より広い色の選択肢が欲しい場合</li>
  </ul>

  <h3>Hypalonを選ぶ場合：</h3>
  <ul>
    <li>ボートを係留または直射日光の当たる場所に保管する場合</li>
    <li>熱帯または高UV環境にある場合</li>
    <li>最大の耐久性と使用寿命が優先事項である場合</li>
    <li>プロ用または商業用フリットを装備する場合</li>
    <li>砂、コンクリート、桟橋からの摩耗が懸念される場合</li>
  </ul>

  <h2>製造上の違い</h2>
  <p>PVCボートはRF（高周波）溶接または熱風溶接を使用して製造され、コーティング生地層の間に分子結合を形成します。これにより、高生産性の自動化された一貫した生産が可能になります。Hypalonボートはコンタクトセメントを使用した手づめで組立ます。各継手は手動でローリングおよびプレスされるため、Hypalon生産はより労働集約的です。</p>

  <h2>afarerのおすすめ</h2>
  <p>多くのレクリエーションユーザーにとって、UV安定剤配合の現代高品質PVCは、コスト、重量、性能、耐久性の最良のバランスを提供します。afarerは、コンシューマー用およびOEM製品ラインに1,680 DTEXの海洋用PVCを3層コーティングで使用しています。長時間のUV露出を必要とする商業・政府向けクライアントには、要望に応じてHypalon製造を提供しています。</p>

timeline:
  - year: '2012'
    title: '海洋製造の基盤'
    body: 'afarerは、中国・青島にあるインフレータブルウォータークラフト専門の工房としてスタートし、海洋職人技とゴムボート製造に注力しました。初期の焦点は、実践的なエンジニアリング経験と製造技術を活かして信頼性の高いインフレータブル製品を製造することでした。'
  - year: '2015'
    title: '初の輸出とCE認証'
    body: '最初の輸出注文は日本と韓国に届きました。主要製品ラインでCE認証を取得し、afarerの国際市場への参入を果たしました。中国国外の商業用およびレクリエーションユーザーへのサービスを開始しました。'
  - year: '2018'
    title: '工場拡張'
    body: '12,000 m²の生産施設に移転。RF溶着ラインとドロップステッチ生産能力を追加し、大規模製造と品質管理システムの向上を実現しました。'
  - year: '2020'
    title: '研究開発センター設立'
    body: 'PVCファブリックラボ、水力学試験水槽、CAD/FEAシミュレーションスタジオを備えた専用の研究開発センターを開設。軽量構造、耐久性向上、ユーザー中心設計に焦点を当てた製品開発を拡大しました。'
  - year: '2022'
    title: '認証取得とグローバル成長'
    body: 'ISO 9001認証を取得。研究開発エンジニア14名、従業員200名以上に拡大。欧州、南北アメリカ、アジア太平洋地域の顧客に、ディストリビューターおよびOEMパートナーシップを通じて製品を届けました。'
  - year: '2024'
    title: 'イノベーション＆デザインスタジオ'
    body: 'カスタムODMプロジェクト向けのフルサービスデザイン・イノベーションスタジオを立ち上げ、構想から生産までを一貫してサポート。救難、商業、政府調達などのプロフェッショナル海洋用途を強化しました。'
  - year: '2026'
    title: '水上探検の未来を築く'
    body: '今日、afarerはインフレータブルボート、SUPシステム、カスタマイズされた海洋ソリューションの開発を続け、人々と組織を世界中の水域と結びつけています。50カ国以上に展開し、年間15,000台以上の生産能力を誇ります。'

content_founding:
  tagline: 始まり
  title: '水辺に生まれて'
  subtitle: 'afarerは青島の沿岸工房で、1隻のボートと「本物の海洋環境に耐えるインフレータブルウォータークラフトを造る」というビジョンから始まりました。'
  paragraphs:
    - '2012年、創業者たちは市場にギャップを見出しました。ほとんどのゴムボートは手頃な価格だが信頼性に欠けるか、高品質だが非常に高価でした。両方を実現するメーカーが存在できると彼らは信じていました。'
    - '初めての船体は手作りで、地元の水域でテストされ、漁師や小規模な商業事業者からの実際のフィードバックに基づいて改良されました。「造る、テストする、聞く、改善する」というフィードバックループは、今も私たちのエンジニアリング哲学の中核です。'
    - '2015年までに、その評判は青島を超えて広がりました。海外のディストリビューターがサンプルを求めるようになりました。地元の工房として始まったものが、グローバルサプライヤーになりつつありました。'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarerの初期生産工房と製造の様子

content_growth:
  tagline: 成長とイノベーション
  title: '工房から12,000 m²の施設へ'
  subtitle: '人材、設備、プロセスへの継続的な投資により、afarerは現代的な海洋製造施設へと変貌を遂げました。'
  paragraphs:
    - '需要の増加に伴い、施設も拡大しました。小さな工房から、RIBボート、インフレータブルボート、SUPボード、アクセサリーの専用生産ラインを備えた12,000 m²の工場へと成長しました。'
    - 'CNC切断機、高周波溶着機、ドロップステッチ生産ライン、総合試験装置に投資し、生産品質のあらゆる側面を管理できるようになりました。'
    - '現在、200名以上のチームには、海洋エンジニア、材料科学者、品質管理スペシャリスト、熟練職人が含まれており、その多くが創業初期からafarerに在籍しています。'

philosophy:
  tagline: 'ブランド哲学'
  title: '水上の自由をエンジニアリングする'
  body: '水上の自由とは、単なる移動だけではありません。新しい場所を発見し、アウトドア体験を創り出し、人々を自然とつなげ、プロフェッショナルな任務を可能にすることです。エンジニアリングがその自由を実現します。'
  pillars:
    - title: '信頼性第一'
      body: '水上環境では信頼が不可欠です。afarerの製品は、安定性、耐久性、安全性、そして一貫した性能を基に設計されています。'
    - title: '人間中心設計'
      body: '製品は人々に奉仕すべきであり、テクノロジーに奉仕するものではありません。すべての設計判断は、人々がどのようにウォータークラフトを使い、どこを探検し、どのような課題に直面するかを理解することから始まります。'
    - title: 'アクセシブルな探検'
      body: '水は専門家だけのものではありません。afarerは、より多くの人々が安全に川、湖、海、沿岸環境を体験できるような装備を創り出します。'
    - title: '継続的イノベーション'
      body: 'イノベーションとは新製品を生み出すことだけではありません。材料、構造、製造、ユーザー体験のあらゆる細部を改善することです。'

engineeringDna:
  tagline: 'エンジニアリングDNA'
  title: 'afarerの製品開発の方法'
  areas:
    - title: '材料科学'
      body: 'afarerは、異なる海洋環境に適した材料の選定に注力しています。主な考慮事項には、耐摩耗性、耐UV性、圧力安定性、長期的な耐久性が含まれます。'
      items: ['耐摩耗性', '耐UV性', '圧力安定性', '長期的な耐久性']
    - title: '構造エンジニアリング'
      body: 'インフレータブルウォータークラフトには、剛性、重量、携帯性、安定性の正確なバランスが必要です。afarerのエンジニアリングは、ドロップステッチコア技術と高度なシーム構造を通じてこれらの要素の最適化に注力しています。'
      items: ['剛性', '重量最適化', '携帯性', '安定性']
    - title: '製造精度'
      body: 'すべての製品は、材料準備、精密切断、溶着と接着、組立、品質検査、性能検証という管理された工程を経ます。'
      items: ['材料準備', '精密切断', '溶着と接着', '組立と品質管理']
    - title: 'ユーザーシナリオエンジニアリング'
      body: '製品は実際の用途（レクリエーション、アドベンチャー、プロフェッショナル使用）に基づいて開発され、各設計が想定環境の特定の要求を満たすことを保証します。'
      items: ['レクリエーション', 'アドベンチャー', 'プロフェッショナル', '商業']


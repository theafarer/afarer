hero:
  tagline: 私たちのストーリー
  title: 'afarer — 水上の自由をエンジニアリングする'
  subtitle: '沿岸の工房から世界の海洋メーカーへ — 私たちの旅は、「ウォータークラフトは重要だからこそ、真剣にエンジニアリングされるべきだ」という揺るぎない信念に支えられています。'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 青島にあるafarerの工場と海洋製造施設


meta:
  title: SUPリテールパートナープログラム | {SITE}
  description: Become an Afarer retail partner. Full product line, professional marketing materials, dropshipping options, and competitive margins for SUP retailers.
hero:
  tagline: 小売パートナー
  title: Become An Afarer<br />Retail Partner
  subtitle: Sell the fastest-growing SUP brand in your market. Full product line, professional marketing materials, dropshipping options, and margins that make sense.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: 小売店にディスプレイされたAfarer SUPボード
margin_section:
  title: 小売マージン＆MOQ
  subtitle: 小売収益性を考慮した卸売価格体系。
  items:
    - tier: 基本パートナー
      discount: 20%
      moq: 500台/年
      margin_note: 1艇あたり約150〜250ドルの利益
      features:
        - 完全な製品ラインへのアクセス
        - マーケティング資材パッケージ
        - メールサポート
        - 製品カタログへのアクセス
    - tier: プレミアムパートナー
      discount: 30%
      moq: 2,000+台/年
      margin_note: 1ボードあたり約$250〜400の利益
      features:
        - 専任アカウントマネージャー
        - 独占エリア保護
        - カスタムマーケティングサポート
        - 新製品への優先アクセス
        - スタッフトレーニングセッション
    - tier: フラグシップパートナー
      discount: 35%以上
      moq: 5,000個以上/年
      margin_note: 1台あたり約$350〜500以上の利益
      features:
        - コブランドマーケティングキャンペーン
        - 店舗ディスプレイサポート
        - オンサイトスタッフトレーニング
        - ソーシャルメディア共同プロモーション
        - 優先生産割当
product_line:
  title: 完全な製品ライン
  subtitle: お店にお越しの全顧客にSUPボードを。
  items:
    - name: All-Round Series
      description: ベストセラー — 80%のお客様にフィット
    - name: Touring Series
      description: ハイパフォーマンスパドラー向け — 高い収益率
    - name: Yoga Series
      description: ニッチ市場 ― プレミアム価格設定
    - name: Kids Series
      description: ファミリーのお客様 — リピーター
    - name: Racing Series
      description: エンスージアスト市場 — ブランド効果
    - name: Accessories
      description: 高マージンオプション（パドル、ベスト、ポンプ、バッグ）
catalog:
  title: リテールパートナーリソース
  subtitle: 包括的な小売パートナーキットをダウンロード。
  items:
    - name: 2026 Product Catalog
      desc: 詳細な仕様、価格、注文情報を含む全ラインナップ
      icon: tabler:file-text
      link: /resources/download-catalog
    - name: Retail Partner Guide
      desc: 利益率計算ツール、マーチャンダイジングのコツ、ベストプラクティス
      icon: tabler:book
      link: /resources/download-catalog
    - name: Marketing Asset Pack
      desc: 高解像度製品写真、ライフスタイル画像、POS資材
      icon: tabler:photo
      link: /media
support:
  title: 小売パートナーサポート
  subtitle: 安心して販売するために必要なすべて。
  items:
    - 高解像度製品画像（プロの撮影）
    - SNS、ウェブサイト、カタログ向けライフスタイル写真
    - マーケティング資料 — ポスター、棚用ツール、バナー
    - スタッフ教育向け製品トレーニングビデオ
    - ソーシャルメディアコンテンツパック（週次投稿）
    - SEO最適化済み製品説明
    - ドロップシッピングオプションあり — 在庫リスクなし
    - Net 30支払い条件
cta:
  title: Ready to become a partner?
  subtitle: Apply for partnership or download our retail catalog.
  actions:
    - text: パートナーシップを申し込む
      href: /contact?partner=retail
      variant: primary
    - text: 小売カタログをダウンロード
      href: /resources/download-catalog
      variant: secondary

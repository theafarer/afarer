hero:
  tagline: 技術
  title: ドロップステッチの仕組み — イフレータブル剛性コアを支える技術
  subtitle: 読了時間 約8分
content_html: |
  <h2>ドロップスティッチとは？</h2>
  <p>ドロップスティッチ（「ドロップスティッチ生地」または「ドロップスティッチコア」とも呼ばれる）は、数千本のポリエステル糸が生地シェルの上下層を接続する構造方法です。シェルが膨張すると、これらの糸は内部の張力部材として機能し — 上下パネルが丸みを帯びて膨らむのを防ぎ、パネルを平坦で剛性のある状態に保ちます。</p>
  <p>その結果、15〜20 PSIの内部圧力に耐える軽量で携帯可能な構造が実現し — ハードシェルボードと同等の剛性を持ちながら、保管・輸送時は完全に空気を抜くことができます。</p>

  <h2>仕組み：物理学</h2>
  <p>従来のエア構造物（風船やエアマットレスなど）では、内部の空気圧があらゆる方向に等しく作用します。内部の拘束がない場合、構造物は円柱形または球形になります。ドロップスティッチは、引張補強を導入することでこの問題を解決します：</p>
  <ul>
    <li>数千本の糸が上下の生地層を接続</li>
    <li>膨張すると、空気圧が上下を押し広げようとする</li>
    <li>糸はこの分離に抵抗し、荷重を糸軸に沿った張力に変換</li>
    <li>結果として、曲がりに抵抗する平坦で剛性のあるパネルが得られる</li>
  </ul>

  <h2>製造工程</h2>
  <ol>
    <li><strong>織り：</strong>ポリエステル糸を2層の別々の基布（一般的に1,100 DTEXまたは1,680 DTEX PVCコートポリエステル）に同時に織り込みます。糸は90&deg;角度で層間をループ織りします。</li>
    <li><strong>コート：</strong>織り上がった基布にPVC（またはTPU）をナイフコートまたはカレンダーコート工程でコーティング。これにより糸が密封され、気密メンブレンが形成されます。</li>
    <li><strong>層間接着：</strong>ドロップスティッチコアを外装ラミネート層（一般的に0.9mmまたは1.2mm PVC）に加熱ラミネートまたは接着剤で接着。</li>
    <li><strong>溶接：</strong>レールバンドをホットエア溶接、RF溶接、または高周波溶接で縁に沿って溶接し、ボードの側壁を形成。</li>
    <li><strong>バルブ取付：</strong>ボストンバルブまたはHalkey-Robertsバルブを取付。通常、過充填防止のため圧力解放機構付き。</li>
  </ol>

  <h2>主要品質指標</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">パラメータ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">エントリーレベル</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">プレミアム</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">糸密度</td><td class="p-3 border">1糸/平方インチ</td><td class="p-3 border">2糸/平方インチ</td></tr>
      <tr><td class="p-3 border">基布</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">最大圧力</td><td class="p-3 border">12〜15 PSI</td><td class="p-3 border">18〜22 PSI</td></tr>
      <tr><td class="p-3 border">PVC厚さ</td><td class="p-3 border">0.6〜0.9 mm</td><td class="p-3 border">1.0〜1.2 mm</td></tr>
      <tr><td class="p-3 border">レール構造</td><td class="p-3 border">折り返し＆接着</td><td class="p-3 border">溶接＆フュージョンボンド</td></tr>
    </tbody>
  </table>

  <h2>用途</h2>
  <ul>
    <li><strong>SUPボード：</strong>4〜6インチ厚、15〜20 PSI、1〜2糸/平方インチ</li>
    <li><strong>カヤック：</strong>ドロップスティッチフロア＋エアサイドチェンバー、フロア10〜15 PSI</li>
    <li><strong>RIBフロア：</strong>軽量・折りたたみ可能なRIBテンダー用ドロップスティッチフロア、12〜18 PSI</li>
    <li><strong>船用フェンダー：</strong>平面を持つ成型フェンダー用の低圧ドロップスティッチ</li>
  </ul>

  <h2>ドロップスティッチ vs エアデッキ（ガラス繊維またはウッドコア）</h2>
  <p>ハードシェルボードはEPSフォームコアにガラス繊維またはウッドストリンガー補強を使用。より軽く、剛性が高く、レスポンスが優れている — しかし空気を抜くことはできません。ドロップスティッチは、剛性を若干犠牲にして完全な携帯性を実現。大多数のレジャーユーザーにとって、20 PSIの現代のドロップスティッチSUPは、エントリーレベルのハードボードと剛性の違いを感じません。</p>

  <h2>afarerのドロップスティッチ活用</h2>
  <p>afarerは、全SUPラインアップに1,680 DTEXドロップスティッチコアを使用し、1平方インチあたり2糸、1.2mm PVC外装ラミネートを採用。ボードは20 PSI定格で、出荷前に定格圧力の1.5倍で24時間の保持試験を実施。レールバンドは3層フュージョンのホットエア溶接で、圧力解放バルブは全モデルに標準装備。</p>

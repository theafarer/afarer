hero:
  tagline: テクノロジー
  title: 私たちのテクノロジー
  subtitle: afarer製品は、先進的な素材と革新的なエンジニアリングにより、卓越した性能、耐久性、携帯性を実現しています。
sections:
  - title: ドロップスチッチコア
    description: 何千もの内部ポリエステル糸が上下層をつなぎ、12〜15 PSIで剛性のある構造を形成します。これはプロ仕様のパドルボードおよびインフレータブルレーシングSUPに使用されるものと同じ技術です。
    imageAlt: DSコアダイアグラム
  - title: マリングレードPVC
    description: 海洋環境向けに評価された多層ラミネートPVC生地。各層は接着剤ではなく溶融溶接されており、層間剥離のリスクを排除。UV耐性、海水腐食、摩耗に対して試験済み。
    imageAlt: PVC層
  - title: 軍用グレードPVC
    description: 全SUPモデルに使用。プレミアムPVCは優れたUVおよび耐化学品性を提供。極端な温度でも柔軟性を維持し、劣化に強い。
    imageAlt: PVC
  - title: エアデッキフロア
    description: 高気圧インフレータブルドロップステッチ構造により、立ち漕ぎ、フィッシング、ヨガにおいて優れた剛性を実現。組み立て時間、総重量、保管容積を削減。
    imageAlt: エアデッキ

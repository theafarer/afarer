faqs_sup:
  title: SUPボードFAQ
  subtitle: 当社のスタンドアップパドルボードに関するよくある質問。
  columns: 2
  items:
    - title: どのようなSUPボードサイズがありますか？
      description: 9ftから12ftまでのSUPボードを提供しており、オールラウンド、ツーリング、ヨガ、スペシャルティデザインが含まれます。ベストセラーモデルにはTropical Breeze（10ft）とOcean Voyager（11ft）があります。
    - title: ドロップステッチ構造とは何ですか？
      description: ドロップステッチ構造は、ボードの上部と下部を接続する何千ものポリエステル糸を使用し、高気圧（15〜20 PSI）を保持して、剛性のある安定したプラットフォームを実現します。これはプレミアムインフレータブルSUPの業界標準です。
    - title: SUPボードの重量制限は？
      description: モデルと容量に応じて、最大150kgまでサポートします。Leviathan Wakeボードは、大柄なライダーとヨガ用に設計された最大容量モデルです。
    - title: 完全なSUPパッケージを提供していますか？
      description: はい。すべてのSUPボードには、3ピースアルミニウムパドル、高圧手動ポンプ、コイルリーシュ、トラベルバックパック、修理キットを含む完全なパッケージが同梱されます。一部のモデルには取り外し可能なフィンセットも含まれます。
    - title: SUPボードの保証は？
      description: すべてのアクアフェアラーSUPボードには、通常使用下でのシーム故障、バルブ欠陥、材料剥離を含む製造上の欠陥に対する1年保証が付いています。
    - title: SUPボードの膨張にはどのくらい時間がかかりますか？
      description: 付属の手動ポンプを使用して、15 PSIまでの完全膨張には約8〜12分かかります。より速い膨張には、4分未満でボードを膨張させるアクアフェアラー12V電動ポンプをお勧めします。
faqs_materials:
  title: SUP素材＆メンテナンスに関するFAQ
  subtitle: インフレータブルSUP素材、ケア、保管に関するよくある質問。
  columns: 2
  items:
    - title: アファラー インフレータブルSUPにはどのような素材が使用されていますか？
      description: 軍用グレードPVC（1100デニール）を採用し、UV安定化、耐摩耗性の高い構造で、EU REACHおよびRoHS規制に準拠しています。
    - title: インフレータブルSUPの耐用年数は？
      description: 適切な管理をすれば、高品質PVCエアSUPは5〜10年寿命が持ちます。定期的なクリーニング、UV保護、適切な保管により使用寿命を大幅に延長。
    - title: インフレータブルSUPにはどのようなメンテナンスが必要ですか？
      description: 基本的なメンテナンスには、使用後毎に淡水で洗浄すること（特に塩水使用後）、保管前の乾燥、年1回のバルブシール点検、使用しない際の長時間の日直射の回避が含まれます。
    - title: インフレータブルSUPは塩水で使用できますか？
      description: はい。すべてのafarerイフレータブルSUPは淡水と海水の両方で使用するように設計されています。海水にさらした後は、淡水で洗浄し、十分に乾燥させることを推奨します。
    - title: インフレータブルSUPの保管方法は？
      description: 保管前にボードの空気を完全に抜き、清掃し、十分に乾燥させてください。緩く巻いて（強く折りたたむのは避けて）、直射日光の当たらない涼しく乾燥した場所に保管し、コンクリート床には置かないで毛細管現象による吸湿を防いでください。
    - title: afarerエアインフレータブルSUPの重量容量はどのくらいですか？
      description: 耐荷重は最小モデルの100 kgから大型ボードの200 kg以上まで。各製品ページに特定モデルの最大積載量が記載されています。

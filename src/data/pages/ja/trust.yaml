faqs_rib:
  title: 'RIBボートFAQ'
  subtitle: '当社の硬質艇体インフレータブルボートに関するよくある質問。'
  columns: 2
  items:
    - title: 'アクアフェアラーはどのサイズのRIBボートを提供していますか？'
      description: '2.5mから7.6mまでの35のRIBモデルを提供しており、コンパクトテンダーからヘビーデューティー商業用およびパトロール用までをカバーしています。各モデルは複数の構成オプションで利用可能です。'
    - title: 'RIBと従来のインフレータブルボートの違いは何ですか？'
      description: 'SUP（硬質艇体インフレータブルボート）は、ソリッドなFRPまたはアルミニウムのディープVハルと、インフレータブルのハイパロンまたはPVCチューブを組み合わせたものです。これにより、ハードボートの安定性と積載能力に、インフレータブルの衝撃吸収と浮力を兼ね備えています。'
    - title: 'アクアフェアラーRIBにはどのようなエンジンが適合しますか？'
      description: 'モデルに応じて、3 HPから250 HPまでの船外機に対応しています。各製品ページに最大定格エンジン出力が記載されています。最適な組み合わせについては販売店にご相談ください。'
    - title: 'アクアフェアラーRIBはCE認証されていますか？'
      description: 'はい。すべてのレクリエーションRIBモデルは、レクリエーション用ウォータークラフトに関する該当する欧州基準に基づいてCE認証されています。商業用およびパトロール用モデルは、追加の安定性と負荷要件を満たしています。'
    - title: 'RIBボートの保証はどうなっていますか？'
      description: 'すべてのアクアフェアラーRIBには、ハル剥離、チューブシーム故障、バルブ欠陥、ハードウェア問題をカバーする標準1年製造物責任保証が付いています。'
    - title: 'アクアフェアラーRIBにはいくつのエアチャンバーがありますか？'
      description: 'モデルの長さに応じて、3〜7つの独立したエアチャンバーを備えています。このマルチチャンバー設計により、1つの区画が損傷してもボートが浮いたままであることが保証されます。'

faqs_inflatable:
  title: 'インフレータブルボートFAQ'
  subtitle: '当社のインフレータブルディンギー、カヤック、ボートに関するよくある質問。'
  columns: 2
  items:
    - title: 'アクアフェアラーのインフレータブルボートにはどのような材料が使用されていますか？'
      description: 'モデルに応じて、ミリタリーグレードのPVC（1100デニール）とプレミアムハイパロン/CSMゴムを使用しています。両方の材料はUV安定化、耐摩耗性があり、EU REACHおよびRoHS規制に準拠しています。'
    - title: 'インフレータブルボートの寿命はどのくらいですか？'
      description: '適切なケアにより、高品質のPVCインフレータブルボートは7〜10年、ハイパロンモデルは15〜20年持続します。定期的な洗浄、UV保護、適切な保管により、使用寿命が大幅に延びます。'
    - title: 'インフレータブルボートにはどのようなメンテナンスが必要ですか？'
      description: '基本的なメンテナンスには、使用後の真水でのすすぎ（特に塩水の場合）、保管前の乾燥、バルブシールの年次点検、チューブへのUVプロテクタントの塗布が含まれます。未使用時は長時間の日光への露出を避けてください。'
    - title: 'インフレータブルボートは塩水で使用できますか？'
      description: 'はい。すべてのアクアフェアラーインフレータブルボートは淡水と塩水の両方での使用向けに設計されています。塩水にさらした後は、真水ですすぎ、十分に乾燥させて、金具の腐食やファブリックの塩の結晶化を防ぐことをお勧めします。'
    - title: 'インフレータブルボートはどのように保管すればよいですか？'
      description: '保管前に完全に空気を抜き、洗浄し、乾燥させてください。ゆるく丸め（きつい折り目を避ける）、直射日光の当たらない涼しく乾燥した場所に保管し、湿気の吸い上げを防ぐためにコンクリートの床から離してください。'
    - title: 'アクアフェアラーインフレータブルボートの重量容量は？'
      description: '最小モデルで290kgから大型商業用クラフトで2,000kg超までの重量容量があります。各製品ページに特定のモデルの最大負荷定格が記載されています。'

faqs_sup:
  title: 'SUPボードFAQ'
  subtitle: '当社のスタンドアップパドルボードに関するよくある質問。'
  columns: 2
  items:
    - title: 'どのようなSUPボードサイズがありますか？'
      description: '9ftから12ftまでのSUPボードを提供しており、オールラウンド、ツーリング、ヨガ、スペシャルティデザインが含まれます。ベストセラーモデルにはTropical Breeze（10ft）とOcean Voyager（11ft）があります。'
    - title: 'ドロップステッチ構造とは何ですか？'
      description: 'ドロップステッチ構造は、ボードの上部と下部を接続する何千ものポリエステル糸を使用し、高気圧（15〜20 PSI）を保持して、剛性のある安定したプラットフォームを実現します。これはプレミアムインフレータブルSUPの業界標準です。'
    - title: 'SUPボードの重量制限は？'
      description: 'モデルと容量に応じて、最大150kgまでサポートします。Leviathan Wakeボードは、大柄なライダーとヨガ用に設計された最大容量モデルです。'
    - title: '完全なSUPパッケージを提供していますか？'
      description: 'はい。すべてのSUPボードには、3ピースアルミニウムパドル、高圧手動ポンプ、コイルリーシュ、トラベルバックパック、修理キットを含む完全なパッケージが同梱されます。一部のモデルには取り外し可能なフィンセットも含まれます。'
    - title: 'SUPボードの保証は？'
      description: 'すべてのアクアフェアラーSUPボードには、通常使用下でのシーム故障、バルブ欠陥、材料剥離を含む製造上の欠陥に対する1年保証が付いています。'
    - title: 'SUPボードの膨張にはどのくらい時間がかかりますか？'
      description: '付属の手動ポンプを使用して、15 PSIまでの完全膨張には約8〜12分かかります。より速い膨張には、4分未満でボードを膨張させるアクアフェアラー12V電動ポンプをお勧めします。'


meta:
  title: '見積もり依頼 — OEM SUP生産 | {SITE}'
  description: 'インフレータブルSUPまたはボートプロジェクトの詳細な見積もりを依頼してください。OEM/ODM生産、プライベートブランド、特注フリート — 2営業日以内に返信します。'
  keywords:
    - 'SUP見積もり依頼'
    - 'OEMパドルボード見積もり'
    - 'SUP工場見積もり'
    - 'インフレータブルSUP価格'
hero_text:
  tagline: お見積りを依頼する
  title: プロジェクトの見積もりをリクエスト<br />
  subtitle: お客様の要件についてお知らせください。当社のチームが 2 営業日以内に詳細な見積もりを返信いたします。
steps2_process:
  title: 仕組み
  subtitle: お問い合わせからお見積りまでの簡単4ステップ。
  items:
    - title: ステップ1：ご要件を提出
      description: 以下のフォームに製品の種類、数量、仕様をご記入ください。 より詳細に提供するほど、見積もりはより正確になります。
      icon: tabler:file-text
    - title: ステップ2：レビューとアドバイス
      description: 当社のエンジニアリング チームがお客様の要件を検討し、説明のためご連絡させていただく場合があります。 製品構成やオプションに関する推奨事項を提供します。
      icon: tabler:users
    - title: ステップ3：お見積りを受け取る
      description: 単価、MOQ、リードタイム、支払い条件、配送オプションを含む詳細な見積もりが届きます。 通常は 48 時間以内です。
      icon: tabler:currency-dollar
    - title: ステップ4：サンプル及び量産
      description: 見積もりの​​承諾後、サンプル生産 (該当する場合) または直接量産に進みます。 プロセス全体を通じて定期的に更新。
      icon: tabler:building-factory
content_form:
  tagline: 見積フォーム
  title: あなたのプロジェクトについて教えてください
  subtitle: '* が付いているフィールドはすべて必須です。'
  contact_fields:
    firstName: 名
    lastName: 姓
    companyName: 会社名
    email: メールアドレス
  fields:
    - name: 製品カテゴリ
      type: select
      options:
        - SUPボード
        - インフレータブルSUP
        - インフレータブルSUPボード
        - ライフジャケット
        - マリンアクセサリー
        - カスタムOEM／ODM
    - name: 用途
      type: select
      options:
        - ダイビングセンター
        - フィッシング
        - マリンツーリズム / リゾート
        - 捜索・救助
        - ヨットテンダー
        - 商用作業船
        - 官公庁・軍事
        - OEM／プライベートレーベル
        - 個人・レジャー用
        - その他
    - name: 数量
      type: text
      placeholder: 例：50個
    - name: ターゲット市場
      type: text
      placeholder: 例：ヨーロッパ、北米、中東
    - name: 納品先国
      type: text
      placeholder: 例：イタリア、UAE、アメリカ、オーストラリア
    - name: 希望材質
      type: select
      options:
        - 指定なし
        - マリングレードPVC（1100デニール）
        - Premium Hypalon / CSM
        - ガラス繊維強化プラスチック船体
        - アルミニウム船体
    - name: エンジン要件
      type: text
      placeholder: 例：60馬力外付、エンジンなし、ツイン115馬力
    - name: カスタマイズ内容
      type: text
      placeholder: '例: カスタムカラー、ブランド/ロゴ、パッケージ、特殊フィッティング'
    - name: 納期
      type: text
      placeholder: 例：90日以内に納品
    - name: 追加要件
      type: textarea
      placeholder: アプリケーション、技術仕様、または特別な要件を記述してください — 参考図面、仕様書、リンクがあれば添付してください
    - name: 仕様書のアップロード
      type: file
      placeholder: 仕様書、図面、参考資料（PDF、DWG、DXF）をアップロード
    - name: ロゴ／アートワークのアップロード
      type: file
      placeholder: カスタムブランディング用のロゴまたはアートワークをアップロード（AI、EPS、PNG）
cta:
  title: メールでご相談されますか？
  subtitle: お問い合わせを営業チームにお送りいただくと、24時間以内にご回答いたします。
  actions:
    - variant: primary
      text: 直接電子メールで連絡
      href: /contact

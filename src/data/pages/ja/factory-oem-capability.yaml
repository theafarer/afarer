why_us:
  - title: 垂直統合
    description: 当社は自社工場、金型、サプライチェーンをすべて保有しており、中間業者や外注は一切ありません。これにより、品質・コスト・納期を完全にコントロールしています。
  - title: 二重認証
    description: ISO 9001品質管理およびBSCI社会的コンプライアンス認証。工場監査報告書はご要請に応じて提供可能。
  - title: CE適合
    description: 全標準モデルはCE 2013/53/EU認証を取得済み。カスタムモデルは弊社確立のプロセスによりCE認証が可能です。
  - title: 低MOQ
    description: 標準モデルは最小5台からご注文可能です。新興ブランドが在庫を過剰に抱えずにスタートできるよう支援します。

services:
  - title: 製品設計＆エンジニアリング
    description: 当社の社内R&Dチームがお客様のコンセプトや仕様に基づき、CAD図面、3Dモデル、プロトタイプを開発します。金型設計、船体形状の最適化、素材選定のアドバイスも提供いたします。
  - title: カスタムブランド＆グラフィックス
    description: フルカラーデジタル印刷、スクリーン印刷、エンボス、ラベルオプション。ブランド専用デッキグラフィック、チューブブランディング、小売向けパッケージを開発します。
  - title: 素材・仕様のカスタマイズ
    description: PVC（標準・環境配慮型・難燃性）、Hypalon/CSM、ドロップスティッチ、ハイブリッド構造からお選びいただけます。チューブカラー、生地重量、補強オプションをカスタマイズ可能です。
  - title: パッケージング＆ロジスティクス
    description: カスタム小売包装、プライベートレーベルボックス、真空パック、パレタイジング、コンテナ積み込み。FOB青島、CIF、またはDDP発送条件に対応。

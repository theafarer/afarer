hero:
  tagline: OEM/ODM 製造
  title: OEM＆プライベートレーベル製造
  subtitle: From concept to container —customize every detail of your inflatable watercraft line
intro: afarerは、世界中のブランド、ディストリビューター、政府機関に包括的なOEMおよびODMサービスを提供しています。10年以上の輸出実績と12,000 m²のISO 9001およびBSCI認定工場を備え、製品設計や金型開発から大量生産、パッケージング、物流まで全てを対応。

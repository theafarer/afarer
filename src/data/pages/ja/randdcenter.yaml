rd_services:
  tagline: カスタムR&D
  title: パートナー向けR&Dサービス
  services:
    - title: カスタム素材開発
      desc: お客様の運用環境と性能目標に合わせた、カスタム生地仕様、ラミネート積層、接着剤システムを開発します。
    - title: OEM / ODM製品エンジニアリング
      desc: お客様の運用環境と性能目標に合わせた、カスタム生地仕様、ラミネート積層、接着剤システムを開発します。
    - title: 第三者試験＆認証
      desc: ISO準拠の試験施設を活用した独立材料試験、製品検証、および認証サポート。
  cta: R&Dご要望を相談する →
  cta_link: /contact
vision:
  tagline: 私たちのビジョン
  title: ウォータースポーツの未来を形に
  body: afarerは、継続的なイノベーション、揺るぎない品質、安全と持続可能性への確固たる献通を通じて、エアボートおよびSUP業界のリーダーとなるよう努めています — 世界中のウォータースポーツ愛好家の体験を豊かにします。afarer R&Dセンターは、情熱とイノベーションが出会い、ウォータースポーツ業界の新しい基準を確立する場所です。
labs_section:
  tagline: ラボ
  title: 当社の試験所
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC布帛ラボ
      description: PVC及びHypalonチューブ生地について、引張強度、UV耐性、耐摩耗性、低温柔軟性を継続的に研究・試験し、海洋環境での長期信頼性を確保しています。
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 船体エンジニアリングスタジオ
      description: CAD駆動設計とHDPE、アルミニウム、ガラス繊維強化プラスチック船殻の有限要素解析。すべての船殻は、初の試作船建造前に、応力分布と衝撃耐性についてデジタルシミュレーションされます。
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: RF溶接センター
      description: 精密な温度・圧力制御を備えた専用高周波溶接設備。船舶業界基準を満たす高強度・気密性の高いシームを製造します。
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 流体力学的試験槽
      description: 社内の試験水槽でスケールモデル試験を行い、船体形状、プランニング性能、安定性、燃費効率を、さまざまな負荷条件および海況にわたって最適化します。
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      title: プロトタイプ工房
      description: 新モデルを建造、装備、海上試験する本格プロトタイプ＆装備施設。生産承認前に全プロトタイプが最低20時間の水中試の水中試験プログラムを経ます。
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 品質＆検査ラボ
      description: 引張試験、空気保持サイクル試験、シーム剥離試験、素材認証を実施する専門品質保証ラボ。工場を出る全てのボートが公開仕様を満たすよう品質を担保しています。
      href: /randdcenter/quality-inspection-lab

meta:
  title: 研究開発センター｜{SITE}
  description: 研究開発 — PVC生地試験、船体エンジニアリング、RF溶接、流体力学試験、品質管理。カスタムR&Dサービスも対応。
hero:
  tagline: R&Dセンター
  title: R&Dセンター
  subtitle: 進歩に注力
intro:
  - afarerの研究開発（R&D）センターは、ウォータースポーツ機器を革新するという私たちの使命を推進する原動力です。インフレータブルスタンドアップパドルボード（SUP）およびボートにおける絶え間ない革新を通じて、より安全で快適、より楽しい製品を世界中のウォータースポーツ愛好者に提供しています。熱意あるエンジニア、デザイナー、ウォータースポーツ専門家からなるチームが業界の未来を形づくり、品質、性能、持続可能性の基準を不断に引き上げています。
  - 当社のR&D施設は、材料科学者、航海建築家、生産エンジニアを一つの場所に集めています。生地の処方から船殻シミュレーション、溶接プロセスの開発、フルスケール海上試験まで、製品開発の各段階はデータに基づき、試験で検証されています。
mission:
  tagline: 私たちの使命
  title: ウォータースポーツの未来を革新する
  pillars:
    - icon: lightning
      title: 技術進歩
      desc: 優れた製品性能と耐久性のための新素材、デザイン、製造の先駆的開発。
    - icon: design
      title: ユーザー中心設計
      desc: エルゴノミクスで直感的な製品設計を通じ、ユーザーのニーズを深く理解し、それを超える製品を提供します。
    - icon: globe
      title: サステナブルな取り組み
      desc: 環境に優しい素材と工程を活用し、環境負荷を最小化。
    - icon: shield
      title: 妥協なき安全
      desc: 厳格な試験と認証を通じて、最高水準の安全性を確保。
pillars:
  - title: 技術進歩
    desc: 優れた製品性能と長寿命を実現するため、新素材・新設計・新製造プロセスを先导しています。
    icon: tech
  - title: 先進材料
    desc: 製品特性の向上のため、最先端のPVC、Hypalon、コンポジット、持続可能な代替素材を研究開発しています。
    icon: materials
  - title: サステナビリティ
    desc: 中核的コミットメント：持続可能な製造とリサイクル可能な素材を通じて、環境管理に全力を注いでいます。
    icon: sustainability
capabilities:
  tagline: 能力
  title: R&D能力
  subtitle: 原材料研究から最終認証まで、製品開発をエンドツーエンドで管理する4つのコアディシプリン。
  groups:
    - title: 材料科学＆生地テクノロジー
      items:
        - PVCおよびHypalonの配合分析・最適化
        - UV安定化、耐炎性、抗微生物添加剤の開発
        - マルチレイヤー生地ラミネーションと接着技術
        - 加速経年試験（UV、日熱、湿度、塩水噴霧）
    - title: 船殻工学と流体力学
      items:
        - パラメトリック3D船体設計＆CFD最適化
        - 構造・衝撃荷重に対する有限要素解析
        - スケールモデルの曳航水槽試験および性能検証
        - 特殊ミッションプロファイル向けカスタム船体開発
    - title: 溶接・接合技術
      items:
        - RF誘電溶接プロセスの開発と最適化
        - ホットエア、ホットウェッジ、超音波溶接方式
        - 接着接合およびシームテープの認定
        - 溶接強度モデリングと寿命予測
    - title: 試験、認証、適合
      items:
        - 品質管理およびCE適合性試験
        - 独立した第三者による試験および認証サポート
        - 調達適格審査向けカスタム試験プロトコルの開発
        - 運用中の障害分析および根本原因調査

meta:
  title: '工場設備 — カット、HF溶着、プリント | {SITE}'
  description: 'afarerの産業用生産設備：PVCカット、HF溶着、デジタルプリント、組み立て、インフレータブルSUPボード・ボートのテスト。'
  keywords:
    - 'SUP生産設備'
    - 'インフレータブルSUP工場'
    - 'HF溶着PVC'
    - 'パドルボード生産'
hero:
  tagline: 設備
  title: 製造装置および機械
  subtitle: 切断、溶接、印刷、組立に対応する工業グレードの装置
  back_label: 工場に戻る
  back_link: /factory
categories:
  - title: 切断と素材準備
    items:
      - name: 自動PVC切断機
        spec: CNC制御、6.5 m × 2.5 m、0.1 mm精度
        desc: PVC、Hypalon、drop-stitch生地用のコンピュータ制御自動切断機。ネスティングソフトウェアが材料利用率を5%未満の廃棄に最適化します。
      - name: 生地広げ機
        spec: 最大幅3 m、テンション制御給送
        desc: 切断前の歪みを防ぐため、制御されたテンションで単層または多層の生地を敷設します。
  - title: チューブ溶接と接合
    items:
      - name: ヒートシール機
        spec: 熱風溶接、可変200–600 °C、0.5–5 m/min
        desc: PVCおよびHypalonチューブシームの接合および溶接用の熱風熱シール機。チューブチャンバーやフロート継手の仮止め、シール、融着に使用します。
      - name: 誘電RFプレス
        spec: 15 kW、プラテン2000 × 600 mm
        desc: 主縦シーム、トランサム-チューブ継手、大型チャンバー製造用の高周波溶接プレス。
      - name: CNC制御RF溶接機
        spec: 8 kW、XYテーブル2500 × 1200 mm
        desc: 複雑な形状、ロゴエンボス、精密パッチのためのプログラム可能な曲線シーム溶接。
  - title: RIBハル製造
    items:
      - name: ドロップステッチコア積層プレス
        spec: 14ft LOAまでのボードコア用大形式プレス
        desc: ドロップステッチコアを外側PVCラミネートに精密にラミネート。各層は圧着接合により一貫した品質と強度を確保。
      - name: CNC Router (5-axis)
        spec: 3m × 2m × 1mエンベロップ、水冷式 spindle
        desc: フィンボックス、ハンドル切り欠き、カスタムボード部品の加工。
  - title: SUP印刷と装飾
    items:
      - name: デジタルプリンタ
        spec: 高解像度インクジェット、印刷幅最大2 m
        desc: フルカラーSUPデッキグラフィック用の直接布地デジタル印刷。UV耐性の水性インクでカスタムパターン、グラデーション、写真品質の画像を印刷します。
      - name: シルクスクリーン印刷機
        spec: 手動および半自動、多色登録
        desc: SUPボードロゴ、ブランドマーク、繰り返しパターン用のシルクスクリーン。鮮やかな色彩で耐久性があり不透明な印刷を提供します。
  - title: 組立と艤装
    items:
      - name: Board Assembly Station
        spec: モジュラー調整式マルチステーションレイアウト
        desc: SUPボードへのフィンボックス、ハンドル、Dリング、バルブ、デッキパッドの組立。
      - name: バルブ取り付けプレス
        spec: エア式、調整可能圧力
        desc: Halkey-RobertsおよびLeafieldバルブの精密取り付けとシール。
      - name: Deck Pad Laminator
        spec: 3m × 1.5m、温度管理
        desc: 均一な接合強度でEVAフォームデッキパッドをSUPボードトップ面にヒートラミネーション。
  - title: 試験と品質管理
    items:
      - name: 万能引張試験機
        spec: 50 kN, ASTM D751
        desc: 布地ロットの破断力、破断伸び、引き裂き伝播試験。
      - name: 空気保持試験台
        spec: プログラマブル、30分圧力保持
        desc: 組立前の各チューブチャンバーの自動圧力保持試験。
      - name: シーム剥離試験機
        spec: モーター式180°剥離、100 mm/min
        desc: ISO 6185に準拠した溶接および接着シームの剥離強度試験。
      - name: キセノンアーク耐候試験機
        spec: 2000 h曝露
        desc: 変色と強度維持のためのUV耐性試験。

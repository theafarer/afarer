meta:
  title: Where to Buy Afarer Inflatable Paddle Boards | Afarer
  description: Find out how to buy an Afarer inflatable paddle board — through an official distributor in your country or directly from the Afarer team. Tell us where you paddle and we will point you to your nearest dealer.
hero:
  tagline: Where to Buy
  title: Get Your Afarer SUP on the Water
  subtitle: Afarer boards reach paddlers in 50+ countries. Find the simplest way to get yours — through an official distributor near you or directly from the Afarer team.
channels:
  items:
    - title: Official Country Distributors
      description: Afarer works with exclusive distributors in many countries. Tell us where you paddle and we will connect you with your local dealer, pricing, and availability.
      cta: Find Your Local Dealer
      href: /contact/?subject=Where to Buy
    - title: Order Direct from Afarer
      description: No distributor in your country yet? The Afarer team can arrange direct orders and shipping so you can get on the water wherever you live.
      cta: Request Availability
      href: /contact/?subject=Where to Buy
form_intro:
  title: Ask About Availability
  subtitle: Send us a message with your country and the board you are interested in. Our team will reply within one business day with your nearest dealer or direct-order options.
business_note:
  text: Buying for a club, resort, or store? Explore our business and partnership programs.
  cta: For Business Partners
  href: /solutions/

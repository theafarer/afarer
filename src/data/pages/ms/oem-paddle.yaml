faqs:
  title: 'FAQ Pengeluaran Dayung OEM'
  subtitle: 'Jawapan kepada soalan paling biasa daripada jenama yang melancarkan dayung mereka sendiri.'
  items:
    - title: 'Bagaimana saya mencipta jenama dayung saya sendiri?'
      description: 'Lancarkan jenama anda dalam 16 minggu: ringkasan, reka bentuk, prototaip tersijil CE, pengeluaran pukal, dan penghantaran. Terokai pakej OEM kami.'
    - title: 'Berapakah tempoh pengeluaran?'
      description: 'Sampel sedia dalam 2-3 minggu, pengeluaran pukal dalam 30-45 hari bergantung pada jumlah.'
    - title: 'Adakah dayung itu membawa logo kami?'
      description: 'Ya — label peribadi yang penuh: percetakan logo, warna tersuai, pembungkusan, dan label dengan jenama anda.'
    - title: 'Bolehkah saya membeli secara pukal sejak hari pertama?'
      description: 'MOQ ialah 50 unit untuk model standard, dengan tahap harga borong apabila jumlah meningkat.'

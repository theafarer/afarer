meta:
  title: 'Akademi — Panduan SUP & Latihan Dayung | {SITE}'
  description: 'Akademi afarer: panduan papan dayung boleh tiup, teknik stand up paddle, keselamatan nautika, dan pengetahuan bahan untuk pemula dan profesional.'
  keywords:
    - 'belajar stand up paddle'
    - 'panduan pemula sup'
    - 'asas papan dayung'
    - 'teknik sup'
    - 'pelajaran sup'
hero:
  tagline: 'Akademi afarer'
  title: 'Pusat Pembelajaran'
  subtitle: 'Panduan dan tutorial untuk setiap tahap kemahiran — daripada asas SUP sehingga teknik penyelamatan lanjutan'

categories:
  - level: 'Pemula'
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: 'Asas SUP'
        desc: 'Ketahui asas-asas stand-up paddleboarding — postur berdiri, teknik kayuhan, dan keseimbangan.'
        slug: beginner-sup-guide
      - title: 'Teknik Dayung'
        desc: 'Kayuhan ke hadapan, kayuhan sapuan, kayuhan tarikan, dan sokongan rendah — kuasai pergerakan dayung yang penting.'
        slug: sup-paddle-guide
      - title: 'Keselamatan Didahulukan'
        desc: 'Amalan keselamatan penting termasuk semakan cuaca, penggunaan PFD, peraturan tali pinggang, dan penyelamatan diri.'
        slug: sup-safety-guide
  - level: 'Pertengahan'
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: 'Asas Touring'
        desc: 'Merancang dayungan berjam-jam — navigasi, penghidratan, penentuan rentak, dan membaca ramalan angin.'
        slug: touring-sup-guide
      - title: 'Membaca Cuaca'
        desc: 'Tafsirkan ramalan marin, kenal pasti corak awan, dan fahami kesan angin ke atas air.'
        slug: weather-planning-water-sports
      - title: 'Asas Navigasi'
        desc: 'Pembacaan carta, penggunaan kompas, titik jalan GPS, dan perancangan laluan untuk dayungan pesisir.'
        slug: sup-navigation-guide
      - title: 'Kesedaran Air Pasang Surut'
        desc: 'Memahami kitaran pasang surut, arus, dan bagaimana ia mempengaruhi masa pelancaran dan pemilihan laluan.'
        slug: understanding-tides
  - level: 'Lanjutan'
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: 'Perancangan Perjalanan Berbilang Hari'
        desc: 'Logistik ekspedisi — pemilihan kelengkapan, perancangan makanan, protokol keselamatan, dan kenalan kecemasan.'
        slug: sup-travel-guide
      - title: 'Teknik Penyelamatan'
        desc: 'Penyelamatan diri, penyelamatan-T, dan protokol penundaan untuk perairan terbuka.'
        slug: sup-self-rescue
      - title: 'Dayungan Malam'
        desc: 'Navigasi selepas gelap — keperluan pencahayaan, ingatan laluan, komunikasi kumpulan, dan kesedaran bahaya.'
        slug: ocean-safety-basics
  - level: 'Penyelenggaraan'
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: 'Pencucian & Penjagaan'
        desc: 'Membilas dengan air tawar, perlindungan UV, pencegahan kulat, dan teknik pengeringan yang betul selepas setiap sesi.'
        slug: inflatable-sup-maintenance
      - title: 'Panduan Penyimpanan'
        desc: 'Amalan terbaik untuk menyimpan papan SUP boleh tiup — pengekempisan, pelipatan, kawalan suhu, dan jangka hayat simpanan.'
        slug: inflatable-sup-storage
      - title: 'Asas Pembaikan'
        desc: 'Baiki tusukan kecil, kebocoran jahitan, dan masalah injap dengan kit pembaikan PVC dan teknik tampalan.'
        slug: inflatable-sup-repair
      - title: 'Penyelenggaraan Injap'
        desc: 'Kenal pasti jenis injap (Halkey-Roberts, Boston, Leafield), bersihkan kotoran, dan gantikan batang yang rosak.'
        slug: sup-pump-guide

knowledge_center_tagline: 'Pusat Pengetahuan'
knowledge_center_title: 'Panduan Peralatan Marin & Industri'
knowledge_center_subtitle: 'Pengetahuan pakar dan panduan pembelian untuk profesional marin, pengendali armada, dan peminat sukan air.'

knowledge_sections:
  - title: 'Pengetahuan Papan SUP'
    tagline: 'Panduan Papan Stand-Up'
    desc: 'Semua tentang papan SUP — reka bentuk papan, bahan, pemilihan saiz, penyelenggaraan, dan nasihat pembelian untuk penggunaan rekreasi dan komersial.'
    guides:
      - title: 'Cara Memilih Papan SUP yang Betul'
        desc: 'Panduan lengkap memilih SUP — saiz, isipadu, bahan, bentuk, dan kegunaan yang dirancang.'
        href: '/learn/sup'
      - title: 'SUP Boleh Tiup vs SUP Keras'
        desc: 'SUP boleh tiup vs papan epoksi keras — keportabilitaan, ketahanan, prestasi, dan nilai dibandingkan.'
        href: '/compare/inflatable-vs-hardboard'
      - title: 'SUP All-Around vs Touring vs Yoga'
        desc: 'Jenis papan SUP yang berbeza — piawaian pembinaan, bentuk, saiz, dan kegunaan yang disyorkan.'
        href: '/learn/sup'
      - title: 'Drop-Stitch vs Pembinaan Tradisional'
        desc: 'Bandingkan pembinaan drop-stitch dan tradisional untuk papan SUP dari segi berat, kos, ketahanan, dan kekakuan.'
        href: '/learn/drop-stitch-core'
  - title: 'Panduan SUP Boleh Tiup'
    tagline: 'Pengetahuan SUP Boleh Tiup'
    desc: 'Panduan menyeluruh tentang SUP boleh tiup — bahan PVC, pembinaan drop-stitch, piawaian keselamatan, dan amalan penyelenggaraan terbaik.'
    guides:
      - title: 'Panduan Bahan PVC'
        desc: 'Panduan muktamad untuk bahan PVC yang digunakan dalam pembinaan papan SUP boleh tiup.'
        href: '/learn/materials'
      - title: 'Bagaimana SUP Boleh Tiup Dibuat'
        desc: 'Proses pembuatan — pemotongan bahan, pengikatan teras drop-stitch, pembinaan jahitan, ujian tekanan, dan kawalan kualiti.'
        href: '/learn/inflatable-technology'
      - title: 'Panduan Keselamatan SUP'
        desc: 'Piawaian keselamatan, kapasiti beban, pentidakkan yang betul, semakan sebelum berlepas, dan prosedur kecemasan.'
        href: '/learn/water-safety'
      - title: 'Penyelenggaraan SUP'
        desc: 'Pencucian, penyimpanan, perlindungan UV, dan pembaikan papan SUP boleh tiup.'
        href: '/v2/inflatable-sup-maintenance'
  - title: 'Pengetahuan Papan SUP'
    tagline: 'Hab Papan SUP'
    desc: 'Panduan teknikal merangkumi jenis papan SUP, bahan, kaedah pembinaan, penyelenggaraan, dan keselamatan.'
    guides:
      - title: 'Jenis Papan SUP'
        desc: 'SUP all-around, touring, yoga, sukan, dan kanak-kanak — ketahui perbezaannya dan pilih yang betul.'
        href: '/learn/sup'
      - title: 'Teknologi Drop-Stitch'
        desc: 'Bagaimana beribu-ribu benang dalaman mencipta struktur boleh tiup yang kaku dan bertekanan tinggi.'
        href: '/learn/drop-stitch-core'
      - title: 'Rujukan Bahan'
        desc: 'Penarafan denier PVC, berat fabrik, rintangan UV, dan bahan gred marin diterangkan.'
        href: '/learn/materials'
      - title: 'Panduan Pembelian SUP'
        desc: 'Bandingkan jenis papan SUP yang berbeza untuk kes penggunaan dan tahap kemahiran yang berbeza.'
        href: '/learn/sup'
  - title: 'Pengetahuan SUP'
    tagline: 'Panduan Papan Stand-Up'
    desc: 'Semua tentang papan SUP — boleh tiup vs kaku, dimensi papan, teknologi bahan, dan nasihat pakar untuk semua tahap kemahiran.'
    guides:
      - title: 'SUP Boleh Tiup vs SUP Keras'
        desc: 'Bandingkan iSUP dan papan epoksi keras dari segi keportabilitaan, ketahanan, prestasi, dan nilai.'
        href: '/learn/sup'
      - title: 'Panduan Dimensi Papan SUP'
        desc: 'Bagaimana panjang, lebar, dan ketebalan mempengaruhi kestabilan, kelajuan, dan kebolehkendalian.'
        href: '/learn/sup'
      - title: 'Penyelenggaraan & Penjagaan SUP'
        desc: 'Tip pencucian, penyimpanan, perlindungan UV, dan pembaikan untuk papan SUP boleh tiup.'
        href: '/v2/inflatable-sup-maintenance'
      - title: 'Memilih SUP Pertama Anda'
        desc: 'Panduan pemula untuk memilih papan stand-up yang betul mengikut berat badan, tahap kemahiran, dan kegunaan yang dirancang.'
        href: '/learn/sup'
  - title: 'Panduan Operasi Sewaan'
    tagline: 'Pengurusan Armada untuk Perniagaan Sewaan'
    desc: 'Panduan membina dan menguruskan armada sewaan SUP untuk kios pantai, pusat sukan air, dan premis perhotelan.'
    guides:
      - title: 'Membina Armada Sewaan Anda'
        desc: 'Cara memilih papan SUP yang betul untuk operasi sewaan anda — ketahanan, pensaizan, dan pertimbangan ROI.'
        href: '/solutions/rental-operators'
      - title: 'Panduan Penyelenggaraan Armada'
        desc: 'Amalan penyelenggaraan penting untuk memaksimumkan jangka hayat papan dan meminimumkan masa henti bagi armada sewaan.'
        href: '/solutions/rental-operators'
  - title: 'Panduan Resort & Perhotelan'
    tagline: 'Aktiviti Air untuk Perhotelan'
    desc: 'Panduan melancarkan dan menguruskan program SUP untuk resort, hotel, dan destinasi tepi air.'
    guides:
      - title: 'Memulakan Program SUP Resort'
        desc: 'Faktor yang perlu dipertimbangkan semasa melancarkan aktiviti SUP tetamu — pensaizan armada, penstafan, dan pemodelan hasil.'
        href: '/solutions/resorts-hotels'
      - title: 'SUP vs Aktiviti Air Lain'
        desc: 'Bandingkan program SUP dengan sukan air lain dari segi pengalaman tetamu dan kecekapan operasi.'
        href: '/learn/sup'
  - title: 'Panduan Runcit & Pengedaran'
    tagline: 'Perkongsian Perniagaan SUP'
    desc: 'Panduan menjadi rakan kongsi runcit atau pengedar SUP — perancangan inventori, pemposisian pasaran, dan strategi pertumbuhan.'
    guides:
      - title: 'Menjadi Peruncit SUP'
        desc: 'Cara memilih lini produk, mengurus inventori, dan memasarkan papan SUP di kedai runcit anda.'
        href: '/solutions/retail-partners'
      - title: 'SUP untuk Operasi Komersial'
        desc: 'Mengapa SUP boleh tiup merupakan produk serbaguna untuk armada komersial, perniagaan sewaan, dan pengendali profesional.'
        href: '/solutions/rental-operators'


intro: 'Setiap papan yang meninggalkan bengkel kami membawa pensijilan bahawa ia telah lulus satu set pemeriksaan kualiti dan ujian bahan yang ditetapkan. Makmal Kualiti & Pemeriksaan kami ialah fungsi bebas dalam organisasi — ia melapor terus kepada pengarah urusan, bukan kepada pengeluaran — memastikan tiada tekanan komersial boleh menjejaskan pintu gerbang pemeriksaan. Jika satu kelompok bahan atau papan siap tidak memenuhi spesifikasi yang diterbitkan, makmal mempunyai kuasa untuk menghentikan penghantaran sehingga ketidakpatuhan itu diselesaikan.'

content_html: |
  <h2>Percayai, tetapi sahkan</h2>
  <p>Makmal ini beroperasi di bawah sistem pengurusan kualiti yang sejajar dengan prinsip, dan kaedah ujian kami berasaskan piawaian ISO, ASTM dan EN di mana berkenaan. Kami mengekalkan rekod terperinci bagi setiap ujian yang dijalankan, mewujudkan rantaian jejakan penuh daripada penerimaan bahan mentah hingga penyerahan papan akhir.</p>

  <h2>Peralatan ujian dan keupayaan</h2>
  <table>
    <thead><tr><th>Peralatan</th><th>Ujian Dijalankan</th><th>Piawaian / Kaedah</th></tr></thead>
    <tbody>
      <tr><td>Mesin ujian universal (50 kN)</td><td>Kekuatan tegangan (fabrik), rintangan pengelupasan (jahitan), perambatan koyakan</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Rangka ujian pengekalan udara (boleh atur cara)</td><td>Ketahanan lambung/kempis 1000 kitaran, ujian tahan tekanan 30 minit</td><td>EN ISO 25649 (dalaman)</td></tr>
      <tr><td>Jig pengelupasan jahitan (pengelupasan 180° bermotor)</td><td>Kekuatan pengelupasan jahitan kimpalan dan jahitan lekat pada 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Penguji kepala hidrostatik</td><td>Rintangan penembusan air fabrik (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Tolok ketebalan digital &amp; mikrometer</td><td>Ketebalan fabrik, ketebalan dinding rel, ketebalan filem pelekat</td><td>ISO 2286-3</td></tr>
      <tr><td>Kebuk persekitaran</td><td>Pelarasan suhu (-40 °C hingga +80 °C) bagi ujian retak-sejuk dan penuaan haba</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Spektrofotometer warna</td><td>Pengukuran warna Delta-E selepas pendedahan UV</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Pintu gerbang pemeriksaan — daripada bahan hingga penghantaran</h2>
  <p>Setiap papan mengikut pelan kualiti yang ditetapkan dengan titik pemeriksaan wajib. Tiada papan boleh melangkau pintu gerbang; setiap pintu gerbang mesti disahkan oleh pemeriksa kualiti sebelum peringkat pengeluaran seterusnya bermula.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Pintu 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Pemeriksaan bahan masuk</p>
            <p class="text-xs text-gray-500 mt-1">Kelompok fabrik, kelompok pelekat, perkakasan — semuanya disemak terhadap spesifikasi kemasukan sebelum dilepaskan kepada pengeluaran.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Pintu 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Pemeriksaan kimpalan dalam proses</p>
            <p class="text-xs text-gray-500 mt-1">Kupon kimpalan pertama diuji (pengelupasan + visual) pada permulaan setiap syif pengeluaran.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Pintu 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Ujian udara kebuk</p>
            <p class="text-xs text-gray-500 mt-1">Setiap kebuk diberi tekanan sehingga 1.5 x tekanan kerja, ditahan 30 minit. Data direkod mengikut nombor siri.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Pintu 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Pemeriksaan pra-penghantaran</p>
            <p class="text-xs text-gray-500 mt-1">Papan lengkap diperiksa: semua pengikat diketatkan, kelengkapan berfungsi, tiada kecacatan kosmetik. Senarai semak 100 perkara.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Pintu 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Pensijilan akhir</p>
            <p class="text-xs text-gray-500 mt-1">Laporan ujian disusun, rekod pemeriksaan disemak, Sijil Kesesuaian dikeluarkan.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Metrik kualiti utama (purata bergerak 2025)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Hasil lulusan pertama (kelompok fabrik)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Kadar kutipan kimpalan (meter linear)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Kebuk diuji udara sebelum pemasangan</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">Pematuhan kategori reka bentuk</span>
    </div>
  </div>

  <h2>Pasukan kualiti kami</h2>
  <p>Makmal ini dikendalikan oleh seorang pengurus kualiti (10 tahun dalam QA marin, Jurutera Kualiti Bersijil ASQ), dua pemeriksa kualiti (setiap seorang dengan pensijilan NDT Tahap 2 dalam ujian visual) dan seorang juruteknik bahan yang bertanggungjawab bagi semua ujian fizikal. Pasukan ini menjalani ujian kecekapan tahunan melalui penyedia pihak ketiga bebas untuk memastikan keputusan ujian kami kekal tepat dan boleh dihasilkan semula.</p>

  <h2>Ujian bebas untuk pelanggan</h2>
  <p>Makmal Kualiti &amp; Pemeriksaan kami tersedia untuk perkhidmatan ujian bebas. Jika anda perlu mengesahkan spesifikasi fabrik, mengesahkan sistem pelekat baharu atau mendapatkan laporan ujian pihak ketiga bagi kelayakan perolehan, kami boleh menjalankan ujian mengikut piawaian yang terpakai dan mengeluarkan laporan ujian bersijil.</p>
  <p>Contoh kerja ujian pihak ketiga terkini:</p>
  <ul>
    <li>Perbandingan kekuatan pengelupasan lima produk filem pelekat pesaing bagi sebuah program perolehan tentera Eropah.</li>
    <li>Kajian penuaan dipercepat (UV + kitaran haba) bagi formulasi PVC berpigmen oren baharu, dengan pengukuran sementara berkala pada selang 500 jam.</li>
    <li>Pengesahan pengekalan udara bagi 50 injap diafragma prototaip untuk reka bentuk kebuk tekanan tinggi baharu.</li>
  </ul>

  <h2>Komitmen kami kepada anda</h2>
  <p>Apabila anda menerima papan Afarer, anda turut menerima dosir kualitinya — rekod tersusun bagi keputusan ujian yang terpakai kepada papan khusus anda. Sijil kelompok fabrik, ujian pengelupasan kimpalan, log ujian udara kebuk dan senarai semak pemeriksaan pra-penghantaran. Setiap angka boleh dijejak. Setiap pemeriksa dikenal pasti. Ini bukan sekadar kertas kerja — ia adalah janji kami bahawa apa yang kami hantar adalah apa yang kami spesifikasikan.</p>
  <p>Jika anda mempunyai kebimbangan kualiti pada bila-bila masa, anda boleh menghubungi makmal secara terus — butiran hubungan dicetak pada sijil kesesuaian anda. Kami mengambil setiap pertanyaan dengan serius dan berkomitmen untuk menjalankan siasatan rasmi dalam masa 48 jam.</p>


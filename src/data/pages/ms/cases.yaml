features3_cases:
  tagline: 'Kes Pilihan'
  title: 'Penyelesaian Tersuai<br />Untuk Cabaran Sebenar'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Armada Pusat Menyelam Eropah'
      customer: 'BlueMed Diving Centers'
      country: 'Yunani'
      industry: 'Menyelam & Pelancongan Marin'
      challenge: 'Memerlukan 12 SUP dikonfigurasi menyelam untuk satu rantaian pusat menyelam merentas pelbagai pulau Greek. Setiap papan memerlukan peletakan kelengkapan tersuai, storan untuk 8 tangki, dan platform stabil untuk kemasukan penyelam di perairan terbuka. Armada perlu tiba dalam masa 60 hari untuk bermulanya musim pelancongan.'
      solution: 'Menghasilkan 12 model SUP Voyager Dive dengan rak kelengkapan bersepadu, platform stabil, dan pembinaan drop-stitch ekstra lebar untuk kestabilan menaiki. Setiap papan diberi jenama livery armada pelanggan. Kesemua 12 papan diuji tekanan dan dihantar dari Qingdao dalam masa 55 hari.'
      product: 'SUP Voyager Dive'
      results: 'Kesemua 12 papan dihantar tepat pada masanya untuk musim pelancongan. Armada telah beroperasi setiap hari selama 18+ bulan tanpa sebarang kegagalan bahan. Pelanggan menempah 6 unit tambahan pada tahun kedua.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive telah menjadi tulang belakang operasi menyelam harian kami. Kestabilan sangat cemerlang, dan susun atur storan kelengkapan menjadikan dek kemas dan selamat untuk tetamu kami.'
      icon: tabler:lifebuoy
    - title: 'Program Jenama Bersama Pengedar Australia'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Australia'
      industry: 'Program Jenama Bersama & Perkongsian'
      challenge: 'Pengedar Australia memerlukan julat papan SUP label peribadi pada harga berdaya saing untuk bersaing dengan jenama China terus-ke-pengguna. Memerlukan 8 model unik merangkumi pemula hingga lanjutan, dengan grafik tersuai, pembungkusan tersuai, dan pemenuhan drop-ship ke gerai runcit.'
      solution: 'Membangunkan 8 model SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) dengan pakej grafik Australia eksklusif. Pembungkusan runcit tersuai dengan kod QR yang dipautkan ke video pemasangan. Logistik drop-ship dikonfigurasi dari Qingdao terus ke kedai runcit Australia.'
      product: 'Lini SUP Tersuai (8 model)'
      results: 'Daripada konsep kepada penghantaran pertama dalam masa 90 hari. Kadar jualan penuh runcit 85% pada musim pertama. Pengedar meluaskan perkongsian untuk merangkumi model SUP tambahan pada tahun kedua.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer menyampaikan lini SUP lengkap dalam masa 90 hari — daripada reka bentuk awal hingga ke lantai runcit. Kualitinya setanding jenama yang dijual pada harga dua kali ganda.'
      icon: tabler:currency-dollar
    - title: 'Bekalan Peralatan Penyelamatan Timur Tengah'
      customer: 'Pihak Berkuasa Pertahanan Awam Kebangsaan'
      country: 'Emiriah Arab Bersatu'
      industry: 'Carian & Penyelamatan'
      challenge: 'Organisasi pertahanan awam memerlukan 20 SUP sedia ronda untuk carian dan penyelamatan pesisir, keselamatan pelabuhan, dan tindak balas banjir. Memerlukan papan berkebolehlihatan tinggi, peralatan keselamatan penuh, dan pematuhan kepada peraturan maritim tempatan.'
      solution: 'Membekalkan 20 model SUP Patrol dengan pembinaan drop-stitch oren berkebolehlihatan tinggi, pakej keselamatan penuh, pita reflektif SOLAS, dan pembinaan diperkukuh. Setiap papan tersijil CE dan diuji mengikut piawaian yang terpakai. Pakej dokumentasi merangkumi sijil pematuhan untuk pendaftaran tempatan.'
      product: 'SUP Patrol'
      results: 'Armada ditempatkan merentas 5 stesen pesisir. Papan telah beroperasi dalam haba melampau (45°C+) tanpa kemerosotan. Prestasi dan ketahanan melebihi spesifikasi.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol melebihi keperluan operasi kami. Dalam keadaan haba melampau, papan tidak menunjukkan sebarang tanda kemerosotan UV selepas 24 bulan penggunaan harian.'
      icon: tabler:alert-triangle
    - title: 'Perkongsian Jenama Bersama Eropah'
      customer: 'North Sea Marine Equipment BV'
      country: 'Belanda'
      industry: 'Program Jenama Bersama & Perkongsian'
      challenge: 'Jenama marin Eropah yang mantap mahu mengembangkan diri ke pasaran SUP tanpa melabur dalam kemudahan pembuatan. Memerlukan rakan kongsi label putih yang mampu menghasilkan 5 model SUP (9 ft hingga 12 ft) dengan penjenamaan peribadi, pensijilan CE, dan hak pengedaran EU eksklusif.'
      solution: 'Mewujudkan perjanjian pembuatan label putih untuk 5 model SUP. Setiap model diberi jenama logo dan skema warna pelanggan. Dokumentasi pensijilan CE disediakan untuk setiap model. Hak pengedaran EU eksklusif diberikan dengan komitmen pesanan minimum. Dokumentasi teknikal disediakan untuk rangkaian servis tempatan.'
      product: 'Lini SUP Tersuai (5 model)'
      results: 'Perjanjian pelbagai tahun ditandatangani. Jalanan pengeluaran pertama sebanyak 50 unit dihantar dalam masa 75 hari. Jenama dilancarkan di pameran perdagangan utama dengan sambutan peniaga yang positif.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Bekerjasama dengan afarer membolehkan kami memasuki pasaran SUP tanpa membina kilang — mereka menyampaikan penyelesaian turnkey lengkap dengan pensijilan CE dan dokumentasi sokongan peniaga.'
      icon: tabler:building
    - title: 'Armada Resort Caribbean'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahamas'
      industry: 'Pelancongan Marin & Perhotelan'
      challenge: 'Resort mewah memerlukan armada peralatan sukan air lengkap untuk aktiviti tetamu: 40 papan SUP untuk lawatan berpandu, 20 SUP tambahan untuk penerokaan lagun, 10 papan SUP untuk ekskursi tetamu, serta aksesori. Semua peralatan memerlukan penjenamaan resort tersuai dan mesti dihantar sebelum musim pelancongan puncak.'
      solution: 'Menghasilkan pakej SUP lengkap: 40 papan SUP Voyager (model All-Around), 20 papan SUP Explorer, 10 papan SUP Touring, serta PFD, dayung, pam, dan kit pembaikan. Semua peralatan dicetak dengan logo resort dan skema warna tropika. Penghantaran berkontena dengan manifest inventori penuh.'
      product: 'Pakej SUP Penuh (70+ unit)'
      results: 'Armada tiba 6 minggu sebelum musim puncak. Skor kepuasan tetamu bagi aktiviti sukan air meningkat 40% tahun-ke-tahun. Peralatan bertahan selama 3 musim dengan hanya penyelenggaraan rutin.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Pendekatan pakej lengkap bermakna kami menerima semua yang diperlukan dalam satu penghantaran — papan dan aksesori semuanya berjenama dan sedia untuk digunakan oleh tetamu. Tetamu kami menyukai kualiti peralatan ini.'
      icon: tabler:beach
    - title: 'Kontrak Rondaan Pesisir AS'
      customer: 'Atlantic Coastal Security Agency'
      country: 'Amerika Syarikat'
      industry: 'Keselamatan Maritim & Penguatkuasaan Undang-Undang'
      challenge: 'Agensi keselamatan pesisir AS memerlukan SUP rondaan kelas berat untuk operasi perairan terbuka. Memerlukan papan berprestasi tinggi dengan peralatan spesifikasi tentera dan pematuhan kepada peraturan Pengawal Pantai AS.'
      solution: 'Merekayasa SUP Patrol dengan pembinaan drop-stitch diperkukuh, skema warna berkebolehlihatan tinggi, pelekat peralatan komunikasi disulitkan, dan titik peletakan peralatan bersepadu. Papan diperkukuh untuk operasi kelas berat. Dokumentasi pematuhan USCG disediakan.'
      product: 'SUP Patrol'
      results: 'Agensi melaporkan kadar kesediaan misi 95% dalam tempoh 12 bulan pertama. Pesanan tambahan sebanyak 8 unit dibuat.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol memberikan krew kami prestasi yang diperlukan untuk operasi perairan terbuka. Pembinaan yang diperkukuh memberikan ketahanan kritikal tanpa menjejaskan pengendalian.'
      icon: tabler:shield

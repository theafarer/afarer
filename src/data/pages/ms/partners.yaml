hero:
  tagline: 'Rakan Kongsi & Pengedaran'
  title: 'Jadi Rakan Kongsi afarer<br />— Rangkaian Pengedaran Global'
  subtitle: 'Sertai rangkaian rakan kongsi global afarer. Kami bekerjasama dengan pengedar marin, peniaga sukan dayung, peruncit kelengkapan dan rakan kongsi jenama di 50+ negara.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp

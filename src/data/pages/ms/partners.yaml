content_programs:
  tagline: 'Program Rakan Kongsi'
  title: 'Program Rakan Kongsi<br />Dibina untuk Pertumbuhan'
  subtitle: 'Sama ada anda pengedar, peniaga atau rakan kongsi jenama, afarer menawarkan program yang direka untuk menyokong perniagaan anda.'
  columns: 3
  items:
    - title: 'Program Pengedar'
      description: 'Pengedaran wilayah eksklusif dengan harga volum, sokongan pemasaran dan akses terus ke kilang. Komitmen minimum diperlukan berdasarkan saiz wilayah.'
      icon: tabler:world
    - title: 'Program Peniaga'
      description: 'Harga peniaga terus, latihan produk, bahan pemasaran dan sokongan waranti bagi lokasi runcit dan kedai dalam talian.'
      icon: tabler:building-store
    - title: 'Perkongsian OEM/ODM'
      description: 'Pembuatan OEM dan ODM perkhidmatan penuh dengan penjenamaan, pembungkusan dan spesifikasi produk tersuai. Daripada konsep hingga kontena.'
      icon: tabler:certificate
    - title: 'Perkongsian Jenama'
      description: 'Penjenamaan bersama, label persendirian dan program model eksklusif bagi jenama yang mantap dalam bidang rekreasi marin dan luar.'
      icon: tabler:stars
    - title: 'Kerajaan & Institusi'
      description: 'Program pembekal diutamakan bagi agensi kerajaan, pengawal pantai, tentera dan organisasi kemanusiaan. Dokumentasi sedia tender.'
      icon: tabler:building-community
    - title: 'Rakan Kongsi Taman Peranginan & Sewaan'
      description: 'Harga armada, kualiti konsisten dan penjenamaan tersuai bagi taman peranginan, pusat selam skuba dan operasi sewaan di seluruh dunia.'
      icon: tabler:sun
content_benefits:
  tagline: 'Mengapa Berkongsi Dengan Kami'
  title: 'Mengapa Rakan Kongsi Memilih afarer'
  subtitle: 'Rakan kongsi kami mendapat manfaat daripada keupayaan pembuatan sebenar, kualiti konsisten dan sokongan responsif.'
  list:
    - 'Akses Terus ke Kilang: Bekerja secara terus dengan pasukan pembuatan kami — tiada orang tengah. Dapatkan respons lebih pantas, harga lebih baik dan keterlihatan penuh ke dalam pengeluaran.'
    - 'Sedia Dipesuaikan: Jenamakan produk anda dengan warna, logo, pembungkusan dan spesifikasi tersuai. Kuantiti pesanan minimum disesuaikan dengan pasaran anda.'
    - 'Kualiti Terjamin: Pengeluaran bersijil ISO 9001 dengan pematuhan CE, UKCA dan BSCI. Setiap produk diuji sebelum dihantar.'
    - 'Logistik Global: Penghantaran dari Qingdao, China dengan pilihan FOB, CIF dan DDP. Gudang AS di Montclair, CA untuk pengedaran Amerika Utara.'
    - 'Sokongan Pemasaran: Katalog produk, fotografi, dokumentasi teknikal dan aset digital untuk menyokong usaha jualan anda.'
    - 'Latihan & Sokongan: Latihan produk untuk pasukan jualan anda, sokongan teknikal untuk pelanggan anda dan penyelarusan servis waranti.'
content_process:
  tagline: 'Cara Menjadi Rakan Kongsi'
  title: 'Proses Perkongsian Mudah'
  subtitle: 'Proses perkongsian kami adalah mudah — direka untuk anda mula menjual produk afarer dengan pantas.'
  items:
    - title: 'Langkah 1: Hantar Permohonan'
      description: 'Lengkapkan borang permohonan rakan kongsi kami dengan profil syarikat, pasaran sasaran dan minat produk anda.'
    - title: 'Langkah 2: Semakan Kelayakan'
      description: 'Pasukan perkongsian kami menyemak permohonan anda dan menghubungi anda dalam masa 3 hari bekerja untuk membincangkan peluang.'
    - title: 'Langkah 3: Perjanjian & Persediaan'
      description: 'Tandatangani perjanjian perkongsian, sediakan akaun anda dan terima harga rakan kongsi, bahan pemasaran dan sampel produk.'
    - title: 'Langkah 4: Latihan & Pelancaran'
      description: 'Latihan produk, sokongan jualan dan bahan pemasaran disediakan. Anda sedia untuk mula menjual.'

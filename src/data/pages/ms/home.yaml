meta:
  title: 'Pengeluar SUP Boleh Tiup & Rakan Kongsi OEM/ODM — Afarer Sukan Air | {SITE}'
  description: 'Afarer ialah pengeluar SUP boleh tiup dan rakan kongsi OEM/ODM di Qingdao, China — kilang bersijil ISO 9001 yang mereka bentuk papan dayung boleh tiup berprestasi tinggi untuk perairan terbuka, lawatan, yoga dan pengembaraan. Diuji tekanan papan demi papan, dengan program OEM/ODM, label persendirian dan pengedaran.'
  keywords:
    - 'sup boleh tiup berprestasi tinggi'
    - 'papan dayung boleh tiup premium'
    - 'jenama papan sup boleh tiup'
    - 'sup boleh tiup untuk lawatan'
    - 'papan dayung jenama bersama'
    - 'pengedar sup negara'
    - 'pengeluar sup boleh tiup'
    - 'rakan kongsi oem odm sup'
    - 'pengeluar papan dayung label persendirian'
hero:
  tagline: 'Pengeluar SUP Boleh Tiup & Rakan Kongsi OEM/ODM'
  title: 'Pergi Lebih Jauh.<br />Meluncur Lebih Kuat.'
  subtitle: |
    SUP boleh tiup berprestasi tinggi yang direka untuk perairan terbuka, hari-hari panjang,<br />
    dan kebebasan untuk meneroka — stabil saat penting,<br />
    kaku di bawah tekanan, dan sedia menghadapi air yang berubah.
  taglineSection: 'Direkayasa untuk keyakinan. Direka untuk menonjol.'
  actions:
    - variant: primary
      text: 'Terokai Papan'
      href: /inflatable-sup/
      icon: tabler:waves
    - text: 'Cari Kayakan Anda'
      href: /size-guide/
      icon: tabler:compass
    - text: 'Mengapa Afarer'
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: 'SUP boleh tiup Afarer meluncur merentasi perairan terbuka pada cahaya pertama — dibina untuk hari-hari panjang dan kebebasan untuk meneroka'

who_we_serve:
  tagline: 'Kayak Bersama Kami'
  title: 'Dibina untuk Gaya Kayakan Anda'
  subtitle: 'Daripada dayungan pertama anda hingga laluan terpanjang anda — dan untuk kelab, taman peranginan dan peruncit yang terus membawa orang mendayung.'

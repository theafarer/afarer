business_solutions:
  tagline: 'Mengapa Ia Meluncur Berbeza'
  title: 'Prestasi Yang Anda Rasai pada Dayungan Pertama'
  subtitle: 'Empat tonggak dibentuk oleh air sebenar — prestasi, reka bentuk, binaan dan kualiti.'
  items:
    - title: 'Prestasi di Air'
      description: 'Bentuk ditala untuk kestabilan, luncuran dan keyakinan dalam ombak — supaya setiap dayungan terasa bersambung dengan air.'
      icon: tabler:shield-check
    - title: 'Reka Bentuk Ekspresif'
      description: 'Koleksi terinspirasi daripada pasang surut, hidupan liar dan tenaga persisiran pantai — papan yang anda mahu dilihat bersamanya.'
      icon: tabler:package
    - title: 'Binaan Terbukti'
      description: 'Teras drop-stitch berketumpatan tinggi, rel diperkuat dan jahitan berlaminasi fusi dibina untuk kegunaan berulang.'
      icon: tabler:headset
    - title: 'Kualiti Tersahkan'
      description: 'Diuji tekanan, diperiksa visual dan disokong oleh waranti yang jelas serta sokongan selepas jualan yang responsif.'
      icon: tabler:truck-delivery

oem_section:
  tagline: 'Pembuatan OEM / ODM & Jenama Bersama'
  title: 'Daripada Idea ke Air — Edisi Jenama Bersama'
  subtitle: 'Bagi rakan kongsi yang mahu lebih daripada produk katalog: pembuatan OEM/ODM dan koleksi jenama bersama terhad yang direka, direkayasa dan dibina bersama Afarer — sambil setiap papan kekal sebagai produk Afarer.'
  steps:
    - number: '01'
      title: 'Idea & Ringkasan'
      desc: 'Kongsikan visi anda, penunggang sasaran dan air yang anda reka bentuk untuknya.'
    - number: '02'
      title: 'Reka Bentuk & Kejuruteraan'
      desc: 'Pemodelan 3D, pemilihan bahan dan reka bentuk grafik yang tersendiri.'
    - number: '03'
      title: 'Prototaip & Pengesahan'
      desc: 'Papan sampel diuji tekanan dan disahkan kayahan sebelum anda membuat komitmen.'
    - number: '04'
      title: 'Bina Berskala Besar'
      desc: 'Pengeluaran konsisten dan diperiksa dengan titik semakan kualiti di setiap peringkat.'
    - number: '05'
      title: 'Penghantaran Global'
      desc: 'Logistik daripada Qingdao ke pelabuhan utama dengan sokongan kastam.'
  cta: 'Terokai Jenama Bersama'

      description: 'Papan serba boleh yang lebar dan stabil menjadikan dayungan pertama anda terasa semula jadi dan terus mengikut rentak perkembangan anda.'
      icon: tabler:users
      cta: 'Cari Papan Pertama Anda'
      link: /all-around-sup/
    - title: 'Pendayung Lawatan & Pengembaraan'
      keywords: 'SUP lawatan, papan dayung jarak jauh, SUP ekspedisi'
      description: 'Papan yang lebih panjang dan sempit dibina untuk menjejak lurus, meluncur lebih jauh dan membawa peralatan bagi laluan berbilang hari.'
      icon: tabler:building
      cta: 'Terokai Papan Lawatan'
      link: /touring-sup/
    - title: 'Kelab, Taman Peranginan & Sewaan'
      keywords: 'armada sewaan SUP, kelengkapan kelab dayung, aktiviti air taman peranginan'
      description: 'SUP boleh tiup sedia armada dengan ketahanan boleh diharap, penyelenggaraan mudah dan sokongan alat ganti.'
      icon: tabler:shopping-cart
      cta: 'Bina Armada Anda'
      link: /solutions/
    - title: 'Pengedar Negara & Rakan Kongsi Jenama Bersama'
      keywords: 'pengedar SUP negara, SUP jenama bersama, SUP label persendirian'
      description: 'Pengedaran eksklusif negara demi negara dan koleksi jenama bersama terhad bagi perniagaan sukan air yang berkelayakan.'
      icon: tabler:package
      cta: 'Jadi Rakan Kongsi'
      link: /distributor-program/


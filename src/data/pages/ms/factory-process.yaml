hero:
  tagline: 'Proses'
  title: 'Proses Pembuatan'
  subtitle: 'Daripada bahan mentah kepada papan sedia air — setiap langkah di bawah kawalan kami'
  back_label: 'Kembali ke Kilang'
  back_link: /factory

intro: 'Tidak seperti jenama yang mengupahkan pengeluaran kepada kilang pihak ketiga, afarer memiliki dan mengendalikan keseluruhan rantaian pembuatannya. Integrasi menegak ini membolehkan kami mengekalkan kawalan kualiti yang ketat di setiap peringkat, membalas dengan pantas kepada keperluan tersuai dan menyerahkan kualiti produk yang konsisten kelompok demi kelompok. Inilah cara sebuah papan dibina di kemudahan kami.'

steps:
  - step: '01'
    title: 'Penerimaan & Pemeriksaan Bahan'
    description: 'Setiap kelompok masuk fabrik PVC, mat gentian kaca, resin dan perkakasan diperiksa terhadap spesifikasi. Sampel fabrik diuji bagi kekuatan tegangan, keseragaman ketebalan dan rintangan UV sebelum dilepaskan kepada pengeluaran. Bahan yang tidak mematuhi dikuarantin dan dipulangkan.'
    duration: '1–2 hari'
  - step: '02'
    title: 'Pemotongan PVC Automatik'
    description: 'Fabrik yang diluluskan disusun pada mesin pemotong CNC automatik dan dipotong dengan ketepatan bawah milimeter. Penyusunan dioptimumkan komputer menyusun panel untuk meminimumkan sisa — biasanya di bawah 5%. Panel yang dipotong dilabel mengikut model papan dan kebuk, kemudian dibundel untuk dipindahkan ke bengkel kimpalan.'
    duration: '2–4 jam setiap kit papan'
  - step: '03'
    title: 'Perapatan Haba & Kimpalan Tiub'
    description: 'Panel ditack dan diikat menggunakan mesin perapatan haba dengan kimpalan udara panas pada suhu terkawal 200–300 °C. Jahitan utama diperkuat dengan kimpalan RF dielektrik bagi sambungan kedap udara dan berkekuatan tinggi. Kebuk yang siap dilambung kepada 1.5× tekanan kerja untuk pengesahan pengekalan udara selama 30 minit.'
    duration: '1–2 hari setiap papan'
  - step: '04'
    title: 'Percetakan & Hiasan SUP'
    description: 'Grafik dek papan SUP diaplikasikan menggunakan percetakan digital bagi reka bentuk berkualiti foto warna penuh, dan cetakan sutera saring bagi logo tahan lama dan corak berulang. Cetakan dirawat dan dirapatkan untuk rintangan UV dan haus.'
    duration: '1–2 hari'
  - step: '05'
    title: 'Pemasangan Akhir & Kelengkapan'
    description: 'Papan dilengkapi pada larian pemasangan dengan sirip, injap, dek EVA dan aksesori. Setiap unit mengikut senarai semak pemasangan 100 perkara dengan pengesahan wajib di setiap peringkat.'
    duration: '2–4 hari'
  - step: '06'
    title: 'Ujian Kualiti & Pemeriksaan'
    description: 'Setiap papan siap menjalani pintu kualiti wajib: ujian pengekalan udara kebuk, semakan fungsi perkakasan, pengesahan tork pengikat dan pemeriksaan kosmetik. Binaan tersuai dan prototaip juga menerima ujian dalam air yang merangkumi kestabilan dan pengendalian.'
    duration: '1–2 hari'
  - step: '07'
    title: 'Pembungkusan & Penghantaran'
    description: 'Papan dikempiskan, dilipat mengikut prosedur, dibungkus dalam beg tenunan lasak atau peti kayu lapis dan dimuatkan untuk penghantaran. Setiap bungkusan dilabel dengan model, nombor siri dan destinasi. Kami menyelaraskan dengan penghantar kargo bagi penghantaran kontena FCL dan LCL ke seluruh dunia.'
    duration: '1 hari'


stories:
  tagline: 'Kisah Peneroka'
  title: 'Pengembaraan sebenar daripada manusia sebenar'
  subtitle: 'Dengar daripada pendayung, keluarga dan profesional yang menggunakan kelengkapan afarer di atas air.'
  items:
    - name: 'Sarah & Mike'
      title: 'Pemilik SUP Explorer 11, Kanada'
      content: 'Kami membawa Explorer 11 kami dalam trip berminggu-minggu merentasi Taman Algonquin. Ia mengendalikan lintasan darat dan penyeberangan tasik dengan indah. Binaan drop-stitch bermakna kami boleh melambung sehingga 15 PSI dan mendapatkan prestasi papan keras daripada papan yang boleh dibungkus.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Taman Algonquin, Kanada'
    - name: 'Carlos R.'
      title: 'Penunggang Cheetah Surge, Sepanyol'
      content: 'Cheetah Surge ialah pilihan utama saya untuk pelayaran pesisir. Reka bentuk yang cerah menarik perhatian di pantai, dan kestabilannya memberi saya keyakinan dalam ombak ringan. Ia terkendali dengan indah sama ada saya sedang dalam lawatan atau sekadar menikmati matahari terbenam.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Sepanyol'
    - name: 'Lina & keluarga'
      title: 'Pendayung Flowing Lotus, Sweden'
      content: 'Pengembaraan keluarga hujung minggu di kepulauan. Flowing Lotus cukup stabil untuk anak perempuan saya berdiri sementara saya mendayung. Dilambung dalam masa kira-kira 10 minit — tiada treler diperlukan, hanya keseronokan keluarga tulen di atas air.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Kepulauan Stockholm, Sweden'
    - name: 'Lt. Cmdr. Andres'
      title: 'Peneroka Ocean Voyager, Filipina'
      content: 'Saya menggunakan Ocean Voyager saya untuk lawatan pesisir jarak jauh sekitar Palawan. Selepas berbulan-bulan kegunaan harian dalam keadaan tropika, papan itu masih berprestasi seperti baharu. Bentuk lawatannya menembusi ombak yang akan menghentikan papan yang kurang berkualiti.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palawan, Filipina'
    - name: 'Emma T.'
      title: 'Pengguna kali pertama Tropical Breeze, Australia'
      content: 'Saya tidak pernah menaiki SUP sebelum ini. Tropical Breeze begitu stabil sehingga saya berasa yakin pada percubaan pertama. Kini saya mendayung setiap hujung minggu. Lengkung pembelajarannya hampir sifar — dan papan itu kelihatan menakjubkan di atas air.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Australia'


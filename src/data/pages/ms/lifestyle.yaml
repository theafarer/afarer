  - icon: 🌊
    title: 'Lahir di Atas Air'
    desc: 'Setiap reka bentuk bermula dengan memahami bagaimana air berkelakuan. Kami merekayasa daripada tepi keadaan ke dalam — kerana lautan ialah guru kami, bukan tempat kerja kami.'
  - icon: 🔧
    title: 'Dibina untuk Tahan Lama'
    desc: 'Produk paling mampan ialah produk yang tidak perlu diganti. Bahan gred marin, teras drop-stitch dengan rating 15 PSI dan jahitan yang mengatasi musim.'
  - icon: '🏆'
    title: 'Mudah Capai Melalui Reka Bentuk'
    desc: 'Sukan air tidak seharusnya menjadi kemewahan. Prestasi gred profesional pada harga yang masuk akal bagi keluarga, pemandu dan pengendali kecil — bukan sekadar armada komersial.'
  - icon: 🌍
    title: 'Komuniti Global'
    desc: 'Daripada pantai Qingdao hingga tasik di Eropah, sungai di Asia Tenggara dan teluk di Amerika — pelanggan kami berkongsi satu perkara: kecintaan terhadap kehidupan di atas air.'
  - icon: ♻️
    title: 'Pembuatan Bertanggungjawab'
    desc: 'Penyusunan dioptimumkan CNC memotong sisa bahan kepada bawah 5%. Binaan tahan lama mengurangkan kitaran penggantian. Kami membina untuk umur panjang kerana itu pilihan paling mampan.'
  - icon: 🤝
    title: 'Sokongan Yang Kekal'
    desc: 'Lambung berusia dua puluh tahun masih menghubungi kami untuk alat ganti. Respons waranti kami berpurata 24 jam. Kami tidak hilang selepas jualan — kami di sini sepanjang hayat produk.'


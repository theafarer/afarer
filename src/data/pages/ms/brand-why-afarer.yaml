features3_reasons:
  tagline: 'Mengapa Memilih afarer'
  title: 'Tujuh Sebab untuk Berkongsi Dengan Kami'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Pembuatan Sebenar, Bukan Perdagangan'
      description: 'Kami memiliki dan mengendalikan kilang seluas 12,000 m². Apabila anda berunding dengan afarer, anda bekerja secara terus dengan orang yang mereka, merekayasa dan membina produk anda — tiada orang tengah.'
      icon: tabler:building-factory
    - title: '2. Pendekatan Diterajui Kejuruteraan'
      description: 'Proses reka bentuk kami bermula dengan kes kegunaan, bukan kategori produk. Kami mengoptimumkan bentuk lambung, pemilihan bahan dan konfigurasi berdasarkan cara papan sebenarnya akan digunakan.'
      icon: tabler:engine
    - title: '3. Kualiti Bersijil'
      description: 'Disijilkan CE, sistem kualiti ISO, mematuhi BSCI, mematuhi REACH, diluluskan USCG. Setiap produk memenuhi piawaian antarabangsa — bukan sekadar dakwaan.'
      icon: tabler:certificate
    - title: '4. Penjenamaan Bersama Fleksibel'
      description: 'Warna rel, susun atur dek, penjenamaan, pembungkusan — kami menyesuaikan mengikut spesifikasi anda. Tiada tekanan pesanan minimum. Mulakan dengan prototaip, kembangkan dengan keyakinan.'
      icon: tabler:adjustments
    - title: '5. Logistik Global'
      description: 'Gudang AS di California, penghantaran terus dari Qingdao, kargo udara bagi pesanan segera. Kami menguruskan dokumen kastam dan dokumentasi.'
      icon: tabler:truck-delivery
    - title: '6. Sokongan Seumur Hidup'
      description: 'Kami menyokong papan yang kami bina 20 tahun lalu. Alat ganti tulen, nasihat teknikal, panduan pembaikan — pasukan kami sedia apabila anda memerlukan kami.'
      icon: tabler:lifebuoy
    - title: '7. Spesifikasi Jujur'
      description: 'Rating beban sebenar, dimensi sebenar, berat sebenar. Tiada pembesaran pemasaran. Apa yang kami terbitkan itulah yang anda terima — disahkan oleh ujian bebas.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Dipercayai oleh Jenama di Seluruh Dunia'
  title: 'Kata Rakan Kongsi Kami'
  items:
    - content: 'Kami telah bekerja dengan beberapa pengeluar di China, tetapi afarer menonjol kerana sokongan kejuruteraan dan kualiti konsisten mereka. Mereka melayani jenama kami seperti jenama mereka sendiri.'
      name: '— Rakan Kongsi Jenama Bersama, Jenama Sukan Air Eropah'
    - content: 'Papan SUP mereka telah berkhidmat dengan armada kami selama lebih 5 tahun. Penyelenggaraan minimum, rintangan UV cemerlang. Waranti 5 tahun memberi kami keyakinan.'
      name: '— Pengendali Armada, Kumpulan Taman Peranginan Timur Tengah'
    - content: 'Pasukan afarer membantu kami membangunkan reka bentuk papan SUP tersuai daripada konsep hingga pengeluaran dalam masa 90 hari. Kualitinya melebihi jangkaan kami.'
      name: '— Pengedar, Sukan Air Australia'
cta:
  title: 'Sedia merasai perbezanya?'
  subtitle: 'Hubungi pasukan kami untuk membincangkan projek anda. Tiada komitmen diperlukan — hanya nasihat jujur tentang pembuatan.'
  actions:

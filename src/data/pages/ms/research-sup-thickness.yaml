content_html: |
  <h2>Tiga Ketebalan Standard</h2>

  <h3>4" (10 cm) – Lawatan &amp; Prestasi</h3>
  <ul>
    <li>Kekakuan tertinggi – kurang lenturan di bawah beban</li>
    <li>Paling ringan – kurang bahan, isipadu udara lebih kecil</li>
    <li>Penjejakan cemerlang – getaran sisi-ke-sisi berkurangan</li>
    <li>Paling laju – seretan berkurangan, luncuran lebih mudah</li>
    <li>Terbaik untuk: Lawatan, perlumbaan, pendayungan kecergasan, pendayung berpengalaman</li>
  </ul>

  <h3>5" (12.7 cm) – Serba Boleh</h3>
  <ul>
    <li>Kekakuan baik – nisbah lenturan-ke-kekakuan seimbang</li>
    <li>Berat sederhana – penggunaan bahan standard</li>
    <li>Kestabilan utama + sekunder baik</li>
    <li>Terbaik untuk: Pendayungan rekreasi, pemula, kegunaan tasik dan sungai santai</li>
  </ul>

  <h3>6" (15.2 cm) – Kestabilan &amp; Yoga</h3>
  <ul>
    <li>Kestabilan utama tertinggi – keapungan besar</li>
    <li>Paling berat – lebih banyak bahan PVC, isipadu udara lebih besar</li>
    <li>Paling perlahan – lebih banyak seretan, lebih sukar mengekalkan luncuran</li>
    <li>Terbaik untuk: Yoga/kecergasan, pendayung berat (100+ kg), keadaan sangat berombak</li>
  </ul>

  <h2>Analisis Kejuruteraan</h2>
  <p>Kekakuan SUP boleh tiup ditentukan oleh tekanan udara dalaman dan momen inersia keratan rentas papan. Pada 20 PSI, papan 4" menunjukkan pesongan di bawah beban kira-kira 30% kurang daripada papan 6" dengan lebar dan panjang yang sama. Kestabilan utama datang daripada lebar garisan air dan keapungan; kestabilan sekunder dipengaruhi oleh bentuk rel dan lebar papan.</p>

  <h2>Ketebalan Mengikut Berat Pendayung</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Berat Pendayung</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Ketebalan Disyorkan</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Bawah 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" atau 6"</td></tr>
      <tr><td class="p-3 border">Melebihi 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Ketebalan vs. Pertukaran PSI</h2>
  <p>Kefahaman salah yang biasa ialah PSI lebih tinggi boleh menggantikan ketebalan berlebihan. Pada 25 PSI, papan 6" menunjukkan lebih banyak lenturan berbanding papan 4" pada 15 PSI kerana momen inersia geometri mendominasi persamaan kekakuan. Bagi pendayung yang mementingkan prestasi, papan lebih nipis pada tekanan lebih rendah mengatasi papan lebih tebal pada tekanan lebih tinggi.</p>

  <h2>Barisan Afarer</h2>
  <ul>
    <li><strong>Papan 4":</strong> Siri Cheetah Touring – SUP lawatan 12' x 30" x 4" untuk kecergasan dan pendayungan jarak jauh</li>
    <li><strong>Papan 5":</strong> Siri Cheetah All-Round – 10'6" x 32" x 5" untuk kegunaan rekreasi</li>
    <li><strong>Papan 6":</strong> Siri Cheetah Ultra-Stable – 10' x 34" x 6" untuk yoga, pendayung besar dan platform fotografi</li>
  </ul>
  <p>Semua papan menggunakan teras drop-stitch 1,680 DTEX dengan tekanan rating 20 PSI dan laminat PVC 1.2 mm.</p>


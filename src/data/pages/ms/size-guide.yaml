how_to_choose:
  title: Cara Memilih Saiz yang Tepat
  cards:
    - title: Papan SUP
      description: Pilih panjang berdasarkan berat dan kegunaan yang anda maksudkan. Papan lebih lebar (32"+) menawarkan lebih banyak kestabilan. Papan lebih panjang (11-12 kaki) menjejak lebih baik untuk lawatan. Pendayung lebih berat memerlukan papan berisipadu tinggi.
    - title: SUP Lawatan
      description: Papan lebih panjang (11–12 kaki) terbaik untuk meliputi jarak dan lawatan. Papan lebih lebar (32"+) menawarkan lebih banyak kestabilan. Semak kapasiti berat bagi jumlah beban termasuk peralatan.
    - title: SUP Serba Boleh
      description: Pilih panjang mengikut berat penunggang dan kegunaan yang dimaksudkan. Papan serba boleh sesuai untuk rekreasi, kecergasan dan yoga. Papan lebih kecil lebih mudah dikendalikan.

  title: 'Pusat R&D | {SITE}'
  description: 'Penyelidikan & Pembangunan — pengujian fabrik PVC, kejuruteraan lunas, kimpalan RF, ujian hidrodinamik, dan kawalan kualiti. Perkhidmatan R&D tersuai tersedia.'

hero:
  tagline: 'Pusat R&D'
  title: 'Pusat R & D'
  subtitle: 'Bertumpu pada Kemajuan'

intro:
  - 'Pusat Penyelidikan dan Pembangunan (R&D) afarer ialah daya penggerak di sebalik misi kami untuk merevolusikan peralatan sukan air. Kami memperkasakan peminat sukan air di seluruh dunia dengan produk yang lebih selamat, lebih selesa, dan lebih menyeronokkan melalui inovasi tanpa henti dalam papan dayung berdiri boleh tiup (SUP). Pasukan kami yang berdedikasi, terdiri daripada jurutera, pereka bentuk, dan pakar sukan air yang berghairah, sedang membentuk masa depan industri ini, sentiasa meningkatkan tahap kualiti, prestasi, dan kelestarian.'
  - 'Kemudahan R&D kami menghimpunkan ahli sains bahan, jurutera marin, dan jurutera pengeluaran di bawah satu bumbung. Daripada formulasi fabrik dan simulasi lunas sehingga pembangunan proses kimpalan dan percubaan laut skala penuh, setiap peringkat pembangunan produk didorong oleh data dan disahkan melalui pengujian.'


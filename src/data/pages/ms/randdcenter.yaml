vision:
  tagline: 'Visi Kami'
  title: 'Membentuk Masa Depan Sukan Air'
  body: 'afarer berusaha memimpin industri SUP boleh tiup melalui inovasi berterusan, kualiti yang tidak tergoyah, dan komitmen teguh terhadap keselamatan serta kelestarian — akhirnya memperkayakan pengalaman peminat sukan air di seluruh dunia. Pusat R&D afarer ialah tempat keghairahan bertemu inovasi, menetapkan standard baharu bagi industri sukan air.'

labs_section:
  tagline: 'Makmal'
  title: 'Makmal Kami'
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: 'Makmal Fabrik PVC'
      description: 'Penyelidikan dan pengujian berterusan fabrik dek PVC untuk kekuatan tegangan, rintangan UV, kehausan, dan kelenturan suhu rendah bagi memastikan kebolehpercayaan jangka panjang dalam persekitaran marin.'
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 'Studio Kejuruteraan Lunas'
      description: 'Reka bentuk berasaskan CAD dan analisis unsur terhingga untuk lunas HDPE, aluminium, dan gentian kaca. Setiap lunas disimulasikan secara digital untuk taburan tegasan dan rintangan hentaman sebelum prototaip pertama dibina.'
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: 'Pusat Kimpalan RF'
      description: 'Kemudahan kimpalan frekuensi radio khusus dengan kawalan suhu dan tekanan yang tepat, menghasilkan jahitan berkekuatan tinggi dan kedap udara yang memenuhi piawaian industri marin bagi kraf boleh tiup.'
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 'Tangki Ujian Hidrodinamik'
      description: 'Ujian model skala di tangki ujian dalaman kami untuk mengoptimumkan bentuk lunas, prestasi planing, kestabilan, dan kecekapan bahan api merentas pelbagai keadaan beban dan laut.'
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: 'Bengkel Prototaip'
      description: 'Kemudahan pembikinan prototaip dan kelengkapan skala penuh tempat model baharu dibina, dipasang, dan diuji di laut. Setiap prototaip menjalani program ujian dalam air sekurang-kurangnya 20 jam sebelum kelulusan pengeluaran.'
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 'Makmal Kualiti & Pemeriksaan'
      description: 'Makmal jaminan kualiti khusus yang menjalankan ujian tegangan, kitaran penahanan udara, ujian pelesapan jahitan, dan pensijilan bahan bagi memastikan setiap papan yang meninggalkan bengkel memenuhi spesifikasi yang kami terbitkan.'
      href: /randdcenter/quality-inspection-lab

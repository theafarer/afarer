capabilities:
  tagline: 'Keupayaan'
  title: 'Keupayaan R&D'
  subtitle: 'Empat disiplin teras yang memberikan kami kawalan hujung-ke-hujung ke atas pembangunan produk — daripada penyelidikan bahan mentah sehingga pensijilan akhir.'
  groups:
    - title: 'Sains Bahan & Teknologi Fabrik'
      items:
        - 'Analisis dan pengoptimuman formulasi PVC'
        - 'Pembangunan tambahan penstabil UV, perencat api, dan anti-mikrob'
        - 'Laminasi fabrik pelbagai lapisan dan kejuruteraan pelekatan'
        - 'Ujian penuaan dipercepat (UV, terma, kelembapan, semburan garam)'
    - title: 'Kejuruteraan Lunas & Hidrodinamik'
      items:
        - 'Reka bentuk lunas 3D parametrik dan pengoptimuman CFD'
        - 'Analisis unsur terhingga untuk beban struktur dan hentaman'
        - 'Ujian tangki penunda model skala dan pengesahan prestasi'
        - 'Pembangunan lunas tersuai untuk profil misi khas'
    - title: 'Teknologi Kimpalan & Penyambungan'
      items:
        - 'Pembangunan dan pengoptimuman proses kimpalan dielektrik RF'
        - 'Kaedah kimpalan udara panas, baji panas, dan ultrasonik'
        - 'Pelekatan pelekat dan kelayakan pita jahitan'
        - 'Pemodelan kekuatan kimpalan dan ramalan jangka hayat'
    - title: 'Pengujian, Pensijilan & Pematuhan'
      items:
        - 'Pengurusan kualiti dan ujian pematuhan CE'
        - 'Ujian pihak ketiga bebas dan sokongan pensijilan'
        - 'Pembangunan protokol ujian tersuai untuk kelayakan perolehan'
        - 'Analisis kegagalan dalam perkhidmatan dan siasatan punca asas'


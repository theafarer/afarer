content_html: |
  <h2>Apakah Itu Drop Stitch?</h2>
  <p>Drop stitch (juga dipanggil "fabrik drop-stitch" atau "teras drop-stitch") ialah kaedah binaan di mana ribuan benang poliester individu menghubungkan lapisan atas dan bawah cangkang fabrik. Apabila cangkang dilambungkan, benang-benang ini bertindak sebagai elemen tegangan dalaman — ia menghalang panel atas dan bawah daripada mengembang keluar menjadi bentuk bulat, memaksa panel kekal rata dan kaku.</p>
  <p>Hasilnya ialah struktur ringan dan mudah alih yang mampu menahan tekanan dalaman 15 – 20 PSI — setanding kekakuan papan cangkang keras tetapi boleh dikempiskan sepenuhnya untuk penyimpanan dan pengangkutan.</p>

  <h2>Bagaimana Ia Berfungsi: Fiziknya</h2>
  <p>Dalam struktur boleh tiup konvensional (seperti belon atau tilam udara), tekanan udara dalaman menolak sama rata ke semua arah. Tanpa sekatan dalaman, struktur menjadi berbentuk silinder atau sfera. Drop stitch menyelesaikan ini dengan memperkenalkan pengukuhan tegangan:</p>
  <ul>
    <li>Ribuan benang menghubungkan lapisan fabrik atas dan bawah</li>
    <li>Apabila dilambungkan, tekanan udara cuba menolak bahagian atas dan bawah terpisah</li>
    <li>Benang menahan pemisahan ini, memindahkan beban menjadi tegangan sepanjang paksi benang</li>
    <li>Hasilnya ialah panel rata dan kaku yang menahan lenturan</li>
  </ul>

  <h2>Proses Binaan</h2>
  <ol>
    <li><strong>Pertenunan:</strong> Benang poliester ditenun serentak ke dalam dua lapisan fabrik asas berasingan (biasanya poliester bersalut PVC 1,100 DTEX atau 1,680 DTEX). Benang ditenun ber Gelung antara lapisan pada sudut 90&deg;.</li>
    <li><strong>Penyalutan:</strong> Fabrik asas yang ditenun disalut dengan PVC (atau kadangkala TPU) menggunakan proses penyalutan pisau atau penyalutan kalendar. Ini merapatkan benang dan mewujudkan membran kedap udara.</li>
    <li><strong>Pengikatan lapisan:</strong> Teras drop-stitch diikat kepada lapisan laminat luar (biasanya PVC 0.9 mm atau 1.2 mm) menggunakan laminasi haba atau pelekat.</li>
    <li><strong>Pengimpalan:</strong> Jalur rel dikimpal sepanjang tepi menggunakan kimpalan udara panas, kimpalan RF atau kimpalan frekuensi tinggi untuk mewujudkan dinding sisi papan.</li>
    <li><strong>Pemasangan injap:</strong> Injap Boston atau injap Halkey-Roberts dipasang, biasanya dengan mekanisme pelepasan tekanan untuk mengelakkan pelambungan berlebihan.</li>
  </ol>

  <h2>Penunjuk Kualiti Utama</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tahap Permulaan</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Ketumpatan benang</td><td class="p-3 border">1 benang / inci persegi</td><td class="p-3 border">2 benang / inci persegi</td></tr>
      <tr><td class="p-3 border">Fabrik asas</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Tekanan maksimum</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Ketebalan PVC</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Binaan rel</td><td class="p-3 border">Dilipat &amp; dilekat</td><td class="p-3 border">Dikimpal &amp; terikat fusi</td></tr>
    </tbody>
  </table>

  <h2>Aplikasi</h2>
  <ul>
    <li><strong>Papan SUP:</strong> Ketebalan 4" – 6", 15 – 20 PSI, 1 – 2 benang/inci persegi</li>
    <li><strong>Kayak:</strong> Lantai drop-stitch + kebuk sisi boleh tiup, lantai 10 – 15 PSI</li>
  </ul>

  <h2>Drop Stitch vs. Dek Udara (Teras Gentian Kaca atau Kayu)</h2>
  <p>Papan cangkang keras menggunakan teras buih EPS dengan pengukuhan rasuk gentian kaca atau kayu. Ia lebih ringan, lebih kaku dan lebih responsif — tetapi tidak boleh dikempiskan. Drop stitch menukar sebahagian kekakuan dengan keboleh alih penuh. Bagi kebanyakan pengguna rekreasi, SUP drop-stitch moden pada 20 PSI tidak dapat dibezakan daripada papan keras tahap permulaan dari segi kekakuan.</p>

  <h2>Bagaimana Afarer Menggunakan Drop Stitch</h2>
  <p>Afarer menggunakan teras drop-stitch 1,680 DTEX merentasi barisan SUP-nya, dengan 2 benang per inci persegi dan laminat luar PVC 1.2 mm. Papan dinilai sehingga 20 PSI dan menjalani ujian tahan tekanan 24–48 jam pada tekanan 1.25x daripada rating sebelum penghantaran. Jalur rel dikimpal udara panas dengan fusi tiga lapisan, dan injap pelepasan tekanan adalah standard merentasi semua model.</p>


faqs:
  title: 'Jenama Bersama — FAQ'
  subtitle: 'Bagaimana penjenamaan bersama Afarer berfungsi, dan bagaimana ia berbeza daripada OEM dan label persendirian.'
  items:
    - title: 'Adakah penjenamaan bersama sama dengan OEM atau label persendirian?'
      description: 'Tidak. Afarer tidak lagi menjalankan program OEM/label persendirian terbuka. Produk jenama bersama kekal sebagai produk Afarer — direka, direkayasa, diperiksa kualiti dan disokong oleh jenama Afarer. Identiti anda muncul sebagai jenama bersama, bukan sebagai produk pihak ketiga tanpa jenama.'
    - title: 'Siapakah yang boleh memulakan projek jenama bersama?'
      description: 'Perniagaan sukan air yang berkelayakan: rakan kongsi negara sedia ada, kelab dayung, taman peranginan dan hotel, penganjur acara serta komuniti. Hantarkan ringkasan projek kepada kami dan kami akan mengesahkan kesesuaian sebelum kerja reka bentuk bermula.'
    - title: 'Adakah penjenamaan bersama akan berkonflik dengan pengedar negara saya?'
      description: 'Tidak. Model satu-negara-satu-pengedar diutamakan. Koleksi jenama bersama diselaraskan dengan rakan kongsi negara tempatan di mana ia wujud, supaya tiada jenama selari atau bersaing muncul dalam wilayah yang dilindungi.'
    - title: 'Berapakah pesanan minimum bagi koleksi jenama bersama?'
      description: 'Koleksi rintisan bermula pada 30–50 unit. Koleksi standard ialah 50–100 unit; edisi besar atau pelbagai wilayah ialah 100+ unit. Garis masa pembangunan tersuai dipersetujui mengikut projek.'
    - title: 'Apakah yang menjadi kualiti Afarer berbanding sumbangan rakan kongsi?'
      description: 'Afarer memiliki reka bentuk produk, kejuruteraan, bahan, binaan, QC dan waranti. Rakan kongsi menyumbang konsep koleksi, penamaan, warna, input grafik dan strategi pasaran. Ini mengekalkan satu piawaian kualiti di atas air.'
    - title: 'Bagaimanakah cara memohon?'
      description: 'Lengkapkan borang pertanyaan jenama bersama dengan perniagaan, pasaran dan idea koleksi anda. Kami menyemak kesesuaian, kemudian membalas dalam masa 3 hari bekerja dengan cadangan dan Perjanjian Projek Jenama Bersama.'

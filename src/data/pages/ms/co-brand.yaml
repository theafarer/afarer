features:
  title: 'Maksud Penjenamaan Bersama di Afarer'
  subtitle: 'Penjenamaan bersama ialah program perkongsian reka bentuk kami — dibina sekitar jenama Afarer, perlindungan wilayah dan koleksi terhad, bukan pengeluaran tanpa jenama.'
  columns: 3
  items:
    - title: 'Produk Afarer Kekal Produk Afarer'
      description: 'Koleksi jenama bersama ialah edisi terhad papan Afarer dengan identiti anda terjalin di dalamnya. Ia tidak pernah tanpa jenama, tidak pernah jenama pihak ketiga dan tidak pernah program label persendirian terbuka.'
      icon: 'tabler:trademark'
    - title: 'Direka Bersama Anda'
      description: 'Warna, penamaan dan kisah anda membentuk koleksi tersebut. Pasukan reka bentuk dan kejuruteraan kami mengendalikan dek, grafik, pembungkusan dan dokumentasi daripada ringkasan hingga penyerahan.'
      icon: 'tabler:pencil'
    - title: 'Untuk Kelab, Taman Peranginan, Acara & Komuniti'
      description: 'Koleksi armada bagi kelab dayung dan taman peranginan, edisi acara bagi perlumbaan dan siri komuniti — semuanya membawa kualiti dan waranti Afarer.'
      icon: 'tabler:users'
    - title: 'Melindungi Rakan Kongsi Negara'
      description: 'Penjenamaan bersama berjalan seiring model satu-negara-satu-pengedar kami. Rakan kongsi negara mengekalkan wilayah mereka; koleksi jenama bersama tidak membuka pintu kepada jenama selari di pasaran mereka.'
      icon: 'tabler:shield-check'
    - title: 'Piawaian Kejuruteraan & Kualiti'
      description: 'Setiap koleksi dihantar daripada rantaian bekalan bersijil kami dengan dokumentasi CE dan ISO 9001, ujian tekanan dan titik semakan QC yang sama seperti julat teras kami.'
      icon: 'tabler:certificate'
    - title: 'Menjadi Aset Jenama'
      description: 'Koleksi jenama bersama terhad membina kisah anda sendiri di atas air — margin jualan, kandungan media dan alasan bagi pendayung untuk kembali musim demi musim.'
      icon: 'tabler:star'

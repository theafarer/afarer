body: |
  <h2>Perbezaan Teras</h2>
  <p>SUP boleh tiup (iSUP) dan papan keras memenuhi tujuan asas yang sama — berdiri dan mendayung di atas air — tetapi mencapainya melalui kaedah binaan yang sama sekali berbeza. Pilihan yang tepat bergantung pada cara anda merancang untuk menggunakan papan tersebut.</p>

  <table>
    <tr><th>Faktor</th><th>SUP Boleh Tiup</th><th>SUP Keras</th></tr>
    <tr><td>Binaan</td><td>PVC drop-stitch, dilambung sehingga 12-15 PSI</td><td>Teras buih EPS bersalut gentian kaca atau epoksi</td></tr>
    <tr><td>Berat</td><td>18-28 lbs (papan sahaja)</td><td>20-30 lbs (papan sahaja)</td></tr>
    <tr><td>Saiz Bungkusan</td><td>Beg galas (30 x 15 x 10 inci)</td><td>Panjang penuh (10-14 kaki)</td></tr>
    <tr><td>Persediaan</td><td>Pelambungan 3-5 minit</td><td>Sedia digunakan</td></tr>
    <tr><td>Hayat</td><td>5-10 tahun dengan penjagaan</td><td>3-8 tahun (mudah bentur)</td></tr>
  </table>

  <h2>Keboleh Alih</h2>
  <p><strong>Boleh tiup menang.</strong> Ini ialah kelebihan paling ketara. SUP boleh tiup dibungkus ke dalam beg galas yang muat dalam but kereta, almari pangsapuri atau ruang bagasi atas kapal terbang. Pengembara, penghuni pangsapuri dan sesiapa tanpa penyimpanan rak bumbung akan mendapati SUP boleh tiup jauh lebih praktikal.</p>
  <p>Papan keras memerlukan rak bumbung, kenderaan besar atau ruang penyimpanan khusus. Ia sukar diangkut dan tidak boleh dibawa menaiki kapal terbang tanpa kes penghantaran khusus.</p>

  <h2>Ketahanan</h2>
  <p><strong>Boleh tiup menang.</strong> SUP boleh tiup diperbuat daripada PVC gred tentera yang menahan hentaman, torehan dan kerosakan UV. Apabila anda menjatuhkan papan boleh tiup atau melanggar batu, ia melantun. Papan keras akan tercalar, retak atau mengelupas akibat hentaman yang sama.</p>
  <p>Papan keras lebih terdedah kepada haus dan lusuh harian. Satu kali terjatuh di atas konkrit boleh menyebabkan benturan kekal yang menjejaskan prestasi dan membenarkan kemasukan air.</p>

  <h2>Prestasi</h2>
  <p><strong>Papan keras menang di peringkat tertinggi.</strong> Untuk pendayungan rekreasi dan lawatan pada kelajuan sederhana, kedua-dua jenis papan berprestasi serupa. Papan keras mempunyai kelebihan dalam:</p>
  <ul>
    <li><strong>Kelajuan</strong> — Papan keras lebih ringan dan lebih kaku, menjadikan luncuran lebih baik dan kelajuan tertinggi lebih tinggi</li>
    <li><strong>Luncuran air</strong> — Papan keras menawarkan peralihan rel-ke-rel lebih responsif dan prestasi ombak lebih baik</li>
    <li><strong>Perlumbaan</strong> — Perlumbaan kompetitif hampir sepenuhnya menggunakan papan keras kerana kelebihan berat dan kekakuannya</li>
  </ul>
  <p>Bagi pendayung rekreasi biasa, perbezaan prestasi ini adalah marginal. Kebanyakan pendayung tidak akan mengatasi prestasi papan boleh tiup yang berkualiti.</p>

  <h2>Kemesraan Pemula</h2>
  <p><strong>Boleh tiup menang.</strong> SUP boleh tiup lebih mudah bagi pemula kerana:</p>
  <ul>
    <li>Permukaan dek yang lebih lembut lebih selesa dan kurang berkemungkinan menyebabkan kecederaan semasa terjatuh</li>
    <li>Papan boleh tiup yang lebih lebar dan tebal menawarkan kestabilan utama lebih baik</li>
    <li>Kos pelaburan lebih rendah menjadikan kemasukan lebih mudah</li>
    <li>Pengangkutan mudah bermakna lebih banyak peluang untuk mendayung</li>
  </ul>

  <h2>Penyimpanan dan Penyelenggaraan</h2>
  <p>SUP boleh tiup memerlukan pengeringan dan pelipatan betul sebelum disimpan. Papan keras boleh disimpan terpasang tetapi memerlukan perlindungan daripada matahari, haba dan hentaman. Kedua-duanya mendapat manfaat daripada pembilasan dengan air tawar selepas kegunaan air masin.</p>

  <h2>Syor</h2>
  <p><strong>Pilih SUP boleh tiup jika:</strong> Anda bercuti, mempunyai penyimpanan terhad, mendayung secara rekreasi atau seorang pemula. 90% pendayung akan dilayan dengan baik oleh papan boleh tiup yang berkualiti.</p>
  <p><strong>Pilih papan keras jika:</strong> Anda berlumba secara kompetitif, meluncur ombak lanjutan atau mengutamakan prestasi maksimum berbanding keboleh alih dan ketahanan.</p>

  <h2>FAQ</h2>
  <h3>Manakah lebih tahan lama: SUP boleh tiup atau keras?</h3>
  <p>SUP boleh tiup secara amnya lebih tahan lama kerana ia menahan benturan, keretakan dan kerosakan hentaman yang akan merosakkan papan keras secara kekal.</p>

  <h3>Adakah SUP boleh tiup lebih baik untuk pemula?</h3>
  <p>Ya. SUP boleh tiup disyorkan untuk pemula kerana ia lebih memaafkan, lebih mudah diangkut dan kurang berkemungkinan menyebabkan kecederaan semasa terjatuh.</p>

  <h3>Bolehkah SUP boleh tiup berprestasi sebaik papan keras?</h3>
  <p>Untuk pendayungan rekreasi dan lawatan, SUP boleh tiup setara dengan prestasi papan keras. Papan keras masih cemerlang dalam perlumbaan dan luncuran air lanjutan kerana beratnya yang lebih ringan dan lenturan yang diperhalusi.</p>

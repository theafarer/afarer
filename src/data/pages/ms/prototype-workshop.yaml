intro: 'Model CAD, tidak kira seberapa terperinci, tidak dapat mendedahkan bagaimana papan sebenarnya dikendalikan sehingga ia bertemu air. Itulah sebabnya Bengkel Prototaip kami direka untuk menterjemah data kejuruteraan menjadi papan fizikal yang sedia air secepat dan setepat mungkin. Setiap model Afarer baharu — dan setiap binaan tersuai yang penting — melalui bengkel ini sebelum peralatan pengeluaran dikomitmenkan.'

content_html: |
  <h2>Di mana reka bentuk menjadi realiti</h2>
  <p>Bengkel ini dilengkapi sepenuhnya untuk fabrikasi serentak lambung, rel dan perkakasan. Pendekatan aliran kerja selari ini memendekkan masa tertib prototaip kepada 8-12 minggu daripada pelepasan kejuruteraan, berbanding norma industri 16-20 minggu. Apabila aplikasi anda menuntut penyelesaian khusus, kami boleh bergerak daripada konsep kepada pengesahan di air dalam masa kurang daripada tiga bulan.</p>

  <h2>Keupayaan bengkel</h2>
  <table>
    <thead><tr><th>Stesen Kerja</th><th>Peralatan</th><th>Tujuan</th></tr></thead>
    <tbody>
      <tr><td>Fabrikasi lambung</td><td>Pemotong fabrik CNC, mesin tekan laminasi haba, stesen penyediaan teras drop-stitch</td><td>Pengeluaran lambung skala penuh dalam ketiga-tiga jenis binaan</td></tr>
      <tr><td>Pemasangan rel &amp; kebuk</td><td>Mesin tekan kimpalan RF, stesen penackeran udara panas, jig ujian pelambungan</td><td>Fabrikasi pemasangan rel dan kebuk saiz penuh dengan semua diafragma dan injap</td></tr>
      <tr><td>Perkakasan &amp; kelengkapan</td><td>Jig pemasangan kotak sirip, kelengkapan kimpalan pelekat kargo dan pemegang, stesen pemotongan pad dek</td><td>Kelengkapan penuh: sirip, pelekat kargo, palam tali, pemegang, pad dek, injap</td></tr>
      <tr><td>Bay instrumentasi</td><td>Penderia kelajuan GPS, transduser tekanan, akselerometer, tatasusunan termoganding, perekod data</td><td>Pemasangan dan penentukuran instrumentasi ujian laut</td></tr>
    </tbody>
  </table>

  <h2>Perjalanan prototaip — langkah demi langkah</h2>
  <ol>
    <li><strong>Serahan kejuruteraan</strong> — Pakej reka bentuk (model 3D, laporan FEA, senarai bahan, jadual susunan lapisan) disemak secara rasmi oleh ketua bengkel dan jurutera projek. Sebarang kebimbangan pembuatan ditandakan dan diselesaikan sebelum pemotongan bermula.</li>
    <li><strong>Pengeluaran lambung</strong> — Lambung dibina mengikut spesifikasi kejuruteraan. Bagi binaan lapisan tunggal: teras drop-stitch dilaminasi dengan kulit PVC yang dinyatakan. Bagi binaan lapisan berganda: kulit tambahan disapu ke atas laminat asas sebelum corak dipotong. Bagi binaan terlakur: parameter laminasi dimuatkan daripada helaian proses yang diluluskan dan disahkan pada kupon pertama.</li>
    <li><strong>Fabrikasi rel</strong> — Fabrik dipotong menggunakan templat corak CNC, kemudian dikimpal RF menjadi rel dan kebuk saiz penuh. Setiap kebuk dilambung kepada tekanan ujian dan dibiarkan selama 24 jam untuk penstabilan awal.</li>
    <li><strong>Pemasangan &amp; perkakasan</strong> — Lambung dan rel disatukan. Kotak sirip dan pelekat kargo dipasang, palam tali dan pemegang angkut dipasang, injap pelambungan diketatkan, dan pad dek disapu serta dijajarkan.</li>
    <li><strong>Ujian statik</strong> — Sebelum papan menyentuh air, ia menjalani: semakan keapungan (beban penuh + 30 % rizab), ujian tahan tekanan kebuk, ujian kebocoran injap, ujian tarikan pemegang dan pelekat.</li>
    <li><strong>Program ujian laut</strong> — 20 jam ujian dalam air, diperincikan di bawah.</li>
    <li><strong>Semakan prototaip</strong> — Mesyuarat pengesahan rasmi diadakan dengan pasukan kejuruteraan, pengeluaran dan kualiti. Sebarang perubahan reka bentuk yang diperlukan didokumenkan dan digabungkan ke dalam pelepasan pengeluaran.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Program Ujian Laut 20 Jam — Jadual Ujian</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 j</span>
        <span class="flex-1">Penyesuaian air tenang — penjejakan kelajuan rendah, pusingan, semakan postur dan imbangan</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 j</span>
        <span class="flex-1">Ujian kelajuan — kelajuan tertinggi disahkan GPS, kelajuan pelayaran, rentak berterusan pada 3 kadar dayungan</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 j</span>
        <span class="flex-1">Ujian pusingan — radius pusingan pangsi dan pusingan sapuan, respons papan, sebelah kiri dan kanan</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 j</span>
        <span class="flex-1">Ujian ombak pecah — larian berulang merentasi ombak pecah 0.5–1.0 m; akselerometer pada kedudukan postur penunggang</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 j</span>
        <span class="flex-1">Ujian kestabilan — sudut senget statik dengan 4 penunggang bagi berat berbeza, beban ofset ke sebelah kanan</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 j</span>
        <span class="flex-1">Larian ketahanan — 3 jam berterusan pada rentak pelayaran; pemantauan tekanan kebuk, suhu rel dan keletihan penunggang</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 j</span>
        <span class="flex-1">Pemeriksaan akhir — pemeriksaan pasca-ujian semua komponen, ketatkan/semak semua pengikat, dokumenkan penemuan</span>
      </div>
    </div>
  </div>

  <h2>Pemprototaipan tersuai bagi aplikasi unik</h2>
  <p>Bengkel Prototaip ialah tempat kami menyelesaikan masalah yang tidak mampu ditangani oleh papan pengeluaran standard. Contoh terkini termasuk:</p>
  <ul>
    <li>SUP penyelamatan ketara-nyata bagi sebuah organisasi cari-dan-selamat, memerlukan pemegang cengkam bersepadu, pelekat peralatan bagi kelengkapan penyelamatan dan lambung keapungan tinggi bagi pemulihan mangsa — semuanya diprototaipkan, dipasang dan diuji di kemudahan kami.</li>
    <li>SUP lawatan ekspedisi bagi sebuah kontraktor tinjauan hidrografi, dengan tiang instrumen boleh tanggalkan, port peralatan berkedap dan pelekat transducer berprofil rendah yang direka untuk meminimumkan seretan.</li>
    <li>SUP memancing kompak bagi armada taman peranginan, di mana prototaip digunakan untuk mengesahkan kestabilan, perkakasan peralatan dan ketahanan dalam kegunaan sewaan harian sebelum pelanggan membuat komitmen terhadap armada empat unit.</li>
  </ul>

  <h2>Pasukan pemprototaipan kami</h2>
  <p>Bengkel ini dikendalikan oleh lapan juruteknik marin pelbagai kemahiran, setiap seorang dilatih silang dalam sekurang-kurangnya dua daripada tiga disiplin teras (lambung, rel, perkakasan). Ketua pasukan ialah pengfabrik induk dengan 16 tahun pengalaman merangkumi binaan tersuai sekali-sekala hingga siri pengeluaran. Setiap prototaip diberikan seorang jurutera projek khusus yang menjadi titik hubungan tunggal bagi pelanggan sepanjang proses binaan dan ujian.</p>

  <h2>Penglibatan pelanggan</h2>
  <p>Kami aktif menggalakkan pelanggan kami menghadiri peristiwa penting semasa binaan prototaip — terutamanya semakan kelengkapan awal dan ujian laut. Maklum balas operasi anda semasa peringkat ini sangat bernilai dalam menala halus papan sebelum ia memasuki pengeluaran. Kami tidak membina secara terasing; kami membina secara perkongsian dengan anda.</p>
  <p>Ujian laut 20 jam juga merupakan peluang bagi pasukan anda untuk membiasakan diri dengan pengendalian papan, susun atur dek dan keperluan penyelenggaraan, memastikan peralihan lancar ke perkhidmatan apabila papan pengeluaran dihantar.</p>


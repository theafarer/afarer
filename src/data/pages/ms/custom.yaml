hero:
  tagline: afarer Custom Lab
  title: 'Rekabentuk Papan SUP<br />Anda Sendiri'
  subtitle: 'Rakan SUP tersuai yang menawarkan pengeluaran papan dayung bersama-jenama, label peribadi, dan khas untuk perniagaan di seluruh dunia. Daripada satu prototaip hingga pengeluaran penuh.'
  cta: 'Mulakan projek anda'
  footer_link: /contact

steps_section:
  tagline: 'Cara ia berfungsi'
  title: 'Daripada konsep ke pengeluaran'
  subtitle: 'Empat langkah daripada idea anda kepada produk siap yang sedia ke laut.'
  steps:
    - num: '01'
      title: 'Pilih Papan Anda'
      desc: 'Pilih daripada model teras SUP kami — all-around, touring, yoga, sukan, atau kanak-kanak. Pilih saiz, bahan, dan warna.'
    - num: '02'
      title: 'Muat Naik Reka Bentuk Anda'
      desc: 'Hantar logo, kerja seni, atau garis panduan jenama anda kepada kami. Pasukan reka bentuk kami menyediakan bukti digital.'
    - num: '03'
      title: 'Semakan Mockup AI'
      desc: 'Lihat mockup fotorealistik dijana AI bagi papan tersuai anda sebelum pengeluaran bermula.'
    - num: '04'
      title: 'Pengeluaran & Penghantaran'
      desc: 'Selepas diluluskan, pesanan anda memasuki lini pengeluaran kami. Tempoh pengeluaran daripada 30 hari.'

services_section:
  tagline: 'Perkhidmatan'
  title: 'Perkhidmatan pembuatan untuk jenama global'
  subtitle: 'Model pelibatan yang fleksibel — daripada pembuatan kontrak hingga pembinaan jenama perkhidmatan penuh.'
  items:
    - title: 'Pengeluaran Bersama-Jenama'
      desc: 'Kami mengeluarkan reka bentuk anda mengikut spesifikasi — IP anda, lukisan anda, piawaian kualiti anda. Perlindungan NDA yang penuh.'
      icon: ⚙️
    - title: 'Penyelesaian Reka Bentuk'
      desc: 'Pilih daripada 50+ platform terbukti dan sesuaikan saiz, warna, grafik, dan pembungkusan.'
      icon: '🎨'
    - title: 'Label Peribadi'
      desc: 'Jenama anda pada produk kami — logo, pembungkusan, tag gantung, manual. Sedia runcit terus dari kotak.'
      icon: '🎨'
    - title: 'Penjenamaan Tersuai'
      desc: 'Percetakan pad dek, grafik lunas, decal tiub, dan label tersuai — integrasi jenama penuh.'
      icon: ⚙️

capabilities_section:
  tagline: 'Keupayaan'
  title: 'Keupayaan pengeluaran & penyesuaian'
  subtitle: 'Semua yang anda perlu tahu sebelum membuat pesanan.'
  capabilities:

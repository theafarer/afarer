    - label: 'Tempoh pengeluaran'
      value: '30–45 hari standard; 15–20 hari untuk prototaip'
    - label: 'Penyesuaian'
      value: 'Saiz, bentuk, warna, grafik, pembungkusan, perkakasan'
    - label: 'Bahan'
      value: 'PVC, drop-stitch, EVA, aluminium'
    - label: 'Percetakan'
      value: 'Digital (CMYK), cetak saring, pemindahan haba, sublimasi'
    - label: 'Pensijilan'
      value: 'CE, UKCA, FCC (sokongan untuk pematuhan global)'


features:
  title: 'Mengapa Bekerjasama Dengan Afarer'
  subtitle: 'Model satu-negara-satu-pengedar dengan struktur sokongan untuk menjadikan wilayah tersebut menguntungkan. Eksklusiviti perlu dijana dan dikekalkan — bukan hak kekal.'
  columns: 3
  items:
    - title: 'Eksklusiviti Wilayah'
      description: 'Satu pengedar dibenarkan bagi setiap negara atau wilayah. Tiada import selari, tiada persaingan dalaman. Pelaburan anda membina benteng anda sendiri.'
      icon: 'tabler:shield-check'
    - title: 'Perlindungan Konflik Saluran'
      description: 'Pesanan terus dari wilayah anda disalurkan melalui anda, dan harga melindungi margin anda. Afarer tidak menjual di sekitar rakan kongsi negaranya.'
      icon: 'tabler:users'
    - title: 'Margin Terus-dari-Kilang & Rebat'
      description: 'Senarai harga peniaga dengan rebat atas volum komited. Tiada orang tengah. Penghantaran FOB Qingdao dengan dokumentasi eksport penuh.'
      icon: 'tabler:coins'
    - title: 'Program Sokongan Rakan Kongsi 10 Modul'
      description: 'Onboarding, go-to-market, latihan, pemasaran dan dana pasaran bersama, alat ganti dan pascajual, waranti, alat pesanan, dan portal rakan kongsi — diliputi dalam Perjanjian Pengedaran anda.'
      icon: 'tabler:rocket'
    - title: 'Pemasaran & Dana Pasaran Bersama'
      description: 'Aset kempen setempat, bahan POS peniaga, kit acara, kandungan digital dalam pelbagai bahasa, dan sokongan pemasaran bersama untuk musim pelancaran.'
      icon: 'tabler:mood-smile'
    - title: 'Latihan Produk, Jualan & Teknikal'
      description: 'Sesi onboarding berstruktur tentang produk, jualan, dan pengetahuan teknikal, dengan bahan yang dikemas kini seiring perkembangan julat produk.'
      icon: 'tabler:presentation'
    - title: 'Alat Ganti & Sokongan Pascajual'
      description: 'Bekalan alat ganti, pendaftaran waranti dan pengendalian tuntutan, serta lembaran data produk dan manual untuk pasukan servis tempatan anda.'
      icon: 'tabler:settings'
    - title: 'Pengurus Akaun Khusus & Portal Rakan Kongsi'
      description: 'Pengurus pengedar peribadi serta akses kepada senarai harga, status pesanan, dan sumber pemasaran melalui portal rakan kongsi Afarer.'
      icon: 'tabler:user-check'

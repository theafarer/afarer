faqs:
  title: 'Perkongsian Negara — Soalan Lazim'
  subtitle: 'Soalan yang ditanya oleh rakan kongsi negara yang serius sebelum memohon.'
  items:
    - title: 'Apakah maksud sebenar satu-negara-satu-pengedar?'
      description: 'Afarer melantik satu pengedar yang dibenarkan dengan hak eksklusif bagi wilayah yang ditetapkan. Kami tidak menjual daripada saluran global atau serantau kami ke dalam negara yang dilindungi. Pemilikan wilayah anda kekal selagi Perjanjian Pengedaran dipatuhi.'
    - title: 'Adakah wilayah eksklusif selama-lamanya?'
      description: 'Tidak. Eksklusiviti bersifat bersyarat, bukan abadi. Ia dikekalkan melalui Perjanjian Pengedaran yang ditandatangani, penyiapan pesanan pertama anda, sasaran pembelian tahunan, stok tempatan, keupayaan pascajual, dan pelaburan pasaran berterusan. Jika syarat ini tidak dipenuhi, wilayah boleh dirunding semula atau ditugaskan semula.'
    - title: 'Berapakah pesanan pertama minimum?'
      description: 'Pengedar negara dan wilayah bermula pada 100–300 unit; peniaga dibenarkan pada 30–50 unit; pesanan percubaan dari 10–30 unit membolehkan anda mengesahkan pasaran terlebih dahulu (pesanan percubaan dan sampel tidak membawa perlindungan wilayah). Program tersuai dan label peribadi mengikut MOQ berasingan yang disenaraikan dalam tahap di atas.'
    - title: 'Sokongan apa yang termasuk dalam program sokongan 10 modul?'
      description: 'Tahap dan kelayakan, perlindungan wilayah, MOQ / harga / rebat tahunan, inventori dan pelaksanaan pesanan, aset pemasaran dan dana pasaran bersama, latihan produk / jualan / teknikal, alat ganti dan pascajual, pendaftaran waranti, portal rakan kongsi, serta lembaran data produk, pustaka aset pemasaran, jadual rebat tahunan, dan senarai penghantaran dan pembungkusan.'
    - title: 'Bagaimanakah Afarer melindungi saya daripada konflik saluran?'
      description: 'Setiap wilayah mempunyai tepat satu pengedar yang dibenarkan. Pertanyaan dan pesanan terus dari wilayah anda disalurkan melalui anda, borang laman web dikemukakan kepada rakan kongsi tempatan di mana ia wujud, dan pasukan global hanya melakukan eskalasi apabila rakan kongsi tidak membalas.'
    - title: 'Apakah terma penghantaran dan pembayaran?'
      description: 'Pesanan dihantar FOB Qingdao dengan dokumentasi eksport penuh. Pesanan pengeluaran memerlukan deposit 30% dengan 70% sebelum penghantaran; pesanan percubaan dan sampel dibayar terdahulu. Tempoh pengeluaran standard ialah 30–45 hari bekerja, dengan 15–20 hari bekerja untuk jalanan sampel.'
    - title: 'Bagaimanakah cara saya memohon?'
      description: 'Hantar permohonan anda melalui borang hubungan beserta butiran pasaran. Kami menyemak kesesuaian pasaran, kehadiran runcit, dan keupayaan logistik, kemudian membalas dalam masa 3 hari bekerja dengan langkah seterusnya dan draf Perjanjian Pengedaran.'

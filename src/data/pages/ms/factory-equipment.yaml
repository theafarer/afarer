meta:
  title: 'Peralatan Kilang — Pemotongan, Kimpalan RF & Percetakan | {SITE}'
  description: 'Peralatan pembuatan afarer gred industri: pemotongan PVC, kimpalan RF, percetakan digital, pemasangan dan pengujian bagi SUP boleh tiup.'
  keywords:
    - 'peralatan pembuatan sup'
    - 'kilang sup boleh tiup'
    - 'kimpalan rf pvc'
    - 'pengeluaran papan dayung'
hero:
  tagline: 'Peralatan'
  title: 'Peralatan & Jentera Pembuatan'
  subtitle: 'Peralatan gred industri merentasi pemotongan, kimpalan, percetakan dan pemasangan'
  back_label: 'Kembali ke Kilang'
  back_link: /factory

categories:
  - title: 'Pemotongan & Penyediaan Bahan'
    items:
      - name: 'Mesin Pemotong PVC Automatik'
        spec: 'Kawalan CNC, 6.5 m × 2.5 m, ketepatan 0.1 mm'
        desc: 'Mesin pemotong automatik terkawal komputer bagi fabrik PVC dan drop-stitch. Perisian penyusunan mengoptimumkan penggunaan bahan kepada sisa di bawah 5%.'
      - name: 'Mesin Sebar Fabrik'
        spec: 'Lebar maksimum 3 m, suapan terkawal tegangan'
        desc: 'Menyusun fabrik dalam satu atau berbilang lapisan dengan tegangan terkawal untuk mengelakkan herotan sebelum pemotongan.'

  - title: 'Kimpalan & Pengikatan Tiub'
    items:
      - name: 'Mesin Perapatan Haba'
        spec: 'Kimpalan udara panas, boleh ubah 200–600 °C, 0.5–5 m/min'
        desc: 'Mesin perapatan haba udara panas untuk mengikat dan mengimpal PVC serta jahitan rel. Digunakan untuk penackeran, perapatan dan pelakuran kebuk tiub dan sambungan apung.'
      - name: 'Mesin Tekan RF Dielektrik'
        spec: '15 kW, plat 2000 × 600 mm'
        desc: 'Mesin tekan kimpalan frekuensi radio bagi jahitan membujur utama, jalur rel dan fabrikasi kebuk besar.'
      - name: 'Pengimpal RF Terkawal CNC'
        spec: '8 kW, meja XY 2500 × 1200 mm'
        desc: 'Kimpalan jahitan melengkung boleh atur cara bagi geometri kompleks, timbulan logo dan kerja tampalan berketepatan.'

  - title: 'Pembuatan Papan SUP'
    items:
      - name: 'Mesin Tekan Laminasi Teras Drop-Stitch'
        spec: 'Mesin tekan format besar bagi teras papan sehingga 14 ft LOA'
        desc: 'Laminasi berketepatan teras drop-stitch kepada laminat PVC luar. Setiap lapisan diikat dengan tekanan untuk kualiti dan kekuatan konsisten.'
      - name: 'Penghala CNC (5-paksi)'
        spec: 'Saiz kerja 3 m × 2 m × 1 m, spindel penyejuk air'
        desc: 'Pemesinan kotak sirip, potongan pemegang dan komponen papan tersuai.'

  - title: 'Percetakan & Hiasan SUP'
    items:
      - name: 'Pencetak Digital'
        spec: 'Inkjet resolusi tinggi, lebar cetak sehingga 2 m'
        desc: 'Percetakan digital terus-ke-fabrik bagi grafik dek SUP warna penuh. Mencetak corak tersuai, kecerunan dan imej berkualiti foto dengan dakwa berasaskan air rintang UV.'
      - name: 'Mesin Cetakan Sutera Saring'
        spec: 'Manual dan separa automatik, pendaftaran berbilang warna'
        desc: 'Cetakan sutera saring bagi logo papan SUP, tanda jenama dan corak berulang. Menghasilkan cetakan tahan lama dan legap dengan tepu warna cerah.'

  - title: 'Pemasangan & Kelengkapan'
    items:
      - name: 'Stesen Pemasangan Papan'
        spec: 'Modul boleh laras, susun atur berbilang stesen'
        desc: 'Pemasangan kotak sirip, pemegang, D-ring, injap dan pad dek pada papan SUP.'
      - name: 'Mesin Tekan Pemasangan Injap'
        spec: 'Pneumatik, tekanan boleh laras'
        desc: 'Pemasangan dan perapatan berketepatan injap Halkey-Roberts dan Leafield.'
      - name: 'Pelaminator Pad Dek'
        spec: '3 m × 1.5 m, terkawal suhu'
        desc: 'Laminasi haba pad dek buih EVA ke bahagian atas papan SUP dengan kekuatan ikatan konsisten.'

  - title: 'Pengujian & Kawalan Kualiti'
    items:
      - name: 'Penguji Tegangan Universal'
        spec: '50 kN, ASTM D751'
        desc: 'Ujian daya pemutusan, pemanjangan semasa putus dan perambatan koyakan bagi kelompok fabrik.'
      - name: 'Rangka Ujian Pengekalan Udara'
        spec: 'Boleh atur cara, tahan tekanan 30 minit'
        desc: 'Ujian tahan tekanan automatik bagi setiap kebuk tiub sebelum pemasangan.'
      - name: 'Penguji Pengelupasan Jahitan'
        spec: 'Pengelupasan 180° bermotor pada 100 mm/min'
        desc: 'Ujian kekuatan pengelupasan jahitan kimpalan dan lekat mengikut EN ISO 25649.'
      - name: 'Kebuk Luluhawa Arka Xenon'
        spec: 'Pendedahan 2000 jam'
        desc: 'Ujian rintangan UV bagi perubahan warna dan pengekalan kekuatan.'


philosophy:
  tagline: 'Falsafah Reka Bentuk'
  title: 'Reka Bentuk Diterajui Kejuruteraan<br />— Setiap Butiran Penting'
  subtitle: 'Falsafah kejuruteraan kami berpaksikan tiga prinsip yang memandu setiap produk yang kami bina.'
  list:
    - 'Kebolehpercayaan Didahulukan: Setiap produk afarer diuji untuk menahan keadaan dunia sebenar — daripada operasi penyelamatan air sejuk sehingga sewaan resort tropika. Kami merekayasa secara melampaui di perkara yang paling penting.'
    - 'Ketepatan Pembuatan: Kemudahan kami menggunakan pemotongan CNC, kimpalan frekuensi tinggi, dan ujian tekanan automatik. Setiap jahitan, setiap injap, setiap kelengkapan memenuhi spesifikasi yang didokumenkan.'
    - 'Inovasi Berterusan: Pasukan R&D kami menilai bahan baharu, kaedah pengeluaran, dan penambahbaikan reka bentuk secara berterusan. Kami tidak menunggu masalah timbul — kami mengantisipasinya.'
cta:

meta:
  title: 'Pensijilan — CE, ISO 9001 & Pematuhan | {SITE}'
  description: 'Pensijilan kualiti afarer: CE (EN ISO 25649), ISO 9001:2015, BSCI. Pematuhan dan keselamatan untuk pengilang SUP boleh tiup.'
  keywords:
    - 'pensijilan ce sup'
    - 'iso 9001 sup'
    - 'pematuhan nautika'
    - 'pensijilan papan dayung'
hero:
  tagline: 'Pensijilan & Piawaian'
  title: 'Pensijilan Kualiti<br />& Piawaian Pematuhan'
  subtitle: 'Pembuatan SUP afarer disahkan mengikut piawaian keselamatan marin antarabangsa, sistem pengurusan kualiti, dan peraturan alam sekitar — CE, ISO 9001, UKCA, BSCI, dan REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'pensijilan kualiti afarer dan dokumentasi pematuhan'
content_certifications:
  tagline: 'Pensijilan Kami'
  title: 'Kualiti Tersijil,<br />Diakui di Peringkat Global'
  subtitle: 'Setiap produk afarer disokong oleh pensijilan yang menunjukkan komitmen kami terhadap kualiti, keselamatan, dan tanggungjawab alam sekitar.'
  items:
    - title: 'Tersijil CE'
      description: 'Semua produk afarer mematuhi keperluan penandaan CE Eropah untuk kraf air rekreasi, memastikan piawaian keselamatan, kesihatan, dan perlindungan alam sekitar dipenuhi.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Sistem pengurusan kualiti kami tersijil ISO 9001:2015, merangkumi reka bentuk, pembuatan, dan pengedaran kenderaan air boleh tiup serta peralatan marin.'
      icon: tabler:clipboard-check
    - title: 'Penandaan UKCA'
      description: 'Produk yang dijual di pasaran UK membawa penandaan UKCA, mengesahkan pematuhan dengan peraturan UK bagi peralatan marin dan kraf air peribadi.'
      icon: tabler:shield
    - title: 'Patuh BSCI'
      description: 'afarer diaudit BSCI (Business Social Compliance Initiative), menunjukkan amalan pembuatan yang beretika, keadaan buruh yang adil, dan tanggungjawab rantai bekalan.'
      icon: tabler:heart-handshake
    - title: 'Patuh REACH'
      description: 'Semua bahan yang digunakan dalam produk afarer mematuhi peraturan REACH EU untuk keselamatan kimia, memastikan tiada bahan terhad dalam PVC, EVA, atau komponen kami.'
      icon: tabler:flask
    - title: 'Pengujian Bahan'
      description: 'Fabrik diuji untuk kekuatan tegangan, rintangan koyakan, degradasi UV, dan prestasi retak-sejuk. Setiap kelompok pengeluaran disampel dan disahkan.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Piawaian Kilang'
  title: 'Kecemerlangan Pembuatan<br />— Dibina Mengikut Spesifikasi'
  subtitle: 'Kemudahan kami seluas 12,000 m² beroperasi di bawah protokol kawalan kualiti yang ketat pada setiap peringkat pengeluaran.'
  list:
    - 'Pemeriksaan Bahan Masuk: Semua bahan mentah — fabrik PVC, buih EVA, pelekat, perkakasan — diuji terhadap spesifikasi sebelum memasuki pengeluaran.'
    - 'Kawalan Kualiti Dalam Proses: Setiap peringkat pengeluaran mempunyai titik semakan QC yang didokumenkan. Kekuatan kimpalan, penjajaran jahitan, pemasangan injap, dan tork kelengkapan disahkan dalam talian.'
    - 'Ujian Tekanan: Setiap kebuk boleh tiup diuji tekanan pada tekanan nominal 1.25× selama 24–48 jam. Kejatuhan tekanan mesti kekal di bawah 5% untuk lulus.'
    - 'Pemeriksaan Akhir: Produk siap diperiksa untuk ketepatan dimensi, kemasan kosmetik, kelengkapan aksesori, dan integriti pembungkusan sebelum dihantar.'
    - 'Kebolehsurihan Kelompok: Setiap produk membawa nombor siri yang dipautkan kepada rekod kelompok pengeluaran, membolehkan kebolehsurihan penuh daripada bahan mentah hingga barang siap.'
content_safety:
  tagline: 'Piawaian Keselamatan Marin'
  title: 'Keselamatan Didahulukan<br />— Direka untuk Operasi yang Boleh Dipercayai'
  subtitle: 'Produk afarer direka dan diuji untuk memenuhi piawaian keselamatan marin antarabangsa bagi penggunaan komersial dan rekreasi.'
  items:
    - title: 'EN ISO 25649'
      description: 'SUP boleh tiup mematuhi piawaian EN ISO 25649 untuk pembinaan, kestabilan, keapungan, dan kapasiti beban.'
      icon: tabler:sailboat
    - title: 'Pematuhan SOLAS'
      description: 'Peralatan keselamatan dan peralatan menyelamat nyawa memenuhi keperluan SOLAS (Safety of Life at Sea) jika terpakai.'
      icon: tabler:lifebuoy

qc_section:
  tagline: 'Kawalan Kualiti'
  title: 'Proses Pengujian & Jaminan Kualiti'
  subtitle: 'Setiap papan menjalani ujian wajib sebelum dihantar. Makmal kualiti kami beroperasi secara bebas daripada pengeluaran dan melapor terus kepada pengurusan.'
  steps:
    - step: '1'
      title: 'Pemeriksaan Bahan Mentah'
      desc: 'Fabrik PVC dan drop-stitch menjalani ujian tegangan (ASTM D751), perambatan koyakan, dan pengesahan rintangan UV sebelum mana-mana kelompok memasuki pengeluaran.'
    - step: '2'
      title: 'Ujian Penahanan Udara 24–48 Jam'
      desc: 'Setiap kebuk tiub ditidakkan kepada 125% daripada tekanan nominal dan ditahan selama 24–48 jam. Kejatuhan tekanan melebihi 5% mencetuskan penolakan automatik dan pemeriksaan semula jahitan.'
    - step: '3'
      title: 'Ujian Beban & Keseimbangan'
      desc: 'Papan yang siap dimuatkan sehingga kapasiti nominal maksimum dan diuji untuk kestabilan dan kekakuan. Setiap papan diuji dalam air sebelum pemeriksaan akhir.'

oem_section:
  tagline: 'Projek OEM'
  title: 'Kajian Kes Perkongsian Jenama & OEM'
  subtitle: 'Daripada konsep ke kontena — bagaimana kami membantu jenama global melancarkan dan mengembangkan lini SUP boleh tiup mereka.'
  cases:
    - challenge: 'Peruncit luar rumah Eropah memerlukan lini SUP label peribadi dengan grafik dek unik, PVC mesra alam, dan pembungkusan sedia runcit — semuanya dihantar dalam masa 60 hari.'
      solution: 'Membangunkan fail cetakan digital tersuai, mendapatkan PVC yang patuh REACH, dan memampatkan pensampelan daripada 3 pusingan kepada 1 dengan mengopuskan pasukan reka bentuk di kilang Qingdao kami.'
      result: '55 hari daripada PO ditandatangani hingga FOB. 2,400 unit merentas 4 SKU. Pesanan berulang dibuat sebelum kontena pertama tiba.'
    - challenge: 'Syarikat permulaan sukan air AS memerlukan SUP drop-stitch berprestasi tinggi dengan bentuk tersuai, pembungkusan jenama bersama, dan pensijilan BSCI untuk penempatan runcit.'
      solution: 'Menyesuaikan acuan SUP sedia ada dengan garis luar yang diubah suai, membangunkan kerja seni pembungkusan jenama bersama, dan menyediakan dokumentasi audit BSCI yang penuh.'
      result: 'Berjaya disenaraikan di 3 rantaian luar rumah utama AS. 5,000+ unit pada tahun pertama dengan kadar jualan penuh 98%.'
    - challenge: 'Pengedar Australia memerlukan julat SUP tersijil CE dengan warna tersuai dan pematuhan kepada piawaian Australia.'
      solution: 'Menghasilkan sampel prak-pengeluaran dengan 4 varian warna dan menyelaraskan ujian pematuhan pihak ketiga.'
      result: 'Julat SUP 3 model dilancarkan di pasaran AU/NZ. Diikuti kemenangan tender kerajaan untuk 12 SUP rondaan.'

faq_section:
  tagline: 'Soalan Lazim'
  title: 'Soalan Lazim B2B & OEM'
  questions:
    - q: 'Berapakah kuantiti pesanan minimum (MOQ) untuk papan SUP boleh tiup OEM?'
      a: 'MOQ bermula pada 5–10 unit untuk model OEM standard. Acuan tersuai dan projek label peribadi memerlukan minimum 200 unit bergantung pada kerumitan. Pesanan percubaan dan jalanan sampel tersedia untuk pelancaran jenama baharu.'
    - q: 'Adakah afarer memegang pensijilan BSCI?'
      a: 'Ya. Kilang kami mengekalkan pensijilan pematuhan sosial BSCI yang sah (laporan audit tersedia atas permintaan). Kami turut memegang ISO 9001 untuk pengurusan kualiti dan semua produk membawa pensijilan CE. Dokumentasi pematuhan REACH dan RoHS disertakan dengan setiap penghantaran OEM.'
    - q: 'Berapakah tempoh pengeluaran biasa untuk pesanan OEM?'
      a: 'Tempoh pengeluaran standard ialah 30–45 hari daripada PO disahkan dan deposit untuk pengeluaran OEM pukal. Pembangunan acuan tersuai menambah 15–20 hari untuk peralatan. Pengeluaran dipercepat tersedia untuk pesanan segera dan musim puncak. Sampel prototaip biasanya dihantar dalam masa 15–20 hari.'
    - q: 'Bolehkah anda menghantar FOB Qingdao atau CIF ke pelabuhan kami?'
      a: 'Ya. Kami menghantar FOB Qingdao, CIF ke pelabuhan global utama, dan DDP untuk rakan kongsi yang layak. Pasukan logistik kami menguruskan tempahan kontena, dokumentasi eksport, dan pelepasan kastam. Kami menghantar ke 50+ negara merentas pasaran EU, AS, AU, dan Asia.'

b2b_moq: 'MOQ standard: 5–10 unit setiap model. Pesanan percubaan dialu-alukan untuk perkongsian baharu.'

production_flow:
  tagline: 'Aliran Pengeluaran'
  title: 'Daripada Bahan kepada Papan Siap'
  subtitle: 'Setiap papan melalui 6 peringkat pengeluaran dengan titik semakan QC pada setiap langkah. Tiada jalan pintas, tiada pemeriksaan dilangkau.'
  stages:
    - stage: '01'
      title: 'Penerimaan Bahan & QC Masuk'
      description: 'Semua bahan masuk direkodkan mengikut nombor kelompok/lot dalam sistem ERP kami. Gulungan fabrik PVC, teras drop-stitch, injap, pelekat, dan perkakasan dikuarantin sehingga QC memberikan kelulusan.'
      qc_check: 'Kekuatan tegangan (ASTM D751), rintangan koyakan (ISO 4674), tolok ketebalan, kelikatan pelekat, imbasan kecacatan visual'
      qc_threshold: '100% kelompok diuji. Tolak jika tegangan < 90% spesifikasi, koyakan < minimum spesifikasi, atau mana-mana kecacatan visual'
      responsibility: 'Pasukan QC masuk (3 pemeriksa)'
    - stage: '02'
      title: 'Pemotongan CNC & Penyediaan Bahan'
      description: 'Penyusunan yang dioptimumkan oleh komputer meletakkan panel pada stok PVC untuk meminimumkan sisa. Mesin pemotong CNC automatik mengekalkan ketepatan kedudukan 0.1 mm.'
      qc_check: 'Semakan dimensi terhadap fail CAD DXF, pemeriksaan kualiti tepi, pengesahan bilangan panel'
      qc_threshold: 'Setiap panel ke-20 diukur. Toleransi ±0.5 mm. Tolak kelompok jika >2% di luar toleransi'
      responsibility: 'Ketua bengkel pemotongan'
    - stage: '03'
      title: 'Kimpalan & Pengikatan Drop-Stitch'
      description: 'Teras drop-stitch diikat kepada laminat PVC luar menggunakan laminasi haba. Kebuk tiub dikimpal RF atau dikimpal udara panas. Jalur rel diikat dengan leburan tiga lapisan.'
      qc_check: 'Ujian pelesapan setiap 50 unit (ASTM D751), pengukuran lebar kimpalan, semakan log suhu udara panas, pemeriksaan visual jahitan di bawah cahaya belakang'
      qc_threshold: 'Kekuatan pelesapan minimum 8 N/cm. Toleransi lebar kimpalan ±1 mm. Mana-mana penyaluran yang tampak = tolak'
      responsibility: 'QC kimpalan (2 pemeriksa setiap syif)'
    - stage: '04'
      title: 'Pemasangan & Kelengkapan'
      description: 'Papan bergerak ke pemasangan akhir tempat semua komponen dipadankan: rel dilekat dan dikimpal, injap dipasang, cincin-D, pemegang, kotak sirip, dan penyesuaian beg bawa dipasang. Setiap unit mengikut senarai semak pemasangan 100 perkara.'
      qc_check: 'Kelulusan senarai semak 100 perkara setiap unit, ujian fungsi injap (10 kitaran buka/tutup), pengesahan tork perkakasan, pemeriksaan visual'
      qc_threshold: 'Polisi sifar kecacatan pada item kritikal keselamatan (injap, cincin-D, pemegang). Kosmetik kecil: AQL 2.5 (ISO 2859)'
      responsibility: 'Ketua pasukan pemasangan + QC garisan'
    - stage: '05'
      title: 'Ujian Tekanan & Tahanan Kualiti'
      description: 'Setiap kebuk ditidakkan kepada tekanan nominal 1.25× (biasanya 20–25 PSI) dan ditahan selama 24–48 jam. Penderia tekanan merekod secara berterusan. Kebuk yang melebihi kejatuhan tekanan 5% ditolak dan dihantar untuk pemeriksaan semula jahitan.'
      qc_check: 'Log tahanan tekanan 24–48 jam, penentukuran penderia disahkan setiap hari, bacaan tekanan terampuh suhu, ujian semula jahitan selepas pembaikan'
      qc_threshold: 'Kejatuhan tekanan maksimum 5% dalam masa 24–48 jam pada suhu stabil. Mana-mana kebuk yang melebihinya = ujian semula 100% bagi keseluruhan kelompok pengeluaran'
      responsibility: 'Makmal kualiti (bebas daripada pengeluaran, melapor kepada pengurusan)'
    - stage: '06'
      title: 'Pemeriksaan Akhir & Pembungkusan'
      description: 'Pemeriksaan visual dan fungsian akhir. Kecacatan permukaan, konsistensi warna, pengesahan label/BIN, integriti pembungkusan, dan kelengkapan aksesori. Unit dibungkus vakum, dimasukkan ke dalam kotak, dan dipaletkan untuk pemuatan kontena.'
      qc_check: 'Pemeriksaan visual penuh, senarai semak aksesori setiap SKU, ujian jatuh bungkusan (1 m, sampel rawak), pengesahan imbasan label/kod bar'
      qc_threshold: 'AQL 2.5 untuk kecacatan besar, AQL 4.0 untuk kecacatan kecil. Toleransi sifar atas kecacatan keselamatan. 100% unit diperiksa secara visual'
      responsibility: 'Pasukan QC akhir (4 pemeriksa) + Ketua pasukan pembungkusan'


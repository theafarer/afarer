workshops_section:
  tagline: 'Bengkel'
  title: 'Bengkel Pembuatan'
  workshops:
    - title: 'Pemotongan PVC & Penyediaan Bahan'
      description: 'Mesin pemotong CNC automatik memproses fabrik PVC dan drop-stitch dengan ketepatan bawah milimeter. Penyusunan sarang dioptimumkan oleh komputer meminimumkan sisa bahan dan memastikan setiap panel memenuhi spesifikasi dimensinya sebelum dikimpal.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Kimpalan Tiub & Penyegelan Haba'
      description: 'Bengkel kimpalan khusus dengan mesin penyegelan haba dan akuan dielektrik RF. Penyegel haba udara panas mengikat dan meleburkan kebuk tiub PVC, manakala kimpalan RF menghasilkan jahitan kedap udara berkekuatan tinggi yang melebihi keperluan EN ISO 25649.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'Acuan FRP & Fabrikasi Komposit'
      description: 'Acuan FRP tersuai untuk komponen SUP, dihasilkan menggunakan pengacuan gentian kaca sapuan tangan dengan sistem resin polyester dan vinylester. Setiap lapisan digolek dengan tangan dan dibungkus vakum untuk kualiti yang konsisten. Kebuk semburan gelcoat menghasilkan kemasan marin berkilau tinggi dan rintang UV.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Percetakan & Hiasan SUP'
      description: 'Papan SUP dihias menggunakan percetakan digital untuk grafik warna penuh dan percetakan skrin untuk logo serta corak berulang. Pencetak digital menghasilkan reka bentuk dek berkualiti foto, manakala percetakan skrin menghasilkan tanda jenama yang tahan lama dan jelas.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Pemasangan Akhir & Kelengkapan'
      description: 'Garisan pemasangan tempat teras drop-stitch diakhiri dengan rel, dek EVA dipasang, serta sirip, injap, dan aksesori dipasang. Setiap papan mengikut senarai semak pemasangan 100 perkara yang disahkan oleh ketua pasukan.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Pengujian & Pemeriksaan Kualiti'
      description: 'Setiap papan yang siap menjalani ujian penahanan udara wajib, pengesahan pelesapan jahitan, dan semakan sistem penuh sebelum dihantar. Makmal kualiti kami beroperasi secara bebas daripada pengeluaran dan melapor terus kepada pengurusan.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


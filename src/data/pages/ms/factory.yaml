  tagline: 'Kilang'
  title: 'Kilang & Pembuatan'
  subtitle: '12,000 m² pembuatan bersepadu — daripada bahan mentah hingga papan siap'

intro:
  - 'Sebagai lengan pengeluaran **Aquafarer LLC (USA)**, Pasukan Operasi Qingdao afarer mengawal setiap peringkat pengeluaran — daripada ketibaan bahan mentah PVC dan gentian kaca sehingga pemeriksaan prapenghantaran papan siap. Kemudahan pembuatan kami di Zon Pembangunan Ekonomi Qingdao meliputi keluasan 12,000 meter persegi dan menempatkan bengkel khusus untuk pemotongan PVC, penyegelan haba tiub, fabrikasi acuan FRP, percetakan digital SUP, pemasangan akhir, serta ujian kualiti.'
  - 'Dengan menyepadukan reka bentuk, kejuruteraan, pembikinan prototaip, pembuatan, dan pengujian di bawah satu bumbung, kami menghapuskan ketidakefisienan pembuatan kontrak serta mengekalkan kawalan langsung terhadap kualiti binaan, pemilihan bahan, dan tempoh penghantaran. Setiap papan yang meninggalkan bengkel kami dibina oleh tenaga kami, menggunakan peralatan kami, mengikut piawaian kami.'


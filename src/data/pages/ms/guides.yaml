size_guide:
  tagline: 'Saiz & Spesifikasi'
  title: 'Cari Saiz yang Sesuai untuk Anda'
  desc: 'Bandingkan dimensi papan SUP, kapasiti berat, dan kegunaan yang disyorkan. Sama ada anda memerlukan SUP touring, papan yoga, atau SUP serba boleh — panduan saiz kami membantu anda memilih yang paling sesuai.'
  link_label: 'Panduan saiz penuh dengan spesifikasi produk →'
  link: /size-guide/
  cards:
    - title: 'Papan SUP'
      desc: 'Pilih panjang berdasarkan berat badan dan kegunaan yang anda maksudkan. Papan lebih lebar (32"+) menawarkan lebih kestabilan. Papan lebih panjang (11–12 ft) menjejak lebih baik untuk touring.'
    - title: 'SUP Touring'
      desc: 'Papan lebih panjang (11–12 ft) untuk menempuh jarak dan menjejak lurus. Cukup stabil untuk touring bersama kelengkapan. Sentiasa semak kapasiti berat.'
    - title: 'SUP Serba Boleh'
      desc: 'Pilih panjang mengikut berat penunggang dan kegunaan. Papan lebih lebar (32"+) untuk kestabilan. Serbaguna untuk rekreasi dan kecergasan.'

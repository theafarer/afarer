timeline:
  - year: '2012'
    title: 'Asas Pembuatan Marin'
    body: 'afarer bermula sebagai bengkel bot air khusus di Qingdao, China, yang komited kepada kraftangan marin dan pembuatan bot air. Fokus awal adalah membina produk boleh tiup yang boleh dipercayai melalui pengalaman kejuruteraan praktikal dan disiplin pembuatan.'
  - year: '2015'
    title: 'Eksport Pertama & Pensijilan CE'
    body: 'Pesanan eksport awal sampai ke Jepun dan Korea. Pensijilan CE dicapai bagi barisan produk teras, menandakan kemasukan afarer ke pasaran antarabangsa. Syarikat mula melayani pengguna komersial dan rekreasi di luar China.'
  - year: '2018'
    title: 'Pengembangan Kilang'
    body: 'Berpindah ke kemudahan pengeluaran seluas 12,000 m². Menambah larian kimpalan RF dan kapasiti pengeluaran drop-stitch, membolehkan pembuatan skala lebih besar dan peningkatan sistem kawalan kualiti.'
  - year: '2020'
    title: 'Pusat R&D Ditubuhkan'
    body: 'Membuka pusat R&D khusus dengan makmal fabrik PVC, tangki ujian hidrodinamik dan studio simulasi CAD/FEA. Pembangunan produk berkembang dengan tumpuan pada binaan ringan, ketahanan dipertingkat dan reka bentuk berpusatkan pengguna.'
  - year: '2022'
    title: 'Pensijilan & Pertumbuhan Global'
    body: 'Mencapai pensijilan ISO 9001. Berkembang kepada 14 jurutera R&D dan 200+ pekerja. Produk sampai kepada pelanggan di seluruh Eropah, Amerika dan Asia-Pasifik melalui perkongsian pengedar dan jenama bersama.'
  - year: '2024'
    title: 'Studio Inovasi & Reka Bentuk'
    body: 'Melancarkan studio reka bentuk dan inovasi perkhidmatan penuh bagi projek jenama bersama tersuai, daripada konsep hingga pengeluaran. Mengukuhkan aplikasi marin profesional termasuk penyelamatan, komersial dan kontrak kerajaan.'
  - year: '2026'
    title: 'Membina Masa Depan Penerokaan Air'
    body: 'Hari ini, afarer terus membangunkan sistem SUP dan aksesori marin — menghubungkan orang dan organisasi dengan perairan dunia. 50+ negara dilayani, kapasiti tahunan 15,000+ unit.'

content_founding:
  tagline: 'Permulaan'
  title: 'Lahir di Tepi Laut'
  subtitle: 'afarer bermula di sebuah bengkel pesisir di Qingdao dengan satu papan dan satu visi: membina bot air boleh tiup yang mampu menghadapi keadaan marin sebenar.'
  paragraphs:
    - 'Pada 2012, pengasas kami melihat satu jurang dalam pasaran — kebanyakan bot air boleh tiup sama ada mampah milik tetapi tidak boleh dipercayai, atau berkualiti tinggi tetapi harganya terlalu mahal. Mereka percaya ada ruang bagi pengeluar yang menyerahkan kedua-dua kualiti dan nilai.'
    - 'Lambung pertama dibina dengan tangan, diuji di perairan tempatan dan diperhalusi berdasarkan maklum balas sebenar daripada nelayan dan pengendali komersial kecil. Gelung maklum balas itu — bina, uji, dengar, baik pulih — kekal terteras dalam falsafah kejuruteraan kami hari ini.'
    - 'Menjelang 2015, khabar telah merebak ke luar Qingdao. Pengedar antarabangsa mula meminta sampel. Yang bermula sebagai bengkel tempatan semakin menjadi pembekal global.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'bengkel pengeluaran awal afarer dan pembuatan'

content_growth:
  tagline: 'Pertumbuhan & Inovasi'
  title: 'Daripada Bengkel kepada Kemudahan 12,000 m²'
  subtitle: 'Pelaburan berterusan dalam manusia, peralatan dan proses telah mengubah afarer menjadi kemudahan pembuatan marin moden.'
  paragraphs:
    - 'Ketika permintaan meningkat, kemudahan kami turut berkembang. Kami berkembang daripada bengkel kecil kepada kilang seluas 12,000 m² dengan larian pengeluaran khusus bagi papan SUP dan aksesori.'
    - 'Kami melabur dalam mesin pemotongan CNC, peralatan kimpalan frekuensi tinggi, larian pengeluaran drop stitch dan rangka ujian menyeluruh — membolehkan kami mengawal setiap aspek kualiti pengeluaran.'
    - 'Hari ini, pasukan kami yang berjumlah 200+ merangkumi jurutera marin, saintis bahan, pakar kawalan kualiti dan tukang kraftangan mahir — ramai antara mereka bersama afarer sejak hari-hari awal.'

philosophy:
  tagline: 'Falsafah Jenama'
  title: 'Merekayasa Kebebasan Di Atas Air'
  body: 'Kebebasan di atas air bukan sekadar tentang pergerakan. Ia mewakili penemuan tempat baharu, penciptaan pengalaman luar, hubungan manusia dengan alam dan pembolehan misi profesional. Kejuruteraan menjadikan kebebasan itu mungkin.'
  pillars:
    - title: 'Kebolehpercayaan Diutamakan'
      body: 'Persekitaran air menuntut kepercayaan. Produk afarer direka mengikut kestabilan, ketahanan, keselamatan dan prestasi konsisten.'
    - title: 'Reka Bentuk Berpusatkan Manusia'
      body: 'Produk harus melayani manusia, bukan teknologi. Setiap keputusan reka bentuk bermula dengan memahami cara orang menggunakan bot air, ke mana mereka meneroka dan cabaran yang mereka hadapi.'
    - title: 'Penerokaan Mudah Capai'
      body: 'Air tidak seharusnya hanya milik pakar. afarer mencipta peralatan yang membolehkan lebih ramai orang mengalami sungai, tasik, lautan dan persekitaran pesisir secara selamat.'
    - title: 'Inovasi Berterusan'
      body: 'Inovasi bukan sekadar mencipta produk baharu. Ia adalah penambahbaikan setiap butiran — bahan, struktur, pembuatan dan pengalaman pengguna.'

engineeringDna:
  tagline: 'DNA Kejuruteraan'
  title: 'Bagaimana afarer Mencipta Produk'
  areas:
    - title: 'Sains Bahan'
      body: 'afarer menumpukan pada pemilihan bahan yang sesuai bagi persekitaran marin berbeza. Pertimbangan utama termasuk rintangan haus, rintangan UV, kestabilan tekanan dan ketahanan jangka panjang.'
      items: ['Rintangan Haus', 'Rintangan UV', 'Kestabilan Tekanan', 'Ketahanan Jangka Panjang']
    - title: 'Kejuruteraan Struktur'
      body: 'Bot air boleh tiup memerlukan keseimbangan tepat antara kekakuan, berat, keboleh alih dan kestabilan. Kejuruteraan afarer menumpukan pada pengoptimuman faktor-faktor ini melalui teknologi teras drop-stitch dan binaan jahitian termaju.'
      items: ['Kekakuan', 'Pengoptimuman Berat', 'Keboleh Alih', 'Kestabilan']
    - title: 'Ketepatan Pembuatan'
      body: 'Setiap produk melalui proses terkawal: penyediaan bahan, pemotongan tepat, kimpalan dan ikatan, pemasangan, pemeriksaan kualiti dan pengesahan prestasi.'
      items: ['Penyediaan Bahan', 'Pemotongan Tepat', 'Kimpalan & Ikatan', 'Pemasangan & QC']
    - title: 'Kejuruteraan Senario Pengguna'
      body: 'Produk dibangunkan mengikut aplikasi sebenar — rekreasi, pengembaraan dan kegunaan profesional — memastikan setiap reka bentuk memenuhi tuntutan khusus persekitaran sasarannya.'
      items: ['Rekreasi', 'Pengembaraan', 'Profesional', 'Komersial']


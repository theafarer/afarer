faqs:
  - question: 'Bolehkah anda berdiri dan memancing di atas SUP boleh tiup?'
    answer: 'Ya. SUP boleh tiup yang lebih lebar (33 inci atau lebih) menyediakan kestabilan mencukupi untuk berdiri dan mengumban. Pad dek EVA sepenuh panjang menawarkan pijakan selamat ketika basah.'
  - question: 'Adakah SUP boleh tiup bagus untuk memancing?'
    answer: 'SUP boleh tiup ialah platform memancing yang cemerlang, terutamanya untuk memancing di kawasan cetek dan merangkumi perairan dangkal. Reka bentuk lebar menyediakan akses mudah kepada umpan dan peralatan.'
  - question: 'Berapa banyak peralatan yang boleh saya bawa di atas SUP boleh tiup?'
    answer: 'Kebanyakan SUP boleh tiup menyokong kapasiti jumlah 220-300 lbs (penunggang dan peralatan). Persediaan memancing biasa dengan umpan, peti sejuk dan peralatan keselamatan menambah 20-40 lbs. Semak rating isipadu papan untuk memastikan kapasiti mencukupi.'
body: |
  <h2>Mengapa Memancing daripada Bot Boleh Tiup?</h2>
  <p>SUP boleh tiup menawarkan kelebihan tersendiri bagi peminat pancing yang tidak mampu ditandingi oleh bot tradisional. Sarat air yang cetek membolehkan akses ke perairan yang tidak boleh dicapai oleh bot bermotor, manakala pendekatan senyapnya meminimumkan gangguan terhadap ikan. Faktor keboleh alih bermakna anda boleh memancing di tasik, sungai dan kawasan pesisir terpencil tanpa treler atau lambung bot.</p>
  <p>Kelebihan utama termasuk:</p>
  <ul>
    <li><strong>Senyap</strong> — Tiada bunyi bermakna anda boleh menghampiri ikan tanpa menakutkannya</li>
    <li><strong>Akses Perairan Cetek</strong> — Sarat air hanya beberapa inci membolehkan memancing di paya, anak sungai dan kawasan cetek</li>
    <li><strong>Keboleh Alih</strong> — Bawa bot anda ke lokasi terpencil yang tidak boleh dicapai dengan bot</li>
    <li><strong>Keupayaan Berdiri</strong> — Papan SUP membolehkan berdiri untuk visibiliti air yang lebih baik</li>
  </ul>

  <h2>Keperluan Kestabilan</h2>
  <p>Memancing memerlukan platform yang stabil. Apabila memilih bot boleh tiup untuk memancing, utamakan:</p>
  <ul>
    <li><strong>Lebar</strong> — Papan lebih lebar (33-36 inci) menyediakan kestabilan lebih baik untuk berdiri dan mengumban</li>
    <li><strong>Ketebalan</strong> — Papan 6 inci menawarkan kekakuan dan kapasiti berat lebih besar untuk peralatan</li>
    <li><strong>Isipadu</strong> — Isipadu lebih tinggi (300+ liter) menyokong berat gabungan peminat pancing dan kelengkapan</li>
    <li><strong>Permukaan Dek</strong> — Pad dek buih EVA sepenuh panjang menyediakan cengkaman tanpa licin ketika basah</li>
  </ul>

  <h2>Keserasian Peralatan</h2>
  <p>Persediaan memakan boleh tiup biasanya merangkumi:</p>
  <ul>
    <li><strong>Pemegang Rod</strong> — Pemegang rod yang dipasang klip atau dek untuk pendayungan tanpa tangan</li>
    <li><strong>Peti atau Penyejuk</strong> — Dikatankan pada dek dengan ikatan bungee untuk umpan dan hasil tangkapan</li>
    <li><strong>Sistem Sauh</strong> — Sauh lipat ringan atau tiang penanda untuk menahan kedudukan dalam arus</li>
    <li><strong>Tali Dayung</strong> — Mengekalkan dayung terikat apabila kedua-dua tangan diperlukan untuk memancing</li>
    <li><strong>Peranti Keapungan Peribadi (PFD)</strong> — Kelengkapan keselamatan penting bagi semua peminat pancing</li>
  </ul>

  <h2>Jenis Bot Disyorkan untuk Memancing</h2>
  <p>Senario memancing berbeza sesuai dengan jenis bot berbeza:</p>

  <h3>Papan SUP untuk Memancing</h3>
  <p>Terbaik untuk: Memancing di kawasan cetek, memancing ikan bass di tasik, memancing secara melihat di air dangkal. Kedudukan berdiri yang tinggi menyediakan visibiliti cemerlang. Pilih SUP lawatan atau serba boleh yang lebih lebar untuk kestabilan.</p>

  <h3>Papan SUP untuk Memancing</h3>
  <p>Terbaik untuk: Trip memancing berbilang orang, membawa peralatan berat dan perairan pesisir terlindung. SUP menawarkan ruang dek dan kapasiti berat sambil kekal mudah alih.</p>

  <h2>Pertimbangan Keselamatan</h2>
  <ul>
    <li>Sentiasa pakai PFD — memancing melibatkan berdiri, mengumban dan mengalihkan peralatan yang meningkatkan risiko jatuh</li>
    <li>Semak cuaca dan keadaan air sebelum keluar</li>
    <li>Bawa wisel, telefon dalam sarung kalis air dan kit pembaikan asas</li>
    <li>Beritahu seseorang lokasi memancing anda dan masa pulang yang dijangka</li>
  </ul>

  <h2>FAQ</h2>
  <h3>Bolehkah anda berdiri dan memancing di atas SUP boleh tiup?</h3>
  <p>Ya. SUP boleh tiup yang lebih lebar (33 inci atau lebih) menyediakan kestabilan mencukupi untuk berdiri dan mengumban. Pad dek EVA sepenuh panjang menawarkan pijakan selamat ketika basah.</p>

  <h3>Berapa banyak peralatan yang boleh saya bawa di atas SUP boleh tiup?</h3>
  <p>Kebanyakan SUP boleh tiup menyokong kapasiti jumlah 220-300 lbs (penunggang dan peralatan). Persediaan memancing biasa dengan umpan, peti sejuk dan peralatan keselamatan menambah 20-40 lbs. Semak rating isipadu papan untuk memastikan kapasiti mencukupi.</p>

content_html: |
  <h2>1. Pra-Kelayakan: Apa yang Perlu Dicari dalam sebuah Kilang</h2>

  <h3>Sijil Pematuhan</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Sistem pengurusan kualiti</li>
    <li><strong>Pensijilan CE</strong> – Sahkan nombor Badan Diberitahu</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Audit pematuhan sosial</li>
    <li><strong>REACH / RoHS</strong> – Perisytiharan pematuhan bahan</li>
  </ul>

  <h3>Keupayaan Pembuatan</h3>
  <ul>
    <li>Penenunan teras drop-stitch dalaman vs. luaran</li>
    <li>Garisan salutan / laminasi PVC</li>
    <li>Peralatan kimpalan RF dan kimpalan udara panas</li>
    <li>Pembuatan acuan dalaman (pemesinan CNC)</li>
    <li>Makmal pengujian (ujian tekanan, penuaan UV, ujian tegangan)</li>
  </ul>

  <h3>Pengesahan Pengalaman</h3>
  <ul>
    <li>Tahun dalam pembuatan kenderaan air boleh tiup (minimum 5+ tahun)</li>
    <li>Bilangan jurutera dalam perkhidmatan</li>
    <li>Klien OEM/ODM sedia ada (minta rujukan)</li>
    <li>Destinasi eksport – adakah mereka sudah menghantar ke pasaran sasaran anda?</li>
  </ul>

  <h2>2. Protokol Kawalan Kualiti</h2>
  <p>QC bahan masuk: kekuatan tegangan (ASTM D751 atau ISO 1421), rintangan koyakan (ASTM D2261 atau ISO 4674), kekuatan pelekatan, semakan titik penuaan UV.</p>
  <p>QC dalam proses: pemantauan kekuatan jahitan setiap 50 unit, pengesahan tork injap, semakan ketumpatan benang drop-stitch, semakan dimensi terhadap lukisan CAD.</p>
  <p>Pemeriksaan akhir: ujian tahanan penidakkan 100% (24 jam, kejatuhan maksimum 5%), pemeriksaan visual, ujian fungsi injap, ujian sampel rawak (AQL 2.5 atau 4.0 mengikut ISO 2859).</p>

  <h2>3. Senarai Semak Dokumentasi Pematuhan</h2>
  <ul>
    <li>Perisytiharan Pematuhan (DoC) yang merujuk arahan EU yang betul</li>
    <li>Sijil CE daripada badan diberitahu</li>
    <li>Laporan ujian daripada makmal terakreditasi</li>
    <li>Lembaran data keselamatan bahan (MSDS)</li>
    <li>Perisytiharan pematuhan REACH</li>
    <li>Senarai Bahan dengan kebolehsurihan pembekal</li>
    <li>Laporan pemeriksaan kilang</li>
  </ul>

  <h2>4. Rundingan MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Jenis Produk</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">MOQ Standard</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Julat Boleh Dirunding</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Papan SUP</td><td class="p-3 border">50 – 100 unit</td><td class="p-3 border">5 – 10 unit (percubaan)</td></tr>
      <tr><td class="p-3 border">Kayak</td><td class="p-3 border">50 – 100 unit</td><td class="p-3 border">5 – 10 unit (percubaan)</td></tr>
      <tr><td class="p-3 border">SUP Boleh Tiup</td><td class="p-3 border">50 – 100 unit</td><td class="p-3 border">2 – 5 unit (percubaan)</td></tr>
      <tr><td class="p-3 border">Keselamatan / Aksesori</td><td class="p-3 border">200 – 500 unit</td><td class="p-3 border">50 – 100 unit (percubaan)</td></tr>
    </tbody>
  </table>

  <h2>5. Logistik dan Penghantaran</h2>
  <p>Incoterms biasa: <strong>FOB</strong> (Kilang menghantar ke pelabuhan pelepasan – paling biasa), <strong>EXW</strong> (Pembeli menguruskan semua penghantaran dari pintu kilang), <strong>CIF</strong> (Kilang membayar kos pengangkutan dan insurans ke pelabuhan destinasi).</p>
  <p>Produk boleh tiup berat rendah tetapi berisipadu tinggi – berat volumetrik (DIM) selalunya menentukan kos penghantaran. Minta pembungkusan vakum untuk mengurangkan isipadu sebanyak 50–60%. Pengangkutan laut dari China ke EU: 25–35 hari; ke Pantai Barat AS: 15–20 hari.</p>

  <h2>6. Perangkap Biasa</h2>
  <ul>
    <li><strong>Tiada audit kilang:</strong> Sentiasa laksanakan atau komisionkan audit pihak ketiga (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Spesifikasi lisan sahaja:</strong> Lembaran spesifikasi teknikal terperinci yang ditandatangani oleh kedua-dua pihak</li>
    <li><strong>Melangkau kelulusan sampel:</strong> Kelulusan bertulis atas sampel sebelum pengeluaran pukal</li>
    <li><strong>Tiada QC semasa pengeluaran:</strong> Pemeriksaan pihak ketiga semasa pengeluaran (DUPRO) dan sebelum penghantaran (PSI)</li>
    <li><strong>Mengabaikan pematuhan:</strong> Sahkan pensijilan CE/UKCA sebelum pengeluaran</li>
  </ul>

  <h2>7. Mengapa Afarer</h2>
  <p>Afarer telah mengeluarkan kenderaan air boleh tiup OEM/ODM sejak 2012. Dengan kemudahan tersijil ISO 9001 seluas 12,000 m&sup2;, 25+ jurutera, dan pensijilan CE merentas semua lini produk, kami memenuhi setiap kriteria dalam panduan ini. Kami menawarkan MOQ percubaan untuk rakan kongsi baharu serta pakej dokumentasi pematuhan yang penuh.</p>


why_us:
  - title: 'Integrasi Menegak'
    description: 'Kami memiliki kilang, acuan, dan rantai bekalan kami sendiri — tiada orang tengah, tiada subkontraktor. Ini memberi kami kawalan ke atas kualiti, kos, dan penghantaran.'
  - title: 'Pensijilan Berganda'
    description: 'Pengurusan kualiti ISO 9001 dan pensijilan pematuhan sosial BSCI. Laporan audit kilang tersedia atas permintaan.'
  - title: 'Pematuhan CE'
    description: 'Semua model standard membawa pensijilan CE 2013/53/EU. Model tersuai boleh disijilkan CE melalui proses mantap kami.'
  - title: 'MOQ Rendah'
    description: 'Mulakan dengan hanya 5 unit untuk model standard. Kami membantu jenama baharu muncul tanpa komitmen inventori yang berlebihan.'

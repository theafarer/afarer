services:
  - title: 'Reka Bentuk Produk & Kejuruteraan'
    description: 'Pasukan R&D dalaman kami bekerja dengan konsep atau spesifikasi anda untuk membangunkan lukisan CAD, model 3D, dan prototaip. Kami menawarkan reka bentuk acuan, pengoptimuman bentuk lunas, dan panduan pemilihan bahan.'
  - title: 'Penjenamaan & Grafik Tersuai'
    description: 'Percetakan digital penuh warna, cetak saring, timbul, dan pilihan label. Kami membangunkan grafik dek khusus jenama, penjenamaan tiub, dan pembungkusan sedia runcit.'
  - title: 'Penyesuaian Bahan & Spesifikasi'
    description: 'Pilih daripada PVC (standard, mesra alam, tahan api), drop-stitch, dan binaan hibrid. Warna tiub tersuai, berat fabrik, dan pilihan pengukuhan.'
  - title: 'Pembungkusan & Logistik'
    description: 'Pembungkusan runcit tersuai, kotak label peribadi, pembungkusan vakum, palet, dan pemuatan kontena. Terma penghantaran FOB Qingdao, CIF, atau DDP tersedia.'


features3_markets:
  tagline: 'Pasaran Utama'
  title: 'Kepakaran Serantau<br />untuk Keperluan Tempatan'
  subtitle: 'Kami memahami bahawa pasaran berbeza mempunyai keperluan kawal selia, citarasa dan kes kegunaan yang berbeza.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Eropah & UK'
      description: 'Produk disijilkan CE. Permintaan kukuh bagi papan SUP merentasi pasaran EU. Pengedar UK menghargai masa pusingan pantas kami.'
      icon: tabler:map-pin
    - title: 'Amerika Utara'
      description: 'Pembuatan diluluskan US Coast Guard. Gudang AS di Montclair, CA untuk penghantaran pantas Pantai Barat. Permintaan meningkat bagi SUP memancing, penyelamatan dan rekreasi.'
      icon: tabler:map-pin
    - title: 'Australia & Oceania'
      description: 'Pasaran kukuh bagi papan SUP dan aksesori sukan air. Pengedar Australia menghargai binaan PVC rintang UV kami dalam keadaan matahari keras. Penghantaran pantas daripada kemudahan Asia kami.'
      icon: tabler:map-pin
    - title: 'Timur Tengah'
      description: 'Permintaan meningkat bagi kelengkapan pengembaraan air. SUP gred komersial dan kelengkapan keselamatan kami popular dikalangan pengendali pelancongan dan pusat sewaan. Konfigurasi tersuai bagi persekitaran suhu tinggi.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Rangkaian Pengedaran'
  title: 'Berkongsi dengan Pengedar<br />di Seluruh Dunia'
  subtitle: 'Kami bekerjasama dengan pengedar kelengkapan marin yang mantap, jenama sukan air dan agensi perolehan kerajaan.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Program Jenama Bersama'
      description: 'Pembuatan label persendirian untuk jenama sukan air global. Kami mengendalikan segalanya daripada reka bentuk hingga pengeluaran hingga penghantaran terus.'
      icon: tabler:building
    - title: 'Rangkaian Pengedar'
      description: 'Pengedar sah di 20+ negara menyimpan stok dan menyediakan sokongan tempatan. Pertanyaan pengedar baharu dialu-alukan.'
      icon: tabler:users
    - title: 'Kerajaan & Institusi'
      description: 'Bekalan terus kepada pengawal pantai, organisasi cari dan selamat serta program perolehan tentera. Pematuhan terhadap keperluan perolehan institusi.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Logistik & Sokongan Global'
  subtitle: 'Daripada kilang hingga destinasi — kami menguruskan keseluruhan rantaian bekalan.'
  items:
    - title: 'Pilihan Penghantaran'
      description: 'Kargo laut (FOB Qingdao), kargo udara bagi pesanan segera dan kurier ekspres bagi sampel dan alat ganti.'
      icon: tabler:truck-delivery
    - title: 'Gudang AS'
      description: 'Stok disimpan di Montclair, CA untuk penghantaran pantas merentasi Amerika Utara. Pantai Barat: 2-3 hari, Tengah: 3-4 hari, Pantai Timur: 4-5 hari.'
      icon: tabler:building-warehouse
    - title: 'Alat Ganti'
      description: 'Alat ganti dan bahan pengguna tulen afarer disimpan sepanjang tahun. Bahagian biasa dihantar dalam masa 24 jam.'
      icon: tabler:package
    - title: 'Sokongan Teknikal'
      description: 'Talian terus kepada pasukan kejuruteraan kami untuk soalan teknikal, nasihat pembaikan dan sokongan bahagian gantian. Kami menyokong papan yang kami bina 20 tahun lalu.'
      icon: tabler:headset
cta:
  title: 'Ingin menjadi pengedar?'
  subtitle: 'Kami sedang aktif mengembangkan rangkaian pengedaran kami. Hubungi pasukan eksport kami untuk membincangkan peluang perkongsian.'
  actions:

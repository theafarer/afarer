  items:
    - content: 'Kami melengkapi keseluruhan armada sewaan kami dengan SUP afarer. Dua musim berlalu, sifar kegagalan. Pensijilan CE menjadikan kelulusan insurans lancar.'
      name: 'Marco V.'
      title: 'Pengendali pelancongan, Croatia'
    - content: 'Sebagai pembeli kali pertama, saya berasa bimbang tentang kualiti. Dokumentasi ISO dan laporan ujian yang mereka kongsi memberi saya keyakinan sepenuhnya.'
      name: 'James T.'
      title: 'Pemilik SUP Explorer 11, Kanada'
    - content: 'Kami bekerja dengan afarer bagi unit rondaan pantai kami. Proses QC mereka konsisten dalam setiap kelompok — kebolehpercayaan itu penting dalam operasi kritikal misi.'
      name: 'Lt. Cmdr. Andres'
      title: 'Perolehan kerajaan, Filipina'


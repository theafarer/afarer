faqs_sup:
  title: 'FAQ Papan SUP'
  subtitle: 'Soalan lazim tentang papan dayung berdiri kami.'
  columns: 2
  items:
    - title: 'Apakah saiz papan SUP yang ditawarkan oleh afarer?'
      description: 'Kami menawarkan papan SUP dari 9 kaki hingga 12 kaki, merangkumi segalanya daripada papan serba boleh kompak hingga reka bentuk lawatan dan khusus. Setiap model tersedia dengan pelbagai pilihan konfigurasi.'
    - title: 'Apakah perbezaan antara SUP boleh tiup dan SUP keras?'
      description: 'SUP boleh tiup menggunakan binaan drop-stitch dengan ribuan benang dalaman yang membolehkan tekanan udara tinggi, manakala SUP keras menggunakan epoksi atau gentian kaca. SUP boleh tiup menawarkan keboleh alih dan kemudahan penyimpanan tanpa mengorbankan kekakuan.'
    - title: 'Berapakah had berat bagi papan SUP?'
      description: 'Papan SUP kami menyokong sehingga 150 kg bergantung pada model dan isipadu. Setiap halaman produk menyenaraikan kadar beban maksimum bagi model khusus anda.'
    - title: 'Adakah SUP afarer disijilkan CE?'
      description: 'Ya. Semua model SUP rekreasi disijilkan CE di bawah piawaian Eropah yang terpakai bagi kegunaan rekreasi.'
    - title: 'Berapakah tempoh waranti bagi papan SUP?'
      description: 'Semua SUP afarer disertakan waranti standard setahun terhadap kecacatan pengeluaran, merangkumi kegagalan jahitan, kecacatan injap dan pengelupasan bahan dalam kegunaan normal.'
    - title: 'Berapa lama masa yang diperlukan untuk melambungkan papan SUP?'
      description: 'Menggunakan pam tangan yang disertakan, pelambungan penuh sehingga 15 PSI mengambil masa kira-kira 8–12 minit. Untuk pelambungan lebih pantas, kami mengesyorkan pam elektrik 12V afarer kami, yang melambungkan papan dalam masa kurang daripada 4 minit.'

faqs_materials:
  title: 'FAQ Bahan & Penjagaan SUP'
  subtitle: 'Soalan lazim tentang bahan, penjagaan dan penyimpanan SUP boleh tiup kami.'
  columns: 2
  items:
    - title: 'Bahan apakah yang digunakan dalam SUP boleh tiup afarer?'
      description: 'Kami menggunakan PVC gred tentera (1100 denier) dengan binaan stabil-UV dan rintang haus, mematuhi peraturan REACH dan RoHS EU.'
    - title: 'Berapa lama SUP boleh tiup bertahan?'
      description: 'Dengan penjagaan betul, SUP boleh tiup PVC berkualiti bertahan 5–10 tahun. Pembersihan berkala, perlindungan UV dan penyimpanan betul memanjangkan hayat perkhidmatan dengan ketara.'
    - title: 'Apakah penyelenggaraan yang diperlukan bagi SUP boleh tiup?'
      description: 'Penyelenggaraan asas termasuk membilas dengan air tawar selepas setiap kegunaan (terutamanya di air masin), mengeringkan sebelum disimpan, memeriksa meterai injap setiap tahun dan mengelakkan pendedahan matahari berpanjangan apabila tidak digunakan.'
    - title: 'Bolehkah SUP boleh tiup digunakan di air masin?'
      description: 'Ya. Semua SUP boleh tiup afarer direka untuk kegunaan air tawar dan air masin. Kami mengesyorkan membilas dengan air tawar dan mengeringkan dengan teliti selepas terdedah kepada air masin.'
    - title: 'Bagaimanakah cara menyimpan SUP boleh tiup?'
      description: 'Kempiskan, bersihkan dan keringkan papan sepenuhnya sebelum disimpan. Gulung secara longgar (elakkan lipatan ketat), simpan di tempat sejuk dan kering jauh daripada cahaya matahari terus, dan jauhkan daripada lantai konkrit bagi mengelakkan penyerapan lembapan.'
    - title: 'Berapakah kapasiti berat SUP boleh tiup afarer?'
      description: 'Kapasiti berat berjulat daripada 100 kg bagi model terkecil kami hingga melebihi 200 kg bagi papan lebih besar. Setiap halaman produk menyenaraikan kadar beban maksimum bagi model khusus anda.'


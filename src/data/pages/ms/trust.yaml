features3_certifications:
  title: 'Pensijilan & Pematuhan'
  subtitle: 'Setiap produk diuji dan disijilkan secara bebas mengikut piawaian antarabangsa.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'Pensijilan CE'
      description: 'Semua SUP afarer memenuhi piawaian keselamatan CE Eropah bagi kegunaan rekreasi. Setiap produk menjalani ujian tekanan, keapungan dan beban sebelum meninggalkan kilang.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'Kemudahan kami seluas 12,000 m² di Qingdao beroperasi di bawah sistem pengurusan kualiti ISO 9001. Setiap kelompok pengeluaran boleh dijejak, didokumenkan dan diperiksa.'
      icon: 'tabler:clipboard-check'
    - title: 'Pematuhan Sosial BSCI'
      description: 'Kami disijilkan BSCI, memastikan amalan buruh beretika, keadaan kerja selamat dan tanggungjawab alam sekitar dalam seluruh rantaian bekalan kami.'
      icon: 'tabler:users'
    - title: 'REACH & RoHS'
      description: 'Semua bahan — PVC, buih EVA, pelekat — mematuhi peraturan REACH dan RoHS EU. Tiada bahan terhad, tiada kompromi.'
      icon: 'tabler:flask'
    - title: 'Makmal Ujian Bahan'
      description: 'Makmal bahan dalaman kami menguji kekuatan tegangan, rintangan UV, keutuhan jahitan dan kehausan bagi setiap kelompok fabrik sebelum pengeluaran.'
      icon: 'tabler:microscope'
    - title: 'Waranti 2 Tahun'
      description: 'Setiap produk afarer disertakan waranti dua tahun terhadap kecacatan pengeluaran. Kami berdiri di sebalik apa yang kami bina.'
      icon: 'tabler:shield-check'


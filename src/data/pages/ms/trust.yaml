warranty_section:
  title: 'Waranti & Sokongan Selepas Jualan'
  subtitle: 'Kami berdiri di sebalik setiap produk dengan terma waranti yang jelas, pemprosesan tuntutan pantas dan alat ganti tulen.'
  items:
    - title: 'Waranti Produk 2 Tahun'
      desc: 'Semua produk afarer disertakan waranti 2 tahun terhadap kecacatan pengeluaran — kegagalan jahitan, kecacatan injap dan pengelupasan bahan dalam kegunaan normal.'
    - title: 'Sokongan Alat Ganti Seumur Hidup'
      desc: 'Alat ganti tulen — injap, kit pembaikan, sirip, D-ring — tersedia bagi semua model. Kami mengekalkan acuan dan peralatan sekurang-kurangnya 5 tahun selepas pengeluaran berakhir.'
    - title: 'Respons Tuntutan 48 Jam'
      desc: 'Tuntutan waranti diakui dalam masa 48 jam. Papan penggantian dihantar dalam masa 10 hari bekerja bagi tuntutan yang diluluskan.'
    - title: 'Rangkaian Pembaikan Global'
      desc: 'Pusat pembaikan sah di lebih 15 negara. Kit pembaikan lapangan tersedia bagi operasi kawasan terpencil. Panduan pembaikan sendiri bagi kerosakan kecil.'
    - title: 'Sokongan Pelanggan OEM'
      desc: 'Pengurus akaun khusus bagi rakan kongsi B2B. Semakan perniagaan suku tahunan, perancangan inventori dan sokongan pemasaran bersama jenama.'
    - title: 'Pakej Pensijilan'
      desc: 'Dokumentasi pematuhan penuh disertakan dengan setiap penghantaran — Perisytiharan CE, laporan ujian, lembaran data keselamatan bahan.'
      link: '/contact/'


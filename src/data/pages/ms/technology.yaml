meta:
  title: 'Teknologi — Drop Stitch & PVC Marin | {SITE}'
  description: 'Teknologi afarer: binaan drop stitch, PVC marin, binaan lapisan berganda dan tekanan tinggi. Inovasi daripada pengeluar SUP boleh tiup profesional.'
  keywords:
    - 'teknologi sup'
    - 'binaan drop stitch'
    - 'sup tekanan tinggi'
    - 'bahan sup boleh tiup'
hero:
  tagline: 'Teknologi'
  title: 'Dibina untuk Prestasi'
  subtitle: 'Setiap SUP boleh tiup afarer direkayasa dengan binaan drop-stitch dan PVC gred marin — bahan berketepatan dan kaedah pembuatan yang diuji untuk persekitaran marin yang mencabar.'

sections:
  - title: 'Teras Drop-Stitch'
    description: 'Ribuan benang poliester dalaman menghubungkan lapisan atas dan bawah, mewujudkan struktur kaku pada 12-15 PSI. Ini adalah teknologi sama yang digunakan dalam papan dayung profesional dan SUP perlumbaan boleh tiup.'
    imageAlt: 'Rajah Teras DS'
  - title: 'PVC Gred Marin'
    description: 'Fabrik PVC berlaminat berbilang lapisan dengan rating untuk persekitaran marin. Setiap lapisan dikimpal fusi dan bukannya dilekat, menghapuskan risiko pengelupasan. Diuji untuk rintangan UV, kakisan air masin dan haus.'
    imageAlt: 'Lapisan PVC'
  - title: 'PVC Gred Tentera'
    description: 'Digunakan pada semua model SUP, PVC premium menyediakan rintangan UV dan kimia yang unggul. Mengekalkan kelenturan dalam suhu melampau dan menahan degradasi.'
    imageAlt: 'PVC'
  - title: 'Lantai Dek Udara'
    description: 'Binaan drop-stitch boleh tiup bertekanan tinggi yang menyediakan kekakuan luar biasa untuk berdiri, memancing dan yoga. Mengurangkan masa persediaan, jumlah berat dan isipadu penyimpanan.'
    imageAlt: 'Dek Udara'


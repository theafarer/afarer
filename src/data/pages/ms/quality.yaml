meta:
  title: 'Kualiti & Pengujian — Kawalan Pembuatan | {SITE}'
  description: 'Sistem kualiti afarer: makmal pengujian bebas, proses ISO 9001, dan setiap unit diuji sebelum penghantaran. Kawalan kualiti untuk pembuatan SUP boleh tiup.'
  keywords:
    - 'kawalan kualiti sup'
    - 'pengujian sup boleh tiup'
    - 'jaminan kualiti papan dayung'
    - 'kualiti kilang sup'
hero:
  tagline: 'Jaminan Kualiti'
  title: 'Pengujian Prestasi & Kualiti'
  subtitle: 'Setiap SUP boleh tiup afarer menjalani pengujian prestasi dan kawalan kualiti yang ketat di Pusat R&D kami sebelum dihantar. Pengujian kualiti SUP menyeluruh kami menyediakan bukti nyata kecemerlangan produk untuk pembeli OEM dan borong.'


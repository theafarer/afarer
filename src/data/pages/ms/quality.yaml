tests:
  - title: 'Ujian Tekanan'
    description: 'Kebuk boleh tiup dikenakan tekanan melebihi had operasi yang disyorkan untuk tempoh yang panjang. Ini mengesahkan ketahanan udara dan integriti struktur bahan serta jahitan, memastikan produk mampu menahan kegunaan yang dirancang dan potensi pentidakkan berlebihan tanpa kegagalan atau kebocoran.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Ujian Hentaman'
    description: 'Produk dikenakan hentaman terkawal daripada pelbagai berat dan sudut. Ini menilai rintangan bahan terhadap tusukan, koyakan, dan kerosakan akibat pelanggaran dengan halangan di dalam air, menunjukkan ketahanan dan jangka hayat produk.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'Ujian Rintangan UV'
    description: 'Sampel bahan didedahkan kepada pendedahan UV dipercepat yang mensimulasikan bertahun-tahun cahaya matahari terik, kemudian diuji semula untuk pengekalan kekuatan tegangan dan ketahanan warna. Ini mengesahkan sebatian PVC menentang pudar, pengkapuran, dan keretakan, memastikan ketahanan jangka panjang dalam persekitaran marin yang cerah.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Ujian Rintangan Kehausan'
    description: 'Sampel bahan digosok terhadap permukaan kasar untuk bilangan kitaran yang ditetapkan di bawah tekanan terkawal. Ini mengukur keupayaan bahan menahan kehausan akibat penggunaan berulang, sentuhan dengan pasir, batu, atau permukaan lain, memastikan ketahanan jangka panjang.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Ujian Prestasi Suhu Rendah'
    description: 'Produk diuji dalam persekitaran sejuk untuk menilai kefungsian dan ketahanan dalam pelbagai keadaan suhu, mencegah kekakuan atau keretakan di perairan yang lebih sejuk. Penting untuk papan yang ditujukan untuk penggunaan musim sejuk atau latitud tinggi.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Ujian Keapungan & Kapasiti Beban'
    description: 'Produk diuji dengan pelbagai berat untuk menentukan kapasiti beban maksimum dan memastikan ia menyokong pengguna serta kelengkapan dengan selamat. Kapasiti nominal setiap model disahkan sebelum dilancarkan.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Ujian Kebolehkendalian'
    description: 'Produk diuji untuk tindak balas terhadap input dayungan atau motor, menilai jejari pusingan dan kemudahan pengendalian. Percubaan di atas air mengesahkan pengendalian dunia sebenar sepadan dengan spesifikasi reka bentuk.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Ujian Kedap Air'
    description: 'Produk yang dipasang sepenuhnya direndam atau dikenakan semburan air untuk memeriksa sebarang kebocoran melalui jahitan, injap, atau bahan. Setiap papan lulus pemeriksaan kedap air wajib sebelum dihantar.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp


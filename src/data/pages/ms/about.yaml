meta:
  title: 'Tentang Afarer — Jenama SUP Boleh Tiup & Sukan Air | {SITE}'
  description: 'Afarer ialah jenama SUP boleh tiup dan sukan air global, dikendalikan oleh Aquafarer LLC (AS) dan dibina oleh Pasukan Operasi Qingdao kami. Temui kisah kami, kejuruteraan, kualiti bersijil dan program rakan kongsi negara kami.'
  keywords:
    - 'jenama SUP boleh tiup'
    - 'jenama sukan air'
    - 'pengedar sup negara'
    - 'koleksi sup jenama bersama'
hero:
  tagline: 'Tentang kami'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'kilang dan bengkel afarer'
  title: |
    Kejuruteraan marin, <br />
    dibina secara <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Kami bermula di sebuah bengkel pesisir dengan satu papan dan kepercayaan yang tegar: produk marin harus direkayasa seolah-olah ia penting, kerana ia memang penting. Hari ini kami menghantar ke lebih 40 negara, tetapi setiap lambung masih melalui tangan yang sama yang memulakan syarikat ini.'


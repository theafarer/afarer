  subtitle: 'Kami bermula di sebuah bengkel pesisir dengan satu papan dan kepercayaan yang tegar: produk marin harus direkayasa seolah-olah ia penting, kerana ia memang penting. Hari ini kami menghantar ke lebih 40 negara, tetapi setiap lambung masih melalui tangan yang sama yang memulakan syarikat ini.'

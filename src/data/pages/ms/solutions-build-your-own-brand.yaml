meta:
  title: 'Pembuatan SUP Label Peribadi & Pelancaran Jenama Tersuai | {SITE}'
  description: 'Pengilang SUP label peribadi untuk jenama papan dayung baharu. Lancarkan jenama SUP anda sendiri dengan Afarer — perkhidmatan OEM/ODM penuh termasuk reka bentuk, pembikinan prototaip, penjenamaan tersuai, pengeluaran, dan logistik global.'

hero:
  tagline: 'Bina Jenama Anda Sendiri'
  title: 'Lancarkan Jenama SUP<br />Anda Sendiri'
  subtitle: 'Anda mempunyai visi. Kami mempunyai kilang, kepakaran, dan rantai bekalan. Pembuatan SUP label peribadi dan pembangunan jenama SUP tersuai — bersama-sama, kami akan membina jenama yang menonjol.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Papan SUP berjenama tersuai di atas air'

process:
  title: 'Perjalanan Jenama Anda'
  subtitle: 'Daripada idea ke pasaran dalam 5 fasa.'
  steps:
    - phase: 'Fasa 1'
      title: 'Idea'
      period: 'Minggu 1-2'
      items:
        - 'Penyelidikan pasaran & analisis pesaing'
        - 'Definisi pelanggan sasaran'
        - 'Bengkel pemposisian jenama'
        - 'Strategi lini produk'
    - phase: 'Fasa 2'
      title: 'Reka Bentuk'
      period: 'Minggu 3-6'
      items:
        - 'Reka bentuk bentuk papan & grafik'
        - 'Padanan warna & pemilihan bahan'
        - 'Spesifikasi aksesori'
        - 'Reka bentuk pembungkusan & label'
    - phase: 'Fasa 3'
      title: 'Prototaip'
      period: 'Minggu 7-10'
      items:
        - 'Pengeluaran sampel'
        - 'Ujian kualiti (tekanan, keapungan, UV)'
        - 'Pelarasan reka bentuk'
        - 'Kelulusan akhir'
    - phase: 'Fasa 4'
      title: 'Pengeluaran'
      period: 'Minggu 11-14'
      items:
        - 'Pembuatan pukal'
        - 'Pemeriksaan QC (setiap unit)'
        - 'Pengangkutan laut / udara'
        - 'Dokumen pelepasan kastam'
    - phase: 'Fasa 5'
      title: 'Pelancaran'
      period: 'Minggu 15-16'
      items:
        - 'Fotografi produk'
        - 'Suapan produk laman web'
        - 'Bahan pemasaran'
        - 'Sokongan pelancaran'

packages:
  title: 'Pakej Permulaan'
  subtitle: 'Pakej yang direka untuk setiap peringkat pertumbuhan jenama.'
  items:
    - name: 'Jenama Permulaan'
      tagline: '50-100 unit · 2 model papan'
      features:
        - 'Percetakan logo asas'
        - 'Pembungkusan standard'
        - 'Sokongan e-mel'
    - name: 'Jenama Berkembang'
      tagline: '300-1,000 unit · 3-5 model papan'
      features:
        - 'Warna + logo tersuai'
        - 'Pembungkusan tersuai'
        - 'Foto produk'
        - 'Pengurus khusus'
    - name: 'Jenama Mantap'
      tagline: '1,000+ unit · Lini produk penuh'
      features:
        - 'Penyesuaian penuh'
        - 'Pembungkusan premium'
        - 'Kolateral pemasaran'
        - 'Keutamaan pengeluaran'


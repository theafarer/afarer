meta:
  title: 'Kepakaran Marin — Kejuruteraan dalam Setiap Lambung | {SITE}'
  description: 'Berdekad-dekad kejuruteraan marin dalam setiap lambung. afarer menguasai drop stitch, PVC marin dan reka bentuk SUP boleh tiup profesional.'
  keywords:
    - 'kejuruteraan marin'
    - 'pengeluar SUP boleh tiup'
    - 'pembuatan papan dayung'
hero:
  tagline: 'Kepakaran Marin'
  title: 'Berdekad-dekad Kejuruteraan Marin<br />dalam Setiap Lambung'
  subtitle: 'afarer menggabungkan sains bahan yang mendalam, pembuatan berketepatan dan ujian dunia sebenar untuk menghasilkan bot air yang berprestasi saat penting.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'pasukan kejuruteraan marin dan R&D afarer sedang bekerja'
expertise_materials:
  tagline: 'Sains Bahan'
  title: 'Memilih Bahan yang Tepat<br />untuk Setiap Aplikasi'
  subtitle: 'Kami bekerja dengan dua bahan teras — setiap satunya dipilih untuk kes kegunaan dan keperluan prestasi tertentu.'
  columns: 3
  items:
    - title: 'PVC Gred Marin'
      description: 'Fabrik PVC 1100 denier — bahan paling serba boleh kami. Stabil-UV, rintang haus dan mematuhi REACH. Ideal bagi papan SUP yang mementingkan kecekapan berat dan kos.'
      icon: tabler:droplet
    - title: 'Gentian Kaca & Polietilena'
      description: 'SUP berlaminat gentian kaca untuk kekakuan dan luncuran premium. Polietilena acuan putaran untuk kegunaan sewaan dan penyelamatan berat yang memerlukan rintangan hentaman maksimum.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Keupayaan Pembuatan'
  title: 'Pembuatan Berketepatan<br />di Setiap Langkah'
  subtitle: 'Kemudahan kami seluas 12,000 m² dilengkapi dengan jentera khusus bagi setiap peringkat pengeluaran.'
  columns: 2
  items:
    - title: 'Pemotongan CNC'
      description: 'Pemotongan terkawal komputer memastikan panel fabrik yang tepat dan boleh diulang dengan sisa minimum. Setiap keping sesuai sepenuhnya seperti direka.'
      icon: tabler:cpu
    - title: 'Kimpalan Frekuensi Tinggi'
      description: 'Kimpalan HF industri mewujudkan jahitan yang lebih kuat daripada bahan asas. Kawalan suhu dan tekanan yang konsisten memastikan meterai kedap udara merentasi setiap larian pengeluaran.'
      icon: tabler:bolt
    - title: 'Pemasangan Teras Drop Stitch'
      description: 'Ribuan benang poliester menghubungkan lapisan fabrik atas dan bawah, membolehkan pelambungan bertekanan tinggi (15-20 PSI) untuk papan SUP yang kaku dan stabil.'
      icon: tabler:building-arch
    - title: 'Ujian Tekanan'
      description: 'Setiap produk boleh tiup diuji tekanan sebelum dihantar. Papan diuji pada tekanan 1.25x daripada rating — jika ia bertahan di situ, ia akan berprestasi di atas air.'
      icon: tabler:wind
    - title: 'Ujian Kekuatan Jahitan'
      description: 'Sampel rawak daripada setiap kelompok pengeluaran menjalani ujian kekuatan jahitan pemusnahan. Keputusan direkodkan dan boleh dijejak kepada larian pengeluaran tertentu.'
      icon: tabler:files
    - title: 'Ujian Air'
      description: 'Setiap model menjalani ujian laut sebelum pensijilan. Ujian dunia sebenar dalam keadaan pesisir mengesahkan prestasi, pengendalian dan kestabilan.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Reka Bentuk & Kejuruteraan'
  title: 'Direkayasa untuk Keadaan Sebenar'
  subtitle: 'Falsafah reka bentuk kami bermula dengan bagaimana papan akan digunakan — kemudian membina kejuruteraan sekitar kes kegunaan tersebut.'
  items:
    - title: 'Reka Bentuk Lambung Berprestasi'
      description: 'Setiap bentuk lambung ditala untuk kes kegunaannya — hidung sesaran untuk luncuran lawatan, rocker tambahan untuk ketangkasan ombak, profil rata stabil untuk memancing dan yoga.'
    - title: 'Keselamatan Drop-Stitch'
      description: 'Setiap papan menampilkan teras drop-stitch kaku dengan rel diperkuat. Jika satu bahagian rosak, struktur drop-stitch bertegangan tinggi mengekalkan papan beroperasi.'
    - title: 'Susun Atur Dek Ergonomik'
      description: 'Penzonan pad dek, kedudukan pemegang angkut dan titik pemasangan direka mengikut keselesaan penunggang semasa kegunaan berpanjangan — sama ada lawatan, memancing atau rondaan.'
    - title: 'Konfigurasi Tersuai'
      description: 'Warna rel, konfigurasi pad dek, pelekat aksesori, kapasiti peralatan — setiap model boleh dipesuaikan untuk sepadan dengan keperluan operasi tertentu.'
cta:
  title: 'Ada aplikasi tertentu dalam fikiran?'
  subtitle: 'Pasukan kejuruteraan kami boleh menasihati pemilihan bahan, reka bentuk dan pembuatan untuk projek anda.'
  actions:

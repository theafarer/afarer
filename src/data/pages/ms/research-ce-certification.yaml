content_html: |
  <h2>Apakah Itu Pensijilan CE?</h2>
  <p>Penandaan CE (Conformit&eacute; Europ&eacute;enne) menunjukkan bahawa sesuatu produk memenuhi keperluan kesihatan, keselamatan dan alam sekitar EU. Bagi bot air boleh tiup, rangka kerja kawal selia yang berkenaan bergantung pada kategori produk tersebut.</p>

  <h2>Direktif Terpakai</h2>

  <h3>Direktif Bot Rekreasi (2013/53/EU)</h3>
  <p>Direktif utama bagi bot rekreasi di EU. SUP boleh tiup di bawah 2.4 m berada di luar skopnya dan sebaliknya disijilkan di bawah EN ISO 25649.</p>

  <h3>Peraturan Peralatan Pelindung Peribadi (2016/425)</h3>
  <p>Jaket keselamatan, alat bantu keapungan dan peralatan keselamatan yang disertakan dengan bot air mesti memenuhi keperluan Peraturan PPE, termasuk peperiksaan jenis (Modul B) oleh badan pemberitahu dan jaminan kualiti pengeluaran (Modul D atau E).</p>

  <h2>Proses Pensijilan</h2>
  <ol>
    <li>Klasifikasi produk: Tentukan kategori reka bentuk bot (A – D mengikut ISO 8666)</li>
    <li>Piawaian terpakai: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (plak pembina)</li>
    <li>Penyediaan fail teknikal: Lukisan reka bentuk, Senarai Bahan, sijil bahan, penilaian risiko</li>
    <li>Ujian jenis: Keapungan, kestabilan, kapasiti beban, ujian bahan, kekuatan jahitan, pengekalan udara</li>
    <li>Kawalan pengeluaran kilang: Audit badan pemberitahu ke atas proses pembuatan</li>
    <li>Perisytiharan Kesesuaian: Pengeluar menandatangani DoC, memasang penandaan CE</li>
  </ol>

  <h2>Badan Pemberitahu bagi Bot Air Boleh Tiup</h2>
  <p>Badan pemberitahu biasa termasuk Bureau Veritas (Perancis), DNV GL (Jerman), RINA (Itali), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Jerman).</p>

  <h2>Garis Masa dan Kos</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fasa</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tempoh</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Kos Biasa (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Penyediaan fail teknikal</td><td class="p-3 border">2 – 4 minggu</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Ujian jenis</td><td class="p-3 border">4 – 8 minggu</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Audit kilang</td><td class="p-3 border">1 – 2 hari (di lokasi)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Jumlah (produk pertama)</td><td class="p-3 border">8 – 14 minggu</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Maksud Ini Bagi Pembeli</h2>
  <p>Apabila membeli SUP boleh tiup bersijil CE, sentiasa sahkan penandaan CE berada pada plak pembina, DoC yang sah wujud, nombor Badan Pemberitahu disenaraikan dan manual pemilik mengandungi arahan keselamatan dalam bahasa tempatan anda. Semua produk Afarer membawa pensijilan CE dengan jejakan penuh kepada laporan audit badan pemberitahu.</p>


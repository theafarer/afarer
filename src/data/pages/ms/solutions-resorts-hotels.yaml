meta:
  title: 'Pembekal Peralatan SUP Resort & Hotel | Penyelesaian Armada Resort | {SITE}'
  description: 'Pembekal peralatan SUP resort untuk hotel dan resort di seluruh dunia. Armada SUP boleh tiup gred komersial, penjenamaan tersuai, latihan staf, dan pakej dioptimumkan ROI daripada 20 hingga 100+ papan.'

hero:
  tagline: 'Resort & Hotel'
  title: 'Jadikan Tepi Air Anda Pusat Hasil<br />Dengan Armada SUP Premium'
  subtitle: 'Afarer melengkapi resort di seluruh dunia dengan armada SUP boleh tiup gred komersial — daripada pakej permulaan 20 papan hingga program utama 100+ papan. Penjenamaan tersuai, latihan staf, dan alat ganti disertakan.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 'Tetamu resort menikmati papan SUP di pantai yang bersih'

roi_section:
  title: 'Model Hasil SUP Resort'
  subtitle: 'Bagaimana resort menjana pendapatan sewaan SUP tahunan 50,000 - 200,000+ USD dengan satu pelaburan.'
  metrics:
    - metric: '50K–200K+ USD'
      label: 'Hasil SUP Tahunan'
      detail: 'Setiap resort, berdasarkan saiz armada dan kadar penghunian'
    - metric: '4–6 Bulan'
      label: 'Tempoh Bayar Balik Purata'
      detail: 'Pulihkan pelaburan armada penuh dalam satu musim'
    - metric: '40%'
      label: 'Peningkatan Hasil'
      detail: 'Peningkatan purata selepas beralih kepada armada Afarer'
    - metric: '500+'
      label: 'Kitaran Sewaan Setiap Papan'
      detail: 'Ketahanan gred komersial untuk penggunaan harian'

packages:
  title: 'Sistem Pakej Resort'
  subtitle: 'Pilih pakej yang sesuai dengan kapasiti tetamu dan matlamat hasil anda. Semua pakej merangkumi waranti 12 bulan dan pensijilan CE.'
  items:
    - name: 'Pakej Permulaan'
      tagline: 'Untuk resort butik, sehingga 20 tetamu/hari'
      features:
        - '20 papan SUP (3 saiz untuk dewasa/kanak-kanak)'
        - '20 dayung (boleh laras) + 20 jaket keselamatan'
        - '4 pam tindakan berganda (elektrik pilihan)'
        - '2 rak penyimpanan + kit pembaikan'
        - 'Cetakan logo tersuai pada papan'
        - 'Waranti 12 bulan + tersijil CE'
      revenue: 'Potensi hasil tahunan 50K–80K USD'
      cta_text: 'Dapatkan Pakej Permulaan'
    - name: 'Pakej Premium'
      tagline: 'Untuk resort besar, 50-100 tetamu/hari'
      features:
        - '50 papan SUP (5 saiz, armada bercampur)'
        - '50 dayung + 50 jaket keselamatan'
        - '10 pam tindakan berganda + 2 pam elektrik'
        - '5 rak penyimpanan + 2 troli bergolek'
        - 'Penjenamaan tersuai penuh (papan, dayung, beg)'
        - 'Sesi latihan staf (dalam talian)'
        - 'Penghantaran alat ganti dalam 48 jam'
        - 'Waranti 12 bulan + tersijil CE'
      revenue: 'Potensi hasil tahunan 120K–200K+ USD'
      popular: true
      cta_text: 'Dapatkan Pakej Premium'
    - name: 'Pakej Utama'
      tagline: 'Untuk resort ultra-premium, 100+ tetamu/hari'
      features:
        - '100+ papan SUP (julat saiz penuh)'
        - 'Set aksesori lengkap (dayung, jaket keselamatan, pam, troli)'
        - 'Latihan staf di lokasi (2 hari)'
        - 'Pengurus akaun khusus'
        - 'Alat ganti keutamaan (penghantaran 24 jam)'
        - 'Penjenamaan tersuai penuh (papan + aksesori)'
        - 'Pakej foto/video pemasaran'
        - 'Waranti 24 bulan + tersijil CE'
      revenue: 'Potensi hasil tahunan 200K+ USD'
      cta_text: 'Dapatkan Pakej Utama'

case_study:
  quote: 'Sejak beralih kepada Afarer, hasil sewaan SUP kami meningkat 40%. Kos penggantian papan menurun 60%. Kami memulihkan pelaburan armada penuh dalam masa 4 bulan.'
  author: 'Pengurus Aktiviti Air'
  location: 'resort 5 bintang, Maldives'
  results:
    - label: 'Pertumbuhan Hasil'
      value: '+40%'
    - label: 'Pengurangan Kos'
      value: '-60%'
    - label: 'Tempoh Bayar Balik'
      value: '4 Bulan'

features:
  title: 'Mengapa Resort Memilih Afarer'
  subtitle: 'Ketahanan gred komersial, logistik global, dan rakan kongsi yang memahami industri perhotelan.'
  items:
    - title: '500+ Kitaran Sewaan'
      description: 'Setiap papan diuji untuk bertahan 500+ kitaran sewaan dalam air masin, panas matahari, dan pasir.'
      icon: 'tabler:shield-check'
    - title: 'Penghantaran Alat Ganti 48 Jam'
      description: 'Alat ganti dihantar dalam masa 48 jam — hasil sewaan anda tidak pernah berhenti.'
      icon: 'tabler:truck-delivery'
    - title: 'Penjenamaan Tersuai'
      description: 'Padankan identiti resort anda dengan warna dan logo tersuai pada setiap papan.'
      icon: 'tabler:palette'
    - title: 'Latihan Staf'
      description: 'Program latihan dalam talian dan di lokasi untuk pasukan aktiviti anda.'
      icon: 'tabler:school'
    - title: 'Logistik Global'
      description: 'Penghantaran ke 50+ negara dengan pilihan pengangkutan disatukan.'
      icon: 'tabler:world'
    - title: 'Tersijil CE'
      description: 'Semua peralatan tersijil CE, ISO 9001:2015 — keselamatan dan kualiti terjamin.'

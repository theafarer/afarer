seo:
  headline: 'Waranti SUP Boleh Tiup afarer — Waranti Terhad 5 Tahun | afarer'
  description: 'afarer menawarkan waranti terhad 5 tahun bagi fabrik dek utama, jahitan dan keutuhan struktur teras drop-stitch. Turut meliputi injap pelambungan dan aksesori terpasang kilang. Terma dan syarat penuh bagi waranti SUP boleh tiup afarer.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Waranti Terhad ini terpakai bagi produk marin boleh tiup berjenama afarer baharu yang dibeli terus daripada afarer atau daripada peniaga atau peruncit afarer yang sah. Tarikh berkuat kuasa ialah tarikh pembelian runcit asal yang boleh disahkan.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Liputan & Tempoh Waranti</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Keutuhan fabrik tiub utama (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Keutuhan struktur lambung gentian kaca</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Keupayaan jahitan tiub boleh tiup menahan udara</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Fungsi injap pelambungan</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Aksesori terpasang kilang dan kelengkapan tambahan</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Tahun*</h3>
        <p class="text-sm text-gray-600 mt-1">Kegunaan komersial, sewaan atau armada — semua komponen</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Kegunaan komersial, kerajaan, piagam, sewaan atau pengajaran mengurangkan waranti kepada 1 tahun. Kegunaan perlumbaan atau pertandingan membatalkan waranti sepenuhnya.</p>
  </div>

  <h2>Apakah Yang Diliputi</h2>
  <h3>Fabrik Tiub Utama (5 Tahun)</h3>
  <p>afarer menjamin fabrik dek utama terhadap kemerosotan keliangan yang merosakkan keupayaan produk mengekalkan pelambungan operasi dengan ketara. Ini terpakai bagi fabrik bersalut PVC dan semua bahan fabrik dek lain yang digunakan dalam pembuatan.</p>

  <h3>Keutuhan Struktur Lambung Gentian Kaca (5 Tahun)</h3>
  <p>Bagi produk dengan lambung plastik diperkuat gentian kaca (FRP), struktur komposit asas dijamin terhadap kegagalan struktur akibat kecacatan bahan atau kerja tangan.</p>

  <h3>Keupayaan Jahitan Tiub Boleh Tiup Menahan Udara (5 Tahun)</h3>
  <p>Jahitan tiub boleh tiup, di mana ia disambung semasa pembuatan, dijamin terhadap kecacatan pengeluaran yang mengakibatkan kebocoran udara ketara melalui jahitan. Pemeriksaan berkala dan penyelenggaraan tekanan pelambungan yang sewajarnya adalah syarat liputan.</p>

  <h3>Fungsi Injap Pelambungan (5 Tahun)</h3>
  <p>Injap pelambungan udara yang asalnya dipasang oleh afarer dijamin terhadap kecacatan pengeluaran dalam bahan atau kerja tangan yang menghalang injap daripada menahan udara seperti yang direka.</p>

  <h3>Aksesori Terpasang Kilang (1 Tahun)</h3>
  <p>Komponen dan kelengkapan yang dikeluarkan oleh afarer dan asalnya dipasang di kilang dijamin terhadap kecacatan bahan dan kerja tangan selama satu tahun. Ini tidak termasuk item pihak ketiga, yang hanya diliputi oleh waranti pengeluar masing-masing.</p>

  <h2>Apakah Yang Tidak Diliputi</h2>
  <ul>
    <li>Kecacatan kosmetik termasuk perubahan warna, kotoran melekat, pudar, berkapur atau sebarang perubahan pada penampilan</li>
    <li>Torehan, potongan, koyakan, robekan atau kerosakan fizikal lain</li>
    <li>Retakan halus, keretakan, kehausan, calar atau kemerosotan akibat geseran atau sentuhan</li>
    <li>Degradasi akibat pendedahan cahaya UV, luluhawa atau keadaan atmosfera</li>
    <li>Kerosakan akibat sentuhan bahan api, pelarut, asid, alkali atau bahan kimia</li>
    <li>Kerosakan akibat kecuaian, kegunaan tidak wajar, penyalahgunaan, kemalangan atau haus dan lusuh biasa</li>
    <li>Masalah permukaan gelcoat atau cat (melepuh, retakan halus, perubahan warna, pudar)</li>
    <li>Kerosakan akibat hentaman, tekanan, penyokongan tidak wajar atau pengangkutan treler</li>
    <li>Kerosakan akibat pelambungan/pengecilan tidak wajar atau penggunaan peranti pelambungan yang tidak diluluskan</li>
    <li>Peralatan, komponen atau sistem pihak ketiga (diliputi oleh pengeluar masing-masing)</li>
  </ul>

  <h2>Kewajipan & Penyelesaian Pengeluar</h2>
  <p>Kewajipan tunggal dan eksklusif afarer ialah pembaikan atau penggantian, mengikut pilihan afarer, bagi mana-mana komponen yang didapati cacat dari segi bahan atau kerja tangan dan diliputi di bawah waranti ini. Pembaikan atau penggantian dilakukan oleh afarer atau kemudahan servis sah yang ditetapkannya. Komponen yang dibaiki atau diganti hanya dijamin untuk baki tempoh waranti asal yang belum luput.</p>

  <h2>Syarat Waranti</h2>
  <ul>
    <li><strong>Pendaftaran:</strong> Produk mesti didaftarkan dengan betul seperti yang diwajibkan dalam terma waranti.</li>
    <li><strong>Penyelenggaraan:</strong> Produk mesti diselenggara mengikut garis panduan yang diterbitkan oleh afarer, termasuk pemeriksaan berkala dan penyelenggaraan tekanan pelambungan yang sewajarnya.</li>
    <li><strong>Kerjasama:</strong> Pembeli mesti bekerjasama sepenuhnya dan segera dengan afarer dalam semua perkara berkaitan tuntutan waranti.</li>
    <li><strong>Pembeli Asal:</strong> Waranti ini diberikan secara eksklusif kepada pembeli pengguna akhir asal dan tidak boleh dipindahkan.</li>
  </ul>

  <h2>Kegunaan Komersial</h2>
  <p>Jika produk digunakan bagi tujuan komersial, kerajaan, bukan untung, piagam, sewaan, pengajaran atau mana-mana tujuan selain kegunaan rekreasi persendirian, tempoh waranti bagi semua komponen dikurangkan kepada satu (1) tahun daripada tarikh asal pembelian runcit. Penggunaan dalam perlumbaan, pertandingan kelajuan atau ketahanan serta-merta dan tidak boleh dibatalkan memansuhkan waranti sepenuhnya.</p>

  <h2>Cara Membuat Tuntutan Waranti</h2>
  <p>Hubungi afarer atau peniaga sah anda dengan bukti pembelian dan penerangan terperinci tentang masalah tersebut. afarer akan menyemak tuntutan dan memberikan arahan bagi pemeriksaan dan servis.</p>
  <p>Untuk pertanyaan servis waranti, sila hubungi kami melalui <a href="/contact/" class="text-sky-600 underline">halaman hubungi</a> kami dengan nombor pesanan dan butiran produk anda.</p>

  <h2>Item Pihak Ketiga</h2>
  <p>Peralatan, komponen atau sistem yang dikeluarkan oleh pihak ketiga (walaupun dipasang oleh afarer) hanya diliputi oleh mana-mana waranti yang ditawarkan oleh pengeluar masing-masing. afarer secara jelas menafikan sebarang tanggungjawab waranti bagi item pihak ketiga tersebut.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Penyata waranti ini merupakan ringkasan Waranti Terhad Pengeluar afarer yang lengkap. Dokumen waranti undang-undang penuh mengawal semua terma dan syarat waranti. Spesifikasi boleh berubah tanpa notis. afarer ialah jenama yang dikendalikan oleh Aquafarer LLC (AS).
  </p>

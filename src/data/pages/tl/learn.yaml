meta:
  title: 'Matuto — SUP at Paddle | {SITE}'
  description: 'Matuto kasama ang afarer: mga tutorial sa inflatable SUP, mga teknik sa pagpapaddle, mga pangunahing kaalaman sa kagamitan, at edukasyong pandagat para sa mga mahihilig at negosyo.'
  keywords:
    - 'learn sup'
    - 'paddle board tutorial'
    - 'edukasyon sa inflatable sup'
    - 'paddle techniques'
hero:
  tagline: 'Kaalaman sa Paggalugad ng Tubig'
  title: 'Matuto'
  subtitle: |
    Mga gabay, tutorial, at malalimang pagtalakay — lahat ng kailangan mo upang galugarin<br />
    ang tubig nang may kumpiyansa. Mula sa pagpili ng iyong unang SUP hanggang sa pagmamaster ng mga advanced na teknik.
  taglineSection: 'Kaalaman para sa bawat tagapagpaddle. Mula baguhan hanggang propesyonal.'

featured:
  tagline: 'Mga Tampok na Paksa'
  title: 'Simulan ang iyong paglalakbay sa pag-aaral'
  subtitle: 'Baguhan ka man sa water sports o nais tumaas ng antas, saklaw ka ng aming mga gabay.'
  items:
    - title: 'Mga Pangunahing Kaalaman sa SUP'
      description: 'Lahat ng kailangan malaman ng isang baguhan — mga uri ng board, sukat ng paddle, tindig, at mga tip sa unang araw.'
      icon: 'tabler:lifebuoy'
      href: '/learn/sup'
    - title: 'Inflatable kumpara sa Hard Board'
      description: 'Alin ang angkop sa iyo? Ihambing namin nang magkatabi ang portability, performance, tibay, at gastos.'
      icon: 'tabler:arrows-left-right'
      href: '/compare/inflatable-vs-hardboard'
    - title: 'Kaligtasan sa Tubig'
      description: 'Mahahalagang kaalaman sa kaligtasan na dapat mayroon ang bawat tagapagpaddle — panahon, mga PFD, self-rescue, at marami pa.'
      icon: 'tabler:shield'
      href: '/learn/water-safety'
    - title: 'Gabay sa Materyales'
      description: 'Mga antas ng PVC, teknolohiyang drop-stitch, mga denier rating — unawain kung ano ang komposisyon ng iyong kagamitan.'
      icon: 'tabler:flask'
      href: '/learn/materials'
    - title: 'Gabay sa Laki ng SUP'
      description: 'Hanapin ang tamang haba, lapad, at volume ng board para sa iyong timbang, kasanayan, at istilo ng pagpapaddle.'
      icon: 'tabler:ruler'
      href: '/size-guide'
    - title: 'Mga Teknik sa Katamtamang Antas'
      description: 'Itaas ang antas ng iyong pagpapaddle gamit ang mga advanced na stroke, teknik sa pagliko, at paghawak sa magaspang na tubig.'
      icon: 'tabler:droplet'
      href: '/learn/intermediate-techniques'


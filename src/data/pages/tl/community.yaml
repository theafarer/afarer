stories:
  tagline: 'Mga Kuwento ng Explorer'
  title: 'Totoong pakikipagsapalaran mula sa totoong tao'
  subtitle: 'Makinig sa mga paddler, pamilya, at propesyonal na gumagamit ng kagamitang afarer sa tubig.'
  items:
    - name: 'Sarah & Mike'
      title: 'Mga may-ari ng SUP Explorer 11, Canada'
      content: 'Dinala namin ang aming mga Explorer 11 sa isang linggong biyahe sa buong Algonquin Park. Maganda nila na-handle ang mga portage at pagtawid sa lawa. Ang drop-stitch construction ay nangangahulugang pwede kaming mamaga hanggang 15 PSI at makakuha ng pagganap ng hard board mula sa isang board na mabubuo.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Algonquin Park, Canada'
    - name: 'Carlos R.'
      title: 'Tagasakay ng Cheetah Surge, Spain'
      content: "Ang Cheetah Surge ang go-to ko para sa coastal cruising. Ang masiglang disenyo ay humahatak ng tingin sa dalampasigan, at ang stability ay nagbibigay sa akin ng kumpiyansa sa bahagyang chop. Maganda ang pag-handle nito manapa't nag-totouring ako o nagtatamasa lang sa paglubog ng araw."
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Spain'
    - name: 'Lina & pamilya'
      title: 'Mga paddler ng Flowing Lotus, Sweden'
      content: "Mga weekend na pakikipagsapalaran ng pamilya sa archipelago. Sapat na stable ang Flowing Lotus para makatayo ang aking anak habang ako'y nagkakayak. Namamaga sa humigit-kumulang 10 minuto — walang trailer na kailangan, purong kasiyahan ng pamilya sa tubig."
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Kapuluan ng Stockholm, Suwesya'
    - name: 'Lt. Cmdr. Andres'
      title: 'Explorer ng Ocean Voyager, Pilipinas'
      content: 'Ginagamit ko ang aking Ocean Voyager para sa malalayong coastal tour sa paligid ng Palawan. Pagkatapos ng ilang buwan ng pang-araw-araw na paggamit sa tropikal na kondisyon, gumagana pa rin ang board na parang bago. Ang hugis ng touring ay tumatabas sa chop na makakapagpahinto sa mas mahihinang board.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palawan, Pilipinas'
    - name: 'Emma T.'
      title: 'First-timer ng Tropical Breeze, Australia'
      content: 'Hindi pa ako kailanman nakasakay sa SUP noon. Napakastable ng Tropical Breeze kaya kumportable ako sa unang subok ko. Ngayon ay nagkakayak ako tuwing weekend. Halos zero ang learning curve — at maganda ang board sa tubig.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Australia'


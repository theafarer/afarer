features3_reasons:
  tagline: 'Bakit Piliin ang afarer'
  title: 'Pitong Dahilan upang Makipagpartner sa Amin'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Tunay na Pagmamanupaktura, Hindi Trading'
      description: 'Pag-aari at pinapatakbo namin ang isang 12,000 m² na pabrika. Kapag nakipagpartner ka sa afarer, nakipagtulungan ka nang direkta sa mga taong nagdidisenyo, nag-i-engineer, at nagtatayo ng iyong mga produkto — walang middleman.'
      icon: tabler:building-factory
    - title: '2. Pinangungunahan ng Engineering'
      description: 'Nagsisimula ang aming proseso sa disenyo sa kaso ng paggamit, hindi sa kategorya ng produkto. Ino-optimize namin ang hugis ng hull, pagpili ng materyales, at configuration para sa kung paano talaga gagamitin ang board.'
      icon: tabler:engine
    - title: '3. Sertipikadong Kalidad'
      description: 'CE certified, ISO quality system, sumusunod sa BSCI, sumusunod sa REACH, aprubado ng USCG. Bawat produkto ay tumutugon sa mga pandaigdigang pamantayan — hindi lamang mga paghahabol.'
      icon: tabler:certificate
    - title: '4. Flexible na Co-Branding'
      description: 'Kulay ng rail, deck layout, branding, packaging — ini-customize namin ayon sa iyong espesipikasyon. Walang pressure sa minimum order. Magsimula sa isang prototype, lumago nang may kumpiyansa.'
      icon: tabler:adjustments
    - title: '5. Pandaigdigang Logistics'
      description: 'US warehouse sa California, direktang pagpapadala mula Qingdao, air freight para sa mga urgent na order. Bahala kami sa papeles at dokumentasyon ng customs.'
      icon: tabler:truck-delivery
    - title: '6. Suportang Habang-buhay'
      description: 'Sinusuportahan namin ang mga board na itinayo namin 20 taon ang nakalipas. Orihinal na spare part, teknikal na payo, gabay sa pagkukumpuni — naroon ang aming koponan kapag kailangan mo kami.'
      icon: tabler:lifebuoy
    - title: '7. Matapat na Espesipikasyon'
      description: 'Totoong load rating, totoong dimensyon, totoong timbang. Walang pagpapalaki sa marketing. Ang aming inilalathala ay ang iyong matatanggap — binabatayan ng independiyenteng pagsusuri.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Pinagkakatiwalaan ng mga Brand Sa Buong Mundo'
  title: 'Ano ang Sinasabi ng Aming mga Partner'
  items:
    - content: 'Nakipagtulungan na kami sa ilang manufacturer sa Tsina, ngunit natatangi ang afarer dahil sa kanilang engineering support at pare-parehong kalidad. Trinato nila ang aming brand na parang kanila.'
      name: '— Co-Brand Partner, Brand ng Water Sports sa Europa'
    - content: 'Nasa serbisyo ang kanilang mga SUP board sa aming fleet nang mahigit 5 taon. Kaunting maintenance, mahusay na UV resistance. Ang 5-taong warranty ay nagbibigay sa amin ng kumpiyansa.'
      name: '— Operator ng Fleet, Grupo ng Resort sa Gitnang Silangan'
    - content: 'Tinulungan kami ng koponan ng afarer na bumuo ng custom na disenyo ng SUP board mula konsepto hanggang produksyon sa loob ng 90 araw. Lumampas sa aming inaasahan ang kalidad.'
      name: '— Distributor, Watersports sa Australya'
cta:
  title: 'Handa nang maranasan ang pagkakaiba?'
  subtitle: 'Makipag-ugnayan sa aming koponan upang talakayin ang iyong proyekto. Walang kailangang kompromiso — tapat na payo lamang tungkol sa pagmamanupaktura.'
  actions:
    - variant: primary
      text: 'Makipag-usap sa aming koponan'
      href: /contact/
    - text: 'I-download ang product catalog'
      href: /resources/download-catalog/

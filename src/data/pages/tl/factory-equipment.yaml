meta:
  title: 'Kagamitan ng Pabrika — Cutting, RF Welding at Printing | {SITE}'
  description: 'Industrial-grade na kagamitan ng afarer sa pagmamanupaktura: PVC cutting, RF welding, digital printing, assembly, at testing para sa mga inflatable SUP.'
  keywords:
    - 'kagamitan sa pagmamanupaktura ng sup'
    - 'pabrika ng inflatable sup'
    - 'rf welding pvc'
    - 'produksyon ng paddle board'
hero:
  tagline: 'Kagamitan'
  title: 'Kagamitan at Makinarya sa Pagmamanupaktura'
  subtitle: 'Industrial-grade na kagamitan sa cutting, welding, printing, at assembly'
  back_label: 'Bumalik sa Factory'
  back_link: /factory/

categories:
  - title: 'Cutting at Paghahanda ng Materyales'
    items:
      - name: 'Awtomatikong Makinang Paggugupot ng PVC'
        spec: 'CNC-controlled, 6.5 m × 2.5 m, 0.1 mm katumpakan'
        desc: 'Computer-controlled na automatic cutting machine para sa PVC at drop-stitch fabric. Ang nesting software ay nag-o-optimize ng paggamit ng materyales sa mas mababa sa 5% na basura.'
      - name: 'Fabric Spreader'
        spec: '3 m pinakamalaking lapad, tension-controlled na pagpapakain'
        desc: 'Naglalatag ng tela sa isa o maraming layer na may kontroladong tension upang maiwasan ang depekto bago gupitin.'

  - title: 'Pag-weld at Pagdugtong ng Tube'
    items:
      - name: 'Heat Sealing Machine'
        spec: 'Hot-air welding, nababago 200–600 °C, 0.5–5 m/min'
        desc: 'Hot-air heat sealing machine para sa pagdugtong at pag-weld ng PVC at rail seam. Ginagamit para sa tacking, sealing, at pagsasanib ng mga tube chamber at float joint.'
      - name: 'Dielectric RF Press'
        spec: '15 kW, plato 2000 × 600 mm'
        desc: 'Radio-frequency welding press para sa pangunahing longitudinal seam, rail band, at paggawa ng malaking chamber.'
      - name: 'RF Welder na Kinokontrol ng CNC'
        spec: '8 kW, mesa ng XY 2500 × 1200 mm'
        desc: 'Programmable na pag-weld ng kurbadang seam para sa masalimuot na geometry, pag-emboss ng logo, at precision patchwork.'

  - title: 'Pagmamanupaktura ng SUP Board'
    items:
      - name: 'Press para sa Laminasyon ng Drop-Stitch Core'
        spec: 'Large-format press para sa core ng board na hanggang 14 ft LOA'
        desc: 'Precision na lamination ng drop-stitch core sa panlabas na PVC laminate. Bawat layer ay pressure-bonded para sa pare-parehong kalidad at lakas.'
      - name: 'CNC Router (5-axis)'
        spec: '3 m × 2 m × 1 m envelope, water-cooled na spindle'
        desc: 'Pag-ukit ng fin box, cutout ng handle, at custom na component ng board.'

  - title: 'Printing at Dekorasyon ng SUP'
    items:
      - name: 'Digital Printer'
        spec: 'High-resolution inkjet, hanggang 2 m lapad ng print'
        desc: 'Direct-to-fabric digital printing para sa buong-kulay na graphic ng SUP deck. Nagpi-print ng custom na pattern, gradient, at larawang photo-quality gamit ang UV-resistant na water-based na tinta.'
      - name: 'Screen Printing Machine'
        spec: 'Manual at semi-automatic, multi-colour registration'
        desc: 'Screen printing para sa logo ng SUP board, brand mark, at paulit-ulit na pattern. Nagbibigay ng matibay at solid na print na may buhay na saturation ng kulay.'

  - title: 'Assembly at Rigging'
    items:
      - name: 'Board Assembly Station'
        spec: 'Modular at nababago, multi-station layout'
        desc: 'Assembly ng fin box, handle, D-ring, valve, at deck pad sa mga SUP board.'
      - name: 'Press para sa Pag-instala ng Valve'
        spec: 'Pneumatic, nababagong presyon'
        desc: 'Precision na pagkabit at pagselyo ng mga valve na Halkey-Roberts at Leafield.'
      - name: 'Deck Pad Laminator'
        spec: '3 m × 1.5 m, kontrolado ang temperatura'
        desc: 'Heat lamination ng EVA foam deck pad sa itaas ng SUP board na may pare-parehong lakas ng pagdikit.'

  - title: 'Testing at Quality Control'
    items:
      - name: 'Unibersal na Pampasubok ng Tensile'
        spec: '50 kN, ASTM D751'
        desc: 'Pagsusuri ng breaking force, elongation at break, at tear propagation para sa mga batch ng tela.'
      - name: 'Air Retention Test Rig'
        spec: 'Napoprograma, 30-minutong pagpapanatili ng presyon'
        desc: 'Automated na pressure-hold test para sa bawat tube chamber bago ang assembly.'
      - name: 'Seam Peel Tester'
        spec: 'Motorised 180° peel sa 100 mm/min'
        desc: 'Pagsusuri ng peel strength ng weld at glued seam ayon sa EN ISO 25649.'
      - name: 'Xenon-Arc na Silid ng Paglalantad sa Panahon'
        spec: '2000 h exposure'
        desc: 'Pagsusuri ng UV resistance para sa pagbabago ng kulay at pagpapanatili ng lakas.'


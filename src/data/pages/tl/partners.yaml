meta:
  title: 'Mga Partner — Distribusyon at Wholesale | {SITE}'
  description: 'Maging partner ng afarer: mga network ng distribusyon, wholesale pricing, mga programang OEM/private label, at suporta para sa mga negosyo ng paddle board sa buong mundo.'
  keywords:
    - 'partner ng sup distribution'
    - 'wholesale ng paddle board'
    - 'distributor ng inflatable sup'
    - 'partnership sa sup'
hero:
  tagline: 'Mga Partner at Distribusyon'
  title: 'Maging Partner ng afarer<br />— Pandaigdigang Network ng Distribusyon'
  subtitle: 'Sumali sa pandaigdigang network ng partner ng afarer. Nakipagtulungan kami sa mga marine distributor, paddle sports dealer, equipment retailer, at brand partner sa 50+ bansa.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: 'pandaigdigang partner at distributor network ng afarer'
content_programs:
  tagline: 'Mga Partner Program'
  title: 'Mga Partner Program<br />Itinayo para sa Paglago'
  subtitle: "Manapa't distributor, dealer, o brand partner ka, nag-aalok ang afarer ng mga programang dinisenyo upang suportahan ang iyong negosyo."
  columns: 3
  items:
    - title: 'Distributor Program'
      description: 'Eksklusibong distribusyon sa teritoryo na may volume pricing, marketing support, at direktang daan sa pabrika. Kailangang minimum na kompromiso batay sa laki ng teritoryo.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Direktang dealer pricing, product training, marketing material, at warranty support para sa mga retail location at online store.'
      icon: tabler:building-store
    - title: 'OEM/ODM Partnership'
      description: 'Full-service na OEM at ODM manufacturing na may custom branding, packaging, at espesipikasyon ng produkto. Mula konsepto hanggang container.'
      icon: tabler:certificate
    - title: 'Brand Partnership'
      description: 'Co-branding, private label, at mga eksklusibong programang modelo para sa mga matatag na brand sa espasyo ng marine at outdoor recreation.'
      icon: tabler:stars
    - title: 'Gobyerno at Institusyonal'
      description: 'Mga preferred supplier program para sa mga ahensya ng gobyerno, coast guard, military, at humanitarian na organisasyon. Dokumentasyong handa na sa tender.'
      icon: tabler:building-community
    - title: 'Resort at Rental Partner'
      description: 'Fleet pricing, pare-parehong kalidad, at custom branding para sa mga resort, diving center, at rental operation sa buong mundo.'
      icon: tabler:sun
content_benefits:
  tagline: 'Bakit Makipagpartner sa Amin'
  title: 'Bakit Pinipili ng mga Partner ang afarer'
  subtitle: 'Nakikinabang ang aming mga partner mula sa tunay na kakayahang magmaniobra, pare-parehong kalidad, at tumutugong suporta.'
  list:
    - 'Direktang Daan sa Pabrika: Makipagtulungan nang direkta sa aming manufacturing team — walang middleman. Makakuha ng mas mabilis na tugon, mas mabuting presyo, at buong tanaw sa produksyon.'
    - 'Handa sa Customization: I-brand ang iyong mga produkto na may custom na kulay, logo, packaging, at espesipikasyon. Minimum order quantity na nakaakma sa iyong merkado.'
    - 'Garantisadong Kalidad: ISO 9001 certified na produksyon na may pagsunod sa CE, UKCA, at BSCI. Bawat produkto ay sinusubukan bago ipadala.'
    - 'Pandaigdigang Logistics: Pagpapadala mula Qingdao, Tsina na may mga opsyong FOB, CIF, at DDP. US warehouse sa Montclair, CA para sa distribusyon sa North America.'
    - 'Marketing Support: Mga product catalog, potograpiya, teknikal na dokumentasyon, at digital asset upang suportahan ang iyong pagbebenta.'
    - 'Training at Suporta: Product training para sa iyong sales team, teknikal na suporta para sa iyong mga customer, at koordinasyon ng warranty service.'
content_process:
  tagline: 'Paano Maging Partner'
  title: 'Simpleng Proseso ng Partnership'
  subtitle: 'Simple ang aming proseso ng partnership — dinisenyo upang mabilis ka nang makapagbenta ng mga produkto ng afarer.'
  items:
    - title: 'Hakbang 1: Magsumite ng Aplikasyon'
      description: 'Punan ang aming partner application form na may profile ng iyong kumpanya, target merkado, at mga interes sa produkto.'
    - title: 'Hakbang 2: Pagsusuri ng Kwalipikasyon'
      description: 'Sinusuri ng aming partnership team ang iyong aplikasyon at makikipag-ugnayan sa iyo sa loob ng 3 business day upang talakayin ang mga pagkakataon.'
    - title: 'Hakbang 3: Kasunduan at Paghahanda'
      description: 'Pumirmahin ang partnership agreement, buuin ang iyong account, at tumanggap ng partner pricing, marketing material, at sample ng produkto.'
    - title: 'Hakbang 4: Training at Paglunsad'
      description: 'Product training, sales support, at marketing collateral ang ibinibigay. Handa ka nang magsimulang magbenta.'
cta:
  title: 'Handa ka na bang maging partner ng afarer?'
  subtitle: 'Mag-apply para sa partnership at tutugon ang aming koponan sa loob ng 3 business day.'
  actions:
    - variant: primary
      text: 'Mag-apply para sa partnership'
      href: /contact/
    - text: 'Tingnan ang aming mga produkto'
      href: /products/

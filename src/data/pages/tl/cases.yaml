features3_cases:
  tagline: 'Mga Tampok na Case'
  title: 'Mga Custom na Solusyon<br />Para sa Tunay na Hamon'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Fleet ng European Diving Center'
      customer: 'BlueMed Diving Centers'
      country: 'Greece'
      industry: 'Pang-dive at Marine Tourism'
      challenge: 'Kailangan ng 12 dive-configured na SUP para sa isang kadenang diving center sa maraming isla ng Greece. Ang bawat board ay nangangailangan ng custom na pagkakakabit ng kagamitan, imbakan para sa 8 na tank, at matatag na plataporma para sa pagpasok ng diver sa bukas na tubig. Kailangang dumating ang fleet sa loob ng 60 araw para sa simula ng tourist season.'
      solution: 'Gumawa ng 12 SUP Voyager Dive model na may integrated na gear rack, matatag na plataporma, at napakalapad na drop-stitch construction para sa katatagan sa pagsakay. Ang bawat board ay binrandan ng livery ng fleet ng customer. Lahat ng 12 board ay pressure-tested at naipadala mula sa Qingdao sa loob ng 55 araw.'
      product: 'SUP Voyager Dive'
      results: 'Lahat ng 12 board ay naihatid sa takdang oras para sa tourist season. Ang fleet ay nasa araw-araw na operasyon na sa loob ng 18+ buwan na may zero na pagkasira ng materyal. Nag-order ang customer ng 6 karagdagang unit sa ikalawang taon.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Ang SUP Voyager Dive ay naging haligi ng aming araw-araw na operasyon sa pag-dive. Napakahusay ng katatagan, at ang layout ng imbakan ng kagamitan ay nagpapanatiling malinis at ligtas ang deck para sa aming mga bisita.'
      icon: tabler:lifebuoy
    - title: 'Co-Brand Program ng Australian Distributor'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Australia'
      industry: 'Co-Brand at Partnership Program'
      challenge: 'Kailangan ng Australian distributor ng private-label na linya ng SUP board na may mapagkumpitensyang presyo upang makipagkumpitensya sa mga Chinese direct-to-consumer na brand. Nangangailangan ng 8 natatanging model mula baguhan hanggang advanced, na may custom na graphics, custom na packaging, at drop-ship fulfillment sa mga retail outlet.'
      solution: 'Nag-develop ng 8 model ng SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) na may eksklusibong Australian graphics package. Custom na retail packaging na may mga QR code na nag-uugnay sa mga video ng pag-setup. Drop-ship logistics na naka-configure mula Qingdao direkta sa mga retail store sa Australia.'
      product: 'Custom na Linya ng SUP (8 model)'
      results: 'Mula konsepto hanggang unang shipment sa loob ng 90 araw. Retail sell-through rate na 85% sa unang season. Pininalawak ng distributor ang partnership upang isama ang karagdagang mga model ng SUP sa ikalawang taon.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Naghagis ang afarer ng kumpletong linya ng SUP sa loob ng 90 araw — mula sa unang disenyo hanggang sa sahig ng retail. Ang kalidad ay katumbas ng mga brand na nagbebenta nang dalawang beses na presyo.'
      icon: tabler:currency-dollar
    - title: 'Paghahatid ng Kagamitang Pang-ligtas sa Middle East'
      customer: 'Pambansang Ahensya ng Sibil na Pagtatanggol'
      country: 'United Arab Emirates'
      industry: 'Paghahanap at Pagliligtas'
      challenge: 'Kailangan ng organisasyon ng civil defense ng 20 patrol-ready na SUP para sa coastal search and rescue, seguridad ng port, at pagtugon sa baha. Nangangailangan ng mga high-visibility na board, kumpletong kagamitang pangkaligtasan, at pagsunod sa mga lokal na regulasyon sa martimo.'
      solution: 'Nagbigay ng 20 SUP Patrol model na may high-visibility na orange drop-stitch construction, kumpletong safety package, SOLAS reflective tape, at pinalakas na konstruksyon. Ang bawat board ay CE-certified at sinubok sa mga naaangkop na pamantayan. Ang documentation package ay may kasamang mga sertipiko ng pagsunod para sa lokal na pagpaparehistro.'
      product: 'SUP Patrol'
      results: 'Ang fleet ay deployed sa 5 coastal station. Ang mga board ay gumagana sa matinding init (45°C+) nang walang pagkasira. Lumampas ang performance at tibay sa mga espesipikasyon.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Lumampas ang SUP Patrol sa aming mga kinakailangan sa operasyon. Sa matinding kundisyon ng init, walang bakas ng pagkasira dahil sa UV ang mga board pagkatapos ng 24 buwan ng araw-araw na paggamit.'
      icon: tabler:alert-triangle
    - title: 'Co-Brand Partnership sa Europe'
      customer: 'North Sea Marine Equipment BV'
      country: 'Netherlands'
      industry: 'Co-Brand at Partnership Program'
      challenge: 'Gustong pumasok ng established na European marine brand sa market ng SUP nang hindi namumuhunan sa mga pasilidad ng paggawa. Kailangan ng white-label na partner na kayang gumawa ng 5 model ng SUP (9 ft hanggang 12 ft) na may private branding, CE certification, at eksklusibong karapatan sa distribusyon sa EU.'
      solution: 'Nagtatag ng white-label manufacturing agreement para sa 5 model ng SUP. Ang bawat model ay binrandan ng logo at kulay ng customer. Inihanda ang CE certification documentation para sa bawat model. Ibinigay ang eksklusibong karapatan sa distribusyon sa EU na may mga pangako sa pinakamababang order. Nagbigay ng teknikal na dokumentasyon para sa lokal na network ng serbisyo.'
      product: 'Custom na Linya ng SUP (5 model)'
      results: 'Napirmahan ang multi-year na kasunduan. Ang unang production run na 50 unit ay naipadala sa loob ng 75 araw. Inilunsad ang brand sa pangunahing trade show na may positibong pagtanggap ng mga dealer.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Ang pagtutulungan sa afarer ay nagpahintulot sa amin na pumasok sa market ng SUP nang hindi gumagawa ng pabrika — naghatid sila ng kumpletong turnkey solution na may CE certification at dokumentasyon para sa suporta sa dealer.'
      icon: tabler:building
    - title: 'Fleet ng Resort sa Caribbean'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahamas'
      industry: 'Marine Tourism at Hospitality'
      challenge: 'Kailangan ng luxury resort ng kumpletong fleet ng kagamitang water sports para sa mga aktividad ng bisita: 40 SUP board para sa mga guided tour, 20 karagdagang SUP para sa paggalugad ng lagoon, 10 SUP board para sa mga excursion ng bisita, kasama ang mga aksesorya. Lahat ng kagamitan ay nangangailangan ng custom na branding ng resort at kailangang maihatid bago ang peak tourist season.'
      solution: 'Gumawa ng kumpletong SUP package: 40 SUP Voyager board (All-Around model), 20 SUP Explorer board, 10 SUP Touring board, kasama ang mga PFD, paddle, pump, at repair kit. Lahat ng kagamitan ay na-print ng logo ng resort at tropical na scheme ng kulay. Containerized shipment na may kumpletong inventory manifest.'
      product: 'Kumpletong SUP Package (70+ unit)'
      results: 'Dumating ang fleet 6 linggo bago ang peak season. Tumaas ng 40% year-over-year ang iskor ng kasiyahan ng bisita sa mga aktividad ng water sports. Ang kagamitan ay tumagal ng 3 season na may regular na pagpapanatili lamang.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Ang diskarte ng kumpletong package ay nangahulugang natanggap namin ang lahat ng kailangan namin sa iisang shipment — mga board at aksesorya na lahat ay may brand at handa nang gamitin ng bisita. Mahal ng aming mga bisita ang kalidad ng kagamitan.'
      icon: tabler:beach
    - title: 'Kontrata ng US Coastal Patrol'
      customer: 'Atlantic Coastal Security Agency'
      country: 'United States'
      industry: 'Maritime Security at Law Enforcement'
      challenge: 'Kailangan ng US coastal security agency ng heavy-duty na patrol SUP para sa operasyon sa bukas na tubig. Nangangailangan ng high-performance na board na may military-spec na kagamitan at pagsunod sa mga regulasyon ng US Coast Guard.'
      solution: 'Ini-engineer ang SUP Patrol na may pinalakas na drop-stitch construction, high-visibility na scheme ng kulay, mount para sa encrypted communication gear, at integrated na punto ng pagkakabit ng kagamitan. Pinalakas ang mga board para sa heavy-duty na operasyon. Nagbigay ng USCG compliance documentation.'
      product: 'SUP Patrol'
      results: 'Nag-ulat ang agency ng 95% mission readiness rate sa unang 12 buwan. Naglagay ng karagdagang order para sa 8 unit.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Binibigyan ng SUP Patrol ang aming mga krew ng performance na kailangan para sa operasyon sa bukas na tubig. Ang pinalakas na konstruksyon ay nagbibigay ng mahalagang tibay nang hindi isinasakripisyo ang paghawak.'
      icon: tabler:shield

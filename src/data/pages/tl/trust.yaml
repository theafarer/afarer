warranty_section:
  title: 'Warranty at Suporta Pagkatapos ng Benta'
  subtitle: 'Naninindigan kami sa bawat produkto na may malinaw na mga tuntunin ng warranty, mabilis na pagproseso ng claim, at orihinal na replacement parts.'
  items:
    - title: '2-Taong Product Warranty'
      desc: 'Lahat ng produkto ng afarer ay may dalawang taong warranty laban sa mga depekto sa pagmamanupaktura — pagkasira ng seam, mga depekto sa valve, at delamination ng materyales sa normal na paggamit.'
    - title: 'Lifetime Parts Support'
      desc: 'Mga orihinal na replacement parts — mga valve, repair kit, fin, D-ring — ay available para sa lahat ng modelo. Pinapanatili namin ang mga mould at tooling nang hindi bababa sa 5 taon pagkatapos ng katapusan ng produksyon.'
    - title: '48-Oras na Tugon sa Claim'
      desc: 'Mga warranty claim ay kinikilala sa loob ng 48 oras. Mga replacement board ay ipinapadala sa loob ng 10 business day para sa mga aprubadong claim.'
    - title: 'Pandaigdigang Repair Network'
      desc: 'Mga awtorisadong repair center sa 15+ bansa. Mga field repair kit para sa malalayong operasyon. Mga DIY repair guide para sa maliliit na sira.'
    - title: 'Suporta para sa OEM Customer'
      desc: 'Mga nakalaang account manager para sa mga B2B partner. Quarterly business review, inventory planning, at co-branded marketing support.'
    - title: 'Certification Package'
      desc: 'Kumpletong compliance documentation na kasama sa bawat padala — CE Declaration, mga test report, material safety data sheet.'
      link: '/contact'


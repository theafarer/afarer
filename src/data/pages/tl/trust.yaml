features3_certifications:
  title: 'Mga Sertipikasyon at Pagsunod sa Pamantayan'
  subtitle: 'Bawat produkto ay independiyenteng sinusubukan at sertipikado ayon sa mga pandaigdigang pamantayan.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'CE Certification'
      description: 'Lahat ng SUP ng afarer ay tumutugon sa European CE safety standard para sa recreational na paggamit. Bawat produkto ay sumasailalim sa pressure, buoyancy, at load testing bago umalis sa pabrika.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'Ang aming 12,000 m² na pasilidad sa Qingdao ay gumagana sa ilalim ng ISO 9001 quality management system. Bawat production batch ay mababakas, naka-dokumento, at sinspeksyunan.'
      icon: 'tabler:clipboard-check'
    - title: 'BSCI Social Compliance'
      description: 'Kami ay BSCI-certified, na nagsisiguro ng etikal na kagawian sa paggawa, ligtas na kondisyon sa trabaho, at responsibilidad sa kapaligiran sa buong aming supply chain.'
      icon: 'tabler:users'
    - title: 'REACH at RoHS'
      description: 'Lahat ng materyales — PVC, EVA foam, mga adhesive — ay sumusunod sa mga regulasyon ng EU REACH at RoHS. Walang ipinagbabawal na sangkap, walang kompromiso.'
      icon: 'tabler:flask'
    - title: 'Material Testing Lab'
      description: 'Ang aming sariling materials lab ay sinusubok ang tensile strength, UV resistance, seam integrity, at abrasion para sa bawat batch ng tela bago ang produksyon.'
      icon: 'tabler:microscope'
    - title: '2-Taong Warranty'
      description: 'Bawat produkto ng afarer ay may kasamang dalawang taong warranty laban sa mga depekto sa pagmamanupaktura. Naninindigan kami sa aming ginagawa.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'Tiwala ng mga Customer'
  title: 'Ano ang sinasabi ng aming mga customer'
  subtitle: 'Mula sa mga first-time paddler hanggang sa mga propesyonal na fleet operator — alamin kung bakit sila nagtitiwala sa afarer.'
  items:
    - content: 'Binentuhan namin ang aming buong rental fleet ng mga SUP ng afarer. Dalawang season na, zero pagkabigo. Ang CE certification ay nagpa-dali sa pag-approve ng insurance.'
      name: 'Marco V.'
      title: 'Tour operator, Croatia'
    - content: 'Bilang first-time buyer, natakot ako tungkol sa kalidad. Ang ISO documentation at mga test report na ibinahagi nila ay nagbigay sa akin ng kumpletong kumpiyansa.'
      name: 'James T.'
      title: 'May-ari ng SUP Explorer 11, Canada'
    - content: 'Nakikipagtulungan kami sa afarer para sa aming mga coastal patrol unit. Ang kanilang QC process ay pare-pareho sa bawat batch — mahalaga ang ganitong maaasahan sa mga mission-critical na operasyon.'
      name: 'Lt. Cmdr. Andres'
      title: 'Government procurement, Pilipinas'

steps2_manufacturing:
  title: 'Paano namin sinisiguro ang kalidad'
  subtitle: 'Mula sa inspeksyon ng hilaw na materyales hanggang sa huling pressure testing — bawat produkto ay dumadaan sa mahigpit na quality chain.'
  items:
    - title: 'Inspeksyon ng Hilaw na Materyales'
      description: 'Bawat roll ng PVC fabric ay sinusubukan para sa kapal, tensile strength, at UV resistance bago pumasok sa produksyon.'
      icon: 'tabler:search'
    - title: 'In-Process QC'
      description: 'Mga weld seam, pagkakabit ng valve, at chamber bond ay sinspeksyunan sa bawat istasyon habang isinasagawa ang assembly.'
      icon: 'tabler:eye'
    - title: 'Pressure Testing'
      description: 'Bawat inflatable na produkto ay pinipresyar hanggang 1.25x ng rated PSI at pinapanatili sa loob ng 24–48 oras upang beripikahin ang paghawak ng hangin at integridad ng seam.'
      icon: 'tabler:wind'
    - title: 'Panghuling Inspeksyon'
      description: 'Bawat unit ay sinspeksyunan para sa finish, hardware, at packaging bago aprubahan para sa pagpapadala. Mga sample ng batch ay ipinapadala sa aming lab para sa destructive testing.'
      icon: 'tabler:clipboard-check'


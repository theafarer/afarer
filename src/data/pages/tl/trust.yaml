faqs_sup:
  title: 'Mga FAQ tungkol sa SUP Board'
  subtitle: 'Mga karaniwang tanong tungkol sa aming mga stand-up paddle board.'
  columns: 2
  items:
    - title: 'Anong mga laki ng SUP board ang inaalok ng afarer?'
      description: 'Nag-aalok kami ng mga SUP board mula 9 ft hanggang 12 ft, sumasaklaw sa lahat mula sa compact all-around board hanggang sa touring at specialty design. Bawat modelo ay available na may maraming opsyon sa configuration.'
    - title: 'Ano ang pagkakaiba ng inflatable SUP at hard SUP?'
      description: 'Ang inflatable SUP ay gumagamit ng drop-stitch construction na may libu-libong internal thread na nagpapahintulot ng mataas na presyon ng hangin, habang ang hard SUP ay gumagamit ng epoxy o fiberglass. Nag-aalok ang mga inflatable SUP ng portability at kaginhawaan sa pag-iimbak nang hindi isinasakripisyo ang rigidity.'
    - title: 'Ano ang weight limit para sa mga SUP board?'
      description: 'Sinusuportahan ng aming mga SUP board ang hanggang 150 kg depende sa modelo at volume. Nakalista sa bawat pahina ng produkto ang maximum load rating para sa iyong partikular na modelo.'
    - title: 'Ba ang mga SUP ng afarer ay CE certified?'
      description: 'Oo. Lahat ng recreational na modelo ng SUP ay CE certified sa ilalim ng mga naaangkop na European standard para sa recreational na paggamit.'
    - title: 'Ano ang warranty sa mga SUP board?'
      description: 'Lahat ng SUP ng afarer ay may kasamang karaniwang isang taong warranty laban sa mga depekto sa pagmamanupaktura, sumasaklaw sa pagkasira ng seam, mga depekto sa valve, at delamination ng materyales sa normal na paggamit.'
    - title: 'Gaano katagal bago mapamaga ang isang SUP board?'
      description: 'Sa paggamit ng kasamang hand pump, ang kumpletong pagpapamaga hanggang 15 PSI ay tumatagal ng humigit-kumulang 8–12 minuto. Para sa mas mabilis na pagpapamaga, inirerekomenda namin ang aming afarer 12V electric pump, na namamaga ng isang board sa mas mababa sa 4 minuto.'

faqs_materials:
  title: 'Mga FAQ tungkol sa Materyales at Pangangalaga ng SUP'
  subtitle: 'Mga karaniwang tanong tungkol sa aming mga materyales ng inflatable SUP, pangangalaga, at pag-iimbak.'
  columns: 2
  items:
    - title: 'Anong mga materyales ang ginagamit sa mga inflatable SUP ng afarer?'
      description: 'Gumagamit kami ng military-grade PVC (1100 denier) na may UV-stabilized at abrasion-resistant na konstruksyon, na sumusunod sa mga regulasyon ng EU REACH at RoHS.'
    - title: 'Gaano katagal tumatagal ang mga inflatable SUP?'
      description: 'Sa tamang pangangalaga, ang isang de-kalidad na PVC inflatable SUP ay tumatagal ng 5–10 taon. Ang regular na paglilinis, proteksyon sa UV, at tamang pag-iimbak ay malaking nagpapahaba ng buhay ng serbisyo.'
    - title: 'Anong maintenance ang kailangan para sa isang inflatable SUP?'
      description: 'Ang pangunahing maintenance ay kinabibilangan ng pagbanlaw gamit ang sariwang tubig pagkatapos ng bawat paggamit (lalo na sa saltwater), pagpapatuyo bago iimbak, pagsusuri ng mga valve seal taun-taon, at pag-iwas sa matagal na pagkakalantad sa araw kapag hindi ginagamit.'
    - title: 'Pwedeng gamitin ba ang mga inflatable SUP sa saltwater?'
      description: 'Oo. Lahat ng inflatable SUP ng afarer ay dinisenyo para sa paggamit sa freshwater at saltwater. Inirerekomenda namin ang pagbanlaw gamit ang sariwang tubig at maayos na pagpapatuyo pagkatapos malantad sa saltwater.'
    - title: 'Paano ko maiimbak ang isang inflatable SUP?'
      description: 'I-deflate, linisin, at patuyuin nang kumpleto ang board bago iimbak. I-roll nang maluwag (iwasan ang masisikip na tiklop), iimbak sa malamig at tuyong lugar na malayo sa direktang sikat ng araw, at huwag ilagay sa sahig ng kongkreto upang maiwasan ang pagsipsip ng kahalumigmigan.'
    - title: 'Ano ang weight capacity ng mga inflatable SUP ng afarer?'
      description: 'Mula 100 kg para sa aming mga pinakamaliit na modelo hanggang higit sa 200 kg para sa mas malalaking board. Nakalista sa bawat pahina ng produkto ang maximum load rating para sa iyong partikular na modelo.'


meta:
  title: 'Kaalaman sa Marine — Engineering sa Bawat Hull | {SITE}'
  description: 'Dekada ng marine engineering sa bawat hull. Kinamumulatan ng afarer ang drop stitch, marine PVC, at propesyonal na disenyo ng inflatable SUP.'
  keywords:
    - 'marine engineering'
    - 'manufacturer ng inflatable SUP'
    - 'pagmamanupaktura ng paddle board'
hero:
  tagline: 'Kaalaman sa Marine'
  title: 'Dekada ng Marine Engineering<br />sa Bawat Hull'
  subtitle: 'Pinagsasama ng afarer ang malalim na material science, precision manufacturing, at pagsubok sa tunay na mundo upang lumikha ng mga watercraft na gumagana kapag mahalaga.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'marine engineering at R&D team ng afarer sa trabaho'
expertise_materials:
  tagline: 'Agham ng Materyales'
  title: 'Pagpili ng Tamang Materyales<br />para sa Bawat Aplikasyon'
  subtitle: 'Nagtatrabaho kami sa dalawang pangunahing materyales — bawat isa ay pinili para sa mga partikular na kaso ng paggamit at kinakailangan sa pagganap.'
  columns: 3
  items:
    - title: 'Marine-Grade PVC'
      description: '1100 denier PVC fabric — ang aming pinakarami-raming gamit na materyales. UV-stabilized, abrasion-resistant, at sumusunod sa REACH. Perpekto para sa mga SUP board kung saan mahalaga ang timbang at kahusayan sa gastos.'
      icon: tabler:droplet
    - title: 'Fibreglass at Polyethylene'
      description: 'Fibreglass-laminated na SUP para sa premium na tigas at glide. Rotomoulded polyethylene para sa mabigat na gamit sa rental at rescue na nangangailangan ng pinakamataas na paglaban sa impact.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Mga Kakayahan sa Pagmamanupaktura'
  title: 'Precision Manufacturing<br />sa Bawat Hakbang'
  subtitle: 'Ang aming 12,000 m² na pasilidad ay may espesyalisadong makinarya para sa bawat yugto ng produksyon.'
  columns: 2
  items:
    - title: 'CNC Cutting'
      description: 'Ang computer-controlled na paggupit ay nagsisiguro ng tumpak at nasusulit na mga panel ng tela na may kaunting basura. Bawat piraso ay eksaktong akma sa disenyo.'
      icon: tabler:cpu
    - title: 'High-Frequency Welding'
      description: 'Ang industrial HF welding ay lumilikha ng seam na mas malakas kaysa base material. Pare-parehong kontrol sa temperatura at presyon ang nagsisiguro ng air-tight na selyo sa bawat production run.'
      icon: tabler:bolt
    - title: 'Assembly ng Drop Stitch Core'
      description: 'Libu-libong polyester thread ang nagdudugtong sa itaas at ilalim na layer ng tela, na nagpapahintulot ng mataas na presyon ng inflation (15-20 PSI) para sa rigid at stable na SUP board.'
      icon: tabler:building-arch
    - title: 'Pressure Testing'
      description: 'Bawat inflatable na produkto ay pressure-tested bago ipadala. Ang mga board ay sinusubukan sa 1.25x na rated na presyon — kung hahawak ito diyan, gaganap ito sa tubig.'
      icon: tabler:wind
    - title: 'Pagsusuri ng Lakas ng Seam'
      description: 'Mga random na sample mula sa bawat production batch ay sumasailalim sa destructive na pagsusuri ng lakas ng seam. Ang mga resulta ay naka-log at mababakas sa mga partikular na production run.'
      icon: tabler:files
    - title: 'Pagsusuri sa Tubig'
      description: 'Bawat modelo ay sumasailalim sa sea trial bago sertipikahin. Ang pagsubok sa tunay na mundo sa coastal na kondisyon ay nagbibigay-katibayan ng pagganap, pag-handle, at stability.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Disenyo at Engineering'
  title: 'Ini-engineer para sa Tunay na Kondisyon'
  subtitle: 'Nagsisimula ang aming pilosopiya sa disenyo sa kung paano gagamitin ang board — pagkatapos ay itinatayo ang engineering sa paligid ng kaso ng paggamit na iyon.'
  items:
    - title: 'Disenyo ng Performance Hull'
      description: 'Bawat hugis ng hull ay inakma para sa kaso ng paggamit nito — displacement nose para sa glide ng touring, karagdagang rocker para sa dali ng surf, patag at stable na profile para sa pangingisda at yoga.'
    - title: 'Kaligtasan ng Drop-Stitch'
      description: 'Bawat board ay may rigid na drop-stitch core na may reinforced na rail. Kapag nasira ang isang bahagi, ang high-tensile na istrukturang drop-stitch ay pinapanatiling gumagana ang board.'
    - title: 'Ergonomic na Deck Layout'
      description: "Ang zoning ng deck pad, posisyon ng carry handle, at mounting point ay dinisenyo sa paligid ng kaginhawahan ng rider sa mahabang paggamit — manapa't nag-totouring, nangangisda, o nagpa-patrol."
    - title: 'Custom na Configuration'
      description: 'Kulay ng rail, configuration ng deck pad, accessory mount, kapasidad ng gamit — bawat modelo ay maaaring i-customize upang tumugma sa mga partikular na kinakailangan ng operasyon.'
cta:
  title: 'May partikular na aplikasyon sa isip?'
  subtitle: 'Maaaring magpayo ang aming engineering team tungkol sa pagpili ng materyales, disenyo, at pagmamanupaktura para sa iyong proyekto.'

seo:
  headline: 'Mga Inflatable SUP para sa Turismo at Rekasyon — OEM Manufacturing ng afarer'
  description: 'Idinisenyo at ginagawa ng afarer ang mga premium na inflatable SUP para sa turismo at rekasyon: touring board, fishing board, at yoga board. OEM/ODM manufacturing na may CE certification. MOQ mula 50 unit.'

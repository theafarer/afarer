workshops:
  - title: 'Produksyon ng SUP Board'
    description: '4 na magkakasabay na assembly line para sa mga inflatable SUP board. Ang bawat linya ay kayang gumawa ng 50–80 board kada shift. Sabay na gumagana ang mga estasyon ng digital printing at screen printing. Taunang kapasidad ng SUP: 10,000+ board.'
    output: '10,000+ SUP/taon'
  - title: 'Mga Linya ng SUP Board'
    description: 'Maraming gamit na production line para sa mga inflatable SUP board. Ang mga estasyon ng hot-air welding, RF dielectric press, at assembly workstation ay muling inaayos ayon sa kombinasyon ng order. Taunang kapasidad: 5,000+ unit.'
    output: '5,000+ unit/taon'
  - title: 'Kagamitang Pangkaligtasan'
    description: 'Hiwalay na clean-room na lugar ng produksyon para sa mga life vest at kagamitang pangkaligtasan. Nakalaang estasyon ng pananahi, paglalagay ng foam, at pagsubok. Taunang kapasidad ng life vest: 50,000+ unit.'
    output: '50,000+ life vest/taon'


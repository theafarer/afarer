intro: 'Nagpapatakbo ang afarer ng isa sa mga pinakamalaking nakalaang pasilidad sa paggawa ng inflatable SUP sa Qingdao, Tsina. Ang aming pabrika na 12,000 m² ay inayos sa anim na espesyalisadong workshop na gumagana nang magkakasabay, na nagbibigay sa amin ng kakayahang gumawa ng mahigit 15,000 SUP board taun-taon sa mga linya ng SUP board at kagamitang pangkaligtasan.'


meta:
  title: 'OEM at Paggawa ng Private Label | {SITE}'
  description: 'Mula konsepto hanggang container: i-customize ang bawat detalye ng iyong linya ng inflatable SUP. Kumpletong serbisyong OEM/ODM para sa mga brand ng private label na paddle board.'
  keywords:
    - 'oem sup manufacturing'
    - 'private label na paddle board'
    - 'oem inflatable sup'
    - 'custom sup factory'
hero:
  tagline: 'Paggawa ng OEM/ODM'
  title: 'OEM at Paggawa ng Private Label'
  subtitle: 'Mula konsepto hanggang container — i-customize ang bawat detalye ng iyong linya ng inflatable SUP'

intro: 'Nag-aalok ang afarer ng komprehensibong serbisyo sa OEM at ODM para sa mga brand, distributor, at ahensya ng gobyerno sa buong mundo. Sa 10+ taon ng karanasan sa pag-e-export at pabrikang 12,000 m² na sertipikado sa ISO 9001 at BSCI, pangangasiwaan namin ang lahat mula sa disenyo ng produkto at pag-develop ng mold hanggang sa full-scale na produksyon, packaging, at lohestika.'

highlight:
  - value: '10+'
    label: 'Taon ng karanasan sa OEM'
    detail: 'Mula pa noong 2012'
  - value: '50+'
    label: 'Mga bansang pinag-e-exportan'
    detail: 'Saklaw sa buong mundo'
  - value: '200+'
    label: 'Mga custom na proyektong naihatid'
    detail: 'Sa lahat ng linya ng produkto'
  - value: '30–45'
    label: 'Karaniwang lead time (araw)'
    detail: 'Mula PO hanggang FOB'

services:
  - title: 'Disenyo ng Produkto at Engineering'
    description: 'Ang aming in-house na R&D team ay gumagawa kasama ng iyong konsepto o spec upang bumuo ng CAD drawing, 3D model, at prototype. Nag-aalok kami ng mold design, optimisasyon ng hugis ng hull, at gabay sa pagpili ng materyal.'
  - title: 'Custom Branding at Graphics'
    description: 'Buong-kulay na digital printing, screen printing, embossing, at mga opsyon sa label. Bumuo kami ng deck graphics na tiyak sa brand, branding ng tube, at packaging na handa na sa retail.'
  - title: 'Customization ng Materyal at Espesipikasyon'
    description: 'Pumili mula sa PVC (karaniwan, eco-friendly, fire-retardant), drop-stitch, at hybrid na konstruksyon. Mga custom na kulay ng tube, timbang ng fabric, at opsyon sa pampalakas.'
  - title: 'Packaging at Lohestika'
    description: 'Custom na retail packaging, private-label na kahon, vacuum packing, pagpapalagay sa pallet, at pagkarga sa container. Available ang mga tuntunin sa pagpapadala na FOB Qingdao, CIF, o DDP.'

moq_table:
  - product: 'Mga Inflatable SUP Board'
    standard_moq: '5–10 unit'
    custom_moq: '200+ unit'
    lead_time: '30–45 araw'
  - product: 'Mga Life Vest at Kagamitang Pangkaligtasan'
    standard_moq: '100–200 unit'
    custom_moq: '1,000+ unit'
    lead_time: '20–30 araw'

why_us:
  - title: 'Patayong Integrasyon'
    description: 'Amin ang aming pabrika, mold, at supply chain — walang middleman, walang subcontractor. Nagbibigay ito sa amin ng kontrol sa kalidad, gastos, at paghahatid.'
  - title: 'Dobleng Sertipikasyon'
    description: 'Quality management na ISO 9001 at sertipikasyon sa pagsunod sa panlipunan na BSCI. Available ang mga ulat ng factory audit kapag hiniling.'
  - title: 'Pagsunod sa CE'
    description: 'Ang lahat ng karaniwang model ay may sertipikasyon na CE 2013/53/EU. Ang mga custom na model ay maaaring ma-certify sa CE sa pamamagitan ng aming nakakahandang proseso.'
  - title: 'Mababang MOQ'
    description: 'Magsimula sa kaunti bilang 5 unit para sa mga karaniwang model. Tinutulungan namin ang mga umuusbong na brand na maglunsad nang hindi labis na nagpapalaki ng imbentaryo.'

meta:
  title: 'Ang Aming Team — Mga Marine Engineer at Tagabuo | {SITE}'
  description: 'Itinatag noong 2012 sa Qingdao, ang afarer ay binuo ng mga marine engineer, materials scientist, at mahihilig sa water sports. Makilala ang team sa likod ng pabrika.'
  keywords:
    - 'afarer team'
    - 'marine engineers'
    - 'manufacturer ng inflatable sup'
    - 'sup factory team'
hero:
  tagline: 'Ang Aming Team'
  title: 'Ang mga Tao sa Likod ng afarer<br />— Engineering ng Kalayaan sa Tubig'
  subtitle: 'Itinatag noong 2012 sa Qingdao, Tsina, ang afarer ay binuo ng mga marine engineer, materials scientist, at mahihilig sa water sports na naniniwala na gawing abot-kaya ng mga propesyonal na antas na inflatable watercraft sa buong mundo.'
  image:
    src: /images/team-all.webp
    alt: 'kumpletong litrato ng team ng afarer — engineering, produksyon, at pamunuan'
founding:
  tagline: 'Ang Aming Pagkatatag'
  title: 'Mula sa Coastal Workshop<br />hanggang sa Pasilidad na 12,000 m²'
  subtitle: 'Itinatag ang afarer ng isang team ng mga marine engineer na may dekadang pinagsamang karanasan sa disenyo ng inflatable SUP, pagbuo ng PVC, at paggawa ng kagamitang pandagat sa buong mundo.'
  items:
    - title: 'Itinatag: 2012'
      description: 'Itinatag sa Qingdao, Tsina — isang pangunahing sentro sa martimo na may malalim na mana ng paggawa ng barko.'
      icon: tabler:calendar
    - title: '200+ Empleyado'
      description: 'Kabilang ang 50+ R&D engineer, espesyalista sa quality control, at technician ng produksyon.'
      icon: tabler:users
    - title: 'Pasilidad na 12,000 m²'
      description: 'Nakalaang planta ng paggawa na may 6 na production line para sa mga inflatable SUP board.'
      icon: tabler:building-factory
    - title: '50+ Bansang Pinaglilingkuran'
      description: 'Nag-e-export sa Europe, Amerika, Middle East, Asia-Pacific, at Africa.'
      icon: tabler:globe

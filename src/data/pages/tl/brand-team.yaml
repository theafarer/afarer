      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: 'Pilosopiya sa Disenyo'
  title: 'Disenyong Hinihimok ng Engineering<br />— Bawat Detalye ay Mahalaga'
  subtitle: 'Ang aming pilosopiya sa engineering ay nakatuon sa tatlong prinsipyo na gumagabay sa bawat produktong aming ginagawa.'
  list:
    - 'Maasahan Muna: Ang bawat produkto ng afarer ay sinusubok na makayanan ang tunay na kundisyon — mula sa operasyon ng pagliligtas sa malamig na tubig hanggang sa rental ng tropical resort. Labis naming ini-engineer kung saan ito pinakamahalaga.'
    - 'Kawastuhan sa Paggawa: Ang aming mga pasilidad ay gumagamit ng CNC cutting, high-frequency welding, at automated pressure testing. Ang bawat seam, bawat valve, bawat fitting ay tumutugon sa naka-dokumentong espesipikasyon.'
    - 'Tuloy-tuloy na Inobasyon: Ang aming R&D team ay tuloy-tuloy na nagtataya ng mga bagong materyal, paraan ng produksyon, at pagpapabuti sa disenyo. Hindi kami naghihintay ng problema — inaanticipate namin ang mga ito.'
cta:
  title: 'Nais bang talakayin ang isang proyekto sa aming team?'
  subtitle: 'Handa na ang aming mga engineer na magpayo tungkol sa pagpili ng produkto, customization, at mga koleksyong co-branded.'
  actions:
    - variant: primary
      text: 'Makipag-ugnayan sa aming team'
      href: /contact/
    - text: 'Tingnan ang aming mga produkto'
      href: /products/

      revenue: 'XX,XXX USD/taon'
    - label: 'Katamtamang Operasyon'
      boards: '30-50'
      revenue: 'XX,XXX USD/taon'
    - label: 'Malaking Rental sa Beach'
      boards: '50-100'
      revenue: 'XXX,XXX USD/taon'


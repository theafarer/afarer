      amount: '< 5 min'
    - title: 'Taunang Pagpapanatili'
      amount: '~15 min/board'
    - title: 'Pagpapadala ng Piyesa'
      amount: '48h'
    - title: 'Rate ng Depekto'
      amount: '< 0.5%'

fleet_guide:
  title: 'Gabay sa Laki ng Fleet'
  subtitle: 'Tantyahin ang laki ng fleet at potensyal na kita para sa iyong operasyon ng rental.'
  tiers:

body: |
  <h2>Ano ang Inflatable SUP?</h2>
  <p>Ang inflatable SUP (Stand-Up Paddle Board) ay isang dadalahing watercraft na gawa sa drop-stitch na materyal na PVC na nagiging matigas kapag ini-inflate sa mataas na presyon (12-15 PSI). Di tulad ng mga tradisyonal na hard board na gawa sa foam at fiberglass, ang inflatable SUP ay maaaring bawasan ng hangin, gulingin, at imbakin sa isang lalagyan na laki lang ng backpack.</p>
  <p>Bagama't inflatable, ang mga modernong SUP ay katumbas ng tigas at performance ng mga hard board para sa karamihan ng aplikasyong pang-rekasyon at touring. Ang pangunahing inobasyon ay ang <strong>konstruksyong drop-stitch</strong>: libu-libong polyester thread ang nagdudugtong sa itaas at ibabang patong ng fabric, na pumipigil sa board na lumaki nang parang balon kapag pinresyurisa.</p>

  <h2>Paano Ito Gumagana: Teknolohiyang Drop-Stitch</h2>
  <p>Ang core ng bawat inflatable SUP ay ang drop-stitch fabric. Sa paggawa, libu-libong thread ay hinabi sa pagitan ng dalawang patong ng PVC-coated na fabric. Kapag na-inflate ang board:</p>
  <ul>
    <li>Hinihila ng mga thread ang itaas at ibabang panel sa nakapirmeng layo mula sa isa't isa</li>
    <li>Lumilikha ito ng matigas at patag na plataporma na lumalaban sa pagyuko at pag-flex</li>
    <li>Sa 12-15 PSI, nakakamit ng board ang tigas na katumbas ng mga board na may EPS foam core</li>
  </ul>

  <h2>Mga Pangunahing Bahagi</h2>
  <ul>
    <li><strong>PVC Drop-Stitch Core</strong> — Ang pangunahing istruktural na patong na nagbibigay ng tigas</li>
    <li><strong>Mga Rail Band</strong> — Pinalakas na mga gilid na sumasanggalang sa pagkiskis at impact</li>
    <li><strong>EVA Foam Deck Pad</strong> — Hindi madulas na ibabaw para sa komportableng pagtayo at traction</li>
    <li><strong>Fin System</strong> — Maaaring tanggalin na fin para sa direksyonal na katatagan (karaniwang konfigurasyong 2+1)</li>
    <li><strong>Valve</strong> — High-pressure na one-way valve para sa inflation at deflation</li>
  </ul>

  <h2>Mga Karaniwang Layunin ng Paggamit</h2>
  <ul>
    <li><strong>Pagpapaddle sa Tahimik na Tubig</strong> — Mga lawa, kalmadong bay, at mabagal na ilog</li>
    <li><strong>Touring</strong> — Malayong pagpapaddle sa bukas na tubig na nangangailangan ng kahusayan sa glide</li>
    <li><strong>Surfing</strong> — Maliit hanggang katamtamang alon (baguhan hanggang katamtaman)</li>
    <li><strong>Pangingisda</strong> — Tahimik na pagpasok sa mababaw na tubig para sa mga mangingisda</li>
    <li><strong>Fitness</strong> — SUP yoga, pilates, at pagsasanay ng core sa tubig</li>
    <li><strong>Paglalakbay</strong> — Dadalahing disenyo na perpekto para sa eroplano at road trip</li>
  </ul>

  <h2>Inflatable kumpara sa Hard SUP: Mga Pangunahing Pagkakaiba</h2>
  <table>
    <tr><th>Aspeto</th><th>Inflatable SUP</th><th>Hard SUP (EPS/Fiberglass)</th></tr>
    <tr><td>Dadalhin</td><td>Kasya sa backpack</td><td>Nangangailangan ng roof rack o malaking sasakyan</td></tr>
    <tr><td>Tibay</td><td>Lumalaban sa impact, walang ding</td><td>Maaaring bumagsak, magka-dent, o mag-delaminate</td></tr>
    <tr><td>Imbakan</td><td>Kasya sa cabinet o trunk ng kotse</td><td>Nangangailangan ng nakalaang espasyo ng imbakan</td></tr>
    <tr><td>Performance</td><td>Mahusay para sa rekasyon at touring</td><td>Nakahigit para sa karera at advanced na surfing</td></tr>
    <tr><td>Kagandahang-loob sa baguhan</td><td>Malambot na deck, mas maliit na panganib ng pinsala</td><td>Matigas na ibabaw, hindi gaanong mapagpatawad</td></tr>
    <tr><td>Oras ng pag-setup</td><td>3-5 minuto na inflation</td><td>Handa nang gamitin</td></tr>
  </table>

  <h2>Paano Pumili ng Tamang SUP</h2>
  <p>Kapag pumipili ng inflatable SUP, isaalang-alang ang mga salik na ito:</p>
  <ul>
    <li><strong>Volume (litro)</strong> — Nagtatakda ng buoyancy. Ang mas mataas na volume ay sumusuporta sa mas mabigat na timbang at nagbibigay ng katatagan.</li>
    <li><strong>Haba</strong> — Ang mas mahabang board (11-14 ft) ay mas mahusay mag-track para sa touring; ang mas maikling board (9-10 ft) ay mas madaling maniobrahin para sa surfing.</li>
    <li><strong>Lapad</strong> — Ang mas malapad na board (32-36 in) ay mas matatag; ang mas makitid na board (28-31 in) ay mas mabilis.</li>
    <li><strong>Kapal</strong> — Ang 6-inch na board ay may pinakamainam na tigas; ang 4.7-inch na board ay mas magaan at mas madaling dalhin.</li>
    <li><strong>Kalidad ng Konstruksyon</strong> — Hanapin ang fusion-laminated o woven drop-stitch para sa tibay.</li>
  </ul>

  <h2>Mga Madalas Itanong</h2>
  <h3>Kasingtigas ba ng hard board ang inflatable SUP?</h3>
  <p>Sa tamang inflation (12-15 PSI), ang mga modernong drop-stitch SUP ay nakakamit ng katumbas na tigas para sa pagpapaddle na pang-rekasyon. Ang mga hard board ay nananatiling nakalamang para sa karera at advanced na surfing dahil sa mas magaan nitong timbang at mas pinong katangian ng flex.</p>

  <h3>Gaano katagal bago ito ma-inflate?</h3>
  <p>Gamit ang dual-action pump, karamihan ng board ay nakakaabot sa 12-15 PSI sa loob ng 3-5 minuto. Available ang mga electric pump at binabawasan ang oras ng inflation sa humigit-kumulang 2 minuto.</p>

  <h3>Maaari ko bang dalhin ang inflatable SUP sa eroplano?</h3>
  <p>Oo. Kapag binawasan ng hangin at gulung-gulung, karamihan ng SUP ay kasya sa isang backpack na tumutugon sa mga kinakailangan sa checked baggage ng airline. Laging i-check ang iyong airline para sa mga hangganan ng laki at timbang.</p>

  <h3>Gaano katibay ang mga inflatable SUP?</h3>
  <p>Ang mga inflatable SUP ay napakatibay. Ang konstruksyong military-grade PVC ay lumalaban sa impact, butas, at pinsala ng UV. Ang maliliit na butas ay maaaring ayusin sa field gamit ang kasamang repair kit.</p>

  <h3>Anong pagpapanatili ang kailangan?</h3>
  <p>Banlawan ng tubig-tabang pagkatapos gamitin sa tubig-alat. Iimbak sa malamig at tuyo lugar na hindi direktang tinatamaan ng sikat ng araw. Bahagyang i-inflate habang mahabang nakaimbak upang mapanatili ang hugis nang hindi pinipiga ang mga seam.</p>

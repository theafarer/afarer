meta:
  title: 'Mga Gabay sa SUP — Bumili, Pumili, magsanay | {SITE}'
  description: 'Mga gabay sa SUP ng afarer: kung paano bumili, pumili, at magsanay ng paddle boarding. Pagsusukat, materyales, at mga tip ng eksperto para sa mga baguhan at propesyonal sa inflatable SUP.'
  keywords:
    - 'gabay sa pagbili ng sup'
    - 'paano pumili ng sup'
    - 'gabay sa pagsukat ng sup'
    - 'mga tip sa inflatable paddle board'
hero:
  tagline: 'Mga Gabay'
  title: 'Bago sa SUP?'
  subtitle: 'Praktikal na mga gabay upang matulungan kang pumili, gumamit, at tamasahin ang mga inflatable SUP board.'

size_guide:
  tagline: 'Laki at Specs'
  title: 'Hanapin ang Tamang Laki para sa Iyong mga Pangangailangan'
  desc: "Ihambing ang mga dimensyon ng SUP board, kapasidad ng timbang, at inirerekomendang paggamit. Manapa't kailangan mo ng touring SUP, yoga board, o all-around SUP — tutulungan ka ng aming gabay sa laki na pumili ng tamang akma."
  link_label: 'Buong gabay sa laki na may specs ng produkto →'
  link: /size-guide
  cards:
    - title: 'Mga SUP Board'
      desc: 'Pumili ng haba batay sa iyong timbang at inaasahang paggamit. Ang mas malawak na board (32"+) ay nag-aalok ng mas maraming stability. Ang mas mahabang board (11–12 ft) ay mas mahusay mag-track para sa touring.'
    - title: 'Mga Touring SUP'
      desc: 'Mas mahabang board (11–12 ft) para sa paglalakbay ng malayo at tuwid na tracking. Sapat na stable para sa touring na may gamit. Laging tingnan ang kapasidad ng timbang.'
    - title: 'Mga All-Around SUP'
      desc: 'Pumili ng haba ayon sa timbang ng rider at paggamit. Mas malawak na board (32"+) para sa stability. Magkakaiba ang gamit para sa recreation at fitness.'

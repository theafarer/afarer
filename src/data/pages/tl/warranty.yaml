label: 'Warranty'
headline: 'Limited Warranty ng Manufacturer na afarer'
subtitle: 'Naninindigan ang afarer sa kalidad ng bawat inflatable marine na produkto na aming ginagawa. Itinatakda ng Limited Warranty na ito ang mga tuntunin at saklaw para sa iyong produkto ng afarer.'
seo:
  headline: 'Warranty ng Inflatable SUP ng afarer — 5-Taong Limited Warranty | afarer'
  description: 'Nag-aalok ang afarer ng 5-taong limited warranty sa structural integrity ng pangunahing deck fabric, seam, at drop-stitch core. Saklaw din ang mga inflation valve at factory-installed na accessory. Kumpletong mga tuntunin para sa warranty ng inflatable SUP ng afarer.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Ang Limited Warranty na ito ay naaangkop sa mga bagong inflatable marine na produkto na may brand na afarer na binili nang direkta mula sa afarer o mula sa isang awtorisadong dealer o retailer ng afarer. Ang epektibong petsa ay ang mabeberipikang petsa ng orihinal na retail purchase.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Saklaw at Tagal ng Warranty</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Integridad ng pangunahing tube fabric (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Structural integrity ng fiberglass hull</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Kakayahan ng seam ng inflatable tube na humawak ng hangin</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Pagganap ng inflation valve</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Mga factory-installed na accessory at auxiliary fitting</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Taon*</h3>
        <p class="text-sm text-gray-600 mt-1">Komersyal, rental, o fleet na paggamit — lahat ng component</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Ang komersyal, pampamahalaan, charter, rental, o instructional na paggamit ay nagpapababa ng warranty sa 1 taon. Ang paggamit sa racing o kumpetisyon ay ganap na nagpapawalang-bisa sa warranty.</p>
  </div>

  <h2>Ano ang Saklaw</h2>
  <h3>Pangunahing Tube Fabric (5 Taon)</h3>
  <p>Ginagarantiyahan ng afarer ang pangunahing deck fabric laban sa pagkasira ng porosity na malubhang nakaaapekto sa kakayahan ng produkto na mapanatili ang operational na inflation. Naaangkop ito sa PVC coated fabric at lahat ng iba pang materyales ng deck fabric na ginamit sa pagmamanupaktura.</p>

  <h3>Structural Integrity ng Fiberglass Hull (5 Taon)</h3>
  <p>Para sa mga produktong may fiberglass-reinforced plastic (FRP) hull, ang pangunahing composite structure ay ginagarantiyahan laban sa structural failure dahil sa mga depekto sa materyales o pagkakagawa.</p>

  <h3>Kakayahan ng Seam ng Inflatable Tube na Humin ng Hangin (5 Taon)</h3>
  <p>Ang mga seam ng inflatable tube, kung saan pinagsama sa pagmamanupaktura, ay ginagarantiyahan laban sa mga depekto sa pagmamanupaktura na nagreresulta sa malubhang pagtagas ng hangin sa seam. Ang periodic inspection at pagpapanatili ng angkop na presyon ng inflation ay mga kondisyon ng saklaw.</p>

  <h3>Pagganap ng Inflation Valve (5 Taon)</h3>
  <p>Ang mga air inflation valve na orihinal na inilagay ng afarer ay ginagarantiyahan laban sa mga depekto sa materyales o pagkakagawa na pumipigil sa valve na humawak ng hangin ayon sa disenyo.</p>

  <h3>Mga Factory-Installed na Accessory (1 Taon)</h3>
  <p>Ang mga component at fitting na ginawa ng afarer at orihinal na inilagay sa pabrika ay ginagarantiyahan laban sa mga depekto sa materyales at pagkakagawa sa loob ng isang taon. Hindi kasama rito ang mga third-party item, na saklaw lamang ng kani-kanilang warranty ng manufacturer.</p>

  <h2>Ano ang Hindi Saklaw</h2>
  <ul>
    <li>Mga cosmetic na depekto kabilang ang pagkayumelo, mantsa, pagkaputla, pag-chalk, o anumang pagbabago sa itsura</li>
    <li>Mga butas, hiwa, pilas, punit, o iba pang pisikal na pinsala</li>
    <li>Pag-craze, pag-crack, abrasion, pagkaskas, o pagkasira dahil sa friction o pagdikit</li>
    <li>Pagkasira dahil sa pagkakalantad sa UV light, weathering, o atmospheric na kondisyon</li>
    <li>Pinsala mula sa pagdikit sa fuel, solvent, acid, alkali, o kemikal</li>
    <li>Pinsala dahil sa pagwalang-bahala, maling paggamit, pang-aabuso, aksidente, o karaniwang pagkasira</li>
    <li>Mga isyu sa ibabaw ng gelcoat o pintura (pagbubula, pag-craze, pagkayumelo, pagkaputla)</li>
    <li>Pinsala mula sa impact, stress, maling suporta, o trailering</li>
    <li>Pinsala mula sa maling inflation/deflation o paggamit ng hindi aprubadong inflation device</li>
    <li>Mga third-party na kagamitan, component, o system (saklaw ng kani-kanilang manufacturer)</li>
  </ul>

  <h2>Obligasyon at Remedyo ng Manufacturer</h2>
  <p>Ang tanging at eksklusibong obligasyon ng afarer ay ang pagkukumpuni o pagpapalit, ayon sa pagpipilian ng afarer, ng anumang component na natukuyang may depekto sa materyales o pagkakagawa at saklaw ng warranty na ito. Ang mga pagkukumpuni o pagpapalit ay isinasagawa ng afarer o ng tinukoy nitong awtorisadong service facility. Ang mga component na kinumpuni o pinalitan ay ginagarantiyahan lamang para sa hindi pa nagagamit na bahagi ng orihinal na panahon ng warranty.</p>

  <h2>Mga Kundisyon ng Warranty</h2>
  <ul>
    <li><strong>Registration:</strong> Dapat maayos na irehistro ang produkto ayon sa itinatakda sa mga tuntunin ng warranty.</li>
    <li><strong>Maintenance:</strong> Dapat mapanatili ang produkto ayon sa mga inilathalang gabay ng afarer, kabilang ang periodic inspection at pagpapanatili ng angkop na presyon ng inflation.</li>
    <li><strong>Pakikipagtulungan:</strong> Dapat buo at agarang makipagtulungan ang mamimili sa afarer sa lahat ng bagay tungkol sa mga warranty claim.</li>
    <li><strong>Orihinal na Mamimili:</strong> Ipinapamahagi ang warranty na ito nang eksklusibo sa orihinal na end-user na mamimili at hindi maaaring ilipat.</li>
  </ul>

  <h2>Komersyal na Paggamit</h2>
  <p>Kung ang produkto ay ginagamit para sa komersyal, pampamahalaan, non-profit, charter, rental, instructional, o anumang layunin maliban sa pribadong recreational na paggamit, ang panahon ng warranty para sa lahat ng component ay bababa sa isa (1) taon mula sa orihinal na petsa ng retail purchase. Ang paggamit sa racing, speed o endurance competition ay agarang at hindi na mababawing nagpapawalang-bisa sa warranty nang ganap.</p>

  <h2>Paano Mag-file ng Warranty Claim</h2>
  <p>Makipag-ugnayan sa afarer o sa iyong awtorisadong dealer na may patunay ng pagbili at detalyadong paglalarawan ng problema. Susuriin ng afarer ang claim at magbibigay ng mga tagubilin para sa inspeksyon at serbisyo.</p>
  <p>Para sa mga tanong tungkol sa warranty service, mangyaring makipag-ugnayan sa amin sa pamamagitan ng aming <a href="/contact/" class="text-sky-600 underline">pahina ng pakikipag-ugnayan</a> na may iyong order number at mga detalye ng produkto.</p>

  <h2>Mga Third-Party Item</h2>
  <p>Ang mga kagamitan, component, o system na ginawa ng third party (kahit inilagay ng afarer) ay saklaw lamang ng anumang warranty na inaalok ng kani-kanilang manufacturer. Tahasang itinatanggi ng afarer ang anumang responsibilidad sa warranty para sa mga third-party item na iyon.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Ang pahayag ng warranty na ito ay buod ng kumpletong afarer Manufacturer Limited Warranty. Ang kumpletong legal na dokumento ng warranty ang namamahala sa lahat ng tuntunin at kondisyon ng warranty. Ang mga espesipikasyon ay maaaring magbago nang walang paunawa. Ang afarer ay isang brand na pinapatakbo ng Aquafarer LLC (USA).
  </p>

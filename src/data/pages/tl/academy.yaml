cta:
  title: 'Hindi sigurado kung saan magsisimula?'
  desc: 'Kunin ang aming pagsusulit sa pagtataya ng kasanayan upang matuklasan ang tamang mga gabay at kagamitan para sa iyong antas.'
  label: 'Makipag-ugnayan sa amin →'
  link: /contact

meta:
  title: 'Akademiya — Mga Gabay sa SUP at Pagsasanay sa Pagpapaddle | {SITE}'
  description: 'afarer Academy: mga gabay sa inflatable paddle board, mga teknik ng stand up paddle, kaligtasan sa dagat, at kaalaman sa materyales para sa mga baguhan at propesyonal.'
  keywords:
    - 'learn stand up paddle'
    - 'sup beginner guide'
    - 'paddle board basics'
    - 'sup technique'
    - 'sup lessons'
hero:
  tagline: 'afarer Academy'
  title: 'Sentro ng Pag-aaral'
  subtitle: 'Mga gabay at tutorial para sa bawat antas ng kasanayan — mula sa mga pangunahing kaalaman sa SUP hanggang sa mga advanced na teknik ng pagliligtas'

categories:
  - level: 'Baguhan'
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: 'Mga Pangunahing Kaalaman sa SUP'
        desc: 'Matuto ng mga batayang kaalaman sa stand-up paddleboarding — tindig, teknik ng stroke, at balanse.'
        slug: beginner-sup-guide
      - title: 'Mga Teknik sa Pagpapaddle'
        desc: 'Forward stroke, sweep stroke, draw stroke, at low brace — makabisado ang mahahalagang kilos sa pagpapaddle.'
        slug: sup-paddle-guide
      - title: 'Kaligtasan ang Una'
        desc: 'Mahahalagang kagawian sa kaligtasan kabilang ang pagsusuri sa panahon, paggamit ng PFD, mga alituntunin sa leash, at self-rescue.'
        slug: sup-safety-guide
  - level: 'Katamtaman'
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: 'Mga Pangunahing Kaalaman sa Touring'
        desc: 'Pagpaplano ng maraming oras na pagpapaddle — nabigasyon, pag-inom ng tubig, pagtupad sa ritmo, at pagbasa ng weather forecast.'
        slug: touring-sup-guide
      - title: 'Pagbasa ng Panahon'
        desc: 'Ipaliwanag ang mga marine forecast, kilalanin ang mga padron ng ulap, at unawain ang epekto ng hangin sa tubig.'
        slug: weather-planning-water-sports
      - title: 'Mga Pangunahing Kaalaman sa Nabigasyon'
        desc: 'Pagbasa ng chart, paggamit ng compass, GPS waypoints, at pagpaplano ng ruta para sa coastal paddling.'
        slug: sup-navigation-guide
      - title: 'Kamalayan sa Daluyong'
        desc: 'Pag-unawa sa mga siklo ng daluyong, agos, at kung paano ito nakaaapekto sa timing ng paglulunsad at pagpaplano ng ruta.'
        slug: understanding-tides
  - level: 'Advanced'
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: 'Pagpaplano ng Multi-Day na Paglalakbay'
        desc: 'Logistik ng ekspedisyon — pagpili ng kagamitan, pagpaplano ng pagkain, mga protocol sa kaligtasan, at mga emergency contact.'
        slug: sup-travel-guide
      - title: 'Mga Teknik sa Pagliligtas'
        desc: 'Self-rescue, T-rescue, at mga protocol ng paghila para sa bukas na tubig.'
        slug: sup-self-rescue
      - title: 'Pagpapaddle sa Gabi'
        desc: 'Nabigasyon pagkatapos ng dilim — mga kinakailangan sa ilaw, memorya ng ruta, komunikasyon ng grupo, at kamalayan sa panganib.'
        slug: ocean-safety-basics
  - level: 'Pagpapanatili'
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: 'Paghuhugas at Pangangalaga'
        desc: 'Pagbanlaw sa tubig-tabang, proteksyon sa UV, pag-iwas sa amag, at tamang pagpapatuyo pagkatapos ng bawat sesyon.'
        slug: inflatable-sup-maintenance
      - title: 'Gabay sa Pag-iimbak'
        desc: 'Mga pinakamahuhusay na kagawian sa pag-iimbak ng mga inflatable SUP board — deflation, pagtiklop, kontrol sa temperatura, at buhay sa istante.'
        slug: inflatable-sup-storage
      - title: 'Mga Pangunahing Kaalaman sa Pagkukumpuni'
        desc: 'Ayusin ang maliliit na butas, tagas sa seam, at mga problema sa valve gamit ang mga PVC repair kit at teknik ng patch.'
        slug: inflatable-sup-repair
      - title: 'Pagpapanatili ng Valve'
        desc: 'Kilalanin ang mga uri ng valve (Halkey-Roberts, Boston, Leafield), linisin ang dumi, at palitan ang sira na stem.'
        slug: sup-pump-guide

knowledge_center_tagline: 'Sentro ng Kaalaman'
knowledge_center_title: 'Mga Gabay sa Kagamitang Pandagat at Industriya'
knowledge_center_subtitle: 'Dalubhasang kaalaman at mga gabay sa pagbili para sa mga propesyonal sa larangan ng pandagat, mga operator ng fleet, at mga mahilig sa water sports.'

knowledge_sections:
  - title: 'Kaalaman sa SUP Board'
    tagline: 'Mga Gabay sa Stand-Up Paddleboard'
    desc: 'Lahat ng tungkol sa mga SUP board — disenyo ng board, materyales, pagpili ng laki, pagpapanatili, at payo sa pagbili para sa paggamit na pang-rekasyon at pangkomersyo.'
    guides:
      - title: 'Paano Pumili ng Tamang SUP Board'
        desc: 'Kumpletong gabay sa pagpili ng SUP — laki, volume, materyal, hugis, at nilalayong gamit.'
        href: '/learn/sup'
      - title: 'Inflatable vs Hard SUP'
        desc: 'Inflatable SUP kumpara sa hard epoxy board — portability, tibay, performance, at halaga na inihambing.'
        href: '/compare/inflatable-vs-hardboard'
      - title: 'All-Around laban sa Touring at Yoga SUP'
        desc: "Iba't ibang uri ng SUP board — mga pamantayan sa konstruksyon, hugis, laki, at mga mungkahing gamit."
        href: '/learn/sup'
      - title: 'Drop-Stitch vs Tradisyonal na Konstruksyon'
        desc: 'Ihambing ang drop-stitch at tradisyonal na konstruksyon para sa mga SUP board batay sa timbang, gastos, tibay, at tigas.'
        href: '/learn/drop-stitch-core'
  - title: 'Gabay sa Inflatable SUP'
    tagline: 'Kaalaman sa Inflatable SUP'
    desc: 'Mga kumpletong gabay sa mga inflatable SUP — materyales na PVC, konstruksyong drop-stitch, mga pamantayan sa kaligtasan, at mga pinakamahusay na kagawian sa pagpapanatili.'
    guides:
      - title: 'Gabay sa Materyal na PVC'
        desc: 'Lubos na gabay sa mga materyal na PVC na ginagamit sa konstruksyon ng inflatable SUP board.'
        href: '/learn/materials'
      - title: 'Paano Ginagawa ang mga Inflatable SUP'
        desc: 'Proseso ng paggawa — paggugupot ng materyal, drop-stitch core bonding, konstruksyon ng seam, pressure testing, at quality control.'
        href: '/learn/inflatable-technology'
      - title: 'Gabay sa Kaligtasan sa SUP'
        desc: 'Mga pamantayan sa kaligtasan, kapasidad ng karga, tamang inflation, pagsusuri bago umalis, at mga proseso sa emergency.'
        href: '/learn/water-safety'
      - title: 'Pagpapanatili ng SUP'
        desc: 'Paglilinis, pag-iimbak, proteksyon sa UV, at pagkukumpuni ng mga inflatable SUP board.'
        href: '/v2/inflatable-sup-maintenance'
  - title: 'Kaalaman sa SUP Board'
    tagline: 'Hub ng SUP Board'
    desc: 'Mga teknikal na gabay na sumasaklaw sa mga uri ng SUP board, materyales, paraan ng konstruksyon, pagpapanatili, at kaligtasan.'
    guides:
      - title: 'Mga Uri ng SUP Board'
        desc: 'All-around, touring, yoga, sport, at mga pambatang SUP — alamin ang mga pagkakaiba at piliin ang tamang para sa iyo.'
        href: '/learn/sup'
      - title: 'Teknolohiyang Drop-Stitch'
        desc: 'Kung paano lumilikha ang libu-libong panloob na thread ng matigas at mataas na presyon na inflatable na estruktura.'
        href: '/learn/drop-stitch-core'
      - title: 'Sanggunian sa Materyales'
        desc: 'Mga denier rating ng PVC, timbang ng fabric, paglaban sa UV, at mga marine-grade na materyales na ipinapaliwanag.'
        href: '/learn/materials'
      - title: 'Gabay sa Pagbili ng SUP'
        desc: "Ihambing ang iba't ibang uri ng SUP board para sa iba't ibang layunin at antas ng kasanayan."
        href: '/learn/sup'
  - title: 'Kaalaman sa SUP'
    tagline: 'Mga Gabay sa Stand-Up Paddleboard'
    desc: 'Lahat ng tungkol sa mga SUP board — inflatable vs matigas, sukat ng board, teknolohiya ng materyal, at dalubhasang payo para sa lahat ng antas ng kasanayan.'
    guides:
      - title: 'Inflatable vs Hard SUP'
        desc: 'Ihambing ang mga iSUP at hard epoxy board batay sa portability, tibay, performance, at halaga.'
        href: '/learn/sup'
      - title: 'Gabay sa Suki ng SUP Board'
        desc: 'Kung paano nakaaapekto ang haba, lapad, at kapal sa katatagan, bilis, at kakayahang maniobra.'
        href: '/learn/sup'
      - title: 'Pagpapanatili at Pangangalaga ng SUP'
        desc: 'Paglilinis, pag-iimbak, proteksyon sa UV, at mga tip sa pagkukumpuni para sa mga inflatable SUP board.'
        href: '/v2/inflatable-sup-maintenance'
      - title: 'Pagpili ng Iyong Unang SUP'
        desc: 'Gabay ng baguhan sa pagpili ng tamang stand-up paddleboard para sa iyong timbang, antas ng kasanayan, at nilalayong gamit.'
        href: '/learn/sup'
  - title: 'Gabay sa Operasyon ng Rental'
    tagline: 'Pamamahala ng Fleet para sa mga Negosyong Rental'
    desc: 'Mga gabay sa pagbuo at pamamahala ng mga fleet ng SUP rental para sa mga beach kiosk, sentro ng water sports, at mga ari-arian ng hospitality.'
    guides:
      - title: 'Pagbuo ng Iyong Rental Fleet'
        desc: 'Paano pumili ng tamang mga SUP board para sa iyong operasyon ng rental — tibay, sukat, at pagsasaalang-alang sa ROI.'
        href: '/solutions/rental-operators'
      - title: 'Gabay sa Pagpapanatili ng Fleet'
        desc: 'Mahahalagang kagawian sa pagpapanatili upang mapaunlad ang buhay ng board at mabawasan ang downtime ng mga rental fleet.'
        href: '/solutions/rental-operators'
  - title: 'Gabay sa Resort at Hospitality'
    tagline: 'Mga Aktividad sa Tubig para sa Hospitality'
    desc: 'Mga gabay sa paglulunsad at pamamahala ng mga programa ng SUP para sa mga resort, hotel, at destinasyon sa tabing-dagat.'
    guides:
      - title: 'Pagsisimula ng Programa ng SUP sa Resort'
        desc: 'Mga salik na dapat isaalang-alang sa paglulunsad ng mga aktividad ng SUP para sa bisita — laki ng fleet, pag-aatas ng tauhan, at pagmomodelo ng kita.'
        href: '/solutions/resorts-hotels'
      - title: 'SUP kumpara sa Iba pang Aktividad sa Tubig'
        desc: 'Ihambing ang mga programa ng SUP sa iba pang water sports para sa karanasan ng bisita at kahusayan ng operasyon.'
        href: '/learn/sup'
  - title: 'Gabay sa Retail at Distribusyon'
    tagline: 'Mga Business Partnership sa SUP'
    desc: 'Mga gabay sa pagiging retail partner o distributor ng SUP — pagpaplano ng imbentaryo, pagpaposisyon sa market, at mga estratehiya ng paglago.'
    guides:
      - title: 'Pagiging SUP Retailer'
        desc: 'Paano pumili ng mga linya ng produkto, mamahala ang imbentaryo, at i-market ang mga SUP board sa iyong tindahan.'
        href: '/solutions/retail-partners'
      - title: 'SUP para sa Komersyal na Operasyon'
        desc: 'Kung bakit ang mga inflatable SUP ay maraming gamit na produkto para sa mga komersyal na fleet, negosyong rental, at propesyonal na operator.'
        href: '/solutions/rental-operators'


meta:
  title: 'Teknolohiya — Drop Stitch at Marine PVC | {SITE}'
  description: 'Mga teknolohiya ng afarer: konstruksyong drop stitch, marine PVC, double-layer na build, at mataas na presyon. Innovation mula sa isang propesyonal na manufacturer ng inflatable SUP.'
  keywords:
    - 'teknolohiya ng sup'
    - 'konstruksyong drop stitch'
    - 'high pressure sup'
    - 'mga materyales ng inflatable sup'
hero:
  tagline: 'Teknolohiya'
  title: 'Itinayo para sa Pagganap'
  subtitle: 'Bawat inflatable SUP ng afarer ay ini-engineer na may drop-stitch construction at marine-grade PVC — precision na materyales at paraan ng pagmamanupaktura na sinubukan para sa mapaghamong marine na kapaligiran.'

sections:
  - title: 'Drop-Stitch Core'
    description: 'Libu-libong internal na polyester thread ang nagdudugtong sa itaas at ilalim na layer, na lumilikha ng rigid na istruktura sa 12-15 PSI. Ito ang parehong teknolohiyang ginagamit sa mga propesyonal na paddle board at inflatable racing SUP.'
    imageAlt: 'Dayagram ng DS Core'
  - title: 'Marine-Grade PVC'
    description: 'Multi-layer na laminated PVC fabric na rated para sa marine na kapaligiran. Bawat layer ay fusion-welded sa halip na idinikit, na inaalis ang panganib ng delamination. Sinusubukan para sa UV resistance, kaagnasan ng saltwater, at abrasion.'
    imageAlt: 'Layer ng PVC'
  - title: 'Military-Grade PVC'
    description: 'Ginagamit sa lahat ng modelo ng SUP, ang premium na PVC ay nagbibigay ng higit na paglaban sa UV at kemikal. Pinapanatili ang flexibility sa matinding temperatura at lumalaban sa pagkasira.'
    imageAlt: 'PVC'
  - title: 'Air Deck Floor'
    description: 'High-pressure na inflatable drop-stitch construction na nagbibigay ng natatanging rigidity para sa pagtayo, pangingisda, at yoga. Binabawasan ang oras ng paghahanda, kabuuang timbang, at volume ng pag-iimbak.'
    imageAlt: 'Air Deck'


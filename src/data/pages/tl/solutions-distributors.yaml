meta:
  title: 'Programa ng Partnership sa Wholesale Distribusyon ng SUP | {SITE}'
  description: 'Sumali sa global na network ng wholesale distribusyon ng SUP ng Afarer. Mga eksklusibong teritoryo, kumpletong portfolio ng produktong inflatable SUP, mapagkumpitensyang presyong wholesale, at nakalaang pamamahala ng account sa 50+ bansa.'

hero:
  tagline: 'Mga Distributor'
  title: 'Sumali Sa Aming Global na<br />Network ng Distribusyon'
  subtitle: 'Programa ng partnership sa wholesale distribusyon ng SUP na may mga eksklusibong teritoryo, kumpletong portfolio ng produktong inflatable SUP, at suportang pang-world-class. Nagpapadala ang Afarer sa 50+ bansa — naghahanap kami ng mga established na distributor ng marine at water sports.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Mga operasyon ng global na distribusyon at pagpapadala ng Afarer'

benefits:
  title: 'Ang Makukuha ng mga Distributor'
  subtitle: 'Lahat ng kailangan mo upang magtagumpay sa iyong market.'
  items:
    - 'Mga karapatang eksklusibo sa teritoryo'
    - 'Kumpletong katalogo ng produkto (SUP, aksesorya, piyesa)'
    - 'Mapagkumpitensyang presyong wholesale'
    - 'Mga materyales sa marketing at benta (isinalin)'
    - 'Programa ng pagsasanay (produkto, benta, pagpapanatili)'
    - 'Suporta sa trade show'
    - 'Programa ng sample'
    - 'Kakayahang drop-ship'
    - 'Nakalaang account manager ng distributor'
    - '45-60 araw na tuntunin sa pagbabayad'


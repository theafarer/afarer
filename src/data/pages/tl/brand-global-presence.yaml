meta:
  title: 'Pandaigdigang Presensya — Manufacturer ng SUP na Naglilingkod sa 50+ Bansa | {SITE}'
  description: 'Nag-e-export ang afarer ng mga inflatable SUP sa 50+ bansa sa bawat kontinente. Propesyonal na manufacturer at supplier para sa mga brand, distributor, at fleet.'
  keywords:
    - 'pandaigdigang sup manufacturer'
    - 'exporter ng paddle board'
    - 'sup factory china'
    - 'propesyonal na sup supplier'
hero:
  tagline: 'Pandaigdigang Presensya'
  title: 'Naglilingkod sa 50+ Bansa<br />Sa Bawat Kontinente'
  subtitle: 'Mula sa mga operator ng European coastal patrol hanggang sa mga distributor ng Australian water sports hanggang sa mga rescue team ng Middle East — ang mga board ng afarer ay nasa tubig sa buong mundo.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'pandaigdigang marine manufacturing at distribusyon ng afarer'
stats:
  title: 'Pandaigdigang Abot'
  stats:
    - title: 'Mga Bansa'
      amount: '50+'
    - title: 'Mga Export Market'
      amount: 'Europa, Americas, Asia, Middle East, Oceania'
    - title: 'Produksyon'
      amount: 'Qingdao, Tsina'
    - title: 'US Warehouse'
      amount: 'Montclair, CA'
features3_markets:
  tagline: 'Mga Pangunahing Merkado'
  title: 'Rehiyonal na Kaalaman<br />para sa mga Lokal na Kinakailangan'
  subtitle: 'Nauunawaan namin na magkakaiba ang mga merkado sa mga kinakailangan sa regulasyon, kagustuhan, at kaso ng paggamit.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Europa at UK'
      description: 'Mga produktong CE-certified. Malakas na demand para sa mga SUP board sa buong EU market. Ginagusto ng mga UK distributor ang aming mabilis na turnaround.'
      icon: tabler:map-pin
    - title: 'North America'
      description: 'Manufacturing na aprubado ng US Coast Guard. US warehouse sa Montclair, CA para sa mabilis na paghahatid sa West Coast. Lumalaking demand para sa mga fishing, rescue, at recreational SUP.'
      icon: tabler:map-pin
    - title: 'Australia at Oceania'
      description: 'Malakas na merkado para sa mga SUP board at water sports accessory. Pinahahalagahan ng mga Australian distributor ang aming UV-resistant na PVC construction sa matinding sikat ng araw. Mabilis na pagpapadala mula sa aming pasilidad sa Asia.'
      icon: tabler:map-pin
    - title: 'Middle East'
      description: 'Lumalaking demand para sa kagamitang water adventure. Ang aming mga commercial-grade na SUP at safety gear ay popular sa mga tour operator at rental center. Custom na configuration para sa mataas na temperatura na kapaligiran.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Network ng Distribusyon'
  title: 'Nakikipagtulungan sa mga Distributor<br />Sa Buong Mundo'
  subtitle: 'Nakipagtulungan kami sa mga matatag na distributor ng marine equipment, water sports brand, at ahensya ng government procurement.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Mga Co-Brand Program'
      description: 'Private label manufacturing para sa mga pandaigdigang water sports brand. Bahala kami sa lahat mula disenyo hanggang produksyon hanggang drop-shipping.'
      icon: tabler:building
    - title: 'Network ng Distributor'
      description: 'Mga awtorisadong distributor sa 20+ bansa na may hawak ng stock at nagbibigay ng lokal na suporta. Buong-pusong tinatanggap ang mga bagong tanong ng distributor.'
      icon: tabler:users
    - title: 'Gobyerno at Institusyonal'
      description: 'Direktang suplay sa mga coast guard, search and rescue organisation, at military procurement program. Pagsunod sa mga kinakailangan ng institusyonal na procurement.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Pandaigdigang Logistics at Suporta'
  subtitle: 'Mula pabrika hanggang patutunguhan — pinamamahalaan namin ang buong supply chain.'
  items:
    - title: 'Mga Opsyon ng Pagpapadala'
      description: 'Sea freight (FOB Qingdao), air freight para sa mga urgent na order, at express courier para sa mga sample at spare part.'
      icon: tabler:truck-delivery
    - title: 'US Warehouse'
      description: 'Hawak na stock sa Montclair, CA para sa mabilis na paghahatid sa buong North America. West Coast: 2-3 araw, Central: 3-4 araw, East Coast: 4-5 araw.'
      icon: tabler:building-warehouse
    - title: 'Mga Spare Part'
      description: 'Orihinal na spare part at consumable ng afarer na naka-stock buong taon. Ang mga karaniwang parte ay ipinapadala sa loob ng 24 oras.'
      icon: tabler:package
    - title: 'Teknikal na Suporta'
      description: 'Direktang linya sa aming engineering team para sa mga teknikal na tanong, payo sa pagkukumpuni, at suporta sa replacement part. Sinusuportahan namin ang mga board na ginawa namin 20 taon ang nakalipas.'
      icon: tabler:headset
cta:
  title: 'Gusto mong maging distributor?'
  subtitle: 'Aktibo kaming pinalalawak ang aming network ng distribusyon. Makipag-ugnayan sa aming export team upang talakayin ang mga pagkakataon ng partnership.'
  actions:
    - variant: primary
      text: 'Tanong tungkol sa partnership'
      href: /contact/
    - text: 'Tingnan ang aming linya ng produkto'
      href: /products/

meta:
  title: 'Mga Sertipikasyon — CE, ISO 9001 at Pagsunod | {SITE}'
  description: 'Mga sertipikasyon ng kalidad ng afarer: CE (EN ISO 25649), ISO 9001:2015, BSCI. Pagsunod at kaligtasan para sa isang tagagawa ng inflatable SUP.'
  keywords:
    - 'ce certification sup'
    - 'iso 9001 sup'
    - 'nautical compliance'
    - 'sertipikasyon ng paddle board'
hero:
  tagline: 'Mga Sertipikasyon at Pamantayan'
  title: 'Mga Sertipikasyon ng Kalidad<br />at Pamantayan ng Pagsunod'
  subtitle: 'Ang paggawa ng SUP ng afarer ay sertipikado ayon sa mga pandaigdigang pamantayan ng kaligtasan sa dagat, sistema ng quality management, at regulasyon sa kapaligiran — CE, ISO 9001, UKCA, BSCI, at REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'mga sertipikasyon ng kalidad ng afarer at dokumentasyon ng pagsunod'
content_certifications:
  tagline: 'Ang Aming mga Sertipikasyon'
  title: 'Sertipikadong Kalidad,<br />Kilala sa Buong Mundo'
  subtitle: 'Ang bawat produkto ng afarer ay may kasamang mga sertipikasyon na nagpapatunay ng aming komitment sa kalidad, kaligtasan, at responsibilidad sa kapaligiran.'
  items:
    - title: 'CE Certified'
      description: 'Lahat ng produkto ng afarer ay sumusunod sa mga kinakailangan ng European CE marking para sa recreational watercraft, na tinitiyak na natutugunan ang mga pamantayan ng kaligtasan, kalusugan, at proteksyon sa kapaligiran.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Ang aming quality management system ay sertipikado sa ISO 9001:2015, na sumasaklaw sa disenyo, paggawa, at distribusyon ng inflatable watercraft at kagamitang pandagat.'
      icon: tabler:clipboard-check
    - title: 'UKCA Marked'
      description: 'Ang mga produktong ibinebenta sa UK market ay may UKCA marking, na kumukumpirma ng pagsunod sa regulasyon ng UK para sa kagamitang pandagat at personal watercraft.'
      icon: tabler:shield
    - title: 'Sumusunod sa BSCI'
      description: 'Ang afarer ay naka-audit sa BSCI (Business Social Compliance Initiative), na nagpapatunay ng etikal na kagawian sa paggawa, makatarungang kundisyon ng paggawa, at responsibilidad sa supply chain.'
      icon: tabler:heart-handshake
    - title: 'Sumusunod sa REACH'
      description: 'Lahat ng materyal na ginagamit sa mga produkto ng afarer ay sumusunod sa regulasyong EU REACH para sa kaligtasan sa kemikal, na tinitiyak na walang ipinagbabawal na sangkap sa aming PVC, EVA, o mga bahagi.'
      icon: tabler:flask
    - title: 'Pagsubok sa Materyal'
      description: 'Ang mga fabric ay sinusubok para sa tensile strength, tear resistance, pagkasira dahil sa UV, at performance sa cold-crack. Ang bawat production batch ay sinasample at pinapatunayan.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Mga Pamantayan sa Pabrika'
  title: 'Kahusayan sa Paggawa<br />— Ginawa Ayon sa Espesipikasyon'
  subtitle: 'Ang aming pasilidad na 12,000 m² ay gumagana sa ilalim ng mahigpit na protokol ng quality control sa bawat yugto ng produksyon.'
  list:
    - 'Pagsisiyasat sa Papasok na Materyal: Lahat ng hilaw na materyal — PVC fabric, EVA foam, adhesive, hardware — ay sinusubok laban sa mga espesipikasyon bago pumasok sa produksyon.'
    - 'Quality Control Habang sa Proseso: Ang bawat yugto ng produksyon ay may naka-dokumentong QC checkpoint. Ang lakas ng weld, pagkakalinya ng seam, pag-instala ng valve, at torque ng fitting ay pinapatunay nang inline.'
    - 'Pressure Testing: Ang bawat inflatable chamber ay pressure-tested sa 1.25× ng rated pressure sa loob ng 24–48 oras. Ang pagbaba ng presyon ay dapat manatili sa ibaba ng 5% upang pumasa.'
    - 'Huling Pagsisiyasat: Ang mga natapos na produkto ay sinisiyasat para sa kawastuhan ng sukat, cosmetics ng finish, kumpleto ng aksesorya, at integridad ng packaging bago ipadala.'
    - 'Traceability ng Batch: Ang bawat produkto ay may serial number na nakakabit sa talaan ng production batch, na nagpapahintulot ng buong traceability mula hilaw na materyal hanggang tapos na produkto.'
content_safety:
  tagline: 'Mga Pamantayan ng Kaligtasan sa Dagat'
  title: 'Kaligtasan ang Una<br />— Dinisenyo para sa Maaasahang Operasyon'
  subtitle: 'Ang mga produkto ng afarer ay idinisenyo at sinusubok upang tumugon sa mga pandaigdigang pamantayan ng kaligtasan sa dagat para sa komersyal at pang-rekasyon na paggamit.'
  items:
    - title: 'EN ISO 25649'
      description: 'Ang mga inflatable SUP ay sumusunod sa mga pamantayan ng EN ISO 25649 para sa konstruksyon, katatagan, buoyancy, at kapasidad ng karga.'
      icon: tabler:sailboat
    - title: 'Pagsunod sa SOLAS'
      description: 'Ang kagamitang pangkaligtasan at mga kagamitang pansagip ng buhay ay tumutugon sa mga kinakailangan ng SOLAS (Safety of Life at Sea) kung naaangkop.'
      icon: tabler:lifebuoy
cta:
  title: 'Kailangan ng sertipikadong produkto para sa iyong proyekto?'
  subtitle: 'Makipag-ugnayan sa aming team upang talakayin ang mga kinakailangan sa sertipikasyon, dokumentasyon, at pagsunod para sa iyong market.'
  actions:
    - variant: primary
      text: 'Humiling ng dokumento ng sertipikasyon'
      href: /contact
    - text: 'Tingnan ang aming pahina ng kalidad'
      href: /quality

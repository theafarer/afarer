content_html: |
  <h2>1. Paunang Kwalipikasyon: Ano ang Hanapin sa isang Pabrika</h2>

  <h3>Mga Sertipiko ng Pagsunod</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Sistema ng quality management</li>
    <li><strong>CE certification</strong> – Patunayan ang numero ng Notified Body</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Audit ng pagsunod sa panlipunan</li>
    <li><strong>REACH / RoHS</strong> – Deklarasyon ng pagsunod sa materyal</li>
  </ul>

  <h3>Mga Kakayahan sa Paggawa</h3>
  <ul>
    <li>Paghabi ng drop-stitch core na in-house kumpara sa outsourced</li>
    <li>Linya ng PVC coating / lamination</li>
    <li>Kagamitang RF welding at hot air welding</li>
    <li>Paggawa ng mold na in-house (CNC machining)</li>
    <li>Testing lab (pressure testing, UV aging, tensile testing)</li>
  </ul>

  <h3>Pagpapatunay ng Karnasan</h3>
  <ul>
    <li>Taon sa paggawa ng inflatable watercraft (pinakamababa 5+ taon)</li>
    <li>Bilang ng engineer sa empleyado</li>
    <li>Mga umiiral na kliyenteng OEM/ODM (humingi ng mga reference)</li>
    <li>Mga destinasyon ng export – nagpapadala na ba sila sa iyong target na market?</li>
  </ul>

  <h2>2. Mga Protokol ng Quality Control</h2>
  <p>Incoming QC ng materyal: tensile strength (ASTM D751 o ISO 1421), tear resistance (ASTM D2261 o ISO 4674), adhesion strength, spot check ng UV aging.</p>
  <p>In-process QC: pagsubaybay sa lakas ng seam kada 50 unit, pagpapatunay ng torque ng valve, pagsusuri ng density ng drop-stitch thread, dimensional check laban sa CAD drawing.</p>
  <p>Huling pagsisiyasat: 100% inflation hold test (24 oras, max 5% pagbaba), visual inspection, pagsubok sa gamit ng valve, pagsubok sa random na sample (AQL 2.5 o 4.0 ayon sa ISO 2859).</p>

  <h2>3. Checklist ng Dokumentasyon ng Pagsunod</h2>
  <ul>
    <li>Declaration of Conformity (DoC) na tumutukoy sa tamang EU directive</li>
    <li>CE certificate mula sa notified body</li>
    <li>Test report mula sa accredited na lab</li>
    <li>Material safety data sheet (MSDS)</li>
    <li>Deklarasyon ng pagsunod sa REACH</li>
    <li>Bill of Materials na may traceability ng supplier</li>
    <li>Ulat ng pagsisiyasat sa pabrika</li>
  </ul>

  <h2>4. Negosasyon ng MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Uri ng Produkto</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Karaniwang MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Saklaw na Maaring Negosyahan</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Mga SUP Board</td><td class="p-3 border">50 – 100 unit</td><td class="p-3 border">5 – 10 unit (trial)</td></tr>
      <tr><td class="p-3 border">Mga Kayak</td><td class="p-3 border">50 – 100 unit</td><td class="p-3 border">5 – 10 unit (trial)</td></tr>
      <tr><td class="p-3 border">Mga Inflatable SUP</td><td class="p-3 border">50 – 100 unit</td><td class="p-3 border">2 – 5 unit (trial)</td></tr>
      <tr><td class="p-3 border">Kaligtasan / Mga Aksesorya</td><td class="p-3 border">200 – 500 unit</td><td class="p-3 border">50 – 100 unit (trial)</td></tr>
    </tbody>
  </table>

  <h2>5. Lohestika at Pagpapadala</h2>
  <p>Mga karaniwang Incoterms: <strong>FOB</strong> (Ihahatid ng pabrika sa departure port – pinakakaraniwan), <strong>EXW</strong> (Aayusin ng buyer ang lahat ng pagpapadala mula sa pintuan ng pabrika), <strong>CIF</strong> (Babayaran ng pabrika ang freight at insurance hanggang sa destination port).</p>
  <p>Ang mga produktong inflatable ay magaan ang timbang ngunit malaki ang volume – ang volumetric weight (DIM) ang kadalasang nagtatakda ng gastos sa pagpapadala. Humingi ng vacuum-packed na packaging upang mabawasan ang volume ng 50–60%. Sea freight mula Tsina papuntang EU: 25–35 araw; papuntang US West Coast: 15–20 araw.</p>

  <h2>6. Mga Karaniwang Pagkakamali</h2>
  <ul>
    <li><strong>Walang audit sa pabrika:</strong> Laging magsagawa o magkomisyon ng third-party audit (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Espesipikasyong berbal lamang:</strong> Detalyadong technical specification sheet na napirmahan ng dalawang panig</li>
    <li><strong>Paglaktaw ng pag-apruba sa sample:</strong> Nakasulat na pagtibay sa mga sample bago ang bulk production</li>
    <li><strong>Walang QC habang nasa produksyon:</strong> Third-party inspection habang nasa produksyon (DUPRO) at bago mag-shipment (PSI)</li>
    <li><strong>Pagbalewala sa pagsunod:</strong> Patunayan ang CE/UKCA certification bago ang produksyon</li>
  </ul>

  <h2>7. Bakit Afarer</h2>
  <p>Ang Afarer ay naggagawa ng OEM/ODM inflatable watercraft mula pa noong 2012. Sa pasilidad na 12,000 m&sup2; na sertipikado sa ISO 9001, 25+ engineer, at CE certification sa lahat ng linya ng produkto, natutugunan namin ang bawat pamantayan sa gabay na ito. Nag-aalok kami ng trial MOQ para sa mga bagong partner at kumpletong package ng dokumentasyon ng pagsunod.</p>


timeline:
  - year: '2012'
    title: 'Pundasyon ng Marine Manufacturing'
    body: 'Nagsimula ang afarer bilang isang espesyal na watercraft workshop sa Qingdao, Tsina, na nakatuon sa marine craftsmanship at pagmamanupaktura ng watercraft. Ang maagang pokus ay ang paggawa ng maaasahang inflatable na produkto sa pamamagitan ng praktikal na karanasan sa engineering at disiplina sa pagmamanupaktura.'
  - year: '2015'
    title: 'Unang Export at CE Certification'
    body: 'Umabot sa Japan at Korea ang mga unang export order. Nakamit ang CE certification para sa mga pangunahing linya ng produkto, na nagmarka ng pagpasok ng afarer sa mga pandaigdigang merkado. Nagsimula ang kumpanyang maglingkod sa mga komersyal at recreational na user sa labas ng Tsina.'
  - year: '2018'
    title: 'Paglawak ng Pabrika'
    body: 'Lumipat sa isang 12,000 m² na production facility. Nagdagdag ng mga RF welding line at kapasidad ng drop-stitch production, na nagpapahintulot ng mas malaking antas ng pagmamanupaktura at pinabuting quality control system.'
  - year: '2020'
    title: 'Pagtatatag ng R&D Center'
    body: 'Nagbukas ng nakalaang R&D center na may PVC fabric lab, hydrodynamic test tank, at CAD/FEA simulation studio. Lumawak ang pag-develop ng produkto na nakatuon sa magaan na konstruksyon, pinabuting tibay, at user-centered na disenyo.'
  - year: '2022'
    title: 'Sertipikasyon at Pandaigdigang Paglago'
    body: 'Nakamit ang ISO 9001 certification. Lumawak sa 14 R&D engineer at 200+ manggagawa. Umabot ang mga produkto sa mga customer sa buong Europa, Americas, at Asia-Pacific sa pamamagitan ng distributor at co-brand na partnership.'
  - year: '2024'
    title: 'Innovation at Design Studio'
    body: 'Inilunsad ang full-service na design at innovation studio para sa mga custom co-brand na proyekto, mula konsepto hanggang produksyon. Pinalakas ang mga propesyonal na marine application kabilang ang rescue, komersyal, at mga kontrata ng gobyerno.'
  - year: '2026'
    title: 'Pagtatayo Ng Kinabukasan Ng Paggalugad Sa Tubig'
    body: 'Ngayon, patuloy na nagde-develop ang afarer ng mga SUP system at marine accessory — nag-uugnay ng mga tao at organisasyon sa mga katubigan ng mundo. 50+ bansang pinaglilingkuran, 15,000+ unit na taunang kapasidad.'

content_founding:
  tagline: 'Ang Simula'
  title: 'Ipinanganak sa Tabing-Dagat'
  subtitle: 'Nagsimula ang afarer sa isang coastal workshop sa Qingdao na may isang board at isang bisyon: gumawa ng mga inflatable watercraft na kayang harapin ang tunay na kondisyon sa dagat.'
  paragraphs:
    - 'Noong 2012, nakita ng aming mga tagapagtatag ang isang puwang sa merkado — karamihan sa mga inflatable watercraft ay mura ngunit hindi maaasahan, o mataas ang kalidad ngunit napakamahal. Naniniwala sila na may espasyo para sa isang manufacturer na nagbibigay ng parehong kalidad at halaga.'
    - 'Ang unang hull ay ginawa gamit ang kamay, sinubukan sa mga lokal na katubigan, at pinahusay batay sa tunay na feedback mula sa mga mangingisda at maliliit na komersyal na operator. Ang feedback loop na iyon — gumawa, sumubok, makinig, mag-improve — ay nananatili sa ubod ng aming pilosopiya sa engineering hanggang ngayon.'
    - 'Sa pagpasok ng 2015, kumalat na ang balita sa labas ng Qingdao. Nagsimulang humingi ng mga sample ang mga pandaigdigang distributor. Ang nagsimula bilang lokal na workshop ay unti-unting naging pandaigdigang supplier.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'maagang production workshop at pagmamanupaktura ng afarer'

content_growth:
  tagline: 'Paglago at Innovation'
  title: 'Mula Workshop hanggang 12,000 m² na Pasilidad'
  subtitle: 'Ang patuloy na pamumuhunan sa mga tao, kagamitan, at proseso ay naging modernong marine manufacturing facility ang afarer.'
  paragraphs:
    - 'Habang lumalaki ang demand, lumaki rin ang aming pasilidad. Lumawak kami mula sa maliit na workshop patungo sa 12,000 m² na pabrika na may nakalaang mga production line para sa mga SUP board at accessory.'
    - 'Nagpuhunan kami ng mga CNC cutting machine, high-frequency welding equipment, mga drop stitch production line, at komprehensibong testing rig — na nagpapahintulot sa amin na kontrolin ang bawat aspekto ng kalidad ng produksyon.'
    - 'Ngayon, ang aming koponan na 200+ ay kinabibilangan ng mga marine engineer, material scientist, espesyalista sa quality control, at bihasang craftspeople — na marami sa kanila ay nasa afarer na mula pa sa mga unang araw.'

philosophy:
  tagline: 'Pilosopiya ng Brand'
  title: 'Pag-engineer Ng Kalayaan Sa Tubig'
  body: 'Ang kalayaan sa tubig ay hindi lamang tungkol sa paggalaw. Ito ay kumakatawan sa pagtuklas ng mga bagong lugar, paglikha ng mga karanasan sa labas, pag-uugnay ng mga tao sa kalikasan, at pagbibigay-kakayahan sa mga propesyonal na misyon. Ang engineering ang nagpapagana ng kalayaang iyan.'
  pillars:
    - title: 'Maaasahan Muna'
      body: 'Ang mga kapaligiran sa tubig ay nangangailangan ng tiwala. Ang mga produkto ng afarer ay dinisenyo sa paligid ng stability, tibay, kaligtasan, at pare-parehong pagganap.'
    - title: 'Disenyong Nakatuon sa Tao'
      body: 'Dapat maglingkod ang mga produkto sa mga tao, hindi sa teknolohiya. Bawat desisyon sa disenyo ay nagsisimula sa pag-unawa kung paano ginagamit ng mga tao ang watercraft, saan sila naggagalugad, at anong mga hamon ang kanilang hinaharap.'
    - title: 'Abot-kayang Paggalugad'
      body: 'Hindi dapat pagmamay-ari lamang ng mga eksperto ang tubig. Lumilikha ang afarer ng mga kagamitan na nagpapahintulot sa mas maraming tao na ligtas na maranasan ang mga ilog, lawa, karagatan, at coastal na kapaligiran.'
    - title: 'Patuloy na Innovation'
      body: 'Ang innovation ay hindi lamang paglikha ng mga bagong produkto. Ito ay pagpapabuti ng bawat detalye — mga materyales, istruktura, pagmamanupaktura, at karanasan ng user.'

engineeringDna:
  tagline: 'Engineering DNA'
  title: 'Paano Lumilikha ang afarer ng mga Produkto'
  areas:
    - title: 'Agham ng Materyales'
      body: 'Nakatuon ang afarer sa pagpili ng angkop na mga materyales para sa iba-ibang marine na kapaligiran. Kasama sa mga pangunahing pagsasaalang-alang ang abrasion resistance, UV resistance, stability ng presyon, at pangmatagalang tibay.'
      items: ['Laban sa Abrasion', 'UV Resistance', 'Stability ng Presyon', 'Pangmatagalang Tibay']
    - title: 'Structural Engineering'
      body: 'Nangangailangan ang mga inflatable watercraft ng tumpak na balanse sa pagitan ng rigidity, timbang, portability, at stability. Nakatuon ang engineering ng afarer sa pag-optimize ng mga salik na ito sa pamamagitan ng drop-stitch core technology at advanced na seam construction.'
      items: ['Rigidity', 'Pag-optimize ng Timbang', 'Portability', 'Stability']
    - title: 'Kawastuhan sa Pagmamanupaktura'
      body: 'Bawat produkto ay dumadaan sa mga kontroladong proseso: paghahanda ng materyales, precision cutting, welding at bonding, assembly, inspeksyon ng kalidad, at beripikasyon ng pagganap.'
      items: ['Paghahanda ng Materyales', 'Precision Cutting', 'Welding at Bonding', 'Assembly at QC']
    - title: 'Engineering ng Senaryo ng Paggamit'
      body: 'Ang mga produkto ay binubuo ayon sa tunay na aplikasyon — recreation, adventure, at propesyonal na paggamit — upang masiguro na tumutugon ang bawat disenyo sa mga partikular na pangangailangan ng inaasahang kapaligiran.'
      items: ['Recreation', 'Adventure', 'Propesyonal', 'Komersyal']


meta:
  title: 'Tungkol sa Afarer — Brand ng Inflatable SUP at Water Sports | {SITE}'
  description: 'Ang Afarer ay isang pandaigdigang brand ng inflatable SUP at water sports, na pinapatakbo ng Aquafarer LLC (USA) at itinayo ng aming Qingdao Operation Team. Tuklasin ang aming kuwento, engineering, sertipikadong kalidad, at mga programang country partner.'
  keywords:
    - 'brand ng inflatable SUP'
    - 'brand ng water sports'
    - 'country sup distributor'
    - 'mga co-branded na koleksyon ng sup'
hero:
  tagline: 'Tungkol sa amin'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'pabrika at workshop ng afarer'
  title: |
    Marine engineering, <br />
    itinayo sa paraang <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Nagsimula kami sa isang coastal workshop na may isang board at isang matibay na paniniwala: ang mga marine na produkto ay dapat i-engineer na para bang mahalaga ang mga ito, dahil mahalaga nga. Ngayon ay nagpapadala kami sa mahigit 40 bansa, ngunit bawat hull ay dumadaan pa rin sa parehong mga kamay na nagsimula ng kumpanya.'

stats:
  title: 'Sa mga numero'
  columns: 4
  stats:

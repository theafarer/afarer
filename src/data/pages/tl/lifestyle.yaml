hero:
  tagline: 'Lifestyle'
  title: 'Ang Lifestyle<br />ng afarer'
  subtitle: 'Itinayo para sa mga nakatira sa tubig — mula sa mga weekend explorer hanggang sa mga komersyal na operator na umaasa sa kanilang kagamitan araw-araw.'

values:
  - icon: 🌊
    title: 'Ipinanganak sa Tubig'
    desc: 'Bawat disenyo ay nagsisimula sa pag-unawa kung paano kumikilos ang tubig. Nag-i-engineer kami mula sa gilid ng mga kondisyon papaloob — dahil ang karagatan ang aming guro, hindi ang aming lugar ng trabaho.'
  - icon: 🔧
    title: 'Itinayo para Magtagal'
    desc: 'Ang pinakamainam na produkto sa kalikasan ay ang hindi na kailangang palitan. Marine-grade na materyales, drop-stitch core na rated sa 15 PSI, at mga seam na tumatagal nang lampas sa season.'
  - icon: '🏆'
    title: 'Abot-kaya sa Disenyo'
    desc: 'Hindi dapat luho ang water sports. Pagganap na propesyonal sa presyong may saysay para sa mga pamilya, gabay, at maliliit na operator — hindi lamang para sa mga komersyal na fleet.'
  - icon: 🌍
    title: 'Pandaigdigang Komunidad'
    desc: 'Mula sa dalampasigan ng Qingdao hanggang sa mga lawa sa Europa, mga ilog sa Southeast Asia, at mga look sa Americas — iisa ang bahagi ng aming mga customer: pagmamahal sa pagiging nasa tubig.'
  - icon: ♻️
    title: 'Responsableng Pagmamanupaktura'
    desc: 'Ang CNC-optimised na nesting ay bumabawas ng basura ng materyales sa mas mababa sa 5%. Ang matibay na konstruksyon ay nagbabawas ng dalas ng pagpapalit. Nagtatayo kami para sa tagal dahil iyon ang pinakamainam na pagpipilian.'
  - icon: 🤝
    title: 'Suportang Nagtatagal'
    desc: 'Ang mga hull na dalawampung taon na ay tumatawag pa rin sa amin para sa spare part. Ang aming tugon sa warranty ay karaniwang 24 oras. Hindi kami nawawala pagkatapos ng benta — narito kami habang buhay ang produkto.'


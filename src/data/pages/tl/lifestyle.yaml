meta:
  title: 'Lifestyle — Paddle, Pakikipagsapalaran at Paggalugad | {SITE}'
  description: 'Tuklasin ang lifestyle ng afarer: mga pakikipagsapalaran sa paddle, paggalugad sa tubig, at mga karanasan sa labas gamit ang mga inflatable SUP at board.'
  keywords:
    - 'lifestyle ng sup'

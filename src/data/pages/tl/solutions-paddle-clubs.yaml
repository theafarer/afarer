meta:
  title: 'Kagamitan at mga Solusyon sa SUP Fleet para sa Paddle Club | {SITE}'
  description: 'Kumpletong mga programa ng SUP fleet para sa mga paddle club at paaralan. Mga start-up package, propesyonal na fleet, mga board pangkompetisyon, kit ng training center, at suporta sa piyesang pamalit.'

hero:
  tagline: 'Mga Paddle Club at Paaralan'
  title: 'Ilunsad, Patakbuhin at Palakihin Ang Iyong Paddle Club<br />Sa Mga SUP Fleet na Antas-Komersyal'
  subtitle: 'Tagapagtustos ng kagamitang SUP club para sa mga paddle club at SUP school sa buong mundo — matitibay na komersyal na board, presyong bulk club, custom branding, at mabilis na piyesang pamalit, upang makatuon ka sa paglaki ng iyong komunidad.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 'Mga miyembro ng paddle club sa magkakatugmang Afarer SUP board'

benefits:
  title: 'Mga Benepisyo ng Club Fleet'
  subtitle: 'Bakit pinipili ng mga paddle club sa 50+ bansa ang Afarer bilang kanilang partner sa kagamitan.'
  items:
    - metric: '40%+'
      label: 'Tipid sa Gastos ng Fleet'
      detail: 'Kumpara sa presyong retail na may bulk club discount'
    - metric: '48h'
      label: 'Pagpapalit ng Piyesa'
      detail: 'Napakaliit na downtime para sa iyong rental fleet'
    - metric: '500+'
      label: 'Mga Siklo ng Rental'
      detail: 'Tibay na antas-komersyal kada board'
    - metric: '5+ Taon'
      label: 'Buhay ng Fleet'
      detail: 'Sa tamang pagpapanatili at pangangalaga'

packages:
  title: 'Mga Programa ng Club Fleet'
  subtitle: 'Piliin ang programa ng fleet na tumutugma sa laki at hangarin ng iyong club.'
  items:
    - name: 'Start-Up Package'
      tagline: 'Para sa mga bagong club, hanggang 30 miyembro'
      features:
        - '10 SUP board (halo ng all-round + touring)'
        - '10 paddle + 10 life vest'
        - '2 dual-action pump + repair kit'
        - 'Branding ng club sa mga board (pag-print ng logo)'
        - 'Gabay sa paglulunsad + checklist ng kaligtasan'
        - 'CE certified — lahat ng kagamitan'
      cta_text: 'Simulan Ang Iyong Club'
    - name: 'Propesyonal na Fleet'
      tagline: 'Para sa mga established na club, 50-100 miyembro'
      features:
        - '30 SUP board (3 opsyon sa laki)'
        - '30 paddle + 30 life vest'
        - '5 pump + 2 repair kit + storage rack'
        - 'Custom na kulay ng club + logo sa mga board'
        - 'Programa ng piyesang pamalit (15% discount)'
        - 'Session ng pagsasanay ng tauhan (online)'
        - 'CE certified — lahat ng kagamitan'
      popular: true
      cta_text: 'Buuin Ang Iyong Fleet'
    - name: 'Fleet pang-Kompetisyon'
      tagline: 'Para sa mga racing club, event, kompetisyon'
      features:
        - '50+ racing / performance board'
        - 'Kumpletong set ng aksesorya (mga paddle, vest, pump)'
        - 'Kit ng suporta sa event (starting buoy, marker)'
        - 'Priyoridad sa piyesa (pagpapadala sa 24 oras)'
        - 'Nakalaang account manager'
        - 'Opsyon sa custom uniporme ng team'
        - 'CE certified — lahat ng kagamitan'
      cta_text: 'Kunin ang Competition Fleet'

training:
  title: 'Mga Package ng Training Center'
  subtitle: 'Lahat ng kailangan ng isang SUP school upang magpatakbo ng propesyonal na kurso ng sertipikasyon.'
  items:
    - name: 'Instructor Starter'
      features:
        - '5 premium na SUP board (antas ng instructor)'
        - '5 carbon paddle para sa demo'
        - '5 life vest (angkop sa instructor)'
        - 'Gabay sa curriculum ng pagsasanay'
        - 'Kagamitang CE certified'
    - name: 'Kumpletong Set para sa Paaralan'
      features:
        - '20 SUP board (halo ng estudyante + instructor)'
        - "20 paddle + 20 life vest (iba't ibang laki)"
        - '10 buoyancy aid para sa mga baguhan'
        - '4 pump + repair kit'
        - 'Curriculum ng pagsasanay at suporta sa sertipikasyon'
        - 'Kagamitang CE certified'

features:
  title: 'Bakit Pinipili ng mga Club ang Afarer'
  subtitle: 'Tuloy-tuloy na kalidad, mabilis na piyesa, at presyong bulk na para sa mga lumalaking club.'
  items:
    - title: '500+ Siklo ng Rental'
      description: 'Ang mga board na antas-komersyal ay nakakaligtas sa maraming season ng araw-araw na paggamit.'
      icon: 'tabler:shield-check'
    - title: 'Custom na Kulay'
      description: 'Itugma ang pagkakakilanlan ng iyong club gamit ang custom na kulay ng board at logo.'
      icon: 'tabler:palette'
    - title: 'Presyong Bulk'
      description: 'Volume discount para sa mga order ng fleet na 10+ board.'
      icon: 'tabler:discount'
    - title: 'Mabilis na Piyesa'
      description: 'Ang mga piyesang pamalit ay ipinapadala sa loob ng 48 oras.'
      icon: 'tabler:truck-delivery'
    - title: 'Suporta sa Paglaki ng Club'
      description: 'Payo tungkol sa programa ng membership, pagpepresyo, at pagho-host ng event.'
      icon: 'tabler:trending-up'
    - title: 'CE Certified'
      description: 'Ang lahat ng kagamitan ay tumutugon sa mga pamantayang pangkaligtasan sa buong mundo.'
      icon: 'tabler:certificate'

cta:
  title: 'Handa nang buuin ang iyong paddle club?'
  subtitle: 'Kunin ang quote ng iyong club fleet o i-download ang aming gabay para sa bagong club.'
  actions:
    - text: 'Mag-apply para sa Club Fleet'
      href: '/contact?package=club'
      variant: 'primary'
    - text: 'I-download ang Club Guide'
      href: '/resources/download-catalog'
      variant: 'secondary'

  subtitle: '8 minutong babasahin'

content_html: |
  <h2>Ano ang Drop Stitch?</h2>
  <p>Ang drop stitch (tinatawag ding "drop-stitch fabric" o "drop-stitch core") ay isang paraan ng konstruksyon kung saan libu-libong indibidwal na polyester thread ang nagdudugtong sa itaas at ilalim na layer ng isang fabric shell. Kapag pinresyar ang shell, gumagana ang mga thread na ito bilang internal tension member — pinipigilan nilang umumbok pababa at pataas ang itaas at ilalim na panel upang maging bilog, at pinipilitang manatiling patag at rigid ang panel.</p>
  <p>Ang resulta ay isang magaan at dadalahin na istrukturang kayang tiisin ang 15 – 20 PSI ng panloob na presyon — katumbas ng rigidity ng hard-shell board ngunit ganap na maaaring ide-deflate para sa pag-iimbak at transportasyon.</p>

  <h2>Paano Ito Gumagana: Ang Pisika</h2>
  <p>Sa isang karaniwang inflatable na istruktura (tulad ng balloon o air mattress), ang panloob na presyon ng hangin ay nagtutulak nang pantay sa lahat ng direksyon. Kapag walang panloob na pagpipigil, ang istruktura ay nagiging cylindrical o spherical. Nilulutas ito ng drop stitch sa pamamagitan ng pagpapakilala ng tensile reinforcement:</p>
  <ul>
    <li>Libu-libong thread ang nagdudugtong sa itaas at ilalim na layer ng tela</li>
    <li>Kapag pinresyar, ang presyon ng hangin ay sumusubukang itulak ang magkahiwalay ang itaas at ilalim</li>
    <li>Lumalaban ang mga thread sa paghihiwalay na ito, inililipat ang karga sa tension sa kahabaan ng axis ng thread</li>
    <li>Ang resulta ay isang patag at rigid na panel na lumalaban sa pagyuko</li>
  </ul>

  <h2>Proseso ng Konstruksyon</h2>
  <ol>
    <li><strong>Paghabi:</strong> Ang mga polyester thread ay habiang sabay-sabay sa dalawang hiwalay na layer ng base fabric (karaniwang 1,100 DTEX o 1,680 DTEX PVC-coated na polyester). Ang mga thread ay loop-woven sa pagitan ng mga layer sa 90&deg; na anggulo.</li>
    <li><strong>Paglalagay ng coating:</strong> Ang habing base fabric ay pinapalitan ng PVC (o paminsan-minsang TPU) gamit ang proseso ng knife-coating o calendar-coating. Biniyak nito ang mga thread at nililikha ang air-tight na membrane.</li>
    <li><strong>Pagdugtong ng layer:</strong> Ang drop-stitch core ay dinudugtong sa panlabas na laminated layer (karaniwang 0.9 mm o 1.2 mm PVC) gamit ang heat lamination o adhesive.</li>
    <li><strong>Pag-weld:</strong> Ang mga rail band ay hinahasa sa gilid gamit ang hot air welding, RF welding, o high-frequency welding upang likhain ang mga side wall ng board.</li>
    <li><strong>Pagkabit ng valve:</strong> Ang mga Boston valve o Halkey-Roberts valve ay iniinstall, karaniwang may pressure relief mechanism upang maiwasan ang over-inflation.</li>
  </ol>

  <h2>Mga Pangunahing Tagapahiwatig ng Kalidad</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Antas ng Pasok</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Densidad ng thread</td><td class="p-3 border">1 thread / sq in</td><td class="p-3 border">2 thread / sq in</td></tr>
      <tr><td class="p-3 border">Base fabric</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Maximum na presyon</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Kapal ng PVC</td><td class="p-3 border">0.6 – 0.9 mm</td><td class="p-3 border">1.0 – 1.2 mm</td></tr>
      <tr><td class="p-3 border">Konstruksyon ng rail</td><td class="p-3 border">Tinupi at dinikit</td><td class="p-3 border">Hinasa at fusion-bonded</td></tr>
    </tbody>
  </table>

  <h2>Mga Aplikasyon</h2>
  <ul>
    <li><strong>Mga SUP Board:</strong> 4" – 6" kapal, 15 – 20 PSI, 1 – 2 thread/sq in</li>
    <li><strong>Mga Kayak:</strong> Drop-stitch na sahig + inflatable na side chamber, 10 – 15 PSI ang sahig</li>
  </ul>

  <h2>Drop Stitch laban sa Air Deck (Fiberglass o Wood Core)</h2>
  <p>Gumagamit ang mga hard-shell board ng EPS foam core na may fiberglass o wood stringer reinforcement. Mas magaan, mas tigas, at mas tumutugon ang mga ito — ngunit hindi maaaring ide-deflate. Ipinagpapalit ng drop stitch ang bahagi ng rigidity para sa ganap na portability. Para sa karamihan ng recreational na user, ang mga modernong drop-stitch SUP sa 20 PSI ay hindi mapagkaiba sa rigidity mula sa mga entry-level na hard board.</p>

  <h2>Paano Ginagamit ng Afarer ang Drop Stitch</h2>
  <p>Gumagamit ang Afarer ng 1,680 DTEX drop-stitch core sa buong linya ng SUP nito, na may 2 thread bawat square inch at 1.2 mm PVC na panlabas na laminate. Ang mga board ay rated sa 20 PSI at dumadaan sa 24–48 oras na pressure hold test sa 1.25x ng rated na presyon bago ipadala. Ang mga rail band ay hot-air welded na may triple-layer fusion, at ang mga pressure relief valve ay karaniwan sa lahat ng modelo.</p>


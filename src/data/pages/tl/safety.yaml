hero:
  tagline: 'Kaligtasan'
  title: 'Mga Pamantayan at Sertipikasyon sa Kaligtasan'
  subtitle: 'Bawat produkto ng afarer ay sumasailalim sa mahigpit na pagsusuri at tumutugon sa mga pandaigdigang pamantayan ng kaligtasan para sa recreational at propesyonal na paggamit.'

certifications:
  - title: 'CE Certification'
    description: 'Lahat ng kagamitang pangkaligtasan ng afarer ay sumusunod sa mga kinakailangan ng CE marking sa ilalim ng European Personal Protective Equipment Regulation (EU) 2016/425.'
  - title: 'Sertipikasyon ng ISO 12402'
    description: 'Ang mga life vest ay tumutugon sa mga pamantayan ng flotation ng ISO 12402. Ang Life Vest Classic ay nagbibigay ng 50N+ buoyancy; ang Life Vest Pro ay tumutugon sa mga kinakailangan ng SOLAS na may automatic na inflation.'
  - title: 'Pagsunod sa SOLAS'
    description: 'Ang Life Vest Pro ay sumusunod sa mga regulasyon ng SOLAS (Safety of Life at Sea) para sa offshore at komersyal na marine operation.'


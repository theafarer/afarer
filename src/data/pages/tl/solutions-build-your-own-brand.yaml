meta:
  title: 'Paggawa ng Private Label SUP at Paglulunsad ng Custom Brand | {SITE}'
  description: 'Tagagawa ng private label SUP para sa mga bagong brand ng paddle board. Ilunsad ang iyong sariling SUP brand sa Afarer — kumpletong serbisyong OEM/ODM kabilang ang disenyo, prototyping, custom branding, produksyon, at global na lohestika.'

hero:
  tagline: 'Buuin Ang Iyong Sariling Brand'
  title: 'Ilunsad Ang Iyong Sariling<br />SUP Brand'
  subtitle: 'Ikaw ang may pangitain. Kami ang may pabrika, kadalubhasaan, at supply chain. Paggawa ng private label SUP at pagbuo ng custom na SUP brand — magkasama, bubuuin namin ang isang brand na tatayo sa iba.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Custom na branded na SUP board sa tubig'

process:
  title: 'Ang Paglalakbay ng Iyong Brand'
  subtitle: 'Mula ideya hanggang market sa 5 yugto.'
  steps:
    - phase: 'Yugto 1'
      title: 'Ideya'
      period: 'Linggo 1-2'
      items:
        - 'Pananaliksik sa market at pagsusuri sa kakompetensya'
        - 'Pagtukoy sa target na customer'
        - 'Workshop sa pagpaposisyon ng brand'
        - 'Estratehiya sa linya ng produkto'
    - phase: 'Yugto 2'
      title: 'Disenyo'
      period: 'Linggo 3-6'
      items:
        - 'Hugis ng board at graphic design'
        - 'Pagtutugma ng kulay at pagpili ng materyal'
        - 'Espesipikasyon ng aksesorya'
        - 'Disenyo ng packaging at label'
    - phase: 'Yugto 3'
      title: 'Prototype'
      period: 'Linggo 7-10'
      items:
        - 'Produksyon ng sample'
        - 'Pagsubok sa kalidad (presyon, buoyancy, UV)'
        - 'Pagsasaayos ng disenyo'
        - 'Panghuling pag-apruba'
    - phase: 'Yugto 4'
      title: 'Produksyon'
      period: 'Linggo 11-14'
      items:
        - 'Bulk manufacturing'
        - 'QC inspection (kada unit)'
        - 'Kargang pandagat / kargang panghimpapawid'
        - 'Mga dokumento sa customs clearance'
    - phase: 'Yugto 5'
      title: 'Paglulunsad'
      period: 'Linggo 15-16'
      items:
        - 'Potograpiya ng produkto'
        - 'Product feed ng website'
        - 'Mga materyales sa marketing'
        - 'Suporta sa paglulunsad'

packages:
  title: 'Mga Startup Package'
  subtitle: 'Mga package na idinisenyo para sa bawat yugto ng paglaki ng brand.'
  items:
    - name: 'Starter Brand'
      tagline: '50-100 unit · 2 model ng board'
      features:
        - 'Pangunahing pag-print ng logo'
        - 'Karaniwang packaging'
        - 'Suporta sa email'
    - name: 'Lumalaking Brand'
      tagline: '300-1,000 unit · 3-5 model ng board'
      features:
        - 'Custom na kulay + logo'
        - 'Custom na packaging'
        - 'Litrato ng produkto'
        - 'Nakalaang manager'
    - name: 'Established na Brand'
      tagline: '1,000+ unit · Buong linya ng produkto'
      features:
        - 'Kumpletong customization'
        - 'Premium na packaging'
        - 'Mga materyales sa marketing'
        - 'Priyoridad sa produksyon'

features:
  title: 'Bakit Pinipili ng mga Brand ang Afarer'
  subtitle: '10+ taon ng karanasan sa OEM, kumpletong sertipikasyon, at pinakamababang MOQ sa industriya.'
  items:
    - title: '10+ Taon ng Karnasan sa OEM'
      description: '2,400+ hull na naihatid sa mga brand sa buong mundo.'
      icon: 'tabler:clock'
    - title: 'Kumpletong Sertipikasyon'
      description: 'CE / ISO / UKCA / BSCI / REACH — lahat sertipikado.'
      icon: 'tabler:certificate'
    - title: '30-Araw na Lead Time'
      description: 'Mas mabilis kaysa karaniwan sa industriya mula order hanggang shipment.'
      icon: 'tabler:truck-delivery'
    - title: 'Mababang MOQ'
      description: 'Mula 50 unit — pinakamababa sa industriya.'
      icon: 'tabler:package'
    - title: 'In-House na Disenyo'
      description: 'Kumpletong suporta sa disenyo mula konsepto hanggang panghuling artwork.'
      icon: 'tabler:palette'
    - title: 'Global na Lohestika'
      description: 'Sea freight, air freight, at suporta sa customs clearance.'
      icon: 'tabler:world'

cta:

meta:
  title: 'Manufacturer ng Inflatable SUP at OEM/ODM Partner — Afarer Water Sports | {SITE}'
  description: 'Ang Afarer ay isang manufacturer ng inflatable SUP at OEM/ODM partner sa Qingdao, Tsina — isang ISO 9001 certified na pabrika na nagdidisenyo ng mga performance inflatable paddle board para sa open water, touring, yoga, at adventure. Pressure-tested board bawat board, na may mga programang OEM/ODM, private-label, at distributor.'
  keywords:
    - 'inflatable sup na may mataas na performance'
    - 'premium na inflatable paddle board'
    - 'brand ng inflatable sup board'
    - 'touring inflatable sup'
    - 'co-branded paddle board'
    - 'country sup distributor'
    - 'manufacturer ng inflatable sup'
    - 'sup oem odm partner'
    - 'manufacturer ng private label paddle board'
hero:
  tagline: 'Manufacturer ng Inflatable SUP at OEM/ODM Partner'
  title: 'Umabot nang Mas Malayo.<br />Sumakay nang Mas Malakas.'
  subtitle: |
    Mga performance inflatable SUP na dinisenyo para sa open water, mahahabang araw,<br />
    at ang kalayaang maggalugad — stable kapag mahalaga,<br />
    rigid sa ilalim ng presyon, at handa sa patuloy na pagbabago ng tubig.
  taglineSection: 'Ini-engineer para sa kumpiyansa. Dinisenyo para tumayong naiiba.'
  actions:
    - variant: primary
      text: 'Tuklasin ang mga Board'
      href: /inflatable-sup/
      icon: tabler:waves
    - text: 'Hanapin ang Iyong Sasakyan'
      href: /size-guide/
      icon: tabler:compass
    - text: 'Bakit Afarer'
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: 'Inflatable SUP ng Afarer na dumadausdos sa bukas na tubig sa unang liwanag — itinayo para sa mahahabang araw at ang kalayaang maggalugad'

who_we_serve:
  tagline: 'Sumakay Kasama Namin'
  title: 'Ginawa Para sa Iyong Paraan ng Pagsakay'
  subtitle: 'Mula sa iyong unang sagwan hanggang sa iyong pinakamahabang ruta — at para sa mga club, resort, at retailer na nagpapatuloy sa pagpapagana sa mga tao.'
  items:
    - title: 'Mga First-Time at Recreational Rider'
      keywords: 'inflatable SUP para sa baguhan, all-around paddle board, matatag na SUP'
      description: 'Malawak at stable na all-around board na nagpapasidhi ng natural na pakiramdam sa iyong unang sagwan at nakasasabay habang umuunlad ka.'
      icon: tabler:users
      cta: 'Hanapin ang Iyong Unang Board'
      link: /all-around-sup/
    - title: 'Mga Touring at Adventure Paddler'
      keywords: 'touring SUP, paddle board para sa mahabang distansya, expedition SUP'
      description: 'Mas mahaba at mas makitid na board na itinayo upang dumiretso, dumausdos nang mas malayo, at magdala ng gamit para sa maraming araw na ruta.'
      icon: tabler:building
      cta: 'Tuklasin ang mga Touring Board'
      link: /touring-sup/
    - title: 'Mga Club, Resort at Rental'
      keywords: 'rental fleet ng SUP, kagamitan ng paddle club, mga water activity sa resort'
      description: 'Fleet-ready na inflatable SUP na may maaasahang tibay, madaling maintenance, at suporta sa replacement parts.'
      icon: tabler:shopping-cart
      cta: 'Bumuo ng Iyong Fleet'
      link: /solutions/
    - title: 'Mga Country Distributor at Co-Brand Partner'
      keywords: 'distributor ng SUP kada bansa, co-branded na SUP, private label na SUP'
      description: 'Eksklusibong pamamahagi bawat bansa at limitadong co-branded na koleksyon para sa mga kwalipikadong negosyo ng water sports.'
      icon: tabler:package
      cta: 'Maging Partner'
      link: /distributor-program/

proof_points:
  title: 'Sinubukan Higit Pa sa Showroom'
  subtitle: 'Disenyo, pagganap, at kalidad na mabeberipika mo — sa tubig at sa mga numero.'
  items:
    - metric: '10+'
      label: 'Taon ng Pagdidisenyo para sa Tubig'
      detail: 'Mula pa noong 2012, pinahuhusay board bawat board'
    - metric: '50+'
      label: 'Mga Bansa sa Tubig'
      detail: 'Mga paddler at partner sa buong mundo'
    - metric: '12–15'
      label: 'PSI Drop-Stitch Core'
      detail: 'Rigid kung saan mahalaga, madaling i-pack'
    - metric: '100%'
      label: 'Pressure-Tested Board Bawat Board'
      detail: 'Sinspeksyunan bago ipadala'

business_solutions:
  tagline: 'Bakit Iba ang Iyong Pagsakay'
  title: 'Pagganap na Maramdaman sa Unang Sagwan'
  subtitle: 'Apat na haligi na hinubog ng tunay na tubig — pagganap, disenyo, konstruksyon, at kalidad.'
  items:
    - title: 'Pagganap sa Tubig'
      description: 'Mga hugis na inakma para sa stability, glide, at kumpiyansa sa chop — upang bawat sagwan ay pakiramdam ay konektado sa tubig.'
      icon: tabler:shield-check
    - title: 'Malikhaing Disenyo'
      description: 'Mga koleksyong hinango mula sa daloy ng tubig, wildlife, at enerhiya ng dalampasigan — mga board na nais mong makita kang nakasakay.'
      icon: tabler:package
    - title: 'Napatunayang Konstruksyon'
      description: 'High-density drop-stitch core, pinalakas na rail, at fusion-laminated na seam na itinayo para sa paulit-ulit na paggamit.'
      icon: tabler:headset
    - title: 'Beripikadong Kalidad'
      description: 'Pressure-tested, visually inspected, at may malinaw na warranty at tumutugong after-sales support.'
      icon: tabler:truck-delivery

oem_section:
  tagline: 'OEM / ODM at Co-Brand Manufacturing'
  title: 'Mula Idea hanggang Tubig — Mga Co-Branded Edition'
  subtitle: 'Para sa mga partner na nais higit pa sa catalog product: OEM/ODM manufacturing at limitadong co-branded na koleksyon na idinisenyo, ini-engineer, at itinayo kasama ang Afarer — habang bawat board ay nananatiling produkto ng Afarer.'
  steps:
    - number: '01'
      title: 'Idea at Brief'
      desc: 'Ibahagi ang iyong bisyon, target rider, at ang tubig na dinidisenyo mo.'
    - number: '02'
      title: 'Disenyo at Engineering'
      desc: '3D modeling, pagpili ng materyales, at natatanging graphic design.'
    - number: '03'
      title: 'Prototype at Validate'
      desc: 'Sample board na pressure-tested at ride-validated bago ka nakompromiso.'
    - number: '04'
      title: 'Pagtatayo sa Malaking Sukat'
      desc: 'Pare-pareho at sinspeksyunang produksyon na may quality checkpoint sa bawat yugto.'
    - number: '05'
      title: 'Pandaigdigang Paghahatid'
      desc: 'Logistics mula Qingdao hanggang sa mga pangunahing daungan na may suporta sa customs.'
  cta: 'Tuklasin ang Co-Branding'
  cta_link: /co-brand/

cta:
  title: 'Hanapin ang iyong susunod na sasakyan.'
  subtitle: "Manapa't kinukuha mo ang iyong unang sagwan, nag-e-equip ng club, o bumubuo ng board brand — maaalalayan ka naming makabalik sa tubig."
  actions:
    - variant: primary
      text: 'Tuklasin ang Koleksyon'
      href: /inflatable-sup/
      icon: tabler:send
    - text: 'Humiling ng Catalog'
      href: /resources/download-catalog/

distributor:
  tagline: 'Country Exclusive Distributor'
  title: 'Isang Bansa. Isang Opisyal na Distributor ng Afarer.'
  subtitle: 'Isang programang isang-bansa-isang-distributor na may territory exclusivity, dealer pricing, marketing support, at nakalaang Distributor Success Program.'
  benefits:
    - title: 'Territory Exclusivity'
      description: 'Isang awtorisadong distributor bawat bansa o rehiyon — walang panloob na kumpetisyon, walang channel conflict.'
    - title: 'Margin Mula Direkta sa Pabrika'
      description: 'Mga price list ng distributor at taunang rebate sa nakompromisong volume, na ipinapadala FOB Qingdao.'
    - title: 'Marketing at Training Support'
      description: 'Mga co-branded asset, dealer POS material, product training, at launch campaign.'
    - title: 'Nakalaang Account Team'
      description: 'Isang personal na distributor manager pati na rin onboarding, forecasting, at reorder support.'
  actions:
    - variant: primary
      text: 'Maging Distributor'
      href: /distributor-program/
    - text: 'Humiling ng Dealer Price List'
      href: /contact/?subject=Dealer Price List
    - text: 'Mag-apply para sa Country Partnership'
      href: /contact/?subject=Country Partnership Application
    - text: 'I-download ang Distributor Program'
      href: /distributor-program/
  note: 'Minimum na unang order na 100–300 unit para sa Country/Regional Distributor. Trial order mula 10–30 unit.'

meta:
  title: Mga Inflatable Paddle Board ng Afarer | Magpunta nang Mas Malayo. Mas Malakas na Paddle.
  description: Tuklasin ang mga inflatable paddle board ng Afarer para sa all-around paddling, touring, yoga, pangingisda, at mga outdoor adventure. Hanapin ang perpektong SUP mo at tuklasin ang higit pa sa tubig.
  keywords:
    - inflatable paddle board
    - inflatable sup
    - all around sup
    - touring sup
    - yoga sup
    - fishing sup
    - family paddle board
    - portable paddle board
hero:
  tagline: Mga Inflatable Paddle Board
  title: Mga Inflatable Paddle Board para sa Bawat Adventure
  slogan: Magpunta nang Mas Malayo. Mas Malakas na Paddle.
  subtitle: Tuklasin ang kalayaan ng pag-paddle kasama ang Afarer. Galugarin ang mga maingat na dinisenyong inflatable SUP para sa mga relaxing na araw sa lawa, mga coastal adventure, fitness, at lahat ng nasa pagitan.
  taglineSection: Binuo para sa kumpiyansa. Dinisenyo para tumayo.
  actions:
    - variant: primary
      text: Hanapin ang Board Mo
      href: /size-guide/
      icon: tabler:compass
    - text: Galugarin ang mga SUP

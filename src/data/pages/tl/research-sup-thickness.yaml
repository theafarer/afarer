content_html: |
  <h2>Ang Tatlong Karaniwang Kapal</h2>

  <h3>4" (10 cm) – Touring at Pagganap</h3>
  <ul>
    <li>Pinakamataas na rigidity – mas kaunting flex sa ilalim ng karga</li>
    <li>Pinakamagaan – mas kaunting materyales, mas kaunting volume ng hangin</li>
    <li>Magaling na tracking – nabawasang pag-uga gilid-gilid</li>
    <li>Pinakamabilis – nabawasang drag, mas madaling glide</li>
    <li>Pinakamahusay para sa: Touring, racing, fitness paddling, bihasang paddler</li>
  </ul>

  <h3>5" (12.7 cm) – All-Around</h3>
  <ul>
    <li>Magandang rigidity – balansehang ratio ng flex-to-stiffness</li>
    <li>Katamtamang timbang – karaniwang paggamit ng materyales</li>
    <li>Magandang primary + secondary stability</li>
    <li>Pinakamahusay para sa: Recreational na pagkakayak, mga baguhan, kaswal na paggamit sa lawa at ilog</li>
  </ul>

  <h3>6" (15.2 cm) – Stability at Yoga</h3>
  <ul>
    <li>Pinakamataas na primary stability – malaking buoyancy</li>
    <li>Pinakamabigat – mas maraming PVC material, mas malaking volume ng hangin</li>
    <li>Pinakamabagal – mas maraming drag, mas mahirap panatilihin ang glide</li>
    <li>Pinakamahusay para sa: Yoga/fitness, mabibigat na paddler (100+ kg), napaka-choppy na kondisyon</li>
  </ul>

  <h2>Pagsusuri sa Engineering</h2>
  <p>Ang tigas ng isang inflatable SUP ay napapatakbo ng panloob na presyon ng hangin at moment of inertia ng cross-section ng board. Sa 20 PSI, ang isang 4" na board ay nagpapakita ng humigit-kumulang 30% na mas kaunting deflection sa ilalim ng karga kaysa isang 6" na board na may parehong lapad at haba. Ang primary stability ay nagmumula sa lapad ng waterline at buoyancy; ang secondary stability ay naiimpluwensiyahan ng hugis ng rail at lapad ng board.</p>

  <h2>Kapal Ayon sa Timbang ng Paddler</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Timbang ng Paddler</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Inirerekomendang Kapal</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Mas mababa sa 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" o 6"</td></tr>
      <tr><td class="p-3 border">Higit sa 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Trade-off ng Kapal laban sa PSI</h2>
  <p>Isang karaniwang maling akala ay na kayang mapabuti ng mas mataas na PSI ang labis na kapal. Sa 25 PSI, ang isang 6" na board ay nagpapakita ng mas maraming flex kaysa isang 4" na board sa 15 PSI dahil ang geometric moment of inertia ang nananaig sa ekwasyon ng tigas. Para sa mga paddler na nakatuon sa pagganap, ang mas manipis na board sa mas mababang presyon ay higit na tumatalo sa mas makapal na board sa mas mataas na presyon.</p>

  <h2>Linya ng Afarer</h2>
  <ul>
    <li><strong>Mga 4" board:</strong> Cheetah Touring series – 12' x 30" x 4" na touring SUP para sa fitness at pagkakayak sa malayo</li>
    <li><strong>Mga 5" board:</strong> Cheetah All-Round series – 10'6" x 32" x 5" para sa recreational na paggamit</li>
    <li><strong>Mga 6" board:</strong> Cheetah Ultra-Stable series – 10' x 34" x 6" para sa yoga, malalaking paddler, at platform ng potograpiya</li>
  </ul>
  <p>Lahat ng board ay gumagamit ng 1,680 DTEX drop-stitch core na may 20 PSI na rated na presyon at 1.2 mm PVC laminate.</p>


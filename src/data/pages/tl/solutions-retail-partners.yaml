meta:
  title: 'Wholesale ng SUP at Retail Partner Program | {SITE}'
  description: 'Wholesale partner program ng SUP para sa mga retailer at tindahan ng sporting goods. Buong linya ng produkto, mga opsyon sa dropshipping, mapagkumpitensyang wholesale margin mula 20–35%, at mababang MOQ para magsimula.'

hero:
  tagline: 'Mga Retail Partner'
  title: 'Magbenta ng Premium na Inflatable SUP<br />Na May Gumaganang Margin'
  subtitle: 'Maging retail partner ng Afarer — dalhin ang pinakamabilis na lumalagong SUP brand sa iyong merkado na may buong wholesale pricing, dropshipping, propesyonal na marketing material, at nakalaang suporta.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Mga SUP board ng Afarer na nakadisplay sa isang retail store'

margin_section:
  title: 'Retail Margin at MOQ'
  subtitle: 'Mga antas ng wholesale pricing na dinisenyo para sa pagiging kumikita ng retail.'
  items:
    - tier: 'Basic Partner'
      discount: '20%'
      moq: '500 unit/taon'
      margin_note: '~150–250 USD na tubo bawat board'
      features:
        - 'Daan sa buong linya ng produkto'
        - 'Package ng marketing material'
        - 'Suporta sa email'
        - 'Daan sa product catalog'
    - tier: 'Premium Partner'
      discount: '30%'
      moq: '2,000+ unit/taon'
      margin_note: '~250–400 USD na tubo bawat board'
      features:
        - 'Nakalaang account manager'
        - 'Proteksyon ng eksklusibong teritoryo'
        - 'Custom na marketing support'
        - 'Unang daan sa mga bagong produkto'
        - 'Session ng training para sa kawani'
    - tier: 'Flagship Partner'
      discount: '35%+'
      moq: '5,000+ unit/taon'
      margin_note: '~350–500+ USD na tubo bawat board'
      features:
        - 'Mga co-branded na marketing campaign'
        - 'Suporta sa display sa loob ng tindahan'
        - 'Training ng kawani sa lokasyon'
        - 'Sabay na promosyon sa social media'
        - 'Priyoridad sa alokasyon ng produksyon'

product_line:
  title: 'Kumpletong Linya ng Produkto'
  subtitle: 'May SUP board para sa bawat customer na pumasok sa iyong pinto.'
  items:
    - name: 'All-Round Series'
      description: 'Pinakamabenta — akma sa 80% ng mga customer'
    - name: 'Touring Series'
      description: 'Mga performance paddler — mas mataas na margin'
    - name: 'Yoga Series'
      description: 'Niche na merkado — premium na presyo'
    - name: 'Kids Series'
      description: 'Mga customer na pamilya — paulit-ulit na mamimili'
    - name: 'Racing Series'
      description: 'Merkado ng mga entusiasta — brand halo'
    - name: 'Mga Accessory'
      description: 'Mataas na margin na karagdagan (sagwan, vest, pump, bag)'

catalog:
  title: 'Mga Resource ng Retail Partner'
  subtitle: 'I-download ang aming komprehensibong retail partner kit.'
  items:
    - name: '2026 Product Catalog'
      desc: 'Buong linya na may specs, presyo, at impormasyon sa pag-order'
      icon: 'tabler:file-text'
      link: '/resources/download-catalog'
    - name: 'Gabay sa Retail Partner'
      desc: 'Margin calculator, mga tip sa merchandising, at mga best practice'
      icon: 'tabler:book'
      link: '/resources/download-catalog'
    - name: 'Marketing Asset Pack'
      desc: 'Hi-res na larawan ng produkto, lifestyle image, at POS material'
      icon: 'tabler:photo'
      link: '/media'

support:
  title: 'Suporta sa Retail Partner'
  subtitle: 'Lahat ng kailangan mo upang magbenta nang may kumpiyansa.'
  items:
    - 'High-res na larawan ng produkto (propesyonal na potograpiya)'
    - 'Mga lifestyle photo para sa social media, website, at catalog'
    - 'Mga marketing material — poster, shelf talker, banner'
    - 'Mga video ng product training para sa edukasyon ng kawani'
    - 'Content pack para sa social media (lingguhang post)'
    - 'SEO-optimized na paglalarawan ng produkto'
    - 'Available ang opsyon sa dropshipping — walang panganib sa imbentaryo'
    - 'Net 30 payment terms'

cta:
  title: 'Handa ka na bang maging retail partner ng Afarer?'
  subtitle: 'Mag-apply para sa partnership o i-download ang aming retail catalog upang magsimula.'
  actions:
    - text: 'Mag-apply para sa Partnership'
      href: '/contact?partner=retail'
      variant: 'primary'
    - text: 'I-download ang Retail Catalog'
      href: '/resources/download-catalog'
      variant: 'secondary'

meta:
  title: 'Custom Lab — Mga Custom na Inflatable Paddle Board | {SITE}'
  description: 'Mga custom na inflatable paddle board: bespoke na disenyo, logo, custom mold, at produksyon. Partner sa private-label SUP, MOQ 50 unit, CE certified.'
  keywords:
    - 'manufacturer ng custom na paddle board'
    - 'custom inflatable sup'
    - 'paddle board with logo'
    - 'private label na inflatable sup'
    - 'pagmamanupaktura ng paddle board'
hero:
  tagline: 'afarer Custom Lab'
  title: 'Idisenyo Ang Iyong Sariling<br />SUP Board'
  subtitle: 'Custom na partner sa SUP na nag-aalok ng co-brand, private label, at bespoke na produksyon ng paddle board para sa mga negosyo sa buong mundo. Mula iisang prototype hanggang buong production run.'
  cta: 'Simulan ang iyong proyekto'
  footer_link: /contact/

steps_section:
  tagline: 'Paano ito gumagana'
  title: 'Mula konsepto hanggang produksyon'
  subtitle: 'Apat na hakbang mula sa iyong ideya hanggang sa tapos na produktong handa sa dagat.'
  steps:
    - num: '01'
      title: 'Piliin ang Iyong Board'
      desc: 'Pumili mula sa aming mga pangunahing model ng SUP — all-around, touring, yoga, sport, o pambata. Piliin ang laki, materyal, at kulay.'
    - num: '02'
      title: 'I-upload ang Iyong Disenyo'
      desc: 'Ipadala sa amin ang iyong logo, artwork, o brand guidelines. Hahanda ang aming design team ng digital na proof.'
    - num: '03'
      title: 'Pagsusuri sa AI Mockup'
      desc: 'Tingnan ang photorealistic na AI-generated na mockup ng iyong custom na board bago magsimula ang produksyon.'
    - num: '04'
      title: 'Produksyon at Delivery'
      desc: 'Kapag naaprubahan, papasok ang iyong order sa aming production line. Lead time mula 30 araw.'

services_section:
  tagline: 'Mga Serbisyo'
  title: 'Mga serbisyo sa paggawa para sa mga global na brand'
  subtitle: 'Maluluwag na modelo ng pakikipagtulungan — mula sa kontratang paggawa hanggang sa buong serbisyong pagbuo ng brand.'
  items:
    - title: 'Produksyong Co-Brand'
      desc: 'Ginagawa namin ang iyong mga disenyo ayon sa spec — ang iyong IP, ang iyong mga guhit, ang iyong mga pamantayan sa kalidad. Kumpletong proteksyon ng NDA.'
      icon: '⚙️'
    - title: 'Mga Solusyon sa Disenyo'
      desc: 'Pumili mula sa 50+ napatunayang platform at i-customize ang laki, kulay, graphics, at packaging.'
      icon: '🎨'
    - title: 'Private Label'
      desc: 'Ang iyong brand sa aming mga produkto — logo, packaging, hang tag, manual. Handa na para sa retail paglabas ng kahon.'
      icon: '🎨'
    - title: 'Custom Branding'
      desc: 'Pag-print ng deck pad, graphics ng hull, decal ng tube, at custom na label — buong integrasyon ng brand.'
      icon: '⚙️'

capabilities_section:
  tagline: 'Mga Kakayahan'
  title: 'Mga kakayahan sa produksyon at customization'
  subtitle: 'Lahat ng kailangan mong malaman bago maglagay ng order.'
  capabilities:
    - label: 'Dami ng order'
      value: 'MOQ 50 unit (SUP)'
    - label: 'Lead time'
      value: '30–45 araw na karaniwan; 15–20 araw para sa mga prototype'
    - label: 'Customization'
      value: 'Laki, hugis, kulay, graphics, packaging, hardware'
    - label: 'Mga Materyal'
      value: 'PVC, drop-stitch, EVA, aluminium'
    - label: 'Pag-print'
      value: 'Digital (CMYK), pag-print gamit ang screen, paglilipat ng init, sublimasyon'
    - label: 'Sertipikasyon'
      value: 'CE, UKCA, FCC (suporta para sa global na pagsunod)'

why_section:
  tagline: 'Bakit afarer'
  title: 'Isang pabrika. Isang pamantayan. Walang kompormiso.'
  points:
    - text: 'Pinagsamang pasilidad ng paggawa na 12,000 m²'
      highlight: '12,000 m²'
    - text: '200+ bihasang manggagawa at engineer'
      highlight: '200+'
    - text: '15,000+ SUP board na nagagawa taun-taon'
      highlight: '15,000+'
    - text: 'Quality management na sertipikado sa ISO 9001'
      highlight: 'ISO 9001'
    - text: 'Mga produktong CE certified para sa EU market'
      highlight: 'CE'
  cta: 'Tingnan ang mga detalye ng pabrika'
  cta_link: /factory/
  contact:
    title: 'Handa nang talakayin ang iyong proyekto?'
    desc: 'Tumutugon ang aming team sa loob ng 24 oras na may paunang quote.'

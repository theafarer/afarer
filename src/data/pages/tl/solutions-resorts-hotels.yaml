meta:
  title: 'Tagapagtustos ng Kagamitang SUP para sa Resort at Hotel | mga Solusyon sa Resort Fleet | {SITE}'
  description: 'Tagapagtustos ng kagamitang SUP para sa mga hotel at resort sa buong mundo. Mga fleet ng komersyal na antas na inflatable SUP, custom branding, pagsasanay ng tauhan, at mga package na na-optimize sa ROI mula 20 hanggang 100+ board.'

hero:
  tagline: 'Mga Resort at Hotel'
  title: 'Gawing Sentro ng Kita ang Iyong Tabing-Dagat<br />Sa Mga Premium na SUP Fleet'
  subtitle: 'Sinusuplayan ng Afarer ang mga resort sa buong mundo ng mga fleet ng komersyal na antas na inflatable SUP — mula sa starter package na 20 board hanggang sa flagship program na 100+ board. Kasama ang custom branding, pagsasanay ng tauhan, at mga piyesang pamalit.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: 'Mga bisita ng resort na nag-e-enjoy sa SUP boarding sa malinis na beach'

roi_section:
  title: 'Modelo ng Kita sa SUP ng Resort'
  subtitle: 'Kung paano bumubuo ang mga resort ng 50,000 USD - 200,000+ USD na taunang kita sa SUP rental sa iisang pamumuhunan lamang.'
  metrics:
    - metric: '50K–200K+ USD'
      label: 'Taunang Kita sa SUP'
      detail: 'Kada resort, batay sa laki ng fleet at occupancy'
    - metric: '4–6 Buwan'
      label: 'Karaniwang Panahon ng Pagbabayad'
      detail: 'Mababawi ang buong pamumuhunan sa fleet sa loob ng isang season'
    - metric: '40%'
      label: 'Pagtaas ng Kita'
      detail: 'Karaniwang dagdag pagkatapos lumipat sa mga fleet ng Afarer'
    - metric: '500+'
      label: 'Mga Siklo ng Rental Kada Board'
      detail: 'Tibay na antas-komersyal para sa araw-araw na paggamit'

packages:
  title: 'Sistema ng Package para sa Resort'
  subtitle: 'Piliin ang package na angkop sa kapasidad ng iyong bisita at layunin ng kita. Lahat ng package ay may 12-buwang warranty at CE certification.'
  items:
    - name: 'Starter Package'
      tagline: 'Para sa mga boutique resort, hanggang 20 bisita/araw'
      features:
        - '20 SUP board (3 laki para sa matanda/bata)'
        - '20 paddle (adjustable) + 20 life vest'
        - '4 dual-action pump (opsyonal ang electric)'
        - '2 storage rack + repair kit'
        - 'Custom na pag-print ng logo sa mga board'
        - '12-buwang warranty + CE certified'
      revenue: '50,000–80,000 USD na potensyal na taunang kita'
      cta_text: 'Kunin ang Starter Package'
    - name: 'Premium Package'
      tagline: 'Para sa malalaking resort, 50-100 bisita/araw'
      features:
        - '50 SUP board (5 laki, halo-halong fleet)'
        - '50 paddle + 50 life vest'
        - '10 dual-action pump + 2 electric pump'
        - '5 storage rack + 2 roller cart'
        - 'Kumpletong custom branding (mga board, paddle, bag)'
        - 'Session ng pagsasanay ng tauhan (online)'
        - 'Pagpapadala ng piyesang pamalit sa loob ng 48 oras'
        - '12-buwang warranty + CE certified'
      revenue: '120,000–200,000+ USD na potensyal na taunang kita'
      popular: true
      cta_text: 'Kunin ang Premium Package'
    - name: 'Flagship Package'
      tagline: 'Para sa mga ultra-premium resort, 100+ bisita/araw'
      features:
        - '100+ SUP board (kumpletong saklaw ng laki)'
        - 'Kumpletong set ng aksesorya (mga paddle, vest, pump, cart)'
        - 'Pagsasanay ng tauhan sa site (2 araw)'
        - 'Nakalaang account manager'
        - 'Priyoridad sa piyesang pamalit (pagpapadala sa 24 oras)'
        - 'Kumpletong custom branding (mga board + aksesorya)'
        - 'Package ng marketing photo/video'
        - '24-buwang warranty + CE certified'
      revenue: '200,000+ USD na potensyal na taunang kita'
      cta_text: 'Kunin ang Flagship Package'

case_study:
  quote: 'Mula nang lumipat sa Afarer, tumaas ng 40% ang aming kita sa SUP rental. Bumaba ng 60% ang gastos sa pagpapalit ng board. Nabawi namin ang buong pamumuhunan sa fleet sa loob ng 4 buwan.'
  author: 'Manager ng mga Aktibidad sa Tubig'
  location: '5-star resort, Maldives'
  results:
    - label: 'Paglago ng Kita'
      value: '+40%'
    - label: 'Pagbaba ng Gastos'
      value: '-60%'
    - label: 'Panahon ng Pagbabayad'
      value: '4 Buwan'

features:
  title: 'Bakit Pinipili ng mga Resort ang Afarer'
  subtitle: 'Tibay na antas-komersyal, global na lohestika, at partner na tumutugon sa pangangailangan ng hospitality.'
  items:
    - title: '500+ Siklo ng Rental'
      description: 'Ang bawat board ay sinusubok na makaligtas sa 500+ siklo ng rental sa tubig-alat, araw, at buhangin.'
      icon: 'tabler:shield-check'
    - title: 'Pagpapadala ng Piyesa sa 48 Oras'
      description: 'Ang mga piyesang pamalit ay ipinapadala sa loob ng 48 oras — hindi titigil ang iyong kita sa rental.'
      icon: 'tabler:truck-delivery'
    - title: 'Custom Branding'
      description: 'Itugma ang pagkakakilanlan ng iyong resort gamit ang custom na kulay at logo sa bawat board.'
      icon: 'tabler:palette'
    - title: 'Pagsasanay ng Tauhan'
      description: 'Mga programang pagsasanay na online at on-site para sa iyong team ng aktibidad.'
      icon: 'tabler:school'
    - title: 'Global na Lohestika'
      description: 'Pagpapadala sa 50+ bansa na may mga opsyon sa consolidated freight.'
      icon: 'tabler:world'
    - title: 'CE Certified'
      description: 'Lahat ng kagamitan ay CE certified, ISO 9001:2015 — garantiya sa kaligtasan at kalidad.'
      icon: 'tabler:certificate'

cta:
  title: 'Handa nang gawing sentro ng kita ang iyong tabing-dagat?'
  subtitle: 'Kunin ang quote ng iyong resort package o i-download ang aming kumpletong katalogo ng resort.'
  actions:
    - text: 'Kunin ang Resort Package'
      href: '/contact/?package=resort'
      variant: 'primary'
    - text: 'I-download ang Resort Catalog'
      href: '/resources/download-catalog/'
      variant: 'secondary'

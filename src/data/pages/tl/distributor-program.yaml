faqs:
  title: 'Partnership ng Bansa — FAQ'
  subtitle: 'Mga tanong ng mga seryosong country partner bago mag-apply.'
  items:
    - title: 'Ano talaga ang ibig sabihin ng isang-bansa-isang-distributor?'
      description: "Nagtatalaga ang Afarer ng iisang awtorisadong distributor na may eksklusibong karapatan sa isang tinukoy na teritoryo. Hindi kami nagbebenta mula sa aming global o regional channel papasok sa isang protektadong bansa. Ang iyong pagmamay-ari ng teritoryo ay tumatagal hangga't natutugunan ang Distribution Agreement."
    - title: 'Eksklusibo ba ang teritoryo magpakailanman?'
      description: 'Hindi. Ang eksklusibidad ay may kundisyon, hindi permanente. Ito ay pinapanatili sa pamamagitan ng napirmahang Distribution Agreement, pagkumpleto ng iyong unang order, taunang target ng pagbili, lokal na stock, kakayahang after-sales, at patuloy na pamumuhunan sa market. Kung hindi natutugunan ang mga ito, maaaring muling pag-usapan o muling italaga ang teritoryo.'
    - title: 'Ano ang pinakamababang unang order?'
      description: 'Ang mga country at regional distributor ay nagsisimula sa 100–300 unit; ang mga awtorisadong dealer sa 30–50 unit; ang mga trial order mula 10–30 unit ay nagpapahintulot sa iyo na unang patunayan ang market (walang proteksyon sa teritoryo ang mga trial at sample order). Ang mga custom at private-label na programa ay sumusunod sa hiwalay na MOQ na nakalista sa mga antas sa itaas.'
    - title: 'Anong suporta ang kasama sa 10-module na support program?'
      description: 'Mga antas at kwalipikasyon, proteksyon sa teritoryo, MOQ / presyo / taunang rebate, imbentaryo at pagpapatupad ng order, marketing asset at joint market funds, training sa produkto / benta / teknikal, spare parts at after-sales, pagpaparehistro ng warranty, partner portal, at mga product datasheet, library ng marketing asset, iskedyul ng taunang rebate, at shipping at packing list.'
    - title: 'Paano ako pinoprotektahan ng Afarer laban sa channel conflict?'
      description: 'Ang bawat teritoryo ay may eksaktong isang awtorisadong distributor. Ang mga inquiry at direktang order mula sa iyong rehiyon ay dumadaan sa iyo, ipinapasa ang mga form sa website patungo sa lokal na partner kung mayroon, at ang global team ay umaakyat lamang ng isyu kapag ang isang partner ay hindi tumutugon.'
    - title: 'Ano ang mga tuntunin sa pagpapadala at pagbabayad?'
      description: 'Ang mga order ay ipinapadala nang FOB Qingdao na may kumpletong export documentation. Ang mga production order ay 30% deposito na may 70% bago mag-shipment; ang mga trial at sample order ay prepaid. Ang karaniwang lead time ay 30–45 working days, na may 15–20 working days para sa mga sample run.'
    - title: 'Paano ako mag-a-apply?'
      description: 'Ipadala ang iyong aplikasyon sa pamamagitan ng contact form na may detalye ng market. Sinusuri namin ang angkop ng market, presensya sa retail, at kakayahang logistics, pagkatapos ay tumutugon kami sa loob ng 3 business day na may mga susunod na hakbang at halimbawa ng Distribution Agreement.'

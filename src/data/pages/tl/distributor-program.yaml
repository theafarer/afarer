features:
  title: 'Bakit Mag-partner sa Afarer'
  subtitle: 'Modelong isang-bansa-isang-distributor na may estruktura ng suporta para kumita ang teritoryo. Ang eksklusibidad ay pinaghihirapan at pinapanatili — hindi itong permanente na karapatan.'
  columns: 3
  items:
    - title: 'Eksklusibidad ng Teritoryo'
      description: 'Isang awtorisadong distributor kada bansa o rehiyon. Walang parallel import, walang panloob na kompetisyon. Ang iyong pamumuhunan ay nagtatatag ng iyong sariling depensa.'
      icon: 'tabler:shield-check'
    - title: 'Proteksyon laban sa Channel Conflict'
      description: 'Ang mga direktang order mula sa iyong rehiyon ay dumadaan sa iyo, at ang pagpepresyo ay nagpoprotekta sa iyong margin. Hindi nagbebenta ang Afarer sa paligid ng mga country partner nito.'
      icon: 'tabler:users'
    - title: 'Direct-Factory na Margin at Rebate'
      description: 'Dealer price list na may rebate sa mga napirmahang volume. Walang middleman. FOB Qingdao shipping na may kumpletong export documentation.'
      icon: 'tabler:coins'
    - title: '10-Module na Programa ng Suporta sa Partner'
      description: 'Onboarding, go-to-market, training, marketing at joint market funding, spare parts at after-sales, warranty, mga tool sa pag-order, at partner portal — lahat ay nakasama sa iyong Distribution Agreement.'
      icon: 'tabler:rocket'
    - title: 'Marketing at Joint Market Funds'
      description: 'Localized na campaign asset, POS material para sa dealer, event kit, digital na nilalaman sa maraming wika, at co-marketing support para sa mga season ng paglulunsad.'
      icon: 'tabler:mood-smile'
    - title: 'Training sa Produkto, Benta at Teknikal'
      description: 'Istrukturadong session ng onboarding tungkol sa produkto, benta, at teknikal na kaalaman, na may na-update na materyales habang lumalawak ang linya.'
      icon: 'tabler:presentation'
    - title: 'Suporta sa Spare Parts at After-Sales'
      description: 'Suplay ng spare parts, pagpaparehistro ng warranty at paghawak ng claim, at mga product datasheet at manual para sa iyong lokal na service team.'
      icon: 'tabler:settings'
    - title: 'Nakalaang Account Manager at Partner Portal'
      description: 'Personal na distributor manager kasama ang access sa mga price list, status ng order, at mga marketing resource sa pamamagitan ng Afarer partner portal.'
      icon: 'tabler:user-check'

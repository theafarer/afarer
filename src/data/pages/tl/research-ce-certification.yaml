content_html: |
  <h2>Ano ang CE Certification?</h2>
  <p>Ang CE marking (Conformit&eacute; Europ&eacute;enne) ay nagpapahiwatig na ang isang produkto ay tumutugon sa mga kinakailangan ng EU sa kalusugan, kaligtasan, at kapaligiran. Para sa mga inflatable watercraft, ang kaugnay na regulatory framework ay nakasalalay sa kategorya ng produkto.</p>

  <h2>Mga Naaangkop na Direktiba</h2>

  <h3>Recreational Craft Directive (2013/53/EU)</h3>
  <p>Ang pangunahing direktiba para sa mga recreational craft sa EU. Ang mga inflatable SUP na mas maikli sa 2.4 m ay nasa labas ng saklaw nito at sa halip ay sertipikado sa ilalim ng EN ISO 25649.</p>

  <h3>Personal Protective Equipment Regulation (2016/425)</h3>
  <p>Ang mga life jacket, buoyancy aid, at kagamitang pangkaligtasan na kasama sa watercraft ay dapat tumugon sa mga kinakailangan ng PPE Regulation, kabilang ang type examination (Module B) ng isang notified body at production quality assurance (Module D o E).</p>

  <h2>Ang Proseso ng Sertipikasyon</h2>
  <ol>
    <li>Pag-uuri ng produkto: Tukuyin ang design category ng craft (A – D ayon sa ISO 8666)</li>
    <li>Mga naaangkop na pamantayan: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (builder's plate)</li>
    <li>Paghahanda ng technical file: Mga drawing ng disenyo, Bill of Materials, sertipiko ng materyales, risk assessment</li>
    <li>Type testing: Buoyancy, stability, load capacity, pagsusuri ng materyales, lakas ng seam, air retention</li>
    <li>Factory production control: Audit ng notified body sa mga proseso ng pagmamanupaktura</li>
    <li>Declaration of Conformity: Pinipirmahan ng manufacturer ang DoC, inilalagay ang CE marking</li>
  </ol>

  <h2>Mga Notified Body para sa mga Inflatable Watercraft</h2>
  <p>Kabilang sa mga karaniwang NB ang Bureau Veritas (France), DNV GL (Germany), RINA (Italy), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Germany).</p>

  <h2>Timeline at Gastos</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Yugto</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tagal</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Karaniwang Gastos (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Paghahanda ng technical file</td><td class="p-3 border">2 – 4 linggo</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Type testing</td><td class="p-3 border">4 – 8 linggo</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Factory audit</td><td class="p-3 border">1 – 2 araw (on-site)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Kabuuan (unang produkto)</td><td class="p-3 border">8 – 14 linggo</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Ano ang Ibig Sabihin Nito para sa mga Mamimili</h2>
  <p>Sa pagbili ng mga CE-certified na inflatable SUP, laging beripikahin na ang CE marking ay nasa builder's plate, mayroong wastong DoC, nakalista ang numero ng Notified Body, at ang manual ng may-ari ay may mga tagubilin sa kaligtasan sa iyong lokal na wika. Ang lahat ng produkto ng Afarer ay may dalang CE certification na may buong traceability sa mga audit report ng notified body.</p>


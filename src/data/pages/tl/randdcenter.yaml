capabilities:
  tagline: 'Mga Kakayahan'
  title: 'Mga Kakayahan sa R&D'
  subtitle: 'Apat na pangunahing disiplina na nagbibigay sa amin ng buong kontrol sa pag-develop ng produkto — mula sa pananaliksik sa hilaw na materyal hanggang sa huling sertipikasyon.'
  groups:
    - title: 'Agham ng Materyal at Teknolohiya ng Fabric'
      items:
        - 'Pagsusuri at optimisasyon ng formula ng PVC'
        - 'UV stabilisation, flame retardancy, at pag-develop ng anti-microbial na additive'
        - 'Multi-layer na lamination ng fabric at adhesion engineering'
        - 'Pinabilis na pagsubok sa pagtanda (UV, thermal, halumigmig, salt spray)'
    - title: 'Hull Engineering at Hydrodynamics'
      items:
        - 'Parametric na 3D hull design at CFD optimisation'
        - 'Finite element analysis para sa istruktural at impact load'
        - 'Scale-model na towing tank testing at pagpapatunay ng performance'
        - 'Custom na pag-develop ng hull para sa espesyal na misyon'
    - title: 'Teknolohiya ng Welding at Pagdudugtong'
      items:
        - 'Pag-develop at optimisasyon ng proseso ng RF dielectric welding'
        - 'Mga paraan ng hot-air, hot-wedge, at ultrasonic welding'
        - 'Adhesive bonding at kwalipikasyon ng seam tape'
        - 'Pagmomodelo ng lakas ng weld at hula ng buhay nito'
    - title: 'Pagsubok, Sertipikasyon at Pagsunod'
      items:
        - 'Quality management at CE compliance testing'
        - 'Malayang third-party testing at suporta sa sertipikasyon'
        - 'Pag-develop ng custom na test protocol para sa kwalipikasyon sa procurement'
        - 'Pagsusuri sa pagkabigo habang ginagamit at imbestigasyon ng pinagmulan'


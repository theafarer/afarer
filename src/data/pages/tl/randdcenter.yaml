pillars:
  - title: 'Pag-unlad sa Teknolohiya'
    desc: 'Nangunguna sa mga bagong materyal, disenyo, at proseso ng paggawa upang makahatid ng pinakamahusay na performance at tagal ng buhay ng produkto.'
    icon: tech
  - title: 'Mga Advanced na Materyal'
    desc: 'Pagsisiyasat sa mga cutting-edge na PVC, composite, at susteynable na alternatibo para sa pinahusay na katangian ng produkto.'
    icon: materials
  - title: 'Susteynabilidad'
    desc: 'Isang Pangunahing Komitment: Nakatuon kami sa pangangalaga sa kapaligiran sa pamamagitan ng susteynable na paggawa at mga materyal na nare-recycle.'

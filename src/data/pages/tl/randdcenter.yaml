intro:
  - 'Ang Research and Development (R&D) Center ng afarer ang nagtutulak sa aming misyon na rebolusyonahin ang kagamitang water sports. Binibigyang-kapangyarihan namin ang mga mahilig sa water sports sa buong mundo ng mas ligtas, mas komportable, at mas kasiya-siyang produkto sa pamamagitan ng walang-tigil na inobasyon sa mga inflatable stand-up paddle board (SUP). Ang aming nakalaang team ng mga engineer, designer, at masisigasig na dalubhasa sa water sports ang humuhubog sa kinabukasan ng industriya, patuloy na itinaas ang pamantayan ng kalidad, performance, at pagpapanatili.'
  - 'Ang aming pasilidad ng R&D ay nagsasama-sama ng mga materials scientist, marine engineer, at production engineer sa iisang bubong. Mula sa pagbuo ng formula ng fabric at simulasyon ng hull hanggang sa pag-develop ng proseso ng welding at full-scale na sea trial, ang bawat yugto ng pag-develop ng produkto ay pinapatnubay ng datos at pinapatunayan ng pagsubok.'


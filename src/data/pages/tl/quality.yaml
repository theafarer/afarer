tests:
  - title: 'Pressure Testing'
    description: 'Ang mga inflatable chamber ay pinapailalim sa presyur na lumalampas sa kanilang mungkahing hangganan ng operasyon nang mahabang panahon. Ito ay nagpapatunay ng hindi pagpasok ng hangin at integridad na istruktural ng materyal at seam, na tinitiyak na makakayanan ng produkto ang nilalayong gamit at posibleng labis na inflation nang hindi bumibigo o tumatagas.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Impact Testing'
    description: "Ang mga produkto ay pinapailalim sa kontroladong impact mula sa iba't ibang timbang at anggulo. Ito ay sumusuri sa paglaban ng materyal sa butas, pagkapatid, at pinsala mula sa bangga sa mga balakid sa tubig, na nagpapatunay ng tibay at mahabang buhay."
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'Pagsubok sa Paglaban sa UV'
    description: 'Ang mga sample ng materyal ay inilalantad sa pinabilis na UV na sumusunog ng ilang taon ng matinding sikat ng araw, pagkatapos ay muling sinusubok para sa pagpapanatili ng tensile strength at colorfastness. Ito ay nagpapatunay na ang mga compound ng PVC ay lumalaban sa pagkaputla, pag-chalk, at pagkabitak, na tinitiyak ang pangmatagal na tibay sa maaraw na kapaligirang pandagat.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Pagsubok sa Paglaban sa Pagkiskis'
    description: 'Ang mga sample ng materyal ay kinikiskis sa magaspang na ibabaw nang tiyak na bilang ng cycle sa ilalim ng kontroladong presyon. Ito ay sumusukat sa kakayahan ng materyal na makayanan ang pagkasira mula sa paulit-ulit na paggamit at pagkakadikit sa buhangin, bato, o ibang ibabaw, na tinitiyak ang pangmatagal na tibay.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Pagsubok sa Performance sa Mababang Temperatura'
    description: "Ang mga produkto ay sinusubok sa malamig na kapaligiran upang tasahin ang gamit at tibay sa iba't ibang kundisyon ng temperatura, na pumipigil sa pagiging matigas o pagkabitak sa mas malalamig na tubig. Mahalaga para sa mga board na nakalaan sa paggamit sa taglamig o mataas na latitude."
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Pagsubok sa Buoyancy at Kapasidad ng Karga'
    description: "Ang mga produkto ay sinusubok sa iba't ibang timbang upang matukoy ang kanilang pinakamataas na kapasidad sa pagdadala at matiyak na ligtas nilang sinusuportahan ang mga gumagamit at kagamitan. Ang rated capacity ng bawat model ay pinapatunayan bago ito ilabas."
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Pagsubok sa Kakayahang Maniobra'
    description: 'Ang mga produkto ay sinusubok sa kanilang pagtugon sa input ng pagpapaddle o motor, na sinusuri ang turning radius at dali ng paghawak. Ang mga trial sa tubig ay nagpapatunay na tumutugon ang aktwal na paghawak sa mga espesipikasyon ng disenyo.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Pagsubok sa Hindi Pagpasok ng Tubig'
    description: 'Ang mga buong na-asemble na produkto ay isinisilid sa tubig o sinispray ng tubig upang tingnan kung may tagas sa mga seam, valve, o materyal. Ang bawat board ay dumadaan sa mandatoryong pagsusuri ng hindi pagpasok ng tubig bago ipadala.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp

testing_section:

meta:
  title: 'Kalidad at Pagsubok — Kontrol sa Paggawa | {SITE}'
  description: 'Sistema ng kalidad ng afarer: malayang testing lab, mga prosesong ISO 9001, at bawat unit ay sinusubok bago ipadala. Quality control para sa paggawa ng inflatable SUP.'
  keywords:
    - 'sup quality control'
    - 'inflatable sup testing'
    - 'pagtitiyak ng kalidad ng paddle board'
    - 'sup factory quality'
hero:
  tagline: 'Pagtitiyak ng Kalidad'
  title: 'Pagsubok sa Performance at Kalidad'
  subtitle: 'Ang bawat inflatable SUP ng afarer ay dumadaan sa mahigpit na pagsubok sa performance at quality control sa aming R&D Center bago ito ipadala. Ang aming komprehensibong pagsubok sa kalidad ng SUP ay nagbibigay ng makabuluhang patunay ng kahusayan ng produkto para sa mga buyer na OEM at wholesale.'


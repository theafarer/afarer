intro: 'Karaniwang maling akala na ang hydrodynamic testing ay nakalaan lamang para sa mga barkong tumatawid ng karagatan. Sa katotohanan, ang performance ng maliit na planing hull — tulad ng inflatable SUP — ay kasingdepende nito sa hugis sa ilalim ng tubig kung paanong ang tanker ay nakadepende sa bulbous bow nito. Ang trim angle, wetted surface area, pagbuo ng spray, at ventilation ay lahat may malaking epekto sa glide, bilis, at kaginhawaan sa pagsakay. Sa Afarer, nagpapatakbo kami ng nakalaang hydrodynamic test tank na nagpapahintulot sa amin na sukatin ang mga epektong ito sa sukat ng model — bago mag-commit ng fabric at tooling para sa full-size na prototype.'

content_html: |
  <h2>Bakit tank-testin ang isang paddle board?</h2>
  <p>Ang pagsubok sa sukat ng model (karaniwang 1:3 hanggang 1:5) ay nagbibigay sa amin ng kakayahang mabilis at makabuluhan na ulitin ang mga hugis ng hull. Ang isang linggo sa tank ay makakabuo ng parehong datos ng performance na mangangailangan ng ilang buwan ng full-scale na trial-and-error — at sa maliit na bahagi lamang ng gastos.</p>

  <h2>Mga espesipikasyon ng pasilidad</h2>
  <table>
    <thead><tr><th>Parameter</th><th>Espesipikasyon</th></tr></thead>
    <tbody>
      <tr><td>Sukat ng tank</td><td>35 m (L) × 3.5 m (W) × 1.8 m (D)</td></tr>
      <tr><td>Towing carriage</td><td>Electric servo-driven, max na bilis na 12 m/s (23 kn), kawastuhan ng bilis ± 0.5 %</td></tr>
      <tr><td>Wave generator</td><td>Flap-type, programmable na regular at irregular na sea state, Hs hanggang 0.3 m sa sukat ng model</td></tr>
      <tr><td>Instrumentasyon</td><td>6-component na dynamometer (resistance, side force, yaw moment), accelerometer, inclinometer, wave probe</td></tr>
      <tr><td>Pagtatala ng datos</td><td>Pagsample sa 1000 Hz kada channel, real-time na display + suite ng post-processing</td></tr>
      <tr><td>Paggawa ng model</td><td>In-house na CNC milling at 3D printing para sa mga model hull hanggang 1.8 m LOA</td></tr>
    </tbody>
  </table>

  <h2>Ang aming test programme</h2>
  <p>Ang isang karaniwang programa ng pag-develop ng hull sa aming tank ay sumusunod sa pagkakasunod na ito:</p>
  <ol>
    <li><strong>Pagbuo ng model</strong> — Ang 1:3.5 scale na model ay kinakabit ng CNC mula sa high-density foam at ginagawang rigid ng fiberglass. Ang timbang at CG ay inaayos upang tumugma sa Froude-scaled na full-load na kundisyon.</li>
    <li><strong>Mga resistance run</strong> — Ang model ay hinihila sa 8-10 bilis na sumasaklaw sa operating range. Ang kabuuang resistance ay sinusukat at hinihiwalay sa mga frictional at residuary na bahagi gamit ang ITTC-1957 method.</li>
    <li><strong>Pagsukat ng trim at sinkage</strong> — Ang running trim at sinkage ay itinatala sa bawat bilis. Ang pinakamainam na trim angle na 4-6° para sa mga planing hull ang layunin.</li>
    <li><strong>Wake survey</strong> — Ang mga transverse wave cut ay sinusukat sa dalawang bilis upang tasahin ang wave-making resistance at tukuyin ang mga interaksyon ng transverse wave na maaaring maging sanhi ng stern interference.</li>
    <li><strong>Seakeeping (opsyonal)</strong> — Mga head-sea at following-sea na run sa regular na alon upang sukatin ang added resistance, vertical acceleration, at posibilidad ng slamming.</li>
    <li><strong>Pagsusuri ng datos at mga rekomendasyon</strong> — Isang kumpletong ulat ang ibinibigay na may comparative chart, speed/power curve, at mga partikular na rekomendasyon sa disenyo para sa full-scale na hull.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Karaniwang Resulta ng Tank Test — Resistance kumpara sa Bilis (touring SUP hull, 1:3.5 scale)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Resistance ng model (N) sa Froude-scaled na bilis. Ang hula ng drag sa full scale ay sumusunod sa ITTC-1978 performance-prediction method.</p>
  </div>

  <h2>Dalubhasang team</h2>
  <p>Ang aming tank ay pinapatatakbo ng isang hydrodynamicist na may PhD sa fluid dynamics at 8 taon ng karanasan sa towing tank sa isang pangunahing maritime research institute sa Europe. Sinusuportahan siya ng isang technician na naghahanda ng lahat ng model at instrumentasyon. Sinusunod ng team ang ITTC (International Towing Tank Conference) Recommended Procedures upang matiyak na ang bawat pagsubok ay mauulit, masusubaybayan, at matatanggap sa antas pang-internasyonal.</p>

  <h2>Tank-testing para sa custom na pag-develop ng hull</h2>
  <p>Ang aming tank ay hindi lamang ginagamit para sa mga hull na aming dinisenyo — regular kaming nagpapatakbo ng test programme para sa mga kliyenteng nais patunayan ang isang custom na hugis ng hull o imbestigahan ang isang isyu sa performance:</p>
  <ul>
    <li><strong>Paghahambing ng hull-form</strong> — Dalawa o higit pang kandidatong hugis ng hull na sinusubok sa magkakaparehong kundisyon, na nagbibigay ng obhetibong paghahambing ng drag/bilis/katatagan upang gabayan ang iyong pagpili ng disenyo.</li>
    <li><strong>Optimisasyon ng appendage</strong> — Ang mga konfigurasyon ng fin, rail profile, at rocker variant ay maaaring subukan sa iba't ibang kombinasyon upang sukatin ang kani-kanilang ambag sa pagbawas ng drag.</li>
    <li><strong>Pag-aaral ng kahusayan sa glide</strong> — Ang datos ng resistance ay ginagawang curve ng kahusayan sa glide, na nagpapahintulot sa iyo na balansehin ang volume ng hull, rocker, at tigas para sa iyong target na bilis sa pagpapaddle at payload.</li>
  </ul>

  <h2>Bakit sumubok sa amin?</h2>
  <p>Hindi lamang kami nagbibigay sa iyo ng hanay ng hilaw na numero. Ang aming mga ulat ay isinasalin ang datos ng tank sa mga napapanahong rekomendasyon sa engineering: "Magdagdag ng 8 mm ng nose rocker upang mabawasan ang wetted surface sa bilis ng cruise", "Bawasan ang tail rocker ng 3° upang palawigin ang waterline sa bilis ng touring", o "Ilipat ang pinakamalapad na punto nang 150 mm patungong aft para sa pinabuting tracking". Umalis ka na may malinaw na pag-unawa kung ano ang dapat baguhin at kung bakit.</p>
  <p>Available din ang aming tank para sa malayang third-party testing sa batayang fee-for-service. Kung nagde-develop ka ng hull at nais mo ng walang-kinikiling at propesyonal na isinagawang hydrodynamic assessment, tinatanggap namin ang iyong pagtatanong.</p>


material_traceability:
  tagline: 'Traceability'
  title: 'Pagsubaybay sa Materyal at Kontrol ng Batch'
  description: 'Ang bawat batch ng hilaw na materyal ay nagkakaroon ng natatanging lot number sa aming ERP system. Mula sa pagdating, sa produksyon, hanggang sa tapos na produkto, ang bill of materials ng bawat board ay nauugnay pabalik sa orihinal na batch ng supplier. Nagbibigay ito ng buong upstream traceability para sa anumang katanungan tungkol sa kalidad o pagsunod.'
  system: 'Custom ERP (internal system ng Qingdao Vatrad Group) + pisikal na batch tags sa bawat work order'
  coverage: '100% ng mga materyales ng produksyon — PVC, drop-stitch fabric, adhesives, valves, hardware, packaging'
  records_retained: '10 taon (ayon sa kinakailangan ng CE 2013/53/EU)'
  suppliers:
    - material: 'Marine-grade PVC'
      source: 'Mga supplier na Tsino at Koreyano'
      certified: 'ISO 9001, REACH, RoHS'
    - material: 'Drop-stitch fabric'
      source: 'Panloob na paghabi + panlabas na partner'
      certified: 'Panloob na QC + ISO 9001 ng supplier'
    - material: 'Mga Valve at Hardware'
      source: 'Mga OEM supplier na Tsino'
      certified: 'ISO 9001, material certs kada batch'


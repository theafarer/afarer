workshops_section:
  tagline: 'Mga Workshop'
  title: 'Mga Workshop ng Paggawa'
  workshops:
    - title: 'Paggugupot at Paghahanda ng PVC'
      description: 'Ang mga automatic CNC cutting machine ay nagpaproseso ng PVC at drop-stitch fabrics na may sub-millimetre na kawastuhan. Ang computer-optimised nesting ay pinaikli ang pagkakawaste ng materyal at tinitiyak na ang bawat panel ay tumutugon sa dimensional na espesipikasyon nito bago mag-welding.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Pag-weld at Heat Sealing ng Tube'
      description: 'Nakalaang welding workshop na may heat sealing machines at RF dielectric presses. Ang mga hot-air heat sealer ay nagdudugtong at nagsasama ng mga PVC tube chamber, habang ang mga RF weld ay lumilikha ng malakas na hindi tumatablan ng hangin na seams na lumalampas sa mga kinakailangan ng EN ISO 25649.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'Mga FRP Mould at Paggawa ng Composite'
      description: 'Custom na FRP moulds para sa mga bahagi ng SUP, ginagawa gamit ang hand-lay-up fiberglass moulding na may polyester at vinylester resin systems. Ang bawat patong ay ina-rol de-kamay at vacuum-bagged para sa tuloy-tuloy na kalidad. Ang gelcoat spray booth ay nagbibigay ng makintab na UV-resistant na marine finish.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Pag-print at Dekorasyon ng SUP'
      description: 'Ang mga SUP board ay idinadekora gamit ang digital printing para sa buong-kulay na graphics at screen printing para sa mga logo at umuulit na disenyo. Ang mga digital printer ay lumilikha ng photo-quality na disenyo ng deck, habang ang screen printing ay nagbibigay ng matibay at malinaw na tatak ng brand.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Huling Pagpupuwesto at Rigging'
      description: 'Assembly line kung saan tinatapos ang mga drop-stitch core ng rails, inilalagay ang mga EVA deck, at iniinstala ang mga fin, valve, at aksesorya. Sinusunod ng bawat board ang 100-point assembly checklist na pinagtibay ng team lead.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Pagsubok at Pagsisiyasat ng Kalidad'
      description: 'Ang bawat natapos na board ay dadaan sa mandatoryong air-retention testing, seam peel verification, at buong pagsusuri ng sistema bago ipadala. Ang aming quality lab ay gumagana nang malaya sa produksyon at direktang nag-uulat sa pamunuan.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


qc_section:
  tagline: 'Quality Control'
  title: 'Proseso ng Pagsubok at Pagtitiyak ng Kalidad'
  subtitle: 'Ang bawat board ay dadaan sa mandatoryong pagsubok bago ipadala. Ang aming quality lab ay gumagana nang malaya sa produksyon at direktang nag-uulat sa pamunuan.'
  steps:
    - step: '1'
      title: 'Pagsisiyasat sa Hilaw na Materyal'
      desc: 'Ang PVC at drop-stitch fabrics ay dadaan sa tensile testing (ASTM D751), tear propagation, at pagpapatunay ng UV resistance bago pumasok ang anumang batch sa produksyon.'
    - step: '2'
      title: '24–48 Oras na Air Retention Test'
      desc: 'Ang bawat tube chamber ay ini-inflate hanggang 125% ng rated pressure at pinapanatili sa loob ng 24–48 oras. Ang pagbaba ng presyon na lumalampas sa 5% ay nagdudulot ng awtomatikong pagtatakwil at muling pagsisiyasat ng seam.'
    - step: '3'
      title: 'Pagsubok ng Load at Balance'
      desc: 'Ang mga natapos na board ay binabalutan ng pinakamataas na rated capacity at sinusubok para sa katatagan at tigas. Ang bawat board ay sinusubok sa tubig bago ang huling pagsisiyasat.'

oem_section:
  tagline: 'Mga OEM Project'
  title: 'Mga Case Study ng Brand at OEM Partnership'
  subtitle: 'Mula konsepto hanggang container — kung paano namin tinutulungan ang mga global na brand na ilunsad at palawakin ang kanilang mga linya ng inflatable SUP.'
  cases:
    - challenge: 'Kailangan ng European outdoor retailer ng private-label na linya ng SUP na may natatanging deck graphics, eco-friendly na PVC, at ready na packaging para sa retail — lahat ay naihatid sa loob ng 60 araw.'
      solution: 'Nag-develop ng custom digital print files, naghanap ng REACH-compliant na PVC, at pinaikli ang sampling mula 3 round papuntang 1 sa pamamagitan ng paglalagay nang magkakasama ng design team sa aming pabrika sa Qingdao.'
      result: '55 araw mula sa napirmahang PO hanggang FOB. 2,400 unit sa 4 SKUs. Inilagay ang repeat order bago pa dumating ang unang container.'
    - challenge: 'Kailangan ng US watersports startup ng high-performance na drop-stitch SUP na may custom na hugis, co-branded packaging, at BSCI certification para sa paglalagay sa retail.'
      solution: 'Inangkop ang umiiral na SUP mould na may binagong outline, nag-develop ng co-branded packaging artwork, at nagbigay ng buong BSCI audit documentation.'
      result: 'Matagumpay na nailista sa 3 pangunahing US outdoor chains. 5,000+ unit sa unang taon na may 98% sell-through rate.'
    - challenge: 'Kailangan ng Australian distributor ng CE-certified na linya ng SUP na may custom na mga kulay at pagsunod sa mga pamantayang Australyano.'
      solution: 'Gumawa ng pre-production samples na may 4 na variant ng kulay at nag-ugnay ng third-party compliance testing.'
      result: 'Nailunsad ang 3-model na linya ng SUP sa AU/NZ market. Sinundan ng panalo sa government tender para sa 12 patrol SUP.'

faq_section:
  tagline: 'FAQ'
  title: 'Mga Madalas Itanong sa B2B at OEM'
  questions:
    - q: 'Ano ang pinakamababang dami ng order (MOQ) para sa mga OEM inflatable SUP board?'
      a: 'Nagsisimula ang MOQ sa 5–10 unit para sa mga karaniwang OEM model. Ang mga custom mould at private-label na project ay nangangailangan ng hindi bababa sa 200 unit depende sa pagkakumplikado. Available ang mga trial order at sample run para sa mga bagong paglulunsad ng brand.'
    - q: 'May hawak ba ang afarer ng BSCI certification?'
      a: 'Oo. Pinapanatili ng aming pabrika ang wastong BSCI social compliance certification (available ang audit report kapag hiniling). Mayroon din kaming ISO 9001 para sa quality management at ang lahat ng produkto ay may CE certification. Kasama ang REACH at RoHS compliance documentation sa bawat OEM shipment.'
    - q: 'Ano ang karaniwang lead time para sa OEM order?'
      a: 'Ang karaniwang lead time ay 30–45 araw mula sa kumpirmadong PO at deposito para sa bulk OEM production. Ang pag-develop ng custom mould ay nagdaragdag ng 15–20 araw para sa tooling. Available ang pinalaking bilis ng produksyon para sa mga urgent na order at seasonal rush. Ang mga prototype sample ay karaniwang ipinapadala sa loob ng 15–20 araw.'
    - q: 'Maaari ba kayong magpadala ng FOB Qingdao o CIF sa aming port?'
      a: 'Oo. Nagpapadala kami ng FOB Qingdao, CIF sa mga pangunahing global na port, at DDP para sa mga kwalipikadong partner. Ang aming logistics team ay namamahala sa pag-book ng container, export documentation, at customs clearance. Nagpapadala kami sa 50+ bansa sa buong EU, US, AU, at mga market sa Asya.'

b2b_moq: 'Karaniwang MOQ: 5–10 unit kada model. Malugod ang mga trial order para sa mga bagong partnership.'

production_flow:
  tagline: 'Daloy ng Produksyon'
  title: 'Mula Materyal hanggang Tapos na Board'
  subtitle: 'Ang bawat board ay dumadaan sa 6 na yugto ng produksyon na may QC checkpoints sa bawat hakbang. Walang shortcut, walang laktawan na pagsisiyasat.'
  stages:
    - stage: '01'
      title: 'Pagtanggap ng Materyal at Incoming QC'
      description: 'Ang lahat ng papasok na materyales ay itinala ayon sa batch/lot number sa aming ERP system. Ang mga roll ng PVC fabric, drop-stitch cores, valves, adhesives, at hardware ay iniihiwalay hanggang sa pagtibayin ng QC.'
      qc_check: 'Lakas ng tensile (ASTM D751), paglaban sa pagpunit (ISO 4674), panukat ng kapal, lagkit ng pandikit, pag-scan ng depektong biswal'
      qc_threshold: '100% ng mga batch ang sinusubukan. Itakuwil kung tensile < 90% ng spec, tear < spec min, o anumang visual defect'
      responsibility: 'Koponan ng Incoming QC (3 inspector)'
    - stage: '02'
      title: 'CNC Cutting at Paghahanda ng Materyal'
      description: 'Ang computer-optimized nesting ay naglalatag ng mga panel sa PVC stock upang mabawasan ang pagkakawaste. Ang mga automatic CNC cutting machine ay nagpapanatili ng 0.1 mm na kawastuhan sa posisyon.'
      qc_check: 'Dimensional check laban sa CAD DXF files, pagsisiyasat sa kalidad ng gilid, pagpapatunay ng bilang ng panel'
      qc_threshold: 'Ang bawat ika-20 panel ay sinusukat. Tolerance ±0.5 mm. Itakuwil ang batch kung >2% ang lampas sa tolerance'
      responsibility: 'Cutting workshop lead'
    - stage: '03'
      title: 'Pag-weld at Drop-Stitch Bonding'
      description: 'Ang mga drop-stitch core ay pinagdudugtong sa panlabas na PVC laminates gamit ang heat lamination. Ang mga tube chamber ay RF-welded o hot-air welded. Ang mga rail band ay triple-layer fusion bonded.'
      qc_check: 'Peel test kada 50 unit (ASTM D751), pagsukat ng lapad ng weld, pagbabasa ng hot-air temperature log, visual seam inspection sa ilalim ng backlight'
      qc_threshold: 'Peel strength min 8 N/cm. Tolerance ng lapad ng weld ±1 mm. Anumang nakikitang channeling = itakuwil'
      responsibility: 'Welding QC (2 inspectors kada shift)'
    - stage: '04'
      title: 'Assembly at Rigging'
      description: 'Lilipat ang mga board sa huling assembly kung saan pinagsasama ang lahat ng bahagi: mga rail na dinikit at na-weld, mga valve na ininstala, mga D-ring, handle, fin box, at pagkasya ng carry bag. Sinusunod ng bawat unit ang 100-point assembly checklist.'
      qc_check: 'Pagtibay ng 100-point checklist kada unit, pagsubok sa gamit ng valve (10 open/close cycles), pagpapatunay ng torque ng hardware, visual inspection'
      qc_threshold: 'Zero-defect policy sa mga kritikal sa kaligtasan (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)'
      responsibility: 'Pinuno ng Assembly Team + line QC'
    - stage: '05'
      title: 'Pressure Testing at Quality Hold'
      description: 'Ang bawat chamber ay ini-inflate hanggang 1.25× ng rated pressure (karaniwang 20–25 PSI) at pinapanatili sa loob ng 24–48 oras. Tuloy-tuloy na nagtatala ang mga pressure sensor. Ang mga chamber na lumalampas sa 5% na pagbaba ng presyon ay itinatakwil at ipinapadala para sa muling pagsisiyasat ng seam.'
      qc_check: '24–48h pressure hold log, patunay na calibrated ang sensor araw-araw, temperature-compensated na pagbasa ng presyon, muling pagsubok ng seam pagkatapos ng pagkukumpuni'
      qc_threshold: 'Pinakamataas na 5% pagbaba ng presyon sa loob ng 24–48h sa stable na temperatura. Anumang chamber na lumalampas dito = 100% re-test ng buong production batch'
      responsibility: 'Quality lab (malaya sa produksyon, nag-uulat sa pamunuan)'
    - stage: '06'
      title: 'Huling Pagsisiyasat at Packing'
      description: 'Huling visual at functional na pagsisiyasat. Mga depekto sa ibabaw, pagkakapareho ng kulay, pagpapatunay ng label/BIN, integridad ng packaging, at kumpleto ng aksesorya. Ang mga unit ay vacuum-packed, naka-box, at inilalagay sa pallet para sa pagkarga sa container.'
      qc_check: 'Buong visual inspection, accessory checklist kada SKU, packaging drop test (1 m, random na sample), pagpapatunay ng label/bar code scan'
      qc_threshold: 'AQL 2.5 para sa malalaking depekto, AQL 4.0 para sa maliliit. Walang tolerance sa mga depektong pangkaligtasan. 100% ng mga unit ay visually inspected'
      responsibility: 'Koponan ng Final QC (4 inspector) + Pinuno ng Packing Team'


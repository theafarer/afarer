intro:
  - 'Bilang produksyon na sangay ng **Aquafarer LLC (USA)**, kinokontrol ng Qingdao Operation Team ng afarer ang bawat yugto ng produksyon — mula sa pagdating ng hilaw na PVC at fiberglass na materyales hanggang sa huling pagsisiyasat bago mag-delivery ng tapos na board. Ang aming pasilidad ng paggawa sa Qingdao Economic Development Zone ay sumasaklaw sa 12,000 square metro at naglalaman ng mga nakalaang workshop para sa paggugupot ng PVC, tube heat sealing, paggawa ng FRP mould, digital printing ng SUP, huling pagpupuwesto, at pagsusuri ng kalidad.'
  - 'Sa pagsasama-sama ng disenyo, engineering, prototyping, paggawa ng produkto, at pagsubok sa iisang bubong, nasisiwalat namin ang mga kahinaan ng kontratang paggawa at pinapanatili ang direktang kontrol sa kalidad ng pagbuo, pagpili ng materyal, at iskedyul ng paghahatid. Ang bawat board na lumalabas sa aming workshop ay ginagawa ng aming mga tao, sa aming kagamitan, ayon sa aming pamantayan.'


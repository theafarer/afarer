faqs:
  title: 'Co-Brand — FAQ'
  subtitle: 'Paano gumagana ang co-branding ng Afarer, at paano ito nagkakaiba sa OEM at private label.'
  items:
    - title: 'Pareho ba ang co-branding sa OEM o private label?'
      description: 'Hindi. Hindi na pinapatakbo ng Afarer ang bukas na OEM/private-label na programa. Ang mga co-branded na produkto ay nananatiling produkto ng Afarer — idinisenyo, ini-engineer, sinusuri sa kalidad, at sinusuportahan ng brand na Afarer. Lumilitaw ang iyong identidad bilang co-brand, hindi bilang unbranded na third-party na produkto.'
    - title: 'Sino ang makakapagsimula ng co-brand project?'
      description: 'Mga kwalipikadong negosyo ng water sports: mga umiiral na country partner, paddle club, resort at hotel, event organizer, at komunidad. Magpadala sa amin ng project brief at kinukumpirmahan namin ang pagkamakatotoo bago magsimula ang gawain sa disenyo.'
    - title: 'Makakasalungat ba ang co-branding sa aking country distributor?'
      description: 'Hindi. Ang modelong isang-bansa-isang-distributor ang may priyoridad. Ang mga co-brand collection ay kina-koordina sa lokal na country partner kung saan mayroon, upang walang parallel o kumpetensyang brand na lilitaw sa loob ng protektadong teritoryo.'
    - title: 'Ano ang minimum na order para sa isang co-brand collection?'
      description: 'Ang mga pilot collection ay nagsisimula sa 30–50 unit. Ang mga standard na koleksyon ay 50–100 unit; ang malalaki o multi-region na edition ay 100+ unit. Ang mga timeline ng custom development ay pinagkakasunduan bawat proyekto.'
    - title: 'Ano ang bumubuo sa kalidad ng Afarer kumpara sa input ng partner?'
      description: 'Pag-aari ng Afarer ang disenyo ng produkto, engineering, materyales, konstruksyon, QC, at warranty. Kontribusyon ng mga partner ang konsepto ng koleksyon, pagpapangalan, mga kulay, input sa graphics, at go-to-market. Nakatuon ito sa iisang pamantayan ng kalidad sa tubig.'
    - title: 'Paano ako mag-aapply?'
      description: 'Punan ang co-brand inquiry form na may iyong negosyo, merkado, at ideya ng koleksyon. Sinusuri namin ang pagkamakatotoo, pagkatapos ay tumutugon kami sa loob ng 3 business day na may proposal at ang Co-Brand Project Agreement.'

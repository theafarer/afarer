features:
  title: 'Ano ang Ibig Sabihin ng Co-Branding sa Afarer'
  subtitle: 'Ang co-branding ay ang aming programa ng design-partnership — nakabatay sa brand na Afarer, proteksyon ng teritoryo, at mga limitadong koleksyon, hindi unbranded na produksyon.'
  columns: 3
  items:
    - title: 'Ang mga Produkto ng Afarer ay Nananatiling Produkto ng Afarer'
      description: 'Ang isang co-branded na koleksyon ay isang limited edition ng mga board ng Afarer na may hubog ng iyong identidad. Hindi ito kailanman unbranded, hindi kailanman third-party na brand, at hindi kailanman bukas na private-label na programa.'
      icon: 'tabler:trademark'
    - title: 'Idinisenyo Kasama Mo'
      description: 'Ang iyong mga kulay, pagpapangalan, at kuwento ang humuhubog sa koleksyon. Ang aming design at engineering team ang bahala sa mga deck, graphics, packaging, at dokumentasyon mula brief hanggang paghahatid.'
      icon: 'tabler:pencil'
    - title: 'Para sa mga Club, Resort, Event at Komunidad'
      description: 'Mga koleksyon ng fleet para sa mga paddle club at resort, mga edition para sa race at community series — lahat ay may dalang kalidad at warranty ng Afarer.'
      icon: 'tabler:users'
    - title: 'Pinoprotektahan ang mga Country Partner'
      description: 'Tumatakbo ang co-branding sa tabi ng aming modelong isang-bansa-isang-distributor. Napapanatili ng mga national partner ang kanilang teritoryo; hindi binubuksan ng mga co-brand na koleksyon ang pinto sa mga parallel na brand sa kanilang merkado.'
      icon: 'tabler:shield-check'
    - title: 'Pamantayan sa Engineering at Kalidad'
      description: 'Bawat koleksyon ay ipinapadala mula sa aming certified na supply chain na may CE at ISO 9001 na dokumentasyon, pressure-testing, at parehong QC checkpoint tulad ng aming pangunahing linya.'
      icon: 'tabler:certificate'
    - title: 'Nagiging Brand Asset'
      description: 'Ang isang limitadong co-branded na koleksyon ay bumubuo ng iyong sariling kuwento sa tubig — sell-through margin, nilalamang pang-media, at dahilan para bumalik ang mga paddler season matapos ang season.'
      icon: 'tabler:star'

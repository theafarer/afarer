meta:
  title: 'Proseso ng Pagmamanupaktura — Mula Hilaw na Materyales hanggang SUP | {SITE}'
  description: 'Mula hilaw na materyales hanggang sa SUP na handa-na-sa-dagat: bawat hakbang ng proseso ng pagmamanupaktura ng afarer sa ilalim ng aming kontrol, mula cutting at welding hanggang testing.'
  keywords:
    - 'proseso ng pagmamanupaktura ng sup'
    - 'pabrika ng inflatable sup'
    - 'mga hakbang sa produksyon ng paddle board'
    - 'pvc welding sup'
hero:
  tagline: 'Proseso'
  title: 'Proseso ng Pagmamanupaktura'
  subtitle: 'Mula hilaw na materyales hanggang sa board na handa-na-sa-tubig — bawat hakbang sa ilalim ng aming kontrol'
  back_label: 'Bumalik sa Factory'
  back_link: /factory

intro: 'Hindi tulad ng mga brand na ipinapasa ang produksyon sa mga third-party na pabrika, ang afarer ang nag-aari at nagpapatakbo ng buong chain ng pagmamanupaktura nito. Pinapahintulutan ng vertical integration na ito na mapanatili namin ang mahigpit na quality control sa bawat yugto, tumugon nang mabilis sa mga custom na kinakailangan, at maihanda ang pare-parehong kalidad ng produkto batch matapos ang batch. Ganito ang pagtatayo ng isang board sa aming pasilidad.'

steps:
  - step: '01'
    title: 'Pagtanggap at Inspeksyon ng Materyales'
    description: 'Bawat papasok na batch ng PVC fabric, fiberglass mat, resin, at hardware ay sinspeksyunan laban sa espesipikasyon. Ang mga sample ng tela ay sinusubukan para sa tensile strength, pare-pareho ng kapal, at UV resistance bago palayain sa produksyon. Ang mga materyales na hindi tumutugod ay iniihiwalay at ibinabalik.'
    duration: '1–2 araw'
  - step: '02'
    title: 'Automatic PVC Cutting'
    description: 'Ang mga aprubadong tela ay inilalagay sa automatic CNC cutting machine at ginugupit nang mas tumpak pa sa isang milimetro. Ang computer-optimised na nesting ay nag-aayos ng mga panel upang mabawasan ang basura — karaniwang mas mababa sa 5%. Ang mga ginupit na panel ay nilalagyan ng label ayon sa modelo ng board at chamber, pagkatapos ay tinatalian para sa paglilipat sa welding workshop.'
    duration: '2–4 oras bawat board kit'
  - step: '03'
    title: 'Heat Sealing at Welding ng Tube'
    description: 'Ang mga panel ay tina-tack at dinidikit gamit ang mga heat sealing machine na may hot-air welding sa kontroladong temperatura na 200–300 °C. Ang mga pangunahing seam ay pinalalakas ng RF dielectric welding para sa air-tight at matibay na dugtungan. Ang mga natapos na chamber ay pinipresyar sa 1.5× working pressure para sa 30-minutong validasyon ng air-retention.'
    duration: '1–2 araw bawat board'
  - step: '04'
    title: 'Printing at Dekorasyon ng SUP'
    description: 'Ang mga graphic ng SUP board deck ay inilalapat gamit ang digital printing para sa buong-kulay na disenyo na photo-quality, at screen printing para sa matibay na logo at paulit-ulit na pattern. Ang mga print ay pinapatuyo at siniselyo para sa paglaban sa UV at abrasion.'
    duration: '1–2 araw'
  - step: '05'
    title: 'Panghuling Assembly at Rigging'
    description: 'Ang mga board ay tinatak sa assembly line na may fin, valve, EVA deck, at accessory. Bawat unit ay sumusunod sa 100-point na assembly checklist na may mandatoryong sign-off sa bawat yugto.'
    duration: '2–4 araw'
  - step: '06'
    title: 'Quality Testing at Inspeksyon'
    description: 'Bawat natapos na board ay sumasailalim sa mandatoryong quality gate: air-retention test ng chamber, pagsusuri ng pagganap ng hardware, beripikasyon ng torque ng fastener, at cosmetic na inspeksyon. Ang mga custom at prototype build ay nakakatanggap din ng in-water trial na sumasaklaw sa stability at handling.'
    duration: '1–2 araw'
  - step: '07'
    title: 'Pag-pack at Pagpapadala'
    description: 'Ang mga board ay dide-deflate, tinutupi ayon sa proseso, iniipon sa heavy-duty na woven bag o plywood crate, at ikinakarga para sa pagpapadala. Bawat package ay may label na modelo, serial number, at patutunguhan. Nag-koordina kami sa mga freight forwarder para sa FCL at LCL container shipment sa buong mundo.'
    duration: '1 araw'


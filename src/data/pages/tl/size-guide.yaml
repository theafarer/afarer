how_to_choose:
  title: 'Paano Pumili ng Tamang Laki'
  cards:
    - title: 'Mga SUP Board'
      description: 'Pumili ng haba batay sa iyong timbang at inaasahang paggamit. Ang mas malawak na board (32"+) ay nag-aalok ng mas maraming stability. Ang mas mahabang board (11-12 ft) ay mas mahusay mag-track para sa touring. Ang mas mabibigat na paddler ay nangangailangan ng mas mataas na volume na board.'
    - title: 'Mga Touring SUP'
      description: 'Ang mas mahabang board (11–12 ft) ang pinakamahusay para sa paglalakbay ng malayo at touring. Ang mas malawak na board (32"+) ay nag-aalok ng mas maraming stability. Tingnan ang kapasidad ng timbang para sa kabuuang karga kabilang ang gamit.'
    - title: 'Mga All-Around SUP'
      description: 'Pumili ng haba ayon sa timbang ng rider at inaasahang paggamit. Gumagana ang mga all-around board para sa recreation, fitness, at yoga. Ang mas maliliit na board ay mas madaling maniobrahin.'

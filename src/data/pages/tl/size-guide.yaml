  title: Gabay sa Laki at Specs
  subtitle: Mga dimensyon, kapasidad, at inirerekomendang paggamit para sa bawat produkto ng afarer.
categories:
  inflatable: Mga Inflatable SUP na dinisenyo para sa portability nang hindi isinasakripisyo ang pagganap. Iugnay ang tamang laki sa iyong timbang at istilo ng pagkakayak.
  sup: Mga stand-up paddleboard para sa touring, yoga, fitness, at recreational na pagkakayak. Pumili ayon sa haba at timbang ng rider.
  accessory: Mga accessory at kagamitang pangkaligtasan upang dumugtong sa iyong SUP board. Pangkalahatang laki na may maraming opsyon.

  title: Hydrodynamischer Testtank
  subtitle: Überprüfung der Leistung vor dem ersten vollwertigen Prototyp
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: Afarer hydrodynamische Testbeckenleistungstest
intro: >-
  Es ist ein weit verbreitetes Missverständnis, dass hydrodynamische Tests nur für seetüchtige Schiffe vorbehalten sind. In Wirklichkeit hängt die Leistung eines kleinen Gleitkörpers – wie eines 4–6 m RIB – genauso sehr von seiner Unterwasserform ab wie die eines Tankers von seinem Bugsporn.
  Trimmwinkel, benetzte Oberfläche, Spritzwasserbildung und Belüftung haben alle einen dramatischen Einfluss auf Geschwindigkeit, Kraftstoffverbrauch und Fahrkomfort. Bei {SITE.name} betreiben wir einen speziellen hydrodynamischen Testtank, der es uns ermöglicht, diese Effekte im Modellmaßstab zu
  quantifizieren – bevor Metall und Stoff in ein vollgroßes Prototypenbauprojekt gesteckt werden.
content_html: "<h2>Warum einen Schlauchboot-Tanktest durchführen?</h2>\n<p>Tests im Modellmaßstab (typischerweise 1:3 bis 1:5) ermöglichen es uns, Rumpfformen schnell und kostengünstig zu iterieren. Eine Woche im Tank kann dieselben Leistungsdaten generieren, die bei Versuchen im Originalmaßstab Monate erfordern würden — und dies zu einem Bruchteil der Kosten.</p>\n\n<h2>Einrichtungsspezifikationen</h2>\n<table>\n  <thead><tr><th>Parameter</th><th>Spezifikation</th></tr></thead>\n  <tbody>\n    <tr><td>Tankabmessungen</td><td>35 m (L) × 3,5 m (B) × 1,8 m (T)</td></tr>\n    <tr><td>Schleppwagen</td><td>Elektrisch servogesteuert, max. Geschwindigkeit 12 m/s (23 kn), Geschwindigkeitsgenauigkeit ± 0,5 %</td></tr>\n    <tr><td>Wellengenerator</td><td>Klappenartig, programmierbare regelmäßige &amp; unregelmäßige Seezustände, Hs bis zu 0,3 m im Modellmaßstab</td></tr>\n    <tr><td>Messtechnik</td><td>6-Komponenten-Dynamometer (Widerstand, Seitenkraft, Giermoment), Beschleunigungsmesser, Neigungsmesser, Wellenmesssonden</td></tr>\n    <tr><td>Datenerfassung</td><td>Abtastrate 1000 Hz pro Kanal, Echtzeit-Anzeige + Nachbearbeitungssoftware</td></tr>\n    <tr><td>Modellfertigung</td><td>Interne CNC-Fräsen und 3D-Druck für Modellrumpfe bis 1,8 m Länge über alles</td></tr>\n  </tbody>\n</table>\n\n<h2>Unser Prüfprogramm</h2>\n<p>Ein standardmäßiges Rumpfentwicklungsprogramm in unserem Tank folgt dieser Reihenfolge:</p>\n<ol>\n  <li><strong>Modellbau</strong> — Ein 1:3,5-Maßstabsmodell wird aus hochdichtem Schaumstoff CNC-gefräst und mit Glasfaser für Steifigkeit verstärkt. Gewicht und Schwerpunkt werden an den Froude-skalierten Vollastzustand angepasst.</li>\n  <li><strong>Widerstandsmessungen</strong> — Das Modell wird bei 8–10 Geschwindigkeiten im Betriebsbereich geschleppt. Der Gesamtwiderstand wird gemessen und mit der ITTC-1957-Methode in Reibungs- und Restwiderstand aufgeteilt.</li>\n  <li><strong>Trim- und Einsinkmessung</strong> — Laufender Trim und Einsinken werden bei jeder Geschwindigkeit aufgezeichnet. Ein optimaler Trimwinkel von 4–6° für Gleithüllen ist das Ziel.</li>\n  <li><strong>Nachlaufuntersuchung</strong> — Querwellenverläufe werden bei zwei Geschwindigkeiten gemessen, um den Wellenwiderstand zu bewerten und Querwellenwechselwirkungen zu identifizieren, die eine Heckbeeinflussung verursachen könnten.</li>\n  <li><strong>Seegangseigenschaften (optional)</strong> — Bugsee- und Hecksee-Versuche in regelmäßigen Wellen zur Messung des Zusatzwiderstands, der vertikalen Beschleunigung und der Schlaggerwahrscheinlichkeit.</li>\n  <li><strong>Datenanalyse &amp; Empfehlungen</strong> — Ein vollständiger Bericht wird mit Vergleichsdiagrammen, Geschwindigkeits-/Leistungskurven und spezifischen Designempfehlungen für den Rumpf im Originalmaßstab geliefert.</li>\n</ol>\n\n<div class=\"not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800\">\n  <p class=\"text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider\">Typische Tanktestergebnisse — Widerstand vs. Geschwindigkeit (RIB 450 Rumpf, 1:3,5 Maßstab)</p>\n  <div class=\"space-y-2\">\n    <div class=\"flex items-center gap-2 text-xs\">\n      <span class=\"w-20\">5 kn (1:1)</span>\n      <div class=\"flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded\">\n        <div class=\"h-full bg-blue-600 rounded\" style=\"width:18%\"></div>\n      </div>\n      <span class=\"w-16 text-right\">42 N</span>\n    </div>\n    <div class=\"flex items-center gap-2 text-xs\">\n      <span class=\"w-20\">10 kn (1:1)</span>\n      <div class=\"flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded\">\n        <div class=\"h-full bg-blue-600 rounded\" style=\"width:35%\"></div>\n      </div>\n      <span class=\"w-16 text-right\">81 N</span>\n    </div>\n    <div class=\"flex items-center gap-2 text-xs\">\n      <span class=\"w-20\">15 kn (1:1)</span>\n      <div class=\"flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded\">\n        <div class=\"h-full bg-blue-600 rounded\" style=\"width:52%\"></div>\n      </div>\n      <span class=\"w-16 text-right\">121 N</span>\n    </div>\n    <div class=\"flex items-center gap-2 text-xs\">\n      <span class=\"w-20\">20 kn (1:1)</span>\n      <div class=\"flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded\">\n        <div class=\"h-full bg-blue-600 rounded\" style=\"width:68%\"></div>\n      </div>\n      <span class=\"w-16 text-right\">158 N</span>\n    </div>\n    <div class=\"flex items-center gap-2 text-xs\">\n      <span class=\"w-20\">25 kn (1:1)</span>\n      <div class=\"flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded\">\n        <div class=\"h-full bg-blue-600 rounded\" style=\"width:85%\"></div>\n      </div>\n      <span class=\"w-16 text-right\">197 N</span>\n    </div>\n    <div class=\"flex items-center gap-2 text-xs\">\n      <span class=\"w-20\">30 kn (1:1)</span>\n      <div class=\"flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded\">\n        <div class=\"h-full bg-blue-600 rounded\" style=\"width:100%\"></div>\n      </div>\n      <span class=\"w-16 text-right\">232 N</span>\n    </div>\n  </div>\n  <p class=\"text-xs text-gray-400 mt-2\">Modellmaßstabs-Widerstand (N) bei Froude-skalierten Geschwindigkeiten. Die Leistungsprognose im Originalmaßstab erfolgt nach der ITTC-1978-Leistungsprognose-Methode.</p>\n</div>\n\n<h2>Expertenteam</h2>\n<p>Unser Tank wird von einem Hydrodynamiker mit Promotion in Schiffsingenieurwesen und 8 Jahren Schlepptankerfahrung an einem großen europäischen Meeresforschungsinstitut betrieben. Er wird von einem Techniker unterstützt, der alle Modelle und die Messtechnik vorbereitet. Das Team folgt den empfohlenen Verfahren der ITTC (International Towing Tank Conference), um sicherzustellen, dass jeder Test reproduzierbar, nachvollziehbar und international vertretbar ist.</p>\n\n<h2>Tanktests für kundenspezifische Rumpfentwicklung</h2>\n<p>Unser Tank wird nicht nur für eigene Rumpfdesigns verwendet — wir führen regelmäßig Prüfprogramme für Kunden durch, die eine kundenspezifische Rumpfform validieren oder ein Leistungsproblem untersuchen möchten:</p>\n<ul>\n  <li><strong>Rumpfform-Vergleich</strong> — Zwei oder mehr Rumpfform-Kandidaten werden unter identischen Bedingungen getestet und liefern einen objektiven Widerstand/Geschwindigkeit/Stabilitäts-Vergleich für Ihre Designentscheidung.</li>\n  <li><strong>Anbauteil-Optimierung</strong> — Interceptor-Platten, Spritzleisten, Trimklappen und Schecken können in verschiedenen Konfigurationen getestet werden, um ihren individuellen Beitrag zur Widerstandsreduzierung zu quantifizieren.</li>\n  <li><strong>Motorabstimmungsstudie</strong> — Die Widerstandsdaten werden in eine Leistungsprognosekurve umgerechnet, sodass Sie die optimale Motorleistung für Ihre Zielgeschwindigkeit und Nutzlast auswählen können.</li>\n</ul>\n\n<h2>Warum bei uns testen?</h2>\n<p>Wir geben Ihnen nicht nur eine Reihe von Rohdaten. Unsere Berichte übersetzen Tankdaten in umsetzbare konstruktionstechnische Empfehlungen: „Spritzleiste um 8 mm anheben, um die benetzte Oberfläche bei Reisegeschwindigkeit zu verringern\", „Spantenwinkel am Heck um 3° erhöhen, um die Schlaggerwahrscheinlichkeit zu reduzieren\", oder „Längsschwerpunkt um 150 mm nach hinten verlagern für verbesserte Gleiteigenschaften\". Sie verlassen uns mit einem klaren Verständnis dessen, was geändert werden muss und warum.</p>\n<p>Unser Tank steht auch für unabhängige Drittanbieter-Tests auf Honorarbasis zur Verfügung. Wenn Sie einen Rumpf entwickeln und eine unvoreingenommen, professionell durchgeführte hydrodynamische Bewertung wünschen, freuen wir uns auf Ihre Anfrage.</p>\n\r\n"

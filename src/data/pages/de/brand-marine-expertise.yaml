hero:
  tagline: Maritime Kompetenz
  title: Jahrzehnte Schiffsingenieurwesen<br />in jedem Rumpf
  subtitle: afarer vereint Materialwissenschaft, Präzisionsfertigung und Praxisprüfung für Wasserfahrzeuge, die leisten, wenn es darauf ankommt.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Ein Fernerfahrer-Maschinenbau- und F&E-Team bei der Arbeit
expertise_materials:
  tagline: Materialwissenschaft
  title: Das richtige Material wählen<br />für jede Anwendung
  subtitle: Wir arbeiten mit drei Kernmaterialien – jedes ausgewählt für spezifische Anwendungsfälle.
  columns: 3
  items:
    - title: Marine-PVC
      description: 1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.
      icon: tabler:droplet
    - title: Premium-Hypalon/CSM
      description: Überlegene Chemikalienbeständigkeit und UV-Stabilität. Hypalon-Boote halten 15-20 Jahre. Empfohlen für kommerzielle, Rettungs- und Militäranwendungen.
      icon: tabler:shield
    - title: Glasfaser & Aluminium
      description: Tief-V-GFK-Rümpfe für RIBs und Patrouillenboote. Aluminiumrümpfe für schwere kommerzielle Arbeitsboote.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Fertigungskapazitäten
  title: Präzisionsfertigung<br />in jedem Schritt
  subtitle: Unsere 12.000 m² Anlage ist mit Spezialmaschinen für jede Produktionsstufe ausgestattet.
  columns: 2
  items:
    - title: CNC-Schneiden
      description: Computergesteuerter Zuschnitt für präzise, wiederholbare Stoffbahnen mit minimalem Abfall.
      icon: tabler:cpu
    - title: Hochfrequenzschweißen
      description: Industrielles HF-Schweißen erzeugt stärkere Nähte als das Basismaterial. Gleichmäßige Temperatur- und Druckkontrolle.
      icon: tabler:bolt
    - title: Drop-Stitch-Kernmontage
      description: Tausende Polyesterfäden verbinden obere und untere Schichten für Hochdruckaufblasung (15-20 PSI).
      icon: tabler:building-arch
    - title: Druckprüfung
      description: Jedes aufblasbare Produkt wird vor Versand druckgeprüft. SUP-Schläuche mit 1,5-fachem Nenndruck.
      icon: tabler:wind
    - title: Nahtfestigkeitstest
      description: Zufallsstichproben jeder Charge werden zerstörenden Nahtfestigkeitsprüfungen unterzogen.
      icon: tabler:files
    - title: Wasserprüfung
      description: Jedes SUP-Modell durchläuft vor der Zertifizierung Seeerprobungen unter Küstenbedingungen.
      icon: tabler:droplet
expertise_design:
  tagline: Design & Technik
  title: Für reale Bedingungen entwickelt
  subtitle: Unsere Designphilosophie beginnt mit der Nutzung des Bootes – dann entwickeln wir die Technik darum herum.
  items:
    - title: Deep-V-Rumpfdesign
      description: Unsere Rümpfe aus Glasfaser verfügen über berechnete Deadrise-Winkel, die für die Länge und die vorgesehene Nutzung jedes Modells optimiert sind. Steileres V für die Leistung bei rauer See, flacheres für Stabilität.
    - title: Mehrkammer-Sicherheit
      description: Jedes Boot verfügt über 3-7 unabhängige Luftkammern. Bei Beschädigung einer Kammer bleiben die übrigen
    - title: Ergonomisches Layout
      description: Konsolenposition, Schlauchhöhe und Sitzplatzierung sind ergonomisch optimiert
    - title: Benutzerdefinierte Konfiguration
      description: Schlauchfarben, Konsolenkonfiguration, Kraftstoffkapazität, Zubehörhalterungen – jedes Modell anpassbar
cta:
  title: Haben Sie eine bestimmte Anwendung im Sinn?
  subtitle: Unser Engineering-Team berät zu Materialauswahl, Design und Fertigung.
  actions:

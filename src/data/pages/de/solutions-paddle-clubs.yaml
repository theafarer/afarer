meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Paddelclub-Mitglieder auf passenden Afarer-SUP-Boards
benefits:
  title: Club Flottenvorteile
  subtitle: Warum Paddelclubs in über 50 Ländern Afarer als ihren Ausrüstungspartner wählen.
  items:
    - metric: 40%
      label: Flottenkosteneinsparungen
      detail: Im Vergleich zu Einzelhandelspreisen mit Mengenclub-Rabatten
    - metric: "48\_Stunden"
      label: Teileaustausch
      detail: Minimale Ausfallzeiten für Ihre Mietflotte
    - metric: Fünfhundert
      label: Mietzyklen
      detail: Kommerzielle Haltbarkeit pro Brett
    - metric: 5 Jahre
      label: Flottenlebensdauer
      detail: Mit ordnungsgemäßer Wartung und Pflege
packages:
  title: Club-Flottenprogramme
  subtitle: Wählen Sie das Flottenprogramm, das der Größe und den Ambitionen Ihres Clubs entspricht.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Launch-Anleitung + Sicherheitscheckliste
        - Startanleitung + Sicherheitscheckliste
        - CE-zertifiziert — alle Geräte
      cta_text: Starte deinen Club
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Ersatzteilprogramm (15 % Rabatt)
        - Staff training session
        - Mitarbeiterschulung (online)
        - CE-zertifiziert — alle Geräte
      popular: true
      cta_text: Baue deine Flotte
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50 Renn- / Performance-Boards
        - Full accessory set
        - Event support kit
        - Prioritätsteile (24h Versand)
        - Dedizierter Kundenbetreuer
        - Option für kundenspezifische Teamuniformen
        - CE-zertifiziert — alle Geräte
      cta_text: Wettbewerbsflotte abrufen
training:
  title: Trainingscenter-Pakete
  subtitle: Alles, was eine SUP-Schule benötigt, um professionelle Zertifizierungskurse durchzuführen.
  items:
    - name: Instructor Starter
      features:
        - 5 Premium-SUP-Boards (Instruktorenqualität)
        - 5 Kohlenstoff-Paddel für Demonstrationen
        - 5 Schwimmwesten (für Ausbilder geeignet)
        - Trainingslehrplan-Anleitung
        - CE-zertifizierte Ausrüstung
    - name: School Full Set
      features:
        - 20 SUP-Boards (Mischung aus Studenten und Instruktoren)
        - 20 Paddel + 20 Schwimmwesten (verschiedene Größen)
        - 10 Auftriebshilfen für Anfänger
        - 4 Pumpen Reparatursätze
        - Schulungsprogramm und Zertifizierungsunterstützung
        - CE-zertifizierte Ausrüstung
features:
  title: Warum Clubs Afarer wählen
  subtitle: Konstante Qualität, schnelle Teile und Mengenpreise, die für wachsende Vereine entwickelt wurden.
  items:
    - title: 500 Mietzyklen
      description: Bretter in Industriequalität überstehen Saisons täglichen Gebrauchs.
      icon: tabler:shield-check
    - title: Benutzerdefinierte Farben
      description: Passen Sie Ihre Vereinsidentität mit individuellen Brettfarben und Logo an.
      icon: tabler:palette
    - title: Mengenrabatt
      description: Mengenrabatte für Flottenbestellungen von 10 Platinen.
      icon: tabler:discount
    - title: Schnelle Teile
      description: Ersatzteile werden innerhalb von 48 Stunden versandt.
      icon: tabler:truck-delivery
    - title: Unterstützung beim Clubwachstum
      description: Ratschläge zu Mitgliedschaftsprogrammen, Preisgestaltung und Veranstaltungsorganisation.
      icon: tabler:trending-up
    - title: CE-zertifiziert
      description: Alle Geräte entsprechen den internationalen Sicherheitsstandards.
      icon: tabler:certificate
cta:
  title: Bereit, deinen Paddelclub zu gründen?
  subtitle: Holen Sie sich Ihr Club-Flottenangebot oder laden Sie unseren Club-Einsteigerleitfaden herunter.
  actions:
    - text: Für Club-Flotte bewerben
      href: /contact?package=club
      variant: primary
    - text: Club-Leitfaden herunterladen
      href: /resources/download-catalog
      variant: secondary

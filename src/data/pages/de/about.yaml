features3_what_we_build:
  title: Was wir bauen
  subtitle: >-
    Wir begannen in einer Küstenwerkstatt mit einem Board und einer unbeirrbaren Überzeugung: Marineprodukte sollten so konstruiert sein, als ob es darauf ankommt — denn das tun sie. Heute liefern wir in über 40 Länder, aber jeder Rumpf durchläuft noch immer dieselben Hände, die das Unternehmen
    gegründet haben.
  columns: 3
  isBeforeContent: true
  items:
    - title: SUP-Boards
      description: Aufblasbare SUP-Boards von 9 ft bis 12 ft. Konzipiert für Touring, Yoga, Angeln und Familiennutzung.
      icon: tabler:ship
    - title: Aufblasbare SUPs
      description: PVC-SUP-Boards von 9 ft bis 12 ft. Leicht, robust und einfach zu verstauen.
      icon: tabler:rowing
    - title: Premium SUP-Pakete
      description: Kompakte, hochspezifizierte SUPs, maßgeschneidert nach Ihren Marken- oder Flottenanforderungen.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Zubehör
      description: Paddel, Pumpen, Abdeckungen, Trockentaschen und Elektronik. Alle auf unsere Boards abgestimmt.
      icon: tabler:package
    - title: Reparatur & Service
      description: Interne Boardreparatur, Pad-Ersatz und Zubehör-Upgrades.
      icon: tabler:tool
    - title: Sonderanfertigungen
      description: Projektbezogenes Design für gewerbliche, wissenschaftliche und militärische Kunden.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Board-Design- und Engineering-Diskussion

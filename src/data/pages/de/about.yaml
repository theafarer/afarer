meta:
  title: 'Über afarer — Inflatable SUP- & Wassersportmarke | {SITE}'
  description: 'afarer ist eine globale Inflatable-SUP- und Wassersportmarke, betrieben von Aquafarer LLC (USA) und umgesetzt von unserem Qingdao-Opérationsteam. Entdecken Sie unsere Geschichte, Ingenieurskunst, zertifizierte Qualität und Länderpartnerprogramme.'
  keywords:
    - 'Inflatable-SUP-Marke'
    - 'Wassersportmarke'
    - 'SUP-Landesdistributor'
    - 'Co-Branded-SUP-Kollektionen'
hero:
  tagline: Über uns
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer Werkstatt
  title: |
    Marinetechnik, <br />
    auf die <span class="text-accent dark:text-white">afarer</span>-Art
  subtitle: >-
    Wir begannen in einer Küstenwerkstatt mit einem Board und einer unbeirrbaren Überzeugung: Marineprodukte sollten so konstruiert sein, als ob es darauf ankommt — denn das tun sie. Heute liefern wir in über 40 Länder, aber jeder Rumpf durchläuft noch immer dieselben Hände, die das Unternehmen
    gegründet haben.

meta:
  title: SUP Einzelhandelspartnerprogramm | {SITE}
  description: SUP-Großhandels-Partnerprogramm für Einzelhändler und Sportgeschäfte. Vollständige Produktpalette, Dropshipping-Optionen, wettbewerbsfähige Großhandelsmargen von 20–35 % und niedrige Mindestbestellmenge zum Start.
hero:
  tagline: Einzelhandelspartner
  title: Verkaufen Sie aufblasbare Premium-SUP-Boards<br />mit Margen, die sich rechnen
  subtitle: Werden Sie Einzelhandelspartner von Afarer — führen Sie die am schnellsten wachsende SUP-Marke in Ihrem Markt mit vollständigen Großhandelspreisen, Dropshipping, professionellem Marketingmaterial und dediziertem Support.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Afarer SUP-Boards, die in einem Einzelhandelsgeschäft ausgestellt sind
margin_section:
  title: Einzelhandelsmargen & Mindestbestellmenge
  subtitle: Großhandelspreisstufen, die auf die Rentabilität des Einzelhandels ausgelegt sind.
  items:
    - tier: Basispartner
      discount: 20%
      moq: 500 Einheiten/Jahr
      margin_note: ~150–250 $ Gewinn pro Brett
      features:
        - Zugang zur gesamten Produktpalette
        - Marketingmaterialien-Paket
        - E-Mail-Support
        - Produktkatalogzugang
    - tier: Premium-Partner
      discount: "30\_%"
      moq: 2.000 Einheiten/Jahr
      margin_note: ~250–400 $ Gewinn pro Brett
      features:
        - Dedizierter Kundenbetreuer
        - Exklusiver Gebietsschutz
        - Individuelle Marketingunterstützung
        - Erster Zugriff auf neue Produkte
        - Mitarbeiterschulungen
    - tier: Leitpartner
      discount: 35%
      moq: 5.000 Einheiten/Jahr
      margin_note: "~350–500\_$ Gewinn pro Brett"
      features:
        - Co-Branding-Marketingkampagnen
        - Unterstützung für Verkaufsflächenanzeigen
        - Vor-Ort-Mitarbeiterschulung
        - Gemeinsame Social-Media-Werbeaktionen
        - Prioritätsproduktionszuweisung

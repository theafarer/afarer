intro: >-
  Der Rumpf ist das Rückgrat eines jeden RIB- oder Schlauchbootes. Er muss leicht genug sein, um effizient zu gleiten, stark genug, um Aufpralllasten zu absorbieren, und dimensionsstabil über einen weiten Temperaturbereich. Bei Afarer kombiniert unser Hull Engineering Studio fortschrittliche
  CAD-Modellierung, Finite-Elemente-Analyse (FEA) und jahrzehntelange praktische Erfahrung in der Schiffbaukunst, um Rümpfe zu liefern, die für ihre jeweilige Mission optimiert sind – nicht generische Formen, die aus einem Katalog angepasst wurden.
content_html: >
  <h2>Wo Stärke auf Hydrodynamik trifft</h2>

  <p>Wir arbeiten mit drei primären Rumpfwerkstoffen — rotationalgeformtem HDPE, geschweißtem marinequalifiziertem Aluminium und handgelegtem glasfaserverstärktem Kunststoff — und verfügen über die ingenieurtechnische Fähigkeit, jeden einzelnen in-house zu konstruieren, zu simulieren und zu
  validieren.</p>


  <h2>Konstruktionswerkzeuge und Normen</h2>

  <p>Unsere digitale Ingenieurmgebung umfasst:</p>

  <table>
    <thead><tr><th>Fähigkeit</th><th>Software / Werkzeug</th><th>Anwendung</th></tr></thead>
    <tbody>
      <tr><td>3D-parametrische Modellierung</td><td>SolidWorks Professional</td><td>Rumpfoberfläche, Stringersystem, Motorhalterung, Deckslayout</td></tr>
      <tr><td>Finite-Elemente-Analyse</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Spannungsverteilung, Modalanalyse, Aufprall-/Kollisions-Simulation</td></tr>
      <tr><td>Numerische Strömungsmechanik</td><td>Ansys Fluent / Star-CCM+</td><td>Vorhersage des hydrodynamischen Widerstands, Trimmoptimierung</td></tr>
      <tr><td>Laminatkonstruktion</td><td>ESAComp / CADEC</td><td>Glasfaser-Schichtstapelung, Kernmaterialauswahl, Gewichtsschätzung</td></tr>
      <tr><td>Spritzguss-Simulation</td><td>Moldex3D</td><td>Vorhersage der Wandstärke beim Rotationsgießen</td></tr>
    </tbody>
  </table>


  <h2>Unser ingenieurtechnischer Workflow</h2>

  <p>Jede Rumpfkonstruktion, ob Standardmodell oder vollständiges Individualprojekt, durchläuft einen strengen fünfstufigen Prozess:</p>

  <ol>
    <li><strong>Konzept &amp; Anforderungserfassung</strong> — Wir treffen uns mit Ihnen, um Nutzlast, Geschwindigkeitsbereich, Seegangsverhalten, Abschleppanforderungen und jede besondere Missionsausrüstung (Decksluken, Konsolenpositionen, Kraftstofftankintegration) zu definieren.</li>
    <li><strong>3D-Modellierung &amp; hydrostatische Berechnung</strong> — Die Rumpfform wird in SolidWorks modelliert und auf hydrostatische Stabilität (GM, Aufrichtungsarm) mit integrierten Analysewerkzeugen geprüft.</li>
    <li><strong>Strukturelle FEA</strong> — Lastfälle werden definiert: statisch (Crew + Ausrüstung), dynamisch (Planungsaufprall bei 5g) und Schlaglast (Absturz von einem Wellenkamm mit 3 m/s). Spannungskonturen werden überprüft; ein Sicherheitsfaktor ≥ 2,5 ist zwingend vorgeschrieben.</li>
    <li><strong>CFD-Widerstandsoptimierung</strong> — Der Rumpf wird bei drei Beladungszuständen und fünf Geschwindigkeiten simuliert. Benetzungsfläche, Trimhwinkel und Restwiderstand werden iterativ reduziert.</li>
    <li><strong>Konstruktionsprüfung &amp; Freigabe</strong> — Das vollständige Ingenieurpaket (3D-Modell, FEA-Bericht, CFD-Bericht, Gewichtsschätzung, Stapelbuch) wird von unserem Senior-Schiffbauingenieur geprüft, bevor es an die Prototypenwerkstatt freigegeben wird.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA Spannungsverteilung — RIB 450 Patrouillenrumpf (Aluminium 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2,8 : 1</span>
        <span class="text-gray-500">Sicherheitsfaktor bei max. Nutzlast</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15,2 %</span>
        <span class="text-gray-500">Widerstandsreduktion gegenüber Vorgängergeneration</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Spitzen-Schlagdruck (Begrenzungswert)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Kumulierte FEA-Laufzeit im Jahr 2025</span>
      </div>
    </div>
  </div>


  <h2>Individualisierung: Ihr Rumpf, Ihre Regeln</h2>

  <p>Kein zwei Betreiber haben identische Anforderungen. Ein Hafen-Patrouillen-RIB benötigt einen Rumpf mit flachem V für Stabilität bei niedriger Geschwindigkeit; ein Schnelleinsatzboot braucht ein tiefes V mit Sprayleisten; ein Tauchunterstützungsboot benötigt eine große Breite und einen niedrigen
  Heckspiegel. Wir zwingen Ihre Anwendung nicht in eine vorgefertigte Rumpfform. Wir gestalten ausgehend von Ihrer Spezifikation nach oben.</p>

  <p>Beispiele aktueller individueller Rumpfprojekte:</p>

  <ul>
    <li>Ein verlängerter 6,8 m HDPE-Rumpf für einen karibischen Touranbieter, mit verstärktem Bug für Strandlandungen (+15 % Bodenstärke).</li>
    <li>Ein leichter Aluminium-RIB mit 7,2 m für eine Küstenwache, mit integrierten Kraftstofftankschalldämpfern und Ausrüstungsfach-Versteifungen.</li>
    <li>Ein glasfaserverstärkter 5,5 m Tauchboot mit abgesenktem Heckspiegel und doppelten Batteriekästen, konzipiert für das einfache Wiedereinsteigen von Schnorchlern.</li>
  </ul>


  <h2>Unsere Ingenieure</h2>

  <p>Das Studio wird von einem Senior-Schiffbauingenieur mit 14 Jahren Erfahrung in der Konstruktion von Hochgeschwindigkeitsfahrzeugen geleitet, unterstützt von zwei Maschbauingenieuren mit Spezialisierung auf FEA und CFD. Alle drei verfügen über einen Abschluss in Marineingenieurwesen oder
  Schiffbau von international anerkannten Universitäten. Das Team veröffentlicht regelmäßig in Fachzeitschriften und präsentiert auf Konferenzen wie der International Conference on High-Performance Marine Vehicles.</p>


  <h2>Partnerschaft mit uns für Ihren nächsten Rumpf</h2>

  <p>Vom ersten Konzeptentwurf bis zum finalen Spannungsbericht ist unser Hull Engineering Studio Ihr Partner bei der Schaffung eines Bootes, das nicht nur gebaut — sondern konstruiert ist. Wir investieren die Simulationsstunden im Voraus, damit jede Schweißnaht, jede Laminatschicht und jede Kurve
  des Rumpfs einen Grund hat.</p>

  <p>Ob Sie eine geringfügige Änderung an einem bestehenden Modell oder ein völlig neues Konzept benötigen — wir sind bereit, Ihre Anforderungen zu besprechen.</p>

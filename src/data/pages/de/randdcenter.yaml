capabilities:
  tagline: Fähigkeiten
  title: F&E-Fähigkeiten
  subtitle: Vier Kerndisziplinen, die uns eine durchgehende Kontrolle über die Produktentwicklung geben – von der Rohstoffforschung bis zur endgültigen Zertifizierung.
  groups:
    - title: Materialwissenschaft & Gewebetechnologie
      items:
        - Analyse und Optimierung von PVC- und Hypalon-Formulierungen
        - UV-Stabilisierung, Flammschutz und Entwicklung antimikrobieller Zusatzstoffe
        - Mehrschichtige Stofflaminierung und Klebtechnik
        - Beschleunigte Alterungstests (UV, thermisch, Feuchtigkeit, Salzsprühnebel)
    - title: Rumpfkonstruktion & Hydrodynamik
      items:
        - Parametrisches 3D-Rumpfdesign und CFD-Optimierung
        - Finiten-Elemente-Analyse für strukturelle und Stoßlasten
        - Modellschleppbeckenprüfung und Leistungsvalidierung
        - Maßgeschneiderte Rumpfentwicklung für spezielle Einsatzprofile
    - title: Schweiß- und Verbindungstechnik
      items:
        - Entwicklung und Optimierung des RF-Dielektrikschweißprozesses
        - Heißluft-, Heißkeil- und Ultraschallschweißverfahren
        - Kleben und Nahtbandqualifizierung
        - Schweißnahtfestigkeitsmodellierung und Lebensdauerprognose
    - title: Prüfung, Zertifizierung & Konformität
      items:
        - Qualitätsmanagement und CE-Konformitätstests
        - Unterstützung durch unabhängige Tests und Zertifizierungen durch Dritte
        - Entwicklung eines kundenspezifischen Testprotokolls für die Beschaffungsqualifikation
        - Fehleranalyse im Einsatz und Ursachenuntersuchung

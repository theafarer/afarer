vision:
  tagline: Unsere Vision
  title: Die Zukunft des Wassersports gestalten
  body: >-
    afarer strebt danach, die Branche für aufblasbare Boote und SUP durch kontinuierliche Innovation, unerschütterliche Qualität und ein festes Engagement für Sicherheit und Nachhaltigkeit zu führen — letztendlich bereichert er die Erfahrungen von Wassersportbegeisterten weltweit. Das afarer
    F&E-Zentrum ist der Ort, an dem Leidenschaft auf Innovation trifft und neue Maßstäbe für die Wassersportbranche setzt.
labs_section:
  tagline: Labore
  title: Unsere Labore
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC-Gewebe-Labor
      description: Kontinuierliche Forschung und Testung von PVC- und Hypalon-Schlauchgeweben auf Zugfestigkeit, UV-Beständigkeit, Abrieb und Flexibilität bei niedrigen Temperaturen, um langfristige Zuverlässigkeit in marinen Umgebungen sicherzustellen.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Hull Ingenieurstudio
      description: CAD-gesteuertes Design und Finite-Elemente-Analyse von Rümpfen aus HDPE, Aluminium und Fiberglas. Jeder Rumpf wird digital auf Spannungsverteilung und Aufprallresistenz simuliert, bevor der erste Prototyp gebaut wird.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: RF-Schweißzentrum
      description: Speziell eingerichtete Hochfrequenz-Schweißanlage mit präziser Temperatur- und Druckregelung, die hochfeste, luftdichte Nähte produziert, die den Standards der Schifffahrtsindustrie für aufblasbare Geräte entsprechen.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Hydrodynamischer Testtank
      description: Modellversuche in unserem hauseigenen Testtank zur Optimierung der Rumpfform, des Gleitverhaltens, der Stabilität und der Kraftstoffeffizienz unter verschiedenen Lade- und Seebedingungen.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: Prototyp-Werkstatt
      description: Vollständig ausgestattete Prototypen- und Rigg-Einrichtung, in der neue Modelle gebaut, eingerichtet und zur Seetüchtigkeitsprüfung erprobt werden. Jeder Prototyp durchläuft ein mindestens 20-stündiges Wasser-Testprogramm, bevor die Produktionsfreigabe erfolgt.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Qualitäts- und Prüflabor
      description: Dediziertes Qualitätssicherungslabor, das Zugprüfungen, Luftdichtigkeitszyklustests, Nahtlösetests und Materialzertifizierungen durchführt, um sicherzustellen, dass jedes Boot, das die Werkstatt verlässt, unseren veröffentlichten Spezifikationen entspricht.
      href: /randdcenter/quality-inspection-lab

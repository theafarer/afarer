meta:
  title: F&E-Zentrum | {SITE}
  description: Forschung & Entwicklung — PVC-Gewebeprüfung, Rumpfkonstruktion, RF-Schweißen, hydrodynamische Tests und Qualitätskontrolle. Maßgeschneiderte F&E-Dienstleistungen verfügbar.
hero:
  tagline: Forschungs- und Entwicklungszentrum
  title: F&E-Zentrum
  subtitle: Auf Fortschritt fokussiert
intro:
  - >-
    Das Forschungs- und Entwicklungszentrum (F&E) von Afarer ist die treibende Kraft hinter unserer Mission, Wassersportgeräte zu revolutionieren. Wir befähigen Wassersportbegeisterte weltweit mit sichereren, komfortableren und angenehmeren Produkten durch unermüdliche Innovationen bei aufblasbaren
    Stand-Up-Paddle-Boards (SUPs) und Booten. Unser engagiertes Team aus Ingenieuren, Designern und leidenschaftlichen Wassersportexperten gestaltet die Zukunft der Branche und hebt kontinuierlich den Standard für Qualität, Leistung und Nachhaltigkeit an.
  - >-
    Unsere F&E-Einrichtung bringt Materialwissenschaftler, Schiffsarchitekten und Produktionstechniker unter einem Dach zusammen. Von der Materialzusammensetzungsformulierung und Rumpfsimulation bis hin zur Entwicklung von Schweißverfahren und großangelegten Seetests wird jede Phase der
    Produktentwicklung von Daten gesteuert und durch Tests validiert.
mission:
  tagline: Unsere Mission
  title: Die Zukunft des Wassersports innovativ gestalten
  pillars:

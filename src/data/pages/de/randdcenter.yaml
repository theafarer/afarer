pillars:
  - title: Technologischer Fortschritt
    desc: Pionierarbeit bei neuen Materialien, Designs und Herstellungsverfahren, um überlegene Produktleistung und Langlebigkeit zu gewährleisten.
    icon: tech
  - title: Fortgeschrittene Materialien
    desc: Untersuchung modernster PVC-, Hypalon-, Verbundwerkstoffe und nachhaltiger Alternativen zur Verbesserung der Produkteigenschaften.
    icon: materials
  - title: Nachhaltigkeit

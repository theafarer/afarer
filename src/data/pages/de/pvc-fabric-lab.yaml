intro: >-
  Das Schlauchbootgewebe ist das wichtigste Material in einem Schlauchboot. Es muss ständiger UV-Bestrahlung, wiederholten Aufpumpzyklen, Abrieb durch Stege und Trümmer sowie extremen Temperaturschwankungen standhalten – und dabei über Jahre hinweg seine strukturelle Integrität bewahren. Bei
  {SITE.name} ist unser PVC-Gewebelabor ausschließlich der Charakterisierung, Validierung und kontinuierlichen Verbesserung der Gewebe gewidmet, die wir in jedem von uns gebauten Boot verwenden.
content_html: >
  <h2>Die Grundlage jedes Schlauchboots</h2>

  <p>Wir stützen uns nicht ausschließlich auf Lieferanten-Datenblätter. Jede Charge PVC- und Hypalon-Gewebe, die unsere Werkstatt erreicht, wird unabhängig im eigenen Labor getestet. Dies garantiert, dass die von uns veröffentlichte Materialspezifikation genau der Materialleistung entspricht, die
  Sie erhalten — Charge für Charge, Jahr für Jahr.</p>


  <h2>Standardisierte Prüfgeräte</h2>

  <p>Unser Gewebelabor ist mit industriellen Prüfgeräten ausgestattet, die den ISO-, ASTM- und EN-Prüfmethoden entsprechen:</p>

  <table>
    <thead><tr><th>Gerät</th><th>Gemessene Parameter</th><th>Norm</th></tr></thead>
    <tbody>
      <tr><td>Universal-Zugfestigkeitsprüfer (50 kN)</td><td>Bruchkraft, Bruchdehnung, Weiterreißfestigkeit</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>Xenonbogen-Wetterkammer</td><td>UV-Beständigkeit (Farbänderung, Festigkeitsrückhalt nach 2000 h)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>Tiefkühl-Beugeprüfer</td><td>Risspunkt bei −30 °C bis −50 °C</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Taber-Verschleißprüfer</td><td>Gewichtsverlust nach 1000 Zyklen (CS-10-Rad)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>Dickenmessgerät (digital, 0,001 mm Auflösung)</td><td>Gleichmäßigkeit über die Rollenbreite</td><td>ISO 2286-3</td></tr>
      <tr><td>Druckwasserstandsprüfer</td><td>Wasserpenetrationsbeständigkeit</td><td>ISO 811</td></tr>
    </tbody>
  </table>

  <p class="text-sm text-gray-500">* Alle Geräte werden jährlich von akkreditierten Drittlaboren kalibriert.</p>


  <h2>Von Daten zur Entscheidung: ein typischer Prüfablauf</h2>

  <p>Wenn ein neues Gewebekandidat eintrifft, durchläuft er einen standardisierten siebenstufigen Qualifizierungsprozess:</p>

  <ol>
    <li><strong>Eingangsprüfung</strong> — Visuelle Kontrolle auf Oberflächenfehler, Nährlöcher und Maßhaltigkeit.</li>
    <li><strong>Dickenvermessung</strong> — 20-Punkte-Messung über die Rolle; CV &lt; 3 % ist für die Annahme erforderlich.</li>
    <li><strong>Zugversuch</strong> — 5 Prüfkörper in Kett- und Schussrichtung. Mindestens 3500 N/50 mm für 1100 dtex PVC.</li>
    <li><strong>UV-Konditionierung</strong> — 1000 h Belichtung in der Xenonbogen-Kammer; mindestens 80 % Festigkeitsrückhalt erforderlich.</li>
    <li><strong>Kälteriss</strong> — 4 h bei −35 °C, dann 180°-Biegung über einen 25-mm-Mandrel. Keine sichtbaren Risse.</li>
    <li><strong>Verschleißbeständigkeit</strong> — 1000 Zyklen, Gewichtsverlust ≤ 0,05 g.</li>
    <li><strong>Freigabegenehmigung</strong> — Erst wenn alle sieben Prüfstellen bestanden sind, wird das Gewebe für die Produktion freigegeben.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Typisches PVC 1100 dtex — Zugfestigkeitsrückhalt nach UV-Belichtung</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 h<br />100 %</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 h<br />95 %</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 h<br />88 %</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 h<br />82 %</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">Wettbewerb<br />~65 %</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Unser PVC 1100 dtex-Gewebe behält &gt; 80 % Zugfestigkeit nach 2000 h Xenonbogen-Belichtung, verglichen mit typischen Industriequalitäten, die unter 70 % absinken.</p>
  </div>


  <h2>Unser professionelles Team</h2>

  <p>Das Labor wird von zwei Vollzeit-Materialingenieuren betrieben, die jeweils einen Abschluss in Polymerwissenschaft oder Textiltechnik mit mindestens sechs Jahren Berufserfahrung vorweisen. Sie werden von drei Technikern unterstützt, die die täglichen Tests und Datenerfassungen durchführen. Das
  Team nimmt regelmäßig an interlaboratorischen Ringversuchen teil, die von der Internationalen Organisation für Normung (ISO) organisiert werden, um die Genauigkeit unserer Prüfmethoden zu validieren.</p>


  <h2>Lösung Ihrer anspruchsvollsten Materialherausforderungen</h2>

  <p>Jede maritime Umgebung ist anders. Ein Patrouillenboot im Persischen Golf ist erheblich anderen UV- und Temperaturbedingungen ausgesetzt als ein Rettungsboot in der Nordsee. Unser Gewebelabor unterstützt Sie bei der Auswahl — oder Entwicklung — einer Gewebespezifikation, die auf Ihr
  Einsatzprofil optimiert ist.</p>

  <p>Aktuelle individuelle Lösungen umfassen:</p>

  <ul>
    <li>Eine hochverschleißfeste PVC-Mischung für einen militärischen Kunden, dessen Boote regelmäßig auf Korallenriffen stranden (+40 % Verschleißlebensdauer).</li>
    <li>Eine Hypalon-Formulierung für Tieftemperaturen für eine arktische Forschungsstation, getestet bis −50 °C ohne Versprödung.</li>
    <li>Ein farbstabilisiertes orangefarbenes Gewebe für eine Such- und Rettungsflotte, das nach 3 Jahren tropischer Sonnenexposition seine Sichtbarkeit beibehält.</li>
  </ul>

  <p>Wir verkaufen keine fertigen Gewebe und hoffen, dass sie funktionieren. Wir testen, validieren und empfehlen — oder entwickeln — eine maßgeschneiderte Lösung für Ihr spezifisches Einsatzprofil. Das ist der {SITE.name}-Unterschied.</p>


  <h2>Wie wir Sie betreuen</h2>

  <p>Wenn Sie eine Materialherausforderung an uns herantragen, können Sie Folgendes erwarten:</p>

  <ol>
    <li><strong>Beratung</strong> — Wir besprechen Ihre Einsatzumgebung, Leistungsziele und Ihr Budget.</li>
    <li><strong>Angebot</strong> — Ein Prüfplan wird mit klaren Bestehen/Nicht-bestehen-Kriterien und einem Zeitplan erstellt.</li>
    <li><strong>Durchführung</strong> — Unser Labor führt die Tests durch und erstellt einen detaillierten Bericht mit Rohdaten und Vergleichsanalyse.</li>
    <li><strong>Empfehlung</strong> — Wir legen eine Gewebespezifikation vor, einschließlich alternativer Optionen, falls mehrere Materialien Ihre Anforderungen erfüllen.</li>
    <li><strong>Nachbetreuung</strong> — Nach der Lieferung stehen wir Ihnen für Rückfragen zum Material im Einsatz zur Verfügung.</li>
  </ol>

  <p>Unser Ziel ist es nicht einfach, Ihnen ein Boot zu verkaufen. Es ist sicherzustellen, dass das Boot, das Sie erhalten, zuverlässig unter den Bedingungen arbeitet, in denen Sie es einsetzen — und das beginnt mit dem Gewebe.</p>

features3_cases:
  tagline: 'Ausgewählte Fälle'
  title: 'Maßgeschneiderte Lösungen<br />für echte Herausforderungen'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Europäische Tauchcenter-Flotte'
      description: 'Lieferung von 12 SUP 520 tauchkonfigurierten Booten an eine Mittelmeer-Tauchcenter-Kette. Kundenspezifische Tankhalterungen, Tauchleitern und Flottenbranding. Lieferung in 60 Tagen.'
      icon: tabler:lifebuoy
    - title: 'Australisches Distributor-OEM-Programm'
      description: 'Entwicklung einer Eigenmarken-SUP-Board-Reihe für einen australischen Wassersportdistributor. 8 Modelle, individuelle Verpackung und Drop-Ship-Logistik. Vom Konzept zur ersten Lieferung in 90 Tagen.'
      icon: tabler:currency-dollar
    - title: 'Rettungsbootlieferung Nahost'
      description: 'Lieferung von 20 SUP 450 Patrol-Booten an eine Zivilschutzorganisation im Nahen Osten. Selbstlenzende Decks, vollständige Navigationsausrüstung und hochsichtbare orange Schläuche. Einhaltung lokaler Vorschriften.'
      icon: tabler:alert-triangle
    - title: 'Europäische OEM-Markenpartnerschaft'
      description: 'Weißlabel-Fertigungspartnerschaft mit einer europäischen Marine-Marke. 5 SUP-Modelle, Eigenmarken, exklusive Vertriebsrechte für den EU-Markt. Mehrjahresvereinbarung.'
      icon: tabler:building
    - title: 'Karibik-Resort-Flotte'
      description: 'Komplettes Wassersportausrüstungspaket für ein karibisches Resort: 40 SUP-Boards, 20 Kajaks, 10 Schlauchboote und Zubehör. Kundenspezifisches Resort-Branding auf allen Geräten.'
      icon: tabler:beach
    - title: 'US-Küstenpatrouillenvertrag'
      description: 'Lieferung von SUP 600 Patrouillenbooten an eine US-Küstensicherheitsbehörde. Zweimotorenkonfiguration, gepanzerte Konsolenoptionen und militärische Elektronikintegration.'
      icon: tabler:shield

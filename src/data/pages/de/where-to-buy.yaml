meta:
  title: Afarer aufblasbare Paddleboards kaufen | Afarer
  description: Erfahre, wie du ein aufblasbares Afarer Paddleboard kaufst — über einen offiziellen Landesdistributor oder direkt vom Afarer-Team.
hero:
  tagline: Wo kaufen
  title: Bring dein Afarer SUP aufs Wasser
  subtitle: Afarer-Boards erreichen Paddler in über 50 Ländern. Finde den einfachsten Weg zu deinem Board — über einen offiziellen Händler in deiner Nähe oder direkt vom Afarer-Team.
channels:
  items:
    - title: Offizielle Landesdistributoren
      description: Afarer arbeitet mit exklusiven Distributoren in vielen Ländern. Sag uns, wo du paddelst, und wir verbinden dich mit deinem lokalen Händler, Preisen und Verfügbarkeiten.
      cta: Finde deinen lokalen Händler
      href: /contact/?subject=Where to Buy
    - title: Direkt bei Afarer bestellen
      description: Noch kein Distributor in deinem Land? Das Afarer-Team organisiert Direktbestellungen und Versand, damit du überall aufs Wasser kommst.
      cta: Verfügbarkeit anfragen
      href: /contact/?subject=Where to Buy
form_intro:
  title: Verfügbarkeit erfragen
  subtitle: Schick uns eine Nachricht mit deinem Land und dem Board, das dich interessiert. Unser Team antwortet innerhalb eines Werktags mit dem nächstgelegenen Händler oder Direktbestell-Optionen.
business_note:
  text: Du kaufst für einen Club, ein Resort oder ein Geschäft? Entdecke unsere Business- und Partnerprogramme.
  cta: Für Geschäftspartner
  href: /solutions/

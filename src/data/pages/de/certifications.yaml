meta:
  title: 'Zertifizierungen — CE, ISO 9001 & Konformität | {SITE}'
  description: 'Qualitätszertifizierungen von afarer: CE (EN ISO 25649), ISO 9001:2015, BSCI. Konformität und Sicherheit für einen Hersteller aufblasbarer SUPs.'
  keywords:
    - 'CE-Zertifizierung SUP'
    - 'ISO 9001 SUP'
    - 'nautische Konformität'
    - 'Paddleboard-Zertifizierung'
hero:
  tagline: Zertifizierungen & Standards
  title: Qualitätszertifizierungen<br />& Compliance-Standards
  subtitle: afarer-Produkte werden nach internationalen maritimen Sicherheitsstandards, Qualitätsmanagementsystemen und Umweltvorschriften hergestellt.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: Seefahrer-Qualitätszertifikate und Konformitätsdokumentation
content_certifications:
  tagline: Unsere Zertifizierungen
  title: Zertifizierte Qualität,<br />Weltweit anerkannt
  subtitle: Jedes afarer-Produkt wird durch Zertifizierungen gestützt, die unser Engagement für Qualität, Sicherheit und Umweltverantwortung belegen.
  items:
    - title: CE-zertifiziert
      description: Alle afarer-Produkte erfüllen die CE-Kennzeichnungsanforderungen für Freizeitwasserfahrzeuge.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Unser QMS ist ISO 9001:2015 zertifiziert und deckt Design, Fertigung und Vertrieb aufblasbarer Wasserfahrzeuge und Marineausrüstung ab.
      icon: tabler:clipboard-check
    - title: UKCA-gekennzeichnet
      description: Im UK-Markt verkaufte Produkte tragen die UKCA-Kennzeichnung.
      icon: tabler:shield
    - title: BSCI-konform
      description: afarer ist BSCI-auditiert für ethische Fertigung, faire Arbeitsbedingungen und Lieferkettenverantwortung.
      icon: tabler:heart-handshake
    - title: REACH-konform
      description: Alle in afarer-Produkten verwendeten Materialien entsprechen der EU-REACH-Verordnung
      icon: tabler:flask
    - title: Materialprüfung
      description: Gewebe werden auf Zugfestigkeit, Weiterreiß, UV und Kältebruch geprüft. Jede Charge wird beprobt.
      icon: tabler:test-pipe
content_factory:
  tagline: Werksstandards
  title: Fertigungsqualität<br />— Nach Spezifikation
  subtitle: Unsere 12.000 m² Anlage arbeitet nach strengen Qualitätskontrollprotokollen.
  list:
    - 'Eingangsprüfung: Alle Rohmaterialien – PVC-Gewebe, EVA-Schaum, Klebstoffe, Beschläge – werden vor der Produktion gegen Spezifikationen geprüft'
    - 'Prozessbegleitende Qualitätskontrolle: Jede Produktionsstufe hat dokumentierte QS-Prüfpunkte'
    - 'Druckprüfung: Jede aufblasbare Kammer wird bei 1,25-fachem Nenndruck 24–48 Stunden lang geprüft'
    - 'Endprüfung: Fertigprodukte werden auf Maßgenauigkeit, Oberflächenqualität und Funktionalität geprüft'
    - 'Chargenrückverfolgbarkeit: Jedes Produkt trägt eine Seriennummer, die mit Produktionschargen verknüpft ist'
content_safety:
  tagline: Marine Sicherheitsstandards
  title: Sicherheit zuerst<br />— Für zuverlässigen Betrieb
  subtitle: afarer-Produkte werden entwickelt und geprüft, um internationale maritime Sicherheitsstandards zu erfüllen.
  items:
    - title: EN ISO 25649
      description: Aufblasbare SUPs entsprechen EN ISO 25649 für Konstruktion, Stabilität, Auftrieb und Tragfähigkeit.
      icon: tabler:sailboat
    - title: SOLAS-Konformität
      description: Sicherheitsausrüstung und Rettungsgeräte erfüllen SOLAS-Anforderungen.
      icon: tabler:lifebuoy
cta:
  title: Benötigen Sie zertifizierte Produkte?
  subtitle: Kontaktieren Sie uns für Zertifizierungsanforderungen, Dokumentation und Compliance.
  actions:
    - variant: primary
      text: Zertifizierungsunterlagen anfordern
      href: /contact/
    - text: Unsere Qualitätsseite anzeigen
      href: /quality/

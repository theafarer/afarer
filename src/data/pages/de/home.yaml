business_solutions:
  tagline: Wie wir helfen
  title: Ihr Partner von der Konzeptionsphase bis zum Umsatz
  subtitle: Vier Kernkompetenzen, die Wasserunternehmen dabei helfen, zu starten, zu operieren und zu wachsen.
  items:
    - title: Professionelle Ausrüstung
      description: SUP-Boards in kommerzieller Qualität, entwickelt für den täglichen Verleih, 500 Zyklen bei minimalem Wartungsaufwand.
      icon: tabler:shield-check
    - title: Co-Brand-Editionen
      description: Limitierte Co-Branding-Kollektionen, gemeinsam mit afarer entworfen, konstruiert und gebaut — für Partner, die mehr als ein Katalogprodukt wollen.
      icon: tabler:package
    - title: Geschäftsunterstützung
      description: Mitarbeiterschulung, Marketingmaterialien, Ersatzteilprogramme und dediziertes Kundenmanagement.
      icon: tabler:headset
    - title: Globale Logistik
      description: FOB Qingdao, CIF wichtige Häfen, Tür-zu-Tür-Lieferung in über 50 Länder mit Zollunterstützung.
      icon: tabler:truck-delivery
oem_section:
  tagline: Co-Brand-Kollektionen
  title: Von der Idee aufs Wasser — Co-Branded Editionen
  subtitle: 'Für Partner, die mehr als ein Katalogprodukt wollen: limitierte Co-Branding-Kollektionen, entworfen, konstruiert und gemeinsam mit afarer gebaut — jedes Board bleibt ein afarer-Produkt.'
  steps:
    - number: '01'
      title: Idee & Brief
      desc: Teilen Sie Ihre Vision, Ihren Zielmarkt und Ihre Spezifikationen.
    - number: '02'
      title: Design & Technik
      desc: 3D-Modellierung, Materialauswahl und individuelles Grafikdesign.
    - number: '03'
      title: Prototyp erstellen & validieren
      desc: Musterproduktion mit CE-Zertifizierung und Qualitätsprüfung.
    - number: '04'
      title: Massenproduktion
      desc: Vollständige Produktion mit Inline-Qualitätskontrolle und Unterstützung bei Werksprüfungen.
    - number: '05'
      title: Globale Lieferung
      desc: FOB Qingdao Logistik, CIF Hauptports, Tür-zu-Tür.
  cta: Co-Branding entdecken
  cta_link: /co-brand
cta:
  title: |
    Bereit, Ihr <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">nächstes Boot</span> zu konfigurieren?
  subtitle: Teilen Sie uns mit, wie Sie Ihr Boot nutzen, und wir empfehlen Ihnen innerhalb eines Werktags ein Modell, Optionen und einen Preis.
  actions:
    - variant: primary
      text: Angebot anfordern
      href: /contact
      icon: tabler:message-circle
    - text: Katalog durchstöbern
      href: /products
distributor:
  tagline: Länder-exklusive Distributoren
  title: Ein Land. Ein offizieller afarer-Distributor.
  subtitle: Ein Programm mit einem autorisierten Distributor pro Land, Gebietsexklusivität, Händlerpreisen, Marketing-Support und einem dedizierten Distributor Success Program.
  benefits:
    - title: Gebietsexklusivität
      description: Ein autorisierter Distributor pro Land oder Region — kein interner Wettbewerb, keine Kanal-Konflikte.
    - title: Margen direkt ab Werk
      description: Distributoren-Preislisten und jährliche Rückvergütungen auf vereinbarte Mengen, versendet FOB Qingdao.
    - title: 'Marketing- & Trainings-Support'
      description: Co-Branding-Assets, Dealer-POS-Materialien, Produktschulungen und Launch-Kampagnen.
    - title: Dediziertes Account-Team
      description: Ein persönlicher Distributor-Manager plus Onboarding-, Forecast- und Nachbestellungs-Support.
  actions:
    - variant: primary
      text: Distributor werden
      href: /distributor-program
    - text: Händlerpreisliste anfordern
      href: /contact?subject=Dealer Price List
    - text: Landespartnerschaft beantragen
      href: /contact?subject=Country Partnership Application
    - text: Distributorprogramm herunterladen
      href: /distributor-program
  note: Musterbestellungen ab 5–10 Einheiten. Probebestellungen 10–30. Autorisierter Händler 30–50. Länder-/Regionaldistributoren 100–300+.

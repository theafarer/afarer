meta:
  title: Afarer aufblasbare Paddleboards | Geh weiter. Ride stärker.
  description: Entdecken Sie Afarer aufblasbare Paddleboards für Allround-Paddeln, Touren, Yoga, Angeln und Outdoor-Abenteuer. Finden Sie Ihr perfektes SUP und entdecken Sie mehr auf dem Wasser.
  keywords:
    - aufblasbares paddleboard
    - aufblasbares sup
    - allround sup
    - touring sup
    - yoga sup
    - angel sup
    - familien paddleboard
    - tragbares paddleboard
hero:
  tagline: Aufblasbare Paddleboards
  title: Aufblasbare Paddleboards für jedes Abenteuer
  slogan: Geh weiter. Ride stärker.
  subtitle: Erleben Sie die Freiheit des Paddelns mit Afarer. Entdecken Sie durchdachte aufblasbare SUPs für entspannte Seetage, Küstenabenteuer, Fitness und alles dazwischen.
  taglineSection: Für Vertrauen gebaut. Designed, um aufzufallen.
  actions:
    - variant: primary
      text: Finden Sie Ihr Board
      href: /size-guide/
      icon: tabler:compass
    - text: SUPs entdecken
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Warum Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Afarer aufblasbare Paddleboards gleiten bei Sonnenaufgang über ruhiges Wasser — gebaut für jedes Abenteuer
who_we_serve:
  tagline: Ride mit uns
  title: Finden Sie Ihren Weg auf dem Wasser
  subtitle: Jeder Paddler hat eine andere Vorstellung von Abenteuer. Entdecken Sie ein Afarer SUP, das zu Ihrem Fahrstil passt.
  items:
    - title: Einsteiger & Freizeitsportler
      keywords: aufblasbares Anfänger-SUP, Allround-Paddleboard, stabiles SUP
      description: Breite, stabile Allround-Boards, die Ihren ersten Paddelschlag natürlich machen und mit Ihnen wachsen.
      icon: tabler:users
      cta: Finden Sie Ihr erstes Board
      link: /all-around-sup/
    - title: Touren- & Abenteuerpaddler
      keywords: Touring-SUP, Langstrecken-Paddleboard, Expeditions-SUP
      description: Längere, schmalere Boards, die geradeaus laufen, weiter gleiten und Gepäck für Mehrtagestouren tragen.
      icon: tabler:building
      cta: Touring-SUPs entdecken
      link: /touring-sup/
    - title: Yoga- & Fitnesspaddler
      keywords: Yoga-SUP, Fitness-Paddleboard, breites stabiles SUP
      description: Breite, stabile Plattformen mit Raum zum Bewegen — für Sonnenaufgangs-Flows, Workouts und Gleichgewicht auf ruhigem Wasser.
      icon: tabler:heart
      cta: Yoga-SUP entdecken
      link: /yoga-sup/
    - title: Angel- & Familienpaddler
      keywords: Angel-SUP, Familien-Paddleboard, stabile Angelplattform
      description: Stabile, ausrüstungsfreundliche Plattformen zum Angeln, für Ausflüge mit den Kindern und lange entspannte Tage auf dem Wasser.
      icon: tabler:users
      cta: Angel-SUP entdecken
      link: /fishing-sup/
proof_points:
  title: Getestet jenseits des Showrooms
  subtitle: Design, Performance und Qualität, die sich überprüfen lassen — auf dem Wasser und in den Zahlen.
  items:
    - metric: 10+
      label: Jahre Design fürs Wasser
      detail: Seit 2012, Brett für Brett verfeinert
    - metric: 50+
      label: Länder auf dem Wasser
      detail: Paddler und Partner weltweit
    - metric: 12–15
      label: PSI-Drop-Stitch-Kern
      detail: Steif, wo es darauf ankommt, leicht zu verpacken
    - metric: 100%
      label: Druckgetestet, Brett für Brett
      detail: Geprüft vor dem Versand
business_solutions:
  tagline: Warum es anders fährt
  title: Performance, die Sie beim ersten Paddelschlag spüren
  subtitle: Vier Säulen, geformt von echtem Wasser — Performance, Design, Konstruktion und Qualität.
  items:
    - title: Performance auf dem Wasser
      description: Formen, abgestimmt auf Stabilität, Gleiten und Sicherheit bei Kabbelung — jeder Schlag bleibt mit dem Wasser verbunden.
      icon: tabler:shield-check
    - title: Ausdrucksstarkes Design
      description: Kollektionen, inspiriert von Gezeiten, Tierwelt und der Energie der Küste — Boards, mit denen man gesehen werden will.
      icon: tabler:package
    - title: Bewährte Konstruktion
      description: Hochdichte Drop-Stitch-Kerne, verstärkte Rails und fusionlaminierte Nähte für wiederholte Nutzung.
      icon: tabler:headset
    - title: Geprüfte Qualität
      description: Druckgetestet, sichtgeprüft und abgesichert durch eine klare Garantie und reaktiven Kundendienst.
      icon: tabler:truck-delivery
cta:
  title: Finden Sie Ihr nächstes Board.
  subtitle: Ob Ihr erster Paddelschlag oder Ihre längste Tour — wir bringen Sie aufs Wasser.
  actions:
    - variant: primary
      text: Kollektion entdecken
      href: /inflatable-sup/
      icon: tabler:send
    - text: Katalog anfordern
      href: /resources/download-catalog/

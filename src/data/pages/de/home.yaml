meta:
  title: 'Performance aufblasbare SUP-Boards — Afarer Water Sports | {SITE}'
  description: 'afarer entwickelt Performance-SUPs für offenes Wasser, Touren, Yoga und Abenteuer. Drop-Stitch-Steifigkeit, jedes Board einzeln druckgeprüft, mit exklusiven Länderpartnerschaften und limitierten Co-Branding-Kollektionen. Entdecken Sie die Kollektion.'
  keywords:
    - 'Performance aufblasbares SUP'
    - 'Premium aufblasbares SUP-Board'
    - 'aufblasbares SUP-Board Marke'
    - 'Touring aufblasbares SUP'
    - 'Co-Branded Paddleboard'
    - 'SUP-Landesdistributor'
hero:
  tagline: 'Performance aufblasbare SUP-Boards'
  title: 'Weiter kommen.<br />Stärker fahren.'
  subtitle: |
    Performance-aufblasbare SUPs für offenes Wasser, lange Tage<br />
    und die Freiheit zu entdecken — stabil, wenn es darauf ankommt,<br />
    steif unter Druck und bereit für wechselndes Wasser.
  taglineSection: Für die Erkundung entworfen. Für Zuverlässigkeit konstruiert. Für globale Partner gebaut.

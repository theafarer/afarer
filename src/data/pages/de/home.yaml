who_we_serve:
  tagline: Wem wir dienen
  title: Komplette SUP-Lösungen für jedes Wasserunternehmen
  subtitle: Speziell entwickelte Ausrüstung, Fertigung und Geschäftunterstützung für vier wichtige Märkte.
  items:
    - title: Paddelclubs
      keywords: SUP-Clubausrüstung, Paddelschulausrüstung, Mietflotte
      description: Langlebige SUP-Flotten, Clubpreise und Ersatzteilprogramme für Paddelclubs und Schulen.
      icon: tabler:users
      cta: Entdecken Sie Paddle Club Lösungen
      link: /solutions/paddle-clubs
    - title: Resorts & Hotels
      keywords: Resort-Wasseraktivitäten, Hotelausstattung am Strand, Gästeerlebnis
      description: Komplette SUP-Flottenprogramme mit individuellem Branding, Mitarbeiterschulung und ROI-optimierten Paketen.
      icon: tabler:building
      cta: Erleben Sie Ihr Resort-Wassererlebnis
      link: /solutions/resorts-hotels
    - title: Einzelhandelspartner
      keywords: SUP-Großhandel, Outdoor-Händler, Sportgeschäfte
      description: Vollständige Produktlinie, Marketingmaterialien, Dropshipping-Optionen und wettbewerbsfähige Großhandelsmargen.
      icon: tabler:shopping-cart
      cta: Werden Sie Einzelhandelspartner
      link: /solutions/retail-partners
    - title: Neue SUP-Marken
      keywords: Private-Label-SUP, maßgeschneiderte SUP-Marke, OEM-Paddleboards
      description: End-to-End-OEM/ODM-Fertigung – Design, Prototyping, Massenproduktion und globale Logistik.
      icon: tabler:package
      cta: Baue deine SUP-Marke auf
      link: /oem-odm-manufacturer

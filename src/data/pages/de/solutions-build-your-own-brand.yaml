meta:
  title: Private-Label-SUP-Herstellung | {SITE}
  description: Starten Sie Ihre eigene SUP-Marke mit Afarer. Von der Idee bis zum Markt — voller OEM/ODM-Service einschließlich Design, Prototyping, Produktion und globaler Logistik.
hero:
  tagline: Baue deine eigene Marke
  title: Starte deine eigene<br />SUP-Marke
  subtitle: Sie haben die Vision. Wir haben die Fabrik, das Fachwissen und die Lieferkette. Gemeinsam werden wir eine Marke aufbauen, die herausragt.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Individuell gebrandetes SUP-Board auf dem Wasser
process:
  title: Ihre Markenreise
  subtitle: Von der Idee bis zum Markt in 5 Phasen.
  steps:
    - phase: Phase 1
      title: Idee
      period: Woche 1-2
      items:
        - Marktforschung & Wettbewerbsanalyse
        - Definition des Zielkunden
        - Workshop zur Markenpositionierung
        - Produktlinienstrategie
    - phase: Phase 2
      title: Konstruktion
      period: Woche 3-6
      items:
        - Brettform & Grafikdesign
        - Farbabstimmung & Materialauswahl
        - Zubehörspezifikation
        - Verpackungs- und Etikettendesign
    - phase: Phase 3
      title: Prototyp
      period: Woche 7-10
      items:
        - Beispielproduktion
        - Qualitätstest (Druck, Auftrieb, UV)
        - Designanpassungen
        - Endgültige Genehmigung
    - phase: Phase 4
      title: Produktion
      period: Woche 11-14
      items:
        - Massenproduktion
        - Qualitätskontrolle (pro Einheit)
        - Seefracht / Luftfracht
        - Zolldokumente
    - phase: Phase 5
      title: Start
      period: Woche 15-16
      items:
        - Produktfotografie
        - Website-Produktfeed
        - Werbematerialien
        - Startunterstützung
packages:
  title: Start-up-Pakete
  subtitle: Pakete, die für jede Phase des Markenwachstums entwickelt wurden.
  items:
    - name: Starter Brand
      tagline: 50-100 Einheiten · 2 Platinenmodelle
      features:
        - Grundlegender Logodruck
        - Standardverpackung
        - E-Mail-Support
    - name: Growing Brand
      tagline: 300-1.000 Einheiten · 3-5 Platinenmodelle
      features:
        - Benutzerdefiniertes Farblogo
        - Maßgeschneiderte Verpackung
        - Produktfotos
        - Engagierter Manager
    - name: Established Brand
      tagline: 1.000 Einheiten · Gesamtes Produktsortiment
      features:
        - Vollständige Anpassung
        - Premium-Verpackung
        - Marketingmaterial
        - Prioritätsproduktion
features:
  title: Warum Marken Afarer wählen
  subtitle: 10 Jahre OEM-Erfahrung, vollständige Zertifizierung und die niedrigste Mindestbestellmenge in der Branche.
  items:
    - title: 10 Jahre OEM-Erfahrung
      description: 2.400 Rümpfe an Marken weltweit geliefert.
      icon: tabler:clock
    - title: Vollständige Zertifizierung
      description: CE / ISO / UKCA / BSCI / REACH – alle zertifiziert.
      icon: tabler:certificate
    - title: 30-tägige Vorlaufzeit
      description: Schneller als der Branchendurchschnitt von der Bestellung bis zum Versand.
      icon: tabler:truck-delivery
    - title: Niedrige Mindestbestellmenge
      description: Ab 50 Einheiten — die niedrigsten in der Branche.
      icon: tabler:package
    - title: Interne Gestaltung
      description: Vollständige Designunterstützung vom Konzept bis zur fertigen Grafik.
      icon: tabler:palette
    - title: Globale Logistik
      description: Seefracht, Luftfracht und Unterstützung bei der Zollabfertigung.
      icon: tabler:world

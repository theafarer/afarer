faqs:
  title: 'Co-Brand — FAQ'
  subtitle: 'Wie Afarer-Co-Branding funktioniert — und wie es sich von OEM und Private Label unterscheidet.'
  items:
    - title: 'Ist Co-Branding dasselbe wie OEM oder Private Label?'
      description: 'Nein. Afarer betreibt kein offenes OEM-/Private-Label-Programm mehr. Co-gebrandete Produkte bleiben Afarer-Produkte — gestaltet, konstruiert, qualitätsgeprüft und getragen von der Marke Afarer. Ihre Identität erscheint als Co-Brand, nicht als unmarkiertes Fremdprodukt.'
    - title: 'Wer kann ein Co-Brand-Projekt starten?'
      description: 'Qualifizierte Wassersport-Unternehmen: bestehende Landespartner, Paddle-Clubs, Resorts und Hotels, Event-Veranstalter und Communities. Senden Sie uns ein Projekt-Briefing, und wir bestätigen die Eignung, bevor die Designarbeit beginnt.'
    - title: 'Steht Co-Branding im Konflikt mit meinem Landes-Distributor?'
      description: 'Nein. Das Ein-Land-ein-Distributor-Modell hat Vorrang. Co-Brand-Kollektionen werden — wo vorhanden — mit dem lokalen Landespartner koordiniert, sodass im geschützten Gebiet keine parallele oder konkurrierende Marke erscheint.'
    - title: 'Was ist die Mindestbestellung für eine Co-Brand-Kollektion?'
      description: 'Pilot-Kollektionen beginnen bei 30–50 Einheiten. Standard-Kollektionen umfassen 50–100 Einheiten; große oder multiregionale Editionen 100+ Einheiten. Zeitpläne für kundenspezifische Entwicklungen werden je Projekt vereinbart.'
    - title: 'Was zählt als Afarer-Qualität und was als Partner-Beitrag?'
      description: 'Afarer verantwortet Produktdesign, Entwicklung, Materialien, Konstruktion, QC und Garantie. Partner steuern Kollektionskonzept, Namensgebung, Farben, Grafik-Input und Go-to-Market bei. So bleibt auf dem Wasser ein einziger Qualitätsstandard.'
    - title: 'Wie bewerbe ich mich?'
      description: 'Füllen Sie das Co-Brand-Anfrageformular mit Ihrem Unternehmen, Markt und Ihrer Kollektionsidee aus. Wir prüfen die Passung und antworten innerhalb von 3 Werktagen mit einem Vorschlag und der Co-Brand Project Agreement.'

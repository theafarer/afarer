features:
  title: 'Was Co-Branding bei Afarer bedeutet'
  subtitle: 'Co-Branding ist unser Design-Partnerschaftsprogramm — aufgebaut um die Marke Afarer, Gebietsschutz und limitierte Kollektionen, nicht um unmarkierte Produktion.'
  columns: 3
  items:
    - title: 'Afarer-Produkte bleiben Afarer-Produkte'
      description: 'Eine Co-Brand-Kollektion ist eine limitierte Auflage von Afarer-Boards, in die Ihre Identität eingewoben ist. Sie ist nie unmarkiert, nie eine Fremdmarke und nie ein offenes Private-Label-Programm.'
      icon: 'tabler:trademark'
    - title: 'Gemeinsam mit Ihnen gestaltet'
      description: 'Ihre Farben, Namen und Geschichte prägen die Kollektion. Unser Design- und Entwicklungsteam verantwortet Decks, Grafiken, Verpackung und Dokumentation vom Briefing bis zur Lieferung.'
      icon: 'tabler:pencil'
    - title: 'Für Clubs, Resorts, Events & Communities'
      description: 'Flotten-Kollektionen für Paddle-Clubs und Resorts, Event-Editionen für Rennen und Community-Serien — alle mit der Qualität und Garantie von Afarer.'
      icon: 'tabler:users'
    - title: 'Schützt Landespartner'
      description: 'Co-Branding läuft parallel zu unserem Ein-Land-ein-Distributor-Modell. Nationale Partner behalten ihr Gebiet; Co-Brand-Kollektionen öffnen parallelen Marken nicht die Tür in ihren Markt.'
      icon: 'tabler:shield-check'
    - title: 'Entwicklung & Qualitätsstandards'
      description: 'Jede Kollektion verlässt unsere zertifizierte Lieferkette mit CE- und ISO-9001-Dokumentation, Druckprüfung und denselben QC-Kontrollpunkten wie unsere Kernkollektion.'
      icon: 'tabler:certificate'
    - title: 'Wird ein Marken-Asset'
      description: 'Eine limitierte Co-Brand-Kollektion baut Ihre eigene Geschichte auf dem Wasser auf — Verkaufsmarge, Medieninhalte und ein Grund für Paddler, Saison für Saison zurückzukommen.'
      icon: 'tabler:star'

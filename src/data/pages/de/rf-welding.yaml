intro: >-
  Ein aufblasbares Boot ist nur so zuverlässig wie seine Nähte. Eine einzige schwache Schweißnaht kann eine gesamte Kammer gefährden – und auf See ist ein Kammerausfall kein Ärgernis, sondern eine Sicherheitsgefahr. Bei {SITE.name} haben wir in ein spezielles Radiofrequenz-(RF-)Schweißzentrum
  investiert, das industrielle Dielektrik-Schweißpressen mit rigoroser Prozesskontrolle und Nachschweißprüfung kombiniert. Jede Naht, die wir herstellen, wird dokumentiert, ist rückverfolgbar und zertifiziert, um die Anforderungen der internationalen Norm ISO 6185 für aufblasbare Wasserfahrzeuge einzuhalten
  oder zu übertreffen.
content_html: >-
  <h2>Die Wissenschaft hinter der Naht</h2>

  <p>Die Hochfrequenzschweißung nutzt elektromagnetische Energie hoher Frequenz (typischerweise 27,12 MHz), um die polaren Moleküle in PVC- oder Hypalon-beschichtetem Gewebe zu erregen und gezielt Wärme an der Materialgrenzfläche zu erzeugen. Im Gegensatz zur Heißluft- oder Heißkeilschweißung
  erzeugt die HF-Schweißung eine echte molekulare Bindung — die beiden Gewebeschichten verschmelzen im Schweißbereich zu einem einzigen homogenen Material und erzeugen eine Verbindung, die ebenso stark ist wie das Ausgangsmaterial selbst.</p>


  <h2>Schweißausrüstung und Prozesssteuerung</h2>

  <p>Unser Schweißzentrum ist ausgestattet mit:</p>

  <table>
    <thead><tr><th>Maschine</th><th>Leistung / Kapazität</th><th>Anwendung</th></tr></thead>
    <tbody>
      <tr><td>Dielektrische HF-Presse 1</td><td>15 kW, Platten 2000 × 600 mm</td><td>Hauptlängnähte, Verbindungen zwischen Heckaufbau und Schlauch</td></tr>
      <tr><td>Dielektrische HF-Presse 2</td><td>10 kW, Platten 1500 × 500 mm</td><td>Scheidewandschweißungen, Kegelbefestigungen, Ventilflansche</td></tr>
      <tr><td>CNC-gesteuerter HF-Schweißer</td><td>8 kW, XY-Tisch 2500 × 1200 mm</td><td>Kurvennähte, Logo-/Paneelprägung, Präzisionsflickarbeit</td></tr>
      <tr><td>Heißkeil-Automatschweißer</td><td>Variable Temperatur, max. 1,2 m/min</td><td>Backup-Methode für Hypalon/CSM-Materialien</td></tr>
    </tbody>
  </table>

  <p>Jede HF-Presse ist mit einer temperatur- und druckgeregelten Überwachung ausgestattet. Schweißparameter — Leistung, Presszeit, Abkühlzeit, ElektrodenDruck — werden je nach Materialtyp programmiert und in unserem Manufacturing Execution System (MES) zur vollständigen Rückverfolgbarkeit
  aufgezeichnet.</p>


  <h2>Schweißqualitätsprüfungen — jede Naht, jedes Boot</h2>

  <p>Die Nahtintegrität wird durch ein obligatorisches Vier-Prüfungs-Protokoll überprüft:</p>

  <ol>
    <li><strong>Sichtprüfung</strong> — 100 % der Nähte werden visuell auf Durchbrand, Versatz, Verunreinigungen oder unvollständige Verschmelzung geprüft. Ablehnungsschwelle: 0,5 % der Laufmeter.</li>
    <li><strong>Schältest (Peel-Test)</strong> — Ein 25 mm breites Streifen wird von einem Prüfkörper geschnitten, der mit jeder Produktionscharge geschweißt wurde. Mindest-Schalkraft: 120 N/25 mm für PVC 1100 dtex.</li>
    <li><strong>Luftdichtheitsprüfung</strong> — Jede fertiggestellte Kammer wird auf das 1,5fache Betriebsdruck aufgeblasen und 30 Minuten gehalten. Der Druckabfall darf 2 % nicht überschreiten.</li>
    <li><strong>Thermowechseltest</strong> — Prüfkörper werden 50 Zyklen von −20 °C bis +60 °C unterworfen und anschließend erneut dem Schältest unterzogen. Zulässiger Festigkeitsverlust: &lt; 10 %.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Schalfestigkeitsvergleich — HF- vs. Heißluftschweißung (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">HF-Schweißung</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Heißluft</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Min.</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Die HF-Schweißung erreicht durchgehend 90–95 % der Festigkeit des Ausgangsmaterials und liegt damit deutlich über dem Minimum.</p>
  </div>


  <h2>Fachkompetenz</h2>

  <p>Unser Schweißteam wird von einem erfahrenen Verfahrensingenieur mit 11 Jahren Erfahrung in der dielektrischen Schweißung beschichteter Textilien geleitet. Jeder Bediener durchläuft ein sechsmonatiges internes Zertifizierungsprogramm, bevor er an Produktionsnähten arbeiten darf. Eine jährliche
  Rezertifizierung ist erforderlich, einschließlich eines praktischen Schweißtests nach unserem internen Standard der Klasse A (Schalfestigkeit ≥ 160 N/25 mm).</p>


  <h2>Maßgeschneiderte Schweißlösungen für besondere Anforderungen</h2>

  <p>Wir wissen, dass eine einzige Schweißspezifikation nicht für jede Anwendung passt. Unser HF-Schweißzentrum entwickelt routinemäßig individuelle Nahtkonfigurationen für Kunden mit besonderen Anforderungen:</p>

  <ul>
    <li><strong>Mehrschichtige Verstärkungsflicken</strong> — für stark beanspruchte Bereiche wie Reibleisten und Bugkegel entwickeln wir mehrstufige HF-Schweißungen, die eine verschleißfeste Außenschicht integrieren, ohne die Flexibilität einzuschränken.</li>
    <li><strong>Leitfähige oder HF-undurchlässige Nähte</strong> — für militärische oder Überwachungsboote mit elektromagnetischer Schirmung schweißen wir leitfähige Gewebeschichten in den Schichtaufbau der Naht ein.</li>
    <li><strong>Farbwechsel-Paneelschweißung</strong> — zweifarbige Gewebepaneele (z. B. orangefarbener Rumpf + grauer Aufbau) werden mit einer verdeckten Überlappung geschweißt, um die Markenästhetik ohne sichtbare Fugelinie zu erhalten.</li>
  </ul>


  <h2>Unser Versprechen an Sie</h2>

  <p>Jedes Boot, das wir liefern, trägt unsere Schweißqualitätsgarantie: Sollte innerhalb der Garantiezeit bei normalem Einsatz eine Naht versagen, reparieren oder ersetzen wir die betroffene Kammer kostenfrei, und eine Ursachanalyse wird durchgeführt, um Wiederholungen zu verhindern. Dies ist nicht
  nur eine Garantie — es ist ein Engagement für kontinuierliche Verbesserung, das durch betriebliche Daten aus der Praxis gesteuert wird.</p>

  <p>Wenn Sie sich für {SITE.name} entscheiden, entscheiden Sie sich für Nähte, die konstruiert, getestet und dokumentiert sind — nicht nur geschweißt. Das ist der Unterschied zwischen einem Boot, das schwimmt, und einem Boot, das Leistung bringt.</p>

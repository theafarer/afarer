    - title: 'Distributor Success Program'
      description: 'Strukturiertes Onboarding, Go-to-Market-Planung, Produkt- und Vertriebsschulungen, Demo-Flotten-Support und Co-Marketing-Tools.'
      icon: 'tabler:rocket'
    - title: 'Marketing- & Marken-Support'
      description: 'Lokalisierte Kampagnen-Assets, POS-Materialien, Event-Kits und mehrsprachige digitale Inhalte.'
      icon: 'tabler:mood-smile'
    - title: 'Zuverlässige Supply Chain'
      description: 'ISO- und CE-zertifizierte Fertigung mit gleichbleibender Qualitätskontrolle, planbaren MOQs und Lieferzeiten.'
      icon: 'tabler:building-factory'
    - title: 'Persönlicher Account Manager'
      description: 'Ein persönlicher Distributor-Manager für Prognosen, Auftragsplanung und After-Sales-Support.'
      icon: 'tabler:user-check'
table:
  title: 'Programmstufen & Auftragsbedingungen'
  subtitle: 'Wählen Sie die Stufe, die zu Ihrem Marktpotenzial passt. Alle Preise in USD, FOB Qingdao.'
  caption: 'Musterbestellungen (5–10 Einheiten) beinhalten keinen Gebietsschutz. Die Bedingungen werden vor jeder Lieferung in Ihrem Distributorvertrag vereinbart.'
  head:
    - Programmstufe
    - Mindestbestellung (Einheiten)
    - Lieferzeit
    - Zahlung
  rows:
    - [Muster / Produktbewertung, 5–10, 15–20 Werktage, 100% Vorauszahlung]
    - [Probeauftrag, 10–30, 30–45 Tage, 100% Vorauszahlung]
    - [Autorisierter Händler, 30–50, 30–45 Tage, 30% Anzahlung / 70% vor Versand]
    - [Landes- / Regional-Distributor, 100–300, 30–45 Tage, 30% Anzahlung / 70% vor Versand]
    - [Custom & Private Label (Standard), 50+, 30–45 Tage, 30% Anzahlung / 70% vor Versand]
    - [Tiefenmaßanfertigung (neue Formen, Verpackung), 200+, 45–60 Tage, 30% Anzahlung / 70% vor Versand]
    - [Rechte an kompletter Produktlinie, 300–1, 000, 60–90 Tage, 30% Anzahlung / 70% vor Versand]
faqs:
  title: 'Distributorprogramm — FAQ'
  subtitle: 'Alles, was Distributoren vor der Bewerbung fragen.'
  items:
    - title: 'Was bedeutet „ein Land, ein Distributor“?'
      description: 'Afarer gewährt einem einzigen autorisierten Distributor exklusive Rechte für ein Land oder eine Region. Sie besitzen Ihren Markt — keine Parallelimporte, keine interne Konkurrenz.'
    - title: 'Wie hoch ist die Mindestbestellung?'
      description: 'Landes- und Regional-Distributoren starten bei 100–300 Einheiten. Autorisierte Händler ab 30–50 Einheiten. Probeaufträge von 10–30 Einheiten ermöglichen es Ihnen, den Markt zuerst zu testen (ohne Gebietsschutz).'
    - title: 'Welchen Support erhalten Distributoren?'
      description: 'Das Distributor Success Program umfasst Onboarding, Go-to-Market-Planung, Produkt- und Vertriebsschulungen, Demo-Flotten-Support, lokalisierte Marketing-Materialien und einen persönlichen Account Manager.'
    - title: 'Wie schützt mich Afarer vor Kanal-Konflikten?'
      description: 'Jedes Gebiet hat genau einen autorisierten Distributor. Direktbestellungen aus Ihrer Region laufen über Sie, und die Preise sind so gesetzt, dass Ihre Marge geschützt bleibt.'
    - title: 'Wie sind Versand- und Zahlungsbedingungen?'
      description: 'Bestellungen werden FOB Qingdao mit vollständiger Exportdokumentation geliefert. Produktionsaufträge mit 30% Anzahlung und 70% vor Versand; Probe- und Musterbestellungen sind vorausbezahlt.'
    - title: 'Wie bewerbe ich mich?'
      description: 'Senden Sie Ihre Bewerbung über das Kontaktformular. Wir prüfen Marktfit, Handelspräsenz und Logistikkapazität und antworten innerhalb von 3 Werktagen mit den nächsten Schritten und einem Muster-Distributorvertrag.'
cta:
  title: 'Bereit, Ihren Markt zu besitzen?'
  subtitle: 'Bewerben Sie sich für das Afarer-Distributorprogramm und erhalten Sie Antwort innerhalb von 3 Werktagen.'
  actions:
    - text: 'Distributorschaft beantragen'
      href: /contact?subject=Distributor Application
      variant: primary
    - text: 'Distributorprogramm herunterladen'
      href: /distributor-program
      variant: secondary
geo:
  tagline: 'Wen Sie Bedienen'
  sentence: 'Afarer arbeitet mit etablierten Distributoren aus Marine-, Outdoor- und Sportbereich zusammen, die Handelsketten, Verleihflotten, Wassersportschulen, Resorts und Behörden mit Premium-ISUP-Boards und Wasserfahrzeugen beliefern.'
  audiences:
    - 'Marine- & Boots-Distributoren'
    - 'Outdoor- & Sport-Handel'
    - 'Verleih- & Resort-Betreiber'
    - 'Wassersportschulen'

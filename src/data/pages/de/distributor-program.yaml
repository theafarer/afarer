faqs:
  title: 'Landespartnerschaft — FAQ'
  subtitle: 'Die Fragen, die ernsthafte Landespartner vor ihrer Bewerbung stellen.'
  items:
    - title: 'Was bedeutet „ein Land, ein Distributor“ wirklich?'
      description: 'Afarer ernennt einen einzigen autorisierten Distributor mit exklusiven Rechten für ein festgelegtes Gebiet. Wir verkaufen nicht aus unseren globalen oder regionalen Kanälen in ein geschütztes Land. Ihr Gebiet gehört Ihnen, solange die Distribution Agreement eingehalten wird.'
    - title: 'Ist das Gebiet für immer exklusiv?'
      description: 'Nein. Exklusivität ist bedingt, nicht dauerhaft. Sie wird aufrechterhalten durch eine unterzeichnete Distribution Agreement, die Erfüllung Ihrer Erstbestellung, jährliche Abnahmeziele, lokale Lagerhaltung, After-Sales-Kompetenz und kontinuierliche Marktinvestitionen. Werden diese nicht erfüllt, kann das Gebiet neu verhandelt oder neu vergeben werden.'
    - title: 'Wie hoch ist die Mindest-Erstbestellung?'
      description: 'Landes- und Regionaldistributoren starten bei 100–300 Einheiten; Authorized Dealers ab 30–50 Einheiten; Probeaufträge ab 10–30 Einheiten lassen Sie den Markt zuerst validieren (Probe- und Musteraufträge beinhalten keinen Gebietsschutz). Custom- und Private-Label-Programme folgen separaten MOQs, die in den oben genannten Stufen aufgeführt sind.'
    - title: 'Welche Unterstützung umfasst das 10-modulige Supportprogramm?'
      description: 'Stufen und Qualifikation, Gebietsschutz, MOQ / Preisgestaltung / jährliche Rückvergütungen, Lagerbestand und Auftragsabwicklung, Marketing-Assets und gemeinsame Marktmittel, Produkt- / Vertriebs- / Technikschulungen, Ersatzteile und After-Sales, Garantieregistrierung, das Partnerportal sowie Produktdatenblätter, Marketing-Asset-Bibliothek, jährlicher Rückvergütungsplan und Versand- und Packlisten.'
    - title: 'Wie schützt mich Afarer vor Kanal-Konflikten?'
      description: 'Jedes Gebiet hat genau einen autorisierten Distributor. Anfragen und Direktbestellungen aus Ihrer Region werden über Sie geleitet, Website-Formulare werden an den lokalen Partner weitergeleitet, sofern vorhanden, und das globale Team eskaliert nur, wenn ein Partner nicht reagiert.'
    - title: 'Welche Versand- und Zahlungsbedingungen gelten?'
      description: 'Bestellungen werden FOB Qingdao mit vollständiger Exportdokumentation versandt. Produktionsaufträge mit 30% Anzahlung und 70% vor Versand; Probe- und Musteraufträge sind vorausbezahlt. Die Standard-Lieferzeit beträgt 30–45 Werktage, für Musterläufe 15–20 Werktage.'
    - title: 'Wie bewerbe ich mich?'
      description: 'Senden Sie Ihre Bewerbung über das Kontaktformular mit Angaben zu Ihrem Markt. Wir prüfen Marktfit, Handelspräsenz und Logistikkapazität und antworten innerhalb von 3 Werktagen mit den nächsten Schritten und einer Muster-Distribution Agreement.'

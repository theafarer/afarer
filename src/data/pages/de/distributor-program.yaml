    - title: 'Marketing & gemeinsame Marktmittel'
      description: 'Lokalisierte Kampagnen-Assets, Händler-POS-Materialien, Event-Kits, digitale Inhalte in mehreren Sprachen und Co-Marketing-Support für die Einführungssaisons.'
      icon: 'tabler:mood-smile'
    - title: 'Produkt-, Vertriebs- & Technikschulungen'
      description: 'Strukturierte Onboarding-Sitzungen zu Produkt-, Vertriebs- und Technikwissen, mit aktualisierten Materialien, sobald sich das Sortiment weiterentwickelt.'
      icon: 'tabler:presentation'
    - title: 'Ersatzteile & After-Sales-Support'
      description: 'Ersatzteilversorgung, Garantieregistrierung und Schadensabwicklung sowie Produktdatenblätter und Handbücher für Ihr lokales Serviceteam.'
      icon: 'tabler:settings'
    - title: 'Persönlicher Account Manager & Partnerportal'
      description: 'Ein persönlicher Distributor-Manager plus Zugriff auf Preislisten, Bestellstatus und Marketingressourcen über das Afarer-Partnerportal.'
      icon: 'tabler:user-check'

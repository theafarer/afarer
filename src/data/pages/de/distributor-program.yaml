features:
  title: 'Warum Mit Afarer Partnerschaft'
  subtitle: 'Entwickelt für Vertriebspartner, die mit einer ernsthaften Marke im Rücken ein Wassersportgeschäft aufbauen wollen.'
  columns: 3
  items:
    - title: 'Gebietsexklusivität'
      description: 'Ein geschützter Länder- oder Regionalmarkt. Ein Distributor, keine interne Konkurrenz, keine Kanal-Konflikte — Ihre Investition baut Ihren eigenen Burggraben.'
      icon: 'tabler:shield-check'
    - title: 'Direkte Werk-Margen'
      description: 'Distributor-Preisliste mit Rückvergütungen auf gebundene Mengen. Keine Zwischenhändler. FOB Qingdao-Versand mit vollständiger Exportdokumentation.'

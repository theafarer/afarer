      icon: 'tabler:shield-check'
    - title: 'Schutz vor Kanal-Konflikten'
      description: 'Direktbestellungen aus Ihrer Region laufen über Sie, und die Preisgestaltung schützt Ihre Marge. Afarer verkauft nicht an seinen Landespartnern vorbei.'

    - title: 'Direktfabrik-Margen & Rückvergütungen'
      description: 'Händlerpreisliste mit Rückvergütungen auf gebundene Mengen. Keine Zwischenhändler. FOB Qingdao-Versand mit vollständiger Exportdokumentation.'
      icon: 'tabler:coins'
    - title: '10-moduliges Partner-Supportprogramm'
      description: 'Onboarding, Go-to-Market, Schulungen, Marketing und gemeinsame Marktfinanzierung, Ersatzteile und After-Sales, Garantie, Bestelltools und ein Partnerportal — alles abgedeckt in Ihrer Distribution Agreement.'

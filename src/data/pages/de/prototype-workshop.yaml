hero:
  tagline: Labor 05
  title: Prototyp-Werkstatt
  subtitle: Vom CAD-Modell zum seetauglichen Boot — gebaut, ausgestattet und erprobt
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Afarer Prototyp-Werkstattboot-Fertigung
intro: >-
  Ein CAD-Modell kann, egal wie detailliert es ist, nicht zeigen, wie ein Boot sich tatsächlich verhalten wird, bevor es das Wasser trifft. Deshalb ist unser Prototypenwerk darauf ausgelegt, technische Daten so schnell und präzise wie möglich in ein physisches, seetüchtiges Schiff zu übertragen.
  Jedes neue Afarer-Modell – und jeder bedeutende Sonderbau – durchläuft diese Werkstatt, bevor die Produktionswerkzeuge eingesetzt werden.
content_html: >-
  <h2>Wo Design zur Realität wird</h2>

  <p>Die Werkstatt ist vollständig für die gleichzeitige Fertigung von Rumpf, Schläuchen und Ausrüstung ausgestattet. Dieser parallele Arbeitsablauf verkürzt die Prototypenlieferzeit auf 8–12 Wochen ab Freigabe der Konstruktion, verglichen mit dem branchenüblichen Standard von 16–20 Wochen. Wenn
  Ihre Anwendung eine spezielle Lösung erfordert, können wir innerhalb von weniger als drei Monaten von der Konzeption bis zur Erprobung auf dem Wasser gelangen.</p>


  <h2>Werkstattkapazitäten</h2>

  <table>
    <thead><tr><th>Arbeitsstation</th><th>Ausrüstung</th><th>Zweck</th></tr></thead>
    <tbody>
      <tr><td>Rumpffertigung</td><td>Rotationsgussofen (HDPE), WIG-Schweißplatz (Aluminium), Handlaminiervorrichtungen (Glasfaser)</td><td>Großserien-Rumpfproduktion in allen drei Materialtypen</td></tr>
      <tr><td>Schlauchmontage</td><td>Hochfrequenz-Schweißpresse, Heißluft-Vorheftstation, Druckprüfungsvorrichtung</td><td>Fertigung von Schlauchaggregaten in Originalgröße mit allen Scheidewänden, Kegeln und Ventilen</td></tr>
      <tr><td>Ausrüstung &amp; Einbau</td><td>Motorhebevorrichtung (500 kg), Konsolen-Nachbauvorrichtung, Hydraulikschlauchpresse, elektrische Verdrahtungsbank</td><td>Komplette Ausrüstung: Motor, Lenkung, Steuerung, Kraftstoffsystem, Elektronik, Sitzgelegenheiten</td></tr>
      <tr><td>Messinstrumentenbereich</td><td>GPS-Geschwindigkeitssensor, Kraftstoffdurchflussmesser, Beschleunigungsmesser, Thermoelementarray, Datenlogger</td><td>Installation und Kalibrierung der Messtechnik für die Erprobung auf dem Wasser</td></tr>
    </tbody>
  </table>


  <h2>Der Prototypenweg — Schritt für Schritt</h2>

  <ol>
    <li><strong>Konstruktionsübergabe</strong> — Das Konstruktionspaket (3D-Modell, FEA-Bericht, Stückliste, Laminatplan) wird vom Werkstattleiter und dem Projektingenieur formell überprüft. Eventuelle Fertigungsmängel werden vor Beginn der Zuschnitte erkannt und behoben.</li>
    <li><strong>Rumpfproduktion</strong> — Der Rumpf wird gemäß den Konstruktionsvorgaben gefertigt. Bei HDPE: Das Rotationsguss-Programm wird aus der Moldex3D-Simulation geladen. Bei Aluminium: Die CNC-geschnittenen Platten werden im WIG-Schweißplatz gemäß dem genehmigten Schweißplan verschweißt. Bei Glasfaser: Das Laminatbuch wird Schicht für Schicht befolgt.</li>
    <li><strong>Schlauchfertigung</strong> — Das Gewebe wird mittels CNC-Schnittschablonen zugeschnitten und anschließend in hochfrequenzgeschweißte Kammern in Originalgröße umgewandelt. Jede Kammer wird auf Prüfdruck aufgeblasen und 24 Stunden zur anfänglichen Stabilisierung belassen.</li>
    <li><strong>Montage &amp; Ausrüstung</strong> — Rumpf und Schläuche werden zusammengeführt. Der Motor wird eingehängt, Lenkung und Steuerung werden angeschlossen, das Kraftstoffsystem wird installiert und alle Stromkreise werden verdrahtet und überprüft.</li>
    <li><strong>Statische Tests</strong> — Bevor das Boot das Wasser berührt, durchläuft es: Auftriebsprüfung (Volllast + 30 % Reserve), Druckprüfung des Kraftstoffsystems, Vollhub-Zyklusprüfung des Lenksystems, Durchgangsprüfung der elektrischen Erdung.</li>
    <li><strong>Erprobungsprogramm auf dem Wasser</strong> — 20 Stunden Erprobung auf dem Wasser, im Detail nachstehend.</li>
    <li><strong>Prototypenbesprechung</strong> — Ein formales Abnahmegerät mit Konstruktion, Produktion und Qualität findet statt. Erforderliche Konstruktionsänderungen werden dokumentiert und in die Produktionsfreigabe einbezogen.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-Stunden-Erprobungsprogramm auf dem Wasser — Prüfplan</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Hafenmanöver — Langsamfahrt, Rückwärtsfahren, Fenderprüfung</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Geschwindigkeitsprüfung — GPS-verifizierte Höchstgeschwindigkeit, Reisegeschwindigkeit, Kraftstoffverbrauch bei 3 Drehzahlpunkten</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Wendemanöver — taktischer Durchmesser, Voraus und Übersegelung bei 20 kn, Back- und Steuerbord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Schlagtest — wiederholte Durchfahrten durch 0,5–1,0 m Seegang; Beschleunigungsmesser auf dem Lenksitz</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Stabilitätsprüfung — statischer Schlagwinkel mit 4 Besatzungsmitgliedern + Ausrüstung an Steuerbord, Ausgleichslast</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Ausdauerfahrt — 3 Stunden kontinuierlich bei Reisegeschwindigkeit; Temperaturüberwachung (Motor, Kraftstoff, Elektrik)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Abschlusskontrolle — Nachuntersuchung aller Systeme, Anziehen/Überprüfen aller Befestigungen, Dokumentation der Ergebnisse</span>
      </div>
    </div>
  </div>


  <h2>Maßgeschneiderte Prototypenfertigung für spezielle Anwendungen</h2>

  <p>In der Prototypenwerkstatt lösen wir die Probleme, die mit Standard-Produktionsbooten nicht bewältigt werden können. Aktuelle Beispiele umfassen:</p>

  <ul>
    <li>Ein 7,8 m Rettungsboot für eine Seenotrettungsorganisation mit individueller Kabine inklusive Überrollschutz, integrierten Tragenhalterungen und einer am Bug montierten Sonarkapsel — alles als Prototyp bei uns entworfen, eingebaut und getestet.</li>
    <li>Ein 5,2 m Schlauchboot für einen hydrographischen Vermessungsdienstleister mit reduziertem Heckaufbau, abnehmbarem Instrumentenmast und durch den Rumpf geführten Transducer-Aufnahmen zur Minimierung der Strömungsstörung.</li>
    <li>Ein 4,5 m Tender mit Elektroantrieb für eine Superyacht, bei dem der Prototyp zur Validierung der Reichweite, Ladeinfrastruktur und der Geräuschpegel eingesetzt wurde, bevor sich der Kunde für eine Flotte von vier Einheiten entschied.</li>
  </ul>


  <h2>Unser Prototypenteam</h2>

  <p>Die Werkstatt wird von acht vielseitig qualifizierten Marinetechnikern besetzt, von denen jeder in mindestens zwei der drei Kerndisziplinen (Rumpf, Schlauch, Ausrüstung) querqualifiziert ist. Der Teamleiter ist ein Meisterbootsbauer mit 16 Jahren Erfahrung, die von individuellen Einzelstücken
  bis hin zu Serienproduktionen reicht. Jeder Prototyp erhält einen dedizierten Projektingenieur, der als einziger Ansprechpartner für den Kunden während des gesamten Bau- und Erprobungsprozesses dient.</p>


  <h2>Kundenbeteiligung</h2>

  <p>Wir ermutigen unsere Kunden aktiv, an Meilensteinen während des Prototypenbaus teilzunehmen — insbesondere an der ersten Einbaubesprechung und der Erprobung auf dem Wasser. Ihr operationelles Feedback in diesen Phasen ist von unschätzbarem Wert für die Feinabstimmung des Bootes vor der
  Serienproduktion. Wir bauen nicht im Elfenbeinturm; wir bauen in Partnerschaft mit Ihnen.</p>

  <p>Die 20-stündige Erprobung auf dem Wasser ist auch eine Gelegenheit für Ihr Team, sich mit den Manövriereigenschaften, der Systemanordnung und den Wartungsanforderungen des Bootes vertraut zu machen, um einen reibungslosen Übergang in den Einsatz bei Lieferung der Produktionsboote
  sicherzustellen.</p>

hero:
  tagline: Labor 05
  title: Prototyp-Werkstatt
  subtitle: Vom CAD-Modell zum wasserbereiten Board — gebaut, ausgestattet und erprobt
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Afarer Prototyp-Werkstatt — Board-Fertigung
intro: >-
  Ein CAD-Modell kann, egal wie detailliert es ist, nicht zeigen, wie sich ein Board tatsächlich verhält, bevor es das Wasser trifft. Deshalb ist unsere Prototypenwerkstatt darauf ausgelegt, technische Daten so schnell und präzise wie möglich in ein physisches, wasserbereites Board zu übertragen.
  Jedes neue Afarer-Modell – und jeder bedeutende Sonderbau – durchläuft diese Werkstatt, bevor die Produktionswerkzeuge eingesetzt werden.
content_html: >-
  <h2>Wo Design zur Realität wird</h2>

  <p>Die Werkstatt ist vollständig für die gleichzeitige Fertigung von Rumpf, Rails und Ausrüstung ausgestattet. Dieser parallele Arbeitsablauf verkürzt die Prototypenlieferzeit auf 8–12 Wochen ab Freigabe der Konstruktion, verglichen mit dem branchenüblichen Standard von 16–20 Wochen. Wenn
  Ihre Anwendung eine spezielle Lösung erfordert, können wir von der Konzeption bis zur Erprobung auf dem Wasser in weniger als drei Monaten gelangen.</p>


  <h2>Werkstattkapazitäten</h2>

  <table>
    <thead><tr><th>Arbeitsstation</th><th>Ausrüstung</th><th>Zweck</th></tr></thead>
    <tbody>
      <tr><td>Rumpffertigung</td><td>CNC-Stoffzuschnittanlage, Heat-Laminierpresse, Drop-Stitch-Kern-Vorbereitungsstation</td><td>Rumpfproduktion in Originalgröße in allen drei Bauarten</td></tr>
      <tr><td>Rail- &amp; Kammernmontage</td><td>Hochfrequenz-Schweißpresse, Heißluft-Vorheftstation, Prüfaufblasvorrichtung</td><td>Fertigung von Rail- und Kammeraggregaten in Originalgröße mit allen Scheidewänden und Ventilen</td></tr>
      <tr><td>Ausrüstung &amp; Einbau</td><td>Finnenkasten-Fräsvorrichtung, Schweißvorrichtungen für Gepäckmontagen und Griffe, Deckpad-Zuschnittstation</td><td>Komplette Ausrüstung: Finnen, Gepäckmontagen, Leash-Plugs, Griffe, Deckpads, Ventile</td></tr>
      <tr><td>Messinstrumentenbereich</td><td>GPS-Geschwindigkeitssensor, Druckaufnehmer, Beschleunigungsmesser, Thermoelementarray, Datenlogger</td><td>Installation und Kalibrierung der Messtechnik für die Seerprobung</td></tr>
    </tbody>
  </table>


  <h2>Der Prototypenweg — Schritt für Schritt</h2>

  <ol>
    <li><strong>Konstruktionsübergabe</strong> — Das Konstruktionspaket (3D-Modell, FEA-Bericht, Stückliste, Laminatplan) wird vom Werkstattleiter und dem Projektingenieur formell überprüft. Eventuelle Fertigungsbedenken werden vor Beginn der Zuschnitte erkannt und behoben.</li>
    <li><strong>Rumpfproduktion</strong> — Der Rumpf wird gemäß den Konstruktionsvorgaben gefertigt. Bei einschichtigem Aufbau: Der Drop-Stitch-Kern wird mit der spezifizierten PVC-Schicht laminiert. Bei zweischichtigem Aufbau: Die zusätzliche Schicht wird vor dem Zuschnitt auf das Baslaminat aufgebracht. Bei verschmolzenem Aufbau: Die Laminierparameter werden aus dem genehmigten Prozessblatt geladen und an einem Erstmuster verifiziert.</li>
    <li><strong>Rail-Fertigung</strong> — Das Gewebe wird mittels CNC-Schnittschablonen zugeschnitten und anschließend zu Rails und Kammern in Originalgröße hochfrequenzverschweißt. Jede Kammer wird auf Prüfdruck aufgeblasen und 24 Stunden zur anfänglichen Stabilisierung belassen.</li>
    <li><strong>Montage &amp; Ausrüstung</strong> — Rumpf und Rails werden zusammengeführt. Finnenkästen und Gepäckmontagen werden eingesetzt, Leash-Plugs und Tragegriffe werden installiert, das Aufblasventil wird eingeschraubt und angezogen, und das Deckpad wird aufgebracht und ausgerichtet.</li>
    <li><strong>Statische Tests</strong> — Bevor das Board das Wasser berührt, durchläuft es: Auftriebsprüfung (Volllast + 30 % Reserve), Druckhalteprüfung der Kammern, Leckagetest des Ventils, Zugprüfung von Griffen und Montagen.</li>
    <li><strong>Seerprobungsprogramm</strong> — 20 Stunden Erprobung im Wasser, im Detail nachstehend.</li>
    <li><strong>Prototypenbesprechung</strong> — Ein formales Abnahmetreffen mit Konstruktion, Produktion und Qualität findet statt. Erforderliche Konstruktionsänderungen werden dokumentiert und in die Produktionsfreigabe einbezogen.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-Stunden-Seerprobungsprogramm — Prüfplan</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Vertrautmachen auf flachem Wasser — Langsamfahrt-Tracking, Wenden, Stand- und Trimmprüfung</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Geschwindigkeitsprüfung — GPS-verifizierte Höchstgeschwindigkeit, Reisegeschwindigkeit, gleichmäßiges Tempo bei 3 Schlagfrequenzen</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Wendetest — Dreh- und Sweep-Turnradius, Board-Reaktion, Back- und Steuerbord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Chop-Test — wiederholte Durchfahrten durch 0,5–1,0 m Seegang; Beschleunigungsmesser an der Rider-Position</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Stabilitätsprüfung — statischer Krängungswinkel mit 4 Ridern unterschiedlichen Gewichts, ausgleichende Last nach Steuerbord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Ausdauerfahrt — 3 Stunden kontinuierlich bei Reisegeschwindigkeit; Überwachung von Kammerdruck, Rail-Temperatur und Rider-Ermüdung</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Abschlusskontrolle — Nachuntersuchung aller Komponenten nach der Erprobung, Anziehen/Überprüfen aller Befestigungen, Dokumentation der Ergebnisse</span>
      </div>
    </div>
  </div>


  <h2>Maßgeschneiderte Prototypenfertigung für spezielle Anwendungen</h2>

  <p>In der Prototypenwerkstatt lösen wir die Probleme, die mit Standard-Produktionsboards nicht bewältigt werden können. Aktuelle Beispiele umfassen:</p>

  <ul>
    <li>Ein hochsichtbares Rettungs-SUP für eine Such- und Rettungsorganisation mit integrierten Griffen, Ausrüstungsmontagen für Rettungsgeräte und einem Rumpf mit hohem Auftrieb für die Bergung von Personen — alles bei uns als Prototyp entworfen, ausgestattet und getestet.</li>
    <li>Ein Expeditions-Touring-SUP für einen hydrographischen Vermessungsdienstleister mit abnehmbarem Instrumentenmast, versiegelten Ausrüstungsöffnungen und einer flachen Transducer-Halterung zur Minimierung des Strömungswiderstands.</li>
    <li>Ein kompaktes Angel-SUP für eine Resort-Flotte, bei dem der Prototyp zur Validierung von Stabilität, Ausrüstungsbestückung und Haltbarkeit im täglichen Vermietbetrieb eingesetzt wurde, bevor sich der Kunde für eine Flotte von vier Einheiten entschied.</li>
  </ul>


  <h2>Unser Prototypenteam</h2>

  <p>Die Werkstatt wird von acht vielseitig qualifizierten Marinetechnikern besetzt, von denen jeder in mindestens zwei der drei Kerndisziplinen (Rumpf, Rail, Ausrüstung) querqualifiziert ist. Der Teamleiter ist ein Meisterfertiger mit 16 Jahren Erfahrung, die von individuellen Einzelstücken
  bis hin zu Serienproduktionen reicht. Jeder Prototyp erhält einen dedizierten Projektingenieur, der als einziger Ansprechpartner für den Kunden während des gesamten Bau- und Erprobungsprozesses dient.</p>


  <h2>Kundenbeteiligung</h2>

  <p>Wir ermutigen unsere Kunden aktiv, an wichtigen Meilensteinen während des Prototypenbaus teilzunehmen — insbesondere an der ersten Ausstattungsbesprechung und der Seerprobung. Ihr operationelles Feedback in diesen Phasen ist von unschätzbarem Wert für die Feinabstimmung des Boards vor der
  Serienproduktion. Wir bauen nicht im Elfenbeinturm; wir bauen in Partnerschaft mit Ihnen.</p>

  <p>Die 20-stündige Seerprobung ist auch eine Gelegenheit für Ihr Team, sich mit dem Fahrverhalten, dem Decklayout und den Wartungsanforderungen des Boards vertraut zu machen, um einen reibungslosen Übergang in den Einsatz bei Lieferung der Produktionsboards
  sicherzustellen.</p>

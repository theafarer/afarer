    - title: '200+ Employees'
      description: 'Einschließlich 50+ F&E-Ingenieuren, QS-Spezialisten und Produktionstechnikern.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Eigenes Fertigungswerk mit 6 Produktionslinien für RIBs, Schlauchboote und SUP-Bretter.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Export nach Europa, Amerika, Naher Osten, Asien-Pazifik und Afrika.'

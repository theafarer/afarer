philosophy:
  tagline: Design Philosophy
  title: 'Ingenieurgetriebenes Design<br />—Jedes Detail zählt'
  subtitle: 'Unsere Ingenieursphilosophie basiert auf drei Prinzipien, die jedes Produkt leiten.'
  list:
    - 'Zuverlässigkeit zuerst: Jedes afarer-Produkt wird unter realen Bedingungen getestet'
    - 'Fertigungspräzision: CNC-Schneiden, Hochfrequenzschweißen und automatisierte Qualitätskontrolle'
    - 'Kontinuierliche Innovation: Unser F&E-Team bewertet neue Materialien, Produktionsmethoden und Designs'

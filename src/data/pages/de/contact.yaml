hero_text:
  tagline: Kontakt
  title: NEHMEN SIE KONTAKT AUF
contact_form:
  id: form
  title: Senden Sie uns eine Nachricht
  subtitle: Für Angebote, technische Fragen oder Partnerschaftsanfragen schreiben Sie uns. Wir antworten innerhalb eines Werktags.
  email_to: info@afarer.com
  submit_button: Nachricht senden
  success_message: Vielen Dank! Ihre Nachricht ist in unserem Posteingang gelandet. Wir werden innerhalb eines Werktags antworten.
  error_message: Beim Senden Ihrer Nachricht ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut oder schreiben Sie uns direkt eine E-Mail.
  default_country_code: '+1'
  captcha:
    label: 'Anti-Spam: Bitte lösen Sie die folgende Aufgabe'
  fields:
    - name: firstName
      label: Vorname
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Nachname
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Unternehmen
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Adresse
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: PLZ / Postleitzahl
      row: 4
      step: 2
    - name: country
      label: Land
      row: 4
      step: 2
    - name: email
      label: E-Mail
      row: 5
      step: 2
    - name: tel
      label: TEL
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Geschätztes Bestellvolumen
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Anpassung erforderlich?
      row: 7
      step: 2
    - name: productInterest
      label: Produktkategorien von Interesse
      row: 8
      step: 2
    - name: subject
      label: Betreff
      row: 9
      step: 3
    - name: message
      label: Nachricht
      row: 10
      type: textarea
      rows: 6
      step: 3

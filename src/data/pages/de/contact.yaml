hero_text:
  tagline: Kontakt
  title: NEHMEN SIE KONTAKT AUF
contact_form:
  id: form
  title: Senden Sie uns eine Nachricht
  subtitle: Für Angebote, technische Fragen oder Partnerschaftsanfragen schreiben Sie uns. Wir antworten innerhalb eines Werktags.
  email_to: info@afarer.com
  submit_button: Nachricht senden
  success_message: Vielen Dank! Ihre Nachricht ist in unserem Posteingang gelandet. Wir werden innerhalb eines Werktags antworten.
  error_message: Beim Senden Ihrer Nachricht ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut oder schreiben Sie uns direkt eine E-Mail.
  default_country_code: '+1'
  captcha:
    label: 'Anti-Spam: Bitte lösen Sie die folgende Aufgabe'
  fields:
    - name: firstName
      label: Vorname
      row: 1
    - name: lastName
      label: Nachname
      row: 1
    - name: companyName
      label: Unternehmen
      row: 2
    - name: address
      label: Adresse
      row: 3
    - name: zip
      label: PLZ / Postleitzahl
      row: 4
    - name: country
      label: Land
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-Mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Geschätztes Bestellvolumen
      row: 6
      type: select
      options:
        - value: ''
          label: Wählen Sie das geschätzte Volumen...
        - value: sample
          label: Nur Muster / Prototypen
        - value: '5-10'
          label: 50—00 Einheiten (Standard-Moq)
        - value: '100-500'
          label: 100—00 Einheiten
        - value: '500-plus'
          label: 500+ Einheiten (Mengenrabatt)
    - name: customization
      label: Anpassung erforderlich?
      row: 7
      type: select
      options:
        - value: ''
          label: Wählen Sie den Anpassungstyp...
        - value: none
          label: Standardprodukt (keine Anpassung)
        - value: logo
          label: Nur eigenes Logo / Branding
        - value: full
          label: Vollständige OEM (Größe, Farbe, Grafik, Verpackung)
        - value: consultation
          label: Nicht sicher —Beratung erforderlich
    - name: productInterest
      label: Produktkategorien von Interesse
      row: 8
      type: select
      options:
        - value: ''
          label: Wählen Sie eine Produktkategorie...
        - value: all
          label: Alle Produkte / Gesamtkatalog
        - value: sup
          label: SUP-Boards / Paddleboards
        - value: SUP
          label: Schlauchkajaks
        - value: SUP
          label: SUP-Boote
        - value: SUP
          label: Beiboote / Tender
        - value: safety
          label: Sicherheitsausrüstung / Schwimmwesten
        - value: accessory
          label: Zubehör (Pumpen, Paddel, Taschen)

    - name: subject
      label: Betreff
      row: 9
    - name: message
      label: Nachricht
      row: 10
      type: textarea
      rows: 6

hero_text:
  tagline: Kontakt
  title: NEHMEN SIE KONTAKT AUF
contact_form:
  id: form
  title: Senden Sie uns eine Nachricht
  subtitle: Für Angebote, technische Fragen oder Partnerschaftsanfragen schreiben Sie uns. Wir antworten innerhalb eines Werktags.
  email_to: info@afarer.com
  submit_button: Nachricht senden
  success_message: Vielen Dank! Ihre Nachricht ist in unserem Posteingang gelandet. Wir werden innerhalb eines Werktags antworten.
  error_message: Beim Senden Ihrer Nachricht ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut oder schreiben Sie uns direkt eine E-Mail.
  default_country_code: Eins
  captcha:
    label: 'Anti-Spam: Bitte lösen Sie die folgende Aufgabe'
  fields:
    - name: firstName
      label: Vorname
      row: 1
      type: select
      optionsKey: Länder
      step: 1
    - name: lastName
      label: Nachname
      row: 1
      type: select
      options:
        - value: ''
          label: Wählen Sie Ihr geschätztes Volumen...
        - value: Beispiel
          label: Nur Muster / Prototypen
        - value: 5-10
          label: 5–10 Einheiten (Standard-MOQ)
        - value: 100-500
          label: 100–500 Einheiten
        - value: Über 500
          label: 500 Einheiten (Mengenpreis)
      step: 1
    - name: companyName
      label: Unternehmen
      row: 2
      type: select
      options:
        - value: ''
          label: Wählen Sie den Anpassungstyp...
        - value: keiner
          label: Standardprodukt (keine Anpassung)
        - value: Logo
          label: Nur benutzerdefiniertes Logo / Branding
        - value: voll
          label: Vollständiger OEM (Größe, Farbe, Grafik, Verpackung)
        - value: Beratung
          label: Nicht sicher – brauche Beratung
      step: 1
    - name: address
      label: Adresse
      row: 3
      type: select
      options:
        - value: ''
          label: Produktkategorie auswählen...
        - value: alle
          label: Alle Produkte / Gesamtkatalog
        - value: Was geht?
          label: SUP-Boards / Stand-Up-Paddleboards
        - value: Sicherheit
          label: Sicherheitsausrüstung / Rettungswesten
        - value: Zubehör
          label: Zubehör (Pumpen, Paddel, Taschen)
      step: 1
    - name: zip
      label: PLZ / Postleitzahl
      row: 4
      step: 2
    - name: country
      label: Land
      row: 4
      step: 2
    - name: email
      label: E-Mail
      row: 5
      step: 2
    - name: tel
      label: TEL
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Geschätztes Bestellvolumen
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Anpassung erforderlich?
      row: 7
      step: 2
    - name: productInterest
      label: Produktkategorien von Interesse
      row: 8
      step: 2
    - name: subject
      label: Betreff
      row: 9
      step: 3
    - name: message
      label: Nachricht
      row: 10
      type: textarea
      rows: 6
      step: 3

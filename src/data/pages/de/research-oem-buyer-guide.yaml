hero:
  tagline: Beschaffung
  title: OEM-Käuferhandbuch — Beschaffung von aufblasbaren Wasserfahrzeugen aus Asien
  subtitle: 12 Min. Lesezeit
content_html: >
  <h2>1. Vorqualifikation: Worauf man in einer Fabrik achten sollte</h2>


  <h3>Compliance-Zertifikate</h3>

  <ul>
    <li><strong>ISO 9001:2015</strong> – Qualitätsmanagementsystem</li>
    <li><strong>CE-Zertifizierung</strong> – Überprüfung der Nummer der Notifizierten Stelle</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Sozial-Compliance-Audits</li>
    <li><strong>REACH / RoHS</strong> – Material-Compliance-Erklärungen</li>
  </ul>


  <h3>Fertigungskapazitäten</h3>

  <ul>
    <li>Drop-Stitch-Kernweberei im Haus vs. ausgelagert</li>
    <li>PVC-Beschichtung / Laminationslinie</li>
    <li>HF-Schweiß- und Heißluftschweißgeräte</li>
    <li>Eigene Formherstellung (CNC-Bearbeitung)</li>
    <li>Testlabor (Druckprüfung, UV-Alterung, Zugtest)</li>
  </ul>


  <h3>Erfahrungsverifizierung</h3>

  <ul>
    <li>Jahre in der Herstellung von aufblasbaren Wasserfahrzeugen (mindestens 5 Jahre)</li>
    <li>Anzahl der Ingenieure im Stab</li>
    <li>Bestehende OEM/ODM-Clients (Referenzen anfordern)</li>
    <li>Exportziele – werden sie bereits an Ihren Zielmarkt geliefert?</li>
  </ul>


  <h2>2. Qualitätskontrollprotokolle</h2>

  <p>Eingehende Material-QC: Zugfestigkeit (ASTM D751 oder ISO 1421), Reißfestigkeit (ASTM D2261 oder ISO 4674), Adhäsionsfestigkeit, UV-Alterungsprüfungen.</p>

  <p>In-Process Qualitätskontrolle: Nahtfestigkeitsüberwachung alle 50 Einheiten, Ventildrehmomentverifikation, Drop-Stitch-Gewindendichte-Prüfungen, Maßprüfungen mit CAD-Zeichnungen.</p>

  <p>Endgültige Inspektion: 100%-Inflationshalttest (24 Stunden, maximal 5% Abfälle), Sichtkontrolle, Ventilfunktionstest, Zufallsprobentest (AQL 2,5 oder 4,0 gemäß ISO 2859).</p>


  <h2>3. Checkliste zur Compliance-Dokumentation</h2>

  <ul>
    <li>Konformitätserklärung (DoC) mit Bezug auf die korrekte EU-Richtlinie</li>
    <li>CE-Zertifikat von der gemeldeten Stelle</li>
    <li>Testbericht aus einem akkreditierten Labor</li>
    <li>Sicherheitsdatenblätter (MSDS)</li>
    <li>REACH-Compliance-Erklärung</li>
    <li>Baustückliste mit Lieferantenrückverfolgbarkeit</li>
    <li>Werksinspektionsbericht</li>
  </ul>


  <h2>4. MOQ-Verhandlung</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr Klasse="bg-gray-100">
        <. Klasse="p-3 Text-links Schrift-halbfett Text-grau-900 Rand">Produkttyp</th>
        <. Klasse="p-3 Text-links-Schrift-halbfett Text-grau-900-Rand">Standard-MOQ</th>
        <. Klasse="p-3 Text-links Schrift-halbfett Text-grau-900 Rand">Verhandelbarer Bereich</th>
      </tr>
    </thead>
    <tbody>
      <tr><td-Klasse="p-3-Rand">SUP-Boards</td><td-Klasse="p-3-Rand">50 – 100 Einheiten</td><td-Klasse="p-3-Rand">5 – 10 Einheiten (Versuch)</td></tr>
      <tr><td-Klasse="p-3-Rand">Kajaks</td><td-Klasse="p-3-Rande">50 – 100 Einheiten</td><td-Klasse="p-3-Rand">5 – 10 Einheiten (Versuch)</td></tr>
      <tr><td-Klasse="p-3-Grenze">Aufblasbare Boote</td><td-Klasse="p-3-Grenze">50 – 100 Einheiten</td><td-Klasse="p-3-Grenze">2 – 5 Einheiten (Versuch)</td></tr>
      <tr><td-Klasse="p-3-Grenze">RIB-Boote</td><td-Klasse="p-3-Grenze">20 – 50 Einheiten</td><td-Klasse="p-3-Grenze">2 – 5 Einheiten (Versuch)</td></tr>
      <tr><td-Klasse="p-3-Rand">Sicherheit / Zubehör</td><td-Klasse="p-3-Rand">200 – 500 Einheiten</td><td-Klasse="p-3-Rand">50 – 100 Einheiten (Versuch)</td></tr>
    </tbody>
  </table>


  <h2>5. Logistik und Versand</h2>

  <p>Gängige Incoterms: <strong>FOB</strong> (Factory liefert zum Abfahrtshafen – am häufigsten), <strong>EXW</strong> (Käufer organisiert den Versand von der Fabriktür), <strong>CIF</strong> (Factory zahlt Fracht- und Versicherungsleistungen zum Zielhafen).</p>

  <p>Aufblasbare Produkte sind geringgewichtig und mit hohem Volumen – das volumetrische Gewicht (DIM) bestimmt oft die Versandkosten. Fordern Sie vakuumverpackte Verpackungen an, um das Volumen um 50–60 % zu reduzieren. Seefracht von China zur EU: 25–35 Tage; an die US-Westküste: 15–20 Tage.</p>


  <h2>6. Häufige Fallstricke</h2>

  <ul>
    <li><strong>Keine Werksprüfung:</strong> Führen Sie stets eine Unabhängigkeitsprüfung durch oder beauftragen Sie sie (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Nur mündliche Spezifikationen:</strong> Detailliertes technisches Spezifikationsblatt, das von beiden Parteien unterzeichnet wurde</li>
    <li><strong>Probenfreigabe überspringen:</strong> Schriftliche Abschrift der Proben vor der Massenproduktion</li>
    <li><strong>Keine Qualitätskontrolle während der Produktion:</strong> Inspektion durch Dritte während der Produktion (DUPRO) und vor dem Versand (PSI)</li>
    <li><strong>Ignorieren der Compliance:</strong> CE/UKCA-Zertifizierung vor der Produktion überprüfen</li>
  </ul>


  <h2>7. Warum Ferner</h2>

  <p>Afarer stellt seit 2012 OEM/ODM-aufblasbare Wasserfahrzeuge her. Mit einer 12.000 m² großen, ISO 9001 zertifizierten Anlage, 25 Ingenieuren und CE-Zertifizierung in allen Produktlinien erfüllen wir jedes Kriterium in diesem Leitfaden. Wir bieten Test-MOQs für neue Partner sowie vollständige
  Compliance-Dokumentationspakete an.</p>

content_html: |-
  <h2>1. Vorqualifizierung: Worauf man bei einer Fabrik achten sollte</h2>

  <h3>Konformit&auml;tszertifikate</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> &ndash; Qualit&auml;tsmanagementsystem</li>
    <li><strong>CE-Zertifizierung</strong> &ndash; Nummer der benannten Stelle &uuml;berpr&uuml;fen</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> &ndash; Audits zur sozialen Konformit&auml;t</li>
    <li><strong>REACH / RoHS</strong> &ndash; Erkl&auml;rungen zur Materialkonformit&auml;t</li>
  </ul>

  <h3>Fertigungskapazit&auml;ten</h3>
  <ul>
    <li>Drop-Stitch-Kernweberei hausintern vs. ausgelagert</li>
    <li>PVC-Beschichtungs- / Kaschieranlage</li>
    <li>HF-Schwei&szlig;- und Hei&szlig;luftschwei&szlig;ausr&uuml;stung</li>
    <li>Hausinterne Formenherstellung (CNC-Bearbeitung)</li>
    <li>Pr&uuml;flabor (Druckpr&uuml;fung, UV-Alterung, Zugpr&uuml;fung)</li>
  </ul>

  <h3>&Uuml;berpr&uuml;fung der Erfahrung</h3>
  <ul>
    <li>Jahre in der Fertigung aufblasbarer Wasserfahrzeuge (mindestens 5+ Jahre)</li>
    <li>Anzahl der Ingenieure im Unternehmen</li>
    <li>Bestehende OEM/ODM-Kunden (Referenzen anfordern)</li>
    <li>Exportziele &ndash; liefern sie bereits in Ihren Zielmarkt?</li>
  </ul>

  <h2>2. Qualit&auml;tskontrollprotokolle</h2>
  <p>Material-Eingangs-QC: Zugfestigkeit (ASTM D751 oder ISO 1421), Rei&szlig;festigkeit (ASTM D2261 oder ISO 4674), Haftfestigkeit, UV-Alterungs-Stichprobenpr&uuml;fungen.</p>
  <p>Prozess-QC: &Uuml;berwachung der Nahtfestigkeit alle 50 Einheiten, Pr&uuml;fung des Ventildrehmoments, Kontrolle der Drop-Stitch-Fadendichte, Ma&szlig;kontrollen anhand von CAD-Zeichnungen.</p>
  <p>Endkontrolle: 100% Haltepr&uuml;fung der Bef&uuml;llung (24 Stunden, max. 5% Druckabfall), Sichtpr&uuml;fung, Funktionstest des Ventils, Stichprobenpr&uuml;fung (AQL 2.5 oder 4.0 gem&auml;&szlig; ISO 2859).</p>

  <h2>3. Checkliste der Konformit&auml;tsdokumentation</h2>
  <ul>
    <li>Konformit&auml;tserkl&auml;rung (DoC) mit Verweis auf die korrekte EU-Richtlinie</li>
    <li>CE-Zertifikat einer benannten Stelle</li>
    <li>Pr&uuml;fbericht eines akkreditierten Labors</li>
    <li>Sicherheitsdatenbl&auml;tter (MSDS)</li>
    <li>REACH-Konformit&auml;tserkl&auml;rung</li>
    <li>St&uuml;ckliste mit R&uuml;ckverfolgbarkeit der Lieferanten</li>
    <li>Werkinspektionsbericht</li>
  </ul>

  <h2>4. MOQ-Verhandlung</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Produkttyp</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standard-MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Verhandelbarer Bereich</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP-Boards</td><td class="p-3 border">50 &ndash; 100 Einheiten</td><td class="p-3 border">5 &ndash; 10 Einheiten (Testbestellung)</td></tr>
      <tr><td class="p-3 border">Kajaks</td><td class="p-3 border">50 &ndash; 100 Einheiten</td><td class="p-3 border">5 &ndash; 10 Einheiten (Testbestellung)</td></tr>
      <tr><td class="p-3 border">Aufblasbare Boote</td><td class="p-3 border">50 &ndash; 100 Einheiten</td><td class="p-3 border">2 &ndash; 5 Einheiten (Testbestellung)</td></tr>
      <tr><td class="p-3 border">RIB-Boote</td><td class="p-3 border">20 &ndash; 50 Einheiten</td><td class="p-3 border">2 &ndash; 5 Einheiten (Testbestellung)</td></tr>
      <tr><td class="p-3 border">Sicherheit / Zubeh&ouml;r</td><td class="p-3 border">200 &ndash; 500 Einheiten</td><td class="p-3 border">50 &ndash; 100 Einheiten (Testbestellung)</td></tr>
    </tbody>
  </table>

  <h2>5. Logistik und Versand</h2>
  <p>G&auml;ngige Incoterms: <strong>FOB</strong> (Fabrik liefert an den Abfahrtshafen &ndash; am h&auml;ufigsten), <strong>EXW</strong> (K&auml;ufer organisiert den gesamten Versand ab Werksgel&auml;nde), <strong>CIF</strong> (Fabrik bezahlt Fracht und Versicherung bis zum Zielhafen).</p>
  <p>Aufblasbare Produkte sind leicht, aber volumin&ouml;s &ndash; das Volumengewicht (DIM) bestimmt oft die Versandkosten. Verlangen Sie vakuumverpackte Verpackung, um das Volumen um 50&ndash;60% zu reduzieren. Seefracht von China in die EU: 25&ndash;35 Tage; an die US-Westk&uuml;ste: 15&ndash;20 Tage.</p>

  <h2>6. H&auml;ufige Fallstricke</h2>
  <ul>
    <li><strong>Kein Werksaudit:</strong> F&uuml;hren Sie immer ein Drittpartei-Audit durch oder beauftragen Sie eines (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Nur m&uuml;ndliche Spezifikationen:</strong> Detailliertes technisches Spezifikationsblatt, das von beiden Parteien unterzeichnet wird</li>
    <li><strong>Musterfreigabe &uuml;berspringen:</strong> Schriftliche Freigabe der Muster vor der Serienproduktion</li>
    <li><strong>Keine QC w&auml;hrend der Produktion:</strong> Drittpartei-Inspektion w&auml;hrend der Produktion (DUPRO) und vor dem Versand (PSI)</li>
    <li><strong>Konformit&auml;t ignorieren:</strong> CE/UKCA-Zertifizierung vor der Produktion &uuml;berpr&uuml;fen</li>
  </ul>

  <h2>7. Warum Afarer</h2>
  <p>Afarer fertigt seit 2012 aufblasbare OEM/ODM-Wasserfahrzeuge. Mit einer ISO 9001-zertifizierten Anlage von 12,000 m&sup2;, &uuml;ber 25 Ingenieuren und CE-Zertifizierung in allen Produktlinien erf&uuml;llen wir jedes Kriterium in diesem Leitfaden. Wir bieten Test-MOQs f&uuml;r neue Partner und vollst&auml;ndige Pakete zur Konformit&auml;tsdokumentation an.</p>

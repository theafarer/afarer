meta:
  title: SUP Mietflottenlösungen | {SITE}
  description: SUP-Boards mit hoher Drehzahl, entwickelt für den täglichen Verleih. UV-beständiges PVC, verstärkte Nähte, schnell trocknende Materialien. Skalieren Sie Ihr Verleihgeschäft mit Afarer.
hero:
  tagline: Mietbetreiber
  title: Skalieren Sie Ihr Vermietungsgeschäft<br />Mit Vertrauen
  subtitle: High-Rotation-SUP-Boards, entwickelt für den täglichen Verleih, 365 Tage im Jahr. Ihr Umsatz macht nie einen Tag Pause.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Geschäftiger Verleihkiosk mit SUP-Boards bereit für Gäste
features:
  title: Für den Vermietungsalltag gebaut
  subtitle: Jedes Board ist für 500 Mietzyklen mit minimalem Wartungsaufwand konstruiert.
  items:
    - title: 500 Mietzyklen
      description: Getestet, um dem täglichen Gebrauch in Salzwasser, Sonne und Sand standzuhalten.
      icon: tabler:shield-check
    - title: UV-beständiger Stoff
      description: Keine Verblassung oder Verschlechterung nach 1 Jahr Lagerung im Freien.
      icon: tabler:sun
    - title: Verstärkte Nähte
      description: 3x stärker als die Standardkonstruktion aufblasbarer Boards.
      icon: tabler:layers-intersect
    - title: Schnelltrocknende Materialien
      description: Bretter in weniger als 30 Minuten für die nächste Miete bereit.
      icon: tabler:droplet
    - title: Stapelspeicher
      description: Platzsparendes Design — 40 % mehr Bretter im gleichen Bereich lagern.
      icon: tabler:stack
    - title: Farbcodierte Größen
      description: Das Personal greift sofort die richtige Tafel mit farbcodierter Größenanpassung.
      icon: tabler:color-swatch
stats:
  title: Betriebskennzahlen
  stats:
    - title: Vorstandswechsel
      amount: < 5 Min
    - title: Jährliche Wartung
      amount: ~15 Min./Brett
    - title: Teileversand
      amount: "48\_Stunden"
    - title: Fehlerquote
      amount: < 0,5%
fleet_guide:
  title: Flotten Größenleitfaden
  subtitle: Schätzen Sie die Größe der Flotte und das Umsatzpotenzial Ihres Mietbetriebs.
  tiers:
    - label: Kleiner Kiosk
      boards: 15-20
      revenue: $XX.XXX/Jahr
    - label: Mittelgroßer Betrieb
      boards: 30–50
      revenue: $XX.XXX/Jahr
    - label: Große Strandvermietung
      boards: 50-100
      revenue: $XXX.XXX/Jahr
cta:
  title: Bereit, Ihr Vermietungsgeschäft zu skalieren?
  subtitle: Erhalten Sie Mietpreise oder vergleichen Sie Brettmodelle für Ihren Betrieb.
  actions:
    - text: Mietpreise abrufen
      href: /contact?package=rental
      variant: primary
    - text: Board-Modelle vergleichen
      href: /compare
      variant: secondary

workshops:
  - title: SUP-Board-Produktion
    description: '4 parallele Montagelinien für aufblasbare SUP-Boards. Jede Linie kann 50–80 Boards pro Schicht produzieren. Digitale Druck- und Siebdruckstationen laufen gleichzeitig. Jährliche SUP-Kapazität: 8.000 Boards.'
    output: 8.000 SUPs/Jahr
  - title: SUP Boat Production
    description: Spezialisierte GFK-Rumpfwerkstatt mit 6 Formstationen für SUP-Rümpfe bis 7,6 m
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: Mehrzweck-Produktionslinien für Schlauchboote, Kajaks und Dinghys. Heißluftschweißen
    output: 5.000 Einheiten/Jahr
  - title: Sicherheitsausrüstung
    description: Separater Reinraumbereich für Schwimmwesten und Sicherheitsausrüstung
    output: 50.000 Schwimmwesten/Jahr
oem_capacity:

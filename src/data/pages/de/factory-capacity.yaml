workshops:
  - title: SUP-Board-Produktion
    description: '4 parallele Montagelinien für aufblasbare SUP-Boards. Jede Linie kann 50–80 Boards pro Schicht produzieren. Digitale Druck- und Siebdruckstationen laufen gleichzeitig. Jährliche SUP-Kapazität: 8.000+ Boards.'
    output: '8.000+ SUPs/Jahr'
  - title: 'RIB-Boot-Produktion'
    description: 'Spezialisierte GFK-Rumpfwerkstatt mit 6 Formstationen für Bootsrümpfe bis 7,6 m. Bereich für Rohrschweißen und Montage bearbeitet 3–6 Boote gleichzeitig. Jährliche RIB-Kapazität: 2.000+ Boote.'
    output: '2.000+ RIBs/Jahr'
  - title: 'Schlauchboote & SUP'
    description: 'Mehrzweck-Produktionslinien für Schlauchboote, Kajaks und Dinghys. Heißluftschweißstationen, RF-Dielektrikpressen und Montagearbeitsplätze werden je nach Auftragsmix neu konfiguriert. Jährliche Kapazität: 5.000+ Einheiten.'
    output: '5.000+ Einheiten/Jahr'
  - title: Sicherheitsausrüstung
    description: 'Separater Reinraumbereich für Schwimmwesten und Sicherheitsausrüstung. Dedizierte Näh-, Schaumstoffeinlege- und Prüfstationen. Jährliche Kapazität für Schwimmwesten: 50.000+ Einheiten.'
    output: '50.000+ Schwimmwesten/Jahr'
oem_capacity:

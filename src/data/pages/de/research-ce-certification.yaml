hero:
  tagline: Compliance
  title: Wie die CE-Zertifizierung für aufblasbare Wasserfahrzeuge funktioniert
  subtitle: 7 Min. Lesezeit
content_html: >
  <h2>Was ist eine CE-Zertifizierung?</h2>

  Die <p>CE-Markierung (Conformité Européenne) zeigt an, dass ein Produkt die EU-Anforderungen an Gesundheit, Sicherheit und Umwelt erfüllt. Für aufblasbare Wasserfahrzeuge hängt der relevante regulatorische Rahmen von der Produktkategorie ab.</p>


  <h2>Anwendbare Richtlinien</h2>


  <h3>Richtlinie über Freizeitfahrzeuge (2013/53/EU)</h3>

  <p>Die Hauptanweisung für die meisten aufblasbaren Boote, SUPs und Kajaks. Er gilt für Freizeitfahrzeuge von 2,5 m bis 24 m Rumpflänge, teilweise fertiggestellte Boote (für OEM-Lieferung) und Wasserfahrzeuge.</p>


  Verordnung über <h3>persönliche Schutzausrüstung (2016/425)</h3>

  <p>Schwimmwesten, Auftriebshilfen und Sicherheitsausrüstung, die mit Wasserfahrzeugen geliefert werden, müssen die Anforderungen der PPE-Vorschriften erfüllen, einschließlich der Typprüfung (Modul B) durch eine benachteiligte Stelle und Produktionsqualitätssicherung (Modul D oder E).</p>


  <h2>Der Zertifizierungsprozess</h2>

  <ol>
    <li>Produktklassifikation: Bestimmung der Schiffsdesignkategorie (A – D gemäß ISO 8666)</li>
    <li>Anwendbare Normen: EN ISO 6185 (Teile 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (Bauschild)</li>
    <li>Erstellung technischer Akten: Entwurfszeichnungen, Materiallisten, Materialzertifikate, Risikobewertung</li>
    <li>Typprüfung: Auftrieb, Stabilität, Lastkapazität, Materialprüfung, Nahtfestigkeit, Luftretention</li>
    <li>Produktionskontrolle in der Fabrik: Eine Prüfung der Fertigungsprozesse durch die gemeldete Stelle</li>
    <li>Konformitätserklärung: Hersteller unterschreibt DoC, setzt CE-Markierung</li> auf
  </ol>


  <h2>Gemeldete Stellen für aufblasbare Wasserfahrzeuge</h2>

  <p>Häufige NBs sind Bureau Veritas (Frankreich), DNV GL (Deutschland), RINA (Italien), TÜV Rheinland / TÜV SÜD (Deutschland).</p>


  <h2>Zeitplan und Kosten</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr Klasse="bg-gray-100">
        <. Klasse="p-3 Text-links schrift-halbfett text-grau-900 Rand">Phase</th>
        <. Klasse="p-3 Text-links schrift-halbfett text-grau-900 Rand">Dauer</th>
        < Klasse="p-3 Text-links-Schrift-halbfett Text-grau-900-Rand">Typische Kosten (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td Klasse="P-3 Rand">Technische Dateivorbereitung</td>< Klasse="P-3 Rand">2 – 4 Wochen</td>< Klasse = "P-3 Grenze">2.000 – 5.000</td></tr>
      <tr>< Klasse="P-3 Rand">Typ Prüfung</td><Klasse Klasse="P-3 Rand">4 – 8 Wochen</td> < Klasse = "P-3 Grenze">8.000 – 20.000</td></tr>
      <tr><td-Klasse="P-3-Grenze">Fabrikprüfung</td><td-Klasse="P-3-Grenze">1 – 2 Tage (vor Ort)</td><td-Klasse="P-3-Grenze">3.000 – 6.000</td></tr>
      <tr><td-Klasse="P-3-Rand">Gesamt (Erstprodukt)</td><td-Klasse="p-3-Rand">8 – 14 Wochen</td><td-Klasse="p-3-Grenze">13.000 – 31.000</td></tr>
    </tbody>
  </table>


  <h2>Was das für Käufer bedeutet</h2>

  <p>Beim Kauf von CE-zertifizierten aufblasbaren Booten sollten Sie stets sicherstellen, dass die CE-Markierung auf dem Bauer-Schild steht, ein gültiges DoC vorhanden ist, die Notified Body-Nummer angegeben ist und das Bedienungshandbuch Sicherheitshinweise in Ihrer Landessprache enthält. Alle
  Afarer-Produkte verfügen über CE-Zertifizierung mit vollständiger Rückverfolgbarkeit auf Auditberichte der benachteiligten Stellen.</p>

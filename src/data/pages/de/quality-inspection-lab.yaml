intro: >-
  Jedes Boot, das unsere Werkstatt verlässt, trägt die Bescheinigung, dass es eine definierte Reihe von Qualitätsprüfungen und Materialtests bestanden hat. Unser Qualitäts- und Inspektionslabor ist eine unabhängige Funktion innerhalb der Organisation – es berichtet direkt an den Geschäftsführer,
  nicht an die Produktion – und stellt sicher, dass kein kommerzieller Druck das Inspektionstor beeinflussen kann. Wenn eine Materialcharge oder ein fertiges Boot die veröffentlichten Spezifikationen nicht erfüllt, hat das Labor die Befugnis, den Versand zu stoppen, bis die Nichtübereinstimmung
  behoben ist.
content_html: "<h2>Vertrauen, aber verifizieren</h2>\n<p>Das Labor arbeitet nach einem Qualitätsmanagementsystem nach anerkannten Grundsätzen, und unsere Prüfverfahren basieren auf ISO-, ASTM- und EN-Normen, wo immer anwendbar. Wir führen detaillierte Aufzeichnungen über jeden durchgeführten Test und schaffen eine vollständige Rückverfolgbarkeit von der Roherstoffannahme bis zur endgültigen Bootslieferung.</p>\n\n<h2>Prüfwerkzeuge und Fähigkeiten</h2>\n<table>\n  <thead><tr><th>Ausrüstung</th><th>Durchgeführte Tests</th><th>Norm / Methode</th></tr></thead>\n  <tbody>\n    <tr><td>Universalprüfmaschine (50 kN)</td><td>Zugfestigkeit (Gewebe), Abreißwiderstand (Nähte), Reißfortpflanzung</td><td>ISO 1421, ISO 4674</td></tr>\n    <tr><td>Druckhalte-Prüfstand (programmierbar)</td><td>1000-Zyklen-Aufblas-/Abblas-Dauerhaltbarkeit, 30-min-Druckhaltetest</td><td>ISO 6185 (intern)</td></tr>\n    <tr><td>Nahtabreißvorrichtung (motorisiert, 180°-Abreißwinkel)</td><td>Schweiß- und Klebenahrt Abreißfestigkeit bei 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>\n    <tr><td>Hydrostatischer Druckkopf-Prüfer</td><td>Wasserpenetrationswiderstand des Gewebes (0–1000 mbar)</td><td>ISO 811</td></tr>\n    <tr><td>Digitaler Dickenmessreißer &amp; Mikrometer</td><td>Gewebedicke, Schlauchwanddicke, Klebstofffilmdicke</td><td>ISO 2286-3</td></tr>\n    <tr><td>Klimakammer</td><td>Temperaturkonditionierung (-40 °C bis +80 °C) für Kältebruch- und Wärmealterungstests</td><td>ISO 188, ISO 4675</td></tr>\n    <tr><td>Farbspektrophotometer</td><td>Delta-E-Farbmessung nach UV-Belastung</td><td>ISO 105-A05 / ASTM D2244</td></tr>\n  </tbody>\n</table>\n\n<h2>Die Prüfstationen — vom Material bis zur Lieferung</h2>\n<p>Jedes Boot folgt einem definierten Qualitätsplan mit obligatorischen Prüfpunkten. Kein Boot kann eine Prüfstation überspringen; jede Station muss von einem Qualitätsprüfer abgenommen werden, bevor die nächste Produktionsphase beginnt.</p>\n\n<div class=\"not-prose my-8\">\n  <div class=\"relative\">\n    <div class=\"absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800\"></div>\n    <div class=\"space-y-6 relative\">\n      <div class=\"flex gap-4\">\n        <div class=\"flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10\">Station 1</div>\n        <div class=\"flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800\">\n          <p class=\"text-sm font-semibold\">Wareneingangsprüfung</p>\n          <p class=\"text-xs text-gray-500 mt-1\">Gewebecharge, Klebstoffcharge, Beschläge — alles wird gegen die Eingangsspezifikation geprüft, bevor es in die Produktion freigegeben wird.</p>\n        </div>\n      </div>\n      <div class=\"flex gap-4\">\n        <div class=\"flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10\">Station 2</div>\n        <div class=\"flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800\">\n          <p class=\"text-sm font-semibold\">Prozessintegrierte Schweißnahtprüfung</p>\n          <p class=\"text-xs text-gray-500 mt-1\">Erstlings-Schweißprüfkörper wird zu Beginn jeder Produktionsschicht getestet (Abreiß + visuell).</p>\n        </div>\n      </div>\n      <div class=\"flex gap-4\">\n        <div class=\"flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10\">Station 3</div>\n        <div class=\"flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800\">\n          <p class=\"text-sm font-semibold\">Kammer-Lufittest</p>\n          <p class=\"text-xs text-gray-500 mt-1\">Jede Kammer wird auf das 1,5-fache des Betriebsdrucks belastet und 30 Minuten gehalten. Daten werden nach Seriennummer protokolliert.</p>\n        </div>\n      </div>\n      <div class=\"flex gap-4\">\n        <div class=\"flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10\">Station 4</div>\n        <div class=\"flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800\">\n          <p class=\"text-sm font-semibold\">Auslieferungsprüfung</p>\n          <p class=\"text-xs text-gray-500 mt-1\">Vollständiges Boot inspiziert: Alle Befestigungen angezogen, Systeme funktionsfähig, keine optischen Mängel. 100-Punkte-Checkliste.</p>\n        </div>\n      </div>\n      <div class=\"flex gap-4\">\n        <div class=\"flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10\">Station 5</div>\n        <div class=\"flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800\">\n          <p class=\"text-sm font-semibold\">Finale Zertifizierung</p>\n          <p class=\"text-xs text-gray-500 mt-1\">Prüfberichte zusammengestellt, Prüfprotokolle überprüft, Übereinstimmungsbescheinigung ausgestellt.</p>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>\n\n<h2>Wichtige Qualitätskennzahlen (2025 fortlaufender Durchschnitt)</h2>\n<div class=\"not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4\">\n  <div class=\"p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center\">\n    <span class=\"block text-2xl font-bold text-blue-600\">99,7 %</span>\n    <span class=\"text-xs text-gray-500\">Erstlingsausschussquote (Gewebecharge)</span>\n  </div>\n  <div class=\"p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center\">\n    <span class=\"block text-2xl font-bold text-blue-600\">&lt; 0,2 %</span>\n    <span class=\"text-xs text-gray-500\">Schweißnaht-Ausschussrate (Laufmeter)</span>\n  </div>\n  <div class=\"p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center\">\n    <span class=\"block text-2xl font-bold text-blue-600\">100 %</span>\n    <span class=\"text-xs text-gray-500\">Kammern luftgeprüft vor Montage</span>\n  </div>\n  <div class=\"p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center\">\n    <span class=\"block text-2xl font-bold text-blue-600\">ISO 6185</span>\n    <span class=\"text-xs text-gray-500\">Entwurfskategorie-Konformität</span>\n  </div>\n</div>\n\n<h2>Unser Qualitätsteam</h2>\n<p>Das Labor wird von einem Qualitätsmanager (10 Jahre maritim Qualitätssicherung, ASQ Certified Quality Engineer), zwei Qualitätsprüfern (je mit Level-2-Zertifizierung in visueller zerstörungsfreier Prüfung) und einem Materialtechniker, der für alle physikalischen Tests verantwortlich ist, besetzt. Das Team durchläuft jährliche Kompetenztests über einen unabhängigen Drittanbieter, um sicherzustellen, dass unsere Testergebnisse genau und reproduzierbar bleiben.</p>\n\n<h2>Unabhängige Prüfungen für Kunden</h2>\n<p>Unser Qualitäts- &amp; Inspektionslabor steht für unabhängige Prüfdienstleistungen zur Verfügung. Wenn Sie eine Gewebespezifikation verifizieren, ein neues Klebstoffsystem validieren oder einen Drittanbieter-Prüfbericht für eine Beschaffungsqualifikation benötigen, können wir die Tests nach der einschlägigen Norm durchführen und einen zertifizierten Prüfbericht ausstellen.</p>\n<p>Beispiele für aktuelle Drittanbieter-Prüfarbeiten:</p>\n<ul>\n  <li>Abreißfestigkeitsvergleich von fünf konkurrierenden Klebstofffilmprodukten für ein europäisches militärisches Beschaffungsprogramm.</li>\n  <li>Beschleunigungsalterungsstudie (UV + Thermowechsel) für eine neue orangefarbene PVC-Formulierung mit regelmäßigen Zwischenmessungen in 500-h-Intervallen.</li>\n  <li>Druckhaltevalidierung von 50 Prototyp-Steigventilen für ein neues Hochdruckschlauchdesign.</li>\n</ul>\n\n<h2>Unser Engagement für Sie</h2>\n<p>Wenn Sie ein {SITE.name}-Boot erhalten, erhalten Sie auch seine Qualitätsakte — eine zusammengestellte Aufzeichnung der Testergebnisse, die für Ihr spezifisches Boot gelten. Gewebechargezertifikat, Schweißnaht-Abreißtests, Kammer-Lufittest-Protokolle und Auslieferungsprüfungs-Checkliste. Jede Zahl ist rückverfolgbar. Jeder Prüfer ist identifiziert. Das ist nicht nur Papierkram — es ist unser Versprechen, dass wir geliefert haben, was wir spezifiziert haben.</p>\n<p>Sollten Sie jemals ein Qualitätsanliegen haben, können Sie das Labor direkt kontaktieren — die Kontaktdaten sind auf Ihrer Übereinstimmungsbescheinigung gedruckt. Wir nehmen jede Anfrage ernst und verpflichten uns zu einer formalen Untersuchung innerhalb von 48 Stunden.</p>\n\r\n"

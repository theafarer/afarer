hero:
  tagline: Partners & Distribution
  title: 'Werden Sie afarer-Partner<br />—Globales Vertriebsnetz'
  subtitle: 'Treten Sie dem globalen Partnernetzwerk bei. Wir arbeiten mit Vertriebspartnern und Händlern in 50+ Ländern.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: Partner Programs
  title: 'Partnerprogramme<br />Für Wachstum'
  subtitle: 'Ob Vertriebspartner, Händler oder Markenpartner – wir bieten passende Programme.'
  columns: 3
  items:
    - title: 'Vertriebspartnerprogramm'
      description: 'Exklusiver Gebietsvertrieb mit Mengenrabatten, Marketing und direktem Werkszugang.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Direkte Händlerpreise, Schulungen, Marketingmaterialien und Garantiesupport.'
      icon: tabler:building-store
    - title: 'OEM/ODM-Partnerschaft'
      description: 'Full-Service OEM und ODM mit individuellem Branding, Verpackung und Spezifikationen. Vom Konzept zum Container.'
      icon: tabler:certificate
    - title: 'Markenpartnerschaft'
      description: 'Co-Branding, Private Label und exklusive Modelle für etablierte Marken.'
      icon: tabler:stars
    - title: 'Regierung & Institutionen'
      description: 'Bevorzugte Lieferantenprogramme für Behörden, Küstenwache, Militär und humanitäre Organisationen.'
      icon: tabler:building-community
    - title: 'Resort- & Vermietungspartner'
      description: 'Flottenpreise, konstante Qualität und Branding für Resorts, Tauchbasen und Vermietungen.'
      icon: tabler:sun
content_benefits:
  tagline: Why Partner With Us
  title: 'Warum Partner afarer wählen'
  subtitle: 'Unsere Partner profitieren von echter Fertigungskapazität, gleichbleibender Qualität und reaktionsschnellem Support.'
  list:
    - 'Direkter Fabrikzugang: Arbeiten Sie direkt mit unserem Fertigungsteam – ohne Zwischenhändler'
    - 'Anpassungsbereit: Branding mit individuellen Farben, Logos, Verpackungen und Spezifikationen'
    - 'Qualität garantiert: ISO 9001 zertifizierte Produktion mit CE-, UKCA- und BSCI-Konformität'
    - 'Globale Logistik: Versand ab Qingdao, China mit FOB-, CIF- und DDP-Optionen'
    - 'Marketingunterstützung: Produktkataloge, Fotografie, technische Dokumentation und digitale Assets'
    - 'Schulung & Support: Produktschulungen für Ihr Vertriebsteam, technischer Support für Ihre Kunden'
content_process:
  tagline: How to Become a Partner
  title: 'Einfacher Partnerschaftsprozess'
  subtitle: 'Unser Partnerschaftsprozess ist unkompliziert – damit Sie schnell verkaufen können.'
  items:
    - title: 'Schritt 1: Bewerbung einreichen'
      description: 'Partnerbewerbungsformular mit Firmenprofil, Zielmarkt und Produktinteressen ausfüllen.'
    - title: 'Schritt 2: Qualifikationsprüfung'
      description: 'Unser Partnerschaftsteam prüft Ihre Bewerbung und kontaktiert Sie innerhalb von 3 Werktagen.'
    - title: 'Schritt 3: Vereinbarung & Einrichtung'
      description: 'Partnervertrag unterschreiben, Konto einrichten, Partnerpreise und Muster erhalten.'
    - title: 'Schritt 4: Schulung & Start'
      description: 'Produktschulungen, Vertriebsunterstützung und Marketingmaterialien bereitgestellt. Sie sind startbereit.'
cta:
  title: 'Bereit, afarer-Partner zu werden?'
  subtitle: 'Bewerben Sie sich für eine Partnerschaft. Wir antworten innerhalb von 3 Werktagen.'
  actions:
    - variant: primary
      text: Apply for partnership
      href: /contact
    - text: View our products
      href: /products

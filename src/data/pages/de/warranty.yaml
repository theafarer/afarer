headline: afarer beschränkte Herstellergarantie
subtitle: afarer steht hinter der Qualität jedes aufblasbaren Marineprodukts, das wir herstellen. Diese beschränkte Garantie legt die Bedingungen und den Umfang der Deckung für Ihr afarer-Produkt fest.
seo:
  headline: afarer-Garantie für aufblasbare SUPs — 5 Jahre beschränkte Garantie | afarer
  description: afarer bietet eine 5-jährige beschränkte Garantie auf Hauptdeckstoff, Nähte und strukturelle Integrität des Drop-Stitch-Kerns. Ebenfalls abgedeckt sind Aufblasventile und werksseitig installiertes Zubehör. Vollständige Bedingungen der afarer-Garantie für aufblasbare SUPs.
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Diese beschränkte Garantie gilt für neue aufblasbare Marineprodukte der Marke afarer, die direkt von afarer oder bei einem autorisierten afarer-Händler oder -Einzelhändler erworben wurden. Das Wirksamkeitsdatum ist das nachweisbare Datum des ursprünglichen Einzelhandelskaufs.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garantieumfang und -dauer</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Jahre</h3>
        <p class="text-sm text-gray-600 mt-1">Integrität des Hauptschlauchgewebes (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Jahre</h3>
        <p class="text-sm text-gray-600 mt-1">Strukturelle Integrität des Glasfaserrumpfs</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Jahre</h3>
        <p class="text-sm text-gray-600 mt-1">Luftdichtheit der Nähte aufblasbarer Schläuche</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Jahre</h3>
        <p class="text-sm text-gray-600 mt-1">Funktionstüchtigkeit der Aufblasventile</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Jahr</h3>
        <p class="text-sm text-gray-600 mt-1">Werksseitig installiertes Zubehör und Hilfsarmaturen</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Jahr*</h3>
        <p class="text-sm text-gray-600 mt-1">Gewerbliche, Vermiet- oder Flottennutzung — alle Komponenten</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Gewerbliche, behördliche, Charter-, Vermiet- oder Ausbildungsnutzung reduziert die Garantie auf 1 Jahr. Renn- oder Wettkampfnutzung macht die Garantie vollständig ungültig.</p>
  </div>

  <h2>Was ist abgedeckt</h2>
  <h3>Hauptschlauchgewebe (5 Jahre)</h3>
  <p>afarer garantiert den Hauptdeckstoff gegen Porositätsverschlechterung, die die Fähigkeit des Produkts, den Betriebsdruck zu halten, wesentlich beeinträchtigt. Dies gilt für PVC-beschichtetes Gewebe und alle anderen bei der Herstellung verwendeten Deckstoffmaterialien.</p>

  <h3>Strukturelle Integrität des Glasfaserrumpfs (5 Jahre)</h3>
  <p>Bei Produkten mit einem Rumpf aus glasfaserverstärktem Kunststoff (GFK) wird die grundlegende Verbundstruktur gegen Strukturversagen aufgrund von Material- oder Verarbeitungsfehlern garantiert.</p>

  <h3>Luftdichtheit der Nähte aufblasbarer Schläuche (5 Jahre)</h3>
  <p>Die Nähte aufblasbarer Schläuche, die bei der Herstellung verbunden werden, sind gegen Herstellungsfehler garantiert, die zu erheblichem Luftaustritt durch die Naht führen. Die regelmäßige Kontrolle und die Wartung der angemessenen Luftdrücke sind Voraussetzungen für die Deckung.</p>

  <h3>Funktionstüchtigkeit der Aufblasventile (5 Jahre)</h3>
  <p>Ursprünglich von afarer installierte Aufblasventile sind gegen Material- oder Verarbeitungsfehler garantiert, die das Ventil am bestimmungsgemäßen Lufthalten hindern.</p>

  <h3>Werksseitig installiertes Zubehör (1 Jahr)</h3>
  <p>Von afarer hergestellte und werksseitig installierte Komponenten und Armaturen sind ein Jahr lang gegen Material- und Verarbeitungsfehler garantiert. Ausgeschlossen sind Artikel von Drittanbietern, die nur durch die jeweilige Herstellergarantie gedeckt sind.</p>

  <h2>Was ist nicht abgedeckt</h2>
  <ul>
    <li>Schönheitsfehler einschließlich Verfärbung, Verfleckung, Ausbleichen, Kreidung oder sonstiger Veränderungen des Aussehens</li>
    <li>Durchstiche, Schnitte, Risse, Einrisse oder andere physische Beschädigungen</li>
    <li>Haarrisse, Rissbildung, Abrieb, Scheuerstellen oder Verschleiß durch Reibung oder Kontakt</li>
    <li>Verschlechterung durch UV-Licht-Einwirkung, Witterung oder atmosphärische Bedingungen</li>
    <li>Schäden durch Kontakt mit Kraftstoffen, Lösungsmitteln, Säuren, Laugen oder Chemikalien</li>
    <li>Schäden durch Nachlässigkeit, unsachgemäße Nutzung, Missbrauch, Unfall oder normale Abnutzung</li>
    <li>Gelcoat- oder Lackoberflächenprobleme (Blasenbildung, Haarrissbildung, Verfärbung, Ausbleichen)</li>
    <li>Schäden durch Aufprall, Belastung, unsachgemäße Abstützung oder Transport auf Anhänger</li>
    <li>Schäden durch unsachgemäßes Auf- oder Ablassen der Luft oder die Verwendung nicht zugelassener Aufblasgeräte</li>
    <li>Ausrüstung, Komponenten oder Systeme von Drittanbietern (durch die jeweiligen Hersteller gedeckt)</li>
  </ul>

  <h2>Verpflichtung und Abhilfe des Herstellers</h2>
  <p>Die alleinige und ausschließliche Verpflichtung von afarer besteht in der Reparatur oder dem Ersatz — nach Wahl von afarer — jeder Komponente, die als material- oder verarbeitungsfehlerhaft und unter diese Garantie fallend festgestellt wird. Reparaturen oder Ersatz werden von afarer oder einer von afarer benannten autorisierten Servicestelle durchgeführt. Reparierte oder ersetzte Komponenten sind nur für die Restlaufzeit der ursprünglichen Garantiezeit gedeckt.</p>

  <h2>Garantiebedingungen</h2>
  <ul>
    <li><strong>Registrierung:</strong> Das Produkt muss, wie in den Garantiebedingungen vorgeschrieben, ordnungsgemäß registriert sein.</li>
    <li><strong>Wartung:</strong> Das Produkt muss gemäß den veröffentlichten Richtlinien von afarer gewartet werden, einschließlich regelmäßiger Kontrolle und Wartung der angemessenen Luftdrücke.</li>
    <li><strong>Mitwirkung:</strong> Der Käufer muss in allen Angelegenheiten rund um Garantieansprüche vollständig und unverzüglich mit afarer zusammenarbeiten.</li>
    <li><strong>Erstkäufer:</strong> Diese Garantie gilt ausschließlich für den ursprünglichen Endverbraucher und ist nicht übertragbar.</li>
  </ul>

  <h2>Gewerbliche Nutzung</h2>
  <p>Wird das Produkt gewerblich, behördlich, gemeinnützig, als Charter, zur Vermietung, zur Ausbildung oder für einen anderen als den privaten Freizeitgebrauch genutzt, verkürzt sich die Garantiezeit für alle Komponenten auf ein (1) Jahr ab dem ursprünglichen Datum des Einzelhandelskaufs. Die Nutzung bei Rennen, Geschwindigkeits- oder Ausdauerwettkämpfen macht die Garantie sofort und unwiderruflich vollständig ungültig.</p>

  <h2>So melden Sie einen Garantieanspruch an</h2>
  <p>Kontaktieren Sie afarer oder Ihren autorisierten Händler mit Kaufbeleg und einer detaillierten Beschreibung des Problems. afarer prüft den Anspruch und gibt Anweisungen zur Inspektion und zum Service.</p>
  <p>Für Anfragen zum Garantieservice kontaktieren Sie uns bitte über unsere <a href="/contact/" class="text-sky-600 underline">Kontaktseite</a> mit Ihrer Bestellnummer und Ihren Produktdetails.</p>

  <h2>Artikel von Drittanbietern</h2>
  <p>Ausrüstung, Komponenten oder Systeme von Drittherstellern (auch wenn von afarer installiert) sind ausschließlich durch eine etwaige Garantie des jeweiligen Herstellers gedeckt. afarer lehnt ausdrücklich jede Garantieverantwortung für solche Artikel von Drittanbietern ab.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Diese Garantieerklärung ist eine Zusammenfassung der vollständigen beschränkten Herstellergarantie von afarer. Das vollständige rechtliche Garantiedokument regelt alle Garantiebedingungen. Änderungen der Spezifikationen vorbehalten. afarer ist eine Marke, die von Aquafarer LLC (USA) betrieben wird.
  </p>

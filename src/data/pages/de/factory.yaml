qc_section:
  tagline: Qualitätskontrolle
  title: Prüf- & Qualitätssicherungsprozess
  subtitle: Jedes Boot durchläuft vor dem Versand obligatorische Tests. Unser Qualitätslabor arbeitet unabhängig von der Produktion und berichtet direkt an das Management.
  steps:
    - step: '1'
      title: Rohmaterialprüfung
      desc: PVC, Hypalon und Drop-Stitch-Gewebe werden vor dem Produktionseinsatz einer Zugprüfung (ASTM D751), Weiterreißprüfung und UV-Beständigkeitsprüfung unterzogen.
    - step: '2'
      title: 48-Stunden-Luftdichtheitstest
      desc: Jede Schlauchkammer wird auf 125 % des Nenndrucks aufgepumpt und 48 Stunden gehalten. Ein Druckabfall unter 5 % löst automatische Ablehnung und Nahtnachprüfung aus.
    - step: '3'
      title: Last- & Gleichgewichtsprüfung
      desc: Fertige Boote werden bis zur maximalen Nennkapazität beladen und auf Stabilität, Freibord und Fahrverhalten geprüft. Jedes Schiff wird vor der Endkontrolle einem Wassertest unterzogen.
oem_section:
  tagline: OEM-Projekte
  title: Marken- & OEM-Partnerschaftsfallstudien
  subtitle: Vom Konzept bis zum Container — wie wir globalen Marken helfen, ihre Schlauchbootlinien zu starten und zu skalieren.
  cases:
    - challenge: Ein europäischer Outdoor-Händler benötigte eine Private-Label-SUP-Linie mit einzigartigen Deckgrafiken, umweltfreundlichem PVC und verkaufsfertiger Verpackung — alles innerhalb von 60 Tagen.
      solution: Entwicklung kundenspezifischer digitaler Druckdateien, Beschaffung REACH-konformen PVCs und Komprimierung der Bemusterung von 3 Runden auf 1 durch Zusammenlegung des Designteams in unserer Qingdao-Fabrik.
      result: 55 Tage von unterzeichneter Bestellung bis FOB. 2.400 Einheiten in 4 SKUs. Folgeauftrag vor Ankunft des ersten Containers.
    - challenge: Ein US-Wassersport-Startup benötigte einen leistungsstarken Drop-Stitch-SUP mit kundenspezifischer Rumpfform, Co-Branding-Verpackung und BSCI-Zertifizierung für den Einzelhandel.
      solution: Anpassung einer bestehenden Drop-Stitch-Kayakform mit modifiziertem Rockerprofil, Entwicklung von Co-Branding-Verpackungsgrafiken und Bereitstellung vollständiger BSCI-Auditdokumentation.
      result: Erfolgreich in 3 großen US-Outdoor-Ketten gelistet. 5.000+ Einheiten im ersten Jahr mit 98 % Durchverkaufsrate.
    - challenge: Ein australischer Distributor benötigte eine CE-zertifizierte SUP-Palette mit kundenspezifischen Schlauchfarben, Hypalon-Upgrade-Option und Konformität mit dem australischen Standard AS 1799.
      solution: Produktion von Vorserienmustern mit 4 Schlauchfarbvarianten, Beschaffung von CSM-Hypalon von einem japanischen Lieferanten und Koordination der AS-1799-Konformitätsprüfung durch Dritte.
      result: 3-modellige SUP-Palette auf dem AU/NZ-Markt eingeführt. Gefolgt von einem Regierungsauftrag für 12 Patrouillen-RIBs.
faq_section:
  tagline: Häufig gestellte Fragen
  title: B2B- & OEM-häufig gestellte Fragen
  questions:
    - q: Wie hoch ist die Mindestbestellmenge (MOQ) für OEM-aufblasbare SUP-Boards?
      a: Die MOQ beginnt bei 5–10 Einheiten für Standard-OEM-Modelle. Kundenspezifische Formen und Private-Label-Projekte erfordern je nach Komplexität mindestens 200 Einheiten. Probebestellungen und Musterläufe sind für neue Marken erhältlich.
    - q: Besitzt afarer eine BSCI-Zertifizierung?
      a: Ja. Unser Werk unterhält eine gültige BSCI-Social-Compliance-Zertifizierung (Prüfbericht auf Anfrage erhältlich). Wir besitzen auch ISO 9001 für Qualitätsmanagement und alle Produkte tragen die CE-Zertifizierung. REACH- und RoHS-Konformitätsdokumentation wird mit jeder OEM-Sendung bereitgestellt.
    - q: Wie ist die typische Lieferzeit für einen OEM-Auftrag?
      a: Die Standardlieferzeit beträgt 30–45 Tage ab bestätigter Bestellung und Anzahlung für die OEM-Serienproduktion. Für die Entwicklung kundenspezifischer Formen kommen 15–20 Tage für den Werkzeugbau hinzu. Für dringende Aufträge und saisonale Spitzen ist eine beschleunigte Produktion verfügbar. Prototypenmuster werden in der Regel innerhalb von 15–20 Tagen versendet.
    - q: Können Sie FOB Qingdao oder CIF zu unserem Hafen versenden?
      a: Ja. Wir versenden FOB Qingdao, CIF zu großen globalen Häfen und DDP für qualifizierte Partner. Unser Logistikteam übernimmt Containerbuchung, Exportedokumentation und Zollabfertigung. Wir versenden in 50+ Länder in den Märkten EU, USA, AU und Asien.
b2b_moq: 'Standard-Mindestbestellmenge (MOQ): 5–10 Einheiten pro Modell (SUP/Drop-Stitch). SUP-MOQ: 2–5 Einheiten. Probebestellungen für neue Partnerschaften willkommen.'
production_flow:
  tagline: Produktionsfluss
  title: Vom Material zum fertigen Boot
  subtitle: Jedes Boot durchläuft 6 Produktionsstufen mit Qualitätskontrollpunkten bei jedem Schritt. Keine Abkürzungen, keine übersprungenen Inspektionen.
  stages:
    - stage: '01'
      title: Materialeingang & Wareneingangsprüfung
      description: Alle eingehenden Materialien werden nach Chargen-/Losnummer in unserem ERP-System erfasst. PVC-Stoffrollen, Drop-Stitch-Kerne, Ventile, Klebstoffe und Zubehör werden bis zur Freigabe durch die Qualitätskontrolle unter Quarantäne gestellt.
      qc_check: Zugfestigkeit (ASTM D751), Reißfestigkeit (ISO 4674), Dickenmessgerät, Klebstoffviskosität, visuelle Fehlerprüfung
      qc_threshold: 100 % der geprüften Chargen. Ablehnen, wenn die Zugfestigkeit < 90 % der Spezifikation, die Reißfestigkeit < Spezifikationsminimum oder irgendein sichtbarer Mangel vorhanden ist
      responsibility: Eingehendes QC-Team (3 Prüfer)
    - stage: '02'
      title: CNC-Schneiden & Materialvorbereitung
      description: Computer-optimiertes Nesting legt Platten auf PVC-Rohmaterial aus, um Abfall zu minimieren. Automatische CNC-Schneidemaschinen halten eine Positionsgenauigkeit von 0,1 mm.
      qc_check: Dimensionale Überprüfung an CAD-DXF-Dateien, Kantengüteprüfung, Plattenanzahlüberprüfung
      qc_threshold: Jedes 20. Paneel wird gemessen. Toleranz ±0,5 mm. Charge verwerfen, wenn >2% außerhalb der Toleranz liegen
      responsibility: Leiter der Schneidwerkstatt
    - stage: '03'
      title: Schweißen & Drop-Stitch-Verbindung
      description: Drop-Stitch-Kerne werden durch Hitzelaminierung mit äußeren PVC-Laminaten verbunden. Rohrkammern werden durch RF-Schweißen oder Heißluftschweißen verschweißt. Schienenbänder werden dreilagig verschmolzen.
      qc_check: Abziehprüfung alle 50 Einheiten (ASTM D751), Schweißbreitenmessung, Überprüfung des Heizlufttemperaturprotokolls, visuelle Nahtinspektion unter Hintergrundbeleuchtung
      qc_threshold: Abziehfestigkeit mindestens 8 N/cm. Schweißnahtbreite Toleranz ±1 mm. Jegliche sichtbare Kanalisierung = ablehnen
      responsibility: Schweißeprüfung (2 Prüfer pro Schicht)
    - stage: '04'
      title: Montage & Takelage
      description: 'Boote gehen zur Endmontage, wo alle Komponenten zusammengefügt werden: Rumpf, Tuben, installierte Ventile, D-Ringe, Griffe, Finnenkästen und Tragetaschenbefestigung. Jede Einheit durchläuft eine 100-Punkte-Montagecheckliste.'
      qc_check: 100-Punkte-Checkliste pro Einheit, Ventilfunktionsprüfung (10 Öffnungs-/Schließzyklen), Überprüfung des Hardware-Drehmoments, Sichtprüfung
      qc_threshold: 'Null-Fehler-Politik bei sicherheitskritischen Teilen (Ventile, D-Ringe, Griffe). Geringfügige kosmetische Mängel: AQL 2,5 (ISO 2859)'
      responsibility: Leiter Montageteam + Linien-QC
    - stage: '05'
      title: Druckprüfung & Qualitätskontrolle
      description: Jede Kammer wird auf das 1,25-fache des Nenn- drucks aufgepumpt (typischerweise 20–25 PSI) und für 24–48 Stunden gehalten. Drucksensoren protokollieren kontinuierlich. Kammern, die einen Druckabfall von mehr als 5 % aufweisen, werden abgelehnt und zur Nahtnachprüfung geschickt.
      qc_check: 24-Stunden-Druckhaltelog, Sensor-Kalibrierung täglich überprüft, temperaturkompensierte Druckanzeige, Nahtnachprüfung nach Reparatur
      qc_threshold: Maximal 5% Druckabfall über 24 Stunden bei stabiler Temperatur. Jede Kammer, die dies überschreitet = 100% Nachprüfung der gesamten Produktionscharge
      responsibility: Qualitätslabor (unabhängig von der Produktion, berichtet an die Geschäftsleitung)
    - stage: '06'
      title: Endkontrolle & Verpackung
      description: Endkontrolle der visuellen und funktionalen Eigenschaften. Oberflächenmängel, Farbgleichmäßigkeit, Etiketten-/BIN-Überprüfung, Verpackungsintegrität und Vollständigkeit des Zubehörs. Die Einheiten sind vakuumverpackt, in Kartons verpackt und für den Containertransport auf Paletten gestellt.
      qc_check: Vollständige Sichtprüfung, Zubehör-Checkliste pro SKU, Verpackungs-Falltest (1 m, Zufallsprobe), Etiketten-/Barcode-Scan-Überprüfung
      qc_threshold: AQL 2,5 für Hauptmängel, AQL 4,0 für Nebelmängel. Null Toleranz bei Sicherheitsmängeln. 100% der Einheiten werden visuell überprüft
      responsibility: Endkontrollteam (4 Prüfer) + Verpackungsteamleiter

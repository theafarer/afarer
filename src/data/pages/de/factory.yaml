material_traceability:
  tagline: Rückverfolgbarkeit
  title: Materialverfolgung & Chargenkontrolle
  description: >-
    Jede Charge von Rohmaterial wird in unserem ERP-System mit einer eindeutigen Losnummer versehen. Vom Eintreffen über die Produktion bis zum fertigen Produkt ist jede Stückliste eines Loses mit der ursprünglichen Lieferantencharge verknüpft. Dies ermöglicht eine vollständige Rückverfolgbarkeit
    nach oben für jede Qualitäts- oder Compliance-Anfrage.
  system: Benutzerdefiniertes ERP (internes System der Qingdao Vatrad Group) physische Chargenetiketten auf jedem Arbeitsauftrag
  coverage: 100 % der Produktionsmaterialien — PVC, Hypalon, Drop-Stitch-Gewebe, Klebstoffe, Ventile, Beschläge, Verpackungen
  records_retained: 10 Jahre (gemäß CE 2013/53/EU-Anforderung)
  suppliers:
    - material: Marine-PVC
      source: Chinesische und koreanische Lieferanten
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanischer Lieferant
      certified: ISO 9001, REACH
    - material: Drop-Stitch-Gewebe
      source: Interne Weberei + externer Partner
      certified: Interne Qualitätskontrolle Lieferant ISO 9001
    - material: Ventile & Hardware
      source: Chinesische OEM-Lieferanten
      certified: ISO 9001, Materialzeugnisse pro Charge

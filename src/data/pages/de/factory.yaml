workshops_section:
  tagline: Werkstätten
  title: Fertigungswerkstätten
  workshops:
    - title: PVC-Zuschnitt & Materialvorbereitung
      description: Automatische CNC-Schneidemaschinen bearbeiten PVC, Hypalon und Drop-Stitch-Gewebe mit submillimetergenauer Präzision. Computeroptimierte Verschachtelung minimiert Materialabfall und stellt sicher, dass jede Platte vor dem Schweißen ihre Maßvorgaben erfüllt.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Schlauchschweißen & Heißsiegeln
      description: Spezielle Schweißwerkstatt mit Heißsiegelmaschinen und HF-Dielektrikumspressen. Heißluftschweißgeräte verbinden und verschmelzen PVC-Schlauchkammern, während HF-Schweißungen hochfeste luftdichte Nähte erzeugen, die die ISO 6185-Anforderungen übertreffen.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: SUP-Rumpfproduktion — Glasfaser
      description: SUP-Bootsrümpfe werden mittels Handlaminier-Glasfaserformung mit Polyester- und Vinylesterharzsystemen hergestellt. Jede Schicht wird von Hand gerollt und vakuumverpackt für gleichbleibende Qualität. Die Gelcoat-Spritzkabine sorgt für eine hochglänzende, UV-beständige Marineoberfläche.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: SUP-Druck & Dekoration
      description: SUP-Boards werden mit Digitaldruck für Vollfarbgrafiken und Siebdruck für Logos und sich wiederholende Muster dekoriert. Digitaldrucker produzieren fotorealistische Deckdesigns, während Siebdruck haltbare, lebendige Markenzeichen liefert.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Endmontage & Rigging
      description: Montagelinie, in der Glasfaser-Rümpfe und PVC-Schläuche verbunden, Motoren montiert, Lenkung und Steuerung angeschlossen und elektrische Systeme verdrahtet werden. Jedes Boot folgt einer 100-Punkte-Montagecheckliste, die vom Teamleiter abgezeichnet wird.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Qualitätsprüfung & Kontrolle
      description: Jedes fertige Boot durchläuft vor dem Versand eine obligatorische Luftdichtheitsprüfung, Nahtschälprüfung und vollständige Systemkontrolle. Unser Qualitätslabor arbeitet unabhängig von der Produktion und berichtet direkt an das Management.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

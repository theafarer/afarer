features3_reasons:
  tagline: Why Choose afarer
  title: 'Sieben Gründe für eine Partnerschaft'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'Wir besitzen eine 12.000 m² Fabrik. Sie arbeiten direkt mit den Entwicklern und Herstellern – ohne Zwischenhändler.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Unser Design beginnt mit dem Anwendungsfall, nicht der Produktkategorie.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'CE, ISO, BSCI, REACH, USCG. Jedes Produkt erfüllt internationale Standards.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Schlauchfarben, Konsolenlayout, Branding, Verpackung – wir passen an Ihre Spezifikationen an.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'US-Lager in Kalifornien, Direktversand ab Qingdao, Luftfracht für Eilaufträge.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'Wir unterstützen Boote von vor 20 Jahren. Originalteile, technische Beratung, Reparaturanleitung.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Echte Lastwerte, echte Maße, echtes Gewicht. Keine Übertreibungen.'
      icon: tabler:ruler-measure

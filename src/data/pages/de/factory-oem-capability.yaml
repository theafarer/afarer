  tagline: OEM/ODM-Fertigung
  title: OEM- und Eigenmarkenfertigung
  subtitle: Von der Idee bis zum Container — individualisieren Sie jedes Detail Ihrer aufblasbaren SUP-Linie
intro: >-
  Afarer bietet umfassende OEM- und ODM-Dienstleistungen für Marken, Händler und Regierungsbehörden weltweit an. Mit 10 Jahren Exporterfahrung und einer 12.000 m² großen, nach ISO 9001 & BSCI zertifizierten Fabrik kümmern wir uns um alles, von der Produktgestaltung und Formenentwicklung bis hin zur
  Vollproduktion, Verpackung und Logistik.

services:
  - title: Produktdesign und Ingenieurwesen
    description: Unser internes F&E-Team arbeitet mit Ihrem Konzept oder Ihrer Spezifikation, um CAD-Zeichnungen, 3D-Modelle und Prototypen zu entwickeln. Wir bieten Formenbau, Optimierung der Rumpfform und Materialauswahlberatung an.
  - title: Benutzerdefiniertes Branding & Grafiken
    description: Ganzfarbiger Digitaldruck, Siebdruck, Prägung und Etikettenoptionen. Wir entwickeln markenspezifische Deckgrafiken, Tubenbranding und verkaufsfertige Verpackungen.
  - title: Material- und Spezifikationsanpassung
    description: Wählen Sie aus PVC (Standard, umweltfreundlich, flammhemmend), Hypalon/CSM, Drop-Stitch- und Hybrid-Konstruktionen. Maßgefertigte Schlauchfarben, Stoffgewichte und Verstärkungsoptionen.
  - title: Verpackung & Logistik
    description: Individuelle Einzelhandelsverpackungen, Eigenmarkenboxen, Vakuumverpackung, Palettierung und Containerbeladung. FOB Qingdao, CIF oder DDP Versandbedingungen verfügbar.
moq_table:
  - product: Aufblasbare SUP-Boards
    standard_moq: 5–10 Einheiten
    custom_moq: 200 Einheiten
    lead_time: 30–45 Tage
  - product: Schwimmwesten & Sicherheit
    standard_moq: 100–200 Einheiten
    custom_moq: 1.000 Einheiten
    lead_time: 20–30 Tage
why_us:
  - title: Vertikale Integration
    description: Wir besitzen unsere Fabrik, Formen und Lieferkette – keine Zwischenhändler, keine Subunternehmer. Das gibt uns Kontrolle über Qualität, Kosten und Lieferung.
  - title: Doppelte Zertifizierung
    description: ISO 9001 Qualitätsmanagement- und BSCI-Sozialzertifizierung. Fabriksauditberichte auf Anfrage erhältlich.
  - title: CE-Konformität
    description: Alle Standardmodelle tragen die CE-Zertifizierung 2013/53/EU. Sondermodelle können über unseren etablierten Prozess CE-zertifiziert werden.
  - title: Niedrige Mindestbestellmenge
    description: Beginnen Sie mit nur 5 Einheiten für Standardmodelle. Wir helfen aufstrebenden Marken beim Start, ohne das Inventar zu überbeanspruchen.

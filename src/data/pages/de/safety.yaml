hero:
  tagline: Sicherheit
  title: Sicherheitsstandards und Zertifizierung
  subtitle: Jedes afarer-Produkt wird strengen Tests unterzogen und erfüllt internationale Sicherheitsstandards für Freizeit- und Berufsgebrauch.
certifications:
  - title: CE-Zertifizierung
    description: Alle afarer-Sicherheitsausrüstungen entsprechen den CE-Kennzeichnungsanforderungen der Europäischen Verordnung über persönliche Schutzausrüstung (EU) 2016/425.
  - title: ISO 12402
    description: Schwimmwesten erfüllen die -Auftriebsstandards. Die Life Vest Classic bietet 50N+ Auftrieb; die Life Vest Pro erfüllt SOLAS-Anforderungen mit automatischer Aufblasung.
  - title: SOLAS-Konformität
    description: Die Life Vest Pro entspricht den SOLAS-Vorschriften (Sicherheit des Lebens auf See) für Offshore- und gewerbliche Schifffahrtseinsätze.

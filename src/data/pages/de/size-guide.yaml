how_to_choose:
  title: So wählen Sie die richtige Größe
  cards:
    - title: SUP-Boards
      description: Wählen Sie die Länge basierend auf Ihrem Gewicht und der beabsichtigten Nutzung. Breitere Boards (32"+) bieten mehr Stabilität. Längere Boards (11-12 ft) spuren besser für Touren. Schwerere Paddler benötigen Boards mit höherem Volumen.
    - title: Touring-SUPs
      description: Längere Boards (11–12 ft) eignen sich am besten für Distanz und Touring. Breitere Boards (32"+) bieten mehr Stabilität. Achten Sie auf die Gewichtskapazität für die Gesamtlast einschließlich Ausrüstung.
    - title: Allround-SUPs
      description: Wählen Sie die Länge nach Fahrergewicht und Verwendungszweck. Allround-Boards eignen sich für Freizeit, Fitness und Yoga. Kleinere Boards sind wendiger.

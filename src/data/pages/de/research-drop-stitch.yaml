hero:
  tagline: Technologie
  title: Wie Drop Stitch funktioniert — Die Technik hinter aufblasbaren starren Kernen
  subtitle: 8 Minuten Lesezeit
content_html: |-
  <h2>Was ist Drop Stitch?</h2>
  <p>Drop Stitch (auch "Drop-Stitch-Gewebe" oder "Drop-Stitch-Kern" genannt) ist eine Konstruktionsmethode, bei der Tausende einzelner Polyesterf&auml;den die obere und untere Lage einer Gewebeh&uuml;lle verbinden. Wenn die H&uuml;lle aufgeblasen wird, wirken diese F&auml;den als interne Zugspannungselemente &ndash; sie verhindern, dass sich die oberen und unteren Bahnen nach au&szlig;en w&ouml;lben und eine runde Form annehmen, und zwingen die Bahn, flach und starr zu bleiben.</p>
  <p>Das Ergebnis ist eine leichte, tragbare Struktur, die einem Innendruck von 15 &ndash; 20 PSI standh&auml;lt &ndash; vergleichbar mit der Steifigkeit eines Hartschalenboards, aber zur Aufbewahrung und zum Transport vollst&auml;ndig entleerbar.</p>

  <h2>So funktioniert es: Die Physik</h2>
  <p>Bei einer herk&ouml;mmlichen aufblasbaren Struktur (wie einem Ballon oder einer Luftmatratze) dr&uuml;ckt der innere Luftdruck gleichm&auml;&szlig;ig in alle Richtungen. Ohne innere R&uuml;ckhaltung nimmt die Struktur eine zylindrische oder kugelf&ouml;rmige Form an. Drop Stitch l&ouml;st dieses Problem durch eine Zugverst&auml;rkung:</p>
  <ul>
    <li>Tausende von F&auml;den verbinden die oberen und unteren Gewebelagen</li>
    <li>Beim Aufblasen versucht der Luftdruck, die obere und untere Lage auseinanderzudr&uuml;cken</li>
    <li>Die F&auml;den widerstehen dieser Trennung und &uuml;bertragen die Last als Zugspannung entlang der Fadenachse</li>
    <li>Das Ergebnis ist eine flache, starre Bahn, die Biegung widersteht</li>
  </ul>

  <h2>Herstellungsprozess</h2>
  <ol>
    <li><strong>Weben:</strong> Polyesterf&auml;den werden gleichzeitig in zwei separate Lagen des Grundgewebes eingewebt (typischerweise 1,100 DTEX oder 1,680 DTEX PVC-beschichtetes Polyester). Die F&auml;den werden in einem Winkel von 90&deg; zwischen den Lagen eingewebt.</li>
    <li><strong>Beschichtung:</strong> Das gewebte Grundgewebe wird mit PVC (oder gelegentlich TPU) in einem Rakel- oder Kalanderbeschichtungsverfahren beschichtet. Dies dichtet die F&auml;den ab und erzeugt die luftdichte Membran.</li>
    <li><strong>Lagenverbindung:</strong> Der Drop-Stitch-Kern wird mit &auml;u&szlig;eren kaschierten Lagen (typischerweise 0.9 mm oder 1.2 mm PVC) mittels Hei&szlig;kaschierung oder Klebstoff verbunden.</li>
    <li><strong>Schwei&szlig;en:</strong> Railb&auml;nder werden entlang der Kanten mittels Hei&szlig;luftschwei&szlig;en, HF-Schwei&szlig;en oder Hochfrequenzschwei&szlig;en verschwei&szlig;t, um die Seitenw&auml;nde des Boards zu erzeugen.</li>
    <li><strong>Ventilmontage:</strong> Boston-Ventile oder Halkey-Roberts-Ventile werden eingebaut, typischerweise mit einem Druckentlastungsmechanismus, um &Uuml;berbl&auml;hung zu verhindern.</li>
  </ol>

  <h2>Wichtige Qualit&auml;tsindikatoren</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Einstiegsklasse</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Fadendichte</td><td class="p-3 border">1 Faden / sq in</td><td class="p-3 border">2 F&auml;den / sq in</td></tr>
      <tr><td class="p-3 border">Grundgewebe</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Max. Druck</td><td class="p-3 border">12 &ndash; 15 PSI</td><td class="p-3 border">18 &ndash; 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC-St&auml;rke</td><td class="p-3 border">0.6 &ndash; 0.9 mm</td><td class="p-3 border">1.0 &ndash; 1.2 mm</td></tr>
      <tr><td class="p-3 border">Rail-Konstruktion</td><td class="p-3 border">Gefaltet &amp; verklebt</td><td class="p-3 border">Verschwei&szlig;t &amp; fusionsverbunden</td></tr>
    </tbody>
  </table>

  <h2>Anwendungen</h2>
  <ul>
    <li><strong>SUP-Boards:</strong> 4" &ndash; 6" Dicke, 15 &ndash; 20 PSI, 1 &ndash; 2 F&auml;den/sq in</li>
    <li><strong>Kajaks:</strong> Drop-Stitch-Boden + aufblasbare Seitenkammern, 10 &ndash; 15 PSI Boden</li>
    <li><strong>RIB-B&ouml;den:</strong> Drop-Stitch-B&ouml;den f&uuml;r leichte, zusammenfaltbare RIB-Tender, 12 &ndash; 18 PSI</li>
    <li><strong>Bootsfender:</strong> Niederdruck-Drop-Stitch f&uuml;r geformte Fender mit flachen Fl&auml;chen</li>
  </ul>

  <h2>Drop Stitch vs. Air Deck (Fiberglas- oder Holzkern)</h2>
  <p>Hartschalenboards verwenden EPS-Schaumkerne mit Fiberglas- oder Holzstringer-Verst&auml;rkung. Sie sind leichter, steifer und reaktionsfreudiger &ndash; aber sie k&ouml;nnen nicht entleert werden. Drop Stitch tauscht etwas Steifigkeit gegen volle Transportf&auml;higkeit ein. F&uuml;r die meisten Freizeitnutzer sind moderne Drop-Stitch-SUPs mit 20 PSI in ihrer Steifigkeit von Einstiegs-Hartschalenboards kaum zu unterscheiden.</p>

  <h2>Wie Afarer Drop Stitch einsetzt</h2>
  <p>Afarer verwendet einen 1,680 DTEX Drop-Stitch-Kern in seiner gesamten SUP-Produktlinie, mit 2 F&auml;den pro Quadratzoll und einem 1.2 mm PVC-Au&szlig;enlaminat. Die Boards sind f&uuml;r 20 PSI ausgelegt und durchlaufen vor dem Versand einen 24-st&uuml;ndigen Druckhaltetest bei 1.5x des Nenndrucks. Railb&auml;nder werden hei&szlig;luftverschwei&szlig;t mit dreilagiger Fusion, und Druckentlastungsventile sind bei allen Modellen Standard.</p>

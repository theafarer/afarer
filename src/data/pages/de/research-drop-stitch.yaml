  tagline: Technologie
  title: Wie Drop Stitch funktioniert — Die Technik hinter aufblasbaren starren Kernen
  subtitle: 8 Minuten Lesezeit
content_html: >
  <h2>Was ist Drop Stitch?</h2>

  <p>Drop Stitch (auch "Drop-Stitch-Stoff" oder "Drop-Stitch-Kern" genannt) ist eine Baumethode, bei der Tausende einzelner Polyesterfäden die oberen und unteren Schichten einer Stoffhülle verbinden. Wenn die Hülle aufgeblasen ist, wirken diese Gewinde als innere Zugelemente – sie verhindern, dass
  die oberen und unteren Platten nach außen in eine runde Form wölben, sodass die Platte flach und starr bleibt.</p>

  <p>Das Ergebnis ist eine leichte, tragbare Struktur, die einem Innendruck von 15–20 PSI standhält – vergleichbar mit der Steifigkeit eines Hardshell-Boards, aber vollständig entleerbar für Lagerung und Transport.</p>


  <h2>Wie es funktioniert: Die Physik</h2>

  <p>In einer herkömmlichen aufblasbaren Struktur (wie einem Ballon oder einer Luftmatratze) drückt der innere Luftdruck gleichmäßig in alle Richtungen. Ohne innere Zurückhaltung wird die Struktur zylindrisch oder kugelförmig. Der Drop Stitch löst dies, indem er Zugverstärkung einführt:</p>

  <ul>
    <li>Tausende von Fäden verbinden die oberen und unteren Stoffschichten</li>
    <li>Im aufgeblasenen Zustand versucht der Luftdruck, oben und unten auseinanderzudrücken</li>
    <li>Die Gewinde widerstehen dieser Trennung und übertragen die Last entlang der Gewindeachse in Zugform</li>
    <li>Das Ergebnis ist ein flaches, starres Panel, das sich verbiegen lässt</li>
  </ul>


  <h2>Bauprozess</h2>

  <ol>
    <li><strong>Weben:</strong> Polyesterfäden werden gleichzeitig in zwei separate Lagen Grundstoff gewebt (typischerweise 1.100 DTEX oder 1.680 DTEX PVC-beschichtetes Polyester). Die Fäden sind zwischen den Schichten in einem 90°-Winkel mit Schlaufen verwebt.</li>
    <li><strong>Beschichtung:</strong> Das gewebte Grundgewebe wird mit PVC (oder gelegentlich TPU) mittels Messer- oder Kalenderbeschichtung beschichtet. Dadurch werden die Gewinde abgedichtet und die luftdichte Membran entstanden.</li>
    <li><strong>Schichtbindung:</strong> Der Drop-Stitch-Kern wird mit Hitzelaminierung oder Klebstoff an äußere laminierte Schichten (typischerweise 0,9 mm oder 1,2 mm PVC) befestigt.</li>
    <li><strong>Schweißen:</strong> Schienenbänder werden entlang der Kanten mittels Heißluftschweißen, HF-Schweißen oder Hochfrequenzschweißen geschweißt, um die Seitenwände der Platine zu bilden.</li>
    <li><strong>Ventilinstallation:</strong> Boston-Ventile oder Halkey-Roberts-Ventile sind installiert, typischerweise mit einem Druckentlastungsmechanismus, um Überinflation zu verhindern.</li>
  </ol>


  <h2>Wichtige Qualitätsindikatoren</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr Klasse="bg-gray-100">
        <. Klasse="p-3 Text-links schrift-halbfett text-grau-900 Rand">Parameter</th>
        <. Klasse="p-3 Text-links-Schrift-halbfett Text-grau-900-Rand">Einstiegsebene</th>
        <. Klasse="p-3 Text-links schrift-halbfett Text-grau-900 Rand">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td-Klasse="p-3-Rand">Thread-Dichte</td><td-Klasse="p-3-Rand">1 Thread / sq in</td><td-klasse="p-3-Rand">2 Threads / sq in</td></tr>
      <tr><td-Klasse="p-3-Rand">Basis-Stoff</td><td-Klasse="p-3-Rand">1.100 DTEX</td><td-Klasse="p-3-Rand">1.680 DTEX</td></tr>
      <tr><td-klasse="p-3-Rand">Max-Druck</td><td-Klasse="p-3-Rand">12 – 15 PSI</td><td-Klasse="p-3-Rand">18 – 22 PSI</td></tr>
      <tr><td-Klasse="p-3-Rand">PVC-Dicke</td><td-Klasse="p-3-Rand">0,6 – 0,9 mm</td><td-Klasse="p-3-Rand">1,0 – 1,2 mm</td></tr>
      <tr><td-Klasse="p-3-Rand">Schienenbau<</td>td-Klasse="p-3-Rand">Gefaltet &amp; geklebt</td><td-Klasse="P-3-Rand">Geschweißt &amp; Fusionsgebunden</td></tr>
    </tbody>
  </table>


  <h2>Anwendungen</h2>

  <ul>
    <li><strong>SUP-Bretter:</strong> 4" – 6" Dicke, 15 – 20 PSI, 1 – 2 Gewinde pro Quadratmeter</li>
    <li><strong>Kajaks:</strong> Aufblasbare Seitenkammern mit Drop-Stitch-Boden, 10 – 15 PSI Boden</li>
    <li><strong>RIB-Böden:</strong> Drop-Stitch-Böden für leichte, packbare RIB-Tender, 12 – 18 PSI</li>
    <li><strong>Bootsfender:</strong> Niederdruck-Drop-Stich für geformte Kotflügel mit flachen Flächen</li>
  </ul>


  <h2>Drop Stitch vs. Air Deck (Fiberglas- oder Holzkern)</h2>

  <p>Hartschalenbretter verwenden EPS-Schaumstoffkerne mit Glasfaser- oder Holzstringer-Verstärkung. Sie sind leichter, steifer und reaktionsschneller – aber sie können nicht entleert werden. Drop Stitch tauscht etwas Steifigkeit gegen volle Portabilität ein. Für die meisten Freizeitnutzer sind
  moderne Drop-Stitch-SUPs mit 20 PSI in ihrer Starrigkeit nicht von Einsteiger-Hardboards zu unterscheiden.</p>


  <h2>Wie Afarer Drop Stitch verwendet</h2>

  <p>Afarer verwendet einen 1.680 DTEX Drop-Stitch-Kern in seiner SUP-Produktpalette, mit 2 Fäden pro Quadratzoll und einem 1,2 mm dicken PVC-Außenlaminat. Die Platinen sind auf 20 PSI ausgelegt und durchlaufen vor dem Versand einen 24-stündigen Drucktest bei 1,5-fachem Nenndruck. Schienenbänder
  werden mit Heißluft mit dreifacher Fusion verschweißt, und Druckentlastungsventile sind bei allen Modellen serienmäßig.</p>

clusters:
  tagline: Wissenscluster
  title: Nach Thema erkunden
  subtitle: Tiefgehende Einblicke in die Technologie, Sicherheit und Fähigkeiten hinter jedem afarer-Produkt.
  items:
    - title: SUP-Wissen
      description: Von der Auswahl Ihres ersten Boards bis zu fortgeschrittenen Tourentechniken —alles über Stand-Up-Paddle-Boarding.
      icon: tabler:lifebuoy
      topics:
        - So wählen Sie Ihr erstes aufblasbares SUP
        - Beste SUP-Größe für Anfänger
        - Wie schwierig ist Paddle-Boarding?
        - 'Vergleich: Aufblasbar vs. Hartschale'
        - SUP-Sicherheitscheckliste
    - title: Bootswissen
      description: Technische Anleitungen zu Schlauchbooten, RIBs, Dinghys und Kajaks —Technik, Materialien und Betrieb.
      icon: tabler:sailboat
      topics:
        - Schlauchboottypen erklärt
        - PVC vs. Hypalon Vergleich
        - SUP vs. SUP Vergleich
        - Drop-Stitch-Technologie im Detail
        - Marine-Materialwissenschaft
    - title: Sicherheitswissen
      description: Wichtige Sicherheitskenntnisse für jeden Paddler —von der Schwimmwestenauswahl bis zur Wetterkunde und Selbstrettung.
      icon: tabler:shield
      topics:
        - SUP-Sicherheitscheckliste
        - Brauchen Sie eine Schwimmweste?
        - Sicherheitsleitfaden für Meerpaddeln
        - Flusssicherheit für aufblasbare Kajaks
        - Wetter- und Wasserbewusstsein
    - title: Technologie
      description: Die Technik hinter afarer-Produkten —Materialien, Konstruktionsmethoden und Qualitätstests.
      icon: tabler:microscope
      topics:
        - Marine-PVC-Technologie
        - Drop-Stitch-Kern erklärt
        - Warum PSI bei aufblasbaren SUPs wichtig ist
        - HF-Schweißen vs. Klebeverbindung
        - Qualitätstests und Zertifizierung
    - title: SUP Lifestyle & Special Uses
      description: Specialized SUP activities —yoga, fishing, dogs, families, and travel tips.
      icon: tabler:heart
      topics:
        - SUP yoga and meditation on water
        - Fishing from an inflatable SUP
        - Paddle boarding with dogs and kids
        - Traveling with your SUP by air and car
        - SUP accessories and gear essentials
    - title: SUP Comparisons & References
      description: Side-by-side comparisons to help you make informed decisions.
      icon: tabler:chart-bar
      topics:
        - SUP vs kayak — which is right for you?
        - PVC vs Hypalon material comparison
        - Single chamber vs multi-chamber safety
        - SUP board materials explained
        - UV printing vs EVA block artwork

hero_text:
  tagline: Resources
  title: 'Download-Center & Käuferleitfäden'
  subtitle: 'Zugriff auf Produktkataloge, OEM-Leitfaden, Käuferchecklisten und technische Dokumentation'
features3_downloads:
  tagline: Downloads
  title: 'Produktdokumentation<br />& Käuferressourcen'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Komplettes Sortiment: RIBs, Schlauchboote, SUP-Bretter, Kajaks und Zubehör. PDF-Format.'
      icon: tabler:file-text
    - title: 'OEM-Fertigungsleitfaden'
      description: 'Alles über OEM/ODM-Partnerschaften: Prozess, Mindestbestellmengen, Anpassungen, Qualität, Versand.'
      icon: tabler:building-factory
    - title: 'SUP-Käuferleitfaden'
      description: 'So wählen Sie das richtige SUP: Materialien, Motor, Größe und Konfiguration.'
      icon: tabler:file-description
    - title: 'SUP-Lieferanten-Checkliste'
      description: 'Wichtige Überlegungen bei der SUP-Herstellerwahl: Qualität, Zertifizierungen, MOQ, Werkaudit.'
      icon: tabler:clipboard-check
    - title: 'Materialleitfaden für Schlauchboote'
      description: 'PVC vs. Hypalon: Haltbarkeit, UV-Beständigkeit, Lebensdauer, Reparatur, Kosten.'
      icon: tabler:files
    - title: 'Vorlage für kundenspezifische Fertigungsanforderungen'
      description: 'Produktbriefvorlage herunterladen, ausfüllen und an uns senden für Angebot und Machbarkeitsprüfung.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Häufige Fragen zu Produkten, Fertigung und Partnerschaft.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'Die MOQ variiert je nach Kategorie. RIBs ab 10, SUP-Bretter ab 50 Einheiten.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Ja, afarer bietet Musterproduktion an. Kosten verhandelbar, oft anrechenbar.'
      icon: tabler:package
    - title: What payment terms are available?
      description: '30% Anzahlung, 70% vor Versand. LC für qualifizierte Kunden.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Typische Lieferzeiten: SUP 30-45, SUP 20-30, Schlauchboote 25-35 Tage. Prototyping zusätzlich 15-30 Tage.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'CE, USCG, ISO, BSCI, REACH.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Ja. Individuelle Verpackung mit Logo, Farben und Markenidentität.'
      icon: tabler:color-swatch
cta:
  title: 'Hilfe bei der Ressourcensuche?'
  subtitle: 'Kontaktieren Sie uns für Beratung zu Produkten, OEM-Partnerschaften oder technischen Spezifikationen.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

    - title: 'ISO 9001'
      description: 'Unsere 12.000 m² große Anlage in Qingdao arbeitet nach einem  Qualitätsmanagementsystem. Jede Produktionscharge ist rückverfolgbar, dokumentiert und geprüft.'
      icon: 'tabler:clipboard-check'
    - title: 'BSCI Soziale Compliance'
      description: 'Wir sind BSCI-zertifiziert und gewährleisten ethische Arbeitspraktiken, sichere Arbeitsbedingungen und Umweltverantwortung in unserer gesamten Lieferkette.'
      icon: 'tabler:users'
    - title: 'REACH & RoHS'
      description: 'Alle Materialien —PVC, Hypalon, EVA-Schaum, Klebstoffe —entsprechen den EU-REACH- und RoHS-Verordnungen. Keine verbotenen Substanzen, keine Kompromisse.'
      icon: 'tabler:flask'
    - title: 'Materialprüflabor'
      description: 'Unser internes Labor testet Zugfestigkeit, UV-Beständigkeit, Nahtintegrität und Abriebfestigkeit jeder Stoffcharge vor der Produktion.'
      icon: 'tabler:microscope'
    - title: '2 Jahre Garantie'
      description: 'Jedes afarer-Produkt wird mit einer zweijährigen Garantie gegen Herstellungsfehler geliefert. Wir stehen zu dem, was wir bauen.'
      icon: 'tabler:shield-check'


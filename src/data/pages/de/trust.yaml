faqs_sup:
  title: SUP-Board FAQ
  subtitle: Häufige Fragen zu unseren Stand-Up-Paddle-Boards.
  columns: 2
  items:
    - title: Welche SUP-Boardgrößen sind erhältlich?
      description: Wir bieten SUP-Boards von 9 ft bis 12 ft, darunter Allround-, Touren-, Yoga- und Spezialdesigns. Unsere meistverkauften Modelle sind das Tropical Breeze (10 ft) und das Ocean Voyager (11 ft).
    - title: Was ist Drop-Stitch-Konstruktion?
      description: Die Drop-Stitch-Konstruktion verwendet tausende Polyesterfäden, die die obere und untere Schicht des Boards verbinden, sodass es hohen Luftdruck (15–20 PSI) halten kann und eine starre, stabile Plattform bietet. Dies ist der Industriestandard für hochwertige aufblasbare SUPs.
    - title: Wie hoch ist das Gewichtslimit für SUP-Boards?
      description: Unsere SUP-Boards unterstützen je nach Modell und Volumen bis zu 150 kg. Das Leviathan Wake Board ist unser Modell mit der höchsten Kapazität, entwickelt für schwerere Fahrer und den Einsatz beim Yoga.
    - title: Bieten Sie komplette SUP-Pakete an?
      description: Ja. Jedes SUP-Board wird mit einem Komplettpaket geliefert, das ein 3-teiliges Aluminiumpaddel, eine Hochdruck-Handpumpe, eine Spiralleine, einen Reiserucksack und ein Reparaturset enthält. Einige Modelle enthalten auch einen abnehmbaren Finnen-Satz.
    - title: Welche Garantie gilt für SUP-Boards?
      description: Alle afarer SUP-Boards haben eine einjährige Garantie gegen Herstellungsfehler, einschließlich Nahtversagen, Ventildefekte und Materialdelamination bei normalem Gebrauch.
    - title: Wie lange dauert es, ein SUP-Board aufzupumpen?
      description: Mit der mitgelieferten Handpumpe dauert eine vollständige Befüllung auf 15 PSI etwa 8–12 Minuten. Für schnelleres Aufpumpen empfehlen wir unsere afarer 12V-Elektropumpe, die ein Board in unter 4 Minuten aufpumpt.
faqs_materials:
  title: SUP Material & Pflege FAQs
  subtitle: Häufige Fragen zu unseren aufblasbaren SUP-Materialien, deren Pflege und Lagerung.
  columns: 2
  items:
    - title: Welche Materialien werden in Afarer aufblasbaren SUPs verwendet?
      description: Wir verwenden militärischen PVC-Qualität (1100 Denier) mit UV-stabilisierter, verschleißfester Konstruktion, die den EU-REACH- und RoHS-Vorschriften entspricht.
    - title: Wie lange halten aufblasbare SUPs?
      description: Bei richtiger Pflege hält ein hochwertiges PVC-aufblasbares SUP 5–10 Jahre. Regelmäßige Reinigung, UV-Schutz und sachgemäße Lagerung verlängern die Lebensdauer erheblich.
    - title: Welche Wartung ist für ein aufblasbares SUP erforderlich?
      description: Grundlegende Wartung umfasst das Abspülen mit Süßwasser nach jedem Gebrauch (insbesondere in Salzwasser), das Trocknen vor der Lagerung, die jährliche Überprüfung der Ventildichtungen und das Vermeiden von längerer Sonneneinstrahlung, wenn es nicht in Gebrauch ist.
    - title: Können aufblasbare SUPs in Salzwasser verwendet werden?
      description: Ja. Alle aufblasbaren SUPs von Afarer sind sowohl für den Gebrauch in Süßwasser als auch in Salzwasser konzipiert. Wir empfehlen, nach dem Einsatz im Salzwasser mit Süßwasser zu spülen und gründlich zu trocknen.
    - title: Wie lagere ich ein aufblasbares SUP?
      description: Entlüften, reinigen und das Brett vor der Lagerung vollständig trocknen. Locker aufrollen (enge Falten vermeiden), an einem kühlen, trockenen Ort ohne direkte Sonneneinstrahlung lagern und von Betonböden fernhalten, um das Aufsaugen von Feuchtigkeit zu verhindern.
    - title: Wie hoch ist die Gewichtskapazität von afarer aufblasbaren SUPs?
      description: Die Tragfähigkeiten reichen von 100 kg für unsere kleinsten Modelle bis über 200 kg für größere Boards. Jede Produktseite gibt die maximale Traglast für Ihr spezifisches Modell an.

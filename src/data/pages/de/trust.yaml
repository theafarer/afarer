      description: 'Alle afarer SUPs, SUPs, SUPs und RIBs erfüllen die europäischen CE-Sicherheitsstandards für Freizeitwasserfahrzeuge. Jedes Produkt wird vor Verlassen des Werks Druck-, Auftriebs- und Lasttests unterzogen.'

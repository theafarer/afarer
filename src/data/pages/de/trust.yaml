warranty_section:
  title: Garantie & Kundendienst
  subtitle: Wir stehen hinter jedem Produkt mit klaren Garantiebedingungen, schneller Schadensbearbeitung und echten Ersatzteilen.
  items:
    - title: 2 Jahre Produktgarantie
      desc: Alle afarer-Produkte haben eine 2-jährige Garantie gegen Herstellungsfehler — Nahtversagen, Ventilfehler und Materialdelamination unter normaler Nutzung.
    - title: Lebenslange Ersatzteilunterstützung
      desc: Echte Ersatzteile — Ventile, Reparaturkits, Finnen, D-Ringe — für alle Modelle erhältlich. Wir erhalten Formen und Werkzeuge mindestens 5 Jahre nach Produktionsende.
    - title: 48-Stunden-Antragsantwort
      desc: Garantieansprüche werden innerhalb von 48 Stunden anerkannt. Austauschplatinen werden innerhalb von 10 Werktagen für genehmigte Ansprüche versandt.
    - title: Globales Reparaturnetzwerk
      desc: Autorisierte Reparaturzentren in 15 Ländern. Vor-Ort-Reparaturkits für Einsätze in abgelegenen Gebieten verfügbar. Anleitungen zur Selbstreparatur bei kleineren Schäden.
    - title: OEM-Kundensupport
      desc: Dedizierte Account-Manager für B2B-Partner. Vierteljährliche Geschäftsüberprüfungen, Bestandsplanung und Co-Branding-Marketingunterstützung.
    - title: Zertifizierungspaket
      desc: Vollständige Konformitätsdokumentation wird mit jeder Lieferung bereitgestellt — CE-Erklärung, Prüfberichte, Sicherheitsdatenblätter für Materialien.
      link: /contact

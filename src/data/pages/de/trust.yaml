steps2_manufacturing:
  title: So gewährleisten wir Qualität
  subtitle: Von der Rohmaterialprüfung bis zum abschließenden Drucktest —jedes Produkt durchläuft eine strenge Qualitätskette.
  items:
    - title: Rohmaterialprüfung
      description: Jede Rolle PVC-Gewebe wird vor der Produktion auf Dicke, Zugfestigkeit und UV-Beständigkeit geprüft.
      icon: tabler:search
    - title: Prozess-QC
      description: Schweißnähte, Ventilinstallationen und Kammerverbindungen werden an jeder Station während der Montage geprüft.
      icon: tabler:eye
    - title: Druckprüfung
      description: Jedes aufblasbare Produkt wird auf das 1,5-fache des Nenndrucks aufgepumpt und 24 Stunden lang gehalten, um Luftdichtheit und Nahtintegrität zu überprüfen.
      icon: tabler:wind
    - title: Endkontrolle
      description: Jedes Gerät wird vor der Versandfreigabe auf Oberfläche, Beschläge und Verpackung geprüft. Chargenproben gehen zur zerstörenden Prüfung ins Labor.
      icon: tabler:clipboard-check

hero:
  tagline: Ingenieurwesen
  title: Wie man die SUP-Dicke wählt — Ingenieurtechnische Analyse
  subtitle: 6 Min. Lesezeit
content_html: >
  <h2>Die drei Standarddicken</h2>


  <h3>4" (10 cm) – Tourneen &amp; Auftritte</h3>

  <ul>
    <li>Höchste Steifigkeit – weniger Flexibilität unter Last</li>
    <li>Am leichtesten – weniger Material, weniger Luftmenge</li>
    <li>Ausgezeichnetes Tracking – weniger seitliches Schaukeln</li>
    <li>Schnellster – weniger Luftwiderstand, leichteres Gleiten</li>
    <li>Am besten für: Touren, Rennen, Fitness-Paddeln, erfahrene Paddler</li>
  </ul>


  <h3>5" (12,7 cm) – Allround</h3>

  <ul>
    <li>Gute Steifigkeit – ausgewogenes Biege-Steifigkeits-Verhältnis</li>
    <li>Mittleres Gewicht – Standardmaterialverwendung</li>
    <li>Gute primäre sekundäre Stabilität</li>
    <li>Am besten für: Freizeitpaddeln, Anfänger, gelegentliche Nutzung von Seen und Flüssen</li>
  </ul>


  <h3>15,2 cm (6" – Stabilität &amp; Yoga</h3>

  <ul>
    <li>Höchste Primärstabilität – massive Auftriebskraft</li>
    <li>Am schwersten – mehr PVC-Material, größeres Luftvolumen</li>
    <li>Langsamster – mehr Luftwiderstand, schwerer zu gleiten</li>
    <li>Am besten für: Yoga/Fitness, schwere Paddler (100 kg), sehr unruhige Bedingungen</li>
  </ul>


  <h2>Ingenieuranalyse</h2>

  <p>Die Steifigkeit eines aufblasbaren SUP wird durch den inneren Luftdruck und das Trägheitsmoment des Querschnitts der Platine bestimmt. Bei 20 PSI zeigt eine 4"-Platine unter Last etwa 30 % weniger Durchbiegung als eine 6"-Platte mit gleicher Breite und Länge. Die primäre Stabilität ergibt sich
  aus der Breite und dem Auftrieb der Wasserleitung; Die sekundäre Stabilität wird durch die Form der Schienen und die Breite des Boards beeinflusst.</p>


  <h2>Dicke nach Paddlergewicht</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr Klasse="bg-gray-100">
        <. Klasse="p-3 Text-links Schrift-halbfett Text-grau-900 Rand">Paddler-Gewicht</th>
        <. Klasse="p-3 Text-links schrift-halbfett text-grau-900 Rand">Empfohlene Dicke</th>
      </tr>
    </thead>
    <tbody>
      <tr><td-Klasse="p-3-Grenze">Unter 65 kg (143 lbs)</td><td-Klasse="p-3-Grenze">4"</td></tr>
      <tr><td-Klasse="P-3-Rand">65 – 90 kg (143 – 198 lbs)</td><td-Klasse="P-3-Grenze">5"</td></tr>
      <tr><td-Klasse="P-3-Rand">90 – 115 kg (198 – 253 lbs)</td><td-Klasse="P-3-Rand">5" oder 6"</td></tr>
      <tr><td-Klasse="p-3-Rande">Über 115 kg (253 lbs)</td><td-Klasse="p-3-Grenze">6"</td></tr>
    </tbody>
  </table>


  <h2>Dicke- vs. PSI-Kompromiss</h2>

  <p>Ein weit verbreitetes Missverständnis ist, dass ein höherer PSI eine übermäßige Dicke ausgleichen kann. Bei 25 PSI zeigt eine 6"-Platine mehr Flexibilität als eine 4"-Platte bei 15 PSI, da das geometrische Trägheitsmoment die Steifigkeitsgleichung dominiert. Für leistungsorientierte Paddler
  schneidet ein dünneres Board bei niedrigerem Druck besser ab als ein dickeres Board bei höherem Druck.</p>


  <h2>Afarer Besetzung</h2>

  <ul>
    <li><strong>4" Boards:</strong> Cheetah Touring Serie – 12' x 30" x 4" Touring SUPs für Fitness und Langstreckenpaddeln</li>
    <li><strong>5" Bretter:</strong> Cheetah All-Round Serie – 10'6" x 32" x 5" für Freizeitnutzung</li>
    <li><strong>6" Boards:</strong> Cheetah Ultra-Stable Serie – 10' x 34" x 6" für Yoga, große Paddler und Fotoplattformen</li>
  </ul>

  <p>Alle Platinen verwenden 1.680 DTEX Drop-Stitch-Kerne mit einem Nenndruck von 20 PSI und 1,2 mm PVC-Laminaten.</p>

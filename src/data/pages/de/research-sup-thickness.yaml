hero:
  tagline: Ingenieurwesen
  title: Wie man die SUP-Dicke wählt — Ingenieurtechnische Analyse
  subtitle: 6 Min. Lesezeit
content_html: |-
  <h2>Die drei Standarddicken</h2>

  <h3>4" (10 cm) &ndash; Touring &amp; Performance</h3>
  <ul>
    <li>H&ouml;chste Steifigkeit &ndash; weniger Flex unter Last</li>
    <li>Am leichtesten &ndash; weniger Material, weniger Luftvolumen</li>
    <li>Hervorragende Spurtreue &ndash; reduziertes seitliches Schaukeln</li>
    <li>Am schnellsten &ndash; weniger Widerstand, leichteres Gleiten</li>
    <li>Am besten f&uuml;r: Touring, Rennen, Fitness-Paddeln, erfahrene Paddler</li>
  </ul>

  <h3>5" (12.7 cm) &ndash; Allround</h3>
  <ul>
    <li>Gute Steifigkeit &ndash; ausgewogenes Flex-Steifigkeits-Verh&auml;ltnis</li>
    <li>M&auml;&szlig;iges Gewicht &ndash; Standard-Materialeinsatz</li>
    <li>Gute prim&auml;re + sekund&auml;re Stabilit&auml;t</li>
    <li>Am besten f&uuml;r: Freizeitpaddeln, Anf&auml;nger, gelegentliche See- und Flussnutzung</li>
  </ul>

  <h3>6" (15.2 cm) &ndash; Stabilit&auml;t &amp; Yoga</h3>
  <ul>
    <li>H&ouml;chste prim&auml;re Stabilit&auml;t &ndash; massiver Auftrieb</li>
    <li>Am schwersten &ndash; mehr PVC-Material, gr&ouml;&szlig;eres Luftvolumen</li>
    <li>Am langsamsten &ndash; mehr Widerstand, schwerer zu gleiten</li>
    <li>Am besten f&uuml;r: Yoga/Fitness, schwere Paddler (100+ kg), sehr unruhige Bedingungen</li>
  </ul>

  <h2>Technische Analyse</h2>
  <p>Die Steifigkeit eines aufblasbaren SUP wird durch den inneren Luftdruck und das Fl&auml;chentr&auml;gheitsmoment des Board-Querschnitts bestimmt. Bei 20 PSI zeigt ein 4"-Board unter Last etwa 30% weniger Durchbiegung als ein 6"-Board gleicher Breite und L&auml;nge. Die prim&auml;re Stabilit&auml;t ergibt sich aus Wasserlinienbreite und Auftrieb; die sekund&auml;re Stabilit&auml;t wird durch die Railform und die Boardbreite beeinflusst.</p>

  <h2>Dicke nach Paddlergewicht</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Paddlergewicht</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Empfohlene Dicke</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Unter 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 &ndash; 90 kg (143 &ndash; 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 &ndash; 115 kg (198 &ndash; 253 lbs)</td><td class="p-3 border">5" oder 6"</td></tr>
      <tr><td class="p-3 border">&Uuml;ber 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Dicke vs. PSI-Kompromiss</h2>
  <p>Ein h&auml;ufiges Missverst&auml;ndnis ist, dass ein h&ouml;herer PSI-Wert eine &uuml;berm&auml;&szlig;ige Dicke ausgleichen kann. Bei 25 PSI zeigt ein 6"-Board mehr Flex als ein 4"-Board bei 15 PSI, weil das geometrische Fl&auml;chentr&auml;gheitsmoment die Steifigkeitsgleichung dominiert. F&uuml;r leistungsorientierte Paddler schneidet ein d&uuml;nneres Board mit niedrigerem Druck besser ab als ein dickeres Board mit h&ouml;herem Druck.</p>

  <h2>Afarer-Produktlinie</h2>
  <ul>
    <li><strong>4"-Boards:</strong> Cheetah Touring-Serie &ndash; 12' x 30" x 4" Touring-SUPs f&uuml;r Fitness- und Distanzpaddeln</li>
    <li><strong>5"-Boards:</strong> Cheetah All-Round-Serie &ndash; 10'6" x 32" x 5" f&uuml;r den Freizeitgebrauch</li>
    <li><strong>6"-Boards:</strong> Cheetah Ultra-Stable-Serie &ndash; 10' x 34" x 6" f&uuml;r Yoga, gro&szlig;e Paddler und Fotografie-Plattformen</li>
  </ul>
  <p>Alle Boards verwenden 1,680 DTEX Drop-Stitch-Kerne mit einem Nenndruck von 20 PSI und 1.2 mm PVC-Laminaten.</p>

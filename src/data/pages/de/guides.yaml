size_guide:
  tagline: Größe & Spezifikationen
  title: Finden Sie die richtige Größe für Ihre Bedürfnisse
  desc: Vergleichen Sie SUP-Board-Abmessungen, Gewichtskapazitäten und empfohlene Verwendungen. Egal, ob Sie ein Touring-SUP, ein Yoga-Board oder ein Allround-SUP benötigen – unser Größenleitfaden hilft Ihnen, die richtige Auswahl zu treffen.
  link_label: Größenübersicht mit Produktspezifikationen →
  link: /size-guide
  cards:
    - title: SUP-Boards
      desc: Wähle die Länge basierend auf deinem Gewicht und deinem vorgesehenen Einsatz. Breitere Bretter (32" bieten mehr Stabilität. Längere Boards (11–2 Fuß) Schienen sind besser für Touren.
    - title: Touring-SUPs
      desc: Längere Bretter (11–2 ft), um Distanz zu überwinden und geradeaus zu fahren. Stabil genug für Touren mit Ausrüstung. Überprüfen Sie immer die Gewichtskapazität.
    - title: Allround-SUPs
      desc: Wähle die Länge nach Reitergewicht und benutze sie. Breitere Bretter (32" ) für Stabilität. Vielseitig für Freizeit und Fitness.

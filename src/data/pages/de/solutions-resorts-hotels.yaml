        - 12-monatige Garantie   CE-zertifiziert
      revenue: $120.000–$200.000 jährliches Umsatzpotenzial
      popular: true
      cta_text: Premium-Paket erhalten
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'

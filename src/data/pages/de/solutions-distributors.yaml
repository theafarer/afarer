meta:
  title: SUP-Distributionspartnerprogramm | {SITE}
  description: Treten Sie Afarers globalem Vertriebsnetz bei. Exklusive Gebiete, komplettes Produktportfolio, wettbewerbsfähige Großhandelspreise und engagiertes Account-Management.
hero:
  tagline: Vertriebspartner
  title: Treten Sie unserem globalen<br />Vertriebsnetz bei
  subtitle: Exklusive Gebiete. Komplettes Produktportfolio. Weltklasse-Support. Afarer liefert in über 50 Länder und wir suchen etablierte Händler für Marine- und Wassersport.

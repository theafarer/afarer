benefits:
  title: Was Distributoren erhalten
  subtitle: Alles, was Sie benötigen, um in Ihrem Markt erfolgreich zu sein.
  items:
    - Exklusive Gebietsrechte
    - Vollständiger Produktkatalog (SUP, Zubehör, Ersatzteile)
    - Wettbewerbsfähige Großhandelspreise
    - Marketing- und Verkaufsmaterialien (übersetzt)
    - Schulungsprogramm (Produkt, Vertrieb, Wartung)
    - Messeunterstützung
    - Beispielprogramm
    - Drop-Shipping-Fähigkeit
    - Engagierter Vertriebsaccount-Manager
    - Zahlungsbedingungen 45-60 Tage

meta:
  title: Afarer Inflatable Paddle Boards | Go Farther, Ride Stronger
  description: Discover Afarer inflatable paddle boards for all-around paddling, touring, yoga, fishing and outdoor adventures. Find your perfect SUP and explore more on the water.
  keywords:
    - inflatable paddle board
    - inflatable sup
    - all around sup
    - touring sup
    - yoga sup
    - fishing sup
    - family paddle board
    - portable paddle board
hero:
  tagline: Inflatable Paddle Boards
  title: Inflatable Paddle Boards for Every Adventure
  slogan: Go Farther. Ride Stronger.
  subtitle: Discover the freedom of paddling with Afarer. Explore thoughtfully designed inflatable SUPs for relaxing lake days, coastal adventures, fitness and everything in between.
  taglineSection: Engineered for confidence. Designed to stand apart.
  actions:
    - variant: primary
      text: Find Your Board
      href: /size-guide/
      icon: tabler:compass
    - text: Explore SUP Boards
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Why Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Afarer inflatable SUPs gliding across calm water at sunrise — built for every adventure
who_we_serve:
  tagline: Ride With Us
  title: Find Your Way on the Water
  subtitle: Every paddler has a different idea of adventure. Discover an Afarer SUP designed around the way you ride.
  items:
    - title: First-Time & Recreational Riders
      keywords: beginner inflatable SUP, all-around paddle board, stable SUP
      description: Wide, stable all-around boards that make your first stroke feel natural and keep up as you progress.
      icon: tabler:users
      cta: Find Your First Board
      link: /all-around-sup/
    - title: Touring & Adventure Paddlers
      keywords: touring SUP, long distance paddle board, expedition SUP
      description: Longer, narrower boards built to track straight, glide farther, and carry gear for multi-day routes.
      icon: tabler:building
      cta: Explore Touring Boards
      link: /touring-sup/
    - title: Yoga & Fitness Paddlers
      keywords: yoga SUP, fitness paddle board, wide stable SUP
      description: Wide, stable platforms with room to move — for sunrise flows, workouts, and balance on calm water.
      icon: tabler:heart
      cta: Explore Yoga SUPs
      link: /yoga-sup/
    - title: Fishing & Family Paddlers
      keywords: fishing SUP, family paddle board, stable fishing platform
      description: Stable, practical platforms for casting a line, paddling with the kids, and long relaxing days on the water.
      icon: tabler:users
      cta: Explore Fishing SUPs
      link: /fishing-sup/
proof_points:
  title: Tested Beyond the Showroom
  subtitle: Design, performance, and quality you can verify — on the water and in the numbers.
  items:
    - metric: 10+
      label: Years Designing for the Water
      detail: Since 2012, refined board by board
    - metric: 50+
      label: Countries on the Water
      detail: Paddlers and partners worldwide
    - metric: 12–15
      label: PSI Drop-Stitch Core
      detail: Rigid where it matters, easy to pack
    - metric: 100%
      label: Pressure-Tested Board by Board
      detail: Inspected before it ships
business_solutions:
  tagline: Why It Rides Different
  title: Performance You Can Feel on the First Stroke
  subtitle: Four pillars shaped by real water — performance, design, construction, and quality.
  items:
    - title: Water Performance
      description: Shapes tuned for stability, glide, and confidence in chop — so every stroke feels connected to the water.
      icon: tabler:shield-check
    - title: Expressive Design
      description: Collections drawn from tides, wildlife, and the energy of the shoreline — boards you want to be seen with.
      icon: tabler:package
    - title: Proven Construction
      description: High-density drop-stitch cores, reinforced rails, and fusion-laminated seams built for repeated use.
      icon: tabler:headset
    - title: Verified Quality
      description: Pressure-tested, visually inspected, and backed by a clear warranty and responsive after-sales support.
      icon: tabler:truck-delivery
cta:
  title: Find your next ride.
  subtitle: Whether you’re taking your first stroke or chasing your longest route — we’ll get you on the water.
  actions:
    - variant: primary
      text: Explore the Collection
      href: /inflatable-sup/
      icon: tabler:send
    - text: Request a Catalog
      href: /resources/download-catalog/

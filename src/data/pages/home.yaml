meta:
  title: 'Performance Inflatable SUP Boards — Afarer Water Sports | {SITE}'
  description: 'Afarer designs performance inflatable SUPs for open water, touring, yoga, and adventure. Drop-stitch rigidity, pressure-tested board by board, with a clear warranty. Explore the collection.'
  keywords:
    - 'performance inflatable sup'
    - 'premium inflatable paddle board'
    - 'inflatable sup board brand'
    - 'touring inflatable sup'
    - 'inflatable stand up paddle board'
hero:
  tagline: 'Performance Inflatable SUP Boards'
  title: 'Go Farther.<br />Ride Stronger.'
  subtitle: |
    Performance inflatable SUPs designed for open water, long days,<br />
    and the freedom to explore — stable when it matters,<br />
    rigid under pressure, and ready for changing water.
  taglineSection: 'Engineered for confidence. Designed to stand apart.'
  actions:
    - variant: primary
      text: Explore Boards
      href: /inflatable-sup
      icon: tabler:waves
    - text: Find Your Ride
      href: /size-guide
      icon: tabler:compass
    - text: Why Afarer
      href: /afarer-story
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Afarer inflatable SUP gliding across open water at first light — built for long days and the freedom to explore

who_we_serve:
  tagline: Ride With Us
  title: Made for the Way You Ride
  subtitle: From your first stroke to your longest route — and for the clubs, resorts, and retailers who keep people paddling.
  items:
    - title: First-Time & Recreational Riders
      keywords: beginner inflatable SUP, all-around paddle board, stable SUP
      description: Wide, stable all-around boards that make your first stroke feel natural and keep up as you progress.
      icon: tabler:users
      cta: Find Your First Board
      link: /all-around-sup
    - title: Touring & Adventure Paddlers
      keywords: touring SUP, long distance paddle board, expedition SUP
      description: Longer, narrower boards built to track straight, glide farther, and carry gear for multi-day routes.
      icon: tabler:building
      cta: Explore Touring Boards
      link: /touring-sup
    - title: Clubs, Resorts & Rentals
      keywords: SUP rental fleet, paddle club equipment, resort water activities
      description: Fleet-ready inflatable SUPs with dependable durability, easy maintenance, and replacement parts support.
      icon: tabler:shopping-cart
      cta: Build Your Fleet
      link: /solutions
    - title: Retail & Brand Partners
      keywords: private label SUP, custom SUP brand, wholesale paddle boards
      description: Distinctive boards, design collaboration, and dependable supply for retailers and emerging water sports brands.
      icon: tabler:package
      cta: Partner With Afarer
      link: /oem-odm-manufacturer

proof_points:
  title: Tested Beyond the Showroom
  subtitle: Design, performance, and quality you can verify — on the water and in the numbers.
  items:
    - metric: 10+
      label: Years Designing for the Water
      detail: Since 2012, refined board by board
    - metric: 50+
      label: Countries on the Water
      detail: Paddlers and partners worldwide
    - metric: 12–15
      label: PSI Drop-Stitch Core
      detail: Rigid where it matters, easy to pack
    - metric: 100%
      label: Pressure-Tested Board by Board
      detail: Inspected before it ships

business_solutions:
  tagline: Why It Rides Different
  title: Performance You Can Feel on the First Stroke
  subtitle: Four pillars shaped by real water — not just manufacturing capability.
  items:
    - title: Water Performance
      description: Shapes tuned for stability, glide, and confidence in chop — so every stroke feels connected to the water.
      icon: tabler:shield-check
    - title: Expressive Design
      description: Collections drawn from tides, wildlife, and the energy of the shoreline — boards you want to be seen with.
      icon: tabler:package
    - title: Proven Construction
      description: High-density drop-stitch cores, reinforced rails, and fusion-laminated seams built for repeated use.
      icon: tabler:headset
    - title: Verified Quality
      description: Pressure-tested, visually inspected, and backed by a clear warranty and responsive after-sales support.
      icon: tabler:truck-delivery

oem_section:
  tagline: Afarer Studio
  title: From Idea to Water — Design Partnership at Scale
  subtitle: 'For retailers and emerging brands that want more than a catalog product: collaborative design, practical engineering, and products built to perform at scale.'
  steps:
    - number: '01'
      title: Idea & Brief
      desc: Share your vision, target rider, and the water you're designing for.
    - number: '02'
      title: Design & Engineering
      desc: 3D modeling, material selection, and distinctive graphic design.
    - number: '03'
      title: Prototype & Validate
      desc: Sample boards pressure-tested and ride-validated before you commit.
    - number: '04'
      title: Build at Scale
      desc: Consistent, inspected production with quality checkpoints at every stage.
    - number: '05'
      title: Global Delivery
      desc: Logistics from Qingdao to major ports with customs support.
  cta: Start a Design Project
  cta_link: /oem-odm-manufacturer

cta:
  title: Find your next ride.
  subtitle: Whether you're taking your first stroke, equipping a club, or building a board brand — we'll get you on the water.
  actions:
    - variant: primary
      text: Explore the Collection
      href: /inflatable-sup
      icon: tabler:send
    - text: Request a Catalog
      href: /resources/download-catalog

distributor:
  tagline: Global Partner Program
  title: Sell Afarer in Your Market
  subtitle: A one-country-one-distributor program with territory exclusivity, dealer pricing, marketing support, and a dedicated Distributor Success Program.
  benefits:
    - title: Territory Exclusivity
      description: One authorized distributor per country or region — no internal competition, no channel conflict.
    - title: Direct-Factory Margins
      description: Distributor price lists and annual rebates on committed volumes, shipped FOB Qingdao.
    - title: Marketing & Training Support
      description: Co-branded assets, dealer POS materials, product training, and launch campaigns.
    - title: Dedicated Account Team
      description: A personal distributor manager plus onboarding, forecasting, and reorder support.
  actions:
    - variant: primary
      text: Become a Distributor
      href: /distributor-program
    - text: Request Dealer Price List
      href: /contact?subject=Dealer Price List
    - text: Apply for Country Partnership
      href: /contact?subject=Country Partnership Application
    - text: Download Distributor Program
      href: /distributor-program
  note: Minimum first order of 100–300 units for Country/Regional Distributors. Trial orders from 10–30 units.

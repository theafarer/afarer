      description: 'Localized campaign assets, dealer POS materials, event kits, digital content in multiple languages, and co-marketing support for launch seasons.'
      icon: 'tabler:mood-smile'
    - title: 'Product, Sales & Technical Training'
      description: 'Structured onboarding sessions on product, sales, and technical knowledge, with updated materials as the range evolves.'
      icon: 'tabler:presentation'
    - title: 'Spare Parts & After-Sales Support'
      description: 'Spare parts supply, warranty registration and claims handling, and product datasheets and manuals for your local service team.'
      icon: 'tabler:settings'
    - title: 'Dedicated Account Manager & Partner Portal'
      description: 'A personal distributor manager plus access to price lists, order status, and marketing resources through the Afarer partner portal.'
      icon: 'tabler:user-check'

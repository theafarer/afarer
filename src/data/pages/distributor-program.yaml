    - [Full Product Line Rights, 300–1, 000, 60–90 days, 30% deposit / 70% before shipment]
faqs:
  title: 'Distributor Program — FAQ'
  subtitle: 'Everything distributors ask before applying.'
  items:
    - title: 'What does one-country-one-distributor mean?'
      description: 'Afarer grants a single authorized distributor exclusive rights for a country or region. You own your market — no parallel imports, no internal competition.'
    - title: 'What is the minimum first order?'
      description: 'Country and regional distributors start at 100–300 units. Authorized dealers start at 30–50 units. Trial orders from 10–30 units let you validate the market first (no territorial protection).'
    - title: 'What support do distributors receive?'
      description: 'The Distributor Success Program covers onboarding, go-to-market planning, product and sales training, demo fleet support, localized marketing assets, and a dedicated account manager.'
    - title: 'How does Afarer protect me from channel conflict?'
      description: 'Each territory has exactly one authorized distributor. Direct orders from your region are routed through you, and pricing is set to protect your margin.'
    - title: 'What are the shipping and payment terms?'
      description: 'Orders ship FOB Qingdao with full export documentation. Production orders are 30% deposit with 70% before shipment; trial and sample orders are prepaid.'
    - title: 'How do I apply?'
      description: 'Send us an application via the contact form. We review market fit, retail presence, and logistics capability, then respond within 3 business days with next steps and a sample Distributor Agreement.'
cta:
  title: 'Ready to own your market?'
  subtitle: 'Apply for the Afarer Distributor Program and get a response within 3 business days.'
  actions:
    - text: 'Apply for Distributorship'
      href: /contact?subject=Distributor Application
      variant: primary
    - text: 'Download the Distributor Program'
      href: /distributor-program
      variant: secondary

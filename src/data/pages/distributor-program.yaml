  title: 'Why Partner With Afarer'
  subtitle: 'Built for channel partners who want to grow a water sports business with a serious brand behind them.'
  columns: 3
  items:
    - title: 'Territory Exclusivity'
      description: 'A protected country or regional market. One distributor, no internal competition, no channel conflict — your investment builds your own moat.'
      icon: 'tabler:shield-check'
    - title: 'Direct-Factory Margins'
      description: 'Distributor price list with rebates on committed volumes. No middlemen. FOB Qingdao shipping with full export documentation.'
      icon: 'tabler:coins'
    - title: 'Distributor Success Program'
      description: 'Structured onboarding, go-to-market planning, product and sales training, demo fleet support, and co-marketing tools.'
      icon: 'tabler:rocket'
    - title: 'Marketing & Brand Support'
      description: 'Localized campaign assets, dealer point-of-sale materials, event kits, and digital content in multiple languages.'
      icon: 'tabler:mood-smile'
    - title: 'Reliable Supply Chain'
      description: 'ISO & CE-certified manufacturing with consistent QC, predictable MOQs, and lead times you can plan around.'
      icon: 'tabler:building-factory'
    - title: 'Dedicated Account Manager'
      description: 'A personal distributor manager for forecasting, order planning, and after-sales support.'
      icon: 'tabler:user-check'

features:
  title: 'Why Partner With Afarer'
  subtitle: 'A one-country-one-distributor model with the support structure to make the territory pay. Exclusivity is earned and maintained — not a permanent right.'
  columns: 3
  items:
    - title: 'Territory Exclusivity'
      description: 'One authorized distributor per country or region. No parallel imports, no internal competition. Your investment builds your own moat.'
      icon: 'tabler:shield-check'
    - title: 'Channel Conflict Protection'
      description: 'Direct orders from your region are routed through you, and pricing protects your margin. Afarer does not sell around its country partners.'
      icon: 'tabler:users'
    - title: 'Direct-Factory Margins & Rebates'

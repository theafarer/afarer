  title: SUP Kalınlığı Nasıl Seçilir — Mühendislik Analizi | {SITE}
  description: 'Şişirilebilir SUP tahta kalınlığına ilişkin teknik rehber: 4", 5" ve 6" tahtaların rijitlik, ağırlık, denge, iz takibi ve performans açısından nasıl farklılaştığı. Gezi, yoga, sörf, yarış ve çok amaçlı kürek çekme için kalınlık önerileri.'
back_text: Araştırmaya Dön
hero:
  tagline: Mühendislik
  title: SUP Kalınlığı Nasıl Seçilir — Mühendislik Analizi
  subtitle: 6 dk okuma
content_html: >-
  <h2>Üç Standart Kalınlık</h2>


  <h3>4" (10 cm) – Tur ve Performans</h3>

  <ul>
    <li>En yüksek rijitlik – yük altında daha az esneme</li>
    <li>En hafif – daha az malzeme, daha az hava hacmi</li>
    <li>Mükemmel rota tutuşu – sağa sola sallanmanın azalması</li>
    <li>En hızlı – daha az sürtünme, daha kolay süzülme</li>
    <li>En uygun: Tur, yarış, fitness kürek sporu ve deneyimli kürekçiler</li>
  </ul>


  <h3>5" (12.7 cm) – Çok Yönlü</h3>

  <ul>
    <li>İyi rijitlik – dengeli esneklik-sertlik oranı</li>
    <li>Orta düzeyde ağırlık – standart malzeme kullanımı</li>
    <li>İyi birincil ve ikincil stabilite</li>
    <li>En uygun: Rekreasyonel kürek sporu, yeni başlayanlar, göl ve nehirde günlük kullanım</li>
  </ul>


  <h3>6" (15.2 cm) – Stabilite ve Yoga</h3>

  <ul>
    <li>En yüksek birincil stabilite – yüksek kaldırma kuvveti</li>
    <li>En ağır – daha fazla PVC malzeme, daha büyük hava hacmi</li>
    <li>En yavaş – daha fazla sürtünme, süzülmeyi sürdürmek daha zor</li>
    <li>En uygun: Yoga/fitness, ağır kürekçiler (100+ kg) ve çok dalgalı koşullar</li>
  </ul>


  <h2>Mühendislik Analizi</h2>

  <p>Şişme bir SUP boardun sertliği, iç hava basıncı ve board kesitinin atalet momenti tarafından belirlenir. 20 PSI'da, 4 inç bir board, aynı genişlik ve uzunluktaki 6 inç bir boarda kıyasla yük altında yaklaşık %30 daha az sehim gösterir. Birincil stabilite, su hattı genişliği ve kaldırma
  kuvvetinden kaynaklanır; ikincil stabilite ise gövde formu ve board genişliği tarafından etkilenir.</p>


  <h2>Kürekçi Ağırlığına Göre Kalınlık</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Kürekçi Ağırlığı</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Önerilen Kalınlık</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">65 kg (143 lbs) altı</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5 inç veya 6 inç</td></tr>
      <tr><td class="p-3 border">115 kg (253 lbs) üzeri</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>Kalınlık ve PSI Ödünleşimi</h2>

  <p>Yaygın bir yanlış kanı, daha yüksek PSI'nın aşırı kalınlığı telafi edebileceğidir. 25 PSI'da bir 6 inç board, 15 PSI'daki bir 4 inç boarddan daha fazla esner; çünkü sertlik denklemine geometrik atalet momenti hâkimdir. Performans odaklı kürekçiler için, daha düşük basınçtaki daha ince bir
  board, daha yüksek basınçtaki daha kalın bir boarddan daha iyi performans gösterir.</p>


  <h2>Afarer Ürün Serisi</h2>

  <ul>
    <li><strong>4 inç boardlar:</strong> Cheetah Touring serisi – fitness ve uzun mesafe kürek sporu için 12' x 30" x 4" tur SUPları</li>
    <li><strong>5 inç boardlar:</strong> Cheetah All-Round serisi – rekreasyonel kullanım için 10'6" x 32" x 5"</li>
    <li><strong>6 inç boardlar:</strong> Cheetah Ultra-Stable serisi – yoga, iri yapılı kürekçiler ve fotoğrafçılık platformları için 10' x 34" x 6"</li>
  </ul>

  <p>Tüm boardlar, 20 PSI dereceli basınç ve 1,2 mm PVC lamine katmanlarına sahip 1.680 DTEX drop-stitch çekirdekler kullanır.</p>

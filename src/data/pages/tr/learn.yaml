meta:
  title: 'Öğren — SUP, kürek ve tekne yaşamı | {SITE}'
  description: 'afarer ile öğrenin: şişme SUP tahtaları, kürek teknikleri, tekne temelleri ve meraklılar ile şirketler için denizcilik eğitimi.'
  keywords:
    - 'SUP öğrenme'
    - 'paddle board eğitimi'
    - 'şişme SUP eğitimi'
    - 'kürek teknikleri'
hero:
  tagline: Su Keşif Bilgisi
  title: Öğrenin
  subtitle: |
    Rehberler, eğitimler ve derinlemesine bilgiler —suyu güvenle keşfetmek<br />
    için ihtiyacınız olan her şey. İlk SUP''inizi seçmekten ileri tekniklerde ustalaşmaya kadar.
  taglineSection: Her kürekçi için bilgi. Başlangıç seviyesinden profesyonele.
featured:
  tagline: Öne Çıkan Konular
  title: Öğrenme yolculuğunuza başlayın
  subtitle: İster su sporlarında yeni olun ister seviyenizi yükseltmek isteyin, rehberlerimiz size yardımcı olur.
  items:
    - title: SUP Temelleri
      description: Bir başlangıç seviyesinin bilmesi gereken her şey —board türleri, pala boyutlandırması, duruş ve ilk gün ipuçları.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Şişme vs Sert Board
      description: Hangisi size uygun? Taşınabilirlik, performans, dayanıklılık ve maliyeti yan yana karşılaştırıyoruz.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Su Güvenliği
      description: Her kürekçinin sahip olması gereken temel güvenlik bilgisi —hava durumu, can yelekleri, kendi kendine kurtarma ve daha fazlası.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Malzeme Rehberi
      description: PVC vs Hypalon, drop-stitch teknolojisi, denye değerleri —ekipmanınızın nelerden yapıldığını anlayın.
      icon: tabler:flask
      href: /learn/materials
    - title: SUP Boyut Rehberi
      description: Kilonuz, beceriniz ve kürek stiliniz için doğru board uzunluğunu, genişliğini ve hacmini bulun.
      icon: tabler:ruler
      href: /size-guide
    - title: Orta Seviye Teknikler
      description: Gelişmiş kürek darbeleri, dönüş teknikleri ve dalgalı su kullanımı ile küreğinizi bir üst seviyeye taşıyın.
      icon: tabler:droplet
      href: /learn/intermediate-techniques

features3_reasons:
  tagline: 'Neden uzaktan seçmelisiniz?'
  title: 'Bizimle Ortak Olmanız İçin Yedi Neden'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: "12.000 m²'lik bir fabrikanın sahibi ve işletmecisiyiz. afarer ile ortaklık kurduğunuzda, ürünlerinizi tasarlayan, tasarlayan ve üreten insanlarla doğrudan çalışırsınız; aracı yoktur."
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Tasarım sürecimiz ürün kategorisiyle değil kullanım durumuyla başlar. Teknenin gerçekte nasıl kullanılacağına göre gövde şeklini, malzeme seçimini ve konfigürasyonu optimize ediyoruz.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'CE sertifikalı, ISO kalite sistemi, BSCI uyumlu, REACH uyumlu, USCG onaylı. Her ürün, yalnızca iddiaları değil, uluslararası standartları da karşılar.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Tüp renkleri, konsol düzeni, markalama, ambalajlama; spesifikasyonlarınıza göre özelleştiriyoruz. Minimum sipariş baskısı yok. Bir prototiple başlayın, güvenle ölçeklendirin.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: "Kaliforniya'daki ABD deposu, Qingdao'dan doğrudan nakliye, acil siparişler için hava taşımacılığı. Gümrük evraklarını ve dokümantasyonunu biz hallediyoruz."
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: '20 yıl önce yaptığımız teknelere destek veriyoruz. Orijinal yedek parçalar, teknik tavsiye, onarım rehberliği — ihtiyacınız olduğunda ekibimiz yanınızda.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Gerçek yük değerleri, gerçek boyutlar, gerçek ağırlık. Pazarlama enflasyonu yok. Yayınladığımız şey, bağımsız testlerle doğrulanan, elde ettiğiniz şeydir.'
      icon: tabler:ruler-measure

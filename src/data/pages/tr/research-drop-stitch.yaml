hero:
  tagline: Teknoloji
  title: Drop Stitch Nasıl Çalışır — Şişirilebilir Sert Çekirdeklerin Mühendisliği
  subtitle: 8 dk okuma
content_html: >
  <h2>Drop Stitch Nedir?</h2>

  <p>Drop stitch ("drop-stitch kumaş" veya "drop-stitch çekirdek" olarak da adlandırılır), binlerce polyester ipliğin kumaş kabuğunun üst ve alt katmanlarını birleştirdiği bir üretim yöntemidir. Kabuk şişirildiğinde, bu iplikler iç gerilme elemanları olarak görev yapar — üst ve alt panellerin dışa
  doğru şişerek yuvarlak bir şekil almasını önler ve panelin düz ve rijit kalmasını sağlar.</p>

  <p>Sonuç, 15 – 20 PSI iç basınca dayanabilen, hafif ve taşınabilir bir yapıdır — sert kabuklu bir tahtanın rijitliğine eş değer, ancak depolama ve taşıma için tamamen sökülebilir.</p>


  <h2>Nasıl Çalışır: Fizik</h2>

  <p>Geleneksel bir şişirilebilir yapıda (bir balon veya hava yatağı gibi), iç hava basıncı her yöne eşit olarak baskı uygular. İç kısıtlama olmadan, yapı silindirik veya küresel hale gelir. Drop stitch, gerilme takviyesi ekleyerek bunu çözer:</p>

  <ul>
    <li>Binlerce iplik üst ve alt kumaş katmanlarını birleştirir</li>
    <li>Şişirildiğinde, hava basıncı üst ve alt katmanları birbirinden ayırmaya çalışır</li>
    <li>İplikler bu ayrışmaya direnir ve yükü iplik ekseni boyunca gerilime dönüştürür</li>
    <li>Sonuç, eğilmeye dirençli düz, rijit bir paneldir</li>
  </ul>


  <h2>Üretim Süreci</h2>

  <ol>
    <li><strong>Dokuma:</strong> Polyester iplikler, iki ayrı taban kumaş katmanına (genellikle 1.100 DTEX veya 1.680 DTEX PVC kaplı polyester) aynı anda dokunur. İplikler katmanlar arasında 90&deg; açıyla döngüsel olarak dokunur.</li>
    <li><strong>Kaplama:</strong> Dokunmuş taban kumaşı, bıçak kaplama veya silindir kaplama işlemiyle PVC (veya bazen TPU) ile kaplanır. Bu işlem iplikleri mühürler ve hava geçirmez membranı oluşturur.</li>
    <li><strong>Katman yapıştırma:</strong> Drop-stitch çekirdek, ısı lamine veya yapıştırıcı kullanılarak dış lamine katmanlara (genellikle 0,9 mm veya 1,2 mm PVC) yapıştırılır.</li>
    <li><strong>Kaynak:</strong> Kenar bantları, tahtanın yan duvarlarını oluşturmak için sıcak hava kaynağı, RF kaynağı veya yüksek frekans kaynağı ile kenarları boyunca kaynatılır.</li>
    <li><strong>Vana montajı:</strong> Boston vanaları veya Halkey-Roberts vanaları takılır, genellikle aşırı şişmeyi önlemek için basınç tahliye mekanizması ile birlikte.</li>
  </ol>


  <h2>Temel Kalite Göstergeleri</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parametre</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Giriş Seviyesi</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">İplik yoğunluğu</td><td class="p-3 border">1 iplik / inç²</td><td class="p-3 border">2 iplik / inç²</td></tr>
      <tr><td class="p-3 border">Taban kumaşı</td><td class="p-3 border">1.100 DTEX</td><td class="p-3 border">1.680 DTEX</td></tr>
      <tr><td class="p-3 border">Maksimum basınç</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC kalınlığı</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 border">Kenar yapımı</td><td class="p-3 border">Katlanmış &amp; yapıştırılmış</td><td class="p-3 border">Kaynaklı &amp; birleşik yapıştırılmış</td></tr>
    </tbody>
  </table>


  <h2>Uygulamalar</h2>

  <ul>
    <li><strong>SUP Tahtaları:</strong> 4" – 6" kalınlık, 15 – 20 PSI, 1 – 2 iplik/inç²</li>
    <li><strong>Kanolar:</strong> Drop-stitch zemin + şişirilebilir yan odacıklar, 10 – 15 PSI zemin</li>
    <li><strong>RIB zeminleri:</strong> Hafif, taşınabilir RIB tenderleri için drop-stitch zeminler, 12 – 18 PSI</li>
    <li><strong>Tekne tamponları:</strong> Düz yüzlü şekilli tamponlar için düşük basınçlı drop stitch</li>
  </ul>


  <h2>Drop Stitch vs. Air Deck (Fiberglas veya Ahşap Çekirdek)</h2>

  <p>Sert kabuklu tahtalar, fiberglas veya ahşap takviyeli EPS köpük çekirdekleri kullanır. Daha hafif, daha rijit ve daha duyarlıdır — ancak sökülemezler. Drop stitch, tam taşınabilirlik için bir miktar rijitlikten fedakarlık eder. Çoğu rekreasyonel kullanıcı için, 20 PSI'daki modern drop-stitch
  SUP'ları giriş seviyesi sert tahtalarla rijitlik açısından ayırt edilemez.</p>


  <h2>Afarer Drop Stitch'i Nasıl Kullanır</h2>

  <p>Afarer, tüm SUP yelpazesinde inç karesi başına 2 iplik ve 1,2 mm PVC dış lamine ile 1.680 DTEX drop-stitch çekirdek kullanır. Tahtalar 20 PSI'ya kadar derecelendirilir ve sevkiyat öncesi 1,25x nominal basınçta 24–48 saat basınç tutma testine tabi tutulur. Kenar bantları üç katmanlı birleşik sıcak
  hava kaynağı ile kaynatılır ve basınç tahliye vanaları tüm modellerde standarttır.</p>

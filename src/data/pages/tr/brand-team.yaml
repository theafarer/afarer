      name: Helen Lee
      description: 15 yılı aşkın uluslararası B2B ticaret deneyimi. 30'dan fazla ülkede ortak marka ve dağıtım iş ortaklıkları yönetti. 4 dilde akıcı.
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Tasarım Felsefesi
  title: Mühendislik Odaklı Tasarım<br />—Her Detay Önemlidir
  subtitle: Mühendislik felsefemiz, ürettiğimiz her ürüne rehberlik eden üç prensibe dayanmaktadır.
  list:
    - 'Öncelik Güvenilirlik: Her afarer ürünü, gerçek dünya koşullarına dayanacak şekilde test edilir — soğuk su rescue operasyonlarından tropikal tatil köyü kiralama süreçlerine kadar. En kritik noktalarda mühendislik aşırı güvenli yapılır.'
    - 'Üretim Hassasiyeti: Tesislerimiz CNC kesim, yüksek frekanslı kaynak ve otomatik basınç testi kullanmaktadır. Her dikiş, her valf, her fitting belgelenmiş spesifikasyonlara uygundur.'
    - 'Sürekli İnovasyon: Ar-Ge ekibimiz yeni malzemeleri, üretim yöntemlerini ve tasarım iyileştirmelerini sürekli olarak değerlendirir. Sorunları beklemeyiz — onları önceden tahmin ederiz.'

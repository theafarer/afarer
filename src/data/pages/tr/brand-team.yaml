hero:
  tagline: Our Team
  title: 'Uzaktaki İnsanlar<br />—Suda Mühendislik Özgürlüğü'
  subtitle: "2012 yılında Çin'in Qingdao kentinde kurulan afarer, profesyonel düzeyde şişirilebilir deniz taşıtlarını dünya çapında erişilebilir hale getirmeye inanan deniz mühendisleri, malzeme bilimcileri ve su sporları meraklıları tarafından inşa edildi."
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: "Kıyı Atölyesinden<br />12.000 m²'lik Tesise"
  subtitle: 'afarer, şişme bot tasarımı, PVC/Hypalon imalatı ve küresel denizcilik ekipmanı imalatında onlarca yıllık ortak deneyime sahip bir deniz mühendisleri ekibi tarafından kuruldu.'
  items:
    - title: 'Founded: 2012'
      description: "Derin gemi inşa mirasına sahip büyük bir denizcilik merkezi olan Çin'in Qingdao şehrinde kuruldu."
      icon: tabler:calendar
    - title: '200+ Employees'
      description: "50'den fazla Ar-Ge mühendisi, kalite kontrol uzmanı ve üretim teknisyeni dahil."
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: "SUP'ler, şişme botlar ve SUP tahtaları için 6 üretim hattına sahip özel üretim tesisi."
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: "Avrupa, Amerika, Orta Doğu, Asya-Pasifik ve Afrika'ya ihracat."
      icon: tabler:globe

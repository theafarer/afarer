faqs:
  title: 'Ülke Ortaklığı — SSS'
  subtitle: 'Ciddi ülke ortaklarının başvurmadan önce sorduğu sorular.'
  items:
    - title: 'Tek ülke tek distribütör gerçekte ne anlama gelir?'
      description: 'Afarer, tanımlı bir bölge için münhasır haklara sahip tek bir yetkili distribütör atar. Korunan bir ülkeye küresel veya bölgesel kanallarımızdan satış yapmayız. Bölge sahipliğiniz, Distribution Agreement koşulları yerine getirildiği sürece geçerlidir.'
    - title: 'Bölge sonsuza kadar münhasır mı?'
      description: 'Hayır. Münhasırlık koşulludur, kalıcı değildir. İmzalanmış bir Distribution Agreement, ilk siparişin tamamlanması, yıllık satın alma hedefleri, yerel stok, satış sonrası yeterlilik ve sürekli pazar yatırımı ile sürdürülür. Bunlar karşılanmazsa bölge yeniden müzakere edilebilir veya başka birine devredilebilir.'
    - title: 'Minimum ilk sipariş nedir?'
      description: "Ülke ve bölge distribütörleri 100–300 adetle başlar; yetkili bayiler 30–50 adetle; 10–30 adetlik deneme siparişleri pazarı önce test etmenizi sağlar (deneme ve numune siparişleri bölge koruması sağlamaz). Custom & Private Label programları yukarıdaki seviyelerde listelenen ayrı MOQ'lara tabidir."
    - title: '10 modüllü destek programı neleri kapsar?'
      description: 'Seviyeler ve yeterlilik, bölge koruması, MOQ / fiyatlandırma / yıllık indirimler, envanter ve sipariş yürütme, pazarlama varlıkları ve ortak pazar fonları, ürün / satış / teknik eğitim, yedek parça ve satış sonrası servis, garanti kaydı, ortak portalı, ayrıca ürün veri sayfaları, pazarlama varlık kütüphanesi, yıllık indirim takvimi ile sevkiyat ve paketleme listeleri.'
    - title: 'Afarer beni kanal çakışmalarından nasıl korur?'
      description: 'Her bölgede tam olarak bir yetkili distribütör vardır. Bölgenizden gelen sorular ve doğrudan siparişler sizin üzerinizden geçer; web sitesi formları, yerel ortak mevcutsa ona yönlendirilir ve küresel ekip yalnızca ortak yanıt vermediğinde devreye girer.'
    - title: 'Sevkiyat ve ödeme koşulları nelerdir?'
      description: "Siparişler tam ihracat dokümantasyonuyla FOB Qingdao olarak gönderilir. Üretim siparişleri %30 depozito ve sevkiyattan önce %70'tir; deneme ve numune siparişleri peşindir. Standart teslim süresi 30–45 iş günüdür, numune serileri için 15–20 iş günüdür."
    - title: 'Nasıl başvururum?'
      description: 'Başvurunuzu pazar bilgileriyle birlikte iletişim formu üzerinden gönderin. Pazar uyumunu, perakende varlığını ve lojistik kapasiteyi değerlendirir, ardından 3 iş günü içinde sonraki adımlar ve örnek bir Distribution Agreement ile yanıt veririz.'

faqs:
  title: 'Dağıtıcı Programı — SSS'
  subtitle: 'Dağıtıcıların başvurmadan önce sorduğu her şey.'
  items:
    - title: 'Bir ülke, tek dağıtıcı ne demek?'
      description: 'Afarer, bir ülke veya bölge için tek yetkili dağıtıcıya münhasır haklar verir. Pazarınızın sahibi sizsiniz — paralel ithalat yok, iç rekabet yok.'
    - title: 'Minimum ilk sipariş nedir?'
      description: 'Ülke ve bölge dağıtıcıları 100–300 adetle başlar. Yetkili bayiler 30–50 adetten. Deneme siparişleri 10–30 adetle önce pazarı test etmenize olanak tanır (bölgesel koruma olmadan).'
    - title: 'Dağıtıcılar ne tür destek alır?'
      description: 'Distribütör Başarı Programı; oryantasyon, go-to-market planlaması, ürün ve satış eğitimi, demo filo desteği, yerelleştirilmiş pazarlama materyalleri ve özel hesap yöneticisini kapsar.'
    - title: 'Afarer beni kanal çakışmalarından nasıl korur?'
      description: 'Her bölgede tam olarak bir yetkili dağıtıcı vardır. Bölgenizden gelen doğrudan siparişler sizin üzerinizden geçer ve fiyatlar marjınızı korur.'
    - title: 'Sevkiyat ve ödeme koşulları nelerdir?'
      description: 'Siparişler tam ihracat belgeleriyle FOB Qingdao olarak gönderilir. Üretim siparişleri %30 depozito ve sevkiyattan önce %70; deneme ve numune siparişleri peşindir.'
    - title: 'Nasıl başvururum?'
      description: 'İletişim formu üzerinden bir başvuru gönderin. Pazar uyumunu, perakende varlığınızı ve lojistik kapasiteyi değerlendiririz ve 3 iş günü içinde sonraki adımlar ve örnek dağıtıcı sözleşmesiyle yanıt veririz.'
cta:

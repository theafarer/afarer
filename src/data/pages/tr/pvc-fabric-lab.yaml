intro: Tüp kumaşı, şişme bir teknede en kritik malzemedir. Sürekli UV maruziyeti, tekrarlanan şişirme döngüleri, iskelelere ve enkaza karşı aşınma ve aşırı sıcaklık değişimlerine — yıllarca yapısal bütünlüğünü korurken — dayanması gerekir. Afarer'de PVC Kumaş Laboratuvarımız, ürettiğimiz her teknede kullandığımız kumaşların karakterizasyonuna, doğrulanmasına ve sürekli iyileştirilmesine adanmıştır.
content_html: |
  <h2>Her şişirilebilir teknenin temeli</h2>
  <p>Yalnızca tedarikçi veri sayfalarına güvenmiyoruz. Atölyemize giren her PVC ve Hypalon kumaş partisi bağımsız olarak dahili olarak test edilir. Bu, yayımladığımız malzeme spesifikasyonunun, partiden partiye, yıldan yılıya aldığınız malzeme performansı olduğundan emin olur.</p>

  <h2>Standartlaştırılmış test ekipmanları</h2>
  <p>Kumaş laboratuvarımız, ISO, ASTM ve EN test yöntemlerine uygun endüstriyel düzeyde enstrümanlarla donatılmıştır:</p>
  <table>
    <thead><tr><th>Ekipman</th><th>Ölçülen Parametreler</th><th>Standart</th></tr></thead>
    <tbody>
      <tr><td>Evrensel çekme test cihazı (50 kN)</td><td>Kopma kuvveti, kopma uzaması, yırtılma yayılımı</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>Ksenon ark hava chambersı</td><td>UV direnci (renk değişimi, 2000 saat sonra mukavemet korunması)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>Düşük sıcaklık esneme test cihazı</td><td>-30 °C ile -50 °C arasında çatlama noktası</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Taber aşınma test cihazı</td><td>1000 döngü sonrası ağırlık kaybı (CS-10 tekerlek)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>Kalınlık ölçer (dijital, 0,001 mm çözünürlük)</td><td>Rulo genişliği boyunca düzgünlük</td><td>ISO 2286-3</td></tr>
      <tr><td>Hidrostatik basınç test cihazı</td><td>Su geçirmezlik direnci</td><td>ISO 811</td></tr>
    </tbody>
  </table>
  <p class="text-sm text-gray-500">* Tüm ekipman, akredite üçüncü taraf laboratuvarları tarafından yılda bir kez kalibre edilir.</p>

  <h2>Veriden karara: tipik bir test iş akışı</h2>
  <p>Yeni bir kumaş adayı geldiğinde, standartlaştırılmış yedi adımlık bir kalifikasyon sürecinden geçer:</p>
  <ol>
    <li><strong>Kabul muayenesi</strong> — yüzey kusurları, iğne delikleri ve boyutsal uyumluluk için görsel kontrol.</li>
    <li><strong>Kalınlık haritalama</strong> — rulo boyunca 20 nokta ölçümü; kabul için CV &lt; %3 gereklidir.</li>
    <li><strong>Çekme testi</strong> — atkı ve çözgü yönlerinde 5 numune. 1100 dtex PVC için minimum 3500 N/50 mm.</li>
    <li><strong>UV kondisyonlama</strong> — ksenon ark chambersında 1000 saat maruz kalma; minimum %80 mukavemet korunması gereklidir.</li>
    <li><strong>Soğuk çatlama</strong> — -35 °C'de 4 saat, ardından 25 mm mandrel üzerinde 180° bükme. Görünür çatlama yok.</li>
    <li><strong>Aşınma direnci</strong> — 1000 döngü, ağırlık kaybı ≤ 0,05 g.</li>
    <li><strong>Onay imzası</strong> — yedi kapının tamamından geçildikten sonra kumaş üretime bırakılır.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Tipik PVC 1100 dtex — UV Maruz Kaldıktan Sonra Çekme Mukavemeti</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 saat<br />%100</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 saat<br />%95</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 saat<br />%88</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 saat<br />%82</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">Rakip<br />~%65</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">PVC 1100 dtex kumaşımız, 2000 saatlik ksenon ark maruziyetinin ardından %80'in üzerinde çekme mukavemetini korurken, tipik endüstri standartları %70'in altına düşmektedir.</p>
  </div>

  <h2>Profesyonel ekibimiz</h2>
  <p>Laboratuvar, her biri polimer bilimi veya tekstil mühendisliği alanında lisans derecesine ve en az altı yıllık sektör deneyimine sahip iki tam zamanlı malzeme mühendisi tarafından yönetilmektedir. Günlük test veri kaydı ve veri kaydı işlemlerini yürüten üç teknisyen tarafından desteklenmektedirler. Ekip, test yöntemlerimizin doğruluğunu doğrulamak için Uluslararası Standartlar Örgütü (ISO) tarafından düzenlenenler arası deneylere düzenli olarak katılmaktadır.</p>

  <h2>En zorlu malzeme zorluklarınızı çözüyoruz</h2>
  <p>Her deniz ortamı farklıdır. Körfez'de devriye gezen bir teknede Kuzey Denizi'ndeki bir kurtarma aracına kıyasla çok farklı UV ve sıcaklık koşullarıyla karşılaşır. Kumaş Laboratuvarımız, operasyon profiliniz için optimize edilmiş bir kumaş spesifikasyonu seçmenize — veya geliştirmenize — yardımcı olur.</p>
  <p>Son özel çözümler şunları içerir:</p>
  <ul>
    <li>Mercan kayalıklarında düzenli olarak karaya çıkan tekneleri olan bir askeri müşteri için yüksek aşınma dirençli PVC karışımı (+%40 aşınma ömrü).</li>
    <li>Arktik araştırma istasyonu için düşük sıcaklıkta Hypalon formülasyonu, -50 °C'de kırılganlık olmadan test edildi.</li>
    <li>Arama-kurtarma filosu için renk stabilize edilmiş turuncu kumaş, 3 yıllık tropikal güneş maruziyetinin ardından görünürlüğü korur.</li>
  </ul>
  <p>"Raf ömrü" kumaşları satıp çalışmasını ummuyoruz. Test ediyoruz, doğruluyoruz ve öneriyoruz — veya özel görev profiliniz için özel bir çözüm oluşturuyoruz. Bu, Afarer farkıdır.</p>

  <h2>Size nasıl hizmet veriyoruz</h2>
  <p>Bize bir malzeme zorluğu getirdiğinizde, şunları bekleyebilirsiniz:</p>
  <ol>
    <li><strong>İstişare</strong> — çalışma ortamınızı, performans hedeflerinizi ve bütçenizi tartışırız.</li>
    <li><strong>Teklif</strong> — açık geçme/başarısızlık kriterleri ve bir zaman çizelgesiyle bir test planı hazırlanır.</li>
    <li><strong>Uygulama</strong> — laboratuvarımız testleri çalıştırır ve ham veriler ve karşılaştırmalı analiz içeren ayrıntılı bir rapor üretir.</li>
    <li><strong>Öneri</strong> — birden fazla malzeme gereksinimlerinizi karşılıyorsa alternatif seçenekler dahil olmak üzere bir kumaş spesifikasyonu sunuyoruz.</li>
    <li><strong>Takip</strong> — teslimattan sonra, hizmet içi malzeme sorularını desteklemek için müsait olmaya devam ediyoruz.</li>
  </ol>
  <p>Hedefimiz size basitçe bir tekne satmak değil. Aldığınız teknenin çalıştığı koşullarda güvenilir bir şekilde performans gösterdiğini garanti altına almaktır — ve bu kumaşla başlar.</p>

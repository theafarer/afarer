meta:
  title: SUP Kiralama Filo Çözümleri | {SITE}
  description: Günlük kiralama kullanımı için tasarlanmış yüksek devirli SUP tahtaları. UV dirençli PVC, takviyeli dikişler, çabuk kuruyan malzemeler. Kiralama işinizi Afarer ile büyütün.
hero:
  tagline: Kiralama İşletmeleri
  title: Kiralama İşletmenizi<br />Güvenle Büyütün
  subtitle: Yılın 365 günü günlük kiralama için tasarlanmış yüksek döngülü SUP boardlar. Geliriniz asla bir gün bile durmaz.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Misafirler için hazır SUP tahtaları olan yoğun kiralama kiosku
features:
  title: Kiralama Yoğunluğu İçin Üretildi
  subtitle: Her tahta minimum bakım ile 500+ kiralama döngüsü için mühendislikle tasarlanmıştır.
  items:
    - title: 500+ Kiralama Döngüsü
      description: Tuzlu su, güneş ve kumda günlük kullanıma dayanacak şekilde test edilmiştir.
      icon: tabler:shield-check
    - title: UV Dirençli Kumaş
      description: 1 yıllık açık hava depolamasından sonra solma veya bozulma yok.
      icon: tabler:sun
    - title: Güçlendirilmiş Dikişler
      description: Standart şişirilebilir tahta yapımından 3 kat daha güçlü.
      icon: tabler:layers-intersect
    - title: Hızlı Kuruyan Malzemeler
      description: Tahtalar 30 dakikadan kısa sürede bir sonraki kiralamaya hazır.
      icon: tabler:droplet
    - title: İstiflenebilir Depolama
      description: Yerden tasarruf sağlayan tasarım — aynı alanda %40 daha fazla board depolayın.
      icon: tabler:stack
    - title: Renk Kodlu Boyutlar
      description: Personel renk kodlu boyutlandırma ile doğru boardu anında alır.
      icon: tabler:color-swatch
stats:
  title: Operasyon Metrikleri
  stats:
    - title: Panel Devir Hızı
      amount: < 5 dk
    - title: Yıllık Bakım
      amount: ~15 dk/board
    - title: Parça Sevkiyatı
      amount: 48h
    - title: Hata Oranı
      amount: < %0,5
fleet_guide:
  title: Filo Boyutlandırma Rehberi
  subtitle: Kiralama operasyonunuz için filo boyutunu ve gelir potansiyelini tahmin edin.
  tiers:
    - label: Küçük Kiosk
      boards: 15-20
      revenue: $XX,XXX/yıl
    - label: Orta Boy İşletme
      boards: 30-50
      revenue: $XX,XXX/yıl
    - label: Büyük Plaj Kiralama
      boards: 50-100
      revenue: $XXX,XXX/yıl
cta:
  title: Kiralama işinizi ölçeklendirmeye hazır mısınız?
  subtitle: İşletmeniz için kiralama fiyatlarını alın veya tahta modellerini karşılaştırın.
  actions:
    - text: Kiralama Fiyatlarını Alın
      href: /contact?package=rental
      variant: primary
    - text: Board Modellerini Karşılaştırın
      href: /compare
      variant: secondary

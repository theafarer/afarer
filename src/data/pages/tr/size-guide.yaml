how_to_choose:
  title: Doğru Boyutu Seçme
  cards:
    - title: SUP Tahtaları
      description: Uzunluğu kilonuza ve kullanım amacınıza göre seçin. Daha geniş tahtalar (32"+) daha fazla denge sağlar. Daha uzun tahtalar (11-12 ft) turistik gezilerde rotayı daha iyi korur. Daha ağır kürekçiler daha yüksek hacimli tahtalara ihtiyaç duyar.
    - title: Tur SUP'ları
      description: Daha uzun tahtalar (11–12 ft) mesafe kat etmek ve tur için en iyisidir. Daha geniş tahtalar (32"+) daha fazla denge sağlar. Ekipman dahil toplam yük için taşıma kapasitesini kontrol edin.
    - title: Her Amaçlı SUP'lar
      description: Uzunluğu binici ağırlığına ve kullanım amacına göre seçin. Her amaçlı tahtalar rekreasyon, fitness ve yoga için uygundur. Daha küçük tahtalar daha çeviktir.

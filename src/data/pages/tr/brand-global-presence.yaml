features3_markets:
  tagline: Ana Pazarlar
  title: Yerel İhtiyaçlar İçin Bölgesel Uzmanlık<br />
  subtitle: Farklı pazarların farklı yasal gerekliliklere, tercihlere ve kullanım durumlarına sahip olduğunun bilincindeyiz.
  isBeforeContent: false
  columns: 4
  items:
    - title: Avrupa ve İngiltere
      description: CE sertifikalı ürünler. AB pazarlarında SUP tahtalarına yönelik güçlü talep var. Birleşik Krallık distribütörleri hızlı geri dönüşümüzü takdir ediyor.
      icon: tabler:map-pin
    - title: Kuzey Amerika
      description: ABD Sahil Güvenlik onaylı üretim. Hızlı Batı Yakası teslimatı için Montclair, CA'daki ABD deposu. Balıkçılık, kurtarma ve eğlence amaçlı SUP'lara olan talep artıyor.
      icon: tabler:map-pin
    - title: Avustralya ve Okyanusya
      description: SUP tahtaları ve su sporları aksesuarları için güçlü bir pazar. Avustralyalı distribütörler, zorlu güneş koşullarında UV dirençli PVC konstrüksiyonumuza değer veriyor. Asya tesisimizden hızlı teslimat.
      icon: tabler:map-pin
    - title: Orta Doğu
      description: Su macera ekipmanına olan talep artıyor. Ticari sınıf SUP'larımız ve güvenlik ekipmanımız tur operatörleri ve kiralama merkezlerinde popülerdir. Yüksek sıcaklıklı ortamlar için özel konfigürasyonlar.
      icon: tabler:map-pin
features3_distribution:
  tagline: Dağıtım Ağı
  title: Distribütörlerle Ortaklık<br />Dünya Çapında
  subtitle: Yerleşik denizcilik ekipmanı distribütörleri, su sporları markaları ve devlet satın alma kurumlarıyla çalışıyoruz.
  isBeforeContent: false
  columns: 3
  items:
    - title: Ortak Marka Programları
      description: Global su sporları markalarına özel markalı üretim. Tasarımdan üretime ve dropshipping'e kadar her şeyi biz hallediyoruz.
      icon: tabler:building
    - title: Distribütör Ağı
      description: 20'den fazla ülkedeki yetkili distribütörler stok taşıyor ve yerel destek sağlıyor. Yeni distribütör sorularınızı bekliyoruz.
      icon: tabler:users
    - title: Devlet ve Kurumsal
      description: Sahil güvenlik birimlerine, arama kurtarma örgütlerine ve askeri satın alma programlarına doğrudan tedarik. Kurumsal satın alma gerekliliklerine uygunluk.
      icon: tabler:building-community
steps2_logistics:
  title: Küresel Lojistik ve Destek
  subtitle: Fabrikadan varış noktasına kadar tüm tedarik zincirini yönetiyoruz.
  items:
    - title: Nakliye Seçenekleri
      description: Deniz taşımacılığı (FOB Qingdao), acil siparişler için hava taşımacılığı ve numuneler ve yedek parçalar için ekspres kurye.
      icon: tabler:truck-delivery
    - title: ABD Depo
      description: "Kuzey Amerika genelinde hızlı teslimat için stoklar Montclair, Kaliforniya'da tutulmaktadır. Batı Yakası: 2-3 gün, Merkez: 3-4 gün, Doğu Yakası: 4-5 gün."
      icon: tabler:building-warehouse
    - title: Yedek Parçalar
      description: Orijinal afarer yedek parçaları ve sarf malzemeleri yıl boyunca stoklanır. Ortak parçalar 24 saat içinde gönderilir.
      icon: tabler:package
    - title: Teknik Destek
      description: Teknik sorular, onarım önerileri ve yedek parça desteği için mühendislik ekibimizle doğrudan iletişime geçin. 20 yıl önce ürettiğimiz tahtalara destek veriyoruz.
      icon: tabler:headset
cta:
  title: Distribütör olmak ister misiniz?
  subtitle: Dağıtım ağımızı aktif olarak genişletiyoruz. Ortaklık fırsatlarını görüşmek için ihracat ekibimizle iletişime geçin.
  actions:
    - variant: primary
      text: Ortaklık soruşturması
      href: /contact
    - text: Ürün yelpazemizi görüntüleyin
      href: /products

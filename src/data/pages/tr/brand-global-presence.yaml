hero:
  tagline: 'Küresel Varlık'
  title: "Her Kıtada 50'den Fazla Ülkeye Hizmet Veriyoruz<br />"
  subtitle: 'Avrupalı ​​kıyı devriye operatörlerinden Avustralyalı su sporları distribütörlerine ve Orta Doğu kurtarma ekiplerine kadar, daha uzak tekneler dünya çapında denizde.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer global marine manufacturing and distribution
stats:
  title: Global Reach
  stats:
    - title: Countries
      amount: '50+'
    - title: Export Markets
      amount: Europe, Americas, Asia, Middle East, Oceania
    - title: Production
      amount: Qingdao, China
    - title: US Warehouse
      amount: Montclair, CA
features3_markets:
  tagline: Key Markets
  title: 'Yerel İhtiyaçlar İçin Bölgesel Uzmanlık<br />'
  subtitle: 'Farklı pazarların farklı yasal gerekliliklere, tercihlere ve kullanım durumlarına sahip olduğunun bilincindeyiz.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europe & UK
      description: "EN ISO 6185 standartlarını karşılayan CE sertifikalı ürünler. AB pazarlarında SUP'lere, şişme botlara ve SUP board'lara yönelik güçlü talep var. Birleşik Krallık distribütörleri hızlı geri dönüşümüzü takdir ediyor."
      icon: tabler:map-pin
    - title: North America
      description: "ABD Sahil Güvenlik onaylı üretim. Hızlı Batı Yakası teslimatı için Montclair, CA'daki ABD deposu. Balıkçı teknelerine, kurtarma araçlarına ve eğlence amaçlı SUP'lere olan talep artıyor."
      icon: tabler:map-pin
    - title: Australia & Oceania
      description: 'SUP tekneleri ve şişme botlar için güçlü bir pazar. Avustralyalı distribütörler Hypalon teknelerimizin zorlu güneş koşullarındaki UV direncine değer veriyor. Asya tesisimizden hızlı teslimat.'
      icon: tabler:map-pin
    - title: Middle East
      description: "Devriye ve kurtarma botlarına olan talep artıyor. Alüminyum gövdeli SUP'lerimiz sahil güvenlik ve güvenlik operatörleri arasında popülerdir. Yüksek sıcaklıktaki ortamlar için özel konfigürasyonlar."
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Dağıtım Ağı'
  title: 'Distribütörlerle Ortaklık<br />Dünya Çapında'
  subtitle: 'Yerleşik denizcilik ekipmanı distribütörleri, OEM markaları ve devlet satın alma kurumlarıyla çalışıyoruz.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerships
      description: "Global su sporları markalarına özel markalı üretim. Tasarımdan üretime ve dropshipping'e kadar her şeyi biz hallediyoruz."
      icon: tabler:building
    - title: Distributor Network
      description: "20'den fazla ülkedeki yetkili distribütörler stok taşıyor ve yerel destek sağlıyor. Yeni distribütör sorularınızı bekliyoruz."
      icon: tabler:users
    - title: Government & Institutional
      description: 'Sahil güvenlik birimlerine, arama kurtarma örgütlerine ve askeri satın alma programlarına doğrudan tedarik. Kurumsal satın alma gerekliliklerine uygunluk.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Küresel Lojistik ve Destek'
  subtitle: 'Fabrikadan varış noktasına kadar tüm tedarik zincirini yönetiyoruz.'
  items:
    - title: Shipping Options
      description: 'Deniz taşımacılığı (FOB Qingdao), acil siparişler için hava taşımacılığı ve numuneler ve yedek parçalar için ekspres kurye.'
      icon: tabler:truck-delivery
    - title: US Warehouse
      description: "Kuzey Amerika genelinde hızlı teslimat için stoklar Montclair, Kaliforniya'da tutulmaktadır. Batı Yakası: 2-3 gün, Merkez: 3-4 gün, Doğu Yakası: 4-5 gün."
      icon: tabler:building-warehouse
    - title: Spare Parts
      description: 'Orijinal afarer yedek parçaları ve sarf malzemeleri yıl boyunca stoklanır. Ortak parçalar 24 saat içinde gönderilir.'
      icon: tabler:package
    - title: Technical Support
      description: 'Teknik sorular, onarım önerileri ve onarım desteği için mühendislik ekibimizle doğrudan iletişime geçin. 20 yıl önce yaptığımız teknelere destek veriyoruz.'
      icon: tabler:headset
cta:
  title: 'Distribütör olmak ister misiniz?'
  subtitle: 'Dağıtım ağımızı aktif olarak genişletiyoruz. Ortaklık fırsatlarını görüşmek için ihracat ekibimizle iletişime geçin.'
  actions:
    - variant: primary
      text: 'Ortaklık soruşturması'
      href: /contact
    - text: View our product range
      href: /products

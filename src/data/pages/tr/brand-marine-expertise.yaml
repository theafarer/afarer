hero:
  tagline: 'Denizcilik Uzmanlığı'
  title: 'Her Gövdede Onlarca Yıllık Gemi Mühendisliği<br />'
  subtitle: 'afarer, önemli olduğunda performans gösteren deniz taşıtları üretmek için derin malzeme bilimini, hassas üretimi ve gerçek dünya testlerini birleştirir.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer marine engineering and R&D team at work
expertise_materials:
  tagline: 'Malzeme Bilimi'
  title: 'Her Uygulama İçin<br />Doğru Malzemeyi Seçmek'
  subtitle: 'Her biri özel kullanım durumları ve performans gereksinimlerine göre seçilen üç temel malzemeyle çalışıyoruz.'
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: '1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.'
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: 'Üstün kimyasal direnç ve UV stabilitesi. Hypalon tekneleri uygun bakımla 15-20 yıl dayanabilir. Uzun süreli dayanıklılığın kritik olduğu ticari, kurtarma ve askeri uygulamalar için önerilir.'
      icon: tabler:shield
    - title: Fiberglass & Aluminum
      description: "SUP'ler ve devriye botları için derin V fiberglas gövdeler — zorlu koşullarda dalga dilimleme performansı. Maksimum güç ve yük kapasitesi gerektiren ağır hizmet ticari tekneleri için alüminyum gövdeler."
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Üretim Yetenekleri'
  title: 'Her Adımda Hassas Üretim<br />'
  subtitle: "12.000 m²'lik tesisimiz üretimin her aşamasına yönelik özel makinelerle donatılmıştır."
  columns: 2
  items:
    - title: CNC Cutting
      description: 'Bilgisayar kontrollü kesim, minimum atıkla hassas, tekrarlanabilir kumaş paneller sağlar. Her parça tam olarak tasarlandığı gibi uyuyor.'
      icon: tabler:cpu
    - title: High-Frequency Welding
      description: 'Endüstriyel HF kaynağı, ana malzemeden daha güçlü dikişler oluşturur. Tutarlı sıcaklık ve basınç kontrolü, her üretim sürecinde hava geçirmez contalar sağlar.'
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: 'Binlerce polyester iplik, üst ve alt kumaş katmanlarını birbirine bağlayarak sert, sağlam SUP tahtaları ve zeminler için yüksek basınçlı şişirmeye (15-20 PSI) olanak tanır.'
      icon: tabler:building-arch
    - title: Pressure Testing
      description: 'Her şişirilebilir ürün, nakliyeden önce basınç testine tabi tutulur. SUP tüpleri 1,5x nominal basınçta test edilmiştir; orada tutulursa su üzerinde performans gösterecektir.'
      icon: tabler:wind
    - title: Seam Strength Testing
      description: 'Her üretim partisinden rastgele numuneler yıkıcı dikiş mukavemeti testine tabi tutulur. Sonuçlar günlüğe kaydedilir ve belirli üretim işlemlerine göre izlenebilir.'
      icon: tabler:files
    - title: Water Testing
      description: 'Her SUP modeli sertifikasyondan önce deniz denemelerine tabi tutulur. Kıyı koşullarındaki gerçek dünya testleri performansı, kullanımı ve stabiliteyi doğrular.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Tasarım ve Mühendislik'
  title: 'Gerçek Koşullar için Tasarlandı'
  subtitle: 'Tasarım felsefemiz teknenin nasıl kullanılacağıyla başlar ve ardından mühendisliği bu kullanım senaryosu etrafında inşa eder.'
  items:
    - title: Deep-V Hull Design
      description: "Our fiberglass hulls feature calculated deadrise angles optimized for each model's length and intended use. Steeper V for rough-water performance, shallower for stability."
    - title: Multi-Chamber Safety
      description: 'Her teknede 3-7 bağımsız hava odası bulunur. Bir bölme tehlikeye girerse, geri kalan bölmeler tekneyi yüzer ve çalışır durumda tutar.'
    - title: Ergonomic Layout
      description: 'Konsol konumu, boru yüksekliği ve koltuk yerleşimi, ister devriye gezmek, ister balık tutmak veya nakliye yapmak olsun, uzun süreli kullanım sırasında operatörün konforu göz önünde bulundurularak tasarlanmıştır.'
    - title: Custom Configuration
      description: 'Boru renkleri, konsol konfigürasyonu, yakıt kapasitesi, aksesuar bağlantıları — her model, belirli operasyonel gereksinimleri karşılayacak şekilde özelleştirilebilir.'

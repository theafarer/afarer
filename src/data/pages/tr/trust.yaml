features3_certifications:
  title: 'Sertifikalar ve Uyumluluk'
  subtitle: 'Her ürün bağımsız olarak test edilir ve uluslararası standartlara göre sertifikalandırılır.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'CE Sertifikası'
      description: "Tüm afarer SUPlar, kayaklar, şişme botlar ve SUP'ler, rekreasyonel deniz araçları için Avrupa CE güvenlik standardını karşılar. Her ürün, fabrikadan çıkmadan önce basınç, yüzdürme ve yük testinden geçer."
      icon: 'tabler:certificate'
    - title: 'ISO 9001:2015'
      description: "12.000 m²'lik Qingdao tesisimiz bir ISO 9001 kalite yönetim sistemi altında çalışır. Her üretim partisi izlenebilir, belgelenmiş ve denetlenmiştir."
      icon: 'tabler:clipboard-check'
    - title: 'BSCI Sosyal Uyum'
      description: 'BSCI sertifikalıyız, etik iş uygulamaları, güvenli çalışma koşulları ve tedarik zincirimiz genelinde çevresel sorumluluk sağlarız.'
      icon: 'tabler:users'
    - title: 'REACH ve RoHS'
      description: 'Tüm malzemeler —PVC, Hypalon, EVA köpük, yapıştırıcılar —AB REACH ve RoHS düzenlemelerine uygundur. Kısıtlı madde yok, taviz yok.'
      icon: 'tabler:flask'
    - title: 'Malzeme Test Laboratuvarı'
      description: 'Dahili malzeme laboratuvarı, üretimden önce her kumaş partisi için çekme mukavemeti, UV direnci, dikiş bütünlüğü ve aşınma testi yapar.'
      icon: 'tabler:microscope'
    - title: '2 Yıl Garanti'
      description: 'Her afarer ürünü, üretim kusurlarına karşı iki yıl garantilidir. Ürettiğimizin arkasında duruyoruz.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'Müşteri Güveni'

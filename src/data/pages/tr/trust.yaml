features3_certifications:
  title: Sertifikalar ve Uyumluluk
  subtitle: Her ürün bağımsız olarak test edilir ve uluslararası standartlara göre sertifikalandırılır.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Sertifikası
      description: Tüm afarer SUPlar, kayaklar, şişme botlar ve SUP'ler, rekreasyonel deniz araçları için Avrupa CE güvenlik standardını karşılar. Her ürün, fabrikadan çıkmadan önce basınç, yüzdürme ve yük testinden geçer.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: 12.000 m²'lik Qingdao tesisimiz bir ISO 9001 kalite yönetim sistemi altında çalışır. Her üretim partisi izlenebilir, belgelenmiş ve denetlenmiştir.
      icon: tabler:clipboard-check

faqs_sup:
  title: SUP Board SSS
  subtitle: Stand-up paddle boardlarımız hakkında sık sorulan sorular.
  columns: 2
  items:
    - title: Hangi SUP board boyutları mevcuttur?
      description: 9 ft'ten 12 ft'ye kadar SUP boardları sunuyoruz; çok yönlü, tur, yoga ve özel tasarımlar dahil. En çok satan modellerimiz Tropical Breeze (10 ft) ve Ocean Voyager'dır (11 ft).
    - title: Drop-stitch yapısı nedir?
      description: Drop-stitch yapısı, board'un üst ve alt katmanlarını birbirine bağlayan binlerce polyester iplik kullanır ve yüksek hava basıncını (15—0 PSI) tutmasını ve sert, stabil bir platform elde etmesini sağlar. Bu, premium şişme SUPlar için endüstri standardıdır.
    - title: SUP boardlar için ağırlık sınırı nedir?
      description: SUP boardlarımız, modele ve hacme bağlı olarak 150 kg'a kadar destekler. Leviathan Wake board'umuz, daha büyük sürücüler ve yoga kullanımı için tasarlanmış en yüksek kapasiteli modelimizdir.
    - title: Komple SUP paketleri sunuyor musunuz?
      description: Evet. Her SUP board, 3 parçalı alüminyum pala, yüksek basınçlı el pompası, bobin tasma, seyahat sırt çantası ve onarım kiti dahil komple bir paketle gönderilir. Bazı modeller ayrıca çıkarılabilir bir kanat seti içerir.
    - title: SUP boardlarda garanti nedir?
      description: Tüm afarer SUP boardları, normal kullanım altında dikiş hatası, valf kusurları ve malzeme delaminasyonu dahil olmak üzere üretim kusurlarına karşı bir yıllık garantiye sahiptir.
    - title: Bir SUP board'u şişirmek ne kadar sürer?
      description: Verilen el pompasını kullanarak, 15 PSI'a tam şişirme yaklaşık 8—2 dakika sürer. Daha hızlı şişirme için, bir board'u 4 dakikadan kısa sürede şişiren afarer 12V elektrikli pompamızı öneririz.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

warranty_section:
  title: Garanti ve Satış Sonrası Destek
  subtitle: Her ürünün arkasında net garanti koşulları, hızlı talep işleme ve orijinal yedek parçalarla duruyoruz.
  items:
    - title: 2 Yıl Ürün Garantisi
      desc: Tüm afarer ürünleri üretim hatalarına karşı 2 yıl garantiye sahiptir — dikiş hataları, vana kusurları ve normal kullanım altında malzeme tabaklanmaları.
    - title: Ömür Boyu Yedek Parça Desteği
      desc: Tüm modeller için mevcut orijinal yedek parçalar — valfler, onarım kitleri, yüzgeçler, D-halkaları — Üretim sona erdikten sonra kalıpları ve aparatları minimum 5 yıl boyunca muhafaza ediyoruz.
    - title: 48 Saatlik Talep Yanıtı
      desc: Garanti talepleri 48 saat içinde kabul edilir. Onaylanan talepler için yedek tahtalar 10 iş günü içinde sevk edilir.
    - title: Küresel Onarım Ağı
      desc: 15+ ülkede yetkili servis merkezleri. Uzak operasyonlar için saha tamir kitleri mevcut. Küçük hasarlar için kendi kendine tamir rehberleri.
    - title: OEM Müşteri Desteği
      desc: B2B partnerler için özel hesap yöneticileri. Üç aylık iş değerlendirmeleri, envanter planlama ve ortak markalı pazarlama desteği.
    - title: Sertifikasyon Paketi
      desc: Her sevkiyat ile birlikte tam uyumluluk belgeleri sunulmaktadır — CE Beyanı, test raporları, malzeme güvenlik bilgi formu.
      link: /contact

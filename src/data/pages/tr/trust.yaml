      name: 'Marco V.'
      title: 'Tur operatörü, Hırvatistan'
    - content: 'İlk kez alıcı olarak kalite konusunda endişeliydim. Paylaştıkları ISO belgeleri ve test raporları bana tam güven verdi.'
      name: 'James T.'
      title: 'SUP Explorer 11 sahibi, Kanada'
    - content: 'Kıyı devriye birimlerimiz için afarer ile çalışıyoruz. Kalite kontrol süreçleri her partide tutarlı —bu güvenilirlik kritik görev operasyonlarında önemlidir.'
      name: 'Binbaşı Andres'
      title: 'Donanma tedarik, Filipinler'

steps2_manufacturing:
  title: 'Kaliteyi nasıl sağlıyoruz'
  subtitle: 'Hammadde denetiminden son basınç testine kadar —her ürün titiz bir kalite zincirinden geçer.'
  items:
    - title: 'Hammadde Denetimi'
      description: 'Her PVC kumaş rulosu, üretime girmeden önce kalınlık, çekme mukavemeti ve UV direnci açısından test edilir.'
      icon: 'tabler:search'
    - title: 'Süreç İçi KK'
      description: 'Kaynak dikişleri, valf montajları ve oda bağlantıları, montaj sırasında her istasyonda denetlenir.'
      icon: 'tabler:eye'
    - title: 'Basınç Testi'
      description: "Her şişme ürün, nominal PSI'nin 1,5 katına şişirilir ve hava tutma ve dikiş bütünlüğünü doğrulamak için 24 saat bekletilir."
      icon: 'tabler:wind'
    - title: 'Son Denetim'
      description: 'Her birim, sevkiyata onaylanmadan önce kaplama, donanım ve paketleme açısından denetlenir. Parti numuneleri, tahribatlı test için laboratuvarımıza gider.'
      icon: 'tabler:clipboard-check'

faqs_rib:
  title: 'SUP Bot SSS'
  subtitle: 'Sert gövdeli şişme botlarımız hakkında sık sorulan sorular.'
  columns: 2
  items:
    - title: 'afarer hangi boyutlarda SUP botlar sunuyor?'
      description: "2,5 m'den 7,6 m'ye kadar uzanan, kompakt tenderlerden ağır hizmet ticari ve devriye botlarına kadar her şeyi kapsayan 35 SUP modeli sunuyoruz. Her model, birden fazla konfigürasyon seçeneğiyle mevcuttur."
    - title: 'SUP ile geleneksel şişme bot arasındaki fark nedir?'
      description: 'Bir SUP (Sert Gövdeli Şişme Bot), katı bir fiberglas veya alüminyum derin-V gövdeyi şişme Hypalon veya PVC tüplerle birleştirir. Bu size sert bir teknenin stabilitesini ve yük kapasitesini, şişme bir teknenin şok emilimi ve yüzdürme özelliğiyle birleştirir.'
    - title: "afarer SUP'ler ile hangi motorlar uyumludur?"
      description: "SUP'lerimiz, modele bağlı olarak 3 HP'den 250 HP'ye kadar dıştan takma motorları destekler. Her ürün sayfası, maksimum motor gücünü listeler. İdeal uyum için bayinize danışmanızı öneririz."
    - title: "afarer SUP'ler CE sertifikalı mı?"
      description: 'Evet. Tüm rekreasyonel SUP modelleri, rekreasyonel deniz araçları için geçerli Avrupa standartları kapsamında CE sertifikalıdır. Ticari ve devriye modelleri, ek stabilite ve yük gereksinimlerini karşılar.'
    - title: 'SUP botlarda garanti nedir?'
      description: "Tüm afarer SUP'ler, gövde delaminasyonu, tüp dikiş hatası, valf kusurları ve donanım sorunlarını kapsayan, üretim kusurlarına karşı standart bir yıllık garantiyle gelir."
    - title: "afarer SUP'lerin kaç hava odası vardır?"
      description: "SUP'lerimiz, model uzunluğuna bağlı olarak 3 ila 7 bağımsız hava odasına sahiptir. Bu çok odalı tasarım, bir bölme tehlikeye girse bile teknenin su üstünde kalmasını sağlar."

faqs_inflatable:
  title: 'Şişme Bot SSS'
  subtitle: 'Şişme botlarımız, kayaklarımız ve teknelerimiz hakkında sık sorulan sorular.'
  columns: 2
  items:
    - title: 'afarer şişme botlarda hangi malzemeler kullanılır?'
      description: 'Modele bağlı olarak askeri sınıf PVC (1100 denye) ve premium Hypalon/CSM kauçuk kullanıyoruz. Her iki malzeme de UV stabilize edilmiş, aşınmaya dayanıklı ve AB REACH ve RoHS düzenlemelerine uygundur.'
    - title: 'Şişme botlar ne kadar dayanır?'
      description: 'Uygun bakımla, kaliteli bir PVC şişme bot 7—0 yıl dayanırken, Hypalon modeller 15—0 yıl dayanabilir. Düzenli temizlik, UV koruması ve uygun depolama, kullanım ömrünü önemli ölçüde uzatır.'
    - title: 'Bir şişme bot için hangi bakım gereklidir?'
      description: 'Temel bakım, her kullanımdan sonra (özellikle tuzlu suda) tatlı suyla durulama, depolamadan önce kurutma, valf contalarını yıllık kontrol etme ve tüplere UV koruyucu uygulamayı içerir. Kullanılmadığı zamanlarda uzun süre güneşe maruz bırakmaktan kaçının.'
    - title: 'Şişme botlar tuzlu suda kullanılabilir mi?'
      description: 'Evet. Tüm afarer şişme botlar hem tatlı su hem de tuzlu su kullanımı için tasarlanmıştır. Tuzlu suya maruz kaldıktan sonra, bağlantı elemanlarının korozyonunu ve kumaş tuz kristalleşmesini önlemek için tatlı suyla durulamanızı ve iyice kurutmanızı öneririz.'
    - title: 'Bir şişme botu nasıl saklamalıyım?'
      description: 'Saklamadan önce botu tamamen söndürün, temizleyin ve kurutun. Gevşek bir şekilde yuvarlayın (sıkı kıvrımlardan kaçının), doğrudan güneş ışığından uzak, serin ve kuru bir yerde saklayın ve nem çekmeyi önlemek için beton zeminlerden uzak tutun.'
    - title: 'afarer şişme botların ağırlık kapasitesi nedir?'
      description: "Ağırlık kapasiteleri, en küçük modellerimiz için 290 kg'dan daha büyük ticari botlar için 2000 kg'ın üzerine kadar değişir. Her ürün sayfası, belirli modeliniz için maksimum yük değerini listeler."

faqs_sup:
  title: 'SUP Board SSS'
  subtitle: 'Stand-up paddle boardlarımız hakkında sık sorulan sorular.'
  columns: 2
  items:
    - title: 'Hangi SUP board boyutları mevcuttur?'
      description: "9 ft'ten 12 ft'ye kadar SUP boardları sunuyoruz; çok yönlü, tur, yoga ve özel tasarımlar dahil. En çok satan modellerimiz Tropical Breeze (10 ft) ve Ocean Voyager'dır (11 ft)."
    - title: 'Drop-stitch yapısı nedir?'
      description: "Drop-stitch yapısı, board'un üst ve alt katmanlarını birbirine bağlayan binlerce polyester iplik kullanır ve yüksek hava basıncını (15—0 PSI) tutmasını ve sert, stabil bir platform elde etmesini sağlar. Bu, premium şişme SUPlar için endüstri standardıdır."
    - title: 'SUP boardlar için ağırlık sınırı nedir?'
      description: "SUP boardlarımız, modele ve hacme bağlı olarak 150 kg'a kadar destekler. Leviathan Wake board'umuz, daha büyük sürücüler ve yoga kullanımı için tasarlanmış en yüksek kapasiteli modelimizdir."
    - title: 'Komple SUP paketleri sunuyor musunuz?'
      description: 'Evet. Her SUP board, 3 parçalı alüminyum pala, yüksek basınçlı el pompası, bobin tasma, seyahat sırt çantası ve onarım kiti dahil komple bir paketle gönderilir. Bazı modeller ayrıca çıkarılabilir bir kanat seti içerir.'
    - title: 'SUP boardlarda garanti nedir?'
      description: 'Tüm afarer SUP boardları, normal kullanım altında dikiş hatası, valf kusurları ve malzeme delaminasyonu dahil olmak üzere üretim kusurlarına karşı bir yıllık garantiye sahiptir.'
    - title: "Bir SUP board'u şişirmek ne kadar sürer?"
      description: "Verilen el pompasını kullanarak, 15 PSI'a tam şişirme yaklaşık 8—2 dakika sürer. Daha hızlı şişirme için, bir board'u 4 dakikadan kısa sürede şişiren afarer 12V elektrikli pompamızı öneririz."


faqs_sup:
  title: SUP Board SSS
  subtitle: Stand-up paddle boardlarımız hakkında sık sorulan sorular.
  columns: 2
  items:
    - title: Hangi SUP board boyutları mevcuttur?
      description: 9 ft'ten 12 ft'ye kadar SUP boardları sunuyoruz; çok yönlü, tur, yoga ve özel tasarımlar dahil. En çok satan modellerimiz Tropical Breeze (10 ft) ve Ocean Voyager'dır (11 ft).
    - title: Drop-stitch yapısı nedir?
      description: Drop-stitch yapısı, board'un üst ve alt katmanlarını birbirine bağlayan binlerce polyester iplik kullanır ve yüksek hava basıncını (15–20 PSI) tutmasını ve sert, stabil bir platform elde etmesini sağlar. Bu, premium şişme SUPlar için endüstri standardıdır.
    - title: SUP boardlar için ağırlık sınırı nedir?
      description: SUP boardlarımız, modele ve hacme bağlı olarak 150 kg'a kadar destekler. Leviathan Wake board'umuz, daha büyük sürücüler ve yoga kullanımı için tasarlanmış en yüksek kapasiteli modelimizdir.
    - title: Komple SUP paketleri sunuyor musunuz?
      description: Evet. Her SUP board, 3 parçalı alüminyum pala, yüksek basınçlı el pompası, bobin tasma, seyahat sırt çantası ve onarım kiti dahil komple bir paketle gönderilir. Bazı modeller ayrıca çıkarılabilir bir kanat seti içerir.
    - title: SUP boardlarda garanti nedir?
      description: Tüm afarer SUP boardları, normal kullanım altında dikiş hatası, valf kusurları ve malzeme delaminasyonu dahil olmak üzere üretim kusurlarına karşı bir yıllık garantiye sahiptir.
    - title: Bir SUP board'u şişirmek ne kadar sürer?
      description: Verilen el pompasını kullanarak, 15 PSI'a tam şişirme yaklaşık 8–12 dakika sürer. Daha hızlı şişirme için, bir board'u 4 dakikadan kısa sürede şişiren afarer 12V elektrikli pompamızı öneririz.
faqs_materials:
  title: SUP Malzeme ve Bakım SSS
  subtitle: Şişilebilir SUP malzemelerimiz, bakımı ve depolaması hakkında sıkça sorulan sorular.
  columns: 2
  items:
    - title: afarer şişirilebilir SUP'larında hangi malzemeler kullanılmaktadır?
      description: AB REACH ve RoHS düzenlemelerine uygun, UV dayanımlı, aşınmaya karşı dayanıklı askeri sınıf PVC (1100 denier) kullanıyoruz.
    - title: Şişirilebilir SUP'lar ne kadar dayanır?
      description: Düzgün bakıldığında, kaliteli bir PVC şişirilebilir SUP 5–10 yıl dayanır. Düzenli temizleme, UV koruması ve uygun depolama ömrü önemli ölçüde uzatır.
    - title: Bir şişirilebilir SUP için hangi bakım gereklidir?
      description: Temel bakım, her kullanımdan sonra tatlı su ile durulamayı (özellikle tuzlu suda), depolamadan önce kurutmayı, valf contalarını yıllık olarak kontrol etmeyi ve kullanılmadığında uzun süreli güneş maruziyetinden kaçınmayı içerir.
    - title: Şişirilebilir SUP'ler tuzlu suda kullanılabilir mi?
      description: Evet. Tüm afarer şişirilebilir SUP'ları hem tatlı hem de tuzlu su kullanımı için tasarlanmıştır. Tuzlu suya maruz kaldıktan sonra tatlı su ile durulamanızı ve tamamen kurutmanızı öneririz.
    - title: Bir şişirilebilir SUP nasıl saklanır?
      description: Depolamadan önce tahtayı tam olarak havalandırın, temizleyin ve kurulayın. gevşekçe sarın (sık kıvrımlardan kaçının), serin ve kuru bir yerde doğrudan güneş ışığından uzakta saklayın ve nem emilimini önlemek için beton zeminlerden uzak tutun.
    - title: afarer şişirilebilir SUP'ların ağırlık kapasitesi nedir?
      description: Kapasiteler en küçük modellerimiz için 100 kg'dan daha büyük boardlar için 200 kg'ın üzerine kadar değişmektedir. Her ürün sayfası belirli modeliniz için maksimum yük değerini listeler.

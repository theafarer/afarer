      description: BSCI sertifikalıyız, etik iş uygulamaları, güvenli çalışma koşulları ve tedarik zincirimiz genelinde çevresel sorumluluk sağlarız.
      icon: tabler:users
    - title: REACH ve RoHS
      description: Tüm malzemeler —PVC, Hypalon, EVA köpük, yapıştırıcılar —AB REACH ve RoHS düzenlemelerine uygundur. Kısıtlı madde yok, taviz yok.
      icon: tabler:flask
    - title: Malzeme Test Laboratuvarı
      description: Dahili malzeme laboratuvarı, üretimden önce her kumaş partisi için çekme mukavemeti, UV direnci, dikiş bütünlüğü ve aşınma testi yapar.
      icon: tabler:microscope
    - title: 2 Yıl Garanti
      description: Her afarer ürünü, üretim kusurlarına karşı iki yıl garantilidir. Ürettiğimizin arkasında duruyoruz.
      icon: tabler:shield-check

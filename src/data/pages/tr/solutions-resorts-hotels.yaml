meta:
  title: Tatil Köyü SUP Filo Çözümleri | {SITE}
  description: Tatil köyleri ve oteller için eksiksiz SUP filo çözümleri. Ticari sınıf boardlar, özel markalama, personel eğitimi ve 20'den 100+ boarda kadar yatırım getirisi optimizeli paketler.
hero:
  tagline: Tatil Köyleri ve Oteller
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Bozulmamış bir plajda SUP keyfi yapan tatil köyü misafirleri
roi_section:
  title: Tatil Köyü SUP Gelir Modeli
  subtitle: Tek bir yatırımla tatil köylerinin nasıl 50.000$ - 200.000$+ yıllık SUP kira geliri elde ettiğini öğrenin.
  metrics:
    - metric: $50K–C$200K+
      label: Yıllık SUP Geliri
      detail: Tesis başına, filo boyutuna ve doluluk oranına göre
    - metric: 4–6 Ay
      label: Ortalama Geri Ödeme Süresi
      detail: Tüm filo yatırımını bir sezon içinde geri kazanın
    - metric: 40%
      label: Gelir Artışı
      detail: Afarer filolarına geçişten sonra ortalama artış
    - metric: 500+
      label: Board Başına Kiralama Döngüsü
      detail: Günlük kullanım için ticari düzeyde dayanıklılık
packages:
  title: Tatil Köyü Paket Sistemi
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - 12 ay garanti + CE sertifikalı
      revenue: $50K–C$80K yıllık gelir potansiyeli
      cta_text: Başlangıç Paketini Alın
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 50 kürek + 50 can yeleği
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - Personel eğitimi oturumu (çevrimiçi)
        - 12 ay garanti + CE sertifikalı
      revenue: $120K–$200K+ yıllık gelir potansiyeli
      popular: true
      cta_text: Premium Paketi Alın
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - Özel hesap yöneticisi
        - Öncelikli yedek parçalar (24 saat sevkiyat)
        - Custom branding + logo
        - Pazarlama fotoğraf/video paketi
        - 24 ay garanti + CE sertifikalı
      revenue: 200K$+ yıllık gelir potansiyeli
      cta_text: Bayrak Ürün Paketini Edinin
case_study:
  quote: Afarer'e geçtiğimizden beri SUP kira gelirimiz %40 arttı. Panel yenileme maliyetleri %60 düştü. Tam filo yatırımımızı 4 ayda geri kazandık.
  author: Su Aktiviteleri Yöneticisi
  location: 5 yıldızlı tatil köyü, Maldivler
  results:
    - label: Gelir Büyümesi
      value: +40%
    - label: Maliyet Azaltma
      value: '-%60'
    - label: Geri Ödeme Süresi
      value: 4 Ay
features:
  title: Tatil Köyleri Neden Afarer'i Seçiyor
  subtitle: Ticari sınıf dayanıklılık, küresel lojistik ve konukseverliği anlayan bir ortak.
  items:
    - title: 500+ Kiralama Döngüsü
      description: Her tahta tuzlu su, güneş ve kumda 500+ kiralama döngüsüne dayanacak şekilde test edilir.
      icon: tabler:shield-check
    - title: 48 Saat Parça Sevkiyatı
      description: Yedek parçalar 48 saat içinde sevk edilir — kira geliriniz hiç durmaz.
      icon: tabler:truck-delivery
    - title: Özel Markalama
      description: Her boardda özel renkler ve logo ile resort kimliğinize uyum sağlayın.
      icon: tabler:palette
    - title: Personel Eğitimi
      description: Etkinlik ekibiniz için çevrimiçi ve yerinde eğitim programları.
      icon: tabler:school
    - title: Küresel Lojistik
      description: Birleşik nakliye seçenekleriyle 50'den fazla ülkeye gönderim.
      icon: tabler:world
    - title: CE Sertifikalı
      description: Tüm ekipmanlar CE sertifikalı, ISO 9001:2015 — güvenlik ve kalite garanti edilir.
      icon: tabler:certificate

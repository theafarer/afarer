  tagline: Laboratuvar 05
  title: Prototip Atölyesi
  subtitle: CAD modelinden denize hazır tekneye — inşa edilmiş, donatılmış ve kanıtlanmış
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Afarer prototip atölyesi tekne üretimi
intro: >-
  Bir CAD modeli, ne kadar detaylı olursa olsun, bir teknenin suyla buluşana kadar nasıl performans göstereceğini ortaya koyamaz. Bu nedenle Prototip Atölyemiz, mühendislik verilerini mümkün olan en hızlı ve doğrudan fiziksel, deniz seyirine uygun bir tekneye dönüştürmek için tasarlanmıştır. Her
  yeni Afarer modeli — ve her önemli özel üretim — üretim kalıplarına geçmeden önce bu atölyeden geçer.
content_html: >
  <h2>Tasarımın gerçeğe dönüştüğü yer</h2>

  <p>Atölye, gövde, tüpler ve teçhizatın eş zamanlı olarak üretilmesi için tam donanımlıdır. Bu paralel iş akışı yaklaşımı, mühendislik onayından sonra prototip sürelerini endüstri standardı olan 16-20 haftaya kıyasla 8-12 haftaya düşürür. Uygulamanız özel bir çözüm gerektirdiğinde, konseptten su
  üzerindeki doğrulamaya üç aydan kısa sürede ulaşabiliriz.</p>


  <h2>Atölye olanakları</h2>

  <table>
    <thead><tr><th>İstasyon</th><th>Ekipman</th><th>Amaç</th></tr></thead>
    <tbody>
      <tr><td>Gövde üretimi</td><td>Döndürmeli kalıplama fırını (HDPE), TIG kaynak körüğü (alüminyum), el ile lamine kalıplar (fiberglas)</td><td>Üç malzeme türünde de tam ölçekli gövde üretimi</td></tr>
      <tr><td>Tüp birleştirme</td><td>RF kaynak presi, sıcak hava yapıştırma istasyonu, şişirme test tezgahı</td><td>Tüm bölmeler, koniler ve vanalarla birlikte tam boy tüp assembliesinin üretimi</td></tr>
      <tr><td>Teçhizat &amp; donanım</td><td>Motor vinç (500 kg), konsol maket çerçevesi, hidrolik hortum penses, elektrik kablo demeti paneli</td><td>Komple donanım: motor, dümen, kontroller, yakıt sistemi, elektronik, koltuklar</td></tr>
      <tr><td>Enstrüman körüğü</td><td>GPS hız sensörü, yakıt akış ölçer, ivme ölçerler, termokuple dizisi, veri kaydedici</td><td>Deniz denemesi enstrüman kurulumu ve kalibrasyonu</td></tr>
    </tbody>
  </table>


  <h2>Prototip yolculuğu — adım adım</h2>

  <ol>
    <li><strong>Mühendislik devri</strong> — Tasarım paketi (3D model, FEA raporu, malzeme listesi, laminasyon programı) atölye sorumlusu ve proje mühendisi tarafından resmi olarak incelenir. Üretime ilişkin endişeler kesim başlamadan önce tespit edilir ve çözülür.</li>
    <li><strong>Gövde üretimi</strong> — Gövde mühendislik şartnamesine göre üretilir. HDPE için: döndürmeli kalıplama programı Moldex3D simülasyonundan yüklenir. Alüminyum için: CNC ile kesilmiş plakalar onaylı kaynak haritasına göre TIG körüğünde kaynaklanır. Fiberglas için: laminasyon kitabına kat kat uyulur.</li>
    <li><strong>Tüp üretimi</strong> — Kumaş CNC kalıp şablonları kullanılarak kesilir ve ardından tam boy bölmelere RF ile kaynatılır. Her bölme test basıncına kadar şişirilir ve başlangıç stabilizasyonu için 24 saat boyunca bırakılır.</li>
    <li><strong>Birleştirme &amp; teçhizat</strong> — Gövde ve tüpler birleştirilir. Motor asılır, dümen ve kontroller bağlanır, yakıt sistemi kurulur ve tüm elektrik devreleri bağlanarak doğrulanır.</li>
    <li><strong>Statik testler</strong> — Tekne suya girmeden önce şunlara tabi tutulur: yüzdürme kontrolü (tam yük + %30 yedek), yakıt sistemi basınç testi, dümen sistemi tam kilitleme döngü testi, elektrik topraklama süreklilik testi.</li>
    <li><strong>Deniz denemesi programı</strong> — Aşağıda ayrıntıları verilen 20 saatlik su testi.</li>
    <li><strong>Prototip incelemesi</strong> — Mühendislik, üretim ve kalite ekipleriyle resmi bir kabul toplantısı yapılır. Gerekli tasarım değişiklikleri belgelenir ve üretim versiyonuna dahil edilir.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20 Saatlik Deniz Denemesi Programı — Test Takvimi</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 s</span>
        <span class="flex-1">Liman manevrası — düşük hız manevrası, geri vites, borda kontrolü</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 s</span>
        <span class="flex-1">Hız denemesi — GPS ile doğrulanmış maksimum hız, seyir hızı, 3 devir noktasında yakıt tüketimi</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 s</span>
        <span class="flex-1">Dönüş testi — taktik çap, avans ve transfer, 20 kn'da iskele ve sancak</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 s</span>
        <span class="flex-1">Darbe testi — 0,5–1,0 m dalga boyunda tekrarlı geçişler; dümen koltuğu tabanında ivme ölçer</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 s</span>
        <span class="flex-1">Stabilite testi — 4 mürettebat + ekipman ile sancakta statik eğim açısı, dengesiz yük</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 s</span>
        <span class="flex-1">Dayanıklılık çalışması — seyir hızında 3 saat kesintisiz; sıcaklık izleme (motor, yakıt, elektrik)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 s</span>
        <span class="flex-1">Son kontrol — deneme sonrası tüm sistemlerin kontrolü, tüm bağlantı elemanlarının sıkılması/kontrol edilmesi, bulguların belgelenmesi</span>
      </div>
    </div>
  </div>


  <h2>Benzersiz uygulamalar için özel prototipleme</h2>

  <p>Prototip Atölyesi, standart üretim teknelerinin çözemediği sorunları çözdüğümüzdür. Son örnekler şunları içermektedir:</p>

  <ul>
    <li>Arama-kurtarma kuruluşu için 7,8 m RIB;devrilmeye karşı korumalı özel kabin yapısı, entegre sedye montaj noktaları ve pruvaya monte edilen sonar pod'u — tamamı tesisimizde prototiplenmiş, monte edilmiş ve test edilmiştir.</li>
    <li>Hidrografik ölçüm yüklenicisi için 5,2 m şişirilebilir tekne; kısaltılmış transom, çıkarılabilir enstrüman direği ve akış bozulmasını en aza indirmek için tasarlanmış gövde içi transducer cepleri.</li>
    <li>Süperyat için elektrik tahrikli 4,5 m servis teknesi; prototip, müşterinin dört teknelik filo taahhüdünde bulunmasından önce menzil, şarj altyapısı ve gürültü seviyelerini doğrulamak için kullanılmıştır.</li>
  </ul>


  <h2>Prototipleme ekibimiz</h2>

  <p>Atölye, her biri üç temel disiplinden (gövde, tüp, teçhizat) en az ikisinde çapraz eğitim almış sekiz çok yetenekli deniz teknisyeni tarafından işletilmektedir. Ekip lideri, özel tek seferlik üretimlerden seri üretime kadar 16 yıllık deneyime sahip bir usta tekne üreticisidir. Her prototip,
  yapım ve deneme süreci boyunca müşteri için tek temas noktası olarak görev yapan özel bir proje mühendisine atanır.</p>


  <h2>Müşteri katılımı</h2>

  <p>Müşterilerimizi prototip üretimi sırasında önemli dönüm noktalarına katılmaya — özellikle ilk donanım incelemesine ve deniz denemesine — aktif olarak teşvik ediyoruz. Bu aşamalardaki operasyonel geri bildirimleriniz, teknenin üretime girmeden önce ince ayar yapılması için paha biçilmez bir
  değer taşımaktadır. Biz bir boşlukta değil, sizinle birlikte üretiyoruz.</p>

  <p>20 saatlik deniz denemesi ayrıca ekibinizin teknenin kullanımına, sistem yerleşimine ve bakım gereksinimlerine aşina olması için bir fırsat sunar; üretim tekneleri teslim edildiğinde sorunsuz bir hizmete geçiş sağlar.</p>

  subtitle: Pazarınız için sertifika gerekliliklerini, dokümantasyonu ve uyumluluğu görüşmek üzere ekibimizle iletişime geçin.
  actions:
    - variant: primary
      text: Sertifikasyon dokümanlarını isteyin

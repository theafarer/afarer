    alt: afarer Atölyesi
  title: |
    Deniz mühendisliğini <br />
    <span class="text-accent dark:text-white">afarer</span> tarzıyla buluşturuyoruz
  subtitle: 'Bir sahil atölyesinde, tek bir tekne ve sarsılmaz bir inançla başladık: deniz ürünleri, hayat buna bağlıymış gibi tasarlanmalıdır —çünkü öyledir. Bugün 40+ ülkeye teslimat yapıyoruz, ancak her gövde hâlâ şirketi kuran aynı ellerden geçiyor.'

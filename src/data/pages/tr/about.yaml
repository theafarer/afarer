meta:
  title: 'afarer Hakkında — Şişme SUP & Su Sporları Markası | {SITE}'
  description: 'afarer, Aquafarer LLC (ABD) tarafından yönetilen ve Qingdao operasyon ekibimiz tarafından geliştirilen küresel bir şişme SUP ve su sporları markasıdır. Hikayemizi, mühendisliğimizi, sertifikalı kalitemizi ve ülke ortaklık programlarımızı keşfedin.'
  keywords:
    - 'şişme sup markası'
    - 'şişme bot markası'
    - 'su sporları markası'
    - 'ülke sup distribütörü'
    - 'co-branded sup koleksiyonları'

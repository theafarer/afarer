    - title: 'Mühendislik & Kalite Standartları'
      description: 'Her koleksiyon, CE ve ISO 9001 dokümantasyonu, basınç testleri ve çekirdek serimizle aynı QC kontrol noktalarıyla sertifikalı tedarik zincirimizden sevk edilir.'
      icon: 'tabler:certificate'
    - title: 'Bir Marka Varlığına Dönüşür'
      description: "Sınırlı bir co-branded koleksiyon, sudaki kendi hikâyenizi kurar — satış marjı, medya içeriği ve paddle'cıların sezon sezon geri dönmesi için bir neden."
      icon: 'tabler:star'

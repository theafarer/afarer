faqs:
  title: 'Co-Brand — SSS'
  subtitle: "Afarer co-branding'i nasıl çalışır ve OEM ile özel markadan nasıl ayrılır."
  items:
    - title: 'Co-branding, OEM veya özel markayla aynı şey mi?'
      description: 'Hayır. Afarer artık açık bir OEM/özel marka programı yürütmüyor. Co-branded ürünler Afarer ürünleri olarak kalır — tasarlanır, mühendislikle geliştirilir, kalite kontrolünden geçirilir ve Afarer markası tarafından desteklenir. Kimliğiniz bir co-brand olarak görünür, markasız bir üçüncü taraf ürünü olarak değil.'
    - title: 'Bir co-brand projesine kim başlayabilir?'
      description: "Nitelikli su sporu işletmeleri: mevcut ülke ortakları, paddle kulüpleri, tatil köyleri ve oteller, etkinlik düzenleyicileri ve topluluklar. Bize bir proje brief'i gönderin, tasarım çalışması başlamadan önce uygunluğu teyit ederiz."
    - title: 'Co-branding, ülkemdeki distribütörümle çatışır mı?'
      description: 'Hayır. Tek ülke – tek distribütör modeli önceliklidir. Co-brand koleksiyonları, varsa yerel ülke ortağıyla koordine edilir; böylece korunan bir bölgede paralel veya rakip bir marka ortaya çıkmaz.'
    - title: 'Bir co-brand koleksiyonu için minimum sipariş nedir?'
      description: 'Pilot koleksiyonlar 30–50 adetten başlar. Standart koleksiyonlar 50–100 adet; büyük veya çok bölgeli versiyonlar 100+ adettir. Özel geliştirme takvimleri proje başına kararlaştırılır.'
    - title: 'Afarer kalitesi ile ortak katkısının sınırı nedir?'
      description: "Afarer; ürün tasarımını, mühendisliği, malzemeleri, konstrüksiyonu, QC'yi ve garantiyi elinde tutar. Ortaklar; koleksiyon konseptini, adlandırmayı, renkleri, grafik girdisini ve pazara girişi sağlar. Bu, suda tek bir kalite standardı tutar."
    - title: 'Nasıl başvururum?'
      description: 'İşletmeniz, pazarınız ve koleksiyon fikrinizle co-brand başvuru formunu doldurun. Uygunluğu inceler, ardından 3 iş günü içinde bir teklif ve Co-Brand Project Agreement ile yanıt veririz.'

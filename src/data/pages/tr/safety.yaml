hero:
  tagline: Güvenlik
  title: Güvenlik Standartları ve Sertifikasyon
  subtitle: Her afarer ürünü, rekreasyonel ve profesyonel kullanım için sıkı testlerden geçer ve uluslararası güvenlik standartlarını karşılar.

certifications:
  - title: CE Sertifikasyonu
    description: Tüm afarer güvenlik ekipmanları, Avrupa Kişisel Koruyucu Ekipman Yönetmeliği (AB) 2016/425'e göre CE işaretleme gereksinimlerini karşılar.
  - title: 'ISO 12402 Sertifikasyonu'
    description: Can yelekleri,  yüzdürme standartlarını karşılar. Life Vest Classic, 50N+ yüzdürme sağlar; Life Vest Pro, otomatik şişirme ile SOLAS gereksinimlerini karşılar.
  - title: SOLAS Uyumluluğu
    description: Life Vest Pro, açık deniz ve ticari deniz operasyonları için SOLAS (Denizde Can Güvenliği) düzenlemelerine uygundur.


hero:
  tagline: afarer Akademi
  title: Bilgi Merkezi
  subtitle: Her beceri seviyesi için rehberler ve eğitimler —SUP temellerinden ileri kurtarma tekniklerine
categories:
  - level: Başlangıç
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Temelleri
        desc: Ayakta kürek çekmenin temellerini öğrenin —duruş, kürek tekniği ve denge.
        slug: sup-basics
      - title: Kürek Teknikleri
        desc: İleri kürek, geri kürek, çekiş küreği ve alçak destek —temel kürek hareketlerinde ustalaşın.
        slug: paddle-techniques
      - title: Önce Güvenlik
        desc: Hava durumu kontrolü, PFD kullanımı, bağlantı halatı kuralları ve kendi kendine kurtarma dahil temel güvenlik uygulamaları.
        slug: safety-first
  - level: Orta
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Kano Gezisi Temelleri
        desc: Çok saatli gezileri planlama —navigasyon, sıvı alımı, tempo ve rüzgar tahminlerini okuma.
        slug: touring-essentials
      - title: Hava Durumu Okuma
        desc: Deniz tahminlerini yorumlayın, bulut desenlerini tanıyın ve rüzgarın su üzerindeki etkisini anlayın.
        slug: weather-reading
      - title: Navigasyon Temelleri
        desc: Harita okuma, pusula kullanımı, GPS noktaları ve kıyı seyri için rota planlama.
        slug: navigation-basics
      - title: Gelgit Farkındalığı
        desc: Gelgit döngülerini, akıntıları ve bunların hareket zamanlaması ile rota üzerindeki etkilerini anlama.
        slug: tidal-awareness
  - level: İleri
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Çok Günlü Gezi Planlama
        desc: Sefer lojistiği —ekipman seçimi, yemek planlaması, güvenlik protokolleri ve acil durum irtibatları.
        slug: multi-day-trip-planning
      - title: Kurtarma Teknikleri
        desc: Kendi kendine kurtarma, T kurtarma, kanolar için Eskimo kurtarması ve açık suda çekme protokolleri.
        slug: rescue-techniques
      - title: Gece Kürek Çekme
        desc: Karanlıkta navigasyon —aydınlatma gereksinimleri, rota hafızası, grup iletişimi ve tehlike farkındalığı.
        slug: night-paddling
  - level: Bakım
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Temizlik ve Bakım
        desc: Tatlı su ile durulama, UV koruması, küf önleme ve her kullanımdan sonra uygun kurutma teknikleri.
        slug: cleaning-and-care
      - title: Depolama
        desc: Şişme tahta ve botları saklama için en iyi uygulamalar —havasını alma, katlama, sıcaklık kontrolü ve raf ömrü.
        slug: storage-guide
      - title: Onarım Temelleri
        desc: PVC tamir kitleri ve yama teknikleri kullanarak küçük delikleri, sızdıran dikişleri ve valf sorunlarını giderme.
        slug: repair-basics
      - title: Valf Bakımı
        desc: Valf tiplerini tanıma (Halkey-Roberts, Boston, Leafield), kalıntı temizliği ve arızalı milleri değiştirme.
        slug: valve-maintenance
knowledge_center_tagline: Bilgi Merkezi
knowledge_center_title: Deniz Ekipmanları ve Sektör Rehberleri
knowledge_center_subtitle: Denizcilik profesyonelleri, filo işletmecileri ve su sporları meraklıları için uzman bilgileri ve satın alma rehberleri.
knowledge_sections:
  - title: SUP Tahta Bilgisi
    tagline: Ayakta Kürek Çekme Tahtası Rehberleri
    desc: SUP panoları hakkında her şey — tahta tasarımı, malzemeler, boyut seçimi, bakım ve hem eğlence hem de ticari kullanım için satın alma tavsiyeleri.
    guides:
      - title: Doğru SUP Board Nasıl Seçilir
        desc: SUP seçimi için kapsamlı kılavuz — boyut, hacim, malzeme, şekil ve kullanım amacı.
        href: /learn/sup
      - title: Şişme SUP ile Sert SUP Karşılaştırması
        desc: Şişirilebilir SUP vs sert epoksi tahta — taşınabilirlik, dayanıklılık, performans ve değer karşılaştırması.
        href: /compare/inflatable-vs-hardboard
      - title: Çok Amaçlı vs Tur vs Yoga SUP
        desc: Farklı SUP tahta türleri —inşaat standartları, şekiller, boyutlar ve önerilen kullanımlar.
        href: /learn/sup
      - title: Drop-Stitch ve Geleneksel Yapım
        desc: SUP boardları için drop-stitch ve geleneksel üretimi ağırlık, maliyet, dayanıklılık ve sertlik açısından karşılaştırın.
        href: /learn/drop-stitch-core
  - title: Şişirilebilir SUP Rehberi
    tagline: Şişirilebilir SUP Bilgisi
    desc: Şişirilebilir SUP'lar hakkında kapsamlı rehberler — PVC malzemeler, drop-stitch yapım tekniği, güvenlik standartları ve bakım en iyi uygulamaları.
    guides:
      - title: PVC Malzeme Rehberi
        desc: Şişilebilir SUP board üretiminde kullanılan PVC malzemeleri hakkında kesin rehber.
        href: /learn/materials
      - title: Şişirilebilir SUP'lar Nasıl Üretilir
        desc: Üretim süreci —malzeme kesimi, drop-stitch çekirdek yapıştırma, dikiş yapımı, basınç testi ve kalite kontrol.
        href: /learn/inflatable-technology
      - title: SUP Güvenlik Kılavuzu
        desc: Güvenlik standartları, yük kapasitesi, doğru şişirme, çıkış öncesi kontroller ve acil durum prosedürleri.
        href: /learn/water-safety
      - title: SUP Bakımı
        desc: Şişirilebilir SUP panolarının temizliği, depolanması, UV koruması ve onarımı.
        href: /inflatable-sup-maintenance
  - title: SUP Tahta Bilgisi
    tagline: SUP Board Merkezi
    desc: SUP tahta tipleri, malzemeler, üretim yöntemleri, bakım ve güvenlik konularını kapsayan teknik rehberler.
    guides:
      - title: SUP Tahta Türleri
        desc: Çok amaçlı, tur, yoga, spor ve çocuk SUP'ları — farkları öğrenin ve doğru olanı seçin.
        href: /learn/sup
      - title: Drop-Stitch Teknolojisi
        desc: Binlerce iç ipliğin nasıl rijit, yüksek basınçlı Şişilebilir yapılar oluşturduğu.
        href: /learn/drop-stitch-core
      - title: Malzeme Referansı
        desc: PVC denier değerleri, kumaş ağırlıkları, UV dayanımı ve deniz sınıfı malzemeler açıklanıyor.
        href: /learn/materials
      - title: SUP Satın Alma Kılavuzu
        desc: Farklı kullanım alanları ve beceri seviyeleri için farklı SUP panellerini karşılaştırın.
        href: /learn/sup
  - title: SUP Bilgisi
    tagline: Ayakta Kürek Çekme Tahtası Rehberleri
    desc: SUP panoları hakkında her şey — şişirilebilir ve rijit, pano boyutları, malzeme teknolojisi ve tüm beceri seviyeleri için uzman tavsiyeleri.
    guides:
      - title: Şişme SUP ile Sert SUP Karşılaştırması
        desc: iSUP'leri ve sert epoksi boardları taşınabilirlik, dayanıklılık, performans ve değer açısından karşılaştırın.
        href: /learn/sup
      - title: SUP Tahta Boyutları Rehberi
        desc: Uzunluk, genişlik ve kalınlığın denge, hız ve manevra kabiliyetini nasıl etkilediği.
        href: /learn/sup
      - title: SUP Bakımı ve Bakım İpuçları
        desc: Şişirilebilir SUP panoları için temizleme, depolama, UV koruma ve onarım ipuçları.
        href: /inflatable-sup-maintenance
      - title: İlk SUP'unuzu Seçin
        desc: Kilonuz, beceri düzeyiniz ve kullanım amacınıza uygun stand-up paddleboard seçimi için başlangıç kılavuzu.
        href: /learn/sup
  - title: Kiralama Operasyonları Kılavuzu
    tagline: Kiralama İşletmeleri İçin Filo Yönetimi
    desc: Plaj kioskları, su sporları merkezleri ve konaklama tesisleri için SUP kiralama filolarının oluşturulması ve yönetilmesine yönelik kılavuzlar.
    guides:
      - title: Kiralama Filonuzu Oluşturun
        desc: Kiralama operasyonunuz için doğru SUP panolarını nasıl seçersiniz — dayanıklılık, boyutlandırma ve getiri değerlendirmeleri.
        href: /solutions/rental-operators
      - title: Filoi Bakım Rehberi
        desc: Kiralık filolar için tahta ömrünü en üst düzeye çıkarmayı ve duruş sürelerini en aza indirmeyi sağlayan temel bakım uygulamaları.
        href: /solutions/rental-operators
  - title: Tatil Köyü ve Konaklama Rehberi
    tagline: Konuksektörü İçin Su Aktiviteleri
    desc: Tatil köyleri, oteller ve su kenarı destinasyonları için SUP programlarının başlatılması ve yönetilmesine ilişkin rehberler.
    guides:
      - title: Bir Tesis SUP Programı Başlatın
        desc: Misafir SUP etkinlikleri başlatırken dikkate alınması gereken faktörler — filo boyutlandırma, personel ve gelir modelleme.
        href: /solutions/resorts-hotels
      - title: SUP ve Diğer Su Aktiviteleri
        desc: Misafir deneyimi ve operasyonel verimlilik için SUP programlarını diğer su sporlarıyla karşılaştırın.
        href: /learn/sup
  - title: Perakende ve Dağıtım Kılavuzu
    tagline: SUP İş Ortaklıkları
    desc: SUP perakende iş ortağı veya distribütörü olma rehberleri — envanter planlaması, pazar konumlandırması ve büyüme stratejileri.
    guides:
      - title: Bir SUP Perakendecisi Olmak
        desc: Perakende mağazanızda ürün hatlarını nasıl seçeceğinizi, envanteri nasıl yöneteceğinizi ve SUP tahtalarını nasıl pazarlayacağınızı öğrenin.
        href: /solutions/retail-partners
      - title: Ticari Operasyonlar İçin SUP
        desc: Neden şişirilebilir SUP'lar ticari filolar, kiralama işletmeleri ve profesyonel operatörler için çok yönlü bir üründür.
        href: /use-cases/search-and-rescue

hero:
  tagline: 'Vaka Çalışmaları'
  title: 'Gerçek projeler, gerçek sonuçlar<br />—afarer iş başında'
  subtitle: "afarer'in her uygulama için özel deniz çözümleri sunmak üzere dünya çapındaki distribütörler, markalar ve operatörlerle nasıl ortaklık kurduğunu görün."
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'afarer vaka çalışmaları —özel deniz üretim projeleri'
features3_cases:
  tagline: 'Öne çıkan vakalar'
  title: 'Özel çözümler<br />gerçek zorluklar için'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Avrupa Dalış Merkezi Filosu'
      description: 'Bir Akdeniz dalış merkezi zincirine 12 adet SUP 520 dalış konfigürasyonlu tekne tedarik edildi. Özel tank rafları, dalış merdivenleri ve filo markalaması. 60 günde teslim edildi.'
      icon: tabler:lifebuoy
    - title: 'Avustralya Distribütör OEM Programı'
      description: 'Avustralyalı bir su sporları distribütörü için özel marka SUP board serisi geliştirildi. 8 model, özel paketleme ve drop-ship lojistiği. Konseptten ilk sevkiyata 90 gün.'
      icon: tabler:currency-dollar
    - title: 'Orta Doğu Kurtarma Botu Tedariki'
      description: 'Bir Orta Doğu sivil savunma kuruluşuna 20 adet SUP 450 Patrol botu tedarik edildi. Kendi kendine boşalan güverteler, tam navigasyon donanımı ve yüksek görünürlüklü turuncu tüpler. Yerel düzenleyici standartlara uygunluk.'
      icon: tabler:alert-triangle
    - title: 'Avrupa OEM Marka Ortaklığı'
      description: 'Avrupalı bir deniz markasıyla beyaz etiket üretim ortaklığı. 5 SUP modeli, özel markalama, AB pazarı için münhasır dağıtım hakları. Çok yıllı anlaşma.'
      icon: tabler:building
    - title: 'Karayip Tatil Köyü Filosu'
      description: 'Bir Karayip tatil köyü için komple su sporları ekipman paketi: 40 SUP board, 20 kano, 10 şişme bot ve aksesuar. Tüm ekipmanlarda özel tatil köyü markalaması.'
      icon: tabler:beach
    - title: 'ABD Kıyı Devriyesi Sözleşmesi'
      description: 'Bir ABD kıyı güvenlik kurumuna SUP 600 devriye botu tedarik edildi. Çift motor konfigürasyonu, zırhlı konsol seçenekleri ve askeri sınıf elektronik entegrasyonu.'
      icon: tabler:shield
cta:
  title: 'Tartışmak istediğiniz bir proje var mı?'
  subtitle: 'Her afarer ortaklığı bir konuşmayla başlar. Gereksinimlerinizi bize anlatın, bir çözüm geliştirelim.'
  actions:
    - variant: primary
      text: 'Projenize başlayın'
      href: /contact
    - text: 'Yeteneklerimizi görün'
      href: /brand/marine-expertise

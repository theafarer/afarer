features3_cases:
  tagline: Öne çıkan vakalar
  title: Özel çözümler<br />gerçek zorluklar için
  isBeforeContent: false
  columns: 3
  items:
    - title: Avrupa Dalış Merkezi Filosu
      customer: BlueMed Dalış Merkezleri
      country: Yunanistan
      industry: Dalış ve Deniz Turizmi
      challenge: >-
        Yunan adalarında zincir halindeki dalış merkezleri için 12 dalış konfigürlü SUP boarda ihtiyaç vardı. Her board özel ekipman bağlantısı, 8 tüp depolama kapasitesi ve açık sudan dalıcı çıkışı için stabil bir platform gerektiriyordu. Filonun turizm sezonunun başlangıcına 60 gün içinde teslim
        edilmesi gerekiyordu.
      solution: Entegre ekipman rafları, stabil platformlar ve biniş stabilitesi için ekstra geniş drop-stitch yapısına sahip 12 adet SUP Voyager Dive modeli üretildi. Her tahta müşteri filo renkleriyle markalandı. 12 tahtanın tamamı basınç testinden geçirildi ve 55 gün içinde Qingdao'dan sevk edildi.
      product: SUP Voyager Dalış
      results: 12 tahta tam zamanında turizm sezonuna yetiştirildi. Filo 18+ aydır günlük operasyonda ve hiçbir malzeme arızası yaşanmadı. Müşteri ikinci yıl 6 ilave sipariş verdi.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Voyager Dive günlük dalış operasyonlarımızın omurgası olmuştur. Stabilite mükemmeldir ve ekipman yerleşimi güverteyi misafirlerimiz için temiz ve güvenli tutar.
      icon: tabler:lifebuoy
    - title: Avustralya Distribütör OEM Programı
      customer: Pacific Watersports Pty Ltd
      country: Avustralya
      industry: OEM/ODM Üretim
      challenge: >-
        Avustralyalı distribütör, Çinli doğrudan tüketicilere yönelik markalarla rekabet etmek için rekabetçi fiyatlı özel markalı SUP tahtası yelpazesi arıyordu. Başlangıçtan ileri seviyeye kadar 8 benzersiz model gerekli; özel grafikler, özel paketleme ve perakende satış noktalarına doğrudan
        sevkiyat ile.
      solution: >-
        8 SUP modeli geliştirdik (Çok Amaçlı, Tur, Yoga, Çocuk, Spor, Ultra Kompakt, Ultra Stabil, Beyaz Su) ve özel Avustralya grafik paketiyle birlikte sunuluyor. Kurulum videolarına QR kodlarla bağlanan özel perakende ambalaj. Qingdao'dan doğrudan Avustralya perakende mağazalarına gönderim
        yapacak şekilde yapılandırılmış drop-ship lojistik.
      product: Özel SUP Serisi (8 model)
      results: Konseptten ilk sevkiyata 90 gün. İlk sezonda %85 perakende satış oranı. Distribütör ikinci yılında ek SUP modellerini kapsayacak şekilde ortaklığı genişletti.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: afarer 90 günde başlangıç tasarımından perakende satışa kadar eksiksiz bir SUP serisi sundu. Kalite, iki kat fiyatla satan markalarla eşleşiyor.
      icon: tabler:currency-dollar
    - title: Orta Doğu Kurtarma Botu Tedariki
      customer: Ulusal Sivil Savunma Otoritesi
      country: Birleşik Arap Emirlikleri
      industry: Arama ve Kurtarma
      challenge: Sivil savunma kuruluşu, kıyı arama kurtarma, liman güvenliği ve sel müdahalesi için 20 devriye hazırlıklı SUP'a ihtiyaç duydu. Görünür panolar, tam güvenlik ekipmanı ve yerel denizcilik düzenlemelerine uygunluk gerekiyordu.
      solution: >-
        Yöksek görünürlükte turuncu drop-stitch üretim, eksiksiz güvenlik paketleri, SOLAS reflektif bant ve güçlendirilmiş yapıya sahip 20 adet SUP Patrol modeli tedarik edildi. Her board CE sertifikalı olup ilgili standartlara göre test edilmiştir. Dokümantasyon paketi, yerel kayıt için uygunluk
        sertifikalarını içermektedir.
      product: SUP Devriye
      results: Filolar 5 kıyı istasyonuna konuşlandırılmıştır. Tahtalar aşırı sıcaklıkta (45°C+) herhangi bir bozulma olmadan çalışmaktadır. Performans ve dayanıklılık özellikleri aşmıştır.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Patrol, operasyonel gereksinimlerimizi aştı. Aşırı sıcak koşullarda, tahtalar 24 aylık günlük kullanımdan sonra UV bozulma belirtisi göstermemektedir.
      icon: tabler:alert-triangle
    - title: Avrupa OEM Marka Ortaklığı
      customer: North Sea Marine Equipment BV
      country: Hollanda
      industry: OEM/ODM Üretim
      challenge: Köklü Avrupalı denizcilik markası, üretim tesislerine yatırım yapmadan SUP pazarına genişlemek istedi. 5 SUP modeli (9 ft - 12 ft) özel markalama, CE sertifikası ve münhasır AB dağıtım haklarıyla üretebilecek bir white-label ortak aradı.
      solution: >-
        5 SUP modeli için beyaz etiketli üretim anlaşması imzalandı. Her model müşteri logoları ve renk şemasıyla markalandırıldı. Her model için CE sertifikasyon belgeleri hazırlandı. Minimum sipariş taahhütleriyle AB'de münhasır dağıtım hakları verildi. Yerel servis ağı için teknik dokümantasyon
        sağlandı.
      product: Özel SUP Serisi (5 model)
      results: Çok yıllık anlaşma imzalandı. İlk 50 ünitelik üretim partisi 75 gün içinde sevk edildi. Marka büyük bir fuarda olumlu bayi kabulüyle lanse edildi.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: afarer ile çalışarak bir fabrika kurmadan SUP pazarına girdik —CE sertifikası ve bayi destek dokümantasyonu ile birlikte anahtar teslim bir çözüm sundular.
      icon: tabler:building
    - title: Karayip Tatil Köyü Filosu
      customer: Paradise Island Resorts Ltd
      country: Bahamalar
      industry: Deniz Turizmi ve Konaklama
      challenge: >-
        Lüks tatil köyü, misafir etkinlikleri için eksiksiz bir su sporları ekipmanı filosuna ihtiyaç duyuyordu: rehberli turlar için 40 SUP tahtası, lagün keşfi için ek 20 SUP, misafir gezileri için 10 SUP tahtası ve aksesuarlar. Tüm ekipmanların özel tatil köyü markalaması yapılması ve yoğun
        turizm sezonundan önce teslim edilmesi gerekiyordu.
      solution: >-
        Tam SUP paketi üretildi: 40 SUP Voyager tahtası (Çok Amaçlı model), 20 SUP Explorer tahtası, 10 SUP Touring tahtası, ayrıca can yelekleri, kürekler, pompalar ve onarım kitleri. Tüm ekipman tatil köyü logosu ve tropikal renk şemasıyla basıldı. Tam envanter manifestosu ile konteynerli
        sevkiyat.
      product: Tam SUP Paketi (70+ birim)
      results: Filolar yoğun sezondan 6 hafta önce teslim edildi. Su sporları aktivitelerinde misafir memnuniyet puanları yıllık %40 arttı. Ekipman yalnızca rutin bakım ile 3 sezon dayandı.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Kapsamlı paket yaklaşımı, ihtiyacımız olan her şeyi tek bir sevkiyatta almamızı sağladı — tahtalar ve aksesuarların tamamı markalı ve misafirlerin kullanımına hazır. Misafirlerimiz ekipman kalitesinden çok memnun.
      icon: tabler:beach
    - title: ABD Kıyı Devriyesi Sözleşmesi
      customer: Atlantik Kıyı Güvenlik Kurumu
      country: Amerika Birleşik Devletleri
      industry: Deniz Güvenliği ve Hukuk Uygulama
      challenge: ABD kıyı güvenlik birimi açık deniz operasyonları için ağır hizmet tipi devriye SUP'ları talep etti. Askeri standartlara uygun ekipman ve ABD Sahil Güvenlik düzenlemelerine uyumlu yüksek performanslı tahtalara ihtiyaç duyuldu.
      solution: Güçlendirilmiş drop-stitch yapısı, yüksek görünürlük renk şemaları, şifreli iletişim donanımı montajları ve entegre ekipman bağlantı noktaları ile tasarlanmış SUP Patrol. Ağır hizmet operasyonları için güçlendirilmiş panolar. USCG uyumluluk belgeleri sağlanmıştır.
      product: SUP Devriye
      results: Kurum, ilk 12 ayda %95 görev hazırlık oranı bildirdi. 8 adet için ek sipariş verildi.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Devriye, açık deniz operasyonları için mürettebatımıza gerekli performansı sağlar. Güçlendirilmiş yapı, kumandadan ödün vermeden kritik dayanıklılık sağlar.
      icon: tabler:shield

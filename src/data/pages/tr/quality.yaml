hero:
  tagline: Kalite Güvencesi
  title: Performans ve Kalite Testleri
  subtitle: Her afarer şişme bot ve SUP, sevkiyattan önce Ar-Ge Merkezimizde sıkı performans ve kalite testlerinden geçer. Kapsamlı testlerimiz, ürün mükemmelliğinin somut kanıtını sağlar.
stats:
  - value: 100%
    label: Basınç testi yapılan birimler
  - value: '8'
    label: Test protokolü
  - value: ISO 9001
    label: Kalite sertifikası
  - value: 3 Yıl
    label: Sınırlı garanti
tests:
  - title: Basınç Testi
    description: Hava odaları, önerilen çalışma limitlerinin üzerinde basınca uzun süre maruz bırakılır. Bu, malzeme ve dikişlerin sızdırmazlığını ve yapısal bütünlüğünü doğrular, ürünün amaçlanan kullanıma ve olası aşırı şişirmeye arıza veya sızıntı olmadan dayanmasını sağlar.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: Darbe Testi
    description: Ürünler, çeşitli ağırlık ve açılarda kontrollü darbelere maruz bırakılır. Sudan engellerle çarpışmalardan kaynaklanan delinme, yırtılma ve hasarlara karşı malzeme direnci değerlendirilir, dayanıklılık ve uzun ömür kanıtlanır.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: UV Direnci Testi
    description: Hava odaları, önerilen çalışma limitlerinin üzerinde basınca uzun süre maruz bırakılır. Bu, malzeme ve dikişlerin sızdırmazlığını ve yapısal bütünlüğünü doğrular, ürünün amaçlanan kullanıma ve olası aşırı şişirmeye arıza veya sızıntı olmadan dayanmasını sağlar.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: Aşınma Direnci Testi
    description: Malzeme numuneleri, kontrollü basınç altında belirli sayıda döngü boyunca aşındırıcı yüzeylere sürtülür. Bu, malzemenin tekrarlı kullanım, kum, kaya veya diğer yüzeylerle temastan kaynaklanan aşınmaya dayanma yeteneğini ölçerek uzun vadeli dayanıklılığı sağlar.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: Düşük Sıcaklık Performans Testi
    description: Ürünler, soğuk ortamlarda test edilerek farklı sıcaklık koşullarında işlevsellik ve dayanıklılık değerlendirilir, daha soğuk sularda sertleşme veya çatlamayı önler. Kış kullanımı veya yüksek enlemler için tasarlanan botlar için gereklidir.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: Yüzdürme ve Yük Kapasitesi Testi
    description: Ürünler, maksimum yük kapasitesini belirlemek ve kullanıcılar ile ekipman için güvenli destek sağlamak amacıyla farklı yüklerle test edilir. Her model, satışa sunulmadan önce doğrulanmış bir yük kapasitesine sahiptir.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: Manevra Kabiliyeti Testi
    description: Ürünler, kürek veya motor kontrolüne tepki açısından test edilir, dönüş yarıçapı ve kullanım kolaylığı değerlendirilir. Suda yapılan denemeler, gerçek kullanımın tasarım şartnamelerine uygun olduğunu onaylar.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: Su Geçirmezlik Testi
    description: Tamamen monte edilmiş ürünler, dikişlerden, vanalardan veya malzemelerden herhangi bir sızıntı olup olmadığını kontrol etmek için suya batırılır veya suya maruz bırakılır. Her bot, sevkiyattan önce zorunlu su geçirmezlik kontrolünden geçer.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
testing_section:
  tagline: Test Prosedürleri
  title: Her Aşamada Sıkı Testler
commitment:
  title: Taahhüdümüz
  body: Bu sıkı test prosedürleri sayesinde {SITE} müşterilerine, şişme SUP ve botlarımızın yalnızca yüksek performanslı değil, aynı zamanda yıllarca dayanacak şekilde üretildiğine dair güvence verir —sayısız keyifli ve güvenli su macerasını garanti eder. Kalite laboratuvarımız üretimden bağımsız olarak çalışır ve doğrudan yönetim kuruluna rapor verir.
  cta: Test Dokümanlarını Talep Edin
  cta_link: /contact

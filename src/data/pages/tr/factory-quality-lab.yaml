meta:
  title: 'Kalite Laboratuvarı — Test ve kalite kontrol | {SITE}'
  description: "afarer'da ISO 9001 süreçleriyle bağımsız kalite laboratuvarı: şişme SUP tahtalarının ve teknelerinin kalitesini garanti etmek için her birim sevkiyat öncesi test edilir."
  keywords:
    - 'SUP kalite kontrolü'
    - 'paddle board test laboratuvarı'
    - 'ISO 9001 SUP fabrikası'
    - 'şişme SUP kalitesi'
hero:
  tagline: Kalite Kontrol Laboratuvarı
  title: Test Laboratuvarı ve Kalite Güvencesi
  subtitle: ISO 9001 süreçlerine sahip bağımsız kalite laboratuvarı — her ünite sevkiyattan önce test edilir
intro: afarer, üretimin bağımsız olarak çalışan özel bir kalite kontrol laboratuvarı işletmektedir. Her hammadde partisi ve her bitmiş tekne, serbest bırakılmadan önce belgelenmiş kontrol protokollerinden geçer. Kalite kontrol ekibimiz doğrudan yönetime rapor vererek tarafsız kalite kararları sağlar.
highlights:
  - value: 100%
    label: Basınç testinden geçmiş birimler
    detail: Her oda, her tekne
  - value: 24–48 h
    label: Hava tutma test süresi
    detail: 1,25× nominal basınçta
  - value: '&lt;%5'
    label: İzin verilen maksimum basınç düşüşü
    detail: 24–48 saat bekleme süresi
  - value: AQL 2.5
    label: Büyük kusur eşiği
    detail: ISO 2859 örnekleme standardına göre
test_procedures:
  - title: Hammadde Kontrolü
    description: Gelen her PVC, Hypalon, drop-stitch kumaş ve donanım partisi kabul edilmeden önce test edilir. Çekme dayanımı (ASTM D751), yırtılma direnci (ISO 4674) ve UV direnci doğrulanır. Uygun olmayan malzemeler karantinaya alınır ve iade edilir.
    standards:
      - ASTM D751 (çekme)
      - ISO 4674 (yırtılma)
      - ISO 4892 (UV)
  - title: İşlem İçi Kalite Kontrol Kontrol Noktaları
    description: Üretim operatörleri her aşamada öz-denetim gerçekleştirir. Kalite kontrol denetçileri boyunca rastgele örneklem yapar. Kaynak soyulma testleri her 50 birimde yapılır. Boyutsal kontroller her 20. panelde gerçekleşir.
    standards:
      - ASTM D751 (soyma)
      - Dahili 100 maddelik kontrol listesi
      - ISO 2859 örnekleme
  - title: 24–48 Saat Hava Tutma Testi
    description: Her tüp odası nominal basıncın %125'ine şişirilir ve 24–48 saat boyunca tutulur. Sıcaklık kompanzasyonlu basınç sensörleri sürekli kayıt yapar. %5'ten fazla basınç düşüşü yaşayan her oda otomatik parti yeniden denetimini tetikler.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Yük ve Denge Testi
    description: Tamamlanan tekneler, stabilite, serbest borda ve manevra kabiliyeti için azami kapasitede test edilir. Her tekne nihai muayene onayından önce su testinden geçirilir.
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: Üniversal test makinesi (çekme)
    spec: 5 kN, ASTM D751 uyumlu
  - name: Pressure Decay Tester
    spec: Çok kanallı, 0–50 psi, veri kaydı
  - name: UV Weathering Chamber
    spec: ISO 4892, 1.000 saat döngü
  - name: Dijital kalınlık ölçer
    spec: 0,01 mm çözünürlük
  - name: Peel Tester (weld)
    spec: Motorlu, 50 N kapasiteli
  - name: Temperature Chamber
    spec: '-40 °C ile +100 °C'
  - name: Leak Detection Tank
    spec: 6 m × 2 m, aydınlatmalı

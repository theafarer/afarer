hero_text:
  tagline: Resources
  title: 'İndirme Merkezi ve Satın Alma Kılavuzları'
  subtitle: 'Bilgili satın alma kararları vermenize yardımcı olacak ürün kataloglarına, OEM kılavuzlarına, alıcı kontrol listelerine ve teknik belgelere erişin.'
features3_downloads:
  tagline: Downloads
  title: 'Ürün Belgeleri<br />& Alıcı Kaynakları'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'SUP tekneleri, şişme botlar, SUP tahtaları, kanolar ve aksesuarları içeren eksiksiz ürün yelpazesi. Özellikler, yapılandırmalar ve seçenekler. PDF formatı.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'OEM/ODM ortaklıkları hakkında bilmeniz gereken her şey: sürece genel bakış, minimum sipariş miktarları, özelleştirme seçenekleri, kalite kontrol ve nakliye.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'Doğru SUP nasıl seçilir: gövde malzemeleri, boru malzemeleri, motor seçimi, boyut hususları ve farklı uygulamalar için konfigürasyon seçenekleri.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'Bir SUP panosu üreticisini seçerken dikkate alınması gereken önemli noktalar: kalite göstergeleri, sertifika gereklilikleri, MOQ hususları ve fabrika denetiminde nelere dikkat edilmesi gerektiği.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC ve Hypalon: farklı denizcilik uygulamaları için dayanıklılık, UV direnci, kullanım ömrü, onarım seçenekleri ve maliyet hususlarının karşılaştırılması.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'Ürün özeti şablonumuzu indirin. Gereksinimlerinizi doldurun ve aynı hafta içinde fiyat teklifi ve fizibilite değerlendirmesi için bize gönderin.'
      icon: tabler:template
faqs:
  title: 'Sıkça Sorulan Sorular'
  subtitle: 'Ürünlerimiz, üretim sürecimiz ve ortaklık modelimiz hakkında sık sorulan sorular.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ ürün kategorisine göre değişir. SUP tekneleri genellikle model başına 10 üniteden başlar. 50 üniteden oluşan SUP panoları. Ürüne özel MOQ bilgileri için satış ekibimizle iletişime geçin.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Evet. afarer, seri üretim öncesi değerlendirme için numune üretimi sağlar. Numune maliyetleri pazarlığa tabidir ve genellikle ilk üretim siparişine yansıtılır.'
      icon: tabler:package
    - title: What payment terms are available?
      description: "Standart koşullar siparişte %30 depozito, sevkiyattan önce %70'dir. Nitelikli müşteriler için LC koşulları mevcuttur. Düzenlemeleri görüşmek üzere finans ekibimizle iletişime geçin."
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Tipik teslimat süreleri: SUP tekneleri 30-45 gün, SUP boardları 20-30 gün, şişme botlar 25-35 gün. Özel geliştirme, prototip oluşturma için 15-30 gün ekler.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'AB pazarları için CE sertifikası, ABD Sahil Güvenlik onaylı üretim, ISO kalite sistemi, BSCI uyumluluğu ve REACH malzeme uyumluluğu.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Evet. Logonuz, renkleriniz ve marka kimliğiniz ile özel ambalajlar sağlıyoruz. Özel paketleme için MOQ ürün kategorisine bağlıdır.'
      icon: tabler:color-swatch
cta:
  title: 'Doğru kaynağı bulma konusunda yardıma mı ihtiyacınız var?'
  subtitle: 'Ürün seçimi, OEM ortaklıkları veya teknik özellikler konusunda kişiselleştirilmiş rehberlik için ekibimizle iletişime geçin.'
  actions:
    - variant: primary
      text: 'Ekibimizle iletişime geçin'
      href: /contact

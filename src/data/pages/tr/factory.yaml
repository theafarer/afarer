hero:
  tagline: Fabrika
  title: Fabrika ve Üretim
  subtitle: 12.000 m2 entegre üretim —hammaddeden bitmiş bota
intro:
  - "**Qingdao Vatrad Group Co., Ltd.**'nin bir fabrika markası olan afarer, üretimin her aşamasını kontrol eder —ham PVC ve fiberglas malzemelerin gelişinden bitmiş botun sevkiyat öncesi son denetimine kadar. Qingdao Ekonomik Kalkınma Bölgesi'ndeki üretim tesisimiz 12.000 metrekare alan kaplar ve PVC kesim, boru ısı yalıtımı, fiberglas SUP gövde üretimi, SUP dijital baskı, son montaj ve kalite testi için özel atölyelere ev sahipliği yapar."
  - Tasarım, mühendislik, prototipleme, üretim ve testi tek çatı altında birleştirerek, sözleşmeli üretimin verimsizliklerini ortadan kaldırır ve yapı kalitesi, malzeme seçimi ve teslimat süreleri üzerinde doğrudan kontrol sahibi oluruz. Atölyemizden çıkan her bot, bizim insanlarımız tarafından, bizim ekipmanımızda, bizim standartlarımıza göre üretilir.

material_traceability:
  tagline: İzlenebilirlik
  title: Malzeme İzleme ve Parti Kontrolü
  description: Her hammadde partisi ERP sistemimizde benzersiz bir parti numarası ile tanımlanır. Girişi üretime ve bitmiş ürüne kadar her teknenin malzeme listesi orijinal tedarikçi partisine bağlanır. Bu, herhangi bir kalite veya uyumluluk sorgusu için tam geriye dönük izlenebilirlik sağlar.
  system: Özel ERP (Qingdao Vatrad Group dahili sistemi) + her iş emrine fizik parti etiketleri
  coverage: Üretim malzemelerinin %100'ü —PVC, Hypalon, drop-stitch kumaş, yapıştırıcılar, valfler, donanım, ambalaj
  records_retained: 10 yıl (CE 2013/53/AB gereksinimine göre)
  suppliers:
    - material: Deniz sınıfı PVC
      source: Çinli ve Koreli tedarikçiler
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japon tedarikçi
      certified: ISO 9001, REACH
    - material: Drop-stitch kumaş
      source: Kendi bünyemizde dokuma + harici ortak
      certified: İç kalite kontrol + tedarikçi ISO 9001
    - material: Valfler ve Aksesuarlar
      source: Çinli OEM tedarikçiler
      certified: ISO 9001, parti başına malzeme sertifikaları

workshops_section:
  tagline: Atölyeler
  title: Üretim Atölyeleri
  workshops:
    - title: PVC Kesim ve Malzeme Hazırlığı
      description: Otomatik CNC kesim makineleri, PVC, Hypalon ve drop-stitch kumaşları milimetre altı hassasiyetle işler. Bilgisayar destekli optimizasyon, malzeme israfını en aza indirir ve her panelin kaynak öncesinde boyutsal spesifikasyonunu karşılamasını sağlar.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Boru Kaynağı ve Isı Yalıtımı
      description: Isı yalıtım makineleri ve RF dielektrik preslerle donatılmış özel kaynak atölyesi. Sıcak hava ısı yalıtıcıları, PVC tüp odalarını birleştirir ve kaynaştırırken, RF kaynakları ISO 6185 gereksinimlerini aşan yüksek mukavemetli hava geçirmez dikişler üretir.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: SUP Gövde Üretimi —Fiberglas
      description: SUP bot gövdeleri, polyester ve vinilester reçine sistemleri ile el yatırmalı fiberglas kalıplama kullanılarak üretilir. Her katman, tutarlı kalite için elle yuvarlanır ve vakum torbalanır. Jelkot sprey kabini, yüksek parlaklıkta, UV'ye dayanıklı bir deniz kaplaması sağlar.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: SUP Baskı ve Dekorasyon
      description: SUP boardları, tam renkli grafikler için dijital baskı  ve logolar ve tekrar eden desenler için serigrafi  kullanılarak dekore edilir. Dijital yazıcılar fotoğraf kalitesinde güverte tasarımları üretirken, serigrafi dayanıklı, canlı marka işaretleri sunar.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Son Montaj ve Donanım
      description: Fiberglas gövdelerin ve PVC tüplerin birleştirildiği, motorların monte edildiği, direksiyon ve kontrollerin bağlandığı ve elektrik sistemlerinin kablolandığı montaj hattı. Her bot, ekip lideri tarafından imzalanan 100 puanlık bir montaj kontrol listesini takip eder.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Kalite Testi ve Denetim
      description: Tamamlanan her bot, sevkiyattan önce zorunlu hava tutma testi, dikiş soyulma doğrulaması ve tam sistem kontrolünden geçer. Kalite laboratuvarımız üretimden bağımsız olarak çalışır ve doğrudan yönetime rapor verir.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


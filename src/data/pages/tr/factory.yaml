qc_section:
  tagline: Kalite Kontrol
  title: Test ve Kalite Güvence Süreci
  subtitle: Her bot, sevkiyattan önce zorunlu testlerden geçer. Kalite laboratuvarımız üretimden bağımsız olarak çalışır ve doğrudan yönetime rapor verir.
  steps:
    - step: '1'
      title: Hammadde Denetimi
      desc: PVC, Hypalon ve drop-stitch kumaşlar, herhangi bir parti üretime girmeden önce çekme testi (), yırtılma yayılması ve UV direnci doğrulamasından geçer.
    - step: '2'
      title: 48 Saat Hava Tutma Testi
      desc: Her tüp odası, nominal basıncın %125'ine kadar şişirilir ve 48 saat bekletilir. %5'in altındaki basınç düşüşü, otomatik reddetme ve dikiş yeniden incelemesini tetikler.
    - step: '3'
      title: Yük ve Denge Testi
      desc: Tamamlanan botlar, maksimum nominal kapasiteye kadar yüklenir ve stabilite, serbest bordo ve kullanım açısından test edilir. Her bot, son denetimden önce suda test edilir.

oem_section:
  tagline: OEM Projeleri
  title: Marka ve OEM Ortaklığı Vaka Çalışmaları
  subtitle: Kavramdan konteynere —küresel markaların şişme deniz aracı hatlarını başlatmasına ve ölçeklendirmesine nasıl yardımcı olduğumuz.
  cases:
    - challenge: Avrupalı bir açık hava perakendecisi, benzersiz güverte grafiklerine, çevre dostu PVC'ye ve perakendeye hazır ambalaja sahip özel etiketli bir SUP hattına ihtiyaç duyuyordu —tamamı 60 günde teslim edilecek.
      solution: Özel dijital baskı dosyaları geliştirdik, REACH uyumlu PVC tedarik ettik ve tasarım ekibini Qingdao fabrikamıza yerleştirerek numune sürecini 3 turdan 1 tura indirdik.
      result: İmzalı siparişten FOB'a 55 gün. 4 SKU'da 2.400 adet. İlk konteyner gelmeden tekrar sipariş verildi.
    - challenge: ABD merkezli bir su sporları start-up'ı, özel gövde şekline, ortak markalı ambalaja ve perakende yerleşimi için BSCI sertifikasına sahip yüksek performanslı bir drop-stitch SUP ihtiyacı duyuyordu.
      solution: Mevcut drop-stitch SUP kalıbını değiştirilmiş rocker profiliyle uyarladık, ortak markalı ambalaj sanatı geliştirdik ve tam BSCI denetim belgeleri sağladık.
      result: 3 büyük ABD açık hava zincirinde başarıyla listelendi. İlk yılda %98 satış oranıyla 5.000+ adet.
    - challenge: Avustralyalı bir distribütör, özel tüp renklerine, Hypalon yükseltme seçeneğine ve Avustralya Standardı AS 1799'a uygunluğa sahip CE sertifikalı bir SUP serisine ihtiyaç duyuyordu.
      solution: 4 tüp renk varyantı ile ön üretim numuneleri ürettik, Japon tedarikçiden CSM Hypalon tedarik ettik ve üçüncü taraf AS 1799 uyumluluk testini koordine ettik.
      result: AU/NZ pazarında 3 modelli SUP serisi piyasaya sürüldü. Ardından 12 devriye SUP'si için devlet ihalesi kazanıldı.

faq_section:
  tagline: SSS
  title: B2B ve OEM Sıkça Sorulan Sorular
  questions:
    - q: OEM şişme SUP boardları için minimum sipariş miktarı (MOQ) nedir?
      a: Standart OEM modelleri için MOQ 5—0 adetten başlar. Özel kalıplar ve özel etiket projeleri, karmaşıklığa bağlı olarak minimum 200 adet gerektirir. Yeni marka lansmanları için deneme siparişleri ve numune çalışmaları mevcuttur.
    - q: afarer BSCI sertifikasına sahip mi?
      a: Evet. Fabrikamız geçerli BSCI sosyal uyumluluk sertifikasına sahiptir (denetim raporu talep üzerine mevcuttur). Ayrıca kalite yönetimi için ISO 9001 ve tüm ürünler CE CE  sertifikasına sahiptir. Her OEM sevkiyatıyla birlikte REACH ve RoHS uyumluluk belgeleri sağlanır.
    - q: Bir OEM siparişi için tipik teslim süresi nedir?
      a: Evet. Fabrikamız geçerli BSCI sosyal uyumluluk sertifikasına sahiptir (denetim raporu talep üzerine mevcuttur). Ayrıca kalite yönetimi için ISO 9001 ve tüm ürünler CE CE  sertifikasına sahiptir. Her OEM sevkiyatıyla birlikte REACH ve RoHS uyumluluk belgeleri sağlanır.
    - q: FOB Qingdao veya CIF olarak limanımıza gönderebilir misiniz?
      a: Evet. FOB Qingdao, büyük küresel limanlara CIF ve nitelikli ortaklar için DDP olarak gönderim yapıyoruz. Lojistik ekibimiz konteyner rezervasyonu, ihracat belgeleri ve gümrük işlemlerini yönetir. AB, ABD, AU ve Asya pazarlarında 50'den fazla ülkeye gönderim yapıyoruz.

b2b_moq: 'Standart MOQ: Model başına 5—0 adet (SUP/SUP/drop-stitch). SUP MOQ: 2— adet. Yeni ortaklıklar için deneme siparişleri kabul edilir.'


qc_section:
  tagline: Kalite Kontrol
  title: Test ve Kalite Güvence Süreci
  subtitle: Her bot, sevkiyattan önce zorunlu testlerden geçer. Kalite laboratuvarımız üretimden bağımsız olarak çalışır ve doğrudan yönetime rapor verir.
  steps:
    - step: '1'
      title: Hammadde Denetimi
      desc: PVC, Hypalon ve drop-stitch kumaşlar, herhangi bir parti üretime girmeden önce çekme testi (), yırtılma yayılması ve UV direnci doğrulamasından geçer.
    - step: '2'
      title: 48 Saat Hava Tutma Testi
      desc: Her tüp odası, nominal basıncın %125'ine kadar şişirilir ve 48 saat bekletilir. %5'in altındaki basınç düşüşü, otomatik reddetme ve dikiş yeniden incelemesini tetikler.
    - step: '3'
      title: Yük ve Denge Testi
      desc: Tamamlanan botlar, maksimum nominal kapasiteye kadar yüklenir ve stabilite, serbest bordo ve kullanım açısından test edilir. Her bot, son denetimden önce suda test edilir.
oem_section:
  tagline: OEM Projeleri
  title: Marka ve OEM Ortaklığı Vaka Çalışmaları
  subtitle: Kavramdan konteynere —küresel markaların şişme deniz aracı hatlarını başlatmasına ve ölçeklendirmesine nasıl yardımcı olduğumuz.
  cases:
    - challenge: Avrupalı bir açık hava perakendecisi, benzersiz güverte grafiklerine, çevre dostu PVC'ye ve perakendeye hazır ambalaja sahip özel etiketli bir SUP hattına ihtiyaç duyuyordu —tamamı 60 günde teslim edilecek.
      solution: Özel dijital baskı dosyaları geliştirdik, REACH uyumlu PVC tedarik ettik ve tasarım ekibini Qingdao fabrikamıza yerleştirerek numune sürecini 3 turdan 1 tura indirdik.
      result: İmzalı siparişten FOB'a 55 gün. 4 SKU'da 2.400 adet. İlk konteyner gelmeden tekrar sipariş verildi.
    - challenge: ABD merkezli bir su sporları start-up'ı, özel gövde şekline, ortak markalı ambalaja ve perakende yerleşimi için BSCI sertifikasına sahip yüksek performanslı bir drop-stitch SUP ihtiyacı duyuyordu.
      solution: Mevcut drop-stitch SUP kalıbını değiştirilmiş rocker profiliyle uyarladık, ortak markalı ambalaj sanatı geliştirdik ve tam BSCI denetim belgeleri sağladık.
      result: 3 büyük ABD açık hava zincirinde başarıyla listelendi. İlk yılda %98 satış oranıyla 5.000+ adet.
    - challenge: Avustralyalı bir distribütör, özel tüp renklerine, Hypalon yükseltme seçeneğine ve Avustralya Standardı AS 1799'a uygunluğa sahip CE sertifikalı bir SUP serisine ihtiyaç duyuyordu.
      solution: 4 tüp renk varyantı ile ön üretim numuneleri ürettik, Japon tedarikçiden CSM Hypalon tedarik ettik ve üçüncü taraf AS 1799 uyumluluk testini koordine ettik.
      result: AU/NZ pazarında 3 modelli SUP serisi piyasaya sürüldü. Ardından 12 devriye SUP'si için devlet ihalesi kazanıldı.
faq_section:
  tagline: SSS
  title: B2B ve OEM Sıkça Sorulan Sorular
  questions:
    - q: OEM şişme SUP boardları için minimum sipariş miktarı (MOQ) nedir?
      a: Standart OEM modelleri için MOQ 5–10 adetten başlar. Özel kalıplar ve özel etiket projeleri, karmaşıklığa bağlı olarak minimum 200 adet gerektirir. Yeni marka lansmanları için deneme siparişleri ve numune çalışmaları mevcuttur.
    - q: afarer BSCI sertifikasına sahip mi?
      a: Evet. Fabrikamız geçerli BSCI sosyal uyumluluk sertifikasına sahiptir (denetim raporu talep üzerine mevcuttur). Ayrıca kalite yönetimi için ISO 9001 ve tüm ürünler CE CE  sertifikasına sahiptir. Her OEM sevkiyatıyla birlikte REACH ve RoHS uyumluluk belgeleri sağlanır.
    - q: Bir OEM siparişi için tipik teslim süresi nedir?
      a: Evet. Fabrikamız geçerli BSCI sosyal uyumluluk sertifikasına sahiptir (denetim raporu talep üzerine mevcuttur). Ayrıca kalite yönetimi için ISO 9001 ve tüm ürünler CE CE  sertifikasına sahiptir. Her OEM sevkiyatıyla birlikte REACH ve RoHS uyumluluk belgeleri sağlanır.
    - q: FOB Qingdao veya CIF olarak limanımıza gönderebilir misiniz?
      a: Evet. FOB Qingdao, büyük küresel limanlara CIF ve nitelikli ortaklar için DDP olarak gönderim yapıyoruz. Lojistik ekibimiz konteyner rezervasyonu, ihracat belgeleri ve gümrük işlemlerini yönetir. AB, ABD, AU ve Asya pazarlarında 50'den fazla ülkeye gönderim yapıyoruz.
b2b_moq: 'Standart MOQ: Model başına 5–10 adet (SUP/SUP/drop-stitch). SUP MOQ: 2–5 adet. Yeni ortaklıklar için deneme siparişleri kabul edilir.'
production_flow:
  tagline: Üretim Akışı
  title: Ham Maddeden Bitmiş Tekneye
  subtitle: Her tekne 6 üretim aşamasından geçer ve her adımda kalite kontrol kontrol noktaları bulunur. Kısayol yok, atlanmış denetim yok.
  stages:
    - stage: '01'
      title: Malzeme Kabul ve Gelen Kalite Kontrolü
      description: Gelen tüm malzemeler ERP sistemimize parti/lot numarası ile kaydedilir. PVC kumaş ruloları, drop-stitch çekirdekleri, valfler, yapıştırıcılar ve fittings, QC onayına kadar karantinada tutulur.
      qc_check: Çekme dayanımı (ASTM D751), yırtılma direnci (ISO 4674), kalınlık ölçer, yapıştırıcı viskozitesi, görsel kusur tarama
      qc_threshold: 100% parti test edilir. Çekme dayanımı spec'in %90'ından düşükse, yırtılma spec minimumunun altındaysa veya herhangi bir görsel kusur varsa reddedilir
      responsibility: Gelen QC ekibi (3 denetçi)
    - stage: '02'
      title: CNC Kesim ve Malzeme Hazırlığı
      description: Bilgisayar destekli optimizasyon, atığı en aza indirmek için panelleri PVC stok üzerinde yerleştirir. Otomatik CNC kesim makineleri 0,1 mm konum doğruluğunu korur.
      qc_check: CAD DXF dosyalarına göre boyutsal kontrol, kenar kalitesi muayenesi, panel sayısı doğrulaması
      qc_threshold: Her 20. panel ölçülür. Tolerans ±0.5 mm. Tolerans dışı >2% ise parti reddedilir
      responsibility: Kesim atölyesi sorumlusu
    - stage: '03'
      title: Kaynak ve Drop-Stitch Yapıştırma
      description: Drop-stitch çekirdekleri ısılamination ile dış PVC laminate yapıştırılır. Tüp odaları RF kaynağı veya sıcak hava kaynağı ile birleştirilir. Kenar bantları üç katmanlı eritme kaynağı ile bondedir.
      qc_check: Her 50 ünitede soyma testi (ASTM D751), kaynak genişliği ölçümü, sıcak hava sıcaklık kaydı incelemesi, arka ışık altında görsel dikiş kontrolü
      qc_threshold: Soyulma gücü minimum 8 N/cm. Kaynak genişliği toleransı ±1 mm. Görünür kanallanma = ret
      responsibility: Kaynak Kalite Kontrolü (vardiya başına 2 müfettiş)
    - stage: '04'
      title: Montaj ve Teçhizat
      description: 'Tekneler, tüm bileşenlerin birleştirildiği son montaj aşamasına geçer: gövde + tüpler, vanalar takılır, D-halkaları, kulplar, fin kutuları ve taşıma çantası yerleştirilir. Her ünite 100 maddelik montaj kontrol listesine uygun olarak üretilir.'
      qc_check: Birim başına 100 maddelik kontrol listesi onayı, valf işlevi testi (10 açma/döngüsü), donanım tork doğrulaması, görsel denetim
      qc_threshold: 'Güvenlikle kritik ürünlerde (valfler, D-halkaları, tutamaklar) sıfır hata politikası. Kozmetik kusurlar için: AQL 2,5 (ISO 2859)'
      responsibility: Montaj ekibi lideri + hat QC
    - stage: '05'
      title: Basınç Testi ve Kalite Kontrol
      description: Her hava odası 1,25× nominal basınca (tipik olarak 20–25 PSI) şişirilir ve 24–48 saat boyunca tutulur. Basınç sensörleri sürekli olarak kayıt yapar. %5'ten fazla basınç düşüşü yaşayan odalar reddedilir ve dikiş yeniden kontrolüne gönderilir.
      qc_check: 24 saat basınç koruma kaydı, günlük sensör kalibrasyonu doğrulaması, sıcaklık kompanzasyonlu basınç okuması, onarım sonrası dikiş yeniden testi
      qc_threshold: Stabil sıcaklıkta 24 saatte maksimum %5 basınç düşüşü. Bu değeri aşan her oda = tüm parti üretiminin %100 yeniden testi
      responsibility: Kalite laboratuvarı (üretimden bağımsız, yönetime rapor verir)
    - stage: '06'
      title: Nihai Muayene ve Paketleme
      description: Son görsel ve fonksiyonel denetim. Yüzey kusurları, renk tutarlılığı, etiket/BIN doğrulama, paketleme bütünlüğü ve aksesuar eksiksizliği. Üniteler vakumlu paketlenir, kutulanır ve konteyner yüklemesi için paletlenir.
      qc_check: Tam görsel muayene, SKU başına aksesuar kontrol listesi, ambalaj düşürme testi (1 m, rastgele örnek), etiket/barkod tarama doğrulaması
      qc_threshold: Kusurlar için AQL 2,5, küçük kusurlar için AQL 4,0. Güvenlik kusurlarında sıfır tolerans. Ünitelerin %100'ü görsel olarak denetlenir
      responsibility: Son kalite kontrol ekibi (4 denetçi) + Paketleme ekibi lideri

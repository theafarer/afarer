oem_section:
  tagline: Markanızı Piyasaya Sürün
  title: 16 Haftada Fikirden Pazarlamaya
  subtitle: Tam SUP marka lansman ortağınız — tasarım, prototip, üretim ve sevkiyat.
  steps:
    - number: '01'
      title: Fikir ve Brief
      desc: Vizyonunuzu, hedef pazarınızı ve teknik özelliklerinizi paylaşın.
    - number: '02'
      title: Tasarım ve Mühendislik
      desc: 3D modelleme, malzeme seçimi ve özel grafik tasarımı.
    - number: '03'
      title: Prototip ve Doğrulama
      desc: CE sertifikası ve kalite testi ile üretim örneği.
    - number: '04'
      title: Toplu Üretim
      desc: Üretim hattı kalite kontrolü ve fabrika denetim desteğiyle tam ölçekli üretim.
    - number: '05'
      title: Küresel Teslimat
      desc: FOB Qingdao lojistik, CIF ana limanlar, kapıya teslim.
  cta: Marka Yolculuğunuza Başlayın

      description: Günlük kiralama kullanımı için tasarlanmış yüksek dönüştürümlü SUP tahtaları. UV dirençli, çabuk kuruyan, istiflenebilir — kiralama yoğunluğu için tasarlandı.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: Perakende Ortakları
      description: Pazarınızda en hızlı büyüyen SUP markasını satın. Tam ürün yelpazesi, pazarlama materyalleri, dropshipping ve rekabetçi kar marjları.
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: Distribütörler
      description: Münhasır bölgeler, eksiksiz ürün portföyü, özel hesap yönetimi. 50+ ülkedeki küresel dağıtım ağımıza katılın.
      icon: tabler:world
      link: /solutions/distributors
    - title: Kendi Markanızı Oluşturun
      description: Uçtan uca OEM/ODM SUP üretimi — tasarım, prototipleme, seri üretim ve lojistik. Markanızı Afarer ile başlatın.
      icon: tabler:package
      link: /solutions/build-your-own-brand

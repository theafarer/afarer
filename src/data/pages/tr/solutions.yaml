features3_solutions:
  tagline: İş Türüne Göre Çözümler
  title: İşiniz İçin Özel Üretilmiş SUP'ler
  isBeforeContent: false
  columns: 2
  items:
    - title: Tatil Köyleri ve Oteller
      description: Konaklama tesisleri için kapsamlı SUP filo programları — dayanıklı tahtalar, özel marka çalışması ve personel eğitimi desteği.
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: Paddle Kulüpleri
      description: Kürek kulüpleri, ders programları ve üyelik operasyonları için güvenilir SUP filoları — kulüp fiyatlandırmasıyla ticari sınıf paneller.
      icon: tabler:users
      link: /solutions/paddle-clubs

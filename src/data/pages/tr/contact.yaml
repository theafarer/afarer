hero_text:
  tagline: İletişim
  title: BİZE ULAŞIN
contact_form:
  id: form
  title: Mesaj Gönderin
  subtitle: Fiyat teklifi, teknik sorular veya iş birliği için bize yazın. Bir iş günü içinde yanıtlıyoruz.
  email_to: info@afarer.com
  submit_button: Gönder
  success_message: Teşekkürler! Mesajınız alındı. Bir iş günü içinde yanıtlayacağız.
  error_message: Gönderim sırasında bir hata oluştu. Lütfen tekrar deneyin veya doğrudan e-posta adresine yazın.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: aşağıdaki işlemi çözün'
  fields:
    - name: firstName
      label: Ad
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Soyad
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Şirket
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Adres
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Posta Kodu
      row: 4
      step: 2
    - name: country
      label: Ülke
      row: 4
      step: 2
    - name: email
      label: E-posta
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Tahmini Sipariş Hacmi
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Özelleştirme gerekli mi?
      row: 7
      step: 2
    - name: productInterest
      label: İlgilenilen Ürün Kategorileri
      row: 8
      step: 2
    - name: subject
      label: Konu
      row: 9
      step: 3
    - name: message
      label: Mesaj
      row: 10
      type: textarea
      rows: 6
      step: 3

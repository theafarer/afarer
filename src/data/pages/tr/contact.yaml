      icon: tabler:tool
    - title: Basın ve Ortaklıklar
      description: Medya kitleri, sponsorluk ve sektör iş birlikleri.
      icon: tabler:news
    - title: Telefon
      description: '+86 13305324192'
      icon: tabler:headset
    - title: E-posta
      description: info@afarer.com
      icon: tabler:mail
    - title: Genel Merkez
      description: Ekonomik Kalkınma Bölgesi, Laixi, Qingdao, Çin, 266600

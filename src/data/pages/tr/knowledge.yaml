hero:
  tagline: Bilgi Grafiği
  title: Su Keşif Bilgisi
  subtitle: |
    Şişme SUP teknolojisi, su güvenliği, bot mühendisliği<br />
    ve macera planlamasını kapsayan yapılandırılmış bir bilgi tabanı.
  taglineSection: Keşfedin. Öğrenin. Güvenle gidin.
clusters:
  tagline: Bilgi Kümeleri
  title: Konuya göre keşfedin
  subtitle: Her afarer ürününün arkasındaki teknoloji, güvenlik ve becerilere derinlemesine dalışlar.
  items:
    - title: SUP Bilgisi
      description: İlk boardınızı seçmekten ileri tur tekniklerine kadar — stand-up paddle hakkında her şey.
      icon: tabler:lifebuoy
      topics:
        - İlk şişme SUP'inizi nasıl seçersiniz
        - Yeni başlayanlar için en iyi SUP boyutu
        - Paddle board ne kadar zor?
        - Şişme vs sert board karşılaştırması
        - SUP güvenlik kontrol listesi
    - title: Bot Bilgisi
      description: Şişme botlar, SUP'ler, şişme botlar ve kayaklar hakkında teknik rehberler — mühendislik, malzemeler ve kullanım.
      icon: tabler:sailboat
      topics:
        - Şişme bot türleri açıklandı
        - PVC vs Hypalon karşılaştırması
        - SUP vs Şişme Bot karşılaştırması
        - Drop-stitch teknolojisi derinlemesine
        - Deniz malzemesi bilimi rehberi
    - title: Güvenlik Bilgisi
      description: Her kürekçi için temel güvenlik bilgisi — can yeleği seçiminden hava durumu okumaya ve kendi kendine kurtarma tekniklerine kadar.
      icon: tabler:shield
      topics:
        - SUP güvenlik kontrol listesi
        - Can yeleğine ihtiyacınız var mı?
        - Okyanus kürek güvenlik rehberi
        - Şişme kayaklar için nehir güvenliği
        - Hava durumu ve su koşulu farkındalığı
    - title: Teknoloji
      description: afarer ürünlerinin arkasındaki mühendislik — malzemeler, yapım yöntemleri ve kalite testi.
      icon: tabler:microscope
      topics:
        - Deniz sınıfı PVC teknolojisi
        - Drop-stitch çekirdek açıklaması
        - PSI şişme SUPlar için neden önemlidir
        - RF kaynağı vs yapıştırıcı birleştirme
        - Kalite testi ve sertifikasyon
    - title: SUP Yaşam Tarzı ve Özel Kullanımlar
      description: Özel SUP aktiviteleri — yoga, balıkçılık, köpekler, aileler ve seyahat ipuçları.
      icon: tabler:heart
      topics:
        - Suda SUP yogası ve meditasyonu
        - Şişirilebilir SUP'tan Balık Tutma
        - Köpekler ve çocuklarla kürek sörfü
        - SUP'unuzla hava ve karayoluyla seyahat
        - SUP aksesuarları ve ekipman temelleri
    - title: SUP Karşılaştırmaları ve Referansları
      description: Bilinçli kararlar vermenize yardımcı olacak yan yana karşılaştırmalar.
      icon: tabler:chart-bar
      topics:
        - SUP mu kayak mı — hangisi sizin için doğru?
        - PVC ve Hypalon malzeme karşılaştırması
        - Tek kabin vs çok kabin güvenliği
        - SUP tahtası malzemeleri açıklaması
        - UV baskı vs EVA blok sanat eseri

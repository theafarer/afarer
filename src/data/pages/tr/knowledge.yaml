meta:
  title: 'Bilgi — SUP Rehberleri | {SITE}'
  description: 'afarer bilgi tabanı: markalar ve profesyoneller için şişme SUP, paddle board malzemeleri, tahta seçimi ve sektör içgörüleri rehberleri.'
  keywords:
    - 'SUP bilgisi'

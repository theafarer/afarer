hero:
  tagline: Laboratuvar 04
  title: Hidrodinamik Test Tankı
  subtitle: İlk tam ölçekli prototip öncesi performans doğrulaması
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: Afarer hidrodinamik test havuzu performans testleri
intro: >-
  Hidrodinamik testlerin yalnızca okyanus gemileri için ayrıldığı yaygın bir yanlış kanıdır. Gerçekte, küçük bir planing gövdenin — örneğin 4–6 m uzunluğunda bir RIB — performansı, su altı şekline tankerlerin bulbous bow'una olduğu kadar bağımlıdır. Trim açısı, ıslak yüzey alanı, su sıçraması
  oluşturma ve ventilasyon hız, yakıt tüketimi ve sürüş konforu üzerinde büyük bir etkiye sahiptir. {SITE.name} olarak, metal ve kumaşı tam boyutlu bir prototipe yatırmadan önce bu etkileri model ölçünde nicel olarak analiz edebilmemizi sağlayan özel bir hidrodinamik test havuzu işletiyoruz.
content_html: >-
  <h2>Neden küçük bir tekneyi tank testinden geçiriyoruz?</h2>

  <p>Model ölçekte test etmek (tipik olarak 1:3 ila 1:5 arası) gövde şekillerini hızlı ve uygun maliyetli olarak yinelememizi sağlar. Tankta bir hafta, tam boy deneme-yanılma yöntemiyle aylarca alacak aynı performans verisini üretebilir — ve bunu çok daha düşük bir maliyetle yapar.</p>


  <h2>Tesis özellikleri</h2>

  <table>
    <thead><tr><th>Parametre</th><th>Özellik</th></tr></thead>
    <tbody>
      <tr><td>Tank boyutları</td><td>35 m (U) × 3,5 m (G) × 1,8 m (D)</td></tr>
      <tr><td>Çekme arabası</td><td>Elektrikli servo tahrikli, maksimum hız 12 m/s (23 kn), hız doğruluğu ± %0,5</td></tr>
      <tr><td>Dalga üreteci</td><td>Flap tipi, programlanabilir düzenli ve çapraşık deniz koşulları, model ölçekte Hs 0,3 m'ye kadar</td></tr>
      <tr><td>Enstrümantasyon</td><td>6 bileşenli dinamometre (direnç, yan kuvvet, yaw momenti), ivme ölçerler, eğim ölçerler, dalga probu</td></tr>
      <tr><td>Veri toplama</td><td>Kanal başına 1000 Hz örnekleme, gerçek zamanlı gösterim + işleme paketi</td></tr>
      <tr><td>Model üretimi</td><td>1,8 m LOA'ya kadar model gövdeleri için özel CNC talaşı ve 3D baskı</td></tr>
    </tbody>
  </table>


  <h2>Test programımız</h2>

  <p>Tankımızdaki standart gövde geliştirme programı aşağıdaki sýrayı izler:</p>

  <ol>
    <li><strong>Model inşaşı</strong> — 1:3,5 ölçekli model, yöksek yoğunluklu köpükten CNC işlenir ve rijitlik için cam elyapı ile kaplanır. Ağırlık ve CG, Froude ölçekli tam yük durumuna uyacak şekilde ayarlanır.</li>
    <li><strong>Direnç testleri</strong> — Model çalışma menzilini kapsayan 8-10 hızda çekilir. Toplam direnç ölçülür ve ITTC-1957 yöntemi kullanılarak sürtünme ve kalıntı bileşenlerine ayrıştırılır.</li>
    <li><strong>İnme ve batma ölçümü</strong> — Her hızda çalışma trimi ve batma kaydedilir. Planing gövdeleri için 4-6° optimal trim açısı hedeftir.</li>
    <li><strong>Uyanış anketi</strong> — Dalga oluşturma dirençini değerlendirmek ve stern etkileşimine neden olabilecek enine dalga etkileşimlerini belirlemek için iki hızda enine dalga kesitleri ölçülür.</li>
    <li><strong>Deniz dayanıklılığı (opsiyonel)</strong> — Düzgün dalgalarda artık direnç, dikey ivme ve slam olasılığını ölçmek için karşı ve arkadan dalga testleri.</li>
    <li><strong>Veri analizi ve öneriler</strong> — Karşılaştırma grafikleri, hız/güç eğrileri ve tam boy gövde için özel tasarım önerileri içeren tam bir rapor sunulur.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Tipik Tank Test Sonuçları — Direnç vs Hız (RIB 450 gövdesi, 1:3,5 ölçek)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Froude ölçekli hızlarda model ölçekte direnç (N). Tam boy güç tahmini ITTC-1978 performans tahmin yöntemini izler.</p>
  </div>


  <h2>Uzman ekibimiz</h2>

  <p>Tankımız, deniz mimarlığında doktora yapmış ve büyük bir Avrupa denizcilik araştırma enstitüsünde 8 yıl tank deneyimine sahip bir hidrodinamikci tarafından işletilmektedir. Tüm modelleri ve enstrümanları hazırlayan bir teknisyen tarafından desteklenmektedir. Ekip, her testin tekrarlanabilir,
  izlenebilir ve uluslararası alanda savunulabilir olmasını sağlamak için ITTC (İnternational Towing Tank Conference) Önerilen Prosedürlerini takip eder.</p>


  <h2>Özel gövde geliştirme için tank testleri</h2>

  <p>Tankımız yalnızca kendi tasarım gövdelerimiz için kullanılmaz — müşteriler için özel gövde şeklini doğrulamak veya bir performans sorunu araştırmak amacıyla düzenli olarak test programları yürütüyoruz:</p>

  <ul>
    <li><strong>Gövde şekli karşılaştırması</strong> — Aynı koşullar altında test edilen iki veya daha fazla aday gövde şekli, tasarım seçiminizi bilgilendirmek için nesnel sürtünme/hız/stabilite karşılaştırması sağlar.</li>
    <li><strong>Eklenti optimizasyonu</strong> — Interceptor plakaları, sışırıma rayları, trim tabloları ve straklar, sürtünme azaltma katkılarını nicelendirmek için çeşitli yapılandırmalarda test edilebilir.</li>
    <li><strong>Motor eşleştirme çalışması</strong> — Direnç verileri güç tahmin eğrisine dönüştürülür, hedef hızınız ve yük kapasiteniz için optimum motor at gücünü seçmenizi sağlar.</li>
  </ul>


  <h2>Neden bizimle test ediyorsunuz?</h2>

  <p>Size yalnızca bir dizi ham sayı vermiyoruz. Raporlarımız tank verilerini uygulanabilir mühendislik önerilerine dönüştürür: "Kruvazör hızında islandık yüzeyi azaltmak için sışırıma rayını 8 mm yükseltin", "Slam ivmesini azaltmak için transom üzerindeki deadrise'i 3° artırın" veya "Planing
  duruşunu iyileştirmek için boyuna ağırlık merkezini 150 mm geriye taşıyın". Ne değiştireceğinizi ve nedenini net bir anlayışla ayrılırsınız.</p>

  <p>Tankımız aynı zamanda ücret karşılıında bağımsız üçüncü parti testleri için de kullanılabilir. Bir gövde geliştiriyor ve tarafsız, profesyonelce yürütülen bir hidrodinamik değerlendirme istiyorsanız, sorularınızı bekliyoruz.</p>

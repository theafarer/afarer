  image: https://assets.afarer.com/images/afarer/factory/design discussafarer-inflatable-boat-afarer-factory-exterior.webp
  image_alt: Afarer gövde mühendisliği CAD tasarım istasyonu
intro: >-
  Gövde, herhangi bir şişme SUP'un omurgasıdır. Verimli bir şekilde kayacak kadar hafif, kayalı kıyı şeritleriyle başa çıkacak kadar güçlü ve her kürek çekimini ileri harekete dönüştürecek kadar rijit olmalıdır. Afarer'de Gövde Mühendisliği Stüdyomuz, gelişmiş CAD modelleme, sonlu
  eleman analizi (FEA) ve onlarca yıllık pratik tahta tasarımı deneyimini birleştirerek, amaçlanan disiplini için optimize edilmiş gövdeler sunmaktadır — katalogdan uyarlanan genel şekiller değil.
content_html: >
  <h2>Gücün hidrodinamikle buluştuğu yer</h2>

  <p>Üç temel yapı platformuyla çalışıyoruz — güçlendirilmiş drop-stitch PVC çekirdekler, el yatırması fiberglas laminatlar ve döner kalıplı polietilen — ve her birini tasarlamak, simüle etmek ve doğrulamak için mühendislik kapasitemiz mevcuttur.</p>


  <h2>Tasarım araçları ve standartlar</h2>

  <p>Dijital mühendislik ortamımız şunları içerir:</p>

  <table>
    <thead><tr><th>Kapasite</th><th>Yazılım / Araç</th><th>Uygulama</th></tr></thead>
    <tbody>
      <tr><td>3D parametrik modelleme</td><td>SolidWorks Professional</td><td>Gövde yüzeyi, ray ve stringer takviyesi, güverte yerleşimi, ekipman bağlantı noktaları</td></tr>
      <tr><td>Sonlu eleman analizi</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Gerilme haritalama, modal analiz, çarpışma/etkileşim simülasyonu</td></tr>
      <tr><td>Hesaplamalı akışkanlar dinamiği</td><td>Ansys Fluent / Star-CCM+</td><td>Hidrodinamik sürükleme tahmini, trim optimizasyonu</td></tr>
      <tr><td>Lamine mühendisliği</td><td>ESAComp / CADEC</td><td>Fiberglas katman istiflenmesi, çekirdek seçimi, ağırlık tahmini</td></tr>
      <tr><td>Kalıp akış simülasyonu</td><td>Moldex3D</td><td>Döner kalıplama duvar kalınlığı tahmini</td></tr>
    </tbody>
  </table>


  <h2>Mühendislik iş akışımız</h2>

  <p>Standart bir model veya tamamen özel bir proje olsun, her gövde tasarımı katı bir beş aşamalı süreçten geçer:</p>

  <ol>
    <li><strong>Kavram ve gereksinim toplama</strong> — Sürücü ağırlığı ve yükü, hız aralığını, su durumu kapasitesini, taşıma gereksinimlerini ve özel görev ekipmanlarını (güverte montajları, kargo bağlama konumları, aksesuar entegrasyonu) tanımlamak üzere sizinle görüşüyoruz.</li>
    <li><strong>3D yüzey oluşturma ve hidrostatik hesaplama</strong> — Gövde formu SolidWorks’te modellenir ve dahili analiz araçları kullanılarak hidrostatik stabilite, hacim dağılımı ve düzeltme momenti kontrol edilir.</li>
    <li><strong>Yapısal FEA</strong> — Yük durumları tanımlanır: statik (sürücü + ekipman), dinamik (5g’de dalga inişi etkileri) ve oturma (3 m/s hızla kayalı kıyı şeridine çarpma). Gerilme kontrolleri gözden geçirilir; emniyet katsayısı ≥ 2,5 zorunludur.</li>
    <li><strong>CFD sürükleme optimizasyonu</strong> — Gövde üç yükleme durumunda ve beş hızda simüle edilir. Islak yüzey alanı, trim açısı ve kalıntı direnç yinelenerek azaltılır.</li>
    <li><strong>Tasarım incelemesi ve yayın</strong> — Tam mühendislik paketi (3D model, FEA raporu, CFD raporu, ağırlık tahmini, katman kitabı) prototip atölyesine gönderilmeden önce kıdemli mühendisimiz tarafından incelenir.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA Gerilme Dağılımı — Touring SUP Gövdesi (Güçlendirilmiş Drop-Stitch)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Maksimum yükte emniyet katsayısı</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">%15,2</span>
        <span class="text-gray-500">Önceki nesle göre sürükleme azalması</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Tepe çarpmalı basınç (tasarım limiti)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 saat</span>
        <span class="text-gray-500">2025’te kümülatif FEA çalışma süresi</span>
      </div>
    </div>
  </div>


  <h2>Özelleştirme: gövdeniz, kurallarınız</h2>

  <p>Hiçbir iki paddle kullanıcısının gereksinimleri aynı değildir. Balıkçılık SUP'ı geniş, stabil bir planing gövdeye ihtiyaç duyar; tur tahtası kaymayı en üst düzeye çıkaran bir deplasman gövdesine ihtiyaç duyar; sörf SUP'ı duyarlı raylara ve ayarlanmış rocker'a ihtiyaç duyar. Uygulamanızı önceden var
  olan bir gövde formuna zorlamıyoruz. Spesifikasyonunuzdan başlayarak yukarıya doğru tasarlıyoruz.</p>

  <p>Yakın zamanda gerçekleştirilen özel gövde mühendisliği projelerinden örnekler:</p>

  <ul>
    <li>Karayipler'deki bir eko-tur operatörü için uzunluğu uzatılmış touring SUP, plaj inişleri için takviyeli pruva (+%15 ray kalınlığı).</li>
    <li>Bir liman otoritesi için yüksek görünürlüklü devriye SUP'ı, entegre ekipman bağlantıları ve taktik raylarla.</li>
    <li>Bir kiralama filosu için sefer tur SUP'ı, güçlendirilmiş raylar ve ekstra kargo bağlantılarıyla.</li>
  </ul>


  <h2>Mühendislerimiz</h2>

  <p>Stüdyo, yüksek performanslı tahta tasarımında 14 yıllık deneyime sahip kıdemli bir mühendis tarafından yönetilmekte ve FEA ile CFD konusunda uzmanlaşmış iki makine mühendisi tarafından desteklenmektedir. Üçü de uluslararası tanınmış üniversitelerden deniz veya makine mühendisliğinde ileri
  derecelere sahiptir. Ekip, endüstri dergilerinde düzenli olarak yayın yapmakta ve yüksek performanslı paddle sporu mühendisliği konusunda uluslararası konferanslarda sunumlar yapmaktadır.</p>


  <h2>Bir sonraki gövdenizde bizimle iş birliği yapın</h2>

  <p>İlk kavram eskizinden nihai gerilme raporuna kadar, Gövde Mühendisliği Stüdyomuz yalnızca inşa edilmekle kalmayan — aynı zamanda mühendislikle tasarlanmış bir tahta oluşturmanızda ortağınızdır. Her kaynağı, her laminate katmanını ve her gövde eğrisini bir nedenle yerinde tutmak için simulasyon
  saatlerine önceden yatırım yapıyoruz.</p>

  <p>Mevcut bir modele küçük bir değişiklik mi gerekiyor yoksa tamamen sıfırdan bir tasarım mı istiyorsunuz, gereksinimlerinizi tartışmaya hazırız.</p>

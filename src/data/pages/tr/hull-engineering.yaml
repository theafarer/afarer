intro: >-
  Gövde, herhangi bir RIB veya şişirilebilir teknenin omurgasıdır. Verimli bir şekilde plane yapacak kadar hafif, darbe yüklerini absorbe edecek kadar güçlü ve geniş bir sıcaklık aralığında boyutsal olarak stabil olmalıdır. {SITE.name}'de Gövde Mühendisliği Stüdyomuz, gelişmiş CAD modelleme, sonlu
  eleman analizi (FEA) ve onlarca yıllık pratik deniz mimarlığı deneyimini birleştirerek, katalogdan uyarlanan genel şekiller değil, kendi görevleri için optimize edilmiş gövdeler sunmaktadır.
content_html: >
  <h2>Gücün hidrodinamikle buluştuğu yer</h2>

  <p>Üç ana gövde malzemesiyle çalışıyoruz — döner kalıplı HDPE, kaynaklı deniz sınıfı alüminyum ve elde dökülen fiberglas — ve her birini tasarlamak, simüle etmek ve doğrulamak için mühendislik kapasitemiz mevcuttur.</p>


  <h2>Tasarım araçları ve standartlar</h2>

  <p>Dijital mühendislik ortamımız şunları içerir:</p>

  <table>
    <thead><tr><th>Kapasite</th><th>Yazılım / Araç</th><th>Uygulama</th></tr></thead>
    <tbody>
      <tr><td>3D parametrik modelleme</td><td>SolidWorks Professional</td><td>Gövde yüzeyi, stringer sistemi, motor braket, güverte yerleşimi</td></tr>
      <tr><td>Sonlu eleman analizi</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Gerilme haritalama, modal analiz, çarpışma/etkileşim simülasyonu</td></tr>
      <tr><td>Hesaplamalı akışkanlar dinamiği</td><td>Ansys Fluent / Star-CCM+</td><td>Hidrodinamik sürükleme tahmini, trim optimizasyonu</td></tr>
      <tr><td>Lamine mühendisliği</td><td>ESAComp / CADEC</td><td>Fiberglas katman istiflenmesi, çekirdek seçimi, ağırlık tahmini</td></tr>
      <tr><td>Kalıp akış simülasyonu</td><td>Moldex3D</td><td>Döner kalıplama duvar kalınlığı tahmini</td></tr>
    </tbody>
  </table>


  <h2>Mühendislik iş akışımız</h2>

  <p>Standart bir model veya tamamen özel bir proje olsun, her gövde tasarımı katı bir beş aşamalı süreçten geçer:</p>

  <ol>
    <li><strong>Kavram ve gereksinim toplama</strong> — Yük, hız aralığı, deniz durumu kapasitesi, çekme gereksinimleri ve özel görev ekipmanları (güverte kapakları, konsol konumları, yakıt tankı entegrasyonu) tanımlamak üzere sizinle görüşüyoruz.</li>
    <li><strong>3D yüzey oluşturma ve hidrostatik hesaplama</strong> — Gövde formu SolidWorks’te modellenir ve dahili analiz araçları kullanılarak hidrostatik stabilite (GM, düzeltme kolu) kontrol edilir.</li>
    <li><strong>Yapısal FEA</strong> — Yük durumları tanımlanır: statik (ekip + ekipman), dinamik (5g’de plane etkileri) ve çarpmalı (3 m/s hızla dalga tepesinden düşme). Gerilme kontrolleri gözden geçirilir; emniyet katsayısı ≥ 2,5 zorunludur.</li>
    <li><strong>CFD sürükleme optimizasyonu</strong> — Gövde üç yükleme durumunda ve beş hızda simüle edilir. Islak yüzey alanı, trim açısı ve artan direnç yinelenerek azaltılır.</li>
    <li><strong>Tasarım incelemesi ve yayın</strong> — Tam mühendislik paketi (3D model, FEA raporu, CFD raporu, ağırlık tahmini, katman kitabı) prototip atölyesine gönderilmeden önce kıdemli gemi mimarımız tarafından incelenir.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA Gerilme Dağılımı — RIB 450 Patrol Gövdesi (Alüminyum 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Maksimum yükte emniyet katsayısı</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">%15,2</span>
        <span class="text-gray-500">Önceki nesle göre sürükleme azalması</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Tepe çarpmalı basınç (tasarım limiti)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 saat</span>
        <span class="text-gray-500">2025’te kümülatif FEA çalışma süresi</span>
      </div>
    </div>
  </div>


  <h2>Özelleştirme: gövdeniz, kurallarınız</h2>

  <p>Hiçbir iki operatörün gereksinimleri aynı değildir. Liman devriye RIB’i düşük hızda stabilite için sığ-V gövdeye ihtiyaç duyar; hızlı önleme teknesi sprey raylarıyla derin-V’ye ihtiyaç duyar; dalış destek teknesi geniş bir kirişe ve alçak bir kıç aynasına ihtiyaç duyar. Uygulamanızı önceden var
  olan bir gövde formuna zorlamıyoruz. Spesifikasyonunuzdan başlayarak tasarlıyoruz.</p>

  <p>Yakın zamanda gerçekleştirilen özel gövde mühendisliği projelerinden örnekler:</p>

  <ul>
    <li>Karayipler’deki bir tur operatörü için uzatılmış 6,8 m HDPE gövde, plaj inişleri için takviyeli pruva (+%15 dip kalınlığı).</li>
    <li>Sahil güvenlik için hafif alüminyum 7,2 m RIB, entegre yakıt tankı baffle’ları ve ekipman dolabı takviyeleri.</li>
    <li>Kısaltılmış kıç aynası ve çift batarya kutuları olan 5,5 m fiberglas dalış teknesi, snorkelcilerin kolayca tekrar binmesi için tasarlandı.</li>
  </ul>


  <h2>Mühendislerimiz</h2>

  <p>Stüdyo, 14 yıllık yüksek hızlı tekne tasarım deneyimine sahip kıdemli bir gemi mimarı tarafından yönetilmektedir ve FEA ile CFD konusunda uzmanlaşmış iki makine mühendisi tarafından desteklenmektedir. Üçü de uluslararası tanınmış üniversitelerden deniz mühendisliği veya gemi mimarlığında ileri
  derecelere sahiptir. Ekip, endüstri dergilerinde düzenli olarak yayın yapmakta ve Uluslararası Yüksek Performanslı Deniz Araçları Konferansı gibi konferanslarda sunumlar yapmaktadır.</p>


  <h2>Bir sonraki gövdenizde bizimle iş birliği yapın</h2>

  <p>İlk kavram eskizinden nihai gerilme raporuna kadar, Gövde Mühendisliği Stüdyomuz yalnızca inşa edilmekle kalmayan — aynı zamanda mühendislikle tasarlanmış bir tekne oluşturmanızda ortağınızdır. Her kaynağı, her laminate katmanını ve her gövde eğrisini bir nedenle yerinde tutmak için simulasyon
  saatlerine önceden yatırım yapıyoruz.</p>

  <p>Mevcut bir modele küçük bir değişiklik mi gerekiyor yoksa tamamen sıfırdan bir tasarım mı istiyorsunuz, gereksinimlerinizi tartışmaya hazırız.</p>

meta:
  title: SUP Distribütörlük Programı | {SITE}
  description: Afarer'in küresel dağıtım ağına katılın. Münhasır bölgeler, eksiksiz ürün portföyü, rekabetçi toptan fiyatlandırma ve özel hesap yönetimi.
hero:
  tagline: Distribütörler
  title: Küresel<br />Dağıtım Ağımıza Katılın
  subtitle: Münhasır bölgeler. Kapsamlı ürün portföyü. Dünya standartlarında destek. Afarer 50'den fazla ülkeye sevkiyat yapmaktadır ve köklü denizcilik ve su sporları dağıtıcıları arıyoruz.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Afarer küresel dağıtım ve sevkiyat operasyonları
benefits:
  title: Distribütörler Ne Elde Eder
  subtitle: Pazarda başarılı olmanız için ihtiyacınız olan her şey.
  items:
    - Münhasır bölge hakları
    - Tam ürün kataloğu (SUP, aksesuarlar, yedek parçalar)
    - Rekabetçi toptan fiyatlandırma
    - Pazarlama ve satış materyalleri (çevirilmiş)
    - Eğitim programı (ürün, satış, bakım)
    - Fuar desteği
    - Numune programı
    - Drop-ship yeteneği
    - Atanmış distribütör hesap yöneticisi
    - 45-60 gün ödeme koşulları

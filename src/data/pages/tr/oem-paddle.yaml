faqs:
  title: 'OEM Paddle Üretimi SSS'
  subtitle: 'Kendi paddle markasını lanse edenlerin en sık sorduğu soruların yanıtları.'
  items:
    - title: 'Kendi paddle markamı nasıl oluştururum?'
      description: 'Markanızı 16 haftada lanse edin: brief, tasarım, CE belgeli prototip, seri üretim ve teslimat. OEM paketlerimizi keşfedin.'
    - title: 'Üretim süresi nedir?'
      description: 'Numune 2-3 haftada, seri üretim hacme bağlı olarak 30-45 günde hazırdır.'
    - title: "Paddle board'umuzun logosunu taşıyor mu?"
      description: 'Evet — tam özel marka: logo baskısı, özel renkler, ambalaj ve markanızla etiketler.'
    - title: 'İlk günden toptan satın alabilir miyim?'
      description: 'Standart modeller için MOQ 50 adettir ve hacim arttıkça toptan fiyat kademeleri uygulanır.'

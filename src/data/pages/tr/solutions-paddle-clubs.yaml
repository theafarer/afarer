meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Eş Afarer SUP boardlarında kürek kulübü üyeleri
benefits:
  title: Klüp Filo Avantajları
  subtitle: 50'den fazla ülkedeki kürek kulüpleri neden Afarer'i ekipman ortağı olarak seçiyor.
  items:
    - metric: '%40+'
      label: Filo Maliyet Tasarrufu
      detail: Toplu kulüp indirimleriyle perakende fiyatlandırma karşılaştırması
    - metric: 48h
      label: Parça Değiştirme
      detail: Kiralama filonuz için minimum duruş süresi
    - metric: 500+
      label: Kiralama Döngüleri
      detail: Board başına ticari dayanıklılık
    - metric: 5+ Yıl
      label: Fil Ömrü
      detail: Doğru bakım ve özen ile
packages:
  title: Kulüp Filo Programları
  subtitle: Kulübünüzün boyutu ve hedeflerine uygun filo programını seçin.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Lansman rehberi + güvenlik kontrol listesi
        - Lansman rehberi + güvenlik kontrol listesi
        - CE sertifikalı — tüm ekipmanlar
      cta_text: Kulübünüzü Başlatın
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Yedek parça programı (%15 indirim)
        - Staff training session
        - Personel eğitimi oturumu (çevrimiçi)
        - CE sertifikalı — tüm ekipmanlar
      popular: true
      cta_text: Filonuzu Kurun
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50+ yarış / performans tahtası
        - Full accessory set
        - Event support kit
        - Öncelikli parçalar (24 saat sevkiyat)
        - Özel hesap yöneticisi
        - Özel takım üniforması seçeneği
        - CE sertifikalı — tüm ekipmanlar
      cta_text: Yarış Filosu Edinin
training:
  title: Eğitim Merkezi Paketleri
  subtitle: Bir SUP okulunun profesyonel sertifikasyon kursları yürütmesi için gereken her şey.
  items:
    - name: Instructor Starter
      features:
        - 5 premium SUP panosu (eğitmen sınıfı)
        - Demolar için 5 karbon kürek
        - 5 can yeleği (eğitmen bedeni)
        - Eğitim müfredatı rehberi
        - CE sertifikalı ekipman
    - name: School Full Set
      features:
        - 20 SUP tahtası (öğrenci + eğitmen karışımı)
        - 20 kürek + 20 can yeleği (çeşitli bedenler)
        - Başlangıç seviyesi için 10 yüzdürme yardımcısı
        - 4 pompa + onarım kitleri
        - Eğitim müfredatı ve sertifikasyon desteği
        - CE sertifikalı ekipman
features:
  title: Kulüpler Neden Afarer'i Seçiyor
  subtitle: Büyüken kulüpler için tutarlı kalite, hızlı yedek parça ve toplu fiyatlandırma.
  items:
    - title: 500+ Kiralama Döngüsü
      description: Ticari sınıf boardlar, mevsimler boyunca günlük kullanıma dayanır.
      icon: tabler:shield-check
    - title: Özel Renkler
      description: Özel tahta renkleri ve logosuyla kulüp kimliğinizi eşleştirin.
      icon: tabler:palette
    - title: Toplu Fiyatlandırma
      description: 10+ tahtalık filo siparişleri için toplu alım indirimleri.
      icon: tabler:discount
    - title: Hızlı Yedek Parça
      description: Yedek parçalar 48 saat içinde sevk edilir.
      icon: tabler:truck-delivery
    - title: Kulüp Büyüme Desteği
      description: Üyelik programları, fiyatlandırma ve etkinlik düzenleme hakkında tavsiyeler.
      icon: tabler:trending-up
    - title: CE Sertifikalı
      description: Tüm ekipmanlar uluslararası güvenlik standartlarına uygundur.
      icon: tabler:certificate
cta:
  title: Kürek kulübünüzü kurmaya hazır mısınız?
  subtitle: Kulüp filo teklifinizi alın veya kulüp başlangıç rehberimizi indirin.
  actions:
    - text: Kulüp Filosu İçin Başvurun
      href: /contact?package=club
      variant: primary
    - text: Kulüp Rehberini İndirin
      href: /resources/download-catalog
      variant: secondary

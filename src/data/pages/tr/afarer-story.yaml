timeline:
  - year: '2012'
    title: Denizcilik Üretim Temeli
    body: afarer, Çin'in Qingdao şehrinde, denizcilik zanaatına ve şişme bot üretimine adanmış özel bir şişme deniz aracı atölyesi olarak başladı. İlk odak noktası, pratik mühendislik deneyimi ve üretim disiplini ile güvenilir şişme ürünler inşa etmekti.
  - year: '2015'
    title: İlk İhracat ve CE Sertifikası
    body: İlk ihracat siparişleri Japonya ve Kore'ye ulaştı. Temel ürün hatları için CE sertifikası alındı ve afarer'ın uluslararası pazarlara girişi müjdelendi. Şirket, Çin dışındaki ticari ve eğlence amaçlı kullanıcılara hizmet vermeye başladı.
  - year: '2018'
    title: Fabrika Genişlemesi
    body: 12.000 m²'lik bir üretim tesisine taşınıldı. RF kaynak hatları ve drop-stitch üretim kapasitesi eklendi, böylece daha büyük ölçekli üretim ve gelişmiş kalite kontrol sistemleri mümkün hale geldi.
  - year: '2020'
    title: Ar-Ge Merkezi Kuruldu
    body: PVC kumaş laboratuvarı, hidrodinamik test havuzu ve CAD/FEA simülasyon stüdyosu ile özel bir Ar-Ge merkezi açıldı. Ürün geliştirme, hafif yapı, gelişmiş dayanıklılık ve kullanıcı odaklı tasarıma odaklanacak şekilde genişletildi.
  - year: '2022'
    title: Sertifikasyon ve Küresel Büyüme
    body: ISO 9001 sertifikası alındı. Ar-Ge mühendisi sayısı 14'e, çalışan sayısı 200'ün üzerine çıkarıldı. Ürünler, distribütör ve ortak marka ortaklıkları aracılığıyla Avrupa, Amerika ve Asya-Pasifik'teki müşterilere ulaştı.
  - year: '2024'
    title: İnovasyon ve Tasarım Stüdyosu
    body: Konseptten üretime kadar özel ortak marka projeleri için tam kapsamlı tasarım ve inovasyon stüdyosu kuruldu. Kurtarma, ticari ve devlet ihaleleri dahil olmak üzere profesyonel deniz uygulamaları güçlendirildi.
  - year: '2026'
    title: Su Keşfinin Geleceğini İnşa Etmek
    body: Bugün afarer, şişme botlar, SUP sistemleri ve özel deniz çözümleri geliştirmeye devam ediyor — insanları ve kuruluşları dünyanın sularıyla buluşturuyor. 50+ ülkeye hizmet, 15.000+ adet yıllık kapasite.
content_founding:
  tagline: Başlangıç
  title: Suda Doğanlar
  subtitle: "afarer, bir bot ve bir vizyonla Qingdao'da bir kıyı atölyesinde başladı: gerçek deniz koşullarına dayanabilecek şişme deniz araçları inşa etmek."
  paragraphs:
    - 2012 yılında kurucularımız pazarda bir boşluk gördü — çoğu şişme bot ya uygun fiyatlı ama güvenilmezdi ya da yüksek kaliteli ama aşırı pahalıydı. Hem kaliteyi hem de değeri sunan bir üreticiye yer olduğuna inandılar.
    - İlk tekne gövdesi elle inşa edildi, yerel sularda test edildi ve balıkçılar ile küçük ticari işletmecilerden gelen gerçek geri bildirimlerle geliştirildi. Bu geri bildirim döngüsü — inşa et, test et, dinle, iyileştir — bugün hala mühendislik felsefemizin merkezinde yer alıyor.
    - 2015 yılına gelindiğinde, haber Qingdao'nun ötesine yayıldı. Uluslararası distribütörler numune talep etmeye başladı. Yerel bir atölye olarak başlayan şey, küresel bir tedarikçiye dönüşüyordu.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer erken dönem üretim atölyesi ve imalat süreci
content_growth:
  tagline: Büyüme ve İnovasyon
  title: Atölyeden 12.000 m²'lik Tesise
  subtitle: İnsanlara, ekipmana ve süreçlere yapılan sürekli yatırım, afarer'ı modern bir denizcilik üretim tesisine dönüştürdü.
  paragraphs:
    - Talep arttıkça tesisimiz de büyüdü. Küçük bir atölyeden, SUP botlar, şişme botlar, SUP tahtaları ve aksesuarlar için özel üretim hatlarına sahip 12.000 m²'lik bir fabrikaya genişledik.
    - CNC kesim makinelerine, yüksek frekanslı kaynak ekipmanlarına, drop-stitch üretim hatlarına ve kapsamlı test düzeneklerine yatırım yaptık — bu sayede üretim kalitesinin her yönünü kontrol edebiliyoruz.
    - Bugün 200+ kişilik ekibimizde deniz mühendisleri, malzeme bilimcileri, kalite kontrol uzmanları ve yetenekli zanaatkarlar yer alıyor — birçoğu afarer'da ilk günlerden beri çalışıyor.
philosophy:
  tagline: Marka Felsefesi
  title: Suda Mühendislik Özgürlüğü
  body: Suda özgürlük sadece hareketle ilgili değildir. Yeni yerler keşfetmeyi, açık hava deneyimleri yaratmayı, insanları doğayla buluşturmayı ve profesyonel misyonları mümkün kılmayı temsil eder. Mühendislik bu özgürlüğü mümkün kılar.
  pillars:
    - title: Önce Güvenilirlik
      body: Su ortamları güven gerektirir. afarer ürünleri; stabilite, dayanıklılık, güvenlik ve tutarlı performans etrafında tasarlanmıştır.
    - title: İnsan Merkezli Tasarım
      body: Ürünler teknolojiye değil, insanlara hizmet etmelidir. Her tasarım kararı, insanların deniz araçlarını nasıl kullandığını, nereleri keşfettiğini ve hangi zorluklarla karşılaştığını anlamakla başlar.
    - title: Erişilebilir Keşif
      body: Su sadece uzmanlara ait olmamalıdır. afarer, daha fazla insanın nehirleri, gölleri, okyanusları ve kıyı ortamlarını güvenle deneyimlemesine olanak tanıyan ekipmanlar üretir.
    - title: Sürekli İnovasyon
      body: İnovasyon sadece yeni ürünler yaratmak değildir. Her detayı iyileştirmektir — malzemeler, yapılar, üretim ve kullanıcı deneyimi.
engineeringDna:
  tagline: Mühendislik DNA'sı
  title: afarer Ürünleri Nasıl Yaratır
  areas:
    - title: Malzeme Bilimi
      body: afarer, farklı deniz ortamları için uygun malzemelerin seçilmesine odaklanır. Temel hususlar arasında aşınma direnci, UV dayanımı, basınç stabilitesi ve uzun vadeli dayanıklılık yer alır.
      items:
        - Aşınma Direnci
        - UV Dayanımı
        - Basınç Stabilitesi
        - Uzun Vadeli Dayanıklılık
    - title: Yapısal Mühendislik
      body: Şişme deniz araçları, sertlik, ağırlık, taşınabilirlik ve stabilite arasında hassas bir denge gerektirir. afarer mühendisliği, drop-stitch çekirdek teknolojisi ve gelişmiş dikiş yapım yöntemleriyle bu faktörleri optimize etmeye odaklanır.
      items:
        - Sertlik
        - Ağırlık Optimizasyonu
        - Taşınabilirlik
        - Stabilite
    - title: Üretim Hassasiyeti
      body: 'Her ürün kontrollü süreçlerden geçer: malzeme hazırlığı, hassas kesim, kaynak ve yapıştırma, montaj, kalite denetimi ve performans doğrulaması.'
      items:
        - Malzeme Hazırlığı
        - Hassas Kesim
        - Kaynak ve Yapıştırma
        - Montaj ve Kalite Kontrol
    - title: Kullanıcı Senaryosu Mühendisliği
      body: Ürünler, gerçek uygulamalar etrafında geliştirilir — eğlence, macera ve profesyonel kullanım — her tasarımın hedef ortamının belirli taleplerini karşılamasını sağlar.
      items:
        - Eğlence
        - Macera
        - Profesyonel
        - Ticari

vision:
  tagline: Vizyonumuz
  title: Su Sporlarının Geleceğini Şıkillendiriyoruz
  body: >-
    afarer, sürekli yenilik, sarsılmaz kalite ve güvenlik ile sürdürülebilirliğe vững bir bağlılık yoluyla şişirilebilir tekne ve SUP endüstrisinde öncü olmayı hedefliyor — nihayetinde dünya genelinde su sporları tutkunlarının deneyimlerini zenginleştiriyor. afarer Ar-Ge Merkezi, tutkunun yenilikle
    buluştuğu ve su sporları endüstrisi için yeni standartlar belirlediği yerdir.
labs_section:
  tagline: Laboratuvarlar
  title: Laboratuvarlarımız
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC Kumaş Laboratuvarı
      description: Deniz ortamlarında uzun vadeli güvenilirliği sağlamak için PVC ve Hypalon tüp kumaşlarının çekme dayanımı, UV direnci, aşınma ve düşük sıcaklık esnekliği konusunda sürekli araştırma ve test.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Gövde Mühendislik Stüdyosu
      description: HDPE, alüminyum ve fiberglas gövdelerin CAD tabanlı tasarımı ve sonlu eleman analizi. Her gövde, ilk prototip inşa edilmeden önce gerilme dağılımı ve darbe dayanımı için dijital olarak simüle edilir.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: RF Kaynak Merkezi
      description: Hassas sıcaklık ve basınç kontrolüne sahip özel radyo frekansı kaynak tesisi, Şişilebilir tekneler için denizcilik endüstrisi standartlarına uygun yüksek mukavemetli, hava geçirmez dikişler üretir.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Hidrodinamik Test Tankı
      description: Kendi iç test tankımızda gövde formu, planing performansı, stabilite ve yakıt verimliliğini çeşitli yük ve deniz koşullarında optimize etmek için ölçekli model testi.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: Prototip Atölyesi
      description: Tam ölçekli prototip ve donatım tesisinde yeni modeller inşa edilir, donatılır ve deniz testlerine tabi tutulur. Üretim onayı öncesi her prototip en az 20 saatlik su içi test programından geçer.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Kalite ve Muayene Laboratuvarı
      description: Çekiş testi, hava tutma döngü testi, dikiş soyulma testi ve malzeme sertifikasyonu gerçekleştiren özel kalite güvence laboratuvarı, atölyeden çıkan her teknenin yayımlanan teknik özelliklerimizi karşılamasını sağlar.
      href: /randdcenter/quality-inspection-lab

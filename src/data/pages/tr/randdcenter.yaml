meta:
  title: Ar-Ge Merkezi | {SITE}
  description: Araştırma & Geliştirme — PVC kumaş testi, gövde mühendisliği, RF kaynağı, hidrodinamik test ve kalite kontrolü. Özel Ar-Ge hizmetleri mevcut.
hero:
  tagline: Ar-Ge Merkezi
  title: Ar-Ge Merkezi
  subtitle: İlerlemeye Odaklı
intro:
  - >-
    afarer'ın Araştırma ve Geliştirme (Ar-Ge) Merkezi, su sporları ekipmanlarını devrimleştirmeyi hedefleyen misyonumuzun arkasındaki itici güçtür. Şişirilebilir stand-up paddle boardları (SUP'lar) ve teknelerdeki sürekli yeniliklerle dünya genelindeki su sporları tutkunlarını daha güvenli, daha
    konforlu ve daha keyifli ürünlerle güçlendiriyoruz. Mühendislerimiz, tasarımcılarımız ve tutkulu su sporları uzmanlarımızdan oluşan ekibimiz, endüstrinin geleceğini şekillendirerek kalite, performans ve sürdürülebilirlik standartlarını sürekli olarak yükseltmektedir.
  - Ar-Ge tesisimiz malzeme bilimcileri, gemi mimarları ve üretim mühendislerini bir araya getirir. Kumaş formülasyonundan gövde simülasyonuna, kaynak süreci geliştirmeden tam ölçekli deniz denemelerine kadar, ürün geliştirme sürecinin her aşaması veriyle yönlendirilir ve testlerle doğrulanır.
mission:
  tagline: Misyonumuz
  title: Su Sporlarının Geleceğini İnovasyonla Şekillendirmek
  pillars:
    - icon: lightning
      title: Teknolojik İlerleme
      desc: Ürün performansı ve dayanıklılığı için yenilikçi malzemeler, tasarımlar ve üretim yöntemleri geliştiriyoruz.
    - icon: design
      title: Kullanıcı Odaklı Tasarım
      desc: Ergonomik ve sezgisel ürün tasarımıyla kullanıcı ihtiyaçlarını derinlemesine anlayarak ve aşarak.
    - icon: globe
      title: Sürdürülebilir Uygulamalar
      desc: Çevre dostu malzemeler ve süreçler kullanarak çevresel ayak izimizi en aza indiriyoruz.
    - icon: shield
      title: Tavizsiz Güvenlik
      desc: Sıkı testler ve sertifikasyon yoluyla en yüksek güvenlik standartlarını sağlamak.
pillars:
  - title: Teknolojik İlerleme
    desc: Üstün ürün performansı ve dayanıklılık sağlamak için yeni malzemeler, tasarımlar ve üretim süreçlerinde öncülük ediyoruz.
    icon: tech
  - title: İleri Malzemeler
    desc: Gelişmiş ürün özellikleri için ileri düzey PVC, Hypalon, kompozitler ve sürdürülebilir alternatiflerin araştırılması.
    icon: materials
  - title: Sürdürülebilirlik
    desc: 'Temel Bir Taahhüt: Sürdürülebilir üretim ve geri dönüşümlü malzemeler aracılığıyla çevresel sorumluluğumuzu yerine getirmeye kararlıyız.'
    icon: sustainability
capabilities:
  tagline: Kabiliyetler
  title: Ar-Ge Yetenekleri
  subtitle: Ürün geliştirme sürecinde hammadde araştırmasından nihai sertifikasyona kadar uçtan uca kontrol sağlayan dört temel disiplin.
  groups:
    - title: Malzeme Bilimi ve Kumaş Teknolojisi
      items:
        - PVC ve Hipalon formülasyon analizi ve optimizasyonu
        - UV stabilizasyonu, alev direnci ve antimikrobiyal katkı maddesi geliştirme
        - Çok katmanlı kumaş laminasyonu ve yapıştırma mühendisliği
        - Hızlandırılmış yaşlandırma testi (UV, termal, nem, tuzlu su püskürtme)
    - title: Gövde Mühendisliği ve Hidrodinamik
      items:
        - Parametrik 3D gövde tasarımı ve CFD optimizasyonu
        - Yapısal ve darbe yükleri için sonlu elemanlar analizi
        - Ölçekli model çekme tankı testi ve performans doğrulama
        - Özel görev profilleri için özel gövde geliştirme
    - title: Kaynak ve Birleştirme Teknolojisi
      items:
        - RF dielektrik kaynak süreci geliştirme ve optimizasyonu
        - Sıcak hava, sıcak kama ve ultrasonik kaynak yöntemleri
        - Yapıştırıcı bağlama ve dikiş bandı nitelendirme
        - Kaynak mukavemet modelleme ve ömür tahmini
    - title: Test, Sertifikasyon ve Uyumluluk
      items:
        - Kalite yönetimi ve CE uyumluluk testi
        - Bağımsız üçüncü taraf test ve sertifikasyon desteği
        - Satın alma nitelendirme için özel test protokolü geliştirilmesi
        - Servis arıza analizi ve kök neden araştırması

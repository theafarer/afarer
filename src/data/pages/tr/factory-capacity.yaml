hero:
  tagline: Üretim kapasitesi
  title: Üretim Kapasitesi ve Yıllık Üretim
  subtitle: 12.000 m² alanda yılda 15.000'den fazla tekne üretiliyor, ölçekleme için yer mevcut
intro: >-
  afarer, Çin'in Qingdao kentindeki en büyük özel şişme bot üretim tesislerinden birini işletmektedir. 12.000 m²'lik fabrikamız paralel çalışan altı özel atölye halinde organize edilmiş olup, bize SUP, kano, bot, SUP ve güvenlik ekipmanı hatlarında yılda 15.000'den fazla tekne üretme kapasitesi
  sağlıyor.
highlights:
  - value: 12.000 m²
    label: Toplam üretim alanı
    detail: 6 uzman atölyede
  - value: 15.000+
    label: Boats produced annually
    detail: SUP'ler, kanolar, SUP'ler, botlar, güvenlik teçhizatı
  - value: 200+
    label: Nitelikli iş gücü
    detail: 25+ mühendis, 2 vardiya/gün
  - value: 50+
    label: İhracat ülkeleri
    detail: AB, ABD, Avustralya, Orta Doğu, Asya
  - value: 30—5
    label: Standart termin süresi (gün)
    detail: PO onayından FOB'a
  - value: 10+
    label: Yıllık ihracat deneyimi
    detail: 2012'den Beri
workshops:
  - title: SUP Board Üretimi
    description: 'Şişirilebilir SUP tahtaları için 4 paralel montaj hattı. Her hat vardiyada 50—0 tahta üretebilir. Dijital baskı ve serigrafie istasyonları eş zamanlı çalışır. Yıllık SUP kapasitesi: 8.000+ tahta.'
    output: Yılda 8.000+ SUP
  - title: SUP Boat Production
    description: '7,6 m''ye kadar SUP gövdeler için 6 kalıp istasyonlu özel fiberglas gövde atölyesi. Boru kaynağı ve montaj alanı 3 — SUP''yi aynı anda yönetir. Yıllık SUP kapasitesi: 2.000''den fazla tekne.'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'Şişme botlar, kanolar ve botlar için çok amaçlı üretim hatları. Sıcak hava kaynak istasyonları, RF dielektrik presler ve montaj iş istasyonları, sipariş karışımına göre yeniden yapılandırılıyor. Yıllık kapasite: 5.000+ adet.'
    output: 5.000+ adet/yıl
  - title: Güvenlik Ekipmanları
    description: 'Can yelekleri ve güvenlik ekipmanları için ayrı temiz oda üretim alanı. Özel dikiş, köpük yerleştirme ve test istasyonları. Yıllık can yeleği kapasitesi: 50.000+ adet.'
    output: Yılda 50.000+ can yeleği
oem_capacity:
  moq: 'SUP: 5—0 units | SUP: 2— units | SUP/SUP: 10—0 units | Custom mould: 200+ units'
  lead_time: Standart 30~5 gün. Örnek 15~0 gün. Acele hizmet mevcut.
  payment: T/T %30 kaparo + sevkiyat öncesi %70. L/C, Western Union kabul edilir.

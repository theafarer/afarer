    - title: 'Belgeli Kalite'
      description: 'CE / ISO / BSCI / REACH — yoğun kullanım için güvenilir profesyonel ekipman.'
      icon: 'tabler:certificate'
    - title: 'Destek & Servis'
      description: 'Danışmanlık, yedek parça, garanti ve özel satış sonrası servis.'
      icon: 'tabler:headset'

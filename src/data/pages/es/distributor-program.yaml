features:
  title: 'Por Qué Asociarse con Afarer'
  subtitle: 'Diseñado para socios de canal que quieren hacer crecer un negocio de deportes acuáticos con una marca sólida detrás.'
  columns: 3
  items:
    - title: 'Exclusividad Territorial'
      description: 'Un mercado de país o región protegido. Un solo distribuidor, sin competencia interna, sin conflicto de canal: tu inversión construye tu propio foso.'
      icon: 'tabler:shield-check'
    - title: 'Márgenes Directos de Fábrica'
      description: 'Lista de precios de distribuidor con descuentos por volumen comprometido. Sin intermediarios. Envío FOB Qingdao con documentación de exportación completa.'
      icon: 'tabler:coins'
    - title: 'Programa de Éxito del Distribuidor'
      description: 'Onboarding estructurado, planificación de salida al mercado, formación de producto y ventas, apoyo de flota demo y herramientas de co-marketing.'
      icon: 'tabler:rocket'
    - title: 'Soporte de Marketing y Marca'
      description: 'Materiales de campaña localizados, material de punto de venta, kits para eventos y contenido digital en varios idiomas.'
      icon: 'tabler:mood-smile'
    - title: 'Cadena de Suministro Fiable'
      description: 'Fabricación certificada ISO y CE con control de calidad constante, MOQ predecibles y plazos que puedes planificar.'
      icon: 'tabler:building-factory'
    - title: 'Gestor de Cuenta Dedicado'
      description: 'Un gestor personal de distribución para previsiones, planificación de pedidos y soporte postventa.'
      icon: 'tabler:user-check'
table:
  title: 'Niveles del Programa y Condiciones de Pedido'
  subtitle: 'Elige el nivel que se adapta a tu potencial de mercado. Todos los precios en USD, FOB Qingdao.'
  caption: 'Los pedidos de muestra (5–10 unidades) no incluyen protección territorial. Las condiciones se acuerdan en tu Contrato de Distribuidor antes de cualquier envío.'
  head:
    - Nivel del Programa
    - Pedido Mínimo (unidades)
    - Plazo de Entrega
    - Pago
  rows:
    - [Muestra / Evaluación de Producto, 5–10, 15–20 días laborables, 100% prepago]
    - [Pedido de Prueba, 10–30, 30–45 días, 100% prepago]
    - [Distribuidor Autorizado, 30–50, 30–45 días, 30% depósito / 70% antes del envío]
    - [Distribuidor País / Regional, 100–300, 30–45 días, 30% depósito / 70% antes del envío]
    - [Personalizado y Marca Privada (estándar), 50+, 30–45 días, 30% depósito / 70% antes del envío]
    - [Personalización Profunda (nuevos moldes, embalaje), 200+, 45–60 días, 30% depósito / 70% antes del envío]
    - [Derechos de Línea Completa de Producto, 300–1, 000, 60–90 días, 30% depósito / 70% antes del envío]
faqs:
  title: 'Programa de Distribuidores — Preguntas Frecuentes'
  subtitle: 'Todo lo que preguntan los distribuidores antes de solicitarlo.'
  items:
    - title: '¿Qué significa un distribuidor por país?'
      description: 'Afarer concede a un único distribuidor autorizado derechos exclusivos sobre un país o región. Tú eres dueño de tu mercado: sin importaciones paralelas, sin competencia interna.'
    - title: '¿Cuál es el pedido mínimo inicial?'
      description: 'Los distribuidores de país y región empiezan en 100–300 unidades. Los distribuidores autorizados desde 30–50 unidades. Los pedidos de prueba desde 10–30 unidades te permiten validar el mercado primero (sin protección territorial).'
    - title: '¿Qué soporte reciben los distribuidores?'
      description: 'El programa de éxito del distribuidor incluye onboarding, planificación de salida al mercado, formación de producto y ventas, apoyo de flota demo, materiales de marketing localizados y un gestor de cuenta dedicado.'
    - title: '¿Cómo me protege Afarer de conflictos de canal?'
      description: 'Cada territorio tiene exactamente un distribuidor autorizado. Los pedidos directos de tu región se canalizan a través de ti y los precios protegen tu margen.'
    - title: '¿Cuáles son las condiciones de envío y pago?'
      description: 'Los pedidos se envían FOB Qingdao con documentación de exportación completa. Los pedidos de producción requieren 30% de depósito y 70% antes del envío; los pedidos de prueba y muestra son prepago.'
    - title: '¿Cómo solicito?'
      description: 'Envía una solicitud a través del formulario de contacto. Evaluamos el encaje de mercado, presencia minorista y capacidad logística, y respondemos en 3 días laborables con los siguientes pasos y un Contrato de Distribuidor de muestra.'
cta:

  sentence: 'Afarer se asocia con distribuidores establecidos de náutica, exterior y deportes que atienden cadenas minoristas, flotas de alquiler, escuelas de deportes acuáticos, resorts y compradores gubernamentales con tablas SUP inflables premium y embarcaciones.'
  audiences:

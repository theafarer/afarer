features:
  title: 'Por Qué Asociarse con Afarer'
  subtitle: 'Un modelo de un país, un distribuidor con la estructura de soporte necesaria para que el territorio sea rentable. La exclusividad se gana y se mantiene — no es un derecho permanente.'
  columns: 3
  items:
    - title: 'Exclusividad Territorial'
      description: 'Un distribuidor autorizado por país o región. Sin importaciones paralelas, sin competencia interna. Tu inversión construye tu propio foso.'
      icon: 'tabler:shield-check'
    - title: 'Protección Contra Conflictos de Canal'
      description: 'Los pedidos directos de tu región se canalizan a través de ti y los precios protegen tu margen. Afarer no vende sin pasar por sus socios de país.'
      icon: 'tabler:users'
    - title: 'Márgenes Directos de Fábrica y Rebates'
      description: 'Lista de precios de distribuidor con rebates por volumen comprometido. Sin intermediarios. Envío FOB Qingdao con documentación de exportación completa.'
      icon: 'tabler:coins'
    - title: 'Programa de Soporte al Socio de 10 Módulos'
      description: 'Onboarding, salida al mercado, formación, marketing y fondos conjuntos de marketing, recambios y postventa, garantía, herramientas de pedido y portal del socio — todo incluido en tu Distribution Agreement.'
      icon: 'tabler:rocket'
    - title: 'Marketing y Fondos Conjuntos de Marketing'
      description: 'Materiales de campaña localizados, material de punto de venta, kits para eventos, contenido digital multilingüe y apoyo de co-marketing para las temporadas de lanzamiento.'
      icon: 'tabler:mood-smile'
    - title: 'Formación de Producto, Ventas y Técnica'
      description: 'Sesiones de onboarding estructuradas sobre producto, ventas y conocimientos técnicos, con materiales actualizados a medida que evoluciona la gama.'
      icon: 'tabler:presentation'
    - title: 'Recambios y Soporte Postventa'
      description: 'Suministro de recambios, registro de garantías y gestión de reclamaciones, fichas técnicas y manuales de producto para tu equipo de servicio local.'
      icon: 'tabler:settings'
    - title: 'Gestor de Cuenta Dedicado y Portal del Socio'
      description: 'Un gestor de distribuidor personal, además de acceso a listas de precios, estado de pedidos y recursos de marketing a través del portal del socio de Afarer.'
      icon: 'tabler:user-check'
table:
  title: 'Niveles de Asociación, MOQ y Condiciones de Pedido'
  subtitle: 'Elige el nivel que se ajusta a tu potencial de mercado. Todos los precios en USD, FOB Qingdao.'
  caption: 'Los pedidos de muestra y prueba (5–30 unidades) no incluyen protección territorial. La exclusividad de país se aplica únicamente a los acuerdos Country / Regional Distributor firmados — se mantiene mediante la realización del primer pedido, objetivos de compra anuales, stock local, capacidad postventa e inversión continua en el mercado, y no es un derecho permanente o perpetuo.'
  head:
    - Nivel del Programa
    - Pedido Mínimo (unidades)
    - Plazo de Entrega
    - Pago
  rows:
    - [Muestra / Evaluación de Producto, 5–10, 15–20 días laborables, 100% prepaid]
    - [Pedido de Prueba, 10–30, 30–45 días laborables, 100% prepaid]
    - [Authorized Dealer, 30–50, 30–45 días laborables, 30% depósito / 70% antes del envío]
    - [Country / Regional Distributor, 100–300, 30–45 días laborables, 30% depósito / 70% antes del envío]
    - [Custom & Private Label (standard), 50+, 30–45 días laborables, 30% depósito / 70% antes del envío]
    - [Deep Custom (new molds, packaging), 200+, 45–60 días laborables, 30% depósito / 70% antes del envío]
    - [Full Product Line Rights, '300–1,000', 60–90 días laborables, 30% depósito / 70% antes del envío]
faqs:
  title: 'Socio de País — Preguntas Frecuentes'
  subtitle: 'Las preguntas que hacen los socios de país serios antes de solicitarlo.'
  items:
    - title: '¿Qué significa en realidad «un país, un distribuidor»?'
      description: 'Afarer nombra un único distribuidor autorizado con derechos exclusivos sobre un territorio definido. No vendemos desde nuestros canales globales o regionales dentro de un país protegido. Eres dueño de tu territorio mientras se cumpla la Distribution Agreement.'
    - title: '¿El territorio es exclusivo para siempre?'
      description: 'No. La exclusividad es condicional, no perpetua. Se mantiene mediante una Distribution Agreement firmada, la realización de tu primer pedido, objetivos de compra anuales, stock local, capacidad postventa e inversión continua en el mercado. Si no se cumplen, el territorio puede renegociarse o reasignarse.'
    - title: '¿Cuál es el primer pedido mínimo?'
      description: 'Los distribuidores de país y regionales empiezan en 100–300 unidades; los distribuidores autorizados, en 30–50 unidades; los pedidos de prueba de 10–30 unidades te permiten validar primero el mercado (los pedidos de prueba y muestra no incluyen protección territorial). Los programas personalizados y de marca privada siguen MOQ separados indicados en los niveles anteriores.'
    - title: '¿Qué incluye el programa de soporte de 10 módulos?'
      description: 'Niveles y calificación, protección territorial, MOQ / precios / rebates anuales, inventario y ejecución de pedidos, materiales de marketing y fondos conjuntos de marketing, formación de producto / ventas / técnica, recambios y postventa, registro de garantías, portal del socio, fichas técnicas de producto, biblioteca de materiales de marketing, calendario de rebates anuales y listas de envío y embalaje.'
    - title: '¿Cómo me protege Afarer de los conflictos de canal?'
      description: 'Cada territorio tiene exactamente un distribuidor autorizado. Las consultas y pedidos directos de tu región se canalizan a través de ti, los formularios del sitio se remiten al socio local cuando existe uno, y el equipo global solo interviene cuando un socio no responde.'
    - title: '¿Cuáles son las condiciones de envío y pago?'
      description: 'Los pedidos se envían FOB Qingdao con documentación de exportación completa. Los pedidos de producción requieren un 30% de depósito y el 70% antes del envío; los pedidos de prueba y muestra se pagan por adelantado. El plazo estándar es de 30–45 días laborables, y de 15–20 días laborables para las series de muestra.'
    - title: '¿Cómo solicito?'
      description: 'Envía tu solicitud a través del formulario de contacto con la información de tu mercado. Evaluamos el encaje en el mercado, la presencia minorista y la capacidad logística, y respondemos en 3 días laborables con los siguientes pasos y una Distribution Agreement de muestra.'

hero:
  tagline: Fábrica
  title: Fábrica y fabricación
  subtitle: 12.000 m² de fabricación integrada — de la materia prima al barco terminado
intro:
  - >-
    Como marca de fábrica de **Qingdao Vatrad Group Co., Ltd.**, afarer controla cada etapa de la producción — desde la llegada de las materias primas de PVC y fibra de vidrio hasta la inspección final previa a la entrega del barco terminado. Nuestra instalación de fabricación en la Zona de
    Desarrollo Económico de Qingdao abarca 12.000 metros cuadrados y alberga talleres dedicados al corte de PVC, el termosellado de tubos, la producción de cascos SUP de fibra de vidrio, la impresión digital de SUP, el ensamblaje final y las pruebas de calidad.
  - >-
    Al integrar el diseño, la ingeniería, el prototipado, la fabricación y las pruebas bajo un mismo techo, eliminamos las ineficiencias de la fabricación por contrato y mantenemos un control directo sobre la calidad de construcción, la selección de materiales y los plazos de entrega. Cada barco que
    sale de nuestro taller es construido por nuestra gente, con nuestros equipos, según nuestros estándares.

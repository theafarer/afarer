material_traceability:
  tagline: Trazabilidad
  title: Seguimiento de Materiales y Control de Lotes
  description: >-
    A cada lote de materia prima se le asigna un número de lote único en nuestro sistema ERP. Desde la llegada, pasando por la producción, hasta el producto terminado, la lista de materiales de cada embarcación se vincula al lote original del proveedor. Esto permite una trazabilidad completa hacia
    arriba para cualquier consulta de calidad o cumplimiento.
  system: ERP personalizado (sistema interno del Grupo Vatrad de Qingdao) etiquetas físicas de lote en cada orden de trabajo
  coverage: 100% de los materiales de producción — PVC, Hypalon, tela de costura en caída, adhesivos, válvulas, herrajes, embalaje
  records_retained: 10 años (según el requisito CE 2013/53/UE)
  suppliers:
    - material: PVC de grado marino
      source: Proveedores chinos y coreanos
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Proveedor japonés
      certified: ISO 9001, REACH
    - material: Tejido de puntada caída
      source: Tejido interno + socio externo
      certified: Control de calidad interno proveedor ISO 9001
    - material: Válvulas y Herrajes
      source: Proveedores OEM chinos
      certified: ISO 9001, certificados de material por lote

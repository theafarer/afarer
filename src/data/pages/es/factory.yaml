qc_section:
  tagline: Control de calidad
  title: Proceso de pruebas y garantía de calidad
  subtitle: Cada barco se somete a pruebas obligatorias antes del envío. Nuestro laboratorio de calidad opera de forma independiente de la producción y reporta directamente a la dirección.
  steps:
    - step: "1"
      title: Inspección de materias primas
      desc: Las telas de PVC, Hypalon y drop-stitch se someten a pruebas de tracción (), propagación de desgarros y verificación de resistencia a los rayos UV antes de que cualquier lote entre en producción.
    - step: "2"
      title: Prueba de retención de aire de 48 horas
      desc: Cada cámara de tubo se infla al 125% de la presión nominal y se mantiene durante 48 horas. Una caída de presión inferior al 5% activa el rechazo automático y la reinspección de las costuras.
    - step: "3"
      title: Prueba de carga y equilibrio
      desc: Los barcos terminados se cargan hasta su capacidad nominal máxima y se prueban para verificar estabilidad, francobordo y manejo. Cada embarcación se prueba en el agua antes de la inspección final.
oem_section:
  tagline: Proyectos OEM
  title: Estudios de caso de alianzas de marca y OEM
  subtitle: Del concepto al contenedor —cómo ayudamos a las marcas globales a lanzar y escalar sus líneas de embarcaciones inflables.
  cases:
    - challenge: Un minorista de artículos de exterior europeo necesitaba una línea de SUP de marca privada con gráficos de cubierta únicos, PVC ecológico y embalaje listo para la venta minorista, todo entregado en 60 días.
      solution: Desarrollamos archivos de impresión digital personalizados, obtuvimos PVC conforme a REACH y comprimimos el muestreo de 3 rondas a 1 al ubicar el equipo de diseño en nuestra fábrica de Qingdao.
      result: 55 días desde el pedido firmado hasta el FOB. 2.400 unidades en 4 SKU. Pedido de repetición realizado antes de que llegara el primer contenedor.
    - challenge: Una startup estadounidense de deportes acuáticos necesitaba un SUP drop-stitch de alto rendimiento con forma de casco personalizada, embalaje de marca compartida y certificación BSCI para su colocación minorista.
      solution: Adaptamos un molde de SUP drop-stitch existente con un perfil de rocker modificado, desarrollamos la obra gráfica del embalaje de marca compartida y proporcionamos la documentación completa de la auditoría BSCI.
      result: Listado con éxito en 3 grandes cadenas de exterior de EE. UU. Más de 5.000 unidades en el primer año con una tasa de venta del 98%.
    - challenge: Un distribuidor australiano requería una gama de SUP con certificación CE con colores de tubo personalizados, opción de mejora a Hypalon y cumplimiento de la norma australiana AS 1799.
      solution: Produjimos muestras de preproducción con 4 variantes de color de tubo, obtuvimos Hypalon CSM de un proveedor japonés y coordinamos las pruebas de cumplimiento de terceros de la AS 1799.
      result: Gama de SUP de 3 modelos lanzada en el mercado AU/NZ. Seguida por la adjudicación de una licitación gubernamental de 12 SUP de patrulla.
faq_section:
  tagline: Preguntas frecuentes
  title: Preguntas frecuentes B2B y OEM
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para tablas de SUP inflables OEM?
      a: El MOQ comienza en 5—0 unidades para los modelos OEM estándar. Los moldes personalizados y los proyectos de marca privada requieren un mínimo de 200 unidades según la complejidad. Hay pedidos de prueba y series de muestra disponibles para el lanzamiento de nuevas marcas.
    - q: ¿afarer posee la certificación BSCI?
      a: Sí. Nuestra fábrica mantiene una certificación válida de cumplimiento social BSCI (informe de auditoría disponible bajo solicitud). También contamos con la certificación de gestión de calidad y todos los productos llevan la certificación CE. Documentación de cumplimiento de REACH y RoHS proporcionada con cada envío OEM.
    - q: ¿Cuál es el plazo de entrega típico para un pedido OEM?
      a: Sí. Nuestra fábrica mantiene una certificación válida de cumplimiento social BSCI (informe de auditoría disponible bajo solicitud). También contamos con la certificación de gestión de calidad y todos los productos llevan la certificación CE. Documentación de cumplimiento de REACH y RoHS proporcionada con cada envío OEM.
    - q: ¿Pueden enviar FOB Qingdao o CIF a nuestro puerto?
      a: Sí. Enviamos FOB Qingdao, CIF a los principales puertos globales y DDP para socios cualificados. Nuestro equipo de logística gestiona la reserva de contenedores, la documentación de exportación y el despacho de aduanas. Enviamos a más de 50 países en los mercados de la UE, EE. UU., AU y Asia.
b2b_moq: "MOQ estándar: 5—0 unidades por modelo (SUP/SUP/drop-stitch). MOQ de SUP: 2— unidades. Se aceptan pedidos de prueba para nuevas alianzas."
production_flow:
  tagline: Production Flow
  title: From Material to Finished Boat
  subtitle: Every boat passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: "01"
      title: Material Receiving & Incoming QC
      description: All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.
      qc_check: Tensile strength (ASTM D751), tear resistance (ISO 4674), thickness gauge, adhesive viscosity, visual defect scan
      qc_threshold: 100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect
      responsibility: Incoming QC team (3 inspectors)
    - stage: "02"
      title: CNC Cutting & Material Prep
      description: Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.
      qc_check: Dimensional check against CAD DXF files, edge quality inspection, panel count verification
      qc_threshold: Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance
      responsibility: Cutting workshop lead
    - stage: "03"
      title: Welding & Drop-Stitch Bonding
      description: Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.
      qc_check: Peel test every 50 units (ASTM D751), weld width measurement, hot-air temperature log review, visual seam inspection under backlight
      qc_threshold: Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject
      responsibility: Welding QC (2 inspectors per shift)
    - stage: "04"
      title: Assembly & Rigging
      description: "Boats move to final assembly where all components are mated: hull + tubes, valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist."
      qc_check: 100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection
      qc_threshold: "Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)"
      responsibility: Assembly team lead + line QC
    - stage: "05"
      title: Pressure Testing & Quality Hold
      description: Every chamber is inflated to 1.25× rated pressure (typically 20—5 PSI) and held for 24—8 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.
      qc_check: 24h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair
      qc_threshold: Max 5% pressure drop over 24h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch
      responsibility: Quality lab (independent of production, reports to management)
    - stage: "06"
      title: Final Inspection & Packing
      description: Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.
      qc_check: Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification
      qc_threshold: AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected
      responsibility: Final QC team (4 inspectors) + Packing team lead

workshops_section:
  tagline: Talleres
  title: Talleres de fabricación
  workshops:
    - title: Corte de PVC y preparación de materiales
      description: Las máquinas de corte CNC automáticas procesan telas de PVC, Hypalon y drop-stitch con precisión submilimétrica. El anidado optimizado por computadora minimiza el desperdicio de material y garantiza que cada panel cumpla con sus especificaciones dimensionales antes de la soldadura.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Soldadura y termosellado de tubos
      description: Taller de soldadura dedicado con máquinas de termosellado y prensas dieléctricas RF. Las selladoras de aire caliente unen y fusionan las cámaras de los tubos de PVC, mientras que las soldaduras RF producen costuras herméticas de alta resistencia que superan los requisitos ISO 6185.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: Producción de cascos SUP — fibra de vidrio
      description: >-
        Los cascos de los botes SUP se producen mediante moldeo de fibra de vidrio con laminado manual, con sistemas de resina de poliéster y viniléster. Cada capa se enrolla a mano y se embolsa al vacío para lograr una calidad constante. La cabina de aplicación de gelcoat proporciona un acabado
        marino de alto brillo y resistente a los rayos UV.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: Impresión y decoración de SUP
      description: Las tablas de SUP se decoran mediante impresión digital para gráficos a todo color y serigrafía para logotipos y patrones repetitivos. Las impresoras digitales producen diseños de cubierta con calidad fotográfica, mientras que la serigrafía ofrece marcas de marca duraderas y vívidas.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Ensamblaje final y aparejado
      description: Línea de ensamblaje donde se acoplan los cascos de fibra de vidrio y los tubos de PVC, se montan los motores, se conectan la dirección y los controles, y se cablean los sistemas eléctricos. Cada barco sigue una lista de verificación de ensamblaje de 100 puntos aprobada por el jefe de equipo.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Pruebas de calidad e inspección
      description: Cada barco terminado se somete a pruebas obligatorias de retención de aire, verificación del pelado de costuras y una comprobación completa de sistemas antes del envío. Nuestro laboratorio de calidad opera de forma independiente de la producción y reporta directamente a la dirección.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

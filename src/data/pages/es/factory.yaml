qc_section:
  tagline: Control de calidad
  title: Proceso de pruebas y garantía de calidad
  subtitle: Cada barco se somete a pruebas obligatorias antes del envío. Nuestro laboratorio de calidad opera de forma independiente de la producción y reporta directamente a la dirección.
  steps:
    - step: '1'
      title: Inspección de materias primas
      desc: Las telas de PVC, Hypalon y drop-stitch se someten a pruebas de tracción (ASTM D751), propagación de desgarros y verificación de resistencia a los rayos UV antes de que cualquier lote entre en producción.
    - step: '2'
      title: Prueba de retención de aire de 48 horas
      desc: Cada cámara de tubo se infla al 125% de la presión nominal y se mantiene durante 48 horas. Una caída de presión inferior al 5% activa el rechazo automático y la reinspección de las costuras.
    - step: '3'
      title: Prueba de carga y equilibrio
      desc: Los barcos terminados se cargan hasta su capacidad nominal máxima y se prueban para verificar estabilidad, francobordo y manejo. Cada embarcación se prueba en el agua antes de la inspección final.
oem_section:
  tagline: Proyectos OEM
  title: Estudios de caso de alianzas de marca y OEM
  subtitle: Del concepto al contenedor — cómo ayudamos a las marcas globales a lanzar y escalar sus líneas de embarcaciones inflables.
  cases:
    - challenge: Un minorista de artículos de exterior europeo necesitaba una línea de SUP de marca privada con gráficos de cubierta únicos, PVC ecológico y embalaje listo para la venta minorista, todo entregado en 60 días.
      solution: Desarrollamos archivos de impresión digital personalizados, obtuvimos PVC conforme a REACH y comprimimos el muestreo de 3 rondas a 1 al ubicar el equipo de diseño en nuestra fábrica de Qingdao.
      result: 55 días desde el pedido firmado hasta el FOB. 2.400 unidades en 4 SKU. Pedido de repetición realizado antes de que llegara el primer contenedor.
    - challenge: Una startup estadounidense de deportes acuáticos necesitaba un SUP drop-stitch de alto rendimiento con forma de casco personalizada, embalaje de marca compartida y certificación BSCI para su colocación minorista.
      solution: Adaptamos un molde de SUP drop-stitch existente con un perfil de rocker modificado, desarrollamos la obra gráfica del embalaje de marca compartida y proporcionamos la documentación completa de la auditoría BSCI.
      result: Listado con éxito en 3 grandes cadenas de exterior de EE. UU. Más de 5.000 unidades en el primer año con una tasa de venta del 98%.
    - challenge: Un distribuidor australiano requería una gama de SUP con certificación CE con colores de tubo personalizados, opción de mejora a Hypalon y cumplimiento de la norma australiana AS 1799.
      solution: Produjimos muestras de preproducción con 4 variantes de color de tubo, obtuvimos Hypalon CSM de un proveedor japonés y coordinamos las pruebas de cumplimiento de terceros de la AS 1799.
      result: Gama de SUP de 3 modelos lanzada en el mercado AU/NZ. Seguida por la adjudicación de una licitación gubernamental de 12 SUP de patrulla.
faq_section:
  tagline: Preguntas frecuentes
  title: Preguntas frecuentes B2B y OEM
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para tablas de SUP inflables OEM?
      a: El MOQ comienza en 5–10 unidades para los modelos OEM estándar. Los moldes personalizados y los proyectos de marca privada requieren un mínimo de 200 unidades según la complejidad. Hay pedidos de prueba y series de muestra disponibles para el lanzamiento de nuevas marcas.
    - q: ¿afarer posee la certificación BSCI?
      a: >-
        Sí. Nuestra fábrica mantiene una certificación válida de cumplimiento social BSCI (informe de auditoría disponible bajo solicitud). También contamos con la certificación ISO 9001 de gestión de calidad y todos los productos llevan la certificación CE. Documentación de cumplimiento de REACH y RoHS
        proporcionada con cada envío OEM.
    - q: ¿Cuál es el plazo de entrega típico para un pedido OEM?
      a: >-
        El plazo de entrega estándar es de 30 a 45 días desde el pedido confirmado y el depósito para la producción OEM en serie. El desarrollo de moldes personalizados añade 15 a 20 días para la fabricación de utillaje. Hay producción acelerada disponible para pedidos urgentes y picos estacionales.
        Las muestras de prototipo normalmente se envían en un plazo de 15 a 20 días.
    - q: ¿Pueden enviar FOB Qingdao o CIF a nuestro puerto?
      a: >-
        Sí. Enviamos FOB Qingdao, CIF a los principales puertos globales y DDP para socios cualificados. Nuestro equipo de logística gestiona la reserva de contenedores, la documentación de exportación y el despacho de aduanas. Enviamos a más de 50 países en los mercados de la UE, EE. UU., AU y
        Asia.
b2b_moq: 'MOQ estándar: 5–10 unidades por modelo (SUP/drop-stitch). MOQ de SUP: 2–5 unidades. Se aceptan pedidos de prueba para nuevas alianzas.'
production_flow:
  tagline: Flujo de producción
  title: De material a barco terminado
  subtitle: Cada barco pasa por 6 etapas de producción con puntos de control de calidad en cada paso. No hay atajos, no se omiten inspecciones.
  stages:
    - stage: '01'
      title: Recepción de Material y Control de Calidad Entrante
      description: Todos los materiales entrantes se registran por número de lote en nuestro sistema ERP. Los rollos de tela de PVC, los núcleos de costura de caída, las válvulas, los adhesivos y el hardware se ponen en cuarentena hasta la aprobación de control de calidad.
      qc_check: Resistencia a la tracción (ASTM D751), resistencia al desgarro (ISO 4674), medidor de espesor, viscosidad del adhesivo, inspección visual de defectos
      qc_threshold: 100% de los lotes probados. Rechazar si la resistencia a la tracción es < 90% de la especificación, el desgarro < mínimo de la especificación, o cualquier defecto visual
      responsibility: Equipo de control de calidad entrante (3 inspectores)
    - stage: '02'
      title: Corte CNC y Preparación de Material
      description: El anidamiento optimizado por computadora dispone los paneles en el material de PVC para minimizar el desperdicio. Las máquinas de corte CNC automáticas mantienen una precisión posicional de 0,1 mm.
      qc_check: Verificación dimensional contra archivos CAD DXF, inspección de calidad de bordes, verificación del conteo de paneles
      qc_threshold: Se mide cada vigésimo panel. Tolerancia ±0,5 mm. Rechazar el lote si >2% está fuera de tolerancia
      responsibility: Responsable del taller de corte
    - stage: '03'
      title: Soldadura y unión por puntada caída
      description: Los núcleos de puntada caída se unen a las láminas externas de PVC mediante laminación en caliente. Las cámaras de los tubos se sueldan por RF o por aire caliente. Las bandas del riel se fusionan en tres capas mediante unión por fusión.
      qc_check: Prueba de pelado cada 50 unidades (ASTM D751), medición del ancho de soldadura, revisión del registro de temperatura del aire caliente, inspección visual de la costura bajo luz de fondo
      qc_threshold: Resistencia al despegue mínima 8 N/cm. Tolerancia del ancho de soldadura ±1 mm. Cualquier canalización visible = rechazar
      responsibility: Control de calidad de soldadura (2 inspectores por turno)
    - stage: '04'
      title: Montaje y aparejo
      description: 'Los barcos se trasladan al ensamblaje final donde se ensamblan todos los componentes: casco, tubos, válvulas instaladas, anillas en D, asas, cajas de aletas y ajuste de la bolsa de transporte. Cada unidad sigue una lista de verificación de ensamblaje de 100 puntos.'
      qc_check: Firma de lista de verificación de 100 puntos por unidad, prueba de funcionamiento de la válvula (10 ciclos de apertura/cierre), verificación de torque del hardware, inspección visual
      qc_threshold: 'Política de cero defectos en artículos críticos para la seguridad (válvulas, anillas en D, manijas). Cosmético menor: AQL 2.5 (ISO 2859)'
      responsibility: Líder de equipo de ensamblaje + control de calidad en línea
    - stage: '05'
      title: Prueba de presión y retención de calidad
      description: Cada cámara se infla a 1,25× la presión nominal (típicamente 20–25 PSI) y se mantiene durante 24–48 horas. Los sensores de presión registran continuamente. Las cámaras que superan una caída de presión del 5 % son rechazadas y enviadas para una reinspección de las costuras.
      qc_check: Registro de presión de 24 h, calibración del sensor verificada diariamente, lectura de presión compensada por temperatura, re-prueba de la costura después de la reparación
      qc_threshold: Caída de presión máxima del 5% durante 24 horas a temperatura estable. Cualquier cámara que exceda esto = 100% re-prueba de todo el lote de producción
      responsibility: Laboratorio de calidad (independiente de la producción, reporta a la dirección)
    - stage: '06'
      title: Inspección Final y Empaque
      description: Inspección visual y funcional final. Defectos en la superficie, consistencia del color, verificación de etiquetas/BIN, integridad del empaque y completitud de los accesorios. Las unidades están envasadas al vacío, empacadas en cajas y paletizadas para la carga en contenedor.
      qc_check: Inspección visual completa, lista de accesorios por SKU, prueba de caída del embalaje (1 m, muestra aleatoria), verificación de escaneo de etiqueta/código de barras
      qc_threshold: AQL 2.5 para defectos graves, AQL 4.0 para defectos menores. Tolerancia cero en defectos de seguridad. 100% de las unidades inspeccionadas visualmente
      responsibility: Equipo de control de calidad final (4 inspectores) + Líder del equipo de empaque

  inflatable: SUP inflables diseñados para portabilidad sin sacrificar rendimiento. Elija la talla adecuada según su peso y estilo de remado.
  sup: Tablas de paddle surf para excursiones, yoga, fitness y remo recreativo. Elige según la longitud y el peso del usuario.

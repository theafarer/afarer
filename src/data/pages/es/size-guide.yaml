how_to_choose:
  title: Cómo elegir la talla correcta
  cards:
    - title: Tablas SUP
      description: Elija la longitud según su peso y uso previsto. Las tablas más anchas (32"+) ofrecen más estabilidad. Las tablas más largas (11-12 pies) trackean mejor para touring. Los remeros más pesados necesitan tablas de mayor volumen.
    - title: SUPs de Travesía
      description: Las tablas más largas (11–12 pies) son las mejores para cubrir distancia y travesías. Las tablas más anchas (32"+) ofrecen más estabilidad. Verifique la capacidad de peso para la carga total incluyendo equipo.
    - title: SUPs All-Around
      description: Elija la longitud según el peso del rider y el uso previsto. Las tablas all-around sirven para recreación, fitness y yoga. Las tablas más pequeñas son más maniobrables.

  title: Cómo Funciona el Drop Stitch — La Ingeniería Detrás de los Núcleos Rígidos Inflables
  subtitle: Lectura de 8 min
content_html: >
  <h2>¿Qué es el punto caído?</h2>

  <p>La puntada caída (también llamada "tejido de puntada caída" o "núcleo de puntada caída") es un método de construcción en el que miles de hilos individuales de poliéster conectan las capas superior e inferior de una capa de tela. Cuando la carcasa se infla, estas roscas actúan como elementos de
  tensión interna: evitan que los paneles superior e inferior se abulten hacia fuera formando una forma redonda, obligando al panel a permanecer plano y rígido.</p>

  <p>El resultado es una estructura ligera y portátil que puede soportar entre 15 y 20 PSI de presión interna, comparable a la rigidez de una placa de carcasa rígida, pero totalmente desinflable para su almacenamiento y transporte.</p>


  <h2>Cómo funciona: La física</h2>

  <p>En una estructura inflable convencional (como un globo o un colchón hinchable), la presión interna del aire se desplaza por igual en todas las direcciones. Sin sujeción interna, la estructura se vuelve cilíndrica o esférica. El punto de caída soluciona esto introduciendo refuerzo a la
  tracción:</p>

  <ul>
    <li>Miles de hilos conectan las capas superior e inferior de tela</li>
    <li>Cuando se infla, la presión del aire intenta separar la parte superior y inferior</li>
    <li>Las roscas resisten esta separación, transfiriendo la carga a la tensión a lo largo del eje de la rosca</li>
    <li>El resultado es un panel plano y rígido que resiste la flexión</li>
  </ul>


  <h2>Proceso de construcción</h2>

  <ol>
    <li><strong>Tejido:</strong> Los hilos de poliéster se entrelazan simultáneamente en dos capas separadas de tela base (normalmente 1.100 DTEX o 1.680 DTEX poliéster recubierto de PVC). Los hilos se entrelazan en lazo entre las capas en un ángulo de 90°.</li>
    <li><strong>Recubrimiento:</strong> La base tejida se recubre con PVC (o ocasionalmente TPU) mediante un proceso de recubrimiento con cuchillo o recubrimiento calendario. Esto sella las roscas y crea la membrana hermética.</li>
    <li><strong>Unión de capas:</strong> El núcleo de punto de gota se une a capas laminadas exteriores (normalmente PVC de 0,9 mm o 1,2 mm) mediante laminación térmica o adhesivo.</li>
    <li><strong>Soldadura:</strong> Las bandas de raíles se sueldan a lo largo de los bordes mediante soldadura a aire caliente, soldadura RF o soldadura de alta frecuencia para crear las paredes laterales de la placa.</li>
    <li><strong>Instalación de válvulas:</strong> Se instalan válvulas Boston o válvulas Halkey-Roberts, normalmente con un mecanismo de alivio de presión para evitar la sobreinflación.</li>
  </ol>


  <h2>Indicadores clave de calidad</h2>

  <table class="w-texto completo-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameter</th>
        <ª clase="p-3 texto-izquierda-texto seminegrita-gris-borde 900">Nivel de entrada</th>
        <ª clase="p-3 texto-izquierda-fuente-seminegrita texto-gris-borde 900">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 borde">Thread density</td><td class="p-3 borde">1 hilo / sq in</td><td class="p-3 borde">2 hilos / sq in</td></tr>
      <tr><td class="p-3 borde">Base tela</td><td clase="p-3 borde">1.100 DTEX</td><td clase="p-3 borde">1.680 DTEX</td></tr>
      <tr><td class="p-3 borde">Presión máxima</td><td clase="p-3 borde">12 – 15 PSI</td><td clase="p-3 borde">18 – 22 PSI</td></tr>
      <tr><td class="p-3 borde">PVC espesor</td><td class="p-3 borde">0,6 – 0,9 mm</td><td class="p-3 borde">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 borde">Construcción de raíles</td><td class="p-3 borde">Doblado y pegado</td><td class="p-3 borde">Soldado y fusionado</td></tr>
    </tbody>
  </table>


  <h2>Aplicaciones</h2>

  <ul>
    <li><strong>Placas SUP:</strong> 4" – 6" de grosor, 15 – 20 PSI, 1 – 2 roscas por pulgada cuadrada</li>
    <li><strong>Kayaks:</strong> Cámaras laterales inflables de suelo con punto de caída, suelo de 10 a 15 PSI</li>
    <li><strong>Suelos de costillas:</strong> Suelos de puntadas caídas para tenders ligeros y plegables de RIB, 12 – 18 PSI</li>
    <li><strong>Guardabarros de barco:</strong> Puntada de caída de baja presión para guardabarros moldeados con caras planas</li>
  </ul>


  <h2>Puntada de caída vs. cubierta de aire (fibra de vidrio o núcleo de madera)</h2>

  <p>Las tablas de carcasa dura utilizan núcleos de espuma EPS con refuerzo de fibra de vidrio o madera. Son más ligeras, rígidas y más receptivas, pero no se pueden desinflar. El punto de caída sacrifica algo de rigidez por una portabilidad total. Para la mayoría de los usuarios recreativos, los
  SUP modernos de puntadas caídas a 20 PSI son indistinguibles de las tablas duras de nivel básico en rigidez.</p>


  <h2>Cómo Afarer utiliza el punto de caída</h2>

  <p>Afarer utiliza un núcleo de puntada caída DTEX de 1.680 en toda su gama SUP, con 2 hilos por pulgada cuadrada y un laminado exterior de PVC de 1,2 mm. Las placas están clasificadas para 20 PSI y se someten a una prueba de mantenimiento de presión de 24 horas a 1,5 veces la presión nominal antes
  del envío. Las bandas de los raíles se soldan con aire caliente con fusión triple capa, y las válvulas de alivio de presión son estándar en todos los modelos.</p>

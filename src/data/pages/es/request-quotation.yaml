meta:
  title: 'Solicitar un Presupuesto — Fabricación OEM de SUP | {SITE}'
  description: 'Solicite un presupuesto detallado para su proyecto de SUP hinchable o barca. Fabricación OEM/ODM, marca privada o flotas personalizadas: respondemos en 2 días laborables.'
  keywords:
    - 'solicitar presupuesto de SUP'
    - 'presupuesto OEM paddle surf'
    - 'cotización de fábrica de SUP'
    - 'precio de SUP hinchable'
hero_text:
  tagline: Obtener una cotización
  title: Solicite un Presupuesto<br />para su Proyecto
  subtitle: Cuéntenos sus requisitos. Respondemos con presupuesto detallado en 2 días hábiles.
steps2_process:
  title: Cómo Funciona
  subtitle: Cuatro pasos simples desde la consulta hasta el presupuesto.
  items:
    - title: 'Paso 1: Envíe sus requisitos'
      description: Complete el formulario con tipo de producto, cantidad y especificaciones.
      icon: tabler:file-text
    - title: 'Paso 2: Revisamos y asesoramos'
      description: Nuestro equipo de ingeniería revisa sus requisitos y recomienda configuraciones.
      icon: tabler:users
    - title: 'Paso 3: Reciba su presupuesto'
      description: Recibe un presupuesto detallado con precios, MOQ, plazos, condiciones de pago y envío. Generalmente en 48 horas.
      icon: tabler:currency-dollar
    - title: 'Paso 4: Muestra y Producción'
      description: Tras la aceptación del presupuesto, procedemos a la producción de muestras o directamen
      icon: tabler:building-factory
content_form:
  tagline: Formulario de Cotización
  title: Cuéntenos sobre su proyecto
  subtitle: Todos los campos con * son obligatorios.
  contact_fields:
    firstName: Nombre
    lastName: Apellido
    companyName: Nombre de la empresa
    email: Correo electrónico
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Centro de buceo
        - Pesca
        - Turismo Marino / Resort
        - Búsqueda y rescate
        - Lancha auxiliar de yate
        - Barco de trabajo comercial
        - Gobierno / Militar
        - Fabricante de equipo original / Marca privada
        - Personal / Recreativo
        - Otros
    - name: Target Market
      type: text
      placeholder: p. ej. Europa, Norteamérica, Oriente Medio
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: p. ej. entrega en un plazo de 90 días
    - name: Additional Requirements
      type: textarea
      options:
        - Sin preferencia
        - PVC de grado marino (1100 dtex)
        - Hypalon / CSM Premium
        - Casco de fibra de vidrio
        - Casco de aluminio
    - name: Engine Requirement
      type: text
      placeholder: p. ej. motor fuera de borda de 60 HP, sin motor, doble 115 HP
    - name: Customization Required
      type: text
      placeholder: por ejemplo, colores personalizados, marca/logotipo, embalaje, accesorios especiales
    - name: Timeline
      type: text
      placeholder: por ejemplo, entrega dentro de 90 días
    - name: Additional Requirements
      type: textarea
      placeholder: Describa su aplicación, especificaciones técnicas o cualquier requisito especial —incluya dibujos de referencia, especificaciones o enlaces si están disponibles
    - name: Upload Specification
      type: file
      placeholder: Sube tu hoja de especificaciones, dibujo o documento de referencia (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Sube tu logo o arte para personalización de marca (AI, EPS, PNG)
cta:
  title: ¿Prefiere discutir por correo?
  subtitle: Envíe su consulta directamente a nuestro equipo de ventas. Respondemos en 24 horas.
  actions:
    - variant: primary
      text: Envíanos un correo electrónico directamente
      href: /contact

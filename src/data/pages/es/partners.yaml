  keywords:
    - 'socio de distribución de SUP'
    - 'paddle surf al por mayor'
    - 'distribuidor de SUP hinchable'
    - 'asociación de SUP'
hero:
  tagline: Socios y Distribución
  title: Sea socio de afarer<br />— Red Global de Distribución
  subtitle: Únase a la red global afarer. Trabajamos con distribuidores en 50+ países.
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: red global de socios y distribuidores de Afarer
content_programs:
  tagline: Programas de socios
  title: Programas de Socios<br />Diseñados para el Crecimiento
  subtitle: Distribuidor, revendedor o socio de marca – tenemos programas para usted.
  columns: 3
  items:
    - title: Programa de Distribuidor
      description: Distribución exclusiva con precios por volumen, marketing y acceso a fábrica.
      icon: tabler:world
    - title: Programa de Distribuidores
      description: Precios de revendedor, formación, materiales de marketing y soporte de garantía.
      icon: tabler:building-store
    - title: Asociación OEM/ODM
      description: Fabricación OEM/ODM completa con marca, empaque y especificaciones personalizadas.
      icon: tabler:certificate
    - title: Asociación de Marca
      description: Co-branding, marca blanca y programas exclusivos para marcas establecidas.
      icon: tabler:stars
    - title: Gobierno & Institucional
      description: Programas de proveedor preferente para agencias, guardacostas, ejército y organizaciones humanitarias.
      icon: tabler:building-community
    - title: Socio de Resort y Alquiler
      description: Precios de flota, calidad constante y marca personalizada para resorts, centros de buceo y alquileres.
      icon: tabler:sun
content_benefits:
  tagline: Por qué asociarse con nosotros
  title: Por qué los Socios Eligen afarer
  subtitle: Nuestros socios se benefician de capacidad de fabricación real, calidad constante y soporte receptivo.
  list:
    - 'Acceso directo a fábrica: trabaje directamente con nuestro equipo de fabricación'
    - 'Personalización lista: marque sus productos con colores, logotipos y empaques personalizados'
    - 'Calidad garantizada: producción certificada ISO 9001 con cumplimiento CE, UKCA y BSCI'
    - 'Logística global: envío desde Qingdao, China con opciones FOB, CIF y DDP'
    - 'Soporte de marketing: catálogos de productos, fotografía, documentación técnica y activos digitales'
    - 'Capacitación y soporte: formación de productos para su equipo de ventas, soporte técnico para sus clientes'
content_process:
  tagline: Cómo convertirse en socio
  title: Proceso de Asociación Simple
  subtitle: Nuestro proceso es sencillo – diseñado para vender rápidamente.
  items:
    - title: 'Paso 1: Enviar Solicitud'
      description: Formulario de solicitud con perfil, mercado objetivo e intereses de producto.
    - title: 'Paso 2: Revisión de Calificación'
      description: Nuestro equipo revisa su solicitud y lo contacta en 3 días hábiles.
    - title: 'Paso 3: Acuerdo y Configuración'
      description: Firme el acuerdo, configure su cuenta, reciba precios y muestras.
    - title: 'Paso 4: Capacitación y Lanzamiento'
      description: Capacitación, apoyo de ventas y materiales proporcionados. Listo para vender.
cta:
  title: ¿Listo para ser socio de afarer?
  subtitle: Solicite una asociación. Respondemos en 3 días hábiles.
  actions:
    - variant: primary
      text: Solicitar asociación
      href: /contact
    - text: Ver nuestros productos

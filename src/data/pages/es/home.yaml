business_solutions:
  tagline: Cómo ayudamos
  title: Tu socio desde el concepto hasta los ingresos
  subtitle: Cuatro capacidades principales que ayudan a las empresas de agua a lanzar, operar y crecer.
  items:
    - title: Equipo profesional
      description: Tablas de SUP de grado comercial diseñadas para uso de alquiler diario, 500 ciclos con mantenimiento mínimo.
      icon: tabler:shield-check
    - title: Colecciones co-branded
      description: Colecciones co-branded limitadas diseñadas, desarrolladas y fabricadas con Afarer — cada tabla sigue siendo un producto Afarer.
      icon: tabler:package
    - title: Soporte Empresarial
      description: Capacitación del personal, materiales de marketing, programas de repuestos y gestión de cuentas dedicada.
      icon: tabler:headset
    - title: Logística Global
      description: FOB Qingdao, CIF principales puertos, entrega puerta a puerta a más de 50 países con apoyo aduanero.
      icon: tabler:truck-delivery
oem_section:
  tagline: Colecciones Co-Branded
  title: De la idea al agua — ediciones co-branded
  subtitle: 'Para socios que quieren algo más que un producto de catálogo: colecciones co-branded limitadas diseñadas, desarrolladas y fabricadas con Afarer, mientras cada tabla sigue siendo un producto Afarer.'
  steps:
    - number: Uno
      title: Idea y Resumen
      desc: Comparte tu visión, mercado objetivo y especificaciones.
    - number: Dos
      title: Diseño e Ingeniería
      desc: Modelado 3D, selección de materiales y diseño gráfico personalizado.
    - number: Tres
      title: Prototipar y Validar
      desc: Producción de muestra con certificación CE y pruebas de calidad.
    - number: Cuatro
      title: Producción en masa
      desc: Fabricación a gran escala con control de calidad en línea y soporte de auditoría de fábrica.
    - number: Cinco
      title: Entrega Global
      desc: Logística FOB Qingdao, CIF principales puertos, puerta a puerta.
  cta: Explora el co-branding
  cta_link: /co-brand
cta:
  title: |
    ¿Listo para el agua? <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">Estamos aquí para ayudarte.</span>
  subtitle: Todos los productos con certificación CE, cada compra respaldada por garantía. Contáctanos para asesoría, presupuestos o repuestos.
  actions:
    - variant: primary
      text: Ver todos los productos
      href: /products
      icon: tabler:shopping-bag
    - text: Habla con nuestro equipo
      href: /contact
distributor:
  tagline: Distribuidores Exclusivos por País
  title: Un país. Un distribuidor oficial de Afarer.
  subtitle: Un programa de un distribuidor por país con exclusividad territorial, precios de distribuidor, soporte de marketing y un Distributor Success Program dedicado.
  benefits:
    - title: Exclusividad Territorial
      description: Un distribuidor autorizado por país o región — sin competencia interna ni conflicto de canal.
    - title: Márgenes Directos de Fábrica
      description: Listas de precios de distribuidor y rebates anuales por volumen comprometido, enviados FOB Qingdao.
    - title: Soporte de Marketing y Capacitación
      description: Materiales de marca compartida, material POS para dealers, capacitación de producto y campañas de lanzamiento.
    - title: Equipo de Cuenta Dedicado
      description: Un gestor personal de distribuidores más soporte de incorporación, previsión y reposición.
  actions:
    - variant: primary
      text: Conviértete en Distribuidor
      href: /distributor-program
    - text: Solicitar Lista de Precios de Distribuidor
      href: /contact?subject=Dealer Price List
    - text: Solicitar Colaboración de País
      href: /contact?subject=Country Partnership Application
    - text: Descargar el Programa de Distribuidores
      href: /distributor-program
  note: Pedidos de muestra de 5–10 unidades. Pedidos de prueba de 10–30. Distribuidor autorizado de 30–50. Distribuidor de País/Región de 100–300+.

meta:
  title: 'Tablas de SUP Hinchables de Alto Rendimiento — Afarer Water Sports | {SITE}'
  description: 'Afarer diseña SUP hinchables de alto rendimiento para aguas abiertas, touring, yoga y aventura. Rigidez drop-stitch, tablas probadas a presión una a una, con colaboraciones exclusivas por país y colecciones co-branded limitadas. Explora la colección.'
  keywords:
    - 'SUP hinchable de alto rendimiento'
    - 'paddleboard hinchable premium'
    - 'marca de SUP hinchable'
    - 'SUP hinchable touring'
    - 'paddleboard co-branded'
    - 'distribuidor SUP por país'
hero:
  tagline: Tablas de SUP Hinchables de Alto Rendimiento
  title: Ve más lejos.<br />Rema más fuerte.
  subtitle: |
    SUP hinchables de alto rendimiento diseñados para aguas abiertas,<br />
    días largos y la libertad de explorar: estables cuando importa,<br />
    rígidos bajo presión y listos para aguas cambiantes.
  taglineSection: Diseñado para la exploración. Diseñado con ingeniería para la fiabilidad. Construido para socios globales.
  actions:
    - variant: primary
      text: Ver productos
      href: /products
      icon: tabler:shopping-bag
    - text: Saber más
      href: '#features'
      icon: tabler:file-text
    - text: Explora soluciones de SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: Tabla de SUP inflable afarer remando en un lago tranquilo al amanecer — exploración acuática apta para principiantes
who_we_serve:
  tagline: A Quién Servimos
  title: Soluciones SUP completas para cada negocio de agua
  subtitle: Equipo construido para un propósito, fabricación y soporte empresarial para cuatro mercados clave.
  items:
    - title: Clubes de paddle
      keywords: Equipo de club de SUP, equipo de escuela de remo, flota de alquiler
      description: Flotas de SUP duraderas, precios para clubes y programas de repuestos para clubes y escuelas de paddles.
      icon: tabler:users
      cta: Explora las soluciones de Paddle Club
      link: /solutions/paddle-clubs
    - title: Resorts y Hoteles
      keywords: actividades acuáticas en el resort, equipo de playa del hotel, experiencia del huésped
      description: Complete programas de flotas de SUP con marca personalizada, capacitación del personal y paquetes optimizados para ROI.
      icon: tabler:building
      cta: Crea tu experiencia acuática en el resort
      link: /solutions/resorts-hotels
    - title: Socios minoristas
      keywords: Mayoristas de SUP, minoristas al aire libre, tiendas de artículos deportivos
      description: Gama completa de productos, materiales de marketing, opciones de dropshipping y márgenes mayoristas competitivos.
      icon: tabler:shopping-cart
      cta: Conviértete en un socio minorista
      link: /solutions/retail-partners
    - title: Distribuidores por país y socios co-branded
      keywords: distribuidor SUP por país, SUP co-branded, SUP de marca privada
      description: Distribución exclusiva país por país y colecciones co-branded limitadas para empresas de deportes acuáticos cualificadas.
      icon: tabler:package
      cta: Conviértete en socio
      link: /distributor-program
proof_points:
  title: Confiado por empresas de agua en todo el mundo

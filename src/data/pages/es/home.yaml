meta:
  title: Tablas de Paddle Inflables Afarer | Ve más lejos. Rema más fuerte.
  description: Descubre las tablas de paddle inflables Afarer para paddle polivalente, touring, yoga, pesca y aventuras al aire libre. Encuentra tu SUP perfecto y explora más sobre el agua.
  keywords:
    - tabla de paddle inflable
    - sup inflable
    - sup polivalente
    - sup de touring
    - sup de yoga
    - sup de pesca
    - tabla de paddle familiar
    - tabla de paddle portátil
hero:
  tagline: Tablas de Paddle Inflables
  title: Tablas de Paddle Inflables para Cada Aventura
  slogan: Ve más lejos. Rema más fuerte.
  subtitle: Descubre la libertad del paddle con Afarer. Explora SUP inflables diseñados con esmero para días relajados en el lago, aventuras costeras, fitness y todo lo demás.
  taglineSection: Diseñado para dar confianza. Creado para destacar.
  actions:
    - variant: primary
      text: Encuentra Tu Tabla
      href: /size-guide/
      icon: tabler:compass
    - text: Explorar SUP
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Por Qué Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Tablas de paddle inflables Afarer deslizándose sobre agua calmada al amanecer — diseñadas para cada aventura
who_we_serve:
  tagline: Rema Con Nosotros
  title: Encuentra Tu Camino en el Agua
  subtitle: Cada palista tiene una idea distinta de la aventura. Descubre un SUP Afarer diseñado para tu forma de remar.
  items:
    - title: Principiantes & Palistas Recreativos
      keywords: SUP inflable para principiantes, tabla de paddle polivalente, SUP estable
      description: Tablas polivalentes anchas y estables que hacen que tu primera brazada se sienta natural y te acompañan mientras progresas.
      icon: tabler:users
      cta: Encuentra Tu Primera Tabla
      link: /all-around-sup/
    - title: Touring & Aventura
      keywords: SUP de touring, tabla de paddle de larga distancia, SUP de expedición
      description: Tablas más largas y estrechas que mantienen el rumbo, planean más lejos y llevan equipo para rutas de varios días.
      icon: tabler:building
      cta: Explorar SUP de Touring
      link: /touring-sup/
    - title: Yoga & Fitness
      keywords: SUP de yoga, tabla de paddle fitness, SUP ancha y estable
      description: Plataformas anchas y estables con espacio para moverse — para tus flujos al amanecer, entrenamientos y equilibrio en aguas calmadas.
      icon: tabler:heart
      cta: Explorar SUP de Yoga
      link: /yoga-sup/
    - title: Pesca & Familia
      keywords: SUP de pesca, tabla de paddle familiar, plataforma de pesca estable
      description: Plataformas estables y prácticas para lanzar el señuelo, pasear con los niños y disfrutar de largos días relajados en el agua.
      icon: tabler:users
      cta: Explorar SUP de Pesca
      link: /fishing-sup/
proof_points:
  title: Probado más allá del showroom
  subtitle: Diseño, rendimiento y calidad que puede verificar — en el agua y en los números.
  items:
    - metric: 10+
      label: Años diseñando para el agua
      detail: Desde 2012, refinando tabla por tabla
    - metric: 50+
      label: Países en el agua
      detail: Paddlers y socios en todo el mundo
    - metric: 12–15
      label: Núcleo drop-stitch en PSI
      detail: Rígido donde importa, fácil de plegar
    - metric: 100%
      label: Probado a presión, tabla por tabla
      detail: Inspeccionado antes del envío
business_solutions:
  tagline: Por Qué Se Siente Diferente
  title: Rendimiento que Se Siente en la Primera Brazada
  subtitle: Cuatro pilares forjados por el agua real — rendimiento, diseño, construcción y calidad.
  items:
    - title: Rendimiento en el Agua
      description: Formas afinadas para estabilidad, planeo y confianza en aguas picadas — cada brazada se siente conectada con el agua.
      icon: tabler:shield-check
    - title: Diseño Expresivo
      description: Colecciones inspiradas en las mareas, la fauna y la energía de la costa — tablas con las que quieres que te vean.
      icon: tabler:package
    - title: Construcción Probada
      description: Núcleos drop-stitch de alta densidad, rieles reforzados y costuras laminadas por fusión para uso repetido.
      icon: tabler:headset
    - title: Calidad Verificada
      description: Probadas a presión, inspeccionadas visualmente y respaldadas por una garantía clara y un servicio posventa atento.
      icon: tabler:truck-delivery
cta:
  title: Encuentra tu próxima tabla.
  subtitle: Ya sea tu primera brazada o tu ruta más larga — te pondremos sobre el agua.
  actions:
    - variant: primary
      text: Explorar la Colección
      href: /inflatable-sup/
      icon: tabler:send
    - text: Solicitar el Catálogo
      href: /resources/download-catalog/

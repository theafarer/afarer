who_we_serve:
  tagline: A Quién Servimos
  title: Soluciones SUP completas para cada negocio de agua
  subtitle: Equipo construido para un propósito, fabricación y soporte empresarial para cuatro mercados clave.
  items:
    - title: Clubes de paddle
      keywords: Equipo de club de SUP, equipo de escuela de remo, flota de alquiler
      description: Flotas de SUP duraderas, precios para clubes y programas de repuestos para clubes y escuelas de paddles.
      icon: tabler:users
      cta: Explora las soluciones de Paddle Club
      link: /solutions/paddle-clubs
    - title: Resorts y Hoteles
      keywords: actividades acuáticas en el resort, equipo de playa del hotel, experiencia del huésped
      description: Complete programas de flotas de SUP con marca personalizada, capacitación del personal y paquetes optimizados para ROI.
      icon: tabler:building
      cta: Crea tu experiencia acuática en el resort
      link: /solutions/resorts-hotels
    - title: Socios minoristas
      keywords: Mayoristas de SUP, minoristas al aire libre, tiendas de artículos deportivos
      description: Gama completa de productos, materiales de marketing, opciones de dropshipping y márgenes mayoristas competitivos.
      icon: tabler:shopping-cart
      cta: Conviértete en un socio minorista
      link: /solutions/retail-partners
    - title: Nuevas marcas de SUP
      keywords: SUP de marca privada, marca personalizada de SUP, tablas de paddle OEM
      description: 'Fabricación OEM/ODM de extremo a extremo: diseño, prototipado, producción en masa y logística global.'
      icon: tabler:package
      cta: Construye Tu Marca SUP
      link: /oem-odm-manufacturer
proof_points:
  title: Confiado por empresas de agua en todo el mundo
  subtitle: Décadas de experiencia en ingeniería marina impulsando programas de SUP rentables.
  items:
    - metric: Diez
      label: Años de experiencia
      detail: Desde 2012
    - metric: Cincuenta
      label: Países atendidos
      detail: Red de distribución global
    - metric: 15,000
      label: Unidades Producidas Anualmente
      detail: Capacidad de producción certificada por CE
    - metric: 100%
      label: Certificado CE
      detail: Cumple con ISO 9001, BSCI, REACH
business_solutions:
  tagline: Cómo ayudamos
  title: Tu socio desde el concepto hasta los ingresos
  subtitle: Cuatro capacidades principales que ayudan a las empresas de agua a lanzar, operar y crecer.
  items:
    - title: Equipo profesional
      description: Tablas de SUP de grado comercial diseñadas para uso de alquiler diario, 500 ciclos con mantenimiento mínimo.
      icon: tabler:shield-check
    - title: Fabricación OEM
      description: Producción de marca privada de extremo a extremo, desde el diseño y la creación de prototipos hasta la producción en masa y la entrega global.
      icon: tabler:package
    - title: Soporte Empresarial
      description: Capacitación del personal, materiales de marketing, programas de repuestos y gestión de cuentas dedicada.
      icon: tabler:headset
    - title: Logística Global
      description: FOB Qingdao, CIF principales puertos, entrega puerta a puerta a 50 países con apoyo aduanero.
      icon: tabler:truck-delivery
oem_section:
  tagline: Lanza Tu Marca
  title: De la idea al mercado en 16 semanas
  subtitle: 'Tu socio completo para el lanzamiento de la marca de SUP: diseño, prototipo, fabricación y envío.'
  steps:
    - number: Uno
      title: Idea y Resumen
      desc: Comparte tu visión, mercado objetivo y especificaciones.
    - number: Dos
      title: Diseño e Ingeniería
      desc: Modelado 3D, selección de materiales y diseño gráfico personalizado.
    - number: Tres
      title: Prototipar y Validar
      desc: Producción de muestra con certificación CE y pruebas de calidad.
    - number: Cuatro
      title: Producción en masa
      desc: Fabricación a gran escala con control de calidad en línea y soporte de auditoría de fábrica.
    - number: Cinco
      title: Entrega Global
      desc: Logística FOB Qingdao, CIF principales puertos, puerta a puerta.
  cta: Comienza Tu Viaje de Marca
  cta_link: /fabricante-oem-odm
cta:
  title: |
    ¿Listo para el agua? <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">Estamos aquí para ayudarte.</span>
  subtitle: Todos los productos con certificación CE, cada compra respaldada por garantía. Contáctanos para asesoría, presupuestos o repuestos.
  actions:
    - variant: primary
      text: Ver todos los productos
      href: /products
      icon: tabler:shopping-bag
    - text: Habla con nuestro equipo
      href: /contact

meta:
  title: Soluciones de Flota de SUP para Resorts | {SITE}
  description: Soluciones completas de flota de SUP para resorts y hoteles. Tablas de grado comercial, personalización de marca, capacitación del personal y paquetes optimizados para ROI de 20 a 100 tablas.
hero:
  tagline: Resorts y Hoteles
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Huéspedes del resort disfrutando del paddle surf en una playa prístina
roi_section:
  title: El Modelo de Ingresos de SUP del Resort
  subtitle: Cómo los resorts generan entre $50,000 y $200,000 anuales de ingresos por alquiler de SUP con una sola inversión.
  metrics:
    - metric: $50,000–$200,000+
      label: Ingresos anuales por SUP
      detail: Por resort, basado en el tamaño de la flota y la ocupación
    - metric: 4–6 meses
      label: Periodo de recuperación promedio
      detail: Recuperar la inversión total de la flota en una temporada
    - metric: 40%
      label: Aumento de ingresos
      detail: Aumento promedio después de cambiar a las flotas Afarer
    - metric: 500+
      label: Ciclos de Alquiler por Tablero
      detail: Durabilidad de grado comercial para uso diario
packages:
  title: Sistema de Paquetes del Resort
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - Garantía de 12 meses + Certificado CE
      revenue: Potencial de ingresos anuales de $50K–$80K
      cta_text: Obtener paquete de inicio
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 50 remos + 50 chalecos salvavidas
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - Sesión de capacitación del personal (en línea)
        - Garantía de 12 meses + Certificado CE
      revenue: Potencial de ingresos anual de $120K–$200K
      popular: true
      cta_text: Obtener paquete premium
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - Gerente de cuenta dedicado
        - Piezas de repuesto prioritarias (despacho en 24 h)
        - Custom branding + logo
        - Paquete de fotos/videos de marketing
        - Garantía de 24 meses + Certificado CE
      revenue: Potencial de ingresos anuales de $200,000
      cta_text: Obtener el paquete principal
case_study:
  quote: Desde que cambiamos a Afarer, nuestros ingresos por alquiler de SUP aumentaron un 40%. Los costos de reemplazo de la tabla disminuyeron un 60%. Recuperamos toda nuestra inversión en la flota en 4 meses.
  author: Gerente de Actividades Acuáticas
  location: Resort de 5 estrellas, Maldivas
  results:
    - label: Crecimiento de ingresos
      value: +40%
    - label: Reducción de Costos
      value: '-60%'
    - label: Periodo de recuperación
      value: 4 meses
features:
  title: Por qué los resorts eligen Afarer
  subtitle: Durabilidad de nivel comercial, logística global y un socio que entiende la hospitalidad.
  items:
    - title: 500 Ciclos de Alquiler
      description: Cada tabla se prueba para resistir 500 ciclos de alquiler en agua salada, sol y arena.
      icon: tabler:shield-check
    - title: Envío de piezas en 48 h
      description: 'Piezas de repuesto enviadas en 48 horas: sus ingresos por alquiler nunca se detienen.'
      icon: tabler:truck-delivery
    - title: Marca personalizada
      description: Combina la identidad de tu resort con colores personalizados y logotipo en cada tablero.
      icon: tabler:palette
    - title: Capacitación del personal
      description: Programas de capacitación en línea y presenciales para su equipo de actividades.
      icon: tabler:school
    - title: Logística Global
      description: Envío a más de 50 países con opciones de flete consolidado.
      icon: tabler:world
    - title: Certificado CE
      description: Todo el equipo certificado CE, ISO 9001:2015 — seguridad y calidad garantizadas.
      icon: tabler:certificate
cta:
  title: Ready to upgrade your guest experience?
  subtitle: Obtenga su cotización del paquete de resort o descargue nuestro catálogo completo de resorts.
  actions:
    - text: Obtener paquete de resort
      href: /contact?package=resort
      variant: primary
    - text: Descargar catálogo del resort
      href: /resources/download-catalog
      variant: secondary

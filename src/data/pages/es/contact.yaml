    - title: Soporte técnico
      description: Garantía, reparaciones, repuestos y preguntas de funcionamiento.
      icon: tabler:tool
    - title: Prensa y colaboraciones
      description: Kits de prensa, patrocinios y colaboración en el sector.
      icon: tabler:news
    - title: Teléfono
      description: '+86 13305324192'
      icon: tabler:headset
    - title: Correo electrónico
      description: info@afarer.com
      icon: tabler:mail
    - title: Sede central
      description: Zona de Desarrollo Económico, Laixi, Qingdao, China, 266600
      icon: tabler:map-pin
map:
  title: Nuestra ubicación
  subtitle: Visítanos en nuestra sede central

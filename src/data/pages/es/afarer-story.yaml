      - ISO 9001:2015 —Sistema de gestión de calidad certificado
      - UKCA Marked —Conformidad para el mercado británico
      - FCC Compliant —Cumplimiento de componentes electrónicos en EE. UU.
  global:
    title: Presencia global
    body: afarer atiende a clientes en múltiples mercados globales, apoyando a distribuidores, marcas de exteriores y usuarios marinos profesionales en más de 50 países en Europa, Asia-Pacífico, América, Oriente Medio y África.

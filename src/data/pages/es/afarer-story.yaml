    title: Compromiso con la calidad
    body: Desde la inspección de materiales hasta las pruebas finales, afarer mantiene procesos de calidad sistemáticos para ofrecer productos marinos fiables. Cada unidad se somete a pruebas de presión, inspección de costuras y verificación de rendimiento antes del envío.

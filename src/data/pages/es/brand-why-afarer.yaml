features3_reasons:
  tagline: Why Choose afarer
  title: 'Siete Razones para Asociarse'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'Poseemos una fábrica de 12.000 m². Trabaje directamente con los diseñadores – sin intermediarios.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Nuestro diseño comienza con el caso de uso, no con la categoría.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'CE, ISO, BSCI, REACH, USCG. Cada producto cumple estándares internacionales.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Colores, diseño, marca, empaque – personalizamos según sus especificaciones.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'Almacén en California, envío directo desde Qingdao, carga aérea para urgente.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'Apoyamos barcos construidos hace 20 años. Piezas originales, asesoramiento.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Capacidades reales, dimensiones reales, peso real. Sin inflación de marketing.'
      icon: tabler:ruler-measure

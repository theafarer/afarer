hero:
  tagline: Laboratorio 04
  title: Tanque de prueba hidrodinámico
  subtitle: Validando el rendimiento antes del primer prototipo a gran escala
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: Pruebas de rendimiento en tanque de ensayo hidrodinámico Afarer
intro: >-
  Es un concepto erróneo común que las pruebas hidrodinámicas estén reservadas para barcos de navegación oceánica. En realidad, el rendimiento de un casco pequeño planeador —como un RIB de 4–6 m— depende tanto de su forma bajo el agua como un petrolero depende de su proa bulbosa. El ángulo de
  trimado, el área de superficie mojada, la generación de rociada y la ventilación tienen un efecto dramático en la velocidad, el consumo de combustible y la comodidad de la navegación. En {SITE.name}, operamos un tanque de pruebas hidrodinámicas dedicado que nos permite cuantificar estos efectos a
  escala de modelo —antes de comprometer metal y tela con un prototipo a tamaño real.
content_html: >
  <h2>¿Por qué realizar pruebas de tanque en un barco pequeño?</h2>

  <p>Probar a escala de modelo (normalmente de 1:3 a 1:5) nos permite iterar las formas del casco de forma rápida y rentable. Una semana en el tanque puede generar los mismos datos de rendimiento que requerirían meses de prueba y error a escala real, y a una fracción del coste.</p>


  <h2>Especificaciones de las instalaciones</h2>

  <table>
    <thead><tr><th>Parámetro</th><th>Especificación</th></tr></thead>
    <tbody>
      <tr><td>Dimensiones del tanque</td><td>35 m (L) × 3.5 m (W) × 1.8 m (D)</td></tr>
      <tr><td>Carro de remolque</td><td>Accionamiento servoeléctrico, velocidad máxima 12 m/s (23 nudos), precisión de velocidad ± 0.5 %</td></tr>
      <tr><td>Generador de olas</td><td>Tipo flap, estados de mar regulares e irregulares programables, Hs hasta 0.3 m a escala de modelo</td></tr>
      <tr><td>Instrumentación</td><td>Dinamómetro de 6 componentes (resistencia, fuerza lateral, momento de guiñada), acelerómetros, inclinómetros, sondas de olas</td></tr>
      <tr><td>Adquisición de datos</td><td>Muestreo a 1000 Hz por canal, visualización en tiempo real + paquete de postprocesado</td></tr>
      <tr><td>Fabricación de modelos</td><td>Fresado CNC e impresión 3D internos para cascos de modelo de hasta 1.8 m de eslora total</td></tr>
    </tbody>
  </table>


  <h2>Nuestro programa de pruebas</h2>

  <p>Un programa estándar de desarrollo de casco en nuestro tanque sigue esta secuencia:</p>

  <ol>
    <li><strong>Construcción del modelo</strong> — Un modelo a escala 1:3.5 se mecaniza por CNC a partir de espuma de alta densidad y se encola para darle rigidez. El peso y el CG se ajustan para coincidir con la condición de plena carga escalada según Froude.</li>
    <li><strong>Pruebas de resistencia</strong> — El modelo se remolca a 8-10 velocidades que abarcan el rango operativo. La resistencia total se mide y se descompone en componentes friccional y residual según el método ITTC-1957.</li>
    <li><strong>Medición del asiento y el asentamiento</strong> — El asiento y el asentamiento dinámicos se registran a cada velocidad. El objetivo es un ángulo de asiento óptimo de 4-6° para cascos de planeo.</li>
    <li><strong>Estudio de la estela</strong> — Se miden cortes de olas transversales a dos velocidades para evaluar la resistencia por formación de olas e identificar interacciones de olas transversales que puedan causar interferencia en la popa.</li>
    <li><strong>Comportamiento en la mar (opcional)</strong> — Pruebas en olas de proa y de popa en olas regulares para medir la resistencia adicional, la aceleración vertical y la probabilidad de impacto.</li>
    <li><strong>Análisis de datos y recomendaciones</strong> — Se entrega un informe completo con gráficos comparativos, curvas de velocidad/potencia y recomendaciones de diseño específicas para el casco a escala real.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Resultados típicos de las pruebas en tanque — Resistencia vs. velocidad (casco RIB 450, escala 1:3.5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Resistencia a escala de modelo (N) a velocidades escaladas según Froude. La predicción de potencia a escala real sigue el método de predicción de rendimiento ITTC-1978.</p>
  </div>


  <h2>Equipo de expertos</h2>

  <p>Nuestro tanque está operado por un hidrodinamista con doctorado en arquitectura naval y 8 años de experiencia en tanques de remolque en un importante instituto europeo de investigación marítima. Cuenta con el apoyo de un técnico que prepara todos los modelos y la instrumentación. El equipo
  sigue los Procedimientos Recomendados del ITTC (Conferencia Internacional de Tanques de Remolque) para garantizar que cada prueba sea repetible, trazable y defendible a nivel internacional.</p>


  <h2>Pruebas en tanque para el desarrollo de cascos personalizados</h2>

  <p>Nuestro tanque no solo se utiliza para cascos de diseño propio; ejecutamos regularmente programas de pruebas para clientes que desean validar una forma de casco personalizada o investigar un problema de rendimiento:</p>

  <ul>
    <li><strong>Comparación de formas de casco</strong> — Dos o más formas de casco candidatas probadas en condiciones idénticas, lo que proporciona una comparación objetiva de resistencia/velocidad/estabilidad para fundamentar su decisión de diseño.</li>
    <li><strong>Optimización de apéndices</strong> — Las placas interceptoras, los túneles de spray, los flaps de trimado y las quillas pueden probarse en diversas configuraciones para cuantificar su contribución individual a la reducción de la resistencia.</li>
    <li><strong>Estudio de acoplamiento del motor</strong> — Los datos de resistencia se convierten en una curva de predicción de potencia, lo que le permite seleccionar la potencia óptima del motor para su velocidad objetivo y su carga útil.</li>
  </ul>


  <h2>¿Por qué probar con nosotros?</h2>

  <p>No solo le entregamos un conjunto de números brutos. Nuestros informes convierten los datos del tanque en recomendaciones de ingeniería accionables: "Eleve el túnnel de spray 8 mm para reducir la superficie mojada a velocidad de crucero", "Aumente el deadrise en el espejo de popa 3° para
  reducir la aceleración por impacto" o "Desplace el centro de gravedad longitudinal 150 mm hacia popa para mejorar la actitud de planeo". Usted sale con una comprensión clara de qué cambiar y por qué.</p>

  <p>Nuestro tanque también está disponible para pruebas independientes de terceros sobre la base de pago por servicio. Si está desarrollando un casco y desea una evaluación hidrodinámica imparcial y ejecutada profesionalmente, le invitamos a ponerse en contacto con nosotros.</p>

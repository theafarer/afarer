meta:
  title: Equipamiento SUP y soluciones de flota para clubes de paddle | {SITE}
  description: Programas completos de flotas SUP para clubes y escuelas de paddle. Paquetes de inicio, flotas profesionales, tablas de competición, kits para centros de entrenamiento y soporte de piezas de repuesto.
hero:
  tagline: Clubes y Escuelas de Paddle
  title: Lanza, gestiona y haz crecer tu club de paddle<br />con flotas SUP de calidad comercial
  subtitle: Proveedor de equipamiento SUP para clubes de paddle y escuelas de SUP en todo el mundo — tablas comerciales duraderas, precios de club por volumen, personalización de marca y piezas de repuesto rápidas, para que puedas centrarte en hacer crecer tu comunidad.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Miembros del club de paddle en tablas Afarer SUP a juego
benefits:
  title: Beneficios de la flota del club
  subtitle: Por qué los clubes de remo en más de 50 países eligen a Afarer como su socio de equipo.
  items:
    - metric: 40%+
      label: Ahorro de costos de la flota
      detail: Vs. precios al por menor con descuentos de clubes de compras al por mayor
    - metric: 48 h
      label: Reemplazo de piezas
      detail: Tiempo mínimo de inactividad para su flota de alquiler
    - metric: 500+
      label: Ciclos de alquiler
      detail: Durabilidad de grado comercial por tablero
    - metric: 5+ años
      label: Vida útil de la flota
      detail: Con el mantenimiento y cuidado adecuados
packages:
  title: Programas de la flota del club
  subtitle: Elige el programa de flota que coincida con el tamaño y la ambición de tu club.
  items:
    - name: Paquete de Inicio
      tagline: Para clubes nuevos, hasta 30 miembros
      features:
        - 10 tablas SUP (mezcla all-round + touring)
        - 10 remos + 10 chalecos salvavidas
        - 2 bombas de doble acción + kit de reparación
        - Branding del club en las tablas (impresión de logo)
        - Guía de lanzamiento + lista de verificación de seguridad
        - Certificado CE — todo el equipo
      cta_text: Inicia tu club
    - name: Flota Profesional
      tagline: Para clubes consolidados, 50-100 miembros
      features:
        - 30 tablas SUP (3 opciones de tamaño)
        - 30 remos + 30 chalecos salvavidas
        - 5 bombas + 2 kits de reparación + soporte de almacenamiento
        - Colores personalizados del club + logo en las tablas
        - Programa de piezas de repuesto (15 % de descuento)
        - Sesión de capacitación para el personal (en línea)
        - Certificado CE — todo el equipo
      popular: true
      cta_text: Construye tu flota
    - name: Flota de Competición
      tagline: Para clubes de carreras, eventos, competiciones
      features:
        - 50+ tablas de carrera / rendimiento
        - Set completo de accesorios (remos, chalecos, bombas)
        - Kit de apoyo para eventos (boyas de salida, marcadores)
        - Piezas prioritarias (despacho en 24 h)
        - Gerente de cuenta dedicado
        - Opción de uniformes personalizados para el equipo
        - Certificado CE — todo el equipo
      cta_text: Obtener flota de competencia
training:
  title: Paquetes del Centro de Capacitación
  subtitle: Todo lo que una escuela de SUP necesita para impartir cursos de certificación profesional.
  items:
    - name: Kit de Inicio para Instructores
      features:
        - 5 tablas de SUP premium (grado instructor)
        - 5 paletas de carbono para demostraciones
        - 5 chalecos salvavidas (talla instructor)
        - Guía del plan de estudios de formación
        - Equipo certificado CE
    - name: Set Completo para Escuelas
      features:
        - 20 tablas de SUP (mezcla de estudiantes e instructores)
        - 20 remos + 20 chalecos salvavidas (varios tamaños)
        - 10 ayudas de flotabilidad para principiantes
        - 4 bombas + juegos de reparación
        - Plan de estudios de formación y apoyo para la certificación
        - Equipo certificado CE
features:
  title: Por Qué Los Clubes Eligen Afarer
  subtitle: Calidad consistente, piezas rápidas y precios al por mayor diseñados para clubes en crecimiento.
  items:
    - title: 500 Ciclos de Alquiler
      description: Las tablas de grado comercial sobreviven temporadas de uso diario.
      icon: tabler:shield-check
    - title: Colores personalizados
      description: Combina la identidad de tu club con colores personalizados para el tablero y el logotipo.
      icon: tabler:palette
    - title: Precios por volumen
      description: Descuentos por volumen para pedidos de flotas de 10 tableros.
      icon: tabler:discount
    - title: Piezas rápidas
      description: Piezas de repuesto enviadas en 48 horas.
      icon: tabler:truck-delivery
    - title: Apoyo al Crecimiento del Club
      description: Consejos sobre programas de membresía, precios y organización de eventos.
      icon: tabler:trending-up
    - title: Certificado CE
      description: Todo el equipo cumple con las normas de seguridad internacionales.
      icon: tabler:certificate
cta:
  title: ¿Listo para construir tu club de paddle?
  subtitle: Obtenga su cotización de la flota del club o descargue nuestra guía de inicio del club.
  actions:
    - text: Solicitar para la flota del club
      href: /contact?package=club
      variant: primary
    - text: Descargar guía del club
      href: /resources/download-catalog
      variant: secondary

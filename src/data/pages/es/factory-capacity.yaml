intro: >-
  afarer opera una de las mayores instalaciones dedicadas a la fabricación de barcos inflables en Qingdao, China. Nuestra fábrica de 12.000 m² está organizada en seis talleres especializados que operan en paralelo, lo que nos da capacidad para producir más de 15.000 barcos al año en las líneas de SUP, botes auxiliares y equipo de seguridad.

workshops:
  - title: Producción de tablas SUP
    description: '4 líneas de ensamblaje paralelas para tablas SUP inflables. Cada línea puede producir de 50 a 80 tablas por turno. Las estaciones de impresión digital y serigrafía funcionan simultáneamente. Capacidad anual de SUP: 10.000+ tablas.'
    output: '10.000+ SUPs/año'
  - title: 'Botes inflables y SUP'
    description: 'Líneas de producción multipropósito para botes inflables y botes auxiliares. Las estaciones de soldadura de aire caliente, prensas dieléctricas de RF y puestos de ensamblaje se reconfiguran según la combinación de pedidos. Capacidad anual: 5.000+ unidades.'
    output: '5.000+ unidades/año'
  - title: Equipo de seguridad
    description: 'Área de producción en sala limpia separada para chalecos salvavidas y equipo de seguridad. Estaciones dedicadas de costura, inserción de espuma y pruebas. Capacidad anual de chalecos salvavidas: 50.000+ unidades.'
    output: '50.000+ chalecos salvavidas/año'

hero:
  tagline: Capacidad de producción
  title: Capacidad de Fabricación y Producción Anual
  subtitle: Instalación de 12.000 m² que produce 15.000 barcos al año con espacio para crecer
intro: >-
  afarer opera una de las mayores instalaciones dedicadas a la fabricación de barcos inflables en Qingdao, China. Nuestra fábrica de 12.000 m² está organizada en seis talleres especializados que operan en paralelo, lo que nos da capacidad para producir más de 15.000 barcos al año en las líneas de SUP, kayaks, botes auxiliares, RIB y equipo de seguridad.

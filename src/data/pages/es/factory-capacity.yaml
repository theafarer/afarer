workshops:
  - title: Producción de tablas SUP
    description: '4 líneas de ensamblaje paralelas para tablas SUP inflables. Cada línea puede producir de 50 a 80 tablas por turno. Las estaciones de impresión digital y serigrafía funcionan simultáneamente. Capacidad anual de SUP: 8.000+ tablas.'
    output: '8.000+ SUPs/año'
  - title: 'Producción de barcos RIB'
    description: 'Taller especializado de cascos de fibra de vidrio con 6 estaciones de moldeo para cascos de barco de hasta 7,6 m. El área de soldadura y montaje de tubos maneja 3–6 barcos simultáneamente. Capacidad anual de RIB: 2.000+ barcos.'
    output: '2.000+ RIBs/año'
  - title: 'Botes inflables y SUP'
    description: 'Líneas de producción multipropósito para botes inflables, kayaks y botes auxiliares. Las estaciones de soldadura de aire caliente, prensas dieléctricas de RF y puestos de ensamblaje se reconfiguran según la combinación de pedidos. Capacidad anual: 5.000+ unidades.'
    output: '5.000+ unidades/año'
  - title: Equipo de seguridad
    description: 'Área de producción en sala limpia separada para chalecos salvavidas y equipo de seguridad. Estaciones dedicadas de costura, inserción de espuma y pruebas. Capacidad anual de chalecos salvavidas: 50.000+ unidades.'
    output: '50.000+ chalecos salvavidas/año'
oem_capacity:
  moq: 'SUP: 5–10 unidades | Barco: 2–5 unidades | Kayak/Bote auxiliar: 10–50 unidades | Molde personalizado: 200+ unidades'
  lead_time: Estándar 30–45 días. Muestra 15–20 días. Urgente disponible.
  payment: T/T 30% depósito + 70% antes del envío. L/C, Western Union aceptados.

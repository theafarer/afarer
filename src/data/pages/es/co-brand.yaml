faqs:
  title: 'Co-Brand — Preguntas Frecuentes'
  subtitle: 'Cómo funciona el co-branding de Afarer y en qué se diferencia del OEM y la marca blanca.'
  items:
    - title: '¿Es el co-branding lo mismo que OEM o marca blanca?'
      description: 'No. Afarer ya no ofrece un programa abierto de OEM/marca blanca. Los productos co-brand siguen siendo productos Afarer — diseñados, validados en ingeniería, con control de calidad y respaldados por la marca Afarer. Tu identidad aparece como co-brand, no como un producto de terceros sin marca.'
    - title: '¿Quién puede iniciar un proyecto co-brand?'
      description: 'Negocios cualificados de deportes acuáticos: socios de país existentes, clubs de paddle, resorts y hoteles, organizadores de eventos y comunidades. Envíanos un brief de proyecto y confirmamos la idoneidad antes de comenzar el diseño.'
    - title: '¿El co-branding entra en conflicto con mi distribuidor de país?'
      description: 'No. El modelo de un país, un distribuidor tiene prioridad. Las colecciones co-brand se coordinan con el socio local de país cuando existe, de modo que no aparece ninguna marca paralela o competidora dentro de un territorio protegido.'
    - title: '¿Cuál es el pedido mínimo de una colección co-brand?'
      description: 'Las colecciones piloto empiezan en 30–50 unidades. Las colecciones estándar son de 50–100 unidades; las ediciones grandes o multirregión de 100+ unidades. Los plazos de desarrollo personalizado se acuerdan por proyecto.'
    - title: '¿Qué aporta Afarer frente a la contribución del socio?'
      description: 'Afarer es propietario del diseño del producto, la ingeniería, los materiales, la construcción, el QC y la garantía. Los socios aportan el concepto de la colección, el naming, los colores, los gráficos y la salida al mercado. Así se mantiene un único estándar de calidad en el agua.'
    - title: '¿Cómo solicito?'
      description: 'Completa el formulario de consulta co-brand con tu negocio, mercado e idea de colección. Evaluamos el encaje y respondemos en 3 días laborables con una propuesta y el Co-Brand Project Agreement.'

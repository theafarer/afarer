features:
  title: 'Qué Significa el Co-Branding en Afarer'
  subtitle: 'El co-branding es nuestro programa de colaboración en diseño — construido sobre la marca Afarer, la protección territorial y colecciones limitadas, no producción sin marca.'
  columns: 3
  items:
    - title: 'Los Productos Afarer Siguen Siendo Afarer'
      description: 'Una colección co-brand es una edición limitada de tablas Afarer con tu identidad integrada. Nunca sin marca, nunca una marca de terceros y nunca un programa abierto de marca blanca.'
      icon: 'tabler:trademark'
    - title: 'Diseñado Contigo'
      description: 'Tus colores, naming e historia dan forma a la colección. Nuestro equipo de diseño e ingeniería se encarga de cubiertas, gráficos, packaging y documentación del brief a la entrega.'
      icon: 'tabler:pencil'
    - title: 'Para Clubs, Resorts, Eventos y Comunidades'
      description: 'Colecciones de flota para clubs de paddle y resorts, ediciones de evento para carreras y series comunitarias — todas con la calidad y garantía Afarer.'
      icon: 'tabler:users'
    - title: 'Protege a los Socios de País'
      description: 'El co-branding convive con nuestro modelo de un país, un distribuidor. Los socios nacionales conservan su territorio; las colecciones co-brand no abren la puerta a marcas paralelas en su mercado.'
      icon: 'tabler:shield-check'
    - title: 'Ingeniería y Estándares de Calidad'
      description: 'Cada colección sale de nuestra cadena de suministro certificada con documentación CE e ISO 9001, pruebas de presión y los mismos puntos de control de calidad que nuestra gama principal.'
      icon: 'tabler:certificate'
    - title: 'Se Convierte en un Activo de Marca'
      description: 'Una colección limitada co-brand construye tu propia historia en el agua — margen de venta, contenido para medios y una razón para que los practicantes de paddle vuelvan temporada tras temporada.'
      icon: 'tabler:star'

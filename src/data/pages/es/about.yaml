brand_hub_tagline: Marca
brand_hub_title: Explore nuestra marca
brand_hub_subtitle: Profundice en nuestra experiencia en ingeniería SUP, presencia global y los principios que nos impulsan.
brand_hub_cards:
  - title: Experiencia Marina
    desc: Décadas de ciencia de materiales, fabricación de precisión y pruebas reales — desde la fabricación de PVC hasta el diseño de cascos en V profunda y tecnología drop-stitch.
    link: /brand-marine-expertise
    link_label: Más información →
  - title: Presencia Global
    desc: Envíos a más de 50 países desde nuestra instalación en Qingdao con socios de servicio autorizados en Europa, Asia-Pacífico y América.
    link: /brand-global-presence
    link_label: Más información →
  - title: Por qué afarer
    desc: Una marca construida sobre calidad verificada — doble certificación (ISO 9001 + BSCI), cumplimiento CE y colaboraciones exclusivas por país con colecciones co-branded limitadas para empresas de deportes acuáticos.
    link: /brand-why-afarer
    link_label: Más información →

meta:
  title: 'Acerca de Afarer — Marca de SUP Hinchables y Deportes Acuáticos | {SITE}'
  description: 'Afarer es una marca global de SUP hinchables y deportes acuáticos, gestionada por Aquafarer LLC (EE. UU.) y construida por nuestro equipo de operaciones en Qingdao. Descubra nuestra historia, ingeniería, calidad certificada y programas de socios por país.'
  keywords:
    - 'marca de SUP hinchable'
    - 'marca de deportes acuáticos'
    - 'distribuidor SUP por país'
    - 'colecciones de SUP co-branded'
    - 'paddle surf hinchable'
hero:
  tagline: Sobre nosotros
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: Taller afarer
  title: |
    Ingeniería marina, <br />
    hecha a la manera <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Empezamos en un taller costero con una sola tabla y una convicción firme: los productos marinos deben diseñarse como si importaran, porque importan. Hoy enviamos a más de 40 países, pero cada casco sigue pasando por las mismas manos que fundaron la empresa.'

features3_what_we_build:
  title: Lo que construimos
  subtitle: 'Empezamos en un taller costero con una sola tabla y una convicción firme: los productos marinos deben diseñarse como si importaran, porque importan. Hoy enviamos a más de 40 países, pero cada casco sigue pasando por las mismas manos que fundaron la empresa.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Tablas SUP
      description: Tablas SUP inflables de 9 a 12 pies. Diseñadas para travesía, yoga, pesca y uso familiar.
      icon: tabler:ship
    - title: SUP inflables
      description: Tablas SUP inflables de PVC de 9 a 12 pies. Ligeras, resistentes y fáciles de guardar.
      icon: tabler:rowing
    - title: Paquetes SUP premium
      description: SUP compactos y de alta especificación construidos a medida para adaptarse a los requisitos de su marca o flota.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accesorios
      description: Remos, bombas, cubiertas, bolsas impermeables y electrónica. Todos adaptados a nuestras tablas.
      icon: tabler:package
    - title: Reparación y servicio
      description: Reparación de tablas en taller, sustitución de almohadillas y mejoras de accesorios.
      icon: tabler:tool
    - title: Construcciones a medida
      description: Diseño proyecto por proyecto para clientes comerciales, científicos y militares.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Diseño e ingeniería de tablas
steps2_values:
  title: Nuestros valores
  subtitle: Tres principios que han moldeado cada producto desde el primer día.
  items:
    - title: Construir como si llevara a tu familia
      description: Cada casco, soldadura y fijación se trata como si nuestras propias familias fueran a usarlo.
      icon: tabler:heart
    - title: Ingeniería antes de vender
      description: Tablas SUP inflables de 9 a 12 pies. Diseñadas para travesía, yoga, pesca y uso familiar.
      icon: tabler:settings
    - title: Soporte que supera la garantía
      description: Los cascos de veinte años todavía nos llaman para pedir repuestos, y seguimos respondiendo.
      icon: tabler:headset
steps2_milestones:
  title: Hitos
  subtitle: Una versión breve de la historia de afarer.
  isReversed: true
  items:
    - title: Fundado en un taller costero
      description: Iniciado por dos ingenieros marinos con una fresadora CNC y una idea tenaz.
      icon: tabler:building-factory
    - title: Primeros 1000 cascos entregados
      description: Alcanzado en nuestro séptimo año, principalmente gracias al boca a boca y clientes recurrentes.
      icon: tabler:circle-check
    - title: Programa de exportación internacional
      description: Ahora enviamos a más de 40 países con socios de soporte localizados en cinco continentes.
      icon: tabler:world

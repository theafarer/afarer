intro: >-
  El casco es la columna vertebral de cualquier RIB o bote inflable. Debe ser lo suficientemente ligero para planear eficientemente, lo suficientemente fuerte para absorber cargas por impactos y dimensionalmente estable en un amplio rango de temperaturas. En {SITE.name}, nuestro Estudio de
  Ingeniería de Casco combina modelado CAD avanzado, análisis de elementos finitos (FEA) y décadas de experiencia práctica en arquitectura naval para ofrecer cascos optimizados para su misión prevista, no formas genéricas adaptadas de un catálogo.
content_html: >-
  <h2>Donde la resistencia se encuentra con la hidrodinámica</h2>

  <p>Trabajamos con tres materiales principales de casco — HDPE moldeado por rotación, aluminio marino soldado y fibra de vidrio laminada a mano — y contamos con la capacidad de ingeniería para diseñar, simular y validar cada uno internamente.</p>


  <h2>Herramientas de diseño y normativas</h2>

  <p>Nuestro entorno de ingeniería digital incluye:</p>

  <table>
    <thead><tr><th>Capacidad</th><th>Software / Herramienta</th><th>Aplicación</th></tr></thead>
    <tbody>
      <tr><td>Modelado paramétrico 3D</td><td>SolidWorks Professional</td><td>Superficie del casco, sistema de nervios, soporte del motor, disposición de la cubierta</td></tr>
      <tr><td>Análisis de elementos finitos</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Mapeo de tensiones, análisis modal, simulación de impacto/colisión</td></tr>
      <tr><td>Dinámica de fluidos computacional</td><td>Ansys Fluent / Star-CCM+</td><td>Predicción de resistencia hidrodinámica, optimización del trim</td></tr>
      <tr><td>Ingeniería de laminados</td><td>ESAComp / CADEC</td><td>Apilamiento de capas de fibra de vidrio, selección del núcleo, estimación de peso</td></tr>
      <tr><td>Simulación de flujo de moldeo</td><td>Moldex3D</td><td>Predicción de espesor de pared en rotomoldeo</td></tr>
    </tbody>
  </table>


  <h2>Nuestro flujo de trabajo de ingeniería</h2>

  <p>Cada diseño de casco, ya sea un modelo estándar o un proyecto completamente personalizado, sigue un riguroso proceso de cinco etapas:</p>

  <ol>
    <li><strong>Concepto y recopilación de requisitos</strong> — Nos reunimos con usted para definir la carga útil, el rango de velocidades, la capacidad en estado de mar, los requisitos de remolque y cualquier equipo especial de la misión (escotillas de cubierta, posiciones de consola, integración del tanque de combustible).</li>
    <li><strong>Superficie 3D y cálculo hidrostático</strong> — La forma del casco se modela en SolidWorks y se verifica la estabilidad hidrostática (GM, brazo de restitución) mediante herramientas de análisis integradas.</li>
    <li><strong>AEF estructural</strong> — Se definen los casos de carga: estáticos (tripulación + equipo), dinámicos (impactos de planeo a 5g) y de slam (caída desde la cresta de una ola a 3 m/s). Se revisan los contornos de tensión; el factor de seguridad ≥ 2,5 es obligatorio.</li>
    <li><strong>Optimización de resistencia CFD</strong> — El casco se simula en tres condiciones de carga y cinco velocidades. El área mojada, el ángulo de trim y la resistencia residual se reducen iterativamente.</li>
    <li><strong>Revisión y liberación del diseño</strong> — El paquete completo de ingeniería (modelo 3D, informe de AEF, informe de CFD, estimación de peso, cuaderno de laminado) es revisado por nuestro arquitecto naval principal antes de su liberación al taller de prototipos.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Distribución de tensión por AEF — Casco RIB 450 Patrol (Aluminio 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2,8 : 1</span>
        <span class="text-gray-500">Factor de seguridad con carga máxima</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15,2 %</span>
        <span class="text-gray-500">Reducción de resistencia vs generación anterior</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m2</span>
        <span class="text-gray-500">Presión máxima de slam (límite de diseño)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Tiempo acumulado de ejecución de AEF en 2025</span>
      </div>
    </div>
  </div>


  <h2>Personalización: su casco, sus reglas</h2>

  <p>Ningún operador tiene requisitos idénticos. Un RIB de patrullaje portuario necesita un casco de quilla suave para la estabilidad a baja velocidad; una embarcación de interceptación rápida necesita una quilla profunda con guías de rociado; un barco de apoyo de buceo necesita una manga amplia y
  un espejo bajo. No forzamos su aplicación en una forma de casco preexistente. Diseñamos desde su especificación hacia arriba.</p>

  <p>Ejemplos de proyectos recientes de ingeniería de cascos personalizados:</p>

  <ul>
    <li>Un casco de HDPE de 6,8 m alargado para un operador turístico del Caribe, con proa reforzada para desembarcos en playa (+15 % de espesor del fondo).</li>
    <li>Un RIB de aluminio ligero de 7,2 m para la guardia costera, con bafles integrados del tanque de combustible y refuerzos del compartimento de equipamiento.</li>
    <li>Un barco de buceo de fibra de vidrio de 5,5 m con espejo recortado y doble caja de baterías, diseñado para el reaprovechamiento fácil de snorkelers.</li>
  </ul>


  <h2>Nuestros ingenieros</h2>

  <p>El estudio está dirigido por un arquitecto naval senior con 14 años de experiencia en diseño de embarcaciones de alta velocidad, respaldado por dos ingenieros mecánicos especializados en AEF y CFD. Los tres poseen títulos avanzados en ingeniería naval o arquitectura naval de universidades
  reconocidas internacionalmente. El equipo publica regularmente en revistas del sector y presenta en conferencias como la Conferencia Internacional sobre Embarcaciones Marinas de Alto Rendimiento.</p>


  <h2>Asóciese con nosotros en su próximo casco</h2>

  <p>Desde el primer boceto del concepto hasta el informe final de tensiones, nuestro Estudio de Ingeniería de Cascos es su socio en la creación de un barco que no solo está construido — sino ingenierizado. Invertimos las horas de simulación por adelantado para que cada soldadura, cada capa de
  laminado y cada curva del casco estén allí por una razón.</p>

  <p>Ya sea que necesite una modificación menor a un modelo existente o un diseño completamente nuevo, estamos listos para discutir sus requisitos.</p>

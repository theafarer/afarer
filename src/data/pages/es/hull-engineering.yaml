intro: >-
  El casco es la columna vertebral de cualquier SUP inflable. Debe ser lo suficientemente ligero para deslizarse eficientemente, lo suficientemente fuerte para soportar costas rocosas y lo suficientemente rígido para convertir cada palada en movimiento hacia adelante. En Afarer, nuestro Estudio de
  Ingeniería de Casco combina modelado CAD avanzado, análisis de elementos finitos (FEA) y décadas de experiencia práctica en diseño de tablas para ofrecer cascos optimizados para su disciplina prevista, no formas genéricas adaptadas de un catálogo.
content_html: >-
  <h2>Donde la resistencia se encuentra con la hidrodinámica</h2>

  <p>Trabajamos con tres plataformas de construcción principales — núcleos de PVC drop-stitch reforzado, laminados de fibra de vidrio laminados a mano y polietileno moldeado por rotación — y contamos con la capacidad de ingeniería para diseñar, simular y validar cada una internamente.</p>


  <h2>Herramientas de diseño y normativas</h2>

  <p>Nuestro entorno de ingeniería digital incluye:</p>

  <table>
    <thead><tr><th>Capacidad</th><th>Software / Herramienta</th><th>Aplicación</th></tr></thead>
    <tbody>
      <tr><td>Modelado paramétrico 3D</td><td>SolidWorks Professional</td><td>Superficie del casco, refuerzo de rieles y cuadernas, disposición de la cubierta, puntos de montaje de equipo</td></tr>
      <tr><td>Análisis de elementos finitos</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Mapeo de tensiones, análisis modal, simulación de impacto/colisión</td></tr>
      <tr><td>Dinámica de fluidos computacional</td><td>Ansys Fluent / Star-CCM+</td><td>Predicción de resistencia hidrodinámica, optimización del trim</td></tr>
      <tr><td>Ingeniería de laminados</td><td>ESAComp / CADEC</td><td>Apilamiento de capas de fibra de vidrio, selección del núcleo, estimación de peso</td></tr>
      <tr><td>Simulación de flujo de moldeo</td><td>Moldex3D</td><td>Predicción de espesor de pared en rotomoldeo</td></tr>
    </tbody>
  </table>


  <h2>Nuestro flujo de trabajo de ingeniería</h2>

  <p>Cada diseño de casco, ya sea un modelo estándar o un proyecto completamente personalizado, sigue un riguroso proceso de cinco etapas:</p>

  <ol>
    <li><strong>Concepto y recopilación de requisitos</strong> — Nos reunimos con usted para definir el peso del rider y la carga útil, el rango de velocidades, la capacidad en estado del agua, los requisitos de transporte y cualquier equipo especial de la misión (montajes de cubierta, posiciones de sujeción de carga, integración de accesorios).</li>
    <li><strong>Superficie 3D y cálculo hidrostático</strong> — La forma del casco se modela en SolidWorks y se verifica la estabilidad hidrostática (GM, brazo de restitución) mediante herramientas de análisis integradas.</li>
    <li><strong>AEF estructural</strong> — Se definen los casos de carga: estáticos (rider + equipo), dinámicos (impactos de aterrizaje en ola a 5g) y de varado (golpe contra una costa rocosa a 3 m/s). Se revisan los contornos de tensión; el factor de seguridad ≥ 2,5 es obligatorio.</li>
    <li><strong>Optimización de resistencia CFD</strong> — El casco se simula en tres condiciones de carga y cinco velocidades. El área mojada, el ángulo de trim y la resistencia residual se reducen iterativamente.</li>
    <li><strong>Revisión y liberación del diseño</strong> — El paquete completo de ingeniería (modelo 3D, informe de AEF, informe de CFD, estimación de peso, cuaderno de laminado) es revisado por nuestro ingeniero principal antes de su liberación al taller de prototipos.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Distribución de tensión por AEF — Casco de SUP de Travesía (Drop-Stitch Reforzado)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2,8 : 1</span>
        <span class="text-gray-500">Factor de seguridad con carga máxima</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15,2 %</span>
        <span class="text-gray-500">Reducción de resistencia vs generación anterior</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Presión máxima de slam (límite de diseño)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Tiempo acumulado de ejecución de AEF en 2025</span>
      </div>
    </div>
  </div>


  <h2>Personalización: su casco, sus reglas</h2>

  <p>Ningún paddler tiene requisitos idénticos. Un SUP de pesca necesita un casco de planeo ancho y estable; una tabla de travesía necesita un casco de desplazamiento que maximice el deslizamiento; un SUP de surf necesita rieles receptivos y rocker afinado. No forzamos su aplicación en una forma de casco preexistente. Diseñamos desde su especificación hacia arriba.</p>

  <p>Ejemplos de proyectos recientes de ingeniería de cascos personalizados:</p>

  <ul>
    <li>Un SUP de travesía de eslora alargada para un operador de ecoturismo del Caribe, con proa reforzada para desembarcos en playa (+15 % de espesor del riel).</li>
    <li>Un SUP de patrulla de alta visibilidad para una autoridad portuaria, con montajes de equipo integrados y rieles tácticos.</li>
    <li>Un SUP de travesía de expedición para una flota de alquiler, con rieles reforzados y sujeciones de carga adicionales.</li>
  </ul>


  <h2>Nuestros ingenieros</h2>

  <p>El estudio está dirigido por un ingeniero principal con 14 años de experiencia en diseño de tablas de alto rendimiento, respaldado por dos ingenieros mecánicos especializados en AEF y CFD. Los tres poseen títulos avanzados en ingeniería marina o mecánica de universidades
  reconocidas internacionalmente. El equipo publica regularmente en revistas del sector y presenta en conferencias internacionales sobre ingeniería de deportes de remo de alto rendimiento.</p>


  <h2>Asóciese con nosotros en su próximo casco</h2>

  <p>Desde el primer boceto del concepto hasta el informe final de tensiones, nuestro Estudio de Ingeniería de Casco es su socio en la creación de una tabla que no solo está construida — sino ingenierizada. Invertimos las horas de simulación por adelantado para que cada soldadura, cada capa de
  laminado y cada curva del casco estén allí por una razón.</p>

  <p>Ya sea que necesite una modificación menor a un modelo existente o un diseño completamente nuevo, estamos listos para discutir sus requisitos.</p>

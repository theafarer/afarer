meta:
  title: Laboratorio de Calidad e Inspección — Pruebas y Certificación de RIB Cumpliendo ISO | {SITE}
  description: Verificación de calidad independiente para botes inflables. Pruebas de tensión, ciclos de retención de aire, pruebas de despegue de costuras y certificación de materiales. Contacte con nuestro laboratorio de calidad para pruebas de terceros.
back_text: De vuelta al Centro de I+D
home_label: Inicio
hero:
  tagline: Laboratorio 06
  title: Laboratorio de Calidad e Inspección
  subtitle: 'Verificación independiente: todas las pruebas aprobadas antes de la entrega'
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: Laboratorio de inspección de calidad Afarer prueba UV
intro: >-
  Cada barco que sale de nuestro taller lleva la certificación de que ha pasado un conjunto definido de inspecciones de calidad y pruebas de materiales. Nuestro Laboratorio de Calidad e Inspección es una función independiente dentro de la organización: reporta directamente al director general, no a
  producción, garantizando que ninguna presión comercial pueda comprometer la puerta de inspección. Si un lote de material o un barco terminado no cumple con la especificación publicada, el laboratorio tiene la autoridad para detener el envío hasta que se resuelva la no conformidad.
content_html: >
  <h2>Confiar, pero verificar</h2>

  <p>El laboratorio opera bajo un sistema de gestión de calidad alineado con principios, y nuestros métodos de prueba se basan en normas ISO, ASTM y EN siempre que corresponda. Mantenemos registros detallados de cada prueba realizada, creando una cadena de trazabilidad completa desde la recepción de
  la materia prima hasta la entrega final del barco.</p>


  <h2>Equipos de prueba y capacidades</h2>

  <table>
    <thead><tr><th>Equipo</th><th>Pruebas realizadas</th><th>Norma / Método</th></tr></thead>
    <tbody>
      <tr><td>Máquina universal de ensayos (50 kN)</td><td>Resistencia a la tracción (tejido), resistencia al pelado (costuras), propagación del desgarro</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Banco de pruebas de retención de aire (programable)</td><td>Resistencia a 1000 ciclos de inflado/desinflado, prueba de mantenimiento de presión de 30 min</td><td>ISO 6185 (interno)</td></tr>
      <tr><td>Útil de pelado de costuras (pelado motorizado de 180°)</td><td>Resistencia al pelado de costuras soldadas y encoladas a 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Medidor de presión hidrostática</td><td>Resistencia del tejido a la penetración de agua (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Medidor de espesor digital y micrómetro</td><td>Espesor del tejido, espesor de la pared del tubo, espesor de la película adhesiva</td><td>ISO 2286-3</td></tr>
      <tr><td>Cámara climática</td><td>Acondicionamiento de temperatura (-40 °C a +80 °C) para pruebas de grietas por frío y envejecimiento por calor</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Espectrofotómetro de color</td><td>Medición del color Delta-E tras la exposición a rayos UV</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>Los puntos de inspección — del material a la entrega</h2>

  <p>Cada barco sigue un plan de calidad definido con puntos de inspección obligatorios. Ningún barco puede omitir un punto; cada punto debe ser aprobado por un inspector de calidad antes de que comience la siguiente etapa de producción.</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspección del material entrante</p>
            <p class="text-xs text-gray-500 mt-1">Lote de tejido, lote de adhesivo, herrajes: todo se comprueba contra la especificación de entrada antes de su liberación a producción.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspección de la soldadura en proceso</p>
            <p class="text-xs text-gray-500 mt-1">La probeta de soldadura de la primera pieza se prueba (pelado + visual) al inicio de cada turno de producción.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Prueba de aire de la cámara</p>
            <p class="text-xs text-gray-500 mt-1">Cada cámara se presuriza a 1.5 veces la presión de trabajo y se mantiene durante 30 min. Los datos se registran por número de serie.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspección previa a la entrega</p>
            <p class="text-xs text-gray-500 mt-1">Inspección completa del barco: todos los herrajes apretados, sistemas funcionales, sin defectos cosméticos. Lista de verificación de 100 puntos.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Control 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Certificación final</p>
            <p class="text-xs text-gray-500 mt-1">Se compilan los informes de prueba, se revisan los registros de inspección y se emite el Certificado de Conformidad.</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>Indicadores clave de calidad (promedio móvil 2025)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Rendimiento de primer paso (lote de tejido)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Tasa de rechazo de soldadura (metro lineal)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Cámaras probadas por aire antes del montaje</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">Cumplimiento de la categoría de diseño</span>
    </div>
  </div>


  <h2>Nuestro equipo de calidad</h2>

  <p>El laboratorio cuenta con un responsable de calidad (10 años en aseguramiento de calidad del sector marino, Ingeniero de Calidad Certificado por ASQ), dos inspectores de calidad (cada uno con certificación NDT de Nivel 2 en inspección visual) y un técnico de materiales responsable de todas las
  pruebas físicas. El equipo se somete anualmente a pruebas de competencia a través de un proveedor independiente de terceros para garantizar que nuestros resultados de prueba sigan siendo precisos y reproducibles.</p>


  <h2>Pruebas independientes para clientes</h2>

  <p>Nuestro Laboratorio de Calidad e Inspección está disponible para servicios de pruebas independientes. Si necesita verificar una especificación de tejido, validar un nuevo sistema de adhesivo u obtener un informe de prueba de terceros para una calificación de adquisición, podemos realizar las
  pruebas según la norma aplicable y emitir un informe de prueba certificado.</p>

  <p>Ejemplos de trabajos recientes de pruebas para terceros:</p>

  <ul>
    <li>Comparación de la resistencia al pelado de cinco productos competitivos de película adhesiva para un programa de adquisición militar europeo.</li>
    <li>Estudio de envejecimiento acelerado (UV + ciclos térmicos) para una nueva formulación de PVC pigmentado naranja, con mediciones intermedias regulares a intervalos de 500 h.</li>
    <li>Validación de la retención de aire de 50 válvulas deflectoras prototipo para un nuevo diseño de tubo de alta presión.</li>
  </ul>


  <h2>Nuestro compromiso con usted</h2>

  <p>Cuando recibe un barco Afarer, también recibe su expediente de calidad: un registro compilado de los resultados de prueba que se aplican a su barco específico. Certificado del lote de tejido, pruebas de pelado de la soldadura, registros de la prueba de aire de las cámaras y lista de
  verificación de la inspección previa a la entrega. Cada número es trazable. Cada inspector está identificado. Esto no es solo papeleo: es nuestra promesa de que lo que entregamos es lo que especificamos.</p>

  <p>Si alguna vez tiene una preocupación sobre la calidad, puede contactar directamente con el laboratorio: los datos de contacto están impresos en su certificado de conformidad. Nos tomamos cada consulta en serio y nos comprometemos a realizar una investigación formal en un plazo de 48 horas.</p>

hero:
  tagline: Seguridad
  title: Estándares y certificación de seguridad
  subtitle: Cada producto afarer se somete a pruebas rigurosas y cumple con los estándares internacionales de seguridad para uso recreativo y profesional.

certifications:
  - title: Certificación CE
    description: Todos los equipos de seguridad afarer cumplen con los requisitos de marcado CE según el Reglamento Europeo de Equipos de Protección Personal (UE) 2016/425.
  - title: 'Certificación ISO 12402'
    description: 'Los chalecos salvavidas cumplen con los estándares de flotación ISO 12402. El Life Vest Classic proporciona flotabilidad 50N+; el Life Vest Pro cumple con los requisitos SOLAS con inflado automático.'
  - title: Cumplimiento SOLAS
    description: El Life Vest Pro cumple con las regulaciones SOLAS (Seguridad de la vida en el mar) para operaciones marítimas en alta mar y comerciales.


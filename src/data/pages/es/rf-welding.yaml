intro: >-
  Un bote inflable es tan fiable como sus costuras. Una sola soldadura débil puede comprometer toda una cámara, y en el mar, la falla de una cámara no es un inconveniente; es un peligro para la seguridad. En {SITE.name}, hemos invertido en un Centro de Soldadura por Radiofrecuencia (RF) dedicado que
  combina prensas de soldadura dieléctrica de grado industrial con un estricto control de procesos y pruebas posteriores a la soldadura. Cada costura que producimos está documentada, es rastreable y certificada para cumplir o superar los requisitos de — la norma internacional para embarcaciones
  inflables.
content_html: >-
  <h2>La ciencia detrás de la costura</h2>

  <p>La soldadura RF utiliza energía electromagnética de alta frecuencia (típicamente 27,12 MHz) para excitar las moléculas polares dentro de la tela recubierta de PVC o Hypalon, generando calor de forma precisa en la interfaz del material. A diferencia de la soldadura por aire caliente o por cuña
  caliente, la soldadura RF crea un verdadero enlace molecular — las dos capas de tela se fusionan en un único material homogéneo en la zona de soldadura, produciendo una unión tan resistente como el material original.</p>


  <h2>Equipamiento de soldadura y control de procesos</h2>

  <p>Nuestro centro de soldadura está equipado con:</p>

  <table>
    <thead><tr><th>Máquina</th><th>Potencia / Capacidad</th><th>Aplicación</th></tr></thead>
    <tbody>
      <tr><td>Prensa dieléctrica RF 1</td><td>15 kW, placa 2000 × 600 mm</td><td>Costuras longitudinales principales, uniones de espejo a tubo</td></tr>
      <tr><td>Prensa dieléctrica RF 2</td><td>10 kW, placa 1500 × 500 mm</td><td>Soldaduras de tabiques, fijación de conos, parches de válvulas</td></tr>
      <tr><td>Soldadora RF controlada por CNC</td><td>8 kW, mesa XY 2500 × 1200 mm</td><td>Costuras curvas, estampado de logos/paneles, parcheo de precisión</td></tr>
      <tr><td>Soldadora automática por cuña caliente</td><td>Temperatura variable, 1,2 m/min máx.</td><td>Método de respaldo para materiales Hypalon/CSM</td></tr>
    </tbody>
  </table>

  <p>Cada prensa RF está equipada con monitoreo de temperatura y presión de circuito cerrado. Los parámetros de soldadura — potencia, tiempo de prensado, tiempo de enfriamiento, presión del electrodo — se programan por tipo de material y se registran en nuestro Sistema de Ejecución de Manufactura
  (MES) para trazabilidad completa.</p>


  <h2>Pruebas de calidad de soldadura — cada costura, cada bote</h2>

  <p>La integridad de la soldadura se verifica mediante un protocolo obligatorio de cuatro pruebas:</p>

  <ol>
    <li><strong>Inspección visual</strong> — El 100 % de las costuras se inspecciona visualmente en busca de quemaduras, desalineación, contaminación o fusión incompleta. Umbral de rechazo: 0,5 % de metros lineales.</li>
    <li><strong>Prueba de desprendimiento ()</strong> — Se corta una tira de 25 mm de ancho de una probeta soldada con cada lote de producción. Fuerza mínima de desprendimiento: 120 N/25 mm para PVC 1100 dtex.</li>
    <li><strong>Prueba de retención de aire</strong> — Cada cámara terminada se presuriza a 1,5 × presión de trabajo y se mantiene durante 30 minutos. La caída de presión no debe exceder el 2 %.</li>
    <li><strong>Prueba de ciclo térmico</strong> — Las probetas de muestra se someten a 50 ciclos de -20 °C a +60 °C, y luego se vuelven a probar de desprendimiento. Pérdida de resistencia aceptable: &lt; 10 %.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Comparación de resistencia de desprendimiento — Soldadura RF vs Aire Caliente (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Soldadura RF</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Aire Caliente</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium"> min</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">La soldadura RF alcanza consistentemente el 90-95 % de la resistencia del material original, muy por encima del mínimo.</p>
  </div>


  <h2>Experiencia profesional</h2>

  <p>Nuestro equipo de soldadura está liderado por un ingeniero de procesos senior con 11 años de experiencia en soldadura dieléctrica de textiles recubiertos. Cada operador completa un programa de certificación interno de 6 meses antes de poder trabajar en costuras de producción. La recertificación
  es requerida anualmente, incluyendo una prueba práctica de soldadura evaluada según nuestro estándar interno de Grado A (resistencia de desprendimiento ≥ 160 N/25 mm).</p>


  <h2>Soluciones de soldadura personalizadas para requisitos únicos</h2>

  <p>Entendemos que una única especificación de soldadura no se adapta a todas las aplicaciones. Nuestro Centro de Soldadura RF desarrolla rutinariamente configuraciones de costuras personalizadas para clientes con requisitos especiales:</p>

  <ul>
    <li><strong>Parches de refuerzo multicapa</strong> — para zonas de alto desgaste como rebordes de rozamiento y conos de proa, desarrollamos soldaduras RF de múltiples pasadas que integran una capa exterior resistente al desgaste sin comprometer la flexibilidad.</li>
    <li><strong>Costuras conductoras o opacas a RF</strong> — para embarcaciones militares o de vigilancia que requieren blindaje electromagnético, soldamos capas de malla conductora dentro de la estructura de la costura.</li>
    <li><strong>Soldadura de paneles de cambio de color</strong> — paneles de tela bicolor (p. ej., casco naranja + costado gris) soldados con una solapa oculta para mantener la estética de la marca sin una línea de unión visible.</li>
  </ul>


  <h2>Nuestro compromiso con usted</h2>

  <p>Cada bote que entregamos lleva nuestra garantía de calidad de soldadura: si alguna costura falla en servicio normal dentro del período de garantía, reparamos o reemplazamos la cámara afectada sin costo, y se realiza una investigación de causa raíz para prevenir la recurrencia. Esto no es
  simplemente una garantía — es un compromiso con la mejora continua impulsado por datos operativos del mundo real.</p>

  <p>Cuando elige {SITE.name}, está eligiendo costuras que están diseñadas, probadas y documentadas — no simplemente soldadas. Esa es la diferencia entre un bote que flota y un bote que rinde.</p>

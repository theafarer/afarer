meta:
  title: Cómo Elegir el Grosor de un SUP — Análisis de Ingeniería | {SITE}
  description: 'Guía técnica sobre el grosor de las tablas SUP inflables: cómo las tablas de 4”, 5” y 6” difieren en rigidez, peso, estabilidad, dirección y rendimiento. Recomendaciones de grosor para excursión, yoga, surf, carreras y remo integral.'

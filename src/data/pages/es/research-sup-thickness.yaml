hero:
  tagline: Ingeniería
  title: Cómo Elegir el Grosor de un SUP — Análisis de Ingeniería
  subtitle: Lectura de 6 min
content_html: >
  <h2>Los tres grosores estándar</h2>


  <h3>4" (10 cm) – Gira y Actuaciones</h3>

  <ul>
    <li>Máxima rigidez – menos flexión bajo carga</li>
    <li>Más ligero – menos material, menos volumen de aire</li>
    <li>Excelente seguimiento – reducción del balanceo lateral</li>
    <li>Más rápido – reducción de la resistencia, planeo más fácil</li>
    <li>Lo mejor para: Turismo, competición, fitness paddle, palistas experimentados</li>
  </ul>


  <h3>5" (12,7 cm) – En todo lugar</h3>

  <ul>
    <li>Buena rigidez – relación flexión-rigidez equilibrada</li>
    <li>Peso moderado – uso estándar de materiales</li>
    <li>Buena estabilidad secundaria primaria</li>
    <li>Mejor para: Remo recreativo, principiantes, uso casual de lagos y ríos</li>
  </ul>


  <h3>6" (15,2 cm) – Estabilidad y Yoga</h3>

  <ul>
    <li>Mayor estabilidad primaria: flotabilidad masiva</li>
    <li>Más pesado: más material de PVC, mayor volumen de aire</li>.
    <li>Más lento: más resistencia, más difícil de mantener en el planeo</li>
    <li>Mejor para: yoga/fitness, palistas pesados (100 kg), condiciones muy agitadas</li>
  </ul>


  <h2>Análisis de ingeniería</h2>

  <p>La rigidez de un SUP inflable está determinada por la presión interna del aire y el momento de inercia de la sección transversal de la placa. A 20 PSI, una placa de 4" muestra aproximadamente un 30% menos de deflexión bajo carga que una de 6" del mismo ancho y longitud. La estabilidad primaria
  proviene del ancho y flotabilidad en la línea de flotación; La estabilidad secundaria está influida por la forma del raíl y el ancho de la tabla.</p>


  <h2>Grosor por peso del palista</h2>

  <table class="w-texto completo-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <ª clase="p-3 texto-fuente-izquierda-texto seminegris-borde 900">Peso del palista</th>
        <ª clase="p-3 texto-fuente izquierda-texto seminegris-borde 900">Grosor recomendado</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 borde">Menos de 65 kg (143 lbs)</td><td class="p-3 borde">4"</td></tr>
      <tr><td class="p-3 borde">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 borde">5"</td></tr>
      <tr><td class="p-3 borde">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 borde">5" o 6"</td></tr>
      <tr><td class="p-3 borde">Más de 115 kg (253 lbs)</td><td class="p-3 borde">6"</td></tr>
    </tbody>
  </table>


  <h2>Compromiso entre grosor y PSI</h2>

  <p>Un error común es pensar que un PSI más alto puede compensar un grosor excesivo. A 25 PSI, una placa de 6" muestra más flexión que una de 4" a 15 PSI porque el momento geométrico de inercia domina la ecuación de rigidez. Para los palistas orientados al rendimiento, una tabla más fina a menor
  presión supera a una tabla más gruesa a presión más alta.</p>


  <h2>Formación de Afarer</h2>

  <ul>
    <li><strong>Tablas de 4":</strong> Serie Cheetah Touring – SUP de turismo de 12' x 30" x 4" para fitness y remo de larga</li> distancia
    <li><strong>Tablas de 5":</strong> Serie Cheetah All-Round – 10'6" x 32" x 5" para uso recreativo</li>
    <li><strong>Tablas de 6":</strong> Serie Cheetah Ultra-Stable – 10' x 34" x 6" para yoga, grandes palistas y plataformas fotográficas</li>
  </ul>

  <p>Todas las placas utilizan 1.680 núcleos de puntadas caídas DTEX con una presión nominal de 20 PSI y laminados de PVC de 1,2 mm.</p>

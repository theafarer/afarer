hero:
  tagline: Ingeniería
  title: Cómo Elegir el Grosor de un SUP — Análisis de Ingeniería
  subtitle: Lectura de 6 min
content_html: |-
  <h2>Los tres espesores estándar</h2>

  <h3>4" (10 cm) – Travesía &amp; rendimiento</h3>
  <ul>
    <li>Máxima rigidez: menor flexión bajo carga</li>
    <li>Más ligera: menos material, menos volumen de aire</li>
    <li>Excelente trayectoria: menos balanceo lateral</li>
    <li>Más rápida: menor resistencia, deslizamiento más fácil</li>
    <li>Ideal para: travesías, carreras, remo de fitness y palistas experimentados</li>
  </ul>

  <h3>5" (12.7 cm) – Todo terreno</h3>
  <ul>
    <li>Buena rigidez: equilibrio entre flexión y rigidez</li>
    <li>Peso moderado: uso estándar de material</li>
    <li>Buena estabilidad primaria + secundaria</li>
    <li>Ideal para: remo recreativo, principiantes y uso ocasional en lagos y ríos</li>
  </ul>

  <h3>6" (15.2 cm) – Estabilidad &amp; yoga</h3>
  <ul>
    <li>Máxima estabilidad primaria: gran flotabilidad</li>
    <li>La más pesada: más material de PVC, mayor volumen de aire</li>
    <li>La más lenta: más resistencia, más difícil mantener el deslizamiento</li>
    <li>Ideal para: yoga/fitness, palistas pesados (más de 100 kg) y condiciones con mucha marejada</li>
  </ul>

  <h2>Análisis de ingeniería</h2>
  <p>La rigidez de un SUP hinchable depende de la presión interna del aire y del momento de inercia de la sección transversal de la tabla. A 20 PSI, una tabla de 4" muestra aproximadamente un 30% menos de deflexión bajo carga que una tabla de 6" del mismo ancho y largo. La estabilidad primaria proviene del ancho de la línea de flotación y de la flotabilidad; la estabilidad secundaria se ve influida por la forma del raíl y el ancho de la tabla.</p>

  <h2>Espesor según el peso del palista</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Peso del palista</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Espesor recomendado</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Menos de 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" o 6"</td></tr>
      <tr><td class="p-3 border">Más de 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Compromiso entre espesor y PSI</h2>
  <p>Un error común es creer que un PSI más alto puede compensar un espesor excesivo. A 25 PSI, una tabla de 6" muestra más flexión que una tabla de 4" a 15 PSI porque el momento de inercia geométrico domina la ecuación de rigidez. Para los palistas orientados al rendimiento, una tabla más fina a menor presión supera a una tabla más gruesa a mayor presión.</p>

  <h2>Gama de Afarer</h2>
  <ul>
    <li><strong>Tablas de 4":</strong> serie Cheetah Touring – SUP de travesía de 12' x 30" x 4" para remo de fitness y largas distancias</li>
    <li><strong>Tablas de 5":</strong> serie Cheetah All-Round – 10'6" x 32" x 5" para uso recreativo</li>
    <li><strong>Tablas de 6":</strong> serie Cheetah Ultra-Stable – 10' x 34" x 6" para yoga, palistas de gran tamaño y plataformas de fotografía</li>
  </ul>
  <p>Todas las tablas utilizan núcleos de drop stitch de 1,680 DTEX con presión nominal de 20 PSI y laminados de PVC de 1.2 mm.</p>

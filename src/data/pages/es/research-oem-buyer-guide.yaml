meta:
  title: Guía del Comprador OEM — Adquisición de Embarcaciones Inflables desde Asia | {SITE}
  description: 'Guía completa para la adquisición de botes inflables, SUPs, kayaks y RIBs de fabricantes asiáticos: lista de verificación de evaluación de fábrica, protocolos de control de calidad, verificación de cumplimiento, negociación de MOQ, términos de envío y errores comunes.'
back_text: Volver a la investigación
hero:
  tagline: Aprovisionamiento
  title: 'Guía del Comprador OEM: Aprovisionamiento de Embarcaciones Inflables desde Asia'
  subtitle: Lectura de 12 min
content_html: |-
  <h2>1. Pre-cualificación: qué buscar en una fábrica</h2>

  <h3>Certificados de cumplimiento</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Sistema de gestión de calidad</li>
    <li><strong>Certificación CE</strong> – Verificar el número del organismo notificado</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Auditorías de cumplimiento social</li>
    <li><strong>REACH / RoHS</strong> – Declaraciones de cumplimiento de materiales</li>
  </ul>

  <h3>Capacidades de fabricación</h3>
  <ul>
    <li>Tejido del núcleo de drop stitch interno frente a subcontratado</li>
    <li>Línea de recubrimiento / laminación de PVC</li>
    <li>Equipos de soldadura RF y soldadura por aire caliente</li>
    <li>Fabricación de moldes interna (mecanizado CNC)</li>
    <li>Laboratorio de pruebas (pruebas de presión, envejecimiento UV, pruebas de tracción)</li>
  </ul>

  <h3>Verificación de la experiencia</h3>
  <ul>
    <li>Años en la fabricación de embarcaciones hinchables (mínimo 5 años)</li>
    <li>Número de ingenieros en plantilla</li>
    <li>Clientes OEM/ODM existentes (solicitar referencias)</li>
    <li>Destinos de exportación: ¿ya envían a su mercado objetivo?</li>
  </ul>

  <h2>2. Protocolos de control de calidad</h2>
  <p>Control de calidad de materiales entrantes: resistencia a la tracción (ASTM D751 o ISO 1421), resistencia al desgarro (ASTM D2261 o ISO 4674), resistencia de adherencia, comprobaciones puntuales de envejecimiento UV.</p>
  <p>Control de calidad en proceso: seguimiento de la resistencia de costuras cada 50 unidades, verificación del par de las válvulas, comprobaciones de la densidad de hilos del drop stitch y comprobaciones dimensionales frente a los planos CAD.</p>
  <p>Inspección final: prueba de retención de inflado al 100% (24 horas, caída máxima del 5%), inspección visual, prueba de funcionamiento de válvulas y ensayo por muestreo aleatorio (AQL 2.5 o 4.0 según ISO 2859).</p>

  <h2>3. Lista de verificación de documentación de cumplimiento</h2>
  <ul>
    <li>Declaración de conformidad (DoC) que haga referencia a la directiva de la UE correcta</li>
    <li>Certificado CE del organismo notificado</li>
    <li>Informe de ensayo de un laboratorio acreditado</li>
    <li>Fichas de datos de seguridad de materiales (MSDS)</li>
    <li>Declaración de cumplimiento REACH</li>
    <li>Lista de materiales con trazabilidad del proveedor</li>
    <li>Informe de inspección de fábrica</li>
  </ul>

  <h2>4. Negociación del MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Tipo de producto</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">MOQ estándar</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Rango negociable</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Tablas de SUP</td><td class="p-3 border">50 – 100 unidades</td><td class="p-3 border">5 – 10 unidades (prueba)</td></tr>
      <tr><td class="p-3 border">Kayaks</td><td class="p-3 border">50 – 100 unidades</td><td class="p-3 border">5 – 10 unidades (prueba)</td></tr>
      <tr><td class="p-3 border">Barcos hinchables</td><td class="p-3 border">50 – 100 unidades</td><td class="p-3 border">2 – 5 unidades (prueba)</td></tr>
      <tr><td class="p-3 border">Barcos RIB</td><td class="p-3 border">20 – 50 unidades</td><td class="p-3 border">2 – 5 unidades (prueba)</td></tr>
      <tr><td class="p-3 border">Seguridad / Accesorios</td><td class="p-3 border">200 – 500 unidades</td><td class="p-3 border">50 – 100 unidades (prueba)</td></tr>
    </tbody>
  </table>

  <h2>5. Logística y envíos</h2>
  <p>Incoterms comunes: <strong>FOB</strong> (la fábrica entrega en el puerto de salida – el más común), <strong>EXW</strong> (el comprador gestiona todo el envío desde la puerta de la fábrica), <strong>CIF</strong> (la fábrica paga el flete y el seguro hasta el puerto de destino).</p>
  <p>Los productos hinchables son de bajo peso y gran volumen; el peso volumétrico (DIM) suele determinar el coste del envío. Solicite un embalaje al vacío para reducir el volumen entre un 50 y un 60%. Flete marítimo desde China a la UE: 25–35 días; a la costa oeste de EE. UU.: 15–20 días.</p>

  <h2>6. Errores comunes</h2>
  <ul>
    <li><strong>Sin auditoría de fábrica:</strong> Realice o contrate siempre una auditoría de terceros (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Solo especificaciones verbales:</strong> Hoja de especificaciones técnicas detallada firmada por ambas partes</li>
    <li><strong>Omitir la aprobación de muestras:</strong> Aprobación por escrito de las muestras antes de la producción en serie</li>
    <li><strong>Sin control de calidad durante la producción:</strong> Inspección de terceros durante la producción (DUPRO) y antes del envío (PSI)</li>
    <li><strong>Ignorar el cumplimiento:</strong> Verificar la certificación CE/UKCA antes de la producción</li>
  </ul>

  <h2>7. Por qué Afarer</h2>
  <p>Afarer fabrica embarcaciones hinchables OEM/ODM desde 2012. Con unas instalaciones certificadas ISO 9001 de 12,000 m&sup2;, más de 25 ingenieros y certificación CE en todas las líneas de producto, cumplimos todos los criterios de esta guía. Ofrecemos MOQ de prueba para nuevos socios y paquetes completos de documentación de cumplimiento.</p>

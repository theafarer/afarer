  title: Guía del Comprador OEM — Adquisición de Embarcaciones Inflables desde Asia | {SITE}
  description: 'Guía completa para la adquisición de botes inflables, SUPs, kayaks y RIBs de fabricantes asiáticos: lista de verificación de evaluación de fábrica, protocolos de control de calidad, verificación de cumplimiento, negociación de MOQ, términos de envío y errores comunes.'
back_text: Volver a la investigación
hero:
  tagline: Aprovisionamiento
  title: 'Guía del Comprador OEM: Aprovisionamiento de Embarcaciones Inflables desde Asia'
  subtitle: Lectura de 12 min
content_html: >
  <h2>1. Pre-calificación: Qué buscar en una fábrica</h2>


  <h3>Certificados de cumplimiento</h3>

  <ul>
    <li><strong>ISO 9001:2015</strong> – Sistema de gestión de calidad</li>
    <li><strong>Certificación CE</strong> – Verificar el número del Organismo Notificado</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Auditorías de cumplimiento social</li>
    <li><strong>REACH / RoHS</strong> – Declaraciones de cumplimiento de materiales</li>
  </ul>


  <h3>Capacidades de fabricación</h3>

  <ul>
    <li>Tejido con núcleo con punto de caída interno vs. externalizado</li>
    <li>Línea de recubrimiento / laminación de PVC</li>
    <li>Equipos de soldadura RF y soldadura de aire caliente</li>
    Fabricación interna de <li>moldes (mecanizado CNC)</li>
    <li>Laboratorio de pruebas (pruebas de presión, envejecimiento UV, pruebas de tracción)</li>
  </ul>


  <h3>Verificación de experiencia</h3>

  <ul>
    <li>Años en la fabricación de embarcaciones inflables (mínimo 5 años)</li>
    <li>Número de ingenieros en plantilla</li>
    <li>Clientes OEM/ODM existentes (referencias de solicitud)</li>
    <li>Destinos de exportación: ¿ya envían a tu mercado objetivo?</li>
  </ul>


  <h2>2. Protocolos de control de calidad</h2>

  <p>Control de calidad del material entrante: resistencia a la tracción (ASTM D751 o ISO 1421), resistencia al desgarro (ASTM D2261 o ISO 4674), resistencia a la adhesión, comprobaciones puntuales de envejecimiento UV.</p>

  <p>Control de calidad en proceso: monitorización de la resistencia de las costuras cada 50 unidades, verificación del par de válvulas, comprobaciones de densidad de hilo por punto de desfilado, comprobaciones dimensionales frente a planos CAD.</p>

  <p>Inspección final: prueba de retención de inflado al 100% (24 horas, caída máxima del 5%), inspección visual, prueba de función de válvulas, prueba de muestra aleatoria (AQL 2.5 o 4.0 según ISO 2859).</p>


  <h2>3. Lista de verificación de documentación de cumplimiento</h2>

  <ul>
    <li>Declaración de conformidad (DoC) que hace referencia a la directiva correcta de la UE</li>
    <li>Certificado CE del organismo notificado</li>
    <li>Informe de prueba del laboratorio acreditado</li>
    <li>Fichas de datos de seguridad de materiales (MSDS)</li>
    <li>Declaración de cumplimiento de REACH</li>
    <li>Lista de materiales con trazabilidad de proveedores</li>
    <li>Informe de inspección de fábrica</li>
  </ul>


  <h2>4. Negociación de la MOQ</h2>

  <table class="w-texto completo-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <ª clase="p-3 texto-fuente-izquierda-texto seminegris-borde 900">Tipo de producto</th>
        <ª clase="p-3 texto-fuente izquierda-texto seminegris-borde 900">MOQ estándar</th>
        <ª clase="p-3 texto-izquierda-texto seminegris-gris-borde 900">Rango negociable</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 frontera">SUP Boards</td><td class="p-3 borde">50 – 100 unidades</td><td class="p-3 borde">5 – 10 unidades (prueba)</td></tr>
      <tr><td class="p-3 border">Kayaks</td><td class="p-3 border">50 – 100 unidades</td><td class="p-3 border">5 – 10 unidades (prueba)</td></tr>
      <tr><td class="p-3 border">Inflatable Boats</td><td class="p-3 border">50 – 100 unidades</td><td class="p-3 border">2 – 5 unidades (prueba)</td></tr>
      <tr><td class="p-3 border">RIB Boats</td><td class="p-3 border">20 – 50 unidades</td><td class="p-3 border">2 – 5 unidades (prueba)</td></tr>
      <tr><clase td="p-3 borde">Seguridad / Accesorios</td><clase td="p-3 borde">200 – 500 unidades</td><clase td="frontera p-3">50 – 100 unidades (prueba)</td></tr>
    </tbody>
  </table>


  <h2>5. Logística y envíos</h2>

  <p>Términos comunes de Inco: <strong>FOB</strong> (Fábrica entrega en puerto de salidas – lo más común), <strong>EXW</strong> (El comprador organiza todo el envío desde la puerta de la fábrica), <strong>CIF</strong> (Fábrica paga el transporte y el seguro al puerto de destino).</p>

  <p>Los productos inflables son de bajo peso y alto volumen: el peso volumétrico (DIM) suele determinar el coste de envío. Solicita envasado al vacío para reducir el volumen en un 50–60%. Transporte marítimo desde China a la UE: 25–35 días; a la costa oeste de EE. UU.: 15–20 días.</p>


  <h2>6. Trampas comunes</h2>

  <ul>
    <li><strong>Sin auditoría de fábrica:</strong> Realizar o encargar siempre una auditoría de terceros (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Solo especificaciones verbales:</strong> hoja de especificaciones técnicas detallada firmada por ambas partes</li>
    <li><strong>Omitir la aprobación de la muestra:</strong> Aprobación por escrito de las muestras antes de la producción masiva</li>
    <li><strong>Sin control de calidad durante la producción:</strong> Inspección de terceros durante la producción (DUPRO) y antes del envío (PSI)</li>
    <li><strong>Ignorar el cumplimiento:</strong> Verifica la certificación CE/UKCA antes de la producción</li>
  </ul>


  <h2>7. Por qué Afarer</h2>

  <p>Afarer fabrica embarcaciones inflables OEM/ODM desde 2012. Con una instalación certificada ISO 9001 de 12.000 m², 25 ingenieros y certificación CE en todas las líneas de producto, cumplimos todos los criterios de esta guía. Ofrecemos MOQ de prueba para nuevos socios y paquetes completos de
  documentación de cumplimiento.</p>

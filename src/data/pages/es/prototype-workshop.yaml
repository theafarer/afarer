  title: Taller de Prototipos — Prototipado de SUP a Escala Real y Pruebas en el Mar | {SITE}
  description: De CAD a tabla lista para el agua en 8-12 semanas. Nuestro Taller de Prototipos construye, equipa y realiza pruebas en el mar de SUP inflables personalizados. Comience su proyecto de prototipo hoy.
back_text: De vuelta al Centro de I+D

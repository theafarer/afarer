hero:
  tagline: Laboratorio 05
  title: Taller de Prototipos
  subtitle: 'Del modelo CAD al barco listo para el mar: construido, equipado y probado'
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Fabricación de embarcaciones prototipo Afarer en taller
intro: >-
  Un modelo CAD, sin importar cuán detallado sea, no puede revelar cómo manejará realmente un barco hasta que se encuentre con el agua. Por eso nuestro Taller de Prototipos está diseñado para traducir los datos de ingeniería en una embarcación física y navegable de la manera más rápida y precisa
  posible. Cada nuevo modelo de {SITE.name}, y cada construcción personalizada significativa, pasa por este taller antes de que se comprometa la herramienta de producción.
content_html: >-
  <h2>Donde el diseño se convierte en realidad</h2>

  <p>El taller está completamente equipado para la fabricación simultánea del casco, tubos y accesorios. Este enfoque de flujo de trabajo paralelo reduce el tiempo de entrega del prototipo a 8-12 semanas desde la liberación de ingeniería, en comparación con la norma del sector de 16-20 semanas.
  Cuando su aplicación requiere una solución especializada, podemos pasar de la conceptuación a la validación en agua en menos de tres meses.</p>


  <h2>Capacidades del taller</h2>

  <table>
    <thead><tr><th>Estación de trabajo</th><th>Equipamiento</th><th>Función</th></tr></thead>
    <tbody>
      <tr><td>Fabricación del casco</td><td>Horno de moldeo rotacional (HDPE), bahía de soldadura TIG (aluminio), moldes de moldeo manual (fibra de vidrio)</td><td>Producción de cascos a escala completa en los tres tipos de material</td></tr>
      <tr><td>Ensamblaje de tubos</td><td>Prensa de soldadura RF, estación de termosellado con aire caliente, dispositivo de prueba de inflado</td><td>Fabricación de ensamblajes de tubos a escala completa con todos los tabiques, conos y válvulas</td></tr>
      <tr><td>Accesorios y equipamiento</td><td>Grua de motor (500 kg), estructura de consola mock-up, prensa hidráulica de mangueras, tablero de arnés eléctrico</td><td>Equipamiento completo: motor, dirección, controles, sistema de combustible, electrónica, asientos</td></tr>
      <tr><td>Bahía de instrumentación</td><td>Sensor de velocidad GPS, caudalímetro, acelerómetros, arreglo de termoparas, registrador de datos</td><td>Instalación y calibración de instrumentación para pruebas en mar</td></tr>
    </tbody>
  </table>


  <h2>El proceso del prototipo — paso a paso</h2>

  <ol>
    <li><strong>Traspaso de ingeniería</strong> — El paquete de diseño (modelo 3D, informe FEA, lista de materiales, programa de laminado) es revisado formalmente por el jefe del taller y el ingeniero de proyecto. Cualquier inconveniente de fabricación se identifica y resuelve antes de iniciar el corte.</li>
    <li><strong>Producción del casco</strong> — El casco se construye según la especificación de ingeniería. Para HDPE: el programa de moldeo rotacional se carga desde la simulación Moldex3D. Para aluminio: las placas cortadas por CNC se sueldan en la bahía TIG siguiendo el mapa de soldadura aprobado. Para fibra de vidrio: el cuaderno de laminado se sigue capa por capa.</li>
    <li><strong>Fabricación de tubos</strong> — La tela se corta utilizando plantillas de patrón CNC, luego se suelda por RF en cámaras a escala completa. Cada cámara se infla a presión de prueba y se deja durante 24 h para su estabilización inicial.</li>
    <li><strong>Ensamblaje y accesorios</strong> — El casco y los tubos se unen. Se instala el motor, se conectan la dirección y los controles, se monta el sistema de combustible y se cablean y verifican todos los circuitos eléctricos.</li>
    <li><strong>Pruebas estáticas</strong> — Antes de que el bote toque el agua, se somete a: verificación de flotabilidad (carga completa + 30 % de reserva), prueba de presión del sistema de combustible, prueba de ciclo de tope completo del sistema de dirección, prueba de continuidad de tierra eléctrica.</li>
    <li><strong>Programa de pruebas en mar</strong> — 20 horas de pruebas en agua, detalladas a continuación.</li>
    <li><strong>Revisión del prototipo</strong> — Se lleva a cabo una reunión formal de aprobación con los equipos de ingeniería, producción y calidad. Los cambios de diseño requeridos se documentan e incorporan en la liberación de producción.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Programa de pruebas en mar de 20 horas — Cronograma de pruebas</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Maniobras portuarias — manejo a baja velocidad, reversa, verificación de defensas</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Prueba de velocidad — velocidad máxima verificada por GPS, velocidad de crucero, consumo de combustible en 3 puntos de RPM</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prueba de giro — diámetro táctico, avance y transferencia a 20 kn, estribor y babor</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prueba de impacto — pasadas repetidas en oleaje de 0,5–1,0 m; acelerómetro en la base del asiento de gobierno</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prueba de estabilidad — ángulo de escora estática con 4 tripulantes + equipo a estribor, carga descentrada</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prueba de resistencia — 3 h continuas a velocidad de crucero; monitoreo de temperatura (motor, combustible, eléctrico)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Inspección final — inspección post-prueba de todos los sistemas, apretar/verificar todas las fijaciones, documentar hallazgos</span>
      </div>
    </div>
  </div>


  <h2>Prototipado personalizado para aplicaciones únicas</h2>

  <p>El Taller de Prototipos es donde resolvemos los problemas que los botes de producción estándar no pueden abordar. Los ejemplos más recientes incluyen:</p>

  <ul>
    <li>Un RIB de 7,8 m para una organización de búsqueda y rescate, que requiere una estructura de cabina personalizada con protección contra vuelco, soportes de camilla integrados y una cápsula de sonar montada en la proa — todo prototipado, equipado e instalado en nuestras instalaciones.</li>
    <li>Un bote inflable de 5,2 m para un contratista de levantamientos hidrográficos, con espejo modificado, mástil de instrumentos extraíble y compartimentos para transductores a través del casco diseñados para minimizar la perturbación del flujo.</li>
    <li>Un tender de 4,5 m con tracción eléctrica para un superyate, donde el prototipo se utilizó para validar el alcance, la infraestructura de carga y los niveles de ruido antes de que el cliente se comprometiera con una flota de cuatro unidades.</li>
  </ul>


  <h2>Nuestro equipo de prototipado</h2>

  <p>El taller cuenta con ocho técnicos navales multifuncionales, cada uno capacitado en al menos dos de las tres disciplinas principales (casco, tubos, accesorios). El jefe del equipo es un maestro constructor de barcos con 16 años de experiencia que abarca desde construcciones únicas
  personalizadas hasta series de producción. A cada prototipo se le asigna un ingeniero de proyecto dedicado que sirve como punto de contacto único con el cliente a lo largo del proceso de construcción y pruebas.</p>


  <h2>Participación del cliente</h2>

  <p>Animamos activamente a nuestros clientes a asistir a los hitos clave durante la construcción del prototipo — particularmente la revisión inicial de equipamiento y la prueba en mar. Sus comentarios operativos durante estas etapas son invaluables para afinar el bote antes de que entre en
  producción. No construimos en el vacío; construimos en colaboración con usted.</p>

  <p>La prueba en mar de 20 horas también es una oportunidad para que su equipo se familiarice con el manejo del bote, la disposición de los sistemas y los requisitos de mantenimiento, asegurando una transición fluida al servicio cuando se entreguen los botes de producción.</p>

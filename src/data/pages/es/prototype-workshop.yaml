hero:
  tagline: Laboratorio 05
  title: Taller de Prototipos
  subtitle: 'Del modelo CAD a la tabla lista para el agua — construida, equipada y probada'
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Fabricación de tablas prototipo Afarer en taller
intro: >-
  Un modelo CAD, sin importar cuán detallado sea, no puede revelar cómo manejará realmente una tabla hasta que se encuentra con el agua. Por eso nuestro Taller de Prototipos está diseñado para traducir los datos de ingeniería en una tabla física y lista para el agua de la manera más rápida y precisa
  posible. Cada nuevo modelo de Afarer, y cada construcción personalizada significativa, pasa por este taller antes de que se comprometa la herramienta de producción.
content_html: >-
  <h2>Donde el diseño se convierte en realidad</h2>

  <p>El taller está completamente equipado para la fabricación simultánea del casco, los rieles y los accesorios. Este enfoque de flujo de trabajo paralelo reduce el tiempo de entrega del prototipo a 8-12 semanas desde la liberación de ingeniería, en comparación con la norma del sector de 16-20 semanas.
  Cuando su aplicación requiere una solución especializada, podemos pasar de la conceptuación a la validación en agua en menos de tres meses.</p>


  <h2>Capacidades del taller</h2>

  <table>
    <thead><tr><th>Estación de trabajo</th><th>Equipamiento</th><th>Función</th></tr></thead>
    <tbody>
      <tr><td>Fabricación del casco</td><td>Cortador de tela CNC, prensa de laminación por calor, estación de preparación de núcleo drop-stitch</td><td>Producción de cascos a escala completa en los tres tipos de construcción</td></tr>
      <tr><td>Ensamblaje de rieles y cámaras</td><td>Prensa de soldadura RF, estación de termosellado con aire caliente, dispositivo de prueba de inflado</td><td>Fabricación de ensamblajes de rieles y cámaras a tamaño completo con todos los tabiques y válvulas</td></tr>
      <tr><td>Accesorios y equipamiento</td><td>Dispositivo de fresado de caja de aletas, fijaciones para soldar soportes de carga y asas, estación de corte de almohadilla de cubierta</td><td>Equipamiento completo: aletas, soportes de carga, anclajes de correa, asas, almohadillas de cubierta, válvulas</td></tr>
      <tr><td>Bahía de instrumentación</td><td>Sensor de velocidad GPS, transductores de presión, acelerómetros, arreglo de termopares, registrador de datos</td><td>Instalación y calibración de instrumentación para pruebas en mar</td></tr>
    </tbody>
  </table>


  <h2>El proceso del prototipo — paso a paso</h2>

  <ol>
    <li><strong>Traspaso de ingeniería</strong> — El paquete de diseño (modelo 3D, informe FEA, lista de materiales, programa de laminado) es revisado formalmente por el jefe del taller y el ingeniero de proyecto. Cualquier inconveniente de fabricación se identifica y resuelve antes de iniciar el corte.</li>
    <li><strong>Producción del casco</strong> — El casco se construye según la especificación de ingeniería. Para construcción de una capa: el núcleo drop-stitch se lamina con la piel de PVC especificada. Para construcción de doble capa: la piel adicional se aplica sobre el laminado base antes de cortar el patrón. Para construcción fusionada: los parámetros de laminación se cargan desde la hoja de proceso aprobada y se verifican en una muestra de primera pieza.</li>
    <li><strong>Fabricación de rieles</strong> — La tela se corta utilizando plantillas de patrón CNC, luego se suelda por RF en rieles y cámaras a tamaño completo. Cada cámara se infla a presión de prueba y se deja durante 24 h para su estabilización inicial.</li>
    <li><strong>Ensamblaje y equipamiento</strong> — El casco y los rieles se unen. Se instalan las cajas de aletas y los soportes de carga, se colocan los anclajes de correa y las asas de transporte, se aprieta la válvula de inflado y se aplica y alinea la almohadilla de cubierta.</li>
    <li><strong>Pruebas estáticas</strong> — Antes de que la tabla toque el agua, se somete a: verificación de flotabilidad (carga completa + 30 % de reserva), prueba de retención de presión de cámaras, prueba de fuga de válvulas, prueba de tracción de asas y soportes.</li>
    <li><strong>Programa de pruebas en mar</strong> — 20 horas de pruebas en agua, detalladas a continuación.</li>
    <li><strong>Revisión del prototipo</strong> — Se lleva a cabo una reunión formal de aprobación con los equipos de ingeniería, producción y calidad. Los cambios de diseño requeridos se documentan e incorporan en la liberación de producción.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Programa de pruebas en mar de 20 horas — Cronograma de pruebas</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Familiarización en agua plana — seguimiento a baja velocidad, giros, verificación de postura y trimado</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Prueba de velocidad — velocidad máxima verificada por GPS, velocidad de crucero, ritmo sostenido en 3 frecuencias de palada</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prueba de giro — radio de giro pivotante y de barrido, respuesta de la tabla, babor y estribor</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prueba en oleaje — pasadas repetidas en oleaje de 0,5–1,0 m; acelerómetro en la posición de postura del rider</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prueba de estabilidad — ángulo de escora estática con 4 riders de peso variado, carga descentrada a estribor</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Prueba de resistencia — 3 h continuas a ritmo de crucero; monitoreo de presión de cámaras, temperatura de rieles y fatiga del rider</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Inspección final — inspección post-prueba de todos los componentes, apretar/verificar todas las fijaciones, documentar hallazgos</span>
      </div>
    </div>
  </div>


  <h2>Prototipado personalizado para aplicaciones únicas</h2>

  <p>El Taller de Prototipos es donde resolvemos los problemas que las tablas de producción estándar no pueden abordar. Los ejemplos más recientes incluyen:</p>

  <ul>
    <li>Un SUP de rescate de alta visibilidad para una organización de búsqueda y rescate, que requiere asas de agarre integradas, soportes para equipos de rescate y un casco de alta flotabilidad para la recuperación de víctimas — todo prototipado, equipado y probado en nuestras instalaciones.</li>
    <li>Un SUP de travesía expedicionaria para un contratista de levantamientos hidrográficos, con mástil de instrumentos extraíble, puertos de equipo sellados y soporte de transductor de perfil bajo diseñado para minimizar el arrastre.</li>
    <li>Un SUP de pesca compacto para la flota de un resort, donde el prototipo se utilizó para validar estabilidad, equipamiento y durabilidad bajo uso diario de alquiler antes de que el cliente se comprometiera con una flota de cuatro unidades.</li>
  </ul>


  <h2>Nuestro equipo de prototipado</h2>

  <p>El taller cuenta con ocho técnicos marinos multifuncionales, cada uno capacitado en al menos dos de las tres disciplinas principales (casco, rieles, equipamiento). El jefe del equipo es un maestro fabricante con 16 años de experiencia que abarca desde construcciones únicas
  personalizadas hasta series de producción. A cada prototipo se le asigna un ingeniero de proyecto dedicado que sirve como punto de contacto único con el cliente a lo largo del proceso de construcción y pruebas.</p>


  <h2>Participación del cliente</h2>

  <p>Animamos activamente a nuestros clientes a asistir a los hitos clave durante la construcción del prototipo — particularmente la revisión inicial de equipamiento y la prueba en mar. Sus comentarios operativos durante estas etapas son invaluables para afinar la tabla antes de que entre en
  producción. No construimos en el vacío; construimos en colaboración con usted.</p>

  <p>La prueba en mar de 20 horas también es una oportunidad para que su equipo se familiarice con el manejo de la tabla, la disposición de la cubierta y los requisitos de mantenimiento, asegurando una transición fluida al servicio cuando se entreguen las tablas de producción.</p>

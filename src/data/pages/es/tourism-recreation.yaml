seo:
  headline: 'SUP inflables para turismo y recreo: la guía completa'
  description: 'Encuentra el SUP inflable adecuado para tus vacaciones y excursiones — tablas polivalentes, de travesía y de pesca para lagos, ríos y costas. Mételo en el maletero, factúralo en el avión y remo donde quieras.'

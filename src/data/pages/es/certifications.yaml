meta:
  title: 'Certificaciones — CE, ISO 9001 y Conformidad | {SITE}'
  description: 'Certificaciones de calidad afarer: CE (Directiva 2013/53/UE), ISO 9001:2015, BSCI. Conformidad y seguridad para un fabricante de SUP hinchables y barcas.'
  keywords:
    - 'certificación CE paddle surf'
    - 'ISO 9001 paddle surf'
    - 'conformidad náutica'
    - 'certificación de paddle surf'
hero:
  tagline: Certificaciones y Normas
  title: Certificaciones de Calidad<br />& Estándares de Cumplimiento
  subtitle: Los productos afarer se fabrican de acuerdo con estándares internacionales de seguridad marítima, sistemas de gestión de calidad y regulaciones ambientales.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: certificaciones de calidad de afarer y documentación de cumplimiento
content_certifications:
  tagline: Nuestras Certificaciones
  title: Calidad Certificada,<br />Reconocida Globalmente
  subtitle: Cada producto afarer está respaldado por certificaciones que demuestran nuestro compromiso con la calidad, la seguridad y la responsabilidad ambiental.
  items:
    - title: Certificado CE
      description: Todos los productos afarer cumplen con los requisitos de marcado CE.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Nuestro SGC está certificado ISO 9001:2015 para diseño, fabricación y distribución.
      icon: tabler:clipboard-check
    - title: Marcado UKCA
      description: Los productos vendidos en el Reino Unido llevan el marcado UKCA.
      icon: tabler:shield
    - title: Cumple con BSCI
      description: afarer está auditado BSCI por práticas éticas de fabricación.
      icon: tabler:heart-handshake
    - title: Cumplimiento REACH
      description: Todos los materiales utilizados en productos afarer cumplen con el reglamento REACH de la UE
      icon: tabler:flask
    - title: Prueba de Materiales
      description: Los tejidos se prueban para resistencia, UV y grietas por frío. Cada lote se verifica.
      icon: tabler:test-pipe
content_factory:
  tagline: Normas de fábrica
  title: Excelencia de Fabricación<br />—Construido a Especificación
  subtitle: Nuestra instalación de 12.000 m² opera bajo estrictos protocolos de control de calidad.
  list:
    - 'Inspección de materiales entrantes: todas las materias primas – tela PVC, Hypalon, aluminio, contrachapado'
    - 'Control de calidad en proceso: cada etapa de producción tiene puntos de control de calidad documentados'
    - 'Prueba de presión: cada cámara inflable se prueba a 1,5× la presión nominal durante 24h'
    - 'Inspección final: los productos terminados se inspeccionan por precisión dimensional, acabado estético'
    - 'Trazabilidad de lotes: cada producto lleva un número de serie vinculado a los registros del lote de producción'
content_safety:
  tagline: Normas de seguridad marítima
  title: Seguridad Primero<br />—Diseñado para Operación Confiable
  subtitle: Los productos afarer se diseñan y prueban para cumplir estándares internacionales de seguridad marítima.
  items:
    - title: ISO 6185
      description: Los botes inflables cumplen con la norma ISO 6185.
      icon: tabler:sailboat
    - title: Normas ABYC
      description: Los sistemas eléctricos y de combustible siguen los estándares ABYC.
      icon: tabler:bolt
    - title: Cumplimiento SOLAS
      description: Los equipos de seguridad y salvamento cumplen con los requisitos SOLAS.
      icon: tabler:lifebuoy
cta:
  title: ¿Necesita productos certificados?
  subtitle: Contáctenos para requisitos de certificación, documentación y cumplimiento.
  actions:
    - variant: primary
      text: Solicitar documentos de certificación
      href: /contact
    - text: Ver nuestra página de calidad
      href: /quality

meta:
  title: 'Fabricación OEM y de Marca Privada | {SITE}'
  description: 'De la idea al contenedor: personalice cada detalle de su línea de SUP hinchable. Servicio OEM/ODM completo para marcas de paddle surf de marca privada.'
  keywords:
    - 'fabricación OEM de SUP'
    - 'paddle surf de marca privada'
    - 'SUP hinchable OEM'
    - 'fábrica de SUP personalizada'
hero:
  tagline: Fabricación OEM/ODM
  title: Fabricación OEM y de Marca Privada
  subtitle: From concept to container — customize every detail of your inflatable watercraft line
intro: >-
  Afarer ofrece servicios integrales de OEM y ODM para marcas, distribuidores y agencias gubernamentales en todo el mundo. Con 10 años de experiencia en exportación y una fábrica de 12,000 m² certificada ISO 9001 y BSCI, manejamos todo, desde el diseño del producto y el desarrollo de moldes hasta la
  producción a gran escala, el envasado y la logística.
highlight:
  - value: '10+'
    label: Años de experiencia en OEM
    detail: Desde 2012
  - value: '50+'
    label: Países exportadores
    detail: Alcance global
  - value: '200+'
    label: Proyectos personalizados entregados
    detail: A través de todas las líneas de productos
  - value: 30–45
    label: Plazo estándar de entrega (días)
    detail: De PO a FOB
services:
  - title: Diseño y Ingeniería de Productos
    description: Nuestro equipo de I+D interno trabaja con su concepto o especificación para desarrollar dibujos CAD, modelos 3D y prototipos. Ofrecemos diseño de moldes, optimización de la forma del casco y orientación en la selección de materiales.
  - title: Marca y gráficos personalizados
    description: Impresión digital a todo color, serigrafía, estampado en relieve y opciones de etiquetas. Desarrollamos gráficos de barajas específicos de la marca, branding de tubos y empaques listos para el retail.
  - title: Personalización de Materiales y Especificaciones
    description: Elija entre PVC (estándar, ecológico, retardante de fuego), Hypalon/CSM, costura de caída y construcciones híbridas. Colores de tubos personalizados, pesos de tela y opciones de refuerzo.
  - title: Empaque y Logística
    description: Empaque minorista personalizado, cajas de marca propia, envasado al vacío, paletizado y carga de contenedores. Condiciones de envío FOB Qingdao, CIF o DDP disponibles.
moq_table:
  - product: Tablas de SUP inflables
    standard_moq: 5–10 unidades
    custom_moq: 200 unidades
    lead_time: 30–45 días
  - product: Chalecos salvavidas y seguridad
    standard_moq: 100–200 unidades
    custom_moq: 1.000 unidades
    lead_time: 20–30 días
why_us:
  - title: Integración vertical
    description: 'Somos propietarios de nuestra fábrica, moldes y cadena de suministro: sin intermediarios, sin subcontratistas. Esto nos da control sobre la calidad, el costo y la entrega.'
  - title: Certificación doble
    description: Certificación de gestión de calidad ISO 9001 y cumplimiento social BSCI. Informes de auditoría de la fábrica disponibles a solicitud.
  - title: Cumplimiento CE
    description: Todos los modelos estándar cuentan con la certificación CE 2013/53/EU. Los modelos personalizados pueden obtener la certificación CE a través de nuestro proceso establecido.
  - title: MOQ bajo
    description: Comience con tan solo 5 unidades para modelos estándar. Ayudamos a las marcas emergentes a lanzarse sin comprometer exceso de inventario.

hero:
  tagline: 'Casos de éxito'
  title: 'Proyectos reales, resultados reales<br />—afarer en acción'
  subtitle: 'Vea cómo afarer se asocia con distribuidores, marcas y operadores en todo el mundo para ofrecer soluciones marinas personalizadas para cada aplicación.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Casos de éxito de afarer —proyectos de fabricación marina personalizados'
features3_cases:
  tagline: 'Casos destacados'
  title: 'Soluciones personalizadas<br />para desafíos reales'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Flota de centro de buceo europeo'
      description: 'Suministro de 12 barcos SUP 520 configurados para buceo a una cadena de centros de buceo mediterráneos. Soportes para tanques personalizados, escaleras de buceo y marca de flota. Entregado en 60 días.'
      icon: tabler:lifebuoy
    - title: 'Programa OEM distribuidor australiano'
      description: 'Desarrollo de una gama de tablas SUP de marca privada para un distribuidor australiano de deportes acuáticos. 8 modelos, empaque personalizado y logística de envío directo. Del concepto al primer envío en 90 días.'
      icon: tabler:currency-dollar
    - title: 'Suministro de botes de rescate Medio Oriente'
      description: 'Suministro de 20 botes SUP 450 Patrol a una organización de defensa civil de Medio Oriente. Cubiertas autovaciantes, equipos de navegación completos y tubos naranjas de alta visibilidad. Cumplimiento de normativas locales.'
      icon: tabler:alert-triangle
    - title: 'Asociación OEM marca europea'
      description: 'Asociación de fabricación de marca blanca con una marca marina europea. 5 modelos SUP, marca privada, derechos exclusivos de distribución para el mercado UE. Acuerdo plurianual.'
      icon: tabler:building
    - title: 'Flota de resort caribeño'
      description: 'Paquete completo de equipos de deportes acuáticos para un resort caribeño: 40 tablas SUP, 20 SUPs, 10 botes inflables y accesorios. Marca personalizada del resort en todo el equipo.'
      icon: tabler:beach
    - title: 'Contrato de patrulla costera estadounidense'
      description: 'Suministro de botes patrulla SUP 600 a una agencia de seguridad costera estadounidense. Configuración de doble motor, opciones de consola blindada e integración de electrónica militar.'
      icon: tabler:shield
cta:
  title: '¿Tiene un proyecto que desee discutir?'
  subtitle: 'Cada asociación con afarer comienza con una conversación. Cuéntenos sus requisitos y desarrollaremos una solución.'
  actions:
    - variant: primary
      text: 'Inicie su proyecto'
      href: /contact
    - text: 'Ver nuestras capacidades'
      href: /brand/marine-expertise

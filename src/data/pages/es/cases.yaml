features3_cases:
  tagline: Casos destacados
  title: Soluciones personalizadas<br />para desafíos reales
  isBeforeContent: false
  columns: 3
  items:
    - title: Flota de centro de buceo europeo
      customer: Centros de Buceo BlueMed
      country: Grecia
      industry: Buceo y Turismo Marino
      challenge: >-
        Se requerían 12 SUPs configurados para buceo para una cadena de centros de buceo en varias islas griegas. Cada tabla necesitaba un accesorio de equipo personalizado, espacio para 8 tanques y una plataforma estable para la entrada de buceadores en aguas abiertas. La flota debía llegar en un
        plazo de 60 días para el inicio de la temporada turística.
      solution: >-
        Se produjeron 12 modelos SUP Voyager Dive con soportes de equipo integrados, plataformas estables y construcción de puntada doble extra ancha para mayor estabilidad al abordar. Cada tabla estaba marcada con la librea de la flota del cliente. Las 12 tablas fueron sometidas a pruebas de
        presión y enviadas desde Qingdao en 55 días.
      product: Buceo SUP Voyager
      results: Las 12 tablas fueron entregadas a tiempo para la temporada turística. La flota ha estado en operación diaria durante 18 meses sin fallas materiales. El cliente pidió 6 unidades adicionales en el segundo año.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: El SUP Voyager Dive ha sido la columna vertebral de nuestras operaciones de buceo diarias. La estabilidad es excelente, y la disposición del almacenamiento del equipo mantiene la cubierta limpia y segura para nuestros invitados.
      icon: tabler:lifebuoy
    - title: Programa Co-Brand distribuidor australiano
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: Programa Co-Brand y Asociación
      challenge: >-
        Distribuidor australiano necesitaba una gama de tablas SUP de marca privada a precios competitivos para competir con marcas chinas de venta directa al consumidor. Requería 8 modelos únicos que abarquen desde principiantes hasta avanzados, con gráficos personalizados, embalaje personalizado y
        cumplimiento de envíos directos a puntos de venta.
      solution: >-
        Desarrollé 8 modelos de SUP (Todo Terreno, Touring, Yoga, Infantil, Deportivo, Ultra Compacto, Ultra Estable, Aguas Bravas) con paquete gráfico exclusivo australiano. Empaque minorista personalizado con códigos QR que enlazan a videos de configuración. Logística de envío directo configurada
        desde Qingdao directamente a tiendas minoristas en Australia.
      product: Línea SUP personalizada (8 modelos)
      results: Del concepto al primer envío en 90 días. Tasa de venta al por menor del 85% en la primera temporada. El distribuidor amplió la asociación para incluir modelos adicionales de SUP en el segundo año.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Un comerciante entregó una línea completa de SUP en 90 días, desde el diseño inicial hasta el piso de venta. La calidad coincide con la de las marcas que venden al doble del precio.
      icon: tabler:currency-dollar
    - title: Suministro de botes de rescate Medio Oriente
      customer: Autoridad Nacional de Defensa Civil
      country: Emiratos Árabes Unidos
      industry: Búsqueda y rescate
      challenge: La organización de defensa civil necesitaba 20 SUPs listos para patrullas para búsqueda y rescate costero, seguridad portuaria y respuesta a inundaciones. Se requerían tablas de alta visibilidad, equipo de seguridad completo y cumplimiento de las regulaciones marítimas locales.
      solution: >-
        Se suministraron 20 modelos de patrulla SUP con construcción de puntada descendente de color naranja de alta visibilidad, paquetes de seguridad completos, cinta reflectante SOLAS y construcción reforzada. Cada tabla estaba certificada CE y probada según las normas aplicables. El paquete de
        documentación incluía certificados de cumplimiento para el registro local.
      product: Patrulla de SUP
      results: Flota desplegada en 5 estaciones costeras. Las placas han estado operando en calor extremo (45°C) sin degradación. El rendimiento y la durabilidad superaron las especificaciones.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: La patrulla SUP superó nuestros requisitos operativos. En condiciones de calor extremo, las tablas no muestran signos de degradación por UV después de 24 meses de uso diario.
      icon: tabler:alert-triangle
    - title: Asociación Co-Brand europea
      customer: Equipos Marinos del Mar del Norte BV
      country: Países Bajos
      industry: Programa Co-Brand y Asociación
      challenge: >-
        Una marca europea de productos marinos ya consolidada quería expandirse al mercado de SUP sin invertir en instalaciones de fabricación. Necesitaba un socio de marca blanca capaz de producir 5 modelos de SUP (de 9 a 12 pies) con marca privada, certificación CE y derechos exclusivos de
        distribución en la UE.
      solution: >-
        Acuerdo de fabricación bajo marca blanca establecido para 5 modelos de SUP. Cada modelo con la marca y esquema de colores del cliente. Documentación de certificación CE preparada para cada modelo. Derechos exclusivos de distribución en la UE concedidos con compromisos de pedido mínimo.
        Documentación técnica proporcionada para la red de servicio local.
      product: Línea SUP personalizada (5 modelos)
      results: Acuerdo multianual firmado. Primer lote de producción de 50 unidades enviado en 75 días. Marca lanzada en una importante feria comercial con recepción positiva por parte de los distribuidores.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: 'Trabajar con afarer nos permitió entrar en el mercado de SUP sin construir una fábrica: ellos entregaron una solución integral llave en mano con certificación CE y documentación de soporte para distribuidores.'
      icon: tabler:building
    - title: Flota de resort caribeño
      customer: Resorts Isla Paraíso S.A.
      country: Bahamas
      industry: Turismo y Hostelería Marina
      challenge: >-
        El complejo de lujo necesitaba una flota completa de equipo de deportes acuáticos para las actividades de los huéspedes: 40 tablas de SUP para excursiones guiadas, 20 SUP adicionales para la exploración de la laguna, 10 tablas de SUP para excursiones de los huéspedes, además de accesorios.
        Todo el equipo necesitaba tener la marca personalizada del complejo y debía entregarse antes de la temporada alta de turismo.
      solution: >-
        Producción de paquete completo de SUP: 40 tablas SUP Voyager (modelo All-Around), 20 tablas SUP Explorer, 10 tablas SUP Touring, además de chalecos salvavidas, remos, bombas y kits de reparación. Todo el equipo impreso con el logotipo del resort y esquema de colores tropical. Envío en
        contenedor con manifiesto completo de inventario.
      product: Paquete completo de SUP (70 unidades)
      results: La flota llegó 6 semanas antes de la temporada alta. Los puntajes de satisfacción de los huéspedes para las actividades de deportes acuáticos aumentaron un 40% año tras año. El equipo ha durado 3 temporadas con solo mantenimiento rutinario.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: 'El enfoque de paquete completo significaba que recibíamos todo lo que necesitábamos en un solo envío: tableros y accesorios, todos con marca y listos para el uso de los huéspedes. A nuestros huéspedes les encanta la calidad del equipo.'
      icon: tabler:beach
    - title: Contrato de patrulla costera estadounidense
      customer: Agencia de Seguridad de la Costa Atlántica
      country: Estados Unidos
      industry: Seguridad Marítima y Aplicación de la Ley
      challenge: "La agencia de seguridad costera de EE.\_UU. necesitaba SUPs de patrulla de alta resistencia para operaciones en aguas abiertas. Requerían tablas de alto rendimiento con equipo de especificación militar y cumplimiento de las regulaciones de la Guardia Costera de EE.\_UU."
      solution: >-
        Paddleboard de patrulla diseñado con construcción de drop-stitch reforzada, esquemas de color de alta visibilidad, montajes para equipos de comunicación cifrados y puntos de fijación integrados para equipos. Tablas reforzadas para operaciones de alta resistencia. Documentación de
        cumplimiento con la USCG proporcionada.
      product: Patrulla de SUP
      results: La agencia informó una tasa de preparación de misión del 95% durante los primeros 12 meses. Se realizó un pedido adicional de 8 unidades.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: La patrulla SUP ofrece a nuestras tripulaciones el rendimiento necesario para operaciones en aguas abiertas. La construcción reforzada proporciona una durabilidad crítica sin comprometer la maniobrabilidad.
      icon: tabler:shield

hero:
  tagline: Laboratorio de Control de Calidad
  title: Laboratorio de Pruebas y Aseguramiento de Calidad
  subtitle: 'Laboratorio de calidad independiente con procesos ISO 9001: cada unidad probada antes del envío'
intro: >-
  Afarer opera un laboratorio de control de calidad dedicado que funciona de manera independiente de la producción. Cada lote de materia prima y cada barco terminado pasa por protocolos de inspección documentados antes de su liberación. Nuestro equipo de control de calidad informa directamente a la
  dirección, asegurando decisiones de calidad imparciales.
highlights:
  - value: 100%
    label: Unidades probadas a presión
    detail: Cada cámara, cada barco
  - value: 48 h
    label: Duración de la prueba de retención de aire
    detail: A 1,25× la presión nominal
  - value: <5%
    label: Máxima caída de presión permitida
    detail: Período de retención de más de 24 horas
  - value: AQL 2.5
    label: Umbral de defecto mayor
    detail: Según el muestreo ISO 2859
test_procedures:
  - title: Inspección de materia prima
    description: >-
      Cada lote entrante de PVC, Hypalon, tela de puntada inversa y herrajes se prueba antes de ser aceptado. Se verifica la resistencia a la tracción (ASTM D751), la resistencia al desgarro (ISO 4674) y la resistencia a los rayos UV. Los materiales que no cumplen con las normas se ponen en
      cuarentena y se devuelven.
    standards:
      - ASTM D751 (tensión)
      - ISO 4674 (rasgadura)
      - ISO 4892 (UV)
  - title: Puntos de control de control de calidad en proceso
    description: Los operadores de producción realizan autoinspección en cada etapa. Los auditores de control de calidad realizan muestreos aleatorios durante todo el turno. Las pruebas de pelado de soldadura se realizan cada 50 unidades. Los controles dimensionales se realizan en cada vigésimo panel.
    standards:
      - ASTM D751 (desprendimiento)
      - Lista de verificación interna de 100 puntos
      - muestreo ISO 2859
  - title: Prueba de retención de aire de 48 horas
    description: Cada cámara de tubo se infla al 125% de la presión nominal y se mantiene durante 48 horas. Los sensores de presión registran continuamente con compensación de temperatura. Cualquier cámara que supere una caída de presión del 5% activa la re-inspección automática del lote.
    standards:
      - ISO 6185
      - CE 2013/53/UE
  - title: Pruebas de Carga y Equilibrio
    description: Los barcos completados se prueban a la capacidad máxima nominal para estabilidad, francobordo y manejo. Cada embarcación se somete a pruebas en agua antes de la aprobación de la inspección final.
    standards:
      - ISO 12217
      - CE 2013/53/UE
equipment:
  - name: Universal Testing Machine (tensile)
    spec: 5 kN, conforme a ASTM D751
  - name: Pressure Decay Tester
    spec: Multicanal, 0–50 psi, registro de datos
  - name: UV Weathering Chamber
    spec: ISO 4892, 1.000 h ciclos
  - name: Thickness Gauge (digital)
    spec: Resolución de 0,01 mm
  - name: Peel Tester (weld)
    spec: Motorizado, capacidad de 50 N
  - name: Temperature Chamber
    spec: '-40 °C a 100 °C'
  - name: Leak Detection Tank
    spec: 6 m × 2 m, iluminado

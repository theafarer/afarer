hero:
  tagline: Cumplimiento
  title: Cómo Funciona la Certificación CE para Embarcaciones Inflables
  subtitle: Lectura de 7 min
content_html: >
  <h2>¿Qué es la certificación CE?</h2>

  <p>La marca CE (Conformité Européenne) indica que un producto cumple con los requisitos de salud, seguridad y medio ambiente de la UE. Para embarcaciones inflables, el marco regulatorio relevante depende de la categoría de producto.</p>


  <h2>Directivas aplicables</h2>


  <h3>Directiva de Embarcaciones Recreativas (2013/53/UE)</h3>

  <p>La directiva principal para la mayoría de las embarcaciones inflables, SUP y kayaks. Se aplica a embarcaciones recreacionales de 2,5 m a 24 m de casco, embarcaciones parcialmente terminadas (para suministro OEM) y embarcaciones particulares.</p>


  <h3>Reglamento sobre Equipos de Protección Personal (2016/425)</h3>

  <p>Los chalecos salvavidas, ayudas a la flotabilidad y equipos de seguridad suministrados con las embarcaciones deben cumplir con los requisitos de la normativa de EPI, incluyendo el examen de tipo (Módulo B) por un organismo notificado y el control de calidad de la producción (Módulo D o E).</p>


  <h2>El proceso de certificación</h2>

  <ol>
    <li>Clasificación del producto: Determinar la categoría de diseño de la embarcación (A – D según ISO 8666)</li>
    <li>Normas aplicables: EN ISO 6185 (Partes 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (matrícula del constructor)</li>
    <li>Preparación de archivos técnicos: planos de diseño, lista de materiales, certificados de materiales, evaluación de riesgos</li>
    <li>Ensayo tipo: Flotabilidad, estabilidad, capacidad de carga, ensayo de materiales, resistencia de la junta, retención de aire</li>
    <li>Control de producción en fábrica: Auditoría de organismos notificados de los procesos de fabricación</li>
    <li>Declaración de conformidad: El fabricante firma la declaración de identificación y coloca la marca CE</li>
  </ol>


  <h2>Organismos notificados para embarcaciones inflables</h2>

  <p>Las NB más comunes incluyen Bureau Veritas (Francia), DNV GL (Alemania), RINA (Italia), TÜV Rheinland / TÜV SÜD (Alemania).</p>


  <h2>Cronología y costes</h2>

  <table class="w-texto completo-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <ª clase="p-3 texto-izquierda-texto seminegris-gris-borde 900">Fase</th>
        <ª clase="p-3 texto-fuente izquierda-texto seminegris-gris-borde 900">Duración</th>
        <ª clase="p-3 texto-fuente izquierda-texto seminegris-borde 900">Coste típico (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 borde">Preparación de archivos técnicos</td><td class="p-3 borde">2 – 4 semanas</td><td class="p-3 borde">2.000 – 5.000</td></tr>
      <tr><td class="p-3 frontera">Pruebas de tipo</td><td class="p-3 frontera">4 – 8 semanas</td><td class="p-3 frontera">8.000 – 20.000</td></tr>
      <tr><td class="p-3 border">Factory audit</td><td class="p-3 border">1 – 2 días (in situ)</td><td class="p-3 border">3.000 – 6.000</td></tr>
      <tr><td class="p-3 frontera">Total (primer producto)</td><td class="p-3 frontera">8 – 14 semanas</td><td class="p-3 frontera">13.000 – 31.000</td></tr>
    </tbody>
  </table>


  <h2>Qué significa esto para los compradores</h2>

  <p>Al comprar embarcaciones inflables certificadas CE, verifica siempre que la marca CE esté en la matrícula del constructor, que exista un documento válido, que conste el número de Notificación y que el manual del propietario incluya instrucciones de seguridad en tu idioma local. Todos los
  productos Afarer llevan certificación CE con trazabilidad total a los informes de auditoría de organismos notificados.</p>

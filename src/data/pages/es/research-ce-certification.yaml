  tagline: Cumplimiento
  title: Cómo Funciona la Certificación CE para Embarcaciones Inflables
  subtitle: Lectura de 7 min
content_html: |-
  <h2>¿Qué es la certificación CE?</h2>
  <p>El marcado CE (Conformit&eacute; Europ&eacute;enne) indica que un producto cumple los requisitos de salud, seguridad y medio ambiente de la UE. En el caso de las embarcaciones hinchables, el marco normativo aplicable depende de la categoría del producto.</p>

  <h2>Directivas aplicables</h2>

  <h3>Directiva de Embarcaciones de Recreo (2013/53/UE)</h3>
  <p>Es la directiva principal para la mayoría de los barcos hinchables, los SUP y los kayaks. Se aplica a las embarcaciones de recreo con eslora de 2.5 m a 24 m, a los barcos parcialmente terminados (para suministro OEM) y a las motos de agua.</p>

  <h3>Reglamento de Equipos de Protección Personal (2016/425)</h3>
  <p>Los chalecos salvavidas, los dispositivos de flotación y el equipo de seguridad suministrados con las embarcaciones deben cumplir los requisitos del Reglamento EPI, incluido el examen de tipo (Módulo B) por un organismo notificado y el aseguramiento de la calidad de producción (Módulo D o E).</p>

  <h2>El proceso de certificación</h2>
  <ol>
    <li>Clasificación del producto: determinar la categoría de diseño de la embarcación (A – D según ISO 8666)</li>
    <li>Normas aplicables: EN ISO 6185 (Partes 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (placa del constructor)</li>
    <li>Preparación del expediente técnico: planos de diseño, lista de materiales, certificados de materiales y evaluación de riesgos</li>
    <li>Ensayos de tipo: flotabilidad, estabilidad, capacidad de carga, ensayo de materiales, resistencia de costuras y retención de aire</li>
    <li>Control de producción en fábrica: auditoría del organismo notificado de los procesos de fabricación</li>
    <li>Declaración de conformidad: el fabricante firma la DoC y coloca el marcado CE</li>
  </ol>

  <h2>Organismos notificados para embarcaciones hinchables</h2>
  <p>Los organismos notificados más comunes incluyen Bureau Veritas (Francia), DNV GL (Alemania), RINA (Italia), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Alemania).</p>

  <h2>Plazos y costes</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fase</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Duración</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Coste típico (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Preparación del expediente técnico</td><td class="p-3 border">2 – 4 semanas</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Ensayos de tipo</td><td class="p-3 border">4 – 8 semanas</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Auditoría de fábrica</td><td class="p-3 border">1 – 2 días (in situ)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Total (primer producto)</td><td class="p-3 border">8 – 14 semanas</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Qué significa esto para los compradores</h2>
  <p>Al comprar barcos hinchables con certificación CE, verifique siempre que el marcado CE figure en la placa del constructor, que exista una DoC válida, que se indique el número del organismo notificado y que el manual del propietario incluya instrucciones de seguridad en su idioma local. Todos los productos de Afarer cuentan con certificación CE y trazabilidad completa de los informes de auditoría del organismo notificado.</p>

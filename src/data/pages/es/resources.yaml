  title: 'Centro de Descargas y Guías del Comprador'
  subtitle: 'Acceda a catálogos de productos, guías OEM, listas de verificación y documentación técnica'
features3_downloads:
  tagline: Downloads
  title: 'Documentación del Producto<br />y Recursos del Comprador'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Gama completa: SUP, botes inflables, tablas SUP, SUPs y accesorios. Formato PDF.'
      icon: tabler:file-text
    - title: 'Guía de Fabricación OEM'
      description: 'Todo sobre asociaciones OEM/ODM: proceso, MOQ, personalización, calidad, envío.'
      icon: tabler:building-factory
    - title: 'Guía del Comprador de Barcos SUP'
      description: 'Cómo elegir el SUP adecuado: materiales, motor, tamaño y configuración.'
      icon: tabler:file-description
    - title: 'Lista de Verificación de Proveedores SUP'
      description: 'Consideraciones clave al elegir fabricante SUP: calidad, certificaciones, MOQ, auditoría.'
      icon: tabler:clipboard-check
    - title: 'Guía de Materiales para Botes Inflables'
      description: 'PVC vs Hypalon: durabilidad, resistencia UV, vida útil, reparación, costo.'
      icon: tabler:files
    - title: 'Plantilla de Brief de Fabricación Personalizada'
      description: 'Descargue nuestra plantilla, complétela y envíenosla para presupuesto en una semana.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Preguntas sobre productos, proceso y asociación.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'El MOQ varía según la categoría. SUP desde 10, SUP desde 50 unidades.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Sí, afarer ofrece muestras. Costos negociables, a menudo acreditados.'
      icon: tabler:package
    - title: What payment terms are available?
      description: '30% depósito, 70% antes del envío. LC para clientes calificados.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Plazos típicos: SUP 30-45d, SUP 20-30d, inflables 25-35d. Prototipado +15-30d.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'Certificación CE, USCG, ISO, BSCI, REACH.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Sí. Empaque personalizado con logo, colores e identidad.'
      icon: tabler:color-swatch
cta:
  title: '¿Ayuda para encontrar el recurso?'
  subtitle: 'Contacte a nuestro equipo para orientación sobre productos, OEM o especificaciones.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

meta:
  title: Recursos y Descargas B2B | {SITE}
  description: Descargue guías de fabricación OEM, catálogos de productos, informes de calidad y calculadoras de ROI para negocios de SUP inflables.
hero:
  tagline: Centro de Recursos
  title: Herramientas y Recursos<br />Para Socios Comerciales de SUP
  subtitle: Descarga guías de OEM, catálogos de productos, informes de calidad y utiliza nuestra calculadora de ROI para planificar tu inversión en la flota de SUP.
resources:
  - title: Catálogo de Productos OEM/ODM 2026
    description: Gama completa de productos con especificaciones, niveles de precios, cantidad mínima de pedido y opciones de personalización para socios B2B.
    icon: tabler:file-text
    type: catalog
    link: /media
    cta: Descargar catálogo
  - title: Guía de Marca SUP de Etiqueta Privada
    description: Guía paso a paso para lanzar tu propia marca de SUP — desde la investigación de mercado y el diseño hasta la producción y la entrega global.
    icon: tabler:book
    type: guide
    link: /news/private-label-sup-oem-guide
    cta: Leer guía
  - title: Calculadora de ROI de Flota SUP
    description: Estime su inversión en la flota de SUP de su resort o club, los ingresos proyectados y el período de recuperación con nuestra calculadora interactiva.
    icon: tabler:calculator
    type: tool
    link: '#roi-calculator'
    cta: Calcular ROI
  - title: Informe de Calidad y Certificación
    description: Documentos de certificación CE, gestión de calidad ISO 9001, resultados de pruebas de envejecimiento UV y datos de pruebas de retención de presión.
    icon: tabler:certificate
    type: report
    link: /evidence
    cta: Ver informes
  - title: Folleto de Capacidades de la Fábrica
    description: Recorrido virtual por nuestra instalación de fabricación de 12,000 m² con detalles de la línea de producción y procesos de control de calidad.
    icon: tabler:building-factory
    type: brochure
    link: /factory
    cta: Fábrica de Tours
  - title: Guía de ingresos de la flota de resorts
    description: Análisis de ROI de la flota comercial de SUP con modelos de precios, tasas de utilización y resultados de estudios de caso reales de resorts de 5 estrellas.
    icon: tabler:chart-bar
    type: guide
    link: /news/commercial-sup-fleet-roi-resorts
    cta: Leer guía
cta:
  title: ¿Ayuda para encontrar el recurso?
  subtitle: Contacte a nuestro equipo para orientación sobre productos, OEM o especificaciones.
  button: Contactar al equipo de ventas
  link: /contact?source=resources

      desc: Minimizando nuestra huella ambiental mediante la utilización de materiales y procesos ecológicos.
    - icon: shield
      title: Seguridad Intransigente
      desc: Asegurando los más altos estándares de seguridad mediante pruebas y certificación rigurosas.
pillars:
  - title: Avance tecnológico
    desc: Pioneros en nuevos materiales, diseños y procesos de fabricación para ofrecer un rendimiento y una durabilidad superiores del producto.
    icon: tech
  - title: Materiales Avanzados
    desc: Investigando PVC de vanguardia, Hypalon, composites y alternativas sostenibles para mejorar las características del producto.
    icon: materials
  - title: Sostenibilidad
    desc: 'Un Compromiso Fundamental: Estamos dedicados a la gestión ambiental a través de la fabricación sostenible y materiales reciclables.'
    icon: sustainability
capabilities:
  tagline: Capacidades
  title: Capacidades de I+D
  subtitle: Cuatro disciplinas fundamentales que nos brindan control de extremo a extremo sobre el desarrollo del producto, desde la investigación de materias primas hasta la certificación final.
  groups:
    - title: Ciencia de Materiales y Tecnología de Telas
      items:
        - Análisis y optimización de la formulación de PVC y Hypalon
        - Desarrollo de aditivos para estabilidad frente a los rayos UV, retardancia a la llama y propiedades antimicrobianas
        - Ingeniería de laminación y adhesión de tejidos multicapa
        - Pruebas de envejecimiento acelerado (UV, térmico, humedad, niebla salina)
    - title: Ingeniería y Hidrodinámica de Casco
      items:
        - Diseño de casco 3D paramétrico y optimización CFD
        - Análisis por elementos finitos para cargas estructurales y de impacto
        - Pruebas en tanque de remolque a escala y validación de rendimiento
        - Desarrollo de casco personalizado para perfiles de misión especiales
    - title: Tecnología de Soldadura y Unión
      items:
        - Desarrollo y optimización del proceso de soldadura dieléctrica por RF
        - Métodos de soldadura por aire caliente, cuña caliente y ultrasónica
        - Calificación de adhesión y cinta de costura
        - Modelado de la resistencia de la soldadura y predicción de la vida útil
    - title: Pruebas, Certificación y Cumplimiento
      items:
        - Gestión de calidad y pruebas de conformidad CE
        - Apoyo para pruebas y certificación de terceros independientes
        - Desarrollo de protocolo de prueba personalizado para la calificación de adquisiciones
        - Análisis de fallas en servicio e investigación de la causa raíz

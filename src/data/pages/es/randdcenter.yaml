vision:
  tagline: Nuestra Visión
  title: Dando forma al futuro de los deportes acuáticos
  body: >-
    afarer se esfuerza por liderar la industria de embarcaciones inflables y SUP a través de la innovación continua, una calidad inquebrantable y un compromiso firme con la seguridad y la sostenibilidad, enriqueciendo en última instancia las experiencias de los entusiastas de los deportes acuáticos
    en todo el mundo. El Centro de I+D de afarer es donde la pasión se encuentra con la innovación, estableciendo nuevos estándares para la industria de los deportes acuáticos.
labs_section:
  tagline: Laboratorios
  title: Nuestros Laboratorios
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: Laboratorio de Tela de PVC
      description: Investigación y pruebas continuas de telas de tubos de PVC y Hypalon para resistencia a la tracción, resistencia a los rayos UV, abrasión y flexibilidad a bajas temperaturas para garantizar la fiabilidad a largo plazo en entornos marinos.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Estudio de Ingeniería Hull
      description: Diseño impulsado por CAD y análisis de elementos finitos de cascos de HDPE, aluminio y fibra de vidrio. Cada casco se simula digitalmente para la distribución de tensiones y la resistencia a impactos antes de construir el primer prototipo.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: Centro de Soldadura RF
      description: Instalación dedicada a la soldadura por radiofrecuencia con control preciso de temperatura y presión, que produce costuras de alta resistencia e impermeables que cumplen con los estándares de la industria marina para embarcaciones inflables.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Tanque de prueba hidrodinámico
      description: Pruebas con modelos a escala en nuestro tanque de pruebas interno para optimizar la forma del casco, el rendimiento de planeo, la estabilidad y la eficiencia de combustible en una variedad de condiciones de carga y mar.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: Taller de Prototipos
      description: Instalación de prototipado y aparejo a gran escala donde se construyen, ajustan y prueban en el mar los nuevos modelos. Cada prototipo pasa por un programa de pruebas en agua de mínimo 20 horas antes de la aprobación de producción.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Laboratorio de Calidad e Inspección
      description: Laboratorio de aseguramiento de calidad dedicado, realizando pruebas de tracción, ciclos de retención de aire, pruebas de desprendimiento de costuras y certificación de materiales para garantizar que cada barco que salga del taller cumpla con nuestras especificaciones publicadas.
      href: /randdcenter/quality-inspection-lab

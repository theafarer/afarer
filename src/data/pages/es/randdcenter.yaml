  title: Centro de I+D | {SITE}
  description: Investigación y Desarrollo — Pruebas de tejido de PVC, ingeniería de cascos, soldadura por RF, pruebas hidrodinámicas y control de calidad. Servicios de I+D personalizados disponibles.
hero:
  tagline: Centro de I+D
  title: Centro de I+D
  subtitle: Enfocado en el progreso
intro:
  - >-
    El Centro de Investigación y Desarrollo (I+D) de Afarer es la fuerza impulsora detrás de nuestra misión de revolucionar el equipo de deportes acuáticos. Empoderamos a los entusiastas de los deportes acuáticos en todo el mundo con productos más seguros, cómodos y agradables mediante la innovación
    constante en tablas de paddle inflables de pie (SUPs) y embarcaciones. Nuestro equipo dedicado de ingenieros, diseñadores y expertos apasionados por los deportes acuáticos está moldeando el futuro de la industria, elevando consistentemente el estándar en calidad, rendimiento y sostenibilidad.
  - >-
    Nuestra instalación de I+D reúne a científicos de materiales, arquitectos navales e ingenieros de producción bajo un mismo techo. Desde la formulación de materiales y la simulación del casco hasta el desarrollo de procesos de soldadura y las pruebas en el mar a gran escala, cada etapa del
    desarrollo del producto se basa en datos y se valida mediante pruebas.
mission:
  tagline: Nuestra Misión
  title: Innovando el futuro de los deportes acuáticos
  pillars:
    - icon: lightning
      title: Avance tecnológico
      desc: Pioneros en nuevos materiales, diseños y fabricación para un rendimiento y durabilidad superiores del producto.
    - icon: design
      title: Diseño centrado en el usuario
      desc: Comprender profundamente y superar las necesidades del usuario a través de un diseño de producto ergonómico e intuitivo.
    - icon: globe

warranty_section:
  title: Garantía y Servicio Postventa
  subtitle: Respaldamos cada producto con términos de garantía claros, un procesamiento rápido de reclamaciones y piezas de repuesto genuinas.
  items:
    - title: Garantía del producto de 2 años
      desc: 'Todos los productos de afarer tienen una garantía de 2 años contra defectos de fabricación: fallos en las costuras, defectos en las válvulas y deslaminación del material bajo uso normal.'
    - title: Soporte de piezas de por vida
      desc: Piezas de repuesto genuinas — válvulas, kits de reparación, aletas, anillos en D — disponibles para todos los modelos. Mantenemos moldes y herramientas durante un mínimo de 5 años después del fin de la producción.
    - title: Respuesta de Reclamo en 48 Horas
      desc: Reclamaciones de garantía reconocidas dentro de 48 horas. Placas de reemplazo enviadas dentro de 10 días hábiles para reclamaciones aprobadas.
    - title: Red de Reparación Global
      desc: Centros de reparación autorizados en 15 países. Kits de reparación de campo disponibles para operaciones remotas. Guías de reparación DIY para daños menores.
    - title: Soporte al cliente OEM
      desc: Gerentes de cuenta dedicados para socios B2B. Revisiones comerciales trimestrales, planificación de inventario y apoyo de marketing con marca compartida.
    - title: Paquete de Certificación
      desc: 'Documentación de cumplimiento completo proporcionada con cada envío: Declaración CE, informes de prueba, hojas de datos de seguridad de materiales.'
      link: /contact

      description: Estamos certificados BSCI, garantizando prácticas laborales éticas, condiciones de trabajo seguras y responsabilidad ambiental en toda nuestra cadena de suministro.
      icon: tabler:users
    - title: REACH y RoHS
      description: Todos los materiales —PVC, Hypalon, espuma EVA, adhesivos —cumplen con las regulaciones REACH y RoHS de la UE. Sin sustancias restringidas, sin compromisos.
      icon: tabler:flask
    - title: Laboratorio de Pruebas de Materiales
      description: El laboratorio interno de materiales prueba resistencia a la tracción, resistencia UV, integridad de costuras y abrasión para cada lote de tela antes de la producción.
      icon: tabler:microscope
    - title: Garantía de 2 años
      description: Cada producto afarer viene con una garantía de dos años contra defectos de fabricación. Respadamos lo que construimos.
      icon: tabler:shield-check

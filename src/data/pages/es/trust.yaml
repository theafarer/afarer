features3_certifications:
  title: Certificaciones y Cumplimiento
  subtitle: Cada producto es probado independientemente y certificado según estándares internacionales.
  columns: 3
  isBeforeContent: true
  items:
    - title: Certificación CE
      description: Todos los SUP, SUPs, dinghys y SUP de afarer cumplen con el estándar europeo de seguridad CE para embarcaciones recreativas. Cada producto se somete a pruebas de presión, flotabilidad y carga antes de salir de la fábrica.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Nuestra instalación de 12,000 m² en Qingdao opera bajo un sistema de gestión de calidad ISO 9001:2015. Cada lote de producción es trazable, documentado e inspeccionado.
      icon: tabler:clipboard-check
    - title: Cumplimiento Social BSCI
      description: Estamos certificados BSCI, garantizando prácticas laborales éticas, condiciones de trabajo seguras y responsabilidad ambiental en toda nuestra cadena de suministro.
      icon: tabler:users
    - title: REACH y RoHS
      description: Todos los materiales — PVC, Hypalon, espuma EVA, adhesivos — cumplen con las regulaciones REACH y RoHS de la UE. Sin sustancias restringidas, sin compromisos.
      icon: tabler:flask
    - title: Laboratorio de Pruebas de Materiales
      description: El laboratorio interno de materiales prueba resistencia a la tracción, resistencia UV, integridad de costuras y abrasión para cada lote de tela antes de la producción.
      icon: tabler:microscope
    - title: Garantía de 2 años
      description: Cada producto afarer viene con una garantía de dos años contra defectos de fabricación. Respadamos lo que construimos.
      icon: tabler:shield-check
testimonials:
  tagline: Confianza del Cliente
  title: Lo que dicen nuestros clientes
  subtitle: Desde remeros principiantes hasta operadores de flotas profesionales — mira por qué confían en afarer.
  items:
    - content: Equipamos toda nuestra flota de alquiler con SUP de afarer. Dos temporadas después, cero fallos. La certificación CE hizo que la aprobación del seguro fuera sin problemas.
      name: Marco V.
      title: Operador turístico, Croacia
    - content: Como comprador por primera vez, estaba nervioso por la calidad. La documentación ISO y los informes de prueba que compartieron me dieron total confianza.
      name: James T.
      title: Propietario de SUP Explorer 11, Canadá
    - content: Trabajamos con afarer para nuestras unidades de patrulla costera. Su proceso de QC es consistente en cada lote — esa confiabilidad importa en operaciones críticas.
      name: Lt. Cmdr. Andres
      title: Adquisiciones navales, Filipinas
steps2_manufacturing:
  title: Cómo aseguramos la calidad
  subtitle: Desde la inspección de materias primas hasta las pruebas finales de presión — cada producto pasa por una rigurosa cadena de calidad.
  items:
    - title: Inspección de Materias Primas
      description: Cada rollo de tela PVC se prueba para espesor, resistencia a la tracción y resistencia UV antes de entrar en producción.
      icon: tabler:search
    - title: QC en Proceso
      description: Las costuras soldadas, instalaciones de válvulas y uniones de cámaras se inspeccionan en cada estación durante el ensamblaje.
      icon: tabler:eye
    - title: Prueba de Presión
      description: Cada producto inflable se infla a 1.5x el PSI nominal y se mantiene durante 24 horas para verificar la retención de aire y la integridad de las costuras.
      icon: tabler:wind
    - title: Inspección Final
      description: Cada unidad se inspecciona para acabado, herrajes y embalaje antes de ser aprobada para envío. Las muestras de lotes van a nuestro laboratorio para pruebas destructivas.
      icon: tabler:clipboard-check

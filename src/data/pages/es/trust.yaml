faqs_sup:
  title: Preguntas Frecuentes SUP
  subtitle: Preguntas comunes sobre nuestras tablas de paddleboarding.
  columns: 2
  items:
    - title: ¿Qué tamaños de tablas SUP están disponibles?
      description: Ofrecemos tablas SUP desde 9 pies hasta 12 pies, incluyendo diseños todoterreno, de travesía, yoga y especiales. Nuestros modelos más vendidos incluyen Tropical Breeze (10 pies) y Ocean Voyager (11 pies).
    - title: ¿Qué es la construcción drop-stitch?
      description: La construcción drop-stitch utiliza miles de hilos de poliéster que conectan las capas superior e inferior de la tabla, permitiendo mantener alta presión de aire (15-20 PSI) y lograr una plataforma rígida y estable. Este es el estándar de la industria para SUP inflables premium.
    - title: ¿Cuál es el límite de peso para las tablas SUP?
      description: Nuestras tablas SUP soportan hasta 150 kg según el modelo y volumen. Leviathan Wake es nuestro modelo de mayor capacidad, diseñado para usuarios más grandes y uso en yoga.
    - title: ¿Ofrecen paquetes completos de SUP?
      description: Sí. Cada tabla SUP se envía con un paquete completo que incluye un remo de aluminio de 3 piezas, bomba manual de alta presión, correa espiral, mochila de viaje y kit de reparación. Algunos modelos también incluyen un juego de aletas desmontables.
    - title: ¿Cuál es la garantía de las tablas SUP?
      description: Todas las tablas SUP afarer tienen una garantía de un año contra defectos de fabricación, incluyendo fallo de costuras, defectos de válvulas y delaminación de material bajo uso normal.
    - title: ¿Cuánto tiempo se tarda en inflar una tabla SUP?
      description: Usando la bomba manual incluida, la inflación completa a 15 PSI toma aproximadamente 8-12 minutos. Para inflación más rápida, recomendamos nuestra bomba eléctrica afarer 12V, que infla una tabla en menos de 4 minutos.
faqs_materials:
  title: Material de SUP y Preguntas Frecuentes sobre su Cuidado
  subtitle: Preguntas comunes sobre nuestros materiales de SUP inflables, cuidado y almacenamiento.
  columns: 2
  items:
    - title: ¿Qué materiales se utilizan en los SUPs inflables de afarer?
      description: Usamos PVC de grado militar (1100 deniers) con construcción estabilizada contra rayos UV y resistente a la abrasión, cumple con las normativas REACH y RoHS de la UE.
    - title: ¿Cuánto duran los SUP inflables?
      description: Con el cuidado adecuado, un SUP inflable de PVC de calidad dura de 5 a 10 años. La limpieza regular, la protección contra los rayos UV y el almacenamiento adecuado prolongan significativamente la vida útil.
    - title: ¿Qué mantenimiento requiere un SUP inflable?
      description: El mantenimiento básico incluye enjuagar con agua dulce después de cada uso (especialmente en agua salada), secar antes de guardar, revisar las juntas de las válvulas anualmente y evitar la exposición prolongada al sol cuando no se esté usando.
    - title: ¿Se pueden usar los SUP inflables en agua salada?
      description: Sí. Todos los SUPs inflables de Afarer están diseñados para su uso tanto en agua dulce como en agua salada. Recomendamos enjuagarlos con agua dulce y secarlos completamente después de su exposición al agua salada.
    - title: ¿Cómo guardo un SUP inflable?
      description: Desinfle, limpie y seque la tabla completamente antes de almacenarla. Enróllela sueltamente (evite pliegues apretados), guárdela en un lugar fresco y seco, alejado de la luz solar directa, y manténgala alejada de los suelos de concreto para evitar la absorción de humedad.
    - title: ¿Cuál es la capacidad de peso de los SUP inflables de Afarer?
      description: Las capacidades de peso varían desde 100 kg para nuestros modelos más pequeños hasta más de 200 kg para tablas más grandes. Cada página de producto indica la capacidad máxima de carga de su modelo específico.

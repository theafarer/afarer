  isBeforeContent: true
  items:
    - title: Certificación CE
      description: Todos los SUP, SUPs, dinghys y SUP de afarer cumplen con el estándar europeo de seguridad CE para embarcaciones recreativas. Cada producto se somete a pruebas de presión, flotabilidad y carga antes de salir de la fábrica.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Nuestra instalación de 12,000 m² en Qingdao opera bajo un sistema de gestión de calidad ISO 9001:2015. Cada lote de producción es trazable, documentado e inspeccionado.
      icon: tabler:clipboard-check

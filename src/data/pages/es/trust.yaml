faqs_sup:
  title: Preguntas Frecuentes SUP
  subtitle: Preguntas comunes sobre nuestras tablas de paddleboarding.
  columns: 2
  items:
    - title: ¿Qué tamaños de tablas SUP están disponibles?
      description: Ofrecemos tablas SUP desde 9 pies hasta 12 pies, incluyendo diseños todoterreno, de travesía, yoga y especiales. Nuestros modelos más vendidos incluyen Tropical Breeze (10 pies) y Ocean Voyager (11 pies).
    - title: ¿Qué es la construcción drop-stitch?
      description: La construcción drop-stitch utiliza miles de hilos de poliéster que conectan las capas superior e inferior de la tabla, permitiendo mantener alta presión de aire (15-20 PSI) y lograr una plataforma rígida y estable. Este es el estándar de la industria para SUP inflables premium.
    - title: ¿Cuál es el límite de peso para las tablas SUP?
      description: Nuestras tablas SUP soportan hasta 150 kg según el modelo y volumen. Leviathan Wake es nuestro modelo de mayor capacidad, diseñado para usuarios más grandes y uso en yoga.
    - title: ¿Ofrecen paquetes completos de SUP?
      description: Sí. Cada tabla SUP se envía con un paquete completo que incluye un remo de aluminio de 3 piezas, bomba manual de alta presión, correa espiral, mochila de viaje y kit de reparación. Algunos modelos también incluyen un juego de aletas desmontables.
    - title: ¿Cuál es la garantía de las tablas SUP?
      description: Todas las tablas SUP afarer tienen una garantía de un año contra defectos de fabricación, incluyendo fallo de costuras, defectos de válvulas y delaminación de material bajo uso normal.
    - title: ¿Cuánto tiempo se tarda en inflar una tabla SUP?
      description: Usando la bomba manual incluida, la inflación completa a 15 PSI toma aproximadamente 8-12 minutos. Para inflación más rápida, recomendamos nuestra bomba eléctrica afarer 12V, que infla una tabla en menos de 4 minutos.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

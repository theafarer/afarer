meta:
  title: 'Conocimiento — Guías de SUP | {SITE}'
  description: 'Base de conocimiento afarer: guías sobre SUP inflables, materiales de paddle surf, selección de tablas y perspectivas del sector para marcas y profesionales.'
  keywords:
    - 'conocimiento de SUP'
    - 'guía de SUP hinchable'
    - 'materiales de paddle surf'
    - 'perspectivas del sector SUP'
hero:
  tagline: Grafo de Conocimiento
  title: Conocimiento de Exploración Acuática
  subtitle: |
    Una base de conocimiento estructurada que cubre tecnología SUP inflable,<br />
    seguridad acuática, ingeniería de tablas y planificación de aventuras.
  taglineSection: Explora. Aprende. Ve con confianza.
clusters:
  tagline: Clústeres de Conocimiento
  title: Explora por tema
  subtitle: Inmersiones profundas en la tecnología, seguridad y habilidades detrás de cada producto afarer.
  items:
    - title: Guías de Compra de SUP
      description: Desde elegir tu primera tabla hasta técnicas avanzadas de travesía — todo sobre paddleboarding.
      icon: tabler:lifebuoy
      topics:
        - Cómo elegir tu primer SUP inflable
        - Guía de tamaño y capacidad de peso de SUP
        - Mejor SUP para principiantes, travesía, yoga y carreras
        - Errores comunes de compra de SUP a evitar
        - Comparación de tabla inflable vs rígida
    - title: Ingeniería y Tecnología SUP
      description: Guías técnicas sobre tablas SUP inflables — materiales, métodos de construcción y procesos de fabricación.
      icon: tabler:microscope
      topics:
        - Inmersión profunda en tecnología drop-stitch
        - Especificaciones de PVC de grado militar
        - Laminación por fusión vs unión adhesiva
        - Tecnología de espuma EVA y métodos de artwork
        - Tipos de válvulas SUP y sistemas de aletas
    - title: Seguridad y Mantenimiento SUP
      description: Conocimientos esenciales de seguridad para cada paddler — desde selección de PFD hasta lectura del clima, cuidado y reparación de tablas.
      icon: tabler:shield
      topics:
        - Lista de verificación de seguridad SUP y requisitos de PFD
        - Seguridad multi-cámara para aguas remotas
        - Guía de PSI de inflado de SUP
        - Almacenamiento de tablas y cuidado invernal
        - Técnicas de reparación de inflables
    - title: Habilidades y Técnicas SUP
      description: Técnicas de remo, habilidades de travesía y entrenamiento físico para todos los niveles.
      icon: tabler:sailboat
      topics:
        - Técnicas de remo para principiantes
        - Dominio de palada intermedio
        - Planificación de travesías y expediciones
        - Entrenamiento de fitness y carreras de SUP
        - Habilidades de aguas bravas y ríos
    - title: Estilo de vida SUP y usos especiales
      description: Actividades especializadas de SUP — yoga, pesca, perros, familias y consejos de viaje.
      icon: tabler:heart
      topics:
        - Yoga y meditación en el agua con SUP
        - Pescar desde un SUP inflable
        - Paseo en tabla de paddle con perros y niños
        - Viajar con tu SUP en avión y en coche
        - Accesorios y equipos esenciales para SUP
    - title: Comparaciones y Referencias de SUP
      description: Comparaciones lado a lado para ayudarte a tomar decisiones informadas.
      icon: tabler:chart-bar
      topics:
        - 'SUP vs kayak: ¿cuál es adecuado para ti?'
        - Grados de material PVC explicados
        - Seguridad de cámara única vs multi-cámara
        - Materiales de tabla SUP explicados
        - Impresión UV vs obra de arte en bloque de EVA

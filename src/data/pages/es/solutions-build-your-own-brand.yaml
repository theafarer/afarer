meta:
  title: Fabricación de SUP de Marca Privada | {SITE}
  description: 'Lanza tu propia marca de SUP con Afarer. Desde la idea hasta el mercado: servicio completo OEM/ODM que incluye diseño, prototipado, producción y logística global.'
hero:
  tagline: Construye Tu Propia Marca
  title: Lanza Tu Propia<br />Marca de SUP
  subtitle: Tienes la visión. Nosotros tenemos la fábrica, la experiencia y la cadena de suministro. Juntos, construiremos una marca que se destaque.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Tabla de SUP personalizada con marca en el agua
process:
  title: Tu Viaje de Marca
  subtitle: De la idea al mercado en 5 fases.
  steps:
    - phase: Fase 1
      title: Idea
      period: Semana 1-2
      items:
        - Investigación de mercado y análisis de competidores
        - Definición del cliente objetivo
        - Taller de posicionamiento de marca
        - Estrategia de línea de productos
    - phase: Fase 2
      title: Diseño
      period: Semana 3-6
      items:
        - Forma de la tabla y diseño gráfico
        - Coincidencia de colores y selección de materiales
        - Especificación del accesorio
        - Diseño de envases y etiquetas
    - phase: Fase 3
      title: Prototipo
      period: Semana 7-10
      items:
        - Producción de muestra
        - Pruebas de calidad (presión, flotabilidad, UV)
        - Ajustes de diseño
        - Aprobación final
    - phase: Fase 4
      title: Producción
      period: Semana 11-14
      items:
        - Fabricación a granel
        - Inspección de control de calidad (por unidad)
        - Transporte marítimo / transporte aéreo
        - Documentos de despacho de aduana
    - phase: Fase 5
      title: Lanzar
      period: Semana 15-16
      items:
        - Fotografía de productos
        - Fuente de productos del sitio web
        - Materiales de marketing
        - Soporte de lanzamiento
packages:
  title: Paquetes de inicio
  subtitle: Paquetes diseñados para cada etapa del crecimiento de la marca.
  items:
    - name: Starter Brand
      tagline: 50-100 unidades · 2 modelos de placa
      features:
        - Impresión básica de logotipos
        - Embalaje estándar
        - Soporte por correo electrónico
    - name: Growing Brand
      tagline: 300-1,000 unidades · 3-5 modelos de placas
      features:
        - Logo de color personalizado
        - Embalaje personalizado
        - Fotos del producto
        - Gerente dedicado
    - name: Established Brand
      tagline: 1,000 unidades · Línea completa de productos
      features:
        - Personalización completa
        - Embalaje premium
        - Material de marketing
        - Producción prioritaria

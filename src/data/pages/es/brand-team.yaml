hero:
  tagline: Our Team
  title: 'Las Personas Detrás de afarer<br />—Ingeniería de Libertad'
  subtitle: 'Fundado en 2012 en Qingdao, China, afarer fue construido por ingenieros marinos, científicos de materiales'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'De un Taller Costero<br />a una Instalación de 12.000 m²'
  subtitle: 'afarer fue fundado por un equipo de ingenieros marinos con décadas de experiencia.'
  items:
    - title: 'Founded: 2012'
      description: 'Establecido en Qingdao, China – un importante centro marítimo.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'Incluyendo 50+ ingenieros I+D, especialistas en control de calidad.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Planta de fabricación con 6 líneas para SUP, inflables y SUP.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Exportación a Europa, Américas, Oriente Medio, Asia-Pacífico y África.'
      icon: tabler:globe
leadership:
  tagline: Leadership
  title: 'Liderazgo de Gestión e Ingeniería'
  subtitle: 'Nuestro equipo directivo reúne experiencia en ingeniería marina, comercio internacional y gestión de calidad.'
  columns: 3
  items:
    - title: 'Founder & CEO'
      name: 'Toby Liu'
      description: '15+ years in marine manufacturing. Previously led R&D at a major Chinese boat manufacturer. Holds multiple patents in inflatable boat design.'
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: 'Chief Engineer'
      name: 'Zhang Wei'
      description: '20+ years in PVC/Hypalon fabrication and deep-V hull design. Former technical director at a European marine engineering firm.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Head of R&D'
      name: 'Chen Ming'
      description: 'Doctorado en Ciencias de Materiales. Especializado en tecnología drop-stitch y soldadura de alta frecuencia'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Director de Producción'
      name: 'Liu Qiang'
      description: '18+ years in lean manufacturing and production line optimization. Six Sigma Black Belt. Implemented ISO 9001 quality systems.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Gerente de Calidad'
      name: 'Wang Fang'
      description: '12+ years in marine quality control. Certified CE and ISO auditor. Oversees testing for every production batch.'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'

meta:
  title: 'Nuestro Equipo — Ingenieros Marinos y Constructores | {SITE}'
  description: 'Fundado en 2012 en Qingdao, afarer se construyó con ingenieros marinos, científicos de materiales y entusiastas de los deportes acuáticos. Conozca al equipo detrás de la fábrica.'
  keywords:
    - 'equipo afarer'
    - 'ingenieros marinos'
    - 'fabricante de SUP hinchable'
    - 'equipo de fábrica de SUP'
hero:
  tagline: Nuestro Equipo
  title: Las Personas Detrás de afarer<br />— Ingeniería de Libertad
  subtitle: Fundado en 2012 en Qingdao, China, afarer fue construido por ingenieros marinos, científicos de materiales
  image:
    src: /images/team-all.webp
    alt: Foto completa del equipo de Afarer — ingeniería, producción y liderazgo
founding:
  tagline: Nuestra Fundación
  title: De un Taller Costero<br />a una Instalación de 12.000 m²
  subtitle: afarer fue fundado por un equipo de ingenieros marinos con décadas de experiencia.
  items:
    - title: 'Fundado: 2012'
      description: Establecido en Qingdao, China – un importante centro marítimo.
      icon: tabler:calendar
    - title: 200 empleados
      description: Incluyendo 50+ ingenieros I+D, especialistas en control de calidad.
      icon: tabler:users
    - title: Instalación de 12.000 m²
      description: Planta de fabricación con 6 líneas para SUP, inflables y SUP.
      icon: tabler:building-factory
    - title: Más de 50 países atendidos
      description: Exportación a Europa, Américas, Oriente Medio, Asia-Pacífico y África.
      icon: tabler:globe
leadership:
  tagline: Liderazgo
  title: Liderazgo de Gestión e Ingeniería
  subtitle: Nuestro equipo directivo reúne experiencia en ingeniería marina, comercio internacional y gestión de calidad.
  columns: 3
  items:
    - title: Fundador y CEO
      name: Toby Liu
      description: 15 años en fabricación marina. Anteriormente dirigió I+D en un importante fabricante de barcos chino. Posee varias patentes en el diseño de botes inflables.
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: Ingeniero Jefe
      name: Zhang Wei
      description: 20 años en fabricación de PVC/Hypalon y diseño de cascos en V profunda. Ex director técnico en una empresa europea de ingeniería naval.
      icon: tabler:engine
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Jefe de I+D
      name: Chen Ming
      description: Doctorado en Ciencias de Materiales. Especializado en tecnología drop-stitch y soldadura de alta frecuencia
      icon: tabler:flask
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Director de Producción
      name: Liu Qiang
      description: 18 años en manufactura esbelta y optimización de líneas de producción. Cinturón Negro de Six Sigma. Implementó sistemas de calidad ISO 9001.
      icon: tabler:settings
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Gerente de Calidad
      name: Wang Fang
      description: 12 años en control de calidad marina. Auditor certificado CE e ISO. Supervisa las pruebas de cada lote de producción.
      icon: tabler:shield-check
      image: data:image/svg xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><circle cx="64" cy="64" r="64" fill="#e5e7eb"/><circle cx="64" cy="48" r="18" fill="#9ca3af"/><ellipse cx="64" cy="100" rx="32" ry="20" fill="#9ca3af"/></svg>
    - title: Director de Ventas y Operaciones
      name: Helen Lee
      description: 15 años en comercio B2B internacional. Gestionó asociaciones co-brand y de distribución en 30 países. Fluido en 4 idiomas.
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Filosofía de diseño
  title: Diseño Impulsado por Ingeniería<br />— Cada Detalle Importa
  subtitle: Nuestra filosofía de ingeniería se centra en tres principios.
  list:
    - 'Confiabilidad primero: cada producto afarer se prueba para resistir condiciones del mundo real'
    - 'Precisión de fabricación: nuestras instalaciones utilizan corte CNC, soldadura de alta frecuencia'
    - 'Innovación continua: nuestro equipo de I+D evalúa nuevos materiales, métodos de producción y diseños'
cta:

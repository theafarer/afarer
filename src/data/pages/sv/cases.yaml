features3_cases:
  tagline: Utvalda fall
  title: Skräddarsydda lösningar<br />för verkliga utmaningar
  isBeforeContent: false
  columns: 3
  items:
    - title: Europeisk dykcenterflotta
      customer: BlueMed dykcenter
      country: Grekland
      industry: Dykning och marinturism
      challenge: Behövde 12 dykaranpassade SUP:er för en kedja av dykcenter på flera grekiska öar. Varje bräda krävde anpassad utrustningsfäste, förvaring för 8 flaskor och en stabil plattform för dykarens inträde i öppet vatten. Flottan behövde anlända inom 60 dagar inför turistsäsongens start.
      solution: Tillverkade 12 SUP Voyager Dive-modeller med integrerade utrustningsstöd, stabila plattformar och extra bred drop-stitch-konstruktion för ombordstigningsstabilitet. Varje bräda märktes med kundens flottiljdesign. Alla 12 brädor trycktestades och skeppades från Qingdao inom 55 dagar.
      product: SUP Voyager Dyk
      results: Alla 12 brädorna levererades i tid för turistsäsongen. Flottan har varit i daglig drift i mer än 18 månader utan materialfel. Kunden beställde 6 enheter till i år två.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP Voyager Dive har varit ryggraden i våra dagliga dykoperationer. Stabiliteten är utmärkt och utrustningslayouten håller däcket rent och säkert för våra gäster.
      icon: tabler:lifebuoy
    - title: Australiskt distributörs-co-brand-program
      customer: Pacific Watersports Pty Ltd
      country: Australien
      industry: Co-brand & partnerskapsprogram
      challenge: >-
        Australisk distributör behövde ett privatmärkt SUP-bräd-sortiment till konkurrenskraftiga priser för att kunna konkurrera med kinesiska direct-to-consumer-varumärken. 8 unika modeller krävdes, från nybörjare till avancerad, med anpassad grafik, anpassad förpackning och dropship-leverans till
        detaljhandlare.
      solution: >-
        Utvecklade 8 SUP-modeller (Allround, Touring, Yoga, Barn, Sport, Ultra-kompakt, Ultra-stabil, Whitewater) med exklutivt australiensiskt grafikpaket. Anpassad detaljhandelsförpackning med QR-kopplingar till installationsvideos. Direktleveranslogistik från Qingdao till australiensiska
        detaljhandelsbutiker.
      product: Anpassad SUP-serie (8 modeller)
      results: Från koncept till första leverans på 90 dagar. Försäljningsgrad på 85 % första säsongen. Återförsäljaren utökade samarbetet till att omfatta ytterligare SUP-modeller år två.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: afarer levererade en komplett SUP-serie på 90 dagar — från initial design till butikshyllan. Kvaliteten motsvarar varumärken som säljer till dubbelt så högt pris.
      icon: tabler:currency-dollar
    - title: Räddningsbåtsleverans Mellanöstern
      customer: Nationell civilförsvarsmyndighet
      country: Förenade Arabemiraten
      industry: Sökning och räddning
      challenge: En civilförsvarsorganisation behövde 20 patrullklara SUP:er för kustsökning och räddning, hamnsäkerhet och översvämningsvar. Krav på synliga brädor, komplett säkerhetsutrustning och efterlevnad av lokala maritima regler.
      solution: >-
        Levererade 20 SUP Patrol-modeller med hög synlighet orange drop stitch-konstruktion, fullständiga säkerhetspaket, SOLAS-reflektansband och förstärkt konstruktion. Varje bräda var CE-certifierad och testad enligt tillämpliga standarder. Dokumentationen inkluderade överensstämmelsescertifikat
        för lokal registrering.
      product: SUP-patrull
      results: Flotta distribuerad till fem kuststationer. Brädorna har opererat i extrem värme (45 °C+) utan degradering. Prestanda och hållbarhet överträffade specifikationerna.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP Patrol överträffade våra operativa krav. Under extrema värmeförhållanden visar brädorna inga tecken på UV-nedbrytning efter 24 månaders daglig användning.
      icon: tabler:alert-triangle
    - title: Europeiskt co-brand-partnerskap
      customer: North Sea Marine Equipment BV
      country: Nederländerna
      industry: Co-brand & partnerskapsprogram
      challenge: Etablerat europeiskt marint varumärke ville expandera inom SUP-marknaden utan att investera i tillverkningsanläggningar. Behövde en vitmärktespartner som kunde producera 5 SUP-modeller (9 ft till 12 ft) med eget varumärke, CE-certifiering och exklusiva EU-distributionsrättigheter.
      solution: >-
        Etablerat tillverkningsavtal i vit etikett för 5 SUP-modeller. Varje modell märkt med kundens logotyper och färgsättning. CE-certifieringsdokumentation förberedd för varje modell. Exklusiva EU-distributionsrättigheter beviljade med minimiorderåtaganden. Teknisk dokumentation tillhandahållen
        för lokal servicenätverk.
      product: Anpassad SUP-serie (5 modeller)
      results: Flerårigt avtal undertecknat. Första produktionsbatchen på 50 enheter skeppades inom 75 dagar. Varumärket lanserades på en stor mässa med positiv mottagning från återförsäljare.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Att samarbeta med afarer gjorde det möjligt för oss att gå in på SUP-marknaden utan att bygga en fabrik — de levererade en komplett nyckelfärdig lösning med CE-certifiering och återförsäljarstöd.
      icon: tabler:building
    - title: Karibisk resortflotta
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Marin turism och gästfrihet
      challenge: >-
        En lyxresort behövde en komplett vatten­sport­utrustning­flotta för gästaktiviteter: 40 SUP-brädor för guidade turer, 20 ytterligare SUP-brädor för lagunutflykter, 10 SUP-brädor för gäst­utflykter samt tillbehör. All utrustning krävde anpassad resort­ branding och levereras innan
        högsäsongen.
      solution: >-
        Tillverkade komplett SUP-paket: 40 SUP Voyager-brädor (All-Around-modell), 20 SUP Explorer-brädor, 10 SUP Touring-brädor, samt räddningsvästar, paddlar, pumpar och reparationssatser. All utrustning tryckt med resortlogotyp och tropiskt färgschema. ContAINERAD leverans med fullständig
        inventarielista.
      product: Komplett SUP-paket (70+ enheter)
      results: Flottan anlände 6 veckor före högsäsongen. Gästnöjdhetspoäng för vattensporter ökade med 40 % jämfört med föregående år. Utrustningen har hållit i 3 säsonger med enbart rutinmässigt underhåll.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: Det kompletta paketet innebar att vi fick allt vi behövde i en enda leverans — bräder och tillbehör allt med varumärke och redo för användning av gäster. Våra gäster älskar utrustningens kvalitet.
      icon: tabler:beach
    - title: US-kustpatrullkontrakt
      customer: Atlantic Coastal Security Agency
      country: Förenta staterna
      industry: Sjösäkerhet och polisiär verksamhet
      challenge: USAs kustsäkerhetsmyndighet krävde tunga patrull-SUPs för öppna vattenoperationer. Behövde högpresterande brädor med militärklassutrustning och efterlevnad av US Coast Guard-regler.
      solution: Konstruerad SUP-patrull med förstärkt drop-stitch-konstruktion, hög synlighetsfärgsättning, krypterade fästen för kommunikationsutrustning och integrerade fästen för utrustning. Brädorna är förstärkta för tunga operationer. USCG-efterlevnadsdokumentation tillhandahålls.
      product: SUP-patrull
      results: Myndigheten rapporterade en beredskapsgrad på 95 % under de första 12 månaderna. En ytterligare order för 8 enheter har lagts.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: SUP-patrullen ger våra besättningar den prestanda som krävs för öppenvattensoperationer. Den förstärkta konstruktionen ger avgörande hållbarhet utan att compromise hanteringen.
      icon: tabler:shield

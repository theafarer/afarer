hero:
  tagline: 'Fallstudier'
  title: 'Verkliga projekt, verkliga resultat<br />—afarer i handling'
  subtitle: 'Se hur afarer samarbetar med distributörer, varumärken och operatörer över hela världen för att leverera skräddarsydda marina lösningar för varje tillämpning.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'afarer fallstudier —skräddarsydda marina tillverkningsprojekt'
features3_cases:
  tagline: 'Utvalda fall'
  title: 'Skräddarsydda lösningar<br />för verkliga utmaningar'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Europeisk dykcenterflotta'
      description: 'Levererade 12 SUP 520 dykkonfigurerade båtar till en kedja av dykcenter i Medelhavet. Anpassade tankställ, dykstegar och flottmärkning. Levererat på 60 dagar.'
      icon: tabler:lifebuoy
    - title: 'Australiskt distributörs-OEM-program'
      description: 'Utvecklade ett sortiment av SUP-brädor under eget märke för en australisk vattensportsdistributör. 8 modeller, anpassad förpackning och drop-ship-logistik. Från koncept till första leverans på 90 dagar.'
      icon: tabler:currency-dollar
    - title: 'Räddningsbåtsleverans Mellanöstern'
      description: 'Levererade 20 SUP 450 Patrol-båtar till en civilförsvarsorganisation i Mellanöstern. Självlänsande däck, full navigationsutrustning och synliga orange tuber. Efterlevnad av lokala regelverk.'
      icon: tabler:alert-triangle
    - title: 'Europeiskt OEM-varumärkespartnerskap'
      description: 'White-label-tillverkningspartnerskap med ett europeiskt marint varumärke. 5 SUP-modeller, eget märke, exklusiva distributionsrättigheter för EU-marknaden. Flerårigt avtal.'
      icon: tabler:building
    - title: 'Karibisk resortflotta'
      description: 'Komplett vattensportutrustningspaket för en karibisk resort: 40 SUP-brädor, 20 kajaker, 10 uppblåsbara båtar och tillbehör. Anpassad resortmärkning på all utrustning.'
      icon: tabler:beach
    - title: 'US-kustpatrullkontrakt'
      description: 'Levererade SUP 600 patrullbåtar till en amerikansk kustsäkerhetsmyndighet. Tvåmotorkonfiguration, pansrade konsolalternativ och militär elektronikintegration.'
      icon: tabler:shield

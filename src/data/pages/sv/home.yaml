meta:
  title: Afarer Uppblåsbara Paddleboards | Gå längre. Kör hårdare.
  description: Upptäck Afarer uppblåsbara paddleboards för allround-paddling, touring, yoga, fiske och äventyr utomhus. Hitta din perfekta SUP och utforska mer på vattnet.
  keywords:
    - uppblåsbar paddleboard
    - uppblåsbar sup
    - allround sup
    - touring sup
    - yoga sup
    - fiske sup
    - familjepaddleboard
    - portabel paddleboard
hero:
  tagline: Uppblåsbara Paddleboards
  title: Uppblåsbara Paddleboards för Varje Äventyr
  slogan: Gå längre. Kör hårdare.
  subtitle: Upptäck friheten i paddling med Afarer. Utforska genomtänkta uppblåsbara SUP:ar för avslappnade dagar vid sjön, kustäventyr, träning och allt däremellan.
  taglineSection: Byggd för förtroende. Designad för att synas.
  actions:
    - variant: primary
      text: Hitta Din Bräda
      href: /size-guide/
      icon: tabler:compass
    - text: Utforska SUP
      href: /inflatable-sup/
      icon: tabler:waves
    - text: Varför Afarer
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: Afarer uppblåsbara paddleboards glider över lugnt vatten i soluppgången — byggda för varje äventyr
who_we_serve:
  tagline: Kör Med Oss
  title: Hitta Din Väg på Vattnet
  subtitle: Varje paddlare har sin egen bild av äventyr. Upptäck en Afarer SUP designad för ditt sätt att paddla.
  items:
    - title: Nybörjare & Fritidspaddlare
      keywords: uppblåsbar sup för nybörjare, allround paddleboard, stabil sup
      description: Breda, stabila allround-brädor som får ditt första paddeltag att kännas naturligt och följer med dig när du utvecklas.
      icon: tabler:users
      cta: Hitta Din Första Bräda
      link: /all-around-sup/
    - title: Touring & Äventyr
      keywords: touring sup, långfärdspaddleboard, expeditionssup
      description: Längre, smalare brädor byggda för att hålla kursen, glida längre och bära packning för flerdagarsturer.
      icon: tabler:building
      cta: Utforska Touring SUP
      link: /touring-sup/
    - title: Yoga & Träning
      keywords: yoga sup, träningspaddleboard, bred stabil sup
      description: Breda, stabila plattformar med utrymme att röra sig — för soluppgångsflöden, pass och balans på lugnt vatten.
      icon: tabler:heart
      cta: Utforska Yoga SUP
      link: /yoga-sup/
    - title: Fiske & Familj
      keywords: fiskesup, familjepaddleboard, stabil fiskeplattform
      description: Stabila, praktiska plattformar för mete, utflykter med barnen och långa avslappnade dagar på vattnet.
      icon: tabler:users
      cta: Utforska Fiske SUP
      link: /fishing-sup/
proof_points:
  title: Testat bortom showroomet
  subtitle: Design, prestanda och kvalitet du kan verifiera — på vattnet och i siffrorna.
  items:
    - metric: 10+
      label: Års design för vattnet
      detail: Sedan 2012, förfinat bräda för bräda
    - metric: 50+
      label: Länder på vattnet
      detail: Paddlare och partner världen över
    - metric: 12–15
      label: PSI drop-stitch-kärna
      detail: Stel där det spelar roll, lätt att packa
    - metric: 100%
      label: Trycktestad, bräda för bräda
      detail: Inspekterad före leverans
business_solutions:
  tagline: Därför Känns Annorlunda
  title: Prestanda du Känner vid Första Paddeltaget
  subtitle: Fyra pelare formade av riktigt vatten — prestanda, design, konstruktion och kvalitet.
  items:
    - title: Prestanda på Vattnet
      description: Former trimmade för stabilitet, glid och trygghet i chop — varje paddeltag känns förbundet med vattnet.
      icon: tabler:shield-check
    - title: Uttrycksfull Design
      description: Kollektioner inspirerade av tidvatten, djurliv och kustens energi — brädor du vill synas med.
      icon: tabler:package
    - title: Beprövad Konstruktion
      description: Drop-stitch-kärnor med hög densitet, förstärkta relingar och fusionslaminerade sömmar för upprepad användning.
      icon: tabler:headset
    - title: Verifierad Kvalitet
      description: Trycktestade, visuellt inspekterade och backade av en tydlig garanti och responsiv eftermarknadsservice.
      icon: tabler:truck-delivery
cta:
  title: Hitta din nästa bräda.
  subtitle: Oavsett om det är ditt första paddeltag eller din längsta rutt — vi får dig ut på vattnet.
  actions:
    - variant: primary
      text: Utforska Kollektionen
      href: /inflatable-sup/
      icon: tabler:send
    - text: Begär Katalogen
      href: /resources/download-catalog/

who_we_serve:
  tagline: Vem vi betjänar
  title: Komplett SUP-lösning för varje vattenverksamhet
  subtitle: Skräddarsytt utrustning, tillverkning och affärsstöd för fyra nyckelmarknader.
  items:
    - title: Paddelklubbar
      keywords: SUP-klubbustyrning, paddelskoleutrustning, uthyrningsflotta
      description: Hållbara SUP-flottor, klubbrabatter och reservdelsprogram för paddelklubbar och skolor.
      icon: tabler:users
      cta: Utforska paddleklubblösningar
      link: /solutions/paddle-clubs
    - title: Resorts och hotell
      keywords: resorts vattenaktiviteter, hotellstrandsutrustning, gästupplevelse
      description: Kompletta SUP-flottprogram med skräddarsydd varumärkning, personalutbildning och ROI-optimerade paket.
      icon: tabler:building
      cta: Skapa din resort-vattenupplevelse
      link: /solutions/resorts-hotels
    - title: Handelspartners
      keywords: SUP-grosshandel, outdoor-återförsäljare, sport­butiker
      description: Fullständig produktlinje, marknadsföringsmaterial, dropshipping-alternativ och konkurrenskraftiga grossistmarginaler.
      icon: tabler:shopping-cart
      cta: Bli återförsäljarpartner
      link: /solutions/retail-partners
    - title: Nya SUP-varumärken
      keywords: privatmärkt SUP, anpassat SUP-varumärke, OEM-paddlebräder
      description: Helhetslösning för OEM/ODM-tillverkning — design, prototyper, massproduktion och global logistik.
      icon: tabler:package
      cta: Bygg ditt SUP-varumärke
      link: /oem-odm-manufacturer
proof_points:
  title: Betrodd av vattenföretag världen över
  subtitle: Decennier av marinteknisk erfarenhet som driver lönsamma SUP-program.
  items:
    - metric: 10+
      label: År av erfarenhet
      detail: Sedan 2012
    - metric: 50+
      label: Länder vi betjänar
      detail: Globalt distributionsnätverk
    - metric: 15 000+
      label: Enheter tillverkade per år
      detail: CE-certifierad produktions­kapacitet
    - metric: 100%
      label: CE-certifierad
      detail: ISO 9001, BSCI, REACH-efterlevnad
business_solutions:
  tagline: Hur vi hjälper
  title: Din partner från koncept till intäkt
  subtitle: Fyra kärnförmågor som hjälper vattensföretag att lansera, driva och växa.
  items:
    - title: Professionell utrustning
      description: Kommersiella SUP-brädor konstruerade för daglig uthyrning, 500+ cykler med minimalt underhåll.
      icon: tabler:shield-check
    - title: OEM-tillverkning
      description: Änd-till-änd produktion av eget märke från design och prototyper till massproduktion och global leverans.
      icon: tabler:package
    - title: Affärssupport
      description: Personalutbildning, marknadsföringsmaterial, reservdelsprogram och dedikerad kontohantering.
      icon: tabler:headset
    - title: Global logistik
      description: FOB Qingdao, CIF stora hamnar, dörr-till-dörr-leverans till 50+ länder med tull­stöd.
      icon: tabler:truck-delivery
oem_section:
  tagline: Lansera ditt varumärke
  title: Från idé till marknad på 16 veckor
  subtitle: Din kompletta partner för lansering av SUP-varumärken — design, prototyp, tillverkning och frakt.
  steps:
    - number: '01'
      title: Idé och brief
      desc: Dela din vision, målgrupp och specifikationer.
    - number: '02'
      title: Design och ingenjörsvetenskap
      desc: 3D-modellering, materialval och anpassad grafisk design.
    - number: '03'
      title: Prototyp och validering
      desc: Sampleproduktion med CE-certifiering och kvalitetstestning.
    - number: '04'
      title: Massproduktion
      desc: Fullskalig tillverkning med inline-kvalitetskontroll och fabriksgranskningsstöd.
    - number: '05'
      title: Global leverans
      desc: FOB Qingdao-logistik, CIF stora hamnar, dörr-till-dörr.
  cta: Börja din varumäressatsning
  cta_link: /oem-odm-tillverkare
cta:
  title: |
    Redo att konfigurera <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">din nästa båt</span>?
  subtitle: Berätta hur du ska använda båten, så föreslår vi inom en arbetsdag modell, alternativ och pris.
  actions:
    - variant: primary
      text: Begär offert
      href: /contact
      icon: tabler:message-circle
    - text: Bläddra i katalogen
      href: /products

distributor:
  tagline: 'Landsexklusiva distributörer'
  title: 'Ett land. En officiell afarer-distributör.'
  subtitle: 'Ett program med en distributör per land, med territoriell exklusivitet, återförsäljarpriser, marknadsföringsstöd och ett dedikerat Distributor Success Program.'
  benefits:
    - title: 'Territoriell exklusivitet'
      description: 'En auktoriserad distributör per land eller region — ingen intern konkurrens, inga kanalkonflikter.'
    - title: 'Direkta fabriksmarginaler'
      description: 'Distributörslistor och årliga rabatter på avtalade volymer, skeppade FOB Qingdao.'
    - title: 'Marknads- och utbildningsstöd'
      description: 'Co-brandade tillgångar, POS-material för återförsäljare, produktträning och lanseringskampanjer.'
    - title: 'Dedikerat kontoteam'
      description: 'En personlig distributörsansvarig samt onboarding-, prognos- och ombeställningsstöd.'
  actions:
    - variant: primary
      text: 'Bli distributör'
      href: /distributor-program
    - text: 'Begär prislista för återförsäljare'
      href: /contact?subject=Dealer Price List
    - text: 'Ansök om landspartnerskap'
      href: /contact?subject=Country Partnership Application
    - text: 'Ladda ner distributörsprogrammet'
      href: /distributor-program
  note: 'Provorder från 5–10 enheter. Testorder 10–30. Auktoriserad återförsäljare 30–50. Lands-/regiondistributör 100–300+.'

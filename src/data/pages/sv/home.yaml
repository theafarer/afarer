  tagline: Co-Brand-kollektioner
  title: Från idé till vatten — co-branded utgåvor
  subtitle: 'För partners som vill ha mer än en katalogprodukt: begränsade co-branded kollektioner som designas, konstrueras och byggs med afarer — samtidigt som varje bräda förblir en afarer-produkt.'

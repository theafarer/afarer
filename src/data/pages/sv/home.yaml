meta:
  title: 'Prestationsinriktade uppblåsbara SUP-brädor — Afarer Water Sports | {SITE}'
  description: 'Afarer designar prestationsinriktade uppblåsbara SUP:ar för öppet vatten, touring, yoga och äventyr. Drop-stitch-styvhet, trycktestade bräda för bräda, med exklusiva landspartnerskap och begränsade co-branded kollektioner. Utforska kollektionen.'
  keywords:
    - 'prestationsinriktad uppblåsbar SUP'
    - 'premium uppblåsbar SUP-bräda'
    - 'uppblåsbart SUP-varumärke'
    - 'touring-uppblåsbar SUP'
    - 'co-branded paddleboard'
    - 'SUP-distributör per land'
hero:
  tagline: Prestationsinriktade uppblåsbara SUP-brädor
  title: |
    Ta dig längre. <br class="hidden sm:inline" />
    Paddla starkare.
  subtitle: |
    <span class="hidden sm:inline"><span class="font-semibold">afarer</span> designar prestationsinriktade uppblåsbara SUP:ar för öppet vatten och långa dagar ute på sjön.</span>
    <span class="block mb-1 sm:hidden font-bold text-blue-600">afarer: gjorda för prestanda.</span>
    Stabila när det gäller, styva under tryck och redo för ett föränderligt vatten.
  taglineSection: Kommersiella oppustliga SUP-lösningar för resorter, klubbar, återförsäljare och varumärken inom vattensport.
  actions:
    - variant: primary
      text: Se produkter
      href: /products
      icon: tabler:shopping-bag
    - text: Läs mer
      href: '#features'
      icon: tabler:file-text
    - text: Utforska SUP-lösningar
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: afarer omslag

hero:
  tagline: Säkerhet
  title: Säkerhetsstandarder och certifiering
  subtitle: Varje afarer-produkt genomgår rigorösa tester och uppfyller internationella säkerhetsstandarder för både fritids- och professionellt bruk.

certifications:
  - title: CE-certifiering
    description: All afarer-säkerhetsutrustning uppfyller kraven för CE-märkning enligt EU:s förordning om personlig skyddsutrustning (EU) 2016/425.
  - title: ISO 12402
    description: Flytvästarna uppfyller -standarderna för flytkraft. Life Vest Classic ger flytkraft 50N+; Life Vest Pro uppfyller SOLAS-kraven med automatisk uppblåsning.
  - title: SOLAS-efterlevnad
    description: Life Vest Pro är kompatibel med SOLAS-föreskrifterna (Safety of Life at Sea) för marina offshore- och kommersiella operationer.


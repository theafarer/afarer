intro: >-
  En oppustbar båt är bara så pålitlig som dess sömmar. En enda svag svetsning kan compromise hela en kamma — och till havs är ett kammabrot en säkerhetsrisk, inte ett besvär. På {SITE.name} har vi investerat i ett dedikerat Radiofrekvens (RF) svetsningscenter som kombinerar industriella
  dielektriska svetspressar med strikt processkontroll och efter-svetsprovning. Varje söm vi producerar dokumenteras, är spårbar och certifierad för att uppfylla eller överträda kraven i — den internationella standarden för oppustbara fartyg.
content_html: >-
  <h2>Vetenskapen bakom sömmen</h2>

  <p>RF-svetsning använder högfrekvent elektromagnetisk energi (vanligen 27,12 MHz) för att excitera de pola moleklerna i PVC- eller Hypalon-belagd duk och generera värme exakt vid materialgränsen. Till skillnad från varmlufts- eller vinkkantssvetsning skapar RF-svetsning en verklig
  molekylärbindning — de två duklagena smälter samman till ett homogent material i svetszonen, vilket ger en fog som är lika stark som basmaterialet själv.</p>


  <h2>Svetsutrustning och processkontroll</h2>

  <p>Vårt svetscenter är utrustat med:</p>

  <table>
    <thead><tr><th>Maskin</th><th>Effekt / Kapacitet</th><th>Tillämpning</th></tr></thead>
    <tbody>
      <tr><td>Dielektrisk RF-press 1</td><td>15 kW, platta 2000 × 600 mm</td><td>Huvudlångsömmar, transom-rörfogar</td></tr>
      <tr><td>Dielektrisk RF-press 2</td><td>10 kW, platta 1500 × 500 mm</td><td>Bafflesvetsning, konfästen, ventilkuddar</td></tr>
      <tr><td>CNC-styrd RF-svets</td><td>8 kW, XY-bord 2500 × 1200 mm</td><td>Kurvor, sömmar, logotyp-/panelpreget, precisionssvarsning</td></tr>
      <tr><td>Varmkantssvets automatisk</td><td>Variabel temperatur, max 1,2 m/min</td><td>Reservmetod för Hypalon/CSM-material</td></tr>
    </tbody>
  </table>

  <p>Varje RF-press är utrustad med stängd slinga för temperatur- och tryckövervakning. Svetsparametrar — effekt, pressningstid, svaltid, elektroddstryck — programmeras per materialtyp och loggas i vårt tillverkningssystem (MES) för full spårbarhet.</p>


  <h2>Svetskvalitetstester — varje söm, varje båt</h2>

  <p>Svetskvaliteten verifieras genom ett obligatoriskt protokoll med fyra tester:</p>

  <ol>
    <li><strong>Visuell inspektion</strong> — 100 % av sömmarna inspekteras visuellt för genombränning, missriktning, kontaminering eller ofullständig sammanfogning. Avvisningströskel: 0,5 % av lopsmeterna.</li>
    <li><strong>Dragprov ()</strong> — Ett 25 mm brett band skärs från ett prov som svetsats med varje produktionsparti. Minsta draghäftning: 120 N/25 mm för PVC 1100 dtex.</li>
    <li><strong>Lufttäthetstest</strong> — Varje färdig kamma pumpas upp till 1,5 × arbetstryck och hålls i 30 minuter. Tryckfallet får inte överstiga 2 %.</li>
    <li><strong>Termocykeltest</strong> — Provbitar cyklas från −20 °C till +60 °C i 50 cykler och dragprovats därefter igen. Acceptabelt styrkeförlust: &lt; 10 %.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Jämförelse av draghäftning — RF-svetsning vs. varmluftssvetsning (PVC 1100 dtex)</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">RF-svetsning</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:92%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">184 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium">Varmluft</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-gray-400 rounded" style="width:65%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">130 N</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-24 text-xs font-medium"> min.</span>
        <div class="flex-1 h-6 bg-gray-200 dark:bg-gray-700 rounded">
          <div class="h-full bg-green-500 rounded" style="width:48%"></div>
        </div>
        <span class="text-xs font-bold w-12 text-right">96 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">RF-svetsning uppnår konsekvent 90–95 % av basmaterialets styrka, klart över minimumkravet.</p>
  </div>


  <h2>Professionell kompetens</h2>

  <p>Vårt svetsningspersonal leds av en senior processtekniker med 11 års erfarenhet av dielektrisk svetsning av belagda textilier. Varje operatör genomgår ett 6-månaders internt certifieringsprogram innan hen får arbeta med produktsömmar. Omskolning krävs årligen, inklusive ett praktiskt svetsprov
  som bedöms mot vår interna A-klassstandard (draghäftning ≥ 160 N/25 mm).</p>


  <h2>Anpassade svetslösningar för unika behov</h2>

  <p>Vi förstår att en enda svetspecifikation inte passar alla tillämpningar. Vårt RF-svetsningscenter utvecklar rutinmässigt anpassade sömkonfigurationer för kunder med särskilda behov:</p>

  <ul>
    <li><strong>Flerskiktsförstärkningskuddar</strong> — för slitageutsatta områden som skraplistar och bogsken utvecklar vi multipass RF-svetsningar som integrerar ett slitetåligt yttre lager utan att kompromissa flexibiliteten.</li>
    <li><strong>Ledande eller RF-opaka sömmar</strong> — för militär- eller övervakningsfartyg som kräver elektromagnetisk skärmning svetsar vi ledande nät innanför sömsuppen.</li>
    <li><strong>Färgbyte panelsvetsning</strong> — tvåfärgade dukpaneler (t.ex. orange skrov + grå översida) svetsas med dold överlappning för att behålla varumärkesestetiken utan synlig foglinje.</li>
  </ul>


  <h2>Vårt engagemang för dig</h2>

  <p>Varje båt vi levererar bär vår svetskvalitetsgaranti: om någon söm misslyckas under normal drift inom garantiperioden reparerar eller ersätter vi den drabbade kammaren utan kostnad, och en undersökning av orsaken utförs för att förhindra upprepning. Detta är inte bara en garanti — det är ett
  engagemang för kontinuerlig förbättring driven av verklighetsbaserad driftdata.</p>

  <p>När du väljer {SITE.name} väljer du sömmar som är konstruerade, testade och dokumenterade — inte bara svetsade. Det är skillnaden mellan en båt som flyter och en båt som presterar.</p>

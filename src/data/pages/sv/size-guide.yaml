how_to_choose:
  title: Så här väljer du rätt storlek
  cards:
    - title: SUP-brädor
      description: Välj längd baserat på din vikt och användningsområde. Bredare brädor (32"+) ger större stabilitet. Längre brädor (11–12 fot) håller kursen bättre vid turer. Tyngre paddlare behöver brädor med större volym.
    - title: Touring SUP-brädor
      description: Längre brädor (11–12 fot) är bäst för att täcka distans och touring. Bredare brädor (32"+) ger mer stabilitet. Kontrollera viktkapaciteten för total last inklusive utrustning.

    - title: Allround-SUP:ar
      description: Välj längd efter paddlarvikt och användningsområde. Allroundbrädor fungerar för rekreation, träning och yoga. Mindre brädor är mer lättmanövrerade.

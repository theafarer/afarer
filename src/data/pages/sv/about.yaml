      description: Paddlar, pumpar, skydd, vattentäta väskor och elektronik. Allt anpassat för våra brädor.
      icon: tabler:package
    - title: Reparation & service
      description: Reparation av brädor i huset, utbyte av padeldynor och tillbehörsuppgraderingar.
      icon: tabler:tool
    - title: Skräddarsydda byggen
      description: Design projekt för projekt för kommersiella, vetenskapliga och militära kunder.
      icon: tabler:hammer

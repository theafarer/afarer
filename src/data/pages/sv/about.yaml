features3_what_we_build:
  title: Vad vi bygger
  subtitle: 'Vi började i en kustverkstad med en bräda och en orubblig övertygelse: marina produkter bör konstrueras som om de spelar roll — för det gör de. Idag levererar vi till över 40 länder, men varje skrov går fortfarande genom samma händer som grundade företaget.'
  columns: 3
  isBeforeContent: true
  items:
    - title: SUP-brädor
      description: Uppblåsbara SUP-brädor från 9 till 12 fot. Designade för touring, yoga, fiske och familjebruk.
      icon: tabler:ship
    - title: Uppblåsbara SUP:ar
      description: Uppblåsbara PVC SUP-brädor från 9 till 12 fot. Lätta, tåliga och lätta att förvara.
      icon: tabler:rowing
    - title: Premium SUP-paket
      description: Kompakta SUP med höga specifikationer, skräddarsydda efter ditt varumärkes eller din flottas krav.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:

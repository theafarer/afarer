hero:
  tagline: Inköp
  title: OEM-köpguide — Inköp av oppustbara vattensportfartyg från Asien
  subtitle: 12 minuters läsning
content_html: >
  <h2>1. Förkvalifikation: Vad du bör leta efter hos en fabrik</h2>


  <h3>Efterlevnadscertifikat</h3>

  <ul>
    <li><strong>ISO 9001:2015</strong> – Kvalitetssystem</li>
    <li><strong>CE-certifiering</strong> – Verifiera avisseringsorganets nummer</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Social efterlevnadsrevision</li>
    <li><strong>REACH / RoHS</strong> – Material efterlevnadserkläring</li>
  </ul>


  <h3>Tillverkningskapacitet</h3>

  <ul>
    <li>Drop-stitch-kärnvävning internt vs. utkompilerat</li>
    <li>PVC-beläggnings-/lamineringsspår</li>
    <li>RF-svetsnings- och hetluftssvetsningsutrustning</li>
    <li>Internt formtillverkning (CNC-bearbetning)</li>
    <li>Provslaboratorium (tryckprovning, UV-åldring, dragprovning)</li>
  </ul>


  <h3>Erfarenhetsverifiering</h3>

  <ul>
    <li>År i inflerbar vattenfartygstillverkning (minst 5+ år)</li>
    <li>Antal ingenjörer anställda</li>
    <li>Befintliga OEM/ODM-kunder (begär referenser)</li>
    <li>Exportdestinationer – skeppar de redan till din målmarknad?</li>
  </ul>


  <h2>2. Kvalitetskontrollprotokoll</h2>

  <p>Materialinköp QC: draghållfasthet (ASTM D751 eller ISO 1421), rivhållfasthet (ASTM D2261 eller ISO 4674), vidhållfasthet, UV-åldringskontroller.</p>

  <p>Processkontroll QC: sömhållfasthetsövervakning var 50:de enhet, ventilmomentverifiering, drop-stitchtrådtäthetskontroller, dimensionskontroller mot CAD-ritningar.</p>

  <p>Slutinspektion: 100% oppningshållningstest (24 timmar, maximalt 5% minskning), visuell inspektion, ventilstest, slumpmässigt provtagning (AQL 2,5 eller 4,0 enligt ISO 2859).</p>


  <h2>3. Checklista för efterlevnadsdokumentation</h2>

  <ul>
    <li>Överensstämmelseförklaring (DoC) med hänväisning till korrekt EU-direktiv</li>
    <li>CE-certifikat från avisseringsorgan</li>
    <li>Provningssrapport från ackrediterat laboratorium</li>
    <li>Material säkerhetsdatablad (MSDS)</li>
    <li>REACH-efterlevnadserkläring</li>
    <li>Materiallista med leverantörsspårbarhet</li>
    <li>Fabriksinspektionsrapport</li>
  </ul>


  <h2>4. Förhandling av minimiordervolym</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Produkttyp</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standard MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Förhandlingsbart intervall</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP-brädor</td><td class="p-3 border">50 – 100 enheter</td><td class="p-3 border">5 – 10 enheter (prov)</td></tr>
      <tr><td class="p-3 border">Kajaker</td><td class="p-3 border">50 – 100 enheter</td><td class="p-3 border">5 – 10 enheter (prov)</td></tr>
      <tr><td class="p-3 border">Inflerbara båtar</td><td class="p-3 border">50 – 100 enheter</td><td class="p-3 border">2 – 5 enheter (prov)</td></tr>
      <tr><td class="p-3 border">RIB-båtar</td><td class="p-3 border">20 – 50 enheter</td><td class="p-3 border">2 – 5 enheter (prov)</td></tr>
      <tr><td class="p-3 border">Säkerhet / Tillbehör</td><td class="p-3 border">200 – 500 enheter</td><td class="p-3 border">50 – 100 enheter (prov)</td></tr>
    </tbody>
  </table>


  <h2>5. Logistik och frakt</h2>

  <p>Vanliga Incoterms: <strong>FOB</strong> (Fabriken levererar till avgångshamn – vanligast), <strong>EXW</strong> (Inköparen ordnar all frakt från fabriksdörren), <strong>CIF</strong> (Fabriken betalar frakt och försäkring till destinationshamn).</p>

  <p>Inflerbara produkter har läg vikt och hög volym – volymvikt (DIM) bestämmer ofta fraktkostnaden. Begär vakuumförpackad förpackning för att minska volymen med 50–60%. Sjöfrakt från Kina till EU: 25–35 dagar; till USAs västkust: 15–20 dagar.</p>


  <h2>6. Vanliga fallgropar</h2>

  <ul>
    <li><strong>Ingen fabriksrevision:</strong> Genomför alltid eller anlita en tredjepartsrevision (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Enbart muntliga specifikationer:</strong> Detaljerad teknisk specifikationsskrivering undertecknad av båda parter</li>
    <li><strong>Hoppa över provgodkännande:</strong> Skriftlig godkännande av prover före massproduktion</li>
    <li><strong>Ingen QC under produktion:</strong> Tredjepartsinspektion under produktion (DUPRO) och före leverans (PSI)</li>
    <li><strong>Ignorera efterlevnad:</strong> Verifiera CE/UKCA-certifiering före produktion</li>
  </ul>


  <h2>7. Varför Afarer</h2>

  <p>Afarer har tillverkat OEM/ODM-inflerbara vattenfartyg sedan 2012. Med en 12 000 m&sup2; ISO 9001-certifierad anläggning, 25+ ingenjörer och CE-certifiering över hela produktsortimentet uppfyller vi alla kriterier i denna guide. Vi erbjuder provMOQ:er för nya partners och kompletta
  efterlevnadsdokumentationspaket.</p>

workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50—0 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: SUP Boat Production
    description: 'Dedikerad glasfiber skrovverkstad med 6 formstationer för SUP-skrov upp till 7,6 m. Slangsvejsnings- och monteringsområde hanterar 3— SUP samtidigt. Årlig SUP-kapacitet: 2 000+ båtar.'
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & SUP
    description: 'Multiproduktionslinjer för uppblåsbara båtar, kajaker och jollar. Varmluftssvetsstationer, RF-dielektriska pressar och monteringsarbetsstationer omkonfigureras baserat på ordermix. Årlig kapacitet: 5 000+ enheter.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'Separat renrumsproduktionsområde för flytvästar och säkerhetsutrustning. Dedikerade sömnads-, skuminsättnings- och teststationer. Årlig flytvästkapacitet: 50 000+ enheter.'
    output: '50,000+ life vests/year'


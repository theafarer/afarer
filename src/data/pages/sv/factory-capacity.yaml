workshops:
  - title: Tillverkning av SUP-brädor
    description: '4 parallella monteringslinjer för uppblåsbara SUP-brädor. Varje linje kan producera 50–80 brädor per skift. Digitaltryck och serigrafistationer körs samtidigt. Årlig SUP-kapacitet: 8 000+ brädor.'
    output: 8 000+ SUP-brädor/år
  - title: 'Produktion av RIB-båtar'
    description: 'Dedikerad verkstad för glasfiberskrov med 6 formstationer för båtskrov upp till 7,6 m. Slangsvetsnings- och monteringsområde hanterar 3–6 båtar samtidigt. Årlig RIB-kapacitet: 2 000+ båtar.'
    output: '2 000+ RIB/år'
  - title: 'Uppblåsbara båtar & SUP'
    description: 'Multiproduktionslinjer för uppblåsbara båtar, kajaker och jollar. Varmluftssvetsstationer, RF-dielektriska pressar och monteringsarbetsstationer omkonfigureras baserat på ordermix. Årlig kapacitet: 5 000+ enheter.'
    output: '5 000+ enheter/år'
  - title: Säkerhetsutrustning
    description: 'Separat renrumsproduktionsområde för flytvästar och säkerhetsutrustning. Dedikerade sömnads-, skuminsättnings- och teststationer. Årlig flytvästkapacitet: 50 000+ enheter.'
    output: 50 000+ livräddningsvästar/år
oem_capacity:
  moq: 'SUP: 5–10 enheter | Båt: 2–5 enheter | Kajak/Jolle: 10–50 enheter | Anpassad form: 200+ enheter'
  lead_time: Standard 30–45 dagar. Prov 15–20 dagar. Express tillgängligt.
  payment: T/T 30% deposition + 70% före leverans. L/C, Western Union accepteras.

hero:
  tagline: Produktionskapacitet
  title: Tillverkningskapacitet och årlig produktion
  subtitle: 12 000 m² anläggning som producerar 15 000+ båtar per år med utrymme för att skala upp
intro: >-
  afarer driver ett av de största dedikerade produksionsanläggningarna för uppblåsbara båtar i Qingdao i Kina. Vår fabrik på 12 000 m² är organiserad i sex specialiserade verkstäder som arbetar parallellt, vilket ger oss kapacitet att producera över 15 000 båtar årligt inom linjerna för SUP, kajaker, jollar, RIB och säkerhetsutrustning.

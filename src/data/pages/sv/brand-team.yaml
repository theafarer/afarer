hero:
  tagline: Our Team
  title: 'Människorna bakom afarer<br />—Konstruktionsfrihet på vattnet'
  subtitle: 'Grundat 2012 i Qingdao, Kina, byggdes afarer av mariningenjörer, materialvetare och vattensportentusiaster som trodde på att göra professionella uppblåsbara båtar tillgängliga över hela världen.'
  image:
    src: /images/team-all.webp
    alt: afarer full team photo —engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'Från en kustverkstad<br />till en 12 000 m² anläggning'
  subtitle: 'afarer grundades av ett team mariningenjörer med årtionden av kombinerad erfarenhet inom design av uppblåsbara båtar, PVC/Hypalon-tillverkning och global marin utrustningstillverkning.'
  items:
    - title: 'Founded: 2012'
      description: 'Grundat i Qingdao, Kina —en stor maritim knutpunkt med ett djupt skeppsbyggnadsarv.'
      icon: tabler:calendar
    - title: '200+ Employees'
      description: 'Inklusive 50+ FoU-ingenjörer, kvalitetskontrollspecialister och produktionstekniker.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Dedikerad tillverkningsanläggning med 6 produktionslinjer för SUP, uppblåsbara båtar och SUP-brädor.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Exporterar till Europa, Amerika, Mellanöstern, Asien-Stillahavsregionen och Afrika.'
      icon: tabler:globe

    - [Rättigheter till hela produktlinjen, 300–1, 000, 60–90 dagar, 30% deposition / 70% före leverans]
faqs:
  title: 'Distributörsprogram — FAQ'
  subtitle: 'Allt distributörer frågar innan de ansöker.'
  items:
    - title: 'Vad innebär ett land, en distributör?'
      description: 'Afarer ger en enda auktoriserad distributör exklusiva rättigheter för ett land eller en region. Du äger din marknad — inga parallellimport, ingen intern konkurrens.'
    - title: 'Vad är minsta första beställning?'
      description: 'Lands- och regiondistributörer startar på 100–300 enheter. Auktoriserade återförsäljare från 30–50 enheter. Testorder från 10–30 enheter låter dig först validera marknaden (utan territoriellt skydd).'
    - title: 'Vilket stöd får distributörer?'
      description: 'Distributor Success Program omfattar onboarding, go-to-market-planering, produkt- och säljträning, demo-flottastöd, lokaliserade marknadsmaterial och en dedikerad kontoansvarig.'
    - title: 'Hur skyddar Afarer mig mot kanalkonflikter?'
      description: 'Varje territorium har exakt en auktoriserad distributör. Direkta beställningar från din region går via dig och priserna är satta för att skydda din marginal.'
    - title: 'Vilka är frakt- och betalningsvillkoren?'
      description: 'Beställningar skickas FOB Qingdao med fullständig exportdokumentation. Produktionsorder med 30% deposition och 70% före leverans; test- och provorder betalas i förskott.'
    - title: 'Hur ansöker jag?'
      description: 'Skicka en ansökan via kontaktformuläret. Vi bedömer marknadsanpassning, återförsäljarnärvaro och logistisk kapacitet och svarar inom 3 arbetsdagar med nästa steg och ett exempel på distributörsavtal.'
cta:
  title: 'Redo att äga din marknad?'
  subtitle: 'Ansök till Afarer-distributörsprogrammet och få svar inom 3 arbetsdagar.'
  actions:

faqs:
  title: 'Landspartnerskap — FAQ'
  subtitle: 'Frågorna som seriösa landpartners ställer innan de ansöker.'
  items:
    - title: 'Vad innebär ett land, en distributör egentligen?'
      description: 'Afarer utser en enda auktoriserad distributör med exklusiva rättigheter för ett definierat territorium. Vi säljer inte från våra globala eller regionala kanaler in i ett skyddat land. Ditt territorium förblir ditt så länge Distribution Agreement uppfylls.'
    - title: 'Är territoriet exklusivt för alltid?'
      description: 'Nej. Exklusivitet är villkorad, inte evig. Den upprätthålls genom en undertecknad Distribution Agreement, en genomförd första beställning, årliga inköpsmål, lokalt lager, eftermarknadskapacitet och fortsatt marknadsinvestering. Uppfylls inte dessa kan territoriet omförhandlas eller tilldelas någon annan.'
    - title: 'Vad är minsta första beställning?'
      description: 'Lands- och regiondistributörer startar på 100–300 enheter; auktoriserade återförsäljare på 30–50 enheter; testbeställningar från 10–30 enheter låter dig först validera marknaden (test- och provbeställningar medför inte territoriellt skydd). Custom- och private-label-program följer separata MOQ enligt nivåerna ovan.'
    - title: 'Vad ingår i stödsprogrammet på 10 moduler?'
      description: 'Nivåer och kvalificering, territoriellt skydd, MOQ / prissättning / årliga rabatter, lager och orderutförande, marknadsföringsmaterial och gemensamma marknadsfonder, produkt-/sälj-/teknisk utbildning, reservdelar och eftermarknad, garantiregistrering, partnerportalen samt produktdatablad, bibliotek för marknadsföringsmaterial, årlig rabattskala samt frakt- och packlistor.'
    - title: 'Hur skyddar Afarer mig mot kanalkonflikter?'
      description: 'Varje territorium har exakt en auktoriserad distributör. Förfrågningar och direkta beställningar från din region går via dig, webbformulär vidarebefordras till den lokala partnern när en sådan finns, och det globala teamet eskalerar endast när en partner inte svarar.'
    - title: 'Vilka frakt- och betalningsvillkor gäller?'
      description: 'Beställningar skickas FOB Qingdao med fullständig exportdokumentation. Produktionsbeställningar med 30% deposition och 70% före leverans; test- och provbeställningar betalas i förskott. Standardleveranstiden är 30–45 arbetsdagar, med 15–20 arbetsdagar för provomgångar.'
    - title: 'Hur ansöker jag?'
      description: 'Skicka din ansökan via kontaktformuläret med uppgifter om marknaden. Vi bedömer marknadsanpassning, återförsäljarnärvaro och logistisk kapacitet och svarar inom 3 arbetsdagar med nästa steg och ett utkast till Distribution Agreement.'

      description: 'Återförsäljarprislista med rabatter på avtalade volymer. Inga mellanhänder. FOB Qingdao-frakt med fullständig exportdokumentation.'
      icon: 'tabler:coins'
    - title: 'Partnerstödsprogram i 10 Moduler'
      description: 'Onboarding, go-to-market, utbildning, marknadsföring och gemensam marknadsfinansiering, reservdelar och eftermarknad, garanti, beställningsverktyg och en partnerportal — allt ingår i din Distribution Agreement.'
      icon: 'tabler:rocket'
    - title: 'Marknadsföring & Gemensamma Marknadsfonder'
      description: 'Lokaliserade kampanjmaterial, POS-material för återförsäljare, eventkit, digitalt innehåll på flera språk och co-marketingstöd för lanseringssäsonger.'
      icon: 'tabler:mood-smile'
    - title: 'Produkt-, Sälj- & Teknisk Utbildning'
      description: 'Strukturerade onboarding-sessioner om produkt-, sälj- och teknisk kunskap, med uppdaterade material allt eftersom sortimentet utvecklas.'
      icon: 'tabler:presentation'
    - title: 'Reservdelar & Eftermarknadsstöd'
      description: 'Reservdelsförsörjning, garantiregistrering och reklamationshantering samt produktdatablad och manualer för ditt lokala serviceteam.'
      icon: 'tabler:settings'
    - title: 'Dedikerad Kontoansvarig & Partnerportal'
      description: 'En personlig distributörsansvarig samt tillgång till prislistor, orderstatus och marknadsföringsresurser via Afarers partnerportal.'

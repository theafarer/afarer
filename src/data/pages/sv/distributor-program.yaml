features:
  title: 'Varför Partnerskap med Afarer'
  subtitle: 'En modell med ett land och en distributör med den stödstruktur som krävs för att territoriet ska löna sig. Exklusivitet förtjänas och upprätthålls — den är inte en permanent rättighet.'
  columns: 3
  items:
    - title: 'Territoriell Exklusivitet'
      description: 'En auktoriserad distributör per land eller region. Ingen parallellimport, ingen intern konkurrens. Din investering bygger din egen vallgrav.'
      icon: 'tabler:shield-check'
    - title: 'Skydd mot Kanalkonflikter'
      description: 'Direkta beställningar från din region går via dig, och prissättningen skyddar din marginal. Afarer säljer inte förbi sina landpartners.'
      icon: 'tabler:users'

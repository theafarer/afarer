hero_text:
  tagline: Get a Quote
  title: Begär en offert<br />för ditt projekt
  subtitle: Berätta om dina krav så svarar vårt team med en detaljerad offert inom 2 arbetsdagar.
steps2_process:
  title: How It Works
  subtitle: Fyra enkla steg från förfrågan till offert.
  items:
    - title: 'Step 1: Submit Your Requirements'
      description: Fyll i formuläret nedan med din produkttyp, kvantitet och specifikationer. Ju mer detaljer du anger, desto mer exakt blir din offert.
      icon: tabler:file-text
    - title: 'Step 2: We Review & Advise'
      description: Vårt ingenjörsteam granskar dina krav och kan kontakta dig för klargöring. Vi ger rekommendationer om produktkonfiguration och alternativ.
      icon: tabler:users
    - title: 'Step 3: Receive Your Quote'
      description: Du får en detaljerad offert inklusive enhetspris, MOQ, ledtid, betalningsvillkor och fraktalternativ. Vanligtvis inom 48 timmar.
      icon: tabler:currency-dollar
    - title: 'Step 4: Sample & Production'
      description: Efter offertgodkännande går vi vidare till sampelproduktion (om tillämpligt) eller direkt till massproduktion. Regelbundna uppdateringar under hela processen.
      icon: tabler:building-factory
content_form:
  tagline: Quotation Form
  title: Berätta om ditt projekt
  subtitle: Alla fält med * är obligatoriska.
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Diving Center
        - Fishing
        - Marine Tourism / Resort
        - Search & Rescue
        - Yacht Tender
        - Commercial Workboat
        - Government / Military
        - OEM / Private Label
        - Personal / Recreational
        - Other
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      options:
        - No Preference
        - Marine-Grade PVC (1100 dtex)
        - Premium Hypalon / CSM
        - Fiberglass Hull
        - Aluminum Hull
    - name: Engine Requirement
      type: text
      placeholder: e.g. 60 HP outboard, no engine, twin 115 HP
    - name: Customization Required
      type: text
      placeholder: e.g. custom colors, branding/logo, packaging, special fittings
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      placeholder: Describe your application, technical specifications, or any special requirements —include reference drawings, specifications, or links if available
    - name: Upload Specification
      type: file
      placeholder: Upload your spec sheet, drawing, or reference document (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Upload your logo or artwork for custom branding (AI, EPS, PNG)
cta:
  title: Prefer to discuss by email?
  subtitle: Send your inquiry directly to our sales team and we will respond within 24 hours.
  actions:
    - variant: primary
      text: Email us directly
      href: /contact

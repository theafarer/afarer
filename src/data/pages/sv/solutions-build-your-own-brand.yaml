meta:
  title: Privatmärkt SUP-tillverkning | {SITE}
  description: Lansera ditt eget SUP-varumärke med Afarer. Från idé till marknad — komplett OEM/ODM-tjänst inklusive design, prototytillverkning, produktion och global logistik.
hero:
  tagline: Bygg ditt eget varumärke
  title: Lansera ditt eget<br />SUP-varumärke
  subtitle: Du har visionen. Vi har fabriken, expertisen och leveranskedjan. Tillsammans bygger vi ett varumärke som sticker ut.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Anpassad SUP-bräda med eget varumärke på vatten
process:
  title: Din varumärkesresa
  subtitle: Från idé till marknad i 5 faser.
  steps:
    - phase: Fas 1
      title: Idé
      period: Vecka 1–2
      items:
        - Marknadsanalys och konkurrentanalys
        - Mål­kund­definition
        - Varumärkespositioneringsworkshop
        - Produktlinjestrategi
    - phase: Fas 2
      title: Design
      period: Vecka 3-6
      items:
        - Brädehyda och grafisk design
        - Färgmatchning och materialval
        - Tillbehörsspecifikation
        - Förpacknings- och etikettformgivning
    - phase: Fas 3
      title: Prototyp
      period: Vecka 7–10
      items:
        - Provtilverkning
        - Kvalitetstester (tryck, flytkraft, UV)
        - Designjusteringar
        - Slutgodkännande
    - phase: Fas 4
      title: Produktion
      period: Vecka 11-14
      items:
        - Storskalig tillverkning
        - QC-inspektion (per enhet)
        - Sjöfrakt / luftfrakt
        - Tullklareringsdokument
    - phase: Fas 5
      title: Lansering
      period: Vecka 15–16
      items:
        - Produktfotografering
        - Webbplatsens produktflöde
        - Marknadsföringsmaterial
        - Lanseringsstöd
packages:
  title: Startpaket
  subtitle: Paket utformade för varje steg i varumärkets tillväxt.
  items:
    - name: Starter Brand
      tagline: 50–100 enheter · 2 brämodeller
      features:
        - Grundläggande logotryck
        - Standardförpackning
        - E-postsupport
    - name: Growing Brand
      tagline: 300–1 000 enheter · 3–5 bräd­modeller
      features:
        - Anpassad färg + logotyp
        - Anpassad förpackning
        - Produktbilder
        - Dedikerad kontoansvarig
    - name: Established Brand
      tagline: 1 000+ enheter · Fullständig produktsortiment
      features:
        - Fullständig anpassning
        - Premiumförpackning
        - Marknadsföringsmaterial
        - Prioriterad produktion

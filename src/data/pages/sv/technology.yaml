hero:
  tagline: Teknologi
  title: Vår teknologi
  subtitle: afarer-produkter är designade med avancerade material och innovativ ingenjörskonst för att leverera exceptionell prestanda, hållbarhet och portabilitet.
sections:
  - title: Drop-Stitch-kärna
    description: Tusentals interna polyestertrådar förbinder övre och undre lagret och skapar en styv struktur vid 12–15 PSI. Detta är samma teknik som används i professionella paddelbrädor och oppustbara racing SUP:er.
    imageAlt: DS-kärndiagram
  - title: Marinklass PVC
    description: Multilager laminert PVC-tyg för marina miljöer. Varje lager är svetsat snarare än limmat, vilket eliminerar risk för delaminering. Testat för UV-resistans, havsvattenkorrosion och slitage.
    imageAlt: PVC-lager
  - title: Militärklass PVC
    description: Används på alla SUP-modeller; premium-PVC ger överordnad UV- och kemisk resistans. Behåller flexibiliteten vid extrema temperaturer och motstår förstörelse.
    imageAlt: PVC
  - title: Air Deck-golv
    description: Högtrycksoppustbar drop-stitch-konstruktion som ger exceptionell styvhet för att stå, fiska och yoga. Minskar uppställningstid, totalvikt och förpackningsvolym.
    imageAlt: Air Deck

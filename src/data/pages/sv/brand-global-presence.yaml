meta:
  title: 'Global Närvaro — SUP-tillverkare som betjänar 50+ länder | {SITE}'
  description: 'afar exporterar uppblåsbara SUP:ar och båtar till över 50 länder på alla kontinenter. Professionell tillverkare och leverantör för varumärken, distributörer och flottor.'
  keywords:
    - 'global SUP-tillverkare'
    - 'paddle board exportör'
    - 'SUP-fabrik Kina'
    - 'professionell SUP-leverantör'
hero:
  tagline: Global närvaro
  title: Betjänar 50+ länder<br />över alla kontinenter
  subtitle: Från europeiska kustpatrulloperatörer till australiska vattensportdistributörer till Mellanösterns räddningsteam — afarer-båtar finns på vattnet över hela världen.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer global marin tillverkning och distribution
stats:
  title: Global räckvidd
  stats:
    - title: Länder
      amount: 50+
    - title: Exportmarknader
      amount: Europa, Amerika, Asien, Mellanöstern, Oceanien
    - title: Produktion
      amount: Qingdao, Kina
    - title: Lager i USA
      amount: Montclair, CA
features3_markets:
  tagline: Nyckelmarknader
  title: Regional expertis<br />för lokala krav
  subtitle: Vi förstår att olika marknader har olika regulatoriska krav, preferenser och användningsfall.
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa och Storbritannien
      description: CE-certifierade produkter som uppfyller EN ISO 6185-standarder. Stark efterfrågan på SUP, uppblåsbara båtar och SUP-brädor på EU-marknaderna. Brittiska distributörer uppskattar vår snabba handläggning.
      icon: tabler:map-pin
    - title: Nordamerika
      description: US Coast Guard godkänd tillverkning. US-lager i Montclair, CA för snabb leverans till västkusten. Växande efterfrågan på fiske- och räddningsbåtar och rekreations-SUP.
      icon: tabler:map-pin
    - title: Australien och Oceanien
      description: Stark marknad för SUP-båtar och uppblåsbara tendrar. Australiska distributörer värdesätter våra Hypalon-båtar för UV-beständighet i hårda solförhållanden. Snabb frakt från vår asiatiska anläggning.
      icon: tabler:map-pin
    - title: Mellanöstern
      description: Växande efterfrågan på patrull- och räddningsbåtar. Våra SUP med aluminiumskrov är populära hos kustbevakning och säkerhetsoperatörer. Anpassade konfigurationer för högtemperaturmiljöer.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distributionsnätverk
  title: Samarbetar med distributörer<br />världen över
  subtitle: Vi samarbetar med etablerade marina utrustningsdistributörer, vattensportvarumärken och statliga upphandlingsmyndigheter.
  isBeforeContent: false
  columns: 3
  items:
    - title: Co-brand-program
      description: Private label-tillverkning för globala vattensportmärken. Vi hanterar allt från design till produktion till drop-shipping.
      icon: tabler:building
    - title: Distributörsnätverk
      description: Auktoriserade distributörer i 20+ länder har lager och ger lokal support. Nya distributörsförfrågningar välkomnas.
      icon: tabler:users
    - title: Offentlig och institutionell
      description: Direkt leverans till kustbevakningar, sök- och räddningsorganisationer och militära upphandlingsprogram. Överensstämmelse med institutionella upphandlingskrav.
      icon: tabler:building-community
steps2_logistics:
  title: Global logistik & support
  subtitle: Från fabrik till destination — vi hanterar hela leveranskedjan.
  items:
    - title: Fraktalternativ
      description: Sjöfrakt (FOB Qingdao), flygfrakt för brådskande order och expressbud för prover och reservdelar.
      icon: tabler:truck-delivery
    - title: Lager i USA
      description: 'Lager i Montclair, CA för snabb leverans över hela Nordamerika. Västkusten: 2-3 dagar, Centrala: 3-4 dagar, Östkusten: 4-5 dagar.'
      icon: tabler:building-warehouse
    - title: Reservdelar
      description: Äkta afarer-reservdelar och förbrukningsartiklar finns i lager året runt. Vanliga delar skickas inom 24 timmar.
      icon: tabler:package
    - title: Teknisk support
      description: Direktlinje till vårt ingenjörsteam för tekniska frågor, reparationsråd och ombyggnadsstöd. Vi stödjer båtar vi byggde för 20 år sedan.
      icon: tabler:headset
cta:
  title: Vill du bli distributör?
  subtitle: Vi expanderar aktivt vårt distributionsnätverk. Kontakta vår exportavdelning för att diskutera partnerskapsmöjligheter.
  actions:
    - variant: primary
      text: Förfrågan om partnerskap
      href: /contact
    - text: Se vår produktpalett

hero_text:
  tagline: Resources
  title: 'Nedladdningscenter & Köpguider'
  subtitle: 'Få tillgång till produktkataloger, OEM-guider, köpchecklistor och teknisk dokumentation för att fatta välgrundade inköpsbeslut.'
features3_downloads:
  tagline: Downloads
  title: 'Produktdokumentation<br />& Köparresurser'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Komplett produktsortiment inklusive SUP-båtar, uppblåsbara båtar, SUP-brädor, kajaker och tillbehör. Specifikationer, konfigurationer och alternativ. PDF-format.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'Allt du behöver veta om OEM/ODM-partnerskap: processöversikt, minimiorderkvantiteter, anpassningsalternativ, kvalitetskontroll och frakt.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'Hur du väljer rätt SUP: skrovmaterial, slangmaterial, motorval, storleksöverväganden och konfigurationsalternativ för olika tillämpningar.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'Viktiga överväganden vid val av SUP-brädtillverkare: kvalitetsindikatorer, certifieringskrav, MOQ-överväganden och vad man ska leta efter vid en fabriksrevision.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC vs Hypalon: jämförelse av hållbarhet, UV-beständighet, livslängd, reparationsalternativ och kostnadsöverväganden för olika marina tillämpningar.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'Ladda ner vår produktbrief-mall. Fyll i dina krav och skicka tillbaka den till oss för en offert och genomförbarhetsbedömning inom samma vecka.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Vanliga frågor om våra produkter, tillverkningsprocess och partnerskapsmodell.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ varierar beroende på produktkategori. SUP-båtar börjar vanligtvis från 10 enheter per modell. SUP-brädor från 50 enheter. Kontakta vårt säljteam för produktspecifik MOQ-information.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Ja. afarer tillhandahåller sampelproduktion för utvärdering före massproduktion. Provkostnader är förhandlingsbara och krediteras ofta mot den första produktionsordern.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Standardvillkor är 30% deposition vid beställning, 70% före leverans. LC-villkor finns för kvalificerade kunder. Kontakta vår ekonomiavdelning för att diskutera arrangemang.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Typiska ledtider: SUP-båtar 30-45 dagar, SUP-brädor 20-30 dagar, uppblåsbara båtar 25-35 dagar. Anpassad utveckling lägger till 15-30 dagar för prototyper.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'CE-certifiering för EU-marknader, US Coast Guard godkänd tillverkning, ISO-kvalitetssystem, BSCI-efterlevnad och REACH-materialefterlevnad.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Ja. Vi tillhandahåller anpassad förpackning med din logotyp, färger och varumärkesidentitet. MOQ för anpassad förpackning beror på produktkategorin.'
      icon: tabler:color-swatch
cta:
  title: 'Behöver du hjälp att hitta rätt resurs?'
  subtitle: 'Kontakta vårt team för personlig vägledning om produktval, OEM-partnerskap eller tekniska specifikationer.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

hero:
  tagline: Laboratorium 05
  title: Prototypverkstad
  subtitle: Från CAD-modell till vattenklart bräde — byggt, utrustat och verifierat
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: afarers prototypverkstads brädtillverkning
intro: >-
  En CAD-modell, hur detaljerad den än är, kan inte avslöja hur ett bräde faktiskt hanteras förrän det möter vattnet. Därför är vår prototypverkstad designad för att omvandla teknikdata till ett fysiskt, vattenklart bräde så snabbt och exakt som möjligt. Varje ny Afarer-modell — och varje
  betydande specialbygge — passerar genom denna verkstad innan produktionsverktygen sätts in.
content_html: >
  <h2>Där design blir verklighet</h2>

  <p>Verkstaden är fullt utrustad för samtidig tillverkning av skrov, kanter och utrustning. Detta parallella arbetsflöde förkortar prototypledtiden till 8–12 veckor från teknisk frigivning, jämfört med branschnormen på 16–20 veckor. När din tillämpning kräver en specialiserad lösning kan vi
  gå från koncept till validering i vattnet på under tre månader.</p>


  <h2>Verkstadens kapacitet</h2>

  <table>
    <thead><tr><th>Arbetsstation</th><th>Utrustning</th><th>Ändamål</th></tr></thead>
    <tbody>
      <tr><td>Skrovtillverkning</td><td>CNC-tygskärare, värmelamineringspress, beredningsstation för drop-stitch-kärna</td><td>Fullskalig skrovproduktion i alla tre konstruktionstyperna</td></tr>
      <tr><td>Kant- &amp; kammarmontage</td><td>RF-svetspress, varmluftstackningsstation, uppblåsningstestjigg</td><td>Tillverkning av fullskaliga kant- och kammarmontage med alla skott och ventiler</td></tr>
      <tr><td>Utrustning &amp; montering</td><td>Jigg för fenboxfräsning, svetsfixturer för lastfästen och handtag, skärstation för däckdynor</td><td>Komplett utrustning: fenor, lastfästen, leashpluggar, handtag, däckdynor, ventiler</td></tr>
      <tr><td>Instrumentationsfack</td><td>GPS-hastighetssensor, tryckgivare, accelerometer, termokupplmatris, datainsamlare</td><td>Installation och kalibrering av instrumentering för havsprovning</td></tr>
    </tbody>
  </table>


  <h2>Prototypens resa — steg för steg</h2>

  <ol>
    <li><strong>Teknisk överlåtelse</strong> — Designpaketet (3D-modell, FEA-rapport, materiallista, lägningsschema) granskas formellt av verkstadschefen och projektteknikern. Eventuella tillverkningsproblem flaggas och löses innan skärningen påbörjas.</li>
    <li><strong>Skrovproduktion</strong> — Skrovet byggs enligt den tekniska specifikationen. För enkellagerskonstruktion: drop-stitch-kärnan lamineras med den specificerade PVC-huden. För dubbellagerskonstruktion: det ytterligare lagret appliceras över baslaminatet innan mönstret skärs. För fusionerad konstruktion: lamineringsparametrarna laddas från det godkända processbladet och verifieras på ett första provstycke.</li>
    <li><strong>Kanttillverkning</strong> — Tyg skärs med CNC-mönstermallar och svetsas sedan med RF till fullskaliga kanter och kammare. Varje kammare fylls med testtryck och lämnas i 24 timmar för initial stabilisering.</li>
    <li><strong>Montering &amp; utrustning</strong> — Skrov och kanter fogas samman. Fenboxar och lastfästen monteras, leashpluggar och bärhandtag installeras, uppblåsningsventilen dras åt och däckdynan appliceras och justeras in.</li>
    <li><strong>Statiska tester</strong> — Innan brädet vidrör vattnet genomgår det: flytkontroll (full last + 30 % reserv), tryckhållningstest av kammare, läcknedgångstest av ventil, dragtest av handtag och fästen.</li>
    <li><strong>Havsprövningsprogram</strong> — 20 timmars testning i vattnet, detaljerad nedan.</li>
    <li><strong>Prototypgranskning</strong> — Ett formellt godkännandemöte hålls med teknik-, produktions- och kvalitetsteamen. Eventuella nödvändiga designändringar dokumenteras och införlivas i produktionsfrigivningen.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-timmars havsprövningsprogram — Testschema</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 t</span>
        <span class="flex-1">Plattvattenvaning — kurs hållning vid låg hastighet, svängning, kontroll av ställning och trim</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 t</span>
        <span class="flex-1">Hastighetstest — GPS-verifierad toppfart, marschfart, uthålligt tempo vid 3 paddelfrekvenser</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 t</span>
        <span class="flex-1">Svängtest — radie för pivotsväng och svepsväng, brädans respons, babord och styrbord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 t</span>
        <span class="flex-1">Dyningstest — upprepade passager genom 0,5–1,0 m dyningar; accelerometer vid paddlarens ställningsposition</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 t</span>
        <span class="flex-1">Stabilitetstest — statisk krängningsvinkel med 4 paddlare med olika vikt, offsetlast mot styrbord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 t</span>
        <span class="flex-1">Uthållighetstest — 3 timmar kontinuerligt i marschtempo; övervakning av kammaretryck, kanttemperatur och paddlartrötthet</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 t</span>
        <span class="flex-1">Slutinspektion — efterprovinspektion av alla komponenter, åtdra/kontrollera alla befästningar, dokumentera resultat</span>
      </div>
    </div>
  </div>


  <h2>Anpassad prototyptillverkning för unika tillämpningar</h2>

  <p>Prototypverkstaden är där vi löser de problem som standardiserade produktionsbrädor inte kan hantera. Senaste exempel inkluderar:</p>

  <ul>
    <li>En räddnings-SUP med hög synlighet för en sök- och räddningsorganisation, som kräver integrerade grepphandtag, utrustningsfästen för räddningsutrustning och ett skrov med hög flytkraft för upptagning av personer — allt prototyptillverkat, utrustat och testat på vår anläggning.</li>
    <li>En expeditionstouring-SUP för en hydrografisk mätningsentreprenör, med avtagbar instrumentmast, förseglade utrustningsportar och en låg profiltransducerfästning designad för att minimera motstånd.</li>
    <li>En kompakt fiske-SUP för en resortflotta, där prototypen användes för att validera stabilitet, utrustningsriggning och hållbarhet under daglig uthyrningsanvändning innan kunden beställde en flotta på fyra.</li>
  </ul>


  <h2>Vårt prototypteam</h2>

  <p>Verkstaden bemannas av åtta flerfärdiga marintekniker, var och en utbildad i minst två av de tre kärndisciplinerna (skrov, kanter, utrustning). Teamledaren är en mästare inom tillverkning med 16 års erfarenhet som spänner från enstaka specialbyggen till serieproduktion. Varje prototyp tilldelas en
  dedikerad projekttekniker som fungerar som ensam kontaktpunkt för kunden under hela byggnads- och provningsprocessen.</p>


  <h2>Kundens medverkan</h2>

  <p>Vi uppmuntrar aktivt våra kunder att delta vid viktiga milstolpar under prototypbygget — särskilt den inledande utrustningsgranskningen och havsprovningen. Era operativa återkopplingar under dessa faser är ovärderliga för att finjustera brädet innan det går in i produktion. Vi bygger
  inte i ett vakuum; vi bygger i partnerskap med er.</p>

  <p>Den 20-timmars havsprovningen är också ett tillfälle för ert team att bekanta sig med brädans manövrerbarhet, däcklayout och underhållsbehov, vilket säkerställer en smidig övergång till drift när produktionsbrädorna levereras.</p>

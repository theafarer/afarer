home_label: Hem
hero:
  tagline: Laboratorium 05
  title: Prototypverkstad
  subtitle: Från CAD-modell till sjöklar båt — byggad, utrustad och verifierad
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: afarers prototypverkstads båttillverkning
intro: >-
  En CAD-modell, hur detaljerad den än är, kan inte avslöja hur en båt faktiskt hanteras förrän den möter vattnet. Därför är vår prototypverkstad designad för att omvandla teknikdata till ett fysiskt, sjödugligt fartyg så snabbt och exakt som möjligt. Varje ny Afarer-modell — och varje
  betydande specialbyggnad — passerar genom denna verkstad innan produktionsverktygen sätts in.
content_html: >
  <h2>Där design blir verklighet</h2>

  <p>Verkstaden är fullt utrustad för samtidig tillverkning av skrov, rör och utrustning. Detta parallella arbetsflöde förkortar prototypledtiden till 8–12 veckor från teknisk frigjäring, jämfört med branschnormen på 16–20 veckor. När din applikation kräver en specialiserad lösning kan vi gå från
  koncept till vattentestning på under tre månader.</p>


  <h2>Verkstadens kapacitet</h2>

  <table>
    <thead><tr><th>Arbetsstation</th><th>Utrustning</th><th>Ändamål</th></tr></thead>
    <tbody>
      <tr><td>Skrovtillverkning</td><td>Rotationsformningsugn (HDPE), TIG-svetsning (aluminium), handläggningsformar (glasfiber)</td><td>Skrovtillverkning i full skala i alla tre materialtyper</td></tr>
      <tr><td>Rörmontering</td><td>RF-svetspress, varmluftstackningsstation, uppblåsningstest FIXTUR</td><td>Tillverkning av fullskaliga rörmonteringar med alla bavta, koner och ventiler</td></tr>
      <tr><td>Utrustning &amp; montering</td><td>Motorlyft (500 kg), konsolmockup-ram, hydrauliskslangpressare, elektrisk kabelsnodd</td><td>Fullständig utrustning: motor, styrning, kontroller, bränslesystem, elektronik, sittplatser</td></tr>
      <tr><td>Instrumentationsfack</td><td>GPS-hastighetssensor, bränsleflödesmätare, accelerometer, termokupplmatris, datainsamlare</td><td>Installation och kalibrering av instrumentering för havsprövning</td></tr>
    </tbody>
  </table>


  <h2>Prototypens resa — steg för steg</h2>

  <ol>
    <li><strong>Teknisk överlåtelse</strong> — Designpaketet (3D-modell, FEA-rapport, materiallista, lägningsschema) granskas formellt av verkstadschefen och projektteknikern. Eventuella produktionsproblem flaggas och löses innan skärningen påbörjas.</li>
    <li><strong>Skrovtillverkning</strong> — Skrovet byggs enligt den tekniska specifikationen. För HDPE: rotationsformningsprogrammet laddas från Moldex3D-simuleringen. För aluminium: CNC-skurna plattor svetsas i TIG-båsen enligt den godkända svetsplanen. För glasfiber: fibringsboken följs lager för lager.</li>
    <li><strong>Rörtillverkning</strong> — Tyg skärs med CNC-mönstermallar och svetsas sedan till fullskaliga kammare. Varje kammare fylls med testtryck och lämnas i 24 timmar för initial stabilisering.</li>
    <li><strong>Montering &amp; utrustning</strong> — Skrov och rör fogas samman. Motorn hängs, styrning och kontroller ansluts, bränslesystemet installeras och alla elektriska kretsar kablas och verifieras.</li>
    <li><strong>Statiska tester</strong> — Innan båten vidrör vattnet genomgår den: flytkontroll (full last + 30 % reserv), bränslesystemets trycktest, styrsystemets fullslagstest, elektrisk jordkopplingskontinuitetstest.</li>
    <li><strong>Havsprövningsprogram</strong> — 20 timmars vattentestning, detaljerad nedan.</li>
    <li><strong>Prototypgranskning</strong> — Ett formellt godkännandemöte hålls med teknik, produktion och kvalitet. Eventuella nödvändiga designändringar dokumenteras och införlivas i produktionsfrigivningen.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20-timmars havsprövningsprogram — Testschema</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 t</span>
        <span class="flex-1">Hamnmanövrering — låghastighetsmanövrering, backning, fenderskontroll</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 t</span>
        <span class="flex-1">Hastighetstest — GPS-verifierad toppfart, marschfart, bränsleförbrukning vid 3 varvtalspunkter</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 t</span>
        <span class="flex-1">Svängtest — taktisk diameter, förflyttning och förskjutning vid 20 kn, babord och styrbord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 t</span>
        <span class="flex-1">Slamtningstest — upprepade passager genom 0,5–1,0 m vågor; accelerometer på styrsätesbas</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 t</span>
        <span class="flex-1">Stabilitetstest — statisk krängningsvinkel med 4 besättning + utrustning till styrbord, offsetlast</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 t</span>
        <span class="flex-1">Uthållighetstest — 3 timmar kontinuerligt vid marschfart; temperaturövervakning (motor, bränsle, elektrik)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 t</span>
        <span class="flex-1">Slutinspektion — postprovinspektion av alla system, åtdra/kontrollera alla befästningar, dokumentera resultat</span>
      </div>
    </div>
  </div>


  <h2>Anpassad prototytillverkning för unika tillämpningar</h2>

  <p>Prototypverkstaden är där vi löser de problem som standardiserade produktionsbåtar inte kan hantera. Exempel inkluderar:</p>

  <ul>
    <li>En 7,8 m RIB för en sök- och räddningsorganisation, som kräver en anpassad kabinkonstruktion med vältskydd, integrerade bårstöd och en förmonterad sonarkapsel — allt prototyptillverkat, monterat och testat på vår anläggning.</li>
    <li>En 5,2 m uppblåsbar båt för en hydrografisk mätningsentreprenör, med förkortad akter, avtagbar instrumentmast och genomgående transducerfickor för att minimera strömningsstörningar.</li>
    <li>En eldriven 4,5 m tender för en superyacht, där prototypen användes för att validera räckvidd, laddningsinfrastruktur och ljudnivåer innan kunden beställde en flotta på fyra.</li>
  </ul>


  <h2>Vårt prototypteam</h2>

  <p>Verkstaden bemannas av åtta flerfärdiga marintekniker, var och en utbildad i minst två av de tre kärndisciplinerna (skrov, rör, utrustning). Teamledaren är en masterbåtbyggare med 16 års erfarenhet som spänner från enstaka specialbyggen till serieproduktion. Varje prototyp tilldelas en
  dedikerad projekttekniker som fungerar som ensam kontaktpunkt för kunden under hela byggnads- och provningsprocessen.</p>


  <h2>Kundens medverkan</h2>

  <p>Vi uppmuntrar aktivt våra kunder att delta vid viktiga milstolpar under prototypbygget — särskilt den inledande utrustningsgranskningen och havsprövningen. Era operativa återkopplingar under dessa faser är oerhört värdefulla för att finjustera båten innan den går in i produktion. Vi bygger inte
  i ett vakuum; vi bygger i partnerskap med er.</p>

  <p>Den 20-timmars havsprövningen är också ett tillfälle för ert team att bekanta sig med båtens manövrerbarhet, systemlayout och underhållsbehov, vilket säkerställer en smidig övergång till drift när produktionsbåtarna levereras.</p>

intro: >-
  Skroget är ryggraden i varje RIB eller inflerbar båt. Det måste vara tillräckligt lätt för att plana effektivt, tillräckligt starkt för att absorbera stötlaster och dimensionsstabilt över ett brett temperaturintervall. Hos {SITE.name} kombinerar vår skrogverkstad avancerad CAD-modellering,
  elementmetodanalyse (FEA) och årtionden av praktisk marinarkitekturerfarenhet för att leverera skrog som är optimerade för sitt ändamål — inte generiska former anpassade från en katalog.
content_html: >
  <h2>Där styrka möter hydrodynamik</h2>

  <p>Vi arbetar med tre huvudsakliga skrovmaterial — roterande stöpgjuten HDPE, svetsad maringrad aluminium och handlagd glasfiber — och har teknisk förmåga att designa, simulera och validera var och en internt.</p>


  <h2>Designverktyg och standarder</h2>

  <p>Vår digitala engineeringmiljö omfattar:</p>

  <table>
    <thead><tr><th>Förmåga</th><th>Mjukvara / Verktyg</th><th>Tillämpning</th></tr></thead>
    <tbody>
      <tr><td>3D-parametrisk modellering</td><td>SolidWorks Professional</td><td>Skrovyta, strängsystem, motorbeslag, däcksplanering</td></tr>
      <tr><td>Elementmetodanalys</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Spanningskartering, modal analys, krock/impulssimulering</td></tr>
      <tr><td>Beräkningsbaserad strömningsmekanik</td><td>Ansys Fluent / Star-CCM+</td><td>Hydrodynamisk dragningsförutsägelse, trimmoptimering</td></tr>
      <tr><td>Laminatkonstruktion</td><td>ESAComp / CADEC</td><td>Glasfiberlagerstapling, kärnval, viktestimation</td></tr>
      <tr><td>Formflödessimulering</td><td>Moldex3D</td><td>Rotgjutning vägg-tjockleksförutsägelse</td></tr>
    </tbody>
  </table>


  <h2>Vår engineeringprocess</h2>

  <p>Varje skrovdesign, oavsett om det är en standardmodell eller ett helt anpassat projekt, följer en sträng femstegsprocess:</p>

  <ol>
    <li><strong>Koncept &amp; kravinsamling</strong> — Vi möter er för att definiera last, hastighetsintervall, havstillståndskapacitet, bogseringskrav och eventuellt specialutrustning för uppdrag (däcksluckor, konsolpositioner, bränsletankintegration).</li>
    <li><strong>3D-ytmodellering &amp; hydrostatisk beräkning</strong> — Skrovet formges i SolidWorks och kontrolleras för hydrostatisk stabilitet (GM, rättningsarm) med inbyggda analysverktyg.</li>
    <li><strong>Strukturell FEA</strong> — Lastfall definieras: statiskt (besättning + utrustning), dynamiskt (planerande slag vid 5g) och slagsmot (fallande från vågkam vid 3 m/s). Spanningskonturer granskas; säkerhetsfaktor ≥ 2,5 är obligatorisk.</li>
    <li><strong>CFD-dragningsoptimering</strong> — Skrovet simuleras vid tre lasttillstånd och fem hastigheter. Fuktad yta, trimvinkel och restmotstånd minskas iterativt.</li>
    <li><strong>Designgranskning &amp; frigivning</strong> — Den kompletta engineeringpaketet (3D-modell, FEA-rapport, CFD-rapport, viktestimation, lagerbok) granskas av vår seniora skeppsarkitekt innan frigivning till prototypverkstaden.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA-spanningsfördelning — RIB 450 Patrullskrov (Aluminium 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2,8 : 1</span>
        <span class="text-gray-500">Säkerhetsfaktor vid maxlast</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15,2 %</span>
        <span class="text-gray-500">Dragminskning jämfört med föregående generation</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m2</span>
        <span class="text-gray-500">Maximal slagsmotstryck (desigongränsvärde)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Ackumulerad FEA-körtid 2025</span>
      </div>
    </div>
  </div>


  <h2>Anpassning: er skrov, era regler</h2>

  <p>Inga två operatörer har identiska krav. En hamnpatrullerande RIB behöver ett grunt V-skrov för stabilitet vid låg hastighet; en snabbinterceptionsfarkost behöver ett djupt V med spröjslinjer; en dykarstödsbåt behöver en bred bredd och en låg akterstäv. Vi tvingar inte er applikation i en
  förutbestämd skrovform. Vi designar utifrån era specifikationer.</p>

  <p>Exempel på senaste anpassade skrovengineeringprojekt:</p>

  <ul>
    <li>Ett förlängt 6,8 m HDPE-skrov för en karibisk tour-operatör, med förstärkt bog för strändlandningar (+15 % botten-tjocklek).</li>
    <li>En lättviktig aluminium 7,2 m RIB för en kustbevakning, med integrerade bränsletanksväggar och utrustningslådesstegringar.</li>
    <li>En glasfiber 5,5 m dykbåt med nedskuren akterstäv och dubbla batterilådor, designad för enkel ombordtagning av snorklare.</li>
  </ul>


  <h2>Våra ingenjörer</h2>

  <p>Studion leds av en senior skeppsarkitekt med 14 års erfarenhet av höghastighetsfarkostdesign, understödd av två mekaniska ingenjörer specialiserade på FEA och CFD. Alla tre har avancerade examen i marin teknik eller skeppsarkitektur från internationellt erkända universitet. Teamet publicerar
  regelbundet i branschtidskrift och presenterar på konferenser som International Conference on High-Performance Marine Vehicles.</p>


  <h2>Samarbeta med oss om ert nästa skrov</h2>

  <p>Från den första konceptskissen till den slutliga spänningsrapporten är vår Skrovengineeringstudio er partner i att skapa en båt som inte bara är byggd — utan engineerad. Vi investerar simuleringstimmar i förväg så att varje svets, varje laminatlager och varje kurva på skrovet finns där av en
  anledning.</p>

  <p>Oavsett om ni behöver en mindre modification av en befintlig modell eller en helt ny design, är vi redo att diskutera era behov.</p>

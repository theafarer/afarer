hero:
  tagline: Fabrik
  title: Fabrik och produktion
  subtitle: 12 000 m² integrerad produktion —från råmaterial till färdig båt
intro:
  - Som ett fabriksmärke under **Qingdao Vatrad Group Co., Ltd.** kontrollerar afarer varje steg i produktionen —från mottagning av rå PVC- och glasfibermaterial till slutkontroll före frakt av färdig båt. Vår produktionsanläggning i Qingdao Economic Development Zone täcker 12 000 kvadratmeter och rymmer dedikerade verkstäder för PVC-skärning, rörsvetsning, glasfiber-SUP-skrovtillverkning, digitalt SUP-tryck, slutmontering och kvalitetstestning.
  - Genom att integrera design, ingenjörskonst, prototyptillverkning, produktion och testning under ett tak eliminerar vi ineffektiviteten i kontraktstillverkning och upprätthåller direkt kontroll över utförandekvalitet, materialval och leveranstider. Varje båt som lämnar vår verkstad är byggd av våra människor, på vår utrustning, enligt våra standarder.

qc_section:
  tagline: Kvalitetskontroll
  title: Testning och kvalitetssäkringsprocess
  subtitle: Varje båt genomgår obligatoriska tester före frakt. Vårt kvalitetslaboratorium arbetar oberoende av produktionen och rapporterar direkt till ledningen.
  steps:
    - step: '1'
      title: Inspektion av råmaterial
      desc: PVC-, Hypalon- och drop-stitch-tyger genomgår draghållfasthetstestning, rivspridningstest och UV-beständighetsverifiering innan någon batch släpps till produktion.
    - step: '2'
      title: 48-timmars lufttäthetstest
      desc: Varje rörkammare blåses upp till 125 % av nominellt tryck och hålls i 48 timmar. Tryckfall under 5 % leder till automatisk underkännande och fönyad söminspektion.
    - step: '3'
      title: Belastnings- och balanstest
      desc: Färdiga båtar belastas till maximal kapacitet och testas för stabilitet, fribord och manövrering. Varje enhet testas på vatten före slutinspektion.
oem_section:
  tagline: OEM-projekt
  title: Varumärkes- och OEM-partnerskapsfallstudier
  subtitle: Från koncept till container —hur vi hjälper globala varumärken att lansera och skala upp linjer med uppblåsbara båtar.
  cases:
    - challenge: En europeisk utomhusåterförsäljare behövde en private label SUP-linje med unik däckgrafik, miljövänlig PVC och detaljhandelsfärdig förpackning —allt levererat på 60 dagar.
      solution: Vi utvecklade anpassade digitaltrycksfiler, anskaffade REACH-kompatibel PVC och komprimerade provtagningen från 3 omgångar till 1 genom att placera designteamet på vår fabrik i Qingdao.
      result: 55 dagar från PO till FOB. 2 400 enheter i 4 SKU. Återbeställning lades innan första containern anlände.
    - challenge: En amerikansk vattenstartup behövde en högpresterande drop-stitch-kajak med anpassad skrovform, gemensam varumärkesförpackning och BSCI-certifiering för detaljhandelsplacering.
      solution: Vi anpassade en befintlig drop-stitch-kajakform med modifierad rockerprofil, utvecklade gemensam varumärkesförpackning och levererade fullständig BSCI-revisionsdokumentation.
      result: Framgångsrikt lanserad i 3 stora amerikanska utomhuskedjor. Över 5 000 enheter första året med 98 % försäljningsgrad.
    - challenge: En australisk distributör behövde en CE-certifierad SUP-serie med anpassade rörfärger, alternativ för uppgradering till Hypalon och överensstämmelse med australisk standard AS 1799.
      solution: Vi tillverkade förproduktionsprover med 4 rörfärgsvarianter, anskaffade CSM Hypalon från japansk leverantör och samordnade tredjeparts AS 1799-efterlevnadstester.
      result: Serie med 3 SUP-modeller lanserad på AU/NZ-marknaden. Därefter vunnen statlig upphandling för 12 patrull-SUP:ar.
faq_section:
  tagline: Vanliga frågor
  title: Vanliga B2B- och OEM-frågor
  questions:
    - q: Vad är minsta beställningskvantitet (MOQ) för OEM av uppblåsbara SUP-brädor?
      a: MOQ börjar från 5–10 enheter för standard OEM-modeller. Anpassade formar och private label-projekt kräver minimum 200 enheter, beroende på komplexitet. Provbeställningar och testserier finns tillgängliga för nya varumärken.
    - q: Är afarer BSCI-certifierat?
      a: Ja. Vår fabrik har ett giltigt BSCI-intyg om social regelefterlevnad (revisionsrapport tillgänglig på begäran). Vi är även certifierade för kvalitetsledning, och alla produkter är CE-certifierade. REACH- och RoHS-efterlevnadsdokumentation medföljer varje OEM-leverans.
    - q: Vad är typisk ledtid för en OEM-beställning?
      a: Ja. Vår fabrik har ett giltigt BSCI-intyg om social regelefterlevnad (revisionsrapport tillgänglig på begäran). Vi är även certifierade för kvalitetsledning, och alla produkter är CE-certifierade. REACH- och RoHS-efterlevnadsdokumentation medföljer varje OEM-leverans.
    - q: Kan ni skicka FOB Qingdao eller CIF till vår hamn?
      a: Ja. Vi skickar FOB Qingdao, CIF till större världshamnar och DDP för kvalificerade partners. Vårt logistikteam hanterar containerbokning, exportdokumentation och tullklarering. Vi skeppar till över 50 länder på EU-, USA-, AU- och Asienmarknaderna.
b2b_moq: 'Standard MOQ: 5–10 enheter per modell (SUP/kajak/drop-stitch). SUP MOQ: 2–5 enheter. Provbeställningar välkomna för nya partnerskap.'
production_flow:
  tagline: Produktionsflöde
  title: Från råvara till färdig båt
  subtitle: Varje båt genomgår sex produktions­steg med QC-kontroll­punkter vid varje steg. Inga genvägar, inga överhoppade inspektioner.
  stages:
    - stage: '01'
      title: Materialmottagning och inkommande kvalitetskontroll
      description: Alla inkommande material loggas efter parti/lottnummer i vårt ERP-system. PVC-filmrullar, drop-stitch-kärnor, ventiler, lim och hårdvarukomponenter sätts i karantän tills QC har godkänt dem.
      qc_check: Draghållfasthet (ASTM D751), rivhållfasthet (ISO 4674), tjockleksmätning, limviskositet, visuell defektskanning
      qc_threshold: 100 % av partierna provas. Avvisning vid dragfasthet < 90 % av specifikation, rivning < specifikationens minimum, eller synliga defekter
      responsibility: Mottagnings-QC-team (3 inspektörer)
    - stage: '02'
      title: CNC-skärning och materialberedning
      description: Datoroptimerad läggning placerar paneler på PVC-lager för att minimera spill. Automatiska CNC-skärningsmaskiner håller 0,1 mm positionsg precision.
      qc_check: Dimensionell kontroll mot CAD DXF-filer, kantkvalitetsinspektion, panelantalverifiering
      qc_threshold: Varje 20:de panel mäts. Tolerans ±0,5 mm. Avvisa parti om >2% utanför tolerans
      responsibility: Ledare för skärverkstaden
    - stage: '03'
      title: Svetsning och drop-stitch-bondning
      description: Drop-stitch-kärnor bind­samman med yttre PVC-laminat genom värmelaminering. Rör­kamrar RF-svetsas eller hetluftsvetsas. Railband fusion­lamineras i tre lager.
      qc_check: Skaltest var 50:e enhet (ASTM D751), svejsbreddsmätning, granskning av varmluftstemperaturlogg, visuell söminspektion mot bakgrundsljus
      qc_threshold: Draghäftning min. 8 N/cm. Svetsbreddstolerans ±1 mm. Synlig kanalbildning = avvisning
      responsibility: Svetsningskontroll (2 inspektörer per skift)
    - stage: '04'
      title: Montering och utrustning
      description: 'Båtarna flyttas till slutmontering där alla komponenter monteras ihop: skrov + rör, ventiler installeras, D-ringar, handtag, fenlädor och bärväska. Varje enhet följer en 100-punkts monteringschecklista.'
      qc_check: Godkännande av 100-punkters checklista per enhet, ventilverkningstest (10 öppnings/stängningscykler), hårdvarumomentverifiering, visuell inspektion
      qc_threshold: 'Nollfel-policy för säkerhetskritiska komponenter (ventiler, D-ringar, handtag). Mindre kosmetiska fel: AQL 2,5 (ISO 2859)'
      responsibility: Montageteamledare + linje-QC
    - stage: '05'
      title: Tryckprovning och kvalitetshållning
      description: Varje kammare fylls till 1,25× märkt tryck (vanligen 20–25 PSI) och hålls i 24–48 timmar. Trycksensorer loggar kontinuerligt. Kammare som överskrider 5 % tryckfall avvisas och skickas för sömombesiktning.
      qc_check: 24-timmars tryckhållningslogg, sensorkalibrering verifieras dagligen, temperaturkompenserad tryckavläsning, sömtester efter reparation
      qc_threshold: Max. 5 % tryckfall över 24 h vid stabil temperatur. Varje kammar som över­skrider detta = 100 % omprovning av hela produktions­partiet.
      responsibility: Kvalitetslaboratorium (oberoende av produktion, rapporterar till ledningen)
    - stage: '06'
      title: Slutkontroll och förpackning
      description: Slutlig visuell och funktionell kontroll. Ytdefekter, färgkonsekvens, etikett-/BIN-verifiering, förpackningsintegritet och tillbehörsfullständighet. Enheter vakuumpackas, låd-packas och palles för containertilladdning.
      qc_check: Fullständig visuell inspektion, tillbehörschecklista per SKU, packningsdropptest (1 m, slumpmässigt urval), märkning/streckkodsscanningsverifiering
      qc_threshold: AQL 2,5 för allvarliga defekter, AQL 4,0 för mindre allvarliga. Nolltolerans på säkerhetsdefekter. 100 % av enheterna visuellt inspekterade
      responsibility: Slutlig QC-grupp (4 inspektörer) + packningsgruppsledare

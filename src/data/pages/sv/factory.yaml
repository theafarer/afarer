material_traceability:
  tagline: Spårbarhet
  title: Materialspårning och partikontroll
  description: Varje råvaruparti tilldelas ett unikt partinummer i vårt ERP-system. Från ankomst genom produktion till färdig produkt kopplas varje båts materialfaktura tillbaka till ursprungliga leverantörspartiet. Detta möjliggör fullständig spårbarhet uppströms för alla kvalitets- och efterlevnadsfrågor.
  system: Anpassat ERP-system (Qingdao Vatrad Groups internt system) + fysiska parti­etiketter på varje arbetsorder
  coverage: 100 % av produktionsmaterialen — PVC, Hypalon, drop-stitch-tyg, lim, ventiler, beslag, förpackning
  records_retained: 10 år (enligt CE 2013/53/EU)
  suppliers:
    - material: Marin PVC
      source: Kinesiska och koreanska leverantörer
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japansk leverantör
      certified: ISO 9001, REACH
    - material: Drop-stitch-väv
      source: Internt vävning + extern partner
      certified: Intern QC + leverantörs-ISO 9001
    - material: Ventiler och hårdvara
      source: Kinesiska OEM-leverantörer
      certified: ISO 9001, materialcertifikat per parti

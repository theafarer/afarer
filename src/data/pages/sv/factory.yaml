qc_section:
  tagline: Kvalitetskontroll
  title: Testning och kvalitetssäkringsprocess
  subtitle: Varje båt genomgår obligatoriska tester före frakt. Vårt kvalitetslaboratorium arbetar oberoende av produktionen och rapporterar direkt till ledningen.
  steps:
    - step: "1"
      title: Inspektion av råmaterial
      desc: PVC-, Hypalon- och drop-stitch-tyger genomgår draghållfasthetstestning, rivspridningstest och UV-beständighetsverifiering innan någon batch släpps till produktion.
    - step: "2"
      title: 48-timmars lufttäthetstest
      desc: Varje rörkammare blåses upp till 125 % av nominellt tryck och hålls i 48 timmar. Tryckfall under 5 % leder till automatisk underkännande och fönyad söminspektion.
    - step: "3"
      title: Belastnings- och balanstest
      desc: Färdiga båtar belastas till maximal kapacitet och testas för stabilitet, fribord och manövrering. Varje enhet testas på vatten före slutinspektion.
oem_section:
  tagline: OEM-projekt
  title: Varumärkes- och OEM-partnerskapsfallstudier
  subtitle: Från koncept till container —hur vi hjälper globala varumärken att lansera och skala upp linjer med uppblåsbara båtar.
  cases:
    - challenge: En europeisk utomhusåterförsäljare behövde en private label SUP-linje med unik däckgrafik, miljövänlig PVC och detaljhandelsfärdig förpackning —allt levererat på 60 dagar.
      solution: Vi utvecklade anpassade digitaltrycksfiler, anskaffade REACH-kompatibel PVC och komprimerade provtagningen från 3 omgångar till 1 genom att placera designteamet på vår fabrik i Qingdao.
      result: 55 dagar från PO till FOB. 2 400 enheter i 4 SKU. Återbeställning lades innan första containern anlände.
    - challenge: En amerikansk vattenstartup behövde en högpresterande drop-stitch-kajak med anpassad skrovform, gemensam varumärkesförpackning och BSCI-certifiering för detaljhandelsplacering.
      solution: Vi anpassade en befintlig drop-stitch-kajakform med modifierad rockerprofil, utvecklade gemensam varumärkesförpackning och levererade fullständig BSCI-revisionsdokumentation.
      result: Framgångsrikt lanserad i 3 stora amerikanska utomhuskedjor. Över 5 000 enheter första året med 98 % försäljningsgrad.
    - challenge: En australisk distributör behövde en CE-certifierad SUP-serie med anpassade rörfärger, alternativ för uppgradering till Hypalon och överensstämmelse med australisk standard AS 1799.
      solution: Vi tillverkade förproduktionsprover med 4 rörfärgsvarianter, anskaffade CSM Hypalon från japansk leverantör och samordnade tredjeparts AS 1799-efterlevnadstester.
      result: Serie med 3 SUP-modeller lanserad på AU/NZ-marknaden. Därefter vunnen statlig upphandling för 12 patrull-SUP:ar.
faq_section:
  tagline: FAQ
  title: Vanliga B2B- och OEM-frågor
  questions:
    - q: Vad är minsta beställningskvantitet (MOQ) för OEM av uppblåsbara SUP-brädor?
      a: MOQ börjar från 5—0 enheter för standard OEM-modeller. Anpassade formar och private label-projekt kräver minimum 200 enheter, beroende på komplexitet. Provbeställningar och testserier finns tillgängliga för nya varumärken.
    - q: Är afarer BSCI-certifierat?
      a: Ja. Vår fabrik har ett giltigt BSCI-intyg om social regelefterlevnad (revisionsrapport tillgänglig på begäran). Vi är även certifierade för kvalitetsledning, och alla produkter är CE-certifierade. REACH- och RoHS-efterlevnadsdokumentation medföljer varje OEM-leverans.
    - q: Vad är typisk ledtid för en OEM-beställning?
      a: Ja. Vår fabrik har ett giltigt BSCI-intyg om social regelefterlevnad (revisionsrapport tillgänglig på begäran). Vi är även certifierade för kvalitetsledning, och alla produkter är CE-certifierade. REACH- och RoHS-efterlevnadsdokumentation medföljer varje OEM-leverans.
    - q: Kan ni skicka FOB Qingdao eller CIF till vår hamn?
      a: Ja. Vi skickar FOB Qingdao, CIF till större världshamnar och DDP för kvalificerade partners. Vårt logistikteam hanterar containerbokning, exportdokumentation och tullklarering. Vi skeppar till över 50 länder på EU-, USA-, AU- och Asienmarknaderna.
b2b_moq: "Standard MOQ: 5—0 enheter per modell (SUP/kajak/drop-stitch). SUP MOQ: 2— enheter. Provbeställningar välkomna för nya partnerskap."
production_flow:
  tagline: Production Flow
  title: From Material to Finished Boat
  subtitle: Every boat passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: "01"
      title: Material Receiving & Incoming QC
      description: All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.
      qc_check: Tensile strength (ASTM D751), tear resistance (ISO 4674), thickness gauge, adhesive viscosity, visual defect scan
      qc_threshold: 100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect
      responsibility: Incoming QC team (3 inspectors)
    - stage: "02"
      title: CNC Cutting & Material Prep
      description: Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.
      qc_check: Dimensional check against CAD DXF files, edge quality inspection, panel count verification
      qc_threshold: Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance
      responsibility: Cutting workshop lead
    - stage: "03"
      title: Welding & Drop-Stitch Bonding
      description: Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.
      qc_check: Peel test every 50 units (ASTM D751), weld width measurement, hot-air temperature log review, visual seam inspection under backlight
      qc_threshold: Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject
      responsibility: Welding QC (2 inspectors per shift)
    - stage: "04"
      title: Assembly & Rigging
      description: "Boats move to final assembly where all components are mated: hull + tubes, valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist."
      qc_check: 100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection
      qc_threshold: "Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)"
      responsibility: Assembly team lead + line QC
    - stage: "05"
      title: Pressure Testing & Quality Hold
      description: Every chamber is inflated to 1.25× rated pressure (typically 20—5 PSI) and held for 24—8 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.
      qc_check: 24h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair
      qc_threshold: Max 5% pressure drop over 24h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch
      responsibility: Quality lab (independent of production, reports to management)
    - stage: "06"
      title: Final Inspection & Packing
      description: Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.
      qc_check: Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification
      qc_threshold: AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected
      responsibility: Final QC team (4 inspectors) + Packing team lead

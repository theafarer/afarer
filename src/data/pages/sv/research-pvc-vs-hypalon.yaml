  tagline: Material
  title: PVC mot Hypalon — teknisk jämförelse för oppustliga båtar
  subtitle: 10 minuters läsning
content_html: >
  <h2>Materialöversikt</h2>


  <h3>PVC (polyvinylklorid)</h3>

  <p>PVC är en termoplastisk polymer som används i vidsträckt omfattning vid tillverkning av oppustliga båtar. För marinapplikationer förstärks det vanligen med en polyesterskärm (1 100–1 680 DTEX) och belägs på båda sidor. Moderna marina PVC-formuleringar innehåller UV-stabiliseringsmedel och
  mjukgörare för att förbättra flexibiliteten och väderbeständigheten.</p>


  <h3>Hypalon (CSM – klorosulfonerad polyeten)</h3>

  <p>Hypalon är en syntetiskgummi-blandning (nu allmänt producerad som CSM efter att DuPont lade ner Hypalon-trademarken). Det är känt för exceptionell UV- och ozonresistans, vilket gör det till det föredragna materialet för professionella och militärklassade oppustliga båtar som tillbringar länga
  perioder i direkt solsken.</p>


  <h2>Jämförelse sida vid sida</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Egenskap</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">PVC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Hypalon (CSM)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">UV-resistans</td><td class="p-3 border">Bra (med stabiliseringsmedel)</td><td class="p-3 border">Utmärkt (inherent)</td></tr>
      <tr><td class="p-3 border font-medium">Slitstyrka</td><td class="p-3 border">Bra</td><td class="p-3 border">Mycket bra</td></tr>
      <tr><td class="p-3 border font-medium">Draghållfasthet</td><td class="p-3 border">3 000–5 000 N/5 cm</td><td class="p-3 border">2 500–4 000 N/5 cm</td></tr>
      <tr><td class="p-3 border font-medium">Vikt (per m&sup2;)</td><td class="p-3 border">850–1 200 g</td><td class="p-3 border">1 100–1 500 g</td></tr>
      <tr><td class="p-3 border font-medium">Kylflexibilitet (låg temp.)</td><td class="p-3 border">-30&deg;C</td><td class="p-3 border">-20&deg;C</td></tr>
      <tr><td class="p-3 border font-medium">Reparerbarhet</td><td class="p-3 border">Lätt (värmsvetsning eller lim)</td><td class="p-3 border">Kräver speciellt CSM-lim</td></tr>
      <tr><td class="p-3 border font-medium">Fogningsmetod</td><td class="p-3 border">RF-svetsning, hetluftssvetsning</td><td class="p-3 border">Handlimning (kontaktcement)</td></tr>
      <tr><td class="p-3 border font-medium">Kostnad (material)</td><td class="p-3 border">$8–$15 / m&sup2;</td><td class="p-3 border">$20–$40 / m&sup2;</td></tr>
      <tr><td class="p-3 border font-medium">Livslängd (tropisk sol)</td><td class="p-3 border">5–8 år</td><td class="p-3 border">10–15 år</td></tr>
    </tbody>
  </table>


  <h2>Vilket bör ni välja?</h2>


  <h3>Välj PVC när:</h3>

  <ul>
    <li>Budgeten är en huvudsaklig bekymmer</li>
    <li>Båten kommer att lagras borta från direkt solsken</li>
    <li>Vikten spelar roll (PVC är 15–25 % lättare)</li>
    <li>Ni behöver flexibilitet vid kyliga väderförhållanden under -20&deg;C</li>
    <li>Ni vill ha ett bredare utbud av färgalternativ</li>
  </ul>


  <h3>Välj Hypalon när:</h3>

  <ul>
    <li>Båten kommer att förtöjas eller lagras i direkt solsken</li>
    <li>Ni befinner er i en tropisk eller hög-UV-miljö</li>
    <li>Maximal hållbarhet och livslängd är prioriteten</li>
    <li>Ni utrustar professionella eller kommersiella flottor</li>
    <li>Slitage från sand, betong eller bryggor är en bekymmer</li>
  </ul>


  <h2>Skillnader i tillverkning</h2>

  <p>PVC-båtar tillverkas med RF-svetsning (radiofrekvens) eller hetluftssvetsning, vilket skapar en molekylärbindning mellan de belagda tyglagren. Detta möjliggör automatiserad, konsekvent produktion med hög genomströmning. Hypalon-båtar monteras med handlimning och kontaktcement. Varje söm rullas
  och pressas manuellt, vilket gör Hypalon-produktionen mer arbetsintensiv.</p>


  <h2>Afarers rekommendation</h2>

  <p>För de flesta fritidsanvändare ger modern högkvalitets PVC med UV-stabiliseringsmedel den bästa balansen mellan kostnad, vikt, prestanda och hållbarhet. Afarer använder 1 680 DTEX marint PVC med trelagerbeläggning för sina konsument- och OEM-produktlinjer. För kommersiella och offentliga kunder
  som kräver längvarig UV-exponering erbjuder vi Hypalon-tillverkning på begäran.</p>

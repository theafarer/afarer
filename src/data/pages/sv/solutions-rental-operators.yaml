meta:
  title: SUP-lösningar för uthyrningsflottor | {SITE}
  description: Högroterande SUP-brädor konstruerade för daglig uthyrning. UV-resistent PVC, förstärkta sömmar, snabbtorkande material. Skala din uthyrningsverksamhet med Afarer.
hero:
  tagline: Uthyrningsoperatörer
  title: Skala din uthyrningsverksamhet<br />med förtroende
  subtitle: Högvolym-SUP-bräder konstruerade för daglig uthyrning, 365 dagar om året. Din intäkt tar aldrig en ledig dag.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Trängsel vid uthyrningskiosken med SUP-brädor redo för gäster
features:
  title: Byggd för daglig uthyrningsbruk
  subtitle: Varje bräda är konstruerad för 500+ uthyrningscykler med minimalt underhåll.
  items:
    - title: 500+ uthyrningscykler
      description: Testad för att klara dagligt bruk i saltvatten, sol och sand.
      icon: tabler:shield-check
    - title: UV-beständig väv
      description: Ingen blekning eller försämring efter 1 års utomhuslagring.
      icon: tabler:sun
    - title: Förstärkta sömmar
      description: Tre gånger starkare än standardkonstruktion för uppblåsbara brädor.
      icon: tabler:layers-intersect
    - title: Snabbtorkande material
      description: Brädor redo för nästa uthyrning på under 30 minuter.
      icon: tabler:droplet
    - title: Staplingsbar förvaring
      description: Platssparande design — förvara 40 % fler bräder i samma yta.
      icon: tabler:stack
    - title: Färgkodade storlekar
      description: Personalen väljer rätt bräda omedelbart med färgkodad storleksindelning.
      icon: tabler:color-swatch

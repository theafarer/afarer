meta:
  title: Resort SUP-flottlösningar | {SITE}
  description: Kompletta SUP-flottelösningar för resorter och hotell. Kommersiella brädor, anpassad märkning, personalutbildning och ROI-optimerade paket från 20 till 100+ brädor.
hero:
  tagline: Resorts och hotell
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Resortgäster som njuter av SUP-på en orörd strand
roi_section:
  title: Resortens SUP-intäktsmodell
  subtitle: Hur resorts generar $50 000–$200 000+ årlig SUP-uthyrningsinkomst med en enda investering.
  metrics:
    - metric: $50K–$200K+
      label: Årlig SUP-intäkt
      detail: Per resort, baserat på flottans storlek och beläggning
    - metric: 4–6 månader
      label: Genomsnittlig återbetalningstid
      detail: Återhämta hela flottinvesteringen inom en säsong
    - metric: 40%
      label: Intäktsökning
      detail: Genomsnittlig förbättring efter byte till Afarer-flottor
    - metric: 500+
      label: Uthyrningscykler per bräda
      detail: Kommersiell hållbarhet för dagligt bruk
packages:
  title: Resortpaketssystem
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - 12 månaders garanti + CE-certifierad
      revenue: $50K–$80K potentiell årlig intäkt
      cta_text: Skaffa startpaket
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 50 paddlar + 50 livsvästar
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - Personalutbildning (online)
        - 12 månaders garanti + CE-certifierad
      revenue: $120 000–$200 000+ i årlig intäktspotential
      popular: true
      cta_text: Skaffa premium-paket
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - Dedikerad kontoansvarig
        - Prioriterade reservdelar (24 h expediering)
        - Custom branding + logo
        - Marknadsfoto- och videopaket
        - 24 månaders garanti + CE-certifierad
      revenue: $200K+ potentiell årsintäkt
      cta_text: Skaffa Flaggskeppspaket
case_study:
  quote: Sedan vi bytte till Afarer har vår SUP-uthyrningsintäkt ökat med 40 %. Kostnaderna för bräduppsättning minskade med 60 %. Vi återfick hela flottinvesteringen på 4 månader.
  author: Vattenaktivitetsansvarig
  location: 5-stjärnig resort, Maldiverna
  results:
    - label: Intäktsökning
      value: +40 %
    - label: Kostnadssänkning
      value: '-60 %'
    - label: Återbetalningstid
      value: 4 månader
features:
  title: Varför resorter väljer Afarer
  subtitle: Kommersiell hållbarhet, global logistik och en partner som förstår hotellbranschen.
  items:
    - title: 500+ uthyrningscykler
      description: Varje bräda testas för att klara 500+ uthyrningscykler i havsvatten, sol och sand.
      icon: tabler:shield-check
    - title: 48 timmars delarutskick
      description: Reservedelsfrakt inom 48 timmar — din uthyrningsinkomst stoppas aldrig.
      icon: tabler:truck-delivery
    - title: Anpassat varumärke
      description: Anpassa ditt resort-utseende med anpassade färger och logotyp på varje bräda.
      icon: tabler:palette
    - title: Personal­utbildning
      description: Online- och platsbundna utbildningsprogram för ditt aktivitetsteam.
      icon: tabler:school
    - title: Global logistik
      description: Frakt till 50+ länder med konsoliderade fraktalternativ.
      icon: tabler:world
    - title: CE-certifierad
      description: All utrustning CE-certifierad, ISO 9001:2015 — säkerhet och kvalitet garanterade.
      icon: tabler:certificate
cta:
  title: Ready to upgrade your guest experience?
  subtitle: Få offert på ditt resortpaket eller ladda ner vår kompletta resortkatalog.
  actions:
    - text: Skaffa resortpaket
      href: /contact?package=resort
      variant: primary
    - text: Ladda ned resortkatalog
      href: /resources/download-catalog
      variant: secondary

faqs:
  title: 'Co-Brand — FAQ'
  subtitle: 'Hur co-branding hos Afarer fungerar och hur det skiljer sig från OEM och private label.'
  items:
    - title: 'Är co-branding samma sak som OEM eller private label?'
      description: 'Nej. Afarer driver inte längre ett öppet OEM/private label-program. Co-brand-produkter förblir Afarer-produkter — designade, konstruerade, kvalitetstestade och burna av varumärket Afarer. Er identitet framträder som ett co-brand, inte som en omärkt tredjepartsprodukt.'
    - title: 'Vem kan starta ett co-brand-projekt?'
      description: 'Kvalificerade vattensportsföretag: befintliga landspartners, paddleklubbar, resorts och hotell, evenemangsarrangörer och gemenskaper. Skicka oss en projektkort beskrivning så bekräftar vi lämpligheten innan designarbetet börjar.'
    - title: 'Kommer co-branding i konflikt med min landsdistributör?'
      description: 'Nej. Modellen med ett land, en distributör går först. Co-brand-kollektioner samordnas med den lokala landspartnern där en sådan finns, så inget parallellt eller konkurrerande varumärke dyker upp inom ett skyddat territorium.'
    - title: 'Vad är minsta beställning för en co-brand-kollektion?'
      description: 'Pilotkollektioner börjar vid 30–50 st. Standardkollektioner är 50–100 st; stora eller multiregionala upplagor är 100+ st. Tidslinjer för skräddarsydd utveckling avtalas per projekt.'
    - title: 'Vad utgör Afarer-kvalitet kontra partnerinsats?'
      description: 'Afarer äger produktdesign, konstruktion, material, uppbyggnad, QC och garanti. Partners bidrar med kollektionskoncept, namngivning, färger, grafisk input och go-to-market. Det håller en kvalitetsstandard på vattnet.'
    - title: 'Hur ansöker jag?'
      description: 'Fyll i co-brand-förfrågningsformuläret med ert företag, er marknad och er kollektionsidé. Vi granskar matchningen och svarar inom 3 arbetsdagar med ett förslag och Co-Brand Project Agreement.'

features:
  title: 'Vad co-branding betyder hos Afarer'
  subtitle: 'Co-branding är vårt designsamarbetsprogram — byggt kring varumärket Afarer, territorialskydd och begränsade kollektioner, inte omärkt produktion.'
  columns: 3
  items:
    - title: 'Afarer-produkter förblir Afarer-produkter'
      description: 'En co-brand-kollektion är en begränsad upplaga av Afarer-brädor med er identitet invävd. Aldrig omärkt, aldrig ett tredjepartsvarumärke och aldrig ett öppet private label-program.'
      icon: 'tabler:trademark'
    - title: 'Designad med er'
      description: 'Era färger, namngivning och berättelse formar kollektionen. Vårt design- och konstruktionsteam hanterar däck, grafik, förpackning och dokumentation från brief till leverans.'
      icon: 'tabler:pencil'
    - title: 'För klubbar, resorts, evenemang & gemenskaper'
      description: 'Flottkollektioner för paddleklubbar och resorts, evenemangsupplagor för tävlingar och gemenskapsserier — alla med Afarers kvalitet och garanti.'
      icon: 'tabler:users'
    - title: 'Skyddar landspartners'
      description: 'Co-branding löper bredvid vår modell med ett land, en distributör. Nationella partners behåller sitt territorium; co-brand-kollektioner öppnar inte dörren för parallella varumärken på deras marknad.'
      icon: 'tabler:shield-check'
    - title: 'Ingenjörskonst & kvalitetsstandarder'
      description: 'Varje kollektion skickas från vår certifierade leveranskedja med CE- och ISO 9001-dokumentation, trycktestning och samma QC-kontrollpunkter som vårt kärnutbud.'
      icon: 'tabler:certificate'
    - title: 'Blir en varumärkestillgång'
      description: 'En begränsad co-brand-kollektion bygger er egen berättelse på vattnet — täckningsgrad, medieinnehåll och en anledning för paddlare att komma tillbaka säsong efter säsong.'
      icon: 'tabler:star'

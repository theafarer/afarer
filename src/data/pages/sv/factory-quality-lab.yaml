hero:
  tagline: Kontrollaboratorium
  title: Testlaboratorium och kvalitetssäkring
  subtitle: Oberoende kvalitetslaboratorium med ISO 9001-processer – varje enhet testas före frakt
intro: afarer driver ett dedikerat kvalitets­kontroll­laboratorium som opererar oberoende av produktionen. Varje råmaterial­parti och varje färdig båt genomgår dokumenterade inspektions­protokoll innan leverans. Vårt QC-team rapporterar direkt till ledningen, vilket garanterar opartiska kvalitets­beslut.
highlights:
  - value: 100%
    label: Enheter trycktestade
    detail: Varje kamera, varje båt
  - value: 48 h
    label: Varaktighet för luftlåstest
    detail: Vid 1,25× nominellt tryck
  - value: '&lt;5%'
    label: Max tillåten tryckfall
    detail: Över 24 timmars hållbarhetstest
  - value: AQL 2,5
    label: Tröskelvärde för allvarliga fel
    detail: Enligt ISO 2859-provtagning
test_procedures:
  - title: Råvarukontroll
    description: Varje inkommande parti av PVC, Hypalon, drop-stitch-tyg och hård­vara provas innan godkännande. Drag­styrka (ASTM D751), riv­motstånd (ISO 4674) och UV-motstånd verifieras. Icke­normativa material isoleras och returneras.
    standards:
      - ASTM D751 (drag)
      - ISO 4674 (rivning)
      - ISO 4892 (UV)
  - title: Kontrollpunkter för kvalitetskontroll under tillverkning
    description: Produktionsoperatörer utför självinspektion på varje steg. Kvalitetsrevisorer genomför stickprov under hela skiftet. Svetsdragprov utförs var 50:e enhet. Dimensionskontroller sker var 20:e panel.
    standards:
      - ASTM D751 (peel)
      - Intern 100-punkters checklista
      - ISO 2859-provtagning
  - title: 48-timmars luftläckagetest
    description: Varje rörkammare fylls till 125 % av märkt tryck och hålls i 48 timmar. Trycksensorer loggar kontinuerligt med temperaturkompensation. Kammare som överskrider 5 % tryckfall utlöser automatisk omprovning av partiet.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Last- och balans­provning
    description: Färdiga båtar testas vid maximalt nominellt kapacitet för stabilitet, fribord och manövrerbarhet. Varje fartyg genomgår vattentestning innan slutinspektionsgodkännande.
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: Universell testmaskin (drag)
    spec: 5 kN, ASTM D751-kompatibel
  - name: Pressure Decay Tester
    spec: Flerkanalig, 0–50 psi, dataloggring
  - name: UV Weathering Chamber
    spec: ISO 4892, 1 000 h cykler
  - name: Tjockleksmätare (digital)
    spec: 0,01 mm upplösning
  - name: Peel Tester (weld)
    spec: Motoriserad, 50 N kapacitet
  - name: Temperature Chamber
    spec: '-40 °C till +100 °C'
  - name: Leak Detection Tank
    spec: 6 m × 2 m, belyst

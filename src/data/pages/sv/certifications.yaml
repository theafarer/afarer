hero:
  tagline: Certifications & Standards
  title: 'Kvalitetscertifieringar<br />& Efterlevnadsstandarder'
  subtitle: 'afarer produkter tillverkas i enlighet med internationella marina säkerhetsstandarder, kvalitetsledningssystem och miljöbestämmelser.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarer quality certifications and compliance documentation
content_certifications:
  tagline: Our Certifications
  title: 'Certifierad kvalitet,<br />globalt erkänd'
  subtitle: 'Varje afarer-produkt stöds av certifieringar som visar vårt engagemang för kvalitet, säkerhet och miljöansvar.'
  items:
    - title: 'CE Certified'
      description: 'Alla afarer-produkter uppfyller europeiska CE-märkningskrav för rekreationsbåtar, vilket säkerställer att säkerhets-, hälso- och miljöskyddsstandarder uppfylls.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Vårt kvalitetsledningssystem är ISO 9001:2015-certifierat och omfattar design, tillverkning och distribution av uppblåsbara båtar och marin utrustning.'
      icon: tabler:clipboard-check
    - title: 'UKCA Marked'
      description: 'Produkter sålda på den brittiska marknaden bär UKCA-märkning, vilket bekräftar överensstämmelse med brittiska regler för marin utrustning och personliga vattenfarkoster.'
      icon: tabler:shield
    - title: 'BSCI Compliant'
      description: 'afarer är BSCI (Business Social Compliance Initiative) granskad, vilket visar etiska tillverkningsmetoder, rättvisa arbetsförhållanden och ansvar i leveranskedjan.'
      icon: tabler:heart-handshake
    - title: 'REACH Compliant'
      description: 'Alla material som används i afarer-produkter uppfyller EU:s REACH-föreskrifter för kemikaliesäkerhet, vilket säkerställer att inga begränsade ämnen finns i vår PVC, Hypalon eller komponenter.'
      icon: tabler:flask
    - title: 'Material Testing'
      description: 'Tyger testas för dragstyrka, rivhållfasthet, UV-nedbrytning och kallsprickningsprestanda. Varje produktionsbatch provtas och verifieras.'
      icon: tabler:test-pipe
content_factory:
  tagline: Factory Standards
  title: 'Tillverknings-excellens<br />—byggd enligt specifikation'
  subtitle: 'Vår 12 000 m² anläggning arbetar under strikta kvalitetskontrollprotokoll i varje produktionssteg.'
  list:
    - 'Incoming Material Inspection: All raw materials —PVC fabric, Hypalon, aluminum, plywood, adhesives —are tested against specifications before entering production.'
    - 'In-Process Quality Control: Every production stage has documented QC checkpoints. Weld strength, seam alignment, valve installation, and fitting torque are verified inline.'
    - 'Pressure Testing: Every inflatable chamber is pressure-tested at 1.5× rated pressure for 24 hours. Leak rate must be zero for passing grade.'
    - 'Final Inspection: Completed products are inspected for dimensional accuracy, cosmetic finish, accessory completeness, and packaging integrity before shipping.'
    - 'Batch Traceability: Every product carries a serial number linked to production batch records, enabling full traceability from raw material to finished goods.'
content_safety:
  tagline: Marine Safety Standards
  title: 'Säkerhet först<br />—designad för tillförlitlig drift'
  subtitle: 'afarer-produkter är designade och testade för att uppfylla internationella marina säkerhetsstandarder för kommersiellt och rekreationsbruk.'
  items:
    - title: 'ISO 6185'
      description: 'Uppblåsbara båtar uppfyller ISO 6185-standarder för konstruktion, stabilitet, flytkraft och lastkapacitet.'
      icon: tabler:sailboat
    - title: 'ABYC Standards'
      description: 'Elsystem och bränslesystem följer ABYC-standarder (American Boat & Yacht Council) för säker installation och drift.'
      icon: tabler:bolt
    - title: 'SOLAS Compliance'
      description: 'Säkerhetsutrustning och livräddningsapparater uppfyller SOLAS-krav (Safety of Life at Sea) där tillämpligt.'
      icon: tabler:lifebuoy
cta:
  title: 'Behöver du certifierade produkter för ditt projekt?'
  subtitle: 'Kontakta vårt team för att diskutera certifieringskrav, dokumentation och efterlevnad för din marknad.'
  actions:
    - variant: primary
      text: Request certification docs
      href: /contact
    - text: View our quality page
      href: /quality

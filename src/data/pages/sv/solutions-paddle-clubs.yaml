meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Paddleklubbmedlemmar på matchande Afarer SUP-brädor
benefits:
  title: Förmåner för klubbflottor
  subtitle: Varför paddelklubber i över 50 länder väljer Afarer som sin utrustningspartner.
  items:
    - metric: 40%+
      label: Flottkostnadssbesparingar
      detail: Jämfört med detaljpriser med klubb rabatter
    - metric: 48h
      label: Del­utbyte
      detail: Minimal nertid för din uthyrningsflotta
    - metric: 500+
      label: Uthyrningscykler
      detail: Kommersiell hållbarhet per bräda
    - metric: 5+ år
      label: Flottans livslängd
      detail: Vid korrekt underhåll och skötsel
packages:
  title: Klubbflotteprogram
  subtitle: Välj det flottprogram som matchar din klubbs storlek och ambition.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Launch guide + safety checklist
        - Lanseringsguide + säkerhetschecklista
        - CE-certifierad – all utrustning
      cta_text: Starta er klubb
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Replacement parts program (15% discount)
        - Staff training session
        - Personalutbildning (online)
        - CE-certifierad – all utrustning
      popular: true
      cta_text: Bygg din flotta
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - 50+ racing-/prestandabrädor
        - Full accessory set
        - Event support kit
        - Prioritetsdelar (24h expediering)
        - Dedikerad kontoansvarig
        - Alternativ för anpassade teamuniformer
        - CE-certifierad – all utrustning
      cta_text: Skaffa tävlingsflotta
training:
  title: Träningscentrumpaket
  subtitle: Allt en SUP-skola behöver för att driva professionella certifieringskurser.
  items:
    - name: Instructor Starter
      features:
        - 5 premium-SUP-brädor (instruktörsstandard)
        - 5 kolpaddlar för demonstrationer
        - 5 liv­västar (instruktörs­storlek)
        - Utbildningsplan
        - CE-certifierad utrustning
    - name: School Full Set
      features:
        - 20 SUP-brädor (blandning av elever och instruktörer)
        - 20 paddlar + 20 livräddarvästar (olika storlekar)
        - 10 flytvästar för nybörjare
        - 4 pumpar + reparationssatser
        - Utbildningsplan och certifieringsstöd
        - CE-certifierad utrustning
features:
  title: Varför klubbar väljer Afarer
  subtitle: Konsekvent kvalitet, snabba delar och volympriser byggda för växande klubbar.
  items:
    - title: 500+ uthyrningscykler
      description: Kommersiella brädor klarar säsonger av dagligt bruk.
      icon: tabler:shield-check
    - title: Anpassade färger
      description: Anpassa ditt klubbid till anpassade brädfärger och logotyp.
      icon: tabler:palette
    - title: Volympriser
      description: Volymrabatter för flottbeställningar på 10+ brädor.
      icon: tabler:discount
    - title: Snabba delar
      description: Reservdelar skickade inom 48 timmar.
      icon: tabler:truck-delivery
    - title: Stöd för klubbens tillväxt
      description: Råd om medlemskap, prissättning och evenemangsarrangemang.
      icon: tabler:trending-up
    - title: CE-certifierad
      description: All utrustning uppfyller internationella säkerhetsstandarder.
      icon: tabler:certificate
cta:
  title: Redo att bygga din paddelklubb?
  subtitle: Begär offert för klubbflotta eller ladda ner vår klubbstartsguide.
  actions:
    - text: Ansök om klubbflotta
      href: /contact?package=club
      variant: primary
    - text: Ladda ner klubbguide
      href: /resources/download-catalog
      variant: secondary

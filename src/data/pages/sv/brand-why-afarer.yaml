features3_reasons:
  tagline: Why Choose afarer
  title: 'Sju anledningar att samarbeta med oss'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'Vi äger och driver en 12 000 m² fabrik. När du samarbetar med afarer arbetar du direkt med människorna som designar, konstruerar och bygger dina produkter —utan mellanhänder.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Vår designprocess börjar med användningsfallet, inte produktkategorin. Vi optimerar skrovform, materialval och konfiguration för hur båten faktiskt kommer att användas.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'CE-certifierad, ISO-kvalitetssystem, BSCI-efterlevnad, REACH-efterlevnad, USCG-godkänd. Varje produkt uppfyller internationella standarder —inte bara påståenden.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Slangfärger, konsollayout, branding, förpackning —vi anpassar till dina specifikationer. Inget minimiordertryck. Börja med en prototyp, skala med förtroende.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'US-lager i Kalifornien, direktfrakt från Qingdao, flygfrakt för brådskande order. Vi hanterar tulldokumentation.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'Vi stödjer båtar vi byggde för 20 år sedan. Äkta reservdelar, teknisk rådgivning, reparationsvägledning —vårt team finns när du behöver oss.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Verkliga lastklassificeringar, verkliga dimensioner, verklig vikt. Ingen marknadsföringsinflation. Det vi publicerar är vad du får —verifierat av oberoende testning.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Trusted by Brands Worldwide
  title: What Our Partners Say
  items:
    - content: 'We have worked with several manufacturers in China, but afarer stands out for their engineering support and consistent quality. They treat our brand as their own.'
      name: '—OEM Partner, European Water Sports Brand'
    - content: 'Their Hypalon RIBs have been in service with our fleet for over 5 years. Minimal maintenance, excellent UV resistance. The 5-year warranty on tubes gives us confidence.'
      name: '—Fleet Operator, Middle East Resort Group'
    - content: 'The afarer team helped us develop a custom SUP board design from concept to production in 90 days. The quality exceeded our expectations.'
      name: '—Distributor, Australian Watersports'

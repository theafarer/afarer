features3_reasons:
  tagline: Varför välja afarer
  title: Sju anledningar att samarbeta med oss
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Verklig tillverkning, inte handel
      description: Vi äger och driver en 12 000 m² fabrik. När du samarbetar med afarer arbetar du direkt med människorna som designar, konstruerar och bygger dina produkter — utan mellanhänder.
      icon: tabler:building-factory
    - title: 2. Teknikstyrd ansats
      description: Vår designprocess börjar med användningsfallet, inte produktkategorin. Vi optimerar skrovform, materialval och konfiguration för hur båten faktiskt kommer att användas.
      icon: tabler:engine
    - title: 3. Certifierad kvalitet
      description: CE-certifierad, ISO-kvalitetssystem, BSCI-efterlevnad, REACH-efterlevnad, USCG-godkänd. Varje produkt uppfyller internationella standarder — inte bara påståenden.
      icon: tabler:certificate
    - title: 4. Flexibel co-branding
      description: Slangfärger, konsollayout, branding, förpackning — vi anpassar till dina specifikationer. Inget minimiordertryck. Börja med en prototyp, skala med förtroende.
      icon: tabler:adjustments
    - title: 5. Global logistik
      description: US-lager i Kalifornien, direktfrakt från Qingdao, flygfrakt för brådskande order. Vi hanterar tulldokumentation.
      icon: tabler:truck-delivery
    - title: 6. Livstidsstöd
      description: Vi stödjer båtar vi byggde för 20 år sedan. Äkta reservdelar, teknisk rådgivning, reparationsvägledning — vårt team finns när du behöver oss.
      icon: tabler:lifebuoy
    - title: 7. Ärliga specifikationer
      description: Verkliga lastklassificeringar, verkliga dimensioner, verklig vikt. Ingen marknadsföringsinflation. Det vi publicerar är vad du får — verifierat av oberoende testning.
      icon: tabler:ruler-measure
testimonials:
  tagline: Betrodd av varumärken världen över
  title: Vad våra partners säger
  items:
    - content: Vi har arbetat med flera tillverkare i Kina, men afarer utmärker sig genom sitt tekniska stöd och konsekventa kvalitet. De behandlar vårt varumärke som sitt eget.
      name: — Co-brand-partner, europeiskt varumärke för vattensporter
    - content: Deras Hypalon-RIB:er har varit i tjänst med vår flotta i över 5 år. Minimal underhållsinsats, utmärkt UV-resistans. Den 5-åriga garantien på pongtonger ger oss trygghet.
      name: — Flottoperatör, resortgrupp i Mellanöstern
    - content: Afarer-teamet hjälpte oss utveckla en anpassad SUP-bräddesign från koncept till produktion på 90 dagar. Kvaliteten överträffade våra förväntningar.
      name: — Distributör, australisk vattensport
cta:
  title: Redo att uppleva skillnaden?
  subtitle: Kontakta vårt team för att diskutera ditt projekt. Inget åtagande krävs — bara ärliga råd om tillverkning.
  actions:
    - variant: primary
      text: Prata med vårt team
      href: /contact
    - text: Ladda ned produktkatalog

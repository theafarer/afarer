timeline:
  - year: '2012'
    title: Grunden för Marintillverkning
    body: >-
      afarer började som en specialiserad verkstad för uppblåsbara vattenfarkoster i Qingdao, Kina, med fokus på marint hantverk och tillverkning av uppblåsbara båtar. Det tidiga arbetet kretsade kring att bygga pålitliga uppblåsbara produkter genom praktisk ingenjörserfarenhet och
      tillverkningsdisciplin.
  - year: '2015'
    title: Första Exporten & CE-certifiering
    body: De första exportordrarna nådde Japan och Korea. CE-certifiering uppnåddes för kärnproduktserierna, vilket markerade afarers intåg på internationella marknader. Företaget började betjäna kommersiella och fritidsanvändare utanför Kina.
  - year: '2018'
    title: Fabriksexpansion
    body: Flyttade till en 12 000 m² stor produktionsanläggning. Lade till RF-svetslinjer och drop-stitch-produktionskapacitet, vilket möjliggjorde större tillverkning och förbättrade kvalitetskontrollsystem.
  - year: '2020'
    title: FoU-center Etablerat
    body: Öppnade ett dedikerat FoU-center med PVC-tyglabb, hydrodynamisk testtank och CAD/FEA-simuleringsstudio. Produktutvecklingen utökades för att fokusera på lätt konstruktion, förbättrad hållbarhet och användarcentrerad design.
  - year: '2022'
    title: Certifiering & Global Tillväxt
    body: Uppnådde ISO 9001-certifiering. Utökade till 14 FoU-ingenjörer och över 200 anställda. Produkterna nådde kunder över Europa, Amerika och Asien-Stillahavsområdet genom distributörs- och OEM-partnerskap.
  - year: '2024'
    title: Innovations- & Designstudio
    body: Lanserade en fullservice design- och innovationsstudio för skräddarsydda ODM-projekt, från koncept till produktion. Stärkte professionella marina tillämpningar inklusive räddning, kommersiella och statliga upphandlingar.
  - year: '2026'
    title: Att Bygga Framtiden för Vattenutforskning
    body: Idag fortsätter afarer att utveckla uppblåsbara båtar, SUP-system och skräddarsydda marina lösningar —och kopplar samman människor och organisationer med världens vatten. 50+ länder betjänade, 15 000+ enheter i årlig kapacitet.
content_founding:
  tagline: Början
  title: Född vid Vattnet
  subtitle: 'afarer startade i en kustverkstad i Qingdao med en båt och en vision: att bygga uppblåsbara vattenfarkoster som klarar verkliga marina förhållanden.'
  paragraphs:
    - 2012 såg våra grundare en lucka på marknaden —de flesta uppblåsbara båtar var antingen prisvärda men opålitliga, eller av hög kvalitet men oöverkomligt dyra. De trodde att det fanns utrymme för en tillverkare som levererade både kvalitet och värde.
    - Det första skrovet byggdes för hand, testades i lokala vatten och förfinades baserat på verklig feedback från fiskare och mindre kommersiella operatörer. Den återkopplingsslingan —bygg, testa, lyssna, förbättra —är fortfarande kärnan i vår ingenjörsfilosofi idag.
    - 2015 hade ryktet spridits bortom Qingdao. Internationella distributörer började begära prover. Det som började som en lokal verkstad höll på att bli en global leverantör.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarers tidiga produktionsverkstad och tillverkning
content_growth:
  tagline: Tillväxt & Innovation
  title: Från Verkstad till 12 000 m² Anläggning
  subtitle: Kontinuerliga investeringar i människor, utrustning och processer har förvandlat afarer till en modern marin tillverkningsanläggning.
  paragraphs:
    - I takt med att efterfrågan växte växte även vår anläggning. Vi expanderade från en liten verkstad till en 12 000 m² stor fabrik med dedikerade produktionslinjer för SUP-båtar, uppblåsbara båtar, SUP-brädor och tillbehör.
    - Vi investerade i CNC-skärmaskiner, högfrekvenssvetsutrustning, drop-stitch-produktionslinjer och omfattande testriggar —vilket gör att vi kan kontrollera varje aspekt av produktionskvaliteten.
    - Idag omfattar vårt team på över 200 personer mariningenjörer, materialvetare, kvalitetskontrollspecialister och skickliga hantverkare —många av dem har varit med afarer sedan de tidiga dagarna.
philosophy:
  tagline: Varumärkesfilosofi
  title: Ingenjörskonst för Frihet på Vattnet
  body: Frihet på vattnet handlar inte bara om förflyttning. Det handlar om att upptäcka nya platser, skapa utomhusupplevelser, koppla samman människor med naturen och möjliggöra professionella uppdrag. Ingenjörskonsten gör den friheten möjlig.
  pillars:
    - title: Pålitlighet Först
      body: Vattenmiljöer kräver förtroende. afarers produkter är designade kring stabilitet, hållbarhet, säkerhet och jämn prestanda.
    - title: Människocentrerad Design
      body: Produkter ska tjäna människor, inte teknik. Varje designbeslut börjar med att förstå hur människor använder vattenfarkoster, var de utforskar och vilka utmaningar de möter.
    - title: Tillgänglig Utforskning
      body: Vatten ska inte bara tillhöra experter. afarer skapar utrustning som gör att fler människor på ett säkert sätt kan uppleva floder, sjöar, hav och kustmiljöer.
    - title: Kontinuerlig Innovation
      body: Innovation handlar inte bara om att skapa nya produkter. Det handlar om att förbättra varje detalj —material, strukturer, tillverkning och användarupplevelse.
engineeringDna:
  tagline: Ingenjörs-DNA
  title: Hur afarer Skapar Produkter
  areas:
    - title: Materialvetenskap
      body: afarer fokuserar på att välja lämpliga material för olika marina miljöer. Viktiga överväganden inkluderar nötningsbeständighet, UV-beständighet, tryckstabilitet och långsiktig hållbarhet.
      items:
        - Nötningsbeständighet
        - UV-beständighet
        - Tryckstabilitet
        - Långsiktig hållbarhet
    - title: Konstruktionsteknik
      body: Uppblåsbara vattenfarkoster kräver en precis balans mellan styvhet, vikt, portabilitet och stabilitet. afarers ingenjörskonst fokuserar på att optimera dessa faktorer genom drop-stitch-kärnteknik och avancerad sömskonstruktion.
      items:
        - Styvhet
        - Viktoptimering
        - Portabilitet
        - Stabilitet
    - title: Tillverkningsprecision
      body: 'Varje produkt genomgår kontrollerade processer: materialberedning, precisionsskärning, svetsning och fogning, montering, kvalitetsinspektion och prestandaverifiering.'
      items:
        - Materialberedning
        - Precisionsskärning
        - Svetsning & Fogning
        - Montering & QC
    - title: Användarscenarioteknik
      body: Produkter utvecklas kring verkliga tillämpningar —rekreation, äventyr och professionellt bruk —vilket säkerställer att varje design uppfyller de specifika kraven i dess avsedda miljö.
      items:
        - Rekreation
        - Äventyr
        - Professionellt
        - Kommersiellt

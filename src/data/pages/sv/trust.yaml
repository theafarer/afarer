warranty_section:
  title: Garanti och eftersäljningsstöd
  subtitle: Vi står bakom varje produkt med tydliga garantivillkor, snabb reklamationshantering och äkta reservedelar.
  items:
    - title: 2-års produktgaranti
      desc: Alla Afarer-produkter har 2 års garanti mot tillverkningsfel – sömmisslyckanden, ventilfel och materialdelaminering under normal användning.
    - title: Livstidsstöd för delar
      desc: Äkta reservdelar — ventiler, reparationssatser, fenor, D-ringar — tillgängliga för alla modeller. Vi underhåller formar och verktyg i minst 5 år efter produktionsavslutning.
    - title: 48-timmars reklamationsvar
      desc: Garantianmälan bekräftas inom 48 timmar. Ersättningsbrädor skickas inom 10 arbetsdagar för godkända ärenden.
    - title: Globalt reparationssnätverk
      desc: Auktoriserade reparationsservicecenter i 15+ länder. Reparationskit tillgängliga för fjärran verksamheter. Självgörande reparationsguider för mindre skador.
    - title: OEM-kundsupport
      desc: Dedikerade kontoansvariga för B2B-partner. Kvartalsvis affärsgranskning, lagerplanering och gemensam marknadsföringsstöd.
    - title: Certifieringspaket
      desc: Komplett efterlevnadsdokumentation medföljer varje leverans — CE-förklaring, provningsrapporter, material säkerhetsdatablad.
      link: /contact

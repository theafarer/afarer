      name: Lt. Cmdr. Andres
      title: Marinupphandling, Filippinerna
steps2_manufacturing:
  title: Hur vi säkerställer kvalitet
  subtitle: Från råvaruinspektion till slutlig trycktestning —varje produkt genomgår en rigorös kvalitetskedja.
  items:
    - title: Råvaruinspektion
      description: Varje rulle PVC-tyg testas för tjocklek, dragstyrka och UV-beständighet innan den går in i produktion.
      icon: tabler:search
    - title: Pågående QC
      description: Svetsfogar, ventilinstallationer och kammaranslutningar inspekteras vid varje station under montering.
      icon: tabler:eye
    - title: Trycktestning
      description: Varje uppblåsbar produkt pumpas upp till 1,5x nominellt PSI och hålls i 24 timmar för att verifiera luftretention och sömintegritet.
      icon: tabler:wind

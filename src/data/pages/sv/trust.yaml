faqs_sup:
  title: SUP-brädor FAQ
  subtitle: Vanliga frågor om våra paddleboard.
  columns: 2
  items:
    - title: Vilka SUP-brädstorlekar finns tillgängliga?
      description: Vi erbjuder SUP-brädor från 9 ft till 12 ft, inklusive all-round, touring, yoga och specialdesigner. Våra bästsäljande modeller inkluderar Tropical Breeze (10 ft) och Ocean Voyager (11 ft).
    - title: Vad är drop-stitch-konstruktion?
      description: Drop-stitch-konstruktion använder tusentals polyestertrådar som ansluter brädets topp- och bottenlager, vilket gör att det kan hålla högt lufttryck (15–20 PSI) och uppnå en styv, stabil plattform. Detta är industristandarden för premium uppblåsbara SUP.
    - title: Vad är viktgränsen för SUP-brädor?
      description: Våra SUP-brädor stödjer upp till 150 kg beroende på modell och volym. Leviathan Wake är vår modell med högst kapacitet, designad för större användare och yogabruk.
    - title: Erbjuder du kompletta SUP-paket?
      description: Ja. Varje SUP-bräde levereras med ett komplett paket inklusive 3-delad aluminiumpaddel, högtrycks handpump, spiralkoppel, reseryggsäck och reparationssats. Vissa modeller inkluderar även ett avtagbart fen-set.
    - title: Vad är garantin på SUP-brädor?
      description: Alla afarer SUP-brädor har ett års garanti mot tillverkningsfel, inklusive sömfel, ventilfel och materialdelaminering under normal användning.
    - title: Hur lång tid tar det att pumpa upp ett SUP-bräde?
      description: Med den medföljande handpumpen tar full uppumpning till 15 PSI cirka 8–12 minuter. För snabbare uppumpning rekommenderar vi vår afarer 12V elektriska pump, som pumpar upp ett bräde på under 4 minuter.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

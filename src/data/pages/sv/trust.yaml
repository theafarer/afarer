      description: Internt materiallaboratorium testar dragstyrka, UV-beständighet, sömintegritet och nötning för varje tygbatch före produktion.
      icon: tabler:microscope
    - title: 2 års garanti
      description: Varje afarer-produkt levereras med två års garanti mot tillverkningsfel. Vi står för det vi bygger.
      icon: tabler:shield-check
testimonials:
  tagline: Kundförtroende
  title: Vad våra kunder säger
  subtitle: Från förstagångspaddlare till professionella flottoperatörer —se varför de litar på afarer.
  items:
    - content: Vi utrustade hela vår uthyrningsflotta med afarer SUP. Två säsonger in, noll fel. CE-certifieringen gjorde försäkringsgodkännande sömlöst.
      name: Marco V.

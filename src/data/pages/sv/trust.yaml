  isBeforeContent: true
  items:
    - title: CE-certifiering
      description: Alla afarer SUP, kajaker, jollar och SUP uppfyller den europeiska CE-säkerhetsstandarden för rekreationsfarkoster. Varje produkt genomgår tryck-, flyt- och lasttestning innan den lämnar fabriken.
      icon: tabler:certificate
    - title: ISO 9001
      description: Vår 12.000 m² Qingdao-anläggning arbetar under ett  kvalitetsledningssystem. Varje produktionsbatch är spårbar, dokumenterad och inspekterad.
      icon: tabler:clipboard-check

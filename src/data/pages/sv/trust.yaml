features3_certifications:
  title: Certifieringar och efterlevnad
  subtitle: Varje produkt är oberoende testad och certifierad enligt internationella standarder.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE-certifiering
      description: Alla afarer SUP uppfyller den europeiska CE-säkerhetsstandarden för rekreationsfarkoster. Varje produkt genomgår tryck-, flyt- och lasttestning innan den lämnar fabriken.
      icon: tabler:certificate
    - title: ISO 9001
      description: Vår 12.000 m² Qingdao-anläggning arbetar under ett kvalitetsledningssystem enligt ISO 9001. Varje produktionsbatch är spårbar, dokumenterad och inspekterad.
      icon: tabler:clipboard-check
    - title: BSCI social efterlevnad
      description: Vi är BSCI-certifierade, vilket säkerställer etiska arbetsmetoder, säkra arbetsförhållanden och miljöansvar i hela vår leveranskedja.
      icon: tabler:users
    - title: REACH och RoHS
      description: Alla material — PVC, Hypalon, EVA-skum, lim — uppfyller EU:s REACH- och RoHS-föreskrifter. Inga begränsade ämnen, inga kompromisser.
      icon: tabler:flask
    - title: Materialtestningslaboratorium
      description: Internt materiallaboratorium testar dragstyrka, UV-beständighet, sömintegritet och nötning för varje tygbatch före produktion.
      icon: tabler:microscope
    - title: 2 års garanti
      description: Varje afarer-produkt levereras med två års garanti mot tillverkningsfel. Vi står för det vi bygger.
      icon: tabler:shield-check
testimonials:
  tagline: Kundförtroende
  title: Vad våra kunder säger
  subtitle: Från förstagångspaddlare till professionella flottoperatörer — se varför de litar på afarer.
  items:
    - content: Vi utrustade hela vår uthyrningsflotta med afarer SUP. Två säsonger in, noll fel. CE-certifieringen gjorde försäkringsgodkännande sömlöst.
      name: Marco V.
      title: Turarrangör, Kroatien
    - content: Som förstagångsköpare var jag nervös för kvaliteten. ISO-dokumentationen och testrapporterna de delade gav mig fullt förtroende.
      name: James T.
      title: SUP Explorer 11-ägare, Kanada
    - content: Vi samarbetar med afarer för våra kustpatruljenheter. Deras QC-process är konsekvent över varje batch — den pålitligheten betyder något i uppdragskritiska operationer.
      name: Lt. Cmdr. Andres
      title: Marinupphandling, Filippinerna
steps2_manufacturing:
  title: Hur vi säkerställer kvalitet
  subtitle: Från råvaruinspektion till slutlig trycktestning — varje produkt genomgår en rigorös kvalitetskedja.
  items:
    - title: Råvaruinspektion
      description: Varje rulle PVC-tyg testas för tjocklek, dragstyrka och UV-beständighet innan den går in i produktion.
      icon: tabler:search
    - title: Pågående QC
      description: Svetsfogar, ventilinstallationer och kammaranslutningar inspekteras vid varje station under montering.
      icon: tabler:eye
    - title: Trycktestning
      description: Varje uppblåsbar produkt pumpas upp till 1,5x nominellt PSI och hålls i 24 timmar för att verifiera luftretention och sömintegritet.
      icon: tabler:wind
    - title: Slutinspektion
      description: Varje enhet inspekteras för finish, hårdvara och förpackning innan den godkänns för leverans. Batchprover går till vårt laboratorium för destruktiv testning.
      icon: tabler:clipboard-check

faqs_sup:
  title: SUP-brädor FAQ
  subtitle: Vanliga frågor om våra paddleboard.
  columns: 2
  items:
    - title: Vilka SUP-brädstorlekar finns tillgängliga?
      description: Vi erbjuder SUP-brädor från 9 ft till 12 ft, inklusive all-round, touring, yoga och specialdesigner. Våra bästsäljande modeller inkluderar Tropical Breeze (10 ft) och Ocean Voyager (11 ft).
    - title: Vad är drop-stitch-konstruktion?
      description: Drop-stitch-konstruktion använder tusentals polyestertrådar som ansluter brädets topp- och bottenlager, vilket gör att det kan hålla högt lufttryck (15–20 PSI) och uppnå en styv, stabil plattform. Detta är industristandarden för premium uppblåsbara SUP.
    - title: Vad är viktgränsen för SUP-brädor?
      description: Våra SUP-brädor stödjer upp till 150 kg beroende på modell och volym. Leviathan Wake är vår modell med högst kapacitet, designad för större användare och yogabruk.
    - title: Erbjuder du kompletta SUP-paket?
      description: Ja. Varje SUP-bräde levereras med ett komplett paket inklusive 3-delad aluminiumpaddel, högtrycks handpump, spiralkoppel, reseryggsäck och reparationssats. Vissa modeller inkluderar även ett avtagbart fen-set.
    - title: Vad är garantin på SUP-brädor?
      description: Alla afarer SUP-brädor har ett års garanti mot tillverkningsfel, inklusive sömfel, ventilfel och materialdelaminering under normal användning.
    - title: Hur lång tid tar det att pumpa upp ett SUP-bräde?
      description: Med den medföljande handpumpen tar full uppumpning till 15 PSI cirka 8–12 minuter. För snabbare uppumpning rekommenderar vi vår afarer 12V elektriska pump, som pumpar upp ett bräde på under 4 minuter.
faqs_materials:
  title: SUP-material och skötsel – Vanliga frågor
  subtitle: Vanliga frågor om våra uppblåsbara SUP-material, skötsel och lagring.
  columns: 2
  items:
    - title: Vilka material används i Afarers uppblåsbara SUP-brädor?
      description: Vi använder militärklassad PVC (1 100 denier) med UV-stabiliserad, slitstark konstruktion, i enlighet med EU REACH- och RoHS-förordningarna.
    - title: Hur länge håller uppblåsbara SUP-brädor?
      description: Med rätt underhåll varar en uppblåsbar kvalitets-PVC-SUP i 5–10 år. Regelmässig rengöring, UV-skydd och korrekt förvaring förlänger avsevärt livslängden.
    - title: Vilket underhåll krävs för en oppblåsbar SUP?
      description: Grundunderhåll innebär sköljning med färskt vatten efter varje användning (särskilt i saltvatten), torkning innan förvaring, årlig kontroll av ventiltätningar och undvikande av långvarig solexponering vid icke-användning.
    - title: Kan uppblåsbara SUP:er användas i saltvatten?
      description: Ja. Alla afarer uppblåsbara SUP:ar är designade för användning i både sötvatten och saltvatten. Vi rekommenderar att skölja med rent vatten och torka noggrant efter saltvattensexponering.
    - title: Hur förvarar jag en uppblåsbar SUP?
      description: Töm, rengör och torka brädan helt före lagring. Rulla löst (undvik strama veck), förvara i ett svalt, torrt rum bortom direkt solljus och håll bort från betonggolv för att hindra fuktabsorption.
    - title: Vilken viktkapacitet har afarer inflerbara SUP-brädor?
      description: Viktkapaciteten varierar från 100 kg för våra minsta modeller till över 200 kg för större brädor. Varje produktsida anger maximala lastkapaciteten för din specifika modell.

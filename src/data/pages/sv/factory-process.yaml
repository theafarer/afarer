intro: >-
  Till skillnad från märken som lägger ut produktion på tredjepartsfabriker äger och driver afarer hela sin produktionskedja. Denna vertikala integration gör att vi kan upprätthålla strikt kvalitetskontroll i varje steg, snabbt reagera på anpassade krav och leverera jämn produktkvalitet batch efter
  batch. Så här byggs en bräda i vår anläggning.
steps:
  - step: '01'
    title: Materialmottagning och inspektion
    description: Varje inkommande batch av PVC-tyg, glasfibermatta, harts och tillbehör inspekteras enligt specifikation. Tygprover testas för draghållfasthet, tjockleksenhetlighet och UV-beständighet innan de släpps till produktion. Material som inte uppfyller kraven karantänsätts och returneras.
    duration: 1–2 dagar
  - step: '02'
    title: Automatisk PVC-skärning
    description: Godkända tyger läggs ut på en automatisk CNC-skärmaskin och skärs med submillimeterprecision. Datoroptimerad layout placerar paneler för att minimera spill — typiskt under 5 %. Skurna paneler märks med brädmodell och kammare, packas och överförs till svetsverkstaden.
    duration: 2–4 timmar per brädsats
  - step: '03'
    title: Rörsvetsning och fogning
    description: Paneler tråcklas och fogas med varmluftsvetsmaskiner vid kontrollerade temperaturer 200–300 °C. Huvudsömmar förstärks med dielektrisk RF-försegling för lufttäta, höghållfasta fogar. Färdiga kammare blåses upp till 1,5× arbetstryck i 30 minuter för validering av lufttäthet.
    duration: 1–2 dagar per bräda
  - step: '04'
    title: SUP-tryck och dekor
    description: Grafiken på SUP-brädans däck appliceras med digitaltryck för fullfärgsmönster av fotografisk kvalitet och screentryck för hållbara logotyper och återkommande mönster. Trycken härdas och förseglas för UV- och nötningsbeständighet.
    duration: 1–2 dagar
  - step: '05'
    title: Slutmontering och riggning
    description: Brädor riggas på monteringslinjen med fenor, ventiler, EVA-däck och tillbehör. Varje enhet följer en 100-punkts monteringskontrollista med obligatoriskt godkännande i varje steg.
    duration: 2–4 dagar
  - step: '06'
    title: Kvalitetstestning och inspektion
    description: >-
      Varje färdig bräda genomgår en obligatorisk kvalitetsgrind: lufttäthetstest av kammare, funktionskontroll av tillbehör, verifiering av fästmoment och kosmetisk inspektion. Anpassade och prototypbyggen genomgår även sjöprov som omfattar stabilitet och hantering.
    duration: 1–2 dagar
  - step: '07'
    title: Packning och frakt
    description: Brädor töms på luft, viks enligt procedur, packas i slitstarka tygpåsar eller plywoodlådor och lastas för frakt. Varje paket märks med modell, serienummer och destination. Vi samordnar med transportörer för FCL- och LCL-frakt över hela världen.
    duration: 1 dag

meta:
  title: Forsknings- och utvecklingscenter | {SITE}
  description: Forskning och utveckling — PVC-filmsprovning, skrovkonstruktion, RF-svetsning, hydrodynamisk testning och kvalitetskontroll. Anpassade F&U-tjänster tillgängliga.
hero:
  tagline: FoU-centrum
  title: F&U-centrum
  subtitle: Fokuserad på framsteg
intro:
  - >-
    afarers forsknings- och utvecklingscenter (R&D) är drivkraften bakom vår mission att revolutionera vattensportutrustning. Vi utrustar vattensportentusiaster världen över med säkrare, bekvämare och mer njutbara produkter genom ständigt nyskapande inom uppblåsbara stand up paddle-brädor (SUP:ar)
    och båtar. Vårt dedikerade team av ingenjörer, designers och passionerade vattensportexperter formar framtiden för branschen och höjer ständigt ribban för kvalitet, prestanda och hållbarhet.
  - >-
    Vår forsknings- och utvecklingsanläggning samlar materialvetenskapsmän, skeppskonstruktörer och produktionsingenjörer under ett tak. Från tygformulering och skrovsimulering till svetsningsprocessutveckling och fullskaleprovningar till havs, varje steg i produktutvecklingen drivs av data och
    valideras genom tester.
mission:
  tagline: Vår mission
  title: Innoverar framtiden för vattensport
  pillars:
    - icon: lightning
      title: Teknisk utveckling
      desc: Pionjärarbete med nya material, design och tillverkning för överordnad produktprestation och livslängd.
    - icon: design
      title: Användarcentrerad design
      desc: Djup förståelse för och överträffelse av användar­behov genom ergonomisk och intuitiv produkt­design.
    - icon: globe
      title: Hållbar verksamhet
      desc: Minimerar vår miljöpäverkan genom användning av miljövänliga material och processer.
    - icon: shield
      title: Säkerhet utan kompromisser
      desc: Säkrar de högsta säkerhetsstandarderna genom noggrann provning och certifiering.
pillars:
  - title: Teknisk utveckling
    desc: Banbrytande nya material, design och tillverkningsprocesser för att leverera överordnad prestanda och livslängd.
    icon: tech
  - title: Avancerade material
    desc: Utveckling av banbrytande PVC, Hypalon, kompositer och hållbara alternativ för förbättrade produktegenskaper.
    icon: materials
  - title: Hållbarhet
    desc: 'Ett kärnengagemang: Vi är dedikerade till miljöansvar genom hållbar tillverkning och återvinnbara material.'
    icon: sustainability
capabilities:
  tagline: Förmågor
  title: F&U-kompetens
  subtitle: Fyra kärn­discipliner som ger oss helhets­kontroll över produkt­utvecklingen — från råmaterial­forskning till slut­certifiering.
  groups:
    - title: Materialvetenskap och tygteknik
      items:
        - Analys och optimering av PVC- och Hypalon-formuleringar
        - UV-stabilisering, brandhämmande egenskaper och utveckling av antimikrobiella tillsatser
        - Lagerlaminerad tyglaminering och klibbteknik
        - Accelererad äldringstestning (UV, termisk, fuktighet, saltsprut)
    - title: Skrovkonstruktion och hydrodynamik
      items:
        - Parametrisk 3D-skrovsdesign och CFD-optimering
        - Elementanalys för strukturella och stötlaster
        - Modellskalad bogseringstankprovning och prestandavalidering
        - Anpassad skrovutveckling för särskilda uppdragsprofiler
    - title: Svets- och fogteknik
      items:
        - Utveckling och optimering av RF-die­lektrisk svets­process
        - Svetsning med varmluft, varmkil och ultraljud
        - Kvalificering av limanslutning och sömsband
        - Modellering av svetsstyrka och livslängdspåspaning
    - title: Provning, certifiering och efterlevnad
      items:
        - Kvalitetsstyrning och CE-uppfyllelseprovning
        - Oberoende tredjepartstestning och certifieringsstöd
        - Utveckling av anpassade testprotokoll för inköpskvalificering
        - Driftfelanalys och orsaksundersökning

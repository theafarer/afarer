rd_services:
  tagline: Anpassad F&U
  title: FoU-tjänster för partners
  services:
    - title: Anpassad materialutveckling
      desc: Vi utvecklar anpassade tygsammansättningar, laminatstapor och limsystem som är skräddarsydda för din driftmiljö och prestandamål.
    - title: OEM / ODM-produktteknik
      desc: Vi utvecklar anpassade tygsammansättningar, laminatstapor och limsystem som är skräddarsydda för din driftmiljö och prestandamål.
    - title: Tredjepartsprovning och certifiering
      desc: Använd våra ISO-efterlevande testanläggningar för oberoende materialtestning, produktvalidering och certifieringsstöd.
  cta: Diskutera dina F&U-behov →
  cta_link: /kontakt
vision:
  tagline: Vår vision
  title: Formar framtiden för vattensport
  body: >-
    afarer strävar efter att leda oppustbara båtars och SUP-branschen genom kontinuerlig innovation, obestridlig kvalitet och en stadig förankring i säkerhet och hållbarhet — och berikar därmed upplevelserna för vattensportentusiaster världen över. afarer F&U-center är där passion möter innovation
    och sätter nya standarder för vattensportbranschen.
labs_section:
  tagline: Laboratorier
  title: Våra laboratorier
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: PVC-vävlaboratorium
      description: Kontinuerlig forskning och provning av PVC- och Hypalon-rörtyger för draghållfasthet, UV-motstånd, slitage och flexibilitet vid låga temperaturer för att säkerställa långsiktig pålitlighet i marina miljöer.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Skroveteknisk studio
      description: CAD-styrd design och finit elementanalys av HDPE-, aluminium- och glasfiberskrov. Varje skrov digitalt simuleras för stressfördelning och slagståndighet innan den första prototypen byggs.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: RF-svetsningscenter
      description: Dedikerad radiofrekvens-svetsningsanläggning med precisionstemperatur och tryckreglering, som producerar högfasta, lufttäta sömmar som uppfyller marina branschstandard för oppblåsbara fartyg.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Hydrodynamisk testtank
      description: Modellskalad provning i vår interna testtank för att optimera skroptform, planeringsprestanda, stabilitet och bränsleeffektivitet under olika last- och havsförhållanden.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: Prototypverkstad
      description: Fullskalig prototyptillverknings- och utrustningsanläggning där nya modeller byggas, utrustas och provas till havs. Varje prototyp genomgår ett minimi 20-timmars vattenprovningsprogram innan produktionsgodkännande.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Kvalitets- och inspektionslaboratorium
      description: Dedikerat kvalitetssäkerhetslaboratorium som utför dragprovning, lufttätthetscykling, sömlosningstester och materialcertifiering för att säkerställa att varje båt som lämnar verkstaden uppfyller våra publicerade specifikationer.
      href: /randdcenter/quality-inspection-lab

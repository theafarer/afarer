hero:
  tagline: Teknik
  title: Hur du väljer SUP-tjocklek — Teknisk analys
  subtitle: 6 minuters läsning
content_html: >
  <h2>De tre standardtjocklekarna</h2>


  <h3>4" (10 cm) – Touring &amp; prestanda</h3>

  <ul>
    <li>Högsta styvheten – mindre flex under last</li>
    <li>Lättast – mindre material, mindre luftvolym</li>
    <li>Utmärkt spårbarhet – minskad sidledssvängning</li>
    <li>Snabbast – minskat luftmotstått, enklare glid</li>
    <li>Bäst för: Touring, racing, fitnesspaddling, erfarna paddlare</li>
  </ul>


  <h3>5" (12,7 cm) – Allround</h3>

  <ul>
    <li>God styvhet – balanserat förhållande mellan flex och styvhet</li>
    <li>Måttlig vikt – standardmaterialförbrukning</li>
    <li>God primär + sekundär stabilitet</li>
    <li>Bäst för: Fritidspaddling, nybörjare, avslappnad sjö- och flodbruk</li>
  </ul>


  <h3>6" (15,2 cm) – Stabilitet &amp; yoga</h3>

  <ul>
    <li>Högsta primär stabilitet – massiv uppdrivning</li>
    <li>Tungast – mer PVC-material, större luftvolym</li>
    <li>Långsammast – mer luftmotstått, svårare att bibehålla glid</li>
    <li>Bäst för: Yoga/fitness, tungare paddlare (100+ kg), mycket ojämna förhållanden</li>
  </ul>


  <h2>Teknisk analys</h2>

  <p>Styvheten hos en oppust SUP-styrs av intern lufttryck och tvärsektionens tröghetsmoment. Vid 20 PSI visar en 4" bräda ca 30 % mindre nedböjning under last än en 6" bräda med samma bredd och längd. Primär stabilitet kommer från vattlinjebredd och uppdrivning; sekundär stabilitet påverkas av
  railform och brädbredd.</p>


  <h2>Tjocklek efter paddlarvikt</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Paddlarvikt</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Rekommenderad tjocklek</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Under 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" eller 6"</td></tr>
      <tr><td class="p-3 border">Över 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>Tjocklek vs. PSI-avvägning</h2>

  <p>En vanlig missuppfattning är att högre PSI kan kompensera för överdriven tjocklek. Vid 25 PSI visar en 6" bräda mer flex än en 4" bräda vid 15 PSI eftersom det geometriska tröghetsmomentet dominerar styvhetsekvationen. För prestandainriktade paddlare överträffar en tunnare bräda vid lägre tryck
  en tjockare bräda vid högre tryck.</p>


  <h2>Afarers sortiment</h2>

  <ul>
    <li><strong>4" brädor:</strong> Cheetah Touring-serien – 12' x 30" x 4" touring-SUP för fitness och distanspaddling</li>
    <li><strong>5" brädor:</strong> Cheetah All-Round-serien – 10'6" x 32" x 5" för fritidsbruk</li>
    <li><strong>6" brädor:</strong> Cheetah Ultra-Stable-serien – 10' x 34" x 6" för yoga, stora paddlare och fotoplattformar</li>
  </ul>

  <p>Alla brädor använder 1 680 DTEX drop-stitch-kärnor med 20 PSI tryckklassning och 1,2 mm PVC-laminat.</p>

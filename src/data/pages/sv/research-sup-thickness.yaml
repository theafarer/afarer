  title: Hur du väljer SUP-tjocklek — Teknisk analys | {SITE}
  description: 'Teknisk guide till luftfyllbara SUP-brädors tjocklek: hur 4", 5" och 6" bräder skiljer sig i styvhet, vikt, stabilitet, spårbarhet och prestanda. Tjockleksrekommendationer för touring, yoga, surf, racing och allroundpaddling.'

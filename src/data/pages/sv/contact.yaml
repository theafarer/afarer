hero_text:
  tagline: Kontakt
  title: KONTAKTA OSS
contact_form:
  id: form
  title: Skicka meddelande
  subtitle: För offerter, tekniska frågor eller partnerskap —skriv till oss. Vi svarar inom en arbetsdag.
  email_to: info@afarer.com
  submit_button: Skicka
  success_message: Tack! Ditt meddelande har mottagits. Vi svarar inom en arbetsdag.
  error_message: Ett fel uppstod vid sändning. Försök igen eller skriv direkt till e-postadressen.
  default_country_code: '+1'
  captcha:
    label: 'Antispam: lös följande uppgift'
  fields:
    - name: firstName
      label: Förnamn
      row: 1
      type: select
      optionsKey: länder
      step: 1
    - name: lastName
      label: Efternamn
      row: 1
      type: select
      options:
        - value: ''
          label: Välj din uppskattade volym...
        - value: prov
          label: Endast prov / prototyper
        - value: 5-10
          label: 5–10 enheter (standard MOQ)
        - value: 100-500
          label: 100–500 enheter
        - value: 500-plus
          label: 500+ enheter (volympris)
      step: 1
    - name: companyName
      label: Företag
      row: 2
      type: select
      options:
        - value: ''
          label: Välj anpassningstyp...
        - value: inget
          label: Standardprodukt (utan anpassning)
        - value: logo
          label: Anpassat logotype / enbart varumärke
        - value: fullständig
          label: Fullständig OEM (storlek, färg, grafik, förpackning)
        - value: konsultation
          label: Osäker — behöver konsultation
      step: 1
    - name: address
      label: Adress
      row: 3
      type: select
      options:
        - value: ''
          label: Välj produktkategori...
        - value: alla
          label: Alla produkter / Fullständig katalog
        - value: sup
          label: SUP-brädor / Paddelbrädor
        - value: säkerhet
          label: Säkerhetsutrustning / räddningsvästar
        - value: tillbehör
          label: Tillbehör (pumpar, åror, väskor)
      step: 1
    - name: zip
      label: Postnummer
      row: 4
      step: 2
    - name: country
      label: Land
      row: 4
      step: 2
    - name: email
      label: E-post
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Uppskattad ordervolym
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Behöver du anpassning?
      row: 7
      step: 2
    - name: productInterest
      label: Intressanta produktkategorier
      row: 8
      step: 2
    - name: subject
      label: Ämne
      row: 9
      step: 3
    - name: message
      label: Meddelande
      row: 10
      type: textarea
      rows: 6
      step: 3

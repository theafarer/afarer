content_html: |
  <h2>Mi az a Drop Stitch?</h2>
  <p>A drop stitch (más néven "drop-stitch szövet" vagy "drop-stitch mag") egy szerkezeti módszer, amelyben több ezer egyedi poliészter szál köti össze egy szövetburok felső és alsó rétegét. Amikor a burkot felfújják, ezek a szálak belső húzóelemekként működnek — megakadályozzák, hogy a felső és alsó panelek kifelé domborodjanak kerek formává, és kényszerítik a panelt, hogy lapos és merev maradjon.</p>
  <p>Az eredmény egy könnyű, hordozható szerkezet, amely 15 – 20 PSI belső nyomást bír — összevethető egy kemény héjú lap merevségével, de teljesen leereszthető tároláshoz és szállításhoz.</p>

  <h2>Hogyan működik: a fizika</h2>
  <p>Egy hagyományos felfújható szerkezetben (mint egy léggömb vagy légtámatrac) a belső légnyomás minden irányba egyformán nyom. Belső visszatartás nélkül a szerkezet henger vagy gömb alakúvá válik. A drop stitch ezt húzásos megerősítés bevezetésével oldja meg:</p>
  <ul>
    <li>Több ezer szál köti össze a felső és alsó szövetréteget</li>
    <li>Felfújáskor a légnyomás megpróbálja szétnyomni a felső és alsó réteget</li>
    <li>A szálak ellenállnak ennek a szétnyomásnak, átvive a terhelést húzásba a szál tengelye mentén</li>
    <li>Az eredmény egy lapos, merev panel, amely ellenáll a hajlításnak</li>
  </ul>

  <h2>Szerkezeti folyamat</h2>
  <ol>
    <li><strong>Szövés:</strong> A poliészter szálakat egyidejűleg szövik két külön alap szövetrétegbe (jellemzően 1 100 DTEX vagy 1 680 DTEX PVC-bevonatú poliészter). A szálak hurkosan szövődnek a rétegek között 90&deg;-os szögben.</li>
    <li><strong>Bevonás:</strong> A szőtt alap szövetet PVC-vel (vagy alkalmanként TPU-val) vonják be késkés bevont vagy kalanderezett bevonási eljárással. Ez lezárja a szálakat és létrehozza a légmentes membránt.</li>
    <li><strong>Rétegragasztás:</strong> A drop-stitch magot külső laminált rétegekhez kötik (jellemzően 0,9 mm vagy 1,2 mm PVC) hőlaminálással vagy ragasztással.</li>
    <li><strong>Hegesztés:</strong> Oldalpálya sávokat hegesztenek az élekre forró levegős hegesztéssel, RF hegesztéssel vagy nagyfrekvenciás hegesztéssel a lap oldalfalainak létrehozásához.</li>
    <li><strong>Szelepbeszerelés:</strong> Boston vagy Halkey-Roberts szelepeket szerelnek be, jellemzően túlnyomás-leeresztő mechanizmussal a túlfújás megelőzésére.</li>
  </ol>

  <h2>Fő minőségi mutatók</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Paraméter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Belépő szint</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Prémium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Szálsűrűség</td><td class="p-3 border">1 szál / négyzethüvelyk</td><td class="p-3 border">2 szál / négyzethüvelyk</td></tr>
      <tr><td class="p-3 border">Alap szövet</td><td class="p-3 border">1 100 DTEX</td><td class="p-3 border">1 680 DTEX</td></tr>
      <tr><td class="p-3 border">Maximális nyomás</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">PVC vastagság</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 border">Oldalpálya szerkezet</td><td class="p-3 border">Hajtott és ragasztott</td><td class="p-3 border">Hegesztett és fúziós kötésű</td></tr>
    </tbody>
  </table>

  <h2>Alkalmazások</h2>
  <ul>
    <li><strong>SUP lapok:</strong> 4" – 6" vastagság, 15 – 20 PSI, 1 – 2 szál/négyzethüvelyk</li>
    <li><strong>Kajakok:</strong> Drop-stitch padló + felfújható oldalkamrák, 10 – 15 PSI padló</li>
  </ul>

  <h2>Drop Stitch vs. légpadló (üvegszálas vagy fa mag)</h2>
  <p>A kemény héjú lapok EPS habmagokat használnak üvegszálas vagy fa merevítő megerősítéssel. Könnyebbek, merevebbek és reagálóbbak — de nem ereszthetők le. A drop stitch némi merevséget ad a teljes hordozhatóságért. A legtöbb szabadidős felhasználó számára a modern 20 PSI-s drop-stitch SUP-ok megkülönböztethetetlenek a belépő szintű kemény lapoktól merevségben.</p>

  <h2>Hogyan használja az Afarer a Drop Stitch-et</h2>
  <p>Az Afarer 1 680 DTEX drop-stitch magot használ SUP kínálatában, négyzethüvelykenként 2 szálal és 1,2 mm PVC külső laminátummal. A lapok 20 PSI-re vannak minősítve, és szállítás előtt 24–48 órás nyomástartási teszten esnek át a névleges nyomás 1,25-szörösén. Az oldalpálya sávokat forró levegővel hegesztik hármas rétegű fúzióval, és a túlnyomás-leeresztő szelepek minden modellnél szabványosak.</p>


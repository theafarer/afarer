    - name: 'Professzionális flotta'
      tagline: 'Bevált kluboknak, 50-100 tag'
      features:
        - '30 SUP deszka (3 méretvariáció)'
        - '30 evező + 30 mentőmellény'
        - '5 pumpa + 2 javítókészlet + tárolóállvány'
        - 'Egyedi klubszínek + logó a deszkákon'
        - 'Cserealkatrész-program (15% kedvezmény)'
        - 'Személyzeti képzés (online)'
        - 'CE tanúsított — minden felszerelés'

      cta_text: 'Flotta felépítése'
    - name: 'Versenyflotta'
      tagline: 'Versenykluboknak, rendezvényekre, versenyekre'
      features:
        - '50+ verseny-/teljesítménydeszka'
        - 'Teljes tartozékkészlet (evezők, mellények, pumpák)'
        - 'Rendezvénytámogatási készlet (rajtbóják, jelölők)'
        - 'Elsőbbségi alkatrészek (24 órás kiszállítás)'
        - 'Dedikált ügyfélmenedzser'
        - 'Egyedi csapatmezek opció'
        - 'CE tanúsított — minden felszerelés'

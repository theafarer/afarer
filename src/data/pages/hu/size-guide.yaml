how_to_choose:
  title: Hogyan válassza ki a megfelelő méretet
  cards:
    - title: SUP lapok
      description: Válasszon hosszat a súlya és a tervezett használat alapján. A szélesebb lapok (32"+) több stabilitást nyújtanak. A hosszabb lapok (11-12 láb) jobban tartják az irányt túrázáshoz. A nehezebb evezőknek nagyobb térfogatú lapokra van szükségük.
    - title: Túra SUP-ok
      description: A hosszabb lapok (11–12 láb) a legjobbak távolságok megtételéhez és túrázáshoz. A szélesebb lapok (32"+) több stabilitást nyújtanak. Ellenőrizze a teherbírást a teljes terhelésre beleértve a felszerelést.
    - title: All-around SUP-ok
      description: Válasszon hosszat evező súlya és a tervezett használat szerint. Az all-around lapok megfelelőek szabadidőre, fitneszre és jógához. A kisebb lapok mozgékonyabbak.

oem_section:
  tagline: 'OEM projektek'
  title: 'Márka- és OEM partnerségi esettanulmányok'
  subtitle: 'A koncepciótól a konténerig — hogyan segítünk globális márkáknak felfújható SUP vonalaikat elindítani és bővíteni.'
  cases:
    - challenge: 'Európai szabadidő-kiskereskedőnek saját márkás SUP vonalra volt szüksége egyedi fedélzeti grafikákkal, környezetbarát PVC-vel és kereskedelmi forgalomba lépésre kész csomagolással — mindezt 60 napon belül leszállítva.'
      solution: 'Egyedi digitális nyomtatási fájlokat fejlesztettünk, REACH-megfelelő PVC-t szereztünk be, és a mintavételt 3 körölről 1-re csökkentettük a tervezőcsapat qingdaói gyárunkban való elhelyezésével.'
      result: '55 nap a aláírt megrendeléstől az FOB-ig. 2 400 darab 4 SKU-ban. Ismételt megrendelés még az első konténer megérkezése előtt.'
    - challenge: 'Amerikai vízisport-startupnak nagy teljesítményű drop-stitch SUP-ra volt szüksége egyedi formával, közös márkás csomagolással és BSCI-tanúsítással a kereskedelmi elhelyezéshez.'
      solution: 'A meglévő SUP formát módosított körvonalakkal alkalmaztuk, közös márkás csomagolástervezést fejlesztettünk, és teljes BSCI auditdokumentációt biztosítottunk.'
      result: 'Sikeresen bekerült 3 nagy amerikai szabadidő-láncba. 5 000+ darab az első évben, 98%-os értékesítési aránnyal.'
    - challenge: 'Ausztrál forgalmazó CE-tanúsítványú SUP sort igényelt egyedi színekkel és az ausztrál szabványoknak való megfeleléssel.'
      solution: 'Gyártás előtti mintákat készítettünk 4 színvariánssal, és harmadik félnek szánt megfelelőségi tesztelést koordináltunk.'
      result: '3 modellből álló SUP sor indult az AU/NZ piacon. Ezt követte egy kormányzati pályázat megnyerése 12 járőr SUP-ra.'

faq_section:
  tagline: 'GYIK'
  title: 'B2B és OEM gyakran ismételt kérdések'
  questions:
    - q: 'Mennyi a minimális rendelési mennyiség (MOQ) OEM felfújható SUP deszkákhoz?'
      a: 'Az MOQ 5–10 darabnál kezdődik standard OEM modelleknél. Az egyedi formák és saját márkás projektek legalább 200 darabot igényelnek a komplexitástól függően. Próbarendelések és mintamenetek elérhetők új márkaindításokhoz.'
    - q: 'Rendelkezik-e az afarer BSCI-tanúsítvánnyal?'
      a: 'Igen. Gyárunk érvényes BSCI társadalmi megfelelőségi tanúsítvánnyal rendelkezik (auditjelentés kérésre elérhető). Emellett ISO 9001 tanúsítvánnyal rendelkezünk a minőségirányítás terén, és minden termék CE-tanúsítással rendelkezik. REACH- és RoHS-megfelelőségi dokumentációt biztosítunk minden OEM szállításhoz.'
    - q: 'Mennyi egy OEM rendelés tipikus átfutási ideje?'
      a: 'A standard átfutási idő 30–45 nap a visszaigazolt megrendeléstől és az előlegtől számítva tömeges OEM gyártás esetén. Az egyedi formafejlesztés 15–20 napot ad a szerszámokhoz. Sürgős megrendelésekhez és szezonális csúcsokhoz gyorsított gyártás érhető el. A prototípus-minták jellemzően 15–20 napon belül szállíthatók.'
    - q: 'Szállítanak FOB Qingdao vagy CIF feltételekkel a kikötőnkbe?'
      a: 'Igen. FOB Qingdao, CIF a nagy globális kikötőkbe, valamint DDP a minősített partnereknek szállítunk. Logisztikai csapatunk kezeli a konténerfoglalást, a kiviteli dokumentációt és a vámeljárást. 50+ országba szállítunk az EU, USA, Ausztrália és ázsiai piacokra.'

b2b_moq: 'Standard MOQ: 5–10 darab modellenként. Próbarendelések szívesen látottak új partnerségekhez.'

production_flow:
  tagline: 'Gyártási folyamat'
  title: 'Az anyagtól a kész deszkáig'
  subtitle: 'Minden deszka 6 gyártási szakaszon megy át, minden lépésben QC ellenőrzési pontokkal. Nincs rövidebb út, nincs kihagyott ellenőrzés.'
  stages:
    - stage: '01'
      title: 'Anyagbeérkezés és bejövő QC'
      description: 'Minden beérkező anyagot tétel-/lot-szám szerint rögzítünk ERP rendszerünkben. A PVC szövettekercseket, drop-stitch magokat, szelepeket, ragasztókat és hardvereket karanténba helyezzük a QC jóváhagyásáig.'
      qc_check: 'Húzószilárdság (ASTM D751), szakítószilárdság (ISO 4674), vastagságmérés, ragasztóviszkozitás, vizuális hibakeresés'
      qc_threshold: 'A tételek 100%-a tesztelve. Elutasítás, ha a húzószilárdság < a specifikáció 90%-a, a szakítószilárdság < a minimum specifikáció, vagy bármilyen vizuális hiba'
      responsibility: 'Bejövő QC csapat (3 ellenőr)'
    - stage: '02'
      title: 'CNC vágás és anyagelőkészítés'
      description: 'A számítógéppel optimalizált elrendezés lapokat helyez el a PVC készleten a hulladék minimalizálása érdekében. Az automatikus CNC vágógépek 0,1 mm pozicionálási pontosságot tartanak fenn.'
      qc_check: 'Méretellenőrzés a CAD DXF fájlokkal szemben, élminőség-ellenőrzés, panelszám-ellenőrzés'
      qc_threshold: 'Minden 20. panel megmérve. Tolerancia ±0,5 mm. Tétel elutasítása, ha >2% a tolerancián kívül esik'
      responsibility: 'Vágóműhely-vezető'
    - stage: '03'
      title: 'Hegesztés és drop-stitch ragasztás'
      description: 'A drop-stitch magokat külső PVC laminátumokhoz hőlaminálással rögzítik. A csőkamrákat RF-hegesztéssel vagy forró levegős hegesztéssel készítik. Az élsávokat háromrétegű fúziós ragasztással rögzítik.'
      qc_check: 'Hámozási teszt 50 darabonként (ASTM D751), hegesztésszélesség-mérés, forró levegős hőmérsékletnapló felülvizsgálata, vizuális varratvizsgálat háttérvilágításnál'
      qc_threshold: 'Hámozási szilárdság minimum 8 N/cm. Hegesztésszélesség-tolerancia ±1 mm. Bármilyen látható csatornaképződés = elutasítás'
      responsibility: 'Hegesztési QC (2 ellenőr műszakonként)'
    - stage: '04'
      title: 'Szerelés és felszerelés'
      description: 'A deszkák a végső szerelésre kerülnek, ahol minden alkatrész összekapcsolódik: élek ragasztása és hegesztése, szelepek beszerelése, D-gyűrűk, fogantyúk, uszonnytokok és hordtáska illesztése. Minden egység 100 pontos szerelési ellenőrzőlistát követ.'
      qc_check: '100 pontos ellenőrzőlista jóváhagyása egységenként, szelep működési teszt (10 nyitási/zárási ciklus), hardvernyomaték-ellenőrzés, vizuális ellenőrzés'
      qc_threshold: 'Zéró hiba irányelv a biztonságkritikus elemekre (szelepek, D-gyűrűk, fogantyúk). Kisebb kozmetikai: AQL 2,5 (ISO 2859)'
      responsibility: 'Szerelőcsapat-vezető + sor QC'
    - stage: '05'
      title: 'Nyomástartóssági teszt és minőségi várakozás'
      description: 'Minden kamrát a névleges nyomás 1,25-szörösére fújnak fel (jellemzően 20–25 PSI), és 24–48 órán át tartanak. A nyomásérzékelők folyamatosan naplóznak. Az 5%-ot meghaladó nyomásesésű kamrák elutasításra kerülnek, és varrat-újravizsgálatra küldik.'
      qc_check: '24–48 órás nyomástartási napló, érzékelőkalibráció napi ellenőrzése, hőmérséklet-kompenzált nyomásleolvasás, varrat-újrateszt javítás után'
      qc_threshold: 'Maximum 5% nyomásesés 24–48 óra alatt stabil hőmérsékleten. Bármely kamra, amely ezt túllépi = a teljes gyártási tétel 100%-os újratesztelése'
      responsibility: 'Minőségi labor (független a gyártástól, a vezetésnek jelent)'
    - stage: '06'
      title: 'Végső ellenőrzés és csomagolás'
      description: 'Végső vizuális és működési ellenőrzés. Felületi hibák, színkonzisztencia, címke/BIN ellenőrzése, csomagolás épsége és tartozékok teljessége. Az egységeket vákuumcsomagolják, dobozolják és raklapra helyezik a konténerbe töltéshez.'
      qc_check: 'Teljes vizuális ellenőrzés, tartozék-ellenőrzőlista SKU-nként, csomagolás-eldobási teszt (1 m, véletlenszerű minta), címke/vonalkód-szkennelés ellenőrzése'
      qc_threshold: 'AQL 2,5 a jelentős hibákhoz, AQL 4,0 a kisebbekhez. Zéró tolerancia a biztonsági hibákra. Az egységek 100%-a vizuálisan ellenőrizve'
      responsibility: 'Végső QC csapat (4 ellenőr) + Csomagolócsapat-vezető'


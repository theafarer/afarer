intro:
  - 'Az **Aquafarer LLC (USA)** gyártási ágaként az afarer qingdaói működési csapata a gyártás minden szakaszát ellenőrzi — a nyers PVC és üvegszálas anyagok beérkezésétől a kész deszta szállítás előtti végső ellenőrzéséig. A Qingdaói Gazdasági Fejlesztési Zónában található gyártási létesítményünk 12 000 négyzetméteres, és külön műhelyeket foglal magában a PVC vágáshoz, a cső hőhegesztéshez, az FRPforma-készítéshez, a SUP digitális nyomtatáshoz, a végső szereléshez és a minőségi teszteléshez.'
  - 'A tervezés, a mérnöki munka, a prototípus-készítés, a gyártás és a tesztelés egy fedél alatti integrálásával megszüntetjük a bérgyártás hatékonysági problémáit, és közvetlen ellenőrzést tartunk a gyártási minőség, az anyagválasztás és a szállítási határidők felett. Minden deszka, amely elhagyja műhelyünket, a mi embereink által, a mi felszereléseinken, a mi szabványaink szerint készül.'


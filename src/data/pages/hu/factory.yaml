workshops_section:
  tagline: 'Műhelyek'
  title: 'Gyártóműhelyek'
  workshops:
    - title: 'PVC vágás és anyagelőkészítés'
      description: 'Automatikus CNC vágógépek dolgozzák fel a PVC- és drop-stitch szöveteket egy milliméternél pontosabban. A számítógéppel optimalizált elrendezés minimalizálja az anyagpazarlást, és biztosítja, hogy minden panel megfeleljen a méretbeli előírásoknak hegesztés előtt.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Csőhegesztés és hőzárás'
      description: 'Külön hegesztőműhely hőzáró gépekkel és RF dielektromos présekkel. A forró levegős hőzárók összekötik és összekapcsolják a PVC csőkamrákat, míg az RF hegesztések nagy szilárdságú, légmentes varratokat hoznak létre, amelyek túllépik az EN ISO 25649 követelményeit.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'FRP formák és kompozitgyártás'
      description: 'Egyedi FRP formák SUP alkatrészekhez, kézi üvegszálas laminálással, poliészter- és vinilésztergyantákkal. Minden réteget kézzel hengerelnek és vákuumtasakba helyeznek a következetes minőség érdekében. A zselékétr-fúvóbooth magas fényű, UV-álló tengeri felületet biztosít.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'SUP nyomtatás és dekorálás'
      description: 'A SUP deszkákat digitális nyomtatással dekoráljuk teljes színes grafikákhoz, illetve szitanyomtatással logókhoz és ismétlődő mintákhoz. A digitális nyomtatók fotóminőségű fedélzeti terveket készítenek, a szitanyomtatás pedig tartós, élénk márkajelzéseket szolgáltat.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Végső szerelés és felszerelés'
      description: 'Szerelő sor, ahol a drop-stitch magokat élekkel látnak el, EVA fedélzeteket visznek fel, valamint uszonyokat, szelepeket és tartozékokat szerelnek be. Minden deszka egy 100 pontos szerelési ellenőrzőlistát követ, amelyet a csapatvezető hagy jóvá.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Minőségi tesztelés és ellenőrzés'
      description: 'Minden elkészült deszka kötelező légtartóssági tesztelésen, varrat-hámozás ellenőrzésen és teljes rendszervizsgálaton megy át szállítás előtt. Minőségi laborunk független a gyártástól, és közvetlenül a vezetésnek jelent.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


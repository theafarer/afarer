faqs:
  title: 'Közös márka — GYIK'
  subtitle: 'Hogyan működik az Afarer közös márka, és miben különbözik az OEM-től és a saját márkától.'
  items:
    - title: 'Ugyanaz-e a közös márka, mint az OEM vagy a saját márka?'
      description: 'Nem. Az Afarer már nem működtet nyílt OEM/saját márka programot. A közös márkás termékek Afarer termékek maradnak — az Afarer márka tervezi, fejleszti, ellenőrzi és áll mögötte. Az Ön identitása közös márkaként jelenik meg, nem pedig névtelen harmadik fél termékként.'
    - title: 'Ki indíthat közös márka projektet?'
      description: 'Minősített vízisport vállalkozások: meglévő országos partnerek, paddle klubok, üdülők és szállodák, rendezvényszervezők és közösségek. Küldjön egy projektbreefet, és a tervezési munka megkezdése előtt megerősítjük a alkalmazhatóságot.'
    - title: 'Ütközik-e a közös márka az országos forgalmazómmal?'
      description: 'Nem. Az egy ország — egy forgalmazó modell elsőbbséget élvez. A közös márkás kollekciók a helyi országos partnerrel koordináltak, ahol ilyen létezik, így nem jelenik meg párhuzamos vagy versengő márka a védett területen belül.'
    - title: 'Mekkora a minimális rendelés egy közös márkás kollekcióhoz?'
      description: 'A Pilot kollekciók 30–50 egységnél indulnak. A szabványos kollekciók 50–100 egység; a nagy vagy több régiós kiadások 100+ egység. Az egyedi fejlesztési ütemtervek projektenként kerülnek meghatározásra.'
    - title: 'Mi tartozik az Afarer minőséghez és mi a partner hozzájárulásához?'
      description: 'Az Afarer tulajdonolja a terméktervezést, mérnökséget, anyagokat, szerkezetet, minőség-ellenőrzést és garanciát. A partnerek hozzájárulnak a kollekció koncepciójához, elnevezéséhez, színekhez, grafikai inputhoz és piacra lépéshez. Ez tartja fenn az egyetlen minőségi szabványt a vízen.'
    - title: 'Hogyan jelentkezhetek?'
      description: 'Töltse ki a közös márka érdeklődési űrlapot vállalkozásával, piacával és kollekcióötletével. Átnézzük az illeszkedést, majd 3 munkanapon belül válaszolunk javaslattal és a Közös Márka Projektmegállapodással.'

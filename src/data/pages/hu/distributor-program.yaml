faqs:
  title: 'Országpartnerség — GYIK'
  subtitle: 'A kérdések, amelyeket komoly országpartnerek tesznek fel a jelentkezés előtt.'
  items:
    - title: 'Mit jelent valójában az egy ország — egy forgalmazó elv?'
      description: 'Az Afarer egyetlen, meghatározott területre kizárólagos jogokkal rendelkező, engedéllyel ellátott forgalmazót nevez ki. Nem értékesítünk globális vagy regionális csatornáinkból egy védett országba. Az Ön területi tulajdonosa addig áll fenn, amíg a Disztribúciós Megállapodás feltételei teljesülnek.'
    - title: 'A terület örökre kizárólagos?'
      description: 'Nem. A kizárólagosság feltételes, nem örökös. Fenntartása aláírt Disztribúciós Megállapodáson, az első rendelés teljesítésén, éves beszerzési célokon, helyi készleten, értékesítés utáni képességeken és folyamatos piaci befektetésen alapul. Ha ezek nem teljesülnek, a terület újrakövetelhető vagy újból kiosztható.'
    - title: 'Mekkora a minimális első rendelés?'
      description: 'Az országos és regionális forgalmazók 100–300 egységgel kezdnek; a felhatalmazott kereskedők 30–50 egységgel; a próbarendelések 10–30 egységtől lehetővé teszik a piac előzetes validálását (a próbát- és mintarendelések nem járnak területi védelemmel). Az egyedi és saját márkás programok a fenti szintekben felsorolt, eltérő MOQ-kat követik.'
    - title: 'Mit tartalmaz a 10 modulos támogatási program?'
      description: 'Szintek és minősítés, területi védelem, MOQ / árazás / éves visszatérítések, készlet- és rendeléskivitelezés, marketinganyagok és közös piaci alapok, termék- / értékesítési / műszaki képzés, alkatrészek és értékesítés utáni támogatás, garanciaregisztráció, a partnerportál, valamint termékműszaki adatlapok, marketinganyag-könyvtár, éves visszatérítési ütemezés és szállítási és csomagolási listák.'
    - title: 'Hogyan véd meg az Afarer a csatornaütközésektől?'
      description: 'Minden területen pontosan egy engedéllyel rendelkező forgalmazó működik. Az Ön régiójából érkező megkeresések és közvetlen megrendelések Önhöz kerülnek, a weboldal űrlapjai továbbításra kerülnek a helyi partnerhez, ahol ilyen létezik, a globális csapat pedig csak akkor lép közbe, ha egy partner nem válaszol.'
    - title: 'Mik a szállítási és fizetési feltételek?'
      description: 'A rendelések FOB Qingdao feltételekkel, teljes kiviteli dokumentációval kerülnek szállításra. A termelési rendeléseknél 30% előleg és 70% szállítás előtt fizetendő; a próbat- és mintarendelések előrefizetésesek. A standard átfutási idő 30–45 munkanap, mintameneteknél 15–20 munkanap.'
    - title: 'Hogyan jelentkezhetek?'
      description: 'Küldje el jelentkezését a kapcsolatfelvételi űrlapon keresztül, a piaci részletek megadásával. Átvizsgáljuk a piaci illeszkedést, a kiskereskedelmi jelenlétet és a logisztikai képességeket, majd 3 munkanapon belül válaszolunk a következő lépésekkel és egy minta Disztribúciós Megállapodással.'

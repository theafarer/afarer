features:
  title: 'Miért érdemes az Afarerrel partnerségre lépni'
  subtitle: 'Egy ország — egy forgalmazó modell, a terület kifizetődővé tételéhez szükséges támogatási struktúrával. A kizárólagosságot meg kell szolgálni és fenntartani — ez nem örökös jog.'
  columns: 3
  items:
    - title: 'Területi kizárólagosság'
      description: 'Országonként vagy régiónként egy engedéllyel rendelkező forgalmazó. Nincs párhuzamos import, nincs belső verseny. Az Ön befektetése a saját védőárkot építi.'
      icon: 'tabler:shield-check'
    - title: 'Védelem a csatornaütközésekkel szemben'
      description: 'Az Ön régiójából érkező közvetlen megrendelések Önhöz kerülnek, az árazás pedig védi az Ön árresét. Az Afarer nem kerüli meg országpartnereit az értékesítésben.'
      icon: 'tabler:users'
    - title: 'Közvetlen gyári árrések és visszatérítések'
      description: 'Kereskedői árlista a vállalt mennyiségekhez járó visszatérítésekkel. Nincsenek közvetítők. FOB Qingdao szállítás teljes kiviteli dokumentációval.'
      icon: 'tabler:coins'
    - title: '10 modulos partneri támogatási program'
      description: 'Bevezetés, piacra lépés, képzés, marketing és közös piaci finanszírozás, alkatrészek és értékesítés utáni támogatás, garancia, rendelési eszközök és partnerportál — mindezt a Disztribúciós Megállapodás tartalmazza.'
      icon: 'tabler:rocket'
    - title: 'Marketing és közös piaci alapok'
      description: 'Lokalizált kampányanyagok, kereskedői POS-anyagok, rendezvénykészletek, több nyelvű digitális tartalmak és közös marketingtámogatás a bevezetési szezonokhoz.'
      icon: 'tabler:mood-smile'
    - title: 'Termék-, értékesítési és műszaki képzés'
      description: 'Strukturált bevezető foglalkozások termékekre, értékesítésre és műszaki ismeretekre vonatkozóan, a kínálat fejlődésével frissített anyagokkal.'
      icon: 'tabler:presentation'
    - title: 'Alkatrészek és értékesítés utáni támogatás'
      description: 'Alkatrész-ellátás, garanciaregisztráció és kárrendezés, valamint termékműszaki adatlapok és kézikönyvek az Ön helyi szervizcsapata számára.'
      icon: 'tabler:settings'
    - title: 'Dedikált ügyfélmenedzser és partnerportál'
      description: 'Személyes forgalmazói menedzser, valamint hozzáférés az árlistákhoz, a rendelési státuszhoz és a marketinganyagokhoz az Afarer partnerportálon keresztül.'
      icon: 'tabler:user-check'

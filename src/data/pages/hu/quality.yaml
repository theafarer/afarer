meta:
  title: 'Minőség és tesztelés — Gyártási kontroll | {SITE}'
  description: 'afarer minőségi rendszer: független tesztlabor, ISO 9001 folyamatok és minden egység szállítás előtt tesztelve. Minőségkontroll a felfújható SUP gyártáshoz.'
  keywords:
    - 'sup minőségkontroll'
    - 'felfújható sup tesztelés'
    - 'paddle board minőségbiztosítás'
    - 'sup gyár minőség'
hero:
  tagline: 'Minőségbiztosítás'
  title: 'Teljesítmény- és minőségi tesztelés'
  subtitle: 'Minden afarer felfújható SUP szigorú teljesítmény- és minőségkontroll-tesztelésen megy át a K+F központunkban, mielőtt kiszállításra kerül. Átfogó SUP minőségi tesztelésünk kézzelfogható bizonyítékot nyújt a termékkiválóságról az OEM és nagykereskedelmi vásárlók számára.'

stats:
  - value: 100%
    label: 'Nyomásvizsgált egységek'
  - value: '8'
    label: 'Tesztelési protokollok'
  - value: ISO 9001
    label: 'Minőségileg tanúsított'
  - value: '3 éves'

tests:
  - title: 'Nyomásvizsgálat'
    description: 'A felfújható kamrákat az ajánlott üzemi határértékeket meghaladó nyomásnak teszik ki meghosszabbított időtartamra. Ez ellenőrzi az anyag és a varratok légtömítését és szerkezeti épségét, biztosítva, hogy a termék ellenálljon a tervezett használatnak és a lehetséges túlfújásnak meghibásodás vagy szivárgás nélkül.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Ütésvizsgálat'
    description: 'A termékeket különböző súlyokból és szögekből származó, kontrollált ütéseknek vetik alá. Ez az anyag szúrás-, szakítás- és a vízben lévő akadályokkal való ütközési károsodással szembeni ellenállását értékeli, a tartósságot és hosszú élettartamot bizonyítva.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'UV-állósági teszt'
    description: 'Az anyagminták gyorsított UV-expozíción esnek át, amely az erős napfény éveit szimulálja, majd újra tesztelik őket húzószilárdság-megtartásra és színtartósságra. Ez igazolja, hogy a PVC keverékek ellenállnak a kifakulásnak, krétásodásnak és repedésnek, biztosítva a hosszú távú tartósságot napos tengeri környezetben.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Kopásállósági teszt'
    description: 'Az anyagmintákat kopó felületekhez dörzsölik meghatározott számú cikluson át kontrollált nyomás alatt. Ez az anyag ismételt használatból, homokkal, sziklákkal vagy más felületekkel való érintkezésből eredő kopással szembeni ellenálló képességét méri, a hosszú távú tartósságot biztosítva.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Alacsony hőmérsékletű teljesítményteszt'
    description: 'A termékeket hideg környezetben tesztelik a működőképesség és tartósság értékelésére különféle hőmérsékleti viszonyok között, megakadályozva a merevséget vagy repedést hidegebb vizekben. Elengedhetetlen a téli vagy magas szélességi fokon használt deszkákhoz.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Felhajtóerő- és terhelési kapacitás teszt'
    description: 'A termékeket különböző súlyokkal tesztelik a maximális teherbíró képesség meghatározásához, és hogy biztosítsák a felhasználók és felszerelés biztonságos hordozását. Minden modell névleges kapacitása ellenőrzésre kerül a piacra lépés előtt.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Manőverezési teszt'
    description: 'A termékek evezési vagy motoros bemenetekre való reagálását tesztelik, a fordulási sugarat és a kezelhetőséget értékelve. A vízen végzett próbák igazolják, hogy a valós kezelési jellemzők megfelelnek a tervezési specifikációknak.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Vízállósági teszt'
    description: 'A teljesen összeszerelt termékeket vízbe merítik vagy vízpermetnek vetik alá a varratokon, szelepeken vagy anyagokon átmutató szivárgások ellenőrzésére. Minden deszka kötelező vízállósági ellenőrzésen esik át a szállítás előtt.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp


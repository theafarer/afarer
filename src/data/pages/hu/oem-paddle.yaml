  items:
    - title: 'Hogyan hozhatom létre saját evezőmárkámat?'
      description: 'Indítsa el márkáját 16 hét alatt: rövid ismertető, tervezés, CE-tanúsított prototípus, sorozatgyártás és szállítás. Fedezze fel OEM csomagjainkat.'
    - title: 'Mekkora a gyártási átfutási idő?'
      description: 'A minta 2-3 hét alatt készül el, a sorozatgyártás 30-45 nap a mennyiségtől függően.'
    - title: 'Viseli az evező a logónkat?'
      description: 'Igen — teljes saját márka: logónyomtatás, egyedi színek, csomagolás és címkék az Ön márkájában.'
    - title: 'Vásárolhatok nagy tételben az első naptól?'

hero:
  tagline: 'afarer egyedi labor'
  title: 'Tervezze meg saját<br />SUP deszkáját'
  subtitle: 'Egyedi SUP partner, amely co-brand, saját márkás és egyedi paddle board gyártást kínál vállalkozásoknak világszerte. Egyetlen prototípustól a teljes gyártási sorokig.'
  cta: 'Projekt indítása'
  footer_link: /contact

steps_section:
  tagline: 'Hogyan működik'
  title: 'A koncepciótól a gyártásig'
  subtitle: 'Négy lépés az Ön ötletétől a kész, tengerre alkalmas termékig.'
  steps:
    - num: '01'
      title: 'Válassza ki a deszkáját'
      desc: 'Válasszon alap SUP modelljeinkből — all-around, túra, jóga, sport vagy gyerek. Válasszon méretet, anyagot és színt.'
    - num: '02'
      title: 'Töltse fel a tervezését'
      desc: 'Küldje el logóját, grafikáját vagy márka útmutatóját. Tervezőcsapatunk digitális előnézetet készít.'
    - num: '03'
      title: 'AI modell átnézése'
      desc: 'Tekintse meg az egyedi deszkája fotórealisztikus, AI által generált modelljét a gyártás megkezdése előtt.'
    - num: '04'
      title: 'Gyártás és szállítás'
      desc: 'Jóváhagyás után a rendelése bekerül a termelési vonalunkra. Átfutási idő 30 naptól.'

services_section:
  tagline: 'Szolgáltatások'
  title: 'Gyártási szolgáltatások globális márkáknak'
  subtitle: 'Rugalmas együttműködési modellek — a szerződéses gyártástól a teljes szolgáltatású márkáépítésig.'
  items:
    - title: 'Co-brand gyártás'
      desc: 'Az Ön terveit specifikáció szerint gyártjuk — az Ön szellemi tulajdona, az Ön rajzai, az Ön minőségi szabványai. Teljes NDA-védelem.'
      icon: ⚙️
    - title: 'Tervezési megoldások'
      desc: 'Válasszon 50+ bevált platform közül, és szabhassa testre a méretet, színt, grafikát és csomagolást.'
      icon: '🎨'
    - title: 'Saját márka'
      desc: 'Az Ön márkája a termékeinken — logó, csomagolás, akasztócímkék, kézikönyvek. A dobozból kivéve azonnal értékesíthető.'
      icon: '🎨'
    - title: 'Egyedi márkázás'
      desc: 'Fedélzetpárna-nyomtatás, hajótestgrafika, csőmatricák és egyedi címkék — teljes márkaintegráció.'
      icon: ⚙️


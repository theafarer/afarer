meta:
  title: 'Csapatunk — Tengerészmérnökök és építők | {SITE}'
  description: 'A 2012-ben Qingdaóban alapított afarert tengerészmérnökök, anyagtudósok és vízisport-rajongók építették. Ismerje meg a gyár mögött álló csapatot.'
  keywords:
    - 'afarer csapat'
    - 'tengerészmérnökök'
    - 'felfújható sup gyártó'
    - 'sup gyár csapata'
hero:
  tagline: 'Csapatunk'
  title: 'Az afarer mögött álló emberek<br />— Szabadság mérnöki munkája a vízen'
  subtitle: 'A 2012-ben a kínai Qingdaóban alapított afarert tengerészmérnökök, anyagtudósok és vízisport-rajongók építették, akik abban hittek, hogy a professzionális minőségű felfújható vízijárművek világszerte elérhetővé kell váljanak.'
  image:
    src: /images/team-all.webp
    alt: 'afarer teljes csapatfotó — mérnökség, gyártás és vezetés'
founding:
  tagline: 'Alapításunk'
  title: 'Egy part menti műhelytől<br />a 12 000 m²-es létesítményig'
  subtitle: 'Az afarert tengerészmérnökökből álló csapat alapította, akik évtizedek összegyűlt tapasztalatával rendelkeztek felfújható SUP tervezés, PVC-feldolgozás és globális vízi felszerelésgyártás terén.'
  items:
    - title: 'Alapítva: 2012'
      description: 'A kínai Qingdaóban lett megalapítva — egy jelentős tengeri központban, mély hajóépítési hagyományokkal.'
      icon: tabler:calendar
    - title: '200+ munkatárs'
      description: 'Beleértve 50+ K+F mérnököt, minőségkontroll-szakembereket és gyártási technikusokat.'
      icon: tabler:users
    - title: '12 000 m²-es létesítmény'
      description: 'Dedikált gyártóüzem 6 termelési vonallal a felfújható SUP deszkákhoz.'
      icon: tabler:building-factory
    - title: '50+ kiszolgált ország'
      description: 'Exportálva Európába, Amerikába, a Közel-Keletre, az ázsia-csendes-óceáni régióba és Afrikába.'
      icon: tabler:globe

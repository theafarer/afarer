philosophy:
  tagline: 'Tervezési filozófia'
  title: 'Mérnöki vezetésű tervezés<br />— Minden részlet számít'
  subtitle: 'Mérnöki filozófiánk három elvre épül, amelyek minden általunk épített terméket irányítanak.'
  list:
    - 'Megbízhatóság először: Minden afarer terméket valós körülmények közötti ellenállásra tesztelnek — a hideg vízi mentési műveletektől a trópusi reszort-kölcsönzésig. Ott túlméretezünk, ahol a legfontosabb.'
    - 'Gyártási precizitás: Létesítményeink CNC vágást, nagyfrekvenciás hegesztést és automata nyomásvizsgálatot használnak. Minden varrat, minden szelep, minden csatlakozás dokumentált specifikációknak felel meg.'
    - 'Folyamatos innováció: K+F csapatunk folyamatosan értékeli az új anyagokat, gyártási módszereket és tervezési fejlesztéseket. Nem várunk a problémákra — előre látjuk azokat.'
cta:
  title: 'Szeretne projektet megvitatni a csapatunkkal?'

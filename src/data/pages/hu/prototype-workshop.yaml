intro: 'Egy CAD modell, bármilyen részletes, nem árulhatja el, hogyan viselkedik valójában egy lap, amíg nem találkozik a vízzel. Ezért prototípus műhelyünk arra lett tervezve, hogy a mérnöki adatokat a lehető leggyorsabban és legpontosabban fizikai, vízre kész lappá alakítsa át. Minden új Afarer modell — és minden jelentős egyedi gyártás — átmegy ezen a műhelyen, mielőtt a gyártóeszközöket lekötnék.'

content_html: |
  <h2>Ahol a dizájn valósággá válik</h2>
  <p>A műhely teljesen fel van szerelve a hajótest, oldalpályák és felszerelés egyidejű gyártására. Ez a párhuzamos munkafolyamat megközelítés a prototípus átfutási időt 8-12 hétre csökkenti a mérnöki kiadástól számítva, szemben az iparági normával, a 16-20 héttel. Amikor a jelentkezése specializált megoldást igényel, a koncepciótól a vízi érvényesítésig három hónapon belül eljuthatunk.</p>

  <h2>A műhely képességei</h2>
  <table>
    <thead><tr><th>Munkaállomás</th><th>Berendezés</th><th>Cél</th></tr></thead>
    <tbody>
      <tr><td>Hajótestgyártás</td><td>CNC szövetvágó, hőlamináló présgép, drop-stitch mag előkészítő állomás</td><td>Teljes méretű hajótestgyártás mindhárom szerkezeti típusban</td></tr>
      <tr><td>Oldalpálya és kamra szerelés</td><td>RF hegesztő présgép, forró levegős előrögzítő állomás, felfújási tesztállvány</td><td>Teljes méretű oldalpálya és kamra szerkezetek gyártása az összes válaszfalval és szeleppel</td></tr>
      <tr><td>Felszerelés és illesztés</td><td>Uszonydohány marógépes állvány, rakománytartó és fogantyú hegesztő sablonok, fedélzetburkoló vágóállomás</td><td>Teljes felszerelés: uszonyok, rakománytartók, kötélcsatlakozók, fogantyúk, fedélzetburkolatok, szelepek</td></tr>
      <tr><td>Műszercsarnok</td><td>GPS sebességérzékelő, nyomásadó-átalakítók, gyorsulásmérők, hőelem-tömb, adatnaplózó</td><td>Tengeri próba műszerek telepítése és kalibrálása</td></tr>
    </tbody>
  </table>

  <h2>A prototípus útja — lépésről lépésre</h2>
  <ol>
    <li><strong>Mérnöki átadás</strong> — A tervezési csomagot (3D modell, FEA jelentés, alkatrészlista, gyártási ütemterv) formálisan átnézi a műhelyvezető és a projektmérnök. Bármilyen gyártási aggályt jelentenek és megoldanak a vágás megkezdése előtt.</li>
    <li><strong>Hajótestgyártás</strong> — A hajótestet a mérnöki specifikáció szerint építik. Egyszeres rétegű szerkezetnél: a drop-stitch magot a meghatározott PVC borítással laminálják. Kétszeres rétegű szerkezetnél: a további borítót az alap laminátumra viszik fel, mielőtt a sablont kivágják. Összeolvadt szerkezetnél: a laminálási paramétereket a jóváhagyott folyamatlapról töltik be, és egy első mintán ellenőrzik.</li>
    <li><strong>Oldalpálya-gyártás</strong> — A szövetet CNC-sablon minták szerint vágják, majd RF-hegesztéssel teljes méretű oldalpályákká és kamrákká alakítják. Minden kamrát tesztnyomásra fújnak fel, és 24 órán át hagyják a kezdeti stabilizációhoz.</li>
    <li><strong>Szerelés és felszerelés</strong> — A hajótest és az oldalpályák összeillesztésre kerülnek. Usonydobozokat és rakománytartókat szerelnek be, kötélcsatlakozókat és hordozófogantyúkat építenek be, a felfújószelepet behajtják, a fedélzetburkolatot felhordják és igazítják.</li>
    <li><strong>Statikus tesztek</strong> — Mielőtt a lap vízbe ér, a következőkön esik át: úszóképesség-ellenőrzés (teljes terhelés + 30 % tartalék), kamra-nyomástartási teszt, szelep-leeresztési teszt, fogantyú és tartó húzóteszt.</li>
    <li><strong>Tengeri próba program</strong> — 20 óra vízi tesztelés, részletesen lentebb.</li>
    <li><strong>Prototípus értékelés</strong> — Formális jóváhagyó megbeszélés zajlik a mérnöki, gyártási és minőségi csapatokkal. Minden szükséges dizájn-módosítást dokumentálnak és beépítenek a gyártási kiadásba.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">20 órás tengeri próba program — Tesztütemterv</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 ó</span>
        <span class="flex-1">Nyugodt vízi ismerkedés — alacsony sebességű iránytartás, fordulás, állás és trim ellenőrzése</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 ó</span>
        <span class="flex-1">Sebességpróba — GPS-sel ellenőrzött maximális sebesség, utazási sebesség, tartós tempó 3 evezési frekvencián</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 ó</span>
        <span class="flex-1">Fordulási teszt — tengelykörüli és söprő fordulási sugár, lapreakció, bal és jobb oldal</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 ó</span>
        <span class="flex-1">Hullámteszt — ismételt áthaladások 0,5–1,0 m-es hullámokon; gyorsulásmérő a versenyző álláspontjában</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 ó</span>
        <span class="flex-1">Stabilitási teszt — statikus dőlésszög 4 különböző súlyú versenyzővel, jobb oldalra eltolt terheléssel</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 ó</span>
        <span class="flex-1">Állóképességi futás — 3 ó folyamatos utazási tempóban; kamranyomás, oldalpálya hőmérséklet és versenyző fáradtság figyelése</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 ó</span>
        <span class="flex-1">Végső ellenőrzés — a próba utáni ellenőrzés az összes alkatrészen, minden csavar meghúzása/ellenőrzése, megállapítások dokumentálása</span>
      </div>
    </div>
  </div>

  <h2>Egyedi prototípusgyártás különleges alkalmazásokhoz</h2>
  <p>A Prototípus műhely az a hely, ahol megoldjuk azokat a problémákat, amelyeket a szabványos gyártású lapok nem tudnak kezelni. Legutóbbi példák:</p>
  <ul>
    <li>Nagy láthatóságú mentő SUP egy kereső-mentő szervezet számára, integrált kapaszkodófogantyúkkal, mentőfelszerelés tartókkal és nagy úszóképességű hajótesttel a sérültek kimentéséhez — mindezt a mi létesítményünkben prototipizálták, felszerelték és tesztelték.</li>
    <li>Expedíciós túra SUP egy hidrográfiai felmérő vállalkozó számára, eltávolítható műszerárboccal, zárt felszerelés-nyílásokkal és alacsony profilú áramlásfigyelő tartóval, amely a légellenállást minimalizálja.</li>
    <li>Kompakt horgász SUP egy üdülőflotta számára, ahol a prototípust a stabilitás, felszerelés és tartósság érvényesítésére használták napi bérlési használatban, mielőtt az ügyfél négyes flottát rendelt volna.</li>
  </ul>

  <h2>Prototípus csapatunk</h2>
  <p>A műhelyt nyolc sokoldalú tengeri technikus alkotja, akik közül mindegyik legalább két alapvető szakterületre (hajótest, oldalpálya, felszerelés) keresztképzést kapott. A csapatvezető egy mestergyártó 16 év tapasztalattal, az egyedi építésektől a sorozatgyártásig. Minden prototípushoz dedikált projektmérnök tartozik, aki a ügyfél egyetlen kapcsolattartási pontja a teljes építési és próbafolyamat során.</p>

  <h2>Ügyfél-részvétel</h2>
  <p>Őszintén bátorítjuk ügyfeleinket, hogy vegyenek részt a prototípus építés kulcsfontosságú mérföldkövein — különösen a kezdeti felszerelési értékelésen és a tengeri próbán. Az Önök működési visszajelzései ezeken a szakaszokon felbecsülhetetlen értékűek a lap finomhangolásához, mielőtt az gyártásba kerül. Nem légüres térben építünk; Önökkel partnerségben építünk.</p>
  <p>A 20 órás tengeri próba az Ön csapata számára is lehetőséget nyújt, hogy megismerkedjen a lap kezelhetőségével, fedélzeti elrendezésével és karbantartási követelményeivel, biztosítva a zökkenőmentes üzembe állást, amikor a gyártású lapok megérkeznek.</p>


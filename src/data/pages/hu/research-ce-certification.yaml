content_html: |
  <h2>Mi az a CE-tanúsítás?</h2>
  <p>A CE jelölés (Conformit&eacute; Europ&eacute;enne) azt jelzi, hogy egy termék megfelel az EU egészségügyi, biztonsági és környezetvédelmi követelményeinek. Felfújható vízi járműveknél a vonatkozó szabályozási keret a termék kategóriájától függ.</p>

  <h2>Alkalmazandó irányelvek</h2>

  <h3>Szabadidős vízi járművekre vonatkozó irányelv (2013/53/EU)</h3>
  <p>Az elsődleges irányelv az EU-ban a szabadidős vízi járművekre. A 2,4 m alatti felfújható SUP-ok hatályán kívül esnek, és helyette EN ISO 25649 szerint kerülnek tanúsításra.</p>

  <h3>Personal Protective Equipment rendelet (2016/425)</h3>
  <p>A mentőmellényeknek, úszást segítő eszközöknek és a vízi járművekkel szállított biztonsági felszereléseknek meg kell felelniük a PPE rendelet követelményeinek, beleértve a típusvizsgálatot (B modul) egy bejegyzett szervezet által és a gyártási minőségbiztosítást (D vagy E modul).</p>

  <h2>A tanúsítási folyamat</h2>
  <ol>
    <li>Termékosztályozás: Jármű tervezési kategóriájának meghatározása (A – D ISO 8666 szerint)</li>
    <li>Alkalmazandó szabványok: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (gyártói tábla)</li>
    <li>Műszaki dokumentáció előkészítése: Tervezési rajzok, alkatrészlista, anyagtanúsítványok, kockázatelemzés</li>
    <li>Típusvizsgálat: Úszóképesség, stabilitás, teherbírás, anyagvizsgálat, varmatszilárdság, levegőretenció</li>
    <li>Gyártási termeléskontroll: Bejegyzett szervezet gyártási folyamatok auditja</li>
    <li>Megfelelőségi nyilatkozat: A gyártó aláírja a DoC-t, feltünteti a CE jelölést</li>
  </ol>

  <h2>Bejegyzett szervezetek felfújható vízi járművekhez</h2>
  <p>Gyakori bejegyzett szervezetek: Bureau Veritas (Franciaország), DNV GL (Németország), RINA (Olaszország), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Németország).</p>

  <h2>Időbeosztás és költségek</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fázis</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Időtartam</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tipikus költség (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Műszaki dokumentáció előkészítése</td><td class="p-3 border">2 – 4 hét</td><td class="p-3 border">2 000 – 5 000</td></tr>
      <tr><td class="p-3 border">Típusvizsgálat</td><td class="p-3 border">4 – 8 hét</td><td class="p-3 border">8 000 – 20 000</td></tr>
      <tr><td class="p-3 border">Gyári audit</td><td class="p-3 border">1 – 2 nap (helyszíni)</td><td class="p-3 border">3 000 – 6 000</td></tr>
      <tr><td class="p-3 border">Összesen (első termék)</td><td class="p-3 border">8 – 14 hét</td><td class="p-3 border">13 000 – 31 000</td></tr>
    </tbody>
  </table>

  <h2>Mit jelent ez a vásárlóknak</h2>
  <p>CE-tanúsított felfújható SUP-ok vásárlásakor mindig ellenőrizze, hogy a CE jelölés a gyártói táblán van-e, érvényes DoC létezik-e, a bejegyzett szervezet száma fel van-e tüntetve, és a kezelési kézikönyv tartalmaz-e biztonsági utasításokat a helyi nyelven. Minden Afarer termék CE-tanúsítvánnyal rendelkezik, teljes nyomon követhetőséggel a bejegyzett szervezet auditjelentéseihez.</p>


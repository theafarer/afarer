meta:
  title: 'K+F központ | {SITE}'
  description: 'Kutatás és fejlesztés — PVC szövettesztelés, hajótest-mérnöki munka, RF hegesztés, hidrodinamikai tesztelés és minőségkontroll. Egyedi K+F szolgáltatások elérhetők.'

hero:
  tagline: 'K+F központ'
  title: 'K + F központ'
  subtitle: 'A haladásra összpontosítva'

intro:
  - 'Az afarer Kutatási és Fejlesztési (K+F) Központja küldetésünk mozgatórugója, amely a vízisport-felszerelések forradalmasítását tűzte ki célul. A vízisport-rajongókat világszerte biztonságosabb, kényelmesebb és élvezetesebb termékekkel látjuk el a felfújható stand-up paddle deszkák (SUP) terén végzett megállíthatatlan innováció révén. Mérnökeinkből, tervezőinkből és szenvedéllyel bíró vízisport-szakértőinkből álló elkötelezett csapatunk formálja az iparág jövőjét, és folyamatosan emeli a minőségre, a teljesítményre és a fenntarthatóságra vonatkozó elvárásokat.'
  - 'K+F létesítményünk egy fedél alatt egyesíti az anyagtudósokat, tengerészmérnököket és gyártómérnököket. A szövetformulázástól és hajótest-szimulációtól a hegesztési eljárásfejlesztésen át a méretarányos tengeri próbákig a termékfejlesztés minden szakaszát adatok vezérlik, és teszteléssel validálják.'

mission:
  tagline: 'Küldetésünk'
  title: 'A vízisportok jövőjének innoválása'
  pillars:
    - icon: lightning
      title: 'Technológiai fejlődés'
      desc: 'Új anyagok, tervek és gyártási eljárások úttörése a kiváló termékteljesítmény és élettartam érdekében.'
    - icon: design
      title: 'Felhasználóközpontú tervezés'
      desc: 'A felhasználói igények mélyreható megértése és túlszárnyalása ergonómikus és intuitív terméktervezéssel.'
    - icon: globe
      title: 'Fenntartható gyakorlatok'
      desc: 'Környezeti lábnyomunk minimalizálása környezetbarát anyagok és eljárások alkalmazásával.'
    - icon: shield
      title: 'Kompromisszummentes biztonság'
      desc: 'A legmagasabb biztonsági szabványok biztosítása szigorú teszteléssel és tanúsítással.'

pillars:
  - title: 'Technológiai fejlődés'
    desc: 'Új anyagok, tervek és gyártási eljárások úttörése a kiváló termékteljesítmény és élettartam eléréséhez.'
    icon: tech
  - title: 'Fejlett anyagok'
    desc: 'Élvonalbeli PVC-k, kompozitok és fenntartható alternatívák vizsgálata a jobb terméktulajdonságokért.'
    icon: materials
  - title: 'Fenntarthatóság'
    desc: 'Alapvető elkötelezettség: Elkötelezettek vagyunk a környezetvédelem iránt a fenntartható gyártás és az újrahasznosítható anyagok révén.'
    icon: sustainability

capabilities:
  tagline: 'Képességek'
  title: 'K+F képességek'
  subtitle: 'Négy alapszakág, amelyek teljes körű ellenőrzést biztosítanak a termékfejlesztés felett — az alapanyag-kutatástól a végső tanúsításig.'
  groups:
    - title: 'Anyagtudomány és szövettechnológia'
      items:
        - 'PVC formulázás elemzése és optimalizálása'
        - 'UV-stabilizálási, lángállósági és antimikrobiális adalékfejlesztés'
        - 'Többrétegű szövetlaminálás és adhéziós mérnöki munka'
        - 'Gyorsított öregedési tesztelés (UV, hő, pára, sóköd)'
    - title: 'Hajótest-mérnöki munka és hidrodinamika'
      items:
        - 'Parametrikus 3D hajótesttervezés és CFD-optimalizálás'
        - 'Véges elemes analízis szerkezeti és ütésterhelésekhez'
        - 'Méretarányos vontatómedence-tesztelés és teljesítményvalidálás'
        - 'Egyedi hajótestfejlesztés különleges küldetési profilokhoz'
    - title: 'Hegesztési és illesztési technológia'
      items:
        - 'RF dielektromos hegesztési eljárásfejlesztés és optimalizálás'
        - 'Forró levegős, melegék és ultrahangos hegesztési módszerek'
        - 'Ragasztási technológiák és varratszalag-minősítés'
        - 'Hegesztési szilárdság-modellezés és élettartam-előrejelzés'
    - title: 'Tesztelés, tanúsítás és megfelelőség'
      items:
        - 'Minőségirányítás és CE-megfelelőségi tesztelés'
        - 'Független harmadik fél általi tesztelés és tanúsítási támogatás'
        - 'Egyedi tesztprotokoll-fejlesztés beszerzési minősítéshez'
        - 'Üzem közbeni hibaelemzés és kiváltó okok vizsgálata'


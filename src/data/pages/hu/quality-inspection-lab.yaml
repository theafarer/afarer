intro: 'Minden nálunk elkészült lap olyan tanúsítvánnyal rendelkezik, amely igazolja, hogy teljesítette a meghatározott minőség-ellenőrzések és anyagtesztek körét. Minőség- és ellenőrző laborunk független funkció a szervezeten belül — közvetlenül az ügyvezető igazgatónak jelent, nem a gyártásnak — biztosítva, hogy semmilyen kereskedelmi nyomás ne befolyásolhassa az ellenőrzési kaput. Ha egy anyagtétel vagy kész lap nem felel meg a közzétett specifikációnak, a labor jogosult leállítani a szállítást, amíg a meg nem felelést meg nem szüntetik.'

content_html: |
  <h2>Bízni jó, ellenőrizni jobb</h2>
  <p>A labor egy elvekhez igazodó minőségirányítási rendszer szerint működik, és tesztmódszereink — ahol alkalmazható — ISO, ASTM és EN szabványokon alapulnak. Minden elvégzett tesztről részletes nyilvántartást vezetünk, teljes nyomon követhetőségi láncot hozva létre a nyersanyag beérkezésétől a kész lap leszállításáig.</p>

  <h2>Tesztberendezések és képességek</h2>
  <table>
    <thead><tr><th>Berendezés</th><th>Végzett tesztek</th><th>Szabvány / Módszer</th></tr></thead>
    <tbody>
      <tr><td>Univerzális tesztgép (50 kN)</td><td>Húzószilárdság (szövet), hámlási ellenállás (varratok), szakadás terjedése</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Levegőretenció tesztállvány (programozható)</td><td>1000 ciklusos felfújási/leeresztési állóképesség, 30 perces nyomástartási teszt</td><td>EN ISO 25649 (belső)</td></tr>
      <tr><td>Varmat-hámlasztó állvány (motoros 180° hámlás)</td><td>Hegesztett és ragasztott varrat hámlási szilárdsága 100 mm/perc sebességgel</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Hidrosztatikus nyomásmérő</td><td>Szövet vízáthatolási ellenállása (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Digitális vastagságmérő és mikrométer</td><td>Szövetvastagság, oldalpálya vastagsága, ragasztófilm vastagsága</td><td>ISO 2286-3</td></tr>
      <tr><td>Klimakamra</td><td>Hőmérséklet-kondicionálás (-40 °C-tól +80 °C-ig) hidegtörési és hőöregedési tesztekhez</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Színspektrofotométer</td><td>Delta-E színmérés UV-expozíció után</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Az ellenőrzési kapuk — anyagtól a szállításig</h2>
  <p>Minden lap meghatározott minőségi tervet követ kötelező ellenőrzési pontokkal. Egyetlen lap sem hagyhat ki egy kaput sem; minden kaput a minőség-ellenőrnek kell jóváhagynia, mielőtt a következő gyártási szakasz elkezdődik.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">1. kapu</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Beérkező anyagellenőrzés</p>
            <p class="text-xs text-gray-500 mt-1">Szövettétel, ragasztótétel, hardverek — mind ellenőrizve a beérkezési specifikációval szemben a gyártásba való kiadás előtt.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">2. kapu</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Folyamatos hegesztés-ellenőrzés</p>
            <p class="text-xs text-gray-500 mt-1">Az első hegesztési minta tesztelve (hámlás + vizuális) minden gyártási műszak elején.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">3. kapu</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Kamra-levegőteszt</p>
            <p class="text-xs text-gray-500 mt-1">Minden kamra a munkanyomás 1,5-szeresére nyomva, 30 percig tartva. Adatok sorozatszám szerint naplózva.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">4. kapu</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Szállítás előtti ellenőrzés</p>
            <p class="text-xs text-gray-500 mt-1">Teljes lap ellenőrizve: minden csavar meghúzva, szerelvények működőképesek, nincs esztétikai hiba. 100 pontos ellenőrzőlista.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">5. kapu</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Végső tanúsítás</p>
            <p class="text-xs text-gray-500 mt-1">Tesztjelentések összeállítva, ellenőrzési rekordok átnézve, Megfelelőségi Tanúsítvány kiadva.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Fő minőségi mutatók (2025 mozgóátlag)</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99,7 %</span>
      <span class="text-xs text-gray-500">Első átfutási hozam (szövettétel)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0,2 %</span>
      <span class="text-xs text-gray-500">Hegesztési selejtarány (folyóméter)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Kamrák légtesztelve szerelés előtt</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">EN ISO 25649</span>
      <span class="text-xs text-gray-500">Tervezési kategória megfelelősége</span>
    </div>
  </div>

  <h2>Minőségi csapatunk</h2>
  <p>A labor munkatársai: egy minőségmenedzser (10 év tengeri minőségbiztosításban, ASQ tanúsított minőségmérnök), két minőség-ellenőr (mindkettő 2. szintű NDT tanúsítással vizuális tesztelésben) és egy anyagtechnikus, aki felelős az összes fizikai tesztelésért. A csapat éves jártassági teszten esik át egy független harmadik fél szolgáltatón keresztül, hogy teszteredményeink pontosak és reprodukálhatók maradjanak.</p>

  <h2>Független tesztelés ügyfeleknek</h2>
  <p>Minőség- és ellenőrző laborunk elérhető független tesztelési szolgáltatásokra. Ha ellenőriznie kell egy szövetspecifikációt, érvényesítenie kell egy új ragasztórendszert, vagy harmadik fél általi tesztjelentést kell szereznie egy beszerzési minősítéshez, elvégezzük a teszteket a vonatkozó szabvány szerint, és kiállítjuk a tanúsított tesztjelentést.</p>
  <p>Példák a legutóbbi harmadik fél általi tesztelési munkákra:</p>
  <ul>
    <li>Öt versenytárs ragasztófilm termék hámlási szilárdság-összehasonlítása egy európai katonai beszerzési programhoz.</li>
    <li>Gyorsított öregedési tanulmány (UV + hőciklizálás) egy új narancs pigmentált PVC formulációhoz, rendszeres köztes mérésekkel 500 óránként.</li>
    <li>50 prototípus Kamraváltó szelep levegőretenció-érvényesítése egy új magas nyomású kamradizájnhoz.</li>
  </ul>

  <h2>Elkötelezettségünk Ön felé</h2>
  <p>Amikor egy Afarer lapot kap, a minőségi doszziéjét is megkapja — az Ön konkrét lapjára vonatkozó teszteredmények összeállított rekordját. Szövettétel-tanúsítvány, hegesztési hámlási tesztek, kamra-levegőteszt naplók és szállítás előtti ellenőrzőlista. Minden szám nyomon követhető. Minden ellenőr azonosítható. Ez nem csak papírmunka — ez a mi ígéretünk, hogy amit leszállítottunk, az az, amit meghatároztunk.</p>
  <p>Ha bármikor minőségi aggálya van, közvetlenül fordulhat a laborhoz — az elérhetőségeket a megfelelőségi tanúsítványára nyomtatjuk. Minden megkeresést komolyan veszünk, és 48 órán belüli formális vizsgálatot vállalunk.</p>


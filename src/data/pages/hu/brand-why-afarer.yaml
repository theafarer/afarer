features3_reasons:
  tagline: 'Miért válassza az afarart'
  title: 'Hét ok a partnerségre'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Valódi gyártás, nem kereskedelem'
      description: 'Saját tulajdonban lévő és általunk működtetett 12 000 m²-es gyárunk van. Amikor az afararral partnerségbe lép, közvetlenül azokkal dolgozik, akik tervezik, fejlesztik és építik termékeit — közvetítők nélkül.'
      icon: tabler:building-factory
    - title: '2. Mérnöki vezérelte megközelítés'
      description: 'Tervezési folyamatunk a felhasználási esettel indul, nem a termékkategóriával. Optimalizáljuk a hajótestformát, anyagkiválasztást és konfigurációt arra, ahogyan a lapot valójában használni fogják.'
      icon: tabler:engine
    - title: '3. Tanúsított minőség'
      description: 'CE-tanúsítvány, ISO minőségügyi rendszer, BSCI-megfelelőség, REACH-megfelelőség, USCG jóváhagyás. Minden termék megfelel a nemzetközi szabványoknak — nem csak állítások.'
      icon: tabler:certificate
    - title: '4. Rugalmas közös márkázás'
      description: 'Oldalpálya színek, fedélzeti elrendezés, márkázás, csomagolás — az Ön specifikcióihoz igazítunk. Nincs minimális rendelési kényszer. Kezdje prototípussal, skálázzon bizalommal.'
      icon: tabler:adjustments
    - title: '5. Globális logisztika'
      description: 'USA raktár Kaliforniában, közvetlen szállítás Csingtaóból, légi szállítás sürgős megrendelésekhez. Kezeljük a vám-papírmunkát és dokumentációt.'
      icon: tabler:truck-delivery
    - title: '6. Élethosszig tartó támogatás'
      description: 'Támogatjuk azokat a lapokat is, amelyeket 20 évvel ezelőtt építettünk. Eredeti cserealkatrészek, műszaki tanácsok, javítási útmutatás — csapatunk elérhető, amikor szüksége van ránk.'
      icon: tabler:lifebuoy
    - title: '7. Őszinte specifikációk'
      description: 'Valódi terhelési értékek, valódi méretek, valódi súly. Nincs marketingi felfújtatás. Amit közzéteszünk, azt kapja — független teszteléssel igazolva.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Világszerte a márkák bizalma'
  title: 'Mit mondanak partnereink'
  items:
    - content: 'Több gyártóval dolgoztunk Kínában, de az afarar kiemelkedik mérnöki támogatásával és következetes minőségével. A márkánkat úgy kezelik, mint a sajátjukat.'
      name: '— Közös márka partner, európai vízisport márka'
    - content: 'SUP lapjaik több mint 5 éve vannak szolgálatban a flottánkban. Minimális karbantartás, kiváló UV-állóság. Az 5 éves garancia bizalmat ad nekünk.'
      name: '— Flotta üzemeltető, közel-keleti üdülőcsoport'
    - content: 'Az afarar csapat segített nekünk egy egyedi SUP lap dizájn kifejlesztésében a koncepciótól a gyártásig 90 nap alatt. A minőség meghaladta elvárásainkat.'
      name: '— Forgalmazó, ausztrál vízisport'

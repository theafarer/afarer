hero:
  tagline: 'Vízi felfedezési ismeretek'
  title: 'Tanulás'
  subtitle: |
    Útmutatók, oktatóanyagok és mélyreható betekintések — minden, amire szüksége van,<br />
    hogy magabiztosan fedezze fel a vizet. Az első SUP kiválasztásától a haladó technikák elsajátításáig.
  taglineSection: 'Tudás minden evezőnek. A kezdőtől a professzionálisig.'

featured:
  tagline: 'Kiemelt témák'
  title: 'Kezdje el tanulási útját'
  subtitle: 'Legyen új a vízisportokban, vagy szintet lépne, útmutatóink mindenre kiterjednek.'
  items:
    - title: 'SUP alapok'
      description: 'Minden, amit egy kezdőnek tudnia kell — deszkatípusok, evezőméretezés, állás és első napos tippek.'
      icon: 'tabler:lifebuoy'
      href: '/learn/sup'
    - title: 'Felfújható vagy kemény deszka'
      description: 'Melyik illik Önhöz? Hordozhatóságot, teljesítményt, tartósságot és költséget hasonlítunk össze egymás mellett.'
      icon: 'tabler:arrows-left-right'
      href: '/compare/inflatable-vs-hardboard'
    - title: 'Vízbiztonság'
      description: 'Alapvető biztonsági ismeretek, amellyel minden evezőnek rendelkeznie kell — időjárás, mentőmellények, önementés és több.'
      icon: 'tabler:shield'
      href: '/learn/water-safety'
    - title: 'Anyagútmutató'
      description: 'PVC minőségek, drop-stitch technológia, denier értékek — értse meg, miből készül a felszerelése.'
      icon: 'tabler:flask'
      href: '/learn/materials'
    - title: 'SUP méret útmutató'
      description: 'Találja meg a megfelelő deszkahosszt, szélességet és térfogatot az Ön súlyához, készségéhez és evezési stílusához.'
      icon: 'tabler:ruler'
      href: '/size-guide'
    - title: 'Középhaladó technikák'
      description: 'Emelje új szintre az evezést haladó evezési mozdulatokkal, fordulási technikákkal és hullámos vízi kezeléssel.'
      icon: 'tabler:droplet'
      href: '/learn/intermediate-techniques'


meta:
  title: 'Tanulás — SUP és evezés | {SITE}'
  description: 'Tanuljon az afarertel: felfújható SUP oktatóanyagok, evezési technikák, felszerelési alapok és vízi oktatás rajongóknak és vállalkozásoknak.'

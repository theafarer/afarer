stories:
  tagline: 'Felfedező történetek'
  title: 'Valódi kalandok valódi emberektől'
  subtitle: 'Hallgassa meg evezőket, családokat és professzionálisokat, akik afarar felszerelést használnak a vízen.'
  items:
    - name: 'Sarah és Mike'
      title: 'SUP Explorer 11 tulajdonosok, Kanada'
      content: 'Elvittük Explorer 11-es lapjainkat egy hetes útra az Algonquin Parkon keresztül. Gyönyörűen kezelték az átvonulásokat és tavakon átkeléseket. A drop-stitch szerkezetnek köszönhetően 15 PSI-re fújhattuk fel, és kemény lap teljesítményt kaptunk egy csomagolható lapból.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Algonquin Park, Kanada'
    - name: 'Carlos R.'
      title: 'Cheetah Surge versenyző, Spanyolország'
      content: 'A Cheetah Surge a kedvenc lapom a part menti cirkáláshoz. Az élénk dizájn feltűnést kelt a parton, és a stabilitása bizalmat ad enyhe hullámokban. Gyönyörűen kezelhető, akár túrázom, akár csak a naplementét élvezem.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Spanyolország'
    - name: 'Lina és családja'
      title: 'Flowing Lotus evezők, Svédország'
      content: 'Hétvégi családi kalandok a szigetvilágban. A Flowing Lotus elég stabil ahhoz, hogy a lányom álljon rajta, miközben én evezek. Körülbelül 10 perc alatt felfújható — nincs szükség pótkocsira, csak tiszta családi szórakozás a vízen.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Stockholmi szigetvilág, Svédország'
    - name: 'Lt. Cmdr. Andres'
      title: 'Ocean Voyager felfedező, Fülöp-szigetek'
      content: 'Az Ocean Voyagert használom hosszú távú part menti túrákhoz Palawan körül. Hónapoknyi napi használat után trópusi körülmények között a lap még mindig újként teljesít. A túra forma átvágja azokat a hullámokat, amelyek megállítanák a gyengébb lapokat.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palawan, Fülöp-szigetek'
    - name: 'Emma T.'
      title: 'Tropical Breeze első alkalom, Ausztrália'
      content: 'Sosem ültem még SUP-on. A Tropical Breeze annyira stabil, hogy első próbálkozásra is magabiztosnak éreztem magam. Most minden hétvégén evezek. A tanulási görbe gyakorlatilag nulla — és a lap elképesztően néz ki a vízen.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Ausztrália'


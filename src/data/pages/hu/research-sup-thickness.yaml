content_html: |
  <h2>A három szabványos vastagság</h2>

  <h3>4" (10 cm) – Túrázás és teljesítmény</h3>
  <ul>
    <li>Legmagasabb merevség – kevesebb hajlás terhelés alatt</li>
    <li>Legkönnyebb – kevesebb anyag, kevesebb légtérfogat</li>
    <li>Kiváló iránytartás – csökkent oldalról oldalra himbálózás</li>
    <li>Leggyorsabb – csökkent légellenállás, könnyebb siklás</li>
    <li>Legjobb: Túrázás, versenyzés, fitnesz evezés, tapasztalt evezőknek</li>
  </ul>

  <h3>5" (12,7 cm) – All-around</h3>
  <ul>
    <li>Jó merevség – kiegyensúlyozott hajlás-merevség arány</li>
    <li>Mérsékelt súly – szabványos anyaghasználat</li>
    <li>Jó elsődleges + másodlagos stabilitás</li>
    <li>Legjobb: Szabadidős evezés, kezdők, alkalmi tavi és folyói használat</li>
  </ul>

  <h3>6" (15,2 cm) – Stabilitás és jóga</h3>
  <ul>
    <li>Legmagasabb elsődleges stabilitás – nagy úszóképesség</li>
    <li>Legnehezebb – több PVC anyag, nagyobb légtérfogat</li>
    <li>Leglassabb – több légellenállás, nehezebb fenntartani a siklást</li>
    <li>Legjobb: Jóga/fitnesz, nehéz evezők (100+ kg), nagyon hullámos körülmények</li>
  </ul>

  <h2>Mérnöki elemzés</h2>
  <p>Egy felfújható SUP merevségét a belső légnyomás és a lap keresztmetszetének tehetetlenségi nyomatéka határozza meg. 20 PSI-nál egy 4" lap körülbelül 30%-kal kevesebb deformációt mutat terhelés alatt, mint azonos szélességű és hosszúságú 6" lap. Az elsődleges stabilitás a vízvonal szélességéből és úszóképességből ered; a másodlagos stabilitást az oldalpálya forma és a lap szélessége befolyásolja.</p>

  <h2>Vastagság evező súly szerint</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Evező súlya</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Ajánlott vastagság</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">65 kg alatt (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" vagy 6"</td></tr>
      <tr><td class="p-3 border">115 kg felett (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Vastagság vs. PSI kompromisszum</h2>
  <p>Gyakori tévhit, hogy a magasabb PSI kompenzálhatja a túlzott vastagságot. 25 PSI-nál egy 6" lap több hajlást mutat, mint egy 4" lap 15 PSI-nál, mert a geometriai tehetetlenségi nyomaték dominálja a merevségi egyenletet. Teljesítmény-orientált evezők számára egy vékonyabb lap alacsonyabb nyomáson felülmúlja a vastagabb lapot magasabb nyomáson.</p>

  <h2>Afarer kínálat</h2>
  <ul>
    <li><strong>4" lapok:</strong> Cheetah Touring széria – 12' x 30" x 4" túra SUP-ok fitnesz és táv evezéshez</li>
    <li><strong>5" lapok:</strong> Cheetah All-Round széria – 10'6" x 32" x 5" szabadidős használatra</li>
    <li><strong>6" lapok:</strong> Cheetah Ultra-Stable széria – 10' x 34" x 6" jógához, nagy evezőkhöz és fotóplatformokhoz</li>
  </ul>
  <p>Minden lap 1 680 DTEX drop-stitch maggal rendelkezik 20 PSI névleges nyomással és 1,2 mm PVC laminátummal.</p>


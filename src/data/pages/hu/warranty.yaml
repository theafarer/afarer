subtitle: 'Az afarar kiáll minden általunk gyártott felfújható tengeri termék minősége mellett. Ez a korlátozott garancia rögzíti afarar termékének feltételeit és fedezetét.'
seo:
  headline: 'afarer felfújható SUP garancia — 5 éves korlátozott garancia | afarer'
  description: 'Az afarar 5 éves korlátozott garanciát kínál a fő fedélzeti szövetre, varratokra és a drop-stitch mag szerkezeti integritására. Emellett a felfújószelepekre és a gyári szerelt kiegészítőkre is kiterjed. Teljes feltételek az afarar felfújható SUP garanciához.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Ez a korlátozott garancia a közvetlenül az afarartól vagy jogosított afarar kereskedőtől vagy kiskereskedőtől vásárolt új, afarar márkájú felfújható tengeri termékekre vonatkozik. A hatályos dátum az eredeti kiskereskedelmi vásárlás ellenőrizhető dátuma.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garanciális fedezet és időtartam</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 év</h3>
        <p class="text-sm text-gray-600 mt-1">Fő csőszövet integritása (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 év</h3>
        <p class="text-sm text-gray-600 mt-1">Üvegszálas hajótest szerkezeti integritása</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 év</h3>
        <p class="text-sm text-gray-600 mt-1">Felfújható csővarrat légtartó képessége</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 év</h3>
        <p class="text-sm text-gray-600 mt-1">Felfújószelep működőképessége</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 év</h3>
        <p class="text-sm text-gray-600 mt-1">Gyári szerelt kiegészítők és kiegészítő szerelvények</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 év*</h3>
        <p class="text-sm text-gray-600 mt-1">Kereskedelmi, bérlési vagy flotta használat — minden alkatrész</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*A kereskedelmi, kormányzati, charter, bérlési vagy oktatási használat 1 évre csökkenti a garanciát. A verseny- vagy versenycélú használat teljesen érvényteleníti a garanciát.</p>
  </div>

  <h2>Mi szerepel a fedezetben</h2>
  <h3>Fő csőszövet (5 év)</h3>
  <p>Az afarar vállalja, hogy a fő fedélzeti szövet nem tapasztal olyan porozitás-romlást, amely lényegesen veszélyeztetné a termék működési nyomás fenntartási képességét. Ez vonatkozik a PVC-bevonatú szövetre és a gyártásban használt összes egyéb fedélzeti szövetanyagra.</p>

  <h3>Üvegszálas hajótest szerkezeti integritása (5 év)</h3>
  <p>Üvegszálas műanyag (FRP) hajótesttel rendelkező termékek esetén az alapvető kompozit szerkezet garanciális védelmet élvez az anyag- vagy gyártási hibákból eredő szerkezeti meghibásodásokra.</p>

  <h3>Felfújható csővarrat légtartó képessége (5 év)</h3>
  <p>A felfújható csövek gyártás közben illesztett varratai garanciális védelmet élveznek az olyan gyártási hibákra, amelyek a varraton át jelentős levegőszivárgást eredményeznek. A rendszeres ellenőrzés és a megfelelő felfújási nyomás fenntartása a fedezet feltétele.</p>

  <h3>Felfújószelep működőképessége (5 év)</h3>
  <p>Az afarar által eredetileg beszerelt légfelfújó szelepek garanciális védelmet élveznek az olyan anyag- vagy gyártási hibákra, amelyek megakadályozzák, hogy a szelep a tervezett módon tartsa a levegőt.</p>

  <h3>Gyári szerelt kiegészítők (1 év)</h3>
  <p>Az afarar által gyártott és a gyárban eredetileg beszerelt alkatrészek és szerelvények egy évig garanciális védelmet élveznek anyag- és gyártási hibákra. Ez nem terjed ki harmadik fél termékeire, amelyeket kizárólag a saját gyártójuk garanciája fed.</p>

  <h2>Mi nem szerepel a fedezetben</h2>
  <ul>
    <li>Esztétikai hibák, beleértve a elszíneződést, foltosodást, kifakulást, krétásodást vagy a megjelenés bármilyen változását</li>
    <li>Szúrások, vágások, szakadások, repedések vagy egyéb fizikai sérülések</li>
    <li>Hajszálrepedések, repedések, kopás, dörzsölődés vagy súrlódásból, érintkezésből eredő romlás</li>
    <li>UV-fényexpozícióból, időjárási vagy légköri viszonyokból eredő degradáció</li>
    <li>Üzemanyagokkal, oldószerekkel, savakkal, lúgokkal vagy vegyi anyagokkal való érintkezésből eredő károk</li>
    <li>Hanyagságból, helytelen használatból, visszaélésből, balesetből vagy normális kopásból eredő károk</li>
    <li>Zselréteg vagy festék felületi problémák (hólyagosodás, hajszálrepedések, elszíneződés, kifakulás)</li>
    <li>Ütésből, igénybevételből, nem megfelelő alátámasztásból vagy szállításból eredő károk</li>
    <li>Helytelen felfújásból/leeresztésből vagy nem jóváhagyott felfújóberendezések használatából eredő károk</li>
    <li>Harmadik fél berendezései, alkatrészei vagy rendszerei (a saját gyártójuk fedezi)</li>
  </ul>

  <h2>A gyártó kötelezettsége és jogorvoslat</h2>
  <p>Az afarar egyetlen és kizárólagos kötelezettsége az anyag- vagy gyártási hibás és a garancia fedezetébe tartozó alkatrész javítása vagy cseréje, az afarar döntése szerint. A javításokat vagy cseréket az afarar vagy annak kijelölt jogosított szervize végzi. A javított vagy cserélt alkatrészekre csak az eredeti garanciaidőszak le nem telt részéig terjed a garancia.</p>

  <h2>A garancia feltételei</h2>
  <ul>
    <li><strong>Regisztráció:</strong> A terméket a garanciális feltételekben előírt módon megfelelően regisztrálni kell.</li>
    <li><strong>Karbantartás:</strong> A terméket az afarar közzétett irányelvei szerint kell karbantartani, beleértve a rendszeres ellenőrzést és a megfelelő felfújási nyomás fenntartását.</li>
    <li><strong>Együttműködés:</strong> A vásárlónak teljes körűen és haladéktalanul együtt kell működnie az afararral a garanciális igényekkel kapcsolatos minden ügyben.</li>
    <li><strong>Eredeti vásárló:</strong> Ez a garancia kizárólag az eredeti végfelhasználó vásárlóra terjed ki és nem átruházható.</li>
  </ul>

  <h2>Kereskedelmi használat</h2>
  <p>Ha a terméket kereskedelmi, kormányzati, non-profit, charter, bérlési, oktatási vagy magánszabadidős céltól eltérő bármilyen célra használják, minden alkatrész garanciaidőszakát egy (1) évre csökkentjük az eredeti kiskereskedelmi vásárlás dátumától számítva. Versenyben, sebesség- vagy állóképesség-versenyben való használat azonnal és visszavonhatatlanul teljesen érvényteleníti a garanciát.</p>

  <h2>Hogyan tegyen garanciális igényt</h2>
  <p>Vegye fel a kapcsolatot az afararral vagy jogosított kereskedőjével a vásárlás igazolásával és a probléma részletes leírásával. Az afarar átnézi az igényt, és útmutatást ad az ellenőrzéshez és a szervizeléshez.</p>
  <p>Garanciális szervizkeléréssel kapcsolatos kérdésekben kérjük, lépjen kapcsolatba velünk a <a href="/contact/" class="text-sky-600 underline">kapcsolati oldalunkon</a> keresztül, megadva rendelésszámát és termékinformációit.</p>

  <h2>Harmadik fél termékei</h2>
  <p>A harmadik felek által gyártott berendezésekre, alkatrészekre vagy rendszerekre (akkor is, ha az afarar szerelte be őket) kizárólag a saját gyártójuk által kínált garancia terjed ki. Az afarar kifejezetten elzárkózik minden garanciális felelősségtől az ilyen harmadik fél termékekkel kapcsolatban.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Ez a garancia-nyilatkozat a teljes afarar gyártói korlátozott garancia összefoglalása. A teljes jogi garanciadokumentum határozza meg az összes garanciális feltételt. A műszaki adatok előzetes értesítés nélkül változhatnak. Az afarar az Aquafarer LLC (USA) által üzemeltetett márka.
  </p>

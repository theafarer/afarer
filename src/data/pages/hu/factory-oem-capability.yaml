services:
  - title: 'Terméktervezés és mérnöki munka'
    description: 'Házon belüli K+F csapatunk az Ön koncepciójával vagy specifikációjával dolgozva CAD-rajzokat, 3D modelleket és prototípusokat fejleszt. Formatervezést, hajótestforma-optimalizálást és anyagválasztási útmutatást kínálunk.'
  - title: 'Egyedi márkázás és grafika'
    description: 'Teljes színes digitális nyomtatás, szitanyomtatás, domborítás és címkeopciók. Márkaspecifikus fedélzeti grafikákat, csőmárkázást és értékesítésre kész csomagolást fejlesztünk.'
  - title: 'Anyag- és specifikáció-testreszabás'
    description: 'Válasszon PVC (standard, környezetbarát, lángálló), drop-stitch és hibrid szerkezetek közül. Egyedi csőszínek, szövetsúlyok és megerősítési opciók.'
  - title: 'Csomagolás és logisztika'
    description: 'Egyedi kiskereskedelmi csomagolás, saját márkás dobozok, vákuumcsomagolás, raklapozás és konténerbe töltés. FOB Qingdao, CIF vagy DDP szállítási feltételek elérhetők.'


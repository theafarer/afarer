intro: 'Az afarer átfogó OEM és ODM szolgáltatásokat kínál márkáknak, forgalmazóknak és kormányzati szerveknek világszerte. 10+ év exports tapasztalattal és egy 12 000 m²-es, ISO 9001 és BSCI tanúsítású gyárral mindent kezelünk a terméktervezéstől és formafejlesztéstől a teljes körű gyártáson, csomagoláson és logisztikán át.'


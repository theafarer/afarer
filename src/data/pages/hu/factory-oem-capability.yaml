why_us:
  - title: 'Vertikális integráció'
    description: 'A gyárunk, a formáink és az ellátási láncunk a sajátunk — nincsenek közvetítők, nincsenek alvállalkozók. Ez kontrollt ad a minőség, a költség és a szállítás felett.'
  - title: 'Kettős tanúsítás'
    description: 'ISO 9001 minőségirányítási és BSCI társadalmi megfelelőségi tanúsítás. Gyári auditjelentések kérésre elérhetők.'
  - title: 'CE-megfelelőség'
    description: 'Minden standard modell CE 2013/53/EU tanúsítással rendelkezik. Az egyedi modellek bevált eljárásunkon keresztül CE-tanúsíthatók.'
  - title: 'Alacsony MOQ'
    description: 'Kezdje akár mindössze 5 egységgel a standard modelleknél. Segítjük a feltörekvő márkákat a túl nagy készletkötelezettség nélküli indulásban.'

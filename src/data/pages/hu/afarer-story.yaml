timeline:
  - year: '2012'
    title: 'Tengeri gyártási alapok'
    body: 'Az afarar egy specializált vízi járművekkel foglalkozó műhelyként kezdte Csingtaóban, Kínában, elkötelezetten a tengeri iparos hagyományok és a vízi járműgyártás mellett. A korai fókusz megbízható felfújható termékek építése volt gyakorlati mérnöki tapasztalat és gyártási fegyelem révén.'
  - year: '2015'
    title: 'Első export és CE-tanúsítvány'
    body: 'Az első exportmegrendelések Japánba és Koreába érkeztek. A CE-tanúsítvány a fő termékvonalakhoz megvalósult, ami az afarar nemzetközi piacra lépését jelentette. A vállalat Kínán túl kezdte kiszolgálni a kereskedelmi és szabadidős felhasználókat.'
  - year: '2018'
    title: 'Gyarbővítés'
    body: 'Áthelyeztük a gyárat egy 12 000 m²-es üzembe. RF hegesztővonalakat és drop-stitch gyártási kapacitást adtunk hozzá, ami nagyobb léptékű gyártást és jobb minőségirányítási rendszereket tett lehetővé.'
  - year: '2020'
    title: 'Fejlesztőközpont létrehozása'
    body: 'Dedikált fejlesztőközpontot nyitottunk PVC szövetlaborral, hidrodinamikai tesztmedencével és CAD/FEA szimulációs stúdióval. A termékfejlesztés kibővült a könnyű szerkezetekre, jobb tartósságra és felhasználóközpontú dizájnra fókuszálva.'
  - year: '2022'
    title: 'Tanúsítvány és globális növekedés'
    body: 'ISO 9001 tanúsítványt szereztünk. 14 fejlesztőmérnövre és 200+ munkásra bővültünk. Termékeink eljutottak az ügyfelekhez Európában, Amerikában és Ázsiában-Csendes-óceáni térségben forgalmazói és közös márka együttműködések révén.'
  - year: '2024'
    title: 'Innovációs és dizájn stúdió'
    body: 'Teljes körű dizájn és innovációs stúdiót indítottunk egyedi közös márka projektekhez, a koncepciótól a gyártásig. Erősítettük a professzionális tengeri alkalmazásokat, beleértve a mentési, kereskedelmi és kormányzati szerződéseket.'
  - year: '2026'
    title: 'A vízi felfedezés jövőjének építése'
    body: 'Ma az afarar tovább fejleszti SUP rendszereit és tengeri kiegészítőit — összekötve az embereket és szervezeteket a világ vizeivel. 50+ kiszolgált ország, 15 000+ egység éves kapacitás.'

content_founding:
  tagline: 'A kezdet'
  title: 'A vízparton születtünk'
  subtitle: 'Az afarar egy parti műhelyben kezdte Csingtaóban egy lappal és egy vízióval: olyan felfújható vízi járműveket építeni, amelyek bírnak valódi tengeri körülményeket.'
  paragraphs:
    - '2012-ben alapítóink rést láttak a piacon — a legtöbb felfújható vízi jármű vagy megfizethető, de megbízhatatlan volt, vagy magas minőségű, de prohibícióan drága. Hittek benne, hogy van helye egy olyan gyártónak, amely minőséget és értéket egyaránt nyújt.'
    - 'Az első hajótestet kézzel építették, a helyi vizeken tesztelték, és a halászoktól valamint kis kereskedelmi üzemeltetőktől kapott valódi visszajelzések alapján finomították. Ez a visszajelzési kör — építés, tesztelés, figyelés, fejlesztés — ma is a mérnöki filozófiánk magja.'
    - '2015-re a hír túljutott Csingtaón. Nemzetközi forgalmazók kezdték kérni a mintákat. Ami helyi műhelyként indult, globális beszállítóvá vált.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarar korai gyártóműhely és gyártás

content_growth:
  tagline: 'Növekedés és innováció'
  title: 'A műhelytől a 12 000 m²-es üzemig'
  subtitle: 'A emberekbe, berendezésekbe és folyamatokba történő folyamatos befektetés modern tengeri gyártóüzemmé alakította az afarart.'
  paragraphs:
    - 'Ahogy a kereslet nőtt, az üzemünk is. Egy kis műhelyből 12 000 m²-es gyárrá bővültünk dedikált SUP lap és kiegészítő gyártósorokkal.'
    - 'Beruháztunk CNC vágógépekbe, nagyfrekvenciás hegesztőberendezésekbe, drop-stitch gyártósorokba és átfogó tesztelőállványokba — lehetővé téve a gyártási minőség minden aspektusának ellenőrzését.'
    - 'Ma 200+ fős csapatunk tengeri mérnököket, anyagtudósokat, minőség-ellenőrzési szakembereket és képzett iparosokat foglal magában — akik közül sokan az első napoktól az afararral vannak.'

philosophy:
  tagline: 'Márkafilozófia'
  title: 'Szabadság a vízen, mérnöki pontossággal'
  body: 'A vízen való szabadság nem csak a mozgásról szól. Az új helyek felfedezését, szabadtéri élmények megteremtését, az emberek és a természet összekapcsolását és a professzionális küldetések lehetővé tételét jelenti. A mérnöki munka teszi ezt a szabadságot lehetővé.'
  pillars:
    - title: 'A megbízhatóság az első'
      body: 'A vízi környezet bizalmat követel. Az afarar termékek stabilitásra, tartósságra, biztonságra és következetes teljesítményre lettek tervezve.'
    - title: 'Emberközpontú dizájn'
      body: 'A termékek az embereket szolgálják, nem a technológiát. Minden tervezési döntés azzal kezdődik, hogy megértsük, hogyan használják az emberek a vízi járműveket, hol fedeznek fel és milyen kihívásokkal néznek szembe.'
    - title: 'Hozzáférhető felfedezés'
      body: 'A víz nem csak a szakértőké. Az afarar olyan felszereléseket hoz létre, amelyek lehetővé teszik több ember számára, hogy biztonságosan megtapasztalják a folyókat, tavakat, óceánokat és part menti környezeteket.'
    - title: 'Folyamatos innováció'
      body: 'Az innováció nem csak új termékek létrehozása. Minden részlet fejlesztése — anyagok, szerkezetek, gyártás és felhasználói élmény.'

engineeringDna:
  tagline: 'Mérnöki DNS'
  title: 'Hogyan hozza létre az afarar a termékeket'
  areas:
    - title: 'Anyagtudomány'
      body: 'Az afarar a megfelelő anyagok kiválasztására fókuszál a különböző tengeri környezetekhez. A fő szempontok közé tartozik a kopásállóság, UV-állóság, nyomásstabilitás és hosszú távú tartósság.'
      items: ['Kopásállóság', 'UV-állóság', 'Nyomásstabilitás', 'Hosszú távú tartósság']
    - title: 'Szerkezeti mérnökség'
      body: 'A felfújható vízi járművek pontos egyensúlyt igényelnek a merevség, súly, hordozhatóság és stabilitás között. Az afarar mérnöksége e tényezők optimalizálására fókuszál a drop-stitch magtechnológia és a fejlett varratszerkezetek révén.'
      items: ['Merevség', 'Súlyoptimalizálás', 'Hordozhatóság', 'Stabilitás']
    - title: 'Gyártási pontosság'
      body: 'Minden termék kontrollált folyamatokon megy át: anyag-előkészítés, precíz vágás, hegesztés és ragasztás, szerelés, minőség-ellenőrzés és teljesítmény-igazolás.'
      items: ['Anyag-előkészítés', 'Precíz vágás', 'Hegesztés és ragasztás', 'Szerelés és minőség-ellenőrzés']
    - title: 'Felhasználási forgatókönyv mérnökség'
      body: 'A termékek valódi alkalmazások köré fejlesztjük — szabadidő, kaland és professzionális használat — biztosítva, hogy minden dizájn megfeleljen a szánt környezet konkrét követelményeinek.'
      items: ['Szabadidő', 'Kaland', 'Professzionális', 'Kereskedelmi']


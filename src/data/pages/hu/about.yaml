meta:
  title: 'Az Afarer-ről — Felfújható SUP és vízisport márka | {SITE}'
  description: 'Az Afarer globális felfújható SUP és vízisport márka, amelyet az Aquafarer LLC (USA) működtet és a csingtaói operációs csapatunk épít. Ismerje meg történetünket, mérnökségünket, tanúsított minőségünket és országos partnerprogramjainkat.'
  keywords:
    - 'felfújható SUP márka'
    - 'vízisport márka'
    - 'országos sup forgalmazó'
    - 'közös márkás sup kollekciók'
hero:
  tagline: 'Rólunk'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarar gyár és műhely
  title: |
    Tengeri mérnökség, <br />
    az <span class="text-accent dark:text-white">afarer</span> módszerrel építve
  subtitle: 'Egy parti műhelyben kezdtük egy lappal és egy makacs meggyőződéssel: a tengeri termékeket úgy kell megtervezni, mintha számítanának, mert számítanak. Ma több mint 40 országba szállítunk, de minden hajótest ugyanazokon a kezeken megy át, amelyek elindították a vállalatot.'


body: |
  <h2>Alapvető különbségek</h2>
  <p>A felfújható SUP-ok (iSUP) és a kemény lapok ugyanazt az alapvető célt szolgálják — állva evezés a vízen — de teljesen eltérő szerkezeti módszerekkel érik el. A helyes választás a lap tervezett használatától függ.</p>

  <table>
    <tr><th>Tényező</th><th>Felfújható SUP</th><th>Kemény SUP</th></tr>
    <tr><td>Szerkezet</td><td>Drop-stitch PVC, 12-15 PSI-re felfújva</td><td>Üvegszálas vagy epoxi burkolatú EPS habmag</td></tr>
    <tr><td>Súly</td><td>18-28 lbs (csak a lap)</td><td>20-30 lbs (csak a lap)</td></tr>
    <tr><td>Csomagolt méret</td><td>Hátizsák (30 x 15 x 10 hüvelyk)</td><td>Teljes hossz (10-14 láb)</td></tr>
    <tr><td>Előkészítés</td><td>3-5 perces felfújás</td><td>Azonnal használható</td></tr>
    <tr><td>Élettartam</td><td>5-10 év megfelelő gondozással</td><td>3-8 év (horpadásra hajlamos)</td></tr>
  </table>

  <h2>Hordozhatóság</h2>
  <p><strong>A felfújható nyer.</strong> Ez a legvilágosabb előny. Egy felfújható SUP hátizsákba csomagolható, amely elfér egy csomagtartóban, lakás szekrényében vagy repülőgépi fedélzeti csomagtartóban. Utazók, lakásban élők és bárki, aki nem rendelkezik tetőcsomagtartó-tárolóval, sokkal praktikusabbnak találja a felfújható SUP-okat.</p>
  <p>A kemény lapokhoz tetőcsomagtartó, nagy jármű vagy dedikált tárolóhely szükséges. Nehezen szállíthatók és speciális szállítóbontások nélkül nem vihetők repülőgépre.</p>

  <h2>Tartósság</h2>
  <p><strong>A felfújható nyer.</strong> A felfújható SUP-ok katonai minőségű PVC-ből készülnek, amely ellenáll az ütéseknek, szúrásoknak és UV-sérüléseknek. Amikor leejt egy felfújható lapot vagy sziklához ütődik, pattan. Egy kemény lap ugyanattól az ütéstől megrepedne, megsérülne vagy leválna a rétegei.</p>
  <p>A kemény lapok érzékenyebbek a mindennapi kopásra. Egyetlen betonra esés tartós horpadást okozhat, amely befolyásolja a teljesítményt és víz beszivárgását eredményezi.</p>

  <h2>Teljesítmény</h2>
  <p><strong>A kemény lap nyer a csúcspiaci szegmensben.</strong> Mérsékelt sebességű szabadidős evezéshez és túrázáshoz mindkét laptípus hasonlóan teljesít. A kemény lapok előnye:</p>
  <ul>
    <li><strong>Sebesség</strong> — A kemény lapok könnyebbek és merevebbek, ami jobb siklást és magasabb végsebességet eredményez</li>
    <li><strong>Szörfözés</strong> — A kemény lapok gyorsabb oldalpálya-átmeneteket és jobb hullám teljesítményt kínálnak</li>
    <li><strong>Versenyzés</strong> — A versenyszerű versenyzés szinte kizárólag kemény lapokat használ súly- és merevségi előnyeik miatt</li>
  </ul>
  <p>Az átlagos szabadidős evező számára ezek a teljesítménykülönbségek csekélyek. A legtöbb evező nem fogja felülmúlni egy minőségi felfújható lap teljesítményét.</p>

  <h2>Kezdőbarátságosság</h2>
  <p><strong>A felfújható nyer.</strong> A felfújható SUP-ok könnyebbek a kezdőknek, mert:</p>
  <ul>
    <li>A puhább fedélzeti felület kényelmesebb és kevésbé valószínű, hogy sérülést okoz esések közben</li>
    <li>A szélesebb, vastagabb felfújható lapok több elsődleges stabilitást kínálnak</li>
    <li>Az alacsonyabb befektetési költség elérhetőbbé teszi a belépést</li>
    <li>A könnyű szállítás több evezési lehetőséget jelent</li>
  </ul>

  <h2>Tárolás és karbantartás</h2>
  <p>A felfújható SUP-ok szárítást és megfelelő összehajtást igényelnek tárolás előtt. A kemény lapok összeszerelve tárolhatók, de védelmet igényelnek a naptól, hőtől és ütésektől. Mindkettő hasznát veszi az édesvízzel történő öblítésnek sós vizes használat után.</p>

  <h2>Ajánlás</h2>
  <p><strong>Válasszon felfújható SUP-ot, ha:</strong> Utazik, korlátozott a tárolóhelye, szabadidőben evez, vagy kezdő. Az evezők 90%-a jól ki lesz szolgálva egy minőségi felfújható lappal.</p>
  <p><strong>Válasszon kemény lapot, ha:</strong> Versenyszerűen versenyez, haladó hullámokon szörfözik, vagy a maximális teljesítményt helyezi előtérbe a hordozhatósággal és tartóssággal szemben.</p>

  <h2>GYIK</h2>
  <h3>Melyik tartósabb: a felfújható vagy a kemény SUP?</h3>
  <p>A felfújható SUP-ok általában tartósabbak, mert ellenállnak azoknak a horpadásoknak, repedéseknek és ütési sérüléseknek, amelyek tartósan megrongálnának egy kemény lapot.</p>

  <h3>Jobb-e a felfújható SUP kezdőknek?</h3>
  <p>Igen. A felfújható SUP-ok ajánlottak kezdőknek, mert megbocsátóbbak, könnyebben szállíthatók és kevésbé valószínű, hogy sérülést okoznak esések közben.</p>

  <h3>Teljesíthetnek-e a felfújható SUP-ok olyan jól, mint a kemény lapok?</h3>
  <p>Szabadidős evezéshez és túrázáshoz a felfújható SUP-ok felérnek a kemény lapok teljesítményével. A kemény lapok továbbra is kiválóak versenyzésben és haladó szörfözésben a könnyebb súlyuk és kifinomult hajlásuk miatt.</p>

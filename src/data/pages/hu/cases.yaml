features3_cases:
  tagline: 'Kiemelt esetek'
  title: 'Egyedi megoldások<br />valós kihívásokra'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Európai búvárközpont flottája'
      customer: 'BlueMed Diving Centers'
      country: 'Görögország'
      industry: 'Búvárkodás és tengeri turizmus'
      challenge: 'Több görög szigeten működő búvárközpont-lánc számára 12 búvár célú konfigurációjú SUP-ra volt szükség. Minden deszkának egyedi felszerelésrögzítést, 8 palack tárolási lehetőségét és stabil platformot kellett nyújtania a nyílt vízi búvár belépéséhez. A flottának 60 napon belül meg kellett érkeznie a turisztikai szezon kezdetére.'
      solution: '12 SUP Voyager Dive modellt gyártottunk integrált felszereléstartókkal, stabil platformokkal és extra széles drop-stitch szerkezettel a fedélzetre lépés stabilitásához. Minden deszkát az ügyfél flottajelzésével láttunk el. Mind a 12 deszka nyomásvizsgálaton esett át, és 55 napon belül kiszállításra került Qingdaóból.'
      product: 'SUP Voyager Dive'
      results: 'Mind a 12 deszka időben megérkezett a turisztikai szezonra. A flotta 18+ hónapja áll napi üzemben anyaghiba nélkül. Az ügyfél a második évben 6 további egységet rendelt.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'A SUP Voyager Dive a napi búvárműveleteink gerince. A stabilitás kiváló, és a felszereléstárolási elrendezés tisztán és biztonságosan tartja a fedélzetet a vendégeink számára.'
      icon: tabler:lifebuoy
    - title: 'Ausztrál forgalmazói co-brand program'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Ausztrália'
      industry: 'Co-brand és partnerségi program'
      challenge: 'Az ausztrál forgalmazónak versenyképes áron kínált saját márkás SUP deszka vonalra volt szüksége, hogy felvehesse a versenyt a fogyasztóknak közvetlenül értékesítő kínai márkákkal. 8 egyedi modellre volt szüksége a kezdőtől a haladó szintig, egyedi grafikákkal, egyedi csomagolással és a kiskereskedelmi pontokra történő közvetlen kiszállítással.'
      solution: '8 SUP modellt fejlesztettünk ki (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) kizárólagos ausztrál grafikai csomaggal. Egyedi kiskereskedelmi csomagolás QR-kódokkal, amelyek a beállítási videókra mutatnak. A közvetlen kiszállítási logisztika Qingdaóból közvetlenül az ausztrál kiskereskedelmi üzletekbe lett beállítva.'
      product: 'Egyedi SUP vonal (8 modell)'
      results: 'A koncepciótól az első szállításig 90 nap. 85%-os kiskereskedelmi értékesítési arány az első szezonban. A forgalmazó a második évben további SUP modellekkel bővítette a partnerséget.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Az afarer 90 nap alatt szállította le a teljes SUP vonalat — a kezdeti tervezéstől a kiskereskedelmi polcig. A minőség felér azokéval a márkákéval, amelyek kétszeres áron értékesítenek.'
      icon: tabler:currency-dollar
    - title: 'Közel-keleti mentőfelszerelés-szállítás'
      customer: 'Nemzeti Polgári Védelmi Hatóság'
      country: 'Egyesült Arab Emírségek'
      industry: 'Kutatás és mentés'
      challenge: 'A polgári védelmi szervezetnek 20 járőralkalmas SUP-ra volt szüksége partmenti kutató-mentő munkálatokhoz, kikötőbiztonsághoz és árvízeseményekre történő reagáláshoz. Nagy láthatóságú deszkákra, teljes biztonsági felszerelésre és a helyi tengerészeti előírásoknak való megfelelésre volt szükség.'
      solution: '20 SUP Patrol modellt szállítottunk nagy láthatóságú narancs drop-stitch szerkezettel, teljes biztonsági csomagokkal, SOLAS reflektáló szalaggal és megerősített szerkezettel. Minden deszka CE-tanúsítással rendelkezik, és a vonatkozó szabványok szerint lett tesztelve. A dokumentációs csomag tartalmazta a helyi lajstromozáshoz szükséges megfelelőségi tanúsítványokat.'
      product: 'SUP Patrol'
      results: 'A flotta 5 partmenti állomásra lett telepítve. A deszkák szélsőséges hőségben (45 °C felett) működnek romlás nélkül. A teljesítmény és a tartósság meghaladta a specifikációkat.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'A SUP Patrol meghaladta a működési követelményeinket. Szélsőséges hőviszonyok mellett a deszkák a napi használat 24 hónapja után sem mutatnak UV-romlás jeleit.'
      icon: tabler:alert-triangle
    - title: 'Európai co-brand partnerség'
      customer: 'North Sea Marine Equipment BV'
      country: 'Hollandia'
      industry: 'Co-brand és partnerségi program'
      challenge: 'Egy bevált európai vízi márka a SUP piacra kívánt belépni gyártási létesítményekbe történő befektetés nélkül. White-label partnerre volt szüksége, amely 5 SUP modell (9 és 12 láb közötti) gyártására képes saját márkázással, CE-tanúsítással és kizárólagos EU-s disztribúciós jogokkal.'
      solution: 'White-label gyártási megállapodást kötöttünk 5 SUP modellre. Minden modellt az ügyfél logóival és színsémájával láttunk el. Minden modellhez elkészült a CE-tanúsítási dokumentáció. Kizárólagos EU-s disztribúciós jogok lettek megadva minimális rendelési kötelezettségek mellett. Technikai dokumentáció biztosított a helyi szervizhálózathoz.'
      product: 'Egyedi SUP vonal (5 modell)'
      results: 'Többéves megállapodás került aláírásra. Az első, 50 egységből álló gyártási tétel 75 napon belül kiszállításra került. A márka egy jelentős szakvásáron debütált, pozitív kereskedői fogadtatással.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Az afarerrel való együttműködés lehetővé tette számunkra a SUP piacra lépést gyár építése nélkül — komplett, azonnal alkalmazható megoldást szállítottak CE-tanúsítással és kereskedői támogatási dokumentációval.'
      icon: tabler:building
    - title: 'Karibi reszort flotta'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahama-szigetek'
      industry: 'Tengeri turizmus és vendéglátás'
      challenge: 'A luxusreszortnak teljes vízisport-felszerelés flottára volt szüksége a vendégprogramokhoz: 40 SUP deszka vezetett túrákhoz, 20 további SUP lagúnafelfedezéshez, 10 SUP deszka vendégkirándulásokhoz, plusz tartozékok. Minden felszerelésnek egyedi reszort márkázással kellett rendelkeznie, és a turisztikai főszezon előtt meg kellett érkeznie.'
      solution: 'Teljes SUP csomagot gyártottunk: 40 SUP Voyager deszka (All-Around modell), 20 SUP Explorer deszka, 10 SUP Touring deszka, plusz mentőmellények, evezők, pumpák és javítókészletek. Minden felszerelést a reszort logójával és trópusi színsémával láttunk el. Konténeres szállítás teljes leltárjegyzékkel.'
      product: 'Teljes SUP csomag (70+ egység)'
      results: 'A flotta 6 héttel a főszezon előtt megérkezett. A vízisport-programok vendégelégedettségi pontszámai év/év alapon 40%-kal nőttek. A felszerelés 3 szezonon át üzemelt, kizárólag rutinkarbantartással.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'A komplett csomag megközelítésnek köszönhetően mindent egyetlen szállításban megkaptunk — deszkák és tartozékok, mind márkázva, a vendégek általi használatra készen. Vendégeink szeretik a felszerelés minőségét.'
      icon: tabler:beach
    - title: 'Amerikai partmenti járőrszerződés'
      customer: 'Atlantic Coastal Security Agency'
      country: 'Egyesült Államok'
      industry: 'Tengerészeti biztonság és bűnüldözés'
      challenge: 'Az amerikai partmenti biztonsági ügynökségnek nehéz terhelésű járőr SUP-okra volt szüksége nyílt vízi műveletekhez. Nagy teljesítményű deszkákra volt szükség katonai specifikációjú felszereléssel és az amerikai partőrség előírásainak való megfeleléssel.'
      solution: 'A SUP Patrolt megerősített drop-stitch szerkezettel, nagy láthatóságú színsémákkal, titkosított kommunikációs felszereléstartókkal és integrált felszerelésrögzítési pontokkal fejlesztettük ki. A deszkák nehéz üzemelésre lettek megerősítve. USCG-megfelelőségi dokumentáció biztosított.'
      product: 'SUP Patrol'
      results: 'Az ügynökség 95%-os küldetésre való készenléti arányt jelentett az első 12 hónapban. További rendelés történt 8 egységre.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'A SUP Patrol biztosítja legénységünk számára a nyílt vízi műveletekhez szükséges teljesítményt. A megerősített szerkezet kulcsfontosságú tartósságot nyújt a kezelhetőség rombolása nélkül.'
      icon: tabler:shield

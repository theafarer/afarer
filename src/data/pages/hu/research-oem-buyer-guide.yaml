content_html: |
  <h2>1. Előzetes minősítés: mire figyeljen egy gyár kiválasztásakor</h2>

  <h3>Megfelelőségi tanúsítványok</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Minőségirányítási rendszer</li>
    <li><strong>CE-tanúsítás</strong> – Ellenőrizze a bejegyzett szervezet számát</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Társadalmi megfelelőségi auditok</li>
    <li><strong>REACH / RoHS</strong> – Anyagmegfelelőségi nyilatkozatok</li>
  </ul>

  <h3>Gyártási képességek</h3>
  <ul>
    <li>Drop-stitch mag szövése házon belül vagy kiszervezve</li>
    <li>PVC bevonó / lamináló vonal</li>
    <li>RF hegesztő- és forró levegős hegesztőberendezések</li>
    <li>Házon belüli formakészítés (CNC megmunkálás)</li>
    <li>Tesztlabor (nyomásvizsgálat, UV-öregedés, húzóvizsgálat)</li>
  </ul>

  <h3>Tapasztalat ellenőrzése</h3>
  <ul>
    <li>Évek száma felfújható vízijármű-gyártásban (minimálisan 5+ év)</li>
    <li>Mérnökök száma a állományban</li>
    <li>Meglévő OEM/ODM ügyfelek (kérjen referenciákat)</li>
    <li>Exportcélok – szállítanak-e már az Ön célpiacára?</li>
  </ul>

  <h2>2. Minőségkontroll-protokollok</h2>
  <p>Beérkező anyag QC: húzószilárdság (ASTM D751 vagy ISO 1421), szakítószilárdság (ASTM D2261 vagy ISO 4674), adhéziós szilárdság, UV-öregedési ellenőrzések.</p>
  <p>Folyamat közbeni QC: varmatszilárdság-figyelés 50 egységenként, szelep nyomaték-ellenőrzés, drop-stitch szálsűrűség-ellenőrzés, méretellenőrzés CAD-rajzok alapján.</p>
  <p>Végellenőrzés: 100%-os felfúvási tartási teszt (24 óra, max. 5% esés), vizuális ellenőrzés, szelepműködési teszt, véletlenszerű mintavizsgálat (AQL 2,5 vagy 4,0 az ISO 2859 szerint).</p>

  <h2>3. Megfelelőségi dokumentációs ellenőrzőlista</h2>
  <ul>
    <li>Megfelelőségi nyilatkozat (DoC) a helyes EU-irányelvre hivatkozva</li>
    <li>CE-tanúsítvány bejegyzett szervezettől</li>
    <li>Akkreditált labor tesztjelentése</li>
    <li>Anyagbiztonsági adatlapok (MSDS)</li>
    <li>REACH-megfelelőségi nyilatkozat</li>
    <li>Anyagjegyzék beszállítói visszakövethetőséggel</li>
    <li>Gyár-ellenőrzési jelentés</li>
  </ul>

  <h2>4. MOQ-tárgyalás</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Terméktípus</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Standard MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tárgyalható tartomány</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">SUP deszkák</td><td class="p-3 border">50 – 100 egység</td><td class="p-3 border">5 – 10 egység (próba)</td></tr>
      <tr><td class="p-3 border">Kajakok</td><td class="p-3 border">50 – 100 egység</td><td class="p-3 border">5 – 10 egység (próba)</td></tr>
      <tr><td class="p-3 border">Felfújható SUP-ok</td><td class="p-3 border">50 – 100 egység</td><td class="p-3 border">2 – 5 egység (próba)</td></tr>
      <tr><td class="p-3 border">Biztonsági felszerelés / tartozékok</td><td class="p-3 border">200 – 500 egység</td><td class="p-3 border">50 – 100 egység (próba)</td></tr>
    </tbody>
  </table>

  <h2>5. Logisztika és szállítás</h2>
  <p>Gyakori Incoterms: <strong>FOB</strong> (a gyár az indulási kikötőig szállít – a leggyakoribb), <strong>EXW</strong> (a vevő intéz minden szállítást a gyárkaputól), <strong>CIF</strong> (a gyár fizeti a fuvart és a biztosítást a célkikötőig).</p>
  <p>A felfújható termékek kis súlyú, nagy térfogatúak – a térfogatsúly (DIM) gyakran a szállítási költséget határozza meg. Kérjen vákuumcsomagolást a térfogat 50–60%-os csökkentéséhez. Tengeri szállítás Kínából az EU-ba: 25–35 nap; az amerikai nyugati partra: 15–20 nap.</p>

  <h2>6. Gyakori buktatók</h2>
  <ul>
    <li><strong>Nincs gyári audit:</strong> Mindig végezzen vagy rendeljen harmadik fél általi auditot (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Csak szóbeli specifikációk:</strong> Részletes műszaki specifikációs lap, mindkét fél által aláírva</li>
    <li><strong>Mintajóváhagyás kihagyása:</strong> Írásos jóváhagyás a mintákról a sorozatgyártás előtt</li>
    <li><strong>Nincs QC a gyártás alatt:</strong> Harmadik fél általi ellenőrzés a gyártás alatt (DUPRO) és a szállítás előtt (PSI)</li>
    <li><strong>A megfelelőség figyelmen kívül hagyása:</strong> Ellenőrizze a CE/UKCA tanúsítást a gyártás előtt</li>
  </ul>

  <h2>7. Miért az Afarer</h2>
  <p>Az Afarer 2012 óta gyárt OEM/ODM felfújható vízijárműveket. Az ISO 9001 tanúsítású 12 000 m&sup2;-es létesítménnyel, 25+ mérnökkel és minden termékvonal CE-tanúsításával teljesítjük az útmutató minden kritériumát. Próba-MOQ-kat kínálunk új partnereknek és teljes megfelelőségi dokumentációs csomagokat.</p>


meta:
  title: 'Tengeri szakértelem — Mérnökség minden hajótestben | {SITE}'
  description: 'Évtizedek tengeri mérnöksége minden hajótestben. Az afarar szakértője a drop stitch, tengeri PVC és professzionális felfújható SUP tervezésnek.'
  keywords:
    - 'tengeri mérnökség'
    - 'felfújható SUP gyártó'
    - 'paddle lap gyártás'
hero:
  tagline: 'Tengeri szakértelem'
  title: 'Évtizedek tengeri mérnöksége<br />minden hajótestben'
  subtitle: 'Az afarar ötvözi a mély anyagtudományt, precíziós gyártást és valós körülmények közötti tesztelést, hogy olyan vízi járműveket készítsen, amelyek akkor is teljesítenek, amikor számít.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarar tengeri mérnöki és fejlesztőcsapat munka közben
expertise_materials:
  tagline: 'Anyagtudomány'
  title: 'A megfelelő anyag kiválasztása<br />minden alkalmazáshoz'
  subtitle: 'Két alapanyaggal dolgozunk — mindegyiket konkrét felhasználási esetekre és teljesítménykövetelményekre választottuk ki.'
  columns: 3
  items:
    - title: 'Tengeri minőségű PVC'
      description: '1100 denier PVC szövet — leginkább sokoldalú anyagunk. UV-stabilizált, kopásálló és REACH-megfelelő. Ideális SUP lapokhoz, ahol a súly és a költséghatékonyság számít.'
      icon: tabler:droplet
    - title: 'Üvegszálas és polietilén'
      description: 'Üvegszálas laminált SUP-ok prémium merevséghez és sikláshoz. Forgóöntött polietilén nehéz terhelésű bérlési és mentési használatra, maximális ütésállóságot igényelve.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Gyártási képességek'
  title: 'Precíziós gyártás<br />minden lépésben'
  subtitle: '12 000 m²-es létesítményünk specializált gépekkel van felszerelve a gyártás minden szakaszához.'
  columns: 2
  items:
    - title: 'CNC vágás'
      description: 'Számítógép-vezérelt vágás biztosítja a pontos, megismételhető szövet paneleket minimális hulladékkal. Minden darab pontosan úgy illeszkedik, ahogyan tervezve lett.'
      icon: tabler:cpu
    - title: 'Nagyfrekvenciás hegesztés'
      description: 'Ipari HF hegesztés az alapanyagnál erősebb varratokat hoz létre. A következetes hőmérséklet- és nyomásszabályozás légmentes tömítéseket biztosít minden gyártási sorozatban.'
      icon: tabler:bolt
    - title: 'Drop stitch mag szerelés'
      description: 'Több ezer poliészter szál köti össze a felső és alsó szövetréteget, lehetővé téve a magas nyomású felfújást (15-20 PSI) merev, stabil SUP lapokhoz.'
      icon: tabler:building-arch
    - title: 'Nyomástesztelés'
      description: 'Minden felfújható terméket nyomástesztelnek szállítás előtt. A lapokat a névleges nyomás 1,25-szörösén tesztelik — ha ott tart, akkor a vízen is teljesíteni fog.'
      icon: tabler:wind
    - title: 'Varmatszilárdság-tesztelés'
      description: 'Minden gyártási tételből véletlenszerű minták roncsoló varmatszilárdság-tesztelésen esnek át. Az eredmények naplózottak és visszavezethetők konkrét gyártási sorozatokra.'
      icon: tabler:files
    - title: 'Vízi tesztelés'
      description: 'Minden modell tengeri próbán esik át a tanúsítás előtt. A valós körülmények közötti tesztelés part menti viszonyok között érvényesíti a teljesítményt, kezelhetőséget és stabilitást.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Dizájn és mérnökség'
  title: 'Valódi körülményekre tervezve'
  subtitle: 'Tervezési filozófiánk azzal indul, hogy a lapot hogyan fogják használni — majd erre a felhasználási esetre épül a mérnökség.'
  items:
    - title: 'Teljesítmény hajótest dizájn'
      description: 'Minden hajótestforma a felhasználási esetére van hangolva — úszóképesség orr a túra sikláshoz, hozzáadott orlemmegedés a szörf mozgékonysághoz, lapos stabil profilok a horgászathoz és jógához.'
    - title: 'Drop-stitch biztonság'
      description: 'Minden lap merev drop-stitch maggal és megerősített oldalpályákkal rendelkezik. Ha egy szakasz megsérül, a nagy szilárdságú drop-stitch szerkezet működőképesen tartja a lapot.'
    - title: 'Ergonomikus fedélzeti elrendezés'
      description: 'A fedélzeti burkolat zónázása, hordozófogantyú pozíciója és szerelési pontok a versenyző kényelmére vannak tervezve hosszabb használat során — legyen szó túrázásról, horgászatról vagy járőrmunkáról.'
    - title: 'Egyedi konfiguráció'
      description: 'Oldalpálya színek, fedélzeti burkolat konfiguráció, kiegészítő tartók, felszerelés kapacitás — minden model testreszabható konkrét működési követelményekhez.'
cta:
  title: 'Van konkrét alkalmazás a fejében?'
  subtitle: 'Mérnöki csapatunk tanácsot adhat anyagkiválasztásban, tervezésben és gyártásban a projektjéhez.'
  actions:
    - variant: primary
      text: 'Kérdezze meg mérnökeinket'
      href: /contact/
    - text: 'Tekintse meg termékkínálatot'
      href: /products/

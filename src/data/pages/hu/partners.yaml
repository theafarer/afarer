hero:
  tagline: 'Partnerek és disztribúció'
  title: 'Legyen afarar partner<br />— Globális disztribúciós hálózat'
  subtitle: 'Csatlakozzon az afarar globális partnerhálózatához. Tengeri forgalmazókkal, evezős sport kereskedőkkel, felszerelés kiskereskedőkkel és márkapartnerekkel dolgozunk 50+ országban.'

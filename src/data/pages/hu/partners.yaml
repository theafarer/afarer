content_programs:
  tagline: 'Partnerprogramok'
  title: 'Növekedésre épített<br />partnerprogramok'
  subtitle: 'Legyen Ön forgalmazó, kereskedő vagy márkapartner, az afarar olyan programokat kínál, amelyek támogatják vállalkozását.'
  columns: 3
  items:
    - title: 'Forgalmazói program'
      description: 'Kizárólagos területi disztribúció mennyiségi árazással, marketingtámogatással és közvetlen gyári hozzáféréssel. Minimális elkötelezettség szükséges a terület méretétől függően.'
      icon: tabler:world
    - title: 'Kereskedői program'
      description: 'Közvetlen kereskedői árazás, termékképzés, marketinganyagok és garanciatámogatás kiskereskedelmi helyszínekhez és online boltokhoz.'
      icon: tabler:building-store
    - title: 'OEM/ODM partnerség'
      description: 'Teljes körű OEM és ODM gyártás egyedi márkázással, csomagolással és termékspecifikációkkal. A koncepciótól a konténerig.'
      icon: tabler:certificate
    - title: 'Márkapartnerség'
      description: 'Közös márka, saját márka és kizárólagos modell programok bevált márkáknak a tengeri és szabadtéri szabadidős szektorban.'
      icon: tabler:stars
    - title: 'Kormányzati és intézményi'
      description: 'Kiemelt beszállítói programok kormányzati szerveknek, partőrségeknek, katonaságnak és humanitárius szervezeteknek. Tenderre kész dokumentáció.'
      icon: tabler:building-community
    - title: 'Üdülő és bérlő partner'
      description: 'Flotta árazás, következetes minőség és egyedi márkázás üdülőknek, búvárközpontoknak és bérlési vállalkozásoknak világszerte.'
      icon: tabler:sun
content_benefits:
  tagline: 'Miért legyen a partnerünk'
  title: 'Miért választják a partnerek az afarart'
  subtitle: 'Partnereink valódi gyártási képességből, következetes minőségből és gyors reagálású támogatásból profitálnak.'
  list:
    - 'Közvetlen gyári hozzáférés: Működjön együtt közvetlenül gyártócsapatunkkal — közvetítők nélkül. Gyorsabb válaszok, jobb árazás és teljes betekintés a gyártásba.'
    - 'Testreszabásra kész: Márkázza termékeit egyedi színekkel, logókkal, csomagolással és specifikációkkal. Az Ön piacára szabott minimális rendelési mennyiségek.'
    - 'Garantált minőség: ISO 9001 tanúsított gyártás CE, UKCA és BSCI megfelelőséggel. Minden termék tesztelve szállítás előtt.'
    - 'Globális logisztika: Szállítás Csingtaóból, Kínából FOB, CIF és DDP opciókkal. USA raktár Montclairben, Kaliforniában az észak-amerikai disztribúcióhoz.'
    - 'Marketingtámogatás: Termékkatalógusok, fotózás, műszaki dokumentáció és digitális eszközök az értékesítési erőfeszítései támogatására.'
    - 'Képzés és támogatás: Termékképzés értékesítési csapatának, műszaki támogatás ügyfeleinek és garanciaszerviz koordináció.'
content_process:
  tagline: 'Hogyan válhat partnerré'
  title: 'Egyszerű partnerségi folyamat'
  subtitle: 'Partnerségi folyamatunk egyértelmű — arra terveztük, hogy gyorsan elkezdhesse az afarar termékek értékesítését.'
  items:
    - title: '1. lépés: Jelentkezés benyújtása'
      description: 'Töltse ki partnerjelentkezési űrlapunkat vállalati profiljával, célpiacával és termékérdeklődéseivel.'
    - title: '2. lépés: Minősítési felülvizsgálat'
      description: 'Partnerségi csapatunk átnézi jelentkezését, és 3 munkanapon belül felveszi Önnel a kapcsolatot a lehetőségek megvitatására.'
    - title: '3. lépés: Megállapodás és beállítás'
      description: 'Írja alá a partnerségi megállapodást, hozza létre fiókját, és kapja meg a partneri árazást, marketinganyagokat és termékmintákat.'
    - title: '4. lépés: Képzés és indulás'
      description: 'Termékképzés, értékesítési támogatás és marketinganyagok biztosítva. Készen áll az értékesítés megkezdésére.'

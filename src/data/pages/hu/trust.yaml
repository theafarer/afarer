faqs_sup:
  title: 'SUP lapok GYIK'
  subtitle: 'Gyakori kérdések stand-up paddle lapjainkkal kapcsolatban.'
  columns: 2
  items:
    - title: 'Milyen SUP lap méretekben kínál az afarar?'
      description: 'SUP lapokat kínálunk 9 lábtól 12 lábig, a kompakt all-around lapoktól a túra- és különleges dizájnokig. Minden modell több konfigurációs lehetőséggel érhető el.'
    - title: 'Mi a különbség a felfújható SUP és a kemény SUP között?'
      description: 'A felfújható SUP drop-stitch szerkezetet használ több ezer belső száallal, amelyek magas légnyomást tesznek lehetővé, míg a kemény SUP epoxi vagy üvegszálas anyagot használ. A felfújható SUP-ok hordozhatóságot és tárolási kényelmet kínálnak a merevség feláldozása nélkül.'
    - title: 'Mekkora a súlyhatár a SUP lapoknál?'
      description: 'SUP lapjaink modelltől és térfogattól függően akár 150 kg-ig terhelhetők. Minden terméklap feltünteti az adott modell maximális terhelési értékét.'
    - title: 'CE-tanúsítvánnyal rendelkeznek az afarar SUP-ok?'
      description: 'Igen. Minden szabadidős SUP modell CE-tanúsítvánnyal rendelkezik az alkalmazandó európai szabványok szerint szabadidős használatra.'
    - title: 'Mennyi a garancia a SUP lapokra?'
      description: 'Minden afarar SUP standard egyéves garanciával rendelkezik gyártási hibákra, amely varrathibákra, szelephibákra és anyagleválásra terjed ki normál használat esetén.'
    - title: 'Mennyi ideig tart egy SUP lap felfújása?'
      description: 'A mellékelt kézi szivattyúval a teljes 15 PSI-re történő felfújás körülbelül 8–12 percet vesz igénybe. Gyorsabb felfújáshoz az afarar 12V elektromos szivattyút ajánljuk, amely 4 perc alatt felfúj egy lapot.'

faqs_materials:
  title: 'SUP anyag és karbantartás GYIK'
  subtitle: 'Gyakori kérdések felfújható SUP anyagokról, karbantartásról és tárolásról.'
  columns: 2
  items:
    - title: 'Milyen anyagokat használnak az afarar felfújható SUP-okban?'
      description: 'Katonai minőségű PVC-t (1100 denier) használunk UV-stabilizált, kopásálló szerkezettel, amely megfelel az EU REACH és RoHS előírásoknak.'
    - title: 'Mennyi ideig tartanak a felfújható SUP-ok?'
      description: 'Megfelelő gondozással egy minőségi PVC felfújható SUP 5–10 évig tart. A rendszeres tisztítás, UV-védelem és helyes tárolás jelentősen meghosszabbítja az élettartamot.'
    - title: 'Milyen karbantartás szükséges egy felfújható SUP-hoz?'
      description: 'Az alapvető karbantartás a következőket foglalja magában: édesvízzel történő öblítés minden használat után (különösen sós vízben), szárítás tárolás előtt, szeleptömítések éves ellenőrzése és hosszabb napsugárzás kerülése használaton kívül.'
    - title: 'Használhatók a felfújható SUP-ok sós vízben?'
      description: 'Igen. Minden afarar felfújható SUP édesvízi és sós vízi használatra egyaránt tervezett. Javasoljuk az édesvízzel történő öblítést és alapos szárítást sós vizes használat után.'
    - title: 'Hogyan tároljam a felfújható SUP-ot?'
      description: 'Engedje le a levegőt, tisztítsa meg és szárítsa meg a lapot teljesen tárolás előtt. Tekerje lazán (kerülje a szoros hajtásokat), tárolja hűvös, száraz helyen közvetlen napfénytől távol, és tartsa betonpadlótól távol a nedvességfelvétel elkerülése érdekében.'
    - title: 'Mekkora a teherbírása az afarar felfújható SUP-oknak?'
      description: 'A teherbírás 100 kg-tól a legkisebb modelljeinknél 200 kg fölöttig terjed a nagyobb lapoknál. Minden terméklap feltünteti az adott modell maximális terhelési értékét.'


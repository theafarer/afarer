      title: 'Túraszervező, Horvátország'
    - content: 'Első alkalommal vásárlóként aggódtam a minőség miatt. Az általuk megosztott ISO-dokumentáció és tesztjelentések teljes bizalmat adtak nekem.'
      name: 'James T.'
      title: 'SUP Explorer 11 tulajdonos, Kanada'
    - content: 'Az afararral dolgozunk a part menti járőregységeinkhez. Minőség-ellenőrzési folyamatuk minden tételnél következetes — ez a megbízhatóság kulcsfontosságú a küldetéskritikus műveletekben.'
      name: 'Lt. Cmdr. Andres'
      title: 'Kormányzati beszerzés, Fülöp-szigetek'


features3_certifications:
  title: 'Tanúsítványok és megfelelőség'
  subtitle: 'Minden terméket függetlenül tesztelnek és nemzetközi szabványok szerint tanúsítanak.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'CE-tanúsítvány'
      description: 'Minden afarar SUP megfelel az európai CE biztonsági szabványnak szabadidős használatra. Minden termék nyomás-, úszóképesség- és terhelésesztésen esik át, mielőtt elhagyja a gyárat.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: '12 000 m²-es csingtaói üzemünk ISO 9001 minőségirányítási rendszer szerint működik. Minden gyártási tétel nyomon követhető, dokumentált és ellenőrzött.'
      icon: 'tabler:clipboard-check'
    - title: 'BSCI társadalmi megfelelőség'
      description: 'BSCI-tanúsítással rendelkezünk, amely etikus munkagyakorlatokat, biztonságos munkakörülményeket és környezetvédelmi felelősségvállalást biztosít a teljes ellátási láncunkban.'
      icon: 'tabler:users'
    - title: 'REACH és RoHS'
      description: 'Minden anyag — PVC, EVA hab, ragasztók — megfelel az EU REACH és RoHS előírásainak. Nincs korlátozott anyag, nincs kompromisszum.'
      icon: 'tabler:flask'
    - title: 'Anyagvizsgálati labor'
      description: 'Saját laborunkban minden szövet tétel húzószilárdság, UV-állóság, varrat integritás és kopásállóság szempontjából tesztelésen esik át a gyártás előtt.'
      icon: 'tabler:microscope'
    - title: '2 éves garancia'
      description: 'Minden afarar termék két éves garanciával rendelkezik gyártási hibákra. Kiállunk azért, amit gyártunk.'
      icon: 'tabler:shield-check'

testimonials:

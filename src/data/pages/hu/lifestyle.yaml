meta:
  title: 'Életmód — Evezés, kaland és felfedezés | {SITE}'
  description: 'Fedezze fel az afarar életmódot: evezős kalandok, vízi felfedezés és szabadtéri élmények felfújható SUP-okkal és lapokkal.'
  keywords:
    - 'sup életmód'
    - 'evezős kalandok'
    - 'felfújható sup szabadtér'
    - 'vízisport életmód'
hero:
  tagline: 'Életmód'
  title: 'Az afarar<br />életmód'
  subtitle: 'Azoknak építve, akik a vízen élnek — hétvégi felfedezőktől azokig a kereskedelmi üzemeltetőkig, akik minden nap támaszkodnak a felszerelésükre.'

values:
  - icon: 🌊
    title: 'A vízen születtünk'
    desc: 'Minden dizájn azzal kezdődik, hogy megértjük, hogyan viselkedik a víz. A körülmények szélétől befelé tervezünk — mert az óceán a tanítónk, nem a munkahelyünk.'
  - icon: 🔧
    title: 'Tartósra építve'
    desc: 'A legfenntarthatóbb termék az, amelyet nem kell cserélni. Tengeri minőségű anyagok, 15 PSI-re minősített drop-stitch magok és a szezont túlélő varratok.'
  - icon: 🏆
    title: 'Dizájn által hozzáférhető'
    desc: 'A vízisport nem szabadna luxus legyen. Professzionális minőségű teljesítmény olyan áron, amely értelmes családoknak, túravezetőknek és kis üzemeltetőknek — nem csak kereskedelmi flottáknak.'
  - icon: 🌍
    title: 'Globális közösség'
    desc: 'Csingtao partjától az európai tavakon át a délkelet-ázsiai folyókig és az amerikai öblökig — ügyfeleink egy dologban osztoznak: a vízen lét szeretetében.'
  - icon: ♻️
    title: 'Felelős gyártás'
    desc: 'A CNC-vel optimalizált beágyazás 5% alá csökkenti az anyaghulladékot. A tartós szerkezet csökkenti a csereciklusokat. A hosszú élettartamra építünk, mert ez a legfenntarthatóbb választás.'
  - icon: 🤝
    title: 'Tartós támogatás'
    desc: 'Húsz éves hajótestek ma is hívnak minket alkatrészért. Garanciális válaszidejünk átlagosan 24 óra. Nem tűnünk el az eladás után — a termék teljes élettartamára itt vagyunk.'


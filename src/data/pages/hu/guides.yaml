size_guide:
  tagline: 'Méret és specifikációk'
  title: 'Találja meg a megfelelő méretet az igényeihez'
  desc: 'Hasonlítsa össze a SUP deszka méreteket, súlykapacitásokat és ajánlott felhasználásokat. Legyen szó túra SUP-ról, jógadeszkáról vagy all-around SUP-ról — méret útmutatónk segít a megfelelő választásban.'
  link_label: 'Teljes méret útmutató termékspecifikációkkal →'
  link: /size-guide
  cards:
    - title: 'SUP deszkák'
      desc: 'Válasszon hosszúságot a súlya és a tervezett használat alapján. A szélesebb deszkák (32"+) nagyobb stabilitást nyújtanak. A hosszabb deszkák (11–12 láb) jobban tartják az irányt túrázáshoz.'
    - title: 'Túra SUP-ok'
      desc: 'Hosszabb deszkák (11–12 láb) távolságok megtételéhez és egyenes iránytartáshoz. Elég stabilak felszereléssel történő túrázáshoz. Mindig ellenőrizze a súlykapacitást.'
    - title: 'All-Around SUP-ok'
      desc: 'Válasszon hosszúságot a versenyző súlya és a használat szerint. Szélesebb deszkák (32"+) a stabilitásért. Sokoldalúak szabadidőre és fitneszre.'

meta:
  title: 'Globális jelenlét — SUP gyártó 50+ ország kiszolgálásával | {SITE}'
  description: 'Az afarar felfújható SUP-okat exportál 50+ országba minden kontinensen. Professionális gyártó és beszállító márkáknak, forgalmazóknak és flottáknak.'
  keywords:
    - 'globális sup gyártó'
    - 'paddle lap exportőr'
    - 'sup gyár kína'
    - 'professzionális sup beszállító'

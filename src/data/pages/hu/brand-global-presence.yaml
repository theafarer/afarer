  title: 'Szeretne forgalmazóvá válni?'
  subtitle: 'Aktívan bővítjük disztribúciós hálózatunkat. Vegye fel a kapcsolatot exportcsapatunkkal a partnerségi lehetőségek megvitatásához.'

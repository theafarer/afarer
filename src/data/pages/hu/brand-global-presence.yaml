  tagline: 'Globális jelenlét'
  title: '50+ ország kiszolgálása<br />minden kontinensen'
  subtitle: 'Az európai part menti járőr üzemeltetőktől az ausztrál vízisport forgalmazókig a közel-keleti mentőcsapatokig — az afarar lapok világszerte a vízen vannak.'
  image:

features3_markets:
  tagline: 'Fő piacok'
  title: 'Regionális szakértelem<br />helyi követelményekhez'
  subtitle: 'Megértjük, hogy a különböző piacoknak különböző szabályozási követelményeik, preferenciáik és felhasználási eseteik vannak.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Európa és Egyesült Királyság'
      description: 'CE-tanúsított termékek. Erős kereslet SUP lapokra az EU piacokon. Az Egyesült Királyság forgalmazói értékelik gyors átfutásunkat.'
      icon: tabler:map-pin
    - title: 'Észak-Amerika'
      description: 'US Coast Guard által jóváhagyott gyártás. USA raktár Montclairben, Kaliforniában a gyors nyugati parti szállításhoz. Növekvő kereslet horgász, mentő és szabadidős SUP-okra.'
      icon: tabler:map-pin
    - title: 'Ausztrália és Óceánia'
      description: 'Erős piac SUP lapokra és vízisport kiegészítőkre. Az ausztrál forgalmazók értékelik UV-álló PVC szerkezetünket a zord napsütéses körülmények között. Gyors szállítás ázsiai létesítményünkből.'
      icon: tabler:map-pin
    - title: 'Közel-Kelet'
      description: 'Növekvő kereslet vízi kaland felszerelésekre. Kereskedelmi minőségű SUP-jaink és biztonsági felszereléseink népszerűek a túraszervezők és bérlőközpontok körében. Egyedi konfigurációk magas hőmérsékletű környezetekhez.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Disztribúciós hálózat'
  title: 'Együttműködés forgalmazókkal<br />világszerte'
  subtitle: 'Bevált tengeri felszerelés forgalmazókkal, vízisport márkákkal és kormányzati beszerzési szervekkel dolgozunk.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Közös márka programok'
      description: 'Saját márka gyártás globális vízisport márkáknak. Mindent kezelünk a tervezéstől a gyártáson át a közvetlen szállításig.'
      icon: tabler:building
    - title: 'Forgalmazói hálózat'
      description: 'Jogosított forgalmazók 20+ országban készletet tartanak és helyi támogatást nyújtanak. Új forgalmazói megkereséseket szívesen fogadunk.'
      icon: tabler:users
    - title: 'Kormányzati és intézményi'
      description: 'Közvetlen beszállítás partőrségeknek, kereső-mentő szervezeteknek és katonai beszerzési programoknak. Intézményi beszerzési követelményeknek való megfelelés.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Globális logisztika és támogatás'
  subtitle: 'A gyártól a célállomásig — a teljes ellátási láncot kezeljük.'
  items:
    - title: 'Szállítási opciók'
      description: 'Tengeri szállítás (FOB Csingtao), légi szállítás sürgős megrendelésekhez és expressz futár mintákhoz és cserealkatrészekhez.'
      icon: tabler:truck-delivery
    - title: 'USA raktár'
      description: 'Készlet Montclairben, Kaliforniában a gyors szállításhoz Észak-Amerikában. Nyugati part: 2-3 nap, Középső régió: 3-4 nap, Keleti part: 4-5 nap.'
      icon: tabler:building-warehouse
    - title: 'Cserealkatrészek'
      description: 'Eredeti afarar cserealkatrészek és fogyóeszközök egész évben készleten. Gyakori alkatrészek 24 órán belüli szállítással.'
      icon: tabler:package
    - title: 'Műszaki támogatás'
      description: 'Közvetlen vonal mérnöki csapatunkhoz műszaki kérdésekhez, javítási tanácsokhoz és cserealkatrész-támogatáshoz. Támogatjuk azokat a lapokat is, amelyeket 20 évvel ezelőtt építettünk.'
      icon: tabler:headset

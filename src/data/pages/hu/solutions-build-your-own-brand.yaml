meta:
  title: 'Saját márkás SUP gyártás és egyedi márka indítása | {SITE}'
  description: 'Saját márkás SUP gyártó új paddle board márkák számára. Indítsa el saját SUP márkáját az Afarerrel — teljes OEM/ODM szolgáltatás beleértve a tervezést, prototípuskészítést, egyedi márkázást, gyártást és globális logisztikát.'

hero:
  tagline: 'Építse meg saját márkáját'
  title: 'Indítsa el saját<br />SUP márkáját'
  subtitle: 'Önnél a vízió. Nálunk a gyár, a szakértelem és az ellátási lánc. Saját márkás SUP gyártás és egyedi SUP márkafejlesztés — együtt olyan márkát építünk, amely kiemelkedik.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: 'Egyedi márkázású SUP deszka a vízen'

process:
  title: 'Az Ön márkaútja'
  subtitle: 'Az ötlettől a piacig 5 fázisban.'
  steps:
    - phase: '1. fázis'
      title: 'Ötlet'
      period: '1-2. hét'
      items:
        - 'Piackutatás és versenytárselemzés'
        - 'Célfogyasztó meghatározása'
        - 'Márkaposicionálási műhely'
        - 'Termékvonal-stratégia'
    - phase: '2. fázis'
      title: 'Tervezés'
      period: '3-6. hét'
      items:
        - 'Deszkaforma és grafikai tervezés'
        - 'Színillesztés és anyagválasztás'
        - 'Tartozékspecifikáció'
        - 'Csomagolás- és címketervezés'
    - phase: '3. fázis'
      title: 'Prototípus'
      period: '7-10. hét'
      items:
        - 'Mintagyártás'
        - 'Minőségi tesztelés (nyomás, felhajtóerő, UV)'
        - 'Tervezési módosítások'
        - 'Végső jóváhagyás'
    - phase: '4. fázis'
      title: 'Gyártás'
      period: '11-14. hét'
      items:
        - 'Sorozatgyártás'
        - 'QC ellenőrzés (egységenként)'
        - 'Tengeri / légi szállítmány'
        - 'Vámkezelési dokumentumok'
    - phase: '5. fázis'
      title: 'Bevezetés'
      period: '15-16. hét'
      items:
        - 'Termékfotózás'
        - 'Weboldali termékadatcsatorna'
        - 'Marketinganyagok'
        - 'Bevezetési támogatás'

packages:
  title: 'Startup csomagok'
  subtitle: 'A márkanövekedés minden szakaszára tervezett csomagok.'
  items:
    - name: 'Kezdő márka'
      tagline: '50-100 egység · 2 deszkamodell'
      features:
        - 'Alapszintű logónyomtatás'
        - 'Standard csomagolás'
        - 'E-mailes támogatás'
    - name: 'Növekvő márka'
      tagline: '300-1 000 egység · 3-5 deszkamodell'
      features:
        - 'Egyedi szín + logó'
        - 'Egyedi csomagolás'
        - 'Termékfotók'
        - 'Dedikált menedzser'
    - name: 'Bevált márka'
      tagline: '1 000+ egység · Teljes termékvonal'
      features:
        - 'Teljes testreszabás'
        - 'Prémium csomagolás'
        - 'Marketinganyagok'
        - 'Elsőbbségi gyártás'


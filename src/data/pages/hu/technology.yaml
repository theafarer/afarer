hero:
  tagline: 'Technológia'
  title: 'Teljesítményre építve'
  subtitle: 'Minden afarar felfújható SUP drop-stitch szerkezettel és tengeri minőségű PVC-vel készül — precíziós anyagok és gyártási módszerek, amelyek igényes tengeri környezetekre vannak tesztelve.'

sections:
  - title: 'Drop-stitch mag'
    description: 'Több ezer belső poliészter szál köti össze a felső és alsó réteget, merev szerkezetet hozva létre 12-15 PSI-n. Ez ugyanaz a technológia, amelyet professzionális paddle lapokban és felfújható verseny SUP-okban használnak.'
    imageAlt: 'DS mag diagram'
  - title: 'Tengeri minőségű PVC'
    description: 'Több rétegű laminált PVC szövet tengeri környezetekre minősítve. Minden réteg fúziós hegesztéssel kerül összekötésre ragasztás helyett, kizárva a rétegleválás kockázatát. UV-állóságra, sós vízi korrózióra és kopásra tesztelve.'
    imageAlt: 'PVC réteg'
  - title: 'Katonai minőségű PVC'
    description: 'Minden SUP modellen használt prémium PVC kiváló UV- és kémiai ellenállást biztosít. Rugalmasságát szélsőséges hőmérsékleteken is megőrzi és ellenáll a degradációnak.'
    imageAlt: 'PVC'
  - title: 'Légpadlós padló'
    description: 'Magas nyomású felfújható drop-stitch szerkezet, amely kivételes merevséget biztosít álláshoz, horgászathoz és jógához. Csökkenti az előkészítési időt, összsúlyt és tárolási térfogatot.'
    imageAlt: 'Légpadló'


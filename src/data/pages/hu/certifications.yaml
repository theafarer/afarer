meta:
  title: 'Tanúsítványok — CE, ISO 9001 és megfelelőség | {SITE}'
  description: 'afarer minőségi tanúsítványok: CE (EN ISO 25649), ISO 9001:2015, BSCI. Megfelelőség és biztonság egy felfújható SUP gyártónál.'
  keywords:
    - 'ce tanúsítás sup'
    - 'iso 9001 sup'
    - 'vízi megfelelőség'
    - 'paddle board tanúsítás'
hero:
  tagline: 'Tanúsítványok és szabványok'
  title: 'Minőségi tanúsítványok<br />és megfelelőségi szabványok'
  subtitle: 'Az afarer SUP gyártás nemzetközi tengeri biztonsági szabványok, minőségirányítási rendszerek és környezetvédelmi előírások szerint tanúsított — CE, ISO 9001, UKCA, BSCI és REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'afarer minőségi tanúsítványok és megfelelőségi dokumentáció'
content_certifications:
  tagline: 'Tanúsítványaink'
  title: 'Tanúsított minőség,<br />világszerte elismert'
  subtitle: 'Minden afarer terméket olyan tanúsítványok támasztanak alá, amelyek a minőség, a biztonság és a környezetvédelmi felelősség iránti elkötelezettségünket igazolják.'
  items:
    - title: 'CE tanúsított'
      description: 'Minden afarer termék megfelel az európai CE jelölési követelményeknek szabadidő vízijárművekre, biztosítva a biztonsági, egészségügyi és környezetvédelmi szabványok teljesülését.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Minőségirányítási rendszerünk ISO 9001:2015 tanúsítással rendelkezik, amely a felfújható vízijárművek és vízi felszerelések tervezését, gyártását és disztribúcióját fedi le.'
      icon: tabler:clipboard-check
    - title: 'UKCA jelölés'
      description: 'Az Egyesült Királyság piacán értékesített termékek UKCA jelöléssel rendelkeznek, megerősítve a brit vízi felszerelésekre és személyes vízijárművekre vonatkozó előírásoknak való megfelelést.'
      icon: tabler:shield
    - title: 'BSCI megfelelő'
      description: 'Az afarer BSCI (Business Social Compliance Initiative) auditon esett át, igazolva az etikus gyártási gyakorlatokat, a méltányos munkakörülményeket és az ellátási lánc felelősségét.'
      icon: tabler:heart-handshake
    - title: 'REACH megfelelő'
      description: 'Az afarer termékekben használt minden anyag megfelel az EU REACH vegyszerbiztonsági előírásainak, biztosítva, hogy PVC-ben, EVA-ban vagy alkatrészekben ne legyenek korlátozott anyagok.'
      icon: tabler:flask
    - title: 'Anyagtesztelés'
      description: 'A szöveteket húzószilárdságra, szakítószilárdságra, UV-romlásra és hidegrepedési teljesítményre tesztelik. Minden gyártási tétel mintavételes ellenőrzésen esik át.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Gyári szabványok'
  title: 'Gyártási kiválóság<br />— specifikáció szerint építve'
  subtitle: '12 000 m²-es létesítményünk szigorú minőségkontroll-protokollok alatt működik a gyártás minden szakaszában.'
  list:
    - 'Beérkező anyag ellenőrzése: Minden alapanyagot — PVC szövet, EVA hab, ragasztók, hardverek — specifikációkkal szemben tesztelnek, mielőtt a gyártásba kerülnek.'
    - 'Folyamat közbeni minőségkontroll: Minden gyártási szakasznak dokumentált QC ellenőrzési pontjai vannak. A hegesztési szilárdságot, varratigazítást, szelepszerelést és csatlakozó-nyomatékot a vonalon ellenőrzik.'
    - 'Nyomásvizsgálat: Minden felfújható kamrát a névleges nyomás 1,25-szörösén tesztelnek 24–48 órán át. A nyomásesésnek 5% alatt kell maradnia az átfogó minősítéshez.'
    - 'Végellenőrzés: A kész termékeket méretpontosság, kozmetikai kivitel, tartozékteljesség és csomagolás épsége szempontjából ellenőrzik szállítás előtt.'
    - 'Tétel-nyomonkövethetőség: Minden termék sorozatszámmal rendelkezik, amely a gyártási tételrekordokhoz kapcsolódik, lehetővé téve a teljes visszakövethetőséget az alapanyagtól a készáruig.'
content_safety:
  tagline: 'Tengeri biztonsági szabványok'
  title: 'A biztonság először<br />— megbízható üzemelésre tervezve'
  subtitle: 'Az afarer termékek nemzetközi tengeri biztonsági szabványoknak megfelelően vannak tervezve és tesztelve kereskedelmi és szabadidő használatra.'
  items:
    - title: 'EN ISO 25649'
      description: 'A felfújható SUP-ok megfelelnek az EN ISO 25649 szabványoknak a szerkezetre, stabilitásra, felhajtóerőre és terhelési kapacitásra vonatkozóan.'
      icon: tabler:sailboat
    - title: 'SOLAS megfelelőség'
      description: 'A biztonsági felszerelések és életmentő eszközök megfelelnek a SOLAS (Safety of Life at Sea) követelményeknek, ahol alkalmazható.'
      icon: tabler:lifebuoy

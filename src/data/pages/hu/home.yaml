business_solutions:
  tagline: 'Miért más az érzés'
  title: 'Teljesítmény, amelyet az első húzásnál érez'
  subtitle: 'Négy pillér, amelyet a valódi víz formált — teljesítmény, dizájn, szerkezet és minőség.'
  items:
    - title: 'Vízi teljesítmény'
      description: 'Stabilitásra, siklásra és bizalomra hangolt formák hullámos vízben — így minden húzás kapcsolódik a vízhez.'
      icon: tabler:shield-check

      description: 'Az árapályból, vadállatokból és a partvonal energiájából merített kollekciók — lapok, amelyekkel látni szeretnék magukat.'
      icon: tabler:package
    - title: 'Bizonyított szerkezet'
      description: 'Nagy sűrűségű drop-stitch magok, megerősített oldalpályák és fúziós-laminált varratok ismételt használatra.'
      icon: tabler:headset
    - title: 'Igazolt minőség'
      description: 'Nyomástesztelve, vizuálisan ellenőrizve, világos garanciával és gyors értékesítés utáni támogatással.'
      icon: tabler:truck-delivery

oem_section:
  tagline: 'OEM / ODM és közös márka gyártás'
  title: 'Az ötlettől a vízig — közös márkás kiadások'
  subtitle: 'Azoknak a partnereknek, akik többet szeretnének egy katalógus terméknél: OEM/ODM gyártás és korlátozott közös márkás kollekciók, amelyeket az Afarerrel terveztek, fejlesztettek és építettek — miközben minden lap Afarer termék marad.'
  steps:
    - number: '01'
      title: 'Ötlet és brief'
      desc: 'Ossza meg vízióját, célversenyzőjét és a vizet, amelyre tervez.'
    - number: '02'
      title: 'Dizájn és mérnökség'
      desc: '3D modellezés, anyagkiválasztás és megkülönböztető grafikai dizájn.'
    - number: '03'
      title: 'Prototípus és validálás'
      desc: 'Minta lapok nyomástesztelve és evezéssel validálva, mielőtt elkötelezné magát.'
    - number: '04'
      title: 'Gyártás nagyban'
      desc: 'Következetes, ellenőrzött gyártás minőségi ellenőrzési pontokkal minden szakaszban.'
    - number: '05'
      title: 'Globális szállítás'
      desc: 'Logisztika Csingtaóból a nagy kikötőkig vámügyintézési támogatással.'
  cta: 'Közös márka felfedezése'

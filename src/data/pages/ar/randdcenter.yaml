vision:
  tagline: رؤيتنا
  title: نشكّل مستقبل الرياضات المائية
  body: >-
    تسعى afarer إلى قيادة صناعة القوارب القابلة للنفخ وألواح SUP من خلال الابتكار المستمر والجودة التي لا تتزعزع والالتزام الراسخ بالسلامة والاستدامة — ما يُثري في النهاية تجارب عشاق الرياضات المائية حول العالم. مركز afarer للبحث والتطوير هو المكان الذي تلتقي فيه الشغف بالابتكار، واضعاً معايير جديدة
    لصناعة الرياضات المائية.
labs_section:
  tagline: المختبرات
  title: مختبراتنا
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: مختبر أقمشة PVC
      description: بحث واختبار مستمران لأقمشة الأنابيب المصنوعة من PVC وHypalon لقياس قوة الشد، ومقاومة الأشعة فوق البنفسجية، والتآكل، والمرونة في درجات الحرارة المنخفضة، لضمان موثوقية طويلة الأمد في البيئات البحرية.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: استوديو هندسة الهياكل
      description: تصميم قائم على CAD وتحليل العناصر المحدودة لهياكل HDPE والألمنيوم والألياف الزجاجية. يتم محاكاة كل هيكل رقميًا للتحقق من توزيع الإجهاد ومقاومة الصدمات قبل بناء النموذج الأولي.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: مركز اللحام بالترددات الراديوية (RF)
      description: منشأة لحام مخصصة بالترددات الراديوية مع تحكم دقيق في درجة الحرارة والضغط، تنتج لحامات عالية القوة ومحكمة الإغلاق تلبي معايير الصناعة البحرية للقوارب القابلة للنفخ.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: خزان الاختبار الهيدروديناميكي
      description: اختبار النماذج المصغّرة في حوض الاختبار الداخلي لدينا لتحسين شكل الهيكل وأداء الانزلاق والثبات وكفاءة استهلاك الوقود عبر مجموعة من الأحمال والظروف البحرية.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: ورشة النماذج الأولية
      description: منشأة للنماذج الأولية والتجهيز بالحجم الكامل تُبنى فيها النماذج الجديدة وتُجهَّز وتُخضع للتجارب البحرية. يخضع كل نموذج أولي لبرنامج اختبارات مائية لا يقل عن 20 ساعة قبل الموافقة على الإنتاج.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: مختبر الجودة والفحص
      description: مختبر مخصص لضمان الجودة يجري اختبارات الشد، ودورات الاحتفاظ بالهواء، واختبارات تقشير الدرزات، واعتماد المواد؛ لضمان أن كل قارب يغادر الورشة يطابق مواصفاتنا المنشورة.
      href: /randdcenter/quality-inspection-lab

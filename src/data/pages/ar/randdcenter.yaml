meta:
  title: مركز البحث والتطوير | {SITE}
  description: البحث والتطوير — اختبار أقمشة PVC، هندسة الهياكل، اللحام بالترددات الراديوية (RF)، الاختبارات الهيدروديناميكية، ومراقبة الجودة. خدمات بحث وتطوير مخصصة متاحة.
hero:
  tagline: مركز البحث والتطوير
  title: مركز البحث والتطوير
  subtitle: مركّزون على التقدم
intro:
  - >-
    مركز afarer للبحث والتطوير (R&D) هو القوة الدافعة وراء مهمتنا في إحداث ثورة في معدات الرياضات المائية. نحن نُمكّن عشاق الرياضات المائية حول العالم من منتجات أكثر أمانًا وراحةً ومتعةً من خلال الابتكار المتواصل في ألواح التجديف الدائمة القابلة للنفخ (SUP) والقوارب. فريقنا المتفاني من المهندسين
    والمصممين وخبراء الرياضات المائية المتحمسين يصوغون مستقبل الصناعة، ويرفعون باستمرار سقف الجودة والأداء والاستدامة.
  - تجمع منشأة البحث والتطوير لدينا علماء المواد ومهندسي بناء السفن ومهندسي الإنتاج تحت سقف واحد. من تركيب الأقمشة ومحاكاة الهيكل إلى تطوير عمليات اللحام والتجارب البحرية كاملة الحجم، كل مرحلة من مراحل تطوير المنتج تقودها البيانات وتُثبتها الاختبارات.
mission:
  tagline: رسالتنا
  title: نبتكر مستقبل الرياضات المائية
  pillars:
    - icon: lightning
      title: التقدم التكنولوجي
      desc: نقود الابتكار في المواد والتصاميم والتصنيع لتحقيق أداء منتج فائق وعمر افتراضي أطول.
    - icon: design
      title: تصميم يركز على المستخدم
      desc: فهم عميق لاحتياجات المستخدمين وتجاوز توقعاتهم من خلال تصميم منتجات مريح وبديهي.
    - icon: globe
      title: الممارسات المستدامة
      desc: نحدّ من بصمتنا البيئية عبر استخدام مواد وعمليات صديقة للبيئة.
    - icon: shield
      title: سلامة بدون تنازلات
      desc: نضمن أعلى معايير السلامة من خلال اختبارات وشهادات صارمة.
pillars:
  - title: التقدم التكنولوجي
    desc: نبتكر مواد وتصاميم وعمليات تصنيع جديدة لنقدم أداءً فائقًا وعمرًا أطول للمنتجات.
    icon: tech
  - title: المواد المتقدمة
    desc: دراسة أحدث تقنيات PVC وHypalon والمواد المركبة والبدائل المستدامة لتحسين خصائص المنتجات.
    icon: materials
  - title: الاستدامة
    desc: 'التزام أساسي: نحن ملتزمون بالمسؤولية البيئية من خلال التصنيع المستدام والمواد القابلة لإعادة التدوير.'
    icon: sustainability
capabilities:
  tagline: القدرات
  title: قدرات البحث والتطوير
  subtitle: أربعة تخصصات أساسية تمنحنا تحكمًا كاملًا في تطوير المنتجات — من أبحاث المواد الخام إلى الشهادات النهائية.
  groups:
    - title: علوم المواد وتقنية الأقمشة
      items:
        - تحليل وتحسين تركيبات PVC وHypalon
        - تطوير تثبيت الأشعة فوق البنفسجية، ومقاومة اللهب، والمواد المضادة للميكروبات
        - هندسة تصفيح الأقمشة متعددة الطبقات والتصاقها
        - اختبارات التقادم المتسارع (الأشعة فوق البنفسجية UV، والحرارة، والرطوبة، ورذاذ الملح)
    - title: هندسة الهياكل والديناميكا المائية
      items:
        - تصميم هيكل بارامتري ثلاثي الأبعاد وتحسين الديناميكا الحسابية للموائع (CFD)
        - تحليل العناصر المحدودة للأحمال الإنشائية وأحمال الصدمات
        - اختبار النماذج المصغّرة في حوض السحب والتحقق من الأداء
        - تطوير هياكل مخصصة لملفات المهام الخاصة
    - title: تقنية اللحام والتوصيل
      items:
        - تطوير وتحسين عمليات اللحام العازل بالترددات الراديوية RF
        - طرق اللحام بالهواء الساخن، والإسفين الساخن، والموجات فوق الصوتية
        - تأهيل الربط اللاصق وشرائط اللحام
        - نمذجة قوة اللحام والتنبؤ بالعمر الافتراضي
    - title: الاختبارات والشهادات والامتثال
      items:
        - إدارة الجودة واختبارات الامتثال لشهادة CE
        - دعم الاختبارات الخارجية المستقلة وإصدار الشهادات
        - تطوير بروتوكولات اختبار مخصصة لتأهيل عمليات الشراء
        - تحليل الأعطال أثناء التشغيل والتحقيق في الأسباب الجذرية

faqs:
  title: 'الأسئلة الشائعة حول إنتاج ألواح OEM'
  subtitle: 'إجابات على أكثر الأسئلة شيوعًا من العلامات التي تطلق لوحها الخاص.'
  items:
    - title: 'كيف أنشئ علامة ألواحي الخاصة؟'
      description: 'أطلق علامتك في 16 أسبوعًا: الموجز والتصميم والنموذج الأولي المعتمد بشهادة CE والإنتاج بالجملة والتسليم. استكشف باقات OEM.'
    - title: 'ما هي مدة الإنتاج؟'
      description: 'تجهز العينة خلال 2-3 أسابيع، والإنتاج بالجملة خلال 30-45 يومًا حسب الكمية.'
    - title: 'هل يحمل اللوح شعارنا؟'
      description: 'نعم — علامة خاصة كاملة: طباعة الشعار وألوان مخصصة وتغليف وملصقات بهوية علامتك.'
    - title: 'هل يمكنني الشراء بالجملة منذ البداية؟'
      description: 'الحد الأدنى MOQ هو 50 وحدة للطرازات القياسية، مع فئات أسعار جملة تتدرج حسب الكمية.'

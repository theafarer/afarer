meta:
  title: معدات SUP وحلول الأساطيل لأندية التجديف | {SITE}
  description: برامج أساطيل SUP كاملة لأندية ومدارس التجديف. حزم البدء، الأساطيل الاحترافية، ألواح المنافسات، مجموعات لمراكز التدريب ودعم قطع الغيار.
hero:
  tagline: أندية ومدارس التجديف
  title: أطلق نادي التجديف الخاص بك وأدره ونمِّه<br />بأساطيل SUP بجودة تجارية
  subtitle: مورّد معدات SUP لأندية التجديف ومدارس SUP حول العالم — ألواح تجارية متينة، أسعار جماعية للأندية، هوية علامة مخصصة وقطع غيار سريعة، لتتفرغ لتنمية مجتمعك.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: أعضاء نادي التجديف على ألواح afarer SUP المتطابقة
benefits:
  title: مزايا أسطول النوادي
  subtitle: لماذا تختار أندية التجديف في أكثر من 50 دولة شركة Afarer كشريكها في المعدات.
  items:
    - metric: 40%+
      label: توفير تكاليف الأسطول
      detail: مقارنة بأسعار التجزئة مع خصومات الجملة للنوادي
    - metric: 48h
      label: استبدال القطع
      detail: أقل وقت توقف لأسطول التأجير لديك
    - metric: 500+
      label: دورات التأجير
      detail: متانة بمعايير تجارية لكل لوح
    - metric: أكثر من 5 سنوات
      label: العمر الافتراضي للأسطول
      detail: مع الصيانة والعناية المناسبة
packages:
  title: برامج أساطيل الأندية
  subtitle: اختر برنامج الأسطول الذي يناسب حجم ناديك وطموحك.
  items:
    - name: حزمة البدء
      tagline: للأندية الجديدة، حتى 30 عضوًا
      features:
        - 10 ألواح SUP (مزيج all-round + touring)
        - 10 مجاديف + 10 سترات نجاة
        - 2 مضخة مزدوجة الحركة + طقم إصلاح
        - هوية النادي على الألواح (طباعة الشعار)
        - دليل الإطلاق + قائمة فحص السلامة
        - معتمد CE — جميع المعدات
      cta_text: أنشئ ناديك
    - name: الأسطول الاحترافي
      tagline: للأندية الراسخة، 50-100 عضو
      features:
        - 30 لوح SUP (3 خيارات للحجم)
        - 30 مجدافًا + 30 سترة نجاة
        - 5 مضخات + 2 طقم إصلاح + حامل تخزين
        - ألوان النادي المخصصة + الشعار على الألواح
        - برنامج قطع الغيار (خصم 15%)
        - جلسة تدريب للموظفين (عبر الإنترنت)
        - معتمد CE — جميع المعدات
      popular: true
      cta_text: ابنِ أسطولك
    - name: أسطول المنافسات
      tagline: لأندية السباقات، الفعاليات، المنافسات
      features:
        - أكثر من 50 لوح سباق / لوح أداء عالٍ
        - طقم ملحقات كامل (مجاديف، سترات، مضخات)
        - طقم دعم الفعاليات (عوامات البداية، علامات التحديد)
        - قطع غيار ذات أولوية (شحن خلال 24 ساعة)
        - مدير حساب مخصص
        - خيار أزياء موحدة مخصصة للفريق
        - معتمد CE — جميع المعدات
      cta_text: احصل على أسطول المنافسات
training:
  title: باقات مراكز التدريب
  subtitle: كل ما تحتاجه مدرسة SUP لإدارة دورات الاعتماد الاحترافية.
  items:
    - name: حزمة بدء المدربين
      features:
        - 5 ألواح SUP فاخرة (بجودة المدرّبين)
        - 5 مجادف كربونية للعروض التوضيحية
        - 5 سترات نجاة (مقاس المدرب)
        - دليل المنهج التدريبي
        - معدات معتمدة بشهادة CE
    - name: الطقم الكامل للمدارس
      features:
        - 20 لوح SUP (مزيج من الطلاب والمدربين)
        - 20 مجدافًا + 20 سترة نجاة (مقاسات متعددة)
        - 10 أدوات طفو للمبتدئين
        - 4 مضخات + أطقم إصلاح
        - دعم المناهج التدريبية والشهادات
        - معدات معتمدة بشهادة CE
features:
  title: لماذا تختار الأندية Afarer
  subtitle: جودة ثابتة، وتوفير سريع لقطع الغيار، وأسعار جملة مصممة للأندية المتنامية.
  items:
    - title: 500+ دورة تأجير
      description: ألواح الدرجة التجارية تتحمل مواسم الاستخدام اليومي.
      icon: tabler:shield-check
    - title: ألوان مخصصة
      description: طابق هوية ناديك مع ألوان وشعار مخصصين للألواح.
      icon: tabler:palette
    - title: أسعار الجملة
      description: خصومات على الكميات لطلبات الأساطيل المكوّنة من 10 ألواح فأكثر.
      icon: tabler:discount
    - title: قطع غيار سريعة
      description: شحن قطع الغيار خلال 48 ساعة.
      icon: tabler:truck-delivery
    - title: دعم نمو النادي
      description: استشارات حول برامج العضوية والتسعير واستضافة الفعاليات.
      icon: tabler:trending-up
    - title: معتمد CE
      description: جميع المعدات تلتزم بمعايير السلامة الدولية.
      icon: tabler:certificate

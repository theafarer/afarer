hero:
  tagline: الامتثال
  title: كيف تعمل شهادة CE للمركبات المائية القابلة للنفخ
  subtitle: 7 دقائق قراءة
content_html: >
  <h2>ما هي شهادة CE؟</h2>

  <p>علامة CE (المطابقة الأوروبية Conformit&eacute; Europ&eacute;enne) تعني أن المنتج يلبي متطلبات الاتحاد الأوروبي المتعلقة بالصحة والسلامة والبيئة. بالنسبة للمركبات المائية القابلة للنفخ، يعتمد الإطار التنظيمي ذو الصلة على فئة المنتج.</p>


  <h2>التوجيهات المعمول بها</h2>


  <h3>توجيه المركبات المائية الترفيهية (2013/53/EU)</h3>

  <p>التوجيه الأساسي لمعظم القوارب القابلة للنفخ وألواح SUP وقوارب الكاياك. وينطبق على المركبات الترفيهية التي يتراوح طول هيكلها بين 2.5 م و24 م، وعلى القوارب غير المكتملة (الموردة لمصنّعي OEM)، وعلى المركبات المائية الشخصية.</p>


  <h3>لائحة معدات الحماية الشخصية (2016/425)</h3>

  <p>يجب أن تستوفي سترات النجاة ووسائل الطفو ومعدات السلامة الموردة مع المركبات المائية متطلبات لائحة معدات الحماية الشخصية (PPE)، بما في ذلك فحص النوع (Module B) من قبل هيئة معتمدة، وضمان جودة الإنتاج (Module D أو E).</p>


  <h2>عملية الحصول على الشهادة</h2>

  <ol>
    <li>تصنيف المنتج: تحديد فئة تصميم المركبة (A – D وفقًا لمعيار ISO 8666)</li>
    <li>المعايير المعمول بها: EN ISO 6185 (الأجزاء 1 – 4)، وEN ISO 10087 (رقم تعريف الهيكل HIN)، وEN ISO 14945 (لوحة الصانع)</li>
    <li>إعداد الملف الفني: رسومات التصميم، وقائمة المواد، وشهادات المواد، وتقييم المخاطر</li>
    <li>اختبار النوع: الطفو، والثبات، وسعة الحمولة، واختبار المواد، وقوة اللحامات، والاحتفاظ بالهواء</li>
    <li>مراقبة الإنتاج في المصنع: تدقيق الهيئة المعتمدة لعمليات التصنيع</li>
    <li>إعلان المطابقة: يوقّع المصنّع على إعلان المطابقة (DoC) ويثبّت علامة CE</li>
  </ol>


  <h2>الهيئات المعتمدة للمركبات المائية القابلة للنفخ</h2>

  <p>تشمل الهيئات المعتمدة الشائعة Bureau Veritas (فرنسا) وDNV GL (ألمانيا) وRINA (إيطاليا) وT&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (ألمانيا).</p>


  <h2>الجدول الزمني والتكاليف</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">المرحلة</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">المدة</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">التكلفة النموذجية (يورو)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">إعداد الملف الفني</td><td class="p-3 border">2 – 4 أسابيع</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">اختبار النوع</td><td class="p-3 border">4 – 8 أسابيع</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">تدقيق المصنع</td><td class="p-3 border">1 – 2 يوم (في الموقع)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">الإجمالي (لأول منتج)</td><td class="p-3 border">8 – 14 أسبوعًا</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>


  <h2>ماذا يعني هذا للمشترين؟</h2>

  <p>عند شراء قوارب قابلة للنفخ معتمدة وفق CE، تحقق دائمًا من وجود علامة CE على لوحة الصانع، ومن وجود إعلان مطابقة (DoC) سارٍ، ومن ذكر رقم الهيئة المعتمدة، ومن تضمين دليل المالك تعليمات السلامة بلغتك المحلية. جميع منتجات Afarer حاصلة على شهادة CE مع إمكانية تتبع كاملة حتى تقارير تدقيق الهيئة
  المعتمدة.</p>

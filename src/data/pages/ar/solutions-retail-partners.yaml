meta:
  title: برنامج شركاء التجزئة لـ SUP | {SITE}
  description: Become an Afarer retail partner. Full product line, professional marketing materials, dropshipping options, and competitive margins for SUP retailers.
hero:
  tagline: شركاء التجزئة
  title: Become An Afarer<br />Retail Partner
  subtitle: Sell the fastest-growing SUP brand in your market. Full product line, professional marketing materials, dropshipping options, and margins that make sense.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: ألواح SUP من Afarer معروضة في متجر تجزئة
margin_section:
  title: هوامش التجزئة والحد الأدنى لكمية الطلب (MOQ)
  subtitle: شرائح أسعار الجملة مصممة لتحقيق الربحية في البيع بالتجزئة.
  items:
    - tier: شريك أساسي
      discount: 20%
      moq: 500 وحدة/سنة
      margin_note: ربح يتراوح بين 150 و250 دولارًا تقريبًا لكل لوح
      features:
        - الوصول إلى خط الإنتاج الكامل
        - حزمة المواد التسويقية
        - دعم البريد الإلكتروني
        - الوصول إلى كتالوج المنتجات
    - tier: شريك متميز
      discount: 30%
      moq: أكثر من 2,000 وحدة سنوياً
      margin_note: ربح ~250–400 دولار لكل لوح
      features:
        - مدير حساب مخصص
        - حماية حصرية للمنطقة
        - دعم تسويقي مخصص
        - الوصول الأول إلى المنتجات الجديدة
        - جلسات تدريب الموظفين
    - tier: شريك رائد
      discount: 35%+
      moq: أكثر من 5,000 وحدة/سنة
      margin_note: ربح يتراوح بين 350 و500+ دولار أمريكي لكل لوح
      features:
        - حملات تسويقية مشتركة العلامة
        - دعم العرض داخل المتجر
        - تدريب الموظفين في الموقع
        - ترويج مشترك عبر وسائل التواصل الاجتماعي
        - أولوية في تخصيص الإنتاج
product_line:
  title: خط إنتاج متكامل
  subtitle: لوح SUP لكل عميل يدخل متجرك.
  items:
    - name: All-Round Series
      description: الأكثر مبيعًا — يناسب 80% من العملاء
    - name: Touring Series
      description: مجدّفون محترفون — هامش ربح أعلى
    - name: Yoga Series
      description: سوق متخصص — تسعير متميز
    - name: Kids Series
      description: عملاء عائليون — مشترون متكررون
    - name: Racing Series
      description: سوق الهواة المتحمسين — هالة العلامة التجارية
    - name: Accessories
      description: إضافات بهامش ربح مرتفع (مجاديف، سترات نجاة، مضخات، حقائب)
catalog:
  title: موارد شركاء التجزئة
  subtitle: حمّل حزمة شركاء التجزئة الشاملة لدينا.
  items:
    - name: 2026 Product Catalog
      desc: تشكيلة كاملة بالمواصفات والأسعار ومعلومات الطلب
      icon: tabler:file-text
      link: /resources/download-catalog
    - name: Retail Partner Guide
      desc: حاسبة هوامش الربح، ونصائح العرض التجاري، وأفضل الممارسات
      icon: tabler:book
      link: /resources/download-catalog
    - name: Marketing Asset Pack
      desc: صور منتجات عالية الدقة، وصور أنماط الحياة، ومواد نقاط البيع (POS)
      icon: tabler:photo
      link: /media
support:
  title: دعم شركاء التجزئة
  subtitle: كل ما تحتاجه للبيع بثقة.
  items:
    - صور منتجات عالية الدقة (تصوير احترافي)
    - صور أسلوب حياة لوسائل التواصل الاجتماعي والموقع الإلكتروني والكتالوج
    - مواد تسويقية — ملصقات، بطاقات رفوف، لافتات
    - فيديوهات تدريب على المنتجات لتثقيف الموظفين
    - حزمة محتوى لوسائل التواصل الاجتماعي (منشورات أسبوعية)
    - أوصاف منتجات محسّنة لمحركات البحث (SEO)
    - خيار الشحن المباشر متاح — دون أي مخاطر على المخزون
    - شروط دفع Net 30
cta:
  title: Ready to become a partner?
  subtitle: Apply for partnership or download our retail catalog.
  actions:
    - text: تقدّم بطلب الشراكة
      href: /contact?partner=retail
      variant: primary
    - text: تنزيل كتالوج التجزئة
      href: /resources/download-catalog
      variant: secondary

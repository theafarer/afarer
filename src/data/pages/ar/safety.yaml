meta:
  title: 'السلامة — المعايير والشهادات | {SITE}'
  description: 'سلامة منتجات afarer: ألواح SUP قابلة للنفخ وقوارب معتمدة CE، واختبارات دقيقة، والامتثال للمعايير البحرية الدولية للسلامة.'
  keywords:
    - 'معايير سلامة SUP'
    - 'ألواح تجديف معتمدة CE'
    - 'سلامة SUP القابلة للنفخ'
    - 'امتثال السلامة البحرية'
hero:
  tagline: السلامة
  title: معايير وشهادات السلامة
  subtitle: كل منتج afarer يخضع لاختبارات صارمة ويلبي معايير السلامة الدولية للاستخدام الترفيهي والمهني.
certifications:
  - title: شهادة CE
    description: جميع معدات السلامة afarer تتوافق مع متطلبات علامة CE بموجب لائحة معدات الحماية الشخصية الأوروبية (EU) 2016/425.
  - title: شهادة ISO 12402
    description: سترات النجاة تلبي معايير الطفو ISO 12402. توفر سترة Life Vest Classic طفو 50N+؛ وتفي سترة Life Vest Pro بمتطلبات SOLAS مع النفخ التلقائي.
  - title: الامتثال لـ SOLAS
    description: سترة Life Vest Pro تتوافق مع لوائح SOLAS (سلامة الأرواح في البحر) للعمليات البحرية الخارجية والتجارية.

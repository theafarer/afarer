hero:
  tagline: السلامة
  title: معايير وشهادات السلامة
  subtitle: كل منتج afarer يخضع لاختبارات صارمة ويلبي معايير السلامة الدولية للاستخدام الترفيهي والمهني.

certifications:
  - title: شهادة CE
    description: جميع معدات السلامة afarer تتوافق مع متطلبات علامة CE بموجب لائحة معدات الحماية الشخصية الأوروبية (EU) 2016/425.
  - title:
    description: سترات النجاة تلبي معايير الطفو . توفر سترة Life Vest Classic طفو 50N+؛ وتفي سترة Life Vest Pro بمتطلبات SOLAS مع النفخ التلقائي.
  - title: الامتثال لـ SOLAS
    description: سترة Life Vest Pro تتوافق مع لوائح SOLAS (سلامة الأرواح في البحر) للعمليات البحرية الخارجية والتجارية.


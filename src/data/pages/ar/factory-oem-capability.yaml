    detail: تغطية عالمية
  - value: أكثر من 200
    label: مشاريع مخصصة تم تسليمها
    detail: عبر جميع خطوط الإنتاج
  - value: 30–45
    label: مدة التسليم القياسية (أيام)
    detail: من أمر الشراء إلى FOB
services:
  - title: تصميم المنتجات والهندسة
    description: يعمل فريق البحث والتطوير الداخلي لدينا مع مفهومك أو مواصفاتك لإعداد الرسومات الهندسية CAD والنماذج ثلاثية الأبعاد والنماذج الأولية. كما نقدم تصميم القوالب وتحسين شكل الهيكل والإرشاد في اختيار المواد.
  - title: العلامات التجارية المخصصة والتصاميم الجرافيكية
    description: طباعة رقمية بألوان كاملة، وطباعة شاشية، ونقش بارز، وخيارات ملصقات متنوعة. نطوّر رسومات سطح ألواح مخصصة لكل علامة تجارية، وعلامات على الأنابيب، وتغليفاً جاهزاً للبيع بالتجزئة.
  - title: تخصيص المواد والمواصفات
    description: اختر من بين خامات PVC (القياسية، الصديقة للبيئة، المقاومة للحريق)، وHypalon/CSM، والبناء بتقنية Drop-Stitch، والأنظمة الهجينة، مع خيارات مخصصة لألوان الأنابيب وأوزان الأقمشة ومواد التقوية.
  - title: التغليف والخدمات اللوجستية
    description: 'تغليف تجزئة مخصص، صناديق بعلامة خاصة، تعبئة بالتفريغ الهوائي، تجميع على منصات (باليت)، وتحميل الحاويات. شروط شحن متاحة: FOB تشينغداو أو CIF أو DDP.'
moq_table:
  - product: ألواح SUP القابلة للنفخ
    standard_moq: 5–10 units
    custom_moq: أكثر من 200 وحدة
    lead_time: 30–45 يومًا
  - product: سترات النجاة ومعدات السلامة
    standard_moq: 100–200 وحدة
    custom_moq: أكثر من 1,000 وحدة
    lead_time: 20–30 days
why_us:
  - title: التكامل الرأسي
    description: نملك مصنعنا وقوالبنا وسلسلة التوريد الخاصة بنا — لا وسطاء ولا مقاولين من الباطن، وهذا يمنحنا السيطرة على الجودة والتكلفة ومواعيد التسليم.
  - title: اعتماد مزدوج
    description: شهادة إدارة الجودة ISO 9001 وشهادة الامتثال الاجتماعي BSCI. تقارير تدقيق المصنع متاحة عند الطلب.
  - title: امتثال CE
    description: جميع الطرازات القياسية تحمل شهادة CE 2013/53/EU. ويمكن للطرازات المخصصة الحصول على شهادة CE عبر عمليتنا المعتمدة.
  - title: حد أدنى منخفض لكمية الطلب (MOQ)
    description: ابدأ بـ 5 وحدات فقط للموديلات القياسية. نحن نساعد العلامات الناشئة على الانطلاق دون الالتزام بمخزون كبير.

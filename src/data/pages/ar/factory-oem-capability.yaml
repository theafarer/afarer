meta:
  title: 'إنتاج OEM والعلامات الخاصة | {SITE}'
  description: 'من الفكرة إلى الحاوية: خصّص كل تفصيل في سلسلة ألواح SUP القابلة للنفخ الخاصة بك. خدمة OEM/ODM كاملة لعلامات التجديف الخاصة.'
  keywords:
    - 'إنتاج SUP بتقنية OEM'
    - 'علامة تجديف خاصة'
    - 'SUP قابلة للنفخ OEM'
    - 'مصنع SUP مخصص'
hero:
  tagline: تصنيع OEM/ODM
  title: التصنيع وفق نظام OEM والعلامة الخاصة
  subtitle: From concept to container — customize every detail of your inflatable watercraft line
intro: >-
  تقدم afarer خدمات شاملة في مجالي OEM وODM للعلامات التجارية والموزعين والجهات الحكومية حول العالم. وبفضل خبرة تزيد على 10 سنوات في التصدير ومصنع معتمد وفق ISO 9001 وBSCI بمساحة 12,000 م²، نتولى كل شيء بدءًا من تصميم المنتج وتطوير القوالب وصولًا إلى الإنتاج واسع النطاق والتغليف والشحن والخدمات
  اللوجستية.
highlight:
  - value: 10+
    label: سنوات من الخبرة في OEM
    detail: منذ عام 2012
  - value: أكثر من 50

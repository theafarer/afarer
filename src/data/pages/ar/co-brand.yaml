  caption: 'تبقى جميع منتجات العلامة المشتركة منتجات أفارير وتحمل هوية العلامة أفارير. يُتفق على نطاق المشروع ونافذة الحصرية والشروط النهائية في Co-Brand Project Agreement.'
  head:

features:
  title: 'ماذا تعني العلامة المشتركة في أفارير'
  subtitle: 'العلامة المشتركة هي برنامج شراكتنا التصميمية — مبني على علامة أفارير وحماية الأقاليم والمجموعات المحدودة، لا على إنتاج بلا علامة.'
  columns: 3
  items:
    - title: 'منتجات أفارير تبقى منتجات أفارير'
      description: 'مجموعة العلامة المشتركة هي إصدار محدود من ألواح أفارير منسوج فيه هويتك. ليست أبدًا بلا علامة، وليست علامة طرف ثالث، وليست برنامج علامة خاصة مفتوحًا.'
      icon: 'tabler:trademark'
    - title: 'مصمم معك'
      description: 'ألوانك وتسمياتك وقصتك تشكل المجموعة. يدير فريق التصميم والهندسة لدينا الألواح والرسومات والتغليف والوثائق من الموجز إلى التسليم.'
      icon: 'tabler:pencil'
    - title: 'للأندية والمنتجعات والفعاليات والمجتمعات'
      description: 'مجموعات أساطيل لأندية التجديف والمنتجعات، وإصدارات فعاليات للسباقات وسلاسل المجتمعات — كلها تحمل جودة أفارير وضمانها.'
      icon: 'tabler:users'
    - title: 'يحمي شركاء الدول'
      description: 'تعمل العلامة المشتركة جنبًا إلى جنب مع نموذجنا بلد واحد موزع واحد. يحتفظ الشركاء الوطنيون بأقاليمهم؛ ولا تفتح مجموعات العلامة المشتركة الباب لعلامات موازية في أسواقهم.'
      icon: 'tabler:shield-check'
    - title: 'الهندسة ومعايير الجودة'
      description: 'تُشحن كل مجموعة من سلسلة التوريد المعتمدة لدينا مع وثائق CE وISO 9001 واختبارات الضغط ونقاط فحص QC ذاتها التي لمجموعتنا الأساسية.'
      icon: 'tabler:certificate'
    - title: 'يصبح أصلًا للعلامة'
      description: 'تبني المجموعة المحدودة بالعلامة المشتركة قصتك الخاصة على الماء — هامش بيع ومحتوى إعلامي وسبب لعودة المجدفين موسمًا بعد موسم.'
      icon: 'tabler:star'
table:

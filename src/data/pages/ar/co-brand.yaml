faqs:
  title: 'العلامة المشتركة — FAQ'
  subtitle: 'كيف تعمل العلامة المشتركة مع أفارير، وكيف تختلف عن OEM والعلامة الخاصة.'
  items:
    - title: 'هل العلامة المشتركة هي نفسها OEM أو العلامة الخاصة؟'
      description: 'لا. لم تعد أفارير تدير برنامج OEM وعلامة خاصة مفتوحًا. تبقى منتجات العلامة المشتركة منتجات أفارير — صممها وهندسها وفتشت جودتها وضمنت العلامة أفارير. تظهر هويتك كعلامة مشتركة، لا كمنتج طرف ثالث بلا علامة.'
    - title: 'من يمكنه بدء مشروع علامة مشتركة؟'
      description: 'شركات رياضات مائية مؤهلة: شركاء دول قائمون، وأندية تجديف، ومنتجعات وفنادق، ومنظمو فعاليات، ومجتمعات. أرسل لنا موجز مشروع وسنؤكد الأهلية قبل بدء التصميم.'
    - title: 'هل تتعارض العلامة المشتركة مع موزعي في البلد؟'
      description: 'لا. نموذج بلد واحد موزع واحد له الأولوية. تُنسق مجموعات العلامة المشتركة مع شريك البلد المحلي إن وُجد، فلا تظهر علامة موازية أو منافسة داخل إقليم محمي.'
    - title: 'ما الحد الأدنى للطلب لمجموعة علامة مشتركة؟'
      description: 'تبدأ المجموعات التجريبية من 30–50 وحدة. المجموعات القياسية 50–100 وحدة؛ والإصدارات الكبيرة أو متعددة المناطق 100+ وحدة. تُتفق جداول التطوير المخصص حسب المشروع.'
    - title: 'ما الذي يمثل جودة أفارير مقابل مساهمة الشريك؟'
      description: 'تملك أفارير تصميم المنتج والهندسة والمواد والبناء وQC والضمان. يساهم الشركاء بمفهوم المجموعة والتسميات والألوان والمدخلات الجرافيكية وإطلاق السوق. هذا يبقي معيار جودة واحدًا على الماء.'
    - title: 'كيف أتقدم بطلب؟'
      description: 'أكمل نموذج استعلام العلامة المشتركة مع عملك وسوقك وفكرة المجموعة. نراجع الملاءمة ثم نرد خلال 3 أيام عمل بعرض وCo-Brand Project Agreement.'

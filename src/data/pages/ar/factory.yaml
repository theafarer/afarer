qc_section:
  tagline: مراقبة الجودة
  title: عملية الاختبار وضمان الجودة
  subtitle: يخضع كل قارب لاختبار إلزامي قبل الشحن. ويعمل مختبر الجودة لدينا بشكل مستقل عن الإنتاج ويبلغ الإدارة مباشرة.
  steps:
    - step: "1"
      title: فحص المواد الخام
      desc: تخضع أقمشة PVC وHypalon وDrop-Stitch لاختبار الشدّ ()، وانتشار التمزق، والتحقق من مقاومة الأشعة فوق البنفسجية قبل دخول أي دفعة إلى الإنتاج.
    - step: "2"
      title: اختبار احتفاظ الهواء لمدة 48 ساعة
      desc: تُنفخ كل حجرة أنبوب إلى 125% من الضغط المحدد وتُبقى لمدة 48 ساعة. وهبوط الضغط عن 5% يؤدي إلى الرفض التلقائي وإعادة فحص المفصل.
    - step: "3"
      title: اختبار الحمل والتوازن
      desc: تُحمّل القوارب المكتملة إلى أقصى سعة مقدّرة وتُختبَر من حيث الاستقرار والارتفاع الحر والمناولة. ويُختبر كل قارب مائياً قبل الفحص النهائي.
oem_section:
  tagline: مشاريع OEM
  title: دراسات حالة الشراكة مع العلامات التجارية وOEM
  subtitle: من الفكرة إلى الحاوية —كيف نساعد العلامات التجارية العالمية على إطلاق خطوطها من القوارب المائية القابلة للنفخ وتوسيعها.
  cases:
    - challenge: احتاج بائع تجزئة أوروبي في الهواء الطلق إلى خط SUP خاص بعلامته التجارية برسومات سطح فريدة، وPVC صديق للبيئة، وتغليف جاهز للبيع بالتجزئة —وكلها تُسلَّم خلال 60 يوماً.
      solution: طوّرنا ملفات طباعة رقمية مخصصة، واستُبدل PVC متوافق مع REACH، وخفّضنا أخذ العينات من 3 جولات إلى 1 بوضع فريق التصميم في مصنعنا في تشينغداو.
      result: 55 يوماً من توقيع أمر الشراء إلى FOB. 2,400 وحدة عبر 4 وحدات SKU. ووُضع طلب متكرر قبل وصول الحاوية الأولى.
    - challenge: احتاجت شركة ناشئة أمريكية للرياضات المائية إلى كاياك Drop-Stitch عالي الأداء بهيكل مخصص، وتغليف مشترك العلامة التجارية، وشهادة BSCI للبيع بالتجزئة.
      solution: عدّلنا قالب كاياك Drop-Stitch القائم بملف rocker معدّل، وطوّرنا أعمال تغليف مشتركة العلامة، ووفّرنا وثائق تدقيق BSCI الكاملة.
      result: إدراج ناجح في 3 سلاسل أمريكية كبرى للهواء الطلق. أكثر من 5,000 وحدة في السنة الأولى بمعدل بيع بلغ 98%.
    - challenge: تطلب موزع أسترالي مجموعة SUP معتمدة CE بألوان أنابيب مخصصة، وخيار ترقية Hypalon، والامتثال للمعيار الأسترالي AS 1799.
      solution: أنتجنا عينات ما قبل الإنتاج بـ 4 ألوان أنابيب، واستُبدل CSM Hypalon من مورّد ياباني، وتنسيق اختبار الامتثال لـ AS 1799 من طرف ثالث.
      result: إطلاق مجموعة SUP من 3 طرازات في سوق AU/NZ. تلاها الفوز بمناقصة حكومية لـ 12 قارب دورية SUP.
faq_section:
  tagline: أسئلة شائعة
  title: أسئلة B2B وOEM الشائعة
  questions:
    - q: ما هي الكمية الدنيا للطلب (MOQ) للوحات SUP القابلة للنفخ OEM؟
      a: تبدأ الكمية الدنيا للطلب من 5—0 وحدات للطرازات القياسية OEM. وتتطلب القوالب المخصصة والمشاريع الخاصة بعلامة تجارية حداً أدنى من 200 وحدة حسب التعقيد. ويتوفر طلبات تجريبية ودفعات عينات لإطلاق العلامات التجارية الجديدة.
    - q: هل تحمل أكوافارر شهادة BSCI؟
      a: نعم. يحتفظ مصنعنا بشهادة الامتثال الاجتماعي BSCI سارية (تقرير التدقيق متاح عند الطلب). كما نحمل شهادة لإدارة الجودة وتحمل جميع المنتجات شهادة CE. وتُقدم وثائق الامتثال لـ REACH وRoHS مع كل شحنة OEM.
    - q: ما هي المدة القياسية للتسليم لأمر OEM؟
      a: تبدأ الكمية الدنيا للطلب من 5–10 وحدات للطرازات القياسية OEM. وتتطلب القوالب المخصصة والمشاريع الخاصة بعلامة تجارية حداً أدنى من 200 وحدة حسب التعقيد. ويتوفر طلبات تجريبية ودفعات عينات لإطلاق العلامات التجارية الجديدة.
    - q: هل يمكنكم الشحن FOB تشينغداو أو CIF إلى مينائنا؟
      a: نعم. نشحن FOB تشينغداو، وCIF إلى الموانئ العالمية الرئيسية، وDDP للشركاء المؤهلين. ويدير فريق اللوجستيات لدينا حجز الحاويات ووثائق التصدير والتخليص الجمركي. ونشحن إلى أكثر من 50 دولة عبر أسواق الاتحاد الأوروبي والولايات المتحدة وأستراليا وآسيا.
b2b_moq: "الكمية الدنيا القياسية: 5—0 وحدة لكل طراز (SUP/SUP/Drop-Stitch). الكمية الدنيا لـ SUP: 2— وحدات. نرحب بالطلبات التجريبية لشراكات جديدة."
production_flow:
  tagline: Production Flow
  title: From Material to Finished Boat
  subtitle: Every boat passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: "01"
      title: Material Receiving & Incoming QC
      description: All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.
      qc_check: Tensile strength (ASTM D751), tear resistance (ISO 4674), thickness gauge, adhesive viscosity, visual defect scan
      qc_threshold: 100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect
      responsibility: Incoming QC team (3 inspectors)
    - stage: "02"
      title: CNC Cutting & Material Prep
      description: Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.
      qc_check: Dimensional check against CAD DXF files, edge quality inspection, panel count verification
      qc_threshold: Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance
      responsibility: Cutting workshop lead
    - stage: "03"
      title: Welding & Drop-Stitch Bonding
      description: Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.
      qc_check: Peel test every 50 units (ASTM D751), weld width measurement, hot-air temperature log review, visual seam inspection under backlight
      qc_threshold: Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject
      responsibility: Welding QC (2 inspectors per shift)
    - stage: "04"
      title: Assembly & Rigging
      description: "Boats move to final assembly where all components are mated: hull + tubes, valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist."
      qc_check: 100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection
      qc_threshold: "Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)"
      responsibility: Assembly team lead + line QC
    - stage: "05"
      title: Pressure Testing & Quality Hold
      description: Every chamber is inflated to 1.25× rated pressure (typically 20—5 PSI) and held for 24—8 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.
      qc_check: 24h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair
      qc_threshold: Max 5% pressure drop over 24h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch
      responsibility: Quality lab (independent of production, reports to management)
    - stage: "06"
      title: Final Inspection & Packing
      description: Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.
      qc_check: Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification
      qc_threshold: AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected
      responsibility: Final QC team (4 inspectors) + Packing team lead

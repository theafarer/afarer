workshops_section:
  tagline: ورش العمل
  title: ورش التصنيع
  workshops:
    - title: القطع PVC وتجهيز المواد
      description: تعالج ماكينات القطع التلقائية CNC أقمشة PVC وHypalon وDrop-Stitch بدقة تقل عن المليمتر. ويقلل التعشيش المُحسَّن حاسوبياً من هدر المواد ويضمن أن كل لوح يلبي مواصفاته الأبعاد قبل اللحام.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: لحام الأنابيب والختم الحراري
      description: ورشة لحام مخصصة مزودة بماكينات الختم الحراري وpresses RF ثنائية الاستقطاب. وتربط أجهزة الختم الحراري بالهواء الساخن وتدمج حجرات أنابيب PVC، بينما ينتج لحام RF وصلات محكمة الهواء عالية المتانة تتجاوز المتطلبات.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: إنتاج هيكل SUP —الألياف الزجاجية
      description: تُنتج هياكل قوارب SUP باستخدام تشكيل الألياف الزجاجية اليدوي بأنظمة راتنج بوليستر وفينيل إستر. وتُدحرج كل طبقة يدوياً وتُغلّف بالتفريغ لضمان جودة متسقة. ويوفر كشك رش الجلكوت تشطيباً بحرياً لامعاً ومقاوماً للأشعة فوق البنفسجية.
      image: https://assets.afarer.com/images/afarer/factory/afarer-warehouse-storage.webp
    - title: طباعة وتزيين لوحات SUP
      description: تُزيّن ألواح SUP باستخدام الطباعة الرقمية للرسومات ملونة بالكامل والطباعة بالشاشة للشعارات والأنماط المتكررة. وتنتج الطابعات الرقمية تصاميم سطح بجودة الصورة، بينما توفر الطباعة بالشاشة علامات تجارية متينة وزاهية.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    - title: التجميع النهائي والتجهيز
      description: خط تجميع تُجمع فيه هياكل الألياف الزجاجية وأنابيب PVC، وتُركب المحركات، وتُوصَل أنظمة التوجيه والتحكم، وتُوصَل الأنظمة الكهربائية. ويتبع كل قارب قائمة تدقيق تجميع من 100 نقطة يوقع عليها قائد الفريق.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: اختبار الجودة والفحص
      description: يخضع كل قارب مكتمل لاختبار إلزامي لاحتفاظ الهواء، والتحقق من تقشير المفاصل، وفحص كامل للأنظمة قبل الشحن. ويعمل مختبر الجودة لدينا بشكل مستقل عن الإنتاج ويبلغ الإدارة مباشرة.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

material_traceability:
  tagline: إمكانية التتبع
  title: تتبع المواد والتحكم في الدفعات
  description: تُخصص لكل دفعة من المواد الخام رقم دُفعة فريد في نظام ERP لدينا. ومن لحظة الاستلام عبر الإنتاج حتى المنتج النهائي، ترتبط قائمة مكونات كل قارب بدُفعة المورد الأصلية. يتيح ذلك تتبعًا كاملًا للسلاسل الإمدادية لأي استفسار يتعلق بالجودة أو الامتثال.
  system: نظام ERP مخصص (النظام الداخلي لمجموعة تشينغداو فاتراد) + بطاقات دفعات مادية على كل أمر عمل
  coverage: 100% من مواد الإنتاج —PVC، وHypalon، وأقمشة drop-stitch، والمواد اللاصقة، والصمامات، والتجهيزات، والتغليف
  records_retained: 10 سنوات (وفقًا لمتطلبات CE 2013/53/EU)
  suppliers:
    - material: PVC من الدرجة البحرية
      source: موردون صينيون وكوريون
      certified: ISO 9001، REACH، RoHS
    - material: هايبالون (CSM)
      source: مورد ياباني
      certified: ISO 9001, REACH
    - material: قماش Drop-stitch
      source: نسيج داخلي + شريك خارجي
      certified: مراقبة جودة داخلية + موردون معتمدون ISO 9001
    - material: الصمامات والتركيبات
      source: موردو OEM الصينيون
      certified: ISO 9001، شهادات المواد لكل دفعة

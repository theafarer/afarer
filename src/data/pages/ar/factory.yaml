qc_section:
  tagline: مراقبة الجودة
  title: عملية الاختبار وضمان الجودة
  subtitle: يخضع كل قارب لاختبار إلزامي قبل الشحن. ويعمل مختبر الجودة لدينا بشكل مستقل عن الإنتاج ويبلغ الإدارة مباشرة.
  steps:
    - step: '1'
      title: فحص المواد الخام
      desc: تخضع أقمشة PVC وHypalon وDrop-Stitch لاختبار الشدّ ()، وانتشار التمزق، والتحقق من مقاومة الأشعة فوق البنفسجية قبل دخول أي دفعة إلى الإنتاج.
    - step: '2'
      title: اختبار احتفاظ الهواء لمدة 48 ساعة
      desc: تُنفخ كل حجرة أنبوب إلى 125% من الضغط المحدد وتُبقى لمدة 48 ساعة. وهبوط الضغط عن 5% يؤدي إلى الرفض التلقائي وإعادة فحص المفصل.
    - step: '3'
      title: اختبار الحمل والتوازن
      desc: تُحمّل القوارب المكتملة إلى أقصى سعة مقدّرة وتُختبَر من حيث الاستقرار والارتفاع الحر والمناولة. ويُختبر كل قارب مائياً قبل الفحص النهائي.
oem_section:
  tagline: مشاريع OEM
  title: دراسات حالة الشراكة مع العلامات التجارية وOEM
  subtitle: من الفكرة إلى الحاوية —كيف نساعد العلامات التجارية العالمية على إطلاق خطوطها من القوارب المائية القابلة للنفخ وتوسيعها.
  cases:
    - challenge: احتاج بائع تجزئة أوروبي في الهواء الطلق إلى خط SUP خاص بعلامته التجارية برسومات سطح فريدة، وPVC صديق للبيئة، وتغليف جاهز للبيع بالتجزئة —وكلها تُسلَّم خلال 60 يوماً.
      solution: طوّرنا ملفات طباعة رقمية مخصصة، واستُبدل PVC متوافق مع REACH، وخفّضنا أخذ العينات من 3 جولات إلى 1 بوضع فريق التصميم في مصنعنا في تشينغداو.
      result: 55 يوماً من توقيع أمر الشراء إلى FOB. 2,400 وحدة عبر 4 وحدات SKU. ووُضع طلب متكرر قبل وصول الحاوية الأولى.
    - challenge: احتاجت شركة ناشئة أمريكية للرياضات المائية إلى كاياك Drop-Stitch عالي الأداء بهيكل مخصص، وتغليف مشترك العلامة التجارية، وشهادة BSCI للبيع بالتجزئة.
      solution: عدّلنا قالب كاياك Drop-Stitch القائم بملف rocker معدّل، وطوّرنا أعمال تغليف مشتركة العلامة، ووفّرنا وثائق تدقيق BSCI الكاملة.
      result: إدراج ناجح في 3 سلاسل أمريكية كبرى للهواء الطلق. أكثر من 5,000 وحدة في السنة الأولى بمعدل بيع بلغ 98%.
    - challenge: تطلب موزع أسترالي مجموعة SUP معتمدة CE بألوان أنابيب مخصصة، وخيار ترقية Hypalon، والامتثال للمعيار الأسترالي AS 1799.
      solution: أنتجنا عينات ما قبل الإنتاج بـ 4 ألوان أنابيب، واستُبدل CSM Hypalon من مورّد ياباني، وتنسيق اختبار الامتثال لـ AS 1799 من طرف ثالث.
      result: إطلاق مجموعة SUP من 3 طرازات في سوق AU/NZ. تلاها الفوز بمناقصة حكومية لـ 12 قارب دورية SUP.
faq_section:
  tagline: أسئلة شائعة
  title: أسئلة B2B وOEM الشائعة
  questions:
    - q: ما هي الكمية الدنيا للطلب (MOQ) للوحات SUP القابلة للنفخ OEM؟
      a: تبدأ الكمية الدنيا للطلب من 5–10 وحدات للطرازات القياسية OEM. وتتطلب القوالب المخصصة والمشاريع الخاصة بعلامة تجارية حداً أدنى من 200 وحدة حسب التعقيد. ويتوفر طلبات تجريبية ودفعات عينات لإطلاق العلامات التجارية الجديدة.
    - q: هل تحمل أكوافارر شهادة BSCI؟
      a: نعم. يحتفظ مصنعنا بشهادة الامتثال الاجتماعي BSCI سارية (تقرير التدقيق متاح عند الطلب). كما نحمل شهادة لإدارة الجودة وتحمل جميع المنتجات شهادة CE. وتُقدم وثائق الامتثال لـ REACH وRoHS مع كل شحنة OEM.
    - q: ما هي المدة القياسية للتسليم لأمر OEM؟
      a: تبدأ الكمية الدنيا للطلب من 5–10 وحدات للطرازات القياسية OEM. وتتطلب القوالب المخصصة والمشاريع الخاصة بعلامة تجارية حداً أدنى من 200 وحدة حسب التعقيد. ويتوفر طلبات تجريبية ودفعات عينات لإطلاق العلامات التجارية الجديدة.
    - q: هل يمكنكم الشحن FOB تشينغداو أو CIF إلى مينائنا؟
      a: نعم. نشحن FOB تشينغداو، وCIF إلى الموانئ العالمية الرئيسية، وDDP للشركاء المؤهلين. ويدير فريق اللوجستيات لدينا حجز الحاويات ووثائق التصدير والتخليص الجمركي. ونشحن إلى أكثر من 50 دولة عبر أسواق الاتحاد الأوروبي والولايات المتحدة وأستراليا وآسيا.
b2b_moq: 'الكمية الدنيا القياسية: 5–10 وحدة لكل طراز (SUP/SUP/Drop-Stitch). الكمية الدنيا لـ SUP: 2–5 وحدات. نرحب بالطلبات التجريبية لشراكات جديدة.'
production_flow:
  tagline: تدفق الإنتاج
  title: من المادة الخام إلى القارب الجاهز
  subtitle: يمر كل قارب بست مراحل إنتاج مع نقاط فحص لمراقبة الجودة في كل خطوة. لا اختصارات، ولا فحوصات متخطاة.
  stages:
    - stage: '01'
      title: استلام المواد وفحص الجودة الواردة
      description: تُسجَّل جميع المواد الواردة برقم الدفعة/القطعة في نظام ERP لدينا، وتُعزل لفات قماش PVC، ونوى تقنية Drop-Stitch، والصمامات، والمواد اللاصقة، والمعدات حتى اعتماد مراقبة الجودة.
      qc_check: قوة الشد (ASTM D751)، مقاومة التمزق (ISO 4674)، مقياس السُمك، لزوجة المادة اللاصقة، الفحص البصري للعيوب
      qc_threshold: اختبار 100% من الدفعات. يُرفض المنتج إذا كانت مقاومة الشد أقل من 90% من المواصفة، أو مقاومة التمزق أقل من الحد الأدنى للمواصفة، أو وُجد أي عيب بصري
      responsibility: فريق مراقبة الجودة الوارد (3 مفتشين)
    - stage: '02'
      title: القطع باستخدام CNC وتجهيز المواد
      description: يعمل التخطيط المُحسَّن بالكمبيوتر على ترتيب الألواح على لفائف PVC لتقليل الهدر إلى أدنى حد. وتحافظ آلات القطع CNC الأوتوماتيكية على دقة موضعية تبلغ 0.1 مم.
      qc_check: التحقق من الأبعاد مقابل ملفات CAD DXF، وفحص جودة الحواف، والتحقق من عدد الألواح
      qc_threshold: يتم قياس كل لوح رقم 20. التفاوت المسموح ±0.5 مم. تُرفض الدفعة إذا تجاوزت نسبة الخروج عن التفاوت 2%
      responsibility: مهلة ورشة القص
    - stage: '03'
      title: اللحام وترابط خيوط Drop-Stitch
      description: تُلصق قلوب الدروب-ستيتش برقائق PVC الخارجية بالتصفيح الحراري. وتُلحم حجرات الأنابيب باللحام بالترددات الراديوية أو بالهواء الساخن. أما أحزمة الحواف فتُلحم بالانصهار من ثلاث طبقات.
      qc_check: اختبار التقشير كل 50 وحدة (ASTM D751)، وقياس عرض اللحام، ومراجعة سجل درجات حرارة الهواء الساخن، وفحص بصري للدرزات تحت الإضاءة الخلفية
      qc_threshold: 'قوة الالتصاق: الحد الأدنى 8 N/cm. تفاوت عرض اللحام ±1 mm. أي تموّج ظاهر = رفض'
      responsibility: مراقبة جودة اللحام (مفتشان في كل وردية)
    - stage: '04'
      title: التجميع والتجهيز
      description: 'تنتقل القوارب إلى التجميع النهائي حيث يتم تجميع جميع المكونات: الهيكل + الأنابيب، والصمامات، وحلقات D، والمقابض، وصناديق الشراع، وتجهيز حقيبة النقل. تتبع كل وحدة قائمة فحص تجميع من 100 نقطة.'
      qc_check: اعتماد قائمة فحص من 100 نقطة لكل وحدة، واختبار وظيفة الصمام (10 دورات فتح/إغلاق)، والتحقق من عزم شد الأجهزة، والفحص البصري
      qc_threshold: 'سياسة خلوّ من العيوب للعناصر الحرجة من حيث السلامة (الصمامات وحلقات D والمقابض). العيوب التجميلية البسيطة: AQL 2.5 (ISO 2859)'
      responsibility: قائد فريق التجميع + مراقبة الجودة على خط الإنتاج
    - stage: '05'
      title: اختبار الضغط وحجز الجودة
      description: يُنفخ كل حجرة إلى 1.25× الضغط المقنن (عادةً 20–25 رطل/بوصة مربعة PSI) ويُحتفظ بها لمدة 24–48 ساعة، مع تسجيل مستمر من أجهزة استشعار الضغط. وتُرفض الحجرات التي تتجاوز نسبة انخفاض ضغطها 5% وتُرسل لإعادة فحص اللحامات.
      qc_check: سجل احتباس الضغط لمدة 24 ساعة، معايرة الحساسات يوميًا، قراءة ضغط معوّضة عن درجة الحرارة، وإعادة اختبار اللحامات بعد الإصلاح
      qc_threshold: انخفاض الضغط الأقصى 5% خلال 24 ساعة عند درجة حرارة ثابتة. أي حجرة تتجاوز هذه النسبة = إعادة اختبار كاملة بنسبة 100% لدفعة الإنتاج بأكملها
      responsibility: مختبر الجودة (مستقل عن الإنتاج، ويرفع تقاريره مباشرة إلى الإدارة)
    - stage: '06'
      title: الفحص النهائي والتغليف
      description: 'الفحص البصري والوظيفي النهائي: عيوب السطح، ثبات اللون، التحقق من الملصق/رقم BIN، سلامة التغليف، واكتمال الملحقات. تُفرَّغ الوحدات بالتفريغ الهوائي وتُعبأ في الصناديق وتوضع على منصات التحميل (الباليتات) تمهيدًا لتحميل الحاويات.'
      qc_check: فحص بصري كامل، قائمة تحقق من الملحقات لكل وحدة SKU، اختبار سقوط التغليف (1 م، عينة عشوائية)، والتحقق من مسح الملصقات/الباركود
      qc_threshold: AQL 2.5 للعيوب الكبرى، AQL 4.0 للعيوب الثانوية. عدم القبول بأي عيوب أمان. يتم فحص 100% من الوحدات بصريًا
      responsibility: فريق مراقبة الجودة النهائية (4 مفتشين) + قائد فريق التغليف
workforce:
  tagline: فريقنا
  title: القوى العاملة والخبرات
  engineers: 25+

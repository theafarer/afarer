intro: لا يمكن لنموذج CAD، مهما كان مفصلاً، أن يكشف كيف سيتعامل القارب فعلياً مع الماء حتى يلامسه. ولهذا صُممت ورشة النماذج الأولية لدينا لتحويل البيانات الهندسية إلى قارب فعلي صالح للإبحار بأسرع وأدق ما يمكن. يمر كل طراز جديد من {SITE.name} — وكل طلب مخصص مهم — عبر هذه الورشة قبل اعتماد قوالب الإنتاج.
content_html: >-
  <h2>حيث يتحول التصميم إلى واقع</h2>

  <p>الورشة مجهزة بالكامل لتصنيع الهيكل والأنابيب والتجهيزات في وقت واحد. يقلص هذا النهج المتوازي مدة تنفيذ النموذج الأولي إلى 8-12 أسبوعًا من إصدار التصميم الهندسي، مقارنة بالمعدل السائد في الصناعة البالغ 16-20 أسبوعًا. وعندما يتطلب تطبيقك حلاً متخصصًا، يمكننا الانتقال من الفكرة إلى التحقق على
  الماء في أقل من ثلاثة أشهر.</p>


  <h2>إمكانيات الورشة</h2>

  <table>
    <thead><tr><th>محطة العمل</th><th>المعدات</th><th>الغرض</th></tr></thead>
    <tbody>
      <tr><td>تصنيع الهيكل</td><td>فرن قولبة دورانية (HDPE)، ومنطقة لحام TIG (الألمنيوم)، وقوالب وضع يدوي (الألياف الزجاجية)</td><td>إنتاج الهيكل بالحجم الكامل بجميع أنواع المواد الثلاثة</td></tr>
      <tr><td>تجميع الأنابيب</td><td>مكبس لحام RF، ومحطة تثبيت بالهواء الساخن، وجهاز اختبار النفخ</td><td>تصنيع تجميعات أنابيب بالحجم الكامل مع جميع الحواجز والمخاريط والصمامات</td></tr>
      <tr><td>التجهيز &amp; التركيب</td><td>رافعة محركات (500 كجم)، وإطار تجريبي للوحة القيادة، ومكبس خراطيم هيدروليكية، ولوحة التمديدات الكهربائية</td><td>التجهيز الكامل: المحرك، والتوجيه، وأجهزة التحكم، ونظام الوقود، والإلكترونيات، والمقاعد</td></tr>
      <tr><td>جناح الأجهزة</td><td>مستشعر سرعة GPS، ومقياس تدفق الوقود، وأجهزة قياس تسارع، ومصفوفة مزدوجات حرارية، ومسجل بيانات</td><td>تركيب ومعايرة أجهزة التجارب البحرية</td></tr>
    </tbody>
  </table>


  <h2>رحلة النموذج الأولي — خطوة بخطوة</h2>

  <ol>
    <li><strong>تسليم التصميم الهندسي</strong> — يراجع مدير الورشة والمهندس المسؤول عن المشروع حزمة التصميم (النموذج ثلاثي الأبعاد، وتقرير FEA، وقائمة المواد، وجدول الطبقات) رسميًا. تُحدد أي مخاوف تصنيعية وتُحل قبل بدء القطع.</li>
    <li><strong>إنتاج الهيكل</strong> — يُبنى الهيكل وفق المواصفة الهندسية. بالنسبة إلى HDPE: يُحمَّل برنامج القولبة الدورانية من محاكاة Moldex3D. بالنسبة إلى الألمنيوم: تُلحم الألواح المقطوعة بـ CNC في منطقة لحام TIG وفق خريطة اللحام المعتمدة. وبالنسبة إلى الألياف الزجاجية: يُتبع دفتر الطبقات طبقة بعد طبقة.</li>
    <li><strong>تصنيع الأنابيب</strong> — يُقطع القماش باستخدام قوالب CNC، ثم يُلحم بـ RF ليصبح حجرات بالحجم الكامل. تُنفخ كل حجرة إلى ضغط الاختبار وتُترك لمدة 24 ساعة للتثبيت الأولي.</li>
    <li><strong>التجميع &amp; التجهيز</strong> — يُوصل الهيكل بالأنابيب. يُعلَّق المحرك، وتُربط أنظمة التوجيه والتحكم، ويُثبت نظام الوقود، وتُوصل جميع الدوائر الكهربائية وتُتحقق منها.</li>
    <li><strong>الاختبارات الساكنة</strong> — قبل وضع القارب في الماء، يخضع لما يلي: فحص الطفو (الحمولة الكاملة + 30 % احتياط)، واختبار ضغط نظام الوقود، واختبار دورة القفل الكامل لنظام التوجيه، واختبار استمرارية التأريض الكهربائي.</li>
    <li><strong>برنامج التجارب البحرية</strong> — 20 ساعة من الاختبارات على الماء، على النحو المفصل أدناه.</li>
    <li><strong>مراجعة النموذج الأولي</strong> — تُعقد اجتماع اعتماد رسمي مع فرق الهندسة والإنتاج والجودة. تُوثق أي تغييرات مطلوبة في التصميم ويُدرجها في إصدار الإنتاج.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">برنامج التجارب البحرية لمدة 20 ساعة — جدول الاختبارات</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">مناورة الميناء — المناورة بسرعة منخفضة، والعكس، وفحص الحواجز المطاطية</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">اختبار السرعة — السرعة القصوى الموثقة بـ GPS، وسرعة الإبحار، واستهلاك الوقود عند 3 نقاط RPM</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">اختبار الدوران — القطر التكتيكي، والتقدم، والإزاحة الجانبية بسرعة 20 عقدة، إلى الميمنة واليسار</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">اختبار الصدمات — تكرار المرور عبر أمواج بارتفاع 0.5–1.0 م، مع مقياس تسارع على قاعدة مقعد القيادة</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">اختبار الثبات — زاوية الميلان الساكنة مع 4 من أفراد الطاقم + العدة إلى الميمنة، وحمل لامركزي</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">اختبار التحمل — 3 ساعات متواصلة بسرعة الإبحار، مع مراقبة درجات الحرارة (المحرك، والوقود، والكهرباء)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">الفحص النهائي — فحص جميع الأنظمة بعد التجربة، وربط وفحص جميع مثبتات التثبيت، وتوثيق النتائج</span>
      </div>
    </div>
  </div>


  <h2>نماذج أولية مخصصة للتطبيقات الفريدة</h2>

  <p>في ورشة النماذج الأولية نحل المشكلات التي لا يمكن لقوارب الإنتاج القياسية معالجتها. ومن الأمثلة الحديثة:</p>

  <ul>
    <li>قارب RIB بطول 7.8 م لمنظمة بحث وإنقاذ، يتطلب هيكل كابينة مخصصًا مع حماية من الانقلاب، وحوامل نقالة مدمجة، وحجرة سونار مثبتة في المقدمة — صُنعت جميعها كنماذج أولية وجُهزت واختُبرت في منشأتنا.</li>
    <li>قارب قابل للنفخ بطول 5.2 م لمقاول مسح هيدروغرافي، بعارضة خلفية مخفضة، وصاري أدوات قابل للإزالة، وجيوب محولات عبر الهيكل مصممة لتقليل اضطراب التدفق.</li>
    <li>قارب خدمة بطول 4.5 م بدفع كهربائي ليخت فاخر، حيث استُخدم النموذج الأولي للتحقق من المدى، والبنية التحتية للشحن، ومستويات الضوضاء قبل أن يلتزم العميل بأسطول من أربعة قوارب.</li>
  </ul>


  <h2>فريق النماذج الأولية لدينا</h2>

  <p>تعمل في الورشة ثمانية فنيين بحريين متعددي المهارات، خضع كل منهم لتدريب متقاطع في اثنين على الأقل من التخصصات الأساسية الثلاثة (الهيكل، والأنابيب، والتجهيز). قائد الفريق صانع قوارب خبير بخبرة 16 عامًا تمتد من الطلبات المخصصة الفردية إلى سلاسل الإنتاج. يُخصص لكل نموذج أولي مهندس مشروع يعمل كنقطة
  تواصل وحيدة مع العميل طوال عملية البناء والتجربة.</p>


  <h2>مشاركة العميل</h2>

  <p>نشجع عملاءنا بنشاط على حضور المراحل الرئيسية أثناء بناء النموذج الأولي — خاصة مراجعة التجهيز الأولية والتجربة البحرية. ملاحظاتكم التشغيلية خلال هذه المراحل لا تقدر بثمن في تحسين القارب قبل دخوله مرحلة الإنتاج. نحن لا نبني في فراغ؛ بل نبني بشراكة معكم.</p>

  <p>تعد التجربة البحرية التي تمتد 20 ساعة أيضًا فرصة لفريقكم للتعرف على طريقة قيادة القارب، وتخطيط أنظمته، ومتطلبات صيانته، بما يضمن انتقالًا سلسًا إلى الخدمة عند تسليم قوارب الإنتاج.</p>

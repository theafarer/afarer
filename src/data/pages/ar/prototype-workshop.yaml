  title: ورشة النماذج الأولية — تصنيع نماذج RIB بالحجم الكامل والتجارب البحرية | {SITE}
  description: من التصميم CAD إلى قارب جاهز للبحر خلال 8-12 أسبوعًا. تبني ورشة النماذج الأولية لدينا قوارب RIB والقوارب القابلة للنفخ المخصصة وتجهّزها وتختبرها في البحر. ابدأ مشروع النموذج الأولي اليوم.

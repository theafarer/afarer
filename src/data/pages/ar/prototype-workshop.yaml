intro: لا يمكن لنموذج CAD، مهما كان مفصلاً، أن يكشف كيف سيتعامل اللوح فعلياً مع الماء حتى يلامسه. ولهذا صُممت ورشة النماذج الأولية لدينا لتحويل البيانات الهندسية إلى لوح فعلي جاهز للماء بأسرع وأدق ما يمكن. يمر كل طراز جديد من Afarer — وكل بنية مخصصة مهمة — عبر هذه الورشة قبل اعتماد قوالب الإنتاج.
content_html: >-
  <h2>حيث يتحول التصميم إلى واقع</h2>

  <p>الورشة مجهزة بالكامل للتصنيع المتزامن للهيكل والحواف والتجهيز. يقلص هذا النهج المتوازي مدة تنفيذ النموذج الأولي إلى 8-12 أسبوعًا من إصدار التصميم الهندسي، مقارنة بالمعدل السائد في الصناعة البالغ 16-20 أسبوعًا. وعندما يتطلب تطبيقك حلاً متخصصًا، يمكننا الانتقال من الفكرة إلى التحقق على
  الماء في أقل من ثلاثة أشهر.</p>


  <h2>إمكانيات الورشة</h2>

  <table>
    <thead><tr><th>محطة العمل</th><th>المعدات</th><th>الغرض</th></tr></thead>
    <tbody>
      <tr><td>تصنيع الهيكل</td><td>ماكينة قص قماش CNC، ومكبس تصفيح حراري، ومحطة تجهيز نوى الغرزة الساقطة</td><td>إنتاج الهيكل بالحجم الكامل بجميع أنواع البناء الثلاثة</td></tr>
      <tr><td>تجميع الحواف والحجرات</td><td>مكبس لحام RF، ومحطة تثبيت بالهواء الساخن، وجهاز اختبار النفخ</td><td>تصنيع تجميعات الحواف والحجرات بالحجم الكامل مع جميع الحواجز والصمامات</td></tr>
      <tr><td>التجهيز &amp; التركيب</td><td>قالب تفريز صناديق الزعانف، وتثبيات لحام حوامل الشحن والمقابض، ومحطة قص وسادات السطح</td><td>التجهيز الكامل: الزعانف، وحوامل الشحن، وسدادات حبل الأمان، والمقابض، ووسائد السطح، والصمامات</td></tr>
      <tr><td>جناح الأجهزة</td><td>مستشعر سرعة GPS، ومحولات ضغط، وأجهزة قياس تسارع، ومصفوفة مزدوجات حرارية، ومسجل بيانات</td><td>تركيب ومعايرة أجهزة التجارب البحرية</td></tr>
    </tbody>
  </table>


  <h2>رحلة النموذج الأولي — خطوة بخطوة</h2>

  <ol>
    <li><strong>تسليم التصميم الهندسي</strong> — تُراجع حزمة التصميم (النموذج ثلاثي الأبعاد، وتقرير FEA، وقائمة المواد، وجدول الطبقات) رسميًا من قبل مدير الورشة والمهندس المسؤول عن المشروع. تُحدد أي مخاوف تصنيعية وتُحل قبل بدء القطع.</li>
    <li><strong>إنتاج الهيكل</strong> — يُبنى الهيكل وفق المواصفة الهندسية. بالنسبة إلى البناء أحادي الطبقة: تُصفّح نواة الغرزة الساقطة بالطبقة الخارجية من PVC المحددة. بالنسبة إلى البناء ثنائي الطبقة: تُضاف الطبقة الخارجية الإضافية فوق التصفيح الأساسي قبل قص النموذج. وبالنسبة إلى البناء المصهور: تُحمَّل معلمات التصفيح من ورقة العملية المعتمدة ويُتحقق منها على عينة أولى.</li>
    <li><strong>تصنيع الحواف</strong> — يُقطع القماش باستخدام قوالب CNC، ثم يُلحم بـ RF ليصبح حوافًا وحجرات بالحجم الكامل. تُنفخ كل حجرة إلى ضغط الاختبار وتُترك لمدة 24 ساعة للتثبيت الأولي.</li>
    <li><strong>التجميع &amp; التجهيز</strong> — يُوصل الهيكل بالحواف. تُركب صناديق الزعانف وحوامل الشحن، وتُثبت سدادات حبل الأمان ومقابض الحمل، ويُشد صمام النفخ، وتُلصق وسادة السطح وتُضبط محاذاتها.</li>
    <li><strong>الاختبارات الساكنة</strong> — قبل أن يلمس اللوح الماء، يخضع لما يلي: فحص الطفو (الحمولة الكاملة + 30 % احتياط)، واختبار تثبيت ضغط الحجرات، واختبار تسرب الصمام، واختبار شد المقابض والحوامل.</li>
    <li><strong>برنامج التجارب البحرية</strong> — 20 ساعة من الاختبارات على الماء، على النحو المفصل أدناه.</li>
    <li><strong>مراجعة النموذج الأولي</strong> — تُعقد اجتماع اعتماد رسمي مع فرق الهندسة والإنتاج والجودة. تُوثق أي تغييرات مطلوبة في التصميم وتُدرج في إصدار الإنتاج.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">برنامج التجارب البحرية لمدة 20 ساعة — جدول الاختبارات</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">التعرف على المياه الهادئة — التتبع بسرعة منخفضة، والدوران، وفحص الوقفة والارتفاع</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">اختبار السرعة — السرعة القصوى الموثقة بـ GPS، وسرعة الانطلاق، ووتيرة مستمرة عند 3 معدلات تجديف</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">اختبار الدوران — نصف قطر الدوران المحوري والكنسي، واستجابة اللوح، إلى اليسار واليمين</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">اختبار الأمواج المضطربة — تكرار المرور عبر أمواج مضطربة بارتفاع 0.5–1.0 م، مع مقياس تسارع عند موضع وقفة الراكب</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">اختبار الثبات — زاوية الميلان الساكنة مع 4 راكبين بأوزان متفاوتة، وحمل لامركزي إلى اليمين</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">اختبار التحمل — 3 ساعات متواصلة بسرعة الانطلاق، مع مراقبة ضغط الحجرات، ودرجة حرارة الحواف، وإجهاد الراكب</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">الفحص النهائي — فحص ما بعد التجربة لجميع المكونات، وشد وفحص جميع المثبتات، وتوثيق النتائج</span>
      </div>
    </div>
  </div>


  <h2>نماذج أولية مخصصة للتطبيقات الفريدة</h2>

  <p>ورشة النماذج الأولية هي المكان الذي نحل فيه المشكلات التي لا يمكن لألواح الإنتاج القياسية معالجتها. ومن الأمثلة الحديثة:</p>

  <ul>
    <li>لوح SUP إنقاذ عالي الوضوح لمنظمة بحث وإنقاذ، يتطلب مقابض إمساك مدمجة، وحوامل لمعدات الإنقاذ، وهيكلًا عالي الطفو لاستعادة المصابين — صُنع جميعه كنموذج أولي وجُهز واختُبر في منشأتنا.</li>
    <li>لوح SUP جولات استكشافي لمقاول مسح هيدروغرافي، بصاري أدوات قابل للإزالة، ومنافذ معدات محكمة، وحامل محولات منخفض البروز مصمم لتقليل السحب.</li>
    <li>لوح SUP صيد مدمج لأسطول منتجع، حيث استُخدم النموذج الأولي للتحقق من الثبات، وتجهيز المعدات، والمتانة تحت الاستئجار اليومي قبل أن يلتزم العميل بأسطول من أربعة ألواح.</li>
  </ul>


  <h2>فريق النماذج الأولية لدينا</h2>

  <p>تعمل في الورشة ثمانية فنيين بحريين متعددي المهارات، خضع كل منهم لتدريب متقاطع في اثنين على الأقل من التخصصات الأساسية الثلاثة (الهيكل، والحواف، والتجهيز). قائد الفريق صانع ماهر بخبرة 16 عامًا تمتد من الطلبات المخصصة الفردية إلى سلاسل الإنتاج. يُخصص لكل نموذج أولي مهندس مشروع يعمل كنقطة
  تواصل وحيدة مع العميل طوال عملية البناء والتجربة.</p>


  <h2>مشاركة العميل</h2>

  <p>نشجع عملاءنا بنشاط على حضور المراحل الرئيسية أثناء بناء النموذج الأولي — خاصة مراجعة التجهيز الأولية والتجربة البحرية. ملاحظاتكم التشغيلية خلال هذه المراحل لا تقدر بثمن في تحسين اللوح قبل دخوله مرحلة الإنتاج. نحن لا نبني في فراغ؛ بل نبني بشراكة معكم.</p>

  <p>تعد التجربة البحرية التي تمتد 20 ساعة أيضًا فرصة لفريقكم للتعرف على طريقة التعامل مع اللوح، وتخطيط سطحه، ومتطلبات صيانته، بما يضمن انتقالًا سلسًا إلى الخدمة عند تسليم ألواح الإنتاج.</p>

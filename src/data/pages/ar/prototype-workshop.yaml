  tagline: المختبر 05
  title: ورشة النماذج الأولية
  subtitle: من نموذج CAD إلى قارب جاهز للإبحار — مبني، ومجهز، ومُثبت الأداء
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp

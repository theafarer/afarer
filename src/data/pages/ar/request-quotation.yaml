hero_text:
  tagline: Get a Quote
  title: 'اطلب عرض أسعار<br />لمشروعك'
  subtitle: 'أخبرنا عن متطلباتك وسيقوم فريقنا بالرد عليك بتقديم عرض أسعار تفصيلي خلال يومي عمل.'
steps2_process:
  title: How It Works
  subtitle: 'أربع خطوات بسيطة من الاستفسار إلى الاقتباس.'
  items:
    - title: 'Step 1: Submit Your Requirements'
      description: 'املأ النموذج أدناه بنوع منتجك وكميته ومواصفاته. كلما زادت التفاصيل التي تقدمها، كلما كان عرض الأسعار الخاص بك أكثر دقة.'
      icon: tabler:file-text
    - title: 'Step 2: We Review & Advise'
      description: 'يقوم فريقنا الهندسي بمراجعة متطلباتك وقد يتصل بك للتوضيح. نحن نقدم توصيات بشأن تكوين المنتج وخياراته.'
      icon: tabler:users
    - title: 'Step 3: Receive Your Quote'
      description: 'ستتلقى عرض أسعار تفصيليًا يتضمن تسعير الوحدة وموك والمدة الزمنية وشروط الدفع وخيارات الشحن. عادة خلال 48 ساعة.'
      icon: tabler:currency-dollar
    - title: 'Step 4: Sample & Production'
      description: 'بعد قبول عرض الأسعار، ننتقل إلى إنتاج العينات (إن أمكن) أو مباشرة إلى الإنتاج الضخم. تحديثات منتظمة طوال العملية.'
      icon: tabler:building-factory
content_form:
  tagline: Quotation Form
  title: 'أخبرنا عن مشروعك'
  subtitle: 'جميع الحقول التي تحتوي على * مطلوبة.'
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
        - Custom
    - name: Quantity
      type: text
      placeholder: e.g. 50 units
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      placeholder: Describe your application, technical specifications, or any special requirements
cta:
  title: 'Prefer to discuss by email?'
  subtitle: 'Send your inquiry directly to our sales team and we will respond within 24 hours.'
  actions:
    - variant: primary
      text: Email us directly
      href: /contact

meta:
  title: 'اطلب عرض سعر — إنتاج SUP بتقنية OEM | {SITE}'
  description: 'اطلب عرض سعر مفصلاً لمشروع ألواح SUP أو القوارب الخاص بك. إنتاج OEM/ODM، أو علامة خاصة، أو أساطيل مخصصة — نرد خلال يومي عمل.'
  keywords:
    - 'طلب عرض سعر SUP'
    - 'عرض ألواح التجديف OEM'
    - 'عرض سعر مصنع SUP'
    - 'سعر SUP القابل للنفخ'
hero_text:
  tagline: اطلب عرض سعر
  title: اطلب عرض أسعار<br />لمشروعك
  subtitle: أخبرنا عن متطلباتك وسيقوم فريقنا بالرد عليك بتقديم عرض أسعار تفصيلي خلال يومي عمل.
steps2_process:
  title: كيف تعمل العملية
  subtitle: أربع خطوات بسيطة من الاستفسار إلى الاقتباس.
  items:
    - title: 'الخطوة 1: أرسل متطلباتك'
      description: املأ النموذج أدناه بنوع منتجك وكميته ومواصفاته. كلما زادت التفاصيل التي تقدمها، كلما كان عرض الأسعار الخاص بك أكثر دقة.
      icon: tabler:file-text
    - title: 'الخطوة 2: نراجع ونستشير'
      description: يقوم فريقنا الهندسي بمراجعة متطلباتك وقد يتصل بك للتوضيح. نحن نقدم توصيات بشأن تكوين المنتج وخياراته.
      icon: tabler:users
    - title: 'الخطوة 3: استلام عرض السعر'
      description: ستتلقى عرض أسعار تفصيليًا يتضمن تسعير الوحدة وموك والمدة الزمنية وشروط الدفع وخيارات الشحن. عادة خلال 48 ساعة.
      icon: tabler:currency-dollar
    - title: 'الخطوة 4: العينة والإنتاج'
      description: بعد قبول عرض الأسعار، ننتقل إلى إنتاج العينات (إن أمكن) أو مباشرة إلى الإنتاج الضخم. تحديثات منتظمة طوال العملية.
      icon: tabler:building-factory
content_form:
  tagline: نموذج عرض السعر
  title: أخبرنا عن مشروعك
  subtitle: جميع الحقول التي تحتوي على * مطلوبة.
  contact_fields:
    firstName: الاسم الأول
    lastName: اسم العائلة
    companyName: اسم الشركة
    email: البريد الإلكتروني
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - مركز الغوص
        - صيد الأسماك
        - السياحة البحرية / المنتجعات
        - البحث والإنقاذ
        - قارب اليخوت المساعد
        - قارب عمل تجاري
        - الحكومة / القطاع العسكري
        - OEM / العلامة الخاصة
        - شخصي / ترفيهي
        - أخرى
    - name: Target Market
      type: text
      placeholder: 'مثال: أوروبا، أمريكا الشمالية، الشرق الأوسط'
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: 'مثال: التسليم خلال 90 يومًا'
    - name: Additional Requirements
      type: textarea
      options:
        - لا تفضيل
        - PVC من الدرجة البحرية (1100 dtex)
        - Hypalon / CSM فاخر
        - هيكل من الألياف الزجاجية
        - هيكل ألمنيوم
    - name: Engine Requirement
      type: text
      placeholder: 'مثال: محرك خارجي بقوة 60 حصانًا، بدون محرك، محرك مزدوج بقوة 115 حصانًا'
    - name: Customization Required
      type: text
      placeholder: 'مثال: ألوان مخصصة، وعلامة تجارية/شعار، وتغليف، وتركيبات خاصة'
    - name: Timeline
      type: text
      placeholder: 'مثال: التسليم خلال 90 يومًا'
    - name: Additional Requirements
      type: textarea
      placeholder: صف تطبيقك، أو مواصفاتك الفنية، أو أي متطلبات خاصة — وأرفق الرسومات المرجعية أو المواصفات أو الروابط إن كانت متوفرة
    - name: Upload Specification
      type: file
      placeholder: ارفع ورقة المواصفات أو الرسم أو المستند المرجعي (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: ارفع شعارك أو تصميمك الفني للعلامة التجارية المخصصة (AI, EPS, PNG)
cta:
  title: هل تفضل المناقشة عبر البريد الإلكتروني؟
  subtitle: أرسل استفسارك مباشرة إلى فريق المبيعات لدينا وسنرد عليك خلال 24 ساعة.
  actions:
    - variant: primary
      text: راسلنا مباشرة عبر البريد الإلكتروني
      href: /contact

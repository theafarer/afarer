hero:
  tagline: ''
  title: |
    مصنع القوارب القابلة للنفخ —<br class="hidden sm:inline" />
    OEM/ODM <span class="text-accent dark:text-white">مصنّع</span>
  subtitle: |
    <span class="hidden sm:inline"><span class="font-semibold">afarer</span> هي شركة مصنّعة OEM/ODM في الصين للقوارب القابلة للنفخ وألواح التجديف (SUP) وقوارب الكاياك وقوارب SUP ومعدات السلامة البحرية الحاصلة على شهادات CE.</span>
    <span class="block mb-1 sm:hidden font-bold text-blue-600">afarer: مصنع موثوق منذ 2012.</span>
    نخدم عملاء B2B في أكثر من 50 دولة بالجملة والعلامات التجارية الخاصة والتصميم المخصص وحلول سلسلة التوريد الكاملة.
  taglineSection: حلول ألواح SUP قابلة للنفخ بمعايير تجارية للمنتجعات والنوادي وتجار التجزئة والعلامات المتخصصة في الرياضات المائية.
  actions:
    - variant: primary
      text: تصفح المنتجات
      href: /products
      icon: tabler:shopping-bag
    - text: اعرف أكثر
      href: '#features'
      icon: tabler:file-text
    - text: استكشف حلول SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: الصورة الرئيسية لـ afarer
who_we_serve:
  tagline: من نخدم
  title: حلول SUP متكاملة لكل نشاط مائي
  subtitle: معدات مصممة خصيصًا، وتصنيع، ودعم أعمال متكامل لأربعة أسواق رئيسية.
  items:
    - title: أندية التجديف
      keywords: معدات نوادي SUP، معدات مدارس التجديف، أساطيل التأجير
      description: أساطيل SUP متينة، وأسعار النوادي، وبرامج قطع الغيار لأندية التجديف والمدارس.
      icon: tabler:users
      cta: استكشف حلول نوادي التجديف
      link: /solutions/paddle-clubs
    - title: المنتجعات والفنادق
      keywords: الأنشطة المائية للمنتجعات، معدات شواطئ الفنادق، تجربة النزلاء
      description: برامج متكاملة لأساطيل ألواح SUP مع علامة تجارية مخصصة وتدريب للموظفين وحزم محسّنة للعائد على الاستثمار (ROI).
      icon: tabler:building
      cta: اصنع تجربتك المائية في منتجعك
      link: /solutions/resorts-hotels
    - title: شركاء التجزئة
      keywords: تجار الجملة لألواح SUP، وتجار التجزئة للمعدات الخارجية، ومتاجر السلع الرياضية
      description: خط إنتاج كامل، ومواد تسويقية، وخيارات دروبشيبينغ (dropshipping)، وهوامش جملة تنافسية.
      icon: tabler:shopping-cart
      cta: كن شريك تجزئة
      link: /solutions/retail-partners
    - title: علامات SUP الجديدة
      keywords: SUP بعلامة تجارية خاصة، علامة SUP مخصصة، ألواح تجديف بتصنيع OEM
      description: تصنيع OEM/ODM متكامل من البداية إلى النهاية — التصميم، والنماذج الأولية، والإنتاج الضخم، واللوجستيات العالمية.
      icon: tabler:package
      cta: ابنِ علامتك التجارية.
      link: /oem-odm-manufacturer
proof_points:
  title: موثوقة من شركات الرياضات المائية حول العالم
  subtitle: عقود من الخبرة في الهندسة البحرية تدعم برامج ألواح SUP المربحة.
  items:
    - metric: 10+
      label: سنوات من الخبرة
      detail: منذ عام 2012
    - metric: أكثر من 50
      label: الدول التي نخدمها
      detail: شبكة توزيع عالمية
    - metric: '15000'
      label: الوحدات المنتجة سنويًا
      detail: طاقة إنتاجية معتمدة بشهادة CE
    - metric: 100%
      label: معتمد CE
      detail: متوافق مع ISO 9001 وBSCI وREACH
business_solutions:
  tagline: كيف نساعدك
  title: شريكك من الفكرة إلى الإيرادات
  subtitle: أربع قدرات أساسية تساعد شركات الرياضات المائية على الانطلاق والتشغيل والنمو.
  items:
    - title: معدات احترافية
      description: ألواح SUP بجودة تجارية مصممة للاستخدام اليومي في التأجير، وتتحمل أكثر من 500 دورة استخدام مع الحد الأدنى من الصيانة.
      icon: tabler:shield-check
    - title: التصنيع وفق OEM
      description: إنتاج متكامل للعلامة التجارية الخاصة من التصميم والنماذج الأولية إلى الإنتاج الضخم والتسليم العالمي.
      icon: tabler:package
    - title: دعم الأعمال
      description: تدريب الموظفين، ومواد تسويقية، وبرامج قطع الغيار البديلة، وإدارة حساب مخصصة.
      icon: tabler:headset
    - title: الخدمات اللوجستية العالمية
      description: تسليم FOB من تشينغداو، وCIF إلى الموانئ الرئيسية، وتوصيل من الباب إلى الباب إلى أكثر من 50 دولة مع دعم الجمارك.
      icon: tabler:truck-delivery
oem_section:
  tagline: أطلق علامتك التجارية
  title: من الفكرة إلى السوق خلال 16 أسبوعًا
  subtitle: شريكك المتكامل لإطلاق علامة SUP الخاصة بك — التصميم والنموذج الأولي والتصنيع والشحن.
  steps:
    - number: '01'
      title: الفكرة والموجز
      desc: شارك رؤيتك، وسوقك المستهدف، ومواصفاتك.
    - number: '02'
      title: التصميم والهندسة
      desc: النمذجة ثلاثية الأبعاد، واختيار المواد، وتصميم الرسومات المخصصة.
    - number: '03'
      title: النموذج الأولي والتحقق
      desc: إنتاج العينات مع شهادة CE واختبارات الجودة.
    - number: '04'
      title: الإنتاج الضخم
      desc: تصنيع واسع النطاق مع مراقبة جودة مدمجة في خط الإنتاج ودعم لتدقيق المصنع.
    - number: '05'
      title: التوصيل العالمي
      desc: لوجستيات FOB من تشينغداو، وCIF إلى الموانئ الرئيسية، وتسليم من الباب إلى الباب.
  cta: ابدأ رحلتك مع علامتك التجارية
  cta_link: /oem-odm-manufacturer
cta:
  title: |
    هل أنت مستعد لبدء <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">مشروع OEM/ODM</span>؟
  subtitle: أخبرنا بمتطلباتك وسنقدم لك عرض سعر مخصص وتفاصيل الحد الأدنى للكمية والمهلة الزمنية خلال يوم عمل واحد.
  actions:
    - variant: primary
      text: اطلب عرض سعر
      href: /contact
      icon: tabler:message-circle
    - text: زور مصنعنا
      href: /factory

who_we_serve:
  tagline: جدِّف معنا
  title: اعثر على طريقك على الماء
  subtitle: لكل مجدِّف فكرة مختلفة عن المغامرة. اكتشف لوح SUP من Afarer مصمم حول طريقتك في التجديف.
  items:
    - title: المبتدئون والمجدِّفون الترفيهيون
      keywords: ساب قابل للنفخ للمبتدئين, لوح تجديف متعدد الاستخدامات, ساب ثابت
      description: ألواح متعددة الاستخدامات عريضة وثابتة تجعل ضربتك الأولى طبيعية وترافقك أثناء تقدمك.
      icon: tabler:users
      cta: اعثر على لوحك الأول
      link: /all-around-sup/
    - title: الرحلات والمغامرات
      keywords: ساب للرحلات, لوح تجديف للمسافات الطويلة, ساب للبعثات
      description: ألواح أطول وأضيق تحافظ على المسار وتنزلق أبعد وتحمل العتاد لمسارات تمتد أياماً.
      icon: tabler:building
      cta: استكشف ألواح الرحلات
      link: /touring-sup/
    - title: اليوغا واللياقة
      keywords: ساب لليوغا, لوح تجديف للياقة, ساب عريض وثابت
      description: منصات عريضة وثابتة بمساحة للحركة — لتمارين الشروق واللياقة والتوازن على المياه الهادئة.
      icon: tabler:heart
      cta: استكشف ساب اليوغا
      link: /yoga-sup/
    - title: صيد السمك والعائلة
      keywords: ساب لصيد السمك, لوح تجديف عائلي, منصة صيد ثابتة
      description: منصات ثابتة وعملية لصيد السمك والتجديف مع الأطفال وأيام طويلة من الاسترخاء على الماء.
      icon: tabler:users
      cta: استكشف ساب الصيد
      link: /fishing-sup/
proof_points:
  title: مُختبرة بما يتجاوز حدود صالة العرض
  subtitle: تصميم وأداء وجودة يمكنك التحقق منها — على الماء وفي الأرقام.
  items:
    - metric: 10+
      label: سنوات من التصميم لأجل الماء
      detail: منذ عام 2012، مع تحسين لوح تلو الآخر
    - metric: 50+
      label: دول على الماء
      detail: ممارسو التجديف والشركاء حول العالم
    - metric: 12–15
      label: نواة drop-stitch بقوة PSI
      detail: صلابة حيث يلزم، وسهولة في الحمل
    - metric: 100%
      label: اختبار ضغط لوحًا تلو الآخر
      detail: تُفحص قبل الشحن
business_solutions:
  tagline: لماذا الإحساس مختلف
  title: أداء تشعر به من الضربة الأولى
  subtitle: أربعة أعمدة صاغها الماء الحقيقي — الأداء والتصميم والبناء والجودة.
  items:
    - title: أداء على الماء
      description: أشكال مضبوطة للاستقرار والانزلاق والثقة في الموج — كل ضربة تبقى متصلة بالماء.
      icon: tabler:shield-check
    - title: تصميم معبِّر
      description: مجموعات مستوحاة من المد والطبيعة وطاقة الشاطئ — ألواح تتمنى أن يراك الناس عليها.
      icon: tabler:package
    - title: بناء مثبت
      description: قلوب drop-stitch عالية الكثافة وحواف معززة ودرزات ملحومة بالانصهار للاستخدام المتكرر.
      icon: tabler:headset
    - title: جودة موثقة
      description: مختبرة بالضغط ومفحوصة بصرياً ومدعومة بضمان واضح ودعم ما بعد البيع سريع الاستجابة.
      icon: tabler:truck-delivery
cta:
  title: اعثر على لوحك التالي.
  subtitle: سواء كانت ضربتك الأولى أو أطول مسار لك — سنوصلك إلى الماء.
  actions:
    - variant: primary
      text: استكشف المجموعة
      href: /inflatable-sup/
      icon: tabler:send
    - text: اطلب الكتالوج
      href: /resources/download-catalog/

who_we_serve:
  tagline: من نخدم
  title: حلول SUP متكاملة لكل نشاط مائي
  subtitle: معدات مصممة خصيصًا، وتصنيع، ودعم أعمال متكامل لأربعة أسواق رئيسية.
  items:
    - title: أندية التجديف
      keywords: معدات نوادي SUP، معدات مدارس التجديف، أساطيل التأجير
      description: أساطيل SUP متينة، وأسعار النوادي، وبرامج قطع الغيار لأندية التجديف والمدارس.
      icon: tabler:users
      cta: استكشف حلول نوادي التجديف
      link: /solutions/paddle-clubs
    - title: المنتجعات والفنادق
      keywords: الأنشطة المائية للمنتجعات، معدات شواطئ الفنادق، تجربة النزلاء
      description: برامج متكاملة لأساطيل ألواح SUP مع علامة تجارية مخصصة وتدريب للموظفين وحزم محسّنة للعائد على الاستثمار (ROI).
      icon: tabler:building
      cta: اصنع تجربتك المائية في منتجعك
      link: /solutions/resorts-hotels
    - title: شركاء التجزئة
      keywords: تجار الجملة لألواح SUP، وتجار التجزئة للمعدات الخارجية، ومتاجر السلع الرياضية
      description: خط إنتاج كامل، ومواد تسويقية، وخيارات دروبشيبينغ (dropshipping)، وهوامش جملة تنافسية.
      icon: tabler:shopping-cart
      cta: كن شريك تجزئة
      link: /solutions/retail-partners
    - title: موزّعو الدول وشركاء العلامات المشتركة
      keywords: موزّع SUP حسب الدولة، SUP مشترك العلامة، SUP بعلامة خاصة
      description: توزيع حصري حسب الدولة ومجموعات محدودة مشتركة العلامة للشركات المؤهلة في مجال الرياضات المائية.
      icon: tabler:package
      cta: كن شريكاً
      link: /distributor-program
proof_points:
  title: مُختبرة بما يتجاوز حدود صالة العرض
  subtitle: تصميم وأداء وجودة يمكنك التحقق منها — على الماء وفي الأرقام.
  items:
    - metric: 10+
      label: سنوات من التصميم لأجل الماء
      detail: منذ عام 2012، مع تحسين لوح تلو الآخر
    - metric: 50+
      label: دول على الماء
      detail: ممارسو التجديف والشركاء حول العالم
    - metric: 12–15
      label: نواة drop-stitch بقوة PSI
      detail: صلابة حيث يلزم، وسهولة في الحمل
    - metric: 100%
      label: اختبار ضغط لوحًا تلو الآخر
      detail: تُفحص قبل الشحن
business_solutions:
  tagline: كيف نساعدك
  title: شريكك من الفكرة إلى الإيرادات
  subtitle: أربع قدرات أساسية تساعد شركات الرياضات المائية على الانطلاق والتشغيل والنمو.
  items:
    - title: معدات احترافية
      description: ألواح SUP بجودة تجارية مصممة للاستخدام اليومي في التأجير، وتتحمل أكثر من 500 دورة استخدام مع الحد الأدنى من الصيانة.
      icon: tabler:shield-check
    - title: مجموعات مشتركة العلامة
      description: مجموعات محدودة مشتركة العلامة مصممة ومهندسة ومبنية مع afarer — مع بقاء كل لوح منتجاً من منتجات afarer.
      icon: tabler:package
    - title: دعم الأعمال
      description: تدريب الموظفين، ومواد تسويقية، وبرامج قطع الغيار البديلة، وإدارة حساب مخصصة.
      icon: tabler:headset
    - title: الخدمات اللوجستية العالمية
      description: تسليم FOB من تشينغداو، وCIF إلى الموانئ الرئيسية، وتوصيل من الباب إلى الباب إلى أكثر من 50 دولة مع دعم الجمارك.
      icon: tabler:truck-delivery
oem_section:
  tagline: 'تصنيع OEM / ODM والعلامات المشتركة'
  title: من الفكرة إلى الماء — إصدارات مشتركة العلامة
  subtitle: 'للشركاء الذين يريدون أكثر من منتج من الكتالوج: تصنيع OEM/ODM ومجموعات محدودة مشتركة العلامة مصممة ومهندسة ومبنية مع afarer — مع بقاء كل لوح منتجاً من منتجات afarer.'
  steps:
    - number: '01'
      title: الفكرة والموجز
      desc: شارك رؤيتك، وسوقك المستهدف، ومواصفاتك.
    - number: '02'
      title: التصميم والهندسة
      desc: النمذجة ثلاثية الأبعاد، واختيار المواد، وتصميم الرسومات المخصصة.
    - number: '03'
      title: النموذج الأولي والتحقق
      desc: إنتاج العينات مع شهادة CE واختبارات الجودة.
    - number: '04'
      title: الإنتاج الضخم
      desc: تصنيع واسع النطاق مع مراقبة جودة مدمجة في خط الإنتاج ودعم لتدقيق المصنع.
    - number: '05'
      title: التوصيل العالمي
      desc: لوجستيات FOB من تشينغداو، وCIF إلى الموانئ الرئيسية، وتسليم من الباب إلى الباب.
  cta: استكشف العلامات المشتركة
  cta_link: /co-brand
cta:
  title: |
    هل أنت مستعد لبدء <br class="block sm:hidden" /><span class="sm:whitespace-nowrap">مشروع OEM/ODM</span>؟
  subtitle: أخبرنا بمتطلباتك وسنقدم لك عرض سعر مخصص وتفاصيل الحد الأدنى للكمية والمهلة الزمنية خلال يوم عمل واحد.
  actions:
    - variant: primary
      text: اطلب عرض سعر
      href: /contact
      icon: tabler:message-circle
    - text: زور مصنعنا
      href: /factory
distributor:
  tagline: 'موزّعون حصريون للدول'
  title: 'دولة واحدة. موزّع afarer رسمي واحد.'
  subtitle: 'برنامج دولة واحدة – موزّع واحد مع حصرية إقليمية، وأسعار موزعين، ودعم تسويقي، وبرنامج نجاح موزعين مخصص.'
  benefits:
    - title: 'الحصرية الإقليمية'
      description: 'موزّع معتمد واحد لكل دولة أو منطقة — لا منافسة داخلية، لا تضارب بين القنوات.'
    - title: 'هوامش المصنع المباشرة'
      description: 'قوائم أسعار للموزعين ورخصًا سنوية على الكميات الملتزم بها، شحن FOB تشينغداو.'
    - title: 'دعم التسويق والتدريب'
      description: 'مواد العلامات المشتركة، مواد نقاط البيع للتجار، تدريب على المنتجات، وحملات إطلاق.'
    - title: 'فريق حسابات مخصص'
      description: 'مدير موزعين شخصي مع دعم الإعداد وتوقعات الطلب وإعادة الطلب.'
  actions:
    - variant: primary
      text: 'كن موزعًا'
      href: /distributor-program
    - text: 'اطلب قائمة أسعار الموزعين'
      href: /contact?subject=Dealer Price List
    - text: 'قدّم طلب شراكة دولة'
      href: /contact?subject=Country Partnership Application
    - text: 'حمّل برنامج الموزعين'
      href: /distributor-program
  note: 'طلبات العينات من 5–10 وحدات. الطلبات التجريبية من 10–30. الوكيل المعتمد 30–50. الموزّع على مستوى الدولة/المنطقة 100–300+.'

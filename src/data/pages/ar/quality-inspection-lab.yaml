  tagline: المختبر 06
  title: مختبر الجودة والفحص
  subtitle: تحقق مستقل — كل اختبار ينجح قبل التسليم
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: اختبار الأشعة فوق البنفسجية في مختبر فحص الجودة لدى Afarer
intro: >-
  تحمل كل سفينة تغادر ورشتنا شهادة اجتيازها مجموعة محددة من فحوصات الجودة واختبارات المواد. ومختبر الجودة والفحص لدينا جهة مستقلة داخل المؤسسة — حيث يرفع تقاريره مباشرة إلى المدير العام وليس إلى الإنتاج — ما يضمن عدم قدرة أي ضغوط تجارية على المساس ببوابة الفحص. وإذا لم تلتزم دفعة مواد أو سفينة
  مكتملة بالمواصفات المنشورة، فللمختبر صلاحية إيقاف الشحنة حتى يتم حل عدم المطابقة.
content_html: >
  <h2>ثق، لكن تحقّق</h2>

  <p>يعمل المختبر ضمن نظام إدارة جودة متوافق مع المبادئ المعتمدة، وتستند طرق اختبارنا إلى معايير ISO وASTM وEN أينما ينطبق ذلك. نحتفظ بسجلات مفصلة لكل اختبار يُجرى، مما يخلق سلسلة تتبع كاملة من استلام المواد الخام حتى تسليم السفينة النهائية.</p>


  <h2>معدات الاختبار والقدرات</h2>

  <table>
    <thead><tr><th>المعدات</th><th>الاختبارات المُجراة</th><th>المعيار / الطريقة</th></tr></thead>
    <tbody>
      <tr><td>آلة الاختبار الشاملة (50 كيلونيوتن)</td><td>مقاومة الشد (النسيج)، مقاومة تقشير الدرزات، انتشار التمزق</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>منصة اختبار الاحتفاظ بالهواء (قابلة للبرمجة)</td><td>تحمّل 1000 دورة نفخ/تفريغ، اختبار تثبيت الضغط لمدة 30 دقيقة</td><td>ISO 6185 (داخلي)</td></tr>
      <tr><td>جهاز تقشير الدرزات (تقشير 180° آلي)</td><td>قوة تقشير اللحامات والدرزات الملصوقة عند 100 مم/دقيقة</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>جهاز اختبار الضغط الهيدروستاتيكي</td><td>مقاومة نفاذ الماء عبر النسيج (0–1000 ميلي بار)</td><td>ISO 811</td></tr>
      <tr><td>مقياس السماكة الرقمي والميكرومتر</td><td>سماكة النسيج، سماكة جدار الأنبوب، سماكة طبقة اللاصق</td><td>ISO 2286-3</td></tr>
      <tr><td>الغرفة البيئية</td><td>تكييف حراري (من -40 °م إلى +80 °م) لاختبارات التشقق البارد والشيخوخة الحرارية</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>مقياس الطيف اللوني</td><td>قياس فرق اللون Delta-E بعد التعرض للأشعة فوق البنفسجية</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>بوابات الفحص — من المادة إلى التسليم</h2>

  <p>تتبع كل سفينة خطة جودة محددة تتضمن نقاط فحص إلزامية. لا يمكن لأي سفينة تخطي بوابة؛ إذ يجب اعتماد كل بوابة من قِبل مفتش جودة قبل بدء مرحلة الإنتاج التالية.</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">البوابة 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">فحص المواد الواردة</p>
            <p class="text-xs text-gray-500 mt-1">دفعة النسيج، دفعة اللاصق، الهاردوير — كلها تُفحص وفق مواصفات الاستلام قبل الإفراج عنها للإنتاج.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">البوابة 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">فحص اللحام أثناء الإنتاج</p>
            <p class="text-xs text-gray-500 mt-1">تُختبر عينة اللحام الأولى (تقشير + بصري) في بداية كل وردية إنتاج.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">البوابة 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">اختبار هواء الحجرة</p>
            <p class="text-xs text-gray-500 mt-1">تُضغط كل حجرة إلى 1.5 ضعف ضغط التشغيل وتُثبَّت لمدة 30 دقيقة. تُسجَّل البيانات حسب الرقم التسلسلي.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">البوابة 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">فحص ما قبل التسليم</p>
            <p class="text-xs text-gray-500 mt-1">تُفحص السفينة بالكامل: جميع المثبتات مشدودة بعزم محدد، والأنظمة تعمل، ولا عيوب مظهرية. قائمة تدقيق من 100 نقطة.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">البوابة 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">الاعتماد النهائي</p>
            <p class="text-xs text-gray-500 mt-1">تُجمَّع تقارير الاختبار، وتُراجَع سجلات الفحص، وتُصدر شهادة المطابقة.</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>مؤشرات الجودة الرئيسية (متوسط 2025 المتحرك)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">نسبة النجاح من أول فحص (دفعات النسيج)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">معدل رفض اللحامات (لكل متر طولي)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">حجرات مختبرة بالهواء قبل التجميع</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">الامتثال لفئة التصميم</span>
    </div>
  </div>


  <h2>فريق الجودة لدينا</h2>

  <p>يعمل في المختبر مدير جودة (خبرة 10 سنوات في ضمان جودة المنتجات البحرية، ومهندس جودة معتمد من ASQ)، ومفتشا جودة (يحمل كل منهما اعتماد المستوى الثاني في الفحص غير الإتلافي البصري)، وفني مواد مسؤول عن جميع الاختبارات الفيزيائية. ويخضع الفريق لاختبار كفاءة سنوي عبر جهة خارجية مستقلة لضمان بقاء نتائج اختباراتنا دقيقة وقابلة للتكرار.</p>


  <h2>اختبارات مستقلة للعملاء</h2>

  <p>مختبر الجودة والفحص لدينا متاح لخدمات الاختبار المستقلة. إذا احتجت إلى التحقق من مواصفة نسيج، أو اعتماد نظام لاصق جديد، أو الحصول على تقرير اختبار من طرف ثالث لتأهيل المشتريات، يمكننا إجراء الاختبارات وفق المعيار المعمول به وإصدار تقرير اختبار معتمد.</p>

  <p>أمثلة على أعمال اختبار الطرف الثالث الأخيرة:</p>

  <ul>
    <li>مقارنة قوة التقشير لخمسة منتجات أفلام لاصقة منافسة لبرنامج مشتريات عسكرية أوروبية.</li>
    <li>دراسة شيخوخة متسارعة (أشعة فوق بنفسجية + تدوير حراري) لتركيبة PVC صبغية برتقالية جديدة، مع قياسات مرحلية منتظمة كل 500 ساعة.</li>
    <li>تحقق من الاحتفاظ بالهواء لـ 50 صمام حاجز أولي لتصميم أنبوب جديد عالي الضغط.</li>
  </ul>


  <h2>التزامنا تجاهكم</h2>

  <p>عند استلامك سفينة Afarer، تستلم أيضاً ملف الجودة الخاص بها — سجلاً مجمّعاً لنتائج الاختبارات التي تنطبق على سفينتك تحديداً. شهادة دفعة النسيج، واختبارات تقشير اللحامات، وسجلات اختبار هواء الحجرات، وقائمة فحص ما قبل التسليم. كل رقم قابل للتتبع، وكل مفتش معروف الهوية. هذا ليس مجرد أوراق — بل وعدنا بأن ما سلمناه هو ما حددناه.</p>

  <p>إذا كانت لديكم يوماً ملاحظة تتعلق بالجودة، يمكنكم التواصل مع المختبر مباشرة — فبيانات التواصل مطبوعة على شهادة المطابقة الخاصة بكم. نأخذ كل استفسار على محمل الجد ونتعهد بإجراء تحقيق رسمي خلال 48 ساعة.</p>

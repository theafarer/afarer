features:
  title: 'لماذا الشراكة مع أفارير'
  subtitle: 'نموذج الدولة الواحدة والموزّع الواحد مع هيكل دعم يجعل الإقليم مربحًا. الحصرية تُكتسب وتُحافظ عليها — وليست حقًا دائمًا.'
  columns: 3
  items:
    - title: 'الحصرية الإقليمية'
      description: 'موزّع معتمد واحد لكل دولة أو منطقة. لا استيراد موازٍ، ولا منافسة داخلية. استثمارك يبني خندقك الخاص.'
      icon: 'tabler:shield-check'
    - title: 'الحماية من تضارب القنوات'
      description: 'الطلبات المباشرة من منطقتك تمر عبرك، والتسعير يحمي هامشك. لا تبيع أفارير حول شركائها من الدول.'
      icon: 'tabler:users'
    - title: 'هوامش المصنع المباشرة والمكافآت'
      description: 'قائمة أسعار موزعين مع مكافآت على الكميات الملتزمة بها. بلا وسطاء. شحن FOB Qingdao مع مستندات تصدير كاملة.'
      icon: 'tabler:coins'
    - title: 'برنامج دعم الشركاء من 10 وحدات'
      description: 'الإعداد، والتوجه إلى السوق، والتدريب، والتسويق والتمويل المشترك للسوق، وقطع الغيار وما بعد البيع، والضمان، وأدوات الطلب، وبوابة الشركاء — كل ذلك مشمول في اتفاقية التوزيع (Distribution Agreement).'
      icon: 'tabler:rocket'
    - title: 'التسويق والصناديق المشتركة للسوق'
      description: 'أصول حملات محلية، ومواد نقاط البيع للموزعين، ومجموعات فعاليات، ومحتوى رقمي متعدد اللغات، ودعم تسويق مشترك لمواسم الإطلاق.'
      icon: 'tabler:mood-smile'
    - title: 'تدريب المنتج والمبيعات والتقني'
      description: 'جلسات إعداد منظمة حول المعرفة بالمنتج والمبيعات والجوانب التقنية، مع مواد محدّثة كلما تطوّرت المجموعة.'
      icon: 'tabler:presentation'
    - title: 'قطع الغيار ودعم ما بعد البيع'
      description: 'توريد قطع الغيار، وتسجيل الضمان ومعالجة المطالبات، وورقات بيانات المنتج والأدلة لفريق الخدمة المحلي لديك.'
      icon: 'tabler:settings'
    - title: 'مدير حساب مخصص وبوابة شركاء'
      description: 'مدير توزيع شخصي بالإضافة إلى الوصول إلى قوائم الأسعار وحالة الطلبات والموارد التسويقية عبر بوابة شركاء أفارير.'
      icon: 'tabler:user-check'
table:
  title: 'مستويات الشراكة والحد الأدنى للطلب (MOQ) وشروط الطلب'
  subtitle: 'اختر المستوى الذي يناسب إمكانات سوقك. جميع الأسعار بالدولار الأمريكي (USD)، FOB Qingdao.'
  caption: 'طلبات العينات والتجربة (5–30 وحدة) لا توفر حماية إقليمية. الحصرية الوطنية تنطبق فقط على اتفاقيات موزّع دولة / إقليم (Country / Regional Distributor) الموقّعة — وتُحافظ عليها عبر إتمام الطلب الأول، وأهداف الشراء السنوية، والمخزون المحلي، والقدرة على ما بعد البيع، والاستثمار المستمر في السوق، وهي ليست حقًا دائمًا أو أبديًا.'
  head:
    - 'مستوى الشراكة'
    - 'الحد الأدنى للطلب (وحدات)'
    - 'مدة التسليم'
    - 'الدفع'
  rows:
    - [تقييم العينات / المنتج, 5–10, 15–20 يوم عمل, 100% prepaid]
    - [طلب تجريبي, 10–30, 30–45 يوم عمل, 100% prepaid]
    - [Authorized Dealer, 30–50, 30–45 يوم عمل, إيداع 30% / 70% قبل الشحن]
    - [Country / Regional Distributor, 100–300, 30–45 يوم عمل, إيداع 30% / 70% قبل الشحن]
    - [Custom & Private Label (standard), 50+, 30–45 يوم عمل, إيداع 30% / 70% قبل الشحن]
    - [Deep Custom (new molds, packaging), 200+, 45–60 يوم عمل, إيداع 30% / 70% قبل الشحن]
    - [Full Product Line Rights, '300–1,000', 60–90 يوم عمل, إيداع 30% / 70% قبل الشحن]
faqs:
  title: 'شراكة الدولة — الأسئلة الشائعة'
  subtitle: 'الأسئلة التي يطرحها شركاء الدول الجادّون قبل التقديم.'
  items:
    - title: 'ماذا يعني حقًا دولة واحدة وموزّع واحد؟'
      description: 'تعيّن أفارير موزّعًا معتمدًا واحدًا يتمتع بحقوق حصرية لإقليم محدّد. نحن لا نبيع من قنواتنا العالمية أو الإقليمية إلى دولة محمية. ملكيتك للإقليم تستمر ما دامت اتفاقية التوزيع (Distribution Agreement) محققة.'
    - title: 'هل الإقليم حصري إلى الأبد؟'
      description: 'لا. الحصرية مشروطة وليست دائمة. تُحافظ عليها عبر اتفاقية توزيع موقّعة، وإتمام طلبك الأول، وأهداف شراء سنوية، ومخزون محلي، وقدرة على ما بعد البيع، واستثمار مستمر في السوق. إذا لم تتحقق هذه الشروط، يمكن إعادة التفاوض على الإقليم أو إسناده إلى جهة أخرى.'
    - title: 'ما هو الحد الأدنى للطلب الأول؟'
      description: 'يبدأ موزّعو الدول والأقاليم من 100–300 وحدة؛ والموزّعون المعتمدون من 30–50 وحدة؛ والطلبات التجريبية من 10–30 وحدة تتيح لك التحقق من السوق أولًا (لا توفر الطلبات التجريبية والعينات حماية إقليمية). تتبع برامج الاستبدال (Custom) والعلامة الخاصة (Private Label) حدودًا دنيا منفصلة مذكورة في المستويات أعلاه.'
    - title: 'ما هو الدعم المشمول في برنامج الدعم المكوّن من 10 وحدات؟'
      description: 'المستويات والمؤهلات، وحماية الإقليم، والحد الأدنى للطلب / التسعير / المكافآت السنوية، والمخزون وتنفيذ الطلبات، وأصول التسويق وصناديق السوق المشتركة، وتدريب المنتج / المبيعات / التقني، وقطع الغيار وما بعد البيع، وتسجيل الضمان، وبوابة الشركاء، وورقات بيانات المنتج، ومكتبة أصول التسويق، وجدول المكافآت السنوية، وقوائم الشحن والتعبئة.'
    - title: 'كيف تحميني أفارير من تضارب القنوات؟'
      description: 'كل إقليم لديه موزّع معتمد واحد بالضبط. يتم توجيه الاستفسارات والطلبات المباشرة من منطقتك عبرك، وتُحوَّل نماذج الموقع إلى الشريك المحلي حيثما وُجد، ولا يقوم الفريق العالمي بالتصعيد إلا عندما لا يستجيب الشريك.'
    - title: 'ما هي شروط الشحن والدفع؟'
      description: 'تُشحن الطلبات بنظام FOB Qingdao مع مستندات تصدير كاملة. طلبات الإنتاج: إيداع 30% مع 70% قبل الشحن؛ والطلبات التجريبية والعينات مدفوعة مسبقًا. مدة التسليم القياسية 30–45 يوم عمل، مع 15–20 يوم عمل لمجموعات العينات.'
    - title: 'كيف أقدّم الطلب؟'
      description: 'أرسل طلبك عبر نموذج الاتصال مع تفاصيل السوق. نراجع ملاءمة السوق، والحضور في التجزئة، والقدرات اللوجستية، ثم نرد خلال 3 أيام عمل بالخطوات التالية ونموذج اتفاقية توزيع (Distribution Agreement).'

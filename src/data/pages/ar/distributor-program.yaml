geo:
  tagline: 'من نتعاون معه'
  sentence: 'تتعاون أفارير مع موزّعين راسخين في قطاعات الملاحة والهواء الطلق والرياضة، يخدمون سلاسل التجزئة، وأساطيل التأجير، ومدارس الرياضات المائية، والمنتجعات، والمشترين الحكوميين بألواح SUP قابلة للنفخ فاخرة ومعدات مائية — والذين يلتزمون ببناء علامة أفارير في بلادهم.'
  audiences:
    - 'موزّعو الملاحة والقوارب'
    - 'تجزئة الهواء الطلق والرياضة'
    - 'مشغّلو التأجير والمنتجعات'
    - 'مدارس الرياضات المائية'
    - 'مجتمعات الرياضات المحيطية'

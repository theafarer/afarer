features:
  title: 'لماذا الشراكة مع أفارير'
  subtitle: 'مصمم لشركاء القنوات الذين يريدون بناء أعمال رياضات مائية بعلامة تجارية جادة خلفهم.'
  columns: 3
  items:
    - title: 'الحصرية الإقليمية'
      description: 'سوق محمية في دولة أو منطقة. موزّع واحد، لا منافسة داخلية، لا تضارب بين القنوات — استثمارك يبني خندقك الخاص.'
      icon: 'tabler:shield-check'
    - title: 'هوامش المصنع المباشرة'
      description: 'قائمة أسعار موزعين مع خصومات على الكميات الملتزمة بها. بلا وسطاء. شحن FOB تشينغداو مع مستندات تصدير كاملة.'
      icon: 'tabler:coins'
    - title: 'برنامج نجاح الموزعين'
      description: 'إعداد منظم، تخطيط الدخول إلى السوق، تدريب على المنتج والمبيعات، دعم للأسطول التجريبي وأدوات تسويق مشترك.'
      icon: 'tabler:rocket'
    - title: 'دعم التسويق والعلامة التجارية'
      description: 'مواد حملات محلية، مواد نقاط البيع، مجموعات فعاليات، ومحتوى رقمي متعدد اللغات.'
      icon: 'tabler:mood-smile'
    - title: 'سلسلة توريد موثوقة'
      description: 'إنتاج معتمد ISO وCE مع مراقبة جودة متسقة، وحدود طلب دنيا يمكن التنبؤ بها، ومواعيد تسليم يمكنك التخطيط حولها.'
      icon: 'tabler:building-factory'
    - title: 'مدير حساب مخصص'
      description: 'مدير توزيع شخصي للتنبؤات وتخطيط الطلبات والدعم بعد البيع.'
      icon: 'tabler:user-check'
table:
  title: 'مستويات البرنامج وشروط الطلب'
  subtitle: 'اختر المستوى الذي يناسب إمكانات سوقك. جميع الأسعار بالدولار الأمريكي، FOB تشينغداو.'
  caption: 'طلبات العينات (5–10 وحدات) لا توفر حماية إقليمية. تُتفق الشروط في اتفاقية التوزيع الخاصة بك قبل أي شحن.'
  head:
    - مستوى البرنامج
    - الحد الأدنى للطلب (وحدات)
    - مدة التسليم
    - الدفع
  rows:
    - [عينة / تقييم المنتج, 5–10, 15–20 يوم عمل, دفع مسبق 100%]
    - [طلب تجريبي, 10–30, 30–45 يومًا, دفع مسبق 100%]
    - [موزّع معتمد, 30–50, 30–45 يومًا, 30% دفعة أولى / 70% قبل الشحن]
    - [موزّع دولة / إقليم, 100–300, 30–45 يومًا, 30% دفعة أولى / 70% قبل الشحن]
    - [تخصيص وخاصة (قياسي), 50+, 30–45 يومًا, 30% دفعة أولى / 70% قبل الشحن]
    - [تخصيص عميق (قوالب جديدة، تغليف), 200+, 45–60 يومًا, 30% دفعة أولى / 70% قبل الشحن]
    - [حقوق خط الإنتاج الكامل, 300–1, 000, 60–90 يومًا, 30% دفعة أولى / 70% قبل الشحن]
faqs:
  title: 'برنامج التوزيع — الأسئلة الشائعة'
  subtitle: 'كل ما يسأل عنه الموزعون قبل التقديم.'
  items:
    - title: 'ماذا يعني دولة واحدة، موزّع واحد؟'
      description: 'تمنح أفارير موزّعًا معتمدًا واحدًا فقط حقوقًا حصرية لدولة أو منطقة. أنت تمتلك سوقك — لا استيراد موازٍ، ولا منافسة داخلية.'
    - title: 'ما هو الحد الأدنى للطلب الأول؟'
      description: 'يبدأ موزعو الدول والأقاليم من 100–300 وحدة. الموزعون المعتمدون من 30–50 وحدة. الطلبات التجريبية من 10–30 وحدة تتيح لك التحقق من السوق أولًا (بدون حماية إقليمية).'
    - title: 'ما الدعم الذي يحصل عليه الموزعون؟'
      description: 'يغطي برنامج نجاح الموزعين الإعداد، وتخطيط الدخول إلى السوق، والتدريب على المنتج والمبيعات، ودعم الأسطول التجريبي، والمواد التسويقية المحلية، ومدير حساب مخصص.'
    - title: 'كيف تحميني أفارير من تضارب القنوات؟'
      description: 'لكل إقليم موزّع معتمد واحد بالضبط. الطلبات المباشرة من منطقتك تمر عبرك، والأسعار تحمي هامشك.'
    - title: 'ما هي شروط الشحن والدفع؟'
      description: 'تُشحن الطلبات FOB تشينغداو مع مستندات تصدير كاملة. طلبات الإنتاج: 30% دفعة أولى و70% قبل الشحن؛ الطلبات التجريبية والعينات تُدفع مسبقًا.'
    - title: 'كيف أقدّم الطلب؟'
      description: 'أرسل طلبك عبر نموذج الاتصال. نقيم ملاءمة السوق والحضور في التجزئة والقدرات اللوجستية، ونرد خلال 3 أيام عمل بالخطوات التالية ونموذج اتفاقية توزيع.'

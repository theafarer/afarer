  title: استوديو هندسة الهياكل
  subtitle: محاكاة رقمية، وذكاء إنشائي، وتصميم هياكل مخصصة
  image: https://assets.afarer.com/images/afarer/factory/design discussafarer-inflatable-boat-afarer-factory-exterior.webp
  image_alt: محطة عمل التصميم الهندسي CAD لهياكل afarer
intro: >-
  الهيكل هو العمود الفقري لأي قارب قابل للنفخ. يجب أن يكون خفيفًا بما يكفي للانزلاق على الماء بكفاءة، وقويًا بما يكفي لامتصاص أحمال الصدمات، ومستقر الأبعاد عبر نطاق واسع من درجات الحرارة. في Afarer، يجمع استوديو هندسة الهياكل لدينا بين النمذجة المتقدمة باستخدام CAD، وتحليل العناصر
  المحدودة (FEA)، وعقود من الخبرة العملية في الهندسة البحرية لتقديم هياكل محسّنة لمهمتها المقصودة — لا أشكال عامة مقتبسة من كتالوج.
content_html: >
  <h2>حيث تلتقي القوة بالديناميكا المائية</h2>

  <p>نعمل مع ثلاث مواد أساسية للهياكل — HDPE المُشكَّل بالقولبة الدورانية، والألمنيوم الملحوم بدرجة بحرية، والألياف الزجاجية المرصوفة يدويًا — ونمتلك القدرة الهندسية لتصميم كل منها ومحاكاته والتحقق منه داخليًا.</p>


  <h2>أدوات التصميم والمعايير</h2>

  <p>تشمل بيئتنا الهندسية الرقمية:</p>

  <table>
    <thead><tr><th>القدرة</th><th>البرنامج / الأداة</th><th>الاستخدام</th></tr></thead>
    <tbody>
      <tr><td>النمذجة البارامترية ثلاثية الأبعاد</td><td>SolidWorks Professional</td><td>سطح الهيكل، ونظام السترنجرز، وحامل المحرك، وتخطيط السطح</td></tr>
      <tr><td>تحليل العناصر المحدودة</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>خرائط الإجهاد، والتحليل الاهتزازي، ومحاكاة الارتطام والصدمات</td></tr>
      <tr><td>ديناميكا الموائع الحاسوبية</td><td>Ansys Fluent / Star-CCM+</td><td>التنبؤ بالمقاومة الهيدروديناميكية، وتحسين زاوية الارتفاع (الترم)</td></tr>
      <tr><td>هندسة الطبقات المركبة</td><td>ESAComp / CADEC</td><td>ترتيب طبقات الألياف الزجاجية، واختيار النواة، وتقدير الوزن</td></tr>
      <tr><td>محاكاة تدفق القالب</td><td>Moldex3D</td><td>التنبؤ بسمك الجدار في القولبة الدورانية</td></tr>
    </tbody>
  </table>


  <h2>منهجية عملنا الهندسية</h2>

  <p>يخضع كل تصميم هيكل، سواء كان موديلًا قياسيًا أو مشروعًا مخصصًا بالكامل، لعملية صارمة من خمس مراحل:</p>

  <ol>
    <li><strong>المفهوم وجمع المتطلبات</strong> — نلتقي بك لتحديد الحمولة، ونطاق السرعة، والقدرة على تحمل حالات البحر، ومتطلبات القطر، وأي معدات خاصة بالمهام (فتحات السطح، ومواضع لوحة التحكم، ودمج خزان الوقود).</li>
    <li><strong>التسطيح ثلاثي الأبعاد والحسابات الهيدروستاتيكية</strong> — تُنمذج هيكلية القارب في SolidWorks وتُفحص من حيث الاستقرار الهيدروستاتيكي (GM، وذراع التقويم) باستخدام أدوات التحليل المدمجة.</li>
    <li><strong>التحليل الإنشائي بالعناصر المحدودة (FEA)</strong> — تُحدد حالات الأحمال: الساكنة (الطاقم + المعدات)، والديناميكية (ارتطامات الانزلاق المائي عند 5g)، والارتطام الموجي (السقوط من قمة الموجة بسرعة 3 م/ث). وتُراجع خطوط الإجهاد؛ مع اشتراط عامل أمان لا يقل عن 2.5.</li>
    <li><strong>تحسين المقاومة باستخدام CFD</strong> — تُحاكى الهيكلية في ثلاث حالات تحميل وبخمس سرعات، مع تقليل مساحة السطح المبتل وزاوية الارتفاع والمقاومة المتبقية بشكل تكراري.</li>
    <li><strong>مراجعة التصميم والإصدار</strong> — تُراجع الحزمة الهندسية الكاملة (النموذج ثلاثي الأبعاد، وتقرير FEA، وتقرير CFD، وتقدير الوزن، ودفتر الطبقات) من قبل مهندسنا البحري الأول قبل إصدارها إلى ورشة النماذج الأولية.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">توزيع الإجهاد FEA — هيكل قارب الدوريات (ألمنيوم 5083)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">عامل الأمان عند أقصى حمولة</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">تقليل المقاومة مقارنة بالجيل السابق</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">ذروة ضغط الارتطام الموجي (حد التصميم)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">إجمالي وقت تشغيل FEA في 2025</span>
      </div>
    </div>
  </div>


  <h2>التخصيص: هيكلك، وقواعدك</h2>

  <p>لا يوجد مشغّلان بمتطلبات متطابقة. فقارب دوريات الميناء يحتاج هيكلًا بقاع V ضحل للثبات عند السرعات المنخفضة؛ وقارب الاعتراض السريع يحتاج قاع V عميقًا مع حواجز رش؛ وقارب دعم الغوص يحتاج عرضًا كبيرًا ولوح مؤخرة منخفضًا. لا نفرض على تطبيقك شكل هيكل جاهزًا مسبقًا، بل نصمم انطلاقًا من
  مواصفاتك.</p>

  <p>أمثلة على مشاريع هندسة الهياكل المخصصة الحديثة:</p>

  <ul>
    <li>هيكل HDPE ممتد بطول 6.8 م لمشغّل جولات سياحية في الكاريبي، بمقدمة معززة لعمليات الهبوط على الشواطئ (+15 % سماكة القاع).</li>
    <li>قارب دوريات خفيف الوزن من الألمنيوم بطول 7.2 م لخفر السواحل، مع حواجز خزان وقود مدمجة ومقويات لخزائن المعدات.</li>
    <li>قارب غوص من الألياف الزجاجية بطول 5.5 م بلوح مؤخرة منخفض وصندوقَي بطارية، مصمم لتسهيل صعود السباحين المزودين بأنبوب تنفس.</li>
  </ul>


  <h2>مهندسونا</h2>

  <p>يقود الاستوديو مهندس بحري أول بخبرة 14 عامًا في تصميم القوارب عالية السرعة، ويدعمه مهندسان ميكانيكيان متخصصان في FEA وCFD. ويحمل الثلاثة شهادات عليا في الهندسة البحرية أو العمارة البحرية من جامعات معترف بها دوليًا. وينشر الفريق بانتظام في المجلات الصناعية ويشارك في مؤتمرات مثل المؤتمر الدولي
  للقوارب البحرية عالية الأداء.</p>


  <h2>كن شريكًا لنا في هيكلك القادم</h2>

  <p>من أول رسم تخطيطي للمفهوم إلى تقرير الإجهاد النهائي، يظل استوديو هندسة الهياكل لدينا شريكك في صناعة قارب ليس مجرد بناء — بل هندسة. نستثمر ساعات المحاكاة مقدمًا بحيث تكون كل لحامة وكل طبقة مركبة وكل منحنى في الهيكل موجودًا لهدف محدد.</p>

  <p>سواء كنت بحاجة إلى تعديل بسيط على موديل حالي أو تصميم جديد كليًا من الصفر، فنحن جاهزون لمناقشة متطلباتك.</p>

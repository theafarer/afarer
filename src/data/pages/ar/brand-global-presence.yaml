hero:
  tagline: 'الحضور العالمي'
  title: 'نخدم أكثر من 50 دولة<br />في كل قارة'
  subtitle: 'من مشغلي الدوريات الساحلية الأوروبية إلى موزعي الرياضات المائية الأستراليين إلى فرق الإنقاذ في الشرق الأوسط، توجد قوارب بعيدة على المياه في جميع أنحاء العالم.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer global marine manufacturing and distribution
stats:
  title: Global Reach
  stats:
    - title: Countries
      amount: '50+'

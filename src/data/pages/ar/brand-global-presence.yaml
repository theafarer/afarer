      amount: Montclair, CA
features3_markets:
  tagline: Key Markets
  title: 'الخبرة الإقليمية<br />للمتطلبات المحلية'
  subtitle: 'نحن ندرك أن الأسواق المختلفة لها متطلبات تنظيمية وتفضيلات وحالات استخدام مختلفة.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europe & UK
      description: 'منتجات معتمدة من CE تلبي معايير EN ISO 6185. طلب قوي على RIBs والقوارب القابلة للنفخ وألواح SUP عبر أسواق الاتحاد الأوروبي. يقدر الموزعون في المملكة المتحدة سرعة تحولنا.'
      icon: tabler:map-pin
    - title: North America
      description: 'وافق خفر السواحل الأمريكي على التصنيع. مستودع أمريكي في مونتكلير، كاليفورنيا للتسليم السريع في الساحل الغربي. تزايد الطلب على قوارب الصيد ومراكب الإنقاذ ومركبات SUP الترفيهية.'
      icon: tabler:map-pin
    - title: Australia & Oceania
      description: 'سوق قوي للقوارب SUP والمناقصات القابلة للنفخ. يقدر الموزعون الأستراليون قوارب Hypalon الخاصة بنا لمقاومتها للأشعة فوق البنفسجية في ظروف الشمس القاسية. الشحن السريع من منشأتنا في آسيا.'
      icon: tabler:map-pin
    - title: Middle East
      description: 'تزايد الطلب على زوارق الدوريات والإنقاذ. تحظى أضلاعنا ذات الهيكل المصنوع من الألومنيوم بشعبية كبيرة لدى مشغلي خفر السواحل والأمن. تكوينات مخصصة لبيئات درجة الحرارة العالية.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'شبكة التوزيع'
  title: 'الشراكة مع الموزعين<br />في جميع أنحاء العالم'
  subtitle: 'نحن نعمل مع موزعي المعدات البحرية المعتمدين، والعلامات التجارية OEM، ووكالات المشتريات الحكومية.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerships
      description: 'تصنيع العلامات التجارية الخاصة للعلامات التجارية العالمية للرياضات المائية. نحن نتعامل مع كل شيء بدءًا من التصميم وحتى الإنتاج وحتى الشحن.'
      icon: tabler:building
    - title: Distributor Network
      description: 'يقوم الموزعون المعتمدون في أكثر من 20 دولة بحمل المخزون وتقديم الدعم المحلي. نرحب باستفسارات الموزعين الجدد.'
      icon: tabler:users
    - title: Government & Institutional
      description: 'الإمداد المباشر لخفر السواحل ومنظمات البحث والإنقاذ وبرامج المشتريات العسكرية. الإمتثال لمتطلبات المشتريات المؤسسية.'
      icon: tabler:building-community
steps2_logistics:
  title: 'الخدمات اللوجستية والدعم العالمي'
  subtitle: 'من المصنع إلى الوجهة، نقوم بإدارة سلسلة التوريد بأكملها.'
  items:
    - title: Shipping Options
      description: 'الشحن البحري (FOB Qingdao)، والشحن الجوي للطلبات العاجلة، والبريد السريع للعينات وقطع الغيار.'
      icon: tabler:truck-delivery
    - title: US Warehouse
      description: 'المخزون موجود في مونتكلير، كاليفورنيا للتوصيل السريع في جميع أنحاء أمريكا الشمالية. الساحل الغربي: 2-3 أيام، الوسط: 3-4 أيام، الساحل الشرقي: 4-5 أيام.'
      icon: tabler:building-warehouse
    - title: Spare Parts
      description: 'يتم تخزين قطع الغيار والمواد الاستهلاكية الأصلية على مدار العام. يتم شحن الأجزاء المشتركة خلال 24 ساعة.'
      icon: tabler:package
    - title: Technical Support
      description: 'خط مباشر إلى فريقنا الهندسي لطرح الأسئلة الفنية ونصائح الإصلاح ودعم التجديد. نحن ندعم القوارب التي بنيناها منذ 20 عامًا.'
      icon: tabler:headset
cta:
  title: 'هل تريد أن تصبح موزعاً؟'
  subtitle: 'نحن نعمل بنشاط على توسيع شبكة التوزيع لدينا. اتصل بفريق التصدير لدينا لمناقشة فرص الشراكة.'
  actions:
    - variant: primary
      text: 'استعلام الشراكة'
      href: /contact
    - text: View our product range
      href: /products

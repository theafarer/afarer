meta:
  title: تصنيع ألواح SUP بعلامة تجارية خاصة | {SITE}
  description: أطلق علامتك التجارية الخاصة بألواح SUP مع Afarer. من الفكرة إلى السوق — خدمة OEM/ODM كاملة تشمل التصميم والنماذج الأولية والإنتاج والخدمات اللوجستية العالمية.
hero:
  tagline: ابنِ علامتك التجارية الخاصة
  title: أطلق علامتك التجارية الخاصة<br />بألواح SUP
  subtitle: لديك الرؤية، ولدينا المصنع والخبرة وسلسلة التوريد. معًا سنبني علامة تجارية تبرز عن غيرها.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: لوح SUP مخصص بعلامة تجارية على الماء
process:
  title: رحلتك لبناء علامتك التجارية
  subtitle: من الفكرة إلى السوق في 5 مراحل.
  steps:
    - phase: المرحلة 1
      title: الفكرة
      period: الأسبوع 1-2
      items:
        - البحث السوقي وتحليل المنافسين
        - تحديد العميل المستهدف
        - ورشة عمل تحديد موقع العلامة التجارية
        - استراتيجية خط الإنتاج
    - phase: المرحلة 2
      title: التصميم
      period: الأسبوع 3-6
      items:
        - شكل اللوح وتصميم الرسومات
        - مطابقة الألوان واختيار المواد
        - مواصفات الملحقات
        - تصميم التغليف والملصقات
    - phase: المرحلة 3
      title: النموذج الأولي
      period: الأسبوع 7-10
      items:
        - إنتاج العينات
        - اختبارات الجودة (الضغط، الطفو، الأشعة فوق البنفسجية)
        - تعديلات التصميم
        - الموافقة النهائية
    - phase: المرحلة 4
      title: الإنتاج
      period: الأسبوع 11-14
      items:
        - التصنيع بكميات كبيرة
        - فحص مراقبة الجودة (لكل وحدة)
        - الشحن البحري / الشحن الجوي
        - مستندات التخليص الجمركي
    - phase: المرحلة 5
      title: الإطلاق
      period: الأسبوع 15-16
      items:
        - تصوير المنتجات
        - تغذية المنتجات لموقع الويب
        - المواد التسويقية
        - دعم الإطلاق
packages:
  title: باقات الشركات الناشئة
  subtitle: باقات مصممة لكل مرحلة من مراحل نمو علامتك التجارية.
  items:
    - name: Starter Brand
      tagline: 50-100 وحدة · طرازا ألواح
      features:
        - طباعة الشعار الأساسية
        - تغليف قياسي
        - دعم البريد الإلكتروني
    - name: Growing Brand
      tagline: 300-1,000 وحدة · 3-5 طرازات ألواح
      features:
        - لون وشعار مخصصان
        - تغليف مخصص
        - صور المنتجات
        - مدير مخصص
    - name: Established Brand
      tagline: أكثر من 1,000 وحدة · خط منتجات كامل
      features:
        - تخصيص كامل
        - تغليف متميز
        - المواد التسويقية
        - أولوية الإنتاج
features:
  title: لماذا تختار العلامات التجارية Afarer
  subtitle: أكثر من 10 سنوات من خبرة OEM، واعتمادات كاملة، وأدنى حد أدنى للطلب في الصناعة.
  items:
    - title: أكثر من 10 سنوات من خبرة OEM
      description: تم تسليم أكثر من 2,400 هيكل للعلامات التجارية في جميع أنحاء العالم.
      icon: tabler:clock
    - title: شهادة كاملة
      description: CE / ISO / UKCA / BSCI / REACH — جميعها معتمدة.
      icon: tabler:certificate
    - title: مهلة تنفيذ 30 يومًا
      description: أسرع من متوسط الصناعة من الطلب إلى الشحن.
      icon: tabler:truck-delivery
    - title: حد أدنى منخفض لكمية الطلب (MOQ)
      description: ابتداءً من 50 وحدة — الأدنى في القطاع.
      icon: tabler:package
    - title: التصميم الداخلي (In-House)
      description: دعم تصميم كامل من الفكرة حتى التصميم النهائي.
      icon: tabler:palette
    - title: الخدمات اللوجستية العالمية
      description: دعم الشحن البحري والجوي وإجراءات التخليص الجمركي.
      icon: tabler:world

meta:
  title: كيف تختار سُمك SUP — تحليل هندسي | {SITE}
  description: 'دليل تقني لسماكة ألواح SUP القابلة للنفخ: كيف تختلف الألواح بسماكة 4" و5" و6" في الصلابة والوزن والثبات والاستقامة في المسار والأداء. مع توصيات بالسماكة المناسبة للتجديف السياحي واليوجا وركوب الأمواج والسباقات والتجديف الشامل.'
back_text: العودة إلى الأبحاث
hero:
  tagline: الهندسة
  title: كيف تختار سماكة ألواح SUP — تحليل هندسي
  subtitle: 'مدة القراءة: 6 دقائق'
content_html: >
  <h2>السماكات القياسية الثلاث</h2>


  <h3>4" (10 cm) – الرحلات والأداء</h3>

  <ul>
    <li>أعلى صلابة – مرونة أقل تحت الحمل</li>
    <li>الأخف وزنًا – مواد أقل وحجم هواء أقل</li>
    <li>استقامة ممتازة – تأرجح جانبي أقل</li>
    <li>الأسرع – مقاومة أقل وانزلاق أسهل</li>
    <li>الأفضل لـ: الرحلات والسباقات والتجديف الرياضي والمجدّفين ذوي الخبرة</li>
  </ul>


  <h3>5" (12.7 cm) – متعددة الاستخدامات</h3>

  <ul>
    <li>صلابة جيدة – توازن مثالي بين المرونة والصلابة</li>
    <li>وزن معتدل – استخدام قياسي للمواد</li>
    <li>ثبات أولي وثانوي جيد</li>
    <li>الأفضل لـ: التجديف الترفيهي والمبتدئين والاستخدام العادي في البحيرات والأنهار</li>
  </ul>


  <h3>6" (15.2 cm) – الثبات واليوغا</h3>

  <ul>
    <li>أعلى ثبات أولي – طفو هائل</li>
    <li>الأثقل – مواد PVC أكثر وحجم هواء أكبر</li>
    <li>الأبطأ – مقاومة أكبر وصعوبة أكبر في الحفاظ على الانزلاق</li>
    <li>الأفضل لـ: اليوغا واللياقة والمجدّفين من ذوي الأوزان الكبيرة (100+ كجم) والظروف المضطربة جدًا</li>
  </ul>


  <h2>التحليل الهندسي</h2>

  <p>تتحكم صلابة لوح SUP القابل للنفخ في ضغط الهواء الداخلي وعزم القصور الذاتي للمقطع العرضي للوح. عند ضغط 20 PSI، يُظهر لوح بسماكة 4 بوصات انحرافًا أقل بنحو 30% تحت الحمل مقارنة بلوح بسماكة 6 بوصات من نفس العرض والطول. يأتي الثبات الأولي من عرض خط الماء والطفو، بينما يتأثر الثبات الثانوي بشكل
  الحواف الجانبية وعرض اللوح.</p>


  <h2>السماكة حسب وزن المجدّف</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">وزن المجدّف</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">السماكة الموصى بها</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">أقل من 65 كجم (143 رطلًا)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 كجم (143 – 198 رطلًا)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 كجم (198 – 253 رطلًا)</td><td class="p-3 border">5" أو 6"</td></tr>
      <tr><td class="p-3 border">أكثر من 115 كجم (253 رطلًا)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>المفاضلة بين السماكة وضغط PSI</h2>

  <p>من المفاهيم الخاطئة الشائعة أن ضغط PSI الأعلى يمكن أن يعوّض السماكة الزائدة. عند 25 PSI، يُظهر لوح بسماكة 6 بوصات مرونة أكبر من لوح بسماكة 4 بوصات عند 15 PSI، لأن عزم القصور الذاتي الهندسي يهيمن على معادلة الصلابة. بالنسبة للمجدّفين المهتمين بالأداء، يتفوق اللوح الأرفع عند ضغط أقل على اللوح
  الأسمك عند ضغط أعلى.</p>


  <h2>تشكيلة afarer</h2>

  <ul>
    <li><strong>ألواح 4 بوصات:</strong> سلسلة Cheetah Touring – ألواح SUP للرحلات بمقاس 12' x 30" x 4" للتجديف الرياضي والمسافات الطويلة</li>
    <li><strong>ألواح 5 بوصات:</strong> سلسلة Cheetah All-Round – مقاس 10'6" x 32" x 5" للاستخدام الترفيهي</li>
    <li><strong>ألواح 6 بوصات:</strong> سلسلة Cheetah Ultra-Stable – مقاس 10' x 34" x 6" لليوغا والمجدّفين الكبار ومنصات التصوير</li>
  </ul>

  <p>تستخدم جميع الألواح نوى خيوط drop-stitch بسماكة 1,680 DTEX مع ضغط مقنّن 20 PSI وصفائح PVC بسماكة 1.2 مم.</p>

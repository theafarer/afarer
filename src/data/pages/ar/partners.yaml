hero:
  tagline: 'الشركاء والتوزيع'
  title: 'كن شريكًا بعيدًا<br />—شبكة التوزيع العالمية'
  subtitle: "Join afarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries."
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: 'برامج الشركاء'
  title: 'برامج الشركاء<br />مصممة لتحقيق النمو'
  subtitle: 'سواء كنت موزعًا أو تاجرًا أو شريكًا للعلامة التجارية، تقدم شركة afarer برامج مصممة لدعم أعمالك.'
  columns: 3
  items:
    - title: 'Distributor Program'
      description: 'توزيع حصري للمنطقة مع تسعير الحجم ودعم التسويق والوصول المباشر إلى المصنع. الحد الأدنى من الالتزام المطلوب بناءً على حجم المنطقة.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'تسعير الموزع المباشر والتدريب على المنتجات والمواد التسويقية ودعم الضمان لمواقع البيع بالتجزئة والمتاجر عبر الإنترنت.'
      icon: tabler:building-store
    - title: 'OEM/ODM Partnership'
      description: 'تصنيع المعدات الأصلية وتصنيع التصميم الشخصي (OEM) متكامل الخدمات مع العلامات التجارية المخصصة والتعبئة ومواصفات المنتج. من المفهوم إلى الحاوية.'
      icon: tabler:certificate
    - title: 'Brand Partnership'
      description: 'العلامات التجارية المشتركة والعلامات التجارية الخاصة وبرامج النماذج الحصرية للعلامات التجارية الراسخة في مجال الترفيه البحري والخارجي.'
      icon: tabler:stars
    - title: 'Government & Institutional'
      description: 'برامج الموردين المفضلة للوكالات الحكومية وخفر السواحل والمنظمات العسكرية والإنسانية. وثائق جاهزة للعطاء.'
      icon: tabler:building-community
    - title: 'Resort & Rental Partner'
      description: 'تسعير الأسطول والجودة المتسقة والعلامات التجارية المخصصة للمنتجعات ومراكز الغوص وعمليات التأجير في جميع أنحاء العالم.'
      icon: tabler:sun
content_benefits:
  tagline: 'لماذا الشراكة معنا'
  title: 'لماذا يختار الشركاء أبعد'
  subtitle: 'يستفيد شركاؤنا من القدرة التصنيعية الحقيقية والجودة المتسقة والدعم سريع الاستجابة.'
  list:
    - 'Direct Factory Access: Work directly with our manufacturing team —no middlemen. Get faster responses, better pricing, and full visibility into production.'
    - 'Customization Ready: Brand your products with custom colors, logos, packaging, and specifications. Minimum order quantities tailored to your market.'
    - 'Quality Guaranteed: ISO 9001 certified production with CE, UKCA, and BSCI compliance. Every product tested before shipping.'
    - 'Global Logistics: Shipping from Qingdao, China with FOB, CIF, and DDP options. US warehouse in Montclair, CA for North American distribution.'
    - 'Marketing Support: Product catalogs, photography, technical documentation, and digital assets to support your sales efforts.'
    - 'Training & Support: Product training for your sales team, technical support for your customers, and warranty service coordination.'
content_process:
  tagline: 'كيف تصبح شريكا'
  title: 'عملية شراكة بسيطة'
  subtitle: 'إن عملية الشراكة لدينا واضحة ومباشرة، وهي مصممة لتمكنك من بيع المنتجات البعيدة بسرعة.'
  items:
    - title: 'Step 1: Submit Application'
      description: 'أكمل نموذج طلب الشراكة الخاص بنا مع الملف التعريفي لشركتك والسوق المستهدف واهتمامات المنتج.'
    - title: 'Step 2: Qualification Review'
      description: 'يقوم فريق الشراكة لدينا بمراجعة طلبك ويتصل بك خلال 3 أيام عمل لمناقشة الفرص.'
    - title: 'Step 3: Agreement & Setup'
      description: 'قم بتوقيع اتفاقية شراكة، وقم بإعداد حسابك، واحصل على أسعار الشركاء والمواد التسويقية وعينات المنتجات.'
    - title: 'Step 4: Training & Launch'
      description: 'يتم توفير التدريب على المنتج ودعم المبيعات وضمانات التسويق. أنت جاهز لبدء البيع.'
cta:
  title: 'هل أنت مستعد لتصبح شريكًا بعيدًا؟'
  subtitle: 'تقدم بطلب الشراكة وسيقوم فريقنا بالرد خلال 3 أيام عمل.'
  actions:
    - variant: primary
      text: 'التقدم بطلب للحصول على الشراكة'
      href: /contact
    - text: View our products
      href: /products

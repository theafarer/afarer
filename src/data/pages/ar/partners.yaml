hero:
  tagline: الشركاء والتوزيع
  title: كن شريكًا بعيدًا<br />—شبكة التوزيع العالمية
  subtitle: انضم إلى شبكة شركاء afarer العالمية. نعمل مع موزعي المعدات البحرية، وموزعي القوارب، وتجار المعدات، وشركاء العلامات التجارية في أكثر من 50 دولة.
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp

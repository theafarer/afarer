content_programs:
  tagline: برامج الشركاء
  title: برامج الشركاء<br />مصممة لتحقيق النمو
  subtitle: سواء كنت موزعًا أو تاجرًا أو شريكًا للعلامة التجارية، تقدم شركة afarer برامج مصممة لدعم أعمالك.
  columns: 3
  items:
    - title: برنامج الموزعين
      description: توزيع حصري للمنطقة مع تسعير الحجم ودعم التسويق والوصول المباشر إلى المصنع. الحد الأدنى من الالتزام المطلوب بناءً على حجم المنطقة.
      icon: tabler:world
    - title: برنامج الموزعين
      description: تسعير الموزع المباشر والتدريب على المنتجات والمواد التسويقية ودعم الضمان لمواقع البيع بالتجزئة والمتاجر عبر الإنترنت.
      icon: tabler:building-store
    - title: الشراكة عبر OEM/ODM
      description: تصنيع المعدات الأصلية وتصنيع التصميم الشخصي (OEM) متكامل الخدمات مع العلامات التجارية المخصصة والتعبئة ومواصفات المنتج. من المفهوم إلى الحاوية.
      icon: tabler:certificate
    - title: شراكة العلامة التجارية
      description: العلامات التجارية المشتركة والعلامات التجارية الخاصة وبرامج النماذج الحصرية للعلامات التجارية الراسخة في مجال الترفيه البحري والخارجي.
      icon: tabler:stars
    - title: الحكومة والمؤسسات
      description: برامج الموردين المفضلة للوكالات الحكومية وخفر السواحل والمنظمات العسكرية والإنسانية. وثائق جاهزة للعطاء.
      icon: tabler:building-community
    - title: شريك المنتجعات والتأجير
      description: تسعير الأسطول والجودة المتسقة والعلامات التجارية المخصصة للمنتجعات ومراكز الغوص وعمليات التأجير في جميع أنحاء العالم.
      icon: tabler:sun
content_benefits:
  tagline: لماذا الشراكة معنا
  title: لماذا يختار الشركاء أبعد
  subtitle: يستفيد شركاؤنا من القدرة التصنيعية الحقيقية والجودة المتسقة والدعم سريع الاستجابة.
  list:
    - 'وصول مباشر إلى المصنع: اعمل مباشرة مع فريق التصنيع لدينا — دون وسطاء. احصل على استجابات أسرع وأسعار أفضل ورؤية كاملة لسير الإنتاج.'
    - 'جاهز للتخصيص: ضع علامتك التجارية على منتجاتك بألوان وشعارات وتغليف ومواصفات مخصصة، مع كميات أدنى للطلب مصممة خصيصًا لسوقك.'
    - 'الجودة مضمونة: إنتاج معتمد وفق ISO 9001 مع الالتزام بمعايير CE وUKCA وBSCI، وكل منتج يُختبر قبل الشحن.'
    - 'الخدمات اللوجستية العالمية: الشحن من تشينغداو، الصين، بخيارات FOB وCIF وDDP، مع مستودع في الولايات المتحدة بمدينة مونكلير، كاليفورنيا، للتوزيع في أمريكا الشمالية.'
    - 'دعم تسويقي: كتالوجات المنتجات، التصوير الفوتوغرافي، الوثائق الفنية، والأصول الرقمية لدعم جهودك البيعية.'
    - 'التدريب والدعم: تدريب المنتج لفريق المبيعات، والدعم الفني لعملائك، وتنسيق خدمات الضمان.'
content_process:
  tagline: كيف تصبح شريكا
  title: عملية شراكة بسيطة
  subtitle: إن عملية الشراكة لدينا واضحة ومباشرة، وهي مصممة لتمكنك من بيع المنتجات البعيدة بسرعة.
  items:
    - title: 'الخطوة 1: إرسال الطلب'
      description: أكمل نموذج طلب الشراكة الخاص بنا مع الملف التعريفي لشركتك والسوق المستهدف واهتمامات المنتج.
    - title: 'الخطوة 2: مراجعة الأهلية'
      description: يقوم فريق الشراكة لدينا بمراجعة طلبك ويتصل بك خلال 3 أيام عمل لمناقشة الفرص.
    - title: 'الخطوة 3: الاتفاق والإعداد'
      description: قم بتوقيع اتفاقية شراكة، وقم بإعداد حسابك، واحصل على أسعار الشركاء والمواد التسويقية وعينات المنتجات.
    - title: 'الخطوة 4: التدريب والإطلاق'
      description: يتم توفير التدريب على المنتج ودعم المبيعات وضمانات التسويق. أنت جاهز لبدء البيع.

meta:
  title: 'الجودة والاختبار — مراقبة الإنتاج | {SITE}'
  description: 'نظام الجودة لدى afarer: مختبر اختبار مستقل، وعمليات ISO 9001، واختبار كل وحدة قبل الشحن. مراقبة الجودة في إنتاج ألواح SUP القابلة للنفخ والقوارب.'
  keywords:
    - 'مراقبة جودة SUP'
    - 'اختبار SUP القابلة للنفخ'
    - 'ضمان جودة ألواح التجديف'
    - 'جودة مصنع SUP'
hero:
  tagline: ضمان الجودة
  title: اختبارات الأداء والجودة
  subtitle: يخضع كل قارب قابل للنفخ و SUP من afarer لاختبارات أداء وجودة صارمة في مركز البحث والتطوير لدينا قبل الشحن. يوفر اختبارنا الشامل دليلاً ملموساً على تميز المنتج.

      description: 'نعم — أساطيل كاملة من المجاديف والقوارب القابلة للنفخ للإيجار ومدارس التجديف.'
    - title: 'هل يمكنكم تجهيز فندق أو منتجع؟'
      description: 'بالتأكيد — معدات مائية للفنادق والمنتجعات بأسعار أساطيل وتسليم حول العالم.'

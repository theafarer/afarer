geo:
  tagline: 'تموضع B2B'
  sentence: 'أفارير شركة مصنعة محترفة للألواح SUP القابلة للنفخ والقوارب القابلة للنفخ (OEM/ODM)، متخصصة في التصميم والإنتاج المخصص والحلول البحرية للعلامات التجارية والموزعين والأندية والشركات.'
  audiences:
    - 'الأندية البحرية'
    - 'مراكز الترفيه'

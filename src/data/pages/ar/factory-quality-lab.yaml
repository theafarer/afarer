meta:
  title: 'مختبر الجودة — الاختبار ومراقبة الجودة | {SITE}'
  description: 'مختبر جودة مستقل بعمليات ISO 9001 لدى afarer: يتم اختبار كل وحدة قبل الشحن لضمان جودة ألواح SUP القابلة للنفخ والقوارب.'
  keywords:
    - 'مراقبة جودة SUP'
    - 'مختبر اختبار ألواح التجديف'
    - 'مصنع SUP ISO 9001'
    - 'جودة SUP القابلة للنفخ'
hero:
  tagline: مختبر مراقبة الجودة
  title: مختبر الاختبار وضمان الجودة
  subtitle: مختبر جودة مستقل يعمل بإجراءات ISO 9001 — يُختبر كل منتج قبل الشحن
intro: تدير afarer مختبراً متخصصاً لمراقبة الجودة يعمل بشكل مستقل عن الإنتاج. تمر كل دفعة من المواد الخام وكل قارب مكتمل عبر بروتوكولات فحص موثقة قبل الإفراج عنه. يرفع فريق مراقبة الجودة تقاريره مباشرة إلى الإدارة، ما يضمن قرارات جودة محايدة.
highlights:
  - value: 100%
    label: وحدات خضعت لاختبار الضغط
    detail: كل غرفة، كل قارب
  - value: 48 h
    label: مدة اختبار الاحتفاظ بالهواء
    detail: عند 1.25× الضغط الاسمي
  - value: '&lt;5%'
    label: أقصى انخفاض مسموح للضغط
    detail: فترة احتجاز تتجاوز 24 ساعة
  - value: AQL 2.5
    label: حد العيوب الرئيسية
    detail: وفقًا لنظام أخذ العينات ISO 2859
test_procedures:
  - title: فحص المواد الخام
    description: تُختبر كل دفعة واردة من PVC وهيبالون وقماش الدروب-ستيتش والتركيبات قبل قبولها. يُتحقق من قوة الشد (ASTM D751) ومقاومة التمزق (ISO 4674) ومقاومة الأشعة فوق البنفسجية. وتُعزل المواد غير المطابقة وتُعاد إلى المورد.
    standards:
      - ASTM D751 (tensile)
      - ISO 4674 (التمزق)
      - ISO 4892 (UV)
  - title: نقاط فحص مراقبة الجودة أثناء الإنتاج
    description: يقوم مشغلو الإنتاج بالتفتيش الذاتي في كل مرحلة. يقوم مدققو مراقبة الجودة بأخذ عينات عشوائية خلال الوردية. تُجرى اختبارات تقشير اللحامات كل 50 وحدة. تتم الفحوصات البُعدية كل 20 لوحة.
    standards:
      - ASTM D751 (peel)
      - قائمة فحص داخلية من 100 نقطة
      - أخذ العينات وفق معيار ISO 2859
  - title: اختبار الاحتفاظ بالهواء لمدة 48 ساعة
    description: يُنفخ كل حجرة من حجرات الأنبوب حتى 125% من الضغط المقنن ويُحتفظ بها لمدة 48 ساعة، مع تسجيل مستمر من أجهزة استشعار الضغط وتعويض درجات الحرارة. وأي حجرة تتجاوز نسبة انخفاض ضغطها 5% تخضع تلقائيًا لإعادة فحص الدفعة.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: اختبار الحمل والتوازن
    description: تُختبر القوارب المكتملة بأقصى حمولة مقررة للتحقق من الثبات، وارتفاع الجانب الحر، وسهولة المناورة. ويخضع كل قارب لاختبار على الماء قبل اعتماد الفحص النهائي.
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: جهاز اختبار عالمي (شدّ)
    spec: 5 kN، متوافق مع ASTM D751
  - name: Pressure Decay Tester
    spec: متعدد القنوات، 0–50 psi، مع تسجيل البيانات
  - name: UV Weathering Chamber
    spec: ISO 4892، دورة 1,000 ساعة
  - name: مقياس السماكة (رقمي)
    spec: دقة 0.01 مم
  - name: Peel Tester (weld)
    spec: مزوّد بمحرك، سعة 50 نيوتن
  - name: Temperature Chamber
    spec: '-40 °C إلى +100 °C'
  - name: Leak Detection Tank
    spec: 6 م × 2 م، مضاء

meta:
  title: 'التقنيات — drop stitch وPVC البحري | {SITE}'
  description: 'تقنيات afarer: بناء drop stitch، وPVC البحري، والطبقات المزدوجة، والضغط العالي. ابتكار من مصنّع محترف لألواح SUP القابلة للنفخ.'
  keywords:
    - 'تقنية SUP'
    - 'بناء drop stitch'
    - 'SUP عالي الضغط'
    - 'مواد SUP القابلة للنفخ'
hero:
  tagline: التقنية
  title: تقنيتنا
  subtitle: منتجات afarer مصممة بمواد متقدمة وهندسة مبتكرة لتوفير أداء استثنائي ومتانة وقابلية نقل.
sections:
  - title: قلب الدروب ستيتش
    description: تربط آلاف الخيوط البوليستر الداخلية بين الطبقتين العلوية والسفلية، لتشكّل بنية صلبة عند ضغط 12-15 PSI. وهي التقنية نفسها المستخدمة في ألواح التجديف الاحترافية وألواح SUP للسباقات القابلة للنفخ.
    imageAlt: مخطط نواة الشحن المباشر
  - title: بولي كلوريد الفينيل من الدرجة البحرية
    description: قماش PVC متعدد الطبقات مُصنَّف للبيئات البحرية. تُدمج كل طبقة باللحام الاندماجي بدلاً من اللصق، مما يزيل مخاطر التفكك الطبقي. مُختبر لمقاومة الأشعة فوق البنفسجية (UV)، وتآكل المياه المالحة، والاحتكاك.
    imageAlt: طبقة PVC
  - title: PVC من الدرجة العسكرية
    description: يُستخدم في جميع طرازات SUP، ويوفر PVC الفاخر مقاومة فائقة للأشعة فوق البنفسجية (UV) والمواد الكيميائية، مع الحفاظ على المرونة في درجات الحرارة القصوى ومقاومة التدهور.
    imageAlt: PVC
  - title: أرضية السطح الهوائية
    description: هيكل نفخ عالي الضغط بتقنية drop-stitch يوفر صلابة استثنائية للوقوف وصيد الأسماك واليوغا. يقلل من وقت التجهيز والوزن الإجمالي وحجم التخزين.
    imageAlt: السطح الهوائي

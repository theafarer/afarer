hero:
  tagline: 'دراسات حالة'
  title: 'مشاريع حقيقية، نتائج حقيقية<br />—afarer في العمل'
  subtitle: 'شاهد كيف تتعاون afarer مع الموزعين والعلامات التجارية والمشغلين حول العالم لتقديم حلول بحرية مخصصة لكل تطبيق.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'دراسات حالة afarer —مشاريع تصنيع بحرية مخصصة'
features3_cases:
  tagline: 'حالات مميزة'
  title: 'حلول مخصصة<br />لتحديات حقيقية'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'أسطول مركز غوص أوروبي'
      description: 'توريد 12 قارب SUP 520 مزود بتجهيزات الغوص لسلسلة مراكز غوص في البحر المتوسط. حاملات خزانات مخصصة، سلالم غوص، وعلامة تجارية للأسطول. تم التسليم في 60 يومًا.'
      icon: tabler:lifebuoy
    - title: 'برنامج OEM للموزع الأسترالي'
      description: 'تطوير مجموعة ألواح SUP خاصة بعلامة تجارية لموزع رياضات مائية أسترالي. 8 موديلات، تغليف مخصص، ولوجستيات شحن مباشر. من المفهوم إلى أول شحنة في 90 يومًا.'
      icon: tabler:currency-dollar
    - title: 'توريد قوارب إنقاذ للشرق الأوسط'
      description: 'توريد 20 قارب SUP 450 Patrol لمنظمة دفاع مدني في الشرق الأوسط. أسطح ذات تصريف ذاتي، مجموعة ملاحة كاملة، وأنابيب برتقالية عالية الوضوح. مطابقة للمعايير التنظيمية المحلية.'
      icon: tabler:alert-triangle
    - title: 'شراكة علامة تجارية أوروبية OEM'
      description: 'شراكة تصنيع بالعلامة البيضاء مع علامة تجارية بحرية أوروبية. 5 موديلات SUP، علامة تجارية خاصة، حقوق توزيع حصرية لسوق الاتحاد الأوروبي. اتفاقية متعددة السنوات.'
      icon: tabler:building
    - title: 'أسطول منتجع كاريبي'
      description: 'حزمة كاملة لمعدات الرياضات المائية لمنتجع كاريبي: 40 لوح SUP، 20 قارب كاياك، 10 قوارب قابلة للنفخ، وملحقات. علامة تجارية مخصصة للمنتجع على جميع المعدات.'
      icon: tabler:beach
    - title: 'عقد دورية ساحلية أمريكية'
      description: 'توريد قوارب SUP 600 Patrol لوكالة أمن ساحلي أمريكية. تكوين محرك مزدوج، خيارات كونسول مدرع، وتكامل إلكترونيات عسكرية.'
      icon: tabler:shield
cta:

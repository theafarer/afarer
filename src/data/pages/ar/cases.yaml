features3_cases:
  tagline: حالات مميزة
  title: حلول مخصصة<br />لتحديات حقيقية
  isBeforeContent: false
  columns: 3
  items:
    - title: أسطول مركز غوص أوروبي
      customer: مراكز الغوص BlueMed
      country: اليونان
      industry: الغوص والسياحة البحرية
      challenge: مطلوب 12 SUPs مكونة للغوص لسلسلة من مراكز الغوص عبر جزر يونانية متعددة. احتاجت كل لوحة إلى مرفق ترس مخصص، وتخزين لـ 8 خزانات، ومنصة مستقرة لدخول الغواص في المياه المفتوحة. يجب أن يصل الأسطول في غضون 60 يومًا لبدء الموسم السياحي.
      solution: أنتجت 12 طرازًا من طرازات Voyager Dive مع رفوف تروس مدمجة ومنصات مستقرة وبنية غرز متدلية عريضة للغاية لاستقرار الصعود إلى الطائرة. وصفت كل لوحة بكسوة أسطول العملاء. تم اختبار ضغط جميع الألواح الـ 12 وشحنها من تشينغداو في غضون 55 يومًا.
      product: سوب فوياجر دايف
      results: تم تسليم جميع اللوحات الاثني عشر في الوقت المحدد للموسم السياحي. يعمل الأسطول يوميًا منذ أكثر من 18شهرًا دون أي أعطال مادية. طلب العميل 6 وحدات إضافية في السنة الثانية.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: كانت SUP Voyager Dive العمود الفقري لعمليات الغوص اليومية لدينا. الاستقرار ممتاز، ويحافظ تخطيط تخزين التروس على سطح السفينة نظيفًا وآمنًا لضيوفنا.
      icon: tabler:lifebuoy
    - title: برنامج العلامة المشتركة للموزع الأسترالي
      customer: باسيفيك ووترسبورتس بي تي واي ليمت
      country: أستراليا
      industry: برنامج العلامة المشتركة والشراكة
      challenge: احتاج الموزع الأسترالي إلى مجموعة من العلامات التجارية الخاصة بأسعار تنافسية للتنافس مع العلامات التجارية الصينية المباشرة للمستهلك. مطلوب 8 موديلات فريدة من نوعها تغطي المبتدئين حتى المتقدمين، مع رسومات مخصصة، وتغليف مخصص، وتوصيل الشحن إلى منافذ البيع بالتجزئة.
      solution: >-
        طورت 8 موديلات (All - Around، Touring، Yoga، Kids، Sport، Ultra - Compact، Ultra - Stable، Whitewater) مع حزمة رسومات أسترالية حصرية. تغليف مخصص للبيع بالتجزئة مع رموز الاستجابة السريعة التي ترتبط بإعداد مقاطع الفيديو. لوجستيات إسقاط السفن التي تم تكوينها من تشينغداو مباشرة إلى متاجر البيع
        بالتجزئة الأسترالية.
      product: خط دعم مخصص (8 موديلات)
      results: مفهوم الشحنة الأولى في 90 يومًا. معدل بيع التجزئة بنسبة 85 ٪ في الموسم الأول. قام الموزع بتوسيع الشراكة لتشمل نماذج دعم إضافية في السنة الثانية.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: سلمت أفارير خط دعم كامل في 90 يومًا - من التصميم الأولي إلى طابق البيع بالتجزئة. تتطابق الجودة مع العلامات التجارية التي تبيع بضعف نقطة السعر.
      icon: tabler:currency-dollar
    - title: توريد قوارب إنقاذ للشرق الأوسط
      customer: الهيئة الوطنية للدفاع المدني
      country: دولة الإمارات العربية المتحدة
      industry: البحث والإنقاذ
      challenge: احتاجت منظمة الدفاع المدني إلى 20 قاعدة احتياطية جاهزة للدوريات للبحث والإنقاذ الساحلي وأمن الموانئ والاستجابة للفيضانات. اللوحات عالية الوضوح المطلوبة، ومعدات السلامة الكاملة، والامتثال للوائح البحرية المحلية.
      solution: زودت 20 طرازًا من طرازات الدوريات مع بنية برتقالية متدلية عالية الوضوح، وحزم أمان كاملة، وشريط عاكس SOLAS، وبناء مقوى. حصل كل مجلس على شهادة CE وتم اختباره وفقًا للمعايير المعمول بها. تضمنت حزمة الوثائق شهادات امتثال للتسجيل المحلي.
      product: سوب باترول
      results: انتشر الأسطول عبر 5 محطات ساحلية. تعمل الألواح في درجات حرارة شديدة (45 درجة مئوية+) دون أي تدهور. تجاوز الأداء والمتانة المواصفات.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: تجاوزت دورية SUP متطلباتنا التشغيلية. في ظروف الحرارة الشديدة، لا تظهر الألواح أي علامات على تدهور الأشعة فوق البنفسجية بعد 24 شهرًا من الاستخدام اليومي.
      icon: tabler:alert-triangle
    - title: شراكة العلامة المشتركة الأوروبية
      customer: شركة نورث سي مارين إكويبمنت بي في
      country: هولندا
      industry: برنامج العلامة المشتركة والشراكة
      challenge: أرادت العلامة التجارية البحرية الأوروبية الراسخة التوسع في سوق SUP دون الاستثمار في مرافق التصنيع. بحاجة إلى شريك ذي علامة بيضاء قادر على إنتاج 5 طرازات سوب (9 أقدام إلى 12 قدمًا) مع العلامة التجارية الخاصة، وشهادة CE، وحقوق التوزيع الحصرية للاتحاد الأوروبي.
      solution: وضع اتفاقية تصنيع للعلامة البيضاء لنماذج 5 SUP. يتميز كل طراز بشعارات العملاء ونظام الألوان. وثائق شهادة CE المعدة لكل نموذج. حقوق التوزيع الحصرية للاتحاد الأوروبي الممنوحة مع التزامات الحد الأدنى للطلب. الوثائق الفنية المقدمة لشبكة الخدمة المحلية.
      product: خط دعم مخصص (5 موديلات)
      results: تم توقيع اتفاقية متعددة السنوات. أول عملية إنتاج لـ 50 وحدة يتم شحنها في غضون 75 يومًا. تم إطلاق العلامة التجارية في المعرض التجاري الرئيسي مع استقبال إيجابي للوكلاء.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: أتاح لنا العمل مع afarer دخول سوق ألواح التجديف القائمة (SUP) دون الحاجة إلى إنشاء مصنع — إذ وفّروا لنا حلاً متكاملاً جاهزاً للاستخدام مع شهادة CE ووثائق دعم الموزعين.
      icon: tabler:building
    - title: أسطول منتجع كاريبي
      customer: Paradise Island Resorts Ltd
      country: جزر البهاما
      industry: السياحة البحرية والضيافة
      challenge: >-
        احتاج منتجع فاخر إلى أسطول كامل من معدات الرياضات المائية لأنشطة النزلاء: 40 لوح SUP للجولات المصحوبة بمرشدين، و20 لوح SUP إضافياً لاستكشاف البحيرات، و10 ألواح SUP للرحلات الخارجية للنزلاء، بالإضافة إلى الإكسسوارات. وكانت جميع المعدات بحاجة إلى علامة تجارية مخصصة للمنتجع، وكان يجب تسليمها
        قبل موسم الذروة السياحي.
      solution: 'أنتجت حزمة SUP كاملة: 40 لوح SUP من نوع Voyager (موديل All-Around)، و20 لوح SUP من نوع Explorer، و10 ألواح SUP من نوع Touring، بالإضافة إلى سترات النجاة (PFDs) والمجداف والمضخات وأطقم الإصلاح. جميع المعدات مطبوعة بشعار المنتجع وألوان استوائية. الشحنة معبأة في حاويات مع قائمة مخزون كاملة.'
      product: حزمة SUP الكاملة (أكثر من 70 وحدة)
      results: وصل الأسطول قبل 6 أسابيع من موسم الذروة. ارتفعت درجات رضا النزلاء عن أنشطة الرياضات المائية بنسبة 40% مقارنة بالعام السابق. واستمرت المعدات في الخدمة لمدة 3 مواسم دون سوى الصيانة الدورية.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: نهج الحزمة الكاملة عنى حصولنا على كل ما نحتاجه في شحنة واحدة — ألواح وإكسسوارات تحمل علامتنا التجارية وجاهزة لاستخدام النزلاء. نزلاؤنا يعشقون جودة المعدات.
      icon: tabler:beach
    - title: عقد دورية ساحلية أمريكية
      customer: Atlantic Coastal Security Agency
      country: الولايات المتحدة
      industry: الأمن البحري وإنفاذ القانون
      challenge: طلبت إحدى وكالات الأمن الساحلي الأمريكية ألواح SUP شديدة التحمل للدوريات في المياه المفتوحة، مع الحاجة إلى ألواح عالية الأداء مزوّدة بمعدات بمواصفات عسكرية ومتوافقة مع لوائح خفر السواحل الأمريكي.
      solution: لوح SUP Patrol هندسي بتركيبة drop-stitch معززة، وألوان عالية الوضوح، وحوامل معدات اتصالات مشفرة، ونقاط تثبيت معدات مدمجة. ألواح معززة للعمليات فائقة الكثافة. تُقدَّم وثائق الامتثال لمعايير USCG.
      product: سوب باترول
      results: أفادت الوكالة بنسبة جاهزية للمهام بلغت 95% خلال أول 12 شهرًا، وتم تقديم طلب إضافي لـ 8 وحدات.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      quote: توفر قوارب SUP Patrol لأطقمنا الأداء المطلوب للعمليات في المياه المفتوحة، ويوفر البناء المقوّى متانة بالغة الأهمية دون المساس بسهولة المناورة.
      icon: tabler:shield

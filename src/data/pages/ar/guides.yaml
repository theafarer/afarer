hero:
  tagline: الأدلة
  title: جديد على ألواح SUP؟
  subtitle: أدلة عملية تساعدك على اختيار ألواح SUP القابلة للنفخ واستخدامها والاستمتاع بها.
size_guide:
  tagline: المقاسات والمواصفات
  title: اعثر على المقاس المناسب لاحتياجاتك
  desc: قارن بين أبعاد ألواح SUP، وسعات الوزن، والاستخدامات الموصى بها. سواء كنت بحاجة إلى لوح جولات، أو لوح يوجا، أو لوح SUP متعدد الاستخدامات — فإن دليل المقاسات لدينا يساعدك على اختيار الأنسب.
  link_label: دليل المقاسات الكامل مع مواصفات المنتج →
  link: /size-guide
  cards:
    - title: ألواح SUP
      desc: اختر الطول بناءً على وزنك واستخدامك المقصود. توفر الألواح الأعرض (32 بوصة+) مزيدًا من الاستقرار. تتمتع الألواح الأطول (11—2 قدم) بتتبع أفضل للجولات.
    - title: ألواح SUP للجولات الطويلة
      desc: ألواح أطول (11—2 قدم) لقطع المسافات والحفاظ على اتجاه مستقيم. ثابتة بما يكفي للتجديف السياحي مع المعدات. تحقق دائمًا من سعة الوزن المسموحة.
    - title: ألواح SUP متعددة الاستخدامات
      desc: اختر الطول حسب وزن الراكب وطريقة الاستخدام. الألواح الأعرض (32 بوصة فأكثر) توفر ثباتًا أكبر. متعددة الاستخدامات للترفيه واللياقة البدنية.

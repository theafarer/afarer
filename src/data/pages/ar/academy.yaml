hero:
  tagline: أكاديمية أفارير
  title: مركز التعلم
  subtitle: أدلة وبرامج تعليمية لكل مستوى مهارة —من أساسيات SUP إلى تقنيات الإنقاذ المتقدمة
categories:
  - level: مبتدئ
    color: من الأخضر-500 إلى الزمردي-600
    badge: bg - green -100 text - green -700
    guides:
      - title: أساسيات SUP
        desc: تعلم أساسيات التجديف الوقوف —الوضعية، تقنية الضربة، والتوازن.
        slug: sup - basics
      - title: تقنيات المجذاف
        desc: الضربة الأمامية، الضربة الجانبية، ضربة السحب، والدعامة المنخفضة —أتقن حركات المجذاف الأساسية.
        slug: تقنيات التجديف
      - title: السلامة أولاً
        desc: ممارسات السلامة الأساسية بما في ذلك فحص الطقس، استخدام PFD، قواعد حبل الربط، والإنقاذ الذاتي.
        slug: السلامة أولاً
  - level: متوسط
    color: from - blue -500 to - indigo -600
    badge: bg - blue -100 text - blue -700
    guides:
      - title: أساسيات الجولات
        desc: تخطيط جولات التجديف لعدة ساعات —الملاحة، الترطيب، السرعة، وقراءة توقعات الرياح.
        slug: أساسيات الجولات السياحية
      - title: قراءة الطقس
        desc: تفسير التوقعات البحرية، تحديد أنماط السحب، وفهم تأثيرات الرياح على الماء.
        slug: قراءة الطقس
      - title: أساسيات الملاحة
        desc: قراءة الخرائط، استخدام البوصلة، نقاط GPS، وتخطيط الطريق للتجديف الساحلي.
        slug: أساسيات الملاحة
      - title: الوعي بالمد والجزر
        desc: فهم دورات المد والجزر والتيارات وكيف تؤثر على توقيت الانطلاق والطريق.
        slug: الوعي بالمد والجزر
  - level: متقدم
    color: من الأرجواني-500 إلى البنفسجي-600
    badge: bg - purple -100 text - purple -700
    guides:
      - title: تخطيط الرحلات متعددة الأيام
        desc: لوجستيات البعثة —اختيار المعدات، تخطيط الطعام، بروتوكولات السلامة، وجهات الاتصال في حالات الطوارئ.
        slug: التخطيط للرحلات لعدة أيام
      - title: تقنيات الإنقاذ
        desc: الإنقاذ الذاتي، إنقاذ T، الإنقاذ الإسكيمو للكاياك، وبروتوكولات القطر في المياه المفتوحة.
        slug: تقنيات الإنقاذ
      - title: التجديل الليلي
        desc: الملاحة بعد حلول الظلام —متطلبات الإضاءة، ذاكرة الطريق، التواصل الجماعي، والوعي بالمخاطر.
        slug: التجديف الليلي
  - level: الصيانة
    color: from - amber -500 to - orange -600
    badge: bg - amber -100 text - amber -700
    guides:
      - title: التنظيف والعناية
        desc: الشطف بالماء العذب، الحماية من الأشعة فوق البنفسجية، منع العفن، وتقنيات التجفيف المناسبة بعد كل جلسة.
        slug: التنظيف والعناية
      - title: دليل التخزين
        desc: أفضل الممارسات لتخزين الألواح والقوارب القابلة للنفخ —التفريغ، الطي، التحكم في درجة الحرارة، والعمر الافتراضي.
        slug: دليل التخزين
      - title: أساسيات الإصلاح
        desc: إصلاح الثقوب الصغيرة، تسربات الدرزات، ومشاكل الصمامات باستخدام مجموعات إصلاح PVC وتقنيات الرقعة.
        slug: أساسيات الإصلاح
      - title: صيانة الصمامات
        desc: تحديد أنواع الصمامات (Halkey-Roberts، Boston، Leafield)، تنظيف الحطام، واستبدال السيقان التالفة.
        slug: صيانة الصمامات
knowledge_center_tagline: مركز المعرفة
knowledge_center_title: أدلة المعدات والصناعة البحرية
knowledge_center_subtitle: معرفة الخبراء وأدلة الشراء للمهنيين البحريين ومشغلي الأساطيل وعشاق الرياضات المائية.
knowledge_sections:
  - title: معرفة مجلس الإدارة
    tagline: موجهات لوح التجديف أثناء الوقوف
    desc: كل شيء عن اللوحات الفرعية - تصميم اللوحة والمواد واختيار الحجم والصيانة ونصائح الشراء للاستخدام الترفيهي والتجاري.
    guides:
      - title: كيفية اختيار لوحة الدعم المناسبة
        desc: دليل كامل لاختيار الحجم والحجم والمواد والشكل والاستخدام المقصود.
        href: /learn/sup
      - title: سوب قابل للنفخ مقابل سوب صلب
        desc: قابل للنفخ مقابل لوح الإيبوكسي الصلب - قابلية الحمل والمتانة والأداء والقيمة مقارنة.
        href: /compare/inflatable-vs-hardboard
      - title: من جميع النواحي مقابل جولة مقابل اليوغا سوب
        desc: أنواع مختلفة من لوحات الدعم - معايير البناء والأشكال والأحجام والاستخدامات الموصى بها.
        href: /learn/sup
      - title: خياطة الدروب ستيتش مقابل البناء التقليدي
        desc: قارن بين الغرز المتدلية والبنية التقليدية للوحات الدعم من حيث الوزن والتكلفة والمتانة والصلابة.
        href: /learn/drop-stitch-core
  - title: دليل سوب قابل للنفخ
    tagline: معرفة SUP القابلة للنفخ
    desc: أدلة شاملة حول SUPs القابلة للنفخ - مواد PVC، وبناء غرزة السقوط، ومعايير السلامة، وأفضل ممارسات الصيانة.
    guides:
      - title: دليل المواد البلاستيكية
        desc: دليل نهائي لمواد البولي فينيل كلوريد المستخدمة في بناء الألواح الفرعية القابلة للنفخ.
        href: /learn/materials
      - title: كيف يتم صنع SUPs القابلة للنفخ
        desc: عملية التصنيع - قطع المواد، والربط الأساسي بالغرزة المتساقطة، وبناء التماس، واختبار الضغط، ومراقبة الجودة.
        href: /learn/inflatable-technology
      - title: دليل السلامة SUP
        desc: معايير السلامة، وسعة الحمولة، والتضخم المناسب، وفحوصات ما قبل المغادرة، وإجراءات الطوارئ.
        href: /learn/water-safety
      - title: الصيانة الفرعية
        desc: تنظيف الألواح الفرعية القابلة للنفخ وتخزينها وحمايتها من الأشعة فوق البنفسجية وإصلاحها.
        href: /inflatable-sup-maintenance
  - title: معرفة مجلس الإدارة
    tagline: لوحة التجديف
    desc: الأدلة الفنية التي تغطي أنواع لوحات الدعم والمواد وطرق البناء والصيانة والسلامة.
    guides:
      - title: أنواع اللوحات الفرعية
        desc: من جميع النواحي، والتجول، واليوغا، والرياضة، والأطفال SUPs - تعلم الاختلافات واختر الخيار المناسب.
        href: /learn/sup
      - title: تقنية Drop - Stitch
        desc: كيف تخلق الآلاف من الخيوط الداخلية هياكل صلبة قابلة للنفخ عالية الضغط.
        href: /learn/drop-stitch-core
      - title: مرجع المواد
        desc: تم شرح تصنيفات منكر PVC، وأوزان الأقمشة، ومقاومة الأشعة فوق البنفسجية، والمواد البحرية.
        href: /learn/materials
      - title: دليل الشراء
        desc: قارن بين أنواع لوحات الدعم المختلفة لحالات الاستخدام المختلفة ومستويات المهارات.
        href: /learn/sup
  - title: معرفة SUP
    tagline: موجهات لوح التجديف أثناء الوقوف
    desc: كل شيء عن اللوحات الفرعية - القابلة للنفخ مقابل الصلبة، وأبعاد اللوحة، وتكنولوجيا المواد، ونصائح الخبراء لجميع مستويات المهارات.
    guides:
      - title: سوب قابل للنفخ مقابل سوب صلب
        desc: قارن بين iSUPs وألواح الإيبوكسي الصلبة عبر قابلية الحمل والمتانة والأداء والقيمة.
        href: /learn/sup
      - title: دليل أبعاد اللوحة الفرعية
        desc: كيف يؤثر الطول والعرض والسماكة على الاستقرار والسرعة والقدرة على المناورة.
        href: /learn/sup
      - title: الصيانة والعناية
        desc: التنظيف والتخزين والحماية من الأشعة فوق البنفسجية ونصائح الإصلاح للألواح الفرعية القابلة للنفخ.
        href: /inflatable-sup-maintenance
      - title: اختيار مشوارك الأول
        desc: دليل المبتدئين لاختيار لوح التجديف المناسب لوزنك ومستوى مهارتك والاستخدام المقصود.
        href: /learn/sup
  - title: دليل عمليات التأجير
    tagline: إدارة أسطول شركات التأجير
    desc: أدلة حول بناء وإدارة أساطيل التأجير الفرعية لأكشاك الشاطئ ومراكز الرياضات المائية وعقارات الضيافة.
    guides:
      - title: بناء أسطول التأجير الخاص بك
        desc: كيفية اختيار لوحات الدعم المناسبة لعملية التأجير الخاصة بك - اعتبارات المتانة والحجم وعائد الاستثمار.
        href: /solutions/rental-operators
      - title: دليل صيانة الأسطول
        desc: ممارسات الصيانة الأساسية لزيادة عمر اللوحة وتقليل وقت التوقف عن العمل للأساطيل المستأجرة.
        href: /solutions/rental-operators
  - title: دليل المنتجع والضيافة
    tagline: الأنشطة المائية للضيافة
    desc: إرشادات حول إطلاق وإدارة برامج SUP للمنتجعات والفنادق والوجهات المطلة على الواجهة البحرية.
    guides:
      - title: بدء برنامج دعم المنتجع
        desc: العوامل التي يجب مراعاتها عند إطلاق أنشطة دعم الضيوف - تحديد حجم الأسطول والتوظيف ونمذجة الإيرادات.
        href: /solutions/resorts-hotels
      - title: الدعم مقابل الأنشطة المائية الأخرى
        desc: قارن بين برامج SUP والرياضات المائية الأخرى لتجربة الضيوف والكفاءة التشغيلية.
        href: /learn/sup
  - title: دليل البيع بالتجزئة والتوزيع
    tagline: الشراكات التجارية
    desc: يرشدك لتصبح شريكًا في البيع بالتجزئة أو موزعًا - تخطيط المخزون ووضع السوق واستراتيجيات النمو.
    guides:
      - title: أن تصبح بائع تجزئة لـ SUP
        desc: كيفية اختيار خطوط الإنتاج، وإدارة المخزون، ولوحات دعم السوق في متجر البيع بالتجزئة الخاص بك.
        href: /solutions/retail-partners
      - title: سوب للعمليات التجارية
        desc: لماذا تعد SUPs القابلة للنفخ منتجًا متعدد الاستخدامات للأساطيل التجارية وشركات التأجير والمشغلين المحترفين.
        href: /use-cases/search-and-rescue

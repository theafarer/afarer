      name: Chen Ming
      description: دكتوراه في علم المواد. متخصص في تكنولوجيا الغرز المتساقطة وعمليات اللحام عالية التردد. 10+ سنوات في مركبات النسيج.
      icon: tabler:flask
      image: data:image/svg+xml,% 3Csvg xmlns=" http://www.w3.org/2000/svg "viewBox =" 0 0 128 128"%3E% 3Ccircle cx=" 64 "cy =" 64" r=" 64 "fill=" %23e 5e7eb"/%3E% 3Ccircle cx=" 64 "cy =" 48" r=" 18 "fill ="% 239ca3af"/%3E% 3Cellipse cx=" 64 "cy=" 100" rx=" 32 "ry=" 20" fill ="% 239ca3af "/%3E%3C/svg%3E
    - title: مدير الإنتاج, الشخص الذي يشرف ويراقب الإنتاج في شركة إعلان, الشخص الذي يشرف ويراقب الإنتاج داخل شركة (بعض من واجباته هو إدارة سير العمل بجانب التخطيط للمشاريع وغيرها)
      name: Liu Qiang
      description: أكثر من 18عامًا في التصنيع الرشيق وتحسين خط الإنتاج. حزام بستة سيجما أسود. تطبيق أنظمة الجودة ISO 9001.
      icon: tabler:settings
      image: data:image/svg+xml,% 3Csvg xmlns=" http://www.w3.org/2000/svg "viewBox =" 0 0 128 128"%3E% 3Ccircle cx=" 64 "cy =" 64" r=" 64 "fill=" %23e 5e7eb"/%3E% 3Ccircle cx=" 64 "cy =" 48" r=" 18 "fill ="% 239ca3af"/%3E% 3Cellipse cx=" 64 "cy=" 100" rx=" 32 "ry=" 20" fill ="% 239ca3af "/%3E%3C/svg%3E
    - title: مدير الجودة
      name: Wang Fang
      description: أكثر من 12عامًا في مراقبة الجودة البحرية. مدقق معتمد من CE و ISO. الإشراف على اختبار كل دفعة إنتاج.
      icon: tabler:shield-check
      image: data:image/svg+xml,% 3Csvg xmlns=" http://www.w3.org/2000/svg "viewBox =" 0 0 128 128"%3E% 3Ccircle cx=" 64 "cy =" 64" r=" 64 "fill=" %23e 5e7eb"/%3E% 3Ccircle cx=" 64 "cy =" 48" r=" 18 "fill ="% 239ca3af"/%3E% 3Cellipse cx=" 64 "cy=" 100" rx=" 32 "ry=" 20" fill ="% 239ca3af "/%3E%3C/svg%3E

meta:
  title: 'فريقنا — مهندسو بحر وبناة | {SITE}'
  description: 'تأسست afarer في عام 2012 في تشينغداو، على يد مهندسي بحر، وخبراء مواد، وعشاق رياضات مائية. تعرّف على الفريق الذي يقف خلف المصنع.'
  keywords:
    - 'فريق afarer'
    - 'مهندسو بحر'
    - 'مصنّع ألواح SUP القابلة للنفخ'
    - 'فريق مصنع SUP'
hero:
  tagline: فريق العمل
  title: الأشخاص الذين يقفون وراء رحلة بعيدة<br />—هندسة الحرية في المياه
  subtitle: تأسست شركة afarer في عام 2012 في تشينغداو، الصين، وقد تم بناؤها على يد مهندسين بحريين وعلماء مواد وعشاق الرياضات المائية الذين آمنوا بجعل المركبات المائية القابلة للنفخ ذات الجودة الاحترافية متاحة في جميع أنحاء العالم.
  image:
    src: /images/team-all.webp
    alt: صورة فوتوغرافية كاملة للفريق - الهندسة والإنتاج والقيادة
founding:
  tagline: مؤسستنا
  title: من ورشة عمل ساحلية<br />إلى منشأة بمساحة 12,000 متر مربع
  subtitle: تأسست شركة afarer على يد فريق من المهندسين البحريين الذين يتمتعون بعقود من الخبرة المشتركة في تصميم القوارب القابلة للنفخ، وتصنيع PVC/Hypalon، وتصنيع المعدات البحرية العالمية.
  items:
    - title: (تأسست عام 2012)
      description: تأسست في مدينة تشينغداو بالصين، وهي مركز بحري رئيسي يتمتع بتراث عميق في مجال بناء السفن.
      icon: tabler:calendar
    - title: 200 موظف تقريبًا
      description: بما في ذلك أكثر من 50 مهندسًا للبحث والتطوير ومتخصصين في مراقبة الجودة وفنيي الإنتاج.
      icon: tabler:users
    - title: مرفق بمساحة 12000 مترمربع
      description: مصنع مخصص لتصنيع 6 خطوط إنتاج للألواح المطاطية والقوارب القابلة للنفخ وألواح SUP.
      icon: tabler:building-factory
    - title: ' بلد'
      description: التصدير إلى أوروبا والأمريكتين والشرق الأوسط وآسيا والمحيط الهادئ وأفريقيا.
      icon: tabler:globe
leadership:
  tagline: القيادة
  title: القيادة الإدارية والهندسية
  subtitle: يجمع فريق القيادة لدينا بين الخبرة العميقة في الهندسة البحرية والتجارة الدولية وإدارة الجودة.
  columns: 3
  items:
    - title: المؤسس والرئيس التنفيذي
      name: Toby Liu
      description: أكثر من 15عامًا في التصنيع البحري. قاد سابقًا البحث والتطوير في شركة صينية كبرى لتصنيع القوارب. حاصل على العديد من براءات الاختراع في تصميم القارب القابل للنفخ.
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: كبير المهندسين
      name: Zhang Wei
      description: أكثر من 20عامًا في تصنيع PVC/Hypalon وتصميم بدن عميق V. المدير الفني السابق في شركة هندسة بحرية أوروبية.
      icon: tabler:engine
      image: data:image/svg+xml,% 3Csvg xmlns=" http://www.w3.org/2000/svg "viewBox =" 0 0 128 128"%3E% 3Ccircle cx=" 64 "cy =" 64" r=" 64 "fill=" %23e 5e7eb"/%3E% 3Ccircle cx=" 64 "cy =" 48" r=" 18 "fill ="% 239ca3af"/%3E% 3Cellipse cx=" 64 "cy=" 100" rx=" 32 "ry=" 20" fill ="% 239ca3af "/%3E%3C/svg%3E

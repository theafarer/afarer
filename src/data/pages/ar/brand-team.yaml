      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: فلسفة التصميم
  title: تصميم قائم على الهندسة<br />—كل التفاصيل مهمة
  subtitle: تركز فلسفتنا الهندسية على ثلاثة مبادئ توجه كل منتج نقوم ببنائه.
  list:
    - 'الموثوقية أولاً: يتم اختبار كل منتج قريب لتحمل ظروف العالم الحقيقي - من عمليات إنقاذ المياه الباردة إلى تأجير المنتجعات الاستوائية. نحن نبالغ في الهندسة حيث يهمنا الأمر أكثر.'
    - 'دقة التصنيع: تستخدم منشآتنا القطع باستخدام الحاسب الآلي واللحام عالي التردد واختبار الضغط الآلي. كل درزة، كل صمام، كل تركيب يفي بالمواصفات الموثقة.'
    - 'الابتكار المستمر: يقوم فريق البحث والتطوير لدينا بتقييم المواد الجديدة وطرق الإنتاج وتحسينات التصميم بشكل مستمر. نحن لا ننتظر المشاكل - نحن نتوقعها.'
cta:
  title: هل تريد مناقشة المشروع مع فريقنا؟
  subtitle: مهندسونا على استعداد لتقديم المشورة بشأن اختيار المنتج، والتخصيص، وشراكات OEM/ODM.

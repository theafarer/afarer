hero_text:
  tagline: اتصل بنا
  title: تواصل معنا
contact_form:
  id: form
  title: أرسل لنا رسالة
  subtitle: للاستفسار عن الأسعار أو الأسئلة الفنية أو استفسارات الشراكة، أرسل لنا رسالة. نرد خلال يوم عمل واحد.
  email_to: info@afarer.com
  submit_button: إرسال الرسالة
  success_message: شكراً! رسالتك قد وصلت إلى صندوق الوارد لدينا. سنرد خلال يوم عمل واحد.
  error_message: حدث خطأ أثناء إرسال رسالتك. يرجى المحاولة مرة أخرى أو مراسلتنا مباشرة عبر البريد الإلكتروني.
  default_country_code: '+1'
  captcha:
    label: 'مكافحة البريد المزعج: يرجى حل ما يلي'
  fields:
    - name: firstName
      label: الاسم الأول
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: اسم العائلة
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: اسم الشركة
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: العنوان
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: الرمز البريدي
      row: 4
      step: 2
    - name: country
      label: الدولة
      row: 4
      step: 2
    - name: email
      label: البريد الإلكتروني
      row: 5
      step: 2
    - name: tel
      label: الهاتف
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: حجم الطلب التقديري
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: هل تحتاج إلى تخصيص؟
      row: 7
      step: 2
    - name: productInterest
      label: فئات المنتجات المهمة
      row: 8
      step: 2
    - name: subject
      label: الموضوع
      row: 9
      step: 3
    - name: message
      label: الرسالة
      row: 10
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: طرق أخرى للتواصل معنا
  columns: 3
  items:
    - title: استفسارات المبيعات

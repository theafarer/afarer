features3_solutions:
  tagline: حلول حسب نوع النشاط
  title: ألواح SUP مصممة خصيصًا<br />لعملك
  isBeforeContent: false
  columns: 2
  items:
    - title: المنتجعات والفنادق
      description: برامج أساطيل SUP كاملة للمنشآت الفندقية — ألواح متينة، وهوية بصرية مخصصة، ودعم تدريب الموظفين.
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: أندية التجديف
      description: أساطيل ألواح SUP موثوقة لأندية التجديف وبرامج الدروس وعمليات العضويات — ألواح بجودة تجارية وأسعار مخصصة للأندية.
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: مشغلو التأجير
      description: ألواح SUP عالية الاستخدام مصممة هندسيًا للاستخدام اليومي في التأجير. مقاومة للأشعة فوق البنفسجية، سريعة الجفاف، وقابلة للتكديس — صُممت لتتحمل ضغط عمليات التأجير.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: شركاء التجزئة
      description: 'بِع أسرع علامات SUP نمواً في سوقك: خط منتجات كامل، مواد تسويقية، شحن مباشر (Dropshipping)، وهوامش ربح تنافسية.'
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: الموزعون
      description: مناطق حصرية، ومجموعة منتجات كاملة، وإدارة حسابات مخصصة. انضم إلى شبكتنا التوزيعية العالمية في أكثر من 50 دولة.
      icon: tabler:world
      link: /solutions/distributors
    - title: ابنِ علامتك التجارية الخاصة
      description: تصنيع ألواح SUP بالكامل وفق معايير OEM/ODM من البداية إلى النهاية — التصميم، والنماذج الأولية، والإنتاج الضخم، والخدمات اللوجستية. أطلق علامتك التجارية مع Afarer.
      icon: tabler:package
      link: /solutions/build-your-own-brand

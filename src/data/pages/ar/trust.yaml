features3_certifications:
  title: الشهادات والامتثال
  subtitle: كل منتج يتم اختباره بشكل مستقل ومعتمد وفق المعايير الدولية.
  columns: 3
  isBeforeContent: true
  items:
    - title: شهادة CE
      description: جميع ألواح SUP من أفارير تلبي معيار السلامة الأوروبي CE للمراكب الترفيهية. يخضع كل منتج لاختبار الضغط والطفو والحمولة قبل مغادرة المصنع.
      icon: tabler:certificate
    - title: ISO 9001
      description: منشأتنا في تشينغداو بمساحة 12,000 م² تعمل تحت نظام إدارة جودة ISO 9001. كل دفعة إنتاج قابلة للتتبع وموثقة ومفحوصة.
      icon: tabler:clipboard-check
    - title: الامتثال الاجتماعي BSCI
      description: نحن معتمدون BSCI، مما يضمن ممارسات عمل أخلاقية وظروف عمل آمنة ومسؤولية بيئية عبر سلسلة التوريد لدينا.
      icon: tabler:users
    - title: REACH وRoHS
      description: جميع المواد — PVC وHypalon ورغوة EVA والمواد اللاصقة — تمتثل للوائح EU REACH وRoHS. لا مواد مقيدة، لا حلول وسط.
      icon: tabler:flask
    - title: مختبر اختبار المواد
      description: يختبر مختبر المواد الداخلي قوة الشد ومقاومة الأشعة فوق البنفسجية وسلامة اللحامات والتآكل لكل دفعة قماش قبل الإنتاج.
      icon: tabler:microscope
    - title: ضمان سنتين
      description: كل منتج أفارير يأتي مع ضمان سنتين ضد عيوب التصنيع. نحن نقف وراء ما نبنيه.
      icon: tabler:shield-check
testimonials:
  tagline: ثقة العملاء
  title: ماذا يقول عملاؤنا
  subtitle: من المجدفين لأول مرة إلى مشغلي الأسطول المحترفين — انظر لماذا يثقون بأفارير.
  items:
    - content: جهزنا أسطول التأجير بالكامل بقوارب SUP من أفارير. موسمان، ولا عطل واحد. شهادة CE جعلت الموافقة التأمينية seamless.
      name: ماركو ف.
      title: مشغل سياحي، كرواتيا
    - content: كمشتري لأول مرة، كنت متوتراً بشأن الجودة. وثائق ISO وتقارير الاختبار التي شاركوها أعطتني ثقة كاملة.
      name: جيمس تي.
      title: مالك SUP Explorer 11، كندا
    - content: نعمل مع أفارير لوحدات الدوريات الساحلية لدينا. عملية مراقبة الجودة لديهم متسقة عبر كل دفعة — تلك الموثوقية تهم في العمليات الحرجة.
      name: النقيب أندريس
      title: المشتريات البحرية، الفلبين
steps2_manufacturing:
  title: كيف نضمن الجودة
  subtitle: من فحص المواد الخام إلى اختبار الضغط النهائي — كل منتج يمر عبر سلسلة جودة صارمة.
  items:
    - title: فحص المواد الخام
      description: كل لفة من قماش PVC يتم اختبارها من حيث السمك وقوة الشد ومقاومة الأشعة فوق البنفسجية قبل دخول الإنتاج.
      icon: tabler:search
    - title: مراقبة الجودة أثناء التصنيع
      description: يتم فحص لحامات اللحام وتركيبات الصمامات وروابط الغرف في كل محطة أثناء التجميع.
      icon: tabler:eye
    - title: اختبار الضغط
      description: كل منتج قابل للنفخ يتم نفخه إلى 1.25x PSI المصنف ويحتفظ به لمدة 24–48 ساعة للتحقق من احتباس الهواء وسلامة اللحامات.
      icon: tabler:wind
    - title: الفحص النهائي
      description: يتم فحص كل وحدة من حيث التشطيب والأجهزة والتغليف قبل الموافقة على الشحن. تذهب عينات الدفعات إلى مختبرنا للاختبار التدميري.
      icon: tabler:clipboard-check
factory_audit:
  title: تدقيق المصنع والامتثال الاجتماعي
  subtitle: منشأتنا في تشينغداو بمساحة 12,000 م² مفتوحة أمام عمليات التدقيق من طرف ثالث. نحافظ على شهادة الامتثال الاجتماعي BSCI ونرحب بعمليات تفتيش العملاء.
  stats:
    - value: 12,000 مترمربع
      label: منشأة الإنتاج
    - value: أكثر من 200
      label: عمال مهرة
    - value: '15,000+'
      label: الطاقة الإنتاجية السنوية
    - value: BSCI
      label: الامتثال الاجتماعي
  highlights:
    - title: معتمد BSCI
      desc: شهادة الامتثال الاجتماعي amfori BSCI — عمل أخلاقي، وظروف آمنة، ومسؤولية بيئية.
      link: /certifications
    - title: مفتوح للفحص
      desc: نرحب بتدقيق العملاء في مصنعنا. احجز زيارة أو جولة افتراضية لخطوط الإنتاج لدينا في تشينغداو.
      link: /factory
    - title: قابلية التتبع الكاملة
      desc: كل دفعة إنتاج موثقة وقابلة للتتبع — من أرقام دفعات المواد الخام إلى اعتماد مراقبة الجودة النهائية.
    - title: ISO 9001:2015
      desc: نظام إدارة الجودة معتمد من SGS. وتلبي عملياتنا معايير التصنيع الدولية.
      link: /certifications
warranty_section:
  title: الضمان ودعم ما بعد البيع
  subtitle: نقف خلف كل منتج بشروط ضمان واضحة، ومعالجة سريعة للمطالبات، وقطع غيار أصلية.
  items:
    - title: ضمان المنتج لعامين
      desc: تحمل جميع منتجات afarer ضمانًا لمدة عامين ضد عيوب التصنيع — فشل اللحامات، وعيوب الصمامات، وانفصال طبقات المادة تحت الاستخدام العادي.
    - title: دعم قطع الغيار مدى الحياة
      desc: قطع غيار أصلية — صمامات، وطقم إصلاح، وزعانف، وحلقات D — متوفرة لجميع الموديلات. نحافظ على القوالب وأدوات التصنيع لمدة 5 سنوات على الأقل بعد انتهاء الإنتاج.
    - title: الاستجابة للمطالبات خلال 48 ساعة
      desc: تُقرّ مطالبات الضمان خلال 48 ساعة، وتُشحن الألواح البديلة خلال 10 أيام عمل للمطالبات المعتمدة.
    - title: شبكة إصلاح عالمية
      desc: مراكز إصلاح معتمدة في أكثر من 15 دولة. أطقم إصلاح ميدانية متاحة للعمليات النائية. أدلة إصلاح ذاتي للأضرار البسيطة.
    - title: دعم عملاء OEM
      desc: مديرو حسابات متخصصون لشركاء B2B، مع مراجعات أعمال ربع سنوية، وتخطيط للمخزون، ودعم تسويقي مشترك بين العلامات.
    - title: باقة الشهادات
      desc: وثائق امتثال كاملة تُرفق مع كل شحنة — إقرار CE، وتقارير الاختبار، وأوراق بيانات سلامة المواد.
      link: /contact
trust_resources:
  title: موارد موثوقة
  subtitle: نزّل ملف الشهادات وتقارير مراقبة الجودة ووثائق الامتثال لدينا.
  items:
    - title: محفظة الشهادات
      desc: شهادات CE، وISO 9001، وBSCI، وREACH، وRoHS، وAS 1799 في حزمة واحدة.
    - title: تقرير معايير اختبارات مراقبة الجودة
      desc: اختبارات الاحتفاظ بالضغط لمدة 24–48 ساعة، وتقادم الأشعة فوق البنفسجية وفق ISO، والتحقق من قوة الشد — منهجية متكاملة.
    - title: ملف المصنع وتقرير التدقيق
      desc: نظرة عامة على المنشأة البالغة مساحتها 12,000 م² مع صور خط الإنتاج وملخص تدقيق طرف ثالث.
    - title: وثيقة سياسة الضمان
      desc: شروط الضمان الكاملة، وعملية تقديم المطالبات، وتسعير قطع الغيار.
  cta_text: اطلب موارد الثقة
  cta_link: /contact
faqs_sup:
  title: أسئلة شائعة عن ألواح SUP
  subtitle: أسئلة شائعة حول ألواح التجديف الوقوف.
  columns: 2
  items:
    - title: ما أحجام ألواح SUP المتوفرة؟
      description: نقدم ألواح SUP من 9 قدم إلى 12 قدم، بما في ذلك التصاميم متعددة الاستخدامات والجولات واليوغا والتصاميم المتخصصة. تشمل موديلاتنا الأكثر مبيعاً Tropical Breeze (10 قدم) وOcean Voyager (11 قدم).
    - title: ما هو بناء الخياطة المتساقطة؟
      description: يستخدم بناء الخياطة المتساقطة آلاف الخيوط المصنوعة من البوليستر التي تربط الطبقتين العلوية والسفلية من اللوح، مما يسمح له بالاحتفاظ بضغط هواء عالٍ (15–20 PSI) وتحقيق منصة صلبة ومستقرة. هذا هو المعيار الصناعي لألواح SUP القابلة للنفخ الفاخرة.
    - title: ما حد الوزن لألواح SUP؟
      description: ألواح SUP لدينا تدعم حتى 150 كجم حسب الموديل والحجم. لوح Leviathan Wake هو موديلنا الأعلى سعة، مصمم للراكبين الأكبر حجماً واستخدام اليوغا.
    - title: هل تقدمون حزم SUP كاملة؟
      description: نعم. كل لوح SUP يُشحن مع حزمة كاملة تتضمن مجداف ألومنيوم ثلاثي القطع ومضخة ضغط عالي يدوية وحبل ربط ملفوف وحقيبة ظهر للسفر وطقم إصلاح. بعض الموديلات تتضمن أيضاً مجموعة زعانف قابلة للإزالة.
    - title: ما هو الضمان على ألواح SUP؟
      description: جميع ألواح SUP من أفارير تحمل ضمان سنة واحدة ضد عيوب التصنيع، بما في ذلك فشل اللحامات وعيوب الصمامات وانفصال المواد تحت الاستخدام العادي.
    - title: كم يستغرق نفخ لوح SUP؟
      description: باستخدام المضخة اليدوية المرفقة، يستغرق النفخ الكامل إلى 15 PSI حوالي 8–12 دقيقة. للنفخ الأسرع، نوصي بمضخة أفارير الكهربائية 12V، التي تنفخ اللوح في أقل من 4 دقائق.
faqs_materials:
  title: الأسئلة الشائعة حول مواد ألواح SUP والعناية بها
  subtitle: أسئلة شائعة حول مواد ألواح SUP القابلة للنفخ والعناية بها وتخزينها.
  columns: 2
  items:
    - title: ما المواد المستخدمة في ألواح SUP القابلة للنفخ من afarer؟
      description: نستخدم قماش PVC بمواصفات عسكرية (1100 دينير) ببنية مقاومة للتآكل ومثبتة ضد الأشعة فوق البنفسجية، ومتوافقة مع لائحتي REACH وRoHS الأوروبيتين.
    - title: كم تدوم ألواح SUP القابلة للنفخ؟
      description: مع العناية المناسبة، يدوم لوح SUP القابل للنفخ المصنوع من PVC الجيد من 5–10 سنوات. التنظيف المنتظم والحماية من الأشعة فوق البنفسجية والتخزين السليم يطيلان عمر الخدمة بشكل كبير.
    - title: ما الصيانة المطلوبة للوحة SUP القابلة للنفخ؟
      description: تشمل الصيانة الأساسية الشطف بالمياه العذبة بعد كل استخدام (خاصة في المياه المالحة)، والتجفيف قبل التخزين، وفحص صمامات الإغلاق سنوياً، وتجنب التعرض الطويل للشمس عند عدم الاستخدام.
    - title: هل يمكن استخدام ألواح SUP القابلة للنفخ في المياه المالحة؟
      description: نعم. جميع ألواح SUP القابلة للنفخ من afarer مصممة للاستخدام في المياه العذبة والمياه المالحة. ننصح بشطفها بالمياه العذبة وتجفيفها جيدًا بعد التعرض للمياه المالحة.
    - title: كيف أخزّن لوح SUP قابلًا للنفخ؟
      description: أفرغ الهواء ونظف اللوح وجففه تمامًا قبل التخزين. لفه بشكل مرتخٍ (تجنب الطيات الضيقة)، وخزنه في مكان بارد وجاف بعيدًا عن أشعة الشمس المباشرة، وأبقِه بعيدًا عن الأرضيات الخرسانية لمنع امتصاص الرطوبة.
    - title: ما هي سعة الوزن لألواح SUP القابلة للنفخ من afarer؟
      description: تتراوح سعة الوزن من 100 كجم لأصغر موديلاتنا إلى أكثر من 200 كجم للألواح الأكبر. وتذكر كل صفحة منتج الحد الأقصى للحمل للموديل الخاص بك.

hero:
  tagline: 'الشهادات والمعايير'
  title: 'شهادات الجودة<br />ومعايير الامتثال'
  subtitle: 'يتم تصنيع منتجات afarer وفقًا لمعايير السلامة البحرية الدولية وأنظمة إدارة الجودة واللوائح البيئية.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: afarer quality certifications and compliance documentation
content_certifications:
  tagline: 'الشهادات لدينا'
  title: 'جودة معتمدة،<br />معترف بها عالميًا'
  subtitle: 'يتم دعم كل منتج من منتجات afarer بشهادات تثبت التزامنا بالجودة والسلامة والمسؤولية البيئية.'
  items:
    - title: 'CE Certified'
      description: 'تتوافق جميع منتجات afarer مع متطلبات علامة CE الأوروبية للمركبات المائية الترفيهية، مما يضمن استيفاء معايير السلامة والصحة وحماية البيئة.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'نظام إدارة الجودة لدينا حاصل على شهادة ISO 9001:2015، ويغطي تصميم وتصنيع وتوزيع المركبات المائية القابلة للنفخ والمعدات البحرية.'
      icon: tabler:clipboard-check
    - title: 'UKCA Marked'
      description: 'تحمل المنتجات المباعة في سوق المملكة المتحدة علامة UKCA، مما يؤكد الامتثال للوائح المملكة المتحدة الخاصة بالمعدات البحرية والمراكب المائية الشخصية.'
      icon: tabler:shield
    - title: 'BSCI Compliant'
      description: 'afarer تم تدقيقها من قبل BSCI (مبادرة الامتثال الاجتماعي للأعمال)، مما يدل على ممارسات التصنيع الأخلاقية، وظروف العمل العادلة، ومسؤولية سلسلة التوريد.'
      icon: tabler:heart-handshake
    - title: 'REACH Compliant'
      description: 'تتوافق جميع المواد المستخدمة في منتجات afarer مع لوائح الاتحاد الأوروبي REACH للسلامة الكيميائية، مما يضمن عدم وجود مواد محظورة في PVC أو Hypalon أو المكونات.'
      icon: tabler:flask
    - title: 'Material Testing'
      description: 'يتم اختبار الأقمشة للتأكد من قوة الشد، ومقاومة التمزق، وتدهور الأشعة فوق البنفسجية، وأداء التشققات الباردة. يتم أخذ عينات من كل دفعة إنتاج والتحقق منها.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'معايير المصنع'
  title: 'التميز في التصنيع<br />—مصمم وفقًا للمواصفات'
  subtitle: 'تعمل منشأتنا التي تبلغ مساحتها 12000 متر مربع وفقًا لبروتوكولات صارمة لمراقبة الجودة في كل مرحلة من مراحل الإنتاج.'
  list:
    - 'Incoming Material Inspection: All raw materials —PVC fabric, Hypalon, aluminum, plywood, adhesives —are tested against specifications before entering production.'
    - 'In-Process Quality Control: Every production stage has documented QC checkpoints. Weld strength, seam alignment, valve installation, and fitting torque are verified inline.'
    - 'Pressure Testing: Every inflatable chamber is pressure-tested at 1.5× rated pressure for 24 hours. Leak rate must be zero for passing grade.'
    - 'Final Inspection: Completed products are inspected for dimensional accuracy, cosmetic finish, accessory completeness, and packaging integrity before shipping.'
    - 'Batch Traceability: Every product carries a serial number linked to production batch records, enabling full traceability from raw material to finished goods.'
content_safety:
  tagline: 'معايير السلامة البحرية'
  title: 'السلامة أولاً<br />—مصممة للتشغيل الموثوق'
  subtitle: 'تم تصميم واختبار منتجات afarer لتلبية معايير السلامة البحرية الدولية للاستخدام التجاري والترفيهي.'
  items:
    - title: 'ISO 6185'
      description: 'تتوافق القوارب القابلة للنفخ مع معايير ISO 6185 للبناء والاستقرار والطفو وقدرة الحمولة.'
      icon: tabler:sailboat
    - title: 'ABYC Standards'
      description: 'تتبع الأنظمة الكهربائية وأنظمة الوقود معايير ABYC (المجلس الأمريكي للقوارب واليخوت) للتركيب والتشغيل الآمن.'
      icon: tabler:bolt
    - title: 'SOLAS Compliance'
      description: 'تلبي معدات السلامة وأجهزة إنقاذ الحياة متطلبات SOLAS (سلامة الحياة في البحر) حيثما ينطبق ذلك.'
      icon: tabler:lifebuoy

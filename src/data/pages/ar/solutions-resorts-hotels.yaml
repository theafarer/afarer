packages:
  title: نظام باقات المنتجعات
  subtitle: اختر الحزمة التي تناسب طاقة استيعابك للضيوف وأهدافك من الإيرادات. تشمل جميع الحزم ضمانًا لمدة 12 شهرًا وشهادة CE.
  items:
    - name: حزمة البدء
      tagline: للمنتجعات البوتيكية، حتى 20 ضيفًا/يوم
      features:
        - 20 لوح SUP (3 أحجام للبالغين/الأطفال)
        - 20 مجدافًا (قابلة للتعديل) + 20 سترة نجاة
        - 4 مضخات مزدوجة الحركة (الكهربائية اختيارية)
        - 2 حامل تخزين + طقم إصلاح
        - طباعة شعار مخصص على الألواح
        - ضمان 12 شهرًا + معتمدة وفق CE
      revenue: إمكانية إيرادات سنوية تتراوح بين $50K–$80K
      cta_text: احصل على حزمة البدء
    - name: الباقة المميزة
      tagline: للمنتجعات الكبيرة، 50-100 ضيف/يوم
      features:
        - 50 لوح SUP (5 أحجام، أسطول مختلط)
        - 50 مجذافًا + 50 سترة نجاة
        - 10 مضخات مزدوجة الحركة + 2 مضخات كهربائية
        - 5 حوامل تخزين + 2 عربات
        - هوية علامة مخصصة كاملة (ألواح، مجاديف، حقائب)
        - جلسة تدريب للموظفين (عبر الإنترنت)
        - شحن قطع الغيار خلال 48 ساعة
        - ضمان 12 شهرًا + معتمدة وفق CE
      revenue: إمكانية إيرادات سنوية تتراوح بين 120 ألف و200 ألف دولار أو أكثر
      popular: true
      cta_text: احصل على الباقة المميزة
    - name: الباقة الرئيسية
      tagline: للمنتجعات الفاخرة للغاية، 100+ ضيف/يوم
      features:
        - 100+ لوح SUP (مجموعة أحجام كاملة)
        - طقم ملحقات كامل (مجاديف، سترات، مضخات، عربات)
        - تدريب الموظفين في الموقع (يومان)
        - مدير حساب مخصص
        - قطع غيار بديلة بأولوية قصوى (شحن خلال 24 ساعة)
        - هوية علامة مخصصة كاملة (ألواح + ملحقات)
        - حزمة صور وفيديوهات تسويقية
        - ضمان لمدة 24 شهرًا + معتمد CE
      revenue: إمكانية إيرادات سنوية تتجاوز 200 ألف دولار
      cta_text: احصل على الباقة الرئيسية
case_study:
  quote: منذ التحول إلى Afarer، ارتفعت إيرادات تأجير ألواح SUP لدينا بنسبة 40%، وانخفضت تكاليف استبدال الألواح بنسبة 60%، واسترددنا استثمارنا الكامل في الأسطول خلال 4 أشهر.
  author: مدير الأنشطة المائية
  location: منتجع 5 نجوم في جزر المالديف
  results:
    - label: نمو الإيرادات
      value: +40%
    - label: خفض التكاليف
      value: '-60%'
    - label: فترة استرداد الاستثمار
      value: 4 أشهر
features:
  title: لماذا تختار المنتجعات afarer
  subtitle: متانة بجودة تجارية، ولوجستيات عالمية، وشريك يفهم طبيعة قطاع الضيافة.
  items:
    - title: 500+ دورة تأجير
      description: كل لوح مُختبر ليتحمل أكثر من 500 دورة تأجير في المياه المالحة والشمس والرمال.
      icon: tabler:shield-check
    - title: شحن قطع الغيار خلال 48 ساعة
      description: تُشحن قطع الغيار البديلة خلال 48 ساعة — فلا تتوقف عائداتك من التأجير أبدًا.
      icon: tabler:truck-delivery
    - title: العلامة التجارية المخصصة
      description: توافق هوية منتجعك مع ألوان وشعار مخصصين على كل لوح.
      icon: tabler:palette
    - title: تدريب الموظفين
      description: برامج تدريب عبر الإنترنت وفي الموقع لفريق الأنشطة لديك.
      icon: tabler:school
    - title: الخدمات اللوجستية العالمية
      description: شحن إلى أكثر من 50 دولة مع خيارات شحن مجمعة.
      icon: tabler:world
    - title: معتمد CE
      description: جميع المعدات حاصلة على شهادة CE ومعيار ISO 9001:2015 — السلامة والجودة مضمونة.
      icon: tabler:certificate

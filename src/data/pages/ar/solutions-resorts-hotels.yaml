meta:
  title: حلول أساطيل SUP للمنتجعات | {SITE}
  description: حلول متكاملة لأساطيل ألواح SUP للمنتجعات والفنادق. ألواح بجودة تجارية، وعلامات تجارية مخصصة، وتدريب للموظفين، وباقات محسّنة للعائد على الاستثمار تبدأ من 20 وحتى أكثر من 100 لوح.
hero:
  tagline: المنتجعات والفنادق
  title: Create Premium Water Experiences<br />For Your Guests
  subtitle: Complete SUP fleet solutions for resorts, hotels, and waterfront destinations worldwide. One partner. One invoice. Zero hassle.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: ضيوف منتجع يستمتعون بركوب SUP على شاطئ بكر
roi_section:
  title: نموذج إيرادات ألواح SUP للمنتجعات
  subtitle: كيف تحقق المنتجعات دخلًا سنويًا من تأجير ألواح SUP يتراوح بين 50,000 و200,000+ دولار باستثمار واحد.
  metrics:
    - metric: $50K–$200K+
      label: إيرادات SUP السنوية
      detail: لكل منتجع، حسب حجم الأسطول ومعدل الإشغال
    - metric: 4–6 أشهر
      label: متوسط فترة استرداد رأس المال
      detail: استرداد كامل استثمار الأسطول خلال موسم واحد
    - metric: 40%
      label: زيادة الإيرادات
      detail: متوسط التحسّن بعد التحول إلى أساطيل afarer
    - metric: 500+
      label: دورات التأجير لكل لوح
      detail: متانة بجودة تجارية للاستخدام اليومي
packages:
  title: نظام باقات المنتجعات
  subtitle: Choose the package that fits your guest capacity and revenue goals.
  items:
    - name: Starter Package
      tagline: 'Best for: Boutique resorts, up to 20 guests/day'
      features:
        - 20 SUP boards (mixed sizes)
        - 20 paddles + 20 life vests
        - 4 dual-action pumps
        - 2 storage racks
        - 1 repair kit
        - ضمان 12 شهرًا + معتمدة وفق CE
      revenue: إمكانية إيرادات سنوية تتراوح بين $50K–$80K
      cta_text: احصل على حزمة البدء
    - name: Premium Package
      tagline: 'Best for: Large resorts, 50-100 guests/day'
      features:
        - 50 SUP boards (mixed sizes)
        - 50 مجذافًا + 50 سترة نجاة
        - 10 dual-action pumps
        - 5 storage racks / cart
        - 2 repair kits
        - Custom branding on all boards
        - Staff training session (online)
        - ضمان 12 شهرًا + معتمدة وفق CE
      revenue: إمكانية إيرادات سنوية تتراوح بين 120 ألف و200 ألف دولار أو أكثر
      popular: true
      cta_text: احصل على الباقة المميزة
    - name: Flagship Package
      tagline: 'Best for: Ultra-premium resorts, 100+ guests/day'
      features:
        - 100+ SUP boards
        - Complete accessory set
        - On-site staff training
        - مدير حساب مخصص
        - قطع غيار بديلة بأولوية قصوى (شحن خلال 24 ساعة)
        - Custom branding + logo
        - حزمة صور وفيديوهات تسويقية
        - ضمان لمدة 24 شهرًا + معتمد CE
      revenue: إمكانية إيرادات سنوية تتجاوز 200 ألف دولار
      cta_text: احصل على الباقة الرئيسية
case_study:
  quote: منذ التحول إلى Afarer، ارتفعت إيرادات تأجير ألواح SUP لدينا بنسبة 40%، وانخفضت تكاليف استبدال الألواح بنسبة 60%، واسترددنا استثمارنا الكامل في الأسطول خلال 4 أشهر.
  author: مدير الأنشطة المائية
  location: منتجع 5 نجوم في جزر المالديف
  results:
    - label: نمو الإيرادات
      value: +40%
    - label: خفض التكاليف
      value: '-60%'
    - label: فترة استرداد الاستثمار
      value: 4 أشهر
features:
  title: لماذا تختار المنتجعات afarer
  subtitle: متانة بجودة تجارية، ولوجستيات عالمية، وشريك يفهم طبيعة قطاع الضيافة.
  items:
    - title: 500+ دورة تأجير
      description: كل لوح مُختبر ليتحمل أكثر من 500 دورة تأجير في المياه المالحة والشمس والرمال.
      icon: tabler:shield-check
    - title: شحن قطع الغيار خلال 48 ساعة
      description: تُشحن قطع الغيار البديلة خلال 48 ساعة — فلا تتوقف عائداتك من التأجير أبدًا.
      icon: tabler:truck-delivery
    - title: العلامة التجارية المخصصة
      description: توافق هوية منتجعك مع ألوان وشعار مخصصين على كل لوح.
      icon: tabler:palette
    - title: تدريب الموظفين
      description: برامج تدريب عبر الإنترنت وفي الموقع لفريق الأنشطة لديك.
      icon: tabler:school
    - title: الخدمات اللوجستية العالمية
      description: شحن إلى أكثر من 50 دولة مع خيارات شحن مجمعة.
      icon: tabler:world
    - title: معتمد CE
      description: جميع المعدات حاصلة على شهادة CE ومعيار ISO 9001:2015 — السلامة والجودة مضمونة.
      icon: tabler:certificate

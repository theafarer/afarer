features3_reasons:
  tagline: لماذا تختار أفارير
  title: سبعة أسباب للشراكة معنا
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. التصنيع الحقيقي، وليس التداول
      description: نحن نمتلك وندير مصنعًا بمساحة 12000 متر مربع. عندما تتعاون مع شركة بعيدة، فإنك تعمل مباشرة مع الأشخاص الذين يقومون بتصميم منتجاتك وهندستها وبناءها - بدون وسطاء.
      icon: tabler:building-factory
    - title: 2. النهج الهندسي
      description: تبدأ عملية التصميم لدينا بحالة الاستخدام، وليس بفئة المنتج. نقوم بتحسين شكل الهيكل واختيار المواد والتكوين لكيفية استخدام القارب فعليًا.
      icon: tabler:engine
    - title: جودة معتمدة
      description: شهادة CE، نظام الجودة ISO، متوافق مع BSCI، متوافق مع REACH، معتمد من USCG. كل منتج يلبي المعايير الدولية، وليس مجرد ادعاءات.
      icon: tabler:certificate
    - title: 4. مرونة OEM/ODM
      description: ألوان الأنبوب، وتخطيط وحدة التحكم، والعلامات التجارية، والتعبئة والتغليف - نحن نخصصها وفقًا لمواصفاتك. لا يوجد حد أدنى لضغط الطلب. ابدأ بنموذج أولي، وتوسع بثقة.
      icon: tabler:adjustments
    - title: Roland LTD
      description: مستودع أمريكي في كاليفورنيا، شحن مباشر من تشينغداو، شحن جوي للطلبات العاجلة. نحن نتعامل مع الأوراق والوثائق الجمركية.
      icon: tabler:truck-delivery
    - title: 'دعم مدى الحياة. '
      description: نحن ندعم القوارب التي بنيناها منذ 20 عامًا. قطع الغيار الأصلية، والمشورة الفنية، وإرشادات الإصلاح - فريقنا متاح عندما تحتاج إلينا.
      icon: tabler:lifebuoy
    - title: 7. مواصفات صادقة
      description: تقييمات الحمولة الحقيقية، الأبعاد الحقيقية، الوزن الحقيقي. لا يوجد تضخم تسويقي. ما ننشره هو ما تحصل عليه، ويتم التحقق منه عن طريق اختبار مستقل.
      icon: tabler:ruler-measure
testimonials:
  tagline: موثوق به من قبل العلامات التجارية في جميع أنحاء العالم
  title: ماذا يقول شركاؤنا
  items:
    - content: لقد عملنا مع العديد من الشركات المصنعة في الصين، لكننا نتميز بدعمهم الهندسي وجودتهم المتسقة. إنهم يتعاملون مع علامتنا التجارية على أنها علامتهم التجارية.
      name: —OEM Partner, European Water Sports Brand
    - content: كانت هيبالون RIBs الخاصة بهم في الخدمة مع أسطولنا لأكثر من 5 سنوات. الحد الأدنى من الصيانة، ومقاومة ممتازة للأشعة فوق البنفسجية. يمنحنا الضمان لمدة 5 سنوات على الأنابيب الثقة.
      name: —Fleet Operator, Middle East Resort Group
    - content: ساعدنا فريق AFARER في تطوير تصميم لوحة دعم مخصصة من المفهوم إلى الإنتاج في 90 يومًا. الجودة فاقت توقعاتنا.
      name: —Distributor, Australian Watersports

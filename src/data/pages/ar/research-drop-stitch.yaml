  title: كيف تعمل تقنية Drop Stitch — الهندسة وراء النوى الصلبة القابلة للنفخ
  subtitle: 'مدة القراءة: 8 دقائق'
content_html: >
  <h2>ما هي تقنية Drop Stitch؟</h2>

  <p>تقنية Drop stitch (وتسمى أيضًا "قماش drop-stitch" أو "قلب drop-stitch") هي أسلوب بناء تتصل فيه آلاف الخيوط الفردية من البوليستر بين الطبقتين العلوية والسفلية من غلاف القماش. عند نفخ الغلاف، تعمل هذه الخيوط كعناصر شد داخلية — فهي تمنع انبعاج اللوحتين العلوية والسفلية للخارج بشكل دائري، مما يُبقي
  اللوحة مسطحة وصلبة.</p>

  <p>والنتيجة هيكل خفيف الوزن وسهل الحمل يتحمل ضغطًا داخليًا من 15 – 20 PSI — بصلابة قابلة للمقارنة بلوحات الهيكل الصلب، لكنه قابل للتفريغ بالكامل للتخزين والنقل.</p>


  <h2>كيف تعمل: الفيزياء</h2>

  <p>في الهياكل القابلة للنفخ التقليدية (مثل البالون أو المرتبة الهوائية)، يدفع ضغط الهواء الداخلي بالتساوي في جميع الاتجاهات. وبدون قيد داخلي، يصبح الهيكل أسطوانيًا أو كرويًا. تحل تقنية Drop stitch هذه المشكلة عبر إدخال تقوية شد:</p>

  <ul>
    <li>آلاف الخيوط تربط بين طبقتَي القماش العلوية والسفلية</li>
    <li>عند النفخ، يحاول ضغط الهواء دفع الطبقتين العلوية والسفلية بعيدًا عن بعضهما</li>
    <li>تقاوم الخيوط هذا الانفصال، محوّلة الحِمل إلى شد على طول محور الخيط</li>
    <li>والنتيجة لوحة مسطحة وصلبة تقاوم الانحناء</li>
  </ul>


  <h2>عملية التصنيع</h2>

  <ol>
    <li><strong>النسيج:</strong> تُنسج خيوط البوليستر في وقت واحد داخل طبقتين منفصلتين من القماش الأساسي (عادةً بوليستر مطلي بـ PVC بكثافة 1,100 DTEX أو 1,680 DTEX). وتُنسج الخيوط بشكل حلقي بين الطبقتين بزاوية 90&deg;.</li>
    <li><strong>الطلاء:</strong> يُطلى القماش الأساسي المنسوج بـ PVC (أو أحيانًا TPU) باستخدام عملية الطلاء بالسكين أو طلاء الكالندر. يعمل ذلك على إحكام غلق الخيوط وإنشاء غشاء محكم ضد الهواء.</li>
    <li><strong>ترابط الطبقات:</strong> يُربط قلب drop-stitch بالطبقات الخارجية المصفّحة (عادةً PVC بسمك 0.9 مم أو 1.2 مم) باستخدام التصفيح الحراري أو المواد اللاصقة.</li>
    <li><strong>اللحام:</strong> تُلحم أشرطة الحواف على طول الأطراف باستخدام اللحام بالهواء الساخن أو لحام RF أو اللحام عالي التردد لإنشاء الجدران الجانبية للوحة.</li>
    <li><strong>تركيب الصمامات:</strong> تُثبت صمامات Boston أو صمامات Halkey-Roberts، عادةً مع آلية لتنفيس الضغط لمنع النفخ الزائد.</li>
  </ol>


  <h2>مؤشرات الجودة الرئيسية</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">المعيار</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">المستوى الأساسي</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">الفاخر</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">كثافة الخيوط</td><td class="p-3 border">خيط واحد / بوصة مربعة</td><td class="p-3 border">خيطان / بوصة مربعة</td></tr>
      <tr><td class="p-3 border">القماش الأساسي</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">الضغط الأقصى</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">سماكة الـ PVC</td><td class="p-3 border">0.6 – 0.9 مم</td><td class="p-3 border">1.0 – 1.2 مم</td></tr>
      <tr><td class="p-3 border">بناء الحواف</td><td class="p-3 border">مطوي ومُلصق</td><td class="p-3 border">ملحوم ومترابط بالانصهار</td></tr>
    </tbody>
  </table>


  <h2>التطبيقات</h2>

  <ul>
    <li><strong>ألواح SUP:</strong> سماكة 4" – 6"، وضغط 15 – 20 PSI، و1 – 2 خيط/بوصة مربعة</li>
    <li><strong>الكاياك:</strong> أرضية drop-stitch + حجرات جانبية قابلة للنفخ، وأرضية بضغط 10 – 15 PSI</li>
    <li><strong>أرضيات RIB:</strong> أرضيات drop-stitch لقوارب RIB الخفيفة القابلة للطي، بضغط 12 – 18 PSI</li>
    <li><strong>حمايات القوارب:</strong> drop-stitch منخفض الضغط لحمايات مشكّلة بأسطح مسطحة</li>
  </ul>


  <h2>Drop Stitch مقابل السطح الهوائي (قلب من الألياف الزجاجية أو الخشب)</h2>

  <p>تستخدم الألواح ذات الهيكل الصلب قلوبًا من رغوة EPS مع تقوية من الألياف الزجاجية أو قضبان خشبية. فهي أخف وزنًا وأصلب وأكثر استجابة — لكن لا يمكن تفريغها من الهواء. تضحي تقنية Drop stitch ببعض الصلابة مقابل قابلية حمل كاملة. وبالنسبة لمعظم المستخدمين الترفيهيين، لا يمكن تمييز ألواح SUP الحديثة
  بتقنية drop-stitch عند ضغط 20 PSI عن الألواح الصلبة الأساسية من حيث الصلابة.</p>


  <h2>كيف تستخدم Afarer تقنية Drop Stitch</h2>

  <p>تستخدم Afarer قلب drop-stitch بكثافة 1,680 DTEX في جميع ألواحها SUP، مع خيطين لكل بوصة مربعة وتصفيح خارجي من PVC بسماكة 1.2 مم. الألواح مصممة حتى ضغط 20 PSI وتخضع لاختبار ثبات الضغط لمدة 24–48 ساعة عند 1.25 ضعف الضغط الاسمي قبل الشحن. تُلحم أشرطة الحواف بالهواء الساخن بدمج ثلاثي الطبقات، وتتوفر
  صمامات تنفيس الضغط بشكل قياسي في جميع الموديلات.</p>

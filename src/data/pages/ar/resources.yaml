hero_text:
  tagline: Resources
  title: 'مركز التنزيل وأدلة المشتري'
  subtitle: 'قم بالوصول إلى كتالوجات المنتجات وأدلة OEM وقوائم مراجعة المشتري والوثائق الفنية لمساعدتك في اتخاذ قرارات شراء مستنيرة.'
features3_downloads:
  tagline: Downloads
  title: 'وثائق المنتج وموارد المشتري<br />'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'مجموعة كاملة من المنتجات بما في ذلك قوارب SUP والقوارب القابلة للنفخ وألواح SUP وقوارب الكاياك والملحقات. المواصفات والتكوينات والخيارات. تنسيق PDF.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'كل ما تحتاج لمعرفته حول شراكات OEM/ODM: نظرة عامة على العملية، والحد الأدنى لكميات الطلب، وخيارات التخصيص، ومراقبة الجودة، والشحن.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'كيفية اختيار SUP المناسب: مواد الهيكل، ومواد الأنابيب، واختيار المحرك، واعتبارات الحجم، وخيارات التكوين لتطبيقات مختلفة.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'الاعتبارات الأساسية عند اختيار الشركة المصنعة للوحة SUP: مؤشرات الجودة، ومتطلبات الشهادة، واعتبارات موك، وما الذي يجب البحث عنه في تدقيق المصنع.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC vs Hypalon: مقارنة المتانة ومقاومة الأشعة فوق البنفسجية والعمر وخيارات الإصلاح واعتبارات التكلفة للتطبيقات البحرية المختلفة.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'قم بتنزيل قالب ملخص منتجاتنا. املأ متطلباتك وأعدها إلينا للحصول على عرض أسعار وتقييم الجدوى في نفس الأسبوع.'
      icon: tabler:template
faqs:
  title: 'الأسئلة المتداولة'
  subtitle: 'أسئلة شائعة حول منتجاتنا وعملية التصنيع ونموذج الشراكة.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'موك يختلف حسب فئة المنتج. تبدأ قوارب SUP عادةً من 10 وحدات لكل طراز. لوحات SUP من 50 وحدة. اتصل بفريق المبيعات لدينا للحصول على معلومات موك الخاصة بالمنتج.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'نعم. توفر شركة afarer عينة من الإنتاج للتقييم قبل الإنتاج الضخم. تكاليف العينة قابلة للتفاوض وغالبًا ما تُضاف إلى أمر الإنتاج الأول.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'الشروط القياسية هي 30% إيداع مع الطلب، 70% قبل الشحن. شروط خطاب الاعتماد متاحة للعملاء المؤهلين. اتصل بفريقنا المالي لمناقشة الترتيبات.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'المهل الزمنية النموذجية: القوارب SUP 30-45 يومًا، ألواح SUP 20-30 يومًا، القوارب القابلة للنفخ 25-35 يومًا. يضيف التطوير المخصص 15-30 يومًا للنماذج الأولية.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'شهادة CE لأسواق الاتحاد الأوروبي، والتصنيع المعتمد من خفر السواحل الأمريكي، ونظام الجودة ISO، والامتثال BSCI، والامتثال للمواد REACH.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'نعم. نحن نقدم تغليفًا مخصصًا بشعارك وألوانك وهوية علامتك التجارية. موك للتغليف المخصص يعتمد على فئة المنتج.'
      icon: tabler:color-swatch
cta:
  title: 'هل تحتاج إلى مساعدة في العثور على المورد المناسب؟'
  subtitle: 'اتصل بفريقنا للحصول على إرشادات شخصية حول اختيار المنتج أو شراكات OEM أو المواصفات الفنية.'
  actions:
    - variant: primary
      text: 'اتصل بفريقنا'
      href: /contact

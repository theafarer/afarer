meta:
  title: موارد وتنزيلات B2B | {SITE}
  description: حمّل أدلة التصنيع بنظام OEM، وكتالوجات المنتجات، وتقارير الجودة، وحاسبات العائد على الاستثمار ROI لشركات ألواح SUP القابلة للنفخ.
hero:
  tagline: مركز الموارد
  title: الأدوات والموارد<br />لشركاء أعمال SUP
  subtitle: حمّل أدلة OEM وكتالوجات المنتجات وتقارير الجودة، واستخدم حاسبة العائد على الاستثمار (ROI) لدينا لتخطيط استثمارك في أسطول SUP.
resources:
  - title: كتالوج منتجات OEM/ODM لعام 2026
    description: تشكيلة منتجات كاملة مع المواصفات ومستويات الأسعار والحد الأدنى لكمية الطلب (MOQ) وخيارات التخصيص لشركاء B2B.
    icon: tabler:file-text
    type: catalog
    link: /media
    cta: تنزيل الكتالوج
  - title: دليل العلامة التجارية الخاصة لألواح SUP
    description: دليل خطوة بخطوة لإطلاق علامتك التجارية الخاصة بألواح SUP — من أبحاث السوق والتصميم إلى الإنتاج والتسليم العالمي.
    icon: tabler:book
    type: guide
    link: /news/private-label-sup-oem-guide
    cta: اقرأ الدليل
  - title: حاسبة العائد على الاستثمار لأسطول ألواح SUP
    description: قدّر استثمار أسطول SUP لمنتجعك أو ناديك، والإيرادات المتوقعة، وفترة استرداد رأس المال باستخدام الحاسبة التفاعلية.
    icon: tabler:calculator
    type: tool
    link: '#roi-calculator'
    cta: احسب العائد على الاستثمار
  - title: تقرير الجودة والشهادات
    description: وثائق شهادة CE، وإدارة الجودة وفق ISO 9001، ونتائج اختبارات التقادم بالأشعة فوق البنفسجية UV، وبيانات اختبارات ثبات الضغط.
    icon: tabler:certificate
    type: report
    link: /evidence
    cta: عرض التقارير
  - title: كتيب قدرات المصنع
    description: جولة افتراضية في منشأة التصنيع البالغة مساحتها 12,000 م² مع تفاصيل خط الإنتاج وعمليات مراقبة الجودة.
    icon: tabler:building-factory
    type: brochure
    link: /factory
    cta: جولة في المصنع
  - title: دليل إيرادات أساطيل المنتجعات
    description: تحليل العائد على الاستثمار لأسطول ألواح SUP التجاري مع نماذج تسعير ومعدلات استخدام ونتائج حقيقية من دراسات حالة لمنتجعات خمس نجوم.
    icon: tabler:chart-bar
    type: guide
    link: /news/commercial-sup-fleet-roi-resorts
    cta: اقرأ الدليل

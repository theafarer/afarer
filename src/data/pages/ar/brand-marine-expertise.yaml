meta:
  title: 'الخبرة البحرية — هندسة في كل هيكل | {SITE}'
  description: 'عقود من الهندسة البحرية في كل هيكل. afarer تتقن بناء drop stitch، وPVC البحري، والتصميم الاحترافي لألواح SUP القابلة للنفخ.'
  keywords:
    - 'الهندسة البحرية'
    - 'مصنّع ألواح SUP القابلة للنفخ'
    - 'إنتاج ألواح التجديف'
hero:
  tagline: الخبرة البحرية
  title: عقود من الهندسة البحرية<br />في كل هيكل
  subtitle: تجمع شركة afarer بين علوم المواد العميقة والتصنيع الدقيق والاختبارات الواقعية لإنتاج مركبات مائية تعمل عندما يكون ذلك مهمًا.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: فريق الهندسة البحرية والبحث والتطوير في العمل
expertise_materials:
  tagline: علم المواد
  title: اختيار المادة المناسبة<br />لكل تطبيق
  subtitle: نحن نعمل باستخدام مادتين أساسيتين - تم اختيار كل منها لحالات استخدام ومتطلبات أداء محددة.
  columns: 3
  items:
    - title: بولي كلوريد الفينيل من الدرجة البحرية
      description: قماش PVC بسماكة 1100 دنيير — أكثر موادنا تنوعاً. مستقر ضد الأشعة فوق البنفسجية، مقاوم للاحتكاك، ومتوافق مع لوائح REACH. مثالي لألواح SUP حيث يكون الوزن وكفاءة التكلفة أمرين مهمين.
      icon: tabler:droplet
    - title: الألياف الزجاجية والبولي إيثيلين
      description: ألواح SUP مركّبة بالألياف الزجاجية لصلابة وانزلاق فائقين. بولي إيثيلين مصبوب بالدوران للاستخدام الثقيل في التأجير والإنقاذ بما يتطلب أقصى مقاومة للصدمات.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: قدرات التصنيع
  title: التصنيع الدقيق<br />في كل خطوة
  subtitle: منشأتنا التي تبلغ مساحتها 12000 متر مربع مجهزة بآلات متخصصة لكل مرحلة من مراحل الإنتاج.
  columns: 2
  items:
    - title: قطع المواسير بنظام التحكم الرقمي الحاسوبي
      description: يضمن القطع الذي يتم التحكم فيه بواسطة الكمبيوتر ألواح قماشية دقيقة وقابلة للتكرار مع الحد الأدنى من النفايات. كل قطعة تناسب تمامًا التصميم.
      icon: tabler:cpu
    - title: اللحام عالي التردد
      description: اللحام الصناعي عالي التردد يخلق طبقات أقوى من المادة الأساسية. يضمن التحكم المتسق في درجة الحرارة والضغط وجود أختام محكمة الغلق في كل عملية إنتاج.
      icon: tabler:bolt
    - title: التجميع الأساسي للغرزة الساقطة
      description: تربط الآلاف من خيوط البوليستر طبقات القماش العلوية والسفلية، مما يسمح بالنفخ عالي الضغط (15-20 رطل لكل بوصة مربعة) من أجل ألواح وأرضيات SUP صلبة ومستقرة.
      icon: tabler:building-arch
    - title: اختبار الضغط
      description: يتم اختبار الضغط على كل منتج قابل للنفخ قبل الشحن. يتم اختبار أنابيب SUP عند ضغط مقدر بمقدار 1.25x - إذا ثبتت هناك، فسوف تعمل على الماء.
      icon: tabler:wind
    - title: 'اختبار القوة '
      description: تخضع العينات العشوائية من كل دفعة إنتاج لاختبارات قوة التماس المدمرة. يتم تسجيل النتائج ويمكن إرجاعها إلى عمليات إنتاج محددة.
      icon: tabler:files
    - title: اختبار المياه
      description: يخضع كل نموذج SUP لتجارب بحرية قبل الاعتماد. يتحقق الاختبار الواقعي في الظروف الساحلية من صحة الأداء والتعامل والاستقرار.
      icon: tabler:droplet
expertise_design:
  tagline: التصميم والهندسة
  title: مصممة للظروف الحقيقية
  subtitle: تبدأ فلسفتنا في التصميم بكيفية استخدام اللوح، ثم نبني الهندسة حول حالة الاستخدام هذه.
  items:
    - title: تصميم هيكل عالي الأداء
      description: يتم ضبط شكل كل هيكل لحالة استخدامه — أنوف إزاحة لانزلاق الجولات، وزيادة التقوس لرشاقة الأمواج، وملامح مسطحة مستقرة للصيد واليوغا.
    - title: السلامة بتقنية الغرزة الساقطة
      description: يتميز كل لوح بنواة صلبة بتقنية دروب ستيتش مع جوانب معززة. إذا تضرر جزء، تحافظ بنية دروب ستيتش عالية الشد على استمرار عمل اللوح.
    - title: تخطيط سطح مريح
      description: تم تصميم تقسيم وسادة السطح، وموضع مقبض الحمل، ونقاط التركيب حول راحة الراكب أثناء الاستخدام الممتد — سواء في الجولات أو الصيد أو الدوريات.
    - title: تكوين مخصّص
      description: ألوان الجوانب، وتكوين وسادة السطح، وحوامل الملحقات، وسعة المعدات - يمكن تخصيص كل طراز ليتوافق مع متطلبات التشغيل المحددة.

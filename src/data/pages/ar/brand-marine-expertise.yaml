hero:
  tagline: الخبرة البحرية
  title: عقود من الهندسة البحرية<br />في كل هيكل
  subtitle: تجمع شركة afarer بين علوم المواد العميقة والتصنيع الدقيق والاختبارات الواقعية لإنتاج مركبات مائية تعمل عندما يكون ذلك مهمًا.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: فريق الهندسة البحرية والبحث والتطوير في العمل
expertise_materials:
  tagline: علم المواد
  title: اختيار المادة المناسبة<br />لكل تطبيق
  subtitle: نحن نعمل باستخدام ثلاث مواد أساسية - تم اختيار كل منها لحالات استخدام ومتطلبات أداء محددة.
  columns: 3
  items:
    - title: بولي كلوريد الفينيل من الدرجة البحرية
      description: 1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.
      icon: tabler:droplet
    - title: هيبالون بريميوم/CSM
      description: مقاومة كيميائية متفوقة واستقرار للأشعة فوق البنفسجية. يمكن لقوارب الهيبالون أن تدوم من 15 إلى 20 عامًا مع العناية المناسبة. يوصى به للتطبيقات التجارية والإنقاذية والعسكرية حيث تكون المتانة على المدى الطويل أمرًا بالغ الأهمية.
      icon: tabler:shield
    - title: الألياف الزجاجية والألومنيوم
      description: هياكل الألياف الزجاجية العميقة على شكل حرف V للأضلاع وزوارق الدورية - أداء تقطيع الأمواج في الظروف القاسية. هياكل من الألومنيوم لقوارب العمل التجارية الثقيلة التي تتطلب أقصى قدر من القوة وقدرة التحميل.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: قدرات التصنيع
  title: التصنيع الدقيق<br />في كل خطوة
  subtitle: منشأتنا التي تبلغ مساحتها 12000 متر مربع مجهزة بآلات متخصصة لكل مرحلة من مراحل الإنتاج.
  columns: 2
  items:
    - title: قطع المواسير بنظام التحكم الرقمي الحاسوبي
      description: يضمن القطع الذي يتم التحكم فيه بواسطة الكمبيوتر ألواح قماشية دقيقة وقابلة للتكرار مع الحد الأدنى من النفايات. كل قطعة تناسب تمامًا التصميم.
      icon: tabler:cpu
    - title: اللحام عالي التردد
      description: اللحام الصناعي عالي التردد يخلق طبقات أقوى من المادة الأساسية. يضمن التحكم المتسق في درجة الحرارة والضغط وجود أختام محكمة الغلق في كل عملية إنتاج.
      icon: tabler:bolt
    - title: التجميع الأساسي للغرزة الساقطة
      description: تربط الآلاف من خيوط البوليستر طبقات القماش العلوية والسفلية، مما يسمح بالنفخ عالي الضغط (15-20 رطل لكل بوصة مربعة) من أجل ألواح وأرضيات SUP صلبة ومستقرة.
      icon: tabler:building-arch
    - title: اختبار الضغط
      description: يتم اختبار الضغط على كل منتج قابل للنفخ قبل الشحن. يتم اختبار أنابيب SUP عند ضغط مقدر بمقدار 1.5x - إذا ثبتت هناك، فسوف تعمل على الماء.
      icon: tabler:wind
    - title: 'اختبار القوة '
      description: تخضع العينات العشوائية من كل دفعة إنتاج لاختبارات قوة التماس المدمرة. يتم تسجيل النتائج ويمكن إرجاعها إلى عمليات إنتاج محددة.
      icon: tabler:files
    - title: اختبار المياه
      description: يخضع كل نموذج SUP لتجارب بحرية قبل الاعتماد. يتحقق الاختبار الواقعي في الظروف الساحلية من صحة الأداء والتعامل والاستقرار.
      icon: tabler:droplet
expertise_design:
  tagline: التصميم والهندسة
  title: مصممة للظروف الحقيقية
  subtitle: تبدأ فلسفتنا في التصميم بكيفية استخدام القارب، ثم نبني الهندسة حول حالة الاستخدام هذه.
  items:
    - title: تصميم بدن ديب في
      description: تتميز هياكل الألياف الزجاجية لدينا بزوايا ارتفاع مميتة محسوبة محسنة لطول كل طراز والاستخدام المقصود. أكثر انحدارًا V لأداء المياه الخام، وأقل ضحالة للاستقرار.
    - title: السلامة متعددة الغرف
      description: يحتوي كل قارب على 3-7 غرف هوائية مستقلة. إذا تم اختراق حجرة واحدة، فإن الغرف المتبقية تبقي القارب واقفا على قدميه وجاهزا للعمل.
    - title: تصميم مريح
      description: تم تصميم موضع وحدة التحكم وارتفاع الأنبوب وموضع المقعد بما يضمن راحة المشغل أثناء الاستخدام الممتد — سواءً في الدوريات أو صيد الأسماك أو النقل.
    - title: تكوين مخصّص
      description: ألوان الأنبوب، وتكوين وحدة التحكم، وسعة الوقود، وحوامل الملحقات - يمكن تخصيص كل طراز ليتوافق مع متطلبات التشغيل المحددة.

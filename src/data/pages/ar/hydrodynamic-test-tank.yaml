  title: خزان الاختبار الهيدروديناميكي
  subtitle: التحقق من الأداء قبل بناء النموذج الأولي الأول كامل الحجم
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: اختبار أداء خزان الاختبار الهيدروديناميكي لدى Afarer
intro: >-
  من المفاهيم الخاطئة الشائعة أن اختبار الديناميكا المائية يقتصر على السفن العابرة للمحيطات. في الواقع، يعتمد أداء الهيكل الصغير المنزلق —مثل قارب RIB بطول 4–6 م—على شكله المغمور تحت الماء تمامًا كما يعتمد أداء الناقلة على مقدمتها الكروية. فزاوية الارتفاع، ومساحة السطح المبتل، وتوليد الرذاذ،
  والتهوية، جميعها تؤثر بشكل كبير على السرعة واستهلاك الوقود وراحة الركوب. في {SITE.name}، نشغّل حوض اختبار مخصصًا للديناميكا المائية يتيح لنا قياس هذه التأثيرات على النموذج المصغّر —قبل استثمار المعدن والقماش في نموذج أولي بالحجم الكامل.
content_html: >-
  <h2>لماذا نختبر قارباً صغيراً في خزان الجر؟</h2>

  <p>يمنحنا الاختبار على مقياس النموذج (عادة من 1:3 إلى 1:5) القدرة على تطوير أشكال الهياكل بسرعة وبتكلفة فعالة. أسبوع واحد في الخزان يمكن أن ينتج بيانات أداء تتطلب أشهراً من التجربة والخطأ على الحجم الكامل — وبجزء يسير من التكلفة.</p>


  <h2>مواصفات المنشأة</h2>

  <table>
    <thead><tr><th>البند</th><th>المواصفة</th></tr></thead>
    <tbody>
      <tr><td>أبعاد الخزان</td><td>35 م (الطول) × 3.5 م (العرض) × 1.8 م (العمق)</td></tr>
      <tr><td>عربة السحب</td><td>تعمل بمحرك سيرفو كهربائي، سرعة قصوى 12 م/ث (23 عقدة)، دقة السرعة ± 0.5%</td></tr>
      <tr><td>مولّد الأمواج</td><td>من النوع اللوحي، بحالات بحر منتظمة وغير منتظمة قابلة للبرمجة، بارتفاع موجي كبير Hs يصل إلى 0.3 م على مقياس النموذج</td></tr>
      <tr><td>أجهزة القياس</td><td>مقياس قوى بستة مكونات (المقاومة، القوة الجانبية، عزم الانعراج)، ومقاييس تسارع، ومقاييس ميلان، ومجسات أمواج</td></tr>
      <tr><td>جمع البيانات</td><td>أخذ عينات بمعدل 1000 هرتز لكل قناة، وعرض فوري + مجموعة برامج للمعالجة اللاحقة</td></tr>
      <tr><td>تصنيع النماذج</td><td>تفريز CNC وطباعة ثلاثية الأبعاد داخل المنشأة لهياكل نموذجية يصل طولها الإجمالي إلى 1.8 م</td></tr>
    </tbody>
  </table>


  <h2>برنامج الاختبارات لدينا</h2>

  <p>يتبع برنامج تطوير الهيكل القياسي في خزاننا هذا التسلسل:</p>

  <ol>
    <li><strong>بناء النموذج</strong> — يُشغَّل نموذج بمقياس 1:3.5 آلياً بواسطة CNC من رغوة عالية الكثافة ويُغطى بالألياف الزجاجية لتحقيق الصلابة. وتُعدَّل الوزن ومركز الثقل (CG) لمطابقة حالة الحمولة الكاملة المقيّسة بطريقة فرويد.</li>
    <li><strong>جولات قياس المقاومة</strong> — يُجر النموذج عند 8-10 سرعات تغطي نطاق التشغيل. تُقاس المقاومة الكلية وتُحلل إلى مكونات الاحتكاك والمقاومة المتبقية باستخدام طريقة ITTC-1957.</li>
    <li><strong>قياس الميلان والغاطس</strong> — تُسجل زاوية الميلان والغاطس أثناء الجري عند كل سرعة. والهدف هو زاوية ميلان مثالية تتراوح بين 4-6° للهياكل الانزلاقية.</li>
    <li><strong>مسح الأثر الموجي</strong> — تُقاس مقاطع الأمواج العرضية عند سرعتين لتقييم مقاومة صنع الأمواج وتحديد تفاعلات الأمواج العرضية التي قد تسبب تداخلاً عند المؤخرة.</li>
    <li><strong>الإبحار في البحر الهائج (اختياري)</strong> — جولات في أمواج متجهة ومؤخرة منتظمة لقياس المقاومة الإضافية والتسارع الرأسي واحتمالية الصدم الموجي.</li>
    <li><strong>تحليل البيانات والتوصيات</strong> — يُسلَّم تقرير كامل مع مخططات مقارنة ومنحنيات سرعة/قدرة وتوصيات تصميمية محددة لهيكل الحجم الكامل.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">نتائج نموذجية لاختبارات الخزان — المقاومة مقابل السرعة (هيكل RIB 450، بمقياس 1:3.5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">المقاومة على مقياس النموذج (N) عند سرعات مقيّسة بطريقة فرويد. يعتمد التنبؤ بالقدرة على الحجم الكامل على طريقة التنبؤ بالأداء ITTC-1978.</p>
  </div>


  <h2>فريق الخبراء</h2>

  <p>يشرف على تشغيل خزاننا أخصائي هيدروديناميكا حاصل على دكتوراه في الهندسة البحرية ولديه 8 سنوات من الخبرة في خزانات الجر في معهد بحري أوروبي كبير. يساعده فني يجهز جميع النماذج والأجهزة. يتبع الفريق الإجراءات الموصى بها من ITTC (المؤتمر الدولي لخزانات الجر) لضمان أن كل اختبار قابل للتكرار والتتبع
  والدفاع عنه دولياً.</p>


  <h2>اختبارات الخزان لتطوير هياكل مخصصة</h2>

  <p>لا يُستخدم خزاننا للهياكل المصممة داخلياً فحسب — بل ننفذ بانتظام برامج اختبار للعملاء الراغبين في التحقق من شكل هيكل مخصص أو فحص مشكلة أداء:</p>

  <ul>
    <li><strong>مقارنة أشكال الهياكل</strong> — اختبار شكلين أو أكثر من أشكال الهياكل المرشحة في ظروف متطابقة، بما يوفر مقارنة موضوعية للسحب/السرعة/الاستقرار لدعم اختيارك التصميمي.</li>
    <li><strong>تحسين الملحقات</strong> — يمكن اختبار الألواح المعترضة وأقواس الرش والمثبتات العارضة والشرائح الطولية في تهيئات مختلفة لتحديد إسهام كل منها في تقليل السحب.</li>
    <li><strong>دراسة مطابقة المحرك</strong> — تُحوَّل بيانات المقاومة إلى منحنى تنبؤ بالقدرة، ما يتيح لك اختيار القوة الحصانية المثلى للمحرك بما يناسب سرعتك المستهدفة وحمولتك.</li>
  </ul>


  <h2>لماذا تختبر معنا؟</h2>

  <p>لا نقدم لك مجرد مجموعة أرقام خام. تترجم تقاريرنا بيانات الخزان إلى توصيات هندسية قابلة للتنفيذ: «ارفع قوس الرش بمقدار 8 مم لتقليل السطح المبلل عند سرعة الإبحار»، أو «زد ارتفاع القاع عند المؤخرة بمقدار 3° لتقليل تسارع الصدم الموجي»، أو «انقل مركز الثقل الطولي 150 مم نحو المؤخرة لتحسين وضعية
  الانزلاق». تغادر ولديك فهم واضح لما يجب تغييره ولماذا.</p>

  <p>خزاننا متاح أيضاً للاختبارات المستقلة من أطراف ثالثة مقابل رسوم خدمات. إذا كنت تطور هيكلاً وتريد تقييماً هيدروديناميكياً محايداً ومنفذاً باحترافية، فنحن نرحب باستفسارك.</p>

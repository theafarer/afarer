  tagline: قصتنا
  title: afarer —هندسة الحرية على الماء
  subtitle: 'من ورشة ساحلية إلى شركة تصنيع بحرية عالمية —رحلتنا مبنية على إيمان راسخ: يجب أن تُصمم القوارب كما لو كانت مهمة، لأنها كذلك.'

timeline:
  - year: '2012'
    title: تأسيس التصنيع البحري
    body: بدأت afarer كورشة متخصصة في القوارب القابلة للنفخ في تشينغداو، الصين، ملتزمة بالحرفية البحرية وتصنيع القوارب المطاطية. كان التركيز المبكر على بناء منتجات قابلة للنفخ موثوقة من خلال الخبرة الهندسية العملية والانضباط التصنيعي.
  - year: '2015'
    title: أول تصدير وشهادة CE
    body: وصلت أول طلبات التصدير إلى اليابان وكوريا. تم الحصول على شهادة CE لخطوط المنتجات الأساسية، مما يمثل دخول afarer إلى الأسواق الدولية. بدأت الشركة في خدمة المستخدمين التجاريين والترفيهيين خارج الصين.
  - year: '2018'
    title: توسعة المصنع
    body: الانتقال إلى منشأة إنتاج بمساحة 12,000 ?². إضافة خطوط لحام RF وطاقات إنتاج دروب ستيتش، مما مكن من التصنيع على نطاق أوسع وتحسين أنظمة مراقبة الجودة.
  - year: '2020'
    title: إنشاء مركز البحث والتطوير
    body: افتتاح مركز بحث وتطوير متخصص يضم مختبر أقمشة PVC وحوض اختبار هيدروديناميكي واستوديو محاكاة CAD/FEA. توسع تطوير المنتجات للتركيز على البناء خفيف الوزن وتحسين المتانة والتصميم المتمحور حول المستخدم.
  - year: '2022'
    title: الشهادات والنمو العالمي
    body: الحصول على شهادة ISO 9001. التوسع إلى 14 مهندس بحث وتطوير وأكثر من 200 عامل. وصلت المنتجات إلى عملاء عبر أوروبا والأمريكتين وآسيا والمحيط الهادئ من خلال شراكات الموزعين وOEM.
  - year: '2024'
    title: استوديو الابتكار والتصميم
    body: إطلاق استوديو تصميم وابتكار متكامل الخدمات لمشاريع ODM المخصصة، من المفهوم إلى الإنتاج. تعزيز التطبيقات البحرية المهنية بما في ذلك المناقصات الإنقاذية والتجارية والحكومية.
  - year: '2026'
    title: بناء مستقبل استكشاف المياه
    body: اليوم، تواصل afarer تطوير القوارب القابلة للنفخ وأنظمة SUP والحلول البحرية المخصصة —لربط الأشخاص والمؤسسات بمياه العالم. أكثر من 50 دولة تمت خدمتها، وطاقة إنتاجية سنوية تزيد عن 15,000 وحدة.
content_founding:
  tagline: البداية
  title: وُلِدت على الواجهة المائية
  subtitle: 'بدأت afarer في ورشة ساحلية في تشينغداو بقارب واحد ورؤية: بناء قوارب قابلة للنفخ تتحمل الظروف البحرية الحقيقية.'
  paragraphs:
    - في عام 2012، رأى مؤسسونا فجوة في السوق —معظم القوارب القابلة للنفخ كانت إما ميسورة التكلفة ولكن غير موثوقة، أو عالية الجودة ولكن باهظة الثمن. كانوا يعتقدون أن هناك مجالًا لشركة تصنيع تقدم الجودة والقيمة معًا.
    - تم بناء أول هيكل يدويًا، واختباره في المياه المحلية، وتحسينه بناءً على ملاحظات حقيقية من الصيادين والمشغلين التجاريين الصغار. لا تزال حلقة التغذية الراجعة هذه —بناء، اختبار، استماع، تحسين —في صميم فلسفتنا الهندسية اليوم.
    - بحلول عام 2015، انتشرت السمعة خارج تشينغداو. بدأ الموزعون الدوليون في طلب عينات. ما بدأ كورشة محلية أصبح مورّدًا عالميًا.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: ورشة إنتاج afarer المبكرة وعملية التصنيع
content_growth:
  tagline: النمو والابتكار
  title: من ورشة إلى منشأة بمساحة 12,000 ?²
  subtitle: الاستثمار المستمر في الأشخاص والمعدات والعمليات حول afarer إلى منشأة تصنيع بحرية حديثة.
  paragraphs:
    - مع تزايد الطلب، توسعت منشأتنا. انتقلنا من ورشة صغيرة إلى مصنع مساحته 12,000 ?² مع خطوط إنتاج مخصصة لقوارب SUP والقوارب القابلة للنفخ وألواح SUP والإكسسوارات.
    - استثمرنا في آلات القطع CNC ومعدات اللحام عالية التردد وخطوط إنتاج دروب ستيتش ومنصات الاختبار الشاملة —مما يسمح لنا بالتحكم في كل جانب من جوانب جودة الإنتاج.
    - اليوم، يضم فريقنا المكون من أكثر من 200 شخص مهندسين بحريين وعلماء مواد ومتخصصي مراقبة جودة وحرفيين مهرة —كثير منهم مع afarer منذ الأيام الأولى.
philosophy:
  tagline: فلسفة العلامة التجارية
  title: هندسة الحرية على الماء
  body: الحرية على الماء ليست فقط حول الحركة. إنها تمثل اكتشاف أماكن جديدة، وخلق تجارب في الهواء الطلق، وربط الناس بالطبيعة، وتمكين المهام المهنية. الهندسة تجعل تلك الحرية ممكنة.
  pillars:
    - title: الموثوقية أولاً
      body: البيئات المائية تتطلب الثقة. منتجات afarer مصممة حول الاستقرار والمتانة والسلامة والأداء المتسق.
    - title: التصميم المتمحور حول الإنسان
      body: يجب أن تخدم المنتجات الناس، لا التكنولوجيا. كل قرار تصميم يبدأ بفهم كيفية استخدام الناس للقوارب، وأين يستكشفون، وما التحديات التي يواجهونها.
    - title: الاستكشاف المتاح
      body: لا ينبغي أن تكون المياه مخصصة للخبراء فقط. تصنع afarer معدات تسمح لمزيد من الناس بتجربة الأنهار والبحيرات والمحيطات والبيئات الساحلية بأمان.
    - title: الابتكار المستمر
      body: الابتكار ليس فقط إنشاء منتجات جديدة. إنه تحسين كل تفصيل —المواد والهياكل والتصنيع وتجربة المستخدم.
engineeringDna:
  tagline: الحمض النووي الهندسي
  title: كيف تصنع afarer المنتجات
  areas:
    - title: علم المواد
      body: تركز afarer على اختيار المواد المناسبة للبيئات البحرية المختلفة. تشمل الاعتبارات الرئيسية مقاومة التآكل، ومقاومة الأشعة فوق البنفسجية، وثبات الضغط، والمتانة طويلة الأمد.
      items:
        - مقاومة التآكل
        - مقاومة الأشعة فوق البنفسجية
        - ثبات الضغط
        - متانة طويلة الأمد
    - title: الهندسة الهيكلية
      body: تتطلب القوارب القابلة للنفخ توازنًا دقيقًا بين الصلابة والوزن وقابلية النقل والاستقرار. تركز هندسة afarer على تحسين هذه العوامل من خلال تقنية نواة دروب ستيتش وبناء اللحامات المتقدم.
      items:
        - الصلابة
        - تحسين الوزن
        - قابلية النقل
        - الاستقرار
    - title: دقة التصنيع
      body: 'كل منتج يمر عبر عمليات مراقبة: تحضير المواد، القطع الدقيق، اللحام والربط، التجميع، فحص الجودة، والتحقق من الأداء.'
      items:
        - تحضير المواد
        - القطع الدقيق
        - اللحام والربط
        - التجميع ومراقبة الجودة
    - title: هندسة سيناريوهات المستخدم
      body: يتم تطوير المنتجات حول التطبيقات الحقيقية —الترفيه والمغامرة والاستخدام المهني —مما يضمن أن كل تصميم يلبي المتطلبات المحددة لبيئته المقصودة.
      items:
        - ترفيه
        - مغامرة
        - مهني
        - تجاري

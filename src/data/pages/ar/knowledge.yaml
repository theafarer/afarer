hero:
  tagline: 'مخطط المعرفة'
  title: 'معرفة استكشاف المياه'
  subtitle: |
    قاعدة معرفية منظمة تغطي تقنية SUP القابلة للنفخ،<br />
    السلامة المائية، هندسة القوارب، وتخطيط المغامرات.
  taglineSection: 'استكشف. تعلم. انطلق بثقة.'

clusters:
  tagline: 'مجموعات المعرفة'
  title: 'استكشف حسب الموضوع'
  subtitle: 'غوص عميق في التكنولوجيا والسلامة والمهارات وراء كل منتج من أكوافارير.'
  items:
    - title: 'معرفة SUP'
      description: 'من اختيار أول لوح لك إلى تقنيات الجولات المتقدمة —كل شيء عن التجديف الوقوف.'
      icon: 'tabler:lifebuoy'
      topics:
        - 'كيف تختار أول SUP قابل للنفخ لك'
        - 'أفضل حجم SUP للمبتدئين'
        - 'ما مدى صعوبة التجديف الوقوف؟'
        - 'مقارنة القابل للنفخ مقابل اللوح الصلب'
        - 'قائمة فحص سلامة SUP'
    - title: 'معرفة القوارب'
      description: 'أدلة تقنية عن القوارب القابلة للنفخ وRIB والقوارب الصغيرة والكاياك —الهندسة والمواد والتشغيل.'
      icon: 'tabler:sailboat'
      topics:
        - 'أنواع القوارب القابلة للنفخ موضحة'
        - 'مقارنة PVC مقابل Hypalon'
        - 'مقارنة SUP مقابل القارب الصغير'
        - 'غوص عميق في تقنية الخياطة المتساقطة'
        - 'دليل علم المواد البحرية'
    - title: 'معرفة السلامة'
      description: 'معرفة سلامة أساسية لكل مجداف —من اختيار سترة النجاة إلى قراءة الطقس إلى تقنيات الإنقاذ الذاتي.'
      icon: 'tabler:shield'
      topics:
        - 'قائمة فحص سلامة SUP'
        - 'هل تحتاج سترة نجاة؟'
        - 'دليل سلامة التجديف في المحيط'
        - 'سلامة الأنهار لقوارب الكاياك القابلة للنفخ'
        - 'الوعي بالطقس وظروف المياه'
    - title: 'التكنولوجيا'
      description: 'الهندسة وراء منتجات أكوافارير —المواد وطرق البناء واختبار الجودة.'
      icon: 'tabler:microscope'
      topics:
        - 'تقنية PVC البحرية'
        - 'شرح الخياطة المتساقطة'
        - 'لماذا PSI مهم لـ SUP القابل للنفخ'
        - 'لحام RF مقابل الربط اللاصق'
        - 'اختبار الجودة والشهادات'


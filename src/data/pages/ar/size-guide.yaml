how_to_choose:
  title: كيفية اختيار المقاس المناسب
  cards:
    - title: ألواح SUP
      description: اختر الطول بناءً على وزنك والاستخدام المقصود. الألواح الأعرض (32 بوصة+) توفر ثباتاً أكبر. الألواح الأطول (11-12 قدماً) تتبع بشكل أفضل للجولات. المجدفون الأثقل يحتاجون ألواحاً بحجم أكبر.
    - title: ألواح SUP للجولات
      description: الألواح الأطول (11–12 قدمًا) هي الأفضل لقطع المسافات والجولات. الألواح الأعرض (32"+) توفر ثباتًا أكبر. تحقق من سعة الوزن للحمل الإجمالي بما في ذلك المعدات.

    - title: زوارق و SUP
      description: اختر طول الزورق حسب عدد الركاب والاستخدام المقصود. SUP الأكبر (4.5 م+) مناسب للبحر المفتوح والإنقاذ. الزوارق الأصغر (2.7 م) تعمل كقارب خدمة ومنصة صيد.

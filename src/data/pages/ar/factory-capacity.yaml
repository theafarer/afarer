workshops:
  - title: إنتاج ألواح SUP
    description: '4 خطوط تجميع متوازية لألواح SUP القابلة للنفخ. يمكن لكل خط إنتاج 50–80 لوحًا في الوردية الواحدة. تعمل محطات الطباعة الرقمية والطباعة بالشاشة في وقت واحد. القدرة الإنتاجية السنوية لألواح SUP: أكثر من 10,000 لوح.'
    output: 10,000+ لوح SUP/السنة
  - title: 'القوارب القابلة للنفخ و SUP'
    description: 'خطوط إنتاج متعددة الأغراض للقوارب القابلة للنفخ والقوارب. يتم إعادة تشكيل محطات اللحام بالهواء الساخن، ومكابس العزل الكهربائي للترددات اللاسلكية، ومحطات عمل التجميع بناءً على مزيج الطلب. القدرة السنوية: 5,000+ وحدة.'
    output: أكثر من 5,000 وحدة سنويًا
  - title: معدات السلامة
    description: 'منطقة إنتاج منفصلة في الغرفة النظيفة لسترات النجاة ومعدات السلامة. محطات مخصصة للخياطة وإدخال الرغوة ومحطات الاختبار. سعة سترة النجاة السنوية: 50,000+ وحدة.'
    output: أكثر من 50,000 سترة نجاة سنويًا
oem_capacity:
  moq: 'SUP: 50 وحدة (عينات من 5–10) | قارب: 2–5 وحدات | قارب صغير: 10–50 وحدة | قالب مخصص: 200+ وحدة'
  lead_time: 'الجدول القياسي: 30–45 يومًا. العينات: 15–20 يومًا. التسليم العاجل متاح.'
  payment: 'حوالة T/T: دفعة مقدمة 30% + 70% قبل الشحن. تُقبل خطابات الاعتماد (L/C) وWestern Union.'

hero:
  tagline: القدرة الإنتاجية
  title: القدرة التصنيعية والإنتاج السنوي
  subtitle: منشأة بمساحة 12,000 م² تنتج أكثر من 15,000 قارب سنويًا مع إمكانية التوسع
intro: تدير شركة afarer واحدة من أكبر مرافق تصنيع القوارب القابلة للنفخ في تشينغداو، الصين. يتم تنظيم مصنعنا الذي تبلغ مساحته 12000 متر مربع في ست ورش عمل متخصصة تعمل بالتوازي، مما يمنحنا القدرة على إنتاج أكثر من 15000 قارب سنويًا عبر خطوط SUP، وقوارب الكاياك، والزوارق، وRIB، ومعدات السلامة.
highlights:
  - value: 12,000 مترمربع
    label: إجمالي مساحة التصنيع
    detail: عبر 6 ورش عمل متخصصة
  - value: '15000'
    label: Boats produced annually
    detail: SUPs، قوارب الكاياك، الأضلاع، القوارب، معدات السلامة
  - value: أكثر من 200
    label: قوة عاملة ماهرة
    detail: أكثر من 25 مهندسًا، نوبتان يوميًا
  - value: أكثر من 50
    label: دول التصدير
    detail: الاتحاد الأوروبي والولايات المتحدة والاتحاد الأفريقي والشرق الأوسط وآسيا
  - value: 30–45
    label: مدة التسليم القياسية (أيام)
    detail: من تأكيد أمر الشراء إلى FOB
  - value: 10+
    label: سنوات من الخبرة في التصدير
    detail: منذ عام 2012
workshops:
  - title: إنتاج ألواح SUP
    description: '4 خطوط تجميع متوازية لألواح SUP القابلة للنفخ. يمكن لكل خط إنتاج 50–80 لوحًا في الوردية الواحدة. تعمل محطات الطباعة الرقمية والطباعة بالشاشة في وقت واحد. القدرة الإنتاجية السنوية لألواح SUP: أكثر من 8,000 لوح.'
    output: 8,000+ لوح SUP/السنة
  - title: SUP Boat Production
    description: 'ورشة عمل مخصصة لهياكل الألياف الزجاجية مع 6 محطات قوالب لهياكل SUP التي يصل طولها إلى 7.6 متر. يعالج لحام الأنابيب ومنطقة التجميع 3 - أضلاع في وقت واحد. سعة SUP السنوية: 2000+ قارب.'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'خطوط إنتاج متعددة الأغراض للقوارب القابلة للنفخ وقوارب الكاياك والقوارب. يتم إعادة تشكيل محطات اللحام بالهواء الساخن، ومكابس العزل الكهربائي للترددات اللاسلكية، ومحطات عمل التجميع بناءً على مزيج الطلب. القدرة السنوية: 5000+ وحدة.'
    output: أكثر من 5,000 وحدة سنويًا
  - title: معدات السلامة
    description: 'منطقة إنتاج منفصلة في الغرفة النظيفة لسترات النجاة ومعدات السلامة. محطات مخصصة للخياطة وإدخال الرغوة ومحطات الاختبار. سعة سترة النجاة السنوية: 50,000+ وحدة.'
    output: أكثر من 50,000 سترة نجاة سنويًا
oem_capacity:
  moq: 'SUP: 5–10 units | SUP: 2–5 units | SUP/SUP: 10–50 units | Custom mould: 200+ units'
  lead_time: 'الجدول القياسي: 30–45 يومًا. العينات: 15–10 يومًا. التسليم العاجل متاح.'
  payment: 'حوالة T/T: دفعة مقدمة 30% + 70% قبل الشحن. تُقبل خطابات الاعتماد (L/C) وWestern Union.'

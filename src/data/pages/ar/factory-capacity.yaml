hero:
  tagline: القدرة الإنتاجية
  title: القدرة التصنيعية والإنتاج السنوي
  subtitle: منشأة بمساحة 12,000 م² تنتج أكثر من 15,000 قارب سنويًا مع إمكانية التوسع
intro: تدير شركة afarer واحدة من أكبر مرافق تصنيع القوارب القابلة للنفخ في تشينغداو، الصين. يتم تنظيم مصنعنا الذي تبلغ مساحته 12000 متر مربع في ست ورش عمل متخصصة تعمل بالتوازي، مما يمنحنا القدرة على إنتاج أكثر من 15000 قارب سنويًا عبر خطوط SUP، والزوارق، ومعدات السلامة.

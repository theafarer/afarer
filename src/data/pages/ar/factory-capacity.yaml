intro: تدير شركة afarer واحدة من أكبر مرافق تصنيع ألواح SUP القابلة للنفخ المتخصصة في تشينغداو، الصين. يتم تنظيم مصنعنا الذي تبلغ مساحته 12000 متر مربع في ست ورش عمل متخصصة تعمل بالتوازي، مما يمنحنا القدرة على إنتاج أكثر من 15000 لوح SUP سنويًا عبر خطوط ألواح SUP ومعدات السلامة.

workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50—0 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: SUP Boat Production
    description: 'ورشة عمل مخصصة لهياكل الألياف الزجاجية مع 6 محطات قوالب لهياكل SUP التي يصل طولها إلى 7.6 متر. يعالج لحام الأنابيب ومنطقة التجميع 3 - أضلاع في وقت واحد. سعة SUP السنوية: 2000+ قارب.'
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & SUP
    description: 'خطوط إنتاج متعددة الأغراض للقوارب القابلة للنفخ وقوارب الكاياك والقوارب. يتم إعادة تشكيل محطات اللحام بالهواء الساخن، ومكابس العزل الكهربائي للترددات اللاسلكية، ومحطات عمل التجميع بناءً على مزيج الطلب. القدرة السنوية: 5000+ وحدة.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'منطقة إنتاج منفصلة في الغرفة النظيفة لسترات النجاة ومعدات السلامة. محطات مخصصة للخياطة وإدخال الرغوة ومحطات الاختبار. سعة سترة النجاة السنوية: 50,000+ وحدة.'
    output: '50,000+ life vests/year'


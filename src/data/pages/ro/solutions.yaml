features3_solutions:
  tagline: Soluții în funcție de tipul afacerii
  title: SUP-uri construite pe măsură<br />pentru afacerea dvs.
  isBeforeContent: false
  columns: 2
  items:
    - title: Stațiuni și hoteluri
      description: Programe complete de flote SUP pentru unitățile de ospitalitate — plăci durabile, branding personalizat și suport pentru instruirea personalului.
      icon: tabler:building
      link: /solutions/resorts-hotels
    - title: Cluburi de paddle
      description: Flote SUP fiabile pentru cluburi de canotaj, programe de lecții și operațiuni cu membri — plăci de calitate comercială, cu prețuri speciale pentru cluburi.
      icon: tabler:users
      link: /solutions/paddle-clubs
    - title: Operatori de închiriere
      description: Plăci SUP cu rotație intensă, proiectate pentru închiriere zilnică. Rezistente la UV, cu uscare rapidă, stivuibile — concepute pentru ritmul agitat al închirierilor.
      icon: tabler:currency-dollar
      link: /solutions/rental-operators
    - title: Parteneri de retail
      description: Vindeți cel mai rapid crescând brand SUP din piața dumneavoastră. Gamă completă de produse, materiale de marketing, dropshipping și marje competitive.
      icon: tabler:shopping-cart
      link: /solutions/retail-partners
    - title: Distribuitori
      description: Teritorii exclusive, portofoliu complet de produse, management dedicat de cont. Alăturați-vă rețelei noastre globale de distribuție în peste 50 de țări.
      icon: tabler:world
      link: /solutions/distributors
    - title: Construiți-vă propria marcă
      description: Producție OEM/ODM de SUP integrală — design, prototipare, producție de serie și logistică. Lansați-vă brandul cu Afarer.
      icon: tabler:package
      link: /solutions/build-your-own-brand

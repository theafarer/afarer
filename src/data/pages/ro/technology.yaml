meta:
  title: 'Tehnologie — drop stitch și PVC naval | {SITE}'
  description: 'Tehnologiile afarer: construcție drop stitch, PVC naval, construcții cu două straturi și presiune ridicată. Inovație de la un producător profesionist de plăci de SUP gonflabile.'
  keywords:
    - 'tehnologie SUP'
    - 'construcție drop stitch'
    - 'SUP de înaltă presiune'

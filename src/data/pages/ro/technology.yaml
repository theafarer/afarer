hero:
  tagline: Tehnologie
  title: Construit pentru performanță
  subtitle: Fiecare placă afarer este construită cu materiale de precizie și metode de fabricație testate pentru medii maritime.
sections:
  - title: Miez drop-stitch
    description: Mii de fire interne din poliester conectează stratul superior și inferior, creând o structură rigidă la 12-15 PSI.
    imageAlt: Diagramă miez DS
  - title: PVC de calitate militară
    description: Material textil PVC multistrat laminat clasificat pentru medii maritime. Fiecare strat este sudat prin topire.
    imageAlt: Strat PVC
  - title: Furtunuri Hypalon
    description: Cauciucul Hypalon (CSM) oferă rezistență superioară la UV și chimicale comparativ cu PVC-ul standard.
    imageAlt: Hypalon
  - title: Podea Air Deck
    description: Sistem de podea gonflabil de înaltă presiune care înlocuiește podelele tradiționale din placaj sau aluminiu.
    imageAlt: Punte gonflabilă

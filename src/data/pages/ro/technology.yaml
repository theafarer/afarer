meta:
  title: 'Tehnologie — drop stitch și PVC marin | {SITE}'
  description: 'Tehnologiile afarer: construcție drop stitch, PVC marin, construcții cu două straturi și presiune ridicată. Inovație de la un producător profesionist de plăci de SUP gonflabile.'
  keywords:
    - 'tehnologie SUP'
    - 'construcție drop stitch'
    - 'SUP de înaltă presiune'
    - 'materiale SUP gonflabil'
hero:
  tagline: Tehnologie
  title: Construit pentru performanță
  subtitle: Fiecare placă afarer este construită cu materiale de precizie și metode de fabricație testate pentru medii maritime.
sections:
  - title: Miez drop-stitch
    description: Mii de fire interne din poliester conectează stratul superior și inferior, creând o structură rigidă la 12-15 PSI. Aceeași tehnologie este folosită în plăcile profesionale de paddle și în SUP-urile gonflabile de curse.
    imageAlt: Diagramă miez DS
  - title: PVC de calitate marină
    description: Material textil PVC multistrat laminat clasificat pentru medii maritime. Fiecare strat este sudat prin fuziune, nu lipit, eliminând riscurile de delaminare. Testat pentru rezistență la UV, coroziune în apă sărată și abraziune.
    imageAlt: Strat PVC
  - title: PVC de calitate militară
    description: Folosit pe toate modelele SUP, PVC-ul premium oferă rezistență superioară la UV și la chimicale. Își menține flexibilitatea la temperaturi extreme și rezistă degradării.
    imageAlt: PVC
  - title: Podea Air Deck
    description: Construcție drop-stitch gonflabilă de înaltă presiune care oferă o rigiditate excepțională pentru statul în picioare, pescuit și yoga. Reduce timpul de instalare, greutatea totală și volumul de depozitare.
    imageAlt: Punte gonflabilă

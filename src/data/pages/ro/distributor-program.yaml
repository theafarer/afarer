    - title: 'Marje Directe de Fabrică & Bonusuri'
      description: 'Listă de prețuri de dealer cu bonusuri pentru volumele angajate. Fără intermediari. Expediere FOB Qingdao cu documentație completă de export.'
      icon: 'tabler:coins'

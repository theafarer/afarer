features:
  title: 'De Ce Parteneriat Cu Afarer'
  subtitle: 'Creat pentru parteneri de canal care vor să dezvolte o afacere de sporturi acvatice cu o marcă serioasă în spate.'
  columns: 3
  items:
    - title: 'Exclusivitate Teritorială'
      description: 'O piață protejată de țară sau regiune. Un singur distribuitor, fără concurență internă, fără conflicte de canal — investiția dumneavoastră vă construiește propriul șanț.'
      icon: 'tabler:shield-check'
    - title: 'Marje Directe de Fabrică'

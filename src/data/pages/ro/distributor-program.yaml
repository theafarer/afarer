      icon: 'tabler:shield-check'
    - title: 'Protecție Împotriva Conflictelor de Canal'
      description: 'Comenzile directe din regiunea dumneavoastră sunt direcționate prin dumneavoastră, iar prețurile protejează marja dumneavoastră. Afarer nu vinde pe lângă partenerii săi de țară.'

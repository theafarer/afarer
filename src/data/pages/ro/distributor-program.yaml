    - title: 'Programul de Succes al Distribuitorului'
      description: 'Onboarding structurat, planificare go-to-market, instruire de produs și vânzări, suport pentru flota demo și instrumente de co-marketing.'
      icon: 'tabler:rocket'
    - title: 'Suport de Marketing și Marcă'
      description: 'Materiale de campanie localizate, materiale de punct de vânzare, kituri pentru evenimente și conținut digital multilingv.'
      icon: 'tabler:mood-smile'
    - title: 'Lanț de Aprovizionare Fiabil'
      description: 'Producție certificată ISO și CE cu control constant al calității, MOQ previzibile și termene de livrare pe care le puteți planifica.'
      icon: 'tabler:building-factory'
    - title: 'Manager de Cont Dedicat'
      description: 'Un manager personal de distribuție pentru prognoze, planificarea comenzilor și suport post-vânzare.'
      icon: 'tabler:user-check'
table:
  title: 'Niveluri de Program și Condiții de Comandă'
  subtitle: 'Alegeți nivelul care corespunde potențialului pieței dumneavoastră. Toate prețurile în USD, FOB Qingdao.'
  caption: 'Comenzile de probă (5–10 unități) nu beneficiază de protecție teritorială. Condițiile sunt convenite în Contractul dumneavoastră de Distribuție înainte de orice expediere.'
  head:
    - Nivel de Program
    - Comandă Minimă (unități)
    - Termen de Livrare
    - Plată
  rows:

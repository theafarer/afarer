      icon: 'tabler:presentation'
    - title: 'Piese de Schimb & Suport Post-Vânzare'
      description: 'Aprovizionare cu piese de schimb, înregistrarea garanțiilor și gestionarea cererilor, plus fișe tehnice de produs și manuale pentru echipa locală de service.'
      icon: 'tabler:settings'

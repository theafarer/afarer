    - [Comandă de Test, 10–30, 30–45 zile, 100% preplătit]
    - [Dealer Autorizat, 30–50, 30–45 zile, 30% avans / 70% înainte de expediere]
    - [Distribuitor Țară / Regional, 100–300, 30–45 zile, 30% avans / 70% înainte de expediere]
    - [Personalizat și Private Label (standard), 50+, 30–45 zile, 30% avans / 70% înainte de expediere]
    - [Personalizare Avansată (noi forme, ambalaje), 200+, 45–60 zile, 30% avans / 70% înainte de expediere]
    - [Drepturi asupra întregii linii de produse, 300–1, 000, 60–90 zile, 30% avans / 70% înainte de expediere]
faqs:
  title: 'Program de Distribuție — Întrebări Frecvente'
  subtitle: 'Tot ce întreabă distribuitorii înainte de a aplica.'
  items:
    - title: 'Ce înseamnă o țară, un distribuitor?'
      description: 'Afarer acordă unui singur distribuitor autorizat drepturi exclusive pentru o țară sau regiune. Dețineți piața dumneavoastră — fără importuri paralele, fără concurență internă.'
    - title: 'Care este comanda minimă inițială?'
      description: 'Distribuitorii de țară și regionali încep de la 100–300 unități. Dealerii autorizați de la 30–50 unități. Comenzile de test de 10–30 unități vă permit să validați mai întâi piața (fără protecție teritorială).'
    - title: 'Ce suport primesc distribuitorii?'
      description: 'Programul de succes al distribuitorului include onboarding, planificarea go-to-market, instruire de produs și vânzări, suport pentru flota demo, materiale de marketing localizate și un manager de cont dedicat.'
    - title: 'Cum mă protejează Afarer de conflictele de canal?'
      description: 'Fiecare teritoriu are exact un distribuitor autorizat. Comenzile directe din regiunea dumneavoastră trec prin dumneavoastră, iar prețurile protejează marja.'
    - title: 'Care sunt condițiile de livrare și plată?'
      description: 'Comenzile se expediază FOB Qingdao cu documentație completă de export. Comenzile de producție: 30% avans și 70% înainte de expediere; comenzile de test și de probă sunt preplătite.'
    - title: 'Cum aplic?'
      description: 'Trimiteți o cerere prin formularul de contact. Evaluăm potrivirea cu piața, prezența în retail și capacitatea logistică, apoi răspundem în 3 zile lucrătoare cu următorii pași și un model de contract de distribuție.'
cta:
  title: 'Gata să dețineți piața dumneavoastră?'
  subtitle: 'Aplicați pentru Programul de Distribuție Afarer și primiți un răspuns în 3 zile lucrătoare.'
  actions:
    - text: 'Aplicați pentru Distribuție'
      href: /contact?subject=Distributor Application
      variant: primary
    - text: 'Descărcați Programul de Distribuție'
      href: /distributor-program
      variant: secondary
geo:

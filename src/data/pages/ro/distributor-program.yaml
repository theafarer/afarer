faqs:
  title: 'Parteneriat de Țară — Întrebări Frecvente'
  subtitle: 'Întrebările pe care partenerii serioși de țară le pun înainte de a aplica.'
  items:
    - title: 'Ce înseamnă cu adevărat o țară — un distribuitor?'
      description: 'Afarer numește un singur distribuitor autorizat cu drepturi exclusive pentru un teritoriu definit. Nu vindem pe o țară protejată prin canalele noastre globale sau regionale. Deținerea teritoriului durează atâta timp cât Acordul de Distribuție este respectat.'
    - title: 'Teritoriul este exclusiv pentru totdeauna?'
      description: 'Nu. Exclusivitatea este condiționată, nu perpetuă. Ea este menținută printr-un Acord de Distribuție semnat, finalizarea primei comenzi, ținte anuale de achiziție, stoc local, capacitate post-vânzare și investiție continuă în piață. Dacă acestea nu sunt îndeplinite, teritoriul poate fi renegociat sau reatribuit.'
    - title: 'Care este comanda minimă inițială?'
      description: 'Distribuitorii de țară și regionali încep de la 100–300 unități; dealerii autorizați de la 30–50 unități; comenzile de test de la 10–30 unități vă permit să validați mai întâi piața (comenzile de test și de probă nu au protecție teritorială). Programele custom și private label urmează MOQ-uri separate, listate în nivelurile de mai sus.'
    - title: 'Ce sprijin include programul cu 10 module?'
      description: 'Niveluri și calificare, protecția teritoriului, MOQ / prețuri / bonusuri anuale, managementul stocului și execuția comenzilor, materiale de marketing și fonduri comune de piață, instruire de produs / vânzări / tehnică, piese de schimb și service post-vânzare, înregistrarea garanțiilor, portalul pentru parteneri, plus fișe tehnice de produs, bibliotecă de materiale de marketing, calendar de bonusuri anuale și liste de expediere și ambalare.'
    - title: 'Cum mă protejează Afarer de conflictele de canal?'
      description: 'Fiecare teritoriu are exact un distribuitor autorizat. Solicitările și comenzile directe din regiunea dumneavoastră sunt direcționate prin dumneavoastră, formularele de pe site sunt redirecționate către partenerul local unde acesta există, iar echipa globală intervine doar când un partener nu răspunde.'
    - title: 'Care sunt condițiile de expediere și plată?'
      description: 'Comenzile se expediază FOB Qingdao cu documentație completă de export. Comenzile de producție au 30% avans și 70% înainte de expediere; comenzile de test și de probă sunt preplătite. Termenul standard de livrare este de 30–45 zile lucrătoare, cu 15–20 zile lucrătoare pentru seriile de probă.'
    - title: 'Cum aplic?'
      description: 'Trimiteți cererea dumneavoastră prin formularul de contact cu detalii despre piață. Evaluăm potrivirea cu piața, prezența în retail și capacitatea logistică, apoi răspundem în termen de 3 zile lucrătoare cu următorii pași și un model de Acord de Distribuție.'

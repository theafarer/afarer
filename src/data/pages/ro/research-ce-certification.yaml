hero:
  tagline: Conformitate
  title: Cum funcționează certificarea CE pentru ambarcațiunile gonflabile
  subtitle: 7 min de citit
content_html: >-
  <h2>Ce este certificarea CE?</h2>

  <p>Marcarea CE (Conformit&eacute; Europ&eacute;enne) indică faptul că un produs respectă cerințele UE privind sănătatea, siguranța și mediul. Pentru ambarcațiunile gonflabile, cadrul de reglementare relevant depinde de categoria de produs.</p>


  <h2>Directive aplicabile</h2>


  <h3>Directiva privind ambarcațiunile de agrement (2013/53/EU)</h3>

  <p>Directiva principală pentru majoritatea bărcilor gonflabile, SUP-urilor și caiacelor. Se aplică ambarcațiunilor de agrement cu lungimea carenei de la 2.5 m la 24 m, ambarcațiunilor parțial finalizate (pentru furnizare OEM) și ambarcațiunilor personale.</p>


  <h3>Regulamentul privind echipamentele individuale de protecție (2016/425)</h3>

  <p>Vestele de salvare, dispozitivele de flotabilitate și echipamentele de siguranță furnizate împreună cu ambarcațiunile trebuie să respecte cerințele Regulamentului PPE, inclusiv examinarea de tip (Modulul B) de către un organism notificat și asigurarea calității producției (Modulul D sau E).</p>


  <h2>Procesul de certificare</h2>

  <ol>
    <li>Clasificarea produsului: Determinarea categoriei de proiectare a ambarcațiunii (A – D conform ISO 8666)</li>
    <li>Standarde aplicabile: EN ISO 6185 (părțile 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (plăcuța constructorului)</li>
    <li>Pregătirea dosarului tehnic: planuri de proiectare, listă de materiale, certificate de material, evaluarea riscurilor</li>
    <li>Testare de tip: flotabilitate, stabilitate, capacitate de încărcare, testarea materialelor, rezistența cusăturilor, retenția aerului</li>
    <li>Controlul producției în fabrică: audit al proceselor de fabricație de către organismul notificat</li>
    <li>Declarație de conformitate: Producătorul semnează DoC și aplică marcajul CE</li>
  </ol>


  <h2>Organisme notificate pentru ambarcațiunile gonflabile</h2>

  <p>Printre organismele notificate (NB) frecvente se numără Bureau Veritas (Franța), DNV GL (Germania), RINA (Italia), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Germania).</p>


  <h2>Termene și costuri</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fază</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Durată</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Cost tipic (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Pregătirea dosarului tehnic</td><td class="p-3 border">2 – 4 săptămâni</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Testare de tip</td><td class="p-3 border">4 – 8 săptămâni</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Auditul fabricii</td><td class="p-3 border">1 – 2 zile (la fața locului)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Total (primul produs)</td><td class="p-3 border">8 – 14 săptămâni</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>


  <h2>Ce înseamnă acest lucru pentru cumpărători</h2>

  <p>Atunci când achiziționați ambarcațiuni gonflabile certificate CE, verificați întotdeauna că marcajul CE se află pe plăcuța constructorului, că există un DoC valabil, că numărul organismului notificat este menționat și că manualul proprietarului include instrucțiuni de siguranță în limba
  dumneavoastră. Toate produsele afarer beneficiază de certificare CE, cu trasabilitate completă până la rapoartele de audit ale organismului notificat.</p>

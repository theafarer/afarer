meta:
  title: 'Contact — întrebări despre parteneriat și produse SUP | {SITE}'
  description: 'Contactați afarer pentru întrebări despre parteneriat, co-brand și private label sau flote profesionale. Producător de plăci de SUP gonflabile și bărci, răspundem în 2 zile lucrătoare.'
  keywords:
    - 'contact afarer'
    - 'întrebare distribuitor SUP'
    - 'furnizor profesionist SUP'
    - 'contact producător SUP'
hero_text:
  tagline: Contact
  title: CONTACTAȚI-NE
contact_form:
  id: form
  title: Trimiteți-ne un mesaj
  subtitle: Pentru oferte, întrebări tehnice sau solicitări de parteneriat, scrieți-ne. Răspundem într-o zi lucrătoare.
  email_to: info@afarer.com
  submit_button: Trimite solicitarea →Obține o ofertă
  success_message: Mulțumim! Mesajul dvs. a ajuns în căsuța noastră poștală. Vom răspunde într-o zi lucrătoare.
  error_message: Ceva a mers greșit la trimiterea mesajului. Încercați din nou sau trimiteți-ne un e-mail direct.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: rezolvați următoarea cerință'
  fields:
    - name: firstName
      label: Prenume
      row: 1
      type: select
      optionsKey: țări
      step: 1
    - name: lastName
      label: Nume
      row: 1
      type: select
      options:
        - value: ''
          label: Selectați volumul estimat...
        - value: Probă
          label: Doar mostre / prototipuri
        - value: 5-10
          label: 5–10 unități (MOQ standard)
        - value: 100-500
          label: 100–500 de unități
        - value: Peste 500
          label: 500+ unități (prețuri de volum)
      step: 1
    - name: companyName
      label: Numele companiei
      row: 2
      type: select
      options:
        - value: ''
          label: Selectați tipul de personalizare...
        - value: niciuna
          label: Produs standard (fără personalizare)
        - value: logo
          label: Doar logo / branding personalizat
        - value: full
          label: Co-Brand complet (dimensiune, culoare, grafică, ambalaj)
        - value: consultanță
          label: Nu sunt sigur — am nevoie de consultanță
      step: 1
    - name: address
      label: Adresă
      row: 3
      type: select
      options:
        - value: ''
          label: Selectați categoria de produse...
        - value: toate
          label: Toate produsele / Catalog complet
        - value: sup
          label: Plăci SUP / Paddleboard-uri
        - value: siguranță
          label: Echipament de siguranță / Veste de salvare
        - value: accesoriu
          label: Accesorii (pompe, vâsle, saci)
      step: 1
    - name: zip
      label: Cod poștal
      row: 4
      step: 2
    - name: country
      label: Țară
      row: 4
      step: 2
    - name: email
      label: E-mail
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Volum estimat al comenzii
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Aveți nevoie de personalizare?
      row: 7
      step: 2
    - name: productInterest
      label: Categorii de produse de interes
      row: 8
      step: 2
    - name: subject
      label: Subiect
      row: 9
      step: 3
    - name: message
      label: Mesaj
      row: 10
      type: textarea
      rows: 6
      step: 3

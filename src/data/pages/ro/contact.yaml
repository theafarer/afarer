hero_text:
  tagline: Contact
  title: GET IN TOUCH
contact_form:
  id: form
  title: Trimiteți-ne un mesaj
  subtitle: Pentru oferte, întrebări tehnice sau solicitări de parteneriat, scrieți-ne. Răspundem într-o zi lucrătoare.
  email_to: info@afarer.com
  submit_button: Trimite solicitarea →Obține o ofertă
  success_message: Mulțumim! Mesajul dvs. a ajuns în căsuța noastră poștală. Vom răspunde într-o zi lucrătoare.
  error_message: Ceva a mers greșit la trimiterea mesajului. Încercați din nou sau trimiteți-ne un e-mail direct.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: rezolvați următoarea cerință'
  fields:
    - name: firstName
      label: Prenume
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: lastName
      label: Nume
      row: 1
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: 5-10
          label: 5–10 units (Standard MOQ)
        - value: 100-500
          label: 100–500 units
        - value: 500-plus
          label: 500+ units (Volume pricing)
      step: 1
    - name: companyName
      label: Numele companiei
      row: 2
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: address
      label: Adresă
      row: 3
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: zip
      label: Cod poștal
      row: 4
      step: 2
    - name: country
      label: Țară
      row: 4
      step: 2
    - name: email
      label: E-mail
      row: 5
      step: 2
    - name: tel
      label: Telefon
      row: 5
      type: tel
      step: 2
    - name: orderVolume
      label: Volum estimat al comenzii
      row: 6
      type: select
      withCountryCode: true
      step: 2
    - name: customization
      label: Aveți nevoie de personalizare?
      row: 7
      step: 2
    - name: productInterest
      label: Categorii de produse de interes
      row: 8
      step: 2
    - name: subject
      label: Subiect
      row: 9
      step: 3
    - name: message
      label: Mesaj
      row: 10
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: Alte modalități de a ne contacta
  columns: 3
  items:

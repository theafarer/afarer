      description: Garanție, reparații, piese de schimb și întrebări de operare.
      icon: tabler:tool
    - title: Presă și parteneriate
      description: Kituri media, sponsorizări și colaborare industrială.
      icon: tabler:news
    - title: Telefon
      description: +86 13305324192
      icon: tabler:headset
    - title: E-mail
      description: info@afarer.com
      icon: tabler:mail
    - title: Sediu central
      description: Economic Development Zone, Laixi, Qingdao, China, 266600
      icon: tabler:map-pin
map:

  title: Producție OEM și private label
  subtitle: De la concept la container — personalizați fiecare detaliu al seriei voastre de SUP gonflabile
intro: >-
  afarer oferă servicii complete OEM și ODM pentru branduri, distribuitori și agenții guvernamentale din întreaga lume. Cu peste 10 ani de experiență în export și o fabrică de 12.000 m² certificată ISO 9001 & BSCI, ne ocupăm de tot, de la designul produsului și dezvoltarea matrițelor până la
  producția la scară completă, ambalare și logistică.

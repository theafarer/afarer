services:
  - title: Design de produs și inginerie
    description: Echipa noastră internă de R&D lucrează pornind de la conceptul sau specificațiile dvs. pentru a dezvolta desene CAD, modele 3D și prototipuri. Oferim proiectare de matrițe, optimizarea formei carenei și îndrumare în selecția materialelor.
  - title: Branding și grafică personalizate
    description: Imprimare digitală full-color, serigrafie, gofrare și opțiuni de etichetare. Dezvoltăm grafică de punte specifică brandului, branding pe tuburi și ambalaje gata pentru retail.
  - title: Personalizarea materialelor și specificațiilor
    description: Alegeți dintre construcțiile din PVC (standard, ecologic, ignifug), Hypalon/CSM, drop-stitch și hibride. Culori personalizate pentru tuburi, gramaje de pânză și opțiuni de ranforsare.
  - title: Ambalare și logistică
    description: Ambalaje retail personalizate, cutii cu marcă privată, ambalare în vid, paletizare și încărcare în containere. Disponibile condiții de transport FOB Qingdao, CIF sau DDP.
moq_table:
  - product: Plăci SUP gonflabile
    standard_moq: 5–10 units
    custom_moq: Peste 200 de unități
    lead_time: 30–45 days
  - product: Veste de salvare și siguranță
    standard_moq: 100–200 unități
    custom_moq: 1,000+ unități
    lead_time: 20–30 zile
why_us:
  - title: Integrare verticală
    description: Deținem propria fabrică, matrițele și lanțul de aprovizionare — fără intermediari, fără subcontractori. Acest lucru ne oferă control asupra calității, costurilor și livrării.
  - title: Certificare dublă
    description: Certificare ISO 9001 pentru managementul calității și conformitate socială BSCI. Rapoartele de audit ale fabricii sunt disponibile la cerere.
  - title: Conformitate CE
    description: Toate modelele standard dețin certificarea CE 2013/53/EU. Modelele personalizate pot fi certificate CE prin procesul nostru consacrat.
  - title: MOQ redus
    description: Începeți de la doar 5 unități pentru modelele standard. Ajutăm brandurile emergente să se lanseze fără a investi excesiv în stocuri.

hero_text:
  tagline: Resources
  title: 'Centru de descărcare și ghiduri pentru cumpărători'
  subtitle: 'Accesați cataloage de produse, ghiduri OEM, liste de verificare pentru cumpărători și documentație tehnică pentru a lua decizii informate de achiziție.'
features3_downloads:
  tagline: Downloads
  title: 'Documentație produs<br />și resurse pentru cumpărători'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Gama completă de produse, inclusiv bărci SUP, bărci inflabile, plăci SUP, caiace și accesorii. Specificații, configurații și opțiuni. Format PDF.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'Tot ce trebuie să știți despre parteneriatele OEM/ODM: prezentare generală a procesului, cantități minime de comandă, opțiuni de personalizare, control al calității și transport.'
      icon: tabler:building-factory
    - title: 'SUP Boat Buyer Guide'
      description: 'Cum să alegeți SUP-ul potrivit: materiale pentru carenă, materiale pentru tuburi, selecția motorului, considerații privind dimensiunea și opțiuni de configurare pentru diferite aplicații.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'Considerații cheie atunci când selectați un producător de plăci SUP: indicatori de calitate, cerințe de certificare, considerații MOQ și ce să căutați într-un audit al fabricii.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC vs Hypalon: comparație de durabilitate, rezistență UV, durată de viață, opțiuni de reparații și considerații de cost pentru diferite aplicații marine.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'Descărcați șablonul nostru de brief de produs. Completați cerințele dvs. și returnați-l nouă pentru o ofertă și o evaluare a fezabilității în aceeași săptămână.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Întrebări frecvente despre produsele noastre, procesul de fabricație și modelul de parteneriat.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ variază în funcție de categoria de produs. Bărcile SUP încep de obicei de la 10 unități per model. Plăcile SUP de la 50 de unități. Contactați echipa noastră de vânzări pentru informații MOQ specifice produsului.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Da. afarer asigură producția de mostre pentru evaluare înainte de producția de masă. Costurile mostrelor sunt negociabile și adesea creditate pentru prima comandă de producție.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Termeni standard: 30% depozit la comandă, 70% înainte de expediere. Termeni LC disponibili pentru clienții calificați. Contactați echipa noastră financiară pentru a discuta aranjamentele.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Termene tipice de livrare: bărci SUP 30-45 zile, plăci SUP 20-30 zile, bărci inflabile 25-35 zile. Dezvoltarea personalizată adaugă 15-30 de zile pentru prototipare.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'Certificare CE pentru piețele UE, producție aprobată de Garda de Coastă a SUA, sistem de calitate ISO, conformitate BSCI și REACH.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Da. Oferim ambalaje personalizate cu sigla, culorile și identitatea mărcii dvs. MOQ pentru ambalaje personalizate depinde de categoria de produs.'
      icon: tabler:color-swatch
cta:
  title: 'Aveți nevoie de ajutor pentru a găsi resursa potrivită?'
  subtitle: 'Contactați echipa noastră pentru îndrumare personalizată privind selecția produselor, parteneriatele OEM sau specificațiile tehnice.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact

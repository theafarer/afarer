label: Garanție
headline: Garanția limitată a producătorului afarer
subtitle: afarer garantează calitatea fiecărui produs maritim pe care îl fabricăm.
seo:
  headline: Garanție afarer pentru bărci gonflabile —5 ani garanție limitată | afarer
  description: afarer oferă 5 ani de garanție limitată pentru materialul principal al furtunurilor, cusături și carenă din fibră de sticlă.
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |-
    <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
      Această garanție limitată se aplică produselor maritime gonflabile noi, cu marca afarer, achiziționate direct de la afarer sau de la un dealer sau retailer autorizat afarer. Data de intrare în vigoare este data verificabilă a achiziției inițiale cu amănuntul.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Acoperirea garanției și durata</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">5 ani</h3>
          <p class="text-sm text-gray-600 mt-1">Integritatea materialului principal al furtunurilor (CSM/PVC)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">5 ani</h3>
          <p class="text-sm text-gray-600 mt-1">Integritatea structurală a carenei din fibră de sticlă</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">5 ani</h3>
          <p class="text-sm text-gray-600 mt-1">Capacitatea de etanșeitate a cusăturilor tuburilor gonflabile</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">5 ani</h3>
          <p class="text-sm text-gray-600 mt-1">Funcționalitatea supapelor de umflare</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">1 an</h3>
          <p class="text-sm text-gray-600 mt-1">Accesorii instalate din fabrică și fitinguri auxiliare</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 an*</h3>
          <p class="text-sm text-gray-600 mt-1">Utilizare comercială, de închiriere sau flotă — toate componentele</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Utilizarea comercială, guvernamentală, charter, de închiriere sau didactică reduce garanția la 1 an. Utilizarea în curse sau competiții anulează complet garanția.</p>
    </div>

    <h2>Ce este acoperit</h2>
    <h3>Materialul principal al tuburilor (5 ani)</h3>
    <p>afarer garantează materialul principal al tuburilor împotriva deteriorării porozității care compromite în mod substanțial capacitatea produsului de a menține umflarea operațională. Acest lucru se aplică materialului acoperit cu CSM (Hypalon) și tuturor celorlalte materiale pentru tuburi utilizate la fabricație.</p>

    <h3>Integritatea structurală a carenei din fibră de sticlă (5 ani)</h3>
    <p>Pentru produsele cu o carenă din plastic ranforsat cu fibră de sticlă (FRP), structura compozită fundamentală este garantată împotriva defectării structurale cauzate de defecte de material sau de manoperă.</p>

    <h3>Capacitatea de etanșeitate a cusăturilor tuburilor gonflabile (5 ani)</h3>
    <p>Cusăturile tuburilor gonflabile, acolo unde sunt îmbinate în timpul fabricației, sunt garantate împotriva defectelor de fabricație care provoacă scurgeri substanțiale de aer prin cusătură. Inspecția periodică și întreținerea presiunilor de umflare adecvate sunt condiții pentru acoperire.</p>

    <h3>Funcționalitatea supapelor de umflare (5 ani)</h3>
    <p>Supapele de umflare cu aer instalate inițial de afarer sunt garantate împotriva defectelor de material sau manoperă care împiedică supapa să rețină aerul conform proiectării.</p>

    <h3>Accesorii instalate din fabrică (1 an)</h3>
    <p>Componentele și fitingurile fabricate de afarer și instalate inițial în fabrică sunt garantate împotriva defectelor de material și manoperă pentru un an. Aceasta exclude articolele terțe, care sunt acoperite doar de garanțiile respective ale producătorilor.</p>

    <h2>Ce nu este acoperit</h2>
    <ul>
      <li>Defecte cosmetice, inclusiv decolorare, pete, estompare, cretare sau orice modificare a aspectului</li>
      <li>Puncții, tăieturi, rupturi, sfâșieri sau alte daune fizice</li>
      <li>Crapări, fisuri, abraziuni, zgârieturi sau deteriorări cauzate de frecare sau contact</li>
      <li>Degradare din cauza expunerii la radiații UV, intemperii sau condiții atmosferice</li>
      <li>Deteriorări din cauza contactului cu combustibili, solvenți, acizi, baze sau substanțe chimice</li>
      <li>Deteriorări din neglijență, utilizare necorespunzătoare, abuz, accident sau uzură normală</li>
      <li>Probleme de gelcoat sau vopsea (bășici, crăpături, decolorare, estompare)</li>
      <li>Deteriorări din impact, solicitare, susținere necorespunzătoare sau transport cu remorcă</li>
      <li>Deteriorări din umflare/dezumflare necorespunzătoare sau utilizarea unor dispozitive de umflare neaprobate</li>
      <li>Echipamente, componente sau sisteme terțe (acoperite de producătorii respectivi)</li>
    </ul>

    <h2>Obligația producătorului și remediul</h2>
    <p>Singura și exclusiva obligație a afarers este repararea sau înlocuirea, la alegerea afarers, a oricărei componente constatate ca fiind defectă ca material sau manoperă și acoperită de această garanție. Reparațiile sau înlocuirile sunt efectuate de afarer sau de unitatea de service autorizată desemnată de aceasta. Componentele reparate sau înlocuite sunt garantate doar pentru partea neexpirată a perioadei de garanție inițiale.</p>

    <h2>Condiții de garanție</h2>
    <ul>
      <li><strong>Înregistrare:</strong> Produsul trebuie înregistrat corespunzător, conform cerințelor din termenii garanției.</li>
      <li><strong>Întreținere:</strong> Produsul trebuie întreținut în conformitate cu ghidurile publicate de afarer, inclusiv inspecția periodică și întreținerea presiunilor de umflare adecvate.</li>
      <li><strong>Cooperare:</strong> Cumpărătorul trebuie să coopereze pe deplin și prompt cu afarer în toate aspectele legate de cererile de garanție.</li>
      <li><strong>Cumpărătorul inițial:</strong> Această garanție este acordată exclusiv cumpărătorului final inițial și nu este transferabilă.</li>
    </ul>

    <h2>Utilizare comercială</h2>
    <p>Dacă produsul este utilizat în scopuri comerciale, guvernamentale, nonprofit, charter, de închiriere, didactice sau orice alt scop decât uzul recreativ privat, perioada de garanție pentru toate componentele este redusă la un (1) an de la data inițială a achiziției cu amănuntul. Utilizarea în curse, competiții de viteză sau anduranță anulează imediat și irevocabil garanția în totalitate.</p>

    <h2>Cum să faci o cerere de garanție</h2>
    <p>Contactați afarer sau dealerul dumneavoastră autorizat cu dovada achiziției și o descriere detaliată a problemei. afarer va analiza cererea și va oferi instrucțiuni pentru inspecție și service.</p>
    <p>Pentru întrebări privind serviciul de garanție, vă rugăm să ne contactați prin intermediul <a href="/contact" class="text-sky-600 underline">paginii de contact</a> cu numărul comenzii și detaliile produsului.</p>

    <h2>Articole de la terți</h2>
    <p>Echipamentele, componentele sau sistemele fabricate de terți (chiar dacă au fost instalate de afarer) sunt acoperite exclusiv de orice garanție oferită de producătorul respectiv. afarer își declină expres orice responsabilitate de garanție pentru astfel de articole de la terți.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
      Această declarație de garanție este un rezumat al Garanției limitate complete a producătorului afarer. Documentul juridic complet al garanției reglementează toți termenii și condițiile garanției. Specificațiile pot fi modificate fără notificare prealabilă. afarer este o marcă a Qingdao Vatrad Group.
    </p>
faqs_sup:
  title: Întrebări frecvente SUP
  subtitle: Întrebări comune despre plăcile noastre de paddleboarding.
  columns: 2
  items:
    - title: Ce dimensiuni de plăci SUP sunt disponibile?
      description: Oferim plăci SUP de la 9 ft la 12 ft, inclusiv modele all-round, touring, yoga și modele speciale. Cele mai vândute modele includ Tropical Breeze (10 ft) și Ocean Voyager (11 ft).
    - title: Ce este construcția drop-stitch?
      description: Construcția drop-stitch folosește mii de fire de poliester care conectează stratul superior și inferior al plăcii, permițând menținerea unei presiuni ridicate a aerului (15-20 PSI) și obținerea unei platforme rigide și stabile. Acesta este standardul industrial pentru SUP-urile gonflabile premium.
    - title: Care este limita de greutate pentru plăcile SUP?
      description: Plăcile noastre SUP suportă până la 150 kg în funcție de model și volum. Leviathan Wake este modelul nostru cu cea mai mare capacitate, proiectat pentru utilizatori mai grei și utilizare la yoga.
    - title: Oferiți pachete complete SUP?
      description: Da. Fiecare placă SUP este livrată cu un pachet complet, incluzând o paddă din aluminiu din 3 piese, pompă de mână de înaltă presiune, lesă spiralată, rucsac de călătorie și kit de reparații. Unele modele includ și un set de aripioare detașabile.
    - title: Care este garanția pentru plăcile SUP?
      description: Toate plăcile SUP afarer beneficiază de o garanție de un an împotriva defectelor de fabricație, inclusiv defectarea cusăturilor, defecte ale supapelor și delaminarea materialului în condiții normale de utilizare.
    - title: Cât timp durează umflarea unei plăci SUP?
      description: Folosind pompa de mână inclusă, umflarea completă la 15 PSI durează aproximativ 8—2 minute. Pentru umflare mai rapidă, recomandăm pompa noastră electrică afarer 12V, care umflă o placă în mai puțin de 4 minute.
faqs_materials:
  title: SUP Material & Care FAQs
  subtitle: Common questions about our inflatable SUP materials, care, and storage.
  columns: 2
  items:
    - title: What materials are used in afarer inflatable SUPs?
      description: We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.
    - title: How long do inflatable SUPs last?
      description: With proper care, a quality PVC inflatable SUP lasts 5—0 years. Regular cleaning, UV protection, and proper storage significantly extend service life.
    - title: What maintenance is required for an inflatable SUP?
      description: Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.
    - title: Can inflatable SUPs be used in saltwater?
      description: Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.
    - title: How do I store an inflatable SUP?
      description: Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.
    - title: What is the weight capacity of afarer inflatable SUPs?
      description: Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.

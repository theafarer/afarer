faqs_sup:
  title: Întrebări frecvente SUP
  subtitle: Întrebări comune despre plăcile noastre de paddleboarding.
  columns: 2
  items:
    - title: Ce dimensiuni de plăci SUP sunt disponibile?
      description: Oferim plăci SUP de la 9 ft la 12 ft, inclusiv modele all-round, touring, yoga și modele speciale. Cele mai vândute modele includ Tropical Breeze (10 ft) și Ocean Voyager (11 ft).
    - title: Ce este construcția drop-stitch?
      description: >-
        Construcția drop-stitch folosește mii de fire de poliester care conectează stratul superior și inferior al plăcii, permițând menținerea unei presiuni ridicate a aerului (15-20 PSI) și obținerea unei platforme rigide și stabile. Acesta este standardul industrial pentru SUP-urile gonflabile
        premium.
    - title: Care este limita de greutate pentru plăcile SUP?
      description: Plăcile noastre SUP suportă până la 150 kg în funcție de model și volum. Leviathan Wake este modelul nostru cu cea mai mare capacitate, proiectat pentru utilizatori mai grei și utilizare la yoga.
    - title: Oferiți pachete complete SUP?
      description: Da. Fiecare placă SUP este livrată cu un pachet complet, incluzând o paddă din aluminiu din 3 piese, pompă de mână de înaltă presiune, lesă spiralată, rucsac de călătorie și kit de reparații. Unele modele includ și un set de aripioare detașabile.
    - title: Care este garanția pentru plăcile SUP?
      description: Toate plăcile SUP afarer beneficiază de o garanție de un an împotriva defectelor de fabricație, inclusiv defectarea cusăturilor, defecte ale supapelor și delaminarea materialului în condiții normale de utilizare.
    - title: Cât timp durează umflarea unei plăci SUP?
      description: Folosind pompa de mână inclusă, umflarea completă la 15 PSI durează aproximativ 8–12 minute. Pentru umflare mai rapidă, recomandăm pompa noastră electrică afarer 12V, care umflă o placă în mai puțin de 4 minute.
faqs_materials:
  title: Întrebări frecvente despre materialele și îngrijirea SUP-urilor
  subtitle: Întrebări frecvente despre materialele SUP-urilor noastre gonflabile, îngrijirea și depozitarea lor.
  columns: 2
  items:
    - title: Ce materiale sunt folosite în SUP-urile gonflabile afarer?
      description: Folosim PVC de calitate militară (1100 denieri) cu construcție stabilizată la UV și rezistentă la abraziune, conformă cu reglementările UE REACH și RoHS.
    - title: Cât timp rezistă plăcile SUP gonflabile?
      description: Cu îngrijire adecvată, o placă SUP inflabilă din PVC de calitate rezistă 5–10 ani. Curățarea regulată, protecția UV și depozitarea corespunzătoare prelungesc semnificativ durata de viață.
    - title: Ce întreținere este necesară pentru un SUP gonflabil?
      description: Întreținerea de bază include clătirea cu apă dulce după fiecare utilizare (mai ales în apă sărată), uscarea înainte de depozitare, verificarea anuală a garniturilor supapelor și evitarea expunerii prelungite la soare atunci când nu sunt folosite.
    - title: Pot fi folosite plăcile SUP pneumatice în apă sărată?
      description: Da. Toate plăcile SUP gonflabile afarer sunt proiectate pentru utilizare atât în apă dulce, cât și în apă sărată. Recomandăm clătirea cu apă dulce și uscarea completă după expunerea la apă sărată.
    - title: Cum depozitez un SUP gonflabil?
      description: Dezaflați, curățați și uscați complet placa înainte de depozitare. Rulați lejer (evitați pliurile strânse), depozitați într-un loc răcoros și uscat, ferit de lumina directă a soarelui, și nu o lăsați pe podele de beton, pentru a preveni absorbția umidității.
    - title: Care este capacitatea de greutate a plăcilor SUP gonflabile afarer?
      description: Capacitățile de greutate variază de la 100 kg pentru cele mai mici modele până la peste 200 kg pentru plăcile mai mari. Fiecare pagină de produs listează sarcina maximă pentru modelul dumneavoastră specific.

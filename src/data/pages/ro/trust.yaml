      icon: 'tabler:clipboard-check'

faqs_rib:
  title: 'Întrebări frecvente SUP'
  subtitle: 'Întrebări comune despre ambarcațiunile noastre gonflabile cu cocă rigidă.'
  columns: 2
  items:
    - title: 'Ce dimensiuni de ambarcațiuni SUP oferă afarer?'
      description: 'Oferim 35 de modele SUP de la 2,5 m la 7,6 m, acoperind totul, de la tendere compacte la ambarcațiuni grele comerciale și de patrulare. Fiecare model este disponibil cu multiple opțiuni de configurare.'
    - title: 'Care este diferența dintre un SUP și o barcă gonflabilă tradițională?'
      description: 'Un SUP (ambarcațiune gonflabilă cu cocă rigidă) combină o cocă solidă din fibră de sticlă sau aluminiu în formă de V adânc cu tuburi gonflabile din Hypalon sau PVC. Acest lucru oferă stabilitatea și capacitatea de încărcare a unei bărci rigide cu absorbția șocurilor și flotabilitatea uneia gonflabile.'
    - title: 'Ce motoare sunt compatibile cu SUP-urile afarer?'
      description: 'SUP-urile noastre suportă motoare exterioare de la 3 CP la 250 CP, în funcție de model. Fiecare pagină de produs listează puterea maximă a motorului. Recomandăm consultarea dealer-ului pentru combinația ideală.'
    - title: 'SUP-urile afarer sunt certificate CE?'
      description: 'Da. Toate modelele SUP de agrement sunt certificate CE conform standardelor europene aplicabile pentru ambarcațiuni de agrement. Modelele comerciale și de patrulare îndeplinesc cerințe suplimentare de stabilitate și încărcare.'
    - title: 'Care este garanția pentru ambarcațiunile SUP?'
      description: 'Toate SUP-urile afarer vin cu o garanție standard de un an împotriva defectelor de fabricație, acoperind delaminarea cocii, defectarea cusăturii tubului, defecte ale supapelor și probleme hardware.'
    - title: 'Câte camere de aer au SUP-urile afarer?'
      description: 'SUP-urile noastre au între 3 și 7 camere de aer independente, în funcție de lungimea modelului. Acest design multicameră asigură că ambarcațiunea rămâne pe linia de plutire chiar dacă un compartiment este compromis.'

faqs_inflatable:
  title: 'Întrebări frecvente Bărci Gonflabile'
  subtitle: 'Întrebări comune despre șalupele, caiacurile și bărcile noastre gonflabile.'
  columns: 2
  items:
    - title: 'Ce materiale sunt folosite în bărcile gonflabile afarer?'
      description: 'Folosim PVC de calitate militară (1100 denier) și cauciuc premium Hypalon/CSM, în funcție de model. Ambele materiale sunt stabilizate UV, rezistente la abraziune și conforme cu reglementările UE REACH și RoHS.'
    - title: 'Cât timp rezistă bărcile gonflabile?'
      description: 'Cu îngrijire corespunzătoare, o barcă gonflabilă din PVC de calitate rezistă 7—0 ani, în timp ce modelele din Hypalon pot rezista 15—0 de ani. Curățarea regulată, protecția UV și depozitarea corectă prelungesc semnificativ durata de viață.'
    - title: 'Ce întreținere este necesară pentru o barcă gonflabilă?'
      description: 'Întreținerea de bază include clătirea cu apă dulce după fiecare utilizare (mai ales în apă sărată), uscarea înainte de depozitare, verificarea anuală a garniturilor supapelor și aplicarea de protector UV pe tuburi. Evitați expunerea prelungită la soare când nu este în uz.'
    - title: 'Pot fi folosite bărcile gonflabile în apă sărată?'
      description: 'Da. Toate bărcile gonflabile afarer sunt proiectate atât pentru apă dulce, cât și pentru apă sărată. Recomandăm clătirea cu apă dulce și uscarea temeinică după expunerea la apă sărată pentru a preveni coroziunea fitingurilor și cristalizarea sării în țesătură.'
    - title: 'Cum depozitez o barcă gonflabilă?'
      description: 'Dezaerisiți, curățați și uscați complet barca înainte de depozitare. Rulați lejer (evitați pliurile ascuțite), depozitați într-un loc răcoros și uscat, ferit de lumina directă a soarelui și păstrați departe de podelele de beton pentru a preveni absorbția umidității.'
    - title: 'Care este capacitatea de greutate a bărcilor gonflabile afarer?'
      description: 'Capacitățile de greutate variază de la 290 kg pentru cele mai mici modele până la peste 2000 kg pentru ambarcațiunile comerciale mai mari. Fiecare pagină de produs listează sarcina maximă pentru modelul dumneavoastră specific.'

faqs_sup:
  title: 'Întrebări frecvente SUP'
  subtitle: 'Întrebări comune despre plăcile noastre de paddleboarding.'
  columns: 2
  items:
    - title: 'Ce dimensiuni de plăci SUP sunt disponibile?'
      description: 'Oferim plăci SUP de la 9 ft la 12 ft, inclusiv modele all-round, touring, yoga și modele speciale. Cele mai vândute modele includ Tropical Breeze (10 ft) și Ocean Voyager (11 ft).'
    - title: 'Ce este construcția drop-stitch?'
      description: 'Construcția drop-stitch folosește mii de fire de poliester care conectează stratul superior și inferior al plăcii, permițând menținerea unei presiuni ridicate a aerului (15-20 PSI) și obținerea unei platforme rigide și stabile. Acesta este standardul industrial pentru SUP-urile gonflabile premium.'
    - title: 'Care este limita de greutate pentru plăcile SUP?'
      description: 'Plăcile noastre SUP suportă până la 150 kg în funcție de model și volum. Leviathan Wake este modelul nostru cu cea mai mare capacitate, proiectat pentru utilizatori mai grei și utilizare la yoga.'
    - title: 'Oferiți pachete complete SUP?'
      description: 'Da. Fiecare placă SUP este livrată cu un pachet complet, incluzând o paddă din aluminiu din 3 piese, pompă de mână de înaltă presiune, lesă spiralată, rucsac de călătorie și kit de reparații. Unele modele includ și un set de aripioare detașabile.'
    - title: 'Care este garanția pentru plăcile SUP?'
      description: 'Toate plăcile SUP afarer beneficiază de o garanție de un an împotriva defectelor de fabricație, inclusiv defectarea cusăturilor, defecte ale supapelor și delaminarea materialului în condiții normale de utilizare.'
    - title: 'Cât timp durează umflarea unei plăci SUP?'
      description: 'Folosind pompa de mână inclusă, umflarea completă la 15 PSI durează aproximativ 8—2 minute. Pentru umflare mai rapidă, recomandăm pompa noastră electrică afarer 12V, care umflă o placă în mai puțin de 4 minute.'


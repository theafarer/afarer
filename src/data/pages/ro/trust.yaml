  items:
    - title: 'Inspecția Materiilor Prime'
      description: 'Fiecare rolă de țesătură PVC este testată pentru grosime, rezistență la tracțiune și rezistență UV înainte de a intra în producție.'
      icon: 'tabler:search'
    - title: 'QC în Proces'
      description: 'Cusăturile sudate, instalațiile supapelor și îmbinările camerelor sunt inspectate la fiecare stație în timpul asamblării.'

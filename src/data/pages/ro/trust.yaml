warranty_section:
  title: Garanție și suport post-vânzare
  subtitle: Stăm în spatele fiecărui produs cu termeni clari de garanție, procesare rapidă a cererilor de despăgubire și piese de schimb originale.
  items:
    - title: Garanție de 2 Ani
      desc: Toate produsele afarer beneficiază de o garanție de 2 ani împotriva defectelor de fabricație — cusături defecte, valve defecte și delaminarea materialului în condiții normale de utilizare.
    - title: Suport pe viață pentru piese de schimb
      desc: Piese de schimb originale —supape, kituri de reparații, aripioare, inele D —disponibile pentru toate modelele. Păstrăm mucelele și sculele de producție minimum 5 ani după încetarea producției.
    - title: Răspuns la cereri în 48 de ore
      desc: Cererile de garanție sunt confirmate în termen de 48 de ore. Plăcile de schimb sunt expediate în termen de 10 zile lucrătoare pentru cererile aprobate.
    - title: Rețea globală de reparații
      desc: Centre de reparații autorizate în peste 15 țări. Truse de reparații pe teren disponibile pentru operațiuni la distanță. Ghiduri de reparații DIY pentru daune minore.
    - title: Suport clienți OEM
      desc: Manageri de cont dedicați pentru partenerii B2B. Analize trimestriale ale afacerii, planificarea stocurilor și suport de marketing co-branded.
    - title: Pachet de certificare
      desc: Documentație completă de conformitate furnizată cu fiecare expediție — Declarație CE, rapoarte de testare, fișe cu date de securitate a materialelor.
      link: /contact

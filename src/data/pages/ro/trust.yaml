features3_certifications:
  title: Certificări și Conformitate
  subtitle: Fiecare produs este testat independent și certificat conform standardelor internaționale.
  columns: 3
  isBeforeContent: true
  items:
    - title: Certificare CE
      description: Toate SUP-urile, caiacurile, șalupele și SUP-urile afarer îndeplinesc standardul european de siguranță CE pentru ambarcațiuni de agrement. Fiecare produs trece prin testare de presiune, flotabilitate și încărcare înainte de a părăsi fabrica.
      icon: tabler:certificate
    - title: BSCI
      description: Unitatea noastră de 12.000 m² din Qingdao funcționează sub un sistem de management al calității ISO 9001. Fiecare lot de producție este trasabil, documentat și inspectat.
      icon: tabler:clipboard-check
    - title: Conformitate Socială BSCI
      description: Suntem certificați BSCI, asigurând practici de muncă etice, condiții de muncă sigure și responsabilitate de mediu în întregul nostru lanț de aprovizionare.
      icon: tabler:users
    - title: REACH și RoHS
      description: Toate materialele —PVC, Hypalon, spumă EVA, adezivi —respectă reglementările UE REACH și RoHS. Fără substanțe restricționate, fără compromisuri.
      icon: tabler:flask
    - title: Laborator de Testare Materiale
      description: Laboratorul intern de materiale testează rezistența la tracțiune, rezistența UV, integritatea cusăturilor și abraziunea pentru fiecare lot de țesătură înainte de producție.
      icon: tabler:microscope
    - title: Garanție de 2 ani
      description: Fiecare produs afarer vine cu o garanție de doi ani împotriva defectelor de fabricație. Garantăm ceea ce construim.
      icon: tabler:shield-check
testimonials:
  tagline: Încrederea Clienților
  title: Ce spun clienții noștri
  subtitle: De la vâslași începători la operatori profesioniști de flotă —vedeți de ce au încredere în afarer.
  items:
    - content: Am echipat întreaga noastră flotă de închiriat cu SUP-uri afarer. Două sezoane mai târziu, zero defecțiuni. Certificarea CE a făcut aprobarea asigurării fără probleme.
      name: Marco V.
      title: Operator turistic, Croația
    - content: Ca un cumpărător pentru prima dată, eram nervos în privința calității. Documentația ISO și rapoartele de testare pe care le-au împărtășit mi-au dat încredere deplină.
      name: James T.
      title: Proprietar SUP Explorer 11, Canada
    - content: Colaborăm cu afarer pentru unitățile noastre de patrulare de coastă. Procesul lor de QC este consecvent în fiecare lot —această fiabilitate contează în operațiunile critice pentru misiune.
      name: Lt. Cmdr. Andres
      title: Achiziții navale, Filipine
steps2_manufacturing:
  title: Cum asigurăm calitatea
  subtitle: De la inspecția materiilor prime până la testarea finală de presiune —fiecare produs trece printr-un lanț riguros de calitate.
  items:
    - title: Inspecția Materiilor Prime
      description: Fiecare rolă de țesătură PVC este testată pentru grosime, rezistență la tracțiune și rezistență UV înainte de a intra în producție.
      icon: tabler:search
    - title: QC în Proces
      description: Cusăturile sudate, instalațiile supapelor și îmbinările camerelor sunt inspectate la fiecare stație în timpul asamblării.
      icon: tabler:eye
    - title: Testare de Presiune
      description: Fiecare produs gonflabil este umflat la 1,5x PSI-ul nominal și menținut timp de 24 de ore pentru a verifica reținerea aerului și integritatea cusăturilor.
      icon: tabler:wind
    - title: Inspecție Finală
      description: Fiecare unitate este inspectată pentru finisaj, hardware și ambalare înainte de a fi aprobată pentru expediere. Probele din loturi merg la laboratorul nostru pentru testare distructivă.
      icon: tabler:clipboard-check

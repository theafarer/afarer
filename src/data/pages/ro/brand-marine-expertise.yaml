hero:
  tagline: Expertiză navală
  title: Decenii de inginerie marină<br />în fiecare carenă
  subtitle: afarer combină știința avansată a materialelor, producția de precizie și testarea în condiții reale pentru a produce ambarcațiuni care performează atunci când contează.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Echipa afarer de inginerie marină și R&D la lucru
expertise_materials:
  tagline: Știința Materialelor
  title: Alegerea materialului potrivit<br />pentru fiecare aplicație
  subtitle: Lucrăm cu trei materiale de bază —fiecare selectat pentru cazuri de utilizare specifice și cerințe de performanță.
  columns: 3
  items:
    - title: PVC de calitate marină
      description: 1100 denier PVC fabric —our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and SUPs where weight and cost efficiency matter.
      icon: tabler:droplet
    - title: Hypalon/CSM premium
      description: Rezistență chimică superioară și stabilitate UV. Bărcile Hypalon pot dura 15-20 de ani cu îngrijirea corespunzătoare. Recomandat pentru aplicații comerciale, de salvare și militare unde durabilitatea pe termen lung este critică.
      icon: tabler:shield
    - title: Fibră de sticlă și aluminiu
      description: Carence din fibră de sticlă în V adânc pentru SUP-uri și bărci de patrulare —performanță de tăiere a valurilor în condiții dificile. Carence din aluminiu pentru ambarcațiuni comerciale grele care necesită rezistență maximă și capacitate de încărcare.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Capabilități de producție
  title: Producție de precizie<br />la fiecare pas
  subtitle: Instalația noastră de 12.000 m² este echipată cu utilaje specializate pentru fiecare etapă de producție.
  columns: 2
  items:
    - title: Tăiere CNC
      description: Tăierea controlată de calculator asigură panouri de țesătură precise, repetabile, cu deșeuri minime. Fiecare piesă se potrivește exact cum a fost proiectată.
      icon: tabler:cpu
    - title: Sudarea de înaltă frecvență
      description: Sudarea industrială HF creează cusături mai rezistente decât materialul de bază. Controlul constant al temperaturii și presiunii asigură etanșeizare ermetică în fiecare serie de producție.
      icon: tabler:bolt
    - title: Ansamblul miezului drop-stitch
      description: Mii de fire de poliester conectează straturile superioare și inferioare de țesătură, permițând umflarea la presiune înaltă (15-20 PSI) pentru plăci SUP și podele rigide și stabile.
      icon: tabler:building-arch
    - title: Testare sub presiune
      description: Fiecare produs inflabil este testat la presiune înainte de expediere. Tuburile SUP sunt testate la 1,5x presiunea nominală —dacă rezistă acolo, va performa pe apă.
      icon: tabler:wind
    - title: Testarea rezistenței cusăturilor
      description: Probele aleatorii din fiecare lot de producție sunt supuse testării distructive a rezistenței cusăturilor. Rezultatele sunt înregistrate și trasabile la serii specifice de producție.
      icon: tabler:files
    - title: Testare pe apă
      description: Fiecare model SUP este supus probelor pe mare înainte de certificare. Testarea în condiții reale de coastă validează performanța, manevrabilitatea și stabilitatea.
      icon: tabler:droplet
expertise_design:
  tagline: Design și inginerie
  title: Proiectat pentru condiții reale
  subtitle: Filosofia noastră de proiectare începe cu modul în care barca va fi utilizată —apoi construiește ingineria în jurul acestui caz de utilizare.
  items:
    - title: Proiectarea cocii Deep-V
      description: Cocăile noastre din fibră de sticlă au unghiuri de deadrise calculate și optimizate pentru lungimea și utilizarea prevăzută a fiecărui model. Un V mai pronunțat pentru performanțe în ape agitate, unul mai puțin adânc pentru stabilitate.
    - title: Siguranță cu mai multe camere
      description: Fiecare ambarcațiune are 3-7 camere de aer independente. Dacă un compartiment este avariat, camerele rămase mențin ambarcațiunea pe linia de plutire și funcțională.
    - title: Design ergonomic
      description: Poziția consolei, înălțimea tuburilor și amplasarea scaunului sunt concepute pentru confortul operatorului în utilizare prelungită —fie că patrulează, pescuiește sau transportă.
    - title: Configurație personalizată
      description: Culori pentru tuburi, configurația consolei, capacitatea rezervorului, suporturi pentru accesorii — fiecare model poate fi personalizat pentru a răspunde cerințelor operaționale specifice.

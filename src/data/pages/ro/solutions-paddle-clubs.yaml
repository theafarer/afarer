meta:
  title: Paddle Club Fleet Solutions | {SITE}
  description: Complete SUP fleet programs for paddle clubs. Start-up packages, professional fleets, competition boards, custom branding, and replacement parts support.
hero:
  tagline: Paddle Clubs
  title: Build Your Paddle Club<br />With Afarer
  subtitle: Everything you need to launch, run, and grow a successful paddle club — from equipment to training to replacement parts.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Membri ai paddle club-ului pe plăci SUP Afarer asortate
benefits:
  title: Beneficiile flotei pentru club
  subtitle: De ce cluburile de paddle din peste 50 de țări aleg Afarer ca partener de echipamente.
  items:
    - metric: 40%+
      label: Economii la costurile flotei
      detail: Comparativ cu prețul de retail, cu reduceri pentru achiziții în vrac destinate cluburilor
    - metric: 48h
      label: Înlocuire piese
      detail: Timp de inactivitate minim pentru flota dumneavoastră de închirieri
    - metric: 500+
      label: Cicluri de închiriere
      detail: Durabilitate de nivel comercial pentru fiecare placă
    - metric: 5+ ani
      label: Durata de viață a flotei
      detail: Cu întreținere și îngrijire corespunzătoare
packages:
  title: Programe de flote pentru cluburi
  subtitle: Alegeți programul de flotă care se potrivește dimensiunii și ambiției clubului dumneavoastră.
  items:
    - name: Start-Up Package
      tagline: 'Best for: New clubs, up to 30 members'
      features:
        - 10 SUP boards + paddles + vests
        - 2 pumps + 1 repair kit
        - Club branding on boards
        - Launch guide + safety checklist
        - Ghid de lansare + listă de verificare a siguranței
        - Certificat CE — toate echipamentele
      cta_text: Începe-ți clubul
    - name: Professional Fleet
      tagline: 'Best for: Established clubs, 50-100 members'
      features:
        - 30 SUP boards + paddles + vests
        - 5 pumps + 2 repair kits
        - Custom club colors + logo
        - Replacement parts program (15% discount)
        - Staff training session
        - Sesiune de instruire a personalului (online)
        - Certificat CE — toate echipamentele
      popular: true
      cta_text: Construiți-vă flota
    - name: Competition Fleet
      tagline: 'Best for: Racing clubs, events, competitions'
      features:
        - Peste 50 de plăci de cursă / performanță
        - Full accessory set
        - Event support kit
        - Piese prioritare (expediere în 24h)
        - Manager de cont dedicat
        - Opțiune de uniforme personalizate pentru echipă
        - Certificat CE — toate echipamentele
      cta_text: Obțineți flota de competiție
training:
  title: Pachete pentru centre de pregătire
  subtitle: Tot ce are nevoie o școală de SUP pentru a organiza cursuri profesionale de certificare.
  items:
    - name: Instructor Starter
      features:
        - 5 plăci SUP premium (nivel instructor)
        - 5 vâsle din carbon pentru demonstrații
        - 5 veste de salvare (mărime instructor)
        - Ghid de curriculum de instruire
        - Echipamente certificate CE
    - name: School Full Set
      features:
        - 20 de plăci SUP (mix elevi + instructori)
        - 20 de padele + 20 de veste de salvare (dimensiuni diferite)
        - 10 dispozitive de flotabilitate pentru începători
        - 4 pompe + kituri de reparații
        - Curriculum de instruire & suport pentru certificare
        - Echipamente certificate CE
features:
  title: De ce aleg cluburile afarer
  subtitle: Calitate constantă, piese livrate rapid și prețuri avantajoase la volum, create pentru cluburile în dezvoltare.
  items:
    - title: Peste 500 de cicluri de închiriere
      description: Plăcile de calitate comercială rezistă sezoane întregi de utilizare zilnică.
      icon: tabler:shield-check
    - title: Culori personalizate
      description: Aliniați identitatea clubului dvs. cu culori personalizate și logo pe plăci.
      icon: tabler:palette
    - title: Prețuri de volum
      description: Reduceri de volum pentru comenzi de flotă de 10+ plăci.
      icon: tabler:discount
    - title: Piese cu livrare rapidă
      description: Piesele de schimb sunt expediate în termen de 48 de ore.
      icon: tabler:truck-delivery
    - title: Suport pentru creșterea cluburilor
      description: Consultanță privind programele de membru, prețurile și organizarea de evenimente.
      icon: tabler:trending-up
    - title: Certificat CE
      description: Toate echipamentele respectă standardele internaționale de siguranță.
      icon: tabler:certificate
cta:
  title: Gata să vă lansați propriul paddle club?
  subtitle: Obține o ofertă pentru flota clubului tău sau descarcă ghidul nostru de pornire a unui club.
  actions:
    - text: Aplică pentru Flotă de Club
      href: /contact?package=club
      variant: primary
    - text: Descărcați ghidul pentru cluburi
      href: /resources/download-catalog
      variant: secondary

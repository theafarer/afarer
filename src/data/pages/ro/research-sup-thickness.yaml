meta:
  title: Cum să alegeți grosimea SUP — Analiză inginerească | {SITE}
  description: 'Ghid tehnic privind grosimea plăcilor SUP gonflabile: cum diferă plăcile de 4", 5" și 6" în ceea ce privește rigiditatea, greutatea, stabilitatea, ținerea direcției și performanța. Recomandări de grosime pentru touring, yoga, surfing, curse și canotaj all-around.'
back_text: Înapoi la cercetare
hero:
  tagline: Inginerie
  title: Cum să alegeți grosimea unui SUP — Analiză inginerească
  subtitle: 6 min de lectură
content_html: >-
  <h2>Cele trei grosimi standard</h2>


  <h3>4" (10 cm) – Turism &amp; performanță</h3>

  <ul>
    <li>Cea mai mare rigiditate – flex minim sub sarcină</li>
    <li>Cea mai ușoară – mai puțin material, volum de aer mai mic</li>
    <li>Stabilitate direcțională excelentă – balans lateral redus</li>
    <li>Cea mai rapidă – rezistență redusă, alunecare mai ușoară</li>
    <li>Ideală pentru: turism, curse, vâslit de fitness, vâslitori experimentați</li>
  </ul>


  <h3>5" (12.7 cm) – Utilizare generală</h3>

  <ul>
    <li>Rigiditate bună – raport echilibrat între flexibilitate și rigiditate</li>
    <li>Greutate moderată – utilizare standard de material</li>
    <li>Stabilitate primară și secundară bună</li>
    <li>Ideală pentru: vâslit recreațional, începători, utilizare ocazională pe lacuri și râuri</li>
  </ul>


  <h3>6" (15.2 cm) – Stabilitate &amp; yoga</h3>

  <ul>
    <li>Cea mai mare stabilitate primară – flotabilitate masivă</li>
    <li>Cea mai grea – mai mult material PVC, volum de aer mai mare</li>
    <li>Cea mai lentă – rezistență mai mare, alunecare mai greu de menținut</li>
    <li>Ideală pentru: yoga/fitness, vâslitori cu greutate mare (peste 100 kg), ape foarte agitate</li>
  </ul>


  <h2>Analiză inginerească</h2>

  <p>Rigiditatea unei plăci SUP pneumatice este determinată de presiunea internă a aerului și de momentul de inerție al secțiunii transversale a plăcii. La 20 PSI, o placă de 4" prezintă aproximativ cu 30% mai puțină deformare sub sarcină decât o placă de 6" cu aceeași lățime și lungime.
  Stabilitatea primară provine din lățimea liniei de plutire și din flotabilitate; stabilitatea secundară este influențată de forma bordului (rail) și de lățimea plăcii.</p>


  <h2>Grosimea în funcție de greutatea vâslitorului</h2>

  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Greutatea vâslitorului</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Grosime recomandată</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Sub 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" sau 6"</td></tr>
      <tr><td class="p-3 border">Peste 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>


  <h2>Grosime vs. compromisul PSI</h2>

  <p>O concepție greșită frecventă este că un PSI mai mare poate compensa o grosime excesivă. La 25 PSI, o placă de 6" prezintă mai multă flexibilitate decât o placă de 4" la 15 PSI, deoarece momentul geometric de inerție domină ecuația rigidității. Pentru vâslitorii orientați spre performanță, o
  placă mai subțire la presiune mai mică depășește o placă mai groasă la presiune mai mare.</p>


  <h2>Gama afarer</h2>

  <ul>
    <li><strong>Plăci de 4":</strong> seria Cheetah Touring – SUP-uri de turism de 12' x 30" x 4" pentru fitness și vâslit pe distanțe lungi</li>
    <li><strong>Plăci de 5":</strong> seria Cheetah All-Round – 10'6" x 32" x 5" pentru utilizare recreațională</li>
    <li><strong>Plăci de 6":</strong> seria Cheetah Ultra-Stable – 10' x 34" x 6" pentru yoga, vâslitori cu greutate mare și platforme de fotografie</li>
  </ul>

  <p>Toate plăcile utilizează miezuri drop-stitch de 1,680 DTEX, cu presiune nominală de 20 PSI și laminate PVC de 1,2 mm.</p>

hero:
  tagline: Producător premium de plăci SUP gonflabile și partener OEM
  title: Producător premium de plăci SUP pneumatice<br />&amp; partener OEM
  subtitle: |
    Proiectăm și fabricăm plăci de paddle gonflabile pentru branduri globale,<br />
    resorturi, paddle club-uri și afaceri de aventură acvatică.<br />
    Partener OEM/ODM cu o unitate de producție de 12,000m² și producție certificată CE.
  taglineSection: Soluții SUP gonflabile de calitate comercială pentru stațiuni, cluburi, retaileri și mărci de sporturi nautice.
  actions:
    - variant: primary
      text: Solicitați o ofertă OEM
      href: /oem-odm-manufacturer
      icon: tabler:package
    - text: Descarcă catalogul
      href: /resources/download-catalog
      icon: tabler:file-text
    - text: Explorați soluțiile SUP
      href: /solutions
      icon: tabler:building
  image:
    src: ~/assets/images/hero-image.webp
    alt: Plăci SUP gonflabile afarer la malul unei stațiuni tropicale — flotă comercială pentru afaceri pe apă
who_we_serve:
  tagline: Cui ne adresăm
  title: Soluții complete de SUP pentru orice afacere pe apă
  subtitle: Echipamente proiectate special, producție și suport de business pentru patru piețe-cheie.
  items:
    - title: Cluburi de paddle
      keywords: Echipamente pentru cluburi SUP, echipamente pentru școli de vâslit, flotă de închirieri
      description: Flote de SUP durabile, prețuri de club și programe de piese de schimb pentru cluburile de paddle și școli.
      icon: tabler:users
      cta: Descoperiți soluții pentru paddle club-uri
      link: /solutions/paddle-clubs
    - title: Stațiuni și hoteluri
      keywords: activități acvatice în resorturi, echipamente de plajă pentru hoteluri, experiența oaspeților
      description: Programe complete de flote SUP cu branding personalizat, instruirea personalului și pachete optimizate pentru ROI.
      icon: tabler:building
      cta: Creați experiența acvatică a stațiunii dumneavoastră
      link: /solutions/resorts-hotels
    - title: Parteneri de retail
      keywords: Angro SUP, retaileri outdoor, magazine de articole sportive
      description: Gamă completă de produse, materiale de marketing, opțiuni de dropshipping și marje competitive de en-gros.
      icon: tabler:shopping-cart
      cta: Deveniți partener retail
      link: /solutions/retail-partners
    - title: Branduri SUP noi
      keywords: SUP private label, brand de SUP personalizat, plăci cu padele OEM
      description: Producție OEM/ODM integrală — design, prototipare, producție de masă și logistică globală.
      icon: tabler:package
      cta: Construiți-vă brandul SUP
      link: /oem-odm-manufacturer
proof_points:
  title: De încredere pentru afacerile nautice din întreaga lume
  subtitle: Decenii de experiență în inginerie navală, care alimentează programe SUP profitabile.
  items:
    - metric: 10+
      label: Ani de experiență
      detail: Din 2012
    - metric: 50+
      label: Țări deservite
      detail: Rețea globală de distribuție
    - metric: 15,000+
      label: Unități produse anual
      detail: Capacitate de producție certificată CE
    - metric: 100%
      label: Certificat CE
      detail: Conform ISO 9001, BSCI, REACH
business_solutions:
  tagline: Cum vă putem ajuta
  title: Partenerul dumneavoastră, de la concept la venituri
  subtitle: Patru capacități-cheie care ajută afacerile din sectorul acvatic să se lanseze, să funcționeze și să crească.
  items:
    - title: Echipament profesional
      description: Plăci SUP de calitate comercială proiectate pentru utilizare zilnică în regim de închiriere, peste 500 de cicluri cu întreținere minimă.
      icon: tabler:shield-check
    - title: Producție OEM
      description: Producție completă de marcă proprie, de la design și prototipare până la producția de serie și livrarea globală.
      icon: tabler:package
    - title: Suport pentru afaceri
      description: Instruirea personalului, materiale de marketing, programe de piese de schimb și management dedicat de cont.
      icon: tabler:headset
    - title: Logistică globală
      description: FOB Qingdao, CIF pentru porturile principale, livrare door-to-door în peste 50 de țări, cu suport vamal.
      icon: tabler:truck-delivery
oem_section:
  tagline: Lansează-ți brandul
  title: De la idee la piață în 16 săptămâni
  subtitle: Partenerul tău complet pentru lansarea unui brand SUP — design, prototip, fabricație și livrare.
  steps:
    - number: '01'
      title: Idee și brief
      desc: Împărtășiți-ne viziunea, piața țintă și specificațiile.
    - number: '02'
      title: Design și inginerie
      desc: Modelare 3D, selecția materialelor și design grafic personalizat.
    - number: '03'
      title: Prototip și Validare
      desc: Producție de mostre cu certificare CE și testare a calității.
    - number: '04'
      title: Producție în masă
      desc: Producție la scară completă, cu control al calității în linie și suport pentru audituri de fabrică.
    - number: '05'
      title: Livrare globală
      desc: Logistică FOB Qingdao, CIF în porturile principale, livrare door-to-door.
  cta: Începeți călătoria brandului dvs.
  cta_link: /oem-odm-manufacturer
cta:
  title: Gata să vă construiți afacerea de aventuri pe apă?
  subtitle: Fie că lansați un club, dotați o stațiune sau construiți un brand — suntem aici pentru a vă ajuta.
  actions:
    - variant: primary
      text: Începeți proiectul dumneavoastră
      href: /contact
      icon: tabler:send
    - text: Descarcă ghidul OEM
      href: /resources/download-catalog

meta:
  title: 'Plăci SUP gonflabile de performanță — Afarer Water Sports | {SITE}'
  description: 'afarer proiectează SUP-uri gonflabile de performanță pentru ape deschise, touring, yoga și aventură. Rigiditate drop-stitch, testată plăcuță cu plăcuță sub presiune, cu parteneriate exclusive pe țări și colecții co-branded limitate. Descoperiți colecția.'
  keywords:
    - 'sup gonflabil de performanță'
    - 'placă paddle gonflabilă premium'
    - 'brand de plăci sup gonflabile'
    - 'sup gonflabil touring'
    - 'placă paddle co-branded'
    - 'distribuitor sup pe țări'
hero:
  tagline: Plăci SUP gonflabile de performanță
  title: 'Mergi mai departe.<br />Vâslește mai puternic.'

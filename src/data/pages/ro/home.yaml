oem_section:
  tagline: Colecții Co-Brand
  title: De la Idee la Apă — Ediții Co-Branded
  subtitle: 'Pentru partenerii care își doresc mai mult decât un produs din catalog: colecții co-branded limitate, proiectate, dezvoltate și construite împreună cu afarer — fiecare placă rămânând un produs afarer.'
  steps:
    - number: '01'
      title: Idee și brief
      desc: Împărtășiți-ne viziunea, piața țintă și specificațiile.
    - number: '02'
      title: Design și inginerie
      desc: Modelare 3D, selecția materialelor și design grafic personalizat.
    - number: '03'
      title: Prototip și Validare
      desc: Producție de mostre cu certificare CE și testare a calității.
    - number: '04'
      title: Producție în masă
      desc: Producție la scară completă, cu control al calității și puncte de verificare în fiecare etapă.
    - number: '05'
      title: Livrare globală
      desc: Logistică FOB Qingdao, CIF în porturile principale, livrare door-to-door.
  cta: Explorează Co-Branding

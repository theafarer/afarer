meta:
  title: 'Prezență globală — producător SUP în peste 50 de țări | {SITE}'
  description: 'afarer exportă plăci de SUP gonflabile și bărci în peste 50 de țări de pe toate continentele. Producător și furnizor profesionist pentru mărci, distribuitori și flote.'
  keywords:
    - 'producător global SUP'
    - 'exportator paddle board'
    - 'fabrica SUP China'
    - 'furnizor profesionist SUP'
hero:
  tagline: Prezență globală
  title: Deservim 50+ țări<br />pe fiecare continent
  subtitle: De la operatorii europeni de patrulare de coastă la distribuitorii australieni de sporturi nautice și echipele de salvare din Orientul Mijlociu —bărcile afarer sunt pe apă la nivel mondial.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: afarer — producție și distribuție marină globală
stats:
  title: Prezență globală
  stats:
    - title: Țări
      amount: 50+
    - title: Piețe de export
      amount: Europa, Americi, Asia, Orientul Mijlociu, Oceania
    - title: Producție
      amount: Qingdao, China
    - title: Depozit în SUA
      amount: Montclair, CA
features3_markets:
  tagline: Piețe principale
  title: Expertiză regională<br />pentru cerințe locale
  subtitle: Înțelegem că piețele diferite au cerințe de reglementare, preferințe și cazuri de utilizare diferite.
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa și Regatul Unit
      description: Produse certificate CE care îndeplinesc standardele EN ISO 6185. Cerere puternică pentru SUP-uri, bărci inflabile și plăci SUP pe piețele UE. Distribuitorii britanici apreciază termenul nostru rapid de livrare.
      icon: tabler:map-pin
    - title: America de Nord
      description: Producție aprobată de Garda de Coastă a SUA. Depozit în SUA în Montclair, CA pentru livrare rapidă pe Coasta de Vest. Cerere în creștere pentru bărci de pescuit, ambarcațiuni de salvare și SUP-uri recreative.
      icon: tabler:map-pin
    - title: Australia și Oceania
      description: Piață puternică pentru bărci SUP și tender-e inflabile. Distribuitorii australieni apreciază bărcile noastre Hypalon pentru rezistența UV în condiții solare dure. Expediere rapidă de la instalația noastră din Asia.
      icon: tabler:map-pin
    - title: Orientul Mijlociu
      description: Cerere în creștere pentru bărci de patrulare și salvare. SUP-urile noastre cu carenă din aluminiu sunt populare printre operatorii de pază de coastă și securitate. Configurații personalizate pentru medii cu temperaturi ridicate.
      icon: tabler:map-pin
features3_distribution:
  tagline: Rețea de distribuție
  title: Parteneriat cu distribuitori<br />la nivel mondial
  subtitle: Lucrăm cu distribuitori consacrați de echipamente marine, mărci de sporturi nautice și agenții guvernamentale de achiziții.
  isBeforeContent: false
  columns: 3
  items:
    - title: Programe Co-Brand
      description: Fabricare sub marcă privată pentru mărci globale de sporturi nautice. Ne ocupăm de tot, de la design la producție la drop-shipping.
      icon: tabler:building
    - title: Rețea de distribuitori
      description: Distribuitori autorizați în peste 20 de țări dețin stocuri și oferă asistență locală. Întrebările noilor distribuitori sunt binevenite.
      icon: tabler:users
    - title: Guvernamental & Instituțional
      description: Furnizare directă către paze de coastă, organizații de căutare și salvare și programe militare de achiziții. Conformitate cu cerințele de achiziții instituționale.
      icon: tabler:building-community
steps2_logistics:
  title: Logistică globală și suport
  subtitle: De la fabrică la destinație —gestionăm întregul lanț de aprovizionare.
  items:
    - title: Opțiuni de livrare
      description: Transport maritim (FOB Qingdao), transport aerian pentru comenzi urgente și curier expres pentru mostre și piese de schimb.
      icon: tabler:truck-delivery
    - title: Depozit în SUA
      description: 'Stoc păstrat în Montclair, CA pentru livrare rapidă în întreaga Americă de Nord. Coasta de Vest: 2-3 zile, Central: 3-4 zile, Coasta de Est: 4-5 zile.'
      icon: tabler:building-warehouse
    - title: Piese de schimb
      description: Piese de schimb originale afarer și consumabile stocate pe tot parcursul anului. Piesele comune se expediază în termen de 24 de ore.
      icon: tabler:package
    - title: Asistență tehnică
      description: Linie directă către echipa noastră de inginerie pentru întrebări tehnice, sfaturi de reparații și suport de recondiționare. Susținem bărcile construite acum 20 de ani.
      icon: tabler:headset
cta:
  title: Doriți să deveniți distribuitor?
  subtitle: Ne extindem activ rețeaua noastră de distribuție. Contactați echipa noastră de export pentru a discuta oportunitățile de parteneriat.
  actions:
    - variant: primary
      text: Solicitare de parteneriat
      href: /contact
    - text: Vedeți gama noastră de produse
      href: /products

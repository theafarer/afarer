features3_what_we_build:
  title: Ce construim
  subtitle: 'Am început într-un atelier de pe coastă, cu o singură barcă și o convingere fermă: produsele marine trebuie proiectate ca și cum ar conta cu adevărat, pentru că așa este. Astăzi livrăm în peste 40 de țări, dar fiecare carenă trece în continuare prin aceleași mâini care au fondat compania.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Plăci SUP
      description: Plăci SUP gonflabile de la 9 ft la 12 ft. Proiectate pentru touring, yoga, pescuit și uz familial.
      icon: tabler:ship
    - title: SUP-uri gonflabile
      description: Plăci SUP gonflabile din PVC, de la 9 ft la 12 ft. Ușoare, rezistente și ușor de depozitat.
      icon: tabler:speedboat
    - title: Pachete SUP premium
      description: SUP-uri compacte, de specificații înalte, fabricate la comandă pentru a corespunde cerințelor mărcii sau flotei dumneavoastră.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accesorii
      description: Padele, pompe, huse, saci impermeabili și componente electronice. Toate perfect adaptate plăcilor noastre.
      icon: tabler:package
    - title: Recondiționare și reparații
      description: Reparații plăci în fabrică, înlocuire pad-uri și modernizări de accesorii.
      icon: tabler:tool
    - title: Construcții personalizate
      description: Proiectare realizată proiect cu proiect pentru clienți comerciali, științifici și militari.
      icon: tabler:hammer
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
    alt: Discuții privind proiectarea și ingineria ambarcațiunilor

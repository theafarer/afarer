  body: |
    afarer este mai mult decât o simplă fabrică —suntem parteneri pentru branduri, operatori și profesioniști care cer ce este mai bun în echipamentele sportive acvatice.
story:
  tagline: Povestea noastră
  title: De la începuturi modeste la acoperire globală
  milestones:
    - year: '2012'
      title: Fondare
      description: afarer a fost fondată în Qingdao cu viziunea de a produce produse gonflabile de înaltă calitate pentru sporturi acvatice.
      image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
    - year: '2015'
      title: Extindere
      description: Ne-am extins facilitățile la 12.000 m² și am adăugat linii de producție avansate.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - year: '2018'
      title: Certificare
      description: Am obținut certificarea  și marcajul CE pentru toate liniile de produs.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
    - year: '2024'
      title: Centru de inovare
      description: Am înființat un centru dedicat de cercetare și dezvoltare cu facilități avansate de testare.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp

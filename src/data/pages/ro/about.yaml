meta:
  title: 'Despre afarer — Brand de SUP Gonflabil și Sporturi Nautice | {SITE}'
  description: 'afarer este un brand global de SUP-uri gonflabile și sporturi nautice, administrat de Aquafarer LLC (SUA) și dezvoltat de echipa noastră operațională din Qingdao. Descoperiți povestea, ingineria, calitatea certificată și programele de parteneriat pe țări.'
  keywords:
    - 'brand de sup gonflabil'
    - 'brand de bărci gonflabile'
    - 'brand de sporturi nautice'
    - 'distribuitor sup pe țări'
    - 'colecții sup co-branded'

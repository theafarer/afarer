meta:
  title: 'Certificări — CE, ISO 9001 și conformitate | {SITE}'
  description: 'Certificările de calitate afarer: CE (Directiva 2013/53/UE), ISO 9001:2015, BSCI. Conformitate și siguranță pentru un producător de plăci de SUP gonflabile și bărci.'
  keywords:
    - 'certificare CE paddle board'
    - 'ISO 9001 paddle board'
    - 'conformitate navală'
    - 'certificare paddle board'
hero:
  tagline: Certificări & Standarde
  title: Certificări de calitate<br />și standarde de conformitate
  subtitle: Produsele afarer sunt fabricate în conformitate cu standardele internaționale de siguranță marină, sistemele de management al calității și reglementările de mediu.
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: Certificările de calitate afarer și documentația de conformitate
content_certifications:
  tagline: Certificările noastre
  title: Calitate certificată,<br />recunoscută global
  subtitle: Fiecare produs afarer este susținut de certificări care demonstrează angajamentul nostru față de calitate, siguranță și responsabilitate față de mediu.
  items:
    - title: Certificat CE
      description: Toate produsele afarer respectă cerințele europene de marcare CE pentru ambarcațiunile de agrement, asigurând îndeplinirea standardelor de siguranță, sănătate și protecție a mediului.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Sistemul nostru de management al calității este certificat ISO 9001:2015, acoperind proiectarea, fabricarea și distribuția ambarcațiunilor inflabile și a echipamentelor marine.
      icon: tabler:clipboard-check
    - title: Marcaj UKCA
      description: Produsele vândute pe piața din Marea Britanie poartă marcajul UKCA, confirmând conformitatea cu reglementările britanice pentru echipamente marine și ambarcațiuni personale.
      icon: tabler:shield
    - title: Conform BSCI
      description: afarer este auditat BSCI (Business Social Compliance Initiative), demonstrând practici etice de fabricație, condiții de muncă echitabile și responsabilitate în lanțul de aprovizionare.
      icon: tabler:heart-handshake
    - title: Conform REACH
      description: Toate materialele utilizate în produsele afarer respectă reglementările UE REACH privind siguranța chimică, asigurând că nu există substanțe restricționate în PVC, Hypalon sau componentele noastre.
      icon: tabler:flask
    - title: Testarea materialelor
      description: Țesăturile sunt testate pentru rezistența la tracțiune, rezistența la rupere, degradarea UV și performanța la fisurare la rece. Fiecare lot de producție este eșantionat și verificat.
      icon: tabler:test-pipe
content_factory:
  tagline: Standarde de fabricație
  title: Excelență în fabricație<br />— construit conform specificațiilor
  subtitle: Instalația noastră de 12.000 m² funcționează sub protocoale stricte de control al calității în fiecare etapă de producție.
  list:
    - 'Inspecția materialelor la recepție: Toate materiile prime — țesătură PVC, Hypalon, aluminiu, placaj, adezivi — sunt testate față de specificații înainte de a intra în producție.'
    - 'Controlul calității în proces: fiecare etapă de producție are puncte de control QC documentate. Rezistența sudurilor, alinierea cusăturilor, montarea supapelor și cuplul de strângere al fitingurilor sunt verificate direct în linie.'
    - 'Testare la presiune: fiecare cameră gonflabilă este testată la o presiune de 1,25× presiunea nominală timp de 24–48 de ore. Scăderea presiunii trebuie să rămână sub 5% pentru a promova.'
    - 'Inspecție finală: produsele finite sunt verificate înainte de expediere pentru acuratețea dimensională, finisajul estetic, completitudinea accesoriilor și integritatea ambalajului.'
    - 'Trasabilitatea loturilor: fiecare produs are un număr de serie legat de evidențele loturilor de producție, permițând trasabilitatea completă de la materia primă până la produsul finit.'
content_safety:
  tagline: Standarde de siguranță maritimă
  title: Siguranța pe primul loc<br />— proiectat pentru funcționare fiabilă
  subtitle: Produsele afarer sunt proiectate și testate pentru a îndeplini standardele internaționale de siguranță marină pentru uz comercial și recreativ.
  items:
    - title: ISO 6185
      description: Bărcile inflabile respectă standardele ISO 6185 pentru construcție, stabilitate, flotabilitate și capacitate de încărcare.
      icon: tabler:sailboat
    - title: Standarde ABYC
      description: Sistemele electrice și de combustibil respectă standardele ABYC (American Boat & Yacht Council) pentru instalare și operare în siguranță.
      icon: tabler:bolt
    - title: Conformitate SOLAS
      description: Echipamentele de siguranță și dispozitivele de salvare respectă cerințele SOLAS (Safety of Life at Sea) acolo unde este cazul.
      icon: tabler:lifebuoy
cta:
  title: Aveți nevoie de produse certificate pentru proiectul dvs.?
  subtitle: Contactați echipa noastră pentru a discuta cerințele de certificare, documentația și conformitatea pentru piața dvs.
  actions:
    - variant: primary
      text: Solicită documentele de certificare
      href: /contact
    - text: Vezi pagina noastră despre calitate
      href: /quality

hero_text:
  tagline: Solicitați o ofertă
  title: Solicitați o ofertă<br />pentru proiectul dvs.
  subtitle: Spuneți-ne cerințele dvs. și echipa noastră va răspunde cu o ofertă detaliată în termen de 2 zile lucrătoare.
steps2_process:
  title: Cum funcționează
  subtitle: Patru pași simpli de la întrebare la ofertă.
  items:
    - title: 'Pasul 1: Trimiteți cerințele dumneavoastră'
      description: Completați formularul de mai jos cu tipul de produs, cantitatea și specificațiile. Cu cât oferiți mai multe detalii, cu atât oferta va fi mai precisă.
      icon: tabler:file-text
    - title: 'Pasul 2: Analizăm și consiliem'
      description: Echipa noastră de ingineri analizează cerințele dvs. și vă poate contacta pentru clarificări. Oferim recomandări privind configurarea produsului și opțiunile.
      icon: tabler:users
    - title: 'Pasul 3: Primiți oferta dumneavoastră'
      description: Primiți o ofertă detaliată, inclusiv prețuri unitare, MOQ, termen de livrare, condiții de plată și opțiuni de expediere. De obicei, în termen de 48 de ore.
      icon: tabler:currency-dollar
    - title: 'Pasul 4: Probă și producție'
      description: După acceptarea ofertei, trecem la producția de mostre (dacă este cazul) sau direct la producția de masă. Actualizări regulate pe tot parcursul procesului.
      icon: tabler:building-factory
content_form:
  tagline: Formular de ofertă
  title: Spuneți-ne despre proiectul dvs.
  subtitle: Toate câmpurile cu * sunt obligatorii.
  fields:
    - name: Product Type
      type: select
      options:
        - SUP Boat
        - Inflatable Boat
        - SUP Board
        - Inflatable SUP
        - Life Vest
        - Accessory
    - name: Quantity
      type: text
      options:
        - Centru de scufundări
        - Pescuit
        - Turism marin / Resort
        - Căutare și salvare
        - Tender pentru iaht
        - Ambarcațiune de lucru comercială
        - Guvern / Militar
        - OEM / Marcă proprie
        - Personal / Recreațional
        - Altele
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Customization Needed
      type: text
      placeholder: e.g. custom colors, branding, packaging
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      options:
        - Fără preferință
        - PVC de calitate marină (1100 dtex)
        - Hypalon / CSM Premium
        - Cocă din fibră de sticlă
        - Cocă din aluminiu
    - name: Engine Requirement
      type: text
      placeholder: ex. motor exterior 60 HP, fără motor, două motoare 115 HP
    - name: Customization Required
      type: text
      placeholder: ex. culori personalizate, branding/logo, ambalaj, accesorii speciale
    - name: Timeline
      type: text
      placeholder: de ex. livrare în termen de 90 de zile
    - name: Additional Requirements
      type: textarea
      placeholder: Descrie aplicația ta, specificațiile tehnice sau orice cerințe speciale — include desene de referință, specificații sau linkuri, dacă sunt disponibile.
    - name: Upload Specification
      type: file
      placeholder: Încărcați fișa tehnică, desenul sau documentul de referință (PDF, DWG, DXF)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Încărcați logo-ul sau materialele grafice pentru branding personalizat (AI, EPS, PNG)
cta:
  title: Preferați să discutăm pe e-mail?
  subtitle: Trimiteți solicitarea dumneavoastră direct echipei noastre de vânzări și vă vom răspunde în termen de 24 de ore.
  actions:
    - variant: primary
      text: Scrieți-ne direct pe e-mail
      href: /contact

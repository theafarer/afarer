hero:
  tagline: Cunoașterea Explorării Apei
  title: Învață
  subtitle: |
    Ghiduri, tutoriale și scufundări profunde —tot ce ai nevoie pentru a explora<br />
    apa cu încredere. De la alegerea primului SUP la stăpânirea tehnicilor avansate.
  taglineSection: Cunoștințe pentru fiecare vâslaș. De la începător la profesionist.
featured:
  tagline: Subiecte Recomandate
  title: Începe-ți călătoria de învățare
  subtitle: Fie că ești nou în sporturile acvatice sau vrei să treci la nivelul următor, ghidurile noastre te acoperă.
  items:
    - title: Bazele SUP
      description: Tot ce trebuie să știe un începător —tipuri de plăci, dimensiunea padelei, poziția și sfaturi pentru prima zi.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Placă gonflabilă vs placă rigidă
      description: Care este potrivită pentru tine? Comparam portabilitatea, performanța, durabilitatea și costul una lângă alta.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Siguranța pe apă
      description: Cunoștințe esențiale de siguranță pe care fiecare vâslaș ar trebui să le aibă —vreme, PFD-uri, auto-salvare și multe altele.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Ghid Materiale
      description: PVC vs Hypalon, tehnologie drop-stitch, evaluări denier —înțelege din ce este făcut echipamentul tău.
      icon: tabler:flask
      href: /learn/materials
    - title: Ghid Dimensiuni SUP
      description: Găsește lungimea, lățimea și volumul potrivit al plăcii pentru greutatea, abilitățile și stilul tău de vâslit.
      icon: tabler:ruler
      href: /size-guide
    - title: Tehnici Intermediare
      description: Îmbunătățește-ți vâslitul cu mișcări avansate, tehnici de întoarcere și manevrare în apă agitată.
      icon: tabler:droplet
      href: /v2/intermediate-techniques

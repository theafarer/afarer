meta:
  title: Producție SUP cu Etichetă Privată | {SITE}
  description: Lansați-vă propriul brand SUP cu Afarer. De la idee la piață — servicii OEM/ODM complete, inclusiv design, prototipare, producție și logistică globală.
hero:
  tagline: Construiți-vă propria marcă
  title: Lansați-vă propria<br />marcă SUP
  subtitle: Dumneavoastră aveți viziunea. Noi avem fabrica, expertiza și lanțul de aprovizionare. Împreună vom construi un brand care se remarcă.
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Placă SUP personalizată cu branding, pe apă
process:
  title: Călătoria mărcii dumneavoastră
  subtitle: De la idee la piață în 5 etape.
  steps:
    - phase: Faza 1
      title: Idee
      period: Săptămâna 1-2
      items:
        - Cercetare de piață & analiza concurenței
        - Definirea clientului țintă
        - Atelier de poziționare a brandului
        - Strategia de gamă de produse
    - phase: Faza 2
      title: Design
      period: Săptămâna 3-6
      items:
        - Forma plăcii și designul grafic
        - Potrivirea culorilor & selecția materialelor
        - Specificația accesoriilor
        - Design de ambalaj și etichetă
    - phase: Faza 3
      title: Prototip
      period: Săptămâna 7-10
      items:
        - Producția de mostre
        - Testarea calității (presiune, flotabilitate, UV)
        - Ajustări de design
        - Aprobare finală
    - phase: Faza 4
      title: Producție
      period: Săptămâna 11-14
      items:
        - Fabricație în volum mare
        - Inspecție QC (per unitate)
        - Transport maritim / transport aerian
        - Documente de vămuire
    - phase: Faza 5
      title: Lansați
      period: Săptămâna 15-16
      items:
        - Fotografie de produs
        - Feed de produse pentru site-ul web
        - Materiale de marketing
        - Suport la lansare
packages:
  title: Pachete pentru startup-uri
  subtitle: Pachete concepute pentru fiecare etapă a dezvoltării unui brand.
  items:
    - name: Starter Brand
      tagline: 50-100 unități · 2 modele de plăci
      features:
        - Imprimare simplă a logo-ului
        - Ambalaj standard
        - Suport prin e-mail
    - name: Growing Brand
      tagline: 300–1.000 de unități · 3–5 modele de plăci
      features:
        - Culoare + logo personalizate
        - Ambalaje personalizate
        - Fotografii de produs
        - Manager dedicat
    - name: Established Brand
      tagline: 1,000+ unități · gamă completă de produse
      features:
        - Personalizare completă
        - Ambalaj premium
        - Materiale de marketing
        - Producție prioritară

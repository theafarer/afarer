features3_cases:
  tagline: Cazuri selectate
  title: Soluții personalizate<br />pentru provocări reale
  isBeforeContent: false
  columns: 3
  items:
    - title: Flota centrului european de scufundări
      customer: BlueMed Diving Centers
      country: Grecia
      industry: Scufundări și Turism Marin
      challenge: >-
        Au fost solicitate 12 plăci SUP configurate pentru scufundări pentru un lanț de centre de scufundări din mai multe insule grecești. Fiecare placă trebuia să dispună de sisteme personalizate de prindere a echipamentului, spațiu de depozitare pentru 8 butelii și o platformă stabilă pentru
        intrarea scafandrilor în apă deschisă. Flota trebuia să ajungă în termen de 60 de zile, la începutul sezonului turistic.
      solution: >-
        Am produs 12 modele SUP Voyager Dive cu suporturi integrate pentru echipament, platforme stabile și construcție drop-stitch extra-lată pentru stabilitate la îmbarcare. Fiecare placă a fost marcată cu identitatea vizuală a flotei clientului. Toate cele 12 plăci au fost testate la presiune și
        expediate din Qingdao în 55 de zile.
      product: SUP pentru explorare și scufundări
      results: Toate cele 12 plăci au fost livrate la timp pentru sezonul turistic. Flota funcționează zilnic de peste 18 luni, fără nicio defecțiune materială. Clientul a comandat 6 unități suplimentare în al doilea an.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Voyager Dive a fost coloana vertebrală a operațiunilor noastre zilnice de scufundări. Stabilitatea este excelentă, iar amenajarea spațiului de depozitare a echipamentului menține puntea curată și sigură pentru oaspeții noștri.
      icon: tabler:lifebuoy
    - title: Program OEM distribuitor australian
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: Producție OEM/ODM
      challenge: >-
        Un distribuitor australian avea nevoie de o gamă de plăci SUP cu marcă proprie la prețuri competitive, pentru a concura cu brandurile chinezești care vând direct consumatorilor. A fost nevoie de 8 modele unice, de la începători până la avansați, cu grafică personalizată, ambalaje
        personalizate și livrare directă (drop-ship) către magazinele de retail.
      solution: >-
        Am dezvoltat 8 modele de SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) cu un pachet grafic australian exclusiv. Ambalaje retail personalizate cu coduri QR care trimit la videoclipurile de montaj. Logistică drop-ship configurată direct din Qingdao către
        magazinele retail australiene.
      product: Linie SUP personalizată (8 modele)
      results: De la concept la prima livrare în 90 de zile. Rata de vânzare la retail de 85% în primul sezon. Distribuitorul a extins parteneriatul pentru a include modele SUP suplimentare în al doilea an.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: afarer a livrat o gamă completă de produse SUP în 90 de zile — de la designul inițial până la rafturile magazinelor. Calitatea se ridică la nivelul brandurilor care vând la preț dublu.
      icon: tabler:currency-dollar
    - title: Furnizare bărci de salvare Orientul Mijlociu
      customer: Autoritatea Națională de Protecție Civilă
      country: Emiratele Arabe Unite
      industry: Căutare și salvare
      challenge: >-
        O organizație de protecție civilă avea nevoie de 20 de plăci SUP pregătite pentru patrulare, destinate căutării și salvării pe coastă, securității portuare și intervenției în caz de inundații. Erau necesare plăci de mare vizibilitate, echipament complet de siguranță și conformitate cu
        reglementările maritime locale.
      solution: >-
        Am livrat 20 de modele SUP Patrol cu construcție drop-stitch portocalie de înaltă vizibilitate, pachete complete de siguranță, bandă reflectorizantă SOLAS și construcție ranforsată. Fiecare placă a fost certificată CE și testată conform standardelor aplicabile. Pachetul de documentație a
        inclus certificate de conformitate pentru înregistrarea locală.
      product: SUP Patrol
      results: Flotă implementată în 5 stațiuni costiere. Plăcile funcționează în condiții de căldură extremă (45°C+) fără nicio degradare. Performanța și durabilitatea au depășit specificațiile.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Patrula SUP a depășit cerințele noastre operaționale. În condiții de căldură extremă, plăcile nu prezintă semne de degradare UV după 24 de luni de utilizare zilnică.
      icon: tabler:alert-triangle
    - title: Parteneriat OEM marcă europeană
      customer: North Sea Marine Equipment BV
      country: Țările de Jos
      industry: Producție OEM/ODM
      challenge: Un brand european consacrat din domeniul marin dorea să intre pe piața SUP fără a investi în facilități de producție. Căuta un partener white-label capabil să producă 5 modele SUP (de la 9 ft la 12 ft) cu branding privat, certificare CE și drepturi exclusive de distribuție în UE.
      solution: >-
        Am încheiat un acord de producție white-label pentru 5 modele de SUP. Fiecare model a fost personalizat cu siglele și schema de culori a clientului. Documentația de certificare CE a fost pregătită pentru fiecare model. Au fost acordate drepturi exclusive de distribuție în UE, cu angajamente
        minime de comandă. Documentația tehnică a fost furnizată rețelei locale de service.
      product: Linie SUP personalizată (5 modele)
      results: Acord multianual semnat. Primul lot de producție, de 50 de unități, a fost livrat în termen de 75 de zile. Brandul a fost lansat la un târg important, cu o recepție pozitivă din partea dealerilor.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Colaborarea cu afarer ne-a permis să intrăm pe piața SUP fără să construim o fabrică — ne-au livrat o soluție completă la cheie, cu certificare CE și documentație de suport pentru dealeri.
      icon: tabler:building
    - title: Flota stațiunii din Caraibe
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Turism nautic și ospitalitate
      challenge: >-
        Un resort de lux avea nevoie de o flotă completă de echipamente pentru sporturi acvatice, pentru activitățile oaspeților: 40 de plăci SUP pentru tururi ghidate, 20 de plăci SUP suplimentare pentru explorarea lagunei, 10 plăci SUP pentru excursii ale oaspeților, plus accesorii. Toate
        echipamentele necesitau branding personalizat al resortului și trebuiau livrate înainte de sezonul turistic de vârf.
      solution: >-
        Am produs pachetul complet de SUP: 40 de plăci SUP Voyager (modelul All-Around), 20 de plăci SUP Explorer, 10 plăci SUP Touring, plus dispozitive PFD, vâsle, pompe și kituri de reparații. Tot echipamentul a fost imprimat cu sigla resortului și un design cromatic tropical. Transport
        containerizat, cu manifest complet de inventar.
      product: Pachet complet SUP (70+ unități)
      results: Flota a ajuns cu 6 săptămâni înainte de sezonul de vârf. Scorurile de satisfacție ale oaspeților pentru activitățile de sporturi nautice au crescut cu 40% de la an la an. Echipamentul a rezistat 3 sezoane cu doar întreținere de rutină.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Abordarea de pachet complet a însemnat că am primit tot ce ne trebuia într-o singură expediție — plăci și accesorii, toate personalizate și gata de folosire de către oaspeți. Oaspeții noștri apreciază calitatea echipamentelor.
      icon: tabler:beach
    - title: Contract de patrulare costieră SUA
      customer: Atlantic Coastal Security Agency
      country: Statele Unite
      industry: Securitate maritimă și aplicarea legii
      challenge: O agenție americană de securitate costieră a solicitat SUP-uri de patrulare grele pentru operațiuni în ape deschise. Erau necesare plăci de înaltă performanță, cu echipamente de specificație militară și conformitate cu reglementările Pazei de Coastă a SUA.
      solution: >-
        Am proiectat SUP Patrol cu construcție drop-stitch ranforsată, scheme de culori de înaltă vizibilitate, suporturi pentru echipamente de comunicații criptate și puncte integrate de fixare a echipamentului. Plăci ranforsate pentru operațiuni de utilizare intensivă. Documentația de conformitate
        USCG este inclusă.
      product: SUP Patrol
      results: Agenția a raportat o rată de pregătire pentru misiune de 95% în primele 12 luni. A fost plasată o comandă suplimentară pentru 8 unități.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: SUP Patrol oferă echipajelor noastre performanța necesară operațiunilor în larg. Construcția ranforsată asigură durabilitatea esențială fără a compromite manevrabilitatea.
      icon: tabler:shield

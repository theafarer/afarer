hero:
  tagline: 'Studii de caz'
  title: 'Proiecte reale, rezultate reale<br />—afarer în acțiune'
  subtitle: 'Vedeți cum afarer colaborează cu distribuitori, mărci și operatori din întreaga lume pentru a oferi soluții maritime personalizate pentru fiecare aplicație.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'Studii de caz afarer —proiecte de fabricație marină personalizate'
features3_cases:
  tagline: 'Cazuri selectate'
  title: 'Soluții personalizate<br />pentru provocări reale'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Flota centrului european de scufundări'
      description: 'Furnizarea a 12 bărci SUP 520 configurate pentru scufundări către un lanț de centre de scufundări mediteraneene. Suporturi personalizate pentru butelii, scări de scufundare și branding al flotei. Livrat în 60 de zile.'
      icon: tabler:lifebuoy
    - title: 'Program OEM distribuitor australian'
      description: 'Dezvoltarea unei game de plăci SUP cu marcă privată pentru un distribuitor australian de sporturi nautice. 8 modele, ambalaj personalizat și logistică drop-ship. De la concept la prima expediere în 90 de zile.'
      icon: tabler:currency-dollar
    - title: 'Furnizare bărci de salvare Orientul Mijlociu'
      description: 'Furnizarea a 20 de bărci de patrulare SUP 450 Patrol către o organizație de apărare civilă din Orientul Mijlociu. Punte cu autoscurgere, echipament de navigație complet și tuburi portocalii de înaltă vizibilitate. Conformitate cu standardele de reglementare locale.'
      icon: tabler:alert-triangle
    - title: 'Parteneriat OEM marcă europeană'
      description: 'Parteneriat de fabricație white-label cu o marcă maritimă europeană. 5 modele SUP, branding privat, drepturi exclusive de distribuție pentru piața UE. Acord multianual.'
      icon: tabler:building
    - title: 'Flota stațiunii din Caraibe'
      description: 'Pachet complet de echipamente pentru sporturi nautice pentru o stațiune din Caraibe: 40 de plăci SUP, 20 de caiaci, 10 bărci gonflabile și accesorii. Branding personalizat al stațiunii pe toate echipamentele.'
      icon: tabler:beach
    - title: 'Contract de patrulare costieră SUA'
      description: 'Furnizarea de bărci de patrulare SUP 600 către o agenție de securitate costieră americană. Configurație bimotor, opțiuni de consolă blindată și integrare electronică militară.'
      icon: tabler:shield
cta:
  title: 'Aveți un proiect de discutat?'
  subtitle: 'Fiecare parteneriat afarer începe cu o conversație. Spuneți-ne cerințele dvs. și vom dezvolta o soluție.'
  actions:
    - variant: primary
      text: 'Începeți proiectul'
      href: /contact
    - text: 'Vedeți capacitățile noastre'
      href: /brand/marine-expertise

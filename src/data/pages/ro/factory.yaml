hero:
  tagline: Fabrică
  title: Fabrica noastră
  subtitle: 12.000 m² de facilitate modernă de producție în Qingdao, China.
intro:
  - >-
    Ca marcă de fabrică a **Qingdao Vatrad Group Co., Ltd.**, afarer controlează fiecare etapă a producției —de la sosirea materialelor PVC brute până la inspecția finală pre-livrare a SUP-ului finit. Facilitatea noastră de producție din Zona de Dezvoltare Economică Qingdao se întinde pe 12.000 de
    metri pătrați și găzduiește ateliere dedicate pentru tăierea PVC, lipirea miezului drop-stitch, imprimarea digitală SUP, asamblarea finală și testarea calității.
  - >-
    Prin integrarea proiectării, ingineriei, prototipării, producției și testării sub același acoperiș, eliminăm ineficiențele producției prin contract și păstrăm controlul direct asupra calității construcției, selecției materialelor și termenelor de livrare. Fiecare SUP care iese din atelierul
    nostru este construit de oamenii noștri, pe echipamentele noastre, conform standardelor noastre.

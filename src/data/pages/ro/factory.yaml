material_traceability:
  tagline: Trasabilitate
  title: Urmărirea materialelor și controlul loturilor
  description: >-
    Fiecare lot de materie primă primește un număr unic de lot în sistemul nostru ERP. De la recepție, prin producție, până la produsul finit, lista de materiale a fiecărei bărci este conectată la lotul inițial al furnizorului. Acest lucru permite trasabilitatea completă în amonte pentru orice
    investigație legată de calitate sau conformitate.
  system: ERP personalizat (sistem intern Qingdao Vatrad Group) + etichete fizice de lot pe fiecare comandă de lucru
  coverage: 100% din materialele de producție — PVC, Hypalon, țesătură drop-stitch, adezivi, supape, feronerie, ambalaje
  records_retained: 10 ani (conform cerinței CE 2013/53/EU)
  suppliers:
    - material: PVC de calitate marină
      source: Furnizori chinezi și coreeni
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Furnizor japonez
      certified: ISO 9001, REACH
    - material: Țesătură drop-stitch
      source: Țesut intern + partener extern
      certified: Control de calitate intern + ISO 9001 al furnizorului
    - material: Supape și feronerie
      source: Furnizori OEM chinezi
      certified: ISO 9001, certificate de material per lot

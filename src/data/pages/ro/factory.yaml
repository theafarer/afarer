qc_section:
  tagline: Controlul calității
  title: Procesul de Testare și Asigurare a Calității
  subtitle: Fiecare barcă este supusă unor testări obligatorii înainte de expediere. Laboratorul nostru de calitate funcționează independent de producție și raportează direct conducerii.
  steps:
    - step: '1'
      title: Inspecția Materiilor Prime
      desc: Țesăturile din PVC, Hypalon și drop-stitch sunt supuse testelor de tracțiune (), de propagare a ruperii și de verificare a rezistenței UV înainte ca orice lot să intre în producție.
    - step: '2'
      title: Test de retenție a aerului pe 48 de ore
      desc: Fiecare cameră de tub este umflată la 125% din presiunea nominală și menținută timp de 48 de ore. O scădere a presiunii sub 5% declanșează respingerea automată și re-inspectarea cusăturilor.
    - step: '3'
      title: Testarea sarcinii și a echilibrului
      desc: Bărcile finalizate sunt încărcate la capacitatea maximă nominală și testate pentru stabilitate, bord liber și manevrabilitate. Fiecare ambarcațiune este testată pe apă înainte de inspecția finală.
oem_section:
  tagline: Proiecte OEM
  title: Studii de caz privind parteneriatele de brand și OEM
  subtitle: De la concept la container — cum ajutăm brandurile globale să lanseze și să extindă gamele lor de SUP-uri gonflabile.
  cases:
    - challenge: Un retailer european de articole outdoor avea nevoie de o gamă de SUP private-label, cu grafice unice pe punte, PVC ecologic și ambalaje gata pentru retail — totul livrat în 60 de zile.
      solution: Am dezvoltat fișiere de imprimare digitală personalizate, am procurat PVC conform REACH și am redus eșantionarea de la 3 runde la 1 prin amplasarea echipei de design direct în fabrica noastră din Qingdao.
      result: 55 de zile de la semnarea PO până la FOB. 2,400 de unități în 4 SKU-uri. Comanda repetată a fost plasată înainte de sosirea primului container.
    - challenge: O companie americană de sporturi nautice avea nevoie de o placă SUP drop-stitch de înaltă performanță, cu formă personalizată, ambalaj co-branded și certificare BSCI pentru distribuția în retail.
      solution: Am adaptat matrița SUP existentă cu un contur modificat, am dezvoltat arta ambalajului co-branded și am furnizat documentația completă a auditului BSCI.
      result: Prezentă cu succes în 3 mari lanțuri outdoor din SUA. Peste 5.000 de unități în primul an, cu o rată de vânzare finală de 98%.
    - challenge: Un distribuitor australian avea nevoie de o gamă de plăci SUP certificate CE, cu culori personalizate și conformitate cu standardele australiene.
      solution: Am produs mostre de pre-producție în 4 variante de culoare și am coordonat testarea conformității efectuată de terți.
      result: Gamă de 3 modele de SUP lansată pe piața AU/NZ. A urmat câștigarea unei licitații guvernamentale pentru 12 SUP-uri de patrulare.
faq_section:
  tagline: FAQ
  title: Întrebări frecvente B2B & OEM
  questions:
    - q: Care este cantitatea minimă de comandă (MOQ) pentru plăcile SUP gonflabile OEM?
      a: MOQ-ul începe de la 5–10 de unități pentru modelele OEM standard. Mucelele personalizate și proiectele private-label necesită un minim de 200 de unități, în funcție de complexitate. Comenzile de probă și seriile de testare sunt disponibile pentru lansarea de branduri noi.
    - q: Deține afarer certificarea BSCI?
      a: >-
        Da. Fabrica noastră deține o certificare BSCI valabilă de conformitate socială (raportul de audit este disponibil la cerere). De asemenea, deținem  pentru managementul calității, iar toate produsele sunt livrate cu certificare CE . Documentația de conformitate REACH și RoHS este furnizată cu
        fiecare expediere OEM.
    - q: Care este termenul de livrare tipic pentru o comandă OEM?
      a: >-
        Da. Fabrica noastră deține o certificare BSCI valabilă de conformitate socială (raportul de audit este disponibil la cerere). De asemenea, deținem  pentru managementul calității, iar toate produsele sunt livrate cu certificare CE . Documentația de conformitate REACH și RoHS este furnizată cu
        fiecare expediere OEM.
    - q: Puteți expedia FOB Qingdao sau CIF către portul nostru?
      a: Da. Expediem FOB Qingdao, CIF în principalele porturi globale și DDP pentru parteneri calificați. Echipa noastră de logistică se ocupă de rezervarea containerelor, documentația de export și vămuire. Expediem în peste 50 de țări, pe piețele din UE, SUA, Australia și Asia.
b2b_moq: 'MOQ standard: 5–10 unități per model (SUP/caiac/drop-stitch). MOQ pentru SUP: 2–5 unități. Comenzile de test sunt binevenite pentru parteneriate noi.'
production_flow:
  tagline: Fluxul de producție
  title: De la material la ambarcațiunea finită
  subtitle: Fiecare ambarcațiune trece prin 6 etape de producție, cu puncte de control al calității la fiecare pas. Fără scurtături, fără inspecții omise.
  stages:
    - stage: '01'
      title: Recepția materialelor și controlul calității la intrare
      description: Toate materialele primite sunt înregistrate cu număr de lot/serie în sistemul nostru ERP. Rolele de material PVC, miezurile drop-stitch, supapele, adezivii și accesoriile sunt ținute în carantină până la aprobarea controlului calității.
      qc_check: Rezistență la tracțiune (ASTM D751), rezistență la rupere (ISO 4674), măsurarea grosimii, vâscozitatea adezivului, scanare vizuală a defectelor
      qc_threshold: 100% dintre loturi sunt testate. Se respinge dacă tracțiunea < 90% din specificație, ruperea < minimul din specificație sau există orice defect vizual
      responsibility: Echipă QC la recepție (3 inspectori)
    - stage: '02'
      title: Tăiere CNC și Pregătirea Materialelor
      description: Amplasarea computerizată optimizată a panourilor pe materialul PVC minimizează deșeurile. Mașinile automate de tăiere CNC asigură o precizie pozițională de 0,1 mm.
      qc_check: Verificare dimensională față de fișierele CAD DXF, inspecția calității marginilor, verificarea numărului de panouri
      qc_threshold: Se măsoară fiecare al 20-lea panou. Toleranță ±0,5 mm. Se respinge lotul dacă >2% depășesc toleranța
      responsibility: Șef atelier de tăiere
    - stage: '03'
      title: Sudare și lipire Drop-Stitch
      description: Nucleele drop-stitch sunt lipite de laminatele exterioare din PVC prin laminare la cald. Camerele tubulare sunt sudate prin RF sau cu aer cald. Benzile de rail sunt lipite prin fuziune în trei straturi.
      qc_check: Test de dezlipire la fiecare 50 de unități (ASTM D751), măsurarea lățimii sudurii, verificarea jurnalului de temperatură al aerului cald, inspecția vizuală a cusăturilor cu lumină din spate
      qc_threshold: Rezistență la decojire min. 8 N/cm. Toleranță pentru lățimea sudurii ±1 mm. Orice canalizare vizibilă = respingere
      responsibility: Controlul calității la sudare (2 inspectori pe schimb)
    - stage: '04'
      title: Asamblare & Echipare
      description: 'Ambarcațiunile trec la asamblarea finală, unde toate componentele sunt îmbinate: cocă + tuburi, supape instalate, inele D, mânere, casete pentru aripioare și montarea sacului de transport. Fiecare unitate urmează o listă de verificare a asamblării cu 100 de puncte.'
      qc_check: Semnarea unei liste de verificare cu 100 de puncte pentru fiecare unitate, testul funcționării supapei (10 cicluri deschidere/închidere), verificarea cuplului de strângere a fitingurilor, inspecția vizuală
      qc_threshold: 'Politică de zero defecte pentru componentele critice pentru siguranță (supape, inele D, mânere). Defecte cosmetice minore: AQL 2.5 (ISO 2859)'
      responsibility: Șef echipă de asamblare + control al calității pe linie
    - stage: '05'
      title: Testare la presiune și control al calității
      description: Fiecare cameră este umflată la 1.25× din presiunea nominală (de obicei 20–25 PSI) și menținută timp de 24–48 ore. Senzorii de presiune înregistrează continuu. Camerele cu o scădere a presiunii de peste 5% sunt respinse și trimise la re-inspectarea îmbinărilor.
      qc_check: Jurnal de menținere a presiunii timp de 24h, calibrare zilnică verificată a senzorilor, citire a presiunii compensată la temperatură, re-testare a cusăturilor după reparații
      qc_threshold: Pierdere de presiune max. 5% în 24h la temperatură stabilă. Orice cameră care depășește această valoare = retestare 100% a întregului lot de producție
      responsibility: Laborator de calitate (independent de producție, raportează conducerii)
    - stage: '06'
      title: Inspecție finală și ambalare
      description: Inspecție finală vizuală și funcțională. Defecte de suprafață, consistența culorii, verificarea etichetelor/BIN, integritatea ambalajului și completitudinea accesoriilor. Unitățile sunt ambalate în vid, puse în cutii și paletizate pentru încărcarea în containere.
      qc_check: Inspecție vizuală completă, listă de verificare a accesoriilor per SKU, test de cădere a ambalajului (1 m, eșantion aleatoriu), verificarea scanării etichetelor/codurilor de bare
      qc_threshold: AQL 2.5 pentru defecte majore, AQL 4.0 pentru defecte minore. Toleranță zero la defectele de siguranță. 100% dintre unități sunt inspectate vizual
      responsibility: Echipa finală de control al calității (4 inspectori) + șeful echipei de ambalare
workforce:
  tagline: Oamenii noștri
  title: Forță de muncă și expertiză
  engineers: 25+
  engineers_detail: Ingineri din cercetare și dezvoltare, proiectarea matrițelor, laboratorul de materiale și inginerie de producție. În medie, peste 7 ani de experiență în fabricarea produselor inflabile.
  shift_pattern: 2 schimburi/zi (07:00–15:30, 15:30–00:00). Schimb de noapte opțional pentru comenzi urgente.
  training: Instruire lunară pentru controlul calității, exerciții de siguranță trimestriale, evaluare anuală a competențelor. Angajații noi parcurg o instruire introductivă de 40 de ore înainte de a lucra pe linia de producție.

workshops_section:
  tagline: Ateliere
  title: Ateliere de producție
  workshops:
    - title: Tăierea PVC și pregătirea materialelor
      description: Mașinile automate de tăiere CNC prelucrează materialele PVC, Hypalon și drop-stitch cu precizie sub-milimetrică. Amplasarea optimizată pe calculator minimizează risipa de material și asigură că fiecare panou respectă specificațiile dimensionale înainte de sudare.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: Sudarea tuburilor și etanșarea termică
      description: Atelier de sudare dedicat, dotat cu mașini de etanșare termică și prese dielectrice RF. Etanșoarele cu aer cald unesc și fuzionează camerele de tub din PVC, în timp ce sudurile RF produc îmbinări etanșe de înaltă rezistență, care depășesc cerințele.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: Lipirea Miezului Drop-Stitch
      description: >-
        Miezurile drop-stitch ale plăcilor SUP sunt lipite de laminatele exterioare din PVC prin laminare termică. Mii de fire interne din poliester conectează straturile superioare și inferioare, creând o structură rigidă la 12-15 PSI. Benzile de margine sunt lipite prin fuziune în trei straturi
        pentru rezistența marginilor.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Imprimare și decorare SUP
      description: Plăcile SUP sunt decorate prin imprimare digitală  pentru grafice full-color și serigrafie  pentru sigle și modele repetitive. Imprimantele digitale produc designuri de punte de calitate foto, iar serigrafia oferă semne de brand durabile și vii.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: Asamblare finală & Montaj
      description: Linie de asamblare unde sunt instalate supape, inele D, mânere, cutii de aripioare și deck pad-uri pe fiecare placă SUP. Fiecare placă urmează o listă de verificare a asamblării cu 100 de puncte, semnată de liderul echipei.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: Testarea și inspecția calității
      description: Fiecare ambarcațiune finalizată este supusă în mod obligatoriu testului de menținere a aerului, verificării aderenței cusăturilor și unui control complet al sistemelor înainte de expediere. Laboratorul nostru de calitate funcționează independent de producție și raportează direct conducerii.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp

features3_reasons:
  tagline: Why Choose afarer
  title: 'Șapte motive pentru a partenera cu noi'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Real Manufacturing, Not Trading'
      description: 'Deținem și operăm o fabrică de 12.000 m². Când partenerați cu afarer, lucrați direct cu oamenii care proiectează, ingineresc și construiesc produsele dvs. —fără intermediari.'
      icon: tabler:building-factory
    - title: '2. Engineering-Led Approach'
      description: 'Procesul nostru de proiectare începe cu cazul de utilizare, nu cu categoria de produs. Optimizăm forma carenei, selecția materialelor și configurarea pentru modul în care barca va fi efectiv utilizată.'
      icon: tabler:engine
    - title: '3. Certified Quality'
      description: 'Certificat CE, sistem de calitate ISO, conform BSCI, conform REACH, aprobat USCG. Fiecare produs îndeplinește standarde internaționale —nu doar afirmații.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Culori ale tuburilor, aspectul consolei, branding, ambalare —personalizăm conform specificațiilor dvs. Fără presiunea comenzii minime. Începeți cu un prototip, scalați cu încredere.'
      icon: tabler:adjustments
    - title: '5. Global Logistics'
      description: 'Depozit în SUA în California, expediere directă din Qingdao, transport aerian pentru comenzi urgente. Ne ocupăm de documentația vamală și acte.'
      icon: tabler:truck-delivery
    - title: '6. Lifetime Support'
      description: 'Susținem bărcile pe care le-am construit acum 20 de ani. Piese de schimb originale, sfaturi tehnice, îndrumări de reparație —echipa noastră este disponibilă când aveți nevoie de noi.'
      icon: tabler:lifebuoy
    - title: '7. Honest Specifications'
      description: 'Evaluări reale de sarcină, dimensiuni reale, greutate reală. Fără umflare de marketing. Ceea ce publicăm este ceea ce primiți —verificat prin testare independentă.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Trusted by Brands Worldwide
  title: What Our Partners Say
  items:
    - content: 'Am lucrat cu mai mulți producători din China, dar afarer se remarcă prin suportul lor ingineresc și calitatea constantă. Tratează marca noastră ca pe a lor.'
      name: '—OEM Partner, European Water Sports Brand'
    - content: 'SUP-urile lor Hypalon sunt în serviciul flotei noastre de peste 5 ani. Întreținere minimă, rezistență UV excelentă. Garanția de 5 ani pe tuburi ne dă încredere.'
      name: '—Fleet Operator, Middle East Resort Group'
    - content: 'Echipa afarer ne-a ajutat să dezvoltăm un design personalizat de placă SUP, de la concept la producție, în 90 de zile. Calitatea a depășit așteptările noastre.'
      name: '—Distributor, Australian Watersports'

meta:
  title: Soluții pentru flote de închiriere SUP | {SITE}
  description: Plăci SUP cu rotație ridicată, proiectate pentru utilizare zilnică la închiriere. PVC rezistent la UV, cusături ranforsate, materiale cu uscare rapidă. Dezvoltați-vă afacerea de închiriere cu Afarer.
hero:
  tagline: Operatori de închiriere
  title: Extindeți-vă afacerea de închiriere<br />Cu încredere
  subtitle: Plăci SUP cu rotație ridicată, proiectate pentru închiriere zilnică, 365 de zile pe an. Veniturile dumneavoastră nu iau niciodată o pauză.
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Chioșc de închiriere aglomerat, cu plăci SUP pregătite pentru clienți
features:
  title: Construit pentru uz intensiv în închirieri
  subtitle: Fiecare placă este proiectată pentru peste 500 de cicluri de închiriere, cu întreținere minimă.
  items:
    - title: Peste 500 de cicluri de închiriere
      description: Testate pentru a rezista utilizării zilnice în apă sărată, soare și nisip.
      icon: tabler:shield-check
    - title: Țesătură rezistentă la UV
      description: Fără decolorare sau degradare după 1 an de depozitare în exterior.
      icon: tabler:sun
    - title: Cusături ranforsate
      description: De 3 ori mai rezistentă decât construcția standard a plăcilor gonflabile.
      icon: tabler:layers-intersect
    - title: Materiale cu uscare rapidă
      description: Plăci gata pentru următoarea închiriere în mai puțin de 30 de minute.
      icon: tabler:droplet
    - title: Depozitare stivuibilă
      description: Design care economisește spațiu — stocați cu 40% mai multe plăci în aceeași suprafață.
      icon: tabler:stack
    - title: Mărimi codificate pe culori
      description: Personalul apucă imediat placa potrivită, grație codificării mărimilor pe culori.
      icon: tabler:color-swatch
stats:
  title: Indicatori operaționali
  stats:
    - title: Rotația plăcilor
      amount: < 5 min
    - title: Întreținere anuală
      amount: ~15 min/placă
    - title: Expedierea pieselor de schimb
      amount: 48h
    - title: Rata defectelor
      amount: < 0.5%
fleet_guide:
  title: Ghid pentru dimensionarea flotei
  subtitle: Estimează dimensiunea flotei și potențialul de venit pentru afacerea ta de închirieri.
  tiers:
    - label: Chioșc mic
      boards: 15-20
      revenue: $XX,XXX/yr
    - label: Operațiune de dimensiuni medii
      boards: 30-50
      revenue: $XX,XXX/yr
    - label: Închiriere pe plajă la scară largă
      boards: 50-100
      revenue: $XXX,XXX/yr
cta:
  title: Sunteți gata să extindeți afacerea dvs. de închiriere?
  subtitle: Obțineți prețuri pentru închirieri sau comparați modelele de plăci pentru afacerea dumneavoastră.
  actions:
    - text: Obțineți tarifele de închiriere
      href: /contact?package=rental
      variant: primary
    - text: Comparați modelele de plăci
      href: /compare
      variant: secondary

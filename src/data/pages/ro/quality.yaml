meta:
  title: 'Calitate și testare — controlul producției | {SITE}'
  description: 'Sistemul de calitate afarer: laborator independent de testare, procese ISO 9001 și fiecare unitate testată înainte de expediere. Controlul calității în producția de plăci de SUP gonflabile și bărci.'
  keywords:
    - 'control de calitate SUP'
    - 'testare SUP gonflabil'
    - 'asigurarea calității paddle board'
    - 'calitatea fabricii SUP'
hero:
  tagline: Asigurarea calității
  title: Testare de performanță și calitate
  subtitle: Fiecare barcă gonflabilă și placă SUP afarer trece prin teste riguroase de performanță și calitate la centrul nostru CD înainte de expediere.
stats:
  - value: 100%
    label: Unități testate la presiune
  - value: '8'
    label: Protocoale de testare
  - value: ISO 9001
    label: Certificat de calitate
  - value: 3 ani
    label: Garanție limitată
tests:
  - title: Testare la presiune
    description: Camerele gonflabile sunt supuse la presiuni ce depășesc limitele de operare recomandate pentru perioade îndelungate.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: Testare la impact
    description: Produsele sunt supuse la impacturi controlate din diferite greutăți și unghiuri.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: Testare rezistență UV
    description: Probele de material sunt supuse unei expuneri UV accelerate care simulează ani de soare puternic, apoi sunt retestate pentru menținerea rezistenței la tracțiune și rezistența culorii la lumină. Aceasta verifică faptul că compozițiile PVC și Hypalon rezistă la decolorare, pulverizare și crăpare, asigurând durabilitate pe termen lung în medii marine însorite.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: Testare rezistență la abraziune
    description: Probele de material sunt frecate de suprafețe abrazive pentru un număr specificat de cicluri.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: Testare la temperaturi scăzute
    description: Produsele sunt testate în medii reci pentru funcționalitate și durabilitate.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: Testare flotabilitate și sarcină
    description: Produsele sunt testate cu diferite greutăți pentru a determina capacitatea maximă de încărcare.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: Testare manevrabilitate
    description: Produsele sunt testate pentru răspunsul la intrarea vâslei sau motorului.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: Testare etanșeitate
    description: Produsele complet asamblate sunt scufundate sau supuse la stropire cu apă pentru a verifica scurgerile.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
testing_section:
  tagline: Proceduri de testare
  title: Testare amănunțită în toate fazele
commitment:
  title: Angajamentul nostru
  body: Prin aceste proceduri riguroase de testare, {SITE} oferă clienților certitudinea că bărcile noastre gonflabile și plăcile SUP nu sunt doar de înaltă performanță, ci și construite să dureze.
  cta: Solicită documentația de testare
  cta_link: /contact

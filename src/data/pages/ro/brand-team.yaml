meta:
  title: 'Echipa noastră — ingineri navali și constructori | {SITE}'
  description: 'Fondat în 2012 la Qingdao, afarer a fost construit de ingineri navali, specialiști în materiale și pasionați de sporturi nautice. Cunoașteți echipa din spatele fabricii.'
  keywords:
    - 'echipa afarer'
    - 'ingineri navali'
    - 'producător plăci de SUP gonflabile'
    - 'echipa fabricii SUP'
hero:
  tagline: Echipa noastră
  title: Oamenii din spatele afarer<br />—ingineria libertății pe apă
  subtitle: Fondată în 2012 în Qingdao, China, afarer a fost construită de ingineri marini, oameni de știință în materiale și entuziaști ai sporturilor nautice care au crezut în a face ambarcațiunile inflabile de calitate profesională accesibile la nivel mondial.
  image:
    src: /images/team-all.webp
    alt: fotografia întregii echipe afarer — inginerie, producție și conducere
founding:
  tagline: Începuturile noastre
  title: De la un atelier de coastă<br />la o facilitate de 12.000 m²
  subtitle: afarer a fost fondată de o echipă de ingineri marini cu decenii de experiență combinată în proiectarea bărcilor inflabile, fabricarea PVC/Hypalon și fabricarea globală de echipamente marine.
  items:
    - title: 'Fondată: 2012'
      description: Fondată în Qingdao, China —un important hub maritim cu o moștenire profundă în construcții navale.
      icon: tabler:calendar
    - title: Peste 200 de angajați
      description: Inclusiv peste 50 de ingineri R&D, specialiști în controlul calității și tehnicieni de producție.
      icon: tabler:users
    - title: Facilitate de 12,000 m²
      description: Uzină de producție dedicată cu 6 linii de producție pentru SUP-uri, bărci inflabile și plăci SUP.
      icon: tabler:building-factory
    - title: Peste 50 de țări deservite
      description: Export în Europa, Americi, Orientul Mijlociu, Asia-Pacific și Africa.
      icon: tabler:globe
leadership:
  tagline: Conducere
  title: Conducere și leadership ingineresc
  subtitle: Echipa noastră de conducere reunește expertiză profundă în inginerie marină, comerț internațional și management al calității.
  columns: 3
  items:
    - title: Fondator și CEO
      name: Toby Liu
      description: Peste 15 ani în producția nautică. Anterior a condus departamentul R&D la un mare producător chinez de ambarcațiuni. Deține mai multe brevete în designul bărcilor pneumatice.
      icon: tabler:crown
      image: https://assets.afarer.com/images/afarer/team/afarer-toby-liu-team.webp
    - title: Inginer șef
      name: Zhang Wei
      description: Peste 20 de ani de experiență în fabricația din PVC/Hypalon și proiectarea carenelor în V adânc. Fost director tehnic la o firmă europeană de inginerie marină.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Director R&D
      name: Chen Ming
      description: Doctorat în Știința Materialelor. Se specializează în tehnologia drop-stitch și procesele de sudură de înaltă frecvență. Peste 10 ani în compozite textile.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Director de producție
      name: Liu Qiang
      description: Peste 18 ani în producție lean și optimizarea liniilor de producție. Black Belt Six Sigma. Sisteme de calitate ISO 9001 implementate.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Manager de calitate
      name: Wang Fang
      description: Peste 12 ani de experiență în controlul calității în domeniul marin. Auditor certificat CE și ISO. Supraveghează testarea fiecărui lot de producție.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Director de vânzări și operațiuni
      name: Helen Lee
      description: Peste 15 ani în comerțul internațional B2B. Am gestionat parteneriate OEM/ODM în peste 30 de țări. Fluent în 4 limbi.
      icon: tabler:briefcase
      image: https://assets.afarer.com/images/afarer/team/afarer-helen-contact-sales.webp
philosophy:
  tagline: Filosofia de design
  title: Design condus de inginerie<br />—fiecare detaliu contează
  subtitle: Filosofia noastră inginerească se concentrează pe trei principii care ghidează fiecare produs pe care îl construim.
  list:
    - 'Fiabilitatea pe primul loc: fiecare produs afarer este testat să reziste în condiții reale — de la operațiuni de salvare în ape reci până la închirieri în stațiuni tropicale. Supradimensionăm exact acolo unde contează cel mai mult.'
    - 'Precizie de fabricație: facilitățile noastre utilizează tăiere CNC, sudare de înaltă frecvență și testare automată a presiunii. Fiecare cusătură, fiecare valvă, fiecare racord respectă specificațiile documentate.'
    - 'Inovație continuă: echipa noastră de cercetare și dezvoltare evaluează constant materiale noi, metode de producție și îmbunătățiri de design. Nu așteptăm să apară problemele — le anticipăm.'
cta:
  title: Doriți să discutați un proiect cu echipa noastră?

hero:
  tagline: Lab 04
  title: Bazin de testare hidrodinamică
  subtitle: Validarea performanței înainte de primul prototip la scară completă
  image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
  image_alt: Testarea performanței în rezervorul hidrodinamic de testare afarer
intro: >-
  Este o concepție greșită comună că testarea hidrodinamică este rezervată navelor de mare cursă. În realitate, performanța unei carene mici de planare — cum ar fi o barcă RIB de 4–6 m — depinde la fel de mult de forma sa subacvatică pe cât depinde un petrolier de bulbul de la prova. Unghiul de
  asietă, suprafața udată, generarea de stropi și ventilația au un efect dramatic asupra vitezei, consumului de combustibil și confortului de navigare. La {SITE.name}, operăm un bazin hidrodinamic dedicat care ne permite să cuantificăm aceste efecte la scară de model — înainte de a angaja metalul și
  țesătura pentru un prototip la scară reală.
content_html: >-
  <h2>De ce testăm în bazin o ambarcațiune mică?</h2>

  <p>Testarea la scară de model (de obicei 1:3 până la 1:5) ne permite să iterăm rapid și eficient formele carenei. O săptămână în bazin poate genera aceleași date de performanță care ar necesita luni de încercări la scară reală — și la o fracțiune din cost.</p>


  <h2>Specificațiile facilității</h2>

  <table>
    <thead><tr><th>Parametru</th><th>Specificație</th></tr></thead>
    <tbody>
      <tr><td>Dimensiunile bazinului</td><td>35 m (L) × 3.5 m (W) × 1.8 m (D)</td></tr>
      <tr><td>Cărucior de remorcare</td><td>Acționat electric cu servomotor, viteză maximă 12 m/s (23 kn), precizia vitezei ± 0,5 %</td></tr>
      <tr><td>Generator de valuri</td><td>Tip clapetă, stări de mare regulate &amp; neregulate programabile, Hs de până la 0,3 m la scară de model</td></tr>
      <tr><td>Instrumentație</td><td>Dinamometru pe 6 componente (rezistență, forță laterală, moment de girație), accelerometre, inclinometre, sonde pentru valuri</td></tr>
      <tr><td>Achiziție de date</td><td>Eșantionare la 1000 Hz pe canal, afișare în timp real + pachet de postprocesare</td></tr>
      <tr><td>Fabricarea modelelor</td><td>Frezare CNC și imprimare 3D în cadrul companiei, pentru carene model de până la 1,8 m LOA</td></tr>
    </tbody>
  </table>


  <h2>Programul nostru de testare</h2>

  <p>Un program standard de dezvoltare a carenei în bazinul nostru urmează această secvență:</p>

  <ol>
    <li><strong>Construirea modelului</strong> — Un model la scara 1:3,5 este prelucrat prin CNC din spumă de înaltă densitate și acoperit cu fibră de sticlă pentru rigiditate. Greutatea și CG sunt ajustate pentru a corespunde condiției de încărcare completă scalată Froude.</li>
    <li><strong>Teste de rezistență</strong> — Modelul este remorcat la 8-10 viteze care acoperă intervalul de operare. Rezistența totală este măsurată și descompusă în componente fricțională și reziduală folosind metoda ITTC-1957.</li>
    <li><strong>Măsurarea asietei &amp; tasării</strong> — Asieta din mers și tasarea sunt înregistrate la fiecare viteză. Ținta este un unghi optim de asietă de 4-6° pentru carenele cu planare.</li>
    <li><strong>Studiul valului de prova</strong> — Tăieturile transversale de val sunt măsurate la două viteze pentru a evalua rezistența la formare de val și pentru a identifica interacțiunile valurilor transversale care ar putea cauza interferențe la pupa.</li>
    <li><strong>Comportament pe mare (opțional)</strong> — Teste în val de prova și val de pupa, în valuri regulate, pentru a măsura rezistența adițională, accelerația verticală și probabilitatea de slamming.</li>
    <li><strong>Analiza datelor &amp; recomandări</strong> — Se livrează un raport complet, cu grafice comparative, curbe viteză/putere și recomandări specifice de proiectare pentru carena la scară reală.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Rezultate tipice ale testelor în bazin — Rezistență vs. viteză (carenă RIB 450, scară 1:3,5)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">10 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">81 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">15 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">121 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">20 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">158 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">25 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">197 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">30 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:100%"></div>
        </div>
        <span class="w-16 text-right">232 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Rezistența la scară de model (N) la viteze scalate Froude. Predicția puterii la scară reală urmează metoda de predicție a performanței ITTC-1978.</p>
  </div>


  <h2>Echipa de experți</h2>

  <p>Bazinul nostru este operat de un hidrodinamicist cu doctorat în arhitectură navală și 8 ani de experiență cu bazinele de remorcare la un important institut european de cercetare maritimă. Acesta este sprijinit de un tehnician care pregătește toate modelele și instrumentația. Echipa urmează
  Procedurile recomandate ITTC (International Towing Tank Conference) pentru a se asigura că fiecare test este repetabil, trasabil și apărabil la nivel internațional.</p>


  <h2>Testarea în bazin pentru dezvoltarea carenelor personalizate</h2>

  <p>Bazinul nostru nu este folosit doar pentru carenele proiectate în cadrul companiei — rulăm în mod regulat programe de testare pentru clienții care doresc să valideze o formă personalizată de carenă sau să investigheze o problemă de performanță:</p>

  <ul>
    <li><strong>Compararea formelor de carenă</strong> — Două sau mai multe forme candidate de carenă testate în condiții identice, oferind o comparație obiectivă a rezistenței/vitezei/stabilității pentru a vă informa alegerea de proiectare.</li>
    <li><strong>Optimizarea apendicilor</strong> — Plăci interceptor, șine anti-stropire, trim tabs și spranele pot fi testate în diverse configurații pentru a cuantifica contribuția individuală la reducerea rezistenței.</li>
    <li><strong>Studiu de potrivire a motorului</strong> — Datele de rezistență sunt convertite într-o curbă de predicție a puterii, permițându-vă să selectați puterea optimă a motorului pentru viteza și sarcina utilă dorite.</li>
  </ul>


  <h2>De ce să testați cu noi?</h2>

  <p>Nu vă oferim doar un set de cifre brute. Rapoartele noastre transformă datele din bazin în recomandări inginerești acționabile: „Ridicați șina anti-stropire cu 8 mm pentru a reduce suprafața udată la viteza de croazieră", „Măriți deadrise-ul la oglindă cu 3° pentru a reduce accelerația de
  slamming" sau „Mutați centrul de greutate longitudinal cu 150 mm spre pupa pentru o atitudine de planare îmbunătățită". Plecați cu o înțelegere clară a ceea ce trebuie schimbat și de ce.</p>

  <p>Bazinul nostru este disponibil și pentru testări independente de către terți, pe bază de servicii plătite. Dacă dezvoltați o carenă și doriți o evaluare hidrodinamică imparțială, executată profesional, vă invităm să ne contactați.</p>

meta:
  title: Laborator de calitate și inspecție — testare și certificare RIB conform ISO | {SITE}
  description: Verificare independentă a calității pentru bărcile gonflabile. Teste de tracțiune, cicluri de menținere a aerului, teste de decojire a îmbinărilor și certificarea materialelor. Contactează laboratorul nostru de calitate pentru testare de către o terță parte.
back_text: Înapoi la Centrul R&D
home_label: Acasă
hero:
  tagline: Laborator 06
  title: Laborator de calitate și inspecție
  subtitle: Verificare independentă — fiecare test promovat înainte de livrare
  image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  image_alt: Testare UV în laboratorul de inspecție a calității Afarer
intro: >-
  Fiecare barcă care iese din atelierul nostru poartă certificarea că a trecut de un set definit de inspecții de calitate și teste de materiale. Laboratorul nostru de calitate și inspecție este o funcție independentă în cadrul organizației — raportează direct directorului general, nu producției —
  asigurând că nicio presiune comercială nu poate compromite punctul de inspecție. Dacă un lot de materiale sau o barcă finalizată nu respectă specificația publicată, laboratorul are autoritatea de a opri expedierea până la rezolvarea neconformității.
content_html: >-
  <h2>Încredere, dar verifică</h2>

  <p>Laboratorul funcționează în cadrul unui sistem de management al calității aliniat principiilor, iar metodele noastre de testare se bazează pe standardele ISO, ASTM și EN, acolo unde acestea sunt aplicabile. Păstrăm evidențe detaliate pentru fiecare test efectuat, creând un lanț complet de
  trasabilitate, de la primirea materiilor prime până la livrarea finală a ambarcațiunii.</p>


  <h2>Echipamente de testare și capabilități</h2>

  <table>
    <thead><tr><th>Echipament</th><th>Teste efectuate</th><th>Standard / Metodă</th></tr></thead>
    <tbody>
      <tr><td>Mașină universală de testare (50 kN)</td><td>Rezistența la tracțiune (țesătură), rezistența la decojire (cusături), propagarea rupturii</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Banc de testare a retenției de aer (programabil)</td><td>Rezistență la 1000 de cicluri de umflare/dezumflare, test de menținere a presiunii timp de 30 min</td><td>ISO 6185 (intern)</td></tr>
      <tr><td>Dispozitiv de decojire a cusăturilor (decojire motorizată la 180°)</td><td>Rezistența la decojire a cusăturilor sudate și lipite la 100 mm/min</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Testor de presiune hidrostatică</td><td>Rezistența țesăturii la pătrunderea apei (0–1000 mbar)</td><td>ISO 811</td></tr>
      <tr><td>Comparator digital de grosime &amp; micrometru</td><td>Grosimea țesăturii, grosimea peretelui tubului, grosimea peliculei adezive</td><td>ISO 2286-3</td></tr>
      <tr><td>Cameră climatică</td><td>Condiționare termică (-40 °C la +80 °C) pentru teste de fisurare la rece și îmbătrânire termică</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Spectrofotometru de culoare</td><td>Măsurarea culorii Delta-E după expunerea la UV</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>


  <h2>Porțile de inspecție — de la material la livrare</h2>

  <p>Fiecare ambarcațiune urmează un plan de calitate definit, cu puncte obligatorii de inspecție. Nicio ambarcațiune nu poate sări peste o poartă; fiecare poartă trebuie semnată de un inspector de calitate înainte de începerea următoarei etape de producție.</p>


  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Poarta 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspecția materialelor la recepție</p>
            <p class="text-xs text-gray-500 mt-1">Lotul de țesătură, lotul de adeziv, feroneria — toate verificate conform specificației de recepție înainte de eliberarea în producție.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Poarta 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspecția sudurilor în timpul producției</p>
            <p class="text-xs text-gray-500 mt-1">Proba de sudură de la prima piesă este testată (decojire + vizual) la începutul fiecărui schimb de producție.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Poarta 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Testul de aer al camerelor</p>
            <p class="text-xs text-gray-500 mt-1">Fiecare cameră este presurizată la 1.5 x presiunea de lucru și menținută 30 min. Datele sunt înregistrate pe număr de serie.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Poarta 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Inspecția înainte de livrare</p>
            <p class="text-xs text-gray-500 mt-1">Ambarcațiunea completă este inspectată: toate elementele de fixare strânse la cuplul corect, sisteme funcționale, fără defecte cosmetice. Listă de verificare cu 100 de puncte.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Poarta 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Certificare finală</p>
            <p class="text-xs text-gray-500 mt-1">Rapoartele de testare compilate, evidențele inspecțiilor revizuite, Certificatul de Conformitate eliberat.</p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <h2>Indicatori-cheie de calitate (medie mobilă 2025)</h2>

  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">99.7 %</span>
      <span class="text-xs text-gray-500">Randament la prima trecere (lot de țesătură)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&lt; 0.2 %</span>
      <span class="text-xs text-gray-500">Rata de respingere a sudurilor (metru liniar)</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Camere testate cu aer înainte de asamblare</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 6185</span>
      <span class="text-xs text-gray-500">Conformitate cu categoria de proiectare</span>
    </div>
  </div>


  <h2>Echipa noastră de calitate</h2>

  <p>Laboratorul este format dintr-un manager de calitate (10 ani în asigurarea calității navale, ASQ Certified Quality Engineer), doi inspectori de calitate (fiecare cu certificare NDT Nivel 2 în testare vizuală) și un tehnician de materiale responsabil cu toate testările fizice. Echipa participă
  anual la testări de competență prin intermediul unui furnizor terț independent, pentru a ne asigura că rezultatele testelor rămân exacte și reproductibile.</p>


  <h2>Testare independentă pentru clienți</h2>

  <p>Laboratorul nostru de Calitate &amp; Inspecție este disponibil pentru servicii independente de testare. Dacă trebuie să verificați o specificație de țesătură, să validați un nou sistem adeziv sau să obțineți un raport de testare de la o terță parte pentru o calificare de achiziție, putem
  efectua testele conform standardului aplicabil și putem emite un raport de testare certificat.</p>

  <p>Exemple de lucrări recente de testare de către terți:</p>

  <ul>
    <li>Comparație a rezistenței la decojire a cinci produse concurente de peliculă adezivă pentru un program european de achiziții militare.</li>
    <li>Studiu de îmbătrânire accelerată (UV + cicluri termice) pentru o nouă formulă de PVC pigmentat portocaliu, cu măsurători intermediare regulate la intervale de 500 h.</li>
    <li>Validarea retenției de aer a 50 de supape deflector de prototip pentru un nou design de tub de înaltă presiune.</li>
  </ul>


  <h2>Angajamentul nostru față de dumneavoastră</h2>

  <p>Când primiți o ambarcațiune {SITE.name}, primiți și dosarul ei de calitate — o evidență completă a rezultatelor testelor aplicabile ambarcațiunii dumneavoastră specifice. Certificatul lotului de țesătură, testele de decojire a sudurilor, jurnalele testelor de aer ale camerelor și lista de
  verificare a inspecției înainte de livrare. Fiecare cifră este trasabilă. Fiecare inspector este identificat. Acesta nu este doar un document — este promisiunea noastră că ceea ce am livrat este ceea ce am specificat.</p>

  <p>Dacă aveți vreodată o problemă legată de calitate, puteți contacta laboratorul direct — datele de contact sunt tipărite pe certificatul dumneavoastră de conformitate. Luăm fiecare sesizare în serios și ne angajăm să efectuăm o investigație oficială în termen de 48 de ore.</p>

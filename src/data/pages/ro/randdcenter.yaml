rd_services:
  tagline: Cercetare și dezvoltare personalizată
  title: Servicii de cercetare și dezvoltare pentru parteneri
  services:
    - title: Dezvoltare personalizată de materiale
      desc: Dezvoltăm formulări de țesături personalizate, structuri laminate și sisteme adezive adaptate mediului dumneavoastră de operare și obiectivelor de performanță.
    - title: Inginerie de produs OEM / ODM
      desc: Dezvoltăm formulări de țesături personalizate, structuri laminate și sisteme adezive adaptate mediului dumneavoastră de operare și obiectivelor de performanță.
    - title: Testare și certificare de către terți
      desc: Folosește facilitățile noastre de testare conforme ISO pentru testarea independentă a materialelor, validarea produselor și suport de certificare.
  cta: Discutați cerințele dumneavoastră de R&D →
  cta_link: /contact
vision:
  tagline: Viziunea noastră
  title: Conturăm viitorul sporturilor acvatice
  body: >-
    afarer își propune să conducă industria bărcilor gonflabile și a SUP-urilor prin inovare continuă, calitate neclintită și un angajament ferm față de siguranță și sustenabilitate — îmbogățind, în cele din urmă, experiențele pasionaților de sporturi nautice din întreaga lume. Centrul R&D afarer
    este locul unde pasiunea întâlnește inovația, stabilind noi standarde pentru industria sporturilor nautice.
labs_section:
  tagline: Laboratoare
  title: Laboratoarele noastre
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: Laborator de țesături PVC
      description: Cercetare și testare continuă a țesăturilor pentru tuburi din PVC și Hypalon, pentru rezistență la tracțiune, rezistență UV, abraziune și flexibilitate la temperaturi scăzute, pentru a asigura fiabilitatea pe termen lung în medii marine.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: Studioul de Inginerie a Carenelor
      description: Design bazat pe CAD și analiză cu elemente finite pentru carene din HDPE, aluminiu și fibră de sticlă. Fiecare carenă este simulată digital pentru distribuția tensiunilor și rezistența la impact înainte de realizarea primului prototip.
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: Centru de sudare RF
      description: Unități dedicate de sudare prin radiofrecvență, cu control de precizie al temperaturii și presiunii, care produc cusături rezistente și etanșe, conforme standardelor industriei maritime pentru ambarcațiunile gonflabile.
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: Bazin de testare hidrodinamică
      description: Testarea modelelor la scară în bazinul nostru de testare propriu pentru a optimiza forma carenei, performanța de planare, stabilitatea și eficiența consumului de combustibil într-o gamă largă de condiții de încărcare și de mare.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Atelier de prototipuri
      description: Instalație de prototipare și echipare la scară reală, unde modelele noi sunt construite, dotate și testate pe mare. Fiecare prototip parcurge un program de testare în apă de minimum 20 de ore înainte de aprobarea producției.
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: Laborator de calitate și inspecție
      description: Laborator dedicat de asigurare a calității, care efectuează testări de tracțiune, cicluri de retenție a aerului, teste de decojire a cusăturilor și certificarea materialelor, pentru a ne asigura că fiecare ambarcațiune care părăsește atelierul respectă specificațiile noastre publicate.
      href: /randdcenter/quality-inspection-lab

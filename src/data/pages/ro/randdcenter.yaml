meta:
  title: Centrul de Cercetare și Dezvoltare | {SITE}
  description: Cercetare & Dezvoltare — testarea țesăturilor PVC, inginerie a carenei, sudare RF, testare hidrodinamică și controlul calității. Sunt disponibile servicii personalizate de R&D.
hero:
  tagline: Centrul R&D
  title: Centru de R & D
  subtitle: Concentrați pe progres
intro:
  - >-
    Centrul de Cercetare și Dezvoltare (R&D) afarer este forța motrice din spatele misiunii noastre de a revoluționa echipamentele de sporturi acvatice. Oferim entuziaștilor de sporturi acvatice din întreaga lume produse mai sigure, mai confortabile și mai plăcute, prin inovație neîncetată în
    plăcile gonflabile de stand-up paddle (SUP) și bărci. Echipa noastră dedicată de ingineri, designeri și experți pasionați în sporturi acvatice modelează viitorul industriei, ridicând constant ștacheta calității, performanței și sustenabilității.
  - >-
    Centrul nostru de cercetare și dezvoltare reunește sub același acoperiș specialiști în materiale, arhitecți navali și ingineri de producție. De la formularea materialelor și simularea cocii până la dezvoltarea proceselor de sudare și testele maritime la scară reală, fiecare etapă a dezvoltării
    produsului este bazată pe date și validată prin testare.
mission:
  tagline: Misiunea noastră
  title: Inovăm viitorul sporturilor acvatice
  pillars:
    - icon: lightning
      title: Progres tehnologic
      desc: Inovăm în materii prime, designuri și procese de fabricație pentru o performanță superioară și o durată de viață mai lungă a produselor.
    - icon: design
      title: Design Centrat pe Utilizator
      desc: Înțelegerea profundă și depășirea nevoilor utilizatorilor printr-un design de produs ergonomic și intuitiv.
    - icon: globe
      title: Practici sustenabile
      desc: Ne minimizăm amprenta asupra mediului prin utilizarea de materiale și procese ecologice.
    - icon: shield
      title: Siguranță fără compromisuri
      desc: Asigurăm cele mai înalte standarde de siguranță prin testare riguroasă și certificare.
pillars:
  - title: Progres tehnologic
    desc: Deschidem noi drumuri în materiale, designuri și procese de fabricație pentru a oferi performanțe superioare și o durată de viață îndelungată a produselor.
    icon: tech
  - title: Materiale avansate
    desc: Investigăm PVC de ultimă generație, Hypalon, compozite și alternative sustenabile pentru caracteristici îmbunătățite ale produselor.
    icon: materials
  - title: Sustenabilitate
    desc: 'Un angajament fundamental: suntem dedicați protejării mediului prin producție sustenabilă și materiale reciclabile.'
    icon: sustainability
capabilities:
  tagline: Capabilități
  title: Capabilități de cercetare și dezvoltare
  subtitle: Patru discipline de bază care ne oferă control complet asupra dezvoltării produsului —de la cercetarea materiilor prime până la certificarea finală.
  groups:
    - title: Știința materialelor și tehnologia țesăturilor
      items:
        - Analiza și optimizarea formulărilor de PVC și Hypalon
        - Stabilizare UV, ignifugare și dezvoltare de aditivi antimicrobieni
        - Laminare multi-strat a țesăturilor și inginerie de aderență
        - Testare accelerată de îmbătrânire (UV, termică, umiditate, ceață sărată)
    - title: Inginerie a carenei & hidrodinamică
      items:
        - Proiectare parametrică 3D a carenei și optimizare CFD
        - Analiză cu elemente finite pentru sarcini structurale și de impact
        - Testare la scară în bazinul de remorcare și validarea performanței
        - Dezvoltarea de carene personalizate pentru profiluri de misiune speciale
    - title: Tehnologie de sudare și îmbinare
      items:
        - Dezvoltarea și optimizarea procesului de sudare dielectrică RF
        - Metode de sudare cu aer cald, pană fierbinte și ultrasunete
        - Calificarea îmbinării adezive și a benzilor de cusătură
        - Modelarea rezistenței sudurilor și predicția duratei de viață
    - title: Testare, certificare și conformitate
      items:
        - Managementul calității și testarea conformității CE
        - Suport pentru testare și certificare independentă de terți
        - Dezvoltarea de protocoale de testare personalizate pentru calificarea aprovizionării
        - Analiza defecțiunilor în exploatare și investigarea cauzelor fundamentale

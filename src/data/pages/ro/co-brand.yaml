faqs:
  title: 'Co-Brand — Întrebări Frecvente'
  subtitle: 'Cum funcționează co-branding-ul Afarer și prin ce diferă de OEM și marca privată.'
  items:
    - title: 'Co-branding-ul este același lucru cu OEM sau marca privată?'
      description: 'Nu. Afarer nu mai operează un program deschis de OEM/marcă privată. Produsele co-branded rămân produse Afarer — proiectate, proiectate tehnic, verificate calitativ și susținute de marca Afarer. Identitatea ta apare ca un co-brand, nu ca un produs terț fără marcă.'
    - title: 'Cine poate începe un proiect co-brand?'
      description: 'Afaceri calificate din domeniul sporturilor nautice: parteneri de țară existenți, cluburi de paddle, stațiuni și hoteluri, organizatori de evenimente și comunități. Trimite-ne un brief de proiect și confirmăm aplicabilitatea înainte de începerea designului.'
    - title: 'Va intra co-branding-ul în conflict cu distribuitorul din țara mea?'
      description: 'Nu. Modelul o țară – un distribuitor are prioritate. Colecțiile co-branded se coordonează cu partenerul local de țară acolo unde există, astfel încât nicio marcă paralelă sau concurentă să nu apară într-un teritoriu protejat.'
    - title: 'Care este comanda minimă pentru o colecție co-brand?'
      description: 'Colecțiile pilot încep de la 30–50 de bucăți. Colecțiile standard sunt de 50–100 de bucăți; edițiile mari sau multi-regiune de 100+ bucăți. Calendarul dezvoltării personalizate se stabilește per proiect.'
    - title: 'Ce reprezintă calitatea Afarer față de contribuția partenerului?'
      description: 'Afarer deține designul produsului, ingineria, materialele, construcția, QC-ul și garanția. Partenerii contribuie cu conceptul colecției, denumirea, culorile, grafica și accesul pe piață. Astfel se păstrează un singur standard de calitate pe apă.'
    - title: 'Cum aplic?'
      description: 'Completează formularul de solicitare co-brand cu afacerea, piața și ideea de colecție. Analizăm potrivirea și răspundem în 3 zile lucrătoare cu o propunere și Co-Brand Project Agreement.'

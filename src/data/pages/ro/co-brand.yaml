features:
  title: 'Ce Înseamnă Co-Branding la Afarer'
  subtitle: 'Co-branding-ul este programul nostru de parteneriat de design — construit în jurul mărcii Afarer, protecției teritoriale și colecțiilor limitate, nu producției fără marcă.'
  columns: 3
  items:
    - title: 'Produsele Afarer Rămân Produse Afarer'
      description: 'O colecție co-branded este o ediție limitată de plăci Afarer cu identitatea ta țesută în ea. Nu este niciodată fără marcă, niciodată o marcă terță și niciodată un program deschis de marcă privată.'
      icon: 'tabler:trademark'
    - title: 'Proiectat cu Tine'
      description: 'Culorile, denumirea și povestea ta modelează colecția. Echipa noastră de design și inginerie se ocupă de punți, grafică, ambalaje și documentație, de la brief la livrare.'
      icon: 'tabler:pencil'
    - title: 'Pentru Cluburi, Stațiuni, Evenimente & Comunități'
      description: 'Colecții de flotă pentru cluburi de paddle și stațiuni, ediții de evenimente pentru curse și serii comunitare — toate cu calitatea și garanția Afarer.'
      icon: 'tabler:users'
    - title: 'Protejează Partenerii de Țară'
      description: 'Co-branding-ul funcționează alături de modelul nostru o țară – un distribuitor. Partenerii naționali își păstrează teritoriul; colecțiile co-branded nu deschid ușa mărcilor paralele pe piața lor.'
      icon: 'tabler:shield-check'
    - title: 'Inginerie & Standarde de Calitate'
      description: 'Fiecare colecție pleacă din lanțul nostru de aprovizionare certificat cu documentație CE și ISO 9001, testare la presiune și aceleași puncte de control QC ca gama noastră principală.'
      icon: 'tabler:certificate'
    - title: 'Devine un Activ de Marcă'
      description: 'O colecție co-branded limitată îți construiește propria poveste pe apă — marjă de vânzare, conținut media și un motiv pentru paddleri să revină sezon după sezon.'
      icon: 'tabler:star'

timeline:
  - year: '2012'
    title: Fundația producției maritime
    body: afarer a început ca un atelier specializat de ambarcațiuni gonflabile în Qingdao, China, dedicat meșteșugului marin și fabricării bărcilor gonflabile. Accentul inițial a fost construirea de produse gonflabile fiabile prin experiență inginerească practică și disciplină de producție.
  - year: '2015'
    title: Primul export și certificarea CE
    body: Primele comenzi de export au ajuns în Japonia și Coreea. Certificarea CE a fost obținută pentru liniile principale de produse, marcând intrarea afarer pe piețele internaționale. Compania a început să deservească utilizatori comerciali și de agrement dincolo de China.
  - year: '2018'
    title: Extinderea fabricii
    body: Mudare într-o unitate de producție de 12.000 m². Au fost adăugate linii de sudură RF și capacitate de producție drop-stitch, permițând fabricarea la scară mai mare și sisteme îmbunătățite de control al calității.
  - year: '2020'
    title: Înființarea centrului C&D
    body: Deschiderea unui centru dedicat de cercetare și dezvoltare cu laborator de țesături PVC, bazin de testare hidrodinamică și studio de simulare CAD/FEA. Dezvoltarea produselor s-a extins pentru a se concentra pe construcții ușoare, durabilitate îmbunătățită și design centrat pe utilizator.
  - year: '2022'
    title: Certificare și creștere globală
    body: Obținerea certificării ISO 9001. Echipa extinsă la 14 ingineri C&D și peste 200 de muncitori. Produsele au ajuns la clienți din Europa, Americi și Asia-Pacific prin parteneriate de distribuție și co-brand.
  - year: '2024'
    title: Studio de inovație și design
    body: Lansarea unui studio complet de design și inovație pentru proiecte co-brand personalizate, de la concept la producție. Consolidarea aplicațiilor maritime profesionale, inclusiv pentru misiuni de salvare, comerciale și guvernamentale.
  - year: '2026'
    title: Construind viitorul explorării apelor
    body: Astăzi, afarer continuă să dezvolte ambarcațiuni gonflabile, sisteme SUP și soluții maritime personalizate —conectând oameni și organizații cu apele lumii. Peste 50 de țări deservite, capacitate anuală de peste 15.000 de unități.
content_founding:
  tagline: Începutul
  title: Născuți pe apă
  subtitle: 'afarer a început într-un atelier de coastă din Qingdao cu o ambarcațiune și o viziune: să construiască ambarcațiuni gonflabile capabile să facă față condițiilor marine reale.'
  paragraphs:
    - În 2012, fondatorii noștri au văzut o oportunitate pe piață —majoritatea bărcilor gonflabile erau fie accesibile, dar nesigure, fie de înaltă calitate, dar prohibitiv de scumpe. Au crezut că există loc pentru un producător care să ofere atât calitate, cât și valoare.
    - Prima cocă a fost construită manual, testată în ape locale și perfecționată pe baza feedback-ului real de la pescari și mici operatori comerciali. Această buclă de feedback —construiește, testează, ascultă, îmbunătățește —rămâne în centrul filozofiei noastre inginerești și astăzi.
    - Până în 2015, vestea s-a răspândit dincolo de Qingdao. Distribuitorii internaționali au început să solicite mostre. Ceea ce a început ca un atelier local devenea un furnizor global.
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Atelierul de producție timpuriu afarer și procesul de fabricație
content_growth:
  tagline: Creștere și inovație
  title: De la atelier la unitatea de 12.000 m²
  subtitle: Investițiile continue în oameni, echipamente și procese au transformat afarer într-o unitate modernă de producție marină.
  paragraphs:
    - Odată cu creșterea cererii, a crescut și unitatea noastră. Ne-am extins de la un mic atelier la o fabrică de 12.000 m² cu linii de producție dedicate pentru ambarcațiuni SUP, bărci gonflabile, plăci SUP și accesorii.
    - Am investit în mașini de tăiat CNC, echipamente de sudură de înaltă frecvență, linii de producție drop-stitch și instalații complete de testare —permițându-ne să controlăm fiecare aspect al calității producției.
    - Astăzi, echipa noastră de peste 200 de persoane include ingineri marini, specialiști în știința materialelor, experți în controlul calității și meșteșugari calificați —mulți dintre aceștia fiind alături de afarer încă de la început.
philosophy:
  tagline: Filozofia mărcii
  title: Ingineria libertății pe apă
  body: Libertatea pe apă nu înseamnă doar mișcare. Reprezintă descoperirea de locuri noi, crearea de experiențe în aer liber, conectarea oamenilor cu natura și facilitarea misiunilor profesionale. Ingineria face posibilă această libertate.
  pillars:
    - title: Fiabilitatea pe primul loc
      body: Mediul acvatic necesită încredere. Produsele afarer sunt proiectate având în vedere stabilitatea, durabilitatea, siguranța și performanța constantă.
    - title: Design centrat pe om
      body: Produsele ar trebui să servească oamenii, nu tehnologia. Fiecare decizie de design începe cu înțelegerea modului în care oamenii folosesc ambarcațiunile, unde explorează și ce provocări întâmpină.
    - title: Explorare accesibilă
      body: Apa nu ar trebui să aparțină doar experților. afarer creează echipamente care permit mai multor persoane să experimenteze în siguranță râuri, lacuri, oceane și medii de coastă.
    - title: Inovație continuă
      body: Inovația nu înseamnă doar crearea de produse noi. Înseamnă îmbunătățirea fiecărui detaliu —materiale, structuri, producție și experiența utilizatorului.
engineeringDna:
  tagline: ADN inginoresc
  title: Cum creează afarer produse
  areas:
    - title: Știința materialelor
      body: afarer se concentrează pe selectarea materialelor adecvate pentru diferite medii marine. Considerațiile cheie includ rezistența la abraziune, rezistența la UV, stabilitatea la presiune și durabilitatea pe termen lung.
      items:
        - Rezistență la abraziune
        - Rezistență UV
        - Stabilitate la presiune
        - Durabilitate pe termen lung
    - title: Inginerie structurală
      body: Ambarcațiunile gonflabile necesită un echilibru precis între rigiditate, greutate, portabilitate și stabilitate. Ingineria afarer se concentrează pe optimizarea acestor factori prin tehnologia drop-stitch și metode avansate de construcție a cusăturilor.
      items:
        - Rigiditate
        - Optimizare greutate
        - Portabilitate
        - Stabilitate
    - title: Precizie de fabricație
      body: 'Fiecare produs trece prin procese controlate: prepararea materialului, tăierea de precizie, sudarea și lipirea, asamblarea, inspecția calității și verificarea performanței.'
      items:
        - Preparare material
        - Tăiere de precizie
        - Sudare și lipire
        - Asamblare și control
    - title: Ingineria scenariilor de utilizare
      body: Produsele sunt dezvoltate în jurul aplicațiilor reale —agrement, aventură și uz profesional —asigurând că fiecare design îndeplinește cerințele specifice ale mediului său de destinație.
      items:
        - Agrement
        - Aventură
        - Profesional
        - Comercial

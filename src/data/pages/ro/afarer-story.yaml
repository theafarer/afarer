    title: Angajament pentru calitate
    body: De la inspecția materialelor până la testarea finală, afarer menține procese sistematice de calitate pentru a livra produse maritime fiabile. Fiecare unitate este supusă testării la presiune, inspecției cusăturilor și verificării performanței înainte de expediere.
    items:
      - CE Certified —Toate produsele respectă standardele europene de siguranță
      - ISO 9001:2015 —Sistem de management al calității certificat
      - UKCA Marked —Conformitate pentru piața britanică
      - FCC Compliant —Conformitate cu reglementările americane pentru componente electronice

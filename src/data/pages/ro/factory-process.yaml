hero:
  tagline: Proces de producție
  title: Procesul nostru de producție
  subtitle: De la materie primă la produs finit —fiecare pas este controlat calitativ.
  back_label: Înapoi la fabrică
  back_link: /factory
intro: >-
  Spre deosebire de mărcile care externalizează producția către fabrici terțe, afarer deține și operează întregul lanț de producție. Această integrare verticală ne permite să menținem un control riguros al calității în fiecare etapă, să răspundem rapid cerințelor personalizate și să livrăm o
  calitate constantă a produselor, lot după lot. Iată cum este construită o placă SUP în unitatea noastră.
steps:
  - step: '01'
    title: Tăiere
    description: Mașini CNC automate taie materialele textil cu precizie după specificații.
    duration: 1–2 days
  - step: '02'
    title: Sudare
    description: Sudarea RF și cu aer cald creează îmbinări puternice și etanșe.
    duration: 2–4 ore per trusă de barcă
  - step: '03'
    title: Asamblare
    description: Tehnicieni calificați montează valve, accesorii și fittinguri.
    duration: 1–2 days per boat
  - step: '04'
    title: Testare
    description: Fiecare produs trece prin teste de presiune, flotabilitate și inspecție.
    duration: 1–2 zile per placă
  - step: '05'
    title: Ambalare
    description: Produsele sunt ambalate cu grijă și pregătite pentru expediere.
    duration: 1–2 days
  - step: '06'
    title: Asamblare finală & Montaj
    description: Supapele, inelele D, mânerele, casetele pentru aripioare și padurile de punte sunt instalate pe linia de asamblare. Fiecare placă urmează o listă de verificare a asamblării cu 100 de puncte, cu semnare obligatorie la fiecare etapă.
    duration: 1–2 days
  - step: '07'
    title: Testarea și inspecția calității
    description: >-
      Fiecare placă finalizată trece printr-un control obligatoriu de calitate: test de etanșeitate la aer al camerelor, verificarea funcționării accesoriilor, verificarea cuplului de strângere a elementelor de fixare și inspecție cosmetică. Producțiile personalizate și prototipurile beneficiază, de
      asemenea, de teste în apă care acoperă stabilitatea și manevrabilitatea.
    duration: 1–2 days
  - step: '08'
    title: Ambalare și expediere
    description: >-
      Plăcile sunt dezumflate și pliate conform procedurii, ambalate în saci țesuți de mare rezistență sau cutii de retail și încărcate pentru expediere. Fiecare pachet este etichetat cu modelul, numărul de serie și destinația. Coordonăm cu agențiile de transport expedierile în containere FCL și LCL
      către toată lumea.
    duration: 1 zi

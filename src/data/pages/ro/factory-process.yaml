intro: >-
  Spre deosebire de mărcile care externalizează producția către fabrici terțe, afarer deține și operează întregul lanț de producție. Această integrare verticală ne permite să menținem un control riguros al calității în fiecare etapă, să răspundem rapid cerințelor personalizate și să livrăm o calitate constantă a produselor, lot după lot. Iată cum este construită o placă în unitatea noastră.

steps:
  - step: '01'
    title: Recepția și inspecția materialelor
    description: Fiecare lot intrat de țesătură PVC, mat de fibră de sticlă, rășină și accesorii este inspectat în raport cu specificațiile. Mostrele de țesătură sunt testate pentru rezistență la tracțiune, uniformitatea grosimii și rezistența la UV înainte de aprobarea pentru producție. Materialele neconforme sunt puse în carantină și returnate.
    duration: 1–2 zile
  - step: '02'
    title: Tăierea automată a PVC
    description: Țesăturile aprobate sunt așezate pe mașina automată de tăiere CNC și tăiate cu precizie sub-milimetrică. Aranjarea optimizată pe calculator poziționează panourile astfel încât risipa să fie minimă — de regulă sub 5%. Panourile tăiate sunt etichetate după modelul plăcii și cameră, apoi grupate pentru transfer în atelierul de sudare.
    duration: 2–4 ore per trusă de placă
  - step: '03'
    title: Etanșarea termică și sudarea tuburilor
    description: Panourile sunt fixate provizoriu și lipite utilizând mașini de etanșare termică cu sudare cu aer cald la temperaturi controlate de 200–300 °C. Custurile principale sunt consolidate prin sudare dielectrică RF pentru îmbinări etanșe și de rezistență ridicată. Camerele finalizate sunt umflate la 1.5× presiunea de lucru pentru validarea retenției de aer pe durata a 30 de minute.
    duration: 1–2 zile per placă
  - step: '04'
    title: Imprimarea și decorarea SUP
    description: Grafica punților plăcilor SUP este aplicată prin imprimare digitală pentru designuri full-color de calitate foto și prin serigrafie pentru logo-uri durabile și modele repetitive. Imprimeriile sunt stabilizate și sigilate pentru rezistență la UV și la abraziune.
    duration: 1–2 zile
  - step: '05'
    title: Asamblarea finală și echiparea
    description: Plăcile sunt echipate pe linia de asamblare cu aripioare, valve, punți EVA și accesorii. Fiecare unitate urmează o listă de verificare a asamblării cu 100 de puncte, cu semnare obligatorie la fiecare etapă.
    duration: 2–4 zile
  - step: '06'
    title: Testarea și inspecția calității
    description: 'Fiecare placă finalizată trece prin controlul obligatoriu de calitate: test de etanșeitate la aer al camerelor, verificarea funcționării accesoriilor, verificarea cuplului de strângere a elementelor de fixare și inspecție cosmetică. Plăcile personalizate și prototipurile beneficiază, de asemenea, de teste în apă care acoperă stabilitatea și manevrabilitatea.'
    duration: 1–2 zile
  - step: '07'
    title: Ambalarea și expedierea
    description: Plăcile sunt dezumflate, pliate conform procedurii, ambalate în saci țesuți de mare rezistență sau lăzi de placaj și încărcate pentru expediere. Fiecare pachet este etichetat cu modelul, numărul de serie și destinația. Coordonăm cu agenții de transport expedierile în containere FCL și LCL către întreaga lume.
    duration: 1 zi


hero:
  tagline: Partners & Distribution
  title: 'Deveniți partener afarer<br />—rețea globală de distribuție'
  subtitle: "Join afarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries."
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: afarer global partner and distributor network
content_programs:
  tagline: Partner Programs
  title: 'Programe partenere<br />create pentru creștere'
  subtitle: 'Indiferent dacă sunteți distribuitor, dealer sau partener de marcă, afarer oferă programe concepute pentru a vă sprijini afacerea.'
  columns: 3
  items:
    - title: 'Distributor Program'
      description: 'Distribuție teritorială exclusivă cu prețuri de volum, suport marketing și acces direct la fabrică. Angajament minim necesar în funcție de dimensiunea teritoriului.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Prețuri directe de dealer, instruire privind produsul, materiale de marketing și suport de garanție pentru magazinele fizice și online.'
      icon: tabler:building-store
    - title: 'OEM/ODM Partnership'
      description: 'Producție OEM și ODM cu servicii complete, cu branding personalizat, ambalare și specificații de produs. De la concept la container.'
      icon: tabler:certificate
    - title: 'Brand Partnership'
      description: 'Co-branding, marcă privată și programe de model exclusiv pentru mărci consacrate în domeniul marin și al recreerii în aer liber.'
      icon: tabler:stars
    - title: 'Government & Institutional'
      description: 'Programe de furnizori preferați pentru agenții guvernamentale, paze de coastă, militare și organizații umanitare. Documentație gata de licitație.'
      icon: tabler:building-community
    - title: 'Resort & Rental Partner'
      description: 'Prețuri de flotă, calitate constantă și branding personalizat pentru stațiuni, centre de scufundări și operațiuni de închiriere din întreaga lume.'
      icon: tabler:sun
content_benefits:
  tagline: Why Partner With Us
  title: 'De ce partenerii aleg afarer'
  subtitle: 'Partenerii noștri beneficiază de capacități reale de producție, calitate constantă și suport receptiv.'
  list:
    - 'Direct Factory Access: Work directly with our manufacturing team —no middlemen. Get faster responses, better pricing, and full visibility into production.'
    - 'Customization Ready: Brand your products with custom colors, logos, packaging, and specifications. Minimum order quantities tailored to your market.'
    - 'Quality Guaranteed: ISO 9001 certified production with CE, UKCA, and BSCI compliance. Every product tested before shipping.'
    - 'Global Logistics: Shipping from Qingdao, China with FOB, CIF, and DDP options. US warehouse in Montclair, CA for North American distribution.'
    - 'Marketing Support: Product catalogs, photography, technical documentation, and digital assets to support your sales efforts.'
    - 'Training & Support: Product training for your sales team, technical support for your customers, and warranty service coordination.'
content_process:
  tagline: How to Become a Partner
  title: 'Proces simplu de parteneriat'
  subtitle: 'Procesul nostru de parteneriat este simplu —conceput pentru a vă face să vindeți produse afarer rapid.'
  items:
    - title: 'Step 1: Submit Application'
      description: 'Completați formularul nostru de cerere de parteneriat cu profilul companiei dvs., piața țintă și interesele privind produsele.'
    - title: 'Step 2: Qualification Review'
      description: 'Echipa noastră de parteneriate analizează cererea dvs. și vă contactează în termen de 3 zile lucrătoare pentru a discuta oportunitățile.'
    - title: 'Step 3: Agreement & Setup'
      description: 'Semnati un acord de parteneriat, configurați-vă contul și primiți prețuri de partener, materiale de marketing și mostre de produse.'
    - title: 'Step 4: Training & Launch'
      description: 'Oferim instruire privind produsul, suport de vânzări și materiale de marketing. Sunteți gata să începeți vânzările.'
cta:
  title: 'Sunteți gata să deveniți partener afarer?'
  subtitle: 'Aplicați pentru parteneriat și echipa noastră va răspunde în termen de 3 zile lucrătoare.'
  actions:
    - variant: primary
      text: Apply for partnership
      href: /contact
    - text: View our products
      href: /products

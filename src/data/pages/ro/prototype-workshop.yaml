back_text: Înapoi la Centrul R&D
home_label: Acasă
hero:
  tagline: Lab 05
  title: Atelier de prototipuri
  subtitle: De la modelul CAD la o barcă gata de mare — construită, echipată și dovedită
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Fabricație de bărci prototip în atelierul Afarer
intro: >-
  Un model CAD, oricât de detaliat, nu poate dezvălui cum se va comporta efectiv o ambarcațiune înainte de a ajunge pe apă. De aceea, Atelierul nostru de prototipuri este conceput pentru a transforma datele inginerești într-o ambarcațiune fizică, aptă de navigație pe mare, cât mai rapid și mai
  precis posibil. Fiecare model nou Afarer — și fiecare construcție personalizată importantă — trece prin acest atelier înainte de a se angaja producția de serie.
content_html: >
  <h2>Acolo unde designul devine realitate</h2>

  <p>Atelierul este complet echipat pentru fabricarea simultană a carenei, tuburilor și echipamentelor. Această abordare cu flux de lucru paralel reduce termenul de livrare al prototipului la 8-12 săptămâni de la lansarea în inginerie, față de norma din industrie de 16-20 săptămâni. Atunci când
  aplicația dvs. necesită o soluție specializată, putem trece de la concept la validarea pe apă în mai puțin de trei luni.</p>


  <h2>Capabilitățile atelierului</h2>

  <table>
    <thead><tr><th>Post de lucru</th><th>Echipamente</th><th>Scop</th></tr></thead>
    <tbody>
      <tr><td>Fabricarea carenei</td><td>Cuptor de rotomulare (HDPE), zonă de sudare TIG (aluminiu), matrițe de stratificare manuală (fibra de sticlă)</td><td>Producția carenei la scară reală în toate cele trei tipuri de material</td></tr>
      <tr><td>Asamblarea tuburilor</td><td>Presă de sudare RF, stație de prindere cu aer cald, dispozitiv de testare la umflare</td><td>Fabricarea ansamblurilor de tuburi la scară reală, cu toate diafragmele, conurile și supapele</td></tr>
      <tr><td>Echipare și montaj</td><td>Macara pentru motor (500 kg), cadru de machetă pentru consolă, dispozitiv de sertizare furtunuri hidraulice, panou de cablaje electrice</td><td>Dotare completă: motor, direcție, comenzi, sistem de combustibil, electronică, scaune</td></tr>
      <tr><td>Zona de instrumentație</td><td>Senzor de viteză GPS, debitmetru de combustibil, accelerometre, rețea de termocupluri, data-logger</td><td>Instalarea și calibrarea instrumentației pentru probele pe mare</td></tr>
    </tbody>
  </table>


  <h2>Parcursul prototipului — pas cu pas</h2>

  <ol>
    <li><strong>Predarea din inginerie</strong> — Pachetul de proiectare (model 3D, raport FEA, lista de materiale, planul de stratificare) este revizuit oficial de șeful atelierului și de inginerul de proiect. Orice problemă de producție este semnalată și rezolvată înainte de începerea tăierii.</li>
    <li><strong>Producția carenei</strong> — Carena este construită conform specificațiilor de inginerie. Pentru HDPE: programul de rotomulare este încărcat din simularea Moldex3D. Pentru aluminiu: plăcile tăiate cu CNC sunt sudate în zona TIG, urmând harta de sudare aprobată. Pentru fibra de sticlă: planul de straturi este urmat strat cu strat.</li>
    <li><strong>Fabricarea tuburilor</strong> — Materialul textil este tăiat folosind șabloane cu pattern CNC, apoi sudat prin RF în camere de dimensiuni reale. Fiecare cameră este umflată la presiunea de test și lăsată timp de 24 h pentru stabilizare inițială.</li>
    <li><strong>Asamblare și echipare</strong> — Carena și tuburile sunt îmbinate. Motorul este montat, direcția și comenzile sunt conectate, sistemul de combustibil este instalat, iar toate circuitele electrice sunt cablate și verificate.</li>
    <li><strong>Teste statice</strong> — Înainte ca barca să atingă apa, aceasta trece prin: verificarea flotabilității (sarcină completă + rezervă de 30 %), testul de presiune al sistemului de combustibil, testul de rotație completă a sistemului de direcție și testul de continuitate a legăturii electrice la masă.</li>
    <li><strong>Programul de probe pe mare</strong> — 20 de ore de testare pe apă, detaliate mai jos.</li>
    <li><strong>Revizuirea prototipului</strong> — Se organizează o ședință oficială de validare cu echipele de inginerie, producție și calitate. Orice modificare necesară a designului este documentată și integrată în versiunea de producție.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Programul de probe pe mare de 20 de ore — Programul testelor</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Manevre în port — manevrabilitate la viteză redusă, marșarier, verificarea apărătorilor</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Proba de viteză — viteza maximă verificată cu GPS, viteza de croazieră, consumul de combustibil la 3 regimuri RPM</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Proba de viraj — diametrul tactic, avansul și deplasarea laterală la 20 nd, la babord și la tribord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Proba de impact — treceri repetate prin valuri scurte de 0,5–1,0 m; accelerometru la baza scaunului pilotului</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Proba de stabilitate — unghi de înclinare static cu 4 membri ai echipajului + echipament la tribord, sarcină decalată</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Proba de anduranță — 3 h continue la viteza de croazieră; monitorizarea temperaturii (motor, combustibil, electric)</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Inspecția finală — inspecția tuturor sistemelor după probe, strângerea/verificarea tuturor elementelor de fixare, documentarea constatărilor</span>
      </div>
    </div>
  </div>


  <h2>Prototipuri personalizate pentru aplicații unice</h2>

  <p>Atelierul de prototipuri este locul unde rezolvăm problemele pe care bărcile standard de producție nu le pot aborda. Exemple recente includ:</p>

  <ul>
    <li>Un RIB de 7,8 m pentru o organizație de căutare și salvare, care necesita o structură de cabină personalizată cu protecție la răsturnare, suporturi integrate pentru targă și un pod de sonar montat în prova — toate prototipate, montate și testate la unitatea noastră.</li>
    <li>O barcă gonflabilă de 5,2 m pentru un contractant de cercetări hidrografice, cu oglinda coborâtă, catarg demontabil pentru instrumente și nișe pentru traductoare prin carenă, proiectate pentru a minimiza perturbarea fluxului.</li>
    <li>O barcă auxiliară de 4,5 m cu propulsie electrică pentru un superyacht, unde prototipul a fost folosit pentru a valida autonomia, infrastructura de încărcare și nivelurile de zgomot înainte ca clientul să comande o flotă de patru unități.</li>
  </ul>


  <h2>Echipa noastră de prototipare</h2>

  <p>Atelierul este deservit de opt tehnicieni marini policalificați, fiecare instruit în cel puțin două dintre cele trei discipline de bază (carenă, tub, echipamente). Liderul echipei este un constructor de bărci expert, cu 16 ani de experiență, de la construcții unice personalizate la serii de
  producție. Fiecărui prototip i se atribuie un inginer de proiect dedicat, care reprezintă un singur punct de contact pentru client pe tot parcursul procesului de construcție și testare.</p>


  <h2>Implicarea clientului</h2>

  <p>Încurajăm activ clienții să participe la momentele-cheie pe parcursul construcției prototipului — în special la revizuirea inițială a echipării și la probele pe mare. Feedback-ul dvs. operațional în aceste etape este de neprețuit pentru reglarea fină a bărcii înainte de intrarea în producție.
  Nu construim în vid; construim în parteneriat cu dvs.</p>

  <p>Probele pe mare de 20 de ore sunt, de asemenea, o oportunitate pentru echipa dvs. de a se familiariza cu manevrabilitatea bărcii, cu amplasarea sistemelor și cu cerințele de întreținere, asigurând o tranziție lină spre exploatare atunci când bărcile de producție sunt livrate.</p>

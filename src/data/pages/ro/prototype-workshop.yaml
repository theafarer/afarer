back_text: Înapoi la Centrul R&D
home_label: Acasă
hero:
  tagline: Lab 05
  title: Atelier de prototipuri
  subtitle: De la modelul CAD la o placă gata de apă — construită, echipată și dovedită
  image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
  image_alt: Fabricație de plăci prototip în atelierul Afarer
intro: >-
  Un model CAD, oricât de detaliat, nu poate dezvălui cum se va comporta efectiv o placă înainte de a ajunge pe apă. De aceea, Atelierul nostru de prototipuri este conceput pentru a transforma datele inginerești într-o placă fizică, gata de apă, cât mai rapid și mai
  precis posibil. Fiecare model nou Afarer — și fiecare construcție personalizată importantă — trece prin acest atelier înainte de a se angaja sculele de producție.
content_html: >
  <h2>Acolo unde designul devine realitate</h2>

  <p>Atelierul este complet echipat pentru fabricarea simultană a carenei, tuburilor și echipamentelor. Această abordare cu flux de lucru paralel reduce termenul de livrare al prototipului la 8-12 săptămâni de la lansarea în inginerie, față de norma din industrie de 16-20 săptămâni. Atunci când
  aplicația dvs. necesită o soluție specializată, putem trece de la concept la validarea pe apă în mai puțin de trei luni.</p>


  <h2>Capabilitățile atelierului</h2>

  <table>
    <thead><tr><th>Post de lucru</th><th>Echipamente</th><th>Scop</th></tr></thead>
    <tbody>
      <tr><td>Fabricarea carenei</td><td>Tăietor de țesătură CNC, presă de laminare termică, stație de pregătire a miezurilor drop-stitch</td><td>Producția carenei la scară reală în toate cele trei tipuri de construcție</td></tr>
      <tr><td>Asamblarea bordurilor și a camerelor</td><td>Presă de sudare RF, stație de fixare cu aer cald, dispozitiv de testare la umflare</td><td>Fabricarea ansamblurilor de borduri și camere la scară reală, cu toate diafragmele și supapele</td></tr>
      <tr><td>Echipare și montaj</td><td>Dispozitiv de frezare pentru casetele de aripioare, dispozitive de sudare pentru suporturile de încărcătură și mânere, stație de tăiere a covorașelor de punte</td><td>Dotare completă: aripioare, suporturi de încărcătură, prize de leașă, mânere, covorașe de punte, supape</td></tr>
      <tr><td>Zona de instrumentație</td><td>Senzor de viteză GPS, traductoare de presiune, accelerometre, rețea de termocupluri, data-logger</td><td>Instalarea și calibrarea instrumentației pentru probele pe mare</td></tr>
    </tbody>
  </table>


  <h2>Parcursul prototipului — pas cu pas</h2>

  <ol>
    <li><strong>Predarea din inginerie</strong> — Pachetul de proiectare (model 3D, raport FEA, lista de materiale, planul de stratificare) este revizuit oficial de șeful atelierului și de inginerul de proiect. Orice problemă de producție este semnalată și rezolvată înainte de începerea tăierii.</li>
    <li><strong>Producția carenei</strong> — Carena este construită conform specificațiilor de inginerie. Pentru construcția cu un singur strat: miezul drop-stitch este laminat cu învelișul PVC specificat. Pentru construcția cu două straturi: învelișul suplimentar este aplicat peste laminatul de bază înainte de tăierea patternului. Pentru construcția fuzionată: parametrii de laminare sunt încărcăți din fișa de proces aprobată și verificați pe o mostră inițială.</li>
    <li><strong>Fabricarea bordurilor</strong> — Materialul textil este tăiat folosind șabloane cu pattern CNC, apoi sudat prin RF în borduri și camere de dimensiuni reale. Fiecare cameră este umflată la presiunea de test și lăsată timp de 24 h pentru stabilizare inițială.</li>
    <li><strong>Asamblare și echipare</strong> — Carena și bordurile sunt îmbinite. Casetele de aripioare și suporturile de încărcătură sunt montate, prizele de leașă și mânerele de transport sunt instalate, supapa de umflare este strânsă la cuplul specificat, iar covorașul de punte este aplicat și aliniat.</li>
    <li><strong>Teste statice</strong> — Înainte ca placa să atingă apa, aceasta trece prin: verificarea flotabilității (sarcină completă + rezervă de 30 %), testul de menținere a presiunii camerelor, testul de scurgere a supapei și testul de tracțiune pentru mânere și suporturi.</li>
    <li><strong>Programul de probe pe mare</strong> — 20 de ore de testare pe apă, detaliate mai jos.</li>
    <li><strong>Revizuirea prototipului</strong> — Se organizează o ședință oficială de validare cu echipele de inginerie, producție și calitate. Orice modificare necesară a designului este documentată și integrată în versiunea de producție.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Programul de probe pe mare de 20 de ore — Programul testelor</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Familiarizare pe apă plată — direcționare la viteză mică, viraje, verificarea poziției și a asietei</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">4 h</span>
        <span class="flex-1">Proba de viteză — viteza maximă verificată cu GPS, viteza de croazieră, ritm susținut la 3 rate de vâslire</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Proba de viraj — raza virajului pivot și a virajului cu măturare, reacția plăcii, la babord și la tribord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Proba în apă agitată — treceri repetate prin valuri scurte de 0,5–1,0 m; accelerometru la poziția practicianului</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Proba de stabilitate — unghi de înclinare static cu 4 practicanți de greutăți diferite, sarcină decalată la tribord</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">3 h</span>
        <span class="flex-1">Proba de anduranță — 3 h continue la viteza de croazieră; monitorizarea presiunii camerelor, a temperaturii bordurilor și a oboselii practicianului</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Inspecția finală — inspecția tuturor componentelor după probe, strângerea/verificarea tuturor elementelor de fixare, documentarea constatărilor</span>
      </div>
    </div>
  </div>


  <h2>Prototipuri personalizate pentru aplicații unice</h2>

  <p>Atelierul de prototipuri este locul unde rezolvăm problemele pe care plăcile standard de producție nu le pot aborda. Exemple recente includ:</p>

  <ul>
    <li>Un SUP de salvare de înaltă vizibilitate pentru o organizație de căutare și salvare, care necesita mânere de prindere integrate, suporturi pentru echipament de salvare și o carenă cu flotabilitate ridicată pentru recuperarea persoanelor — toate prototipate, montate și testate la unitatea noastră.</li>
    <li>Un SUP de touring de expediție pentru un contractant de cercetări hidrografice, cu catarg demontabil pentru instrumente, porturi etanșe pentru echipament și un suport de traductor cu profil jos, proiectat pentru a minimiza rezistența.</li>
    <li>Un SUP de pescuit compact pentru o flotă de resort, unde prototipul a fost folosit pentru a valida stabilitatea, echiparea cu accesorii și durabilitatea în utilizarea zilnică de închiriere înainte ca clientul să comande o flotă de patru unități.</li>
  </ul>


  <h2>Echipa noastră de prototipare</h2>

  <p>Atelierul este deservit de opt tehnicieni marini policalificați, fiecare instruit în cel puțin două dintre cele trei discipline de bază (carenă, borduri, echipare). Liderul echipei este un fabricant maestru, cu 16 ani de experiență, de la construcții unice personalizate la serii de
  producție. Fiecărui prototip i se atribuie un inginer de proiect dedicat, care reprezintă un singur punct de contact pentru client pe tot parcursul procesului de construcție și testare.</p>


  <h2>Implicarea clientului</h2>

  <p>Încurajăm activ clienții să participe la momentele-cheie pe parcursul construcției prototipului — în special la revizuirea inițială a echipării și la probele pe mare. Feedback-ul dvs. operațional în aceste etape este de neprețuit pentru reglarea fină a plăcii înainte de intrarea în producție.
  Nu construim în vid; construim în parteneriat cu dvs.</p>

  <p>Probele pe mare de 20 de ore sunt, de asemenea, o oportunitate pentru echipa dvs. de a se familiariza cu manevrabilitatea plăcii, cu amplasarea punții și cu cerințele de întreținere, asigurând o tranziție lină spre exploatare atunci când plăcile de producție sunt livrate.</p>

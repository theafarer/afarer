label: Ghid
headline: Ce este o placă SUP gonflabilă?
subtitle: Un ghid complet pentru înțelegerea plăcilor SUP gonflabile —construcție, tehnologie și cum să alegi.
seo:
  headline: Ce este o placă SUP gonflabilă?
  description: 'Ghid complet pentru plăcile SUP gonflabile: construcție, tehnologie, utilizare și comparație cu plăcile rigide.'
  datePublished: '2024-01-15'
  dateModified: '2026-06-01'
body: |
  <h2>Ce este un SUP gonflabil?</h2>
  <p>Un SUP (Stand-Up Paddle Board) gonflabil este o ambarcațiune portabilă realizată din material PVC drop-stitch care devine rigidă atunci când este pompată la presiune înaltă (12-15 PSI).</p>
  <p>În ciuda faptului că sunt gonflabile, plăcile SUP moderne egalează rigiditatea și performanța plăcilor rigide pentru majoritatea scopurilor recreative.</p>

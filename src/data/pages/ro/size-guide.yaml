categories:
  inflatable: Plăci SUP gonflabile proiectate pentru portabilitate fără a compromite performanța. Alege dimensiunea potrivită greutății și stilului tău de canotaj.
  sup: Plăci de stand-up paddle pentru touring, yoga, fitness și canotaj recreativ. Alege în funcție de lungime și de greutatea practicantului.
  accessory: Accesorii și echipamente de siguranță pentru a completa placa ta de SUP. Dimensiuni universale cu mai multe opțiuni.

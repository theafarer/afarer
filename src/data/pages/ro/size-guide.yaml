how_to_choose:
  title: Cum să alegi dimensiunea potrivită
  cards:
    - title: Plăci SUP
      description: Alege lungimea în funcție de greutatea ta și utilizarea dorită. Plăcile mai late (32"+) oferă mai multă stabilitate. Plăcile mai lungi (11-12 ft) mențin direcția mai bine pentru touring. Practicanții mai grei au nevoie de plăci cu volum mai mare.
    - title: Plăci SUP de touring
      description: Plăcile mai lungi (11–12 ft) sunt cele mai bune pentru distanțe lungi și touring. Plăcile mai late (32"+) oferă mai multă stabilitate. Verifică capacitatea de greutate pentru încărcătura totală inclusiv echipamentul.

    - title: Plăci SUP all-around
      description: Alege lungimea în funcție de greutatea practicantului și utilizarea dorită. Plăcile all-around sunt potrivite pentru recreere, fitness și yoga. Plăcile mai mici sunt mai manevrabile.

hero:
  tagline: Capacitate de producție
  title: Capacitate de producție și producție anuală
  subtitle: Facilitate de 12,000 m² care produce 15,000+ ambarcațiuni pe an, cu spațiu pentru extindere
intro: >-
  afarer operates one of the largest dedicated inflatable boat manufacturing facilities in Qingdao, China. Our 12,000 m² factory is organized into six specialized workshops operating in parallel, giving us the capacity to produce over 15,000 boats annually across SUP, SUP, SUP, SUP, and safety
  equipment lines.
highlights:
  - value: 12,000 m²
    label: Suprafața totală de producție
    detail: În 6 ateliere specializate
  - value: 15,000+
    label: Boats produced annually
    detail: SUPs, SUPs, RIBs, SUPs, safety gear
  - value: 200+
    label: Forță de muncă calificată
    detail: 25+ ingineri, 2 schimburi/zi
  - value: 50+
    label: Țări de export
    detail: UE, SUA, AU, Orientul Mijlociu, Asia
  - value: 30–45
    label: Termen standard de livrare (zile)
    detail: De la confirmarea comenzii (PO) până la FOB
  - value: 10+
    label: Ani de experiență în export
    detail: Din 2012
workshops:
  - title: Producția de plăci SUP
    description: '4 linii de asamblare paralele pentru plăcile SUP gonflabile. Fiecare linie poate produce 50–80 de plăci pe schimb. Stațiile de imprimare digitală și serigrafie funcționează simultan. Capacitate anuală de producție SUP: peste 8.000 de plăci.'
    output: 8.000+ SUP/an
  - title: SUP Boat Production
    description: 'Atelier dedicat pentru carene din fibră de sticlă cu 6 stații de matrițe pentru carene SUP de până la 7,6 m. Zona de sudare și asamblare a tuburilor manipulă 3–6 SUP-uri simultan. Capacitate anuală SUP: peste 2.000 de ambarcațiuni.'
    output: 2,000+ RIBs/year
  - title: Inflatable Boat & SUP
    description: 'Linii de producție multi- scop pentru bărci inflabile, caiace și SUP-uri. Stațiile de sudură cu aer cald, presele dielectrice RF și posturile de asamblare sunt reconfigurate în funcție de mixul de comenzi. Capacitate anuală: peste 5.000 de unități.'
    output: 5,000+ unități/an
  - title: Echipament de siguranță
    description: 'Zonă separată de producție curată pentru veste de salvare și echipamente de siguranță. Stații dedicate de cusut, inserare spumă și testare. Capacitate anuală de veste de salvare: peste 50.000 de unități.'
    output: 50,000+ veste de salvare/an
oem_capacity:
  moq: 'SUP: 5–10 units | SUP: 2–5 units | SUP/SUP: 10–50 units | Custom mould: 200+ units'
  lead_time: Standard 30–45 zile. Mostră 15–10 zile. Urgență disponibilă.
  payment: T/T 30% avans + 70% înainte de expediere. Se acceptă L/C, Western Union.

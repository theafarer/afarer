hero:
  tagline: Capacitate de producție
  title: Capacitate de producție și producție anuală
  subtitle: 'Facilitate de 12.000 m² care produce 15.000+ ambarcațiuni pe an, cu spațiu pentru extindere'
intro: >-
  afarer operează una dintre cele mai mari fabrici dedicate producției de bărci gonflabile din Qingdao, China. Fabrica noastră de 12.000 m² este organizată în șase ateliere specializate care funcționează în paralel, oferindu-ne capacitatea de a produce peste 15.000 de bărci anual pe liniile SUP, bărci auxiliare și echipamente de siguranță.
highlights:
  - value: '12.000 m²'
    label: Suprafața totală de producție
    detail: În 6 ateliere specializate
  - value: 15,000+
    label: 'Bărci produse anual'
    detail: 'SUP, bărci auxiliare, echipament de siguranță'
  - value: 200+
    label: Forță de muncă calificată
    detail: 25+ ingineri, 2 schimburi/zi
  - value: 50+

  description: 'Capacitatea fabricii afarer: instalație de 12.000 m² care produce peste 15.000 de bărci pe an, cu spațiu de creștere. Producție OEM/ODM la scară largă de plăci de SUP gonflabile și bărci.'
  keywords:

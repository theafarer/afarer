workshops:
  - title: Producția de plăci SUP
    description: '4 linii de asamblare paralele pentru plăcile SUP gonflabile. Fiecare linie poate produce 50–80 de plăci pe schimb. Stațiile de imprimare digitală și serigrafie funcționează simultan. Capacitate anuală de producție SUP: peste 10.000 de plăci.'
    output: 10.000+ SUP/an
  - title: 'Bărci gonflabile și SUP'
    description: 'Linii de producție multifuncționale pentru bărci gonflabile și bărci auxiliare. Stațiile de sudură cu aer cald, presele dielectrice RF și posturile de asamblare sunt reconfigurate în funcție de mixul de comenzi. Capacitate anuală: peste 5.000 de unități.'
    output: '5.000+ unități/an'
  - title: Echipament de siguranță
    description: 'Zonă separată de producție curată pentru veste de salvare și echipamente de siguranță. Stații dedicate de cusut, inserare spumă și testare. Capacitate anuală de veste de salvare: peste 50.000 de unități.'
    output: '50.000+ veste de salvare/an'
oem_capacity:
  moq: 'SUP: 50 unități (mostre de la 5–10) | Barcă: 2–5 unități | Barcă auxiliară: 10–50 unități | Matriță personalizată: 200+ unități'
  lead_time: Standard 30–45 zile. Mostră 15–20 zile. Urgență disponibilă.
  payment: T/T 30% avans + 70% înainte de expediere. Se acceptă L/C, Western Union.

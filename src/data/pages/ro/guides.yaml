hero:
  tagline: Ghiduri
  title: Începător în SUP?
  subtitle: Ghiduri practice care vă ajută să alegeți, să folosiți și să vă bucurați de plăcile SUP gonflabile.
size_guide:
  tagline: Dimensiuni și specificații
  title: Găsește dimensiunea potrivită nevoilor tale
  desc: Compară dimensiunile plăcilor SUP, capacitățile de încărcare și utilizările recomandate. Fie că ai nevoie de un SUP de touring, o placă de yoga sau un SUP all-around — ghidul nostru de dimensiuni te ajută să alegi potrivirea corectă.
  link_label: Ghid complet cu specificațiile produsului →
  link: /size-guide
  cards:
    - title: Plăci SUP
      desc: Alege lungimea în funcție de greutatea ta și de utilizarea dorită. Plăcile mai late (32"+) oferă mai multă stabilitate. Plăcile mai lungi (11–12 ft) se mențin mai bine pe cursă la touring.
    - title: SUP-uri de touring
      desc: Plăci mai lungi (11–12 ft) pentru parcurgerea distanțelor și menținerea traiectoriei drepte. Suficient de stabile pentru touring cu echipament. Verificați întotdeauna capacitatea de greutate.
    - title: SUP-uri all-around
      desc: Alegeți lungimea în funcție de greutatea utilizatorului și de modul de utilizare. Plăcile mai late (32"+) oferă stabilitate. Versatile pentru recreere și fitness.

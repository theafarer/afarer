intro: >-
  Materialul tubului este cel mai important material dintr-o ambarcațiune gonflabilă. Acesta trebuie să reziste expunerii constante la radiații UV, ciclurilor repetate de umflare, abraziunii de docuri și resturi și variațiilor extreme de temperatură — menținându-și în același timp integritatea
  structurală ani de zile. La Afarer, laboratorul nostru de materiale PVC este dedicat exclusiv caracterizării, validării și îmbunătățirii continue a materialelor pe care le folosim în fiecare ambarcațiune pe care o construim.
content_html: >-
  <h2>Fundamentul fiecărei bărci gonflabile</h2>

  <p>Nu ne bazăm exclusiv pe fișele tehnice ale furnizorilor. Fiecare lot de material PVC și Hypalon care intră în atelierul nostru este testat independent, în propria unitate. Aceasta garantează că specificația de material pe care o publicăm este performanța materialului pe care o primiți — lot
  după lot, an după an.</p>


  <h2>Echipamente de testare standardizate</h2>

  <p>Laboratorul nostru de materiale este dotat cu instrumente de calitate industrială, conforme cu metodele de testare ISO, ASTM și EN:</p>

  <table>
    <thead><tr><th>Echipament</th><th>Parametri măsurați</th><th>Standard</th></tr></thead>
    <tbody>
      <tr><td>Mașină universală de tracțiune (50 kN)</td><td>Forța de rupere, alungirea la rupere, propagarea fisurii</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>Cameră de intemperizare cu arc xenon</td><td>Rezistența la UV (modificarea culorii, menținerea rezistenței după 2000 h)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>Aparat de încovoiere la temperaturi scăzute</td><td>Temperatura de fisurare de la -30 °C la -50 °C</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Aparat de abraziune Taber</td><td>Pierderea de masă după 1000 de cicluri (roată CS-10)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>Micrometru de grosime (digital, rezoluție 0,001 mm)</td><td>Uniformitatea pe lățimea rolei</td><td>ISO 2286-3</td></tr>
      <tr><td>Aparat pentru presiune hidrostatică</td><td>Rezistența la pătrunderea apei</td><td>ISO 811</td></tr>
    </tbody>
  </table>

  <p class="text-sm text-gray-500">* Toate echipamentele sunt calibrate anual de laboratoare acreditate terțe.</p>


  <h2>De la date la decizie: un flux de lucru tipic de testare</h2>

  <p>Atunci când sosește un nou material candidat, acesta urmează un proces standardizat de calificare în șapte etape:</p>

  <ol>
    <li><strong>Inspecția la recepție</strong> — verificarea vizuală a defectelor de suprafață, a orificiilor și a conformității dimensionale.</li>
    <li><strong>Cartografierea grosimii</strong> — măsurare în 20 de puncte pe toată rola; pentru acceptare este necesar CV &lt; 3%.</li>
    <li><strong>Testarea la tracțiune</strong> — 5 epruvete pe direcțiile urzeală și bătătură. Minimum 3500 N/50 mm pentru PVC 1100 dtex.</li>
    <li><strong>Condiționare UV</strong> — expunere de 1000 h în camera cu arc xenon; este necesară menținerea a minimum 80 % din rezistență.</li>
    <li><strong>Fisurare la rece</strong> — 4 h la -35 °C, apoi îndoire la 180° peste un dorn de 25 mm. Fără fisuri vizibile.</li>
    <li><strong>Rezistența la abraziune</strong> — 1000 de cicluri, pierdere de masă ≤ 0,05 g.</li>
    <li><strong>Aprobarea finală</strong> — numai după trecerea tuturor celor șapte etape materialul este eliberat pentru producție.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">PVC tipic 1100 dtex — Menținerea rezistenței la tracțiune după expunerea UV</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 h<br />100%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 h<br />95%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 h<br />88%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 h<br />82%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">Concurent<br />~65%</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Materialul nostru PVC 1100 dtex menține &gt; 80 % din rezistența la tracțiune după expunerea de 2000 h la arc xenon, în comparație cu gradele industriale tipice care scad sub 70 %.</p>
  </div>


  <h2>Echipa noastră profesională</h2>

  <p>Laboratorul este format din doi ingineri de materiale cu normă întreagă, fiecare cu o diplomă în știința polimerilor sau inginerie textilă și cu minimum șase ani de experiență în industrie. Aceștia sunt sprijiniți de trei tehnicieni care efectuează testele zilnice și înregistrarea datelor.
  Echipa participă în mod regulat la teste inter-laborator de tip round-robin organizate de Organizația Internațională de Standardizare (ISO) pentru a valida acuratețea metodelor noastre de testare.</p>


  <h2>Rezolvăm cele mai dificile provocări legate de materiale</h2>

  <p>Fiecare mediu marin este diferit. O ambarcațiune de patrulare care operează în Golful Persic se confruntă cu condiții de UV și temperatură radical diferite față de o ambarcațiune de salvare din Marea Nordului. Laboratorul nostru de materiale vă ajută să selectați — sau să dezvoltați — o
  specificație de material optimizată pentru profilul dvs. de operare.</p>

  <p>Soluții personalizate recente:</p>

  <ul>
    <li>Un amestec PVC cu rezistență ridicată la abraziune pentru un client militar ale cărui bărci acostează frecvent pe recife de corali (+40 % durată de viață la abraziune).</li>
    <li>O formulare Hypalon pentru temperaturi scăzute, destinată unei stații de cercetare arctice, testată la -50 °C fără fragilizare.</li>
    <li>Un material portocaliu cu culoare stabilizată pentru o flotă de căutare și salvare, care își menține vizibilitatea după 3 ani de expunere la soarele tropical.</li>
  </ul>

  <p>Nu vindem materiale "gata făcute" și nu ne rugăm ca ele să funcționeze. Testăm, validăm și recomandăm — sau creăm — o soluție adaptată profilului specific al misiunii dvs. Aceasta este diferența Afarer.</p>


  <h2>Cum vă sprijinim</h2>

  <p>Atunci când ne aduceți o provocare legată de materiale, iată ce vă puteți aștepta:</p>

  <ol>
    <li><strong>Consultare</strong> — discutăm despre mediul dvs. de operare, obiectivele de performanță și buget.</li>
    <li><strong>Propunere</strong> — se elaborează un plan de testare cu criterii clare de promovare/neîndeplinire și un calendar.</li>
    <li><strong>Execuție</strong> — laboratorul nostru efectuează testele și întocmește un raport detaliat cu date brute și analize comparative.</li>
    <li><strong>Recomandare</strong> — vă prezentăm o specificație de material, inclusiv opțiuni alternative dacă mai multe materiale îndeplinesc cerințele dvs.</li>
    <li><strong>Urmărire</strong> — după livrare, rămânem disponibili pentru orice întrebări legate de material în exploatare.</li>
  </ol>

  <p>Scopul nostru nu este doar să vă vindem o barcă. Este să ne asigurăm că ambarcațiunea pe care o primiți funcționează fiabil în condițiile în care operați — și totul începe cu materialul.</p>

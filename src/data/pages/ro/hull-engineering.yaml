intro: >-
  Carena este coloana vertebrală a oricărei plăci SUP gonflabile. Trebuie să fie suficient de ușoară pentru a aluneca eficient, suficient de rezistentă pentru a face față țărmurilor stâncoase și suficient de rigidă pentru a transforma fiecare lovitură de vâslă în mișcare înainte. La Afarer, Studioul nostru de
  Inginerie a Carenelor combină modelare CAD avansată, analiza cu elemente finite (FEA) și decenii de experiență practică în proiectarea plăcilor pentru a livra carene optimizate pentru disciplina lor de utilizare — nu forme generice adaptate dintr-un catalog.
content_html: >
  <h2>Unde rezistența întâlnește hidrodinamica</h2>

  <p>Lucrăm cu trei platforme principale de construcție — miezuri PVC drop-stitch ranforsate, laminate din fibră de sticlă așezate manual și polietilenă turnată rotativ — și avem capacitatea de inginerie de a proiecta, simula și valida fiecare dintre ele intern.</p>


  <h2>Instrumente și standarde de proiectare</h2>

  <p>Mediul nostru digital de inginerie include:</p>

  <table>
    <thead><tr><th>Capacitate</th><th>Software / Instrument</th><th>Aplicație</th></tr></thead>
    <tbody>
      <tr><td>Modelare parametrică 3D</td><td>SolidWorks Professional</td><td>Suprafața carenei, ranforsarea bordurilor și a stinghiilor, amenajarea punții, puncte de montare a echipamentului</td></tr>
      <tr><td>Analiza cu elemente finite</td><td>ANSYS Mechanical &amp; LS-DYNA</td><td>Cartografierea tensiunilor, analiză modală, simulare de coliziune/impact</td></tr>
      <tr><td>Dinamica fluidelor computațională</td><td>Ansys Fluent / Star-CCM+</td><td>Predicția rezistenței hidrodinamice, optimizarea asietei</td></tr>
      <tr><td>Ingineria laminatelor</td><td>ESAComp / CADEC</td><td>Stratificarea fibrei de sticlă, selecția miezului, estimarea greutății</td></tr>
      <tr><td>Simularea fluxului în matriță</td><td>Moldex3D</td><td>Predicția grosimii pereților la rotomulare</td></tr>
    </tbody>
  </table>


  <h2>Fluxul nostru de lucru în inginerie</h2>

  <p>Fiecare design de carenă, fie că este un model standard sau un proiect complet personalizat, urmează un proces riguros în cinci etape:</p>

  <ol>
    <li><strong>Concept și colectarea cerințelor</strong> — Ne întâlnim cu dumneavoastră pentru a defini greutatea practicianului și sarcina utilă, plaja de viteze, capacitatea la starea apei, cerințele de transport și orice echipament special de misiune (suporturi pe punte, poziții de fixare a încărcăturii, integrarea accesoriilor).</li>
    <li><strong>Modelare 3D a suprafețelor și calcul hidrostatic</strong> — Forma carenei este modelată în SolidWorks și verificată pentru stabilitate hidrostatică, distribuția volumului și momentul de redresare folosind instrumente de analiză integrate.</li>
    <li><strong>FEA structural</strong> — Se definesc cazurile de încărcare: static (practicant + echipament), dinamic (impacturi de aterizare pe valuri la 5g) și eșuare (lovirea unui țărm stâncos la 3 m/s). Se analizează contururile de tensiune; factorul de siguranță ≥ 2.5 este obligatoriu.</li>
    <li><strong>Optimizarea rezistenței prin CFD</strong> — Carena este simulată în trei condiții de încărcare și la cinci viteze. Suprafața udată, unghiul de asietă și rezistența reziduală sunt reduse iterativ.</li>
    <li><strong>Revizuirea și lansarea designului</strong> — Pachetul complet de inginerie (model 3D, raport FEA, raport CFD, estimare de greutate, plan de stratificare) este revizuit de inginerul nostru principal înainte de lansarea către atelierul de prototipuri.</li>
  </ol>


  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Distribuția tensiunilor FEA — Carena SUP de touring (Drop-Stitch ranforsat)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Factor de siguranță la sarcină utilă maximă</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15.2 %</span>
        <span class="text-gray-500">Reducerea rezistenței față de generația anterioară</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">87 kN/m²</span>
        <span class="text-gray-500">Presiunea maximă de slamming (limită de proiectare)</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">18 000 h</span>
        <span class="text-gray-500">Timp cumulativ de rulare FEA în 2025</span>
      </div>
    </div>
  </div>


  <h2>Personalizare: carena dumneavoastră, regulile dumneavoastră</h2>

  <p>Nici doi vâslași nu au cerințe identice. Un SUP de pescuit are nevoie de o carenă largă și stabilă; o placă de touring are nevoie de o carenă de deplasare care maximizează alunecarea; un SUP de surf are nevoie de borduri receptive și rocker reglat. Nu forțăm aplicația dumneavoastră într-o formă de carenă preexistentă. Proiectăm pornind de la specificațiile dumneavoastră.</p>

  <p>Exemple de proiecte recente de inginerie a carenelor personalizate:</p>

  <ul>
    <li>Un SUP de touring cu lungime mărită pentru un operator de eco-turism din Caraibe, cu prova ranforsată pentru aterizări pe plajă (+15 % grosimea bordurilor).</li>
    <li>Un SUP de patrulare de înaltă vizibilitate pentru o autoritate portuară, cu suporturi integrate pentru echipament și borduri tactice.</li>
    <li>Un SUP de touring de expediție pentru o flotă de închirieri, cu borduri ranforsate și fixări suplimentare pentru încărcătură.</li>
  </ul>


  <h2>Inginerii noștri</h2>

  <p>Studioul este condus de un inginer principal cu 14 ani de experiență în proiectarea plăcilor de înaltă performanță, sprijinit de doi ingineri mecanici specializați în FEA și CFD. Toți trei dețin diplome avansate în inginerie marină sau mecanică de la universități recunoscute
  internațional. Echipa publică în mod regulat în reviste de specialitate și prezintă lucrări la conferințe internaționale despre ingineria sporturilor cu vâslă de înaltă performanță.</p>


  <h2>Partener pentru următoarea dumneavoastră carenă</h2>

  <p>De la prima schiță de concept până la raportul final de tensiuni, Studioul nostru de Inginerie a Carenelor este partenerul dumneavoastră în crearea unei plăci care nu este doar construită — ci proiectată. Investim orele de simulare în avans, astfel încât fiecare sudură, fiecare strat de laminat
  și fiecare curbă a carenei să existe dintr-un motiv.</p>

  <p>Fie că aveți nevoie de o modificare minoră a unui model existent sau de un design complet de la zero, suntem gata să discutăm cerințele dumneavoastră.</p>

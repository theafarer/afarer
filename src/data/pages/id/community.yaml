stories:
  tagline: 'Kisah Para Penjelajah'
  title: 'Petualangan nyata dari orang nyata'
  subtitle: 'Dengarkan pendayung, keluarga, dan profesional yang menggunakan perlengkapan afarer di air.'
  items:
    - name: 'Sarah & Mike'
      title: 'Pemilik SUP Explorer 11, Kanada'
      content: 'Kami membawa Explorer 11 kami dalam perjalanan seminggu melintasi Algonquin Park. Papan-papan ini menaklukkan jalur angkut dan penyeberangan danau dengan indah. Konstruksi drop-stitch berarti kami bisa mengembangkan hingga 15 PSI dan mendapatkan performa papan keras dari papan yang bisa dikemas.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-jungle-mandala-app-1-1200w.webp'
      location: 'Algonquin Park, Kanada'
    - name: 'Carlos R.'
      title: 'Pengendara Cheetah Surge, Spanyol'
      content: 'Cheetah Surge adalah andalan saya untuk berjelajah pesisir. Desainnya yang mencolok menarik perhatian di pantai, dan stabilitasnya memberi saya keyakinan di air beriak ringan. Papan ini berkendara indah baik saat touring maupun sekadar menikmati matahari terbenam.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-cheetah-surge-1-1200w.webp'
      location: 'Costa Brava, Spanyol'
    - name: 'Lina & keluarga'
      title: 'Pendayung Flowing Lotus, Swedia'
      content: 'Petualangan keluarga di akhir pekan di kepulauan. Flowing Lotus cukup stabil sehingga putri saya bisa berdiri sementara saya mendayung. Mengembang dalam sekitar 10 menit — tanpa trailer, hanya keseruan keluarga murni di air.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-flowing-lotus-1-1200w.webp'
      location: 'Kepulauan Stockholm, Swedia'
    - name: 'Lt. Cmdr. Andres'
      title: 'Penjelajah Ocean Voyager, Filipina'
      content: 'Saya menggunakan Ocean Voyager untuk tur pesisir jarak jauh di sekitar Palawan. Setelah berbulan-bulan penggunaan harian dalam kondisi tropis, papan ini masih berperforma seperti baru. Bentuk touring-nya menembus air beriak yang akan menghentikan papan kelas bawah.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      location: 'Palawan, Filipina'
    - name: 'Emma T.'
      title: 'Pengguna pertama Tropical Breeze, Australia'
      content: 'Saya belum pernah naik SUP sebelumnya. Tropical Breeze sangat stabil sehingga saya langsung percaya diri pada percobaan pertama. Sekarang saya mendayung setiap akhir pekan. Kurva belajarnya praktis nol — dan papan ini tampak luar biasa di air.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-tropical-breeze-1-1200w.webp'
      location: 'Gold Coast, Australia'


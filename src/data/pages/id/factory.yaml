workshops_section:
  tagline: 'Workshop'
  title: 'Workshop Manufaktur'
  workshops:
    - title: 'Pemotongan PVC & Persiapan Material'
      description: 'Mesin pemotong CNC otomatis memproses PVC dan kain drop-stitch dengan presisi sub-milimeter. Penataan panel yang dioptimalkan komputer meminimalkan limbah material dan memastikan setiap panel memenuhi spesifikasi dimensi sebelum pengelasan.'
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
    - title: 'Pengelasan Tabung & Penyegelan Panas'
      description: 'Workshop pengelasan khusus dengan mesin penyegelan panas dan press dielektrik RF. Alat penyegel udara panas merekatkan dan meleburkan ruang tabung PVC, sementara las RF menghasilkan sambungan kedap udara berkekuatan tinggi yang melampaui persyaratan EN ISO 25649.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    - title: 'Cetakan FRP & Fabrikasi Komposit'
      description: 'Cetakan FRP kustom untuk komponen SUP, diproduksi menggunakan pencetakan fiberglass hand-lay-up dengan sistem resin polyester dan vinylester. Setiap lapisan digulung dengan tangan dan vacuum-bagged demi kualitas yang konsisten. Bilik semprot gelcoat menghasilkan finishing marin berkilau tinggi yang tahan UV.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Pencetakan & Dekorasi SUP'
      description: 'Papan SUP didekorasi menggunakan cetak digital untuk grafis penuh warna dan sablon untuk logo serta pola berulang. Printer digital menghasilkan desain dek berkualitas foto, sementara sablon menghasilkan tanda merek yang tahan lama dan cerah.'
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1-1200w.webp
    - title: 'Perakitan Akhir & Rigging'
      description: 'Lini perakitan tempat inti drop-stitch diselesaikan dengan rail, dek EVA dipasang, serta sirip, valve, dan aksesori dipasang. Setiap papan mengikuti daftar periksa perakitan 100 titik yang disetujui oleh kepala tim.'
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
    - title: 'Pengujian & Inspeksi Kualitas'
      description: 'Setiap papan yang telah selesai menjalani pengujian retensi udara wajib, verifikasi peeling sambungan, dan pemeriksaan sistem menyeluruh sebelum pengiriman. Lab kualitas kami beroperasi independen dari produksi dan melapor langsung kepada manajemen.'
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp


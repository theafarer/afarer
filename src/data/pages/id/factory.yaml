qc_section:
  tagline: 'Kontrol Kualitas'
  title: 'Proses Pengujian & Jaminan Kualitas'
  subtitle: 'Setiap papan menjalani pengujian wajib sebelum pengiriman. Lab kualitas kami beroperasi independen dari produksi dan melapor langsung kepada manajemen.'
  steps:
    - step: '1'
      title: 'Inspeksi Material Baku'
      desc: 'PVC dan kain drop-stitch menjalani pengujian tarik (ASTM D751), perambatan sobekan, dan verifikasi ketahanan UV sebelum batch mana pun memasuki produksi.'
    - step: '2'
      title: 'Uji Retensi Udara 24–48 Jam'
      desc: 'Setiap ruang tabung diinflasi hingga 125% dari tekanan nominal dan ditahan selama 24–48 jam. Penurunan tekanan yang melebihi 5% memicu penolakan otomatis dan inspeksi ulang sambungan.'
    - step: '3'
      title: 'Pengujian Beban & Keseimbangan'
      desc: 'Papan yang telah selesai dibebani hingga kapasitas nominal maksimum dan diuji kestabilan serta kekakuannya. Setiap papan diuji di air sebelum inspeksi akhir.'

oem_section:
  tagline: 'Proyek OEM'
  title: 'Studi Kasus Kemitraan Merek & OEM'
  subtitle: 'Dari konsep hingga kontainer — bagaimana kami membantu merek global meluncurkan dan mengembangkan lini SUP tiup mereka.'
  cases:
    - challenge: 'Pengecer outdoor Eropa membutuhkan lini SUP label pribadi dengan grafis dek unik, PVC ramah lingkungan, dan kemasan siap ritel — semuanya harus dikirim dalam 60 hari.'
      solution: 'Mengembangkan file cetak digital kustom, menyediakan PVC yang memenuhi REACH, dan memampatkan sampling dari 3 putaran menjadi 1 dengan menempatkan tim desain di lokasi pabrik Qingdao kami.'
      result: '55 hari dari PO ditandatangani hingga FOB. 2,400 unit lintas 4 SKU. Pesanan ulang ditempatkan sebelum kontainer pertama tiba.'
    - challenge: 'Startup watersports AS membutuhkan SUP drop-stitch berkinerja tinggi dengan bentuk kustom, kemasan co-branded, dan sertifikasi BSCI untuk penempatan ritel.'
      solution: 'Mengadaptasi cetakan SUP yang ada dengan garis luar yang dimodifikasi, mengembangkan artwork kemasan co-branded, dan menyediakan dokumentasi audit BSCI lengkap.'
      result: 'Berhasil masuk ke 3 jaringan outdoor besar di AS. 5,000+ unit pada tahun pertama dengan tingkat sell-through 98%.'
    - challenge: 'Distributor Australia memerlukan lini SUP bersertifikat CE dengan warna kustom dan kepatuhan terhadap standar Australia.'
      solution: 'Memproduksi sampel pra-produksi dengan 4 varian warna dan mengoordinasikan pengujian kepatuhan pihak ketiga.'
      result: 'Lini SUP 3 model diluncurkan di pasar AU/NZ, disusul kemenangan tender pemerintah untuk 12 SUP patroli.'

faq_section:
  tagline: 'FAQ'
  title: 'Pertanyaan yang Sering Diajukan B2B & OEM'
  questions:
    - q: 'Berapa kuantitas pesanan minimum (MOQ) untuk papan SUP tiup OEM?'
      a: 'MOQ dimulai dari 5–10 unit untuk model OEM standar. Cetakan kustom dan proyek label pribadi memerlukan minimal 200 unit tergantung pada kompleksitasnya. Pesanan uji coba dan produksi sampel tersedia untuk peluncuran merek baru.'
    - q: 'Apakah afarer memiliki sertifikasi BSCI?'
      a: 'Ya. Pabrik kami mempertahankan sertifikasi kepatuhan sosial BSCI yang valid (laporan audit tersedia atas permintaan). Kami juga memegang ISO 9001 untuk manajemen kualitas dan semua produk membawa sertifikasi CE. Dokumentasi kepatuhan REACH dan RoHS disertakan dengan setiap pengiriman OEM.'
    - q: 'Berapa waktu pengerjaan tipikal untuk pesanan OEM?'
      a: 'Waktu pengerjaan standar adalah 30–45 hari dari PO yang dikonfirmasi dan deposit untuk produksi OEM massal. Pengembangan cetakan kustom menambah 15–20 hari untuk tooling. Produksi yang dipercepat tersedia untuk pesanan mendesak dan lonjakan musiman. Sampel prototipe umumnya dikirim dalam 15–20 hari.'
    - q: 'Apakah Anda dapat mengirim FOB Qingdao atau CIF ke pelabuhan kami?'
      a: 'Ya. Kami mengirim FOB Qingdao, CIF ke pelabuhan-pelabuhan utama dunia, dan DDP untuk mitra yang memenuhi syarat. Tim logistik kami mengelola pemesanan kontainer, dokumentasi ekspor, dan pengurusan bea cukai. Kami mengirim ke 50+ negara di pasar Eropa, AS, Australia, dan Asia.'

b2b_moq: 'MOQ standar: 5–10 unit per model. Pesanan uji coba dipersilakan untuk kemitraan baru.'

production_flow:
  tagline: 'Alur Produksi'
  title: 'Dari Material hingga Papan Jadi'
  subtitle: 'Setiap papan melewati 6 tahap produksi dengan titik pemeriksaan QC di setiap langkah. Tanpa jalan pintas, tanpa inspeksi yang dilewati.'
  stages:
    - stage: '01'
      title: 'Penerimaan Material & QC Masuk'
      description: 'Semua material yang masuk dicatat berdasarkan nomor batch/lot dalam sistem ERP kami. Gulungan kain PVC, inti drop-stitch, valve, perekat, dan perangkat keras dikarantina hingga QC memberikan persetujuan.'
      qc_check: 'Kekuatan tarik (ASTM D751), ketahanan sobek (ISO 4674), pengukur ketebalan, viskositas perekat, pemindaian cacat visual'
      qc_threshold: '100% batch diuji. Ditolak jika tarik < 90% dari spesifikasi, sobek < minimum spesifikasi, atau terdapat cacat visual'
      responsibility: 'Tim QC masuk (3 inspektur)'
    - stage: '02'
      title: 'Pemotongan CNC & Persiapan Material'
      description: 'Penataan panel yang dioptimalkan komputer memformat panel pada stok PVC untuk meminimalkan limbah. Mesin pemotong CNC otomatis mempertahankan akurasi posisi 0.1 mm.'
      qc_check: 'Pemeriksaan dimensi terhadap file CAD DXF, inspeksi kualitas tepi, verifikasi jumlah panel'
      qc_threshold: 'Setiap panel ke-20 diukur. Toleransi ±0.5 mm. Batch ditolak jika >2% di luar toleransi'
      responsibility: 'Kepala workshop pemotongan'
    - stage: '03'
      title: 'Pengelasan & Perekatan Drop-Stitch'
      description: 'Inti drop-stitch direkatkan ke laminat PVC luar menggunakan laminasi panas. Ruang tabung dilas dengan RF atau udara panas. Pita rail direkatkan dengan fusi tiga lapis.'
      qc_check: 'Uji peel setiap 50 unit (ASTM D751), pengukuran lebar las, tinjauan log suhu udara panas, inspeksi visual sambungan di bawah cahaya latar'
      qc_threshold: 'Kekuatan peel minimal 8 N/cm. Toleransi lebar las ±1 mm. Adanya channeling yang terlihat = tolak'
      responsibility: 'QC pengelasan (2 inspektur per shift)'
    - stage: '04'
      title: 'Perakitan & Rigging'
      description: 'Papan berpindah ke perakitan akhir tempat semua komponen dipasangkan: rail direkatkan dan dilas, valve dipasang, D-ring, pegangan, fin box, serta pemasangan tas jinjing. Setiap unit mengikuti daftar periksa perakitan 100 titik.'
      qc_check: 'Persetujuan daftar periksa 100 titik per unit, uji fungsi valve (10 siklus buka/tutup), verifikasi torsi perangkat keras, inspeksi visual'
      qc_threshold: 'Kebijakan nol cacat pada item kritis keselamatan (valve, D-ring, pegangan). Cacat kosmetik minor: AQL 2.5 (ISO 2859)'
      responsibility: 'Kepala tim perakitan + QC lini'
    - stage: '05'
      title: 'Pengujian Tekanan & Penahanan Kualitas'
      description: 'Setiap ruang diinflasi hingga 1.25× tekanan nominal (umumnya 20–25 PSI) dan ditahan selama 24–48 jam. Sensor tekanan mencatat secara berkelanjutan. Ruang dengan penurunan tekanan melebihi 5% ditolak dan dikirim untuk inspeksi ulang sambungan.'
      qc_check: 'Log penahanan tekanan 24–48 jam, kalibrasi sensor diverifikasi setiap hari, pembacaan tekanan terkompensasi suhu, uji ulang sambungan setelah perbaikan'
      qc_threshold: 'Penurunan tekanan maksimal 5% selama 24–48 jam pada suhu stabil. Ruang mana pun yang melampauinya = uji ulang 100% seluruh batch produksi'
      responsibility: 'Lab kualitas (independen dari produksi, melapor kepada manajemen)'
    - stage: '06'
      title: 'Inspeksi Akhir & Pengemasan'
      description: 'Inspeksi visual dan fungsional akhir. Cacat permukaan, konsistensi warna, verifikasi label/BIN, integritas kemasan, dan kelengkapan aksesori. Unit dikemas vakum, dimasukkan ke kotak, dan dipaletkan untuk pemuatan kontainer.'
      qc_check: 'Inspeksi visual menyeluruh, daftar periksa aksesori per SKU, uji jatuh kemasan (1 m, sampel acak), verifikasi pemindaian label/kode batang'
      qc_threshold: 'AQL 2.5 untuk cacat mayor, AQL 4.0 untuk cacat minor. Toleransi nol untuk cacat keselamatan. 100% unit diperiksa secara visual'
      responsibility: 'Tim QC akhir (4 inspektur) + Kepala tim pengemasan'


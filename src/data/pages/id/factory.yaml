hero:
  tagline: 'Pabrik'
  title: 'Pabrik & Manufaktur'
  subtitle: '12,000 m² manufaktur terintegrasi — dari material baku hingga papan jadi'

intro:
  - 'Sebagai lengan produksi **Aquafarer LLC (USA)**, Tim Operasional Qingdao afarer mengendalikan setiap tahap produksi — dari kedatangan material PVC dan fiberglass hingga inspeksi prapengiriman papan jadi. Fasilitas manufaktur kami di Zona Pengembangan Ekonomi Qingdao membentang seluas 12,000 meter persegi dan menampung workshop khusus untuk pemotongan PVC, penyegelan panas tabung, fabrikasi cetakan FRP, pencetakan digital SUP, perakitan akhir, dan pengujian kualitas.'
  - 'Dengan mengintegrasikan desain, teknik, prototyping, manufaktur, dan pengujian di bawah satu atap, kami menghilangkan inefisiensi manufaktur kontraktual dan mempertahankan kontrol langsung atas kualitas pembuatan, pemilihan material, dan jadwal pengiriman. Setiap papan yang meninggalkan workshop kami dibangun oleh orang-orang kami, dengan peralatan kami, sesuai standar kami.'


meta:
  title: 'Tentang Afarer — Merek SUP Tiup & Olahraga Air | {SITE}'
  description: 'Afarer adalah merek SUP tiup dan olahraga air global, dioperasikan oleh Aquafarer LLC (AS) dan dibangun oleh Tim Operasi Qingdao kami. Temukan kisah kami, rekayasa, kualitas tersertifikasi, dan program mitra negara.'
  keywords:
    - 'merek SUP tiup'
    - 'merek olahraga air'
    - 'distributor sup negara'
    - 'koleksi sup ko-brand'
hero:
  tagline: 'Tentang kami'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp
    alt: 'pabrik dan workshop afarer'
  title: |
    Rekayasa marinir, <br />
    dibangun dengan cara <span class="text-accent dark:text-white">afarer</span>
  subtitle: 'Kami memulai di workshop pesisir dengan satu papan dan keyakinan teguh: produk marinir harus direkayasa seolah-olah penting, karena memang demikian. Hari ini kami mengirim ke lebih dari 40 negara, tetapi setiap lambung tetap melewati tangan yang sama yang memulai perusahaan ini.'

stats:
  title: 'Dalam angka'
  columns: 4
  stats:
    - title: 'Lambung terkirim'
      amount: '2.400+'
    - title: 'Negara tujuan pengiriman'
      amount: '40'
    - title: 'Tahun pengalaman gabungan'

      description: 'Papan SUP tiup PVC dari 9 ft hingga 12 ft. Ringan, kuat, dan mudah disimpan.'
      icon: tabler:rowing
    - title: 'Paket SUP premium'
      description: 'SUP ringkas ber spesifikasi tinggi yang dibangun kustom sesuai merek atau kebutuhan armada Anda.'
      icon: tabler:crown


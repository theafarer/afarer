meta:
  title: 'Manufaktur SUP Label Pribadi & Peluncuran Merek Kustom | {SITE}'
  description: 'Produsen SUP label pribadi untuk merek papan dayung baru. Luncurkan merek SUP Anda sendiri bersama Afarer — layanan OEM/ODM penuh termasuk desain, prototipe, branding kustom, produksi, dan logistik global.'

hero:
  tagline: Bangun Merek Anda Sendiri
  title: 'Luncurkan Merek SUP<br />Anda Sendiri'
  subtitle: 'Anda memiliki visinya. Kami memiliki pabrik, keahlian, dan rantai pasoknya. Manufaktur SUP label pribadi dan pengembangan merek SUP kustom — bersama-sama, kami akan membangun merek yang menonjol.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
    alt: Papan SUP bermerek kustom di air

process:
  title: Perjalanan Merek Anda
  subtitle: 'Dari ide ke pasar dalam 5 fase.'
  steps:
    - phase: 'Fase 1'
      title: 'Ide'
      period: 'Minggu 1-2'
      items:
        - 'Riset pasar & analisis pesaing'
        - 'Definisi pelanggan target'
        - 'Lokakarya posisi merek'
        - 'Strategi lini produk'
    - phase: 'Fase 2'
      title: 'Desain'
      period: 'Minggu 3-6'
      items:
        - 'Bentuk papan & desain grafis'
        - 'Pencocokan warna & pemilihan material'
        - 'Spesifikasi aksesori'
        - 'Desain kemasan & label'
    - phase: 'Fase 3'
      title: 'Prototipe'
      period: 'Minggu 7-10'
      items:
        - 'Produksi sampel'
        - 'Pengujian kualitas (tekanan, daya apung, UV)'
        - 'Penyesuaian desain'
        - 'Persetujuan akhir'
    - phase: 'Fase 4'
      title: 'Produksi'
      period: 'Minggu 11-14'
      items:
        - 'Manufaktur massal'
        - 'Inspeksi QC (per unit)'
        - 'Pengiriman laut / udara'
        - 'Dokumen bea cukai'
    - phase: 'Fase 5'
      title: 'Peluncuran'
      period: 'Minggu 15-16'
      items:
        - 'Fotografi produk'
        - 'Feed produk situs web'
        - 'Materi pemasaran'
        - 'Dukungan peluncuran'

packages:
  title: Paket Startup
  subtitle: 'Paket yang dirancang untuk setiap tahap pertumbuhan merek.'
  items:
    - name: Merek Pemula
      tagline: '50-100 unit · 2 model papan'
      features:
        - 'Pencetakan logo dasar'
        - 'Kemasan standar'
        - 'Dukungan email'
    - name: Merek Berkembang
      tagline: '300-1,000 unit · 3-5 model papan'
      features:
        - 'Warna kustom + logo'
        - 'Kemasan kustom'
        - 'Foto produk'
        - 'Manajer khusus'
    - name: Merek Mapan
      tagline: '1,000+ unit · Lini produk lengkap'
      features:
        - 'Kustomisasi penuh'
        - 'Kemasan premium'
        - 'Materi pemasaran'
        - 'Produksi prioritas'


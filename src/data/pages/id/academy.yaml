meta:
  title: 'Akademi — Panduan SUP & Pelatihan Dayung | {SITE}'
  description: 'Akademi afarer: panduan papan dayung tiup, teknik stand up paddle, keselamatan bahari, dan pengetahuan material untuk pemula hingga profesional.'
  keywords:
    - 'belajar stand up paddle'
    - 'panduan sup pemula'
    - 'dasar-dasar papan dayung'
    - 'teknik sup'
    - 'kursus sup'
hero:
  tagline: 'Akademi afarer'
  title: 'Pusat Pembelajaran'
  subtitle: 'Panduan dan tutorial untuk semua tingkat keahlian — dari dasar-dasar SUP hingga teknik penyelamatan tingkat lanjut'

categories:
  - level: 'Pemula'
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: 'Dasar-Dasar SUP'
        desc: 'Pelajari fundamental stand-up paddleboarding — posisi berdiri, teknik dayungan, dan keseimbangan.'
        slug: beginner-sup-guide
      - title: 'Teknik Dayung'
        desc: 'Dayungan maju, dayungan sapu, dayungan tarik, dan low brace — kuasai gerakan dayung yang esensial.'
        slug: sup-paddle-guide
      - title: 'Utamakan Keselamatan'
        desc: 'Praktik keselamatan esensial termasuk pemeriksaan cuaca, penggunaan PFD, aturan leash, dan penyelamatan diri.'
        slug: sup-safety-guide
  - level: 'Menengah'
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: 'Esensi Touring'
        desc: 'Merencanakan dayungan berjam-jam — navigasi, hidrasi, ritme, dan membaca prakiraan angin.'
        slug: touring-sup-guide
      - title: 'Membaca Cuaca'
        desc: 'Menafsirkan prakiraan bahari, mengenali pola awan, dan memahami pengaruh angin di air.'
        slug: weather-planning-water-sports
      - title: 'Dasar-Dasar Navigasi'
        desc: 'Membaca peta laut, penggunaan kompas, waypoint GPS, dan perencanaan rute untuk dayung pesisir.'
        slug: sup-navigation-guide
      - title: 'Kesadaran Pasang Surut'
        desc: 'Memahami siklus pasang surut, arus, dan pengaruhnya terhadap waktu peluncuran dan pemilihan rute.'
        slug: understanding-tides
  - level: 'Lanjutan'
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: 'Perencanaan Perjalanan Multihari'
        desc: 'Logistik ekspedisi — pemilihan perlengkapan, perencanaan makanan, protokol keselamatan, dan kontak darurat.'
        slug: sup-travel-guide
      - title: 'Teknik Penyelamatan'
        desc: 'Penyelamatan diri, T-rescue, dan protokol penarikan untuk perairan terbuka.'
        slug: sup-self-rescue
      - title: 'Dayung Malam'
        desc: 'Navigasi setelah gelap — persyaratan penerangan, ingatan rute, komunikasi kelompok, dan kesadaran bahaya.'
        slug: ocean-safety-basics
  - level: 'Perawatan'
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: 'Pembersihan & Perawatan'
        desc: 'Pembilasan air tawar, perlindungan UV, pencegahan jamur, dan teknik pengeringan yang benar setelah setiap sesi.'
        slug: inflatable-sup-maintenance
      - title: 'Panduan Penyimpanan'
        desc: 'Praktik terbaik untuk menyimpan papan SUP tiup — deflasi, pelipatan, pengendalian suhu, dan masa simpan.'
        slug: inflatable-sup-storage
      - title: 'Dasar-Dasar Perbaikan'
        desc: 'Perbaiki bocor kecil, kebocoran sambungan, dan masalah valve dengan kit perbaikan PVC dan teknik tambalan.'
        slug: inflatable-sup-repair
      - title: 'Perawatan Valve'
        desc: 'Identifikasi jenis valve (Halkey-Roberts, Boston, Leafield), bersihkan kotoran, dan ganti batang yang rusak.'
        slug: sup-pump-guide

knowledge_center_tagline: 'Pusat Pengetahuan'
knowledge_center_title: 'Panduan Peralatan Bahari & Industri'
knowledge_center_subtitle: 'Pengetahuan ahli dan panduan pembelian untuk profesional bahari, operator armada, dan penggemar olahraga air.'

knowledge_sections:
  - title: 'Pengetahuan Papan SUP'
    tagline: 'Panduan Papan Stand-Up Paddle'
    desc: 'Segala hal tentang papan SUP — desain papan, material, pemilihan ukuran, perawatan, dan saran pembelian untuk penggunaan rekreasi maupun komersial.'
    guides:
      - title: 'Cara Memilih Papan SUP yang Tepat'
        desc: 'Panduan lengkap memilih SUP — ukuran, volume, material, bentuk, dan penggunaan yang dimaksudkan.'
        href: '/learn/sup/'
      - title: 'SUP Tiup vs SUP Keras'
        desc: 'SUP tiup vs papan epoxy keras — portabilitas, daya tahan, performa, dan nilai yang dibandingkan.'
        href: '/compare/inflatable-vs-hardboard/'
      - title: 'SUP All-Around vs Touring vs Yoga'
        desc: 'Jenis papan SUP yang berbeda — standar konstruksi, bentuk, ukuran, dan penggunaan yang direkomendasikan.'
        href: '/learn/sup/'
      - title: 'Drop-Stitch vs Konstruksi Tradisional'
        desc: 'Bandingkan konstruksi drop-stitch dan tradisional untuk papan SUP dari segi berat, biaya, daya tahan, dan kekakuan.'
        href: '/learn/drop-stitch-core/'
  - title: 'Panduan SUP Tiup'
    tagline: 'Pengetahuan SUP Tiup'
    desc: 'Panduan komprehensif tentang SUP tiup — material PVC, konstruksi drop-stitch, standar keselamatan, dan praktik perawatan terbaik.'
    guides:
      - title: 'Panduan Material PVC'
        desc: 'Panduan definitif material PVC yang digunakan dalam konstruksi papan SUP tiup.'
        href: '/learn/materials/'
      - title: 'Bagaimana SUP Tiup Dibuat'
        desc: 'Proses manufaktur — pemotongan material, perekatan inti drop-stitch, konstruksi sambungan, pengujian tekanan, dan kontrol kualitas.'
        href: '/learn/inflatable-technology/'
      - title: 'Panduan Keselamatan SUP'
        desc: 'Standar keselamatan, kapasitas beban, inflasi yang benar, pemeriksaan sebelum berangkat, dan prosedur darurat.'
        href: '/learn/water-safety/'
      - title: 'Perawatan SUP'
        desc: 'Pembersihan, penyimpanan, perlindungan UV, dan perbaikan papan SUP tiup.'
        href: '/v2/inflatable-sup-maintenance/'
  - title: 'Pengetahuan Papan SUP'
    tagline: 'Pusat Papan SUP'
    desc: 'Panduan teknis yang mencakup jenis papan SUP, material, metode konstruksi, perawatan, dan keselamatan.'
    guides:
      - title: 'Jenis Papan SUP'
        desc: 'All-around, touring, yoga, sport, dan SUP anak — pelajari perbedaannya dan pilih yang tepat.'
        href: '/learn/sup/'
      - title: 'Teknologi Drop-Stitch'
        desc: 'Bagaimana ribuan benang internal menciptakan struktur tiup yang kaku dan bertekanan tinggi.'
        href: '/learn/drop-stitch-core/'
      - title: 'Referensi Material'
        desc: 'Peringkat denier PVC, berat kain, ketahanan UV, dan material kelas marin dijelaskan.'
        href: '/learn/materials/'
      - title: 'Panduan Membeli SUP'
        desc: 'Bandingkan berbagai jenis papan SUP untuk berbagai kasus penggunaan dan tingkat keahlian.'
        href: '/learn/sup/'
  - title: 'Pengetahuan SUP'
    tagline: 'Panduan Papan Stand-Up Paddle'
    desc: 'Segala hal tentang papan SUP — tiup vs kaku, dimensi papan, teknologi material, dan saran ahli untuk semua tingkat keahlian.'
    guides:
      - title: 'SUP Tiup vs SUP Keras'
        desc: 'Bandingkan iSUP dan papan epoxy keras dari segi portabilitas, daya tahan, performa, dan nilai.'
        href: '/learn/sup/'
      - title: 'Panduan Dimensi Papan SUP'
        desc: 'Bagaimana panjang, lebar, dan ketebalan memengaruhi stabilitas, kecepatan, dan kemampuan manuver.'
        href: '/learn/sup/'
      - title: 'Perawatan & Pemeliharaan SUP'
        desc: 'Tips pembersihan, penyimpanan, perlindungan UV, dan perbaikan untuk papan SUP tiup.'
        href: '/v2/inflatable-sup-maintenance/'
      - title: 'Memilih SUP Pertama Anda'
        desc: 'Panduan pemula untuk memilih papan stand-up paddle yang tepat sesuai berat badan, tingkat keahlian, dan penggunaan Anda.'
        href: '/learn/sup/'
  - title: 'Panduan Operasi Penyewaan'
    tagline: 'Manajemen Armada untuk Bisnis Penyewaan'
    desc: 'Panduan membangun dan mengelola armada sewa SUP untuk kios pantai, pusat olahraga air, dan properti perhotelan.'
    guides:
      - title: 'Membangun Armada Sewa Anda'
        desc: 'Cara memilih papan SUP yang tepat untuk operasi penyewaan Anda — daya tahan, ukuran, dan pertimbangan ROI.'
        href: '/solutions/rental-operators/'
      - title: 'Panduan Perawatan Armada'
        desc: 'Praktik perawatan esensial untuk memaksimalkan umur papan dan meminimalkan waktu henti armada sewa.'
        href: '/solutions/rental-operators/'
  - title: 'Panduan Resor & Perhotelan'
    tagline: 'Aktivitas Air untuk Perhotelan'
    desc: 'Panduan meluncurkan dan mengelola program SUP untuk resor, hotel, dan destinasi tepi air.'
    guides:
      - title: 'Memulai Program SUP Resor'
        desc: 'Faktor yang perlu dipertimbangkan saat meluncurkan aktivitas SUP tamu — ukuran armada, staf, dan pemodelan pendapatan.'
        href: '/solutions/resorts-hotels/'
      - title: 'SUP vs Aktivitas Air Lainnya'
        desc: 'Bandingkan program SUP dengan olahraga air lain dari segi pengalaman tamu dan efisiensi operasional.'
        href: '/learn/sup/'
  - title: 'Panduan Ritel & Distribusi'
    tagline: 'Kemitraan Bisnis SUP'
    desc: 'Panduan menjadi mitra ritel atau distributor SUP — perencanaan inventori, positioning pasar, dan strategi pertumbuhan.'
    guides:
      - title: 'Menjadi Pengecer SUP'
        desc: 'Cara memilih lini produk, mengelola inventori, dan memasarkan papan SUP di toko ritel Anda.'
        href: '/solutions/retail-partners/'
      - title: 'SUP untuk Operasi Komersial'
        desc: 'Mengapa SUP tiup adalah produk serbaguna untuk armada komersial, bisnis penyewaan, dan operator profesional.'
        href: '/solutions/rental-operators/'


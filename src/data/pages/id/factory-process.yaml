meta:
  title: 'Proses Manufaktur — Dari Bahan Baku hingga SUP | {SITE}'
  description: 'Dari bahan baku hingga SUP siap laut: setiap langkah proses manufaktur afarer berada di bawah kendali kami, dari pemotongan dan pengelasan hingga pengujian.'
  keywords:
    - 'proses manufaktur sup'
    - 'pabrik sup tiup'
    - 'tahap produksi papan dayung'
    - 'las pvc sup'
hero:
  tagline: 'Proses'
  title: 'Proses Manufaktur'
  subtitle: 'Dari bahan baku hingga papan siap air — setiap langkah di bawah kendali kami'
  back_label: 'Kembali ke Pabrik'
  back_link: /factory/

intro: 'Berbeda dengan merek yang mengalihdayakan produksi ke pabrik pihak ketiga, afarer memiliki dan mengoperasikan seluruh rantai manufakturnya sendiri. Integrasi vertikal ini memungkinkan kami mempertahankan kendali kualitas yang ketat di setiap tahap, merespons dengan cepat terhadap persyaratan kustom, dan menghadirkan kualitas produk yang konsisten batch demi batch. Berikut adalah bagaimana sebuah papan dibangun di fasilitas kami.'

steps:
  - step: '01'
    title: 'Penerimaan & Inspeksi Material'
    description: 'Setiap batch kain PVC, mat fiberglass, resin, dan perangkat keras yang masuk diperiksa terhadap spesifikasi. Sampel kain diuji untuk kekuatan tarik, keseragaman ketebalan, dan ketahanan UV sebelum dilepas ke produksi. Material yang tidak sesuai dikarantina dan dikembalikan.'
    duration: '1–2 hari'
  - step: '02'
    title: 'Pemotongan PVC Otomatis'
    description: 'Kain yang disetujui diletakkan di mesin potong CNC otomatis dan dipotong dengan akurasi di bawah satu milimeter. Nesting yang dioptimalkan komputer menata panel untuk meminimalkan limbah — biasanya di bawah 5%. Panel yang dipotong diberi label berdasarkan model papan dan ruang, lalu diikat untuk ditransfer ke workshop pengelasan.'
    duration: '2–4 jam per kit papan'
  - step: '03'
    title: 'Heat Sealing & Pengelasan Tabung'
    description: 'Panel ditack dan direkatkan menggunakan mesin heat sealing dengan las udara panas pada suhu terkendali 200–300 °C. Sambungan utama diperkuat dengan las RF dielektrik untuk sambungan kedap udara berkekuatan tinggi. Ruang yang selesai dikembangkan hingga 1,5× tekanan kerja untuk validasi retensi udara selama 30 menit.'
    duration: '1–2 hari per papan'
  - step: '04'
    title: 'Pencetakan & Dekorasi SUP'
    description: 'Grafis deck papan SUP diaplikasikan menggunakan pencetakan digital untuk desain berkualitas foto warna penuh, dan cetak saring untuk logo tahan lama serta pola berulang. Cetakan dikeringkan dan disegel untuk ketahanan UV dan abrasi.'
    duration: '1–2 hari'
  - step: '05'
    title: 'Perakitan Akhir & Rigging'
    description: 'Papan dirigging di lini perakitan dengan sirip, valve, deck EVA, dan aksesori. Setiap unit mengikuti daftar periksa perakitan 100 titik dengan persetujuan wajib di setiap tahap.'
    duration: '2–4 hari'
  - step: '06'
    title: 'Pengujian & Inspeksi Kualitas'
    description: 'Setiap papan jadi menjalani gerbang kualitas wajib: uji retensi udara ruang, pemeriksaan fungsi perangkat keras, verifikasi torsi pengencang, dan inspeksi kosmetik. Pembuatan kustom dan prototipe juga menerima uji coba di air yang mencakup stabilitas dan pengendalian.'
    duration: '1–2 hari'
  - step: '07'
    title: 'Pengemasan & Pengiriman'
    description: 'Papan dikempiskan, dilipat sesuai prosedur, dikemas dalam tas woven tugas berat atau krat kayu lapis, dan dimuat untuk pengiriman. Setiap paket diberi label dengan model, nomor seri, dan tujuan. Kami berkoordinasi dengan forwarder kargo untuk pengiriman kontainer FCL dan LCL ke seluruh dunia.'
    duration: '1 hari'


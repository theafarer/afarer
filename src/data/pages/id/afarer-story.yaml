timeline:
  - year: '2012'
    title: 'Fondasi Manufaktur Marinir'
    body: 'afarer berawal sebagai workshop kendaraan air khusus di Qingdao, Tiongkok, yang berkomitmen pada keahlian kerajinan marinir dan manufaktur kendaraan air. Fokus awal adalah membangun produk tiup yang andal melalui pengalaman rekayasa praktis dan disiplin manufaktur.'
  - year: '2015'
    title: 'Ekspor Pertama & Sertifikasi CE'
    body: 'Pesanan ekspor awal menjangkau Jepang dan Korea. Sertifikasi CE diraih untuk lini produk inti, menandai masuknya afarer ke pasar internasional. Perusahaan mulai melayani pengguna komersial dan rekreasi di luar Tiongkok.'
  - year: '2018'
    title: 'Ekspansi Pabrik'
    body: 'Pindah ke fasilitas produksi seluas 12.000 m². Menambahkan lini las RF dan kapasitas produksi drop-stitch, memungkinkan manufaktur skala lebih besar dan sistem pengendalian kualitas yang lebih baik.'
  - year: '2020'
    title: 'Pusat R&D Didirikan'
    body: 'Membuka pusat R&D khusus dengan laboratorium kain PVC, tangki uji hidrodinamika, dan studio simulasi CAD/FEA. Pengembangan produk diperluas dengan fokus pada konstruksi ringan, daya tahan yang lebih baik, dan desain berpusat pada pengguna.'
  - year: '2022'
    title: 'Sertifikasi & Pertumbuhan Global'
    body: 'Meraih sertifikasi ISO 9001. Berkembang menjadi 14 insinyur R&D dan 200+ pekerja. Produk menjangkau pelanggan di Eropa, Amerika, dan Asia-Pasifik melalui kemitraan distributor dan ko-brand.'
  - year: '2024'
    title: 'Studio Inovasi & Desain'
    body: 'Meluncurkan studio desain dan inovasi layanan penuh untuk proyek ko-brand kustom, dari konsep hingga produksi. Memperkuat aplikasi marinir profesional termasuk penyelamatan, komersial, dan kontrak pemerintah.'
  - year: '2026'
    title: 'Membangun Masa Depan Eksplorasi Air'
    body: 'Saat ini, afarer terus mengembangkan sistem SUP dan aksesori marinir — menghubungkan orang dan organisasi dengan perairan dunia. 50+ negara dilayani, kapasitas tahunan 15.000+ unit.'

content_founding:
  tagline: 'Awal Mula'
  title: 'Lahir di Tepi Laut'
  subtitle: 'afarer dimulai dari workshop pesisir di Qingdao dengan satu papan dan sebuah visi: membangun kendaraan air tiup yang mampu menghadapi kondisi marinir sesungguhnya.'
  paragraphs:
    - 'Pada 2012, pendiri kami melihat celah di pasar — sebagian besar kendaraan air tiup terjangkau namun tidak dapat diandalkan, atau berkualitas tinggi namun sangat mahal. Mereka percaya ada ruang bagi produsen yang menghadirkan kualitas sekaligus nilai.'
    - 'Lambung pertama dibangun dengan tangan, diuji di perairan lokal, dan disempurnakan berdasarkan masukan nyata dari nelayan dan operator komersial kecil. Siklus masukan itu — membangun, menguji, mendengarkan, memperbaiki — tetap menjadi inti filosofi rekayasa kami hingga hari ini.'
    - 'Pada 2015, kabar menyebar melampaui Qingdao. Distributor internasional mulai meminta sampel. Yang berawal sebagai workshop lokal mulai menjadi pemasok global.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: workshop produksi awal afarer dan manufaktur

content_growth:
  tagline: 'Pertumbuhan & Inovasi'
  title: 'Dari Workshop menjadi Fasilitas 12.000 m²'
  subtitle: 'Investasi berkelanjutan dalam manusia, peralatan, dan proses telah mengubah afarer menjadi fasilitas manufaktur marinir modern.'
  paragraphs:
    - 'Seiring meningkatnya permintaan, fasilitas kami ikut berkembang. Kami berevolusi dari workshop kecil menjadi pabrik seluas 12.000 m² dengan lini produksi khusus untuk papan SUP dan aksesori.'
    - 'Kami berinvestasi dalam mesin potong CNC, peralatan las frekuensi tinggi, lini produksi drop stitch, dan rangkaian pengujian yang komprehensif — memungkinkan kami mengendalikan setiap aspek kualitas produksi.'
    - 'Saat ini, tim kami yang beranggotakan 200+ orang mencakup insinyur marinir, ilmuwan material, spesialis pengendalian kualitas, dan pengrajin terampil — banyak yang telah bersama afarer sejak hari-hari awal.'

philosophy:
  tagline: 'Filosofi Merek'
  title: 'Merancang Kebebasan Di Atas Air'
  body: 'Kebebasan di atas air bukan hanya tentang pergerakan. Ia merepresentasikan penemuan tempat baru, penciptaan pengalaman luar ruangan, koneksi manusia dengan alam, dan memungkinkan misi profesional. Rekayasa membuat kebebasan itu menjadi mungkin.'
  pillars:
    - title: 'Keandalan Utama'
      body: 'Lingkungan air menuntut kepercayaan. Produk afarer dirancang mengutamakan stabilitas, daya tahan, keselamatan, dan performa yang konsisten.'
    - title: 'Desain Berpusat pada Manusia'
      body: 'Produk harus melayani manusia, bukan teknologi. Setiap keputusan desain dimulai dengan memahami bagaimana orang menggunakan kendaraan air, ke mana mereka menjelajah, dan tantangan apa yang mereka hadapi.'
    - title: 'Eksplorasi yang Terjangkau'
      body: 'Air tidak boleh hanya dimiliki para ahli. afarer menciptakan peralatan yang memungkinkan lebih banyak orang merasakan sungai, danau, laut, dan lingkungan pesisir dengan aman.'
    - title: 'Inovasi Berkelanjutan'
      body: 'Inovasi bukan hanya menciptakan produk baru. Inovasi adalah menyempurnakan setiap detail — material, struktur, manufaktur, dan pengalaman pengguna.'

engineeringDna:
  tagline: 'DNA Rekayasa'
  title: 'Bagaimana afarer Menciptakan Produk'
  areas:
    - title: 'Ilmu Material'
      body: 'afarer berfokus pada pemilihan material yang sesuai untuk berbagai lingkungan marinir. Pertimbangan utama meliputi ketahanan abrasi, ketahanan UV, stabilitas tekanan, dan daya tahan jangka panjang.'
      items: ['Ketahanan Abrasi', 'Ketahanan UV', 'Stabilitas Tekanan', 'Daya Tahan Jangka Panjang']
    - title: 'Rekayasa Struktural'
      body: 'Kendaraan air tiup membutuhkan keseimbangan presisi antara kekakuan, berat, portabilitas, dan stabilitas. Rekayasa afarer berfokus pada optimalisasi faktor-faktor tersebut melalui teknologi inti drop-stitch dan konstruksi sambungan canggih.'
      items: ['Kekakuan', 'Optimalisasi Berat', 'Portabilitas', 'Stabilitas']
    - title: 'Presisi Manufaktur'
      body: 'Setiap produk melewati proses yang terkendali: penyiapan material, pemotongan presisi, pengelasan dan perekatan, perakitan, inspeksi kualitas, dan verifikasi performa.'
      items: ['Siap Material', 'Pemotongan Presisi', 'Pengelasan & Perekatan', 'Perakitan & QC']
    - title: 'Rekayasa Skenario Pengguna'
      body: 'Produk dikembangkan berdasarkan aplikasi nyata — rekreasi, petualangan, dan penggunaan profesional — memastikan setiap desain memenuhi tuntutan spesifik lingkungan yang dituju.'
      items: ['Rekreasi', 'Petualangan', 'Profesional', 'Komersial']


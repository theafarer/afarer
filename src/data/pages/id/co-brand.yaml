faqs:
  title: 'Ko-Brand — FAQ'
  subtitle: 'Cara kerja ko-branding Afarer, dan perbedaannya dari OEM dan private label.'
  items:
    - title: 'Apakah ko-branding sama dengan OEM atau private label?'
      description: 'Tidak. Afarer tidak lagi menjalankan program OEM/private-label terbuka. Produk ko-brand tetap merupakan produk Afarer — dirancang, direkayasa, diperiksa kualitasnya, dan didukung oleh merek Afarer. Identitas Anda muncul sebagai ko-brand, bukan sebagai produk pihak ketiga tanpa merek.'
    - title: 'Siapa yang dapat memulai proyek ko-brand?'
      description: 'Bisnis olahraga air yang memenuhi kualifikasi: mitra negara yang sudah ada, klub dayung, resor dan hotel, penyelenggara acara, dan komunitas. Kirimkan brief proyek kepada kami dan kami akan mengonfirmasi kelayakannya sebelum pekerjaan desain dimulai.'
    - title: 'Apakah ko-branding akan berbenturan dengan distributor negara saya?'
      description: 'Tidak. Model satu-negara-satu-distributor diutamakan. Koleksi ko-brand dikoordinasikan dengan mitra negara setempat jika ada, sehingga tidak ada merek paralel atau pesaing yang muncul di dalam wilayah yang dilindungi.'
    - title: 'Berapa pesanan minimum untuk koleksi ko-brand?'
      description: 'Koleksi pilot dimulai dari 30–50 unit. Koleksi standar 50–100 unit; edisi besar atau multi-wilayah 100+ unit. Linimasa pengembangan kustom disepakati per proyek.'
    - title: 'Apa yang menjadi kualitas Afarer versus masukan mitra?'
      description: 'Afarer memiliki desain produk, rekayasa, material, konstruksi, QC, dan garansi. Mitra berkontribusi konsep koleksi, penamaan, warna, masukan grafis, dan go-to-market. Ini menjaga satu standar kualitas di air.'
    - title: 'Bagaimana cara mendaftar?'
      description: 'Lengkapi formulir pertanyaan ko-brand dengan bisnis, pasar, dan ide koleksi Anda. Kami meninjau kesesuaiannya, lalu merespons dalam 3 hari kerja dengan proposal dan Perjanjian Proyek Ko-Brand.'

features:
  title: 'Makna Ko-Branding di Afarer'
  subtitle: 'Ko-branding adalah program kemitraan desain kami — dibangun di sekeliling merek Afarer, perlindungan wilayah, dan koleksi terbatas, bukan produksi tanpa merek.'
  columns: 3
  items:
    - title: 'Produk Afarer Tetap Produk Afarer'
      description: 'Koleksi ko-brand adalah edisi terbatas papan Afarer dengan identitas Anda yang terjalin di dalamnya. Bukan tanpa merek, bukan merek pihak ketiga, dan bukan program private-label terbuka.'
      icon: 'tabler:trademark'
    - title: 'Dirancang Bersama Anda'
      description: 'Warna, penamaan, dan cerita Anda membentuk koleksi. Tim desain dan rekayasa kami menangani deck, grafis, pengemasan, dan dokumentasi dari brief hingga pengiriman.'
      icon: 'tabler:pencil'
    - title: 'Untuk Klub, Resor, Acara & Komunitas'
      description: 'Koleksi armada untuk klub dayung dan resor, edisi acara untuk balapan dan seri komunitas — semuanya membawa kualitas dan garansi Afarer.'
      icon: 'tabler:users'
    - title: 'Melindungi Mitra Negara'
      description: 'Ko-branding berjalan berdampingan dengan model satu-negara-satu-distributor kami. Mitra nasional mempertahankan wilayahnya; koleksi ko-brand tidak membuka pintu bagi merek paralel di pasar mereka.'
      icon: 'tabler:shield-check'
    - title: 'Standar Rekayasa & Kualitas'
      description: 'Setiap koleksi dikirim dari rantai pasokan tersertifikasi kami dengan dokumentasi CE dan ISO 9001, pengujian tekanan, dan titik pemeriksaan QC yang sama dengan jajaran inti kami.'
      icon: 'tabler:certificate'
    - title: 'Menjadi Aset Merek'
      description: 'Koleksi ko-brand terbatas membangun cerita Anda sendiri di air — margin penjualan, konten media, dan alasan bagi pendayung untuk kembali musim demi musim.'
      icon: 'tabler:star'

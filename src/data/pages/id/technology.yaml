meta:
  title: 'Teknologi — Drop Stitch & PVC Marinir | {SITE}'
  description: 'Teknologi afarer: konstruksi drop stitch, PVC marinir, konstruksi dua lapis, dan tekanan tinggi. Inovasi dari produsen SUP tiup profesional.'
  keywords:
    - 'teknologi sup'
    - 'konstruksi drop stitch'
    - 'sup tekanan tinggi'
    - 'material sup tiup'
hero:
  tagline: 'Teknologi'
  title: 'Dibangun untuk Performa'
  subtitle: 'Setiap SUP tiup afarer direkayasa dengan konstruksi drop-stitch dan PVC kelas marinir — material dan metode manufaktur presisi yang diuji untuk lingkungan marinir yang menuntut.'

sections:
  - title: 'Inti Drop-Stitch'
    description: 'Ribuan benang poliester internal menghubungkan lapisan atas dan bawah, menciptakan struktur kaku pada 12-15 PSI. Ini teknologi yang sama dengan yang digunakan pada papan dayung profesional dan SUP balapan tiup.'
    imageAlt: 'Diagram Inti DS'
  - title: 'PVC Kelas Marinir'
    description: 'Kain PVC berlaminat multi-lapis dengan rating untuk lingkungan marinir. Setiap lapisan dilas fusi, bukan ditempel, menghilangkan risiko delaminasi. Diuji untuk ketahanan UV, korosi air laut, dan abrasi.'
    imageAlt: 'Lapisan PVC'
  - title: 'PVC Kelas Militer'
    description: 'Digunakan pada semua model SUP, PVC premium memberikan ketahanan UV dan kimia yang unggul. Mempertahankan fleksibilitas dalam suhu ekstrem dan menolak degradasi.'
    imageAlt: 'PVC'
  - title: 'Lantai Air Deck'
    description: 'Konstruksi drop-stitch tiup bertekanan tinggi yang memberikan kekakuan luar biasa untuk berdiri, memancing, dan yoga. Mengurangi waktu penyiapan, bobot keseluruhan, dan volume penyimpanan.'
    imageAlt: 'Air Deck'


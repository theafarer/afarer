body: |
  <h2>Perbedaan Mendasar</h2>
  <p>SUP tiup (iSUP) dan papan keras melayani tujuan fundamental yang sama — berdiri dan mendayung di air — tetapi mencapainya melalui metode konstruksi yang sepenuhnya berbeda. Pilihan yang tepat bergantung pada bagaimana Anda berencana menggunakan papan tersebut.</p>

  <table>
    <tr><th>Faktor</th><th>SUP Tiup</th><th>SUP Keras</th></tr>
    <tr><td>Konstruksi</td><td>PVC drop-stitch, dikembangkan hingga 12-15 PSI</td><td>Inti busa EPS dibungkus fiberglass atau epoxy</td></tr>
    <tr><td>Berat</td><td>18-28 lbs (papan saja)</td><td>20-30 lbs (papan saja)</td></tr>
    <tr><td>Ukuran Terkemas</td><td>Tas ransel (30 x 15 x 10 inci)</td><td>Ukuran penuh (10-14 kaki)</td></tr>
    <tr><td>Penyiapan</td><td>Pengembangan 3-5 menit</td><td>Siap digunakan</td></tr>
    <tr><td>Umur</td><td>5-10 tahun dengan perawatan</td><td>3-8 tahun (rawan benturan)</td></tr>
  </table>

  <h2>Portabilitas</h2>
  <p><strong>Tiup menang.</strong> Ini adalah keunggulan yang paling jelas. SUP tiup dikemas ke dalam tas ransel yang muat di bagasi mobil, lemari apartemen, atau kompartemen atas pesawat. Wisatawan, penghuni apartemen, dan siapa pun tanpa penyimpanan atap mobil akan menemukan SUP tiup jauh lebih praktis.</p>
  <p>Papan keras membutuhkan rak atap mobil, kendaraan besar, atau ruang penyimpanan khusus. Papan sulit diangkut dan tidak bisa dibawa ke pesawat tanpa koper pengiriman khusus.</p>

  <h2>Daya Tahan</h2>
  <p><strong>Tiup menang.</strong> SUP tiup terbuat dari PVC kelas militer yang tahan benturan, tusukan, dan kerusakan UV. Saat Anda menjatuhkan papan tiup atau membentur batu, papan akan memantul. Papan keras akan terkelupas, retak, atau delaminasi akibat benturan yang sama.</p>
  <p>Papan keras lebih rentan terhadap keausan sehari-hari. Sekali jatuh di beton dapat menyebabkan benturan permanen yang memengaruhi performa dan memicu masuknya air.</p>

  <h2>Performa</h2>
  <p><strong>Papan keras menang di kelas atas.</strong> Untuk pendayungan rekreasi dan touring pada kecepatan sedang, kedua jenis papan berperforma serupa. Papan keras unggul dalam:</p>
  <ul>
    <li><strong>Kecepatan</strong> — Papan keras lebih ringan dan lebih kaku, menghasilkan luncuran lebih baik dan kecepatan tertinggi lebih tinggi</li>
    <li><strong>Berselancar</strong> — Papan keras menawarkan transisi rail-ke-rail yang lebih responsif dan performa ombak lebih baik</li>
    <li><strong>Balapan</strong> — Balapan kompetitif hampir secara eksklusif menggunakan papan keras karena keunggulan bobot dan kekakuannya</li>
  </ul>
  <p>Bagi pendayung rekreasi rata-rata, perbedaan performa ini bersifat marginal. Sebagian besar pendayung tidak akan melampaui performa papan tiup berkualitas.</p>

  <h2>Kenyamanan untuk Pemula</h2>
  <p><strong>Tiup menang.</strong> SUP tiup lebih mudah bagi pemula karena:</p>
  <ul>
    <li>Permukaan deck yang lebih lunak lebih nyaman dan lebih kecil kemungkinannya menyebabkan cedera saat terjatuh</li>
    <li>Papan tiup yang lebih lebar dan tebal menawarkan stabilitas primer lebih besar</li>
    <li>Biaya investasi lebih rendah membuat akses masuk lebih mudah</li>
    <li>Transportasi mudah berarti lebih banyak kesempatan untuk mendayung</li>
  </ul>

  <h2>Penyimpanan dan Perawatan</h2>
  <p>SUP tiup perlu dikeringkan dan dilipat dengan benar sebelum disimpan. Papan keras dapat disimpan dalam kondisi utuh tetapi membutuhkan perlindungan dari matahari, panas, dan benturan. Keduanya mendapat manfaat dari pembilasan air tawar setelah digunakan di air laut.</p>

  <h2>Rekomendasi</h2>
  <p><strong>Pilih SUP tiup jika:</strong> Anda sering bepergian, memiliki ruang simpan terbatas, mendayung untuk rekreasi, atau seorang pemula. 90% pendayung akan terlayani dengan baik oleh papan tiup berkualitas.</p>
  <p><strong>Pilih papan keras jika:</strong> Anda berbalapan kompetitif, berselancar di ombak tingkat lanjut, atau memprioritaskan performa maksimal di atas portabilitas dan daya tahan.</p>

  <h2>FAQ</h2>
  <h3>Mana yang lebih tahan lama: SUP tiup atau keras?</h3>
  <p>SUP tiup umumnya lebih tahan lama karena tahan terhadap benturan, retakan, dan kerusakan akibat benturan yang akan merusak papan keras secara permanen.</p>

  <h3>Apakah SUP tiup lebih baik untuk pemula?</h3>
  <p>Ya. SUP tiup direkomendasikan untuk pemula karena lebih memaafkan, lebih mudah diangkut, dan lebih kecil kemungkinan menyebabkan cedera saat terjatuh.</p>

  <h3>Apakah SUP tiup bisa berperforma sebaik papan keras?</h3>
  <p>Untuk pendayungan rekreasi dan touring, SUP tiup setara dengan performa papan keras. Papan keras masih unggul dalam balapan dan berselancar tingkat lanjut karena bobotnya lebih ringan dan fleksibilitasnya yang lebih terkendali.</p>

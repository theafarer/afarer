how_to_choose:
  title: Cara Memilih Ukuran yang Tepat
  cards:
    - title: Papan SUP
      description: Pilih panjang berdasarkan berat dan penggunaan yang Anda tuju. Papan lebih lebar (32"+) menawarkan stabilitas lebih besar. Papan lebih panjang (11-12 ft) melacak lebih baik untuk touring. Pendayung lebih berat membutuhkan papan bervolume lebih tinggi.
    - title: SUP Touring
      description: Papan lebih panjang (11–12 ft) terbaik untuk menempuh jarak dan touring. Papan lebih lebar (32"+) menawarkan stabilitas lebih besar. Periksa kapasitas beban untuk total muatan termasuk perlengkapan.
    - title: SUP All-Around
      description: Pilih panjang berdasarkan berat pengendara dan penggunaan yang dituju. Papan all-around cocok untuk rekreasi, kebugaran, dan yoga. Papan lebih kecil lebih lincah.

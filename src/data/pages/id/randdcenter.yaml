  title: 'Pusat R&D | {SITE}'
  description: 'Riset & Pengembangan — pengujian kain PVC, teknik lambung, pengelasan RF, pengujian hidrodinamika, dan kontrol kualitas. Layanan R&D kustom tersedia.'

hero:
  tagline: 'Pusat R&D'
  title: 'Pusat R & D'
  subtitle: 'Fokus pada Kemajuan'

intro:
  - 'Pusat Riset dan Pengembangan (R&D) afarer adalah kekuatan pendorong di balik misi kami merevolusi peralatan olahraga air. Kami memberdayakan penggemar olahraga air di seluruh dunia dengan produk yang lebih aman, lebih nyaman, dan lebih menyenangkan melalui inovasi tanpa henti dalam papan dayung tiup stand-up (SUP). Tim kami yang berdedikasi, terdiri dari insinyur, desainer, dan pakar olahraga air yang berbakat, sedang membentuk masa depan industri ini dengan terus-menerus menaikkan standar kualitas, performa, dan keberlanjutan.'
  - 'Fasilitas R&D kami menyatukan ilmuwan material, insinyur bahari, dan insinyur produksi di bawah satu atap. Dari formulasi kain dan simulasi lambung hingga pengembangan proses pengelasan dan uji coba laut skala penuh, setiap tahap pengembangan produk didorong oleh data dan divalidasi melalui pengujian.'


capabilities:
  tagline: 'Kapabilitas'
  title: 'Kapabilitas R&D'
  subtitle: 'Empat disiplin inti yang memberi kami kontrol menyeluruh atas pengembangan produk — dari riset material baku hingga sertifikasi akhir.'
  groups:
    - title: 'Ilmu Material & Teknologi Kain'
      items:
        - 'Analisis dan optimasi formulasi PVC'
        - 'Pengembangan aditif stabilisasi UV, flame retardancy, dan anti-mikroba'
        - 'Rekayasa laminasi kain multilapis dan adhesi'
        - 'Pengujian penuaan dipercepat (UV, termal, kelembapan, semprotan garam)'
    - title: 'Teknik Lambung & Hidrodinamika'
      items:
        - 'Desain lambung 3D parametrik dan optimasi CFD'
        - 'Analisis elemen hingga untuk beban struktural dan benturan'
        - 'Pengujian tangki penarik model skala dan validasi performa'
        - 'Pengembangan lambung kustom untuk profil misi khusus'
    - title: 'Teknologi Pengelasan & Penyambungan'
      items:
        - 'Pengembangan dan optimasi proses pengelasan dielektrik RF'
        - 'Metode pengelasan udara panas, hot-wedge, dan ultrasonik'
        - 'Perekatan lem dan kualifikasi pita sambungan'
        - 'Pemodelan kekuatan las dan prediksi umur pakai'
    - title: 'Pengujian, Sertifikasi & Kepatuhan'
      items:
        - 'Manajemen kualitas dan pengujian kepatuhan CE'
        - 'Dukungan pengujian dan sertifikasi pihak ketiga independen'
        - 'Pengembangan protokol uji kustom untuk kualifikasi pengadaan'
        - 'Analisis kegagalan dalam layanan dan investigasi akar masalah'


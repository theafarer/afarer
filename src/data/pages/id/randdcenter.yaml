vision:
  tagline: 'Visi Kami'
  title: 'Membentuk Masa Depan Olahraga Air'
  body: 'afarer berupaya memimpin industri SUP tiup melalui inovasi berkelanjutan, kualitas yang tak tergoyahkan, dan komitmen teguh terhadap keselamatan serta keberlanjutan — pada akhirnya memperkaya pengalaman para penggemar olahraga air di seluruh dunia. Pusat R&D afarer adalah tempat hasrat bertemu inovasi, menetapkan standar baru bagi industri olahraga air.'

labs_section:
  tagline: 'Lab'
  title: 'Laboratorium Kami'
  labs:
    - image: https://assets.afarer.com/images/afarer/randd/afarer-pvc-material-lab.webp
      title: 'Lab Kain PVC'
      description: 'Riset dan pengujian berkelanjutan terhadap kain dek PVC untuk kekuatan tarik, ketahanan UV, abrasi, dan fleksibilitas suhu rendah demi keandalan jangka panjang di lingkungan bahari.'
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-2.webp
      title: 'Studio Teknik Lambung'
      description: 'Desain berbasis CAD dan analisis elemen hingga untuk lambung HDPE, aluminium, dan fiberglass. Setiap lambung disimulasikan secara digital untuk distribusi tegangan dan ketahanan benturan sebelum prototipe pertama dibangun.'
      href: /randdcenter/hull-engineering
    - image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing-3.webp
      title: 'Pusat Pengelasan RF'
      description: 'Fasilitas pengelasan frekuensi radio khusus dengan kontrol suhu dan tekanan presisi, menghasilkan sambungan kedap udara berkekuatan tinggi yang memenuhi standar industri bahari untuk kapal tiup.'
      href: /randdcenter/rf-welding
    - image: https://assets.afarer.com/images/afarer/factory/afarer-design-discussion-original.webp
      title: 'Tangki Uji Hidrodinamika'
      description: 'Pengujian skala model di tangki uji internal kami untuk mengoptimalkan bentuk lambung, performa planing, stabilitas, dan efisiensi bahan bakar lintas berbagai kondisi beban dan laut.'
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp
      title: 'Workshop Prototipe'
      description: 'Fasilitas pembuatan prototipe dan rigging skala penuh tempat model baru dibangun, dilengkapi, dan diuji di laut. Setiap prototipe menjalani program uji di air minimal 20 jam sebelum disetujui untuk produksi.'
      href: /randdcenter/prototype-workshop
    - image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
      title: 'Lab Kualitas & Inspeksi'
      description: 'Lab penjaminan kualitas khusus yang melakukan pengujian tarik, siklus retensi udara, uji peeling sambungan, dan sertifikasi material untuk memastikan setiap papan yang meninggalkan workshop memenuhi spesifikasi yang kami publikasikan.'
      href: /randdcenter/quality-inspection-lab

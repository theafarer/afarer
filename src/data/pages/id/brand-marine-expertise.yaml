meta:
  title: 'Keahlian Marinir — Rekayasa di Setiap Lambung | {SITE}'
  description: 'Puluhan tahun rekayasa marinir di setiap lambung. afarer menguasai drop stitch, PVC marinir, dan desain SUP tiup profesional.'
  keywords:
    - 'rekayasa marinir'
    - 'produsen SUP tiup'
    - 'manufaktur papan dayung'
hero:
  tagline: 'Keahlian Marinir'
  title: 'Puluhan Tahun Rekayasa Marinir<br />di Setiap Lambung'
  subtitle: 'afarer memadukan ilmu material yang mendalam, manufaktur presisi, dan pengujian dunia nyata untuk menghasilkan kendaraan air yang berperforma saat dibutuhkan.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: 'tim rekayasa dan R&D marinir afarer saat bekerja'
expertise_materials:
  tagline: 'Ilmu Material'
  title: 'Memilih Material yang Tepat<br />untuk Setiap Aplikasi'
  subtitle: 'Kami bekerja dengan dua material inti — masing-masing dipilih untuk kasus penggunaan dan persyaratan performa spesifik.'
  columns: 3
  items:
    - title: 'PVC Kelas Marinir'
      description: 'Kain PVC 1100 denier — material paling serbaguna kami. Stabil-UV, tahan abrasi, dan patuh REACH. Ideal untuk papan SUP yang mengutamakan bobot dan efisiensi biaya.'
      icon: tabler:droplet
    - title: 'Fiberglass & Polietilena'
      description: 'SUP berlaminat fiberglass untuk kekakuan dan luncuran premium. Polietilena rotomould untuk penggunaan rental dan penyelamat berat yang membutuhkan ketahanan benturan maksimum.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 'Kemampuan Manufaktur'
  title: 'Manufaktur Presisi<br />di Setiap Tahap'
  subtitle: 'Fasilitas kami seluas 12.000 m² dilengkapi mesin khusus untuk setiap tahap produksi.'
  columns: 2
  items:
    - title: 'Pemotongan CNC'
      description: 'Pemotongan terkendali komputer memastikan panel kain presisi dan dapat direproduksi dengan limbah minimal. Setiap potongan pas persis seperti desainnya.'
      icon: tabler:cpu
    - title: 'Las Frekuensi Tinggi'
      description: 'Las HF industri menciptakan sambungan yang lebih kuat dari material dasarnya. Kendali suhu dan tekanan yang konsisten memastikan segel kedap udara di setiap batch produksi.'
      icon: tabler:bolt
    - title: 'Perakitan Inti Drop Stitch'
      description: 'Ribuan benang poliester menghubungkan lapisan kain atas dan bawah, memungkinkan pengembangan bertekanan tinggi (15-20 PSI) untuk papan SUP yang kaku dan stabil.'
      icon: tabler:building-arch
    - title: 'Pengujian Tekanan'
      description: 'Setiap produk tiup diuji tekanan sebelum dikirim. Papan diuji pada 1,25x tekanan rating — jika tahan di situ, papan akan berperforma di air.'
      icon: tabler:wind
    - title: 'Pengujian Kekuatan Sambungan'
      description: 'Sampel acak dari setiap batch produksi menjalani pengujian destruktif kekuatan sambungan. Hasil dicatat dan dapat dilacak ke batch produksi spesifik.'
      icon: tabler:files
    - title: 'Pengujian di Air'
      description: 'Setiap model menjalani uji laut sebelum sertifikasi. Pengujian dunia nyata dalam kondisi pesisir memvalidasi performa, pengendalian, dan stabilitas.'
      icon: tabler:droplet
expertise_design:
  tagline: 'Desain & Rekayasa'
  title: 'Direkayasa untuk Kondisi Nyata'
  subtitle: 'Filosofi desain kami dimulai dari bagaimana papan akan digunakan — lalu membangun rekayasanya di sekitar kasus penggunaan tersebut.'
  items:
    - title: 'Desain Lambung Berperforma'
      description: 'Setiap bentuk lambung disetel untuk kasus penggunaannya — hidung displacement untuk luncuran touring, rocker tambahan untuk kelincahan surf, profil rata stabil untuk memancing dan yoga.'
    - title: 'Keselamatan Drop-Stitch'
      description: 'Setiap papan memiliki inti drop-stitch kaku dengan rail yang diperkuat. Jika ada bagian yang rusak, struktur drop-stitch berkekuatan tarik tinggi menjaga papan tetap beroperasi.'
    - title: 'Tata Letak Deck Ergonomis'
      description: 'Zonasi pad deck, posisi pegangan bawa, dan titik pemasangan dirancang mengutamakan kenyamanan pengendara selama penggunaan berkepanjangan — baik touring, memancing, maupun patroli.'
    - title: 'Konfigurasi Kustom'
      description: 'Warna rail, konfigurasi pad deck, mount aksesori, kapasitas perlengkapan — setiap model dapat dikustomisasi sesuai persyaratan operasional spesifik.'
cta:
  title: 'Punya aplikasi spesifik dalam pikiran?'
  subtitle: 'Tim rekayasa kami dapat memberi saran tentang pemilihan material, desain, dan manufaktur untuk proyek Anda.'
  actions:
    - variant: primary
      text: 'Tanyakan kepada insinyur kami'
      href: /contact/
    - text: 'Lihat jajaran produk'
      href: /products/

meta:
  title: 'Produsen SUP Tiup & Mitra OEM/ODM — Afarer Water Sports | {SITE}'
  description: 'Afarer adalah produsen SUP tiup dan mitra OEM/ODM di Qingdao, Tiongkok — pabrik bersertifikat ISO 9001 yang merancang papan dayung tiup berperforma tinggi untuk perairan terbuka, touring, yoga, dan petualangan. Papan diuji tekanan satu per satu, dengan program OEM/ODM, private-label, dan distributor.'
  keywords:
    - 'sup tiup berperforma tinggi'
    - 'papan dayung tiup premium'
    - 'merek papan sup tiup'
    - 'sup tiup touring'
    - 'papan dayung ko-brand'
    - 'distributor sup negara'
    - 'produsen sup tiup'
    - 'mitra oem odm sup'
    - 'produsen papan dayung private label'
hero:
  tagline: 'Produsen SUP Tiup & Mitra OEM/ODM'
  title: 'Pergi Lebih Jauh.<br />Meluncur Lebih Kuat.'
  subtitle: |
    SUP tiup berperforma tinggi yang dirancang untuk perairan terbuka, hari-hari panjang,<br />
    dan kebebasan untuk menjelajah — stabil saat dibutuhkan,<br />
    kaku di bawah tekanan, dan siap menghadapi perairan yang berubah.
  taglineSection: 'Direkayasa untuk keyakinan. Dirancang untuk tampil beda.'
  actions:
    - variant: primary
      text: 'Jelajahi Papan'
      href: /inflatable-sup/
      icon: tabler:waves
    - text: 'Temukan Papan Anda'
      href: /size-guide/
      icon: tabler:compass
    - text: 'Mengapa Afarer'
      href: /afarer-story/
      icon: tabler:heart
  image:
    src: ~/assets/images/hero-image.webp
    alt: 'SUP tiup Afarer meluncur melintasi perairan terbuka saat cahaya pertama — dibangun untuk hari-hari panjang dan kebebasan untuk menjelajah'

who_we_serve:
  tagline: 'Meluncur Bersama Kami'
  title: 'Dibuat Sesuai Cara Anda Meluncur'
  subtitle: 'Dari dayungan pertama hingga rute terpanjang Anda — dan untuk klub, resor, dan pengecer yang menjaga orang-orang tetap mendayung.'
  items:
    - title: 'Pengendara Pemula & Rekreasi'
      keywords: 'sup tiup pemula, papan dayung all-around, sup stabil'
      description: 'Papan all-around lebar dan stabil yang membuat dayungan pertama Anda terasa alami dan tetap relevan seiring kemajuan Anda.'
      icon: tabler:users
      cta: 'Temukan Papan Pertama Anda'
      link: /all-around-sup/
    - title: 'Pendayung Touring & Petualangan'
      keywords: 'sup touring, papan dayung jarak jauh, sup ekspedisi'
      description: 'Papan yang lebih panjang dan sempit yang dibangun untuk melaju lurus, meluncur lebih jauh, dan membawa peralatan untuk rute multi-hari.'
      icon: tabler:building
      cta: 'Jelajahi Papan Touring'
      link: /touring-sup/
    - title: 'Klub, Resor & Rental'
      keywords: 'armada rental SUP, peralatan klub dayung, aktivitas air resor'
      description: 'SUP tiup siap armada dengan daya tahan andal, perawatan mudah, dan dukungan suku cadang pengganti.'
      icon: tabler:shopping-cart
      cta: 'Bangun Armada Anda'
      link: /solutions/
    - title: 'Distributor Negara & Mitra Ko-Brand'
      keywords: 'distributor SUP negara, SUP ko-brand, SUP private label'
      description: 'Distribusi eksklusif per negara dan koleksi ko-brand terbatas untuk bisnis olahraga air yang memenuhi kualifikasi.'
      icon: tabler:package
      cta: 'Jadi Mitra'
      link: /distributor-program/

proof_points:
  title: 'Teruji Melampaui Ruang Pamer'
  subtitle: 'Desain, performa, dan kualitas yang dapat Anda verifikasi — di air dan dalam angka.'
  items:
    - metric: 10+
      label: 'Tahun Merancang untuk Air'
      detail: 'Sejak 2012, disempurnakan papan demi papan'
    - metric: 50+
      label: 'Negara di Air'
      detail: 'Pendayung dan mitra di seluruh dunia'
    - metric: 12–15
      label: 'PSI Inti Drop-Stitch'
      detail: 'Kaku saat dibutuhkan, mudah dikemas'
    - metric: 100%
      label: 'Uji Tekanan Papan demi Papan'
      detail: 'Diperiksa sebelum dikirim'

business_solutions:
  tagline: 'Mengapa Rasanya Berbeda'
  title: 'Performa yang Terasan pada Dayungan Pertama'
  subtitle: 'Empat pilar yang dibentuk oleh air sesungguhnya — performa, desain, konstruksi, dan kualitas.'
  items:
    - title: 'Performa di Air'
      description: 'Bentuk yang disetel untuk stabilitas, luncuran, dan keyakinan di air beriak — sehingga setiap dayungan terasa menyatu dengan air.'
      icon: tabler:shield-check
    - title: 'Desain Ekspresif'
      description: 'Koleksi yang terinspirasi dari pasang surut, satwa liar, dan energi garis pantai — papan yang ingin Anda perlihatkan.'
      icon: tabler:package
    - title: 'Konstruksi Terbukti'
      description: 'Inti drop-stitch berdensitas tinggi, rail yang diperkuat, dan sambungan laminasi fusi yang dibangun untuk penggunaan berulang.'
      icon: tabler:headset
    - title: 'Kualitas Terverifikasi'
      description: 'Diuji tekanan, diperiksa visual, dan didukung garansi yang jelas serta dukungan purna jual yang responsif.'
      icon: tabler:truck-delivery

oem_section:
  tagline: 'Manufaktur OEM / ODM & Ko-Brand'
  title: 'Dari Ide ke Air — Edisi Ko-Brand'
  subtitle: 'Untuk mitra yang menginginkan lebih dari sekadar produk katalog: manufaktur OEM/ODM dan koleksi ko-brand terbatas yang dirancang, direkayasa, dan dibangun bersama Afarer — sementara setiap papan tetap merupakan produk Afarer.'
  steps:
    - number: '01'
      title: 'Ide & Brief'
      desc: 'Bagikan visi, target pengendara, dan perairan yang Anda tuju.'
    - number: '02'
      title: 'Desain & Rekayasa'
      desc: 'Pemodelan 3D, pemilihan material, dan desain grafis yang khas.'
    - number: '03'
      title: 'Prototipe & Validasi'
      desc: 'Papan sampel diuji tekanan dan divalidasi pengendarannya sebelum Anda berkomitmen.'
    - number: '04'
      title: 'Produksi Skala Besar'
      desc: 'Produksi konsisten dan terinspeksi dengan titik pemeriksaan kualitas di setiap tahap.'
    - number: '05'
      title: 'Pengiriman Global'
      desc: 'Logistik dari Qingdao ke pelabuhan utama dengan dukungan kepabeanan.'
  cta: 'Jelajahi Ko-Branding'
  cta_link: /co-brand/

cta:
  title: 'Temukan papan berikutnya Anda.'
  subtitle: 'Baik Anda sedang mengayuh pertama kali, melengkapi klub, atau membangun merek papan — kami akan membawa Anda ke air.'
  actions:
    - variant: primary
      text: 'Jelajahi Koleksi'
      href: /inflatable-sup/
      icon: tabler:send
    - text: 'Minta Katalog'
      href: /resources/download-catalog/

distributor:
  tagline: 'Distributor Eksklusif Negara'
  title: 'Satu Negara. Satu Distributor Resmi Afarer.'
  subtitle: 'Program satu-negara-satu-distributor dengan eksklusivitas wilayah, harga dealer, dukungan pemasaran, dan Program Sukses Distributor khusus.'
  benefits:
    - title: 'Eksklusivitas Wilayah'
      description: 'Satu distributor resmi per negara atau wilayah — tanpa persaingan internal, tanpa konflik kanal.'
    - title: 'Margin Langsung Pabrik'
      description: 'Daftar harga distributor dan rabat tahunan atas volume yang dikomitmenkan, dikirim FOB Qingdao.'
    - title: 'Dukungan Pemasaran & Pelatihan'
      description: 'Aset ko-brand, materi POS dealer, pelatihan produk, dan kampanye peluncuran.'
    - title: 'Tim Akun Khusus'
      description: 'Manajer distributor pribadi plus dukungan onboarding, peramalan, dan pemesanan ulang.'
  actions:
    - variant: primary
      text: 'Jadi Distributor'
      href: /distributor-program/
    - text: 'Minta Daftar Harga Dealer'
      href: /contact/?subject=Dealer Price List
    - text: 'Ajukan Kemitraan Negara'
      href: /contact/?subject=Country Partnership Application
    - text: 'Unduh Program Distributor'
      href: /distributor-program/
  note: 'Pesanan pertama minimal 100–300 unit untuk Distributor Negara/Wilayah. Pesanan uji coba mulai 10–30 unit.'

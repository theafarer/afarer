meta:
  title: 'Sertifikasi — CE, ISO 9001 & Kepatuhan | {SITE}'
  description: 'Sertifikasi kualitas afarer: CE (EN ISO 25649), ISO 9001:2015, BSCI. Kepatuhan dan keselamatan untuk produsen SUP tiup.'
  keywords:
    - 'sertifikasi ce sup'
    - 'iso 9001 sup'
    - 'kepatuhan bahari'
    - 'sertifikasi papan dayung'
hero:
  tagline: 'Sertifikasi & Standar'
  title: 'Sertifikasi Kualitas<br />& Standar Kepatuhan'
  subtitle: 'Manufaktur SUP afarer tersertifikasi terhadap standar keselamatan bahari internasional, sistem manajemen kualitas, dan regulasi lingkungan — CE, ISO 9001, UKCA, BSCI, dan REACH.'
  image:
    src: https://assets.afarer.com/images/afarer/certifications/certifications-hero.webp
    alt: 'sertifikasi kualitas afarer dan dokumentasi kepatuhan'
content_certifications:
  tagline: 'Sertifikasi Kami'
  title: 'Kualitas Tersertifikasi,<br />Diakui Secara Global'
  subtitle: 'Setiap produk afarer didukung oleh sertifikasi yang menunjukkan komitmen kami terhadap kualitas, keselamatan, dan tanggung jawab lingkungan.'
  items:
    - title: 'Tersertifikasi CE'
      description: 'Semua produk afarer mematuhi persyaratan penandaan CE Eropa untuk kapal air rekreasi, memastikan standar keselamatan, kesehatan, dan perlindungan lingkungan terpenuhi.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Sistem manajemen kualitas kami tersertifikasi ISO 9001:2015, mencakup desain, manufaktur, dan distribusi kapal air tiup serta peralatan bahari.'
      icon: tabler:clipboard-check
    - title: 'Berpenanda UKCA'
      description: 'Produk yang dijual di pasar Inggris membawa penandaan UKCA, menegaskan kepatuhan terhadap regulasi Inggris untuk peralatan bahari dan kapal air pribadi.'
      icon: tabler:shield
    - title: 'Patuh BSCI'
      description: 'afarer telah diaudit BSCI (Business Social Compliance Initiative), menunjukkan praktik manufaktur yang etis, kondisi kerja yang adil, dan tanggung jawab rantai pasokan.'
      icon: tabler:heart-handshake
    - title: 'Patuh REACH'
      description: 'Semua material yang digunakan dalam produk afarer mematuhi regulasi REACH UE untuk keamanan kimia, memastikan tidak ada zat terbatas dalam PVC, EVA, atau komponen kami.'
      icon: tabler:flask
    - title: 'Pengujian Material'
      description: 'Kain diuji untuk kekuatan tarik, ketahanan sobek, degradasi UV, dan performa cold-crack. Setiap batch produksi diambil sampelnya dan diverifikasi.'
      icon: tabler:test-pipe
content_factory:
  tagline: 'Standar Pabrik'
  title: 'Keunggulan Manufaktur<br />— Dibangun Sesuai Spesifikasi'
  subtitle: 'Fasilitas kami seluas 12,000 m² beroperasi di bawah protokol kontrol kualitas yang ketat di setiap tahap produksi.'
  list:
    - 'Inspeksi Material Masuk: Semua material baku — kain PVC, foam EVA, perekat, perangkat keras — diuji terhadap spesifikasi sebelum memasuki produksi.'
    - 'Kontrol Kualitas Dalam Proses: Setiap tahap produksi memiliki titik pemeriksaan QC terdokumentasi. Kekuatan las, keselarasan sambungan, pemasangan valve, dan torsi fitting diverifikasi secara inline.'
    - 'Pengujian Tekanan: Setiap ruang tiup diuji tekanan pada 1.25× tekanan nominal selama 24–48 jam. Penurunan tekanan harus tetap di bawah 5% untuk lulus.'
    - 'Inspeksi Akhir: Produk jadi diperiksa untuk akurasi dimensi, finishing kosmetik, kelengkapan aksesori, dan integritas kemasan sebelum pengiriman.'
    - 'Keterlacakan Batch: Setiap produk membawa nomor seri yang tertaut dengan catatan batch produksi, memungkinkan keterlacakan penuh dari material baku hingga produk jadi.'
content_safety:
  tagline: 'Standar Keselamatan Bahari'
  title: 'Utamakan Keselamatan<br />— Dirancang untuk Operasi yang Andal'
  subtitle: 'Produk afarer dirancang dan diuji untuk memenuhi standar keselamatan bahari internasional bagi penggunaan komersial dan rekreasi.'
  items:
    - title: 'EN ISO 25649'
      description: 'SUP tiup mematuhi standar EN ISO 25649 untuk konstruksi, stabilitas, daya apung, dan kapasitas beban.'
      icon: tabler:sailboat
    - title: 'Kepatuhan SOLAS'
      description: 'Peralatan keselamatan dan alat penyelamat memenuhi persyaratan SOLAS (Safety of Life at Sea) jika berlaku.'
      icon: tabler:lifebuoy
cta:
  title: 'Butuh produk tersertifikasi untuk proyek Anda?'
  subtitle: 'Hubungi tim kami untuk mendiskusikan persyaratan sertifikasi, dokumentasi, dan kepatuhan untuk pasar Anda.'
  actions:
    - variant: primary
      text: 'Minta dokumen sertifikasi'
      href: /contact/
    - text: 'Lihat halaman kualitas kami'
      href: /quality/

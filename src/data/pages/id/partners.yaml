meta:
  title: 'Mitra — Distribusi & Grosir | {SITE}'
  description: 'Jadilah mitra afarer: jaringan distribusi, harga grosir, program OEM/private label, dan dukungan untuk bisnis papan dayung di seluruh dunia.'
  keywords:
    - 'mitra distribusi sup'
    - 'grosir papan dayung'
    - 'distributor sup tiup'
    - 'kemitraan sup'
hero:
  tagline: 'Mitra & Distribusi'
  title: 'Jadilah Mitra afarer<br />— Jaringan Distribusi Global'
  subtitle: 'Bergabunglah dengan jaringan mitra global afarer. Kami bekerja sama dengan distributor marinir, dealer olahraga dayung, pengecer peralatan, dan mitra merek di 50+ negara.'
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: 'jaringan mitra dan distributor global afarer'
content_programs:
  tagline: 'Program Mitra'
  title: 'Program Mitra<br />Dibangun untuk Pertumbuhan'
  subtitle: 'Baik Anda distributor, dealer, atau mitra merek, afarer menawarkan program yang dirancang untuk mendukung bisnis Anda.'
  columns: 3
  items:
    - title: 'Program Distributor'
      description: 'Distribusi wilayah eksklusif dengan harga volume, dukungan pemasaran, dan akses langsung ke pabrik. Komitmen minimum disesuaikan dengan ukuran wilayah.'
      icon: tabler:world
    - title: 'Program Dealer'
      description: 'Harga dealer langsung, pelatihan produk, materi pemasaran, dan dukungan garansi untuk lokasi ritel dan toko online.'
      icon: tabler:building-store
    - title: 'Kemitraan OEM/ODM'
      description: 'Manufaktur OEM dan ODM layanan penuh dengan pencitraan merek kustom, pengemasan, dan spesifikasi produk. Dari konsep hingga kontainer.'
      icon: tabler:certificate
    - title: 'Kemitraan Merek'
      description: 'Program ko-branding, private label, dan model eksklusif untuk merek mapan di bidang rekreasi marinir dan luar ruangan.'
      icon: tabler:stars
    - title: 'Pemerintah & Institusi'
      description: 'Program pemasok pilihan untuk lembaga pemerintah, penjaga pantai, militer, dan organisasi kemanusiaan. Dokumentasi siap tender.'
      icon: tabler:building-community
    - title: 'Mitra Resor & Rental'
      description: 'Harga armada, kualitas konsisten, dan pencitraan merek kustom untuk resor, pusat selam, dan operasi rental di seluruh dunia.'
      icon: tabler:sun
content_benefits:
  tagline: 'Mengapa Bermitra Dengan Kami'
  title: 'Mengapa Mitra Memilih afarer'
  subtitle: 'Mitra kami mendapat manfaat dari kemampuan manufaktur nyata, kualitas konsisten, dan dukungan yang responsif.'
  list:
    - 'Akses Langsung ke Pabrik: Bekerja langsung dengan tim manufaktur kami — tanpa perantara. Dapatkan respons lebih cepat, harga lebih baik, dan visibilitas penuh ke produksi.'
    - 'Siap Kustomisasi: Beri merek pada produk Anda dengan warna, logo, pengemasan, dan spesifikasi kustom. Kuantitas pesanan minimum disesuaikan dengan pasar Anda.'
    - 'Kualitas Terjamin: Produksi bersertifikat ISO 9001 dengan kepatuhan CE, UKCA, dan BSCI. Setiap produk diuji sebelum dikirim.'
    - 'Logistik Global: Pengiriman dari Qingdao, Tiongkok dengan opsi FOB, CIF, dan DDP. Gudang AS di Montclair, CA untuk distribusi Amerika Utara.'
    - 'Dukungan Pemasaran: Katalog produk, fotografi, dokumentasi teknis, dan aset digital untuk mendukung upaya penjualan Anda.'
    - 'Pelatihan & Dukungan: Pelatihan produk untuk tim penjualan Anda, dukungan teknis untuk pelanggan Anda, dan koordinasi layanan garansi.'
content_process:
  tagline: 'Cara Menjadi Mitra'
  title: 'Proses Kemitraan Sederhana'
  subtitle: 'Proses kemitraan kami lugas — dirancang agar Anda cepat menjual produk afarer.'
  items:
    - title: 'Langkah 1: Kirim Aplikasi'
      description: 'Lengkapi formulir aplikasi mitra kami dengan profil perusahaan, pasar target, dan minat produk Anda.'
    - title: 'Langkah 2: Tinjauan Kualifikasi'
      description: 'Tim kemitraan kami meninjau aplikasi Anda dan menghubungi Anda dalam 3 hari kerja untuk membahas peluang.'
    - title: 'Langkah 3: Perjanjian & Penyiapan'
      description: 'Tanda tangani perjanjian kemitraan, siapkan akun Anda, dan terima harga mitra, materi pemasaran, serta sampel produk.'
    - title: 'Langkah 4: Pelatihan & Peluncuran'
      description: 'Pelatihan produk, dukungan penjualan, dan materi pemasaran disediakan. Anda siap untuk mulai menjual.'
cta:
  title: 'Siap menjadi mitra afarer?'
  subtitle: 'Ajukan kemitraan dan tim kami akan merespons dalam 3 hari kerja.'
  actions:
    - variant: primary
      text: 'Ajukan kemitraan'
      href: /contact/
    - text: 'Lihat produk kami'
      href: /products/

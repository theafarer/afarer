features3_markets:
  tagline: 'Pasar Utama'
  title: 'Keahlian Regional<br />untuk Kebutuhan Lokal'
  subtitle: 'Kami memahami bahwa pasar yang berbeda memiliki persyaratan regulasi, preferensi, dan kasus penggunaan yang berbeda.'
  isBeforeContent: false
  columns: 4
  items:
    - title: 'Eropa & Inggris'
      description: 'Produk bersertifikat CE. Permintaan tinggi untuk papan SUP di pasar UE. Distributor Inggris mengapresiasi waktu penyelesaian cepat kami.'
      icon: tabler:map-pin
    - title: 'Amerika Utara'
      description: 'Manufaktur disetujui US Coast Guard. Gudang AS di Montclair, CA untuk pengiriman cepat Pantai Barat. Permintaan SUP memancing, penyelamatan, dan rekreasi terus meningkat.'
      icon: tabler:map-pin
    - title: 'Australia & Oseania'
      description: 'Pasar kuat untuk papan SUP dan aksesori olahraga air. Distributor Australia menghargai konstruksi PVC tahan UV kami dalam kondisi matahari yang ekstrem. Pengiriman cepat dari fasilitas Asia kami.'
      icon: tabler:map-pin
    - title: 'Timur Tengah'
      description: 'Permintaan peralatan petualangan air terus tumbuh. SUP kelas komersial dan peralatan keselamatan kami populer di kalangan operator tur dan pusat rental. Konfigurasi kustom untuk lingkungan bersuhu tinggi.'
      icon: tabler:map-pin
features3_distribution:
  tagline: 'Jaringan Distribusi'
  title: 'Bermitra dengan Distributor<br />Di Seluruh Dunia'
  subtitle: 'Kami bekerja sama dengan distributor peralatan marinir mapan, merek olahraga air, dan lembaga pengadaan pemerintah.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Program Ko-Brand'
      description: 'Manufaktur private label untuk merek olahraga air global. Kami menangani segalanya dari desain hingga produksi hingga drop-shipping.'
      icon: tabler:building
    - title: 'Jaringan Distributor'
      description: 'Distributor resmi di 20+ negara menyimpan stok dan memberikan dukungan lokal. Pertanyaan distributor baru kami sambut.'
      icon: tabler:users
    - title: 'Pemerintah & Institusi'
      description: 'Pasokan langsung ke penjaga pantai, organisasi search and rescue, dan program pengadaan militer. Kepatuhan terhadap persyaratan pengadaan institusional.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Logistik & Dukungan Global'
  subtitle: 'Dari pabrik ke tujuan — kami mengelola seluruh rantai pasokan.'
  items:
    - title: 'Opsi Pengiriman'
      description: 'Kargo laut (FOB Qingdao), kargo udara untuk pesanan mendesak, dan kurir ekspres untuk sampel dan suku cadang.'
      icon: tabler:truck-delivery
    - title: 'Gudang AS'
      description: 'Stok tersimpan di Montclair, CA untuk pengiriman cepat di seluruh Amerika Utara. Pantai Barat: 2-3 hari, Tengah: 3-4 hari, Pantai Timur: 4-5 hari.'
      icon: tabler:building-warehouse
    - title: 'Suku Cadang'
      description: 'Suku cadang dan consumable asli afarer tersedia sepanjang tahun. Suku cadang umum dikirim dalam 24 jam.'
      icon: tabler:package
    - title: 'Dukungan Teknis'
      description: 'Jalur langsung ke tim rekayasa kami untuk pertanyaan teknis, saran perbaikan, dan dukungan suku cadang pengganti. Kami mendukung papan yang kami bangun 20 tahun lalu.'
      icon: tabler:headset
cta:
  title: 'Ingin menjadi distributor?'
  subtitle: 'Kami aktif memperluas jaringan distribusi kami. Hubungi tim ekspor kami untuk membahas peluang kemitraan.'
  actions:
    - variant: primary
      text: 'Pertanyaan kemitraan'
      href: /contact/
    - text: 'Lihat jajaran produk kami'

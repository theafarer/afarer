meta:
  title: 'Kehadiran Global — Produsen SUP yang Melayani 50+ Negara | {SITE}'
  description: 'afarer mengekspor SUP tiup ke 50+ negara di seluruh benua. Produsen dan pemasok profesional untuk merek, distributor, dan armada.'
  keywords:
    - 'produsen sup global'
    - 'eksportir papan dayung'
    - 'pabrik sup tiongkok'
    - 'pemasok sup profesional'
hero:
  tagline: 'Kehadiran Global'
  title: 'Melayani 50+ Negara<br />Di Seluruh Benua'
  subtitle: 'Dari operator patroli pesisir Eropa hingga distributor olahraga air Australia hingga tim penyelamat Timur Tengah — papan afarer hadir di perairan seluruh dunia.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-factory-building.webp

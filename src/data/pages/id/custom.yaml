meta:
  title: 'Custom Lab — Papan Dayung Tiup Kustom | {SITE}'
  description: 'Papan dayung tiup kustom: desain bespoke, logo, cetakan kustom, dan produksi. Mitra SUP label pribadi, MOQ 50 unit, tersertifikasi CE.'
  keywords:
    - 'produsen papan dayung kustom'
    - 'sup tiup kustom'
    - 'papan dayung dengan logo'
    - 'sup tiup label pribadi'
    - 'manufaktur papan dayung'
hero:
  tagline: afarer Custom Lab
  title: Rancang Papan SUP<br />Anda Sendiri
  subtitle: Mitra SUP kustom yang menawarkan co-brand, label pribadi, dan produksi papan dayung bespoke untuk bisnis di seluruh dunia. Dari satu prototipe hingga produksi penuh.
  cta: Mulai proyek Anda
  footer_link: /contact/

steps_section:
  tagline: Cara kerjanya
  title: Dari konsep ke produksi
  subtitle: Empat langkah dari ide Anda hingga produk jadi yang siap ke laut.
  steps:
    - num: '01'
      title: Pilih Papan Anda
      desc: Pilih dari model SUP inti kami — all-around, touring, yoga, sport, atau kids. Tentukan ukuran, material, dan warna.
    - num: '02'
      title: Unggah Desain Anda
      desc: Kirimkan logo, artwork, atau pedoman merek Anda. Tim desain kami menyiapkan proof digital.
    - num: '03'
      title: Tinjauan Mockup AI
      desc: Lihat mockup fotorealistis yang dihasilkan AI dari papan kustom Anda sebelum produksi dimulai.
    - num: '04'
      title: Produksi & Pengiriman
      desc: Setelah disetujui, pesanan Anda masuk ke lini produksi kami. Waktu produksi mulai 30 hari.

services_section:
  tagline: Layanan
  title: Layanan manufaktur untuk merek global
  subtitle: Model keterlibatan yang fleksibel — dari manufaktur kontrak hingga pembangunan merek layanan penuh.
  items:
    - title: Produksi Co-Brand
      desc: Kami memproduksi desain Anda sesuai spesifikasi — IP Anda, gambar teknik Anda, standar kualitas Anda. Perlindungan NDA penuh.
      icon: ⚙️
    - title: Solusi Desain
      desc: Pilih dari 50+ platform teruji dan kustomisasi ukuran, warna, grafis, dan kemasan.
      icon: '🎨'
    - title: Label Pribadi
      desc: Merek Anda pada produk kami — logo, kemasan, hang tag, manual. Siap ritel langsung dari kotaknya.
      icon: '🎨'
    - title: Branding Kustom
      desc: Pencetakan deck pad, grafis hull, decal tube, dan label kustom — integrasi merek penuh.
      icon: ⚙️

capabilities_section:
  tagline: Kapabilitas
  title: Kapabilitas produksi & kustomisasi
  subtitle: Semua yang perlu Anda ketahui sebelum melakukan pemesanan.
  capabilities:
    - label: Volume pesanan
      value: MOQ 50 unit (SUP)
    - label: Waktu produksi
      value: 30–45 hari standar; 15–20 hari untuk prototipe
    - label: Kustomisasi
      value: Ukuran, bentuk, warna, grafis, kemasan, perangkat keras
    - label: Material
      value: PVC, drop-stitch, EVA, aluminium
    - label: Pencetakan
      value: Digital (CMYK), sablon, heat transfer, sublimasi
    - label: Sertifikasi
      value: CE, UKCA, FCC (dukungan untuk kepatuhan global)

why_section:
  tagline: Mengapa afarer
  title: Satu pabrik. Satu standar. Nol kompromi.
  points:
    - text: Fasilitas manufaktur terintegrasi 12,000 m²
      highlight: 12,000 m²
    - text: 200+ pekerja dan insinyur terampil
      highlight: 200+
    - text: 15,000+ papan SUP diproduksi setiap tahun
      highlight: 15,000+
    - text: Manajemen kualitas tersertifikasi ISO 9001
      highlight: ISO 9001
    - text: Produk tersertifikasi CE untuk pasar UE
      highlight: CE
  cta: Lihat detail pabrik
  cta_link: /factory/
  contact:
    title: Siap mendiskusikan proyek Anda?
    desc: Tim kami merespons dalam 24 jam dengan penawaran awal.

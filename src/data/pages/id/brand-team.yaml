philosophy:
  tagline: 'Filosofi Desain'
  title: 'Desain yang Dipimpin Rekayasa<br />— Setiap Detail Berarti'
  subtitle: 'Filosofi teknik kami berpusat pada tiga prinsip yang memandu setiap produk yang kami bangun.'
  list:
    - 'Keandalan Utama: Setiap produk afarer diuji untuk menahan kondisi dunia nyata — dari operasi penyelamatan di air dingin hingga sewa resor tropis. Kami merekayasa secara berlebihan pada hal yang paling penting.'
    - 'Presisi Manufaktur: Fasilitas kami menggunakan pemotongan CNC, pengelasan frekuensi tinggi, dan pengujian tekanan otomatis. Setiap sambungan, setiap valve, setiap fitting memenuhi spesifikasi terdokumentasi.'
    - 'Inovasi Berkelanjutan: Tim R&D kami mengevaluasi material baru, metode produksi, dan peningkatan desain secara terus-menerus. Kami tidak menunggu masalah muncul — kami mengantisipasinya.'
cta:
  title: 'Ingin mendiskusikan proyek dengan tim kami?'

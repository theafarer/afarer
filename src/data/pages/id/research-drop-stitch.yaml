content_html: |
  <h2>Apa Itu Drop Stitch?</h2>
  <p>Drop stitch (juga disebut "kain drop-stitch" atau "inti drop-stitch") adalah metode konstruksi di mana ribuan benang poliester individual menghubungkan lapisan atas dan bawah cangkang kain. Saat cangkang dikembangkan, benang-benang ini berfungsi sebagai elemen tegangan internal — mencegah panel atas dan bawah menggembung ke luar menjadi bentuk bulat, memaksa panel tetap rata dan kaku.</p>
  <p>Hasilnya adalah struktur ringan dan portabel yang mampu menahan 15 – 20 PSI tekanan internal — sebanding dengan kekakuan papan hard-shell tetapi dapat dikempiskan sepenuhnya untuk penyimpanan dan transportasi.</p>

  <h2>Cara Kerjanya: Fisikanya</h2>
  <p>Dalam struktur tiup konvensional (seperti balon atau kasur angin), tekanan udara internal mendorong sama ke segala arah. Tanpa pengendalian internal, struktur menjadi silindris atau bulat. Drop stitch mengatasinya dengan memperkenalkan penguatan tarik:</p>
  <ul>
    <li>Ribuan benang menghubungkan lapisan kain atas dan bawah</li>
    <li>Saat dikembangkan, tekanan udara mencoba mendorong atas dan bawah terpisah</li>
    <li>Benang menahan pemisahan ini, memindahkan beban menjadi tegangan sepanjang sumbu benang</li>
    <li>Hasilnya adalah panel rata dan kaku yang menahan pembengkukan</li>
  </ul>

  <h2>Proses Konstruksi</h2>
  <ol>
    <li><strong>Penenunan:</strong> Benang poliester ditenun secara simultan ke dalam dua lapisan kain dasar terpisah (biasanya poliester berlapis PVC 1.100 DTEX atau 1.680 DTEX). Benang ditenun berputar di antara lapisan pada sudut 90&deg;.</li>
    <li><strong>Pelapisan:</strong> Kain dasar tenunan dilapisi PVC (atau kadang TPU) menggunakan proses knife-coating atau calendar-coating. Ini menyegel benang dan menciptakan membran kedap udara.</li>
    <li><strong>Perekatan lapisan:</strong> Inti drop-stitch direkatkan ke lapisan laminat luar (biasanya PVC 0,9 mm atau 1,2 mm) menggunakan laminasi panas atau perekat.</li>
    <li><strong>Pengelasan:</strong> Pita rail dilas di sepanjang tepi menggunakan las udara panas, las RF, atau las frekuensi tinggi untuk menciptakan dinding samping papan.</li>
    <li><strong>Pemasangan valve:</strong> Valve Boston atau valve Halkey-Roberts dipasang, biasanya dengan mekanisme pelepas tekanan untuk mencegah pengembangan berlebih.</li>
  </ol>

  <h2>Indikator Kualitas Utama</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parameter</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Tingkat Pemula</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Kepadatan benang</td><td class="p-3 border">1 benang / inci persegi</td><td class="p-3 border">2 benang / inci persegi</td></tr>
      <tr><td class="p-3 border">Kain dasar</td><td class="p-3 border">1.100 DTEX</td><td class="p-3 border">1.680 DTEX</td></tr>
      <tr><td class="p-3 border">Tekanan maksimum</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Ketebalan PVC</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 border">Konstruksi rail</td><td class="p-3 border">Dilipat &amp; ditempel</td><td class="p-3 border">Dilas &amp; ikatan fusi</td></tr>
    </tbody>
  </table>

  <h2>Aplikasi</h2>
  <ul>
    <li><strong>Papan SUP:</strong> Ketebalan 4" – 6", 15 – 20 PSI, 1 – 2 benang/inci persegi</li>
    <li><strong>Kayak:</strong> Lantai drop-stitch + ruang samping tiup, lantai 10 – 15 PSI</li>
  </ul>

  <h2>Drop Stitch vs. Air Deck (Inti Fiberglass atau Kayu)</h2>
  <p>Papan hard-shell menggunakan inti busa EPS dengan penguatan stringer fiberglass atau kayu. Papan ini lebih ringan, lebih kaku, dan lebih responsif — tetapi tidak dapat dikempiskan. Drop stitch menuju sebagian kekakuan dengan portabilitas penuh. Bagi sebagian besar pengguna rekreasi, SUP drop-stitch modern pada 20 PSI tidak dapat dibedakan kekakuannya dari papan keras tingkat pemula.</p>

  <h2>Bagaimana Afarer Menggunakan Drop Stitch</h2>
  <p>Afarer menggunakan inti drop-stitch 1.680 DTEX di seluruh jajaran SUP-nya, dengan 2 benang per inci persegi dan laminat luar PVC 1,2 mm. Papan diberi rating hingga 20 PSI dan menjalani uji tahan tekanan 24–48 jam pada 1,25x tekanan rating sebelum dikirim. Pita rail dilas udara panas dengan fusi tiga lapis, dan valve pelepas tekanan menjadi standar di semua model.</p>


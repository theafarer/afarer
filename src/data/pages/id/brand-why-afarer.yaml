features3_reasons:
  tagline: 'Mengapa Memilih afarer'
  title: 'Tujuh Alasan Bermitra Dengan Kami'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Manufaktur Nyata, Bukan Perdagangan'
      description: 'Kami memiliki dan mengoperasikan pabrik seluas 12.000 m². Saat Anda bermitra dengan afarer, Anda bekerja langsung dengan orang-orang yang merancang, merekayasa, dan membangun produk Anda — tanpa perantara.'
      icon: tabler:building-factory
    - title: '2. Pendekatan Berbasis Rekayasa'
      description: 'Proses desain kami dimulai dari kasus penggunaan, bukan kategori produk. Kami mengoptimalkan bentuk lambung, pemilihan material, dan konfigurasi berdasarkan bagaimana papan akan benar-benar digunakan.'
      icon: tabler:engine
    - title: '3. Kualitas Bersertifikat'
      description: 'Bersertifikat CE, sistem mutu ISO, patuh BSCI, patuh REACH, disetujui USCG. Setiap produk memenuhi standar internasional — bukan sekadar klaim.'
      icon: tabler:certificate
    - title: '4. Ko-Branding Fleksibel'
      description: 'Warna rail, tata letak deck, pencitraan merek, pengemasan — kami kustomisasi sesuai spesifikasi Anda. Tanpa tekanan pesanan minimum. Mulai dengan prototipe, kembangkan dengan keyakinan.'
      icon: tabler:adjustments
    - title: '5. Logistik Global'
      description: 'Gudang AS di California, pengiriman langsung dari Qingdao, kargo udara untuk pesanan mendesak. Kami menangani dokumen kepabeanan dan dokumentasi.'
      icon: tabler:truck-delivery
    - title: '6. Dukungan Seumur Hidup'
      description: 'Kami mendukung papan yang kami bangun 20 tahun lalu. Suku cadang asli, saran teknis, panduan perbaikan — tim kami siap saat Anda membutuhkan.'
      icon: tabler:lifebuoy
    - title: '7. Spesifikasi Jujur'
      description: 'Rating beban nyata, dimensi nyata, berat nyata. Tanpa pembesaran pemasaran. Apa yang kami publikasikan adalah yang Anda dapatkan — diverifikasi oleh pengujian independen.'
      icon: tabler:ruler-measure
testimonials:
  tagline: 'Dipercaya Merek di Seluruh Dunia'
  title: 'Apa Kata Mitra Kami'
  items:
    - content: 'Kami telah bekerja dengan beberapa produsen di Tiongkok, tetapi afarer menonjol karena dukungan rekayasa dan kualitas konsisten mereka. Mereka memperlakukan merek kami seperti milik mereka sendiri.'
      name: '— Mitra Ko-Brand, Merek Olahraga Air Eropa'
    - content: 'Papan SUP mereka telah bertugas di armada kami selama lebih dari 5 tahun. Perawatan minimal, ketahanan UV sangat baik. Garansi 5 tahun memberi kami keyakinan.'
      name: '— Operator Armada, Grup Resor Timur Tengah'
    - content: 'Tim afarer membantu kami mengembangkan desain papan SUP kustom dari konsep hingga produksi dalam 90 hari. Kualitasnya melampaui ekspektasi kami.'
      name: '— Distributor, Olahraga Air Australia'
cta:
  title: 'Siap merasakan bedanya?'
  subtitle: 'Hubungi tim kami untuk membahas proyek Anda. Tanpa komitmen — hanya saran jujur tentang manufaktur.'

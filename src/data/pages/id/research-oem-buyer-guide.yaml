content_html: |
  <h2>1. Pra-Kualifikasi: Apa yang Perlu Dicari di Sebuah Pabrik</h2>

  <h3>Sertifikat Kepatuhan</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Sistem manajemen kualitas</li>
    <li><strong>Sertifikasi CE</strong> – Verifikasi nomor Notified Body</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Audit kepatuhan sosial</li>
    <li><strong>REACH / RoHS</strong> – Deklarasi kepatuhan material</li>
  </ul>

  <h3>Kapabilitas Manufaktur</h3>
  <ul>
    <li>Penenunan inti drop-stitch in-house vs. outsourcing</li>
    <li>Lini pelapisan / laminasi PVC</li>
    <li>Peralatan pengelasan RF dan las udara panas</li>
    <li>Pembuatan cetakan in-house (pemesinan CNC)</li>
    <li>Lab pengujian (pengujian tekanan, penuaan UV, pengujian tarik)</li>
  </ul>

  <h3>Verifikasi Pengalaman</h3>
  <ul>
    <li>Tahun pengalaman dalam manufaktur kapal air tiup (minimal 5+ tahun)</li>
    <li>Jumlah insinyur yang dimiliki</li>
    <li>Klien OEM/ODM yang sudah ada (minta referensi)</li>
    <li>Tujuan ekspor – apakah mereka sudah mengirim ke pasar target Anda?</li>
  </ul>

  <h2>2. Protokol Kontrol Kualitas</h2>
  <p>QC material masuk: kekuatan tarik (ASTM D751 atau ISO 1421), ketahanan sobek (ASTM D2261 atau ISO 4674), kekuatan adhesi, pemeriksaan acak penuaan UV.</p>
  <p>QC dalam proses: pemantauan kekuatan sambungan setiap 50 unit, verifikasi torsi valve, pemeriksaan densitas benang drop-stitch, pemeriksaan dimensi terhadap gambar CAD.</p>
  <p>Inspeksi akhir: uji tahan inflasi 100% (24 jam, penurunan maksimum 5%), inspeksi visual, uji fungsi valve, pengujian sampel acak (AQL 2.5 atau 4.0 sesuai ISO 2859).</p>

  <h2>3. Daftar Periksa Dokumentasi Kepatuhan</h2>
  <ul>
    <li>Deklarasi Kesesuaian (DoC) yang merujuk pada direktif UE yang benar</li>
    <li>Sertifikat CE dari notified body</li>
    <li>Laporan pengujian dari lab terakreditasi</li>
    <li>Lembar data keselamatan material (MSDS)</li>
    <li>Deklarasi kepatuhan REACH</li>
    <li>Daftar Material dengan keterlacakan pemasok</li>
    <li>Laporan inspeksi pabrik</li>
  </ul>

  <h2>4. Negosiasi MOQ</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Jenis Produk</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">MOQ Standar</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Rentang yang Dapat Dinegosiasikan</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Papan SUP</td><td class="p-3 border">50 – 100 unit</td><td class="p-3 border">5 – 10 unit (uji coba)</td></tr>
      <tr><td class="p-3 border">Kano</td><td class="p-3 border">50 – 100 unit</td><td class="p-3 border">5 – 10 unit (uji coba)</td></tr>
      <tr><td class="p-3 border">SUP Tiup</td><td class="p-3 border">50 – 100 unit</td><td class="p-3 border">2 – 5 unit (uji coba)</td></tr>
      <tr><td class="p-3 border">Keselamatan / Aksesori</td><td class="p-3 border">200 – 500 unit</td><td class="p-3 border">50 – 100 unit (uji coba)</td></tr>
    </tbody>
  </table>

  <h2>5. Logistik dan Pengiriman</h2>
  <p>Incoterms yang umum: <strong>FOB</strong> (Pabrik mengantar ke pelabuhan keberangkatan – paling umum), <strong>EXW</strong> (Pembeli mengatur seluruh pengiriman dari pintu pabrik), <strong>CIF</strong> (Pabrik membayar ongkos angkut dan asuransi hingga pelabuhan tujuan).</p>
  <p>Produk tiup berbobot ringan dengan volume besar – berat volumetrik (DIM) sering menentukan biaya pengiriman. Minta kemasan vakum untuk mengurangi volume sebesar 50–60%. Angkutan laut dari Tiongkok ke UE: 25–35 hari; ke Pantai Barat AS: 15–20 hari.</p>

  <h2>6. Kesalahan Umum</h2>
  <ul>
    <li><strong>Tanpa audit pabrik:</strong> Selalu lakukan atau pesan audit pihak ketiga (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Spesifikasi lisan saja:</strong> Lembar spesifikasi teknis rinci yang ditandatangani kedua pihak</li>
    <li><strong>Melewatkan persetujuan sampel:</strong> Persetujuan tertulis atas sampel sebelum produksi massal</li>
    <li><strong>Tanpa QC selama produksi:</strong> Inspeksi pihak ketiga selama produksi (DUPRO) dan sebelum pengiriman (PSI)</li>
    <li><strong>Mengabaikan kepatuhan:</strong> Verifikasi sertifikasi CE/UKCA sebelum produksi</li>
  </ul>

  <h2>7. Mengapa Afarer</h2>
  <p>Afarer telah memproduksi kapal air tiup OEM/ODM sejak 2012. Dengan fasilitas seluas 12,000 m&sup2; bersertifikat ISO 9001, 25+ insinyur, dan sertifikasi CE di seluruh lini produk, kami memenuhi setiap kriteria dalam panduan ini. Kami menawarkan MOQ uji coba untuk mitra baru dan paket dokumentasi kepatuhan lengkap.</p>


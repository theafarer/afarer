hero:
  tagline: 'Gaya Hidup'
  title: 'Gaya Hidup<br />afarer'
  subtitle: 'Dibangun untuk mereka yang hidup di air — dari penjelajah akhir pekan hingga operator komersial yang mengandalkan perlengkapan mereka setiap hari.'

values:
  - icon: 🌊
    title: 'Lahir di Air'
    desc: 'Setiap desain dimulai dengan memahami bagaimana air berperilaku. Kami merekayasa dari tepi kondisi ke dalam — karena laut adalah guru kami, bukan tempat kerja kami.'
  - icon: 🔧
    title: 'Dibangun untuk Bertahan'
    desc: 'Produk paling berkelanjutan adalah yang tidak perlu diganti. Material kelas marinir, inti drop-stitch dengan rating hingga 15 PSI, dan sambungan yang melebihi umur musim.'
  - icon: 🏆
    title: 'Terjangkau Secara Desain'
    desc: 'Olahraga air seharusnya bukan kemewahan. Performa kelas profesional dengan harga yang masuk akal bagi keluarga, pemandu, dan operator kecil — bukan hanya armada komersial.'
  - icon: 🌍
    title: 'Komunitas Global'
    desc: 'Dari pesisir Qingdao hingga danau-danau di Eropa, sungai-sungai di Asia Tenggara, dan teluk-teluk di Amerika — pelanggan kami berbagi satu hal: cinta untuk berada di air.'
  - icon: ♻️
    title: 'Manufaktur Bertanggung Jawab'
    desc: 'Nesting yang dioptimalkan CNC memangkas limbah material hingga di bawah 5%. Konstruksi tahan lama mengurangi siklus penggantian. Kami membangun untuk umur panjang karena itu pilihan paling berkelanjutan.'
  - icon: 🤝
    title: 'Dukungan yang Bertahan'
    desc: 'Lambung berusia dua puluh tahun masih menelepon kami untuk suku cadang. Rata-rata respons garansi kami 24 jam. Kami tidak menghilang setelah penjualan — kami hadir seumur hidup produk.'


content_html: |
  <h2>Apa Itu Sertifikasi CE?</h2>
  <p>Penandaan CE (Conformit&eacute; Europ&eacute;enne) menunjukkan bahwa suatu produk memenuhi persyaratan kesehatan, keselamatan, dan lingkungan Uni Eropa. Untuk kendaraan air tiup, kerangka regulasi yang relevan bergantung pada kategori produknya.</p>

  <h2>Direktif yang Berlaku</h2>

  <h3>Direktif Kendaraan Rekreasi (2013/53/EU)</h3>
  <p>Direktif utama untuk kendaraan rekreasi di Uni Eropa. SUP tiup di bawah 2,4 m berada di luar cakupannya dan sebagai gantinya disertifikasi berdasarkan EN ISO 25649.</p>

  <h3>Regulasi Alat Pelindung Diri (2016/425)</h3>
  <p>Jaket pelampung, alat bantu daya apung, dan peralatan keselamatan yang disertakan dengan kendaraan air harus memenuhi persyaratan Regulasi PPE, termasuk uji tipe (Modul B) oleh notified body dan jaminan kualitas produksi (Modul D atau E).</p>

  <h2>Proses Sertifikasi</h2>
  <ol>
    <li>Klasifikasi produk: Tentukan kategori desain kendaraan (A – D sesuai ISO 8666)</li>
    <li>Standar yang berlaku: EN ISO 25649, EN ISO 10087 (HIN), EN ISO 14945 (pelat pembuat)</li>
    <li>Penyiapan berkas teknis: Gambar desain, Daftar Material, sertifikat material, penilaian risiko</li>
    <li>Uji tipe: Daya apung, stabilitas, kapasitas beban, pengujian material, kekuatan sambungan, retensi udara</li>
    <li>Kendali produksi pabrik: Audit proses manufaktur oleh notified body</li>
    <li>Deklarasi Kesesuaian: Produsen menandatangani DoC, memasang penandaan CE</li>
  </ol>

  <h2>Notified Body untuk Kendaraan Air Tiup</h2>
  <p>NB yang umum meliputi Bureau Veritas (Prancis), DNV GL (Jerman), RINA (Italia), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Jerman).</p>

  <h2>Linimasa dan Biaya</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Tahap</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Durasi</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Biaya Tipikal (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Penyiapan berkas teknis</td><td class="p-3 border">2 – 4 minggu</td><td class="p-3 border">2.000 – 5.000</td></tr>
      <tr><td class="p-3 border">Uji tipe</td><td class="p-3 border">4 – 8 minggu</td><td class="p-3 border">8.000 – 20.000</td></tr>
      <tr><td class="p-3 border">Audit pabrik</td><td class="p-3 border">1 – 2 hari (di lokasi)</td><td class="p-3 border">3.000 – 6.000</td></tr>
      <tr><td class="p-3 border">Total (produk pertama)</td><td class="p-3 border">8 – 14 minggu</td><td class="p-3 border">13.000 – 31.000</td></tr>
    </tbody>
  </table>

  <h2>Apa Artinya bagi Pembeli</h2>
  <p>Saat membeli SUP tiup bersertifikat CE, selalu verifikasi bahwa penandaan CE ada di pelat pembuat, DoC yang valid tersedia, nomor Notified Body tercantum, dan manual pemilik memuat instruksi keselamatan dalam bahasa lokal Anda. Semua produk Afarer membawa sertifikasi CE dengan ketertelusuran penuh hingga laporan audit notified body.</p>


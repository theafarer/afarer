why_us:
  - title: Integrasi Vertikal
    description: Kami memiliki pabrik, cetakan, dan rantai pasok kami sendiri — tanpa perantara, tanpa subkontraktor. Ini memberi kami kontrol atas kualitas, biaya, dan pengiriman.
  - title: Sertifikasi Ganda
    description: Sertifikasi manajemen kualitas ISO 9001 dan kepatuhan sosial BSCI. Laporan audit pabrik tersedia atas permintaan.
  - title: Kepatuhan CE
    description: Semua model standar memiliki sertifikasi CE 2013/53/EU. Model kustom dapat disertifikasi CE melalui proses mapan kami.
  - title: MOQ Rendah
    description: Mulai dengan hanya 5 unit untuk model standar. Kami membantu merek baru meluncur tanpa komitmen inventori berlebih.

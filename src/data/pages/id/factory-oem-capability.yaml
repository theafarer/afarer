services:
  - title: Desain Produk & Rekayasa
    description: Tim R&D internal kami bekerja dengan konsep atau spesifikasi Anda untuk mengembangkan gambar CAD, model 3D, dan prototipe. Kami menawarkan desain cetakan, optimasi bentuk hull, dan panduan pemilihan material.
  - title: Branding & Grafis Kustom
    description: Pencetakan digital penuh warna, sablon, emboss, dan opsi label. Kami mengembangkan grafis deck khusus merek, branding tube, dan kemasan siap ritel.
  - title: Kustomisasi Material & Spesifikasi
    description: Pilih dari PVC (standar, ramah lingkungan, tahan api), drop-stitch, dan konstruksi hibrida. Warna tube kustom, berat fabric, dan opsi penguatan.
  - title: Kemasan & Logistik
    description: Kemasan ritel kustom, kotak label pribadi, vacuum packing, paletisasi, dan pemuatan kontainer. Syarat pengiriman FOB Qingdao, CIF, atau DDP tersedia.


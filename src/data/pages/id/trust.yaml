warranty_section:
  title: 'Garansi & Dukungan Purna Jual'
  subtitle: 'Kami berdiri di balik setiap produk dengan syarat garansi yang jelas, proses klaim cepat, dan suku cadang asli.'
  items:
    - title: 'Garansi Produk 2 Tahun'
      desc: 'Semua produk afarer dilengkapi garansi 2 tahun terhadap cacat manufaktur — kegagalan sambungan, cacat valve, dan delaminasi material dalam penggunaan normal.'
    - title: 'Dukungan Suku Cadang Seumur Hidup'
      desc: 'Suku cadang asli — valve, kit perbaikan, sirip, D-ring — tersedia untuk semua model. Kami mempertahankan cetakan dan perkakas minimal 5 tahun setelah produksi berakhir.'
    - title: 'Respons Klaim 48 Jam'
      desc: 'Klaim garansi dikonfirmasi dalam 48 jam. Papan pengganti dikirim dalam 10 hari kerja untuk klaim yang disetujui.'
    - title: 'Jaringan Perbaikan Global'
      desc: 'Pusat perbaikan resmi di 15+ negara. Kit perbaikan lapangan tersedia untuk operasi terpencil. Panduan perbaikan mandiri untuk kerusakan ringan.'
    - title: 'Dukungan Pelanggan OEM'
      desc: 'Manajer akun khusus untuk mitra B2B. Tinjauan bisnis kuartalan, perencanaan inventori, dan dukungan pemasaran ko-brand.'
    - title: 'Paket Sertifikasi'
      desc: 'Dokumentasi kepatuhan lengkap disertakan dengan setiap pengiriman — Deklarasi CE, laporan pengujian, lembar data keselamatan material.'
      link: '/contact/'


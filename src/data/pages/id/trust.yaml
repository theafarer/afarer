faqs_sup:
  title: 'FAQ Papan SUP'
  subtitle: 'Pertanyaan umum tentang papan dayung berdiri kami.'
  columns: 2
  items:
    - title: 'Ukuran papan SUP apa saja yang ditawarkan afarer?'
      description: 'Kami menawarkan papan SUP dari 9 ft hingga 12 ft, mencakup semua hal mulai dari papan all-around ringkas hingga desain touring dan khusus. Setiap model tersedia dengan berbagai pilihan konfigurasi.'
    - title: 'Apa perbedaan antara SUP tiup dan SUP keras?'
      description: 'SUP tiup menggunakan konstruksi drop-stitch dengan ribuan benang internal yang memungkinkan tekanan udara tinggi, sedangkan SUP keras menggunakan epoxy atau fiberglass. SUP tiup menawarkan portabilitas dan kemudahan penyimpanan tanpa mengorbankan kekakuan.'
    - title: 'Berapa batas berat untuk papan SUP?'
      description: 'Papan SUP kami menopang hingga 150 kg tergantung pada model dan volumenya. Setiap halaman produk mencantumkan rating beban maksimum untuk model spesifik Anda.'
    - title: 'Apakah SUP afarer bersertifikat CE?'
      description: 'Ya. Semua model SUP rekreasi bersertifikat CE berdasarkan standar Eropa yang berlaku untuk penggunaan rekreasi.'
    - title: 'Berapa lama garansi papan SUP?'
      description: 'Semua SUP afarer dilengkapi garansi standar satu tahun terhadap cacat manufaktur, mencakup kegagalan sambungan, cacat valve, dan delaminasi material dalam penggunaan normal.'
    - title: 'Berapa lama waktu yang dibutuhkan untuk mengembangkan papan SUP?'
      description: 'Menggunakan pompa tangan yang disertakan, pengembangan penuh hingga 15 PSI membutuhkan waktu sekitar 8–12 menit. Untuk pengembangan lebih cepat, kami merekomendasikan pompa listrik 12V afarer yang mengembangkan papan dalam waktu kurang dari 4 menit.'

faqs_materials:
  title: 'FAQ Material & Perawatan SUP'
  subtitle: 'Pertanyaan umum tentang material, perawatan, dan penyimpanan SUP tiup kami.'
  columns: 2
  items:
    - title: 'Material apa yang digunakan dalam SUP tiup afarer?'
      description: 'Kami menggunakan PVC kelas militer (1100 denier) dengan konstruksi stabil-UV dan tahan abrasi, sesuai regulasi REACH dan RoHS Uni Eropa.'
    - title: 'Berapa lama umur SUP tiup?'
      description: 'Dengan perawatan yang tepat, SUP tiup PVC berkualitas bertahan 5–10 tahun. Pembersihan rutin, perlindungan UV, dan penyimpanan yang benar sangat memperpanjang umur layanan.'
    - title: 'Perawatan apa yang diperlukan untuk SUP tiup?'
      description: 'Perawatan dasar meliputi pembilasan dengan air tawar setelah setiap penggunaan (terutama di air laut), pengeringan sebelum penyimpanan, pemeriksaan seal valve setiap tahun, dan menghindari paparan sinar matahari berlebih saat tidak digunakan.'
    - title: 'Apakah SUP tiup bisa digunakan di air laut?'
      description: 'Ya. Semua SUP tiup afarer dirancang untuk penggunaan di air tawar maupun air laut. Kami merekomendasikan pembilasan dengan air tawar dan pengeringan menyeluruh setelah terpapar air laut.'
    - title: 'Bagaimana cara menyimpan SUP tiup?'
      description: 'Kempiskan, bersihkan, dan keringkan papan sepenuhnya sebelum disimpan. Gulung dengan longgar (hindari lipatan ketat), simpan di tempat sejuk dan kering jauh dari sinar matahari langsung, dan jauhkan dari lantai beton untuk mencegah serapan kelembapan.'
    - title: 'Berapa kapasitas beban SUP tiup afarer?'
      description: 'Kapasitas beban berkisar dari 100 kg untuk model terkecil kami hingga lebih dari 200 kg untuk papan yang lebih besar. Setiap halaman produk mencantumkan rating beban maksimum untuk model spesifik Anda.'


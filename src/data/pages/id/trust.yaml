features3_certifications:
  title: 'Sertifikasi & Kepatuhan'
  subtitle: 'Setiap produk diuji dan disertifikasi secara independen sesuai standar internasional.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'Sertifikasi CE'
      description: 'Semua SUP afarer memenuhi standar keselamatan CE Eropa untuk penggunaan rekreasi. Setiap produk menjalani pengujian tekanan, daya apung, dan beban sebelum meninggalkan pabrik.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001'
      description: 'Fasilitas Qingdao seluas 12.000 m² kami beroperasi di bawah sistem manajemen mutu ISO 9001. Setiap batch produksi dapat dilacak, terdokumentasi, dan diperiksa.'
      icon: 'tabler:clipboard-check'
    - title: 'Kepatuhan Sosial BSCI'
      description: 'Kami bersertifikat BSCI, memastikan praktik ketenagakerjaan yang etis, kondisi kerja yang aman, dan tanggung jawab lingkungan di seluruh rantai pasokan kami.'
      icon: 'tabler:users'
    - title: 'REACH & RoHS'
      description: 'Semua material — PVC, busa EVA, perekat — mematuhi regulasi REACH dan RoHS Uni Eropa. Tanpa zat terlarang, tanpa kompromi.'
      icon: 'tabler:flask'
    - title: 'Laboratorium Pengujian Material'
      description: 'Laboratorium material internal kami menguji kekuatan tarik, ketahanan UV, integritas sambungan, dan abrasi untuk setiap batch kain sebelum produksi.'
      icon: 'tabler:microscope'
    - title: 'Garansi 2 Tahun'
      description: 'Setiap produk afarer dilengkapi garansi dua tahun terhadap cacat manufaktur. Kami berdiri di balik setiap produk yang kami bangun.'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'Kepercayaan Pelanggan'
  title: 'Apa kata pelanggan kami'
  subtitle: 'Dari pendayung pemula hingga operator armada profesional — lihat mengapa mereka mempercayai afarer.'
  items:
    - content: 'Kami melengkapi seluruh armada rental kami dengan SUP afarer. Dua musim berjalan, nihil kegagalan. Sertifikasi CE membuat persetujuan asuransi berjalan mulus.'
      name: 'Marco V.'
      title: 'Operator tur, Kroasia'
    - content: 'Sebagai pembeli pertama kali, saya sempat cemas soal kualitas. Dokumentasi ISO dan laporan pengujian yang mereka bagikan memberi saya keyakinan penuh.'
      name: 'James T.'
      title: 'Pemilik SUP Explorer 11, Kanada'
    - content: 'Kami bekerja sama dengan afarer untuk unit patroli pesisir kami. Proses QC mereka konsisten di setiap batch — keandalan seperti itu sangat penting dalam operasi misi kritis.'
      name: 'Lt. Cmdr. Andres'
      title: 'Pengadaan pemerintah, Filipina'

steps2_manufacturing:
  title: 'Cara kami memastikan kualitas'
  subtitle: 'Dari inspeksi bahan baku hingga pengujian tekanan akhir — setiap produk melewati rantai kualitas yang ketat.'
  items:
    - title: 'Inspeksi Bahan Baku'
      description: 'Setiap gulungan kain PVC diuji untuk ketebalan, kekuatan tarik, dan ketahanan UV sebelum masuk produksi.'
      icon: 'tabler:search'
    - title: 'QC Dalam Proses'
      description: 'Sambungan las, pemasangan valve, dan perekatan ruang udara diperiksa di setiap stasiun selama perakitan.'
      icon: 'tabler:eye'
    - title: 'Pengujian Tekanan'
      description: 'Setiap produk tiup dikembangkan hingga 1,25x PSI rating dan ditahan selama 24–48 jam untuk memverifikasi retensi udara dan integritas sambungan.'
      icon: 'tabler:wind'
    - title: 'Inspeksi Akhir'
      description: 'Setiap unit diperiksa untuk finishing, perangkat keras, dan pengemasan sebelum disetujui untuk pengiriman. Sampel batch dikirim ke laboratorium kami untuk pengujian destruktif.'
      icon: 'tabler:clipboard-check'


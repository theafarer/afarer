content_html: |
  <h2>Ketiga Ketebalan Standar</h2>

  <h3>4" (10 cm) – Touring &amp; Performa</h3>
  <ul>
    <li>Kekakuan tertinggi – lebih sedikit lenturan saat dibebani</li>
    <li>Terpaling ringan – lebih sedikit material, volume udara lebih kecil</li>
    <li>Pelacakan sangat baik – goyangan samping berkurang</li>
    <li>Terpaling cepat – hambatan berkurang, luncuran lebih mudah</li>
    <li>Terbaik untuk: Touring, balapan, pendayungan kebugaran, pendayung berpengalaman</li>
  </ul>

  <h3>5" (12,7 cm) – All-Around</h3>
  <ul>
    <li>Kekakuan baik – rasio lentur-ke-kekakuan seimbang</li>
    <li>Berat sedang – penggunaan material standar</li>
    <li>Stabilitas primer + sekunder baik</li>
    <li>Terbaik untuk: Pendayungan rekreasi, pemula, penggunaan santai di danau dan sungai</li>
  </ul>

  <h3>6" (15,2 cm) – Stabilitas &amp; Yoga</h3>
  <ul>
    <li>Stabilitas primer tertinggi – daya apung besar</li>
    <li>Terpaling berat – lebih banyak material PVC, volume udara lebih besar</li>
    <li>Terpaling lambat – hambatan lebih besar, luncuran lebih sulit dipertahankan</li>
    <li>Terbaik untuk: Yoga/kebugaran, pendayung berat (100+ kg), kondisi air sangat beriak</li>
  </ul>

  <h2>Analisis Rekayasa</h2>
  <p>Kekakuan SUP tiup ditentukan oleh tekanan udara internal dan momen inersia penampang papan. Pada 20 PSI, papan 4" menunjukkan sekitar 30% lebih sedikit defleksi saat dibebani dibandingkan papan 6" dengan lebar dan panjang yang sama. Stabilitas primer berasal dari lebar garis air dan daya apung; stabilitas sekunder dipengaruhi oleh bentuk rail dan lebar papan.</p>

  <h2>Ketebalan Berdasarkan Berat Pendayung</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Berat Pendayung</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Ketebalan yang Direkomendasikan</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Di bawah 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" atau 6"</td></tr>
      <tr><td class="p-3 border">Di atas 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Kompromi Ketebalan vs. PSI</h2>
  <p>Miskonsepsi umum adalah bahwa PSI lebih tinggi dapat mengompensasi ketebalan yang berlebihan. Pada 25 PSI, papan 6" menunjukkan lebih banyak lenturan dibandingkan papan 4" pada 15 PSI karena momen inersia geometris mendominasi persamaan kekakuan. Bagi pendayung berorientasi performa, papan lebih tipis pada tekanan lebih rendah mengungguli papan lebih tebal pada tekanan lebih tinggi.</p>

  <h2>Jajaran Afarer</h2>
  <ul>
    <li><strong>Papan 4":</strong> Seri Cheetah Touring – SUP touring 12' x 30" x 4" untuk kebugaran dan pendayungan jarak jauh</li>
    <li><strong>Papan 5":</strong> Seri Cheetah All-Round – 10'6" x 32" x 5" untuk penggunaan rekreasi</li>
    <li><strong>Papan 6":</strong> Seri Cheetah Ultra-Stable – 10' x 34" x 6" untuk yoga, pendayung berbadan besar, dan platform fotografi</li>
  </ul>
  <p>Semua papan menggunakan inti drop-stitch 1.680 DTEX dengan tekanan rating 20 PSI dan laminat PVC 1,2 mm.</p>


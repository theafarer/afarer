body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Garansi Terbatas ini berlaku untuk produk marinir tiup bermerek afarer baru yang dibeli langsung dari afarer atau dari dealer atau pengecer afarer resmi. Tanggal berlaku adalah tanggal pembelian ritel asli yang dapat diverifikasi.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Cakupan & Durasi Garansi</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Integritas kain tabung utama (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Integritas struktural lambung fiberglass</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Kemampuan menahan udara sambungan tabung tiup</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Fungsionalitas valve tiup</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Aksesori terpasang pabrik dan fitting tambahan</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Tahun*</h3>
        <p class="text-sm text-gray-600 mt-1">Penggunaan komersial, rental, atau armada — semua komponen</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Penggunaan komersial, pemerintah, charter, rental, atau instruksional mengurangi garansi menjadi 1 tahun. Penggunaan balap atau kompetisi membatalkan garansi sepenuhnya.</p>
  </div>

  <h2>Apa yang Dicakup</h2>
  <h3>Kain Tabung Utama (5 Tahun)</h3>
  <p>afarer menjamin kain deck utama terhadap deteriorasi porositas yang secara substansial mengganggu kemampuan produk mempertahankan tekanan tiup operasional. Ini berlaku untuk kain berlapis PVC dan semua bahan kain deck lainnya yang digunakan dalam produksi.</p>

  <h3>Integritas Struktural Lambung Fiberglass (5 Tahun)</h3>
  <p>Untuk produk dengan lambung plastik diperkuat fiberglass (FRP), struktur komposit fundamentalnya dijamin terhadap kegagalan struktural akibat cacat material atau pengerjaan.</p>

  <h3>Kemampuan Menahan Udara Sambungan Tabung Tiup (5 Tahun)</h3>
  <p>Sambungan tabung tiup, yang disambung saat produksi, dijamin terhadap cacat manufaktur yang mengakibatkan kebocoran udara substansial melalui sambungan. Inspeksi berkala dan pemeliharaan tekanan tiup yang tepat merupakan syarat cakupan.</p>

  <h3>Fungsionalitas Valve Tiup (5 Tahun)</h3>
  <p>Valve tiup udara yang dipasang asli oleh afarer dijamin terhadap cacat manufaktur pada material atau pengerjaan yang mencegah valve menahan udara sesuai desain.</p>

  <h3>Aksesori Terpasang Pabrik (1 Tahun)</h3>
  <p>Komponen dan fitting yang diproduksi oleh afarer dan dipasang asli di pabrik dijamin terhadap cacat material dan pengerjaan selama satu tahun. Ini tidak mencakup barang pihak ketiga, yang hanya dicakup oleh garansi produsen masing-masing.</p>

  <h2>Apa yang Tidak Dicakup</h2>
  <ul>
    <li>Cacat kosmetik termasuk perubahan warna, noda, pudar, chalking, atau perubahan tampilan lainnya</li>
    <li>Tusukan, sayatan, sobekan, robekan, atau kerusakan fisik lainnya</li>
    <li>Crazing, retak, abrasi, scuffing, atau deteriorasi akibat gesekan atau kontak</li>
    <li>Degradasi akibat paparan sinar UV, pelapukan, atau kondisi atmosfer</li>
    <li>Kerusakan akibat kontak dengan bahan bakar, pelarut, asam, alkali, atau bahan kimia</li>
    <li>Kerusakan akibat kelalaian, penggunaan yang tidak tepat, penyalahgunaan, kecelakaan, atau keausan normal</li>
    <li>Masalah permukaan gelcoat atau cat (menggelembung, crazing, perubahan warna, pudar)</li>
    <li>Kerusakan akibat benturan, tekanan, penopangan yang tidak tepat, atau transportasi trailer</li>
    <li>Kerusakan akibat tiup/kempis yang tidak tepat atau penggunaan perangkat tiuk tidak disetujui</li>
    <li>Peralatan, komponen, atau sistem pihak ketiga (dicakup oleh produsen masing-masing)</li>
  </ul>

  <h2>Kewajiban & Solusi Produsen</h2>
  <p>Kewajiban tunggal dan eksklusif afarer adalah memperbaiki atau mengganti, atas keputusan afarer, komponen mana pun yang ditentukan cacat pada material atau pengerjaan dan dicakup oleh garansi ini. Perbaikan atau penggantian dilakukan oleh afarer atau fasilitas layanan resmi yang ditunjuknya. Komponen yang diperbaiki atau diganti hanya dijamin untuk sisa masa garansi asli yang belum berakhir.</p>

  <h2>Syarat Garansi</h2>
  <ul>
    <li><strong>Registrasi:</strong> Produk harus terdaftar dengan benar sesuai ketentuan dalam syarat garansi.</li>
    <li><strong>Pemeliharaan:</strong> Produk harus dipelihara sesuai pedoman yang dipublikasikan afarer, termasuk inspeksi berkala dan pemeliharaan tekanan tiup yang tepat.</li>
    <li><strong>Kooperasi:</strong> Pembeli harus bekerja sama sepenuhnya dan segera dengan afarer dalam semua hal terkait klaim garansi.</li>
    <li><strong>Pembeli Asli:</strong> Garansi ini diberikan secara eksklusif kepada pembeli pengguna akhir asli dan tidak dapat dipindahtangankan.</li>
  </ul>

  <h2>Penggunaan Komersial</h2>
  <p>Jika produk digunakan untuk tujuan komersial, pemerintah, nirlaba, charter, rental, instruksional, atau tujuan lain selain rekreasi pribadi, masa garansi untuk semua komponen dikurangi menjadi satu (1) tahun dari tanggal pembelian ritel asli. Penggunaan dalam balap, kompetisi kecepatan atau ketahanan langsung dan tanpa dapat dibatalkan membatalkan garansi sepenuhnya.</p>

  <h2>Cara Mengajukan Klaim Garansi</h2>
  <p>Hubungi afarer atau dealer resmi Anda dengan bukti pembelian dan deskripsi rinci masalahnya. afarer akan meninjau klaim tersebut dan memberikan instruksi untuk inspeksi dan layanan.</p>
  <p>Untuk pertanyaan layanan garansi, silakan hubungi kami melalui <a href="/contact" class="text-sky-600 underline">halaman kontak</a> kami dengan nomor pesanan dan detail produk Anda.</p>

  <h2>Barang Pihak Ketiga</h2>
  <p>Peralatan, komponen, atau sistem yang diproduksi oleh pihak ketiga (meskipun dipasang oleh afarer) secara eksklusif dicakup oleh garansi apa pun yang ditawarkan produsen masing-masing. afarer secara tegas menolak segala tanggung jawab garansi atas barang pihak ketiga tersebut.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Pernyataan garansi ini adalah ringkasan dari Garansi Terbatas Produsen afarer yang lengkap. Dokumen garansi hukum lengkap mengatur semua syarat dan ketentuan garansi. Spesifikasi dapat berubah tanpa pemberitahuan. afarer adalah merek yang dioperasikan oleh Aquafarer LLC (AS).
  </p>

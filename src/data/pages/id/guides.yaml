size_guide:
  tagline: Ukuran & Spesifikasi
  title: Temukan Ukuran yang Tepat untuk Kebutuhan Anda
  desc: Bandingkan dimensi papan SUP, kapasitas beban, dan penggunaan yang direkomendasikan. Baik Anda membutuhkan SUP touring, papan yoga, atau SUP all-around — panduan ukuran kami membantu Anda memilih yang paling pas.
  link_label: 'Panduan ukuran lengkap dengan spesifikasi produk →'
  link: /size-guide/
  cards:
    - title: Papan SUP
      desc: Pilih panjang berdasarkan berat badan dan penggunaan yang Anda maksudkan. Papan yang lebih lebar (32"+) menawarkan lebih banyak stabilitas. Papan yang lebih panjang (11–12 ft) melacak lebih baik untuk touring.
    - title: SUP Touring
      desc: Papan lebih panjang (11–12 ft) untuk menempuh jarak dan melacak lurus. Cukup stabil untuk touring dengan perlengkapan. Selalu periksa kapasitas beban.
    - title: SUP All-Around
      desc: Pilih panjang berdasarkan berat pengendara dan penggunaan. Papan lebih lebar (32"+) untuk stabilitas. Serbaguna untuk rekreasi dan kebugaran.

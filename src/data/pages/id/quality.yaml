commitment:
  title: 'Komitmen Kami'
  body: 'Melalui prosedur pengujian yang ketat ini, {SITE} memberikan pelanggan keyakinan bahwa SUP tiup kami tidak hanya berkinerja tinggi tetapi juga dibangun untuk bertahan lama — memastikan petualangan di air yang tak terhitung jumlahnya, menyenangkan, dan aman. Lab kualitas kami beroperasi independen dari produksi dan melapor langsung kepada manajemen.'
  cta: 'Minta dokumentasi pengujian'
  cta_link: /contact/

tests:
  - title: 'Pengujian Tekanan'
    description: 'Ruang-ruang tiup dikenai tekanan yang melampaui batas operasional yang direkomendasikan selama periode panjang. Hal ini memverifikasi kedap udara dan integritas struktural material serta sambungan, memastikan produk dapat menahan penggunaan yang dimaksudkan dan potensi inflasi berlebih tanpa kegagalan atau kebocoran.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
  - title: 'Pengujian Benturan'
    description: 'Produk dikenai benturan terkendali dari berbagai beban dan sudut. Hal ini menilai ketahanan material terhadap tusulan, sobekan, dan kerusakan akibat tabrakan dengan rintangan di air, menunjukkan daya tahan dan umur panjang.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
  - title: 'Pengujian Ketahanan UV'
    description: 'Sampel material menjalani paparan UV dipercepat yang mensimulasikan bertahun-tahun paparan sinar matahari keras, lalu diuji ulang untuk retensi kekuatan tarik dan ketahanan warna. Hal ini memverifikasi bahwa senyawa PVC tahan terhadap pemudaran, pengapuran, dan keretakan, memastikan daya tahan jangka panjang di lingkungan bahari yang cerah.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
  - title: 'Pengujian Ketahanan Abrasi'
    description: 'Sampel material digosokkan pada permukaan abrasif selama sejumlah siklus tertentu di bawah tekanan terkendali. Hal ini mengukur kemampuan material menahan keausan akibat penggunaan berulang, kontak dengan pasir, batu, atau permukaan lain, memastikan daya tahan jangka panjang.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
  - title: 'Pengujian Performa Suhu Rendah'
    description: 'Produk diuji di lingkungan dingin untuk menilai fungsionalitas dan daya tahan dalam berbagai kondisi suhu, mencegah kekakuan atau keretakan di perairan yang lebih dingin. Esensial untuk papan yang ditujukan untuk penggunaan musim dingin atau lintang tinggi.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
  - title: 'Pengujian Daya Apung & Kapasitas Beban'
    description: 'Produk diuji dengan berbagai beban untuk menentukan kapasitas beban maksimumnya dan memastikan produk secara aman menopang pengguna dan perlengkapan. Kapasitas nominal setiap model diverifikasi sebelum dirilis.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
  - title: 'Pengujian Kemampuan Manuver'
    description: 'Produk diuji responsivitasnya terhadap input dayungan atau motor, mengevaluasi radius belok dan kemudahan penanganan. Uji coba di air memvalidasi bahwa penanganan dunia nyata sesuai dengan spesifikasi desain.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
  - title: 'Pengujian Kedap Air'
    description: 'Produk yang telah dirakit sepenuhnya direndam atau dikenai semprotan air untuk memeriksa kebocoran melalui sambungan, valve, atau material. Setiap papan lulus pemeriksaan kedap air wajib sebelum pengiriman.'
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp


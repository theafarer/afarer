      description: 'Aset kampanye terlokalisasi, materi POS dealer, kit acara, konten digital dalam berbagai bahasa, dan dukungan co-marketing untuk musim peluncuran.'
      icon: 'tabler:mood-smile'
    - title: 'Pelatihan Produk, Penjualan & Teknis'
      description: 'Sesi onboarding terstruktur tentang produk, penjualan, dan pengetahuan teknis, dengan materi yang diperbarui seiring perkembangan lini produk.'
      icon: 'tabler:presentation'
    - title: 'Suku Cadang & Dukungan Purnajual'
      description: 'Pasokan suku cadang, registrasi garansi dan penanganan klaim, serta lembar data produk dan manual untuk tim layanan lokal Anda.'
      icon: 'tabler:settings'
    - title: 'Manajer Akun Khusus & Portal Mitra'
      description: 'Manajer distributor pribadi plus akses ke daftar harga, status pesanan, dan sumber daya pemasaran melalui portal mitra Afarer.'
      icon: 'tabler:user-check'

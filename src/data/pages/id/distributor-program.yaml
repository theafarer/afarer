faqs:
  title: 'Kemitraan Negara — FAQ'
  subtitle: 'Pertanyaan yang diajukan calon mitra negara yang serius sebelum mendaftar.'
  items:
    - title: 'Apa arti sebenarnya dari satu-negara-satu-distributor?'
      description: 'Afarer menunjuk satu distributor resmi dengan hak eksklusif untuk wilayah yang ditetapkan. Kami tidak menjual dari kanal global atau regional kami ke dalam negara yang dilindungi. Kepemilikan wilayah Anda berlaku selama Perjanjian Distribusi dipenuhi.'
    - title: 'Apakah wilayahnya eksklusif selamanya?'
      description: 'Tidak. Eksklusivitas bersifat bersyarat, bukan abadi. Eksklusivitas dipertahankan melalui Perjanjian Distribusi yang ditandatangani, penyelesaian pesanan pertama Anda, target pembelian tahunan, stok lokal, kemampuan purnajual, dan investasi pasar yang berkelanjutan. Jika hal-hal ini tidak dipenuhi, wilayah dapat dinegosiasikan ulang atau ditugaskan kembali.'
    - title: 'Berapa pesanan pertama minimum?'
      description: 'Distributor negara dan regional mulai dari 100–300 unit; dealer resmi dari 30–50 unit; pesanan uji coba dari 10–30 unit memungkinkan Anda memvalidasi pasar terlebih dahulu (pesanan uji coba dan sampel tidak membawa perlindungan wilayah). Program kustom dan label pribadi mengikuti MOQ terpisah yang tercantum dalam tingkatan di atas.'
    - title: 'Dukungan apa saja yang termasuk dalam program dukungan 10 modul?'
      description: 'Tingkatan dan kualifikasi, perlindungan wilayah, MOQ / harga / rabat tahunan, inventori dan eksekusi pesanan, aset pemasaran dan dana pasar bersama, pelatihan produk / penjualan / teknis, suku cadang dan purnajual, registrasi garansi, portal mitra, serta lembar data produk, pustaka aset pemasaran, jadwal rabat tahunan, dan daftar pengiriman dan pengemasan.'
    - title: 'Bagaimana Afarer melindungi saya dari konflik kanal?'
      description: 'Setiap wilayah memiliki tepat satu distributor resmi. Pertanyaan dan pesanan langsung dari wilayah Anda diarahkan melalui Anda, formulir situs web diteruskan kepada mitra lokal jika ada, dan tim global hanya mengeskalasi ketika mitra tidak merespons.'
    - title: 'Apa ketentuan pengiriman dan pembayaran?'
      description: 'Pesanan dikirim FOB Qingdao dengan dokumentasi ekspor lengkap. Pesanan produksi menggunakan 30% deposit dengan 70% sebelum pengiriman; pesanan uji coba dan sampel dibayar di muka. Waktu pengerjaan standar adalah 30–45 hari kerja, dengan 15–20 hari kerja untuk produksi sampel.'
    - title: 'Bagaimana cara mendaftar?'
      description: 'Kirim pengajuan Anda melalui formulir kontak dengan rincian pasar. Kami meninjau kesesuaian pasar, kehadiran ritel, dan kemampuan logistik, lalu merespons dalam 3 hari kerja dengan langkah selanjutnya dan draf Perjanjian Distribusi.'

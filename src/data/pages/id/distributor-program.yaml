features:
  title: 'Mengapa Bermitra Dengan Afarer'
  subtitle: 'Model satu-negara-satu-distributor dengan struktur dukungan yang membuat wilayah tersebut menguntungkan. Eksklusivitas diraih dan dipertahankan — bukan merupakan hak permanen.'
  columns: 3
  items:
    - title: 'Eksklusivitas Wilayah'
      description: 'Satu distributor resmi per negara atau wilayah. Tanpa impor paralel, tanpa persaingan internal. Investasi Anda membangun keunggulan kompetitif Anda sendiri.'
      icon: 'tabler:shield-check'
    - title: 'Perlindungan dari Konflik Kanal'
      description: 'Pesanan langsung dari wilayah Anda diarahkan melalui Anda, dan penetapan harga melindungi margin Anda. Afarer tidak menjual dengan melewati mitra negaranya.'
      icon: 'tabler:users'
    - title: 'Margin Langsung Pabrik & Rabat'
      description: 'Daftar harga dealer dengan rabat atas volume yang dikomitmenkan. Tanpa perantara. Pengiriman FOB Qingdao dengan dokumentasi ekspor lengkap.'
      icon: 'tabler:coins'
    - title: 'Program Dukungan Mitra 10 Modul'
      description: 'Onboarding, go-to-market, pelatihan, pemasaran dan pendanaan pasar bersama, suku cadang dan purnajual, garansi, alat pemesanan, dan portal mitra — tercakup dalam Perjanjian Distribusi Anda.'

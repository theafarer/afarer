features3_cases:
  tagline: 'Kasus Pilihan'
  title: 'Solusi Kustom<br />Untuk Tantangan Nyata'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Armada Pusat Menyelam Eropa'
      customer: 'BlueMed Diving Centers'
      country: 'Yunani'
      industry: 'Menyelam & Pariwisata Bahari'
      challenge: 'Membutuhkan 12 SUP berkonfigurasi selam untuk sebuah jaringan pusat menyelam di beberapa pulau Yunani. Setiap papan memerlukan titik pemasangan perlengkapan kustom, penyimpanan untuk 8 tabung, dan platform stabil untuk masuknya penyelam di perairan terbuka. Armada harus tiba dalam 60 hari menjelang awal musim wisata.'
      solution: 'Memproduksi 12 model SUP Voyager Dive dengan rak perlengkapan terintegrasi, platform stabil, dan konstruksi drop-stitch ekstra lebar untuk stabilitas saat naik ke papan. Setiap papan diberi identitas merek armada pelanggan. Seluruh 12 papan diuji tekanan dan dikirim dari Qingdao dalam 55 hari.'
      product: 'SUP Voyager Dive'
      results: 'Seluruh 12 papan terkirim tepat waktu untuk musim wisata. Armada telah beroperasi harian selama 18+ bulan tanpa kegagalan material. Pelanggan memesan 6 unit tambahan pada tahun kedua.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Voyager Dive telah menjadi tulang punggung operasi menyelam harian kami. Stabilitasnya sangat baik, dan tata letak penyimpanan perlengkapan menjaga dek tetap bersih dan aman bagi tamu kami.'
      icon: tabler:lifebuoy
    - title: 'Program Co-Brand Distributor Australia'
      customer: 'Pacific Watersports Pty Ltd'
      country: 'Australia'
      industry: 'Program Co-Brand & Kemitraan'
      challenge: 'Distributor Australia membutuhkan lini papan SUP label pribadi dengan harga kompetitif untuk bersaing dengan merek Tiongkok direct-to-consumer. Membutuhkan 8 model unik yang mencakup pemula hingga lanjutan, dengan grafis kustom, kemasan kustom, dan pemenuhan drop-ship ke gerai ritel.'
      solution: 'Mengembangkan 8 model SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) dengan paket grafis eksklusif Australia. Kemasan ritel kustom dengan kode QR yang tertaut ke video panduan. Logistik drop-ship dikonfigurasi dari Qingdao langsung ke toko-toko ritel Australia.'
      product: 'Lini SUP Kustom (8 model)'
      results: 'Dari konsep hingga pengiriman pertama dalam 90 hari. Tingkat sell-through ritel 85% pada musim pertama. Distributor memperluas kemitraan untuk mencakup model SUP tambahan pada tahun kedua.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'afarer menghadirkan lini SUP lengkap dalam 90 hari — dari desain awal hingga lantai ritel. Kualitasnya setara dengan merek yang dijual pada titik harga dua kali lipat.'
      icon: tabler:currency-dollar
    - title: 'Pasokan Peralatan Penyelamatan Timur Tengah'
      customer: 'Otorita Pertahanan Sipil Nasional'
      country: 'Uni Emirat Arab'
      industry: 'Pencarian & Penyelamatan'
      challenge: 'Organisasi pertahanan sipil membutuhkan 20 SUP siap patroli untuk pencarian dan penyelamatan pesisir, keamanan pelabuhan, dan penanggulangan banjir. Membutuhkan papan dengan kenampakan tinggi, peralatan keselamatan lengkap, dan kepatuhan terhadap regulasi bahari setempat.'
      solution: 'Menyediakan 20 model SUP Patrol dengan konstruksi drop-stitch oranye berkenampakan tinggi, paket keselamatan lengkap, pita reflektif SOLAS, dan konstruksi yang diperkuat. Setiap papan tersertifikasi CE dan diuji sesuai standar yang berlaku. Paket dokumentasi mencakup sertifikat kepatuhan untuk pendaftaran setempat.'
      product: 'SUP Patrol'
      results: 'Armada diterjunkan di 5 stasiun pesisir. Papan telah beroperasi dalam panas ekstrem (45°C+) tanpa degradasi. Performa dan daya tahan melampaui spesifikasi.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol melampaui persyaratan operasional kami. Dalam kondisi panas ekstrem, papan tidak menunjukkan tanda degradasi UV setelah 24 bulan penggunaan harian.'
      icon: tabler:alert-triangle
    - title: 'Kemitraan Co-Brand Eropa'
      customer: 'North Sea Marine Equipment BV'
      country: 'Belanda'
      industry: 'Program Co-Brand & Kemitraan'
      challenge: 'Merek bahari Eropa yang telah mapan ingin memasuki pasar SUP tanpa berinvestasi pada fasilitas manufaktur. Membutuhkan mitra white-label yang mampu memproduksi 5 model SUP (9 ft hingga 12 ft) dengan merek pribadi, sertifikasi CE, dan hak distribusi eksklusif UE.'
      solution: 'Menetapkan perjanjian manufaktur white-label untuk 5 model SUP. Setiap model diberi merek dengan logo dan skema warna pelanggan. Dokumentasi sertifikasi CE disiapkan untuk setiap model. Hak distribusi eksklusif UE diberikan dengan komitmen pesanan minimum. Dokumentasi teknis disediakan untuk jaringan layanan setempat.'
      product: 'Lini SUP Kustom (5 model)'
      results: 'Perjanjian multitahun ditandatangani. Produksi pertama sebanyak 50 unit dikirim dalam 75 hari. Merek diluncurkan di pameran dagang utama dengan sambutan dealer yang positif.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Bekerja sama dengan afarer memungkinkan kami memasuki pasar SUP tanpa membangun pabrik — mereka menghadirkan solusi turnkey lengkap dengan sertifikasi CE dan dokumentasi dukungan dealer.'
      icon: tabler:building
    - title: 'Armada Resor Karibia'
      customer: 'Paradise Island Resorts Ltd'
      country: 'Bahama'
      industry: 'Pariwisata Bahari & Perhotelan'
      challenge: 'Resor mewah membutuhkan armada peralatan olahraga air lengkap untuk aktivitas tamu: 40 papan SUP untuk tur berpemandu, 20 SUP tambahan untuk eksplorasi laguna, 10 papan SUP untuk ekskursi tamu, ditambah aksesori. Semua peralatan memerlukan identitas merek resor kustom dan harus dikirim sebelum puncak musim wisata.'
      solution: 'Memproduksi paket SUP lengkap: 40 papan SUP Voyager (model All-Around), 20 papan SUP Explorer, 10 papan SUP Touring, ditambah PFD, dayung, pompa, dan kit perbaikan. Semua peralatan dicetak dengan logo resor dan skema warna tropis. Pengiriman terkontainerisasi dengan manifes inventori lengkap.'
      product: 'Paket SUP Lengkap (70+ unit)'
      results: 'Armada tiba 6 minggu sebelum puncak musim. Skor kepuasan tamu untuk aktivitas olahraga air naik 40% dibandingkan tahun sebelumnya. Peralatan telah bertahan 3 musim hanya dengan perawatan rutin.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'Pendekatan paket lengkap membuat kami menerima semua yang kami butuhkan dalam satu pengiriman — papan dan aksesori semuanya sudah bermerek dan siap digunakan tamu. Tamu kami menyukai kualitas peralatannya.'
      icon: tabler:beach
    - title: 'Kontrak Patroli Pesisir AS'
      customer: 'Atlantic Coastal Security Agency'
      country: 'Amerika Serikat'
      industry: 'Keamanan Bahari & Penegakan Hukum'
      challenge: 'Badan keamanan pesisir AS membutuhkan SUP patroli heavy-duty untuk operasi perairan terbuka. Membutuhkan papan berkinerja tinggi dengan perlengkapan spesifikasi militer dan kepatuhan terhadap regulasi Penjaga Pantai AS.'
      solution: 'Merancang SUP Patrol dengan konstruksi drop-stitch yang diperkuat, skema warna berkenampakan tinggi, dudukan perangkat komunikasi terenkripsi, dan titik pemasangan perlengkapan terintegrasi. Papan diperkuat untuk operasi heavy-duty. Dokumentasi kepatuhan USCG disediakan.'
      product: 'SUP Patrol'
      results: 'Badan melaporkan tingkat kesiapan misi 95% selama 12 bulan pertama. Pesanan tambahan untuk 8 unit ditempatkan.'
      image: 'https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1-1200w.webp'
      quote: 'SUP Patrol memberikan kru kami performa yang dibutuhkan untuk operasi perairan terbuka. Konstruksi yang diperkuat memberikan daya tahan kritis tanpa mengorbankan kemudahan penanganan.'
      icon: tabler:shield

faqs:
  title: 'FAQ Produksi Dayung OEM'
  subtitle: 'Jawaban atas pertanyaan paling umum dari merek yang meluncurkan dayungnya sendiri.'
  items:
    - title: 'Bagaimana cara membuat merek dayung saya sendiri?'
      description: 'Luncurkan merek Anda dalam 16 minggu: brief, desain, prototipe tersertifikasi CE, produksi massal, dan pengiriman. Jelajahi paket OEM kami.'
    - title: 'Berapa waktu produksinya?'
      description: 'Sampel siap dalam 2-3 minggu, produksi massal dalam 30-45 hari tergantung volume.'
    - title: 'Apakah dayungnya memuat logo kami?'
      description: 'Ya — label pribadi penuh: pencetakan logo, warna kustom, kemasan, dan label dengan merek Anda.'
    - title: 'Apakah saya bisa membeli grosir sejak awal?'
      description: 'MOQ adalah 50 unit untuk model standar, dengan tingkat harga grosir seiring volume meningkat.'

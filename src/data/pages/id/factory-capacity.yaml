workshops:
  - title: Produksi Papan SUP
    description: '4 lini perakitan paralel untuk papan SUP tiup. Setiap lini dapat memproduksi 50–80 papan per shift. Stasiun pencetakan digital dan sablon berjalan bersamaan. Kapasitas SUP tahunan: 10,000+ papan.'
    output: '10,000+ SUP/tahun'
  - title: 'Lini Papan SUP'
    description: 'Lini produksi serbaguna untuk papan SUP tiup. Stasiun pengelasan hot-air, press RF dielektrik, dan stasiun kerja perakitan dikonfigurasi ulang berdasarkan kombinasi pesanan. Kapasitas tahunan: 5,000+ unit.'
    output: '5,000+ unit/tahun'
  - title: Peralatan Keselamatan
    description: 'Area produksi clean-room terpisah untuk rompi pelampung dan peralatan keselamatan. Stasiun penjahitan, penyisipan foam, dan pengujian khusus. Kapasitas rompi pelampung tahunan: 50,000+ unit.'
    output: '50,000+ rompi pelampung/tahun'


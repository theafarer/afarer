- id: sup-choppy-water
  question: 'Bagaimana cara mendayung SUP di air berombak atau berangin?'
  answer: 'Saat ombak: tekuk lutut Anda, gunakan posisi kaki yang lebih lebar, perpendek kayuan, dan gunakan otot inti untuk keseimbangan. Saat melawan angin: gunakan sudut dayung yang lebih rendah, ambil kayuan lebih pendek, dan condongkan badan ke depan. Saat angin menyamping: dayunglah di sisi melawan angin untuk mengoreksi arah. Saat angin dari belakang: berselancarlah pada gelombang untuk menambah kecepatan. Pemula sebaiknya menghindari angin di atas 10 mph dan memilih papan yang lebih lebar dan lebih panjang untuk stabilitas. SUP touring afarer Ocean Voyager dirancang untuk menghadapi ombak dan angin sedang.'

- id: sup-leash-necessity
  question: 'Apakah saya benar-benar memerlukan leash untuk SUP?'
  answer: 'Ya — selalu kenakan leash. Leash SUP koil dipasang pada pergelangan kaki atau betis Anda dan menjaga papan tetap bersama Anda saat jatuh. Di perairan terbuka, leash dapat menyelamatkan nyawa Anda dengan mencegah Anda terpisah dari alat pelampung. Untuk mendayung di sungai, gunakan leash dengan quick-release untuk mencegah terjebak.'
  category: safety
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-safety-guide
    - sup-leash-guide
- id: drop-stitch-technology
  question: 'Apa itu teknologi inti drop-stitch dan mengapa penting?'
  answer: 'Teknologi inti drop-stitch menggunakan ribuan benang polyester yang menghubungkan lapisan atas dan bawah papan PVC. Saat digelembungkan hingga 15-20 PSI, benang-benang ini menciptakan struktur yang kaku dan tahan torsi dengan performa seperti papan keras. afarer menggunakan PVC kelas militer tiga lapis dengan laminasi drop-stitch pada semua tingkatan produk SUP, menghadirkan kekakuan yang sebanding dengan papan epoxy sekaligus mempertahankan portabilitas inflatable.'
  category: product
  relatedProducts:
    - sup-explorer-11
    - sup-ocean-voyager
    - sup-flowing-lotus
  relatedGuides:
    - how-to-choose-inflatable-sup
- id: sup-inflatable-vs-rigid
  question: 'Inflatable vs rigid SUP: mana yang lebih baik untuk berbagai kebutuhan?'
  answer: 'SUP inflatable unggul dalam portabilitas, penyimpanan, dan penyerapan benturan — ideal untuk perjalanan, pemula, dan penggunaan rekreasi. Papan epoxy kaku menawarkan kecepatan dan luncuran maksimal untuk balap dan berselancar. Bagi 90% pendayung, inflatable berkualitas dengan inti drop-stitch (15-20 PSI) memberikan kekakuan yang memadai untuk touring, kebugaran, yoga, dan memancing. Papan inflatable afarer menyamai performa papan keras kelas menengah sambil tetap dapat dimasukkan ke dalam ransel.'

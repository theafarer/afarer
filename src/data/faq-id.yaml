    - life-vest-pro
  relatedGuides:
    - safety-tips
- id: boat-registration
  question: 'Apakah papan SUP saya perlu didaftarkan?'
  answer: 'Persyaratan berbeda-beda di setiap yurisdiksi. Di sebagian besar wilayah, SUP tanpa motor tidak memerlukan pendaftaran. Jika Anda berencana menambahkan motor, periksalah aturan spesifik pada otoritas maritim setempat. Papan dayung rekreasi umumnya bebas dari kewajiban pendaftaran kapal.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Bagaimana cara memperbaiki kebocoran?'
  answer: 'Bersihkan area yang bocor, potong tambalan dengan sudut membulat, oleskan lem PVC, tekan dengan kuat, dan tunggu 24 jam sebelum menggelembungkan papan. Papan afarer dilengkapi kit perbaikan. Untuk petunjuk lengkap, lihat panduan perbaikan inflatable kami.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Bagaimana cara menyimpan SUP inflatable saya?'
  answer: 'Bilas dengan air tawar, keringkan sepenuhnya, kempiskan hingga tuntas, gulung secara longgar mulai dari bagian hidung, lalu simpan dalam tas jinjing di tempat yang sejuk dan kering, jauh dari sinar matahari langsung. Jangan pernah menyimpannya dalam keadaan basah atau pada suhu ekstrem.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Papan SUP inflatable atau keras?'
  answer: 'Papan inflatable menawarkan portabilitas, kemudahan penyimpanan, dan penyerapan benturan. Papan keras menawarkan kekakuan dan kecepatan maksimal. Bagi sebagian besar pengguna rekreasi, inflatable berkualitas dengan inti drop-stitch adalah pilihan yang praktis.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Kecepatan angin berapa yang terlalu tinggi untuk SUP?'
  answer: 'Pemula: di atas 10 mph (8 knot). Menengah: di atas 15 mph (13 knot). Lanjutan: di atas 20 mph (17 knot). Jika ragu, jangan melaut. Angin offshore (yang bertiup dari darat ke laut) berbahaya pada semua tingkat kemampuan.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Bagaimana garansi afarer?'
  answer: 'Semua produk afarer didukung oleh garansi pabrikan yang komprehensif. Papan SUP dijamin selama 2+ tahun terhadap cacat produksi. Garansi mencakup cacat material dan pengerjaan dalam penggunaan normal.'
  category: warranty

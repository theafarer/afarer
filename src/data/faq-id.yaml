  relatedGuides: []
- id: saltwater-rinse
  question: 'Apakah saya perlu membilas papan inflatable setelah digunakan di laut?'
  answer: 'Ya — selalu bilas papan, sirip, pompa, dan dayung Anda dengan air tawar setelah terpapar air asin. Kristal garam dapat menyusup ke sambungan dan valve, menyebabkan kebocoran mikro dan korosi. Keringkan papan di tempat teduh sebelum dikempiskan dan disimpan. Pembilasan rutin sangat memperpanjang usia papan inflatable Anda.'
  category: maintenance
  relatedProducts: []
  relatedGuides:

- id: sup-seated-paddling
  question: 'Apakah saya bisa mendayung SUP dalam posisi duduk?'
  answer: 'Ya. Banyak papan SUP, termasuk afarer Explorer 11, memiliki D-ring yang memungkinkan pemasangan kursi. Mendayung sambil duduk menjadi pilihan yang nyaman untuk perjalanan jauh, memancing, atau saat Anda ingin berganti posisi di air.'

    - paddle-board-size-guide
- id: sup-volume-weight
  question: 'Bagaimana memilih volume SUP sesuai berat badan saya?'
  answer: 'Kalikan berat badan Anda dalam kg dengan 2.2 untuk mendapatkan target volume yang ramah pemula. Misalnya, pendayung dengan berat 75 kg memerlukan setidaknya 165 liter, tetapi 220–260 liter jauh lebih stabil untuk pembelajaran. SUP Explorer 11 menawarkan volume 260 liter, cocok untuk pengendara hingga 100 kg.'
  category: product
  relatedProducts:

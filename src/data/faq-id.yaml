  relatedGuides: []
- id: shipping-info
  question: 'Berapa lama waktu pengiriman?'
  answer: 'Pesanan yang tersedia dikirim dalam 2–4 hari kerja. Pesanan domestik AS tiba dalam 5–10 hari kerja. Pesanan internasional tiba dalam 10–15 hari kerja, tergantung tujuan. Pesanan mendesak dapat dipercepat.'

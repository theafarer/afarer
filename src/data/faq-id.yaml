- id: sup-yoga
  question: 'Apakah saya bisa melakukan yoga di atas papan SUP?'
  answer: 'Tentu saja. Yoga SUP memadukan pose tradisional dengan tantangan platform mengapung, sehingga mengaktifkan otot stabilisator yang lebih dalam. Gunakan papan dengan lebar 33 inci atau lebih yang dilengkapi deck pad lunak dengan cengkeraman kuat. Berlatihlah di air yang tenang dan dangkal dengan jangkar. Mulailah dengan pose dasar seperti downward dog, warrior II, dan tree pose. SUP Explorer 11 dengan deck pad EVA penuhnya sangat cocok digunakan.'
  category: general

- id: airline-travel-sup
  question: 'Apa saja aturan maskapai penerbangan untuk bepergian dengan SUP inflatable?'
  answer: 'Sebagian besar maskapai menerima ransel SUP sebagai bagasi terdaftar jika beratnya di bawah 23–32 kg. Ransel afarer berukuran sekitar 90x40x30 cm dengan berat sekitar 15 kg saat terisi. Beberapa maskapai mungkin mengenakan biaya bagasi kelebihan ukuran. Datanglah lebih awal, bungkus sirip dan pompa secara terpisah di bagasi kabin Anda, dan beri label rapuh pada tas tersebut. Selalu teliti kebijakan perlengkapan olahraga maskapai Anda sebelum terbang.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'Perlengkapan keselamatan apa yang saya butuhkan untuk mendayung di air dingin?'
  answer: 'Air di bawah 15°C memerlukan perlindungan termal. Untuk 8–14°C gunakan wetsuit atau drysuit dengan sepatu boot, sarung tangan, dan hood. Untuk 14–20°C wetsuit 3/2mm sudah cukup. Selalu kenakan PFD yang pas di badan untuk perlindungan termal dan keselamatan. Periksa regulasi setempat mengenai perlengkapan yang diwajibkan.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'Berapa kuantitas pesanan minimum untuk OEM/ODM?'
  answer: 'Kuantitas pesanan minimum (MOQ) bervariasi tergantung pada jenis dan kompleksitas produk. Pencantuman merek kustom pada model yang sudah ada umumnya memerlukan 5–10 unit. Desain lambung yang sepenuhnya kustom memerlukan MOQ lebih tinggi. Hubungi tim penjualan kami dengan kebutuhan Anda untuk mendapatkan penawaran terperinci. Kami menangani semuanya, dari warna dan logo kustom hingga desain cetakan yang sepenuhnya orisinal.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'Apakah saya bisa menempatkan logo saya sendiri pada produk afarer?'
  answer: 'Ya. Layanan OEM kami mencakup penempatan logo kustom, skema warna kustom, dan kemasan kustom. Kami menawarkan opsi pad printing, heat transfer, dan bordir tergantung pada jenis produk. Kirimkan desain artwork dan spesifikasi Anda ke tim penjualan kami untuk mendapatkan penawaran dan estimasi waktu pengerjaan.'
  category: ordering

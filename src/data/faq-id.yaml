- id: inflation-time
  question: 'Berapa lama waktu yang dibutuhkan untuk menggelembungkan papan?'
  answer: 'Dengan pompa dual-action yang disertakan, sebagian besar papan dapat digelembungkan hingga 12–15 PSI dalam waktu kurang dari 5 menit. Opsi pompa listrik kami memangkas waktu tersebut menjadi kurang dari 2 menit. Mengempiskan dan mengemas memerlukan waktu sekitar 3 menit.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Apakah saya bisa bepergian dengan SUP inflatable?'
  answer: 'Tentu saja. Setiap papan afarer dapat dimasukkan ke dalam tas jinjing seukuran ransel yang memenuhi persyaratan bagasi maskapai penerbangan. Dengan berat hanya 18–22 lbs, papan ini mudah dibawa ke pantai, ke danau, maupun melewati terminal bandara.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Berapa batas bebannya?'
  answer: 'SUP All-Around kami menopang beban hingga 220 lbs. Seri Touring dan Yoga menopang beban hingga 250 lbs. Untuk penggunaan tandem atau beban yang lebih berat, hubungi tim kami untuk mendapatkan rekomendasi.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Apa saja yang ada di dalam kotaknya?'
  answer: 'Setiap SUP afarer dilengkapi dengan papan, ransel perjalanan, pompa tangan dual-action, sirip yang dapat dilepas, coil leash, dan kit perbaikan. Beberapa model juga menyertakan opsi upgrade dayung karbon.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Apakah Anda menawarkan paket bundling?'
  answer: 'Ya. Kami menawarkan paket bundling pilihan yang menghemat pengeluaran Anda dibandingkan membeli barang secara terpisah. Hubungi tim penjualan kami untuk informasi promosi bundling dan harga diskon volume terkini.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Apakah saya memerlukan pelampung saat ber-SUP?'
  answer: 'Ya. Di banyak yurisdiksi, pelampung diwajibkan secara hukum pada semua alat transportasi air, termasuk SUP. Bahkan di tempat yang tidak mewajibkannya, pelampung bersertifikat CE merupakan perlengkapan keselamatan yang esensial. Kami menyarankan untuk memakainya setiap saat di air.'
  category: safety
  relatedProducts:

- id: sup-deck-pad-care
  question: 'Bagaimana cara membersihkan dan merawat deck pad EVA?'
  answer: 'Bilas deck pad dengan air tawar setelah setiap sesi. Untuk kotoran atau noda, gunakan sabun lembut dan sikat halus — hindari bahan kimia keras. Jika tepinya mulai terangkat, oleskan sedikit lem kelautan tahan air dan tekan dengan pemberat selama 24 jam. Jauhkan papan dari sinar UV langsung saat tidak digunakan untuk mencegah degradasi pad.'
  category: maintenance
  relatedProducts:

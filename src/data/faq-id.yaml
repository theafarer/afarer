- id: paddle-length
  question: 'Panjang dayung berapa yang saya butuhkan?'
  answer: 'Dayung sebaiknya 6–8 inci lebih tinggi dari tinggi badan Anda. Dayung yang dapat disesuaikan memungkinkan penyetelan halus untuk berbagai kondisi. Lihat panduan dayung kami untuk ukuran yang terperinci.'
  category: product
  relatedProducts: []
  relatedGuides:

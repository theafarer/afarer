  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Apakah bisa digunakan di laut?'
  answer: 'Ya. Papan SUP afarer dirancang untuk penggunaan di laut, danau, dan sungai. Seri Touring kami mampu menghadapi ombak pesisir, dan semua papan menggunakan PVC kelas kelautan yang tahan terhadap korosi air asin. Bilas dengan air tawar setelah digunakan di laut.'
  category: general
  relatedProducts: []

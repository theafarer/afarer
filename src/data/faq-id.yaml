  relatedGuides: []
- id: sup-inflate-pressure
  question: 'Sampai berapa PSI saya harus menggelembungkan SUP saya?'
  answer: 'Gelembungkan hingga PSI maksimum yang ditetapkan untuk papan agar mendapatkan performa terbaik — umumnya 15–18 PSI untuk SUP inflatable berkualitas. afarer SUP Explorer 11 berperforma terbaik pada 15–18 PSI. Tekanan yang kurang membuat papan terasa lunak dan sulit dikendalikan. Tekanan berlebih yang melewati batas maksimum berisiko merusak benang drop-stitch. Periksa stiker di dekat valve untuk rating spesifik papan Anda.'

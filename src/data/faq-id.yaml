- id: sup-weight-capacity
  question: 'Berapa beban yang dapat ditopang papan SUP inflatable?'
  answer: 'Kapasitas beban bervariasi sesuai volume papan. Papan afarer: SUP Explorer 11 (260L, hingga 100 kg / 220 lbs), Ocean Voyager 12 (310L, hingga 140 kg / 308 lbs), Leviathan Wake (350L, hingga 180 kg / 396 lbs). Untuk performa optimal, jaga total beban (pengendara + perlengkapan) dalam batas 80% dari kapasitas maksimum. Papan akan mengapung lebih tinggi dan melaju lebih baik saat tidak kelebihan beban, terutama dalam kondisi berombak.'

  relatedGuides: []
- id: warranty-claim
  question: 'Bagaimana cara mengajukan klaim garansi?'
  answer: 'Ajukan klaim dengan menghubungi tim dukungan kami disertai nomor pesanan Anda, foto masalahnya, dan deskripsi singkat. Sebagian besar klaim ditinjau dalam 2 hari kerja. Klaim yang disetujui akan menerima penggantian atau petunjuk perbaikan dalam beberapa hari.'
  category: warranty

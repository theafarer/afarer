- id: return-policy
  question: 'Bagaimana kebijakan pengembalian Anda?'
  answer: 'Kami menerima pengembalian dalam 30 hari sejak pengiriman untuk produk yang belum digunakan dan masih dalam kemasan asli. Pesanan khusus/OEM tidak dapat dikembalikan. Hubungi tim dukungan kami untuk memulai pengembalian — kami menyediakan label pengiriman prabayar.'

  relatedGuides:
    - weather-conditions
    - sup-safety-guide
    - wind-conditions-sup
- id: sup-sustainability
  question: 'Apakah papan SUP inflatable berkelanjutan secara lingkungan?'
  answer: 'SUP inflatable memiliki jejak lingkungan yang lebih rendah daripada papan kaku dalam beberapa hal: bahan baku yang digunakan lebih sedikit dalam produksi, bobotnya yang lebih ringan mengurangi emisi pengiriman, dan daya tahannya berarti lebih sedikit penggantian dari waktu ke waktu. PVC yang digunakan pada papan afarer bebas timbal dan mematuhi REACH. Praktik keberlanjutan utama: belilah papan berkualitas yang bertahan 5-10 tahun, perbaiki kebocoran alih-alih mengganti, daur ulang papan pada akhir masa pakainya melalui program daur ulang PVC khusus, dan hindari kemasan sekali pakai dengan memilih merek yang menggunakan tas jinjing yang dapat dipakai ulang.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides: []
- id: b2b-moq
  question: 'Berapa kuantitas pesanan minimum untuk produksi SUP OEM/ODM?'
  answer: 'Kuantitas pesanan minimum (MOQ) bervariasi tergantung pada jenis produk. Pencantuman merek kustom pada model stok: 50 unit per SKU. Pengembangan cetakan bentuk kustom: 200–500 unit per model (pesanan pertama). Program berbagi cetakan tersedia mulai dari 50 unit. Aksesori dan PFD: 500–1000 unit per desain. Hubungi tim OEM kami dengan proyeksi volume Anda untuk mendapatkan MOQ dan harga yang presisi.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Berapa waktu pengerjaan umum untuk pesanan SUP OEM?'
  answer: 'Pesanan OEM pertama dengan pencantuman merek pada cetakan yang sudah ada: 6–8 minggu dari deposito hingga FOB Qingdao. Pesanan bentuk kustom yang memerlukan cetakan baru: 12–20 minggu (termasuk desain 3D, fabrikasi cetakan, pembuatan prototipe, dan produksi massal). Pesanan ulang dengan spesifikasi yang telah disetujui: 6–8 minggu. Pesanan mendesak dapat dipercepat menjadi 4–5 minggu untuk cetakan yang sudah ada. Waktu pengerjaan mencakup pengadaan bahan baku, produksi, QC inline, dan pemuatan kontainer.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Sertifikasi apa saja yang dimiliki produk OEM afarer?'
  answer: 'Semua produk OEM/ODM afarer menyertakan: deklarasi kesesuaian CE (pasar UE), UKCA (pasar Inggris), sistem manajemen mutu ISO 9001:2015, audit kepatuhan sosial BSCI, kepatuhan material REACH dan RoHS, serta klasifikasi EN ISO 25649 untuk papan SUP inflatable. Sertifikasi tambahan tersedia atas permintaan: dokumentasi kepatuhan US Coast Guard, pengujian standar militer (MIL-STD-810), dan dukungan sertifikasi impor negara tujuan.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Apakah saya bisa memesan sampel sebelum berkomitmen ke produksi massal?'
  answer: 'Ya. Pesanan sampel tersedia untuk semua proyek OEM/ODM. Sampel pra-produksi (PPS) diproduksi setelah fabrikasi cetakan dan sebelum produksi massal. Waktu pengerjaan sampel: 15–25 hari kerja untuk cetakan yang sudah ada, 25–40 hari kerja untuk cetakan kustom. Biaya sampel dapat dikreditkan dari pesanan massal pertama. Sampel dikirim melalui kurir ekspres (DHL, FedEx, UPS) dengan pelacakan penuh dan biasanya tiba dalam 3–5 hari kerja.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'Syarat pembayaran apa saja yang tersedia untuk pesanan OEM?'
  answer: 'Syarat pembayaran standar: deposito 30% dengan PI (proforma invoice) yang ditandatangani, pelunasan 70% sebelum pengiriman dengan salinan B/L (bill of lading). Untuk mitra pertama kali: deposito 50%, 50% sebelum pengiriman. Untuk mitra mapan dengan riwayat pesanan: L/C at sight, atau net 30 hari untuk akun yang memenuhi syarat (tergantung hasil peninjauan kredit). Metode pembayaran: transfer wire T/T, L/C (letter of credit), Western Union. Semua pembayaran dalam USD atau EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Bagaimana afarer melindungi kekayaan intelektual dan desain saya?'
  answer: 'Perlindungan IP merupakan bagian inti dari layanan OEM kami. Kami menandatangani NDA sebelum diskusi desain apa pun. File desain ditangani di workstation terisolasi dengan pencatatan akses. Semua tooling dan cetakan tetap menjadi milik eksklusif Anda (dibayar oleh Anda). Kami tidak akan menggunakan kembali cetakan atau desain Anda untuk klien lain. Penyimpanan dan perawatan cetakan termasuk untuk akun aktif. Setelah perjanjian berakhir, cetakan akan dikirim kepada Anda atau dimusnahkan dengan dokumentasi video. Kami menghormati semua hak merek dagang dan paten.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Opsi pengiriman dan logistik apa saja yang tersedia?'
  answer: 'FOB Qingdao (standar): kargo dimuat di pelabuhan Qingdao; Anda mengatur angkutan dari sana. CIF (pelabuhan tujuan yang ditentukan): kami mengatur dan mengasuransikan pengiriman ke pelabuhan tujuan Anda. DDP / door-to-door: logistik layanan penuh termasuk clearance bea cukai dan pengiriman akhir. Pengiriman laut ke Pantai Barat AS: sekitar 25–30 hari. Pengiriman laut ke UE (Hamburg/Rotterdam): sekitar 30–35 hari. Pengiriman udara tersedia untuk pesanan mendesak (3–5 hari). Kami menangani semua dokumentasi bea cukai ekspor, sertifikat asal, dan daftar kemasan.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Proses pengendalian mutu apa saja yang berlaku untuk pesanan OEM?'
  answer: 'Setiap pesanan OEM mengikuti rencana QC terdokumentasi: 1) Inspeksi material masuk — pengujian batch kain PVC untuk ketebalan, kekuatan tarik, dan ketahanan UV. 2) QC dalam proses — pengujian kekuatan las sambungan setiap 50 unit, uji tahan tekanan pada 1.25x PSI rating. 3) Inspeksi akhir — inspeksi visual 100% dan pengujian tekanan pada setiap papan. 4) Sampling AQL — sampling batch sesuai ISO 2859 dengan cacat kritis = 0 penerimaan. 5) Inspeksi pihak ketiga — SGS, Bureau Veritas, atau Intertek tersedia dengan biaya ditanggung pembeli.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Apakah Anda dapat membuat kemasan kustom untuk merek saya?'
  answer: 'Ya. Kami menawarkan layanan kemasan kustom lengkap: kotak ritel dengan pencetakan CMYK warna penuh dan grafis merek, tas jinjing dengan logo sablon atau bordir, manual petunjuk dalam bahasa Anda, hang tag dan label barcode/UPC, serta kemasan dalam (polybag, sisipan busa). MOQ kemasan minimum: 500–1000 unit untuk kotak kustom, 200–500 untuk tas jinjing. Layanan desain kemasan termasuk dalam pesanan OEM.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Apakah saya bisa mengunjungi pabrik atau mengatur audit pihak ketiga?'
  answer: 'Kunjungan pabrik dipersilakan dengan perjanjian waktu terlebih dahulu. Kami menerima pemilik merek sepanjang tahun dan dapat mengatur penjemputan di Bandara Internasional Qingdao Jiaodong (TAO). Bagi pembeli yang tidak dapat berkunjung, kami menawarkan: tur pabrik virtual melalui panggilan video, koordinasi audit pihak ketiga dengan SGS/Bureau Veritas (biaya audit ditanggung pembeli), serta paket dokumentasi kapabilitas pabrik terperinci termasuk daftar peralatan, alur proses QC, dan kualifikasi personel.'
  category: b2b
  relatedProducts: []
  relatedGuides: []

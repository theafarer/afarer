- id: fishing-sup-setup
  question: 'Apakah saya bisa memancing dari papan SUP?'
  answer: 'Ya. Memancing dengan SUP semakin populer karena posisi berdiri memberikan visibilitas sangat baik ke dalam air. Pilihlah papan dengan panjang minimal 11 kaki dan lebar 33–34 inci untuk stabilitas. Tambahkan milk crate dengan tempat joran yang diikat ke bungee dek, jangkar kecil, dan selalu kenakan PFD. afarer SUP Explorer 11 cocok untuk memancing santai.'

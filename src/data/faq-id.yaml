- id: sup-learning
  question: 'Apakah SUP sulit dipelajari?'
  answer: 'Tidak sama sekali. Sebagian besar pemula dapat berdiri dan mengayuh dalam sesi pertama mereka. Seri SUP All-Around kami dilengkapi platform ekstra lebar yang stabil, dirancang khusus untuk pendayung pertama kali. Mulailah di air yang tenang dan Anda akan dapat melaju dalam beberapa menit.'
  category: general
  relatedProducts:

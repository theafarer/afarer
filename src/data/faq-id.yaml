- id: sup-skill-progression
  question: 'Bagaimana tahapan kemampuan SUP yang umum dari pemula hingga lanjutan?'
  answer: 'Pemula (sesi 1-3): berdiri, kayuan maju dasar, berbelok, jatuh dengan aman. Menengah (sesi 5-15): teknik kayuan yang efisien, pivot turn, menghadapi ombak, keterampilan penyelamatan dasar. Lanjutan (20+ sesi): start balapan, belokan buoy, berselancar ombak kecil, downwind paddling. Profesional: balapan kompetitif, surf SUP, touring jarak jauh. Papan afarer mendukung setiap tahap: Explorer 11 untuk pemula, Ocean Voyager untuk touring, dan Cheetah Surge untuk pendayungan performa.'
  category: general
  relatedProducts:

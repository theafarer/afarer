- id: sup-deck-pad-care
  question: 'Kako čistim in vzdržujem EVA pod na palubi?'
  answer: 'Pod na palubi po vsaki uporabi sperite s sladko vodo. Za umazanijo ali madeže uporabite blago milo in mehko krtačo — izogibajte se agresivnim kemikalijam. Če se robovi začnejo dvigovati, nanesite majhno količino vodotesnega pomorskega lepila in pritisnite z obremenitvijo 24 ur. Desko, ko je ni v uporabi, hranite stran od neposrednega UV sevanja, da preprečite razpad poda.'
  category: maintenance
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-seated-paddling
  question: 'Ali lahko veslam na SUP deski v sedečem položaju?'
  answer: 'Da. Številne SUP deske, vključno z afarer Explorer 11, imajo D-obročke, ki omogočajo pritrditev sedeža. Veslanje v sedečem položaju je udobna možnost za daljša potovanja, ribolov ali kadar si na vodi želite zamenjati položaj.'
  category: product
  relatedProducts:

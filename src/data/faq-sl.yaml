- id: sup-weight-capacity
  question: 'Koliko teže zmore napihljiva SUP deska?'
  answer: 'Nosilnost je odvisna od prostornine deske. Deske afarer: SUP Explorer 11 (260 L, do 100 kg / 220 lbs), Ocean Voyager 12 (310 L, do 140 kg / 308 lbs), Leviathan Wake (350 L, do 180 kg / 396 lbs). Za optimalne zmogljivosti naj bo skupna obremenitev (veslač + oprema) v okviru 80 odstotkov največje nosilnosti. Neobremenjena deska plava višje in bolje drži smer, zlasti v valovju.'

- id: drop-stitch-technology
  question: 'Kaj je tehnologija drop-stitch jedra in zakaj je pomembna?'
  answer: 'Tehnologija drop-stitch jedra uporablja na tisoče poliestrskih niti, ki povezujejo zgornjo in spodnjo plast PVC deske. Pri napihovanju na 15–20 PSI te niti ustvarijo togo, torziji odporno strukturo, ki deluje kot trda deska. afarer pri vseh ravneh SUP izdelkov uporablja trislojni PVC v vojaški kvaliteti z drop-stitch laminacijo in nudi togost, primerljivo z epoksi deskami, ob ohranjanju prenosljivosti napihljive deske.'
  category: product

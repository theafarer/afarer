- id: sup-volume-weight
  question: 'Kako izberem prostornino SUP glede na svojo težo?'
  answer: 'Za priporočeno prostornino, prijazno začetnikom, pomnožite svojo težo v kg z 2,2. Na primer: veslač s 75 kg potrebuje vsaj 165 litrov, za učenje pa je 220–260 litrov precej bolj stabilno. SUP Explorer 11 ponuja 260 litrov in je primeren za veslače do 100 kg.'
  category: product

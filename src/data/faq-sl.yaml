  relatedGuides: []
- id: saltwater-rinse
  question: 'Ali moram svojo napihljivo desko po uporabi v oceanu sprati?'
  answer: 'Da — po uporabi v slani vodi vedno sperite desko, plavuti, črpalko in veslo s sladko vodo. Solni kristali se zabadajo v šive in ventile ter povzročajo mikropuščanje in korozijo. Desko pred izpustitvijo zraka in shranjevanjem posušite v senci. Redno izpiranje bistveno podaljša življenjsko dobo vaše napihljive deske.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-sup-maintenance
- id: sup-leash-necessity
  question: 'Ali res potrebujem varovalno vrvico za SUP?'
  answer: 'Da — vedno nosite varovalno vrvico. Spiralna SUP vrvica (coil leash) se pritrdi na gleženj ali meč in ob padcu ohrani desko ob vas. Na odprtem morju vam lahko vrvica reši življenje, saj preprečuje ločitev od plovnega sredstva. Za veslanje po rekah uporabite vrvico z bitnim odklopom, da preprečite ujetje.'
  category: safety

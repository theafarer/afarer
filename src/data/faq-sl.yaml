- id: airline-travel-sup
  question: 'Kakšna so pravila letalskih prevoznikov za potovanje z napihljivim SUP-jem?'
  answer: 'Večina letalskih prevoznikov sprejema SUP nahrbtnike kot oddano prtljago, če je teža pod 23–32 kg. Nahrbtnik afarer meri približno 90x40x30 cm in tehta napolnjen približno 15 kg. Nekateri prevozniki lahko zaračunajo pristojbino za preveliko prtljago. Prispite zgodaj, plavuti in črpalko zavijte ločeno v ročno prtljago in torbo označite kot lomljivo. Pred poletom vedno preverite pravila svojega prevoznika o športni opremi.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - sup-travel-guide
- id: cold-weather-safety
  question: 'Kakšno varnostno opremo potrebujem za veslanje v hladni vodi?'
  answer: 'Voda pod 15°C zahteva toplotno zaščito. Za 8–14°C uporabite mokro ali suho obleko s čevlji, rokavicami in kapuco. Za 14–20°C zadostuje mokra obleka debeline 3/2 mm. Za toplotno zaščito in varnost vedno nosite ustrezno prilegajoč rešilni jopič. Preverite lokalne predpise o obvezni opremi.'
  category: product
  relatedProducts:
    - life-vest-pro
  relatedGuides:
    - sup-safety-guide
- id: oem-odm-details
  question: 'Kakšne so minimalne količine naročila za OEM/ODM?'
  answer: 'Minimalne količine naročila (MOQ) se razlikujejo glede na vrsto izdelka in kompleksnost. Prilagoditev blagovne znamke na obstoječih modelih običajno zahteva 5–10 kosov. Popolnoma oblikovani trupi po meri zahtevajo višje MOQ. S svojimi zahtevami se za podrobno ponudbo obrnite na našo prodajno ekipo. Poskrbimo za vse — od barv in logotipov po meri do povsem originalnih oblik kalupov.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-custom-branding
  question: 'Ali lahko na izdelke afarer dodam svoj logotip?'
  answer: 'Da. Naša storitev OEM vključuje postavitev logotipa po meri, barvne sheme po meri in embalažo po meri. Odvisno od vrste izdelka ponujamo tamponsko tiskanje, termični preslik in vezenje. Za ponudbo in oceno roka izdelave pošljite svojo grafiko in specifikacije naši prodajni ekipi.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: sup-inflate-pressure
  question: 'Na koliko PSI naj napihnem svoj SUP?'
  answer: 'Za najboljše zmogljivosti napihnite desko na njeno največjo ocenjeno vrednost PSI — običajno 15–18 PSI za kakovostne napihljive SUP deske. afarer SUP Explorer 11 deluje najbolje pri 15–18 PSI. Premajhno napihovanje povzroči, da je deska mehka in slabo drži smer. Prekomerno napihovanje prek ocenjenega maksimuma lahko poškoduje drop-stitch niti. Specifično vrednost za vašo desko preverite na nalepki blizu ventila.'
  category: product

- id: sup-skill-progression
  question: 'Kakšen je običajni napredek SUP znanja od začetnika do naprednega veslača?'
  answer: 'Začetnik (1.–3. ura): vstajanje, osnovni zavesljaj naprej, obračanje, varno padanje. Srednja stopnja (5.–15. ura): učinkovita tehnika zavesljaja, pivot zavoji, navigacija v valovju, osnovne reševalne veščine. Napredni (20+ ur): tekmovalni štarti, zavoji okoli boj, surfanje majhnih valov, veslanje z vetrom v hrbet. Profesionalec: tekmovalno veslanje, surf SUP, dolge turistične poti. Deske afarer podpirajo vsako stopnjo: Explorer 11 za začetnike, Ocean Voyager za turizem in Cheetah Surge za športno veslanje.'
  category: general

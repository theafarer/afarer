- id: b2b-moq
  question: 'Kakšna je minimalna količina naročila za proizvodnjo SUP v okviru OEM/ODM?'
  answer: 'Minimalne količine naročila (MOQ) se razlikujejo glede na vrsto izdelka. Prilagoditev znamke obstoječega modela: 50 kosov na SKU. Razvoj kalupa za obliko po meri: 200–500 kosov na model (prvo naročilo). Programi skupne rabe kalupov so na voljo od 50 kosov. Dodatki in rešilni jopiči: 500–1000 kosov na obliko. Za natančen MOQ in cene se z načrtovano količino obrnite na našo ekipo OEM.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-lead-time
  question: 'Kakšni so običajni roki dobave za naročila OEM SUP?'
  answer: 'Prva naročila OEM s prilagoditvijo znamke na obstoječih kalupih: 6–8 tednov od pologa do FOB Qingdao. Naročila z obliko po meri, ki zahtevajo nove kalupe: 12–20 tednov (vključno z 3D oblikovanjem, izdelavo kalupov, prototipi in serijsko proizvodnjo). Ponavljajoča naročila z odobrenimi specifikacijami: 6–8 tednov. Nujna naročila je mogoče pri obstoječih kalupih skrajšati na 4–5 tednov. Roki vključujejo nabavo surovin, proizvodnjo, kontrolo med proizvodnjo in nalaganje v kontejner.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-certification
  question: 'Katera potrdila nosijo izdelki afarer OEM?'
  answer: 'Vsi izdelki afarer OEM/ODM nosijo: izjavo CE o skladnosti (trg EU), UKCA (trg Združenega kraljestva), sistem upravljanja kakovosti ISO 9001:2015, revizijo socialne skladnosti BSCI, skladnost materialov REACH in RoHS ter klasifikacijo EN ISO 25649 za napihljive SUP deske. Dodatna potrdila so na voljo na zahtevo: dokumentacija o skladnosti z zahtevami ameriške obalne straže (US Coast Guard), preskušanje po vojaških standardih (MIL-STD-810) in podpora pri certifikaciji uvoza za državo destinacije.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-samples
  question: 'Ali lahko naročim vzorce, preden se zavežem k serijski proizvodnji?'
  answer: 'Da. Vzorčna naročila so na voljo za vse projekte OEM/ODM. Predproizvodni vzorci (PPS) se izdelajo po izdelavi kalupa in pred serijsko proizvodnjo. Rok izdelave vzorcev: 15–25 delovnih dni za obstoječe kalupe, 25–40 delovnih dni za kalupe po meri. Stroški vzorcev se odbijejo od prvega serijskega naročila. Vzorci se pošiljajo s kurirjem (DHL, FedEx, UPS) s popolnim sledenjem in običajno prispejo v 3–5 delovnih dneh.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-payment
  question: 'Kakšni plačilni pogoji so na voljo za naročila OEM?'
  answer: 'Standardni plačilni pogoji: 30-odstotna akontacija ob podpisanem PI (predračunu), 70-odstotno plačilo pred odpošiljanjem proti kopiji B/L (nakladalnega lista). Za prvič sodelujoče partnerje: 50-odstotna akontacija, 50 odstotkov pred odpošiljanjem. Za uveljavljene partnerje z zgodovino naročil: L/C po vpogledu ali 30 dni neto za račune, ki izpolnjujejo pogoje (odvisno od kreditne preverbe). Načini plačila: bančno nakazilo T/T, L/C (akreditiv), Western Union. Vsa plačila v USD ali EUR.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-ip-protection
  question: 'Kako znamka afarer ščiti mojo intelektualno lastnino in oblike?'
  answer: 'Zaščita intelektualne lastnine je osrednji del naše storitve OEM. Sporazum o zaupnosti (NDA) podpišemo pred vsakim pogovorom o oblikovanju. Z oblikovnimi datotekami ravnamo na izoliranih delovnih postajah z beleženjem dostopov. Vsa orodja in kalupi ostanejo vaša izključna lastnina (plača jih kupec). Vaših kalupov ali oblik ne bomo uporabljali za druge stranke. Hramba in vzdrževanje kalupov sta za aktivne račune vključena. Ob prekinitvi sporazuma se kalupi bodisi pošljejo k vam bodisi uničijo z video dokumentacijo. Spoštujemo vse pravice blagovnih znamk in patentov.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-shipping
  question: 'Katere možnosti prevoza in logistike so na voljo?'
  answer: 'FOB Qingdao (standardno): tovor se naloži v pristanišču Qingdao; prevoz od tam uredite vi. CIF (imenovano pristanišče): prevoz do vašega ciljnega pristanišča uredimo in zavarujemo mi. DDP / od vrat do vrat: celovita logistika, vključno z carinsko oprostitvijo in končno dostavo. Pomorski prevoz do zahodne obale ZDA: približno 25–30 dni. Pomorski prevoz do EU (Hamburg/Rotterdam): približno 30–35 dni. Letalski prevoz je na voljo za nujna naročila (3–5 dni). Uredimo vso izvozno carinsko dokumentacijo, certifikate o izvoru in pakirne liste.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-quality-control
  question: 'Kateri procesi nadzora kakovosti veljajo za naročila OEM?'
  answer: 'Vsako naročilo OEM sledi dokumentiranemu načrtu kontrole kakovosti: 1) Vhodna kontrola materialov — preizkušanje serij PVC tkanine na debelino, natezno trdnost in UV odpornost. 2) Kontrola med proizvodnjo — preizkušanje trdnosti varjenih šivov vsakih 50 kosov, preizkus zadrževanja tlaka pri 1,25-kratnem ocenjenem PSI. 3) Končna kontrola — 100-odstotni vizualni pregled in preizkus tlaka vsake deske. 4) Vzorčenje AQL — vzorčenje serij po ISO 2859 z ničelno sprejemljivostjo kritičnih napak. 5) Inšpekcija tretje osebe — SGS, Bureau Veritas ali Intertek na stroške kupca.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-custom-packaging
  question: 'Ali lahko ustvarite embalažo po meri za mojo znamko?'
  answer: 'Da. Ponujamo celovite storitve embalaže po meri: prodajne škatle s celobarvnim CMYK tiskom in grafiko znamke, nosilne torbe s sitotiskanimi ali vezanimi logotipi, navodila za uporabo v vašem jeziku, obešalne etikete ter črtne kode in etikete UPC ter notranjo embalažo (polietilenske vrečke, penaste vložke). Minimalne količine embalaže: 500–1000 kosov za škatle po meri, 200–500 za nosilne torbe. Storitev oblikovanja embalaže je vključena v naročila OEM.'
  category: b2b
  relatedProducts: []
  relatedGuides: []
- id: b2b-factory-audit
  question: 'Ali lahko obiščem tovarno ali uredim revizijo tretje osebe?'
  answer: 'Obiski tovarne so po dogovoru dobrodošli. Lastnike znamk gostimo vse leto in lahko uredimo prevzem na mednarodnem letališču Qingdao Jiaodong (TAO). Za kupce, ki ne morejo obiskati, ponujamo: virtualni ogled tovarne prek video klica, koordinacijo revizije tretje osebe s SGS/Bureau Veritas (strošek revizije krije kupec) ter podroben dokumentacijski paket o zmožnostih tovarne, ki vključuje seznam opreme, potek procesa kontrole kakovosti in kvalifikacije osebja.'

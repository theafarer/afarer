- id: fishing-sup-setup
  question: 'Ali lahko ribarim s SUP deske?'
  answer: 'Da. Ribolov s SUP desko je vse bolj priljubljen, saj stoječi položaj nudi odličen vpogled v vodo. Za stabilnost izberite desko, dolgo vsaj 11 čevljev in široko 33–34 palcev. Dodajte škatlo z držali za palice, pritrjeno na elastične vrvice na palubi, majhno sidro in vedno nosite rešilni jopič. afarer SUP Explorer 11 je odlična izbira za sproščen ribolov.'

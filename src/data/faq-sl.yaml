- id: sup-sustainability
  question: 'So napihljive SUP deske okoljsko trajnostne?'
  answer: 'Napihljive SUP deske imajo v več pogledih manjši okoljski odtis kot trde deske: v proizvodnji porabijo manj surovin, njihova nižja teža zmanjšuje emisije pri prevozu, njihova obstojnost pa pomeni manj zamenjav skozi čas. PVC, uporabljen v deskah afarer, je brez svinca in skladen z REACH. Ključne trajnostne prakse: kupite kakovostno desko, ki zdrži 5–10 let, predrta mesta popravite namesto da zamenjate desko, desko ob koncu življenjske dobe reciklirajte prek specializiranih programov recikliranja PVC ter se izogibajte enkratni embalaži z izbiro znamk, ki uporabljajo večkratne nosilne torbe.'

- id: boat-registration
  question: 'Ali moram svojo SUP desko registrirati?'
  answer: 'Zahteve se razlikujejo glede na državo. V večini regij SUP desk brez motorja ni treba registrirati. Če nameravate dodati motor, preverite pravila pri svoji lokalni pomorski upravi. Rekreacijske veslaške deske so praviloma izvzete iz registracije plovil.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: puncture-repair
  question: 'Kako popravim predrto mesto?'
  answer: 'Očistite območje, izrežite krpo z zaobljenimi robovi, nanesite PVC lepilo, močno pritisnite in počakajte 24 ur pred napihovanjem. Deske afarer vključujejo komplet za popravilo. Za podrobna navodila si oglejte naš vodnik za popravilo napihljivih desk.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - inflatable-repair
    - sup-maintenance
- id: storage
  question: 'Kako naj shranim svoj napihljivi SUP?'
  answer: 'Sperite s sladko vodo, popolnoma posušite, izpustite ves zrak, ohlapno zavitajte od premca in shranite v nosilno torbo na hladnem in suhem mestu, stran od neposredne sončne svetlobe. Nikoli ne shranjujte mokre deske ali pri ekstremnih temperaturah.'
  category: maintenance
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: sup-vs-hard
  question: 'Napihljiva ali trda SUP deska?'
  answer: 'Napihljive deske ponujajo prenosljivost, priročno shranjevanje in absorpcijo udarcev. Trde deske nudijo največjo togost in hitrost. Za večino rekreacijskih uporabnikov je kakovostna napihljiva deska z drop-stitch jedrom praktična izbira.'
  category: general
  relatedProducts: []
  relatedGuides:
    - inflatable-vs-hard
    - how-to-choose-your-sup
- id: wind-safety
  question: 'Katera hitrost vetra je prevelika za SUP?'
  answer: 'Začetniki: nad 10 mph (8 vozlov). Srednje vešči: nad 15 mph (13 vozlov). Napredni: nad 20 mph (17 vozlov). Če dvomite, ne hodite na vodo. Veter s kopnega (ki piha s kopnega proti morju) je nevaren pri kateri koli ravni znanja.'
  category: safety
  relatedProducts: []
  relatedGuides:
    - weather-conditions
    - safety-tips
- id: warranty
  question: 'Kakšno garancijo ponuja afarer?'
  answer: 'Vsi izdelki afarer so zajeti z obsežno proizvajalčevo garancijo. SUP deske so zajete z garancijo 2+ leti proti proizvodnim napakam. Garancija pokriva napake v materialih in izdelavi pri normalni uporabi.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: warranty-claim
  question: 'Kako oddam garancijski zahtevek?'
  answer: 'Zahtevek oddate tako, da se s številko naročila, fotografijami težave in kratkim opisom obrnete na našo ekipo za podporo. Večina zahtevkov je pregledanih v 2 delovnih dneh. Odobreni zahtevki prejmejo zamenjavo ali navodila za popravilo v nekaj dneh.'
  category: warranty
  relatedProducts: []
  relatedGuides: []
- id: shipping-info
  question: 'Koliko časa traja dostava?'
  answer: 'Naročila, ki so na zalogi, odpošljemo v 2–4 delovnih dneh. Naročila znotraj ZDA prispejo v 5–10 delovnih dneh. Mednarodna naročila prispejo v 10–15 delovnih dneh, odvisno od destinacije. Nujna naročila je mogoče pospešiti.'
  category: shipping
  relatedProducts: []
  relatedGuides: []
- id: return-policy
  question: 'Kakšna je vaša politika vračil?'
  answer: 'Vračila sprejemamo v 30 dneh od dostave za neuporabljene izdelke v originalni embalaži. Naročila po meri in naročila OEM niso predmet vračila. Za zagon vračila se obrnite na našo ekipo za podporo — za vračilo vam priskrbimo predplačano pošiljno etiketo.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: oem-odm
  question: 'Ali ponujate storitve OEM/ODM?'
  answer: 'Da. Podjetjem ponujamo storitve zasebne znamke in oblikovanja po meri. Od prilagajanja blagovne znamke na obstoječih modelih do popolnoma oblikovanih trupov po meri lahko naša inženirska ekipa razvije izdelke pod vašo znamko. Veljajo minimalne količine naročila.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: paddle-length
  question: 'Kakšno dolžino vesla potrebujem?'
  answer: 'Veslo naj bo za 6–8 palcev višje od vaše višine. Nastavljiva vesla omogočajo fino prilagoditev različnim razmeram. Za podrobna navodila o velikosti si oglejte naš vodnik o veslih.'
  category: product
  relatedProducts: []
  relatedGuides:

- id: sup-choppy-water
  question: 'Kako veslam na SUP deski v valovju ali vetru?'
  answer: 'V valovju: pokrčite kolena, uporabite širši stopalni položaj, skrajšajte zavesljaj in za ravnovesje angažirajte mišice telesnega jedra. Pri vetru v obraz: uporabite nižji kot vesla, delajte krajše zavesljaje in se nagnite naprej. Pri bočnem vetru: veslajte na privetrni strani, da popravljate zanos. Pri vetru v hrbet: surfajte na valovih za hitrost. Začetniki se naj izogibajo vetru, močnejšemu od 10 mph, in za stabilnost izberejo širše ter daljše deske. Turistični SUP afarer Ocean Voyager je zasnovan za zmerno valovje in vetrovne razmere.'

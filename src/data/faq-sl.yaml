- id: sup-learning
  question: 'Ali je SUP težko osvojiti?'
  answer: 'Sploh ne. Večina začetnikov že med prvo uro stoji in vesla. Naša serija vsestranskih SUP des ponuja izjemno široke in stabilne ploščadi, zasnovane posebej za tiste, ki prvič veslajo. Začnite na mirni vodi in v nekaj minutah boste že križarili.'
  category: general
  relatedProducts:
    - sup-explorer-11
  relatedGuides:
    - beginner-guide
- id: ocean-use
  question: 'Ali ga lahko uporabljam v oceanu?'
  answer: 'Da. Deske afarer SUP so zasnovane za uporabo v oceanu, jezerih in rekah. Naša serija Touring obvladuje obalno valovje, vse deske pa so izdelane iz PVC-ja v pomorski kvaliteti, ki je odporen proti koroziji zaradi slane vode. Po uporabi v oceanu desko sperite s sladko vodo.'
  category: general
  relatedProducts: []
  relatedGuides:
    - weather-conditions
- id: inflation-time
  question: 'Koliko časa traja napihovanje?'
  answer: 'S priloženo črpalko z dvojnim delovanjem se večina desk napihne na 12–15 PSI v manj kot 5 minutah. Naša možnost električne črpalke to skrajša na manj kot 2 minuti. Izpustitev zraka in pakiranje trajata približno 3 minute.'
  category: product
  relatedProducts: []
  relatedGuides:
    - sup-maintenance
- id: travel-sup
  question: 'Ali lahko potujem z napihljivim SUP-jem?'
  answer: 'Seveda. Vsako desko afarer lahko spakirate v nosilno torbo v velikosti nahrbtnika, ki izpolnjuje zahteve letalskih prevoznikov za prtljago. S težo le 18–22 lbs jo je enostavno nositi na plažo, do jezera ali skozi letališke terminale.'
  category: general
  relatedProducts: []
  relatedGuides: []
- id: weight-limit
  question: 'Kakšna je omejitev teže?'
  answer: 'Naše vsestranske SUP deske omogočajo obremenitev do 220 lbs. Seriji Touring in Yoga nosita do 250 lbs. Za uporabo v tandemu ali težja bremena se za priporočila obrnite na našo ekipo.'
  category: product
  relatedProducts: []
  relatedGuides:
    - understanding-specs
- id: box-contents
  question: 'Kaj je vsebovano v embalaži?'
  answer: 'Vsak afarer SUP vključuje desko, potovalni nahrbtnik, ročno črpalko z dvojnim delovanjem, odstranljivo plavut, spiralno varovalno vrvico (coil leash) in komplet za popravilo. Nekateri modeli vključujejo tudi možnost nadgradnje s karbonskim veslom.'
  category: product
  relatedProducts: []
  relatedGuides: []
- id: bundle-deals
  question: 'Ali ponujate paketne ponudbe?'
  answer: 'Da. Ponujamo skrbno izbrane pakete, s katerimi prihranite denar v primerjavi z ločenim nakupom posameznih artiklov. Za aktualne paketne promocije in popuste pri večjih količinah se obrnite na našo prodajno ekipo.'
  category: ordering
  relatedProducts: []
  relatedGuides: []
- id: pfd-requirement
  question: 'Ali potrebujem rešilni jopič na SUP deski?'
  answer: 'Da. V številnih državah je rešilni jopič na vodnem plovilu zakonsko obvezen, vključno s SUP deskami. Tudi kjer ni obvezen, je rešilni jopič s CE certifikatom ključna varnostna oprema. Priporočamo, da ga nosite ves čas na vodi.'
  category: safety
  relatedProducts:

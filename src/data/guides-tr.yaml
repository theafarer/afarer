- slug: sup-weight-capacity
  category: buying-guide
  title: SUP Ağırlık Kapasitesi Rehberi — Bir SUP Ne Kadar Ağırlık Taşıyabilir
  description: SUP ağırlık kapasitesi limitlerini, toplam yükünüzü nasıl hesaplayacağınızı ve limiti aşmanın performansı ve güvenliği neden etkilediğini anlamak.
  tldr: Vücut ağırlığınız artı ekipmanla tahtanın maksimum ağırlık kapasitesinin %80'ini asla aşmayın. 220 pound kapasiteli bir tahta, hafif ekipmanlı 160 poundluk bir kürekçi için uygundur. Limiti aşmak, dalga üstü zıplamaya, hantal kullanıma ve hasar riskinde artışa neden olur.
  problem: Kürekçiler genellikle tahtalarının ağırlık kapasitesini aşar, bu da kötü performansa, suya batmaya ve olası tahta hasarına yol açar. Üreticiler maksimum limitleri listeler ama güvenli çalışma yüklerini açıklamaz.
  solution: Toplam yükünüzü hesaplayın (vücut ağırlığı + ekipman + tahtanın emdiği su) ve belirtilen maksimum kapasitenin %80'inin altında kalın. Daha ağır kürekçiler, 300+ pound kapasiteli daha yüksek hacimli tahtalara ihtiyaç duyar.
  audience: Her boyuttaki kürekçiler, özellikle daha büyük kürekçiler ve sefer ekipmanı taşıyanlar.
  steps:
    - Tahtanızda yazılı maksimum ağırlık kapasitesini bulun (genellikle valfe yakın)
    - Küreği, can yeleğini, kuru torbaları, soğutucuyu ve aksesuarları dahil kendinizi ve tüm ekipmanı tartın
    - Hesaplayın — (toplam yükünüz) ÷ (maksimum kapasite) × 100 = kullanılan kapasite yüzdesi
    - Optimal performans ve güvenlik için %70-80 hedefleyin
    - "%80'i aşarsanız daha büyük bir tahta seçin veya ekipmanı azaltın"
  faq:
    - q: Ağırlık limitini aşarsam ne olur?
      a: Tahta daha alçak sürer ve daha fazla sürüklenme yaratır. Stabilite düşer, burun suya girebilir ve drop-stitch çekirdek, dalgada daha yüksek hasar riski altındadır.
    - q: İki kişi bir SUP'a binebilir mi?
      a: Sadece toplam ağırlık kapasitenin %80'inin altında kalırsa. Çoğu standart SUP tek sürücü için tasarlanmıştır. Tandem sürüş, özellikle iki kişi için derecelendirilmiş bir tahta gerektirir.
    - q: Şişme SUP'ların kapasitesi sert tahtalardan düşük mü?
      a: Drop-stitch yapılı kaliteli şişmeler, daha kalın hacim dağılımı sayesinde sert tahtalarla karşılaştırılabilir veya daha yüksek ağırlık kapasitesine sahiptir.

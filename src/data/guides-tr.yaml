  tldr: SUP'unuzu söndürün, sarın ve sırt çantasına paketleyin. Çoğu havayolu onu kayıtlı bagaj olarak kabul eder (50 pound / 50 lineer inç altında). Pompa ve küreği her zaman aynı çantaya koyun. Görevli çanta boyutunu sorgularsa ek süre için erken gelin. Uzun geziler için önceden kargo göndermeyi düşünün.
  problem: SUP ile seyahat karmaşık görünür — havayolu boyut limitleri, güvenlik kontrolleri ve uzak bir varış noktasında nasıl şiirileceği belirsizlik yaratır.
  solution: afarer SUP sırt çantası, havayolu kayıtlı bagaj limitlerini karşılayacak şekilde tasarlanmıştır. Stratejik paketleyin, bir tamir kiti taşıyın ve yola çıkmadan önce şiirme noktalarını (marinalar, elektrikli kamp alanları) araştırın.
  audience: Havayoluyla, arabayla veya karavanla SUP seyahati planlayan kürekçiler.
  steps:
    - Tahtayı tamamen söndürün ve burundan kuyruğa doğru sarın
    - Sarılmış tahtayı, pompayı, küreği, leash ve fini sırt çantasına paketleyin
    - Havayolu boyut ve ağırlık limitlerini kontrol edin — çoğu 62 lineer inç ve 50 pounda izin verir
    - Erken gelin ve çantanın elle kontrol edilmesine hazır olun
    - Tahta taşıma sırasında hasar görürse diye el bagajınıza bir tamir kiti koyun
    - Şişirme seçeneklerini araştırın — elektrikli pompalar için kamp alanı elektrik bağlantıları, marina hava istasyonları

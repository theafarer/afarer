  problem: Standart SUP'ların ağırlık kapasitesi 200-250 pounddur ve bu birçok kürekçiyi dışlar. Küçük bir tahtada sürüş rahatsız, kararsız ve potansiyel olarak tehlikelidir.
  solution: Stabilite için ekstra genişlikli, 300+ pound dereceli tahtalar seçin. afarer'in Tropical Breeze ve Leviathan Wake serileri, büyük kürekçilerin ihtiyaç duyduğu hacmi ve takviyeyi sunar.
  audience: Kilosunu güvenle taşıyan bir tahtaya ihtiyaç duyan 200 pound üzeri kürekçiler.
  steps:
    - Toplam yükü hesaplayın — vücut ağırlığı + ekipman + %20 güvenlik marjı
    - Yeterli stabilite için 34" veya daha geniş bir tahta seçin
    - Doğru su değiştirmesi için 11'6" veya daha uzun bir boy seçin
    - Ağırlık kapasitesini doğrulayın — toplam yük maksimumun %80'ini aşmamalıdır
    - Takviyeli drop-stitch ve askeri sınıf PVC yapı arayın
    - Stabiliteyi doğrulamak için önce sakin suda tahtayı deneyin
  faq:
    - q: 250 poundluk bir kürekçi için hangi genişlikte SUP en iyisidir?
      a: En az 34" genişlik. Ekstra genişlik, büyük sürücülerin kendilerini güvende hissetmesi için gerekli birincil stabiliteyi sağlar.
    - q: 300 poundluk biri şişme bir SUP kullanabilir mi?
      a: Evet, 350-400 pound dereceli bir tahtayla. 34"+ genişliğindeki Tropical Breeze Island Escape daha yüksek yükleri taşır. Her zaman belirli ağırlık derecesini doğrulayın.
    - q: Daha büyük kürekçiler özel küreklere ihtiyaç duyar mı?
      a: Daha geniş ve kalın bir tahtadaki daha yüksek duruş için daha uzun bir kürek (standarttan 1-2 inç uzun) yardımcı olur. Kol yorgunluğunu azaltmak için karbon sap düşünün.

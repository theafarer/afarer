- slug: multi-day-trip
  category: planning
  title: Çok Günlük SUP Gezisi Planlama
  description: Çok günlük bir kürek gezisini nasıl planlayıp uygulayacağınız — rota planlama, ekipman paketleme, kamp ve güvenlik.
  tldr: Günde 10-15 mil planlayın. Ekipmanı su geçirmez kuru torbalara paketleyin, ağırlığı dengeli dağıtın ve geziden önce tahtanızı yüklemeyi pratik edin. Bir yüzer plan bırakın. Su, yemek, barınak, navigasyon ve iletişim taşıyın.
  problem: Çok günlük geziler, aşırı paketleme, kötü rota planlama veya hava ve akıntıyı hafife alma nedeniyle başarısız olur — yorgunluğa, ekipman arızasına veya güvenlik olaylarına yol açar.
  solution: Sistematik bir planlama yaklaşımı kullanın — rota seçimi, ekipman kontrol listesi, yemek planlama, güvenlik brifingi ve olasılık planlaması.
  audience: İlk çok günlük seferlerini planlayan deneyimli kürekçiler.
  steps:
    - Kamp alanları ve çıkış noktaları olan bir rota seçin
    - Rüzgarı ve akıntıyı hesaba katarak günde 10-15 mil planlayın
    - Gezinin tamamı için gelgit tablolarını ve hava tahminlerini kontrol edin
    - Ekipmanı su geçirmez kuru torbalara paketleyin — toplamda 20-30 pound
    - Ağırlığı dengeli dağıtın — en ağır eşyalar ortaya
    - Kıyıda birine ayrıntılı bir yüzer plan bırakın
    - Navigasyon getirin — kağıt harita, pusula ve GPS yedeği
    - Acil barınak, ekstra yemek ve ilk yardım seti paketleyin
  faq:
    - q: İdeal günlük mesafe nedir?
      a: Deneyimli kürekçiler için günde 10-15 mil. Yeni başlayanlar 5-8 mil planlamalıdır. Hava için her zaman tampon süre ekleyin.
    - q: Ne kadar su taşımalıyım?
      a: Kişi başı günde 1 galon. Sıcak koşullarda 1,5 galon. Dolumlar için su filtresi veya arıtma tabletleri taşıyın.
    - q: En önemli güvenlik eşyası nedir?
      a: İletişim. Bir VHF telsiz veya uydu mesajlaşıcı, bir acil durumda hayat kurtarabilir. Cep telefonları uzak bölgelerde güvenilmezdir.

- slug: sup-size-guide
  category: buying-guide
  title: SUP Boyut Rehberi — Doğru Tahta Boyutları Nasıl Seçilir
  description: Kilo, boy, beceri seviyesi ve kürek stiline göre uzunluk, genişlik ve kalınlık önerilerini içeren eksiksiz SUP boyut rehberi.
  tldr: Yeni başlayanlar stabilite için daha geniş tahtalara (32-34") ihtiyaç duyar. Daha ağır kürekçiler daha yüksek hacimli daha uzun tahtalara (11'+) ihtiyaç duyar. Turizm daha uzun gövde ister (12'+). Yoga ekstra genişlik ister (34"+). Her zaman ağırlık kapasitesini kontrol edin — ağırlığınız artı ekipman, limitin %80'ini aşmamalıdır.
  problem: Yanlış SUP boyutu seçmek, kötü stabiliteye, yavaş rotaya ve sinir bozucu bir kürek deneyimine yol açar. Çoğu ilk kez alıcı, boyutların performansı nasıl etkilediğini düşünmeden iyi görünen bir tahta seçer.
  solution: Tahta uzunluğunu, genişliğini ve kalınlığını kilonuza, beceri seviyenize ve birincil kullanımınıza göre eşleştirin. Boyut hesaplayıcımızı kullanın — kilonuzu ve ekipman ağırlığınızı toplayın, bu toplamın en az %20 üzerinde bir tahta seçin.
  audience: İlk kez SUP alacaklar, özel bir tahtaya yükselten kürekçiler ve boyut konusunda emin olamayan herkes.
  steps:
    - Taşıdığınız tüm ekipmanla (kürek, can yeleği, kuru torba) kendinizi tartın
    - Minimum ağırlık kapasitesini bulmak için %20 güvenlik marjı ekleyin
    - 'Beceriye göre genişlik seçin — yeni başlayanlar için 32-34", orta seviye için 30-32", ileri seviye için 28-30"'
    - 'Kullanıma göre uzunluk seçin — 10''6"-11''6" all-around, 12''-14'' turizm, 9''-10'' akarsu'
    - Kalınlığı doğrulayın — 6" standart, performans için 4", genel kullanım için 5"
    - Optimal sertlik için tahtanızın önerilen PSI aralığını kontrol edin
  faq:
    - q: Yeni başlayanlar için hangi genişlikte SUP en iyisidir?
      a: 32 ila 34 inç genişlik en stabil platformu sağlar. Tahta ne kadar geniş olursa denge kurmak o kadar kolaydır — özellikle daha büyük kürekçiler için.
    - q: Bir SUP'un benim için çok küçük olduğunu nasıl anlarım?
      a: Tahta suda alçak oturuyorsa, hantalse veya kürek çekerken burun kolayca suya batıyorsa, muhtemelen kilonuz için küçüktür.
    - q: Tahta uzunluğu hızı etkiler mi?
      a: "Evet. Daha uzun su hattı, teorik gövde hızını artırır. Aynı kürekçi çabasıyla 14' turizm tahtası, 10' all-around tahtadan belirgin biçimde daha hızlıdır."

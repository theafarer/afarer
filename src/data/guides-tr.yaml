    - q: Havayolu SUP sırt çantamı bagaj olarak kabul eder mi?
      a: Çoğu ABD ve Avrupa havayolu, 50 pound ve 62 lineer inç altındaysa SUP sırt çantalarını standart kayıtlı bagaj olarak kabul eder. Bütçe havayolları aşırı boyut ücreti alabilir.
    - q: SUP'umu el bagajı olarak getirebilir miyim?
      a: Hayır. SUP sırt çantaları tüm havayollarında el bagajı boyutlarını aşar. Çantayı her zaman kayıtlı bagaja verin.
    - q: Uzak bir varış noktasında SUP'umu nasıl şiiririm?
      a: Dahili el pompası, elektrik olmadan her yerde çalışır. Kolaylık için taşınabilir bir elektrikli pompa getirin ve elektrik bağlantılı kamp alanları veya hava istasyonlu marinalar arayın.

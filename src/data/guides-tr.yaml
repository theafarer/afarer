- slug: sup-storage-winter-care
  category: maintenance
  title: SUP Saklama ve Kış Bakımı — Tahtanızın Ömrünü Uzatın
  description: Şişme SUP tahtanızı doğru şekilde saklama, temizleme ve kışa hazırlama. Doğru bakımla küf, UV hasarı ve malzeme bozulmasından kaçının.
  tldr: Her kullanımdan sonra tatlı suyla durulayın. Saklamadan önce tamamen kurutun. Serin ve karanlık bir yerde, doğrudan güneş ışığından ve aşırı sıcaklıklardan uzakta söndürülmüş olarak saklayın. Asla şişik veya sıcak bir arabada saklamayın. Düzenli olarak UV koruyucu uygulayın.
  problem: Yanlış depolama, SUP'larda erken arızanın başlıca nedenidir — ısı veya soğuktan küf, malzeme yozlaşması, ayrışma ve valf hasarı.
  solution: Üç adımlı bir bakım rutini izleyin — her seanstan sonra durulayın, saklamadan önce iyice kurutun ve 10-27°C (50-80°F) aralığında sıcaklık kontrollü bir ortamda söndürülmüş saklayın.
  audience: Tahtasının 5+ yıl dayanmasını isteyen tüm SUP sahipleri.
  steps:
    - Her tuzlu su veya çamurlu su seansından sonra tahtayı, küreği ve pompayı tatlı suyla durulayın
    - Hafif sabun ve yumuşak süngerle temizleyin — asla sert kimyasallar veya basınçlı yıkayıcı kullanmayın
    - Söndürmeden önce tahtayı dışarıda tamamen kurutun (içerideki nemin kaçması için valfi açın)
    - Tamamen söndürün, kalan havayı atmak için burundan kuyruğa doğru sarın
    - Tahtayı içine koymadan önce sırt çantasını silerek kurutun
    - Serin ve karanlık bir dolapta veya yatak altında saklayın — asla doğrudan güneşte, sıcak bir arabada veya donan bir kulübede değil
  faq:
    - q: SUP tahtamı bütün sezon şişik bırakabilir miyim?
      a: Uzun süre kullanılmayacaksa söndürmek daha iyidir. Sürekli PSI gerilimi malzeme yorgunluğunu hızlandırır. 2 haftadan uzun saklanacaksa seanslar arasında söndürün.
    - q: SUP'taki küfü nasıl çıkarırım?
      a: Hafif sabunu ılık su ve biraz beyaz sirkeyle karıştırın. Yumuşak bir fırçayla nazikçe fırçalayın. İyice durulayın ve gölgede kurutun. PVC'ye zarar veren çamaşır suyunu kullanmayın.
    - q: SUP tahtamı garajda saklayabilir miyim?
      a: Sadece garaj yıl boyunca 10-27°C aralığında kalırsa. Çatı katları ve kondisyonsuz garajlar, drop-stitch çekirdeklere zarar veren sıcaklık uçları yaşar.

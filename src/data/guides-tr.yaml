- slug: sup-inflation-psi-guide
  category: technical
  title: SUP Şişirme Rehberi — Performans ve Güvenlik İçin Optimal PSI
  description: SUP şiirme basıncına eksiksiz rehber — önerilen PSI aralıkları, basıncın performansı nasıl etkilediği ve pompanızı doğru kullanma ipuçları.
  tldr: Çoğu şişme SUP için 12-15 PSI'ya şiistirin. Daha yüksek basınç daha fazla sertlik ama daha yavaş şiirme demektir. Daha düşük basınç daha yumuşak his ama daha fazla esneme demektir. Tahtanızda yazılı maksimum PSI'yi asla aşmayın. Doğru basınç göstergeli bir pompa kullanın. Soğuk hava basıncı düşürür, sıcak güneş artırır.
  problem: Yetersiz şiirilmiş tahtalar hantal hisseder ve aşırı esner. Aşırı şiirilmiş tahtalar dikiş kopması riski taşır. Birçok kürekçi, doğru ölçmek yerine PSI'yi tahmin eder.
  solution: Dahili basınç göstergeli bir pompa kullanın. Maksimum sertlik için 15 PSI hedefleyin. Her seanstan önce basıncı kontrol edin — sıcaklık değişimleri PSI'yi belirgin biçimde etkiler.
  audience: Tüm şişme SUP sahipleri.
  steps:
    - Valfe yakın tahtanızda yazılı önerilen PSI aralığını kontrol edin
    - Önerilen aralığın ortasına kadar çift etkili pompayla şiistirin
    - Daha hassas kontrol için son 3-4 PSI için tek etkili moda geçin
    - Basıncı göstergeyle kontrol edin — analog göstergeler dijitallerden daha güvenilirdir
    - Koşullara göre ayarlayın — turizm ve yarış için daha yüksek PSI, akarsu ve kayalık inişler için daha düşük PSI
    - Tahta 10 dakika bekledikten sonra basıncı tekrar kontrol edin — sıcaklık dengesi PSI'yi değiştirir
  faq:
    - q: SUP tahtamı aşırı şiirebilir miyim?
      a: Evet. Nominal maksimum PSI'yi (genellikle 15-18 PSI) aşmak dikişleri ayırabilir ve drop-stitch çekirdeğe zarar verebilir. Her zaman yazılı aralıkta kalın.
    - q: Sıcaklık PSI'yi etkiler mi?
      a: Belirgin biçimde. 70°F'de 15 PSI'ye şiirilen bir tahta, 95°F'de doğrudan güneşte 18 PSI'ye ulaşabilir. Soğuk su basıncı 12 PSI'ye düşürebilir. Çevresel değişimlerden sonra basıncı kontrol edin.
    - q: Yeni başlayanlar için hangi PSI?
      a: Öğrenme için 12-13 PSI, düşmelere karşı daha affedici, hafif daha yumuşak bir platform sağlar. Beceriler geliştikçe 15 PSI'ye çıkarın.

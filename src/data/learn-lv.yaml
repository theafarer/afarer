misc:
  readGuide: Lasīt ceļvedi →
  techDesc: Jūras drošības inženierija un materiālu testēšana
  productsDesc: Izpētiet pilno afarer produktu katalogu
  trustDesc: CE, ISO un BSCI atbilstība
sup:
  title: SUP zināšanas — Piepūšamo SUP ceļveži un resursi | Afarer
  description: Pilnīgs SUP zināšanu centrs, kas aptver iesācēju ceļvežus, dēļu izmērus, tehnikas pamācības, drošības padomus un piepūšamo SUP tehnoloģijas.
  articles:
    - title: SUP pamati — Iesācēju ceļvedis
      desc: Viss, ko jāzina iesācējam — dēļu tipi, aira izmērs, stāja un pirmās dienas padomi.
      href: /learn/sup
    - title: SUP izmēru ceļvedis
      desc: Atrodiet jums piemērotu dēļa garumu, platumu un tilpumu atbilstoši jūsu svaram, prasmēm un airēšanas stilam.
      href: /size-guide
    - title: Piepūšamais vai cietais dēlis
      desc: Kurš der jums? Pārvietojamība, veiktspēja, izturība un izmaksas — salīdzinājumā.
      href: /compare/inflatable-vs-hardboard
    - title: Vidēja līmeņa tehnikas
      desc: Uzlabojiet savu airēšanu ar progresīviem aira vēzieniem, pagriešanās tehnikām un rīcību nemierīgā ūdenī.
      href: /learn/intermediate-techniques
    - title: Kā izvēlēties piepūšamo SUP
      desc: Izprotiet galvenos faktorus — konstrukciju, biezumu, spuru konfigurāciju un komplektā iekļautos piederumus.
      href: /v2/how-to-choose-inflatable-sup
    - title: Drošība uz ūdens
      desc: Būtiskas drošības zināšanas, tostarp laikapstākļu novērtēšana, PFD izvēle, pašglābšanās un airēšana grupā.
      href: /learn/water-safety
water-safety:
  title: Zināšanas par drošību uz ūdens — Drošas airēšanas ceļveži | Afarer
  description: Vispusīgs resurss par drošību uz ūdens SUP, kajaku un laivu braucējiem. Uzziniet par PFD izvēli, laikapstākļu novērtēšanu, pašglābšanos, drošību aukstā ūdenī un CE sertifikāciju.
  articles:
    - title: Drošības uz ūdens ceļvedis
      desc: Būtiskas drošības zināšanas katram airētājam — laikapstākļi, PFD, pašglābšanās un airēšanas grupā protokoli.
      href: /learn/water-safety
    - title: Glābšanas vestes un PFD ceļvedis
      desc: Kā izvēlēties pareizo personīgo peldlīdzekli SUP, kajaku airēšanai, laivošanai un profesionālai lietošanai.
      href: /v2/life-jacket-buying-guide
    - title: SUP drošības kontrolsaraksts
      desc: Drošības kontrolsaraksts pirms izbraukšanas, ko katram SUP dēļu airētājam jāievēro pirms došanās ūdenī.
      href: /v2/sup-safety-guide
    - title: Drošība airēšanā aukstā ūdenī
      desc: Būtiski piesardzības pasākumi, aprīkojums un tehnikas airēšanai aukstā ūdens apstākļos.
      href: /v2/cold-water-safety-guide
    - title: Iesācēju airēšanas kļūdas
      desc: Biežākās kļūdas, ko pieļauj pirmo reizi airējošie, un kā no tām izvairīties drošākai un patīkamākai pieredzei.
      href: /v2/beginner-sup-guide
    - title: CE sertifikācija izskaidrota
      desc: Ko CE sertifikācija nozīmē piepūšamajiem SUP dēļiem — standarti, testēšana un kāpēc tas ir svarīgi drošībai.
      href: /trust
sup-basics:
  title: SUP pamati — Iesācēja ceļvedis airēšanā ar SUP dēli
  description: Viss, kas jāzina, lai sāktu airēt ar SUP dēli. Aprīkojuma ceļveži, padomi par izmēru izvēli, drošības ieteikumi un iesācēju tehnikas no afarer zināšanu centra.
  articles: []
drop-stitch-core:
  title: Drop-stitch kodola tehnoloģija — Kā piepūšamie SUP iegūst stingrību
  description: 'Padziļināts ieskats drop-stitch konstrukcijas tehnoloģijā: kā tūkstošiem poliestera diegu rada stingras piepūšamas platformas pie 15-25 PSI. Diegu blīvums, auduma integrācija, ražošanas process un veiktspējas salīdzinājumi.'
  articles: []
inflatable-technology:
  title: Piepūšamo SUP tehnoloģija — Materiāli, konstrukcija un inženierija
  description: Kā tiek būvēti piepūšamie SUP dēļi — materiālu slāņošana, drop-stitch kodoli, vārstu sistēmas, RF metināšana un kvalitātes testēšana. Izprotiet, kas padara piepūšamo dēli izturīgu un augstas veiktspējas.
  articles: []
intermediate-techniques:
  title: Vidēja līmeņa SUP un kajaku tehnikas — Aiz pamatiem
  description: Paaugstiniet savas airēšanas prasmes ar progresīviem aira vēzieniem, rīcību nemierīgos ūdeņos, vēja pārvaldību, pašglābšanās tehnikām un etiķeti airējot grupā. Airētājiem, kas gatavi pārsniegt iesācēja prasmes.
  articles: []
materials:
  title: Piepūšamo SUP materiāli — PVC, EVA un drop-stitch audums
  description: 'Vispusīgs ceļvedis par materiāliem, ko izmanto piepūšamo SUP ražošanā: militārās klases PVC, EVA putu klāji, drop-stitch audums, oglekļa šķiedra un alumīnija sakausējumi. Specifikācijas, lietojumi un izvēles kritēriji.'
  articles: []
safety-in-water-sports:
  title: Drošība ūdens sportā — Būtiskas zināšanas airētājiem
  description: Būtiskas drošības zināšanas katram airētājam — laikapstākļu novērtēšana, PFD izvēle, pašglābšanās un airēšanas grupā protokoli.
  articles: []
sup-size-guide:
  title: SUP izmēru ceļvedis — Kā izvēlēties pareizo dēļa garumu, platumu un tilpumu
  description: Vispusīgs SUP izmēru ceļvedis, kas aptver dēļa garumu, platumu, biezumu, tilpumu (litros) un atbilstību braucēja svaram. Atrodiet piemēroto piepūšamā SUP izmēru savam svaram, prasmju līmenim un airēšanas veidam.
  articles: []

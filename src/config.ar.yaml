site:
  name: أكوافارر
  site: 'https://afarer.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Afarer —أكوافارر
    template: '%s —أكوافارر'
  description: 'Afarer is a premium global water adventure equipment brand designing commercial-grade SUPs and marine safety accessories. CE-certified since 2012.'
  keywords:
    - Afarer
    - SUP
    - paddleboard
    - inflatable SUP
    - stand up paddle board
    - drop stitch SUP
    - water adventure accessories
  author: Afarer
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Afarer
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: ar_AR
  twitter:
    handle: '@Afarer'
    site: '@Afarer'
    cardType: summary_large_image

i18n:
  language: ar
  textDirection: rtl

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
        follow: true
  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'


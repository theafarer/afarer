site:
  name: Afarer
  site: 'https://afarer.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Afarer — Premium SUP deske in oprema za vodne avanture
    template: '%s — Afarer'
  description: 'Premium SUPs, paddle boards, and water adventure accessories. Commercial-grade inflatable SUP boards, life vests, pumps, and paddles for every adventure.'
  keywords:
    - Afarer
    - SUP
    - paddleboard
    - inflatable SUP
    - drop stitch SUP
    - stand up paddle board
    - marine accessories
  author: Afarer
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Afarer
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: sl_SI
  twitter:
    handle: '@afarer'
    site: '@afarer'
    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

analytics:
  vendors:
    googleAnalytics:
      id: null


site:
  name: Afarer
  site: 'https://afarer.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Afarer | Premium Inflatable SUP Boards & SUP Manufacturer
    template: '%s —Afarer'
  description: 'Discover Afarer premium inflatable SUP boards designed for adventure, touring and family paddling. Professional SUP manufacturer offering OEM and private label solutions worldwide.'
  keywords:
    - Afarer
    - SUP brand
    - water adventure equipment
    - paddle board manufacturer
    - SUP boards for beginners
    - marine safety gear
    - drop stitch SUP
    - commercial SUP
    - CE certified watercraft
  author: Afarer
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Afarer
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: en_US
  twitter:
    handle: '@afarer'
    site: '@afarer'
    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

analytics:
  vendors:
    googleAnalytics:
      id: null

siteSettings:
  siteName: Afarer
  siteTagline: 'Water Adventure Equipment Brand —Inflatable SUP, Boats & Marine Gear'
  siteDescription: 'Afarer is a global water adventure equipment brand designing reliable inflatable SUPs, boats, kayaks, and marine safety gear. CE-certified and trusted by beginners, families, explorers and professionals in 40+ countries since 2012.'
  organization:
    name: Afarer
    logo: ''
    contactEmail: info@afarer.com
    contactPhone: '+1 (213) 557-7888'
    address: 'Economic Development Zone, Laixi, Qingdao, China, 266600'
  socialLinks:
    - platform: linkedin
      url: 'https://www.linkedin.com/company/afarer'
      icon: tabler:brand-linkedin
    - platform: youtube
      url: 'https://www.youtube.com/@Afarer'
      icon: tabler:brand-youtube
    - platform: x
      url: 'https://x.com/afarer'
      icon: tabler:brand-x
    - platform: instagram
      url: 'https://www.instagram.com/afarer'
      icon: tabler:brand-instagram
    - platform: facebook
      url: 'https://www.facebook.com/afarer'
      icon: tabler:brand-facebook
    - platform: rss
      url: /rss.xml

ui:
  theme: 'system'

branding:
  site_name: 'Afarer'
  logo_image: ''
  logo_alt: 'Afarer logo'
  copyright: '© {year} {site_name} (Qingdao Vatrad Group). All Rights Reserved.'

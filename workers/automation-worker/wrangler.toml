name = "afarer-automation"
main = "src/index.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "afarer.com/api/automation/*", zone_name = "afarer.com" },
]

[triggers]
crons = ["0 2 * * *"]

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "afarer-data"

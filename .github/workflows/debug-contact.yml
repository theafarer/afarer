name: Debug Contact Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail-and-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Tail worker logs and send probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nohup npx wrangler tail -c workers/contact-worker/wrangler.toml --format pretty > tail.log 2>&1 &
          echo $! > tail.pid
          sleep 20
          echo '--- probe request:'
          curl -sS -X POST https://afarer.com/api/contact \
            -H 'Content-Type: application/json' \
            -d '{"firstName":"Debug","lastName":"Tail","email":"debug-tail@afarer.com","subject":"debug tail probe","message":"probe message to capture worker logs in debug workflow"}' || true
          echo ''
          sleep 12
          kill "$(cat tail.pid)" 2>/dev/null || true
          sleep 2
          echo '--- tail log:'
          cat tail.log

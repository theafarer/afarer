name: Diagnose inquiry pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diag-inquiry.yml]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured; diagnostics skipped."
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: steps.guard.outputs.enabled == 'true'
        name: Probe /api/contact routing
        run: |
          HTTP_CODE=$(curl -s -o /tmp/probe.json -w "%{http_code}" -X POST "https://afarer.com/api/contact" \
            -H "Content-Type: application/json" --data '{"email_confirm":"ci-probe@example.com"}')
          echo "HTTP $HTTP_CODE" > /tmp/probe.txt
          cat /tmp/probe.json >> /tmp/probe.txt
          cat /tmp/probe.txt
      - if: steps.guard.outputs.enabled == 'true'
        name: Inspect live contact worker settings (bindings)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/settings.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/afarer-contact/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "HTTP $HTTP_CODE" | tee /tmp/settings-meta.txt
          cat /tmp/settings.json
      - if: steps.guard.outputs.enabled == 'true'
        name: Resolve D1 database id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/d1.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: D1 list API returned HTTP $HTTP_CODE"
            cat /tmp/d1.json
            exit 1
          fi
          ID=$(jq -r '.result[]? | select(.name == "afarer-inquiries") | .uuid' /tmp/d1.json | head -n 1)
          if [ -z "$ID" ]; then
            echo "ERROR: D1 database afarer-inquiries not found"
            exit 1
          fi
          echo "Resolved D1 database afarer-inquiries: $ID"
          sed -i "s/__D1_DATABASE_ID__/$ID/" workers/contact-worker/wrangler.toml
      - if: steps.guard.outputs.enabled == 'true'
        name: Capture live worker logs (8 min window - submit the form NOW)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Tailing afarer-contact for 60s (verification pass)."
          timeout 60 npx --yes wrangler@4 tail afarer-contact -c workers/contact-worker/wrangler.toml --format json > /tmp/tail.log 2>&1 || true
          echo '--- tail output ---'
          cat /tmp/tail.log
      - if: steps.guard.outputs.enabled == 'true'
        name: List contact worker secrets (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 secret list -c workers/contact-worker/wrangler.toml > /tmp/secrets.txt 2>&1 || true
          cat /tmp/secrets.txt
      - if: steps.guard.outputs.enabled == 'true'
        name: Query recent D1 inquiries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute afarer-inquiries --remote -c workers/contact-worker/wrangler.toml --json \
            --command "SELECT id, substr(email,1,3) || '***' AS email_masked, email_status, retry_count, last_error, substr(message,1,40) AS message_head, created_at, updated_at FROM inquiries ORDER BY created_at DESC LIMIT 10" \
            > /tmp/inquiries.json 2>&1 || true
          cat /tmp/inquiries.json
      - if: always()
        name: Publish diagnostics to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo '# Inquiry pipeline diagnostics'
            echo "Generated: $(date -u +%FT%TZ)"
            echo ''
            echo '## Probe /api/contact routing'
            echo '```'
            cat /tmp/probe.txt 2>/dev/null || echo '(missing)'
            echo '```'
            echo ''
            echo '## Live worker settings/bindings'
            echo '```json'
            cat /tmp/settings.json 2>/dev/null || echo '(missing)'
            echo '```'
            echo ''
            echo '## Live worker tail (8 min window)'
            echo '```'
            cat /tmp/tail.log 2>/dev/null || echo '(missing)'
            echo '```'
            echo ''
            echo '## Worker secrets (names only)'
            echo '```'
            cat /tmp/secrets.txt 2>/dev/null || echo '(missing)'
            echo '```'
            echo ''
            echo '## Recent D1 inquiries'
            echo '```json'
            cat /tmp/inquiries.json 2>/dev/null || echo '(missing)'
            echo '```'
          } > inquiry-diagnostics.md
          HTTP_CODE=$(curl -s -o /tmp/r2put.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/afarer-assets/objects/diag%2Finquiry-diagnostics.md" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: text/markdown" \
            --data-binary @inquiry-diagnostics.md)
          echo "R2 PUT HTTP $HTTP_CODE"
          cat /tmp/r2put.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: R2 publish failed"
            exit 1
          fi

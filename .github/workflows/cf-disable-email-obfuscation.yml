name: Disable Cloudflare email obfuscation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cf-disable-email-obfuscation.yml]

permissions:
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured; skipped."
          fi
      - if: steps.guard.outputs.enabled == 'true'
        name: Resolve zone id for afarer.com
        id: zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/zones.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/zones?name=afarer.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "zones list HTTP $HTTP_CODE"
          cat /tmp/zones.json
          ZONE_ID=$(jq -r '.result[0].id // empty' /tmp/zones.json)
          if [ -z "$ZONE_ID" ]; then
            echo "ERROR: could not resolve zone id (token may lack Zone:Read permission)"
            exit 1
          fi
          echo "Resolved zone: $ZONE_ID"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.enabled == 'true'
        name: Read current email_obfuscation setting
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/before.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/settings/email_obfuscation" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "before HTTP $HTTP_CODE"
          cat /tmp/before.json
      - if: steps.guard.outputs.enabled == 'true'
        name: Disable email obfuscation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/patch.json -w "%{http_code}" -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/settings/email_obfuscation" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"value":"off"}')
          echo "patch HTTP $HTTP_CODE"
          cat /tmp/patch.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: PATCH failed (token may lack Zone Settings:Edit permission)"
            exit 1
          fi
      - if: steps.guard.outputs.enabled == 'true'
        name: Verify setting after patch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/after.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/settings/email_obfuscation" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "after HTTP $HTTP_CODE"
          cat /tmp/after.json
          VALUE=$(jq -r '.result.value // empty' /tmp/after.json)
          if [ "$VALUE" != "off" ]; then
            echo "ERROR: email_obfuscation is still '$VALUE'"
            exit 1
          fi
          echo "OK: email obfuscation is now OFF for afarer.com"
      - name: Publish result to R2
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo '# CF email obfuscation disable result'
            echo "Generated: $(date -u +%FT%TZ)"
            echo ''
            echo '## Zones lookup'
            echo '```json'
            cat /tmp/zones.json 2>/dev/null || echo '(missing)'
            echo '```'
            echo ''
            echo '## Setting before'
            echo '```json'
            cat /tmp/before.json 2>/dev/null || echo '(missing)'
            echo '```'
            echo ''
            echo '## Patch response'
            echo '```json'
            cat /tmp/patch.json 2>/dev/null || echo '(missing)'
            echo '```'
            echo ''
            echo '## Setting after'
            echo '```json'
            cat /tmp/after.json 2>/dev/null || echo '(missing)'
            echo '```'
          } > cf-email-obfuscation.md
          HTTP_CODE=$(curl -s -o /tmp/r2put.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/afarer-assets/objects/diag%2Fcf-email-obfuscation.md" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: text/markdown" \
            --data-binary @cf-email-obfuscation.md)
          echo "R2 PUT HTTP $HTTP_CODE"
          cat /tmp/r2put.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: R2 publish failed"
            exit 1
          fi

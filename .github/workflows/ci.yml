name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PDF optimizer
        run: |
          for i in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y --fix-missing ghostscript; then
              echo "ghostscript installed on attempt $i"
              exit 0
            fi
            echo "apt attempt $i/5 failed; retrying in 60s"
            sleep 60
          done
          echo "ERROR: ghostscript install failed after 5 attempts"
          exit 1
      - run: npm run generate
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=12288
      - run: npm test
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=12288
      - run: npm run check:bundle

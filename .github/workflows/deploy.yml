name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured; deployment skipped."
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.guard.outputs.enabled == 'true'
        run: npm ci
      - if: steps.guard.outputs.enabled == 'true'
        name: Install PDF optimizer
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - if: steps.guard.outputs.enabled == 'true'
        run: npm run generate
      - if: steps.guard.outputs.enabled == 'true'
        run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - if: steps.guard.outputs.enabled == 'true'
        run: npm test
      - if: steps.guard.outputs.enabled == 'true'
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - if: steps.guard.outputs.enabled == 'true'
        run: npm run check:bundle
      - if: steps.guard.outputs.enabled == 'true'
        name: Optimize R2 assets
        run: npm run build:assets
      - if: steps.guard.outputs.enabled == 'true'
        name: Upload assets to R2
        run: node scripts/fast-upload-r2.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || '' }}
          R2_ASSET_DIR: optimized-assets
      - if: steps.guard.outputs.enabled == 'true'
        name: Deploy Pages
        run: npx wrangler pages deploy dist/ --project-name afarer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.guard.outputs.enabled == 'true'
        name: Deploy Workers
        run: npm run deploy:workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.guard.outputs.enabled == 'true'
        name: Audit contact worker secrets (names only)
        run: npx wrangler secret list -c workers/contact-worker/wrangler.toml || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
